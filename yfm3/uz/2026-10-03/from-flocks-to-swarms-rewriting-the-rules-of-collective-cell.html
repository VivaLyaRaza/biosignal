        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"161\" cy=\"163\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"659\" cy=\"200\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · SYNTHETIC BIOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Hujayralar yorugʻlik&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;algoritmlari yordamida toʻda&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;boʻlib harakatlanishga&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;oʻrgatildi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Qushlar qanday qilib osmonda toʻsatdan yoʻnalishni oʻzgartirib, bir-biriga urilmay uchadi? Murakkab jamoaviy tartib har doim alohida aʼzolarning oddiy aloqa qoidalariga asoslanadi. Yangi tadqiqotda olimlar kompyuter va tirik hujayralarni oʻzaro bogʻlovchi tizim yaratdilar. Kamera hujayralar harakatini kuzatadi, dastur esa yorugʻlik nurlari bilan ularning yoʻnalishini toʻgʻrilab, qushlar galasi kabi birdam harakatlanishni taʼminlaydi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Kompyuter koʻrishi va opto-PI3K yordamida hujayralar harakati real vaqtda boshqarildi&lt;/li&gt;\n&lt;li&gt;HL-60 leykotsitlari qushlar galasi kabi yaqin qoʻshnilariga qarab saf tortishga oʻrgatildi&lt;/li&gt;\n&lt;li&gt;Jamoaviy boshqaruv fMLP gradientiga qarab harakatlanish samarasini ikki baravar oshirdi&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Sintetik biologiyada hujayralararo aloqa qoidalarini qayta dasturlash odatda oylarga choʻziladigan genetik modifikatsiyalarni talab qiladi. Tadqiqotchilar bu muammoni bartaraf etish uchun kompyuter koʻrishi va yopiq zanjirli optogenetik boshqaruvga asoslangan «hujayra-mashina» interfeysini (cell-machine interface, CMI) ishlab chiqdilar. Tajribada neytrofillarga oʻxshash HL-60 hujayra liniyasidan foydalanildi; ularning harakat yoʻnalishi yorugʻlikka sezgir fosfoinozitid-3-kinaza (opto-PI3K) fermenti orqali boshqarildi.&lt;/p&gt;\n&lt;p&gt;Dasturiy taʼminot real vaqt rejimida qoʻshni hujayralar trayektoriyasini tahlil qilib, ularni qushlar galasi modeliga koʻra eng yaqin yettita qoʻshnisining oʻrtacha yoʻnalishiga moslashtirdi. Natijada odatda tarqoq harakatlanuvchi leykotsitlar oʻz-oʻzidan tartibga tushib, butun guruh boʻlib bir yoʻnalishda siljiy boshladi. Shuningdek, fotofaollashuvchi fMLP peptidi gradientida ushbu algoritm yordamida guruhning umumiy xemotaksis koʻrsatkichi nazorat guruhiga nisbatan ikki baravardan koʻproqqa oshdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot HL-60 hujayra modelida in vitro sharoitida bajarilgan va bioRxiv serveridagi ushbu preprint hali taqrizdan oʻtmagan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Qushlar va hasharotlarda kuzatiladigan kollektiv harakat guruhlarga alohida individlar uddalay olmaydigan vazifalarni bajarish imkonini beradi. Bunday xulq-atvor mahalliy oʻzaro taʼsirlar natijasida yuzaga keladi, biroq hujayra darajasida bu jarayonlarni tashkil etuvchi qoidalar eksperimental nazoratning qiyinligi sababli yetarlicha oʻrganilmagan. Ushbu ishda mualliflar real vaqt rejimida kollektiv migratsiya qoidalarini belgilash imkonini beruvchi «hujayra-mashina» interfeysini yaratdilar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Hujayra-mashina» interfeysi — bu tirik hujayralar xulq-atvorini yopiq konturda boshqarish uchun kompyuter koʻrish tizimi va optogenetikani (yorugʻlik yordamida hujayra faoliyatini boshqarish) birlashtiruvchi tizim.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tadqiqotchilar genetik modifikatsiyalangan yagona hujayra liniyasidan foydalandilar, unda hujayralararo oʻzaro taʼsir qoidalari dasturiy taʼminot orqali belgilandi va teskari aloqaga ega optogenetik boshqaruv orqali amalga oshirildi. Bu hujayralarga podalarga oʻz-oʻzidan tashkillanish, immun hujayralari toʻdasining oʻzaro taʼsir mantiqini takrorlovchi regenerativ signallarni tarqatish va alohida hujayralar aniqlay olmaydigan signal molekulalari gradientlarini kollektiv tarzda yengib oʻtish imkonini berdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Hujayralararo oddiy oʻzaro taʼsir qoidalarini oʻzgartirish tizimning alohida elementlari uchun imkonsiz boʻlgan yangi kollektiv qobiliyatlarni yaratishga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ish shuni koʻrsatadiki, oʻzaro taʼsirning asosiy tamoyillarini modifikatsiya qilish murakkab guruh funksiyalarining paydo boʻlishi uchun yetarlidir. Taklif etilgan yondashuv koʻp hujayrali tizimlarning muvofiqlashuv tamoyillarini oʻrganish va belgilangan xususiyatlarga ega sintetik kollektivlarni loyihalash uchun eksperimental baza yaratadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot in vitro hujayra liniyalarida oʻtkazilgan; natijalar xulq-atvorni boshqarishning fundamental imkoniyatini koʻrsatadi, ammo qoʻshimcha tekshiruvlarsiz murakkab organizmlarga toʻgʻridan-toʻgʻri tatbiq etilishi mumkin emas.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"kollektiv-migratsiya-va-sintetik-biologiya\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#kollektiv-migratsiya-va-sintetik-biologiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kollektiv migratsiya va sintetik biologiya&lt;/span&gt;&lt;/a&gt;Kollektiv migratsiya va sintetik biologiya&lt;/h4&gt;\n&lt;p&gt;Kollektiv migratsiya guruhlarga individual tarzda erishib boʻlmaydigan vazifalarni bajarish imkonini beradi. Bunga qushlarning yirtqichlardan qochish uchun harakatini muvofiqlashtirishi, chumolilarning oziq-ovqat izlash uchun feromon izlarini mustahkamlashi, shuningdek, immun hujayralarining migratsiyasi va jarohatlarning bitishi misol boʻla oladi. Kuzatuvlar, axborot tashuvchilarga taʼsir oʻtkazish va matematik modellashtirish orqali olimlar mahalliy oʻzaro taʼsirlar qanday qilib populyatsiya miqyosidagi harakatni keltirib chiqarishini oʻrganishgan. Biroq, turli tizimlar oʻrtasidagi umumiy tamoyillarni tushunish qiyinligicha qolmoqda. Mualliflar hujayralararo oʻzaro taʼsir qoidalarini sintetik qayta dasturlash orqali yangi yondashuvni taklif qilishdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mualliflar hujayralar migratsiyasini boshqarishning sintetik usulini ishlab chiqdilar, bunda biologik signallar dasturiy taʼminot bilan almashtiriladi, bu esa hujayralarni genetik qayta qurmasdan turib oʻzaro taʼsir mantiqini tezda oʻzgartirish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Sintetik biologiya tizim mantiqini noldan qurish orqali uni tushunishni tekshirishga imkon beradi. Ilgari bu yondashuv biologik ossilyatorlar, hujayra holatining oʻzgarishi va koʻp hujayrali tuzilmalarni shakllantirishni oʻrganishda qoʻllanilgan. Mualliflar kollektiv migratsiyani dasturlash mumkin boʻlgan jarayonga aylantirishni maqsad qilishdi. Anʼanaviy usullar har bir tajriba uchun yangi genetik konstruksiyalarni yaratishni talab qiladi, bu esa oylar davom etishi mumkin. Yangi yondashuv teskari aloqali optogenetik boshqaruvdan foydalanadi, bunda «kirish-chiqish» qoidalari dasturiy kod bilan belgilanadi, bu esa iteratsiyalar orasidagi vaqtni daqiqalargacha qisqartiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Optogenetika — yorugʻlik yordamida hujayralar faoliyatini boshqarish usuli boʻlib, unda yorugʻlikka sezgir oqsillar hujayra jarayonlarini faollashtiradi yoki susaytiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"boshqaruv-tizimi-arxitekturasi-cmi\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#boshqaruv-tizimi-arxitekturasi-cmi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Boshqaruv tizimi arxitekturasi (CMI)&lt;/span&gt;&lt;/a&gt;Boshqaruv tizimi arxitekturasi (CMI)&lt;/h4&gt;\n&lt;p&gt;Oʻzaro taʼsir qoidalarini qayta yozish uchun mualliflar CMI (Cell-Machine Interface) tizimini yaratdilar. U uchta komponentdan iborat: hujayra holatini oʻqish (kompyuter koʻrish tizimi), xulq-atvorni boshqarish (subhujayraviy optogenetika) va ular oʻrtasidagi kirish-chiqish munosabatini belgilovchi yopiq kontur (Rasm 1A). Tizim oʻtgan hujayra xatti-harakatlarini belgilangan algoritm boʻyicha kelgusi optogenetik stimulyatsiya bilan bogʻlaydi (Rasm 1B). Ijro mexanizmi sifatida fosfoinozitid-3-kinazaning (opto-PI3K) optogenetik faollashuvi qoʻllanildi (Rasm 1C, Rasm SN 1).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot hujayra modellarida oʻtkazilgan; boshqaruv tamoyillarini murakkab organizmlarga koʻchirish qoʻshimcha tekshiruvlarni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;CMI tizimi hujayralarga qushlar kabi toʻdalanish (Rasm 2, Rasm SN 2–4), navigatsiya vazifalarini birgalikda hal qilish (Rasm 3, Rasm SN 5) va neytrofillar kabi toʻda boʻlib harakat qilish (Rasm 4, Rasm SN 6–7) imkonini berdi. Birinchi sinov sifatida ikki hujayraning toʻqnashuvini dasturlash amalga oshirildi. Har bir hujayrani qoʻshnisining harakatiga perpendikulyar yoʻnaltiruvchi qoida hujayralarning tezligi va trayektoriyasini bir-biriga moslashtirishiga olib keldi (Rasm 1D, Rasm SN 1). Bu kollektiv xulq-atvor kompyuter interfeysi orqali amalga oshirilgan mahalliy qoidalar asosida yuzaga kelishi mumkinligini va hujayra xatti-harakati bilan boshqaruv algoritmi oʻrtasida oʻzaro bogʻliqlik borligini isbotlaydi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell-f2.jpg\" alt=\"2-rasm: Qushlar to‘dasining harakat qoidalari migratsiyadagi hujayralarning jamoaviy o‘zini o‘zi tashkil etishini belgil\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: Qushlar to‘dasining harakat qoidalari migratsiyadagi hujayralarning jamoaviy o‘zini o‘zi tashkil etishini belgilaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm: Qushlar to‘dasining harakat qoidalari migratsiyadagi hujayralarning jamoaviy o‘zini o‘zi tashkil etishini belgilaydi. Biz tirik hujayralarni qushlar to‘dasining klassik qoidalari asosida o‘zaro ta’sir qilish uchun qayta dasturlashga harakat qildik. A) Qushlar to‘dasining harakati individlar o‘z harakatini yetti nafar eng yaqin qo‘shnisi bilan moslashtirganda yuzaga keladi deb hisoblanadi. B) Ushbu qoidani CMI yordamida amalga oshirish odatda muvofiqlashtirilmagan neytrofilsimon HL-60 hujayralarining (chapda) to‘dalarga (o‘rtada, o‘ngda) o‘zini o‘zi tashkil etishiga olib keldi. C) 7 ta qo‘shnidan iborat to‘da uchun CMI qoidasi faollashguncha (uzuq chiziqdan chapda) va undan keyin simulyatsiya qilingan (qora chiziq) va eksperimental (havorang nuqtalar) populyatsiyalarning vaqt o‘tishi bilan o‘rtacha polyarizatsiyasi. D) Qushlar to‘dasining simulyatsiyalarida har bir individ o‘z harakatini o‘rtacha hisoblaydigan qo‘shnilar soni jamoaviy xulq-atvorni boshqaradigan asosiy parametrdir. Bu parametrni tirik qushlarda manipulyatsiya qilish qiyin, ammo CMI yordamida tirik hujayralarda tez va aniq o‘zgartirilishi mumkin, bu esa polyarizatsiyaning kutilgan miqdoriy o‘zgarishlariga olib keladi. B panelida trek segmentlari harakat burchagiga qarab rang bilan kodlangan, masshtab chizig‘i — 100 mkm, barcha tasvirlar bir xil masshtabda. Kulrang strelkalar C panelidagi tegishli vaqt nuqtalariga ishora qiladi. C dagi xatoliklar simulyatsiya natijalari bo‘yicha umumiy polyarizatsiyaning o‘rtacha standart xatosini (SEM) ifodalaydi, shtrixlangan hudud — burchak tezligi parametrining bir standart og‘ishiga (+/-) teng simulyatsiya (usul tafsilotlariga qarang).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell-f3.jpg\" alt=\"3-rasm: Global muvofiqlashtirish jamoaviy xemotaktik yo‘nalishni kuchaytiradi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm: Global muvofiqlashtirish jamoaviy xemotaktik yo‘nalishni kuchaytiradi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-rasm: Global muvofiqlashtirish jamoaviy xemotaktik yo‘nalishni kuchaytiradi. Keyinchalik biz muvofiqlashtirish hujayra jamoalariga real biologik muammolarni hal qilish imkonini beradimi yoki yo‘qligini tekshirdik. A) HL-60 hujayralari xemotaktik gradientlarni sezadi va ularga sezilarli ko‘p hujayrali muvofiqlashtirishsiz alohida individlar kabi javob beradi (yuqori panel). Biz hujayralarni populyatsiyaning o‘rtacha harakat vektoriga yo‘naltirish uchun global muvofiqlashtirish qoidasini kiritdik (pastki panel). B) Gradientlarni alohida individlar kabi talqin qiladigan hujayralar faqat manba yaqinida xemotraktantlar bo‘yicha tekislanishi mumkin (yuqori panel). Biz sintetik tarzda muvofiqlashtirilgan hujayralar o‘z sezgirlik diapazonini kengaytiradi deb taxmin qildik (pastki panel). C) CMI orqali harakatni global muvofiqlashtirish (pastda) ushbu muvofiqlashtirishga ega bo‘lmagan hujayralarga nisbatan gradientni yaxshiroq idrok etishni ta’minlaydi (tepada); har ikki hujayra guruhi bir xil ko‘rish maydonida, ammo CMI faqat pastki hujayralarda faollashtirilgan. D) Uchta biologik takrorlash bo‘yicha vaqt o‘tishi bilan o‘rtacha xemotaktik indeks +/- SEM. Vertikal chiziqlar mos ravishda xemotaktik gradient va CMI qoidasining boshlanishini bildiradi. CMI yordamida hujayralarning global muvofiqlashuvi populyatsiya uchun gradientni idrok etishni sezilarli darajada yaxshilaydi. E) Xemotaktik gradientning chap chetidan masofaga qarab o‘rtacha xemotaktik indeks. CMI xemotraktant manbasiga yaqin va uzoq joyda gradient bo‘yicha yuqori tekislanishga olib keldi, CMI bo‘lmagan hujayralar esa manbadan uzoqda zaif tekislanishga ega edi. Ma’lumotlar D dagi plato bo‘yicha (45-60 daqiqa) 3 ta biologik takrorlash bo‘yicha +/- SEM bilan guruhlangan. C dagi masshtab chizig‘i — 500 mkm.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell-f4.jpg\" alt=\"4-rasm: Sintetik signal relelari uzoq masofalarda jalb qilishni kuchaytirish uchun yo‘naltiruvchi ma’lumotlarni tarqatad\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm: Sintetik signal relelari uzoq masofalarda jalb qilishni kuchaytirish uchun yo‘naltiruvchi ma’lumotlarni tarqatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-rasm: Sintetik signal relelari uzoq masofalarda jalb qilishni kuchaytirish uchun yo‘naltiruvchi ma’lumotlarni tarqatadi. Bizning oldingi tajribamizda (3-rasm) hujayralar global miqyosda muvofiqlashgan edi. Bu yerda biz neytrofillar to‘dalanishi qoidalaridan ilhomlangan mahalliyroq muvofiqlashtirishni sinab ko‘ramiz. A) Neytrofillar to‘dalanishi paytida shikastlanish va infeksiya joylariga yetib kelgan kashshof hujayralar ikkilamchi xemotraktantni chiqarish orqali qo‘shimcha hujayralarni jalb qiladi. Bu signal yaqin atrofdagi hujayralarni o‘ziga tortadi va ularni o‘zlari ham xemotraktant ajratishga undaydi, bu esa tez tarqaladigan o‘z-o‘zini kuchaytiruvchi signal releini hosil qiladi. B) Biz tirik hujayralarda virtual xemotaksis va rele qoidalarini amalga oshirish uchun CMI dan foydalandik. Kompyuter virtual xemotraktantning ishlab chiqarilishi va diffuziyasini simulyatsiya qiladi, tirik hujayralar esa CMI boshqaradigan migratsiya orqali yuzaga keladigan gradientlarni sezadi va ularga javob beradi. Yetarli miqdordagi virtual xemotraktant ta’siriga uchragan hujayralar ikkilamchi manbalarga aylanib, regenerativ rele hosil qiladi. C) Faqat xemotaksis qoidasidan foydalanadigan hujayralar (tepada) bilan solishtirganda, rele qoidasi bilan ham dasturlangan populyatsiyalar (pastda) virtual xemotraktant to‘lqinini butun ko‘rish maydoni bo‘ylab tarqatdi. D) Rele hujayralarning maqsadga jalb qilinishini sezilarli darajada kuchaytirdi. E) Yo‘naltiruvchi ma’lumotlar hujayradan hujayraga uzatilganligi sababli, bu tabiiy neytrofil to‘dalarida kuzatilganidek, hujayralarning maqsad bo‘yicha tekislanish to‘lqinining tarqalishiga olib keladi (uzuq strelka, o‘ngda). Rele bo‘lmagan hujayralar faqat maqsad yaqinida tekislanadi. C dagi masshtab chizig‘i — 200 mkm, tasvirlar taxminan 8, 16 va 30-daqiqalarga to‘g‘ri keladi. D da shtrixlangan hudud uchta texnik takrorlash bo‘yicha boshlang‘ich zichlikdan o‘rtacha o‘zgarish +/- SEM. Student t-testi: p=0,03.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"hujayralarning-jamoaviy-xulq-atvorini-dasturlash\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#hujayralarning-jamoaviy-xulq-atvorini-dasturlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hujayralarning jamoaviy xulq-atvorini dasturlash&lt;/span&gt;&lt;/a&gt;Hujayralarning jamoaviy xulq-atvorini dasturlash&lt;/h4&gt;\n&lt;p&gt;Tadqiqotchilar qushlar galasining xulq-atvor qoidalarini HL60 neytrofilsimon hujayralariga tatbiq etishdi. Tabiatda qushlar o‘z harakatini yetti nafar eng yaqin qo‘shnisiga moslashtiradi. HL60 hujayralari ko‘ra olmagani uchun olimlar mikroskop va kompyuter yordamida qo‘shnilar harakatini kuzatuvchi va optogenetik PI3K faollashuvi orqali hujayra harakatini yo‘naltiruvchi kompyuter interfeysidan (CMI) foydalanishdi (Rasm 2A). Tashqi boshqaruvsiz HL60 hujayralari tartibsiz harakatlanadi (Rasm 2B-C, chapda). Yetti qo‘shni qoidasi joriy etilganda, hujayralar o‘z-o‘zidan gala hosil qilib, birgalikda yo‘nalishni o‘zgartira boshladi (Rasm 2B-C, markaz-o‘ngda), bu esa populyatsiya polyarizatsiyasining ortishiga olib keldi (Rasm 2C).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Yetti qo‘shni» algoritmidan foydalanish HL60 hujayralariga gala xulq-atvorini taqlid qilish va populyatsiya polyarizatsiyasini sezilarli darajada oshirish imkonini berdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CMI (Cell-Machine Interface) — hujayralar xulq-atvorini real vaqt rejimida boshqarish uchun mikroskopiya, kompyuter kuzatuvi va optogenetikani birlashtiruvchi tizim.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot in vitro HL60 hujayra liniyasida o‘tkazilgan; bu mexanizmlarning tirik organizmlarga ko‘chirilishi qo‘shimcha tekshiruvlarni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"modellashtirish-va-ozaro-tasir-parametrlarini-sozlash\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#modellashtirish-va-ozaro-tasir-parametrlarini-sozlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Modellashtirish va o‘zaro ta’sir parametrlarini sozlash&lt;/span&gt;&lt;/a&gt;Modellashtirish va o‘zaro ta’sir parametrlarini sozlash&lt;/h4&gt;\n&lt;p&gt;O‘zaro ta’sirning jamoaviy xulq-atvorga ta’sirini tekshirish uchun mualliflar HL60 migratsiya tezligi, rotatsion diffuziya va optogenetik boshqaruvga javob parametrlariga moslashtirilgan agentga asoslangan model yaratishdi. Model qo‘shnilar sonining ikkitagacha kamayishi polyarizatsiyani pasaytirishi, o‘ntagacha ortishi esa uni kuchaytirishini bashorat qildi (Rasm 2D). Tirik hujayralardagi tajribalar ushbu bashoratlarni tasdiqladi (Rasm 2D, Rasm SN). Ushbu yondashuv biologik tizimni o‘zgartirmasdan, dasturiy ta’minot orqali o‘zaro ta’sir parametrlarini moslashuvchan o‘zgartirish va nazariy modellarni real hujayralar xulq-atvori bilan solishtirish imkonini beradi.&lt;/p&gt;\n&lt;h4 id=\"jamoaviy-xemotaksis-va-navigatsiya\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#jamoaviy-xemotaksis-va-navigatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Jamoaviy xemotaksis va navigatsiya&lt;/span&gt;&lt;/a&gt;Jamoaviy xemotaksis va navigatsiya&lt;/h4&gt;\n&lt;p&gt;Olimlar hujayralar jamoasi navigatsiya vazifalarini yakka tartibdagi hujayralarga qaraganda samaraliroq hal qila olishini tekshirishdi. Odatda HL60 hujayralari fMLP peptidi gradientiga faqat manba yaqinida javob beradi. Ushbu cheklovni yengish uchun CMI tizimi joriy etildi, bunda har bir hujayra o‘z harakatini butun populyatsiyaning o‘rtacha vektoriga moslashtiradi (Rasm 3A). Bu gradient ta’sirida bo‘lgan hujayralarga yo‘nalish haqidagi ma’lumotni qolganlarga uzatish imkonini beradi (Rasm 3B). Fotoaktivlanuvchi fMLP analogi yordamida gradient yaratilganda, CMI faollashtirilgan populyatsiyalar nazorat guruhiga nisbatan sezilarli darajada yuqori xemotaksis indeksini ko‘rsatdi (Rasm 3C-D). Tajriba yakunida CMI guruhidagi xemotaksis indeksi nazorat guruhidagidan ikki barobar yuqori bo‘ldi va fMLP manbasidan uzoqda ham yuqori darajada qoldi (Rasm 3E).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CMI orqali muvofiqlashtirish hujayralarga fMLP gradienti bo‘ylab samarali harakatlanish imkonini berdi, xemotaksis indeksi nazorat darajasidan 2 barobar yuqori bo‘ldi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"hujayralar-jamoalarida-kimyoviy-signalizatsiyani-modellashtirish\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#hujayralar-jamoalarida-kimyoviy-signalizatsiyani-modellashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hujayralar jamoalarida kimyoviy signalizatsiyani modellashtirish&lt;/span&gt;&lt;/a&gt;Hujayralar jamoalarida kimyoviy signalizatsiyani modellashtirish&lt;/h4&gt;\n&lt;p&gt;Oldingi tajribalarda (Rasm 3) harakat yoʻnalishi haqidagi maʼlumot butun populyatsiyaga bir zumda uzatilgan edi. Tabiiy sharoitda hujayralararo aloqa makon va vaqt bilan cheklangan, masalan, signal molekulalarining diffuziyasi orqali. Neytrofillar toʻdalanishida (swarming) shikastlangan joyga yetib borgan birinchi hujayralar LTB4 lipidini ajratadi. Bu ligand nafaqat boshqa hujayralarni jalb qiladi, balki ularni ham LTB4 ishlab chiqarishga undaydi va oʻz-oʻzini kuchaytiruvchi rele toʻlqinini hosil qiladi (Rasm 4A). Biz foydalanayotgan HL60 hujayralari odatda toʻdalanish xususiyatiga ega emas, shuning uchun biz ularni kompyuter vositasidagi oʻzaro taʼsir (CMI) orqali qayta dasturlashga harakat qildik. Tizim real vaqt rejimida virtual signal molekulalarining diffuziyasini hisoblaydi, optogenetik stimulyatsiya esa hujayralarni gradient boʻylab harakatlanishga majbur qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CMI (computer-mediated interaction) — kompyuter hujayralar xatti-harakatini kuzatib, optogenetika yordamida ularning migratsiyasini boshqaradigan va sunʼiy muhit yaratadigan usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Avval biz hujayralarga virtual xemotraktant gradienti boʻylab yuqoriga harakatlanish imkonini beruvchi CMI qoidasini joriy qildik. Tizim har bir hujayra uchun lokal gradientni hisoblaydi va migratsiyani boshqarish uchun opto-PI3Kdan foydalanadi (Rasm 4B). Doimiy virtual signal manbai mavjud boʻlganda, HL60 hujayralari haqiqiy kimyoviy modda boʻlmasa ham, manba atrofida toʻplana boshladi (Rasm 4C, 4D, Rasm SN 6). Biroq, yoʻnaltirilgan harakat faqat manbaga yaqin boʻlgan hujayralarda kuzatildi (Rasm 4E chapda).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Bazaviy xemotaksis modeli hujayralarning manba atrofida toʻplanishiga imkon berdi, ammo taʼsir radiusi cheklangan edi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Molekulyar releni takrorlash uchun biz ikkinchi qoidani qoʻshdik: agar lokal virtual xemotraktant konsentratsiyasi belgilangan chegaradan oshsa, hujayra virtual xemotraktant manbaiga aylanadi (Rasm 4B). Bu tirik hujayralar nafaqat signalni sezadigan, balki uni qayta uzatadigan tizimni yaratishga imkon berdi.&lt;/p&gt;\n&lt;p&gt;Tekshirish uchun biz sof xemotaksisni rele qoidasi bilan solishtirdik. Releni joriy etish birlamchi manba atrofida hujayralar toʻplanishini sezilarli darajada oshirdi (Rasm 4C, 4D, Rasm SN 7). Birlamchi signalni aniqlagan birinchi hujayralar ikkilamchi manbalarga aylanib, butun koʻrish maydoni boʻylab tarqaladigan virtual signal toʻlqinini boshlab berdi (Rasm 4C-D, Rasm SN 7). Bu toʻlqin hujayralarning manba tomon yoʻnaltirilgan harakati bilan birga kechdi (Rasm 4E oʻngda), bu esa birlamchi signal taʼsir doirasidan tashqaridagi hujayralarni ham jalb qilishga imkon berdi. Relesiz populyatsiyalarda bunday effektlar kuzatilmadi (Rasm 4C, 4D, 4E).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot HL60 hujayra liniyasida sunʼiy optogenetik tizim yordamida oʻtkazilgan; bu mexanizmlarning tirik organizmlarga tatbiqi qoʻshimcha dalillarni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;h4 id=\"jamoaviy-xulq-atvorning-yangi-shakllari\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#jamoaviy-xulq-atvorning-yangi-shakllari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Jamoaviy xulq-atvorning yangi shakllari&lt;/span&gt;&lt;/a&gt;Jamoaviy xulq-atvorning yangi shakllari&lt;/h4&gt;\n&lt;p&gt;Bizning tadqiqotimiz shuni koʻrsatadiki, hujayralararo oʻzaro taʼsirning oddiy qoidalarini oʻzgartirish jamoaviy tashkilotning yangi shakllarini va yolgʻiz hujayralarda kuzatilmaydigan qobiliyatlarni yaratish uchun yetarlidir. Biz qushlar toʻdasi va neytrofillar toʻplanishi kabi turli tizimlardan olingan qoidalarni yagona hujayrali platformada joriy qildik. Bu shuni koʻrsatdiki, jamoaviy xulq-atvorning asosiy xususiyatlari biologik mexanizmlarga emas, balki mahalliy oʻzaro taʼsir mantiqiga bogʻliq.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mahalliy oʻzaro taʼsir mantigʻi hujayralarning jamoaviy qobiliyatlarini belgilaydi va ularga murakkab biologik tizimlarni taqlid qilish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Hujayralararo oʻzaro taʼsir hujayralarning atrof-muhit signallariga javob berish masofasini kengaytiradi. Biz koordinatsiyaning ikkita strategiyasini namoyish etdik: maʼlumotni butun populyatsiya boʻylab tarqatish va hujayradan hujayraga uzatish. Birinchi holda, chemoattraktant manbasidan uzoqda joylashgan hujayralar manba yaqinidagi hujayralardan maʼlumot oladi. Ikkinchi holda, maʼlumot mahalliy kontaktlar orqali bosqichma-bosqich tarqaladi. Ushbu oʻzaro taʼsir arxitekturasi signallarning tarqalish usullarini va jamoaning rivojlanayotgan xususiyatlarini belgilaydi.&lt;/p&gt;\n&lt;h4 id=\"hujayra-mashina-interfeysi-tadqiqot-vositasi-sifatida\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#hujayra-mashina-interfeysi-tadqiqot-vositasi-sifatida\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;«Hujayra-mashina» interfeysi tadqiqot vositasi sifatida&lt;/span&gt;&lt;/a&gt;«Hujayra-mashina» interfeysi tadqiqot vositasi sifatida&lt;/h4&gt;\n&lt;p&gt;«Hujayra-mashina» interfeysi (CMI) ushbu qoidalarni eksperimental oʻrganish uchun kuchli platformadir. Oʻzaro taʼsir qoidalari dasturiy taʼminotda belgilanib, tirik hujayralar tomonidan bajarilganligi sababli, CMI anʼanaviy molekulyar usullar bilan amalga oshirish qiyin boʻlgan modellarni, masalan, qoʻshnilarning harakatini kuzatishni amalga oshirishga imkon beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CMI — bu dasturiy boshqaruv va tirik hujayralarni birlashtiruvchi tizim boʻlib, unda hujayralarning xulq-atvor qoidalari algoritmlar orqali belgilanadi va yorugʻlikka sezgir mexanizmlar yordamida bajariladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ushbu ish jamoaviy migratsiyaga qaratilgan; ushbu tamoyillarning boshqa biologik jarayonlarga tatbiq etilishi qoʻshimcha tadqiqotlarni talab qiladi va isbotlanmagan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Dasturiy boshqaruv hujayra tizimini oʻzgarishsiz qoldirgan holda oʻzaro taʼsir qoidalarini tez va aniq oʻzgartirish imkonini beradi. Bu nazariy modellar va eksperimentlar, shuningdek, tabiiy va sintetik koordinatsiya usullari oʻrtasida toʻgʻridan-toʻgʻri koʻprik yaratadi. Hozirgi tadqiqot migratsiyaga qaratilgan boʻlsa-da, taklif etilgan yondashuv hujayra holatini mikroskopiya orqali oʻlchash va yorugʻlik bilan boshqariladigan aktuatorlar orqali nazorat qilish mumkin boʻlgan har qanday jarayonlarga tatbiq etilishi mumkin. Mahalliy qoidalarning dasturlashtirilishi koʻp hujayrali tashkilotlar maydonini oʻrganish imkonini beradi, bu esa ham tabiiy jamoalar tamoyillarini tushunishga, ham tabiatda uchramaydigan yangi xulq-atvor shakllarini loyihalashga yordam beradi.&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"hujayralarni-kultivatsiya-qilish\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#hujayralarni-kultivatsiya-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hujayralarni kultivatsiya qilish&lt;/span&gt;&lt;/a&gt;Hujayralarni kultivatsiya qilish&lt;/h4&gt;\n&lt;p&gt;Ishda Genri Born laboratoriyasidan olingan va STR-profiling orqali tekshirilgan HL-60 hujayra liniyasi ishlatildi. Optogenetik liniya yorug‘likka sezgir AsLov2-SsrA-mTagBFP2-CAAX oqsilini, uning PI3K bilan bog‘lanuvchi hamkori (ISH2-EGFP-SspBMicro) va HaloTag-CAAX konstruksiyasini ekspressiya qiladi. Differensiyalanmagan hujayralar 25 mM HEPES va 10% issiqlik bilan inaktivatsiyalangan fetal sigir zardobi (FBS) qo‘shilgan RPMI 1640 muhitida o‘stirildi. Hujayralar 37°C va 5% CO₂ sharoitida, 0,2–1,0 mln/ml zichlikda saqlandi va har 2–3 kunda subkultivatsiya qilindi. Neytrofilsimon harakatchan hujayralarni olish uchun 1 mln hujayra 1,4% DMSO qo‘shilgan 5 ml muhitda 4–5 kun davomida inkubatsiya qilindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HL-60 — inson promielotsitar leykemiya liniyasi bo‘lib, DMSO kabi moddalar ta’sirida neytrofillarga xos morfologiya va funksiyalarga ega hujayralarga differensiyalanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"mikroskopiya-uchun-hujayralarni-tayyorlash\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#mikroskopiya-uchun-hujayralarni-tayyorlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mikroskopiya uchun hujayralarni tayyorlash&lt;/span&gt;&lt;/a&gt;Mikroskopiya uchun hujayralarni tayyorlash&lt;/h4&gt;\n&lt;p&gt;Hujayralar past erish haroratiga ega agaroz qatlami va 96-chuqurchali planshet oynasi orasida tasvirga olindi. Plazmatik membrana HaloTag-CAAX bilan konjugatsiyalangan JaneliaFluor JFX549 bo‘yog‘i, yadrolar (Rasm 2–4) esa Spy650-DNA yordamida belgilandi. Hujayralar 200 rcf tezlikda 10 daqiqa sentrifugalandi, 1 mkM JFX549 va Spy650-DNA (ishlab chiqaruvchi tavsiya qilganidan 2 barobar yuqori konsentratsiyada) bo‘lgan RPMI muhitida resuspendirlandi va 37°C da 1 soat inkubatsiya qilindi. Yuvilgandan so‘ng hujayralar 2% FBS bo‘lgan muhitga o‘tkazildi. Shisha yuzalar 5% Hellmanex III eritmasida ultratovush yordamida tozalandi, yuvildi, quritildi va plazma bilan ishlandi. Chuqurchalar 2% sigir zardobi albumini bilan qoplandi. 0,9% li agaroz yostiqchalari 2% FBS qo‘shilgan RPMI 1640 muhitida tayyorlandi. Hujayralar 10 daqiqa davomida cho‘kishi uchun qoldirildi, so‘ngra agaroz yostiqchalari bilan yopildi. fMLP gradientlari bo‘lmagan tajribalarda (Rasm 3) migratsiyani bir xil stimulyatsiya qilish uchun agarozaga 10 nM fMLP qo‘shildi.&lt;/p&gt;\n&lt;h4 id=\"mikroskopiya-uskunalari\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#mikroskopiya-uskunalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mikroskopiya uskunalari&lt;/span&gt;&lt;/a&gt;Mikroskopiya uskunalari&lt;/h4&gt;\n&lt;p&gt;Rasm 1 dagi tajribalar Borealis nur shakllantirish bloki, CSU-W1 spinning-disk, iXon Ultra EMCCD kamerasi va lazer moduli (405, 488, 561, 638 nm) bilan jihozlangan Nikon Eclipse Ti invertirlangan mikroskopida o‘tkazildi. Nikon 20x NA 0,75 (Rasm 1A) va 40x NA 0,95 (Rasm 1B) obyektivlari ishlatildi. Optogenetik stimulyatsiya 470 nm LED va DMD moduli orqali amalga oshirildi. Boshqa tajribalar Nikon Ti2 tizimida, CrestOptics X-Light V3 spinning-disk, Lumencor Celesta yorug‘lik manbai, Nikon 10x CFI Plan Apo Lambda obyektivi, Photometrics Kinetix sCMOS kamerasi va 365/488 nm LEDli Mightex Polygon1000 DMD tizimida bajarildi. Uskunalar μManager yoki Pycro-Manager dasturlari va CyborgScope platformasi orqali boshqarildi.&lt;/p&gt;\n&lt;h4 id=\"xemotaktik-gradientlarni-yaratish\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#xemotaktik-gradientlarni-yaratish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xemotaktik gradientlarni yaratish&lt;/span&gt;&lt;/a&gt;Xemotaktik gradientlarni yaratish&lt;/h4&gt;\n&lt;p&gt;fMLP gradientlari bilan o‘tkazilgan tajribalar (Rasm 3) uchun agaroz yostiqchalariga 500 nM Nv-fMLP qo‘shildi. Bu fMLP hosilasi UV nurlanish ta’sirida himoya guruhi olib tashlanmaguncha hujayralar uchun nofaol hisoblanadi. Fazoviy gradient DMD moduli yordamida UV naqshlarini optogenetik stimulyatsiya uchun ko‘k yorug‘lik bilan almashlab qo‘llash orqali yaratildi.&lt;/p&gt;\n&lt;h4 id=\"hujayra-mashina-interfeysi-cmi-platformasi\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#hujayra-mashina-interfeysi-cmi-platformasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hujayra-mashina interfeysi (CMI) platformasi&lt;/span&gt;&lt;/a&gt;Hujayra-mashina interfeysi (CMI) platformasi&lt;/h4&gt;\n&lt;p&gt;CyborgScope platformasi Pycro-Manager va μManager ochiq kodli dasturiy ta'minotlariga asoslangan. Tizim Python skriptlari yordamida mikroskopni yopiq teskari aloqa rejimida boshqarish imkonini beradi. Ish sikli tasvirga olish, hujayra holatini tahlil qilish va biologik qoidalarga muvofiq mikroskop uskunalarini (shu jumladan yorug‘lik stimullarini) sozlashdan iborat. Barcha metadata va stimul parametrlar avtomatik saqlanadi. Napari asosidagi interfeys real vaqt rejimida tasvirlarni ko‘rish va qo‘lda boshqarish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Yopiq teskari aloqa (closed-loop control) — bu tizimning real vaqtda olingan ma'lumotlar asosida ob'ekt holatini saqlab qolish uchun o‘z harakatlarini avtomatik ravishda tuzatishi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tasvir-segmentatsiyasi,-treking-va-optogenetik-stimulatsiya\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#tasvir-segmentatsiyasi,-treking-va-optogenetik-stimulatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tasvir segmentatsiyasi, treking va optogenetik stimulatsiya&lt;/span&gt;&lt;/a&gt;Tasvir segmentatsiyasi, treking va optogenetik stimulatsiya&lt;/h4&gt;\n&lt;p&gt;Hujayralarni aniqlash uchun JFX549 bilan konjugatsiyalangan HaloTag-CAAX signalidan foydalanildi. Tasvirlarni qayta ishlash (tekislash, chegaraviy qiymatlarni belgilash, shovqinlarni tozalash) scikit-image kutubxonasi yordamida amalga oshirildi. Membrana signalining markazlarini kuzatish trackpy kutubxonasi orqali bajarildi. Harakatni boshqarish uchun yorug‘lik nuqtalari hujayra qirralariga yo‘naltirildi, bunda har bir kadr uchun burilish burchagi hujayraning joriy harakat vektori bilan cheklandi.&lt;/p&gt;\n&lt;h4 id=\"cmi-hujayralar-toqnashuvi-algoritmi\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#cmi-hujayralar-toqnashuvi-algoritmi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CMI hujayralar to‘qnashuvi algoritmi&lt;/span&gt;&lt;/a&gt;CMI hujayralar to‘qnashuvi algoritmi&lt;/h4&gt;\n&lt;p&gt;Boshqaruv tartibi (Rasm 1D) crash_test_acquisition.py skriptida amalga oshirilgan. Tizim eng yaqin ikki hujayrani tanlaydi va θ = 90^° burchak ostida to‘qnashuvni keltirib chiqaradigan nuqtalarni hisoblaydi. Tanlov vektorlarning skalyar ko‘paytmasi asosida amalga oshiriladi. Hisob-kitoblar har bir kadrda yangilanadi, bu hujayra tezligi va traektoriyasidagi o‘zgarishlarga moslashish imkonini beradi.&lt;/p&gt;\n&lt;h4 id=\"cmi-hujayralar-toda-bolib-harakatlanish-algoritmi\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#cmi-hujayralar-toda-bolib-harakatlanish-algoritmi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CMI hujayralar to‘da bo‘lib harakatlanish algoritmi&lt;/span&gt;&lt;/a&gt;CMI hujayralar to‘da bo‘lib harakatlanish algoritmi&lt;/h4&gt;\n&lt;p&gt;Boshqaruv tartibi (Rasm 2) cyborg_flock_acquisition.py faylida keltirilgan. n ta eng yaqin qo‘shnilarni topish uchun SciPy kutubxonasidan KDTree algoritmi ishlatiladi. Qo‘shnilarning o‘rtacha yo‘nalish burchagi hujayraga optogenetik ta'sir ko‘rsatish yo‘nalishini belgilaydi.&lt;/p&gt;\n&lt;h4 id=\"hl-60-hujayralarini-modellashtirish\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#hl-60-hujayralarini-modellashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HL-60 hujayralarini modellashtirish&lt;/span&gt;&lt;/a&gt;HL-60 hujayralarini modellashtirish&lt;/h4&gt;\n&lt;p&gt;To‘da bo‘lib harakatlanish simulyatsiyasi ikki o‘lchovli fazoda davriy chegaraviy shartlarga ega faol broun zarrachalari modeli asosida qurilgan. Zarrachalar doimiy tezlikda harakatlanadi va Gauss shovqini bilan rotatsion diffuziyani boshdan kechiradi. Boshqaruv signali maksimal burilish tezligi bilan cheklangan. Topologik tekislash nazorat zonasidagi n ta eng yaqin qo‘shni vektorlarining yig‘indisi sifatida hisoblanadi.&lt;/p&gt;\n&lt;h4 id=\"harakat-parametrlarini-aniqlash-va-jamoaviy-navigatsiya-algoritmi\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#harakat-parametrlarini-aniqlash-va-jamoaviy-navigatsiya-algoritmi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Harakat parametrlarini aniqlash va jamoaviy navigatsiya algoritmi&lt;/span&gt;&lt;/a&gt;Harakat parametrlarini aniqlash va jamoaviy navigatsiya algoritmi&lt;/h4&gt;\n&lt;p&gt;Elementar faol zarrachalarning xossalari, jumladan, rotatsion diffuziya va tezlik, optogenetik boshqaruvsiz HL-60 hujayralarining oʻrtacha kvadratik siljishlarini approksimatsiya qilish orqali aniqlandi. Hujayralarning maksimal burilish tezligi oldingi tadqiqotlardan olindi. Jamoaviy navigatsiya (CMI) algoritmi teskari aloqa protsedurasi orqali amalga oshiriladi, bunda fMLP gradientini hosil qiluvchi UV-foto stimulyatsiya koʻrsatmalari harakatni boshqarish uchun koʻk yorugʻlik bilan almashinib turadi. CMI hududidagi barcha hujayralarning oʻrtacha harakat burchagi har bir hujayraning yoʻnalishini toʻgʻrilash uchun ishlatiladi. CMI zonasidan tashqaridagi hujayralar gradientni jamoaviy idrok etishda qatnashmaydi.&lt;/p&gt;\n&lt;h4 id=\"virtual-kimyoviy-signallar-va-retranslyatsiyani-modellashtirish\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#virtual-kimyoviy-signallar-va-retranslyatsiyani-modellashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Virtual kimyoviy signallar va retranslyatsiyani modellashtirish&lt;/span&gt;&lt;/a&gt;Virtual kimyoviy signallar va retranslyatsiyani modellashtirish&lt;/h4&gt;\n&lt;p&gt;Virtual kimyoviy signal dinamikasi diffuziya koeffitsienti, degradatsiya tezligi va sekretsiya zichligini hisobga oluvchi ikki oʻlchovli reaksiya-diffuziya tenglamasi bilan tavsiflanadi. Real vaqt rejimida ishlash uchun diffuziya hadi Eylerning yashirin sxemasi yordamida integratsiya qilinadi, tenglama esa siyrak panjarada yechilib, keyinchalik chiziqli interpolyatsiya qilinadi. Har bir hujayra oʻz niqobi boʻyicha konsentratsiyani oʻrtacha hisoblash orqali mahalliy signalni sezadi. Harakat yoʻnalishi hujayraning massa markazidan signal intensivligining ogʻirlik markazigacha boʻlgan vektor bilan belgilanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Reaksiya-diffuziya usuli — moddaning fazoda tarqalishi va bir vaqtning oʻzida parchalanishi yoki ishlab chiqarilishining matematik tavsifi boʻlib, u kimyoviy gradientlarni modellashtirish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Xemotaksis tajribalarida (Rasm 4) tashqi manba 25×25 piksel (17×17 mkm) maydonga virtual modda qoʻshadi. Retranslyatsiya tajribalarida hujayralarning oʻzi signal manbaiga aylanadi: th faollashuv chegarasidan oshib ketganda va hujayra 2,5 pikseldan (1,7 mkm) ortiq siljiganda, u retranslyator holatiga oʻtadi. Tajriba parametrlari: diffuziya tezligi 125 mkm/s, sekretsiya tezligi 0,03 nМ/s, aniqlash chegarasi 0,01 nМ va faollashuv chegarasi 0,05 nМ. Retranslyatsiyasiz signal 160 mkm masofada soʻnadi, retranslyatsiya bilan esa faollashuv fronti ~1 mm ga yetadi (Rasm 4).&lt;/p&gt;\n&lt;h4 id=\"tasvirlarni-tahlil-qilish-va-statistik-korsatkichlar\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#tasvirlarni-tahlil-qilish-va-statistik-korsatkichlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tasvirlarni tahlil qilish va statistik koʻrsatkichlar&lt;/span&gt;&lt;/a&gt;Tasvirlarni tahlil qilish va statistik koʻrsatkichlar&lt;/h4&gt;\n&lt;p&gt;Hujayralarni kuzatish uchun yadrolarning joylashuvi ishlatildi, bu toʻqnashuvlarda aniqlikni oshiradi. Yadrolar Gauss Laplas filtri yordamida aniqlandi. Populyatsiya polyarizatsiyasi barcha zarrachalarning oʻrtacha yoʻnalish vektori moduli sifatida hisoblanadi. C(r) funksiyasi orqali hisoblanadigan korrelyatsiya uzunligi guruhdagi hujayralar harakatining muvofiqlik darajasini tavsiflaydi.&lt;/p&gt;\n&lt;h4 id=\"korrelyatsiya-funksiyasi-va-korrelyatsiya-uzunligini-hisoblash\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#korrelyatsiya-funksiyasi-va-korrelyatsiya-uzunligini-hisoblash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Korrelyatsiya funksiyasi va korrelyatsiya uzunligini hisoblash&lt;/span&gt;&lt;/a&gt;Korrelyatsiya funksiyasi va korrelyatsiya uzunligini hisoblash&lt;/h4&gt;\n&lt;p&gt;Maxsus korrelyatsiya masofasini aniqlash uchun mualliflar logarifmik binning (maʼlumotlarni guruhlash) usulidan foydalangan holda C(R) funksiyasini hisoblaydilar. Tezlik fluktuatsiyalari tahlil qilingani sababli, yetarlicha katta masofalarda korrelyatsiya funksiyasi manfiy qiymatlarni qabul qilishi kutiladi. Darajali qonun (power law) yordamida tezlik fluktuatsiyalaridagi korrelyatsiya nolga tenglashadigan masofa aniqlanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Logarifmik binning — bu maʼlumotlarni guruhlash usuli boʻlib, unda intervallar logarifmik shkala boʻyicha oʻsib boradi, bu esa bir necha kattalik tartibini qamrab oluvchi maʼlumotlarni samarali tahlil qilish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;C(r) funksiyasini moslashtirish uchun yetarli statistikani toʻplash koʻpincha bitta simulyatsiya yoki eksperimental vaqt nuqtasidagi maʼlumotlar hajmidan oshib ketadi. Eksperimental maʼlumotlarni birlashtirish uchun barqaror holatda toʻplangan barcha C(r) nuqtalari birlashtiriladi, guruhlanadi va birgalikda tahlil qilinadi. Bu yondashuv katta hajmdagi C(r) maʼlumotlar toʻplami uchun xos boʻlgan n² masshtablanish murakkabligini kamaytirishga yordam beradi.&lt;/p&gt;\n&lt;h4 id=\"jamoaviy-harakat-metrikalari\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#jamoaviy-harakat-metrikalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Jamoaviy harakat metrikalari&lt;/span&gt;&lt;/a&gt;Jamoaviy harakat metrikalari&lt;/h4&gt;\n&lt;p&gt;Korrelyatsiya uzunligi metrikasi populyatsiya polyarizatsiyasidan farq qiladi, chunki ikkinchisi faqat tizimni yaxlit holda tasvirlaydi va qoʻshni hujayralar oʻrtasidagi oʻzaro munosabatlarni hisobga olmaydi. Yakuniy oʻlchov hujayralar oʻrtacha hisobda bir-biriga taʼsir koʻrsatmaydigan real masofani belgilaydi.&lt;/p&gt;\n&lt;p&gt;Xemotaktik indeks hujayra harakati vektori va yoʻnalish vektori (3-rasmda koʻrsatilgan gorizontal vektor yoki hujayra yadrosidan xemotaktik manbagacha boʻlgan vektor, 4-rasm) oʻrtasidagi burchakning kosinusi sifatida hisoblandi. Harakatni fazo va vaqt boʻyicha guruhlash parametrlari rasmlarni yaratish uchun ishlatilgan kodda keltirilgan.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell-fS1.jpg\" alt=\"Rasm S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Hujayra&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;aloqasini&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;oʻzgartirish&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qiyin&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Yopiq zanjirli&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;optogenetika&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;NATIJA&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Hujayralar&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qushlar kabi&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;toʻdalandi&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;AHAMIYATI&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Toʻqimalarni&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;dasturlash&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;usuli&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-ac
