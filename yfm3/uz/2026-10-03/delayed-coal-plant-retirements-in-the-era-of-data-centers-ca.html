            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"96\" cy=\"170\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"544\" cy=\"182\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · EPIDEMIOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Sun'iy intellekt va ko'mir:&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;elektr stansiyalarining&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;yopilishi kechikishi o'lim&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;holatlarini oshirmoqda&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca-f1.jpg\" alt=\"1-rasm. 2024-yil yanvaridan 2026-yil yanvarigacha ko‘mir elektr stansiyalarini foydalanishdan chiqarish jadvallariga kir\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. 2024-yil yanvaridan 2026-yil yanvarigacha ko‘mir elektr stansiyalarini foydalanishdan chiqarish jadvallariga kiritilgan o‘zgartirishlar.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm. 2024-yil yanvaridan 2026-yil yanvarigacha ko‘mir elektr stansiyalarini foydalanishdan chiqarish jadvallariga kiritilgan o‘zgartirishlar. 2024-yil yanvaridagi EIA-860M inventarizatsiyasiga ko‘ra, 2035-yilgacha foydalanishdan chiqarilishi rejalashtirilgan AQShdagi 50 ta ko‘mir elektr stansiyasining xaritasi. Nuqtalar ranglari 2026-yil yanvaridagi EIA-860M inventarizatsiyasidagi holatni bildiradi: foydalanishdan chiqarilgan, o‘zgarishsiz, foydalanishdan chiqarish kechiktirilgan yoki foydalanishdan chiqarish sanasi olib tashlangan. Nuqta hajmi 2024-yildagi SO2 emissiyalariga mutanosib. Foydalanishdan chiqarish kechiktirilgan yoki sanasi olib tashlangan deb tasniflangan 20 ta elektr stansiyasi sog‘liqqa ta’sirni tahlil qilishda foydalanilgan qayta ko‘rib chiqilgan stansiyalar to‘plamini tashkil etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Sun'iy intellekt va bulutli texnologiyalarning rivojlanishi elektr energiyasiga bo'lgan talabni keskin oshirdi, bu esa ko'plab ko'mir elektr stansiyalarining yopilish muddatini kechiktirishga majbur qildi. Tadqiqotchilar 20 ta shunday obyektni tahlil qilib, ularning ishlash muddatini uzaytirish atmosferaga zararli zarrachalar chiqarilishini ko'paytirishini aniqlashdi. Bu holat kelgusi o'n yillikda o'lim ko'rsatkichlarining sezilarli darajada oshishiga olib keladi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;20 ta ko'mir stansiyasi ma'lumotlar markazlari tufayli yopilishni kechiktirdi.&lt;/li&gt;\n&lt;li&gt;2035-yilgacha PM2.5 emissiyasi 1256 ta qo'shimcha o'limga olib keladi.&lt;/li&gt;\n&lt;li&gt;Ko'mir PM2.5 zarrachalari boshqa manbalarga qaraganda 2,1 barobar xavfliroq.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqot 2024-yil yanvaridan 2026-yil yanvarigacha yopilish muddatini kechiktirgan yoki bekor qilgan 20 ta ko'mir elektr stansiyasiga qaratilgan. Mualliflar EIA-860M ma'lumotlar bazasidan foydalanib, PM2.5 (diametri 2,5 mikrometrdan kichik bo'lgan mayda zarrachalar) atmosferadagi harakatini modellashtirishdi. Ushbu zarrachalar nafas yo'llari orqali qonga o'tib, yurak va o'&lt;a href=\"concepts/protein-kinase-a.html\"&gt;pka&lt;/a&gt; kasalliklarini keltirib chiqaradi.&lt;/p&gt;\n&lt;p&gt;Oqibatlarni baholash uchun Medicare (AQShdagi tibbiy sug'urta tizimi) foydalanuvchilari o'rtasidagi o'lim statistikasi tahlil qilindi. Modellashtirish natijalari shuni ko'rsatdiki, ushbu stansiyalarning 2026–2035-yillardagi faoliyati 1256 ta qo'shimcha o'lim holatiga sabab bo'ladi. 18 ta holatda stansiya operatorlari faoliyatning davom etishini aynan ma'lumotlar markazlarining yuklamasi bilan izohlashgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ushbu ish taqrizdan o'tmagan preprint bo'lib, prognoz modellarga asoslangan va kelajakdagi emissiyalarni kamaytirish texnologiyalarini hisobga olmasligi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;AQShdagi ko‘mir bilan ishlaydigan elektr stansiyalari mayda dispersli zarrachalar (PM2.5) chiqindilarining asosiy manbai bo‘lib qolmoqda va bu aholi o‘limi ko‘rsatkichlari bilan bevosita bog‘liq. Stansiyalarni yopish bo‘yicha tasdiqlangan rejalarga qaramay, bulutli hisoblash va sun’iy intellekt texnologiyalarining rivojlanishi elektr energiyasiga bo‘lgan talabni oshirib, energetika kompaniyalari va regulyatorlarni ushbu rejalarni qayta ko‘rib chiqishga majbur qilmoqda.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;20 ta ko‘mir elektr stansiyasining yopilish muddatini kechiktirish 2026–2035 yillar oralig‘ida 1256 ta qo‘shimcha o‘lim holatiga olib keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;2024 yil yanvar holatiga ko‘ra, 50 ta ko‘mir elektr stansiyasi 2035 yilgacha yopilishi rejalashtirilgan edi. Biroq 2026 yil yanvariga kelib, ulardan 20 tasining yopilish muddati kechiktirildi yoki rejadan chiqarib tashlandi. Mualliflar ushbu 20 ta obyektning PM2.5 chiqindilari 2026–2035 yillar davomida Medicare dasturi benefitsiarlari o‘limiga qanday ta’sir qilishini modellashtirdilar. Hisob-kitoblarga ko‘ra, jadvalning qayta ko‘rib chiqilishi 1256 ta qo‘shimcha o‘limga (ishonch oralig‘i 1136 dan 1376 gacha) olib keladi, bu esa sog‘liqni saqlash tizimiga tushadigan yukni dastlabki rejaga nisbatan 3,1 barobarga oshiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Medicare — AQShda asosan keksa yoshdagi aholini qamrab oluvchi davlat tibbiy sug‘urta dasturi bo‘lib, uning ma’lumotlari havo ifloslanishining o‘limga ta’sirini baholash uchun keng qo‘llaniladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tadqiqot shuni ko‘rsatdiki, 20 ta stansiyadan 18 tasi giper-masshtabli ma’lumotlarni qayta ishlash markazlari (data-centers) talabi yuqori bo‘lgan hududlarda joylashgan. Energetika kompaniyalarining hujjatlarida stansiyalar faoliyatini uzaytirish zarurati aynan IT-sektorning o‘sib borayotgan ehtiyojlarini qondirish bilan izohlangan. Mualliflar stansiyalarni yopish jadvallari aholi salomatligiga ta’sirni baholashdan ko‘ra tezroq o‘zgartirilayotganini va bu kechikishlar o‘lchanadigan insoniy yo‘qotishlarga olib kelishini ta’kidlaydilar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;O‘lim ko‘rsatkichlari prognozli modellashtirishga asoslangan bo‘lib, u chiqindilarni tozalash texnologiyalaridagi kelajakdagi o‘zgarishlarni hisobga olmasligi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"komir-elektr-stansiyalarining-aholi-salomatligiga-tasiri\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#komir-elektr-stansiyalarining-aholi-salomatligiga-tasiri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ko'mir elektr stansiyalarining aholi salomatligiga ta'siri&lt;/span&gt;&lt;/a&gt;Ko'mir elektr stansiyalarining aholi salomatligiga ta'siri&lt;/h4&gt;\n&lt;p&gt;Ko'mir bilan ishlaydigan elektr stansiyalari AQShda mayda dispersli zarrachalar (PM2.5) ifloslanishining asosiy manbai bo'lib qolmoqda. Ko'mir PM2.5 zarrachalari keltirib chiqaradigan o'lim xavfi boshqa barcha manbalardan keladigan PM2.5 ga nisbatan 2,1 baravar yuqori. 1999-yildan 2020-yilgacha bu Medicare dasturi foydalanuvchilari orasida taxminan 460 000 o'lim holatiga sabab bo'lgan. Emissiyalar tarkibiga birlamchi zarrachalar va ikkilamchi PM2.5 shakllanishiga hissa qo'shadigan gazsimon prekursorlar (oltingugurt dioksidi, azot oksidlari) kiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ko'mir PM2.5 zarrachalari 2,1 baravar yuqori o'lim xavfini keltirib chiqaradi va 21 yil ichida 460 000 kishining o'limiga sabab bo'lgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;AQShda ko'mir stansiyalari soni kamayib borayotgan bo'lsa-da, 2026-yil yanvar holatiga ko'ra 208 ta obyekt faoliyat ko'rsatmoqda. Sun'iy intellekt va bulutli hisoblashlar uchun ma'lumotlar markazlari (data centers) tomonidan elektr energiyasiga bo'lgan talabning ortishi stansiyalarni yopish rejalariga ta'sir qilmoqda. 2023-yilda ma'lumotlar markazlari katta hajmdagi energiya iste'mol qildi, 2028-yilga kelib bu ko'rsatkich 325–580 TWh ga yetishi kutilmoqda. Stansiyalarni yopish muddatlarining kechiktirilishi emissiyalarning saqlanib qolishiga va qo'shimcha o'lim holatlariga olib kelishi mumkin.&lt;/p&gt;\n&lt;h4 id=\"kechiktirish-oqibatlarini-baholash-usullari\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#kechiktirish-oqibatlarini-baholash-usullari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kechiktirish oqibatlarini baholash usullari&lt;/span&gt;&lt;/a&gt;Kechiktirish oqibatlarini baholash usullari&lt;/h4&gt;\n&lt;p&gt;Mualliflar 2024-yil yanvar va 2026-yil yanvar oylaridagi EIA-860M hisobotlarida qayd etilgan 50 ta ko'mir elektr stansiyasining yopilish rejalarini solishtirdilar. 20 ta stansiya bo'yicha muddatlar kechiktirilgani yoki bekor qilingani aniqlandi. Ushbu obyektlar uchun 2026–2035-yillar oralig'ida pochta indekslari (ZCTA) darajasida aholining ko'mir PM2.5 ta'siriga uchrashi hisoblab chiqildi. Baholash faqat SO₂ dan hosil bo'lgan ikkilamchi PM2.5 komponentini hisobga oldi, bu esa hisob-kitoblarni konservativ qiladi. O'lim darajasi Medicare ma'lumotlari asosida baholandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ZCTA (ZIP Code Tabulation Area) — pochta indekslari bo'yicha ma'lumotlarni jamlash uchun AQSh aholini ro'yxatga olish byurosi tomonidan qo'llaniladigan statistik hududlar.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot asosan Medicare foydalanuvchilariga (keksa yoshdagilar) qaratilgan, shuning uchun umumiy o'lim ko'rsatkichlari farq qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;p&gt;Tarixan, ko'mir yoqishdan hosil bo'lgan PM2.5 zarrachalari ta'siri AQShning janubiy va sharqiy hududlarida, jumladan Ogayo vodiysi, Appalachi, O'rta G'arb va Janubi-Sharqning bir qismida to'plangan (Rasm SN). Bu fazoviy naqsh ham ko'mir elektr stansiyalarining joylashuvi, ham zarrachalarning uzoq masofalarga atmosfera orqali ko'chishi bilan bog'liq. Aholi soniga qarab o'lchangan tarixiy ta'sir demografik guruhlar bo'yicha turlicha bo'lib, eng katta farq qora tanli aholi orasida kuzatilgan (Rasm SN).&lt;/p&gt;\n&lt;h4 id=\"komir-stansiyalarini-yopish-rejalariga-kiritilgan-ozgartirishlar\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#komir-stansiyalarini-yopish-rejalariga-kiritilgan-ozgartirishlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ko'mir stansiyalarini yopish rejalariga kiritilgan o'zgartirishlar&lt;/span&gt;&lt;/a&gt;Ko'mir stansiyalarini yopish rejalariga kiritilgan o'zgartirishlar&lt;/h4&gt;\n&lt;p&gt;Ko'mir elektr stansiyalarini yopish jadvallari 2024-yil yanvar va 2026-yil yanvar oylaridagi EIA-860M inventarizatsiyalari o'rtasida sezilarli darajada o'zgardi. 2024-yilgi ma'lumotlarga ko'ra, 2035-yilgacha yopilishi rejalashtirilgan 50 ta stansiyadan 20 tasida (40%) yopilish sanalari kechiktirilgan yoki umuman bekor qilingan (Rasm 1 va Jadval SN). Ushbu 20 ta stansiyadan 10 tasida sanalar kechiktirilgan, 10 tasida esa yopilish sanasi umuman ko'rsatilmagan. EIA-860M har bir generator bo'yicha hisobot berganligi sababli, agar kamida bitta ko'mir generatorining sanasi o'zgargan bo'lsa, stansiya ta'sirga uchragan deb hisoblangan; jami 44 ta generatordan 34 tasi ta'sirga uchragan. Ushbu obyektlarning SO₂ emissiyasidagi ulushi Sherburne County (MN) dagi 5% dan 12 ta stansiyadagi 100% gacha o'zgargan (Jadval SN).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca-f1.jpg\" alt=\"1-rasm. 2024-yil yanvaridan 2026-yil yanvarigacha ko‘mir elektr stansiyalarini foydalanishdan chiqarish jadvallariga kir\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. 2024-yil yanvaridan 2026-yil yanvarigacha ko‘mir elektr stansiyalarini foydalanishdan chiqarish jadvallariga kiritilgan o‘zgartirishlar.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm. 2024-yil yanvaridan 2026-yil yanvarigacha ko‘mir elektr stansiyalarini foydalanishdan chiqarish jadvallariga kiritilgan o‘zgartirishlar. 2024-yil yanvaridagi EIA-860M inventarizatsiyasiga ko‘ra, 2035-yilgacha foydalanishdan chiqarilishi rejalashtirilgan AQShdagi 50 ta ko‘mir elektr stansiyasining xaritasi. Nuqtalar ranglari 2026-yil yanvaridagi EIA-860M inventarizatsiyasidagi holatni bildiradi: foydalanishdan chiqarilgan, o‘zgarishsiz, foydalanishdan chiqarish kechiktirilgan yoki foydalanishdan chiqarish sanasi olib tashlangan. Nuqta hajmi 2024-yildagi SO2 emissiyalariga mutanosib. Foydalanishdan chiqarish kechiktirilgan yoki sanasi olib tashlangan deb tasniflangan 20 ta elektr stansiyasi sog‘liqqa ta’sirni tahlil qilishda foydalanilgan qayta ko‘rib chiqilgan stansiyalar to‘plamini tashkil etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;2035-yilgacha yopilishi rejalashtirilgan ko'mir stansiyalarining 40 foizida yopilish muddatlari kechiktirilgan yoki bekor qilingan, bu 34 ta generatorga ta'sir ko'rsatgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"stansiyalar-darajasida-olim-korsatkichlarini-baholash\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#stansiyalar-darajasida-olim-korsatkichlarini-baholash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Stansiyalar darajasida o'lim ko'rsatkichlarini baholash&lt;/span&gt;&lt;/a&gt;Stansiyalar darajasida o'lim ko'rsatkichlarini baholash&lt;/h4&gt;\n&lt;p&gt;Stansiyalar darajasidagi tahlil shuni ko'rsatdiki, milliy o'lim ko'rsatkichlari aynan yopilish muddatlari o'zgargan obyektlar bilan bog'liq. 2026–2035 yillarda Medicare benefitsiarlarining o'limi bo'yicha Welsh (TX) 435 ta, Coleto Creek (TX) 316 ta, Limestone (TX) 279 ta va Dave Johnston (WY) 99 ta qo'shimcha o'lim holatiga sabab bo'lishi prognoz qilingan (Rasm 4 va Jadval SN). Ushbu to'rtta eng yirik hissa qo'shuvchi obyekt jami o'lim holatlarining 90 foizini tashkil etadi. Umuman olganda, uchta eng yirik stansiya (Welsh, Coleto Creek va Limestone) 1256 ta qo'shimcha o'lim holatining taxminan 1030 tasiga (82%) javobgardir. Bu stansiyalar Texas va unga qo'shni hududlarda keng ko'lamli ta'sir zonalarini yaratgan (Rasm 5).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca-f4.jpg\" alt=\"4-rasm. 2026–2035-yillarda foydalanishdan chiqarishning kechiktirilishi bilan bog‘liq stansiya darajasidagi o‘lim ko‘rsa\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm. 2026–2035-yillarda foydalanishdan chiqarishning kechiktirilishi bilan bog‘liq stansiya darajasidagi o‘lim ko‘rsatkichlari.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-rasm. 2026–2035-yillarda foydalanishdan chiqarishning kechiktirilishi bilan bog‘liq stansiya darajasidagi o‘lim ko‘rsatkichlari. 2026–2035-yillar davomida foydalanishdan chiqarish kechiktirilgan ko‘mir elektr stansiyalaridan chiqadigan PM2.5 ta’siri tufayli Medicare benefitsiarlari orasida barcha sabablarga ko‘ra yuz bergan kümülatif o‘lim holatlari. Moviy ustunlar dastlabki ssenariy bo‘yicha, qizil ustunlar esa qayta ko‘rib chiqilgan ssenariy bo‘yicha o‘limni ko‘rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca-f5.jpg\" alt=\"5-rasm. Coleto Creek (TX), Limestone (TX) va Welsh (TX) stansiyalari uchun foydalanishdan chiqarishning kechiktirilishi \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm. Coleto Creek (TX), Limestone (TX) va Welsh (TX) stansiyalari uchun foydalanishdan chiqarishning kechiktirilishi natijasida yuzaga kelgan PM2.5 ta’sirining qo‘shimcha o‘sishi, 2026–2035-yillar.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-rasm. Coleto Creek (TX), Limestone (TX) va Welsh (TX) stansiyalari uchun foydalanishdan chiqarishning kechiktirilishi natijasida yuzaga kelgan PM2.5 ta’sirining qo‘shimcha o‘sishi, 2026–2035-yillar. Xaritalarda qayta ko‘rib chiqilgan ssenariy bo‘yicha dastlabki ssenariyga nisbatan 2026–2035-yillardagi kümülatif qo‘shimcha PM2.5 ta’siri ko‘rsatilgan. Qiymatlar ZCTA darajasida prognoz yillari bo‘yicha jamlangan va kub metr uchun mikrogramm-yillarda keltirilgan. Ushbu uchta stansiya prognoz qilingan qo‘shimcha o‘lim holatlarining 82 foizini tashkil etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Yopilish muddati uzaytirilgan to'rtta elektr stansiyasi 2026–2035 yillar oralig'ida Medicare benefitsiarlari orasida kutilayotgan qo'shimcha o'lim holatlarining 90 foizini tashkil qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;\"Stansiya darajasidagi atributsiya\" usuli umumiy o'lim ko'rsatkichlarini alohida obyektlarning emissiyalari, ishlash muddati va havo oqimlari yo'nalishi bilan bog'lash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gipermasshtabli-malumotlar-markazlari-hdc-talabi\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#gipermasshtabli-malumotlar-markazlari-hdc-talabi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gipermasshtabli ma'lumotlar markazlari (HDC) talabi&lt;/span&gt;&lt;/a&gt;Gipermasshtabli ma'lumotlar markazlari (HDC) talabi&lt;/h4&gt;\n&lt;p&gt;(36)-manbadagi atributsiya modelidan foydalanib, mualliflar yopilish muddati o'zgargan 20 ta stansiyani EIA identifikatorlari va EPA eGRID2023 ma'lumotlari bilan solishtirdilar (37). 20 ta stansiyadan 18 tasi HDC elektr energiyasiga bo'lgan talab yuqori bo'lgan yettita balanslashtiruvchi hududda joylashganligi aniqlandi (Jadval SN). Rasmiy hujjatlar va hisobotlar Campbell (MI), Centralia (WA), Craig (CO), Culley (IN) va Schahfer (IN) stansiyalarining ishlash muddatini uzaytirishni sun'iy intellekt va ma'lumotlar markazlarining tez o'sishi bilan bog'laydi (38-44). Masalan, Campbell stansiyasi uchun 1 GVt quvvatni ma'lumotlar markaziga yetkazib berish rejasi ko'rsatilgan. Shuningdek, Viskonsin va Florida shtatlarida ham ma'lumotlar markazlari uchun elektr energiyasiga bo'lgan talab stansiyalarning yopilishini kechiktirishga asos bo'lgan (45-49).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot modellashtirish va ma'muriy hisobotlarga asoslangan; ma'lumotlar markazlari talabi va stansiyalarning ishlash muddati o'rtasidagi bog'liqlik har doim ham to'g'ridan-to'g'ri sabab-oqibat aloqasini anglatmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;h4 id=\"natijalarni-muhokama-qilish-va-sogliqqa-tasiri\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#natijalarni-muhokama-qilish-va-sogliqqa-tasiri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalarni muhokama qilish va sog'liqqa ta'siri&lt;/span&gt;&lt;/a&gt;Natijalarni muhokama qilish va sog'liqqa ta'siri&lt;/h4&gt;\n&lt;p&gt;Ushbu tadqiqot shuni ko'rsatadiki, ko'mir elektr stansiyalarini yopish rejalarining o'zgarishi PM2.5 zarrachalari ta'sirini kuchaytiradi va o'lim holatlarining sezilarli darajada oshishiga olib keladi. 2024-yil yanvaridan 2026-yil yanvarigacha bo'lgan EIA-860M ma'lumotlari tahlili shuni ko'rsatdiki, 2035-yilgacha yopilishi rejalashtirilgan stansiyalarning 40 foizi yopilish muddatini kechiktirgan yoki rejadan olib tashlagan. Qayta ko'rib chiqilgan ssenariyga ko'ra, 2026–2035-yillar davomida Medicare benefitsiarlari orasida ko'mir PM2.5 emissiyasi bilan bog'liq qo'shimcha o'limlar soni 1256 tani tashkil etishi kutilmoqda, bu dastlabki ssenariyga nisbatan 3,11 baravar ko'pdir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ko'mir stansiyalarining yopilishini kechiktirish 2026–2035-yillarda 1256 ta qo'shimcha o'limga olib keladi, bu rejalashtirilganidan 3,11 baravar yuqori.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;18 ta stansiyaning giper-masshtabli ma'lumotlar markazlari (data-center) talabi yuqori bo'lgan hududlarda joylashganligi xavotirlidir. Ma'lumotlar markazlarining elektr energiyasiga bo'lgan talabi yangi quvvatlarni qurish tezligidan yuqori bo'lgani uchun, eski ko'mir bloklari asosiy energiya manbasiga aylanib qolmoqda. Bu esa iqtisodiy foyda ko'rmaydigan, ammo ifloslangan havodan aziyat chekadigan aholi punktlariga salbiy ta'sir qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Medicare — AQShdagi davlat tibbiy sug'urta dasturi bo'lib, asosan 65 yoshdan oshgan shaxslarni qamrab oladi; tadqiqotda o'lim ko'rsatkichlarini baholash uchun aynan shu guruh tanlab olingan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tadqiqot-cheklovlari-va-metodologik-jihatlar\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#tadqiqot-cheklovlari-va-metodologik-jihatlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot cheklovlari va metodologik jihatlar&lt;/span&gt;&lt;/a&gt;Tadqiqot cheklovlari va metodologik jihatlar&lt;/h4&gt;\n&lt;p&gt;Bizning tahlil stansiya darajasidagi SO₂ emissiyasi va PM2.5 ta'siri o'rtasidagi tarixiy bog'liqlikka asoslangan. Welsh, Coleto Creek, Limestone va Dave Johnston kabi stansiyalar o'lim ko'rsatkichlarining asosiy manbalari hisoblanadi. Bu haqiqiy dispetcherlik prognozi emas, balki ssenariyga asoslangan tahlildir. Biz 2023–2025-yillardagi o'rtacha yillik SO₂ emissiyalaridan foydalandik, ammo kelajakdagi texnologik o'zgarishlarni modellashtirmadik.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;O'limni baholash faqat Medicare benefitsiarlari bilan cheklangan va yosh aholi, nafas yo'llari kasalliklari yoki yurak-qon tomir xastaliklari kabi nofatal oqibatlarni hisobga olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Model konservativ hisoblanadi: 10% benefitsiarlar uchun ta'sir baholanmagan. Shuningdek, biz gaz generatsiyasi kabi o'rnini bosuvchi quvvatlarni modellashtirmadik, shuning uchun natijalar ko'mir stansiyalarini saqlab qolishning yalpi ta'sirini aks ettiradi. Energiya tizimi ishonchliligi muhim bo'lsa-da, ko'mir stansiyalarini saqlab qolish sog'liqni saqlash uchun xavfsiz emas va bu qarorlar jamoat salomatligi oqibatlari bilan birga baholanishi kerak.&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"tadqiqot-dizayni-va-foydalanishdan-chiqarish-ssenariylari\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#tadqiqot-dizayni-va-foydalanishdan-chiqarish-ssenariylari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot dizayni va foydalanishdan chiqarish ssenariylari&lt;/span&gt;&lt;/a&gt;Tadqiqot dizayni va foydalanishdan chiqarish ssenariylari&lt;/h4&gt;\n&lt;p&gt;Ko‘mir elektr stansiyalarini foydalanishdan chiqarish jadvallari AQSh Energetika axborot boshqarmasining (EIA-860M) ma’lumotlari asosida shakllantirildi. Dastlabki jadval uchun 2024-yil yanvar, qayta ko‘rib chiqilgan ssenariy uchun esa 2026-yil yanvar inventarizatsiya ma’lumotlari olindi. Tahlilga 2024-yil yanvar holatiga ko‘ra yopilish sanasi belgilangan kamida bitta ishchi ko‘mir bloki mavjud bo‘lgan stansiyalar kiritildi. Tahlil birligi sifatida har bir generator tanlab olindi, bu stansiya darajasida ma’lumotlarni umumlashtirishdagi xatoliklarning oldini oldi. Tanlab olingan 50 ta stansiyadan 20 tasi mezonlarga mos keldi; ulardagi 44 ta generatorning 19 tasida yopilish muddati kechiktirilgan, 15 tasida sana olib tashlangan, 7 tasi o‘zgarishsiz qolgan, 2 tasi yopilgan va 1 tasi tabiiy gazga o‘tkazilgan (Jadval S1).&lt;/p&gt;\n&lt;p&gt;Foydalanishdan chiqarish yilini hisobga olish uchun taqvimiy mavjudlik koeffitsiyenti qo‘llanildi: yopilishdan oldingi to‘liq yillar uchun 1, yopilgandan keyin 0 va yopilish yili uchun oylar sonining 12 ga nisbati. Qayta ko‘rib chiqilgan ssenariyda sanasi olib tashlangan generatorlar uchun 2035-yilgacha 1 koeffitsiyenti saqlanib qoldi. Stansiya darajasidagi koeffitsiyentlar 2023–2025 yillardagi o‘rtacha SO₂ emissiyalari bo‘yicha tortildi, bu quvvatga nisbatan aniqroq natija beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Taqvimiy mavjudlik koeffitsiyenti — bu yillik emissiyalarni stansiya yopilgan yilning qaysi qismida ishlaganiga qarab mutanosib taqsimlash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"so-emissiyalari\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#so-emissiyalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SO₂ emissiyalari&lt;/span&gt;&lt;/a&gt;SO₂ emissiyalari&lt;/h4&gt;\n&lt;p&gt;SO₂ emissiyalari bo‘yicha yillik ma’lumotlar EPA Clean Air Markets bazasidan olindi. 2026–2035 yillar uchun prognozlarda har bir generatorning bazaviy emissiyasi 2023–2025 yillardagi o‘rtacha ko‘rsatkich sifatida belgilandi. Bu ko‘rsatkich ssenariyga muvofiq yopilish sanasigacha o‘zgarmas saqlandi va taqvimiy mavjudlik koeffitsiyentiga ko‘paytirildi. Tegishli EIA hisobotlarida ko‘rsatilgan yopilish sanasidan keyin emissiyalar nolga teng deb qabul qilindi.&lt;/p&gt;\n&lt;h4 id=\"komir-pm25-tasirini-modellashtirish\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#komir-pm25-tasirini-modellashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ko'mir PM2.5 ta'sirini modellashtirish&lt;/span&gt;&lt;/a&gt;Ko'mir PM2.5 ta'sirini modellashtirish&lt;/h4&gt;\n&lt;p&gt;Ko'mir yoqilg'isidan hosil bo'lgan PM2.5 zarrachalari ta'sirini baholash uchun 1999–2020 yillardagi manba-ta'sir ma'lumotlar to'plamidan foydalanildi. AQShdagi ko'mir elektr stansiyalaridan chiqadigan oltingugurt dioksidi (SO2) bilan bog'liq PM2.5 konsentratsiyalari HyADS (HYSPLIT bilan o'rtacha dispersiya) modeli yordamida hisoblab chiqildi. Ushbu ma'lumotlar ZCTA (pochta indekslari hududlari) bo'yicha birlashtirildi va stansiya darajasidagi yillik SO2 emissiyalari bilan bog'landi. Tadqiqotda «ko'mir PM2.5» deganda faqat SO2 bilan bog'liq komponent tushuniladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HyADS modeli — bu emissiya manbalarini ma'lum bir hududdagi ifloslanish darajasi bilan bog'laydigan, atmosferadagi zarrachalar tarqalishini hisoblovchi soddalashtirilgan model.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;2026–2035 yillar uchun HyADS ma'lumotlari bo'lmagani sababli, log-log model qo'llanildi: &lt;span class=\"yfm-latex\" data-content=\"%5Clog(%20ext%7BcoalPM%7D_%7B2.5%2Cpzt%7D)%20%3D%20%5Calpha_%7Bpz%7D%20%2B%20%5Cgamma%20%5Clog(%20ext%7BSO%7D_%7B2%2Cpt%7D)%20%2B%20%5Cepsilon_%7Bpzt%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Bu yerda αpz stansiya-ZCTA juftligi uchun qat'iy effekt, γ esa elastiklik koeffitsiyentidir (SO2 ning 1% o'zgarishi PM2.5 ning γ% o'zgarishiga olib keladi). Model eng kichik kvadratlar usuli bilan o'qitildi. Modelning aniqligi R² = 0,945 va ichki R² = 0,834 ni tashkil etdi. Elastiklik γ qiymati 1,165 (95% CI: 1,124–1,206, Jadval S4) deb baholandi, bu SO2 emissiyasi ortishi bilan PM2.5 konsentratsiyasi mutanosib ravishda biroz ko'proq o'sishini ko'rsatadi.&lt;/p&gt;\n&lt;p&gt;Kelajakdagi konsentratsiyalarni bashorat qilish uchun stansiyalarning yopilish ssenariylari bo'yicha SO2 emissiyalari ishlatildi. Logarifmik shkaladan haqiqiy qiymatlarga o'tish uchun Duan smearing koeffitsiyenti qo'llanildi (har bir stansiya uchun alohida hisoblangan, diapazon 1,063–1,226, o'rtacha 1,169, Jadval S4). Tahlil 616 801 ta juftlik bo'yicha 12 474 346 ta kuzatuvni qamrab oldi. Qo'shimcha PM2.5 ta'siri stansiyalarning yopilishini kechiktirish ssenariysi va bazaviy ssenariy o'rtasidagi farq sifatida hisoblandi. O'lim holatlari har bir stansiyaning ZCTA dagi umumiy PM2.5 konsentratsiyasiga qo'shgan hissasi mutanosibligida taqsimlandi.&lt;/p&gt;\n&lt;h4 id=\"subguruhlar-boyicha-tasir-tahlili\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#subguruhlar-boyicha-tasir-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Subguruhlar bo'yicha ta'sir tahlili&lt;/span&gt;&lt;/a&gt;Subguruhlar bo'yicha ta'sir tahlili&lt;/h4&gt;\n&lt;p&gt;Biz ko'mir PM2.5 zarralarining aholi soniga qarab tortilgan ta'sirini jins, irq va yosh guruhlari bo'yicha hisobladik. ZCTA darajasidagi demografik ma'lumotlar 2020-yilgi AQSh aholini ro'yxatga olish byurosi hisobotlaridan olindi. Bu ko'rsatkichlar faqat subguruhlar bo'yicha vazn belgilash uchun ishlatildi va o'lim ko'rsatkichlarini hisoblashga kiritilmadi. Tarixiy tahlil uchun (1999–2020) biz yillik o'rtacha PM2.5 konsentratsiyalaridan foydalandik va subguruhlar uchun o'rtacha ta'sir darajasini umumiy aholi o'rtacha ko'rsatkichiga nisbatan foizlarda hisobladik. 2026–2035 yillar uchun stansiyalarni ekspluatatsiyadan chiqarish ssenariylari doirasida biz kümülatif ta'sirni hisobladik. Qayta ko'rib chiqilgan ssenariy bo'yicha foiz o'sishi, qayta ko'rib chiqilgan va asl ssenariylar o'rtasidagi farqni asl ssenariy ko'rsatkichiga bo'lish orqali aniqlandi.&lt;/p&gt;\n&lt;h4 id=\"medicare-aholisi-va-bazaviy-olim-darajasi\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#medicare-aholisi-va-bazaviy-olim-darajasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Medicare aholisi va bazaviy o'lim darajasi&lt;/span&gt;&lt;/a&gt;Medicare aholisi va bazaviy o'lim darajasi&lt;/h4&gt;\n&lt;p&gt;Medicare ro'yxatga olish ma'lumotlari CMS hisobotlaridan, 2026–2035 yillar uchun prognozlar esa Medicare Vasiylik hisobotidan olindi (SN5-jadval). ZCTA darajasidagi aholi sonini loyihalash uchun milliy prognozlar 2019-yildagi ulushlarga mutanosib ravishda taqsimlandi. Milliy ro'yxatga olish soni 2025-yildagi 69,5 milliondan 2035-yilda 81,3 milliongacha (taxminan 17% o'sish) ko'tariladi. Bazaviy o'lim darajasi 2019-yilgi ma'lumotlar asosida hisoblandi (SN6-jadval). Biz 2020-yilni emas, 2019-yilni tanladik, chunki COVID-19 pandemiyasi 2020-yilda o'lim ko'rsatkichlarini sun'iy ravishda oshirib yuborgan edi (0,04377 ga nisbatan 2019-yilda 0,03801).&lt;/p&gt;\n&lt;h4 id=\"statistik-tahlil\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#statistik-tahlil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Statistik tahlil&lt;/span&gt;&lt;/a&gt;Statistik tahlil&lt;/h4&gt;\n&lt;p&gt;O'lim ko'rsatkichlari «stansiya – ZCTA – yil» darajasida hisoblanib, keyinchalik jamlandi. Ko'mir PM2.5 bilan bog'liq o'limlar soni quyidagi formula bo'yicha aniqlandi: &lt;span class=\"yfm-latex\" data-content=\"B_%7Bi%2Cj%2Ct%7D%20%3D%20C_%7Bj%2Ct%7D%20%20imes%20E_%7Bj%2Ct%7D%20%20imes%20(1%20-%20%5Cexp(-%5Cbeta%20%20imes%20coalPM_%7Bi%2Cj%2Ct%7D))\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Bu yerda β (o'limga javob koeffitsiyenti) 1 µ g/m³ uchun 1,0125 (CI: 1,0113–1,0137) nisbiy xavfga mos keladi. 2026–2035 yillar uchun kümülatif o'limlar barcha stansiyalar va ZCTA'lar bo'yicha yig'ildi. Ssenariylar o'rtasidagi farq qo'shimcha o'limlar sifatida baholandi. O'lim baholarining quyi va yuqori chegaralari β koeffitsiyentining ishonch intervallari asosida aniqlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;O'limga javob koeffitsiyenti (mortality-response coefficient) — ifloslantiruvchi modda konsentratsiyasining bir birlikka oshishi o'lim xavfini qanchalik oshirishini ko'rsatuvchi statistik o'lchovdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"so2-emissiyalari-va-foydalanishdan-chiqarish-sanalari-boyicha-sezgirlik-tahlili\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#so2-emissiyalari-va-foydalanishdan-chiqarish-sanalari-boyicha-sezgirlik-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SO2 emissiyalari va foydalanishdan chiqarish sanalari bo'yicha sezgirlik tahlili&lt;/span&gt;&lt;/a&gt;SO2 emissiyalari va foydalanishdan chiqarish sanalari bo'yicha sezgirlik tahlili&lt;/h4&gt;\n&lt;p&gt;Asosiy tahlil ishchi holatdagi stansiyalarning yillik SO2 emissiyalari va yopilish sanalari bekor qilingan obyektlarning ishlash muddati bo'yicha taxminlarga asoslangan. Bazaviy daraja sifatida 2023–2025 yillardagi o'rtacha yillik emissiyalar olindi. Kelajakdagi emissiyalar elektr energiyasiga bo'lgan talab yoki stansiya intensivligiga qarab o'zgarishi mumkinligi sababli, noaniqlikni baholash uchun uchta qo'shimcha tahlil o'tkazildi. Bular emissiyalarning proporsional o'zgarishi, har bir generatorning individual ish diapazoni va qisqartirilgan ishlash muddatlarini qamrab oldi. Barcha tahlillarda stansiya-ZCTA qat'iy effektlari, SO₂-ko'mir PM2.5 elastikligi, Medicare aholi prognozlari va o'lim koeffitsientlari o'zgarishsiz qoldirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sezgirlik tahlili — bu modelning kirish parametrlari o'zgarganda natijalarning qanchalik barqarorligini tekshirish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"emissiyalarni-bir-xil-miqyosda-ozgartirish-ssenariylari\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#emissiyalarni-bir-xil-miqyosda-ozgartirish-ssenariylari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Emissiyalarni bir xil miqyosda o'zgartirish ssenariylari&lt;/span&gt;&lt;/a&gt;Emissiyalarni bir xil miqyosda o'zgartirish ssenariylari&lt;/h4&gt;\n&lt;p&gt;Emissiyalarning yuqori yoki past bo'lish oqibatlarini baholash uchun 2023–2025 yillardagi o'rtacha ko'rsatkichlarning 50%, 75%, 125% va 150% qiymatlari ishlatildi. Bu bazaviy darajadan proporsional og'ishlar natijasida yuklamaning qanday o'zgarishini ko'rsatadi.&lt;/p&gt;\n&lt;h4 id=\"generatorga-xos-emissiya-ssenariylari\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#generatorga-xos-emissiya-ssenariylari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Generatorga xos emissiya ssenariylari&lt;/span&gt;&lt;/a&gt;Generatorga xos emissiya ssenariylari&lt;/h4&gt;\n&lt;p&gt;Bir xil miqyoslash barcha stansiyalarga bir xil ta'sir qiladi, shuning uchun biz har bir generator uchun 2023–2025 yillarda kuzatilgan minimal va maksimal yillik SO2 emissiyalarini alohida tahlil qildik. Bu stansiya darajasidagi geterogenlikni saqlab qoladi va yaqinda kuzatilgan past va yuqori emissiya sharoitlarini aks ettiradi.&lt;/p&gt;\n&lt;h4 id=\"yopilish-sanalari-boyicha-muqobil-taxminlar\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#yopilish-sanalari-boyicha-muqobil-taxminlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yopilish sanalari bo'yicha muqobil taxminlar&lt;/span&gt;&lt;/a&gt;Yopilish sanalari bo'yicha muqobil taxminlar&lt;/h4&gt;\n&lt;p&gt;Asosiy tahlilda yopilish sanasi bekor qilingan stansiyalar 2026–2035 yillar davomida ishlashda davom etadi deb qaraldi. Ushbu taxmin ta'sirini tekshirish uchun biz yopilish sanasini dastlabki muddatdan 2 va 5 yil keyinga surdik. Belgilangan yopilish yilida qisman ishlashni hisobga olgan holda, kalendar mavjudlik ulushi qo'llanildi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca-f2.jpg\" alt=\"2-rasm. 2026–2035-yillarda ko‘mir elektr stansiyalarini foydalanishdan chiqarishning kechiktirilishi natijasida yuzaga k\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm. 2026–2035-yillarda ko‘mir elektr stansiyalarini foydalanishdan chiqarishning kechiktirilishi natijasida yuzaga kelgan PM2.5 ta’sirining kümülatif qo‘shimcha o‘sishi (dastlabki ssenariy bilan solishtirganda).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm. 2026–2035-yillarda ko‘mir elektr stansiyalarini foydalanishdan chiqarishning kechiktirilishi natijasida yuzaga kelgan PM2.5 ta’sirining kümülatif qo‘shimcha o‘sishi (dastlabki ssenariy bilan solishtirganda). Qayta ko‘rib chiqilgan ssenariy bo‘yicha ZCTA darajasidagi PM2.5 ta’sirining dastlabki ssenariyga nisbatan kümülatif farqi. Ranglar 2026–2035-yillar davomida qayta ko‘rib chiqilgan va dastlabki ssenariylar o‘rtasidagi PM2.5 ta’sirining kümülatif farqini ko‘rsatadi. Nuqtalar foydalanishdan chiqarish sanasi kechiktirilgan ko‘mir elektr stansiyalarini bildiradi. Qiymatlar kub metr uchun mikrogramm-yillarda keltirilgan. Kulrang hududlar ta’sirlangan stansiyalar uchun tarixiy stansiya-ZCTA qat’iy effekti hisoblanmagan ZCTA’larni bildiradi; oq hududlar aholini ro‘yxatga olish ZCTA qamrovidan tashqarida qoladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca-f3.jpg\" alt=\"3-rasm. Foydalanishdan chiqarish sanasi kechiktirilgan 20 ta ko‘mir elektr stansiyasidan chiqadigan PM2.5 ta’siri tufayl\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm. Foydalanishdan chiqarish sanasi kechiktirilgan 20 ta ko‘mir elektr stansiyasidan chiqadigan PM2.5 ta’siri tufayli Medicare benefitsiarlari orasida barcha sabablarga ko‘ra yuz bergan kümülatif o‘lim holatlari.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-rasm. Foydalanishdan chiqarish sanasi kechiktirilgan 20 ta ko‘mir elektr stansiyasidan chiqadigan PM2.5 ta’siri tufayli Medicare benefitsiarlari orasida barcha sabablarga ko‘ra yuz bergan kümülatif o‘lim holatlari. Moviy va qizil chiziqlar mos ravishda dastlabki va qayta ko‘rib chiqilgan ssenariylar bo‘yicha kümülatif o‘limni ko‘rsatadi. Soya tushirilgan chiziqlar PM2.5 o‘limga ta’sirini baholashning quyi va yuqori chegaralariga asoslangan hisob-kitoblarni ko‘rsatadi. Yashil ustunlar qayta ko‘rib chiqilgan ssenariy bo‘yicha dastlabki ssenariyga nisbatan qo‘shimcha o‘lim holatlarini ko‘rsatadi; xatolik chiziqlari PM2.5 konsentratsiyasi va o‘lim o‘rtasidagi &lt;a href=\"concepts/ld.html\"&gt;bog‘liqlik&lt;/a&gt; funksiyasidagi noaniqlikni aks ettiruvchi mos keladigan quyi va yuqori baholarni ko‘rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Ko'mir&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;stansiyalari&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;yopilishining&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;kechikishi&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;EIA&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ma'lumotlari&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" fo
