rini aniqlashini koʻrsatuvchi qoʻshimcha dalillarni taqdim etadi, shu bilan birga atributsiya reytinglari va maskalash effektlari oʻrnatilgan model yoki buzilish sozlamalaridagi oʻzgarishlarga nisbatan invariant emasligini koʻrsatadi.&lt;/p&gt;\n&lt;h4 id=\"435-tasvirlash-va-ustma-ust-tushish-ablatsiyalari\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#435-tasvirlash-va-ustma-ust-tushish-ablatsiyalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3.5. Tasvirlash va ustma-ust tushish ablatsiyalari&lt;/span&gt;&lt;/a&gt;4.3.5. Tasvirlash va ustma-ust tushish ablatsiyalari&lt;/h4&gt;\n&lt;p&gt;Biz bashorat qilish samaradorligi LLM tomonidan yaratilgan baholash va mulohazalar, klinik oʻzgaruvchilarning deterministik verbalizatsiyasi yoki asl klinik maʼlumotlarni toʻgʻridan-toʻgʻri modellashtirishdan kelib chiqishini aniqlash uchun bir nechta tasvirlash va ablatsiya shartlarini baholadik. Matn shartlari toʻliq LLM tomonidan yaratilgan xavf bahosini, faqat xavf yorliqlarini, faqat asoslarni, neytral klinik xulosani (SCD yoki PFD xavfini baholamasdan taqdim etilgan klinik maʼlumotlarning LLM xulosasi) va LLM boʻlmagan deterministik shablonni oʻz ichiga oladi. Toʻgʻridan-toʻgʻri klinik maʼlumotlar nazorati sifatida asl sonli va kategorik oʻzgaruvchilar beshta Holter EKG taassurotlari bilan va ularsiz jazolangan logistik regressiya yordamida modellashtirildi. Natijalar 5-jadvalda jamlangan. SCD bashorati uchun toʻliq LLM bahosi 0,531 AUROC va 0,130 PR-AUC ga erishdi. Faqat xavf yorligʻi va faqat asoslash tasvirlari diskriminatsiyani yaxshilamadi, neytral klinik xulosa esa 0,574 AUROC va 0,141 PR-AUC bilan biroz yuqoriroq nuqtali baholarni berdi. Aksincha, deterministik shablon 0,681 AUROC va 0,204 PR-AUC ga erishib, toʻgʻridan-toʻgʻri jadval klinik oʻzgaruvchilar modellari samaradorligiga yaqinlashdi. SCD Brier-score uchun eng past nuqtali baho klinik oʻzgaruvchilar va EKG taassurotlari bilan jazolangan logistik regressiya uchun kuzatildi. PFD bashorati uchun toʻliq LLM bahosi 0,459 AUROC va 0,134 PR-AUC ga erishdi. Faqat xavf yorligʻi va faqat asoslash tasvirlari xuddi shunday cheklangan diskriminatsiyani koʻrsatdi, neytral klinik xulosa esa 0,620 AUROC va 0,188 PR-AUC bilan yaxshiroq ishladi. Deterministik shablon 0,680 AUROC va 0,300 PR-AUC ga erishib, yanada yaxshilandi, garchi toʻgʻridan-toʻgʻri jadval klinik oʻzgaruvchilar modellari umuman olganda eng kuchli boʻlib qoldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AUROC va PR-AUC — klassifikatsiya sifatini baholash metrikalari: birinchisi modelning sinflarni ajratish qobiliyatini, ikkinchisi esa kam uchraydigan hodisalarni aniqlashdagi aniqlikni oʻlchaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;EKG modaliteti bilan potentsial ustma-ust tushishni baholash uchun beshta Holter EKG taassurotlari LLM soʻrovlariga va jadval bashoratchilariga alohida qoʻshildi. SCD uchun ushbu taassurotlarni toʻliq LLM bahosiga qoʻshish diskriminatsiyani yaxshilamadi, AUROC 0,531 dan 0,516 gacha va PR-AUC 0,130 dan 0,117 gacha kamaydi. Aksincha, PFD uchun EKG taassurotlarini qoʻshish AUROCni 0,459 dan 0,655 gacha va PR-AUCni 0,134 dan 0,245 gacha oshirdi. Tegishli jadval AUROC qiymatlari faqat biroz oshdi: SCD uchun 0,696 dan 0,710 gacha va PFD uchun 0,787 dan 0,792 gacha. Umuman olganda, EKG taassurotlari maydonlari PFD uchun LLM tasviriga SCDga qaraganda sezilarli darajada koʻproq hissa qoʻshganga oʻxshaydi.&lt;/p&gt;\n&lt;p&gt;Bemor-matn muvofiqligi har bir tashqi test qatlamidagi bemorlar oʻrtasida matn tasvirlarini tasodifiy almashtirish va EKG tasvirlari hamda natijalarni oʻzgarishsiz qoldirish orqali baholandi. Oʻqitilgan termoyadroviy modellar qayta moslashtirilmasdan qoʻllanildi. Ushbu protsedura matnli embeddinglarning umumiy taqsimotini saqlab qoldi, shu bilan birga har bir bemor va uning matn tasviri oʻrtasidagi muvofiqlikni buzdi. 6-jadvalda koʻrsatilganidek, bemor-matn muvofiqligini buzish samaradorlikda ozgina oʻzgarishlarga olib keldi. SCD uchun toʻgʻri juftlashtirilgan tasvirlar aralashtirilgan juftliklarga qaraganda biroz pastroq AUROC va PR-AUCga ega edi, farqlar mos ravishda -0,011 va -0,008 ni tashkil etdi, Brier-score farqi esa minimal edi. PFD uchun AUROC, PR-AUC va Brier-score boʻyicha tegishli farqlar ham ahamiyatsiz edi. Hech qaysi permutatsiya testlari statistik jihatdan ahamiyatli emas edi. Ushbu topilmalar shuni koʻrsatadiki, EKG-LLM termoyadroviy modeli toʻliq LLM-matn tasvirida bemorga xos muvofiqlikni saqlab qolishdan oʻlchanadigan samaradorlik foydasini olmagan. Ular, shuningdek, deterministik va toʻgʻridan-toʻgʻri jadval tasvirlari LLM tomonidan yaratilgan baholashdan koʻra koʻproq foydali bashoratli maʼlumotlarni saqlab qolganligi haqidagi kengroq xulosani mustahkamlaydi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-f1.jpg\" alt=\"1-rasm. Ambulator EKG yozuvlarini klinik xususiyatlar bilan birgalikda tahlil qilish uchun multimodal ish jarayoni.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. Ambulator EKG yozuvlarini klinik xususiyatlar bilan birgalikda tahlil qilish uchun multimodal ish jarayoni.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm. Ambulator EKG yozuvlarini klinik xususiyatlar bilan birgalikda tahlil qilish uchun multimodal ish jarayoni. EKG yozuvlari dastlabki ishlovdan o‘tkaziladi va qisqa oynalarga segmentlanadi. Har bir oyna uchun yurak urishi o‘zgaruvchanligi (HRV) ko‘rsatkichlari ajratib olinadi va Multiple Instance Learning–Temporal Convolutional Network (MIL–TCN) orqali kodlanib, EKG tasvirini, 𝜀ECG hosil qiladi. Parallel ravishda, klinik o‘zgaruvchilar katta til modeli (LLM) tomonidan yaratilgan matn, deterministik klinik matn yoki jadval ko‘rinishidagi belgilar sifatida ifodalanadi. LLM tomonidan yaratilgan va deterministik matnlar bemor darajasidagi matnli tasvirlarni, 𝜀TXT hosil qilish uchun biomedikal matn kodlovchisi orqali kodlanadi, oldindan ishlangan jadval o‘zgaruvchilari esa jadval tasvirini, 𝜀TAB hosil qiladi. EKG, matnli va jadval tasvirlarining har biri unimodal modellar sifatida baholandi, matnli va jadval tasvirlari esa to‘satdan yurak o‘limi (SCD) va yurak yetishmovchiligi oqibatidagi o‘limni (PFD) bashorat qilish uchun multimodal modellarda EKG tasviri bilan alohida birlashtirildi. Uzuk chiziqlar multimodal birlashish uchun matnli (TXT) yoki jadval (TAB) tasviridan foydalanishni ko‘rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-f2.jpg\" alt=\"2-rasm. MUSIC kogortasini tanlash va to‘rt yillik natijalar guruhlari.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm. MUSIC kogortasini tanlash va to‘rt yillik natijalar guruhlari.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-f3.jpg\" alt=\"3-rasm. To‘satdan yurak o‘limi (a) va yurak yetishmovchiligi oqibatidagi o‘lim (b) uchun unimodal (faqat EKG, faqat LLM \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm. To‘satdan yurak o‘limi (a) va yurak yetishmovchiligi oqibatidagi o‘lim (b) uchun unimodal (faqat EKG, faqat LLM matni, faqat jadval) va multimodal (EKG + jadval, EKG + LLM matni) modellarning xatolik matritsalarini taqqoslash.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-f4.jpg\" alt=\"4-rasm. To‘satdan yurak o‘limi (a) va yurak yetishmovchiligi oqibatidagi o‘lim (b) uchun unimodal (faqat EKG, faqat LLM \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm. To‘satdan yurak o‘limi (a) va yurak yetishmovchiligi oqibatidagi o‘lim (b) uchun unimodal (faqat EKG, faqat LLM matni, faqat jadval) va multimodal (EKG + jadval, EKG + LLM matni) modellarning AUROC egri chiziqlarini taqqoslash.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-f5.jpg\" alt=\"5-rasm. To‘satdan yurak o‘limi (a) va yurak yetishmovchiligi oqibatidagi o‘lim (b) uchun unimodal (faqat EKG, faqat LLM \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm. To‘satdan yurak o‘limi (a) va yurak yetishmovchiligi oqibatidagi o‘lim (b) uchun unimodal (faqat EKG, faqat LLM matni, faqat jadval) va multimodal (EKG + jadval, EKG + LLM matni) modellarning PR-AUC egri chiziqlarini taqqoslash.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-f6.jpg\" alt=\"6-rasm: Toʻsatdan yurak oʻlimi (a) va yurak yetishmovchiligidan oʻlim (b) holatlarini bashorat qilish uchun unimodal (fa\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm: Toʻsatdan yurak oʻlimi (a) va yurak yetishmovchiligidan oʻlim (b) holatlarini bashorat qilish uchun unimodal (faqat EKG, faqat LLM matni, faqat jadval maʼlumotlari) va multimodal (EKG + jadval maʼlumotlari, EKG + LLM matni) modellarning DCA egri chiziqlarini taqqoslash.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-f7.jpg\" alt=\"7-rasm: Ambulator EKG uchun diqqat xaritasi (a), LLM tomonidan yaratilgan klinik matn uchun gradientga asoslangan token \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-rasm: Ambulator EKG uchun diqqat xaritasi (a), LLM tomonidan yaratilgan klinik matn uchun gradientga asoslangan token ahamiyatliligi xaritasi (b), shuningdek, tanlangan EKG segmenti va yurak urish tezligi oʻzgaruvchanligi (HRV) koʻrsatkichlari uchun ahamiyatlilik xaritalari (c). Ushbu xaritalar EKG + LLM multimodal modeliga tegishli boʻlib, unda bemorda keyingi toʻrt yil ichida toʻsatdan yurak oʻlimi yuz berishi bashorat qilingan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-f8.jpg\" alt=\"8-rasm: Ambulator EKG uchun diqqat xaritasi (a), LLM tomonidan yaratilgan klinik matn uchun gradientga asoslangan token \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-rasm: Ambulator EKG uchun diqqat xaritasi (a), LLM tomonidan yaratilgan klinik matn uchun gradientga asoslangan token ahamiyatliligi xaritasi (b), shuningdek, tanlangan EKG segmenti va yurak urish tezligi oʻzgaruvchanligi (HRV) koʻrsatkichlari uchun ahamiyatlilik xaritalari (c). Ushbu xaritalar EKG + LLM multimodal modeliga tegishli boʻlib, unda bemorda keyingi toʻrt yil ichida yurak yetishmovchiligidan oʻlim yuz berishi bashorat qilingan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-f9.jpg\" alt=\"9-rasm: SCD va PFD bashorati uchun atributlar mustahkamligi (a, b) va tokenlarni niqoblash tahlili (c, d).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;9-rasm: SCD va PFD bashorati uchun atributlar mustahkamligi (a, b) va tokenlarni niqoblash tahlili (c, d).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-fS1.jpg\" alt=\"Rasm S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Yurak xavfini&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;bashorat&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qilish&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qiyinligi&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;EKG va klinik&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ma'lumotlar&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;integratsiyasi&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;NATIJA&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Ma'lumot&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;formati&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;aniqlikka&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ta'sir qiladi&lt;/text&gt;&lt;path st
