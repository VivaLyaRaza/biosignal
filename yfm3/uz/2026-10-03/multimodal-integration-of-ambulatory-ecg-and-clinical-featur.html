            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"248\" cy=\"124\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"512\" cy=\"291\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · CARDIOVASCULAR MEDICINE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Sun'iy intellekt to'satdan&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;yurak o'limi xavfini&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;oldindan ayta oladimi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-f1.jpg\" alt=\"1-rasm. Ambulator EKG yozuvlarini klinik xususiyatlar bilan birgalikda tahlil qilish uchun multimodal ish jarayoni.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. Ambulator EKG yozuvlarini klinik xususiyatlar bilan birgalikda tahlil qilish uchun multimodal ish jarayoni.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm. Ambulator EKG yozuvlarini klinik xususiyatlar bilan birgalikda tahlil qilish uchun multimodal ish jarayoni. EKG yozuvlari dastlabki ishlovdan o‘tkaziladi va qisqa oynalarga segmentlanadi. Har bir oyna uchun yurak urishi o‘zgaruvchanligi (HRV) ko‘rsatkichlari ajratib olinadi va Multiple Instance Learning–Temporal Convolutional Network (MIL–TCN) orqali kodlanib, EKG tasvirini, 𝜀ECG hosil qiladi. Parallel ravishda, klinik o‘zgaruvchilar katta til modeli (&lt;a href=\"concepts/llm.html\"&gt;LLM&lt;/a&gt;) tomonidan yaratilgan matn, deterministik klinik matn yoki jadval ko‘rinishidagi belgilar sifatida ifodalanadi. LLM tomonidan yaratilgan va deterministik matnlar bemor darajasidagi matnli tasvirlarni, 𝜀TXT hosil qilish uchun biomedikal matn kodlovchisi orqali kodlanadi, oldindan ishlangan jadval o‘zgaruvchilari esa jadval tasvirini, 𝜀TAB hosil qiladi. EKG, matnli va jadval tasvirlarining har biri unimodal modellar sifatida baholandi, matnli va jadval tasvirlari esa to‘satdan yurak o‘limi (SCD) va yurak yetishmovchiligi oqibatidagi o‘limni (PFD) bashorat qilish uchun multimodal modellarda EKG tasviri bilan alohida birlashtirildi. Uzuk chiziqlar multimodal birlashish uchun matnli (TXT) yoki jadval (TAB) tasviridan foydalanishni ko‘rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;To'satdan yurak o'limi va yurak yetishmovchiligi tibbiyotdagi eng dolzarb muammolardan biridir. Tadqiqotchilar EKG yozuvlarini bemorlarning tibbiy kartalari bilan birgalikda tahlil qiluvchi model yaratdilar. Raqamli ma'lumotlar va klinik axborotning uyg'unligi faqat matn yoki faqat EKG grafiklaridan foydalanishdan ko'ra samaraliroq ekanligi aniqlandi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Model MIL-TCN neyron tarmog'i orqali EKG segmentlarini tahlil qiladi.&lt;/li&gt;\n&lt;li&gt;To'satdan o'limni bashorat qilishda EKG va matn kombinatsiyasi samarali.&lt;/li&gt;\n&lt;li&gt;Yurak yetishmovchiligi xavfini baholashda jadval ma'lumotlari eng aniq natija berdi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Mualliflar to'rt yillik o'lim xavfini baholash uchun MUSIC kohortasidagi 730 nafar bemor ma'lumotlaridan foydalanishdi. Yurak elektr faoliyatini tahlil qilish uchun MIL-TCN (vaqtinchalik konvolyutsion neyron tarmoq) arxitekturasi qo'llanildi, u Xolter monitorining 30 soniyali segmentlarini qayta ishlaydi. Klinik ma'lumotlar uch formatda taqdim etildi: jadval, aniq matnli tavsiflar va katta til modellari (LLM) tomonidan yaratilgan hisobotlar.&lt;/p&gt;\n&lt;p&gt;Natijalar shuni ko'rsatdiki, to'satdan yurak o'limini (SCD) bashorat qilishda EKG va aniq matn kombinatsiyasi 0,711 AUROC ko'rsatkichiga erishdi. Yurak yetishmovchiligi (PFD) uchun esa jadval ma'lumotlariga asoslangan model eng samarali bo'ldi (AUROC 0,787). Tadqiqot shuni tasdiqladiki, multimodal modellarning samaradorligi klinik ma'lumotlarning taqdim etilish usuliga bog'liq va oddiy tuzilgan formatlar ko'pincha murakkab LLM tavsiflaridan ustun keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Bu hali taqrizdan o'tmagan preprint bo'lib, natijalarni kengroq bemorlar guruhida tekshirish zarur.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Ambulator elektrokardiogrammalar (EKG) yurakning elektr faoliyatini uzluksiz kuzatish imkonini beradi, biroq koʻplab mashinali oʻqitish yondashuvlari ushbu yozuvlarni bemorning kengroq klinik kontekstini hisobga olmasdan tahlil qiladi. Biz toʻsatdan yurak oʻlimi (TYO) va yurak yetishmovchiligi oqibatidagi oʻlimni (YYOO) toʻrt yillik prognoz qilish uchun ambulator EKGdan olingan tasvirlarni klinik maʼlumotlar bilan birlashtiruvchi multimodal tuzilmani baholadik. Tahlil MUSIC kogortasidan 730 nafar bemorni oʻz ichiga oldi, ulardan 71 tasi TYO va 82 tasi YYOO holatlari edi. Ambulator EKG yozuvlari segmentlarga boʻlindi va multiple instance learning – vaqtinchalik konvolyutsion neyron tarmoq yordamida kodlandi, klinik oʻzgaruvchilar esa katta til modeli (LLM) tomonidan yaratilgan matn, deterministik matn yoki jadval koʻrinishidagi belgilar sifatida ifodalandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Multiple instance learning — mashinali oʻqitish usuli boʻlib, unda model alohida obyektlarni emas, balki obyektlar guruhlarini («qoplar») tasniflaydi, bu EKG yozuvlarini tahlil qilish uchun mos keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Modellar beshta tashqi va toʻrtta ichki qatlamli bemor darajasidagi oʻzaro tekshiruv (nested cross-validation) yordamida ishlab chiqildi va baholandi; bunda maʼlumotlarni oldindan qayta ishlash, model va birlashtirish arxitekturasini tanlash, kalibrlash va chegaraviy qiymatlarni tanlash faqat oʻqitish maʼlumotlari bilan cheklandi. TYO uchun EKG va deterministik matn kombinatsiyasi 0,711 (95% CI, 0,643–0,773) eng yuqori AUROCga erishdi, EKG va jadval klinik belgilari esa 0,248 (0,180–0,357) eng yuqori PR-AUCni koʻrsatdi. YYOO uchun unimodal jadval modeli 0,787 (0,732–0,839) AUROC va 0,360 (0,275–0,470) PR-&lt;a href=\"concepts/area-under-the-curve.html\"&gt;AUC&lt;/a&gt; bilan eng yuqori natijani qayd etdi, EKG va jadval belgilari esa 0,756 (0,697–0,811) AUROC va 0,353 (0,261–0,461) PR-AUCni koʻrsatdi. EKG va LLM matni kombinatsiyasi faqat LLM matniga qaraganda yaxshiroq natija berdi, ammo unimodal EKG modelidan ustun kelmadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;EKG va klinik maʼlumotlarning multimodal integratsiyasi maʼlumotlarni taqdim etish turiga bogʻliqligini koʻrsatdi: deterministik va jadval formatlari LLM tomonidan yaratilgan matnlarga qaraganda koʻproq prognoz qiymatiga ega boʻldi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Attributsiya va tokenlarni maskalash tahlillari model tushuntirishlari kiritilgan maʼlumotlarning yuzaki oʻzgarishlariga qisman chidamli ekanligini, shu bilan birga model va maskalash shartlariga sezgir boʻlib qolganini tasdiqlovchi qoʻshimcha dalillarni taqdim etdi. Tasvirlar va bemor matnlari permutatsiyasi tahlili shuni koʻrsatdiki, prognoz qiymati klinik maʼlumotlarning qanday taqdim etilishiga kuchli bogʻliq. Ushbu topilmalar multimodal integratsiyaning afzalligi natija va maʼlumotlarni taqdim etish usuliga bogʻliqligini koʻrsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kuzatuv xarakteriga ega (MUSIC kogortasi), shuning uchun aniqlangan bogʻliqliklar sabab-oqibat munosabatini isbotlamaydi; natijalar klinik maʼlumotlarni taqdim etish usullarining oʻziga xosligiga bogʻliq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Toʻsatdan yurak oʻlimi (TYO) va yurak yetishmovchiligi oqibatidagi oʻlim (YYO) yurak yetishmovchiligida oʻlimning ikki asosiy sababidir. Farmakologik terapiya va tibbiy asboblardagi yutuqlarga qaramay, ushbu oqibatlar uchun yuqori xavf ostida boʻlgan shaxslarni aniq aniqlash klinik muammo boʻlib qolmoqda. Ambulator elektrokardiogrammalar (EKG), shu jumladan uzoq muddatli Holter monitoringi, yurak ritmini uzluksiz baholashni qoʻllab-quvvatlaydi, oʻtkinchi aritmiyalarni, ektopik yukni va vaqti-vaqti bilan oʻtkazuvchanlik buzilishlarini qayd etadi. Ushbu oʻtkinchi anomaliyalar TYO va YYO xavfini baholash uchun muhim prognostik maʼlumotlarni oʻz ichiga oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Toʻsatdan yurak oʻlimi va yurak yetishmovchiligi oqibatidagi oʻlim muhim muammolar boʻlib, ambulator EKG bashorat qilish uchun muhim, ammo talqin qilish qiyin boʻlgan maʼlumotlarni taqdim etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biroq, ambulator EKG yozuvlarini uzoq muddatli yurak oʻlimining ishonchli va klinik jihatdan amalga oshirilishi mumkin boʻlgan bashoratchilariga aylantirish kundalik amaliyotda murakkab va resurs talab qiladigan jarayon boʻlib qolmoqda. Mashinali oʻqitish (MO) va sunʼiy intellekt (SI) modellari ushbu muammolarni hal qilishda erta vaʼdalar berdi. SI/MO modellari toʻlqin morfologiyasini (masalan, P toʻlqinlari, QRS davomiyligi) tavsiflashda va aritmiya hodisalarini (masalan, atrial fibrillyatsiya, atrial flyutter) aniqlashda kuchli qobiliyatni namoyish etdi. Shu bilan birga, katta til modellari (KTM) ham tuzilgan, ham tuzilmagan maʼlumotlar toʻplamlarida fikr yuritish qobiliyatini namoyish etdi. Domenga moslashtirilgan tibbiy KTM klinik xususiyatlarni (masalan, demografiya, tibbiy tarix, laboratoriya qiymatlari) sintez qilishi va biomedikal mulohazalarni yaratishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;KTM (LLM) — bu katta hajmdagi matnlar asosida oʻqitilgan, tibbiy kartalarni tahlil qilib, ekspertlar kabi mantiqiy xulosalar chiqarishga qodir algoritmlar.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu yutuqlarga qaramay, muhim boʻshliqlar saqlanib qolmoqda. Ambulator EKG tahlili uchun koʻplab SI/MO modellari unimodal boʻlib, asosan bemorning kengroq kontekstini kiritmasdan, EKG yozuvidagi naqshlarni aniqlashga qaratilgan. Oldingi tadqiqotlar shuni koʻrsatadiki, klinik kontekst EKG talqiniga ham shifokorlar, ham SI/MO modellari tomonidan taʼsir qilishi mumkin. Shuning uchun EKG yozuvlarini bemor darajasidagi klinik maʼlumotlar bilan integratsiya qilish natijalarni bashorat qilish uchun qoʻshimcha maʼlumotlarni taqdim etishi mumkin. Biroq, multimodal integratsiya unumdorlikni avtomatik ravishda yaxshilamaydi: uning qiymati natijaga, har bir modalitetning vakilligiga, maʼlumotlarning bir-biriga mos kelish darajasiga va birlashtirish strategiyasiga bogʻliq boʻlishi mumkin. Shuning uchun, multimodal yondashuvlar qachon mazmunli yutuqlarni taqdim etishi va qachon taqdim etmasligini aniqlash uchun unimodal va anʼanaviy tuzilgan maʼlumotlar modellari bilan qatʼiy taqqoslashlar zarur.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Multimodal modellar har doim ham unimodal modellardan ustun emas; ularning muvaffaqiyati maʼlumotlar sifati va ularni birlashtirish strategiyasiga bogʻliq, bu esa puxta tekshiruvni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu ehtiyojni qondirish uchun biz ambulator EKG yozuvlaridan olingan bemor darajasidagi vakilliklarni tuzilgan oʻzgaruvchilar, deterministik matn yoki KTM tomonidan yaratilgan baholashlar sifatida ifodalangan klinik maʼlumotlar bilan birlashtiruvchi multimodal tizimni ishlab chiqdik va tizimli ravishda baholadik. Biz klinik foydalanish holati sifatida toʻsatdan yurak oʻlimi (TYO) va yurak yetishmovchiligi oqibatidagi oʻlimni (YYO) toʻrt yillik bashorat qilishdan foydalandik. Biz umumiy ichki oʻzaro tekshirish (nested cross-validation) doirasida unimodal va multimodal yondashuvlarni taqqosladik va unumdorlik natijalar va klinik vakilliklar boʻyicha qanday oʻzgarib turishini tekshirdik. Ushbu tadqiqotning asosiy hissalari quyidagilardan iborat:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Toʻrt yillik TYO va YYO bashorati uchun ambulator EKG, jadval klinik oʻzgaruvchilari, deterministik klinik matn va KTM tomonidan yaratilgan klinik baholashlarning qatʼiy benchmarki, shu jumladan unimodal modellar va EKG-klinik sintez modellari.&lt;/li&gt;\n&lt;li&gt;Multimodal sintez strategiyalari, shu jumladan konkatenatsiya, proyeksiyalangan konkatenatsiya, skalyar geyting, vektor geyting va tortilgan yigʻindi faqat oʻquv maʼlumotlaridan foydalangan holda solishtirilgan va tanlangan ichki oʻzaro tekshirish tizimi, bu model tanlashdagi tarafkashlikni kamaytirgan holda multimodal integratsiyani baholash imkonini beradi.&lt;/li&gt;\n&lt;li&gt;Tuzilgan oʻzgaruvchilarni qayta bayon qilish yoki takrorlashdan qoʻshimcha multimodal maʼlumotlarni ajratish uchun moʻljallangan vakillik va mustahkamlik tahlillari toʻplami, shu jumladan anʼanaviy jadval modellari, deterministik matn, mulohaza va xavf yorligʻi ablatsiyalari, EKG-ustma-ust tushish tahlillari, bemor-matn almashinuvi hamda atribut barqarorligi va perturbatsiya tahlillari.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"2-tegishli-ishlar\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#2-tegishli-ishlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Tegishli ishlar&lt;/span&gt;&lt;/a&gt;2. Tegishli ishlar&lt;/h4&gt;\n&lt;p&gt;2.1. Ambulator EKG tahlili&lt;/p&gt;\n&lt;p&gt;Erta hisoblash tadqiqotlari ambulator EKG naqshlarini yurak fenotiplari bilan bogʻlash uchun vaqt va chastota domenida xususiyatlarni ajratib olishga urgʻu berdi. Badilini va boshqalar [26] sirkadiyalik oʻzgarishlarni va beta-blokator taʼsirini baholash uchun spektral tahlilni qoʻlladilar, Bakhshi va boshqalar [27] esa aritmiyalarni sinus ritmidan ajratish uchun ikkinchi tartibli avtoregressiv modellashtirish va chiziqli klassifikatsiyadan foydalandilar. Yaqinda qilingan ishlar vakillik oʻrganish va ritm klassifikatsiyasini avtomatlashtirish uchun chuqur oʻrganishni (deep learning) qabul qildi. Huang va boshqalar [28] EKG segmentlarini spektrogrammalarga aylantirdilar va ritm klassifikatsiyasi uchun ikki oʻlchovli konvolyutsion neyron tarmoqlarini qoʻlladilar, Biton va boshqalar [29] esa RR intervallari boʻylab vaqtinchalik bogʻliqliklarni modellashtirish uchun Ar-Net2 ni taklif qildilar. Ben-Moshe va boshqalar [30] taqsimot siljishlarini hal qilish va 30 soniyalik yozuvlardan toʻgʻridan-toʻgʻri atrial fibrillyatsiyani aniqlash uchun RawECGNet ni taqdim etdilar. Han va boshqalar [31] aritmiyani aniqlash uchun Gramian Angular Field vakilliklarini koʻp misolli oʻrganish (multiple instance learning) bilan birlashtirdilar. Sameh va boshqalar [32] vaqtinchalik kontekst va ambulator EKG ning oldingi vakilligini oʻzgartirish atrial fibrillyatsiya va atrial flyutterni aniqlashga qanday taʼsir qilishini oʻrganishdi.&lt;/p&gt;\n&lt;p&gt;Ushbu yondashuvlar boʻylab ambulator EKG yozuvlari odatda qisqaroq segmentlar toʻplami sifatida tahlil qilinadi, bashoratlar segment darajasida yaratiladi va baʼzi hollarda yozuv darajasidagi natijalarni olish uchun koʻp misolli oʻrganish kabi mexanizmlar orqali birlashtiriladi. Biroq, bu strategiyalar koʻpincha lokalizatsiya qilingan ritmni aniqlash bilan cheklanadi.&lt;/p&gt;\n&lt;h4 id=\"22-llm-va-multimodal-integratsiya\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#22-llm-va-multimodal-integratsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.2. LLM va multimodal integratsiya&lt;/span&gt;&lt;/a&gt;2.2. LLM va multimodal integratsiya&lt;/h4&gt;\n&lt;p&gt;LLM va sohaga moslashtirilgan til modellari klinik matnlarni tushunish va qarorlarni qoʻllab-quvvatlash ilovalaridagi foydaliligi uchun oʻrganilgan. Li va hammualliflar BioBERTʼni taqdim etishdi, Xuan va hammualliflar esa ClinicalBERTʼni ishlab chiqishdi; har ikkala model ham klinik hikoyalar va elektron tibbiy kartalarning tuzilgan maʼlumotlarini kodlashni yaxshilash uchun transformer arxitekturasini biotibbiy va klinik korpuslarga moslashtirish maqsadida sohaga xos boʻlgan dastlabki oʻqitishdan foydalanadi. Yaqinda Se va hammualliflar Me-LLaMAʼni taklif qilishdi, Li va hammualliflar esa LLaVA-Medʼni taqdim etishdi, ular bemorlar haqidagi geterogen maʼlumotlardan umumlashtirish, savollarga javob berish va natijalarni bashorat qilish kabi yuqori darajadagi klinik mulohaza yuritishni taʼminlash uchun yoʻriqnomalarni sozlash va multimodal moslashtirish strategiyalarini oʻrganishdi.&lt;/p&gt;\n&lt;p&gt;Yan va hammualliflar aritmiya hodisalarini tasniflash va davolash strategiyalarini taklif qilish uchun ham qisqa muddatli EKG, ham klinik qaydlarni qayta ishlaydigan ECG-LMʼni yaratdilar. Ushbu yondashuvlar til modellarini matnli maʼlumotlarga va baʼzi hollarda qisqa muddatli EKG signallariga qoʻllaydi, bunda birinchi navbatda tasvirlarni oʻrganish va aritmiyani tasniflash vazifalariga eʼtibor qaratiladi. Bizga maʼlum boʻlishicha, bemorning klinik kontekstini 24 soatlik ambulator EKG signallari bilan integratsiya qilish boʻyicha ishlar cheklangan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mavjud modellar (BioBERT, ClinicalBERT, Me-LLaMA, LLaVA-Med, ECG-LM) matnlar va qisqa EKG yozuvlari bilan muvaffaqiyatli ishlaydi, biroq klinik kontekstni 24 soatlik EKG monitoringi bilan integratsiya qilish hali kam oʻrganilgan soha hisoblanadi.&lt;br /&gt;\n[!tip] LLM (Large Language Models) — bu katta hajmdagi matnlar asosida oʻqitilgan, inson nutqini tushunish va yaratish qobiliyatiga ega neyron tarmoqlar, multimodal integratsiya esa modelning bir vaqtning oʻzida turli xil maʼlumotlar turlarini, masalan, matn va EKG grafiklarini qayta ishlash qobiliyatini anglatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;h4 id=\"natijalarni-muhokama-qilish\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#natijalarni-muhokama-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalarni muhokama qilish&lt;/span&gt;&lt;/a&gt;Natijalarni muhokama qilish&lt;/h4&gt;\n&lt;p&gt;Biz ambulator EKGdan olingan tasvirlarni klinik matn va jadval koʻrinishidagi maʼlumotlar bilan birlashtiruvchi multimodal integratsiya strategiyalarini tizimli ravishda baholadik. Multimodal integratsiya har doim ham foydali boʻlavermaydi va klinik maʼlumotlarning taqdim etilish usuliga kuchli bogʻliq. SCD (toʻsatdan yurak oʻlimi) uchun EKG va deterministik matn kombinatsiyasi eng yuqori AUROC koʻrsatkichiga erishdi, EKG va jadval koʻrinishidagi klinik belgilar kombinatsiyasi esa PR-&lt;a href=\"concepts/roc-auc.html\"&gt;AUC&lt;/a&gt; boʻyicha eng yaxshi natijani koʻrsatdi. PFD (progresiv yurak yetishmovchiligi) uchun unimodal jadval modeli umuman olganda eng samarali boʻlib qoldi, EKG va jadval belgilarining kombinatsiyasi esa unimodal EKG modelidan sezilarli darajada ustun boʻlsa-da, faqat jadval belgilarining oʻzidan ustun kelmadi. EKG va LLM tomonidan yaratilgan toʻliq matn kombinatsiyasi ikkala natija uchun ham unimodal LLM modeliga nisbatan yaxshilanishni koʻrsatdi, ammo unimodal EKG modelidan ustun kelmadi. Unimodal klinik tasvirlar orasida deterministik va jadval koʻrinishidagi maʼlumotlar, ayniqsa PFD uchun, LLM tomonidan yaratilgan toʻliq baholashga qaraganda yuqoriroq diskriminatsiya qobiliyatini taʼminladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Multimodal modellarning samaradorligi klinik maʼlumotlarni taqdim etish usuliga bogʻliq: jadval koʻrinishidagi belgilar koʻpincha SCD va PFDni bashorat qilishda LLM tomonidan yaratilgan matnli tavsiflardan ustun turadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu natijalar shuni koʻrsatadiki, klinik kontekst ambulator EKG maʼlumotlarini toʻldirishi mumkin, ammo uning bashoratli qiymati ham natijaga, ham foydalanilgan taqdimot usuliga bogʻliq. Bashoratli samaradorlikdan tashqari, biz multimodal modellarda EKG diqqati va matn ahamiyatining bemor darajasidagi vizualizatsiyasini taqdim etdik. Model eʼtibor qaratgan EKG segmentlarini yurak urish tezligi oʻzgaruvchanligi belgilari va klinik matn bilan bogʻlash orqali ushbu tahlillar modelning individual bashoratlari bilan bogʻliq xususiyatlarni ajratib koʻrsatadi. Attributsiya reytinglari kirish maʼlumotlaridagi yuzaki oʻzgarishlarga nisbatan nisbatan barqaror, ammo oʻrgatilgan model parametrlaridagi oʻzgarishlarga nisbatan sezgirroq edi. Tokenlarni maskalash tahlili shuni koʻrsatdiki, gradient attributsiyasi boʻyicha eng yuqori darajadagi tokenlarni maskalash odatda tasodifiy tanlangan tokenlarni maskalashga qaraganda bashorat qilingan ehtimollikda kattaroq oʻzgarishlarga olib keldi, garchi bu farqning kattaligi natija va maskalash ulushiga qarab oʻzgardi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Attributsiya (attribution) — sunʼiy intellektni talqin qilish usuli boʻlib, u qaysi kirish maʼlumotlari (masalan, EKG segmentlari yoki matndagi soʻzlar) model qaroriga eng katta hissa qoʻshganini aniqlashga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Taqdimotlar va ustma-ust tushishlar boʻyicha ablyatsiyalar shuni koʻrsatdiki, deterministik matn va toʻgʻridan-toʻgʻri jadval koʻrinishidagi klinik oʻzgaruvchilar LLM tomonidan yaratilgan toʻliq baholashga qaraganda koʻproq bashoratli maʼlumotni saqlab qoladi. EKG xulosalarini qoʻshish jadval samaradorligiga unchalik taʼsir qilmadi va PFD uchun SCDga qaraganda LLM taqdimoti uchun foydaliroq boʻldi. Buning mumkin boʻlgan tushuntirishlaridan biri shundaki, ritm buzilishlari yurak yetishmovchiligi ogʻirligi va yurak zahirasining pasayishi belgilari uchun qoʻshimcha kontekstni taʼminlashi mumkin, bu esa progresiv nasos yetishmovchiligi bilan bevosita bogʻliq, SCD asosida yotgan geterogen aritmiya substrati esa Xolter monitoringining ushbu beshta kategoriyali xulosalari bilan toʻliq qamrab olinmasligi mumkin. Biroq, bu talqin dastlabki hisoblanadi, ayniqsa, bir xil EKG xulosalarini jadval modellariga qoʻshish ikkala natija uchun ham unchalik katta boʻlmagan samaradorlik oʻzgarishlariga olib kelgani uchun. Bundan tashqari, «bemor-matn» mosligini aralashtirish EKG va LLM sintezi samaradorligiga kam taʼsir qildi, bu esa toʻliq LLM matnli taqdimotida bemorga xos moslikni saqlash ushbu tahlil doirasida samaradorlikning oʻlchanadigan foydasini bermaganligini koʻrsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot bitta maʼlumotlar toʻplamiga asoslangan, bu natijalarni umumlashtirish imkoniyatini cheklaydi; shuningdek, SCD va PFD hodisalarining kamligi modellarning barqarorligini pasaytirishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Qaror qabul qilish egri chiziqlarini tadqiqot tahlili taqdimotga bogʻliq boʻlgan xuddi shunday qonuniyatni koʻrsatdi. Dastlabki jadval koʻrinishidagi klinik belgilarni oʻz ichiga olgan modellar «hammani davolash» va «davolamaslik» strategiyalariga nisbatan ijobiy sof foydaning eng keng sohalarini namoyish etdi, ayniqsa PFD uchun, EKG va toʻliq LLM matni esa baholangan chegara oraligʻida cheklangan foyda koʻrsatdi. Ushbu chegaralar tadqiqot xarakteriga ega boʻlgani va tasdiqlangan aralashuv strategiyasi bilan bogʻliq boʻlmagani uchun, ushbu natijalarni muayyan davolash chegarasi uchun dalil sifatida emas, balki potentsial klinik foydalilikning qiyosiy bahosi sifatida talqin qilish kerak. Bir nechta cheklovlarni hisobga olish kerak. Birinchidan, tadqiqot bitta maʼlumotlar toʻplamida oʻtkazildi; umumlashtirish imkoniyatini baholash uchun tashqi validatsiya zarur. Ikkinchidan, SCD va PFD hodisalarining nisbatan cheklangan soni modelning mustahkamligini cheklashi mumkin, ayniqsa kam uchraydigan natijalarni bashorat qilish uchun. Uchinchidan, joriy tizim toʻliq end-to-end xom signal modellashtirish oʻrniga ishlab chiqilgan HRV belgilariga tayanadi, bu esa toʻlqin shakli darajasida yanada murakkab maʼlumotlarni qamrab olishni cheklashi mumkin. Bundan tashqari, til modeli tomonidan yaratilgan mulohazalarning sifati va izchilligi matnli taqdimotlarga oʻzgaruvchanlikni kiritishi mumkin. Kelgusi ishlar ushbu yondashuvlarni mustaqil kohortalarda baholashi, end-to-end xom EKG taqdimotlarini tekshirishi va vaqt qatorlari hamda klinik taqdimotlar oʻrtasida yanada toʻldiruvchi moslashuvni oʻrganish usullarini izlashi kerak.&lt;/p&gt;\n&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;Biz ambulator EKG maʼlumotlarini turli klinik axborot shakllari bilan birlashtirib, toʻrt yillik davr uchun toʻsatdan yurak oʻlimi (TYO) va yurak yetishmovchiligi oqibatidagi oʻlimni (YYO) bashorat qiluvchi multimodal sunʼiy intellekt tizimini taqdim etamiz. Multimodal integratsiya barcha modaliklar uchun bir xil darajada emas, balki tanlangan natija va tasvirlash kombinatsiyalari uchun eng samarali boʻldi. TYO uchun EKG va deterministik matn kombinatsiyasi eng yuqori AU-&lt;a href=\"concepts/roc-krivaya.html\"&gt;ROC&lt;/a&gt; koʻrsatkichiga erishdi, EKG va jadval koʻrinishidagi klinik belgilar esa eng yuqori PR-AUC koʻrsatkichini koʻrsatdi; YYO uchun esa unimodal jadval modeli eng kuchli boʻlib qoldi. EKG va toʻliq LLM matni kombinatsiyasi faqat LLM matniga qaraganda yaxshiroq natija berdi, ammo unimodal EKG modelidan ustun kelmadi. Deterministik va jadval koʻrinishidagi tasvirlar odatda toʻliq LLM tomonidan yaratilgan baholashga qaraganda koʻproq bashoratli maʼlumotni saqlab qoldi, bemor-matn permutatsiyalari esa toʻliq LLM matni ichida bemorga xos yozishmalarni saqlashdan oʻlchanadigan foyda cheklanganligini koʻrsatdi. Diqqat, atributsiya va tokenlarni maskalash tahlillari model xatti-harakati haqida qoʻshimcha maʼlumot berdi va tushuntirishlarning model tanlovi hamda maʼlumotlardagi oʻzgarishlarga sezgirligini taʼkidladi. Umuman olganda, ushbu natijalar multimodal yurak oqibatlarini bashorat qilishda modalikni tanlash va klinik axborotni tasvirlash muhimligini taʼkidlaydi hamda tashqi kogortalarda tasvirlashga asoslangan multimodal yondashuvlarni yanada baholashni qoʻllab-quvvatlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Multimodal integratsiya har doim ham unimodal modellardan ustun emas; deterministik va jadval koʻrinishidagi maʼlumotlar LLM matnlariga qaraganda koʻproq bashoratli qiymatga ega.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AU-ROC va PR-AUC — modelning tasniflash sifatini baholovchi metrikalar boʻlib, ular modelning sinflarni ajratish qobiliyati va kam uchraydigan hodisalarni aniqlash aniqligini oʻlchaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot bashoratli model (TRIPOD+AI) hisoblanadi; natijalar klinik ahamiyatini tasdiqlash uchun mustaqil kogortalarda tashqi tekshiruvni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Jadval 1.&lt;/strong&gt; Xavfni baholash boʻyicha yoʻriqnoma&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Parametr&lt;/th&gt;\n&lt;th&gt;Chiqish formati&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;SCD xavfi (4 yil)&lt;/td&gt;\n&lt;td&gt;SCD_RISK: &amp;lt;Low/Moderate/High&amp;gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;SCD asoslanishi&lt;/td&gt;\n&lt;td&gt;SCD_RATIONALE: &lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;PFD xavfi (4 yil)&lt;/td&gt;\n&lt;td&gt;PFD_RISK: &amp;lt;Low/Moderate/High&amp;gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;PFD asoslanishi&lt;/td&gt;\n&lt;td&gt;PFD_RATIONALE: &lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;SCD — toʻsatdan yurak oʻlimi; PFD — yurak yetishmovchiligidan oʻlim.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 2.&lt;/strong&gt; Umumiy baholash qoidalari&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Qoida&lt;/th&gt;\n&lt;th&gt;Tavsif&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Dastlabki maʼlumotlar&lt;/td&gt;\n&lt;td&gt;Faqat taqdim etilgan 24 soatlik Holter monitoringi maʼlumotlaridan foydalanish&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Cheklovlar&lt;/td&gt;\n&lt;td&gt;Mavjud boʻlmagan maʼlumotlarni oʻylab topmaslik va taxmin qilmaslik&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Taqiqlangan&lt;/td&gt;\n&lt;td&gt;Bemorning yakuniy holati, kuzatuv davomiyligi, oʻlim sababi yoki keyingi voqealardan foydalanish&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Format&lt;/td&gt;\n&lt;td&gt;Chiqish formatiga qatʼiy rioya qilish, davolash boʻyicha tavsiyalar qoʻshmaslik&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"33-jadval-korinishidagi-klinik-xususiyatlar-modellari\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#33-jadval-korinishidagi-klinik-xususiyatlar-modellari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.3. Jadval koʻrinishidagi klinik xususiyatlar modellari&lt;/span&gt;&lt;/a&gt;3.3. Jadval koʻrinishidagi klinik xususiyatlar modellari&lt;/h4&gt;\n&lt;p&gt;Strukturalashtirilgan klinik oʻzgaruvchilarni matnga aylantirish ularning bashorat qilish qiymatini saqlab qolishi yoki yaxshilashini baholash uchun xuddi shu oʻzgaruvchilar toʻgʻridan-toʻgʻri jadval shaklida modellashtirildi. Asosiy jadval sharti EKG maʼlumotlarisiz LLM promptlarini yaratish uchun ishlatilgan boshlangʻich demografik maʼlumotlar, klinik xususiyatlar, tibbiy tarix, laboratoriya oʻlchovlari, yurak funksiyasi va dori vositalarini oʻz ichiga oladi. Ikkinchi shart qoʻshimcha ravishda EKGni oʻz ichiga olgan promptda ishlatilgan beshta Holter-EKG taassurotlarini oʻz ichiga oladi: qorincha ekstrasistolasi, qorincha taxikardiyasi, barqaror boʻlmagan qorincha taxikardiyasi, paroksizmal ustki qorincha taxiaritmiyasi va bradikardiya. EKGni oʻz ichiga olgan ushbu jadval sharti faqat &lt;a href=\"concepts/ablyatsiya.html\"&gt;ablyatsiya&lt;/a&gt; sifatida baholandi va asosiy jadval tahlillarida ishlatilmadi. Yetishmayotgan maʼlumotlarni toʻldirish uchun uzluksiz oʻzgaruvchilar ularning median qiymatlari bilan almashtirildi va yetishmovchilik koʻrsatkichlari bilan toʻldirildi, holbuki yetishmayotgan binar va kategoriyali qiymatlar alohida kategoriya sifatida ifodalandi. Uzluksiz oʻzgaruvchilar keyinchalik oʻrtacha qiymati nolga va standart chetlanishi birga teng boʻlishi uchun standartlashtirildi, binar va kategoriyali oʻzgaruvchilar esa one-hot kodlashdan oʻtkazildi. Barcha oldindan ishlov berish parametrlari faqat modelni moslashtirish uchun mavjud boʻlgan maʼlumotlar yordamida baholandi va baholash davomida oʻzgarishsiz qoʻllanildi. Bundan tashqari, ikkita anʼanaviy jadval modeli oilasi baholandi: L2-penalizatsiyalangan logistik regressiya va gistogrammaga asoslangan gradient busterlash. SCD va PFD bashorati uchun alohida modellar qurildi.&lt;/p&gt;\n&lt;h4 id=\"341-ekg,-matn-va-jadval-korinishlarini-tayyorlash\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#341-ekg,-matn-va-jadval-korinishlarini-tayyorlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.4.1. EKG, matn va jadval koʻrinishlarini tayyorlash&lt;/span&gt;&lt;/a&gt;3.4.1. EKG, matn va jadval koʻrinishlarini tayyorlash&lt;/h4&gt;\n&lt;p&gt;&lt;span class=\"yfm-latex\" data-content=\"%5Cbeth_0%2C%20%5Cbeth_8\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; va &lt;span class=\"yfm-latex\" data-content=\"%5Cbeth.\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; EKG, matn va jadval koʻrinishlarining oʻlchamlarini ifodalasin. EKG modaliteti uchun oʻqitilgan MIL–TCN enkoderi muzlatildi va har bir bemor uchun eʼtibor bilan birlashtirilgan (attention-pooled) chiqishdan olingan bemor darajasidagi &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon_%7BECG%7D%20%5Cin%20%5Cmathbb%7BR%7D%5E%7B%5Cbeth_0%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; koʻrinishi ajratib olindi. Matn modaliteti uchun &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon_%7BTXT%7D%20%5Cin%20%5Cmathbb%7BR%7D%5E%7B%5Cbeth_8%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; embeddinglari muzlatilgan biomedikal matn enkoderidan olindi. Bularga LLM tomonidan yaratilgan xavf baholari va deterministik klinik matn embeddinglari kiritilgan. Jadval modaliteti uchun &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon_%7BTAB%7D%20%5Cin%20%5Cmathbb%7BR%7D%5E%7B%5Cbeth.%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; yuqorida aytib oʻtilganidek, standartlashtirilgan uzluksiz oʻzgaruvchilar, uzluksiz oʻzgaruvchilarning yetishmovchilik koʻrsatkichlari va one-hot kodlangan kategoriyali oʻzgaruvchilarni oʻz ichiga olgan oldindan ishlangan klinik xususiyatlar vektori edi. Jadval koʻrinishi oʻqitilgan jadval klassifikatoridan ajratib olinmasdan, toʻgʻridan-toʻgʻri ishlatildi. Bundan tashqari, EKG koʻrinishi LLM tomonidan yaratilgan matn, deterministik matn va jadval klinik koʻrinishlari bilan alohida juftlashtirildi. Ushbu modalitetga xos koʻrinishlar quyida tasvirlangan multimodal sintez modellari uchun kirish maʼlumotlari boʻlib xizmat qildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;One-hot kodlash — kategoriyali maʼlumotlarni binar vektorlarga aylantirish usuli boʻlib, unda faqat bitta element 1 ga, qolganlari 0 ga teng boʻladi, bu esa mashinali oʻqitish modellariga raqamli boʻlmagan xususiyatlar bilan samarali ishlash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"342-multimodal-sintez-strategiyalari\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#342-multimodal-sintez-strategiyalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.4.2. Multimodal sintez strategiyalari&lt;/span&gt;&lt;/a&gt;3.4.2. Multimodal sintez strategiyalari&lt;/h4&gt;\n&lt;p&gt;&lt;span class=\"yfm-latex\" data-content=\"%5Cvartheta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; bemor uchun EKG koʻrinishi &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon_%7BECG%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; va matn koʻrinishi &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon_%7BTXT%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; berilgan holda, biz birlashtirilgan &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon_%7B%0Aabla%20%5Cvartheta%7D%20ko%CA%BBrinishini%20ishlab%20chiqarish%20uchun%20beshta%20multimodal%20sintez%20strategiyasini%20baholadik.%20Xuddi%20shu%20strategiyalar%20%5Cvarepsilon_%7BTXT%7D%20ni%20tegishli%20oldindan%20ishlangan%20jadval%20ko%CA%BBrinishi%20%5Cvarepsilon_%7BTAB%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; bilan almashtirish orqali EKG–jadval sintezi uchun ishlatildi. Toʻgʻridan-toʻgʻri konkatenatsiya (DC) modalitetga xos koʻrinishlarni proyeksiyasiz birlashtiradi: &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon_%7B%0Aabla%20%5Cvartheta%7D%20%3D%20%5B%5Cvarepsilon_%7BECG%7D%20%5Coplus%20%5Cvarepsilon_%7BTXT%7D%5D.%20(8)%20Proyeksiyalangan%20konkatenatsiya%20(PC)%20avval%20har%20bir%20modalitetni%20umumiy%20latent%20fazoga%20xaritalaydi%3A%20%5Cbeth_%7BECG%7D%20%3D%20W_0%20%5Cvarepsilon_%7BECG%7D%20%2B%20b_0%2C%20%5Cbeth_%7BTXT%7D%20%3D%20W_8%20%5Cvarepsilon_%7BTXT%7D%20%2B%20b_8%2C%20(9a)%20%5Cvarepsilon_%7B%0Aabla%20%5Cvartheta%7D%20%3D%20%5B%5Cbeth_%7BECG%7D%20%5Coplus%20%5Cbeth_%7BTXT%7D%5D%2C%20(9b)%20bu%20yerda%20W_0%20va%20W_8\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; oʻrganilgan proyeksiyalash matritsalari hisoblanadi. Skalyar geyting (SG) har ikkala proyeksiyalangan koʻrinish bilan shartlangan bemorga xos skalyar geytdan foydalanadi: &lt;span class=\"yfm-latex\" data-content=\"g_%7B%5Cvartheta%7D%20%3D%20%5Csigma%20%5C%7B%20w_g%5ET%20%5B%5Cbeth_%7BECG%7D%20%5Coplus%20%5Cbeth_%7BTXT%7D%5D%20%2B%20b_g%20%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, (10a) &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon_%7B%0Aabla%20%5Cvartheta%7D%20%3D%20g_%7B%5Cvartheta%7D%20%5Cbeth_%7BECG%7D%20%2B%20(1%20-%20g_%7B%5Cvartheta%7D)%20%5Cbeth_%7BTXT%7D.%20(10b)%20Vektorli%20geyting%20(VG)%20har%20ikkala%20modalitet%20bilan%20shartlangan%20bemorga%20xos%20geyting%20vektorini%20hisoblaydi%3A%20g_%7B%5Cvartheta%7D%20%3D%20%5Csigma%20%5C%7B%20W_g%20%5B%5Cbeth_%7BECG%7D%20%5Coplus%20%5Cbeth_%7BTXT%7D%5D%20%2B%20b_g%20%5C%7D%2C%20(11a)%20%5Cvarepsilon_%7B%0Aabla%20%5Cvartheta%7D%20%3D%20g_%7B%5Cvartheta%7D%20%5Cstar%20%5Cbeth_%7BECG%7D%20%2B%20(1%20-%20g_%7B%5Cvartheta%7D)%20%5Cstar%20%5Cbeth_%7BTXT%7D%2C%20(11b)%20bu%20yerda%20%5Cstar\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; elementma-element koʻpaytirishni bildiradi. Vaznli yigʻindi (WS) proyeksiyalangan koʻrinishlarni yagona global oʻrganilgan aralashma vazni yordamida birlashtiradi: &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon_%7B%0Aabla%20%5Cvartheta%7D%20%3D%20%5Clambda%20%5Cbeth_%7BECG%7D%20%2B%20(1%20-%20%5Clambda)%20%5Cbeth_%7BTXT%7D%2C%20%5Clambda%20%3D%20%5Csigma(s)%2C%20(12)%20bu%20yerda%20s%20%5Cin%20%5Cmathbb%7BR%7D%20barcha%20bemorlar%20uchun%20umumiy%20bo%CA%BBlgan%20o%CA%BBrganilgan%20skalyar%20parametrdir.%20Barcha%20hollarda%20%5Cvarepsilon_%7B%0Aabla%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; SCD va PFD uchun alohida vazifaga xos bashorat tarmoqlariga uzatildi. EKG+LLM matn multimodal modellarini talqin qilish uchun EKG ahamiyati MIL eʼtibor vaznlari yordamida, matn ahamiyati esa gradientga asoslangan token saliyentligi yordamida baholandi. Har bir token uchun saliyentlik uning embeddingi va bashorat qilingan SCD yoki PFD ehtimolligining ushbu embeddingga nisbatan gradienti oʻrtasidagi elementma-element koʻpaytmaning Yevklid normasi sifatida hisoblandi. Token ballari vizualizatsiya uchun LLM tomonidan yaratilgan klinik matnga qayta xaritalandi va shuning uchun ichki LLaMA generatori eʼtibor vaznlari emas, balki moslashtirilgan multimodal model ichidagi matn yoʻlini aks ettiradi.&lt;/p&gt;\n&lt;h4 id=\"351-yoqotish-funksiyalari\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#351-yoqotish-funksiyalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.5.1. Yoʻqotish funksiyalari&lt;/span&gt;&lt;/a&gt;3.5.1. Yoʻqotish funksiyalari&lt;/h4&gt;\n&lt;p&gt;EKG, matn va multimodal sintez tarmoqlari SCD va PFDni birgalikda bashorat qilish uchun koʻp vazifali maqsad yordamida oʻqitildi. Har bir vazifa uchun biz vaznli binar kross-entropiya yoʻqotish funksiyasidan foydalandik, bunda ijobiy sinf vazni oʻqitish maʼlumotlaridagi salbiy holatlarning ijobiy holatlarga nisbati sifatida belgilandi:&lt;/p&gt;\n&lt;p&gt;&lt;span class=\"yfm-latex\" data-content=\"w_t%20%3D%20%5Cfrac%7B%5Crho(t)_%7Bneg%7D%7D%7B%5Crho(t)_%7Bpos%7D%7D%2C%20t%20%5Cin%20%5C%7BSCD%2C%20PFD%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. (13)&lt;/p&gt;\n&lt;p&gt;PFD bilan ogʻrigan bemorlar SCD yoʻqotishidan chiqarib tashlandi va SCD bilan ogʻrigan bemorlar PFD yoʻqotishidan chiqarib tashlandi, shunda raqobatdosh yurak oʻlimi hodisalari salbiy natijalar sifatida koʻrib chiqilmadi. Yurak oʻlimi boʻlmagan bemorlar har ikkala vazifa uchun salbiy holatlar sifatida hissa qoʻshdilar. Umumiy maqsad ikki vazifaga xos yoʻqotishlarning yigʻindisi edi: &lt;span class=\"yfm-latex\" data-content=\"%5Cmathcal%7BL%7D%20%3D%20%5Cmathcal%7BL%7D_%7BSCD%7D%20%2B%20%5Cmathcal%7BL%7D_%7BPFD%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. (14) Anʼanaviy jadval modellari SCD va PFD uchun xuddi shu vazifaga xos sinfni vaznlash yondashuvi va raqobatdosh yurak oʻlimi natijasini istisno qilish orqali alohida moslashtirildi.&lt;/p&gt;\n&lt;h4 id=\"352-llm-va-biomedikal-matn-kodlovchi-konfiguratsiyalari\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#352-llm-va-biomedikal-matn-kodlovchi-konfiguratsiyalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.5.2. LLM va biomedikal matn kodlovchi konfiguratsiyalari&lt;/span&gt;&lt;/a&gt;3.5.2. LLM va biomedikal matn kodlovchi konfiguratsiyalari&lt;/h4&gt;\n&lt;p&gt;Klinik matn natijalari Hugging Face Transformers v4.44.2 yordamida ikkita instruksiya asosida sozlangan modellar bilan generatsiya qilindi: LLaMA-3.1-8B-Instruct va LLaMA-3.2-3B-Instruct. LLaMA modellari kvantlashsiz 16-bitli suzuvchi nuqtali aniqlikda yuklandi. Generatsiyada do_sample=False, maksimal 256 ta yangi token, 1,1 takrorlanish jarimasi, toʻrtta batch size va 42 generatsiya seedi bilan deterministik greedy decoding ishlatildi. Sampling oʻchirilganligi sababli Temperature, top-p va top-k parametrlari qoʻllanilmadi. Generatsiya toʻrtta NVIDIA GeForce RTX 2080 Ti grafik protsessorlari yordamida balanslangan qurilma joylashuvi bilan bajarildi (apparat xususiyatlari uchun 3.5.3-boʻlimga qarang). Barcha LLM inferensi mahalliy darajada yuklab olingan model vaznlari yordamida amalga oshirildi; bemor darajasidagi maʼlumotlar tashqi tijorat LLM xizmatlariga uzatilmadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Inferens — bu oʻqitilgan modeldan yangi maʼlumotlar asosida bashorat qilish yoki matn generatsiya qilish jarayoni.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Generatsiya qilingan va deterministik matn kiritishlari muzlatilgan BioBERT yoki ClinicalBERT biomedikal matn kodlovchilari yordamida kodlandi. Kodlovchilar koxorta va hodisalar soniga nisbatan oʻqitiladigan parametrlar sonini cheklash hamda ichki model tanlash jarayonida haddan tashqari moslashuv (overfitting) xavfini kamaytirish uchun muzlatilgan holda saqlandi. Ushbu dizayn, shuningdek, taqqoslashni biomedikal matn kodlovchisining muayyan natijaga moslashuvidan koʻra, klinik matn tasvirlaridan kelib chiqadigan farqlarga qaratishga imkon berdi. Matn maksimal 512 token uzunligi bilan qayta ishlandi. Ushbu uzunlikdan oshib ketadigan kiritishlar uchun 64 tokenli qadam (stride) bilan bir-birining ustiga chiqadigan 512 tokenli boʻlaklar alohida kodlandi va yakuniy 768 oʻlchamli matn embeddingini olish uchun [CLS] tokenlarining yashirin tasvirlari boʻlaklar boʻyicha oʻrtachalashtirildi. Ikkita LLaMA generatori va ikkita biomedikal matn kodlovchisi toʻrtta nomzod LLaMA–kodlovchi kombinatsiyasini belgilab berdi. Ularning tegishli model xeshlari B ilovasidagi B.1-jadvalda keltirilgan.&lt;/p&gt;\n&lt;h4 id=\"353-oqitish-protokoli,-kross-validatsiya-va-model-tanlash\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#353-oqitish-protokoli,-kross-validatsiya-va-model-tanlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.5.3. Oʻqitish protokoli, kross-validatsiya va model tanlash&lt;/span&gt;&lt;/a&gt;3.5.3. Oʻqitish protokoli, kross-validatsiya va model tanlash&lt;/h4&gt;\n&lt;p&gt;Barcha tajribalar Ubuntu operatsion tizimida ishlaydigan va NVIDIA GeForce RTX 2080 Ti grafik protsessorlari bilan jihozlangan Linux serverida oʻtkazildi. Neyron modellar PyTorch v2.5.1 va CUDA 12.4 yordamida amalga oshirildi. Modellar bemor darajasidagi ichki kross-validatsiya yordamida ishlab chiqildi va baholandi, bunda beshta oʻzaro istisno qiluvchi tashqi fold va toʻrtta ichki fold hamda 42 bazaviy tasodifiy seed ishlatildi. Foldlar toʻrt yillik natijalarning oʻzaro istisno qiluvchi toifalari boʻyicha stratifikatsiya qilindi: yurak oʻlimi yoʻqligi, SCD va PFD. Muayyan bemorning barcha EKG segmentlari, matn tasvirlari va jadval klinik tasvirlari bir xil foldga tayinlandi.&lt;/p&gt;\n&lt;p&gt;Har bir tashqi oʻqitish foldi ichida barcha model ishlab chiqish bosqichlari, jumladan, oldindan qayta ishlash, xususiyatlarni masshtablash, sinflarni vaznlash, giperparametrlarni va model konfiguratsiyasini tanlash, erta toʻxtatish, birlashtirish strategiyasini tanlash, ehtimollikni kalibrlash va klassifikatsiya chegarasini tanlash uchun toʻrt qismli ichki kross-validatsiya ishlatildi. Model tanlangandan soʻng, tanlangan konfiguratsiya toʻliq tashqi oʻqitish foldi yordamida moslashtirildi va tegishli tashqi test foldida bir marta baholandi. Tashqi test foldi model ishlab chiqish jarayonida koʻrinmas holda qoldi va uning natijalari oldindan qayta ishlash, sozlash, kalibrlash, chegara tanlash yoki model tanlash uchun ishlatilmadi. Oʻzgaruvchilarning kelib chiqishi va giperparametrlarni qidirish maydonlari haqidagi tafsilotlar mos ravishda C va D ilovalarida keltirilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ichki kross-validatsiya — model parametrlarini tanlash uchun ichki sikl, model sifatini baholash uchun esa tashqi sikl ishlatiladigan baholash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Erta toʻxtatish sozlamalari nomzod konfiguratsiyalar boʻylab qatʼiy belgilandi va sozlanishi mumkin boʻlgan giperparametrlar sifatida qaralmadi. EKG modellari maksimal 30 davr (epoch), kamida besh davr va yetti davrlik sabr (patience) bilan oʻqitildi. Matn klassifikatorlari va multimodal birlashtirish modellari maksimal 100 davr, kamida 10 davr va 15 davrlik sabr bilan oʻqitildi. SCD va PFD vazifalari boʻyicha eng yuqori oʻrtacha validatsiya AUROC qiymatiga ega nazorat nuqtasi (checkpoint) saqlab qolindi. Har bir nomzod konfiguratsiya uchun SCD va PFD AUROC qiymatlarini hisoblashdan oldin ichki validatsiya foldlaridan olingan bashoratlar birlashtirildi. Model tanlash ushbu ikki AUROC qiymatining oʻrtachasiga asoslandi, bunda yakuniy nuqtalar teng vaznga ega edi. Eng yuqori koʻrsatkichga ega konfiguratsiyadan 0,005 dan kamroq mutlaq AUROC farqiga ega konfiguratsiyalar model murakkabligi, soʻngra oʻrtacha PR-AUC boʻyicha taqqoslandi. Neyron modellar uchun murakkablik oʻqitiladigan parametrlar soni bilan aniqlandi. Jadval modellari uchun oldindan belgilangan tartib gradient bustingga nisbatan regulyatsiyali logistik regressiyani afzal koʻrdi va har bir model oilasi ichida soddaroq, kuchliroq regulyatsiyalangan konfiguratsiyalarni maʼqul deb topdi.&lt;/p&gt;\n&lt;h4 id=\"4-eksperimentlar-41-malumotlar-toplami-va-bemorlar-kohortini-tanlash\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#4-eksperimentlar-41-malumotlar-toplami-va-bemorlar-kohortini-tanlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Eksperimentlar 4.1. Maʼlumotlar toʻplami va bemorlar kohortini tanlash&lt;/span&gt;&lt;/a&gt;4. Eksperimentlar 4.1. Maʼlumotlar toʻplami va bemorlar kohortini tanlash&lt;/h4&gt;\n&lt;p&gt;Eksperimentlar ochiq foydalanish mumkin boʻlgan MUSIC (MUerte S’ubita en Insuﬁciencia Cardiaca) maʼlumotlar toʻplamidan foydalangan holda oʻtkazildi, bu surunkali yurak yetishmovchiligi boʻlgan bemorlarning istiqbolli koʻp markazli kohortidir. Maʼlumotlar toʻplami demografik xususiyatlar, tibbiy tarix, laboratoriya oʻlchovlari, dori-darmonlar va yurak faoliyati koʻrsatkichlarini oʻz ichiga olgan deidentifikatsiya qilingan klinik maʼlumotlarni oʻz ichiga oladi. Ushbu tadqiqotda faqat ochiq maʼlumotlar toʻplamida mavjud boʻlgan deidentifikatsiya qilingan oʻzgaruvchilardan foydalanildi; LLM promtlariga bemorlarning toʻgʻridan-toʻgʻri identifikatorlari kiritilmadi. Tadqiqot 2003-yil aprelidan 2004-yil dekabrigacha boʻlgan davrda sakkizta Ispaniya universitet kasalxonasidan 992 nafar bemorni qamrab oldi, kuzatuvning median davri 44 oyni tashkil etdi. Ambulator EKG maʼlumotlari SpiderView yozuvchilari (&lt;a href=\"concepts/early-life-adversity.html\"&gt;ELA&lt;/a&gt; Medical, Sorin Group, Parij, Fransiya) yordamida 200 Gts chastotada va 1 mkV amplituda aniqligida namuna olingan ikkita yoki uchta ortogonal yetaklov (X, Y va Z) bilan olindi. Signal tahlili uchun faqat Y yetaklovi ishlatildi. Bu yetaklov yuqori-pastki elektr oʻqiga mos keladi va standart 12-kanalli EKGning II yetakloviga oʻxshash yoʻnalishga ega, bu uni NeuroKit2 yordamida yurak urishini aniqlash va yurak ritmi oʻzgaruvchanligini tahlil qilish uchun mos qiladi. Boshlangʻich 24 soatlik Xolter yozuvi indeks vaqti sifatida ishlatildi va natijalar toʻrt yillik prognoz gorizonti boʻyicha belgilandi. Kohortni tanlash 2-rasmda jamlangan, tegishli boshlangʻich xususiyatlar 1-jadvalda va EKG taassurotlari 2-jadvalda keltirilgan. Roʻyxatga olingan 992 nafar bemordan biz Xolter yozuvi mavjud boʻlmagan 56 nafarini; qayd etilgan natijasi yurak oʻlimi yoʻqligi, toʻsatdan yurak oʻlimi (TYO) va progressiv yurak yetishmovchiligi (PYY) kabi oldindan belgilangan toifalarga kirmagan 57 nafarini; ilgari implantatsiya qilingan yurak qurilmasi boʻlgan 121 nafarini; yurak transplantatsiyasi tufayli tadqiqotni tark etgan 12 nafarini va toʻrt yillik natijasi aniqlanmagan 16 nafarini chiqarib tashladik. PYYni ifodalovchi ikkita maʼlumotlar toʻplami kodi bitta toifaga birlashtirildi va TYO hamda PYY prognoz gorizonti ichida oʻzaro istisno qilindi. Yakuniy kohort uchta oʻzaro istisno qiluvchi toʻrt yillik natija yorligʻiga ega 730 nafar bemorni oʻz ichiga oldi: 577 nafari yurak oʻlimisiz, 71 nafari TYO bilan va 82 nafari PYY bilan. Bemor darajasidagi ichki oʻzaro tekshiruv har biri 146 bemordan iborat beshta oʻzaro istisno qiluvchi tashqi qatlamdan foydalandi, bu har bir iteratsiyada modelni ishlab chiqish uchun 584 bemor va ajratilgan baholash uchun 146 bemorni berdi. Tashqi qatlamlar uchta natija toifasi boʻyicha tabaqalashtirildi va har bir tashqi oʻquv toʻplami modelni ishlab chiqish va tanlash uchun toʻrt qismli ichki oʻzaro tekshiruvdan oʻtkazildi. Alohida binar klassifikatsiya vazifalari uchun TYO guruhi yurak oʻlimi boʻlmagan guruh bilan solishtirildi, PYY boʻlgan bemorlar esa chiqarib tashlandi (n = 648).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ichki oʻzaro tekshiruv (nested cross-validation) — bu modelni baholash usuli boʻlib, unda maʼlumotlar tashqi bloklarga (test uchun) va ichki bloklarga (parametrlar sozlamalari uchun) boʻlinadi, bu esa ortiqcha moslashuvning (overfitting) oldini oladi va prognoz aniqligini xolisona baholashga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"dori-darmonlar\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#dori-darmonlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dori-darmonlar&lt;/span&gt;&lt;/a&gt;Dori-darmonlar&lt;/h4&gt;\n&lt;p&gt;Kalsiy kanallari blokatorlari 112 (15,3) 87 (15,1) 15 (21,1) 10 (12,2). Qandli diabet uchun dorilar 221 (30,3) 160 (27,7) 26 (36,6) 35 (42,7). Amiodaron 130 (17,8) 93 (16,1) 18 (25,4) 19 (23,2). Angiotenzin II retseptorlari blokatorlari 131 (17,9) 106 (18,4) 10 (14,1) 15 (18,3). Antikoagulyantlar/antitrombotik vositalar 610 (83,6) 487 (84,4) 59 (83,1) 64 (78,0). Beta-blokatorlar 501 (68,6) 417 (72,3) 45 (63,4) 39 (47,6). Digoksin 236 (32,3) 173 (30,0) 27 (38,0) 36 (43,9). Ilmoqli diuretiklar 512 (70,1) 392 (67,9) 53 (74,6) 67 (81,7). Spironolakton 260 (35,6) 188 (32,6) 35 (49,3) 37 (45,1). Statinlar 324 (44,4) 256 (44,4) 35 (49,3) 33 (40,2). Gidralazin 20 (2,7) 14 (2,4) 3 (4,2) 3 (3,7). AAF ingibitorlari 580 (79,5) 476 (82,5) 50 (70,4) 54 (65,9). Nitro-vazodilatatorlar 90 (12,3) 64 (11,1) 13 (18,3) 13 (15,9). Qiymatlar mavjud bo'lgan dastlabki kuzatuvlarga asoslangan; yetishmayotgan qiymatlar tavsifiy xulosalar uchun imputatsiya qilinmagan. Yosh (φ=1), albumin (φ=1), gamma-glutamiltransferaza (φ=1), glyukoza (φ=1), gemoglobin (φ=3), HDL (φ=24), kaliy (φ=1), LDL (φ=24), natriy (φ=1), Pro-BNP (φ=71), oqsil (φ=1), T3 (φ=273), T4 (φ=86) va troponin (φ=110) bo'yicha ma'lumotlar yetishmovchiligi mavjud edi. Boshqa barcha ko'rsatkichlar to'liq edi. Modelni moslashtirish uchun uzluksiz o'zgaruvchilar yetishmayotganlik indikatori bilan tegishli o'quv foldining medianasi yordamida imputatsiya qilindi, yetishmayotgan binar va kategorik o'zgaruvchilar esa alohida kategoriya sifatida ifodalandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Imputatsiya — bu statistik tahlil uchun ma'lumotlar to'plamining hajmini saqlab qolish maqsadida yetishmayotgan qiymatlarni to'ldirish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Yakuniy to'rt yillik MUSIC kogortasida natijalar bo'yicha tabaqalashtirilgan Holter asosidagi EKG taassurotlari. Qiymatlar n (%) ko'rinishida keltirilgan.&lt;/p&gt;\n&lt;h4 id=\"ekg-taassurotlari\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#ekg-taassurotlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;EKG taassurotlari&lt;/span&gt;&lt;/a&gt;EKG taassurotlari&lt;/h4&gt;\n&lt;p&gt;Qorincha ekstrasistolasi: Yo'q 19 (2,6) 18 (3,1) 0 (0,0) 1 (1,3); Monomorf 213 (29,5) 187 (32,7) 11 (15,7) 15 (18,8); Polimorf 490 (67,9) 367 (64,2) 59 (84,3) 64 (80,0). Qorincha taxikardiyasi: Yo'q 460 (63,9) 387 (68,1) 35 (50,0) 38 (46,3); Barqaror bo'lmagan QT 260 (36,1) 181 (31,9) 35 (50,0) 44 (53,7). Barqaror bo'lmagan qorincha taxikardiyasi: Yo'q 523 (71,6) 439 (76,1) 37 (52,1) 47 (57,3); Ha 207 (28,4) 138 (23,9) 34 (47,9) 35 (42,7). Paroksizmal supraventrikulyar taxiaritmiya: Yo'q 406 (56,2) 332 (58,3) 35 (49,3) 39 (47,6); TPSV 168 (23,3) 135 (23,7) 16 (22,5) 17 (20,7); Paroksizmal AF 4 (0,6) 2 (0,4) 1 (1,4) 1 (1,2); Paroksizmal bo'lmacha lipillashi 1 (0,1) 0 (0,0) 1 (1,4) 0 (0,0); Surunkali AF tufayli qo'llanilmaydi 143 (19,8) 100 (17,6) 18 (25,4) 25 (30,5). Bradikardiya: Yo'q 532 (92,4) 435 (92,8) 46 (88,5) 51 (92,7); Sinus tuguni disfunksiyasi 17 (3,0) 13 (2,8) 3 (5,8) 1 (1,8); Birinchi darajali AV blokada 8 (1,4) 5 (1,1) 1 (1,9) 2 (3,6); Ikkinchi darajali AV blokada, I tur 9 (1,6) 8 (1,7) 0 (0,0) 1 (1,8); Ikkinchi darajali AV blokada, II tur 7 (1,2) 6 (1,3) 1 (1,9) 0 (0,0); Uchinchi darajali AV blokada 1 (0,2) 0 (0,0) 1 (1,9) 0 (0,0); Paroksizmal AV blokada 2 (0,3) 2 (0,4) 0 (0,0) 0 (0,0).&lt;/p&gt;\n&lt;p&gt;Kardial o'lim bo'lmagan guruh bilan solishtirilganda, SCD (to'satdan kardial o'lim) bilan og'rigan bemorlar chiqarib tashlandi (φ = 659). Kogortadan chiqarib tashlash va yakuniy nuqtalar bo'yicha tahlil populyatsiyalari haqida batafsil ma'lumot E ilovasida keltirilgan.&lt;/p&gt;\n&lt;h4 id=\"42-samaradorlikni-baholash\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#42-samaradorlikni-baholash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2. Samaradorlikni baholash&lt;/span&gt;&lt;/a&gt;4.2. Samaradorlikni baholash&lt;/h4&gt;\n&lt;p&gt;Samaradorlik birlashtirilgan tashqi test bashoratlari yordamida baholandi. Beshta tashqi foldning barchasidan olingan bashoratlar SCD va PFD yakuniy nuqta kogortalari uchun alohida birlashtirildi va har bir samaradorlik metriklari mos keladigan birlashtirilgan ajratilgan bashoratlar to'plamidan bir marta hisoblab chiqildi. Diskriminatsiya qobiliyati qabul qiluvchining operatsion xarakteristikasi egri chizig'i ostidagi maydon (AUROC) va aniqlik-qaytarish egri chizig'i ostidagi maydon (PR-AUC) yordamida xom bashorat ballaridan baholandi [50]. Ehtimollik kalibrlash har bir tashqi fold va natija ichida Platt masshtablash yordamida alohida amalga oshirildi, u tashqi o'quv kogortasidan olingan ichki folddan tashqari bashoratlarga moslashtirildi. Moslashtirilgan kalibrlash xaritasi tegishli tashqi test bashoratlariga o'zgarishsiz qo'llanildi. Kalibrlash kalibrlash grafiklari, kalibrlash intersepti, kalibrlash qiyaligi va Brier balli yordamida baholandi. Kalibrlash intersepti va qiyaligi kuzatilgan binar natijani kalibrlangan bashorat qilingan ehtimollikning log-odds qiymatiga regressiya qilish orqali baholandi:&lt;/p&gt;\n&lt;p&gt;$ ext{logit}( ext{Pr}(y_i = 1)) = \\alpha + \\beta \\cdot  ext{logit}(\\hat{p}_i), (15)$&lt;/p&gt;\n&lt;p&gt;bu yerda &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7Bp%7D_i\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — i bemor uchun ijobiy natija (ya'ni SCD yoki PFD) uchun kalibrlangan bashorat qilingan ehtimollik. Brier balli $ ext{Brier} = \\frac{1}{n} \\sum_{i=1}^{n} (y_i - \\hat{p}_i)^2$ sifatida hisoblab chiqildi. (16)&lt;/p&gt;\n&lt;p&gt;Chegaraviy baholash uchun har bir tashqi fold va yakuniy nuqta uchun faqat kalibrlangan ichki folddan tashqari bashoratlardan foydalangan holda Youden statistikasini maksimallashtirish orqali klassifikatsiya chegarasi tanlandi. Bog'liq qiymatlar yuqoriroq sezgirlikka ega chegarani, so'ngra pastroq chegarani tanlash orqali hal qilindi. Tanlangan chegara tegishli tashqi test bashoratlariga o'zgarishsiz qo'llanildi. TP, TN, FP va FN mos ravishda haqiqiy ijobiy, haqiqiy salbiy, noto'g'ri ijobiy va noto'g'ri salbiy natijalar sonini bildirsin. Quyidagi chegaraviy metrikalar hisoblab chiqildi:&lt;/p&gt;\n&lt;p&gt;$ ext{Accuracy} = \\frac{TP + TN}{TP + TN + FP + FN}, (17)$&lt;/p&gt;\n&lt;p&gt;$ ext{Sensitivity (&lt;a href=\"concepts/recall.html\"&gt;Recall&lt;/a&gt;)} = \\frac{TP}{TP + FN}, (18)$&lt;/p&gt;\n&lt;p&gt;$ ext{&lt;a href=\"concepts/ppv.html\"&gt;PPV&lt;/a&gt; (Precision)} = \\frac{TP}{TP + FP}, (20)$&lt;/p&gt;\n&lt;p&gt;$ ext{F1 score} = \\frac{2TP}{2TP + FP + FN}. (22)$&lt;/p&gt;\n&lt;p&gt;Noaniqlik 5000 bemor darajasidagi butstrap replikatsiyalari yordamida miqdoriy baholandi, ulardan diskriminatsiya, kalibrlash va chegaraviy metrikalar uchun 95% ishonch intervallari hisoblab chiqildi. Modellar o'rtasidagi taqqoslashlar juftlashtirilgan butstrap resempling yordamida amalga oshirildi, bunda har bir replikatsiyada ikkala model uchun bir xil resempling qilingan bemorlardan foydalanildi. Xolm protsedurasi har bir oldindan belgilangan taqqoslash oilasi ichida ko'p sonli taqqoslashlar uchun tuzatish kiritishda ishlatildi. 0,05 dan kichik p-qiymati statistik jihatdan ahamiyatli deb hisoblandi. Eksplorativ qarorlar egri chizig'i tahlili foldga xos kalibrlangan tashqi test ehtimolliklari yordamida amalga oshirildi [51]. p_t xavf chegarasida sof foyda $ ext{NetBenefit} = \\frac{TP(p_t)}{n} - \\frac{FP(p_t)}{n} \\cdot \\frac{p_t}{1 - p_t}$ sifatida hisoblab chiqildi. (23)&lt;/p&gt;\n&lt;p&gt;Modelning sof foydasi 2% dan 25% gacha bo'lgan chegaralar bo'yicha «barchani davolash» va «hech kimni davolamaslik» strategiyalari bilan bemor darajasidagi butstrap noaniqligi bilan solishtirildi. Ushbu eksplorativ diapazon kuzatilgan hodisalar tarqalishini va xavfga nisbatan keng tolerantlikni qamrab oldi; ammo, bashorat qilingan to'rt yillik SCD yoki PFD xavfi uchun hech qanday aralashuvga xos chegara diapazoni klinik jihatdan tasdiqlanmagan [52, 53]. Shunga ko'ra, qarorlar egri chiziqlari model xatti-harakatlarini solishtirish uchun ishlatilgan va o'rnatilgan klinik foydalilik dalili sifatida talqin qilinmagan.&lt;/p&gt;\n&lt;h4 id=\"43-tajriba-natijalari\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#43-tajriba-natijalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3. Tajriba natijalari&lt;/span&gt;&lt;/a&gt;4.3. Tajriba natijalari&lt;/h4&gt;\n&lt;p&gt;SCD va PFD bashorati uchun unimodal va multimodal modellarning samaradorlik metrikalari mos ravishda 3-jadval va 4-jadvalda jamlangan. Tegishli xatolik matritsalari, AUROC egri chiziqlari, PR-AUC grafiklari va qaror qabul qilish egri chiziqlari mos ravishda 3-rasm, 4-rasm, 5-rasm va 6-rasmda koʻrsatilgan. Kalibrlash grafiklari va jadvallari F ilovasidagi SN-rasm va SN-jadvalda keltirilgan. Modellarning batafsil taqqoslanishi ham F ilovasidagi SN-jadval va SN-jadvalda koʻrsatilgan. Miqdoriy samaradorlikni baholashdan tashqari, 7-rasm va 8-rasmda SCD va PFD holatlari uchun EKG segmentlari va klinik matn boʻyicha multimodal model atributsiyasi vizuallashtirilgan. Atributsiya mustahkamligi modelni qayta sozlash, maʼnoni saqlovchi kirish maʼlumotlarini oʻzgartirish va tokenlarni maskalash tajribalari yordamida baholandi. Vakillik va ustma-ust tushish ablatsiyalari LLM tomonidan yaratilgan matn, deterministik matn, toʻgʻridan-toʻgʻri jadval koʻrinishidagi klinik oʻzgaruvchilar va Holter EKG xulosalarining kiritilishini 5-jadvalda jamlangani kabi taqqosladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Atributsiya — bu sunʼiy intellektning qaror qabul qilish jarayonida qaysi maʼlumotlar (masalan, EKG qismlari yoki matndagi soʻzlar) eng muhim taʼsirga ega ekanligini aniqlash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"431-unimodal-model-samaradorligi\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#431-unimodal-model-samaradorligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3.1. Unimodal model samaradorligi&lt;/span&gt;&lt;/a&gt;4.3.1. Unimodal model samaradorligi&lt;/h4&gt;\n&lt;p&gt;Biz dastlab EKG asosidagi vakillikni, LLM tomonidan yaratilgan toʻliq klinik baholashni va jadval koʻrinishidagi klinik belgilarni alohida unimodal kirish maʼlumotlari sifatida baholadik. Deterministik matn vakilligi ham bir xil klinik oʻzgaruvchilarni qatʼiy formatda ifodalash uchun nazorat sifatida baholandi. SCD bashorati uchun jadval modeli AUROC va PR-AUC boʻyicha eng yuqori nuqtali baholarni koʻrsatdi, undan keyin deterministik matn, faqat EKG va toʻliq LLM matn modellari keladi. Toʻliq LLM vakilligiga nisbatan, jadval vakilligi...&lt;/p&gt;\n&lt;p&gt;[SCD va PFD bashorati uchun unimodal va multimodal modellarni taqqoslash, 95% ishonch intervallari bilan.]&lt;/p&gt;\n&lt;h4 id=\"multimodal\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#multimodal\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Multimodal&lt;/span&gt;&lt;/a&gt;Multimodal&lt;/h4&gt;\n&lt;p&gt;ECG+fullLLMtext: 0,603; 0,170; 0,109; 0,646; 0,184; 0,537; 0,662; 0,910; 0,274 (0,538–0,666; 0,130–0,240; 0,091–0,128; 0,610–0,681; 0,136–0,236; 0,431–0,643; 0,623–0,699; 0,882–0,936; 0,209–0,338). ECG+deterministictext: 0,675; 0,240; 0,104; 0,677; 0,209; 0,573; 0,692; 0,919; 0,306 (0,612–0,735; 0,172–0,327; 0,086–0,122; 0,640–0,713; 0,156–0,264; 0,463–0,681; 0,653–0,728; 0,892–0,944; 0,236–0,373). ECG+tabularclinicalfeatures: 0,756; 0,353; 0,097; 0,763; 0,292; 0,634; 0,782; 0,938; 0,400 (0,697–0,811; 0,261–0,461; 0,080–0,114; 0,730–0,794; 0,227–0,361; 0,529–0,741; 0,747–0,814; 0,915–0,958; 0,323–0,476).&lt;/p&gt;\n&lt;p&gt;Model AUROC koʻrsatkichini 0,165 ga (95% CI, 0,073–0,255; tuzatilgan p=0,052) va PR-AUC koʻrsatkichini 0,112 ga (95% CI, 0,041–0,204; tuzatilgan p=0,032) oshirdi. Tegishli AUROC farqi koʻplik tuzatishidan keyin statistik jihatdan ahamiyatli boʻlib qolmadi, PR-AUC farqi esa ahamiyatli boʻlib qoldi. SCD boʻyicha boshqa hech qanday unimodal taqqoslash Holm tuzatishidan keyin statistik jihatdan ahamiyatli boʻlmadi. PFD bashorati uchun jadval modeli eng yuqori AUROC va PR-AUC koʻrsatkichlarini berdi, undan keyin deterministik matnli ifodalash keldi. Toʻliq LLM ifodalashiga nisbatan, jadval modeli AUROC boʻyicha 0,321 ga (95% CI, 0,236–0,404; tuzatilgan p=0,014) va PR-AUC boʻyicha 0,229 ga (95% CI, 0,136–0,331; tuzatilgan p=0,014) yuqoriroq natija koʻrsatdi. Jadval modeli, shuningdek, AUROC boʻyicha deterministik matn ifodalashidan 0,111 ga (95% CI, 0,057–0,169; tuzatilgan p=0,014) ustun keldi, garchi ularning PR-AUC farqi statistik jihatdan ahamiyatli boʻlmasa ham. Deterministik matn, shuningdek, PFD uchun AUROC, PR-AUC va Brier balli boʻyicha toʻliq LLM matnidan ustun keldi, barcha uchta taqqoslash uchun tuzatilgan p=0,014. Kalibrlangan Brier ballari SCD modellari boʻyicha umuman oʻxshash edi, PFD uchun esa deterministik matn ifodalash toʻliq LLM ifodalashiga qaraganda yaxshiroq kalibrlash xatosini koʻrsatdi. Umuman olganda, toʻgʻridan-toʻgʻri jadval va deterministik ifodalashlar bir xil klinik oʻzgaruvchilarni toʻliq LLM tomonidan yaratilgan klinik baholashga aylantirishdan koʻra koʻproq bashoratli maʼlumotni saqlab qoldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AUROC va PR-AUC — klassifikatsiya sifatini baholash metrikalari: birinchisi modelning sinflarni ajratish qobiliyatini, ikkinchisi esa maʼlumotlar nomutanosib boʻlganda aniqlikni baholaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"432-multimodal-sintez-samaradorligi\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#432-multimodal-sintez-samaradorligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3.2. Multimodal sintez samaradorligi&lt;/span&gt;&lt;/a&gt;4.3.2. Multimodal sintez samaradorligi&lt;/h4&gt;\n&lt;p&gt;Keyinchalik, biz EKG ifodalashlarining matnli va jadval klinik maʼlumotlar ifodalashlari bilan multimodal sintezini baholadik. Har bir modal juftlik va tashqi qatlam uchun LLaMA LLM, biomedikal matn kodlovchisi, quyi matn klassifikatori va sintez arxitekturasi faqat tegishli ichki kross-validatsiya maʼlumotlari yordamida tanlandi. Shunga koʻra, xabar qilingan multimodal samaradorlik barcha tashqi qatlamlarga qoʻllaniladigan yagona sintez arxitekturasi emas, balki qatlamga xos tanlangan konfiguratsiyalardan olingan birlashtirilgan tashqi test bashoratlarini ifodalaydi. Bu yerda «LLMtext» tanlangan LLaMA LLM tomonidan tuzilgan bemor oʻzgaruvchilaridan yaratilgan va keyinchalik tanlangan biomedikal matn kodlovchisi tomonidan kodlangan toʻliq klinik xavfni baholash matnini anglatadi.&lt;/p&gt;\n&lt;p&gt;SCD bashorati uchun ECG+fullLLMtext 0,591 AUROC va 0,158 PR-AUC ga erishdi, bu unimodal LLM-text modeliga qaraganda yuqoriroq nuqtali baholarga ega, ammo unimodal EKG modeliga qaraganda pastroq nuqtali baholarga ega. ECG+deterministictext SCD AUROC boʻyicha eng yuqori nuqtali bahoga erishdi (0,711), ECG+tabularclinicalfeatures esa eng yuqori PR-AUC nuqtali bahosini (0,248) berdi. Oldindan belgilangan multimodal va tegishli unimodal taqqoslashlarning hech biri statistik jihatdan ahamiyatli deb topilmadi. PFD bashorati uchun ECG+fullLLMtext 0,603 AUROC va 0,170 PR-AUC ga erishdi. Uning AUROC koʻrsatkichi unimodal full LLM-text modelidan 0,136 ga (95% CI, 0,059–0,215; tuzatilgan p=0,028) oshdi, garchi tegishli PR-AUC va Brier balli farqlari statistik jihatdan ahamiyatli boʻlmasa ham. ECG+tabularclinicalfeatures 0,756 AUROC va 0,353 PR-AUC ga erishdi. Unimodal EKG modeliga nisbatan bu AUROC ning 0,129 ga (95% CI, 0,072–0,186; tuzatilgan p=0,014) yaxshilanishiga va PR-AUC ning 0,171 ga (95% CI, 0,085–0,259; tuzatilgan p=0,041) yaxshilanishiga, shuningdek, Brier ballining 0,010 ga (95% CI, 0,005–0,016; tuzatilgan p=0,041) kamayishiga toʻgʻri keldi. Biroq, ECG+tabularclinicalfeatures unimodal jadval modelidan ustun kelmadi. ECG+deterministictext faqat deterministik matn kabi ishladi. Chegaraviy metrikalar oʻxshash natijani koʻrsatdi. SCD uchun unimodal EKG modeli eng yuqori aniqlik, pretsizionlik va spesifiklikni saqlab qoldi, ECG+deterministictext esa baholangan modellar orasida eng yuqori F1 balliga erishdi. PFD uchun unimodal jadval modeli eng yuqori sezgirlik, NPV va F1 ballini saqlab qoldi, ECG+tabularclinicalfeatures esa eng yuqori aniqlik, pretsizionlik va spesifiklikka erishdi. Umuman olganda, multimodal sintez barcha modal juftliklar boʻyicha samaradorlikni bir xilda yaxshilashdan koʻra, tanlangan natijalar va klinik ifodalashlar uchun foyda keltirdi.&lt;/p&gt;\n&lt;h4 id=\"433-qaror-qabul-qilish-egri-chiziqlarini-tadqiqot-tahlili\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#433-qaror-qabul-qilish-egri-chiziqlarini-tadqiqot-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3.3. Qaror qabul qilish egri chiziqlarini tadqiqot tahlili&lt;/span&gt;&lt;/a&gt;4.3.3. Qaror qabul qilish egri chiziqlarini tadqiqot tahlili&lt;/h4&gt;\n&lt;p&gt;Qaror qabul qilish egri chiziqlarini tadqiqot tahlili unimodal (EKG, LLM-matn va jadval) modellarni, shuningdek, ichki tanlangan EKG + LLM-matn va EKG + jadval modellarini baholadi. Ushbu modellar 2% dan 25% gacha boʻlgan xavf chegaralarida «barchani davolash» va «hech kimni davolash» referent strategiyalari bilan solishtirildi, bunda sof foyda uchun 95% li nuqtali ishonch intervallari 5000 ta bemor darajasidagi butstrap replikatsiyalari asosida olindi. SCD (toʻsatdan yurak oʻlimi) bashorati uchun EKG + LLM-matn modeli baholangan chegara oraligʻida har doim ham ikkala referent strategiyadan ustun kelmadi. Aksincha, EKG + jadval klinik belgilari modeli har ikki strategiyaga nisbatan taxminan 8,8%–21,8% oraligʻida ijobiy sof foyda koʻrsatdi. Unimodal jadval modeli taxminan 8,3%–20,0% diapazonining koʻp qismida qulay sof foydani koʻrsatdi, unimodal EKG modeli esa taxminan 10,8%–14,0% boʻlgan torroq intervalda har ikki strategiyadan ustun keldi. PFD (progressiv yurak yetishmovchiligi) bashorati uchun EKG + LLM-matn modeli taxminan 11,0%–13,0% boʻlgan tor chegara oraligʻida har ikki strategiyadan ustun keldi. Unimodal jadval modeli taxminan 6,5% dan 25,0% gacha boʻlgan koʻpgina chegaralarda, EKG + jadval klinik belgilari modeli esa 6,8% dan 24,5% gacha boʻlgan chegaralarda ijobiy sof foyda taqdim etdi. Shunday qilib, ijobiy sof foydaning eng keng va barqaror hududlari asl jadval klinik belgilarini oʻz ichiga olgan modellar uchun kuzatildi. Ushbu toʻrt yillik natijalar uchun hech qanday aralashuvga xos xavf chegarasi klinik jihatdan tasdiqlanmaganligi sababli, 2%–25% intervali kuzatilgan hodisalar tarqalishi va mumkin boʻlgan xavf tolerantliklarini qamrab oluvchi tadqiqot diapazoni sifatida tanlandi. Bundan tashqari, ishonch intervallari nuqtali boʻlib, butun chegara oraligʻida bir vaqtning oʻzida qamrovni taʼminlamaydi. Shuning uchun ushbu topilmalar gipotetik qaror qabul qilish chegaralari ostida qiyosiy model xatti-harakatlarini tavsiflaydi va muayyan klinik harakatlar bilan bogʻliq chegaralardan foydalangan holda kelajakdagi tashqi va istiqbolli tadqiqotlar uchun asos yaratadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Qaror qabul qilish egri chiziqlarini tahlil qilish (Decision Curve Analysis) — bu diagnostik modellarning klinik foydaliligini baholash usuli boʻlib, u xavf ehtimolligi chegaralarida haqiqiy ijobiy holatlarni aniqlashdan olingan foyda va notoʻgʻri ijobiy natijalardan kelib chiqadigan zararni muvozanatlashni hisobga oladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"434-model-atributsiyasi-va-mustahkamlik-tahlillari\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#434-model-atributsiyasi-va-mustahkamlik-tahlillari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3.4. Model atributsiyasi va mustahkamlik tahlillari&lt;/span&gt;&lt;/a&gt;4.3.4. Model atributsiyasi va mustahkamlik tahlillari&lt;/h4&gt;\n&lt;p&gt;EKG + LLM-matn multimodal modellarining xatti-harakatlarini tasvirlash uchun biz SCD va PFDni boshdan kechirishi bashorat qilingan vakil bemorlar uchun EKG diqqat (attention) va matn-salientlik vizualizatsiyalarini mos ravishda 7-rasm va 8-rasmda taqdim etamiz. Toʻliq ambulator EKG boʻyicha hisoblangan diqqat ogʻirliklari (7a-rasm va 8a-rasm) bitta izolyatsiya qilingan intervalda emas, balki 24 soatlik yozuv davomida taqsimlangan. Ushbu naqshlar vaqtinchalik agregatsiya mexanizmi yozuvning bir nechta qismlaridan olingan maʼlumotlarni oʻz ichiga olganligini koʻrsatadi. LLM tomonidan yaratilgan klinik baholashlar uchun (7b-rasm va 8b-rasm) gradientga asoslangan token salientligi yaratilgan matnning bir nechta qismlari boʻylab taqsimlangan, jumladan LVEF, NYHA klassi, Pro-BNP, xavf belgilari va yurak yetishmovchiligi ogʻirligi yoki funksional holati boʻyicha bayonotlar kabi klinik jihatdan tegishli deskriptorlar. Mahalliy EKG xatti-harakatlarini oʻrganish uchun vakil 30 soniyalik segmentlar segment darajasidagi HRV belgilari va ularning mos keladigan salientlik qiymatlari bilan birga koʻrsatilgan (7c-rasm va 8c-rasm). Vizualizatsiyalar vaqtinchalik agregatsiya paytida tayinlangan diqqat yurak urish tezligi, SDNN, RMSSD, pNN50, eng uzun RR pauzasi va fokal segment atrofidagi PVC yukidagi oʻzgarishlar bilan birga qanday tekshirilishi mumkinligini koʻrsatadi. Umuman olganda, ushbu vizualizatsiyalar model qaysi vaqtinchalik va klinik belgilarga urgʻu berishini tekshirishning qoʻshimcha usulini taqdim etadi, bu esa model bashoratlarini SCD va PFD bilan bogʻliq patofiziologiyaning tanib olinadigan jihatlari bilan bogʻlashga yordam beradi. Biz matn atributsiyasi reytinglarining barqarorligini bir nechta nazorat qilinadigan buzilishlar ostida qoʻshimcha ravishda baholadik (9a,b-rasm). Atributsiya reytinglari integratsiya bosqichlari sonidagi oʻzgarishlarga nisbatan yuqori darajada barqaror edi va maʼnoni saqlaydigan kiritish buzilishlari, jumladan boʻsh joy, tinish belgilari, qator tartibi va neytral prefiks oʻzgarishlari ostida nisbatan barqaror boʻlib qoldi. Barqarorlik turli xil tasodifiy urugʻlar (random seeds) bilan takroriy tashqi oʻqitish qayta moslashuvlarida pastroq boʻldi, SCD uchun oʻrtacha Spearman korrelyatsiyasi 0,596 va PFD uchun 0,594 ni tashkil etdi. Klassifikator boshini randomizatsiya qilish atributsiya kelishuvini yanada pasaytirdi, SCD va PFD uchun oʻrtacha Spearman korrelyatsiyalari mos ravishda 0,492 va 0,484 ni tashkil etdi. Umuman olganda, har ikkala natija uchun ham oʻxshash naqshlar kuzatildi, bu atributsiya reytinglari yuzaki kiritish oʻzgarishlariga nisbatan mustahkam, ammo oʻrnatilgan model parametrlaridagi oʻzgarishlarga nisbatan sezgirroq ekanligini koʻrsatadi. Nihoyat, yuqori salientlikka ega tokenlar bashorat qilingan ehtimolliklarga koʻproq taʼsir qiladimi yoki yoʻqligini baholash uchun token maskalashdan foydalanildi (9c,d-rasm). Ishtirok etgan, maxsus boʻlmagan tokenlar orasida yuqori va past salientlikdagi tokenlar gradientga asoslangan token salientligi boʻyicha mos ravishda yuqori va pastki qismda joylashganlar deb belgilandi, tasodifiy maskalash esa teng miqdordagi munosib tokenlarni almashtirishsiz bir xilda tanlab oldi. Yuqori atributsiyali tokenlarni maskalash odatda tasodifiy maskalashga qaraganda bashorat qilingan ehtimollikda kattaroq mutlaq oʻzgarishlarni keltirib chiqardi, garchi bu farqning kattaligi maskalash fraksiyasiga qarab oʻzgargan boʻlsa ham. SCD uchun yuqori atributsiya va tasodifiy maskalash oʻrtasidagi oʻrtacha farq 5%, 10% va 20% maskalash fraksiyalarida ijobiy boʻldi, 95% ishonch intervallari nolni istisno qildi, ammo 30% da kichikroq boʻldi va noldan farqlanmadi. PFD uchun farq 5% va 30% da ijobiy boʻldi, 10% va 20% da esa ishonch intervallari nolni oʻz ichiga oldi. Umuman olganda, ushbu tahlillar atributsiya usuli model chiqishi bilan bogʻliq matn hududla
