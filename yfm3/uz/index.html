{"text":"Son &amp;middot; 02.10.2026","url":"2026-10-02/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-10-02/optical-microscopy-predictions-of-focal-recurrence-in-gliobl-card.jpg"},"content":{"title":"OOptik mikroskopiya va&amp;nbsp;sun&amp;rsquo;iy intellekt glioblastoma retsidivini oldindan aytib beradi","text":"&lt;p&gt;Yangi algoritm jarrohlik chetlaridagi to'qimalarni tahlil qilib, o'simtaning qayta o'sish xavfi yuqori bo'lgan hududlarini ko'rsatadi.&lt;/p&gt;\n","links":[{"url":"2026-10-02/optical-microscopy-predictions-of-focal-recurrence-in-gliobl.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari-card.jpg"},"content":{"title":"ОИВ, туберкулез ва&amp;nbsp;малярияни бир вақтда аниқлайдиган CRISPR-тест яратилди","text":"&lt;p&gt;Олимлар ОИВ, туберкулез, малярия ва дорига чидамлиликни битта тизимда аниқлаш усулини ишлаб чиқдилар.&lt;/p&gt;\n","links":[{"url":"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta-card.jpg"},"content":{"title":"Goshe kasalligida miya nega tutqanoqqa moyil bo&amp;rsquo;ladi","text":"&lt;p&gt;Olimlar bemor hujayralaridan «mini-miya» o'stirish orqali genetik kasallikning neyronlarga ta'sirini aniqlashdi.&lt;/p&gt;\n","links":[{"url":"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/eggerthella-lenta-disrupts-the-gut-vascular-barrier-to-drive-card.jpg"},"content":{"title":"Ichakdagi bakteriya yo&amp;lsquo;g&amp;lsquo;on ichak saratonining jigarga tarqalishiga yordam beradi","text":"&lt;p&gt;Mikroblar ichak qon tomir to‘sig‘ini buzib, o‘sma hujayralarining qon oqimiga o‘tishiga yo‘l ochadi.&lt;/p&gt;\n","links":[{"url":"2026-10-02/eggerthella-lenta-disrupts-the-gut-vascular-barrier-to-drive.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system-card.jpg"},"content":{"title":"SpiraMed: miyaga dori yetkazib berishning yangi spiral usuli","text":"&lt;p&gt;Muhandislar miyaga hujayra va gen terapiyasini bitta teshik orqali kiritish imkonini beruvchi moslashuvchan kateterni ishlab chiqishdi.&lt;/p&gt;\n","links":[{"url":"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory-card.jpg"},"content":{"title":"Immunitetning yashirin kuchi: regulyator T-hujayralar saratonga qarshi kurashni boshlaydi","text":"&lt;p&gt;Odatda ular immunitetni tiyib turadi, ammo dori ta'sirida bu hujayralar o'simtani yo'q qiluvchi faol jangchilarga aylanadi.&lt;/p&gt;\n","links":[{"url":"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus-card.jpg"},"content":{"title":"Yurakdagi umumiy arterial o&amp;lsquo;zak: qon oqimi qanday kechadi?","text":"&lt;p&gt;Olimlar ilk bor yurakning kam uchraydigan nuqsoni uchun raqamli model yaratib, qon aralashuvi va klapanlar ishini tahlil qilishdi.&lt;/p&gt;\n","links":[{"url":"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data-card.jpg"},"content":{"title":"LLM biologik ma&amp;rsquo;lumotlar bazasidagi tartibsizlikni bartaraf eta oladimi","text":"&lt;p&gt;Millionlab laboratoriya tajribalari noto'g'ri tasniflangan. Tadqiqotchilar sun'iy intellekt bu muammoni hal qila olishini tekshirib ko'rishdi.&lt;/p&gt;\n","links":[{"url":"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/drought-spec-net-early-tomato-drought-detection-and-potentia-card.jpg"},"content":{"title":"Neyrotarmoq pomidorlarning suvsizlikdan aziyat chekayotganini qanday aniqlaydi","text":"&lt;p&gt;Yangi Drought-Spec-Net modeli barglardan qaytgan yorug‘lik spektrini tahlil qilib, o‘simlik so‘lishidan oldin qurg‘oqchilikni aniqlaydi.&lt;/p&gt;\n","links":[{"url":"2026-10-02/drought-spec-net-early-tomato-drought-detection-and-potentia.html","text":"O'qish","arrow":true,"theme":"normal"}]}}]},{"type":"card-layout-block","animated":false,"title":{"text":"Son &amp;middot; 01.10.2026","url":"2026-10-01/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-10-01/single-cell-atlas-of-transcriptomic-vulnerability-across-bra-card.jpg"},"content":{"title":"Miya zaifligi xaritasi: kasalliklar hujayralarni qanday o&amp;rsquo;zgartiradi","text":"&lt;p&gt;Olimlar miya kasalliklarining hujayraviy darajadagi umumiy belgilarini aniqlash uchun 6 milliondan ortiq hujayradan iborat ulkan atlas yaratdilar.&lt;/p&gt;\n","links":[{"url":"2026-10-01/single-cell-atlas-of-transcriptomic-vulnerability-across-bra.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise-card.jpg"},"content":{"title":"Neytrofillar jigar yog&amp;rsquo;lanishini qanday qo&amp;rsquo;zg&amp;rsquo;atadi","text":"&lt;p&gt;Odatda infeksiyalardan himoya qiluvchi neytrofillar steatogepatit rivojlanishining asosiy sababchisi bo'lishi mumkin.&lt;/p&gt;\n","links":[{"url":"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut-card.jpg"},"content":{"title":"Miyaning xotira tasvirlarini qanday tiklashi aniqlandi","text":"&lt;p&gt;Neyrotarmoqlar yordamida miyaning medial temporal tarmog‘i shaxsiy xotiralar vizual qiyofasini saqlashi isbotlandi.&lt;/p&gt;\n","links":[{"url":"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/a-serum-thyroid-hormone-metabolite-test-for-molecular-diagno-card.jpg"},"content":{"title":"Qalqonsimon bez saratonini aniqlashda qon tahlili: yangi usul","text":"&lt;p&gt;Olimlar qalqonsimon bez tugunlarini biopsiyasiz tekshirish uchun gormon metabolitlari tahlilini ishlab chiqishdi.&lt;/p&gt;\n","links":[{"url":"2026-10-01/a-serum-thyroid-hormone-metabolite-test-for-molecular-diagno.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell-card.jpg"},"content":{"title":"Immun tizimining erta qarishi: KRAS oqsili yurak kasalliklariga qanday ta&amp;rsquo;sir qiladi","text":"&lt;p&gt;Olimlar immun hujayralarining erta qarishi va erta ateroskleroz o'rtasidagi molekulyar bog'liqlikni aniqladilar.&lt;/p&gt;\n","links":[{"url":"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic-card.jpg"},"content":{"title":"Nima uchun ba&amp;rsquo;zi odamlar sepsis qarshisida ojiz: javob kam sonli xalqlar genida yashiringan","text":"&lt;p&gt;Genetiklar Qatar aholisida o'limga olib keluvchi yallig'lanishni o'z vaqtida to'xtatishga xalaqit beradigan noyob mutatsiyani aniqlashdi.&lt;/p&gt;\n","links":[{"url":"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/a-designed-ubiquitin-binding-protein-selectively-enriches-an-card.jpg"},"content":{"title":"Erkin ubiquitin: olimlar hujayradagi &amp;laquo;ko&amp;lsquo;rinmas&amp;raquo; regulyatorni kuzatishni o&amp;lsquo;rgandi","text":"&lt;p&gt;Yangi UBiP10 oqsilli zondi erkin ubiquitinni aniqlash va uning hujayra hayotidagi rolini o‘rganish imkonini beradi.&lt;/p&gt;\n","links":[{"url":"2026-10-01/a-designed-ubiquitin-binding-protein-selectively-enriches-an.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-card.jpg"},"content":{"title":"DNK konstruktoridagi bitta detal gen terapiyasi dori-darmonlari ishlab chiqarishni qanday buzadi","text":"&lt;p&gt;Olimlar virusli vektorlar tayyorlanadigan xomashyodagi genetik nuqson sababini topishdi va uni tuzatish yoʻlini oʻylab topishdi.&lt;/p&gt;\n","links":[{"url":"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont-card.jpg"},"content":{"title":"Milk kasalliklari va&amp;nbsp;artrit: genetik bog&amp;lsquo;liqlik siri","text":"&lt;p&gt;Tadqiqotchilar parodontit va tizimli yoshlar artritini birlashtiruvchi umumiy genetik mexanizmlarni aniqlashdi.&lt;/p&gt;\n","links":[{"url":"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html","text":"O'qish","arrow":true,"theme":"normal"}]}}]},{"type":"extended-features-block","animated":false,"title":"BioSignal qanday ishlaydi","items":[{"title":"Saralash","text":"&lt;p&gt;Har kuni model o'nlab yangi tadqiqotlarni solishtirib, eng muhim va tushunarlilarini tanlaydi.&lt;/p&gt;\n"},{"title":"Tahlil","text":"&lt;p&gt;Mohiyat, asosiy xulosalar va cheklovlar — sodda, ammo aniq tilda.&lt;/p&gt;\n"},{"title":"Uch til","text":"&lt;p&gt;Har bir material rus, o'zbek va qozoq tillarida chiqadi.&lt;/p&gt;\n"},{"title":"Rasmlar va&amp;nbsp;to&amp;rsquo;liq matn","text":"&lt;p&gt;Maqolalarning o'z rasmlari, ochiq litsenziyalar uchun esa to'liq tarjima.&lt;/p&gt;\n"}]},{"type":"questions-block","animated":false,"title":"Savollar","items":[{"title":"&lt;p&gt;Bu taqriz qilingan maqolalarmi?&lt;/p&gt;\n","text":"&lt;p&gt;Yo'q, bu preprintlar — taqrizdan oldingi yangi ishlar. Har bir materialda tadqiqot cheklovlari ko'rsatilgan.&lt;/p&gt;\n"},{"title":"&lt;p&gt;Materiallar qanchalik tez-tez chiqadi?&lt;/p&gt;\n","text":"&lt;p&gt;Kuniga uch marta: ertalab, kunduzi va kechqurun.&lt;/p&gt;\n"},{"title":"&lt;p&gt;Matnlardan foydalanish mumkinmi?&lt;/p&gt;\n","text":"&lt;p&gt;Ha, BioSignal va asl maqolaga havola bilan (DOI har bir materialda ko'rsatilgan).&lt;/p&gt;\n"}]}],"links":[]},"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"BioSignal","vcsPath":"index.yaml"},"title":"BioSignal"},"router":{"pathname":"index","depth":1,"base":"./"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
