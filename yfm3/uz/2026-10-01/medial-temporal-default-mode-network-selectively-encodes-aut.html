            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"263\" cy=\"171\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"577\" cy=\"179\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Miyaning xotira tasvirlarini&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qanday tiklashi aniqlandi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;O‘tmishdagi to‘y yoki tonggi yugurishni eslaganimizda ko‘z oldimizda aniq vizual manzaralar gavdalanadi. Miya aynan tasvirni tiklaydimi yoki faqat voqeaning umumiy ma’nosinimi degan savol uzoq vaqt ochiq qolgan edi. Tadqiqotchilar sun’iy intellekt yordamida odamlarning xotiralari asosida tasvirlar yaratib, ularni miya faolligi bilan taqqosladilar. Natijada shaxsiy vizual xotiralar uchun miyaning birlamchi holat tizimidagi maxsus qism javobgar ekani aniqlandi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/medial-temporal-default-mode-network.html\"&gt;MT-DMN&lt;/a&gt; tarmog‘i xotiradagi shaxsiy tasvirlar tuzilishini alohida kodlaydi&lt;/li&gt;\n&lt;li&gt;Effekt GPT-2 yordamida noverbal semantika chiqarib tashlanganda ham saqlanadi&lt;/li&gt;\n&lt;li&gt;Boshqa 16 ta neyrotarmoqda va oddiy o‘qish paytida bu vizual kod aniqlanmadi&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqotda 50 nafar ko‘ngilli (25 nafar yosh, o‘rtacha yoshi 24 ± 3, va 25 nafar keksa yoshli, 73 ± 7 yosh) ishtirok etdi. fMRT skanerlashidan oldin qatnashchilar 20 ta umumiy ssenariy (masalan, «mashg‘ulot» yoki «to‘y») bo‘yicha o‘zlarining shaxsiy xotiralarini qisqacha tasvirlab berishgan. Ushbu matnlar asosida &lt;a href=\"concepts/stable-diffusion.html\"&gt;Stable Diffusion 2.1&lt;/a&gt; neyrotarmog‘i har bir holat uchun beshtadan sintetik tasvir yaratdi, so‘ngra VGG-16 konvolyutsion tarmog‘ining FC8 qatlamidan 1000 o‘lchamli vektorlar olinib, vizual model tuzildi.&lt;/p&gt;\n&lt;p&gt;fMRT seansi davomida ishtirokchilar hech qanday ovoz chiqarmasdan, berilgan yozma belgilar orqali ushbu manzaralarni qayta tasavvur qilishdi. Taqdimotlar o‘xshashligini tahlil qilish (&lt;a href=\"concepts/representational-similarity-analysis.html\"&gt;RSA&lt;/a&gt;) usuli hamda GPT-2 modeli orqali matn ma’nosi nazorat qilinganda, vizual tuzilma faqat miyaning birlamchi holat tizimi medial temporal quyi tarmog‘ida (MT-DMN — parahippokampal, retrosplenial va lateral parietal po‘stloq) kodlanishi ma’lum bo‘ldi. Ushbu o‘ziga xos vizual iz boshqa 16 ta neyron tarmoqda yoki tasavvursiz shunchaki matn o‘qilganda umuman kuzatilmadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tasvirlar subyektlarning qisqa tavsiflari bo‘yicha sun’iy intellekt tomonidan yaratilgan va qatnashchilar ularning xotiraga qay darajada mosligini bevosita tasdiqlamagan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Inson miyasi xotiradan vizual sahnalarni qayta tiklaydi, hatto bu ruhiy tasvirlar noaniq bo'lsa ham, joylar, odamlar va narsalarning ko'rinishini sintez qiladi [1]. Default rejim tarmog'ining medial temporal quyi tizimi (MT-DMN), shu jumladan parahippokampal, retrosplenial va lateral parietal korteks, bunday tasavvurni qo'llab-quvvatlaydi deb hisoblanadi, chunki u xotira, tasavvur va fazoviy ishlov berish bilan bog'liq vazifalarda faollashadi [2–4]. Biroq, MT-DMN ichida vizual sahnalarning rekonstruktsiyasini istiqbolli kodlaydigan neyron kodlar noma'lumligicha qolmoqda. Ushbu kodlarni aniqlash shaxslar tasavvur qiladigan idiosinkratik sahnalarning vakillik modelini talab qiladi, bu qiyin vazifa bo'lib, vizual komponentlarni affekt, dialog va ijtimoiy ahamiyat kabi vizual bo'lmagan komponentlardan ajratish zarurati bilan yanada murakkablashadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot MT-DMNdagi neyron korrelyatlarni aniqlash uchun tasavvur qilingan sahnalarning vizual va semantik komponentlarini modellashtirish uchun zamonaviy AI modellaridan (Stable Diffusion va GPT-2) foydalanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bu yerda biz ushbu muammolarni hal qilamiz, buning uchun og'zaki tavsiflardan tasavvur qilingan sahnalarni modellashtirish uchun eng zamonaviy sun'iy intellekt (AI) «matndan tasvirga» modelini [Stable Diffusion; 5, 6] va hamrohlik qiluvchi vizual bo'lmagan semantik tarkibni qamrab olish uchun katta til modeli [7, 8] bilan birlashtiramiz. Ushbu yondashuv o'z-o'zidan hosil bo'lgan, ishtirokchiga xos vizual tasvirlarning neyron korrelyatlarini tavsiflash va ularning MT-DMNga xosligini baholash imkonini beradi. O'z-o'zidan hosil bo'lgan ruhiy holatlar va DMN bo'yicha keng ko'lamli tadqiqotlarga qaramay [9–12], ichki hosil bo'lgan vizual sahna simulyatsiyalarini aks ettiruvchi neyron vakilliklarni ajratib olish usullari cheklangan edi.&lt;/p&gt;\n&lt;p&gt;Subyektiv ruhiy tasvirlar odatda tajriba namunalari yordamida o'rganilgan, bunda ishtirokchilar o'zlarining davom etayotgan fikrlari vizual yoki og'zaki shaklda ekanligini xabar qilishadi [13–16]. Biroq, bunday qo'pol o'z-o'zini hisobotlar odamlar tasavvur qiladigan turli xil vizual sahnalarni ajrata olmaydi. Xuddi shunday, epizodik eslash va istiqbolni o'rganish alohida voqealar bilan bog'liq neyron vakilliklarni [17–20], ularning fazoviy yoki vaqtinchalik kontekstini [21, 22], shuningdek, ular o'z ichiga olgan odamlar yoki narsalarni [23–28] muvaffaqiyatli farqlagan bo'lsa-da, ular tasavvur qilingan sahnalarni belgilaydigan idiosinkratik vizual tafsilotlarning neyron korrelyatlarini aniqlamagan. Aksincha, hayvonlar, asboblar, odamlar va binolar kabi alohida ob'ektlar uchun ruhiy tasvirlarning neyro-hisoblash tavsiflari nisbatan yaxshi rivojlangan [1, 29].&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RSA (Representational Similarity Analysis) — bu miya faoliyati naqshlari va hisoblash modellari (masalan, AI modellari) o'rtasidagi o'xshashlik tuzilishini solishtiradigan fMRI ma'lumotlarini tahlil qilish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Vizual ob'ektlarni idrok etishni modellashtirishdagi dastlabki yutuqlardan so'ng [30–34] kompyuter ko'rish tizimlari yordamida [masalan, 35, 36], shunga o'xshash yondashuvlar oldindan ko'rilgan ob'ekt tasvirlarining ruhiy tasvirlarini [33, 37] va ob'ekt otlarini [38, 39] modellashtirish uchun kengaytirildi. Tasavvur va idrok bo'yicha umumiy xulosa shundaki, ob'ektlarni tanib olish uchun markaziy bo'lgan ventral vizual yo'l bo'ylab faollashuv naqshlari [40, 41] hisoblash ob'ektlarini tanib olish modellaridan olingan tasvir vakilliklari bilan korrelyatsiya qiladi [32–34, 42, 43]. Ushbu vakilliklar ob'ektlar, hayvonlar, diqqatga sazovor joylar va boshqa ob'ektlar kabi semantik kategoriyalarning yuqori darajadagi vizual korrelyatlarini aks ettiradi, ular pozitsiya, ko'rish nuqtasi va yorug'likning past darajadagi o'zgarishlaridan abstraktlanadi.&lt;/p&gt;\n&lt;p&gt;Ta'kidlash joizki, bunday tasvir vakilliklari MT-DMN bilan kesishadigan sahnalarni tanlash sohalarida [44] tabiiy sahnalarni ko'rishda funksional magnit-rezonans tomografiya (fMRI) javoblarini ham bashorat qiladi. Ushbu sohalar sahnalar ichidagi ob'ekt kategoriyalarini [45, 46], sahna elementlari o'rtasidagi kontekstual assotsiatsiyalarni [47–49] va fon teksturasi haqidagi ma'lumotlarni [50] kodlaydi. Ob'ekt konteksti va teksturasiga, shaklga emas, balki tasvirlarni tanib olish modellarining nisbiy sezgirligi [51–53] ularni sahnalarni tanlash korteksidagi faoliyatni modellashtirish uchun hatto afzalroq qilishi mumkin. Avtobiografik tajriba bilan bog'liq vizual tasvirlarni modellashtirish o'ziga xos muammoni keltirib chiqaradi, chunki ruhiy tasvirlar uchun ob'ektiv «haqiqat» mavjud emas. Ba'zi epizodik xotiralar fotosuratlar bilan hujjatlashtirilgan bo'lsa-da, odamlar eslaydigan yoki tasavvur qiladigan narsalar ko'pincha turli xil voqealardan elementlarni aralashtirish yoki tasavvur qilingan tafsilotlarni kiritish orqali haqiqatdan farq qiladi [54–58].&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot fMRI ma'lumotlariga asoslangan bo'lib, miya faoliyati va AI modellari o'rtasidagi korrelyatsiya miya neyron tarmoqlar bilan bir xil algoritmlardan foydalanadi degani emas.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Stable Diffusion [5, 6] kabi «matndan tasvirga» AI tizimlaridagi so'nggi yutuqlar endi ishtirokchilarning og'zaki tavsiflaridan to'g'ridan-to'g'ri tasvirlarni yaratish orqali ushbu ichki vizualizatsiyalarni yaqinlashtirish usulini taklif qilmoqda. Hozirgi tadqiqot ushbu yondashuvdan MT-DMNdagi faollashuv naqshlari ishtirokchiga xos (avtobiografik) vizual tuzilmani tanlab kodlaydimi yoki yo'qligini tekshirish va bunday tuzilma boshqa miya tarmoqlarida yoki tasavvur ishlatilmaganda yo'qligini aniqlash uchun foydalanadi. Shu bilan bu ish tasavvur va xotiraning neyron asoslarini tushunishni rivojlantiradi va ichki hosil bo'lgan vizual tasvirlarni farqlash uchun AI yordamida tasvir yaratishni tegishli til modeli asosidagi neyron dekodlash yondashuvlariga uslubiy qo'shimcha sifatida o'rnatadi [masalan, 59–63].&lt;/p&gt;\n&lt;p&gt;MT-DMN avtobiografik tasavvur paytida ishtirokchiga xos vizual tuzilmani tanlab kodlaydi degan gipotezani tekshirish uchun biz 50 nafar kattalardan oldin to'plangan fMRI ma'lumotlar to'plamini qayta tahlil qildik [20, 62, 64] (Rasm 1A). Namuna 25 nafar yosh kattalarni (o'rtacha yosh ± SD = 24 ± 3 yil; 16 ayol va 9 erkak) va 25 nafar keksa kattalarni (o'rtacha yosh ± SD = 73 ± 7 yil; 16 ayol va 9 erkak) o'z ichiga oldi. Garchi yoshga bog'liq farqlar hozirgi tadqiqotning diqqat markazida bo'lmasa-da, tahlillar natijalarning umumlashtirilishini aniqlash uchun ham butun guruh bo'ylab, ham yosh guruhlari ichida o'tkazildi.&lt;/p&gt;\n&lt;p&gt;Rasm 1. Avtobiografik tasavvur paytida skanerlangan fMRI ma'lumotlarida vizual ma'lumotlar tuzilishini aniqlash. (A) Skanerlashdan oldin ishtirokchilarga 20 ta umumiy stsenariy-ko'rsatma (masalan, raqs, mashqlar va to'y) taqdim etildi va ulardan har bir voqeani shaxsan boshdan kechirayotganini yorqin tasavvur qilish so'raldi. Keyin ular har bir tasavvur qilingan stsenariyni og'zaki tasvirlab berishdi. fMRI paytida ishtirokchilar umumiy matnli ko'rsatmalar asosida tasodifiy tartibda taqdim etilgan har bir stsenariyni qayta tasavvur qilishdi. Standart oldindan ishlov berishdan so'ng har bir ishtirokchi uchun har bir stsenariy uchun bitta fMRI hajmi olindi.&lt;/p&gt;\n&lt;p&gt;Hajmlar Yeo parsellyatsiya sxemasi bilan bog'liq 17 ta tarmoqqa bo'lingan (Rasm SN). Vizual sahna tuzilishini modellashtirish uchun har bir ishtirokchining tavsifiga asoslanib, stsenariy uchun beshta tasvirni sintez qilish uchun Stable Diffusion 2.1 [5] ishlatilgan. Keyin tasvirlar VGG-16 ob'ektlarni tanib olish tarmog'i orqali o'tkazildi [36] va softmaxdan oldingi oxirgi qatlamdan (FC8) 1000D faollashuv vektorlari chiqarildi va har bir ishtirokchi uchun stsenariy uchun yagona vakillikni olish uchun beshta tasvir bo'yicha o'rtacha hisoblandi. Ushbu vektorlar asosiy matnda «Vizual model» deb ataladi va rasmlarda kamera belgisi bilan ko'rsatilgan. Vizual bo'lmagan semantik tarkibni nazorat qilish uchun har bir og'zaki tavsif GPT-2 L16 [7] (kitob belgisi) yoki OpenCLIP [8] yashirin holat faollashuv vektorlari yordamida modellashtirilgan. AI sahna tasvirlarini yaratish uchun ishlatilgan, haqiqiy odamlar tasvirlanmagan. (B) Miya ichidagi vizual vakillik tuzilishini tekshirish uchun fMRI naqshlari MT-DMNdan chiqarilgan. Qisman korrelyatsiyaga asoslangan RSA GPT-2 nazorati bilan Vizual model tomonidan noyob tarzda tushuntirilgan dispersiyani ajratish uchun ishlatilgan. MT-DMNga xosligini tekshirish uchun tahlil Core-DMN va FT-DMN quyi bo'limlari, shuningdek, 14 ta boshqa tarmoqlar uchun takrorlandi (Rasm SN). Qo'shimcha tahlilda, Vizual modelni nazorat qilishda faqat GPT-2 tomonidan tushuntirilgan dispersiyani o'rganish uchun qisman RSAda modellar almashtirildi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-01/med
