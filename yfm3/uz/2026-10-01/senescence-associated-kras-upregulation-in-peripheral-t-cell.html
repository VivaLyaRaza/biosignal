        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"140\" cy=\"165\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"580\" cy=\"194\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · BIOINFORMATICS   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Immun tizimining erta&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qarishi: KRAS oqsili yurak&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;kasalliklariga qanday ta'sir&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qiladi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell-f1.jpg\" alt=\"1-rasm. Ushbu tadqiqotning ish jarayoni.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. Ushbu tadqiqotning ish jarayoni.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Yurak-qon tomir kasalliklari yoshlar orasida tobora ko'payib bormoqda, ammo ularning aniq sabablari hali ham o'rganilmoqda. Yangi tadqiqot shuni ko'rsatadiki, immun hujayralarida faollashadigan &lt;a href=\"concepts/kras.html\"&gt;KRAS&lt;/a&gt; oqsili bu jarayonda muhim rol o'ynaydi. Uning ortiqcha miqdori T-limfotsitlarning muddatidan oldin qarishiga olib keladi va qon tomirlarining yallig'lanishini kuchaytiradi. Bu kashfiyot kelajakda yangi davolash usullarini ishlab chiqishga yordam berishi mumkin.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;KRAS effektor CD8+ T-hujayralarining qarishini boshqaruvchi asosiy omildir&lt;/li&gt;\n&lt;li&gt;T-hujayralardagi KRASning yuqori darajasi ateroskleroz bilan bog'liq&lt;/li&gt;\n&lt;li&gt;Virtual skrining KRASga ta'sir qiluvchi yangi molekulalarni aniqladi&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqotchilar erta koronar arteriya kasalligi (PCAD) bilan og'rigan bemorlarning periferik qon mononuklear hujayralarini (&lt;a href=\"concepts/pbmc.html\"&gt;PBMC&lt;/a&gt;) tahlil qilishdi. Yagona hujayrali RNK sekveniroviyasi (&lt;a href=\"concepts/scrna-seq.html\"&gt;scRNA-seq&lt;/a&gt;) yordamida KRAS geni asosan effektor CD8+ T-limfotsitlarida yuqori darajada ifodalanishi aniqlandi. Ushbu hujayralar qarish belgilari va yuqori sitotoksiklikni namoyon etib, aterosklerotik blyashkalar rivojlanishiga hissa qo'shadi.&lt;/p&gt;\n&lt;p&gt;KRASning funksional ahamiyatini tekshirish uchun mualliflar virtual &lt;a href=\"concepts/knock-out.html\"&gt;nokaut&lt;/a&gt; (in silico gene perturbation) algoritmidan foydalanishdi, bu genning faoliyatini cheklash hujayra o'ldirish yo'llarini o'zgartirishini ko'rsatdi. Molekulyar dokin va chuqur o'rganish (deep learning) usullari orqali KRAS bilan bog'lanishi mumkin bo'lgan kichik molekula aniqlandi. Olingan natijalar qon tomirlarida «qarigan» T-hujayralar to'planishi erta aterosklerozning asosiy omillaridan biri ekanligini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot korrelyatsion tahlil va kompyuter modellashtirishga asoslangan; terapevtik samaradorlikni tasdiqlash uchun jonli organizmlarda tajribalar talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Erta koronar arteriya kasalligi (EKAK) aniq molekulyar omillarga ega emas va immun qarishning bu jarayondagi roli noaniq. Biz qarish bilan bog'liq genlar disregulyatsiyasi T-hujayralarda EKAK rivojlanishiga hissa qo'shishini tekshirdik.&lt;/p&gt;\n&lt;p&gt;Biz 12 nafar EKAK bemori va 21 nafar nazorat guruhidagi shaxslarning periferik qon mononuklear hujayralari (PBMC) transkriptomikasini, shuningdek, PBMC va inson aterosklerotik blyashkalarining yagona hujayrali RNK sekveniroviyasini (&lt;a href=\"concepts/single-cell-rna-sequencing.html\"&gt;scRNA-seq&lt;/a&gt;) birlashtirdik. Tahlil uchun vaznlangan genlar ko-ekspressiya tarmog'i tahlili (&lt;a href=\"concepts/wgcna.html\"&gt;WGCNA&lt;/a&gt;), genlar buzilishi tarmog'i tahlili va molekulyar doking usullari qo'llanildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;WGCNA — bu birgalikda ishlaydigan genlar guruhlarini aniqlash uchun ishlatiladigan statistik usul bo'lib, u muhim biologik jarayonlarni yuzaga chiqaradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;KRAS geni EKAK bilan bog'liq genlar va qarish bilan bog'liq genlar kesishmasidagi markaziy gen (hub gene) sifatida aniqlandi. Yagona hujayrali tahlil KRAS ekspressiyasining asosan effektor CD8+ T-hujayralarida oshganini ko'rsatdi. Bu hujayralar eng yuqori qarish ko'rsatkichlariga ega bo'lib, kasallik mavjud bo'lganda bu ko'rsatkichlar yanada oshgan. KRAS tarmog'ining buzilishi hujayralarni o'ldirish yo'liga kuchli ta'sir ko'rsatdi. KRAS darajasi yuqori bo'lgan effektor CD8+ T-hujayralari koronar va uyqu arteriyalari blyashkalarida aniqlandi, ular kuchaygan sitotoksiklik, charchash va qarish belgilarini namoyon etdi. Bundan tashqari, kompyuter modellashtirish orqali faol bo'lmagan KRAS bilan bog'lanishi mumkin bo'lgan kichik molekula aniqlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Qarigan sitotoksik CD8+ T-hujayralarida KRAS ekspressiyasining ortishi EKAK bilan bog'liq bo'lib, immun qarish va erta ateroskleroz o'rtasidagi bog'liqlikni ko'rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Qarigan, sitotoksik CD8+ T-hujayralarida KRAS ekspressiyasining yuqoriligi EKAK bilan bog'liq bo'lib, immun qarish va erta aterosklerozni birlashtiradi. Ushbu topilma yangi biomarker va potensial terapevtik nishonni taqdim etadi, biroq u keyingi funksional tasdiqlashni talab qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot bioinformatik tahlil va sekveniroviya ma'lumotlariga asoslangan; terapevtik samaradorlikni tasdiqlash uchun qo'shimcha eksperimental tekshiruvlar zarur.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"pcad-dolzarbligi-va-klinik-muammolar\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#pcad-dolzarbligi-va-klinik-muammolar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PCAD dolzarbligi va klinik muammolar&lt;/span&gt;&lt;/a&gt;PCAD dolzarbligi va klinik muammolar&lt;/h4&gt;\n&lt;p&gt;Erta boshlangan yurak ishemik kasalligi (PCAD) kardiologiyada tobora jiddiy va murakkab muammoga aylanib bormoqda. Uzoq vaqt davomida yoshlarda koronar kasalliklar darajasi keksalarga nisbatan past bo‘lgani uchun bu masalaga kam e’tibor qaratilgan. Biroq, yoshlar orasida yurak-qon tomir o‘limi yetakchi sabab bo‘lib qolmoqda va o‘tkir miokard infarkti (AMI) bilan kasallangan yoshlar ulushi ortib bormoqda. Hozirgi profilaktika strategiyalari o‘rta va keksa yoshdagi kohortalarga asoslangan bo‘lib, bu yoshlarda xavfni tizimli ravishda kam baholashga olib keladi. Natijada, PCAD ko‘pincha o‘tkir hodisadan keyingina aniqlanadi va aniqroq strategiyalarni ishlab chiqish epidemiologik dalillar yetishmasligi tufayli cheklangan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PCAD ko‘pincha kech tashxis qilinadi, chunki mavjud xavf shkalalari yosh bemorlar uchun mos emas, bu esa yangi molekulyar drayverlarni izlashni taqozo etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Keksayish IHK uchun mustaqil xavf omili bo‘lib, immunosenesensiya — immun tizimining funksional pasayishi bilan kechadi. Bu jarayon sitokinlar sekretsiyasining buzilishi va immun hujayralar tarkibining o‘zgarishi bilan tavsiflanadi. Bu surunkali yallig‘lanishni keltirib chiqaradi va aterosklerozni kuchaytiradi. Keksa bemorlarning aterosklerotik blyashkalarida to‘plangan qarigan T-hujayralar oksidlangan LDL antigenlarini qayta ishlash qobiliyatini yo‘qotadi va yallig‘lanishni kuchaytiruvchi xemokinlarni ko‘p miqdorda ishlab chiqaradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Immunosenesensiya — bu immun tizimining qarishi bo‘lib, hujayralar o‘z himoya funksiyasini yo‘qotib, yallig‘lanishni keltirib chiqaruvchi omillarga aylanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kras-roli-va-tadqiqot-dizayni\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#kras-roli-va-tadqiqot-dizayni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;KRAS roli va tadqiqot dizayni&lt;/span&gt;&lt;/a&gt;KRAS roli va tadqiqot dizayni&lt;/h4&gt;\n&lt;p&gt;PCADda T-hujayrali immunosenesensiyaning roli hali ham kam o‘rganilgan. KRAS oqsili MAPK/ERK, PI3K/AKT/mTOR kabi kaskadlar orqali hujayra proliferatsiyasi va omon qolishini boshqaradi. KRASning g‘ayritabiiy faollashuvi (mutatsiyasiz ham) hujayra qarishini qo‘zg‘atishi mumkin. Ushbu tadqiqotda mualliflar transkriptomik profilirlash, scRNA-seq, virtual gen nokauti, sun’iy intellekt va molekulyar dokingni birlashtirdilar. KRAS PCAD va qarish bilan bog‘liq genlar kesishmasidagi markaziy gen sifatida aniqlandi, uning ekspressiyasi asosan effektor CD8+ T-hujayralarida yuqori ekanligi ma’lum bo‘ldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Virtual nokaut — bu kompyuter algoritmlari yordamida ma’lum bir gen o‘chirilganda hujayra qanday o‘zgarishini bashorat qiluvchi usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tahlillar shuni ko‘rsatdiki, KRASning yuqori darajasi sitotoksik dasturni ishga tushiradi va hujayra qarishi belgilari bilan bog‘liq. Ushbu CD8+ T-hujayra subpopulyatsiyasi koronar va karotid aterosklerotik blyashkalarda tasdiqlandi. AI modeli yordamida KRAS bilan bog‘lana oladigan yangi kichik molekula aniqlandi, bu «davolab bo‘lmaydigan» hisoblangan oqsilga qarshi kurashish imkonini beradi. Tadqiqot jarayoni 1-rasmda keltirilgan.&lt;/p&gt;\n&lt;h4 id=\"ommaviy-malumotlarni-olish\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#ommaviy-malumotlarni-olish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ommaviy ma’lumotlarni olish&lt;/span&gt;&lt;/a&gt;Ommaviy ma’lumotlarni olish&lt;/h4&gt;\n&lt;p&gt;Tahlil uchun GEO ma’lumotlar bazasidan foydalanildi. PCAD va sog‘lom nazorat guruhidagi PBMC transkriptomik ma’lumotlari (bulk &lt;a href=\"concepts/rna-seq.html\"&gt;RNA-seq&lt;/a&gt;) GSE12288dan olindi. PBMC scRNA-seq ma’lumotlari GSE231906 va GSE145154dan, koronar aterosklerotik blyashkalar scRNA-seq ma’lumotlari esa GSE252243 va GSE264666dan yuklab olindi.&lt;/p&gt;\n&lt;h4 id=\"klinik-namunalarni-yigish-va-validatsiya\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#klinik-namunalarni-yigish-va-validatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Klinik namunalarni yig'ish va validatsiya&lt;/span&gt;&lt;/a&gt;Klinik namunalarni yig'ish va validatsiya&lt;/h4&gt;\n&lt;p&gt;Tadqiqot 2025-yil 1-yanvardan 2026-yil 1-yanvargacha Xarbin tibbiyot universitetining ikkinchi kasalxonasida «holat-nazorat» dizayni asosida o'tkazildi (etik qo'mita ruxsati KY-2025394). PBMC validatsiyasi uchun 5 nafar PCAD (yurak ishemik kasalligi) bilan og'rigan bemor va 5 nafar sog'lom nazorat guruhi (yoshi &amp;lt;45) tanlab olindi. PCAD tashxisi angiografik stenoz &amp;gt;70% bilan tasdiqlandi. PBMC ajratilib, KRAS, SYK va TAB2 mRNA darajalari qPCR yordamida o'lchandi. Plakalar validatsiyasi uchun karotid endarterektomiya o'tkazgan 5 nafar bemordan olingan namunalar ishlatildi. Klinik ma'lumotlar (yosh, jins, chekish, gipertenziya, diabet va lipid profili) statistik tuzatishlar uchun yig'ildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Validatsiya 10 ta PBMC va 5 ta karotid plaka namunalari asosida klinik xavf omillarini hisobga olgan holda amalga oshirildi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"differensial-ekspressiya-va-wgcna\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#differensial-ekspressiya-va-wgcna\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Differensial ekspressiya va WGCNA&lt;/span&gt;&lt;/a&gt;Differensial ekspressiya va WGCNA&lt;/h4&gt;\n&lt;p&gt;Transkriptomik ma'lumotlar limma (v3.62.2) paketi yordamida tahlil qilindi. P &amp;lt; 0.05 va fold change &amp;gt; 1.5 bo'lgan genlar ahamiyatli deb topildi. WGCNA (v1.74) tahlili 12 yumshoq chegaraviy quvvat (soft-thresholding power) bilan o'tkazildi. Modullar dinamik daraxt kesish usuli bilan (minimal hajm 80) aniqlandi. Asosiy modullar Aging Atlas bazasidagi qarish bilan bog'liq genlar bilan solishtirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;WGCNA — birgalikda ekspressiya qiluvchi genlar guruhlarini aniqlash va ularning klinik belgilar bilan bog'liqligini o'rganish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"scrna-seq-malumotlarini-qayta-ishlash\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#scrna-seq-malumotlarini-qayta-ishlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;scRNA-seq ma'lumotlarini qayta ishlash&lt;/span&gt;&lt;/a&gt;scRNA-seq ma'lumotlarini qayta ishlash&lt;/h4&gt;\n&lt;p&gt;Ma'lumotlar Seurat (v5.5.0) yordamida qayta ishlandi. &amp;lt; 200 gen va &amp;gt; 10% mitoxondrial o'qishlarga ega hujayralar chiqarib tashlandi. &lt;a href=\"concepts/pca.html\"&gt;PCA&lt;/a&gt; 2000 o'zgaruvchan genlar bo'yicha o'tkazildi, klasterlash (resolution 0.6) dastlabki 20 ta asosiy komponent yordamida amalga oshirildi. Hujayra turlari kanonik markerlar (T-hujayralar, NK, B, monotsitlar, dendrit hujayralar, makrofaglar, silliq mushak, fibroblastlar va endotelial hujayralar) asosida belgilandi.&lt;/p&gt;\n&lt;h4 id=\"hujayralararo-kommunikatsiya-va-yollar-tahlili\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#hujayralararo-kommunikatsiya-va-yollar-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hujayralararo kommunikatsiya va yo'llar tahlili&lt;/span&gt;&lt;/a&gt;Hujayralararo kommunikatsiya va yo'llar tahlili&lt;/h4&gt;\n&lt;p&gt;CellChat (v2.1.1) yordamida hujayralararo o'zaro ta'sirlar aniqlandi. GSVA (v2.0.7) yordamida MSigDB genlar to'plamlari baholandi. T-hujayralar uchun MI va sog'lom guruhlar o'rtasidagi farqlar FindMarkers (log-fold change &amp;gt; 0.5, p.adj &amp;lt; 0.05) funksiyasi bilan aniqlanib, clusterProfiler (v4.14.6) orqali GO va KEGG tahlili o'tkazildi.&lt;/p&gt;\n&lt;h4 id=\"t-hujayra-subpopulyatsiyalari-va-funksional-holat\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#t-hujayra-subpopulyatsiyalari-va-funksional-holat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;T-hujayra subpopulyatsiyalari va funksional holat&lt;/span&gt;&lt;/a&gt;T-hujayra subpopulyatsiyalari va funksional holat&lt;/h4&gt;\n&lt;p&gt;T-hujayralar qayta klasterlanib, subpopulyatsiyalar (naive CD4+, memory CD4+, reg CD4+, naive CD8+, effector CD8+) markerlar asosida ajratildi. Funksional holatlar (tsitotoksiklik, toliqish, qarish) TCellSI (v1.2.0) paketi bilan hisoblandi.&lt;/p&gt;\n&lt;h4 id=\"virtual-gen-nokauti\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#virtual-gen-nokauti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Virtual gen nokauti&lt;/span&gt;&lt;/a&gt;Virtual gen nokauti&lt;/h4&gt;\n&lt;p&gt;scTenifoldKnk (v1.0.3) yordamida T-hujayralarda KRAS genining in silico nokauti amalga oshirildi. Algoritmlar gen regulyator tarmog'ini qurib, maqsadli genni olib tashlash orqali o'zgarishlarni baholadi. Eng ko'p o'zgargan 20 ta gen GO va KEGG tahliliga kiritildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/virtualnyy-nokaut.html\"&gt;In silico nokaut&lt;/a&gt; — gen funksiyasini kompyuter modellashtirish orqali o'chirish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"chuqur-organishga-asoslangan-dori-vositalarini-bashorat-qilish-va-molekulyar-dokin\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#chuqur-organishga-asoslangan-dori-vositalarini-bashorat-qilish-va-molekulyar-dokin\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Chuqur o'rganishga asoslangan dori vositalarini bashorat qilish va molekulyar dokin&lt;/span&gt;&lt;/a&gt;Chuqur o'rganishga asoslangan dori vositalarini bashorat qilish va molekulyar dokin&lt;/h4&gt;\n&lt;p&gt;DrugReflector chuqur o'rganish modeli Connectivity Map (CMap) ma'lumotlar bazasida o'qitildi. MI (miokard infarkti) va sog'lom T-hujayralarini solishtirish natijasida aniqlangan yuqori ekspressiyali genlar (DEGs) ro'yxati kasallik signaturasi sifatida kiritildi. Model birikmalarni ularning ushbu signaturani qaytarish qobiliyatiga ko'ra saraladi. Eng yuqori o'rinni egallagan BRD-K78432605 birikmasi molekulyar dokin uchun tanlab olindi. GDP bilan bog'langan nofaol KRAS oqsilining kristalli strukturasi (PDB: 4EPR, ruxsati 2,00 Å) Protein Data Bank'dan olindi. Molekulyar dokin AutoDock Vina (4.2.6 versiyasi) yordamida amalga oshirildi, grid qutisi SOS-bog'lanish interfeysiga markazlashtirildi. Natijalar PyMOL (2.6.0 versiyasi) yordamida vizuallashtirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DrugReflector modeli BRD-K78432605 birikmasini miokard infarkti genetik profilini tuzatish uchun eng istiqbolli nomzod deb topdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"miqdoriy-real-time-pcr\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#miqdoriy-real-time-pcr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Miqdoriy Real-Time PCR&lt;/span&gt;&lt;/a&gt;Miqdoriy Real-Time PCR&lt;/h4&gt;\n&lt;p&gt;To'qimalar kukun holiga keltirilib, TRIzol reagentiga (Invitrogen, AQSH) qo'shildi. Hujayra namunalari supernatant olib tashlangandan so'ng TRIzol bilan ishlandi. RNK ekstraktsiyasi uchun xloroform (1 ml TRIzol uchun 350 mkl) qo'shilib, 15 daqiqa davomida 12 000 ayl/daq tezlikda sentrifuga qilindi. Supernatant 500 mkl izopropanol bilan aralashtirilib, 10 daqiqa turgandan so'ng, yana 10 daqiqa 12 000 ayl/daq tezlikda 4 °C haroratda sentrifuga qilindi. Cho'kma 1 ml 75% etanol bilan yuvilib, 5 daqiqa sentrifuga qilindi. Quritilgan cho'kma fermentlarsiz suvda eritilib, RNK kontsentratsiyasi o'lchandi va -80 °C da saqlandi. cDNA Toyobo to'plami yordamida sintez qilindi, so'ngra 2X M5 HiPer SYBR Premix EsTaq plus yordamida qRT-PCR o'tkazildi. Nisbiy ekspressiya 2⁻ΔΔ Ct usuli bilan GAPDH geniga normallashtirildi. TAB2, SYK, KRAS va GAPDH genlari uchun praymerlar ishlatildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;2⁻ΔΔ Ct usuli gen ekspressiyasining o'zgarishini nazorat geni (GAPDH) bilan solishtirish orqali aniqlashga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"aterosklerotik-blyashkalarni-immunoflyuoressent-boyash\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#aterosklerotik-blyashkalarni-immunoflyuoressent-boyash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Aterosklerotik blyashkalarni immunoflyuoressent bo'yash&lt;/span&gt;&lt;/a&gt;Aterosklerotik blyashkalarni immunoflyuoressent bo'yash&lt;/h4&gt;\n&lt;p&gt;Odam karotid aterosklerotik blyashkalari (qalinligi 4 mkm) deparafinatsiya qilindi va sitrat buferida (pH 6,0) mikrotolqinli pechda antigenlar ochildi. 5% sigir zardobi albuminida bloklangandan so'ng, kesmalar birlamchi antitanachalar (anti-CD8a + anti-KRAS yoki anti-KRAS + anti-p16-INK4A) bilan 4 °C da bir kecha davomida inkubatsiya qilindi. Keyin Alexa Fluor 488 va 594 bilan konjugatsiyalangan ikkilamchi antitanachalar (1:500) qo'shildi. Yadrolar &lt;a href=\"concepts/dapi.html\"&gt;DAPI&lt;/a&gt; bilan bo'yaldi. Tasvirlar Zeiss Axio Observer mikroskopida olinib, ImageJ dasturida tahlil qilindi. Har bir juftlik uchun beshta tasodifiy yuqori kattalashtirish maydonida (×200) ikki tomonlama musbat hujayralar sanaldi.&lt;/p&gt;\n&lt;h4 id=\"statistik-tahlil\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#statistik-tahlil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Statistik tahlil&lt;/span&gt;&lt;/a&gt;Statistik tahlil&lt;/h4&gt;\n&lt;p&gt;Statistik tahlillar R (4.4.3 versiyasi) dasturida bajarildi. Klinik validatsiya uchun PCAD va nazorat guruhlari o'rtasidagi farqlar Student t-testi yordamida, yosh, jins, chekish, gipertenziya va lipid profili kabi omillarni hisobga olgan holda ko'p o'zgaruvchan chiziqli regressiya orqali baholandi. Guruhlararo solishtirish ANOVA va Tukey testi bilan amalga oshirildi. p &amp;lt; 0,05 statistik ahamiyatli deb qabul qilindi. Immunoflyuoressent validatsiya uchun rasmiy statistik test o'tkazilmadi, bu tavsifiy xarakterga ega edi.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"pcad-bilan-ogrigan-bemorlarning-pbmc-hujayralarida-qarish-bilan-bogliq-asosiy-genlarni-aniqlash\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#pcad-bilan-ogrigan-bemorlarning-pbmc-hujayralarida-qarish-bilan-bogliq-asosiy-genlarni-aniqlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PCAD bilan og'rigan bemorlarning PBMC hujayralarida qarish bilan bog'liq asosiy genlarni aniqlash&lt;/span&gt;&lt;/a&gt;PCAD bilan og'rigan bemorlarning PBMC hujayralarida qarish bilan bog'liq asosiy genlarni aniqlash&lt;/h4&gt;\n&lt;p&gt;Mualliflar 45 yoshgacha bo'lgan 12 nafar koronar arteriya kasalligi (CAD) bilan og'rigan bemor va 21 nafar sog'lom nazorat guruhidagi shaxslarning PBMC transkriptomik ma'lumotlarini (GSE12288) tahlil qilishdi. p &amp;lt; 0.05 va /fold change/ &amp;gt; 1.5 chegaralari yordamida limma tahlili 2289 ta differensial ifodalangan genlarni (&lt;a href=\"concepts/gene-expression.html\"&gt;DEG&lt;/a&gt;) aniqladi, ulardan 1175 tasi yuqori, 1114 tasi esa past darajada ifodalangan (2A-rasm). WGCNA tahlili 23 ta modulni ajratib ko'rsatdi, ulardan binafsha rangli modul PCAD bilan eng kuchli bog'liqlikni ko'rsatdi (2B-rasm). Ushbu moduldan 315 ta asosiy gen, 2289 ta DEG va Aging Atlas ma'lumotlar bazasidagi 503 ta qarish bilan bog'liq genlarning kesishishi uchta asosiy regulyator genlarni aniqladi: TAB2, SYK va KRAS (2C-rasm). Ushbu uchala genning ifodalanish darajasi PCAD guruhida nazorat guruhiga qaraganda yuqori bo'lib, bu qPCR yordamida tasdiqlandi (2E-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TAB2, SYK va KRAS genlari PCAD bilan og'rigan bemorlarning PBMC hujayralarida yuqori ifodalangan asosiy regulyatorlar sifatida aniqlandi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"periferik-qon-t-hujayralarida-kras-ning-yuqori-ifodalanishi-pcad-bilan-chambarchas-bogliq\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#periferik-qon-t-hujayralarida-kras-ning-yuqori-ifodalanishi-pcad-bilan-chambarchas-bogliq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Periferik qon T-hujayralarida KRAS ning yuqori ifodalanishi PCAD bilan chambarchas bog'liq&lt;/span&gt;&lt;/a&gt;Periferik qon T-hujayralarida KRAS ning yuqori ifodalanishi PCAD bilan chambarchas bog'liq&lt;/h4&gt;\n&lt;p&gt;PCADda ushbu genlarning hujayraviy kontekstini tushunish uchun 45 yoshgacha bo'lgan 2 nafar ishemik kardiomiopatiya (MI guruhi) va 4 nafar sog'lom nazorat guruhidagi shaxslarning scRNA-seq ma'lumotlari (GSE231906 va GSE145154) qayta tahlil qilindi. Beshta asosiy hujayra turi aniqlandi: T-hujayralar, NK-hujayralar, B-hujayralar, monotsitlar va dendritik hujayralar. MI guruhida T-hujayralar ulushi yuqori, monotsitlar ulushi esa pastroq bo'ldi (3A va B-rasm). TAB2 va KRAS asosan T-hujayralarda, SYK esa monotsitlarda ifodalangan (3C-rasm). MI guruhida barcha hujayra turlarida bu genlarning ifodalanishi sog'lom guruhga nisbatan yuqori edi (3D-rasm). Hujayralararo aloqa tahlili MI guruhida umumiy o'zaro ta'sirlar kamayganini va T-hujayralar markaziy o'rinni egallashini ko'rsatdi (3E, F-rasm). GSVA tahlili MI guruhida KRAS va p53 signal yo'llarining faollashganini tasdiqladi (3H-rasm). T-hujayralaridagi genlar tahlili RNK splaysingi va apoptoz jarayonlarining kuchayganini ko'rsatdi (3I, J-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;scRNA-seq — bu har bir alohida hujayraning gen ifodalanish profilini o'rganishga imkon beruvchi texnologiya.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kichik namunalar asosida o'tkazilgan, shuning uchun kuzatilgan korrelyatsiyalar to'g'ridan-to'g'ri sabab-oqibat bog'liqligini anglatmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kras-yuqori-ifodalangan-effektor-cd8-t-hujayralari-tezlashgan-immun-qarishni-boshdan-kechiradi\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#kras-yuqori-ifodalangan-effektor-cd8-t-hujayralari-tezlashgan-immun-qarishni-boshdan-kechiradi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;KRAS yuqori ifodalangan effektor CD8+ T-hujayralari tezlashgan immun qarishni boshdan kechiradi&lt;/span&gt;&lt;/a&gt;KRAS yuqori ifodalangan effektor CD8+ T-hujayralari tezlashgan immun qarishni boshdan kechiradi&lt;/h4&gt;\n&lt;p&gt;T-hujayralar subklasterizatsiyasi beshta guruhni aniqladi: nayv CD4+, xotira CD4+, regulyator CD4+, nayv CD8+ va effektor CD8+ T-hujayralari. MI guruhida nayv CD4+ T-hujayralari ulushi yuqori, nayv CD8+ T-hujayralari esa pastroq bo'ldi (4A, B-rasm). KRAS barcha subguruhlarda ifodalangan, ammo eng yuqori daraja nayv CD4+ va effektor CD8+ T-hujayralarida kuzatilgan (4C, D-rasm). TCellSI algoritmi effektor CD8+ T-hujayralarida qarish ko'rsatkichi eng yuqori ekanligini va MI guruhida bu ko'rsatkich yanada oshganini ko'rsatdi. scTenifoldKnk yordamida KRAS ning virtual nokauti CCR7 va PIK3IP1 genlariga ta'sir qildi (4F-H-rasm), bu esa KRAS signal yo'lining T-hujayralarining sitotoksik dasturi bilan chambarchas bog'liqligini tasdiqladi (4I, J-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Yuqori KRAS darajasiga ega effektor CD8+ T-hujayralari tezlashgan immun qarish belgilarini namoyon etadi va bu ularning sitotoksik funksiyalari bilan bog'liq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Yuqori KRAS ekspressiyasiga ega effektor CD8+ T-hujayralari aterosklerotik blyashkalarga infiltratsiya qiladi va kuchaytirilgan effektor funksiyani namoyon etadi&lt;/p&gt;\n&lt;p&gt;Prematur koronar arteriya kasalligi (PCAD) bilan og‘rigan bemorlarda periferik qon effektor CD8+ T-hujayralarida KRAS ko‘tarilishi sitotoksiklikni kuchaytirishi va qarishni tezlashtirishini aniqlaganimizdan so‘ng, biz bu hodisa aterosklerotik blyashkalar ichida ham sodir bo‘lishini tekshirdik. Biz ilg‘or koronar ateroskleroz bilan og‘rigan besh bemorning koronar blyashka namunalaridan olingan ommabop scRNA-seq ma’lumotlarini (GSE252243 va GSE264666) qayta tahlil qildik. O‘lchamlarni kamaytirish va klasterlashdan so‘ng yetti turdagi hujayra aniqlandi: makrofaglar, T-hujayralar, NK-hujayralar, B-hujayralar, silliq mushak hujayralari, fibroblastlar va endotelial hujayralar (5A va B-rasm). PBMC natijalariga mos ravishda, KRAS T-hujayralarida eng yuqori ekspressiya darajasini ko‘rsatdi (5C va D-rasm). T-hujayralarni subklasterlash orqali to‘rtta kichik guruh aniqlandi: naiv CD4+, xotira CD4+, regulyator CD4+ va effektor CD8+ T-hujayralari (5E va F-rasm). Blyashkalardagi KRAS-yuqori effektor CD8+ T-hujayralarini 75-persentil bo‘yicha guruhlarga ajratib, biz TCellSI balliga ko‘ra, KRAS-yuqori guruh kuchliroq sitotoksiklik va qarish belgilarini ko‘rsatishini aniqladik (5G-rasm). GO-terminlar tahlili shuni ko‘rsatdiki, KRAS-yuqori guruhda immun javob va hujayra sirtidagi retseptorlar signalizatsiyasi bilan bog‘liq genlar faollashgan (5H-rasm). Odam uyqu arteriyasi blyashkalarini immunoflyuoressent bo‘yash usuli bilan ushbu subpopulyatsiyaning mavjudligi tasdiqlandi (5I-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Blyashkalardagi KRAS-yuqori CD8+ T-hujayralari kuchaytirilgan sitotoksik salohiyatga ega bo‘lib, ular mahalliy yallig‘lanishni keltirib chiqaradi va blyashka beqarorligiga olib kelishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;scRNA-seq (yagona hujayrali RNK sekvenlash) — har bir hujayraning gen ekspressiyasini alohida tahlil qilish imkonini beruvchi texnologiya bo‘lib, u to‘qimalardagi hujayraviy xilma-xillikni aniq ko‘rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"chuqur-organish-modeli-va-yagona-hujayrali-transkriptomik-sekvenlash-nomzod-terapevtik-birikmalarni-bashorat-qiladi\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#chuqur-organish-modeli-va-yagona-hujayrali-transkriptomik-sekvenlash-nomzod-terapevtik-birikmalarni-bashorat-qiladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Chuqur o‘rganish modeli va yagona hujayrali transkriptomik sekvenlash nomzod terapevtik birikmalarni bashorat qiladi&lt;/span&gt;&lt;/a&gt;Chuqur o‘rganish modeli va yagona hujayrali transkriptomik sekvenlash nomzod terapevtik birikmalarni bashorat qiladi&lt;/h4&gt;\n&lt;p&gt;PCAD bemorlarida KRAS ko‘tarilishi sababli yuzaga kelgan transkriptomik anomaliyalarni bartaraf etish uchun biz DrugReflector chuqur o‘rganish modelidan foydalandik. 52 ta hujayra liniyasida 9 597 ta perturbatsiyani o‘z ichiga olgan CMap ma’lumotlar bazasida o‘qitilgan ushbu model, gen ekspressiyasi profilini sog‘lom holatga qaytarish qobiliyatiga qarab birikmalarni saralaydi. Biz MI va sog‘lom guruhlar o‘rtasidagi farqli genlarni kasallik imzosi sifatida kiritdik (6A-D-rasm). Bashorat natijalariga ko‘ra, BRD-K78432605 eng yuqori moslik ballini oldi, bu uning KRAS bilan bog‘lanish yoki uning yo‘llarini modulyatsiya qilish ehtimolini ko‘rsatadi (6E va F-rasm). Molekulyar dokin tahlili shuni ko‘rsatdiki, BRD-K78432605 KRASning nofaol yopiq konformatsiyasi (PDB: 4EPR) bilan -16,154 kkal/mol bog‘lanish energiyasiga ega (6G-rasm). Bu qiymat -7,0 kkal/mol faollik chegarasidan ancha past bo‘lib, birikmaning termodinamik barqarorligini va KRASni nofaol holatda ushlab turish salohiyatini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Molekulyar dokin — dori molekulasi va oqsil nishoni o‘rtasidagi o‘zaro ta’sirni kompyuterda modellashtirish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;h4 id=\"kras-va-immun-tizimining-erta-qarishi-ortasidagi-bogliqlik-mexanizmlari\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#kras-va-immun-tizimining-erta-qarishi-ortasidagi-bogliqlik-mexanizmlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;KRAS va immun tizimining erta qarishi o‘rtasidagi bog‘liqlik mexanizmlari&lt;/span&gt;&lt;/a&gt;KRAS va immun tizimining erta qarishi o‘rtasidagi bog‘liqlik mexanizmlari&lt;/h4&gt;\n&lt;p&gt;Transkriptomik profilirlash, yagona hujayra sekveniroviyasi, virtual gen nokauti, chuqur o‘rganish va molekulyar dokinq usullarini birlashtirgan holda, ushbu tadqiqot erta ishemik yurak kasalligi (PCAD) bilan og‘rigan bemorlarning periferik qon T-limfotsitlarida KRAS proto-onkogeni ekspressiyasining oshganligini aniqladi. Biz yuqori KRAS darajasiga ega effektor CD8+ T-hujayralari eng yuqori qarish ko‘rsatkichlarini (senescence scores) namoyon etishini va bu ko‘rsatkichlar miokard infarkti (MI) guruhida sog‘lom nazorat guruhiga nisbatan yanada yuqoriroqligini aniqladik. Bu immun tizimining tezlashgan qarishidan dalolat beradi: yoshlarda T-hujayralarning ayrim subpopulyatsiyalari muddatidan oldin qarish fenotipini oladi, &lt;a href=\"concepts/senescence-associated-secretory-phenotype.html\"&gt;SASP&lt;/a&gt; omillarini ajratib chiqaradi va yuqori sitotoksiklikni namoyon etib, qon tomir devorini shikastlaydi. MI guruhida periferik qon mononuklear hujayralaridagi (PBMC) hujayralararo kommunikatsiya pasaygan bo‘lib, bu qarigan immun tizimiga xos bo‘lgan koordinatsiya yo‘qolishini aks ettiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;T-hujayralarida KRAS darajasining oshishi immun tizimining erta qarishi va yosh bemorlarda ateroskleroz rivojlanishini bog‘lovchi asosiy molekulyar bo‘g‘in hisoblanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SASP (senescence-associated secretory phenotype) — bu qarigan hujayralar tomonidan ajratiladigan sitokinlar, xemokinlar va proteazalar majmuasi bo‘lib, ular yallig‘lanish va to‘qimalarning shikastlanishiga olib keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"klinik-ahamiyat-va-diagnostik-salohiyat\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#klinik-ahamiyat-va-diagnostik-salohiyat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Klinik ahamiyat va diagnostik salohiyat&lt;/span&gt;&lt;/a&gt;Klinik ahamiyat va diagnostik salohiyat&lt;/h4&gt;\n&lt;p&gt;PCAD diagnostikasi murakkab masala bo‘lib qolmoqda, chunki mavjud xavf shkalalari (masalan, Pooled Cohort Equations) 40 yoshdan kichik shaxslar uchun moslashtirilmagan, koronar kalsiy (CAC) bo‘yicha tavsiyalar esa 45 yoshdan oshgan bemorlar ma’lumotlariga asoslangan. 10 yillik xavf pastdek ko‘rinsa-da, yoshlarda umr davomidagi xavf sezilarli va miokard infarkti prognozi ko‘pincha yomon. Hozirda PCAD uchun spesifik biomarkerlar cheklangan: C-reaktiv oqsil va plazma ateroskleroz indeksi (AIP) prognostik ahamiyatga ega, ammo keng klinik amaliyotga kiritilmagan. Bizning kashfiyotimiz KRAS va uning transkripsion signaturalarini immun tizimining erta biologik qarishini aks ettiruvchi va lipid profili bilan birga qo‘llanilishi mumkin bo‘lgan istiqbolli biomarkerlar sifatida ko‘rib chiqishga imkon beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kuzatuv xarakteriga ega; T-hujayralaridagi KRAS ekspressiyasi xavfni stratifikatsiya qilish va davolashni individuallashtirishga yordam berishini tasdiqlash uchun prospektiv ishlar zarur.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ccr7-ning-t-hujayralar-disfunksiyasidagi-roli\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#ccr7-ning-t-hujayralar-disfunksiyasidagi-roli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CCR7 ning T-hujayralar disfunksiyasidagi roli&lt;/span&gt;&lt;/a&gt;CCR7 ning T-hujayralar disfunksiyasidagi roli&lt;/h4&gt;\n&lt;p&gt;KRAS virtual nokauti CCR7 genining ekspressiyasi eng ko‘p o‘zgarishini ko‘rsatdi. CCR7 — bu T-hujayralarini limfoid organlarga yo‘naltiruvchi retseptor. Normada CCR7 signallari T-hujayraning antigen taqdim etuvchi hujayra bilan aloqasini o‘z vaqtida to‘xtatishni ta’minlaydi. KRAS ning g‘ayritabiiy aktivlashuvi natijasida CCR7 ekspressiyasi bostiriladi, bu ikki oqibatga olib keladi: birinchidan, T-hujayralari limfoid organlardagi nazoratdan qochib, periferik to‘qimalarga, shu jumladan arteriya devorlariga migratsiya qiladi; ikkinchidan, «ajralish» signali yo‘qligi sababli, blyashka ichidagi T-hujayralari TCR retseptorlarining ortiqcha stimulyatsiyasiga uchraydi va PD-1 hamda CTLA-4 ning yuqori ekspressiyasi bilan tavsiflanadigan toliqish (exhaustion) fenotipini oladi. Bu aterosklerotik blyashkalarda aniqlangan CD8+ T-hujayralarida yuqori sitotoksiklik va toliqish/qarish belgilarining paradoksal birga mavjudligini tushuntiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Virtual nokaut — bu genetik manipulyatsiyalarsiz transkriptomik ma’lumotlar tahlili asosida muayyan gen funksiyasini «o‘chirish» oqibatlarini bashorat qilishga imkon beruvchi kompyuter modellashtirish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"cheklovlar\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#cheklovlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar&lt;/span&gt;&lt;/a&gt;Cheklovlar&lt;/h4&gt;\n&lt;p&gt;Ushbu tadqiqot bir qator cheklovlar bilan tavsiflanadi. Birinchidan, ochiq ma'lumotlar bazalarida to'liq klinik kuzatuv ma'lumotlarining yo'qligi sababli, biz T-hujayralaridagi KRAS ekspressiyasi darajasi va yurak-qon tomir asoratlari kabi klinik natijalar o'rtasidagi bog'liqlikni bevosita baholay olmadik. Ikkinchidan, ma'lumotlar to'plamlari turli kasallik kontekstlaridan, jumladan, 45 yoshgacha bo'lgan bemorlarda koronar arteriya kasalligi, miokard ishemiyasi va rivojlangan aterosklerotik blyashkalardan olingan. Ushbu holatlar erta ateroskleroz spektriga kirsa-da, ularning bosqichlari turlicha bo'lib, ularni birlashtirish ma'lumotlar geterogenligini keltirib chiqarishi mumkin.&lt;/p&gt;\n&lt;p&gt;Uchinchidan, PBMCs (periferik qon mononuklear hujayralari) bo'yicha yagona hujayrali tahlil juda cheklangan donorlar soniga (ikki kasallik namunasi va to'rt nazorat) asoslangan. Biroq, asosiy topilmalar mustaqil blyashka scRNA-seq ma'lumotlari va immunoflyuoresan bo'yash usullari bilan tasdiqlandi. To'rtinchidan, barcha mexanistik xulosalar hisoblash tahlillari va mavjud ketma-ketlik ma'lumotlarini qayta tahlil qilishga asoslangan bo'lib, KRAS funksiyasini bevosita tekshirish (gain- or loss-of-function) amalga oshirilmagan. KRAS darajasining oshishi T-hujayralarining sitotoksik, qarigan fenotipini shakllantirish uchun yetarlimi yoki yo'qligini aniqlash uchun kelgusida lentiviral ortiqcha ekspressiya yoki T-hujayraga xos Kras nokaut modellari talab qilinadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot asosan hisoblash usullariga tayanadi, shuning uchun KRASning T-hujayralar fenotipiga ta'sirini eksperimental tasdiqlash zarur.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Nokaut (knock-out) — bu gen funksiyasini o'chirib qo'yish orqali uning biologik rolini aniqlash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot asosan bioinformatik tahlilga asoslangan; kichik namunalar hajmi individual farqlarni kuchaytirishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Beshinchidan, biz periferik qon T-hujayralarida KRAS mutatsiyalari mavjudligini tekshirmadik. Nihoyat, kompyuter bashorati orqali aniqlangan BRD-K78432605 birikmasi terapevtik ahamiyatga ega bo'lishidan oldin eksperimental tekshiruvdan o'tishi kerak.&lt;/p&gt;\n&lt;h4 id=\"ai-va-ai-yordamchi-vositalari-togrisida-bayonot\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#ai-va-ai-yordamchi-vositalari-togrisida-bayonot\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AI va AI yordamchi vositalari to'g'risida bayonot&lt;/span&gt;&lt;/a&gt;AI va AI yordamchi vositalari to'g'risida bayonot&lt;/h4&gt;\n&lt;p&gt;Mualliflar ma'lumotlarni tahlil qilishda sun'iy intellekt texnologiyalaridan foydalanganlar. scTenifoldKnk (1.0.3 versiyasi) in silico gen nokaut tahlili uchun ishlatilgan. Bu vosita yagona hujayrali gen regulyator tarmoqlarini quradi va maqsadli genni olib tashlab, uning regulyatorlik rolini aniqlaydi. DrugReflector modeli esa Connectivity Map (CMap) bazasi asosida dori vositalarini bashorat qilish uchun qo'llanilgan. Matn yaratish uchun generativ AI vositalari ishlatilmagan.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell-f1.jpg\" alt=\"1-rasm. Ushbu tadqiqotning ish jarayoni.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. Ushbu tadqiqotning ish jarayoni.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell-f2.jpg\" alt=\"2-rasm. Prematur yurak ishemik kasalligi (YIK) bilan og'rigan bemorlarning periferik qon mononuklear hujayralarida (PBMC\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm. Prematur yurak ishemik kasalligi (YIK) bilan og'rigan bemorlarning periferik qon mononuklear hujayralarida (PBMC) qarish bilan bog'liq bo'lgan markaziy genlarni aniqlash.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm. Prematur yurak ishemik kasalligi (YIK) bilan og'rigan bemorlarning periferik qon mononuklear hujayralarida (PBMC) qarish bilan bog'liq bo'lgan markaziy genlarni aniqlash. (A) YIK bemorlari va sog'lom nazorat guruhi o'rtasidagi differensial ifodalangan genlarning (DEG) vulqon grafigi. (B) Og'irlikdagi genlar ko-ekspressiyasi tarmog'i tahlili (WGCNA) natijasida olingan modul-belgi assotsiatsiyalarining issiqlik xaritasi; binafsha rangli modul YIK bilan eng kuchli korrelyatsiyani ko'rsatadi. (C) Binafsha rangli moduldan 315 ta asosiy gen, 2289 ta DEG va Aging Atlas ma'lumotlar bazasidan qarish bilan bog'liq 503 ta gen o'rtasidagi kesishishni ko'rsatuvchi Venn diagrammasi, bu uchta umumiy markaziy genni aniqlashga imkon berdi: TAB2, SYK va KRAS. (D) YIK guruhi va nazorat guruhi PBMC'larida TAB2, SYK va KRAS ekspressiya darajalarini ko'rsatuvchi skripka diagrammalari. (E) Uchta markaziy genning ekspressiya farqlarini qPCR bilan tasdiqlash. Ma'lumotlar o'rtacha ± standart og'ish sifatida taqdim etilgan; *p &amp;lt; 0,05, **p &amp;lt; 0,01, ***p &amp;lt; 0,001.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell-f3.jpg\" alt=\"3-rasm. PBMC yagona hujayrali ketma-ketlik natijalari asosiy genlarni ko'rsatadi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm. PBMC yagona hujayrali ketma-ketlik natijalari asosiy genlarni ko'rsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-rasm. PBMC yagona hujayrali ketma-ketlik natijalari asosiy genlarni ko'rsatadi. (A) PBMC'ning UMAP grafigi va hujayra turlari nisbati; (B) Turli hujayra turlarida marker gen ekspressiyasining pufakchali diagrammasi; (C) TAB2, SYK va KRAS ekspressiyasining taqsimlanishi; (D) Turli guruhlar va hujayra turlarida TAB2, SYK va KRAS ekspressiya darajalari (skripka diagrammalari sifatida ko'rsatilgan); (E) CellChat hujayralararo aloqa natijalari (soni va og'irligi); (F) Turli guruhlar o'rtasida CellChat hujayralararo aloqa natijalarini taqqoslash (soni va og'irligi); (G) Turli guruhlarda o'zaro ta'sir yo'llarining faollik darajalari; (H) GSVA yo'li faollik ko'rsatkichlarining issiqlik xaritasi; (I) MI guruhidagi T-hujayralarida yuqori ifodalangan genlarning GO boyitish tahlilining pufakchali diagrammasi; (J) MI guruhidagi T-hujayralarida yuqori ifodalangan genlarning KEGG boyitish tahlilining pufakchali diagrammasi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell-f4.jpg\" alt=\"4-rasm. PBMC'dagi T-hujayra subpopulyatsiyalarining funksional tahlili.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm. PBMC'dagi T-hujayra subpopulyatsiyalarining funksional tahlili.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-rasm. PBMC'dagi T-hujayra subpopulyatsiyalarining funksional tahlili. (A) T-hujayra subpopulyatsiyalarining UMAP grafigi va hujayra turlari nisbati; (B) Turli hujayra turlarida marker gen ekspressiyasining pufakchali diagrammasi; (C) KRAS ekspressiyasining taqsimlanishi; (D) Har bir T-hujayra subpopulyatsiyasida KRAS ekspressiya darajasi; (E) TCellSI funksional ko'rsatkichlarining issiqlik xaritasi; (F) scTenifoldKnk virtual nokautidan keyin sezilarli darajada o'zgargan genlar ulushining doiraviy diagrammasi; (G) Eng sezilarli darajada o'zgargan 10 ta genning ustunli diagrammasi; (H) Sezilarli darajada o'zgargan genlarning sochilish diagrammasi; (I) Sezilarli darajada o'zgargan genlarning GO boyitish tahlilining pufakchali diagrammasi; (J) Sezilarli darajada o'zgargan genlarning KEGG yo'li boyitish tahlilining pufakchali diagrammasi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell-f5.jpg\" alt=\"5-rasm. Koronar arteriya blyashkalarining yagona hujayrali ketma-ketlik natijalari KRAS yuqori ifodalangan T-hujayra sub\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm. Koronar arteriya blyashkalarining yagona hujayrali ketma-ketlik natijalari KRAS yuqori ifodalangan T-hujayra subpopulyatsiyasining mavjudligi va funksiyasini tasdiqlaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-rasm. Koronar arteriya blyashkalarining yagona hujayrali ketma-ketlik natijalari KRAS yuqori ifodalangan T-hujayra subpopulyatsiyasining mavjudligi va funksiyasini tasdiqlaydi. (A) Koronar arteriya blyashkalarining UMAP grafigi va hujayra turlari nisbati; (B) Blyashkalar ichidagi turli hujayra turlarida marker gen ekspressiyasining pufakchali diagrammasi; (C) KRAS ekspressiyasining taqsimlanishi; (D) Turli hujayra turlarida KRAS ekspressiya darajasi; (E) T-hujayra subpopulyatsiyalarining UMAP grafigi; (F) Blyashkalar ichidagi har bir T-hujayra subpopulyatsiyasida marker gen ekspressiyasining pufakchali diagrammasi; (G) KRAS-yuqori va KRAS-past Effektor CD8+ T-hujayralari o'rtasida TCellSI funksional ko'rsatkichlarini taqqoslash; (H) KRAS-yuqori subpopulyatsiyada differensial ifodalangan genlarning GO funksional boyitish tahlili; (I) Inson uyqu arteriyasi blyashkalarida immunofluo'zaro immunoflyuoressent ko-lokalizatsiya tasvirlari.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell-f6.jpg\" alt=\"6-rasm. DrugReflector chuqur o'rganish modeli yordamida dori vositalarini bashorat qilish va molekulyar dokining yordami\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm. DrugReflector chuqur o'rganish modeli yordamida dori vositalarini bashorat qilish va molekulyar dokining yordamida tasdiqlash.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;6-rasm. DrugReflector chuqur o'rganish modeli yordamida dori vositalarini bashorat qilish va molekulyar dokining yordamida tasdiqlash. (A–B) PBMC yagona hujayra natijalarini kiritgandan so'ng DrugReflector tomonidan bashorat qilingan birikmalarning ehtimolligi va logit balli (reytinglangan); (C–D) PBMC yagona hujayra natijalarini kiritgandan so'ng DrugReflector tomonidan bashorat qilingan birikmalarning ehtimolligi va logit balli taqsimoti grafiklari; (E–F) Ehtimollik va logit ballini bashorat qilish egri chiziqlarida ko'rsatilgan Top-10 va Top-20 birikmalar; (G) BRD-K78432605 molekulyar dokining konformatsiyasi va KRAS yopiq konformatsiyasining (PDB: 4EPR) sxematik diagrammasi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Erta&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600
