langar oralig‘idagi bo‘shliqlar banded Needleman-Wunsch tekislash (yarim kenglik = 12) bilan hal qilindi. O‘qish uchlari xuddi shu protsedura bo‘yicha maksimal 80 bp gacha tekislandi. Har bir referens pozitsiyasi uchun qamrov va har bir baza hisoblari (A, T, G va C) jadvalga kiritildi va og‘ish ko‘rsatkichi referens bazasiga mos kelmaydigan bazalarni aniqlash ulushi sifatida hisoblab chiqildi. Qamrovi ≥ 50× bo‘lgan va og‘ishi ≥ 10% bo‘lgan pozitsiyalar keyingi tekshiruv uchun belgilandi.&lt;/p&gt;\n&lt;p&gt;Barcha tahlillar NumPy, pandas va matplotlib kutubxonalari bilan Python 3.12 yordamida amalga oshirildi. Tashqi tekislash dasturiy ta’minoti ishlatilmadi. Referens ketma-ketliklar palindromik ketma-ketlik chegaralarida o‘rash effektli tekislash artefaktlarining oldini olish uchun har ikkala ITR dan uzoqroq pozitsiyada (&amp;gt; 2 kb) chiziqli holga keltirildi.&lt;/p&gt;\n&lt;h4 id=\"oxford-nanopore-ketma-ketligini-tahlil-qilish\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#oxford-nanopore-ketma-ketligini-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Oxford Nanopore ketma-ketligini tahlil qilish&lt;/span&gt;&lt;/a&gt;Oxford Nanopore ketma-ketligini tahlil qilish&lt;/h4&gt;\n&lt;p&gt;AAV virusli genomlaridan olingan Oxford Nanopore o‘qishlari maxsus sifat nazorati quvuri (aav_genome_qc.py) yordamida tahlil qilindi. Invertlangan terminal takrorlanishlar (ITR) to‘liq uzunlikdagi cis-plazmid referens ketma-ketligidan palindromik tuzilish va serotipga xos motivlar asosida avtomatik ravishda aniqlandi. O‘qishlar minimap2 orqali mappy yordamida \"map-ont\" sozlamasi bilan cis-plazmid referensiga tekislandi. Kontaminatsiyani tahlil qilish helper-plazmid, rep-cap-plazmid va xo‘jayin (E. coli) referens ketma-ketliklariga raqobatbardosh xaritalash orqali amalga oshirildi, bunda o‘qishlar eng yuqori xaritalash sifati ballini (minimal &lt;a href=\"concepts/mapping-quality.html\"&gt;MAPQ&lt;/a&gt; ≥ 20) ta’minlovchi referensga tayinlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MAPQ (Mapping Quality) — bu o‘qishning genomning to‘g‘ri joyiga xaritalanganligiga bo‘lgan ishonch ko‘rsatkichi; ≥ 20 qiymati xatolik ehtimoli 1% dan kamligini bildiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Transgenga xaritalangan o‘qishlar ITR chegaralariga nisbatan tekislash koordinatalari asosida to‘liq uzunlikdagi bir zanjirli AAV (ssAAV), to‘liq uzunlikdagi o‘z-o‘zini to‘ldiruvchi AAV (scAAV), qisman ssAAV (5' yoki 3' uchi to‘liq bo‘lmagan genom fragmentlari), qisman scAAV (snapback genomlar) yoki teskari qadoqlash mahsulotlariga strukturaviy ravishda tasniflandi. Pozitsion qoplash va zanjirga xos qoplash transgen kiritish hududi bo‘ylab asoslar sifati filtri (minimal Q ≥ 10) bilan hisoblab chiqildi. ITR qoplash statistikasi ikkala terminal takrorlanish uchun alohida hisoblandi. Kesilish nuqtalari transgenga xaritalangan o‘qishlarning tekislash boshlanish va tugash koordinatalari bo‘yicha aniqlandi. Barcha natijalar CSV fayllari sifatida eksport qilindi va Excel'da grafiklar ko‘rinishida vizuallashtirildi. Barcha FASTQ fayllari Sequence Read Archive (PRJNA1439403, 2026-03-19 da e’lon qilingan) da mavjud. Tahlil kodi https://github.com/fredbunz-lgtm/aav-itr-pileup (DOI: 10.5281/zenodo.19186494) manzilida mavjud.&lt;/p&gt;\n&lt;h4 id=\"addgene-plazmidlar-omborini-korib-chiqish\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#addgene-plazmidlar-omborini-korib-chiqish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Addgene plazmidlar omborini ko‘rib chiqish&lt;/span&gt;&lt;/a&gt;Addgene plazmidlar omborini ko‘rib chiqish&lt;/h4&gt;\n&lt;p&gt;Addgene plazmid ketma-ketligi ma’lumotlari Addgene Developers API orqali token asosidagi autentifikatsiya yordamida olindi. Katalog qidiruvi cheklanganligi sababli, ketma-ketliklarni tahlil qilish uchun plazmidlar va ularning ketma-ketliklarini ommaviy yuklab olishdan foydalanildi. Olingan JSON fayli butun ma’lumotlar to‘plamini operativ xotiraga yuklamaslik uchun oqimli tarzda o‘qildi. Birinchi navbatda AAV bilan bog‘liq plazmid-nomzodlarni aniqlash uchun metama’lumotlarga asoslangan skrining ishlatildi. Keyin plazmid-nomzodlar mahalliy tekislashga asoslangan ITR aniqlash ish jarayoni yordamida AAV ITR ketma-ketliklari uchun skanerlandi. Ketma-ketlik darajasidagi ITR chaqiruvlari bir xil plazmidning bir nechta ketma-ketlik fayllarini mustaqil biologik ITR sifatida hisoblamaslik uchun vakillik ketma-ketlik yozuvlari yordamida plazmid darajasidagi xulosalarga keltirildi. Agar plazmid uchun bir nechta ketma-ketlik yozuvlari mavjud bo‘lsa, ITR strukturaviy tasnifi uchun vakillik yozuvlari aniqlanadigan ITRlarning mavjudligi va soni asosida tanlab olindi.&lt;/p&gt;\n&lt;p&gt;ITR chaqiruvlari ham \"flip\", ham \"flop\" konfiguratsiyalarini va ikkala depozit qilingan zanjir yo‘nalishlarini ifodalovchi AAV2 ITR referens ketma-ketliklari bilan tekislash orqali tasniflandi. Har bir ITR chaqiruvi uchun \"flip/flop\" konfiguratsiyasini aniqlashda eng mos referens ishlatildi. ITR strukturaviy sinflari tekislangan referens diapazoni, tekislangan plazmid diapazoni va Δ11 birikma holati asosida tayinlandi. ITRlar 145-bp to‘liq uzunlikdagi ITRlar, 130-bp kesilgan ITRlar, 119-bp Δ11 ITRlar, aniq Δ11 motiviga ega bo‘lmagan 119-o‘xshash ITRlar yoki boshqa o‘zgartirilgan/kesilgan ITRlar sifatida tasniflandi. Ikki ITRni o‘z ichiga olgan plazmidlar juft ITR arxitekturasi bo‘yicha umumlashtirildi. pAAV2ST (Addgene plazmidi 239400) ikkita to‘liq uzunlikdagi 145-bp ITRni aniqlash uchun ijobiy nazorat sifatida xizmat qildi.&lt;/p&gt;\n&lt;p&gt;Δ11 mutatsiyasining tarqalishi 11-bp deletsiyasiga mos keladigan 34-bp ketma-ketligini har ikki yo‘nalishda qidirish orqali baholandi. Doiraviy ketma-ketliklar har bir ketma-ketlikning dastlabki 33 asosini uning oxiriga qo‘shish orqali qayta ishlandi, bu ichki motivlar hisobini takrorlamasdan ketma-ketlikni chiziqli qilish nuqtasini qamrab oluvchi motiv namunalarini aniqlash imkonini berdi. Δ11 ni o‘z ichiga olgan ma’lum nazorat ketma-ketligi aniq motiv ish jarayoni bitta kutilgan motiv namunasini xabar qilganligini tekshirish uchun ishlatildi.&lt;/p&gt;\n&lt;p&gt;Kelib chiqish yaqinligini tahlil qilish uchun bakterial replikatsiya kelib chiqishi koordinatalari GenBank rep_origin xususiyatlari annotatsiyalaridan olindi. Ommaviy ketma-ketliklardan olingan ITR va Δ11 koordinatalari vakillik ommaviy va GenBank yozuvlari o‘rtasida ketma-ketlik uzunligi, ketma-ketlik identifikatsiyasi va Δ11 holati mosligini tasdiqlagandan so‘ng GenBank ketma-ketlik koordinatalari bilan solishtirildi. Plazmidlar birlamchi kelib chiqish yaqinligi tahliliga faqat vakillik ketma-ketligi aniq ikkita ITR va aniq bitta Δ11 motivini o‘z ichiga olgan taqdirdagina kiritildi. Har bir ITR o‘rtasidan bakterial kelib chiqish o‘rtasigacha bo‘lgan doiraviy masofa hisoblandi va Δ11 ni o‘z ichiga olgan ITR annotatsiya qilingan plazmid ori elementiga nisbatan yaqinroq yoki uzoqroq ekanligiga qarab tasniflandi.&lt;/p&gt;\n&lt;h4 id=\"genomik-integratsiya-tahlili\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#genomik-integratsiya-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Genomik integratsiya tahlili&lt;/span&gt;&lt;/a&gt;Genomik integratsiya tahlili&lt;/h4&gt;\n&lt;p&gt;Genlarni maqsadli tahrirlash uchun mo‘ljallangan pSEPTp53 vektori TP53 nokauti uchun kassetani o‘z ichiga oladi, u sintetik ekzon promotor tuzog‘ini o‘rab turgan ikkita ~1 kb uzunlikdagi gomologiya yelkalaridan iborat. Ushbu kasseta pAAV-MCS (Agilent) AAV vektorining NotI saytlariga klonlangan. pSEPTp53 plazmidasi NotI fermenti bilan kesilgan va defosforillangan fragment NotI bilan kesilgan pAAV-MCS vektoriga har ikki yo‘nalishda qayta kiritilgan. Xuddi shu fragment to‘g‘ridan-to‘g‘ri pAAVcis plazmidasining NotI saytlariga klonlangan. Olingan uchta plazmida avval ta’riflanganidek, AAV Helper-Free System (Agilent) yordamida AAV2 kapsidlariga qadoqlangan. Tozalanmagan virusli stoklar miqdoriy PZR (&lt;a href=\"concepts/qpcr.html\"&gt;qPCR&lt;/a&gt;) usuli bilan titrlangan va 10 ga teng infeksiyalash ko‘pligida (MOI) subkonfluent monolayer madaniyatlarida o‘sayotgan HCT116 va hTERT-RPE1 hujayralariga qo‘shilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/moi.html\"&gt;Infeksiyalash ko‘pligi&lt;/a&gt; (MOI) — bu madaniyatdagi har bir hujayraga to‘g‘ri keladigan o‘rtacha virus zarrachalari soni; bu holda har bir hujayraga 10 ta virus zarrachasi to‘g‘ri keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Infeksiyadan uch kun o‘tgach, hujayralar tripsin-EDTA yordamida ajratilgan va 0,4 mg/ml geneticin (ThermoFisher Scientific) bilan boyitilgan muhitda 96 o‘rali planshetlarga (Corning) cheklangan suyultirish usuli bilan ekilgan. Har bir planshetlar to‘plami uchun 60 dan 110 gacha alohida koloniyalar hisoblab chiqilgan va genomik DNK to‘g‘ridan-to‘g‘ri Lyse-N-Go PCR (Pierce Biotechnology, Rockford, IL) reagenti yordamida ajratib olingan. TP53 lokusiga gomologik integratsiyani tekshirish uchun PZR skriningi ishlab chiqaruvchining tavsiyalariga binoan Platinum Taq (ThermoFisher Scientific) fermenti yordamida quyidagi praymerlar bilan amalga oshirilgan: p53R, 5’-TGTGTGTGACTGCTTGTAG-3’; NeoFor, 5’-TCTGGATTCATCGACTGTGG-3’. 1,8 kb o‘lchamdagi musbat signal bergan namunalar p53F, 5’-CTGGGAGAAGGTGCGATGAT-3’ va NeoRev, 5’-GTTGTGCCCAGTCATAGCCG-3’ praymerlari bilan ikkinchi PZR orqali tasdiqlangan, ular gomologik integratsiya hodisalarida 2,2 kb o‘lchamdagi polosa hosil qilgan.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-f2.jpg\" alt=\"2-rasm. ITR bo'ylab assimetrik Sanger sekvenirovkasi sifati.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm. ITR bo'ylab assimetrik Sanger sekvenirovkasi sifati.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm. ITR bo'ylab assimetrik Sanger sekvenirovkasi sifati. 1c-rasmda yulduzchalar bilan belgilangan SmaI-sezgir (a) pSM620 va (b) psub201 subklonlarining chap va o'ng ITRlari 1b-rasmda ko'rsatilgan praymerlar bilan modifikatsiyalangan Sanger usuli yordamida sekvenirlandi. Har bir pozitsiyadagi asosiy chaqiruvning nisbiy ishonchliligi harf balandligi bilan ko'rsatilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-f3.jpg\" alt=\"3-rasm. pSM620 ITR elementlari bo'ylab nanopor sekvenirovkasi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm. pSM620 ITR elementlari bo'ylab nanopor sekvenirovkasi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-rasm. pSM620 ITR elementlari bo'ylab nanopor sekvenirovkasi. Chap ITR (a) va o'ng ITR (b) bo'ylab o'qishlarni to'plash (read pileup) tahlili grafik tarzda tasvirlangan. Yig'ilgan ustunli grafik gorizontal o'qda ko'rsatilganidek, har bir pozitsiyadagi asoslar ulushini ko'rsatadi. Aniqlangan qo'shimchalar va o'chirishlar har bir pozitsiyadagi barcha o'qishlarning ulushi sifatida ifodalanadi. Off-mode syujeti har bir pozitsiyada o'qishlarning mos yozuvlar ketma-ketligidan farqini ifodalaydi. (c) pSM620 dagi AAV2 qo'shimchasi bo'ylab har bir pozitsiyadagi ketma-ketlik farqi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-f6.jpg\" alt=\"6-rasm. Sintetik rAAV cis plazmidasini tahlil qilish.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm. Sintetik rAAV cis plazmidasini tahlil qilish.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;6-rasm. Sintetik rAAV cis plazmidasini tahlil qilish. (a) 145 bp AAV2 ITRlari bilan o'ralgan GFP ekspressiya kassetasi yuqori nusxali pUC57-KAN klonlash vektorida yig'ildi. (b) 72 soat davomida uzluksiz kultivatsiyadan so'ng, 10 ta mustaqil subklon ko'paytirildi va ajratib olingan DNK SmaI bilan hazm qilindi. Yulduzcha bilan belgilangan madaniyat (*, 7-klon) subklonal tahlilning ikkinchi bosqichi uchun yangi bakterial plastinkaga ekildi. (c) pAAVcis 7-klonidan ITRlarni nanoporli sekvenlash tahlili. (d) rAAV inserti bo'ylab nanoporli pileup ma'lumotlaridagi off-mode bazalari.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-f7.jpg\" alt=\"7-rasm. 4750 bp CRISPR/SaCas9 tizimini o'rab turgan ITRlarning barqaror tarqalishi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-rasm. 4750 bp CRISPR/SaCas9 tizimini o'rab turgan ITRlarning barqaror tarqalishi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;7-rasm. 4750 bp CRISPR/SaCas9 tizimini o'rab turgan ITRlarning barqaror tarqalishi. (a) pBR322 dan tetr seleksiya markeri pAAVcisdagi qo'shni ori va ITR elementlari orasiga kiritilib, yangi pAAV2ST (ST = barqaror) kirish vektori yaratildi. pAAV2STdagi ori va o'ng ITR ko'rsatilganidek, 1797 bp masofada joylashgan. GFP kassetasi NotI bilan hazm qilish orqali kesilishi mumkin. Shu bilan bir qatorda, BsaI bilan hazm qilish Golden Gate usuli (31) yordamida yo'naltirilgan klonlashni osonlashtiradi. (b) GFP ekspressiya kassetasi sichqon Pcsk9 lokusiga (17) yo'naltirilgan SaCas9 inserti bilan almashtirildi. (c) pAAV2ST-Pcsk9sg1 plazmidasini o'z ichiga olgan bakteriyalar 72 soat davomida ketma-ket kultivatsiya qilindi. 24 soatlik intervallar bilan ajratilgan DNKlar SmaI bilan hazm qilindi. (d) 10 mg gigaprep'dan olingan pAAV2ST-Pcsk9sg1 DNKsi gel elektroforezidan oldin kesilmagan yoki SmaI bilan hazm qilingan holda qoldirildi. 10 ta mustaqil subklondan olingan hazm qilingan DNKlar bir xil gelda tahlil qilindi. (e) Katta hajmdagi pAAV2ST-Pcsk9sg1 DNK preparatidan ITRlarning nanoporli o'qish pileup tahlili. Nukleotid pozitsiyalari gorizontal o'qlarda ko'rsatilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-f8.jpg\" alt=\"8-rasm. pAAV2ST-Pcsk9sg1 dan qutqarilgan virusli zaxirani tahlil qilish.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-rasm. pAAV2ST-Pcsk9sg1 dan qutqarilgan virusli zaxirani tahlil qilish.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;8-rasm. pAAV2ST-Pcsk9sg1 dan qutqarilgan virusli zaxirani tahlil qilish. (a) Gradiyent bilan tozalangan AAV8 zarralarining massa fotometriya tahlili. (b) 57 000x kattalashtirishda transmissiya elektron mikroskopiyasi orqali vizualizatsiya qilingan tozalangan virus zarralari. Bo'sh kapsidlarning namunalari oq strelkalar bilan ko'rsatilgan. Masshtab chizig'i = 100 nm. (c) Transgen yukiga, Rep-Cap va yordamchi plazmid DNKlariga, E. coli genomiga va xaritalanmagan o'qishlarga mos keladigan o'qishlarning taqsimoti ko'rsatilgan. (d) Nanoporli DNK sekvenlash orqali baholangan inkapsidlangan genomik DNKlarning uzunlik taqsimoti. (e) ITR bilan o'ralgan transgenga xaritalangan barcha o'qishlarning boshlanish va tugash koordinatalari.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-f9.jpg\" alt=\"9-rasm. Addgene AAV cis plazmidlaridagi ITR arxitekturalarini ketma-ketlik asosida o'rganish.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;9-rasm. Addgene AAV cis plazmidlaridagi ITR arxitekturalarini ketma-ketlik asosida o'rganish.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;9-rasm. Addgene AAV cis plazmidlaridagi ITR arxitekturalarini ketma-ketlik asosida o'rganish. (a) Tahlil quvuri: Addgene plazmid ketma-ketligi ma'lumotlar to'plami 177 835 ta plazmid va 297 680 ta ketma-ketlik yozuvini o'z ichiga olgan. Metadata filtrlash 7491 ta nomzod AAV plazmidasini aniqladi, ulardan 7041 tasi ketma-ketlik bilan tasdiqlangan AAV ITRlarini o'z ichiga olgan. ITR o'z ichiga olgan plazmidlarning aksariyati ikkita ITRni o'z ichiga olgan. (b) 6824 ta ikki ITRli plazmidlar orasidagi strukturaviy sinflar. Ikkita ITR o'zlarining tegishli uzunliklari bo'yicha birinchi ITR/ikkinchi ITR sifatida belgilanadi. Dominant arxitektura Δ11 mutatsiyasiga ega 119 bp ITR va 130 bp ITRdan iborat edi. Ushbu plazmidlarning taxminan uchdan bir qismi ikkita 130 bp ITRni o'z ichiga olgan. Cis-plazmidlarning ancha kichik soni ikkita to'liq uzunlikdagi 145 bp ITRga ega edi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-f10.jpg\" alt=\"10-rasm. Nashr etilgan rAAV cis plazmidlarida ifodalangan ITRlar.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;10-rasm. Nashr etilgan rAAV cis plazmidlarida ifodalangan ITRlar.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;10-rasm. Nashr etilgan rAAV cis plazmidlarida ifodalangan ITRlar. (a) Tabiiy 145 nt ITR dupleks mintaqani (A/A'), ikkita soch turmagini (B/B' va C/C') va bir zanjirli domenni (D) o'z ichiga oladi. Rep oqsili tomonidan tan olingan bog'lovchi element ramkaga olingan. Soya qilingan qismlar zamonaviy rekombinant AAV vektorlarida keng tarqalgan 11 nt ichki delesiya va 15 nt qisqartirish natijasida yo'q qilingan nukleotidlarni ifodalaydi. C/C' dupleksi ko'rsatilganidek, dupleks SmaI tanib olish joyini hosil qiladi. (b) 130 nt ITR ajdodlar 15 nt qisqartirish orqali yaratilgan. (c) Umumiy 119 nt ITR 15 bp qisqartirish va 11 nt ichki Δ11 delesiyasini o'z ichiga oladi. (d) 145 nt ITR plazmidasi (pL-ITR) va 11 bp ichki delesiyani o'z ichiga olgan variant (pL-ITRΔ11) alohida sintez qilindi. Ikkita plazmid ortib borayotgan SmaI miqdori bilan hazm qilindi va tabiiy agaroz gelida ajratildi. Supero'ralgan kesilmagan, chiziqli va niklangan turlarning pozitsiyalari ko'rsatilganidek.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-f11.jpg\" alt=\"11-rasm. Gomologik va nogomologik integratsiya nisbiy darajalarini baholash.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;11-rasm. Gomologik va nogomologik integratsiya nisbiy darajalarini baholash.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;11-rasm. Gomologik va nogomologik integratsiya nisbiy darajalarini baholash. (a) pAAV-MCS hosilasi bo'lgan pSEPT-p53, virusli genomlarning inson TP53 lokusiga gomologik integratsiyasi uchun mo'ljallangan promotor-tuzoq vektoridir (18). Ikkita gomologiya domeni (HA-1 va HA-2) 2-ekzondagi kichik deletsiyani belgilaydi, u gomologik integratsiya vaqtida promotorga ega bo'lmagan neomitsin kassetasi bilan almashtiriladi (chapda). Ushbu konstruksiya ITR bilan mikrogomologiyaga ega bo'lgan nishon bo'lmagan saytlarga ham integratsiya qilinadi; ITR qoldiqlari endogen gen va nishon konstruksiyasi orasidagi tutashuv joylarida mavjud bo'lishi kerak (o'ngda). Insersion mutagenezning nisbiy xavfini nishonga olingan va nishonga olinmagan integratsiya hodisalari nisbati bo'yicha baholash mumkin. (b) pSEPT-p53 dan olingan NotI-NotI inserti ikkala yo'nalishda assimetrik pAAV-MCS o'zagiga va pAAVcis ga klonlangan. Insert yo'nalishiga nisbatan o'ng va chap ITR uzunliklari (bp da) ko'rsatilgan. (c) Har bir vektordan olingan neomitsinga chidamli (neor) koloniyalar soni HCT116 hujayralari (kulrang ustunlar) yoki hTERT-RPE1 hujayralari (oq ustunlar) infeksiyasidan uch hafta o'tgach hisoblab chiqildi. Vektorlar gorizontal o'qlar bo'ylab chap ITR uzunligi / o'ng ITR uzunligi sifatida belgilangan. (d) TP53 lokusiga gomologik integratsiya natijasida hosil bo'lgan neor koloniyalar ulushi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Gen terapiyasi&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;xomashyosidagi&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;mutatsiyalar&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\
