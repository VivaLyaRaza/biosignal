        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Konferensiyalar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;европейский форум нейронаук&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-fens_forum.jpg\" alt=\"FENS Forum\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;европейский форум нейронаук&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima olamiz&lt;/td&gt;\n&lt;td&gt;европейские лаборатории нейронауки&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-brain.html\"&gt;Miya va asab tizimi&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"konferensiya-nima\"&gt;&lt;a href=\"reference/conferences/conf-fens_forum.html#konferensiya-nima\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Konferensiya nima&lt;/span&gt;&lt;/a&gt;Konferensiya nima&lt;/h2&gt;\n&lt;p&gt;FENS Forum (Yevropa neyrofanlar forumi) — miya va asab tizimini o‘rganishga bag‘ishlangan Yevropadagi eng yirik ilmiy konferensiya. Tadbir dunyoning turli burchaklaridan minglab tadqiqotchilarni neyronlar faoliyati, miya patologiyalari va ularni davolash usullarini muhokama qilish uchun birlashtiradi. Bu molekulyar jarayonlardan tortib murakkab kognitiv funksiyalargacha bo‘lgan neyrofanlar kun tartibi shakllanadigan maydondir.&lt;/p&gt;\n&lt;h2 id=\"tashkilotchilar-va-tarix\"&gt;&lt;a href=\"reference/conferences/conf-fens_forum.html#tashkilotchilar-va-tarix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashkilotchilar va tarix&lt;/span&gt;&lt;/a&gt;Tashkilotchilar va tarix&lt;/h2&gt;\n&lt;p&gt;Yevropa neyrofanlar jamiyatlari federatsiyasi (FENS) homiyligida o‘tkaziladi. Tashkilot milliy neyrobiologlar jamiyatlari ishini muvofiqlashtiradi va Yevropa laboratoriyalari o‘rtasida bilim almashinuviga ko‘maklashadi. FENS Forum har ikki yilda bir marta o‘tkaziladi va har safar mezbon shaharni o‘zgartiradi, bu esa Yevropaning turli ilmiy markazlarini muhokamaga jalb qilish imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"mavzular-va-seksiyalar\"&gt;&lt;a href=\"reference/conferences/conf-fens_forum.html#mavzular-va-seksiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavzular va seksiyalar&lt;/span&gt;&lt;/a&gt;Mavzular va seksiyalar&lt;/h2&gt;\n&lt;p&gt;Forum dasturi neyrofanlarning barcha jihatlarini qamrab oladi. Asosiy yo‘nalishlar:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Molekulyar va hujayra neyrobiologiyasi: Altsgeymer kasalligi kabi neyrodegeneratsiya mexanizmlarini o‘rganish.&lt;/li&gt;\n&lt;li&gt;Miya rivojlanishi: Gaucher kasalligi kabi genetik kasalliklar va erta stressning miya aloqalariga ta’siri.&lt;/li&gt;\n&lt;li&gt;Kognitiv neyrofan: xotira qanday saqlanishi, vizual tasvirlarning qayta tiklanishi yoki afantaziya sabablari.&lt;/li&gt;\n&lt;li&gt;Terapevtik strategiyalar: gen terapiyasi va hujayralararo toksik oqsillar almashinuvi mexanizmlari.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u-yerda-nimalar-taqdim-etiladi\"&gt;&lt;a href=\"reference/conferences/conf-fens_forum.html#u-yerda-nimalar-taqdim-etiladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;U yerda nimalar taqdim etiladi&lt;/span&gt;&lt;/a&gt;U yerda nimalar taqdim etiladi&lt;/h2&gt;\n&lt;p&gt;FENS Forum ilg‘or tadqiqotlarning birinchi taqdimot joyi hisoblanadi. Olimlar bu yerda «mini-miya» tajribalari natijalari, ishchi xotira bo‘yicha fMRI tahlillari va qaramlikni davolashning yangi usullarini namoyish etishadi. Shuningdek, konferensiya akademik muhitdagi gender tengsizligi kabi tizimli muammolarni muhokama qilish uchun platforma vazifasini o‘taydi.&lt;/p&gt;\n&lt;h2 id=\"qanday-kuzatish-va-ishtirok-etish\"&gt;&lt;a href=\"reference/conferences/conf-fens_forum.html#qanday-kuzatish-va-ishtirok-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday kuzatish va ishtirok etish&lt;/span&gt;&lt;/a&gt;Qanday kuzatish va ishtirok etish&lt;/h2&gt;\n&lt;p&gt;Forumda ishtirok etish professional neyrobiologlar, aspirantlar va talabalar uchun ochiq. Dastur yalpi ma’ruzalar, simpoziumlar va poster sessiyalarini o‘z ichiga oladi. Shaxsan qatnasha olmaydiganlar uchun FENS tezislar va European Journal of Neuroscience kabi jurnallardagi nashrlarga kirish imkonini beradi. E’lonlarni federatsiyaning rasmiy portalida kuzatib borish mumkin.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/conferences/conf-fens_forum.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%90%D0%B2%D1%82%D0%BE%D0%BC%D0%BE%D0%B1%D0%B8%D0%BB%D0%B8%D1%81%D1%82%D1%8B_%D0%B4%D0%BB%D1%8F_%D1%81%D0%B5%D0%B1%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Автомобилисты для себя — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:IBRO_logo_main_2022.png\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Carolaraujos, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1111/ejn.12644\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Neural and psychological mechanisms underlying compulsive drug seeking habits and drug memories--indications for novel treatments of addiction&lt;/a&gt; — sharh, Eur J Neurosci 2014&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3389/fnhum.2019.00180\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Neural Correlates of Verbal Working Memory: An fMRI Meta-Analysis&lt;/a&gt; — sharh, Front Hum Neurosci 2019&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.neuron.2021.06.002\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Gender bias in academia: A lifetime problem that needs solutions&lt;/a&gt; — sharh, Neuron 2021&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Konferensiyalar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"европейский форум нейронаук"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"FENS Forum","description":"европейский форум нейронаук","vcsPath":"reference/conferences/conf-fens_forum.md"},"headings":[{"title":"Konferensiya nima","href":"reference/conferences/conf-fens_forum.html#konferensiya-nima","level":2},{"title":"Tashkilotchilar va tarix","href":"reference/conferences/conf-fens_forum.html#tashkilotchilar-va-tarix","level":2},{"title":"Mavzular va seksiyalar","href":"reference/conferences/conf-fens_forum.html#mavzular-va-seksiyalar","level":2},{"title":"U yerda nimalar taqdim etiladi","href":"reference/conferences/conf-fens_forum.html#u-yerda-nimalar-taqdim-etiladi","level":2},{"title":"Qanday kuzatish va ishtirok etish","href":"reference/conferences/conf-fens_forum.html#qanday-kuzatish-va-ishtirok-etish","level":2},{"title":"Manbalar","href":"reference/conferences/conf-fens_forum.html#manbalar","level":2}],"title":"FENS Forum"},"router":{"pathname":"reference/conferences/conf-fens_forum","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
