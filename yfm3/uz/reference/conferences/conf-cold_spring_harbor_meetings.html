        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Konferensiyalar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;встречи лаборатории Колд-Спринг-Харбор (она же ведёт bioRxiv)&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;встречи лаборатории Колд-Спринг-Харбор (она же ведёт bioRxiv)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima olamiz&lt;/td&gt;\n&lt;td&gt;геномика, нейронаука, рак&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-genes.html\"&gt;Genlar va genomlar&lt;/a&gt;, &lt;a href=\"concepts/spec-brain.html\"&gt;Miya va asab tizimi&lt;/a&gt;, &lt;a href=\"concepts/spec-cancer.html\"&gt;Saraton va onkologiya&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"konferensiya-nima\"&gt;&lt;a href=\"reference/conferences/conf-cold_spring_harbor_meetings.html#konferensiya-nima\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Konferensiya nima&lt;/span&gt;&lt;/a&gt;Konferensiya nima&lt;/h2&gt;\n&lt;p&gt;Cold Spring Harbor Meetings — bu Nyu-York shtatidagi Cold Spring Harbor laboratoriyasi (CSHL) bazasida o‘tkaziladigan ilmiy konferensiyalar turkumi. Bu uchrashuvlar biologiya va tibbiyot sohasidagi ilg‘or yutuqlar muhokama qilinadigan dunyodagi eng nufuzli maydonlardan biri hisoblanadi. Ommaviy kongresslardan farqli o‘laroq, CSHL uchrashuvlari ko‘pincha tor doiradagi va yo‘naltirilgan xarakterga ega bo‘lib, bu yetakchi ekspertlar va yosh tadqiqotchilar o‘rtasida chuqur ma’lumot almashinuviga yordam beradi.&lt;/p&gt;\n&lt;h2 id=\"tashkilotchilar-va-tarix\"&gt;&lt;a href=\"reference/conferences/conf-cold_spring_harbor_meetings.html#tashkilotchilar-va-tarix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashkilotchilar va tarix&lt;/span&gt;&lt;/a&gt;Tashkilotchilar va tarix&lt;/h2&gt;\n&lt;p&gt;Cold Spring Harbor laboratoriyasi — Long-Aylenddagi Lorel-Xollou shahrida joylashgan xususiy notijorat tadqiqot tashkilotidir. Laboratoriya tarixi molekulyar biologiya rivoji bilan chambarchas bog‘liq. Bugungi kunda CSHL nafaqat fundamental tadqiqotlar markazi, balki ilmiy kommunikatsiya uchun asosiy xab hisoblanadi, jumladan, olimlar o‘z ishlarini jurnallarda rasmiy taqrizdan o‘tishidan oldin e’lon qiladigan bioRxiv platformasini qo‘llab-quvvatlaydi.&lt;/p&gt;\n&lt;h2 id=\"mavzular-va-seksiyalar\"&gt;&lt;a href=\"reference/conferences/conf-cold_spring_harbor_meetings.html#mavzular-va-seksiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavzular va seksiyalar&lt;/span&gt;&lt;/a&gt;Mavzular va seksiyalar&lt;/h2&gt;\n&lt;p&gt;Konferensiyalar dasturi laboratoriyaning asosiy yo‘nalishlarini qamrab oladi: genomika, neyrofan, onkologiya, miqdoriy biologiya va botanika. Uchrashuvlar mavzulari ko‘pincha zamonaviy tibbiyotning dolzarb muammolari bilan kesishadi. Masalan, konferensiyalarda glioblastomaning rivojlanish mexanizmlari va xolesterin almashinuvi kabi metabolik yo‘llar orqali unga qarshi kurashish usullari muhokama qilinadi. Shuningdek, noyob kasalliklarning genetik asoslari, ichak mikrobiomi ishtirokida o‘smalarning metastazlanish mexanizmlari va saratonga qarshi immunologik strategiyalar, jumladan, regulyator T-hujayralarini qayta dasturlash diqqat markazida.&lt;/p&gt;\n&lt;h2 id=\"u-yerda-nimalar-paydo-boladi\"&gt;&lt;a href=\"reference/conferences/conf-cold_spring_harbor_meetings.html#u-yerda-nimalar-paydo-boladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;U yerda nimalar paydo bo‘ladi&lt;/span&gt;&lt;/a&gt;U yerda nimalar paydo bo‘ladi&lt;/h2&gt;\n&lt;p&gt;CSHL konferensiyalari yangi g‘oyalar uchun «inkubator» vazifasini o‘taydi. Aynan shu yerda tibbiy tasvirlarni tahlil qilish uchun sun’iy intellekt usullaridan foydalangan tadqiqot natijalari yoki xotiralarni saqlash uchun mas’ul bo‘lgan miya neyron tarmoqlarini o‘rganishning yangi yondashuvlari birinchi marta e’lon qilinadi. Ishtirokchilar bemorlarning hujayralaridan o‘stirilgan «mini-miya» (organoidlar) yordamida olingan ma’lumotlarni yoki invaziv biopsiyani almashtirishi mumkin bo‘lgan gormon metabolitlari uchun qon tahlili natijalarini taqdim etadilar. Shuningdek, bu yerda ayrim odamlar nima uchun sepsis kabi yallig‘lanish jarayonlariga boshqalarga qaraganda ko‘proq moyil ekanligini tushunishga yordam beradigan populyatsiyalarning genetik tadqiqotlari muhokama qilinadi.&lt;/p&gt;\n&lt;h2 id=\"qanday-kuzatish-va-ishtirok-etish\"&gt;&lt;a href=\"reference/conferences/conf-cold_spring_harbor_meetings.html#qanday-kuzatish-va-ishtirok-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday kuzatish va ishtirok etish&lt;/span&gt;&lt;/a&gt;Qanday kuzatish va ishtirok etish&lt;/h2&gt;\n&lt;p&gt;CSHL konferensiyalarida ishtirok etish oldindan ro‘yxatdan o‘tishni va ko‘pincha tanlovdan o‘tishni talab qiladi, chunki yuqori darajadagi munozaralarni saqlab qolish uchun joylar soni cheklangan. Shaxsan qatnasha olmaydiganlar uchun laboratoriya o‘z axborot resurslari orqali materiallarga kirish imkonini beradi. Ushbu uchrashuvlarda muhokama qilinadigan yangi kashfiyotlarni mualliflar o‘z maqolalarini joylashtiradigan bioRxiv platformasi, shuningdek, bo‘lajak simpoziumlar va o‘tgan sessiyalar haqidagi hisobotlar e’lon qilinadigan laboratoriyaning rasmiy sayti orqali kuzatib borish mumkin.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/conferences/conf-cold_spring_harbor_meetings.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Cold_Spring_Harbor_Laboratory\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Cold Spring Harbor Laboratory — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Konferensiyalar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"встречи лаборатории Колд-Спринг-Харбор (она же ведёт bioRxiv)"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Cold Spring Harbor Meetings","description":"встречи лаборатории Колд-Спринг-Харбор (она же ведёт bioRxiv)","vcsPath":"reference/conferences/conf-cold_spring_harbor_meetings.md"},"headings":[{"title":"Konferensiya nima","href":"reference/conferences/conf-cold_spring_harbor_meetings.html#konferensiya-nima","level":2},{"title":"Tashkilotchilar va tarix","href":"reference/conferences/conf-cold_spring_harbor_meetings.html#tashkilotchilar-va-tarix","level":2},{"title":"Mavzular va seksiyalar","href":"reference/conferences/conf-cold_spring_harbor_meetings.html#mavzular-va-seksiyalar","level":2},{"title":"U yerda nimalar paydo bo‘ladi","href":"reference/conferences/conf-cold_spring_harbor_meetings.html#u-yerda-nimalar-paydo-boladi","level":2},{"title":"Qanday kuzatish va ishtirok etish","href":"reference/conferences/conf-cold_spring_harbor_meetings.html#qanday-kuzatish-va-ishtirok-etish","level":2},{"title":"Manbalar","href":"reference/conferences/conf-cold_spring_harbor_meetings.html#manbalar","level":2}],"title":"Cold Spring Harbor Meetings"},"router":{"pathname":"reference/conferences/conf-cold_spring_harbor_meetings","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
