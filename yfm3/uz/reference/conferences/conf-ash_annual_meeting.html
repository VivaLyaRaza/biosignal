        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Konferensiyalar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Американское общество гематологии&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-ash_annual_meeting.jpg\" alt=\"ASH Annual Meeting\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;Американское общество гематологии&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima olamiz&lt;/td&gt;\n&lt;td&gt;лейкозы, лимфомы, клеточная терапия&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-cancer.html\"&gt;Saraton va onkologiya&lt;/a&gt;, &lt;a href=\"concepts/spec-medicine.html\"&gt;Tibbiyot va salomatlik&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-konferensiya\"&gt;&lt;a href=\"reference/conferences/conf-ash_annual_meeting.html#bu-qanday-konferensiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday konferensiya&lt;/span&gt;&lt;/a&gt;Bu qanday konferensiya&lt;/h2&gt;\n&lt;p&gt;ASH Annual Meeting — Amerika Gematologiya Jamiyati (American Society of Hematology) tomonidan tashkil etiladigan yillik ilmiy konferensiya. Bu qon va u bilan bog'liq kasalliklarni o'rganishga bag'ishlangan dunyodagi eng yirik tadbirdir. Konferensiya olimlar, gematolog shifokorlar va biotexnologiya kompaniyalari vakillari o'rtasida ma'lumot almashish uchun asosiy maydon hisoblanadi. Bu yerda qon kasalliklarining rivojlanish mexanizmlari va yangi davolash usullarining klinik sinov natijalari muhokama qilinadi.&lt;/p&gt;\n&lt;h2 id=\"tashkilotchilar-va-tarix\"&gt;&lt;a href=\"reference/conferences/conf-ash_annual_meeting.html#tashkilotchilar-va-tarix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashkilotchilar va tarix&lt;/span&gt;&lt;/a&gt;Tashkilotchilar va tarix&lt;/h2&gt;\n&lt;p&gt;Tashkilotchi — Amerika Gematologiya Jamiyati bo'lib, u butun dunyodagi minglab mutaxassislarni birlashtirgan professional tashkilotdir. Jamiyat gematologiya sohasidagi tadqiqotlarni rivojlantirish, tibbiy yordam sifatini oshirish va ta'lim dasturlarini qo'llab-quvvatlashni o'z oldiga maqsad qilib qo'ygan. Konferensiya har yili o'tkaziladi va o'n minglab ishtirokchilarni to'playdi, bu esa uni jahon onkogematologiyasi taqvimida markaziy voqeaga aylantiradi.&lt;/p&gt;\n&lt;h2 id=\"mavzular-va-seksiyalar\"&gt;&lt;a href=\"reference/conferences/conf-ash_annual_meeting.html#mavzular-va-seksiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavzular va seksiyalar&lt;/span&gt;&lt;/a&gt;Mavzular va seksiyalar&lt;/h2&gt;\n&lt;p&gt;Ilmiy dastur molekulyar biologiyadan tortib klinik amaliyotgacha bo'lgan keng doirani qamrab oladi. Asosiy yo'nalishlar quyidagilarni o'z ichiga oladi:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Leykozlar, limfomalar va mielom kasalligi: qon hujayralarining xavfli o'zgarish mexanizmlarini o'rganish.&lt;/li&gt;\n&lt;li&gt;Hujayra terapiyasi: CAR-T texnologiyalarini rivojlantirish, bunda bemorning immun hujayralari saratonga qarshi kurashish uchun qayta dasturlanadi.&lt;/li&gt;\n&lt;li&gt;O'zak hujayralarni transplantatsiya qilish: mielodisplastik sindromlar (MDS) va boshqa klonal kasalliklarni davolash usullari.&lt;/li&gt;\n&lt;li&gt;Genetika va diagnostika: patologiyalarni erta aniqlash uchun molekulyar markerlardan foydalanish.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u-yerda-nimalar-paydo-boladi\"&gt;&lt;a href=\"reference/conferences/conf-ash_annual_meeting.html#u-yerda-nimalar-paydo-boladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;U yerda nimalar paydo bo'ladi&lt;/span&gt;&lt;/a&gt;U yerda nimalar paydo bo'ladi&lt;/h2&gt;\n&lt;p&gt;ASH Annual Meeting'da muhim klinik tadqiqotlarning natijalari birinchi marta taqdim etiladi. Aynan shu yerda ilmiy hamjamiyat yangi maqsadli preparatlarning samaradorligi, hujayra terapiyasi sinovlari (masalan, CD19-yo'naltirilgan CAR-T hujayralari) va transplantatsiyaning yangi protokollari haqida bilib oladi. Konferensiya jahon klinik amaliyotiga joriy etiladigan davolash standartlarini belgilaydi. Bu yerda o'simta mikro muhiti, jumladan, bakterial flora va immun hujayralar kasalliklar rivojlanishiga qanday ta'sir qilishi haqidagi yutuqlar muhokama qilinadi.&lt;/p&gt;\n&lt;h2 id=\"qanday-kuzatish-va-ishtirok-etish\"&gt;&lt;a href=\"reference/conferences/conf-ash_annual_meeting.html#qanday-kuzatish-va-ishtirok-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday kuzatish va ishtirok etish&lt;/span&gt;&lt;/a&gt;Qanday kuzatish va ishtirok etish&lt;/h2&gt;\n&lt;p&gt;Konferensiyada tibbiyot va biologiya sohasi mutaxassislari ishtirok etishlari mumkin. Keng jamoatchilik uchun Amerika Gematologiya Jamiyati rasmiy saytida press-relizlar va asosiy ma'ruzalar xulosalarini e'lon qiladi. Tadbir yakunlangach, qon saratoni kasalliklariga qarshi kurashish usullari va fundamental tadqiqotlar natijalari bo'yicha dolzarb ma'lumotlarni o'z ichiga olgan tezislar to'plamlari nashr etiladi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/conferences/conf-ash_annual_meeting.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9C%D0%B8%D0%B5%D0%BB%D0%BE%D0%B4%D0%B8%D1%81%D0%BF%D0%BB%D0%B0%D1%81%D1%82%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B8%D0%B9_%D1%81%D0%B8%D0%BD%D0%B4%D1%80%D0%BE%D0%BC\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Миелодиспластический синдром — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Hypogranular_neutrophil_with_a_pseudo-Pelger-Huet_nucleus_in_MDS.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: The Armed Forces Institute of Pathology (AFIP), Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1182/blood-2016-02-629063\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;CD19-targeted CAR T-cell therapeutics for hematologic malignancies: interpreting clinical outcomes to date&lt;/a&gt; — sharh, Blood 2016&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3389/fimmu.2022.927153\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;CAR-T Cell Therapy in Hematological Malignancies: Current Opportunities and Challenges&lt;/a&gt; — sharh, Front Immunol 2022&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1182/blood-2016-06-724500\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Allogeneic hematopoietic stem cell transplantation for MDS and CMML: recommendations from an international expert panel&lt;/a&gt; — sharh, Blood 2017&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Konferensiyalar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Американское общество гематологии"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"ASH Annual Meeting","description":"Американское общество гематологии","vcsPath":"reference/conferences/conf-ash_annual_meeting.md"},"headings":[{"title":"Bu qanday konferensiya","href":"reference/conferences/conf-ash_annual_meeting.html#bu-qanday-konferensiya","level":2},{"title":"Tashkilotchilar va tarix","href":"reference/conferences/conf-ash_annual_meeting.html#tashkilotchilar-va-tarix","level":2},{"title":"Mavzular va seksiyalar","href":"reference/conferences/conf-ash_annual_meeting.html#mavzular-va-seksiyalar","level":2},{"title":"U yerda nimalar paydo bo'ladi","href":"reference/conferences/conf-ash_annual_meeting.html#u-yerda-nimalar-paydo-
