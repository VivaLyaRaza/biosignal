3, 0.070], AF2 ipTM 0.867 [0.898, 0.852], ipSAE 0.675 [0.774, 0.615], ESMFold2 ipTM 0.858 [0.921, 0.814], actifpTM 0.943 [0.963, 0.923], Δ G = -13.00 [-17.80, -11.40], K_D = 3.1× 10⁻¹⁰ [9.0× 10⁻¹⁴, 4.6× 10⁻⁰⁹].&lt;/p&gt;\n&lt;p&gt;CbAgo nishoni uchun T-REX metodi (N=116) n=10/10 beradi: &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D%20%3D%200.382\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; [0.412, 0.332], AF2 ipTM 0.862 [0.888, 0.853], ipSAE 0.682 [0.726, 0.659], ESMFold2 ipTM 0.353 [0.636, 0.231], actifpTM 0.943 [0.952, 0.936], Δ G = -11.05 [-12.70, -10.70], K_D = 7.5× 10⁻⁰⁹ [4.7× 10⁻¹⁰, 1.5× 10⁻⁰⁸]. PUCT metodi (N=54) n=10/10 beradi: &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D%20%3D%200.306\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; [0.424, 0.287], AF2 ipTM 0.868 [0.872, 0.859], ipSAE 0.688 [0.711, 0.645], ESMFold2 ipTM 0.360 [0.714, 0.248], actifpTM 0.940 [0.951, 0.932], Δ G = -10.65 [-11.70, -10.40], K_D = 1.5× 10⁻⁰⁸ [2.7× 10⁻⁰⁹, 2.5× 10⁻⁰⁸]. ε-greedy varianti (N=9) &lt;span class=\"yfm-latex\" data-content=\"n%3D9%2F10%5E%7B%5Cdagger%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; beradi: &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D%20%3D%200.256\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; [0.498, 0.019], AF2 ipTM 0.847 [0.890, 0.746], ipSAE 0.633 [0.778, 0.437], ESMFold2 ipTM 0.107 [0.301, 0.072], actifpTM 0.919 [0.947, 0.842], Δ G = -9.70 [-11.90, -8.70], K_D = 7.1× 10⁻⁰⁸ [2.0× 10⁻⁰⁹, 4.2× 10⁻⁰⁷]. Complexa-only (N=2) &lt;span class=\"yfm-latex\" data-content=\"n%3D2%2F10%5E%7B%5Cdagger%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; beradi: &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D%20%3D%200.019\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; [0.030, 0.008], AF2 ipTM 0.760 [0.767, 0.754], ipSAE 0.490 [0.495, 0.486], ESMFold2 ipTM 0.201 [0.317, 0.086], actifpTM 0.902 [0.911, 0.893], Δ G = -9.10 [-9.40, -8.80], K_D = 2.4× 10⁻⁰⁷ [1.3× 10⁻⁰⁷, 3.5× 10⁻⁰⁷]. BindCraft-only uchun (N=52) n=10/10 mavjud: &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D%20%3D%200.298\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; [0.416, 0.250], AF2 ipTM 0.855 [0.890, 0.840], ipSAE 0.654 [0.750, 0.615], ESMFold2 ipTM 0.242 [0.722, 0.206], actifpTM 0.941 [0.961, 0.925], Δ G = -10.90 [-12.80, -10.60], K_D = 9.7× 10⁻⁰⁹ [4.0× 10⁻¹⁰, 1.8× 10⁻⁰⁸]. BoltzGen-only uchun (N=37) n=10/10 olindi: &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D%20%3D%200.307\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; [0.415, 0.280], AF2 ipTM 0.841 [0.854, 0.832], ipSAE 0.645 [0.695, 0.604], ESMFold2 ipTM 0.140 [0.441, 0.118], actifpTM 0.927 [0.952, 0.914], Δ G = -13.60 [-16.10, -13.30], K_D = 9.9× 10⁻¹¹ [1.5× 10⁻¹², 1.9× 10⁻¹⁰].&lt;/p&gt;\n&lt;h4 id=\"statistik-tahlil-va-natijalarni-baholash\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#statistik-tahlil-va-natijalarni-baholash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Statistik tahlil va natijalarni baholash&lt;/span&gt;&lt;/a&gt;Statistik tahlil va natijalarni baholash&lt;/h4&gt;\n&lt;p&gt;Har xil oqsillarni modellashtirish va generatsiya qilish algoritmlari, jumladan T-REX, PUCT, ε-greedy, Complexa-only, BindCraft-only va BoltzGen-only usullarining samaradorligini baholash maqsadida HER2-AAV, SC2RBD, PDL1 va IL7RA kabi turli nishonlar bo'yicha qiyosiy sinovlar o'tkazildi. Sinov jarayonida HER2-AAV nishoni uchun HER2-AAVT-REX varianti 10/10 muvaffaqiyat ko'rsatkichini, -15.95 o'rtacha qiymatini (-17.10 dan -15.20 gacha bo'lgan oraliqda) va 2.2e-12 ([2.9e-13, 7.5e-12]) p-qiymatini namoyish etdi. HER2-AAVPUCT usuli 10/10 natijani, o'rtacha -13.55 [-15.00, -12.70] va 1.2e-10 ([9.4e-12, 4.8e-10]) p-qiymatini ko'rsatdi. HER2-AAV ε-greedy yondashuvi esa 10/10 ko'rsatkichga, o'rtacha -12.60 [-15.60, -12.00] va 5.6e-10 ([3.5e-12, 1.6e-09]) p-qiymatiga ega bo'ldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;p-qiymat (p-value) ushbu kontekstda farqlarning statistik ahamiyatliligini yoki model bashoratlarining ishonchliligini bildiradi, kichikroq qiymatlar natijalarning yuqori aniqligini ko'rsatadi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Shuningdek, HER2-AAV uchun Complexa-only usuli (4210/10 qiymatida) -13.75 [-15.70, -13.10] o'rtacha va 9.4e-11 ([2.9e-12, 2.4e-10]) p-qiymatini berdi, BindCraft-only (10410/10) metodida esa -14.50 [-15.40, -13.70] va p-qiymat 2.3e-11 ([5.3e-12, 8.7e-11]) tashkil etdi, BoltzGen-only (2/10†) esa -10.30 [-11.40, -9.20] va 8.7e-08 ([4.7e-09, 1.7e-07]) natijani ko'rsatdi. SC2RBD nishoni uchun natijalar quyidagicha taqsimlandi: T-REX (5510/10) — -12.30 [-13.60, -11.90], 9.1e-10 ([1.1e-10, 1.7e-09]); PUCT (4010/10) — -12.85 [-16.20, -12.20], 4.0e-10 ([1.3e-12, 1.1e-09]); ε-greedy (2010/10) — -12.25 [-13.60, -11.00], 1.1e-09 ([1.1e-10, 9.3e-09]); Complexa-only (0/10†) muvaffaqiyatli ma'lumot bermadi; BindCraft-only (2210/10) — -12.25 [-13.90, -11.60], 1.1e-09 ([6.6e-11, 3.3e-09]); BoltzGen-only (6/10†) — -12.30 [-13.80, -10.60], 1.0e-09 ([7.2e-11, 1.7e-08]).&lt;/p&gt;\n&lt;p&gt;PDL1 nishoni bo'yicha quyidagi ko'rsatkichlar olindi: T-REX (10/10) — -13.15 [-14.40, -12.70], 2.4e-10 ([2.7e-11, 5.1e-10]); PUCT (23310/10) — -11.65 [-12.70, -11.20], 2.8e-09 ([4.5e-10, 5.8e-09]); ε-greedy (6510/10) — -11.50 [-12.70, -10.70], 3.7e-09 ([4.8e-10, 1.5e-08]); Complexa-only28110/10 — -12.00 [-12.90, -11.70], 1.5e-09 ([3.6e-10, 2.5e-09]); BindCraft-only (23110/10) — -11.80 [-12.40, -11.40], 2.2e-09 ([8.1e-10, 4.1e-09]); BoltzGen-only (10/10) — -12.35 [-14.50, -11.10], 9.0e-10 ([2.3e-11, 7.6e-09]). Va nihoyat, IL7RA uchun quyidagi parametrlar qayd etildi: T-REX (10/10) — -11.45 [-12.70, -11.30], 4.0e-09 ([4.5e-10, 5.1e-09]); PUCT (9510/10) — -11.15 [-13.50, -10.80], 7.1e-09 ([1.2e-10, 1.2e-08]); ε-greedy (4010/10) — -10.85 [-12.60, -9.70], 1.1e-08 ([5.9e-10, 7.8e-08]); Complexa-only16710/10 — -11.25 [-12.70, -11.00], 5.5e-09 ([4.7e-10, 9.2e-09]); BindCraft-only (17810/10) — -11.45 [-12.60, -10.90], 4.2e-09 ([5.8e-10, 1.0e-08]); BoltzGen-only (10/10) — -11.55 [-13.30, -10.90], 3.3e-09 ([1.8e-10, 1.0e-08]).&lt;/p&gt;\n&lt;h4 id=\"d43-secondary-structure-and-binding-position-diversity\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d43-secondary-structure-and-binding-position-diversity\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.4.3. Secondary structure and binding-position diversity&lt;/span&gt;&lt;/a&gt;D.4.3. Secondary structure and binding-position diversity&lt;/h4&gt;\n&lt;p&gt;Ikkinchi darajali struktura va misollarni tahlil qilish uchun Rasm 5a,b da mualliflar MDTraj 1.11.0 dasturi yordamida 1,461 ta yakuniy T-REX TM0.6 vakillarini o'rganib chiqdilar (compute_dssp funksiyasi, simplified=True). DSSP holatlari H, G va I spirallar deb, E va B esa beta-tolqalar deb tasniflandi, bunda barcha qoldiqlar mahraj sifatida olindi. Spiralli yoki tolqali misollar mos ravishda o'z ulushini maksimal darajaga yetkazdi. Usullar orasida beta-strukturalarga boy chiqishlarni taqqoslash uchun Foldseek TM0.6 klasterlashidan oldin har bir usul-nishon doirasida kamida 20% tola tutgan barcha loyihalar tanlab olindi. T-REX usuli 308 ta klaster (har bir ishchi GPU-soatiga 0.306 tadan) hosil qilib, ikkinchi o'rinni egallagan BoltzGen-only (95 ta klaster, 0.94 GPU-soatiga) ko'rsatkichidan sezilarli darajada ustun keldi (S23-jadval).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-f5.jpg\" alt=\"5-rasm / T-REX turli xil tuzilmalar va bashorat qilingan bogʻlanish pozitsiyalariga ega bogʻlovchilarni ishlab chiqaradi\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm / T-REX turli xil tuzilmalar va bashorat qilingan bogʻlanish pozitsiyalariga ega bogʻlovchilarni ishlab chiqaradi. a. 𝛼-spiralga boy IL7RA bogʻlovchisi, aralash 𝛼-spiral/𝛽-tarmoqli CbAgo bogʻlovchisi va 𝛽-qatlamga boy PDL1 bogʻlovchisini koʻrsatuvchi…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-rasm / T-REX turli xil tuzilmalar va bashorat qilingan bogʻlanish pozitsiyalariga ega bogʻlovchilarni ishlab chiqaradi. a. 𝛼-spiralga boy IL7RA bogʻlovchisi, aralash 𝛼-spiral/𝛽-tarmoqli CbAgo bogʻlovchisi va 𝛽-qatlamga boy PDL1 bogʻlovchisini koʻrsatuvchi vakillik bashorat qilingan komplekslar. b. DSSP yordamida hisoblangan T-REX xitlarining ikkilamchi struktura ulushlari (𝑛= 1461). Raqamlangan nuqtalar a dagi misollarga mos keladi. c. CbAgodagi turli bashorat qilingan bogʻlanish pozitsiyalaridagi vakillik T-REX xitlari. d. T-REX (𝑛= 116) va PUCT (𝑛= 54) xitlari uchun nishonga nisbatan bogʻlovchi pozitsiyalarining asosiy komponentlar tahlili (PCA).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DSSP va Foldseek klasterlash usullari oqsillarning ikkilamchi tuzilmalarini aniqlash va o'xshash uch o'lchamli modellarni guruhlarga ajratish uchun qo'llaniladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Nishon va bog'lanuvchi oqsil orasidagi kontaktlar o'zgaruvchanligini baholash uchun 6  Å masofadagi og'ir atomlar juftligi hisobga olindi. Kontakt belgilari nishondagi o'rnini va aminokislota sinfini birlashtirdi: gidrofobik (A/V/L/I/M/C), aromatik (F/Y/W), qutbli (S/T/N/Q/H), musbat zaryadlangan (K/R), manfiy zaryadlangan (D/E), glitsin (G), prolin (P) va boshqalar. Farqlanish darajasi &lt;span class=\"yfm-latex\" data-content=\"1%20-%20%2FF_i%20%5Ccap%20F_j%2F%20%2F%20%2FF_i%20%5Ccup%20F_j\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; formulasi bo'yicha 0 dan 1 gacha hisoblandi. Rasm 5c uchun CbAgo komplekslari umumiy nishonga C_α-atomlari bo'yicha moslashtirildi. Asosiy komponentlar tahlili (PCA) 116 ta CbAgo T-REX va 54 ta PUCT TM0.6 vakillari uchun qo'llanildi. Yuqori baholangan variantlar orasidagi pozitsion xilma-xillikni ko'rsatish uchun pLDDT, iPAE va scRMSD baholari asosida P1–P3 tuzilmalari tanlab olindi, bunda P1 eng yuqori natijani ko'rsatdi (n = 58), P2 va P3 эsa fazoviy masofa va kontaktlarning farqlanishini hisobga olgan holda tanlandi.&lt;/p&gt;\n&lt;p&gt;Tan hajmiga moslashtirilgan taqqoslashlar. Barcha nishonlar bo'yicha taqqoslash uchun biz umumiy tan hajmida kontakt naqshlarini qiyosladik va PDB qoldiq raqamlari siljishlarini yo'q qilish uchun global ketma-ketlikni moslashtirish yordamida nishon pozitsiyalarini moslashtirdik. Har bir nishon uchun ma'lumotnoma sifatida T-REX va PUCT da kuzatilgan eng uzun ketma-ketlik olindi, teng uzunlikda bo'lganda eng ko'p uchraydigani af长的 ko'rildi. Moslashtirish ballari har bir mos kelish uchun +2, mos kelmaslik uchun -1 va probel uchun -2 qilib belgilandi; ballar teng kelganda diagonal qadamga, so'ngra so'rovdagi probelga, oxirida esa ma'lumotnomadagi probelga ustunlik berildi. Faqat bir xil moslashtirilgan qoldiqlar pozitsiya moslashuvini ta'minladi. Bu mosliklar har bir ketma-ketlikning kamida 70% qismini qamrab olishi va probelsiz moslashtirilgan juftlarning kamida 90% ni tashkil etishi kerak edi. Moslashtirilgan nishon pozitsiyasiga ega bo'lmagan kontaktlar chiqarib tashlandi; saqlab qolingan har bir dizayn bo'sh bo'lmagan xususiyatlar to'plamiga ega edi. CbAgo pozitsiyalarini qayta tanlab taqqoslash ham ushbu ketma-ketlik moslashuvidan foydalandi va barcha moslashtirilgan nishon Cα atomlari bo'yicha Kabsh moslashuvi qo'llanildi. 5c-rasmda buning o'rniga yuqorida aniqlangan takrorlanuvchi kontakt qoldiqlari qo'llaniladi. Har bir nishon va usul uchun biz qaytarishsiz TM0.6 bo'yicha 30 ta yakuniy vakilni tanlab oldik va tanlashni 1,000 marta takrorladik (tasodifiy urug' 20260831); barcha hovuzlar kamida 30 ta vakilni o'z ichiga olgan. Har bir tanlov juftlikdagi kontakt naqshlari farqining medianasini yoki CbAgo pozitsiyalari uchun bog'lovchi markazlari orasidagi uch o'lchovli Evklid masofasining medianasini berdi. Biz ushbu qayta tanlangan medianalarning o'rtacha qiymatini va 5- va 95-persentillarini keltiramiz. Intervallar kuzatilgan hovuzlarning quyi to'plamlari orasidagi o'zgarishlarni tavsiflaydi, mustaqil kampaniyalar bo'yicha ishonch intervallarini emas. CbAgo uchun o'rtacha qayta tanlangan median masofa T-REX uchun 31.2 Å [25.2–36.6] va PUCT uchun 9.97 Å [9.08–11.00] ni tashkil etdi. Kontakt naqshlarining farqi ettita nishondan to'rttasida T-REX uchun yuqori bo'ldi (S24-jadval). Ushbu taqqoslashlar CbAgo uchun bashorat qilingan bog'lovchi pozitsiyalarining kengroq ekanligini tasdiqlaydi, shu bilan birga kontakt naqshlarini taqqoslash barcha nishonlar bo'yicha biron bir usulga bir xil darajada ustunlik bermadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kabsh moslashuvi — bu ikki atomlar to'plamining fazoviy joylashuvini o'rtacha kvadratik og'ishni minimallashtirish uchun bir-birining ustiga qo'yish usuli, Evklid masofasi esa oqsillar markazlari orasidagi to'g'ri chiziqli masofani bildiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"d5-qoshimcha-nishonlar-boyicha-qidiruv-kampaniyalari\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d5-qoshimcha-nishonlar-boyicha-qidiruv-kampaniyalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.5. Qo'shimcha nishonlar bo'yicha qidiruv kampaniyalari&lt;/span&gt;&lt;/a&gt;D.5. Qo'shimcha nishonlar bo'yicha qidiruv kampaniyalari&lt;/h4&gt;\n&lt;p&gt;Biz T-REX va PUCT usullarini asosiy ettita nishondan iborat etalon doirasidan tashqarida TNF-α va TrkA uchun taqqosladik (nishon kirish ma'lumotlari A.2-bo'limda). Har bir nishon doirasida ikkala usul bir xil nishon spetsifikatsiyasidan, sakkizta harakat oilasidan, in silico malaka mezonlaridan va Foldseek TM0.6 klasterizatsiyasidan foydalandi. 100 ishchi GPU-soat chegarasida taqqoslash uchun biz 144 ishchi GPU-soatga mo'ljallangan T-REX kampaniyalaridan ushbu chegaradagi yoki undan pastdagi oxirgi arxivlangan EvidenceSummary hisobotidan foydalandik. PUCT alohida ravishda 100 ishchi GPU-soat byudjeti bilan ishga tushirildi va biz uning yakuniy arxivlangan xulosasidan foydalandik. S25-jadvalda har bir usul va nishon uchun bittadan kampaniya keltirilgan. Malakali dizaynlar va onlayn SU sonlari keyingi qayta klasterizatsiyasiz to'g'ridan-to'g'ri tanlangan xulosalardan olindi. TNF-α bo'yicha T-REX ikkita onlayn TM0.6 klasterida ikkita malakali dizaynni qayd etdi; PUCT esa malakali dizaynlarni qayd etmadi. TrkA bo'yicha PUCT T-REX ga qaraganda ko'proq malakali dizaynlarni ishlab chiqdi (3,714 ga nisbatan 2,369), ammo T-REX ko'proq onlayn TM0.6 SU (451 ga nisbatan 414) va yuqori SU o'tkazish qobiliyatini qayd etdi. Ushbu qidiruv natijalari birlashtirilgan asosiy etalon natijalaridan chiqarib tashlandi. S25-jadvalda ikkita qo'shimcha nishon bo'yicha qidiruv kampaniyalari keltirilgan. Har bir qator bitta kampaniyani tavsiflaydi. T-REX qiymatlari ishchi GPU-soat byudjetiga ega kampaniyalarda 100 ishchi GPU-soatga teng yoki undan past bo'lgan oxirgi arxivlangan EvidenceSummary hisobotidan olingan; PUCT qiymatlari 100 ishchi GPU-soat byudjetiga ega kampaniyalarning yakuniy xulosalaridir. Malakali dizaynlar B.1-bo'limdagi uchta in silico mezonidan o'tgan; onlayn TM0.6 SU sonlari qayd etilgan Foldseek klasterlari sonidir. Ishchi GPU-soat T-REX uchun uchta ishchi yoki PUCT uchun to'rtta ishchi bilan ko'paytirilgan sarflangan kampaniya vaqti sifatida hisoblanadi, til modeliga xizmat ko'rsatuvchi T-REX GPU bundan mustasno. O'tkazish qobiliyati onlayn SU ni yaxlitlanmagan qayta ishlangan ishchi vaqtiga bo'lish yo'li bilan aniqlanadi. Ushbu kampaniyalar asosiy etalondan chiqarib tashlandi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS1.jpg\" alt=\"Rasm S1 / Kampaniya arxivi va EvidenceSummary qurilishi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1 / Kampaniya arxivi va EvidenceSummary qurilishi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Rasm S1 / Kampaniya arxivi va EvidenceSummary qurilishi. a, Birlamchi kampaniyalarda saqlanadigan to‘qqizta faqat qo‘shiladigan yozuv oqimlari rol bo‘yicha guruhlangan (C.3-bo‘lim). ResultRecord o‘lchovlar, ota-ona havolalari, ishchi xarajatlari, holat va chiqish yo‘llarini saqlaydi. Xom jurnallar va fayllar bajarilish katalogida qoladi; LLMCallRecord to‘liq prompt matni o‘rniga prompt heshi va ixcham auditni saqlaydi. b, Deterministik qoidalar arxivlangan yozuvlarni joriy vazylar va resurslar haqidagi ma'lumotlar bilan birlashtirib, to‘liq arxivlangan EvidenceSummary'ni hosil qiladi (strelka). 3 va 6 ishchi-GPU-soat oynalari kampaniya bo‘ylab yozib olingan ishchi xarajatlaridan foydalanadi. S2-rasm LLM'larga beriladigan kichikroq kirish ma'lumotlarini ko‘rsatadi. Yakuniy malaka va SU sonlari yakuniy nuqtani kiritish qoidalari qo‘llanilgandan so‘ng alohida qayta hisoblanadi (B.3-bo‘lim). Kulrang rang natijalar, tanlovlar va qisqartirish kirishlarini; yashil rang dalil/qaror yozuvlari va xulosa tarkibini; ko‘k rang ishga tushirish/bajarish yozuvlarini bildiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS2.jpg\" alt=\"Rasm S2 / LLM kirishlari hamda rejalashtirish va bajarish tartibi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S2 / LLM kirishlari hamda rejalashtirish va bajarish tartibi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Rasm S2 / LLM kirishlari hamda rejalashtirish va bajarish tartibi. a, Kampaniya holatini o‘z ichiga olgan qisqartirilgan EvidenceSummary ikkala LLM tomonidan taqsimlanadi (chegaralar: C.5.2-bo‘lim; yo‘nalish va to‘plam ta'riflari: C.2.2 va C.4.1-bo‘limlar). Rejalashtiruvchi qo‘shimcha ravishda sakkiztagacha faol yoki so‘nggi HypothesisCards, mavjud harakat oilalari, ruxsat etilgan sozlamalar va ish yuki cheklovlarini oladi; Supervayzer joriy HypothesisCards, yaroqli nomzod vazifalar va tanlov kontekstini oladi. Aniq nishon identifikatori va nishon sinfi kalitlari dalil ko‘rinishidan olib tashlanadi. b, Binafsharang LLM takliflari va ustuvorligini, jigarrang deterministik nomzod tuzilishi va tanlovini, ko‘k ishchi bajarilishini bildiradi. Har bir EvidenceSummary shartli LLM chaqiruvlaridan oldin arxivlanadi (S1-algoritm). Navbatdagi vazifalar ertaroq boshlanishi mumkin; navbatga kirish darhol boshlanishini kafolatlamaydi. Keyingi xulosalar qarorlar, tasdiqlangan boshlanishlar va yangi yozib olingan natijalarni o‘z ichiga oladi. Vazifa boshlanishidan oldin faqat o‘qish uchun mo‘ljallangan dalillar yangilanishlari EvidenceSummary qo‘shmaydi va biron bir LLM'ni chaqirmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS6.jpg\" alt=\"S6-rasm. Post-hoc baholash chegaralari bo'yicha saqlab qolingan fiksiklangan klaster vakillari. quyidagi chegaralardan o\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S6-rasm. Post-hoc baholash chegaralari bo'yicha saqlab qolingan fiksiklangan klaster vakillari. quyidagi chegaralardan o'tgan yakuniy Foldseek TM0.6 klasterlarining fiksiklangan vakillari soni: a, moslashtirilgan AF2 ipTM va actifpTM&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;S6-rasm. Post-hoc baholash chegaralari bo'yicha saqlab qolingan fiksiklangan klaster vakillari. quyidagi chegaralardan o'tgan yakuniy Foldseek TM0.6 klasterlarining fiksiklangan vakillari soni: a, moslashtirilgan AF2 ipTM va actifpTM; b, PRODIGY tomonidan bashorat qilingan Δ𝐺 (kkal mol−1) va hosil qilingan 𝐾D (nM); c, ESMFold2 kompleks o'rtacha pLDDT va paketda ko'rsatilgan umumiy ipTM; va d, Boltz-2 oqsil ipTM va bog'lovchi pLDDT. ESMFold2 va Boltz-2 pLDDT chegaralari taqdim etilgan 0–1 шкала (shkaladan) foydalanadi. Miqdorlar yettita nishon bo'yicha birlashtirilgan. Har bir chegara bir xil vakillar to'plamiga alohida qo'llanildi. To'rtta panel ham bitta miqdor shkalasini bo'lishadi; qalin qiymatlar har bir chegaradagi eng katta miqdorni belgilaydi. Complexa, BindCraft va BoltzGen faqat generator bazaviy chiziqlarini bildiradi. Ushbu post-hoc diagnostikasi taqsimlash, malaka oshirish yoki SU hisoblashga ta'sir qilmadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS7.jpg\" alt=\"Rasm S7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S7&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS8.jpg\" alt=\"Rasm S8\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S8&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" v
