            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"173\" cy=\"159\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"607\" cy=\"209\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · ECOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Oqsillarni loyihalashni&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;tezlashtiruvchi sun'iy&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;intellekt tizimi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-f1.jpg\" alt=\"1-rasm / T-REXʼning umumiy koʻrinishi. a.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm / T-REXʼning umumiy koʻrinishi. a.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm / T-REXʼning umumiy koʻrinishi. a. &lt;a href=\"concepts/target-adaptive-rescue-explore-exploit.html\"&gt;T-REX&lt;/a&gt; — bu belgilangan hisoblash byudjeti doirasida de novo oqsil bogʻlovchilarini loyihalash uchun hisoblash vositalarini moslashuvchan tarzda boshqaradigan agentlik tizimi. b, c. Loyihalash natijalari keyingi harakatlar uchun alohida ustuvorliklarni keltirib chiqaradigan nosozlik rejimlariga boʻlinadi: Istiqbolli loyihalarni qutqarish (Rescue), muqobil usullar yoki sozlamlarni oʻrganish (Explore) yoki samarali yoʻllardan foydalanish (eXploit). d. Yakunlangan va davom etayotgan loyihalash ishlari boʻyicha dalillar kompaniya holatining rivojlanib borayotgan tuzilgan koʻrinishiga jamlanadi va ikkita &lt;a href=\"concepts/llm.html\"&gt;LLM&lt;/a&gt; agenti tomonidan talqin qilinadi. Rejalashtiruvchi dalillarga asoslangan gipotezalar va keyingi harakatlarni taklif qiladi, Supervayzer эса tasdiqlangan harakatlarni ustuvorlashtiradi hamda ularning Rescue, Explore va eXploit oʻrtasida taqsimlanishini taklif etadi. Deterministik boshqaruvchi mavjud hisoblash resurslarini hisobga olgan holda vazifalarni bajarishni muvofiqlashtiradi. e. Taklif etilgan harakatlar mavjud GPUʼlarda asinxron tarzda bajariladi, yakunlangan natijalar esa keyingi rejalashtirish va taqsimlash uchun yangi dalillarni taqdim etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Ma'lum xususiyatlarga ega oqsillarni yaratish katta hisoblash quvvatini talab qiladi. Tadqiqotchilar turli generativ algoritmlar ishini muvofiqlashtirish uchun T-REX tizimini taklif qilishdi. Bu yondashuv cheklangan vaqt va resurslar sharoitida ko'proq noyob tuzilmalarni topish imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;T-REX tizimi oqsil modellarining ishini muvofiqlashtiradi.&lt;/li&gt;\n&lt;li&gt;Til modellari xatolarni tahlil qilib, hisoblash vazifalarini taqsimlaydi.&lt;/li&gt;\n&lt;li&gt;Noyob oqsil tuzilmalarini topish samaradorligi bir necha barobar oshdi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Zamonaviy sun'iy intellekt usullari oqsil molekulalarini yaratish uchun ko'plab ixtisoslashgan vositalarni taqdim etadi. Biroq, bu vositalarni samarali birlashtirish qiyin vazifa bo'lib qolmoqda. Yangi T-REX tizimi loyihalash jarayonini agentlar yordamida boshqarish orqali bu muammoni hal qiladi va vazifalarni istiqbolli nomzodlarni saqlab qolish hamda muvaffaqiyatli yo'llarni kengaytirishga ajratadi.&lt;/p&gt;\n&lt;p&gt;Tizim asosida joriy natijalarni tahlil qiluvchi va keyingi qadamlarni taklif qiluvchi til modellari yotadi. Deterministik boshqaruvchi bu takliflarni tekshiradi va vazifalarni taqsimlaydi. Yettita turli nishon bo'yicha sinovdan o'tkazilganda, tizim an'anaviy usullarga qaraganda yuqori samaradorlik ko'rsatdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar laboratoriyada jismoniy sintez va eksperimental tekshiruvsiz faqat kompyuter modellashtirilishiga asoslangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Sun'iy intellektning rivojlanishi noldan oqsillarni loyihalash uchun tez o'sib borayotgan usullar ekotizimini yaratdi. Biroq tadqiqotchilar ko'pincha cheklangan hisoblash resurslari sharoitida ko'plab ixtisoslashgan vositalardan qanday qilib samarali foydalanish kerak degan savolga duch kelishadi.&lt;/p&gt;\n&lt;p&gt;Ushbu muammoni hal qilish uchun mualliflar oqsil bog'lovchilarini yaratish uchun Target-adaptive Rescue–Explore–eXploit (T-REX) agentlik asosini taklif qilishadi. Ushbu tizim eng so'nggi oqsil generativ modellari va struktura baholovchilarini muvofiqlashtiradi. Loyihalashtirish jarayonida katta til modellari (LLM) asosidagi agentlar to'plangan natijalarni tahlil qilib, istiqbolli nomzidlarni qutqarish, muqobil sozlamalarni o'rganish yoki samarali yo'nalishlarni qo'llash bo'yicha qaror qabul qiladilar, deterministik boshqaruvchi esa taklif etilgan harakatlarni tekshiradi va rejalashtiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Agentlik tizimi va LLM — bu sun'iy intellektga asoslangan dasturlar o'z-o'zidan qaror qabul qiladigan, oraliq natijalarni tahlil qiladigan va tajribaning keyingi qadamlarini rejalashtiradigan yondashuv.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Yetttita turli nishonlar bo'yicha o'tkazilgan sinovlar T-REX hisoblash quvvatlarini nishon xususiyatlariga qarab moslashuvchan tarzda taqsimlashini ko'rsatdi. Tizim barcha bazaviy usullar bilan solishtirganda strukturaviy jihatdan o'ziga xos muvaffaqiyatli oqsil bog'lovchilarini yaratish bo'yicha eng yuqori samaradorlikni ko'rsatdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;T-REX tizimi hisoblash resurslarini samarali taqsimlaydi va yettita nishon bo'yicha noyob strukturali muvaffaqiyatli variantlar soni bo'yicha standart yondashuvlardan ustun keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Olingan natijalar moslashuvchan boshqaruv zamonaviy oqsil loyihalash modellarini samarali to'ldirishi mumkinligini isbotlaydi. Mualliflar oqsil bog'lovchilarini yaratishda hisoblash xarajatlarini optimallashtirish uchun T-REX tizimini ochiq manbali qilib taqdim etadilar.&lt;/p&gt;\n&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;De novo oqsillarni loyihalash ma'lum tuzilmalar va molekulyar funksiyalarga ega bo'lgan yangi oqsillarni yaratishda kuchli yo'nalishga aylanib bormoqda, bu esa terapiya, kataliz va molekulyar muhandislikda keng imkoniyatlar ochadi. Sun'iy intellekt sohasidagi so'nggi yutuqlar oqsillarni loyihalash jarayonini tubdan o'zgartiruvchi hisoblash vositalarini, jumladan, asosiy tuzilmalarning generativ modellarini, ketma-ketlikni loyihalash uchun teskari foldingni hamda tuzilmani bashorat qilish va baholash modellarini taqdim etdi. Tuzilma va ketma-ketlikning qo'shma generativ modellari, shuningdek, &lt;a href=\"concepts/bindcraft.html\"&gt;BindCraft&lt;/a&gt; kabi integratsiyalashgan quvurlar zamonaviy de novo oqsil bog'lovchilarini loyihalash uchun qo'shimcha yo'llarni ochadi. Mavjud vositalar soni ortib borar ekan, yangi savol tug'iladi: qaysi usullardan qanday sozlamalar bilan foydalanish kerak va cheklangan hisoblash resurslarini qanday taqsimlash lozim?&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Oqsil loyihalash kampaniyasi — bu ma'lum bir nishon uchun amalga oshiriladigan hisob-kitoblar, qayta loyihalash va baholash bosqichlarining ketma-ketligidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Maxsus vositalar unumdorligi va hisoblash narxi bo'yicha turlicha bo'lishi mumkin. Loyihalashtirilgan nomzodlar in silico mezonlariga mos kelmasligi, mavjud tuzilmalarni takrorlashi yoki xatoliklarga olib kelishi mumkin, garchi muvaffaqiyatsiz variantlar keyingi tuzilish uchun foydali boshlang'ich nuqta bo'la olsa ham. Mavjud usullarni samarali boshqarish istiqbolli dizaynlarni takomillashtirish yoki muqobil yo'llarni sinab ko'rish bo'yicha qaror qabul qilishni talab qiladi. Ilmiy agentlar sohasidagi so'nggi yutuqlar katta til modellarining (LLM) kontekstli fikrlash qobiliyatidan foydalanish imkoniyatini ko'rsatmoqda.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Katta til modellari va resurs talab qiluvchi simulyatsiyalardan foydalanish katta miqdordagi hisoblash quvvati va token byudjetini talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Oqsillarni yaratish va tuzilmani baholash hisoblash jihatidan og'ir jarayon bo'lib qolmoqda, holbuki LLM tahlili nisbatan tez bajariladi va qimmatbaho hisob-kitoblarni yo'naltirishga yordam beradi. Parallel vazifalar turli vaqtlarda yakunlanib, yangi ma'lumotlarni taqdim etadi, bu esa kelayotgan ma'lumotlarni doimiy ravishda sharhlab turuvchi kampaniya boshqaruvchisini talab qiladi. Biz Target-adaptive Rescue–Explore–eXploit (T-REX) tizimini taqdim etamiz — bu yuqori unumdorlikka ega de novo oqsil bog'lovchilarini loyihalash uchun agentli kampaniya boshqaruvchisidir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;T-REX tizimi de novo dizaynining yettita nishoni bo'yicha o'rtacha geometrik ko'rsatkichda daraxt qidiruvi boshqaruvchisidan 2.43 barobar va eng kuchli generativ bazaviy modellardan 2.48 barobar ustun keldi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;T-REX tizimida LLM agentlari to'planib borayotgan ma'lumotlarni talqin qilib, ishlarni uchta strategiya bo'yicha ustuvorlashtiradi: Rescue (istiqbolli dizayndagi kamchiliklarni bartaraf etish), Explore (kam foydalaniladigan usullarni sinash) va eXploit (mahsulot beruvchi yo'nalishlarga qo'shimcha resurs ajratish). Deterministik ijro etish qatlami taklif qilingan vazifalarni tasdiqlaydi va resurs cheklovlarini boshqaradi. Yettita nishon bo'yicha T-REX eng yuqori strukturaviy noyob hitlar unumdorligiga erishdi va moslashtirilgan hisoblash byudjetlari sharoitida boshqa yondashuvlarni ortda qoldirdi.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"21-t-rex-kampaniya-boshqaruvchisi-haqida-umumiy-malumot\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#21-t-rex-kampaniya-boshqaruvchisi-haqida-umumiy-malumot\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.1. T-REX kampaniya boshqaruvchisi haqida umumiy ma'lumot&lt;/span&gt;&lt;/a&gt;2.1. T-REX kampaniya boshqaruvchisi haqida umumiy ma'lumot&lt;/h4&gt;\n&lt;p&gt;在于 T-REX belgilangan hisoblash byudjeti doirasida strukturaviy jihatdan o'ziga xos \"xitlarni\" maksimal darajada oshirish uchun turli xil hisoblash oqsili bog'lovchilarini loyihalash vositalarini moslashuvchan tarzda boshqarish uchun mo'ljallangan (1-rasm). Vositalar to'plamiga oltita генерация vositasi — Proteína-Complexa'ning to'rtta varianti (nur qidiruvi, best-of-n, Feynman-Kac boshqaruvi va Monte-Karlo daraxtini qidirish — MCTS), BindCraft va BoltzGen — shuningdek, ketma-ketlikni qayta loyihalash uchun ProteinMPNN va strukturaning sifatini baholash uchun AlphaFold2 (AF2) orqali qayta folding kiritilgan (1a-rasm).&lt;/p&gt;\n&lt;p&gt;De novo bog'lovchilarni loyihalash kampaniyasi hisoblash ishlari bo'yicha onlayn taqsimlash muammosi sifatida shakllantiriladi, bunda har bir ish muayyan vosita, giperparametr konfiguratsiyasi va ota-ona dizaynini o'z ichiga oladi (S5-jadval). Loyihalashtirilgan oqsillar in silico mezonlariga javob berishi kerak (pLDDT, iPAE, scRMSD chegaralari), va to'planib borayotgan dizaynlar havzasi Foldseek yordamida strukturaviy ravishda klasterlanadi (4.2-bo'lim Metodlari). Kampaniya davomida xitlar hosil bo'lishi sekinlashishi yoki to'xtab qolishi mumkin, ammo oddiy xitlar sonini hisoblash muammo qayerda ekanligini ko'rsatmaydi. T-REX tizimida to'rtta operatsion nosozlik rejimi ajratiladi (1b-rasm): генерация foydali natija bermasligi, baholash kechikishi, nomzod mezonlarga ozgina yetmay qolishi yoki malakali dizayn topilgan strukturaning takrorlanishi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;T-REX boshqaruvchisi oltita генерация vositasini muvofiqlashtiradi va oqsil bog'lovchilarini loyihalashdagi to'rtta nosozlik turini yengish uchun til modellariga asoslangan agentlardan foydalanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu javob choralarini tashkil qilish uchun T-REX uchta ustuvor yo'nalishni belgilaydi: Rescue (qutqarish), Explore (o'rganish) va eXploit (foydalanish) (1c-rasm). Faqat xitlar soniga tayanmasdan, yakunlangan natijalar va resurslarni birlashtiruvchi EvidenceSummary xulosasidan foydalaniladi (1d-rasm; 4.3-bo'lim Metodlari; C.4-bo'lim va S1-rasm). Unga asoslanib, kampaniyaning yettita holatidan biri tayinlanadi. Kontekstni talqin qilish uchun LLM agentlari qo'llaniladi. Planner LLM gipotezalarni HypothesisCards shaklida shakllantiradi, shundan so'ng vazifalar deterministik «Check + Build» bosqichidan o'tadi. Keyin Supervisor LLM nomzodlarni ustuvorliklar bo'yicha taqsimlaydi (1d-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM agentlari (Planner va Supervisor) — bu hisoblash kampaniyasining holatini tahlil qiluvchi va keyingi qaysi usullarni ishga tushirish kerakligi haqida strategik qarorlar qabul qiluvchi sun'iy intellekt modellaridir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Deterministik boshqaruvchi GPU resurslari bo'shashi bilan vazifalarni tanlaydi. Generatsiya va baholash vaqtlari farq qilgani sababli, T-REX asinxron bajarishdan foydalanadi (1e-rasm). Natijalar kampaniya arxiviga yoziladi (4.3-bo'lim Metodlari) va EvidenceSummary'ga kiritiladi (1e-rasm; 4.5-bo'lim Metodlari). Ushbu ishda Planner va Supervisor vLLM orqali ishlaydigan Qwen3.6-27B-FP8 modelidan foydalanadi.&lt;/p&gt;\n&lt;p&gt;Target T-REX PUCT ε-gr. CX BC BG T-REX gain vs PUCT vs best GO&lt;br /&gt;\nCD45 2.090 0.479 0.188 0.347 0.014 0.035 4.36× 6.02×&lt;br /&gt;\nBetV1 0.444 0.236 0.118 0.118 0.021 0.104 1.88× 3.76×&lt;br /&gt;\nCbAgo 0.806 0.375 0.062 0.014 0.361 0.257 2.15× 2.23×&lt;br /&gt;\nHER2-&lt;a href=\"concepts/aav.html\"&gt;AAV&lt;/a&gt; 1.417 0.361 0.188 0.292 0.722 0.014 3.92× 1.96×&lt;br /&gt;\nSC2RBD 0.382 0.278 0.139 0.000 0.153 0.042 1.38× 2.50×&lt;br /&gt;\nPDL1 3.347 1.618 0.451 1.951 1.604 1.097 2.07× 1.72×&lt;br /&gt;\nIL7RA 1.660 0.660 0.278 1.160 1.236 1.035 2.52× 1.34×&lt;/p&gt;\n&lt;h4 id=\"22-t-rex-turli-xil-oqsil-nishonlari-boyicha-yuqori-otkazuvchanlikdagi-in-silico-dizaynga-erishadi\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#22-t-rex-turli-xil-oqsil-nishonlari-boyicha-yuqori-otkazuvchanlikdagi-in-silico-dizaynga-erishadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.2. T-REX turli xil oqsil nishonlari bo'yicha yuqori o'tkazuvchanlikdagi in silico dizaynga erishadi&lt;/span&gt;&lt;/a&gt;2.2. T-REX turli xil oqsil nishonlari bo'yicha yuqori o'tkazuvchanlikdagi in silico dizaynga erishadi&lt;/h4&gt;\n&lt;p&gt;Biz T-REX tizimini uchta faqat generatorga asoslangan baza va ikkita agent bo'lmagan adaptiv kontroller bilan bir xil ishchi hisoblash resurslari sharoitida Proteína-Complexa (Complexa) BENCHMARKidan tanlab olingan yettita nishon bo'yicha taqqosladik: CD45, BetV1, CbAgo, HER2-AAV, SC2RBD, PDL1 va IL7RA (2-rasm; 1-jadval). Generator bazalari sifatida Complexa, BindCraft va BoltzGen ishlatildi; adaptiv solishtiruvchilar sifatida esa agent bo'lmagan daraxt qidirish boshqaruvchisi PUCT va ε-greedy olindi. PUCT va ε-greedy tizimlari T-REX bilan bir xil harakatlar fazosida hamda bajarish va baholash muhitida ishladi, biroq til modellariga asoslangan kontekstli mulohazalarsiz, faqat skalyar mukofotga asoslangan taqsimotdan foydalandi.&lt;/p&gt;\n&lt;p&gt;Yettita nishon bo'yicha T-REX TM chegarasi 0.6 bo'yicha klasterlangan 1461 ta strukturaviy noyob hitlarni (SU) hosil qildi, bunda har bir dizayn kampaniyasi 4 ta H100 GPU tugunida 48 soat davom etdi (144 ishchi GPU-soat).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;T-REX har bir nishon bo'yicha oxirgi SU soni bo'yicha barcha 5 ta bazaviy usuldan ustun keldi va PUCTga nisbatan 2.43 barobar hamda eng kuchli generator bazasiga nisbatan 2.48 barobar geometrik o'rtacha o'sishga erishdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;T-REX ning o'tkazuvchanligi PUCTga nisbatan 1.38–4.36 barobarni tashkil etdi. 10, 50, 100 va 144 GPU-soatlardagi taqqoslashlar o'tkazuvchanlik traektoriyalarini yanada aniqlashtirdi (2a-rasm; S10-jadval). T-REX ning yutuqlari strukturaviy xilma-xillik va dizayn sifatining muqobil ta'riflariga nisbatan turg'un bo'ldi (2b, c-rasmlar). T-REX &lt;a href=\"concepts/tm-score.html\"&gt;TM-score&lt;/a&gt; 0.5, 0.6 va 0.8 chegaralarida hamda 70% o'xshashlikdagi ketma-ketlik klasterlashda har bir nishonda peshqadam bo'ldi (2b-rasm; S13 va S14-jadvallar). Hit talablari qat'iylashtirilganda ham o'tkazuvchanlik ustunligi saqlanib qoldi (S4-rasm). AF2, actifpTM, PRODIGY, ESMFold2 va Boltz-2 diagnostikalari bo'yicha ham T-REX har bir ball chegarasidan o'tgan eng ko'p strukturaviy farqlanuvchi hitlarni saqlab qoldi (2c-rasm; S6-rasm). CD45, SC2RBD va CbAgo uchun mustaqil ravishda boshlangan takroriy kampaniyalar T-REX ning PUCT va ε-greedy bazalaridan doimiy ravishда ustun ekanini ko'rsatdi (2d-rasm). T-REX shuningdek SMAC3 Bayes optimizatoridan ham ustun keldi (S11-jadval) hamda TNF-α va TrkA nishonlari bo'yicha ham yuqori SU o'tkazuvchanligini ko'rsatdi (S25-jadval).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Proteinga asoslangan in silico dizaynda TM-score (Template Modeling score) modellarning uch o'lchamli o'xshashligini 0 dan 1 gacha bo'lgan shkala bo'yicha baholaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"23-t-rex-keyingi-vazifalarni-taklif-qilish-uchun-kampaniya-dalillarini-birlashtiradi\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#23-t-rex-keyingi-vazifalarni-taklif-qilish-uchun-kampaniya-dalillarini-birlashtiradi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.3. T-REX keyingi vazifalarni taklif qilish uchun kampaniya dalillarini birlashtiradi&lt;/span&gt;&lt;/a&gt;2.3. T-REX keyingi vazifalarni taklif qilish uchun kampaniya dalillarini birlashtiradi&lt;/h4&gt;\n&lt;p&gt;T-REX muvaffaqiyatsizliklarni talqin qilish va keyingi ishlarni tanlash uchun kampaniya kontekstidan qanday foydalanishini sifat jihatidan o'rganish uchun biz uchta kampaniya traektoriyasini tahlil qildik. HER2-AAV da pLDDT mukofotiga asoslangan sinov birorta ham malakali dizaynni bermadi (0/32), bu esa ketma-ketlik va o'zak mosligi haqidagi qayta ko'rib chiqilgan gipotezaga olib keldi va keyingi ketma-ketlikni yaxshilash ishi 5/32 ta malakali dizaynni berdi (3a-rasm). CbAgo da iPAE qiymatlari chegaradan yuqori bo'lgan beshta dizayn Feynman–Kac (FK) boshqaruvini kengaytirishga turtki berdi va 4/16 ta malakali dizaynni taqdim etdi (3b-rasm). PDL1 da faqat pLDDT bo'yicha o'tmagan ota-ona obyekt ProteinMPNN yordamida qayta loyihalashtirilib, 16 ta avloddan 14 tasi muvaffaqiyatli o'tdi va bitta yangi SU olindi (3c-rasm). Har bir holatda kampaniya arxivi dastlabki dalillarni taklif qilingan keyingi test bilan bog'laydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ushbu misollar T-REX ning agentlik yondashuvi natijalarni tahlil qilib, iterativ ravishda yaxshilashga qodirligini ko'rsatadi, ammo amaliy sinovlar kelgusidagi in vitro tadqiqotlarini talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"24-t-rex-kampaniya-holatlariga-qarab-resurslarni-taqsimlashni-moslashtiradi-va-berk-kochalardan-chiqishga-ustuvor-ahamiyat-beradi\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#24-t-rex-kampaniya-holatlariga-qarab-resurslarni-taqsimlashni-moslashtiradi-va-berk-kochalardan-chiqishga-ustuvor-ahamiyat-beradi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.4. T-REX kampaniya holatlariga qarab resurslarni taqsimlashni moslashtiradi va berk ko'chalardan chiqishga ustuvor ahamiyat beradi&lt;/span&gt;&lt;/a&gt;2.4. T-REX kampaniya holatlariga qarab resurslarni taqsimlashni moslashtiradi va berk ko'chalardan chiqishga ustuvor ahamiyat beradi&lt;/h4&gt;\n&lt;p&gt;Biz T-REX kampaniya holatlaridagi Rescue (qutqarish), Explore (o'rganish) va eXploit (foydalanish) ustuvorliklarini o'zgartirish orqali vazifalarni qanday taqsimlashini o'rgandik. Kampaniya holatlari arxivlangan ma'lumotlar asosida yetti holatli tasnifimiz yordamida belgilandi (1d-rasm). Tasdiqlangan 1454 ta generatsiya va qayta loyihalash boshlanishidan 74% qismi ma'lumotlar kam bo'lganda Explore'ga, 51% qismi «to'xtab qolish» (stall) yoki «chuqur to'xtab qolish» (deep stall) holatlarida Rescue'ga, 82% qismi esa takrorlanishlar kuzatilgan samarali holatlarda eXploit'ga to'g'ri keldi (4a-rasm). Demak, T-REX ish yukini moslashuvchan taqsimlaydi: ma'lumotlar yetishmaganda Explore'ni, to'xtalishlarda Rescue'ni, tuzilmalar tez-tez takrorlansa-da yangi variantlar chiqishda davom etganda esa eXploit'ni afzal ko'radi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Rescue ustuvorligi to'xtab qolish holatlaridan chiqishda hal qiluvchi ahamiyatga ega: to'liq T-REX bunday vaziyatlarning 26 tadan 26 tasida muvaffaqiyatli chiqqan bo'lsa, bu ustuvorlik olib tashlanganda 20 tadan atigi 14 tasida muvaffaqiyatga erishildi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz Rescue ustuvorligining to'xtalishlardan chiqishdagi rolini uni harakatlar maydonidan olib tashlash orqali sinab ko'rdik. Dastlabki 100 GPU-soat davomida tiklanish to'xtalish holatiga kirishdan boshlab keyingi TM ≥ 0.6 bo'lgan yangi dizayngacha bo'lgan vaqt bilan o'lchandi (4b-rasm). To'liq T-REX 27 ta shunday holatning 26 tasida tiklangan bo'lsa, Rescue olib tashlangan intervensiyada 20 tadan 14 tasi tiklandi. Muvaffaqiyatli holatlar orasida keyingi muvaffaqiyatli dizayngacha bo'lgan o'rtacha vaqt to'liq T-REX'da oddiy to'xtalish uchun qisqaroq bo'ldi (1.77 va 5.04 GPU-soat), chuqur to'xtalish uchun ham shunday (3.52 va 7.60 GPU-soat). Shuningdek, to'liq T-REX to'xtalish holatlarida Rescue olib tashlangan variantga qaraganda kamroq vaqt o'tkazdi (3.8% va 27.7%). Bu natijalar Rescue ustuvorligining muhimligini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Vazifalar natijalari va ustuvorliklar o'rtasidagi bog'liqlikni o'rganish AI-agentning ichki mantiqini tushunishga yordam beradi: model ishonchliligi past bo'lganda vaznlar o'zgaradi, strukturaviy takrorlanishda esa yo'nalishlar takrorlanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Nihoyat, biz vazifa natijalari, strukturaning takrorlanishi va taqsimot ustuvorliklari o'rtasidagi bog'liqlikni o'rganib chiqdik. Retrospektiv tarzda aniqlangan birlamchi ma'lumotlarga ega 1305 ta generatsiya boshlanishidan interfeys Ishonchliligi (iPAE) va struktura takrorlanishi ko'pincha eXploit' bilan bog'liq bo'lsa (mos ravishda 65% va 93%), folding ishonchliligi (pLDDT) Rescue bilan bog'liq bo'ldi (88%, 4c-rasm). Keyingi vazifalar ham farq qildi: ishonchlilikka oid dalillar generator ballarini yoki ketma-ketlikni o'zgartirishga olib keldi, strukturaviy takrorlanish esa qidiruv sozlamalarini o'zgartirgan holda ma'lum yo'llarni takrorlashga olib keldi (4d-rasm).&lt;/p&gt;\n&lt;h4 id=\"25-loyihalashtirilgan-oqsillar-turli-xil-ikkilamchi-tuzilmalar-va-boglanish-orinlarini-qamrab-oladi\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#25-loyihalashtirilgan-oqsillar-turli-xil-ikkilamchi-tuzilmalar-va-boglanish-orinlarini-qamrab-oladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.5. Loyihalashtirilgan oqsillar turli xil ikkilamchi tuzilmalar va bog'lanish o'rinlarini qamrab oladi&lt;/span&gt;&lt;/a&gt;2.5. Loyihalashtirilgan oqsillar turli xil ikkilamchi tuzilmalar va bog'lanish o'rinlarini qamrab oladi&lt;/h4&gt;\n&lt;p&gt;TS-REX tomonidan ishlab chiqarilgan bog'lovchi tuzilmalar repertuarini tavsiflash uchun biz struktura jihatidan noyob hitlarning ikkilamchi tuzilma tarkibini o'rganib chiqdik. Yettita asosiy maqsadli kampaniya bo'yicha barcha 1461 ta TM ≥ 0.6 vakillari uchun DSSP tasnifidan foydalangan holda α-spiral va β-tasmalar ulushini hisobladik (5a, 5b-rasmlar). Metodlar bo'yicha β-tasmaga boy dizaynlarni solishtirish uchun klasterlashdan oldin kamida 20% qismi β;-tasma bo'lgan barcha malakali dizaynlarni tanladik. Yettita nishon bo'yicha T-REX 308 ta TM ≥ 0.6 klasterini hosil qildi, boshqa metodlar orasida eng yuqori ko'rsatkichga ega bo'lgan BoltzGen-only esa 95 ta klaster hosil qildi (S23-jadval).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;T-REX boshqa sinovdan o'tgan metodlarga qaraganda ko'proq β-tasmali klasterlarni (308 taga 95 ta) hosil qilib, turli xil ikkilamchi tuzilmalarni namoyish etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Keyinchalik biz CbAgo nishoniga nisbatan bashorat qilingan bog'lovchi o'rinlarini tahlil qildik. Har bir bashorat qilingan kompleksni nishon ustiga moslashtirgandan so'ng, har bir bog'lovchining markazini uning C_α atomlarining o'rtacha holati sifatida oldik. Asosiy komponentlar tahlili (&lt;a href=\"concepts/pca.html\"&gt;PCA&lt;/a&gt;) shuni ko'rsatdiki, T-REX bog'lovchi markazlari PUCT'ga qaraganda kengroq hududni egallaydi (5c-rasm). Har bir metod uchun 30 tadan vakildan iborat 1000 ta takroriy tanlanma bo'yicha bog'lovchi markazlari orasidagi o'rtacha juftlik masofasi T-REX uchun 31.2 Å, PUCT uchun esa 9.97 Å ni tashkil etdi (S24-jadval). Shu tariqa, T-REX strukturalarning xilma-xilligi va nishonga nisbatan keng ko'lamli bog'lanish o'rinlarini ta'minlaydi.&lt;/p&gt;\n&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;h4 id=\"natijalarni-muhokama-qilish-va-t-rex-usulining-istiqbollari\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#natijalarni-muhokama-qilish-va-t-rex-usulining-istiqbollari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalarni muhokama qilish va T-REX usulining istiqbollari&lt;/span&gt;&lt;/a&gt;Natijalarni muhokama qilish va T-REX usulining istiqbollari&lt;/h4&gt;\n&lt;p&gt;Mualliflar Target-adaptive Rescue–Explore–eXploit (T-REX) agentli kampaniya boshqaruvchisini taklif etadilar, u ixtisoslashtirilgan oqsil tuzilishi generatorlari va baholovchilarini muvofiqlashtirgan holda de novo oqsil bog'lovchilarini yuqori unumdorlikda loyihalashni ta'minlaydi. Bir nechta loyihalash vositalari va strategiyalaridan foydalangan holda, T-REX bir xil hisoblash byudjetlari sharoitida ham bitta generatorli bazaviy modellarga, ham agent bo'lmagan moslashuvchan boshqaruvchilarga nisbatan yuqoriroq natija ko'rsatkichiga erishdi (Rasm 2). Bu natijalar kampaniya darajasidagi muvofiqlashtirish maxsus oqsil dizayni vositalarini takomillashtirish bilan bir qatorda muhim qo'shimcha yo'nalishga aylanib borayotganini ta'kidlaydi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-f2.jpg\" alt=\"2-rasm / T-REX loyihalash kampaniyasi davomida baza usullariga qaraganda koʻproq strukturaviy noyob xitlarni ishlab chiq\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm / T-REX loyihalash kampaniyasi davomida baza usullariga qaraganda koʻproq strukturaviy noyob xitlarni ishlab chiqaradi. a.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm / T-REX loyihalash kampaniyasi davomida baza usullariga qaraganda koʻproq strukturaviy noyob xitlarni ishlab chiqaradi. a. T-REX, agent boʻlmagan adaptiv yondashuvlar va bitta generatorli bazaviy usullar uchun yettita nishon boʻyicha GPU-soatlarga nisbatan strukturaviy noyob xitlarning kümülatif soni. b. Har bir nishon uchun eng yuqori unumdorlikka ega muqobilga nisbatan koʻrsatilgan, 70% ketma-ketlik oʻxshashligida MMseqs2 klasterlash ostida xitlar oʻtkazuvchanligi. c. Yettita nishon boʻyicha birlashtirilgan muqobil post-hoc sifat chegaralari ostida saqlanib qolgan strukturaviy noyob xitlar soni. afpTM va ESMFold2 ipTM bashorat qilingan interfeys ishonchliligini oʻlchaydi, PRODIGY esa bogʻlanishning erkin energiyasini (Δ𝐺, kkal mol−1) baholaydi. Har bir chegara bir xil TM0.6 klaster vakillari toʻplamiga alohida qoʻllaniladi. d. CD45, SC2RBD va CbAgoʼda T-REX, PUCT va 𝜖-ochkoʻz (𝜖-greedy) uchun mustaqil ravishda boshlangan uchta kampaniya boʻyicha xitlar oʻtkazuvchanligi. Nuqtalar alohida kampaniyalarni koʻrsatadi; olmoslar va xatolik chiziqlari oʻrtacha qiymat va standart ogʻishni bildiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;共产 T-REX ning markaziy qismi til modellari (LLM) asosida qaror qabul qilish, natijalar va nosozlik turlarini tuzilmaviy tasniflash hamda resurslarni samarali taqsimlash uchun deterministik nazoratning uyg'unligidan iborat. LLM dan tartibsiz tarix ustidan fikr yuritishni so'rash o'rniga, T-REX kampaniya natijalarini talqin qilinadigan nosozlik turlari va kampaniya holatlariga ajratadi (Rasm 1). Ikki ta LLM agenti ushbu tuzilmaviy ma'lumotlar asosida ishlaydi: Rejalashtiruvchi (Planner) gipotezalar va keyingi harakatlarni taklif qiladi, Supervayzer (Supervisor) esa nomzod harakatlarni ustuvorlashtiradi hamda resurslarni Qutqarish (Rescue), O'rganish (Explore) va Foydalanish (eXploit) rejimlari o'rtasida taqsimlaydi (Rasm 3, 4).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-f1.jpg\" alt=\"1-rasm / T-REXʼning umumiy koʻrinishi. a.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm / T-REXʼning umumiy koʻrinishi. a.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm / T-REXʼning umumiy koʻrinishi. a. T-REX — bu belgilangan hisoblash byudjeti doirasida de novo oqsil bogʻlovchilarini loyihalash uchun hisoblash vositalarini moslashuvchan tarzda boshqaradigan agentlik tizimi. b, c. Loyihalash natijalari keyingi harakatlar uchun alohida ustuvorliklarni keltirib chiqaradigan nosozlik rejimlariga boʻlinadi: Istiqbolli loyihalarni qutqarish (Rescue), muqobil usullar yoki sozlamlarni oʻrganish (Explore) yoki samarali yoʻllardan foydalanish (eXploit). d. Yakunlangan va davom etayotgan loyihalash ishlari boʻyicha dalillar kompaniya holatining rivojlanib borayotgan tuzilgan koʻrinishiga jamlanadi va ikkita LLM agenti tomonidan talqin qilinadi. Rejalashtiruvchi dalillarga asoslangan gipotezalar va keyingi harakatlarni taklif qiladi, Supervayzer эса tasdiqlangan harakatlarni ustuvorlashtiradi hamda ularning Rescue, Explore va eXploit oʻrtasida taqsimlanishini taklif etadi. Deterministik boshqaruvchi mavjud hisoblash resurslarini hisobga olgan holda vazifalarni bajarishni muvofiqlashtiradi. e. Taklif etilgan harakatlar mavjud GPUʼlarda asinxron tarzda bajariladi, yakunlangan natijalar esa keyingi rejalashtirish va taqsimlash uchun yangi dalillarni taqdim etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-f3.jpg\" alt=\"3-rasm / T-REX keyingi loyihalash strategiyalarini taklif qilish uchun kampaniya natijalaridan foydalanadi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm / T-REX keyingi loyihalash strategiyalarini taklif qilish uchun kampaniya natijalaridan foydalanadi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-rasm / T-REX keyingi loyihalash strategiyalarini taklif qilish uchun kampaniya natijalaridan foydalanadi. Uchta retrospektiv misol T-REX kuzatilgan natijalardan keyingi hisoblash harakatlarini taklif qilish uchun qanday foydalanishini koʻrsatadi. a. HER2-AAV uchun pLDDTʼni optimallashtiruvchi toʻplam muvaffaqiyatli loyihalarni bermadi, bu esa ketma-ketlikni takomillashtirishga turtki boʻldi va u 5/32 muvaffaqiyatli loyihani hamda uchta yangi strukturaviy noyob xitni keltirib chiqardi. b. CbAgo uchun faqat iPAE mezonidan oʻta olmagan takroriy loyihalar Feynman–Kac (FK) kengroq qidiruviga turtki boʻlib, 4/16 muvaffaqiyatli loyiha va ikkita yangi strukturaviy noyob xitni berdi. c. PDL1 uchun faqat pLDDT mezonidan oʻta olmagan loyiha ProteinMPNN sobit karkasli ketma-ketlikni qayta loyihalashga turtki berib, 14/16 muvaffaqiyatli loyiha va bitta yangi strukturaviy noyob xitni hosil qildi. Toʻq sariq va yashil yorliqlar mos ravishda bajarilmagan va bajarilgan loyihalash mezonlarini bildiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-f4.jpg\" alt=\"4-rasm / T-REX loyihalash strategiyalarini kampaniya holati va toʻplangan dalillarga moslashtiradi. a.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm / T-REX loyihalash strategiyalarini kampaniya holati va toʻplangan dalillarga moslashtiradi. a.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-rasm / T-REX loyihalash strategiyalarini kampaniya holati va toʻplangan dalillarga moslashtiradi. a. Kampaniya holati boʻyicha guruhlangan 1454 ta generatsiya va qayta loyihalash ishlari boʻyicha Rescue–Explore–eXploit (R/E/X) ustuvorliklari. b. T-REX hamda aniq Rescue ustuvorligiga ega boʻlmagan T-REX uchun toʻxtab qolgan kampaniya holatiga kirishdan keyingi strukturaviy noyob xitgacha boʻlgan GPU-soatlar. Nuqtalar alohida tiklanish hodisalarini koʻrsatadi; kattaroq markerlar va chiziqlar medianalar hamda kvartylararo diapazonlarni koʻrsatadi. c. Har bir qaror haqida maʼlumot beruvchi asosiy dalillar boʻyicha guruhlangan 1305 ta generatsiya va qayta loyihalash ishlari boʻyicha R/E/X ustuvorliklari. d. C-bandidagidek asosiy dalillar boʻyicha guruhlangan oʻsha ishlar uchun keyingi loyihalash strategiyalari.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;LLM agentlari (bu holda Qwen3.6-27B-FP8 asosida) — harakatlarni rejalashtirish, oraliq natijalarni tahlil qilish va matnli ma'lumotlar asosida qaror qabul qilish qobiliyatiga ega sun'iy intellekt dasturlaridir.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;T-REX kampaniya holatini tuzilmaviy taqdim etish, LLM asosida takliflar kiritish va deterministik resurslarni taqsimlashni ajratish orqali hisoblash samaradorligini oshiradi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;T-REX ni baholash faqat hisoblash muhitida, muvaffaqiyatli va noyob topilmalarni baholash uchun o'rnatilgan in silico metrikalari yordamida amalga oshirildi. Garchi eksperimental tasdiqlash tal etilsa-da, T-REX tarkibidagi ayrim generatorlar (Proteína-Complexa, BindCraft va BoltzGen) o'zlarining dastlabki tadqiqotlarida eksperimental tasdiqlangan bog'lovchilarni hosil qilgan. Haqiqiy de novo dizayni bog'lanish yaqinligi, o'ziga xosligini va ishlab chiqish imkoniyatlarini baholashni talab qiladi. Kelgusida T-REX ni robototexnika bilan birlashtirish dizayn va sinov tsikllarini yaxshilashi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Metodni baholash faqat virtual muhitda bajarilgan bo'lib, to'liq amaliyotga joriy etish uchun real oqsil yaqinligi va xususiyatlarini inobatga olgan holda eksperimental tekshiruv zarur.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"41-kampaniya-spetsifikatsiyasi-va-umumiy-harakatlar-makoni\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#41-kampaniya-spetsifikatsiyasi-va-umumiy-harakatlar-makoni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.1. Kampaniya spetsifikatsiyasi va umumiy harakatlar makoni&lt;/span&gt;&lt;/a&gt;4.1. Kampaniya spetsifikatsiyasi va umumiy harakatlar makoni&lt;/h4&gt;\n&lt;p&gt;Kampaniyani sozlash va boshqaruvchilar. T-REX tizimi belgilangan hisoblash byudjeti doirasida tuzilish jihatidan turlicha bo'lgan bog'lovchi oqsillar (hitlar) sonini maksimal darajada oshirish uchun hisoblash vazifalarini moslashuvchan tarzda tanlaydi. Kampaniya bitta nishon uchun belgilangan resurslar byudjeti va bir nechta grafik protsessorlar yordamida bajariladigan generatsiya, qayta loyihalash va baholash vazifalarini o'z ichiga oladi. Har bir nishon uchun oldindan belgilangan tuzilma va bog'lanish saytining faol nuqtalari, shuningdek oqsil uzunligining standart oralig'i ishlatildi (S1-jadval). Tuzilish jihatidan noyob hitlar 4.2-bo'limda tavsiflangan kompyuter saralash mezonlari va klasterlash yordamida sanab chiqildi. T-REX, PUCT va ε-greedy algoritmlari kampaniya darajasidagi boshqaruvchilar sifatida xizmat qildi va ular umumiy parametr chegaralari hamda yagona bajarish va baholash muhitiga ega bo'lgan bir xil harakatlar makonida ishladi. PUCT va ε-greedy LLM asosidagi kontekstli mulohazalardan foydalanmagan holda, skalyar mukofotlarga asoslangan resurslarni taqsimlashdan foydalandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Harakatlar makoni — bu tizim eng yaxshi oqsil molekulalarini qidirish uchun boshqaradigan mavjud algoritmlar va ularning sozlamalari to'plami.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Umumiy harakatlar makoni. Ushbu makon kampaniyada ruxsat etilgan sakkizta harakat oilasi va konfiguratsiyalarini o'z ichiga oldi: Complexa qidiruvining to'rt xil varianti (nurli qidirvu, best-of-n, Feyman-Kats boshqaruvi va Monte-Karlo daraxti qidiruvi), shuningdek BindCraft va BoltzGen yordamida de novo generatsiya qilish; ProteinMPNN yordamida ketma-ketlikni qayta loyihalash; va AF2 yordamida baholash. Ushbu makon ichida harakat oilasi hisoblash usulini belgilaydi, yo'nalish bir xil sozlamalarga ega generatsiya yoki qayta loyihalash vazifalarini guruhlaydi, vazifa esa bajariladigan aniq hisob-kitobni, jumladan ruxsat etilgan parametrlarni belgilaydi. Boshqaruvchilar oilaga xos sozlamalarni va Complexa mukofot shartlari yoki BindCraft yo'qotish og'irliklarini oldindan belgilangan chegaralarda sozlashi mumkin edi. Oldindan o'qitilgan modellarning og'irliklari, generatorlar va harakatlar makoni kampaniya davomida o'zgarmas qoldi, mavjud vazifalar esa yangi konfiguratsiyalar tanlanishi bilan yangilanib bordi.&lt;/p&gt;\n&lt;p&gt;Kampaniyani bajarish. Barcha uchta moslashuvchan boshqaruvchilar umumiy boshlang'ich sozlamalar bilan oldindan belgilangan Complexa Beam, BoltzGen va BindCraft vazifalari bilan boshlandi. PUCT va ε-greedy qo'shimcha ravishda o'zlarining to'rtinchi ishchi oqimida Complexa best-of-n vazifasini boshladilar. Natijalar paydo bo'lishi bilan keyingi vazifalar to'plangan dalillar asosida tanlandi. Ishchilar foydalanishi har bir vazifa bo'yicha, malaka esa har bir dizayn uchun hisoblandi. Boshqaruvchi statistikasi uchun yo'nalishlar natijalarni jamlash birligi bo'lib xizmat qildi. Qayta loyihalash yo'nalishlari dastlabki generatsiya kontekstini saqlab qoldi. Operatsion jihatdan har bir kampaniya takrorlanuvchi tsikl bo'yicha amalga oshirildi: yakunlangan vazifalar ma'lumotlarni yangiladi, boshqaruvchi ularni keyingi ishlarni rejalashtirish uchun ishlatdi va ularning natijalari keyingi qarorlar uchun asos bo'ldi.&lt;/p&gt;\n&lt;h4 id=\"42-design-qualification-and-throughput-measurement\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#42-design-qualification-and-throughput-measurement\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2. Design qualification and throughput measurement&lt;/span&gt;&lt;/a&gt;4.2. Design qualification and throughput measurement&lt;/h4&gt;\n&lt;p&gt;Loyihalarni malakalash va o'tkazuvchanlik qobiliyatini o'lchash jarayoni ikki bosqichda baholandi: dastlab ular umumiy malakalash mezonlariga javob berishi kerak edi, shundan so'ng malakadan o'tgan bog'lovchi zanjirlar strukturaviy jihatdan farq qiluvchi hitlarni (SU) aniqlash uchun klasterlarga ajratildi. Dizaynlar faqatgina bog'lovchining pLDDT ko'rsatkichi ≥ 90, &lt;a href=\"concepts/predicted-aligned-error.html\"&gt;normallashtirilgan iPAE&lt;/a&gt; qiymati ≤ 7/31 va bog'lovchining scRMSD og'ishi &amp;lt; 1.5 Å bo'lgandagina malakali deb topildi. Ushbu ostonalar Proteina-Complexa baholash protokolidan hamda ColabDesign asosidagi odatiy AF2-Multimer protokolidan olingan o'lchovlarga asoslangan edi. Normallashtirilgan iPAE qiymati bog'lovchidan nishonga va nishondan bog'lovchiga yo'naltirilgan ikkita PAE o'rtacha qiymatlarining yig'indisi 31 ga bo'lingan holda hisoblandi. Bog'lovchining scRMSD ko'rsatkichi mos keluvchi nishon Cα atomlarini Kabsch usuli bo'yicha tekislagandan keyin hosil qilingan va AF2 bashorat qilgan bog'lovchi tuzilmalari orasidagi Cα ildiz-o'rtacha kvadrat og'ishi sifatida aniqlandi. Complexa tizimi odatda generatsiya jarayonida barcha uchta malaka o'lchovini o'zi ishlab chiqarardi. BindCraft, BoltzGen va ProteinMPNN qayta loyihalash natijalari esa 4.5-bo'limda tasvirlangan qoidalarga muvofiq alohida standartlashtirilgan AF2 baholashni talab qilardi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Standartlashtirilgan AF2 baholashi va pLDDT, iPAE hamda scRMSD kabi metrikalar barqaror va yuqori sifatli oqsillar komplekslarini aniq saralab olish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Strukturaviy yangilikni baholashda, agar malakali dizaynning bog'lovchi zanjiri kampaniyada allaqachon mavjud bo'lgan struktura bilan klasterlashsa, u yangi SU qo'shmagan deb topilishi mumkin edi. Foldseek dasturi har bir kampaniya doirasida malakali bog'lovchi zanjirlarni TM0.6 ko'rsatkichi bo'yicha alohida klasterlarga ajratdi; bu ostonaviy qiymat ilgari hosil qilingan oqsil skeletlarining strukturaviy xilma-xilligini aniqlash uchun ishlatilgan. Qo'shimcha &lt;a href=\"concepts/analiz-chuvstvitelnosti.html\"&gt;sezgirlik tahlili&lt;/a&gt; sifatida TM0.5 va TM0.8 qiymatlari ham baholandi (S14-jadval). Har bir yakuniy klaster bitta tuzilish bo'yicha noyob birlik (SU) sifatida hisoblandi, bu esa biologik fold yoki epitop o'xshashligini emas, ayniqsa strukturaviy o'xshashlikni miqdoriy baholadi. Protokol va klasterlash tafsilotlari B.1–B.2 bo'limlarda va S4-jadvalda keltirilgan.&lt;/p&gt;\n&lt;p&gt;O'tkazuvchanlikni o'lchash jarayonida T-REX, PUCT yoki ε-greedy adaptiv usullari bilan boshqariladigan kampaniyalarning yakuniy SU soni kampaniya davomida yaratilgan oxirgi dalillar xulosasidan ko'chirib olinmasdan, yakuniy kampaniya yozuvlaridan qayta hisoblab chiqildi (4.3-bo'limga qarang). Har bir SU baholash vazifasiga emas, balki tanlangan vakilni yaratgan generatsiya yoki qayta loyihalash vazifasiga yozildi; har bir klasterdan bitta vakil dizaynni tanlash qoidalari B.2-bo'limda berilgan. O'tkazuvchanlik NSU/H sifatida aniqlandi, bu yerda NSU — yakuniy klasterlar soni, H esa asosiy benchmarkdagi har bir usul va nishon kombinatsiyasi uchun 144 H100 ishchi GPU-soatini tashkil etdi. Adaptiv kampaniyalar uchun generatsiya, qayta loyihalash va standartlashtirilgan AF2 baholash ushbu budjetga kiritildi, chunki bu hisob-kitoblar kampaniya bajarilishi davomida sodir bo'lgan va keyingi taqsimotga ta'sir qilishi mumkin edi. Faqat generatordan iborat bazaviy usullar uchun generatsiya va qidiruv budjetga kiritildi, biroq generatsiya muddati tugagandan so'ng bajarilgan standartlashtirilgan AF2 baholash chiqarib tashlandi, chunki u qaysi dizaynlar yaratilganiga ta'sir eta olmas edi. T-REX uchun til modeli (LLM) xizmat ko'rsatish va post-hoc tahlillar H ga kiritilmadi, chunki bu ko'rsatkich dizayn kampaniyasi paytida ishlatiladigan ishchi hisoblash quvvatini qamrab olish uchun mo'ljallangan. Muqobil hisob-kitoblar va kampaniya darajasidagi statistika D.1.3 va D.1.1-bo'limlarda ko'rsatilgan.&lt;/p&gt;\n&lt;h4 id=\"43-kampaniya-arxivi-va-dalillarni-shakllantirish\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#43-kampaniya-arxivi-va-dalillarni-shakllantirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3. Kampaniya arxivi va dalillarni shakllantirish&lt;/span&gt;&lt;/a&gt;4.3. Kampaniya arxivi va dalillarni shakllantirish&lt;/h4&gt;\n&lt;p&gt;Rejalashtirish, bajarish va natijalarni kuzatib borish uchun har bir kampaniya davomida maxsus arxiv yuritildi. Tizim eski ma'lumotlarni o'zgartirmasdan, yangi yozuvlarni qo'shib bordi. Asosiy ilmiy natijalar va rejalashtirish ma'lumotlarini saqlash uchun uch turdagi yozuvdan foydalanildi: ResultRecord, EvidenceSummary va HypothesisCard. ResultRecord bajarilgan vazifa natijasi yoki xatosini qayd etib, har bir natijani harakatlar oilasi, yo'nalish va ota-ona dizayn bilan bog'ladi. Shuningdek, unda o'lchovlar, ishchilar resurslari, bajarilish holati hamda struktura, ball va log fayllarga havolalar saqlandi. Bir vazifa bir nechta ResultRecord hosil qilishi mumkin edi. Vazifa yaroqli dizayn bermasa ham, ResultRecord xato holati va sarflangan resurslarni qayd etardi. Bundan tashqari, arxivda nomzod vazifalar, Supervisor reytinglari, resurslarni taqsimlash ulushlari, navbatga qabul qilish qarorlari va LLM chaqiruvlari auditi saqlandi (Rasm S3).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS3.jpg\" alt=\"Rasm S3 / Uchta T-REX ishga tushirilishi bo‘yicha onlayn SU sonlari.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S3 / Uchta T-REX ishga tushirilishi bo‘yicha onlayn SU sonlari.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Rasm S3 / Uchta T-REX ishga tushirilishi bo‘yicha onlayn SU sonlari. Har bir panel oldindan belgilangan 144 ta H100 ishchi-GPU-soat maxrajida bitta nishon uchun mustaqil ravishda ishga tushirilgan uchta kampaniyani ko‘rsatadi. Qattiq qadamlar arxivlangan onlayn TM0.6 SU sonlarini ko‘rsatadi, ular Foldseek klasterlanishi yangilanganda kamayishi mumkin; ochiq belgilar yakuniy qayta hisoblangan TM0.6 SU sonlarini ko‘rsatadi. 2d-rasm va S9-qo‘shimcha jadval tegishli adaptiv boshqaruvchilarni solishtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;EvidenceSummary yig'indisini qurish Rejalashtiruvchi yangi testlarni taklif qilishidan oldin amalga oshirildi. Deterministik kod arxiv natijalari, tugallanmagan ishlar va mavjud resurslardan foydalanib EvidenceSummary'ni tuzdi. Bu yig'indi Rejalashtiruvchi va Supervisor uchun umumiy kontekst vazifasini bajardi, ularning promplariga esa qisqartirilgan versiyasi uzatildi. Rasm 1d da ko'rsatilganidek, yig'indi ma'lumotlarni oltita yo'nalish bo'yicha guruhladi: (1) struktura sifati; (2) strukturaning yangiligi; (3) aniq yo'nalish bo'yicha natija va xarajat; (4) kutilayotgan baholashlar; (5) ota-ona nasli va natijalari; (6) GPU resurslari va faol vazifalar. Shuningdek, tizim yaqin muvaffaqiyatsizliklar (near-miss) va yordamchi o'lchovlarni saqlab qoldi. Yordamchi o'lchovlarga ipTM, ipSAE, interfeys energiyasi va shakl komplementarligi kirdi. To'liq sxema va sifat hisob-kitoblari Rasm S4.1–S4.3 da, LLM uchun qisqartirish esa Rasm S5.2 da keltirilgan.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS4.jpg\" alt=\"Rasm S4 / Uchta malaka mezonini birgalikda qattiqlashtirishga sezgirlik. Tanlangan vakili normallashtirilgan pLDDT, iPAE\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S4 / Uchta malaka mezonini birgalikda qattiqlashtirishga sezgirlik. Tanlangan vakili normallashtirilgan pLDDT, iPAE va scRMSD o‘tish chegaralari kamida 𝜏 bo‘lishi talabiga javob beradigan har bir ishchi-GPU-soat uchun sobit yakuniy Foldseek TM0.6 klasterlari; 𝜏 = 0 birlamchi malaka qoidasini tiklaydi. Tezliklar 144 ta H100 ishchi-GPU-soat oldindan belgilangan maxrajidan foydalanadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS4-2.jpg\" alt=\"Rasm S4 (davomi 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S4 (davomi 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS4-3.jpg\" alt=\"Rasm S4 (davomi 3)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S4 (davomi 3)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS4-4.jpg\" alt=\"Rasm S4 (davomi 4)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S4 (davomi 4)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS5.jpg\" alt=\"Rasm S5 / Nishonlar bo‘yicha yakuniy T-REX TM0.6 tuzilma-noyob birliklarining harakat oilasi atributi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S5 / Nishonlar bo‘yicha yakuniy T-REX TM0.6 tuzilma-noyob birliklarining harakat oilasi atributi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Rasm S5 / Nishonlar bo‘yicha yakuniy T-REX TM0.6 tuzilma-noyob birliklarining harakat oilasi atributi. Har bir ustun tanlangan vakilni bevosita ishlab chiqargan generatsiya yoki qayta loyihalash oilasiga ko‘ra nishonning yakuniy Foldseek TM0.6 klasterlarini taqsimlaydi; o‘ng tarafdagi yorliqlar tuzilma-noyob birliklarning (SU) umumiy sonini beradi. Har bir klaster bir marta sanalgan va natijani baholagan standartlashtirilgan AF2 vazifasi to‘g‘ridan-to‘g‘ri kredit olmagan. Generatsiya yoki qayta loyihalash vazifasi bir nechta dizaynni ishlab chiqarishi mumkin va shuning uchun birdan ortiq SU'ga hissa qo‘shishi mumkin. Grafik sababiy hissa yoki bir boshlanish uchun samaradorlikni emas, balki natija atributini tasvirlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Deterministik kod — bu qat'iy qoidalarga asoslangan va bir xil kirish ma'lumotlaridan doimo bir xil natija beruvchi algoritm.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kampaniya holatini tayinlash LLM mulohazalari uchun kontekst yaratdi (Rasm 1d). Maxsus deterministik klassifikator yettita kampaniya holatidan birini tayinladi: kam dalil, strukturali dublikatlar kollapsi, samarali, dublikat bilan samarali, near-miss boyitilgan, turg'unlik yoki chuqur turg'unlik. Klassifikator mahsuldorlik, dublikatsiya va hisoblash sarfini tahlil qildi. Agar bir nechta shart bajarilsa, oldindan belgilangan ustuvorlik tartibi ishga tushdi, standart holat sifatida esa kam dalil tanlandi. Tayinlangan yorliq EvidenceSummary'ga kiritildi. Holat ta'riflari va chegaralari Rasm S4.5 da berilgan.&lt;/p&gt;\n&lt;h4 id=\"44-dalillarga-asoslangan-rejalashtirish-va-gipoteza-boyicha-teskari-aloqa\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#44-dalillarga-asoslangan-rejalashtirish-va-gipoteza-boyicha-teskari-aloqa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.4. Dalillarga asoslangan rejalashtirish va gipoteza bo'yicha teskari aloqa&lt;/span&gt;&lt;/a&gt;4.4. Dalillarga asoslangan rejalashtirish va gipoteza bo'yicha teskari aloqa&lt;/h4&gt;\n&lt;p&gt;LLM agent rollari. T-REX tizimi LLM asosidagi ikkita kontroller rolidan — Rejalashtiruvchi va Nazoratchidan (1d-Rasm) foydalandi. Ikkalasi ham vLLM yordamida bir xil mahalliy xizmat ko'rsatiladigan Qwen3.6-27B-FP8 modeli asosida yaratilgan, biroq alohida promptlar va &lt;a href=\"concepts/structured-output.html\"&gt;tuzilgan chiqish&lt;/a&gt; sxemalaridan foydalangan (Team, 2026; Kwon va boshq., 2023). Mualliflar ushbu ochiq vaznli modelni qat'iy, versiyalangan model snapshotiga va oldindan belgilangan xizmat ko'rsatish konfiguratsiyasiga ega mahalliy joylashtirishni ta'minlash uchun tanladilar. Model bitta H100 grafik protsessorida ishlatildi. Yettita asosiy kampaniya davomida 3125 ta LLM chaqiruvidan atigi 7 tasi (0.22%) tuzilgan chiqish validatsiyasidan o'tmagan javoblarni berdi; bu javoblar ishga tushirilishidan oldin rad etilib, deterministik zaxira yo'llarini ishga tushirdi (S15-Jadval). Funksional jihatdan Rejalashtiruvchi nimani va nima uchun keyingi sinovdan o'tkazish kerakligini taklif qilgan bo'lsa, Nazoratchi qaysi tasdiqlangan nomzodlar kelgusida ishchilarning ishga tushirilishini olishini ustuvorlashtirdi. Hech qaysi LLM vazifalarni bevosita ishga tushirmagan; nomzodlarni yaratish, validatsiya qilish, qabul qilish, dispetcherlik va bajarish deterministik kontroller mantig'i bilan boshqarilgan (4.5-Bo'lim; C.8.2-Qo'shimcha bo'lim).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tuzilgan chiqish (structured-output) — bu sun'iy intellekt modelining javoblarini qat'iy oldindan belgilangan qolipda (masalan, JSON formatida) shakllantirishni ta'minlaydigan texnik mexanizm.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;LLM qarorlarini yo'naltirish. Ikkala prompt ham keyingi ish unumdor yo'nalishni kengaytirishi, aniqlangan kamchilikni bartaraf etishi yoki muqobil yo'l yoki konfiguratsiyani sinab ko'rishi kerakligi bo'yicha ko'rsatmalar berdi. Yo'nalish unumdorligi zarur baholash va ajdod vazifalarini o'z ichiga olgan holda, yo'nalishga sarflangan GPU-soatiga to'g'ri keladigan TM0.6 tarkibiy foydalilik birliklarining (SU) so'nggi soni sifatida o'lchandi. Keyingi hisob-kitoblar uchun qaysi yo'nalishlarni ustuvor ko'rish kerakligini aniqlash uchun promptlar har ikkala LLM rolidan so'nggi yo'nalish unumdorligidan asosiy miqdoriy mezon sifatida foydalanishni buyurdi. Unumdorligi kamroq bo'lgan yo'nalishning so'nggi yangi TM0.6 SU/GPU-soat ko'rsatkichi unumdorligi yuqoriroq yo'nalishnikining kamida 85% ni tashkil etganda, ikkita yo'nalish taqqoslanadigan unumdorlikka ega deb hisoblandi, garchi har ikkala prompt bunday taqqoslash kam sonli kuzatishlar yoki kichik hisob-kitoblarga asoslanganda ehtiyotkor bo'lishni maslahat berdi. Bunday yo'nalishlar uchun LLM rollariga malakali dizayn sifat ko'rsatkichlarining yuqoriroq 25-persentiliga ega yo'nalishni afzal ko'rish buyurildi, medianadan keyingi taqqoslash sifatida foydalanildi (C.5.3, C.7 va C.4.3-Qo'shimcha bo'limlar).&lt;/p&gt;\n&lt;p&gt;Rejalashtirish. Rejalashtiruvchi EvidenceSummary va kampaniya holati kontekstini, shuningdek, sakkiztagacha faol yoki yaqinki HypothesisCards (gipoteza kartochkalari), mavjud harakat oilalari va ularning rollari, ruxsat etilgan sozlamalar va har bir vazifa uchun ish yuki limitlarini oldi. Prompt bittadan to'rttagacha yangi HypothesisCards so'radi, ularning har biri dalillarga bog'langan gipoteza va taklif etilgan keyingi hisoblash testini tasvirlaydi. Har bir yangi karta qo'llab-quvvatlovchi dalillarga havola qildi, harakat oilalari va sozlamalarini taklif qildi va testning Rescue, Explore va eXploit uchun dolzarbligini ko'rsatdi. Shuningdek, u tanlangan malaka o'lchovlari qanday o'zgarishini bashorat qildi va tegishli bo'lganda, boshqa o'lchovlar belgilangan limitdan tashqari yomonlashmasligi kerakligini aniqladi. Xizmat ko'rsatish sozlamalari, prompt tafsilotlari va chaqiruv shartlari C.5 va C.5.4-Qo'shimcha bo'limlarda ko'rsatilgan.&lt;/p&gt;\n&lt;p&gt;Tekshirish + Yig'ish va nomzodlarni validatsiya qilish. Rejalashtiruvchi takliflari bevosita bajarilishi mumkin emas edi. Qat'iy Check + Build mantig'i yangi yoki saqlangan HypothesisCards ni aniq ActionCandidates ga aylantirdi va so'ralgan operatsiyani, ro'yxatdan o'tgan harakat oilasini, ruxsat etilgan parametr va ish yuki chegaralarini, kerakli kiritish fayllarini va tegishli bo'lganda ota-ona muvofiqligini tasdiqladi. Ruxsat etilgan deterministik tuzatishlar qo'llanildi, aks holda yaroqsiz nomzodlar rad etildi. Ushbu validatsiya qat'iy harakat makonini majburiy qilib, LLM ga ro'yxatdan o'tmagan harakat oilalarini kiritishga, oldindan belgilangan parametr chegaralaridan oshib ketishga yoki maqsad, malaka mezonlari, tarkibiy yangilik qoidasi yoki ishchi byudjeti kabi qat'iy kampaniya ta'riflarini o'zgartirishga yo'l qo'ymadi. Faqatgina yig'ish tekshiruvidan o'tgan nomzodlar Nazoratchining ustuvorligi va keyingi qabul qilinishiga loyiq edi. Check + Build dan o'tish yaratilish vaqtida amal qilishini ta'minladi, ammo bajarilishini kafolatlamadi; nomzodlar 4.5-bo'limda tavsiflangan yakuniy qabul qilish qoidalariga va jonli dispetcherlik tekshiruvlariga bo'ysunishda davom etdi.&lt;/p&gt;\n&lt;p&gt;Nazoratchining ustuvorligi va taqsimoti. Nazoratchi EvidenceSummary va kampaniya holati kontekstini, shuningdek Rejalashtiruvchidan gipotezalar va munosib nomzod vazifalarni oldi. U bajarish uchun nomzod vazifalarni tavsiya qildi, tavsiya etilgan har bir vazifani Rescue, Explore yoki eXploit ga tayinladi va ularni barcha uchta ustuvorlik bo'yicha reytingga qo'ydi. Shuningdek, u har bir ustuvorlik ostida bajariladigan vazifalarning kerakli nisbatlarini belgilovchi normallashtirilgan R/E/X aralashmasini qaytardi. Batafsil kiritish va chiqarish spetsifikatsiyalari, reyting bo'yicha ko'rsatmalar va taqsimot qoidalari C.5.2 va C.7-Qo'shimcha bo'limlarda keltirilgan.&lt;/p&gt;\n&lt;p&gt;Gipoteza bo'yicha teskari aloqa. Nomzod vazifalarni tanlab olgandan so'ng, kontroller Rejalashtiruvchi tomonidan oldin taklif qilingan keyingi testlar natijalarini baholash uchun oldindan belgilangan qoidalardan foydalandi. Har bir HypothesisCards bilan bog'langan natijalar oldindan kuzatilgan mos yozuvlar natijasi bilan taqqoslandi va qo'llab-quvvatlovchi, qarama-qarshi yoki neytral deb tasniflandi. To'plangan natijalar karta qo'llab-quvvatlanganligini, rad etilganligini yoki belgilangan xizmat muddati tugagandan so'ng faol emasligini aniqladi. Bu maqomlar keyingi Rejalashtiruvchi va Nazoratchi qarorlariga ta'sir qildi, ammo dizayn malakasiga, SU kreditiga yoki taklif qilingan sabab-oqibat tushuntirishini tasdiqlashga ta'sir qilmadi. Batafsil baholash va maqomni yangilash qoidalari C.9-Qo'shimcha bo'limda, amaliy misol esa D.2.2-Qo'shimcha bo'limda keltirilgan.&lt;/p&gt;\n&lt;h4 id=\"45-vazifalarni-asinxron-taqsimlash-va-bajarish\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#45-vazifalarni-asinxron-taqsimlash-va-bajarish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.5. Vazifalarni asinxron taqsimlash va bajarish&lt;/span&gt;&lt;/a&gt;4.5. Vazifalarni asinxron taqsimlash va bajarish&lt;/h4&gt;\n&lt;p&gt;Nomzod vazifalarni tanlash 4.4-bo'limda tavsiflangan yig'ilishda tekshirilgan vazifalarga asoslandi. Supervayzer tavsiya etilgan har bir nomzod vazifani Rescue, Explore yoki eXploit (R/E/X) toifalaridan biriga tayinladi va ularni uchta ustuvorlik bo'yicha tartibladi. Boshqaruvchi bu vazifalarni tartib raqami bo'yicha ko'rib chiqdi va oldindan belgilangan maqsadga muvofiqlik hamda resurs cheklovlarini hisobga olgan holda keyingi generatsiya va qayta loyihalash boshlanishlarini taqsimlash uchun R/E/X aralashmasidan foydalandi. Agar umumiy ishchilar navbatiga qo'shimcha vazifalarni kiritish mumkin bo'lsa, boshqaruvchi ularni harakat oilalari, yo'nalish unumdorligi va taxminiy vazifa narxi bo'yicha so'nggi boshlanishlarga asoslangan deterministik qoidalar yordamida qolgan munosib nomzodlar orasidan tanlab oldi. Tanlangan vazifalar umumiy ishchilar navbatiga k kirdi, ammo real R/E/X taqsimotiga faqat tasdiqlangan generatsiya va qayta loyihalash boshlanishlari o'z hissasini qo'shdi. Nomzodlarni tartibga solish, taqsimlash, zaxira va dispetcherlik qoidalari C.7-qo'shimcha bo'limda va S8-jadvalda keltirilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ishchilarning asinxron ish rejimi hisoblash resurslarining to'xtab qolishini oldini olib, natijalarni uzluksiz qayta ishlash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ishchilarni rejalashtirish va asinxron bajarish jarayonida: T-REX uchta H100 GPU ishchisi va LLM larga xizmat ko'rsatish uchun alohida H100 GPU dan foydalandi; PUCT va ε-greedy to'rtta ishchidan foydalandi. T-REX ning hisobot byudjeti 144 ishchi GPU-soatni tashkil etdi, bu 48 soat davomida uchta ishchi slotiga to'g'ri keladi (3 × 48 = 144). Ishchi bo'shaganda, boshqaruvchi uni boshlash yoki kechiktirishdan oldin keyingi vazifaning kirish ma'lumotlarini, ota-ona obyektlari mosligini va resurslar mavjudligini qayta tekshirdi. Yakunlangan natijalar kampaniya ma'lumotlariga ular paydo bo'lishi bilanoq kiritildi, shuning uchun boshqa vazifalar bajarilayotgan paytda keyingi rejalashtirish va vazifa tanlashda ulardan foydalanish mumkin edi. Navbatga qabul qilish, ishchilarni ishga tushirish, parallellik cheklovlari va xatoliklarni qayta ishlash bo'yicha batafsil qoidalar C.8-qo'shimcha bo'limda tasvirlangan, boshqaruvchi ish jarayoni esa S1-algoritmda jamlangan.&lt;/p&gt;\n&lt;p&gt;AF2 baholashini qabul qilish standartlashtirilgan AF2 baholashi uchun generatsiya va qayta loyihalash bilan bir xil uchta ishchi GPU dan foydalandi, biroq alohida deterministik qabul qilish siyosatiga amal qildi. Agar generatsiya vaqtida uchta majburiy malaka o'lchovidan biri yoki bir nechtasi hisoblanmagan bo'lsa, yaroqli tuzilmalarga ega dizaynlar ushbu baholash uchun munosib deb topildi (1e-rasm). Oldindan belgilangan deterministik boshqaruvchi qoidalari qaysi munosib dizaynlar baholanishini va qaysi tartibda bajarilishini aniqladi. AF2 baholashini talab qiladigan har bir yo'nalish uchun dastlab to'rtagacha dizayn baholanishi mumkin edi. Joriy limit doirasidagi barcha baholashlar natijalari olingandan so'ng, yig'indi limit ketma-ket ravishda 8, 16, 32 va 64 ta baholashgacha oshishi va keyin ikki baravar ko'payishda davom etishi mumkin edi, faqat yo'nalish oldingi limit chegarasiga nisbatan yaxshilanish belgilarini ko'rsatgandagina. Yaxshilanish deganda yo'nalishga tegishli yangi SU lar, yaqin qadamlar (near-miss) soni, malakali struktura klasterlari soni, malakali dizayn sifat ko'rsatkichlarining 25-persentili yoki medianasi yoxud manbaga xos yordamchi diagnostika bali oshishi tushunildi. Malakali dizayn sifat ko'rsatkichlari tuzilmaviy klaster bo'yicha eng yuqori ball olgan dizaynni saqlab qolgan holda uchta normallashtirilgan o'tish chegarasi asosida hisoblandi. Aniq ball ta'riflari, taqqoslash qoidalari, sig'im cheklovlari va bo'sh sig'im istisnosi C.4.3 va C.8.1-qo'shimcha bo'limlarda ko'rsatilgan.&lt;/p&gt;\n&lt;p&gt;Kampaniyani yakunlash va yakuniy nuqtalarni qayta tiklash quyidagicha bajarildi: ma'lumotlar–rejalashtirish–bajarish sikli oldindan belgilangan 48 soatlik kampaniya vaqt chegarasigacha ishledi; kampaniyalar kampaniya holati, yangi SU larning yo'qligi yoki allaqachon olingan SU lar soni asosida yakunlanmadi. Boshqaruvchi siklning har bir o'tishidan oldin vaqt chegarasini tekshirdi; allaqachon bajarilayotgan o'tishning yakunlanishiga ruxsat berildi. O'chirish vaqtida har bir ishlayotgan vazifaga tugatish uchun 600 sekundgacha vaqt berildi. Yakunlangan vazifalar natijalari tahlil qilindi. Bajarish to'xtatilgandan so'ng, malaka mezonlari yaroqli tuzilmaga va barcha uchta majburiy malaka o'lchoviga ega bo'lgan chiqishlar uchun arxivdagi yakuniy ResultRecord yozuvlariga, jumladan o'chirish paytida tiklangan har qanday shunday chiqishlarga nisbatan qayta qo'llanildi. Foldseek TM0.6 klasterizatsiyasi malakadan o'tgan dizaynlar uchun qayta hisoblandi. Batafsil o'chirish, yakuniy nuqtaga kiritish va klasterizatsiya qoidalari C.8.3, B.3 va B.2-qo'shimcha bo'limlarda keltirilgan.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 1.&lt;/strong&gt; T-REX va bazaviy usullar uchun oqsillarni bog'lovchi dizayn natijalarining o'tkazish qobiliyati&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Rejalashtiruvchi&lt;/th&gt;\n&lt;th&gt;LLM&lt;/th&gt;\n&lt;th&gt;Qisqartirilgan EvidenceSummary; kampaniya arxivining faol yoki so'nggi HypothesisCards'lari; mavjud harakat oilalari va ruxsat etilgan sozlamalar.&lt;/th&gt;\n&lt;th&gt;Dalillarga bog'langan gipotezalar, keyingi sinovlar va bashorat qilingan o'lchov o'zgarishlari bilan HypothesisCards.&lt;/th&gt;\n&lt;th&gt;C.5.2–C.5.3&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Hit throughput is reported as the number of structurally unique hits per GPU-hour under a total 144 H100 worker GPU-hour budget.Hits are designs that pass the prespecified in silico criteria and are clustered with Foldseek at a TM-score threshold of 0.6.Gain columns report the T-REX ratio relative to PUCT and the highest-throughput generator-only (GO) baseline for each target.𝜖-gr., 𝜖-greedy; CX, Complexa-only; BC, BindCraft-only; BG, BoltzGen-only.Bold and underline indicate the highest and second-highest throughput, respectively, for each target.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"46-dalillar-xulosasini-tuzish-va-hosilaviy-olchovlar-c4evidencesummary-construction-and-derived-measures\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#46-dalillar-xulosasini-tuzish-va-hosilaviy-olchovlar-c4evidencesummary-construction-and-derived-measures\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.6. Dalillar xulosasini tuzish va hosilaviy o'lchovlar (C.4.EvidenceSummary construction and derived measures)&lt;/span&gt;&lt;/a&gt;4.6. Dalillar xulosasini tuzish va hosilaviy o'lchovlar (C.4.EvidenceSummary construction and derived measures)&lt;/h4&gt;\n&lt;p&gt;Har bir rejalashtirish yangilanishida boshqaruvchi arxivlangan natijalarni navbatdagi va ishlayotgan vazifalar, AF2 baholashini kutayotgan dizaynlar hamda mavjud ishchi sig'imi bilan birlashtirib, EvidenceSummary yaratadi. Unda yig'indi malaka va onlayn SU sonlari, so'nggi natijalar hamda yo'nalish natijalari va xarajatlari aks ettiriladi (S1b-rasm). C.5.2-bo'limda LLM larga beriladigan kichikroq kirish ma'lumotlari tavsiflangan; D.2.1-bo'limda JSON misoli keltirilgan.&lt;/p&gt;\n&lt;h4 id=\"c41-evidence-contents-and-record-windows\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c41-evidence-contents-and-record-windows\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.4.1. Evidence contents and record windows&lt;/span&gt;&lt;/a&gt;C.4.1. Evidence contents and record windows&lt;/h4&gt;\n&lt;p&gt;O'lchovlarni baholash uchun median qiymatlar, malaka chegaralarigacha bo'lgan masofalar, shuningdek muvaffaqiyatli, muvaffaqiyatga yaqin (near-pass) va muvaffaqiyatsiz natijalar soni qo'llaniladi. Qattiq malaka talabi strict deb belgilanadi. Foldseek TM0.6 onlayn tayinlashlari va takrorlanish ko'rsatkichlari klasterlanish holati va qamrovini o'z ichiga oladi. Mavjudlik metrikalari ($ ext{metric_availability}$) ma'lumotlar mavjudligini qayd etadi, bunda yetishmayotgan qiymatlar to'ldirilmaydi va xato sifatida baholanmaydi. Kümülatif xulosalar barcha kuzatilgan natijalardan foydalanadi, so'nggi malaka xulosalari va mezon kombinatsiyalari esa oxirgi 60 ta natija yozuvlarini (ResultRecords) tahlil qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Foldseek va pLDDT — oqsillar strukturasini tahlil qilish vositalari va metriklari bo'lib, ular 3D tuzilmalarni tezkor qidirish hamda AlphaFold prognozlarining aniqligini baholash uchun xizmat qiladi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;3–6 ta grafik protsessorli oyna (worker-GPU-h) umumiy hisoblangan narx belgilangan miqdorga yetguncha yozuvlarni eng yangisidan boshlab teskari tartibda tanlaydi. So'nggi takrorlanish ulushi &lt;span class=\"yfm-latex\" data-content=\"f_%7B%20ext%7Bdup%7D%7D%20%3D%201%20-%20%5Cfrac%7BN_%7B%20ext%7Bclusters%7D%7D%7D%7BN_%7B%20ext%7Bassigned%7D%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; formulasi bo'yicha hisoblanadi, bunda Nassigned &amp;gt; 0 oxirgi 60 ta yozuv orasida Foldseek TM0.6 klasteriga ega yozuvlarni, Nclusters esa ularning alohida klasterlari sonini bildiradi. Defitsit o'lchovning malaka chegarasidan qancha masofaga qolganini ko'rsatadi. Muvaffaqiyatga yaqin natijalar uchun ruxsat etilgan chekinishlar 5 pLDDT punktini, 0.05 normallashtirilgan iPAE va 0.3 Å scRMSD qiymatlarini tashkil etadi.&lt;/p&gt;\n&lt;p&gt;Metodlar xulosalari oila darajasidagi urinishlar, yakunlar, xatolar va xarajatlarni birlashtirgan holda samarasiz yondashuvlarni aniqlaydi. So'nggi tezliklar oxirgi 60 ta natija yozuvidagi yangi muvaffaqiyat birliklari (SU) o'sishi asosida hisoblanadi. Ilgari sinovdan o'tgan konfiguratsiyalar natijalarni harakat turi va natija bo'yicha guruhlaydi, strategiya xulosalari esa kelajakdagi rejalashtirish sikllarida qayta foydalanish uchun har bir yondashuv tarixi, xarajatlar va xatolarni saqlab qoladi.&lt;/p&gt;\n&lt;h4 id=\"c42-onlayn-su-taqsimoti-va-hisob-kitoblarni-hisobga-olish\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c42-onlayn-su-taqsimoti-va-hisob-kitoblarni-hisobga-olish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.4.2. Onlayn SU taqsimoti va hisob-kitoblarni hisobga olish&lt;/span&gt;&lt;/a&gt;C.4.2. Onlayn SU taqsimoti va hisob-kitoblarni hisobga olish&lt;/h4&gt;\n&lt;p&gt;Routeattributionandcost moduli vazifalarni C.2.2-bo'limga muvofiq guruhlaydi. Standardlashtirilgan AF2 baholashi o'zining kirish ma'quliyatli ma'lumotlarini ishlab chiqqan generatsiya yoki dizaynni o'zgartirish yo'nalishiga biriktiriladi. Har bir malakali onlayn klaster arxiv tartibida o'zining birinchi malakali a'zosini keltirib chiqargan yo'nalishga aniq bitta hisob-kitob birligini (SU) qo'shadi. Boshqa yo'nalishlar qo'shimcha SU kreditisiz malakali a'zolarni qo'shishi mumkin. Yakuniy taqsimot belgilangan vakil obyektini yaratgan vazifaga ergashadi (B.2-bo'lim). Yo'nalish narxi generatsiya yoki qayta loyihalash, talab qilinadigan baholash va ajdodlar dizaynining qayd etilgan xarajatlarini o'z ichiga oladi. Har bir ajdod ResultRecord yo'nalish doirasida bir marta hisoblanadi, lekin bir nechta yo'nalishlarga tegishli bo'lishi mumkin, shuning uchun yo'nalish xarajatlarini qo'shish kampaniya narxini bermaydi. Ko'p chiqishli vazifaning narxi uning ResultRecords o'rtasida taqsimlanadi. So'nggi yo'nalish xarajatlari C.4.1-bo'limdagi butun kampaniya bo'ylab oynalardan foydalanadi, jumladan ajdodning yozuvi oynadan oldin kelgan bo'lsa ham zarur ajdod xarajatlarini qamrab oladi. S6-jadval ushbu xarajatlarni hisobot byudjetidan va boshqa onlayn vaqt o'lchovlaridan ajratib turadi.&lt;/p&gt;\n&lt;p&gt;S6-jadvalda asosiy hisobot byudjeti asosiy kampaniya uchun har bir ajratilgan ishchi bir marta hisobga olingan holda H = 144 soat H100 ishchi sloti soatiga sobit qilib belgilangan; yakuniy ko'rsatkich NSU/H sifatida aniqlanadi va alohida LLM serveri hamda birlamchi hisobga olishdagi kesishdan keyingi faqat generator baholashini istisno qiladi. O'tib ketgan ishchi slot vaqti sozlangan ishchi soniga ko'paytirilgan o'tgan kampaniya vaqti (worker_wall_gpu_h_total) bo'lib, bo'sh turgan slot vaqtini o'z ichiga oladi. Qayd etilgan ishchi narxi ResultRecord.gpu_h qiymatlarining yig'indisi (worker_gpu_h_total) bo'lib, ishlayotgan vazifalarning qisman natijalarini o'z ichiga oladi va yangi vaqt yangi ResultRecords o'rtasida taqsimlanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;SU hisoblash birliklari va xarajatlarni kuzatish oqsillarni yaratish hamda qayta loyihalash samaradorligini baholash imkonini beradi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;So'nggi tasniflovchi ta'siri oxirgi 60 ta natija oynasidagi yozuv xarajatlari yig'indisidir; mahsuldorlik stavkasi maxraji ushbu yig'indi va 0.5 GPU soatining kattasidir, bu so'nggi onlayn SU o'sishi bilan bog'langan (C.4.2-bo'lim). Yangi SU siz sarflangan vaqt qayd etilgan ishchi narxi va ishlayotgan ishchi slotlaridagi o'tgan vaqt yig'indisidan ma'lumotnoma narxini ayirib tashlash orqali aniqlanadi (manfiy qiymatlar nolga almashtiriladi). To'xtab qolish holatlarini eskalatsiya qilish va xavfsizlik choralari o'tgan real vaqtga emas, balki yangi SU bo'lmagan vaqtga asoslanadi.&lt;/p&gt;\n&lt;p&gt;Aniq yo'nalish narxi ishlab chiqarish, talab qilinadigan baholash va zaryadlangan qayta loyihalash ajdodlarini o'z ichiga oladi. So'nggi yo'nalish ko'rinishlari yo'nalishlarni birlashtirishdan oldin butun kampaniyaning 3 va 6 GPU soatlik natija oynalaridan foydalanadi, bu esa umumiy ajdodlar tufayli xarajatlarni yo'nalishlar bo'ylab qo'shib bo'lmas qilishini ta'minlaydi.&lt;/p&gt;\n&lt;p&gt;Yangi onlayn SU va klasterlash ishonchliligi oxirgi 60 ta ResultRecords'da birinchi marta namoyon bo'lgan onlayn SU'ni hisobga oladi. Har bir yangilanishda kontroller barcha yozuvlardagi va oynadan oldingi yozuvlardagi malakali klasterlarni sanab chiqadi, avvalgi yozuvlar sonini to'liq sondan ayiradi va joriy klaster tayinlashlaridan foydalanadi. Mahsuldor holat tasnifi Foldseek klasterlash statusi ok, qamrov ≥ 0.999, mavjud dublikat ulushi va bog'lovchi zanjiridan to'g'ri kompleks klasterlashga qaytish xabari yo'qligini talab qiladi. Qamrov — bu klasterlar soni emas, balki malakali tuzilmaviy klasterlarga tayinlangan malakali ResultRecords ulushi. C.4.5-bo'lim qo'shimcha shartlarni belgilaydi. Musofir yaqin o'tkazib yuborishlar soni ok yoki cached_ok statusli hamda qamrov ≥ 0.999 bo'lgan alohida klasterlashni talab qiladi, aks holda tasniflovchi nol oladi.&lt;/p&gt;\n&lt;p&gt;Yangi onlayn SU bo'lmagan vaqt arxiv tartibida natijalarni skanerlash orqali mos yozuvlar qiymatini qayta tiklash yordamida hisoblanadi. Agar malakali dizayn o'z klasterining birinchi a'zosi bo'lsa, mos yozuvlar shu natijagacha bo'lgan kümülatif qayd etilgan ishchi narxiga aylanadi (birinchi SU'dan oldin nol). Agar yangilanish avvalgidan ko'proq SU xabar qilsa, mos yozuvlar joriy qayd etilgan ishchi narxiga teng bo'ladi. To'xtab qolish vaqti signali joriy qayd etilgan ishchi narxi va ishlayotgan slotlardagi o'tgan vaqt yig'indisidan ushbu mos yozuvlar qiymatini ayirish orqali aniqlanadi.&lt;/p&gt;\n&lt;h4 id=\"c43-onlayn-sifat-va-yordamchi-korsatkichlar\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c43-onlayn-sifat-va-yordamchi-korsatkichlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.4.3. Onlayn sifat va yordamchi ko'rsatkichlar&lt;/span&gt;&lt;/a&gt;C.4.3. Onlayn sifat va yordamchi ko'rsatkichlar&lt;/h4&gt;\n&lt;p&gt;Malakali dizayn uchun o'lchovlar malaka chegaralaridan qanchalik ustu
