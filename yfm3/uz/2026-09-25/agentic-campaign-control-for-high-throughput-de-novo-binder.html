di. 5,400 s imtiyozli davrdan so‘ng, birinchi tekshiruv jarayonsizlik taymerini ishga tushiradi. Baholanadigan natijalar sonining ko‘payishi uni qayta o‘rnatadi; bunday jarayonsiz 5,400 s dan ortiq vaqt o‘tishi to‘xtatilishni keltirib chiqaradi. Faqat oraliq fayllarning o‘sishi taymerni qayta o‘rnatmaydi.&lt;/p&gt;\n&lt;p&gt;Takroriy muvaffaqiyatsiz oilalarni o‘chirib qo‘yish. Ota-onani talab qilmaydigan boshqa mavjud generatsiya oilasi qolgan bo‘lishi sharti bilan, natijalarida mos keladigan yoki chegaraga yaqin metrik dalillar bo‘lmagan holda, kamida ikkita taymut ResultRecord va 3 yozib olingan ishchi GPU-soatidan keyin oila mavjud bo‘lmagan holatga keladi. Standardlashtirilgan AF2 bundan mustasno. Kontroller o‘sha oiladan qo‘shimcha nomzodlarning paydo bo‘lishining oldini oladi va uning navbatdagi vazifalarini olib tashlaydi, ishlayotgan vazifalar эsa davom etaveradi. O‘chirib qo‘yishning o‘zi na taymutni, na yangi ishchi boshlanishini qayd etadi.&lt;/p&gt;\n&lt;p&gt;Kompaniya vaqti cheklovi va ishni to‘xtatish. Kontrollerning 48 soatlik chegarasi tsiklga kirishda tekshiriladi va agar kompaniya qayta boshlansa, saqlangan o‘tgan vaqtni o‘z ichiga oladi. Rejalashtirish va yuborish allaqachon boshlangan iteratsiya doirasida yakunlanishi mumkin. B.3-bo‘lim 144 H100 ishchi GPU-soatining alohida hisobot mahrajini belgilaydi. Ishni to‘xtatish vaqtida band ishchilar hovuz tartibida ko‘zdan kechiriladi va ularning har biri tugatish uchun 600 s gacha vaqt oladi. Normal yakunlanish keyingi ishchiga o‘tishdan oldin tahlil qilinadi; taymut natijalarni tiklashga urinish va keyin to‘xtatilishni keltirib chiqaradi. Rejalashtiruvchi barcha kutishlar tugashidan oldin taqsimotni yakunlashi mumkin. Yakuniy yakuniy nuqtani kiritish ushbu ishlash vaqti kutishlariga emas, balki B.3-bo‘limga amal qiladi.&lt;/p&gt;\n&lt;h4 id=\"c9-gipotezalr-bjicha-khajta-alokha\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c9-gipotezalr-bjicha-khajta-alokha\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.9. Гипотеzalр бўйича қайта алоқа&lt;/span&gt;&lt;/a&gt;C.9. Гипотеzalр бўйича қайта алоқа&lt;/h4&gt;\n&lt;p&gt;Гипотеzalр бўйича қайта алоқа HypothesisCards (C.5.2-бўлим) башорат қилган ўлчов ўзгаришларини синовдан ўтказади. Ҳар бир режалаштириш янгиланишининг охирида детерминистик қоидалар илгари фаол бўлган карточкаларни ўша янгиланиш бошида мавжуд натижалар асосида баҳолайди. Янгиланган карточкалар малака ёки SU кредитини ўзгартирмасдан, кейинги режалаштириш учун (C.3-бўлим) худди шу гипотеза идентификатори остида қўшилади. Бу тестлар сабаб-оқибат тушунтиришларини эмас, балки сонли башоратларни баҳолайди. D.2.2-бўлимдаги мисолда саккизта авлод малака олди, аммо ҳеч бири карточканинг аниқ башоратларини қўллаб-қувватламади.&lt;/p&gt;\n&lt;p&gt;Натижалар ва таққослаш асосий чизиқлари. Натижа уни келтириб чиқарган номзод иш орқали карточкага боғланади, бунга худди шу гипотеза ҳаволасини олиб юрувчи кейинги баҳолаш ишлари ҳам киради. Ҳар бир номзод барча башорат қилинган ўлчовлар учун умумий бўлган битта таққослаш асосий чизиғидан фойдаланади: карточканинг тартибга солинган асосий ҳаволалари орасидаги биринчи ҳал қилинадиган натижа, ундан кейин келтирилган далиллар. Кейинги баҳолаш бу асосий чизиқни мерос қилиб олиши мумкин; акс ҳолда, ёзиб олинган таққослаш асосий чизиғига эга бўлмаган иш ўз ижро этувчи ота-онасидан фойдаланади. Шундай қилиб, таққослаш асосий чизиғи ишга кириш сифатида берилган дизайн бўлиши шарт эмас. Ҳал қилинадиган асосий чизиққа эга бўлмаган натижалар чиқариб ташланади. Ҳисоблашлар ҳар бир янгиланишда худди шу далилни қайта қўшиш ўрнига, барча боғланган натижа–асосий чизиқ жуфтликларидан қайта ҳисобланади.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Таққослаш асосий чизиғи — режалаштириш жараёнида янги номзодларнинг яхшиланиши баҳоланадиган бошланғич референс натижадир.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Башорат қилинган яхшиланиш. dbaseline ва dresult ўлчовнинг манфий бўлмаган малака дефицитларини билдирсин (C.4.1-бўлим). dbaseline &amp;gt; 0.01 учун нисбий дефицитнинг қисқариши (dbaseline - dresult)/dbaseline карточкада кўрсатилган минимал талабга жавоб бериши керак. dbaseline ≤ 0.01 бўлганда, қўллаб-қувватлаш учун қулай йўналишда кўрсатилган абсолют яхшиланиш талаб қилинади, агар қиймат йўқ бўлса ёки нолга тенг бўлса, ушбу ўлчов бирликларида 1.0 га тенг деб олинади. 0.01 допуск ҳар бир ўлчов бирликларида қўлланилади.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Башорат қилинган ўзгаришлар талабларга мос келиб, ёмонлашув чекловлари бузилмаса ва иккита балл тўпланса, карточка қўллаб-қувватланган деб топилади.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Натижа даражасидаги далиллар. Натижа карточкани қўллаб-қувватлайди, қачонки ҳар бир башорат қилинган ўзгариш ўз яхшиланиш талабига жавоб берса ва ёмонлашаётган ўлчовлар бўйича текширилган бирор чеклов бузилмаса. Ҳар бир шундай чеклов учун асосий чизиқ дефицити ≤ 0.01 бўлиб қолиши керак; акс ҳолда, натижа дефицити асосий чизиқ дефицитини карточка рухсат этган нисбий ўсишнинг бир қўшилган қийматига кўпайтирилганидан ошмаслиги керак. Чеклов фақат асосий чизиқ ва натижа ўлчовлари мавжуд бўлгандагина текширилади. Етишмовчи таққослашни ўтказиб юбориш ўлчов сақланиб қолганини исботламайди. Натижа карточкага зид келади, қачонки ҳар бир башорат қилинган ўлчов асосий чизиқ дефицити &amp;gt; 0.01 ва нисбий дефицитнинг қисқариши ≤ 0.05 га эга бўлса. Қўллаб-қувватлаш ҳам, зиддият ҳам башорат қилинган йўналишнинг ўлчовнинг қулай йўналишига мос келишини талаб қилади. Етишмовчи башорат қилинган ўлчовлар ҳар қандай хулосани истисно қилади, битта истисно бундан мустасно: боғланган стандартизация қилинган AF2 натижаси тўлиқ малака қоидасидан ўтганда, етишмовчи асосий чизиқ ўлчови қўллаб-қувватланиши мумкин. Бошқа башорат қилинган ўзгаришлар ва сақланиш чегаралари ўз кучида қолади. Қўллаб-қувватлаш ва зиддият мустақил равишда ҳисобланади; ҳеч бир тестга жавоб бермайдиган натижалар нейтралдир.&lt;/p&gt;\n&lt;p&gt;Карточка ҳолати. Тақдим этилган кампанияларда ҳар бир қўллаб-қувватловчи натижа бир балл қўшди; икки балл карточкани қўллаб-қувватланган деб белгилади. Акс ҳолда, камида учта баҳоланган натижа–асосий чизиқ жуфтлиги ва ≥ 0.70 зиддият улуши уни рад этилган деб белгилади (зид келувчи сифатида архивланган). Нейтрал ёзувлар ушбу махражда қолади. Агар иккала чегара ҳам бажарилса, қўллаб-қувватлаш устунлик қилади. Ҳеч бир чегарага жавоб бермайдиган карточка режалаштириш янгиланишларида яратилгандан бошлаб ҳисобланадиган кўрсатилган яшаш муддатигача фаол қолади (сукут бўйича ўн; рухсат этилган оралиқ бирдан йигирмагача) ва кейин нафақага чиқарилади. Боғланган натижалари бўлмаган муддати ўтган карточкалар Планировшик чақируvidan олдин нафақага чиқарилади; бошқа ҳолат янгиланишлари юқоридаги янгиланиш охиридаги баҳолашга амал қилади. Қўллаб-қувватланган, рад этилган ва нафақага чиқарилган ҳолатлар тугалланган ҳисобланади.&lt;/p&gt;\n&lt;h4 id=\"d-khshimcha-eksperimentlar-va-kampaniya-talillari\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d-khshimcha-eksperimentlar-va-kampaniya-talillari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D. Қўшимча экспериментлар ва кампания таҳлиллари&lt;/span&gt;&lt;/a&gt;D. Қўшимча экспериментлар ва кампания таҳлиллари&lt;/h4&gt;\n&lt;p&gt;Қуйидаги таҳлиллар ўтказувчанлик ва мустаҳкамлик (2-расм), архивланган кейинги қарорлар (3-расм), тақсимлаш ва тиклаш (4-расм), шунингдек, пост-хок ишонч ва структур хилма-хилликни (2c ва 5-расмлар) текширади. Қўшимча мишенлардаги разведка кампаниялари ушбу асосий бенчмарк таҳлилларидан кейин келади.&lt;/p&gt;\n&lt;h4 id=\"d11-takrorij-kampaniyalar\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d11-takrorij-kampaniyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.1.1. Такрорий кампаниялар&lt;/span&gt;&lt;/a&gt;D.1.1. Такрорий кампаниялар&lt;/h4&gt;\n&lt;p&gt;CD45, SC2RBD ва CbAgo бўйича ҳар бир контроллер учун мустақил равишда ишga туширилган учта кампаниянинг барчасида ҳар бир T-REX кампанияси ўша мишендаги ҳар қандай PUCT ёки ε-greedy кампаниясига қараганда кўproq якуний TM0.6 SU ишлаб чиқарди (2d-расм; S9-жадвал). B.7-бўлим репликация дизайнини белгилайди. S3-расм онлайн T-REX траекторияларини кўрсатади ва якуний қайта ҳисобланган сонларни алоҳида белгилайди; кластерлашиш янгиланганда онлайн сонлар ўзгариши мумкин (C.4.2-бўлим).&lt;/p&gt;\n&lt;p&gt;CD45, SC2RBD ва CbAgo мишенлари учун Worker GPU-h бошидаги структуравий жиҳатдан фарқ қилувчи хитлар сони бўйича жадвал маълумотлари T-REX усулининг барча учта мустақил ишга туширишда (Run 0, Run 1, Run 2) PUCT ва ε-greedy усулларидан барқарор устунлигини кўрсатади. CD45 учун T-REX ўртача 2.104 ± 0.014 қийматга эришади, ҳолбуки PUCT 0.505 ± 0.331 ва ε-greedy 0.171 ± 0.034 кўрсатади. SC2RBD мишени учун кўрсаткичлар T-REX учун 0.370 ± 0.033, PUCT учун 0.266 ± 0.011 ва ε-greedy учун 0.153 ± 0.018 ни ташкил этади. CbAgo мишени учун T-REX 0.683 ± 0.125, PUCT 0.382 ± 0.039 ва ε-greedy 0.120 ± 0.077 ни намойиш этади.&lt;/p&gt;\n&lt;h4 id=\"d12-retrospektiv-nazorat-nuqtalari-va-kichikroq-budjetdagi-taqqoslashlar\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d12-retrospektiv-nazorat-nuqtalari-va-kichikroq-budjetdagi-taqqoslashlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.1.2. Retrospektiv nazorat nuqtalari va kichikroq budjetdagi taqqoslashlar&lt;/span&gt;&lt;/a&gt;D.1.2. Retrospektiv nazorat nuqtalari va kichikroq budjetdagi taqqoslashlar&lt;/h4&gt;\n&lt;p&gt;To'planish egri chiziqlarini tiklash uchun B.3-bo'limga kiritilgan dizaynlar bo'yicha yakuniy malaka va TM0.6 klaster tayinlashlaridan foydalanildi. Moslashuvchan egri chiziqlar har bir klasterni malakali a'zoni o'z ichiga olgan eng erta arxiv xulosasiga bog'laydi; faqat generator uchun mo'ljallangan egri chiziqlar S10-jadvalda ko'rsatilgan yakunlanish tadbirlariga tayanadi. Oxirgi xulosadan keyin kelib tushadigan PUCT HER2-AAV yozuvlari 144 ishchi-GPU-soat chegarasiga tegishli deb belgilanadi. Yakuniy gorizontal segment oxirgi belgilangan sonni klasterlar qo'shmasdan o'sha chegarada saqlab turadi. Bunday retrospektiv tiklangan egri chiziqlar onlayn klaster sonidan farq qilishi mumkin. Usullar bo'yicha qayd etilgan voqealar turlicha bo'lgani sababli, oraliq nazorat nuqtalari aniq o'zaro usul tugatilish vaqtlarini emas, balki to'planish jarayonini tavsiflaydi. B ishchi-GPU-soat nazorat nuqtasida N(B) miqdori B da yoki undan oldin voqea olgan yakuniy klasterlarni sanaydi, N(B)/B nisbati эsa nazorat nuqtasi tezligini beradi (S10-jadval). Klaster tayinlashlari o'zgarmas qoladi; bular mustaqil ravishda to'xtatilib B da yakunlangan kampaniyalar emas, balki 144 ishchi-GPU-soatgacha ishlatilgan kampaniyalardagi kuzatishlardir. 10 ishchi-GPU-soatda T-REX oltita nishonda eng katta songa ega bo'ldi va HER2-AAV bo'yicha faqat-BindCraft bilan durang o'ynadi; u 50, 100 va 144 ishchi-GPU-soatda barcha yettita nishonda yetakchilik qildi. Nishonlar bo'yicha T-REX/PUCT hisob nisbatlarining geometrik o'rtacha qiymatlari mos ravishda 3.94, 3.10, 2.73 va 2.43 ni tashkil etdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Nazorat nuqtalari (checkpoints) hisoblash resurslari sarflanishiga qarab algoritmlar unumdorligini vaqt o'tishi bilan baholash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bayes optimizatsiyasi bilan taqqoslash shuni ko'rsatdiki, 100 ishchi-GPU-soatda mustaqil to'xtatilgan SMAC3 kampaniyalari yettita nishon bo'yicha jami 329 ta yakuniy TM0.6 struktura birligini hosil qildi, holbuki T-REX ning 100 ishchi-GPU-soatlik retrospektiv nazorat nuqtalarida bu ko'rsatkich 1,108 tani tashkil etdi va T-REX har bir nishonda ustun keldi (S11-jadval). SMAC3 to'rt ishchida taxminan 25 soatdan keyin to'xtatildi (sozlash B.5.2-bo'limda), T-REX nazorat nuqtalari esa 144 ishchi-GPU-soatga rejalashtirilgan uch ishchili kampaniyalardan olingan. Ushbu solishtirish ishchi hisoblash hajmini tenglashtiradi, biroq T-REX ni 100 ishchi-GPU-soatda mustaqil to'xtatish natijasini oldindan ko'rsatmaydi.&lt;/p&gt;\n&lt;h4 id=\"d13-compute-accounting-sensitivity\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d13-compute-accounting-sensitivity\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.1.3. Compute accounting sensitivity&lt;/span&gt;&lt;/a&gt;D.1.3. Compute accounting sensitivity&lt;/h4&gt;\n&lt;p&gt;Tillar modeli (LLM) so‘rovlarining resurs va vaqt sarfi tahlili 3125 ta arxivlangan model chaqiruvini qamrab oldi. Umumiy oxirigacha kechikish vaqti 84533 soniyani (23,48 soat; o‘rtacha har bir chaqiruv uchun 27,05 soniya) tashkil etdi, bu 336 soatlik umumiy nominal kampaniya vaqtining (7 ta 48 soatlik kampaniya) 6,99%iga teng. LLM xizmat ko‘rsatishi alohida GPU da amalga oshirildi, ishchi jarayonlar esa davom etdi, shuning uchun bu qiymat kampaniya davomiyligining oshishini ham, navbatni to‘ldirishdagi kechikishlarni ham ko‘rsatmaydi. Ishchilar budjetining asosiy ta’rifi va yakuniy nuqtalarni kiritish qoidalari B.3-bo‘limda keltirilgan.&lt;/p&gt;\n&lt;p&gt;Birinchi sezgirlik tahlilida har bir kampaniyaning tiklangan ishchi vaqtiga to‘liq 48 soatlik LLM server zaxirasi qo‘shildi. Bu yettita kampaniya bo‘yicha jami 336 H100 GPU soatini tashkil etadi yoki umumiy chaqiruv kechikishidan 14,3 baravar ko‘p. Ushbu yondashuv uch ishchidan iborat ijro jarayonini saqlab qolgan holda, har bir T-REX kampaniyasiga taxminan 192 H100 GPU soatini yuklaydi. Shunga qaramay, T-REX ushbu hisob-kitob bo‘yicha ham barcha nishonlar bo‘yicha PUCT dan ustun keldi: TM0.6 SU da umumiy H100 GPU soatiga nisbatan 1,03 dan 3,27 baravargacha ustunlik kuzatildi, geometrik o‘rtacha qiymat 1,82 baravarni tashkil etdi (S12a-jadval).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SU (Success Unit) va geometrik o‘rtacha ko‘rsatkich — generatsiya muvaffaqiyati va metodning barcha testlardagi umumiy ustunligini belgilovchi mezonlar.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ikkinchi sezgirlik tahlilida to‘liq server to‘lovi saqlanib qoldi va har bir nishon uchun eng kuchli tuzatilgan bazaviy chiziqni tanlashdan oldin, barcha faqat generatorlardan iborat bazaviy chiziqlarga arxivdagi kesishuvdan keyingi AlphaFold2 (AF2) baholash vaqti qo‘shildi. Onlayn T-REX baholashi allaqachon ishchi vaqtiga kiritilgan edi; Complexa umumiy AF2 o‘lchovlarini jarayon ichida taqdim etdi va alohida kesishuvdan keyingi baholash xarajatlarini talab qilmadi. T-REX yana barcha nishonlar bo‘yicha peshqadam bo‘ldi (1,07–4,52 baravar; geometrik o‘rtacha 1,90 baravar; S12b-jadval). S12-jadvalda ko‘rsatilganidek, a qismidagi T-REX ko‘rsatkichlari, umumiy to‘lovlar va tuzatilgan stavkalar b qismiga ham tegishlidir.&lt;/p&gt;\n&lt;h4 id=\"a-full-llm-server-charge-versus-puct\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#a-full-llm-server-charge-versus-puct\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;a. Full LLM-server charge versus PUCT&lt;/span&gt;&lt;/a&gt;a. Full LLM-server charge versus PUCT&lt;/h4&gt;\n&lt;p&gt;CD45 nishoni uchun 143,8 SU, 191,8 ishchi GPU soati, jami 192,0 GPU soati va SU/total GPU-h nisbati 1,570 ni tashkil etdi. BetV1 uchun — 144,0 SU, 192,0 ishchi GPU soati, jami 192,0 GPU soati, nisbat 0,333. CbAgo uchun — 144,0 SU, 192,0 ishchi GPU soati, jami 192,0 GPU soati, nisbat 0,604. HER2-AAV uchun — 144,0 SU, 192,0 ishchi GPU soati, jami 192,0 GPU soati, nisbat 1,063. SC2RBD uchun — 144,0 SU, 192,0 ishchi GPU soati, jami 192,0 GPU soati, nisbat 0,286. PDL1 uchun — 143,8 SU, 191,8 ishchi GPU soati, jami 191,8 GPU soati, nisbat 2,513. IL7RA uchun — 144,0 SU, 192,0 ishchi GPU soati, jami 192,0 GPU soati, nisbat 1,245.&lt;/p&gt;\n&lt;p&gt;LLM server to‘lovitisiz PUCT usuli uchun CD45 da 143,7 SU, 0,480 total GPU-h va 3,27 stavka nisbati qayd etildi. BetV1 uchun — 143,9 SU, 0,336 o‘rniga 0,236 total GPU-h, nisbat 1,41. CbAgo uchun — 144,0 SU, 0,375 total GPU-h, nisbat 1,61. HER2-AAV uchun — 144,0 SU, 0,361 total GPU-h, nisbat 2,94. SC2RBD uchun — 144,0 SU, 0,278 total GPU-h, nisbat 1,03. PDL1 uchun — 143,6 SU, 1,623 total GPU-h, nisbat 1,55. IL7RA uchun — 144,0 SU, 0,660 total GPU-h, nisbat 1,89. O‘tkazuvchanlikning geometrik o‘rtacha nisbati 1,82 ni tashkil etdi.&lt;/p&gt;\n&lt;h4 id=\"b-full-server-charge-and-post-cutoff-baseline-evaluation-charge\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#b-full-server-charge-and-post-cutoff-baseline-evaluation-charge\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;b. Full server charge and post-cutoff baseline-evaluation charge&lt;/span&gt;&lt;/a&gt;b. Full server charge and post-cutoff baseline-evaluation charge&lt;/h4&gt;\n&lt;p&gt;Faqat generatorlardan iborat bazaviy chiziqlar uchun to‘liq server to‘lovi va kesishuvdan keyingi AF2 baholash xarajatlari qo‘shilganda quyidagi natijalar olindi. CD45 (Complexa-only) uchun bazaviy SU 0,000, kesishuvdan keyingi AF2 GPU vaqti 144,0 soat, jami 0,347 GPU-h, nisbat 4,52. BetV1 (Complexa-only) — 0,000 SU, 144,0 AF2 soati, 0,118 total GPU-h, nisbat 2,82. CbAgo (BindCraft-only) — 4,710 SU, 148,7 AF2 soati, 0,350 total GPU-h, nisbat 1,73. HER2-AAV (BindCraft-only) — 8,066 SU, 152,1 AF2 soati, 0,684 total GPU-h, nisbat 1,55. SC2RBD (BindCraft-only) — 1,234 SU, 145,2 AF2 soati, 0,151 total GPU-h, nisbat 1,89. PDL1 (Complexa-only) — 0,000 SU, 144,0 AF2 soati, 1,951 total GPU-h, nisbat 1,29. IL7RA (Complexa-only) — 0,000 SU, 144,0 AF2 soati, 1,160 total GPU-h, nisbat 1,07. Ushbu qism uchun o‘tkazuvchanlikning geometrik o‘rtacha nisbati 1,90 ga teng bo‘ldi.&lt;/p&gt;\n&lt;h4 id=\"d14-xilma-xillik-va-tanlov-chegaralariga-sezgirlik\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d14-xilma-xillik-va-tanlov-chegaralariga-sezgirlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.1.4. Xilma-xillik va tanlov chegaralariga sezgirlik&lt;/span&gt;&lt;/a&gt;D.1.4. Xilma-xillik va tanlov chegaralariga sezgirlik&lt;/h4&gt;\n&lt;p&gt;T-REX usuli MMseqs2 ketma-ketlikni 70% o'xshashlikda klasterlash va Foldseek strukturaviy klasterlashning TM0.5, TM0.6 hamda TM0.8 chegaralarida barcha yettita nishon bo'yicha eng yuqori klaster o'tkazish qobiliyatini saqlab qoldi (2b-rasm; S13 va S14-jadvallar). Ushbu tahlillarda B.2-bo'limdagi bir xil sifatli dizayn hovuzlari va klasterlash sozlamalaridan foydalanildi, bunda ketma-ketlikni klasterlash strukturaviy dublikatlarni yo'q qilishdan oldin qo'llaniladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Ketma-ketliklarni klasterlash va TM-ball bo'yicha strukturaviy filtrlash o'xshash oqsillarni guruhlash hamda istiqbolsiz variantlarni chiqarib tashlash imkonini beradi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Har bir nishon (CD45, BetV1, CbAgo, HER2-AAV, SC2RBD, PDL1 va IL7RA) hamda turli yondashuvlar (T-REX, PUCT, ε-greedy, Complexa-only, BindCraft-only va BoltzGen-only) uchun batafsil natijalar saralangan variantlar (Qualified), ketma-ketlik klasterlari soni (Seq.clusters), ish tezligi (Seq.clusters/worker) va GPU-soatlardagi resurs sarfini (GPU-h) aks ettiradi. Masalan, CD45 nishoni uchun T-REX 1 936 ta saralangan variantni har bir ishchiga 5.61 tezlikda hosil qilgan bo'lsa, PUCT 0.90, ε-greedy 0.44, Complexa-only 0.56, BindCraft-only 0.01, BoltzGen-only esa 0.15 GPU-h ko'rsatdi. PDL1 nishoni uchun T-REX 6 203 ta saralangan variant va 2 064 ta ketma-ketlik klasteriga 14.33 GPU-h sarflab erishdi, holbuki PUCT 5.38, ε-greedy 0.95, Complexa-only (2 897 variant, 6.44 GPU-h), BindCraft-only (2 033 variant, 2.77 GPU-h) va BoltzGen-only (1 412 variant, 1 326 klaster, 9.21 GPU-h) talab qildi. IL7RA uchun T-REX 1 178 ta variantni (3.69 GPU-h), PUCT 1.14, ε-greedy 0.52, Complexa-only (1 086 variant, 2.72 GPU-h), BindCraft-only (1 047 variant, 1.72 GPU-h) va BoltzGen-only 3.34 GPU-h natijasini ko'rsatdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;GPU-h kabi metrikalar hisoblash murakkabligini baholasa, TM0.5–TM0.8 parametrlari oqsil modellarining strukturaviy o'xshashligini o'lchaydi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Muqobil TM-ball chegaralari (TM0.5, TM0.6, TM0.8) yordamida o'tkazilgan tahlillar T-REX ning barqaror ustunligini ko'rsatdi. Xususan, CD45 uchun T-REX ko'rsatkichlari 1.389 (TM0.5), 2.090 (TM0.6) va 3.271 (TM0.8) tashkil etib, PUCT (0.326, 0.479, 0.604), ε-greedy (0.139, 0.188, 0.229), Complexa-only (0.257, 0.347, 0.486), BindCraft-only (barcha uch ostonada 0.014) va BoltzGen-only (0.028, 0.035, 0.104) natijalaridan oshib ketdi. BetV1 uchun T-REX 0.326, 0.444 va 0.542 qiymatlariga erishdi (PUCT uchun 0.188, 0.236, 0.250). CbAgo uchun T-REX qiymatlari 0.562, 0.806 va 1.042 bo'lib, PUCT (0.250, 0.375, 0.417) va boshqa yondashuvlardan ustun keldi. HER2-AAV uchun T-REX 0.951, 1.417 va 2.194 ko'rsatib, PUCT (0.306, 0.361, 0.389) hamda BindCraft-only (0.472, 0.722, 0.826) natijalaridan o'tdi. SC2RBD uchun T-REX 0.236, 0.382 va 0.535, PUCT esa 0.215, 0.278 va 0.326 qayd etdi. PDL1 uchun T-REX 1.875, 3.347 va 6.646 berib, PUCT (1.021, 1.618, 2.792), Complexa-only (1.090, 1.951, 4.111) va BoltzGen-only (0.486, 1.097, 4.014) ustidan ustunlik qildi. Nihoyat, IL7RA uchun T-REX 1.062, 1.660 va 2.653 qiymatlarini ko'rsatib, PUCT (0.465, 0.660, 0.833) va qolgan algoritmlarni ortda qoldirdi.&lt;/p&gt;\n&lt;p&gt;Tanlov chegaralariga sezgirlik tahlili TM0.6 chegarasidagi yakuniy klasterlarni o'zgarishsiz saqlab qoladi va tanlangan vakili &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D%20%5Cge%20%20au\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; shartini qanoatlantiradiganlarini saralab oladi (S4-rasm; B.2-bo'lim). Har bir vakil o'z klasteri ichida &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ni maximallashtiradi, shuning uchun saqlangan klaster barcha uchta kuchaytirilgan chegaraga javob beradigan kamida bitta dizaynni o'z ichiga oladi. Filtrlashdan keyin klaster a'zoligi qayta hisoblanmaydi. τ = 0 bo'lganda, saralangan hovuz asl qattiq scRMSD cheklovini saqlagan holda birlamchi miqdorni tiklaydi. 63 ta nishon-chegara birikmalaridan ($ au = 0, 0.05, \\dots, 0.40$) T-REX 50 tasida PUCT dan ustun keldi, o'nta holatda (jumladan, yettita noldan noldagi tenglik) durang qayd etdi va uchtasida har safar birta SU ga kamroq natija ko'rsatdi. Shunday qilib, o'tkazish qobiliyatidagi ustunlik sinovdan o'tgan ko'pchilik chegara kesimlarida saqlanib qoldi, kamroq klasterlar qolgani sababli esa durang va ortga qolish holatlari kuzatildi. Ushbu chegarani saqlash tahlili muqobil TM ostonalarida qayta klasterlashdan farq qiladi.&lt;/p&gt;\n&lt;h4 id=\"d21-arxivlangan-rejalashtirish-yangilanishidagi-dalillar\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d21-arxivlangan-rejalashtirish-yangilanishidagi-dalillar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.2.1. Arxivlangan rejalashtirish yangilanishidagi dalillar&lt;/span&gt;&lt;/a&gt;D.2.1. Arxivlangan rejalashtirish yangilanishidagi dalillar&lt;/h4&gt;\n&lt;p&gt;Ushbu misol arxivlangan dalillar asosida va LLM uchun qisqartirilgan kirish ma'lumotlari bilan HER2-AAV rejalashtirishning 6-yangilanishini ko'rsatadi, bunda yangilanish raqamlari vaqtni emas, balki rejalashtirish bosqichlarini bildiradi. JSON parchalarida maydon nomlari, ichki tuzilmalar va mantiqiy qiymatlar saqlangan, tasviriy taxalluslar ishlatilgan va o'lchovlar to'rt xonagacha yaxlitlangan.&lt;/p&gt;\n&lt;p&gt;Malaka oshirish va kutilayotgan baholash. Kampaniya davomida malakali dizaynlar yoki onlayn muvaffaqiyat birliklari (SU) bo'lmagan, ikkita chegaradosh klaster (near-miss) hamda low_evidence holati qayd etilgan. Muhokama qilinayotgan dizayn pLDDT (90.8924) va scRMSD (0.7215 Å) chegaralaridan muvaffaqiyatli o'tgan, biroq uning normallashtirilgan iPAE ko'rsatkichi 0.2397 ni tashkil etib, ruxsat etilgan chegaradan oshib ketgan. Keyinchalik til modeli scRMSD ni xato ravishda muvaffaqiyatsiz deb ta'riflagan, biroq malakalash jarayonida yozib olingan o'lchovlar ishlatilgan. Malakali hovuz klasterizatsiyasida tuzilmalar bo'lmagan (no_strict, nolinchi qoplash), chegaradosh klasterizatsiya esa yakunlangan (ok, qoplash 1.0). O'n oltita BoltzGen dizaynidan to'rttasi standartlashtirilgan AF2 bahosidan o'tgan, o'ntasi esa qabul qilish qoidalariga ko'ra baholanishni kutgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Normallashtirilgan iPAE (predicted aligned error) — oqsil domenlarining fazoviy joylashuvi aniqligini baholaydigan ko'rsatkich bo'lib, belgilangan chegaradan past qiymatlar majmuaning to'g'ri modellashtirilganini tasdiqlaydi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mezonlar xulosasi va strukturaviy takrorlanish. Har bir mezon yigirmata o'lchovni o'z ichiga olgan. pLDDT, normallashtirilgan iPAE va bog'lovchi scRMSD uchun muvaffaqiyatli/chegaradosh/muvaffaqiyatsiz natijalar soni mos ravishda 4/8/8, 0/5/15 va 8/2/10 ni tashkil etdi, medianalar esa 85.7853, 0.3446 va 2.2067 Å ga teng bo'ldi. Juftlashtirilgan pLDDT va iPAE ko'rsatkichlari bo'yicha ikkalasi ham muvaffaqiyatli 0 ta, ikkalasi ham muvaffaqiyatsiz 8 ta, biri muvaffaqiyatli boshqasi muvaffaqiyatsiz 0 ta va ikkalasi ham chegaradosh 1 ta qayd etildi. So'nggi klaster yozuvlari orasida takrorlanish koeffitsienti fdup = 0.75 ni tashkil etdi va eng yirik klaster yozuvlarning 20% ​​qismini o'z ichiga oldi.&lt;/p&gt;\n&lt;p&gt;Qayd etilgan natijalar va hisoblash resurslari. 36 ta ResultRecords yozuvlari 16 ta Complexa Beam natijasi, 16 ta BoltzGen natijasi va ok maqomidagi 4 ta standartlashtirilgan AF2 bahosidan iborat bo'ldi. Ularning sarflari mos ravishda 0.3216, 0.1362 va 0.0363 ishchi GPU-soatni tashkil etib, jami 0.4941 ishchi GPU-soatga yetdi. Uchta pending_children elementi faol vazifalarni bajarayotgan edi. Ishchi vaqti 1.0003 GPU-soatni, to'xtash vaqti signali esa 0.9673 GPU-soatni tashkil qildi, oltita yangilanish SU olmasdan o'tdi. Complexa Beam ikkala chegaradosh klasterga ham o'z hissasini qo'shdi. Barcha uchta malaka o'lchovlari Complexa Beam va AF2 uchun mavjud bo'lgan, lekin BoltzGen uchun mavjud emas edi. Complexa Beam retsepti 4 ta nur kengligi, 4 ta tarmoq va 4 ta namuna bilan sakkizta avlodni chegaradosh natija ostida guruhladi.&lt;/p&gt;\n&lt;p&gt;Bir kampaniya doirasida to'rt xil natija turi. Ushbu yozuvlar R. 1b dagi farqlarni ko'rsatadi: Complexa FK boshqaruv vazifasi natijalarsiz vaqt tugashi sababli to'xtadi; 12 ta BoltzGen dizayni baholashni kutdi; ko'rsatilgan Complexa Beam dizayni esa iPAE chegarasidan o'ta olmadi. 11 va 12-yangilanishlar orasida malakali dizaynlar soni 42 tadan 43 taga ko'paydi, onlayn SU lar soni esa to'rtligicha qoldi.&lt;/p&gt;\n&lt;p&gt;LLM uchun qisqartirilgan kirish ma'lumotlari. Quyidagi parcha kiritishni qisqartirish qoidalari yordamida tiklandi. Maqsad identifikatori tushirib qoldirildi, 36 ta ota-ona identifikatori hisoblagich va mavjudlik bayrog'iga aylantirildi, yig'indi maqsadli maydonlar objective_summary ga guruhlandi. Ota-ona identifikatorlari nomzodlarni yaratish uchun mavjud bo'lib qoldi, gipoteza kartochkalari va nazoratchi vazifalari alohida taqdim etildi.&lt;/p&gt;\n&lt;h4 id=\"d22-taklifdan-ijrogacha-va-qayta-aloqagacha\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d22-taklifdan-ijrogacha-va-qayta-aloqagacha\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.2.2. Taklifdan ijrogacha va qayta aloqagacha&lt;/span&gt;&lt;/a&gt;D.2.2. Taklifdan ijrogacha va qayta aloqagacha&lt;/h4&gt;\n&lt;p&gt;Jarayon D.2.1-bo‘limdagi 6-yangilanishdan boshlab bitta gipotezaning tanlanishi, bajarilishi va qayta aloqagacha bo‘lgan to‘liq yo‘lini kuzatib boradi. Arxivlar xom LLM javoblarini emas, balki bir xil tavsiflovchi taxalluslarni ishlatuvchi tuzilgan HypothesisCard va ActionCandidate maydonlarini o‘z ichiga oladi. Rejalashtiruvchi taklifida bitta karta normallashtirilgan iPAE va bog‘lovchi scRMSD ni kamaytirish hamda yuqori pLDDT ko‘rsatkichini saqlab qolishga qaratilgan Rescue testini taklif qildi, qolgan ikkita karta esa BindCraft va Complexa eng yaxshi n ta qidiruv strategiyalarini ilgari surdi.&lt;/p&gt;\n&lt;p&gt;Nomzodlarni qurish va validatsiya qilish bosqichida Check+Build moduli reward_i_ptm_weight parametrini olib tashladi, chunki interfeys o‘lchovlari orasidagi eng katta kuzatuvlar soni 20 ta bo‘lib, talab qilingan 32 tadan past edi. Qolgan sozlamalar oila mavjudligi, konfiguratsiya, ish hajmi va resurs tekshiruvlaridan muvaffaqiyatli o‘tdi. Tilga olingan dizayn taqqoslash uchun asosiy chiziq sifatida xizmat qildi, ammo ushbu generatsiya vazifasi uchun ota-ona strukturasi sifatida taqdim etilm usti.&lt;/p&gt;\n&lt;h4 id=\"ustuvorlik-va-navbat\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#ustuvorlik-va-navbat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ustuvorlik va navbat&lt;/span&gt;&lt;/a&gt;Ustuvorlik va navbat&lt;/h4&gt;\n&lt;p&gt;Nazoratchining ustuvorlik berish bosqichida Complexa Beam Rescue birinchi o‘rinni egalladi, uning ortidan BindCraft Explore va Complexa best-of-n Explore keldi. Nazoratchining 0.50 bo‘lgan ishonch darajasi shartli taqsimot chegaralarini faollashtirdi, biroq tuzatishdan keyin Rescue/Explore/eXploit uchun taklif qilingan ulushlar 0.40/0.60/0.00 darajasida qoldi va zaxira variantlar ishlatilmadi. Bu ko‘rsatkichlar GPU vaqtining ulushlari emas, balki keyingi ishga tushirishlarning maqsadli ulushlaridir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Rescue/Explore/eXploit nisbati rejalashtirish algoritmlarida istiqbolli g‘oyalarni saqlab qolish, yangi sohalarni o‘rganish va topilgan muvaffaqiyatli yechimlardan foydalanish o‘rtasidagi muvozanatni belgilaydi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Navbatga qabul qilish uchun bitta pozitsiya mavjud edi, garchi uchala ishchi ham vazifalarni bajarayotgan bo‘lsa ham. Sektor nazoratchining joriy reytingiga amal qildi va birinchi o‘rinni egallagan vazifani qabul qildi; qolgan ikkitasi tanlanmadi. Yozib olingan ishga tushirilgan holat navbatga qabul qilinganini bildiradi, bajarish esa alohida tasdiqlangan.&lt;/p&gt;\n&lt;h4 id=\"mustaqil-baholash-va-natijalar\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#mustaqil-baholash-va-natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mustaqil baholash va natijalar&lt;/span&gt;&lt;/a&gt;Mustaqil baholash va natijalar&lt;/h4&gt;\n&lt;p&gt;Mustaqil baholash va tasdiqlangan boshlash jarayonida xuddi shu yangilanishda baholash-qabul qilish qoidalari oldindan generatsiya qilingan BindCraft dizaynini standartlashtirilgan AF2 baholashi uchun qabul qildi. Dispetcherlik yozuvlari ushbu baholash va tanlangan Complexa Beam vazifasi boshlanish vaqtini tekshirishdan o‘tib, ishga tushganini tasdiqladi. 7-yangilanishda kampaniya BindCraft baholashidan birinchi malakali dizayn va onlayn SU (ish birligi) ni qayd etdi.&lt;/p&gt;\n&lt;p&gt;Kampaniya holati productive_duplicate bo‘lib, qayd etilgan xarajat jami 1.1468 ishchi GPU soatni tashkil etdi. Ushbu birinchi SU tanlangan Complexa vazifasidan kelib chiqmadi. BindCraft yo‘nalishi bitta standartlashtirilgan AF2 baholashiga ega bo‘lib, uning qiymati 0.3491 GPU soatni, umumiy va so‘nggi unumdorlik holatlari esa sog‘lom/mahsuldor bo‘lgan. Bitta malakali klaster bilan uning sifat bali medianasi va quyi kvartili bir xil bo‘lib, 0.3670 ni tashkil etdi, yordamchi diagnostik yaxshilanish bali esa 1.0 ga teng edi.&lt;/p&gt;\n&lt;h4 id=\"qayd-etilgan-natijalar-va-gipoteza-qaytaloq-aloqasi\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#qayd-etilgan-natijalar-va-gipoteza-qaytaloq-aloqasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayd etilgan natijalar va gipoteza qaytaloq aloqasi&lt;/span&gt;&lt;/a&gt;Qayd etilgan natijalar va gipoteza qaytaloq aloqasi&lt;/h4&gt;\n&lt;p&gt;Ishlab chiqaruvchi nomzod vazifasiga havolalar ok maqomiga ega 32 ta ResultRecord ni aniqladi, ulardan sakkiztasi barcha uchta malaka mezoniga javob berdi. Ularning yangilanish identifikatori natija kelishiga emas, balki ishni boshlashga qaratilgan. Bular vazifalar, SU va gipotezani qo‘llab-quvvatlash nuqtalaridan farq qiluvchi natijalar sonidir.&lt;/p&gt;\n&lt;p&gt;9-yangilanishda kartaning 32 ta baholangan avlodi, nol qo‘llab-quvvatlash nuqtasi va nol qarama-qarshilik nuqtasi bor edi. Malaka oshirish taqqoslash bazasiga nisbatan bashorat qilingan o‘zgarishlarni o‘rnata olmadi. Bazaviy scRMSD allaqachon o‘tgani va karta mutlaq yaxshilanish chegarasini ko‘rsatmagani sababli, qo‘llab-quvvatlash 0.7215 Å dan standart 1 Å kamayishni talab qildi — bu erishib bo‘lmaydigan o‘zgarish edi.&lt;/p&gt;\n&lt;p&gt;Allaqachon o‘tgan mezon, shuningdek, har bir bashoratni rad etishni talab qiluvchi qoida ostida qarama-qarshilik nuqtalarining paydo bo‘lishining oldini oldi. Karta faol qoldi va 10 yangilanishdan iborat umri tugagandan so‘ng 16-yangilanishda nafaqaga chiqdi.&lt;/p&gt;\n&lt;h4 id=\"d23-arxivlangan-qaror-izlari-va-oldingi-natijalardan-foydalanish\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d23-arxivlangan-qaror-izlari-va-oldingi-natijalardan-foydalanish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.2.3. Arxivlangan qaror izlari va oldingi natijalardan foydalanish&lt;/span&gt;&lt;/a&gt;D.2.3. Arxivlangan qaror izlari va oldingi natijalardan foydalanish&lt;/h4&gt;\n&lt;p&gt;3-rasmdagi uchta holat muvaffaqiyatsiz test, takroriy yaqin muvaffaqiyatsizliklar yoki ota-obyektga xos nosozliklar sababli o'tkazilgan qo'shimcha testlarni ko'rsatish uchun retrospektiv tarzda tanlab olindi. Bu yerda tasvirlangan har bir holat uchun mualliflar taklifni, nomzod ishni va ishga tushirish qarorini tasdiqlangan ish boshlanishi va keyingi natijalar bilan bog'ladilar. Malaka ko'rsatkichlari va ko'rsatilgan pLDDT, iPAE hamda scRMSD qiymatlari standartlashtirilgan AF2 yozuvlaridan olindi; onlayn TM0.6 SU o'sishlari bog'langan kampaniya xulosalaridan olingan. HER2-AAV va CbAgo panellari yo'nalish darajasidagi dalillar va natijalarni solishtiradi (3a, b-rasm), holbuki PDL1 to'g'ridan-to'g'ri ProteinMPNN ota-avlod chizig'iga ergashadi (3c-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;scRMSD va pLDDT — oqsil tuzilishining sifati metrikalari bo'lib, birinchisi oqsil skeletining fazoviy mosligini baholasa, ikkinchisi AlphaFold2 modelining lokal tuzilmani bashorat qilishdagi ishonchini (100 ballik shkala bo'yicha) o'lchaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Partiyaga mansublik va yo'nalish darajasidagi SU taqsimoti alohida baholandi: bitta ish bir nechta dizaynlarni keltirib chiqarishi mumkin va yo'nalish xulosasi bir nechta ishlarni o'z ichiga olishi mumkin. Vizualizatsiya qilish uchun chiqish komplekslari nishon bo'yicha tegishli dalil yoki ota-kompleksga qattiq tekislangan. Ko'rsatilgan PDL1 avlodi o'z ota-obyektidan 58 ta qoldiqdan 35 tasida farq qilgan va ota-obyektga nisbatan nishonga tekislangan Cα atomlarining rmsd (scRMSD) qiymati 0.714 Å ni tashkil etgan. Malaka scRMSD qiymati ham shunday nishonga asoslangan tekislashdan foydalanadi, lekin qayta loyihalashtirilgan avlod bilan ota-obyektni emas, balki generatsiya qilingan kompleksni uning AF2 bashorati bilan solishtiradi.&lt;/p&gt;\n&lt;p&gt;Kampaniya doirasida dalillarni qayta ishlatish yettita nishon bo'yicha baholandi. Ushbu retrospektiv tarzda tanlangan holatlar muvaffaqiyatsiz qayta ishlatishni o'z ichiga oladi va muvaffaqiyat darajasini baholamaydi. Hisob-kitoblar malakali dizaynlarni ish bilan bevosita bog'langan yakuniy Foldseek TM0.6 vakillaridan ajratib turadi; onlayn konfiguratsiya darajasidagi natijalar alohida aniqlanadi (C.4.2-bo'lim). Ko'rsatkichlar va dublikat ulushlari taklif paytida mavjud bo'lgan onlayn ma'lumotlarni tavsiflaydi (C.4-bo'lim). Kartochkani qo'llab-quvvatlash va rad etish sababli tushuntirishlarni emas, balki raqamli bashoratlarni baholaydi, ishdan chiqarish esa har ikkala topilmasiz kartochkaning ishlash muddatini tugatadi (C.9-bo'lim).&lt;/p&gt;\n&lt;p&gt;CD45: samarali yo'nalishni davom ettirish va uni Qutqarish (Rescue) uchun qayta ishlatish. Generatorning ichki mukofot vaznlari sozlangan Complexa yo'nalishi so'nggi 2.32 SU/GPU-soat tezlikka ega edi, standart yo'nalishda esa so'nggi SU yo'q edi va dublikat ulushi 0.81 ni tashkil etdi. Kontroller yozib olingan tozalash va interfeys bilan bog'liq vaznlarga ega mahsuldor Complexa Beam yo'nalishini davom ettirdi. Keyingi Rescue taklifi shu yo'nalish va vazn juftligini interfeys bilan cheklangan yaqin muvaffaqiyatsizlik uchun qo'llab, ushbu konfiguratsiya tegishli holat uchun foydali bo'lib qolishini tekshirdi. Ishlab chiqarish davom ettirilgan ish 27 ta malakali dizayn va uchta yakuniy vakilni berdi; keyingi Rescue ishi 11 ta malakali dizayn va bitta yakuniy vakilni keltirib chiqardi.&lt;/p&gt;\n&lt;p&gt;SC2RBD: samarali generator doirasida xilma-xillikni oshirish. Sakkizta qabul qilingan nativ dizaynni so'ragan BindCraft yo'nalishi 1.40 SU/GPU-soat bergandi, ammo barcha so'nggi dizaynlar bitta struktura klasterida joylashgan edi. O'n oltita qabul qilingan nativ dizaynni so'ragan yo'nalish keyinchalik to'rtta klasterda to'rtta SU berdi. Taklif etilgan test so'ralgan qabul qilingan nativ dizaynlar sonini sakkiztadan o'n oltitaga oshirdi, shu bilan birga interfeys vazn konfiguratsiyasini saqlab qoldi va torroq yo'nalish yana ortiqcha bo'lib qolgandan keyin ushbu konfiguratsiyani qayta ishlatdi. Dastlabki ish 19 ta malakali avlod va uchta yakuniy vakilni berdi; keyingi takrorlash 10 ta malakali avlod va bitta yakuniy vakilni keltirib chiqardi.&lt;/p&gt;\n&lt;p&gt;PDL1: o'rta darajadagi namuna olish sozlamasini sinovdan o'tkazish. Skeletni namuna olish shovqini qiymati 0.30 eng yuqori so'nggi ko'rsatkichga (6.36 SU/GPU-soat) ega edi, lekin dublikat ulushi 0.84 edi. 0.20 qiymati pastroq unumdorlik va katta struktura dublikatsiyasini ko'rsatdi, sinovdan o'tkazilgan 0.40 konfiguratsiyasi esa kamaytirilgan unumdorlikka ega edi. Kontroller unumdorlik va diversifikatsiya o'rtasidagi mumkin bo'lgan kelishuvni o'rganish uchun boshqa yo'nalish sozlamalarini saqlab qolgan holda, ruxsat etilgan chegaralar ichida 0.35 qiymatini sinab ko'rdi. Ish 30 ta malakali dizayn va beshta yakuniy vakilni berdi.&lt;/p&gt;\n&lt;p&gt;HER2-AAV: muvaffaqiyatsiz testdan keyin gipotezani qayta ko'rib chiqish. Complexa'ning FK yo'nalishi bo'yicha nativ metrikalari yuqori interfeys ishonchini (median ipTM 0.77), lekin pastroq fold ishonchini (median pLDDT 83.4) ko'rsatdi. Avvalgi pLDDT mukofot vazni testi malakali dizyanslarni bermadi va uning kartochkasi rad etildi. Keyingi taklif FK yo'nalishini saqlab qolgan holda ketma-ketlik galallyusinatsiyasiga o'tish orqali ketma-ketlik va skelet mosligini sinab ko'rdi (3a-rasm). Beshta dizayn malakaga ega bo'ldi. Xuddi shu yo'nalish va konfiguratsiya uchun birinchi natijalar xulosasi uchta onlayn SU haqida xabar berdi; bu ko'rsatkich alohida ishga tegishli emas. Teskari aloqa barcha 32 ta baholanadigan dizaynni malakadan farq qiladigan kartochkaga xos yaxshilash va saqlash testlari ostida qo'llab-quvvatlash sifatida hisobga oldi.&lt;/p&gt;\n&lt;p&gt;BetV1: avvalgi struktura xilma-xilligiga ega generatorga qaytish. Complexa dublikatlarga boy bo'lib qolgandi. BindCraft oldin kattaroq struktura xilma-xilligi bilan 33 ta SU ishlab chiqargan edi, garchi u so'nggi oynada hech qanday mahsulot bermagan bo'lsa ham. Kontroller boshqa generator oilasi yangilikni tiklay olishini tekshirish uchun sakkizta qabul qilingan nativ dizaynni so'ragan va ijobiy spiral, ipTM hamda pLDDT vaznlaridan foydalangan holda BindCraft'ga qaytdi. Ish 17 ta malakali dizayn va ikkita yakuniy vakilni berdi. Uning gipoteza kartochkasi ishlash muddati chegarasida yopildi.&lt;/p&gt;\n&lt;p&gt;BetV1: oldingi konfiguratsiyani muvaffaqiyatsiz qayta ishlatish. Interfeys ishonchi Qutqarish taklifi malakali dizaynlarni ishlab chiqargan oldingi konfiguratsiyaga havola qildi. Kontroller boshqa yaqin muvaffaqiyatsizlik uchun ketma-ketlik galallyusinatsiyasi, ruxsat etilgan maksimal interfeys ishonchi mukofot vazni va skeletni namuna olish shovqini 0.50 bo'lgan Complexa Beam'ni qayta ishlatdi. Bog'langan 16 ta dizayndan hech biri malakadan o'tmadi. Gipoteza kartochkasi ishlash muddati chegarasida yopildi. Shunday qilib, avval mahsuldor bo'lgan konfiguratsiyani qayta ishlatish malakani kafolatlamadi.&lt;/p&gt;\n&lt;p&gt;CbAgo: eng yuqori unumdorlikka ega faol yo'nalishni takrorlash. Salbiy iPAE mukofot vazniga ega FK yo'nalishi faol konfiguratsiyalar orasida eng yuqori so'nggi tezlikka (2.72 SU/GPU-soat) ega edi va ilgari yuqori ulushda malakali dizaynlarni bergan edi. Kontroller ushbu yo'nalishni struktura klasterlarini qo'shishda davom etishini tekshirish uchun yozib olingan tozalash va interfeys bilan bog'liq vaznlari bilan qayta ishga tushirdi. 3b-rasmdagidan farq qiladigan ushbu ish sakkiz ta malakali dizayn va bitta yakuniy vakilni keltirib chiqardi.&lt;/p&gt;\n&lt;p&gt;IL7RA: yuqori dublikat ulushiga qaramay davom etayotgan ishlab chiqarish. BindCraft 1.46 SU/GPU-h o'tkazish qobiliyatini va 0.80 dublikat ulushi sharoitida 57 SU kümülatif onlayn hisobini ko'rsatdi. Boshqaruvchi boshqa vazifalar muqobillarni sinovdan o'tkazayotgan bir paytda, ikkita the native qabul qilingan dizaynni so'rab yo'nalishni davom ettirdi. Ikkala bog'langan dizayn malakadan o'tdi va kartaning sonli bashoratlarini qo'llab-quvvatladi.&lt;/p&gt;\n&lt;h4 id=\"d3-boshqaruvchi-xatti-harakati-va-aralashuvi-d31-llm-dan-foydalanish-va-interfeys-tekshiruvlari\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d3-boshqaruvchi-xatti-harakati-va-aralashuvi-d31-llm-dan-foydalanish-va-interfeys-tekshiruvlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.3. Boshqaruvchi xatti-harakati va aralashuvi D.3.1. LLM dan foydalanish va interfeys tekshiruvlari&lt;/span&gt;&lt;/a&gt;D.3. Boshqaruvchi xatti-harakati va aralashuvi D.3.1. LLM dan foydalanish va interfeys tekshiruvlari&lt;/h4&gt;\n&lt;p&gt;Model chaqiruvlari va chiqishni validatsiya qilish. Ettita asosiy kampaniyada 3,125 ta LLM chaqiruvi qayd etildi: 1,719 ta Rejalashtiruvchi (Planner) va 1,406 ta Nazoratchi (Supervisor) chaqiruvlari (S15-jadval, A-qism). Nazoratchining yettita javobi tuzilmali chiqish validatsiyasidan o'ta olmadi, bu barcha model chaqiruvlarining 0.22% ini tashkil qiladi. Barcha yettita javob JSON sifatida tahlil qilindi, ammo oltitasi ruxsat etilgan to'plamdan tashqaridagi dalillarga havola qildi va bittasi yaroqsiz resurs sinfidan foydalandi. Ushbu rad etilgan javoblar deterministik zaxira o'tishini (fallback) keltirib chiqardi; C.5.2 va C.7.1-bo'limlar validatsiya va javobni qayta ishlashni tasvirlaydi.&lt;/p&gt;\n&lt;p&gt;Tanlov yo'llari va tasdiqlangan boshlanishlar. Tanlash vaqtida model chaqiruvini validatsiya qilish va zaxira o'tishi turli maxrajlarga ega. Mualliflar Nazoratchining qaror yozuvlaridagi noyob rejalashtirish yangilanishlarini sanab o'tdilar va har bir tasdiqlangan generatsiya yoki qayta loyihalash boshlanishini LaunchDecision orqali tanlovchi yangilanishga bog'ladilar. 1,719 ta yangilanishdan 1,398 tasi joriy Nazoratchi nomzodlar reytingidan foydalangan va 321 tasi (18.7%) zaxira variantidan foydalangan. Bularga Nazoratchi chaqiruvi uchun gipoteza yoki nomzodlarsiz 313 ta yangilanish, rad etilgan Nazoratchi javoblari bo'lgan yettitasi va yaroqli Nazoratchi javobiga qaramay bo'sh Rejalashtiruvchi karta ro'yxatidan zaxira sababini olib yurgan bittasi kiradi. Bu ko'rsatkichlarga hech qanday generatsiya yoki qayta loyihalash ishini boshlamagan yangilanishlar ham kiradi. Barcha 1,454 ta generatsiya yoki qayta loyihalash boshlanishlari qayd etilgan tanlovga bog'landi: 1,446 tasi Nazoratchi reytingidan foydalanadigan yangilanishlarga va sakkiztasi (0.55%) zaxira variantiga. Alohida qabul qilingan 3,160 ta AF2 boshlanishlari ushbu maxrajdan chiqarib tashlandi. Tanlov yo'li LLM ishni taklif qilganini isbotlamaydi: qat'iy qurilish qoidalari har qanday yo'lga nomzodlarni qo'shishi mumkin (C.6 va C.7-bo'limlar).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Chiqishni validatsiya qilish model javoblarining qat'iy texnik talablarga (masalan, JSON sxemalariga) muvofiqligini tekshiradi, zaxira mexanizmi esa LLM xatosi paytida dasturlashtirilgan qoidalarni avtomatik ishga tushiradi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Nazorat qilinadigan interfeys tekshiruvlari. Rejalashtiruvchi sinovlari beshta sintetik dalil vaziyatidan foydalandi: samarali ish, muvaffaqiyatga yaqin natijalarning to'planishi (near misses), turg'unlik (stall), noaniq dalillar va malakali, ammo tuzilmaviy ortiqcha chiqish. Nazoratchi sinovlari noaniq dalillar bundan mustasno, har bir rol uchun har bir vaziyatga beshta chaqiruvdan iborat xuddi shu vaziyatlardan foydalandi. Tekshiruvlar yaroqli tahlil qilingan chiqishlarni talab qildi; normallashtirilgan Nazoratchi taqsimot ulushlari ham holatga xos kutishlarga javob berishi kerak edi: samarali rejim, X ≥ 0.45 va E ≤ 0.30; muvaffaqiyatga yaqin natijalar ko'p bo'lganda, R ≥ 0.40; turg'unlik, E ≥ 0.25 va X ≤ 0.45; tuzilmaviy ortiqcha chiqish, E ≤ 0.25. Chiqishning yaroqliligi va taqsimoti bo'yicha barcha tekshiruvlar muvaffaqiyatli o'tdi (S15-jadval, B-qism).&lt;/p&gt;\n&lt;p&gt;Takroriylik va tanlanma sezgirligi testlari bitta sobit samarali dalil holatidan va beshta nomzod vazifadan foydalandi: ikkita ekspluatatsiya (eXploit), ikkita qutqarish (Rescue) va bitta tadqiqot (Explore). Har bir test takroriylikni tekshirish uchun 0 haroratda va tanlanma sezgirligini baholash uchun 0.05 qadam bilan 0.00 dan 0.45 gacha bo'lgan haroratlarda o'nta Nazoratchi chaqiruvini amalga oshirdi. Har bir test doirasida yaroqli javoblarning barcha juftliklari ustuvorliklar doirasidagi birinchi o'rinni egallagan nomzodlarning mos kelishi, Kendell korrelyatsiyasi va taqsimot ulushlarining absolyut farqlari yig'indisi yordamida taqqoslandi (S15-jadval, B-qism). Namuna olish seriyasidagi uchta javob bitta Rescue nomzodini o'tkazib yubordi, shuning uchun keltirilgan mos kelish to'liq reytinglarning bir xilligini isbotlamaydi. Ushbu tekshiruvlar sinovdan o'tgan kirish ma'lumotlari uchun chiqishning yaroqliligi va takroriyligini baholaydi, tushuntirishlarni tasdiqlamaydi va biologik aniqlikni, butun kampaniya bo'ylab ishonchlilikni yoki LLM mulohazalarining sababiy foydasini o'rnatmaydi. S15-jadval LLM chaqiruvlari va nazorat qilinadigan interfeys tekshiruvlarini ko'rsatadi. A-qism Rejalashtiruvchining yaroqli chekinishlarini o'z ichiga olgan holda model chaqiruvlarini hisoblaydi, ammo o'tkazib yuborilgan chaqiruvlar va deterministik maslahat yozuvlarini istisno qiladi. B-qism sintetik kirish ma'lumotlaridan foydalanadi. Mos kelish bir xil birinchi o'rindagi nomzodga ega bo'lgan ustuvorliklar doirasidagi juftlik taqqoslashlarining ulushidir. Kendell korrelyatsiyasi kamida ikkita vazifaga ega bir xil nomzodlar to'plamini talab qiladi. Taqsimot farqi R/E/X ulushlari bo'yicha absolyut farqlar yig'indisidir. Yaroqsiz yoki mavjud bo'lmagan vazifalarni sobit tarzda qayta ishlash C.5.2, C.6 va C.8.2-bo'limlarda tasvirlangan.&lt;/p&gt;\n&lt;h4 id=\"a-model-chaqiruvlari-va-tuzilmaviy-chiqishni-validatsiya-qilish\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#a-model-chaqiruvlari-va-tuzilmaviy-chiqishni-validatsiya-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;A. Model chaqiruvlari va tuzilmaviy chiqishni validatsiya qilish&lt;/span&gt;&lt;/a&gt;A. Model chaqiruvlari va tuzilmaviy chiqishni validatsiya qilish&lt;/h4&gt;\n&lt;p&gt;Maqsadli model chaqiruvlari: Rejalashtiruvchi, Nazoratchi, Validatsiya xatolari (CD45, BetV1, CbAgo, HER2-AAV, SC2RBD, PDL1, IL7RA). Jami 3,125 ta chaqiruv: 1,719 tasi Rejalashtiruvchida va 1,406 tasi Nazoratchida (0.22%). Model chaqiruvlari soniga Rejalashtiruvchining 201 ta yaroqli chekinishi kiradi. Archivalarda shuningdek, Nazoratchining 313 ta o'tkazib yuborilgan chaqiruvi va ushbu hisobdan chiqarib tashlangan 1,517 ta deterministik maslahat yozuvlari mavjud. Model chaqiruvlari 114,105,382 ta o'qish va 4,430,504 ta yozish tokenidan foydalandi. Kechikish (latency) va resurslarni hisobga olish sezgirligi D.1.3-bo'limda va S12-jadvalda keltirilgan.&lt;/p&gt;\n&lt;h4 id=\"b-nazorat-qilinadigan-interfeys-tekshiruvlari\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#b-nazorat-qilinadigan-interfeys-tekshiruvlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;B. Nazorat qilinadigan interfeys tekshiruvlari&lt;/span&gt;&lt;/a&gt;B. Nazorat qilinadigan interfeys tekshiruvlari&lt;/h4&gt;\n&lt;p&gt;Dalil tekshiruvi, natija: Standart holatlar (beshta Rejalashtiruvchi va to'rtta Nazoratchi holati, har biri besh martadan takrorlangan) — Rejalashtiruvchi 25/25 va Nazoratchi 20/20 yaroqli; barcha holatga xos taqsimot tekshiruvlari muvaffaqiyatli o'tdi. Takroriylik (bitta sobit Nazoratchi holati, 0 haroratda o'nta chaqiruv) — 10/10 yaroqli; ustuvorliklar doirasidagi birinchi nomzodlarning mos kelishi va minimal mos keluvchi Kendell korrelyatsiyasi 1.00 ni tashkil etdi; taqsimot ulushlarining maksimal yig'indi farqi 0.00 ga teng bo'ldi. Tanlanma sezgirligi (0.00–0.45 haroratlardagi xuddi shu holat) — 10/10 yaroqli; ustuvorliklar doirasidagi birinchi nomzodlarning mos kelishi va minimal mos keluvchi Kendell korrelyatsiyasi 1.00 ni tashkil etdi; taqsimot ulushlarining maksimal yig'indi farqi 0.10 ga teng bo'ldi.&lt;/p&gt;\n&lt;h4 id=\"kampaniya-boylab-taqsimot-va-harakatlar-fazosidan-amaldagi-foydalanish\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#kampaniya-boylab-taqsimot-va-harakatlar-fazosidan-amaldagi-foydalanish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kampaniya bo'ylab taqsimot va harakatlar fazosidan amaldagi foydalanish&lt;/span&gt;&lt;/a&gt;Kampaniya bo'ylab taqsimot va harakatlar fazosidan amaldagi foydalanish&lt;/h4&gt;\n&lt;p&gt;4a-Rasmda 1,454 ta tasdiqlangan generatsiya va qayta loyihalash boshlanishlari kampaniya holati yorliqlari va qayd etilgan R/E/X ustuvorliklari bo'yicha guruhlangan; har bir holat ichidagi foizlar ushbu holatdagi barcha generatsiya va qayta loyihalash boshlanishlarini maxraj sifatida ishlatadi, majburiy AF2 baholari bundan mustasno. Asosiy matndagi foizlar quyidagilarga mos keladi: past dalillar darajasida 48/65 Explore boshlanishlari, turg'unlik va chuqur turg'unlik birlashtirilgan holda 41/80 Rescue boshlanishlari hamda dublikatsiyali mahsuldor holatlarda 930/1,133 eXploit boshlanishlari. Strukturaviy dublikat kollapsida birorta ham generatsiya yoki qayta loyihalash boshlanishi qayd etilmagan. Holat qoidalari C.4.5-Qo'shimcha bo'limda belgilangan; c va d panellari esa quyida tavsiflangan retrospektiv izohlardan foydalanadi.&lt;/p&gt;\n&lt;p&gt;Dalillar yo'nalishi izohi. Har bir boshlanish maqsad va nomzod vazifa identifikatori bo'yicha tuzilgan qaror matniga bog'langan bo'lib, takroriy boshlanishlar alohida voqealar sifatida saqlangan. To'rtta izoh kategoriyasi interfeys ishonchliligi, folding ishonchliligi, asos zanjir mosligi va strukturaviy ortiqchalikni o'z ichiga olgan. Bog'langan qarorlar uchun 27 ta loyihalash qarorini (35 ta boshlanish) o'z ichiga olgan qo'lda izohlar matnli moslashtirishdan ustun keldi. Aks holda, registrni hisobga olmaydigan moslashtirish avval taklif qilingan vazifa tavsifini (nima) tekshirgan. Faqat ushbu maydon birorta ham kategoriyaga mos kelmaganda, moslashtirish birlashtirilgan dalillar va asoslash maydonlarini tekshirgan. Mos kelgan bitta kategoriya yagona yo'nalishni tayinlagan, bir nechta kategoriyaga mos kelish esa ko'p yo'nalishli yorliqni bergan. Mos kelmagan yoki bog'langan qarori bo'lmagan boshlanishlar izohlanmagan holda qolgan. C va d panellari ko'p yo'nalishli va izohlanmagan boshlanishlarni istisno qilgan holda, yagona yo'nalish tayinlangan 1,305 ta boshlanishni o'z ichiga oladi. 4-Rasm yorlig'idagi asos zanjir mosligi scRMSD, poza xatosi yoki asos zanjir siljishi haqidagi so'zlarni o'z ichiga olgan holda strukturaviy o'z-o'zidan moslikni bildiradi. Ushbu izohlar mustaqil ravishda aniqlangan dizayn cheklovlarini emas, balki keltirilgan dalillarni tavsiflaydi; izohlash ko'r usulda bajarilmagan va baholovchilar o'rtasidagi kelishuv baholanmagan. S16-Qo'shimcha jadval o'lchangan malaka xatolarini va strukturaviy ortiqchalikni ushbu qaror matni izohlaridan alohida xabar qiladi. Kampaniya holati, dalillar yo'nalishi va ustuvorlik orasidagi bog'liqliklar tavsiflovchi xususiyatga ega: deterministik holat qoidalari, nomzodni yaratish va taqsimlash chegaralari ham amalga oshirilgan boshlanishlarga ta'sir qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Dalillar yo'nalishini izohlash — tadqiqotchilar strategiyasini tushunish uchun oqsillar modellarining to'rtta asosiy sifat mezoni bo'yicha hisoblash vazifalari asoslarini tasniflash usulidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Jadvalda turli maqsadli oqsillar uchun metrikalar keltirilgan: CD45 uchun 6,291 ta boshlanish, 67.6% iPAE xatolari, 25.7% pLDDT xatolari, 25.4% scRMSD xatolari, 1,936 ta malakali TM ≥ 0.6 tuzilmalari va har bir hisoblash birligiga (SU) 6.43 ta malakali variant qayd etilgan; BetV1 uchun 2,310 ta boshlanish, 84.0% iPAE, 72.9% pLDDT, 51.7% scRMSD, 3.81 malakali SU; CbAgo uchun 5,170 ta boshlanish, 89.1% iPAE, 62.6% pLDDT, 43.5% scRMSD, 4.34 SU; HER2-AAV uchun 3,733 ta boshlanish, 73.0% iPAE, 62.8% pLDDT, 14.8% scRMSD, 4.21 SU; SC2RBD uchun 1,906 ta boshlanish, 79.3% iPAE, 82.5% pLDDT, 42.3% scRMSD, 4.58 SU; PDL1 uchun 9,099 ta boshlanish, 26.3% iPAE, 29.5% pLDDT, 10.5% scRMSD, 6,203 ta malakali TM ≥ 0.6 tuzilmalari va 12.87 SU; IL7RA uchun 3,163 ta boshlanish, 51.0% iPAE, 50.1% pLDDT, 24.5% scRMSD, 1,178 ta malakali tuzilmalar va 4.93 SU.&lt;/p&gt;\n&lt;p&gt;Keyingi vazifa turlari. 4d-Rasm uchun vazifalar quyidagi tartibda tasniflangan. ProteinMPNN vazifalari nomzodni qayta loyihalashga, arxivlangan yo'nalishlarning aniq takrorlanishlari qayd etilgan yo'nalishni takrorlashga, har bir maqsadli kampaniya doirasidagi generatsiya oilasining birinchi boshlanishi esa metodning birinchi ishlatilishiga tayinlangan. Qolgan vazifalar uchun registrni hisobga olmaydigan moslashtirish taklif qilingan vazifa tavsifidan yoki bunday tavsif bo'lmaganda qayd etilgan konfiguratsiyadan foydalangan. sequence[_-]?hallucination bilan mos kelish nomzodni qayta loyihalashni tayinlagan, aks holda reward, weight, penalty yoki objective so'zlari ball qo'yish og'irliklarini tuzatishga tegishli bo'lgan. Barcha qolgan vazifalar tanlanma yoki qidiruvni sozlashga tayinlangan. Bu tartib kategoriyalarni o'zaro istisno qiluvchi qiladi; matnga asoslangan kategoriyalar taklif qilingan vazifalarni tavsiflaydi va har bir mos kelgan vazifa ball qo'yish og'irliklari yoki tanlanma parametrlarini o'zgartirganini isbotlamaydi.&lt;/p&gt;\n&lt;p&gt;Harakatlar fazosidan amaldagi foydalanish. Yettita asosiy T-REX kampaniyasi barcha oltita ro'yxatdan o'tgan generatsiya oilalari va ProteinMPNN qayta loyihalashini qo'llagan bo'lib, 161 ta maqsadli konfiguratsiya va 1,454 ta tasdiqlangan generatsiya yoki qayta loyihalash boshlanishlarini qamrab olgan (S17-Qo'shimcha jadval). Jadval nishonlar bo'yicha to'g'ridan-to'g'ri SU taqsimotini jamlaydi; S5-Qo'shimcha rasm nishonlar darajasidagi sonlarni ko'rsatadi. Har bir yakuniy SU o'zining tanlangan vakilini ishlab chiqargan oilaga tegishli qilib belgilanadi, uning kelib chiqishiga hissa qo'shgan barcha vazifalarga emas. Ushbu taqsimot sababli qo'shilgan hissani yoki xarajatlarga nisbatan normallashtirilgan samaradorlikni o'lchamaydi. Ruxsat etilgan konfiguratsiya diapazonlari S5-Qo'shimcha jadvalda keltirilgan.&lt;/p&gt;\n&lt;h4 id=\"d33-aniq-rescue-ustuvorligisiz-aralashuv\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d33-aniq-rescue-ustuvorligisiz-aralashuv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.3.3. Aniq Rescue ustuvorligisiz aralashuv&lt;/span&gt;&lt;/a&gt;D.3.3. Aniq Rescue ustuvorligisiz aralashuv&lt;/h4&gt;\n&lt;p&gt;Aniq Rescue (qutqaruv) ustuvorligini sinab ko'rish uchun mualliflar 100 ishchi GPU-soat rejalashtirilgan byudjet bilan har bir nishon uchun bittadan aralashuv kampaniyasini o'tkazdilar. Harakatlar maydoni, tuzilgan dalillar, resurs cheklovlari va kampaniya holati chegaralari saqlanib qoldi. Rejalashtiruvchi va nazoratchi ustuvorliklari faqat Explore va eXploit bilan cheklandi; zaxira taqsimoti va ustuvorlik hisobi ham faqat shu ikkita ustuvorlikdan foydalandi. Deterministik qoidalar bo'yicha Rescue tayinlangan nomzodlar Explore deb qayta nomlandi. Rescue terminologiyasi LLM ko'rsatmalaridan olib tashlandi va yaqin xatolar bilan boyitilgan holat o'z ta'rifini o'zgartirmasdan blocker_rich neytral yorlig'ini oldi.&lt;/p&gt;\n&lt;p&gt;Tiklanish va to'xtab qolish vaqti. 4b-rasmda har bir siyosatning dastlabki 100 ta ishchi GPU-soati ichidagi rejalashtirish yozuvlari ishlatiladi. Har bir ishchi-vaqt qiymatida oxirgi yozuv saqlangandan so'ng, to'xtab qolish yoki chuqur to'xtab qolish holatiga har bir o'tish yangi yozuvni boshladi, shu jumladan to'xtab qolishdan chuqur to'xtab qolishga o'tish ham (holat ta'riflari C.4.5-bo'limda). Tiklanish shu paytgacha kuzatilgan eng yuqori onlayn TM0.6 SU soni kirish vaqtidagi qiymatidan oshib ketgan keyingi birinchi rejalashtirish yozuvi edi, hatto holat o'zgargan bo'lsa ham. Shuning uchun tiklanish vaqtlari rejalashtirish yozuvi o'lchamiga ega. Tiklanishsiz yozuvlar tiklanish ulushi maxrajida qoldi. Tiklanish vaqti medianlari faqat tiklangan yozuvlardan foydalandi, tiklanmagan yozuvlar tuzatilmadi. To'liq T-REX 27 ta yozuvdan 26 tasida tiklandi, aralashuv ostida esa 20 tadan 14 tasi tiklandi; mos ravishda bitta va oltita yozuvda kuzatilgan tiklanish bo'lmadi. Ushbu yozuvlar kampaniyadagi takroriy kuzatuvlardir va tiklanish kuzatuvini bo'lishi mumkin: 26 va 14 ta tiklangan yozuv mos ravishda 9 ta alohida nishon-tiklanish-vaqti juftligiga to'g'ri keldi. To'xtab qolish bandligini hisoblash uchun har bir holat yorlig'i keyingi rejalashtirish yozuviga olib o'tildi, oxirgi yorliq 100 ishchi GPU-soatigacha uzaytirildi. To'xtab qolish yoki chuqur to'xtab qolishga ajratilgan umumiy davomiylik, nishonlar bo'yicha yig'indi oyna davomiyligiga bo'linganda, to'liq T-REX uchun 3.8% va aralashuv uchun 27.7% umumiy bandlikni berdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Ushbu turdagi hisoblash metodlarida algoritmlar samaradorligini baholash uchun natijalar hisoblagichlari (SU) va sarflangan GPU vaqti tahlil qilinadi, shuningdek rejalashtiruvchining to'xtab qolish va tiklanish davrlari o'lchanadi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Yakuniy nuqtalarni taqqoslash. SN-jadvalda aralashuvning yakuniy SU sonlari D.1.2-bo'limdagi retrospektiv rekonstruksiya qilingan to'planish egri chiziqlaridan olingan to'liq T-REX sonlari bilan taqqoslanadi. To'liq T-REX 144 ishchi GPU-soatiga rejalashtirilgan edi, shuning uchun bu bir xil rejalashtirilgan byudjet bilan o'tkazilgan kampaniyalar o'rtasida emas, balki bir xil kuzatilgan ishchi vaqtida taqqoslashdir. CD45 uchun ishchi vaqt 99.742 soat, SU 2.256, tezlik 2.316 SU/GPU-soatni tashkil etdi; BetV1 uchun vaqt 99.991, SU 0.560, tezlik 0.430; CbAgo uchun vaqt 99.988, SU 0.490, tezlik 0.860; HER2-AAV uchun vaqt 99.977, SU 1.810, tezlik 1.440; SC2RBD uchun vaqt 99.968, SU 0.020, tezlik 0.430; PDL1 uchun vaqt 99.963, SU 3.111, tezlik 3.781; IL7RA uchun vaqt 99.951, SU 2.351, tezlik 1.821. To'liq T-REX ushbu nazorat nuqtasida to'rtta nishon uchun yuqoriroq va uchta nishon uchun pastroq sonlarga ega edi. Shunday qilib, taqqoslash bir xil o'tkazish qobiliyati afzalligini o'rnatmaydi. Rescue ustuvorligining olib tashlanishi to'xtab qolishlar chastotasini va qaysi to'xtab qolishlar tiklanish tahliliga kirganini ham o'zgartirishi mumkin edi. Aralashuv LLM ko'rsatmalarini, ustuvorlik taqsimotini va holat yorlig'i so'zlarini birgalikda o'zgartirdi; u taqsimot koeffitsientini yoki LLM mulohazalarining hissagini ajratib ko'rsatmaydi.&lt;/p&gt;\n&lt;h4 id=\"d4-boglovchi-dizaynlarini-post-hoc-tavsiflash-d41-qoshimcha-bashorat-modellari-va-metrikalar\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d4-boglovchi-dizaynlarini-post-hoc-tavsiflash-d41-qoshimcha-bashorat-modellari-va-metrikalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.4. Bog'lovchi dizaynlarini post-hoc tavsiflash D.4.1. Qo'shimcha bashorat modellari va metrikalar&lt;/span&gt;&lt;/a&gt;D.4. Bog'lovchi dizaynlarini post-hoc tavsiflash D.4.1. Qo'shimcha bashorat modellari va metrikalar&lt;/h4&gt;\n&lt;p&gt;Biz B.2 bo'limida aniqlangan o'zgarmas vakillik variantlarini qo'shimcha model bashoratlari va ballari yordamida tavsifladik. To'plam oltita usul va yettita nishon bo'yicha tarqalgan 3766 ta vakildan iborat bo'lib, har bir usul-nishon juftligida har bir yakuniy Foldseek TM ≥ 0.6 klasteridan bitta vakil olingan. Ularning barchasi S19-jadvaldagi har bir o'lchov uchun yakuniy natijalarga ega edi. Harmonized AF2 majmualarni umumiy sozlamalar bilan qayta baholadi, actifpTM esa o'sha AF2-Multimer konfiguratsiyasidan foydalandi. Shuning uchun ikkalasi ham saralash bosqichidagi kabi bir xil bashorat qiluvchilar oilasidan foydalandi. ESMFold2 va Boltz-2 esa majmualarni faqat nishon va bog'lovchi ketma-ketliklari asosida qayta bashorat qildi. Ushbu post-hoc tahlillar taqsimotga, malakaga, klasterizatsiyaga yoki SU soniga ta'sir qilmadi. AF2 ning tekislangan xatolaridan olingan o'zaro ta'sirni bashorat qilish bali (ipSAE) interfeys ishonchliligi ko'rsatkichi bo'lib, unda yuqori qiymatlar yaxshiroq natijani bildiradi (malakalashda qo'llanilgan pastroq qiymat yaxshi bo'lgan normallashtirilgan iPAE dan farqli o'laroq). Biz uning ikkita yo'nalishli qiymatining arifmetik o'rtachasini keltiramiz, actifpTM esa interfeys ishonchliligini bashorat qilingan kontakt ehtimolliklari bo'yicha vaznlaydi. PRODIGY bashorat qilingan bog'lanish erkin energiyasi Δ G va undan kelib chiqadigan dissotsiatsiya konstantasi &lt;a href=\"concepts/k-d.html\"&gt;K_D&lt;/a&gt; ni taqdim etdi. Bu ko'rsatkichlar eksperimental bog'lanish o'lchovlari emas, balki ishonchlilik yoki yaqinlik bashoratlaridir. S19-jadvalda baholovchining kirish ma'lumotlari, sozlamalar, birliklar va ballarni jamlash usullari keltirilgan. 2c-rasmda tanlangan post-hoc chegaralari ko'rsatilgan, S6a–d-qo'shimcha rasmlarda esa harmonized AF2, actifpTM, PRODIGY, ESMFold2 va Boltz-2 bo'yicha barcha 24 ta chegara keltirilgan. Har bir chegara bir xil o'zgarmas vakillar to'plamiga alohida qo'llanildi va o'tgan sonlar yettita nishon bo'yicha jamlandi. T-REX har bir chegarada eng katta umumiy sonni saqlab qoldi. Ushbu jamlangan ko'rsatkichlar har bir usulning malakali vakillar hovuzining hajmini ham, har bir chegaradan o'tgan ulushini ham aks ettiradi. Chegaralar Δ G va uning hosilasi K_D ni o'z ichiga olgan o'zaro bog'liq o'lchovlarni umumlashtiradi va mustaqil validatsiya tajribalari hisoblanmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Post-hoc tahlillar va ipSAE, ipTM yoki PRODIGY kabi metrikalar tayyor modellar asosida oqsil majmualarining sifatini baholash uchun qo'shimcha hisoblash usullari bo'lib, ular haqiqiy fizik o'lchovlarni almashtirmasa ham, yaroqsiz variantlarni ishonchli tarzda chiqarib tashlashga yordam beradi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Chegaradan o'tgan dizaynlar soni har bir vosita uchun kirish ma'lumotlari va sozlamalarga bog'liq. Harmonized AF2 S4-jadvaldagi umumiy AF2 malakalash sozlamalari va o'zgarmas kirish ketma-ketligi bilan vakillik majmuasidan foydalanadi; samarali urug' (seed) va AF2 vazn heshed saqlanmagan. U zanjirlararo pTM (ipTM) va ikkita yo'nalishli ipSAE qiymatlarining arifmetik o'rtachasini o'lchaydi. ActifpTM harmonized AF2 bilan bir xil vakillik majmuasi va AF2-Multimer konfiguratsiyasidan foydalanadi; u AF2 tomonidan bashorat qilingan 8 Å dan past bo'lgan zanjirlararo masofalar ehtimolligi bilan vaznlangan interfeys pTM ni hisoblaydi. PRODIGY parametrlarni o'zgartirmasdan, standart 25 ^°C konversiyasidan foydalangan holda Δ G (kkal·mol⁻¹) va K_D (M) ni bashorat qilish uchun harmonized AF2-Multimer bashorat qilgan majmuadan foydalanadi. ESMFold2 faqat nishon va bog'lovchi ketma-ketliklarini qo'llaydi; 20 sikl, 100 orqaga qadam, bitta diffuziya namunasi va vakilning o'zgarmas butun sonli baholash indeksiga teng urug'. Boltz-2 ham faqat ketma-ketliklarni bo'sh ko'p martali ketma-ketlikni tekislash (MSA) rejimi, 200 orqaga qadam, uchta qayta ishlash sikli, bitta diffuziya namunasi va to'liq PAE chiqishi bilan ishlatiladi; u oqsil ipTM ni, ikkala yo'nalish bo'yicha o'rtacha olingan nishon-bog'lovchi qoldiq juftlarining o'rtacha PAE qiymatini (Å) va bog'lovchining o'rtacha pLDDT qiymatini (0–1 shkala) beradi.&lt;/p&gt;\n&lt;h4 id=\"d42-metric-specific-shortlists\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d42-metric-specific-shortlists\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.4.2. Metric-specific shortlists&lt;/span&gt;&lt;/a&gt;D.4.2. Metric-specific shortlists&lt;/h4&gt;\n&lt;p&gt;S20–S22 jadvallari har bir metod-nishon juftligi uchun belgilangan TM0.6 vakillarini oltita alohida reyting tizimi bo'yicha umumlashtiradi: minimal malaka chegarasi, AF2 ipTM, o'rtacha yo'naltirilgan ipSAE, ESMFold2 umumiy ipTM, actifpTM va PRODIGY bashorat qilingan yaqinlik (affinity). Har bir reyting o'zining qisqa ro'yxatini shakllantiradi; Δ G va K_D bir xil yaqinlik bo'yicha tartiblangan ro'yxatni tavsiflaydi. Mavjud N ta vakildan har bir ro'yxat bo'shliqlarsiz &lt;span class=\"yfm-latex\" data-content=\"n%20%3D%20%5Cmin(10%2C%20N)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; miqdorini saqlab qoladi. Chegaralar B.2 bo'limida, post-hok metrikalar esa D.4.1 bo'limida keltirilgan. Ushbu xulosalar bitta umumiy ko'p metrikali ro'yxatni emas, balki turli o'lchamdagi havzalardan metrikaga xos tanlovni tavsiflaydi. Reyting ballari tanlangan dizaynlarni ham umumlashtirgani sababli, bu mustaqil validatsiya hisoblanmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Metrikaga oid qisqa ro'yxatlar har bir nishon (CD45, BetV1, CbAgo) uchun turli algoritmlar (T-REX, PUCT, ε-greedy, Complexa-only, BindCraft-only, BoltzGen-only) asosida AF2 ipTM va erkin energiya Δ G kabi mezonlar bo'yicha eng yaxshi 10 tagacha variantni saralab oladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tanlash va teng natijalarni hal qilish (tie-breaking) qat'iy ierarxiyaga asoslanadi. Chegara reytingi dizaynlarni kamayib boruvchi &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, so'ngra o'rtacha chegara, shuningdek pLDDT, iPAE va scRMSD chegaralari bo'yicha mos ketma-ketlikda tartiblaydi. Har bir ishonch reytingi o'zining nomlangan ballining kamayib boruvchi qiymatlarini, shundan so'ng &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; va o'rtacha chegarani qo'llaydi. Yaqinlik reytingi ortib boruvchi K_D, so'ngra Δ G, shuningdek kamayib boruvchi &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; va o'rtacha chegaradan foydalanadi. Qolgan tengliklar barqaror yozuv identifikatorining o'sib boruvchi leksikografik tartibida hal qilinadi. Barcha reytinglarda ekran uchun yaxlitlashdan oldingi qiymatlar ishlatiladi.&lt;/p&gt;\n&lt;p&gt;CD45 nishoni uchun T-REX metodi (N=301) n=10/10 tanlanmani hosil qiladi: minimal chegara &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D%20%3D%200.359\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; [0.395, 0.328], AF2 ipTM 0.872 [0.887, 0.865], o'rtacha yo'naltirilgan ipSAE 0.714 [0.729, 0.711], ESMFold2 ipTM 0.813 [0.906, 0.778], actifpTM 0.959 [0.974, 0.958], PRODIGY Δ G = -12.90 [-13.40, -12.00] kkal mol⁻¹ va K_D = 3.6× 10⁻¹⁰ [1.5× 10⁻¹⁰, 1.5× 10⁻⁰⁹] M. PUCT metodi (N=69) n=10/10 beradi: &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D%20%3D%200.225\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; [0.364, 0.199], AF2 ipTM 0.824 [0.876, 0.819], ipSAE 0.622 [0.715, 0.594], ESMFold2 ipTM 0.716 [0.827, 0.685], actifpTM 0.946 [0.961, 0.934], Δ G = -11.50 [-13.00, -10.90], K_D = 3.7× 10⁻⁰⁹ [3.0× 10⁻¹⁰, 1.0× 10⁻⁰⁸]. ε-greedy varianti (N=27) n=10/10 taqdim etadi: &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D%20%3D%200.289\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; [0.497, 0.224],
