nligini quyidagi marjinal qiymatlar o'lchaydi: &lt;span class=\"yfm-latex\" data-content=\"u_p%20%3D%20%5Cmax%5C%7B0%2C%20(pLDDT%20-%2090)%2F5%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"u_i%20%3D%20%5Cmax%5C%7B0%2C%20(7%2F31%20-%20iPAE)%2F0.05%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; va &lt;span class=\"yfm-latex\" data-content=\"u_s%20%3D%20%5Cmax%5C%7B0%2C%20(1.5%20-%20scRMSD)%2F0.3%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Har bir qiymat ko'pi bilan 3 qo'shadi va ularning yig'indisi 9 ga bo'linib, 0 dan 1 gacha bo'lgan q dizayn ballini beradi: &lt;span class=\"yfm-latex\" data-content=\"q%20%3D%20%5C%7B%5Cmin(u_p%2C%203)%20%2B%20%5Cmin(u_i%2C%203)%20%2B%20%5Cmin(u_s%2C%203)%5C%7D%2F9\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Har bir yo'nalish va onlayn Foldseek klasterida barcha uchta o'lchovga va eng yuqori q ga ega malakali dizayn tanlanadi. Har bir klaster bitta sifat kuzatuvini taqdim etadi, bunda keyingi yuqori balli dizayn oldingisini almashtiradi. Tanlangan dizaynlarning medianasi va 25-persentili strict_quality_median va strict_quality_p25 sifatida saqlanadi. Oila xulosasi eng yuqori 25-persentilga ega yo'nalish sifat statistikasini nusxalaydi. Rejalashtiruvchi va Nazoratchi ushbu ma'lumotlardan foydalanadi, yakuniy tahlillar esa &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ga tayanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Persentillar va marjinal toqat chegaralari oqsil dizaynlarini strukturaviy mukammalligi bo'yicha moslashuvchan tarzda saralashga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Yordamchi diagnostik yaxshilanish bali qo'shimcha o'lchovlar sifat chegaralariga mos kelishi yoki yaxshilangani yuzasidan hisoblanadi. S7-jadvalda manbaga xos o'lchovlar, chegaralar, toqat qilish darajalari, og'irliklar va qabul qilish-ma'lumot chegaralari keltirilgan. Har bir yo'nalish va o'lchov uchun so'nggi kuzatuvlar 6-GPU-soatlik natijalar oynasidagi yakuniy qiymatlar sifatida aniqlanadi. O'lchov kamida ikkita so'nggi kuzatuv bilan ishlatiladi, yoki bitta kuzatuv chegara talabiga javob bersagina qo'llaniladi.&lt;/p&gt;\n&lt;p&gt;Yetishmovchilik o'lchovning sifat chegarasidan qanchalik ortda qolishini ko'rsatadi, chegaraga erishilganda esa u nolga teng. Normallashtirilgan yetishmovchilikni topish uchun bu qiymat tegishli toqat chegarasiga bo'linadi. Shundan so'ng joriy sifat va yaxshilanish qiymatlari hisoblanadi. Joriy sifat chegaraga yetgan kuzatuvlar ulushini (1.0), toqat doirasidagilarni (0.5) va qolganlarini (0.0) hisobga oladi. Yaxshilanish o'tmishdagi va hozirgi median normallashtirilgan yetishmovchiliklar farqini baholaydi. Olingan qiymatlar S7-jadvaldagi vaznlariga ko'paytiriladi (to'g'ridan-to'g'ri bog'liq parametrlar uchun 1.0, boshqalar uchun 0.6). Yo'nalish bali o'lchovlar orasidagi eng katta vaznli qiymatga teng bo'lib, 0 dan 1 gacha oraliqda saqlanadi. S7-jadval yordamchi o'lchovlar uchun mos yozuvlar qiymatlari va og'irliklarini o'z ichiga oladi.&lt;/p&gt;\n&lt;h4 id=\"c44-yonalish-statusi-qoidalari\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c44-yonalish-statusi-qoidalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.4.4. Yo'nalish statusi qoidalari&lt;/span&gt;&lt;/a&gt;C.4.4. Yo'nalish statusi qoidalari&lt;/h4&gt;\n&lt;p&gt;Har bir yo'nalish qabul qilish va kechiktirishni baholash uchun umumiy statusga (status) hamda davom etayotgan, kechikayotgan va pasayib borayotgan unumdorlikni farqlovchi so'nggi unumdorlik statusiga (marginal_status) ega. Ikkalasi ham quyidagi birinchi mos keladigan qoidani qaytaradi va kutilayotgan baholashni alohida aniqlaydi. Oila agregatlari ham xuddi shu qoidalardan foydalanadi, faqat 32 ta yakunlanish testi o'chirilgan va malakali klaster dublikat ulushi taqdim etilmaydi. Ushbu statuslar yo'nalishlar yoki oilalarni tavsiflaydi; C.4.5-bo'lim butun kompaniya holatlarini belgilaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;&lt;/blockquote&gt;\n&lt;p&gt;Yo'nalish statusi va unumdorlik statusi resurs xarajatlari, dublikatlar ulushi va SU (to'lanadigan birliklar) o'sishiga qarab hisob-kitob tarmoqlarining yashovchanligini avtomatik belgilaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Oyna ta'riflari. 60 ta yozuvdan iborat oyna so'nggi 60 ta kampaniya ResultRecords yozuvlarini o'z ichiga oladi; 3 va 6 GPU-soatlik oynalar kampaniya bo'ylab qayd etilgan xarajatlardan foydalanadi (C.4.1-bo'lim). O'sish — bu ko'rsatilgan oynada yo'nalishga berilgan yangi onlayn SU. So'nggi yaqin o'tkazib yuborishlar (near misses) C.4.2-bo'limdagi klaster tekshiruvlariga bo'ysunuvchi 60 ta yozuv oynasidagi alohida yaqin xato yozuvlaridir. Yo'nalish xarajati tegishli ajdodlar xarajatlarini o'z ichiga oladi; umrbod ko'rsatkichlar kuzatilgan to'liq tarixdan foydalanadi.&lt;/p&gt;\n&lt;p&gt;Dublikat o'lchovlari. Malakali/SU nisbati yo'nalishning malakali yozuvlar sonining unga berilgan SU soniga nisbatidir; SU soni nolga teng bo'lganda bu nisbat mavjud emas. Yo'nalish dublikati ulushi Eq. (S3) tenglamasidan foydalanadi, bunda Nassigned va Nclusters yo'nalishning kümülatif malakali klasterga tayinlangan yozuvlari bo'yicha hisoblanadi. Dublikat haqida ogohlantirish malakali/SU ≥ 8 yoki dublikat ulushi ≥ 0.80 ekanligini anglatadi. Yetishmayotgan dublikat o'lchovlari o'zlarining chegara testlarini qondira olmaydi.&lt;/p&gt;\n&lt;p&gt;Solishtirish tezligi. Eng yaxshi yetuk tezlik — bu kamida ikkita tayinlangan SU va ikkita yo'nalish GPU-soatiga ega bo'lgan aniq yo'nalishlar orasidagi eng katta umrbod SU/GPU-h tezligi; hech qanday mos kelmasa, nolga teng. Yetishmayotgan tezliklar faqat quyidagi qoidalar taqqoslamalari uchun nol sifatida ko'rib chiqiladi.&lt;/p&gt;\n&lt;p&gt;AF2 tuzilmani baholash qatorlari. AF2 baholash qatorlari quyidagi generatsiya/qayta loyihalash tasniflarini chetlab o'tadi. Standartlashtirilgan baholash plumbing arxiv yorlig'ini olib yuradi; kod advisory qiymatini boshqa baholash rollari, jumladan, ota-ona modelining ataylab qayta buklanishi uchun saqlaydi.&lt;/p&gt;\n&lt;p&gt;Umumiy status qoidalari:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;untried (sinab ko'rilmagan): musbat jamg'arilgan yo'nalish xarajati yo'q.&lt;/li&gt;\n&lt;li&gt;awaiting_score_conversion (bahoni konvertatsiya qilishni kutish): tayinlangan SU yo'q va standartlashtirilgan AF2 bahosini kutayotgan kamida bitta istiqbolli yaroqli chiqish mavjud. Qabul qilish signallari C.8.1-bo'limda aniqlangan.&lt;/li&gt;\n&lt;li&gt;collapse_risk (qulash xavfi): yo dublikat haqida ogohlantirish, kamida bitta tayinlangan SU, kamida sakkizta malakali yozuv va 60 ta yozuv yoki 6 GPU-soatlik SU o'sishining yo'qligi; yo malakali/SU ≥ 8, umrbod tezlik ≤ 0.30 va yo 6 GPU-soatlik o'sishning yo'qligi yoki musbat 60 ta yozuv o'sishi.&lt;/li&gt;\n&lt;li&gt;defer (kechiktirish): yo umrbod SU ham, so'nggi yaqin o'tkazib yuborish ham yo'q, kamida 3 yo'nalish GPU-soati yoki 32 ta bajarilgan ResultRecords mavjud; yo eng yaxshi yetuk tezlik ≥ 0.50, kamida 3 yo'nalish GPU-soati, eng yaxshi tezlikning 35% dan past bo'lgan umrbod tezlik va 60 ta yozuv, 6 GPU-soat yoki so'nggi yaqin o'tkazib yuborishning o'sishi yo'q. Bu yerda bajarilgan ResultRecords ok yoki no_artifacts statusiga ega; bitta vazifa bir nechta yozuv yaratishi mumkin.&lt;/li&gt;\n&lt;li&gt;observed (stale) (kuzatilgan / eskirgan): kamida bitta umrbod SU, lekin 60 ta yozuv, 6 GPU-soat yoki so'nggi yaqin o'tkazib yuborish bo'yicha SU o'sishi yo'q, 60 ta yozuv oynasida kamida 1 yo'nalish GPU-soati mavjud.&lt;/li&gt;\n&lt;li&gt;diversify (diversifikatsiya qilish): kamida bitta umrbod SU va yo malakali/SU ≥ 4, yoki dublikat ulushi ≥ 0.55.&lt;/li&gt;\n&lt;li&gt;promote (rag'batlantirish): kamida bitta umrbod SU, musbat eng yaxshi yetuk tezlik va ushbu taqqoslagichning kamida 80% ni tashkil etuvchi umrbod tezlik. 60 ta yozuvli SU o'sishining yo'qligi, malakali/SU ≥ 8 yoki dublikat ulushi ≥ 0.70 rag'batlantirishga to'sqinlik qiladi.&lt;/li&gt;\n&lt;li&gt;healthy; otherwise observed (sog'lom; aks holda kuzatilgan): oldingi qoidalardan keyin kamida bitta umrbod SU yoki so'nggi yaqin o'tkazib yuborish healthy statusini beradi; aks holda observed.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;So'nggi unumdorlik statusi (marginal_status):&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;untried; awaiting_score_conversion: umumiy status tasnifi bilan bir xil dastlabki ikkita test qo'llaniladi.&lt;/li&gt;\n&lt;li&gt;under_tested; otherwise dry_low_quality (yetarlicha sinovdan o'tmagan; aks holda quruq past sifatli): nol umrbod SU ga ega yo'nalish uchun, jamg'arilgan yo'nalish xarajati 3 GPU-soatdan past va bajarilishlar 32 ta ResultRecords dan kam bo'lganda yoki so'nggi yaqin o'tkazib yuborish mavjud bo'lganda under_tested qo'llaniladi. Aks holda dry_low_quality ishlatiladi.&lt;/li&gt;\n&lt;li&gt;productive_but_duplicate (mahsuldor, lekin dublikatli): dublikat haqida ogohlantirish va 60 ta yozuv yoki 3 GPU-soatlik oynada SU o'sishi.&lt;/li&gt;\n&lt;li&gt;delayed_productive; duplicate variant (kechiktirilgan mahsuldor; dublikat varianti): 6 GPU-soatlik oynada SU o'sishi, lekin 60 ta yozuv yoki 3 GPU-soatlik oynalarning hech birida yo'q. Dublikat haqida ogohlantirish yorliqni delayed_productive_duplicate ga o'zgartiradi.&lt;/li&gt;\n&lt;li&gt;dry_duplicate (quruq dublikat): dublikat haqida ogohlantirish, 3 yoki 6 GPU-soatlik SU o'sishining yo'qligi va so'nggi tezlikning pasayishi: 3 GPU-soatlik oynada kamida 1 yo'nalish GPU-soati mavjud bo'lib, 60 ta yozuv va 3 GPU-soatlik oynalardagi kattaroq SU/GPU-h tezligi musbat umrbod tezlikning 35% dan past bo'ladi.&lt;/li&gt;\n&lt;li&gt;productive (mahsuldor): 60 ta yozuv yoki 3 GPU-soatlik oynada SU o'sishi.&lt;/li&gt;\n&lt;li&gt;dry; otherwise observed (quruq; aks holda kuzatilgan): so'nggi tezlikning pasayishini tekshirish va 6 GPU-soatlik SU o'sishining yo'qligi dry statusini beradi; qolgan barcha yo'nalishlar observed sifatida belgilanadi.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"c45-kampaniya-holatini-belgilash-qoidalari\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c45-kampaniya-holatini-belgilash-qoidalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.4.5. Kampaniya holatini belgilash qoidalari&lt;/span&gt;&lt;/a&gt;C.4.5. Kampaniya holatini belgilash qoidalari&lt;/h4&gt;\n&lt;p&gt;Nazoratchi resurs sarfi, yaqindagi natijalar, yangi SU (tuzilmaviy birliklar), dublikatlar, «deyarli muvaffaqiyatli» (near-miss) natijalar va mezonlar bo‘yicha kamchiliklar asosida yetti xil kampaniya holatidan birini tayinlaydi. Holat belgilari vazifalarni taqsimlash ustuvorliklarini boshqaradi. low_evidence ko‘proq ma’lumot to‘plashga, productive samarali yo‘nalishlarni davom ettirishga, productive_duplicate diversifikatsiyaga, strict_duplicate_collapse esa muqobil konfiguratsiyalarga qaratilgan. rescue_rich resurslarni cheklovchi mezonga yo‘naltiradi, stalled esa Rescue yoki Explore holatlarini faollashtiradi, deep_stall esa samarasiz yo‘llarning ustuvorligini pasaytiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SU (Structural Units) — bu generatsiya jarayonining muvaffaqiyatini baholash uchun ishlatiladigan tuzilmaviy modellar sifati yoki yangiligi metriki.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mezonlar konsentratsiyasi near-miss sonidan alohida hisoblanadi. a mezoni uchun oxirgi 60 ta yozuvdagi median kamchilik d_a va ruxsat etilgan xatolik b_a aniqlanadi. Klassifikator &lt;span class=\"yfm-latex\" data-content=\"C_%7Baxis%7D%20%3D%20%5Cmax_a(d_a%2Fb_a)%20%5Csum_a(d_a%2Fb_a)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ko‘rsatkichidan foydalanadi, bunda 0,50 qiymati masshtablangan median kamchiliklar uchun chegaraviy qiymat hisoblanadi. «Sovuq start» (cold start) shartiga ko‘ra, agar sarf 1,0 GPU-soatdan kam yoki yozuvlar soni 3 tadan kam bo‘lsa, low_evidence tayinlanadi. Aks holda, qoidalar ketma-ketligi tekshiriladi: tuzilmaviy dublikatlarni qisqartirish, mahsuldorlik, near-miss boyitilishi va stalled/deep_stall holatlari.&lt;/p&gt;\n&lt;p&gt;Qisqartirish holati ishonchli klasterizatsiyani, kamida 40 ta malakali dizaynni, ikkita SU klasterini, har bir SU uchun o‘rtacha 8 ta dizaynni, to‘plangan sarf ≤ 0,30 SU/GPU-soat va yaqindagi SU o‘sishi ≤ 1 bo‘lishini talab qiladi. Foldseek klasterlari nisbati (TM-score 0,8 dan 0,6 gacha) 1,30 dan oshmasligi kerak. Mahsuldorlik uchun o‘sish &amp;gt; 0 va tezlik ≥ 0,04 yangi SU/GPU-soat bo‘lishi shart (kamida 0,5 GPU-soat, Jadval S6). Dublikatlar ulushi &amp;lt; 0,60 bo‘lsa, productive, aks holda productive_duplicate holati tanlanadi. Near-miss boyitilishi uchun ≥ 3 klaster va Caxis ≥ 0,50 talab qilinadi. 12,0 GPU-soat davomida yangi SU bo‘lmasa, tizim deep_stall holatiga o‘tadi.&lt;/p&gt;\n&lt;h4 id=\"c51-model-va-chaqiruv-sozlamalari\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c51-model-va-chaqiruv-sozlamalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.5.1. Model va chaqiruv sozlamalari&lt;/span&gt;&lt;/a&gt;C.5.1. Model va chaqiruv sozlamalari&lt;/h4&gt;\n&lt;p&gt;Ikkala rol (Planner va Supervisor) bitta H100 GPU'da vLLM orqali mahalliy Qwen3.6-27B-FP8 chekpointidan foydalandi (Jadval S4). Kontekst chegarasi 65 536 token, GPU xotirasidan foydalanish 0,90 ni tashkil etdi. Chaqiruv parametrlari: max_tokens=3072, timeout_s=90, max_retries=1. Planner harorati 0,2, Supervisorniki esa 0,0 edi. Ishonchlilik (confidence) 0,55 dan past bo‘lsa, bu qayd etildi, lekin javob rad etilmadi. Supervisor ishonchliligi 0,65 dan past bo‘lsa, taqsimot chegaralari faollashishi mumkin edi. Har bir chaqiruv model identifikatori, prompt xeshi (SHA-256), format versiyasi, parsing holati va tokenlar soni bilan birga saqlandi.&lt;/p&gt;\n&lt;h4 id=\"c52-kirish-malumotlari-tarkibi-va-soraladigan-natijalar\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c52-kirish-malumotlari-tarkibi-va-soraladigan-natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.5.2. Kirish ma'lumotlari tarkibi va so'raladigan natijalar&lt;/span&gt;&lt;/a&gt;C.5.2. Kirish ma'lumotlari tarkibi va so'raladigan natijalar&lt;/h4&gt;\n&lt;p&gt;LLM kirish ma'lumotlari va hajm cheklovlari. Arxiblangan Dalillar xulosasi (Evidence Summary) 32 tagacha aniq yo'nalish qatorlarini (routerows) va 20 ta rejalashtirish yangilanishi xulosalarini (planning-updatesummaries) saqlab qolgan. Ikkinchi qisqartirish ikkala LLMga kümülatif onlayn TM0.6 SU jami ko'rsatkichlarini, barcha metod xulosalarini va oila darajasidagi yo'nalish qatorlarini, shuningdek, eng ustuvor aniq yo'nalishlarni, o'n ta sinovdan o'tgan konfiguratsiya xulosalarini (recipes), sakkizta strategiya natijalari xulosalarini (strategy_feedback), konfiguratsiyaga bog'langan sakkizta dizaynni (exemplars), to'rtta illyustrativ natija yozuvlarini (examples) va o'n ta yangilanish tarixi yozuvlarini taqdim etdi (S2a-rasm; ta'riflar C.4.1-bo'limda keltirilgan).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Kontekstni siqish va dinamik prompt tayyorlash jarayoni ma'lumotlar hajmini optimallashtiradi: model keraksiz takrorlardan xoli, aniq tuzilgan arxiv ko'rsatkichlari hamda gipoteza kartochkalari bilan ishlaydi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Rejalashtiruvchi, shuningdek, sakkiztagacha faol yoki so'nggi Gipoteza kartochkalarini (HypothesisCards), mavjud harakat oilalarini, ruxsat etilgan sozlamalarni va ish yuklamasi cheklovlarini qabul qildi. Supervayzer joriy kartochkalar, yaroqli nomzod vazifalar va tanlov kontekstini, jumladan mavjud ishchi o'rinlari va so'nggi boshlanishlarni oldi. Aniq yo'nalish qatorlari oila xulosalaridan oldin keldi. Qisqartirish jarayoni to'liq ota-identifikatorlar ro'yxatini hisoblagich va mavjudlik bayrog'i bilan almashtirdi; aniq identifikatorlar tanlangan misollarda va nomzodlarni qurish uchun mavjud bo'lib qoldi. U maqsadli identifikator va maqsadli sinf kalitlarini rekursiv ravishda olib tashladi, yuqori darajadagi yetishmayotgan skalyarlar va bo'sh satrlarni tashlab yubordi, lekin recipes va joint_patterns kabi bo'sh dalillar to'plamlarini hamda nol urinishli metod xulosalarini saqlab qoldi. Ushbu chetga o'tishlar o'lchovlarni taxminiy kiritishni anglatmaydi.&lt;/p&gt;\n&lt;p&gt;Ikkala dinamik prompt ham qisqacha dalillar Dayjesti (evidencedigest) bilan boshlanib, undan keyin rolga xos JSON keladi. D.2.1-bo'limda saqlangan to'liq prompt emas, balki arxivlangan Dalillar xulosasidan parcha va qayta tiklangan qisqartirilgan kirish parchasi ko'rsatilgan. Hech qaysi rol ushbu interfeys orqali o'zboshimchalik bilan arxiv fayllarini o'qimagan yoki o'lchovlarni yozmagan. S2b-rasm kirishni tayyorlash, qo'ng'iroqlar va keyingi yozuvlarni rejalashtirish yangilanishi doirasida joylashtiradi.&lt;/p&gt;\n&lt;p&gt;So'raladigan natijalar. Ikkala rol ham server tomonidan majburiy JSON formatlashisiz bitta JSON obyektini talab qildi. Rejalashtiruvchi maydonlari abstain, confidence, rationale va cards bo'lib, ixtiyoriy fail_reason maydonini o'z ichiga olgan. Rejalashtiruvchining rad etmagan javobi bittadan to'rtagacha kartochkani o'z ichiga olishi talab qilindi, ularning har biri dalillarga havola qilib, da'vo, R/E/X yaqinliklarini (ustuvorlik maslahatlari sifatida ishlatiladigan nisbiy vaznlar), bir yoki bir nechta malaka o'lchovlaridagi bashorat qilingan o'zgarishlarni, saqlash cheklovlarini, taklif qilingan oilalarni va ixtiyoriy sozlamalarni ko'rsatdi.&lt;/p&gt;\n&lt;p&gt;Bashorat qilingan o'zgarishlar bir xil tartiblangan bazaviy havolalarni bo'lishdi; C.9-bo'lim ularning keyingi baholanishini aniqlaydi. D.2.2-bo'lim arxivlangan kartochka va uning tuzilgan nomzod vazifasini taqdim etadi. Supervayzer mode_mixture va reytingga ega candidate_decisions ro'yxatini qaytardi, ular abstain, confidence va rationale maydonlarini o'z ichiga olgan. Har bir qaytarilgan nomzod bitta ustuvorlikka tegishli bo'lib, 1 dan qaytarilgan sonigacha bo'lgan noyob global reytinglarga va har bir ustuvorlik doirasida noyob musbat reytinglarga ega edi.&lt;/p&gt;\n&lt;p&gt;Ajratish qiymatlari (allocation values) chekli, noldan farqli yoki nolga teng bo'lib, ularning yig'indisi birga teng edi. Quyidagi JSON bitta nomzod uchun so'raladigan maydonlarni tasvirlaydi; qavs ichidagi satrlar to'ldirgichlar bo'lib, raqamli qiymatlar illyustrativ xarakterga ega. D.2.2-bo'lim haqiqiy ustuvorliklarni belgilash misolini beradi.&lt;/p&gt;\n&lt;p&gt;Har bir kartochka va qaror reasoning_trace ichida uchta qisqa tushuntirish maydonini talab qildi: kuzatilgan signal (observed_signal), xulosa (inference) va harakat oqibati (action_implication). Bular xususiy model fikrlashining yozuvlari emas, balki hisobot qilingan tushuntirishlar edi. Supervayzer javobi nomzodlarning faqat quyi to'plamini, shu jumladan hech birini ham reytingga kiritishi mumkin edi. Uning resurs sinflari audit va teng natijalarni hal qilishni qo'llab-quvvatladi; taqsimot chegaralari va bajarilish deterministik bo'lib qoldi (C.7.1 va C.8.2-bo'limlar).&lt;/p&gt;\n&lt;p&gt;Tahlil qilish va tasdiqlash. Tahlil qilish birinchi JSON obyektini ajratib oldi va tan olingan maydon variantlarini normallashtirdi. Rejalashtiruvchini tasdiqlash maydon turlarini, dalillar havolalarini, o'lchov yo'nalishlarini va ustuvorlik yaqinliklarini tekshirdi; mavjud bo'lmagan oilalar olib tashlandi va nomzodlarni qurish sozlamalar chegaralarini majburiy bajardi. Supervayerni tasdiqlash nomzod/dalillar havolalarini, taqsimot qiymatlarini, ustuvorlik tayinlashlarini, reytinglarni va resurs sinflarini tekshirdi. Supervayzerning yetishmayotgan tushuntirish maydonlari qaytarilgan havolalar va tushuntirish matnidan to'ldirilishi mumkin edi. Rejalashtiruvchining tuzatishlari deterministik edi. Faqatgina ustuvorliklar bo'yicha takroriy nomzodlar, yaroqsiz global reytinglar yoki noma'lum nomzod identifikatorlarini o'z ichiga olgan Supervayzer xatolari bitta tuzatuvchi LLM qo'ng'irog'iga ruxsat berdi.&lt;/p&gt;\n&lt;h4 id=\"c53-prompt-korsatmalari\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c53-prompt-korsatmalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.5.3. Prompt ko'rsatmalari&lt;/span&gt;&lt;/a&gt;C.5.3. Prompt ko'rsatmalari&lt;/h4&gt;\n&lt;p&gt;Har bir rol o'z vazifasini belgilovchi tizim promptini va joriy dalillar hamda rolga xos kirishlarni o'z ichiga olgan dinamik foydalanuvchi promptini oladi (S2a-rasm). Quyidagi qutilar saqlangan kampaniyani umumlashtiradi: tizim ko'rsatmalari qisqartirilgan, kirish tana qismlari sxematik va tuzatuvchi xabar shablon parchasi hisoblanadi. Ular arxivlanmagan to'liq tarixiy promptlar emas. Kirish sxemalarida kvadrat qavs ichidagi satrlar tuzilgan yozuvlarni yoki bajarilish vaqtida taqdim etilgan matnni bildiradi. C.5.2-bo'lim talab qilinadigan chiqish maydonlarini belgilaydi; D.2.2-bo'lim arxivlangan javoblarni va bog'langan nomzod vazifalarni taqdim etadi.&lt;/p&gt;\n&lt;h4 id=\"umumiy-ilmiy-korsatmalar-qisqartirilgan\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#umumiy-ilmiy-korsatmalar-qisqartirilgan\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy ilmiy ko'rsatmalar (qisqartirilgan)&lt;/span&gt;&lt;/a&gt;Umumiy ilmiy ko'rsatmalar (qisqartirilgan)&lt;/h4&gt;\n&lt;p&gt;Qarorlar qabul qilish jarayoni nishonlar haqidagi oldindan taxminlarsiz, taqdim etilgan natijalar va cheklovlarga asoslandi. Asosiy maqsad sarflangan ishchi soatiga to'g'ri keladigan yangi TM0.6 SU miqdorini maksimal darajaga yetkazish edi. Usullar va konfiguratsiyalarni taqqoslashda oilaviy yakunlardan oldin aniq marshrut natijalari va to'liq xarajatlardan foydalanildi (S6-jadval). Takroriy vazifalar qo'shimcha SU bermadi, boshlanmagan yoki o'lchanmagan vazifalar esa xato emas, balki hal etilmagan ma'lumot sifatida qaraldi. Yordamchi o'lchovlar qo'shimcha tekshiruvlarga yo'naltirildi, biroq ularning o'lchov manbalari alohida saqlandi. Natijalar, talqinlar va keyingi qadamlar uchta reasoning_trace maydonida tushuntirildi.&lt;/p&gt;\n&lt;p&gt;Kampaniya darajasidagi vaqt o'lchovlari bo'sh turgan vaqtni ham qo'shib, GPU ishchi soatlarida hisoblandi, marshrutlar uchun esa to'liq xarajatlar ishlatildi (S6-jadval). Kompleks marshrutlar uchun taxminan 0.5 GPU soat, kechiktirilgan yoki qimmatroq yo'nalishlar uchun (jumladan BindCraft, BoltzGen, ProteinMPNN redesign va Complexa MCTS) 1.5–2 soat vaqt yo'riqnomasi sifatida berildi.&lt;/p&gt;\n&lt;h4 id=\"planner-tizimi-korsatmalari-qisqartirilgan\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#planner-tizimi-korsatmalari-qisqartirilgan\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Planner tizimi ko'rsatmalari (qisqartirilgan)&lt;/span&gt;&lt;/a&gt;Planner tizimi ko'rsatmalari (qisqartirilgan)&lt;/h4&gt;\n&lt;p&gt;Planner eng so'nggi ma'lumotlarga asoslanib bittadan to'rtagacha tekshiriladigan gipoteza kartalarini taklif qildi. Har bir karta da'vo, dalillar, harakat oilalari va parametrlarni, shuningdek pLDDT, iPAE yoki binder scRMSD ko'rsatkichlarining o'zgarish prognozlarini o'z ichiga oldi. Prognozlarga ko'ra, pLDDT oshishi, iPAE va binder scRMSD esa kamayishi kerak edi. Zaif tomonlarga mos ravishda harakatlar tanlandi: scRMSD uchun ketma-ketlikni qayta loyihalash, iPAE uchun interfeys yoki karkas qidiruvi, past pLDDT uchun esa regeneratsiya yoki pLDDT bo'yicha qidiruv ishlatildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Planner L0–L4 tartibini qat'iy ketma-ketlikda emas, balki moslashuvchan ustuvorlik sifatida ishlatdi: boshlang'ich qamrovdan (L0) tortib, oila ichidagi sozlamalarni o'zgartirish (L1), ota-ona liniyalarini qayta ishlash (L2), mukofot og'irliklarini sozlash (L3) va qimmatroq qidiruvlarni kengaytirishgacha (L4).&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Planner dinamik so'rovi evidence, active_hypotheses, seed_action_families, available_families_this_cluster, family_role_table, allowed_params_per_family, eval_budget_per_family va instructions maydonlarini o'z ichiga olgan JSON sxemasi asosida ishladi. Deterministik maslahat bayroqlari qo'shimcha Critic LLM chaqiruvini talab qilmagan holda uzatildi (C.5.4-bo'lim) va faqat takliflar uchun mo'ljallandi.&lt;/p&gt;\n&lt;h4 id=\"supervayzer-korsatmalari-va-promptlar\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#supervayzer-korsatmalari-va-promptlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Supervayzer ko'rsatmalari va promptlar&lt;/span&gt;&lt;/a&gt;Supervayzer ko'rsatmalari va promptlar&lt;/h4&gt;\n&lt;p&gt;Supervayzer modeli resurslarni taqsimlash ulushlarini (R/E/X) aniqlash hamda vazifalarni reytinglash uchun joriy dalillar, gipoteza kartochkalari va yaroqli nomzod vazifalardan foydalanadi. Taqsimot qiymatlari chekli, manfiy bo'lmagan va yig'indisi birga teng bo'lishi shart. Ular grafik protsessorlarning (GPU) vaqt ulushlariga emas, balki kelgusidagi generatsiya va qayta loyihalash boshlanishlariga taalluqlidir. Reytinglash uchun faqat taqdim etilgan nomzod identifikatorlaridan foydalaniladi va ularning har biri 1 dan N gacha bo'lgan noyob global rangga ega bo'ladi. 1-rang keyingi ishchi jarayon uchun eng ustuvor tanlovni bildiradi. Boshqa shartlar teng bo'lganda, tizim to'liq aniq marshrut qiymati bo'yicha so'nggi yangi SU birliklariga ustunlik beradi. Ishlash samaradorligi taqqoslanadigan marshrutlar orasida quyi kvartil malaka marjasi baland bo'lgan variant, so'ngra uning mediasi tanlanadi (C.4.3-bo'lim).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;R/E/X taqsimoti — ilmiy eksperimentlarni optimallashtirish uchun hisoblash resurslari va vazifalarni ehtimolliklar yoki vaznlar yordamida boshqarish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Siyrak to'ldirilgan hisoblagichlarga ehtiyotkorlik bilan yondashiladi, chunki yuqori sifat samaradorlikdagi sezilarli ortqada qolishni qoplamaydi. O'ziga xos diagnostika ma'lumotlarini tekshirish tub generatorning qabul qilinishini malaka sifatida hisobga olmagan holda, asosli keyingi qadamni tanlash imkonini beradi. Taklif etilgan ulushlar vazifalarning joriy ustuvorliklariga mos kelishi kerak. Joriy ehtiyojlarni talqin qilish uchun kampaniya holati, struktura takrorlanishi, yangi SU bo'lmagan vaqt, kutilayotgan ishlar va tasdiqlangan boshlanishlar qo'llaniladi. Tanlangan, ammo boshlanmagan vazifa muvaffaqiyatsiz ilmiy sinov emas, balki bajarilish navbatida turgan vazifa hisoblanadi. AF2 yordamida majburiy baholash aniq qoidalarga bo'ysunadi va tilli modelning R/E/X taqsimotiga kirmaydi.&lt;/p&gt;\n&lt;p&gt;Supervayzerning dinamik foydalanuvchi prompti dalillar dayjestini (EVIDENCEDIGEST), aralashtirish yo'riqnomasini (MIXTUREGUIDANCE) va JSON formatidagi tuzilmani o'z ichiga oladi. Validatsiya xatosi yuz berganda, har bir nomzod ID'si aniq BITTA rejimda bo'lishini va barcha nomzodlarga 1..N oralig'ida noyob global rang berilishini talab qiluvchi shartli tuzatish xabari yuborilishi mumkin. Bu tuzatish C.5.2-bo'limda tavsiflangan xatolar uchun bir marta yuborilishi mumkin.&lt;/p&gt;\n&lt;h4 id=\"chaqiruv-shartlari-va-maslahat-tekshiruvlari\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#chaqiruv-shartlari-va-maslahat-tekshiruvlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Chaqiruv shartlari va maslahat tekshiruvlari&lt;/span&gt;&lt;/a&gt;Chaqiruv shartlari va maslahat tekshiruvlari&lt;/h4&gt;\n&lt;p&gt;Rejalashtiruvchining sakkiz kartochkali xotirasi har bir karta uchun eng so'nggi yozuvdan foydalangan, bunda faol kartalarga, shuningdek yaqinda qo'llab-quvvatlangan yoki rad etilgan kartalarga ustunlik berilgan, eskirgan kartalar esa chiqarib tashlangan. Noto'g'ri, bo'sh yoki betaraf javoblar yangi kartalar yaratmagan, shuning uchun tizim saqlangan kartalar va qoidalar bo'yicha kiritilgan nomzodlarga tayangan. Rad etilgan yoki tugatilgan kartalar yangi nomzodlarni keltirib chiqara olmagan. C.9-bo'lim karta holati va hayot siklini belgilaydi. Supervayzer bo'sh bo'lmagan karta ro'yxati va yaroqli nomzodlar havzasi bilan chaqirilgan, aks holda nazoratchi chaqiruvni o'tkazib yuborgan sababini qayd etgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Deterministik tekshiruv — ehtimollik yondashuvlaridan foydalanmagan holda ma'lumotlarni qat'iy qoidalar bo'yicha tekshirish protsedurasi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Yoqilgan deterministik maslahat tekshiruvi rejalashtiruvchining kartalarni o'z ichiga olgan yaroqli javobi ustidan ishga tushirilgan. U oldindan hisoblangan bajarilish vaqti qolgan ish vaqtidan oshib ketgan oilalarni belgilagan. Shuningdek, bir xil oiladagi saqlangan muvaffaqiyatsiz retsept bilan kamida ikkita umumiy parametr bo'yicha mos keladigan konfiguratsiyalar aniqlangan. Barcha umumiy qiymatlar mos kelishi, retsept kamida ikkita muvaffaqiyatsiz avlodga ega bo'lishi va uning xeshi saqlangan muvaffaqiyatli retseptlar orasida bo'lmasligi kerak edi. Tekshiruv joriy kartalar, nomzodlar va tanlovni o'zgartirmagan. Bayroqlar nollik token va nollik kechikishga ega LLM chaqiruv yozuvi sifatida saqlangan (S15-jadval, A qism).&lt;/p&gt;\n&lt;h4 id=\"nomzodlarni-qurish-va-validatsiya-qilish\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#nomzodlarni-qurish-va-validatsiya-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nomzodlarni qurish va validatsiya qilish&lt;/span&gt;&lt;/a&gt;Nomzodlarni qurish va validatsiya qilish&lt;/h4&gt;\n&lt;p&gt;Tekshirish va yig'ish (Check + Build) jarayoni harakat oilalari, taklif qilingan sozlamalar va talab qilinadigan ota-ona elementlarni harakatlar reyestri va arxivi bilan moslashtirish orqali gipoteza kartochkalarini nomzod vazifalarga aylantiradi. Validatsiya ruxsat etilgan sozlamalarni saqlab qoladi, qo'llab-quvvatlanmaydigan yozuvlarni olib tashlaydi va raqamli qiymatlarni chegaralarga moslashtiradi (S5-jadval). Tuzatib bo'lmaydigan vazifalar yaroqsiz bo'lib qoladi. Ota-ona chegaralarini qayta loyihalash va baholash yaroqli maqsadli va bog'lovchi zanjirlarga ega hal qilinadigan tuzilmani talab qiladi. C.8-bo'lim navbat va boshlanish vaqtini tekshirish jarayonlarini tavsiflaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Nomzodlarni validatsiya qilish — hisoblash eksperimentlariga ruxsat berishdan oldin yaratilgan vazifalar parametrlarining to'g'riligini avtomatik tekshirish jarayoni.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"c62-complexa-konfiguratsiyasiga-qoshimchalar-va-almashtirishlar\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c62-complexa-konfiguratsiyasiga-qoshimchalar-va-almashtirishlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.6.2. Complexa konfiguratsiyasiga qo'shimchalar va almashtirishlar&lt;/span&gt;&lt;/a&gt;C.6.2. Complexa konfiguratsiyasiga qo'shimchalar va almashtirishlar&lt;/h4&gt;\n&lt;p&gt;O'lchovga asoslangan standart sozlamalar va aniqlashtirish. Asosiy o'lchov HypothesisCard'dagi birinchi bashorat qilingan o'zgarish bilan belgilanadi; agar u ko'rsatilmagan bo'lsa, iPAE sukut bo'yicha qo'llaniladi. Bashorat qilingan o'zgarishlar mavjud bo'lsa-yu, sozlamalar belgilanmagan bo'lsa, bog'lovchi domen scRMSD uchun &lt;a href=\"concepts/sequence-hallucination.html\"&gt;sequence hallucination&lt;/a&gt; yoki iPAE uchun adaptiv shovqin (sc_scale_noise = 0,30) qo'llaniladi. Ochko'z optimallashtirish (greedy optimization) yoqilganda yoki iteratsiyalar soni belgilanganda, sequence hallucination algoritmi tanlanadi. Mukofot og'irliklari (reward weights) bo'lmagan konfiguratsiyalar uchun bu algoritm tizim to'xtab qolganda (stalled, deep-stall) yoki strukturaviy dublikatlar mavjud bo'lganda tanlanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sequence hallucination — bu oqsil ketma-ketliklarini ma'lum bir strukturaga moslashtirish orqali yaratish usuli bo'lib, algoritm yangi aminokislota ketma-ketliklarini «xayoliy» tarzda hosil qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mukofot og'irliklarini o'zgartirish. Shovqin, harorat, nurning kengligi (beam width), namunalar yoki replikalar soni kabi parametrlarning o'zgarishi muhim qidiruv o'zgarishi hisoblanadi. Agar kuzatuvlar soni 32 tadan kam bo'lsa, mukofot og'irliklari olib tashlanadi (agar Complexa MCTS ishlatilmasa). 32 va undan ortiq kuzatuvlarda og'irliklar saqlanib qoladi. To'rttadan ortiq replikaga ega «best-of-n» konfiguratsiyalarida xotirani tejash uchun batch size 8 gacha cheklanadi.&lt;/p&gt;\n&lt;p&gt;Adaptiv namuna olish shovqini. Raqamli qo'shimchalar [L, U] diapazonining f ulushi sifatida L + (U - L)f formulasi bo'yicha qo'shiladi. Qiymatlar yaxlitlanadi. sc_scale_noise uchun f₀ ulushi guruhlardagi (pLDDT, iPAE, scRMSD) muvaffaqiyatsiz (F_g) va muvaffaqiyatli (S_g) kuzatuvlar asosida aniqlanadi. Boshlang'ich f₀ ulushi F_g va S_g chegaralariga qarab 0,50 dan 0,85 gacha o'zgaradi. ProteinMPNN (rMPNN) ma'lumotlari mavjud bo'lganda, f₀ qo'shimcha ravishda cheklanadi (masalan, rMPNN ≥ 0,50 bo'lganda 0,50 gacha). Signal bo'lmaganda 0,55 qiymati ishlatiladi, u chuqur to'xtab qolish holatida 0,65 gacha oshiriladi.&lt;/p&gt;\n&lt;p&gt;Qidiruv sozlamalarini tartibli qo'shish. Agar mukofot tekshiruvi o'zgarishni talab qilsa, tizim quyidagi tartibda sozlamalarni qo'shadi: 1) Complexa MCTS uchun n_simulations, exploration_prob va exploration_constant; 2) FK steering uchun harorat (dublikat bosimida 0,45, aks holda 0,30); 3) Boshqa Complexa oilalari uchun nurning kengligi (0,43) va replikalar (0,60); 4) Muayyan o'lchovlar (iPAE, scRMSD, pLDDT) uchun nurning kengligi, shovqin va sequence hallucination kombinatsiyalari; 5) Oxirgi navbatda nurning kengligi (0,35), replikalar (0,50) va shovqin (0,45) standart qiymatlari qo'llaniladi.&lt;/p&gt;\n&lt;h4 id=\"c63-qatuij-khoidalar-asosida-yaratilgan-khshimcha-nomzodlar\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c63-qatuij-khoidalar-asosida-yaratilgan-khshimcha-nomzodlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.6.3. Qатъий қоидалар асосида яратилган қўшимча номзодлар&lt;/span&gt;&lt;/a&gt;C.6.3. Qатъий қоидалар асосида яратилган қўшимча номзодлар&lt;/h4&gt;\n&lt;p&gt;PrespecifiedMCTSprobe. Қурувчи карта асосидаги вазифаларни қуйидаги номзодлар билан тўлдириши мумкин. Бу қўшимчалар валидация ва танловдан ўтиши шарт, уларнинг мавжудлиги ишга туширишни мажбурий қилмайди. Паст даражали далиллар ҳолатидан ташқари, у қийин нишонлар учун Proteina-Complexa'нинг вывод вақtidagi қидирув созламасидан мослаштирилган Complexa MCTS конфигурациясини қўшиши мумкин (Didi et al., 2026b). Бу қоида янги SU'сиз камида олти ишчи GPU-соатини ҳамда pLDDT'дан ўтмаган, лекин iPAE'дан ўтган дизайнни, ёки стандарт pLDDT ёки ёрдамчи binder-pLDDT кузатувларининг камида ярми муваффақиятсизлигини, шу билан бирга стандарт iPAE ёки ёрдамчи минимал iPAE, ipTM ёки ўртача ipSAE учун камида 25% муваффақиятли ёки унга яқин кўрсаткични талаб қилади. Бунда C.4.2-бўлимдаги тўхтаб қолиш вақти сигнали қўлланилади. Зонд 400 диффузия қадами, тўртта танланма, 16 талик батч ўлчами, 20 та MCTS симуляцияси, 0.5 қидирув эҳтимоллиги, 1.0 қидирув константаси ва 100 фильтр чегарасидан фойдаланади. Унинг iPAE ва pLDDT мукофот оғирликлари -1.0 ва 1.0 га тенг; sequence_hallucination эса очкўз оптимизация (greedy optimization), 15 та итерация ва greedy_percentage=5 дан фойдаланади. Конфигурация ва триггер барча нишонлар учун бир хил. Агар MCTS хулосасида SU, сўнгги яқин хатолар (near miss), 0.35 дан паст бўлган ёрдамчи диагностик яхшиланиш баҳоси бўлмаса ва кутиб турган стандартизация қилинган AF2 баҳолаши мавжуд бўлмаса, қўшимчалар камида учта маршрут GPU-соати ва ok ёки no_artifacts мақомидаги иккита ResultRecord'дан кейин тўхтатилади. Бу текширув оила хулосасига ёки агар у йўқ бўлса, энг юқори харажатли аниқ маршрутга асосланади.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MCTS ва pLDDT/iPAE — оқсил тузилмаси сифатини баҳолаш ва қидирув алгоритмларининг асосий усуллари бўлиб, модель ноаниқликларини аниқлашга ёрдам беради.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Илгари баҳоланган конфигурациялар. Агар бирор яроқли номзод parent-bound ProteinMPNN қайта лойиҳалаш ёки ўзгартирилган модель, қайта фойдаланиш ва инициализация созламалари билан AF2 қайта букланишини таклиф қилмаса, қурувчи учтагача архивланган генерация конфигурациясини қайта киритиши мумкин. Бунда синовдан ўтмаган, фақат баҳолаш учун мўлжалланган, коллапс хавфи бор маршрутлар ва аллақачон иштирок этган конфигурациялар истисно қилинган ҳолда аниқ маршрут қаторлари қўлланилади. SU ёки яқин хато далилларига эга маршрутлар фақат ёрдамчи ютуққа эга бўлганлардан олдин келади. Уларнинг SU/GPU-соат тезлиги 3 GPU-соатлик, 6 GPU-соатлик ёки 60 ta yozuvdan iborat мос ойнадаги биринчи мавжуд тезлик ҳисобланади, шундан сўнг умрбод тезлик қўлланилади. Сўнгги SU ёки яқин хатолар бўлмаганда, маршрут камида 0.10 SU/GPU-соатни талаб қилади ва ҳар қандай сўнгги ойнада камида битта маршрут GPU-соатидан кейин истисно қилинади. Янги SU'сиз 12 ишчи GPU-соатидан кейин, агар фақат умрбод маълумотлар қолса ёки унинг тезлиги харажатга асосланган ойналардан бирортасидан ҳам SU сони ва тезлигисиз 60 та ёзув ойнасидан олинган бўлса, у ҳам чиқариб ташланади. Ойналар ва маршрутлар таърифлари C.4.1 ва C.4.4-бўлимларда келтирилган. SU ва яқин хато далилларига эга бўлмаган маршрут, агар унинг натижалари алоҳида AF2 баҳолашини талаб қилса, кутиб турганлар бўлмаса, ёрдамчи диагностик яхшиланиш баҳоси камида 0.35 бўлса ва тўпланган маршрут харажати кўпи билан 6 GPU-соатни ташкил этса, қайта киритилиши мумкин. Унинг умумий мақом ҳолати dry_low_quality, dry_duplicate ёки collapse_risk бўлмаслиги керак. Умумий мақомни кечиктириш маршрутлари фақат шу ёрдамчи баҳо қоидаси орқали ўтишга ҳақли. Ҳар иккала йўл учун 60 ta yozuv тезликлари фақат маршрут қуйи оқимдаги AF2 баҳолаш харажатига ҳам, AF2 малака ролига ҳам эга бўлмаганда қўлланилади.&lt;/p&gt;\n&lt;p&gt;Бошқа генератор илдизларидан номзодлар. Устун илдиз — энг кўп тўпланган генератор-маршрут GPU вақтига эга бўлган генератор илдизидир (C.2.2-бўлим), бунда мавжуд бўлганда аниқ маршрут қаторлари, акс ҳолда оила хулосалари ишлатилади; тенглик ҳолатида лексикографик жиҳатдан катта илдиз номи танланади. Бу номзодларнинг мавжудлиги қоидаси учун жорий SU далили 3 ёки 6 GPU-соатлик ойнада шу илдиз учун ҳар қандай маршрут ёки оила хулосасида ижобий SU сони ёки тезлигини англатади. 60 та ёзув ҳисоби ёки тезлиги ҳам янги SU'сиз 12 ишчи GPU-соатидан олдин мос келади, лекин фақат қуйи оқимдаги AF2 баҳолаш харажатига ва AF2 малака ролига эга бўлмаган маршрутлар учун. Бу ойналар ва харажатлар C.4.1 ва C.4.2-бўлимларга амал қилади. Имкон қадар, қуйидагилардан бирортаси бажарилганда, яроқли номзод вазифалар ҳамда навбатдаги ёки бажарилаётган вазифалар орасида камида бошқа иккита илдиз иштирок этади:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Ҳолат паст далилли ёки тўхтаб қолган, кумулятив ва сўнгги SU сонлари ноль, камида 0.10 қайд этилган ишчи GPU-соати ва битта ResultRecord тўпланган; устун илдиз мавжуд ва унда жорий SU далиллари йўқ.&lt;/li&gt;\n&lt;li&gt;Ҳолат чуқур тўхтаб қолишдан иборат ва устун илдизда жорий SU далиллари йўқ.&lt;/li&gt;\n&lt;li&gt;Ҳолат тўхтаб қолган ёки структуравий дубликат коллапсида, янги SU'сиз камида олти ишчи GPU-соати ўтган ва устун илдизда жорий SU далиллари йўқ.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Ҳар қандай маҳсулдор ҳолатда, кичик талаб — сўнгги SU ўсиши мужобат бўлса, олдинги ўнта режалаштириш янгиланишларидан камида тўрттаси ноль SU ўсиши билан чуқур тўхтаб қолиш янгиланишлари бўлган ва кумулятив ўтказувчанлик ҳар бир ишчи GPU-соати учун кўпи билан 0.25 SU бўлганда битта бошқа илдиздир. Сўнгги ўсиш 60 та ёзув ойнасидан фойдаланади (C.4.2-бўлим). Қўшимча илдиз синалмаган ёки етарлича текширилмаган оилага, AF2 баҳолашини кутаётган оилага, ёки SU, сўнгги яқин хатолар, ижобий SU/GPU-соат ёки камида 0.35 бўлган ёрдамчи диагностик яхшиланиш баҳосига эга оилага эга бўлиши керак. Янги SU'сиз ўтган вақт шартлари тўхтаб қолиш вақти сигналидан фойдаланади, кумулятив ўтказувчанлик эса қайд этилган ишчи харажатига таянади (S6-jadval).&lt;/p&gt;\n&lt;h4 id=\"c7-supervajzer-ustuvorligi-va-deterministik-tanlov\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c7-supervajzer-ustuvorligi-va-deterministik-tanlov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.7. Супервайзер устуворлиги ва детерминистик танлов&lt;/span&gt;&lt;/a&gt;C.7. Супервайзер устуворлиги ва детерминистик танлов&lt;/h4&gt;\n&lt;p&gt;Супервайзерни рейтинглаш кўрсатмалари. Супервайзер номзод вазифаларни Rescue, Explore ва eXploit бўйича рейтинглайди ва уларнинг керакли тақсимлаш пропорцияларини таклиф қилади. Унга аниқ маршрутларни сўнгги SU/GPU-соат бўйича, талаб қилинган баҳолаш харажатларини қўшган ҳолда солиштириш кўрсатилган. Иккала тезликнинг пайти кўпининг 85% дан кам бўлмаганда, у онлайн сифат баҳосининг q (C.4.3-бўлим) юқорироқ 25-перцентилини, сўнгра медианасини афзал кўриши керак. Сўров кам кузатувлар ёки кам ҳисоблаш ресурслари билан эҳтиёткорликни талаб қилади; у бу солиштириш учун қўшимча минимал танланма сонини юкламайди. Бу сифат оралиғидан ташқарида, сифат самарадорликдан устун келмайди. Арзонроқ маршрут етарли сифат билан солиштирилмаган ёки каттароқ SU/GPU-соат берса, қимматроқ маршрутдан олдин келиши керак. Кўрсатмалар, шунингдек, янги SU'сиз олти ишчи GPU-соатидан кейин кўпроқ диверсификация қилишни талаб қилади ва ўн иккитадан кейин яқин хатоларни етарли прогресс сифатида қабул қилишни тавсия этмайди. Чўзилган чуқур тўхтаб қолишдан чекланган тикланишдан кейин улар бошқа генератор илдизини кўриб чиқишни давом эттиришни сўрайди. Булар LLM учун кўрсатмалар ҳисобланади; C.6.3 ва C.8.2-бўлимлар алоҳида номзодларнинг мавжудлиги ва параллеллик қоидаларини белгилайди. D.2.2-бўлимда архивдаги устуворлик мисоли келтирилган.&lt;/p&gt;\n&lt;h4 id=\"c71-javoblarni-qayta-ishlash-va-taqsimlash-chegaralari\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c71-javoblarni-qayta-ishlash-va-taqsimlash-chegaralari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.7.1. Javoblarni qayta ishlash va taqsimlash chegaralari&lt;/span&gt;&lt;/a&gt;C.7.1. Javoblarni qayta ishlash va taqsimlash chegaralari&lt;/h4&gt;\n&lt;p&gt;S8B-jadvalda yaroqli Supervisor global tartibi, global tartibsiz maqbul taqsimot nisbatlari va zaxira varianti (fallback) ajratib ko'rsatilgan. Uzatiladigan zaxira sababi Supervisor nisbatlarini A qismidagi holatga bog'liq qiymatlar bilan almashtiradi va uning global tartibini o'chirib qo'yadi. Saqlangan kartochkalar nomzodlarni taqdim etishda davom etishi mumkin. Agar javob alohida nomzodlar qarorlarini saqlab qolsa, ularning ustuvorlik doirasidagi o'rinlari va resurs sinflari quyida tavsiflangan qat'iy tartibga kiritilishi mumkin. Nomzodga xos xatolar faqat o'sha nomzodga ta'sir qiladi. Ishonchlilikni qayd etish C.5.1-bo'limga amal qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Zaxira varianti (fallback) va taqsimlash chegaralari til modeli (LLM) javoblarida xatoliklar yoki past aniqlik yuzaga kelganda resurs ulushlarini (Rescue, Explore, eXploit) avtomatik ravishda moslashtiradigan algoritmik himoya mexanizmlaridir.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Taqsimlash chegaralari. Istalgan nisbatlar S8C-jadvaldagi asosiy yoki shartli chegaralar yordamida normallashtiriladi va tuzatiladi. Shartli chegaralar zaxira varianti mavjud bo'lganda, o'rnatilgan yoki strukturaviy dublikatni qisqartirish holatlarida, strukturaviy kontsentratsiya kamida 0.50 bo'lganda, xabar qilingan Supervisor ishonchliligi 0.65 dan past bo'lganda yoki oxirgi to'rtta mavjud LLM qo'ng'iroq yozuvlarining kamida 30% qismi zaxira varianti yoki OK bo'lmagan tahlilni ko'rsatganda qo'llaniladi. Ishonchlilikning yo'qligi va chuqur to'xtash (deep stall) holatining o'zi ularni faollashtirmaydi. Ushbu chegaralar keyingi tasdiqlangan boshlashlarning istalgan ulushlarini cheklaydi; global tartib va nomzodlarning mavjudligi amalga oshirilgan boshlash ulushlari hamda GPU vaqtini o'zgartirishi mumkin. Strukturaviy kontsentratsiya oxirgi 60 ta ResultRecords yozuvidagi mavjud dominant klaster ulushlarining kattasidir: onlayn strukturaviy tayinlangan barcha yozuvlar orasida yoki malakali klaster tayinlangan malakali yozuvlar orasida. Malakali ulush faqat kamida to'rtta tayinlangan malakali yozuv bo'lganda qo'llaniladi (bular yozuvlar, to'rtta alohida SU emas). Shartli chegaralar ostida ikkala mahsuldor holatlar to'plamidagi ≥ 0.50 kontsentratsiya eXploit yuqori chegarasini 0.60 ga, Explore oralig'ini 0.20–0.40 ga o'rnatadi va boshqa chegaralarni saqlab qoladi. Yaqin xatolar bilan boyitilgan holatda (near-miss-enriched) ≥ 0.70 kontsentratsiya Rescue pastki chegarasini saqlagan holda Explore yuqori chegarasini 0.50 gacha oshiradi. Bu chegaralar C.4.5-bo'limdagi 0.75 to'xtash holati testidan farq qiladi.&lt;/p&gt;\n&lt;h4 id=\"rescue-explore-exploit\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#rescue-explore-exploit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rescue Explore eXploit&lt;/span&gt;&lt;/a&gt;Rescue Explore eXploit&lt;/h4&gt;\n&lt;p&gt;Past dalillar 0.30 0.35 0.35&lt;br /&gt;\nMahsuldor 0.25 0.10 0.65&lt;br /&gt;\nDublikatli mahsuldor 0.35 0.10 0.55&lt;br /&gt;\nStrukturaviy dublikatni qisqartirish 0.15 0.75 0.10&lt;br /&gt;\nYaqin xatolar bilan boyitilgan 0.50 0.20 0.30&lt;br /&gt;\nTo'xtab qolgan 0.35 0.45 0.20&lt;br /&gt;\nChuqur to'xtash 0.30 0.50 0.20&lt;/p&gt;\n&lt;h4 id=\"b-xatolarni-qayd-etish-va-tanlov-siyosatini-hal-qilish\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#b-xatolarni-qayd-etish-va-tanlov-siyosatini-hal-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;B. Xatolarni qayd etish va tanlov siyosatini hal qilish&lt;/span&gt;&lt;/a&gt;B. Xatolarni qayd etish va tanlov siyosatini hal qilish&lt;/h4&gt;\n&lt;p&gt;Hal qilingan yo'l — Tanlash xulq-atvori. Supervisorning yaroqli global o'rinlari; uzatilgan zaxira sababi yo'q: uning taqsimot nisbatlari va joriy global tartibi ishlatiladi (qisqaroq tartib faqat qaytarilgan kichik to'plamni saralaydi). Yaroqli global tartibsiz yaroqli nisbatlar; zaxira sababi yo'q: yaroqli global tartib yo'q, tuzatilgan nisbatlar va o'tkaziladigan taqsimot farqi ustuvorlik kvotalarini boshqaradi. Yaroqsiz yoki betaraf Supervisor: holatga bog'liq zaxira nisbatlari va kvota tanlovi ishlatiladi; global tartib ishlatilmaydi. Rejalashtiruvchi sababi (planner_invalid, planner_abstain yoki planner_empty_cards): bu sabablar hatto yaroqli Supervisor javobi orqali ham tarqatiladi — zaxira nisbatlari ishlatiladi va global tartib o'chiriladi (ustuvorlik ichidagi saqlangan o'rinlar qat'iy hovuz tartibiga kirishi mumkin, C.7.2-bo'lim). Boshqa Rejalashtiruvchi sabab satrlari o'z-o'zidan bu tarqalishni faollashtirmaydi. Bir nomzod muvofiqlik yoki jonli boshlash tekshiruvidan o'ta olmaydi: o'sha nomzod rad etiladi yoki kechiktiriladi; qolgan takliflar o'z tekshiruvlarini saqlab qoladi (bu hodisa o'z-o'zidan global javob zaxirasini yaratmaydi). Yaroqli chiqish bilan past ishonchlilik: odatiy javob yo'li saqlanadi, ishonchlilik audit qilinadi va alohida shartli chegara testlari qo'llaniladi.&lt;/p&gt;\n&lt;h4 id=\"c-normallashtirilgan-istalgan-taqsimot-nisbatlariga-qoyiladigan-chegaralar\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c-normallashtirilgan-istalgan-taqsimot-nisbatlariga-qoyiladigan-chegaralar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C. Normallashtirilgan istalgan taqsimot nisbatlariga qo'yiladigan chegaralar&lt;/span&gt;&lt;/a&gt;C. Normallashtirilgan istalgan taqsimot nisbatlariga qo'yiladigan chegaralar&lt;/h4&gt;\n&lt;p&gt;Kompaniya holati — Asosiy chegaralar — Shartli chegaralar. Past dalillar: E ≥ 0.05 / E ≥ 0.05. Mahsuldor: X ≤ 0.95, E ≥ 0.05 / 0.45 ≤ X ≤ 0.80, R ≥ 0.10, 0.05 ≤ E ≤ 0.20. Dublikatli mahsuldor: X ≤ 0.90, E ≥ 0.05 / 0.40 ≤ X ≤ 0.70, R ≥ 0.20, 0.05 ≤ E ≤ 0.30. Strukturaviy dublikatni qisqartirish: X ≤ 0.30, E ≥ 0.45 / X ≤ 0.20, R ≤ 0.30, E ≥ 0.55. Yaqin xatolar bilan boyitilgan: R ≥ 0.10 / R ≥ 0.40, E ≤ 0.30. To'xtab qolgan: X ≤ 0.35, R ≥ 0.25, E ≥ 0.25 / asosiy chegaralar bilan bir xil, shartli chegaralar doimo qo'llaniladi. Chuqur to'xtash: X ≤ 0.40, E ≥ 0.35 / X ≤ 0.30, R ≥ 0.15, E ≥ 0.45.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Kutishdagi AlphaFold2 (AF2) ishlari va navbat sig'imi qoidalari hisoblagichning sig'imga nisbatini baholash orqali yuqori yuklama paytida Rescue pastki chegarasini dinamik ravishda bekor qilishga imkon beradi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kutishdagi AF2 ishlari va Rescue pastki chegarasidan voz kechish (Rescue-floor waiver). K^* qo'shimcha navbat pozitsiyalariga ega yangilanish uchun ushbu tekshiruv &lt;span class=\"yfm-latex\" data-content=\"4%20%5Cmax(1%2C%20K%5E*)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; sig'imidan foydalanadi. U bog'langan ResultRecord yozuviga ega bo'lmagan tanlangan yoki boshlangan alohida AF2 nomzod ishlarini sanab chiqadi. Qayd etilgan dispetcherlik yoki tahlil xatolari yuqori narxli ishlayotgan ishlar limiti tufayli yuzaga kelgan kechiktirishlardan tashqari nomzodlarni olib tashlaydi. Hisoblagich/sig'im nisbati ≥ 0.5 bo'lganda, Rescue pastki chegarasidan voz kechiriladi. Bu hisob tayyor navbat uzunligidan va baholanmagan dizaynlar sonidan alohida turadi (C.8.1-bo'lim). Boshqaruvchi diapazondan tashqaridagi nisbatlarni o'z chegaralarigacha qisqartiradi va qolgan ulushni chegarada saqlanmaydigan ustuvorliklar o'rtasida mutanosib ravishda qayta taqsimlaydi; nolga teng qolgan kirish og'irligi teng ulushlarni beradi. Tuzatish ko'pi bilan besh marta takrorlanadi. Ushbu tuzatishlar nomzodlarning yaroqliligini o'zgartirmasdan, taqsimot maqsadlarini o'zgartiradi. Navbat sig'imi va ishchilarning mavjudligi alohida miqdorlar bo'lib qoladi (S1-algoritm).&lt;/p&gt;\n&lt;h4 id=\"c73-boshlanishlar-boyicha-taqsimot-va-kvota-kafolatlari\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c73-boshlanishlar-boyicha-taqsimot-va-kvota-kafolatlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.7.3. Boshlanishlar bo'yicha taqsimot va kvota kafolatlari&lt;/span&gt;&lt;/a&gt;C.7.3. Boshlanishlar bo'yicha taqsimot va kvota kafolatlari&lt;/h4&gt;\n&lt;p&gt;O'tkazilgan taqsimot farqi. Moslashtirilgan proporsiyalar p = (p_R, p_E, p_X) uchun kontroller arxivlangan qarorlar va boshlanishlardan kelib chiqib, o'tkazilgan taqsimot farqi d ni tiklaydi. Har bir arxivlangan yangilanishda u ushbu yangilanish proporsiyalarini uning tasdiqlangan generatsiya/redizayn ishga tushirish niyati soni yoki bog'langan tasdiqlangan boshlanishlar sonining kattasiga ko'paytirib qo'shadi, so'ngra mos ustuvorlikdan har bir tasdiqlangan boshlanish uchun birni ayirib tashlaydi. Har bir komponent har bir yangilanishdan keyin [-3, 3 oralig'iga cheklanadi. Shuning uchun hech qachon boshlanmaydigan tasdiqlangan yoki navbatga qo'yilgan vazifa amalga oshirilgan taqsimot sifatida hisobga olinmaydi. Global tartibdagi yangilanishlar o'z proporsiyalari va boshlanishlarini xuddi shu rekonstruksiyaga qo'shadi, garchi kvotalar ularning bevosita tanlanishini boshqarmasa ham. K^* ta pozitsiyaga ega kvota yangilanishi uchun $m \\in {R, E, X$ bo'lganda vaqtinchalik taqsimot farqlari d_m + K^* p_m ni tashkil qiladi va [-3, 3] oralig'iga cheklanadi. Har bir pozitsiya eng katta farqga ega bo'lgan mos keladigan ustuvorlikka tayinlanadi; olti o'nlik raqamgacha yaxlitlangandan keyingi tengliklarda kattaroq p_m ga, so'ngra eXploit, Rescue, Explore toifalariga ustunlik beriladi. Har bir tayinlash ushbu vaqtinchalik farqdan birni ayiradi. Bunday dastlabki ayirishlar joriy kvotalarni taqsimlaydi; keyingi rekonstruksiya tasdiqlangan boshlanishlardan foydalanadi. Mos keladigan nomzodlari bo'lmagan ustuvorliklar kvota olmaydi va foydalanilmagan pozitsiyalar C.7.2-bo'lim орqali to'ldirilishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;O'tkazilgan taqsimot farqi va kvotalar mexanizmi bajarilmagan vazifalarni kuzatib boradi va resurslarni resurslar bandligi bo'yicha adolatli taqsimlashni ta'minlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mahsuldor hisoblashlarni saqlab qolish. Kvota yo'lida bitta eXploit pozitsiyasi mahsuldor, takrorlanish bilan mahsuldor yoki muvaffaqiyatga yaqin natijalar bilan boyitilgan holatlarda saqlab qolinishi mumkin, agar to'xtab qolish vaqti ko'pi bilan 6 worker GPU-soatni tashkil etsa, oldingi eXploit taqsimoti bitta boshlanishdan ko'proqqa oshmagan bo'lsa va munosib nomzod ijobiy yo'nalishga yoki yaqindagi oilaviy SU/GPU-soat unumdorligiga ega bo'lsa. 3-GPU-soatlik ijobiy tezlikka yoki 3-/6-GPU-soatlik SU o'sishiga ega bo'lmagan dry_duplicate yorliqli qayta ishlatiladigan konfiguratsiyalar faqat yo'nalish tezligi bo'yicha kvotaga da'vogarlik qila olmaydi. Strukturaviy dublikatlar qulashi bu himoya chorasining oldini oladi. To'xtab qolish vaqti C.4.2-bo'limga amal qiladi. Kamida uchta pozitsiya, ko'pi bilan 3 worker GPU-soat to'xtab qolish vaqti va kampaniyaning so'nggi o'tkazuvchanligi ≥ 0.50 SU/GPU-soat yoki kamida ikkilik SU o'sishi bo'lganda, kvota ikkita eXploit pozitsiyasini saqlab qolishi mumkin. O'sish oldingi eng yuqori kümülatif SU soniga nisbatan o'sishni yoki bunday o'sish nolga teng bo'lganda yoki mavjud bo'lmaganda 60 ta yozuv bo'yicha o'sishni bildiradi. Ikkala yetakchi eXploit nomzodlari yuqori narxli oiladan tashqarida bo'lishi, past, diagnostik yoki standart taxminiy narxga ega bo'lishi, yuqoridagi qayta ishlatiladigan konfiguratsiya istisnosidan qochishi va ≥ 0.50 SU/GPU-soat yo'nalish yoki so'nggi oilaviy o'tkazuvchanlikka ega bo'lishi kerak. Talab qilinadigan AF2 baholashlari bu pozitsiyalarni ta'minlay olmaydi.&lt;/p&gt;\n&lt;p&gt;Kross-generator nomzodini saqlab qolish. Oddiy tanlovdan so'ng, kvota yo'li C.6.3-bo'limdagi kross-generator qoidasi tomonidan qo'shilgan bitta nomzodni saqlab qolishi mumkin. U foydalanilmagan pozitsiyani egallaydi yoki Ustuvorlik ichidagi rahbari 1 ga teng bo'lmagan nomzodni almashtiradi. BindCraft, BoltzGen yoki ProteinMPNN dan bo'lgan bunday nomzod yo'nalish bo'yicha kechiktirilgan hovuzdan tiklanmaydi, agar uning oilasida bog'langan standartlashtirilgan AF2 natijasiga ega bo'lmagan kamida source ResultRecords va shunday natijaga ega kamida to'rttasi bo'lsa, hamda oilaviy yoki mos keladigan yo'nalishdagi SU yoki muvaffaqiyatga yaqin natija va istiqbolli kutilayotgan struktura bo'lmasa. Ushbu cheklov ham kross-generator kafolatiga, ham ushbu hovuzdan odatiy to'ldirishga nisbatan qo'llaniladi. Boshlanish vaqti yaroqliligi va quvvatni tekshirishlar hamon C.8.2-bo'limga amal qiladi.&lt;/p&gt;\n&lt;h4 id=\"c8-baholashga-ruxsat-berish-va-worker-tomonidan-bajarish\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c8-baholashga-ruxsat-berish-va-worker-tomonidan-bajarish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.8. Baholashga ruxsat berish va worker tomonidan bajarish&lt;/span&gt;&lt;/a&gt;C.8. Baholashga ruxsat berish va worker tomonidan bajarish&lt;/h4&gt;\n&lt;p&gt;Generatsiya, redizayn va standartlashtirilgan AF2 baholashi uchta umumiy worker GPU'sini taqsimlaydi. Baholashga ruxsat berish qaysi dizaynlar umumiy malaka protokoliga kirishini aniqlaydi; navbatni boshqarish ularning ishlarini qachon boshlanishini belgilaydi. S2b-rasm va S1-algoritmlar ushbu alohida qadamlarni ko'rsatadi. Baholashni kutayotgan dizaynlar malaka xatosi sifatida hisobga olinmagan holda kutilish rejimida qoladi.&lt;/p&gt;\n&lt;h4 id=\"c81-standardized-af2-evaluation-admission-and-capacity\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c81-standardized-af2-evaluation-admission-and-capacity\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.8.1. Standardized AF2 evaluation: admission and capacity&lt;/span&gt;&lt;/a&gt;C.8.1. Standardized AF2 evaluation: admission and capacity&lt;/h4&gt;\n&lt;p&gt;Kontroller kiritish ma'lumotlarini ustuvorlashtirish uchun olingan o'lchovlar va oldingi yo'nalish natijalaridan foydalangan holda, generatsiya va qayta loyihalashga parallel ravishda AlphaFold2 standartlashtirilgan baholashni rejalashtiradi. Baholash manbasi oilasi baholash kirishini yaratgan generatsiya yoki qayta loyihalash oilasidir. BindCraft yoki Complexa turidagi struktura generator darajasidagi 0–100 shkalasidagi pLDDT ≥ 90, normallashtirilgan iPAE ≤ 7/31 va bog'langan ob'ektning &lt;a href=\"concepts/root-mean-square-deviation.html\"&gt;RMSD&lt;/a&gt; yoki scRMSD ko'rsatkichi &amp;lt; 1.5 Å bo'lganda vatindek o'xshash deb hisoblanadi. Boshqa vositalar uchun alohida istiqbolli signallar aniqlangan: BindCraft uchun bu generator tomonidan qabul qilingan chiqish yoki barcha uchta nativ o'lchovlarga ega bo'lgan va near-pass chegaralaridan tashqarida ko'pi bilan bitta mezonga ega ob'ekt; BoltzGen uchun — loyiha ipTM ≥ 0.80, loyiha-nishon ipTM ≥ 0.65, interfeys ipTM ≥ 0.65, minimal loyiha-nishon PAE ≤ 7 Å, struktura ishonchliligi ≥ 0.75 va nativ refold RMSD &amp;lt; 2.0 Å parametrlaridan kamida uchtasi; ProteinMPNN uchun — ketma-ketlikni tiklash ulushi 0.15 dan 0.85 gacha bo'lganda yoki ko'rsatilmaganda, qoldiqqa to'g'ri keladigan global yoki lokal manfiy logarifm ehtimolligi ≤ 1.20.&lt;/p&gt;\n&lt;p&gt;Kirishlar nativga o'xshash bo'lsa, ularning aniq yo'nalishi promote maqomiga ega bo'lsa, so'nggi SU o'sishi, tanlangan yo'nalishning ijobiy ulushi yoki healthy maqomi bilan birga so'nggi near miss qayd etilgan bo'lsa, eng yuqori baholash ustuvorligi beriladi. Har bir yo'nalish doirasida bunday kirishlar istiqbolli proxy-obyektlardan oldin keladi, diversify va defer/collapse_risk esa pastroq ustuvorlikka ega. Nativ baholashlar va barqaror identifikatorlar tengliklarni hal qiladi. Har bir aniq yo'nalish uchun kümülativ limit dastlab to'rtta standartlashtirilgan AF2 bahosini tashkil qiladi va dalillar bazasi yaxshilanganda 8, 16, 32, 64 gacha oshib, keyin ikki baravar ko'payishi mumkin. To'rttadan sakkiztaga o'tish qoidalarni chetlab o'tmagan holda ko'pi bilan to'rtta qo'shimcha baholashni qo'shishga imkon beradi. Chegarani oshirish uchun kontroller joriy xulosani oldingi sozlangan chegaradan oshmaydigan eng yaqin oldingi xulosa bilan taqqoslaydi. Oltita o'lchovdan kamida bittasi o'sishi kerak: yo'nalishga tegishli SU, individual near-miss natijalari soni, malakali klasterlar soni, onlayn sifat ko'rsatkichining 25-persentili yoki medianasi, yordamchi diagnostik yaxshilanish bali. Ko'rsatkichlarning o'sishi 10⁻⁶ dan oshishi kerak, diagnostik ball esa uchta o'nlik xonagacha saqlanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;AlphaFold2 standartlashtirilgan baholashi va pLDDT, iPAE, RMSD, ipTM, PAE kabi metrikalar neyrotarmoq algoritmlari yordamida yaratilgan oqsil strukturalarini fizik sintezdan oldin avtomatik filtrlash va eng sifatlilarini tanlab olishda qo'llaniladi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Odatiy qabul qilish joriy etilmagan baholashlar uchun ishga tushirilgan va allaqachon tanlangan vazoblarni hisobga olgan holda har bir baholash manbasi oilasiga ko'pi bilan 24 ta ruxsat beradi. Oilaning bir xil rejalashtirish-yangilash identifikatori ostidagi umumiy tasdiqlari qo'llab-quvvatlanmaydigan nomzod uchun to'rtta yoki dalillar bazasi bilan ta'minlangan nomzod uchun o'n oltita chegara bilan taqqoslanadi; bu kvotalar qo'shilmaydi. Kamida 20 ta ishga tushirish qayd etilgandan so'ng, zaxiralash tizimi standartlashtirilgan AF2 ishga tushirishlari sonini oxirgi 40 ta mavjud ishga tushirish orasida 24 chegarasi bilan taqqoslaydi (mahsulotli takrorlanish yoki strukturali takrorlanishlar kollapsi holatlarida 20 gacha kamaytiriladi). 20 ta ishga tushirishdan oldin tegishli chegaralar 12 va 10 tani tashkil etadi. Agar ushbu budjet tugagan bo'lsa, mavjud nativga o'xshash kirishlar ko'pi bilan ikkita pozitsiya uchun yoki chuqur turg'unlik holatida bitta pozitsiya uchun istisno qilishga imkon beradi.&lt;/p&gt;\n&lt;h4 id=\"navbatlarni-band-qilish\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#navbatlarni-band-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Navbatlarni band qilish&lt;/span&gt;&lt;/a&gt;Navbatlarni band qilish&lt;/h4&gt;\n&lt;p&gt;AlphaFold2 (AF2) vazifalari taqsimotdan oldin va navbatni qayta to‘ldirish jarayonida navbatning boshiga kiritilishi mumkin. Ushbu bosqichlar mos ravishda bo‘sh ishchilardan &lt;span class=\"yfm-latex\" data-content=\"F(%5Cmathcal%7BW%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; va navbat maydonidan &lt;span class=\"yfm-latex\" data-content=\"K(%5Cmathcal%7BQ%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; foydalanadi; birinchi usul navbat chuqurligini maqsadli qiymatdan vaqtincha oshirishi mumkin. Ikkala o‘tish ham har bir tsikl uchun bitta umumiy limitni baham ko‘radi, bu limit uchun ishlatiladigan kutilayotgan natijalar soni 32 taga yetganda ikkigacha oshiriladi. Bu sonni hisoblash uchun mavjud bo‘lganda nativsimon yoki proksi-va’dali natijalar ishlatiladi, aks holda barcha yaroqli baholanmagan natijalar olinadi. Har bir o‘tish ushbu tsikldagi avvalgi band qilishlarni ham, hozirda bajarilayotgan AF2 vazifalarini ham limitdan ayirib tashlaydi (S1-algoritm). Navbatda turgan AF2 vazifasi boshqa band qilishning oldini oladi. Shuningdek, har bir o‘tish mavjud pozitsiyalar va munosib nomzod vazifalarni tekshiradi.&lt;/p&gt;\n&lt;p&gt;Mahalliy chegara bunday pozitsiyalarning ko‘pi bilan yarmiga teng bo‘lib, yuqoriga qarab yaxlitlanadi va ikki yoki undan ortiq pozitsiya mavjud bo‘lganda bittasini band qilinmagan holda qoldiradi. Uning birdan ikkiga oshishi ushbu o‘tishda 32 ta munosib nomzodni talab qiladi, shuning uchun uchta ishchidan iborat sozlama bilan har bir o‘tish ko‘pi bilan bittasini qabul qiladi. Chuqur to‘xtash paytida, agar munosib natija hali ham AF2 bahosini kutayotgan bo‘lsa, umumiy limit bittaga teng bo‘ladi; nativsimon dalillar talab qilinmaydi. Yangilangan holat chuqur to‘xtashga kirganda navbatdagi ortiqcha band qilingan AF2 vazifalari bekor qilinadi. Baholanmagan natija mavjud bo‘lganda baholash uchun bitta bo‘sh pozitsiyadan foydalanish mumkin; aks holda bu pozitsiya generatsiya yoki qayta loyihalash uchun qoldiriladi. Ushbu qoidalar grafik protsessorni doimiy ravishda baholashga biriktirish o‘rniga navbat pozitsiyalarini band qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Navbatlarni boshqarish va taqsimlash qoidalari&lt;br /&gt;\nBu hisoblash resurslarini aqlli taqsimlash mexanizmi bo‘lib, u mavjud ishchilar, cheklovlar va tizim holatiga qarab AF2 vazifalarining navbatda joylashishini va ustuvorligini tartibga soladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"bosh-navbat-pozitsiyalarini-toldirish\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#bosh-navbat-pozitsiyalarini-toldirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bo‘sh navbat pozitsiyalarini to‘ldirish&lt;/span&gt;&lt;/a&gt;Bo‘sh navbat pozitsiyalarini to‘ldirish&lt;/h4&gt;\n&lt;p&gt;Generatsiya va qayta loyihalash tanlovidan so‘ng, agar navbatda joy qolgan bo‘lsa, tizim chuqur to‘xtash holatida bo‘lmasa va standart AF2 vazifasi navbatda turmagan yoki bajarilmayotgan bo‘lsa, bitta AF2 vazifasini qo‘shish mumkin. Bu yo‘l avval oddiy yo‘nalish ruxsatlaridan foydalanadi. Agar ular nomzod bermasa, u ruxsati tugagan yo‘nalishdan nomzodni tanlashi mumkin, bunda qo‘llab-quvvatlanmaydigan oilalar uchun kümülatif cheklov ham chetlab o‘tiladi. Har bir yangilanish uchun oilaviy cheklovlar va ishga tushirish tekshiruvlari o‘z kuchida qoladi. Ushbu istisno navbatning bo‘sh sig‘imidan foydalanadi; u yaxshilangan dalillarni ham keltirmaydi, yo‘nalish ruxsatini ikki baravarga oshirmaydi ham.&lt;/p&gt;\n&lt;h4 id=\"c82-navbatga-qabul-qilish,-ishga-tushirish-va-natijalarni-yigish\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c82-navbatga-qabul-qilish,-ishga-tushirish-va-natijalarni-yigish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.8.2. Navbatga qabul qilish, ishga tushirish va natijalarni yig'ish&lt;/span&gt;&lt;/a&gt;C.8.2. Navbatga qabul qilish, ishga tushirish va natijalarni yig'ish&lt;/h4&gt;\n&lt;p&gt;Navbatni to'ldirish. Nomzodlarga buyurtma berish va ularni taqsimlash C.7.2 va C.7.3-bo'limlarga mos ravishda bajariladi, C.6-bo'limda esa tasdiqlash amalga oshiriladi. Navbat hajmi &lt;span class=\"yfm-latex\" data-content=\"K(%5Cmathcal%7BQ%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; va bo'sh ishchilar &lt;span class=\"yfm-latex\" data-content=\"F(%5Cmathcal%7BW%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; S1-algoritmlarida aniqlangan. Rejalashtiruvchi barcha ishchilar band bo'lganda, birinchi maqsadli &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6fkcf5hy\"&gt;ResultRecord&lt;/code&gt; kelib tushgandan so'ng navbatni to'ldirishi mumkin; agar har bir ishchi band bo'lsa, undan oldin to'xtatib turiladi. Navbatdagi vazifalar yangi rejalashtirish chaqiruvlaridan oldin va navbatni to'ldirgandan so'ng yana algoritmdagi ikkita dispetcherlik nuqtasida boshlanishi mumkin.&lt;/p&gt;\n&lt;p&gt;Navbat tartibi va янги dalillar. Dispetcherlikdan oldin zarur AF2 vazifalari birinchi o'ringa qo'yiladi. Generatsiya va qayta loyihalash vazifalari o'zlarining yozib olingan annotatsiyalariga amal qiladi: so'nggi SU yoki yaqin muvaffaqiyatli (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dmi4g8l6\"&gt;near-miss&lt;/code&gt;) dalillar, diagnostik yaxshilanishlar, odatiy takliflar va oxirida faqat umrbod dalillar bilan qo'llab-quvvatlanadigan qayta ishlatiladigan konfiguratsiyalar. Guruh ichida tanlov yozuvlariga (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-crhi28w0\"&gt;selection records&lt;/code&gt;) ega vazifalar ularsizlardan ustun turadi; yangiroq tanlov yangilanishlari birinchi bo'lib keladi, mavjud navbat tartibi esa tenglikni hal qiladi. Ushbu tartib маршрут baholarini qayta hisoblash o'rniga nomzod va tanlov yozuvlaridagi annotatsiyalardan foydalanadi. Yangi natijalar yoki holatning o'zi oddiy navbatdagi vazifalarni o'chirib tashlamaydi. Istnose — har qanday natija paydo bo'lguncha past dalillarda tanlangan vazifalar: birinchi natija kelishi bilanoq, rejalashtiruvchi yangi dalillardan foydalanishi uchun bu navbatdagi vazifalar o'chirib tashlanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;BindCraft — bu yuqori resurs talab qiladigan oqsil dizayni usuli bo'lib, u uchun to'plangan hisoblash xarajatlari va o'tgan iteratsiyalarning muvaffaqiyatiga bog'liq qat'iy bir vaqtning o'zida bajarish cheklovlari amal qiladi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;BindCraft concurrency limiti. BindCraft — bu yuqori xarajatli oila bo'lib, bitta ishlaydigan vazifa uchun odatiy cheklovga ega. Tanlovda to'ldirish uchun birdan ortiq navbat pozitsiyasi bo'lsa, BindCraft-dan kamida bitta pozitsiya ushlab qolinadi; bu cheklov hatto muqobil variant bo'lmasa ham qo'llaniladi. Xuddi shunday, uchta ishchidan iborat hovuz ko'pi bilan ikkita bir vaqtning o'zida bajariladigan BindCraft vazifalariga ruxsat beradi. Ushbu parallellikni tekshirish uchun joriy marshrut dalillari 3 yoki 6 soatlik GPU oynasida musbat SU sonini, 3 soatlik GPU tezligini yoki ishonchli so'nggi yaqin muvaffaqiyatsizlikni anglatadi. Keyingi AF2 xarajatsiz va AF2 malaka rolisiz qatorlar ham 60 ta yozuvli SU sonidan va 3 soatlik GPU tezligi yo'qolganda uning tezligidan foydalanishi mumkin (C.4.1-bo'lim). Limit quyidagi shartlardan biriga ko'ra birdan ikkiga ko'tarilishi mumkin:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Oila dalillari: usul xulosasidagi ijobiy so'nggi to'g'ridan-to'g'ri yoki atributli SU/GPU-soat tezligi yoki ishonchli so'nggi yaqin muvaffaqiyatsizlik (C.4.1-bo'lim); muqobil ravishda, umrbod SU yoki yaqin muvaffaqiyatli dalillar, agar bu dalillar eskirib qolmagan bo'lsa, ≥ 0.25 SU/GPU-soat umrbod tezlikka ega.&lt;/li&gt;\n&lt;li&gt;Marshrut dalillari: oilaning eng yuqori tezlikdagi marshruti yoki oilaviy xulosalar kamida bitta SU, kamida 1.0 marshrut GPU-soati va joriy SU yoki yaqin muvaffaqiyatli dalillarni taqdim etadi. Ularning tezligi (eng katta joriy yoki umrbod qiymatni olib) kamida 0.10 SU/GPU-soat va joriy dalillarga ega raqobatdosh xulosalar orasidagi eng yaxshi joriy tezlikning 80% bo'lishi kerak. Teng eng yuqori tezlikdagi xulosalar uchun eng katta son va xarajat hamda joriy dalillarning mavjudligi qo'llaniladi.&lt;/li&gt;\n&lt;li&gt;To'xtab qolish vaqtida muqobilni sinab ko'rish: kamida 32 ta &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s9cgh1f0\"&gt;ResultRecord&lt;/code&gt;, yangi SUsiz kamida 0.75 ishchi GPU-soati va baholash oilasiga kirmaydigan eng yaxshi so'nggi tezlik past dalillar, to'xtab qolish, chuqur to'xtash yoki strukturaviy dublikat qulashi sharoitida 0.25 SU/GPU-soatdan past.&lt;/li&gt;\n&lt;li&gt;Kechiktirilgan startlar bilan takroriy ustuvorlikni belgilash: arxivlangan Supervayзер nomzod qarorlarida kamida oltita BindCraft yozuvi, startdan kirishga nisbati ≤ 0.35 va kamida bitta quvvat bo'yicha kechiktirilgan yoki tanlangan, ammo boshlanmagan vazifa. Holat past dalillar, to'xtab qolish, chuqur to'xtash yoki strukturaviy dublikat qulashi bo'lishi kerak yoki kampaniya to'rtta SU-dan kamroqqa ega bo'lishi kerak. Umrbod dalillar eskirgan bo'lmasligi kerak.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Umrbod dalillar, agar oilaviy yoki marshrut xulosalari joriy SU yoki ishonchli yaqin muvaffaqiyatli dalillarni saqlamasa va avval samarali bo'lgan xulosa kamida 1.0 so'nggi marshrut GPU-soatini to'plagan bo'lsa, eskirgan hisoblanadi. So'nggi oynalar C.4.1-bo'limiga amal qiladi; marshrut tezliklari C.4.2-bo'limiga amal qiladi. SU asosidagi targ'ibot u yerda tasvirlangan klasterlash tekshiruvini talab qiladi, yaqin muvaffaqiyatlar esa C.4.2-bo'limidan foydalanadi. 2–4-shartlar kamida 6 ta yozib olingan oilaviy GPU-soatdan keyin va to'g'ridan-to'g'ri yoki atributli SU yoki ishonchli umrbod/so'nggi yaqin muvaffaqiyatlarsiz bir martadan ortiq vaqt tugagandan so'ng bloklanadi. Limitni oshirish boshqa boshlanishiga ruxsat beradi, lekin vazifani tanlamaydi; navbatdagi vazifalar ishlayotgan vazifalar deb hisoblanmaydi.&lt;/p&gt;\n&lt;p&gt;Boshlash, kechiktirish va xatolar. Tasdiqlangan ishga tushirish qarorlari (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t87zqi3j\"&gt;Launch Decisions&lt;/code&gt;) navbatga qabul qilishga ruxsat beradi; dispetcherlik yozuvlari (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ivcy51p1\"&gt;Dispatch Records&lt;/code&gt;) ishga tushirish va bajarish hodisalarini yozib oladi (C.3-bo'lim). Boshlanishidan oldin, boshqaruvchi kerakli kirishlarni hal qiladi va joriy cheklovlarni qayta tekshiradi. Parallellikni kechiktirish urinishni sarflamasdan vazifani navbatga qaytaradi. Boshqa vaqtinchalik ishga tushirish xatolari barcha hozirda bo'sh bo'lgan ishchilar ko'rib chiqilgandan so'ng ko'pi bilan uch marta, jami to'rt marta takrorlanadi. Doimiy xatolar va tugagan urinishlar vazifani o'chirib tashlaydi. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0whyd6wx\"&gt;Dispatch Records&lt;/code&gt; terminal ishga tushirish xatolarini va quvvatni kechiktirishning alohida sabablarini saqlaydi; oraliq vaqtinchalik takroriy urinishlar har bir alohida yozuvni keltirib chiqarishi shart emas. Keyingi bajarilish yoki chiqishlarni yig'ish xatosi avval tasdiqlangan boshlanishni o'chirib yubormaydi.&lt;/p&gt;\n&lt;p&gt;Bosqichma-bosqich va yakuniy natijalarni yig'ish. Ishlayotgan BindCraft vazifalari C.8.3-bo'limidagi intervalda yangi chiqishlar uchun tekshiriladi. Faqat oldindan arxivlanmagan &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6hkorbov\"&gt;ResultRecords&lt;/code&gt; qo'shiladi. Natijalar qo'shilishidan oldingi ishchi vaqti yangi yozuvlar o'rtasida taqsimlanadi; yakuniy tahlil qolgan chiqishlarni yig'adi. Shunday qilib, ishlayotgan vazifa allaqachon qayd etilgan natijalar va xarajatlarga hissa qo'shishi mumkin. Arxivlangan chiqishlarni qayta o'qish ularni qaytadan qo'shmaydi. Agar yakuniy tahlil avvalgi natijalardan keyin yangi dizayn bermasa yoki umuman chiqish bermasa, sintetik yakunlash yozuvi ≥ 0.005 GPU-soat to'lanmagan qoldiqni yoki muvaffaqiyatsiz natijani saqlab qoladi. U boshqa dizaynni emas, balki xarajat va natijani ifodalaydi. Boshqa yo'l bilan allaqachon arxivlangan chiqishlarni muvaffaqiyatli qayta o'qish ikkinchi to'lovni qo'shmaydi. Ushbu chegaradan past bo'lgan muvaffaqiyatli, bo'sh tahlil buning o'rniga &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sfcffgvh\"&gt;ResultRecord&lt;/code&gt;-siz chiqishlarni yig'ish xatosini yozib oladi. Yakuniy tahlil istisnolari alohida yozib olinadi; kamida 0.005 o'tgan GPU-soatdan keyin xato yozuvi avvalgi qisman to'lovlar bilan ustma-ust tushishi mumkin bo'lgan to'liq o'tgan vazifa xarajatlarini saqlab qoladi. S6-jadval ushbu yozuvlarni boshqa hisoblash miqdorlaridan ajratib turadi.&lt;/p&gt;\n&lt;h4 id=\"c83-ishchi-vaqti-cheklovlari-va-xatoliklarni-qayta-ishlash\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c83-ishchi-vaqti-cheklovlari-va-xatoliklarni-qayta-ishlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.8.3. Ishchi vaqti cheklovlari va xatoliklarni qayta ishlash&lt;/span&gt;&lt;/a&gt;C.8.3. Ishchi vaqti cheklovlari va xatoliklarni qayta ishlash&lt;/h4&gt;\n&lt;p&gt;So‘rov va rejalashtirish xatoliklari. Faol kontroller iteratsiyalari odatda so‘rovlar orasida 5 s kutadi; rejalashtirilgan, navbatga qo‘yilgan, yuborilgan yoki bajarilayotgan vazifalari bo‘lmagan iteratsiya 120 s kutadi. Natijalar soni, ishchilarning mavjudligi, ishlayotgan ishchining 0.25 GPU-soat qadamgacha pastga yaxlitlangan qiymati hamda oilalar bo‘yicha navbatdagi/ishlayotgan vazifalar soni o‘zgarmagan bo‘lsa, keshinlangan kompaniya holatini hisoblash 60 s gacha qayta ishlatilishi mumkin. Holatni tekshirishdagi xatolik avvalgi holatni saqlab qoladi. To‘liq rejalashtirishni yangilash istisnosi allaqachon qo‘shilgan yozuvlarni saqlaydi, 60 s kutadi va qo‘shimcha qabul qilish yoki yuborishdan oldin tsiklni qayta ishga tushiradi. Qo‘shimcha BindCraft yig‘ish ishlari standart 600 s intervalda, pastki chegarasi 300 s bo‘lgan holda ishlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Keshinlash mexanizmlari resurslarni tejash uchun o‘zgarmas parametrlarni har safar qayta hisoblamaslikka imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Jarayon nazorat nuqtalari. Alohida nazorat nuqtasi barcha ishchilar band bo‘lgan holatlarni ham qo‘shib, o‘tgan kompaniya vaqtini va monitoring dalillarini standart 60-s intervalda saqlaydi. Mahalliy yoki istiqbolli dizaynlar standartlashtirilgan AF2 bahosini kutayotganda va standart AF2 vazifasi bajarilayotganda, nazorat nuqtasi joriy dalillarni qayta hisoblaydi va kompaniya holatini yangilashi mumkin. Aks holda, u eng so‘nggi arxivlangan xulosadan foydalanadi va o‘tgan vaqtni yangilaydi. Nazorat nuqtalari JSONL tarixiga EvidenceSummary qo‘shmaydi va LLM ni chaqirmaydi.&lt;/p&gt;\n&lt;p&gt;Vazifa vaqti cheklovlari. Cheklovlar bitta ishchi uyasi uchun o‘tgan soniyalardir. ComplexaBeam, best-of-n va FK vazifalari 5,400 s chegaraga ega; MCTS esa 9,000 s chegaraga ega. Standardlashtirilgan AF2, ProteinMPNN va BoltzGen chegaralari 2,160, 900 va 10,800 s ni tashkil qiladi. Cheklov oshib ketganda, kontroller mavjud natijalarni yig‘ishga harakat qiladi va tugallanmagan vazifani to‘xtatadi. Ushbu chegaralar kutilgan bajarilish vaqtini yoki tanlov narxini belgilashdan ko‘ra, ortiqcha ishlov berishni cheklaydi. Buning o‘rniga BindCraft jarayonni kuzatuvchi taymerdan (progress watchdog) foydalana
