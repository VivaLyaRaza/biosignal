        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"118\" cy=\"134\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"602\" cy=\"268\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · EPIDEMIOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Юрак касалликлари хавфини&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;баҳолайдиган янги интеллект&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;тизими&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f-f1.jpg\" alt=\"1-rasm: Yurak-qon tomir kasalliklarini bashorat qilish uchun taklif etilgan noaniqlikka asoslangan mashinaviy o'qitish t\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Yurak-qon tomir kasalliklarini bashorat qilish uchun taklif etilgan noaniqlikka asoslangan mashinaviy o'qitish tizimi uchun tadqiqot jarayoni va assotsiatsiya tadqiqoti.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Анъанавий хавф шкалалари турли демографик гуруҳларда кўпинча хатоликларга йўл қўяди. Тадқиқотчилар юрак-қон томир хасталикларини башорат қилиш учун прогнознинг ишончлилигини ва гендер фарқларини ҳисобга олувчи ёндашув яратдилар. Янги тизим касаллик эҳтимолини юқори аниқликда баҳолаб, шифокорлар учун ишончли восита бўлиб хизмат қилади. Бу клиник амалиётда сунъiy интеллектдан хавфсиз фойдаланишга йўл очади.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Тасодифий ўрмон модели 0.90 дан юқори &lt;a href=\"concepts/roc-auc.html\"&gt;ROC-AUC&lt;/a&gt; натижасини берди.&lt;/li&gt;\n&lt;li&gt;Маълумотларни тўлдириш сифат кўрсаткичларини сезиларли даражада оширди.&lt;/li&gt;\n&lt;li&gt;Эркаклар ва аёллар учун хавф омилларида сезиларли фарқлар аниқланди.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Юрак-қон томир касалликлари бутун дунё бўйлаб ўлимнинг асосий сабаби бўлиб қолмоқда. Мавжуд клиник шкалалар чекланган кўрсаткичларга таяниб, турли аҳоли гуруҳларида ўз аниқлигини йўқотиши мумкин. Ушбу муаммони ҳал қилиш учун муаллифлар прогноз ноаниқлигини ва биомаркерларни таҳлил қилувчи тизимни ишлаб чиқдилар. Бу ёндашув мантиқий ва шаффоф қарорлар қабул қилишга ёрдам беради.&lt;/p&gt;\n&lt;p&gt;Тадқиқотда 918 нафар иштирокчининг маълумотларидан фойдаланилди, улардан 725 нафари эркаклар ва 193 нафари аёллар эди. Маълумотлардаги етишмовчиликлар &lt;a href=\"concepts/mice.html\"&gt;MICE&lt;/a&gt; ва тасодифий ўрмон алгоритми ёрдамида тўлдирилди. Прогнозларнинг ноаниқлиги бутстрап ресамплинг ва энтропия усуллари орқали ўлчанди. Сабаб-оқибат боғлиқликларини баҳолаш учун эса иккиламчи машинада ўқитиш ва Causal Forest методлари қўлланди.&lt;/p&gt;\n&lt;p&gt;Натижаларга кўра, тасодифий ўрмон модели энг юқори барқарорликни кўрсатиб, &lt;a href=\"concepts/roc-krivaya.html\"&gt;ROC&lt;/a&gt;-&lt;a href=\"concepts/area-under-the-curve.html\"&gt;AUC&lt;/a&gt; кўрсаткичи 0.90 дан ошди. Маълумотларни тўлдириш стратегияси классификация сифатини янада яхшилади. Сабаблар таҳлили асосий томирлар сони, ST сегменти қиялиги ва жисмоний зўриқиш стенокардияси асосий хавф омиллари эканини кўрсатди, улар гендер гуруҳларида фарқланди.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Иш нисбатан кичик ва гендер мувозанати бузилган ретроспектив маълумотларга асосланган бўлиб, клиник амалиётга кириши учун қўшимча текширувлар зарур.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Юрак-қон томир касалликлари бутун дунё бўйлаб ўлимнинг асосий сабаби бўлиб қолимоқда. Машинали ўқитиш моделлари юқори башорат қилиш самарадорлигини кўрсатган бўлса-да, клиник жиҳатдан ишончли сунъiy интеллект учун муҳим бўлган ноаниқликни баҳолаш ва гендерга хос хавф омилларини аниқлашга етарлича эътибор берилмаган.&lt;/p&gt;\n&lt;p&gt;Юрак-қон томир касалликларини башорат қилиш учун биомаркерлар бўйича ассоциация тадқиқоти, тушунарли сунъiy интеллект ва гендер бўйича табақалаштирилган хавфларни баҳолашни бирлаштирган, ноаниқликни ҳисобга оладиган ва талқин қилинадиган машинали ўқитиш тизимини ишлаб чиқиш ва баҳолаш.&lt;/p&gt;\n&lt;p&gt;Ушбу ретроспектив кузатув тадқиқотида 725 нафар эркак ва 193 нафар аёлни ўз ичига олган 918 нафар иштирокчини ўз ичига олган UCI Heart Disease маълумотлар тўпламидан фойдаланилди. Демографик, клиник, лаборатор ва жисмоний юкламага боғлиқ ўзгарувчилар таҳлил қилинди. Етишмайotган қийматлар MICE ва назорат қилинадиган Random Forest импутациясини бирлаштирган гибрид стратегия ёрдамида ҳал қилинди.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/imputatsiya.html\"&gt;Импутация&lt;/a&gt; — маълумотлар тўпламидаги етишмайotган ёки йўқ қийматларни тўлдириш ёки тиклаш статистик усули бўлиб, тўлиқ бўлмаган ёзувларни ўчириб ташламасдан барча мавжуд маълумотлардан фойдаланиш имконини беради.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тадқиқотчилар етишмайotган маълумотлар муаммосини ҳал қилиш учун ансамбль машинали ўқитиш стратегиясини ишлаб чиқдилар. Сўнгра табақалаштирилган ўқитиш ва тест қилиш бўлаклари ҳамда 5 каррали кросс-валлидация ёрдамида замонавий машинали ўқитиш моделлари яратилди ва баҳоланди. Башорат қилиш самарадорлиги бир нечта баҳолаш метрикалари орқали ўлчанди. Ноаниқлик бутстреп ресемплинг, башорат қилиш энтропияси ва ўзаро ахборот орқали миқдорий ҳисоблаб чиқилди. Гендерга хос ўртача кўрсаткичларни ва хавф омилларининг ассоциация тадқиқотларини баҳолаш учун чизиқли қўшма машинали ўқитиш (Linear Double machine learning) ва сабаб-оқибат ўрмон қўшма машинали ўқитиш (&lt;a href=\"concepts/dml.html\"&gt;Causal Forest double machine learning&lt;/a&gt;) усуллари қўлланилди.&lt;/p&gt;\n&lt;p&gt;Random Forest ҳам эркаклар, ҳам аёллар гуруҳларида энг кучли ва барқарор башорат қилиш самарадорлигини кўрсатди, ROC-AUC қийматлари 0.90 дан ошди ва кросс-валлидация натижалари юқори бўлди. Гибрид импутация классификация самарадорлигини ошириб, F1-score кўрсаткичини 0.87 дан 0.89 га ва ROC-AUC қийматини 0.90 дан 0.92 га кўтарди. Сабаб-оқибат ассоциация тадқиқоти асосий қон томирлари сони, ST сегменти қиялиги, талассемия ва жисмоний зўриқиш стенокардиясини юрак касалликларининг энг кучли аниқловчи омиллари сифатида аниқлади, бунда эркаклар ва аёллар кичик гуруҳлари ўртасида сезиларли фарқлар кузатилди.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Random Forest модели 0.90 дан юқори ROC-AUC кўрсаткичига эришди, гибрид импутация эса бу кўрсаткични 0.92 га етказиб, юрак-қон томир касалликлари хавф омилларидаги асосий жинсий фарқларни аниқлади.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Башорат қилиш моделлаштириши, ноаниқликни баҳолаш ва ассоциация тадқиқоти машинали ўқитишини бирлаштириш юрак-қон томир касалликлари хавфини баҳолаш учун мустаҳкам ва клиник жиҳатдан тушунарли тизимни таъминлайди. Таклиф этилаётган ёндашув башоратларнинг ишончлилигини оширади ва шу билан бирга гендерга хос сабаб-оқибат жиҳатидан муҳим хавф омилларини аниқлайди, бу эса аниқ кардиология ва ишончли клиник сунъiy интеллектни қўллаб-қувватлайди.&lt;/p&gt;\n&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"yurak-qon-tomir-kasalliklari-muammosining-dolzarbligi-va-klassik-shkalalarning-cheklovlari\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#yurak-qon-tomir-kasalliklari-muammosining-dolzarbligi-va-klassik-shkalalarning-cheklovlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yurak-qon tomir kasalliklari muammosining dolzarbligi va klassik shkalalarning cheklovlari&lt;/span&gt;&lt;/a&gt;Yurak-qon tomir kasalliklari muammosining dolzarbligi va klassik shkalalarning cheklovlari&lt;/h4&gt;\n&lt;p&gt;Юрак-қон томир касалликлари (ЮҚТК) глобал миқёсдаги асосий тиббий муаммолардан бири бўлиб қолмоқда: 2022 йил ҳолатига кўра, дунё бўйлаб 500 миллиондан ортиқ одам ушбу касаллик билан яшайди, ўлим ҳолатлари эса тахминан 20 миллиoniumni ташкил этиб, глобал ўлимларнинг деярли учдан бир қисмини ташкил қилди. Америка Қўшма Штатларида ЮҚТК ўлим сабаблари орасида биринчи ўринда туради ва ҳ yili ҳар уч ўлимдан бирига сабабчи бўлади. Юрак ишемик касаллиги (ЮИK) эса тож артерияларининг торайиши ёки тўсилиши, миокард қон оқимининг камайиши ва инфаркт, юрак етишмовчилиги ҳамда тўсатдан ўлимга олиб келиши билан асосий морбидлик сабаби ҳисобланади. Бу муаммо семizlik, артериал гипертония, диабет, дислипидемия ва чекиш каби омиллар туфайли янада кучаймоқда. Патологиялар билинмасдан ривожланганлиги сабабли, уларни эрта аниқлаш ва хавфни башорат қилиш профилактика учун жуда муҳимдир.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Юрак-қон томир касалликлари 500 миллиондан ортиқ одамни қамраб олиб, йил сайин 20 миллионга яқин ўлимга сабаб бўлади, бироқ уларнинг яширин кечиши эрта ташхисни қийинлаштиради.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ЮҚТК хавфига ёosh va jins кучли таъсир қилади: ёш ўтиши билан юрак-томир фаолиятининг сусайиши ҳисобига хавф ҳар икала жинсда ҳам ошади. Эркаклар кўпинча катта хавфга дуч келишади ва касаллик уларда аёллардан тахминан 7–10 йил олдин ривожланади. 2019 йилда ёшга мослаштирилган глобал ЮҚТК ўлим кўрсаткичи эркакларда 100 000 аҳолига 280.8 тани, аёлларда эса 204.0 тани ташкил қилди. Бу фарқ менопаузадан олдинги аёлларда эстрогеннинг ҳимоя таъсири ҳамда қон томир тузилишидаги фарқлар билан изоҳланади. Хавф омиллари ўзгармайдиган (ёш, жинс, генетика) ва ўзгартириладиган (гипертония, чекиш, камҳаракатлик) гуруҳларга бўлинади. Бироқ кўкрак қафасидаги ноқулайлик ёки бош айланиши каби эрта белгилар кўпинча эътиборсиз қолдирилиб, ташхис кечикишига олиб келади.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Ўзгартириладиган хавф омиллари — бу турмуш тарзи ва соғлиқ кўрсаткичлари бўлиб, уларга таъсир қилиш орқали касалликнинг олдини олиш мумкин.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Хавфни баҳолаш одатда клиник тестлар ва доимий кузатув қурилмалари орқали амалга оширилиб, натижалар электрон тиббий ёзувларда қайд этилади, аммо бу маълумотлар кўпинча тузилмаган ва шовқинларга эга. ЮҚТКнинг иқтисодий юки жуда катта бўлиб, АҚШнинг ўзида йиллик харажатлар 200 миллиард доллардан ошади. Анъанавий башорат қилиш моделларига Framingham Risk Score, ASCVD ва SCORE2 киради, бироқ улар фақат чекланган демографик ва лаборатор ўзгарувчиларга асосланиб, линейликни тахмин қилади. Бу моделлар гетероген гуруҳларда, масалан, озчилик вакиллари ёки ёшларда ўз самарадорлигини йўқотиши мумкин.&lt;/p&gt;\n&lt;h4 id=\"mashinnoe-obuchenie-i-poisk-prichinno-sledstvennyh-svyazej-s-pomoshyu-double-machine-learning\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#mashinnoe-obuchenie-i-poisk-prichinno-sledstvennyh-svyazej-s-pomoshyu-double-machine-learning\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Машинное обучение и поиск причинно-следственных связей с помощью Double Machine Learning&lt;/span&gt;&lt;/a&gt;Машинное обучение и поиск причинно-следственных связей с помощью Double Machine Learning&lt;/h4&gt;\n&lt;p&gt;Ҳисоблаш қувватларининг ошиши юрак-томир хавфини башорат қилишда машинавий ўқитиш (МЎ) усулларини, жумладан Random Forests (RF), Gradient Boosting Machines (GBM), Support Vector Machines (SVM) ва чуқур нейрон тармоқларини қўллаш имконини берди. Ушбу ёндашувлар нолиней боғлиқликлар ва мураккаб ўзаро таъсирларни моделлай олади. Бир қатор тадқиқотларда МЎ усуллари ёрдамида олинган AUC кўрсаткичлари 0.85 дан ошганлиги хабар қилинган. Шунга қарамай, МЎ моделларини клиник амалиётга татбиқ этиш ҳамон муаммо бўлиб қолмоқда, чунки улар кичик ретроспектив маълумотларга асосланган бўлиб, оверфиттинг ва шаффоф эмаслик муаммоларига дуч келади («қора қути» эффекти).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;“Қора қути” моделлари юқори башорат кўрсаткичларини берса ҳам, уларнинг тушунарсизлиги ва ташқи валидациянинг етишmasligi шифокорларнинг ишончини сусайтиради.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Интерпретация муаммосини ҳал қилиш учун хусусиятларни муҳандислиги, LASSO регуляризацияси ва SHAP каби тушунтириш усуллари қўлланилади, улар башоратларга ҳар бир омилнинг ҳиссасини кўрсатади. Бироқ башорат қилувчи муҳимлик ҳар доим ҳам омилнинг касалликка мустақил сабабий таъсирини англатмайди. Шу мақсадда мақолада асосий предикаторларнинг сабабий таъсирини баҳолаш учун Қўшма машинавий ўқитиш (Double Machine Learning, DML) усули қўлланилади. Тадқиқотда маълумотларни олдиндан қайта ишлаш, етишмайдиган қийматларни тўлдириш, бир нечта МЎ моделларини тузиш ва 5 каррали кросс-валидациядан ўтказиш босқичлари бажарилган. Самарадорлик F1-баҳоси, MCC, аниқлик, ROC-AUC, AUPRC ва Brier score орқали баҳоланиб, Causal Forest DML индивидуал ЮҚТК хавфини баҳолаш имконини берган.&lt;/p&gt;\n&lt;h4 id=\"literaturereview\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#literaturereview\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Literaturereview&lt;/span&gt;&lt;/a&gt;Literaturereview&lt;/h4&gt;\n&lt;p&gt;Юрак-қон томир касалликлари (ЮҚТК) бутун дуньеда асосий ўлим сабаби бўлиб қолаётгани сабабли, тадқиқотчилар уларнинг олдини олиш, ташхислаш ва бошқариш воситаларини ишлаб чиқишга кўп йиллар бағишламоқда. Али ва бошқалар ансамбли чуқур ўқитиш ва белгиларни бирлаштириш усулларига асосланган юрак касалликларини башорат қилиш учун ақлли тиббий мониторинг тизимини таклиф қилдилар. Уларнинг платформаси тақиладиган датчиклардан олинган физиологик маълумотларни электрон тиббий ёзувлар билан интеграция қилади. Башорат қилиш самарадорлигини ошириш мақсадида тизим маълумотлар ўсишига асосланган белгиларни танлашни қўллади. Натижада LogitBoost мета-ўқитиш алгоритми билан кучайтирилган ансамбль модели тахминан 98.5% аниқликка эришди.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Ансамбли ўқитиш — бу бир нечта алгоритмларнинг натижаларини бирлаштириш орқали битта модель берганидан ҳам юқори аниқлик ва барқарорликка эришиш усулидир.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кориал ва бошқалар Чи-квадрат белгиларини танлашни кўпчилик овози классификатори билан бирлаштириб, ЮҚТКни эрта аниқлаш тизимини таклиф қилдилар. Cleveland маълумотлар базасидан 303 та бемор ёзувларидан фойдаланган ҳолда Чи-квадрат усули энг муҳим 5 та белгини ажратиб кўрсатди ва ҳисоблаш юкламасини 50% дан ортиқ қисқартирди. Овоз бериш ансамбли LR, RF, GNB ва KNN классификаторларини бирлаштириб, 92.11% аниқлик кўрсатди. Ван ва бошқалар 797 нафар бемор маълумотлари асосида эрта муддатли ишемик юрак касаллиги (ИЮК) хавфини башорат қилиш моделларини ишлаб чиқдилар. LASSO ва RF моделлари гиперурикемия, сурункали буйрак касаллиги ва уйқу артериялари атеросклерозини энг муҳим предикторы сифатида аниқлади. RF модели AUC бўйича LASSO дан устун келди (0.91 ва 0.84, статистик аҳамиятли фарқ билан Z = 3.99, P &amp;lt; 0.05).&lt;/p&gt;\n&lt;p&gt;Дорраки ва бошқалар UK Biobank маълумотларидан фойдаланган ҳолда ЮҚТК башоратини яхшилашда психологик омилларнинг ролини ўргандилар. Фақат анъанавий хавф омиллари қўлланилганда модель 71.31% аниқлик кўрсатган бўлса, руҳий саломатлик кўрсаткичларининг қўшилиши аниқликни 85.13% гача оширди. Олаваде ва бошқалар белгиларни танлаш учун BESO алгоритмини интеграция қилган ИЮК башорати учун МЛ тизимини таклиф қилдилар. RF модели иккала маълумотлар базасида 90% ва 92% аниқликка эришди. Аниқланган асосий предикторылар қаторига юрак уриш тезлиги, ёш, тана вазни индекси, систолик қон босими ва типик кўкрак оғриғи кирди.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Кўпгина тадқиқотлар махсус ретроспектив маълумотлар базаларига асосланган бўлиб, бу уларнинг кенг клиник амалиётда қўлланилишини чеклаши мумкин.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Данка ва бошқалар XGBoost асосидаги гибрид тизимни ишлаб чиқиб, Cleveland маълумотлар базасида тахминан 95.45% аниқлик, 92.86% сезувчанлик ва 100% спецификликка эришдилар. Али ва бошқалар Kaggle маълумотларида RF модели 100% аниқлик кўрсатганини аниқладилар. Рабби ва бошқалар VEMLA ва BEMLA ансамбль моделларини таклиф қилиб, Cleveland базасида 92% ҳамда Framingham базасида 97% аниқликка эришдилар. Талукдер ва бошқалар маълумотларни мувозанатлаштириш ва тушунтириладиган сунъий интеллект воситаларини бирлаштирган HXAI-ML фреймворкини яратиб, 98.78% аниқликка эришдилар. Черножуков ва бошқалар эса сабаб-оқибат боғлиқликларини баҳолаш учун Double/Debiased ML тизимини ишлаб чиқдилар.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Мавжуд тадқиқотлар асосан классификация аниқлигини оширишга қаратилган бўлиб, гендер фарқлари, ноаниқликни баҳолаш ва каузал предикторларга етарлича эътибор берилмаган.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Адабиётлар шарҳидан кўриниб турибдики, кўпгина тадқиқотлар гибрид МЛ тизими орқали ЮҚТК башорати аниқлигини оширишга қаратилган. Шунга қарамай, гендерга хос хавф омиллари, ноаниқликни баҳолаш ва каузал предикторылар кам ўрганилган. Шунинг учун маълумотларни олдиндан тайёрлаш, классификация баланси ва сабаб-оқибат ёндашувларини бирлаштирувчи интеграциялашган тизимга эҳтиёж мавжуд.&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"heart-disease-dataset\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#heart-disease-dataset\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Heart disease dataset&lt;/span&gt;&lt;/a&gt;Heart disease dataset&lt;/h4&gt;\n&lt;p&gt;Tadqiqotda Klivlend va Vengriya yurak-qon tomir kasalliklari kogortalaridan olingan tuzilgan klinik ma'lumotlar to'plami ishlatilgan bo'lib, u yurak-qon tomir kasalliklarini baholashda muntazam qo'llaniladigan demografik, fiziologik va jismoniy faollik o'zgaruvchilarini o'z ichiga oladi. Ma'lumotlar to'plami yoshi, jinsi, ko'krak qafasidagi og'riq turi, qon bosimi, xolesterin darajasi, elektrokardiografik ko'rsatkichlar va jismoniy yuklamaga javob kabi asosiy bashoratchilarni o'z ichiga oladi. Bir qator o'zgaruvchilar klinik jihatdan aniqlangan xavf omillarini aks ettiradi: ko'krak qafasidagi og'riq turi alomatlarni tavsiflaydi, maksimal yurak urish tezligi va zo'riqish стенокардияsi yurakning stressga funksional javobini bildiradi. Zardob xolesterini va och qoringa qon glyozasi kabi laboratoriya o'lchovlari metabolik xavfni qamrab oladi, rentgenoskopiya orqali kuzatilgan yirik tomirlar soni va talassemiya holati kabi strukturaviy ko'rsatkichlar ishemik yurak kasalligining og'irligidan darak beradi. Natija o'zgaruvchisi yurak kasalligining mavjudligi va og'irligini kodlaydi, bashorat qilish modellashtirish uchun esa klinik ahamiyatga ega kasallikning mavjudligi yoki yo'qligini ko'rsatish uchun ikkilamchi holatga keltirildi. Barcha o'zgaruvchilarning batafsil tavsifi, ta'riflari, turlari va diapazonlari bilan birga 1-Jadval da keltirilgan.&lt;/p&gt;\n&lt;h4 id=\"study-design\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#study-design\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Study Design&lt;/span&gt;&lt;/a&gt;Study Design&lt;/h4&gt;\n&lt;p&gt;Ushbu tadqiqot jins bo'yicha stratifikatsiyalangan tahlil va yoshga bog'liq farqlarga alohida e'tibor qaratgan holda, yurak-qon tomir kasalliklarini bashorat qilish uchun mashinaviy o'qitish modellarini ishlab chiqish va baholash maqsadida ochiq mavjud klinik ma'lumotlardan foydalangan holda retrospektiv, kuzatuv dizaynini qo'lladi. Metodologik asos to'rtta integratsiyalangan komponentdan iborat edi: (i) ma'lumotlar sizib chiqishining oldini olish uchun yagona ustunli quvur liniyasi ichida standartlashtirilgan oldindan ishlov berish; (ii) modelga bog'liq bo'lmagan mustahkam bashoratchilarni aniqlash uchun LASSO, &lt;a href=\"concepts/elastic-net.html\"&gt;Elastic Net&lt;/a&gt;, GBM va RF yordamida ko'p algoritmli o'zgaruvchilarni tanlash; (iii) chiziqli, marjaga asoslangan, daraxtga asoslangan, ehtimollik, instansga asoslangan va neyron paradigmalarni o'z ichiga olgan yettita nazorat qilinadigan tasniflagichlardan foydalangan holda bashoratli modellashtirish — LR, SVM, DT, RF, GNB, KNN va MLP; (iv) jins bo'yicha stratifikatsiyalangan kenja guruhlar bo'ylab qiyosiy samaradorlikni baholash. Ma'lumotlar to'plami stratifikatsiyalangan tasodifiy tanlash yordamida o'qitish (80%) va sinov (20%) to'plamlariga bo'lindi.&lt;/p&gt;\n&lt;h4 id=\"data-preprocessing\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#data-preprocessing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data Preprocessing&lt;/span&gt;&lt;/a&gt;Data Preprocessing&lt;/h4&gt;\n&lt;p&gt;Ma'lumotlar to'plami demografik xarakteristikalar, laboratoriya o'lchovlari va jismoniy yuklama ko'rsatkichlarini o'z ichiga olgan yurak-qon tomir kasalliklari xavfini baholashda odatda qo'llaniladigan tuzilgan klinik o'zgaruvchilardan iborat edi. Ikki tomonlama natija o'zgaruvchisi yurak kasalligining mavjudligi (Y=1) yoki yo'qligini (Y=0) ko'rsatdi. Modellarni ishlab chiqishdan oldin, barcha mashinaviy o'qitish modellari o'rtasida muvofiqlikni ta'minlash hamda xilma-xil belgilar masshtablari va yo'qolgan ma'lumotlardan kelib chiqadigan potentsial xatoliklarni kamaytirish uchun standartlashtirilgan oldindan ishlov berish quvur liniyasi amalga oshirildi.&lt;/p&gt;\n&lt;h4 id=\"data-description\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#data-description\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data Description&lt;/span&gt;&lt;/a&gt;Data Description&lt;/h4&gt;\n&lt;p&gt;Ma'lumotlar to'plami yurak kasalliklarini tasniflash maqsadida to'plangan klinik va demografik o'lchovlarni o'z ichiga olgan. To'liq kogorta 918 nafar ishtirokchini o'z ichiga oldi, ulardan 725 nafari (79.0%) erkaklar va 193 nafari (21.0%) ayollar edi. Ma'lumotlar to'plami yurak kasalligi bo'lgan va bo'lmagan bemorlarning o'rtacha muvozanatli nisbatini ko'rsatdi: 918 ishtirokchidan 508 nafari (55.3%) yurak kasalligiga chalingan, 410 nafari (44.7%) esa sog'lom nazorat guruhini tashkil etgan. Yurak kasalliklarining jinsga xos naqshlarini o'rganish uchun ma'lumotlar erkaklar va ayollar kenja guruhlariga stratifikatsiya qilindi. Ishtirokchilar yana uchta yosh guruhiga bo'lindi: 29–39 yosh (yosh kattalar; n=80), 40–59 yosh (o'rta yoshdagi kattalar; n=735) va 60–77 yosh (keksa kattalar; n=103).&lt;/p&gt;\n&lt;p&gt;O'zgaruvchilar to'rtta uzluksiz bashoratchiga — zardob xolesterini (chol, mg/dL), jismoniy yuklama natijasida yuzaga kelgan ST depressiyasi (oldpeak), erishilgan maksimal yurak urish tezligi (thalch, bpm) va tinch holatdagi qon bosimi (trestbps, mm Hg) — hamda sakkizta kategorik bashoratchiga guruhlandi: ftoroskopiya yordamida bo'yalgan yirik tomirlar soni (ca), ko'krak qafasidagi og'riq turi (cp), jismoniy yuklama keltirib chiqaradigan stenokardiya (exang), och qoringa qon shakari &amp;gt;120 mg/dL (fbs), tinch holatdagi elektrokardiografik natijalar (restecg), cho'qqi yuklama ST segmentining qiyaligi (slope), talassemiya (thal) va yurak kasalligi natijasi (target). Bashoratchilarning yosh va jins bo'yicha qo'shma taqsimotini o'rganish uchun uzluksiz o'zgaruvchilar yadro zichligi baholari sifatida, kategorik o'zgaruvchilar esa chastota sonlari sifatida ko'rsatildi (2-Rasm).&lt;/p&gt;\n&lt;p&gt;O'rta yoshdagi kenja guruh barcha kategorik o'zgaruvchilar bo'yicha kuzatishlarning asosiy qismini tashkil etdi, bu yurak kasalliklari kogortalarining kutilayotgan yosh taqsimotiga mos keladi. Uzluksiz o'zgaruvchilar yosh guruhlari bo'ylab asosan o'xshash markaziy tendentsiyalarni ko'rsatdi, keksa yoshdagilarda thalch pastga va oldpeak yuqoriga siljidi. Kategorik bashoratchilar aniq jinsiy farqlarni ochib berdi: xususan, erkaklar deyarli barcha kategorik o'zgaruvchilar darajasida ayollardan ko'prik qildi va kasallik natijasi (target) har bir yosh qatlamida erkaklarda ko'proq uchradi. Erkak (n=725) va ayol (n=193) ishtirokchilar orasidagi sezilarli nomutanosiblik keyingi bo'limlarda keltirilgan jins bo'yicha stratifikatsiyalangan modellashtirish yondashuviga turtki bo'ldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;918 nafar ishtirokchi (79% erkaklar) qatnashgan tadqiqotda kuchli jinsiy nomutanosiblik aniqlandi va bu erkaklar hamda ayollar uchun alohida mashinaviy o'qitish modellarini yaratishni talab etdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"yetishmayotgan-malumotlarni-qayta-ishlash\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#yetishmayotgan-malumotlarni-qayta-ishlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yetishmayotgan ma'lumotlarni qayta ishlash&lt;/span&gt;&lt;/a&gt;Yetishmayotgan ma'lumotlarni qayta ishlash&lt;/h4&gt;\n&lt;p&gt;CVD (yurak-qon tomir kasalliklari) ma'lumotlar to'plamining murakkabligi sababli, standart imputatsiya usullari yetarli natija bermadi. Shuning uchun mualliflar o'zgaruvchi turiga moslashtirilgan gibrid strategiyani qo'lladilar. Uzluksiz o'zgaruvchilar (yosh, qon bosimi, xolesterin, yurak urish tezligi va ST depressiyasi) uchun MICE (zanjirli tenglamalar orqali ko'p martalik imputatsiya) usuli ishlatildi. Kategoriyali o'zgaruvchilar (jins, qondagi qand miqdori, stenokardiya, ko'krak og'rig'i turi, EKG natijalari, tomirlar soni va talassemiya) uchun nazorat qilinadigan imputatsiya qo'llanildi: har bir xususiyat uchun mavjud ma'lumotlar asosida tasodifiy o'rmon (RF) regressiyasi o'qitildi va yetishmayotgan qiymatlar bashorat qilingan sinf yorliqlari bilan to'ldirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gibrid yondashuv (MICE va RF) ma'lumotlarning diskret tuzilishini saqlab qolish va o'zgaruvchilar o'rtasidagi ko'p o'lchovli bog'liqlikni hisobga olish imkonini berdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MICE — har bir o'zgaruvchini boshqalari asosida ketma-ket modellashtirish orqali bo'shliqlarni to'ldiradigan iterativ usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"xususiyatlarni-masshtablash\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#xususiyatlarni-masshtablash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xususiyatlarni masshtablash&lt;/span&gt;&lt;/a&gt;Xususiyatlarni masshtablash&lt;/h4&gt;\n&lt;p&gt;Barcha uzluksiz prediktorlar Z-ball normalizatsiyasi yordamida standartlashtirildi: &lt;span class=\"yfm-latex\" data-content=\"x%5E*%20%3D%20%5Cfrac%7Bx%20-%20%5Cmu%7D%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Bu usul LASSO va Elastic Net kabi modellar uchun muhim, chunki ularda koeffitsientlar kattaligi xususiyatlar masshtabiga bog'liq.&lt;/p&gt;\n&lt;h4 id=\"oqitish-va-test-toplamlariga-ajratish\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#oqitish-va-test-toplamlariga-ajratish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;O'qitish va test to'plamlariga ajratish&lt;/span&gt;&lt;/a&gt;O'qitish va test to'plamlariga ajratish&lt;/h4&gt;\n&lt;p&gt;Ma'lumotlar 80:20 nisbatda (random seed 42) bo'lindi. Stratifikatsiyalangan tanlash usuli qo'llanildi: P(Ytrain = 1) ≈ P(Ytest = 1). Barcha oldindan ishlov berish operatsiyalari (imputatsiya, masshtablash, kodlash) yagona konveyerga birlashtirildi, bunda parametrlar faqat o'qitish to'plamidan hisoblandi va test to'plamiga tatbiq etildi. Bu ma'lumotlarning sizib chiqishini (data leakage) oldini oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ma'lumotlarning sizib chiqishini oldini olish uchun barcha transformatsiya parametrlari faqat o'qitish to'plamidan olinishi shart.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"modellash-va-klassifikatsiya\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#modellash-va-klassifikatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Modellash va klassifikatsiya&lt;/span&gt;&lt;/a&gt;Modellash va klassifikatsiya&lt;/h4&gt;\n&lt;p&gt;x_i belgilar vektori yosh, xolesterin darajasi, qon bosimi va jismoniy yuklama natijasida kelib chiqadigan stenokardiya kabi klinik xavfni baholashda standart hisoblangan demografik, fiziologik va funksional ko'rsatkichlarni o'z ichiga oladi. Maqsad — bemorlarni past va yuqori xavf guruhlariga ajratish uchun P(y_i = 1 / x_i) shartli ehtimollikni baholovchi F: R^p → [0, 1] akslantirish funksiyasini o'rganishdir. Model arxitekturasiga qarab, F(·) chiziqli prediktor, nochiziqli transformatsiya yoki qaror qabul qilish qoidalari ansambli bo'lishi mumkin. Biz klinik prediktorlar va yurak-qon tomir kasalliklari (YQTK) oqibatlari o'rtasidagi murakkab bog'liqlikni hisobga olish uchun parametrik va no-parametrik ML modellarini qo'lladik.&lt;/p&gt;\n&lt;p&gt;Chiziqli regressiya (LR) o'zining talqin qilinishi va imkoniyatlar nisbatini baholash qobiliyati tufayli asosiy ehtimollik modeli sifatida ishlatildi. Tayanch vektorlar mashinasi (SVM) yadroviy transformatsiyalar orqali nochiziqli qaror chegaralarini modellashtirish uchun ishlatildi. Qaror daraxtlari (DT) shaffof ierarxik tuzilishi uchun, tasodifiy o'rmonlar (RF) esa bashorat barqarorligini oshirish va dispersiyani kamaytirish uchun kiritildi. Gaussning sodda Bayes klassifikatori (GNB) shartli mustaqillik taxmini ostida samarali bazaviy yechim bo'lib xizmat qildi, k-eng yaqin qo'shnilar (KNN) algoritmi esa klinik xususiyatlar o'xshashligiga asoslanib bemorlarni klassifikatsiya qilish imkonini berdi. Ko'p qatlamli perseptronlar (MLP) nochiziqli o'zaro ta'sirlarni aniqlash uchun, gradient busting (GBM) esa xatolarni ketma-ket kamaytirish orqali bashorat aniqligini oshirish uchun qo'llanildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot YQTK xavfini baholash uchun chiziqli modellardan tortib, murakkab nochiziqli ansambllar va neyron tarmoqlarigacha bo'lgan keng qamrovli modellarni o'z ichiga oladi.&lt;br /&gt;\n[!tip] Ansambl usullari (RF, GBM) bir nechta zaif algoritmlarning bashoratlarini birlashtirib, bitta modelga qaraganda aniqroq va barqaror natija beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"giperparametrlarni-optimallashtirish\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#giperparametrlarni-optimallashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Giperparametrlarni optimallashtirish&lt;/span&gt;&lt;/a&gt;Giperparametrlarni optimallashtirish&lt;/h4&gt;\n&lt;p&gt;Modellarning umumlashtirish qobiliyatini oshirish uchun o'quv to'plamida kross-validatsiya yordamida giperparametrlarni sozlash amalga oshirildi. LR uchun regulyarizatsiya parametrlari va jarima funksiyalari optimallashtirildi. SVMda yadro parametrlari va chegaralarni regulyarizatsiya qilish sozlandi. Daraxtga asoslangan usullarda (DT, RF, GBM) daraxt chuqurligi, estimatorlar soni va tugunlarni ajratish mezonlari tanlandi. KNN uchun qo'shnilar soni va masofa metrikalari, MLP uchun esa yashirin qatlamlar arxitekturasi, aktivatsiya funksiyalari va optimallashtirish parametrlari tanlandi. Asosiy mezon ROC-AUC ko'rsatkichi bo'ldi.&lt;/p&gt;\n&lt;h4 id=\"jarimali-ozgaruvchilarni-tanlash-strategiyasi\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#jarimali-ozgaruvchilarni-tanlash-strategiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Jarimali o'zgaruvchilarni tanlash strategiyasi&lt;/span&gt;&lt;/a&gt;Jarimali o'zgaruvchilarni tanlash strategiyasi&lt;/h4&gt;\n&lt;p&gt;Iskemik yurak kasalligining eng informativ prediktorlarini aniqlash uchun biz to'rtta arxitekturani ishlab chiqdik: LASSO, Elastic Net, GBM va RF. LASSO va Elastic Net multikollinearlikni boshqarish va avtomatik tanlash uchun ishlatildi. GBM va RF esa oldindan strukturaviy taxminlarsiz murakkab nochiziqli bog'liqliklarni aniqlash uchun qo'llanildi. YQTK patofiziologiyasidagi jinsiy farqlarni hisobga olgan holda, butun kogorta biologik jins bo'yicha stratifikatsiya qilindi va modellar erkaklar va ayollar uchun mustaqil ravishda o'qitildi. Tahliliy quvur Python 3.4 va scikit-learn 1.8 kutubxonasi yordamida amalga oshirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Jins bo'yicha stratifikatsiyadan foydalanish juda muhim, chunki YQTK rivojlanish mexanizmlari erkaklar va ayollarda sezilarli darajada farq qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"lasso-logistik-regressiyasi\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#lasso-logistik-regressiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LASSO logistik regressiyasi&lt;/span&gt;&lt;/a&gt;LASSO logistik regressiyasi&lt;/h4&gt;\n&lt;p&gt;LASSO usuli o'zgaruvchilarni tanlash uchun tanlandi, chunki uning L₁-jarimasi kamroq informativ prediktorlarning koeffitsientlarini nolga aylantirib, ularni modeldan chiqarib tashlaydi. Jarima darajasi ROC-AUC ni maksimallashtirish orqali besh karrali kross-validatsiya yordamida aniqlandi. Model SAGA algoritmi (maksimal 5000 iteratsiya) yordamida o'qitildi. Uzluksiz prediktorlar standartlashtirildi, kategoriyali o'zgaruvchilar esa dummy-kodlash orqali kodlandi. O'zgaruvchilarning ahamiyati yakuniy koeffitsientlarning mutlaq qiymati bo'yicha aniqlandi; ko'p darajali belgilar uchun qiymatlar yig'ildi va modellar o'rtasida taqqoslash uchun 100% gacha normallashtirildi.&lt;/p&gt;\n&lt;h4 id=\"elasticnet-logistic-regression\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#elasticnet-logistic-regression\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ElasticNet logistic regression&lt;/span&gt;&lt;/a&gt;ElasticNet logistic regression&lt;/h4&gt;\n&lt;p&gt;Bashorat o'zgaruvchilari orasida potentsial multikollinearlik mavjudligi sababli, yurak kasalliklarini bashorat qilishda tartibga solingan o'zgaruvchilarni tanlashni amalga oshirish uchun Elastic Net usuli qo'llanildi. LASSO dan farqli o'laroq, Elastic Net L₁ va L₂ jarimalarini birlashtiradi, bu esa bashorat qiluvchilar korrelatsiyalashganda model barqarorligini oshiradi va shu bilan birga ahamiyatsiz koeffitsientlarni nolga tushirish qobiliyatini saqlab qoladi. Aralashtirish parametri 0.5 ga sozlangan bo'lib, ikkala jarima komponentiga teng vazn berdi, umumiy regulyatsiya kuchi esa ROC egri chizig'i ostidagi maydonni maximallashtiruvchi besh karrali kross-validatsiya yordamida optimallashtirildi. Model 5000 martagacha bo'lgan maksimal iteratsiyalar bilan SAGA optimizatsiya algoritmi yordamida o'rnatildi. O'zgaruvchilarning muhimligi LASSO modeli uchun tasvirlangan protsedura asosida aniqlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Elastic Net — bu LASSO va Ridge usullarini birlashtirgan gibrid regressiya usuli bo'lib, muhim belgilarni tanlaydi va ular orasidagi kuchli bog'liqlikni bartaraf etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gbm-feature-importance\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#gbm-feature-importance\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GBM Feature Importance&lt;/span&gt;&lt;/a&gt;GBM Feature Importance&lt;/h4&gt;\n&lt;p&gt;Parametrik regulyatsiya usullaridan tashqari, ansamblga asoslangan yondashuv orqali o'zgaruvchilarning muhimligini baholash uchun GBM qo'llanildi. GBM ketma-ket ravishda sayoz qaror daraxtlarini birlashtiradigan ansambl usuli bo'lib, har bir keyingi daraxt joriy ansamburning qoldiq xatolariga moslashtiriladi va shu tariqa funksiya makonida gradient tushishi orqali yo'qotish funksiyasini minimallashtiradi. Model reproduktsiyani ta'minlash uchun qat'iy tasodifiy urug' (random_state = 42) bilan scikit-learn dagi GBM regressor yordamida amalga oshirildi, bunda 100 ta busting bosqichi, 0.1 o'rganish tezligi, maksimal daraxt chuqurligi 3 va subdispersiya ulushi 1.0 ishlatildi. LASSO modeli uchun tasvirlangan bir xil oldindan ishlov berish quvuri qo'llanildi. O'zgaruvchilarning muhimligi barcha daraxtlardagi har bir bashorat qiluvchiga tegishli bo'lgan tugun nopokligining kümülatif kamayishi sifatida baholandi, ko'p darajali kategorik o'zgaruvchilar esa oldingi tartibga muvofiq ularning ko'rsatkich shartlari bo'yicha yig'ildi.&lt;/p&gt;\n&lt;h4 id=\"rffeatureselection\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#rffeatureselection\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RFFeatureSelection&lt;/span&gt;&lt;/a&gt;RFFeatureSelection&lt;/h4&gt;\n&lt;p&gt;GBM ansambl yondashuvini to'ldirgan holda, mustaqil daraxtga asoslangan strategiya orqali o'zgaruvchilar muhimligini qo'shimcha baholash uchun RF regressoridan foydalanildi. GBM dan farqli o'laroq, RF parallel ravishda bir nechta qaror daraxtlarini quradi, ularning har biri o'qitish ma'lumotlarining buxstrap namunasi ustida o'stiriladi va daraxtlar orasidagi korrelatsiyani kamaytirish hamda umumlashtirishni yaxshilash uchun har bir bo'linishda bashorat qiluvchilarning tasodifiy kichik to'plami ko'rib chiqiladi. Model scikit-learn da 500 ta qaror daraxti (n_estimators = 500) va takrorlanishini ta'minlash uchun qat'iy tasodifiy urug' (random_state = 42) yordamida amalga oshirildi, qolgan barcha giperparametrlar o'z standart holatida qoldirildi. LASSO uchun tasvirlangan oldindan ishlov berish quvuri qo'llanildi. O'zgaruvchining muhimligi barcha daraxtlar bo'ylab har bir bashorat qiluvchiga tegishli Gini nopokligining o'rtacha pasayishi sifatida aniqlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Belgilarni tanlash va ularning muhimligini baholash uchun uchta model (Elastic Net, 5000 iteratsiyali / 100 bosqichli GBM va 500 daraxtli RF) qo'llanildi, bu esa tahlilning multikollinearlikka chidamliligini ta'minladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"evaluationmetrics\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#evaluationmetrics\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;EvaluationMetrics&lt;/span&gt;&lt;/a&gt;EvaluationMetrics&lt;/h4&gt;\n&lt;p&gt;Modelning ishlashi standart tasniflash metrikalari yordamida baholandi:&lt;/p&gt;\n&lt;h4 id=\"accuracy\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#accuracy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Accuracy&lt;/span&gt;&lt;/a&gt;Accuracy&lt;/h4&gt;\n&lt;p&gt;Accuracy = \\frac{TP + TN}&lt;/p&gt;\n&lt;h4 id=\"f1-score\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#f1-score\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;F1-score&lt;/span&gt;&lt;/a&gt;F1-score&lt;/h4&gt;\n&lt;p&gt;F1 = \\frac{2 \\cdot  ext{Precision} \\cdot  ext{Recall}}{ ext{Precision} +  ext{Recall}}&lt;/p&gt;\n&lt;h4 id=\"matthewscorrelationcoefficientmcc\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#matthewscorrelationcoefficientmcc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MatthewsCorrelationCoefficient(MCC)&lt;/span&gt;&lt;/a&gt;MatthewsCorrelationCoefficient(MCC)&lt;/h4&gt;\n&lt;p&gt;MCC = \\frac{TP \\cdot TN - FP \\cdot FN}{\\sqrt{(TP + FP)(TP + FN)(TN + FP)(TN + FN)}}&lt;/p&gt;\n&lt;h4 id=\"roc-auc\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#roc-auc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ROC-AUC&lt;/span&gt;&lt;/a&gt;ROC-AUC&lt;/h4&gt;\n&lt;p&gt;ROC-AUC modelning barcha qaror chegaralari bo'ylab sinflarni farqlash qobiliyatini o'lchaydi:&lt;br /&gt;\nAUC = \\int_{1}^{0}  ext{TPR}( ext{FPR}^{-1}(t)) , dt&lt;/p&gt;\n&lt;h4 id=\"brierscore\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#brierscore\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;BrierScore&lt;/span&gt;&lt;/a&gt;BrierScore&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"concepts/brier-score.html\"&gt;Brier bali&lt;/a&gt; ehtimollik bashoratlarining aniqligini baholaydi:&lt;br /&gt;\next{Brier Score} = \\frac{1}{n} \\sum_{i=1}^{n} (y_i - \\hat{p}_i)^2&lt;/p&gt;\n&lt;p&gt;CVD bashorati kontekstida yuqori xavfli bemorlarni aniqlash uchun sezgirlik juda muhim, ROC-AUC esa umumiy diskriminatsion ko'rsatkichni aks ettiradi. F1-ball aniqlik va to'liqlikni muvozanatlashtiradi, ayniqsa muvozanatsiz ma'lumotlar to'plamlarida. MCC hatto sinflar muvozanatsiz bo'lganda ham tasniflash sifatining ishonchli o'lchovini ta'minlaydi, Brier bali esa ehtimollik kalibratsiyasini baholaydi.&lt;/p&gt;\n&lt;h4 id=\"uncertaintyestimationforperformanceevaluation\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#uncertaintyestimationforperformanceevaluation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;UncertaintyEstimationforPerformanceEvaluation&lt;/span&gt;&lt;/a&gt;UncertaintyEstimationforPerformanceEvaluation&lt;/h4&gt;\n&lt;p&gt;Ushbu tadqiqotda &lt;span class=\"yfm-latex\" data-content=\"y_i%20%5Cin%20%5C%7B0%2C%201%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; CVD yo'qligi yoki mavjudligini ko'rsatganligi sababli, eng yaxshi ishlaydigan ML modelining unumdorligi accuracy, F1-score, MCC, ROC-AUC, AUPRC va Brier score yordamida baholandi. Ishlash baholaridagi noaniqlikni aniqlash uchun test to'plamida buxstrap qayta namuna olish amalga oshirildi. Har bir buxstrap replikatsiyasi uchun &lt;span class=\"yfm-latex\" data-content=\"m%20%3D%201%2C%20%5Cdots%2C%20M\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; metrikalar qayta hisoblandi: &lt;span class=\"yfm-latex\" data-content=\"%5C%7B%5Chat%7B%20heta%7D%5E%7B(m)%7D%5C%7D_%7Bm%3D1%7D%5EM\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Empirik 95% ishonch intervallari buxstrap taqsimotining 2.5 va 97.5 foizellaridan olindi. Bashoratli noaniqlik daraxt bo'yicha ehtimollik baholarining dispersiyasi bilan tavsiflandi:&lt;/p&gt;\n&lt;p&gt;\\hat{\\sigma}^2(x_i) = \\frac{1}{B} \\sum_{b=1}^{B} (p_b(x_i) - \\bar{p}(x_i))^2&lt;/p&gt;\n&lt;p&gt;bu yerda B — daraxtlarning umumiy soni, p_b(x_i) — b-chi daraxtdagi kuzatuv uchun bashorat qilingan ehtimollik, va &lt;span class=\"yfm-latex\" data-content=\"%5Cbar%7Bp%7D(x_i)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — barcha daraxtlardagi o'rtacha bashorat qilingan ehtimollik. Bashorat entropiyasi &lt;span class=\"yfm-latex\" data-content=\"H(x_i)%20%3D%20-%5Cbar%7Bp%7D(x_i)%20%5Clog%20%5Cbar%7Bp%7D(x_i)%20-%20(1%20-%20%5Cbar%7Bp%7D(x_i))%20%5Clog%20(1%20-%20%5Cbar%7Bp%7D(x_i))\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; sifatida hisoblandi, epistemik noaniqlik esa o'zaro axborot yordamida aniqlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Buxstrap va daraxt dispersiyasi orqali noaniqlikni baholash modelning bashoratlardagi ishonchsizligini aniqlashga yordam beradi, ammo bu test to'plamining sifatiga bog'liq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"biomarkerlar-tasirini-tahlil-qilish-boyicha-sababiy-bogliqlik-tadqiqoti-usullari-linear-dml\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#biomarkerlar-tasirini-tahlil-qilish-boyicha-sababiy-bogliqlik-tadqiqoti-usullari-linear-dml\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Biomarkerlar ta'sirini tahlil qilish bo'yicha sababiy bog'liqlik tadqiqoti usullari: Linear DML&lt;/span&gt;&lt;/a&gt;Biomarkerlar ta'sirini tahlil qilish bo'yicha sababiy bog'liqlik tadqiqoti usullari: Linear DML&lt;/h4&gt;\n&lt;p&gt;Har bir klinik xususiyatning yurak kasalligi ehtimoliga ta'sir qiluvchi sababiy bog'liqlik effekti Linear DML yordamida baholandi. Bu qisman chiziqli regressiya tuzilmasi bo'lib, tasodifiy o'rmon yordamida kuzatilgan chalkashliklarni moslashuvchan tarzda tuzatgandan so'ng har bir xususiyatning o'rtacha davolash effektini (ATE) ajratib oladi. Har bir xususiyat navbat bilan davolash o'zgaruvchisi sifatida, qolganlari esa kovariatalar sifatida ko'rib chiqildi. Natija ham, davolash ham besh karrali kross-fitting orqali kovariatalar to'plamida qoldiqlandi, ATE esa natija qoldiqlarini davolash qoldiqlariga regressiya qilish orqali tiklandi va asimptotik jihatdan to'g'ri ishonch intervallari hamda p-qiymatlarini berdi. Modellar erkaklar (n = 725) va ayollar (n = 193) kenja guruhlari uchun alohida baholandi.&lt;/p&gt;\n&lt;h4 id=\"causalforestdml\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#causalforestdml\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CausalForestDML&lt;/span&gt;&lt;/a&gt;CausalForestDML&lt;/h4&gt;\n&lt;p&gt;Davolash effektlarining turlicha namoyon bo'lishini baholash uchun mualliflar &lt;a href=\"concepts/causalforestdml.html\"&gt;CausalForestDML&lt;/a&gt; usulidan foydalandilar. Bu ikki marta mashinaviy o'qitish (DML) yondashuvining nokorrelyatsion kengaytmasi bo'lib, chiziqli modelni causal forest (sababiy o'rmon) bilan almashtiradi va ta'sir effektlarining kovariatalar bo'ylab moslashuvchan tarzda o'zgarishiga imkon beradi. Har bir klinik belgi navbatma-navbat ta'sir etuvchi o'zgaruvchi sifatida, qolgan belgilar esa kovariatalar sifatida ko'rib chiqildi. Natija va ta'sirni shovqindan tozalash uchun tasodifiy o'rmon (Random Forest) asosidagi nuisance-modellar va besh karrali kesishgan tekshiruvdan (five-fold cross-fitting) foydalanildi, shundan so'ng causal forest har bir ishtirokchi uchun shartli o'rtacha ta'sir effektlarini (CATE) hisoblab chiqdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CausalForestDML — bu tasodifiy o'rmonlar va sababiy tahlilni birlashtiruvchi ilg'or usul bo'lib, u xavf omillarining murakkab, chiziqli bo'lmagan ta'sirini aniqlashga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Taqdim etilgan o'rtacha ta'sir effektlari (ATE) har bir jinsiy guruh ichidagi CATE ko'rsatkichlarini o'rtachalashtirish yo'li bilan olindi. Ushbu moslashuvchanlik oddiy chiziqli model o'tkazib yuborishi mumkin bo'lgan murakkab va guruhga xos sababiy qonuniyatlarni aniqlash imkonini beradi, biroq buning evaziga ishonch intervallari biroz kengayadi. Modellar erkaklar (n = 725) va ayollar (n = 193) guruhlari uchun alohida-alohida hisoblab chiqildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tahlil erkaklar (n = 725) va ayollar (n = 193) kabi turlicha hajmdagi guruhlar uchun alohida bajarilgan bo'lib, natijalarning to'g'riligi hisobga olinmagan omillar yo'qligi va taqsimotlar mos kelishiga bog'liq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Hisobga olinmagan chalkashtiruvchi omillar mavjud bo'lmaganda, shuningdek taqsimotlarning kesishishi va qisman chiziqlilik shartlari bajarilganda, ATE baholari har bir belgining yurak kasalliklari xavfiga qo'shgan o'rtacha sababiy ahamiyatli hissasini bildiradi. ATE ko'rsatkichlari Python dasturlash tilidagi EconML paketi tarkibidagi LinearDML va CausalForestDML usullari yordamida hisoblandi.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"characteristic-maleor95percentci-femaleor95percentci\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#characteristic-maleor95percentci-femaleor95percentci\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Characteristic MaleOR(95%CI) FemaleOR(95%CI)&lt;/span&gt;&lt;/a&gt;Characteristic MaleOR(95%CI) FemaleOR(95%CI)&lt;/h4&gt;\n&lt;p&gt;Jins va boshqa parametrlar bo'yicha tuzatish kiritilgan tahlil erkaklar va ayollarda klinik belgilar hamda yurak-qon tomir kasalliklari (YQTK) xavfi o'rtasidagi bog'liqlik kuchida farqlar borligini ko'rsatdi (2-jadval). Masalan, angiografiyada bo'yalgan tomirlar soni (ca) har ikki jinsda ham yuqori imkoniyatlarni ko'rsatdi: erkaklar uchun OR = 7.42 (95% CI: 4.94–11.7) va ayollar uchun OR = 2.56 (95% CI: 1.64–4.17). Ko'krak qafasidagi og'riqlar (cp: erkaklarda OR = 3.01 [2.48–3.69], ayollarda OR = 4.44 [2.71–7.83]) hamda ST segmentining depressiyasi (oldpeak va slope) har ikki jinsda ham katta rol o'ynaydi. Aksincha, xolesterin darajasi (chol) bu kesimda sezilarli chiziqli ta'sir ko'rsatmadi (ikkala jins uchun ham OR = 1.00).&lt;/p&gt;\n&lt;h4 id=\"agegroup\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#agegroup\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Agegroup&lt;/span&gt;&lt;/a&gt;Agegroup&lt;/h4&gt;\n&lt;p&gt;Yosh bo'yicha stratifikatsiya qilingan logistik regressiya tahlili erkaklarda yosh va yurak kasalliklari o'rtasidagi bog'liqlik ayollarga qaraganda kuchliroq ekanligini aniqladi. 29–39 yoshdagi kattalar reference guruh sifatida olindi. 40–59 yoshdagi erkaklarda YQTK rivojlanish ehtimoli sezilarli darajada yuqori bo'ldi (OR = 2.36, 95% CI: 1.37–4.14, p = 0.002), 60–77 yoshdagi guruhda эsa bu xavf yanada oshdi (OR = 6.95, 95% CI: 3.76–13.1, p &amp;lt; 0.001). 40–59 yoshli ayollarda yosh bilan sezilarli bog'liqlik kuzatilmadi (OR = 1.41, 95% CI: 0.43–6.41, p = 0.60), 60–77 yoshdagi kattaroq ayollarda эsa statistik ahamiyat chegarasidagi o'sish qayd etildi (OR = 3.86, 95% CI: 1.11–18.1, p = 0.051). Mualliflarning fikricha, bunday farqlar estrogenning himoya ta'siri va koronar anatomiya xususiyatlari bilan izohlanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Yosh erkaklarda YQTK xavfi bilan kuchliroq bog'langan (60–77 yoshli guruhda OR 6.95 gacha), ayollarda эsa xavfning sezilarli o'sishi keyinroq boshlanadi va kuchsizroq namoyon bo'ladi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"modelperformanceandpredictionanalysis\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#modelperformanceandpredictionanalysis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ModelPerformanceandPredictionAnalysis&lt;/span&gt;&lt;/a&gt;ModelPerformanceandPredictionAnalysis&lt;/h4&gt;\n&lt;p&gt;YQTKni bashorat qilish uchun turli xil mashinaviy o'qitish modellari sinovdan o'tkazildi (4-rasm). Ansambl usullari, xususan tasodifiy o'rmon (Random Forest, RF) ikkala jins guruhida ham yuqori ROC-AUC, AUPRC va F1-score qiymatlari bilan turg'un yuqori natijalarni ko'rsatdi. Logistik regressiya (LR) ham raqobatbardosh natijalarni namoyish etib, chiziqli bog'liqliklarning muhimligini tasdiqladi. Ayollar kogortasida RF o'zaro tekshiruv barqarorligi bilan 0.90 ga yaqin ROC-AUC va AUPRC qiymatlariga erishdi. Erkaklarda ham RF va LR ajoyib metrikalarni ko'rsatdi, oddiy Bayes (GNB) va k-eng yaqin qo'shnilar (KNN) modellari эsa katta o'zgaruvchanlikka ega bo'ldi. Sinov va kross-validatsiya natijalarining bir xilligi kuchli haddan tashqari moslashish (overfitting) yo'qligidan dalolat beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;AUPRC — aniqlik va to'liqlikni hisobga oluvchi metrika bo'lib, ayniqsa muvozanatsiz tibbiy ma'lumotlar tahlilida muhim ahamiyat kasb etadi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"malesubgroup\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#malesubgroup\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Malesubgroup&lt;/span&gt;&lt;/a&gt;Malesubgroup&lt;/h4&gt;\n&lt;p&gt;Erkaklar kichik guruhida belgilarni tanlab olish to'rtta klassifikator (LASSO, ElasticNet, GBM va RF) yordamida amalga oshirildi (5-rasm). To'rtta modelda ham to'rtta asosiy bashorat qiluvchi omil ajralib turdi: ca (zararlangan tomirlar soni), cp (ko'krak og'rig'i turi), slope (ST segmenti qiyaligi) va thal (talliy testi natijalari). Masalan, ca LASSO da (taxminan 30%) va ElasticNet da (taxminan 32%) eng yuqori muhimlikka ega bo'ldi, cp RF da (taxminan 17%) va slope GBM da (taxminan 23%) ustunlik qildi. Uzluksiz belgilar o'rta o'rinlarni egalladi, ikkilik belgilar (restecg, fbs) esa minimal vaznga ega bo'ldi. To'rtala yondashuvning sifatini baholashda (3-jadval) ularning barchasi 90.4% dan 91.6% gacha bo'lgan auROC qiymatlarini ko'rsatdi.&lt;/p&gt;\n&lt;h4 id=\"ayollar-kenja-guruhi\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#ayollar-kenja-guruhi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ayollar kenja guruhi&lt;/span&gt;&lt;/a&gt;Ayollar kenja guruhi&lt;/h4&gt;\n&lt;p&gt;Ayollar kenja guruhida o‘zgaruvchilarning muhimlik darajalari erkaklarnikidan sezilarli darajada farq qildi (5-Rasm). To‘rtta tasniflagichning barchasida thal eng kuchli bashoratchi sifatida namoyon bo‘ldi: uning muhimligi RF modeli bo‘yicha taxminan 23% dan LASSO bo‘yicha 40% gacha yetdi — bu erkaklar guruhidagiga nisbatan sezilarli darajada yuqori. Slope va cp ko‘rsatkichlari ko‘pchilik modellarda ikkinchi va uchinchi o‘rinlarni egallab (10–21%), erkaklarda kuzatilgan muhimlik darajasini saqlab qoldi. Jinsga xos eng yaqqol farq zardobdagi xolesterin (chol) miqdorining oshgan ahamiyati bo‘lib, u ayollar uchun GBM (≈16%) va RF (≈12%) modellarida eng yaxshi to‘rtta bashoratchi qatoriga kirdi, erkaklarda эsa bu ko‘rsatkich o‘rtacha darajada edi. Yana bir e’tiborga molik jihat — ElasticNet modelida fbs ning yuqori o‘rin tutishi (≈19%), holbuki erkaklar modelida bu ko‘rsatkich nolga teng bo‘lib, qolgan uchta ayol modelining asosiy bashoratchilari qatorida umuman yo‘q edi; bu mazkur &lt;a href=\"concepts/ld.html\"&gt;bog‘liqlik&lt;/a&gt; modelga xos ekanligini yoki cheklangan ayollar tanlanmasidagi oz sonli holatlar bilan bog‘liqligini ko‘rsatadi. Aksincha, LASSO va ElasticNet modellarida erkaklar orasida eng muhim uchlikka kirgan ca ko‘rsatkichi ayollar kenja guruhida dastlabki o‘nlikka kirmadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ayollar kenja guruhida thal asosiy bashoratchi bo‘lib (40% gacha muhimlik), modellarning umumiy ajratish qobiliyati auROC bo‘yicha 90.0% dan 94.8% gacha yuqori darajada saqlanib qoldi (RF modeli 94.8% bilan eng yaxshi natija ko‘rsatdi).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu topilmalar yurak-qon tomir kasalliklaridagi jinsiy tafovutlarga bag‘ishlangan adabiyotlarga mos keladi: ayollarda menopauzadan keyin umumiy xolesterin va LDL xolesterin darajasi oshadi, estrogenning yurak-qon tomir tizimini himoya qiluvchi ta’sirining yo‘qolishi esa erkaklarga nisbatan xavfning ortishiga olib keladi. Shu bilan birga, angiografiyada ayollarda obstruktiv bo‘lmagan yurak ishemik kasalligi erkaklarga qaraganda ko‘proq uchrashi hujjatlashtirilgan: shubhali yurak ishemik kasalligi bilan koronar angiografiyadan o‘tgan ayollarning taxminan 60–70 foizida obstruktiv bo‘lmagan patologiya aniqlansa, erkaklarda bu ko‘rsatkich 30% atrofida bo‘ladi. Bu holat ayollarda pastroq qon tomir ballari va obstruktiv shikastlanishlarning kamroq uchrashida o‘z aksini topadi [39], bu esa ca ko‘rsatkichi nima uchun ayollar kenja guruhida kichikroq bashorat og‘irligiga ega ekanligining klinik izohini beradi. Umuman olganda, ushbu kuzatishlar klinik bashoratchilarning yurak kasalligi xavfiga qo‘shadigan nisbiy hissasi jinsga qarab farq qilishini va jins bo‘yicha stratifikatsiya qilingan modellar klinik jihatdan muhim patofiziologik farqlarni yaxshiroq aniqlashini ko‘rsatadi. Mashinali o‘qitishga asoslangan turli xususiyatlarni tanlash yondashuvlari yordamida ayollar kenja guruhi uchun modelning ishlashi 3-Jadvalda keltirilgan.&lt;/p&gt;\n&lt;p&gt;Umumiy ko‘rsatkichlar erkaklar guruhida kuzatilgan qiymatlarga o‘xshash yoki biroz yuqori bo‘lib, auROC qiymatlari 90.0% dan 94.8% gacha o‘zgardi. RF asosidagi xususiyatlarni tanlash yondashuvi eng yuqori auROC (94.8%) ko‘rsatkichiga erishdi, undan keyin ElasticNet (93.8%) va GBM (93.1%) keldi. Sezuvchanlik (Sensitivity) 60.0% dan 80.0% gacha bo‘lgan diapazonni tashkil etdi, xususiylik (Specificity) эsa barcha yondashuvlar bo‘yicha barqaror ravishda yuqori (89.7%–96.6%) bo‘lib qoldi, bu musbat holatlarni aniqlashga qaraganda sog‘lom shaxslarni aniqlashda kuchliroq samaradorlikni ko‘rsatadi. Bu natijalar ayollar tanlanmasining kichikroq hajmi va sinflarning potentsial nomutanosibligini aks ettirishi mumkin, bu esa kenja guruhga xos ko‘rsatkichlarni ehtiyotkorlik bilan talqin qilish kerakligini bildiradi.&lt;/p&gt;\n&lt;h4 id=\"jinslar-boyicha-taqqoslash\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#jinslar-boyicha-taqqoslash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Jinslar bo‘yicha taqqoslash&lt;/span&gt;&lt;/a&gt;Jinslar bo‘yicha taqqoslash&lt;/h4&gt;\n&lt;p&gt;Ikki kenja guruhni taqqoslashda bir nechta muhim jihatlarni ta’kidlash joiz. Birinchidan, cp, slope, thal, chol, oldpeak va trestbps kabi o‘zgaruvchilar har ikkala jins uchun ham top-o‘nlikka kirdi, bu esa umumiy asosiy bashoratchilar majudligini bildiradi. Ikkinchidan, ca faqat erkaklar uchun, restecg esa faqat ayollar uchun muhim bo‘lib chiqdi, bu esa keyingi tadqiqotlarni talab qiladigan potentsial jinsga xos biomarkerlarni ko‘rsatadi. Uchinchidan, ayollarda umumiy diskriminatsiya (auROC) o‘xshash yoki yuqori bo‘lishiga qaramay, sezuvchanlik va xususiylik o‘rtasidagi muvozanat jinslar bo‘yicha sezilarli darajada farq qildi — erkaklar modellari sezuvchanlikka, ayollar modellari esa xususiylikka ustunlik berdi. Ushbu natijalar yurak kasalliklari uchun jins bo‘yicha stratifikatsiya qilingan bashorat modellarini ishlab chiqishni qo‘llab-quvvatlaydi, chunki yagona umumiy model bashoratchilarning muhimligi va ishlatilish xususiyatlaridagi klinik jihatdan ahamiyatli farqlarni yashirishi mumkin.&lt;/p&gt;\n&lt;h4 id=\"butstrap-yordamida-ishlash-korsatkichlarining-noaniqligini-baholash\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#butstrap-yordamida-ishlash-korsatkichlarining-noaniqligini-baholash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Butstrap yordamida ishlash ko‘rsatkichlarining noaniqligini baholash&lt;/span&gt;&lt;/a&gt;Butstrap yordamida ishlash ko‘rsatkichlarining noaniqligini baholash&lt;/h4&gt;\n&lt;p&gt;6-Rasmda erkaklar va ayollar yurak-qon tomir kasalliklari kohortalarida RF modeli samaradorligining butstrapga asoslangan noaniqlikni aniqlash (UQ) natijalari keltirilgan. Test to‘plamini takroriy butstrap yordamida qayta tanlab olish orqali F1-score, MCC, ACC, ROC-AUC, aniqlash-eslab qolish egri chizig‘i ostidagi maydon (AUPRC) va Brier ko‘rsatkichlarining taqsimoti baholandi. Nuqtali baholar empirik 95% ishonch oralig‘i bilan birga ko‘rsatilgan. Umuman olganda, RF modeli ikkala kohortada ham kuchli bashorat qilish ko‘rsatkichini ko‘rsatdi, ROC-AUC va AUPRC uchun nisbatan tor noaniqlik intervallari diskriminatsiya barqarorligidan dalolat beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ayollar guruhida F1-score va MCC uchun kuzatilgan kengroq ishonch intervallari kichikroq tanlanma hajmi va ayollar kenja guruhidagi yuqori turlicha o‘zgaruvchanlik (heterogenlik) bilan bog‘liq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Erkaklar kohortasi yuqori F1-score, MCC va ROC-AUC qiymatlari atrofida jamlangan butstrap taqsimotlari bilan izchil yuqori bashorat aniqligini namoyish etdi, bu qayta tanlab olingan ma’lumotlar to‘plamida mustahkam tasniflash barqarorligini ko‘rsatadi. Brier ko‘rsatkichi taqsimoti nisbatan past qiymatlarga yo‘naltirilgan bo‘lib, yaxshi ehtimollik kalibrlashidan dalolat berdi. Ayollar kohortasida ham model kuchli diskriminatsiyani, xususan ROC-AUC va AUPRC uchun ko‘rsatdi, garchi erkaklar guruhiga nisbatan F1-score va MCC uchun kengroq butstrap taqsimotlari kuzatilgan bo‘lsa ham. Bu ortib borayotgan o‘zgaruvchanlik kichikroq tanlanma hajmi va ayollar kenja guruhidagi katta heterogenlikni aks ettiradi. Ushbu o‘zgaruvchanlikka qaramay, ishonch intervallari klinik jihatdan maqbul diapazonlarda qoldi va modelning ishonchliligi saqlanib qolganini ko‘rsatdi.&lt;/p&gt;\n&lt;p&gt;Shuni ta’kidlash kerakki, ROC-AUC va AUPRC ikkala kohortada ham eng kichik nisbiy noaniqlikni ko‘rsatdi, bu darajali diskriminatsiya chegaraga bog‘liq bo‘lgan F1-score va MCC kabi tasniflash metrikalariga qaraganda barqarorroq bo‘lganini bildiradi. Aksincha, nisbatan past va barqaror Brier ko‘rsatkichlari bashorat qilingan ehtimolliklarning yetarli darajada kalibrlanganligini tasdiqlaydi. Yig‘indi holda, ushbu topilmalar taklif etilgan RF tizimi jins bo‘yicha stratifikatsiya qilingan yurak-qon tomir kasalliklari populyatsiyalarida o‘lchanadigan noaniqlik baholarini saqlab qolgan holda kuchli va takrorlanadigan bashorat samaradorligiga erishganini ko‘rsatadi.&lt;/p&gt;\n&lt;h4 id=\"biomarkerlar-tasirini-tahlil-qilish-uchun-jinsga-xos-assotsiatsiya-tadqiqoti\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#biomarkerlar-tasirini-tahlil-qilish-uchun-jinsga-xos-assotsiatsiya-tadqiqoti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Biomarkerlar ta'sirini tahlil qilish uchun jinsga xos assotsiatsiya tadqiqoti&lt;/span&gt;&lt;/a&gt;Biomarkerlar ta'sirini tahlil qilish uchun jinsga xos assotsiatsiya tadqiqoti&lt;/h4&gt;\n&lt;p&gt;Erkaklar va ayollar kenja guruhlarida yurak kasalliklari bilan mustahkam, chalkashtiruvchi omillar (konfaunderlar) bo'yicha tuzatilgan bog'liqliklarga ega o'zgaruvchilarni aniqlash uchun jins bo'yicha stratifikatsiyalangan Causal Forest DML va chiziqli LinearDML tahlillari qo'llanildi. Ushbu yondashuv sabab-oqibat yo'nalishini tasdiqlash uchun emas, balki kuzatuv ma'lumotlarining chalkashtiruvchi tuzilishi hisobga olingandan keyin qaysi bashorat qiluvchi omillar mazmunli bog'liqlikni saqlab qolishini baholash uchun ishlatildi. 7-rasmda ko'rsatilganidek, erkaklar orasida ca, slope, thal va exang ikkala baholovchi ostida ham eng kuchli tuzatilgan bog'liqliklarni ko'rsatdi, bu esa strukturaviy koronar obstruksiya va ishemik buzilishlar boshqa belgilar bilan korrelyatsion kesishishidan qat'iy nazar yurak kasalligi xavfi bilan mustahkam bog'langanligini bildiradi.&lt;/p&gt;\n&lt;h4 id=\"biomarkerlar-tasirini-tahlil-qilish-uchun-jinsga-xos-assotsiatsiya-tadqiqoti-davomi\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#biomarkerlar-tasirini-tahlil-qilish-uchun-jinsga-xos-assotsiatsiya-tadqiqoti-davomi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Biomarkerlar ta'sirini tahlil qilish uchun jinsga xos assotsiatsiya tadqiqoti (davomi)&lt;/span&gt;&lt;/a&gt;Biomarkerlar ta'sirini tahlil qilish uchun jinsga xos assotsiatsiya tadqiqoti (davomi)&lt;/h4&gt;\n&lt;p&gt;Ayollar orasida thal va slope ikkala baholovchi bo'ylab doimiy ravishda o'z ahamiyatini saqlab qoldi, bu ishemiya bilan bog'liq yo'llar ayollarda yurak-qon tomir xavfining markazida qolishini tasdiqlaydi; qolaversa, exang faqat parametrik LinearDML ostida ahamiyatli bo'ldi, ehtimol ayollar tanlanmasining kichikligi (n = 193) parametrik bo'lmagan Causal Forest DML aniqligini cheklagani sababli uning bog'liqligi thal va slopere qaraganda kamroq mustahkam bo'ldi. Shunga qaramay, ca ayollarda ahamiyatsiz bo'lib chiqdi, bu tomir patologiyasidagi jinsiy farqlarni yoki kichikroq ayollar tanlanmasi (n = 193) bilan bog'liq kamaygan statistik quvvatni aks ettirishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Causal Forest DML va LinearDML — ko'plab yashirin va oshkora omillarni hisobga olgan holda xususiyatlar ta'sirini baholovchi zamonaviy mashinali o'qitish usullaridir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Yosh, xolesterin, tinch holatdagi qon bosimi va och qoringa qon shakarini o'z ichiga olgan an'anaviy xavf omillari nolni qamrab oluvchi ishonch intervallari bilan ahamiyatsiz tuzatilgan bog'liqliklarni ko'rsatdi, bu ularning standart modellardagi ko'rinadigan bashoratli ahamiyati mustaqil bog'liqlikni emas, balki asosan umumiy korrelyatsion tuzilmani aks ettirishidan dalolat beradi. Causal Forest DML parametrik bo'lmagan moslashuvchanligiga mos ravishda LinearDMLga qaraganda kengroq ishonch intervallarini hosil qildi, biroq ikkala baholovchi ham bir xil ahamiyatli xususiyatlarda birlashdi va bu bog'liqliklarga bo'lgan ishonchni kuchaytirdi. Shuni ta'kidlash kerakki, ushbu tahlil kuzatuv ma'lumotlariga asoslanganligi sababli, o'lchanmagan konfaundrlarni istisno qilib bo'lmaydi va bu topilmalar o'rnatilgan sabab-oqibat ta'sirlari sifatida emas, balki konfaunderlarga tuzatilgan bog'liqliklar sifatida talqin qilinishi kerak.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kuzatuv ma'lumotlariga asoslangan bo'lib, aniqlangan bog'liqliklar sabab-oqibat ta'siri emas, balki tuzatilgan assotsiatsiyalardir, ayollar tanlanmasining kichikligi esa statistik quvvatni pasaytiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kalibrlash-va-klinik-foydalilik\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#kalibrlash-va-klinik-foydalilik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kalibrlash va klinik foydalilik&lt;/span&gt;&lt;/a&gt;Kalibrlash va klinik foydalilik&lt;/h4&gt;\n&lt;p&gt;Kalibrlash egri chiziqlari bashorat qilingan ehtimolliklar va kuzatilgan hodisalar chastotasi o'rtasida erkaklar va ayollar kohortalarida umumiy yaxshi mos kelishini ko'rsatdi, bu model yurak-qon tomir kasalliklari xavfini ishonchli aks ettirishidan dalolat beradi. Aniql klinik sharoitlarda ehtimollik baholari juda muhimdir, chunki xavfni haddan tashqari baholash keraksiz farmakologik aralashuvlarga olib kelishi mumkin, kam baholash esa erta profilaktika imkoniyatlarini qo'ldan boy berishiga sabab bo'lishi mumkin. 6-rasmda tasvirlangan va butstrеp yordamida baholangan Brier ballari erkaklar kenja guruhida taxminan 0.10 va ayollar kenja guruhida 0.07 atrofida markazlashgan bo'lib, model yurak-qon tomir kasalliklari xavfini tizimli ravishda oshirmasdan yoki kamaytirmasdan ishonchli va yaxshi kalibrlangan ehtimollik baholarini ishlab chiqarishini tasdiqladi.&lt;/p&gt;\n&lt;h4 id=\"kalibrlash-va-klinik-foydalilik-davomi\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#kalibrlash-va-klinik-foydalilik-davomi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kalibrlash va klinik foydalilik (davomi)&lt;/span&gt;&lt;/a&gt;Kalibrlash va klinik foydalilik (davomi)&lt;/h4&gt;\n&lt;p&gt;Sinov to'plami va kross-validatsiya unumdorligi baholari o'rtasidagi muvofiqlik, ayniqsa Random Forest (RF) kabi ansambl usullari uchun, taklif etilayotgan modellashtirish tizimining jins bo'yicha stratifikatsiyalangan populyatsiyalarda umumiy qo'llanilishi va takrorlanishini yanada kuchaytiradi. Qolaversa, jins bo'yicha stratifikatsiyalangan modellashtirish yondashuvi erkaklar va ayollar o'rtasidagi yurak-qon tomir patofiziologiyasidagi belgilangan farqlarni hisobga olish orqali klinik qo'llanilishini yaxshilaydi va bashorat qilingan xavf baholari klinik jihatdan muhim geterogenlikni yashirishi mumkin bo'lgan yagona umumiy modeldan olinmasdan, har bir bemor kenja guruhiga moslashtirilishini ta'minlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Modellar mukammal kalibrlashni ko'rsatdi (Brier bali erkaklarda ~0.10 va ayollarda ~0.07), bu ularning tashqi validatsiyadan so'ng yurak-qon tomir kasalliklari skriningiga integratsiya qilinishi mumkinligini tasdiqlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Umuman olganda, ushbu topilmalar taklif etilgan tizimni klinik amaliyotda yurak-qon tomir kasalliklari skriningi va erta aniqlash ish jarayonlariga potentsial integratsiya qilishni qo'llab-quvvatlaydi, garchi amalga oshirilishidan oldin qo'shimcha tashqi validatsiya va klinik baholash talab etilsa ham.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Brier bali (Brier score) — ehtimollik prognozlarining aniqligini baholovchi metrika bo'lib, nolga yaqin qiymatlar mukammal kalibrlashni bildiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;p&gt;Ushbu tadqiqotda yurak-qon tomir kasalliklarini (YQTK) bashorat qilish uchun mashinali o‘qitish, noaniqlikni baholash, tushuntiriladigan sun'iy intellekt va sabab-oqibat bog‘liqligi parametrlarini birlashtirgan kompleks sun'iy intellekt tizimi ishlab chiqildi va baholandi. 918 nafar ishtirokchidan (725 erkak va 193 ayol) iborat klinik kohorta tahlil qilindi. Natijalar shuni ko‘rsatadiki, ilg‘or yondashuvlar mukammal bashorat qilish ko‘rsatkichlarini ta'minlab, kasallik mexanizmlari va individual xavfni baholash bo‘yicha tushunarli ma'lumotlarni beradi. Taklif etilgan tizim oldingi tadqiqotlarning cheklovlarini bartaraf etib, klinik ishonchlilikni oshiradi.&lt;/p&gt;\n&lt;p&gt;Tadqiqotning asosiy yutug‘i gibrid imputatsiya strategiyasi orqali erishilgan sezilarli yaxshilanishdir. ca, thal va slope kabi yetishmaydigan ma'lumotlarga ega o‘zgaruvchilar MICE uzluksiz imputatsiyasi va RandomForest (RF) nazorat ostidagi kategorik imputatsiyasi yordamida qayta ishlandi. Imputatsiyadan so‘ng RF ko‘rsatkichlari yaxshilandi: F1-score 0.87 dan 0.89 gacha, ROC-AUC 0.90 dan 0.92 gacha, MCC 0.70 dan 0.73 gacha va AUPRC 0.88 dan 0.91 gacha oshdi.&lt;/p&gt;\n&lt;p&gt;Barcha tasniflagichlar orasida RF eng yaxshi natija ko‘rsatdi. Erkaklar guruhida RF eng yuqori auROC (91.6%) hamda 90.2% sezuvchanlik va 75.5% o‘ziga xoslikni ta'minladi. Ayollar guruhida RF 94.8% auROC ko‘rsatkichiga erishdi, biroq sezuvchanlik pastroq (60.0%) va o‘ziga xoslik yuqori bo‘lib qoldi (96.6%). Logistik regressiya (LR) ham raqobatbardosh bo‘lib, erkaklar va ayollarda mos ravishda 90.7% va 90.0% auROC qiymatlarini ko‘rsatdi. Belgilar muhimligi tahlili erkaklar va ayollarda ham umumiy, ham jinsga xos xavf omillarini aniqladi. Erkaklarda ca, cp, slope va thal eng muhim bashorat qiluvchilar qatoriga kirdi. Ayollarda esa thal asosiy bashorat qiluvchi bo‘lib chiqdi (LASSO bo‘yicha 40% va RF bo‘yicha ~23%). Butstrap yordamida o‘tkazilgan noaniqlik tahlili ROC-AUC uchun tor ishonch intervallarini ko‘rsatdi, garchi ayollarda kichikroq tanlanma hajmi (n=193) tufayli tarqoqlik kattaroq bo‘lsa ham.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gibrid imputatsiya va RF yondashuvi YQTK bashorat qilish aniqligin
