i oshirib (ROC-AUC 0.92, ayollarda 94.8%), jinsga xos farqlarni aniqladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"strengths,-limitations,-and-validation\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#strengths,-limitations,-and-validation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Strengths, Limitations, and Validation&lt;/span&gt;&lt;/a&gt;Strengths, Limitations, and Validation&lt;/h4&gt;\n&lt;p&gt;Ishning muhim hissalaridan biri yurak-qon tomir xavfini baholashga sabab-oqibatli mashinali o‘qitish (DML) usullarini integratsiya qilish edi. Jins bo‘yicha ajratilgan DML tahlillari erkaklarda ca, slope, thal va exang ni eng kuchli bog‘liqliklar sifatida aniqladi, ayollarda esa thal va slope muhimligicha qoldi, ca esa ahamiyatsiz bo‘lib qoldi. Qizig‘i shundaki, an'anaviy xavf omillari (yosh, xolesterin, qon bosimi) chalg‘ituvchi omillar hisobga olingandan so‘ng ahamiyatsiz o‘rtacha ta'sir ko‘rsatdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sabab-oqibatli mashinali o‘qitish (DML) — oddiy statistik korrelyatsiyalar va haqiqiy sabab-oqibat xavf omillarini farqlovchi uslubiyot.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Cheklovlarga retrospektiv kuzatuv ma'lumotlaridan foydalanilgani va ayollar subpopulyatsiyasining kichikligi kiradi, bu esa kelgusida ko‘p markazli yirik populyatsiyalarda tashqi validatsiyani talab qiladi. Shuningdek, sabab-oqibat tahlili to‘liq tekshirib bo‘lmaydigan taxminlarga tayanadi. Kelgusida prospektiv klinik joriy etish, elektron tibbiy yozuvlar va taqiladigan datchiklar ma'lumotlarini integratsiya qilish rejalashtirilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot retrospektiv ma'lumotlarga asoslangan bo‘lib, ayollar soni kam (n=193), shuning uchun sabab-oqibat xulosalari prospektiv klinik validatsiyani talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"jamoat-sogligini-saqlashga-tatbiq-etish\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#jamoat-sogligini-saqlashga-tatbiq-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Jamoat sog'lig'ini saqlashga tatbiq etish&lt;/span&gt;&lt;/a&gt;Jamoat sog'lig'ini saqlashga tatbiq etish&lt;/h4&gt;\n&lt;p&gt;Jamoat sog'lig'ini saqlash nuqtai nazaridan, ushbu natijalar amaliyot uchun muhim ahamiyatga ega. Birinchidan, yuqori bashorat aniqligi bilan xavf guruhi yuqori bo'lgan shaxslarni aniqlash imkoniyati ertangi aralashuv va maqsadli profilaktik yordamni osonlashtirib, yurak-qon tomir kasalliklari va o'lim ko'rsatkichlarini potentsial ravishda kamaytiradi. Ikkinchidan, jinsiy xususiyatlarga bog'liq sababiy determinantlarning aniqlanishi shaxsiylashtirilgan profilaktika strategiyalari va aniq kardiologiya tashabbuslarini rivojlantirishni qo'llab-quvvatlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Xavf guruhlarini aniq aniqlash va jinsiy xususiyatlarni hisobga olish erta profilaktika va shaxsiylashtirilgan yondashuv orqali yurak-qon tomir kasalliklarini kamaytirishga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Uchinchidan, noaniqlikni hisobga oluvchi bashoratlar shifokorlarning ishonganini oshiradi va sun'iy intellekt tizimlarini kunduzgi tibbiy amaliyotga mas'uliyat bilan integratsiya qilishga ko'maklashadi, chunki noaniqlik baholari shifokorlarga qo'shimcha baholash yoki ehtiyotkorona talqin qilishni talab qiladigan bashoratlarni aniqlashga yordam beradi. Nihoyat, jismoniy zo'riqish natijasida yuzaga keladigan ishemik javoblar kabi o'zgartirilishi mumkin bo'lgan xavf omillarining sabablarini aniqlash jamoat sog'lig'ini saqlash resurslarini skrining, profilaktika va turmush tarzini o'zgartirishga yanada samarali taqsimlashni qo'llab-quvvatlaydi. Mashinali o'qitish bir nechta xavf omillarini birlashtirish va ma'lumotlardagi naqshlarni aniqlash orqali an'anaviy yurak-qon tomir xavfini bashorat qilishni to'ldirishi mumkin, ammo uni o'rnini bosa olmaydi, garchi kengroq klinik foydalanish avvalo real sharoitlarda istiqbolli tekshiruvdan o'tishiga bog'liq bo'ladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mashinali o'qitish algoritmlarini kunduzgi tibbiy amaliyotga keng joriy etish real sharoitdagi ma'lumotlar asosida oldindan tekshiruvdan o'tishni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;Юрак-қон томир касалликлари глобал миқёсда соғлиқни сақлашнинг асосий муаммоси бўлиб қолаётгани аниқ, ишончли ва шифокорлар учун тушунарли бўлган прогноз моделларига бўлган эҳтиёжни яққол кўрсатади. Ушбу тадқиқотда тузилмавий клиник маълумотлар асосида юрак-қон томир касалликлари хавфини олдиндан айтиш учун гибрид маълумотларни тайёрлаш, илғор машинавий ўқитиш, ноаниқликни баҳолаш, тушунарли сунъий интеллект ва сабаб-оқибат боғлиқлигини таҳлил қилишни бирлаштирган комплекс сунъий интеллект тизими ишлаб чиқилди.&lt;/p&gt;\n&lt;p&gt;Узлуксиз ўзгарувчилар учун занжирли тенгламалар орқали кўплик импутациясини ва тоифали ўзгарувчилар учун тасодифий ўрмон импутациясини бирлаштирган гибрид стратегия маълумотлар сифатини ошириб, прогноз сифатини яхшилади, бунда F1-score кўрсаткичи 0.87 дан 0.89 га, ROC-AUC эса 0.90 дан 0.92 га кўтарилди.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Импутация (MICE ва RF) — тиббий карталардаги етишmayotgan қийматларни статистик усуллар ёрдамида тўлдириш жараёни бўлиб, таҳлил сифатини сақлаб қолишга ёрдам беради.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Синовдан ўтказилган барча машинавий ўқитиш моделлари орасида тасодифий ўрмон (RF) алгоритми ҳам эркаклар, ҳам аёллар гуруҳларида изчил равишда энг юқори натижаларни кўрсатди. У 0.90 дан юқори ROC-AUC қийматларини, юқори AUPRC, F1-score, Мэтьюс корреляция коэффициенти (MCC) ва яхши калибрланишни таъминлаб, кросс-валидация шароитида барқарор умумлашувни сақлаб қолди. Бутстрэпга асосланган ноаниқликни баҳолаш прогнозларнинг мустаҳкам ва қайтарилувчан эканини кўрсатди.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ишлаб чиқилган тизим ROC-AUC ни 0.92 га ва F1-score ни 0.89 га етказди, тасодифий ўрмон модели эса иккала жинс учун ҳам юқори башорат барқарорлигини кўрсатди.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ушбу тадқиқотнинг асосий ҳиссаларидан biri юрак-қон томир хавфини баҳолашга сабаб-оқибат машинавий ўқитишни интеграция қилиш бўлди. LinearDML ва CausalForestDML моделлари сабабчи омилларни башорат қилувчи боғлиқликлардан ажратиб олиб, йирик қон томирлар сони, ST сегменти қиялиги, талассемия ҳолати ва зўриқиш стенокардиясини юрак касалликлари хавфининг энг кучли омиллари сифатида аниқлади.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сабаб-оқибат машинавий ўқитиш (Causal ML) — омиллар ва касаллик ўртасидаги оддий боғлиқликни эмас, балки амалий таъсир кўрсатиш мумкин бўлган ҳақиқий сабабларни аниқловчи ёндашув.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Аниқланган жинсга хос фарқлар умумий популяция моделига таяниш ўрнига шахсийлаштирилган хавфни баҳолаш муҳимлигини кўрсатади. Келажакдаги тадқиқотлар ушбу тизимни кенг кўламли кўп марказли когорталар, электрон тиббий ёзувлар ва проспектив клиник амалиётда текшириши лозим.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f-f1.jpg\" alt=\"1-rasm: Yurak-qon tomir kasalliklarini bashorat qilish uchun taklif etilgan noaniqlikka asoslangan mashinaviy o'qitish t\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Yurak-qon tomir kasalliklarini bashorat qilish uchun taklif etilgan noaniqlikka asoslangan mashinaviy o'qitish tizimi uchun tadqiqot jarayoni va assotsiatsiya tadqiqoti.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f-f2.jpg\" alt=\"2-rasm: Yosh va jins guruhlari bo'yicha uzluksiz va kategorik yurak-qon tomir xavf omillarining taqsimoti. Uzluksiz o'zg\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: Yosh va jins guruhlari bo'yicha uzluksiz va kategorik yurak-qon tomir xavf omillarining taqsimoti. Uzluksiz o'zgaruvchilar ularning taqsimotini ko'rsatish uchun zichlik grafikalari sifatida, kategorik o'zgaruvchilar esa har bir kategoriyadagi chastota sonlari bilan ustunli diagrammalar sifatida ko'rsatilgan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f-f3.jpg\" alt=\"3-rasm: Yurak kasalliklari ma'lumotlar to'plamida nazorat ostida to'ldirishdan oldin va keyin etishmayotgan ma'lumotlar \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm: Yurak kasalliklari ma'lumotlar to'plamida nazorat ostida to'ldirishdan oldin va keyin etishmayotgan ma'lumotlar tuzilishi va bashorat qilish samaradorligini taqqoslash.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-rasm: Yurak kasalliklari ma'lumotlar to'plamida nazorat ostida to'ldirishdan oldin va keyin etishmayotgan ma'lumotlar tuzilishi va bashorat qilish samaradorligini taqqoslash. Yuqori chap panelda bir nechta o'zgaruvchilarda sezilarli darajada ma'lumotlar yo'qligini ko'rsatadigan etishmayotganlik matritsasi ko'rsatilgan. Yuqori o'ng panelda eng ko'p etishmayotgan ulushga ega o'zgaruvchilar uchun foizlar ko'rsatilgan. Pastki panelda nazorat ostida to'ldirishdan oldin va keyin tasodifiy o'rmon tasnifi samaradorligi taqqoslanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f-f4.jpg\" alt=\"4-rasm: Erkaklar va ayollar kohortlarida yurak-qon tomir kasalliklarini bashorat qilish uchun mashinaviy o'qitish tasnif\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm: Erkaklar va ayollar kohortlarida yurak-qon tomir kasalliklarini bashorat qilish uchun mashinaviy o'qitish tasniflash modellarining qiyosiy samaradorligi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f-f5.jpg\" alt=\"5-rasm: Turli xil ranglar bilan ko'rsatilgan va jins bo'yicha stratifikatsiyalangan to'rtta turli xil mashinaviy o'qitis\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm: Turli xil ranglar bilan ko'rsatilgan va jins bo'yicha stratifikatsiyalangan to'rtta turli xil mashinaviy o'qitish modeli bo'yicha xususiyatlar muhimligining reytingi va yurak-qon tomir xavf omillarini taqqoslash.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f-f6.jpg\" alt=\"6-rasm: Jins bo'yicha stratifikatsiya qilingan RF unumdorlik metrikalarining butstrap taqsimotlari va 95% ishonch interv\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm: Jins bo'yicha stratifikatsiya qilingan RF unumdorlik metrikalarining butstrap taqsimotlari va 95% ishonch intervallari.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f-f7.jpg\" alt=\"7-rasm: Klinik xususiyatlarning yurak kasalligi ehtimoliga ta'sirining jinsga xos assotsiatsiya tadqiqotining mashinali \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-rasm: Klinik xususiyatlarning yurak kasalligi ehtimoliga ta'sirining jinsga xos assotsiatsiya tadqiqotining mashinali o'qish baholari.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;7-rasm: Klinik xususiyatlarning yurak kasalligi ehtimoliga ta'sirining jinsga xos assotsiatsiya tadqiqotining mashinali o'qish baholari. (a) va (b) panellari mos ravishda erkaklar va ayollar kenja guruhlari uchun LinearDML baholarini ko'rsatadi. (c) va (d) panellari mos ravishda erkaklar va ayollar kenja guruhlari uchun CausalForestDML baholarini ko'rsatadi. Nuqtalar o'rtacha davolash effektlarini, gorizontal chiziqlar эsa 95% ishonch intervallarini bildiradi. Qizil nuqtalar 5% darajada statistik ahamiyatli effektlarni, kulrang nuqtalar esa ahamiyatsiz effektlarni ko'rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weig
