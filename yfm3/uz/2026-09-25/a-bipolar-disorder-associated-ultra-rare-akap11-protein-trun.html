k loess&lt;/a&gt; normalizatsiyasidan o'tkazildi. Differensial miqdor tahlili limma::lmFit yordamida chiziqli modelni moslashtirish va limma::eBayes (trend=TRUE, robust=TRUE) orqali empirik Bayes tuzatishlarini kiritish orqali amalga oshirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Siklik loess — bu namunalar o'rtasidagi texnik farqlarni bartaraf etish va ma'lumotlar taqsimotini tekislash uchun ishlatiladigan statistik usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Fosfoproteomik ma'lumotlar Msnbase formatida qayta ishlandi, &lt;span class=\"yfm-latex\" data-content=\"%5Clog_2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; transformatsiya qilindi va siklik loess usuli bilan normalizatsiya qilindi. Fosforillanish tezligini baholash uchun umumiy proteom va fosfoproteom qiymatlari avval har bir namuna ichida kanal medianasiga nisbatan normalizatsiya qilindi. Fosfosaytlar miqdori mos keluvchi umumiy proteom miqdoriga nisbatan normalizatsiya qilindi va &lt;span class=\"yfm-latex\" data-content=\"%5Clog_2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; transformatsiya qilindi. Olingan fosforillanish tezligi qiymatlari yana siklik loess normalizatsiyasidan o'tkazildi. Differensial tahlil uchun limma vositalaridan foydalanildi.&lt;/p&gt;\n&lt;p&gt;Kinaza-substrat annotatsiyalari 2026-yil 5-aprelda olingan PTMsigDB (2.0.0 versiyasi) va RoKAI (2.3.0 versiyasi) kolleksiyalaridan olindi. RoKAI annotatsiyalari PhosphositePlus va Signor ma'lumotlariga asoslangan. Kinaza faolligini aniqlash uchun fosfosaytlar uchun «DE ballari» (DE scores) kiritildi, ular &lt;span class=\"yfm-latex\" data-content=\"-%5Clog_%7B10%7DP%20%20imes%20%20ext%7Bsign%7D(%5Clog_2%20%20ext%7Bfold%20change%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; formulasi bo'yicha hisoblandi. RoKAI usuliga ko'ra, kinaza faolligi balli uning substratlari DE ballarining o'rtacha qiymati sifatida aniqlandi va p-qiymati Z-testi yordamida baholandi. Shuningdek, PTMsigDB annotatsiyalari va viper (1.42.0 versiyasi) paketi yordamida muqobil kinaza faolligi testi qo'llanildi, bu usul boyitish ballarini (enrichment scores) baholash uchun rangli tahlil va p-qiymatlarni aniqlash uchun permutatsiya testidan foydalanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kinaza faolligi RoKAI usuli (substratlar DE ballari o'rtachasi) va viper paketi (rangli boyitish tahlili) yordamida baholanib, tizimli tahlil ishonchliligi ta'minlandi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Sekvenerifikatsiya qilingan ridlar Cell Ranger (9.0.1-versiya) dasturi yordamida cellranger count konveyeri orqali GRCm39/mm39 tayanch genomiga (10x Genomics, GRCm39-2024-A) moslashtirildi (--create-bam true, --include-introns=true, qolgan parametrlar standart). Hisoblash matritsasi SingleCellExperiment obyektlari (1.24.0-versiya) sifatida qayta ishlandi. Sifat nazorati va quyi tahlillar Debian GNU/Linux 11.7 konteynerida ishga tushirilgan R muhitida (4.3.0-versiya) bajarildi.&lt;/p&gt;\n&lt;p&gt;Sifat nazorati scDblFinder paketi (1.14.0-versiya) yordamida computeDoubletDensity (d=50) orqali ehtimoliy juft hujayralarni aniqlash va doubletThresholding (dbr=0.10, usul “griffiths”, returnType=“call”, p=0.01) yordamida chegaralashni o'z ichiga oldi. Keyinchalik har bir namuna bo'yicha hujayralar quyidagi mezonlar asosida saralandi: (a) umumiy noyob molekulyar identifikatorlar (&lt;a href=\"concepts/umi.html\"&gt;UMI&lt;/a&gt;) &amp;lt; 1000 yoki &amp;gt; 5 median mutlaq og'ish (MAD); (b) noyob aniqlangan genlar &amp;lt; 750 yoki &amp;gt; 5 MAD; (c) mitoxondrial genlarga mos kelgan UMI ulushi &amp;gt; 5 MAD. Oxirida barcha namunalarda 10 tadan kam nusxada ekspressiya qilingan genlar olib tashlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;snRNA-seq va UMI — yadro RНК sini sekvener qilish va noyob molekulyar metkalar bo'lib, fon shovqinini inobatga olmagan holda transkriptlarni aniq sanash imkonini beradi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Clasterlash va hujayra turlarini annotatsiya qilish ko'p bosqichli tartibda amalga oshirildi: 1. Normalizatsiya. Gen ekspressiyasi scuttle paketi (1.12.0-versiya) yordamida normalizeCounts orqali me'yorlashtirildi. 2. Belgilarni tanlash. Mitoxondrial va ribosomal genlar chiqarib tashlandi. Yuqori o'zgaruvchan genlar stats paketi (4.3.0-versiya) yordamida LOESS regressiyasi orqali aniqlandi (variatsiya chegarasi 0.3). P-qiymatlar FDR tuzatishi bilan hisoblandi. 3. O'lchamlarni qisqartirish. Asosiy komponentlar tahlili (&lt;a href=\"concepts/pca.html\"&gt;PCA&lt;/a&gt;) scater paketi (1.28.0-versiya) yordamida 50 ta komponent bo'yicha bajarildi (neyronlar uchun 40 PCA). UMAP hisoblandi (scater, n_neighbors = 20). 4. SNN graflarini qurish. SNN grafi scran paketi (1.28.2-versiya) yordamida 20 ta eng yaqin qo'shni asosida qurildi. 5. Klasterlash. SNN grafi &lt;a href=\"concepts/leiden-algorithm.html\"&gt;Leiden algoritmi&lt;/a&gt; orqali bo'lindi (igraph, 1.5.0.1-versiya; objective_function=“CPM”, n_iterations=5). Klasterlarning mustahkamligi Adjusted Rand Index yordamida baholandi. 6. Hujayra turini tayinlash. Klasterlar [30] da taklif etilgan sichqon qobig'i taksonomiyasiga muvofiq, adabiyotlardagi markerlar va Allen instituti ma'lumotlar bazasi yordamida annotatsiya qilindi. CGE (Lamp5, Sncg, Vip) va MGE (Pvalb, Sst, Sst Chodl) dan kelib chiqqan interneyronlar ajratildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;snRNA-seq ma'lumotlarini klasterlash Leiden algoritmi yordamida va asosiy neyron hamda glial populyatsiyalarni aniq ajratgan holda bajarildi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Klasterlash va subklasterlash jarayoni panneyronlar, oligodendrotsitlar, OPC, endotelial hujayralar, VSMC, astrositlar, mikrogliya, perisitlar va meningeal hujayralarni aniqlashni o'z ichiga oldi. Neyronlar glutamatergik (13 ta tip) va gamkergik (10 ta tip) subklasterlarga bo'lindi. Glutamatergik hujayralar uchun o'rtacha deScore qiymati 4.83 (min: 3.78, maks: 7.29) ni tashkil etdi, yaroqli hujayralar ulushi esa o'rtacha 98.65% (min: 90.15%, maks: 100%) bo'ldi. Noreyronal hujayralar uchun maqbul piksellar soni optimal darajada tanlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Leiden algoritmi — grafiklarni zich jamoalarga bo'lish uchun ishlatiladigan matematik usul bo'lib, hujayralarning o'zaro bog'liqligini kafolatlaydi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Genotiplar o'rtasidagi hujayra turlari tarkibini differensial ekspressiya (DE) tahlili speckle paketi (1.0.0-versiya; robust=TRUE, transform=“logit”) yordamida bajarildi. Pseudobulk DE tahlili scater::aggregateAcrossCells orqali amalga oshirildi. Past darajada ifodalangan genlar edgeR::filterByExpr yordamida filtrlandi. Normallashtirish omillari RLE usuli yordamida (edgeR::calcNormFactors) hisoblandi. Gen ekspressiyasi edgeR paketi (glmQLFit va glmQLFTest) orqali manfiy binomik modellar yordamida baholandi. Muqobil tahlillar DESeq2 (1.40.2-versiya) va limma (3.58.1-versiya) yordamida bajarildi. Alohida hujayralardagi UMI qiymatlari bo'yicha GLMM tahlili nebula paketi (1.5.5-versiya; model=“PMM”, cpc=0.005, mincp=20) yordamida amalga oshirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Barcha bioinformatik tahlil bosqichlari past sifatli yadrolarni qat'iy filtrlashni va ko'p martalik testlash (FDR) orqali soxta ijobiy natijalarni nazorat qilishni talab qiladi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Sichqoncha genlari Gene Ontology (GO) annotatsiya bazalari 2025-yil 10-sentyabr holatiga ko‘ra clusterProfiler (4.10.1-versiya) yordamida org.Mm.eg.db (3.18.0-versiya) paketidan olindi. GO sub-ontologiyalarining uchta klassi qo‘llanildi: biologik jarayon (GO:BP), hujayra komponenti (GO:CC) va molekulyar funksiya (GO:MF). Sichqoncha Reactome yo‘llari bazasi 2025-yil 10-sentyabrda ReactomePA (1.46.0-versiya) paketi orqali yuklab olindi. Ekspertlar tomonidan tuzilgan sinaptik genlar bazasi SynGO (20231201-versiya) SynGO portalidan olindi. Psixiatrik kasalliklarga bog‘liq genlar to‘plamlari chop etilgan tadqiqotlardan yig‘ildi. GWAS xavf genlari uchun genlarga asoslangan associatsiya tahlillari yordamida ustuvor qilib belgilangan genlar to‘plamlari tanlab olindi. 3G-qo‘shimcha jadvalda har bir ma’lumotlar to‘plamiga qo‘llanilgan genlar to‘plamini qayta ishlash tartib-qoidalari, jumladan ma’lumotlar manbai va P-qiymat chegaralari jamlangan. Shuningdek, biz Medical Subject Headings (MeSH) F03 «Ruhiy kasalliklar» kategoriyasi ostida DisGeNET’dan (2026-yil yangilanishi) 75 ta annotatsiya qilingan genlar to‘plamini oldik (2026-yil 6-iyulda kirilgan).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ortiqcha namoyon bo‘lish tahlili (ORA) va GSEA ma’lumotlar to‘plamida qaysi funksional gen guruhlari yoki hujayra yo‘llari statistik jihatdan sezilarli darajada o‘zgarganini aniqlashga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ortiqcha namoyon bo‘lish tahlili (ORA) fgsea paketidagi (1.26.0-versiya; minSize=5, maxSize=21955) fora yordamida bajarildi. P-qiymatlar hipergeometrik testlar orqali baholanib, FDR usuli bilan tuzatildi. snRNA-seq ma’lumotlari uchun fon genlar to‘plami bizning ma’lumotlarimizdagi minimal ekspressiya mezonlariga javob beradigan barcha genlar sifatida aniqlandi. Gen setini boyitish tahlili (GSEA) genlarni &lt;span class=\"yfm-latex\" data-content=\"-%5Clog_%7B10%7DP%20%20imes%20%20ext%7Bsign%7D(%5Clog_2%20%20ext%7B%20fold%20change%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; bo‘yicha tartiblash orqali amalga oshirildi. GSEA fgsea::fgseaMultilevel (scoreType=“std”, maxSize=500, eps=0, nPermSimple=10000) yordamida bajarildi. Genlar to‘plamining minimal hajmi snRNA-seq uchun 10 va proteomik ma’lumotlar uchun 15 qilib belgilandi. P-qiymatlar 10000 ta permutatsiya testi yordamida baholandi va FDR usuli bilan tuzatildi. Boyitishni ishonchli baholash uchun GSEA testi 20 marta takrorlandi. Yo‘llar kamida 70% hollarda ahamiyatlilikka (FDR ≤ 0.05) erishganda ishonchli boyitilgan deb hisoblandi. snRNA-seq ma’lumotlari uchun permutatsiya testlarining statistik ishonchliligini ta’minlash maqsadida GSEA differensial ekspressiya tahlili uchun minimal ekspressiya talabiga javob beradigan kamida 5000 ta gen mavjud bo‘lgan hujayra turlariga cheklandi.&lt;/p&gt;\n&lt;p&gt;Proteomik va fosfoproteomik ma’lumotlar uchun oqsillarning UniProt aksessionlari biomaRt (2.58.2-versiya) yordamida MGI gen belgilariga o‘tkazildi. Fosfosaytlar miqdori va fosforillanish tezligi ma’lumotlari uchun GSEA asosiy oqsillarga mos keladigan genlar ustida bajarildi. Muhim yo‘llarni talqin qilishni osonlashtirish uchun rrvgo paketi (1.14.2-versiya) yordamida semantik o‘xshashlik asosida klasterlarga bo‘lindi. Yo‘llar orasidagi o‘xshashlik rrvgo::calculateSimMatrix (orgdb=“org.Mm.eg.db”, method=“Lin”) yordamida hisoblandi va rrvgo::reduceSimMatrix orqali guruhlandi.&lt;/p&gt;\n&lt;p&gt;DIV6 dagi kultivatsiya qilingan neyronlar Axio Observer Z1 keng maydonli mikroskopida (Zeiss, Germaniya) Axiocam705 kamerasi va 40x/0.95 NA obyekti (Plan-Apochromat 40x/0.95 Corr M27; Zeiss) yordamida tasvirga olindi. Mozaik tasvirlar bitta chuqurlikda har bir mkm uchun 11.59 piksel aniqlikda olindi. Har bir qopqoq oynasidan bitta Tau-1 musbat neyrit va bir nechta MAP2 musbat neyritlarni ko‘rsatadigan hujayralar tasvirga olish uchun tasodifiy tanlandi. Neyronlar genotipidan bexabar tadqiqotchi tomonidan Neurolucida (2025.1.2-versiya, MBF Bioscience LLC) dasturida qo‘lda chizib chiqildi. Morfometrik o‘lchovlar Neurolucida Explorer (2024.1.1-versiya) yordamida hisoblandi va R (4.3.0-versiya) muhitida Mann-Whitney U testi yordamida tahlil qilindi.&lt;/p&gt;\n&lt;p&gt;Neyronlar LSM 800 konfokal lazer skanerlash moduli (Zeiss) bilan jihozlangan Axio Observer Z1 mikroskopida 63x/1.40 NA obyekti (Plan-Apochromat 63x/1.40 Oil DIC M27, Zeiss) yordamida tasvirga olindi. GFP-musbat neyronlarning z-stek tasvirlari har bir mkm uchun 17.45 piksel aniqlikda va 0.29 mkm z-qadam hajmida olindi. Barcha namunalarga bir xil piksel ushlab turish vaqti, lazer quvvati, pinxol o‘lchami va kuchaytirish qo‘llanildi. Somata GFP kanali orqali ImageJ (1.54p-versiya) dasturida Otsu chegaralanishi yordamida segmentatsiya qilindi va har bir neyron uchun somadagi PKA RIα ning o‘rtacha flüoresans intensivligi hisoblab chiqildi.&lt;/p&gt;\n&lt;p&gt;Vaqt bo'yicha ketma-ket olingan tasvirlar ImageJ dasturidagi SIFT xususiyatlariga asoslangan tekislash algoritmi (LinearStackAlignment bilan SIFTMultiChannel) yordamida moslashtirildi. Neyron tanasini (soma) segmentatsiya qilish uchun 488 nm signalining minimal intensivlik proyeksiya tasviri hosil qilindi, so'ngra σ=1.0 bilan Gauss filtrlash va optimal segmentatsiyaga erishish uchun «AutoLocalThreshold» yoki «AutoThreshold» yordamida chegaralash amalga oshirildi. Segmentatsiya qilingan soma ichidagi o'rtacha flüoresans intensivligi filtrlanmagan 488 nm va 405 nm signallari asosida hisoblab chiqildi. Har bir kanal uchun fon flüoresansi hujayralar bo'lmagan beshta 50 × 50 pikselli qiziqish zonalari (&lt;a href=\"concepts/roi.html\"&gt;ROI&lt;/a&gt;) yordamida baholandi. Fonning o'rtacha intensivligi tegishli soma flüoresans intensivligidan ayirilib, fondan tozalangan F₄₈₈ va F₄₀₅ signallari olindi. Har bir vaqt nuqtasida PKA faolligi qo'zg'alish nisbati sifatida R = F₄₈₈/F₄₀₅ flüoresans nisbati orqali hisoblandi. PKA faolligining o'zgarishi normallashtirilgan flüoresans nisbati o'zgarishi Δ R/R₀ = (R – R₀)/R₀ sifatida aniqlandi, bunda R — berilgan vaqt nuqtasidagi flüoresans nisbati, R₀ эsa birinchi vaqt nuqtasidagi nisbatdir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ImageJ dasturidagi SIFT algoritmi mikroskop kadrlari siljishini avtomatik to'g'rilab, neyron tanasidagi ikki to'lqinli PKA sensorining flüoresans intensivligini aniq o'lchash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun-f1.jpg\" alt=\"1-rasm. Bemorlarda aniqlangan Akap11 oqsilini qisqartiruvchi o‘ta kamyob variantini tashiydigan geterozigotali sichqonla\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. Bemorlarda aniqlangan Akap11 oqsilini qisqartiruvchi o‘ta kamyob variantini tashiydigan geterozigotali sichqonlar Akap11 mRNK va oqsilining pasayishini hamda xavotir va depressiyaga o‘xshash fenotiplar bilan bog‘liq xulq-atvor nuqsonlarini namoyon…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm. Bemorlarda aniqlangan Akap11 oqsilini qisqartiruvchi o‘ta kamyob variantini tashiydigan geterozigotali sichqonlar Akap11 mRNK va oqsilining pasayishini hamda xavotir va depressiyaga o‘xshash fenotiplar bilan bog‘liq xulq-atvor nuqsonlarini namoyon qiladi. A. AKAP11'dagi bemordan olingan oqsilni qisqartiruvchi o‘ta kamyob variantning (PTV) sxemasi va CRISPR-Cas9 genomini tahrirlash yordamida knock-in sichqon modelining yaratilishi. B. Akap11+/+ va Akap11+/S384* sichqonlarida Gapdh'ga nisbatan normallashtirilgan Akap11 mRNK darajalari. PP1, PP2 va PP3 uchtapraymer jufti tomonidan amplifikatsiya qilingan ketma-ketliklarni bildiradi. Qizil chiziq yagona nukleotidli mutatsiyaning o‘rnini ko‘rsatadi. †P = 0.057, Mann-Whitney U testi yordamida. To‘liq statistik natijalar 1A-qo‘shimcha jadvalda keltirilgan. C. Akap11 oqsili miqdorini aniqlash uchun immunoblotlash yordamida tahlil qilingan miya sohalarini ko‘rsatuvchi sxema. Tahlil qilingan sohalar ko‘k rangda belgilangan. D. To‘rtta miya sohasida Akap11 immunoblotlari (chapda) va miqdoriy tahlili (o‘ngda). Akap11 oqsili miqdori somatosensor korteksda (P = 0.015), prefrontal korteksda (P = 0.041), gipokampda (P = 0.0022) va striatumda (P = 0.0087) kamaygan. *P ≤ 0.05; **P ≤ 0.01, Mann-Whitney U testi yordamida. To‘liq statistik natijalar 1B-qo‘shimcha jadvalda keltirilgan. E. Dastlabki holatda va uch hafta davomida alohida saqlash orqali stress induktsiyasidan keyin xulq-atvorni sinovdan o‘tkazish xronologiyasi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun-f2.jpg\" alt=\"2-rasm. Yadro-yakka RNA sekvenirlashi geterozigotali mutant sichqonlar korteksida sinaptik tashkil etilish, sinaptik sig\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm. Yadro-yakka RNA sekvenirlashi geterozigotali mutant sichqonlar korteksida sinaptik tashkil etilish, sinaptik signallar va neyron o‘simtalari bilan bog‘liq transkripsion o‘zgarishlarni aniqladi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm. Yadro-yakka RNA sekvenirlashi geterozigotali mutant sichqonlar korteksida sinaptik tashkil etilish, sinaptik signallar va neyron o‘simtalari bilan bog‘liq transkripsion o‘zgarishlarni aniqladi. A. Yadro-yakka RNA sekvenirlash (snRNA-seq) ish jarayonining sxemasi. Jami 33 ta hujayra turi va 92 ta kenja turi aniqlandi. B. Glutamatergik, GABAergik va no-neyronal toifalarga guruhlangan 33 ta hujayra turiga annotatsiya qilingan hujayralarning UMAP'lari. C. 33 ta hujayra turi bo‘yicha hujayra turi markerlarining o‘rtacha normallashtirilgan, log2 ga o‘zgartirilgan ekspressiyasini ko‘rsatuvchi issiqlik xaritalari (heatmaps). D. Har bir hujayra turi bo‘yicha guruhlangan 92 ta kenja turining har birida aniqlangan yuqori darajada ishonchli differensial ekspressiyalanuvchi genlar (DEG) sonini ko‘rsatuvchi lollipopsimon diagramma (lollipop plot). Yuqori darajada ishonchli DEG'lar edgeR kvazi-ehtimollik manfiy binomial umumlashgan log-chiziqli modelidan foydalangan holda soxta-hajmli (pseudobulk) differensial ekspressiya tahlilida yolg‘on ochilish darajasi (FDR) ≤ 0.10 bo‘lgan va usullar o‘rtasida o‘zgarish yo‘nalishi mos kelgan holda yakkahujayrali Puasson-gamma aralash modelida (PMM) nominal P ≤ 0.05 bo‘lgan genlar sifatida aniqlangan. E. Yuqori darajada ifodalangan (upregulated) yuqori ishonchli DEG'lar orasida haddan tashqari namoyon bo‘lgan genlar ontologiyasi (GO) atamalari. Ahamiyatli haddan tashqari namoyon bo‘lish gipergeometrik test orqali FDR ≤ 0.05 sifatida aniqlangan. Haddan tashqari namoyon bo‘lish tahlili (ORA) ko‘rsatkichi −log10FDR ni o‘zgarish yo‘nalishiga ko‘paytirish orqali hisoblangan, bunda ijobiy qiymatlar Akap11+/S384* sichqonlarida yuqori ifodalangan genlar orasida boyishni, salbiy qiymatlar esa pastga regulyatsiya qilingan genlar orasida boyishni bildiradi. BP, biologik jarayon; CC, hujayra komponenti. F. Kengaytirilgan yuqori ishonchli DEG'lar orasida haddan tashqari namoyon bo‘lgan psixiatrik kasalliklar xavfi genlari to‘plamlari. Ahamiyatli haddan tashqari namoyon bo‘lish gipergeometrik test orqali FDR ≤ 0.05 sifatida aniqlangan. ORA ko‘rsatkichi −log10FDR ni o‘zgarish yo‘nalishiga ko‘paytirish sifatida aniqlanadi. O‘ng tarafdagi matritsa to‘rchasi har bir xavf geni to‘plami va kengaytirilgan yuqori ishonchli DEG ro‘yxati orasidagi kesishuvchi genlarni ko‘rsatadi. Faqat kamida to‘rtta haddan tashqari namoyon bo‘lgan genlar to‘plamida mavjud bo‘lgan genlar ko‘rsatilgan. Qisqartmalar: ADHD = diqqat yetishmasligi va hiperaktivlik sindromi, ANX = xavotir buzilishi, ASD = autizm spektrining buzilishi, BD = bipolyar buzilish, DD = rivojlanish buzilishi, MDD = og‘ir depressiv buzilish, PTSD = posttravmatik stress buzilishi, SA = o‘z joniga qasd qilishga urinish, SCZ = shizofreniya va SUD = psixoaktiv moddalarni iste'mol qilish buzilishlari.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun-f5.jpg\" alt=\"5-rasm. Tirik hujayralarni vizualizatsiya qilish geterozigotali mutant sichqonlarning qo‘zg‘atuvchi kortikal neyronlarid\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm. Tirik hujayralarni vizualizatsiya qilish geterozigotali mutant sichqonlarning qo‘zg‘atuvchi kortikal neyronlarida stimulusga bog‘liq PKA faolligining pasayganligini ko‘rsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-rasm. Tirik hujayralarni vizualizatsiya qilish geterozigotali mutant sichqonlarning qo‘zg‘atuvchi kortikal neyronlarida stimulusga bog‘liq PKA faolligining pasayganligini ko‘rsatadi. A. In vitro (DIV) 4–6-kunlarda pCAG-GFP bilan transfeksiya qilingan va DIV21-22 da PKA RIα uchun immunobo‘yalgan kortikal neyronlarning vakillik tasvirlari. Masshtab chiziqlari: 10 µm. B. Akap11+/S384* va Akap11+/+ neyronlarining somasida PKA RIα immunoflyuoressensiyasining miqdoriy tahlili. Akap11+/S384* neyronlari Akap11+/+ neyronlariga nisbatan PKA RIα immunoflyuoressensiyasining oshganini ko‘rsatdi (Akap11+/+: N = 5 embrion, n = 26 neyron; Akap11+/S384*: N = 6 embrion, n = neyron; P = 0.047). &lt;em&gt;P ≤ 0.05, Mann-Whitney U testi yordamida. To‘liq statistik natijalar 7A-qo‘shimcha jadvalda ko‘rsatilgan. C. Kortikal neyronlarni kultivatsiya qilish, PKA sensor bilan transfeksiya qilish va tirik hujayralarni vizualizatsiya qilish uchun eksperimental xronologiya. D. DIV22 da Akap11+/+ neyronida (yuqori panellar) va Akap11+/S384&lt;/em&gt; neyronida (pastki panellar) vakillik PKA sensor signallari. Har bir neyron uchun forskolin/rolipram bilan stimulyatsiyadan keyingi F488 signali (chapda), dastlabki holatdagi F488/F405 nisbati (-FSK/Rol; o‘rtada) va stimulyatsiyadan keyingi F488/F405 nisbati (+FSK/Roli; o‘ngda) ko‘rsatilgan. Tasvirlar har bir shartning birinchi vaqt nuqtasidan ko‘rsatilgan. Masshtab chizig‘i: 10 µm. FSK, forskolin. Roli, rolipram. E. PKA faolligining miqdoriy tahlili. Quti diagrammalari (boxplots) dastlabki holatdagi o‘rtacha F488/F405 nisbatini (chapda) va forskolin/rolipram stimulyatsiyasiga javoban F488/F405 nisbatining o‘rtacha normallashtirilgan o‘zgarishini (o‘rtacha ΔR/R0) ko‘rsatadi (o‘ngda), bu yerda R = F488/F405, R0 birinchi bazaviy vaqt nuqtasidagi nisbat, va ΔR R0 ga nisbatan R ning o‘zgarishi. Dastlabki PKA faolligi Akap11+/+ neyronlariga nisbatan Akap11+/S384* neyronlarida kamayish tendentsiyasini ko‘rsatdi (P = 0.075), holbuki stimulus evokatsiya qilgan PKA faolligi Akap11+/S384* neyronlarida sezilarli darajada pasaygan (Akap11+/+: N = 2 embrion, n = neyron; Akap11+/S384*: N = 3 embrion, n = 15 neyron; P = 0.0074). *&lt;em&gt;P ≤ 0.01, Mann-Whitney U testi yordamida. Quti diagrammalari uchun pastki qirra, o‘rta chiziq va yuqori qirra mos ravishda birinchi kvartil, mediana va uchinchi kvartilni bildiradi. Mo‘ylovlar quti qirralaridan 1.5 × interkvartil oralig‘ini bildiradi. Chiziqli diagrammalar Akap11+/+ neyronlari (chapda) va Akap11+/S384&lt;/em&gt; neyronlari (o‘ngda) uchun ΔR/R0 vaqt mobaynini ko‘rsatadi. Yuqori, o‘rta va pastki qalin tutash chiziqlar mos ravishda maksimal, o‘rtacha va minimal ΔR/R0 ni bildiradi. Yupqa tutash chiziqlar alohida neyronlarning izlarini ko‘rsatadi. Shtrixli chiziqlar preparatni qo‘llash paytida, vizualizatsiya to‘xtatib turilgan 3 daqiqalik intervalni bildiradi. Gorizontal nuqtali chiziqlar ΔR/R0 = 0 ni bildiradi. To‘liq statistik natijalar 7C-qo‘shimcha jadvalda ko‘rsatilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun-f6.jpg\" alt=\"6-rasm. Bemor tomonidan olingan Akap11 PTV mutatsiyasi yangi hosil bo'layotgan dendritlar morfogenezini buzadi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm. Bemor tomonidan olingan Akap11 PTV mutatsiyasi yangi hosil bo'layotgan dendritlar morfogenezini buzadi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;6-rasm. Bemor tomonidan olingan Akap11 PTV mutatsiyasi yangi hosil bo'layotgan dendritlar morfogenezini buzadi. A. Akap11+/+ va Akap11+/S384* kulturalaridagi vakillik DIV6 kortikal neyronlarining izlari. Shкала chizig'i, 50 µm. B. DIV6 da neyron morfologiyasining miqdoriy tahlili. Akap11+/S384* neyronlari soma maydonida (P = 0,38), dendritik daraxtlar sonida (P = 0,11) va asosiy akson uzunligida (P = 1,00) sezilarli farqlarni ko'rsatmadi, ammo o'rtacha dendritik uzunlikning sezilarli darajada kamayganini ko'rsatdi (P = 0,018). Akap11+/+: N = 2 embrion, n = 12 neyron; Akap11+/S384*: N = 2 embrion, n = 9 neyron. *P ≤ 0,05, n.s., P &amp;gt; 0,05 (Mann-Whitney U testi orqali). To'liq statistik natijalar 8A-qo'shimcha jadvalda ko'rsatilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun-fS1.jpg\" alt=\"Qo'shimcha 1-rasm. Gomozygote mutant sichqonlarda Akap11 mRNK izoformalari va heterozigote mutant sichqonlarning xulq-at\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Qo'shimcha 1-rasm. Gomozygote mutant sichqonlarda Akap11 mRNK izoformalari va heterozigote mutant sichqonlarning xulq-atvor tavsifi. 1-rasmga tegishli.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun-fS2.jpg\" alt=\"Qo'shimcha 2-rasm. Heterozigote mutant sichqonlarning neokorteksining yadroli yagona RNA sekvensiyasi profillashi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Qo'shimcha 2-rasm. Heterozigote mutant sichqonlarning neokorteksining yadroli yagona RNA sekvensiyasi profillashi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Qo'shimcha 2-rasm. Heterozigote mutant sichqonlarning neokorteksining yadroli yagona RNA sekvensiyasi profillashi. 2-rasmga tegishli. A. Genotiplar orasidagi keng hujayra turi nisbatlarining nisbati, Akap11+/S384* ning Akap11+/+ ga nisbatan hisoblangan. Kulrang nuqtalar, propeller yordamida moderatsiyalangan t-test orqali hujayra turi tarkibi testida P &amp;gt; 0,05. B. Genotiplar orasidagi hujayra turi nisbatlarining nisbati, Akap11+/S384* ning Akap11+/+ ga nisbatan hisoblangan. Kulrang nuqtalar, propeller yordamida moderatsiyalangan t-test orqali hujayra turi tarkibi testida P &amp;gt; 0,05. C. Genotiplar orasidagi kenja tur nisbatlarining nisbati, Akap11+/S384* ning Akap11+/+ ga nisbatan hisoblangan. Kulrang nuqtalar, propeller yordamida moderatsiyalangan t-test orqali hujayra turi tarkibi testida P &amp;gt; 0,05. D. Uchta psevdoobulyar differensial ekspressiya (DE) testlaridan (edgeR, DESeq2 va limma orqali) va yagona hujayrali Puasson-gamma aralash modeli (PMM) asosidagi DE testidan (nebula orqali) olingan P qiymatlari orasidagi Pearson korrelyatsiyasini ko'rsatuvchi issiqlik xaritasi. Korrelyatsiyalar 33 ta hujayra turi (chapda) va 92 ta kenja tur (o'ngda) uchun ko'rsatilgan. E. Har bir 33 ta hujayra turida aniqlangan yuqori ishonchli differensial ekspressiyalangan genlar (DEG) sonini ko'rsatuvchi lollipopsimon grafik. Yuqori ishonchli DEGlar edgeR yordamida kvazi-o'xshashlik manfiy binomial umumlashtirilgan log-chiziqli modeli orqali psevdoobulyar DE testida FDR ≤ 0,10 bo'lgan va PMM asosidagi yagona hujayrali DE testida nominal P ≤ 0,05 bo'lgan, usullar o'rtasida o'zgarish yo'nalishi mos keladigan genlar sifatida aniqlangan. F. Har bir kenja turda aniqlangan yuqori ishonchli DEGlar soni. Yashil rang ko'tarilgan genlarni, qizil rang esa Akap11+/S384* sichqonlarida pasaygan genlarni bildiradi. Kenja tur yorliqlari ular tegishli bo'lgan hujayra turiga qarab ranglangan. G. Barcha kenja turlar bo'ylab ko'tarilgan yuqori ishonchli DEGlarda haddan tashqari ko'rsatilgan sinapsga xos gen ontologiyasi (SynGO) atamalari. Ahamiyatli haddan tashqari ko'rsatilish gipergeometrik test orqali FDR ≤ 0,05 sifatida aniqlangan. Haddan tashqari ko'rsatilish tahlili (ORA) bali −log10FDR ni o'zgarish yo'nalishiga ko'paytirish yo'li bilan hisoblangan, musbat qiymatlar Akap11+/S384* sichqonlarida ko'tarilgan genlar orasida boyishni, manfiy qiymatlar esa pasaygan genlar orasida boyishni bildiradi. H. Sinaptik kompartiment bo'yicha haddan tashqari ko'rsatilgan SynGO atamalarining taqsimlanishi. I. Kengaytirilgan yuqori ishonchli DEGlarda haddan tashqari ko'rsatilgan MeSH F03 kategoriyasidagi (\"ruhiy kasalliklar\") DisGeNET gen to'plamlari. Ahamiyatli haddan tashqari ko'rsatilish gipergeometrik test orqali FDR ≤ 0,05 sifatida aniqlangan. ORA bali −log10FDR ni o'zgarish yo'nalishiga ko'paytirish yo'li bilan hisoblangan. Qisqartmalar: ASD = autizm spektrining buzilishi, BD = bipolyar buzilish, MDD = asosiy depressiv buzilish, SCZ = shizofreniya.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun-fS3.jpg\" alt=\"Qo'shimcha 3-rasm. Heterozigote mutant sichqonlarning korteksining proteomik profillashi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Qo'shimcha 3-rasm. Heterozigote mutant sichqonlarning korteksining proteomik profillashi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Qo'shimcha 3-rasm. Heterozigote mutant sichqonlarning korteksining proteomik profillashi. 4-rasmga tegishli. A. Permutatsiya testi orqali Akap11+/S384* sichqonlarida sezilarli darajada boyitilgan yoki kamaygan Reactome yo'llari. Musbat va manfiy normallashtirilgan boyitish ballari (NES) mos ravishda heterozigote sichqonlarda boyitish va kamayishni bildiradi. Gen nisbati tartiblangan oqsil ro'yxatida keltirilgan yo'l genlarining ulushi sifatida hisoblangan. Ahamiyatlilik FDR ≤ 0,05 sifatida aniqlangan. Yo'llar Reactome yo'li ierarxiyasiga muvofiq 10 ta guruhga guruhlangan (https://reactome.org/ dan olingan). Bir nechta yo'llarni o'z ichiga olgan kategoriyalar uchun semantik xulosalar ko'rsatilgan. B. 4C-rasmda ko'rsatilgan boyitilgan (yuqori) va kamaygan (pastki) Gen Ontologiyasi (GO) atamalari uchun yetakchi oqsillar (leading-edge proteins). Rang oqsil darajasini ko'rsatadi, bu differensial oqsil miqdori tahlilidan −log10P x ishora (log2 fold change) sifatida hisoblangan. Musbat va manfiy darajalar Akap11+/S384* sichqonlarida mos ravishda ko'paygan va kamaygan miqdorni bildiradi. Faqat P ≤ 0,01 bo'lgan yetakchi oqsillar va kamida bitta shunday oqsilni o'z ichiga olgan GO atamalari ko'rsatilgan. C, E. Muqobil sinov usulidan (VIPER) foydalangan holda fosfosayt miqdori (C) yoki fosforillanish tezligidan (E) kelib chiqqan holda bashorat qilingan kinaz faolligini ko'rsatuvchi vulqon grafiklari (Volcano plots). VIPER −log10P x ishora(log2 fold change) ga qo'llanilgan. Musbat va manfiy kinaz faolligi ballari Akap11+/S384* sichqonlarida mos ravishda oshgan va kamaygan kinaz faolligini bildiradi. Kinazlar kamida uchta substrat mavjud bo'lganda P ≤ 0,05 da muhim deb topildi. D, F. RoKAI testi bilan bog'liq bashorat qilingan PKACA substratlarini ta'kidlab, fosfosayt miqdori (D) va fosforillanish tezligidagi (F) genotipga bog'liq farqlarni ko'rsatuvchi vulqon grafiklari. Musbat va manfiy log2 fold change qiymatlari Akap11+/S384* sichqonlarida mos ravishda fosfosayt miqdori yoki fosforillanish tezligining oshishi va kamayishini bildiradi. Gorizontal va vertikal shtrixli chiziqlar mos ravishda 0,05 dagi P ni va 0 dagi log2 fold change ni bildiradi. G. Fosfosayt miqdori asosida −log10P x ishora(log2 fold change) bilan tartiblangan fosfosaytlardan foydalangan holda GO atamalarining gen to'plamini boyitish tahlili (GSEA). Musbat va manfiy NES qiymatlari Akap11+/S384* sichqonlarida fosfosayt miqdori oshgan yoki kamaygan oqsillar bilan bog'liq yo'llarni bildiradi. P qiymatlari permutatsiya testi yordamida baholandi va ahamiyatlilik FDR ≤ 0,05 sifatida aniqlandi. Gen nisbati fosfosayt ma'lumotlar to'plamida mavjud bo'lgan yo'l genlarining ulushi sifatida hisoblangan. H. Fosforillanish tezligiga asoslangan −log10P x ishora(log2 fold change) bo'yicha tartiblangan fosfosaytlardan foydalangan holda SynGO atamalarining GSEA. Musbat va manfiy NES qiymatlari Akap11+/S384* sichqonlarida fosforillanish tezligi oshgan yoki kamaygan oqsillar bilan bog'liq SynGO yo'llarini bildiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun-fS4.jpg\" alt=\"Qo'shimcha 4-rasm. PKA sensorini tasdiqlash.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Qo'shimcha 4-rasm. PKA sensorini tasdiqlash.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Qo'shimcha 4-rasm. PKA sensorini tasdiqlash. 5-rasmga tegishli. A. Forskolin/rolipramga (FSK/Roli) javoban va forskolin/rolipramning doimiy mavjudligida H-89 qo'shilishiga javoban (FSK/Roli+H-89), Akap11+/+ neyronlarida birinchi vaqt nuqtasiga normallashtirilgan F488/F405 nisbatining o'rtacha o'zgarishini (o'rtacha ΔR/R0) ko'rsatuvchi quti diagrammalari (boxplots). Forskolin/rolipram boshlang'ich darajaga nisbatan sensor javobini sezilarli darajada oshirdi (FDR = 7,32 x 10-4), keyingi H-89 qo'shilishi esa javobni boshlang'ich darajaga qaytardi (FSK/Roli+H-89 va FSK/Roli: FDR = 7,32 x 10-4; FSK/Roli+H-89 va boshlang'ich daraja: FDR = 0,50). N = 2 embrion, n = neyronlar. ***FDR ≤ 0,001, n.s., FDR &amp;gt; 0,05 juftlashgan Wilcoxon belgilangan rank testi orqali. Quti diagrammalari uchun pastki qirrasi, o'rta chizig'i va yuqori qirrasi mos ravishda birinchi kvartil, median va uchinchi kvartilni bildiradi. Mo'ylovlar quti qirralaridan 1,5 x interkvartil oralig'ini bildiradi. To'liq statistik natijalar 7B-qo'shimcha jadvalda ko'rsatilgan. B. A da ko'rsatilgan neyronlar uchun ΔR/R0 o'zgarishining vaqt bosqichi. Shtrixli chiziqlar tasvirga olish to'xtatib turilgan dori vositasini qo'llash vaqtidagi intervallarni ko'rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Noyob AKAP11 m&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;utatsiyalarini&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ng
