            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"259\" cy=\"102\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"521\" cy=\"201\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · PSYCHIATRY AND CLINICAL PSYCHOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;AKAP11 genidagi noyob&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;mutatsiya xavotir va&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;depressiyani qanday keltirib&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;chiqaradi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun-f1.jpg\" alt=\"1-rasm. Bemorlarda aniqlangan Akap11 oqsilini qisqartiruvchi o‘ta kamyob variantini tashiydigan geterozigotali sichqonla\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. Bemorlarda aniqlangan &lt;a href=\"concepts/akap11.html\"&gt;Akap11&lt;/a&gt; oqsilini qisqartiruvchi o‘ta kamyob variantini tashiydigan geterozigotali sichqonlar Akap11 mRNK va oqsilining pasayishini hamda xavotir va depressiyaga o‘xshash fenotiplar bilan bog‘liq xulq-atvor nuqsonlarini namoyon…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm. Bemorlarda aniqlangan Akap11 oqsilini qisqartiruvchi o‘ta kamyob variantini tashiydigan geterozigotali sichqonlar Akap11 mRNK va oqsilining pasayishini hamda xavotir va depressiyaga o‘xshash fenotiplar bilan bog‘liq xulq-atvor nuqsonlarini namoyon qiladi. A. AKAP11'dagi bemordan olingan oqsilni qisqartiruvchi o‘ta kamyob variantning (&lt;a href=\"concepts/protein-truncating-variant.html\"&gt;PTV&lt;/a&gt;) sxemasi va &lt;a href=\"concepts/crispr-cas9.html\"&gt;CRISPR-Cas9&lt;/a&gt; genomini tahrirlash yordamida &lt;a href=\"concepts/knock-in.html\"&gt;knock-in&lt;/a&gt; sichqon modelining yaratilishi. B. Akap11+/+ va Akap11+/S384* sichqonlarida Gapdh'ga nisbatan normallashtirilgan Akap11 mRNK darajalari. PP1, PP2 va PP3 uchtapraymer jufti tomonidan amplifikatsiya qilingan ketma-ketliklarni bildiradi. Qizil chiziq yagona nukleotidli mutatsiyaning o‘rnini ko‘rsatadi. †P = 0.057, Mann-Whitney U testi yordamida. To‘liq statistik natijalar 1A-qo‘shimcha jadvalda keltirilgan. C. Akap11 oqsili miqdorini aniqlash uchun immunoblotlash yordamida tahlil qilingan miya sohalarini ko‘rsatuvchi sxema. Tahlil qilingan sohalar ko‘k rangda belgilangan. D. To‘rtta miya sohasida Akap11 immunoblotlari (chapda) va miqdoriy tahlili (o‘ngda). Akap11 oqsili miqdori somatosensor korteksda (P = 0.015), prefrontal korteksda (P = 0.041), gipokampda (P = 0.0022) va striatumda (P = 0.0087) kamaygan. *P ≤ 0.05; **P ≤ 0.01, Mann-Whitney U testi yordamida. To‘liq statistik natijalar 1B-qo‘shimcha jadvalda keltirilgan. E. Dastlabki holatda va uch hafta davomida alohida saqlash orqali stress induktsiyasidan keyin xulq-atvorni sinovdan o‘tkazish xronologiyasi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Bipolyar buzilish va shizofreniya bilan og'rigan bemorlarni o'rganish AKAP11 genidagi noyob o'zgarishlarni aniqladi. Ushbu mexanizmni tushunish uchun tadqiqotchilar o'xshash nuqsonni &lt;a href=\"concepts/skrining-crispr-s-kombinatsiyami-preparatov.html\"&gt;CRISPR&lt;/a&gt;-Cas9 yordamida sichqonlar genomiga kiritishdi. Bitta shikastlangan nusxa ham oqsil tanqisligiga olib kelib, hayvonlarda xavotir va depressiya belgilarini keltirib chiqardi. Ish genetik buzilishdan sinapslardagi o'zgarishlargacha bo'lgan molekulyar zanjirni ochib beradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Akap11 genidagi mutatsiya sichqonlarda oqsil haplonetishmovchiligini keltirib chiqaradi&lt;/li&gt;\n&lt;li&gt;Geterozigot erkak sichqonlar xavotir va depressiyaga o'xshash xulq-atvorni ko'rsatadi&lt;/li&gt;\n&lt;li&gt;Neokorteksda &lt;a href=\"concepts/protein-kinase-a.html\"&gt;PKA&lt;/a&gt; signalizatsiyasi va dendritlar rivojlanishi buziladi&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Og'ir ruhiy kasalliklarning genetik arxitekturasi kichik ta'sirga ega keng tarqalgan polimorfizmlarni ham, yuqori penetrantlikka ega noyob variantlarni ham o'z ichiga oladi. Avvalgi ekzomni to'liq ketma-ketlikdan o'tkazish tahlillari bipolyar buzilish va shizofreniyaga chalingan odamlarda AKAP11 genida oqsillarni kesuvchi o'ta noyob variantlarning (PTVs) yuqori chastotasini aniqlagan edi. Bu gen oqsil kinaza A (PKA) ni o'z substratlari bilan bog'lovchi AKAP11 oqsilini kodlaydi va hujayra ichidagi signallarni muvofiqlashtiradi.&lt;/p&gt;\n&lt;p&gt;CRISPR-Cas9 yordamida tadqiqotchilar sichqonning Akap11 geni 7-ekzoniga c.1151C&amp;gt;A (p.Ser384*) nuqtali mutatsiyasini kiritishdi. Geterozigot sichqonlarda Akap11 mRNK va oqsil darajasi ikki baravar kamaydi. Bunday mutatsiyaga uchragan erkak sichqonlar ochiq maydon va xochsimon labirint testlarida xavotir va depressiyaga o'xshash xulq-atvor o'zgarishlarini namoyish etdi.&lt;/p&gt;\n&lt;p&gt;Neokorteksni transkriptomik tahlil qilish sinaptik tashkil etilish va neyritlar morfogenezi uchun mas'ul bo'lgan molekulyar o'zgarishlarni aniqladi. Mutatlantirilgan hayvonlarda PKA ning I turdagi regulyator subbirliklarining o'sishi va nishonlarning fosforillanishi pasayishi kuzatildi. Tirik neyronlarda PKA faolligining pasayishi va dendritlar rivojlanishi buzilgani qayd etildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot bitta aniq mutatsiyaga ega sichqon modelida bajarilgan bo'lib, xulq-atvor o'zgarishlari asosan erkak jinsidagi hayvonlarda o'rganilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Psixiatrik kasalliklar bilan bog'liq kam uchraydigan genetik variantlar kuchliroq yakka ta'sir hajmiga ega bo'lib, genetika va kasallik fenotiplari o'rtasidagi sabab-oqibat bog'liqligini tushunish uchun noyob imkoniyat yaratadi. Yaqinda o'tkazilgan ekzomning to'liq секвенирования (sequencing) meta-tahlili bipolar buzilish va shizofreniyaga chalingan bemorlarda AKAP11 genida oqsilni qisqartiruvchi o'ta kam uchraydigan variantlarning (PTV) ko'payganini aniqladi. AKAP11 geni proteinкиназа A (PKA) va uning substratlarini bog'lovchi A-kinaza ankor oqsilini kodlaydi. O'ta kam uchraydigan AKAP11 variantlari psixiatrik kasalliklar patogeneziga qanday ta'sir qilishi noma'lumligicha qolayotgan edi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PTV (protein-truncating variant) — oqsil sintezining muddatidan oldin to'xtashiga va qisqargan oqsil hosil bo'lishiga olib keladigan mutatsiya.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu tadqiqotda CRISPR-Cas9 genomini tahrirlash yordamida sichqoncha Akap11 lokusiga bipolar buzilishi bor bemordan topilgan o'ta kam uchraydigan PTV kiritildi. Bu mutatsiya barqaror yangi mRNK izoformalarini hosil qilmagan holda Akap11 mRNK va oqsil darajasining pasayishiga, ya'ni Akap11 haplonetishmovchiligiga olib keldi. Geterozigot erkak sichqonlarda xavotir va depressiyaga o'xshash xulq-atvor buzilishlari kuzatildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Inson AKAP11 mutatsiyasining kiritilishi sichqonlarda gen yetishmovchiligini va xavotirhamda depressiyaga o'xshash xulq-atvorni keltirib chiqardi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Neokorteksning transkriptom va proteom tahlili sinaptik tashkil etilish, sinaptik signal uzatish va neyrit morfogenezini qamrab olgan molekulyar o'zgarishlarni ko'rsatdi. Xususan, geterozigot mutantlarda neokorteksda I turdagi (II tur emas) PKA regulyator kichik birliklarining hamda PKA katalitik kichik birliklarining tanlab oshishi aniqlandi. Funksional jihatdan bu o'zgarishlar PKA substratlarining fosforillanishi kamayishi, kortikal qo'zg'atuvchi neyronlarda stimulyatsiyaga bog'liq PKA faolligining pasayishi va kortikal neyronlarda dastlabki dendrit rivojlanishining buzilishi bilan birga kechdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot natijalari sichqoncha modelida olingan bo'lib, ularni odamlardagi psixiatrik kasalliklarga to'g'ridan-to'g'ri ko'chirishda ehtiyotkorlik talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Psixiatrik kasalliklar yuqori poligenlik va pleyotropiya bilan tavsiflanadigan murakkab genetik arxitekturaga ega. Genom miqyosidagi assotsiatsiya tadqiqotlari (&lt;a href=\"concepts/gwas.html\"&gt;GWAS&lt;/a&gt;) umumiy genetik variantlarni (minor allel chastotasi [MAF] &amp;gt; 1%) aniqladi, ularning har biri kasallik rivojlanishiga kichik hissa qo'shadi. So'nggi paytlarda ekzom va genomni to'liq sekvenirlash orqali kam uchraydigan (MAF &amp;lt; 1%) va o'ta kam uchraydigan (MAF &amp;lt; 0,1%) variantlar topildi, ular shizofreniya, bipolyar buzilish (BB), autizm spektrli buzilishlari va rivojlanish nuqsonlarida muhim rol o'ynaydi. Kam uchraydigan variantlar populyatsiya darajasida merosxo'rlikning kichik qismini tushuntirsa-da, ular individual darajada kuchliroq ta'sirga ega va biologik jihatdan to'g'ridan-to'g'ri ahamiyat kasb etadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AKAP11 genidagi o'ta kam uchraydigan oqsil-trunksirlovchi variantlar (PTV) bipolyar buzilish va shizofreniya bilan bog'liq, ammo ularning molekulyar yo'llarga ta'siri aniqroq modellarni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;BB va shizofreniya dunyo bo'ylab mos ravishda 35,7 million (0,46%) va 26,9 million (0,34%) odamga ta'sir qiladi. Ekzom ma'lumotlari tahlili AKAP11 lokusida PTV variantlarining boyligini ko'rsatdi. AKAP11 oqsili PKA (protein kinaza A) va uning substratlari o'rtasidagi bog'lanishni ta'minlaydi. Ilgari o'tkazilgan &lt;a href=\"concepts/knock-out.html\"&gt;nokaut&lt;/a&gt; (KO) sichqon modellarida (6 va/yoki 7-ekzonlar o'chirilgan) striatumda PKA dinamikasi buzilishi, EEG signallarining o'zgarishi va depressiv xulq-atvor kuzatilgan. Biroq, bu modellar xromatin tuzilishiga yoki boshqa genlarning ifodalanishiga ta'sir qilishi mumkin bo'lgan katta genomik segmentlarni o'chirib tashlaydi.&lt;/p&gt;\n&lt;p&gt;Biz CRISPR-Cas9 yordamida sichqon Akap11 genining 7-ekzoniga bipolyar buzilishi bo'lgan bemorda aniqlangan o'ta kam uchraydigan PTV (c.1148C&amp;gt;A, p.Ser383*) ga gomologik bo'lgan bir nukleotidli o'zgarishni kiritdik. Tanlangan variant (chr13:42299894C&amp;gt;A, allel chastotasi 3,59 × 10⁻⁵) muddatidan oldin to'xtash kodonini hosil qiladi. Psixiatrik buzilishlar bilan bog'liq variantlar odatda geterozigotali holatda bo'lgani uchun, biz geterozigotali erkak sichqonlarni tahlil qildik.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR-Cas9 — genomni aniq tahrirlash usuli bo'lib, u DNKda maqsadli o'zgarishlarni amalga oshirishga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bizning modelimiz geterozigotali mutant sichqonlarda xavotir va depressiyaga o'xshash xulq-atvor nuqsonlarini ko'rsatdi. Neokorteksning transkriptom, proteom va fosfoproteom tahlili sinapslar tashkiloti, neyritlar morfogenezi va PKA signalizatsiyasining buzilishini aniqladi. Bu natijalar tirik hujayralarda PKA faolligini vizualizatsiya qilish va neyronlarning morfometrik tahlili bilan tasdiqlandi.&lt;/p&gt;\n&lt;p&gt;CRISPR-Cas9 genotin tahrirlash yondashuvidan foydalangan holda tadqiqotchilar sichqonning ENSMUST00000123853 raqamli Akap11 transkriptining 7-ekzoniga c.1151C&amp;gt;A (p.Ser384*) bir nukleotidli variantini kiritdilar (1A-rasm). F2 avlod erkak nasl qoldig'ida ПЦР mahsulotlarini gel-elektroforez qilish (SN 1G-rasm) orqali asosiy ehtimoliy nishondan tashqari (off-target) beshta joyda indel va nuqsonlar yo'qligi aniqlandi va Sanger sekvenirlash orqali tasdiqlandi. Heterozigot va gomozigot sichqonlar hayotga layoqatli bo'lib chiqdi. Genotip tana vazniga unchalik katta ta'sir ko'rsatmadi, eng katta farq heterozigot va gomozigot guruxlar orasida kuzatildi (SN 1H-rasm). Burun uchidan dum asosigacha o'lchangan tana uzunligiga genotip sezilarli ta'sir ko'rsatdi, ham heterozigot, ham gomozigot mutantlar nazorat guruhidagilarga qaraganda qisqaroq edi (SN 1H-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR-Cas9 texnologiyasi ma'lum bir gen ketma-ketligini aniq o'zgartirishga yordam beradi, RT-&lt;a href=\"concepts/qpcr.html\"&gt;qPCR&lt;/a&gt; esa hujayradagi RNK miqdorini aniq o'lchash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;RT-qPCR tahlili Akap11+/S384* sichqonlarning somatosensor korteksida Akap11 transkriptlari darajasi taxminan 50% ga kamayganini ko'rsatdi, bunda variant joylashgan joydan 5' va 3' yo'nalishlardagi primerlardan foydalanildi (1B-rasm). To'liq uzunlikdagi RNK sekvenirlash tahlili nazorat guruhidagi (Akap11+/+) sichqonlarga nisbatan gomozigot mutant sichqonlarning (Akap11S384*/S384*) somatosensor korteksida yangi Akap11 transkript izoformalarini aniqlamadi (SN 1A-rasm). Bundan tashqari, Akap11+/S384* sichqonlarning somatosensor korteksi, gipokampus, prefrontal korteks va striatumida Akap11 oqsilining ekspressiyasi sezilarli darajada kamaydi (1C-D-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Akap11 heterozigot sichqonlarida mRNK darajasi 50% ga kamayadi va miyaning asosiy qismlarida oqsil miqdori tushib ketadi, biroq hayotiyligi saqlanib qoladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Shundan so'ng olimlar Akap11 genidagi variantning xulq-atvorga ta'sirini baholadilar. Gen va muhit o'zaro ta'siri nevropsixiatrik buzilishlar patogenezida muhim rol o'ynagani sababli, Akap11+/S384* va Akap11+/+ erkak sichqonlarning xulq-atvor fenotiplari boshlang'ich holatda hamda kemiruvchilarda yengil surunkali stressni keltirib chiqarish usuli bo'lgan uch haftalik yakka saqlashdan keyin baholandi (1E-rasm). Ochiq maydon testida Akap11+/S384* sichqonlari boshlang'ich bosqichdagi dastlabki 30 daqiqa davomida vertikal qad ko'tarish (rearing) faolligining pasayishini ko'rsatdi, umumiy faollik yoki markaziy nisbat o'zgarmadi (SN 1B-rasm). Uch haftalik yakka saqlashdan keyin bu farq kuzatilmadi, bunga Akap11+/+ nazorat sichqonlarida qad ko'tarish faolligining pasayishi sabab bo'lgan bo'lishi mumkin (1F-rasm). Ikki soatlik ochiq maydon testida umumiy faollik, markaziy nisbat yoki qad ko'tarishlar bo'yicha genotiplar orasida farq aniqlanmadi (SN 1B-rasm).&lt;/p&gt;\n&lt;p&gt;Ko'tarilgan xochsimon labirint testida Akap11+/S384* sichqonlari boshlang'ich bosqichda ochiq armlarda o'tkazilgan vaqt nisbatining qisqarish tendentsiyasini ko'rsatdi (P = 0.052; SN 1E-rasm) va yakka saqlashdan keyin ochiq armlarda bosib o'tilgan masofa nisbati sezilarli darajada past bo'ldi (1G-rasm). Ham Akap11+/+, ham Akap11+/S384* sichqonlari ochiq armlarga nisbatan yopiq armlarni afzal ko'rdilar (SN 1C-rasm), umumiy bosib o'tilgan masofa yoki zonaga kirishlar sonida farq yo'q edi (SN 1D-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Xulq-atvorni baholash faqat erkak sichqonlarda olib borildi va ba'zi o'zgarishlar faqat statistik ahamiyatga yaqin tendentsiya darajasida bo'ldi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Uch kamerali ijtimoiy o'zaro ta'sir testida Akap11+/S384* sichqonlari boshlang'ich bosqichda kameralarga asoslangan sotsiallashuv indeksining chegaraviy pasayishini ko'rsatdi (P = 0.054; 1H-rasm). Biroq, uch haftalik yakka saqlashdan so'ng bu farq ahamiyatsiz bo'lib qoldi (1H-rasm). Shuningdek, Akap11+/S384* sichqonlari boshlang'ichda nazorat guruhiga qaraganda o'yinchoq kamerasida ko'proq vaqt o'tkazdilar, biroq yakka saqlashdan keyin bu farq yo'qoldi, boshqa sichqon kamerasidagi vaqt va o'zaro ta'sir inde эkslari genotip bo'yicha o'zgarmas qoldi (SN 1F-rasm). Xulosa qilib aytganda, Akap11 heterozigot mutantlari xavotir va depressiyaga o'xshash fenotiplar bilan bog'liq bo'lishi mumkin bo'lgan xulq-atvor nuqsonlarini namoyon qiladi, ba'zi buzilishlar boshhanoqdanoq mavjud bo'lsa, boshqalari yengil surunkali stress ta'sirida kuchayadi.&lt;/p&gt;\n&lt;p&gt;Patogen Akap11 PTV bilan bog'liq molekulyar o'zgarishlarni aniqlash uchun mualliflar sensor, medial va lateral neokortikal hududlardan olingan yadrochali RNKni sekvenirlash (&lt;a href=\"concepts/snrna-seq.html\"&gt;snRNA-seq&lt;/a&gt;) usulini qo'lladilar. Tajribada ikkita 12 haftalik Akap11+/S384* sichqon va nazorat guruhidan uchta bir uyali Akap11+/+ sichqon ishlatildi (2A-Rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Yadrochali RNKni sekvenirlash (snRNA-seq) — bu alohida hujayralar (aniqrog'i ularning yadrolari) darajasida genlar ekspresiyasini tahlil qilish usuli bo'lib, miya kabi murakkab to'qimalarni batafsil o'rganishga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;94 693 ta hujayra va 21 857 ta gendan iborat klasterizatsiya qatlamga xos glutamatergik hujayralar, asosiy GABAergik hujayralar va neyron bo'lmagan hujayralarga mos keladigan 33 ta klasterni aniqladi (2B-C-Rasm; SN-Jadval). Sichqon va inson miyasidagi hujayralar ichidagi sezilarli transkripsion, morfologik va fiziologik geterogenlikni hisobga olib, mualliflar ushbu 33 ta hujayra klasterlarini 92 ta kenja turlarga ajratdilar (SN-Jadval) va transkripsiya o'zgarishlarini bir nechta darajada baholadilar. Soxta kashfiyot darajasi (FDR) ≤ 0.05 bo'yicha genotiplar o'rtasida hujayra tarkibida sezilarli o'zgarishlar aniqlanmadi (SN-Rasm; SN-Jadval).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;94 693 ta hujayra va 92 ta kenja turni tahlil qilish mutant sichqonlar miya po'stlog'ining hujayra tarkibida o'zgarishlar yo'qligini ko'rsatdi, ammo o'ziga xos differensial ekspressiyalangan genlarni (DEGs) aniqlashga imkon berdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ishonchli differensial ekspressiyalangan genlar (DEGs) pseudobulk testida FDR ≤ 0.10 va o'zgarish yo'nalishi mos kelgan holda umumlashtirilgan chiziqli aralash model (&lt;a href=\"concepts/glmm.html\"&gt;GLMM&lt;/a&gt;) asosidagi testda nominal P ≤ 0.05 bo'yicha aniqlandi (SN-Rasm; Metodlar). Ushbu mezonlar yordamida mualliflar 33 ta hujayra turi bo'ylab 28 ta &lt;a href=\"concepts/gene-expression.html\"&gt;DEG&lt;/a&gt; ni (SN-Rasm; SN-Jadval) va 92 ta kenja tur bo'ylab 61 ta DEG ni aniqladilar (2D-Rasm; SN-Rasm; SN-Jadval).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar Akap11+/S384* geterozigot sichqonlarda olingan bo'lib, inson patologiyalarining barcha jihatlarini to'liq takrorlamasligi mumkin bo'lgan genetik modelni aks ettiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;92 ta kenja tur orasida somatostatinni (SST) ifodalovchi kenja tur eng ko'p DEG larni o'z ichiga oldi, ularning barchasi Akap11+/S384* sichqonlarida oshgan edi (2D-Rasm; SN-Rasm). Ushbu kenja tur boshqa SST klasterlariga nisbatan Hpse ning yuqori ekspresiyasini ko'rsatdi, bu esa po'stloqning 4 (L4) va L5a qatlamlaridagi Martinotti bo'lmagan SST interneyronlariga mos kelishini bildiradi.&lt;/p&gt;\n&lt;p&gt;Biologik jarayonlarni tushunish uchun mualliflar Gene Ontology (GO) atamalari va SynGO yo'llaridan foydalangan holda 92 ta kenja tur bo'yicha ishonchli DEG larni tahlil qildilar (2E-Rasm; SN-Rasm; SN-Jadval). Ekspresiyasi oshgan DEG lar sinapslarga oid GO yo'llari, jumladan, «sinaps», «postsinaptik zichlik membranasi» va «sinaptik signallar» bo'yicha sezilarli darajada boyidi (FDR ≤ 0.05; 2E-Rasm). Shuningdek, ular postsinaptik qism yoki umumiy sinaps toifalari bilan bog'liq bo'lgan SynGO yo'llarini ham boyitdi (SN-Rasm). Bundan tashqari, oshgan DEG lar neyrit morfogeneziga oid GO atamalari, jumladan, «dendritik daraxt», «neyron proyektsiyasi», «somatodendritik qism» va «dendritik tikanlar membranasi» bo'yicha boyigan (2E-Rasm). Ekspresiyasi kamaygan (downregulated) DEG lar GO yoki SynGO atamalari bo'yicha sezilarli boyishni ko'rsatmadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mutant sichqonlarda ekspresiyasi oshgan genlar sinaptik uzatish, postsinaptik zichlik va dendritlar tuzilishiga bog'liq bo'lib, ruhiy kasalliklar xavf omillari bilan kesishadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Keyinchalik mualliflar Akap11+/S384* sichqonlaridagi transkripsion o'zgarishlar genome-wide association (GWAS) yoki ekzomni ketma-ketlik qilish (WES) tadqiqotlari bo'yicha nevropsixiatrik kasalliklar xavf genlari bilan bog'liqligini baholadilar (SN-Jadval). Pseudobulk testida nominal ahamiyatga (P ≤ 5 × 10⁻⁴) va GLMM testida (P ≤ 0.05) asoslangan kengaytirilgan DEG to'plami ishlatildi. Ushbu kengaytirilgan DEG lar kayfiyat va psikotik buzilishlar, jumladan, asosiy depressiv buzilish, bipolyar buzilish va shizofreniya bilan bog'liq xavf genlarining boyishini ko'rsatdi (2F-Rasm; SN-Jadval). Bir nechta DEG lar bir nechta psixiatrik kasalliklarda ishtirok etdi, masalan, aksonlar yo'nalishini boshqaruvchi Netrin-1 retseptorini kodlovchi va bipolyar buzilish hamda shizofreniyaga ta'sir qiluvchi Dcc geni (2F-Rasm). Kengaytirilgan DEG lar shuningdek, kayfiyat, psikotik buzilishlar va rivojlanish buzilishlariga oid DisGeNET gen to'plamlari bilan ham boyitilgan (SN-Rasm; SN-Jadval).&lt;/p&gt;\n&lt;p&gt;Keyingi bosqichda umumiy hamda ma'lum hujayra turlariga xos bo'lgan transkripsiya o'zgarishlari tahlil qilindi. Xususan, parvalbumin (PV) ekspressiya qiluvchi interneyron kenja turida Spon1 geni pasaygani aniqlandi (Rasm 3A). Spon1 geni o'sish o'siqchalari va hujayra migratsiyasini boshqaruvchi hujayratashqi matritsa adheziya molekulasi F-spondinni kodlaydi. Shuningdek, turli kortikal va subkortikal nishonlarni innervatsiya qiluvchi chuqur qatlam proyeksion neyronlarining to'rtta kenja turida to'rtta hujayra adheziya molekulasi genlari (Alcam, Cdh12, Nxph1 va Cdh13) buzilganligi kuzatildi (Rasm 3A). Bu genlar neyritlar o'sishi va sinapslar shakllanishida muhim rol o'ynaydi va mutant po'stlog'ida neyron proyeksiyalari hamda bog'liqligi o'zgarganidan dalolat beradi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun-f3.jpg\" alt=\"3-rasm. snRNA-seq geterozigotali mutant sichqonlar korteksida umumiy va hujayra turiga xos transkripsion o‘zgarishlarni \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm. snRNA-seq geterozigotali mutant sichqonlar korteksida umumiy va hujayra turiga xos transkripsion o‘zgarishlarni aniqladi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-rasm. snRNA-seq geterozigotali mutant sichqonlar korteksida umumiy va hujayra turiga xos transkripsion o‘zgarishlarni aniqladi. A. Akap11+/+ va Akap11+/S384* sichqonlari orasidagi tanlangan differensial ekspressiyalanuvchi genlarning (DEG) normallashtirilgan, log2 ga o‘zgartirilgan ekspressiyasini ko‘rsatuvchi skripka diagrammalari (violin plots). +/+, Akap11+/+; +/S384*, Akap11+/S384*. B. Minimal ekspressiya mezonlariga javob beradigan kamida 5000 ta geni bo‘lgan kenja turlar bo‘ylab GO atamalari toifalari uchun o‘rtacha normallashtirilgan boyitish ballini (NES) ko‘rsatuvchi issiqlik xaritasi. Musbat va manfiy NES qiymatlari mos ravishda Akap11+/S384* sichqonlarida boyish va kamayishni bildiradi. Ahamiyatlilik permuteratsion test orqali FDR ≤ 0.05 sifatida aniqlangan. C. Tanlangan GO toifalari uchun yetakchi chekka genlarning (leading-edge genes) o‘rinlarini ko‘rsatuvchi issiqlik xaritalari. Gen o‘rinlari soxta-hajmli differensial ekspressiya testidan −log10P x sign(log2 fold change) sifatida hisoblangan. Musbat va manfiy o‘rinlar Akap11+/S384* sichqonlarida mos ravishda yuqori va pastga regulyatsiyani bildiradi. Yulduzchalar mos keladigan kenja tur va yo‘l toifasi uchun yetakchi genlarni ko‘rsatadi. Faqat kamida bitta tegishli kenja turda soxta-hajmli differensial ekspressiya testida P ≤ 0.05 bo‘lgan genlar ko‘rsatilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Bundan tashqari, yetuk oligodendrotsitlarning ikkita kenja turida (Rasm 3A; Jadval SN) va oligodendrotsitlarning umumiy hujayra turi darajasida (Jadval SN) Sgk1 darajasi ko'tarilgani qayd etildi. Sgk1 zardob va glyukokortikoid tomonidan tartibga solinadigan kinaza 1 ni kodlaydi, sichqonlarda stress ta'siri oligodendrotsitlarda Sgk1 ekspressiyasini oshiradi va ularning morfologiyasini o'zgartiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;&lt;a href=\"concepts/gsea.html\"&gt;GSEA&lt;/a&gt; — bu tadqiq etilayotgan ma'lumotlarda ma'lum biologik yo'llar yoki genlar guruhlari boyitilganligini aniqlash imkonini beruvchi statistik tahlil usuli.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Akap11 PTV ta'sir qilgan biologik yo'llarni aniqlashtirish uchun mualliflar har bir kenja tur uchun genlar to'plamini boyitish tahlilini (GSEA) amalga oshirdilar. Genlar &lt;span class=\"yfm-latex\" data-content=\"-%5Clog_%7B10%7DP%20%20imes%20%20ext%7Bsign%7D(%5Clog_2%20%20ext%7Bfold%20change%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; qiymati bo'yicha tartiblandi. Permutatsiya testining to'g'riligini ta'minlash uchun GSEA faqat daraja filtrlashdan o'tgan kamida 5000 ta geni bo'lgan klasterlar uchun bajarildi. Barcha kenja turlar bo'ylab semantik o'xshashlik asosida 40 ta kategoriyaga birlashtirilgan 124 ta GO yo'llarining umumiy va hujayra turiga xos boyitilishi yoki kamayishi kuzatildi (Rasm 3B; Jadval SN; Metodlar).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;snRNA-seq tahlili Akap11⁺/S384* sichqonlarida sinaptik tashkilot, hujayra adheziyasi va neyron proyeksiyalarining buzilishini aniqladi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Hujayra adheziyasiga oid GO terminlari Akap11⁺/S384* sichqonlarida bitta L4/5 intratelensefalik (IT), ikkita L6 kortikotalamik (CT) va bitta L6b kenja turlarida boyitilgan (Rasm 3B). Bu boyitishni keltirib chiqaruvchi omillar qatoriga klassik kaxerin Cdh12 hamda atipik kaxerinlar Cdh7, Cdh9, Cdh13 va Cdh20 kirdi (Rasm 3C). Shuningdek, L4/5 IT, L6 CT va SST neyron kenja turlarida GABAergik signal uzatishga oid GO terminlari, hamda L5 piramidal trakt (PT), Lamp5 va SST neyron kenja turlarida transmembran retseptor oqsil kinaz faolligiga aloqador yo'llarning boyitilishi qayd etildi (Rasm 3B-C).&lt;/p&gt;\n&lt;p&gt;Sinapsga xos SynGO yo'llaridan foydalangan holda o'tkazilgan GSEA shuni ko'rsatdiki, mutant asosan sinaptik genlar to'plamining faollashuvi bilan bog'liq (Rasm 3D; Jadval SN). Ayrim sinapsga oid terminlar neyron bo'lmagan kenja turlarda, jumladan oligodendrotsitlar va astrositlar turlarida ham aniqlandi (Rasm 3B, D), bu ba'zi GO terminlarining notipik annotatsiyasi bilan izohlanishi mumkin [42]. Xulosa qilib aytganda, Akap11⁺/S384* sichqonlari neokorteksining snRNA-seq profillashi gen va yo'l darajasida sinaptik tashkilot, signal uzatish, hujayra adheziyasi va neyron proyeksiyalarini qamrab oluvchi transkripsiya o'zgarishlarini ochib berdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Barcha xulosalar maxsus Akap11 mutatsiyasiga ega geterozigotali sichqon modeli asosida olingan bo'lib, ularni insonga ko'chirishda ehtiyotkorlik talab etiladi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz neokorteksning umumiy proteomi va fosfoproteomini tahlil qilish uchun TMT asosidagi &lt;a href=\"concepts/zhidkostnaya-hromatografiya-tandemnaya-mass-spektrometriya.html\"&gt;LC-MS/MS&lt;/a&gt; usulidan foydalandik. Tadqiqot 12 haftalik erkak sichqonlarda o‘tkazildi: 5 ta Akap11+/S384* va 4 ta Akap11+/+ (Rasm 4A). Jami 8742 ta oqsil izoformasi aniqlandi. Qat’iy P qiymati chegarasi (P ≤ 5 × 10⁻⁴) va effekt hajmi filtri (mutlaq &lt;span class=\"yfm-latex\" data-content=\"%5Clog_2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; o‘zgarish ≥ 0,10) yordamida 12 ta differensial ifodalangan oqsil (DAP) aniqlandi (Rasm 4B; Jadval SN 5A).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun-f4.jpg\" alt=\"4-rasm. Bemorlardan olingan Akap11 PTV geterozigotali mutant sichqonlarda kortikal proteom va fosfoproteomni o‘zgartirad\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm. Bemorlardan olingan Akap11 PTV geterozigotali mutant sichqonlarda kortikal proteom va fosfoproteomni o‘zgartiradi.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TMT-mass-spektrometriya — bu namunalarni maxsus kimyoviy belgilar bilan belgilash orqali minglab oqsillarning konsentratsiyasini aniq solishtirish imkonini beruvchi usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Akap11+/S384* sichqonlarida 9 ta oqsil, jumladan, PKA I tipidagi regulyator subbirliklari (RIα va RIβ) va katalitik subbirliklar (Cα va Cβ) miqdori oshganligi aniqlandi (Rasm 4B). Immunoblot tahlili RIα va RIβ darajalari mos ravishda 69,8% va 36,3% ga, Cα va Cβ esa 14,5% va 24,3% ga oshganini tasdiqladi (r ≥ 0,79; Rasm 4D). PKA II tipidagi regulyator subbirliklari (RIIα va RIIβ) o‘zgarmadi (Rasm 4D). Shuningdek, Ctnnd1, Sphkap, Slc24a3, Mapt va Dhx9 darajalari oshgan, Znf787, Dstyk va Lrp11 darajalari esa pasaygan (Rasm 4B).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Akap11 mutatsiyasi miya po‘stlog‘ida PKA I tipidagi subbirliklar va katalitik subbirliklarning selektiv ortishiga olib keladi, bu esa PKA signalizatsiyasining buzilishidan dalolat beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kamroq qat’iy mezon (P ≤ 0,01) bilan 117 ta DAP aniqlandi. GSEA tahlili 23 ta toifaga jamlangan 56 ta gen ontologiyasi (GO) atamasini ko‘rsatdi (Rasm 4C). «Protein kinaza A bog‘lanishi», «cAMP/PKA signal uzatilishi» va «GPCR signalizatsiyasi» bilan bog‘liq atamalarning boyishi PKA signalizatsiyasidagi disfunksiyani ko‘rsatadi (Rasm 4C; Jadval SN 5C, D). Bundan tashqari, «trans-sinaptik signalizatsiyani tartibga solish» va «sinaps tashkil etilishi» yo‘llarida o‘zgarishlar kuzatildi (Rasm 4C, E). Shu bilan birga, miyelin qobig‘i, biomolekulalar almashinuvi va mitoxondrial jarayonlar bilan bog‘liq yo‘llarning kamayishi kuzatildi (Rasm 4C; Rasm SN 3A-B).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot sichqon modelida o‘tkazilgan, shuning uchun proteomdagi o‘zgarishlar odamlardagi psixiatrik kasalliklarning patofiziologiyasini to‘liq aks ettirmasligi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bemorlardan olingan Akap11 PTV mutatsiyasi I turdagi PKA regulyator subbirliklari RIα/β va katalitik subbirliklari Cα/β oqsil darajasini tanlab oshirdi. PKA izoformalari miqdorining o‘zgarishi PKA ga bog‘liq fosforillanishga ta'sir qilishi mumkinligi sababli, mualliflar Akap11⁺/S384* sichqonlar neokorteksida umumiy fosfoproteomik manzara va PKA kinaza faolligi qanday o‘zgarishini o‘rgandilar (4F-rasm, S6A-jadval). LC-MS/MS ma'lumotlarining fosfatlar bilan boyitilgan fraksiyalaridan aniqlangan 10709 ta fosfosaytdan 9 tasi mutant sichqonlarda sezilarli darajada farq qildi (P ≤ 5 × 10⁻⁴ va mutlaq &lt;span class=\"yfm-latex\" data-content=\"%5Clog_2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; o‘zgarish karraligi ≥ 0.10; 7 tasi oshdi, 2 tasi kamaydi). Kamroq qattiq chegara bilan (P ≤ 0.01 va mutlaq &lt;span class=\"yfm-latex\" data-content=\"%5Clog_2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; o‘zgarish karraligi ≥ 0.10) 325 ta fosfosayt farqlangani aniqlandi, shundan 164 tasi oshgan va 161 tasi kamaygan (4F-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Akap11 mutatsiyasiga ega sichqonlarda oqsillarning fosforillanishi keng miqyosda o‘zgarib, PKA kinaza faolligi sezilarli darajada pasayishi hamda sinaptik va pufakchali yo‘llar buzilishi aniqlandi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Umumiy proteomdagi 12 ta oqsildan (4B-rasm) Prkar1a^S83 (P ≤ 5 × 10⁻⁴) hamda Prkar1a^S77, Prkacb^S339 va Sphkap^S1171 (P ≤ 0.01) da ortish aniqlandi, Sphkap^S50 va Ctnnd1^S346 da esa fosforillanish kamaydi (P ≤ 0.01, 4F-rasm). PKA RIα ning S83 va S77 saqlanib qolgan saytlarida fosforillanishi RIα ning Cα bilan bog‘lanishini kuchaytiradi va PKA faolligini inhibe qiladi [51]. Shundan kelib chiqib, mualliflar Akap11⁺/S384* sichqonlarda PKA faolligi kamayishini taxmin qilishdi. Bu gipotezani tekshirish uchun kinaza faolligi PhosphoSitePlus [52] va Signor [53] ma'lumotlar bazalaridagi substrat fosforillanish holatidan kelib chiqib baholandi. Z-testga asoslangan usul [54] yordamida 66 ta kesishuvchi substrat bo‘yicha Akap11⁺/S384* sichqonlarda PKA (PKACA) kinaza faolligining sezilarli darajada pasayishi aniqlandi (4H-rasm; S3D-rasm; S6B-C jadvallari). PKA faolligining pasayish tendensiyasi boshqa kinaza-substrat bazasi (PTMsigDB) [55] va tahliliy rangga asoslangan boyitish tahlili hamda permutatsiya testi yordamida ham kuzatildi (P = 0.057; S3C-rasm; S6D-jadval).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GSEA (genlar to‘plamini boyitish tahlili) — oldindan belgilangan genlar yoki oqsillar guruhlari o‘rganilayotgan ma'lumotlardagi biologik jarayonlar yoki patologiyalar bilan bog‘liqligini aniqlaydigan bioinformatik usuldir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bundan tashqari, PKA/PKG/PKC oilalari (AGC) guruhidagi uchta, kaltsiy/kalmodulinga bog‘liq oqsil kinazalari (CAMK) guruhidagi uchta, STE7/STE11/STE20 (STE) guruhidagi ikkita va tirozin kinaza (TK) guruhidagi bitta kinazaning faolligi pasaygan (4H-rasm). GSEA shuni ko‘rsatdiki, miyelin qobig‘i yo‘li fosfosaytlari miqdori kamaygan oqsillar bilan bog‘liq (S3G-rasm; S6E-jadval). Akap11⁺/S384* sichqonlarda fosforillanish tezligidagi o‘zgarishlarni aniqlash uchun fosfosayt miqdori tegishli umumiy proteom miqdoriga normallashtirildi. 9565 ta fosfosaytdan 4 tasining fosforillanish tezligi o‘zgargan (P ≤ 5 × 10⁻⁴ va mutlaq &lt;span class=\"yfm-latex\" data-content=\"%5Clog_2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; karraligi ≥ 0.10; 4G-rasm; S6F-jadval). Kamroq qattiq chegara bilan (P ≤ 0.01 va mutlaq &lt;span class=\"yfm-latex\" data-content=\"%5Clog_2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; karraligi ≥ 0.10) 263 ta fosfosaytning fosforillanish tezligi o‘zgargan (4G-rasm). AKAP Sphkap ning fosforillanish tezligi S50 da kamaygan (4G-rasm), holbuki Sphkap oqsil miqdori o‘zi oshgan edi (4B-rasm); Ctnnd1 ning beshta saytda fosforillanish tezligi kamaygan, Dstyk da esa bitta saytda oshgan (4G-rasm). Kinaza-substrat tahlili PKA (PKACA) faolligining pasayishini ko‘rsatdi (4I-rasm; S3E-F-rasmlar; S6G-I jadvallari).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Barcha asosiy xulosalar geterozigot mutant sichqon modeli asosida olingan bo‘lib, natijalarni to‘g‘ridan-to‘g‘ri inson patologiyasiga ko‘chirishda ehtiyotkorlik talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Fosforillanish tezligining o‘zgarishi bilan bog‘liq biologik yo‘llarni aniqlash uchun GSEA bajarildi. Sinaps tuzilishi va funksiyasiga oid GO atamalari, jumladan “presinaps”, “postsinaptik ixtisoslashuv”, “glutamatergik sinaps” va “postsinaptik ixtisoslashuv tashkil etilishi”, Akap11⁺/S384* sichqonlarda fosforillanish tezligi kamaygan fosfosaytli oqsillar bilan bog‘liq bo‘lgan (4J-rasm; S6J-jadval). Shunga mos ravishda, SynGO yo‘llarini tahlil qilish fosforillanish tezligi past fosfosaytlar orasida sinaptik yo‘llar boyiganini ko‘rsatdi (S3H-rasm; S6K-jadval). Ctnnd1 va Prune2 oqsillari sinaps bilan bog‘liq yo‘llarga asosiy hissa qo‘shuvchilar qatorida bo‘lgan (S6K-jadval). GO ning “dendrit daraxti” yo‘li ham fosforillanish tezligi pasaygan fosfosaytlarga ega oqsillar bilan bog‘liq edi (4J-rasm). Shunday qilib, sinapslar va neyron o‘simtalariga oid jarayonlar Akap11⁺/S384* sichqonlar neokorteksining transkriptomi, proteomi va fosfoproteomida buzilgan asosiy umumiy jihatlar sifatida namoyon bo‘ldi. Qo‘shimcha ravishda, pufakchalar bilan bog‘liq yo‘llar, jumladan “pufakcha membranasi”, “qoplangan pufakcha” va “sinapsda pufakcha vositasidagi transport”, fosforillanish tezligi kamaygan oqsillar orasida boyigan (4J-rasm).&lt;/p&gt;\n&lt;p&gt;Bizning proteomik tahlilimiz heterozigot mutant sichqonlar neokorteksida protinklase A (PKA) regulyator kichik birliklarining II turi emas, balki I turining va PKA katalitik kichik birliklarining tanlab oshirilgan ekspressiyasini ko'rsatdi (4-rasm). Bu o'zgarishlar bashorat qilingan PKA substratlarining fosforillanishining pasayishi bilan birga kechdi (4-rasm), bu PKA signalizatsiyasidagi potensial buzilishlardan dalolat beradi. Akap11+/S384* embrionlaridan (E16.5) olingan kortikal neyronlar in vitro (DIV) 21-22-kunlarida Akap11+/+ neyronlariga nisbatan kuchaytirilgan PKA RIα immunoreaktivligini ko'rsatdi (5A-B-rasm). PKA kinaz faolligini bevosita baholash uchun biz E16.5 Akap11+/S384* va Akap11+/+ embrionlarining kultivatsiya qilingan kortikal neyronlarida Camk2a promoteri ostida qo'zg'alish-ratiometrik PKA sensorini ExRai-AKAR2 ifodaladik (5C-D-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ratiometrik ExRai-AKAR2 sensori ikki to'lqin uzunligidagi flüoresans nisbatining o'zgarishi orqali PKA fermentining faolligini real vaqtda o'lchash imkonini beruvchi genetik vositadir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz Akap11+/+ neyronlarida adenilatatsiklaza stimulyatori forskolin va fosfodiesteraza-4 inhibitori rolipram hamda kuchli PKA inhibitori H-89 ni qo'shish orqali PKA sensorining o'ziga xosligi va ikki tomonlama sezgirligini tasdiqladik (4A-B-sonli rasm). DIV22 kortikal qo'zg'atuvchi neyronlarida, F₄₈₈/F₄₀₅ qo'zg'alish nisbati bilan ko'rsatilgandek, boshlang'ich darajada Akap11+/S384* neyronlarida Akap11+/+ neyronlariga nisbatan PKA faolligining ozgina pasayishi kuzatildi (P = 0.075; 5E-rasm). Stimul tomonidan qo'zg'atilgan PKA faolligi Δ R / R₀ sifatida baholandi, bu yerda R = F₄₈₈/F₄₀₅, R₀ birinchi boshlang'ich vaqt nuqtasidagi nisbat, Δ R esa R₀ ga nisbatan R ning o'zgarishi. Forskolin (25 µM) va rolipram (2 µM) bilan 3 daqiqa davomida stimulyatsiya qilish Akap11+/+ neyronlarida PKA faolligini oshirdi, holbuki Akap11+/S384* neyronlarida bu javob susaygan edi.&lt;/p&gt;\n&lt;p&gt;Xususan, forskolin/rolipram o'rtacha Δ R / R₀ ni Akap11+/+ neyronlarida taxminan 2.30 barobarga, lekin Akap11+/S384* neyronlarida atigi 0.80 barobarga oshirdi (5E-rasm). Shunday qilib, fosfoproteomik tahlildagi PKA-ga bog'liq fosforillanishning kamayishiga mos ravishda, Akap11+/S384* sichqonlarining kortikal qo'zg'atuvchi neyronlarida stimulusga bog'liq PKA faolligi funksional ravishda buzilgan edi.&lt;/p&gt;\n&lt;p&gt;Akap11+/S384* sichqonlarining kortikal transkriptomi, proteomi va fosfoproteomida neyron o'simtasi va neyrit morfogenezi bilan bog'liq molekulalar va biologik yo'llarning disregulyatsiyasi takrorlanuvchi mavzu sifatida yuzaga chiqdi va biz mutantda faollikka bog'liq PKA signalizatsiyasining susayganini kuzatdik (2-5-rasmlar). PKA o'sish konusi yo'nalishi va dendritlarning o'sishida muhim rol o'ynaydi [58, 59]. Shuning uchun biz bemordan olingan Akap11 dagi PTV (oqsilni to'xtatuvchi mutatsiya) kortikal neyronlarda neyrit rivojlanishini buzadi degan farazni ilgari surdik. Ushbu farazni sinab ko'rish uchun biz E16.5 Akap11+/+ va Akap11+/S384* embrionlaridan olingan kortikal neyronlarni kam zichlikda yetishtirdik va DIV6 da neyrit morfologiyasini tahlil qildik. Boshlang'ich aksonlar Tau-1-musbat/MAP2-musbat jarayonlar sifatida, dendritlar esa Tau-1-manfiy/MAP2-musbat jarayonlar sifatida aniqlandi.&lt;/p&gt;\n&lt;p&gt;Soma maydoni, dendritik daraxtlar soni va birlamchi akson uzunligi genotiplar orasida farq qilmadi (6A-B-rasm). Aksincha, Akap11+/S384* neyronlari o'rtacha dendrit uzunligining sezilarli darajada kamayganini ko'rsatdi (Akap11+/+ neyronlari: 55.68 µm, Akap11+/S384* neyronlari: 40.05 µm; 6A-B-rasm), bu Akap11 PTV rivojlanayotgan kortikal neyronlarda erta dendrit o'sishini buzishidan dalolat beradi.&lt;/p&gt;\n&lt;p&gt;Yaqinda o'tkazilgan butun ekzomni ketma-ketlikda o'qish tadqiqotlari bipolyar buzilish yoki shizofreniya bilan bog'liq o'ta kam uchraydigan proteinni kesuvchi variantlarni (PTV) aniqladi [10, 11], ammo bu variantlarning kasallik patogeneziga qanday hissa qo'shishi hali ham noma'lum bo'lib qolmoqda. Ushbu ishda mualliflar bipolyar buzilishi bo'lgan patsiyentda aniqlangan AKAP11 genidagi o'ta kam uchraydigan PTVga e'tibor qaratdilar va gologologik variantli sichqon modelini yaratdilar. Geterozigota mutant sichqonlarda bu variant Akap11 mRNK darajasini taxminan 50% ga kamaytirdi va Akap11 oqsilining miqdorini pasaytirdi. Gomozigota mutant sichqonlarda esa bu variant aniqlanadigan barqaror yangi Akap11 mRNK izoformalarini hosil qilmadi. Hozirgi tadqiqot avvalgi Akap11 KO modellarining natijalarini bir nechta muhim jihatlar bo'yicha kengaytiradi. Birinchidan, klinik jihatdan kuzatilgan bir nukleotidli PTVni modellashtirish орqali mualliflar variantning bitta nusxasi avvalgi ekzonlar yo'q qilingan Akap11 funksiyasini yo'qotish modellari bilan mos keladigan xulq-atvor buzilishlari va PKA disregulyatsiyasini keltirib chiqarish uchun yetarli ekanligini ko'rsatdilar. Ikkinchidan, proteomik va transkriptomik tahlillar sinapslar va neyron o'simtalari bilan bog'liq yo'llardagi o'xshash o'zgarishlarni aniqladi. Uchinchidan, funksional tahlillar kortikal neyronlarda ogohlantirishga bog'liq PKA signallarining susayganini va morfogenezning buzilganini namoyish etib, terapevtik jihatdan muhim bo'lishi mumkin bo'lgan potentsial mexanik yo'llarni ta'kidladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Geterozigota mutant sichqonlarda tashvish va depressiyaga o'xshash xulq-atvor belgilarining paydo bo'lishi kuzatildi, biroq bu model bipolyar buzilishning butun xulq-atvor spektrini to'liq qamrab olish uchun yetarli emas, chunki qo'shimcha genetik va muhit omillari talab qilinishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Geterozigota mutant sichqonlar ochiq maydon testida vertikal faollikning (reyring) pasayishini va boshlang'ich darajada ijtimoiy faollikning buzilishini ko'rsatdi. Uch hafta davomida yakka holda saqlash ko'tarilgan xochsimon labirintda ochiq yo'laklardagi faollikning yanada pasayishini keltirib chiqardi (1-rasm). Ushbu ko'rsatkichlardagi anomaliyalar kemiruvchilarda tashvish va depressiyaga o'xshash fenotiplar bilan bog'liq [60–63]. Bizning natijalarimiz ekzon deletsiyasiga ega bo'lgan avvalgi geterozigota Akap11 KO modellari bilan mos keldi, ular ochiq maydonda vertikal faollikning kamayishi, saxarozani afzal ko'rishning pasayishi, dumdan osish testida harakatsizlikning ortishi, ko'tarilgan xochsimon labirintning ochiq yo'laklarida faollikning kamayishi va yorug' qutiga kirishlar sonining kamayishini ko'rsatgan edi [20, 21]. Biroq, na bizning modelimiz, na oldingi KO modellari (gomozigota yoki geterozigota) giperaktivlik va tashvishning kamayishi kabi aniq maniyaga o'xshash xulq-atvorni ko'rsatmadi [64, 65]. Shunday qilib, Akap11 funksiyasining yo'qolishi tashvish va depressiya bilan bog'liq xulq-atvor anomaliyalarini keltirib chiqarish uchun yetarli bo'lishi mumkin, ammo ehtimol qo'shimcha poligen va muhit omillarini talab qiladigan bipolyar buzilishning to'liq xulq-atvor spektrini qamrab olish uchun yetarli emas [66, 67].&lt;/p&gt;\n&lt;p&gt;Akap11 va PKA subbirliklarining oqsil ekspresiyotidagi o'zgarishlar bo'yicha bizning natijalarimiz va geterozigota KO modellaridan foydalangan avvalgi tadqiqot o'rtasida tafovutlar mavjud. Biz 12 haftalik yoshda to'rtta kortikal va subkortikal hududlarda Akap11 oqsili ekspresiyasining pasayishini aniqladik (1D-rasm). Aksincha, Song va boshqalar [20] Akap11 6-7 ekzon deletsiyali sichqonlardan foydalanib, gomozigota KO da korya lizatlarida Akap11 ning kamayishini, ammo geterozigota KO da immunoblotlar bo'ylab kamroq izchil o'zgarishlarni ko'rsatdilar. Xuddi shunday, biz I turdagi PKA regulyator subbirliklari RIα va RIβ hamda katalitik subbirliklar Cα va Cβ ning tanlab oshishini kuzatdik. Bu topilmalar Song va boshqalardagi [20] gomozigota KO dagi PKA subbirliklarining o'zgarishlariga mos keladi, ammo ularning geterozigota KO natijalaridan farq qiladi, bunda RIα va Cα ning oshishi ishonchli tarzda aniqlanmagan edi. Mumkin bo'lgan texnik tushuntirishlar sifatida boshqa statistik testlardan foydalanish va Song va boshqalar [20] ishida β-aktinni yuklash nazorati sifatida ishlatilishi kiradi. AKAP11 va PKA aktin tudoskeleti bilan o'zaro ta'sir qilishi va uni tartibga solishi ko'rsatilganligi sababli [68], β-aktin bo'yicha normallashtirish Akap11 va PKA subbirliklari miqdoridagi o'zgarishlarni niqoblashi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Inson genidan kelib chiqqan Akap11 PTV mutatsiyasi oqsil miqdorini ikki barobar kamaytiradi, xulq-atvorning buzilishiga olib keladi va PKA signallarining uzatilishini izdan chiqaradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Boshqa tomondan, geterozigota KO da I turdagi PKA regulyator subbirliklari va katalitik subbirliklarining ko'payishini ko'rsatgan Song va boshqalarning [20] sinaptik fraksiyalardagi proteomik topilmalarini kengaytirgan holda, bizning ma'lumotlarimiz inson kelib chiqishiga ega Akap11 PTV ni tashiydigan geterozigota mutant sichqonlarning kortikal umumiy lizatlarida ushbu subbirliklar darajasining oshishini yanada ko'rsatdi. Shunday qilib, biz inson tomonidan kelib chiqqan Akap11 dagi PTV geterozigota holatda Akap11 oqsili miqdorini kamaytirish va maxsus PKA subbirliklarining ekspresiyasini o'zgartirish uchun yetarli ekanligini isbotladik.&lt;/p&gt;\n&lt;p&gt;In vitro PKA substratini fosforillash tahlillaridan foydalangan holda, Akap11 KO modellarining oldingi tadqiqotlari gomozigota KO da sinaptik fraksiyada bazal PKA faolligining oshishini izchil xabar qilgan, holbuki sitozol fraksiyasidagi yoki umumiy lizatdagi o'zgarishlar, ayniqsa geterozigota KO da, kamroq izchil bo'lib qolgan [19, 20]. Boz ustiga, bu tahlillar asosan konstitutiv PKA faolligini o'lchab, hujayra kontekstida ogohlantirishga bog'liq PKA dinamikasini asosan noma'lum qoldirdi. Bu yerda madalangan kortikal qo'zg'atuvchi neyronlarning somasidagi PKA sensorining vaqt bo'yicha flyuoressent tasvirlash usulidan foydalanib, mualliflar geterozigota mutant neyronlarda bazal PKA faolligining pasayish tendensiyasini va forskolin/rolipram bilan ogohlantirilganda PKA faollashuvining susayganini ko'rsatdilar.&lt;/p&gt;\n&lt;p&gt;Ogohlantirishga bog'liq PKA signallari sinaptik oqsillarni, jumladan glutamat retseptorlarini fosforillash, tashish va faollashtirishni, shuningdek neyromediatorlarning chiqarilishini va cAMPga sezgir elementni bog'lovchi oqsilga (CREB) bog'liq genlar ekspresiyasini modulyatsiya qilish orqali neyronal plastisiyani tartibga soladi [69, 70]. Shunday qilib, ogohlantirishga bog'liq PKA signallarining buzilishi sinaptik plastisiyani zaiflashtirib, uzoq muddatli potensiallanishga (LTP), o'rganish va xotiraga ta'sir qilishi mumkin. Ushbu gipotezaga mos ravishda, buzilgan LTPga o'xshash kortikal plastisiya shizofreniya va kayfiyat buzilishlari bilan bog'langan [71, 72]. Shuningdek, mualliflar Song va boshqalarning [20] ishida gomozigota KO ning striatumida in vivo FLIM asosidagi PKA sensor yozuvlari bazal PKA faolligining oshishini va D1 yoki D2 retseptorlari antagonistlariga javob kattaligining kuchayganini ko'rsatganini ta'kidlaydilar. Geterozigota KO da bazal yoki qo'zg'atilgan PKA faolligida hech qanday o'zgarish kuzatilmadi [20]. Bizning topilmalarimiz orasidagi tafovut striatum va koradagi hujayra turiga xos PKA dinamikasi bilan bog'liq bo'lishi mumkin [73, 74]. Boz ustiga, D1/D2 retseptorlari antagonistining tizimli ravishda yuborilishi miya hududlari bo'ylab D1/D2 retseptorlarining keng tarqalganligi sababli turli xil hujayra turlari va zanjirlarini qamrab olishi mumkin [75].&lt;/p&gt;\n&lt;p&gt;Aksincha, madalangan kortikal qo'zg'atuvchi neyronlarda PKA sensorini ifodalash va forskolin/rolipramni qo'llash orqali bizning natijalarimiz PKA dinamikasidagi o'zgarishlarning hujayra turiga xos, to'g'ridan-to'g'ri o'qilishini ta'minlaydi. Tadqiqotimizning cheklovi shundan iboratki, somaga qaratilgan PKA sensorini tasvirlash sinapslardagi yoki neyron o'simtidagi PKA dinamikasi haqida ma'lumot bermadi. Hozirgi vaqtda mavjud bo'lgan PKA sensorlari [57, 76] shuningdek, kelajakdagi tadqiqotlarda PKA RIα-Cα dissotsiatsiya dinamikasining to'g'ridan-to'g'ri tahlillarini talab qilishi mumkin bo'lgan izoformaga xos PKA signallarini farqlamaydi.&lt;/p&gt;\n&lt;p&gt;Xulosa qilib aytganda, bizning topilmalarimiz shuni ko'rsatadiki, inson kelib chiqishiga ega bo'lgan geterozigota o'ta kam uchraydigan PTV Akap11 da psixiatrik buzilishlarning asosiy jihatlarini eslatuvchi xulq-atvor fenotiplariga olib keladi va kortikal neyronlarda ogohlantirishga bog'liq PKA signallarining buzilishi va morfogenezning buzilishining qo'shimcha dalillari bilan birga, oldin funksiyani yo'qotish modellarida kuzatilgan molekulyar o'zgarishlarni takrorlaydi. Bu ma'lumotlar Akap11 gaplonetishmovchiligini potentsial patogen mexanizm sifatida qo'llab-quvvatlaydi. Psixiatrik buzilishlari bo'lgan patsiyentlardagi de novo va o'ta kam uchraydigan kodlovchi variantlar geterozigota holatda harakat qilishi taxmin qilinishini hisobga olsak [23, 24], bu genetik jihatdan aniq model kam uchraydigan kodlovchi variantlarning psixiatrik buzilishlarga qanday sabab bo'lishini o'rganish uchun klinik jihatdan muhim tizimni taqdim etadi.&lt;/p&gt;\n&lt;p&gt;Genning rolini o'rganish uchun tadqiqotchilar CRISPR/Cas9 texnologiyasi va гомологичная рекомбинация yordamida C57BL/6J genetik fonida geterozigotali Akap11⁺/S384* nokaut sichqonlar liniyasini yaratdilar. O'zgartirish dizayni mualliflar tomonidan ishlab chiqilgan bo'lib, Shanghai Model Organisms kompaniyasi tomonidan zigotalarga Cas9 oqsili, yo'naltiruvchi sgRNA va bir zanjirli mutant oligoDNKni birgalikda kiritish orqali bajarildi. DNK matritsasi Akap11 (ENSMUST00000123853) genida c.1151C&amp;gt;A (p.Ser384*) mutatsiyasini o'z ichiga olgan bo'lib, u BipEx ma'lumotlar bazasidagi AKAP11 PTV (chr13-42299894C&amp;gt;A) inson variantiga gomologikdir va ENST00000025301 izoformasida c.1148C&amp;gt;A (p.Ser383*) almashtirilishini kodlaydi. F0 asoschilar liniyasi maqsadli lokusni ПЦР (PCR) yordamida amplifikatsiya qilish va Seнгер ketma-ketligini aniqlash orqali tanlab olindi. To'g'ri o'zgartirilgan asoschi sichqon C57BL/6J yovvoyi turdagi sichqonlar bilan chatishtirildi. Eksperimental hayvonlarning genotipi ПЦР va Seнгер sekvenirashi yoki real vaqt rejimidagi ПЦР yordamida aniqlandi. Ishlatilgan barcha hayvonlar F2 avlodidagi bitta geterozigotali erkak sichqondan olingan bo'lib, tajribalar F4 va undan keyingi avlod vakillarida o'tkazildi (primerlar SN-jadvalda keltirilgan). CRISPR/Cas9 ning noaniq ta'sirlarini istisno qilish uchun &lt;a href=\"concepts/grnk.html\"&gt;gRNA&lt;/a&gt; ketma-ketligi Synthego CRISPR design tool yordamida tahlil qilindi va skrining uchun eng yaxshi beshta sayt tanlandi. OT-F/OT-R primerlari va Vazyme master-mixt yordamida har bir potentsial saytni qamrab oluvchi 400–600 bp uzunlikdagi hududlar amplifikatsiya qilindi, so'ngra Seнгер sekvenirashi orqali taxmin qilingan noaniq saytlarda indel (qo'shilish yoki yo'qolish) yo'qligi tasdiqlandi. Hayvonlarni parvarish qilish Jons Hopkins universiteti Hayvonlarni parvarish qilish va ulardan foydalanish qo'mitasi bayonnomalari va NIH ko'rsatmalariga muvofiq amalga oshirildi. Xulq-atvor testlari va neyron kulturalaridan tashqari barcha tajribalar uchun erkak sichqonlar 12 soat yorug'lik va 12 soat qorong'ulik siklida kataklarda 3-5 tadan saqlandi, suv va ozuqa cheklanmagan. To'qimalar 12 haftalik sichqonlardan qorong'ulik fazasida olindi. Birlamchi neyron kulturalari har ikki jinsdagi E16.5 embrionlaridan tayyorlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;CRISPR/Cas9 — bu maxsus oqsil va RNK yordamida DNKni aniq tahrirlash usuli, Seнгер sekvenirashi esa nukleotidlar ketma-ketligini aniq o'qishning klassik usulidir.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Hayvonlarning xulq-atvorini baholash uchun erkak sichqonlar muvozanatlashgan genotiplar bo'yicha har bir katakka to'rtdan taqsimlandi va xulq-atvor testlaridan kamida ikki hafta oldin teskari kun/tun sikliga o'tkazildi. Birlamchi testlar 12 haftaligida bajarildi, shundan so'ng sichqonlar uch hafta davomida ekologik boyitishsiz alohida saqlandi (ijtimoiy izolyatsiya stressi), so'ngra testlar takrorlandi. Barcha sinovlar qorong'u fazada, qizil rangli LED yoritgichi ostida o'tkazildi, sinovdan oldin hayvonlar xonaga 30 daqiqadan 1 soatgacha moslashtirildi. «Ochiq maydon» testida har bir sichqon infraqizil datchiklar bilan jihozlangan kamera markaziga qo'yildi (San Diego Instruments), gorizontal va vertikal harakatlar qorong'uda 2 soat davomida 5 daqiqalik oraliqlarda qayd etildi. «Ko'tarilgan xochsimon labirint» testida sichqon labirintni 5 daqiqa davomida o'rgandi, ochiq, yopishqoq va markaziy zonalardagi harakatlar ANY-maze dasturi (7.65-versiya) yordamida kuzatildi. Uch kamerali ijtimoiy o'zaro ta'sir testida ([78] ga o'zgartirishlar kiritilib) odat qilish fazasida sichqon bo'sh idishlarni 6 daqiqa davomida o'rgandi. Sinov fazasida bitta idish ostiga notanish Akap11⁺/+ erkak sichqon, ikkinchisiga o'yinchoq sichqon qo'yildi. Sinovdagi sichqon 10 daqiqa davomida erkin harakat qildi, jarayon videoqaydga olindi. Genotipni bilmaydigan tadqiqotchi quyidagilarni qo'lda baholadi: kameralarda o'tkazilgan vaqt (T\textmouse chamber, T\texttoy chamber — tanasining kamida 50% qismi kamerada bo'lishi) va faol muloqot vaqti (T\textmouse, T\texttoy). Kameralar bo'yicha sotsiallik indeksi \textSI\textchamber = T\textmouse chamber / T\texttoy chamber va muloqot indeksi \textSI\textinteraction = T\textmouse / T\texttoy formulalari bo'yicha hisoblandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Barcha xulq-atvor testlari va to'qimalarni yig'ish izolyatsiya stressidan keyin faqat erkak sichqonlarda o'tkazilganligini natijalarni urg'ochilarga va boshqa sharoitlarga tatbiq etishda e'tiborga olish lozim.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;To'qimalarni yig'ish jarayonida tajriba hayvonlari izofluran yordamida narkoz qilindi va 10 ml sovuq, nukleazalardan xoli 1X PBS eritmasi yordamida yurak orqali perfuziya qilindi. Teskari transkripsiya bilan miqdoriy PZR va uzun o'qishli RNK sekvenirlash uchun miyaning ko'rish krestidan oldingi qismi oldindan sovutilgan matritsa yordamida 1.5 mm qalinlikdagi koronal kesmalarga bo'lindi. Somatosensor qobiq tezkorlik bilan ajratib olinib, quruq muzda darhol muzlatildi. Yadro sekvenirlash ishlari uchun neokorteks ostki tuzilmalardan ajratilib, sensor sohalar (somatosensor, ko'rish va eshitish po'stloqlari), medial soha (retrosplenial soha) hamda lateral sohalar (chakka assotsiativ, ektorinal va peririnal sohalar) yig'ildi va quruq muzda muzlatildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Perfuziya — to'qimalardan qonni tozalash va ularni keyingi tahlilga tayyorlash maqsadida qon tomir sistemasini maxsus bufer bilan yuvish jarayoni.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;RT-qPCR tahlili uchun uchta Akap11+/S384* va to'rtta Akap11+/+ genotipli erkak sichqonlarning (12 haftalik) po'stloq to'qimalaridan foydalanildi. To'qimalar BeadBug gomogenizatori yordamida TRIzol reaktivida gomogenizatsiya qilindi va ishlab chiqaruvchi ko'rsatmalariga asosan Direct-zol RNA Miniprep to'plami yordamida RNK tozalandi. Umumiy RNKning teskari transkripsiyasi HiScript IV RT SuperMix for qPCR (+gDNA wiper) to'plami yordamida bajarildi. PZR jarayoni Taq Pro Universal SYBR qPCR Master Mix vositasida QuantStudio 12K Flex tizimida amalga oshirildi. Akap11 va nazorat genlari uchun praymerlar ro'yxati Supplementary Table 1C da keltirilgan.&lt;/p&gt;\n&lt;p&gt;To'liq uzunlikdagi RNK sekvenirlash ishlari uchta gomozigotli mutant (Akap11S384*/S384*) va uchta nazorat (Akap11+/+) sichqonlarining (erkak, 12 haftalik) po'stloq to'qimalaridan foydalangan holda Admera Health kompaniyasi tomonidan bajarildi. Total RNK RNeasy to'plamlari yordamida ajratildi, uning sifati Tapestation tizimidagi High Sensitivity RNA ScreenTape Assay testi orqali baholandi va AccuBlue Broad Range RNK miqdorini aniqlash tahlili bilan o'lchandi. To'liq uzunlikdagi kDНК kutubxonalari Kinnex full-length RNA to'plami yordamida 450 ng RNK asosida tayyorlandi. Har bir genotip uchun 18.3 ng barkodlangan kDНК sakkizta parallel Kinnex PZR uchun aralashtirildi, so'ngra massiv hosil qilish, nukleaza bilan ishlov berish va SMRTbell kutubxonasini tayyorlash bajarildi. Kutubxona sifati Genomic DNA ScreenTape yordamida baholandi, miqdori esa Qubit 2.0 orqali o'lchandi. Sekvenirlash Revio tizimidagi bitta SMRTCell da bajarildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot faqat muayyan yoshdagi erkak sichqonlarning cheklangan tanlanmasida o'tkazilganini hisobga olish lozim.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bitta yadro RNK sekvenirlash tahlili uchun ikkita Akap11+/S384* sichqon va uchta nazorat (Akap11+/+) tug'ishdoshlari (erkak, 12 haftalik) ishlatildi. To'qimalarni parchalash va yadrolarni ajratish jarayonlari Admera Health tomonidan yadrolarni ajratish buferi va gentleMACS dissizatori yordamida amalga oshirildi. Yadrolar yuvilib, 0.04% BSA qo'shilgan PBS ga qayta suspenziya qilindi. Yadro konsentratsiyasi va sifati Cellometer Auto 2000 da akridin to'q sariq va propidiy yodid bo'yash usuli bilan baholandi. Yadro bo'yicha 3’ gen ekspressiyasi kutubxonalari Chromium GEM-X Single Cell 3’ Kit v4 to'plami yordamida tayyorlandi. Har bir namuna uchun 30000 ta yadro Chromium X qurilmasiga yuklandi. Teskari transkripsiya bajarilib, kDНК to'plandi, tozalandi va amplifikatsiya qilindi. Kutubxona sifati High Sensitivity D5000 ScreenTape yordamida baholandi va Qubit 2.0 orqali miqdori aniqlandi. Kutubxonalar NovaSeq X Plus tizimida sekvenirlandi.&lt;/p&gt;\n&lt;p&gt;Vestern-blotting tahlilini amalga oshirish uchun mualliflar jami 12 ta erkak sichqonlardan foydalanishdi: ulardan oltitasi Akap11⁺/S384* genotipiga ega, qolgan oltitasi esa 12 haftalik Akap11⁺/+ yovvoyi turdagi nazorat sichqonlari edi. Hayvonlar 300–500 mkl izofluran yordamida chuqur narkoz qilindi va bosh miya suyakdan ajratib olindi. Oldindan sovitilgan kemiruvchilar miya matritsasidan foydalangan holda miyaning optik xazindan oldingi qismi 1.5 mm qalinlikdagi koronar kesmalarga bo'lindi. Stereomikroskop ostida ushbu kesmalardan somatosensor qobiq, prefrontal qobiq va striatum tezda ajratib olindi, gippokamp esa qolgan kaudal to'qimalardan ajratib olindi. To'qima namunalari quruq muzda darhol muzlatildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Vestern-blotting — bu oqsillarni elektr maydoni yordamida o'lchamiga qarab ajratish hamda maxsus antikorlar yordamida to'qimedagi aniq oqsil miqdorini aniq o'lchash imkonini beruvchi laboratorya tahlil usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;To'qimalarni gomogenizatsiya qilish jarayoni proteaza ingibitorlari va spesifik fosfataza ingibitorlari aralashmasi qo'shilgan RIPA buferida plastik pestik yordamida amalga oshirildi. Oqsil konsentratsiyasi Pierce BCA Protein Assay Kit to'plami yordamida o'lchandi. Har bir naychaga 30 mkg umumiy oqsil solinib, 4–20% li Bis-Tris gellarida Tris-MOPS-SDS yugurish buferi yordamida elektroforez qilindi. Oqsillar 0.45 mkm past lyuminestsentli PVDF membranaga o'tkazildi. Membralarni blokirovka qilish va antikorlar bilan inkubatsiya qilish uchun maxsus bufer eritmalaridan foydalanildi.&lt;/p&gt;\n&lt;p&gt;Birlamchi antikorlar bilan kechasi davomida 4 °C haroratda ehtiyotkorlik bilan silkitiб inkubatsiya qilindi, ikkilamchi antikorlar esa xona haroratida 1–2 soat davomida ushlab turildi. Natijalarni vizualizatsiya qilish va miqdorini baholash uchun LI-COR Odyssey Fc Imager tizimi va Image Studio dasturidan (5.2.5-versiya) foydalanildi. Tadqiqotda quyidagi birlamchi antikorlar ishlatildi: quyon antikorlari anti-AKAP11, anti-PKA RIα, anti-PKA Cα, anti-PKA Cβ, qo'y antikorlari anti-PKA RIβ, sichqon antikorlari anti-PKA RIIα, anti-PKA RIIβ hamda nazorat uchun GAPDH antikorlari. Ikkilamchi antikor sifatida xren peroksidazasi (HRP) va IR700 hamda IR800 fluoroforlari bilan bog'langan konjugatlar ishlatildi.&lt;/p&gt;\n&lt;p&gt;DIV4 va DIV6 kunlari oralig'ida pCAG-GFP plazmidasi bilan transfeksiya qilingan o'stirilgan neyronlar immunositokimyo tahlili uchun DIV21 va DIV22 kunlari orasida fiksatsiya qilindi. Hujayralar xona haroratida 20 daqiqa davomida PBS dagi 4% paraformaldegid yordamida fiksatsiya qilindi va 0.1% Triton X-100 yordamida 15 daqiqa davomida permeabilizatsiya qilindi. Hujayralar xona haroratida 1 soat davomida 5% qoramol zardobi albuminida (BSA) bloklandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Neyronlar madaniyatida (DIV21–DIV22) spesifik antikorlar panelidan foydalangan holda o'tkazilgan immunositokimyo PKA oqsillari va sitoskeletning hujayra ichidagi taqsimotini batafsil ko'rsatish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;5% BSA da suyultirilgan birlamchi antikorlar bilan inkubatsiya 4 °C haroratda kechasi amalga oshirildi, ikkilamchi antikorlar esa xona haroratida 1 soat davomida inkubatsiya qilindi. Namunalarni predmet oynachalariga o'rnatishdan oldin yadro qismlari &lt;a href=\"concepts/dapi.html\"&gt;DAPI&lt;/a&gt; bo'yoig'i (0.5 mkg/ml) bilan 10 daqiqa davomida bo'yaldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DAPI — bu hujayra yadrosiga kirib, DNK bilan mustahkam bog'lanadigan lyuminestsent bo'yoq bo'lib, mikroskop ostida hujayra yadrolarini osongina aniqlash va sanash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tadqiqotda PKA RIα, dendritik marker MAP2 va aksonal marker Tau-1 ga qarshi birlamchi antikorlar ishlatildi. Alexa Fluor 488 va Alexa Fluor 555 fluoroforlari bilan bog'langan ikkilamchi antikorlar neyronlar madaniyatidagi oqsil tuzilmalarini aniq farqlash imkonini berdi.&lt;/p&gt;\n&lt;p&gt;Miqdoriy umumiy proteom va fosfoproteom tahlillari uchun beshta Akap11+/S384* va to‘rtta Akap11+/+ sichqonlaridan foydalanildi. Hayvonlar bachadon bo‘yni dislokatsiyasi yo‘li bilan evtanaziya qilindi, shundan so‘ng hidoyat piyozchasi olib tashlandi va ustara yordamida neokorteks subkortikal tuzilmalardan tezda ajratib olindi. Fermentlarni faolsizlantirish maqsadida to‘qimalar Denator AB kompaniyasining Stabilizor T1 moslamasida issiqlik yordamida barqarorlashtirildi va quruq muzda darhol muzlatildi. Namunalarni tayyorlash, shu jumladan izobarik etiketkalash va fraksiyalash ishlari Jons Hopkins proteomik kashfiyotlar markazida ilgari tavsiflangan va kichik o‘zgartirishlar kiritilgan protokollar asosida bajarildi. To‘qimalar 8 M mochevina va 50 mM trietillammoniy bikarbonatni o‘z ichiga olgan, proteaza hamda fosfataza ingibitorlari qo‘shilgan eritmada lizis qilindi va muz ustida ultratovush yordamida ishlov berildi. Har bir namuna uchun 100 mkg oqsil 10 mM tris(2-karboksietil)fosfin bilan qaytarildi, 40 mM 2-xloretamid bilan alkillandi va Lys-C endoproteazasi yordamida 1:50 nisbatda parchalandi. Keyin eritma taxminan 2 M mochevina konsentratsiyasigacha suyultirildi va tripsin bilan 37 °C haroratda 1:50 nisbatda bir kecha davomida hazm qilindi. Olingan peptidlar kislotalashtirildi, C18 ustunlarida tuzsizlantirildi va xona haroratida bir soat davomida Thermo Fisher Scientific kompaniyasining TMTpro 18-plex reagentlari bilan nishonlandi. Reaksiya tris yordamida to‘xtatilib, namunalar birlashtirildi. Fraksiyalash Agilent 1260 HPLC/Extend-C18 ustunida yuqori pH qiymatiga ega teskari fazali suyuqlik xromatografiyasi usuli yordamida 0.3 ml/min tezlikda 90 daqiqali梯度 orqali amalga oshirildi. Olingan fraksiyalarning o‘n foizi umumiy proteomik tahlil uchun, qolgan to‘qson foizi esa Fe(III)-IMAC yordamida fosfopeptidlarni boyitish uchun ishlatildi.&lt;/p&gt;\n&lt;p&gt;Peptidlarni tahlil qilish uchun Vanquish NEO UHPLC tizimi va 120 daqiqali gradientda 300 nl/min tezlikda ishlaydigan Orbitrap Exploris 480 mass-spektrometridan foydalanildi. MS1 spektrlari m/z 375–1500 oralig‘ida 120 000 aniqlikda qayd etildi; bunda 3 soniyali sikl, 0.7 Da izolyatsiya va bitta zaryadli ionlarni istisno qilish shartlari qo‘llanildi. Parchalanish 36 normallashtirilgan to‘qnashuv energiyasida yuqori energiyali to‘qnashuv dissotsiatsiyasi orqali bajarildi, MS2 spektrlari esa TurboTMTPro rejimidan foydalangan holda 30 000 aniqlikda olindi. Spektrlar bo‘yicha qidiruv Thermo Fisher Scientific kompaniyasining Proteome Discoverer dasturining 3.2.0.450 versiyasidagi SEQUEST HT yordamida UniProt Mus musculus ma’lumotlar bazasiga qarshi amalga oshirildi. Qidiruvda tripsin bilan ikkita o‘tkazib yuborilgan kesishga, uzunligi kamida 6 aminokislota bo‘lgan peptidlarga hamda 10 ppm yoki 0.02 Da massali bardoshlik chegaralariga ruxsat berildi. Sisteinlarning karbamidometillanishi va TMTpro nishonlanishi o‘zgarmas deb belgilandi; oksidlanish, dezamidlanish va serin/treonin/tirozin fosforillanishi o‘zgaruvchan modifikatsiyalar sifatida kiritildi. Soxta topilmalar chastotasini nazorat qilish darajasi Proteome Discoverer dasturining Percolator moduli yordamida ham peptid-spektr moslashuvi, ham oqsillar darajasida 1% da ta’minlandi. Fosfosaytlar lokalizatsiyasining ishonchliligi ptmRS moduli orqali baholandi. Reporter ionlarini miqdoriy aniqlash MS2 asosidagi TMT kvantifikatsiyasi yordamida 20 ppm integratsiya bardoshligi bilan bajarildi, oqsillarni guruhlash esa qat'iy parsimoniya prinsipiga amal qilgan holda amalga oshirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;To‘qqizta sichqon to‘qimalarining proteom va fosfoproteom tahlillari yuqori aniqlikdagi zamonaviy mass-spektrometriya platformalari yordamida muvaffaqiyatli bajarildi.&lt;br /&gt;\n[!tip] Izobarik TMT nishonlash usuli va tandem mass-spektrometriya bir vaqtning o‘zida minglab oqsillar va ularning fosforillangan shakllari miqdorini aniq o‘lchash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Protein kinaza A sensorining pcDNA3.1(+)-ExRai-AKAR2 nomli namunasi Jin Chjan tomonidan taqdim etilgan bo‘lib, Addgene genlar omborida 161753-raqami ostida ro‘yxatdan o‘tkazilgan. pAAV-Camk2a-ExRai-AKAR2-mScarlet plazmidasini yaratish uchun PKA sensorini o‘z ichiga olgan kerakli ketma-ketlik Genscript kompaniyasi tomonidan sintez qilindi va Xba1/EcoR1 saytlari bo‘yicha kesib chiziqlashtirilgan pAAV-hSyn-EGFP vektori ichiga klonlandi. Boshlang‘ich pAAV-hSyn-EGFP plazmidasi Brayan Rot tomonidan taqdim etilgan (Addgene plazmid raqami #50465). Neyron kulturalarida siyrak nishonlash uchun Konni Sepko tomonidan taqdim etilgan pCAG-GFP plazmidasidan foydalanildi (Addgene plazmid raqami #11150).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Neyronlarda PKA kinazasi faolligini vizualizatsiya qilish uchun &lt;a href=\"concepts/aav.html\"&gt;AAV&lt;/a&gt; vektorlari asosida maxsus genetik konstruksiyalar muvaffaqiyatli yaratildi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Birlamchi ajratilgan hujayra kulturalari E16.5 bosqichidagi embrionlar bosh miya po‘stlog‘idan tayyorlandi. Korteksni ajratish ishlari Corning kompaniyasining DMEM muhitida, unga 1X GlutaMAX, 0.5% penicillin/streptomycin va 10% homilador buzoq zardobi qo‘shilgan holda bajarildi. Fosfat-tuzli bufer bilan yuvilgandan so‘ng, har bir embrion to‘qimalari mayda bo‘laklarga bo‘lindi va 37 °C haroratda DNase I qo‘shilgan TrypLE fermenti yordamida dissotsiatsiya qilindi. Keyin to‘qimalar Neurobasal kultura muhiti (B-27, GlutaMAX va 0.5% penicillin/streptomycin qo‘shilgan) bilan yuvildi va ehtiyotkorlik bilan pipetka yordamida bir hil hujayra suspenziyasiga keltirildi. Ajratilgan hujayralar poly-L-ornithin bilan ishlov berilgan qopqoq oynalariga yoki vizualizatsiya idishlariga ekildi. Ekish zichligi 12 mm li har bir qopqoq oynasiga 1.5 × 10⁵ ta hujayrani yoki 35 mm li idishga 4.5 × 10⁵ ta hujayrani tashkil etdi. Endigina o‘sayotgan neyritlarni morfologik tahlil qilish uchun hujayralar 12 mm li oynaga 1.0 × 10³ zichlikda ekildi. Kulturalar 5% karbonat angidrid saqlaydigan namlangan inkubatorda 37 °C haroratda saqlandi.&lt;/p&gt;\n&lt;p&gt;Har bir embrion dumidan olingan DNK yordamida Akap11 mutatsiyasi va jinsini aniqlash uchun post-faktum genotiperlangan; primerlar ketma-ketligi Supplementary Table 1C jadvalida keltirilgan. PKA sensorining vaqtincha transfeksiyasi in vitro sharoitidagi 5–6-kunlar oralig‘ida (DIV5–DIV6) Lipofectamine 2000 reagentidan foydalangan holda amalga oshirildi. Har bir vizualizatsiya idishidagi hujayralarga 2 mkl lipofektamin bilan aralashtirilgan 1 mkg plazmida DNK qo‘shildi, Neurobasal muhitida 4 soat davomida inkubatsiya qilindi, shundan so‘ng ular konditsionerlangan kultura muhitiga qaytarildi. pCAG-GFP bilan vaqtincha transfeksiya DIV4–DIV6 muddatlarida 1:1 DNK va lipofektamin nisbatida, 12 mm li har bir qopqoq oynasiga 200 ng DNK hisobidan bajarildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;E16.5 embrionlarining kortikal to‘qimalaridan olingan birlamchi neyron kulturalari muvaffaqiyatli o‘stirildi, genotiperlandi va in vitro sharoitida maqsadli genlar bilan transfeksiya qilindi.&lt;br /&gt;\n[!tip] Embrionlar miyasidan olingan birlamchi hujayra kulturalari neyritlarning o‘sishi va signal uzatish jarayonlarini laboratoriya sharoitida yaqindan o‘rganish imkonini beradi.&lt;br /&gt;\n[!warning] Birlamchi hujayra kulturalaridagi tajribalar neyronlar rivojlanishining faqat ayrim jihatlarini aks ettiradi va ularni tirik organizm ma'lumotlari bilan solqishtirish zarur.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Maxsus PKA sensorini ekspressiya qiluvchi kultivatsiya qilingan kortikal neyronlarda PKA fermenti faolligi dinamikasini kuzatish uchun Nikon Ti2 keng maydonli mikroskopidan foydalanildi. Mikroskop CFI Apochromat TIRF 60X/1.49 NA obyektivi, ORCA-Fusion Digital CMOS C14440-20UP kamerasi va NIS-Elements AR 6.10.02 dasturiy ta'minoti bilan jihozlangan edi. Tasvirga olish jarayoni in vitro sharoitidagi 21 va 22-kunlar (DIV21–DIV22) oralig'ida amalga oshirildi. Ikki karrali GFP qo'zg'alishi 405 nm to'lqin uzunligida (10% lazer quvvati, 500 ms ekspozitsiya) va 488 nm to'lqin uzunligida (2.5% lazer quvvati, 500 ms ekspozitsiya) 525/50 nm emissiya filtri orqali bajarildi. mScarlet qizil flüoresansiyasi 561 nm qo'zg'atish (5% quvvat, 50 ms ekspozitsiya) va 595/44 nm filtri yordamida qayd etildi. Tirik hujayralarni tasvirga olishda dastlabki asosiy kadrlar har 1 daqiqada 5 daqiqa davomida olindi. Shundan so'ng, kuzatuv idishiga 25 µM konsentratsiyadagi forskolin va 2 µM rolipram yoki 25 µM H-89 ingibitori qo'shildi. Hujayralar preparatlar bilan 3 daqiqa davomida inkubatsiya qilindi, so'ngra 1 daqiqa interval bilan 15 daqiqa davomida tasvirga olish qayta tiklandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Time-lapse imaging metodi tirik hujayralardagi jarayonlarni real vaqt rejimida kuzatish imkonini beradi, PKA sensorlari esa ferment faollashganda yorug'lik signalini o'zgartiradi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Barcha asosiy ma'lumotlar, jumladan xulq-atvor testlari, fizik o'lchovlar, immunoblotlash, RT-qPCR, immunotsitokimiya va tirik hujayralardagi PKA faolligi tahlili Debian GNU/Linux 11.7 konteyneridagi R muhitining 4.3.0 versiyasi yordamida bajarildi. Xulq-atvor tahlillarida har bir genotip uchun kvartillararo masofa (IQR) hisoblandi; birinchi kvartildan (Q1) 1.5 × IQR past yoki uchinchi kvartildan (Q3) yuqori bo'lgan nuqtalar chiqarib tashlandi. Fizik o'lchovlar uchun hech qanday ma'lumot olib tashlanmadi. Genotip va nasl ta'sirini hisobga oluvchi chiziqli regressiya qo'llanildi, o'zaro taqqoslashlar uchun Tyuki testi ishlatildi. Immunoblotlash, RT-qPCR, immunotsitokimiya va tirik hujayralarni tasvirlash ma'lumotlari bo'yicha hech qanday nuqtalar chetlashtirilmadi. Ikki genotip orasidagi farqni aniqlash uchun Mann-Uitni U-testidan foydalanildi.&lt;/p&gt;\n&lt;p&gt;To'liq uzunlikdagi RNK sekvenirlash ma'lumotlarini qayta ishlash va tahlil qilish Python 2.7.15 bilan birga IsoSeq 4.3.0 ish jarayoni asosida bajarildi. HiFi o'qishlari Skera 1.4.0 va MAS-Seq Adapter v3 yordamida segmentlarga bo'lindi. Demultipleksatsiya va shtrix-kodlarni aniqlash lima 2.13.0 dasturi orqali Iso-Seq rejimi va Iso-Seq v2 12-pleks primerlari yordamida amalga oshirildi. Poly(A) dumlar qisqartirilib, konkatemerlar isoseq refine orqali olib tashlandi. To'liq uzunlikdagi nokonkatemer (FLNC) o'qishlar isoseq cluster2 yordamida klasterlandi va kamida ikkita FLNC o'qishiga ega izoformalar saqlab qolindi. Klasterlangan izoformalar GRCm39/mm39 sichqon referens genomiga minimap2 asosidagi pbmm2 (1.17.0 versiya) yordamida tekislandi. Ortiqcha izoformalar isoseq collapse yordamida birlashtirildi. Noortiqcha izoformalar pbpigeon 1.4.0 (pigeon classify) yordamida tasniflandi. Natijalar past sifatli izoformlarni olib tashlash uchun pigeon filter orqali saralandi. Sifatni nazorat qilish bosqichida a) сплайсинг artefaktlari («RTS_stage»=TRUE), b) transkript tugash joyidan keyingi 20 bp oynada 80% dan ortiq adenin nukleotidlari («perc_A_downstream_TTS» &amp;gt; 80), yoki c) umumiy soni 3 tadan kam bo'lgan izoformalar qo'shimcha ravishda olib tashlandi. Qolgan izoformalar million boshiga transkriptlarga (TPM) normallashtirildi. Akap11 geniga tegishli izoformalar UCSC Genome Browser yordamida vizualizatsiya qilindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;RNK sekvenirlash ma'lumotlari sifat nazorati va qat'iy filtrlashdan o'tkazilib, TPM qiymatlari asosida Akap11 izoformalari aniq aniqlandi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Proteomik ma'lumotlar Ubuntu 20.04.6 LTS konteynerida R (4.5.3 versiyasi) muhitida tahlil qilindi. Ma'lumotlar Msnbase (2.34.1 versiyasi) ob'ektlari sifatida qayta ishlandi va ifloslantiruvchi moddalar (contaminants) chiqarib tashlandi. Har bir namuna uchun oqsil miqdori &lt;span class=\"yfm-latex\" data-content=\"%5Clog_2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; transformatsiya qilindi va limma (3.64.3 versiyasi) paketidagi normalizeBetweenArrays funksiyasi (cyclicloess usuli) yordamida &lt;a href=\"concepts/cyclic-loess.html\"&gt;sikli
