        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"273\" cy=\"121\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"667\" cy=\"296\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · MICROBIOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Plscr1 oqsili sichqon&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;norovirusining kirishini&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;to'xtatadi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-f1.jpg\" alt=\"1-rasm: Plscr1 MNV infeksiyasini optimal nazorat qilish uchun talab qilinadi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Plscr1 &lt;a href=\"concepts/murine-norovirus.html\"&gt;MNV&lt;/a&gt; infeksiyasini optimal nazorat qilish uchun talab qilinadi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: Plscr1 MNV infeksiyasini optimal nazorat qilish uchun talab qilinadi. (A) Uch xil skrining boʻyicha saqlanib qolgan «hit»larni (ijobiy natijalarni) koʻrsatuvchi Venn diagrammasi. (B) Boʻsh vektor yoki Plscr1 ifodalovchi HeLa-CD300lf hujayralari 0,05 infeksiya koʻpligi (MOI) bilan MNVCW3 (chapda) yoki MNVCR6 (oʻngda) bilan infeksiyalangan. Virus mahsuldorligi blyashka tahlili (PFU; blyashka hosil qiluvchi birliklar) yordamida hisoblangan. (C) Sichqon yoki inson Plscr1 ifodalovchi HeLa-CD300lf hujayralari 48 soat davomida 0,5 MOI bilan MNVCW3-HiBiT bilan zararlangan. Infeksiya Nano-Glo HiBiT Lytic Detection System (RLU; nisbiy lyuminessensiya birliklari) yordamida miqdoriy aniqlangan. (D) Koʻrsatilgan antitanachalar bilan boʻyalgan, FLAG-yorliqli sichqon (ms) yoki inson (hu) Plscr1 ifodalovchi HeLa-CD300lf hujayralarining vakillik vestern-bloti. (E) Vektor nazorati yoki Plscr1 ifodalovchi, 5,0 MOI MNVCW3 bilan infeksiyalangan va infeksiyadan keyingi koʻrsatilgan soatlarda (hpi) lizis qilingan HeLa-CD300lf hujayralarining vakillik vestern-bloti. (F) Interferon bilan ishlov berilmagan, 1000 birlik/ml interferon α yoki 0,1 mkg/ml interferon γ bilan ishlov berilgan va koʻrsatilgan antitanachalar bilan boʻyalgan HeLa-CD300lf yoki HeLaΔPlscr1-CD300lf hujayralarining vakillik vestern-bloti. (G) HeLa-CD300lf yoki HeLaΔPlscr1-CD300lf hujayralari 0,5 MOI MNVCW3-HiBiT bilan zararlangan. 48 soatdan keyin infeksiya Nano-Glo HiBiT Lytic Detection System yordamida miqdoriy aniqlangan. (H) HeLa-CD300lf yoki HeLaΔPlscr1-CD300lf hujayralari interferon α ning koʻrsatilgan dozalari (birlik/ml) bilan ishlov berilgan, soʻngra 48 soat davomida 0,5 MOI MNVCW3-HiBiT bilan zararlangan. Infeksiya Nano-Glo HiBiT Lytic Detection System yordamida miqdoriy aniqlangan. Koʻrsatilgan hujayra turlari uchun interferon α ning 50% samarali konsentratsiyasi (EC50) hisoblangan. (I) Plscr1+/+ (WT) yoki Plscr1-/- (KO) bir tugʻilgan hayvonlarda koʻrsatilgan toʻqimalardagi Plscr1 ifodasi. Uzlukli chiziq aniqlash chegarasini koʻrsatadi. (J) Plscr1+/+ (WT) yoki Plscr1-/- (KO) bir tugʻilgan hayvonlar 1 x 10^6 PFU MNVCW3 bilan infeksiyalangan va infeksiyadan 3 kun oʻtgach evtanaziya qilingan. Yoʻgʻon ichak, yonbosh ichak, tutqich limfa tugunlari (MLN), taloq va jigar MNV genom nusxalari uchun &lt;a href=\"concepts/qpcr.html\"&gt;qPCR&lt;/a&gt; orqali tahlil qilingan va aktin boʻyicha normallashtirilgan. Har bir toʻqima uchun skripka diagrammasi (violin plot) bilan birga alohida maʼlumot nuqtalari koʻrsatilgan. Mann-Uitni testining P-qiymatlari keltirilgan. Uzlukli chiziq aniqlash chegarasini koʻrsatadi. Barcha maʼlumotlar uchta mustaqil tajribaning oʻrtacha qiymati ± standart ogʻish sifatida taqdim etilgan va Tukeyning koʻp qirrali taqqoslash testi bilan bir tomonlama dispersiya tahlili (ANOVA) (B va C), T-test (G) yoki Mann-Uitni testi (J) yordamida tahlil qilingan. *P &amp;lt; 0,05, **P &amp;lt; 0,01, ***P &amp;lt; 0,001, ****P &amp;lt; 0,0001.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Noroviruslar ichak infeksiyalarini keltirib chiqaradi va hujayralarga murakkab molekulyar mexanizmlar orqali kiradi. Tadqiqotchilar Plscr1 oqsili virusni kirish bosqichida to‘sib qo‘yuvchi «qo‘riqchi» vazifasini bajarishini aniqlashdi. Bu kashfiyot immunitet tizimi virus tarqalishini qanday cheklashini tushunishga yordam beradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Plscr1 sichqon norovirusining hujayraga kirishini cheklaydi&lt;/li&gt;\n&lt;li&gt;Plscr1 yetishmovchiligi virus replikatsiyasini oshiradi&lt;/li&gt;\n&lt;li&gt;Oqsil virusning endosoma bilan qo‘shilishiga to‘sqinlik qiladi&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Noroviruslar (Caliciviridae oilasi) infeksiyani boshlash uchun hujayra yuzasidagi o‘ziga xos retseptorlardan foydalanadi. Ushbu tadqiqotda membranadagi lipidlar taqsimotida ishtirok etuvchi Plscr1 (fosfolipid-skramblaza 1) oqsilining roli o‘rganildi. Mualliflar virus zarralarining hujayra tuzilmalari bilan o‘zaro ta’sirini tahlil qilish uchun sichqon norovirusi (MNV) modelidan foydalanishdi.&lt;/p&gt;\n&lt;p&gt;Eksperimentlar shuni ko‘rsatdiki, Plscr1 virusning sitozolga kirish qobiliyatini cheklaydi. Hujayralarda Plscr1 geni o‘chirilganda (&lt;a href=\"concepts/knock-out.html\"&gt;nokaut&lt;/a&gt;), virus yuklamasining sezilarli darajada oshishi kuzatildi, bu esa oqsilning himoya funksiyasini tasdiqlaydi. Ta’sir mexanizmi membrana xossalarining o‘zgarishi bilan bog‘liq bo‘lib, bu virus qobig‘ining endosoma bilan qo‘shilishiga to‘sqinlik qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot sichqon modelida o‘tkazilgan, shuning uchun inson noroviruslari bilan o‘zaro ta’sir mexanizmlari farq qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Noroviruslar butun dunyo boʻylab gastroenteritning asosiy sababchilaridan biri boʻlib qolmoqda, ammo ularning koʻpayishini cheklovchi uy egasi omillari hali toʻliq oʻrganilmagan. &lt;a href=\"concepts/skrining-crispr-s-kombinatsiyami-preparatov.html\"&gt;CRISPR&lt;/a&gt;-aktivatsiya va CRISPR-nokaut yordamida oʻtkazilgan genom miqyosidagi skrininglar orqali tadqiqotchilar interferon tomonidan stimullangan Plscr1 genini sichqon norovirusi (MNV) replikatsiyasini cheklovchi omil sifatida aniqlashdi. Ilgari Plscr1 qobiqli viruslarning endotsitar membranalar bilan qoʻshilishiga toʻsqinlik qilishi maʼlum edi, shu sababli uning qobiqsiz MNVga qarshi antiviral faolligi kutilmagan natija boʻldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR-skrining — bu hujayralardagi minglab genlarni oʻchirish (nokaut) yoki faollashtirish (aktivatsiya) orqali ularning virusga chidamliligiga taʼsirini kuzatish imkonini beruvchi genetik usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Eksperimentlar shuni koʻrsatdiki, Plscr1 in vitro sharoitida MNV infeksiyasini cheklash uchun zarur va yetarli boʻlib, u sichqonlarning yoʻgʻon ichagidagi virus yuklamasini nazorat qilishda ham ishtirok etadi. Mexanistik tahlil shuni koʻrsatdiki, Plscr1 MNVning hujayraga kirishini virus yuzaga birikkanidan keyingi bosqichda toʻxtatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Plscr1 virusning birikishidan keyingi bosqichda hujayraga kirishini bloklash orqali MNV infeksiyasini bostiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot hujayra kulturalari va sichqon modellari asosida oʻtkazilgan; natijalarni odamlar uchun qoʻllash imkoniyatini aniqlash qoʻshimcha tekshiruvlarni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Aniqlanishicha, kichik kapsid oqsili &lt;a href=\"concepts/vp2-capsid-protein.html\"&gt;VP2&lt;/a&gt; tarkibidagi yagona aminokislota almashinuvi virusni Plscr1 taʼsiriga chidamli qiladi. VP2 oqsili kalitsiviruslarning hujayraga kirish jarayonida endotsitar membranalarini teshib, virusli RNKni yetkazib berish vazifasini bajargani uchun, bu topilmalar Plscr1 virus kirish jarayonining kechki bosqichlariga taʼsir qilishini koʻrsatadi. Olingan natijalar PLSCR1ning antiviral faollik spektrini qobiqsiz viruslargacha kengaytiradi va qobiqli hamda qobiqsiz viruslarning hujayraga kirish yoʻllari oʻrtasidagi kutilmagan bogʻliqlik nuqtasini aniqlaydi.&lt;/p&gt;\n&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Noroviruslar — bu virusli gastroenteritning asosiy sababchisi boʻlgan, qobiqsiz, musbat zanjirli RNK viruslaridir. Ular global sogʻliqni saqlash va iqtisodiyotga katta yuk boʻlib, faqat AQSHning oʻzida yillik iqtisodiy zarar 10,6 milliard dollarni tashkil etadi. Inson norovirusini (HNoV) oʻrganish tarixan qiyin boʻlgan, chunki uni in vitro sharoitda yetishtirish va kichik hayvon modelini yaratish murakkab edi. Inson ichak enteroidlari (HIE) kashf etilishi bilan bu toʻsiq yengib oʻtildi, ammo HNoV biologiyasini chuqur oʻrganish uchun barqaror tizimlarni yaratish hali ham qiyinchilik tugʻdirmoqda.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Noroviruslar katta iqtisodiy zarar keltirib chiqaradi; ularni oʻrganish HIE tizimlari va sichqon modellari yordamida rivojlanmoqda.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Sichqon norovirusi (MNV) laboratoriya sharoitida hujayra liniyalarida yaxshi koʻpayishi tufayli qulay model hisoblanadi. Garchi sichqonlarda qusish kuzatilmasa va diareya kamdan-kam uchrasa-da, MNV va HNoV genom tuzilishi, RNK replikatsiyasi va yuqish mexanizmlari boʻyicha oʻxshashliklarga ega. MNV shtammlari interferon (IFN) taʼsiriga turlicha sezgirlik koʻrsatadi. Masalan, MNVCW3 shtammi IFN-α/βR−/− yetishmovchiligi boʻlgan sichqonlar uchun oʻlimga olib keladi, IFN I va III tip signallari esa ichakdagi tuft hujayralarida infeksiyani cheklaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Enteroidlar (HIE) — bu ichak oʻzak hujayralaridan olingan uch oʻlchamli tuzilmalar boʻlib, ular ichak funksiyalarini takrorlaydi va viruslarni yetishtirish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;IFN norovirus tropizmi va patogenezida muhim rol oʻynasa-da, virusni cheklovchi aniq interferon-stimullangan genlar (ISG) nomaʼlumligicha qolmoqda. CRISPR/Cas9 skrining maʼlumotlarini tahlil qilish orqali mualliflar fosfolipid-skramblaza 1 (PLSCR1) ni MNV cheklovchi omil sifatida aniqladilar. PLSCR1 barcha uch turdagi interferonlar tomonidan induksiya qilinadi va qobiqli viruslarning (masalan, OIV va SARS-CoV-2) membranalar bilan qoʻshilishini bloklashi maʼlum. Ushbu ishda PLSCR1 qobiqsiz viruslar, xususan MNVni cheklay olishi tekshiriladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot sichqon modeliga asoslangan; natijalarni odamlarga toʻgʻridan-toʻgʻri koʻchirish mumkin emas, chunki virus-xoʻjayin oʻzaro taʼsiri turlicha boʻlishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"plscr1-mnv-replikatsiyasini-cheklash-uchun-yetarli\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plscr1-mnv-replikatsiyasini-cheklash-uchun-yetarli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PLSCR1 MNV replikatsiyasini cheklash uchun yetarli&lt;/span&gt;&lt;/a&gt;PLSCR1 MNV replikatsiyasini cheklash uchun yetarli&lt;/h4&gt;\n&lt;p&gt;Biz potensial antiviral genlarni aniqlash uchun avval oʻtkazilgan uchta genomik CRISPR-skrining maʼlumotlarini tahlil qildik. Birinchi tadqiqotda sichqon mikrogliya hujayralari (BV2) nokaut (CRISPR knockout) usuli bilan tekshirildi, bunda MNV infeksiyasiga sezgirlikni oshiruvchi genlar tanlab olindi. Ikkinchi skriningda BV2 hujayralarida genlarni aktivlashtirish (CRISPRa) usuli qoʻllanildi. Uchinchi skrining (CRISPRa) MNV reseptori CD300lfni ifodalovchi HeLa hujayralarida oʻtkazildi. Tahlil shuni koʻrsatdiki, IFITM2 va PLSCR1 genlari MNVga qarshi barqaror antiviral faollik koʻrsatadi (Rasm 1A).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-f1.jpg\" alt=\"1-rasm: Plscr1 MNV infeksiyasini optimal nazorat qilish uchun talab qilinadi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Plscr1 MNV infeksiyasini optimal nazorat qilish uchun talab qilinadi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: Plscr1 MNV infeksiyasini optimal nazorat qilish uchun talab qilinadi. (A) Uch xil skrining boʻyicha saqlanib qolgan «hit»larni (ijobiy natijalarni) koʻrsatuvchi Venn diagrammasi. (B) Boʻsh vektor yoki Plscr1 ifodalovchi HeLa-CD300lf hujayralari 0,05 infeksiya koʻpligi (MOI) bilan MNVCW3 (chapda) yoki MNVCR6 (oʻngda) bilan infeksiyalangan. Virus mahsuldorligi blyashka tahlili (PFU; blyashka hosil qiluvchi birliklar) yordamida hisoblangan. (C) Sichqon yoki inson Plscr1 ifodalovchi HeLa-CD300lf hujayralari 48 soat davomida 0,5 MOI bilan MNVCW3-HiBiT bilan zararlangan. Infeksiya Nano-Glo HiBiT Lytic Detection System (RLU; nisbiy lyuminessensiya birliklari) yordamida miqdoriy aniqlangan. (D) Koʻrsatilgan antitanachalar bilan boʻyalgan, FLAG-yorliqli sichqon (ms) yoki inson (hu) Plscr1 ifodalovchi HeLa-CD300lf hujayralarining vakillik vestern-bloti. (E) Vektor nazorati yoki Plscr1 ifodalovchi, 5,0 MOI MNVCW3 bilan infeksiyalangan va infeksiyadan keyingi koʻrsatilgan soatlarda (hpi) lizis qilingan HeLa-CD300lf hujayralarining vakillik vestern-bloti. (F) Interferon bilan ishlov berilmagan, 1000 birlik/ml interferon α yoki 0,1 mkg/ml interferon γ bilan ishlov berilgan va koʻrsatilgan antitanachalar bilan boʻyalgan HeLa-CD300lf yoki HeLaΔPlscr1-CD300lf hujayralarining vakillik vestern-bloti. (G) HeLa-CD300lf yoki HeLaΔPlscr1-CD300lf hujayralari 0,5 MOI MNVCW3-HiBiT bilan zararlangan. 48 soatdan keyin infeksiya Nano-Glo HiBiT Lytic Detection System yordamida miqdoriy aniqlangan. (H) HeLa-CD300lf yoki HeLaΔPlscr1-CD300lf hujayralari interferon α ning koʻrsatilgan dozalari (birlik/ml) bilan ishlov berilgan, soʻngra 48 soat davomida 0,5 MOI MNVCW3-HiBiT bilan zararlangan. Infeksiya Nano-Glo HiBiT Lytic Detection System yordamida miqdoriy aniqlangan. Koʻrsatilgan hujayra turlari uchun interferon α ning 50% samarali konsentratsiyasi (EC50) hisoblangan. (I) Plscr1+/+ (WT) yoki Plscr1-/- (KO) bir tugʻilgan hayvonlarda koʻrsatilgan toʻqimalardagi Plscr1 ifodasi. Uzlukli chiziq aniqlash chegarasini koʻrsatadi. (J) Plscr1+/+ (WT) yoki Plscr1-/- (KO) bir tugʻilgan hayvonlar 1 x 10^6 PFU MNVCW3 bilan infeksiyalangan va infeksiyadan 3 kun oʻtgach evtanaziya qilingan. Yoʻgʻon ichak, yonbosh ichak, tutqich limfa tugunlari (MLN), taloq va jigar MNV genom nusxalari uchun qPCR orqali tahlil qilingan va aktin boʻyicha normallashtirilgan. Har bir toʻqima uchun skripka diagrammasi (violin plot) bilan birga alohida maʼlumot nuqtalari koʻrsatilgan. Mann-Uitni testining P-qiymatlari keltirilgan. Uzlukli chiziq aniqlash chegarasini koʻrsatadi. Barcha maʼlumotlar uchta mustaqil tajribaning oʻrtacha qiymati ± standart ogʻish sifatida taqdim etilgan va Tukeyning koʻp qirrali taqqoslash testi bilan bir tomonlama dispersiya tahlili (ANOVA) (B va C), T-test (G) yoki Mann-Uitni testi (J) yordamida tahlil qilingan. *P &amp;lt; 0,05, **P &amp;lt; 0,01, ***P &amp;lt; 0,001, ****P &amp;lt; 0,0001.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR-skrining — virusli infeksiya paytida hujayralarning omon qolishiga taʼsir qiluvchi genlarni topish uchun genomdagi barcha genlarni oʻchirish (knockout) yoki faollashtirish (CRISPRa) usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;IFITM2 va PLSCR1 interferon tomonidan stimullanadigan genlardir (ISG). IFITM2 viruslarning endomembranali kompartmentlardan kirishini bloklaydi, PLSCR1 esa qobiqli viruslarning (masalan, OIV, SARS-CoV-2) membranalar bilan qoʻshilishiga toʻsqinlik qiladi. PLSCR1 qobiqsiz viruslarga taʼsiri oʻrganilmagani sababli, biz uning MNVni cheklashdagi rolini oʻrgandik. HeLa-CD300lf hujayralarida sichqon Plscr1 genining haddan tashqari ekspressiyasi (sverxekspressiya) MNV shtammlarining (MNVCW3 va MNVCR6) oʻsishini nazorat hujayralariga nisbatan sezilarli darajada susaytirdi (Rasm 1B). Sichqon va inson PLSCR1 oqsillari ketma-ketligi 75% oʻxshash boʻlishiga qaramay, har ikkala oqsil ham MNV-HiBiT reporter tizimi yordamida MNV replikatsiyasini samarali bostirishi tasdiqlandi (Rasm 1C, 1D). Plscr1 ekspressiyasi boʻlgan hujayralarda virusli oqsillar darajasi juda past edi (Rasm 1E).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HeLa-CD300lf hujayralarida sichqon yoki inson PLSCR1 genining haddan tashqari ekspressiyasi MNV replikatsiyasini bostiradi, bu virus yuklamasi va virusli oqsillar darajasining pasayishi bilan tasdiqlanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"plscr1-in-vitro-sharoitida-mnvni-cheklash-uchun-zarur\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plscr1-in-vitro-sharoitida-mnvni-cheklash-uchun-zarur\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Plscr1 in vitro sharoitida MNVni cheklash uchun zarur&lt;/span&gt;&lt;/a&gt;Plscr1 in vitro sharoitida MNVni cheklash uchun zarur&lt;/h4&gt;\n&lt;p&gt;PLSCR1 zarurligini tekshirish uchun biz ushbu gen nokaut qilingan HeLaΔPLSCR1-CD300lf hujayralar liniyasini yaratdik (Rasm 1F). PLSCR1 boʻlmaganda, HeLaΔPLSCR1-CD300lf hujayralarida MNV-HiBiT replikatsiyasi nazoratga nisbatan oshdi (Rasm 1G). PLSCR1 toʻgʻridan-toʻgʻri antiviral agentmi yoki interferon javobini kuchaytiruvchimi, buni aniqlash uchun biz IFN-αga sezgirlikni solishtirdik. Interferon bilan ishlov berish PLSCR1 mavjudligidan qatʼi nazar MNV replikatsiyasini kamaytirdi, bunda EC₅₀ qiymatlari statistik jihatdan farq qilmadi (Rasm 1H). Bu PLSCR1 interferon signal yoʻlini modulyatsiya qilmasdan, toʻgʻridan-toʻgʻri antiviral omil sifatida ishlashini koʻrsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot in vitro hujayra liniyalarida oʻtkazilgan; natijalar butun organizmdagi virus va immunitet tizimi oʻrtasidagi murakkab oʻzaro taʼsirni toʻliq aks ettirmasligi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"plscr1-yetishmovchiligi-bolgan-sichqonlarda-yogon-ichakda-mnv-replikatsiyasining-motadil-osishi-kuzatiladi\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plscr1-yetishmovchiligi-bolgan-sichqonlarda-yogon-ichakda-mnv-replikatsiyasining-motadil-osishi-kuzatiladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Plscr1 yetishmovchiligi boʻlgan sichqonlarda yoʻgʻon ichakda MNV replikatsiyasining moʻtadil oʻsishi kuzatiladi&lt;/span&gt;&lt;/a&gt;Plscr1 yetishmovchiligi boʻlgan sichqonlarda yoʻgʻon ichakda MNV replikatsiyasining moʻtadil oʻsishi kuzatiladi&lt;/h4&gt;\n&lt;p&gt;Interferon signal yoʻllari MNV infeksiyasi dinamikasini in vivo boshqaradi. Biroq, MNV infeksiyasini cheklovchi aniq ISG effektorlari yetarli darajada oʻrganilmagan. Tadqiqotchilar Plscr1-/- sichqonlaridan foydalangan holda, ularning toʻqimalarida Plscr1 transkriptlari darajasini baholadilar. Yovvoyi turdagi sichqonlarda Plscr1 ekspressiyasi yoʻgʻon va yonbosh ichakda eng yuqori boʻlgan, nokaut qilingan sichqonlarda esa transkriptlar aniqlanmagan (Rasm 1I). MNVCW3 bilan ogʻiz orqali zararlangandan 3 kun oʻtgach (Rasm 1J), virus genomlari taloq, jigar va mezenteral limfa tugunlarida (MLN) aniqlangan. Yovvoyi turdagi sichqonlarning ichaklarida virus deyarli aniqlanmagan. Plscr1 yetishmovchiligi boʻlgan sichqonlarda taloq, jigar va MLNda infeksiya dinamikasi nazorat guruhi bilan bir xil boʻlgan, ammo yoʻgʻon ichakda MNVCW3 miqdorining statistik jihatdan ahamiyatli, ammo moʻtadil oʻsishi kuzatilgan (Rasm 1J). Yonbosh ichakda ham shunga oʻxshash tendensiya kuzatilgan, ammo u statistik ahamiyatga ega boʻlmagan. Bu maʼlumotlar Plscr1 yoʻgʻon ichakda MNVCW3 replikatsiyasini bostirishini koʻrsatadi, ammo boshqa ISG effektorlari ham ishtirok etishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Plscr1 yetishmovchiligi yoʻgʻon ichakda MNV replikatsiyasining biroz oshishiga olib keladi, bu oqsilning qisman himoya funksiyasini anglatadi.&lt;br /&gt;\n[!warning] Tadqiqot sichqonlarda oʻtkazilgan; natijalarni odamlarga toʻgʻridan-toʻgʻri tatbiq etib boʻlmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"genetik-skrining-plscr1-ga-chidamlilikni-taminlovchi-vp2-ozgarishini-aniqladi\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#genetik-skrining-plscr1-ga-chidamlilikni-taminlovchi-vp2-ozgarishini-aniqladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Genetik skrining Plscr1 ga chidamlilikni taʼminlovchi VP2 oʻzgarishini aniqladi&lt;/span&gt;&lt;/a&gt;Genetik skrining Plscr1 ga chidamlilikni taʼminlovchi VP2 oʻzgarishini aniqladi&lt;/h4&gt;\n&lt;p&gt;Plscr1 taʼsir mexanizmini oʻrganish uchun MNVCR6 virusi Plscr1 ekspressiya qiluvchi HeLa-CD300lf hujayralarida 11 passaj davomida moslashtirildi (Rasm 2A). Plscr1 ishtirokida 11 passajdan oʻtgan virus (Plscr1 p11) nazorat guruhiga nisbatan oʻsish afzalligini koʻrsatdi (Rasm 2B). Amplikonlarni ketma-ket tahlil qilish (Rasm 2C, Jadval SN) Plscr1 p11 populyatsiyasida 30% dan ortiq chastotaga ega uchta genetik oʻzgarishni aniqladi (Rasm 2D). Ulardan ikkitasi missens-mutatsiyalar (NS2F304L va VP2Q32R; Rasm 2E) edi. Ushbu oʻzgarishlarni MNVCR6 molekulyar kloniga kiritish shuni koʻrsatdiki, faqat VP2Q32R mutatsiyasi virusga Plscr1 mavjud hujayralarda oʻsish imkonini beradi, bu esa uni «qochish» mutatsiyasi ekanligini tasdiqlaydi (Rasm 2F). Norovirus kapsidi VP1 va VP2 oqsillaridan iborat. VP2 ning roli toʻliq oʻrganilmagan boʻlsa-da, kalitsiviruslar (FCV) boʻyicha maʼlumotlar VP2 RNK ning sitoplazmaga kirishi uchun portal tuzilmasini hosil qilishini taxmin qiladi. Q32R oʻzgarishining ushbu portal yigʻilishiga taʼsiri kelgusi tadqiqotlar mavzusidir.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-f2.jpg\" alt=\"Rasm 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 2&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Qochish» mutatsiyasi — virusning hujayra himoya toʻsigʻini, bu holda Plscr1 oqsilining taʼsirini yengib oʻtishiga imkon beruvchi genetik oʻzgarish.&lt;br /&gt;\n[!tip] Amplikonlarni ketma-ket tahlil qilish — virusning moslashuvi jarayonida yuzaga kelgan mutatsiyalarni tez aniqlash imkonini beruvchi usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"plscr1-mnv-ning-birikishdan-keyingi-bosqichda-kirishini-cheklash-uchun-membrana-bilan-ozaro-tasir-qiluvchi-hududlarga-muhtoj\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plscr1-mnv-ning-birikishdan-keyingi-bosqichda-kirishini-cheklash-uchun-membrana-bilan-ozaro-tasir-qiluvchi-hududlarga-muhtoj\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Plscr1 MNV ning birikishdan keyingi bosqichda kirishini cheklash uchun membrana bilan oʻzaro taʼsir qiluvchi hududlarga muhtoj&lt;/span&gt;&lt;/a&gt;Plscr1 MNV ning birikishdan keyingi bosqichda kirishini cheklash uchun membrana bilan oʻzaro taʼsir qiluvchi hududlarga muhtoj&lt;/h4&gt;\n&lt;p&gt;VP2 oqsili virusning hujayraga kirishi va yigʻilishida ishtirok etganligi sababli, kirish bosqichini chetlab oʻtish tajribasi oʻtkazildi. MNVCW3 virusli RNKni Plscr1 ekspressiya qiluvchi HeLa hujayralariga transfeksiya qilish virus titrlarini nazorat hujayralari darajasigacha tikladi (3A-rasm). Bu Plscr1 aynan MNV kirish bosqichini susaytirishini tasdiqlaydi. Virusning hujayralar bilan bogʻlanishini tahlil qilish shuni koʻrsatdiki, CD300lf ekspressiyasi MNV bogʻlanishini sezilarli darajada oshiradi, ammo Plscr1 mavjudligi CD300lf bor-yoʻqligidan qatʼi nazar, bu jarayonga taʼsir qilmadi (3B-rasm). Bu Plscr1 bogʻlanishdan keyingi kirish bosqichini bloklashini koʻrsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Plscr1 MNV ning hujayraga birikishidan keyingi bosqichda kirishini bloklaydi, uning virusga qarshi faolligi CD300lf retseptori bilan bogʻlanish qobiliyatiga bogʻliq emas.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Plscr1 taʼsir mexanizmlarini oʻrganish uchun oqsilning mutant shakllari sinovdan oʻtkazildi. Yadroviy lokalizatsiya saytidagi mutatsiya (267AISAA271) oqsil ekspressiyasining pasayishiga olib keldi, shuning uchun u tahlildan chiqarildi. Adabiyotlarga koʻra, skramblaza faolligini yoʻqotadigan Plscr1F290A mutanti HeLa-CD300lf hujayralarida MNV replikatsiyasini bloklash qobiliyatini saqlab qoldi (3D va 3E-rasmlar). Aksincha, palmitoillanish saytining buzilishi (Plscr1PalmA mutanti, 193AAFPAA198) Plscr1 ning MNV ni cheklash qobiliyatini sezilarli darajada susaytirdi (3D va 3E-rasmlar).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Palmitoillanish — bu oqsilga yogʻ kislotalarini biriktirish jarayoni boʻlib, u oqsilning hujayra membranasiga mustahkam oʻrnashishiga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot HeLa hujayra liniyalarida oʻtkazilgan; natijalar membrana assotsiatsiyasi va virusga qarshi taʼsir oʻrtasidagi korrelyatsiyani koʻrsatadi, ammo barcha hujayra turlari uchun sabab-oqibat bogʻliqligini isbotlamaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Shuningdek, tadqiqotchilar odamlarda COVID-19 ogʻirligi bilan bogʻliq boʻlgan PLSCR1 polimorfizmlarining taʼsirini oʻrganishdi. PLSCR1 ning 262-pozitsiyasida gistidin, tirozin yoki glutamin boʻlgan variantlari MNV replikatsiyasini bir xil darajada chekladi (3F va 3H-rasmlar). \"Inson\" polimorfizmini (tirozin) sichqon Plscr1 ga kiritish ham uning virusga qarshi faolligini pasaytirmadi (3G va 3H-rasmlar). Shunday qilib, Plscr1 ning MNV ni cheklash mexanizmi SARS-CoV-2 ga qarshi taʼsir mexanizmidan farq qiladi, chunki u 262-pozitsiyadagi polimorfizmlarga sezgir emas.&lt;/p&gt;\n&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;h4 id=\"plscr1-oqsili-tomonidan-mnv-virusi-kirishining-cheklanish-mexanizmi\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plscr1-oqsili-tomonidan-mnv-virusi-kirishining-cheklanish-mexanizmi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PLSCR1 oqsili tomonidan MNV virusi kirishining cheklanish mexanizmi&lt;/span&gt;&lt;/a&gt;PLSCR1 oqsili tomonidan MNV virusi kirishining cheklanish mexanizmi&lt;/h4&gt;\n&lt;p&gt;Ushbu tadqiqotda PLSCR1 oqsili qobiqsiz sichqon norovirusi (MNV) kirishini bloklashi aniqlandi. Inhibitsiya jarayoni virus hujayraga birikkanidan keyingi bosqichda sodir boʻladi (Rasm 3A, 3B). VP2 oqsilidagi bitta nuqtali mutatsiya (VP2Q32R) virusga ushbu toʻsiqni yengib oʻtish imkonini beradi (Rasm 2F). VP2 virusli RNKni endosomadan sitoplazmaga membrana teshilishi orqali yetkazib beruvchi kanal hosil qilishini hisobga olsak, PLSCR1 endotsitar membranalarning xususiyatlarini oʻzgartirib, RNK chiqishini bloklaydi deb taxmin qilamiz. Q32R mutatsiyasi bu toʻsiqni qanday yengib oʻtishi hozircha nomaʼlum, ammo bu oʻzgarish jarayonni oʻrganish uchun genetik vosita boʻlib xizmat qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PLSCR1 qobiqsiz MNV virusining kirishini cheklaydi, bu esa uni qobiqli viruslarga qarshi himoya mexanizmlari bilan bogʻlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ISG (interferon-stimulyatsiya qilingan genlar) — infeksiyalarga qarshi kurashish uchun interferonlar taʼsirida faolligi oshadigan genlar.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"plscr1-ning-tugma-immunitet-tizimidagi-roli\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plscr1-ning-tugma-immunitet-tizimidagi-roli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PLSCR1 ning tugʻma immunitet tizimidagi roli&lt;/span&gt;&lt;/a&gt;PLSCR1 ning tugʻma immunitet tizimidagi roli&lt;/h4&gt;\n&lt;p&gt;PLSCR1 in vitro sharoitida MNVni samarali bostirish uchun zarur boʻlsa-da, uning yoʻqligi I turdagi interferon javobida sezilarli oʻzgarishlarga olib kelmadi (Rasm 1H). Bu MNVni cheklovchi boshqa ISGlar mavjudligini koʻrsatadi. Plscr1 tanqisligi boʻlgan sichqonlarda yoʻgʻon ichakdagi MNVCW3 virus yuki faqat biroz oshgan (Rasm 1J). Bizning maʼlumotlarimiz, jumladan IFITM2 ning aniqlanishi, PLSCR1 interferon tomonidan qoʻzgʻatiladigan kengroq himoya toʻsigʻining bir qismi ekanligini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot hujayra kulturalari va sichqon modellari asosida oʻtkazilgan; hayvonlardagi natijalar har doim ham odamga toʻgʻridan-toʻgʻri tatbiq etilmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"plscr1-funksional-domenlari-va-virus-spesifikligi\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plscr1-funksional-domenlari-va-virus-spesifikligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PLSCR1 funksional domenlari va virus spesifikligi&lt;/span&gt;&lt;/a&gt;PLSCR1 funksional domenlari va virus spesifikligi&lt;/h4&gt;\n&lt;p&gt;Biz MNVni cheklash uchun fosfolipid skramblaza faolligi emas, balki butun palmitoillanish motivi zarurligini aniqladik (Rasm 3D). Palmitoillanishga bogʻliqlik SARS-CoV-2 ni bostirishda ham kuzatiladi. Biroq, PLSCR1 ning H262 va Y262 variantlari MNVni bir xil darajada cheklaydi, bu esa turli viruslarga qarshi himoya mexanizmlaridagi farqlarni koʻrsatadi. Shunday qilib, PLSCR1 viruslarning kirish strategiyalaridan qatʼi nazar, fundamental jihatdan farqli viruslar sinflariga umumiy cheklovlar qoʻyadi.&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"hujayra-liniyalari-va-kultivatsiya\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#hujayra-liniyalari-va-kultivatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hujayra liniyalari va kultivatsiya&lt;/span&gt;&lt;/a&gt;Hujayra liniyalari va kultivatsiya&lt;/h4&gt;\n&lt;p&gt;293T, HeLa va BV2 hujayralari 5% fetal sigir zardobi qoʻshilgan DMEM muhitida oʻstirildi. Barqaror giper-ekspressiyali hujayra liniyalari lentivirus transduksiyasi yordamida olindi. Lentivirus plazmidalari, qadoqlash vektori (psPax2) va psevdotiplash vektori (pCMV-VSV-G) PEI yordamida 293T hujayralariga kiritildi. 48 soatdan keyin virus yigʻib olindi, 0,45 mkm filtrdan oʻtkazildi va hujayralarga qoʻshildi. 48 soat oʻtgach, muhit tegishli antibiotiklar (350 mkg/ml gigromitsin yoki 5 mkg/ml blasticidin va/yoki 1 mkg/ml puromitsin) bilan almashtirildi. Hujayra liniyalari mikoplazma bilan zararlanmaganligi muntazam tekshirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Lentivirus transduksiyasi — bu genetik materialni viruslar yordamida hujayra genomiga kiritish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;HeLaΔPlscr1 liniyasini yaratish uchun HeLa hujayralari PLSCR1 geniga yoʻnaltiruvchi RNK (gidlar) tutgan pSpCas9(BB)-2A-Blast va pSpCas9(BB)-2A-Puro plazmidalari bilan transfeksiya qilindi. 48 soatdan soʻng, hujayralar ikki kun davomida 5 mkg/ml blasticidin va 1 mkg/ml puromitsinli muhitda saqlandi, keyin antibiotiksiz muhitga oʻtkazildi. Yagona hujayrali klonlar ajratib olindi, genomik DNK ajratildi va Sanger sekveniroviyasi orqali tahlil qilindi. Natijada stop-kodonlarga olib keluvchi deltsiyali allellar aniqlandi.&lt;/p&gt;\n&lt;h4 id=\"virusli-tahlillar\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#virusli-tahlillar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Virusli tahlillar&lt;/span&gt;&lt;/a&gt;Virusli tahlillar&lt;/h4&gt;\n&lt;p&gt;MNVCW3, MNVCR6 va ularning mutantlari 293T hujayralariga transfeksiya qilish va BV2 hujayralarida koʻpaytirish orqali olindi. Infeksiya uchun HeLa-CD300lf hujayralari 96-chuqurchali planshetlarga ekildi va 0,05 MOI (infeksiya koʻpligi) bilan viruslandi. Planshetlar 1 soat davomida xona haroratida chayqatildi, soʻngra 37°C va 5% CO2 sharoitida inkubatsiya qilindi. Virus titrlari blyashka usuli bilan aniqlandi. MNV-HiBiT tahlillarida 0,5 yoki 5 MOI ishlatildi, lyuminessent faollik Synergy LX qurilmasi va Nano-Glo HiBiT tizimi yordamida oʻlchandi.&lt;/p&gt;\n&lt;h4 id=\"plazmid-konstruksiyalari\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plazmid-konstruksiyalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Plazmid konstruksiyalari&lt;/span&gt;&lt;/a&gt;Plazmid konstruksiyalari&lt;/h4&gt;\n&lt;p&gt;Plscr1 (sichqon va odam) kDNK va mutatsiyalar N-terminal 3xFLAG yorligʻi bilan pCDH-EF1-MCS-IRES-Puro vektoriga klonlandi. MNV molekulyar klonlari GenBank (EF014462.1 va JQ237823) maʼlumotlariga mos keladi. Barcha plazmidlar ishlatilishidan oldin toʻliq sekveniroviyadan oʻtkazildi.&lt;/p&gt;\n&lt;h4 id=\"immunoblotting\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#immunoblotting\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Immunoblotting&lt;/span&gt;&lt;/a&gt;Immunoblotting&lt;/h4&gt;\n&lt;p&gt;Laemmli buferida lizis qilingan namunalar SDS-PAGE usulida ajratildi va PVDF membranalariga oʻtkazildi. Membranalar 5% sut kukuni bilan bloklandi va tegishli antitanachalar (Plscr1, GAPDH, FLAG, STAT1, fosfo-STAT1) hamda MNV oqsillariga qarshi antitanachalar bilan inkubatsiya qilindi.&lt;/p&gt;\n&lt;h4 id=\"sichqonlarni-zararlash\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#sichqonlarni-zararlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sichqonlarni zararlash&lt;/span&gt;&lt;/a&gt;Sichqonlarni zararlash&lt;/h4&gt;\n&lt;p&gt;Hayvonlar ustida oʻtkazilgan tadqiqotlar Texas universiteti Janubi-gʻarbiy tibbiyot markazi (UT Southwestern) Hayvonlarni parvarishlash va ulardan foydalanish qoʻmitasi nazorati ostida amalga oshirildi. Plscr1-/- sichqonlari va nazorat guruhi sifatida ularning bir tugʻruqdagi sheriklari SPF (spetsifik patogenlardan xoli) sharoitida saqlandi. Hayvonlar ogʻiz orqali 1 × 10⁶ Birlik (PFU) MNVCW3 virusi bilan zararlantirildi va darhol alohida kataklarga ajratildi. 3 kundan soʻng sichqonlar evtanaziya qilindi va toʻqimalar 1 mm li silikat sharchalari yordamida TRIzol muhitida gomogenizatsiya qilindi. RNK ajratib olindi va kDNK sintezi uchun ishlatildi. Virusli genom, aktin va Plscr1 nusxalari miqdori real vaqt rejimida PZR (qPCR) usuli bilan maxsus praymerlar va zondlar yordamida baholandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Real vaqt rejimida PZR (qPCR) — bu namuna tarkibidagi DNK yoki RNK nusxalarini kuchaytirish jarayonida ularning miqdorini aniqlash imkonini beruvchi molekulyar biologik usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"plscr1-qarshiligini-aniqlash-uchun-togridan-togri-genetik-skrining\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plscr1-qarshiligini-aniqlash-uchun-togridan-togri-genetik-skrining\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Plscr1 qarshiligini aniqlash uchun toʻgʻridan-toʻgʻri genetik skrining&lt;/span&gt;&lt;/a&gt;Plscr1 qarshiligini aniqlash uchun toʻgʻridan-toʻgʻri genetik skrining&lt;/h4&gt;\n&lt;p&gt;Tajribalar BSL2 sharoitida oʻtkazildi. Vektor yoki Plscr1 ifodalovchi HeLa-CD300lf hujayralari (2 × 10⁶) MNVCR6 virusi bilan 0,05 MOI (zararlanish koʻpligi) darajasida zararlantirildi. Har 48–72 soatda virus passaj qilindi (jami 11 marta). Oxirgi passajdan soʻng virusli supernatanatdan RNK ajratib olindi, kDNK sintez qilindi va MNV genomining 250–3000 juft asosli fragmentlari PZR orqali kuchaytirilib, sekvenlash qilindi. Maʼlumotlar MNVCR6 WT kloni bilan solishtirildi; Plscr1 ga xos mutatsiyalarni aniqlash uchun Plscr1 guruhidagi nomuvofiqlik foizidan vektor guruhidagi nomuvofiqlik foizi ayirib tashlandi. Natijalar nukleotidlarni aniqlash ishonchliligini koʻrsatuvchi Phred Q koʻrsatkichi bilan solishtirildi.&lt;/p&gt;\n&lt;h4 id=\"kirish-bosqichini-chetlab-otish-tahlili\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#kirish-bosqichini-chetlab-otish-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish bosqichini chetlab oʻtish tahlili&lt;/span&gt;&lt;/a&gt;Kirish bosqichini chetlab oʻtish tahlili&lt;/h4&gt;\n&lt;p&gt;MNVCW3 dan ajratib olingan 4 mkg virusli RNK, boʻsh vektor yoki sichqon Plscr1 ifodalovchi HeLa hujayralariga Lipofectamine 3000 yordamida transfeksiya qilindi. Muhimi, bu hujayralar CD300lf retseptorini ifodalamaydi, bu esa koʻp siklli infeksiyalarning oldini oladi. 24 soatlik inkubatsiyadan soʻng namunalar -80°C da muzlatildi va virus titrlari blyashka usuli bilan aniqlandi.&lt;/p&gt;\n&lt;h4 id=\"virus-boglanishini-tahlil-qilish\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#virus-boglanishini-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Virus bogʻlanishini tahlil qilish&lt;/span&gt;&lt;/a&gt;Virus bogʻlanishini tahlil qilish&lt;/h4&gt;\n&lt;p&gt;2,5 × 10⁵ hujayra 1,6 × 10⁹ PFU MNVCR6 virusi bilan 5% FBS qoʻshilgan DMEM muhitida 4°C haroratda 1 soat davomida aralashtirildi. Sentrifugalashdan (500 g, 5 daqiqa) soʻng hujayralar uch marta sovuq PBS bilan yuvildi. Bogʻlangan virusni miqdoriy aniqlash uchun hujayralardan RNK ajratib olindi va yuqorida taʼriflanganidek qPCR oʻtkazildi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-fS1.jpg\" alt=\"Rasm S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-fS2.jpg\" alt=\"Qoʻshimcha rasm 2: Qoʻlyozmada ishlatilgan asl vestern-blotlar. 3-rasmda tasvirlangan blotlarga mos keladigan oʻzgartiri\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Qoʻshimcha rasm 2: Qoʻlyozmada ishlatilgan asl vestern-blotlar. 3-rasmda tasvirlangan blotlarga mos keladigan oʻzgartirilmagan immunoblot xemilyuminessensiya tasvirlari.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Norovirusning&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;h
