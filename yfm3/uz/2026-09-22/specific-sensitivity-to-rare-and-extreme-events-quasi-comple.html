        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"277\" cy=\"156\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"503\" cy=\"215\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · ANIMAL BEHAVIOR AND COGNITION   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Kalamushлар қоқу қуshlarini&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qanday chetlab o‘tadi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f1.jpg\" alt=\"1-rasm: Eksperimental dizayn.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Eksperimental dizayn.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: Eksperimental dizayn. (a) Operant shartlanish kamerasining sxematik tasviri. Sıçanlar mukofot (shakar pechenyelari) yoki jazo (taym-aut kechikishi) tarqatilishiga olib keladigan turli xil o'lcham va ehtimollikka ega bo'lgan har bir variantga mos keladigan burun bilan turtish teshiklaridan foydalangan holda o'z sur'atida to'rt variantli tanlov vazifasini bajardilar. (b) Har bir variant uchun natijalar strukturasi. Mukofotlar va yo'qotishlar qavariq (yashil) yoki botiq (qizil) ehtimollik-kattalik funksiyalariga bo'ysunadi. Natijalar uchta ehtimollik domeniga bo'lingan: yuqori ehtimollikdagi Odatiy Hodisalar (NE; 20–25%, ko'k), Nodir Hodisalar (RE; 5%, sariq) va Nodir va O'ta Hodisalar (&lt;a href=\"concepts/rare-and-extreme-events.html\"&gt;REE&lt;/a&gt;; &amp;lt;1%, pushti). (c) Nodir va o'ta yutuqlar (\"Jekpotlar\") va nodir va o'ta yo'qotishlar (\"Qora oqqushlar\") ta'siriga asoslangan to'rtta tanlov variantining funksional tavsifi. Gorizontal x o'qida sub'ektga noma'lum bo'lgan ex-ante ehtimolliklari (kelib chiqish nuqtasidan uzoqlashganda kamayish tartibida) keltirilgan bo'lib, sub'ekt faqat vertikal y o'qida o'lchanadigan natijani kuzatadi. Qulaylik uchun yutuqlar yuqori o'ng kvadrantda, yo'qotishlar esa pastki chap kvadrantda paydo bo'ladi. Qavariq egri chiziqlar yashil, botiqlar esa qizil rangda. Mustahkam (Robust): qavariq yo'qotishlar va botiq yutuqlar (ikkala REE dan qochadi). Mo'rtlikka qarshi (Anti-fragile): qavariq yo'qotishlar va qavariq yutuqlar (\"Jekpotlar\"ga kirishni saqlab qolgan holda \"Qora oqqushlar\"dan qochadi). Mo'rt (Fragile): botiq yo'qotishlar va botiq yutuqlar (\"Qora oqqushlar\" ta'siri, \"Jekpotlar\"dan qochish). Zaif (Vulnerable): botiq yo'qotishlar va qavariq yutuqlar (ham \"Qora oqqushlar\", ham \"Jekpotlar\" ta'sirida). (d) Xulq-atvor sezuvchanligi metrikasi. Umumiy Sezuvchanlik (y o'qi) yutuq va yo'qotish domenlarida qavariq tanlovlarni jamlash orqali REE ning umumiy kiritilishini miqdoriy jihatdan aniqlaydi. Bir tomonlama Sezuvchanlik (x o'qi) REE qidirish va REE dan qochish o'rtasidagi assimetriyani o'lchaydi. Misol profillari quyidagilarni ko'rsatadi: mo'rtlikka qarshi o'xshash naqsh (yashil), mo'rt o'xshash naqsh (qizil) va kuchli \"Qora oqqush\" dan qochish va qisman \"Jekpot\" qidirishga ega aralash mo'rtlikka qarshi/mustahkam profil (ko'k). Hisoblash ta'riflari uchun \"Materiallar va usullar\" bo'limiga qarang.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Ko‘p tajribalar qarorlarni odatiy sharoitda o‘rganadi, ammo haqiqiy hayotda ehtimoli kam, lekin ulkan oqibatli holatlar ko‘p. Neyrobiologlar kemiruvchilar bunday nodir hodisalarga qanday moslashishini tekshirdi. Ma'lum bo‘lishicha, miya odatiy holatlar va cheksizliklarni bir-biridan ajratib turadi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Kalamushlar nodir jazolardan qochish uchun mayda yo‘qotishlarga rozi bo‘ladi.&lt;/li&gt;\n&lt;li&gt;Alohida vaznli model hayvonlar tanlovini yaxshiroq tushuntiradi.&lt;/li&gt;\n&lt;li&gt;Miya taqsimot chetlarini odatiy holatlardan alohida qayta ishlaydi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Klassik xulq-atvor testlarida ehtimolliklar ko‘pincha o‘n foizdan yuqori bo‘ladi. Mualliflar ehtimoli bir foizdan kam va o‘rtacha qiymatdan o‘nta standart og‘ishdan yuqori bo‘lgan nodir hodisalarni (REE) baholash uchun maxsus muhit yaratdi. To‘rt qadamli tanlov testida hayvonlar shakar pelletlari va vaqtni yo‘qotish jazolari o‘rtasida tanlov qildi.&lt;/p&gt;\n&lt;p&gt;Kemiruvchilarning xulq-atvori aniq assimetriyani ko‘rsatdi. Kalamushlar o‘ta og‘ir jazolarni butunlay chetlab o‘tdi, ammo yirik yutuqlarga qisman intildi. Buning evaziga hayvonlar kichik yo‘qotishlarga chidashga rozi bo‘ldi. Oddiy o‘rganish modellari bunday strategiyani tushuntira olmadi.&lt;/p&gt;\n&lt;p&gt;Tadqiqotchilar nodir voqealarga alohida vazn beruvchi kengaytirilgan modelni qo‘lladi. Bu kalamush miyasi odatiy taqsimot va uning chetki qismlarini mustaqil baholashini ko‘rsatdi. Bunday bo‘linish hayvonlarga halokatli oqibatlardan qochish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot laboratoriya kalamushlarida o‘tkazilgan bo‘lib, natijalarni darhol inson qarorlariga tatbiq etib bo‘lmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Hayvonlar xulq-atvorini oʻrganuvchi aksariyat tadqiqotlar 10% dan yuqori ehtimollikdagi natijalarga qaratilgan. Biroq, real hayotda qaror qabul qilish jarayoni juda kam uchraydigan, ammo oqibatlari ogʻir boʻlgan hodisalarni baholashni talab qiladi. Ushbu boʻshliqni toʻldirish uchun mualliflar kalamushlarning kamyob (ehtimollik &amp;lt; 1%) va ekstremal (oʻrtacha qiymatdan &amp;gt; 10 standart chetlanish) hodisalarni (REE) aniqlash va ularga moslashishini miqdoriy baholash uchun eksperimental va hisoblash tizimini ishlab chiqdilar. Tajribada «toʻrt qoʻlli bandit» vazifasidan foydalanildi, unda hayvonlar ehtimoliy mukofotlar (shakar granulalari) yoki jazo (vaqtinchalik tanaffuslar) bilan bogʻliq variantlar oʻrtasida tanlov qildilar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Toʻrt qoʻlli bandit» — bu subyekt maksimal foyda olish uchun har xil ehtimollikdagi mukofot yoki jazo beruvchi bir nechta variantlar orasidan tanlov qilishi kerak boʻlgan xulq-atvor testi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kalamushlar cheklangan diversifikatsiyani namoyon etib, odatda toʻrtta variantdan ikkitasini tanladilar. Hayvonlar REE ga nisbatan aniq sezgirlik koʻrsatdilar: ular kamyob va ekstremal jazolardan («qora oqqushlar») tizimli ravishda qochdilar, shu bilan birga kamyob va ekstremal yutuqlarga («jekpotlar») qisman ochiq qoldilar. Dominant xulq-atvor fenotipi «qora oqqushlar» xavfini deyarli toʻliq bartaraf etdi, «jekpotlar» taʼsiri esa oʻrtacha darajada qoldi. Bu assimetrik sezgirlik evaziga hayvonlar halokatli oqibatlarning oldini olish uchun kichikroq tez-tez uchraydigan yutuqlar va katta tez-tez uchraydigan yoʻqotishlarga rozi boʻlishdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kalamushlar assimetrik qaror qabul qilish strategiyasini namoyon etadi: ular ekstremal jazolardan deyarli butunlay qochishadi, lekin ekstremal mukofotlar uchun tavakkal qilishadi, bu esa barqaror foydani kamaytiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kuzatilgan xulq-atvorni tushuntirish uchun REE hodisalari tez-tez uchraydigan hodisalardan alohida vaznlanadigan «kengaytirilgan mustahkamlovchi oʻrganish modeli» (augmented reinforcement learning model) qoʻllanildi. Ushbu modelning individual maʼlumotlarga moslashuvi kuzatilgan assimetriyani takrorlay olmagan standart Q-oʻrganish (&lt;a href=\"concepts/q-learning.html\"&gt;Q-learning&lt;/a&gt;) usuliga qaraganda ancha yuqori aniqlikni koʻrsatdi. Model kalamush miyasi natijalarning markaziy taqsimoti va «dum» qismlaridagi maʼlumotlarni ajratib, harakatni tanlashda REE ga alohida vazn berishini taxmin qiladi. Bu ish kemiruvchilar oʻz oʻrganish strategiyalarini ekstremal jazolardan qochish uchun moslashtirishi va tez-tez uchraydigan hodisalarni kamyob ekstremal hodisalardan ajratib qayta ishlashini koʻrsatuvchi ilk dalildir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kalamushlarda oʻtkazilgan; kemiruvchilarda aniqlangan mexanizmlarning inson qaror qabul qilish jarayonlariga mosligi qoʻshimcha tekshiruvni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"nodir-va-ekstremal-hodisalarni-organish\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#nodir-va-ekstremal-hodisalarni-organish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nodir va ekstremal hodisalarni oʻrganish&lt;/span&gt;&lt;/a&gt;Nodir va ekstremal hodisalarni oʻrganish&lt;/h4&gt;\n&lt;p&gt;Atrof-muhitni oʻrganish va mavjud resurslardan foydalanish oʻrtasidagi muvozanat adaptiv xulq-atvorning asosidir. Biroq, juda kam uchraydigan, ammo katta ahamiyatga ega boʻlgan hodisalar (Rare and Extreme Events, REE) sharoitida qaror qabul qilish mexanizmlari yetarlicha oʻrganilmagan. Aksariyat laboratoriya modellari 10% dan yuqori ehtimollikdagi natijalardan foydalanadi, bu esa nodir hodisalar evolyutsion muvaffaqiyatni belgilashi yoki turlarning yoʻq boʻlib ketishiga olib kelishi mumkin boʻlgan real sharoitlarni aks ettirmaydi. REE ehtimolligi va koʻlamini tajriba asosida baholash qiyin boʻlgani sababli, hayvonlar va odamlar bunday vaziyatlarga qanday moslashishi nomaʼlumligicha qolmoqda.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Qaror qabul qilish boʻyicha aksariyat tadqiqotlar ehtimolligi 10% dan kam boʻlgan hodisalarni eʼtiborsiz qoldiradi, garchi aynan shu nodir va ekstremal natijalar omon qolish uchun juda muhim boʻlsa.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu muammoni oʻrganish uchun mualliflar qaror qabul qilish neyrobiologiyasida standart model hisoblangan kalamushlardan foydalanishdi. «Toʻrt qoʻlli bandit» vazifasi ishlab chiqildi, unda hayvonlar REE ehtimolligi 1% dan kam boʻlgan muhit bilan oʻzaro taʼsir qiladi. Ushbu hodisalar oʻrtacha natijadan 10 standart chetlanishdan yuqori boʻlgan yutuq yoki yoʻqotish koʻlami bilan tavsiflanadi. Bu klassik Ayova qimor oʻyinlari testlaridan farq qiladi, chunki ularda nodir hodisalar 10% va undan yuqori ehtimollikka ega.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Toʻrt qoʻlli bandit» — bu tajriba vazifasi boʻlib, unda subyekt toʻrtta harakat variantidan birini tanlaydi, ularning har biri oʻziga xos ehtimollik va mukofot yoki jazo hajmiga ega.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kalamushlarda oʻtkazilmoqda; kemiruvchilarda qaror qabul qilish mexanizmlari odamnikidan farq qilishi mumkin va natijalar boshqa modellarda tekshirilishi kerak.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mualliflar xulq-atvor strategiyalarini REE ga munosabati asosida tasnifladilar. «Antixrupka» (Anti-fragile) strategiyasi ekstremal yutuqlar («Jekpotlar») imkoniyatini saqlab qolgan holda, ekstremal yoʻqotishlar («Qora oqqushlar») xavfini minimallashtiradi. «Xrupka» (Fragile) strategiyasi esa jekpotlarni istisno qiladi, lekin qora oqqushlar xavfini qoldiradi. Shuningdek, «barqaror» (barcha REE ni istisno qiluvchi) va «zaif» (ham ijobiy, ham salbiy REE taʼsiriga ega) strategiyalar ajratildi. Tajriba dizayni natijalarni uch guruhga ajratadi: normal hodisalar (~90%), nodir hodisalar (~10%) va REE (&amp;lt;1%). Mukofot koʻlami nochiziqli oʻzgaradi: qavariq variantlar ehtimollik kamayganda potentsial yutuqni oshiradi (jekpotlar), botiq variantlar esa uni cheklaydi. Yoʻqotishlar sohasida botiq variantlar qora oqqushlar xavfini oshiradi, qavariq variantlar esa maksimal zararni cheklaydi.&lt;/p&gt;\n&lt;h4 id=\"noaniqlik-sharoitida-tanlovning-nazariy-asoslari\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#noaniqlik-sharoitida-tanlovning-nazariy-asoslari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Noaniqlik sharoitida tanlovning nazariy asoslari&lt;/span&gt;&lt;/a&gt;Noaniqlik sharoitida tanlovning nazariy asoslari&lt;/h4&gt;\n&lt;p&gt;Stoxastik dominantlik argumentlariga koʻra, qiymatni maksimallashtiruvchi agentlar normal hodisalar (NE) sohasida botiq variantlarni afzal koʻrishlari kerak. Nodir hodisalar (RE) sohasida ham tavakkalchilikdan qochish sharti bilan bu afzallik saqlanib qoladi. Biroq, ekstremal nodir hodisalarni (REE) oʻz ichiga olgan toʻliq muhitda vaziyat oʻzgaradi: ikkinchi tartibli dominantlik teskarisiga aylanadi va qavariq variantlar optimal boʻlib qoladi, chunki REE roʻy bermagan taqdirda «qora oqqushlar»dan qochish qimmatga tushadi. Shunday qilib, antimoʻrt strategiyalar faqat REE ichki tasavvur qilinganda samarali boʻladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ekstremal nodir hodisalar (REE) sharoitida qavariq strategiyalar optimal hisoblanadi, chunki halokatli yoʻqotishlardan qochish nodir yutuqlardan ustun turadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"xulq-atvor-metrikalari-va-tajriba-natijalari\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#xulq-atvor-metrikalari-va-tajriba-natijalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulq-atvor metrikalari va tajriba natijalari&lt;/span&gt;&lt;/a&gt;Xulq-atvor metrikalari va tajriba natijalari&lt;/h4&gt;\n&lt;p&gt;Stimullar valentligini (shakar granulalari yutuq sifatida, vaqtinchalik cheklov jazo sifatida) baholash uchun ikkita koʻrsatkich kiritildi: REE ga umumiy sezgirlik (yutuq va yoʻqotish sohalarida qavariq tanlovlar chastotasi) va bir tomonlama sezgirlik (yutuq va yoʻqotish sohalaridagi qavariq tanlovlar oʻrtasidagi farq), bu «jekpot»ga intilish va «qora oqqushlar»dan qochish balansini aks ettiradi.&lt;/p&gt;\n&lt;p&gt;20 ta kalamush ishtirokidagi tadqiqotda (41 sessiya davomida har bir jonivor uchun taxminan 6000 urinish) hayvonlar toʻrtta mavjud variantdan ikkitasiga eʼtibor qaratishi aniqlandi. 20 ta kalamushdan 19 tasi oʻrtacha yoki yuqori umumiy sezgirlikni koʻrsatib, ekstremal mukofotlarni izlashni ekstremal yoʻqotishlardan qisman qochish bilan birlashtiradi. 20 ta kalamushdan 13 tasi «qora oqqushlar»dan deyarli toʻliq qochadi, lekin «jekpot»larga faqat qisman intiladi, bu esa salbiy bir tomonlama sezgirlikni keltirib chiqaradi. Bu nodir ijobiy va salbiy natijalarni assimetrik idrok etishdan dalolat beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Q-oʻrganish — agent kutilayotgan umumiy mukofotni maksimallashtiruvchi harakatlarni tanlashni oʻrganadigan mustahkamlovchi oʻqitish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kalamushlarda oʻtkazilgan; bu qaror qabul qilish mexanizmlarini insonning kognitiv jarayonlariga koʻchirish qoʻshimcha dalillarni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"hisoblash-modellashtirish\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#hisoblash-modellashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hisoblash modellashtirish&lt;/span&gt;&lt;/a&gt;Hisoblash modellashtirish&lt;/h4&gt;\n&lt;p&gt;Maʼlumotlarni talqin qilish uchun mualliflar «jekpot» va «qora oqqushlar»ga sezgirlik parametrlari kiritilgan Q-oʻrganish modellari oilasini qoʻlladilar. Modellarni taqqoslash shuni koʻrsatdiki, kalamushlar harakatlarni tanlashda normal hodisalar (NE+RE) va ekstremal nodir hodisalarni (REE) alohida hisobga oladi. Bu hayvonlarning noaniqlik sharoitida qaror qabul qilishda ekstremal hodisalarga, ayniqsa salbiylariga, alohida kognitiv yoki neyron ahamiyat berishini koʻrsatadi.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"nodir-va-ekstremal-hodisalarga-sezgirlikni-olchash-tort-yonalishli-tanlov-vazifasi\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#nodir-va-ekstremal-hodisalarga-sezgirlikni-olchash-tort-yonalishli-tanlov-vazifasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nodir va ekstremal hodisalarga sezgirlikni oʻlchash: toʻrt yoʻnalishli tanlov vazifasi&lt;/span&gt;&lt;/a&gt;Nodir va ekstremal hodisalarga sezgirlikni oʻlchash: toʻrt yoʻnalishli tanlov vazifasi&lt;/h4&gt;\n&lt;p&gt;Kalamushlar toʻrtta burun tiqish portiga ega operant kamerada sinovdan oʻtkazildi. Har bir port maʼlum bir mukofot (saxaroza granulalari) va jazo (taym-aut) taqsimotiga bogʻlangan. Oʻqitishdan soʻng hayvonlar 41 ta eksperimental sessiyani bajardi (har biri 20 daqiqa, oʻrtacha 120 ta urinish) (1a, 1b-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Operant kamera — bu hayvonlar mukofot olish uchun mustaqil ravishda harakatlar (masalan, portga bosish) bajaradigan psixologik tadqiqot vositasi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Har bir tanlov varianti natija kattaligi va hodisa ehtimolligi oʻrtasidagi bogʻliqlik bilan belgilandi. Mualliflar yutuq yoki jazo ehtimolini tavsiflash uchun qavariq (tezlashuvchi) va botiq (sekinlashuvchi) funksiyalardan foydalandilar (1b, 1c-rasm). Barcha variantlar uchta hodisa sinfini oʻz ichiga oldi: oddiy (NE; 20–25%), nodir (RE; 5%) va nodir ekstremal hodisalar (REE; &amp;lt;1%). Oxirgilari oʻta katta yutuqlarni («jekpotlar»: 80 ta granula) yoki oʻta ogʻir jazolarni («qora qushlar»: 240 soniyalik taym-aut) oʻz ichiga olgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqotchilar toʻrt turdagi strategiyani yaratdilar: «antixrup» (qora qushlardan qochib, jekpotlarga erishish), «xrup» (jekpotlarsiz qora qushlar xavfi), «barqaror» (ikkala ekstremumdan qochish) va «zaif» (ikkala ekstremal hodisaga duchor boʻlish).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Yutuq va yoʻqotish funksiyalarining kombinatsiyasi toʻrtta xulq-atvor profilini ajratib koʻrsatishga imkon berdi (1c-rasm). «Antixrup» variant ikkala natija uchun ham qavariq funksiyalarni birlashtirib, qora qushlardan qochgan holda jekpotlarni olishga imkon berdi. «Xrup» variant (botiq funksiyalar) mukofot hajmini chekladi, ammo hayvonlarni ekstremal jazolarga duchor qildi. «Barqaror» variant qora qushlarni istisno qildi, lekin jekpotlarga yoʻl qoʻymadi, «zaif» variant esa hayvonlarni har ikki turdagi ekstremal hodisalarga duchor qildi. Ushbu hodisalarga sezgirlik umumiy va bir tomonlama afzallik koʻrsatkichlari orqali baholandi (1d-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot hayvonlarda oʻtkazilgan, shuning uchun qaror qabul qilish strategiyalari boʻyicha xulosalarni odamlarga toʻgʻridan-toʻgʻri tatbiq etishda ehtiyot boʻlish kerak.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"nodir-ekstremal-hodisalarga-nisbatan-xulq-atvor-sezgirligi\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#nodir-ekstremal-hodisalarga-nisbatan-xulq-atvor-sezgirligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nodir ekstremal hodisalarga nisbatan xulq-atvor sezgirligi&lt;/span&gt;&lt;/a&gt;Nodir ekstremal hodisalarga nisbatan xulq-atvor sezgirligi&lt;/h4&gt;\n&lt;p&gt;Eksperiment tuzilmasi nodir ekstremal hodisalarga (REE) taʼsirni bevosita oʻzgartirganligi sababli, tadqiqotchilar kalamushlarning qavariq (potensial ekstremal) va botiq (barqaror) natija funksiyalariga ega variantlarni tanlash chastotasini tahlil qildilar. Ushbu maʼlumotlar asosida ikkita koʻrsatkich ishlab chiqildi (Rasm 1d). «REE ga umumiy sezgirlik» hayvonning har qanday sohada ekstremal natijalar bilan aloqaga kirishishga imkon beruvchi variantlarni tanlash moyilligini aks ettiradi. «Bir tomonlama sezgirlik» yutuq va yoʻqotish sohalari oʻrtasidagi assimetriyani baholaydi, yaʼni hayvon «jekpot» (Jackpot Seeking) olishga intiladimi yoki halokatli jazolardan qochadimi (Black Swan Avoidance).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f1.jpg\" alt=\"1-rasm: Eksperimental dizayn.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Eksperimental dizayn.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: Eksperimental dizayn. (a) Operant shartlanish kamerasining sxematik tasviri. Sıçanlar mukofot (shakar pechenyelari) yoki jazo (taym-aut kechikishi) tarqatilishiga olib keladigan turli xil o'lcham va ehtimollikka ega bo'lgan har bir variantga mos keladigan burun bilan turtish teshiklaridan foydalangan holda o'z sur'atida to'rt variantli tanlov vazifasini bajardilar. (b) Har bir variant uchun natijalar strukturasi. Mukofotlar va yo'qotishlar qavariq (yashil) yoki botiq (qizil) ehtimollik-kattalik funksiyalariga bo'ysunadi. Natijalar uchta ehtimollik domeniga bo'lingan: yuqori ehtimollikdagi Odatiy Hodisalar (NE; 20–25%, ko'k), Nodir Hodisalar (RE; 5%, sariq) va Nodir va O'ta Hodisalar (REE; &amp;lt;1%, pushti). (c) Nodir va o'ta yutuqlar (\"Jekpotlar\") va nodir va o'ta yo'qotishlar (\"Qora oqqushlar\") ta'siriga asoslangan to'rtta tanlov variantining funksional tavsifi. Gorizontal x o'qida sub'ektga noma'lum bo'lgan ex-ante ehtimolliklari (kelib chiqish nuqtasidan uzoqlashganda kamayish tartibida) keltirilgan bo'lib, sub'ekt faqat vertikal y o'qida o'lchanadigan natijani kuzatadi. Qulaylik uchun yutuqlar yuqori o'ng kvadrantda, yo'qotishlar esa pastki chap kvadrantda paydo bo'ladi. Qavariq egri chiziqlar yashil, botiqlar esa qizil rangda. Mustahkam (Robust): qavariq yo'qotishlar va botiq yutuqlar (ikkala REE dan qochadi). Mo'rtlikka qarshi (Anti-fragile): qavariq yo'qotishlar va qavariq yutuqlar (\"Jekpotlar\"ga kirishni saqlab qolgan holda \"Qora oqqushlar\"dan qochadi). Mo'rt (Fragile): botiq yo'qotishlar va botiq yutuqlar (\"Qora oqqushlar\" ta'siri, \"Jekpotlar\"dan qochish). Zaif (Vulnerable): botiq yo'qotishlar va qavariq yutuqlar (ham \"Qora oqqushlar\", ham \"Jekpotlar\" ta'sirida). (d) Xulq-atvor sezuvchanligi metrikasi. Umumiy Sezuvchanlik (y o'qi) yutuq va yo'qotish domenlarida qavariq tanlovlarni jamlash orqali REE ning umumiy kiritilishini miqdoriy jihatdan aniqlaydi. Bir tomonlama Sezuvchanlik (x o'qi) REE qidirish va REE dan qochish o'rtasidagi assimetriyani o'lchaydi. Misol profillari quyidagilarni ko'rsatadi: mo'rtlikka qarshi o'xshash naqsh (yashil), mo'rt o'xshash naqsh (qizil) va kuchli \"Qora oqqush\" dan qochish va qisman \"Jekpot\" qidirishga ega aralash mo'rtlikka qarshi/mustahkam profil (ko'k). Hisoblash ta'riflari uchun \"Materiallar va usullar\" bo'limiga qarang.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;REE (Rare Extreme Events) — ehtimolligi past boʻlsa-da, vazifadagi umumiy mukofotlash tarixiga sezilarli taʼsir koʻrsatadigan yuqori amplitudali nodir hodisalar.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu parametrlar xulq-atvor maydonini shakllantiradi, unda hayvonlar ekstremal fenotiplar (masalan, faqat «anti-moʻrt» yoki «moʻrt» strategiyalar) atrofida guruhlanishi yoki aralash xulq-atvor modellarini namoyish etishi mumkin. Qutblar orasida joylashgan nuqtalar strategiyalar kombinatsiyasini, masalan, halokatlardan faol qochish va katta mukofotlarni tez-tez, lekin doimiy boʻlmagan tarzda izlashni anglatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;REE ga yuqori umumiy sezgirlik kutish vaqtini minimallashtirgan holda katta mukofotlarni maksimallashtiruvchi variantlarni tanlash bilan bogʻliq, past sezgirlik esa barqaror, ammo cheklangan natijalarni afzal koʻrishga mos keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Oddiy va nodir hodisalar ushbu vazifadagi tajribaning asosini tashkil etishiga qaramay, REE ning kiritilishi moslashuvchan landshaftni oʻzgartiradi: ekstremal natijalar, hatto past ehtimollikda ham, mukofotlash tarixida sezilarli siljishlarni keltirib chiqaradi. REE «ahamiyatli» boʻlgan kalamushlar (yuqori sezgirlik) potensial katta yutuqlarga ega variantlarni afzal koʻradilar. Aksincha, REE ni eʼtiborsiz qoldiradigan hayvonlar (past sezgirlik) birinchi tartibli stoxastik dominantlikka mos keladigan, bashorat qilinadigan, ammo oʻrtacha natijalarni taʼminlaydigan botiq variantlarni tanlaydilar. Ushbu model alohida individlar nodir, ammo muhim hodisalarni qaror qabul qilish strategiyasiga qanday integratsiya qilishini miqdoriy baholash imkonini beradi, bu esa ushbu fenotiplarning neyron jarayonlar bilan bogʻliqligini tahlil qilish uchun asos yaratadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kalamushlarda oʻtkazilgan; ushbu qaror qabul qilish strategiyalarini insonning neyrobiologik mexanizmlariga koʻchirish qoʻshimcha dalillarni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"asosiy-fenotip-ekstremal-jazolardan-kuchli-qochish-va-ekstremal-mukofotlarni-qisman-tanlash\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#asosiy-fenotip-ekstremal-jazolardan-kuchli-qochish-va-ekstremal-mukofotlarni-qisman-tanlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiy fenotip: ekstremal jazolardan kuchli qochish va ekstremal mukofotlarni qisman tanlash&lt;/span&gt;&lt;/a&gt;Asosiy fenotip: ekstremal jazolardan kuchli qochish va ekstremal mukofotlarni qisman tanlash&lt;/h4&gt;\n&lt;p&gt;Biz 20 ta kalamush ishtirokida 41 kunlik sessiya davomida to‘plangan xulq-atvor ma’lumotlarini tahlil qildik. Hayvonlar tomonidan qo‘llanilgan asosiy strategiyalarni aniqlash uchun Rasm 2-da har bir kalamushning tanlovlari ikki o‘lchovli fazoda tasvirlangan. Bu fazo REE (kamyob va ekstremal hodisalar) ga nisbatan umumiy sezgirlik va bir tomonlama sezgirlik (ekstremal yo‘qotishlarning ekstremal mukofotlarga nisbatan og‘irligi) bilan belgilanadi. Bu tasvir Rasm 1d-dagi aylantirilgan kvadratga mos keladi, bunda har bir cho‘qqi to‘rtta natija taqsimotidan faqat bittasini tanlashni anglatadi. Rasm 2-ni ko‘zdan kechirish shuni ko‘rsatadiki, hech bir hayvon faqat bitta cho‘qqi bilan cheklanib qolmaydi — barcha kalamushlar bir nechta variantdan foydalanadi. Bu xilma-xillik hayvonlarning ozuqa izlashdagi tabiiy strategiyalariga mos keladi, bunda ular noaniqlik yoki ekstremal hodisalardan himoyalanishga harakat qilishadi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f2.jpg\" alt=\"2-rasm: Nodir va O'ta Hodisalarga (REE) umumiy sezuvchanlik (y o'qi) REE ga nisbatan bir tomonlama sezuvchanlikka (x o'q\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: Nodir va O'ta Hodisalarga (REE) umumiy sezuvchanlik (y o'qi) REE ga nisbatan bir tomonlama sezuvchanlikka (x o'qi) nisbatan chizilgan bo'lib, bunda o'ngga harakat REE qidirishni, chapga harakat esa REE dan qochishni bildiradi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm: Nodir va O'ta Hodisalarga (REE) umumiy sezuvchanlik (y o'qi) REE ga nisbatan bir tomonlama sezuvchanlikka (x o'qi) nisbatan chizilgan bo'lib, bunda o'ngga harakat REE qidirishni, chapga harakat esa REE dan qochishni bildiradi. Ishlatilgan modellashtirish va statistik tahlil usullarining batafsil tavsifi uchun \"Materiallar va usullar\" bo'limiga qarang. (a) 820 ta qora nuqta jami 20 ta sichan bilan o'tkazilgan 41 seansdan olingan ma'lumotlarni ifodalaydi. (b) Har bir kvadrat bitta sichanga mos keladigan individual sichan profillari. Har bir kvadrat ichidagi rangli nuqtalar har bir sichan uchun 41 seans davomidagi natijalarni bildiradi, ular ikkita asosiy sezuvchanlik profiliga bo'lingan: ko'k nuqtalar REE ga yuqori sezuvchanlik ko'rsatadigan va \"Qora oqqushni chetlab o'tuvchilar\" sifatida tasniflangan sichanlarni ko'rsatadi, yashil nuqtalar esa REE ga javob beradigan, lekin grafikning o'rta chizig'iga yaqin joylashgan neytral pozitsiyani saqlaydigan sichanlarni bildiradi. Bundan tashqari, ikkita chiqarib tashlangan ma'lumotlar nuqtasi qizil va pushti ranglarda ta'kidlangan. (c) Har bir sichan uchun barcha 41 seansdagi o'rtacha sezuvchanlik o'lchovlarini ifodalovchi rangli nuqtalar (n = 20 sichan).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;20 ta kalamushning hech biri faqat bitta variantga bog‘lanib qolmagan; barcha hayvonlar ekstremal xavflardan qochib, taqsimlangan xulq-atvor profillarini namoyon etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;REE (Rare and Extreme Events) — kamyob va ekstremal hodisalar bo‘lib, bu kontekstda katta yutuq yoki katta yo‘qotishga olib kelishi mumkin bo‘lgan yuqori o‘zgaruvchanlikka ega natijalarni anglatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kalamushlarda o‘tkazilgan; bu qaror qabul qilish namunalarini odamlarga ko‘chirish qo‘shimcha dalillarni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"populyatsiya-darajasidagi-qonuniyatlar\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#populyatsiya-darajasidagi-qonuniyatlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Populyatsiya darajasidagi qonuniyatlar&lt;/span&gt;&lt;/a&gt;Populyatsiya darajasidagi qonuniyatlar&lt;/h4&gt;\n&lt;p&gt;2a-rasmda to‘liq ma’lumotlar to‘plami (taxminan 800 ta sessiya nuqtasi) ko‘rsatilgan. Sessiyalarning aksariyati xulq-atvor fazosining chap yarmida joylashgan bo‘lib, bu REE-dan qochish strategiyasiga mos keladi. Ushbu soha ichida sessiyalarning ko‘p qismi yuqori kvadrantga to‘g‘ri keladi, bu esa o‘rtacha va yuqori umumiy sezgirlikni anglatadi — kalamushlar ekstremal yo‘qotishlar (qora qushlar) ta’sirini minimallashtirish orqali o‘z tanlovlarini tizimli ravishda moslashtirgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;800 ta sessiyaning aksariyati ekstremal yo‘qotishlardan qochish strategiyasini namoyon etadi, shu bilan birga kamyob hodisalarga nisbatan yuqori sezgirlik saqlanib qoladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"individual-xulq-atvor-profillari\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#individual-xulq-atvor-profillari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Individual xulq-atvor profillari&lt;/span&gt;&lt;/a&gt;Individual xulq-atvor profillari&lt;/h4&gt;\n&lt;p&gt;2b-rasmda 20 ta kalamushning 41 ta sessiya davomidagi strategiyalari koʻrsatilgan. Har bir nuqta bitta jonivorga toʻgʻri keladi, kvadratning uchlari esa natijalar taqsimoti turlarini ifodalaydi: antifragil (A), mustahkam (R), zaif (V) va moʻrt (F). 17-raqamli kalamushdan (qizil rang) tashqari, barcha jonivorlar oʻrtacha yoki yuqori umumiy sezgirlikni (Total Sensitivity) namoyon etadi. Bu guruh ichida ikkita kichik guruh (koʻk va yashil) ajralib turadi. 19-raqamli kalamush (binafsha rang) yagona istisno boʻlib, u yuqori umumiy sezgirlikni «jekpot» izlash (Jackpot Seeking) bilan birlashtiradi.&lt;/p&gt;\n&lt;p&gt;Qolgan 18 ta jonivor ikkita barqaror fenotipga boʻlinadi:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Koʻk guruh (13 ta kalamush): bu jonivorlar asosan mustahkam va antifragil variantlar oʻrtasida tebranadi. Bu fenotip oʻrtacha-yuqori umumiy sezgirlik va «qora qushlar»dan (Black Swans) qochish bilan ajralib turadi.&lt;/li&gt;\n&lt;li&gt;Yashil guruh (5 ta kalamush): bu kalamushlar moʻrt va antifragil variantlarni almashtirib turadi. Ular oʻrtacha-yuqori umumiy sezgirlikka ega, ammo bir tomonlama sezgirlikda (One-sided Sensitivity) aniq yoʻnalishga ega emas, bu ularning yutuq va yoʻqotish sohalarida ekstremal hodisalarga nisbatan simmetrik munosabatda ekanligini bildiradi.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kalamushlarning aksariyati (20 tadan 18 tasi) barqaror strategiyalarga ega: koʻk guruh ekstremal yoʻqotishlardan qochadi, yashil guruh esa simmetrik xulq-atvorni namoyon etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ortacha-fenotiplar\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#ortacha-fenotiplar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Oʻrtacha fenotiplar&lt;/span&gt;&lt;/a&gt;Oʻrtacha fenotiplar&lt;/h4&gt;\n&lt;p&gt;2c-rasmda har bir kalamushning oʻrtacha koʻrsatkichlari jamlangan. 20 ta kalamushdan 19 tasida umumiy sezgirlik maksimal qiymatning yarmidan yuqori. 17-raqamli kalamush taxminan 0,5 koʻrsatkichga ega boʻlib, u moʻrt xulq-atvorga yaqin, ammo toʻliq emas. Koʻpchilik jonivorlar «qora qushlar»dan qochishni (manfiy bir tomonlama sezgirlik) namoyon etadi. 17 va 19-raqamli kalamushlar qarama-qarshi ekstremal holatlardir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot 20 ta jonivorda oʻtkazilgan; aniqlangan fenotiplar qaror qabul qilishning muayyan eksperimental modeli doirasidagi individual farqlarni tavsiflaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"umumiy-va-bir-tomonlama-sezgirlik-ortasidagi-bogliqlik-tuzilmasi\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#umumiy-va-bir-tomonlama-sezgirlik-ortasidagi-bogliqlik-tuzilmasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy va bir tomonlama sezgirlik oʻrtasidagi bogʻliqlik tuzilmasi&lt;/span&gt;&lt;/a&gt;Umumiy va bir tomonlama sezgirlik oʻrtasidagi bogʻliqlik tuzilmasi&lt;/h4&gt;\n&lt;p&gt;2c-rasmda eng yuqori umumiy sezgirlikka ega 16 ta kalamushda umumiy va bir tomonlama sezgirlik oʻrtasidagi ijobiy bogʻliqlik koʻrinadi. Bu jonivorlarda kamyob ekstremal hodisalarni (REE) hisobga olish «qora qushlar»dan qochishning kamayishi bilan korrelyatsiya qiladi. Bu yutuqlar sohasidagi foydalilik funksiyasining qavariqligiga siljishni aks ettiradi.&lt;/p&gt;\n&lt;p&gt;Statistik jihatdan, butun tanlov (n=20) uchun umumiy va bir tomonlama sezgirlik oʻrtasidagi korrelyatsiya nolga yaqin. Biroq, 16 ta eng sezgir kalamush uchun korrelyatsiya koeffitsiyenti ≈ 0,57 ni tashkil qiladi. 41 ta sessiyani 10 ta bosqichdan iborat toʻrtta blokga boʻlganda, korrelyatsiya boshida ≈ 0,17 dan keyingi bloklarda ≈ 0,56, ≈ 0,71 va ≈ 0,64 gacha oʻsadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Korrelyatsiya — ikki kattalik oʻrtasidagi bogʻliqlikning statistik oʻlchovi; 0,57 qiymati oʻrtacha ijobiy bogʻliqlikni bildiradi, bu jonivorlar oʻrganishi bilan kuchayib boradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"mukofot-izlash-va-jazodan-qochishning-xulq-atvor-korsatkichlari\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#mukofot-izlash-va-jazodan-qochishning-xulq-atvor-korsatkichlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mukofot izlash va jazodan qochishning xulq-atvor koʻrsatkichlari&lt;/span&gt;&lt;/a&gt;Mukofot izlash va jazodan qochishning xulq-atvor koʻrsatkichlari&lt;/h4&gt;\n&lt;p&gt;3-rasmda xulq-atvorning intuitiv metrikalari: «qora qushlar» (salbiy hodisalar)dan qochish va «jekpotlar» (katta mukofotlar)ni izlashga qaratilgan tanlovlar ulushi keltirilgan. Median qiymatlar ikki fenotip oʻrtasidagi keskin farqni koʻrsatadi. «Koʻk» kalamushlarning taxminan yarmi ekstremal jazolardan &amp;gt; 90% urinishlarda qochadi, «yashil» kalamushlarning esa atigi ≈40%i shunday natijaga erishadi, autsayderlar orasida esa bunday koʻrsatkich kuzatilmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Koʻk» kalamushlar jazodan qochish strategiyasini afzal koʻradi, «yashil» kalamushlar esa neytralroq xulq-atvorni namoyon etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Vilkokson ranglar yigʻindisi testi yordamida oʻtkazilgan tahlil guruhlar oʻrtasidagi sezilarli farqlarni tasdiqlaydi (p &amp;lt; 0,01). Biroq, «jekpot» izlash koʻrsatkichlari boʻyicha «koʻk» va «yashil» kalamushlar oʻrtasida statistik farq yoʻq. Vilkoksonning juftlik testlari shuni koʻrsatadiki, «koʻk» kalamushlarda jazodan qochish va mukofot izlash oʻrtasida sezilarli farq mavjud (p = 0,0002), «yashil» kalamushlarda esa bu farq kuzatilmaydi (p = 0,6250).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Vilkokson ranglar yigʻindisi testi — maʼlumotlar normal taqsimlanmagan hollarda ikki mustaqil guruhni solishtirish uchun ishlatiladigan noparametrik statistik usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ikki autsayder kalamush qarama-qarshi strategiyalarni namoyon etadi: 17-kalamush maksimal darajada «jekpot» olishga intiladi, 19-kalamush esa uni deyarli butunlay istisno qiladi. Aniq qiymatlar qoʻshimcha materiallarda keltirilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot hayvonlarda oʻtkazilgan; xulq-atvor modellarini odamlarga koʻchirishda ehtiyotkorlik talab etiladi, chunki qaror qabul qilish mexanizmlari turlicha boʻlishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"qora-oqqush-hodisalari-kamyob-va-ekstremal-voqealarga-nisbatan-sezgirlikni-kuchaytiradi,-jekpot-esa-yoq\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#qora-oqqush-hodisalari-kamyob-va-ekstremal-voqealarga-nisbatan-sezgirlikni-kuchaytiradi,-jekpot-esa-yoq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;«Qora oqqush» hodisalari kamyob va ekstremal voqealarga nisbatan sezgirlikni kuchaytiradi, «Jekpot» esa yoʻq&lt;/span&gt;&lt;/a&gt;«Qora oqqush» hodisalari kamyob va ekstremal voqealarga nisbatan sezgirlikni kuchaytiradi, «Jekpot» esa yoʻq&lt;/h4&gt;\n&lt;p&gt;20 ta kalamushdan 19 tasi kamyob va ekstremal voqealarga (REE) nisbatan oʻrtacha yoki yuqori sezgirlik koʻrsatishi hamda ekstremal jazolardan («qora oqqushlar») qochishi aniqlangach, tadqiqotchilar REE bilan toʻqnashuv tajribasi xulq-atvorga qanday taʼsir qilishini oʻrganishdi. Buning uchun REE sodir boʻlishidan oldingi va keyingi 10 ta urinishdagi (nose-pokes) xulq-atvor sezgirligi solishtirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Qora oqqush» (kamyob jazo) bilan toʻqnashuv REEga nisbatan sezgirlikni tizimli ravishda oshiradi, «Jekpot» (kamyob mukofot) esa xulq-atvorga deyarli taʼsir qilmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;4-rasmda har bir kalamush uchun sessiya davomidagi dinamika keltirilgan. (a) panelda «jekpot», (b) panelda esa «qora oqqush» taʼsiri aks etgan. Umumiy sezgirlik va bir tomonlama sezgirlik (ekstremal yoʻqotishlarning yutuqlarga nisbatan ogʻirligi) grafiklarda koʻrsatilgan, bunda nuqtali diagonal oʻzgarish yoʻqligini bildiradi. Natijalar aniq assimetriyani koʻrsatadi: «jekpot»dan soʻng koʻpchilik nuqtalar diagonalga yaqin joylashadi, bu xulq-atvordagi minimal oʻzgarishlarni anglatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Qora oqqush» — oʻta salbiy oqibatli kamyob hodisa, «Jekpot» esa oʻta ijobiy oqibatli kamyob hodisadir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;«Qora oqqush»dan soʻng esa kalamushlarning xulq-atvori tizimli ravishda oʻzgaradi. Koʻpchilik hayvonlarda umumiy sezgirlikning ortishi (kamyob voqealar tuzilishiga nisbatan yuqori reaksiya) va bir tomonlama sezgirlikning pasayishi kuzatiladi, bu ekstremal yoʻqotishlardan qochish strategiyasi kuchayganini bildiradi. Grafiklardagi nuqtalar 45° chiziqdan chetga chiqishi shuni tasdiqlaydiki, aynan jazo, mukofot emas, REEga nisbatan sezgirlikni keskin kuchaytiradi. Statistik testlar (3-jadval) bilan tasdiqlangan ushbu xulosalar salbiy kamyob hodisalar hayvonlarning tanlov strategiyasini yangilashga nomutanosib darajada kuchli taʼsir qilishini koʻrsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kalamushlar modelida oʻtkazilgan; xulq-atvor qonuniyatlari odamlardagi kognitiv jarayonlarni toʻliq aks ettirmasligi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sessiya-ichidagi-tahlil\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#sessiya-ichidagi-tahlil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sessiya ichidagi tahlil&lt;/span&gt;&lt;/a&gt;Sessiya ichidagi tahlil&lt;/h4&gt;\n&lt;p&gt;Sessiya doirasidagi tahlillar qaror qabul qilishda valentlikning yaqqol assimetriyasini koʻrsatadi. «Qora qush» (Black Swan) tipidagi hodisalar (kam uchraydigan salbiy natijalar) kutilayotgan qiymatga (REE) nisbatan global sezgirlikni vaqtincha oshiradi va kam uchraydigan yoʻqotishlardan qochish moyilligini kuchaytiradi. Shu bilan birga, «Jekpot» tipidagi hodisalar (kam uchraydigan ijobiy natijalar) ishtirokchilarning xulq-atvor sezgirligida sezilarli oʻzgarishlarga olib kelmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kam uchraydigan salbiy hodisalar («Qora qushlar») hushyorlikni va yoʻqotishlarga nisbatan sezgirlikni vaqtincha oshiradi, kam uchraydigan yutuqlar esa qaror qabul qilish strategiyasiga oʻlchanadigan taʼsir koʻrsatmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Olingan natijalar shuni koʻrsatadiki, kam uchraydigan aversiv (salbiy) natijalar ushbu vazifada kognitiv jarayonlarga ustuvor taʼsir koʻrsatadi. Bu ekstremal salbiy hodisalarga nisbatan yuqori hushyorlikning dominant fenotipini tasdiqlaydi, bu esa xavflarni minimallashtirishning evolyutsion strategiyasi boʻlishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ushbu xulosalar aniq eksperimental vazifa doirasi bilan cheklangan; bu mexanizmlarni murakkab hayotiy vaziyatlarga tatbiq etish qoʻshimcha tadqiqotlarni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"q-learning-modellari-kalamushlar-xulq-atvorini-taqlid-qilish-uchun-maxsus-ree-qaror-vaznlarini-talab-qiladi\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#q-learning-modellari-kalamushlar-xulq-atvorini-taqlid-qilish-uchun-maxsus-ree-qaror-vaznlarini-talab-qiladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q-Learning modellari kalamushlar xulq-atvorini taqlid qilish uchun maxsus REE qaror vaznlarini talab qiladi&lt;/span&gt;&lt;/a&gt;Q-Learning modellari kalamushlar xulq-atvorini taqlid qilish uchun maxsus REE qaror vaznlarini talab qiladi&lt;/h4&gt;\n&lt;p&gt;Mualliflar mustahkamlash orqali o‘rganish (Reinforcement Learning) modellarining yangi sinfini taqdim etdilar, u «Qora oqqushlar» (kamyob salbiy hodisalar) va «Jekpotlar» (kamyob ijobiy hodisalar) ga sezgirlikni hisobga oladi. Modellarning parametrlari har bir kalamush uchun kuzatilgan tanlovlar va natijalar asosida baholandi. Taklif etilgan yondashuvning asosiy xususiyati qaror qabul qilish jarayonida oddiy va ekstremal natijalarni turli vazn koeffitsiyentlari orqali ajratishdan iborat. REE (Rare and Extreme Events) hisobga olinmagan standart Q-learning modeli ko‘pchilik tajriba hayvonlari uchun rad etiladi, taklif etilgan model esa kuzatilgan xulq-atvorga yaxshi mos keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Q-learning — bu agent tajriba asosida har bir harakatning qiymatini yangilab, umumiy mukofotni maksimallashtiradigan harakatlarni tanlashni o‘rganadigan mashinali o‘rganish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;To‘rtta tanlov variantining har biri uchun (1 dan 4 gacha indekslangan: Antifragile, Fragile, Robust, Vulnerable) t vaqt momentida yutuq Q_g(o) va yo‘qotish Q_l(o) sub-qiymatlari kiritiladi. Ushbu qiymatlarni yangilash α_g va α_l o‘rganish tezligi parametrlari yordamida amalga oshiriladi. Agar o‘rganish tezligi 0 ga teng bo‘lsa, sub-qiymatlar yangilanmaydi; agar 1 bo‘lsa, ular olingan mukofotni to‘liq aks ettiradi. Joriy vaqtda tanlanmagan variantlar uchun 0 dan 1 gacha o‘zgaradigan unutish parametrlari αfg va αfl yordamida shunga o‘xshash yangilash qoidalari qo‘llaniladi.&lt;/p&gt;\n&lt;p&gt;Modelning yangiligi REE bilan bog‘liq variantlar uchun maxsus vaznlarni qo‘shishdan iborat. Variantning umumiy qiymati V_o yutuq va yo‘qotish sub-qiymatlarining (λ_g va λ_l koeffitsiyentlari bilan) yig‘indisi hamda REE uchun javobgar bo‘lgan qo‘shimcha had sifatida hisoblanadi. Bu had «Jekpotlar» (1JP(o) — A va V variantlari uchun) va «Qora oqqushlar» (1BS(o) — F va V variantlari uchun) uchun indikator funksiyalarni hisobga oladi. γ_g va γ_l parametrlari tanlov jarayonida ushbu kamyob hodisalarga beriladigan vaznni aks ettiradi. Harakatlar ehtimolligi Softmax funksiyasi orqali aniqlanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sakkizta parametrli, shu jumladan maxsus γ_g va γ_l vaznlariga ega model kalamushlar xulq-atvorini standart algoritmlarga qaraganda yaxshiroq tavsiflaydi, bu hayvonlar kamyob ekstremal hodisalarni o‘rtacha kutilayotgan mukofotlardan alohida qayta ishlashini ko‘rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kalamushlar xulq-atvorini modellashtirishga asoslangan; qaror qabul qilish mexanizmlarini odamlarga ekstrapolyatsiya qilish qo‘shimcha tekshiruvlarni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"modellarni-taqqoslash-va-fenotipik-farqlar\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#modellarni-taqqoslash-va-fenotipik-farqlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Modellarni taqqoslash va fenotipik farqlar&lt;/span&gt;&lt;/a&gt;Modellarni taqqoslash va fenotipik farqlar&lt;/h4&gt;\n&lt;p&gt;Axborot mezonlari yordamida modellarni taqqoslash (1-jadval) shuni ko‘rsatadiki, 20 ta hayvondan 17 tasi qaror qabul qilishda kamyob ekstremal hodisalarni (REE) baholash uchun maxsus vaznlardan foydalanadi. Atigi uchta hayvon uchun REE-ni alohida omil sifatida hisobga olmaydigan modellar eng mos keldi. Ko‘pchilik kalamushlar (shu jumladan 8 ta «ko‘k», 4 ta «yashil», shuningdek «qizil» va «pushti» shaxslar) tanlovni shakllantirish uchun γ_g (yutuq) va/yoki γ_l (yutqazish) parametrlariga tayanadi. «Ko‘k» kalamushlarning ozchilik qismi REE-ni ham qaror vaznlari, ham sub-qiymatlarga qo‘shiladigan hissa orqali integratsiya qiladi. O‘rganish va unutish tezligi hayvonlarni model sinflariga tizimli ravishda ajratishga imkon bermadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;20 ta kalamushdan 17 tasi qaror qabul qilishda kamyob ekstremal hodisalarni (REE) hisobga olish uchun maxsus vaznlardan foydalanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;5-rasmda empirik ma’lumotlar bilan solishtirilgan holda bashorat qilingan (pastki chap) va simulyatsiya qilingan (pastki o‘ng) sezgirlik ko‘rsatkichlari keltirilgan (yuqorida; 2-rasm bilan bir xil). Har bir kalamushning individual parametrlari va haqiqiy mukofot ketma-ketligi asosida hisoblangan bashorat qilingan qiymatlar empirik sezgirlik naqshlarini aniq takrorlaydi. 41 ta sessiya uchun «ko‘k» va «yashil» fenotiplarning median parametrlari yordamida o‘tkazilgan simulyatsiyalar xulq-atvor naqshlarining barqarorligini tasdiqlaydi. Shu bilan birga, «yashil» kalamushlar vertikal sezgirlik o‘qi (One-Sided Sensitivity) bo‘yicha ikkita barqaror kichik guruhga bo‘linishga moyil.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Simulyatsiya — bu modelning bashorat qilish qobiliyatini baholash uchun uni sun’iy ma’lumotlar ustida ishlatish orqali tekshirish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"model-parametrlari-va-qora-qushlarga-munosabat\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#model-parametrlari-va-qora-qushlarga-munosabat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Model parametrlari va «Qora qushlar»ga munosabat&lt;/span&gt;&lt;/a&gt;Model parametrlari va «Qora qushlar»ga munosabat&lt;/h4&gt;\n&lt;p&gt;Har bir kalamush uchun parametrlar bahosi 6-rasmda keltirilgan. Fenotiplar o‘rtasidagi asosiy farq REE-ga xos qaror vaznlarida namoyon bo‘ladi: «ko‘k» kalamushlar «Qora qush» (Black Swan) tipidagi hodisalarga nisbatan kuchli selektiv sezgirlikni ko‘rsatadi, bu γ_l ning sezilarli darajada manfiy qiymatlari bilan ifodalanadi (p = 0,0102). Bu bunday hodisalar xavfi bilan bog‘liq variantlar (F va V variantlari) uchun kuchli hisoblash jarimasi mavjudligini ko‘rsatadi, bu ularning kuzatilgan qochish xulq-atvoriga mos keladi. Aksincha, «yashil» kalamushlar bunday selektiv aversiv baholashni ko‘rsatmaydi va odatda F va A variantlarini birlashtiradi, bu ularning REE-ga nisbatan kamroq selektiv yondashuvidan dalolat beradi. «Oldin/keyin» tahlili (4-rasm) shuni ko‘rsatadiki, «Qora qushlar»ga nisbatan xulq-atvor reaksiyasi mahalliy darajada kichik bo‘lib, bu effektlarni ko‘pchilik hayvonlarda ushbu model sinfi uchun aniqlash qiyinligini anglatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kalamushlarda o‘tkazilgan; qaror qabul qilishning ushbu mexanizmlarini odamga ko‘chirish qo‘shimcha dalillarni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"q-organish-modeli-parametrlari\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#q-organish-modeli-parametrlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q-oʻrganish modeli parametrlari&lt;/span&gt;&lt;/a&gt;Q-oʻrganish modeli parametrlari&lt;/h4&gt;\n&lt;p&gt;Tadqiqotchilar 41 ta sessiya davomida har bir kalamush uchun Q-oʻrganish (Q-Learning) modeli parametrlarini baholadilar. Tahlil yutuq va yoʻqotishlarning oʻrtacha qiymatlari hamda kutilayotgan mukofotni baholash (REE) uchun qaror qabul qilish ogʻirliklarini oʻz ichiga oldi. Bundan tashqari, yutuq va yoʻqotishlar uchun oʻrganish va unutish tezligi koʻrsatkichlari hisoblab chiqildi. «Pushti» va «qizil» kalamushlar uchun individual parametrlar nuqtalar bilan, «koʻk» va «yashil» guruhlar uchun esa medianani, kvartillararo masofani hamda 10- va 90-persentillarni koʻrsatuvchi quti diagrammalari (box plots) koʻrinishida tasvirlangan (Rasm 6).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f6.jpg\" alt=\"6-rasm: Har bir sichan uchun 41 seans davomida baholangan tanlangan Q-Learning modelining parametrlari — chap panel: yut\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm: Har bir sichan uchun 41 seans davomida baholangan tanlangan Q-Learning modelining parametrlari — chap panel: yutuqlar va yo'qotishlarning o'rtachalari va REE uchun qaror og'irliklari; o'ng panel: yutuqlar va yo'qotishlar uchun o'rganish va unutish…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;6-rasm: Har bir sichan uchun 41 seans davomida baholangan tanlangan Q-Learning modelining parametrlari — chap panel: yutuqlar va yo'qotishlarning o'rtachalari va REE uchun qaror og'irliklari; o'ng panel: yutuqlar va yo'qotishlar uchun o'rganish va unutish tezliklari; pushti va qizil sichanlar uchun individual parametrlar nuqtalar sifatida ko'rsatilgan bo'lsa, ko'k va yashil sichanlar uchun parametrlar 10 va 90-persentellar, interkvartil oralig'i va mediana bilan quti diagrammalari sifatida ko'rsatilgan; fenotiplar o'rtasidagi taqqoslashlar Wilcoxon Rank Sum testlari yordamida amalga oshirilgan (⋆ p &amp;lt; 0.05 degan ma'noni anglatadi) - tafsilotlar uchun \"Materiallar va usullar\" qismidagi \"Kengaytirilgan Q-Learning modelini baholash va simulyatsiya qilish\" kichik bo'limiga qarang. Har bir sichan uchun baholangan parametrlar 6-rasmda ko'rsatilgan. REE ga xos qaror og'irliklariga e'tibor qaratganda fenotiplar o'rtasidagi yaqqol farq namoyon bo'ladi: ko'k sichanlar sezilarli darajada salbiy γl qiymatlari (p = 0.0102) sifatida ifodalangan \"Qora oqqush\" ga kuchli selektiv sezuvchanlikni ko'rsatadi. Bu hayvonni \"Qora oqqushlar\" ta'siriga duchor qiladigan variantlarga (F va V variantlari) tayinlangan ishonchli hisoblash jarimasini ko'rsatadi, bu ularning ushbu natijalardan qochish bo'yicha kuzatilgan xulq-atvoriga mos keladi. Aksincha, yashil sichanlar bu selektiv yoqimsiz og'irlikni ko'rsatmaydi va odatda F va A variantlarini birlashtiradi, bu REE ga kamroq selektiv munosabatda bo'lishni taklif qiladi. 4-rasmda tasvirlangan oldingi/keyingi tahlil shuni ko'rsatadiki, \"Qora oqqushlar\"ga xulq-atvor javobi umumiy va bir tomonlama sezuvchanlik nuqtai nazaridan mahalliy darajada kichikdir. Bu shuni ko'rsatadiki, bunday effektlar ko'pchilik sichanlar uchun ushbu turdagi modellar tomonidan qamrab olinish uchun juda kichik bo'lishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Q-oʻrganish modeli qaror qabul qilish strategiyalarini miqdoriy baholash imkonini berdi va kalamushlarning turli fenotiplari oʻrtasida oʻrganish tezligi hamda yutuq/yoʻqotish ogʻirliklaridagi farqlarni aniqladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Fenotiplar oʻrtasidagi parametrlarni solishtirish uchun Uilkoxonning ranglar yigʻindisi testi (Wilcoxon Rank Sum test) qoʻllanildi. Statistik jihatdan ahamiyatli farqlar (p &amp;lt; 0,05) grafiklarda «*» belgisi bilan koʻrsatilgan. Parametrlarni baholash va model simulyatsiyasi tartibi boʻyicha batafsil maʼlumot «Kengaytirilgan Q-oʻrganish modelini baholash va simulyatsiya qilish» boʻlimida keltirilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Q-oʻrganish (Q-Learning) — bu oʻtmishdagi tajriba va toʻplangan «ballar» (Q-qiymatlari) asosida qaysi harakat eng katta foyda keltirishini bashorat qilishga yordam beradigan mustahkamlovchi oʻrganish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Maʼlumotlar kalamushlar (Rattus norvegicus) modelida olingan; natijalar hayvonlarning eksperimental sharoitdagi xulq-atvoriga xos boʻlib, ularni toʻgʻridan-toʻgʻri odamlarning qaror qabul qilish mexanizmlariga tatbiq etib boʻlmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;h4 id=\"nodir-ekstremal-yoqotishlar-va-yutuqlarga-nisbatan-assimetrik-xulq-atvor-reaksiyalari\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#nodir-ekstremal-yoqotishlar-va-yutuqlarga-nisbatan-assimetrik-xulq-atvor-reaksiyalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nodir ekstremal yoʻqotishlar va yutuqlarga nisbatan assimetrik xulq-atvor reaksiyalari&lt;/span&gt;&lt;/a&gt;Nodir ekstremal yoʻqotishlar va yutuqlarga nisbatan assimetrik xulq-atvor reaksiyalari&lt;/h4&gt;\n&lt;p&gt;Tadqiqot shuni koʻrsatdiki, tanlamadagi barcha kalamushlar nodir ekstremal hodisalarga (REE) nisbatan sezgirlik koʻrsatadi, aksariyat hayvonlarda bu oʻrtacha yoki yuqori darajada. Asosiy xulq-atvor fenotipi aniqlandi: «qora qushlar»dan (Black Swan) deyarli toʻliq qochish va «jekpot»ga (Jackpot) qisman intilish. Mualliflar buni salbiy va ijobiy REE oʻrtasidagi fundamental assimetriya deb talqin qiladi. Toʻyinganlik jekpotga toʻliq intilmaslikka sabab boʻlgan boʻlishi mumkinligini butunlay inkor etib boʻlmasa-da, hayvonlarning jekpot izlashni toʻxtatganligi tizimli ravishda kuzatilmadi. Nodir hodisalarni seansdagi 10- yoki 60-faollashuv bilan cheklash (Jadval S1) hayvonlarning buni oʻrganib qolganligi masalasini keltirib chiqaradi. Agar ular 10- va 60-faollashuvni oʻrgangan boʻlsalar, ularning strategiyasi kuzatilganidan koʻra optimallashtirilgan boʻlardi. Aslida, kalamushlar jekpot variantlarini faqat 10- va 60-tanlovda tanlamadilar, bu esa oddiy yodlash gipotezasiga zid keladi.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval S1.&lt;/strong&gt; Ketma-ketlikdagi REE o'rni&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;#&lt;/th&gt;\n&lt;th&gt;Jekpot&lt;/th&gt;\n&lt;th&gt;Qora oqqush&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kalamushlar assimetrik xulq-atvorni namoyon etadi: ular ekstremal yoʻqotishlardan deyarli toʻliq qochadi, lekin ekstremal yutuqlarga faqat qisman intiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Eksperimentda «qora qushlar»dan qochish tez-tez uchraydigan hodisalarda uzoqroq kechikishlarni qabul qilishni, jekpotga intilish esa tez-tez uchraydigan yirik yutuqlardan voz kechishni talab qiladi. Biroq, kalamushlar qavariq yoʻqotish jadvallarini tanlash orqali «qora qushlar»dan qochishni kafolatlashi mumkin, bu esa variantlarni jozibador qiladi. Aksincha, jekpotni hech qanday tanlov bilan kafolatlab boʻlmaydi, chunki u nodir tasodifiy hodisalarga bogʻliq. Masalan, seansda 150 ta tanlov amalga oshirilsa va REE ehtimoli 1% boʻlsa, Puasson taqsimotiga koʻra, kamida bitta jekpotni koʻrish ehtimoli ≈ 78% ni tashkil qiladi, bu esa uning sodir boʻlmasligi uchun sezilarli imkoniyat (22%) qoldiradi. Bu assimetriyani keltirib chiqaradi: ekstremal yoʻqotishlarning oldini olish mumkin, lekin ekstremal yutuqlarni kafolatlab boʻlmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Stoxastik ustunlik — bir tanlov varianti har qanday sharoitda boshqasidan matematik jihatdan foydaliroq boʻlgan holat.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kalamushlar «botiq» variantlar mahalliy darajada optimal ekanligi haqida doimiy dalillar oladi. «Fragile» varianti REE boʻlmaganda boshqa variantlardan ustunlik qiladi. «Anti-fragile» ikkala hodisa sodir boʻlganda yaxshiroq boʻlsa-da, «qora qushlar»dan toʻliq qochish deyarli kafolatlangan himoyani taʼminlaydi. Bu «Anti-fragile» va «Robust» variantlarini birlashtirgan strategiyalarni jozibador qiladi. Jekpotga toʻliq intilish kamroq foydali, chunki u natijani kafolatlamaydi va koʻp hollarda kichikroq yutuqlarni olish qiymati nodir hodisa sodir boʻlmaguncha oqlanmaydi. Shunday qilib, jekpotga qisman intilish muvozanatli strategiyadir. Natijalar shuni koʻrsatadiki, «koʻk» kalamushlar «Robust» va «Anti-fragile» variantlarini birlashtirib, ushbu xususiyatni oʻzlashtirgan, «yashil» kalamushlar esa boshqacha xulq-atvor koʻrsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kalamushlarda oʻtkazilgan; qaror qabul qilish namunalarini odamlarga koʻchirish kognitiv farqlar tufayli ehtiyotkorlikni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Jadval 2.&lt;/strong&gt; Qavariq va botiq ekspozitsiyalar uchun Jensen bo'shliqlarining statistik momentlari va parchalanishi&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Ko'rsatkich&lt;/th&gt;\n&lt;th&gt;Qavariq ekspozitsiya&lt;/th&gt;\n&lt;th&gt;Botiq ekspozitsiya&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;O'rtacha&lt;/td&gt;\n&lt;td&gt;3.89&lt;/td&gt;\n&lt;td&gt;3.11&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 3.&lt;/strong&gt; REE ga nisbatan umumiy sezgirlik va REE ga nisbatan bir tomonlama sezgirlik uchun oldin/keyin farqlari&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Sichqon&lt;/th&gt;\n&lt;th&gt;REE ga umumiy sezgirlik / jekpot&lt;/th&gt;\n&lt;th&gt;REE ga umumiy sezgirlik / qora oqqush&lt;/th&gt;\n&lt;th&gt;REE ga bir tomonlama sezgirlik / jekpot&lt;/th&gt;\n&lt;th&gt;REE ga bir tomonlama sezgirlik / qora oqqush&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;• 1&lt;/td&gt;\n&lt;td&gt;-0.062&lt;/td&gt;\n&lt;td&gt;-0.133&lt;/td&gt;\n&lt;td&gt;-0.046&lt;/td&gt;\n&lt;td&gt;-0.467&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Biz 20 ta kalamushning har biri uchun 41 ta seans bo'yicha o'rtacha hisobladik. Salbiy o'rtacha farqlar qizil rangda, ijobiy o'rtacha farqlar sariq rangda ta'kidlangan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval S2.&lt;/strong&gt; Xulq-atvor ketma-ketligi turlari&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Seans&lt;/th&gt;\n&lt;th&gt;Ketma-ketlik&lt;/th&gt;\n&lt;th&gt;Tur&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;5&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;S2 jadvali qirq sinov se t;td&gt;11.20&lt;/td&gt;\n&lt;td&gt;141.46&lt;/td&gt;\n&lt;td&gt;24328&lt;/td&gt;\n&lt;td&gt;8.91&lt;/td&gt;\n&lt;td&gt;31.58&lt;/td&gt;\n&lt;td&gt;23.73&lt;/td&gt;\n&lt;td&gt;962.88&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Har bir qator bitta ratni bildiradi va rang kodlari 2-rasmda ko'rsatilganidek, hayvonning profilini ko'rsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval S9.&lt;/strong&gt; BIC values for all augmented Q-Learning model with outcome range-adaptation, withselectedvaluehighlighted Model1 Model2 Model3 Model4&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-tTS9.jpg\" alt=\"Jadval S9\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval S10.&lt;/strong&gt; AIC values for all augmented Q-Learning model with outcome range-adaptation, withselectedvaluehighlighted Model1 Model2 Model3 Model4&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-tTS10.jpg\" alt=\"Jadval S10\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f4.jpg\" alt=\"4-rasm: 20 ta sichanning har biri uchun\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm: 20 ta sichanning har biri uchun&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-rasm: 20 ta sichanning har biri uchun (a) paneldagi \"Jekpotlar\"dan va (b) paneldagi \"Qora oqqushlar\"dan keyin, oxirgi 41 seans bo'yicha o'rtacha hisoblangan REE ga umumiy sezuvchanlik va REE ga bir tomonlama sezuvchanlikning javoblari. Har bir nuqta bitta sichanni bildiradi va nuqtalar 2-rasmdagidek hayvonning profilini ko'rsatish uchun ranglar bilan kodlangan. Qora nuqtali chiziqlar REE ta'siridan keyin ta'sir qilishdan oldingiga nisbatan sezuvchanlikda o'zgarish yo'qligini ko'rsatadi. Qora qattiq chiziqlar splayn taxminlarini bildiradi - \"Materiallar va usullar\"ga qarang.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f4-2.jpg\" alt=\"Rasm 4 (davomi 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 4 (davomi 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f5.jpg\" alt=\"5-rasm: REE ga umumiy sezuvchanlik (y o'qi) REE ga bir tomonlama sezuvchanlikka (x o'qi) qarshi — har bir sichan uchun 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm: REE ga umumiy sezuvchanlik (y o'qi) REE ga bir tomonlama sezuvchanlikka (x o'qi) qarshi — har bir sichan uchun 41 seans davomidagi o'rtacha ko'rsatkichlar; yuqori panel 2-rasmdagi o'ng panelni takrorlaydi: kuzatilgan sezuvchanliklar; pastki chap…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-rasm: REE ga umumiy sezuvchanlik (y o'qi) REE ga bir tomonlama sezuvchanlikka (x o'qi) qarshi — har bir sichan uchun 41 seans davomidagi o'rtacha ko'rsatkichlar; yuqori panel 2-rasmdagi o'ng panelni takrorlaydi: kuzatilgan sezuvchanliklar; pastki chap panel: tanlangan modellardan olingan prognoz qilingan sezuvchanliklar; pastki o'ng panel: sun'iy 41 seans davomida tanlangan modellar ishlashidan hisoblangan simulyatsiya qilingan sezuvchanliklar. 5-rasmda empirik kuzatilgan sezuvchanliklar bilan solishtirilgan prognoz qilingan sezuvchanliklar (pastki chapda) va simulyatsiya qilingan sezuvchanliklar (pastki o'ngda) ko'rsatilgan (yuqori qism; 2-rasmning o'ng paneliga o'xshash). Prognoz qilingan sezuvchanliklar - har bir sichanning taxminiy parametrlari va haqiqiy mukofot ketma-ketligi yordamida hisoblangan - empirik sezuvchanlik naqshlarini yaqindan takrorlaydi. Simulyatsiya qilingan sezuvchanliklar ko'k va yashil fenotiplar uchun median parametrlardan (va qizil va pushti sichanlar uchun individual parametrlardan) foydalangan holda har bir tanlangan modelni sun'iy 41 seansli ma'lumotlar to'plamlari orqali ishlatish orteqasida olingan. Ushbu simulyatsiyalar shuni ko'rsatadiki, tanlangan modellar ko'k, qizil va pushti hayvonlar uchun barqaror xulq-atvor fenotiplarini keltirib chiqaradi. Biroq, yashil sichanlar vertikal (Bir tomonlama sezuvchanlik) o'qi bo'ylab ikkita barqaror kenja guruhga bo'linishga moyildirlar.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f8.jpg\" alt=\"8-rasm: Yakuniy eksperimental sessiyalarda kuzatilgan tanlovlar вариацияси mashg'ulot sessiyalarida kuzatilganlarga nisb\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-rasm: Yakuniy eksperimental sessiyalarda kuzatilgan tanlovlar вариацияси mashg'ulot sessiyalarida kuzatilganlarga nisbatan («Materiallar va usullar» bo'limining «Eksperimental metod tafsilotlari» qismidagi 3-qadam)&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;8-rasm: Yakuniy eksperimental sessiyalarda kuzatilgan tanlovlar вариацияси mashg'ulot sessiyalarida kuzatilganlarga nisbatan («Materiallar va usullar» bo'limining «Eksperimental metod tafsilotlari» qismidagi 3-qadam); (a) panelda REE ga umumiy sezgirlik (y-o'qi) va REE ga bir tomonlama sezgirlik (x-o'qi) вариацияlari ko'rsatilgan, ya'ni to'q rang bilan belgilangan nuqtalar 20 ta ratning har biri uchun 40 ta sessiya davomidagi o'rtacha ko'rsatkichlarni takrorlaydi — 2-rasmdagi (c) panelga qarang — va chiziqlar orqali tegishli to'q rangli nuqtalar bilan bog'langan, och rangli nuqtalar bilan tasvirlangan o'sha rat uchun mashg'ulot sessiyalaridagi o'rtacha ko'rsatkichlar bilan juftlangan; (b) panelda umumiy variatsiya masofasi ko'rsatilgan, ya'ni yakuniy sessiyalardagi burun cho'qishlarini takrorlash uchun mashg'ulot sessiyalaridagi umumiy burun cho'qishlari ulushini o'zgartirish kerak. (a) REE ga umumiy sezgirlik va REE ga bir tomonlama sezgirlik&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-fS1.jpg\" alt=\"S1-rasm: 20 ta ratning har biri uchun qavariqlik mukofotlari (qator) — tafsilotlar uchun Ilovalarga qarang.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S1-rasm: 20 ta ratning har biri uchun qavariqlik mukofotlari (qator) — tafsilotlar uchun Ilovalarga qarang.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;S1-rasm: 20 ta ratning har biri uchun qavariqlik mukofotlari (qator) — tafsilotlar uchun Ilovalarga qarang. Har bir qator ratni bildiradi va rang kodi 2-rasmdagidek hayvonning profilini ko'rsatadi. O'ng tomonga qarab, nuqta har bir sinovda qavariq menyu tanlanganda olinishi kerak bo'lgan songa nisbatan qancha pelet olinganligini ko'rsatadi. Chap tomonga qarab, rangli nuqta har bir sinovda botiq menyu tanlanganda olinishi kerak bo'lgan songa nisbatan olingan umumiy jarima soniyalarini ko'rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-fS2.jpg\" alt=\"Rasm S2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S2&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fil i&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qidirish&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;AHAMIYATI&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;taqsimot&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;chetlarini&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;alohida qayta&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ishlash&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Preprint hali taqriz qilinmagan. Xulosalar dastlabki.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"manba\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#manba\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manba&lt;/span&gt;&lt;/a&gt;Manba&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Manba&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Kategoriya&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Preprint litsenziyasi&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;bioRxiv&lt;/td&gt;\n&lt;td&gt;animal behavior and cognition&lt;/td&gt;\n&lt;td&gt;все права у авторов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mualliflar
