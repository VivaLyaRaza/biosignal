        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Mutaxassislik&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/spec-brain.jpg\" alt=\"Miya va asab tizimi\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm: Ilya Repin, Public domain&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:I.P.Pavlov_by_Repin.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/spec-brain.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;неврология; нейронаука; поведение и познание животных&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/spec-brain.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Miya va asab tizimi — bu organizmni boshqarish, axborotni qayta ishlash va xulq-atvorni shakllantirishni ta'minlaydigan eng murakkab biologik apparatdir. \"BioSignal\" doirasida biz ushbu sohani neyrobiologiya, nevrologiya va kognitiv fanlar majmuasi sifatida ko'rib chiqamiz. Ushbu tizimni o'rganish hujayralardagi fizik jarayonlar qanday qilib fikrlar, xotiralar va atrof-muhitga bo'lgan munosabatlarga aylanishini tushunishga imkon beradi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/spec-brain.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Asab tizimi markaziy (bosh va orqa miya) va periferik bo'limlardan iborat. Uning ishlashining fundamental prinsipi neyronlar o'rtasida elektr va kimyoviy signallarni uzatishdir. Oliy asab faoliyati, klassik tasavvurlarga ko'ra, katta yarimsharlar po'stlog'i ishiga asoslanadi. Neyrofan bugungi kunda nafaqat anatomiya, balki molekulyar mexanizmlarni ham o'rganadi: oqsillar, RNK va miyaning immun hujayralari gomeostazni qanday qo'llab-quvvatlaydi va ularning disfunksiyasi qanday patologiyalarga olib keladi.&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-ishlaydi\"&gt;&lt;a href=\"concepts/spec-brain.html#bu-qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Bu qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Miya ko'p darajali tarmoq sifatida ishlaydi. Mikrodarajada neyronlar sinapslar orqali signallar almashadi. Mezodarajada xotiraning vizual detallari uchun javobgar bo'lgan medial temporal tarmoq kabi funksional tarmoqlar shakllanadi. Makrodarajada amigdala va prefrontal po'stloq kabi tuzilmalar hissiy reaksiyalarni tartibga soladi. Yordamchi hujayralar — glia muhim rol o'ynaydi, ular kasalliklarda \"yonib ketishi\" va neyronlarni toksik oqsillardan himoya qilish qobiliyatini yo'qotishi mumkin.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/spec-brain.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Zamonaviy tadqiqotlar yuqori texnologik yondashuvlarga tayanadi. Olimlar genetik kasalliklarni modellashtirish uchun bemorlarning o'zak hujayralaridan o'stirilgan \"mini-miya\" (organoidlar) dan foydalanadilar. Ma'lumotlarni tahlil qilish uchun neyronlar faoliyatidagi qonuniyatlarni aniqlashga yordam beradigan mashinali o'qitish algoritmlari qo'llaniladi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/spec-brain.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;Miya tuzilishini tushunish tibbiyot uchun juda muhim. \"Miya shaxsiy xotiralar kadrlarini qanday qayta tiklaydi\" maqolasida neyrotarmoqlar xotirani xaritalashga qanday yordam berishi ko'rsatilgan. \"Altsgeymer kasalligida miyaning immun hujayralari ichkaridan yonib ketadi\" tadqiqoti organizmning himoya tizimlari charchash mexanizmlarini ochib beradi. \"Gen terapiyasi sichqonlarda noyob sindrom rivojlanishini to'xtatdi\" ishi esa neyronlar ishiga aralashish potentsialini namoyish etadi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-qiyinchiliklar\"&gt;&lt;a href=\"concepts/spec-brain.html#cheklovlar-va-qiyinchiliklar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va qiyinchiliklar&lt;/span&gt;&lt;/a&gt;Cheklovlar va qiyinchiliklar&lt;/h2&gt;\n&lt;p&gt;Asosiy qiyinchilik miyaning ulkan plastikligidadir. Stress, genetik mutatsiyalar va yoshga bog'liq o'zgarishlar doimiy ravishda neyron aloqalarini qayta quradi. Bundan tashqari, afantaziya yoki yashirin halqali RNK shakllanishi kabi ko'plab jarayonlar biologiya, bioinformatika va psixologiya chorrahasida tahlilni talab qiladi.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Miya va asab tizimi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9E%D1%80%D1%82%D0%B0%D0%BB%D1%8B%D2%9B%20%D0%B6%D2%AF%D0%B9%D0%BA%D0%B5%20%D0%B6%D2%AF%D0%B9%D0%B5%D1%81%D1%96%5D%20--%3E%20B%5B%D0%9C%D0%B8%20%D0%B6%D3%99%D0%BD%D0%B5%20%D0%B6%D2%B1%D0%BB%D1%8B%D0%BD%5D%0A%20%20B%20--%3E%20C%5B%D0%9D%D0%B5%D0%B9%D1%80%D0%BE%D0%BD%D0%B4%D1%8B%D2%9B%20%D0%B6%D0%B5%D0%BB%D1%96%D0%BB%D0%B5%D1%80%5D%0A%20%20C%20--%3E%20D%5B%D0%A1%D0%B8%D0%BD%D0%B0%D0%BF%D1%81%D1%82%D1%8B%D2%9B%20%D0%B1%D0%B0%D0%B9%D0%BB%D0%B0%D0%BD%D1%8B%D1%81%D1%82%D0%B0%D1%80%5D%0A%20%20C%20--%3E%20E%5B%D0%A4%D1%83%D0%BD%D0%BA%D1%86%D0%B8%D0%BE%D0%BD%D0%B0%D0%BB%D0%B4%D1%8B%D2%9B%20%D0%B0%D0%B9%D0%BC%D0%B0%D2%9B%D1%82%D0%B0%D1%80%5D%0A%20%20E%20--%3E%20F%5B%D0%95%D1%81%D1%82%D0%B5%20%D1%81%D0%B0%D2%9B%D1%82%D0%B0%D1%83%20%D0%B6%D3%99%D0%BD%D0%B5%20%D1%8D%D0%BC%D0%BE%D1%86%D0%B8%D1%8F%D0%BB%D0%B0%D1%80%5D%0A%20%20E%20--%3E%20G%5B%D2%9A%D0%BE%D0%B7%D2%93%D0%B0%D0%BB%D1%8B%D1%81%D1%82%D1%8B%20%D2%AF%D0%B9%D0%BB%D0%B5%D1%81%D1%82%D1%96%D1%80%D1%83%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bogliq-tushunchalar\"&gt;&lt;a href=\"concepts/spec-brain.html#bogliq-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'liq tushunchalar&lt;/span&gt;&lt;/a&gt;Bog'liq tushunchalar&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-neurology.html\"&gt;Неврология&lt;/a&gt; — болезни нервной системы: инсульт, эпилепсия, нейродегенерация&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-neuroscience.html\"&gt;Нейронаука&lt;/a&gt; — как устроены нейроны, сети мозга и память&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-animal_behavior_and_cognition.html\"&gt;Поведение и познание животных&lt;/a&gt; — обучение, решения и общение у животных&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/spec-brain.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html\"&gt;Goshe kasalligida miya nega tutqanoqqa moyil bo'ladi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut.html\"&gt;Miyaning xotira tasvirlarini qanday tiklashi aniqlandi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html\"&gt;Bolalikdagi stress miyani qanday o'zgartiradi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html\"&gt;Gen terapiyasi kam uchraydigan sindromning oldini oldi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html\"&gt;Alzgeymer kasalligida miya hujayralari nima uchun charchaydi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html\"&gt;Miya kasalliklarida oqsil yetishmovchiligi noodatiy halqasimon RNKlarni hosil qiladi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html\"&gt;Altsgeymer kasalligida hujayralararo zanjirli shikastlanish mexanizmi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html\"&gt;Afaziya va ong: nima uchun ba'zilar tasavvur qila olmaydi?&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html\"&gt;Miyamiz voqelikni orqadan turib birlamchi koʻrish qobigʻida qayta tiklaydi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html\"&gt;Miya nima uchun sodda tushuntirishlarni tanlaydi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html\"&gt;Miya tanishni yangidan qanday farqlaydi: xotira hujayra kodi topildi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html\"&gt;Inson miyasi ijtimoiy qoidalarni qanday qayta ishlaydi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html\"&gt;Яширин ҳалқасимон РНК молекулалари хавфли нейродегенератив касалликни фош этади&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html\"&gt;Miya san'at asarini tushunishdan qanday zavq oladi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html\"&gt;Uzluqli uyqu miyadagi tutqanoq faolligini qanday qo'zg'atadi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html\"&gt;Kalamushлар қоқу қуshlarini qanday chetlab o‘tadi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html\"&gt;Gripp miyada iz qoldiradi: LRRK2 mutatsiyasi oqsil o‘zgarishlarini qanday qo‘zg‘atadi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html\"&gt;Inson gipokampusining rivojlanish xaritasi va Altsgeymer kasalligi&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/spec-brain.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A4%D0%B8%D0%B7%D0%B8%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%8F_%D0%B2%D1%8B%D1%81%D1%88%D0%B5%D0%B9_%D0%BD%D0%B5%D1%80%D0%B2%D0%BD%D0%BE%D0%B9_%D0%B4%D0%B5%D1%8F%D1%82%D0%B5%D0%BB%D1%8C%D0%BD%D0%BE%D1%81%D1%82%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Физиология высшей нервной деятельности — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:I.P.Pavlov_by_Repin.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Ilya Repin, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-9-559\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;WGCNA: an R package for weighted correlation network analysis&lt;/a&gt; — sharh, BMC Bioinformatics 2008&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41592-019-0686-2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;SciPy 1.0: fundamental algorithms for scientific computing in Python&lt;/a&gt; — sharh, Nat Methods 2020&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1126/science.1160809\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Understanding the Warburg effect: the metabolic requirements of cell proliferation&lt;/a&gt; — sharh, Science 2009&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"неврология; нейронаука; поведение и познание животных"}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Miya va asab tizimi","description":"неврология; нейронаука; поведение и познание животных","vcsPath":"concepts/spec-brain.md"},"headings":[{"title":"Ta'rif","href":"concepts/spec-brain.html#tarif","level":2},{"title":"Umumiy sharh","href":"concepts/spec-brain.html#umumiy-sharh","level":2},{"title":"Nazariya","href":"concepts/spec-brain.html#nazariya","level":2},{"title":"Bu qanday ishlaydi","href":"concepts/spec-brain.html#bu-qanday-ishlaydi","level":2},{"title":"Usullar va vositalar","href":"concepts/spec-brain.html#usullar-va-vositalar","level":2},{"title":"Qayerda qo'llaniladi","href":"concepts/spec-brain.html#qayerda-qollaniladi","level":2},{"title":"Cheklovlar va qiyinchiliklar","href":"concepts/spec-brain.html#cheklovlar-va-qiyinchiliklar","level":2},{"title":"Bog'liq tushunchalar","href":"concepts/spec-brain.html#bogliq-tushunchalar","level":2},{"title":"Qayerda uchraydi","href":"concepts/spec-brain.html#qayerda-uchraydi","level":2},{"title":"Manbalar","href":"concepts/spec-brain.html#manbalar","level":2}],"title":"Miya va asab tizimi"},"router":{"pathname":"concepts/spec-brain","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"se
