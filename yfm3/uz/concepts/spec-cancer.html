        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Mutaxassislik&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/spec-cancer.jpg\" alt=\"Saraton va onkologiya\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm: Stevenfruitsmaak, CC BY-SA 4.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Tumor_Mesothelioma2_legend.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/spec-cancer.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;биология рака; гематология; клиническая онкология&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/spec-cancer.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Onkologiya — bu o‘sma kasalliklarining tabiati, kelib chiqish mexanizmlari va ularga qarshi kurashish usullarini o‘rganadigan tibbiyot sohasi. Uning negizida normal hujayralarning patologik holatga o‘tishi, ya’ni bo‘linish va o‘lim ustidan nazoratni yo‘qotish jarayonlarini tushunish yotadi. Zamonaviy onkologiya saraton biologiyasi, gematologiya va klinik amaliyotni birlashtirib, nafaqat o‘smani yo‘q qilish, balki bemorning hayot sifatini saqlab qolishni ham maqsad qiladi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/spec-cancer.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Onkologiya poydevori hujayralardagi genetik va metabolik o‘zgarishlarni o‘rganishga asoslanadi. Xavfli transformatsiya hujayrada bo‘linish nazorati va apoptozdan himoya mexanizmlarini o‘chiradigan mutatsiyalar to‘planganda yuz beradi. Asosiy tushunchalarga genom beqarorligi, immun nazoratidan qochish va o‘smaning o‘z ehtiyojlari uchun mikromuhitni qayta qurish qobiliyati kiradi.&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-ishlaydi\"&gt;&lt;a href=\"concepts/spec-cancer.html#bu-qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Bu qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;O‘sma rivojlanishi ko‘p bosqichli jarayondir. Avval hujayra nazoratsiz bo‘linish qobiliyatiga ega bo‘ladi. Keyin u atrofdagi to‘qimalar bilan o‘zaro ta’sirga kirishadi, masalan, metastaz uchun qon tomir to‘siqlarini buzadi yoki o‘sishni qo‘llab-quvvatlash uchun xolesterin kabi resurslarni o‘zlashtiradi. Immun tizimi ko‘pincha tahdidni «ko‘rmaydi», chunki o‘sma hujayralari immun javobni bostirish uchun regulyator T-hujayralaridan foydalanadi.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/spec-cancer.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Bugungi kunda diagnostika va terapiya yuqori texnologik usullarga tayanadi. Bularga qalqonsimon bez saratonini aniqlash uchun gormon metabolitlarini tahlil qilish, jarrohlik jarohati chetlarini tahlil qilish uchun sun’iy intellekt bilan birlashtirilgan optik mikroskopiya va o‘smaning o‘ziga xos zaif tomonlariga qaratilgan maqsadli terapiya kiradi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/spec-cancer.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo‘llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo‘llaniladi&lt;/h2&gt;\n&lt;p&gt;Onkologiya usullari ilg‘or tadqiqotlarda o‘z aksini topadi. Masalan, «Optik mikroskopiya va sun’iy intellekt glioblastoma retsidivini bashorat qilishga qanday yordam beradi» maqolasida o‘sma qayta o‘sishining oldini olish uchun to‘qimalarni tahlil qiluvchi algoritm tasvirlangan. «Ichakdagi bakteriya yo‘g‘on ichak saratonining jigarga metastaz berishiga yordam beradi» tadqiqoti mikrobiomaning kasallik rivojlanishidagi rolini ko‘rsatadi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-qiyinchiliklar\"&gt;&lt;a href=\"concepts/spec-cancer.html#cheklovlar-va-qiyinchiliklar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va qiyinchiliklar&lt;/span&gt;&lt;/a&gt;Cheklovlar va qiyinchiliklar&lt;/h2&gt;\n&lt;p&gt;Onkologiyaning asosiy qiyinchiligi — o‘smalarning geterogenligi: hatto bitta yangi hosilaning ichida ham hujayralar bir-biridan keskin farq qilishi mumkin. Bu terapiyaga nisbatan chidamlilikning rivojlanishiga olib keladi. Bundan tashqari, ko‘plab diagnostika usullari xavfsiz va xavfli jarayonlarni farqlash uchun yuqori aniqlikni talab qiladi.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Saraton va onkologiya&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%93%D0%B5%D0%BD%D0%B5%D1%82%D0%B8%D0%BA%D0%B0%D0%BB%D1%8B%D2%9B%20%D0%BC%D1%83%D1%82%D0%B0%D1%86%D0%B8%D1%8F%D0%BB%D0%B0%D1%80%5D%20--%3E%20B%5B%D0%91%D0%B0%D2%9B%D1%8B%D0%BB%D0%B0%D1%83%D1%81%D1%8B%D0%B7%20%D0%B1%D3%A9%D0%BB%D1%96%D0%BD%D1%83%5D%0A%20%20B%20--%3E%20C%5B%D0%86%D1%81%D1%96%D0%BA%D1%82%D1%96%D2%A3%20%D3%A9%D1%81%D1%83%D1%96%5D%0A%20%20C%20--%3E%20D%5B%D0%9C%D0%B8%D0%BA%D1%80%D0%BE%D0%BE%D1%80%D1%82%D0%B0%D0%BC%D0%B5%D0%BD%20%D3%A9%D0%B7%D0%B0%D1%80%D0%B0%20%D3%99%D1%80%D0%B5%D0%BA%D0%B5%D1%82%D1%82%D0%B5%D1%81%D1%83%5D%0A%20%20D%20--%3E%20E%5B%D0%9C%D0%B5%D1%82%D0%B0%D1%81%D1%82%D0%B0%D0%B7%D0%B4%D0%B0%D1%80%5D%0A%20%20C%20--%3E%20F%5B%D0%98%D0%BC%D0%BC%D1%83%D0%BD%D0%B4%D1%8B%D2%9B%20%D0%B6%D2%AF%D0%B9%D0%B5%D0%B4%D0%B5%D0%BD%20%D0%B6%D0%B0%D0%BB%D1%82%D0%B0%D1%80%D1%83%5D%0A%20%20F%20--%3E%20G%5B%D0%A2%D0%B0%D1 "2026-09-25/combination-of-alk2-and-cholesterol-targeting-agents-exploit.html\"&gt;Мия ўсмасини даволашнинг янги усули холестерин алмашинувидан топилди&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/spec-cancer.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9E%D0%BD%D0%BA%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Онкология — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Tumor_Mesothelioma2_legend.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Stevenfruitsmaak, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.cell.2011.02.013\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Hallmarks of cancer: the next generation&lt;/a&gt; — sharh, Cell 2011&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-9-559\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;WGCNA: an R package for weighted correlation network analysis&lt;/a&gt; — sharh, BMC Bioinformatics 2008&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/gb-2009-10-3-r25\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Ultrafast and memory-efficient alignment of short DNA sequences to the human genome&lt;/a&gt; — sharh, Genome Biol 2009&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"биология рака; гематология; клиническая онкология"}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Saraton va onkologiya","descr
