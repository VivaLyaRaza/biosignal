        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Jarayon&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;как устроены нейроны, сети мозга и память&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Obzor&lt;/span&gt;&lt;/a&gt;Obzor&lt;/h2&gt;\n&lt;p&gt;Neyrofan (neyrobiologiya) — bu asab tizimining tuzilishi, rivojlanishi, genetikasi, biokimyosi, fiziologiyasi va patologiyalarini o‘rganuvchi fanlararo sohadir. U oddiy biologik tuzilmalar idrok, harakat, hissiy reaktsiyalar, xotira va fikrlashni qanday shakllantirishini tadqiq qiladi.&lt;/p&gt;\n&lt;p&gt;Fan diqqat markazida tashkilotning barcha darajalaridagi jarayonlar turadi: alohida molekulalar va genlardan tortib, neyron tarmoqlari va organizmning yaxlit xatti-harakatigacha. Ushbu mexanizmlarni tushunish fundamental fan uchun ham, neyrodegenerativ va genetik kasalliklarni davolash usullarini yaratish uchun ham zarurdir.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Teoriya&lt;/span&gt;&lt;/a&gt;Teoriya&lt;/h2&gt;\n&lt;p&gt;Asab tizimi ixtisoslashgan hujayralar — neyronlar va gliyalar asosida ishlaydi. Neyronlar qo‘zg‘aluvchanlik xususiyatiga ega bo‘lib, elektr impulslarini hosil qila oladi va kimyoviy mediatorlar yoki elektr signallari orqali sinapslar vositasida axborot uzatadi.&lt;/p&gt;\n&lt;p&gt;Neyrofan bir nechta asosiy printsiplarga tayanadi:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Ierarxiklik: molekulyar o‘zaro ta’sirlar ion kanallari va sinapslar ishini belgilaydi, sinapslar mikrotarmoqlarni hosil qiladi, mahalliy tarmoqlar esa po‘stloq va po‘stloqosti markazlarining global yo‘llariga birlashadi.&lt;/li&gt;\n&lt;li&gt;Neyroplastiklik: sinaptik aloqalar va nerv zanjirlarining tashqi tajriba, stress, o‘rganish yoki shikastlanishlar ta’sirida qayta qurilish qobiliyati.&lt;/li&gt;\n&lt;li&gt;Integratsiya va ixtisoslashuv: miyaning turli qismlari muayyan funktsiyalar uchun javobgardir, ammo murakkab kognitiv jarayonlar taqsimlangan tarmoqlarning sinxron faoliyati orqali amalga oshadi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Neyrofan asab tizimi kasalliklarini klinik tashxislash va davolashga yo‘naltirilgan nevrologiya bilan, shuningdek, oliy asab faoliyatining evolyutsion jihatlarini o‘rganuvchi hayvonlarning xatti-harakati va bilishi haqidagi fanlar bilan chambarchas bog‘liqdir.&lt;/p&gt;\n&lt;h2 id=\"qanday-tuzilgan\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#qanday-tuzilgan\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday tuzilgan&lt;/span&gt;&lt;/a&gt;Qanday tuzilgan&lt;/h2&gt;\n&lt;p&gt;Miyaning tuzilmaviy asosini o‘zaro bog‘langan funktsional bloklar tashkil etadi:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Neyronlar va sinapslar. Hujayralar kiruvchi signallarni dendritlar orqali qabul qiladi, ularni tana qismida jamlaydi va ta’sir potentsialini akson orqali uzatadi. Sinaptik uzatish oqsillar, retseptorlar va vezikulyar transport orqali boshqariladi.&lt;/li&gt;\n&lt;li&gt;Gliya muhiti. Astrotsitlar, oligodendrotsitlar va mikrogliya gomeostazni saqlaydi, miyelin qobig‘ini hosil qiladi, to‘qimalarni himoya qilishda va hujayra chiqindilarini yo‘qotishda ishtirok etadi.&lt;/li&gt;\n&lt;li&gt;Sensor va hissiy zanjirlar. Masalan, bodomsimon tana xavf darajasini baholaydi va qo‘rquv reaktsiyasini shakllantiradi, prefrontal po‘stloq esa yuqoridan pastga nazoratni amalga oshiradi va xatti-harakatni boshqaradi.&lt;/li&gt;\n&lt;li&gt;Xotira va idrok tizimlari. Medial chakka tarmog‘i va gippokamp vizual detallarni kodlaydi, qisqa muddatli tajribani uzoq muddatli xotira izlariga aylantiradi va tasavvurlarni qayta tiklashni ta’minlaydi.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"metodlar-va-vositalar\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#metodlar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Metodlar va vositalar&lt;/span&gt;&lt;/a&gt;Metodlar va vositalar&lt;/h2&gt;\n&lt;p&gt;Asab tizimini o‘rganish uchun turli masshtabdagi yondashuvlar qo‘llaniladi:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Molekulyar-genetik usullar: genlar ekspressiyasini tahlil qilish, RNK sekvenatsiyasi va virusli vektorlar orqali terapevtik konstruktsiyalarni yetkazib beruvchi gen terapiyasi.&lt;/li&gt;\n&lt;li&gt;Hujayra modellari: rivojlanish buzilishlarini modellashtirish uchun bemorlarning ildiz hujayralaridan organoidlarni («mini-miya») yetishtirish.&lt;/li&gt;\n&lt;li&gt;Neyrovizualizatsiya va elektrofiziologiya: funktsional MRT, hujayralarning elektr faolligini qayd etish va neyron tarmoqlarini vizualizatsiya qilishning optik usullari.&lt;/li&gt;\n&lt;li&gt;Hisoblash tahlili: miya faolligini dekodlash va vizual xotira naqshlarini tahlil qilish uchun sun’iy neyrotarmoqlardan foydalanish.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo‘llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo‘llaniladi&lt;/h2&gt;\n&lt;p&gt;Neyrofan usullari biotibbiyot, farmakologiya, neyroprotezlash va kognitiv tadqiqotlarda qo‘llaniladi.&lt;/p&gt;\n&lt;p&gt;Amaliy tadqiqotlarda olimlar aniq patologik mexanizmlarni aniqlamoqdalar. «Почему при болезни Гоше возникают судороги: ответ скрыт в развитии мозга» tadqiqotida yetishtirilgan organoidlar kasallik rivojlanishini erta bosqichda kuzatishga yordam berdi. «Как мозг воспроизводит кадры личных воспоминаний» maqolasida hisoblash modellari medial chakka tarmog‘ining rolini tavsiflashga imkon berdi. «Генная терапия остановила развитие редкого синдрома у мышей» ishida esa molekulyar darajadagi aralashuv neyronlar halokatining oldini oldi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-nozik-jihatlar\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#cheklovlar-va-nozik-jihatlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va nozik jihatlar&lt;/span&gt;&lt;/a&gt;Cheklovlar va nozik jihatlar&lt;/h2&gt;\n&lt;p&gt;Texnologik yutuqlarga qaramay, neyrofan jiddiy qiyinchiliklarga duch kelmoqda. Hayvon modellari va hujayra organoidlari yetuk inson miyasining barcha murakkabligini to‘liq aks ettira olmaydi. Immun hujayralarining kompensatsion reaktsiyalari kasallikning erta belgilarini yashirishi mumkin, toksik oqsillarning vezikulalar orqali tarqalishi kabi kaskadli jarayonlarni esa sog‘lom to‘qimalarga zarar yetkazmasdan to‘xtatish murakkabdir.&lt;/p&gt;\n&lt;p&gt;Bundan tashqari, individual o‘zgaruvchanlik mavjud: po‘stloq sohalari orasidagi aloqalarning o‘ziga xosligi noan’anaviy idrok shakllariga, masalan, ichki vizual tasvirlarni ko‘ra olmaslikka olib kelishi mumkin, bu esa eksperimental xulosalarni umumlashtirishda ehtiyotkorlikni talab qiladi.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Нейронаука&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9C%D0%BE%D0%BB%D0%B5%D0%BA%D1%83%D0%BB%D1%8B%20%D0%B8%20%D0%B3%D0%B5%D0%BD%D1%8B%5D%20--%3E%20B%5B%D0%98%D0%BE%D0%BD%D0%BD%D1%8B%D0%B5%20%D0%BA%D0%B0%D0%BD%D0%B0%D0%BB%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BD%D0%B0%D0%BF%D1%81%D1%8B%5D%0A%20%20B%20--%3E%20C%5B%D0%9D%D0%B5%D0%B9%D1%80%D0%BE%D0%BD%D1%8B%20%D0%B8%20%D0%B3%D0%BB%D0%B8%D0%B0%D0%BB%D1%8C%D0%BD%D1%8B%D0%B5%20%D0%BA%D0%BB%D0%B5%D1%82%D0%BA%D0%B8%5D%0A%20%20C%20--%3E%20D%5B%D0%9B%D0%BE%D0%BA%D0%B0%D0%BB%D1%8C%D0%BD%D1%8B%D0%B5%20%D0%BC%D0%B8%D0%BA%D1%80%D0%BE%D1%81%D0%B5%D1%82%D0%B8%5D%0A%20%20D%20--%3E%20E%5B%D0%A4%D1%83%D0%BD%D0%BA%D1%86%D0%B8%D0%BE%D0%BD%D0%B0%D0%BB%D1%8C%D0%BD%D1%8B%D0%B5%20%D0%BE%D1%82%D0%B4%D0%B5%D0%BB%D1%8B%20%D0%BC%D0%BE%D0%B7%D0%B3%D0%B0%5D%0A%20%20E%20--%3E%20F%5B%D0%9F%D0%BE%D0%B2%D0%B5%D0%B4%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%BA%D0%BE%D0%B3%D0%BD%D0%B8%D1%82%D0%B8%D0%B2%D0%BD%D1%8B%D0%B5%20%D1%84%D1%83%D0%BD%D0%BA%D1%86%D0%B8%D0%B8%20%D0%B8%20%D0%BF%D0%B0%D0%BC%D1%8F%D1%82%D1%8C%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bogliq-tushunchalar\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#bogliq-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'liq tushunchalar&lt;/span&gt;&lt;/a&gt;Bog'liq tushunchalar&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-brain.html\"&gt;Miya va asab tizimi&lt;/a&gt; — неврология; нейронаука; поведение и познание животных&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-neurology.html\"&gt;Неврология&lt;/a&gt; — болезни нервной системы: инсульт, эпилепсия, нейродегенерация&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-animal_behavior_and_cognition.html\"&gt;Поведение и познание животных&lt;/a&gt; — обучение, решения и общение у животных&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html\"&gt;Goshe kasalligida miya nega tutqanoqqa moyil bo'ladi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut.html\"&gt;Miyaning xotira tasvirlarini qanday tiklashi aniqlandi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html\"&gt;Bolalikdagi stress miyani qanday o'zgartiradi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html\"&gt;Gen terapiyasi kam uchraydigan sindromning oldini oldi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html\"&gt;Alzgeymer kasalligida miya hujayralari nima uchun charchaydi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html\"&gt;Miya kasalliklarida oqsil yetishmovchiligi noodatiy halqasimon RNKlarni hosil qiladi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html\"&gt;Altsgeymer kasalligida hujayralararo zanjirli shikastlanish mexanizmi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html\"&gt;Afaziya va ong: nima uchun ba'zilar tasavvur qila olmaydi?&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html\"&gt;Miyamiz voqelikni orqadan turib birlamchi koʻrish qobigʻida qayta tiklaydi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html\"&gt;Miya nima uchun sodda tushuntirishlarni tanlaydi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html\"&gt;Miya tanishni yangidan qanday farqlaydi: xotira hujayra kodi topildi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html\"&gt;Inson miyasi ijtimoiy qoidalarni qanday qayta ishlaydi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html\"&gt;Яширин ҳалқасимон РНК молекулалари хавфли нейродегенератив касалликни фош этади&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html\"&gt;Miya san'at asarini tushunishdan qanday zavq oladi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html\"&gt;Uzluqli uyqu miyadagi tutqanoq faolligini qanday qo'zg'atadi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html\"&gt;Gripp miyada iz qoldiradi: LRRK2 mutatsiyasi oqsil o‘zgarishlarini qanday qo‘zg‘atadi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html\"&gt;Inson gipokampusining rivojlanish xaritasi va Altsgeymer kasalligi&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9D%D0%B5%D0%B9%D1%80%D0%BE%D0%B1%D0%B8%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Нейробиология — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"как устроены нейроны, сети мозга и память"}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Нейронаука","description":"как устроены нейроны, сети мозга и память","vcsPath":"concepts/proc-neuroscience.md"},"headings":[{"title":"Ta'rif","href":"concepts/proc-neuroscience.html#tarif","level":2},{"title":"Obz
