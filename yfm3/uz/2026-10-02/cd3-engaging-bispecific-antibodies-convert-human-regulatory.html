lanishdan oldingi (C1 dan oldin) va keyingi (C3 dan keyin) PD-1 (CD279), 4-1BB (CD137) va NKG7 (CD314) ning median floresans intensivligi (MFI). (I) Terapiyaning C1 dan oldin va C3 dan keyin bemorlarning periferik qonida Granzim A (GZMA) ni birgalikda ifodalovchi FOXP3⁺ Treg hujayralarining vakillik hujayra ichidagi FACS grafiklari va miqdori. (G–I) panellari juftlashtirilgan t-testlar yordamida tahlil qilindi. Ma'lumotlar periferik qon namunalarini oqim sitometrik tahlil qilish orqali olingan. (J) Birgalikda yetishtirish tizimining sxematik sharhi. BCMA — B-hujayra yetilish antijeni. MM — ko'p sonli mieloma. PBMC — periferik qon mononuklear hujayralari. (K) Blinatumomab (αCD3×αCD19), OKT3 (αCD3) yoki Teklistamab (αCD3×αBCMA) bilan davolangan sog'lom donor Treg hujayralari bilan 48 soatlik birgalikda yetishtirishdan keyin MM1.S hujayralarining hayotiyligi. Ikki tomonlama ANOVA (n=6). (L) Teklistamabning ortib borayotgan konsentratsiyalari bilan davolangan Treg hujayralari bilan 48 soatlik birgalikda yetishtirishdan keyin MM1.S hujayralarining hayotiyligi (n=3). (M) OKT3 ning ekvimolyar konsentratsiyalari bilan davolangan Treg hujayralari bilan 48 soatlik birgalikda yetishtirishdan keyin MM1.S hujayralarining hayotiyligi (n=3). (N) Xuddi shu davolash sharoitida 72 soatlik birgalikda yetishtirishdan keyin sitokin sekretsiyasi (Granzim A, Granzim B). Ikki tomonlama ANOVA (n=6). (O) In vitro teklistamab bilan davolangan Treg hujayralari va davolanmagan nazorat guruhlari o'rtasida sitotoksik va chiziqni belgilovchi genlarning o'rtacha ifodasini taqqoslovchi issiqlik xaritalari. Ma'lumotlar bulk RNK sekvenirlash orqali olingan. (P) Seahorse XF yordamida o'lchangan 48 soatlik birgalikda yetishtirishdan keyin davolanmagan va teklistamab bilan davolangan Treg hujayralari va pan T-hujayralarining kislorod iste'mol qilish tezligi (OCR). Takroriy o'lchovli bir tomonlama ANOVA (n=5).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory-f4.jpg\" alt=\"4-rasm. IMiDlar bispesifik nishonlar va gematologik malignsiyalar bo'ylab Treg hujayralarining BTCE/AP-1 tomonidan boshq\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm. IMiDlar bispesifik nishonlar va gematologik malignsiyalar bo'ylab Treg hujayralarining BTCE/AP-1 tomonidan boshqariladigan sitotoksik qayta dasturlanishini kuchaytiradi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-rasm. IMiDlar bispesifik nishonlar va gematologik malignsiyalar bo'ylab Treg hujayralarining BTCE/AP-1 tomonidan boshqariladigan sitotoksik qayta dasturlanishini kuchaytiradi. (A) Yuqorida: terapiyadan keyin (C3 dan keyin) va oldin (C1 dan oldin) olingan suyak iligi namunalaridan ajratilgan Treg hujayralarida BATF lokusida differensial xromatin mavjudligini ko'rsatuvchi ATAC-seq treklari. Pastda: vakillik AP-1 oilasi motiflarining katlamli boyitilishini ko'rsatuvchi differensial mavjud bo'lgan hududlarning AP-1 motifini boyitish tahlili. (B) Teklistamab (αBCMA×αCD3) bilan yoki usiz MM1.S mieloma hujayralari bilan birgalikda yetishtirilgandan so'ng Treg gen ifodasining qPCR tahlili. Genlar funksiyasi bo'yicha guruhlangan: Treg identifikatsiyasi (FOXP3, IKZF2), signal regulyatorlari (MAP3K1, DUSP4, DUSP16, TNFAIP3), sitotoksik effektorlar (GZMA, GZMB, NKG7) va transkripsiya omillari (BATF, JUNB, TOX). Taqqoslash uchun juftlashtirilgan t-testlar ishlatilgan. (C) BCMA×CD3 o'zaro ta'siri orqali Treg hujayralarida induktsiya qilingan taklif etilgan transkripsion tarmoq. Tugun rangi intensivligi B panelidagi log₂ katlamli o'zgarishlarni aks ettiradi. (D) OKT3, Teklistamab, Lenalidomid yoki kombinatsiyalar bilan davolangan sog'lom donor Treg hujayralari bilan 48 soatlik birgalikda yetishtirishdan keyin MM1.S hujayralarining hayotiyligi. Ikki tomonlama ANOVA (n=5). (E) Xuddi shu davolash sharoitida 72 soatlik birgalikda yetishtirishdan keyin sitokin sekretsiyasi (Granzim A, Granzim B, CCL5, IL-10). Ikki tomonlama ANOVA (n=5). (F) Davolanmagan Treg hujayralari va in vitro immunomodulyator agent (IMiD) lenalidomid, bispesifik T-hujayra engayeri (BTCE) teklistamab yoki ikkalasining kombinatsiyasi bilan davolangan Treg hujayralari o'rtasida sitotoksik va chiziqni belgilovchi genlarning o'rtacha ifodasini taqqoslovchi issiqlik xaritalari. Ma'lumotlar bulk RNK sekvenirlash orqali olingan. (G) MajesTEC-5 sinoviga (n=2 E guruhi; n=1 E1 guruhi) kiritilgan va talketamab (G-oqsil bilan bog'langan retseptor klassi C guruhi 5 a'zosi D (GPRC5D)xCD3), daratumumab, lenalidomid va deksametazon (Tal-DRd) kombinatsiyasi bilan induksion terapiyadan o'tayotgan n=3 yangi tashxis qo'yilgan ko'p sonli mieloma (NDMM) bemorlarining sxematik illyustratsiyasi. Namunalar 1-sikl (C1) dan oldin (pre) va 3-sikl (C3) dan keyin (post) yig'ilgan. (H) Tal-DRd bilan davolangan bemorlar orasida T-hujayra subpopulyatsiyalarining taqsimotini ko'rsatuvchi UMAP grafigi. Ma'lumotlar suyak iligi namunalarini bir hujayrali RNK sekvenirlash orqali olingan. (I) Tal-DRd bilan davolangan bemorlar orasida davolanishdan oldingi (C1 dan oldin) va keyingi (C3 dan keyin) vaqt nuqtalari o'rtasida Treg hujayralarining z-balli normallashtirilgan, sitotoksik gen ifodasini taqqoslashni ko'rsatuvchi issiqlik xaritasi. Ma'lumotlar suyak iligi namunalarini bir hujayrali RNK sekvenirlash orqali olingan. (J) Talketamabning ortib borayotgan dozalarida sog'lom donor PBMC laridan ajratilgan Treg hujayralari bilan 72 soatlik birgalikda yetishtirishdan keyin MM1.S hujayralarining hayotiyligi (αCD3×αGPRC5D) (n=3). (K) Blinatumomabning (αCD3×αCD19) kuchayib boruvchi dozalariga duchor bo'lgan sog'lom donor PBMC laridan ajratilgan Treg hujayralari bilan 72 soatlik birgalikda yetishtirishdan keyin Nalm6 hujayralarining hayotiyligi (n=3).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\
