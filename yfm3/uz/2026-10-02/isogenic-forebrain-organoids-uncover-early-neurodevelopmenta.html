            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"213\" cy=\"96\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"607\" cy=\"216\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Goshe kasalligida miya nega&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;tutqanoqqa moyil bo'ladi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Goshe kasalligi ko'pincha og'ir nevrologik buzilishlar, jumladan tutqanoq xurujlari bilan kechadi. Ilgari bu jarayonlarni hayvonlar modellarida o'rganish qiyin edi. Tadqiqotchilar inson miyasi rivojlanishini takrorlovchi organoidlarni yaratishdi. Bu usul lipidlar to'planishi miyadagi qo'zg'alish va tormozlanish muvozanatini qanday buzishini ko'rsatib berdi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;GBA1 mutatsiyasi lipidlar almashinuvini buzadi&lt;/li&gt;\n&lt;li&gt;Miya organoidlarida glutamatergik qo'zg'alish kuchayishi aniqlandi&lt;/li&gt;\n&lt;li&gt;Tormozlovchi neyronlar funksiyasining pasayishi kuzatildi&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Goshe kasalligi GBA1 genidagi mutatsiyalar tufayli yuzaga keladigan lizosomal kasallikdir. Bu mutatsiya glyukotserebrozidaza fermenti yetishmovchiligiga olib keladi, natijada hujayralarda zaharli lipidlar to'planadi. Tadqiqotchilar induksiyalangan pluripotent o'zak hujayralaridan (&lt;a href=\"concepts/ipsc.html\"&gt;iPSC&lt;/a&gt;) foydalanib, sog'lom va kasal hujayralar liniyalarini yaratishdi. Ushbu hujayralardan miya po'stlog'i va subpallial qismlarni imitatsiya qiluvchi organoidlar o'stirildi.&lt;/p&gt;\n&lt;p&gt;Yagona hujayra transkriptomikasi tahlili shuni ko'rsatdiki, mutatsiya lipidlar almashinuvi va mitoxondriya funksiyalarini erta bosqichda buzadi. Kortikal organoidlarda neyronlarning ko'payishi kamayib, ularning glutamatergik (qo'zg'atuvchi) yo'nalishga o'tishi kuzatildi. Funksional testlar organoidlardagi neyron tarmoqlarida patologik giperqo'zg'aluvchanlikni tasdiqladi. GABK-ergik (tormozlovchi) neyronlar esa bu ortiqcha qo'zg'alishni muvozanatlashtira olmadi, bu esa bemorlardagi davolash qiyin bo'lgan tutqanoqlarning sababini tushuntiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot in vitro sharoitida o'tkazilgan bo'lib, organizmning murakkab tizimli o'zaro ta'sirini to'liq qamrab olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Goshe kasalligi GBA1 genidagi autosom-retsessiv mutatsiyalar natijasida yuzaga keladigan kam uchraydigan lizosomal saqlash kasalligidir. Ushbu gen lizosomal glyukotserebrozidaza fermentini kodlaydi. Kasallikning uchta turi mavjud bo‘lib, ular nevrologik belgilarning mavjudligi va og‘irligi bilan farqlanadi. 2-tipdagi kasallik erta boshlanadigan nevropatiya, rivojlanishdagi kechikishlar, tutqanoqlar va erta o‘lim bilan kechadi. Neyropatik Goshe kasalligining mexanizmlarini o‘rganuvchi tadqiqotlar asosan hayvonlar modellariga asoslangan va ko‘pincha neyronlarning kechki fenotiplariga qaratilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;2-tip Goshe kasalligi og‘ir neyrodegenerativ holat bo‘lib, uning miya rivojlanishining dastlabki bosqichlaridagi mexanizmlari yetarli darajada o‘rganilmagan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz sog‘lom donorlar va Goshe kasalligi bilan og‘rigan bemorlardan olingan induksiyalangan pluripotent o‘zak hujayralari (&lt;a href=\"concepts/induced-pluripotent-stem-cells.html\"&gt;iPSC&lt;/a&gt;) liniyalarini yaratdik va ulardan izogen nazorat liniyalarini hosil qildik. Ushbu liniyalar yordamida kortikal va subpallial miya organoidlari yetishtirildi. Ushbu modellarda biz lipid almashinuvining erta buzilishlarini aniqladik: glyukozilseramid to‘planishi, glyukozilsfingozin darajasining keskin oshishi va keyinchalik gangliozidlar miqdorining ko‘payishi kuzatildi, bu klinik topilmalarni takrorlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;iPSC (induksiyalangan pluripotent o‘zak hujayralari) — kattalar hujayralarini qayta dasturlash orqali olingan, har qanday to‘qima turiga, shu jumladan neyronlarga aylana oladigan hujayralardir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bir hujayrali transkriptomik profilirlash (&lt;a href=\"concepts/scrna-seq.html\"&gt;scRNA-seq&lt;/a&gt;) yordamida yangi fenotiplar aniqlandi. Subpallial organoidlarda xolesterin almashinuvini kuchaytirgan migratsiya qiluvchi interneyronlarning erta ko‘payishi kuzatildi. Kortikal organoidlarda mitoxondrial genlarning erta faollashuvi va proliferatsiyaning pasayishi, so‘ngra GABA-ergik neyronlardan glutamatergik neyronlarga o‘tish va sinaptik yig‘ilish bilan bog‘liq genlar ekspressiyasining keskin oshishi aniqlandi.&lt;/p&gt;\n&lt;p&gt;Funksional tahlillar kortikal organoidlarning yuqori qo‘zg‘aluvchanligini va GABA-A retseptorlari blokadasiga javobning pasayganligini ko‘rsatdi. Qo‘shimcha 2D neyron tarmoq modellari organoid ma’lumotlarini tasdiqladi: Goshe kasalligidagi glutamatergik neyronlar giperqo‘zg‘aluvchanlikni namoyon etadi, GABA-ergik neyronlar esa bu ortiqcha qo‘zg‘alishni muvozanatlashtira olmaydi. Bu qo‘zg‘alish/tormozlanish muvozanatining buzilishi bemorlarda davolashga chidamli tutqanoqlarning rivojlanishini tushuntiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot organoidlar va 2D-madaniyatlarda o‘tkazilgan, bu inson miyasining soddalashtirilgan modeli bo‘lib, natijalar klinik sharoitda qo‘shimcha tekshiruvni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"gaucher-kasalligi-va-mavjud-modellarning-cheklovlari\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#gaucher-kasalligi-va-mavjud-modellarning-cheklovlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gaucher kasalligi va mavjud modellarning cheklovlari&lt;/span&gt;&lt;/a&gt;Gaucher kasalligi va mavjud modellarning cheklovlari&lt;/h4&gt;\n&lt;p&gt;Lizosomal saqlash kasalliklari (&lt;a href=\"concepts/gaucher-disease.html\"&gt;LSD&lt;/a&gt;) lizosomal fermentlar yetishmovchiligi tufayli kelib chiqadigan kam uchraydigan irsiy metabolik kasalliklar guruhidir. Bu hujayra gomeostazi uchun muhim bo‘lgan lizosomal tizimning buzilishiga va parchalanmagan molekulalarning to‘planishiga olib keladi. Gaucher kasalligi GBA1 genidagi mutatsiyalar natijasida yuzaga keladigan eng keng tarqalgan LSD shakli bo‘lib, u β-glyukotserebrozidaza (GCase) fermentini kodlaydi. GCase yetishmovchiligi lizosomalarda glyukotsilseramid (GlcCer) to‘planishiga olib keladi, bu esa gepatosplenomegaliya, pansitopeniya va suyak o‘zgarishlarini keltirib chiqaradi. Shuningdek, GBA1 mutatsiyalari Parkinson kasalligi xavfini oshirishi bilan bog‘liq.&lt;/p&gt;\n&lt;p&gt;Gaucher kasalligi uch turga bo‘linadi: I tur (neyronopatik bo‘lmagan) asosan anemiya va organlarning kattalashishi bilan kechadi; II tur (o‘tkir neyronopatik) chaqaloqlarda tez rivojlanadigan neyrodegeneratsiya va erta o‘lim bilan namoyon bo‘ladi; III tur (surunkali neyronopatik) sekinroq rivojlanadi. Hozirgi davolash usullari (ferment o‘rnini bosuvchi terapiya) tizimli simptomlarni yaxshilasa-da, nevrologik ko‘rinishlarga kam ta’sir qiladi, chunki fermentlar qon-miya to‘sig‘idan o‘ta olmaydi. Bu miyani kasallik rivojlanishiga moyil qoldiradi va Parkinson simptomlari bilan bog‘liqlikni tushuntiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GBA1 mutatsiyalari tufayli kelib chiqadigan Gaucher kasalligi GlcCer va neyrotoksik glyukotsilsfingozin (&lt;a href=\"concepts/glucosylsphingosine.html\"&gt;GlcSph&lt;/a&gt;) to‘planishiga olib keladi, ammo mavjud davolash usullari qon-miya to‘sig‘i tufayli nevrologik buzilishlarni samarali tuzata olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;GlcCer Golgi apparatida sintezlanadi va miya rivojlanishi uchun zarur bo‘lgan gangliozidlar kabi murakkab glikosfingolipidlar uchun kashshof hisoblanadi. Lizosomal parchalanish buzilganda, GlcCer to‘planib, GlcSph ga aylanadi — bu kasallikning neyrotoksik biomarkeridir. An’anaviy sichqon modellari turlararo farqlar va miya tuzilishining soddaligi tufayli inson kasalligining vaqtinchalik dinamikasini to‘liq takrorlamaydi.&lt;/p&gt;\n&lt;h4 id=\"organoidlar-yordamida-gaucher-kasalligini-modellashtirish\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#organoidlar-yordamida-gaucher-kasalligini-modellashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Organoidlar yordamida Gaucher kasalligini modellashtirish&lt;/span&gt;&lt;/a&gt;Organoidlar yordamida Gaucher kasalligini modellashtirish&lt;/h4&gt;\n&lt;p&gt;Inson miya to‘qimalari yetishmovchiligini bartaraf etish uchun olimlar induksiyalangan pluripotent o‘zak hujayralardan (iPSC) foydalanadilar. Ular turli xil neyron turlariga differensiatsiyalanish va miya organoidlarini hosil qilish qobiliyatiga ega. Ilgari neyronlar va astrositlar modellari, shuningdek, Parkinson kasalligini o‘rganish uchun o‘rta miya organoidlari yaratilgan edi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;iPSC (induksiyalangan pluripotent o‘zak hujayralar) — bu kattalar hujayralarini (masalan, teri fibroblastlari) embrional o‘zak hujayralar holatiga qaytarish orqali olingan hujayralar bo‘lib, ular istalgan to‘qima turiga aylana oladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu tadqiqotda biz Gaucher kasalligi bilan og‘rigan bemor fibroblastlaridan iPSC oldik. Genomni tahrirlash usullari bilan bemor liniyasidagi mutatsiyalar tuzatildi va nazorat liniyasida GBA1 geni &lt;a href=\"concepts/knock-out.html\"&gt;nokaut&lt;/a&gt; qilindi, shunday qilib izogen juftliklar yaratildi. Bu to‘rtta iPSC liniyasi kortikal va subpallial old miya organoidlariga differensiatsiya qilindi. Biz GlcSph to‘planishini va gangliozidlar (GM1) darajasining oshishini aniqladik. Yagona hujayrali transkriptomika tahlili neyronal spesifikatsiya, migratsiya va yetilish jarayonlaridagi o‘zgarishlarni ko‘rsatdi. Funksional testlar glutamatergik va GABAergik neyronlardagi kamchiliklarni tasdiqladi, bu esa kasallik mexanizmlari haqida yangi ma’lumot beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot in vitro modellarga (organoidlarga) asoslangan bo‘lib, ular miya rivojlanishini aniq takrorlasa-da, butun organizmning tizimli o‘zaro ta’sirlarini to‘liq aks ettirmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"soglom-nazorat-va-goshe-kasalligi-ipsk-liniyalarini-tegishli-izogen-nazorat-bilan-yaratish\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#soglom-nazorat-va-goshe-kasalligi-ipsk-liniyalarini-tegishli-izogen-nazorat-bilan-yaratish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sog'lom nazorat va Goshe kasalligi iPSK liniyalarini tegishli izogen nazorat bilan yaratish&lt;/span&gt;&lt;/a&gt;Sog'lom nazorat va Goshe kasalligi iPSK liniyalarini tegishli izogen nazorat bilan yaratish&lt;/h4&gt;\n&lt;p&gt;Neyronopatik Goshe kasalligini modellashtirish uchun biz bemor teri fibroblastlarini mRNK-reprogrammalash orqali iPSK liniyalarini hosil qildik. Klonlar ISSCR standartlariga muvofiq xarakterlandi: ular tipik morfologiyaga (Rasm S1A) va NANOG, OCT3/4, SOX2 va TRA-1-81 markerlarining oqsil (Rasm S1A) hamda mRNK (Rasm S1B) darajasidagi ekspressiyasiga ega edi. Goshe kasalligi (GD) liniyasi xromosoma anomaliyalarisiz (Rasm S1C) va uchta embrional qatlamga differensiallanish qobiliyatiga ega bo'ldi (Rasm S1D). Sanger sekveniroviyasi GBA1 genida P415R va L483P mutatsiyalarini tasdiqladi (Rasm S1E). Dastlabki «sog'lom» liniyada N370S mutatsiyasi aniqlangani uchun u sog'lom tashuvchi (HC) liniyasi deb qayta nomlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;iPSK (induktsiyalangan pluripotent o'zak hujayralar) — bu kattalar hujayralarini embrional o'zak hujayralar holatiga qaytarish orqali olingan, har qanday to'qimaga aylanish qobiliyatiga ega hujayralardir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;HC liniyasida nokaut (HC-KO) hosil qilish uchun &lt;a href=\"concepts/skrining-crispr-s-kombinatsiyami-preparatov.html\"&gt;CRISPR&lt;/a&gt;/Cas9 ishlatildi. GBA1LP psevdogeni bilan 96% gomologiya tufayli, biz GBA1 ning 9-ekzonidagi 55 b.j. uzunlikdagi noyob qismni nishonga oldik (Rasm 1A). Ikkala allel ham shikastlangan klon olindi: 74 b.j. qo'shilishi (K447fsX21 stop-kodoni) va 30 b.j. delitsiyasi (F436_T446delinsS) (Rasm 1B). Xuddi shu strategiya GD liniyasidagi P415R mutatsiyasini tuzatishga imkon berdi (Rasm 1C). 10-ekzondagi L444P mutatsiyasini tuzatish uchun psevdogen bilan farqi bo'lmagani sababli, DNKning ikki zanjirli uzilishlaridan qochish uchun praym-tahrirlash (PE3b) qo'llanildi (Rasm 1C). Olingan GD-iso liniyasi plyuripotentlik, normal kariotip va differensiallanish qobiliyatini saqlab qoldi (Rasm 1D–G).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Izogen liniyalar (HC-KO va GD-iso) GCase fermenti faolligini to'liq tikladi yoki taqlid qildi: GD-iso uchun 73,46 nmol/soat·mg oqsil (dastlabki GD 11,57 edi) va HC-KO uchun 7,39 nmol/soat·mg (nazorat HC 72,23 edi).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Funksional tekshiruv shuni ko'rsatdiki, HC liniyasida GCase faolligi 72,23 nmol/soat·mg oqsilni tashkil etdi, GD liniyasida esa atigi 11,57. HC-KO liniyasida faollik 7,39 gacha tushdi, tuzatilgan GD-iso liniyasida esa 73,46 nmol/soat·mg gacha tiklandi (Rasm 1H). Shunday qilib, Goshe kasalligi mexanizmlarini o'rganish uchun ikki juft izogen liniya (Jadval S1) yaratildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR/Cas9 va praym-tahrirlash usullari nojo'ya mutatsiyalar xavfini kamaytirsa-da, off-target effektlarni sinchkovlik bilan nazorat qilish talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gaucher-kasalligi-miya-organoidlarida-sfingolipidlar-progressiv-toplanishi\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#gaucher-kasalligi-miya-organoidlarida-sfingolipidlar-progressiv-toplanishi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gaucher kasalligi miya organoidlarida sfingolipidlar progressiv to‘planishi&lt;/span&gt;&lt;/a&gt;Gaucher kasalligi miya organoidlarida sfingolipidlar progressiv to‘planishi&lt;/h4&gt;\n&lt;p&gt;Neyronopatik Gaucher kasalligini modellashtirish uchun biz iPSC liniyalaridan (HC, HC-KO, GD va GD-iso) foydalandik va ularni subpallial (&lt;a href=\"concepts/forebrain-organoids.html\"&gt;hSO&lt;/a&gt;) hamda kortikal (hCO) miya organoidlariga differensiatsiya qildik (Rasm 2A). Organoidlar 150 kungacha (DIV) o‘stirildi, barcha liniyalar o‘xshash o‘sish dinamikasini ko‘rsatdi (Rasm 2B). DIV75 da barcha liniyalarda SOX2+ neyral rozetkalar va NeuN+ neyronlar hosil bo‘ldi (Rasm 2C, D).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta-f2.jpg\" alt=\"Rasm 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 2&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;iPSC (induksiyalangan pluripotent o‘zak hujayralar) — bu kattalar organizmi hujayralari bo‘lib, ular laboratoriya sharoitida embrional o‘zak hujayralar holatiga qaytarilgan va istalgan to‘qimaga, jumladan neyronlarga aylana oladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Lysotracker bo‘yog‘i yordamida &lt;a href=\"concepts/protochnaya-tsitometriya.html\"&gt;FACS&lt;/a&gt; tahlili shuni ko‘rsatdiki, HC-KO liniyasida lizosomalar hajmi va soni nazorat HC ga nisbatan sezilarli darajada oshgan. Signalning o‘sishi hSO uchun 1,48 barobar va hCO uchun 1,32 barobar (DIV75), hamda DIV150 da mos ravishda 1,48 va 1,52 barobarni tashkil etdi (Rasm 2E). GD va GD-iso liniyalarida aniq farqlar kuzatilmadi, bu HC-KO liniyasida fermentativ faollikning pastligi sababli fenotipning og‘irroq kechishi bilan izohlanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HC-KO liniyasi GD liniyasiga qaraganda ancha kuchli lizosomal disfunksiyani namoyon etadi, bu 150-kunga qadar Lysotracker signali ortishi bilan tasdiqlanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Glyukozilseramid (GlcCer) parchalanishi buzilganligi sababli, biz DIV150 da dot-blot tahlilini o‘tkazdik (Rasm 2F, Rasm SN). HC-KO da GlcCer darajasi nazoratga nisbatan 2,6 (hSO) va 2,5 (hCO) barobar oshgan, GD liniyasida esa o‘sish kamroq (1,25 va 1,05 barobar) bo‘lgan. HPLC-MS yordamida DIV150 da o‘tkazilgan GlcSph tahlili HC-KO (1987,75 va 1364,55 nmol/g oqsil) va GD (2,4 va 7,46 nmol/g oqsil) liniyalarida yuqori darajani ko‘rsatdi (Rasm 2G). GD liniyasida GlcSph to‘planishi allaqachon DIV75 da aniqlangan (Rasm SN).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot organoidlarda o‘tkazilgan; bu sun’iy modellar inson miyasidagi barcha patologik jarayonlarni to‘liq aks ettirmasligi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz gangliozidlar metabolizmini ham o‘rgandik. Yupqa qatlamli xromatografiya DIV150 da GM1 to‘planishini ko‘rsatdi (Rasm SN). Vybrant Alexa Fluor 555 yordamida FACS tahlili membranada GM1 to‘planishini tasdiqladi: DIV75 da floresensiya o‘sishi HC-KO da 1,37 va GD da 1,21 barobarni, DIV150 da esa hSO da 1,77 (HC-KO) va 1,39 (GD) barobarni, hCO da esa 1,29 (HC-KO) va 1,21 (GD) barobarni tashkil etdi (Rasm 2H). Bu natijalar GlcCer katabolizmi buzilishi neyron membranalarida murakkab sfingolipidlar to‘planishiga olib kelishini ko‘rsatadi.&lt;/p&gt;\n&lt;h4 id=\"gaucher-kasalligiga-chalingan-hsolarda-migratsiyalanuvchi-interneyronlar-sonining-ortishi-kuzatiladi\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#gaucher-kasalligiga-chalingan-hsolarda-migratsiyalanuvchi-interneyronlar-sonining-ortishi-kuzatiladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gaucher kasalligiga chalingan hSO'larda migratsiyalanuvchi interneyronlar sonining ortishi kuzatiladi&lt;/span&gt;&lt;/a&gt;Gaucher kasalligiga chalingan hSO'larda migratsiyalanuvchi interneyronlar sonining ortishi kuzatiladi&lt;/h4&gt;\n&lt;p&gt;Bosh miya rivojlanishida glikosfingolipidlar muhim rol o'ynaydi. Gaucher kasalligining hSO (bosh miya old qismi organoidlari) va hCO (po'stloq organoidlari) hujayra tarkibiga ta'sirini o'rganish uchun yagona hujayra RNK sekveniroviyasi (&lt;a href=\"concepts/single-cell-rna-sequencing.html\"&gt;scRNA-seq&lt;/a&gt;) tahlili o'tkazildi. Tadqiqotda 4 ta iPSC liniyasi va 3 ta mustaqil differensiatsiya seriyasidan olingan DIV75 va DIV150 kunlik organoidlar ishlatildi. Namunalarni bir vaqtda qayta ishlash uchun 10x Fixed RNA Profiling tizimi qo'llanildi. Jami 21 295 ta Gaucher va 17 939 ta nazorat hujayralari (hSO uchun), hamda 20 322 va 23 017 ta hujayralar (hCO uchun) tahlil qilindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;scRNA-seq — murakkab to'qimalardagi har bir hujayraning genetik faolligini alohida-alohida o'rganish imkonini beruvchi usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;hSO'larda 9 ta hujayra populyatsiyasi, jumladan, bo'linuvchi hujayralar, radial gliya, astroglia va turli neyronlar aniqlandi (3A-B-rasm, 3D-rasm). Nazorat va Gaucher guruhlarida DIV75 dan DIV150 gacha ventral progenitorlar va migratsiyalanuvchi interneyronlar soni ortdi (SN3A-rasm). DIV75 da Gaucher organoidlarida striar MSN-neyronlar kamayishi va migratsiyalanuvchi interneyronlar keskin ortishi kuzatildi (3C-rasm, SN3D-rasm). DIV150 da farqlar kamaydi: faqat xolinergik neyronlar biroz kamaydi va MSN-neyronlar soni ortdi (SN3B, G-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DIV75 bosqichida Gaucher kasalligida migratsiyalanuvchi interneyronlar populyatsiyasi sezilarli darajada oshgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Differensial ifodalangan genlar (&lt;a href=\"concepts/gene-expression.html\"&gt;DEG&lt;/a&gt;) tahlili DIV75 da 114 ta yuqori va 70 ta past, DIV150 da esa 106 ta yuqori va 22 ta past ifodalangan genlarni ko'rsatdi (SN3C, D, F, G-rasm). NR2F1 geni har ikki muddatda ham eng ko'p pasaygan gen bo'lib, u neyronlar balansini boshqaradi. GO tahlili DIV75 da plazmatik membrana jarayonlari pasayganini, lizosomal va sinaptik yo'llar esa faollashganini ko'rsatdi (SN3E-rasm). DIV150 da sinaptik funksiyalar faollashib, migratsiya va ekstrasellyulyar matritsa bilan bog'liq yo'llar susaydi (SN3H-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar laboratoriya sharoitidagi organoidlarda olingan, bu tirik organizmdagi jarayonlarning to'liq nusxasi emas.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;DIV75 dagi migratsiyalanuvchi interneyronlar tahlili 89 ta yuqori va 29 ta past ifodalangan genlarni aniqladi (3E-rasm, SN3D-rasm). Xolesterin metabolizmi va sinaptik adgeziya faollashgan, Golgi apparati funksiyasi, autofagiya va PKC-signallash esa susaygan (3F-rasm). Xulosa qilib aytganda, Gaucher kasalligida miya rivojlanishi davrida interneyronlar migratsiyasi va xolesterin almashinuvi buziladi.&lt;/p&gt;\n&lt;h4 id=\"gaucher-kasalligiga-chalingan-hcolarda-mitoxondrial-genlarning-erta-faollashuvi-va-neyronlar-rivojlanishidagi-ozgarishlar\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#gaucher-kasalligiga-chalingan-hcolarda-mitoxondrial-genlarning-erta-faollashuvi-va-neyronlar-rivojlanishidagi-ozgarishlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gaucher kasalligiga chalingan hCOlarda mitoxondrial genlarning erta faollashuvi va neyronlar rivojlanishidagi o'zgarishlar&lt;/span&gt;&lt;/a&gt;Gaucher kasalligiga chalingan hCOlarda mitoxondrial genlarning erta faollashuvi va neyronlar rivojlanishidagi o'zgarishlar&lt;/h4&gt;\n&lt;p&gt;Inson miya organoidlari (hCO) tahlili 14 ta hujayra populyatsiyasini, jumladan progenitorlar, radial glia, astroglia va turli neyron turlarini aniqladi (4A, 4D-rasm). 75-kundan 150-kungacha (DIV) bo'lgan davrda nazorat va Gaucher organoidlarida Cajal-Retzius neyronlari kamayib, GABAergik neyronlar ko'payishi kuzatildi (4B-rasm va SN4A-rasm). Biroq, Gaucher kasalligida (GD) 75-kuni GABAergik neyronlar ko'pligi aniqlangan bo'lsa, 150-kunga kelib qo'zg'atuvchi (glutamatergik) neyronlar hisobiga tormozlovchi neyronlar nisbati kamaygan (4C-rasm, SN4B-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gaucher kasalligida neyronlarning tezlashgan yetilishi kuzatiladi: 75-kuni GABAergik hujayralar ustunlik qilsa, 150-kunga kelib glutamatergik fenotipga o'tish sodir bo'ladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Differensial ifodalangan genlar (DEG) tahlili 75-kuni 659 ta yuqori va 1008 ta past ifodalangan genlarni, 150-kuni esa 498 ta yuqori va 72 ta past ifodalangan genlarni ko'rsatdi (SN4C-F-rasm). 75-kuni hujayra sikli bilan bog'liq yo'llarning pasayishi va sinaptik genlarning faollashuvi kuzatildi, bu tezlashgan differensiyani anglatadi (4E-rasm). &lt;a href=\"concepts/gsea.html\"&gt;GSEA&lt;/a&gt; tahlili elektron uzatish faolligining kuchayishini ko'rsatdi (4F-rasm), bu 10 ta mitoxondrial gen bilan bog'liq (SN4C, SN5A-rasm). Bu neyronlar yetilishi jarayonida glikolizdan oksidlovchi fosforillanishga o'tishni aks ettirishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GSEA (Gene Set Enrichment Analysis) — bu alohida genlar emas, balki funksional jihatdan bog'liq bo'lgan genlar guruhlarining o'zgarishini aniqlash uchun ishlatiladigan statistik usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot organoidlarda o'tkazilgan; kuzatilgan mitoxondrial va hujayraviy o'zgarishlar inson miyasidagi patofiziologiyani to'liq aks ettirmasligi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;TMRM intensivligini o'lchash GD holatida neyronlarning ikkala turida ham mitoxondrial potensial oshganini tasdiqladi (SN5B, C-rasm). 150-kuni GO-tahlili GABAergik neyronlar rivojlanishi bilan bog'liq yo'llarning faollashuvini ko'rsatdi (4G-rasm), bu ularning yetishmovchiligi fonida kompensator mexanizm bo'lishi mumkin. Bu GABAergik liniya genlarining (DLX1/2/5, SLAIN1, SP9, TOX3) pasayishi va glutamatergik markerlarning (BHLHE22, EMX1, NEUROD2/6, SATB2) ortishi bilan tasdiqlanadi (4G, 4H-rasm). Xulosa qilib aytganda, natijalar Gaucher kasalligida erta mitoxondrial disfunksiya va tezlashgan neyron yetilishini ko'rsatadi.&lt;/p&gt;\n&lt;p&gt;Gaucher kasalligi organoidlari qo'zg'atuvchi va tormozlovchi neyronlar funksiyasining o'zgarishini namoyon etadi, bu tarmoqning giperqo'zg'alishiga olib keladi&lt;/p&gt;\n&lt;p&gt;Lipidlar tahlili va yagona hujayra RNK sekvenlash natijalari (GABA-ergik yo'nalishdan glutamatergik yo'nalishga o'tish) asosida biz tormozlovchi neyronlarning funksional kamchiliklarini o'rgandik. Buning uchun biz 64 elektrodli &lt;a href=\"concepts/mea.html\"&gt;MEA&lt;/a&gt; tizimidan foydalanib, 150-kuni (DIV150) organoidlarni elektrodlarga joylashtirdik (5-rasm A). GABA-ergik neyronlar yetishmovchiligini aniqlash uchun biz bazal faollikni qayd etdik, so'ngra tormozlanishni bloklash uchun PTX va qo'zg'alishni bloklash uchun NBQX va APV qo'shdik (5-rasm A). Biz tizimning bazal faollikni, PTXdan keyin qo'zg'alishning oshishini va NBQX/APVdan keyin faollikning to'xtashini aniqlay olishini tasdiqladik (5-rasm B).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MEA (ko'p elektrodli matritsa) — neyron tarmoqlarining elektr faolligini real vaqt rejimida qayd etish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Har bir liniyadan 9–10 ta organoidni tahlil qilgandan so'ng, PTX qo'shilganda barcha namunalarda qo'zg'alish oshganini ko'rdik (5-rasm B). Biroq, GD (Gaucher kasalligi) va GD-iso (nazorat) organoidlarining reaksiyasi turlicha edi: GD-iso'da spike nisbati 2,44 barobar, GD'da esa 1,39 barobar oshdi (5-rasm C). Bu tormozlanishning buzilganligini yoki glutamatergik neyronlarning ko'pligi giperqo'zg'alishni keltirib chiqarishini ko'rsatadi. GD hCO'ning bazal faolligi GD-iso'dan ancha yuqori edi (5-rasm D), bu rivojlanishdagi o'zgarishlar giperqo'zg'alishning asosiy sababi ekanligini tasdiqlaydi. HC va HC-KO juftligida (SN-rasm) mos ravishda 1,41 va 1,74 barobar o'sish kuzatildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gaucher kasalligi organoidlari yuqori bazal faollikni namoyon etadi va tormozlanish blokadasiga kamroq javob beradi, bu esa tarmoqning giperqo'zg'alish holatiga olib keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;hSO uchun PTXdan keyingi o'zgarishlar o'xshash edi: GD-iso uchun 2,73 barobar va GD uchun 2,49 barobar o'sish (5-rasm B, C). HC va HC-KO juftligida esa mos ravishda 2,03 va 3,24 barobar o'sish kuzatildi (SN-rasm). hSO asosan GABA-ergik neyronlardan iborat bo'lgani uchun, tormozlanishni bloklash faollikka kuchli ta'sir qildi. hCO'dan farqli o'laroq, hSO'da bazal faollik darajasi yuqori emas edi (SN-rasm), bu glutamatergik neyronlarning giperqo'zg'alish fenotipiga sababchi ekanligini ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot organoidlarda (in vitro) o'tkazilgan, shuning uchun natijalarni inson miyasidagi jarayonlarga to'g'ridan-to'g'ri ko'chirish ehtiyotkorlikni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Gaucher kasalligi bo'yicha GABAergik va glutamatergik neyronlarni o'z ichiga olgan 2D madaniyatlar tarmoq disfunksiyasiga hujayra turiga xos hissalarni aniqlaydi&lt;/p&gt;\n&lt;p&gt;Gaucher kasalligi (GD) organoidlaridagi giperqo'zg'aluvchanlik sababi rivojlanishdagi o'zgarishlarmi yoki yo'qligini aniqlash uchun biz 2D madaniyatlarda yuqori zichlikdagi MEA yozuvlarini o'tkazdik. Biz GD va GD-iso (nazorat) izogen liniyalaridan foydalandik. Yo'naltirilgan dasturlash usuli bilan glutamatergik neyronlar, GABAergik neyronlar va astrositlarning sof populyatsiyalari olindi. Biz ximer madaniyatlarni yaratdik: sog'lom glutamatergik neyronlar/astrositlar kasal GABAergik neyronlar bilan va aksincha (6A-rasm). Bu har bir neyron turi uchun hujayralar sonini moslashtirish va ularning tarmoq giperqo'zg'aluvchanligiga ta'sirini DIV14 dan DIV54 gacha kuzatish imkonini berdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kasal glutamatergik neyronlarga ega madaniyatlar kuchli giperqo'zg'aluvchanlikni (DIV50 da 1,2 Gts) ko'rsatdi, kasal GABAergik neyronlar esa nazoratga yaqin (0,86 Gts) natija berdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Barcha guruhlarda o'rtacha impulslar tezligi (firing rate) vaqt o'tishi bilan 0,5 Gts dan 0,76–1,55 Gts gacha oshdi (6B, 6C-rasm). To'liq GD madaniyatlarida DIV50 da tezlik 1,55 Gts ga yetdi, GD-iso da esa 0,76 Gts ni tashkil etdi. Kasal GABAergik neyronli madaniyatlar nazoratga yaqin (0,86 Gts), kasal glutamatergik neyronli madaniyatlar esa o'rtacha giperqo'zg'aluvchanlik (1,2 Gts) ko'rsatdi. Spayk amplitudasi va intervallari sezilarli farq qilmadi (6C-rasm). Pikrotoksin (PTX) bilan ishlov berish kasal GABAergik neyronlar guruhida faollikning oshish tendentsiyasini ko'rsatdi (SN-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MEA (mikroelektrod matritsasi) — neyronlarning elektr faolligini real vaqtda qayd etuvchi qurilma.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Glutamatergik neyronlarning rolini aniqlash uchun biz CAMKIIɑ promotorli kaltsiy sensori va bikukullin (BIC) yordamida GABA-A retseptorlarini bloklash usulini qo'lladik (DIV28–DIV49). DIV42 va DIV49 da kasal glutamatergik va sog'lom GABAergik neyronli guruhlarda ko'proq hujayralar (63–70%) jamoaviy hodisalarga jalb qilindi (7B-rasm). BIC qo'shilgandan so'ng sinxronizatsiya barcha guruhlarda oshdi, ammo kasal glutamatergik neyronli madaniyatlarda bu ko'rsatkich pastroq bo'lib qoldi (90,5% dan past), ayniqsa kasal GABAergik neyronlar ham mavjud bo'lsa (75,8% dan past).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot 2D-madaniyatlarda o'tkazilgan, bu miyaning murakkab tuzilishini to'liq aks ettirmasligi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"neyronlar-faolligi-va-kalsiy-dinamikasi-tahlili\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#neyronlar-faolligi-va-kalsiy-dinamikasi-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Neyronlar faolligi va kalsiy dinamikasi tahlili&lt;/span&gt;&lt;/a&gt;Neyronlar faolligi va kalsiy dinamikasi tahlili&lt;/h4&gt;\n&lt;p&gt;Bikukullin qo‘llanilishi har bir hujayra uchun cho‘qqilar (peaks) sonining oshishiga olib keldi, ayniqsa DIV35, DIV42 va DIV49 muddatlarida. Ximerik kulturalarda (sog‘lom glutamatergik + kasal GABA-ergik yoki aksincha) cho‘qqilar soni doimo 22 tadan yuqori bo‘ldi, kasal glutamatergik + kasal GABA-ergik kulturalarda esa bu ko‘rsatkich 14 tadan past qoldi (7C-rasm). O‘rtacha tranzientlar sonini tahlil qilish (SN-rasm) shuni ko‘rsatdiki, kasal glutamatergik neyronlarning sog‘lom GABA-ergik neyronlar bilan birgalikdagi bazal faolligi sog‘lom kulturalarga nisbatan sezilarli darajada yuqori: DIV28 da (10,9 ga qarshi 7,7), DIV35 da (12,9 ga qarshi 10,2) va DIV49 da (11,7 ga qarshi 6,5) (SN-rasm). Kasal glutamatergik neyronlarning sog‘lom GABA-ergik neyronlar bilan birgalikdagi faolligi sog‘lom glutamatergik neyronlarning kasal GABA-ergik neyronlar bilan birgalikdagi faolligidan DIV35 (12,9 ga qarshi 9,9) va DIV49 (11,7 ga qarshi 8,0) muddatlarida sezilarli darajada farq qildi (SN-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kasal glutamatergik neyronlar sog‘lom GABA-ergik neyronlar bilan birga bo‘lganda yuqori faollik ko‘rsatadi, bu kompensator mexanizmlar mavjudligini anglatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Bikukullin — GABA retseptorlari antagonisti bo‘lib, u tormozlovchi ta’sirni bloklaydi va glutamatergik tarmoqlarning yashirin qo‘zg‘aluvchanligini baholashga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;To‘liq «kasal» kulturalarda maksimal faollik kuzatilmagani MEA ma’lumotlari va faqat qo‘zg‘atuvchi kirishni tahlil qilish o‘rtasidagi tafovutni ko‘rsatadi. Ehtimol, ortiqcha faollik GABA-ergik neyronlarning giperqo‘zg‘aluvchan glutamatergik hujayralarga javobi bilan bog‘liq. Cho‘qqilar ostidagi maydon (&lt;a href=\"concepts/area-under-the-curve.html\"&gt;AUC&lt;/a&gt;) faqat kasal GABA-ergik neyronlar bo‘lgan kulturalarda sezilarli darajada yuqori bo‘ldi (DIV35 da 388 va DIV42 da 259). Faqat kasal glutamatergik neyronlar bo‘lganda oraliq fenotip (187 va 180), to‘liq kasal kulturalarda esa eng past qiymatlar (84 va 118, 7D-rasm) qayd etildi. Bu shuni anglatadiki, sog‘lom glutamatergik neyronlar kasal GABA-ergik neyronlarning kuchli tormozlovchi ta’siriga javoban gomeostatik tuzatish qobiliyatiga ega, kasal glutamatergik neyronlarda esa bu mexanizm ishlamaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot hujayra kulturalarida o‘tkazilgan, shuning uchun kuzatilgan kompensator mexanizmlar tirik organizmdagi jarayonlardan farq qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;MEA va kalsiy tasvirlash natijalari Gaucher kasalligida glutamatergik neyronlarning giperqo‘zg‘aluvchan ekanligini tasdiqlaydi. GABA-ergik neyronlar ham giperqo‘zg‘aluvchan bo‘lishi mumkin, ammo ularning tarmoq o‘zgarishlariga qo‘shgan hissasi cheklangan.&lt;/p&gt;\n&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;h4 id=\"natijalarni-muhokama-qilish\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#natijalarni-muhokama-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalarni muhokama qilish&lt;/span&gt;&lt;/a&gt;Natijalarni muhokama qilish&lt;/h4&gt;\n&lt;p&gt;Biz birinchi marta induksiyalangan pluripotent o‘zak hujayralaridan (iPSC) olingan inson oldingi miya organoidlari asosida Goshe kasalligi modelini yaratdik. Buning uchun bemor (GD) va sog‘lom donor (HC) hujayra liniyalaridan foydalanib, genom tahrirlash orqali izogen juftliklar (GD-iso va HC-KO) hosil qildik. Olingan kortikal (hCO) va subpallial (hSO) organoidlar patologiyaga xos bo‘lgan lipidlar to‘planishini takrorlaydi. Ushbu tuzilmalarning tanlanishi bemorlarda kuzatiladigan po‘stloq degeneratsiyasi va glioz haqidagi klinik ma’lumotlarga asoslanadi. Bizning modellarimiz glikosfingolipidlar to‘planishini ko‘rsatadi, bu neyronlarning yetilishini buzadi, glutamatergik va GABAergik tarmoqlar disfunksiyasiga hamda ularning giperqo‘zg‘aluvchanligiga olib keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Goshe kasalligining miya organoidlaridagi birinchi modeli yaratildi; u lipidlar to‘planishi, neyronlar yetilishining buzilishi va patologik giperqo‘zg‘aluvchanlikni tasdiqladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Lysotracker bo‘yog‘i yordamida lizosomalarni tahlil qilish HC-KO liniyasida HC ga nisbatan lizosomalar soni ortganini ko‘rsatdi, biroq GD liniyasida GD-iso ga nisbatan sezilarli farqlar aniqlanmadi. Metabolitlarni tahlil qilganda, glyukozilseramid (GlcCer) darajasi faqat HC-KO da oshgani, glyukozilsfingozin (GlcSph) esa har ikkala kasallik liniyasida, ayniqsa HC-KO da sezilarli darajada yuqori ekanligi aniqlandi. Bu fermentativ faollik bilan korrelyatsiya qiladi: HC-KO liniyasi GD ga nisbatan atigi 60% faollikni ko‘rsatadi, bu Goshe kasalligining II turiga xos og‘ir perinatal fenotipni aks ettirishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Izogen liniyalar — bu genetik fon bir xil bo‘lgan, ammo ma’lum bir mutatsiya tahrirlangan hujayralar bo‘lib, ular genning ta’sirini aniq o‘rganishga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Lipidlar to‘planishi lizosomalardagi o‘zgarishlardan oldin sodir bo‘ladi (GD liniyasida) va GM1 gangliozidi darajasining oshishi bilan kechadi. Glikosfingolipidlar miya rivojlanishida muhim rol o‘ynagani uchun, bu Goshe kasalligi prenatal rivojlanishga ta’sir qilib, kelajakdagi nevrologik buzilishlarga zamin yaratishi haqidagi gipotezani tasdiqlaydi. Yagona hujayrali transkriptomika ma’lumotlari mitoxondriyal funksiyaning erta buzilishini ko‘rsatadi. Bu neyronlarning yetilish jarayonida glikolizdan oksidlovchi fosforillanishga o‘tishi bilan bog‘liq bo‘lishi mumkin. Subpallial organoidlarda biz xolesterin almashinuvi va Golji apparati disfunksiyasi bilan bog‘liq bo‘lgan interneyronlar migratsiyasining anomaliyasini aniqladik.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot organoidlarda o‘tkazilgan; ular murakkab bo‘lsa-da, tirik miyadagi barcha o‘zaro ta’sirlarni to‘liq takrorlamaydi, shuning uchun klinik simptomlar bilan bog‘liqlikni qo‘shimcha tekshirish talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Funksional testlar Goshe kasalligi organoidlarida balans glutamatergik neyronlar tomon siljiganini va bu tarmoq giperqo‘zg‘aluvchanligiga olib kelishini ko‘rsatdi. Ximerik kulturalarda glutamatergik neyronlarning o‘zi giperqo‘zg‘aluvchan ekanligi, GABAergik neyronlar esa tizimning urinishlariga qaramay, bu ta’sirni kompensatsiya qila olmasligi tasdiqlandi. Shunday qilib, bizning modellarimiz molekulyar buzilishlarni tarmoq disfunksiyasi bilan bog‘lashga imkon beradi, bu esa terapevtik nishonlarni izlash uchun yangi imkoniyatlar yaratadi.&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"fibroblast-kulturalari\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#fibroblast-kulturalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fibroblast kulturalari&lt;/span&gt;&lt;/a&gt;Fibroblast kulturalari&lt;/h4&gt;\n&lt;p&gt;Odam teri fibroblastlari (GM08398, GM01260) Coriell tibbiy tadqiqotlar institutidan olingan. Hujayralar 10% homila qoramol zardobi (FBS) va 1% GlutaMAX qo‘shilgan DMEM muhitida, 37°C haroratda va 5% CO2 bo‘lgan nam havo muhitida saqlangan. Hujayralar 80% konfluentlikka yetganda 0,25% tripsin yordamida passaj qilingan.&lt;/p&gt;\n&lt;h4 id=\"ipsc-liniyalarini-yaratish-va-saqlash\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#ipsc-liniyalarini-yaratish-va-saqlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;iPSC liniyalarini yaratish va saqlash&lt;/span&gt;&lt;/a&gt;iPSC liniyalarini yaratish va saqlash&lt;/h4&gt;\n&lt;p&gt;Inson iPSC (induktsiyalangan pluripotent ildiz hujayralari) fibroblastlarning mRNA asosidagi qayta dasturlash usuli bilan (StemRNA 3rd Gen protokoli) yaratilgan. Klon liniyalari embrional hujayralarga o‘xshash koloniyalarni tanlash orqali o‘rnatilgan. Hujayralar mTeSR1 muhitida saqlangan va 80% konfluentlikda StemPro Accutase bilan ajratilgan. Sentrifugadan so‘ng (300 x g), hujayralar 1,5–2,5 × 10⁴ hujayra/sm² zichlikda, 10 mkM Rho-kinaza ingibitori Y-27632 qo‘shilgan Matrigel qoplamali 6-o‘rali planshetlarga ekilgan. Madaniyatlar 37°C haroratda, 95% O2 va 5% CO2 muhitida qoldirilgan. Mikoplazma nazorati MycoAlert to‘plami yordamida amalga oshirilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;iPSC — bu kattalar hujayralaridan olingan va embrional holatga qaytarilgan, har qanday to‘qimaga aylanish qobiliyatiga ega bo‘lgan hujayralardir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gba1-mutatsiyasini-tahlil-qilish\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#gba1-mutatsiyasini-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GBA1 mutatsiyasini tahlil qilish&lt;/span&gt;&lt;/a&gt;GBA1 mutatsiyasini tahlil qilish&lt;/h4&gt;\n&lt;p&gt;Fibroblast va iPSC liniyalaridan genomik DNK ajratib olingan (DNeasy to‘plami). GBA1 ekzonlari Master Cycler Nexus termotsiklerida Phusion DNK polimerazasi yordamida PCR qilingan (Jadval S2, S3). Sanger sekvenatsiyasi EuroFins Genomics xizmati orqali bajarilgan va ketma-ketliklar SnapGene (V5.0) dasturida inson GBA1 geni (ENSG00000177628) referens genomi bilan solishtirilgan.&lt;/p&gt;\n&lt;h4 id=\"g-band-va-molekulyar-kariootiplash\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#g-band-va-molekulyar-kariootiplash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;G-band va molekulyar kariootiplash&lt;/span&gt;&lt;/a&gt;G-band va molekulyar kariootiplash&lt;/h4&gt;\n&lt;p&gt;Kariootip tahlili Sant Joan de Déu Barselona bolalar kasalxonasida o‘tkazilgan. Molekulyar kariootiplash &lt;a href=\"concepts/snp.html\"&gt;SNP&lt;/a&gt;-massiv texnologiyasi (Infinium Global Screening Array-24) yordamida amalga oshirilgan. Tahlil GenomeStudio V2.0.5 va CNV-Partition 3.2.0 dasturlarida bajarilgan. Minimal zondlar soni 30, hisobot chegarasi 400 kb (o‘sish/yo‘qotish uchun) va 5 Mb (geterozigotalik yo‘qolishi uchun) etib belgilangan.&lt;/p&gt;\n&lt;h4 id=\"immunotsitokimyo\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#immunotsitokimyo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Immunotsitokimyo&lt;/span&gt;&lt;/a&gt;Immunotsitokimyo&lt;/h4&gt;\n&lt;p&gt;Coloniya iPSC 12-o‘rali slaydlarda o‘stirilgan, 4% paraformaldegid bilan fiksatsiya qilingan va Triton X-100 hamda 5% eshak zardobi bilan ishlov berilgan. Birlamchi antitanachalar bilan inkubatsiya kechasi 4°C da, ikkilamchi antitanachalar va Hoescht 33342 (2 mkg/mkl) bilan 2 soat xona haroratida amalga oshirilgan. Tasvirlar Leica SP8 konfokal mikroskopida (20x ob‘ektiv) olingan va Fiji dasturida tayyorlangan.&lt;/p&gt;\n&lt;h4 id=\"teskari-transkripsiya-va-miqdoriy-pcr-rt-qpcr\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#teskari-transkripsiya-va-miqdoriy-pcr-rt-qpcr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Teskari transkripsiya va miqdoriy PCR (RT-qPCR)&lt;/span&gt;&lt;/a&gt;Teskari transkripsiya va miqdoriy PCR (RT-qPCR)&lt;/h4&gt;\n&lt;p&gt;iPSC klonlarida pluripotensiya genlari ifodasi RT-&lt;a href=\"concepts/qpcr.html\"&gt;qPCR&lt;/a&gt; orqali aniqlangan. RNeasy to‘plami bilan RNK ajratilgan va DNase I bilan tozalangan. Konsentratsiya Nanodrop One yordamida o‘lchangan. 1 mkg RNK qScript to‘plami bilan cDNA ga aylantirilgan. PCR 15 mkl hajmda, 3 ta texnik takrorlash bilan QuantStudio 7 tizimida (40 tsikl) TaqMan tahlillari yordamida o‘tkazilgan.&lt;/p&gt;\n&lt;h4 id=\"uch-qavatli-differensiatsiya\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#uch-qavatli-differensiatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Uch qavatli differensiatsiya&lt;/span&gt;&lt;/a&gt;Uch qavatli differensiatsiya&lt;/h4&gt;\n&lt;p&gt;Inson iPSC hujayralari Matrigel bilan qoplangan 24-o‘rali (well) planshetlarga (Ibidi GmbH) 10 mkm RI qo‘shilgan mTeSR1 muhitida ekilgan. Ektoderma va endoderma uchun 1 × 10⁵, mezoderma uchun 5 × 10⁴ hujayra zichligi ishlatilgan. Differensiatsiya STEMdiff™ Trilineage Differentiation Kit (StemCell Technologies) yordamida 7 kun davomida amalga oshirilgan. Hujayralar 4% PFA bilan 15 daqiqa davomida fiksatsiya qilinib, tegishli markerlar uchun immunobo‘yoq bilan tekshirilgan (S4-jadval). Tasvirlar Leica SP8 konfokal mikroskopida (20x obyektiv) olingan va Fiji dasturida tahrirlangan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Uch qavatli differensiatsiya testi iPSC hujayralarining barcha uchta embrional qatlamga (ektoderma, mezoderma, endoderma) aylanish qobiliyatini tekshirish uchun o‘tkaziladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"genomni-tahrirlash-konstruksiyalarini-yaratish\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#genomni-tahrirlash-konstruksiyalarini-yaratish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Genomni tahrirlash konstruksiyalarini yaratish&lt;/span&gt;&lt;/a&gt;Genomni tahrirlash konstruksiyalarini yaratish&lt;/h4&gt;\n&lt;p&gt;Standart CRISPR/Cas9 uchun Benchling vositasi yordamida ikkita sgRNA loyihalashtirilgan (S6-jadval). GBA1 genini GBA1LP psevdogenidan farqlash uchun sgRNA-4 GBA1 ning 9-ekzonidagi 55-bp nohomologik hududga mo‘ljallangan. Oligonukleotidlar (Eurofins Genomics) fosforillangan va termotsiklerda (37°C da 30 daqiqa, 95°C da 5 daqiqa, 5°C/min tezlikda sovutish) o‘zaro bog‘langan. Reaksiya pX459 yoki pX462 (Addgene #62988, #62987) vektorlari, FastDigest Bpil va T7 ligazasi ishtirokida 6 sikl (37°C va 23°C da 5 daqiqadan) davomida o‘tkazilgan. Chiziqli DNKni yo‘qotish uchun Plasmid-safe DNase ishlatilgan.&lt;/p&gt;\n&lt;p&gt;GBA1 P415R mutatsiyasini tuzatish uchun 30 nt gomologiya qo‘llariga ega ssODN donorlari ishlatilgan. Prime Editing (PE3b) uchun L444P mutatsiyasini o‘z ichiga olgan 10-ekzon nishonga olingan. pegRNA va ngRNA nomzodlari PrimeDesign59 yordamida tanlangan. Vektorlarni yig‘ish uchun pU6-pegRNA-GG (Addgene #132777) vektori BsaI fermenti bilan kesilgan va gel-elektroforez orqali ajratib olingan. Oligonukleotidlar (speyser, kengaytma va skaffold) ligaza yordamida vektorga biriktirilgan. PE3b uchun ngRNA konstruksiyalari BPK1520 (Addgene #65777) vektori va Esp3I fermenti yordamida tayyorlangan. Barcha plazmidlar kompetent hujayralarga transformatsiya qilingan va sekvenlash (hU6 praymeri, EuroFins Genomics) orqali SnapGene dasturida tahlil qilingan.&lt;/p&gt;\n&lt;h4 id=\"bemorlarning-ipsc-liniyalarini-crispr-cas9-va-prime-editing-yordamida-tahrirlash\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#bemorlarning-ipsc-liniyalarini-crispr-cas9-va-prime-editing-yordamida-tahrirlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bemorlarning iPSC liniyalarini CRISPR-Cas9 va Prime Editing yordamida tahrirlash&lt;/span&gt;&lt;/a&gt;Bemorlarning iPSC liniyalarini CRISPR-Cas9 va Prime Editing yordamida tahrirlash&lt;/h4&gt;\n&lt;p&gt;Plazmidalarni tayyorlash uchun EndoFree Maxi Kit (QIAGEN) ishlatildi, DNK miqdori NanoDrop 1000 spektrofotometri yordamida aniqlandi. Bemor iPSC liniyasidagi P415R mutatsiyasini tuzatish uchun &lt;a href=\"concepts/crispr-cas9.html\"&gt;CRISPR-Cas9&lt;/a&gt;, sgRNA va ssODN konstruksiyalari gomologik rekombinatsiyani (HDR) rag'batlantirish uchun kiritildi. 80% zichlikdagi iPSC hujayralari (4,5 × 10⁵) Matrigel qoplangan 6-o'rali planshetlarga 10 mkM RI (ROCK inhibitori) qo'shilgan mTeSR1 muhitida ko'chirildi. Bir kun o'tgach, LipoStem (6 mkl) va DNK aralashmasi (1,5 mkg CRISPR-Cas9 va 0,5 mkg ssODN) yordamida transfeksiya amalga oshirildi. Keyingi ikki kun davomida muhitga puromitsin (1,25 mkg/ml) va RI qo'shildi. Hujayralar 50% zichlikka yetgach, laminin-521 qoplangan planshetlarga o'tkazildi. Diametri 1–2 mm bo'lgan koloniyalar tanlab olinib, 24-o'rali planshetlarda ko'paytirildi. GBA1 nokaut (KO) liniyasini yaratish uchun ssODN ishlatilmadi yoki pX462 plazmidasi va ikkita sgRNA qo'llanildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR-Cas9 usuli sgRNA yordamida DNKning aniq joyini topib, Cas9 fermenti orqali kesishni amalga oshiradi. Matritsa (ssODN) mavjud bo'lganda HDR orqali mutatsiya tuzatiladi, matritsa bo'lmaganda esa gen uzilib, nokaut hosil bo'ladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Nukleofeksiya uchun 20-passajdan past bo'lgan, 60–70% zichlikdagi iPSC hujayralari ishlatildi. Hujayralar Accutase yordamida ajratilib, 8 × 10⁵ hujayra 90 mkl P3 (Lonza) eritmasida suspenziya qilindi. PE3b versiyasi uchun 5 mkg DNK (PE-MAX, pegRNA va sgRNA, 3,5:1:0,5 nisbatda) ishlatildi. Elektroporatsiya Lonza 4D Nucleofector (CB150 dasturi) qurilmasida bajarildi. Blastsidin (10 mkg/ml) bilan seleksiyadan so'ng, hujayralar klonal kengaytirish uchun 40 ta hujayra/o'ra zichligida ekildi. Genotiplash PЦR, MboI yoki XmaI fermentlari bilan kesish va GelRed bo'yoqli agaroz gelida tahlil qilish orqali amalga oshirildi. Allel tarkibini tasdiqlash uchun TOPO-klonlash va 20 ta koloniyani sekvenirlash (SnapGene dasturida tahlil) bajarildi.&lt;/p&gt;\n&lt;h4 id=\"off-target-tahlili\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#off-target-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Off-target tahlili&lt;/span&gt;&lt;/a&gt;Off-target tahlili&lt;/h4&gt;\n&lt;p&gt;P415R sgRNA uchun eng ehtimoliy 5 ta off-target hududi Benchling dasturi yordamida bashorat qilindi (Jadval SN). Ushbu hududlar PЦR (30 sikl: 98°C — 10 s, 66°C — 10 s, 72°C — 30 s) orqali kuchaytirildi va sekvenirlash uchun yuborildi. Natijalar ota-ona liniyasi ketma-ketligi bilan solishtirildi.&lt;/p&gt;\n&lt;h4 id=\"induksiyalangan-neyronlarda-fermentativ-faollik-tahlili\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#induksiyalangan-neyronlarda-fermentativ-faollik-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Induksiyalangan neyronlarda fermentativ faollik tahlili&lt;/span&gt;&lt;/a&gt;Induksiyalangan neyronlarda fermentativ faollik tahlili&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"concepts/in.html\"&gt;Induksiyalangan neyronlar&lt;/a&gt; (iN) 80% konfluentlikdagi iPSC hujayralaridan olingan. Hujayralar (3,5 x 10^5) Matrigel bilan qoplangan 6-o'rali planshetlarga 10 mkM RI qo'shilgan mTeSR1 muhitida ekilgan. Keyingi kuni rtTA va Ngn2 lentiviruslari qo'shilgan. 0-kundan boshlab muhitga 2,5 mkg/ml doksisiklin (Dox) qo'shilgan va tajriba davomida saqlangan. 1-kundan boshlab 0,5% N2 va 1% B27 qo'shilgan BrainPhys muhiti ishlatilgan va 1,25 mkg/ml puromitsin bilan seleksiya o'tkazilgan. 5-kundan boshlab muhit har kuni 10 ng/ml NT3 va 10 ng/ml BDNF qo'shilgan BrainPhys bilan almashtirilgan. 7-kuni hujayralar yig'ib olingan, 300 x g tezlikda sentrifugalangan va -80°C da muzlatilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Induksiyalangan neyronlar (iN) — bu transkripsiya faktorlarini (masalan, Ngn2) ekspressiya qilish orqali ildiz hujayralaridan bevosita neyronlarga aylantirilgan hujayralardir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ferment faolligini o'lchash uchun hujayralar McIlvain buferida (0,2 M Na2HPO4, 0,1 M limon kislotasi, 1% natriy taurat, 0,2% Triton X-100) ultratovush yordamida (2 daqiqa, 100 Vt) parchalangan. Sentrifugalashdan (20 000 x g, 20 daqiqa, 4°C) so'ng, supernatant BCA tahlili yordamida 1 mg/ml oqsil konsentratsiyasiga normallashtirilgan. GCase faolligi 20 mkl namunani 180 mkl substrat buferi (15 mM 4-metilumbelliferilglyukopiranozid) bilan 37°C da 1 soat davomida inkubatsiya qilish orqali o'lchangan. Reaksiya glitsin eritmasi (pH 10,4) bilan to'xtatilgan va floresensiya 365/460 nm to'lqin uzunligida o'lchangan. Faollik (U) 1 soatda 1 nmol 4-metilumbelliferon (4MU) ajralib chiqishiga asoslanib hisoblangan.&lt;/p&gt;\n&lt;h4 id=\"organoidlar-kultivatsiyasi\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#organoidlar-kultivatsiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Organoidlar kultivatsiyasi&lt;/span&gt;&lt;/a&gt;Organoidlar kultivatsiyasi&lt;/h4&gt;\n&lt;p&gt;Kortikal (hCO) va subpallial (hSO) organoidlar STEMdiff to'plamlari yordamida tayyorlangan. iPSC hujayralari (3 x 10^5 hujayra/ml) 10 mkM Y-27632 qo'shilgan muhitda Aggrewell 800 planshetlariga ekilgan va 100 x g tezlikda 3 daqiqa sentrifugalangan. 1-5 kunlari har kuni STEMdiff Neural Organoid Basal medium 1 almashtirilgan. 6-kuni organoidlar Forebrain Organoid Expansion muhitiga o'tkazilgan (har bir o'rada 40-50 ta). 8-25 kunlari muhit har 48 soatda yangilangan. 25-kuni organoidlar soni 15-20 tagacha kamaytirilgan va 43-kungacha differensiatsiya muhitiga o'tkazilgan. 43-kundan boshlab organoidlar (8-10 ta) saqlovchi muhitga (Neurobasal A, 2% B27, 1% Glutamax, 1% Pen/Strep) o'tkazilgan. 49-kundan boshlab oziq moddalar diffuziyasini yaxshilash uchun orbital sheyker (80 ayl/min) ishlatilgan.&lt;/p&gt;\n&lt;h4 id=\"organoidlarni-facs-boyicha-boyash\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#organoidlarni-facs-boyicha-boyash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Organoidlarni FACS bo‘yicha bo‘yash&lt;/span&gt;&lt;/a&gt;Organoidlarni FACS bo‘yicha bo‘yash&lt;/h4&gt;\n&lt;p&gt;Tahlil uchun 75 va 150-kunlik rivojlanish bosqichidagi organoidlarning alohida hujayralari ishlatildi. Sentrifugadan so‘ng hujayra cho‘kmasi 900 mkl sovutilgan PBSda qayta suspenziya qilindi va nazorat hamda tajriba guruhlari o‘rtasidagi hujayra zichligini standartlashtirish uchun 70 mkm o‘lchamli elakdan o‘tkazildi. 250 mkl hajmdagi suspenziya DNA LoBind naychalariga o‘tkazildi. Bo‘yash uchun 250 mkl (2x) eritma (LysoTracker Deep Red 1:5000, LipidTOX Deep Red 1:100 yoki Lipidraft 555 CT-B 1:500) qo‘shildi. Lipidraft 555 namunalari 4°C da 10 daqiqa inkubatsiya qilindi, 200 g da 3 daqiqa sentrifuga qilindi, PBSda qayta suspenziya qilindi va 4°C da yana 15 daqiqa Lipidraft 555 CT-B antitanachalari (1:200) bilan bo‘yaldi. Lysotracker va LipidTOX namunalari xona haroratida 30 daqiqa inkubatsiya qilindi. Hujayralarning hayotchanligi &lt;a href=\"concepts/dapi.html\"&gt;DAPI&lt;/a&gt; (0,1 mkg/ml) yordamida baholandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;FACS (oqimli sitometriya) — suyuqlik oqimidagi hujayralarni tahlil qilish usuli bo‘lib, minglab alohida hujayralarning fizik parametrlari va floresansiya darajasini tezkor baholash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gangliozidlar-yupqa-qatlamli-xromatografiyasi-tlc\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#gangliozidlar-yupqa-qatlamli-xromatografiyasi-tlc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gangliozidlar yupqa qatlamli xromatografiyasi (TLC)&lt;/span&gt;&lt;/a&gt;Gangliozidlar yupqa qatlamli xromatografiyasi (TLC)&lt;/h4&gt;\n&lt;p&gt;Hujayralar metanol/xloroform (1:1, 1 ml) aralashmasida ultratovush yordamida gomogenizatsiya qilindi, so‘ng 0,5 ml suv qo‘shilib, yana ultratovush bilan ishlov berildi. Gangliozidlar oqsillardan 2000 ayl/min tezlikda 20 daqiqa sentrifuga qilish orqali ajratildi. Yuqori suvli faza yig‘ib olindi, organik fazaga esa qayta ekstraksiya uchun 0,25 ml suv qo‘shildi. Birlashtirilgan fazalar Waters LC-18 kolonkasidan o‘tkazildi, gangliozidlar metanol (6 ml) va metanol/xloroform (1:1, 6 ml) bilan elutsiya qilindi. Fraktsiyalar vakuumda bug‘latildi, quruq qoldiq tortildi va metanol/xloroformda eritildi. Tahlil Silica F254 (20x10 sm, 15 mkm) plastinalarida metanol/xloroform/0,2% CaCl2 (45:55:10) mobil fazasida o‘tkazildi. Natijalar orsinol bo‘yog‘i bilan vizuallashtirildi va cho‘chqa miyasi gangliozidlari standartlari bilan solishtirildi. Plastinalar Sony IMX789 (48 MP) kamerasi bilan suratga olindi, tasvirlar ImageJ dasturida tahlil qilindi. Umumiy oqsil miqdorini normallashtirish uchun Lowry usuli qo‘llanildi.&lt;/p&gt;\n&lt;h4 id=\"glyukozilsfingozin-lyso-gb1-ni-lc-ms/ms-orqali-miqdoriy-aniqlash\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#glyukozilsfingozin-lyso-gb1-ni-lc-ms/ms-orqali-miqdoriy-aniqlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Glyukozilsfingozin (lyso-Gb1) ni LC-MS/MS orqali miqdoriy aniqlash&lt;/span&gt;&lt;/a&gt;Glyukozilsfingozin (lyso-Gb1) ni LC-MS/MS orqali miqdoriy aniqlash&lt;/h4&gt;\n&lt;p&gt;Organoidlar (75-kun) quruq muzda muzlatildi. Lizatlar PBSda (10 mg to‘qimaga 100 mkl) ultratovush yordamida tayyorlandi. 10% hajm BCA oqsil tahlili uchun olindi. Qolgan qismiga 3 hajm metanol qo‘shildi, aralashtirildi, 1500 g da 4°C da 5 daqiqa sentrifuga qilindi va supernatant yig‘ib olindi. 100 mkl eritilgan supernatantga 20 mkl ichki standart va 300 mkl atsetonitril qo‘shildi, –20°C da 20 daqiqa inkubatsiya qilindi, so‘ng 1300 ayl/min da 10 daqiqa sentrifuga qilindi. Supernatant azot ostida 40°C da (45–60 daqiqa) bug‘latildi. Qoldiq suv/atsetonitril/chumoli kislotasi (65/35/0,1) aralashmasida eritildi va 15 mkl namuna &lt;a href=\"concepts/zhidkostnaya-hromatografiya-tandemnaya-mass-spektrometriya.html\"&gt;LC-MS/MS&lt;/a&gt; usulida tahlil qilindi.&lt;/p&gt;\n&lt;h4 id=\"bir-hujayrali-rnk-sekvenirovi-scrnaseq\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#bir-hujayrali-rnk-sekvenirovi-scrnaseq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bir hujayrali RNK sekvenirovi (scRNAseq)&lt;/span&gt;&lt;/a&gt;Bir hujayrali RNK sekvenirovi (scRNAseq)&lt;/h4&gt;\n&lt;p&gt;Tahlil uchun 75 ± 3 (7–10 ta) va 150 (2–3 ta) kunlik organoidlar olindi. To‘qimalarni dissotsiatsiya qilish uchun fermentativ usul qo‘llanildi: organoidlar 1 mm² bo‘laklarga bo‘linib, papain (30–50 U/ml), L-tsistein (4 mg/20 ml) va DNKaza I (12500 U/ml) eritmasida 37°C da 75–90 daqiqa davomida inkubatsiya qilindi. Tirik hujayralar Low/High Ovo eritmalari yordamida sentrifugatsiya orqali ajratib olindi. Hujayralar Chromium Fixed RNA Profiling (10X Genomics) protokoli bo‘yicha fiksatsiya qilindi va -80°C da saqlash uchun glitserin qo‘shildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Dissotsiatsiya — to‘qimalarni alohida hujayralarga ajratish jarayoni bo‘lib, u har bir hujayraning RNK profilini o‘rganish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Birlamchi ma’lumotlar Nextflow (CellRanger v7.1.0) konveyeri orqali qayta ishlandi. EmptyDrops (FDR ≤ 0.01) yordamida bo‘sh tomchilar chiqarib tashlandi, natijada har bir namunada 5,7–7,6 mingta hujayra olindi. Keyingi tahlillar R (v4.2.2) va Seurat (v4.3.0) paketi yordamida amalga oshirildi. Ma’lumotlar hCO (bosh miya organoidlari) va hSO (orqa miya organoidlari) guruhlariga ajratildi. Sifat nazorati (QC) doirasida dubletlar (DoubletFinder, 5%) va mitoxondrial genlar miqdori &amp;gt; 15% yoki aniqlangan genlar soni &amp;lt; 2000 bo‘lgan hujayralar olib tashlandi. Yakuniy tanlanmada hCO uchun 43 339 va hSO uchun 39 234 ta hujayra qoldi.&lt;/p&gt;\n&lt;p&gt;Klasterlash UMAP, FindNeighbors va FindClusters usullari bilan bajarildi. hCO uchun integratsiyalashgan tahlil, hSO uchun esa SCT-transformatsiya ishlatildi. Marker genlar Uilkoxon testi (min.pct = 0.8, logFC &amp;gt; 0.65) bilan aniqlandi. Rivojlanish trayektoriyalari Monocle3 yordamida qurildi. Differensial ekspressiya (DEA) t-testi (chegara /log2FC/ &amp;gt; 0.65, padj &amp;lt; 0.05, Bonferroni tuzatishi bilan) orqali baholandi. Funksional boyitish (GO) va GSEA tahlillari clusterProfiler paketi orqali bajarildi (Rasm SN).&lt;/p&gt;\n&lt;h4 id=\"mikroelektrod-matritsalarida-mea-qayd-etish\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#mikroelektrod-matritsalarida-mea-qayd-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mikroelektrod matritsalarida (MEA) qayd etish&lt;/span&gt;&lt;/a&gt;Mikroelektrod matritsalarida (MEA) qayd etish&lt;/h4&gt;\n&lt;p&gt;150 kunlik va undan katta hCO va hSO organoidlari CO₂ va harorat muvozanatlashgan BrainPhys muhitida 60PedotMEA200/30iR-Au matritsalariga o‘tkazildi. Organoidlarni elektrodlar ustida ushlab turish uchun maxsus moslama (harp) ishlatildi. 30 daqiqalik stabilizatsiyadan so‘ng (37^° C, 5% CO₂, 95% O₂), namunalar MEA2100 tizimiga o‘tkazildi. 5 daqiqalik bazaviy yozuvdan so‘ng, ketma-ket ravishda pikrotoksin (PTX, 100 mkM) va PTX (100 mkM), NBQX (5 mkM) hamda DL-APV (100 mkM) aralashmasi qo‘shildi. Har bir bosqichdan so‘ng 5 daqiqalik muvozanat va 5 daqiqalik yozuv amalga oshirildi. Ma’lumotlar .hdf5 formatida saqlanib, Python va R Studio yordamida tahlil qilindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MEA (Microelectrode arrays) — bu neyronlarning elektr faolligini real vaqt rejimida kuzatish imkonini beruvchi qurilma bo‘lib, u organoidlarning funksional yetukligini baholash uchun xizmat qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"yonaltirilgan-dasturlash-orqali-trikulturalarni-yaratish\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#yonaltirilgan-dasturlash-orqali-trikulturalarni-yaratish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yo‘naltirilgan dasturlash orqali trikulturalarni yaratish&lt;/span&gt;&lt;/a&gt;Yo‘naltirilgan dasturlash orqali trikulturalarni yaratish&lt;/h4&gt;\n&lt;p&gt;Induksiyalangan neyronlar (iNs), interneyronlar (iGNs) va astrositlar (iA) olish uchun lentivirusli transduksiya usuli qo‘llanildi. iPSC hujayralari Matrigel qoplamali idishlarga 3 × 10⁵ (iNs), 3,5 × 10⁵ (iGNs) yoki 4 × 10⁵ (iA) miqdorida ekildi. 0-kundan boshlab transgenlar ekspressiyasini faollashtirish uchun muhitga doksisiklin (2,5 mkg/ml) qo‘shildi. Neyronlar va interneyronlar uchun mos ravishda 48 soat davomida puromitsin (1,25 mkg/ml) va gigromitsin (200 mkg/ml) bilan seleksiya o‘tkazildi.&lt;/p&gt;\n&lt;p&gt;5-kundan boshlab neyronlar uchun NT3 va BDNF (10 ng/ml), interneyronlar uchun esa AraC (5 mkM) qo‘shildi. Astrositlar uchun esa FGFb (8 ng/ml), CNTF (5 ng/ml) va BMP4 (10 ng/ml) o‘z ichiga olgan muhit ishlatildi. 7-kuni hujayralar dissotsiatsiya qilindi va 6:3:2 (iN:iGN:iA) nisbatda qayta ekildi (jami 2,8 × 10⁵ hujayra).&lt;/p&gt;\n&lt;h4 id=\"yuqori-zichlikdagi-mikroelektrod-matritsalari-hd-mea\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#yuqori-zichlikdagi-mikroelektrod-matritsalari-hd-mea\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yuqori zichlikdagi mikroelektrod matritsalari (HD-MEA)&lt;/span&gt;&lt;/a&gt;Yuqori zichlikdagi mikroelektrod matritsalari (HD-MEA)&lt;/h4&gt;\n&lt;p&gt;Chimerik trikulturalar «Forward programmed tricultures» protokoli asosida tayyorlandi. MaxTwo 24-o‘rali planshetlar 0,6 ml muhit bilan 48 soat davomida 5% CO2 va 37°C sharoitda konditsiyalandi. O‘ralar 50 mkl 0,1 mg/ml PDL eritmasi bilan qoplandi, 1 soat 37°C da inkubatsiya qilindi va yuvildi. So‘ngra 50 mkl 5 mkg/ml RhLam521 (Biolamina) qo‘shilib, 4°C da saqlandi. Neyronlar, interneyronlar va astrositlar 6:3:2 nisbatda (6,2 × 10⁴ hujayra, 10 mkm Rho-kinaza ingibitori bilan) ekildi. 1 soatdan so‘ng yana 0,6 ml muhit va 1:100 penitsillin/streptomitsin qo‘shildi. 14-54 kunlar oralig‘ida namunalar MaxTwo &lt;a href=\"concepts/hd-mea.html\"&gt;HD-MEA&lt;/a&gt; tizimiga (MaxWell Biosystems) o‘tkazildi. 5 daqiqalik moslashuvdan so‘ng faollik skaneri (90 s, Checker Board) o‘tkazildi. Yozib olish elektrodlari 300 soniyalik bazaviy yozuv asosida tanlandi. 54-kuni 100 mkm pikrotoksin yoki DMSO (nazorat) qo‘shilib, 10 daqiqalik barqarorlashuvdan so‘ng takroriy yozuv olindi. Ma’lumotlar .hdf5 formatida Python va R Studio orqali tahlil qilindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HD-MEA — bu madaniyatdagi minglab neyronlarning elektr faolligini bir vaqtning o‘zida yuqori aniqlikda qayd etish imkonini beruvchi texnologiya.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kalsiy-imijingi\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#kalsiy-imijingi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kalsiy imijingi&lt;/span&gt;&lt;/a&gt;Kalsiy imijingi&lt;/h4&gt;\n&lt;p&gt;14-kuni trikulturalar 0,5 mkl ssAAV-DJ/2-mCaMKIIa-jGCaMP8m-WPRE-bGHp(A) (9,0 × 10¹² vg/ml) vektori bilan transduksiya qilindi. 20-kuni muhit BPIO (BrainPhys Imaging, 0,5% N2, 1% B27, 10 ng/ml NT3 va BDNF) ga almashtirildi. 21-49 kunlar oralig‘ida har hafta bazaviy yozuv, 10 mkm bikukullin bilan ishlov berish va 3 daqiqalik takroriy yozuv amalga oshirildi. Yuvishdan so‘ng hujayralar yangi va konditsiyalangan BPIO muhitiga qaytarildi. Ultimeyes mikroskopi (Cairn GmBH) yordamida 20 Gts chastotada (CellCam Kikker kamerasi, GFP filtri) tasvirlar olindi. Kalsiy signallari NetCal78 dasturi yordamida tahlil qilindi.&lt;/p&gt;\n&lt;h4 id=\"statistik-tahlil\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#statistik-tahlil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Statistik tahlil&lt;/span&gt;&lt;/a&gt;Statistik tahlil&lt;/h4&gt;\n&lt;p&gt;Barcha tajribalar 3 ta biologik takroriy namunada bajarildi. Natijalar o‘rtacha ± SEM ko‘rinishida ifodalandi. Statistik tahlil Prism dasturida rasmlar izohlarida ko‘rsatilgan testlar yordamida amalga oshirildi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta-f3.jpg\" alt=\"Rasm 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta-f4.jpg\" alt=\"Rasm 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta-f6.jpg\" alt=\"Rasm 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 6&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta-f7.jpg\" alt=\"7-rasm. Ximerik to'g'ridan-to'g'ri dasturlashtirilgan trikulturalardagi CAMKIIa-GCaMP8m kalsiy vizualizatsiyasi qo'zg'al\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-rasm. Ximerik to'g'ridan-to'g'ri dasturlashtirilgan trikulturalardagi CAMKIIa-GCaMP8m kalsiy vizualizatsiyasi qo'zg'alish va tormozlanish muvozanatsizligini ko'rsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;7-rasm. Ximerik to'g'ridan-to'g'ri dasturlashtirilgan trikulturalardagi CAMKIIa-GCaMP8m kalsiy vizualizatsiyasi qo'zg'alish va tormozlanish muvozanatsizligini ko'rsatadi. A) Har bir madaniyat holati uchun rivojlanishning 49-kunida (DIV49) bikukullin (BIC) qo'shilishidan oldin (CONTROL) va darhol keyin olingan kalsiy vizualizatsiyasi yozuvidan olingan spayklarni ko'rsatuvchi rastr grafiklari. B) Bikukullin (BIC) qo'shilishidan oldin (Control) va keyin (DIV28 dan DIV49 gacha) vaqt o'tishi bilan jamoaviy hodisalar hajmini ko'rsatuvchi, jamoaviy faoliyat hodisalarida ishtirok etuvchi hujayralarning foizi sifatida ifodalangan grafiklar. C) Bikukullin (BIC) qo'shilishidan oldin (Control) va keyin (DIV28 dan DIV49 gacha) har bir hujayra uchun cho'qqilar sonini ko'rsatuvchi grafiklar. D) Bikukullin (BIC) qo'shilishidan oldin (Control) va keyin (DIV28 dan DIV49 gacha) vaqt o'tishi bilan har bir cho'qqining egri chizig'i ostidagi maydonni ko'rsatuvchi grafiklar.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Goshe&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;kasalligida&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt
