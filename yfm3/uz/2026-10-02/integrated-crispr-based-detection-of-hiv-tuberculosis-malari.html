        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"229\" cy=\"138\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"531\" cy=\"257\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · INFECTIOUS DISEASES   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ОИВ, туберкулез ва малярияни&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;бир вақтда аниқлайдиган&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;CRISPR-тест яратилди&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari-f1.jpg\" alt=\"HTM CARMEN CRISPR diagnostika paneli dizayni va ish jarayoni.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;HTM CARMEN &lt;a href=\"concepts/skrining-crispr-s-kombinatsiyami-preparatov.html\"&gt;CRISPR&lt;/a&gt; diagnostika paneli dizayni va ish jarayoni.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;HTM CARMEN CRISPR diagnostika paneli dizayni va ish jarayoni. (A) HTM CARMEN ish jarayoni sxemasi, namunalarni yig'ish, nuklein kislotalarni ajratib olish, nishonni kuchaytirish va CARMEN platformasida CRISPR-Cas13a aniqlash, shuningdek OIV, Plasmodium, Mtb va koinfeksiyalarni multipleks aniqlashni tasvirlaydi. (B) Plasmodium turlarini farqlash uchun dizayn strategiyasi. P. falciparum, P. vivax, P. ovale va P. malariae 18S rRNA ketma-ketliklarining konsensus ketma-ketliklari bo'ylab ketma-ketlik saqlanishi, kuchaytiruvchi praymerlar va turga xos crRNAlarning o'rinlari bilan birga ko'rsatilgan. Praymerlar saqlanib qolgan hududlar ichida joylashtirilgan, crRNAlar esa ADAPT yordamida aniqlangan turlarni ajratuvchi hududlarga qaratilgan. (C) Mtb inhA promouteri −777 C&amp;gt;T va katG S315T/N lokuslari uchun allelga xos crRNA aniqlash sxemasi. Tegishli crRNA-nishon juftlashuvi Cas13a faollashuvini va floresans hosil bo'lishini rag'batlantiradi, bir nukleotidli nomuvofiqlik esa faollashuvni pasaytiradi, bu esa nisbiy floresans signallari asosida yovvoyi tur va mutant allellarni farqlash imkonini beradi. (D) Tanlangan Plasmodium va Mtb tahlillarining NCBI ketma-ketlik ma'lumotlar bazalari bo'yicha bashorat qilingan ketma-ketlik qamrovi. Qamrov praymer bog'lanishi va crRNA faolligini qo'llab-quvvatlashi bashorat qilingan ketma-ketliklar ulushini ifodalaydi. Har bir tahlil uchun baholangan jami ketma-ketliklarga nisbatan qoplangan ketma-ketliklar soni ko'rsatilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;ОИВ, туберкулез ва малярия кўпинча бир вақтнинг ўзида учрайди, аммо мавжуд диагностика ҳар бир касалликни алоҳида текширишни талаб қилади. Бу эса даволашни кечиктиради ва хавфни оширади. Тадқиқотчилар CRISPR-Cas13a асосидаги HTM CARMEN мультиплекс платформасини тақдим этдилар. У биргина таҳлил орқали маляриянинг тўрт турини, ОИВ-1, ОИВ-2, туберкулез таёқчаси ва изониазидга чидамлилик мутацияларини аниқлай олади.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;CRISPR-тест ОИВ, туберкулез, малярия ва дорига чидамлиликни бир вақтда аниқлайди&lt;/li&gt;\n&lt;li&gt;Клиник намуналарда аниқлик кўрсаткичи малярия ва ОИВ учун 95%, туберкулез учун 100% бўлди&lt;/li&gt;\n&lt;li&gt;Тизим қон, сариқсув, балоғам ва қуритилган қон доғларида ҳам бирдек аниқ ишлайди&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;HTM CARMEN тизими Leptotrichia wadei Cas13a (LwaCas13a) оқсили ва ADAPT ҳамда BADGERS алгоритмлари ёрдамида лойиҳаланган кРНК (crRNA) тўпламидан фойдаланади. Нуклеин кислоталар ажратиб олингач, вақт ва ресурсларни тежаш учун 8 та нишон бўйича ягона мультиплекс тескари транскрипцияли ПЗР ўтказилади. Нишон кетма-кетлиги аниқланганда Cas13a ферменти қўшимча РНК парчалаш фаоллигини кўрсатиб, флуоресцент зондларни парчалайди. Тизим Plasmodium'нинг 4 турини, ОИВ-1, ОИВ-2, Mycobacterium tuberculosis (Mtb) ва изониазидга чидамлиликка масъул inhA −15 C&amp;gt;T ҳамда katG S315T/N мутацияларини фарқлайди.&lt;/p&gt;\n&lt;p&gt;Клиник намуналар киритилган синовларда тестнинг сезувчанлиги малярия учун 95% (19/20), ОИВ-1 учун 95% (19/20) ва Mtb учун 100% (30/30) ни ташкил этди. Барча намуналар бўйича ўзига хослик (специфичность) 100% га тенг бўлди. Бундан ташқари, платформа ОИВ ва туберкулез ко-инфекцияси тасдиқланган барча 9 та клиник намунада иккала патогенни ҳам аниқ кўрсатиб берди.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тадқиқот кичик клиник танланмада (ҳар бир патоген учун 9-30 та намуна) ўтказилган ва мақола препринт мақомига эга бўлиб, мустақил текширувни талаб қилади.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;OIV, sil va bezgak ko'pincha bir hududda tarqalgan yuqumli kasalliklar bo'lib, ularning diagnostikasi odatda alohida-alohida amalga oshiriladi, bu esa koinfektsiyalarni aniqlash va dori vositalariga chidamlilikni tekshirishni qiyinlashtiradi. Mualliflar HTM CARMEN tizimini ishlab chiqdilar — bu CRISPR-Cas13a asosidagi yuqori darajada multiplekslangan molekulyar diagnostika platformasi bo'lib, u OIV-1, OIV-2, to'rt turdagi Plasmodium va Mycobacterium tuberculosis (Mtb) ni, shuningdek, izoniazidga chidamlilik bilan bog'liq inhA va katG variantlarini aniqlash imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HTM CARMEN tizimi OIV, sil va bezgakni bir vaqtning o'zida aniqlash hamda dori vositalariga chidamlilikni tekshirish imkonini beradi, bunda Mtb uchun 100%, OIV-1 va bezgak uchun 95% aniqlik qayd etilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR-Cas13a — bu RNKni tahrirlash tizimi bo'lib, diagnostikada patogenning o'ziga xos ketma-ketligini aniqlaganda faollashadigan va floresan signal hosil qiluvchi «molekulyar qaychi» vazifasini bajaradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Laboratoriya sinovlarida tizim yuqori selektivlik va bir nukleotidli farqlarni aniqlash qobiliyatini namoyish etdi. Sinovlar butun qon, zardob, balg'am va quritilgan qon dog'lari kabi turli muhitlarda o'tkazildi. Har bir holat uchun 20 ta sun'iy namunani tahlil qilishda HTM CARMEN qPCR usuliga qaraganda past konsentratsiyali patogenlarni aniqlashda yuqori samaradorlik ko'rsatdi. P. falciparum/OIV-1 va Mtb/OIV-1 koinfektsiyalari modellarida har ikki patogen turli nisbatlarda muvaffaqiyatli aniqlandi.&lt;/p&gt;\n&lt;p&gt;Tasdiqlangan klinik namunalarda usul bezgak uchun 95% (19/20), OIV-1 uchun 95% (19/20) va Mtb uchun 100% (30/30) ijobiy moslikni (PPA) ko'rsatdi. Salbiy moslik (NPA) barcha maqsadli ko'rsatkichlar uchun 100% ni tashkil etdi. Shuningdek, tizim OIV-sil koinfektsiyasi tasdiqlangan barcha to'qqizta namunada ikkala patogenni ham aniqladi. Bu natijalar ko'p maqsadli diagnostika va chidamlilikni tahlil qilishni yagona platformada birlashtirish istiqbolli ekanligini tasdiqlaydi.&lt;/p&gt;\n&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"infeksiyalarning-global-yuki-va-diagnostik-muammolar\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#infeksiyalarning-global-yuki-va-diagnostik-muammolar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Infeksiyalarning global yuki va diagnostik muammolar&lt;/span&gt;&lt;/a&gt;Infeksiyalarning global yuki va diagnostik muammolar&lt;/h4&gt;\n&lt;p&gt;Sil (TB), OIV va bezgak har yili 270-280 millionga yaqin odamga ta'sir qiladi, bu asosan past va o'rta daromadli mamlakatlarda kuzatiladi. Hozirgi klinik diagnostika ko'pincha bitta patogenga yo'naltirilgan testlarga tayanadi, bu esa koinfeksiyalarni aniqlashni qiyinlashtiradi. Ushbu kasalliklar bir vaqtning o'zida tarqalgan hududlarda integratsiyalashgan tizimlarning yo'qligi davolash va epidemiologik nazoratda «ko'r nuqtalar»ni yuzaga keltiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Har yili 280 milliongacha TB, OIV va bezgak holatlari qayd etiladi, bitta patogenga mo'ljallangan diagnostika usullari esa koinfeksiyalarni aniqlashda samarasizdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"koinfeksiyalarning-klinik-ahamiyati\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#koinfeksiyalarning-klinik-ahamiyati\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Koinfeksiyalarning klinik ahamiyati&lt;/span&gt;&lt;/a&gt;Koinfeksiyalarning klinik ahamiyati&lt;/h4&gt;\n&lt;p&gt;OIV silga moyillikni oshiradi va ko'pincha balg'am orqali tashxis qo'yish qiyin bo'lgan o'&lt;a href=\"concepts/protein-kinase-a.html\"&gt;pka&lt;/a&gt; tashqari shakllarini keltirib chiqaradi. &lt;em&gt;Plasmodium&lt;/em&gt; turkumiga mansub to'rt turdagi (&lt;em&gt;P. falciparum&lt;/em&gt;, &lt;em&gt;P. vivax&lt;/em&gt;, &lt;em&gt;P. ovale&lt;/em&gt;, &lt;em&gt;P. malariae&lt;/em&gt;) bezgak ham OIV va sil bilan kesishadi. Koinfeksiyalar davolashni murakkablashtiradi: masalan, silni davolashda ishlatiladigan rifampitsin bezgakka qarshi artemizinin asosidagi preparatlar samaradorligini pasaytiradi. Bundan tashqari, mavjud usullar ko'pincha izoniazidga (INH) chidamlilikni e'tiborsiz qoldirib, faqat rifampitsinga (RIF) e'tibor qaratadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sindromika — bu bir nechta kasalliklar uchun xos bo'lgan klinik belgilar majmuasi bo'lib, u koinfeksiyalar vaqtida differensial tashxisni qiyinlashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"carmen-texnologiyasi-va-htm-panelini-ishlab-chiqish\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#carmen-texnologiyasi-va-htm-panelini-ishlab-chiqish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CARMEN texnologiyasi va HTM-panelini ishlab chiqish&lt;/span&gt;&lt;/a&gt;CARMEN texnologiyasi va HTM-panelini ishlab chiqish&lt;/h4&gt;\n&lt;p&gt;Mualliflar ushbu muammolarni hal qilish uchun CRISPR-Cas13a asosidagi CARMEN platformasidan foydalanishdi. Ushbu texnologiya yuqori unumdorlikni ta'minlaydi: bitta mikrofluidik chipda 192 ta namunani 24 ta test bilan tahlil qilib, jami 4608 ta reaksiya o'tkazish imkonini beradi. HTM CARMEN paneli OIV-1, OIV-2, sil (INHga chidamlilik markerlari bilan) va &lt;em&gt;Plasmodium&lt;/em&gt; turlarini farqlashni birlashtiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SHERLOCK va CARMEN — bu Cas13 fermentidan foydalanadigan molekulyar diagnostika usullari bo'lib, ular maqsadli RNKni aniqlaganda reporter molekulalarni kesib, o'lchanadigan signal hosil qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"validatsiya-va-samaradorlikni-baholash\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#validatsiya-va-samaradorlikni-baholash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Validatsiya va samaradorlikni baholash&lt;/span&gt;&lt;/a&gt;Validatsiya va samaradorlikni baholash&lt;/h4&gt;\n&lt;p&gt;Mualliflar &lt;em&gt;in vitro&lt;/em&gt; sharoitida tahlilning o'ziga xosligi va bir nukleotidli o'zgarishlarni farqlash qobiliyatini baholadilar. Sinovlar balg'am, zardob, butun qon va quritilgan qon dog'lari kabi turli biomateriallarda o'tkazildi. Tizim samaradorligi sun'iy namunalar yordamida miqdoriy PZR (qPCR) bilan solishtirildi. Yakuniy bosqichda bezgak, OIV yoki sil bilan kasallangan, shuningdek, OIV-sil koinfeksiyasi bo'lgan klinik namunalar tekshirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot metodologik ishlanma hisoblanadi; tizimning real klinik sharoitdagi samaradorligi qo'shimcha tekshiruvlarni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"htm-multipleks-panelini-loyihalash-va-ishlab-chiqish\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#htm-multipleks-panelini-loyihalash-va-ishlab-chiqish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HTM multipleks panelini loyihalash va ishlab chiqish&lt;/span&gt;&lt;/a&gt;HTM multipleks panelini loyihalash va ishlab chiqish&lt;/h4&gt;\n&lt;p&gt;Biz HTM CARMEN tizimini ishlab chiqdik — bu patogenlarni aniqlash, Plasmodium turlarini farqlash va Mycobacterium tuberculosis (Mtb) ning izoniazidga (INH) chidamliligi bilan bog'liq variantlarni aniqlash uchun mo'ljallangan CRISPR-Cas13a multipleks paneli (1-rasm A). Panel 11 ta diagnostik testni o'z ichiga oladi: Plasmodium falciparum (Pf), Plasmodium vivax (Pv), Plasmodium ovale (Po), Plasmodium malariae (Pm), HIV-1, HIV-2, Mtb IS6110 insersiya ketma-ketligi hamda inhA (promotor -777 C&amp;gt;T) va katG (S315T/N) lokuslaridagi yovvoyi va mutant allellar (S1-S3 jadvallari).&lt;/p&gt;\n&lt;p&gt;Plasmodium turlarini farqlash uchun crRNKlar 18S rRNK lokusining turlarni ajratuvchi hududlariga mo'ljallangan, kuchaytiruvchi praymerlar esa barcha to'rt turni bir vaqtda kuchaytirish uchun konservativ yon hududlarga joylashtirilgan (1-rasm B, S4 jadvali). Nazorat uchun Babesia microti (Bm) va Toxoplasma gondii (Tg) ga qarshi crRNKlar qo'shildi (S2-S3 jadvallari, S3-rasm A). Nomzod crRNKlar ADAPT mashinali o'qitish tizimi yordamida tanlab olindi. Mtb uchun yuqori sezuvchanlikka ega IS6110 ketma-ketligi tanlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR-Cas13a — bu RNKni nishonga oluvchi tizim bo'lib, u maqsadli ketma-ketlikni aniqlagandan so'ng reporter molekulalarni kesib, floresan signal hosil qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;INHga chidamlilikni tahlil qilish uchun biz ikki tomonlama crRNK yondashuvini qo'lladik: biri yovvoyi tur (WT), ikkinchisi mutant (MUT) ketma-ketlikka mo'ljallangan (1-rasm C). Bu har bir genotip uchun mustaqil signal olish imkonini beradi. Dizayn BADGERS-Cas13 hisoblash platformasi orqali amalga oshirildi. Panelga HIV-1 va HIV-2 uchun avval tasdiqlangan crRNKlar ham kiritildi.&lt;/p&gt;\n&lt;p&gt;Genomik ma'lumotlar bazalarini tahlil qilish tizimning yuqori samaradorligini ko'rsatdi (1-rasm D). Qamrov darajasi 95% dan 100% gacha bo'ldi: Pf 18S uchun 95,8% (68/71), Pv uchun 100% (15/15), Po uchun 100% (34/34), Pm uchun 100% (6/6), Mtb IS6110 uchun 99,1% (9364/9445), inhA uchun 98,3% (178/181) va katG uchun 100% (1000/1000).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HTM multipleks paneli 95-100% genomik qamrovni ta'minlaydi va Mtb, OIV, bezgak plazmodiylari hamda INHga chidamlilikni bir vaqtda aniqlashga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"htm-tahlillarining-yuqori-oziga-xosligi-va-snp-diskriminatsiyasi\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#htm-tahlillarining-yuqori-oziga-xosligi-va-snp-diskriminatsiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HTM tahlillarining yuqori o‘ziga xosligi va SNP diskriminatsiyasi&lt;/span&gt;&lt;/a&gt;HTM tahlillarining yuqori o‘ziga xosligi va SNP diskriminatsiyasi&lt;/h4&gt;\n&lt;p&gt;Dastlab biz ishlab chiqilgan crRNA faolligini alohida SHERLOCK reaksiyalarida ularning nishonlariga nisbatan baholadik. Har bir kuchaytirilgan nishon kamayib boruvchi konsentratsiyalarda tegishli crRNA va Cas13a oqsili bilan inkubatsiya qilindi, so‘ngra floresan tahlili o‘tkazildi (Rasm S1). Tanlangan barcha crRNA uchun minimal fon signali bilan tez va kuchli floresan faollashuvi kuzatildi. Keyin biz CARMEN multipleks formatida o‘zaro reaktivlikni baholadik. HTM panelidagi har bir nishon uchun genomik yoki sintetik material paneldagi har bir crRNA ga qarshi sinovdan o‘tkazildi (Rasm 2A, Rasm S2). Floresan faollashuvi asosan mo‘ljallangan nishon-crRNA juftliklari bilan cheklanganligi aniqlandi, faqat Mtb genomik DNKsi kutilganidek IS6110, inhA va katG lokuslari uchun signal berdi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari-f2.jpg\" alt=\"HTM CARMEN panelining analitik o'ziga xosligi va samaradorligi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;HTM CARMEN panelining analitik o'ziga xosligi va samaradorligi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;HTM CARMEN panelining analitik o'ziga xosligi va samaradorligi. (A) In vitro sharoitida HTM CARMEN tahlillarining multipleks sezgirligi va o'ziga xosligi. Issiqlik xaritasi 10^4 dan 10^-1 nusxa/mkl gacha bo'lgan konsentratsiyalarda ko'rsatilgan genomik yoki sintetik nishonlar uchun 60 daqiqada normallashtirilgan floresansni ko'rsatadi. (B) inhA promouteri −777 C&amp;gt;T va katG S315T/N lokuslariga qaratilgan crRNAlarning allel diskriminatsiyasi. Maqsadli/maqsadli bo'lmagan floresans nisbatlari 60 daqiqada yovvoyi turdagi Mtb genomik DNK yoki 10^4 nusxa/mkl dagi sintetik mutant gBlocks yordamida hisoblab chiqilgan. Uzuk chiziq 2 nisbatini ko'rsatadi, bu allelni afzal ko'rishning yo'qligiga mos keladi. Ma'lumotlar uchta mustaqil biologik takrorlashdan olingan o'rtacha ± SD sifatida ko'rsatilgan. (C) To'rtta Plasmodium turlari tahlilining va 10^4 nusxa/mkl da sinovdan o'tgan tegishli apikompleks nazoratlar Toxoplasma gondii va Babesia microti ning o'zaro analitik o'ziga xosligi. (D) Mtb IS6110 crRNA ning Mtb va sakkizta sil bo'lmagan mikobakteriya turlariga nisbatan 10^4 nusxa/mkl dagi o'ziga xosligi. Uzuk chiziq tahlilning ijobiy chegarasini ko'rsatadi, bu nishonsiz nazorat o'rtacha qiymati va uchta standart og'ish sifatida belgilangan. (E-G) (E) Plasmodium, (F) OIV va (G) Mtb sub-panellari uchun in vitro nishon suyultirish seriyasi bo'ylab qPCR sikl chegarasi (Ct) va normallashtirilgan CARMEN floresansi o'rtasidagi bog'liqlik. Uzuk vertikal chiziq 38 sikldagi qPCR Ct chegarasini bildiradi, undan yuqorisi qPCR natijalari aniqlanmagan deb hisoblanadi. NTC = Nishonsiz nazorat.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HTM tahlillari patogenlar, turlar va hatto yagona nukleotid o‘zgarishlarini (SNP) 13.69 gacha bo‘lgan signal/shovqin nisbati bilan samarali ajratib ko‘rsatib, yuqori selektivlikni namoyon etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;WT va MUT nishonlari bitta nukleotid bilan farqlanganligi sababli, biz inhA va katG uchun juft crRNA yordamida allellarni ajratish qobiliyatini miqdoriy baholadik. 10⁴ nusxa/mkl⁻¹ konsentratsiyada har bir crRNA o‘z allelini afzal ko‘rdi. Maqsadli/no-maqsadli faollik nisbati inhA WT uchun 13.69 ± 3.08, inhA MUT uchun 4.38 ± 0.92, katG WT uchun 3.15 ± 0.39 va katG MUT uchun 3.99 ± 0.77 ni tashkil etdi (Rasm 2B, Rasm S3B, Jadval S5). Eng yaxshi diskriminatsiya inhA gidlarida kuzatildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SNP (yagona nukleotid polimorfizmi) — bu DNK ketma-ketligidagi bitta nukleotid farqi bo‘lib, u bakteriyalarning antibiotiklarga chidamliligini belgilashi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz shuningdek, yaqin turlar bo‘yicha o‘ziga xoslikni tekshirdik. Plasmodium uchun o‘ziga xoslik matritsasida to‘rtta test boshqa Plasmodium, Tg va Bm turlariga nisbatan o‘z nishonini aniqladi (Rasm 2C). Mtb testlari sakkizta tuberkulyoz bo‘lmagan mikobakteriya (NTM) turlariga qarshi sinaldi. IS6110, inhA WT va katG WT uchun signallar faqat Mtb uchun kuchli bo‘ldi, NTM uchun esa aniqlash chegarasidan past qoldi (Rasm 2D, Rasm S3C-D). Yakunida biz CARMEN floresansiyasini qPCR Ct qiymatlari bilan solishtirdik. Teskari &lt;a href=\"concepts/ld.html\"&gt;bog‘liqlik&lt;/a&gt; aniqlandi: noaniq o‘lchovlar (Ct ≥38) chiqarib tashlanganda, Pirson korrelyatsiya koeffitsiyentlari -0.75 dan -0.96 gacha bo‘ldi (Rasm 2E-G, Jadval S6).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar in vitro laboratoriya sharoitida olingan; klinik namunalardagi samaradorlik biologik matritsaning murakkabligi tufayli farq qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"htm-carmen-klinik-namunalarda-yuqori-sezgirlik-va-selektivlikni-saqlab-qoladi\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#htm-carmen-klinik-namunalarda-yuqori-sezgirlik-va-selektivlikni-saqlab-qoladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HTM CARMEN klinik namunalarda yuqori sezgirlik va selektivlikni saqlab qoladi&lt;/span&gt;&lt;/a&gt;HTM CARMEN klinik namunalarda yuqori sezgirlik va selektivlikni saqlab qoladi&lt;/h4&gt;\n&lt;p&gt;&lt;em&gt;In vitro&lt;/em&gt; sharoitda analitik selektivlik tasdiqlangandan so‘ng, biz HTM CARMEN platformasining klinik ahamiyatga ega matritsalarda (balg‘am, zardob, butun qon va quritilgan qon dog‘lari - DBS) ishlashini baholadik (3-rasm, S4–S10-rasmlar). Patogen bo‘lmagan nazorat namunalarida floresans past darajada qoldi, sun’iy zararlangan namunalarda esa barcha konsentratsiyalarda maqsadli signal qayd etildi (S4-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HTM CARMEN murakkab biologik matritsalarda ham nukleotidlar ketma-ketligini farqlash qobiliyatini saqlab qoladi, bunda maqsadli va nojo‘ya signal nisbati 2,99 dan 9,05 gacha bo‘ladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz &lt;em&gt;inhA&lt;/em&gt; va &lt;em&gt;katG&lt;/em&gt; genlari misolida allellarni farqlash qobiliyati saqlanib qolganini tasdiqladik. Har bir matritsa uchun 20 ta namunada maqsadli allelga ustunlik barqaror bo‘lib qoldi. Maqsadli/nojo‘ya faollik nisbati o‘rtacha qiymatlari: balg‘am uchun 2,99–9,05, butun qon uchun 2,99–8,92 va DBS uchun 4,17–6,08 ni tashkil etdi (3A–C-rasmlar, S7-jadval).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sun’iy zararlangan namunalar (contrived samples) — bu test tizimining aniqligini tekshirish uchun ma’lum miqdordagi patogen genetik materiali qo‘shilgan biologik namunalar.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Aniqlash chastotasi har bir konsentratsiya uchun 20 ta namunada baholandi. Butun qondagi &lt;em&gt;Pf&lt;/em&gt; DNKsi uchun CARMEN 10³, 10² va 10¹ nusxa/mkl konsentratsiyalarida 18/20, 10⁰ nusxa/mkl da esa 10/20 ijobiy natija ko‘rsatdi (3D-rasm). OIV-1 RNKsi uchun: 10³ nusxa/mkl da 20/20 va 10², 10¹, 10⁰ nusxa/mkl da 19/20 ijobiy natija qayd etildi (3E-rasm). Balg‘amdagi &lt;em&gt;Mtb IS6110&lt;/em&gt; uchun 10³ dan 10⁻¹ nusxa/mkl gacha bo‘lgan diapazonda 20/20 ijobiy natija olindi (3F-rasm, S6–S9-rasmlar).&lt;/p&gt;\n&lt;p&gt;CARMEN va qPCR usullarini solishtirish shuni ko‘rsatdiki, past konsentratsiyalarda CARMEN yuqori samaradorlikka ega. Masalan, 10¹ nusxa/mkl konsentratsiyada butun qonda CARMEN &lt;em&gt;Pf&lt;/em&gt; ni 18/20 holatda, qPCR esa 7/20 holatda aniqladi (3G, H-rasmlar). Balg‘amdagi &lt;em&gt;Mtb IS6110&lt;/em&gt; uchun 10⁻¹ nusxa/mkl da CARMEN 20/20, qPCR esa 3/20 natija ko‘rsatdi (3I-rasm, S8-jadval).&lt;/p&gt;\n&lt;h4 id=\"oiv-malyariya-va-oiv-sil-suniy-koinfeksiyalarini-multipleks-aniqlash\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#oiv-malyariya-va-oiv-sil-suniy-koinfeksiyalarini-multipleks-aniqlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;OIV-malyariya va OIV-sil sun'iy koinfeksiyalarini multipleks aniqlash&lt;/span&gt;&lt;/a&gt;OIV-malyariya va OIV-sil sun'iy koinfeksiyalarini multipleks aniqlash&lt;/h4&gt;\n&lt;p&gt;Biz HTM CARMEN platformasining bir tahlil doirasida bir nechta infeksiyalarni bir vaqtning o‘zida aniqlash qobiliyatini baholadik. Buning uchun klinik jihatdan ahamiyatli muhitlarda OIV-1 va bezgak qo‘zg‘atuvchisi (Pf) yoki OIV-1 va sil mikobakteriyasi (Mtb) kombinatsiyalari bo‘lgan namunalar tayyorlandi. Pf va OIV-1 bo‘lgan butun qonda tegishli crRNKlar yordamida har ikkala patogen uchun ham floresan signal qayd etildi, bunda faqat bitta patogen bo‘lgan namunalar kutilgan o‘ziga xos signallarni berdi (4A-rasm, S12-rasm). Xuddi shunday natijalar Mtb va OIV-1 bo‘lgan balg‘am namunalarida ham kuzatildi: floresan faollashuvi faqat maqsadli kanallarda kuzatilib, noo‘rin patogenlar uchun minimal faollashuv qayd etildi (4B-rasm, S12-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CARMEN platformasi ikkita patogenni bir vaqtning o‘zida muvaffaqiyatli aniqlaydi va hatto past konsentratsiyalarda ham qPCR ko‘rsatkichlaridan ustun bo‘lgan yuqori sezgirlikni namoyish etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;crRNK (CRISPR-RNK) — bu Cas fermentlarini patogenning aniq DNK yoki RNK ketma-ketliklariga yo‘naltiruvchi va nishon aniqlanganda floresan signalni ishga tushiruvchi yo‘riqchi molekulalardir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Metod samaradorligi har bir konsentratsiya kombinatsiyasi uchun 20 ta sun'iy namunada qPCR bilan solishtirildi (4C–F-rasmlar, S12-rasm). Pf va OIV-1 koinfeksiyasi uchun CARMEN keng konsentratsiya diapazonida aniqlashning yuqori chastotasini saqlab qoldi. Har ikkala patogen 10¹ nusxa/mkl konsentratsiyasida bo‘lganda, CARMEN Pfni 19/20 holatda va OIV-1ni 18/20 holatda aniqladi, qPCR esa mos ravishda 8/20 va 9/20 holatda aniqladi. Konsentratsiya 10⁰ nusxa/mkl gacha kamaytirilganda, CARMEN Pfni 18/20 va OIV-1ni 14/20 namunada aniqladi, qPCR esa atigi 3/20 va 4/20 holatda aniqladi.&lt;/p&gt;\n&lt;p&gt;Balg‘amdagi Mtb va OIV-1 koinfeksiyasi uchun 10¹ nusxa/mkl konsentratsiyasida CARMEN har ikkala patogen uchun 20/20 muvaffaqiyatli aniqlashni ko‘rsatdi, qPCR esa 12/20 (Mtb) va 18/20 (OIV-1) natijani qayd etdi (4E–F-rasmlar). 10⁰ nusxa/mkl konsentratsiyasida CARMEN har bir patogenni 18/20 namunada aniqladi, qPCR esa mos ravishda 11/20 va 12/20 natijani ko‘rsatdi. Bu ma'lumotlar CARMEN multiplekslash jarayoni past konsentratsiyalarda ham nishonlarni aniqlashga to‘sqinlik qilmasligini va bu sharoitlarda metod barqaror ravishda qPCRdan ustunligini tasdiqlaydi.&lt;/p&gt;\n&lt;h4 id=\"oiv,-bezgak,-sil-va-oiv-sil-koinfeksiyasini-klinik-aniqlash\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#oiv,-bezgak,-sil-va-oiv-sil-koinfeksiyasini-klinik-aniqlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;OIV, bezgak, sil va OIV-sil koinfeksiyasini klinik aniqlash&lt;/span&gt;&lt;/a&gt;OIV, bezgak, sil va OIV-sil koinfeksiyasini klinik aniqlash&lt;/h4&gt;\n&lt;p&gt;Sun'iy matritsalarda tahliliy samaradorlikni tasdiqlaganimizdan so'ng, biz CARMEN tizimini patogen kulturalaridan ajratib olingan nuklein kislotalar yordamida baholadik. Usul &lt;em&gt;P. falciparum&lt;/em&gt; (Pf) ni 1% dan 0,01% gacha bo'lgan parazitemiya diapazonida, OIV-1 RNKni 10⁷ dan 100 nusxa/mkl gacha konsentratsiyalarda va &lt;em&gt;M. tuberculosis&lt;/em&gt; (Mtb) ni 10 000, 100 va 1 KOE/ml konsentratsiyalarda aniqladi (Rasm S13A-C). CARMEN floresansiyasi qPCR Ct qiymatlari bilan kutilgan teskari bog'liqlikni ko'rsatdi (Rasm S13D-F).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CARMEN tizimi yuqori sezuvchanlikni namoyon etib, patogenlarni keng konsentratsiya diapazonida aniqladi va floresansiya signali standart qPCR natijalari bilan mos keldi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Keyinchalik biz klinika namunalarida to'liq multipleks panelni qo'lladik (Rasm 5). Bezgak bilan kasallangan 20 ta tasdiqlangan namunadan 19 tasi (95%) aniqlandi, 10 ta salbiy namuna esa to'g'ri klassifikatsiya qilindi (Rasm 5A-B, Rasm S14). OIV-1 uchun ham xuddi shunday natijalar olindi: 20 ta ijobiy namunadan 19 tasi (95%) aniqlandi, 10 ta salbiy namuna esa to'g'ri aniqlandi (Rasm 5C-D, Rasm S14). Sil kasalligi bo'yicha 30 ta ijobiy namunada CARMEN IS6110 markerini 100% holatda aniqladi, 20 ta salbiy namuna esa salbiy bo'lib qoldi (Rasm 5E-F, Rasm S14).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari-f5.jpg\" alt=\"Klinik namunalarda bezgak, OIV-1, sil va OIV-sil koinfeksiyasini aniqlash.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Klinik namunalarda bezgak, OIV-1, sil va OIV-sil koinfeksiyasini aniqlash.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Klinik namunalarda bezgak, OIV-1, sil va OIV-sil koinfeksiyasini aniqlash. (A-B) Bezgak klinik namunalarini (S1-20) tahlil qilish, (A) 20 ta tasdiqlangan ijobiy namunalar uchun ko'rsatilgan HTM crRNAlar bo'ylab normallashtirilgan CARMEN floresansini va (B) tasdiqlangan ijobiy va tasdiqlangan salbiy namunalarda normallashtirilgan floresansni ko'rsatadi. (C-D) OIV-1 klinik namunalarini tahlil qilish, (C) 20 ta tasdiqlangan ijobiy namunalar uchun ko'rsatilgan HTM crRNAlar bo'ylab normallashtirilgan CARMEN floresansini va (D) tasdiqlangan ijobiy va tasdiqlangan salbiy namunalarda normallashtirilgan floresansni ko'rsatadi. (E-F) Sil klinik namunalarini tahlil qilish, (E) 30 ta GeneXpert-ijobiy namunalar uchun Mtb sub-paneli bo'ylab normallashtirilgan CARMEN floresansini va (F) tasdiqlangan ijobiy va tasdiqlangan salbiy namunalarda Mtb IS6110 tahlili floresansini ko'rsatadi. (G) Bezgak, OIV va sil uchun CARMEN tasnifi va referens infeksiya holati o'rtasidagi ijobiy foiz kelishuvi (PPA) va salbiy foiz kelishuvi (NPA). (H) Tasdiqlangan salbiy namunalar bilan solishtirganda to'qqizta tasdiqlangan ijobiy OIV-sil koinfeksiyalangan klinik namunalarda Mtb IS6110 va OIV-1 uchun normallashtirilgan floresans. Barcha chizilgan grafiklar uchun alohida nuqtalar klinik namunalarni ifodalaydi va uzuk chiziqlar tegishli ijobiy chegarani ko'rsatadi. Salbiy normallashtirilgan floresans qiymatlari normallashtirish uchun ishlatiladigan fon referensidan pastroq signalni aks ettiradi. CPC = birlashtirilgan ijobiy nazorat. NTC = Nishonsiz nazorat. NDC = Aniqlash nazorati yo'q.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;qPCR (polimeraza zanjir reaksiyasi) — DNKni ko'paytirish usuli bo'lib, Ct (o'tish sikli) boshlang'ich genetik material miqdoriga teskari proportsionaldir: Ct qancha past bo'lsa, namunada patogen shuncha ko'p bo'ladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Sil paneli doirasida biz &lt;em&gt;inhA&lt;/em&gt; va &lt;em&gt;katG&lt;/em&gt; genlaridagi mutatsiyalarni ham tahlil qildik. 30 ta namunadan 11 tasida &lt;em&gt;inhA&lt;/em&gt; -777 C&amp;gt;T va &lt;em&gt;katG&lt;/em&gt; S315T/N mutatsiyalari mavjud edi; CARMEN barcha 11 holatni to'g'ri aniqladi (Rasm 5E). Qolgan namunalar izoniazidga sezgir (10/30) yoki panelga kiritilmagan boshqa mutatsiyalarga ega (9/30) edi. Referens ma'lumotlar bilan muvofiqlik bezgak va OIV-1 uchun 95%, Mtb uchun 100% (PPA) ni tashkil etdi, barcha guruhlar uchun salbiy muvofiqlik (NPA) 100% ga teng bo'ldi (Rasm 5G).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot cheklangan klinik namunalar asosida o'tkazildi; rezistentlik bo'yicha natijalar faqat ikkita mutatsiya bilan cheklangan, bu esa shtammlarning barcha genetik xilma-xilligini qamrab olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Nihoyat, biz OIV-sil koinfeksiyasi bo'lgan 9 ta namunani sinab ko'rdik. CARMEN barcha 9 holatda ikkala patogenni ham bir vaqtning o'zida aniqladi (Rasm 5H, Rasm S14). Bu platformaning kompleks diagnostika uchun, shu jumladan bir vaqtning o'zida bir nechta infeksiya va dori vositalariga chidamlilik markerlarini aniqlash uchun samaradorligini tasdiqlaydi.&lt;/p&gt;\n&lt;h4 id=\"muhokama-va-xulosa\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#muhokama-va-xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama va xulosa&lt;/span&gt;&lt;/a&gt;Muhokama va xulosa&lt;/h4&gt;\n&lt;p&gt;OIV, sil (TB) va bezgak kasalliklari geografik jihatdan bir-biriga mos kelsa va klinik jihatdan muhim koinfeksiyalar mavjud bo'lsa-da, odatda alohida diagnostika yo'llari orqali boshqariladi. Biz HTM CARMEN tizimini ishlab chiqdik — bu CRISPR-Cas13a asosidagi multipleks diagnostika platformasi bo'lib, u OIV-1, OIV-2, to'rt turdagi Plasmodium va Mycobacterium tuberculosis (Mtb) ni, shuningdek inhA va katG genlaridagi dori vositalariga chidamlilik bilan bog'liq variantlarni bir vaqtning o'zida aniqlay oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR-Cas13a — bu RNKni aniqlash uchun ishlatiladigan molekulyar vosita bo'lib, u ma'lum bir patogen ketma-ketligini topganda signal beruvchi molekulani parchalaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;In vitro va klinik namunalarda o'tkazilgan tajribalar shuni ko'rsatdiki, HTM paneli yuqori selektivlikni saqlab qoladi va bir nukleotidli farqlarni aniqlay oladi. Tasdiqlangan klinik namunalarda tizim bezgak uchun 95% (19/20), OIV-1 uchun 95% (19/20) va Mtb IS6110 uchun 100% (30/30) ijobiy moslik darajasini (PPA) ko'rsatdi. Har bir maqsad uchun salbiy moslik (NPA) 100% ni tashkil etdi. Shuningdek, OIV-TB koinfeksiyasi tasdiqlangan to'qqizta namunaning barchasida ham OIV-1, ham Mtb aniqlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HTM CARMEN tizimi virusli, bakterial va parazitar infeksiyalarni bitta testda birlashtirib, Mtb uchun 100% va OIV hamda bezgak uchun 95% aniqlikni ta'minlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu yondashuvning ahamiyati shundaki, u bir vaqtning o'zida bir nechta infeksiyalarni tahlil qiladi. Bu ayniqsa OIV-TB koinfeksiyasi uchun muhim, chunki u kasallik kechishini o'zgartiradi va balg'am tahliliga asoslangan an'anaviy diagnostikani qiyinlashtiradi. 192 ga 24 mikrofluidik arxitekturasi bitta integral sxemada 4608 tagacha reaksiyani amalga oshirish imkonini beradi. Hozirgi shaklda bu texnologiya markazlashtirilgan laboratoriyalar uchun mo'ljallangan bo'lib, ko'plab kasalliklarga xos molekulyar usullarni yagona tahliliy tizimga birlashtiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ushbu tizim yuqori unumdor laboratoriyalar uchun mo'ljallangan va hozircha tezkor diagnostika testlari o'rnini bosa olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"natijalar-va-klinik-ahamiyat\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#natijalar-va-klinik-ahamiyat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar va klinik ahamiyat&lt;/span&gt;&lt;/a&gt;Natijalar va klinik ahamiyat&lt;/h4&gt;\n&lt;p&gt;Sun'iy koinfeksiya tajribalari HTM CARMEN tizimining samaradorligini tasdiqladi. Tizim P. falciparum/HIV-1 va Mtb/HIV-1 patogenlarini, hatto ularning nisbiy konsentratsiyasi turlicha bo'lgan sharoitlarda ham muvaffaqiyatli aniqladi. Past konsentratsiyalarda HTM CARMEN qPCR usuliga qaraganda ko'proq namunalarni ijobiy deb tasnifladi, ayniqsa P. falciparum/HIV-1 matritsalarida farqlar yaqqol ko'zga tashlandi. To'qqizta tasdiqlangan klinik HIV-TB koinfeksiya namunalarida ham HIV-1, ham Mtb aniqlanishi ushbu analitik imkoniyatni klinik amaliyot bilan bog'lashda dastlabki qadam bo'ldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HTM CARMEN turli konsentratsiyalarda patogenlarni aniqlashda samarali bo'lib, ayrim sharoitlarda qPCR'dan yuqori sezgirlik ko'rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Patogen mavjudligini aniqlashdan tashqari, tizim bezgak turlarini aniqlash va Mtb rezistentligini genotiplash imkonini beradi. Maxsus crRNA yordamida Mtb'ning inhA (-777 C&amp;gt;T) va katG (S315T/N) lokuslari bo'yicha yovvoyi va mutant turlarini ajratishga erishildi. Bu muhim, chunki izoniazidga (INH) rezistentlik ko'pincha rifampitsin skriningida e'tibordan chetda qoladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;crRNA (CRISPR-RNK) — bu CRISPR tizimiga qaysi DNK yoki RNK ketma-ketligini aniqlash kerakligini ko'rsatuvchi yo'naltiruvchi molekula.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"cheklovlar-va-istiqbollar\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#cheklovlar-va-istiqbollar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va istiqbollar&lt;/span&gt;&lt;/a&gt;Cheklovlar va istiqbollar&lt;/h4&gt;\n&lt;p&gt;Joriy tadqiqotda cheklovlar mavjud. Klinik kogortalar nisbatan kichik bo'lib, ular prospektiv tanlangan bemorlar emas, balki referent namunalar edi. Diagnostik qiymatni baholash uchun turli geografik hududlarda, patogen yuklamasi va namuna sifatini hisobga olgan holda keng ko'lamli tadqiqotlar zarur. Shuningdek, INH rezistentligi paneli barcha genetik variantlarni qamrab olmaydi: 19 ta Mtb namunasidan to'qqiztasi rezistent bo'lsa-da, ularda tekshirilgan lokuslardan tashqarida mutatsiyalar mavjud edi. Mtb uchun IS6110 nishonidan foydalanish ham kopiya soni kam bo'lgan shtammlarda noto'g'ri salbiy natijalar xavfini tug'diradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kichik tanlama hajmi va referent namunalardan foydalanish natijalarni umumiy klinik populyatsiyaga to'liq tatbiq etishni cheklaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;HTM CARMEN texnik jihatdan nuklein kislotalarni ajratish va Biomark mikrofluidik platformasini talab qiladi, bu esa uni markazlashgan laboratoriyalar uchun moslashtiradi. Shunga qaramay, CRISPR'ning dasturlanadigan tabiati epidemiologik vaziyat o'zgarganda panelni yangilash imkonini beradi. Kelajakda tizim JSST algoritmlariga qo'shimcha sifatida mintaqaviy laboratoriyalarda koinfeksiyalarni kompleks tahlil qilish uchun xizmat qilishi mumkin.&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"panel-dizayni-va-ishlab-chiqish\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#panel-dizayni-va-ishlab-chiqish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Panel dizayni va ishlab chiqish&lt;/span&gt;&lt;/a&gt;Panel dizayni va ishlab chiqish&lt;/h4&gt;\n&lt;p&gt;Barcha organizmlar genomlaridagi konservativ hududlarni aniqlash uchun oligonukleotid praymerlar va beshta crRNA-gid loyihalashtirildi. Beshta patogen (&lt;em&gt;Plasmodium falciparum 3D7&lt;/em&gt;, &lt;em&gt;P. vivax&lt;/em&gt;, &lt;em&gt;P. ovale&lt;/em&gt;, &lt;em&gt;P. malariae&lt;/em&gt; va &lt;em&gt;Mycobacterium tuberculosis&lt;/em&gt;) uchun konservativ hududlar tanlab olindi. &lt;em&gt;M. tuberculosis&lt;/em&gt; uchun izoniazidga chidamlilik bilan bog'liq &lt;em&gt;inhA&lt;/em&gt; -777 C&amp;gt;T va &lt;em&gt;katG&lt;/em&gt; S315T/N mutatsiyalarini aniqlash uchun ikkita crRNA juftligi ishlab chiqildi. HIV va RNase P uchun avval tasvirlangan usullar qo'llanildi. Boshqa nishonlar uchun ADAPT (https://adapt.run/) algoritmi orqali &amp;gt;95% qamrovga ega crRNA dizaynlari yaratildi. &lt;em&gt;P. malariae&lt;/em&gt; 18S rRNA ketma-ketligi NCBI ma'lumotlari asosida rekonstruksiya qilindi. &lt;em&gt;P. malariae&lt;/em&gt; uchun SHERLOCK skriningi yordamida o'ziga xos hududlar iterativ tarzda aniqlandi. &lt;em&gt;M. tuberculosis&lt;/em&gt; SNP tahlili uchun BADGERS dasturiy ta'minotidan foydalanildi. &lt;em&gt;katG&lt;/em&gt; S315T/N uchun mo'ljallangan crRNA nishon oldidagi guanin (yovvoyi tur) mavjud bo'lganda Cas13a faolligining pasayishidan foydalanadi. Praymerlar NCBI Primer-BLAST yordamida 60^° C erish haroratida loyihalashtirildi. Barcha ketma-ketliklar S2-S4 jadvallarida keltirilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;crRNA (CRISPR RNA) — bu Cas13 fermentini ma'lum bir genetik ketma-ketlikka yo'naltiruvchi va uni aniqlashga yordam beradigan qisqa RNK molekulasi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"crrna-ni-in-vitro-transkripsiyasi\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#crrna-ni-in-vitro-transkripsiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;crRNA ni in vitro transkripsiyasi&lt;/span&gt;&lt;/a&gt;crRNA ni in vitro transkripsiyasi&lt;/h4&gt;\n&lt;p&gt;crRNA lar M2 qo'shimcha usuliga muvofiq in vitro transkripsiya (IVT) orqali hosil qilindi. Gid shablonlari va T7-promotor praymerlari Thermo Fisher Scientific kompaniyasidan ssDNA-oligonukleotidlar sifatida buyurtma qilindi.&lt;/p&gt;\n&lt;h4 id=\"kimyoviy-sintez-qilingan-nuklein-kislotalar\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#kimyoviy-sintez-qilingan-nuklein-kislotalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kimyoviy sintez qilingan nuklein kislotalar&lt;/span&gt;&lt;/a&gt;Kimyoviy sintez qilingan nuklein kislotalar&lt;/h4&gt;\n&lt;p&gt;Har bir nishon amplikoni uchun sintetik ikki zanjirli DNK (gBlocks) Integrated DNA Technologies kompaniyasidan olindi. Yakuniy konsentratsiya 10¹⁰ nusxa/mkl qilib tayyorlandi. Ushbu gBlocks crRNA samaradorligini aniqlash va CARMEN tahlillarida foydalanildi.&lt;/p&gt;\n&lt;h4 id=\"miqdoriy-sintetik-rnk-va-dnk\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#miqdoriy-sintetik-rnk-va-dnk\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Miqdoriy sintetik RNK va DNK&lt;/span&gt;&lt;/a&gt;Miqdoriy sintetik RNK va DNK&lt;/h4&gt;\n&lt;p&gt;&lt;em&gt;P. vivax&lt;/em&gt; (PRA-3004SD) va &lt;em&gt;P. malariae&lt;/em&gt; (PRA-3001SD) uchun sintetik DNK, shuningdek, HIV-1 (VR-3351SD) va HIV-2 (VR-3266SD) uchun sintetik RNK ATCC dan, &lt;em&gt;P. ovale&lt;/em&gt; 18S rRNA plazmidasi esa BEI Resources dan xarid qilindi. Ushbu materiallar sezgirlik va o'ziga xoslikni tekshirish uchun ishlatildi.&lt;/p&gt;\n&lt;h4 id=\"genomik-dnk-namunalari\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#genomik-dnk-namunalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Genomik DNK namunalari&lt;/span&gt;&lt;/a&gt;Genomik DNK namunalari&lt;/h4&gt;\n&lt;p&gt;&lt;em&gt;B. microti&lt;/em&gt; (PRA-398DQ) va &lt;em&gt;P. falciparum&lt;/em&gt; (PRA-405D) genomik DNKsi ATCC dan, &lt;em&gt;T. gondii&lt;/em&gt; DNKsi esa UCLA Bradley laboratoriyasidan olindi.&lt;/p&gt;\n&lt;h4 id=\"teskari-transkripsiya-va-pcr-amplifikatsiya\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#teskari-transkripsiya-va-pcr-amplifikatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Teskari transkripsiya va ПЦР-amplifikatsiya&lt;/span&gt;&lt;/a&gt;Teskari transkripsiya va ПЦР-amplifikatsiya&lt;/h4&gt;\n&lt;p&gt;RNK nishonlarini kuchaytirish uchun SuperScript IV teskari transkriptazasi qo'llanildi. 13 mkl hajmda 10 pg–5 mkg RNK, 1 mkl praymer (2 mkm) va 1 mkl dNTP (10 mM) aralashtirildi. 65°C da 5 daqiqa qizdirilgach, fermentlar qo'shildi va 55°C da 15 daqiqa inkubatsiya qilindi. Multipleks ПЦР uchun New England Biolabs to'plami ishlatildi. 50 mkl reaksiya aralashmasi 10 mkl master-miks, 5 mkl praymerlar va 4 mkl matritsadan iborat bo'ldi. Dastur: 95°C (2 daqiqa), 40 tsikl (95°C — 30 s, 58°C — 60 s, 72°C — 60 s) va 72°C da 5 daqiqalik yakuniy kengaytirish.&lt;/p&gt;\n&lt;h4 id=\"384-quduqli-planshetli-ridder-yordamida-cas13a-deteksiyasi-sherlock\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#384-quduqli-planshetli-ridder-yordamida-cas13a-deteksiyasi-sherlock\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;384-quduqli planshetli ridder yordamida Cas13a deteksiyasi (SHERLOCK)&lt;/span&gt;&lt;/a&gt;384-quduqli planshetli ridder yordamida Cas13a deteksiyasi (SHERLOCK)&lt;/h4&gt;\n&lt;p&gt;crRNA tanlash uchun SHERLOCK metodologiyasidan foydalanildi. gBlocks fragmentlari 10⁴ dan 10⁰ nusxa/mkl gacha konsentratsiyalarda suyultirildi va PCR orqali kuchaytirildi. Deteksiya uchun master-miks tarkibiga 40 mM Tris-HCl, 1 mM DTT, 1 mM rNTP, 1 birlik/mkl RNaz ingibitori, 22,5 nM LwaCas13a, 1 birlik/mkl T7 RNK-polimeraza, 62,5 nM floresan zond (FAM-rUrUrUrUrUrU-3IABkFQ) va 14 mM MgOAc kiritildi. 96-quduqli planshetga 58,5 mkl master-miks, 1,67 mkl crRNA (24 ng/mkl) va 3,15 mkl kuchaytirilgan nishon qo'shildi. NTC (nishonsiz nazorat) uchun 3,15 mkl PCR salbiy nazorati ishlatildi. Aralashma 384-quduqli planshetga (20 mkl dan uch nusxada) o'tkazildi va QuantStudio 5 tizimida 37°C da 3 soat davomida har 5 daqiqada floresans o'lchandi. Ma'lumotlar Design and Analysis v2.7.0 dasturida qayta ishlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SHERLOCK — bu Cas13a fermentidan foydalanadigan molekulyar diagnostika usuli bo'lib, u o'ziga xos RNK-nishonni aniqlaganda atrofidagi RNK molekulalarini, shu jumladan floresan zondlarni ham parchalaydi va bu patogen mavjudligini ko'rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"biomark-hd-tizimida-carmen-tahlillari\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#biomark-hd-tizimida-carmen-tahlillari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Biomark HD tizimida CARMEN tahlillari&lt;/span&gt;&lt;/a&gt;Biomark HD tizimida CARMEN tahlillari&lt;/h4&gt;\n&lt;p&gt;CARMEN tahlillari Biomark HD platformasida 24x192 integrallashgan mikrofluidik chiplar (IFC) yordamida o'tkazildi. Reaksiya namunalar va tahliliy aralashmalarning kombinatorik aralashishiga asoslangan. Tahliliy aralashma (1,33X) tarkibida 600 nM LwaCas13a, 1,67 birlik/mkl T7 RNK-polimeraza va 450 nM crRNA mavjud edi. Namuna aralashmasi (1,5X) T7 buferi, maxsus namuna buferi (66,66 mM Tris-HCl, 8,33 mM NaCl, 15 mM MgCl₂, 1,67 mM DTT, 1,67% PEG-8K), 1,5 birlik/mkl RNaz ingibitori, 1,5 mM rNTP, 0,75 mM floresan zond va ROX-referensni o'z ichiga oldi. 192.24 IFC chipi IFC Controller RX qurilmasiga yuklandi va 37°C da 3 soat davomida har 5 daqiqada floresans tasvirlari olindi.&lt;/p&gt;\n&lt;h4 id=\"biomark-hd-da-in-vitro-cas13a-deteksiyasi-sezgirligi\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#biomark-hd-da-in-vitro-cas13a-deteksiyasi-sezgirligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Biomark HD da in vitro Cas13a deteksiyasi sezgirligi&lt;/span&gt;&lt;/a&gt;Biomark HD da in vitro Cas13a deteksiyasi sezgirligi&lt;/h4&gt;\n&lt;p&gt;Nishonlarning genomik materiali suvda 10⁴, 10³, 10², 10¹, 10⁰ va 10⁻¹ nusxa/mkl konsentratsiyalarigacha suyultirildi. Namunalar texnik dublikatlarda tahlil qilindi. Reaksiya kinetikasi har bir crRNA uchun diagnostik chegaralar bilan solishtirildi.&lt;/p&gt;\n&lt;h4 id=\"nuklein-kislotalarni-ajratib-olish-usullari\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#nuklein-kislotalarni-ajratib-olish-usullari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nuklein kislotalarni ajratib olish usullari&lt;/span&gt;&lt;/a&gt;Nuklein kislotalarni ajratib olish usullari&lt;/h4&gt;\n&lt;p&gt;M. tuberculosis, P. falciparum va HIV-1 genetik materiali standart protokollarga muvofiq ajratib olindi.&lt;/p&gt;\n&lt;h4 id=\"m-tuberculosis-gdnk-ajratib-olish\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#m-tuberculosis-gdnk-ajratib-olish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M. tuberculosis gDNK ajratib olish&lt;/span&gt;&lt;/a&gt;M. tuberculosis gDNK ajratib olish&lt;/h4&gt;\n&lt;p&gt;M. tuberculosis gDNK sini ajratish uchun QIAamp DNA Mini Kit dan oldin mexanik hujayra parchalash (bead beating) usuli qo'llanildi. 10 ml madaniyat sentrifuga qilindi (5000 x g, 10 daqiqa). Cho'kma 180 mkl ATL buferida suspenziya qilindi, 300 mkl sirkoniy/silika munchoqlari (0,1 mm) qo'shildi va muz ustida sovutib, 1 daqiqadan uch marta vorteks qilindi. 20 mkl proteinaza K qo'shilib, 56°C da 3 soat inkubatsiya qilindi. Keyin 200 mkl AL buferi (70°C da 10 daqiqa) va 200 mkl 100% etanol qo'shildi. Lizat QIAamp kolonkalariga o'tkazildi, AW1 va AW2 buferlari bilan yuvildi (6000 x g) va DNK 50 mkl suv bilan elutsiya qilindi.&lt;/p&gt;\n&lt;h4 id=\"p-falciparum-madaniyati-va-rnk-ekstraksiyasi\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#p-falciparum-madaniyati-va-rnk-ekstraksiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;P. falciparum madaniyati va RNK ekstraksiyasi&lt;/span&gt;&lt;/a&gt;P. falciparum madaniyati va RNK ekstraksiyasi&lt;/h4&gt;\n&lt;p&gt;P. falciparum 3D7 shtammi inson qizil qon tanachalari (O+ guruhi) muhitida 0,5% Albumax II, 2 mM L-glutamin, 50 mg/l gipoksantin, 25 mM HEPES, 0,225% NaHCO3 va 10 mg/ml gentamitsin qo‘shilgan RPMI 1640 muhitida o‘stirildi. Inkubatsiya 37°C haroratda, 5% O2, 5% CO2 va 90% N2 aralashmasi ostida amalga oshirildi. RNK 1% parazitemiyaga ega P. falciparum 3D7 madaniyatlaridan ikki biologik takroriy namunada ajratib olindi. Hujayralar PBS bilan yuvilib, sentrifugalandi va TRIzol® LS reagentida (37°C da 5 daqiqa) lizis qilindi. Xloroform qo‘shilib, vorteks va sentrifugalashdan so‘ng, RNK o‘z ichiga olgan suvli faza ajratib olindi va izopropanol bilan -20°C da bir kecha davomida cho‘ktirildi. Cho‘kma etanol bilan yuvilib, RNK-siz suvda eritildi. DNK ifloslanishlari 4 birlik DNKaza I (NEB) yordamida olib tashlandi va EDTA bilan inaktivatsiya qilindi. RNK sifati gel-elektroforez bilan tekshirildi; tahlil uchun 0,1% va 0,01% li suyultirilgan namunalar tayyorlandi.&lt;/p&gt;\n&lt;h4 id=\"oiv-1-rnk-ekstraksiyasi\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#oiv-1-rnk-ekstraksiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;OIV-1 RNK ekstraksiyasi&lt;/span&gt;&lt;/a&gt;OIV-1 RNK ekstraksiyasi&lt;/h4&gt;\n&lt;p&gt;Lizis qilingan OIV-1 virus namunalari professor Otto Yang (UCLA) laboratoriyasidan olindi. RNK ekstraksiyasi Quick DNA/RNA™ MagBead Kit (Zymo Research) to‘plami yordamida M1 protokoli bo‘yicha amalga oshirildi (SN-rasm).&lt;/p&gt;\n&lt;h4 id=\"quritilgan-qon-doglarini-dbs-tayyorlash-va-elutsiya\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#quritilgan-qon-doglarini-dbs-tayyorlash-va-elutsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Quritilgan qon dog‘larini (DBS) tayyorlash va elutsiya&lt;/span&gt;&lt;/a&gt;Quritilgan qon dog‘larini (DBS) tayyorlash va elutsiya&lt;/h4&gt;\n&lt;p&gt;DBS namunalari Qiagen FTA DBS kartalariga genetik material qo‘shilgan butun qonni tomizish orqali tayyorlandi (har bir dog‘ ~50 mkl). 4 soat quritilgandan so‘ng, kartalar quritgich bilan -20°C da saqlandi. Elutsiya uchun qon dog‘i kesib olinib, 500 mkl elutsiya buferiga (PBS + 0,05% Tween) joylashtirildi, 5 marta vorteks qilindi va 5 mkl Proteinaza K (Zymo Research) qo‘shildi. Inkubatsiya: 56°C da 1 soat, so‘ngra 95°C da 10 daqiqa. Eluatlar Quick DNA/RNA™ MagBead Kit yordamida tozalandi.&lt;/p&gt;\n&lt;h4 id=\"sputum,-zardob,-qon-va-dbs-dan-nuklein-kislotalarni-ajratish\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#sputum,-zardob,-qon-va-dbs-dan-nuklein-kislotalarni-ajratish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sputum, zardob, qon va DBS dan nuklein kislotalarni ajratish&lt;/span&gt;&lt;/a&gt;Sputum, zardob, qon va DBS dan nuklein kislotalarni ajratish&lt;/h4&gt;\n&lt;p&gt;Nuklein kislotalar Quick DNA/RNA™ MagBead Kit (M1 protokoli) yordamida ajratildi. Namunalar DNA/RNA Shield™ bilan 2:1 nisbatda aralashtirilib (yakuniy hajm 400 mkl), 8 mkl proteinaza K (20 mg/ml) qo‘shildi va 30°C da 30 daqiqa inkubatsiya qilindi. Sentrifugalashdan (16 000 x g, 2 daqiqa) so‘ng, supernatant teng hajmdagi 100% izopropanol bilan aralashtirildi va M1 protokoli bo‘yicha tozalandi. Yakuniy elutsiya nukleaza-siz suvda amalga oshirildi.&lt;/p&gt;\n&lt;h4 id=\"suniy-namunalarni-sinash\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#suniy-namunalarni-sinash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sun’iy namunalarni sinash&lt;/span&gt;&lt;/a&gt;Sun’iy namunalarni sinash&lt;/h4&gt;\n&lt;p&gt;Tozalangan nuklein kislotalar va gBlocks (SNP nishonlari) suyultirilib, turli matritsalarga (sputum, zardob, qon, DBS) 10³, 10², 10¹, 10⁰ va 10⁻¹ nusxa/mkl konsentratsiyalarida qo‘shildi. Har bir kombinatsiya 20 takroriy namunada HTM crRNA paneli bilan sinaldi. TB dori qarshiligi va M. tuberculosis DNKsi sputum, qon va DBS da baholandi. P. falciparum DNK, OIV-1 RNK, shuningdek P. ovale, P. vivax, P. malariae va OIV-2 materiallari qon, zardob va DBS da sinaldi. Shuningdek, OIV-TB va OIV-P. falciparum koinfektsiya namunalari (10³–10⁰ nusxa/mkl) tayyorlandi. Ekstraksiya MagBead to‘plami bilan, sinov esa CARMEN usuli (Biomark HD) bilan amalga oshirildi. RNase P geniga qarshi praymerlar ijobiy nazorat sifatida ishlatildi.&lt;/p&gt;\n&lt;h4 id=\"suniy-namunalarni-qpcr-orqali-sinash\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#suniy-namunalarni-qpcr-orqali-sinash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sun’iy namunalarni qPCR orqali sinash&lt;/span&gt;&lt;/a&gt;Sun’iy namunalarni qPCR orqali sinash&lt;/h4&gt;\n&lt;p&gt;Sezgirlikni solishtirish uchun namunalar qPCR orqali baholandi. RNK teskari transkriptsiya qilindi. 2X PowerUp SYBR Green Master Mix (Applied Biosystems) ishlatildi. Parametrlar: 50°C da 2 daqiqa, 95°C da 2 daqiqa, 40 tsikl (95°C da 30 s, 58°C da 60 s, 72°C da 60 s). Reaksiyalar uch nusxada (10 mkl hajm) o‘tkazildi. Ma’lumotlar Design and Analysis v2.7.0 dasturida tahlil qilindi.&lt;/p&gt;\n&lt;h4 id=\"etika-bayonoti\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#etika-bayonoti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Etika bayonoti&lt;/span&gt;&lt;/a&gt;Etika bayonoti&lt;/h4&gt;\n&lt;p&gt;Klinik namunalar tegishli muassasa protokollari asosida anonim tarzda olindi.&lt;/p&gt;\n&lt;h4 id=\"soglom-donor-namunalari\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#soglom-donor-namunalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sog‘lom donor namunalari&lt;/span&gt;&lt;/a&gt;Sog‘lom donor namunalari&lt;/h4&gt;\n&lt;p&gt;20 ta sog‘lom donor (10 erkak, 10 ayol) zardobi BioIVT dan, butun qon UCLA qon markazidan, sputum esa Stenford universitetidan olindi va sun’iy tajribalar uchun patogenlar genetik materiali bilan boyitildi.&lt;/p&gt;\n&lt;h4 id=\"oiv-1-bilan-kasallangan-bemorlar-namunalari\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#oiv-1-bilan-kasallangan-bemorlar-namunalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;OIV-1 bilan kasallangan bemorlar namunalari&lt;/span&gt;&lt;/a&gt;OIV-1 bilan kasallangan bemorlar namunalari&lt;/h4&gt;\n&lt;p&gt;UCLA Klinik mikrobiologiya laboratoriyasidan (IRB-25-2048) 10 ta salbiy va &lt;a href=\"concepts/rt-pcr.html\"&gt;RT-PCR&lt;/a&gt; orqali OIV-1 musbat deb tasdiqlangan 20 ta namuna (virus yuki 32 dan 2 660 000 nusxa/ml gacha) olindi. Plazma namunalari issiqlik bilan inaktivatsiya qilindi va -80°C da saqlandi. CARMEN tahlilidan oldin namunalar lizis qilindi va nuklein kislotalar Quick-DNA/RNA MagBead Kit (Zymo Research, SN jadvaliga qarang) yordamida ajratib olindi.&lt;/p&gt;\n&lt;h4 id=\"malyariya-bilan-kasallangan-bemorlar-namunalari\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#malyariya-bilan-kasallangan-bemorlar-namunalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Malyariya bilan kasallangan bemorlar namunalari&lt;/span&gt;&lt;/a&gt;Malyariya bilan kasallangan bemorlar namunalari&lt;/h4&gt;\n&lt;p&gt;BinaxNOW Malaria va/yoki RT-PCR orqali malyariya uchun musbat deb tasdiqlangan 20 ta namuna Boca Biolistics kompaniyasidan xarid qilindi. Ushbu 20 ta namunaning 8 tasi zardob, 12 tasi esa butun qon edi. Namunalar quruq muzda tashildi va -80°C da saqlandi. CARMEN tahlilidan oldin namunalar Quick DNA/RNA MagBead Kit (Zymo Research, SN jadvaliga qarang) yordamida qayta ishlandi.&lt;/p&gt;\n&lt;h4 id=\"sil-kasalligi-bilan-ogrigan-bemorlar-namunalari\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#sil-kasalligi-bilan-ogrigan-bemorlar-namunalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sil kasalligi bilan og'rigan bemorlar namunalari&lt;/span&gt;&lt;/a&gt;Sil kasalligi bilan og'rigan bemorlar namunalari&lt;/h4&gt;\n&lt;p&gt;FIND Specimen Bank (Jeneva, Shveytsariya) tomonidan GeneXpert orqali M. tuberculosis uchun musbat deb tasdiqlangan 30 ta namuna taqdim etildi. Bundan tashqari, ham M. tuberculosis, ham OIV-1 uchun musbat bo'lgan 9 ta plazma namunasi xarid qilindi. Ushbu 9 ta namuna SN jadvalida keltirilgan usul bo'yicha ajratib olindi.&lt;/p&gt;\n&lt;h4 id=\"malumotlarni-tahlil-qilish-va-diagnostika-mezonlari\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#malumotlarni-tahlil-qilish-va-diagnostika-mezonlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ma'lumotlarni tahlil qilish va diagnostika mezonlari&lt;/span&gt;&lt;/a&gt;Ma'lumotlarni tahlil qilish va diagnostika mezonlari&lt;/h4&gt;\n&lt;p&gt;Biomark HD qurilmasidan olingan xom floresans ma'lumotlarini qayta ishlash uchun Python skriptidan foydalanildi. FAM reporter signali har bir reaksiya kamerasida quyidagi formula bo'yicha normallashtirildi: Normallashtirilgan signal = (namuna signali / nazorat signali). CARMEN uchun chegaraviy qiymatlar (threshold) har bir crRNA uchun alohida belgilandi: chegara = NTC (namunasiz nazorat) signalining o'rtacha qiymati + 3 * standart og'ish (SD). Agar normallashtirilgan signal ushbu chegaradan yuqori bo'lsa, namuna musbat deb hisoblandi. qPCR tahlilida esa Ct &amp;lt; 38 bo'lsa musbat, Ct ≥ 38 yoki aniqlanmagan bo'lsa salbiy natija qayd etildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;NTC (No Template Control) — bu reagentlar ifloslanishini tekshirish uchun tarkibida nishon DNK/RNK bo'lmagan nazorat namunasidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;inhA va katG genlaridagi SNP (yagona nukleotid polimorfizmlari) aniqlash uchun 60 daqiqadan so'ng WT va MUT crRNA o'rtasidagi floresans nisbati hisoblandi. Agar MUT/WT nisbati 2 dan oshsa, mutant allel dominant deb belgilandi. Diagnostika aniqligi PPA (musbat moslik foizi) va NPA (salbiy moslik foizi) ko'rsatkichlari orqali hisoblab chiqildi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari-f1.jpg\" alt=\"HTM CARMEN CRISPR diagnostika paneli dizayni va ish jarayoni.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;HTM CARMEN CRISPR diagnostika paneli dizayni va ish jarayoni.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;HTM CARMEN CRISPR diagnostika paneli dizayni va ish jarayoni. (A) HTM CARMEN ish jarayoni sxemasi, namunalarni yig'ish, nuklein kislotalarni ajratib olish, nishonni kuchaytirish va CARMEN platformasida CRISPR-Cas13a aniqlash, shuningdek OIV, Plasmodium, Mtb va koinfeksiyalarni multipleks aniqlashni tasvirlaydi. (B) Plasmodium turlarini farqlash uchun dizayn strategiyasi. P. falciparum, P. vivax, P. ovale va P. malariae 18S rRNA ketma-ketliklarining konsensus ketma-ketliklari bo'ylab ketma-ketlik saqlanishi, kuchaytiruvchi praymerlar va turga xos crRNAlarning o'rinlari bilan birga ko'rsatilgan. Praymerlar saqlanib qolgan hududlar ichida joylashtirilgan, crRNAlar esa ADAPT yordamida aniqlangan turlarni ajratuvchi hududlarga qaratilgan. (C) Mtb inhA promouteri −777 C&amp;gt;T va katG S315T/N lokuslari uchun allelga xos crRNA aniqlash sxemasi. Tegishli crRNA-nishon juftlashuvi Cas13a faollashuvini va floresans hosil bo'lishini rag'batlantiradi, bir nukleotidli nomuvofiqlik esa faollashuvni pasaytiradi, bu esa nisbiy floresans signallari asosida yovvoyi tur va mutant allellarni farqlash imkonini beradi. (D) Tanlangan Plasmodium va Mtb tahlillarining NCBI ketma-ketlik ma'lumotlar bazalari bo'yicha bashorat qilingan ketma-ketlik qamrovi. Qamrov praymer bog'lanishi va crRNA faolligini qo'llab-quvvatlashi bashorat qilingan ketma-ketliklar ulushini ifodalaydi. Har bir tahlil uchun baholangan jami ketma-ketliklarga nisbatan qoplangan ketma-ketliklar soni ko'rsatilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari-f3.jpg\" alt=\"HTM CARMEN klinik jihatdan muhim namunalar matritsalarida allel diskriminatsiyasi va sezgir aniqlashni saqlaydi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;HTM CARMEN klinik jihatdan muhim namunalar matritsalarida allel diskriminatsiyasi va sezgir aniqlashni saqlaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;HTM CARMEN klinik jihatdan muhim namunalar matritsalarida allel diskriminatsiyasi va sezgir aniqlashni saqlaydi. (A-C) (A) balg'am, (B) butun qon va (C) quritilgan qon dog'i (DBS) namunalarida sinovdan o'tkazilgandan so'ng Mtb inhA va katG crRNAlarining allel diskriminatsiyasi. Faollik nisbatlari har bir sun'iy namuna uchun 10^4 nusxa/mkl da 60 daqiqada maqsadli/maqsadli bo'lmagan normallashtirilgan floresans sifatida hisoblab chiqilgan va 20 ta namunadan olingan o'rtacha ± SD sifatida ko'rsatilgan. Uzuk chiziq 2 faollik nisbatini ko'rsatadi, bu allelni afzal ko'rishning yo'qligiga mos keladi. (D-F) (D) butun qonda P. falciparum genomik DNK, (E) butun qonda OIV-1 genomik RNK yoki (F) balg'amda Mtb genomik DNK ni o'z ichiga olgan 20 ta sun'iy namunada past miqdordagi nishonlarni aniqlash. Ustunlar o'rtacha normallashtirilgan CARMEN floresansini ± SD ko'rsatadi; alohida nuqtalar har bir sun'iy namunani ifodalaydi. Uzuk chiziqlar tahlilning ijobiy chegaralarini ko'rsatadi. (G-I) (G) P. falciparum, (H) OIV-1 va (I) Mtb IS6110 uchun nishon konsentratsiyasi va namuna matritsasi bo'ylab CARMEN va qPCR aniqlashni taqqoslash. Issiqlik xaritalari P. falciparum va OIV-1 uchun butun qon, zardob va DBSda, Mtb IS6110 uchun esa balg'am, butun qon va DBSda har bir nishon konsentratsiyasida 20 tadan ijobiy deb tasniflangan namunalar sonini ko'rsatadi. Rang shkalalari 20 tadan ijobiy deb tasniflangan namunalar sonini aks ettiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari-f4.jpg\" alt=\"Sun'iy Pf-OIV-1 va Mtb-OIV-1 koinfeksiyalarini multipleks aniqlash.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Sun'iy Pf-OIV-1 va Mtb-OIV-1 koinfeksiyalarini multipleks aniqlash.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Sun'iy Pf-OIV-1 va Mtb-OIV-1 koinfeksiyalarini multipleks aniqlash. (A-B) (A) butun qonga bir vaqtning o'zida qo'shilgan Pf va OIV-1 hamda (B) balg'amga bir vaqtning o'zida qo'shilgan Mtb va OIV-1 ni ko'rsatilgan nishon konsentratsiyalarida multipleks CARMEN aniqlash. Issiqlik xaritalari koinfeksiyalangan namunalar uchun ko'rsatilgan HTM crRNAlar bo'ylab 60 daqiqada normallashtirilgan floresansni va ko'rsatilgan nishon konsentratsiyalarida tegishli yagona nishon nazoratlarini ko'rsatadi. RNase P ijobiy nazorati va nishonsiz nazorat (NTC) ko'rsatilgan joyda ko'rsatilgan. (C-F) (C) CARMEN va (D) butun qonda tegishli crRNAlar bilan Pf va OIV-1 ni qPCR aniqlash; va (E) CARMEN va (F) balg'amda tegishli crRNAlar bilan Mtb va OIV-1 ni qPCR aniqlash uchun har bir konsentratsiya uchun 20 ta sun'iy koinfeksiya namunasi bo'yicha aniqlash chastotalari. Issiqlik xaritasi qiymatlari OIV-1 va koinfeksiyalovchi patogen konsentratsiyasining har bir kombinatsiyasida 20 tadan ijobiy deb tasniflangan namunalar sonini ko'rsatadi. Rang shkalalari 20 tadan ijobiy deb tasniflangan namunalar sonini aks ettiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Қўшма&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;инфекцияларни&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;секин аниқлаш&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" hei lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Preprint hali taqriz qilinmagan. Xulosalar dastlabki.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"manba\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#manba\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manba&lt;/span&gt;&lt;/a&gt;Manba&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Manba&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Kategoriya&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Preprint litsenziyasi&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;medRxiv&lt;/td&gt;\n&lt;td&gt;infectious diseases&lt;/td&gt;\n&lt;td&gt;все права у авторов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mualliflar: Jain, A. S.; Si, A.; Yap, J.; Schwartz, L. A.; Susilo, C.; Balamurugan, A.; Neal, A.; Le Roch, K. G.; Yang, O.; Garner, O.; Kamariza, M.&lt;/p&gt;\n&lt;h3 id=\"manbalar\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Manba&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Havola&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница препринта&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://www.medrxiv.org/content/10.64898/2026.09.26.26364094v1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;medrxiv.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Полный текст (PDF)&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://www.medr
