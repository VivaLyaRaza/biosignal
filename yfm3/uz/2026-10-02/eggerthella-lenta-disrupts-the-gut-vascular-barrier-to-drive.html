            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"112\" cy=\"173\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"508\" cy=\"176\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · ONCOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Ichakdagi bakteriya yo‘g‘on&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ichak saratonining jigarga&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;tarqalishiga yordam beradi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/eggerthella-lenta-disrupts-the-gut-vascular-barrier-to-drive-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Yo‘g‘on ichak saratoni ko‘pincha jigarga metastaz beradi va qon tomir tizimidan transport sifatida foydalanadi. Tadqiqotchilar Eggerthella lenta bakteriyasi ichak tomirlarining himoya to‘sig‘ini shikastlashini aniqladilar. Bu o‘sma hujayralarining qonga o‘tishini va organizm bo‘ylab tarqalishini osonlashtiradi. Ushbu mexanizmni tushunish metastazlarni nazorat qilish uchun yangi imkoniyatlar yaratadi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/eggerthella-lenta-disrupts-the-gut-vascular-barrier-to-drive.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Eggerthella lenta endoplazmatik retikulum stressini faollashtirib, ichak qon tomir to‘sig‘ini buzadi.&lt;/li&gt;\n&lt;li&gt;E. lenta ning yuqori konsentratsiyasi metastaz xavfi va saratonning erta qaytalanishi bilan bog‘liq.&lt;/li&gt;\n&lt;li&gt;PERK yo‘lini bostirish endoteliyning zich aloqalarini saqlab qoladi va o‘sma tarqalishini sekinlashtiradi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/eggerthella-lenta-disrupts-the-gut-vascular-barrier-to-drive.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqotchilar 147 nafar yo‘g‘on ichak saratoni bilan og‘rigan bemor va sog‘lom ko‘ngillilarning to‘qimalarini tahlil qildilar. Jigarga metastaz bergan bemorlarda ichak qon tomir to‘sig‘i (GVB) shikastlanishining belgisi bo‘lgan PV-1 oqsili darajasi sezilarli darajada yuqori ekanligi ma’lum bo‘ldi. Metagenomik tahlil aynan shu to‘qimalarda Eggerthella lenta bakteriyasi faol ko‘payishini ko‘rsatdi.&lt;/p&gt;\n&lt;p&gt;Hujayra madaniyatlarida va sichqonlarda o‘tkazilgan tajribalarda E. lenta qon tomir endotelial hujayralariga yopishishi aniqlandi. Bu TLR4-bog‘liq yo‘l orqali endoplazmatik retikulum (ER) stressini faollashtiradi va hujayralararo zich aloqalarning buzilishiga olib keladi. Natijada to‘siq o‘sma hujayralari uchun o‘tkazuvchan bo‘lib qoladi. ER stressining asosiy bo‘g‘ini bo‘lgan PERK oqsilini bostirish qon tomir devorining yaxlitligini tiklashga va saraton hujayralarining migratsiyasini kamaytirishga yordam beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot klinik ma'lumotlarning korrelyatsion tahlili va sichqon modellari asosida o‘tkazilgan, shuning uchun terapiya samaradorligini tasdiqlash uchun klinik sinovlar zarur.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-02/eggerthella-lenta-disrupts-the-gut-vascular-barrier-to-drive.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Masofaviy metastazlar yo'g'on ichak saratoni (KRR) o'limining asosiy sababidir va ichak qon tomir to'sig'i (GVB) gematogen tarqalish uchun birinchi to'siq hisoblanadi. GVB funksiyasiga metastaz bilan bog'liq bakteriyalar bevosita ta'sir qiladimi yoki yo'qligini tekshirish uchun biz 20 ta sog'lom nazorat guruhi, 82 ta metastazsiz KRR bemori va 65 ta jigar yoki o'&lt;a href=\"concepts/protein-kinase-a.html\"&gt;pka&lt;/a&gt; metastazlari bo'lgan bemorlarni o'z ichiga olgan ikkita kogortani tahlil qildik. GVB buzilishi va metastaz bilan bog'liq ichak mikroblarini tekshirish uchun multiomik yondashuvlar (metagenom sekvenlash va bir hujayrali RNK sekvenlash) va gnotobiotik sichqon modellari qo'llanildi. Jigar metastazlari bo'lgan KRR bemorlarida GVB buzilishi va metastaz joylarida bakterial kolonizatsiya aniqlandi. Eggerthella lenta GVB shikastlanish belgisi bo'lgan plazmalemma vezikulasi bilan bog'liq 1-oqsil (PV-1) ifodasi yuqori bo'lgan bemorlarda ko'paygan va uning miqdori metastaz va retsidiv bilan korrelyatsiya qilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Eggerthella lenta GVB shikastlanishi (PV-1 belgisi) va KRR metastazi bilan bog'liq bo'lib, bu 167 kishilik kogorta va gnotobiotik sichqon modellarida tasdiqlangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;In vitro va in vivo tajribalarda E. lenta endotelial zich birikmalar va GVB yaxlitligini buzib, KRR hujayralarining migratsiyasini va jigar metastazini kuchaytirdi. Mexanistik jihatdan, E. lenta endotelial hujayralarga yopishib, TLR4-ga bog'liq yo'l orqali endoplazmatik retikulum (ER) stressini faollashtirdi va autofagiya hamda apoptozni rag'batlantirdi. PERK nokauti ER stressini susaytirdi, autofagiya va apoptozning oldini oldi hamda E. lenta tomonidan qo'zg'atilgan ZO-1 va Claudin-5 ifodasini pasaytirdi. Ushbu topilmalar E. lenta bilan bog'liq KRR metastazini davolashda mikrobiotaga yo'naltirilgan strategiyalar va PERK ingibitsiyasining klinik salohiyatini ta'kidlaydi.&lt;/p&gt;\n&lt;p&gt;Yo'g'on ichak saratoni (KRR) butun dunyo bo'ylab saraton bilan bog'liq o'limning asosiy sabablaridan biri bo'lib qolmoqda, metastaz esa yomon prognozning asosiy omilidir. Jigar KRRda masofaviy metastazning eng keng tarqalgan va muhim joyidir va jigar disseminatsiyasini keltirib chiqaradigan mexanizmlarni tushunish ustuvor vazifadir. Metastaz murakkab, ko'p bosqichli jarayon bo'lib, o'sma hujayralarining qon tomir endotelial qatlami orqali qon aylanishiga kirishi (intravazatsiya) muhim dastlabki bosqichdir. So'nggi yillarda ichak epiteliyasi ostida joylashgan ixtisoslashgan endotelial to'siq bo'lgan ichak qon tomir to'sig'i (GVB) hal qiluvchi darvozabon sifatida aniqlandi. U ichak lümeni va qon oqimi o'rtasidagi moddalar va hujayralar almashinuvini tartibga soladi, shu bilan birlamchi o'smadan potentsial metastatik tarqalish uchun hal qiluvchi nazorat punktini ifodalaydi.&lt;/p&gt;\n&lt;p&gt;GVB yaxlitligi patologik translokatsiyaning oldini olish uchun juda muhimdir. Plazmalemma vezikulasi bilan bog'liq 1-oqsil (PV-1) ifodasining ortishi bilan belgilanadigan GVB buzilishi qon tomir o'tkazuvchanligining oshishiga olib keladi. Ushbu nuqson nafaqat o'sma hujayralarining portal qon aylanishiga kirishini osonlashtirishda, balki metastatik nishani shakllantirishda ham ishtirok etadi. Angiogenezga qarshi terapiya davolash strategiyasining asosi bo'lib kelgan bo'lsa-da, uning paradoksal ta'siri — jumladan, o'sma invazivligi va kimyoviy qarshilikni kuchaytirishi mumkin bo'lgan gipoksik, yallig'lanishli mikro muhitni rag'batlantirish — muqobil davolash usullariga ehtiyojni ta'kidlaydi. Yangi dalillar shuni ko'rsatadiki, o'sma qon tomirlarini normallashtirish va xususan, GVB yaxlitligini tiklash metastazni, ayniqsa jigarga metastazni bostirishda hozirgi davolash usullaridan ko'ra samaraliroq bo'lishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GVB — bu ichakdan qonga moddalar o'tishini nazorat qiluvchi endotelial hujayralar to'sig'i; uning shikastlanishi (PV-1 belgisi) metastaz uchun yo'l ochadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;GVB bilan bevosita aloqada bo'lgan ichak mikrobiotasi GVB funksiyasining asosiy modulyatoridir. Mikrobiotaning ichak qon tomirlarini qayta qurish va funksiyasidagi roli yaxshi o'rnatilgan. Xususan, maxsus patogen bakteriyalar GVB yaxlitligini bevosita buzishi mumkin. Masalan, Salmonella typhimurium endotelial Wnt/β-catenin signal yo'liga aralashib, GVBni buzishi va bakteriyalarning jigarga tarqalishini rag'batlantirishi mumkin. Eng muhimi, yaqinda o'tkazilgan tadqiqot GVB shikastlanishini keltirib chiqaradigan, bakteriyalarning jigarga translokatsiyasini osonlashtiradigan va ko'payayotgan saraton hujayralari bilan birga joylashgan jigar metastazlarida boyitilgan pro-invaziv Escherichia coli shtammini (C17) aniqladi. Ushbu topilmalar maxsus mikrob agenti, GVB buzilishi va KRR jigar metastazi (CRLM) o'rtasida to'g'ridan-to'g'ri bog'liqlikni o'rnatadi.&lt;/p&gt;\n&lt;p&gt;Ushbu yutuqlarga qaramay, ichak mikrobiotasi KRR metastaziga, ayniqsa jigarga ta'sir qilish uchun GVB yaxlitligini qanday tartibga solishi mexanizmlari hali ham yaxshi aniqlanmagan. GVB shikastlanishi uchun javobgar bo'lgan asosiy patogen bakteriyalarni aniqlash va ularning kanserogen mexanizmlarini batafsil tushunish ushbu sohadagi muhim bo'shliqlardir. Shuning uchun, ushbu tadqiqot GVB buzilishi bilan bog'liq asosiy ichak mikroblarini skrining qilish va tavsiflash hamda ularning KRR jigar metastazini qo'zg'atishdagi o'ziga xos rollari va mexanizmlarini aniqlashga qaratilgan.&lt;/p&gt;\n&lt;p&gt;Yo'g'on ichak tomirlaridagi GVB holatini tekshirish uchun biz CRC bilan og'rigan bemorlardan (uzoq masofali metastazlar bilan yoki ularsiz, n = 80) va Fudan universiteti Shanxay onkologiya markazining (FUSCC) o'quv kohortasidagi sog'lom sub'ektlardan (n = 20) tashxis qo'yilgan vaqtda olingan formalin bilan fiksatsiyalangan va kerosin bilan qoplangan (FFPE) yo'g'on ichak rezektsiyasi namunalarining retrospektiv tahlilini (o'rtacha kuzatuv muddati 2,1 yil) o'tkazdik (1-rasm; Jadval SN). Birinchidan, biz noaniq bo'yash reaktsiyalarini istisno qilgandan so'ng, endotelial hujayralardagi PV-1 ning o'rtacha floresans intensivligi (MFI) (CD34 ga nisbatan) CRC bilan og'rigan bemorlarda sog'lom nazorat namunalariga qaraganda yuqoriroq ekanligini kuzatdik. Shunisi e'tiborga loyiqki, PV-1 darajasi CRC bilan og'rigan bemorlarning saraton bo'lmagan to'qimalarida ham sog'lom nazorat to'qimalariga qaraganda yuqori bo'lgan, bu GVB nafaqat o'sma to'qimasi ichida, balki qo'shni sog'lom shilliq qavatda ham o'zgarganligini ko'rsatadi (1b, d-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GVB buzilishining belgisi bo'lgan PV-1 darajasi CRC bilan og'rigan bemorlarning tomirlarida, ayniqsa jigar metastazlari (CRLM) mavjud bo'lganda sezilarli darajada oshadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;CRC bilan og'rigan bemorlarda PV-1 darajasining yuqoriligi uzoq masofali metastazlar bilan bog'liqligini baholash uchun biz CRC bilan og'rigan bemorlarning namunalarini jigar metastazlari rivojlangan (n = 28) va rivojlanmagan (n = 52) guruhlarga ajratdik. Ushbu tahlil shuni ko'rsatdiki, metastazsiz bemorlarga nisbatan CRLM bilan og'rigan bemorlarda PV-1 darajasi yuqoriroq bo'lgan (1c, d-rasm), bu CRLM bilan og'rigan bemorlarda GVB buzilishi bo'lishi mumkinligini ko'rsatadi. Bertocchi va boshqalar tomonidan xabar qilingan, E. coli keltirib chiqaradigan GVB buzilishi CRC ning jigarga metastazlanishiga yordam berishi va PV-1 ekspressiyasining oshishi uzoq muddatli qaytalanish bilan bog'liqligini ko'rsatadigan oldingi topilmalarga muvofiq, bizning ma'lumotlarimiz Eggerthella lenta bilan boyitilgan bemorlarda ham shunga o'xshash kuzatishlarni ko'rsatdi (1a–d-rasm). Turli xil bakterial turlar bo'yicha ushbu mos keladigan topilmalar GVB buzilishining CRC metastazida umumiy patogen mexanizm sifatida kengroq ahamiyatini ta'kidlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GVB (ichak-tomir to'sig'i) — bakteriyalar va toksinlarning qon oqimiga kirishiga to'sqinlik qiluvchi ichak va qon tomir tizimi o'rtasidagi to'siq; PV-1 — endotelial fenestralar diafragmalarining tarkibiy qismi bo'lgan oqsil, uning ko'payishi ushbu to'siq yaxlitligining buzilishidan dalolat beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ichakda yashovchi E. lenta bakteriyasi GVB shikastlanishi, o‘sma metastazi va qaytalanishi bilan bog‘liq. Mikrobiomaning GVB shikastlanishidagi ishtirokini yaxshiroq tushunish uchun PV-1 va CD34 markerlari uchun konfokal mikroskopiya yordamida 16S rDNA bo‘yalishi amalga oshirildi. Metastatik bo‘lmagan yo‘g‘on ichak saratoni (KRR) bilan og‘rigan bemorlarga nisbatan, jigar metastazlari (CRLM) bo‘lgan bemorlarning o‘sma to‘qimalari bakteriyalar bilan kuchliroq kolonizatsiya qilingan va bu PV-1 darajasining oshishi bilan birga kechgan (1d-rasm). Keyinchalik biz bemorlarni PV-1 ning CD34 ga nisbatan median darajasiga ko‘ra “PV-1 high” (n = 40) va “PV-1 low” (n = 40) guruhlariga ajratdik va GVB shikastlanishining yengil va og‘ir darajalari bo‘lgan bemorlarda ichak mikrobiotasi taksonomiyasini tavsiflash maqsadida najas namunalarining metagenomik ketma-ketligini tahlil qildik (2a-rasm). Bir o‘zgaruvchili tahlillar PV-1 holati o‘sma tugunlari metastazi (TNM) bosqichi, qon tomir invaziyasi, omon qolish va qaytalanish bilan sezilarli darajada bog‘liqligini ko‘rsatdi (S2-jadval). Ushbu korrelyatsiyalar chalkashtiruvchi o‘zgaruvchilarga (yosh, BMI va jins) tuzatish kiritilgandan keyin ham sezilarli bo‘lib qoldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PV-1 ning yuqori darajasi GVB ning og‘ir shikastlanishi, qon tomir invaziyasi va yomonroq prognoz bilan korrelyatsiya qiladi, bu metagenomik tahlil bilan tasdiqlanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;“PV-1 low” guruhiga nisbatan, najas alfa-xilma-xilligining Chao1 baholari “PV-1 high” guruhida sezilarli darajada yuqori edi (FDR = 0.0083, t-test) (2b-rasm; S3-jadval). Biz keyinchalik PV-1 ifodalanishining turli darajalariga ega namunalarda mavjud bo‘lgan taksonlarni aniqlash uchun Uilkoxon testlaridan foydalangan holda differensial ko‘plik tahlilini o‘tkazdik. Turlar darajasida E. lenta va Desulfovibrio turkumidagi turlar (Desulfovibrio vulgaris, Desulfovibrio desulfuricans, Desulfovibrio fairfieldensis va boshqalar) “PV-1 high” guruhida ko‘proq uchradi, bu esa ushbu turlarning KRRdagi GVB shikastlangan faollashgan mikro-muhit bilan ijobiy bog‘liqligini ko‘rsatadi (2c-rasm; S4-jadval). Ushbu turlar orasida E. lenta ning nisbiy ko‘pligi “PV-1 high” guruhida eng yuqori bo‘lib, “PV-1 low” guruhiga nisbatan eng sezilarli farq bilan ajralib turdi (S4 va S5-jadvallar). Korrelyatsion tahlil, shuningdek, najasdagi E. lenta ko‘pligi o‘sma tomirlaridagi PV-1 ifodalanishi bilan sezilarli darajada ijobiy korrelyatsiya qilishini aniqladi (r = 0.2688; P = 0.0159; 2d-rasm; 10 ta asosiy turning nisbiy ko‘pligi va PV-1 o‘rtasidagi korrelyatsiyalar S6-jadvalda keltirilgan).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GVB (Gut-Vascular Barrier) — ichak-qon tomir to‘sig‘i, bakteriyalarning ichakdan qon oqimiga o‘tishini oldini oluvchi tuzilma; uning shikastlanishi tizimli yallig‘lanish va metastazga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Shunday qilib, biz E. lenta GVB shikastlanishida ishtirok etishi mumkinligini taxmin qildik va keyingi tasdiqlovchi tajribalarni o‘tkazdik. E. lenta o‘sma rivojlanishi bilan bog‘liqligini aniqlash uchun biz turli TNM bosqichidagi bemorlar o‘rtasida E. lenta ning nisbiy ko‘pligini solishtirdik. Kutilganidek, E. lenta kasallikning ilg‘or bosqichlaridagi (TNM III/IV bosqichlari, ayniqsa jigar metastazlari bo‘lgan IV bosqich bemorlari) bemorlarda dastlabki bosqichlardagi (TNM I/II bosqichlari) bemorlarga qaraganda sezilarli darajada boyitilgan edi (2e-rasm). E. lenta ning nisbiy ko‘pligi medianasiga ko‘ra, biz bemorlarni “E. lenta high” (n = 40) va “E. lenta low” (n = 40) guruhlariga ajratdik (S7-jadval). Shunisi e’tiborga loyiqki, “E. lenta low” guruhiga nisbatan, ijobiy qon tomir invaziyasi bo‘lgan bemorlarning ulushi “E. lenta high” guruhida sezilarli darajada yuqori edi (2f-rasm). E. lenta infeksiyasining bemorning klinik kechishiga ta’sirini baholash uchun biz E. lenta ko‘pligining oshishi erta qaytalanish va umumiy omon qolish bilan bog‘liqligini baholadik (2g, h-rasm). Kaplan-Mayer egri chiziqlari shuni ko‘rsatdiki, E. lenta ning yuqori ko‘pligi erta qaytalanishning yuqori darajasi bilan sezilarli darajada bog‘liq (P = 0.0326). Umumiy omon qolish nuqtai nazaridan, E. lenta infeksiyasi yomonroq prognozga olib keldi, garchi guruhlar o‘rtasidagi farq statistik jihatdan sezilarli bo‘lmasa ham (P = 0.172). KRR to‘qimalarida E. lenta infeksiyasi hamda PV-1 va CD34 ifodalanishini aniqlash uchun floresan &lt;a href=\"concepts/gibridizatsiya-in-situ.html\"&gt;in situ gibridizatsiyasi&lt;/a&gt; (&lt;a href=\"concepts/fish.html\"&gt;FISH&lt;/a&gt;) ishlatildi (FUSCC kohorti). 2i-rasmda ko‘rsatilganidek, E. lenta KRR to‘qimalariga bostirib kirishi va ko‘pincha PV-1 ning haddan tashqari ifodalanishi bilan birga kechishi aniqlandi. Umuman olganda, natijalarimiz ichakda yashovchi E. lenta bakteriyasi GVB shikastlanishi, o‘sma metastazi va qaytalanishi bilan bog‘liqligini ta’kidlaydi.&lt;/p&gt;\n&lt;p&gt;Jigar metastazlari va o‘pka metastazlari bo‘lgan bemorlarda E. lenta tarqalishida farq bor-yo‘qligini aniqlash uchun biz FUSCC dan 30 ta metastatik bo‘lmagan KRR bemorlari, 20 ta jigar metastazlari bo‘lgan KRR bemorlari va 17 ta o‘pka metastazlari bo‘lgan KRR bemorlarini o‘z ichiga olgan mustaqil kohortni qo‘shib, tasdiqlovchi tajribalarimizni kengaytirdik (S1a-rasm; demografik tafsilotlar S1-jadvalda keltirilgan). Birlamchi o‘sma to‘qimalarining 16S rRNA ketma-ketligi va IF birgalikda lokalizatsiya tahlili orqali biz metastatik bo‘lmagan nazorat guruhlariga nisbatan jigar va o‘pka metastazlari bo‘lgan KRR guruhlarining ikkalasi ham E. lenta, qon tomir endotelial PV-1 ifodalanishi va ATF4 faollashuvining sezilarli darajada yuqori darajalarini ko‘rsatganligini namoyish etdik (6-rasmdagi topilmalarga mos keladi) (S1b–e-rasmlar). Shunisi e’tiborga loyiqki, jigar va o‘pka metastazlari kichik guruhlari o‘rtasida sezilarli farqlar kuzatilmadi (barcha parametrlar uchun P &amp;gt; 0.05).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot bemorlarning klinik namunalarida o‘tkazilgan, bu korrelyatsiyani ko‘rsatadi, lekin E. lenta va metastaz o‘rtasidagi to‘g‘ridan-to‘g‘ri sababiy bog‘liqlikni isbotlamaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Medianaga asoslangan stratifikatsiyadan foydalanib, biz butun kohortni yuqori va past E. lenta ko‘pligi guruhlariga (n = 33 ga qarshi 34) va yuqori va past PV-1 ifodalanishi guruhlariga (n = 33 ga qarshi 34) ajratdik. χ² tahlili metastatik organotropizm (jigar va o‘pka) va E. lenta ko‘pligi (P = 0.9421) yoki PV-1 ifodalanish darajasi (P = 0.9689) o‘rtasida sezilarli bog‘liqlikni aniqlamadi. Muhimi, biz butun tasdiqlovchi kohort bo‘ylab E. lenta ko‘pligi va qon tomir PV-1 ifodalanishi o‘rtasida sezilarli ijobiy korrelyatsiyani aniqladik (S1f-rasm, Pirson r = 0.2631, P = 0.0315). Bundan tashqari, past E. lenta kolonizatsiyasi bo‘lgan bemorlarga nisbatan, yuqori E. lenta kolonizatsiyasi bo‘lgan bemorlar sezilarli darajada yuqori ATF4 ifodalanishini ko‘rsatdilar (χ² testi bo‘yicha P = 0.0004). Ushbu keng qamrovli tasdiqlovchi natijalar organ-spesifik metastazga moyillik bilan bog‘liq potentsial xavotirlarni bartaraf etgan holda, dastlabki topilmalarimizning mustahkamligini kuchaytiradi.&lt;/p&gt;\n&lt;p&gt;Keyinchalik, biz GVB o‘tkazuvchanligini va CRC hujayralarining in vitro endovaskulyar migratsiyasini nazorat qilishdagi ishtirokini tasdiqlash uchun anaerob gram-musbat E. lenta standart shtammini (ATCC, #25559; 3a-rasm) sotib oldik. Birlamchi inson ichak mikrotomir endotelial hujayralari (pHIMEC) E. lenta bilan birgalikda yetishtirilganda, kutilganidek, E. lenta qo‘shilishi 8 soat va 12 soatda naychalar sonini kamaytirdi (3b, c-rasm). Biz E. lentaning o‘zi yoki uning ajratilgan mahsulotlari pHIMEC hayotiyligiga ta’sir qiladimi yoki yo‘qligini qo‘shimcha o‘rgandik. 3d-rasmda ko‘rsatilganidek, tirik E. lenta ta’sirida pHIMEC hayotiyligining pasayishi kuzatildi, issiqlik bilan o‘ldirilgan E. lenta va E. lenta supernatanti bilan ishlov berish esa sezilarli inhibitiv ta’sir ko‘rsatmadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;E. lenta endotelial hujayralar hayotiyligini pasaytiradi va naychalar shakllanishini buzadi, bu ta’sir tirik bakteriyalarning mavjudligiga bog‘liq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bakteriya va xo‘jayin o‘rtasidagi o‘zaro ta’sirga kelsak, patogenning xo‘jayin hujayralariga yopishishi (adgeziya) ko‘pincha tirik bakteriyalar tomonidan xo‘jayinni tartibga solishning birinchi bosqichi hisoblanadi. Keyin biz anaerob sharoitda Transwell planshetlarida E. lenta va nazorat E. coli DH5α shtammining pHIMECga yopishish qobiliyatini o‘lchadik. E. lenta pHIMECga yuqori adgeziya qobiliyatini ko‘rsatdi (1:10 suyultirishda bakterial hujayralarning 81,2% adgeziyasi), DH5α esa bu hujayralarga past adgeziya qobiliyatini ko‘rsatdi (1:10 suyultirishda bakterial hujayralarning atigi 9,7% bog‘langan holda qoldi). E. lenta adgeziyasining patologik ahamiyatini aniqroq o‘rganish uchun biz skanerlovchi elektron mikroskopiya (SEM) yordamida bakterial adgeziyani tizimli ravishda tekshirdik. E. lenta pHIMEC bilan (1:10 va 1:100 suyultirish; 3 ta mustaqil biologik takror) 4 soat davomida birgalikda yetishtirildi va tasvirga olishdan oldin namunalar PBS bilan (har biri 5 daqiqadan 4 marta) yaxshilab yuvildi. SEM shuni aniq ko‘rsatdiki, ko‘p miqdordagi E. lenta hujayralari endotelial yuzaga dozaga bog‘liq holda yopishadi (S2-rasm). Ushbu topilmalar E. lenta ichak mikrotomir muhitini taqlid qiluvchi sharoitlarda endotelial hujayralarga mustahkam va barqaror yopishishini bevosita ko‘rsatadi.&lt;/p&gt;\n&lt;p&gt;Wnt/β-katenin signalizatsiya yo‘li endotelial hujayralar proliferatsiyasi va migratsiyasi bilan bog‘liqligi ma’lum bo‘lganligi sababli, pHIMECda Wnt1, β-katenin va PV-1 ifodasi tekshirildi. E. lenta bilan birgalikda yetishtirish pHIMECda Wnt1 va β-katenin ifodasini sezilarli darajada pasaytirdi, GVB shikastlanishi bilan bog‘liq marker PV-1 ifodasi esa oshdi (3e-rasm). E. lentaning endotelial monolayer o‘tkazuvchanligiga ta’sirini baholash uchun saraton hujayralarining (HCT-116) trans-endotelial invaziyasi tekshirildi (3f-rasm). PBS bilan ishlov berilgan pHIMEC bilan solishtirganda, E. lenta bilan ishlov berilgan pHIMEC monolayerlari orqali sezilarli darajada ko‘proq HCT-116 hujayralari migratsiya qildi (3g, h-rasm). E. lenta bilan ishlov berilgandan so‘ng endotelial monolayer o‘tkazuvchanligidagi o‘zgarishlar, shuningdek, FITC bilan belgilangan dekstranning pHIMEC monolayerlari orqali o‘tishini o‘lchash orqali aniqlandi. PBS bilan ishlov berilgan hujayralar bilan solishtirganda, pHIMECni E. lenta bilan ishlov berish floresan zondning endotelial qatlam orqali o‘tishini sezilarli darajada oshirdi (3i-rasm). IF bo‘yash usuli E. lenta bilan ishlov berilgandan so‘ng, lekin PBS bilan ishlov berilmagandan so‘ng, pHIMEC monolayerlarida vinkulin va ZO-1 o‘tishining sezilarli darajada kamayganligini aniqladi (3j-rasm). Umuman olganda, ushbu natijalar E. lenta endotelial hujayralarga yopishishi va ularning zich kontaktlarini buzishi, CRC hujayralarining endovaskulyar migratsiyasini rag‘batlantirishi mumkinligini ko‘rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GVB (Gut-Vascular Barrier) — ichak-tomir to‘sig‘i bo‘lib, qon-miya to‘sig‘iga o‘xshash tuzilma, bakteriyalar va toksinlarning ichakdan qon oqimiga o‘tishini cheklaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;E. lenta’ning in vivo sharoitida endotelial to‘siqlarga ta’sirini namoyish etish uchun biz keng ta’sir doirasiga ega antibiotiklar (Abx) bilan davolangan sichqonlarga 2 hafta davomida tirik E. lenta yoki PBS yubordik, so‘ngra «Materiallar va usullar» bo‘limida ta’riflanganidek, 20-haftagacha AOM/DSS CRC sichqon modellari va jigar metastaz modellari yaratildi (Rasm 4a). Kutilganidek, o‘sma modelini yaratishdan oldin ikki hafta davomida E. lenta yuborilishi yo‘g‘on ichak qon tomir tuzilishini sezilarli darajada shikastladi, endotelial PV-1 ekspressiyasini oshirdi va ZO-1 ekspressiyasini kamaytirdi (Rasm 4b–d). CRC sichqon modelini yaratgandan so‘ng (20-hafta), biz E. lenta yuborilgan guruhdagi yo‘g‘on ichak o‘smalarida PBS guruhiga nisbatan PV-1 ekspressiyasining oshganini va ZO-1 ekspressiyasining kamayganini aniqladik (nospetsifik bo‘yash reaksiyalari chiqarib tashlangandan so‘ng); bu o‘zgarishlar hatto uzoq masofali metastaz belgilari aniqlanmasdan oldin ham yuz bergan (Rasm 4e–g). Sichqonlarga dum venasi orqali FITC-dekstran yuborildi va E. lenta bilan davolangan sichqonlarning o‘sma to‘qimalarida FITC-dekstranning kuchli sizib chiqishi aniqlandi (Rasm 4h).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/eggerthella-lenta-disrupts-the-gut-vascular-barrier-to-drive-f4.jpg\" alt=\"Rasm 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 4&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;E. lenta kiritilishi endotelial to‘siqni shikastlab, qon tomir o‘tkazuvchanligini va PV-1 ekspressiyasini oshiradi, bu metastaz jarayonidan oldin sodir bo‘ladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Qizig‘i shundaki, E. lenta bilan davolashdan keyin ichak o‘smalari soni ko‘paygan bo‘lsa-da, bu o‘zgarish statistik jihatdan ahamiyatli emas edi (Rasm SN). Bizning mexanistik tadqiqotlarimiz shuni ko‘rsatdiki, E. lenta birinchi navbatda o‘sma hujayralarining ko‘payishi yoki omon qolishini bevosita tartibga solishdan ko‘ra, endoplazmatik retikulum (ER) stress yo‘llari orqali endotelial hujayralarga ta’sir qiladi. Buni tasdiqlash uchun biz CRC organoidlari bilan birgalikda kultivatsiya qilish bo‘yicha qo‘shimcha tajribalar o‘tkazdik. E. lenta ta’siri (12 soat davomida 1:1000 infeksiya ko‘pligida (MOI)) organoidlarning hayotchanligida (P = 0,89) yoki morfologik yaxlitligida sezilarli o‘zgarishlarga olib kelmadi (Rasm SN), bu E. lenta’ning metastazni qo‘zg‘atuvchi ta’siri o‘sma hujayralarini bevosita modulyatsiya qilishdan ko‘ra, qon tomir to‘sig‘ining buzilishi bilan bog‘liq degan gipotezamizni tasdiqlaydi. Keyin biz yallig‘lanish sitokinlari va xemokinlar darajasi ham o‘zgarganligini baholadik. Natijalarimiz shuni ko‘rsatdiki, E. lenta bilan davolash sichqonlarning yo‘g‘on ichak o‘smalarida IL-6, TNF-α va CCL-2 genlari ekspressiyasining sezilarli darajada oshishiga olib keldi (Rasm 4i–k).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MOI (infeksiya ko‘pligi) — madaniyatdagi nishon hujayralar soniga nisbatan infeksion agentlar (bakteriyalar) sonining nisbati.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;E. lenta bilan davolash o‘sma metastazini kuchaytirishi mumkinligini aniqlash uchun biz ortotopik CRLM modellaridan foydalangan holda eksperimental tizimimizni kengaytirdik (Rasm 7a). Natijalar shuni ko‘rsatdiki, E. lenta infeksiyasi jigar metastazlari rivojlangan sichqonlar ulushini va metastatik o‘choqlarning umumiy sirt maydonini oshirish orqali jigardagi metastatik yukni sezilarli darajada oshirgan (Rasm 7b–e). Xulosa qilib aytganda, natijalarimiz E. lenta GVB ni vayron qilishi va in vivo sharoitida CRC ning jigarga metastaz berishiga yordam berishi mumkinligini ko‘rsatadi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/eggerthella-lenta-disrupts-the-gut-vascular-barrier-to-drive-f7.jpg\" alt=\"Rasm 7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 7&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot sichqon modellarida o‘tkazilgan; natijalarni odamlarga ekstrapolyatsiya qilishda ehtiyotkorlik talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;E. lentaning o‘sma endotelial hujayralari va GVBga ta’sirining tartibga solish mexanizmlarini o‘rganish uchun E. lenta-musbat kolorektal saraton (KRS) to‘qimalarining beshta namunasi va E. lenta-manfiy KRS to‘qimalarining beshta namunasida yagona hujayrali RNK sekveniroviyasi (&lt;a href=\"concepts/scrna-seq.html\"&gt;scRNA-seq&lt;/a&gt;) va hujayralarni saralash amalga oshirildi (5-rasm a, b). Kutilganidek, o‘sma qon tomirlaridagi PV-1 darajalari E. lenta-musbat bemorlarda E. lenta-manfiy bemorlarga qaraganda sezilarli darajada yuqori bo‘ldi (5-rasm c). Sifatsiz hujayralar olib tashlangandan so‘ng («Materiallar va usullar» bo‘limiga qarang), biologik tahlil uchun 97 257 ta hujayra saqlanib qoldi. Gen ekspressiyasi va asosiy komponentlar tahlilini normallashtirgandan so‘ng, biz hujayralarni bo‘lish uchun grafik asosidagi klasterlashdan foydalandik, ular keyinchalik marker genlar orqali 11 ta ma’lum hujayra liniyasiga ajratildi (5-rasm d, e): epitelial hujayralar (EPCAM markeri), endotelial hujayralar (PECAM1, CDH5, VWF, RAMP2 va CLDN5 markerlari), T/NK-hujayralar (CD3D va NKG7 markerlari), B-hujayralar (MS4A1 va CD79A markerlari), plazmatik hujayralar (MZB1 markeri), fibroblastlar (COL3A1 markeri), neytrofillar (FCGR3B markeri), miyeloid hujayralar (LYZ markeri), semiz hujayralar (TPSB2 markeri), tuft hujayralari (SH2D6 markeri) va shilliq qavat enterik glial hujayralari (PLP1 markeri).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;97 257 hujayraning &lt;a href=\"concepts/single-cell-rna-sequencing.html\"&gt;scRNA-seq&lt;/a&gt; tahlili 11 ta hujayra turini aniqladi, bunda E. lenta bilan kasallangan bemorlarda o‘sma qon tomirlarida PV-1 darajasining sezilarli darajada oshishi kuzatildi.&lt;br /&gt;\n[!tip] scRNA-seq (yagona hujayrali RNK sekveniroviyasi) — har bir alohida hujayradagi genlar faoliyatini o‘rganishga imkon beruvchi usul bo‘lib, u kam uchraydigan hujayra turlari va ularning o‘ziga xos holatlarini ko‘rish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Jami hujayralarning gen ontologiyasi (GO) tahlili shuni ko‘rsatdiki, E. lenta-musbat guruhda endotelial hujayralarga xos yo‘llarning sezilarli darajada boyishi kuzatildi, jumladan «endotelial hujayralar aktivatsiyasi» (boyitish koeffitsiyenti (EF) = 5,0306, FDR = 0,0119), «endotelial hujayralar rivojlanishini tartibga solish» (EF = 3,9061, FDR = 0,0171) va «endotelial hujayralar apoptotik jarayonini ijobiy tartibga solish» (EF = 3,228, FDR = 0,0239) (SN-rasm S4a, b va SN-jadval S11). Boshqa hujayra turlarida, garchi biz E. lenta-musbat namunalarda epitelial hujayralar ulushining kamayishini kuzatgan bo‘lsak-da, bu ichak to‘sig‘i va endotelial buzilishlarning ikkilamchi ta’sirini aks ettiradi. Keyinchalik, biz ikki guruh bemorlar o‘rtasidagi endotelial hujayralarda gen ekspressiyasidagi farqlarga e’tibor qaratdik. abs(avg_log2FC) &amp;gt; 0,5 va P-qiymati &amp;lt; 0,05 chegaraviy qiymati bilan E. lenta-musbat KRS guruhida nazorat guruhiga nisbatan 216 ta differensial ekspressiyalangan gen (&lt;a href=\"concepts/gene-expression.html\"&gt;DEG&lt;/a&gt;) aniqlandi (5-rasm f; SN-jadval S8). E. lenta-musbat KRS guruhidan olingan o‘sma endotelial hujayralarida yuqori ekspressiyalangan genlar bilan bog‘liq GO biologik jarayonlari asosan ER stressi va autofagiya bilan bog‘liq edi (5-rasm g; SN-jadval S9). Umuman olganda, scRNA-seq natijalari shuni ko‘rsatdiki, E. lenta o‘sma endotelial hujayralarida ER stressi va autofagiya yo‘llarini tartibga solishi mumkin.&lt;/p&gt;\n&lt;p&gt;ER stressini qo‘zg‘atuvchi patogen komponent(lar)ni aniqlash uchun biz yuvilgan E. lenta yoki E. lenta madaniyati supernatantlari yordamida davolash tajribalarini o‘tkazdik. SN-rasm S5a da ko‘rsatilganidek, E. lentaning o‘zi pHIMEC hujayralarida ER stressi javoblarini (p-PERKning ko‘tarilishi bilan tasdiqlangan) va autofagiya aktivatsiyasini (Beclin-1 o‘sishi) qo‘zg‘atdi, holbuki madaniyat supernatanti alohida minimal ta’sir ko‘rsatdi. Shunisi e’tiborga loyiqki, SEM (SN-rasm S2) E. lenta va qon tomir endotelial hujayralari o‘rtasidagi to‘g‘ridan-to‘g‘ri jismoniy o‘zaro ta’sirni tasdiqladi. Ushbu topilmalar shuni ko‘rsatadiki, kuzatilgan effektni ajratilgan metabolitlar emas, balki sirt bilan bog‘liq komponentlar vositachilik qiladi. Bakteriyalarni tanib olishda TLR4 ning o‘rnatilgan rolini hisobga olgan holda, biz uning ushbu jarayondagi ishtirokini maxsus inhibitor TAK-242 yordamida tekshirdik. SN-rasm S5b da ko‘rsatilganidek, TAK-242 bilan oldindan ishlov berish E. lenta tomonidan qo‘zg‘atilgan &lt;a href=\"concepts/endoplasmic-reticulum-stress.html\"&gt;ER stress&lt;/a&gt; markerlari (p-PERK va p-eIF2α) va pHIMECdagi autofagiya aktivatsiyasi ekspressiyasidagi o‘zgarishlarni qaytardi. Muhimi, na DH5α nazorat bakteriyalari, na TAK-242 alohida sezilarli ER stress javoblarini qo‘zg‘atdi. Ushbu selektiv ingibitsiya TLR4 endotelial stress javoblariga E. lentaning ta’sirini vositachilik qiluvchi asosiy retseptor ekanligini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;E. lenta sirt oqsillarining TLR4 retseptori bilan o‘zaro ta’siri endotelial hujayralarda ER stressi va autofagiyani keltirib chiqaradi, bu TAK-242 inhibitori bilan bloklanadi.&lt;br /&gt;\n[!warning] Tadqiqot pHIMEC hujayralarida (in vitro) o‘tkazilgan; E. lenta kolonizatsiyasi va inson to‘qimalaridagi ER stressi o‘rtasidagi &lt;a href=\"concepts/ld.html\"&gt;bog‘liqlik&lt;/a&gt; sabab-oqibat aloqasini yanada tasdiqlashni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu mexanistik xulosalarni klinik jihatdan muhim kontekstda yanada tasdiqlash uchun biz E. lenta kolonizatsiyasi holati bo‘yicha tabaqalashtirilgan inson KRS to‘qimalarida ER stress markerlarini tekshirdik. Immunogistokimyoviy bo‘yash shuni ko‘rsatdiki, E. lenta-manfiy to‘qimalar bilan solishtirganda, E. lenta-musbat KRS to‘qimalari ham BiP, ham p-eIF2α ning sezilarli darajada yuqori ekspressiyasini namoyish etdi (SN-rasm S6). Ushbu natijalar E. lenta kolonizatsiyasi o‘sma mikro muhitida ER stressining kuchayishi bilan bog‘liqligiga to‘g‘ridan-to‘g‘ri in vivo dalillarni taqdim etdi, bu bizning in vitro kuzatishlarimizni kuchli tasdiqlaydi va E. lenta bilan bog‘liq KRS metastazida TLR4–ER stress o‘qining translyatsion ahamiyatini mustahkamlaydi.&lt;/p&gt;\n&lt;p&gt;Omiks tahlilidan olingan yuqoridagi natijalar asosida biz pHIMECs hujayralarida ER stressi va autofagiya bilan bog‘liq genlarning oqsil ekspressiyasini tahlil qildik. Vestern-blot tahlili shuni ko‘rsatdiki, E. coli DH5α yoki PBS bilan ishlov berishga nisbatan, E. lenta bilan ishlov berish pHIMECs hujayralarida BiP, p-PERK, p-eIF2α, ATF4, LC3A/B va Beclin-1 ekspressiyasini oshirdi hamda P62, ZO-1 va Claudin-5 ekspressiyasini pasaytirdi (Rasm 6a). Bundan tashqari, E. lenta bilan ishlov berish pHIMECs hujayralarida apoptozni sezilarli darajada qo‘zg‘atdi (Rasm 6b). Elektron mikroskopiya E. lenta bilan ishlov berilgandan so‘ng pHIMECs hujayralarida autofagosomalar shakllanganligini aniqladi (Rasm 6c). Ushbu ma’lumotlar pHIMECs hujayralari E. lenta bilan ishlov berilgandan so‘ng ER stressi va autofagiya/apoptoz qo‘zg‘atilganligini ko‘rsatdi. ER stressi p-PERK kinaza faolligini oshirib, eIF2α fosforillanishini rag‘batlantirishi va natijada oqsil sintezi hamda hujayra o‘sishining pasayishiga olib kelishi ma’lum. Biz pHIMECs hujayralarida PERK nokdaunini amalga oshirish uchun RNK interferensiyasidan foydalandik va E. lenta ta’sirini PERK darajasi pasaytirilgan pHIMECs hujayralarida qayta baholadik. Natijalar shuni ko‘rsatdiki, PERK siRNA E. lenta keltirib chiqargan ER stressi, autofagiya va apoptozni bartaraf etdi, shuningdek, BiP, p-eIF2α, ATF4, LC3A/B, Beclin-1, ZO-1 va Claudin-5 oqsil ekspressiyasi tiklandi (Rasm 6a, b), bu ER stressi pHIMECs hujayralarida autofagiya va zich kontaktlar (tight junctions) bilan bog‘liq oqsillarning pasayishiga javobgar ekanligini ko‘rsatadi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/eggerthella-lenta-disrupts-the-gut-vascular-barrier-to-drive-f6.jpg\" alt=\"Rasm 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 6&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PERK nokdauni E. lenta keltirib chiqargan ER stressi, autofagiya va apoptozni bartaraf etib, pHIMECs hujayralarida zich kontakt oqsillari (ZO-1, Claudin-5) darajasini tiklaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;PERK signalizatsiyasining E. lenta keltirib chiqargan metastazlardagi funksional rolini qat’iy tasdiqlash uchun biz ortotopik CRLM modellaridan foydalangan holda eksperimental tizimimizni kengaytirdik (Rasm 7a). Natijalarimiz shuni ko‘rsatdiki, E. lenta infeksiyasi jigardagi metastatik yukni sezilarli darajada oshirdi (Rasm 7b–e), qon tomir endotelial hujayralarida PV-1 ekspressiyasini kuchaytirdi va ER stress markeri ATF4 faollashuvi bilan birga kechdi (Rasm 7f–h). GSK2606414 bilan birgalikdagi davolash ushbu ta’sirlarni bartaraf etdi. Bundan tashqari, GSK2606414 bilan monoterapiya metastaz, GVB yaxlitligi yoki ER stress markerlariga sezilarli ta’sir ko‘rsatmadi. Ushbu ma’lumotlar PERK signalizatsiyasi E. lenta keltirib chiqargan ER stressining metastatik rivojlanishni rag‘batlantiruvchi muhim quyi effektori sifatida ishlashiga sababiy dalillarni taqdim etadi. Terapevtik samaradorlik nuqtai nazaridan, GSK2606414 bakterial infeksiya-PERK o‘qiga xos ta’sir ko‘rsatadi, bu esa ichak disbiozi bo‘lgan yo‘g‘on ichak saratoni (CRC) bilan og‘rigan bemorlarda metastazning oldini olish uchun klinik qo‘llash imkoniyatini ta’kidlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GSK2606414 — bu PERK kinazasining selektiv ingibitori bo‘lib, ER stress signallarini bloklaydi. GVB (ichak-qon tomir to‘sig‘i) — ichak va qon aylanish tizimi o‘rtasidagi to‘siq bo‘lib, uning buzilishi metastazga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;GVB sog'lom odamlarda gomeostazni saqlash va himoya kompartmentalizatsiyasi uchun muhim anatomik tuzilmadir. GVB yaxlitligining buzilishi ichak bakteriyalari tomonidan ektopik kolonizatsiyaga yoki yo'g'on ichak saratoni (KRR) jigar metastaziga hissa qo'shishi mumkin. Oldingi tadqiqotlar ichak bakteriyalari GVB buzilishini keltirib chiqaradigan asosiy omillardan biri ekanligini tasdiqladi, bu alkogolsiz steatogepatit rivojlanishi yoki KRR jigar metastazi uchun zaruriy shartdir. Ba'zi tadqiqotlar, shuningdek, S. typhimurium, E. coli C17 va Fusobacterium nucleatum kabi maxsus patogenlar GVB buzilishini keltirib chiqarishi mumkinligini, Akkermansia muciniphila esa in vivo va in vitro sharoitda GVBni tiklashi mumkinligini ko'rsatdi. Biroq, bizning ma'lumotlarimizga ko'ra, hech qanday tadqiqot CRLM yoki og'ir GVB buzilishi bo'lgan bemorlarda ichak mikrobiomini tavsiflamagan yoki asosiy bakteriyalarni tahlil qilmagan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GVBning og'ir buzilishini ko'rsatadigan PV-1 darajasi yuqori bo'lgan bemorlarda E. lenta va Desulfovibrio turkumidagi turlar ko'pligi aniqlangan, bu kasallikning rivojlanishi va erta qaytalanish bilan bog'liq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bu yerda biz GVBning og'ir buzilishidan dalolat beruvchi PV-1 darajasi yuqori bo'lgan bemorlarda E. lenta va Desulfovibrio turkumidagi turlar PV-1 darajasi past bo'lgan bemorlarga qaraganda ko'proq ekanligini ko'rsatdik. Shunisi e'tiborga loyiqki, PV-1 darajasi turlicha bo'lgan bemorlarda differensial ko'plikka ega bo'lgan eng yaxshi bakteriyalar qatoriga hayvonlar modellarida GVB buzilishini keltirib chiqarishi ma'lum bo'lgan bakteriyalar kirmagan. Shuning uchun biz CRLM bilan og'rigan bemorlarda GVB buzilishi uchun boshqa asosiy patogenlar javobgar bo'lishi mumkinligini taxmin qildik. CRLM bilan og'rigan bemorlardan olingan o'sma to'qimalarining FISH tahlili GVB buzilishi joylarida E. lenta boyiganligini tasdiqladi. Ushbu topilmalar asosida biz qo'shimcha tahlillarni o'tkazdik va E. lentaning yuqori miqdori kasallikning yanada rivojlangan bosqichlari, yanada sezilarli qon tomir yoki nerv invaziyasi va erta qaytalanish darajasining oshishi bilan bog'liqligini aniqladik, bu KRR metastazida E. lentaning potentsial rolini ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;FISH (fluoressent in situ gibridizatsiya) — floresan zondlar yordamida hujayralar yoki to'qimalardagi DNK yoki RNK ketma-ketliklarini vizuallashtirish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;E. lenta — odam ovqat hazm qilish traktini odatda kolonizatsiya qiladigan anaerob, gram-musbat batsilladir. Biroq, ko'plab klinik dalillar E. lentaning ichak to'sig'ini buzib o'tib, og'ir bakteriemiya, shuningdek, kasallik holatlarida ekstraintestinal organlarning yallig'lanishini keltirib chiqarishi mumkinligini ko'rsatadi. Qizig'i shundaki, 2010 yildagi klinik holat hisobotida E. lenta va D. desulfuricans keltirib chiqargan polimikrob qon oqimi infektsiyasi haqida so'z boradi, ularning ikkalasi ham bizning tadqiqotimizda PV-1 yuqori bo'lgan guruhda eng ko'p uchraydigan turlar qatoriga kirgan. Bizning in vitro tajribalarimiz shuni ko'rsatdiki, E. lenta aralashuvi inson ichak mikrotomir endotelial hujayralarining (HIMEC) hayotiyligini, shuningdek, hujayralararo zich kontaktlarni buzadi va natijada endotelial monolayer o'tkazuvchanligini oshiradi. Bizning in vivo tajribalarimiz shuni ko'rsatdiki, E. lenta tomonidan GVBning buzilishi KRR hujayralari uchun muhim pre-metastatik nishani ta'minlaydi va mikrob bo'lmagan sichqonlarda KRRning jigar metastazini sezilarli darajada rag'batlantiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot klinik ma'lumotlar va in vitro/in vivo tajribalar kombinatsiyasiga asoslangan; E. lenta metastazga yordam bersa-da, korrelyatsiya har doim ham to'g'ridan-to'g'ri sabab-oqibat bog'liqligini anglatmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Natijalarimizga mos ravishda, Bai va boshqalar sigaret tutuniga duchor bo'lgan va ichak to'sig'i buzilgan sichqonlarda E. lenta boyiganligini xabar qilishdi, bu E. lentaning ichak to'sig'i buzilishiga ta'siri turli patofiziologik jarayonlarda yuz berishi mumkinligini ko'rsatadi. Mexanistik jihatdan biz E. lenta ijobiy bemorlarning o'sma namunalaridagi endotelial hujayralarning PV-1 ekspressiyasi darajasi E. lenta salbiy bemorlarnikiga qaraganda ancha yuqori ekanligini ko'rsatdik. E. lenta ijobiy guruhdagi o'sma endotelial hujayralarida endoplazmatik retikulum (ER) yuklanishiga javobning giperaktivatsiyasi va qon tomir buzilishi markerlarining ortiqcha ekspressiyasi kuzatildi. Biz E. lenta aralashuvidan so'ng HIMECda ER stressi va autofagiya yo'llarining faollashishini, shuningdek, adgeziya bilan bog'liq oqsillarning kamayishini tasdiqladik va bu ta'sirlarni PERK RNK interferentsiyasi orqali qaytarish mumkin edi. Oldingi tadqiqotlarga ko'ra, E. lentaning ko'pligi ichakda va uning atrofida yallig'lanish bilan kuchli bog'liq. Alexander va boshqalar E. lenta Rorc-ga bog'liq tarzda ichak Th17 faollashuvini keltirib chiqarishi va sichqonlarda kolitni yomonlashtirishi mumkinligini xabar qilishdi. Balakrishnan va boshqalar E. lenta CXCL5 va CD4-musbat T hujayralari, shuningdek, interleykin-17 va interferon-γ ishlab chiqaruvchi B hujayralari sonini ko'paytirib, tizimli qarishga o'xshash yallig'lanishni keltirib chiqarishi mumkinligini xabar qilishdi. Bu yerda biz E. lenta tomonidan qo'zg'atilgan, bakteriyalar bilan bevosita aloqa orqali vositachilik qiladigan va PERK faollashuvini inhibe qilish orqali cheklanishi mumkin bo'lgan qon tomir endotelial hujayralar disfunktsiyasining yangi shaklini xabar qilamiz. Shunisi e'tiborga loyiqki, E. lentadan tashqari, boshqa ichak bakteriyalari ham KRR metastazida ishtirok etgan. Masalan, E. coli C17 GVBni buzadi va WNT/β-katenin signalizatsiyasini modulyatsiya qiladi, F. nucleatum esa bu yo'lni FadA orqali faollashtiradi. Bizning birlamchi o'sma kohortamizda E. coli boyimasligi oldingi topilmalarga zid emas. Bertocchi va boshqalar ko'rsatganidek, E. coli C17 rezektsiya paytida birlamchi o'smada aniqlanadigan darajada bo'lishi shart bo'lmagan holda, pre-metastatik nishani o'rnatish uchun ichakdan jigarga ko'chib o'tishi mumkin. Shunday qilib, bizning ma'lumotlarimiz E. colining KRR metastazidagi rolini istisno qilmaydi; aksincha, ular E. lenta kabi ko'plab turli bakteriya turlari konvergent yoki qo'shimcha mexanizmlar orqali jigar metastazini rag'batlantirishi mumkinligini ko'rsatadi. WNT-ga bog'liq yo'llardan farqli o'laroq, 6-rasm. PERK nokdauni E. lenta-ER stress yo'li tomonidan qo'zg'atilgan GVB shikastlanishi va o'sma metastazidan himoya qiladi. a pHIMEC PBS, E. coli DH5α yoki E. lenta bilan birga PERK-siRNA bilan ishlov berildi va keyin ER stressi, endotelial yaxlitlik va autofagiya markerlarining oqsil darajalari uchun western blot orqali tahlil qilindi. b E. lenta va PERK-siRNA bilan ishlov berilgandan so'ng pHIMECning Annexin V/PI bo'yalishi &lt;a href=\"concepts/protochnaya-tsitometriya.html\"&gt;oqim sitometriyasi&lt;/a&gt; orqali Annexin V-PI apoptozni aniqlash to'plami bilan tahlil qilindi. c PBS yoki E. lenta bilan ishlov berilgandan so'ng, pHIMEC transmissiya elektron mikroskopiyasi orqali vizuallashtirildi. N — yadro, RER — qo'pol endoplazmatik retikulum, M — mitoxondriya, AS — autolizosoma, SLy — ikkilamchi lizosoma.&lt;/p&gt;\n&lt;p&gt;Boshqa bakteriyalar uchun tasvirlanganidek, bizning topilmalarimiz shuni ko'rsatadiki, E. lenta GVBni buzadi va kanonik WNT signalizatsiya yo'lining bevosita ishtirokisiz, TLR4-ga bog'liq bo'lgan ER stressi/autofagiya yo'li orqali yo'g'on ichak saratoni (CRC) jigar metastazini rag'batlantiradi. Garchi E. lenta CRC hujayralarining ko'payishini bevosita rag'batlantirmagan bo'lsa-da, biz o'sma hujayralari migratsiyasiga bevosita ta'sirni butunlay istisno qila olmaymiz. Shunga qaramay, bizning ma'lumotlarimiz shuni ko'rsatadiki, E. lenta GVBni buzadi va bu buzilish CRC hujayralarining transendotelial migratsiyasini kuchaytirish uchun etarli. Bundan tashqari, bizning tomir ichiga metastaz modelimizda, E. lenta kolonizatsiyasi bakteriya va o'sma hujayralari o'rtasidagi bevosita aloqa bo'lmaganda jigar metastazini rag'batlantirdi. Shuning uchun biz GVB buzilishi E. lenta bilan bog'liq metastazning asosiy mexanizmi deb hisoblaymiz. Kelgusi tadqiqotlar E. lenta yoki uning metabolitlari endotelial hujayralardan mustaqil ravishda CRC hujayralari migratsiyasini kuchaytirishi mumkinligini bevosita tekshirishi kerak.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;E. lenta PERK/ER stress yo'li orqali GVBni buzib, o'sma hujayralarining transendotelial migratsiyasini kuchaytirib, CRC jigar metastazini rag'batlantiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bizning in vitro ma'lumotlarimiz shuni ko'rsatdiki, E. lenta PERK/ER stress yo'li orqali zich birikma oqsillarining ifodasini bevosita pasaytiradi. Biroq, biz endotelial hujayralar o'limi (8–12 soat ichida sodir bo'ladigan) ham o'tkazuvchanlikning oshishiga hissa qo'shishi mumkinligini istisno qila olmaymiz. Alohida endotelial hujayralarning yo'qolishi zich birikmalarning yaxlitligidan qat'i nazar, o'sma hujayralarining o'tishini osonlashtiradigan jismoniy bo'shliqlarni yaratadi. Bundan tashqari, E. lenta ichak epitelial to'sig'ini buzishi mumkin, bu bizning scRNA-seq ma'lumotlarimiz bilan tasdiqlanadi, bu epitelial hujayralar sonining kamayishi va epitelial birikma genlarining pasayishini ko'rsatadi. Shunday qilib, in vivo GVBga bo'lgan umumiy ta'sir, ehtimol, endotelial birikmalarning bevosita buzilishi, endotelial hujayralar o'limi va epitelial shikastlanishdan kelib chiqadigan potentsial bilvosita ta'sirlarning kombinatsiyasini aks ettiradi. Hujayra o'limini birikma yo'qotilishidan ajratish uchun genetik yoki farmakologik vositalardan foydalanadigan kelgusi tadqiqotlar ushbu omillarning individual hissasini to'liq aniqlash uchun zarurdir. Xulosa qilib aytganda, ushbu tadqiqot birinchi marta E. lenta GVBni buzish orqali CRC jigar metastazini rag'batlantirishini ko'rsatadi. E. lenta qon tomir endotelial hujayralarida ER stressi va autofagiyani qo'zg'atadi, GVB o'tkazuvchanligini oshiradi va CRC hujayralari uchun metastazdan oldingi nishani ta'minlaydi. E. lenta ko'payishi CRLM bilan og'rigan bemorlarda ichak disbiyozining belgilaridan biridir. Shuning uchun, GVBdagi E. lenta yoki ER stress yo'liga yo'naltirilgan ta'sir CRC jigar metastazini oldini olish uchun potentsial strategiya bo'lishi mumkin.&lt;/p&gt;\n&lt;p&gt;Bizning hozirgi tadqiqotimiz ER stress yo'lini E. lenta keltirib chiqaradigan GVB buzilishining muhim vositachisi sifatida belgilagan bo'lsa-da, maqsadli proteomik tahlillar (masalan, lipoprotein profillash) va funktsional mutagenez yondashuvlaridan foydalanadigan kelgusi tekshiruvlar ushbu patogen mexanizm uchun javobgar bo'lgan o'ziga xos bakterial komponentlarni aniqlash uchun zarur bo'ladi. O'ziga xos virulentlik omillarini aniqlash CRC bemorlarida bakteriyalar keltirib chiqaradigan metastazni oldini olish uchun yangi terapevtik nishonlarni ochib berishi mumkin. Antibiotiklar bilan oldindan davolash yoki mikrob bo'lmagan sharoitlar bazal to'siq funktsiyasini buzishi va mikrobial raqobatni kamaytirishi mumkin, bu esa ichakni E. lentaga nisbatan sezgir qilishi mumkin. Shunga qaramay, ushbu tadqiqotdagi izchil in vitro ma'lumotlar bevosita patogen ta'sirni qo'llab-quvvatlaydi. Nisbatan qisqa kuzatuv davri (o'rtacha 2,1 yil) uzoq muddatli omon qolish yoki kech metastaz haqida xulosa chiqarishga imkon bermaydi; kengaytirilgan kuzatuv davom etmoqda va alohida xabar qilinadi. Garchi bizning scRNA-seq ma'lumotlarimizdan foydalangan holda endotelial-immun o'zaro ta'sirini chuqurroq o'rganish ma'lumotli bo'lishi mumkin bo'lsa-da, hozirgi tadqiqot bevosita endotelial javobga qaratilgan. Maxsus immun profillash bilan kelgusi tadqiqotlar E. lenta immun hujayralari orqali mikro muhitni bilvosita qayta shakllantiradimi yoki yo'qligini hal qiladi. Bundan tashqari, bizning scRNA-seq ma'lumotlarimiz E. lenta yuqori bo'lgan bemorlarning endotelial hujayralarida ER stressi bilan bog'liq transkriptlarning boyishini aniqlagan bo'lsa-da va in vitro tajribalar PERK yo'lining faollashishi va funktsional ahamiyatini tasdiqlagan bo'lsa-da, biz namunalarning cheklanganligi va FFPE kesmalarida p-PERK bo'yash bilan bog'liq texnik qiyinchiliklar tufayli bemor to'qimalarida ER stress markerlarining immunohistokimyoviy validatsiyasini bajara olmadik. ER stress faollashuvining in situ fazoviy lokalizatsiyasini tasdiqlash uchun to'qimalarni maxsus yig'ish bilan kelgusi istiqbolli kogortalar kerak bo'ladi. Nihoyat, TLR4 bilan bog'lanadigan o'ziga xos E. lenta sirt ligandi hali aniqlanmagan, ammo bu bakteriyaning genetik jihatdan qiyinligi ushbu tadqiqotda bunday tahlilni istisno qildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Cheklovlar bemor to'qimalarida ER stress markerlarini tekshirishning imkonsizligi va bakterial ligandlarni aniqlash zaruratini o'z ichiga oladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bemorlar va jamoatchilik ishtiroki: Bemorlar va/yoki jamoatchilik ushbu tadqiqotni loyihalash, o'tkazish, hisobot berish yoki tarqatishda ishtirok etmagan.&lt;/p&gt;\n&lt;p&gt;Nashr qilish uchun bemor roziligi: Barcha sub'ektlardan namuna olishdan oldin yozma ravishda xabardor qilingan rozilik olingan.&lt;/p&gt;\n&lt;p&gt;Sporadik kolorektal saraton (KRS) va sog‘lom nazorat guruhidagi bemorlardan olingan FFPE yo‘g‘on ichak to‘qimalari namunalari va juftlashgan axlat namunalari Fudan universiteti Shanxay saraton markazidan (FUSCC kohortasi) olindi. Kiritish va chiqarib tashlash skriningidan so‘ng, tadqiqotimizga jami 100 nafar mos subyekt kiritildi, ularning 20 nafari sog‘lom nazorat guruhi, 52 nafari uzoq metastazlari bo‘lmagan operatsiyagacha bo‘lgan KRS bemorlari va 28 nafari CRLM (jigar metastazlari) bo‘lgan operatsiyagacha bo‘lgan bemorlardir. FUSCC dan mustaqil kohorta jalb qilindi, u 30 nafar metastatik bo‘lmagan KRS bemorlari, 20 nafar CRLM bemorlari va 17 nafar o‘pka metastazlari bo‘lgan KRS bemorlaridan iborat. Qo‘shimcha 10 nafar KRS bemoridan jarrohlik davomida yangi o‘sma to‘qimalari yig‘ildi (scRNA-seq kohortasi). IF bo‘yash uchun FFPE normal, o‘sma atrofi va o‘sma to‘qimalaridan foydalanildi. Axlat namunalari operatsiyadan oldin steril naychalarga yig‘ildi va keyin metagenomik skriningdan oldin –80 °C da saqlandi. scRNA-seq uchun yangi o‘sma to‘qimasi namunalari olindi. Ishtirokchilarning hech biri ushbu tadqiqotga kiritilgunga qadar bir oy davomida antibiotiklar yoki probiotiklar bilan davolanmagan. Sporadik KRS bilan og‘rigan bemorlar quyidagi mezonlar asosida chiqarib tashlandi: oilaviy KRS tarixi, yallig‘lanish bilan bog‘liq KRS tarixi, ichak tutilishi sindromi tarixi, boshqa birga keladigan xavfli o‘smalar mavjudligi va kolonoskopiyadan oldin axlat namunasi olinmaganligi yoki axlat namunasi olinishidan oldin neoadjuvant terapiya qilinganligi. Jalb qilingan KRS bemorlari jigar metastazlari mavjudligiga qarab KRS guruhiga (uzoq metastazlarsiz) va CRLM guruhiga, shuningdek, PV-1 ning CD34 ga nisbatan median ifodalanishiga ko‘ra PV-1 yuqori guruhiga va PV-1 past guruhiga bo‘lindi. Sog‘lom nazorat guruhi uchun kolonoskopiya skriningidan so‘ng oshqozon-ichak o‘smalari yo‘qligi tasdiqlangan ko‘ngillilar jalb qilindi. KRS bemorlarining klinik patologik xususiyatlariga yosh, jins, tana massasi indeksi, TNM bosqichi, o‘sma hajmi, o‘sma differensiatsiyasi, qon tomir invaziyasi, nerv invaziyasi, omon qolish va o‘sma qaytalanishi kirdi. Bemorlarning klinik ma’lumotlari S1-jadvalda keltirilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqotga 100 nafar KRS va CRLM bemorlari hamda 20 nafar sog‘lom shaxs kiritilgan; klinik ma’lumotlar va namunalar (to‘qimalar va axlat) metagenom va PV-1 ifodalanishini tahlil qilish uchun tizimlashtirilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Eksperimental protokollar Fudan universiteti Shanxay saraton markazining Hayvonlarni parvarish qilish va ulardan foydalanish bo‘yicha institutsional qo‘mitasi tomonidan tasdiqlangan va sichqonlar ustidagi tajribalar Milliy sog‘liqni saqlash institutlarining laboratoriya hayvonlarini parvarish qilish va ulardan foydalanish bo‘yicha ko‘rsatmalariga (№ FUSCC-IACUC-S2023-0002) muvofiq o‘tkazildi. C57BL/6J maxsus patogensiz (SPF) sichqonlar Shanghai SLAC Laboratory Animal Co., Ltd. kompaniyasidan sotib olindi. Barcha sichqonlar Shanghai SLAC Laboratory Animal Co., Ltd. dagi SPF inshootida oziq-ovqat va suvga erkin kirish imkoniyati bilan saqlandi.&lt;/p&gt;\n&lt;p&gt;1-protokol. Sakkiz haftalik C57BL/6J erkak sichqonlari ikkita guruhga tasodifiy taqsimlandi: CRLM nazorat guruhi va CRLM + E. lenta guruhi. Bir hafta moslashgandan so‘ng, sichqonlar ichak mikrobiotasini kamaytirish uchun ikki hafta davomida ichimlik suvi orqali antibiotiklar kokteyli (Abx) (0,2 g/l ampitsillin, neomitsin va metronidazol va 0,1 g/l vankomitsin) oldi. Keyinchalik, 14 kun davomida sichqonlarga PBS yoki PBSda suspenziya qilingan 10^9 koloniyani hosil qiluvchi birlik (har bir sichqon uchun) tirik E. lenta zond orqali yuborildi. Zondlashdan so‘ng, axlat namunalaridan (har bir sichqon uchun 0,1 g) DNK PowerFecal Pro DNA Kit (QIAamp) yordamida ajratib olindi. DNKning umumiy gen nusxalari E. lenta ning nisbiy ko‘pligini aniqlash uchun har bir axlat namunasi uchun qPCR yordamida baholandi. Zondlashdan 4 hafta o‘tgach, ba’zi sichqonlar tahlil uchun zardob va yo‘g‘on ichak to‘qimasini yig‘ish uchun qurbon qilindi (har bir guruhda sakkizta hayvon). Yuqoridagi zondlash muolajasi tugagandan so‘ng, har bir guruhdagi yana sakkizta sichqonga intraperitoneal ravishda 10 mg/kg tana vazniga azoksimetan (AOM; Sigma, AQSH) yuborildi. 7 kundan so‘ng, AOM yuborilgan sichqonlar 7 kun davomida ichimlik suvida dekstran sulfat natriy (DSS) (1,5% w/v) oldi. DSS bilan davolashdan so‘ng, sichqonlarga 14 kun davomida tiklanishga ruxsat berildi. Ushbu jadval 3 tsikl davomida takrorlandi. Har bir tiklanish oralig‘ida sichqonlarga zond orqali tirik E. lenta shtammlari yoki PBS berildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;qPCR (miqdoriy PZR) — DNK kuchaytirish usuli bo‘lib, u namunadagi ma’lum bir gen nusxalarini real vaqt rejimida aniq o‘lchash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;2-protokol. Ortotopik CRLM modellari: Biz birlamchi yo‘g‘on ichak saratonini simulyatsiya qilish uchun ko‘richakning tutqich uchburchagiga LoVo hujayralarini inyeksiya qilish orqali mikrobsiz nude sichqonlarni yaratdik. Sichqonlar tasodifiy to‘rtta guruhga (n = 16/guruh) bo‘lindi: E. coli DH5α nazorat guruhi; PERK inhibitori GSK2606414 (30 mg/kg) bilan davolangan guruh; E. lenta guruhi; va E. lenta + GSK2606414 birgalikda davolash guruhi. Barcha aralashuvlar 30 kun davomida har 3 kunda bir marta zond orqali amalga oshirildi, shundan so‘ng birlamchi o‘smalar, zardob namunalari va jigar to‘qimalari tizimli ravishda yig‘ildi.&lt;/p&gt;\n&lt;p&gt;FITC-dekstran (50 mg/kg; 70 kDa; Sigma) sichqonlarga dum venasi orqali yuborildi. 4 soatdan keyin o‘sma to‘qimasi gomogenatlari yig‘ildi va o‘sma namunalaridagi FITC-dekstran konsentratsiyasi floresans intensivligi (CLARIOstar Plus Microplate Reader; BMG Labtech, Germaniya) bo‘yicha aniqlandi.&lt;/p&gt;\n&lt;p&gt;E. lenta (ATCC, № 25559), E. lenta turining tipik shtammi, Amerika tipidagi madaniyatlar kolleksiyasidan (ATCC, AQSH) olingan va avval tasvirlangan 23-protokolga muvofiq triptik soya bulyonida (TSB, Corning, AQSH) o‘stirilgan. Bakteriyalar miqdori ketma-ket suyultirish va TSB agar plitalariga ekish yordamida o‘lchandi. Bakteriyalarning tozaligi maxsus praymerlar (F: 5′-ATACTAGGTGTGGGGGGCTCCG-3′ va R: 5′-TTTCCCCGGCTTCACGTCCATG-3′) bilan qPCR orqali tasdiqlandi. E. coli DH5a shtammi (Invitrogen, Kaliforniya, AQSH) 37 °C da Luria–Bertani (BD Biosciences, Difco, Merilend, AQSH) muhitida aerob sharoitda ko‘paytirildi. pHIMEC BeiNa Culture Collection (BNCC379539; Pekin, Xitoy) tomonidan taqdim etildi. pHIMEC endotelial hujayra muhitida (ScienCell, Kaliforniya, AQSH) o‘stirilgan va madaniyat idishi oldindan fibronektin (5 mкг/sm²; Roche, Mannxaym, Germaniya) bilan qoplangan. Inson KRS hujayra liniyasi HCT-116 ATCC dan olingan. Barcha hujayra liniyalari qisqa tandem takroriy tahlili bilan tasdiqlangan va tegishli sharoitlarda o‘stirilgan. Hujayralar, shuningdek, MycoAlert Mycoplasma Detection Kit (Lonza, Belgiya) yordamida mikoplazma uchun tekshirildi. Barcha tajribalar sotib olingandan keyin 12 pasajdan kamroq o‘stirilgan hujayra liniyalari bilan o‘tkazildi.&lt;/p&gt;\n&lt;p&gt;Endotel o'tkazuvchanligini tahlil qilish uchun pHIMECs (2 × 10⁴) 24-quduqli planshetda (teshik hajmi 0,4 mkm; BD Biosciences, AQSh) polietilentereftalat Transwell filtrlariga ekildi va konfluent holatga yetkazildi, shundan so'ng PBS yoki E. lenta (MOI 1:1000) qo'shildi va 24 soat davomida kultivatsiya qilindi. FITC-dekstran (Sigma, AQSh) yakuniy konsentratsiyasi 10 mg/ml bo'lishi uchun yuqori quduqqa qo'shildi. FITC-dekstranning o'tishini ifodalovchi pastki quduqdagi floresansning paydo bo'lishi 40 mkl muhit alikvotlarini vaqt o'tishi bilan olish va SpectraMax planshet o'quvchi (SpectraMax M5, AQSh) yordamida 520 nm da floresansni o'lchash orqali kuzatildi. Trans-endotel migratsiya tahlili uchun pHIMECs 24-quduqli Transwell planshetining (teshik hajmi 8 mkm; BD Biosciences) yuqori qudug'ida monolayer hosil qilish uchun o'stirildi va madaniyatga PBS yoki E. lenta (MOI 1:1000) qo'shildi. 24 soatlik inkubatsiyadan so'ng HCT-116 hujayralari (1 × 10⁴) qo'shildi va pastki quduqlardagi transmigratsiya qilingan HCT-116 hujayralari 24 soatlik inkubatsiyadan keyin metanol bilan fiksatsiya qilindi va kristall binafsha rang bilan bo'yaldi. Har bir tajriba olti marta takrorlandi va har safar har bir namuna uchun uchta quduq sinovdan o'tkazildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Transwell tizimidan foydalanish pHIMECs monolayerining o'tkazuvchanligini va E. lenta ta'sirida HCT-116 migratsiyasini miqdoriy baholash imkonini berdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ATP hayotiylik tahlillari ishlab chiqaruvchining protokoliga (Promega, Viskonsin, AQSh) muvofiq hujayra liniyalari uchun CellTiter-Glo® 2.0 tahlili bilan amalga oshirildi. Hujayralar 30 daqiqa davomida CellTiter-Glo reagenti (100 mkl) bilan lizis qilindi. Lyuminessensiya signallari planshet o'quvchi (BioTek, Vermont, AQSh) bilan aniqlandi.&lt;/p&gt;\n&lt;p&gt;Hujayralar 6-quduqli planshetlarda PBS, DH5α yoki E. lenta bilan alohida, si-NC bilan birgalikda yoki si-PERK bilan birgalikda 24 soat davomida kultivatsiya qilindi. Hujayralar oqim sitometriyasi yordamida tekshirilishidan oldin FITC-annexin V eritmasi va PI eritmasi bilan bo'yaldi. Musbat hujayralar soni Annexin V+/PI+, Annexin V+/PI− va Annexin V–/PI+ bo'lgan hujayralar sonini yig'ish orqali aniqlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Annexin V/PI bilan oqim sitometriyasi usuli membrana yaxlitligi va fosfatidilserin ekspozitsiyasi asosida tirik, erta apoptoz va kech apoptoz/nekrotik hujayralarni farqlash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Axlat DNKsi QIAamp DNA Stool Mini Kit (Qiagen, Hilden, Germaniya) yordamida ekstraksiya qilindi. DNK yaxlitligi, hajmi va konsentratsiyasi agaroz gel elektroforezi va NanoDrop spektrofotometriyasi (NanoDrop, Germaniya) yordamida aniqlandi. Ketma-ketlik kutubxonalari yaratilgandan va sifat nazoratidan o'tgandan so'ng, yuqori samarali ketma-ketlik NovaSeq 6000 platformasi (Illumina) yordamida amalga oshirildi. Xom ketma-ketlik o'qishlari avval ta'riflanganidek, yaroqli o'qishlarni olish uchun qayta ishlandi. Sifat bo'yicha filtrlangan o'qishlar IDBA-UD (V1.1.1) yordamida olindi va qayta yig'ildi. Tozalangan o'qishlar tur darajasidagi ma'lumotlarni olish uchun Kraken2 dasturi (V2.1.1) yordamida ma'lumotlar bazasiga (V202003, ftp://ftp.ccb.jhu.edu/pub/data/kraken2_dbs/) moslashtirildi.&lt;/p&gt;\n&lt;p&gt;scRNA-seq uchun yangi namunalar darhol yig'ib olindi va bir hujayrali suspenziyalarga tayyorlandi. Namunalar hayotiyligini yaxshilash uchun o'lik hujayralar olib tashlandi. Hujayralar 1000 hujayra/mkl konsentratsiyasida 10X Chromium Single-Cell platformasiga (10X Genomics) yuklandi (Single-Cell 3′ library and Gel Bead Kit v3). Emulsiyadagi gel boncuklari (GEMs) hosil bo'lishi, barkodlash, GEM-RT tozalash, komplementar DNK amplifikatsiyasi va kutubxona yaratish ishlab chiqaruvchining protokoliga muvofiq amalga oshirildi. Yakuniy kutubxona havzasi Illumina NovaSeq 6000 da ketma-ketlashtirildi.&lt;/p&gt;\n&lt;p&gt;Tomchi asosidagi scRNA-seq uchun ketma-ketlashtirilgan fastq fayllari moslashtirildi, filtrlandi, barkodlandi va noyob molekulyar identifikatorlar (UMIs) CellRanger Chromium Single-Cell &lt;a href=\"concepts/rna-seq.html\"&gt;RNA-seq&lt;/a&gt; 2.0.2 versiyasi (10X Genomics) va inson referens genom Ensembl 93 (GRCh38) uchun maxsus referens to'plami yordamida hisoblandi. Nihoyat, filtrlangan matritsa Seurat (v5.1.0) ish jarayoni yordamida har bir namuna uchun Seurat ob'ektlarini yaratish uchun ishlatildi. Seurat ob'ektlari keyinchalik birlashtirildi va quyi oqim tahlili uchun ishlatildi.&lt;/p&gt;\n&lt;p&gt;Hujayra turini aniqlash uchun asosiy hujayra turi darajasida hujayralarni ajratish uchun chiziqqa xos markerlar ishlatildi. Klasterga xos marker genlarning ekspressiyasi FindAllMarkers in Seurat yordamida individual klasterdagi hujayralar va boshqa barcha klasterlardagi hujayralar o'rtasida differensial gen ekspressiyasi tahlilini o'tkazish orqali aniqlandi: min.pct: 0.1, logfc.threshold: 1.0 va only.pos: TRUE. Faqat sezilarli darajada tuzatilgan P qiymatiga ega genlar (P &amp;lt; 0.05, FDR-tuzatilgan P qiymati) asosiy hujayra turlarini, shu jumladan epitelial hujayralar, endotelial hujayralar, T/NK hujayralari, B hujayralari, plazma hujayralari, fibroblastlar, neytrofillar, miyeloid hujayralar, semiz hujayralar, tuft hujayralari va shilliq qavat enterik glial hujayralarini aniqlash uchun saqlanib qoldi. Har bir hujayra turidan markerlarning ekspressiyasi, masalan, EPCAM, PECAM1, CD3D, MS4A1 va MZB1, tegishli klasterlarda Seurat-dagi Vlnplot yordamida qo'shimcha tasdiqlandi va vizuallashtirildi.&lt;/p&gt;\n&lt;p&gt;Ikki kichik guruhda aniqlangan DEGs FindMarker yordamida quyidagi parametrlar bilan baholandi: min.pct: 0.1 va logfc.threshold: 0. abs(avg_log2FC) &amp;gt; 0.5 va P qiymati &amp;lt; 0.05 bo'lgan genlar sezilarli darajada yuqori yoki past tartibga solingan genlar deb ataldi. Sezilarli darajada ifodalangan genlarning funktsional annotatsiyasini aniqlash va potentsial signal yo'llarini bashorat qilish uchun genlarni boyitish tahlili Molecular Signatures Database (MSigDB, v2022.1.Mm) dan yuklab olingan ontologiya gen to'plami (C5) (ilgari GO gen to'plamlari) asosida amalga oshirildi, UCSan Diego va Broad Institute25 ning qo'shma loyihasi. Chiqish ro'yxatidagi genlar \"org.Hs.eg.db\" (v3.19.1) asosida ENTREZID yoki ENSEMBL yordamida annotatsiya qilindi va keyin ularning o'rtacha ekspressiyasi bo'yicha kamayish tartibida joylashtirildi. Yaxshi tashkil etilgan genlar ro'yxati clusterProfiler (v4.12.0) dagi enrichGO funktsiyasi yordamida yo'llarni boyitish tahlili uchun kirish sifatida ishlatildi. Sezilarli darajada farq qiluvchi tegishli GO yo'llari (kesish qiymati: P = 0.05, abs(NES) = 1) ggplot2 (v3.5.1) yordamida vizuallashtirildi.&lt;/p&gt;\n&lt;p&gt;Anaerob bakteriyalarni yetishtirish uchun ishlatiladigan barcha jihozlar, eritmalar va planshetlar adgeziya tajribasidan bir kun oldin anaerob kamerada oldindan inkubatsiya qilindi. 48 soat davomida yetishtirilgan E. coli DH5α va E. lenta shtammlari 1,5 ml PBS-Ca/Mg ichida qayta suspenziya qilindi. pHIMEC monosloyiga ega 12-o‘rali Transwell plansheti anaerob sharoitda (80% N2, 10% CO2 va 10% H2) 4 soat davomida bakteriyalar bilan inkubatsiya qilindi. Inkubatsiyadan so‘ng planshet ikki marta PBS-Ca/Mg bilan yuvildi va yuzasida bakteriyalar bog‘langan bo‘lishi mumkin bo‘lgan pHIMEC monosloyi 300 mkl 0,1% tripsin eritmasi bilan 37 °C da anaerob sharoitda 5 daqiqa davomida ajratib olindi. Ushbu o‘ralar yana ikki marta PBS-Ca/Mg bilan yuvildi va 7500× g tezlikda 5 daqiqa davomida sentrifugalandi. Cho‘kma 1 ml PBS-Ca/Mg ichida qayta suspenziya qilindi va Ca/Mg bo‘lmagan PBS ichida 10 barobar suyultirildi, so‘ngra bakteriyalarni hisoblash uchun L-tsistein gidroxlorid monohidrati va rezazurin qo‘shilgan Wilkins–Chalgren agariga ekildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Adgeziya tahlili bakteriyalarning hujayra monosloyiga birikish qobiliyatini ichak muhitini taqlid qiluvchi qat’iy anaerob sharoitda miqdoriy baholash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Formalinda fiksatsiya qilingan va kerosinga (FFPE) joylashtirilgan yo‘g‘on ichak o‘smalari va sog‘lom to‘qimalar kesmalarida IF tahlili o‘tkazildi. 3 mm qalinlikdagi kesmalar inson kolorektal saratoni (KRS) va sog‘lom nazorat to‘qimalari bloklaridan tayyorlandi, deparafinizatsiya qilindi, rehidratatsiya qilindi va 0,1 M Tris-HCl (pH 7,4), 2% homila buqa zardobi va 0,3% Triton X-100 bilan bloklandi. Kesmalar quyidagi antitanachalar bilan bo‘yaldi: anti-PV-1 (Abcam, #27853; #321889, 1 mkg/ml), anti-CD34 (Abcam, #81289, 1:100) yoki anti-ZO-1 (Abcam, #307799, 1:500). Kesmalar birlamchi antitanachalar bilan 4 °C da inkubatsiya qilindi. Keyin kesmalar flyuorofor bilan konjugatsiyalangan tegishli ikkilamchi antitanachalar bilan inkubatsiya qilindi. Tasvirga olishdan oldin yadrolar &lt;a href=\"concepts/dapi.html\"&gt;DAPI&lt;/a&gt; bilan bo‘yaldi. Har bir kesmaga bir tomchi 50% glitserin qo‘shildi va PV-1, CD34 va ZO-1 ekspressiyasini aniqlash uchun lazerli konfokal mikroskopiya (Nikon, Yaponiya) ishlatildi. Tasvir tahlili va flyuoresensiyani miqdoriy baholash uchun Fiji dasturiy ta’minoti ishlatildi.&lt;/p&gt;\n&lt;p&gt;IF bo‘yash uchun pHIMEC hujayralari to‘liq muhitda 24 soat davomida PBS yoki E. lenta (1:1000 MOI) bilan birgalikda yetishtirildi. Keyin hujayralar 0,2% Triton qo‘shilgan PBS ichidagi 4% paraformaldegid bilan fiksatsiya qilindi. Hujayralar 1 soat davomida 1% buqa zardobi albumini bilan bloklandi, so‘ngra 4 °C da bir kecha davomida anti-vinculin (Abcam, #129002, 1:100) yoki anti-ZO-1 (Abcam, #307799, 1:500) antitanachalari bilan inkubatsiya qilindi. Hujayralar keyinchalik yuvildi va tegishli ikkilamchi antitanacha (Abcam) va DAPI bilan inkubatsiya qilindi. Immunogistokimyoviy bo‘yash uchun sichqon jigar to‘qimalari 4% paraformaldegidda fiksatsiya qilindi, kerosinga joylashtirildi, 3 mkm qalinlikdagi kesmalarga kesildi va standart protokollar bo‘yicha H&amp;amp;E bilan bo‘yaldi.&lt;/p&gt;\n&lt;p&gt;Yo‘g‘on ichak o‘smalarining FISH tahlili FFPE bloklarida o‘tkazildi. To‘qima kesmalari 0,1 M Tris-HCl (pH 7,4) ichida 15 daqiqa davomida yuvildi, shundan so‘ng gram-musbat bakteriya hujayra devorlari lizotsim (10 mg/ml) yordamida 37 °C da 30 daqiqa davomida gidrolizlandi. To‘qima kesmalari keyinchalik 5'-Cy3 bilan belgilangan EUB338 zondi (5'-GCTGCCTCCCGTAGGAGT-3') yoki E. lenta zondi (5'-CCTTGCCGTCTGGGCTTT-3') bilan 0,9 M NaCl, 0,02 M Tris-HCl (pH 7,4) va 0,01% SDS o‘z ichiga olgan gibridizatsiya buferida 50 °C da bir kecha davomida gibridizatsiya qilindi. Barcha zondlar probeBase (http://www.microbialecology.net/probebase/) bazasidan olindi va Sangon Biotech kompaniyasi (Shanxay, Xitoy) tomonidan sintez qilindi.&lt;/p&gt;\n&lt;p&gt;Western blot tahlillari avval xabar qilingan usul bo‘yicha amalga oshirildi. Ushbu tadqiqotda ishlatilgan birlamchi antitanachalar: anti-BiP (Cell Signaling Technology, #3177, 1:1000), anti-phospho-PERK (#3179, 1:1000), anti-PERK (#3192, 1:1000), anti-phospho-eIF2α (#3398, 1:1000), anti-eIF2α (#5324, 1:1000), anti-ATF-4 (#11815, 1:1000), anti-ZO-1 (#8193, 1:1000), anti-Claudin-5 (#49564, 1:1000), anti-SQSTM1/p62 (#88588, 1:1000), anti-LC3A/B (#88589, 1:1000), anti-Beclin-1 (#3495, 1:1000), anti-Toll-like Receptor 4 (#38519, 1:1000) va anti-GAPDH (Abcam, #8245, 1:500). Membranadagi antigen-antitanacha kompleksi kuchaytirilgan xemilyuminessensiya reagentlari (Thermo Scientific, Waltham, AQSH) yordamida aniqlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Western blot — oqsillarni molekulyar og‘irligi bo‘yicha ajratish va ularni maxsus antitanachalar yordamida aniqlash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Sichqon yo‘g‘on ichak o‘smalari to‘qimalarining qPCR tahlillari avval tasvirlangan protokollar bo‘yicha o‘tkazildi. Barcha tajribalar uch nusxada bajarildi va β-actin referens gen sifatida tanlandi. Genlarning nisbiy ekspressiya darajalari 2–ΔΔCT usuli yordamida hisoblandi. Ishlatilgan maxsus praymerlarning ketma-ketliklari SN-jadvalda keltirilgan.&lt;/p&gt;\n&lt;p&gt;Transmission elektron mikroskopiya (TEM) tahlili uchun hujayralar yig'ib olindi va darhol 3% glutaraldegidda bir kecha davomida fiksatsiya qilindi. Keyin namunalar PBS bilan uch marta yuvildi va 2 soat davomida 1% osmiy kislotasi bilan postfiksatsiya qilindi. Deionizatsiyalangan suv bilan uch marta yuvilgandan va 50%, 70%, 80%, 90% va 100% spirt hamda 100% atseton bilan bosqichma-bosqich suvsizlantirilgandan so'ng, namunalar hujayra bloklarini hosil qilish uchun epoksi smolaga joylashtirildi. Ultraton kesmalar (50 nm) ultramikrotom (Ultracut UCT, Leica, Germaniya) yordamida olindi. Kesmalar qo'rg'oshin sitrati va uranil atsetati bilan bo'yaldi va TEM (T10, FEI, AQSh) yordamida tekshirildi.&lt;/p&gt;\n&lt;p&gt;SEM tahlili uchun E. lenta bilan ishlov berilgandan so'ng, hujayralar xona haroratida 2 soat davomida glutaraldegid bilan fiksatsiya qilindi va 4 °C da saqlandi. Namunalar keyinchalik PB bilan uch marta yuvildi. Ikkilamchi fiksatsiya 1–2 soat davomida fosfat buferidagi (PB) 1% osmiy tetraoksidi yordamida amalga oshirildi, so'ngra PB bilan uchta qo'shimcha yuvish bajarildi. Suvsizlantirish etanol gradienti (30%–100%) orqali kritik nuqtada quritish bilan amalga oshirildi. Namunalar oltin qatlami bilan qoplandi va skanerlovchi elektron mikroskop (Hitachi, SU8100) ostida tasvirga olindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TEM va SEM — mikroskopiya usullari: TEM hujayralarning ichki tuzilishini kesmalarda o'rganishga imkon beradi, SEM esa namunaning sirtini uch o'lchamli tasvirlash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ikki guruh o'rtasidagi miqdoriy ma'lumotlardagi farqlar juftlashtirilmagan ikki tomonlama Student t-testi yoki Mann-Whitney U testi yordamida, mos ravishda amalga oshirildi. Bir nechta guruhlar o'rtasidagi o'rtacha qiymatlarni taqqoslash Tukey post hoc testi bilan bir tomonlama ANOVA yordamida aniqlandi. E. lenta mo'lligi va CD34 ga nisbatan PV-1 ning MFI o'rtasidagi bog'liqlik ikki tomonlama noparametrik Spearman korrelyatsiyasi va chiziqli regressiya yordamida tahlil qilindi. Bemorlarning kategorik xususiyatlari o'rtasidagi assotsiatsiyalar Fisherning aniq testi yordamida tahlil qilindi. Umumiy omon qolish muddati operatsiyadan o'lim sanasigacha yoki oxirgi kuzatuvgacha bo'lgan vaqt oralig'i sifatida belgilandi. Omon qolish egri chiziqlari va erta retsidiv egri chiziqlari Kaplan-Meier modeli yordamida qurildi va statistik farqni aniqlash uchun log-rank testlari ishlatildi. P-qiymatlari &amp;lt; 0,05 statistik jihatdan sezilarli farq deb hisoblandi (*P &amp;lt; 0,05, **P &amp;lt; 0,01, ***P &amp;lt; 0,001). Barcha statistik tahlillar GraphPad Prism 8 dasturi (GraphPad Inc.) yoki IBM SPSS Statistics 20.0 dasturi (IBM Inc., SPSS) yordamida bajarildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Statistik ahamiyatlilik P &amp;lt; 0,05 darajasida belgilandi; omon qolish tahlili uchun Kaplan-Meier modeli, guruhlarni solishtirish uchun esa ANOVA va Student/Mann-Whitney testlari qo'llanildi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu maqola Creative Commons Attribution 4.0 International litsenziyasi ostida tarqatiladi, u asl muallif(lar) va manbaga tegishli havolalarni ko‘rsatish, Creative Commons litsenziyasiga havola berish va o‘zgartirishlar kiritilganligini belgilash sharti bilan har qanday vosita yoki formatda foydalanish, baham ko‘rish, moslashtirish, tarqatish va ko‘paytirishga ruxsat beradi. Ushbu maqoladagi tasvirlar yoki boshqa uchinchi tomon materiallari, agar material manbasiga oid havolada boshqacha ko‘rsatilmagan bo‘lsa, Creative Commons litsenziyasiga kiritilgan. Agar material Creative Commons litsenziyasiga kiritilmagan bo‘lsa va sizning maqsadli foydalanishingiz qonuniy normalar bilan ruxsat etilmagan bo‘lsa yoki ruxsat etilgan foydalanish doirasidan oshib ketsa, siz bevosita mualliflik huquqi egasidan ruxsat olishingiz kerak. Ushbu litsenziya nusxasini ko‘rish uchun http://creativecommons.org/licenses/by/4.0/ manziliga tashrif buyuring.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/eggerthella-lenta-disrupts-the-gut-vascular-barrier-to-drive-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/eggerthella-lenta-disrupts-the-gut-vascular-barrier-to-drive-f2.jpg\" alt=\"Rasm 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/eggerthella-lenta-disrupts-the-gut-vascular-barrier-to-drive-f3.jpg\" alt=\"Rasm 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/eggerthella-lenta-disrupts-the-gut-vascular-barrier-to-drive-f5.jpg\" alt=\"Rasm 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 5&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/eggerthella-lenta-disrupts-the-gut-vascular-barrier-to-drive.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Saraton&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;metastazlari&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;sababini&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;izlash&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Metagenomika&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;va sichqon&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;modellari&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;NATIJA&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;E. lenta tomir&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;to‘sig‘ini&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;buzadi&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-wei
