            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"180\" cy=\"97\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"580\" cy=\"214\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · ONCOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;OOptik mikroskopiya va&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;sun'iy intellekt&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;glioblastoma retsidivini&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;oldindan aytib beradi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/optical-microscopy-predictions-of-focal-recurrence-in-gliobl-f1.jpg\" alt=\"O'quv kogortasi uchun bemor va namuna xususiyatlari.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;O'quv kogortasi uchun bemor va namuna xususiyatlari.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;O'quv kogortasi uchun bemor va namuna xususiyatlari. (A) UCSF o'quv kogortasining barcha bemorlari (n = 60) uchun individual xususiyatlarni, shu jumladan klinik, radiologik va molekulyar belgilarni batafsil ko'rsatadigan onkoprint. (B) Tadqiqot ish jarayonining sxematik tasviri, unda rezektsiyadan o'tgan bemorlardan o'simta markazidan bitta namuna va chekkalaridan turli xil namunalar olinadi, ular &lt;a href=\"concepts/srh.html\"&gt;SRH&lt;/a&gt; yordamida piksel darajasida tahlil qilinadi. Har bir namuna uchun natija infiltratsiya qiymatidir. Tasvir muallifi: N. Sirivansanti. (C) Evklid masofalaridan foydalangan holda har bir bemorning chekka namunalarining o'simtaga nisbatan nisbiy taqsimoti, eng kichik, median va eng katta o'simta hajmlari vizual tarzda ko'rsatilgan. (D) x, y va z o'qlari bo'ylab 0 atrofida markazlashtirilgan namunalarning unipolyar va taxminan simmetrik taqsimotini ko'rsatadigan yadro zichligi grafiklari.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Glioblastoma bosh miyaning eng tajovuzkor o'simtalaridan biri bo'lib, deyarli barcha bemorlarda kasallik vaqt o'tishi bilan qaytalanadi. Asosiy qiyinchilik yangi o'choq aynan qayerda paydo bo'lishini oldindan bilishda edi. Tadqiqotchilar kimyoviy boyoqtsiz optik mikroskopiya va sun'iy intellekt kombinatsiyasidan foydalanishni taklif qilishdi. Ushbu usul operatsiya vaqtida to'qima chetlaridagi mikroskopik o'simta hujayralarini aniqlash va retsidiv joyini bashorat qilish imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/optical-microscopy-predictions-of-focal-recurrence-in-gliobl.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Stimullangan Raman gistologiyasi bo'yoqlarsiz glioblastoma infiltratsiyasini baholaydi&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fastglioma.html\"&gt;FastGlioma&lt;/a&gt; algoritmi retsidiv zonalarini 80% &lt;a href=\"concepts/area-under-the-curve.html\"&gt;AUC&lt;/a&gt; aniqlik bilan prediktsiya qiladi&lt;/li&gt;\n&lt;li&gt;Optik infiltratsiya ko'rsatkichi genetik markerlardan ko'ra ko'proq ma'lumot beradi&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/optical-microscopy-predictions-of-focal-recurrence-in-gliobl.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Glioblastoma (yuqori darajali xavfli miya o'simtasi) muqarrar retsidiv bilan tavsiflanadi, bu 75% bemorlarda operatsiya bo'shlig'i chetlarida sodir bo'ladi. O'simtaning qayta o'sish nuqtalarini bashorat qilish uchun stimullangan Raman gistologiyasi (SRH — to'qimalarni bo'yashni talab qilmaydigan optik mikroskopiya) va FastGlioma algoritmi qo'llanildi. Model yangi olingan to'qimalarning biokimyoviy kontraktiga asoslanib, o'simta infiltratsiyasi darajasini (&lt;a href=\"concepts/ai-infiltration.html\"&gt;AI-infiltration&lt;/a&gt;) baholaydi.&lt;/p&gt;\n&lt;p&gt;Tadqiqotda IDH geni yovvoyi turdagi glioblastomasi bo'lgan 80 nafar bemor cohortsiyasidan 367 ta to'qima namunasi va 133 454 ta optik tasvir tahlil qilindi. Retsidiv kuzatilgan hududlardan olingan namunalarda AI-infiltration ko'rsatkichlari qaytalanmagan joylarga qaraganda statistik ahamiyatli darajada yuqori bo'ldi (P = 0.03). AI-infiltration, klinik va molekulyar parametrlarni birlashtirgan Random Forest mashinali o'rgatish klassifikatori tekshirish guruhida (n = 20) &lt;a href=\"concepts/roc-krivaya.html\"&gt;ROC&lt;/a&gt; egri chizig'i ostidagi майдонни (&lt;a href=\"concepts/roc-auc.html\"&gt;AUC&lt;/a&gt;) 80% aniqlikda ko'rsatdi.&lt;/p&gt;\n&lt;p&gt;AI-infiltration optik ko'rsatkichi TERT, TP53 genlari mutatsiyasi yoki MGMT promotorining metillanishi kabi standart molekulyar belgilardan ustun kelib, retsidivni bashorat qilishda eng kuchli omil bo'ldi. Model har bir namuna olingan nuqtadan 5 va 10 mm masofada mahalliy retsidiv xavfini muvaffaqiyatli bashorat qildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot ikki markazdan olingan kichik bemorlar guruhi bilan cheklangan va jarrohlik amaliyotiga tatbiq etishdan oldin istiqbolli klinik sinovlarni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-02/optical-microscopy-predictions-of-focal-recurrence-in-gliobl.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Birlamchi standart davolash usullaridan keyin saratonning o‘choqli qaytalanishi (retsidivi) qattiq a’zolar xavfli o‘smalari bilan bog‘liq yuqori o‘limning asosiy sabablaridan biridir. Retsidivni boshqarish glioblastoma (GBM) bilan og‘rigan bemorlar uchun ayniqsa qiyin, chunki bu kasallik umumiy yashash davomiyligi 17 oy bo‘lgan o‘limga olib keladigan kasallikdir (1). Birlamchi tashxis qo‘yilganda standart davolash maksimal xavfsiz rezektsiya va undan keyingi yondosh nurlanish va kimyoterapiyani o‘z ichiga oladi, bu umumiy yashash davomiyligini yaxshilaydi; ammo, bu terapiyalar barqaror emas, chunki deyarli barcha bemorlarda retsidiv kuzatiladi (2–4). Birlamchi davolash muvaffaqiyatsizlikka uchragach, kasallikning keyingi bosqichlarini boshqarish bemorning yashashiga ta’sir qiluvchi fundamental muammo bo‘lib, so‘nggi yigirma yil ichida samarali terapiya usullari mavjud emas. Taxminan 130 ta klinik sinov GBM retsidivi bo‘lgan bemorlar uchun samaradorlikni ko‘rsata olmadi va buning bilan bog‘liq xarajatlar 1,5 milliard AQSh dollaridan oshdi (5, 6). GBM retsidivi har to‘rt bemordan uchtasida rezektsiya bo‘shlig‘ida yoki uning chekkalarida yuzaga keladi (1, 4, 7). O‘sma retsidivi sodir bo‘lgandan va radiografik jihatdan aniq bo‘lgandan so‘ng uni baholash uchun bir nechta strukturaviy va metabolik tasvirlash usullari ishlab chiqilgan (8). Biroq, ko‘pchilik bemorlarda o‘sma retsidivining birlamchi kasallik o‘chog‘iga yaqinligini hisobga olgan holda, jarrohlik chekkasidagi mikroskopik o‘sma infiltratsiyasini miqdoriy baholash kelajakdagi retsidivni bashorat qilish imkoniyatiga ega. Klinik namunalarning an’anaviy gistologiyasi ham vaqt, ham mehnat talab qiladi, bu esa miqyoslilikni cheklaydi (9–12). GBM infiltratsiyasini qayta ishlanmagan jarrohlik to‘qimalari yordamida sun’iy intellekt (SI) orqali baholash bu cheklovni bartaraf etadi, bunda optik mikroskopiya [stimullangan Raman gistologiyasi (SRH)] 11 000 dan ortiq miya o‘smalari to‘qimalari namunalari ma’lumotlar to‘plamida o‘qitilgan vizual fundamental modellar bilan birlashtiriladi (13–21). Bu yerda biz FastGlioma deb nomlangan, ochiq kodli, SIga asoslangan o‘sma infiltratsiyasi modeli yordamida GBM retsidivi bashoratchisini ishlab chiqishni maqsad qilganmiz, u birlamchi jarrohlik rezektsiyasi davomida olingan o‘sma chekkasi namunalari asosida o‘lchanadi. GBM bilan og‘rigan, retsidivi bo‘lgan va bo‘lmagan bemorlar populyatsiyasi har bir namuna olingan joydan 5 va 10 mm masofada retsidivni bashorat qilish uchun SI modelini o‘qitishda ishlatilgan. GBM rezektsiyasi chekkalaridan olingan to‘qimalar namunalari shifokorlarga kelajakdagi retsidivni bashorat qiluvchi klinik jihatdan amaliy ma’lumotlarni taqdim etishi mumkin, bu esa standart davolash usullari mavjud bo‘lmagan kasallikning kech bosqichlarida maqsadli, aniq tibbiyot va o‘smaga yo‘naltirilgan terapiyalar uchun yo‘l ochadi.&lt;/p&gt;\n&lt;p&gt;2022-yil mayidan 2025-yil martigacha gistopatologiya va stimullangan Raman gistologiyasi (SRH) tasvirlarini tahlil qilish uchun to‘qimalar namunalarining fazoviy annotatsiyasi bilan o‘sma rezektsiyasi va o‘sma chekkasidan namuna olishdan o‘tgan IDH-yovvoyi turdagi GBM bilan og‘rigan bemorlardan ko‘p millatli, ko‘p markazli bemorlar kohorti shakllantirildi. Butun kohort 84 nafar bemordan iborat bo‘lib, 60 nafari Kaliforniya universiteti, San-Fransisko (UCSF) va 24 nafari Vena tibbiyot universitetidan edi. Muassasalar o‘rtasida chekka namunalari taqsimoti turlicha bo‘lsa-da (Rasm SN, fig. S2A), 25% dan kam, 26–50% va 51–75% o‘sma chekkasi namunalari bo‘lgan bemorlarni tahlil qilishda muassasalar o‘rtasida progressiyasiz yashash davomiyligida farqlar aniqlanmadi (Rasm SN, fig. S2B). Muassasalarda namuna olishdagi tarafkashlik xavotirini hisobga olgan holda, tahlillarimizning qolgan qismi UCSF kohorti doirasidagi rivojlanish ma’lumotlar to‘plamlarida, UCSF sog‘liqni saqlash tizimidan yana 20 nafar bemordan iborat qo‘shimcha istiqbolli ichki validatsiya kohorti bilan o‘tkazildi. UCSF 60 nafar bemordan iborat o‘qitish kohorti ichida 43 ta GBM Response Assessment in Neuro-Oncology (RANO) 2.0 mezonlari asosida retsidiv berdi (1-rasm A). Kohortlar o‘rtasida demografik (jins va yosh), klinik (yondosh kimyonurlanish terapiyasi) yoki radiografik (o‘sma hajmi, FLAIR hajmi va rezektsiya darajasi) xususiyatlarda sezilarli farqlar aniqlanmadi (1-rasm A va 1-jadval). O‘smalari retsidiv bergan bemorlar retsidiv bo‘lmaganlarga nisbatan TP53 mutatsiyalarining sezilarli darajada yuqori foizini ko‘rsatdi (47 ga qarshi 18%, P = 0,05, Fisherning aniq testi).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;60 bemorda o‘qitilgan FastGlioma SI modeli TP53 mutatsiyalari retsidivli GBMda tez-tez uchrashini (47% ga qarshi 18%) va rezektsiya hajmi hamda infiltratsiya asosiy bashoratchilar ekanligini ko‘rsatdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;SRH yordamida mikroskopik GBM infiltratsiyasini baholash uchun rezektsiya bo‘shliqlarining jarrohlik chekkalaridan yangi to‘qimalar namunalari olindi (1-rasm B) (17, 21). SRH orqali jarrohlik namunalarida yorliqsiz optik tasvirlash amalga oshirildi, bunda tasvir kontrasti namunaning ichki biokimyoviy xususiyatlaridan hosil bo‘ldi, bu esa to‘qimalar bo‘yoqlari yoki dog‘lariga bo‘lgan ehtiyojni chetlab o‘tdi. SRH fundamental modeli FastGlioma'dan GBM infiltratsiyasi balli olindi, u AI-infiltration deb ataladi va 13 ta tibbiyot markazidan olingan to‘qimalar asosida qurilgan hamda markaziy asab tizimi o‘smalarining diagnostik spektrini qamrab oluvchi 3000 dan ortiq bemorning tasvirlash ma’lumotlarini o‘z ichiga olgan (21). FastGlioma modeli butun slaydli SRH tasviridagi o‘sma infiltratsiyasi darajasini ko‘rsatuvchi 0 dan 1 gacha bo‘lgan yagona skalyar qiymatni chiqarish uchun chiziqli slayd ballash qatlamidan foydalanadi. Fokal retsidivning dastlabki joylarini aniqlash uchun modelni o‘qitish 273 ta namunani o‘z ichiga olgan 60 nafar bemorda o‘tkazildi, bunda har bir bemor uchun chekkada olingan joylarning median soni 4,5 (3,0 dan 5,0 gacha) ni tashkil etdi, retsidivli va retsidivsiz kohortlar o‘rtasida namuna sonida sezilarli farq yo‘q (1-jadval). Retsidivli bemorlar kohortida retsidivgacha bo‘lgan median vaqt 5,5 oyni (3,0 dan 9,3 gacha) tashkil etdi. Ekspert nazorati ostida qo‘lda tekshirish yordamida namunalar retsidivli yoki retsidivsiz deb belgilandi. Intraoperatsion navigatsiya skrinshotlari, operatsiyadan keyingi tasvirlash va retsidiv vaqtidagi tasvirlashni solishtirish orqali 59 ta namuna joyi retsidiv joylari, 214 tasi esa retsidivsiz joylar deb belgilandi.&lt;/p&gt;\n&lt;p&gt;O‘sma yoki rezektsiya bo‘shlig‘iga bevosita yaqin hududlardan olingan chekka namunalari har bir bemorning asosiy namunasi (mos yozuvlar koordinatasi sifatida ishlatilgan) va ularning tegishli chekka namunalari o‘rtasidagi Evklid masofasini hisoblash orqali uch o‘lchovli (3D) fazoda fazoviy xaritalandi (1-rasm C). Bu yondashuv bemorlar o‘rtasida nisbiy fazoviy joylashuvni standartlashtirish uchun ishlatilgan. Ushbu grafikni vizual tekshirish har bir rezektsiya bo‘shlig‘i atrofida namunalarning sezilarli klasterlanishsiz keng tarqalishini ko‘rsatdi. Yadro zichligi grafiklari namunalarning x, y va z o‘qlari bo‘ylab unimodal va taxminan simmetrik taqsimotini ko‘rsatdi, bu namunalarning normal taqsimotini yanada tasdiqlaydi (1-rasm D). Namuna taqsimotini yanada baholash uchun chekka namunalari o‘rtasidagi juftlik masofalaridan olingan o‘rtacha SD namuna dispersiyasidagi o‘zgaruvchanlik o‘lchovi sifatida ishlatilgan (Rasm SN, fig. S4A). Retsidiv bergan va bermagan bemorlar o‘rtasida namuna dispersiyasi darajasida sezilarli farq yo‘q edi, bu kohortlar o‘rtasida bemorlar ichida namunalarning taqqoslanadigan taqsimotini ko‘rsatadi (retsidivsiz: 17 ± 5,7 mm; retsidivli: 17 ± 5,4 mm; P = 0,98, mustaqil t-test). Retsidivli namunalarning yadroga yaqinroq olinganligi va shuning uchun kutilgan yuqori infiltratsiya darajasiga ega bo‘lishi mumkinligi haqidagi potentsial tarafkashlikni baholash uchun har bir chekka namunasining o‘z asosiy namunasigacha bo‘lgan masofasi hisoblandi (Rasm SN, fig. S4B). Bu masofa retsidiv bergan va bermagan namunalar o‘rtasida solishtirilganda, sezilarli farq yo‘q edi [retsidivsiz: 29 mm (21 dan 39 gacha); retsidivli: 32 mm (22 dan 44 gacha), P = 0,18, Uilkokson rang-sum testi].&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SRH (stimullangan Raman gistologiyasi) — to‘qimalarni bo‘yashsiz ko‘rish imkonini beruvchi, molekulalar tebranishini tahlil qiluvchi tasvirlash usuli. FastGlioma — ushbu ma’lumotlar asosida o‘sma infiltratsiyasi darajasini baholovchi SI modeli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Nevropatolog hammuallif M.P. o‘sma infiltratsiyasining retsidivga ta’sirini aniqlash uchun gistologik va optik mikroskopiya usullaridan foydalangan holda rezektsiya bo‘shlig‘i chekkalaridan olingan to‘qimalarni tahlil qildi. Gematoksilin va eozin (H&amp;amp;E) va p53 bo‘yash yordamida nevropatolog bahosi har bir namunadagi o‘sma infiltratsiyasi darajasini (path-infiltration deb ataladi) tartibga soldi. p53 yovvoyi turdagi hollarda, o‘sma hujayralari H&amp;amp;E bo‘yalgan odatiy slaydlarda morfologiya (ya’ni, kattalashgan yadrolar, tartibsiz yadro chegaralari, giperxromaziya va h.k.) asosida aniqlandi. Har bir namunadagi yo‘l infiltratsiyasi tasdiqlangan to‘rt bosqichli shkala bo‘yicha tartibli metrik o‘qitish uchun annotatsiya qilindi: (0) normal miya to‘qimasi/o‘sma yo‘q; (1) atipik hujayralar/ehtimoliy o‘sma, lekin aniq emas; (2) siyrak o‘sma infiltratsiyasi; (3) zich o‘sma infiltratsiyasi (21) (2-rasm A). Path-infiltration uchun o‘sma namunalari 32 bemordan 32 ta asosiy namuna va 137 ta chekka namunasidan iborat ma’lumotlar to‘plamini tashkil etdi. SI ma’lumotli yorliqsiz optik mikroskopiya yaqinda nashr etilgan FastGlioma modeliga asoslanib, rezektsiya bo‘shlig‘i chekkalaridan olingan namunalarning butun slaydli optik tasvirlari uchun normallashtirilgan o‘sma infiltratsiyasi qiymatini (AI-infiltration deb ataladi) yaratish uchun ishlatildi (21). Patolog tomonidan annotatsiya qilingan to‘qimalar infiltratsiyasi (path infiltration) va AI-infiltration o‘rtasidagi &lt;a href=\"concepts/ld.html\"&gt;bog‘liqlik&lt;/a&gt; guruhlar bo‘ylab o‘lchovlar bo‘ylab infiltratsiya korrelyatsiyasini ko‘rsatdi (2-rasm B). Tartibli tayinlangan patolog infiltratsiyasi namunalari uchun median AI-infiltration quyidagicha edi: 0, o‘sma aniqlanmagan = 0,31 (0,22 dan 0,45 gacha); 1, atipik hujayralar = 0,38 (0,28 dan 0,54 gacha); 2, siyrak o‘sma infiltratsiyasi = 0,68 (0,55 dan 0,84 gacha); va 3, zich o‘sma infiltratsiyasi = 0,93 (0,88 dan 0,98 gacha). Har bir gistopatologiya guruhi uchun median infiltratsiyani solishtirish uchun Bonferroni tuzatishi bilan juftlik Uilkokson rang-sum testlari o‘tkazildi. 0 va 2 (P = 1,9 × 10⁻⁷), 0 va 3 (P = 2,0 × 10⁻¹¹), 1 va 2 (P = 8,7 × 10⁻¹¹), 1 va 3 (P = 1,3 × 10⁻⁸) va 2 va 3 (P = 5,4 × 10⁻⁶) o‘rtasida sezilarli farqlar kuzatildi, 0 va 1 guruhlari o‘rtasida esa sezilarli farq topilmadi (P = 1,0).&lt;/p&gt;\n&lt;p&gt;Barcha o‘sma yadrosi namunalari infiltrativ o‘sma hujayralarini ko‘rsatganligini tasdiqlash uchun path infiltration taqsimoti yadro namunalari va chekka namunalari o‘rtasida solishtirildi (2-rasm C). Yadrodan olingan namunalar chekka namunalariga nisbatan o‘sma hujayralarining sezilarli darajada yuqori median infiltratsiyasini ko‘rsatdi [yadro: 3 (3 dan 3 gacha); chekka: 2 (1 dan 2 gacha), P = 5,0 × 10⁻¹¹, Uilkokson rang-sum testi]. Infiltratsiya va retsidiv o‘rtasidagi bog‘liqlikni namuna (bemor emas) darajasida aniqlash uchun chekka namunalari retsidiv bergan (n = 38) va retsidiv bermagan (n = 99) namunalar kohortlariga ajratildi. Retsidiv bergan o‘sma chekkasi namunalari gistologik jihatdan belgilangan infiltratsiyaning sezilarli darajada katta darajasini ko‘rsatdi (retsidivsiz namunalar median balli: 2 (0 dan 2 gacha), asimmetriya: -0,40; retsidivli namunalar median balli: 2 (1 dan 3 gacha), asimmetriya: -0,53, P = 0,02, Uilkokson rang-sum testi) (2-rasm D). Ushbu topilmalar yadro (n = 60) va chekka namunalari (n = 273), shuningdek retsidivli (n = 59) va retsidivsiz namunalar (n = 214) uchun SI tomonidan yaratilgan infiltratsiyani solishtirganda ham o‘z kuchida qoldi. Yadro namunalari uchun median AI-infiltration chekka namunalarinikidan sezilarli darajada yuqori edi [yadro: 0,95 (0,91 dan 0,98 gacha); chekka: 0,61 (0,41 dan 0,87 gacha), P = 8,0 × 10⁻¹⁷, Uilkokson rang-sum testi] (2-rasm E), va retsidivli chekka namunalaridagi median AI-infiltration retsidiv bermagan chekka namunalarinikidan sezilarli darajada yuqori edi (retsidivsiz: 0,60 (0,41 dan 0,86 gacha); retsidivli: 0,74 (0,50 dan 0,90 gacha), P = 0,03, Uilkokson rang-sum testi) (2-rasm F). Infiltratsiya va fokal retsidiv o‘rtasidagi bog‘liqlikni aniqlash uchun bashoratchi sifatida faqat path infiltration (mAUC = 0,59 ± 0,20) va bashoratchi sifatida faqat AI-infiltration (mAUC = 0,62 ± 0,17) yordamida logistik regressiya amalga oshirildi (Rasm SN, fig. S5). Ushbu topilmalar o‘sma yadrosi va chekka namunalaridagi gistopatologiya va SI tomonidan yaratilgan GBM infiltratsiyasi o‘lchovlari o‘rtasidagi o‘xshashliklarni ko‘rsatadi, ular alohida-alohida fokal retsidivni etarli darajada bashorat qilmaydi. O‘sma infiltratsiyasini o‘z ichiga olgan omillarning murakkab o‘zaro ta’siri qattiq a’zolar o‘sma retsidivini belgilashini hisobga olgan holda, keyingi qadam infiltratsiya, onkologik va klinik o‘zgaruvchilardan foydalangan holda GBM retsidivi bashoratli modelini qurish edi.&lt;/p&gt;\n&lt;p&gt;Bir nechta onkologik va molekulyar o‘zgaruvchilar GBM retsidivi bilan bog‘liq. Biroq, qaysi belgilar fokal retsidivni bashorat qilishi noma’lumligicha qolmoqda. GBM retsidivi uchun mashinali o‘qitish modellari ishlab chiqildi, ular namuna va alohida bemor darajasidagi o‘zgaruvchilarni, jumladan AI-infiltration, klinik o‘zgaruvchilar, onkologik o‘zgaruvchilar va maqsadli keyingi avlod sekveniroviyasini o‘z ichiga oladi. &lt;a href=\"concepts/vybor-modeley.html\"&gt;Modelni tanlash&lt;/a&gt; va o‘qitish uchun ish jarayoni Rasm SN, fig. S6 da ko‘rsatilgan. Tanlangan o‘zgaruvchilar yordamida oltita klassifikator modeli tekshirildi: logistik regressiya (LR), k-eng yaqin qo‘shnilar (k-NN), tayanch vektor mashinalari (SVM), tasodifiy o‘rmon (RF), gradient kuchaytirilgan daraxtlar (GBT) va ekstremal GBT (XGB) (3-rasm A). Har bir model 10-qatlamli stratifikatsiyalangan ichki o‘zaro tekshirish yordamida o‘qitildi. RF 87% ± 10 mAUC bilan retsidiv uchun eng bashoratli model bo‘lib chiqdi. Retsidiv modeli keyinchalik 98 ta o‘sma chekkasi namunasini o‘z ichiga olgan, 80% AUC (95% ishonch oralig‘i: 0,64 dan 0,97 gacha; 2000 ta qayta namuna olish bilan butstrap) bergan GBM bilan og‘rigan 20 ta qo‘shimcha bemordan iborat noyob istiqbolli ichki kohort yordamida validatsiya qilindi. Har bir klassifikator modeli uchun belgilar vazni aniqlandi va har bir o‘zgaruvchining model ishlashiga qo‘shgan hissasi tahlil qilindi. AI-infiltration sinovdan o‘tgan oltita klassifikatordan beshtasida eng bashoratli o‘zgaruvchi deb topildi (3-rasm B). RF modelidagi har bir o‘zgaruvchi uchun Shapley qo‘shimcha tushuntirish qiymatlari har bir o‘zgaruvchining model ishlashiga qo‘shgan hissasi va yo‘nalishini aniqladi (3-rasm C). AI-infiltration retsidivni bashorat qilishga katta hissa qo‘shdi, bunda infiltratsiyaning kuchayishi retsidiv ehtimolining yuqoriligiga, infiltratsiyaning kamayishi esa retsidiv ehtimolining pastligiga olib keldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tasodifiy o‘rmon (RF) modeli retsidivni bashorat qilishda eng yaxshi aniqlikni (AUC 87%) ko‘rsatdi, bunda AI-infiltration ko‘rsatkichi xavfni belgilovchi asosiy omil bo‘ldi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Model tanlangandan so‘ng, modelning umumlashtirilishi 80% AUC chegarasi bilan klinik foydalilikni saqlab qolgan holda, chekka namunasi retsidivini bashorat qilish uchun zarur bo‘lgan minimal samarali o‘zgaruvchilar sonini aniqlash orqali baholandi. Bu 80% AUC chegarasi bilan qo‘lda teskari belgilarni yo‘q qilish orqali amalga oshirildi, bunda eng kam vaznli o‘zgaruvchi har bir iteratsiyada chegarani saqlab qolish uchun zarur bo‘lgan minimal o‘zgaruvchilar soniga yetguncha yo‘q qilindi. Bu shuni ko‘rsatdiki, RF modeli chekka namunasi retsidivini uchta o‘zgaruvchi bilan bashorat qilishi mumkin: AI-infiltration, yosh va rezektsiya bo‘shlig‘i hajmi (AUC = 82% ± 12) (3-rasm D).&lt;/p&gt;\n&lt;p&gt;Biz rezektsiya bo‘shlig‘i hajmini o‘zgaruvchi sifatida chiziqli regressiya yordamida operatsiyadan oldingi o‘sma hajmi bilan bog‘liqligini baholash orqali qo‘shimcha tekshirdik va sezilarli bog‘liqlikni topdik, ammo o‘rtacha determinatsiya koeffitsienti (R²) ko‘p faktorli tabiatni ko‘rsatadi (β = 0,52, P &amp;lt; 2,0 × 10⁻¹⁶; R² = 0,40).&lt;/p&gt;\n&lt;p&gt;GBMning retsidiv berish moyilligi kimyonurlanish terapiyasiga chidamli bo‘lgan va miyada fokal mintaqaviy vakillikka ega bo‘lishi mumkin bo‘lgan xavfli hujayra subpopulyatsiyalariga bog‘liq. Retsidiv modellari retsidiv joyini bashorat qilish uchun takomillashtirildi. Har bir namunaga nisbatan retsidiv yaqinligini bashorat qilish qobiliyatimizni baholash uchun biz 5 mm va 10 mm masofada retsidivni bashorat qilish uchun avval tanlangan o‘zgaruvchilar to‘plami bilan RF klassifikatsiyasidan foydalandik. Ushbu modellar 5 mm (mAUC: 80% ± 10) va 10 mm (mAUC: 76% ± 13) masofada retsidivni bashorat qilishda yaxshi ishladi (4-rasm A). AI-infiltration'ning ushbu modellar bashorat qilinishiga qo‘shgan hissasini tushunish uchun qisman bog‘liqlik grafiklari yaratildi, ular barcha boshqa o‘zgaruvchilar doimiy bo‘lganda AI-infiltration'ning 5 va 10 mm masofada retsidiv ehtimoliga ta’sirini ko‘rsatdi (4-rasm, B va C). Tasviriy misol fazoviy retsidiv ehtimoli bashoratlarini ko‘rsatadi. Bemorning gadoliniy yuborilgandan keyingi T1 magnit-rezonans tomografiya (MRT) skanlari uchta vaqt nuqtasi uchun ko‘rsatilgan: (i) operatsiyadan 24 soat oldin, (ii) operatsiyadan 48 soat keyin va (iii) o‘sma retsidivini aniqlagan 9 oylik nazorat MRT (4-rasm D). Bemorning namunalari keyinchalik ularning asl o‘smasining 3D tasviri bilan birga grafikda ko‘rsatildi. Har bir namunadan 5 (P5mm) va 10 mm (P10mm) masofada retsidiv ehtimolini ifodalovchi sferalar chizildi (4-rasm E). Birlamchi o‘sma olib tashlanganda, orqa chekka bo‘ylab 1-namuna 0,60 AI-infiltration, 73% P5mm va 87% P10mm ko‘rsatdi. Pastki chekka bo‘ylab 2-namuna 0,94 AI-infiltration, 72% P5mm va 90% P10mm ko‘rsatdi. 2-namuna tasvirlash orqali aniqlangan retsidivga mos keldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot maksimal rezektsiyadan o‘tgan bemorlar ma’lumotlariga asoslangan; modelning operatsiya qilib bo‘lmaydigan o‘smalarga qo‘llanilishi qo‘shimcha o‘rganishni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;GBM o‘sma rezektsiyasi, sitotoksik kimyoterapiya, nurlanish va maqsadli molekulyar terapiyalarga qaramay, tez-tez retsidiv berishi tufayli eng qiyin va o‘limga olib keladigan tashxislardan biri bo‘lib qolmoqda. Retsidiv ko‘pincha rezektsiya bo‘shlig‘i chekkalarida yuzaga keladi (4). Davolash muvaffaqiyatsizligining mintaqaviy o‘ziga xosligini lokalizatsiya qilish uchun biz ushbu tadqiqotda retsidivning optik mikroskopiya SI-infiltratsiya modellarini sinab ko‘rdik va ichki validatsiya qildik. O‘sma infiltratsiyasini tez miqdoriy baholashning ushbu usuli rezektsiya bo‘shlig‘i chekkalaridan birlamchi o‘sma olib tashlash vaqtida olingan qayta ishlanmagan to‘qimalar namunalari yordamida GBM fokal retsidivini bashorat qilish qobiliyatini ko‘rsatdi. Ushbu natijalar kasallikning kech bosqichidagi bemorlar uchun kelajakdagi maqsadli прецизион (aniq) tibbiyot terapiyalarini xabardor qiladi. Bizning topilmalarimiz xavfli hujayra infiltratsiyasi va kimyonurlanish terapiyasidan keyin fokal retsidivning bashorat qilinishi o‘rtasidagi bog‘liqlikni ko‘rsatdi.&lt;/p&gt;\n&lt;p&gt;Ushbu ko‘p markazli, retrospektiv kohort tadqiqoti uchun butun bemorlar kohorti 2022-yil martidan 2025-yil martigacha intraoperatsion SRH tasvirlash uchun ilgari jalb qilingan bemorlardan olingan. UCSF kohorti uchun 2022-yil martidan 2024-yil yanvarigacha 400 dan ortiq bemor va 2200 ta namuna tahlil qilindi, ulardan 273 ta namunaga ega 60 nafar bemorning ichki kichik populyatsiyasi ushbu tadqiqotning o‘qitish kohortiga kiritildi. Kiritish mezonlari rezektsiya vaqtida intraoperatsion SRH tasvirlashdan o‘tgan, patologiya tomonidan tasdiqlangan IDH-yovvoyi turdagi GBM bilan og‘rigan 18 yoshdan katta har qanday bemorni o‘z ichiga oladi. Xuddi shu mezonlardan foydalangan holda, ichki validatsiya uchun UCSF sinov kohorti aniqlandi, u 2024-yil fevral va iyul oylari orasida rezektsiya va intraoperatsion SRH tasvirlashdan o‘tgan 98 ta namunaga ega 20 nafar bemorni o‘z ichiga oladi. Tadqiqot UCSF Inson tadqiqotlarini himoya qilish dasturi institutsional tekshiruv kengashi (IRB) tomonidan tasdiqlangan va barcha bemorlar tadqiqotga kiritilish uchun xabardor qilingan rozilik bergan (UCSF IRB # 17-23215).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/rano-2-0.html\"&gt;RANO 2.0&lt;/a&gt; — miya o‘smalarining terapiyaga javobini baholashning xalqaro mezonlari bo‘lib, MRT ma’lumotlari va bemorning klinik holatiga asoslanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-02/optical-microscopy-predictions-of-focal-recurrence-in-gliobl-f1.jpg\" alt=\"O'quv kogortasi uchun bemor va namuna xususiyatlari.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;O'quv kogortasi uchun bemor va namuna xususiyatlari.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;O'quv kogortasi uchun bemor va namuna xususiyatlari. (A) UCSF o'quv kogortasining barcha bemorlari (n = 60) uchun individual xususiyatlarni, shu jumladan klinik, radiologik va molekulyar belgilarni batafsil ko'rsatadigan onkoprint. (B) Tadqiqot ish jarayonining sxematik tasviri, unda rezektsiyadan o'tgan bemorlardan o'simta markazidan bitta namuna va chekkalaridan turli xil namunalar olinadi, ular SRH yordamida piksel darajasida tahlil qilinadi. Har bir namuna uchun natija infiltratsiya qiymatidir. Tasvir muallifi: N. Sirivansanti. (C) Evklid masofalaridan foydalangan holda har bir bemorning chekka namunalarining o'simtaga nisbatan nisbiy taqsimoti, eng kichik, median va eng katta o'simta hajmlari vizual tarzda ko'rsatilgan. (D) x, y va z o'qlari bo'ylab 0 atrofida markazlashtirilgan namunalarning unipolyar va taxminan simmetrik taqsimotini ko'rsatadigan yadro zichligi grafiklari.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/optical-microscopy-predictions-of-focal-recurrence-in-gliobl-f2.jpg\" alt=\"SRH AI tomonidan yaratilgan infiltratsiya qiymatlari fokal GBM retsidivi bilan bog'liq.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;SRH AI tomonidan yaratilgan infiltratsiya qiymatlari fokal GBM retsidivi bilan bog'liq.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;SRH AI tomonidan yaratilgan infiltratsiya qiymatlari fokal GBM retsidivi bilan bog'liq. (A) O'simta markazi (n = 32) va chekka namunalari (n = 137) gistopatologlar tomonidan 0 dan 3 gacha bo'lgan shkala bo'yicha infiltratsiya darajasini belgilash uchun H&amp;amp;E va p53 bilan bo'yalgan (0, normal miya to'qimasi/o'simta yo'q; 1, atipik hujayralar/mumkin bo'lgan o'simta; 2, siyrak o'simta infiltratsiyasi; 3, zich o'simta infiltratsiyasi). Har bir to'qima namunasining AI-infiltratsiyasi Raman gistologiyasi (B) yordamida hisoblangan FastGlioma yordamida tahlil qilindi. Chekka namunalarning patologik infiltratsiyasi va AI-infiltratsiyasini taqqoslash gistopatologiya guruhlari bo'yicha median infiltratsiyada sezilarli farqlar bilan korrelyatsiyani ko'rsatdi (0 = 0,31 (0,22 dan 0,45 gacha), 1 = 0,38 (0,28 dan 0,54 gacha), 2 = 0,68 (0,55 dan 0,84 gacha) va 3 = 0,93 (0,88 dan 0,98 gacha), Bonferroni tuzatishi bilan juftlik Wilcoxon rank-sum testlari). 0 va 2 (P = 1,9 × 10⁻⁷), 0 va 3 (P = 2,0 × 10⁻¹¹), 1 va 2 (P = 8,7 × 10⁻¹¹), 1 va 3 (P = 1,3 × 10⁻⁸) va 2 va 3 (P = 5,4 × 10⁻⁶) guruhlari o'rtasida sezilarli farqlar kuzatildi. (C) Patologik infiltratsiya Wilcoxon rank-sum testi yordamida markaziy namunalar va chekka namunalarning median qiymatlarida sezilarli farqni tasdiqladi (markaz: 3 (3-3), chekka: 2 (1-2), P = 5,0 × 10⁻¹¹). (D) Retsidiv bo'lgan va retsidiv bo'lmagan namunalar kogortalariga bo'linganda, retsidiv namunalari sezilarli darajada yuqori infiltratsiya taqsimotini ko'rsatdi (retsidivsiz: 2 (0 dan 2 gacha), asimmetriya: -0,40; retsidiv: 2 (1 dan 3 gacha), asimmetriya: -0,53, P = 0,02) Wilcoxon rank-sum testi yordamida. Butun namuna to'plamida (n = 273), AI-infiltratsiyasi uchun Wilcoxon rank-sum testi (E) markaziy namunalarda oshgan median infiltratsiya qiymatlari (markaz: 0,95 (0,91 dan 0,98 gacha), chekka: 0,61 (0,41 dan 0,87 gacha), P = 8,0 × 10⁻¹⁷) va (F) retsidiv chekka namunalarida oshgan median infiltratsiya qiymatlari (retsidivsiz: 0,60 (0,41 dan 0,86 gacha), retsidiv: 0,74 (0,50 dan 0,90 gacha), P = 0,03) bilan o'xshash sezilarli topilmalarni ko'rsatdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/optical-microscopy-predictions-of-focal-recurrence-in-gliobl-f3.jpg\" alt=\"Klassifikator skriningi va modelni o'qitish.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Klassifikator skriningi va modelni o'qitish.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Klassifikator skriningi va modelni o'qitish. (A) Oltita turli klassifikator modellari (LR, kNN, SVM, RF, GBT va XGB) yordamida o'n barobar ichki stratifikatsiyalangan kross-validatsiya o'tkazildi. RF 87% ± 10 mAUC bilan eng yaxshi ishlaydigan model sifatida aniqlandi. (B) Turli klassifikator modellari bo'yicha chekka namuna retsidivining eng yaxshi bashoratchilari AI-infiltratsiyasi oltita modeldan beshtasi uchun eng yuqori hissa qo'shuvchi o'zgaruvchi ekanligini ko'rsatdi. (C) Eng yaxshi ishlaydigan modelning Shapley tahlili har bir o'zgaruvchining model ishlashiga yo'nalishi va ta'sirini ko'rsatdi. (D) RF modelida teskari xususiyatlarni yo'q qilish klinik foydalilikni saqlab qolgan holda eng umumlashtiriladigan modelni yaratish uchun ishlatilgan. Ushbu model faqat AI-infiltratsiyasi, yoshi va rezektsiya bo'shlig'i hajmini 82% ± 12 mAUC bilan o'zgaruvchilar sifatida ishlatishi aniqlandi va AI-infiltratsiyasi eng yaxshi bashoratchi bo'lib qoldi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/optical-microscopy-predictions-of-focal-recurrence-in-gliobl-f4.jpg\" alt=\"AI-infiltratsiya modellashtirish yordamida GBM retsidivini lokalizatsiya qilish va bashorat qilish.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;AI-infiltratsiya modellashtirish yordamida GBM retsidivini lokalizatsiya qilish va bashorat qilish.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;AI-infiltratsiya modellashtirish yordamida GBM retsidivini lokalizatsiya qilish va bashorat qilish. Har bir namuna uchun retsidiv joyi 5 mm yoki 10 mm masofada deb belgilandi. (A) RF modellari har bir namunadan 5 mm (mAUC: 80% ± 10) va 10 mm (mAUC: 76% ± 13) masofada fokal retsidivni bashorat qilish uchun qurilgan. (B va C) Qisman bog'liqlik grafiklari barcha boshqa o'zgaruvchilar doimiy bo'lganda AI-infiltratsiyasining 5 va 10 mm masofada retsidiv ehtimoliga ta'sirini ko'rsatdi. (D) Operatsiyadan 24 soat oldin, operatsiyadan 48 soat o'tgach va retsidiv vaqtida (rezektsiyadan 9 oy o'tgach) namunali bemorning T1 post-gadoliniy sagittal MRT tasvirlari ko'rsatilgan. (E) Bemorning o'smasi, namuna joylari va 5 mm (P5mm) va 10 mm (P10mm) masofada retsidivning bashorat qilingan ehtimollari chizilgan (1-namuna: AI-infiltratsiyasi: 0,60, P5mm: 73%, P10mm: 87%; 2-namuna: AI-infiltratsiyasi: 0,94, P5mm: 72%, P10mm: 90%; 3-namuna: AI-infiltratsiyasi: 0,21, P5mm: 60%, P10mm: 88%; 4-namuna: AI-infiltratsiyasi: 0,99, P5mm: 87%, P10mm: 90%; 5-namuna: AI-infiltratsiyasi: 0,57, P5mm: 70%, P10mm: 83%; 6-namuna: AI-infiltratsiyasi: 0,63, P5mm: 69%, P10mm: 82%). (F) Fokal retsidivni bashorat qilish uchun marker sifatida AI-infiltratsiyasi standart tasvirlashga asoslangan aniqlashni qo'llab-quvvatlaydigan fokal retsidivni bashorat qilish imkonini beradigan usuldir.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/optical-microscopy-predictions-of-focal-recurrence-in-gliobl.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Glioblastoma&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;retsidivining&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;muqarrarligi&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Optik&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;mikroskopiya&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;va SI&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;NATIJA&lt;/text&gt;&
