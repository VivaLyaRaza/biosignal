text":"&lt;p&gt;Рост спроса на электричество для дата-центров заставляет продлевать жизнь угольным станциям, что стоит людям тысяч жизней.&lt;/p&gt;\n","links":[{"url":"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a-card.jpg"},"content":{"title":"Диабет и&amp;nbsp;СДВГ: как расстройство внимания влияет на&amp;nbsp;риск сердечных заболеваний","text":"&lt;p&gt;Масштабное исследование семи стран показало, как СДВГ меняет прогноз здоровья у взрослых пациентов с диабетом второго типа.&lt;/p&gt;\n","links":[{"url":"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-card.jpg"},"content":{"title":"Как увидеть структуру белка, имея в&amp;nbsp;сотни раз меньше данных","text":"&lt;p&gt;Новый алгоритм Fold'EM позволяет восстанавливать атомные модели белков по единичным снимкам, обходясь без долгой реконструкции карт.&lt;/p&gt;\n","links":[{"url":"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html","text":"Читать","arrow":true,"theme":"normal"}]}}]},{"type":"card-layout-block","animated":false,"title":{"text":"Выпуск &amp;middot; 02.10.2026","url":"2026-10-02/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-10-02/optical-microscopy-predictions-of-focal-recurrence-in-gliobl-card.jpg"},"content":{"title":"Как оптическая микроскопия и&amp;nbsp;искусственный интеллект помогают предугадать рецидив глиобластомы","text":"&lt;p&gt;Новый алгоритм анализирует свежие ткани из краев хирургической раны и указывает на участки с высокой вероятностью повторного роста опухоли.&lt;/p&gt;\n","links":[{"url":"2026-10-02/optical-microscopy-predictions-of-focal-recurrence-in-gliobl.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari-card.jpg"},"content":{"title":"Три опасные инфекции и&amp;nbsp;лекарственная устойчивость в&amp;nbsp;одном тесте на&amp;nbsp;базе CRISPR","text":"&lt;p&gt;Ученые объединили диагностику ВИЧ, туберкулеза, малярии и устойчивости к антибиотикам в единую тест-систему.&lt;/p&gt;\n","links":[{"url":"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta-card.jpg"},"content":{"title":"Почему при болезни Гоше возникают судороги: ответ скрыт в&amp;nbsp;развитии мозга","text":"&lt;p&gt;Ученые вырастили «мини-мозги» из клеток пациентов, чтобы понять, как редкая генетическая болезнь нарушает работу нейронов.&lt;/p&gt;\n","links":[{"url":"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/eggerthella-lenta-disrupts-the-gut-vascular-barrier-to-drive-card.jpg"},"content":{"title":"Бактерия в&amp;nbsp;кишечнике помогает раку толстой кишки метастазировать в&amp;nbsp;печень","text":"&lt;p&gt;Микробы могут разрушать сосудистый барьер кишечника, открывая путь опухолевым клеткам в кровоток.&lt;/p&gt;\n","links":[{"url":"2026-10-02/eggerthella-lenta-disrupts-the-gut-vascular-barrier-to-drive.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system-card.jpg"},"content":{"title":"Спиральный катетер SpiraMed: новый способ доставки лекарств прямо в&amp;nbsp;мозг","text":"&lt;p&gt;Инженеры разработали гибкий катетер, который позволяет вводить клеточную и генную терапию в мозг через один прокол, избегая лишних травм.&lt;/p&gt;\n","links":[{"url":"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory-card.jpg"},"content":{"title":"Секретное оружие иммунитета: как регуляторные Т-клетки начинают бороться с&amp;nbsp;раком","text":"&lt;p&gt;Обычно они тормозят иммунный ответ, но под воздействием лекарств эти клетки превращаются в активных убийц опухоли.&lt;/p&gt;\n","links":[{"url":"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus-card.jpg"},"content":{"title":"Как кровь течет в&amp;nbsp;сердце при общем артериальном стволе: первое компьютерное моделирование","text":"&lt;p&gt;Ученые впервые построили цифровую модель редкого порока сердца, чтобы понять, как смешивается кровь и почему клапаны работают со сбоями.&lt;/p&gt;\n","links":[{"url":"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data-card.jpg"},"content":{"title":"Смогут&amp;nbsp;ли нейросети навести порядок в&amp;nbsp;хаосе биологических данных","text":"&lt;p&gt;Миллионы экспериментов в базах данных хранятся без должного описания. Исследователи проверили, справятся ли LLM с их классификацией.&lt;/p&gt;\n","links":[{"url":"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/drought-spec-net-early-tomato-drought-detection-and-potentia-card.jpg"},"content":{"title":"Как нейросеть учится видеть жажду у&amp;nbsp;томатов до&amp;nbsp;появления первых признаков увядания","text":"&lt;p&gt;Новая модель Drought-Spec-Net анализирует спектр света, отраженного от листьев, чтобы предсказать стресс у растений еще до их увядания.&lt;/p&gt;\n","links":[{"url":"2026-10-02/drought-spec-net-early-tomato-drought-detection-and-potentia.html","text":"Читать","arrow":true,"theme":"normal"}]}}]},{"type":"card-layout-block","animated":false,"title":{"text":"Выпуск &amp;middot; 01.10.2026","url":"2026-10-01/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-10-01/single-cell-atlas-of-transcriptomic-vulnerability-across-bra-card.jpg"},"content":{"title":"Карта уязвимости мозга: как болезни меняют клетки человека","text":"&lt;p&gt;Ученые создали масштабный атлас мозга, чтобы понять, что общего у болезней Альцгеймера, Паркинсона и шизофрении на уровне отдельных клеток.&lt;/p&gt;\n","links":[{"url":"2026-10-01/single-cell-atlas-of-transcriptomic-vulnerability-across-bra.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise-card.jpg"},"content":{"title":"Как иммунные клетки провоцируют ожирение печени","text":"&lt;p&gt;Нейтрофилы, которые обычно защищают нас от инфекций, могут становиться виновниками развития стеатогепатита.&lt;/p&gt;\n","links":[{"url":"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut-card.jpg"},"content":{"title":"Как мозг воспроизводит кадры личных воспоминаний","text":"&lt;p&gt;Нейросети помогли доказать: медиальная височная сеть мозга хранит уникальные визуальные детали наших воспоминаний.&lt;/p&gt;\n","links":[{"url":"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/a-serum-thyroid-hormone-metabolite-test-for-molecular-diagno-card.jpg"},"content":{"title":"Анализ крови вместо биопсии: новый способ выявления рака щитовидной железы","text":"&lt;p&gt;Ученые разработали тест на метаболиты гормонов, который помогает отличить доброкачественные узлы от злокачественных без инвазивных процедур.&lt;/p&gt;\n","links":[{"url":"2026-10-01/a-serum-thyroid-hormone-metabolite-test-for-molecular-diagno.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell-card.jpg"},"content":{"title":"Почему иммунитет стареет раньше времени: роль белка KRAS в&amp;nbsp;развитии сердечных болезней","text":"&lt;p&gt;Ученые нашли молекулярный механизм, который связывает преждевременное старение иммунных клеток с ранним атеросклерозом.&lt;/p&gt;\n","links":[{"url":"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic-card.jpg"},"content":{"title":"Почему некоторые люди беззащитны перед сепсисом: разгадка кроется в&amp;nbsp;генах редких популяций","text":"&lt;p&gt;Генетики нашли у жителей Катара редкую мутацию, которая мешает организму вовремя остановить смертельно опасное воспаление.&lt;/p&gt;\n","links":[{"url":"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/a-designed-ubiquitin-binding-protein-selectively-enriches-an-card.jpg"},"content":{"title":"Свободный убиквитин: как ученые научились видеть &amp;laquo;невидимый&amp;raquo; регулятор клеток","text":"&lt;p&gt;Разработан новый белковый зонд UBiP10, который позволяет отследить свободный убиквитин и его роль в жизни клетки.&lt;/p&gt;\n","links":[{"url":"2026-10-01/a-designed-ubiquitin-binding-protein-selectively-enriches-an.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-card.jpg"},"content":{"title":"Как одна деталь в&amp;nbsp;ДНК-конструкторе ломает производство лекарств для генной терапии","text":"&lt;p&gt;Ученые нашли причину генетического брака в заготовках для вирусных векторов и придумали, как его исправить.&lt;/p&gt;\n","links":[{"url":"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont-card.jpg"},"content":{"title":"Скрытая связь: что общего у&amp;nbsp;болезней десен и&amp;nbsp;системного артрита","text":"&lt;p&gt;Биоинформатики нашли генетические ключи, объединяющие пародонтит и системный ювенильный идиопатический артрит.&lt;/p&gt;\n","links":[{"url":"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html","text":"Читать","arrow":true,"theme":"normal"}]}}]},{"type":"extended-features-block","animated":false,"title":"Как устроен БиоСигнал","items":[{"title":"Отбор","text":"&lt;p&gt;Каждый день модель сравнивает десятки свежих исследований и выбирает самые значимые и понятные.&lt;/p&gt;\n"},{"title":"Разбор","text":"&lt;p&gt;Суть, ключевые выводы и ограничения — простым языком, но без упрощений.&lt;/p&gt;\n"},{"title":"Три языка","text":"&lt;p&gt;Каждый материал выходит на русском, узбекском и казахском.&lt;/p&gt;\n"},{"title":"Рисунки и&amp;nbsp;полный текст","text":"&lt;p&gt;Иллюстрации из самих статей, а для открытых лицензий — полный перевод.&lt;/p&gt;\n"}]},{"type":"questions-block","animated":false,"title":"Вопросы","items":[{"title":"&lt;p&gt;Это рецензированные статьи?&lt;/p&gt;\n","text":"&lt;p&gt;Нет, это препринты — свежие работы до рецензирования. В каждом материале отмечены
