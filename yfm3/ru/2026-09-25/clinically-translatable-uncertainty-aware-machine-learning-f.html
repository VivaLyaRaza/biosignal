ятся использование ретроспективных наблюдательных данных из общедоступных когорт и меньший размер женской подгруппы, что требует внешней валидации на более крупных мультицентровых выборках. Кроме того, причинный анализ зависит от допущений об измеренных конфаундерах, которые невозможно полностью верифицировать в наблюдательных данных. В будущем планируется проспективное клиническое внедрение, интеграция данных электронных медицинских карт, носимых датчиков и оценка долгосрочных траекторий сердечно-сосудистого риска.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на ретроспективных данных с меньшей выборкой женщин (n=193), а причинно-следственные выводы требуют проспективной клинической валидации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vnedrenie-v-obshestvennoe-zdravoohranenie\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#vnedrenie-v-obshestvennoe-zdravoohranenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Внедрение в общественное здравоохранение&lt;/span&gt;&lt;/a&gt;Внедрение в общественное здравоохранение&lt;/h4&gt;\n&lt;p&gt;С точки зрения общественного здравоохранения, полученные результаты открывают важные перспективы для практического применения. Во-первых, точное выявление лиц из групп высокого риска с высокой прогностической способностью позволяет проводить раннее вмешательство и адресную профилактику, что потенциально снижает сердечно-сосудистую заболеваемость и смертность. Во-вторых, определение причинных факторов, специфичных для конкретного пола, обосновывает разработку персонализированных стратегий профилактики и инициатив в области точной кардиологии.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Точное выявление групп риска и учет гендерных особенностей позволяют снизить сердечно-сосудистую заболеваемость через раннюю профилактику и персонализированный подход.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В-третьих, прогнозы с оценкой неопределенности повышают доверие клиницистов и способствуют ответственному внедрению систем искусственного интеллекта в повседневную клиническую практику. Оценки неопределенности помогают врачам вовремя заметить случаи, требующие дополнительной проверки или осторожной интерпретации. Наконец, установление причинно-следственных связей для модифицируемых факторов риска, таких как ишемические реакции, вызванные физической нагрузкой, помогает более эффективно распределять ресурсы общественного здравоохранения на скрининг, профилактику и коррекцию образа жизни. Машинное обучение способно дополнять, но не заменять традиционные методы прогнозирования сердечно-сосудистых рисков за счет интеграции множества факторов и поиска скрытых закономерностей, хотя широкое клиническое применение возможно только после проспективной валидации в реальных условиях.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Широкое внедрение алгоритмов машинного обучения в рутинную медицинскую практику требует обязательной предварительной проверки на реальных клинических данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;p&gt;Сердечно-сосудистые заболевания по-прежнему остаются одной из главных глобальных угроз здоровью человечества, что обусловливает острую необходимость в точных, надежных и понятных для клиницистов прогностических моделях. В данном исследовании была разработана комплексная система на базе искусственного интеллекта, которая объединяет гибридную предварительную обработку данных, передовые алгоритмы машинного обучения, оценку неопределенности, методы объяснимого искусственного интеллекта и причинно-следственный анализ значимости признаков для прогнозирования риска сердечно-сосудистых заболеваний на основе структурированных клинических данных.&lt;/p&gt;\n&lt;p&gt;Применение гибридной стратегии восстановления пропущенных данных, включающей метод множественной импутации цепными уравнениями для непрерывных переменных и управляемую случайными лесами импутацию для категориальных показателей, позволило существенно повысить качество информации и улучшить итоговую точность прогнозов. В результате показатель F1-score возрос с 0.87 до 0.89, а площадь под ROC-кривой (ROC-AUC) увеличилась с 0.90 до 0.92.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Импутация (MICE и RF) — это статистические методы восстановления пропущенных значений в медицинских картах: MICE последовательно заполняет пропуски для чисел, а случайный лес (RF) восстанавливает пропущенные категории на основе взаимосвязей других признаков.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Среди всех протестированных моделей машинного обучения алгоритм случайного леса продемонстрировал наиболее стабильные и высокие результаты как в мужской, так и в женской когортах пациентов. Он обеспечил значения ROC-AUC выше 0.90, высокие показатели точности по шкале AUPRC, F1-score, коэффициента корреляции Мэтьюса (MCC) и хорошую калибровку вероятностей, сохранив при этом устойчивость к переобучению при перекрестной проверке. Оценка неопределенности на основе бутстрэпа подтвердила высокую воспроизводимость и надежность прогнозов предложенной системы в клинической практике.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Разработанный гибридный подход на базе машинного обучения повысил ROC-AUC до 0.92 и F1-score до 0.89, а случайный лес показал максимальную стабильность прогнозов для обоих полов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Важнейшим вкладом данной работы стало внедрение причинного машинного обучения в оценку рисков сердечно-сосудистой патологии. Модели LinearDML и CausalForestDML позволили отделить истинные причинные факторы от простых статистических корреляций. Они стабильно выделили количество пораженных крупных сосудов, наклон сегмента ST, статус талассемии и стенокардию напряжения как ключевые детерминанты риска развития сердечных заболеваний.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Причинное машинное обучение (Causal ML, в частности LinearDML и CausalForestDML) — это подход, который помогает понять не просто связь между факторами и болезнью, а выявить истинные причины, на которые можно повлиять терапевтически.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Выявленные существенные различия между мужчинами и женщинами подчеркивают необходимость перехода к персонализированной оценке сердечно-сосудистых рисков вместо применения универсальных моделей для всей популяции. В перспективе планируется протестировать созданный комплекс на расширенных многоцентровых выборках, данных продольных электронных медицинских карт и в ходе проспективных клинических испытаний для развития точной и заслуживающей доверия медицинской аналитики.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f-f1.jpg\" alt=\"Рисунок 1: Ход исследования для предложенного фреймворка машинного обучения с учетом неопределенности для прогнозировани\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Ход исследования для предложенного фреймворка машинного обучения с учетом неопределенности для прогнозирования сердечно-сосудистых заболеваний с исследованием ассоциаций.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f-f2.jpg\" alt=\"Рисунок 2: Распределение непрерывных и категориальных факторов риска сердечно-сосудистых заболеваний по возрастным и пол\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: Распределение непрерывных и категориальных факторов риска сердечно-сосудистых заболеваний по возрастным и полу группам. Непрерывные переменные показаны в виде графиков плотности для отображения их распределения, а категориальные переменные представлены в виде столбчатых диаграмм с частотой в каждой категории.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f-f3.jpg\" alt=\"Рисунок 3: Структура пропущенных данных и сравнение эффективности прогнозирования до и после контролируемой импутации в \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3: Структура пропущенных данных и сравнение эффективности прогнозирования до и после контролируемой импутации в наборе данных о сердечных заболеваниях.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 3: Структура пропущенных данных и сравнение эффективности прогнозирования до и после контролируемой импутации в наборе данных о сердечных заболеваниях. На верхнем левом панели показана матрица пропусков, которая демонстрирует значительное количество пропущенных данных в нескольких переменных. На верхнем правом панели представлен процент пропущенных значений для переменных с наибольшей долей пропусков. На нижнем панели сравнивается эффективность классификации с помощью случайного леса до и после контролируемой импутации.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f-f6.jpg\" alt=\"Рисунок 6: Бутстрэп-распределения и 95% доверительные интервалы метрик производительности RF, стратифицированные по полу\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 6: Бутстрэп-распределения и 95% доверительные интервалы метрик производительности RF, стратифицированные по полу.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f-f7.jpg\" alt=\"Рисунок 7: Оценки машинного обучения гендерно-специфичного ассоциативного исследования влияния клинических признаков на \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 7: Оценки машинного обучения гендерно-специфичного ассоциативного исследования влияния клинических признаков на вероятность сердечных заболеваний.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 7: Оценки машинного обучения гендерно-специфичного ассоциативного исследования влияния клинических признаков на вероятность сердечных заболеваний. На панелях (a) и (b) показаны оценки LinearDML для подгрупп мужчин и женщин соответственно. На панелях (c) и (d) показаны оценки CausalForestDML для подгрупп мужчин и женщин соответственно. Точки представляют средние эффекты от воздействия, а горизонтальные полосы представляют 95% доверительные интервалы. Красные точки указывают на статистически значимые эффекты на уровне 5%, в то время как серые точки указывают на незначимые эффекты.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;высокая&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;смертность от&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;болезней&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сердца&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ансамбль&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;моделей&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;машинного&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;обучения&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;точность&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;прогноза ROC-&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;AUC выше 0.90&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;развитие&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;точной и&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;надежной&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;кардиологии&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не прошёл рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия препринта&lt;/strong&gt;&lt;/th&gt;\
