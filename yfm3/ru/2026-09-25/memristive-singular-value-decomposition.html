            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"238\" cy=\"139\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"502\" cy=\"254\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как заставить компьютерные&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;чипы запоминать и считать&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;одновременно&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/memristive-singular-value-decomposition-f1.jpg\" alt=\"Рис. 1 / Низкоранговое представление с использованием MSVD для универсального анализа данных. MSVD, то есть X = USVT, пр\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1 / Низкоранговое представление с использованием MSVD для универсального анализа данных. MSVD, то есть X = USVT, преобразует массивные и зашумленные исходные данные (X) в сжатую информацию (eX), которая является лаконичной и понятной. U и V представляют собой матрицы, содержащие левые и правые сингулярные векторы соответственно, в то время как S представляет собой диагональную матрицу сингулярных чисел.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Современные компьютеры тратят много энергии на постоянное перемещение данных между процессором и памятью. Инженеры предложили принципиально иной подход на основе мемристоров — радиоэлектронных компонентов, способных одновременно хранить и обрабатывать информацию. Это позволяет выполнять сложные математические операции быстрее и с минимальными затратами энергии.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Мемристорные чипы объединяют хранение данных и вычисления на одном устройстве.&lt;/li&gt;\n&lt;li&gt;Новая архитектура &lt;a href=\"concepts/sparse-reconstruction-error-alleviation.html\"&gt;SREA&lt;/a&gt; компенсирует погрешности и накапливаемые ошибки при расчетах.&lt;/li&gt;\n&lt;li&gt;Энергоэффективность и скорость работы вырастают в десятки раз по сравнению с классическими ПК.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;В основе разработки лежит метод сингулярного разложения (&lt;a href=\"concepts/svd.html\"&gt;SVD&lt;/a&gt;) — универсальный математический инструмент для анализа больших массивов данных, который применяется от обработки изображений до обучения языковых моделей. Традиционные процессоры фон Неймана сталкиваются с тем, что итеративные вычисления SVD требуют постоянного пересылания гигантских объемов информации, что упирается в физические ограничения кремния.&lt;/p&gt;\n&lt;p&gt;Чтобы обойти это препятствие, исследователи создали архитектуру с улучшенным избирательным представлением (SREA), которая объединяет чипы памяти на мемристорах с аппаратными корректировками. Двухточечное маッピング снижает накопление численных погрешностей, а уточнение векторной обработки минимизирует остаточные ошибки при выделении значимых компонентов матриц. В результате система демонстрирует высокую точность в задачах компьютерного зрения, реконструкции эпидемиологических данных и инициализации больших языковых моделей.&lt;/p&gt;\n&lt;p&gt;Тестирование показало, что такая гибридная система превосходит стандартное кремниевое железо по энергоэффективности почти в тридцать раз, а по скорости — почти в двадцать раз. При этом преимущества становятся еще заметнее при обновлении данных в реальном времени, что открывает путь к созданию автономных устройств с искусственным интеллектом на борту.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод продемонстрирован на гибридных симуляциях и макетах мемристорных чипов, требующих дальнейшего масштабирования для массового производства.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Традиционные вычислительные системы с архитектурой фон Неймана, где память и процессор физически разделены, сталкиваются с серьезными трудностями при выполнении итеративных алгоритмов. В частности, сингулярное разложение матриц (SVD), активно применяемое в научных вычислениях, обработке сигналов и машинном обучении, требует больших затрат энергии на постоянную пересылку данных между блоками хранения и вычислений. Это создает существенные препятствия для эффективной обработки сложных информационных потоков.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Описанный подход протестирован на аппаратных и программных симуляторах мемристивных чипов, однако масштабирование таких систем до уровня коммерческих суперкомпьютеров требует решения задач физической интеграции и снижения аппаратного шума.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для преодоления этих ограничений авторы разработали мемристивное сингулярное разложение (MSVD), реализованное на чипах с вычислением в памяти (compute-in-memory, CIM) на основе мемристоров. Высокая точность вычислений при многократных итерациях достигается благодаря специальной архитектуре с избирательным представлением данных (selective representation enhanced architecture, SREA). Работоспособность и эффективность MSVD были успешно продемонстрированы на трех сценариях возрастающей сложности. Первый сценарий включает низкоранговое приближение для улучшения изображений и восстановления эпидемиологических данных. Второй — масштабируемое пользователем распознавание, где инкрементный алгоритм MSVD использует постоянное хранение данных в памяти, позволяя добавлять новых пользователей без необходимости переназначать уже существующую информацию. Третий сценарий охватывает разложение весов больших языковых моделей (&lt;a href=\"concepts/llm.html\"&gt;large language models&lt;/a&gt;), где инициализация на основе MSVD стабильно превосходит стандартный метод дообучения (fine-tuning) на математических бенчмарках.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/vychislenie-v-pamyati.html\"&gt;Вычисление в памяти&lt;/a&gt; (compute-in-memory, CIM) — это передовой подход, при котором обработка данных происходит непосредственно внутри ячеек памяти, что устраняет узкое место фон Неймана, связанное с передачей данных между процессором и оперативной памятью.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Помимо достижения точности, сопоставимой с традиционным программным обеспечением, архитектура SREA существенно снижает энергетические затраты и ускоряет сходимость итераций по сравнению с MSVD без такой оптимизации. В целом, разработанная система превосходит классическое аппаратное обеспечение на порядки величины как по энергоэффективности, так и по скорости во всех протестированных сценариях, причем эти преимущества возрастают с каждым новым циклом обновления в режиме инкрементных вычислений.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мемристивное сингулярное разложение (MSVD) на базе чипов CIM и архитектуры SREA превосходит традиционное железо на порядки по скорости и энергоэффективности во всех сценариях, включая обработку изображений, масштабируемое распознавание и инициализацию весов языковых моделей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Представленная работа существенно ускоряет выполнение операций сингулярного разложения в самых разных прикладных сценариях и расширяет возможности использования систем на основе мемристоров за пределами узкоспециализированных задач, приближая их к сфере универсальных вычислений.&lt;/p&gt;\n&lt;p&gt;Низкоразмерные представления играют ключевую роль в анализе данных, позволяя извлекать важные паттерны и снижать вычислительную сложность в самых разных областях — от наук о жизни до информационной инженерии. Сингулярное разложение (SVD) выступает математически оптимальным методом для таких задач, обеспечивая минимальные потери информации. В последние годы методы SVD активно применяются в биомедицинской обработке данных и адаптации больших языковых моделей (LLM). Однако классический подход SVD опирается на итерационно-дефляционные алгоритмы, требующие интенсивного умножения векторов и матриц. При реализации на традиционных CMOS-архитектурах фон Неймана это приводит к колоссальному энергопотреблению и задержкам из-за постоянного перемещения данных. Поскольку закон Мура приближается к физическим пределам, преодоление этих аппаратных ограничений становится критически важной задачей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сингулярное разложение (SVD) и мемристоры&lt;br /&gt;\nSVD — это метод линейной алгебры, раскладывающий матрицу на составляющие для сжатия данных и поиска скрытых закономерностей. Мемристоры (compute-in-memory, CIM) объединяют хранение и вычисления прямо в ячейке памяти, используя законы Ома и Кирхгофа, что радикально ускоряет процесс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В качестве многообещающей альтернативы рассматриваются &lt;a href=\"concepts/memristornye-vychisleniya-v-pamyati-cim.html\"&gt;мемристорные вычисления в памяти (CIM&lt;/a&gt;), которые уже доказали свою эффективность в решении линейных и дифференциальных уравнений, а также в глубоком обучении. Тем не менее, перенос SVD на мемристорную базу сопряжен с двумя фундаментальными трудностями из-за уникального дуального итерационного процесса и многомасштабного вывода (Рис. SN). Во-первых, на этапе итераций возникает численный дрейф из-за флуктуаций проводимости мемристоров и накопления погрешностей. Во-вторых, на этапе дефляции при удалении влияния уже найденных сингулярных значений появляются остаточные компоненты из-за погрешностей маппинга векторов в памяти.&lt;/p&gt;\n&lt;p&gt;Для устранения разрыва между алгоритмом SVD и CIM-железом авторы разработали специальную архитектуру, усиленную селективным представлением (SREA). Данная система включает две ключевые технологии: дуальное прецизионное маппинг-картирование (DPM) для подавления численного дрейфа и уточнение обработки векторов (VPR) для минимизации дефляционных остатков. Универсальность и масштабируемость предложенного подхода (MSVD с SREA) были проверены на различных типах данных и матриц.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффективность и точность MSVD&lt;br /&gt;\nПодход MSVD с SREA достиг пикового отношения сигнала к шуму 31.0 дБ и индекса сходства структур SSIM 0.940 в задачах улучшения изображений, а также корреляции 0.999 при реконструкции данных о госпитализациях в период пандемии COVID-19.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В задачах периферийного обучения (edge learning) инкрементальный метод MSVD продемонстрировал высокую робастность при распознавании жестов и определении стадий сна по биомедицинским сигналам, превзойти неинкрементальные подходы на 19.29% и 11.07% по точности соответственно. Кроме того, инициализация большой языковой модели LLaMA3.2-3B с помощью MSVD позволила улучшить стандартную тонкую настройку на 4.85 пункта (относительное улучшение 10.45%) на датасете GSM8K и на 0.68 пункта (6.27%) на датасете MATH.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оценка производительности&lt;br /&gt;\nВсе тесты выполнены на аппаратных симуляторах и моделях; реальная физическая стабильность мемристоров при длительном масштабировании требует дальнейшего мониторинга.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бенчмаркинг показал, что оптимизированный процесс сходимости SREA снижает энергопотребление на 48.5% и увеличивает скорость на 48.1% по сравнению с MSVD без SREA. В сравнении с традиционным CMOS-железом, MSVD обеспечивает в 29.9 раза большую энергоэффективность и в 19.0 раз большую нормализованную скорость, а инкрементальный метод достигает 67.1-кратного превосходства по энергии и 39.7-кратного по скорости. Для инициализации модели LLaMA3.2-3B выигрыш составил 41.6 раза по энергии и 23.1 раза по скорости.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;p&gt;...&lt;/p&gt;\n&lt;h4 id=\"harakteristika-shodimosti\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#harakteristika-shodimosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Характеристика сходимости&lt;/span&gt;&lt;/a&gt;Характеристика сходимости&lt;/h4&gt;\n&lt;p&gt;Для проверки эффективности алгоритма SREA авторы провели тесты на стандартном датасете IRIS, представляющем собой матрицу размером 150 × 4. Метод SREA был настроен со следующими параметрами для аппаратной реализации: нарезка бит [2, 5] для отображения с двойной точностью (DPM); 6 дополнительных битов ввода при стандартной для системы 8-битной точности входа; а также 4-кратное повторение векторов для уточнения весовой обработки (VPR). На Рис. 3a представлены сингулярные значения, рассчитанные с помощью матричного сингулярного разложения (MSVD) с применением SREA и без него (по результатам усреднения 20 независимых экспериментов). Первое сингулярное значение сходится быстро, тогда как последующие значения демонстрируют более медленную сходимость из-за накопления остаточных погрешностей. Применение MSVD совместно с SREA приводит к значительно меньшему уровню ошибок, что свидетельствует о более быстрых и точных итерациях.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/memristive-singular-value-decomposition-f3.jpg\" alt=\"Рис. 3 / Характеристика сходимости MSVD с SREA и без него. a Сходимость сингулярных чисел по итерациям по сравнению с MS\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 3 / Характеристика сходимости MSVD с SREA и без него. a Сходимость сингулярных чисел по итерациям по сравнению с MSVD без SREA и эталонными данными (GT).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 3 / Характеристика сходимости MSVD с SREA и без него. a Сходимость сингулярных чисел по итерациям по сравнению с MSVD без SREA и эталонными данными (GT). Плашки погрешностей указывают стандартные ошибки по 20 запускам. b Сравнение нормированной ошибки сингулярных чисел S1-S4 между MSVD с SREA и без него. c Распределения ошибок элементов сингулярных векторов для обоих подходов. d, e Итеративные обновления первых трех правых (d) и левых (e) сингулярных векторов, показывающие прогресс сходимости. f Ландшафты ошибок реконструкции для различных подходов оптимизации в разложениях 2-го и 3-го рангов. Ошибка реконструкции количественно оценивается как норма Фробениуса разницы между реконструкциями MSVD и эталонными данными. DPM — отображение двойной точности, VPR — уточнение векторной обработки.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;SREA (Sparse Reconstruction Error Alleviation) — это подход для минимизации ошибок вычислений в аппаратных системах, а DPM и VPR — его ключевые модули, управляющие разрядностью и избыточностью векторов.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;На Рис. 3b приведено сравнение нормированных ошибок сингулярных значений, вычисленных с SREA и без него: алгоритм с SREA демонстрирует улучшение средней точности вплоть до 13× по сравнению со стандартным MSVD. На Рис. 3c показано распределение числовых погрешностей для восстановленных сингулярных векторов (&lt;a href=\"concepts/rsv.html\"&gt;RSV&lt;/a&gt;). Векторы, рассчитанные с использованием SREA, обладают стандартным отклонением ошибки σ = 0.192, что вдвое меньше аналогичного показателя без SREA (σ = 0.415), подтверждая рост точности. На Рис. 3d, e проиллюстрирована динамика изменения первых трех правых (RSV) и левых (LSV) сингулярных векторов, которые демонстрируют быструю и точную сходимость за минимальное число итераций. Для оценки вклада каждого отдельного компонента SREA был выполнен абляционный анализ (Рис. SN 6). Выяснилось, что отображение с двойной точностью снижает ошибки сингулярных значений до 8.0×, в то время как уточнение векторной обработки дает уменьшение погрешности до 3.4×.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Синергия модулей SREA улучшает среднюю точность вычислений сингулярных значений до 13× и снижает стандартное отклонение ошибки RSV вдвое (σ = 0.192 против σ = 0.415).&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для понимания механизмов работы SREA авторы выполнили проецирование полученных решений в двумерное пространстве параметров с помощью метода главных компонент и построили ландшафты ошибок реконструкции для разных рангов (Рис. 3f; детальные траектории и индивидуальные ландшафты приведены на Рис. SN 7 и в Примечании 1). Анализ ландшафтов показывает, что DPM формирует более крутые склоны для отдельных итераций, но испытывает трудности с построением прямых путей сходимости для старших рангов (3-го и 4-го) из-за влияния остатков дефляции. В свою очередь, VPR обеспечивает более качественную дефляцию, однако системы только с этим модулем склонны к чисдленному дрейфу на плоских ландшафтах, что ведет к неэффективным итерациям в старших рангах. Лишь совместное действие обоих компонентов формирует оптимальные траектории оптимизации, доказывая их критическую важность для точности MSVD и применимости в CIM-архитектурах.&lt;/p&gt;\n&lt;h4 id=\"priblizhenie-nizkogo-ranga\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#priblizhenie-nizkogo-ranga\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Приближение низкого ранга&lt;/span&gt;&lt;/a&gt;Приближение низкого ранга&lt;/h4&gt;\n&lt;p&gt;Приближение низкого ранга критически важно для обработки изображений и временных рядов, обеспечивая высокую эффективность сжатия и извлечения признаков. Авторы продемонстрировали работу MSVD с SREA (подробные конфигурации приведены в Таблице SN 3) на примере улучшения качества изображения логотипа HKU размером 256 × 256 пикселей (Рис. 4a). Изображение было разбито на блоки 16 × 16 и обработано методом MSVD с сохранением верхних 25% рангов (по 4 ранга на блок). Дополнительное усиление достигалось масштабированием найденных ведущих сингулярных значений. Качество восстановления оценивалось с помощью пикового отношения сигнала к шуму (PSNR) и индекса структурного сходства (SSIM). По сравнению с программной реализацией SVD, MSVD с SREA обеспечивает максимальный PSNR на уровне 31.0 дБ и максимальный SSIM 0.940, превосходя MSVD без SREA на величину до 4.8 дБ по PSNR и на 0.114 по SSIM (Рис. 4b, c).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/memristive-singular-value-decomposition-f4.jpg\" alt=\"Рис. 4 / Низкоранговое приближение с использованием MSVD для изображений и темпоральных данных. a Улучшения изображений \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 4 / Низкоранговое приближение с использованием MSVD для изображений и темпоральных данных. a Улучшения изображений для логотипа HKU, выполненные программными средствами SVD и MSVD с SREA и без него. c обозначает коэффициент масштабирования.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 4 / Низкоранговое приближение с использованием MSVD для изображений и темпоральных данных. a Улучшения изображений для логотипа HKU, выполненные программными средствами SVD и MSVD с SREA и без него. c обозначает коэффициент масштабирования. b, c Сравнения PSNR (b) и SSIM (c) для изображений, реконструированных с помощью MSVD с SREA и без него, с использованием программных результатов в качестве эталона. d, e Реконструкции 1-го (d) и 2-го (e) рангов набора данных COVID-1952 с использованием MSVD с SREA. Врезки показывают распределения соответствующих нормированных ошибок реконструкции. f Сравнение коэффициентов корреляции между MSVD с SREA и MSVD без него для матриц набора данных52, реконструированных в 1-м, 2-м и 3-м рангах, с использованием решений программного SVD в качестве эталона. Данные представлены как среднее ± стандартная ошибка (n = 20 независимых запусков).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;PSNR и SSIM — стандартные метрики оценки качества восстановления изображений: чем выше оба показателя, тем ближе синтезированная картинка к оригиналу.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;По сравнению с методами реконструкции на основе нейронных сетей и сжатого восприятия (Рис. SN 8, 9), подход на базе MSVD предлагает дружественную к аппаратному обеспечению (edge-friendly) эффективность, избавляя от необходимости оперировать крупномасштабными параметрами, проводить долгое обучение или использовать сложные алгоритмы сжатого восприятия. Для задач, требующих еще большей точности, производительность может быть повышена за счет более точной настройки DPM и увеличения избыточности VPR. Универсальность MSVD для временных рядов была подтверждена на данных о еженедельных госпитализациях с COVID-19 в 51 штате США (матрица 104 × 51). Разложение с использованием первого и второго сингулярных векторов наглядно отражает пандемические тренды в разных регионах (Рис. 4d, e).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;MSVD с SREA достигает максимального PSNR 31.0 дБ и SSIM 0.940 для изображений, а для временных рядов COVID-19 демонстрирует коэффициенты корреляции 0.999 для первых двух рангов.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Применение MSVD с SREA обеспечивает высокую точность реконструкции со средними нормированными ошибками µ = -4.89 × 10⁻⁵ для первой компоненты и µ = 6.72 × 10⁻³ для второй. Анализ коэффициентов корреляции между восстановленными матрицами i-го ранга и эталонными программными данными показывает, достигают значений 0.999 для первых двух рангов и 0.995 для третьего ранга, что существенно превосходит результаты MSVD без SREA на старших рангах (Рис. 4f). Этот успех обусловлен способностью SREA подавлять численный дрейф и остатки компонентов, возникающие в процедуре итеративной дефляции. Полученные результаты подтверждают, что аппаратный комплекс MSVD с SREA не уступает программным аналогам и открывает путь к эффективному вычислению низкоранговых приближений в реальных задачах обработки данных.&lt;/p&gt;\n&lt;h4 id=\"inkrementalnoe-razlozhenie-matric-dlya-masshtabiruemyh-sistem\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#inkrementalnoe-razlozhenie-matric-dlya-masshtabiruemyh-sistem\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Инкрементальное разложение матриц для масштабируемых систем&lt;/span&gt;&lt;/a&gt;Инкрементальное разложение матриц для масштабируемых систем&lt;/h4&gt;\n&lt;p&gt;Инкрементальный SVD широко применяется в биомедицинской обработке сигналов для эффективного извлечения признаков, сокращения их размерности и снижения вычислительной нагрузки, что позволяет интегрировать его в носимые медицинские устройства для анализа электромиограмм (ЭМГ) и электроэнцефалограмм (&lt;a href=\"concepts/multichannel-electroencephalography.html\"&gt;ЭЭГ&lt;/a&gt;). Поскольку физиологические сигналы существенно различаются у разных людей, а одна и та же активность порождает уникальные паттерны у каждого пользователя, применение классификаторов, обученных на существующих пользователях, к новым людям затруднено. Для решения этой задачи авторы предлагают инкрементальный MSVD-фреймворк для масштабируемого распознавания пользователей (Рис. 5a). Этот подход использует предварительно вычисленные сингулярные компоненты (RSV) для эффективного подключения новых пользователей без пересчета всей системы с нуля (Рис. 5b). Мемристорный массив выполняет вычисления только с данными новых пользователей и существующими RSV, что значительно снижает вычислительные затраты.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/memristive-singular-value-decomposition-f5.jpg\" alt=\"Рис. 5 / Масштабируемое пользователем распознавание с использованием инкрементального MSVD. a Схема инкрементального рас\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 5 / Масштабируемое пользователем распознавание с использованием инкрементального MSVD. a Схема инкрементального распознавания. b Инкрементальный MSVD для обновления сингулярных векторов. c Рабочий процесс мемристорной системы распознавания жестов. d…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 5 / Масштабируемое пользователем распознавание с использованием инкрементального MSVD. a Схема инкрементального распознавания. b Инкрементальный MSVD для обновления сингулярных векторов. c Рабочий процесс мемристорной системы распознавания жестов. d Сравнение точности классификации между мемристорным и программным подходами для двух пользователей. Данные представлены как среднее ± стандартная ошибка (n = 15). e Эволюция точности распознавания по мере увеличения числа пользователей. Коробочные диаграммы показывают медианы, нижний и верхний квартили, а также диапазоны без выбросов; мелкие точки указывают выбросы, а крупные символы обозначают средние значения по 15 повторениям. f Рабочий процесс мемристорного детектирования стадий сна. g Эволюция точности детектирования по мере увеличения числа субъектов с 15 до 75. Плашки погрешностей указывают стандартную ошибку по 5 независимым симуляциям. Значки поз рук, используемые в (c), были получены из Uicons от Flaticon.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Инкрементальный SVD и RSV — это математические методы обновления матричных разложений «на лету» при добавлении новых данных, а мемристоры — аппаратные элементы, позволяющие выполнять матричные вычисления прямо в памяти.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Фреймворк был валидирован на задаче распознавания жестов по ЭМГ (Рис. 5c) с использованием датасета NinaPro, содержащего 10-канальные сигналы ЭМГ для 4 жестов, с постепенным увеличением числа пользователей с 2 до 8. На каждом шаге матрица сигналов новых пользователей размером 864 × 500 интегрировалась для обновления экстракторов признаков размером 500 × 6 с помощью инкрементального MSVD с конфигурациями SREA. Для 2 пользователей точность, усредненная по 15 повторениям, составила 88.26% (по сравнению с 89.58% в программной реализации) (Рис. 5d). При росте числа пользователей (Рис. 5e) прямое применение RSV от 2 пользователей к данным 8 пользователей приводит к падению точности, тогда как инкрементальный MSVD достигает средней точности 84.01% против 64.72% без обновлений, обеспечивая восстановление производительности на 19.29% (Рис. SN). Матрица ошибок (Рис. SN) подтверждает надежность распознавания, а анализ RSV (Рис. SN) показывает, что первый вектор минимально меняется при добавлении пользователей, фиксируя общие черты сигналов, а последующие адаптируются под индивидуальные особенности.&lt;/p&gt;\n&lt;p&gt;Масштабируемость была дополнительно исследована на задачах детекции стадий сна по ЭЭГ на крупной когорте из 75 испытуемых с использованием аппаратно-калибровочной симуляции (Рис. 5g) и датасета Sleep-EDFx, содержащего ЭЭГ в состоянии бодрствования, REM-сна и глубокого сна (non-REM стадия 3). Сигналы после краткосрочного преобразования Фурье подавались на мемристорную систему для извлечения признаков через MSVD/инкрементальный MSVD с последующей логистической регрессией. Матрицы данных до и после обновления имели размерность 900 × 500 (по 15 испытуемых в каждой), а получаемые RSV — 500 × 5 (при 15 итерациях на вектор). После четырех этапов обновления метод на базе инкрементального MSVD показал улучшение точности на 11.07% по сравнению с необновляемой базовой линией, продемонстрировав результаты, сопоставимые с программными.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Инкрементальный MSVD позволяет масштабировать системы распознавания сигналов ЭМГ и ЭЭГ на новых пользователей, восстанавливая точность до 84.01% для ЭМГ и повышая ее на 11.07% для ЭЭГ без роста аппаратных затрат.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"analiz-proizvoditelnosti-i-benchmarking\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#analiz-proizvoditelnosti-i-benchmarking\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ производительности и бенчмаркинг&lt;/span&gt;&lt;/a&gt;Анализ производительности и бенчмаркинг&lt;/h4&gt;\n&lt;p&gt;Для комплексной оценки вычислительных преимуществ авторы провели систематический анализ производительности на датасетах IRIS, COVID-19 и NinaPro. На скорость сходимости на каждом ранге влияет зазор сингулярных значений между целевым и последующим значениями. Рис. 6a демонстрирует связь между итерациями сходимости и логарифмом нормализованных зазоров сингулярных значений в диапазоне от 10⁰ до 10⁻³ при критерии относительной разницы временных оценок квадратов сингулярных значений менее 2% между итерациями. Результаты подтверждают линейный тренд и показывают, что MSVD с SREA стабильно требует меньше итераций для сходимости по сравнению с MSVD без SREA во всех масштабах задач, доказывая превосходство SREA в ускорении вычислений.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/memristive-singular-value-decomposition-f6.jpg\" alt=\"Рис. 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 6&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оценка производительности основана на симуляциях и аппаратных калибровках для конкретных датасетов, поэтому прямая экстраполяция результатов на любые другие биомедицинские задачи требует дополнительной валидации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"proizvoditelnost-i-masshtabiruemost-msvd-v-obrabotke-dannyh-i-doobuchenii-yazykovyh-modelej\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#proizvoditelnost-i-masshtabiruemost-msvd-v-obrabotke-dannyh-i-doobuchenii-yazykovyh-modelej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Производительность и масштабируемость MSVD в обработке данных и дообучении языковых моделей&lt;/span&gt;&lt;/a&gt;Производительность и масштабируемость MSVD в обработке данных и дообучении языковых моделей&lt;/h4&gt;\n&lt;p&gt;Теоретический анализ пределов разрешения MSVD с использованием закона Ведина представлен на Рис. 14. Обсуждение показывает, что нормализованный спектральный зазор конкретной задачи, определяемый как (σ_i - σi+1) / σ₁, вместе с системными ошибками определяет минимальное разрешимое сингулярное значение. Для одиночного вычисления SVD метод MSVD с SREA демонстрирует значительные преимущества: по сравнению с MSVD без SREA алгоритм SREA обеспечивает экономию энергии на 48.5% и ускорение на 48.1% благодаря ускорению сходимости. В сравнении с традиционными графическими процессорами (GPU) показатели еще выше: достигается рост энергоэффективности в 29.9× и ускорение в 19.0× в задачах распознавания электромиограммы (EMG) (Рис. 6b, c). Детализация энергопотребления и занимаемой площади для реализации MSVD показана на Рис. 6d, e, где отражен вклад аналого-цифровых преобразователей, мемристорных матриц, драйверов и других схем.&lt;/p&gt;\n&lt;p&gt;В сценариях инкрементального обучения преимущества в производительности становятся еще более заметными. Для масштабируемого пользователями распознавания EMG, включающего последовательное обновление данных от 2 до 8 пользователей, инкрементальный MSVD демонстрирует в среднем снижение энергозатрат в 67.1× и ускорение в 39.7× по сравнению с традиционными подходами на базе GPU (Рис. 6f, g). По мере роста числа обновлений эти преимущества увеличиваются, достигая до 89.6% экономии энергии и 57.3× ускорения в третьем цикле обновления. Даже в инкрементальных сценариях MSVD с SREA сохраняет преимущество в виде экономии энергии на 42.4% и ускорения на 45.3% по сравнению с MSVD без SREA (Рис. 15). Эти результаты подтверждают высокую эффективность предложенного подхода как для обработки низкоранговой информации, так и для работы с инкрементальными данными в носимых медицинских приложениях.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MSVD с SREA превосходит GPU до 29.9× по энергоэффективности и до 19.0× по скорости, а в инкрементальных задачах для 8 пользователей экономия энергии достигает 89.6× при ускорении в 57.3×.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SREA — метод ускорения сходимости вычислений, а инкрементальное обучение позволяет системе адаптироваться к поступающим новым данным без переобучения всей модели с нуля.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для оценки масштабируемости MSVD и SREA в крупномасштабных приложениях была изучена их производительность при параметрически эффективном дообучении больших языковых моделей (LLM) путем симуляции. Низкоранговая адаптация позволяет снизить затраты на обучение за счет заморозки основных весов и внедрения малых обучаемых матриц. Инициализация таких матриц через SVD явно извлекает главные компоненты предобученных весов, ускоряя сходимость. Здесь авторы применили адаптацию на основе главных сингулярных значений и векторов (PiSSA), инициализируемую с помощью MSVD (Рис. 7a, b). Все статические веса в модели с размерностями вроде 2048 × 2048 и 2048 × 512 (Таблица 5) прошли ранговую декомпозицию до ранга 4. Полученные матрицы U, S и V использовались для построения ветвей дообучения.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/memristive-singular-value-decomposition-f7.jpg\" alt=\"Рис. 7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 7&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Модели LLaMA 3.2 (версии 1B и 3B) дообучались с помощью MSVD-based PiSSA с SREA (Конфигурации в Таблице 3) на датасете MetaMathQA в течение двух и одного эпох соответственно, после чего оценивались на наборах данных GSM8K и MATH. Кривые потерь и нормы градиентов (Рис. 16) показывают, что данный подход эффективно ускоряет процесс дообучения по сравнению с базовым методом адаптации, сохраняя динамику оптимизации, близкую к программному аналогу PiSSA. В задачах решения математических задач на бенчмарках GSM8K (Рис. 7c) и MATH (Рис. 7d) MSVD-based PiSSA достигает результатов, сопоставимых с программным аналогом (например, 26.41 против 26.61 и 51.25 против 51.40 для GSM8K на моделях 1B и 3B соответственно). Более того, он стабильно превосходит стандартный метод, поднимая показатель на GSM8K с 24.11 до 26.41 (относительный прирост 9.5%) для модели 1B и с 46.40 до 51.25 (относительный прирост 10.5%) для модели 3B. Абеляционное исследование SREA на LLaMA 3.2-1B (Рис. 17) показало улучшение на 1.09 балла (прирост 4.3%) на GSM8K и на 0.42 балла (прирост 8.3%) на MATH.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оценка производительности дообучения LLM получена с помощью аппаратной симуляции, а не на реальном кремниевом чипе полномасштабного языкового ускорителя.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;На Рис. 7e, f показаны энергоэффективность и нормализованная скорость инициализации на основе MSVD по сравнению с GPU. На технологическом узле 32 нм мемристорная система достигает преимущества в энергоэффективности в 41.6× и ускорения в 23.1× относительно GPU (системные детали на Рис. 18). Эти результаты подтверждают масштабируемость MSVD для крупных рабочих нагрузок и его применимость в практических задачах LLM.&lt;/p&gt;\n&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;h4 id=\"obshie-vyvody-i-perspektivy\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#obshie-vyvody-i-perspektivy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общие выводы и перспективы&lt;/span&gt;&lt;/a&gt;Общие выводы и перспективы&lt;/h4&gt;\n&lt;p&gt;В настоящей работе представлена энергоэффективная и высокоточная система многомасштабного сингулярного разложения матриц (MSVD) для низкоранговых представлений. Благодаря тщательно спроектированной архитектуре SREA, включающей отображение с двойной точностью и уточнение векторной обработки, авторам удалось эффективно оптимизировать процесс многомасштабных итеративных вычислений на мемристорах.&lt;/p&gt;\n&lt;p&gt;Экспериментальные демонстрации, охватывающие реконструкцию изображений, анализ временных рядов, обработку биомедицинских сигналов и эффективную донастройку больших языковых моделей (LLM), показывают, что предложенный подход достигает точности, сопоставимой с программными аналогами. Инкрементальная структура MSVD дополнительно подчеркивает мощные возможности обработки данных в сценариях адаптивных вычислений.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Разработанная система MSVD на мемристорах обеспечивает точность уровня программных решений при существенном превосходстве над традиционными CMOS-архитектурами в скорости и энергоэффективности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;По сравнению с традиционными реализациями на базе КМОП (CMOS), предложенная система демонстрирует значительные преимущества как в энергоэффективности, так и в скорости вычислений. Полученные результаты убедительно доказывают потенциал MSVD как универсального инструмента разложения матриц, что особенно важно для систем с ограниченными ресурсами, включая носимые медицинские устройства и периферийные системы искусственного интеллекта.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мемристорные вычисления в памяти (CIM — Computing-in-Memory) — это передовая архитектура, объединяющая хранение и обработку данных в одном физическом устройстве, что позволяет радикально снизить затраты энергии на пересылку данных между процессором и памятью.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Данное исследование открывает жизнеспособный путь для реализации многомасштабных итеративных алгоритмов на базе мемристорных вычислений в памяти (CIM), тем самым расширяя горизонты применения мемристорных технологий в широком спектре задач научных вычислений и машинного обучения.&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;p&gt;Реализация мемристорного сингулярного разложения&lt;/p&gt;\n&lt;p&gt;Сингулярное разложение (SVD) матрицы данных &lt;span class=\"yfm-latex\" data-content=\"X%20%5Cin%20%5Cmathbb%7BR%7D%5E%7BM%20%20imes%20N%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; математически определяется как X = USV^T, где &lt;span class=\"yfm-latex\" data-content=\"U%20%5Cin%20%5Cmathbb%7BR%7D%5E%7BM%20%20imes%20M%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"V%20%5Cin%20%5Cmathbb%7BR%7D%5E%7BN%20%20imes%20N%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и &lt;span class=\"yfm-latex\" data-content=\"S%20%5Cin%20%5Cmathbb%7BR%7D%5E%7BM%20%20imes%20N%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — матрицы левых сингулярных векторов (LSV), правых сингулярных векторов (RSV) и самих сингулярных чисел соответственно. Соответственно, ковариационная матрица данных &lt;span class=\"yfm-latex\" data-content=\"X%5ET%20X%20%5Cin%20%5Cmathbb%7BR%7D%5E%7BN%20%20imes%20N%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; может быть выражена как X^T X = V S² V^T. Поскольку столбцы матрицы V (обозначаемые как v_i) образуют ортонормированный базис для &lt;span class=\"yfm-latex\" data-content=\"%5Cmathbb%7BR%7D%5EN\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, любой случайно инициализированный входной вектора vin можно представить в виде линейной комбинации этих базисных векторов: &lt;span class=\"yfm-latex\" data-content=\"v_%7Bin%7D%20%3D%20c_1%20v_1%20%2B%20%5Cdots%20%2B%20c_N%20v_N\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, где &lt;span class=\"yfm-latex\" data-content=\"c_1%20%0Aeq%200\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, а c_i — скалярные коэффициенты (1). Таким образом, итеративное умножение X^T X на vin k раз дает выражение (2), где s_i — это i-е диагональное значение в матрице S, причем &lt;span class=\"yfm-latex\" data-content=\"s_1%20%3E%20s_2%20%3E%20%5Cdots%20%3E%20s_N%20%3E%200\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. При &lt;span class=\"yfm-latex\" data-content=\"k%20%5Cgg%201\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; члены (s_i / s₁)²k для i ≥ 2 стремятся к нулю. Следовательно, первый вектор RSV может быть извлечен из формулы v₁ = norm(X^T X)^k vin. На практике v₁ получается с помощью цикла итераций. Начиная со случайно инициализированного промежуточного вектора  ildev₁, правило обновления выполняется согласно формуле (3), где norm() обозначает операцию нормализации, выполняемую на CPU. Процесс продолжается до сходимости или достижения лимита итераций. Найденный v₁ сохраняется в дополнительном массиве для построения матрицы V, а первое сингулярное число вычисляется как s₁² = v₁^T X^T X v₁.&lt;/p&gt;\n&lt;p&gt;Для извлечения последующих векторов и чисел компоненты, связанные с ранее вычисленными сингулярными векторами, должны быть дефлированы. Подход степенных итераций с дефляцией для i-го сингулярного вектора v_i выполняется в каждом цикле по формуле (4), где  ildev_i — случайно инициализированный промежуточный вектор, Si-1 — диагональная матрица, содержащая первые i-1 сингулярных чисел, масштабирующая вывод умножения Vi-1^T  ildev_i, а S₀ и V₀ определены как нулевые матрицы. Найденный v_i обновляется в V, а i-е сингулярное число получается из формулы (5). Основываясь на свойствах SVD, поскольку v_i взаимно ортогональны (т.е. V⁻¹ = V^T), соответствующие LSV могут быть напрямую получены как u_i = norm(X v_i) (6). Архитектура и сравнение производительности при адаптации с помощью симулированной инициализации MSVD для моделей LLaMA 3.2 показаны на Рис. 7.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сингулярное разложение (SVD) — это метод линейной алгебры, который разлагает матрицу на составляющие для снижения размерности данных и выделения главных признаков.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Через эти итеративные процессы степенная итерация с дефляцией для MSVD завершается. Блок-схема процесса MSVD проиллюстрирована на Рис. S19. Во время вычислений матрица данных X и вычисленные RSV (V) хранятся на мемристорных кроссбар-массивах для выполнения умножений. Вспомогательные операции, включая поэлементное умножение векторов (для масштабирования S² входов RSV), вычитание, нормализацию (для дефляции) и определение сходимости, реализуются на FPGA и CPU. В начале каждого этапа степенной итерации и дефляции итеративные процессы на обеих матрицах (X и V) начинаются с одного и того же случайно инициализированного входного вектора  ildev_i = vin, после чего итеративные умножения вектора на матрицу, описанные в уравнении (4), выполняются непосредственно на массивах. Чтобы предотвратить чрезмерное количество итераций, максимальное число итераций ограничено менее чем 30. LSV (U) получаются посредством умножения матрицы на вектор с матрицей данных, как выражено в уравнении (6), и поэтому не требуют дополнительного хранения на массиве.&lt;/p&gt;\n&lt;h4 id=\"dvuhtochechnoe-otobrazhenie\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#dvuhtochechnoe-otobrazhenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Двухточечное отображение&lt;/span&gt;&lt;/a&gt;Двухточечное отображение&lt;/h4&gt;\n&lt;p&gt;В стратегии отображения с двойной точностью каждое число, отображаемое на мемристоры, делится на старшую часть с низким разрешением и младшую часть с высоким разрешением. Например, 8-битные векторы X и Y могут быть разделены на старшие 2 бита и младшие 6 бит следующим образом: уравнения (7) и (8), где h и l представляют номера битов старшей и младшей частей соответственно. Умножение X и Y может быть выражено как формула (9), где &lt;span class=\"yfm-latex\" data-content=\"%5Cll%20l\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; обозначает сдвиг влево на l позиций для восстановления правильной величины старшего вклада. Этот подход гарантирует, что вывод старшей части остается точным после квантования, что минимизирует усиление ошибок старшего порядка по весу значимости и тем временем повышает стабильность сходимости в MSVD. Между тем, младшая часть с более высоким разрешением сохраняет способность выражать мелкие числовые детали во время вычислений, приближая результаты сходимости к фактическим значениям. Подробные настройки DPM в различных экспериментах показаны в Таблице S3. Исследования и анализ на основе симуляций, подробно описанные на Рис. S20, S21 и в Примечании 3, дополнительно демонстрируют валидность и эффективность DPM.&lt;/p&gt;\n&lt;h4 id=\"dorabotka-obrabotki-vektorov\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#dorabotka-obrabotki-vektorov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Доработка обработки векторов&lt;/span&gt;&lt;/a&gt;Доработка обработки векторов&lt;/h4&gt;\n&lt;p&gt;Для реализации стратегии VPR авторы настраивают точность входных данных и применяют пространственное дублирование специально для векторов остаточных сингулярных значений (RSV). На втором этапе цикла итераций степенного метода (уравнение 4) входные векторы для матрицы RSV кодируются с более высокой разрядностью в битах по сравнению со стандартной системной точностью (детали конфигурации приведены в Таблице S3). Поскольку эти входы, масштабированные с помощью s₂^i, имеют существенно больший динамический диапазон, стандартные ошибки квантования в противном случае усиливались бы в последующих умножениях и ухудшали конечную точность. Повышенная точность сохраняет выразительность представления и смягчает кумулятивные ошибки квантования (анализ представлен в Заметке S4 и на Рис. S22).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Векторы остаточных сингулярных значений (RSV) — это векторы, которые получаются после извлечения главных компонент на каждом шаге дефляции и требуют повышенной точности вычислений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Во-вторых, для физического подавления отклонений при отображении в мемристоры и флуктуаций считывания (эффекты которых на результат дефляции также усиливались бы масштабированными входами) матрицы RSV пространственно дублируются по всей мемристорной матрице, а их выходные сигналы усредняются для получения результатов с пониженным уровнем шума. Этот метод поддерживает повышенную разрядность только для основных входов и дублирует лишь сингулярные векторы малого размера при их отображении. Следовательно, подход гарантирует точность процесса дефляции при значительно меньших затратах энергии и площади по сравнению с глобальным высокоточным и дублированным отображением всех матриц.&lt;/p&gt;\n&lt;h4 id=\"kastomizirovannaya-apparatnaya-platforma-i-arhitektura-memristorov\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#kastomizirovannaya-apparatnaya-platforma-i-arhitektura-memristorov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кастомизированная аппаратная платформа и архитектура мемристоров&lt;/span&gt;&lt;/a&gt;Кастомизированная аппаратная платформа и архитектура мемристоров&lt;/h4&gt;\n&lt;p&gt;Авторы изготовили мемристорный чип с использованием технологического узла 130 нм. Чип содержит мемристорную матрицу формата 1024 × 128 на основе структуры «один транзистор — один резистор» (1T1R) и периферийные схемы на кремниевой КМОП-технологии. Каждая ячейка 1T1R включает мемристор размером 0.5  мкм × 0.5  мкм с материальным стеком TiN/TaOx/HfO₂/TiN и транзистор доступа. Слои включают резистивный переключающий слой HfO₂ толщиной 8 нм, осажденный методом атомно-слоевого осаждения, термический усилительный слой TaOx толщиной 45 нм, напыленный методом магнетронного распыления, и верхний/нижний электроды TiN толщиной 30 нм, что показано на изображении просвечивающей электронной микроскопии на Рис. S4a.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/struktura-1t1r-odin-tranzistor.html\"&gt;Структура 1T1R (один транзистор&lt;/a&gt; — один резистор) объединяет ячейку памяти на мемристоре с управляющим транзистором, что позволяет точно подавать напряжение и считывать данные без паразитных токов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Периферийные схемы, включая входные буферы, драйверы, сдвиговые регистры и декодеры, поддерживают операции чтения/записи и обеспечивают полностью параллельные вычисления, детали которых приведены на Рис. S3. Для обеспечения точного отображения проводимости к каждой мемристорной ячейке 1T1R применяются множественные импульсы напряжения с использованием стандартной схемы записи-проверки, поэтапно корректируя проводимость до тех пор, пока целевые значения не окажутся в пределах допустимой погрешности. Демонстрационная система использует кастомизированную конфигурацию из трех печатных плат, включающую мемристорную плату, плату питания и плату с программируемой пользователем вентильной матрицей (ППВМ/FPGA, Xilinx, ZCU102), как показано на Рис. S2a.&lt;/p&gt;\n&lt;p&gt;Система цифрово кодирует входные данные во временную последовательность 50-наносекундных 1-битных импульсов напряжения (0.2 В представляет «1» и 0 В представляет «0»), которые подаются на матрицу для выполнения векторно-матричного умножения. Авторы спроектировали специализированную архитектуру, обеспечивающую полный процесс MSVD за счет скоординированных операций между макросом мемристорных вычислений в памяти (CIM) для матричных умножений и контроллером FPGA для управления итерациями (детальный дизайн архитектуры и поток данных представлены на Рис. S2b).&lt;/p&gt;\n&lt;h4 id=\"otobrazhenie-dannyh-i-konfiguraciya-eksperimentov\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#otobrazhenie-dannyh-i-konfiguraciya-eksperimentov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Отображение данных и конфигурация экспериментов&lt;/span&gt;&lt;/a&gt;Отображение данных и конфигурация экспериментов&lt;/h4&gt;\n&lt;p&gt;Для программирования проводимости мемристорных устройств применяется схема записи-проверки, проиллюстрированная на Рис. S23. Линейно квантованные данные (Заметка S5) программируются путем подачи импульсов напряжения SET/RESET в диапазоне от 0.5 В до 2 В с последующим этапом проверки чтения при 0.2 В. Этот цикл записи-проверки повторяется до тех пор, пока ток чтения не опустится в целевой диапазон пороговых значений. На Рис. S24 детально описаны относительные конфигурации напряжений, подаваемых на линии слов (WL), истока (SL) и стока (BL) выбранной ячейки во время операций SET, RESET и чтения соответственно.&lt;/p&gt;\n&lt;p&gt;Для учета как положительных, так и отрицательных элементов матрицы применяется схема дифференциального отображения. Благодаря высокому выходу годных устройств (~ 99.99%) влияние необратимых отказов (залипших ячеек) на MSVD минимально, что подтверждено анализом на Рис. S25, и это исключает необходимость использования сложных стратегий отказоустойчивого отображения. На Рис. S26 проиллюстрировано, как матрица входных данных и вычисленные векторы RSV отображаются на единый макрос для реализации MSVD с помощью SREA. Матрица входных данных программируется на матрицу в начале вычислений, а решенные векторы RSV впоследствии записываются на матрицу по мере продвижения декомпозиции.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дифференциальное отображение использует пары ячеек памяти для представления положительных и отрицательных чисел, вычитая их токи, что позволяет работать со знаком без сложных схем.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Схема DPM разделяет матрицу данных и векторы RSV на два сегмента, в то время как стратегия VPR дублирует RSV на матрице несколько раз. Подробные конфигурации SREA для каждого эксперимента приведены в Таблице S3. Ограниченные масштабом испытательной платформы, для задач реконструкции изображений низкого ранга и распознавания жестов на основе электромиографии (EMG) авторы использовали стратегию репрограммирования для получения проводимостей полной матрицы устройств. Затем были проведены эксперименты путем симуляции крупномасштабных периферийных схем на основе этих измерений.&lt;/p&gt;\n&lt;p&gt;Кроме того, предлагается многомакросная архитектура (показанная на Рис. S27), которая служит ориентиром для крупномасштабных развертываний с использованием нескольких макросов. Для задач обнаружения стадий сна на основе электроэнцефалографии (EEG) и низкоранговой адаптации с инициализацией MSVD используется симуляционная среда с аппаратной калибровкой, включающая модель мемристора с учетом шумов и модели периферийных схем (включая квантование и операции сдвига-и-сложения) для эмуляции более крупной вычислительной системы на основе мемристоров. Во время этих экспериментов диапазон отображения проводимости устройств устанавливается от 0 до 30 мкСм. Вариации чтения и записи устройств моделируются как гауссовский шум на основе реальных измерений устройств (Рис. 2g) для обеспечения точности.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/memristive-singular-value-decomposition-f2.jpg\" alt=\"Рис. 2 / Дизайн MSVD с SREA. a Схема и поток данных MSVD для расчета сингулярных векторов (SV).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 2 / Дизайн MSVD с SREA. a Схема и поток данных MSVD для расчета сингулярных векторов (SV).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 2 / Дизайн MSVD с SREA. a Схема и поток данных MSVD для расчета сингулярных векторов (SV). RSV (v) и LSV (u) в конечном итоге формируют матрицы V и U соответственно. b, c Две основные проблемы для алгоритма итерации-дефляции на основе MSVD. Первая — это численный дрейф (b) на этапе итерации с флуктуациями проводимости. Вторая — остаток компонентов (c) на этапе дефляции с погрешностями отображения для SV. d Разработанный SREA для MSVD, который преобразует результаты вычислений из непрактичных в практичные с помощью отображения двойной точности (DPM) и уточнения векторной обработки (VPR). S1, S2: первое и второе сингулярные числа. e Фотография мемристорного чипа с массивом 1024 на 128 для реализации MSVD. f Средние эволюции проводимости 32 уровней за циклы чтения, показывающие хорошую стабильность проводимости. Каждый уровень включает данные от 100 мемристоров. График с подробными точками данных представлен на Дополнительном рис. 5. g Распределение измеренных погрешностей отображения и флуктуаций чтения мемристоров на (f). Уровни погрешностей/флуктуаций соответствовали σ = 0,27 мкСм при отображении и σ = 0,21 мкСм при чтении.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"metriki-nizkorangovogo-priblizheniya-dlya-izobrazhenij-i-vremennyh-dannyh\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#metriki-nizkorangovogo-priblizheniya-dlya-izobrazhenij-i-vremennyh-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Метрики низкорангового приближения для изображений и временных данных&lt;/span&gt;&lt;/a&gt;Метрики низкорангового приближения для изображений и временных данных&lt;/h4&gt;\n&lt;p&gt;Для оценки качества реконструированных изображений и данных с использованием главных компонент применяются широко признанные метрики: PSNR, SSIM и коэффициент корреляции. Для RGB-изображения I с размерами m × n × 3, где K представляет низкоранговое приближение I, пиковое отношение сигнала к шуму (PSNR) определяется следующим образом:&lt;/p&gt;\n&lt;p class=\"yfm-latex\" data-content=\"ext%7BPSNR%7D%20%3D%2010%20%5Clog_%7B10%7D%20%5Cleft(%20%5Cfrac%7B%20ext%7BMAX%7D_I%5E2%7D%7B%20ext%7BMSE%7D%7D%20%5Cright)%20%5Cquad%20(10)%0A\" data-options=\"%7B%22displayMode%22%3Atrue%7D\"&gt;&lt;/p&gt;&lt;p&gt;где MAX_I — максимальное значение пикселя изображения I, а MSE представляет среднеквадратичную ошибку, усредненную по всем каналам RGB:&lt;/p&gt;\n&lt;p class=\"yfm-latex\" data-content=\"ext%7BMSE%7D%20%3D%20%5Cfrac%7B1%7D%7B3mn%7D%20%5Csum_%7BR%2C%20G%2C%20B%7D%20%5Csum_%7Bi%3D1%7D%5E%7Bm%7D%20%5Csum_%7Bj%3D1%7D%5E%7Bn%7D%20%5Cleft(%20I_%7Bch%7D%5E%7Bi%2Cj%7D%20-%20K_%7Bch%7D%5E%7Bi%2Cj%7D%20%5Cright)%5E2%0A\" data-options=\"%7B%22displayMode%22%3Atrue%7D\"&gt;&lt;/p&gt;&lt;p&gt;где Ich и Kch обозначают конкретные каналы изображений I и K соответственно. Структурное сходство (SSIM) вычисляется следующим образом:&lt;/p&gt;\n&lt;h4 id=\"metriki-kachestva-i-inkrementalnoe-razlozhenie-dlya-raspoznavaniya-zhestov\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#metriki-kachestva-i-inkrementalnoe-razlozhenie-dlya-raspoznavaniya-zhestov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Метрики качества и инкрементальное разложение для распознавания жестов&lt;/span&gt;&lt;/a&gt;Метрики качества и инкрементальное разложение для распознавания жестов&lt;/h4&gt;\n&lt;p&gt;Для оценки структурного сходства изображений использовалась метрика SSIM, которая вычисляется по формуле $ ext{SSIM} = \\frac{(2\\mu_{K, ext{ch}}\\mu_{I, ext{ch}} + C_1)(2\\sigma_{KI, ext{ch}} + C_2)}{(\\mu_{K, ext{ch}}^2 + \\mu_{I, ext{ch}}^2 + C_1)(\\sigma_{K, ext{ch}}^2 + \\sigma_{I, ext{ch}}^2 + C_2)}, где константы составляют C_1 = 6.5025 и C_2 = 58.5225, а параметры \\mu, \\sigma и \\sigma_{KI} представляют собой локальные средние значения, стандартные отклонения и кросс-ковариацию каналов изображений K и I. Для временных матриц данных X и Y размерностью m  imes n$ коэффициент корреляции рассчитывается через средние значения элементов матриц по стандартному выражению.&lt;/p&gt;\n&lt;h4 id=\"inkrementalnoe-razlozhenie-dlya-raspoznavaniya-zhestov\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#inkrementalnoe-razlozhenie-dlya-raspoznavaniya-zhestov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Инкрементальное разложение для распознавания жестов&lt;/span&gt;&lt;/a&gt;Инкрементальное разложение для распознавания жестов&lt;/h4&gt;\n&lt;p&gt;Метод IncrementalMSVD разработан для получения обновленных правых сингулярных векторов (RSV) при добавлении новых матриц данных. Когда исходные данные Xexist расширяются до X' = [Xnew, Xexist], ковариационная матрица X'^T X' аппроксимируется комбинацией нового компонента и низкорангового приближения существующего компонента: &lt;span class=\"yfm-latex\" data-content=\"X'%5ET%20X'%20%5Capprox%20X_%7B%20ext%7Bnew%7D%7D%5ET%20X_%7B%20ext%7Bnew%7D%7D%20%2B%20X_%7B%20ext%7Bexist%7D%7D%5ET%20X_%7B%20ext%7Bexist%7D%7D%20%5Capprox%20X_%7B%20ext%7Bnew%7D%7D%5ET%20X_%7B%20ext%7Bnew%7D%7D%20%2B%20V_%7B%20ext%7Bexist%7D%7D%20S_%7B%20ext%7Bexist%7D%7D%5E2%20V_%7B%20ext%7Bexist%7D%7D%5ET%2C%20%D0%B3%D0%B4%D0%B5%20V_%7B%20ext%7Bexist%7D%7D%20%E2%80%94%20%D1%80%D0%B0%D0%BD%D0%B5%D0%B5%20%D1%80%D0%B0%D1%81%D1%81%D1%87%D0%B8%D1%82%D0%B0%D0%BD%D0%BD%D1%8B%D0%B5%20RSV.%20%D0%9D%D0%B0%20%D0%BF%D1%80%D0%B0%D0%BA%D1%82%D0%B8%D0%BA%D0%B5%20%D0%BA%D0%B0%D0%B6%D0%B4%D1%8B%D0%B9%20%D0%BE%D0%B1%D0%BD%D0%BE%D0%B2%D0%BB%D0%B5%D0%BD%D0%BD%D1%8B%D0%B9%20%D0%B2%D0%B5%D0%BA%D1%82%D0%BE%D1%80%20v_i'\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; находится через итеративный цикл с использованием степенного метода и дефляции:&lt;/p&gt;\n&lt;p class=\"yfm-latex\" data-content=\"v_i'%20%3D%20%5Cfrac%7B(V_%7B%20ext%7B%D1%81%D1%83%D1%89%7D%7D%20S_%7B%20ext%7B%D1%81%D1%83%D1%89%7D%7D%5E2%20V_%7B%20ext%7B%D1%81%D1%83%D1%89%7D%7D%5ET%20%2B%20X_%7B%20ext%7B%D0%BD%D0%BE%D0%B2%7D%7D%5ET%20X_%7B%20ext%7B%D0%BD%D0%BE%D0%B2%7D%7D%20-%20V_%7Bi-1%7D'%20S_%7Bi-1%7D'%5E2%20V_%7Bi-1%7D'%5ET)%20%20ilde%7Bv%7D_i%7D%7B%20ilde%7Bv%7D_i%5ET%20v_i'%7D%0A\" data-options=\"%7B%22displayMode%22%3Atrue%7D\"&gt;&lt;/p&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/power-iteration-deflation.html\"&gt;Степенной метод с дефляцией&lt;/a&gt; (power iteration-deflation) — это итеративный алгоритм линейной алгебры для эффективного нахождения собственных векторов и сингулярных разложений матриц без полного их пересчета.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;При этом i-е сингулярное значение на текущем этапе определяется как s_i'² = v_i'^T Xnew^T Xnew v_i' + v_i'^T Vexist Sexist² Vexist^T v_i'. На аппаратном уровне для хранения ранее вычисленных RSV задействован дополнительный мемристорный массив. При поступлении новых данных они отображаются в массив, а старые веса Vexist используются совместно с новыми расчетами, перезаписывая область памяти по мере обновления.&lt;/p&gt;\n&lt;h4 id=\"benchmarki-energoeffektivnosti\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#benchmarki-energoeffektivnosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бенчмарки энергоэффективности&lt;/span&gt;&lt;/a&gt;Бенчмарки энергоэффективности&lt;/h4&gt;\n&lt;p&gt;Энергопотребление оценивалось на архитектуре, приведенной на Рис. 2, с использованием проверенных схем и симулятора XPESim на базе 32-нм технологии мемристоров. Для задачи распознавания жестов по электромиограмме (ЭМГ) система конфигурировалась с разделением DPM [3,5], 4-кратным повторением векторов и 10 дополнительными битами входа для VPR наряду с базовыми 8-битными входами, выполняя 15 итераций для каждого рангового разложения. Один расчет MSVD потребляет 13.40 µJ, а одно инкрементальное обновление IncrementalMSVD — 17.83 µJ (детали приведены в Рис. SN 6 и Таблице SN 6). Для сравнения, графический процессор Nvidia A100 имеет энергоэффективность 390 GOPS·W⁻¹, и для выполнения 156 млн операций энергозатраты на GPU составляют 400 µJ. Таким образом, MSVD превосходит GPU по энергоэффективности в 29.9 раза (13.40 µJ против 400 µJ). Даже на 130-нм техпроцессе сохраняется 10-кратное преимущество (Рис. SN 28, Note 7).&lt;/p&gt;\n&lt;p&gt;Для инкрементального обучения с обновлением сингулярных векторов энергопотребление GPU классическими методами составляет 799 µJ, 1197 µJ и 1597 µJ для первого, второго и третьего обновлений соответственно. Инкрементальный MSVD достигает до 89.6-кратного преимущества (17.83 µJ против 1597 µJ на третьем обновлении) и суммарного снижения энергопотребления в 67.1 раза (((799 + 1197 + 1597) / (17.83 × 3)) = 67.1). По сравнению со специализированной интегральной схемой ASIC (Google TPU v3) инкрементальный MSVD демонстрирует общее преимущество в энергоэффективности в 55.9 раза (Рис. SN 29). В Таблице SN 7 представлены сравнения с другими CMOS-ASIC решениями, подтверждающие стабильное превосходство MSVD. Кроме того, оценка энергоэффективности для инкрементального обнаружения стадий сна по электроэнцефалограмме (ЭЭГ) показала 57.3-кратное преимущество перед A100 GPU (84.6 µJ против 4852 µJ) и 47.7-кратное перед Google TPU v3 (84.6 µJ против 4035 µJ, Рис. SN 30).&lt;/p&gt;\n&lt;p&gt;Применение метода SREA снижает число итераций до сходимости, обеспечивая экономию энергии на 48.5%  для MSVD (13.40 µJ против 26.04 µJ) и на 42.4%  для инкрементального MSVD (17.83 µJ против 30.97 µJ). Структура энергопотребления модулей системы для задач разного масштаба детально иллюстрируется на Рис. SN 31.&lt;/p&gt;\n&lt;h4 id=\"benchmark-normalizovannoj-skorosti\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#benchmark-normalizovannoj-skorosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бенчмарк нормализованной скорости&lt;/span&gt;&lt;/a&gt;Бенчмарк нормализованной скорости&lt;/h4&gt;\n&lt;p&gt;Нормализованная скорость работы оценивается как быстрота выполнения операций, деленная на необходимую площадь чипа. В задаче распознавания жестов на основе ЭМГ задержки для MSVD с SREA и без него составляют 183.8 мкс и 280.5 мкс соответственно, как указано в Рис. S8 и Таблицах S8, S9. Общая площадь, занимаемая MSVD с SREA и без него, равна 0.236 мм² и 0.229 мм², а детализация площади по модулям для задач разного масштаба приведена на Рис. S31. На основе этих метрик нормализованная скорость решения для MSVD с SREA составляет 23054 вычислений·с⁻¹·мм⁻², в то время как MSVD без SREA достигает 15568 вычислений·с⁻¹·мм⁻². В результате алгоритм SREA ускоряет MSVD на 48.1%.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Нормализованная скорость позволяет честно сравнить разные чипы и алгоритмы, сопоставляя их производительность на единицу площади кремния.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для графического процессора A100 с вычислительной мощностью 156 TOPS и размером кристалла 826 мм² нормализованная скорость решения составляет 1211 вычислений·с⁻¹·мм⁻². Таким образом, наша система MSVD демонстрирует 19.0-кратное преимущество по нормализованной скорости вычислений. Кроме того, в сравнении с ASIC на базе КМОП, представленном в Таблице S7, MSVD показывает заметное превосходство, несмотря на разницу в размере задач. При параллельной работе мемристорных массивов с матрицами данных, предвычисленными векторами и векторами для вычислений задержка операций на предвычисленных векторах может быть скрыта внутри параллельных операций с двумя другими матрицами, не создавая дополнительных накладных расходов.&lt;/p&gt;\n&lt;p&gt;Площади инкрементального MSVD с SREA и без него составляют 0.313 мм² и 0.298 мм² (Таблица S8). Для каждого обновления инкрементальный MSVD с SREA и без него достигает нормализованной скорости 17382 обновлений·с⁻¹·мм⁻² и 11963 обновлений·с⁻¹·мм⁻², в то время как скорости GPU составляют 607, 404 и 303 обновлений·с⁻¹·мм⁻² для трех обновлений соответственно (подробности на Рис. S8). В результате инкрементальный MSVD достигает среднего 39.7-кратного преимущества в скорости, доходя до 57.3-кратного преимущества по трем обновлениям. При этом SREA ускоряет инкрементальный MSVD на 45.3%. По сравнению с Google TPU v3 с расчетным размером кристалла около 700 мм², инкрементальный MSVD демонстрирует 42.6-кратное среднее улучшение скорости (17382 против 408 обновлений·с⁻¹·мм⁻², Рис. S29). Дополнительно в задачах определения стадий сна на основе ЭЭГ инкрементальный MSVD показывает среднее ускорение в 21.0 раз (8744 против 416 обновлений·с⁻¹·мм⁻²) по сравнению с TPU v3 (Рис. S30).&lt;/p&gt;\n&lt;h4 id=\"inicializaciya-dlya-adaptacii-nizkogo-ranga\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#inicializaciya-dlya-adaptacii-nizkogo-ranga\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Инициализация для адаптации низкого ранга&lt;/span&gt;&lt;/a&gt;Инициализация для адаптации низкого ранга&lt;/h4&gt;\n&lt;p&gt;Техники низкоранговой адаптации обычно разделяют веса предобученной модели на два различных компонента: замороженную (необучаемую) остаточную матрицу R^M × N и две обучаемые низкоранговые ветви, обозначенные как BranchA R^r × N и BranchB R^M × r, где r представляет целевой низкий ранг. В нашем подходе мы используем MSVD для инициализации этих компонентов. В частности, мы применяем MSVD к статическим весам в каждом слое трансформера в языковых моделях (LLM), включая слои запросов, ключей и значений, выходную проекцию, восходящую проекцию, нисходящую проекцию и слои шлюзов, как показано на Рис. 7a.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Низкоранговая адаптация (LoRA) и подобные методы позволяют эффективно дообучать гигантские нейросети, меняя лишь крошечную долю параметров.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для каждой весовой матрицы мы выполняем рангово-4 MSVD, выполняя 15 итераций на ранг. Полученные факторы разложения затем используются для построения инициализации весов PiSSA. Обучаемые низкоранговые ветви формируются следующим образом:&lt;/p&gt;\n&lt;p class=\"yfm-latex\" data-content=\"ext%7B%D0%92%D0%B5%D1%82%D0%B2%D1%8C%D0%90%7D%20%3D%20S_%7B1%3Ar%2C%201%3Ar%7D%5E%7B1%2F2%7D%20V_%7B%3A%2C%201%3Ar%7D%5ET%2C%20%5Cquad%20%20ext%7B%D0%92%D0%B5%D1%82%D0%B2%D1%8C%D0%91%7D%20%3D%20U_%7B%3A%2C%201%3Ar%7D%20S_%7B1%3Ar%2C%201%3Ar%7D%5E%7B1%2F2%7D%20%5Cquad%20(16)%0A\" data-options=\"%7B%22displayMode%22%3Atrue%7D\"&gt;&lt;/p&gt;&lt;p&gt;где S, V и U представляют решенные сингулярные значения, правые сингулярные векторы и левые сингулярные векторы соответственно. Одновременно замороженная остаточная матрица получается путем вычитания низкорангового приближения из исходной матрицы предобученных весов W:&lt;/p&gt;\n&lt;p class=\"yfm-latex\" data-content=\"M_%7B%20ext%7B%D0%BE%D1%81%D1%82%7D%7D%20%3D%20W%20-%20U_%7B%3A%2C%201%3Ar%7D%20S_%7B1%3Ar%2C%201%3Ar%7D%20V_%7B%3A%2C%201%3Ar%7D%5ET%20%5Cquad%20(17)%0A\" data-options=\"%7B%22displayMode%22%3Atrue%7D\"&gt;&lt;/p&gt;&lt;p&gt;Подробные конфигурации параметров для дообучения, наряду с конкретными размерностями весов слоев трансформера, приведены в Таблице S5.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/memristive-singular-value-decomposition-f1.jpg\" alt=\"Рис. 1 / Низкоранговое представление с использованием MSVD для универсального анализа данных. MSVD, то есть X = USVT, пр\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1 / Низкоранговое представление с использованием MSVD для универсального анализа данных. MSVD, то есть X = USVT, преобразует массивные и зашумленные исходные данные (X) в сжатую информацию (eX), которая является лаконичной и понятной. U и V представляют собой матрицы, содержащие левые и правые сингулярные векторы соответственно, в то время как S представляет собой диагональную матрицу сингулярных чисел.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"tablicy\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#tablicy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Таблицы&lt;/span&gt;&lt;/a&gt;Таблицы&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 1.&lt;/strong&gt; Информация об авторах и даты публикации&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Авторы&lt;/th&gt;\n&lt;th&gt;Даты&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Chenchen Ding, Zhengwu Liu, Yibei Zhang, Can Li, Jianshi Tang, Bin Gao, Hao Yu, Huaqiang Wu, Ngai Wong&lt;/td&gt;\n&lt;td&gt;Получено: 24 July 2025 / Принято: 23 July 2026&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;энергоемкость&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;вычислений SVD&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мемристорные&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;CIM чипы с&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;SREA&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;рост скорости&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;и точности в&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;разы&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;прорыв для&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;краевых&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;вычислений и&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ИИ&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале Nature communications. Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nature communications (Europe PMC)&lt;/td&gt;\n&lt;td&gt;other&lt;/td&gt;\n&lt;td&gt;CC BY-NC-ND 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Ding C, Liu Z, Zhang Y, Li C, Tang J, Gao B, Yu H, Wu H, Wong N.&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ссылка&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница статьи&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/article/PMC/PMC13590500\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;europepmc.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Полный текст (PDF)&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://www.nature.com/articles/s41467-026-76272-2.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;nature.com&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Копия PDF&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/VivaLyaRaza/biorxiv-digest/releases/download/issue-2026-09-25/memristive-singular-value-decomposition.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;github.com&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;DOI&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://doi.org/10.1038/s41467-026-76272-2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;doi.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Метаданные Crossref&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://api.crossref.org/works/10.1038/s41467-026-76272-2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;api.crossref.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Europe PMC&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/search?query=DOI%3A%2210.1038/s41467-026-76272-2%22\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;europepmc.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"podelit
