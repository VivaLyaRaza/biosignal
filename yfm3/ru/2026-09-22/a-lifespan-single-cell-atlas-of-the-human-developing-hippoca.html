        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"241\" cy=\"128\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"639\" cy=\"280\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Карта развития гиппокампа&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;человека для изучения ранней&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;болезни Альцгеймера&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f1.jpg\" alt=\"Рисунок 1. Атлас развивающегося гиппокампа человека (HuDeHA) отражает временную динамику развития гиппокампа от ранних э\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. &lt;a href=\"concepts/human-developing-hippocampus-atlas.html\"&gt;Атлас развивающегося гиппокампа человека&lt;/a&gt; (HuDeHA) отражает временную динамику развития гиппокампа от ранних эмбриональных до постнатальных стадий.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1. Атлас развивающегося гиппокампа человека (HuDeHA) отражает временную динамику развития гиппокампа от ранних эмбриональных до постнатальных стадий. (A) UMAP-эмбеддинг атласа (HuDeHA; 658 059 клеток), демонстрирующий 20 аннотированных классов клеток. Атлас охватывает нейрональную линию от радиальной глии и промежуточных клеток-предшественников (IPC) до ранних и зрелых нейронов, включая пролиферирующие состояния радиальной глии и IPC; глиальную линию, состоящую из глиальных предшественников, клеток-предшественников олигодендроцитов (OPC), олигодендроцитов и астроцитов; эктодермальные ненейрональные популяции (эпендима и сосудистое сплетение); нейральный гребень (NC) и нейроны, производные NC; неэктодермальные популяции (мезенхимальные, эндотелиальные, микроглиальные/миелоидные и другие иммунные клетки), а также небольшую группу, связанную со спинным мозгом/задним мозгом. (B) Плотность долей классов клеток в процессе развития (от 3-й недели после зачатия (PCW) до 15,3 лет), показывающая ожидаемые сдвиги от нейрогенеза к глиогенезу и появлению постнатальных классов клеток: радиальная глия и NC доминируют в эмбриональных образцах; IPC и глиальные предшественники появляются на фетальных стадиях, тогда как зрелые нейроны вместе с астроцитами и олигодендроцитами становятся преобладающими после рождения. (C) Динамика долей отдельных классов клеток в процессе развития, с разрешением по возрасту. В дополнение к (B), этот вид подчеркивает сроки появления и исчезновения отдельных классов: эмбриональное преобладание радиальной глии и ранних нейронов, постепенная потеря клеток, производных NC, при одновременном расширении популяции глиальных предшественников, а также постнатальное доминирование зрелых нейронов наряду с OPC, олигодендроцитами и астроцитами. (D) Точечная диаграмма (dotplot), показывающая экспрессию канонических маркеров для всех 20 аннотированных классов клеток: радиальная глия (VIM, SOX2), IPC (EOMES), пролиферирующая радиальная глия и IPC (TOP2A, MKI67), ранние (DCX) и зрелые нейроны (SNAP25), нейроны Кахаля-Ретциуса (CR) (RELN), глиальные предшественники (BCAN), OPC (OLIG1), олигодендроциты (MBP), астроциты (GFAP), эктодермальные ненейрональные популяции — эпендима (PIFO), сосудистое сплетение (TTR), NC (MPZ) и нейроны, производные NC (ISL1), мезенхима (DCN), эндотелий (CLDN5), &lt;a href=\"concepts/microglia.html\"&gt;микроглия&lt;/a&gt; (CX3CR1) и иммунные клетки (CD3D), группа спинного/заднего мозга (CDX2/4).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Гиппокамп — ключевой отдел мозга, отвечающий за формирование памяти и навигацию. Исследователи создали атлас развития этой структуры, отслеживая жизнь клеток от эмбрионального периода до взрослого возраста. Эта работа позволяет сравнить здоровое развитие мозга с тем, что происходит в органоидах, моделирующих наследственную форму болезни Альцгеймера.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Создан подробный атлас развития гиппокампа человека на уровне отдельных клеток&lt;/li&gt;\n&lt;li&gt;Определены молекулярные этапы созревания нейронов и глиальных клеток&lt;/li&gt;\n&lt;li&gt;Органоиды болезни Альцгеймера сопоставлены с эталонными данными развития&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Авторы работы использовали метод секвенирования РНК одиночных клеток (&lt;a href=\"concepts/scrna-seq.html\"&gt;scRNA-seq&lt;/a&gt;) для анализа транскриптомного профиля гиппокампа человека на разных этапах онтогенеза. Исследование охватило широкий временной интервал, что позволило выявить специфические молекулярные маркеры для различных типов нейронов и глиальных клеток. Особое внимание было уделено динамике экспрессии генов, связанных с синаптической пластичностью и нейрогенезом.&lt;/p&gt;\n&lt;p&gt;Полученные данные стали эталоном для оценки качества мозговых органоидов, полученных из индуцированных плюрипотентных стволовых клеток (&lt;a href=\"concepts/induced-pluripotent-stem-cells.html\"&gt;иПСК&lt;/a&gt;) пациентов с семейной формой болезни Альцгеймера. Сравнение показало, насколько точно лабораторные модели воспроизводят паттерны развития человеческого мозга. Это помогает выявить ранние молекулярные отклонения, которые предшествуют гибели нейронов и когнитивному дефициту.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на сравнении органоидов с атласом, однако органоиды не полностью воспроизводят сложную архитектуру и кровоснабжение мозга.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"concepts/familial-alzheimer-s-disease.html\"&gt;Семейная форма болезни Альцгеймера&lt;/a&gt; (fAD) — это вариант заболевания с ранним началом, обусловленный аутосомно-доминантными мутациями в генах APP, PSEN1 или PSEN2, причем мутации в PSEN1 являются наиболее частой генетической причиной. Гиппокамп — одна из первых и наиболее сильно повреждаемых областей мозга при болезни Альцгеймера. &lt;a href=\"concepts/brain-organoids.html\"&gt;Мозговые органоиды&lt;/a&gt;, полученные из индуцированных плюрипотентных стволовых клеток (&lt;a href=\"concepts/ipsk.html\"&gt;иПСК&lt;/a&gt;), позволяют моделировать раннее развитие мозга и изучать влияние мутаций fAD на нейрогенез. Однако интерпретация таких моделей затруднена из-за различий в региональной идентичности, степени зрелости и клеточном составе, зависящих от протоколов культивирования.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;иПСК-органоиды — это трехмерные клеточные структуры, выращенные из стволовых клеток пациента, которые имитируют развитие органов, в данном случае — структур головного мозга.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Существующие исследования гиппокампа человека на уровне единичных клеток охватывают пренатальный и постнатальный периоды, но не создают непрерывной карты развития. Для решения этой проблемы был создан атлас развивающегося гиппокампа человека (HuDeHA).&lt;/p&gt;\n&lt;p&gt;Атлас HuDeHA представляет собой интегрированную базу данных, включающую 658 059 клеток, охватывающих период от 3-й недели после зачатия до 15,3 лет жизни. Этот ресурс был использован для оценки качества органоидов, несущих мутацию PSEN1E280A, характерную для крупной популяции пациентов в Колумбии. Сравнительный анализ показал, что в органоидах с мутацией PSEN1E280A изменен клеточный состав: наблюдается снижение количества радиальной глии и увеличение числа нейронов, происходящих из нервного гребня.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование 658 059 клеток в рамках HuDeHA выявило, что мутация PSEN1E280A приводит к снижению популяции радиальной глии и аномальному сдвигу в сторону зрелых нейронных состояний.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эти изменения сопровождались транскрипционными сдвигами: широкой активацией фактора вентрального паттернинга MEIS2 и снижением экспрессии белка TTR, связывающего амилоид-бета, в клетках сосудистого сплетения и эпендимальных клетках. Реконструкция траекторий развития нейронных линий продемонстрировала преждевременный сдвиг в сторону более зрелых состояний в мутантных органоидах.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа основана на сравнении органоидов с эталонным атласом; результаты in vitro могут не полностью отражать сложные процессы нейродегенерации в живом организме.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"semejnaya-forma-bolezni-alcgejmera-i-modelirovanie-na-organoidah\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#semejnaya-forma-bolezni-alcgejmera-i-modelirovanie-na-organoidah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Семейная форма болезни Альцгеймера и моделирование на органоидах&lt;/span&gt;&lt;/a&gt;Семейная форма болезни Альцгеймера и моделирование на органоидах&lt;/h4&gt;\n&lt;p&gt;Семейная форма болезни Альцгеймера (fAD) обусловлена аутосомно-доминантными мутациями в генах APP, PSEN1 или PSEN2, причем варианты PSEN1 являются наиболее частой генетической причиной раннего начала заболевания. Патогенные варианты PSEN1 изменяют работу фермента γ-секретазы, что способствует накоплению более длинных и склонных к агрегации форм бета-амилоида (Aβ) и повышает соотношение Aβ42/Aβ40. Остается неясным, на каких этапах развития человека эти мутации начинают нарушать клеточные программы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мутации в гене PSEN1 при семейной форме болезни Альцгеймера смещают продукцию Aβ в сторону более агрегативных форм, однако влияние этих изменений на раннее развитие мозга изучено недостаточно.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мозговые органоиды, полученные из индуцированных плюрипотентных стволовых клеток (иПСК), позволяют моделировать раннее развитие нервной системы человека в контролируемых генетических условиях. Эти трехмерные структуры воспроизводят процессы формирования тканей и созревания нейронов, предоставляя платформу для изучения доклинических последствий мутаций fAD. Предыдущие исследования органоидов фокусировались на амилоидном обмене, тау-патологии и синаптических нарушениях, оставляя без внимания влияние мутаций на раннее развитие и дифференцировку линий клеток.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Органоиды — это трехмерные клеточные модели, которые имитируют структуру и функции развивающегося органа, в данном случае — мозга.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"atlas-razvitiya-gippokampa-cheloveka-hudeha\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#atlas-razvitiya-gippokampa-cheloveka-hudeha\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атлас развития гиппокампа человека (HuDeHA)&lt;/span&gt;&lt;/a&gt;Атлас развития гиппокампа человека (HuDeHA)&lt;/h4&gt;\n&lt;p&gt;Интерпретация данных органоидов осложняется их гетерогенностью и неполной зрелостью клеток, что затрудняет отделение эффектов генотипа от случайных различий в составе тканей. Для решения этой проблемы был создан «Атлас развития гиппокампа человека» (HuDeHA) — интегрированный справочник, включающий 658 059 клеток, охватывающий период от 3-й до 16-й недели после зачатия (PCW3–PCW16), а также более поздние фетальные и постнатальные стадии вплоть до подросткового возраста.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Органоиды не являются полноценным мозгом: они могут содержать нецелевые типы клеток и демонстрировать неполную дифференцировку, что требует сравнения с эталонными атласами развития.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Использование HuDeHA позволило систематически аннотировать клетки органоидов с мутацией PSEN1E280A, оценивая их идентичность и стадию созревания. Анализ показал, что органоиды с мутацией PSEN1E280A характеризуются снижением количества радиальной глии, увеличением числа нейронов, происходящих из нервного гребня, и специфическими изменениями в программах развития, а также небольшим сдвигом в сторону более поздних стадий созревания нейронов.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"atlas-razvivayushegosya-gippokampa-cheloveka-hudeha-opredelyaet-osnovnye-tipy-kletok-v-pre-i-postnatalnom-periode\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#atlas-razvivayushegosya-gippokampa-cheloveka-hudeha-opredelyaet-osnovnye-tipy-kletok-v-pre-i-postnatalnom-periode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атлас развивающегося гиппокампа человека (HuDeHA) определяет основные типы клеток в пре- и постнатальном периоде&lt;/span&gt;&lt;/a&gt;Атлас развивающегося гиппокампа человека (HuDeHA) определяет основные типы клеток в пре- и постнатальном периоде&lt;/h4&gt;\n&lt;p&gt;Авторы создали атлас развивающегося гиппокампа человека (HuDeHA), объединив 107 наборов данных &lt;a href=\"concepts/single-cell-rna-sequencing.html\"&gt;scRNA-seq&lt;/a&gt;, содержащих 658 059 клеток (Рис. 1A; Рис. SN; Таблица SN). Выборка охватывает период от 3-й недели после зачатия (PCW3) до подросткового возраста (15,3 года). Анализ позволил выделить 20 основных типов клеток, включая нейрональные, глиальные, сосудистые и иммунные линии (Рис. 1D).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f1.jpg\" alt=\"Рисунок 1. Атлас развивающегося гиппокампа человека (HuDeHA) отражает временную динамику развития гиппокампа от ранних э\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Атлас развивающегося гиппокампа человека (HuDeHA) отражает временную динамику развития гиппокампа от ранних эмбриональных до постнатальных стадий.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1. Атлас развивающегося гиппокампа человека (HuDeHA) отражает временную динамику развития гиппокампа от ранних эмбриональных до постнатальных стадий. (A) UMAP-эмбеддинг атласа (HuDeHA; 658 059 клеток), демонстрирующий 20 аннотированных классов клеток. Атлас охватывает нейрональную линию от радиальной глии и промежуточных клеток-предшественников (IPC) до ранних и зрелых нейронов, включая пролиферирующие состояния радиальной глии и IPC; глиальную линию, состоящую из глиальных предшественников, клеток-предшественников олигодендроцитов (OPC), олигодендроцитов и астроцитов; эктодермальные ненейрональные популяции (эпендима и сосудистое сплетение); нейральный гребень (NC) и нейроны, производные NC; неэктодермальные популяции (мезенхимальные, эндотелиальные, микроглиальные/миелоидные и другие иммунные клетки), а также небольшую группу, связанную со спинным мозгом/задним мозгом. (B) Плотность долей классов клеток в процессе развития (от 3-й недели после зачатия (PCW) до 15,3 лет), показывающая ожидаемые сдвиги от нейрогенеза к глиогенезу и появлению постнатальных классов клеток: радиальная глия и NC доминируют в эмбриональных образцах; IPC и глиальные предшественники появляются на фетальных стадиях, тогда как зрелые нейроны вместе с астроцитами и олигодендроцитами становятся преобладающими после рождения. (C) Динамика долей отдельных классов клеток в процессе развития, с разрешением по возрасту. В дополнение к (B), этот вид подчеркивает сроки появления и исчезновения отдельных классов: эмбриональное преобладание радиальной глии и ранних нейронов, постепенная потеря клеток, производных NC, при одновременном расширении популяции глиальных предшественников, а также постнатальное доминирование зрелых нейронов наряду с OPC, олигодендроцитами и астроцитами. (D) Точечная диаграмма (dotplot), показывающая экспрессию канонических маркеров для всех 20 аннотированных классов клеток: радиальная глия (VIM, SOX2), IPC (EOMES), пролиферирующая радиальная глия и IPC (TOP2A, MKI67), ранние (DCX) и зрелые нейроны (SNAP25), нейроны Кахаля-Ретциуса (CR) (RELN), глиальные предшественники (BCAN), OPC (OLIG1), олигодендроциты (MBP), астроциты (GFAP), эктодермальные ненейрональные популяции — эпендима (PIFO), сосудистое сплетение (TTR), NC (MPZ) и нейроны, производные NC (ISL1), мезенхима (DCN), эндотелий (CLDN5), микроглия (CX3CR1) и иммунные клетки (CD3D), группа спинного/заднего мозга (CDX2/4).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Атлас HuDeHA классифицирует 658 059 клеток на 20 типов, отражая переход от нейрогенеза к глиогенезу в период от 3-й недели после зачатия до 15,3 лет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нейроэктодермальная линия включает радиальную глию (194 105 клеток; маркеры VIM, SOX2, NES) и её пролиферирующую субпопуляцию (11 390 клеток; TOP2A, MKI67, UBE2C, CDK1). Далее следуют промежуточные клетки-предшественники (IPC; 15 033 клетки; EOMES, ASCL1) и их пролиферирующая группа (3 860 клеток). Они дифференцируются в ранние нейроны (246 627 клеток; DCX, NEUROD2, ELAVL3) и зрелые нейроны (95 335 клеток; RBFOX3, SNAP25, SYT1). Также выявлены нейроны Кахаля-Ретциуса (170 клеток; RELN).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;scRNA-seq (секвенирование РНК единичных клеток) — метод, позволяющий определить активность генов в каждой отдельной клетке, что помогает выявить редкие типы клеток и пути их развития.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Глиальная линия представлена предшественниками (8 536 клеток; BCAN, TNC), олигодендроцитами (7 908 клеток; PLP1, MBP), их предшественниками (OPC; 11 483 клетки; OLIG1, PDGFRA) и астроцитами (15 701 клетка; GFAP, AQP4). Дополнительно описаны эпендимальные клетки (2 200 клеток), клетки сосудистого сплетения (2 119 клеток), а также линии нервного гребня (NC; 10 036 клеток) и производные от них нейроны (6 302 клетки). Неэктодермальные популяции включают мезенхиму (8 052 клетки), эндотелий (228 клеток), микроглию (4 876 клеток) и прочие иммунные клетки (160 клеток). Также обнаружена небольшая группа клеток спинного мозга/заднего мозга (480 клеток; CDX2, CDX4) (Рис. 1D).&lt;/p&gt;\n&lt;p&gt;Динамика состава клеток от PCW3 до 15,3 лет показывает, что ранние эмбриональные стадии богаты радиальной глией и клетками нервного гребня, тогда как в постнатальном периоде преобладают зрелые нейроны и дифференцированные глиальные клетки (Рис. 1B, C; Рис. SN). Оценка потенциала развития с помощью &lt;a href=\"concepts/cytotrace2.html\"&gt;CytoTRACE2&lt;/a&gt; показала снижение баллов от пролиферирующих предшественников (медиана 0,57) до зрелых нейронов (медиана 0,05), что подтверждает утрату пластичности при дифференцировке (Рис. 1G; Рис. SN).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на интеграции существующих данных (мета-анализ), поэтому результаты зависят от качества исходных выборок и точности аннотации типов клеток.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"hudeha-pozvolyaet-provodit-kartirovanie-dannyh-organoidov-fad-na-osnove-referensa\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#hudeha-pozvolyaet-provodit-kartirovanie-dannyh-organoidov-fad-na-osnove-referensa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HuDeHA позволяет проводить картирование данных органоидов fAD на основе референса&lt;/span&gt;&lt;/a&gt;HuDeHA позволяет проводить картирование данных органоидов fAD на основе референса&lt;/h4&gt;\n&lt;p&gt;Для анализа использовали набор данных scRNA-seq органоидов мозга, полученный из &lt;a href=\"concepts/ipsc.html\"&gt;iPSC&lt;/a&gt;, включающий четыре генотипа: PSEN1WT/APOEWT, PSEN1WT/APOECh, PSEN1E280A/APOEWT и PSEN1E280A/APOECh. Данные состояли из восьми библиотек, созданных на основе восьми клеточных линий CRISPR от двух доноров (по шесть органоидов на линию). Мы применили &lt;a href=\"concepts/scpoli.html\"&gt;scPoli&lt;/a&gt; — полуавтоматическую нейросетевую модель для переноса меток клеточных типов с референса HuDeHA на данные органоидов (Рис. 2A). Метод позволил выделить линии прогениторов, нейронов, эпителиальных/вентрикулярных, мезенхимальных и NC-клеток (Рис. 2B). Глиальные, иммунные или сосудистые популяции на данной стадии не выявлены.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f2.jpg\" alt=\"Рисунок 2. Соотнесение с HuDeHA позволяет сравнивать органоиды мозга, полученные из иПСК, с клеточными состояниями гиппо\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2. Соотнесение с HuDeHA позволяет сравнивать органоиды мозга, полученные из иПСК, с клеточными состояниями гиппокампа in vivo и стадиями развития.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 2. Соотнесение с HuDeHA позволяет сравнивать органоиды мозга, полученные из иПСК, с клеточными состояниями гиппокампа in vivo и стадиями развития. (A) Схема рабочего процесса анализа. HuDeHA (от 3 PCW до 15,3 лет; 20 классов клеток) послужил эталоном для переноса меток классов клеток и возраста развития на органоиды мозга человека PSEN1WT и PSEN1E280A с использованием scPoli. Алгоритм scPoli был обучен на пересечении наборов генов эталона и запроса (22 467 генов), а клетки органоидов были спроецированы в изученное латентное пространство для предсказания меток. (B) UMAP органоидов мозга, окрашенный по 12 предсказанным классам клеток, полученным из HuDeHA, с последующей ограниченной ручной коррекцией (см. Методы). Звездочками отмечены новые или агрегированные классы по отношению к HuDeHA: «ранняя эпендима» (добавлена вручную, отсутствует в HuDeHA) и «пролиферирующие предшественники» (агрегат пролиферирующей радиальной глии и пролиферирующих IPC). (C) Графики признаков (feature plots) выбранных региональных и линейных маркеров на эмбеддинге одиночных клеток органоидов. PAX6 маркирует широкий дорсальный компартмент предшественников, GRIA2 — отдельную популяцию зрелых нейронов, S100B — преимущественно популяцию NC с дополнительной экспрессией в эпендимоподобных клетках, а WNT1 — небольшую популяцию, подобную дорсальной средней линии, что согласуется с идентичностью крыши пластинки или кортикальной каймы. (D) Точечная диаграмма экспрессии маркерных генов для предсказанных классов клеток органоидов: пролиферирующие предшественники (TOP2A, MKI67); радиальная глия (SOX2); IPC (ASCL1); ранние нейроны (TUBB3) и зрелые нейроны (GRIN2B); нейроны, производные NC (ISL1); глиальные предшественники (SOX9); ранняя эпендима (CFAP144) и эпендима (FOXJ1); сосудистое сплетение (TTR); NC (MPZ, FOXD3); мезенхима (DCN, PRRX1). (E) Тепловая карта сходства Жаккара между классами клеток HuDeHA и органоидов, рассчитанная по 1500 наиболее дифференциально экспрессируемым (DE) генам на класс, количественно оценивающая перекрытие между специфичными для класса программами маркерных генов. (F) UMAP органоидов, окрашенный по предсказанным возрастным интервалам, объединенным в стадии развития. (G) Распределение предсказанного возраста развития на оси количества клеток в логарифмическом масштабе. Клетки охватывают широкую гетерогенность развития в одной временной точке сбора органоидов: большинство клеток соответствуют периоду PCW4–PCW9, с меньшей долей, отнесенной к постнатальным стадиям. (H) Тепловая карта долей классов клеток по предсказанным возрастным интервалам. Классы, связанные с ранними стадиями (пролиферирующие предшественники, нейроны, производные NC), были обогащены для более раннего пренатального возраста, тогда как классы, связанные с поздними стадиями (сосудистое сплетение, эпендима, зрелые нейроны, олигодендроциты), были обогащены для более позднего возраста.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод scPoli позволил классифицировать клетки органоидов, выявив доминирование ранних нейронов (19 131 клетка) и радиальной глии (18 384 клетки) при малом числе IPC (1 308) и зрелых нейронов (877).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;scPoli — это инструмент машинного обучения, который сопоставляет данные нового эксперимента с уже известным «атласом» (референсом), чтобы автоматически определить типы клеток в образце.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Популяция IPC экспрессировала ASCL1 и HES6, а EOMES присутствовал менее чем в 1% клеток. Ранние нейроны экспрессировали TUBB3, STMN2, DCX, а зрелые — GRIN2B и GRIA2 (Рис. 2C, D). Сигнал S100B, а также маркеры MPZ, FOXD3 и SOX10 были связаны с NC-компартментом (Рис. 2B, C, D).&lt;/p&gt;\n&lt;h4 id=\"analiz-specificheskih-populyacij-i-tochnost-annotacii\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#analiz-specificheskih-populyacij-i-tochnost-annotacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ специфических популяций и точность аннотации&lt;/span&gt;&lt;/a&gt;Анализ специфических популяций и точность аннотации&lt;/h4&gt;\n&lt;p&gt;Некоторые группы, включая эпендиму и глиальные прогениторы, имели более высокие показатели неопределенности аннотации (Рис. S2A). Мы обнаружили популяцию, обогащенную CFAP (CFAP126, CFAP144, CFAP276, CFAP141, CFAP90), отсутствующую в HuDeHA, и классифицировали её как «раннюю эпендимальную» (Рис. S2B). Эти клетки экспрессировали FOXJ1, но не имели полного набора генов для сборки ресничек. Глиальные прогениторы демонстрировали маркеры LMX1A/B, MSX1, GDF7 и WNT1/3A (Рис. 2C, Рис. S2C), однако канонические маркеры TNC, BCAN и NFIB были выражены слабо или отсутствовали (Рис. S2D).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оценка проводилась на органоидах in vitro; выявленные различия в экспрессии генов указывают на неполную дифференцировку по сравнению с тканями in vivo.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для оценки сходства использовали индекс Жаккара и корреляцию Пирсона (Рис. 2E, Рис. S3A-C). Наибольшее сходство с референсом показали мезенхимальные клетки (индекс Жаккара = 0,38) и ранние нейроны (0,32). Прогениторные популяции демонстрировали более широкое перекрытие (индекс Жаккара 0,29–0,32). Ранние эпендимальные клетки имели низкое сходство со всеми классами референса, что подтверждает их статус специфической для органоидов популяции. Контрольные группы (астроциты, OPC, олигодендроциты, микроглия) не показали значимого сходства с клетками органоидов (Рис. S3B).&lt;/p&gt;\n&lt;p&gt;Используя аннотации HuDeHA для определения возраста развития, мы применили метод scPoli для оценки сходства органоидов fAD с эталонными стадиями. Состояния клеток органоидов охватили диапазон от раннего пренатального до постнатального периодов (Рис. 2F). Большинство клеток соответствовало ранним пренатальным стадиям (PCW4–PCW9), при этом лишь около 1% клеток соотнеслись с PCW11 или более поздними этапами (Рис. 2G). Распределение по возрастным группам показало, что прогениторные и не-нейрональные популяции (пролиферирующие клетки, мезенхимальные и NC-клетки) соответствуют более раннему «возрасту», тогда как зрелые нейроны и эпендимоподобные клетки — более позднему (Рис. 2H).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Органоиды fAD преимущественно соответствуют ранним стадиям развития (PCW4–PCW9), при этом дифференцированные клетки ожидаемо демонстрируют признаки более позднего созревания.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"organoidy-psen1e280a-demonstriruyut-razlichiya-v-kletochnom-sostave-i-profilyah-ekspressii\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#organoidy-psen1e280a-demonstriruyut-razlichiya-v-kletochnom-sostave-i-profilyah-ekspressii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Органоиды PSEN1E280A демонстрируют различия в клеточном составе и профилях экспрессии&lt;/span&gt;&lt;/a&gt;Органоиды PSEN1E280A демонстрируют различия в клеточном составе и профилях экспрессии&lt;/h4&gt;\n&lt;p&gt;Мы сравнили состав клеток в органоидах PSEN1E280A и PSEN1WT (Рис. 3A-B). Статистический анализ с помощью байесовского фреймворка &lt;a href=\"concepts/sccoda.html\"&gt;scCODA&lt;/a&gt; выявил достоверное увеличение доли нейронов, происходящих из нервного гребня (NC-derived neurons), и снижение доли радиальной глии в мутантных органоидах. Анализ предсказанного возраста показал, что пролиферирующие прогениторы и NC-нейроны в органоидах PSEN1E280A «моложе», чем в контроле (5,5 против 6,7 PCW и 5,7 против 7,4 PCW соответственно, Рис. 3C).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f3.jpg\" alt=\"Рисунок 3. PSEN1E280A связан с измененным балансом линий и специфичной для класса дисрегуляцией нейрональной спецификаци\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3. PSEN1E280A связан с измененным балансом линий и специфичной для класса дисрегуляцией нейрональной спецификации, программ предшественников и желудочковых программ.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 3. PSEN1E280A связан с измененным балансом линий и специфичной для класса дисрегуляцией нейрональной спецификации, программ предшественников и желудочковых программ. (A) UMAP органоидов мозга, разделенный по условиям (n = 2 для PSEN1WT и n = 6 для PSEN1E280A), окрашенный по предсказанному классу клеток, показывающий различия в распределении классов клеток между условиями. (B) Столбчатые диаграммы с накоплением, показывающие процентный состав каждого класса клеток по условиям. Звездочки указывают на классы клеток со статистически значимыми различиями в относительной представленности между условиями. По сравнению с органоидами WT, органоиды PSEN1E280A показали увеличенную долю нейронов, производных NC, и сниженную долю радиальной глии. Таблица справа содержит точный процент каждого класса клеток в каждом условии. (C) Тепловая карта среднего предсказанного возраста развития по классам клеток, упорядоченная по убыванию среднего значения по всему набору данных. Звездочки отмечают классы клеток со значимыми возрастными различиями между условиями, оцененными с помощью дельты Клиффа. Пороговые значения: скорректированное p-значение ≤ 0,05. (D) Дифференциально экспрессируемые гены в органоидах PSEN1E280A по сравнению с WT, с разрешением по классам клеток. Гены с повышенной экспрессией показаны красным, с пониженной — зеленым; классы клеток упорядочены по убыванию общего количества DE-генов. Отмечены 10 наиболее информативных генов для каждого класса; ось log2FC масштабирована для визуализации. Пороговые значения: скорректированное p-значение ≤ 0,05, /log2FC/ ≥ 0,5.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;scCODA — это статистический метод для анализа изменений в пропорциях клеточных типов в данных секвенирования отдельных клеток, позволяющий учитывать неопределенность состава.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ дифференциальной экспрессии генов (&lt;a href=\"concepts/gene-expression.html\"&gt;DEG&lt;/a&gt;) выявил наиболее значимые изменения в популяциях NC-клеток, NC-нейронов и сосудистого сплетения (Рис. 3D). В зрелых нейронах наблюдалась повышенная экспрессия MEIS2, MEIS1, NR2F1 и TAC1. В NC-нейронах активировались HES6, NEUROD1 и NFIA. Пролиферирующие прогениторы показали рост уровней S100B, LGALS1, S100A10 при снижении SLIT2 и TENM2. В радиальной глии увеличилась экспрессия S100B и APOE. В клетках сосудистого сплетения выявлено снижение TTR, IGF1 и RSPO2, а также рост FOLR1. В эпендимальных клетках отмечено снижение экспрессии митохондриальных транскриптов (MT-CO1, MT-CO2, MT-CO3, MT-CYB, MT-ATP6).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проведено на органоидах (in vitro); наблюдаемые различия в экспрессии генов и клеточном составе требуют подтверждения в тканях головного мозга человека.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сравнение путей обогащения показало, что наиболее выраженные различия между PSEN1E280A и WT связаны с WNT-сигнальным путем, активность которого снижена в пролиферирующих прогениторах мутантных органоидов (Рис. SN). При сопоставлении с эталоном HuDeHA подтвердилось, что именно пролиферирующие клетки в органоидах PSEN1E280A демонстрируют наиболее заметное отклонение по WNT-сигнализации по сравнению с возрастными аналогами.&lt;/p&gt;\n&lt;h4 id=\"analiz-nejronalnyh-traektorij-vyyavil-izmeneniya-v-dinamike-sozrevaniya\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#analiz-nejronalnyh-traektorij-vyyavil-izmeneniya-v-dinamike-sozrevaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ нейрональных траекторий выявил изменения в динамике созревания&lt;/span&gt;&lt;/a&gt;Анализ нейрональных траекторий выявил изменения в динамике созревания&lt;/h4&gt;\n&lt;p&gt;Исследователи проанализировали нейрональную линию, используя HuDeHA в качестве эталона in vivo, и построили псевдовременную шкалу для клеток-предшественников (IPC), ранних и зрелых нейронов (Рис. 4A, B). Порядок псевдовремени соответствовал этапам дифференцировки. Факторы транскрипции NEUROG1, NEUROD1, NEUROD4 и ASCL1, отвечающие за нейрогенную детерминацию, были наиболее активны на ранних этапах. В то же время гены, связанные со структурой нейронов и синаптической функцией (MAPT, SNAP25, SYT1, VAMP2, NLGN1), демонстрировали повышенную экспрессию на поздних этапах (Рис. 4E, Рис. S5).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f4.jpg\" alt=\"Рисунок 4. PSEN1E280A изменяет нейрональную дифференцировку в сторону более зрелых состояний развития.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4. PSEN1E280A изменяет нейрональную дифференцировку в сторону более зрелых состояний развития.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 4. PSEN1E280A изменяет нейрональную дифференцировку в сторону более зрелых состояний развития. (A) Схема анализа траектории нейрональной линии. IPC, ранние нейроны и зрелые нейроны были выделены как из органоидов мозга, полученных из иПСК, так и из HuDeHA, и использованы для реконструкции траекторий псевдовремени. Траектории органоидов сравнивались между условиями (PSEN1WT против PSEN1E280A) и сопоставлялись с эталоном HuDeHA in vivo.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анализ показал, что клетки PSEN1E280A смещены в сторону более зрелых состояний по псевдовремени по сравнению с PSEN1WT, при этом общая структура траектории остается неизменной.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Траектория была разделена на шесть сегментов (бин-интервалов) (Рис. 4C, 4B’’). Ранние сегменты обогащены процессами биосинтеза, фолдинга белков и окислительного фосфорилирования, тогда как поздние — процессами дифференцировки, развития аксонов, дендритов и синаптогенеза (Рис. 4D). Термины, связанные с апоптозом, концентрировались на ранних этапах, что подтверждает направленность траектории на созревание, а не на гибель клеток.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/psevdovremya.html\"&gt;Псевдовремя&lt;/a&gt; (pseudotime) — это вычислительный метод, позволяющий упорядочить клетки вдоль «траектории» развития на основе их транскриптомного сходства, имитируя временную последовательность биологических процессов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сравнение генотипов показало, что клетки PSEN1WT концентрируются в ранних и промежуточных сегментах (пик t2–t3), тогда как PSEN1E280A чаще встречаются в более поздних сегментах (Рис. 4B′, C). При сравнении с эталонными данными HuDeHA (Рис. S6A, B, D) выяснилось, что органоиды в целом соответствуют ранним стадиям развития in vivo (Рис. S6E). Хотя все органоиды демонстрируют сходство с ранними этапами HuDeHA (t1–t2), клетки PSEN1E280A показывают несколько более высокую степень сходства с промежуточным этапом t3 по сравнению с диким типом.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проведено на органоидах мозга; результаты показывают лишь корреляцию между мутацией и темпом созревания, а не прямую причинно-следственную связь в организме человека.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;p&gt;Мы создали атлас развивающегося гиппокампа человека (HuDeHA), охватывающий период от 3-й недели после зачатия (PCW) до 15,3 лет. Этот ресурс объединяет данные раннего эмбрионального нейрогенеза, пренатального развития и постнатального созревания. В отличие от существующих атласов, сфокусированных либо на фетальных стадиях, либо на постнатальном глиальном разнообразии, HuDeHA интегрирует данные из различных источников, включая исследования широких областей мозга, с фильтрацией клеток гиппокампа. Это позволило создать комплексную карту нейронных, прогениторных, глиальных, сосудистых и иммунных популяций. Ресурс позволяет сопоставлять клетки in vitro с их аналогами in vivo и выявлять отклонения в развитии, например, в органоидах, связанных с заболеваниями.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HuDeHA охватывает развитие гиппокампа от 3-й недели после зачатия до 15,3 лет, позволяя сравнивать клеточный состав in vivo с моделями органоидов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Используя HuDeHA, мы проанализировали iPSC-производные органоиды мозга с мутацией PSEN1E280A (семейная форма болезни Альцгеймера). Большинство клеток органоидов соответствовали раннему эмбриональному развитию (5–9 PCW). Это подтверждает, что недифференцированные церебральные органоиды на данной стадии развития богаты прогениторами и слабо соответствуют более поздним фетальным состояниям.&lt;/p&gt;\n&lt;h4 id=\"kartirovanie-na-referens-vyyavlyaet-divergentnye-i-specifichnye-dlya-organoidov-populyacii\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#kartirovanie-na-referens-vyyavlyaet-divergentnye-i-specifichnye-dlya-organoidov-populyacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Картирование на референс выявляет дивергентные и специфичные для органоидов популяции&lt;/span&gt;&lt;/a&gt;Картирование на референс выявляет дивергентные и специфичные для органоидов популяции&lt;/h4&gt;\n&lt;p&gt;Аннотация на основе HuDeHA показала, что органоиды содержат нейронную линию, а также клетки, подобные нервному гребню и мезенхимальные компоненты, однако зрелые глиальные популяции отсутствовали. Наличие клеток нервного гребня, вероятно, связано с неполной региональной специфичностью протоколов, а не с влиянием мутации. В нейронной линии преобладали радиальная глия и ранние нейроны, тогда как промежуточные прогениторы (IPC) и зрелые нейроны были представлены незначительно.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нервный гребень — это эмбриональная ткань, которая в норме дает начало клеткам периферической нервной системы, но часто обнаруживается как «побочный» тип клеток в органоидах мозга.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Органоиды мозга — это упрощенные модели in vitro; их клеточный состав может содержать «офф-таргетные» популяции, не характерные для развивающегося мозга in vivo.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Химерные профили экспрессии генов затрудняют аннотацию. Популяции, подобные сосудистому сплетению и эпендиме, демонстрировали низкое сходство с референсом HuDeHA, что указывает на их неполное созревание. Мы также выявили популяцию незрелого вентрикулярного эпителия с частичной активацией программы цилиогенеза, но без четкого аналога в HuDeHA. Низкая экспрессия FOXJ1 и отсутствие ключевых генов сборки аксонем свидетельствуют об органоид-специфичном состоянии, а не о полноценной эпендиме. Популяции, напоминающие глиальные прогениторы, вероятно, представляют собой сигнальное состояние, близкое к кортикальной пластинке или сосудистому сплетению.&lt;/p&gt;\n&lt;h4 id=\"psen1e280a-associirovana-s-izmeneniem-raspredeleniya-kletochnyh-linij-i-specificheskimi-transkripcionnymi-programmami\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#psen1e280a-associirovana-s-izmeneniem-raspredeleniya-kletochnyh-linij-i-specificheskimi-transkripcionnymi-programmami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PSEN1E280A ассоциирована с изменением распределения клеточных линий и специфическими транскрипционными программами&lt;/span&gt;&lt;/a&gt;PSEN1E280A ассоциирована с изменением распределения клеточных линий и специфическими транскрипционными программами&lt;/h4&gt;\n&lt;p&gt;Композиционный анализ показывает, что мутация PSEN1E280A связана с нарушением баланса клеточных линий в органоидах: наблюдается относительное снижение популяции радиальной глии и увеличение доли клеток нервного гребня. Этот дисбаланс может указывать на изменение поведения клеток-предшественников, в частности, на снижение способности радиальной глии к самоподдержанию и ускоренную нейрональную дифференцировку. Поскольку количество клеток нервного гребня зависит от протокола дифференцировки, выявленное увеличение следует рассматривать как ассоциацию с мутацией, а не как её прямое следствие. Эти сдвиги согласуются с гипотезой о том, что нарушение сигнальных программ на ранних этапах развития смещает выбор линии дифференцировки.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мутация PSEN1E280A вызывает дисбаланс клеточных линий и специфические изменения в транскрипции, затрагивающие развитие нейронов и клеток-предшественников.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ дифференциальной экспрессии выявил транскрипционные изменения во многих линиях развития. Выделено три паттерна: нарушение спецификации нейрональных судеб, изменение программ нейрогенеза и дисфункция эпителия желудочков и сосудистого сплетения. В нейрональных линиях, включая промежуточные клетки-предшественники (IPC) и зрелые нейроны, отмечена повышенная экспрессия MEIS2, а также MEIS1, NR2F1 и TAC1. Белки MEIS являются факторами транскрипции, регулирующими развитие тканей, а NR2F1 контролирует динамику предшественников и идентичность коры. Функциональное значение этих изменений пока неясно. Радиальная глия в органоидах с мутацией демонстрирует повышенные уровни S100B и APOE, что может указывать на изменение состояния предшественников ещё до формирования зрелой глии.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Органоиды — это трехмерные клеточные модели, выращенные из стволовых клеток, которые имитируют структуру и функции органов, в данном случае — развивающегося мозга.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В нейронах, происходящих из нервного гребня, повышена экспрессия HES6 и NEUROD1, что указывает на регуляцию ранних нейрогенных программ. Однако, поскольку эти клетки соответствуют ранним стадиям развития, их ко-экспрессия скорее свидетельствует о задержке созревания, чем об ускоренной дифференцировке. В популяциях, связанных с желудочками и сосудистым сплетением, зафиксировано снижение уровня TTR. TTR участвует в связывании и транспорте Aβ; его дефицит может быть связан с нарушением клиренса Aβ, что наблюдается в моделях болезни Альцгеймера. Хотя снижение функции пресенилина часто связывают с подавлением Notch-сигнализации, наши данные показывают лишь умеренное снижение активности этого пути в пролиферирующих предшественниках. Снижение WNT-сигнализации в этих клетках может быть связующим звеном между нарушением сигнальных путей и потерей радиальной глии. Согласно картированию возраста, органоиды соответствуют 5–9 неделям внутриутробного развития (PCW). В этом окне органоиды PSEN1E280A показывают небольшой сдвиг в сторону более «молодых» состояний по сравнению с PSEN1WT.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проведено на органоидах, которые моделируют ранние стадии эмбриогенеза; результаты не следует напрямую экстраполировать на процессы в мозге взрослого человека.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"analiz-nejronalnyh-traektorij-vyyavlyaet-izmeneniya-v-razvitii\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#analiz-nejronalnyh-traektorij-vyyavlyaet-izmeneniya-v-razvitii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ нейрональных траекторий выявляет изменения в развитии&lt;/span&gt;&lt;/a&gt;Анализ нейрональных траекторий выявляет изменения в развитии&lt;/h4&gt;\n&lt;p&gt;Анализ траекторий нейрональной линии позволил сопоставить динамику созревания клеток между генотипами и выявить программы, связанные с нарушением развития. В нашем наборе данных мутация PSEN1E280A коррелировала со сдвигом в сторону более поздних состояний вдоль траектории созревания нейронов. Эти состояния характеризовались повышенной экспрессией генов, отвечающих за дифференцировку нейронов, формирование аксонов и дендритов, а также синаптическую организацию. Полученные результаты согласуются с данными о том, что некоторые мутации при семейной форме болезни Альцгеймера (fAD) могут стимулировать преждевременную дифференцировку нейронов или ускоренный выход из состояния прогениторов. В то же время другие работы сообщают об обратном эффекте — задержке прогениторов и снижении дифференцировки, например, при мутации PSEN1L435F. Эти противоречия указывают на то, что влияние мутаций PSEN1 на развитие нейронов зависит от конкретной мутации, модели и стадии развития.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мутация PSEN1E280A ускоряет продвижение клеток по траектории созревания в органоидах, что проявляется в усилении экспрессии генов дифференцировки и синаптогенеза.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Важно отметить, что наблюдаемый сдвиг отражает относительное ускорение внутри траектории развития органоида, а не достижение клетками полноценной зрелой нейрональной идентичности. В целом, PSEN1E280A нарушает баланс клеточных состояний, затрагивая популяции прогениторов, нейронов, клеток, подобных нервному гребню, и вентрикулярного эпителия. Метод HuDeHA позволил эффективно отделить нейрональные состояния, характерные для гиппокампа, от популяций, специфичных для органоидов, и интерпретировать изменения, связанные с мутацией, в контексте развития человека in vivo.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HuDeHA — метод биоинформатического анализа, позволяющий сопоставлять данные органоидов с эталонными атласами развития мозга человека для уточнения клеточных типов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ogranicheniya\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения&lt;/span&gt;&lt;/a&gt;Ограничения&lt;/h4&gt;\n&lt;p&gt;К ограничениям исследования относится малый объем выборки: набор данных включал лишь два органоида PSEN1WT и шесть органоидов PSEN1E280A из одного опубликованного исследования. Это снижает статистическую мощность и затрудняет разграничение эффектов мутации и естественной вариабельности между органоидами. Кроме того, наблюдаемое увеличение популяций, производных от нервного гребня (NC), может быть следствием особенностей протокола культивирования, а не прямым результатом действия PSEN1E280A.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Выводы основаны на ограниченной выборке (n=8 органоидов), что требует осторожности при интерпретации; наблюдаемые изменения могут зависеть от условий протокола выращивания органоидов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"sbor-dannyh\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#sbor-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сбор данных&lt;/span&gt;&lt;/a&gt;Сбор данных&lt;/h4&gt;\n&lt;p&gt;Атлас HuDeHA охватывает период развития от 3-й недели беременности (PCW3) до 15,3 лет. Данные были разделены на три группы: раннее развитие, пренатальный и постнатальный гиппокамп. В группу раннего развития вошли 476 237 клеток из 70 партий (3 исследования), в пренатальную — 48 679 клеток из 15 партий (3 исследования), в постнатальную — 133 143 клетки из 22 партий (2 исследования). Подробности по каждой партии приведены в Таблице S1.&lt;/p&gt;\n&lt;p&gt;Для ранних стадий, где специфические образцы гиппокампа ограничены, были включены данные по всему телу, голове и ганглионарным возвышениям. Это необходимо, так как ГАМК-ергические интернейроны гиппокампа мигрируют из зон ганглионарных возвышений. После интеграции данные фильтровались по маркерам развития и клеточным линиям для выделения популяций, значимых для переднего мозга и гиппокампа.&lt;/p&gt;\n&lt;h4 id=\"obrabotka-otdelnyh-obuektov\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#obrabotka-otdelnyh-obuektov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обработка отдельных объектов&lt;/span&gt;&lt;/a&gt;Обработка отдельных объектов&lt;/h4&gt;\n&lt;p&gt;Каждый набор данных обрабатывался независимо в пакете Seurat (v4.3.0). Контроль качества (QC) включал фильтрацию: доля митохондриальных генов &amp;lt; 30%, рибосомальных &amp;lt; 40%, количество молекул (nCount_RNA) &amp;gt; 300 и генов (nFeature_RNA) &amp;gt; 400. Верхние пороги определялись индивидуально. Данные нормализовались, отбиралось 3000 вариабельных признаков, проводилось масштабирование с регрессией влияния митохондриальных и рибосомальных генов, а также фаз клеточного цикла (S и G2M).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Регрессия (regress) — статистический метод удаления «шума» из данных, чтобы вариативность, вызванная техническими факторами (например, стрессом клетки или фазой деления), не искажала биологические различия между типами клеток.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для удаления дуплетов (случаев, когда две клетки ошибочно считываются как одна) применялся пакет DoubletFinder (v2.0.3). Ожидаемая доля дуплетов составляла 5% с поправкой на гомотипические дуплеты.&lt;/p&gt;\n&lt;h4 id=\"sborka-promezhutochnyh-atlasov-rannee-razvitie\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#sborka-promezhutochnyh-atlasov-rannee-razvitie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сборка промежуточных атласов: раннее развитие&lt;/span&gt;&lt;/a&gt;Сборка промежуточных атласов: раннее развитие&lt;/h4&gt;\n&lt;p&gt;Для раннего этапа данные разделили на три части: тело/голова (PCW3–8), весь мозг (PCW7–12) и ганглионарные возвышения (PCW7–16).&lt;/p&gt;\n&lt;h4 id=\"telo-i-golova\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#telo-i-golova\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тело и голова&lt;/span&gt;&lt;/a&gt;Тело и голова&lt;/h4&gt;\n&lt;p&gt;Для образцов PCW3–8 проводилась интеграция с последующим отбором клеток мозга. Изначально использовался инструмент MapMyCells, однако для уточнения выборки дополнительно применялись маркеры развития: SOX2, VIM, HES1, HES5, PAX6, NES.&lt;/p&gt;\n&lt;h4 id=\"ves-mozg\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#ves-mozg\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Весь мозг&lt;/span&gt;&lt;/a&gt;Весь мозг&lt;/h4&gt;\n&lt;p&gt;Для данных PCW7–12 после интеграции проводился отбор популяций переднего мозга и гиппокампа на основе экспрессии генов ZBTB20, CALB1, FOXG1, PAX6, LHX5, EMX2, OTX2, NKX2-1.&lt;/p&gt;\n&lt;h4 id=\"ganglioznye-vozvysheniya\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#ganglioznye-vozvysheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ганглиозные возвышения&lt;/span&gt;&lt;/a&gt;Ганглиозные возвышения&lt;/h4&gt;\n&lt;p&gt;Для анализа были объединены все доступные наборы данных по ганглиозным возвышениям (GE) в период с 7 по 16 неделю гестации (PCW). Потенциал дифференцировки каждой клетки оценивался с помощью алгоритма CytoTRACE2 с параметрами по умолчанию. Авторы протестировали метод аннотирования клеток на основе существующих референсных баз, однако из-за низкого соответствия полученных данных известным маркерам и региональной специфике от этого подхода отказались. Для дальнейшего анализа отбирали только клетки, классифицированные как мультипотентные (CytoTRACE2_Potency == \"Multipotent\"), что позволило сфокусироваться на прогениторных популяциях и исключить дифференцированные клетки.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CytoTRACE2 — это вычислительный метод, который оценивает способность клеток к дифференцировке на основе их транскрипционного профиля, позволяя отличить стволовые клетки от уже специализированных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"prenatalnye-i-postnatalnye-stadii\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#prenatalnye-i-postnatalnye-stadii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пренатальные и постнатальные стадии&lt;/span&gt;&lt;/a&gt;Пренатальные и постнатальные стадии&lt;/h4&gt;\n&lt;p&gt;Наборы данных для пренатального и постнатального гиппокампа обрабатывались и интегрировались раздельно. На этапе подготовки из данных удаляли примеси, включая эритроциты, идентифицированные по специфическим маркерам.&lt;/p&gt;\n&lt;h4 id=\"integraciya-hudeha\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#integraciya-hudeha\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интеграция HuDeHA&lt;/span&gt;&lt;/a&gt;Интеграция HuDeHA&lt;/h4&gt;\n&lt;p&gt;После объединения данных раннего развития, пренатальных и постнатальных стадий были выделены подмножества, обогащенные клетками гиппокампа. Итоговый массив данных состоял из 107 партий (batch), которые были интегрированы для создания атласа HuDeHA. Для финальной интеграции использовали модель scVI, обученную на 3000 наиболее вариабельных генах. В процессе настройки гиперпараметров тестировались различные конфигурации: от 128 до 256 скрытых единиц, от 1 до 3 скрытых слоев и от 20 до 40 латентных размерностей. Оптимальной была признана архитектура с тремя скрытыми слоями, 256 единицами и 30 латентными размерностями, выбранная на основе минимальных потерь при валидации. Модель обучалась до 100 эпох с механизмом ранней остановки (patience = 5). Первичная аннотация проводилась по списку маркерных генов, после чего модель scVI была преобразована в scANVI для уточнения и переноса меток на весь набор данных, включая ранее не аннотированные клетки.&lt;/p&gt;\n&lt;h4 id=\"predvaritelnaya-obrabotka-i-filtraciya-dannyh\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#predvaritelnaya-obrabotka-i-filtraciya-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Предварительная обработка и фильтрация данных&lt;/span&gt;&lt;/a&gt;Предварительная обработка и фильтрация данных&lt;/h4&gt;\n&lt;p&gt;Данные были получены из репозитория GEO (GSE241453). Все образцы прошли стандартную процедуру обработки: фильтрацию по содержанию митохондриальных и рибосомальных генов, удаление дублетов, оценку клеточного цикла и масштабирование. Интеграция наборов данных выполнялась с помощью пакета Seurat v.4. После первичной аннотации был выявлен кластер с избытком митохондриальных генов, что указывает на низкое качество или стрессовое состояние клеток. Эти 9359 клеток были исключены, а оставшиеся данные повторно интегрированы с использованием 30 главных компонент (PC). Для уточнения типов клеток применялось вложение scVI (n_layers = 2, n_latent = 20, n_hidden = 128), что позволило скорректировать метки, перенесенные методом scPoli, на основе структуры кластеров и экспрессии канонических маркерных генов (Рис. SN).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;scVI и scPoli — это алгоритмы машинного обучения, которые позволяют снизить размерность данных и перенести аннотации типов клеток с одного набора данных на другой, учитывая скрытые закономерности в экспрессии генов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kartirovanie-tipov-kletok\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#kartirovanie-tipov-kletok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Картирование типов клеток&lt;/span&gt;&lt;/a&gt;Картирование типов клеток&lt;/h4&gt;\n&lt;p&gt;Для переноса аннотаций из референсного атласа в органоиды мозга использовался метод scPoli. Предварительно была проведена гармонизация типов клеток: пролиферирующие клетки-предшественники (IPC и радиальная глия) объединены, нейроны Кахаля-Ретциуса включены в группу зрелых нейронов, а иммунные клетки и микроглия объединены. Модель была ограничена 22 467 общими генами. Параметры обучения scPoli включали 10 измерений вложения, 20 латентных измерений, один скрытый слой (128 узлов) и функцию потерь отрицательного биномиального распределения. Обучение прекращалось при отсутствии улучшения функции потерь на валидационной выборке в течение 20 эпох.&lt;/p&gt;\n&lt;h4 id=\"kartirovanie-vozrasta-razvitiya\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#kartirovanie-vozrasta-razvitiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Картирование возраста развития&lt;/span&gt;&lt;/a&gt;Картирование возраста развития&lt;/h4&gt;\n&lt;p&gt;Для корректного сопоставления возрастов развития редкие временные точки были объединены в интервалы: PCW23–25, 0,1–4,3 года, 6–6,7 года и 13–15,3 года. Поскольку истинный возраст клеток органоидов неизвестен, в анализ включались только предсказания с апостериорной вероятностью не менее 0,75. Прогноз возраста выполнялся с использованием той же архитектуры scPoli, что и при классификации типов клеток.&lt;/p&gt;\n&lt;h4 id=\"kompozicionnyj-analiz\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#kompozicionnyj-analiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Композиционный анализ&lt;/span&gt;&lt;/a&gt;Композиционный анализ&lt;/h4&gt;\n&lt;p&gt;Различия в клеточном составе между органоидами PSEN1E280A (MUT; n = 6) и контрольными (WT; n = 2) оценивались с помощью байесовской модели scCODA. В качестве референсного типа клеток были выбраны зрелые нейроны. Устойчивость результатов проверялась путем повторного анализа с использованием других типов клеток в качестве референса; эффекты для радиальной глии и нейронов, происходящих из нервного гребня, оказались стабильными.&lt;/p&gt;\n&lt;h4 id=\"sravnenie-vozrasta-razvitiya-v-organoidah\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#sravnenie-vozrasta-razvitiya-v-organoidah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сравнение возраста развития в органоидах&lt;/span&gt;&lt;/a&gt;Сравнение возраста развития в органоидах&lt;/h4&gt;\n&lt;p&gt;Для сравнения предсказанного возраста развития между генотипами MUT и WT применялся U-критерий Манна-Уитни для каждого типа клеток. Клеточные типы с выборкой менее 10 клеток исключались из анализа. Значения p корректировались методом Бенджамини-Хохберга (FDR), а размер эффекта оценивался с помощью дельты Клиффа. Пороговое значение скорректированного p &amp;lt; 0,05 считалось статистически значимым.&lt;/p&gt;\n&lt;h4 id=\"differencialnaya-ekspressiya-i-analiz-putej\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#differencialnaya-ekspressiya-i-analiz-putej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дифференциальная экспрессия и анализ путей&lt;/span&gt;&lt;/a&gt;Дифференциальная экспрессия и анализ путей&lt;/h4&gt;\n&lt;p&gt;Дифференциальная экспрессия определялась с помощью теста Вилкоксона (Seurat FindMarkers) при порогах: абсолютное значение log2-кратного изменения ≥ 0,5 и скорректированное p &amp;lt; 0,05. Анализ обогащения путей (ssGSEA) проводился с использованием набора генов MSigDB C5 (сигнальные пути Notch, WNT, дифференцировка нейронов и глии) через пакет escape v.1.10.0. Для сравнения органоидов с данными HuDeHA референсные клетки были ограничены соответствующими возрастными интервалами.&lt;/p&gt;\n&lt;h4 id=\"ocenka-transkripcionnogo-shodstva\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#ocenka-transkripcionnogo-shodstva\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оценка транскрипционного сходства&lt;/span&gt;&lt;/a&gt;Оценка транскрипционного сходства&lt;/h4&gt;\n&lt;p&gt;Для количественного сопоставления транскрипционных профилей HuDeHA и органоидов мозга использовали &lt;a href=\"concepts/koeffitsient-zhakkara.html\"&gt;коэффициент Жаккара&lt;/a&gt;. Дифференциальную экспрессию генов рассчитывали независимо для каждого набора данных через scanpy.tl.rank_genes_groups с применением теста Вилкоксона. Для каждой группы клеток или временной точки отбирали топ-n генов, определяющих специфический маркерный набор. В анализ включали только гены, присутствующие в обоих наборах данных. Коэффициент Жаккара &lt;span class=\"yfm-latex\" data-content=\"J(G_1%2C%20G_2)%20%3D%20%5Cfrac%7B%2FG_1%20%5Ccap%20G_2%2F%7D%7B%2FG_1%20%5Ccup%20G_2%2F%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; рассчитывали для каждой пары «HuDeHA — органоид». Сходство на уровне классов клеток оценивали по средним профилям экспрессии, используя четыре набора признаков: 3000 высоковариабельных генов (HVG) из HuDeHA, 3000 HVG из органоидов, их пересечение (944 гена) и объединение (5056 генов). Для оценки попарного сходства применяли корреляции Пирсона, Спирмена и Кендалла.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Коэффициент Жаккара — это статистическая мера, показывающая степень пересечения двух множеств: чем ближе значение к 1, тем больше общих генов-маркеров в сравниваемых группах клеток.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"analiz-traektorij-razvitiya-kletok\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#analiz-traektorij-razvitiya-kletok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ траекторий развития клеток&lt;/span&gt;&lt;/a&gt;Анализ траекторий развития клеток&lt;/h4&gt;\n&lt;p&gt;Для сравнения нейрональной дифференцировки из обоих наборов данных выделили популяции нейрональной линии: промежуточные клетки-предшественники (IPC), ранние и зрелые нейроны. Чтобы сбалансировать выборки, подмножество HuDeHA было уменьшено (downsampling) до 18 000 клеток, что сопоставимо с 17 296 клетками в органоидах. Построение траекторий выполняли на основе латентного представления scVI для минимизации технических шумов. Граф k-ближайших соседей (k=30) строили с помощью Palantir, вычисляя компоненты диффузии (neigs = 2). Псевдовремя и визуализацию траекторий рассчитывали через scFates с инициализацией ForceAtlas2.&lt;/p&gt;\n&lt;h4 id=\"analiz-potenciala-i-plotnosti-kletok\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#analiz-potenciala-i-plotnosti-kletok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ потенциала и плотности клеток&lt;/span&gt;&lt;/a&gt;Анализ потенциала и плотности клеток&lt;/h4&gt;\n&lt;p&gt;Потенциал клеток в HuDeHA оценивали с помощью CytoTRACE2 (параметры по умолчанию). Плотность состояний клеток определяли через Mellon в латентном пространстве scANVI (20 измерений), получая логарифмическую оценку локальной концентрации клеток. Остальные параметры Mellon соответствовали стандартным настройкам.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-fS1.jpg\" alt=\"Рис. S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-fS1-2.jpg\" alt=\"Рис. S1 (продолжение 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1 (продолжение 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-fS1-3.jpg\" alt=\"Рис. S1 (продолжение 3)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1 (продолжение 3)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-fS1-4.jpg\" alt=\"Рис. S1 (продолжение 4)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1 (продолжение 4)&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;недостаток&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;данных о&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;развитии&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;гиппокампа&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\"
