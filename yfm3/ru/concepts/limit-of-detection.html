            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Метрика&lt;/strong&gt; · &lt;em&gt;Limit of detection&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/limit-of-detection.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Минимальная концентрация ДНК или количество трофозоитов, которые тест способен достоверно выявить в образце.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Определение собрано из статей выпуска автоматически и ждёт проверки редакцией.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"kak-ob-etom-pishut-v-statyah\"&gt;&lt;a href=\"concepts/limit-of-detection.html#kak-ob-etom-pishut-v-statyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как об этом пишут в статьях&lt;/span&gt;&lt;/a&gt;Как об этом пишут в статьях&lt;/h2&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Предел обнаружения (LOD) составил 10 фг/мкл для чистой ДНК, 10 трофозоитов на 100 мкл для необработанных клеток и 1 трофозоит на 100 мкл для клеток после тепловой обработки.&lt;/p&gt;\n&lt;p&gt;— &lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html\"&gt;Новый быстрый тест на опасную амебу Balamuthia mandrillaris&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\"spravka\"&gt;&lt;a href=\"concepts/limit-of-detection.html#spravka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Справка&lt;/span&gt;&lt;/a&gt;Справка&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;LOD_DNA&lt;/td&gt;\n&lt;td&gt;10 фг/мкл&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;LOD_untreated&lt;/td&gt;\n&lt;td&gt;10 трофозоитов на 100 мкл&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;LOD_heat_treated&lt;/td&gt;\n&lt;td&gt;1 трофозоит на 100 мкл&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"drugie-nazvaniya\"&gt;&lt;a href=\"concepts/limit-of-detection.html#drugie-nazvaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Другие названия&lt;/span&gt;&lt;/a&gt;Другие названия&lt;/h2&gt;\n&lt;p&gt;LOD&lt;/p&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/limit-of-detection.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html\"&gt;Новый быстрый тест на опасную амебу Balamuthia mandrillaris&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt; · &lt;a href=\"reference/metrics.html\"&gt;Метрики&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Минимальная концентрация ДНК или количество трофозоитов, которые тест способен достоверно выявить в образце."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Предел обнаружения","description":"Минимальная концентрация ДНК или количество трофозоитов, которые тест способен достоверно выявить в образце.","vcsPath":"concepts/limit-of-detection.md"},"headings":[{"title":"Определение","href":"concepts/limit-of-detection.html#opredelenie","level":2},{"title":"Как об этом пишут в статьях","href":"concepts/limit-of-detection.html#kak-ob-etom-pishut-v-statyah","level":2},{"title":"Справка","href":"concepts/limit-of-detection.html#spravka","level":2},{"title":"
