        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;как устроены нейроны, сети мозга и память&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Нейронаука (нейробиология) — это междисциплинарная область знаний, изучающая устройство, развитие, генетику, биохимию, физиологию и патологии нервной системы. Она исследует, как элементарные биологические структуры порождают восприятие, движения, эмоциональные реакции, память и мышление.&lt;/p&gt;\n&lt;p&gt;В фокусе дисциплины находятся процессы на всех уровнях организации: от отдельных молекул и генов до нейронных ансамблей и целостного поведения организма. Понимание этих механизмов необходимо как для фундаментальной науки, так и для создания методов лечения нейродегенеративных и генетических заболеваний.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Нервная система функционирует на основе специализированных клеток — нейронов и глии. Нейроны обладают возбудимостью и способны генерировать электрические импульсы, передавая информацию через синаптические контакты с помощью химических медиаторов или электрических сигналов.&lt;/p&gt;\n&lt;p&gt;Нейронаука опирается на несколько фундаментальных принципов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Иерархичность: молекулярные взаимодействия определяют работу ионных каналов и синапсов, синапсы формируют микросети, а локальные сети объединяются в глобальные функциональные тракты коры и подкорковых центров.&lt;/li&gt;\n&lt;li&gt;Нейропластичность: способность синаптических связей и нервных контуров перестраиваться под влиянием внешнего опыта, стресса, обучения или повреждений.&lt;/li&gt;\n&lt;li&gt;Интеграция и специализация: разные отделы мозга отвечают за определенные функции, но сложные когнитивные процессы реализуются за счет синхронной работы распределенных сетей.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Нейронаука тесно связана с неврологией, которая сосредоточена на клинической диагностике и лечении болезней нервной системы, а также с науками о поведении и познании животных, изучающими эволюционные аспекты высшей нервной деятельности.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Структурную основу мозга составляют взаимосвязанные функциональные блоки:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Нейроны и синапсы. Клетки принимают входящие сигналы через дендриты, суммируют их в теле клетки и передают потенциал действия по аксону. Синаптическая передача регулируется белками, рецепторами и везикулярным транспортом.&lt;/li&gt;\n&lt;li&gt;Глиальная среда. Астроциты, олигодендроциты и микроглия поддерживают гомеостаз, формируют миелиновые оболочки, участвуют в защите ткани и утилизации клеточных отходов.&lt;/li&gt;\n&lt;li&gt;Сенсорные и эмоциональные контуры. Например, миндалевидное тело оценивает уровень опасности и формирует реакцию страха, а префронтальная кора осуществляет нисходящий контроль и регулирует поведение.&lt;/li&gt;\n&lt;li&gt;Системы памяти и восприятия. Медиальная височная сеть и гиппокамп кодируют визуальные детали, переводят кратковременный опыт в долговременные следы памяти и обеспечивают мысленную реконструкцию образов.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Для изучения нервной системы применяются подходы разного масштаба:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Молекулярно-генетические методы: анализ экспрессии генов, секвенирование РНК и генная терапия с доставкой терапевтических конструкций вирусными векторами.&lt;/li&gt;\n&lt;li&gt;Клеточные модели: культивирование органоидов («мини-мозгов») из индуцированных стволовых клеток пациентов для моделирования нарушений развития.&lt;/li&gt;\n&lt;li&gt;Нейровизуализация и электрофизиология: функциональная МРТ, регистрация электрической активности клеток и оптические методы визуализации нейронных сетей.&lt;/li&gt;\n&lt;li&gt;Вычислительный анализ: применение искусственных нейросетей для декодирования активности мозга и анализа паттернов зрительных воспоминаний.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Методы нейронауки используются в биомедицине, фармакологии, нейропротезировании и когнитивных исследованиях.&lt;/p&gt;\n&lt;p&gt;В прикладных работах ученые раскрывают конкретные механизмы нарушений. В исследовании «Почему при болезни Гоше возникают судороги: ответ скрыт в развитии мозга» выращенные органоиды помогли отследить патогенез на ранних этапах. В статье «Как мозг воспроизводит кадры личных воспоминаний» вычислительные модели помогли описать работу медиальной височной сети. В публикации «Генная терапия остановила развитие редкого синдрома у мышей» воздействие на молекулярном уровне предотвратило дегенерацию нервных клеток.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Несмотря на технологический прогресс, нейронаука сталкивается со значительными сложностями. Модели на животных и клеточные органоиды не воспроизводят в точности всю сложность зрелого человеческого мозга. Компенсаторные реакции иммунных клеток могут маскировать ранние стадии болезней, а каскадные процессы, такие как распространение токсичных белков через везикулы, трудно заблокировать без вреда для здоровых тканей.&lt;/p&gt;\n&lt;p&gt;Кроме того, существует индивидуальная вариативность: структурные особенности связей между зонами коры могут приводить к нетипичным формам восприятия, например неспособности воспроизводить мысленные образы, что требует осторожности при обобщении экспериментальных данных.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Нейронаука&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9C%D0%BE%D0%BB%D0%B5%D0%BA%D1%83%D0%BB%D1%8B%20%D0%B8%20%D0%B3%D0%B5%D0%BD%D1%8B%5D%20--%3E%20B%5B%D0%98%D0%BE%D0%BD%D0%BD%D1%8B%D0%B5%20%D0%BA%D0%B0%D0%BD%D0%B0%D0%BB%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BD%D0%B0%D0%BF%D1%81%D1%8B%5D%0A%20%20B%20--%3E%20C%5B%D0%9D%D0%B5%D0%B9%D1%80%D0%BE%D0%BD%D1%8B%20%D0%B8%20%D0%B3%D0%BB%D0%B8%D0%B0%D0%BB%D1%8C%D0%BD%D1%8B%D0%B5%20%D0%BA%D0%BB%D0%B5%D1%82%D0%BA%D0%B8%5D%0A%20%20C%20--%3E%20D%5B%D0%9B%D0%BE%D0%BA%D0%B0%D0%BB%D1%8C%D0%BD%D1%8B%D0%B5%20%D0%BC%D0%B8%D0%BA%D1%80%D0%BE%D1%81%D0%B5%D1%82%D0%B8%5D%0A%20%20D%20--%3E%20E%5B%D0%A4%D1%83%D0%BD%D0%BA%D1%86%D0%B8%D0%BE%D0%BD%D0%B0%D0%BB%D1%8C%D0%BD%D1%8B%D0%B5%20%D0%BE%D1%82%D0%B4%D0%B5%D0%BB%D1%8B%20%D0%BC%D0%BE%D0%B7%D0%B3%D0%B0%5D%0A%20%20E%20--%3E%20F%5B%D0%9F%D0%BE%D0%B2%D0%B5%D0%B4%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%BA%D0%BE%D0%B3%D0%BD%D0%B8%D1%82%D0%B8%D0%B2%D0%BD%D1%8B%D0%B5%20%D1%84%D1%83%D0%BD%D0%BA%D1%86%D0%B8%D0%B8%20%D0%B8%20%D0%BF%D0%B0%D0%BC%D1%8F%D1%82%D1%8C%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-brain.html\"&gt;Мозг и нервная система&lt;/a&gt; — неврология; нейронаука; поведение и познание животных&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-neurology.html\"&gt;Неврология&lt;/a&gt; — болезни нервной системы: инсульт, эпилепсия, нейродегенерация&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-animal_behavior_and_cognition.html\"&gt;Поведение и познание животных&lt;/a&gt; — обучение, решения и общение у животных&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html\"&gt;Почему при болезни Гоше возникают судороги: ответ скрыт в развитии мозга&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut.html\"&gt;Как мозг воспроизводит кадры личных воспоминаний&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html\"&gt;Как детские стрессы перестраивают мозг и усиливают страх&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html\"&gt;Генная терапия остановила развитие редкого синдрома у мышей&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html\"&gt;Иммунные клетки мозга при болезни Альцгеймера выгорают изнутри&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html\"&gt;Сбой ключевого белка при деменции запускает аномальные кольцевые РНК&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html\"&gt;Как бета-амилоид запускает клеточную цепную реакцию при болезни Альцгеймера&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html\"&gt;Почему мозг людей с афантазией видит иначе?&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html\"&gt;Мозг дописывает реальность задним числом в первичной зрительной коре&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html\"&gt;Как мозг выбирает простые объяснения&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html\"&gt;Как мозг путает знакомое с новым: найден клеточный код памяти&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html\"&gt;Как отдельные нейроны мозга реагируют на правила общения&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html\"&gt;Скрытые кольцевые молекулы РНК выдают опасное нейродегенеративное заболевание&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html\"&gt;Как наш мозг превращает непонятное искусство в удовольствие&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html\"&gt;Как прерывистый сон запускает вспышки эпилепсии в мозге&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html\"&gt;Грипп оставляет след в мозге: как мутация LRRK2 запускает белковые сдвиги&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html\"&gt;Карта развития гиппокампа человека для изучения ранней болезни Альцгеймера&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9D%D0%B5%D0%B9%D1%80%D0%BE%D0%B1%D0%B8%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Нейробиология — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"как устроены нейроны, сети мозга и память"}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Нейронаука","description":"как устроены нейроны, сети мозга и память","vcsPath":"concepts/proc-neuroscience.md"},"headings":[{"title":"Определение","href":"concepts/proc-neuroscience.html#opredelenie","level":2},{"title":"Обзор","href":"concepts/proc-neuroscience.html#obzor","level":2},{"title":"Теория","href":"concepts/proc-neuroscience.html#teoriya","level":2},{"title":"Как это устроено","href":"concepts/proc-neuroscience.html#kak-eto
