        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Специальность&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/spec-cancer.jpg\" alt=\"Рак и онкология\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Иллюстрация: Stevenfruitsmaak, CC BY-SA 4.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Tumor_Mesothelioma2_legend.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/spec-cancer.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;биология рака; гематология; клиническая онкология&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/spec-cancer.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Онкология — это раздел медицины, изучающий природу, механизмы возникновения и методы борьбы с опухолевыми заболеваниями. В основе дисциплины лежит понимание того, как нормальные клетки организма превращаются в патологические, теряя контроль над делением и способностью к гибели. Современная онкология объединяет фундаментальную биологию рака, гематологию и клиническую практику, стремясь не только к уничтожению опухоли, но и к сохранению качества жизни пациента.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/spec-cancer.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Фундамент онкологии строится на изучении генетических и метаболических изменений в клетках. Злокачественная трансформация происходит, когда в клетке накапливаются мутации, отключающие механизмы контроля деления и защиты от апоптоза — запрограммированной клеточной гибели. Ключевые концепции включают нестабильность генома, уклонение от иммунного надзора и способность опухоли перестраивать микроокружение под свои нужды. Гематология дополняет эту картину, изучая злокачественные процессы в системе крови, где опухолевые клетки могут свободно перемещаться по всему организму.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/spec-cancer.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Развитие опухоли — это многоступенчатый процесс. Сначала клетка приобретает способность к бесконтрольному делению. Затем она начинает взаимодействовать с окружающими тканями, например, разрушая сосудистые барьеры для метастазирования или перехватывая ресурсы организма, такие как холестерин, для поддержания своего роста. Иммунная система организма часто «не видит» угрозу, так как опухолевые клетки используют регуляторные Т-клетки для подавления иммунного ответа. Задача современной медицины — «перепрограммировать» эти клетки или лишить опухоль метаболических преимуществ.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/spec-cancer.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Диагностика и терапия сегодня опираются на высокотехнологичные методы. Это анализ метаболитов гормонов для выявления рака щитовидной железы, использование оптической микроскопии в сочетании с искусственным интеллектом для анализа краев хирургической раны, а также таргетная терапия, направленная на специфические уязвимости опухоли. Биоинформатические инструменты, такие как анализ корреляционных сетей и эффективное выравнивание последовательностей ДНК, позволяют ученым находить новые мишени для лекарств в огромных массивах данных.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/spec-cancer.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Методы онкологии находят отражение в передовых исследованиях. Например, в статье «Как оптическая микроскопия и искусственный интеллект помогают предугадать рецидив глиобластомы» описывается алгоритм, анализирующий ткани для предотвращения повторного роста опухоли. Исследование «Бактерия в кишечнике помогает раку толстой кишки метастазировать в печень» показывает роль микробиома в прогрессировании болезни. А работа «Уязвимость неизлечимой опухоли мозга найдена в обмене холестерина» демонстрирует, как воздействие на метаболизм делает резистентные опухоли чувствительными к лечению.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/spec-cancer.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Главная сложность онкологии — гетерогенность опухолей: даже в пределах одного новообразования клетки могут сильно отличаться друг от друга. Это приводит к развитию резистентности к терапии. Кроме того, многие методы диагностики требуют высокой точности, чтобы отличить доброкачественные процессы от злокачественных, а терапевтические вмешательства часто сопровождаются побочными эффектами из-за воздействия на здоровые ткани организма.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Рак и онкология&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%93%D0%B5%D0%BD%D0%B5%D1%82%D0%B8%D0%BA%D0%B0%D0%BB%D1%8B%D2%9B%20%D0%BC%D1%83%D1%82%D0%B0%D1%86%D0%B8%D1%8F%D0%BB%D0%B0%D1%80%5D%20--%3E%20B%5B%D0%91%D0%B0%D2%9B%D1%8B%D0%BB%D0%B0%D1%83%D1%81%D1%8B%D0%B7%20%D0%B1%D3%A9%D0%BB%D1%96%D0%BD%D1%83%5D%0A%20%20B%20--%3E%20C%5B%D0%86%D1%81%D1%96%D0%BA%D1%82%D1%96%D2%A3%20%D3%A9%D1%81%D1%83%D1%96%5D%0A%20%20C%20--%3E%20D%5B%D0%9C%D0%B8%D0%BA%D1%80%D0%BE%D0%BE%D1%80%D1%82%D0%B0%D0%BC%D0%B5%D0%BD%20%D3%A9%D0%B7%D0%B0%D1%80%D0%B0%20%D3%99%D1%80%D0%B5%D0%BA%D0%B5%D1%82%D1%82%D0%B5%D1%81%D1%83%5D%0A%20%20D%20--%3E%20E%5B%D0%9C%D0%B5%D1%82%D0%B0%D1%81%D1%82%D0%B0%D0%B7%D0%B4%D0%B0%D1%80%5D%0A%20%20C%20--%3E%20F%5B%D0%98%D0%BC%D0%BC%D1%83%D0%BD%D0%B4%D1%8B%D2%9B%20%D0%B6%D2%AF%D0%B9%D0%B5%D0%B4%D0%B5%D0%BD%20%D0%B6%D0%B0%D0%BB%D1%82%D0%B0%D1%80%D1%83%5D%0A%20%20F%20--%3E%20G%5B%D0%A2%D0%B0%D1%80%D0%B3%D0%B5%D1%82%D1%82%D1%96%20%D1%82%D0%B5%D1%80%D0%B0%D0%BF%D0%B8%D1%8F%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/spec-cancer.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cancer_biology.html\"&gt;Биология рака&lt;/a&gt; — как клетка становится опухолью и как опухоль уходит от защиты&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-hematology.html\"&gt;Гематология&lt;/a&gt; — кровь и кроветворение, лейкозы и анемии&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-oncology.html\"&gt;Клиническая онкология&lt;/a&gt; — диагностика и лечение рака у пациентов&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/spec-cancer.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/optical-microscopy-predictions-of-focal-recurrence-in-gliobl.html\"&gt;Как оптическая микроскопия и искусственный интеллект помогают предугадать рецидив глиобластомы&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/eggerthella-lenta-disrupts-the-gut-vascular-barrier-to-drive.html\"&gt;Бактерия в кишечнике помогает раку толстой кишки метастазировать в печень&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html\"&gt;Секретное оружие иммунитета: как регуляторные Т-клетки начинают бороться с раком&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/a-serum-thyroid-hormone-metabolite-test-for-molecular-diagno.html\"&gt;Анализ крови вместо биопсии: новый способ выявления рака щитовидной железы&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-25/combination-of-alk2-and-cholesterol-targeting-agents-exploit.html\"&gt;Уязвимость неизлечимой опухоли мозга найдена в обмене холестерина&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/spec-cancer.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9E%D0%BD%D0%BA%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Онкология — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Tumor_Mesothelioma2_legend.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Stevenfruitsmaak, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.cell.2011.02.013\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Hallmarks of cancer: the next generation&lt;/a&gt; — обзор, Cell 2011&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-9-559\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;WGCNA: an R package for weighted correlation network analysis&lt;/a&gt; — обзор, BMC Bioinformatics 2008&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/gb-2009-10-3-r25\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Ultrafast and memory-efficient alignment of short DNA sequences to the human genome&lt;/a&gt; — обзор, Genome Biol 2009&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"биология рака; гематология; клиническая онкология"}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Рак и онкология","description":"биология рака; гематология; клиническая онкология","vcsPath":"concepts/spec-cancer.md"},"headings":[{"title":"Определение","href":"concepts/spec-cancer.html#opredelenie","level":2},{"title":"Обзор","href":"concepts/spec-cancer.html#obzor","level":2},{"title":"Теория","href":"concepts/spec-cancer.html#teoriya","level":2},{"title":"Как это устроено","href":"concepts/spec-cancer.html#kak-eto-ustroeno","level":2},{"title":"Методы и инструменты","href":"concepts/spec-cancer.html#metody-i-instrumenty","level":2},{"title":"Где применяется","href":"concepts/spec-cancer.html#gde-primenyaetsya","level":2},{"title":"Ограничения и подводные камни","href":"concepts/spec-cancer.html#ogranicheniya-i-podvodnye-kamni","level":2},{"title":"Связанные концепции","href":"concepts/spec-cancer.html#svyazannye-koncepcii","level":2},{"title":"Где встречается","href":"concepts/spec-cancer.html#gde-vstrechaetsya","level":2},{"title":"Источники","href":"concepts/spec-cancer.html#istochniki","level":2}],"title":"Рак и онкология"},"router":{"pathname":"concepts/spec-cancer","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
