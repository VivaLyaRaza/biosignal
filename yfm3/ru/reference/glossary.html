ия&lt;/a&gt; — Процесс разделения тканей на отдельные клетки для анализа их индивидуального транскриптома, а фиксация позволяет сохранить РНК-профиль…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/differentiated-thyroid-cancer.html\"&gt;Дифференцированный рак щитовидной железы&lt;/a&gt; — Группа злокачественных опухолей щитовидной железы, составляющая более 95% всех случаев рака этого органа.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/differentsirovka-v-tri-zarodyshevyh-listka.html\"&gt;Дифференцировка в три зародышевых листка&lt;/a&gt; — Стандартный тест на плюрипотентность, подтверждающий, что иПСК способны превращаться в клетки всех типов организма (экто-, мезо- и…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stable-diffusion.html\"&gt;Диффузионная нейросеть&lt;/a&gt; — ИИ-модель класса «текст-в-изображение», используемая для синтеза персонализированных визуальных образов на основе вербальных описаний…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dorsolateral-prefrontal-cortex.html\"&gt;дорсолатеральная префронтальная кора&lt;/a&gt; — Область коры головного мозга, выбранная в качестве основного объекта для создания популяционного атласа транскриптомов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"l\"&gt;&lt;a href=\"reference/glossary.html#l\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Л&lt;/span&gt;&lt;/a&gt;Л&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-radiology_and_imaging.html\"&gt;Лучевая диагностика&lt;/a&gt; — КТ, МРТ, УЗИ и ИИ для снимков&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/lagrangian-coherent-structures.html\"&gt;Лагранжевы когерентные структуры&lt;/a&gt; — Математический метод анализа потоков, позволяющий визуализировать границы переноса массы и разделение потоков крови в сердце.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/lmm.html\"&gt;Линейные смешанные модели&lt;/a&gt; — Линейные смешанные модели (LMM) — это статистический метод для анализа данных с иерархической или зависимой структурой. Он позволяет…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/promoter-trap.html\"&gt;Ловушка промотора&lt;/a&gt; — Метод, при котором репортерный ген активируется только при встраивании в активный ген, что позволяет отбирать клетки с точной интеграцией.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"t\"&gt;&lt;a href=\"reference/glossary.html#t\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Т&lt;/span&gt;&lt;/a&gt;Т&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-toxicology.html\"&gt;Токсикология&lt;/a&gt; — вредные вещества и их действие&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-transplantation.html\"&gt;Трансплантология&lt;/a&gt; — пересадка органов и тканей&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/talamokortikalnaya-sinhronizatsiya.html\"&gt;Таламокортикальная синхронизация&lt;/a&gt; — Согласованная ритмическая активность между таламусом и корой головного мозга, которая особенно сильна в стадии N2 и способствует усилению…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tau-protein.html\"&gt;Тау-белок&lt;/a&gt; — Белок, участвующий в нейродегенерации; в работе используется как маркер патологических изменений в мозге после вирусной инфекции.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/teoriya-ozhidaemoy-poleznosti.html\"&gt;Теория ожидаемой полезности&lt;/a&gt; — Классический экономический подход, где выбор человека определяется суммой полезности возможных исходов, умноженной на их вероятности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/platform-mediated-avoidance.html\"&gt;Тест PMA&lt;/a&gt; — Поведенческий метод, где грызуны учатся спасаться от звукового сигнала, предваряющего удар током, убегая на специальную платформу.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/test-manna.html\"&gt;Тест Манна&lt;/a&gt; — Уитни — это непараметрический статистический метод, используемый для сравнения двух независимых групп без требования о нормальности…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/origin-of-replication.html\"&gt;Точка начала репликации&lt;/a&gt; — Специфическая последовательность ДНК в плазмиде, с которой начинается процесс репликации.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/traktografiya.html\"&gt;Трактография&lt;/a&gt; — Метод анализа данных МРТ, позволяющий визуализировать и оценивать структурную организацию проводящих путей белого вещества мозга.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/traktometriya.html\"&gt;Трактометрия&lt;/a&gt; — Метод анализа микроструктурных свойств белого вещества вдоль всей протяженности проводящих путей мозга, позволяющий точечно выявлять…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/transgennye-myshi.html\"&gt;Трансгенные мыши&lt;/a&gt; — Животные, в геном которых искусственно внедрен чужеродный ген для изучения его функций в организме.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/transkriptomnyy-atlas.html\"&gt;Транскриптомный атлас&lt;/a&gt; — Карта активности всех генов в отдельных клетках, позволяющая понять, какие молекулярные процессы нарушены при болезни.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/transcriptional-convergence.html\"&gt;Транскрипционная конвергенция&lt;/a&gt; — Явление, при котором нарушение различных первичных генов-мишеней ведет к согласованному сбою и схожим изменениям в экспрессии единой…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thrombopoietin.html\"&gt;Тромбопоэтин&lt;/a&gt; — Основной гормон-регулятор, стимулирующий выработку и созревание тромбоцитов в организме.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u\"&gt;&lt;a href=\"reference/glossary.html#u\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;У&lt;/span&gt;&lt;/a&gt;У&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-urology.html\"&gt;Урология&lt;/a&gt; — мочевая система&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ubiquitin.html\"&gt;Убиквитин&lt;/a&gt; — Консервативный белок из 76 аминокислот, регулирующий клеточные процессы путем ковалентного связывания с субстратами или существующий в…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"f\"&gt;&lt;a href=\"reference/glossary.html#f\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ф&lt;/span&gt;&lt;/a&gt;Ф&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pharmacology_and_toxicology.html\"&gt;Фармакология и токсикология&lt;/a&gt; — как действуют лекарства и яды&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pharmacology_and_therapeutics.html\"&gt;Фармакотерапия&lt;/a&gt; — лекарства в клинике&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-physiology.html\"&gt;Физиология&lt;/a&gt; — как работают органы и системы тела&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/faza-n2-sna.html\"&gt;Фаза N2 сна&lt;/a&gt; — Легкая и менее стабильная стадия NREM-сна, характеризующаяся высокой нестабильностью дельта-активности и частыми микропробуждениями CAP…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fazirovanie.html\"&gt;Фазирование&lt;/a&gt; — Процесс определения того, на какой из двух хромосом (от отца или от матери) расположены конкретные аллели, что критически важно для…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/phenol-red.html\"&gt;Феноловый красный&lt;/a&gt; — Химический индикатор, используемый для визуальной детекции результатов амплификации по изменению цвета реакционной смеси.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kih.html\"&gt;Формат Knob-into-Hole&lt;/a&gt; — Метод создания гетеродимерных антител с помощью модификации тяжелых цепей («выступ в ямку»), используемый для разработки биспецифических…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fa.html\"&gt;Фракционная анизотропия&lt;/a&gt; — Показатель направленности диффузии воды по волокнам белого вещества, отражающий целостность и степень миелинизации проводящих путей.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/functional-magnetic-resonance-imaging.html\"&gt;Функциональная магнитно-резонансная томография&lt;/a&gt; — Метод нейровизуализации, используемый для картирования паттернов активности коры головного мозга во время мысленного переживания…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"h\"&gt;&lt;a href=\"reference/glossary.html#h\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Х&lt;/span&gt;&lt;/a&gt;Х&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-surgery.html\"&gt;Хирургия&lt;/a&gt; — операции и их исходы&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"z\"&gt;&lt;a href=\"reference/glossary.html#z\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;З&lt;/span&gt;&lt;/a&gt;З&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-zoology.html\"&gt;Зоология&lt;/a&gt; — животные: строение и образ жизни&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"1\"&gt;&lt;a href=\"reference/glossary.html#1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1&lt;/span&gt;&lt;/a&gt;1&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/17-estradiol.html\"&gt;17β-эстрадиол&lt;/a&gt; — Половой гормон, используемый в работе для модуляции экспрессии генов и коррекции фенотипов нейронной гипервозбудимости при мутациях.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/18s-rrna.html\"&gt;18S рРНК&lt;/a&gt; — Генетическая мишень, используемая в качестве маркера для специфической идентификации амебы B. mandrillaris методом LAMP.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/1d-cnn.html\"&gt;1D-CNN&lt;/a&gt; — Архитектура нейронной сети, используемая для извлечения локальных спектральных признаков и глобальных закономерностей из данных.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"a1\"&gt;&lt;a href=\"reference/glossary.html#a1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;A&lt;/span&gt;&lt;/a&gt;A&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/aav.html\"&gt;AAV&lt;/a&gt; — Вирусный вектор, используемый в работе для доставки здорового гена SIL1 в центральную нервную систему с целью терапии.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ab-initio-rekonstruktsiya.html\"&gt;Ab initio реконструкция&lt;/a&gt; — Метод восстановления 3D-структуры из крио-ЭМ изображений без использования априорной информации об ориентации частиц.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/adam.html\"&gt;Adam&lt;/a&gt; — Адаптивный алгоритм оптимизации, который автоматически подстраивает скорость обучения для каждого параметра, что ускоряет сходимость…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/agrillama.html\"&gt;AgriLLaMA&lt;/a&gt; — Большая языковая модель, преобразующая технические данные анализа в понятные агрономические рекомендации.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ai-infiltration.html\"&gt;AI-infiltration&lt;/a&gt; — Количественный показатель степени инфильтрации опухолевых клеток, вычисляемый моделью FastGlioma на основе анализа биохимического контраста…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/akap11.html\"&gt;AKAP11&lt;/a&gt; — Ген, кодирующий якорный белок протеинкиназы A, который связывает PKA с субстратами и координирует внутриклеточную сигнализацию.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ap-1.html\"&gt;AP-1&lt;/a&gt; — Комплекс транскрипционных факторов, который в данном контексте играет ключевую роль в переключении Treg на цитотоксическую программу под…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/apfc.html\"&gt;aPFC&lt;/a&gt; — Область мозга, отвечающая за высшие когнитивные функции, такие как планирование, саморефлексия и управление вниманием.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/artr-seq.html\"&gt;ARTR-seq&lt;/a&gt; — Метод картирования РНК, связанных с конкретным белком, путем встраивания меченных биотином нуклеотидов непосредственно в процессе обратной…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aso.html\"&gt;ASO&lt;/a&gt; — ASO (антисмысловые олигонуклеотиды) — это короткие синтетические молекулы, которые связываются с РНК, блокируя ее трансляцию, разрушая мРНК…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/atac-seq.html\"&gt;ATAC-seq&lt;/a&gt; — Метод анализа доступности хроматина, позволяющий понять, какие участки генома активны в клетке в данный момент.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/area-under-the-curve.html\"&gt;AUC&lt;/a&gt; — Метрика качества классификатора, показывающая вероятность того, что модель правильно ранжирует случайный положительный объект выше…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/auroc.html\"&gt;auROC&lt;/a&gt; — Метрика качества классификации, показывающая способность модели отличать больных пациентов от здоровых; значение 1.0 означает идеальное…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"b1\"&gt;&lt;a href=\"reference/glossary.html#b1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;B&lt;/span&gt;&lt;/a&gt;B&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/balamuthia-mandrillaris.html\"&gt;Balamuthia mandrillaris&lt;/a&gt; — Свободноживущая амеба, являющаяся возбудителем смертельно опасного баламутичного амебного энцефалита.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bindcraft.html\"&gt;BindCraft&lt;/a&gt; — Ресурсоемкий метод протеинового дизайна, для которого действуют строгие лимиты одновременного запуска, зависящие от накопленных…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bioassay-ontology.html\"&gt;BioAssay Ontology&lt;/a&gt; — Онтология, используемая для стандартизированного описания и классификации протоколов биологических экспериментов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/blastn.html\"&gt;BLASTn&lt;/a&gt; — Алгоритм для поиска локального сходства последовательностей, позволяющий сравнить искомую нуклеотидную последовательность с базой данных.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/blood-oxygen-level-dependent.html\"&gt;BOLD-сигнал&lt;/a&gt; — Показатель изменения уровня оксигенации крови в мозге, отражающий общую активность нейронов в зоне, в то время как анализ паттернов (MVPA)…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/btce.html\"&gt;BTCE&lt;/a&gt; — Искусственные белки, которые одновременно связываются с опухолевой клеткой и иммунной клеткой (Т-лимфоцитом), заставляя иммунитет атаковать…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"c\"&gt;&lt;a href=\"reference/glossary.html#c\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C&lt;/span&gt;&lt;/a&gt;C&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/combined-annotation-dependent-depletion.html\"&gt;CADD&lt;/a&gt; — Метрика, оценивающая патогенность генетических вариантов; значения ≥20 означают, что вариант входит в 1% наиболее вредоносных.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/casrx.html\"&gt;CasRx&lt;/a&gt; — РНК-управляемый фермент, используемый в работе для подавления активности (нокдауна) специфических генов в культуре нейральных прогениторных…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/causalforestdml.html\"&gt;CausalForestDML&lt;/a&gt; — Продвинутый метод машинного обучения, который объединяет случайные леса и причинный вывод, позволяя находить скрытые, нелинейные эффекты…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/chmp5.html\"&gt;Chmp5&lt;/a&gt; — Вспомогательный белок комплекса ESCRT-III, регулирующий формирование везикул и экзосом; его подавление блокирует межклеточное…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/circrna.html\"&gt;circRNA&lt;/a&gt; — Кольцевые молекулы РНК, образующиеся путем обратного сплайсинга, когда 3'-конец интрона соединяется с 5'-концом экзона, что делает их…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ciri2.html\"&gt;CIRI2&lt;/a&gt; — Специализированный биоинформатический инструмент для поиска кольцевых РНК, который использует характерные для них «обратные» сайты…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/centered-log-ratio.html\"&gt;CLR&lt;/a&gt; — Метод нормализации данных композиционного состава, позволяющий устранить зависимость между частями целого при статистическом анализе.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cnbp.html\"&gt;CNBP&lt;/a&gt; — CNBP — это белок, выступающий одним из ключевых игроков в регуляции экспрессии генов, который специфически связывается с богатыми гуанином…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/crispr-cas13a.html\"&gt;CRISPR-Cas13a&lt;/a&gt; — Система редактирования и детекции нуклеиновых кислот, использующая белок Cas13a для распознавания специфических мишеней и активации…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/crispr-cas9.html\"&gt;CRISPR-Cas9&lt;/a&gt; — Метод редактирования генома, используемый в работе для внесения специфических мутаций в геном мышей.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/crispr-crispants.html\"&gt;CRISPR crispants&lt;/a&gt; — Методика временного нокаута у эмбрионов первого поколения без необходимости выведения стабильных линий, а поведенческие «отпечатки»…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/crispr-ko.html\"&gt;CRISPR-KO&lt;/a&gt; — Метод редактирования генома, применяемый в работе для направленного отключения (нокаута) 36 генов риска аутизма и расстройств развития.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/crispr-screening.html\"&gt;CRISPR-скрининг&lt;/a&gt; — CRISPR-скрининг — это метод высокопроизводительного поиска генов, при котором с помощью системы CRISPR/Cas9 поочередно выключают или…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/crispri.html\"&gt;CRISPRi&lt;/a&gt; — Метод подавления экспрессии генов без разрезания ДНК, используемый в работе для создания дефицита белка TDP-43 в клеточной модели нейронов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/crrnk.html\"&gt;crРНК&lt;/a&gt; — Короткая молекула РНК, которая направляет фермент Cas13 к специфической последовательности-мишени для её распознавания и последующего…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/contrast-transfer-function.html\"&gt;CTF&lt;/a&gt; — Математическая функция, описывающая искажения, вносимые электронным микроскопом в изображение, которые необходимо учитывать для…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cytotrace2.html\"&gt;CytoTRACE2&lt;/a&gt; — Показатель, используемый для оценки потенциала развития (дифференцировочного потенциала) клеток в одноклеточных данных.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"d1\"&gt;&lt;a href=\"reference/glossary.html#d1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D&lt;/span&gt;&lt;/a&gt;D&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/disease-associated-microglia.html\"&gt;DAM&lt;/a&gt; — Специфическое состояние микроглии, характеризующееся изменением экспрессии генов для распознавания липидов и фагоцитоза при болезни…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dam-mgnd.html\"&gt;DAM/MGnD&lt;/a&gt; — Специфические профили активности генов микроглии вблизи бляшек, где рецептор TREM2 играет главную дирижерскую роль в переключении клеток на…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dapi.html\"&gt;DAPI&lt;/a&gt; — Флуоресцентный краситель, который проникает в ядро клетки и прочно связывается с ДНК, что позволяет легко обнаружить и подсчитать клеточные…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dcas13.html\"&gt;dCas13&lt;/a&gt; — Каталитически неактивная версия белка Cas13, используемая для стерического блокирования специфических участков РНК.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dcas13-dsrbd.html\"&gt;dCas13-dsRBD&lt;/a&gt; — Модифицированная система CRISPR, где к «немому» ферменту dCas13 добавляют белковый домен dsRBD для более прочного удержания на целевой…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ddpcr.html\"&gt;ddPCR&lt;/a&gt; — Высокоточный метод абсолютного количественного определения молекул ДНК или РНК без использования стандартных кривых.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dpca.html\"&gt;dPCA&lt;/a&gt; — Математический метод, который разделяет общую активность нейронов на отдельные компоненты, отражающие разные переменные задачи, такие как…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dropout.html\"&gt;Dropout&lt;/a&gt; — Метод регуляризации нейросетей, при котором случайная часть нейронов «отключается» во время каждой итерации обучения, что заставляет сеть…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/drought-spec-net.html\"&gt;Drought-Spec-Net&lt;/a&gt; — Нейросеть для раннего обнаружения водного стресса у томатов на основе спектрального анализа.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dsrbd.html\"&gt;dsRBD&lt;/a&gt; — Домен, который добавляется к dCas13 для усиления аффинности комплекса dCas13/gРНК к целевой мРНК.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"e1\"&gt;&lt;a href=\"reference/glossary.html#e1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;E&lt;/span&gt;&lt;/a&gt;E&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/eggerthella-lenta.html\"&gt;Eggerthella lenta&lt;/a&gt; — Кишечная бактерия, которая прикрепляется к эндотелиальным клеткам сосудов и повреждает кишечный сосудистый барьер, способствуя…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/eia-860m.html\"&gt;EIA-860M&lt;/a&gt; — Инструмент инвентаризации энергетических мощностей, используемый для отслеживания графиков вывода угольных электростанций из эксплуатации.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/elastic-net.html\"&gt;Elastic Net&lt;/a&gt; — Гибридный метод регрессии, сочетающий методы LASSO и Ridge, который отбирает важные признаки и борется с их сильной взаимосвязью.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/escrt-iii.html\"&gt;ESCRT-III&lt;/a&gt; — Комплекс белков, управляющий биогенезом интралюминальных везикул и экзосом, играющий ключевую роль в распространении патологических…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"f1\"&gt;&lt;a href=\"reference/glossary.html#f1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;F&lt;/span&gt;&lt;/a&gt;F&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/fluorescence-activated-nuclear-sorting.html\"&gt;FANS&lt;/a&gt; — Метод сортировки клеточных ядер, основанный на их флуоресцентной метке, позволяющий выделить нужные популяции ядер из сложной смеси.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fastglioma.html\"&gt;FastGlioma&lt;/a&gt; — ИИ-модель с открытым исходным кодом, используемая для оценки степени инфильтрации опухолевых клеток и прогнозирования зон рецидива.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fish.html\"&gt;FISH&lt;/a&gt; — FISH (флуоресцентная гибридизация in situ) — это метод визуализации специфических последовательностей ДНК или РНК непосредственно в клетках…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fsi.html\"&gt;Fluid-structure interaction&lt;/a&gt; — Метод компьютерного моделирования, который учитывает взаимное влияние движущейся жидкости (крови) и деформируемых стенок сосудов или…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fnab.html\"&gt;FNAB&lt;/a&gt; — Процедура взятия образца ткани тонкой иглой для цитологического анализа; система Bethesda стандартизирует интерпретацию этих результатов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fold-em.html\"&gt;Fold'EM&lt;/a&gt; — Фреймворк для восстановления атомных структур белков, интегрирующий априорные знания из генеративных моделей непосредственно с…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/funcat.html\"&gt;FUNCAT&lt;/a&gt; — Метод маркировки вновь синтезированных белков в клетках для визуализации и анализа анаболической активности in vivo.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"g1\"&gt;&lt;a href=\"reference/glossary.html#g1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;G&lt;/span&gt;&lt;/a&gt;G&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/glmm.html\"&gt;GLMM&lt;/a&gt; — Мощный статистический аппарат, который позволяет одновременно учитывать фиксированные закономерности для всей группы и индивидуальные…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gmr-gal4.html\"&gt;GMR-GAL4&lt;/a&gt; — Генетическая система, используемая для направленной экспрессии генов в развивающемся глазу Drosophila, позволяющая изучать влияние…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/biological-process.html\"&gt;GO BP&lt;/a&gt; — Классификация генов по биологическим процессам, в которых они участвуют, позволяющая понять функциональную направленность изменений в…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gsea.html\"&gt;GSEA&lt;/a&gt; — GSEA — это метод статистического биоинформатического анализа, позволяющий определить, согласованно ли меняется активность целых групп…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gsk2606414.html\"&gt;GSK2606414&lt;/a&gt; — Селективный ингибитор киназы PERK, блокирующий передачу сигналов стресса ЭР. GVB (gut-vascular barrier) — барьер между кишечником и…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gst-pulldown.html\"&gt;GST-pulldown&lt;/a&gt; — Метод аффинного осаждения, использующий глутатион-трансферазу для выделения белков и их партнеров по взаимодействию из раствора.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gvb.html\"&gt;GVB&lt;/a&gt; — Специализированный эндотелиальный барьер под кишечным эпителием, регулирующий обмен веществ и клеток между просветом кишечника и кровотоком.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gwas.html\"&gt;GWAS&lt;/a&gt; — Метод статистического анализа для выявления связи между генетическими вариантами и конкретными заболеваниями или признаками.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gdnk.html\"&gt;gДНК&lt;/a&gt; — Полный генетический материал организма, который выделяют из клеток для проведения молекулярно-генетического анализа, например, ПЦР или LAMP.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/grnk.html\"&gt;gРНК&lt;/a&gt; — Молекула РНК, которая направляет комплекс CRISPR в нужное место генома или транскрипта.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"h1\"&gt;&lt;a href=\"reference/glossary.html#h1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;H&lt;/span&gt;&lt;/a&gt;H&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/hd-mea.html\"&gt;HD-MEA&lt;/a&gt; — Технология, позволяющая одновременно регистрировать электрическую активность тысяч отдельных нейронов в культуре с высоким пространственным…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/histone-deacetylase-6.html\"&gt;HDAC6&lt;/a&gt; — Гистондеацетилаза 6, содержащая ZnF-домен, который является природным мотивом для связывания несвязанного убиквитина.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hnp1tg.html\"&gt;HNP1TG&lt;/a&gt; — Модельные животные, экспрессирующие человеческий HNP1, используемые для изучения патогенеза MASLD при высокожировой диете.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/htm-carmen.html\"&gt;HTM CARMEN&lt;/a&gt; — Мультиплексная диагностическая платформа на основе CRISPR-Cas13a для одновременного выявления ВИЧ, туберкулеза и малярии, а также анализа…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"i1\"&gt;&lt;a href=\"reference/glossary.html#i1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;I&lt;/span&gt;&lt;/a&gt;I&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/icv-inektsiya.html\"&gt;ICV-инъекция&lt;/a&gt; — Метод введения веществ непосредственно в желудочки головного мозга, позволяющий обойти гематоэнцефалический барьер.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/igluts.html\"&gt;iGLUTs&lt;/a&gt; — Нейроны, полученные из стволовых клеток пациента, которые специализируются на передаче возбуждающих сигналов через глутамат. Нокаут — метод…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ilastik.html\"&gt;ilastik&lt;/a&gt; — Инструмент, применяемый для сегментации RGB-изображений с целью оценки индекса тяжести засухи.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/imid.html\"&gt;IMiD&lt;/a&gt; — Лекарственные средства, которые количественно усиливают и качественно модифицируют цитотоксическую программу перепрограммированных Т-клеток.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/infernal.html\"&gt;INFERNAL&lt;/a&gt; — Биоинформатический метод поиска структурных РНК.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ipsc.html\"&gt;iPSC&lt;/a&gt; — Взрослые клетки организма, «перепрограммированные» в состояние эмбриональных стволовых клеток, способных превращаться в любые ткани…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/itr.html\"&gt;ITR&lt;/a&gt; — Участки ДНК длиной 145 нуклеотидов, способные сворачиваться в Т-образные шпильки; необходимы для упаковки генома вируса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"k1\"&gt;&lt;a href=\"reference/glossary.html#k1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;K&lt;/span&gt;&lt;/a&gt;K&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/k-d.html\"&gt;K_d&lt;/a&gt; — Показатель силы связывания: чем меньше число, тем прочнее связь. RFdiffusion — метод глубокого обучения для дизайна белков с заданной…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kras.html\"&gt;KRAS&lt;/a&gt; — Малая ГТФаза, регулирующая пролиферацию и выживаемость клеток, избыточная активация которой в Т-лимфоцитах индуцирует их преждевременное…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"l1\"&gt;&lt;a href=\"reference/glossary.html#l1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;L&lt;/span&gt;&lt;/a&gt;L&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/lamp.html\"&gt;LAMP&lt;/a&gt; — Метод репликации нуклеиновых кислот, протекающий в изотермических условиях, что позволяет проводить диагностику без сложного оборудования.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/llm.html\"&gt;LLM&lt;/a&gt; — LLM (большие языковые модели) — это алгоритмы глубокого обучения, способные анализировать огромные массивы данных и предсказывать…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/llm-agenty.html\"&gt;LLM-агенты&lt;/a&gt; — Программы на основе больших языковых моделей, способные автономно планировать действия, анализировать промежуточные результаты и принимать…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/loss-of-function.html\"&gt;LOF&lt;/a&gt; — Состояние, при котором белок перестает выполнять свою нормальную биологическую задачу, что часто приводит к сбою в работе всей клеточной…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/lowess.html\"&gt;LOWESS&lt;/a&gt; — Метод сглаживания данных для поиска нелинейных трендов без жестких предварительных математических допущений о форме кривой.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/lubac.html\"&gt;LUBAC&lt;/a&gt; — Белковый комплекс, который «помечает» другие белки (например, NEMO) линейными цепочками убиквитина, запуская каскад воспалительной реакции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"m1\"&gt;&lt;a href=\"reference/glossary.html#m1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M&lt;/span&gt;&lt;/a&gt;M&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/mapping-quality.html\"&gt;MAPQ&lt;/a&gt; — Показатель достоверности того, что считывание было картировано в правильное место генома; значение ≥ 20 означает вероятность ошибки менее…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mash.html\"&gt;MASH&lt;/a&gt; — Воспалительная стадия заболевания печени, развивающаяся на фоне накопления липидов и характеризующаяся повреждением гепатоцитов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mea.html\"&gt;MEA&lt;/a&gt; — Устройства с множеством сенсоров, позволяющие регистрировать электрические сигналы от нейронов в реальном времени, что дает возможность…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/medicare.html\"&gt;Medicare&lt;/a&gt; — Государственная система медицинского страхования в США, данные которой используются для оценки смертности населения от воздействия выбросов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mice.html\"&gt;MICE&lt;/a&gt; — Итеративный метод, который заполняет пропуски, последовательно моделируя каждую переменную на основе других, что точнее простого усреднения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/memory-selective.html\"&gt;MS-клетки&lt;/a&gt; — Нейроны, меняющие частоту разрядов в зависимости от того, является ли стимул новым или уже знакомым, что позволяет им кодировать силу следа…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multiome.html\"&gt;Multiome&lt;/a&gt; — Метод, позволяющий одновременно анализировать транскриптом (активность генов) и доступность хроматина (эпигенетическую регуляцию) в одной и…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"n1\"&gt;&lt;a href=\"reference/glossary.html#n1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;N&lt;/span&gt;&lt;/a&gt;N&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/nanopore-sekvenirovanie.html\"&gt;Nanopore-секвенирование&lt;/a&gt; — Метод чтения длинных фрагментов ДНК, позволяющий выявлять структурные вариации и гетерогенность плазмид на уровне отдельных молекул.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/net1.html\"&gt;NET1&lt;/a&gt; — Целевой транскрипт, транспорт которого нарушается при блокировании взаимодействия с белком CNBP, что снижает подвижность и инвазивность…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/nonsense-mediated-mrna-decay.html\"&gt;NMD&lt;/a&gt; — NMD (nonsense-mediated mRNA decay) — это механизм контроля качества клетки, который уничтожает дефектные молекулы мРНК, содержащие…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/noddi.html\"&gt;NODDI&lt;/a&gt; — Модель, позволяющая разделить вклад плотности нейритов и их ориентационной упорядоченности в сигнал диффузии, что дает более точное…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/no-template-control.html\"&gt;NTC&lt;/a&gt; — Контрольная проба, в которую не добавляют целевую ДНК/РНК, чтобы исключить ложноположительные результаты из-за загрязнения реагентов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"p1\"&gt;&lt;a href=\"reference/glossary.html#p1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;P&lt;/span&gt;&lt;/a&gt;P&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/pbmc.html\"&gt;PBMC&lt;/a&gt; — Фракция крови, включающая лимфоциты и моноциты, которая часто используется в иммунологических исследованиях для оценки ответа организма на…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pca.html\"&gt;PCA&lt;/a&gt; — Статистический метод для снижения размерности данных, позволяющий визуализировать сходство между группами образцов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/perk-terk.html\"&gt;pERK/tERK&lt;/a&gt; — Метод визуализации активности нейронов, где фосфорилированная форма ERK (pERK) служит маркером недавнего притока кальция, отражая…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ppv.html\"&gt;PPV&lt;/a&gt; — Вероятность того, что пациент с положительным результатом теста действительно имеет заболевание (рак щитовидной железы).&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/population-receptive-field.html\"&gt;pRF&lt;/a&gt; — Метод картирования зрительной коры, позволяющий определить, какая область поля зрения активирует конкретный воксель мозга.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/psychad.html\"&gt;PsychAD&lt;/a&gt; — Когорта из 1494 уникальных доноров мозга, используемая для создания атласа транскриптомов при нейродегенеративных и психиатрических…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/protein-truncating-variant.html\"&gt;PTV&lt;/a&gt; — Генетические мутации, приводящие к преждевременному завершению синтеза белка и его усечению.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"q\"&gt;&lt;a href=\"reference/glossary.html#q\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q&lt;/span&gt;&lt;/a&gt;Q&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/q-learning.html\"&gt;Q-learning&lt;/a&gt; — Q-learning — это метод обучения с подкреплением, в котором агент максимизирует ожидаемую награду путем обновления значений Q на основе…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/q-obuchenie.html\"&gt;Q-обучение&lt;/a&gt; — Метод обучения с подкреплением, где агент учится выбирать действия, максимизирующие будущую награду, основываясь на ошибках предсказания…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/qpcr.html\"&gt;qPCR&lt;/a&gt; — Метод амплификации ДНК, позволяющий точно измерить количество копий конкретного гена в образце в режиме реального времени.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"r1\"&gt;&lt;a href=\"reference/glossary.html#r1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;R&lt;/span&gt;&lt;/a&gt;R&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/r-e-x-raspredelenie.html\"&gt;R/E/X распределение&lt;/a&gt; — Метод управления вычислительными ресурсами и задачами искусственного интеллекта, где доли задаются в виде вероятностей или весов для…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/raav.html\"&gt;rAAV&lt;/a&gt; — Вирусные векторы, используемые в генной терапии для доставки генетического материала в клетки.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rano-2-0.html\"&gt;RANO 2.0&lt;/a&gt; — Международные критерии оценки ответа опухолей головного мозга на терапию, основанные на данных МРТ и клиническом состоянии пациента.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rbp.html\"&gt;RBP&lt;/a&gt; — Молекулярные регуляторы, которые присоединяются к молекулам мРНК и управляют их судьбой в клетке от синтеза до распада.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/recall.html\"&gt;Recall&lt;/a&gt; — Метрика, используемая для оценки точности работы языковых моделей при определении формата анализа и метода детекции.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rfdiffusion.html\"&gt;RFdiffusion&lt;/a&gt; — Алгоритм глубокого обучения, используемый в работе для вычислительного дизайна белков с заданными свойствами связывания.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rna-integrity-number.html\"&gt;RIN&lt;/a&gt; — Стандартизированный показатель целостности и качества молекул РНК по шкале от 1 до 10, где высокие значения указывают на отсутствие…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/root-mean-square-deviation.html\"&gt;RMSD&lt;/a&gt; — Метрика для оценки точности структур, вычисляющая среднеквадратичное отклонение между Cα-атомами экспериментальной и предсказанной моделей.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rna-seq.html\"&gt;RNA-seq&lt;/a&gt; — Метод высокопроизводительного секвенирования РНК, позволяющий оценить активность всех генов в клетке одновременно, а GO-анализ помогает…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rnai.html\"&gt;RNAi&lt;/a&gt; — Метод «выключения» или снижения экспрессии конкретного гена, позволяющий изучить его функцию через наблюдение за последствиями его…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rnascope.html\"&gt;RNAscope&lt;/a&gt; — Метод высокочувствительной гибридизации in situ для визуализации экспрессии РНК на уровне отдельных молекул.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rnase-r.html\"&gt;RNase R&lt;/a&gt; — Фермент, который избирательно разрушает линейные молекулы РНК, позволяя концентрировать и анализировать кольцевые РНК в образцах.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/roc-auc.html\"&gt;ROC-AUC&lt;/a&gt; — ROC-AUC — это метрика качества классификации, где значение 0,5 соответствует случайному угадыванию, а 1,0 указывает на идеальное разделение…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/receiver-operating-characteristic.html\"&gt;ROC-анализ&lt;/a&gt; — Статистический метод оценки качества бинарной классификации, где AUC (площадь под кривой) показывает способность нейрона различать два…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/roc-krivaya.html\"&gt;ROC-кривая&lt;/a&gt; — Статистический инструмент для количественной оценки связи между точностью распознавания и уверенностью испытуемого в ответах.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/roi.html\"&gt;ROI&lt;/a&gt; — Выделенный фрагмент изображения, который анализируется отдельно.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/representational-similarity-analysis.html\"&gt;RSA&lt;/a&gt; — Статистический метод, используемый для выявления корреляции между паттернами активности мозга и вычислительными моделями визуальных сцен.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"s1\"&gt;&lt;a href=\"reference/glossary.html#s1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;S&lt;/span&gt;&lt;/a&gt;S&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/senescence-associated-secretory-phenotype.html\"&gt;SASP&lt;/a&gt; — Комплекс факторов (цитокинов, хемокинов, протеаз), которые секретируют стареющие клетки, вызывая воспаление и повреждение окружающих тканей.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scatac-seq.html\"&gt;scATAC-seq&lt;/a&gt; — Метод анализа доступности хроматина на уровне отдельных клеток, позволяющий определить, какие участки генома открыты для регуляции…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sccoda.html\"&gt;scCODA&lt;/a&gt; — Байесовский статистический метод для поиска изменений в пропорциях клеточных типов по данным scRNA-seq.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scpoli.html\"&gt;scPoli&lt;/a&gt; — Метод машинного обучения на основе нейросетей для переноса аннотаций клеточных типов из референсного атласа на новые экспериментальные…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scrna-seq.html\"&gt;scRNA-seq&lt;/a&gt; — scRNA-seq (секвенирование РНК единичных клеток) — метод, позволяющий изучать профиль экспрессии генов каждой отдельной клетки, что дает…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scrnaseq.html\"&gt;scRNAseq&lt;/a&gt; — Метод генетического анализа, позволяющий изучать экспрессию тысяч генов в каждой отдельной клетке, выявляя скрытые подтипы и изменения их…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sequence-hallucination.html\"&gt;Sequence hallucination&lt;/a&gt; — Метод генерации последовательностей белков путем оптимизации их структуры, при котором алгоритм «галлюцинирует» (создает) новые…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/shap-analiz.html\"&gt;SHAP-анализ&lt;/a&gt; — Метод интерпретации моделей машинного обучения, который показывает вклад каждого признака (гена) в конкретный прогноз, позволяя понять…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sherlock.html\"&gt;SHERLOCK&lt;/a&gt; — Метод молекулярной диагностики, использующий фермент Cas13a, который при распознавании специфической РНК-мишени начинает неспецифически…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/snp.html\"&gt;SNP&lt;/a&gt; — Точечные генетические вариации, используемые в работе как маркеры лекарственной устойчивости возбудителя туберкулеза.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/snrna-seq.html\"&gt;snRNA-seq&lt;/a&gt; — snRNA-seq (секвенирование РНК отдельных ядер) — метод анализа экспрессии генов, позволяющий изучать транскриптом каждой клетки по…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/soz.html\"&gt;SOZ&lt;/a&gt; — Область мозга, где генерируются эпилептические припадки, а гиппокамп и амигдала относятся к ключевым структурам височной доли.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spiramed.html\"&gt;SpiraMed&lt;/a&gt; — Инновационная система для доставки лекарств в глубокие структуры мозга через один доступ с помощью гибкого спирального катетера.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spri-selektsiya.html\"&gt;SPRI-селекция&lt;/a&gt; — Метод очистки ДНК с помощью магнитных частиц, позволяющий отбирать фрагменты нужного размера.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sparse-reconstruction-error-alleviation.html\"&gt;SREA&lt;/a&gt; — Специальная архитектура, предназначенная для компенсации погрешностей и минимизации ошибок при выполнении вычислений на мемристорных чипах.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/srh.html\"&gt;SRH&lt;/a&gt; — Метод оптической микроскопии, основанный на нелинейном рассеянии света, позволяющий визуализировать ткани без химического окрашивания.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stat3.html\"&gt;STAT3&lt;/a&gt; — Белок, участвующий в сигнальном пути печени, который регулирует синтез тромбопоэтина в ответ на повреждение миокарда.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/str-profilirovanie.html\"&gt;STR-профилирование&lt;/a&gt; — Метод генетической паспортизации клеток, который позволяет подтвердить их подлинность и исключить перекрестное загрязнение другими линиями.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/structural-units.html\"&gt;SU&lt;/a&gt; — Метрика качества или новизны структурных моделей, используемая для оценки прогресса генерации.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"t1\"&gt;&lt;a href=\"reference/glossary.html#t1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;T&lt;/span&gt;&lt;/a&gt;T&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/target-adaptive-rescue-explore-exploit.html\"&gt;T-REX&lt;/a&gt; — Агентный фреймворк для автоматизированного проектирования белков, который координирует работу генеративных моделей и распределяет…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tcr-repertuar.html\"&gt;TCR-репертуар&lt;/a&gt; — Совокупность всех уникальных Т-клеточных рецепторов в организме, определяющая способность иммунной системы распознавать антигены.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tdp-43.html\"&gt;TDP-43&lt;/a&gt; — РНК-связывающий белок, который в норме регулирует сплайсинг, а при нейродегенерации теряет функцию, что запускает патологический синтез…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thm.html\"&gt;THM&lt;/a&gt; — Вещества, образующиеся в ходе метаболических путей гормонов щитовидной железы, уровни которых в крови используются для диагностики рака.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tm-score.html\"&gt;TM-score&lt;/a&gt; — Метрика глобального структурного сходства, менее чувствительная к локальным отклонениям, чем RMSD, принимающая значения от 0 до 1.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tmt-mass-spektrometriya.html\"&gt;TMT-масс-спектрометрия&lt;/a&gt; — Метод количественного анализа белков, при котором образцы метятся специальными химическими «штрих-кодами», позволяющими точно сравнить…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tregs.html\"&gt;Tregs&lt;/a&gt; — Субпопуляция Т-клеток, экспрессирующая маркер FOXP3, которая в норме подавляет иммунитет, но при терапии BTCE перепрограммируется в…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u1\"&gt;&lt;a href=\"reference/glossary.html#u1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;U&lt;/span&gt;&lt;/a&gt;U&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/ube2l3.html\"&gt;UBE2L3&lt;/a&gt; — Ген, мутации в котором нарушают контроль воспалительной реакции и повышают риск тяжелого течения бактериальных инфекций.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/umi.html\"&gt;UMI&lt;/a&gt; — Короткая последовательность нуклеотидов, которая позволяет пометить каждую исходную молекулу РНК или ДНК перед амплификацией, что помогает…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/unc13a.html\"&gt;UNC13A&lt;/a&gt; — Ген, участвующий в развитии БАС, из которого образуется специфическая кольцевая РНК, используемая как биомаркер эффективности терапии.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"v1\"&gt;&lt;a href=\"reference/glossary.html#v1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;V&lt;/span&gt;&lt;/a&gt;V&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/vae.html\"&gt;VAE&lt;/a&gt; — Нейросеть, которая сжимает сложные данные (например, изображения частиц) в компактное «латентное» пространство, позволяя находить скрытые…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vbit-12.html\"&gt;VBIT-12&lt;/a&gt; — Специфический ингибитор олигомеризации VDAC1, используемый для доказательства того, что именно формирование мультимеров белка вызывает…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vdac1.html\"&gt;VDAC1&lt;/a&gt; — Белок внешней мембраны митохондрий, мультимеризация которого под воздействием HNP приводит к митохондриальной дисфункции и накоплению…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vis-nir.html\"&gt;Vis-NIR&lt;/a&gt; — Диапазон длин волн, используемый для получения спектральных профилей листьев томатов при обучении модели.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vlmc.html\"&gt;VLMC&lt;/a&gt; — Клетки сосудов и мягкой мозговой оболочки, играющие важную роль в поддержании гематоэнцефалического барьера и лимфодренаже мозга.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vp2-capsid-protein.html\"&gt;VP2&lt;/a&gt; — Вирусный белок, отвечающий за формирование пор в эндоцитозных мембранах; мутации в нем обеспечивают устойчивость вируса к действию Plscr1.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vviq.html\"&gt;VVIQ&lt;/a&gt; — Стандартизированная шкала субъективной оценки, где низкие баллы отражают неспособность формировать ментальные картинки (афантазию).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"w\"&gt;&lt;a href=\"reference/glossary.html#w\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;W&lt;/span&gt;&lt;/a&gt;W&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/watershed.html\"&gt;Watershed&lt;/a&gt; — Алгоритм сегментации изображений, который разделяет соприкасающиеся объекты, рассматривая яркость пикселей как топографический рельеф, где…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/wgcna.html\"&gt;WGCNA&lt;/a&gt; — WGCNA — это статистический метод для поиска групп генов с похожими паттернами экспрессии, работающих согласованно. Он помогает выявить…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"z1\"&gt;&lt;a href=\"reference/glossary.html#z1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Z&lt;/span&gt;&lt;/a&gt;Z&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/z-test.html\"&gt;Z-тест&lt;/a&gt; — Статистический метод для проверки гипотез, который позволяет определить, есть ли статистически значимая разница между средними значениями…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zip-code-tabulation-area.html\"&gt;ZCTA&lt;/a&gt; — Статистические зоны, используемые Бюро переписи населения США для агрегирования данных по почтовым индексам.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zenith.html\"&gt;Zenith&lt;/a&gt; — Статистический метод для анализа дифференциальной экспрессии генов на уровне путей, который учитывает корреляцию между образцами, что…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zfx.html\"&gt;ZFX&lt;/a&gt; — Транскрипционный фактор, сцепленный с X-хромосомой, повышенный уровень экспрессии которого у женщин компенсирует генетические мутации…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"zh\"&gt;&lt;a href=\"reference/glossary.html#zh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ж&lt;/span&gt;&lt;/a&gt;Ж&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/zhidkostnaya-hromatografiya-tandemnaya-mass-spektrometriya.html\"&gt;Жидкостная хроматография-тандемная масс-спектрометрия&lt;/a&gt; — Чувствительный и стабильный аналитический метод, используемый в работе для измерения концентрации метаболитов гормонов щитовидной железы в…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"ch\"&gt;&lt;a href=\"reference/glossary.html#ch\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ч&lt;/span&gt;&lt;/a&gt;Ч&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/down-sampling.html\"&gt;Частота дискретизации&lt;/a&gt; — Уменьшение частоты выборки цифрового сигнала для снижения объема данных и ускорения вычислений без потери ключевых частотных характеристик.…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/human-neutrophil-peptides.html\"&gt;Человеческие нейтрофильные пептиды&lt;/a&gt; — Катионные пептиды, высвобождаемые нейтрофилами, которые в условиях метаболической перегрузки действуют как патогенные эффекторы, вызывая…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/black-swans.html\"&gt;Черные лебеди&lt;/a&gt; — Редкие, маловероятные, но разрушительные события, которые животные стремятся избегать ценой мелких потерь.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/substantia-nigra-pars-reticulata.html\"&gt;Черная субстанция ретикулярная&lt;/a&gt; — Черная субстанция ретикулярная (SNr) представляет собой область мозга, активность нейронов которой регистрируется при выполнении задач…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/four-armed-bandit-task.html\"&gt;Четырехрукий бандит&lt;/a&gt; — Экспериментальный поведенческий тест, в котором животные выбирают между четырьмя опциями с различными наградами и наказаниями.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/chislo-reynoldsa.html\"&gt;Число Рейнольдса&lt;/a&gt; — Безразмерная величина, характеризующая режим течения жидкости; в работе используется для оценки гидродинамики в области клапана.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aha-experience.html\"&gt;Чувство «ага»&lt;/a&gt; — Внезапное осознание или инсайт, возникающие при разрешении неоднозначности или понимании скрытого смысла.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"sh\"&gt;&lt;a href=\"reference/glossary.html#sh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ш&lt;/span&gt;&lt;/a&gt;Ш&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/sequential-organ-failure-assessment.html\"&gt;Шкала SOFA&lt;/a&gt; — Клиническая шкала для оценки степени органной дисфункции, используемая для диагностики сепсиса.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"555 концепций"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Глоссарий А–Я","description":"555 концепций","vcsPath":"reference/glossary.md"},"headings":[{"title":"М","href":"reference/glossary.html#m","level":2},{"title":"Н","href":"reference/glossary.html#n","level":2},{"title":"П","href":"reference/glossary.html#p","level":2},{"title":"Р","href":"reference/glossary.html#r","level":2},{"title":"Б","href":"reference/glossary.html#b
