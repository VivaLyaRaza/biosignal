            {"data":{"leading":false,"html":"&lt;p&gt;555 концепций&lt;/p&gt;\n&lt;h2 id=\"m\"&gt;&lt;a href=\"reference/glossary.html#m\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;М&lt;/span&gt;&lt;/a&gt;М&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-brain.html\"&gt;Мозг и нервная система&lt;/a&gt; — неврология; нейронаука; поведение и познание животных&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-addiction_medicine.html\"&gt;Медицина зависимостей&lt;/a&gt; — алкоголь, никотин, опиоиды: механизмы и помощь&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-medicine.html\"&gt;Медицина и здоровье&lt;/a&gt; — акушерство и гинекология; гастроэнтерология; гериатрия; дерматология…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pain_medicine.html\"&gt;Медицина боли&lt;/a&gt; — механизмы и лечение боли&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-immunity.html\"&gt;Микробы и иммунитет&lt;/a&gt; — аллергология; иммунология; микробиология&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-microbiology.html\"&gt;Микробиология&lt;/a&gt; — бактерии, вирусы, грибы и микробиомы&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-health_informatics.html\"&gt;Медицинская информатика&lt;/a&gt; — данные пациентов, ИИ в клинике&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-molecular_biology.html\"&gt;Молекулярная биология&lt;/a&gt; — ДНК, РНК и белки в работе&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mashinnoe-obuchenie.html\"&gt;Машинное обучение&lt;/a&gt; — Метод анализа данных, при котором алгоритмы «обучаются» на примерах, чтобы находить скрытые закономерности и делать прогнозы, а AUC…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/md-simulyatsiya.html\"&gt;МД-симуляция&lt;/a&gt; — Компьютерный метод моделирования физических движений атомов и молекул, позволяющий изучать стабильность и поведение белково-лигандных…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mevalonate-pathway.html\"&gt;Мевалонатный путь&lt;/a&gt; — Метаболический путь синтеза холестерина, ферменты которого (DHCR24, EBP) являются ключевыми мишенями для повышения чувствительности опухоли…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/megakaryocytes.html\"&gt;Мегакариоциты&lt;/a&gt; — Клетки-предшественники тромбоцитов, количество которых в селезенке увеличивается для компенсации дефицита тромбоцитов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/medial-temporal-default-mode-network.html\"&gt;Медиальная височная подсеть дефолт-системы мозга&lt;/a&gt; — Функциональная сеть мозга, включающая парагиппокампальную, ретросплениальную и латеральную париетальную кору, которая избирательно кодирует…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mezhindividualnaya-variabelnost.html\"&gt;Межиндивидуальная вариабельность&lt;/a&gt; — Различия в экспрессии генов между разными людьми, которые могут быть связаны как с генетическими факторами, так и с влиянием окружающей…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ied.html\"&gt;Межприступные эпилептиформные разряды&lt;/a&gt; — Патологические электрические импульсы в мозге, возникающие между приступами эпилепсии, частота которых возрастает при нестабильности сна.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/particulate-matter-pm2-5.html\"&gt;Мелкодисперсные частицы (PM2.5)&lt;/a&gt; — Атмосферные частицы диаметром менее 2,5 мкм, которые при вдыхании проникают в легкие и кровоток, вызывая респираторные и…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/memristornye-vychisleniya-v-pamyati-cim.html\"&gt;Мемристорные вычисления в памяти (CIM&lt;/a&gt; — Computing-in-Memory) — это передовая архитектура, объединяющая хранение и обработку данных в одном физическом устройстве, что позволяет…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/metabolic-dysfunction-associated-steatotic-liver-disease.html\"&gt;Метаболическая дисфункция-ассоциированная стеатотическая болезнь печени&lt;/a&gt; — Хроническое заболевание печени, характеризующееся накоплением липидов, воспалением и митохондриальной дисфункцией.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/metabolomnyy-analiz.html\"&gt;Метаболомный анализ&lt;/a&gt; — Комплексное исследование всех малых молекул (метаболитов) в клетке, позволяющее понять, как препарат меняет ее химические процессы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/metatranskriptomika.html\"&gt;Метатранскриптомика&lt;/a&gt; — Метод масштабного анализа всех молекул РНК, выделенных напрямую из природных образцов, который позволяет находить новые вирусные геномы без…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/metod-ab-initio.html\"&gt;Метод ab initio&lt;/a&gt; — Способ построения структуры «с нуля», без использования априорных шаблонов или известных ориентаций частиц, что требует значительно больших…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/metod-basescope.html\"&gt;Метод BaseScope&lt;/a&gt; — Высокочувствительная разновидность гибридизации in situ, позволяющая визуализировать отдельные молекулы РНК, включая их специфические…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/metod-otsu-threshold.html\"&gt;Метод Otsu threshold&lt;/a&gt; — Алгоритм автоматического выбора порога для разделения данных на два класса (например, «фон» и «объект») путем минимизации внутриклассовой…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/small-volume-computational-clearing.html\"&gt;Метод SVCC&lt;/a&gt; — Алгоритм обработки изображений, который удаляет «дымку» (фоновый свет вне фокуса), позволяя получить четкие снимки глубоких слоев ткани без…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/immersed-boundary-method.html\"&gt;Метод погруженных границ&lt;/a&gt; — Вычислительный метод, используемый в работе для моделирования сложного взаимодействия потока крови с анатомическими структурами клапана.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cyclic-loess.html\"&gt;Метод циклического loess&lt;/a&gt; — Статистический подход для выравнивания распределений данных между образцами, позволяющий устранить систематические технические различия, не…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/metod-chereduyuschegosya-koordinatnogo-spuska.html\"&gt;Метод чередующегося координатного спуска&lt;/a&gt; — Итеративный алгоритм оптимизации, который поочередно улучшает одну группу параметров, фиксируя остальные, что позволяет эффективно решать…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rolling-circle-replication.html\"&gt;Механизм катящегося кольца&lt;/a&gt; — Механизм размножения кольцевых РНК, при котором происходит синтез длинных мультимерных цепей, впоследствии разрезаемых рибозимами.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/microglia.html\"&gt;Микроглия&lt;/a&gt; — Иммунные клетки мозга, выполняющие роль уборщиков, которые при болезни Альцгеймера пытаются очистить нервную ткань от токсичных белков.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/microarousals.html\"&gt;Микропробуждения&lt;/a&gt; — Кратковременные переходы в состоянии сна, вызывающие локальный всплеск аномальной электрической активности мозга.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multichannel-electroencephalography.html\"&gt;Многоканальная электроэнцефалография&lt;/a&gt; — Метод регистрации электрической активности мозга через электроды на коже головы, используемый для оценки речевого развития.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/moi.html\"&gt;Множественность заражения&lt;/a&gt; — Множественность заражения (MOI) — это среднее соотношение количества инфекционных агентов к количеству клеток-мишеней в культуре. Данный…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cox-proportional-hazards-models.html\"&gt;Модели пропорциональных рисков Кокса&lt;/a&gt; — Статистический метод, используемый в работе для оценки частоты сердечно-сосудистых событий и общей смертности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/model-hyads.html\"&gt;Модель HyADS&lt;/a&gt; — Упрощенная атмосферная модель, которая позволяет связать конкретный источник выбросов с уровнем загрязнения в определенной точке…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/limited-bedding-and-nesting.html\"&gt;Модель ограниченного количества подстилочного материала и гнезд&lt;/a&gt; — Экспериментальная модель, имитирующая дефицит ресурсов для мышей в раннем постнатальном периоде для индукции стресса.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fs.html\"&gt;Модель Фера-Шмидта&lt;/a&gt; — Математический подход в поведенческой экономике, который количественно оценивает, насколько человек готов пожертвовать личной выгодой…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/modifitsiruemye-faktory-riska.html\"&gt;Модифицируемые факторы риска&lt;/a&gt; — Параметры образа жизни и здоровья, на которые можно повлиять (давление, вес, вредные привычки), в отличие от генетики и возраста.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/brain-organoids.html\"&gt;Мозговые органоиды&lt;/a&gt; — Лабораторная модель, полученная из индуцированных плюрипотентных стволовых клеток, воспроизводящая ключевые черты раннего развития мозга.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/molekulyarnyy-doking.html\"&gt;Молекулярный докинг&lt;/a&gt; — Молекулярный докинг — это компьютерный метод моделирования, предсказывающий ориентацию молекулы лекарства (лиганда) в активном центре…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multimodal-data.html\"&gt;Мультимодальные данные&lt;/a&gt; — Комплексный подход к сбору данных, включающий одновременную регистрацию ЭЭГ, ЭКГ и движений глаз для отслеживания физиологических…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/woozy-mice.html\"&gt;Мыши линии woozy&lt;/a&gt; — Линия мышей с мутацией в гене Sil1, используемая в качестве модели для воспроизведения симптомов синдрома Маринеско — Шёгрена.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/murine-norovirus.html\"&gt;Мышиный норовирус&lt;/a&gt; — Безоболочечный вирус, вызывающий гастроэнтерит у мышей, репликация которого ограничивается белком Plscr1.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"n\"&gt;&lt;a href=\"reference/glossary.html#n\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Н&lt;/span&gt;&lt;/a&gt;Н&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-neurology.html\"&gt;Неврология&lt;/a&gt; — болезни нервной системы: инсульт, эпилепсия, нейродегенерация&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-neuroscience.html\"&gt;Нейронаука&lt;/a&gt; — как устроены нейроны, сети мозга и память&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-nephrology.html\"&gt;Нефрология&lt;/a&gt; — почки&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/nanoporovoe-sekvenirovanie.html\"&gt;Нанопоровое секвенирование&lt;/a&gt; — Метод считывания длинных одиночных молекул ДНК или РНК в реальном времени при их прохождении через белковые поры в мембране, позволяющий…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/negenomnye-mehanizmy.html\"&gt;Негеномные механизмы&lt;/a&gt; — Быстрые клеточные ответы без прямого взаимодействия гормона с ДНК, часто через мембранные рецепторы и ионные каналы за считанные секунды…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/negenomnye-signalnye-puti.html\"&gt;Негеномные сигнальные пути&lt;/a&gt; — Механизмы передачи сигнала внутри клетки, которые реализуются через быстрые белковые взаимодействия и каскады киназ без прямой активации…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/neural-tracking.html\"&gt;Нейронный трекинг&lt;/a&gt; — Способность мозга синхронизировать свою электрическую активность со слоговым ритмом речи.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/neocortex.html\"&gt;Неокортекс&lt;/a&gt; — Анатомическая область головного мозга, в которой наблюдается наиболее выраженное увеличение эпилептиформных разрядов при микропробуждениях.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ld.html\"&gt;Неравновесное сцепление&lt;/a&gt; — Неслучайная ассоциация аллелей в разных локусах; если варианты находятся в сильном LD, трудно понять, какой из них является истинной…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/knock-in.html\"&gt;Нок-ин&lt;/a&gt; — Генетическая модификация, при которой в геном животного встраивают определенную мутацию, чтобы изучить её влияние на развитие патологий.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/knock-out.html\"&gt;Нокаут&lt;/a&gt; — Нокаут — это генетическая технология «выключения» или удаления конкретного гена в организме. Метод используется для изучения функций гена…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/nokaut-gena.html\"&gt;Нокаут гена&lt;/a&gt; — Метод намеренного отключения определенного гена у лабораторных животных для изучения его функций, а стадии Браака отражают степень…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/nokdaun.html\"&gt;Нокдаун&lt;/a&gt; — Нокдаун — это метод снижения экспрессии конкретного гена с помощью РНК-интерференции или систем CRISPR. Он позволяет оценить функции гена и…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/predicted-aligned-error.html\"&gt;Нормализованный iPAE&lt;/a&gt; — Метрика точности пространственного расположения белковых доменов, где значения ниже установленного среза подтверждают правильность…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/nukleofektsiya.html\"&gt;Нуклеофекция&lt;/a&gt; — Разновидность электропорации, при которой электрические импульсы доставляют ДНК напрямую в ядро клетки, что особенно эффективно для…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"p\"&gt;&lt;a href=\"reference/glossary.html#p\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;П&lt;/span&gt;&lt;/a&gt;П&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-animal_behavior_and_cognition.html\"&gt;Поведение и познание животных&lt;/a&gt; — обучение, решения и общение у животных&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-mind.html\"&gt;Психика и поведение&lt;/a&gt; — медицина зависимостей; психиатрия и клиническая психология&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-psychiatry_and_clinical_psychology.html\"&gt;Психиатрия и клиническая психология&lt;/a&gt; — депрессия, тревога, шизофрения, аутизм и их лечение&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-nutrition.html\"&gt;Питание&lt;/a&gt; — еда, диеты и обмен веществ&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pathology.html\"&gt;Патология&lt;/a&gt; — что меняется в тканях при болезни&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pediatrics.html\"&gt;Педиатрия&lt;/a&gt; — здоровье детей&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-respiratory_medicine.html\"&gt;Пульмонология&lt;/a&gt; — лёгкие и дыхание&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-nature.html\"&gt;Природа, эволюция и экология&lt;/a&gt; — биология растений; зоология; палеонтология; эволюционная биология…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-paleontology.html\"&gt;Палеонтология&lt;/a&gt; — древняя жизнь по окаменелостям и ДНК&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/paradigma.html\"&gt;Парадигма&lt;/a&gt; — Стандартизированная схема проведения эксперимента, задающая условия для проверки конкретной научной гипотезы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/parazitemiya.html\"&gt;Паразитемия&lt;/a&gt; — Процент эритроцитов, зараженных малярийным плазмодием; метод TRIzol позволяет эффективно разделить клеточные компоненты на фазы для…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/periodontitis.html\"&gt;Пародонтит&lt;/a&gt; — Хроническое инфекционно-воспалительное заболевание тканей пародонта, характеризующееся деградацией десны, альвеолярной кости и дентина.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/passazh-kletok.html\"&gt;Пассаж клеток&lt;/a&gt; — Пересев культуры на новую питательную среду для поддержания их роста и предотвращения гибели при перенаселении.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/patternoe-razdelenie.html\"&gt;Паттерное разделение&lt;/a&gt; — Нейронный механизм, позволяющий мозгу кодировать похожие события как уникальные воспоминания, предотвращая их смешивание, в то время как…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/penetrantnost.html\"&gt;Пенетрантность&lt;/a&gt; — Частота проявления мутантного гена в фенотипе; неполная пенетрантность означает, что носительство мутации не всегда приводит к развитию…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/primary-visual-cortex.html\"&gt;первичная зрительная кора&lt;/a&gt; — Область мозга, участвующая в первичном анализе настоящего, прогнозировании будущего и ретроспективной переработке зрительного опыта.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/perekrestnaya-proverka.html\"&gt;Перекрестная проверка&lt;/a&gt; — Метод оценки того, насколько хорошо модель машинного обучения будет работать на новых данных, разделяя выборку на обучающую и тестовую…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/overfitting.html\"&gt;Переобучение&lt;/a&gt; — Явление, при котором модель чрезмерно подстраивается под случайный шум в данных, теряя способность отражать реальные закономерности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/washout-period.html\"&gt;Период «отмывки»&lt;/a&gt; — Временной интервал, в течение которого у пациента не должно быть признаков заболевания или приема лекарств, что позволяет исследователям…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/perfuziya.html\"&gt;Перфузия&lt;/a&gt; — Процесс промывки кровеносной системы лабораторного животного физиологическим раствором для удаления крови перед извлечением тканей.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pattern-perceptual-similarity.html\"&gt;перцептивное сходство паттернов&lt;/a&gt; — Показатель, количественно оценивающий, была ли активность, вызванная иллюзией, более схожей с восприятием объекта или с физическим сигналом…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/piroptoz.html\"&gt;Пироптоз&lt;/a&gt; — Форма программируемой клеточной гибели, сопровождающаяся сильным воспалительным ответом, часто запускаемая инфекционными агентами.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/plasmid.html\"&gt;Плазмида&lt;/a&gt; — Кольцевая молекула ДНК, используемая в качестве вектора для размножения и хранения генетических конструкций в бактериях.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/platformenno-oposredovannoe-izbeganie.html\"&gt;Платформенно-опосредованное избегание&lt;/a&gt; — Поведенческий тест, где животное учится переходить на безопасную платформу в ответ на звуковой сигнал, чтобы избежать неприятного удара…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/polisomnografiya.html\"&gt;Полисомнография&lt;/a&gt; — Комплексное исследование сна, включающее запись активности мозга, мышц и движения глаз для оценки структуры сна.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/whole-genome-sequencing.html\"&gt;Полногеномное секвенирование&lt;/a&gt; — Метод определения полной последовательности ДНК организма, используемый для поиска редких генетических вариантов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/postdiktivnoe-vospriyatie.html\"&gt;Постдиктивное восприятие&lt;/a&gt; — Процесс, при котором мозг интерпретирует сенсорный стимул, основываясь на информации, полученной &lt;em&gt;после&lt;/em&gt; самого стимула, а z-преобразование…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/postdiktsiya.html\"&gt;Постдикция&lt;/a&gt; — Феномен, при котором информация, поступающая с задержкой, изменяет восприятие уже случившегося стимула.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pre-supplementary-motor-area.html\"&gt;Пре-дополнительная моторная зона&lt;/a&gt; — Область мозга, в которой нейронные популяции сигнализируют об итоговом решении испытуемого при выполнении задач на память.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/limit-of-detection.html\"&gt;Предел обнаружения&lt;/a&gt; — Минимальная концентрация ДНК или количество трофозоитов, которые тест способен достоверно выявить в образце.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dml.html\"&gt;Причинно-следственное машинное обучение&lt;/a&gt; — Метод, применяемый для поиска причинно-следственных связей и оценки влияния факторов риска на развитие патологий.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/prichinno-sledstvennyy-mediatsionnyy-analiz.html\"&gt;Причинно-следственный медиационный анализ&lt;/a&gt; — Статистический метод, позволяющий понять, передается ли эффект независимой переменной (например, генетического риска PRS) на зависимую…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/causal-forest.html\"&gt;Причинный лес&lt;/a&gt; — Инструмент для оценки гетерогенных эффектов факторов риска и анализа причинно-следственных связей.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/prolekarstvo.html\"&gt;Пролекарство&lt;/a&gt; — Химически модифицированная форма препарата, которая становится активной только после метаболического превращения в организме, что улучшает…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proliferatsiya.html\"&gt;Пролиферация&lt;/a&gt; — Процесс активного деления и размножения клеток, который.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/prostranstvo-deystviy-v-dannom-kontekste.html\"&gt;Пространство действий в данном контексте&lt;/a&gt; — Набор доступных алгоритмов и их параметров, которыми система управляет для поиска лучших белковых молекул.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/protein-kinase-a.html\"&gt;Протеинкиназа A&lt;/a&gt; — Фермент, участвующий во внутриклеточной сигнализации, активность которого регулируется якорным белком AKAP11.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/protochnaya-tsitometriya.html\"&gt;Проточная цитометрия&lt;/a&gt; — Проточная цитометрия — это метод анализа клеток в потоке жидкости, позволяющий быстро определять физические и химические характеристики…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/psevdovremya.html\"&gt;Псевдовремя&lt;/a&gt; — Вычислительный показатель, который упорядочивает клетки вдоль биологического процесса (например, развития или прогрессирования болезни) на…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pupillometriya.html\"&gt;Пупиллометрия&lt;/a&gt; — Метод измерения диаметра зрачка, который реагирует не только на свет, но и на когнитивную нагрузку, эмоциональное возбуждение и моменты…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pfe.html\"&gt;ПФЕ&lt;/a&gt; — Мера концентрации жизнеспособного вируса.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ptsr.html\"&gt;ПЦР&lt;/a&gt; — Метод амплификации ДНК, где Ct (пороговый цикл) обратно пропорционален количеству исходного генетического материала: чем ниже Ct, тем…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rt-pcr.html\"&gt;ПЦР с обратной транскрипцией&lt;/a&gt; — Метод, позволяющий сначала превратить РНК в комплементарную ДНК (кДНК), а затем многократно скопировать нужный участок для его анализа.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"r\"&gt;&lt;a href=\"reference/glossary.html#r\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Р&lt;/span&gt;&lt;/a&gt;Р&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-cancer.html\"&gt;Рак и онкология&lt;/a&gt; — биология рака; гематология; клиническая онкология&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-rheumatology.html\"&gt;Ревматология&lt;/a&gt; — суставы и аутоиммунные болезни&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/razdelenie-patternov.html\"&gt;Разделение паттернов&lt;/a&gt; — Вычислительный процесс в гиппокампе, позволяющий мозгу различать похожие, но разные стимулы, предотвращая путаницу между новыми и уже…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/early-life-adversity.html\"&gt;Ранний жизненный стресс&lt;/a&gt; — Неблагоприятные условия в раннем возрасте, такие как отсутствие заботы или нестабильная обстановка, повышающие риск развития тревожных…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ras-nn.html\"&gt;РАС/НН&lt;/a&gt; — Группа состояний, вызванных генетическими и средовыми факторами, влияющими на развитие мозга.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gw.html\"&gt;Расстояние Громова-Вассерштейна&lt;/a&gt; — Математический метод, позволяющий сравнивать структуры данных, даже если они находятся в разных «пространствах» (например, гены против…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/autism-spectrum-disorder.html\"&gt;Расстройство аутистического спектра&lt;/a&gt; — Группа нейроразвивающих нарушений, характеризующаяся высокой наследственностью и конвергентными молекулярными сбоями в генных сетях.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ratiometricheskiy-sensor-exrai-akar2.html\"&gt;Ратиометрический сенсор ExRai-AKAR2&lt;/a&gt; — Генетически кодируемый инструмент, который позволяет в реальном времени измерять активность фермента PKA по изменению соотношения…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/upr.html\"&gt;Реакция на нескомпенсированные белки&lt;/a&gt; — Защитный клеточный ответ на накопление бракованных белков в эндоплазматическом ретикулуме, который при хронической активации может…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/single-unit-recording.html\"&gt;Регистрация активности одиночных нейронов&lt;/a&gt; — Метод записи электрических импульсов (спайков) отдельных нервных клеток с помощью микроэлектродов, позволяющий изучать работу мозга на…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/regressiya-koksa.html\"&gt;Регрессия Кокса&lt;/a&gt; — Статистический метод для анализа времени до наступления определенного события (например, смерти или сердечно-сосудистого осложнения)…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/reguliruemaya-sekretsiya.html\"&gt;Регулируемая секреция&lt;/a&gt; — Процесс, при котором клетки запасают секретируемые вещества в специальных гранулах и высвобождают их в ответ на определенные сигналы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/regurgitatsiya.html\"&gt;Регургитация&lt;/a&gt; — Патологический обратный ток крови через клапан сердца, возникающий при его неполном закрытии или анатомических нарушениях.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rare-and-extreme-events.html\"&gt;Редкие и экстремальные события&lt;/a&gt; — События с вероятностью возникновения менее одного процента и отклонением от среднего более чем на десять стандартных отклонений.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/chromatin-remodeling.html\"&gt;Ремоделирование хроматина&lt;/a&gt; — Процесс, управляемый факторами транскрипции AP-1 и BATF, обеспечивающий активацию цитотоксических генов в регуляторных Т-клетках.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/retikulyarnye-trombotsity.html\"&gt;Ретикулярные тромбоциты&lt;/a&gt; — «молодые» формы, недавно вышедшие из костного мозга, их повышенное количество указывает на усиленный тромбопоэз.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/reflux.html\"&gt;Рефлюкс&lt;/a&gt; — Нежелательное движение терапевтического препарата вдоль канала иглы наружу, ограничивающее объем и эффективность доставки.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/amr.html\"&gt;Рецептор Ашвелла-Морелла&lt;/a&gt; — Печеночный рецептор, который связывает десиалированные тромбоциты и активирует сигнальный путь JAK2-STAT3.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hammerhead-ribozymes.html\"&gt;рибозимы типа III «молоток»&lt;/a&gt; — Каталитические участки РНК, способные к саморасщеплению, которые обеспечивают точный разрез промежуточных продуктов репликации.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rnk-immunopretsipitatsiya.html\"&gt;РНК-иммунопреципитация&lt;/a&gt; — Метод изоляции и изучения молекул РНК, связанных с конкретным белком, с помощью антител к этому белку.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"b\"&gt;&lt;a href=\"reference/glossary.html#b\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Б&lt;/span&gt;&lt;/a&gt;Б&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cancer_biology.html\"&gt;Биология рака&lt;/a&gt; — как клетка становится опухолью и как опухоль уходит от защиты&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bioinformatics.html\"&gt;Биоинформатика&lt;/a&gt; — алгоритмы и программы для биологических данных&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-developmental_biology.html\"&gt;Биология развития&lt;/a&gt; — как из клетки вырастает организм&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-biophysics.html\"&gt;Биофизика&lt;/a&gt; — физика молекул и клеток, структуры белков&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-biochemistry.html\"&gt;Биохимия&lt;/a&gt; — ферменты и реакции живого&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-biotech.html\"&gt;Биотехнологии&lt;/a&gt; — биоинженерия; синтетическая биология&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bioengineering.html\"&gt;Биоинженерия&lt;/a&gt; — устройства, материалы и ткани из живого&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-plant_biology.html\"&gt;Биология растений&lt;/a&gt; — рост, защита и урожай растений&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bazovaya-liniya-sravneniya.html\"&gt;Базовая линия сравнения&lt;/a&gt; — Исходный референсный результат или дизайн, относительно которого оценивается улучшение новых кандидатов в ходе планирования.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/basolateral-amygdala.html\"&gt;Базолатеральная миндалина&lt;/a&gt; — Область мозга, входящая в лимбическую систему, активность которой коррелирует с реакциями избегания угроз.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bayesovskiy-vyvod.html\"&gt;Байесовский вывод&lt;/a&gt; — Статистический метод принятия решений, который наказывает избыточно гибкие модели, интегрируя вероятности по всем возможным скрытым…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bayesovskiy-faktor.html\"&gt;Байесовский фактор&lt;/a&gt; — Статистический показатель, позволяющий оценить вероятность того, что данные подтверждают гипотезу об отсутствии различий (эквивалентность)…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/batches.html\"&gt;Батчи&lt;/a&gt; — Отдельные партии экспериментов или секвенирования, которые объединяют с помощью математических алгоритмов, чтобы убрать технические…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/de-novo-proteins.html\"&gt;Белки de novo&lt;/a&gt; — Белковые молекулы с заданными структурами и функциями, создаваемые с нуля с помощью вычислительных методов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/plasmalemma-vesicle-associated-protein-1.html\"&gt;Белок-1, ассоциированный с плазмалеммальными везикулами&lt;/a&gt; — Маркер повреждения кишечного сосудистого барьера, повышенная экспрессия которого указывает на нарушение целостности сосудов и риск…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/beta-amyloid.html\"&gt;бета-амилоид&lt;/a&gt; — Пептид, продукт расщепления предшественника амилоидного белка, накопление которого при болезни Альцгеймера вызывает эндолизосомальные…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/betaviroid-like-rnas.html\"&gt;бетавироидоподобные РНК&lt;/a&gt; — Класс кодирующих кольцевых РНК, характеризующийся наличием рибозима и открытой рамки считывания на каждой цепи полярности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bikukullin.html\"&gt;Бикукуллин&lt;/a&gt; — Антагонист ГАМК-рецепторов, который блокирует тормозное влияние ГАМК-ергических нейронов, позволяя оценить «скрытую» возбудимость…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/biny.html\"&gt;Бины&lt;/a&gt; — Отрезки или интервалы времени, на которые исследователи разбивают непрерывный поток данных для удобства подсчета и построения графиков.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/biological-replicate.html\"&gt;Биологическая повторность&lt;/a&gt; — Независимые образцы, полученные из разных биологических источников (например, разных культур клеток или разных животных), что позволяет…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bicos.html\"&gt;Биспецифические костимуляторы&lt;/a&gt; — Молекулы, обеспечивающие второй сигнал активации Т-клеток через бивалентное связывание с рецептором CD28.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bispecific-t-cell-engagers.html\"&gt;Биспецифические Т-клеточные рекрутеры&lt;/a&gt; — Препараты, стимулирующие рецептор CD3 Т-клеток для их активации и атаки на опухолевые клетки.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/globus-pallidus-internus.html\"&gt;Бледный шар внутренний&lt;/a&gt; — Ядро мозга, прилегающее к черной субстанции, активность которого в данной работе использовалась в качестве контрольной области.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gaucher-disease.html\"&gt;Болезнь Гоше&lt;/a&gt; — Редкое наследственное лизосомное заболевание, вызванное дефицитом фермента глюкоцереброзидазы из-за мутаций в гене GBA1, что ведет к…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/occam-s-razor.html\"&gt;Бритва Оккама&lt;/a&gt; — Принцип, согласно которому при прочих равных условиях следует отдавать предпочтение более простым объяснениям, а не более сложным.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/butstrep.html\"&gt;Бутстрэп&lt;/a&gt; — Метод многократной случайной выборки данных для проверки надежности и стабильности построенной сети.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"g\"&gt;&lt;a href=\"reference/glossary.html#g\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Г&lt;/span&gt;&lt;/a&gt;Г&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-hematology.html\"&gt;Гематология&lt;/a&gt; — кровь и кроветворение, лейкозы и анемии&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-occupational_and_environmental_health.html\"&gt;Гигиена труда и среды&lt;/a&gt; — воздух, вода, химия и работа как факторы здоровья&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-gastroenterology.html\"&gt;Гастроэнтерология&lt;/a&gt; — пищеварение, печень, кишечник&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-geriatric_medicine.html\"&gt;Гериатрия&lt;/a&gt; — старение и болезни пожилых&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-genes.html\"&gt;Гены и геномы&lt;/a&gt; — генетика; геномика; геномная медицина&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-genetics.html\"&gt;Генетика&lt;/a&gt; — наследственность и мутации&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-genomics.html\"&gt;Геномика&lt;/a&gt; — геномы целиком: секвенирование, регуляция, вариации&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-genetic_and_genomic_medicine.html\"&gt;Геномная медицина&lt;/a&gt; — генетика в диагностике и лечении&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/haploinsufficiency.html\"&gt;Гаплонедостаточность&lt;/a&gt; — Состояние, при котором одна функциональная копия гена не обеспечивает достаточного уровня белка для нормального функционирования организма.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gaplotip.html\"&gt;Гаплотип&lt;/a&gt; — Группа генов или аллелей, которые наследуются вместе от одного родителя. Локус MAPT часто изучается в контексте нейродегенерации из-за его…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/garmonizatsiya-dannyh.html\"&gt;Гармонизация данных&lt;/a&gt; — Процесс приведения разнородных показателей из разных источников к единому стандарту для корректного статистического анализа.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/grn.html\"&gt;Генная регуляторная сеть&lt;/a&gt; — Сложная система взаимодействий между ДНК, РНК и белками, которая управляет включением и выключением генов в клетке.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/genno-regulyatornaya-set.html\"&gt;Генно-регуляторная сеть&lt;/a&gt; — Сложная система взаимодействия генов и белков в клетке, определяющая активность генома и развитие патологий.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gibridizatsiya-in-situ.html\"&gt;Гибридизация in situ&lt;/a&gt; — Метод обнаружения специфических последовательностей РНК непосредственно в тканях, позволяющий видеть пространственное распределение…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hybrid-imputation.html\"&gt;Гибридная импутация&lt;/a&gt; — Стратегия обработки пропущенных данных, сочетающая множественное заполнение цепными уравнениями (MICE) и алгоритм случайного леса.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hyperscale-data-centers.html\"&gt;Гипермасштабируемые дата-центры&lt;/a&gt; — Крупные вычислительные центры, обеспечивающие работу облачных вычислений и ИИ-инфраструктуры, чей высокий спрос на энергию вынуждает…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/glioblastoma.html\"&gt;Глиобластома&lt;/a&gt; — Агрессивная астроцитарная опухоль головного мозга высокой степени злокачественности, склонная к неизбежному рецидивированию.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dbs.html\"&gt;Глубокая стимуляция мозга&lt;/a&gt; — Нейрохирургическая процедура по установке электродов, используемая в работе для регистрации активности отдельных нейронов у пациентов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/glucosylsphingosine.html\"&gt;Глюкозилсфингозин&lt;/a&gt; — Потенциально нейротоксичный продукт деацетилирования глюкозилцерамида, уровень которого значительно повышается при болезни Гоше.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dense-core-granules.html\"&gt;гранулы с плотным ядром&lt;/a&gt; — Секреторные органеллы, в которых агрегируют белки; при болезни Альцгеймера их формирование нарушается, что ведет к эндолизосомальным…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"k\"&gt;&lt;a href=\"reference/glossary.html#k\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;К&lt;/span&gt;&lt;/a&gt;К&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-oncology.html\"&gt;Клиническая онкология&lt;/a&gt; — диагностика и лечение рака у пациентов&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cardiovascular_medicine.html\"&gt;Кардиология&lt;/a&gt; — сердце и сосуды&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-clinical_trials.html\"&gt;Клинические испытания&lt;/a&gt; — проверка лечения на людях: дизайн и результаты&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-cells.html\"&gt;Клетки и молекулы&lt;/a&gt; — биология развития; биофизика; биохимия; клеточная биология…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cell_biology.html\"&gt;Клеточная биология&lt;/a&gt; — устройство и жизнь клетки&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kampaniya-po-dizaynu-belkov.html\"&gt;Кампания по дизайну белков&lt;/a&gt; — Многоэтапный итеративный процесс генерации, оптимизации и оценки кандидатов с помощью различных вычислительных алгоритмов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/klassifikator-mininet.html\"&gt;Классификатор MiniNet&lt;/a&gt; — Алгоритм компьютерного зрения на основе сверточной нейросети, который автоматизирует поиск и сегментацию опухолевых очагов по их…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/purkinje-cells.html\"&gt;Клетки Пуркинье&lt;/a&gt; — Тип нейронов мозжечка, которые подвергаются дегенерации при дефиците белка SIL1, что приводит к развитию атаксии.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/koaptatsiya.html\"&gt;Коаптация&lt;/a&gt; — Процесс смыкания створок клапана, обеспечивающий герметичность и предотвращающий обратный ток крови (регургитацию).&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/collateral-activity.html\"&gt;Коллатеральная активность&lt;/a&gt; — Способность фермента Cas13a после связывания с целевой РНК неспецифично расщеплять окружающие молекулы РНК, что используется для генерации…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ced.html\"&gt;Конвекционно-усиленная доставка&lt;/a&gt; — Метод введения препаратов под давлением для равномерного распределения в тканях мозга, который, однако, часто сталкивается с проблемой…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/korrelyatsiya-spirmena.html\"&gt;Корреляция Спирмена&lt;/a&gt; — Непараметрический метод, который оценивает, насколько монотонно связаны две переменные (без предположения о линейности связи), используя их…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/korrespondentsiya.html\"&gt;Корреспонденция&lt;/a&gt; — Официальный канал связи с автором-корреспондентом, который несет ответственность за достоверность данных и коммуникацию с научным…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/corticotropin-releasing-hormone.html\"&gt;Кортикотропин-рилизинг-гормон&lt;/a&gt; — Гормон, экспрессируемый в нейронах мозга, который выступает в роли эффектора, запускающего нейропластичность в ответ на стресс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/koeffitsient-zhakkara.html\"&gt;Коэффициент Жаккара&lt;/a&gt; — Простая метрика совпадения элементов двух множеств, которая делит размер их общего пересечения на размер полного объединения, помогая…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/koeffitsient-kalendarnoy-dostupnosti.html\"&gt;Коэффициент календарной доступности&lt;/a&gt; — Математический метод пропорционального распределения годовых выбросов, позволяющий корректно учесть, что станция работала лишь часть года…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mortality-response-coefficient.html\"&gt;Коэффициент отклика смертности&lt;/a&gt; — Статистическая мера, показывающая, насколько увеличивается риск смерти при повышении концентрации загрязнителя на единицу измерения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/krio-em.html\"&gt;Крио-ЭМ&lt;/a&gt; — Метод визуализации биомолекул, при котором образцы быстро замораживаются, что позволяет изучать их в нативном состоянии.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/krio-em-rekonstruktsiya.html\"&gt;Крио-ЭМ реконструкция&lt;/a&gt; — Процесс превращения тысяч зашумленных 2D-проекций молекул в 3D-модель, где «усреднение» помогает подавить шум, но требует высокой…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cryo-em.html\"&gt;Криоэлектронная микроскопия&lt;/a&gt; — Метод структурной биологии для визуализации макромолекулярных комплексов с высоким разрешением путем усреднения множества зашумленных…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kripticheskiy-splaysing.html\"&gt;Криптический сплайсинг&lt;/a&gt; — Ошибочное включение в зрелую РНК «скрытых» участков (криптических экзонов), которые в норме вырезаются. Это часто приводит к появлению…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cryptic-circrna.html\"&gt;Криптические кольцевые РНК&lt;/a&gt; — Криптические кольцевые РНК — это особый класс стабильных кольцевых молекул, возникающих при дефиците белка TDP-43 и включающих в себя…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ces.html\"&gt;Криптические события&lt;/a&gt; — Аномальные паттерны сплайсинга РНК, которые в норме не возникают, но появляются при нарушении работы белков вроде TDP-43.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kripticheskie-ekzony.html\"&gt;Криптические экзоны&lt;/a&gt; — Участки РНК, которые в норме являются «мусорными» интронами, но начинают считываться как кодирующие части гена при нарушениях механизмов…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"i\"&gt;&lt;a href=\"reference/glossary.html#i\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;И&lt;/span&gt;&lt;/a&gt;И&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-health.html\"&gt;Инфекции и эпидемиология&lt;/a&gt; — вич и спид; гигиена труда и среды; инфекционные болезни; общественное и глобальное здоровье…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-infectious_diseases.html\"&gt;Инфекционные болезни&lt;/a&gt; — вирусы, бактерии и паразиты у людей: течение и лечение&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-intensive_care_and_critical_care_medicine.html\"&gt;Интенсивная терапия&lt;/a&gt; — реанимация, сепсис, ИВЛ&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-immunology.html\"&gt;Иммунология&lt;/a&gt; — как иммунитет распознаёт и уничтожает угрозы&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ultimatum-game.html\"&gt;Игра в ультиматум&lt;/a&gt; — Поведенческая парадигма, в которой участники принимают или отвергают денежные предложения от партнеров, что используется для изучения…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/izogennye-linii.html\"&gt;Изогенные линии&lt;/a&gt; — Клетки с идентичным генетическим фоном, где с помощью редактирования (например, CRISPR/Cas9) исправлена или внесена конкретная мутация, что…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/isoniazid.html\"&gt;Изониазид&lt;/a&gt; — Антибиотик, применяемый для лечения туберкулеза, устойчивость к которому определяется путем выявления мутаций в генах inhA и katG.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/immunostarenie.html\"&gt;Иммуностарение&lt;/a&gt; — Процесс возрастного накопления «уставших» иммунных клеток, которые теряют защитные функции и начинают поддерживать хроническое воспаление.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/imputatsiya.html\"&gt;Импутация&lt;/a&gt; — Импутация — это статистический метод восстановления пропущенных данных в генотипах или медицинских картах на основе известных…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/imputatsiya-dannyh.html\"&gt;Импутация данных&lt;/a&gt; — Статистический метод восстановления или заполнения пропущенных значений в наборах данных, позволяющий использовать всю доступную информацию…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/imunogistohimiya.html\"&gt;Имуногистохимия&lt;/a&gt; — Метод выявления специфических белков в тканях с помощью меченых антител;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/brier-score.html\"&gt;Индекс Brier&lt;/a&gt; — Метрика точности прогнозов вероятности событий, где значения ближе к нулю соответствуют идеальной калибровке модели.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/indeks-dzhini.html\"&gt;Индекс Джини&lt;/a&gt; — Статистический показатель, который в данном контексте количественно описывает степень «неравенства» или клональной экспансии: чем выше…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/indeks-zdorovya-mitohondriy.html\"&gt;Индекс здоровья митохондрий&lt;/a&gt; — Расчетный показатель, позволяющий отличить функционально активные митохондрии от поврежденных или деполяризованных.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/peripheral-distribution-index.html\"&gt;Индекс периферического распределения&lt;/a&gt; — Показатель, используемый для количественной оценки распределения мРНК в клетке, где более высокие значения указывают на периферическое…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/in.html\"&gt;Индуцированные нейроны&lt;/a&gt; — Клетки, полученные путем прямого перепрограммирования стволовых клеток в нейроны с помощью экспрессии специфических факторов транскрипции.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/induced-pluripotent-stem-cells.html\"&gt;Индуцированные плюрипотентные стволовые клетки&lt;/a&gt; — Индуцированные плюрипотентные стволовые клетки (иПСК) — это клетки взрослого организма, перепрограммированные в состояние, подобное…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ins.html\"&gt;ИНС&lt;/a&gt; — Математические модели, обучаемые на данных для решения задач; в данном контексте они сравниваются с человеческим мышлением.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/il-1beta.html\"&gt;Интерлейкин-1 бета&lt;/a&gt; — Провоспалительный цитокин, утилизация которого нарушается при дефектах гена UBE2L3, что ведет к неконтролируемому воспалению.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/informatsionnaya-konnektivnost.html\"&gt;Информационная коннективность&lt;/a&gt; — Метод анализа фМРТ, который позволяет оценить, как информация и паттерны активности передаются и согласованно изменяются между различными…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/informatsionnaya-svyaznost.html\"&gt;Информационная связность&lt;/a&gt; — Метод анализа фМРТ-данных, который позволяет оценить, насколько паттерны активности в разных областях мозга статистически связаны между…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ipsk.html\"&gt;ИПСК&lt;/a&gt; — Стволовые клетки, полученные из взрослых клеток организма путем их «перепрограммирования» в состояние, близкое к эмбриональному, что…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/contrived-samples.html\"&gt;Искусственно зараженные образцы&lt;/a&gt; — Биологические пробы, в которые экспериментаторы добавляют известное количество генетического материала патогена для проверки точности теста.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/elisa.html\"&gt;ИФА&lt;/a&gt; — Лабораторный метод количественного определения белков или других молекул с помощью антител, а двухфакторный ANOVA оценивает влияние двух…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ischemia-and-reperfusion.html\"&gt;Ишемия и реперфузия&lt;/a&gt; — Экспериментальная модель повреждения миокарда, используемая для изучения динамики тромбоцитов после инфаркта.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"v\"&gt;&lt;a href=\"reference/glossary.html#v\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;В&lt;/span&gt;&lt;/a&gt;В&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-hiv_aids.html\"&gt;ВИЧ и СПИД&lt;/a&gt; — профилактика, терапия и поиск излечения&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-compute.html\"&gt;Вычисления и ИИ в биологии&lt;/a&gt; — биоинформатика; медицинская информатика; системная биология&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/validatsiya-kandidatov.html\"&gt;Валидация кандидатов&lt;/a&gt; — Процедура автоматической проверки корректности параметров сгенерированных задач перед их допуском к вычислительным экспериментам.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vektor-aav-php-eb.html\"&gt;Вектор AAV-PHP.eB&lt;/a&gt; — Искусственно созданный вирусный транспортный агент, способный эффективно доставлять терапевтический генетический материал в ткани…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vektor-pbr322.html\"&gt;Вектор pBR322&lt;/a&gt; — Классическая плазмида, используемая в молекулярном клонировании, которая содержит гены устойчивости к антибиотикам, позволяющие отбирать…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rsv.html\"&gt;Векторы остаточных сингулярных значений&lt;/a&gt; — Векторы, которые получаются после извлечения главных компонент на каждом шаге дефляции и требуют повышенной точности вычислений.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vengerskiy-algoritm.html\"&gt;Венгерский алгоритм&lt;/a&gt; — Метод оптимизации, используемый здесь для сопоставления меток классов между разными запусками алгоритма, чтобы они соответствовали друг…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/superior-temporal-cortex.html\"&gt;верхняя височная кора&lt;/a&gt; — Мультисенсорная область мозга, выступающая источником нисходящей обратной связи для первичной зрительной коры.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vestern-blotting.html\"&gt;Вестерн-блоттинг&lt;/a&gt; — Вестерн-блоттинг (иммуноблоттинг) — это метод лабораторного анализа, который позволяет разделить белки по их размеру с помощью…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/viroid-like-rnas.html\"&gt;вироидоподобные РНК&lt;/a&gt; — Инфекционные агенты с одноцепочечным кольцевым РНК-геномом, которые часто реплицируются по механизму катящегося кольца и могут содержать…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/virtualnyy-nokaut.html\"&gt;Виртуальный нокаут&lt;/a&gt; — Метод компьютерного моделирования, позволяющий предсказать последствия «выключения» функции конкретного гена на основе анализа…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/in-silico-gene-perturbation.html\"&gt;Виртуальный нокаут генов&lt;/a&gt; — Вычислительный метод, используемый для моделирования регуляторной сети клеток и оценки последствий подавления конкретного гена (KRAS) на…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/influenza-a-virus-h1n1.html\"&gt;Вирус гриппа А серотипа H1N1&lt;/a&gt; — Пневмотропный РНК-вирус, используемый в работе для индукции респираторной инфекции и изучения её влияния на протеом мозга.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vnutricherepnaya-registratsiya.html\"&gt;Внутричерепная регистрация&lt;/a&gt; — Метод прямой записи электрической активности мозга с помощью электродов, имплантированных в ткани мозга в медицинских целях.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vosstanovlenie-parametrov.html\"&gt;Восстановление параметров&lt;/a&gt; — Валидационный тест, в котором искусственно генерируют данные с известными параметрами, чтобы проверить, сможет ли алгоритм моделирования…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vybor-modeley.html\"&gt;Выбор моделей&lt;/a&gt; — Статистический подход к поиску баланса между точностью подгонки модели под данные и её простотой, позволяющий избежать избыточного…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/evoked-potentials.html\"&gt;Вызванные потенциалы&lt;/a&gt; — Вызванные потенциалы (ВП) — это электрическая активность мозга в ответ на стимулы, измеряемая с помощью ЭЭГ. Их амплитуда может отражать…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vyravnivanie-kabsha.html\"&gt;Выравнивание Кабша&lt;/a&gt; — Стандартный математический метод суперпозиции двух наборов атомов для минимизации среднеквадратичного отклонения, а евклидово расстояние…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vychislenie-v-pamyati.html\"&gt;Вычисление в памяти&lt;/a&gt; — Передовой подход, при котором обработка данных происходит непосредственно внутри ячеек памяти, что устраняет узкое место фон Неймана…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"o\"&gt;&lt;a href=\"reference/glossary.html#o\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;О&lt;/span&gt;&lt;/a&gt;О&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-public_and_global_health.html\"&gt;Общественное и глобальное здоровье&lt;/a&gt; — здоровье популяций, системы здравоохранения&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-ophthalmology.html\"&gt;Офтальмология&lt;/a&gt; — глаза и зрение&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/obratnaya-diffuziya.html\"&gt;Обратная диффузия&lt;/a&gt; — Процесс постепенного удаления шума из случайного распределения для получения высококачественного изображения или структуры, направляемый.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/feedback.html\"&gt;обратная связь&lt;/a&gt; — Механизм передачи сигналов из вышестоящих мультисенсорных зон в первичную сенсорную кору, позволяющий модулировать ранние сигналы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/back-splicing.html\"&gt;Обратный сплайсинг&lt;/a&gt; — Обратный сплайсинг (back-splicing) — это процесс соединения 3'-конца экзона с 5'-концом того же или вышележащего экзона, приводящий к…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/truncus-arteriosus.html\"&gt;Общий артериальный ствол&lt;/a&gt; — Тяжелый врожденный порок сердца, при котором магистральные сосуды не разделяются, формируя единый сосуд с общим клапаном.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/shared-transcriptomic-vulnerability.html\"&gt;общая транскриптомная уязвимость&lt;/a&gt; — Перекрывающиеся паттерны изменений экспрессии генов при различных заболеваниях, указывающие на общие патогенные механизмы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/single-cell-rna-sequencing.html\"&gt;Одномолекулярное секвенирование РНК&lt;/a&gt; — Одномолекулярное секвенирование РНК (scRNA-seq) — это передовой метод анализа активности генов в каждой отдельной клетке, позволяющий…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/optogenetika.html\"&gt;Оптогенетика&lt;/a&gt; — Метод регуляции активности нейронов с помощью света, использующий светочувствительные белки (опсины), внедренные в определенные нейронные…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/optogenetic-inhibition.html\"&gt;Оптогенетическое подавление&lt;/a&gt; — Метод управления активностью нейронов с помощью света, используемый в работе для устранения последствий стресса.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/forebrain-organoids.html\"&gt;Органоиды переднего мозга&lt;/a&gt; — Трехмерные модели тканей мозга, выращенные из иПСК, используемые для имитации развития болезни и изучения нейронных сетей.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ortotopicheskaya-implantatsiya.html\"&gt;Ортотопическая имплантация&lt;/a&gt; — Введение опухолевых клеток непосредственно в тот орган, где в норме развивается данная опухоль, что обеспечивает наиболее достоверные…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/otritsatelnaya-binomialnaya-glmm.html\"&gt;Отрицательная биномиальная GLMM&lt;/a&gt; — Статистический метод для анализа данных о частоте событий (например, количества разрядов), когда разброс значений превышает среднее.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/npe.html\"&gt;Ошибки предсказания норм&lt;/a&gt; — Метрика, отражающая разницу между ожидаемой справедливостью предложения и реальным предложением партнера в ходе социального взаимодействия.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"s\"&gt;&lt;a href=\"reference/glossary.html#s\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;С&lt;/span&gt;&lt;/a&gt;С&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-sexual_and_reproductive_health.html\"&gt;Сексуальное и репродуктивное здоровье&lt;/a&gt; — фертильность, контрацепция, беременность&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-systems_biology.html\"&gt;Системная биология&lt;/a&gt; — клетка и организм как сеть взаимодействий&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-synthetic_biology.html\"&gt;Синтетическая биология&lt;/a&gt; — проектирование генетических схем и организмов&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/samorasscheplyayuschiesya-ribozimy.html\"&gt;Саморасщепляющиеся рибозимы&lt;/a&gt; — Функциональные молекулы РНК, способные катализировать разрыв собственной фосфодиэфирной связи без участия белков, а различные классы…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/type-2-diabetes.html\"&gt;Сахарный диабет 2 типа&lt;/a&gt; — Метаболическое расстройство, характеризующееся инсулинорезистентностью и стойкой гипергликемией.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vgg-16.html\"&gt;Сверточная нейросеть VGG-16&lt;/a&gt; — Инструмент компьютерного зрения, применяемый для извлечения 1000-мерных векторов активации из синтезированных изображений для построения…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/7t-fmri.html\"&gt;сверхвысокопольное 7Т МРТ&lt;/a&gt; — Инструмент нейровизуализации с высоким разрешением вокселей, позволяющий изолировать активность отдельных слоев коры.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/oxford-nanopore-sequencing.html\"&gt;Секвенирование Oxford Nanopore&lt;/a&gt; — Метод анализа нуклеотидных последовательностей ДНК, используемый в работе для оценки стабильности ITR.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ngs.html\"&gt;Секвенирование нового поколения&lt;/a&gt; — Метод высокопроизводительного массового параллельного секвенирования, который позволяет параллельно проанализировать миллионы…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sekvenirovanie-po-sengeru.html\"&gt;Секвенирование по Сэнгеру&lt;/a&gt; — Секвенирование по Сэнгеру — это «золотой стандарт» определения нуклеотидной последовательности ДНК, основанный на использовании…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/familial-alzheimer-s-disease.html\"&gt;Семейная форма болезни Альцгеймера&lt;/a&gt; — Ранняя форма болезни Альцгеймера, вызванная аутосомно-доминантными мутациями в генах APP, PSEN1 или PSEN2.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sepsis.html\"&gt;Сепсис&lt;/a&gt; — Жизнеугрожающая дисфункция органов, возникающая вследствие неадекватного ответа организма на инфекцию.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/major-adverse-cardiovascular-events.html\"&gt;Серьезные нежелательные сердечно-сосудистые события&lt;/a&gt; — Комбинированный показатель, включающий острый инфаркт миокарда, инсульт или смерть от сердечно-сосудистых причин.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/singlet.html\"&gt;Синглет&lt;/a&gt; — Отдельная клетка, содержащая одну направляющую РНК, что критически важно для точности CRISPR-скрининга, так как дуплеты могут искажать…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/svd.html\"&gt;Сингулярное разложение&lt;/a&gt; — Универсальный математический метод линейной алгебры, используемый для анализа больших массивов данных путем разложения матрицы на…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/attention-deficit-hyperactivity-disorder.html\"&gt;Синдром дефицита внимания и гиперактивности&lt;/a&gt; — Нейроразвивающееся состояние, характеризующееся стойкой невнимательностью, гиперактивностью и импульсивностью, нарушающими повседневное…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/marinesco-sjogren-syndrome.html\"&gt;Синдром Маринеско — Шёгрена&lt;/a&gt; — Редкое наследственное заболевание, характеризующееся мозжечковой атаксией, миопатией и дегенерацией нейронов из-за мутаций в гене SIL1.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sindromika.html\"&gt;Синдромика&lt;/a&gt; — Совокупность клинических признаков, характерных для нескольких заболеваний, что часто затрудняет дифференциальную диагностику при…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bethesda-system.html\"&gt;Система Bethesda&lt;/a&gt; — Классификация цитологических результатов тонкоигольной аспирационной биопсии, используемая для оценки риска злокачественности узлов…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/systemic-juvenile-idiopathic-arthritis.html\"&gt;Системный ювенильный идиопатический артрит&lt;/a&gt; — Редкое аутоиммунное заболевание у детей, проявляющееся системным воспалением, лихорадкой и кожными высыпаниями.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/skrining-crispr-cas9.html\"&gt;Скрининг CRISPR/Cas9&lt;/a&gt; — Метод массового редактирования генома, позволяющий «выключать» тысячи различных генов одновременно, чтобы проверить, потеря каких из них…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/skrining-crispr-s-kombinatsiyami-preparatov.html\"&gt;Скрининг CRISPR с комбинациями препаратов&lt;/a&gt; — Метод одновременного отключения множества генов в сочетании с лекарственной терапией для поиска уязвимостей опухоли.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/random-forest.html\"&gt;Случайный лес&lt;/a&gt; — Алгоритм машинного обучения, используемый для классификации рисков и гибридной импутации пропущенных данных.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/confounding-by-indication.html\"&gt;Смешивание по показаниям&lt;/a&gt; — Ситуация, когда наличие заболевания является причиной назначения препарата, и именно это заболевание (а не сам препарат) влияет на…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sobytie-svyazannye-potentsialy.html\"&gt;Событие-связанные потенциалы&lt;/a&gt; — Изменения электрической активности мозга, зафиксированные с помощью ЭЭГ в ответ на конкретный стимул, отражающие этапы обработки информации.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sovmestnoe-kultivirovanie.html\"&gt;Совместное культивирование&lt;/a&gt; — Метод выращивания двух или более типов клеток в одной среде для наблюдения за их прямым взаимодействием и влиянием друг на друга.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spike-sorting.html\"&gt;Сортировка спайков&lt;/a&gt; — Компьютерный метод разделения электрических сигналов от разных нейронов, записанных одним микроэлектродом, по их уникальной форме волны.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stadii-braaka.html\"&gt;Стадии Браака&lt;/a&gt; — Стадии Браака — это система оценки прогрессирования нейродегенерации при болезни Альцгеймера, основанная на анатомическом распространении…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/statisticheskaya-moschnost.html\"&gt;Статистическая мощность&lt;/a&gt; — Вероятность того, что исследование обнаружит реальный эффект, если он существует; чем выше мощность, тем меньше риск пропустить значимые…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/statistical-learning.html\"&gt;Статистическое обучение&lt;/a&gt; — Когнитивный процесс вычленения слов из потока речи на основе вероятности появления слогов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/power-iteration-deflation.html\"&gt;Степенной метод с дефляцией&lt;/a&gt; — Итеративный алгоритм линейной алгебры для эффективного нахождения собственных векторов и сингулярных разложений матриц без полного их…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stereotaksis.html\"&gt;Стереотаксис&lt;/a&gt; — Метод нейрохирургии, позволяющий с высокой точностью вводить инструменты в глубокие структуры мозга по заданным координатам.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stereotactic-injection.html\"&gt;Стереотаксическая инъекция&lt;/a&gt; — Хирургический метод точного наведения инструментов в заданную точку мозга, использующий иглы для локальной доставки препаратов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stereoelektroentsefalografiya.html\"&gt;Стереоэлектроэнцефалография&lt;/a&gt; — Метод инвазивной регистрации электрической активности глубоких структур мозга с высоким пространственно-временным разрешением.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stohasticheskoe-dominirovanie.html\"&gt;Стохастическое доминирование&lt;/a&gt; — Ситуация, когда одна стратегия объективно выгоднее другой при любых условиях; в эксперименте животные балансируют между частыми мелкими…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/strategiya-geytirovaniya.html\"&gt;Стратегия гейтирования&lt;/a&gt; — Метод выбора специфических популяций клеток из общего потока данных на основе их физических характеристик и маркеров для последующего…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stratifitsirovannaya-10-kratnaya-perekrestnaya-proverka.html\"&gt;Стратифицированная 10-кратная перекрестная проверка&lt;/a&gt; — Метод оценки качества модели машинного обучения, при котором данные делятся на 10 частей так, чтобы пропорции классов сохранялись, модель…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/endoplasmic-reticulum-stress.html\"&gt;Стресс эндоплазматического ретикулума&lt;/a&gt; — Патологическое состояние, возникающее из-за накопления несвернутых белков при дефиците SIL1, запускающее каскад UPR и апоптоз нейронов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/struktura-1t1r-odin-tranzistor.html\"&gt;Структура 1T1R (один транзистор&lt;/a&gt; — Один резистор) объединяет ячейку памяти на мемристоре с управляющим транзистором, что позволяет точно подавать напряжение и считывать…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/structured-output.html\"&gt;Структурированный вывод&lt;/a&gt; — Технический механизм, который заставляет языковую модель отвечать строго по заданному шаблону (например, в формате JSON), исключая…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/structurally-unique-hits.html\"&gt;Структурно уникальные хиты&lt;/a&gt; — Показатель эффективности дизайна, отражающий количество успешных белковых кандидатов, прошедших фильтры качества и отличающихся по своей…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"e\"&gt;&lt;a href=\"reference/glossary.html#e\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Э&lt;/span&gt;&lt;/a&gt;Э&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-epidemiology.html\"&gt;Эпидемиология&lt;/a&gt; — кто и почему болеет: когорты, риски, распространение&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-endocrinology.html\"&gt;Эндокринология&lt;/a&gt; — гормоны, диабет, щитовидная железа&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-evolutionary_biology.html\"&gt;Эволюционная биология&lt;/a&gt; — как возникают и меняются виды&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-ecology.html\"&gt;Экология&lt;/a&gt; — виды, сообщества и экосистемы&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ekzogennyy-holesterin.html\"&gt;Экзогенный холестерин&lt;/a&gt; — Добавление холестерина извне в питательную среду для проверки того, могут ли клетки опухоли компенсировать его дефицит за счет…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ekzosomy.html\"&gt;Экзосомы&lt;/a&gt; — Внеклеточные везикулы, через которые токсичные сигналы и дефекты эндолизосомального транспорта передаются между клетками.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gene-expression.html\"&gt;Экспрессия генов&lt;/a&gt; — Процесс, профиль которого анализируется для оценки влияния мутаций и гормональной терапии на молекулярном уровне.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ekstremalnoe-perekryvanie-ramok-schityvaniya.html\"&gt;Экстремальное перекрывание рамок считывания&lt;/a&gt; — Уникальная организация генома, когда одна нуклеотидная последовательность на обеих цепях РНК одновременно кодирует разные белки и выполняет…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/endolizosomalnyy-trafik.html\"&gt;Эндолизосомальный трафик&lt;/a&gt; — Внутриклеточная транспортная система, которая перемещает молекулы между эндосомами (пузырьками для сортировки грузов) и лизосомами…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/epistemicheskaya-duga.html\"&gt;Эпистемическая дуга&lt;/a&gt; — Фундаментальный путь мотивированного обучения, представляющий собой последовательность внутренних состояний: от любопытства к озарению и…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aesthetic-aha.html\"&gt;Эстетическое озарение&lt;/a&gt; — Мгновенное чувство ясности и понимания смысла произведения искусства, похожее на научное озарение, которое повышает его эмоциональную…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aha-effect.html\"&gt;Эффект «ага»&lt;/a&gt; — Феноменальное чувство, сопровождающее момент внезапного понимания или инсайта, выступающее как метакогнитивный сигнал обратной связи.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/female-protective-effect.html\"&gt;Эффект защиты женского пола&lt;/a&gt; — Биологический механизм, при котором женский организм более устойчив к развитию аутизма, требуя большей генетической нагрузки для проявления…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/title-effect.html\"&gt;Эффект названия&lt;/a&gt; — Явление, при котором дополнительная семантическая информация в виде текста изменяет восприятие, интерпретацию и оценку произведений…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/effector-cd8-t-lymphocytes.html\"&gt;Эффекторные CD8+ Т-лимфоциты&lt;/a&gt; — Субпопуляция Т-клеток, в которых аномально экспрессируется ген KRAS, что приводит к повышению их цитотоксичности, истощению и накоплению в…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"a\"&gt;&lt;a href=\"reference/glossary.html#a\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;А&lt;/span&gt;&lt;/a&gt;А&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-obstetrics_and_gynecology.html\"&gt;Акушерство и гинекология&lt;/a&gt; — беременность, роды, женское здоровье&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-allergy_and_immunology.html\"&gt;Аллергология&lt;/a&gt; — аллергии и иммунодефициты в клинике&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ablyatsiya.html\"&gt;Абляция&lt;/a&gt; — Метод анализа модели, при котором последовательно отключаются или изменяются её отдельные компоненты, чтобы понять вклад каждого из них в…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aha-rating.html\"&gt;Ага-эффект»&lt;/a&gt; — Субъективное чувство внезапного озарения или инсайта при разрешении когнитивной неопределенности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/agaroznye-fantomy.html\"&gt;Агарозные фантомы&lt;/a&gt; — Гелевые модели, имитирующие физические свойства тканей мозга, которые используются для первичной проверки точности доставки препаратов…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/agarose-phantom.html\"&gt;Агарозный фантом&lt;/a&gt; — Гелевая модель на основе агарозы, используемая в доклинических испытаниях для имитации физических свойств тканей мозга.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aggresomes.html\"&gt;Агресомы&lt;/a&gt; — Перинуклеарные структуры, состоящие из убиквитинированных неправильно свернутых белков, которые формируются при нарушении работы…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aytreker.html\"&gt;Айтрекер&lt;/a&gt; — Устройство для точного отслеживания движения глаз и направления взгляда человека в реальном времени.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aytreking.html\"&gt;Айтрекинг&lt;/a&gt; — Метод регистрации движения глаз, позволяющий оценивать зрительное внимание и физиологические реакции, такие как изменение диаметра зрачка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aktinomitsin-d.html\"&gt;Актиномицин D&lt;/a&gt; — Антибиотик, блокирующий синтез РНК, что позволяет измерить скорость распада существующих молекул (период полужизни).&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/leiden-algorithm.html\"&gt;Алгоритм Лейдена&lt;/a&gt; — Математический метод разбиения графов на плотные сообщества (кластеры), который гарантирует получение внутренне связанных групп клеток.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rolling-circle-amplification.html\"&gt;Амплификация с круговой петлей&lt;/a&gt; — Высокочувствительный метод детекции, используемый для выявления патологических кольцевых РНК в тканях центральной нервной системы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/anabolic-program.html\"&gt;Анаболическая программа&lt;/a&gt; — Метаболический процесс в микроглии, объединяющий синтез новых белков с биогенезом митохондрий для поддержания фагоцитарной активности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/power-analysis.html\"&gt;Анализ мощности&lt;/a&gt; — Статистический метод для определения минимального размера выборки, необходимого для обнаружения реального эффекта с заданной вероятностью.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/analiz-psevdovremeni.html\"&gt;Анализ псевдовремени&lt;/a&gt; — Вычислительный метод, который упорядочивает клетки вдоль «траектории» развития или прогрессирования болезни, превращая статические данные…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/variance-partition.html\"&gt;Анализ распределения дисперсии&lt;/a&gt; — Статистический метод, позволяющий определить, какая часть изменчивости данных обусловлена конкретными факторами, такими как биологические…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/analiz-chuvstvitelnosti.html\"&gt;Анализ чувствительности&lt;/a&gt; — Анализ чувствительности — это метод оценки устойчивости выводов модели или исследования при изменении исходных параметров и предположений.…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/anergiya.html\"&gt;Анергия&lt;/a&gt; — Состояние функциональной неактивности Т-клеток, возникающее при изолированной стимуляции первого сигнала (CD3) без костимуляции.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/annotirovanie-fokusa-dokazatelstv.html\"&gt;Аннотирование фокуса доказательств&lt;/a&gt; — Метод классификации текстовых обоснований и параметров вычислительных задач по четырем ключевым критериям качества белковых моделей для…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ansamblevoe-obuchenie.html\"&gt;Ансамблевое обучение&lt;/a&gt; — Метод объединения нескольких алгоритмов для получения более точного и стабильного прогноза, чем дает каждая модель по отдельности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fisher-information-approximation.html\"&gt;Аппроксимация фишеровской информации&lt;/a&gt; — Математический метод, используемый для разложения штрафов за сложность моделей на геометрические составляющие: размерность, объем…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/human-developing-hippocampus-atlas.html\"&gt;Атлас развивающегося гиппокампа человека&lt;/a&gt; — Интегрированная одноклеточная справочная система, охватывающая развитие гиппокампа человека от эмбрионального периода до подросткового…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/advanced-therapy-medicinal-products.html\"&gt;АТМП&lt;/a&gt; — Биологические препараты, включая клеточные и генные терапевтические агенты, требующие высокоточной доставки в ткани мозга.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/afantaziya.html\"&gt;Афантазия&lt;/a&gt; — Состояние, характеризующееся пожизненным отсутствием произвольных зрительных образов в воображении при сохранных базовых функциях зрения и…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"d\"&gt;&lt;a href=\"reference/glossary.html#d\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Д&lt;/span&gt;&lt;/a&gt;Д&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-dermatology.html\"&gt;Дерматология&lt;/a&gt; — кожа&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/danio-rerio.html\"&gt;Данио-рерио&lt;/a&gt; — Модельный организм, личинки которого используются для анализа сенсомоторного поведения и компенсации поведенческих нарушений при терапии.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/datchik-pka.html\"&gt;Датчик PKA&lt;/a&gt; — Генетически кодируемый молекулярный инструмент с флуоресцентной меткой, который позволяет в реальном времени отслеживать уровень активности…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dvuhfaktornyy-anova-s-povtornymi-izmereniyami.html\"&gt;Двухфакторный ANOVA с повторными измерениями&lt;/a&gt; — Статистический метод для оценки влия
