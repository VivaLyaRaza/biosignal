        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференции&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;крупнейший съезд нейробиологов (Society for Neuroscience)&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;крупнейший съезд нейробиологов (Society for Neuroscience)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что берём&lt;/td&gt;\n&lt;td&gt;тренды нейронауки, свежие тезисы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-brain.html\"&gt;Мозг и нервная система&lt;/a&gt;, &lt;a href=\"concepts/spec-mind.html\"&gt;Психика и поведение&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-eto-za-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-sfn_neuroscience.html#chto-eto-za-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что это за конференция&lt;/span&gt;&lt;/a&gt;Что это за конференция&lt;/h2&gt;\n&lt;p&gt;SfN Neuroscience (Neuroscience) — это ежегодная международная конференция, организуемая Обществом нейронаук (Society for Neuroscience). Это крупнейшее в мире научное событие, объединяющее десятки тысяч исследователей, врачей и разработчиков, работающих в области изучения мозга и нервной системы. Конференция служит главной площадкой для обмена данными, обсуждения прорывных методик и формирования повестки нейробиологии на ближайшие годы.&lt;/p&gt;\n&lt;h2 id=\"organizatory-i-istoriya\"&gt;&lt;a href=\"reference/conferences/conf-sfn_neuroscience.html#organizatory-i-istoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Организаторы и история&lt;/span&gt;&lt;/a&gt;Организаторы и история&lt;/h2&gt;\n&lt;p&gt;Организатором выступает Society for Neuroscience — некоммерческая организация, основанная в 1969 году. Ее миссия заключается в продвижении фундаментальных исследований мозга и нервной системы, а также в поддержке научного образования. Конференция проводится ежегодно в различных городах Северной Америки, собирая экспертов из разных стран для обсуждения интегративной природы нервной системы, которая регулирует деятельность всех органов и реакцию организма на внешнюю среду.&lt;/p&gt;\n&lt;h2 id=\"temy-i-sekcii\"&gt;&lt;a href=\"reference/conferences/conf-sfn_neuroscience.html#temy-i-sekcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Темы и секции&lt;/span&gt;&lt;/a&gt;Темы и секции&lt;/h2&gt;\n&lt;p&gt;Программа конференции охватывает весь спектр нейронаук: от молекулярной биологии до когнитивной психологии. Ключевые направления включают:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Молекулярные и клеточные механизмы: изучение генетических мутаций (например, AKAP11) и их влияния на работу нейронов, а также исследование редких заболеваний, таких как болезнь Гоше.&lt;/li&gt;\n&lt;li&gt;Развитие мозга: анализ формирования нейронных связей, включая создание «мини-мозгов» из стволовых клеток.&lt;/li&gt;\n&lt;li&gt;Когнитивные процессы: механизмы памяти, воспроизведение визуальных деталей воспоминаний и обработка речи младенцами.&lt;/li&gt;\n&lt;li&gt;Клиническая нейробиология: связь психических расстройств (СДВГ, депрессия, аутизм) с соматическими заболеваниями, такими как диабет, и разработка методов генной терапии.&lt;/li&gt;\n&lt;li&gt;Нейротехнологии: создание атласов мозга для поиска общих биологических маркеров нейродегенеративных заболеваний, таких как болезни Альцгеймера и Паркинсона.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"chto-tam-poyavlyaetsya\"&gt;&lt;a href=\"reference/conferences/conf-sfn_neuroscience.html#chto-tam-poyavlyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что там появляется&lt;/span&gt;&lt;/a&gt;Что там появляется&lt;/h2&gt;\n&lt;p&gt;SfN Neuroscience — это место, где впервые озвучиваются результаты масштабных исследований. Именно здесь научное сообщество знакомится с новыми моделями болезней, результатами клинических испытаний и инновационными методами визуализации мозга. Конференция способствует развитию культуры открытых данных (Open Data), что позволяет ученым объединять усилия для решения сложных задач, таких как картирование уязвимости мозга или изучение влияния раннего стресса на префронтальную кору и миндалину. Для исследователя это возможность увидеть, как фундаментальные открытия превращаются в прикладные методы диагностики и лечения.&lt;/p&gt;\n&lt;h2 id=\"kak-sledit-i-uchastvovat\"&gt;&lt;a href=\"reference/conferences/conf-sfn_neuroscience.html#kak-sledit-i-uchastvovat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как следить и участвовать&lt;/span&gt;&lt;/a&gt;Как следить и участвовать&lt;/h2&gt;\n&lt;p&gt;Участие в конференции возможно в очном и дистанционном форматах. Основные способы следить за результатами:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Изучение тезисов (Abstracts): ежегодно публикуется огромный массив кратких отчетов о текущих исследованиях.&lt;/li&gt;\n&lt;li&gt;Профильные публикации: многие доклады, представленные на SfN, впоследствии становятся основой для статей в ведущих научных журналах.&lt;/li&gt;\n&lt;li&gt;Ресурсы сообщества: официальный сайт Society for Neuroscience предоставляет доступ к архивам конференций, образовательным материалам и новостным сводкам о главных трендах в нейробиологии.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/conferences/conf-sfn_neuroscience.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9D%D0%B5%D1%80%D0%B2%D0%BD%D0%B0%D1%8F_%D1%81%D0%B8%D1%81%D1%82%D0%B5%D0%BC%D0%B0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Нервная система — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1007/s12021-021-09533-8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Promoting FAIR Data Through Community-driven Agile Design: the Open Data Commons for Spinal Cord Injury (odc-sci.org)&lt;/a&gt; — обзор, Neuroinformatics 2022&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1007/s12021-008-9019-9\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Domain-specific data sharing in neuroscience: what do we have to learn from each other?&lt;/a&gt; — обзор, Neuroinformatics 2008&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференции&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"крупнейший съезд нейробиологов (Society for Neuroscience)"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"SfN Neuroscience","description":"крупнейший съезд нейробиологов (Society for Neuroscience)","vcsPath":"reference/conferences/conf-sfn_neuroscience.md"},"headings":[{"title":"Что это за конференция","href":"reference/conferences/conf-sfn_neuroscience.html#chto-eto-za-konferenciya","level":2},{"title":"Организаторы и история","href":"reference/conferences/conf-sfn_neuroscience.html#organizatory-i-istoriya","level":2},{"title":"Темы и секции","href":"reference/conferences/conf-sfn_neuroscience.html#temy-i-sekcii","level":2},{"title":"Что там появляется","href":"reference/conferences/conf-sfn_neuroscience.html#chto-tam-poyavlyaetsya","level":2},{"title":"Как следить и участвовать","href":"reference/conferences/conf-sfn_neuroscience.html#kak-sledit-i-uchastvovat","level":2},{"title":"Источники","href":"reference/conferences/conf-sfn_neuroscience.html#istochniki","level":2}],"title":"SfN Neuroscience"},"router":{"pathname":"reference/conferences/conf-sfn_neuroscience","depth":3,"base":"..
