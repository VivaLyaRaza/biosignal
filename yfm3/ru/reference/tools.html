        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;23 концепции&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/agrillama.html\"&gt;AgriLLaMA&lt;/a&gt; — Большая языковая модель, преобразующая технические данные анализа в понятные агрономические рекомендации.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/casrx.html\"&gt;CasRx&lt;/a&gt; — РНК-управляемый фермент, используемый в работе для подавления активности (нокдауна) специфических генов в культуре нейральных прогениторных…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dcas13.html\"&gt;dCas13&lt;/a&gt; — Каталитически неактивная версия белка Cas13, используемая для стерического блокирования специфических участков РНК.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/drought-spec-net.html\"&gt;Drought-Spec-Net&lt;/a&gt; — Нейросеть для раннего обнаружения водного стресса у томатов на основе спектрального анализа.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dsrbd.html\"&gt;dsRBD&lt;/a&gt; — Домен, который добавляется к dCas13 для усиления аффинности комплекса dCas13/gРНК к целевой мРНК.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/eia-860m.html\"&gt;EIA-860M&lt;/a&gt; — Инструмент инвентаризации энергетических мощностей, используемый для отслеживания графиков вывода угольных электростанций из эксплуатации.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fastglioma.html\"&gt;FastGlioma&lt;/a&gt; — ИИ-модель с открытым исходным кодом, используемая для оценки степени инфильтрации опухолевых клеток и прогнозирования зон рецидива.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/htm-carmen.html\"&gt;HTM CARMEN&lt;/a&gt; — Мультиплексная диагностическая платформа на основе CRISPR-Cas13a для одновременного выявления ВИЧ, туберкулеза и малярии, а также анализа…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ilastik.html\"&gt;ilastik&lt;/a&gt; — Инструмент, применяемый для сегментации RGB-изображений с целью оценки индекса тяжести засухи.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/psychad.html\"&gt;PsychAD&lt;/a&gt; — Когорта из 1494 уникальных доноров мозга, используемая для создания атласа транскриптомов при нейродегенеративных и психиатрических…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rfdiffusion.html\"&gt;RFdiffusion&lt;/a&gt; — Алгоритм глубокого обучения, используемый в работе для вычислительного дизайна белков с заданными свойствами связывания.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rnase-r.html\"&gt;RNase R&lt;/a&gt; — Фермент, который избирательно разрушает линейные молекулы РНК, позволяя концентрировать и анализировать кольцевые РНК в образцах.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spiramed.html\"&gt;SpiraMed&lt;/a&gt; — Инновационная система для доставки лекарств в глубокие структуры мозга через один доступ с помощью гибкого спирального катетера.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/target-adaptive-rescue-explore-exploit.html\"&gt;T-REX&lt;/a&gt; — Агентный фреймворк для автоматизированного проектирования белков, который координирует работу генеративных моделей и распределяет…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/agarose-phantom.html\"&gt;Агарозный фантом&lt;/a&gt; — Гелевая модель на основе агарозы, используемая в доклинических испытаниях для имитации физических свойств тканей мозга.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bicos.html\"&gt;Биспецифические костимуляторы&lt;/a&gt; — Молекулы, обеспечивающие второй сигнал активации Т-клеток через бивалентное связывание с рецептором CD28.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hyperscale-data-centers.html\"&gt;Гипермасштабируемые дата-центры&lt;/a&gt; — Крупные вычислительные центры, обеспечивающие работу облачных вычислений и ИИ-инфраструктуры, чей высокий спрос на энергию вынуждает…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/deterministic-controller.html\"&gt;Детерминированный контроллер&lt;/a&gt; — Компонент системы, который проверяет предложения LLM-агентов, управляет лимитами ресурсов и распределяет задачи по графическим процессорам.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stable-diffusion.html\"&gt;Диффузионная нейросеть&lt;/a&gt; — ИИ-модель класса «текст-в-изображение», используемая для синтеза персонализированных визуальных образов на основе вербальных описаний…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/brain-organoids.html\"&gt;Мозговые органоиды&lt;/a&gt; — Лабораторная модель, полученная из индуцированных плюрипотентных стволовых клеток, воспроизводящая ключевые черты раннего развития мозга.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/forebrain-organoids.html\"&gt;Органоиды переднего мозга&lt;/a&gt; — Трехмерные модели тканей мозга, выращенные из иПСК, используемые для имитации развития болезни и изучения нейронных сетей.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vgg-16.html\"&gt;Сверточная нейросеть VGG-16&lt;/a&gt; — Инструмент компьютерного зрения, применяемый для извлечения 1000-мерных векторов активации из синтезированных изображений для построения…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/7t-fmri.html\"&gt;сверхвысокопольное 7Т МРТ&lt;/a&gt; — Инструмент нейровизуализации с высоким разрешением вокселей, позволяющий изолировать активность отдельных слоев коры.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"23 концепции"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Инструменты","description":"23 концепции","vcsPath":"reference/tools.md"},"headings":[],"title":"Инструменты"},"router":{"pathname":"reference/tools","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
