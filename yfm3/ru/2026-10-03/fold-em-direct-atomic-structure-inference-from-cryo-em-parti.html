            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"262\" cy=\"137\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"518\" cy=\"260\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · BIOPHYSICS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как увидеть структуру белка,&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;имея в сотни раз меньше&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;данных&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f1.jpg\" alt=\"Рисунок 1: Fold’EM выводит атомные структуры непосредственно из разреженных изображений частиц крио-ЭМ.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Fold’EM выводит атомные структуры непосредственно из разреженных изображений частиц крио-ЭМ.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1: Fold’EM выводит атомные структуры непосредственно из разреженных изображений частиц крио-ЭМ. (A) Fold’EM чередует структурный вывод с уточнением позы и класса. (B) Данные частиц обратно распространяются в промежуточные состояния Pairformer H, фильтруя экспериментальные обновления через оставшиеся блоки Pairformer перед диффузией AlphaFold3. (C) Для комплекса интегрин–BIIG2 Fab (PDB 9B9J) AlphaFold3 предсказывает отдельные компоненты, но размещает Fab в неправильном сайте связывания. (D) Ab initio Fold’EM восстанавливает связанный комплекс и эпитоп всего из 1000 частиц — 0,26% от использованных для депонированной реконструкции — с RMSD 2,49 Å, TM-score 0,956 и разрешением FSC 3,52 Å (депонированная карта: 2,6 Å).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Классическая криоэлектронная микроскопия требует тысяч снимков молекул, чтобы построить качественную 3D-карту. Новый метод Fold'EM меняет подход, напрямую связывая данные микроскопии с предсказательными моделями белков. Это позволяет восстанавливать структуру молекул, используя лишь малую долю привычного объема данных. Технология особенно эффективна для изучения редких и нестабильных состояний белков.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Fold'EM исключает промежуточную реконструкцию 3D-плотности из пайплайна крио-ЭМ.&lt;/li&gt;\n&lt;li&gt;Метод использует структурные априорные знания из AlphaFold3 для интерпретации зашумленных частиц.&lt;/li&gt;\n&lt;li&gt;Для восстановления структуры требуется в 20–1000 раз меньше частиц, чем в стандартных подходах.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Традиционный пайплайн крио-ЭМ (криоэлектронной микроскопии) включает реконструкцию карты электростатического потенциала (ESP) из тысяч зашумленных проекций частиц, после чего в эту карту встраивается атомная модель. Fold'EM исключает этап промежуточной реконструкции плотности, интегрируя структурные априорные знания (priors) из генеративных моделей, таких как AlphaFold3, непосредственно на этапе обработки изображений частиц. Авторы разделяют блок Pairformer в AlphaFold3 на две части, оптимизируя промежуточное состояние H, что позволяет пропускать экспериментальные данные через оставшиеся слои нейросети.&lt;/p&gt;\n&lt;p&gt;В ходе работы исследователи протестировали метод на синтетических и экспериментальных данных из базы EMPIAR. При известной ориентации частиц алгоритму достаточно 0,1% от стандартного объема данных для достижения сопоставимого разрешения (FSC). В ab initio режиме, где ориентация и конформация частиц неизвестны, метод успешно восстанавливает структуру, используя всего 3–5% от количества частиц, требуемых для классической реконструкции. Это позволяет эффективно разделять различные конформационные состояния в гетерогенных образцах без необходимости построения отдельных карт для каждого из них.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа представлена в виде препринта и требует независимой проверки на более широком спектре биологических образцов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Криоэлектронная микроскопия (cryo-EM) отдельных частиц стала основным методом определения структуры биомолекул. Стандартный вычислительный процесс включает усреднение множества изображений частиц для построения карты электростатического потенциала (ESP), в которую затем вписывается атомная модель. Этот подход требует огромного количества изображений, что делает процесс дорогостоящим и низкопроизводительным, особенно при работе со структурно неоднородными образцами. Кроме того, качество построения модели напрямую зависит от разрешения итоговой карты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Криоэлектронная микроскопия (cryo-EM) — метод визуализации замороженных биологических молекул с помощью электронного пучка, позволяющий видеть их структуру с атомным разрешением.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторы представляют Fold’EM — фреймворк для вывода структур, который интегрирует априорные знания из генеративных моделей предсказания структуры белка непосредственно с исходными изображениями частиц. Метод позволяет определять атомные модели, минуя этапы промежуточной реконструкции плотности и последующего подбора модели к этой карте. Это значительно снижает требования к количеству необходимых изображений частиц.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Fold’EM позволяет восстанавливать атомные структуры по малому числу изображений, исключая стадию реконструкции карты плотности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;На синтетических тестах и экспериментальных данных cryo-EM метод Fold’EM успешно восстанавливает точные атомные структуры как при известных ориентациях частиц, так и в режиме ab initio, где ориентация определяется совместно со структурой. В неоднородных наборах данных Fold’EM способен разделять различные конформационные состояния из смешанных популяций частиц без необходимости отдельной реконструкции карт для каждого состояния. Данный подход открывает новые возможности для структурной биологии в условиях малого объема данных и позволяет эффективно характеризовать редкие конформационные состояния.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффективность метода на экспериментальных данных требует дальнейшей проверки в широком спектре биологических систем для подтверждения универсальности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"krioelektronnaya-mikroskopiya-odinochnyh-chastic-vozmozhnosti-i-ogranicheniya\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#krioelektronnaya-mikroskopiya-odinochnyh-chastic-vozmozhnosti-i-ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Криоэлектронная микроскопия одиночных частиц: возможности и ограничения&lt;/span&gt;&lt;/a&gt;Криоэлектронная микроскопия одиночных частиц: возможности и ограничения&lt;/h4&gt;\n&lt;p&gt;Криоэлектронная микроскопия одиночных частиц (cryo-EM) стала ключевым методом структурной биологии, позволяющим определять структуру крупных макромолекулярных комплексов с высоким разрешением без необходимости их кристаллизации. Возможность визуализации отдельных молекул в различных конформациях позволяет исследователям изучать динамические структурные изменения, лежащие в основе биологических функций. Однако первичные данные крайне зашумлены: радиационное повреждение ограничивает допустимую дозу электронов, из-за чего отдельные изображения непригодны для прямой интерпретации. Для получения карты электростатического потенциала (ESP) требуется совмещение и усреднение огромного количества частиц, после чего следует сложный этап построения атомной модели, который остается затруднительным при низком локальном разрешении.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Крио-ЭМ требует огромных наборов данных для усреднения, что ограничивает изучение редких или нестабильных конформаций белков.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"problema-neodnorodnosti-i-nehvatka-dannyh\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#problema-neodnorodnosti-i-nehvatka-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Проблема неоднородности и нехватка данных&lt;/span&gt;&lt;/a&gt;Проблема неоднородности и нехватка данных&lt;/h4&gt;\n&lt;p&gt;Необходимость когерентного усреднения создает конфликт между пространственным разрешением и биологической полнотой данных. Объединение частиц разных конформаций размывает структуру, а разделение на однородные группы снижает количество наблюдений для каждого состояния. Редкие или переходные состояния часто теряются, так как они либо поглощаются более массовыми конформациями, либо отсеиваются при фильтрации, либо их недостаточно для независимой реконструкции. Существующие методы моделирования неоднородности позволяют выявлять конформационную вариативность, но они зависят от качества предварительного отбора и выравнивания частиц. Таким образом, фундаментальная потребность в больших выборках остается нерешенной.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Крио-ЭМ реконструкция — это процесс превращения тысяч зашумленных 2D-проекций молекул в 3D-модель, где «усреднение» помогает подавить шум, но требует высокой однородности частиц.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"integraciya-strukturnyh-apriornyh-znanij\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#integraciya-strukturnyh-apriornyh-znanij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интеграция структурных априорных знаний&lt;/span&gt;&lt;/a&gt;Интеграция структурных априорных знаний&lt;/h4&gt;\n&lt;p&gt;Традиционные методы реконструкции слабо используют априорные знания о структуре белков. Использование регуляризации на основе нейросетевых денойзеров (например, Blush в RELION) или предсказательных моделей типа AlphaFold демонстрирует, что включение структурных знаний улучшает качество реконструкции при слабом сигнале. Однако современные подходы применяют эти знания уже после этапа усреднения и реконструкции, что сохраняет зависимость от большого количества частиц. В данной работе мы ставим вопрос: можно ли внедрить структурные априорные знания непосредственно на уровне отдельных частиц, чтобы проводить атомный вывод из разреженных данных без промежуточной высокоразрешающей реконструкции?&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Предлагаемый подход направлен на преодоление ограничений по количеству частиц, однако эффективность метода требует проверки на реальных экспериментальных наборах данных с крайне низким отношением сигнал/шум.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;p&gt;Мы представили Fold’EM — фреймворк для вывода атомных структур непосредственно из крио-ЭМ изображений частиц. Метод направляет работу AlphaFold3 с помощью данных на уровне отдельных частиц, минуя этапы построения плотности и сборки модели. Мы показали, что подгонка плотности воспроизводит правдоподобие частиц только при специфических метриках, а при неопределенности позы или класса консенсусная плотность не является достаточной статистикой. Оптимизация промежуточных состояний Pairformer, а не финальных, формирует геометрию, значительно усиливающую точность направляемого вывода. Fold’EM восстанавливает точные структуры, используя менее 1% частиц от объема, требуемого при стандартной реконструкции с известными позами, около 3% для ab initio и около 5% для гетерогенных образцов. Метод позволяет выявить детали, недоступные при обычном предсказании, такие как сайт связывания Integrin α5β1–BIIG2 или искаженную ДНК в UvrA. Конформационная организация в пространстве частиц отражается в представлении AlphaFold, что позволяет описывать непрерывные движения через несколько опорных состояний.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Fold’EM позволяет определять структуру, используя в 20–100 раз меньше частиц, чем традиционные методы, за счет объединения априорных знаний AlphaFold3 с экспериментальными данными.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ограничения: Fold’EM пока не заменяет полностью конвейер крио-ЭМ: на вход подаются отобранные частицы с известными параметрами CTF, а ab initio вывод требует точных оценок поз для инициализации. Компоненты, отсутствующие в модели (гликаны, лиганды, гибкие участки), воспринимаются как необъяснимый сигнал, а локальные детали (петли интерфейсов) восстанавливаются сложнее, чем глобальные сборки. Будущая работа будет направлена на использование необработанных частиц, уточнение локальных структур и улучшение инициализации поз.&lt;/p&gt;\n&lt;h4 id=\"zayavlenie-ob-ispolzovanii-ii\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#zayavlenie-ob-ispolzovanii-ii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заявление об использовании ИИ&lt;/span&gt;&lt;/a&gt;Заявление об использовании ИИ&lt;/h4&gt;\n&lt;p&gt;Генеративные ИИ-инструменты (ChatGPT, Claude) применялись при подготовке рукописи для редактирования языка, улучшения структуры, проверки математических выкладок, помощи в написании кода и форматировании ссылок. Все научные выводы, результаты и интерпретации были проверены авторами, которые несут полную ответственность за содержание статьи.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица S3.&lt;/strong&gt; Разрешение при корреляции оболочки Фурье (FSC) = 0.143 (↓, Å) для экспериментальных наборов данных крио-ЭМ&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Метод&lt;/th&gt;\n&lt;th&gt;1/500&lt;/th&gt;\n&lt;th&gt;1/250&lt;/th&gt;\n&lt;th&gt;1/100&lt;/th&gt;\n&lt;th&gt;1/50&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Fold’EM&lt;/td&gt;\n&lt;td&gt;3.73&lt;/td&gt;\n&lt;td&gt;3.35&lt;/td&gt;\n&lt;td&gt;3.50&lt;/td&gt;\n&lt;td&gt;3.46&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;cryoDRGN&lt;/td&gt;\n&lt;td&gt;2.85&lt;/td&gt;\n&lt;td&gt;2.73&lt;/td&gt;\n&lt;td&gt;2.73&lt;/td&gt;\n&lt;td&gt;2.75&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;RELION&lt;/td&gt;\n&lt;td&gt;6.63&lt;/td&gt;\n&lt;td&gt;6.63&lt;/td&gt;\n&lt;td&gt;7.06&lt;/td&gt;\n&lt;td&gt;6.13&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;AlphaFold3&lt;/td&gt;\n&lt;td&gt;3.02&lt;/td&gt;\n&lt;td&gt;3.95&lt;/td&gt;\n&lt;td&gt;3.09&lt;/td&gt;\n&lt;td&gt;3.36&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;PDB&lt;/td&gt;\n&lt;td&gt;3.20&lt;/td&gt;\n&lt;td&gt;3.09&lt;/td&gt;\n&lt;td&gt;3.26&lt;/td&gt;\n&lt;td&gt;3.45&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Для Fold’EM, AlphaFold3 и структур PDB, FSC вычисляется с использованием phenix.model_map. Все базовые показатели при различной доле исходного набора данных (500 частиц с известными позами) оцениваются относительно депонированной карты EMD. Жирным шрифтом выделены лучшие результаты (исключая PDB).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 1.&lt;/strong&gt; Результаты оценки качества при различных коэффициентах разбавления&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Параметр&lt;/th&gt;\n&lt;th&gt;1/1000&lt;/th&gt;\n&lt;th&gt;1/500&lt;/th&gt;\n&lt;th&gt;1/250&lt;/th&gt;\n&lt;th&gt;1/100&lt;/th&gt;\n&lt;th&gt;1/50&lt;/th&gt;\n&lt;th&gt;AlphaFold3&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Значение 1&lt;/td&gt;\n&lt;td&gt;1.96&lt;/td&gt;\n&lt;td&gt;1.97&lt;/td&gt;\n&lt;td&gt;1.88&lt;/td&gt;\n&lt;td&gt;1.92&lt;/td&gt;\n&lt;td&gt;1.88&lt;/td&gt;\n&lt;td&gt;21.90&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Значение 2&lt;/td&gt;\n&lt;td&gt;1.90&lt;/td&gt;\n&lt;td&gt;1.77&lt;/td&gt;\n&lt;td&gt;1.71&lt;/td&gt;\n&lt;td&gt;1.74&lt;/td&gt;\n&lt;td&gt;1.71&lt;/td&gt;\n&lt;td&gt;3.87&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Значение 3&lt;/td&gt;\n&lt;td&gt;4.340&lt;/td&gt;\n&lt;td&gt;4.989&lt;/td&gt;\n&lt;td&gt;4.597&lt;/td&gt;\n&lt;td&gt;5.349&lt;/td&gt;\n&lt;td&gt;4.174&lt;/td&gt;\n&lt;td&gt;33.16&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Значение 4&lt;/td&gt;\n&lt;td&gt;2.20&lt;/td&gt;\n&lt;td&gt;1.99&lt;/td&gt;\n&lt;td&gt;2.48&lt;/td&gt;\n&lt;td&gt;2.02&lt;/td&gt;\n&lt;td&gt;2.09&lt;/td&gt;\n&lt;td&gt;5.96&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Значение 5&lt;/td&gt;\n&lt;td&gt;1.87&lt;/td&gt;\n&lt;td&gt;1.39&lt;/td&gt;\n&lt;td&gt;1.23&lt;/td&gt;\n&lt;td&gt;1.35&lt;/td&gt;\n&lt;td&gt;1.47&lt;/td&gt;\n&lt;td&gt;2.01&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Значение 6&lt;/td&gt;\n&lt;td&gt;0.969&lt;/td&gt;\n&lt;td&gt;0.970&lt;/td&gt;\n&lt;td&gt;0.972&lt;/td&gt;\n&lt;td&gt;0.971&lt;/td&gt;\n&lt;td&gt;0.972&lt;/td&gt;\n&lt;td&gt;0.776&lt;/td&gt;\n&lt;/tr&gt;\n&lt;t 1.34&lt;/td&gt;\n&lt;td&gt;1.37&lt;/td&gt;\n&lt;td&gt;7.780&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ряд 4&lt;/td&gt;\n&lt;td&gt;1.362&lt;/td&gt;\n&lt;td&gt;1.350&lt;/td&gt;\n&lt;td&gt;1.798&lt;/td&gt;\n&lt;td&gt;1.512&lt;/td&gt;\n&lt;td&gt;26.670&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ряд 5&lt;/td&gt;\n&lt;td&gt;0.81&lt;/td&gt;\n&lt;td&gt;1.12&lt;/td&gt;\n&lt;td&gt;1.44&lt;/td&gt;\n&lt;td&gt;1.41&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ряд 6&lt;/td&gt;\n&lt;td&gt;1.248&lt;/td&gt;\n&lt;td&gt;1.227&lt;/td&gt;\n&lt;td&gt;1.503&lt;/td&gt;\n&lt;td&gt;1.479&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ряд 7&lt;/td&gt;\n&lt;td&gt;0.84&lt;/td&gt;\n&lt;td&gt;0.86&lt;/td&gt;\n&lt;td&gt;1.33&lt;/td&gt;\n&lt;td&gt;1.44&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ряд 8&lt;/td&gt;\n&lt;td&gt;1.132&lt;/td&gt;\n&lt;td&gt;1.228&lt;/td&gt;\n&lt;td&gt;1.686&lt;/td&gt;\n&lt;td&gt;1.711&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;TM-score (↑)&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ряд 1&lt;/td&gt;\n&lt;td&gt;0.964&lt;/td&gt;\n&lt;td&gt;0.965&lt;/td&gt;\n&lt;td&gt;0.939&lt;/td&gt;\n&lt;td&gt;0.983&lt;/td&gt;\n&lt;td&gt;0.699&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ряд 2&lt;/td&gt;\n&lt;td&gt;0.9832&lt;/td&gt;\n&lt;td&gt;0.9785&lt;/td&gt;\n&lt;td&gt;0.9810&lt;/td&gt;\n&lt;td&gt;0.9731&lt;/td&gt;\n&lt;td&gt;0.661&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ряд 3&lt;/td&gt;\n&lt;td&gt;0.967&lt;/td&gt;\n&lt;td&gt;0.967&lt;/td&gt;\n&lt;td&gt;0.987&lt;/td&gt;\n&lt;td&gt;0.984&lt;/td&gt;\n&lt;td&gt;0.7981&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ряд 4&lt;/td&gt;\n&lt;td&gt;0.9887&lt;/td&gt;\n&lt;td&gt;0.9890&lt;/td&gt;\n&lt;td&gt;0.9807&lt;/td&gt;\n&lt;td&gt;0.9861&lt;/td&gt;\n&lt;td&gt;0.4772&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ряд 5&lt;/td&gt;\n&lt;td&gt;0.968&lt;/td&gt;\n&lt;td&gt;0.962&lt;/td&gt;\n&lt;td&gt;0.985&lt;/td&gt;\n&lt;td&gt;0.984&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ряд 6&lt;/td&gt;\n&lt;td&gt;0.9906&lt;/td&gt;\n&lt;td&gt;0.9908&lt;/td&gt;\n&lt;td&gt;0.9862&lt;/td&gt;\n&lt;td&gt;0.9866&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ряд 7&lt;/td&gt;\n&lt;td&gt;0.967&lt;/td&gt;\n&lt;td&gt;0.967&lt;/td&gt;\n&lt;td&gt;0.987&lt;/td&gt;\n&lt;td&gt;0.983&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ряд 8&lt;/td&gt;\n&lt;td&gt;0.9923&lt;/td&gt;\n&lt;td&gt;0.9909&lt;/td&gt;\n&lt;td&gt;0.9828&lt;/td&gt;\n&lt;td&gt;0.9822&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h4 id=\"algoritmy\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#algoritmy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Алгоритмы&lt;/span&gt;&lt;/a&gt;Алгоритмы&lt;/h4&gt;\n&lt;p&gt;Алгоритм 1 описывает процедуру Fold’EM: координатный спуск, чередующий вывод структуры через направленную обратную диффузию с уточнением мешающих параметров (нюанс-переменных). Алгоритм 2 описывает оценщик остаточного подпространства B-RECOVAR, обеспечивающий начальное распределение по классам для ab initio гетерогенных задач.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Обратная диффузия — процесс постепенного удаления шума из случайного распределения для получения высококачественного изображения или структуры, направляемый в данном случае экспериментальными данными.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"predvaritelnaya-obrabotka\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#predvaritelnaya-obrabotka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Предварительная обработка&lt;/span&gt;&lt;/a&gt;Предварительная обработка&lt;/h4&gt;\n&lt;p&gt;Синтетические наборы данных создавались на основе структур из PDB. Исходные частицы без шума генерировались путем проекции экспериментальной структуры Xexpt согласно модели формирования изображения. Белый гауссов шум добавлялся в Фурье-области для достижения заданного отношения сигнал/шум (&lt;a href=\"concepts/substantia-nigra-pars-reticulata.html\"&gt;SNR&lt;/a&gt;), где &lt;span class=\"yfm-latex\" data-content=\"%5Csigma_%7Bnoise%7D%20%3D%20%20ext%7Bstd%7D(%5Chat%7By%7D)%20%2F%20%5Csqrt%7BSNR%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. В экспериментах использовались значения SNR 0,01 или 0,005.&lt;/p&gt;\n&lt;p&gt;Экспериментальные данные загружались из EMPIAR. Процесс включал отбор частиц из финальных файлов STAR, исключение «мусорных» изображений, центрирование, обрезку в Фурье-пространстве до 128 × 128 пикселей, фазовую коррекцию и наложение мягкой круговой маски с радиусом 0,4 от размера бокса.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Синтетические данные формировались с SNR 0,01–0,005, а реальные данные из EMPIAR проходили строгую фильтрацию и стандартизацию перед анализом.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"bazovye-metody\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#bazovye-metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Базовые методы&lt;/span&gt;&lt;/a&gt;Базовые методы&lt;/h4&gt;\n&lt;p&gt;Для сравнения с известными ориентациями (poses) использовались RELION и CryoDRGN. В CryoDRGN обучение проводилось с параметрами zdim=8, n=50. В RELION применялась низкочастотная опорная маска (60 Å). В задачах ab initio (без известных ориентаций) сравнивались CryoDRGN-AI (zdim=8, 50 эпох) и RELION. Последний работал в два этапа: сначала построение начальной модели через VDAM (200 итераций, K=1), затем 3D-авторефаймент с разделением на случайные половины. В методе Fold’EM для последующего уточнения использовались ориентации и карта, полученные на первом этапе. Гетерогенные наборы данных предварительно кластеризовались, и для каждой группы проводилась отдельная реконструкция.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ab initio реконструкция — это метод восстановления 3D-структуры из крио-ЭМ изображений без использования априорной информации об ориентации частиц.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Таблица 9.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-tT9.jpg\" alt=\"Таблица 9\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"alphafold3-i-apparatnye-resursy\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#alphafold3-i-apparatnye-resursy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AlphaFold3 и аппаратные ресурсы&lt;/span&gt;&lt;/a&gt;AlphaFold3 и аппаратные ресурсы&lt;/h4&gt;\n&lt;p&gt;Использовались Protenix v1.0.4 (реализация AlphaFold3), RELION 5.0.0 для оценки карт и ориентаций, а также Phenix v1.21.2-5419 для валидации. Вычисления проводились на графических процессорах NVIDIA H100 и L40S под управлением Debian GNU/Linux 12.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 11.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-tT11.jpg\" alt=\"Таблица 11\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"shtrafy-za-stolknoveniya-i-dlinu-svyazej\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#shtrafy-za-stolknoveniya-i-dlinu-svyazej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Штрафы за столкновения и длину связей&lt;/span&gt;&lt;/a&gt;Штрафы за столкновения и длину связей&lt;/h4&gt;\n&lt;p&gt;Для обеспечения физической корректности структур при оптимизации эмбеддингов применяются регуляризаторы. Штраф за длину связей Lbond рассчитывается для m атомов с допуском δbond = 0,2 Å, где B — матрица связности. Штраф за столкновения Lcollision минимизирует перекрытия не связанных атомов с учетом буферного расстояния pcollision = 0,4 Å. Общая логарифмическая вероятность валидности ансамбля определяется как сумма взвешенных штрафов λbond и λcollision.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Физическая достоверность моделей обеспечивается минимизацией штрафов за отклонение длин связей (допуск 0,2 Å) и стерические столкновения (буфер 0,4 Å).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Таблица S24.&lt;/strong&gt; Оценка MolProbity структур Fold’EM на наборе данных EMPIAR-13396&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Категория&lt;/th&gt;\n&lt;th&gt;Показатель&lt;/th&gt;\n&lt;th&gt;Значение 1&lt;/th&gt;\n&lt;th&gt;Значение 2&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Known&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;MolProbity score&lt;/td&gt;\n&lt;td&gt;1.16&lt;/td&gt;\n&lt;td&gt;1.20&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Clashscore&lt;/td&gt;\n&lt;td&gt;1.48&lt;/td&gt;\n&lt;td&gt;1.66&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Ramachandran outliers&lt;/td&gt;\n&lt;td&gt;0.16&lt;/td&gt;\n&lt;td&gt;0.16&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Медианные значения MolProbity score (↓), clash score (↓) и Ramachandran outlier (↓), вычисленные с помощью phenix.molprobity (Williams et al., 2018).&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"relaksaciya\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#relaksaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Релаксация&lt;/span&gt;&lt;/a&gt;Релаксация&lt;/h4&gt;\n&lt;p&gt;Для устранения остаточных микростолкновений структуры подвергаются финальной релаксации в вакууме с использованием силового поля AMBER14. Энергия минимизируется при пороге 2,39 ккал/моль и жесткости 10,0 ккал/моль/Å.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование силового поля AMBER14 необходимо для коррекции геометрии, так как даже при наличии штрафов в процессе оптимизации могут сохраняться незначительные стерические конфликты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"metriki\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#metriki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Метрики&lt;/span&gt;&lt;/a&gt;Метрики&lt;/h4&gt;\n&lt;p&gt;Для оценки точности структур, созданных Fold’EM, используется среднеквадратичное отклонение (RMSD) по Cα-атомам. Сначала структура X совмещается с экспериментальной Xexpt с помощью жесткого поворота Rkabsch и трансляции tkabsch (алгоритм Кабша). Затем вычисляется RMSDCα = √ (1/NCα) * Σ /Rkabschxi + tkabsch - xexpt i/^2, где NCα — число сопоставленных атомов.&lt;/p&gt;\n&lt;p&gt;Для оценки глобального структурного сходства применяется TM-score, который менее чувствителен к локальным отклонениям, чем RMSD. Он рассчитывается по формуле TMScore = max(R,t) (1/Lref) * Σ [1 / (1 + (di(R,t)/d0(Lref))^2)], где Lref — число остатков, а d0(Lref) = 1.24(Lref-15)^(1/3) - 1.8 Å. Значения TM-score лежат в диапазоне (0, 1], где большие числа означают большее сходство.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метрики RMSD и TM-score позволяют количественно оценить структурную точность моделей: RMSD измеряет локальное отклонение, а TM-score — глобальное сходство.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TM-score — это метрика, которая нормализует расстояние между атомами, делая оценку качества модели независимой от размера белка.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Качество стереохимии оценивается через MolProbity (пакет phenix.molprobity). Мы используем три показателя: clashscore (число стерических наложений на 1000 атомов), процент выбросов по Рамачандрану (остатки вне разрешенных областей углов ϕ и ψ) и итоговый MolProbity score, объединяющий наложения, ротамеры боковых цепей и статистику Рамачандрана. Чем ниже MolProbity score, тем лучше качество модели. Для оценки разрешения используется критерий FSC=0.143, вычисляемый через phenix.map_box для сравнения модели с экспериментальной картой плотности EMD.&lt;/p&gt;\n&lt;h4 id=\"model-formirovaniya-izobrazheniya-i-funkciya-pravdopodobiya-v-krio-em\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#model-formirovaniya-izobrazheniya-i-funkciya-pravdopodobiya-v-krio-em\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модель формирования изображения и функция правдоподобия в крио-ЭМ&lt;/span&gt;&lt;/a&gt;Модель формирования изображения и функция правдоподобия в крио-ЭМ&lt;/h4&gt;\n&lt;p&gt;Вероятность наблюдения изображения частицы y при заданной конформации X и позе ϕ описывается логарифмом правдоподобия log p(y / X, ϕ) = log p(y / yc(X, ϕ)), где yc — симулированное изображение без шума.&lt;/p&gt;\n&lt;h4 id=\"model-formirovaniya-izobrazheniya\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#model-formirovaniya-izobrazheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модель формирования изображения&lt;/span&gt;&lt;/a&gt;Модель формирования изображения&lt;/h4&gt;\n&lt;p&gt;Атомная структура X представляется как суперпозиция потенциалов отдельных атомов ρX(r) = Σ ρei(r - xi). В Фурье-пространстве потенциал молекулы bρX(ξ) выражается через факторы рассеяния электронов fei(∥ξ∥) и экспоненциальный фазовый сдвиг. Оператор проекции Pϕ переводит 3D-потенциал на плоскость, соответствующую позе ϕ (поворот R и трансляция t). Согласно теореме о центральном сечении, проекция соответствует срезу 3D Фурье-образа. Итоговое изображение без шума yc формируется путем применения функции передачи контраста (CTF) G(ω) в Фурье-области: yc(X, ϕ) = F^-1[G * SϕbρX].&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CTF (Contrast Transfer Function) — это математическая функция, описывающая искажения, вносимые электронным микроскопом в изображение, которые необходимо учитывать для восстановления структуры.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"model-shuma-i-funkciya-pravdopodobiya\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#model-shuma-i-funkciya-pravdopodobiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модель шума и функция правдоподобия&lt;/span&gt;&lt;/a&gt;Модель шума и функция правдоподобия&lt;/h4&gt;\n&lt;p&gt;Хотя первичный детекторный шум подчиняется распределению Пуассона, обработанные изображения частиц в крио-ЭМ (после коррекции движения, дозового взвешивания и нормализации) требуют иного подхода. Мы используем аддитивную гауссовскую модель шума в пространстве Фурье, где каждый коэффициент рассматривается как независимая комплексная величина с нулевым средним и дисперсией σ²(ω), зависящей от частоты. Логарифмическое правдоподобие определяется формулой (13).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Вместо прямой оптимизации правдоподобия используется нормированная кросс-корреляция в ограниченной полосе частот, что делает метод устойчивым к вариациям контраста.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;На практике мы применяем суррогатную функцию — нормированную кросс-корреляцию Lcorr(y, y_c), которая инвариантна к масштабу. Это позволяет игнорировать глобальные различия в амплитуде и контрасте, не несущие структурной информации, и фокусироваться на фазовой структуре и частотном составе изображения в полосе частот &lt;span class=\"yfm-latex\" data-content=\"%5COmega\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;h4 id=\"rendering-izobrazhenij-chastic-iz-atomnoj-struktury\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#rendering-izobrazhenij-chastic-iz-atomnoj-struktury\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Рендеринг изображений частиц из атомной структуры&lt;/span&gt;&lt;/a&gt;Рендеринг изображений частиц из атомной структуры&lt;/h4&gt;\n&lt;p&gt;Модель формирования изображения строится на основе атомной структуры &lt;span class=\"yfm-latex\" data-content=\"X%20%3D%20%5C%7B(x_i%2C%20e_i)%5C%7D_%7Bi%3D1%7D%5Em\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Потенциал каждого атома аппроксимируется изотропным гауссианом с амплитудой Z_i (атомный номер) и шириной σpx ≈ 0.45 пикселя. Проекция вычисляется аналитически без построения 3D-сетки: для заданной позы &lt;span class=\"yfm-latex\" data-content=\"%5Cphi%20%3D%20(R%2C%20t)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; атомы проецируются в 2D, а интеграл по площади пикселя выражается через функцию ошибок erf(x). Итоговое значение пикселя (p, q) получается суммированием вкладов всех атомов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Аналитический рендеринг позволяет быстро вычислять проекции атомов, используя свойства сепарабельности 2D-гауссианов, что значительно ускоряет процесс моделирования.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"funkciya-peredachi-kontrasta-ctf\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#funkciya-peredachi-kontrasta-ctf\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Функция передачи контраста (CTF)&lt;/span&gt;&lt;/a&gt;Функция передачи контраста (CTF)&lt;/h4&gt;\n&lt;p&gt;Мы моделируем контраст в рамках приближения слабой фазы, используя параметры дефокусировки d_u, d_v и астигматизм. Эффективная дефокусировка df(θ) зависит от угла в пространстве Фурье. Фаза CTF γ(ω) учитывает длину волны электронов λ, коэффициент сферической аберрации C_s и фазовый сдвиг &lt;span class=\"yfm-latex\" data-content=\"%5Cphi\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Итоговая функция G(ω) применяется к фурье-образу проекции, а для данных с исправленной фазой используется модуль /G(ω)/.&lt;/p&gt;\n&lt;h4 id=\"b-recovar-butstrep-agregirovannoe-naznachenie-klassov\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#b-recovar-butstrep-agregirovannoe-naznachenie-klassov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;B-RECOVAR: бутстреп-агрегированное назначение классов&lt;/span&gt;&lt;/a&gt;B-RECOVAR: бутстреп-агрегированное назначение классов&lt;/h4&gt;\n&lt;p&gt;В условиях априорной гетерогенности алгоритм требует начального распределения частиц по классам. Стандартные методы, такие как латентные координаты cryoDRGN или главные компоненты ковариации RECOVAR, часто дают сбои при малом количестве частиц на класс из-за влияния шума (движение, дефокус, подготовка образца). Для решения этой задачи используется B-RECOVAR — ансамблевый метод, основанный на бутстреп-подвыборках. Каждая итерация оценивает низкоразмерное подпространство остатков через регуляризованную обратную проекцию, кластеризует коэффициенты частиц и уточняет метки через перекрестную проверку. Итоговые метки агрегируются методом спектрального голосования, где нормированный отступ голосования служит показателем уверенности для каждой частицы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;B-RECOVAR повышает надежность классификации частиц, используя ансамблевый подход для фильтрации шума и оценки уверенности в принадлежности к классу.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"model-i-oboznacheniya\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#model-i-oboznacheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модель и обозначения&lt;/span&gt;&lt;/a&gt;Модель и обозначения&lt;/h4&gt;\n&lt;p&gt;Рассматривается набор из K изображений частиц, представляющих смесь n конформаций с плотностями &lt;span class=\"yfm-latex\" data-content=\"%5Crho_1%2C%20%5Cdots%2C%20%5Crho_n\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и долями π_j. Позы &lt;span class=\"yfm-latex\" data-content=\"%5Cphi_k\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и функции передачи контраста (CTF) G_k известны из консенсусного уточнения. Исходные данные ограничиваются фурье-оболочками &lt;span class=\"yfm-latex\" data-content=\"%5COmega_a\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (от kmin до kmax), где низкие частоты отвечают за контраст, а высокие — за шум. Оператор визуализации частицы k записывается как &lt;span class=\"yfm-latex\" data-content=\"A_k%20%3D%20G_k%20S_%7B%5Cphi_k%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, где &lt;span class=\"yfm-latex\" data-content=\"y_k%20%3D%20%5Calpha_k%5E*%20A_k%20%5Crho_%7Bc_k%7D%20%2B%20%5Cepsilon_k\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Здесь α_k^* — масштаб интенсивности, а ε_k — белый шум.&lt;/p&gt;\n&lt;h4 id=\"ostatochnoe-podprostranstvo\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#ostatochnoe-podprostranstvo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Остаточное подпространство&lt;/span&gt;&lt;/a&gt;Остаточное подпространство&lt;/h4&gt;\n&lt;p&gt;Отклонения классов &lt;span class=\"yfm-latex\" data-content=\"%5Cdelta_j%20%3D%20%5Crho_j%20-%20%5Cbar%7B%5Crho%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; образуют подпространство размерности q ≤ n-1. Остаток частицы r_k выражается как &lt;span class=\"yfm-latex\" data-content=\"r_k%20%5Capprox%20%5Csum_%7Bm%3D1%7D%5Eq%20b_%7Bcm%7D%20A_k%20U_m%20%2B%20%5Cepsilon'_k\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (ур. 14). При n=2 подпространство определяется вектором &lt;span class=\"yfm-latex\" data-content=\"%5CDelta%5Crho%20%3D%20%5Crho_1%20-%20%5Crho_2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Для оценки базиса W_m и коэффициентов  ildeb_k используется жадный алгоритм маскированного метода наименьших квадратов с дефляцией. Маска M подавляет вклад растворителя, повышая точность оценки. После подбора всех мод коэффициенты уточняются совместно для каждой частицы, после чего применяется k-means кластеризация.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод наименьших квадратов с дефляцией последовательно находит наиболее значимые компоненты (моды) структуры, «вычитая» их из данных на каждом шаге, чтобы выделить оставшиеся сигналы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"utochnenie-metodom-perekrestnoj-proverki\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#utochnenie-metodom-perekrestnoj-proverki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Уточнение методом перекрестной проверки&lt;/span&gt;&lt;/a&gt;Уточнение методом перекрестной проверки&lt;/h4&gt;\n&lt;p&gt;На каждой итерации частицы делятся на две группы (фолды) J и J'. Для каждого класса строится реконструкция $ ilde{\\rho}_j^F$ по одному фолду, а затем частицы из другого фолда F^c оцениваются через корреляцию &lt;span class=\"yfm-latex\" data-content=\"s_%7Bkj%7D%20%3D%20L_%7Bcorr%7D(%5Ccheck%7By%7D_k%2C%20A_k%20%20ilde%7B%5Crho%7D_j%5E%7BF%5Ec%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (ур. 15). Центрирование оценок внутри фолдов компенсирует различия в точности реконструкции. Этот подход исключает самокорреляцию, когда шум частицы влияет на её собственную реконструкцию.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод требует достаточного количества частиц в каждом классе для обоих фолдов, иначе &lt;a href=\"concepts/perekrestnaya-proverka.html\"&gt;перекрестная проверка&lt;/a&gt; может привести к нестабильным результатам.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ansamblevoe-golosovanie\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#ansamblevoe-golosovanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ансамблевое голосование&lt;/span&gt;&lt;/a&gt;Ансамблевое голосование&lt;/h4&gt;\n&lt;p&gt;При малом количестве частиц на конформацию подгонка в остаточном подпространстве может быть нестабильной (даже при n=2), так как случайные инициализации могут ошибочно принять «шумовое» направление за структурный сигнал. Для решения этой проблемы используется ансамблевое голосование: выполняется B рандомизированных реплик алгоритма 2, где каждая использует подмножество частиц I_b, выбранную полосу частот и независимую инициализацию. Метки классов  ildec^(b)_k выравниваются с помощью венгерского алгоритма для максимизации следа матрицы сопряженности относительно референсной реплики.&lt;/p&gt;\n&lt;p&gt;Для n=2 вычисляется сбалансированная точность &lt;span class=\"yfm-latex\" data-content=\"%5Cpsi_b\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и ковариация голосов v^(b)_k согласно формуле (16), где β = π₁ - π₂. Используя спектральный мета-обучатель, мы получаем веса &lt;span class=\"yfm-latex\" data-content=\"u%20%5Cin%20%5Cmathbb%7BR%7D%5EB\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, которые позволяют вычислить взвешенное голосование  ildev_k и показатель уверенности &lt;span class=\"yfm-latex\" data-content=\"%5Ckappa_k%20%3D%20%2F%20ilde%7Bv%7D_k%2F%20%2F%20%5Csum_%7Bb%3D1%7D%5EB%20%2Fu_b%2F\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. При n &amp;gt; 2 мета-обучатель применяется к индикаторам «один против всех», что позволяет оценивать уверенность через разность двух наибольших оценок классов &lt;span class=\"yfm-latex\" data-content=\"%5Cbar%7Bv%7D_%7Bk%2C(1)%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и &lt;span class=\"yfm-latex\" data-content=\"%5Cbar%7Bv%7D_%7Bk%2C(2)%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ансамблевое голосование повышает стабильность классификации при малых выборках, используя спектральный мета-анализ для агрегации результатов B=24 реплик и вычисления показателя уверенности κ_k.&lt;br /&gt;\n[!tip] Венгерский алгоритм — это метод оптимизации, используемый здесь для сопоставления меток классов между разными запусками алгоритма, чтобы они соответствовали друг другу.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sravnenie-s-recovar\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#sravnenie-s-recovar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сравнение с RECOVAR&lt;/span&gt;&lt;/a&gt;Сравнение с RECOVAR&lt;/h4&gt;\n&lt;p&gt;Методы RECOVAR и B-RECOVAR используют консенсусные позы и функции контраста (CTF), не требуя обучения нейронных сетей. В отличие от RECOVAR, который оценивает полную ковариацию объема, B-RECOVAR фокусируется только на n-1 модах отклонения классов, что позволяет избежать влияния «шумовых» вариаций, доминирующих при малом числе частиц. B-RECOVAR дополнительно применяет перекрестную уточняющую процедуру (уравнение 15), исключая самокорреляцию между частицей и объемом, с которым она сравнивается.&lt;/p&gt;\n&lt;h4 id=\"detali-realizacii\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#detali-realizacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Детали реализации&lt;/span&gt;&lt;/a&gt;Детали реализации&lt;/h4&gt;\n&lt;p&gt;Для анализа используются частоты от kmin=3 до &lt;span class=\"yfm-latex\" data-content=\"k_%7Bmax%7D%20%5Cin%20%5C%7B24%2C%2032%2C%2040%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; пикселей Фурье. Регуляризация λ_w установлена на уровне 0,1 от среднего диагонального элемента. Маска растворителя охватывает 8% вокселей с наибольшими значениями плотности и сглаживается гауссианом (стандартное отклонение 2 вокселя). Параметры включают T=8 итераций обновления, B=24 реплики и подвыборки частиц по 80%. При количестве менее 5000 частиц на конформацию, где полезный сигнал и шум составляют около 1,5% остаточной энергии, ансамблевая агрегация становится критически важной. Вычисления для 10⁴ частиц на сетке D=128 занимают около 10 минут процессорного времени.&lt;/p&gt;\n&lt;h4 id=\"giperparametry-i-detali-realizacii\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#giperparametry-i-detali-realizacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гиперпараметры и детали реализации&lt;/span&gt;&lt;/a&gt;Гиперпараметры и детали реализации&lt;/h4&gt;\n&lt;p&gt;Для всех экспериментов были установлены унифицированные гиперпараметры. Из-за ограничений оперативной памяти на каждом этапе оптимизации используется количество частиц, определяемое как &lt;span class=\"yfm-latex\" data-content=\"%5Cmin(%2FY%2F%2C%20128)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. В качестве алгоритма оптимизации применяется Adam с фиксированной скоростью обучения 0,06 и максимальной нормой градиента 0,6. Коэффициенты регуляризации для связей и столкновений установлены на уровне λbond = 10⁻³ и λcollision = 0,09 соответственно. Количество внешних итераций R составляет 3 для реальных данных и 5 для синтетических наборов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Adam — это адаптивный алгоритм оптимизации, который автоматически подстраивает скорость обучения для каждого параметра, что ускоряет сходимость нейронных сетей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Что касается априорного члена, то в предыдущих подходах логарифмическая вероятность &lt;span class=\"yfm-latex\" data-content=\"%5Clog%20p(Z%2Fa)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; была критически важна, так как без неё оптимизация могла уйти в области пространства эмбеддингов, нехарактерные для модели Pairformer. В текущей параметризации эта функция частично выполняется самим процессом репараметризации. Поскольку смещения в H передаются к обусловливающей переменной только через функцию g, они автоматически выражаются в базисе направлений, которые исходно поддерживаются архитектурой модели.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование репараметризации позволяет избежать деградации оптимизации, обеспечивая работу в пределах допустимого пространства эмбеддингов без необходимости введения дополнительных априорных ограничений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Таблица 5.&lt;/strong&gt; Сравнение Fold’EM и AlphaFold3&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Метрика&lt;/th&gt;\n&lt;th&gt;Метод&lt;/th&gt;\n&lt;th&gt;Значение 1&lt;/th&gt;\n&lt;th&gt;Значение 2&lt;/th&gt;\n&lt;th&gt;Значение 3&lt;/th&gt;\n&lt;th&gt;Значение 4&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Cα RMSD (↓, Å)&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Fold’EM&lt;/td&gt;\n&lt;td&gt;1.78&lt;/td&gt;\n&lt;td&gt;1.57&lt;/td&gt;\n&lt;td&gt;2.35&lt;/td&gt;\n&lt;td&gt;3.07&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Fold’EM&lt;/td&gt;\n&lt;td&gt;3.948&lt;/td&gt;\n&lt;td&gt;3.941&lt;/td&gt;\n&lt;td&gt;7.684&lt;/td&gt;\n&lt;td&gt;6.885&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;AlphaFold3&lt;/td&gt;\n&lt;td&gt;8.96&lt;/td&gt;\n&lt;td&gt;11.22&lt;/td&gt;\n&lt;td&gt;7.780&lt;/td&gt;\n&lt;td&gt;26.670&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;TM-score (↑)&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Fold’EM&lt;/td&gt;\n&lt;td&gt;0.969&lt;/td&gt;\n&lt;td&gt;0.976&lt;/td&gt;\n&lt;td&gt;0.948&lt;/td&gt;\n&lt;td&gt;0.917&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Fold’EM&lt;/td&gt;\n&lt;td&gt;0.9174&lt;/td&gt;\n&lt;td&gt;0.9182&lt;/td&gt;\n&lt;td&gt;0.810&lt;/td&gt;\n&lt;td&gt;0.809&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;AlphaFold3&lt;/td&gt;\n&lt;td&gt;0.699&lt;/td&gt;\n&lt;td&gt;0.661&lt;/td&gt;\n&lt;td&gt;0.7981&lt;/td&gt;\n&lt;td&gt;0.4772&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 8.&lt;/strong&gt; Показатели качества структуры MolProbity&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Показатель&lt;/th&gt;\n&lt;th&gt;Значение 1&lt;/th&gt;\n&lt;th&gt;Значение 2&lt;/th&gt;\n&lt;th&gt;Значение 3&lt;/th&gt;\n&lt;th&gt;Значение 4&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;MolProbity score&lt;/td&gt;\n&lt;td&gt;1.18&lt;/td&gt;\n&lt;td&gt;1.15&lt;/td&gt;\n&lt;td&gt;1.25&lt;/td&gt;\n&lt;td&gt;1.15&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;1.50&lt;/td&gt;\n&lt;td&gt;1.53&lt;/td&gt;\n&lt;td&gt;1.58&lt;/td&gt;\n&lt;td&gt;1.79&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Clashscore&lt;/td&gt;\n&lt;td&gt;3.72&lt;/td&gt;\n&lt;td&gt;3.64&lt;/td&gt;\n&lt;td&gt;4.83&lt;/td&gt;\n&lt;td&gt;3.56&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;1.21&lt;/td&gt;\n&lt;td&gt;2.35&lt;/td&gt;\n&lt;td&gt;1.56&lt;/td&gt;\n&lt;td&gt;2.21&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ramachandran outliers&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;0.25&lt;/td&gt
