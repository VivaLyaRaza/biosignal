;td&gt;28.81&lt;/td&gt;\n&lt;td&gt;16.64&lt;/td&gt;\n&lt;td&gt;27.73&lt;/td&gt;\n&lt;td&gt;27.73&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;AlphaFold3&lt;/td&gt;\n&lt;td&gt;8.21&lt;/td&gt;\n&lt;td&gt;19.29&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;PDB&lt;/td&gt;\n&lt;td&gt;3.39&lt;/td&gt;\n&lt;td&gt;3.47&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 15.&lt;/strong&gt; Оценка MolProbity для известных и ab initio структур&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Категория&lt;/th&gt;\n&lt;th&gt;Показатель&lt;/th&gt;\n&lt;th&gt;Значение 1&lt;/th&gt;\n&lt;th&gt;Значение 2&lt;/th&gt;\n&lt;th&gt;Значение 3&lt;/th&gt;\n&lt;th&gt;Значение 4&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Known&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;MolProbity score&lt;/td&gt;\n&lt;td&gt;1.16&lt;/td&gt;\n&lt;td&gt;1.13&lt;/td&gt;\n&lt;td&gt;1.09&lt;/td&gt;\n&lt;td&gt;1.11&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Clashscore&lt;/td&gt;\n&lt;td&gt;3.72&lt;/td&gt;\n&lt;td&gt;3.40&lt;/td&gt;\n&lt;td&gt;3.01&lt;/td&gt;\n&lt;td&gt;3.16&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Ramachandran outliers&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;0.12&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Ab initio&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;MolProbity score&lt;/td&gt;\n&lt;td&gt;1.39&lt;/td&gt;\n&lt;td&gt;1.48&lt;/td&gt;\n&lt;td&gt;1.44&lt;/td&gt;\n&lt;td&gt;1.46&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Clashscore&lt;/td&gt;\n&lt;td&gt;5.85&lt;/td&gt;\n&lt;td&gt;7.28&lt;/td&gt;\n&lt;td&gt;6.65&lt;/td&gt;\n&lt;td&gt;6.72&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Ramachandran outliers&lt;/td&gt;\n&lt;td&gt;0.12&lt;/td&gt;\n&lt;td&gt;0.12&lt;/td&gt;\n&lt;td&gt;0.12&lt;/td&gt;\n&lt;td&gt;0.25&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;p&gt;Fold’EM представляет собой метод совместного вывода ансамбля атомных структур и специфических для частиц мешающих переменных (нюанс-переменных) непосредственно из необработанных крио-ЭМ изображений. Каждый член ансамбля описывается промежуточным состоянием Pairformer, которое задает условия для диффузионной модели AlphaFold3, тогда как нюанс-переменные включают ориентацию (pose) и дискретный класс частицы. Процесс начинается с приведения частиц к общей системе координат, после чего алгоритм итеративно обновляет структурные состояния и уточняет нюанс-переменные. Реконструированные объемы используются исключительно для инициализации и выравнивания кадров (Рис. 1, Алгоритм 1).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f1.jpg\" alt=\"Рисунок 1: Fold’EM выводит атомные структуры непосредственно из разреженных изображений частиц крио-ЭМ.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Fold’EM выводит атомные структуры непосредственно из разреженных изображений частиц крио-ЭМ.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1: Fold’EM выводит атомные структуры непосредственно из разреженных изображений частиц крио-ЭМ. (A) Fold’EM чередует структурный вывод с уточнением позы и класса. (B) Данные частиц обратно распространяются в промежуточные состояния Pairformer H, фильтруя экспериментальные обновления через оставшиеся блоки Pairformer перед диффузией AlphaFold3. (C) Для комплекса интегрин–BIIG2 Fab (PDB 9B9J) AlphaFold3 предсказывает отдельные компоненты, но размещает Fab в неправильном сайте связывания. (D) Ab initio Fold’EM восстанавливает связанный комплекс и эпитоп всего из 1000 частиц — 0,26% от использованных для депонированной реконструкции — с RMSD 2,49 Å, TM-score 0,956 и разрешением FSC 3,52 Å (депонированная карта: 2,6 Å).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"vhodnye-dannye,-inicializaciya-i-sistema-koordinat\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#vhodnye-dannye,-inicializaciya-i-sistema-koordinat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Входные данные, инициализация и система координат&lt;/span&gt;&lt;/a&gt;Входные данные, инициализация и система координат&lt;/h4&gt;\n&lt;p&gt;Входными данными для Fold’EM служат набор изображений частиц и аминокислотная последовательность целевого объекта. Предполагается, что размер пикселя/бокса и параметры функции контрастной передачи (CTF) известны, а частицы центрированы. Последовательность является единственным структурным входом; AlphaFold3 строит MSA и делает предсказание без использования сторонних атомных моделей или высокоразрешенных реконструкций. Для гетерогенных данных задается число классов n, для гомогенных n=1.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Крио-ЭМ (криоэлектронная микроскопия) — метод визуализации биомолекул, при котором образцы быстро замораживаются, что позволяет изучать их в нативном состоянии.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Оценка ориентации (pose) в ab initio режиме проходит в три этапа: (i) VDAM (алгоритм градиентного спуска с адаптивными моментами) оценивает грубый объем и ориентации частиц из случайной инициализации; (ii) реконструкция консенсусной плотности методом Винеровской обратной проекции; (iii) стыковка предсказания AlphaFold3 в эту плотность для задания структурной системы координат. Поскольку крио-ЭМ правдоподобие инвариантно к глобальным жестким преобразованиям, решение определяется с точностью до глобального преобразования SE(3), которое фиксируется путем выражения всех ориентаций относительно состыкованной структуры.&lt;/p&gt;\n&lt;h4 id=\"vlozhenie-i-klassifikaciya-chastic\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#vlozhenie-i-klassifikaciya-chastic\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вложение и классификация частиц&lt;/span&gt;&lt;/a&gt;Вложение и классификация частиц&lt;/h4&gt;\n&lt;p&gt;При неизвестных метках классов мы используем B-RECOVAR (bootstrapped residual-subspace estimator). В отличие от методов cryoDRGN или RECOVAR, которые при малом количестве частиц не всегда надежно разделяют классы, B-RECOVAR для двух состояний: (i) подгоняет объемы отклонений классов к остаткам консенсусной реконструкции, ограниченным маской растворителя; (ii) уточняет назначения через перекрестную проверку с реконструкциями по классам; (iii) объединяет результаты рандомизированных подвыборок и частотных полос с помощью спектрального мета-обучающего алгоритма. Для более чем двух состояний используется дефляция, а для непрерывной гетерогенности — интерпретация мод как направлений изменчивости. После классификации для каждого класса строится вспомогательный объем для синхронизации ориентаций частиц (Алгоритм 2, Приложение D.4).&lt;/p&gt;\n&lt;h4 id=\"ansamblevyj-vyvod\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#ansamblevyj-vyvod\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ансамблевый вывод&lt;/span&gt;&lt;/a&gt;Ансамблевый вывод&lt;/h4&gt;\n&lt;p&gt;Процесс вывода структуры основан на использовании набора частиц, эталонной структуры и их взаимных ориентаций (поз). Для гетерогенных образцов данные классифицируются, а позы синхронизируются с соответствующими классами. Уравнение 2 связывает структурные состояния H с мешающими переменными &lt;span class=\"yfm-latex\" data-content=\"%5Ceta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (позы и классы частиц), оптимизация которых проводится методом чередующегося координатного спуска. На каждой итерации r алгоритм сначала обновляет структуру H^(r+1) при фиксированных &lt;span class=\"yfm-latex\" data-content=\"%5Ceta%5E%7B(r)%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, а затем уточняет переменные &lt;span class=\"yfm-latex\" data-content=\"%5Ceta%5E%7B(r%2B1)%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; при фиксированной структуре X^(r+1).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод чередующегося координатного спуска — это итеративный алгоритм оптимизации, который поочередно улучшает одну группу параметров, фиксируя остальные, что позволяет эффективно решать сложные задачи с множеством взаимозависимых переменных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;На первом этапе (вывод структуры) обновление H^(r+1) происходит через максимизацию логарифмического правдоподобия (Уравнение 3). Мы используем подход, аналогичный IT-Opt, где градиенты правдоподобия пробрасываются в латентные состояния AlphaFold3. В качестве генеративной модели используется диффузионный процесс (Уравнения 4), где обратная диффузия от X_T ~ N(0, σ²_T I) до t=0 формирует структуру, обусловленную g(H). Для каждой итерации выполняется Q независимых запусков диффузии, при этом H сохраняется как «память» между запусками. На каждом шаге t латентные состояния обновляются градиентным подъемом (Уравнение 5) с шагом γ_h, что смещает генератор AlphaFold в сторону конфигураций, подтверждаемых экспериментальными данными.&lt;/p&gt;\n&lt;p&gt;На втором этапе (вывод мешающих переменных) структура X^(r+1) фиксируется, и максимизируется правдоподобие для каждой частицы k (Уравнение 6). Это включает уточнение позы &lt;span class=\"yfm-latex\" data-content=\"%5Cphi_k\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (выравнивание частицы относительно текущих структур) и класса c_k (отнесение частицы к наиболее подходящему члену ансамбля). Позы выражаются в системе координат эталона, что устраняет неопределенность глобальной калибровки SE(3). Чередование этих двух шагов критически важно при низком соотношении сигнал/шум, так как ошибки в позах или классификации могут искажать структурные градиенты, и наоборот. Хотя из-за стохастической природы диффузии и использования мини-батчей монотонное улучшение целевой функции не гарантировано, данный подход служит надежным каркасом для совместного вывода структуры и параметров частиц.&lt;/p&gt;\n&lt;h4 id=\"eksperimenty\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#eksperimenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эксперименты&lt;/span&gt;&lt;/a&gt;Эксперименты&lt;/h4&gt;\n&lt;p&gt;Мы оцениваем работу Fold’EM на синтетических частицах, полученных из известных структур, и на экспериментальных наборах данных из EMPIAR (Таблицы A2 и A1). В разделах 4.1 и 4.2 мы изолированно тестируем два ключевых проектных решения: использование прямого руководства по частицам вместо реконструкции плотности и оптимизацию промежуточного состояния Pairformer вместо финального эмбеддинга или атомных координат. Разделы 4.3 и 4.4 оценивают определение структуры для гомогенных образцов и смесей двух состояний, сначала с известными ориентациями (для проверки точности вывода структуры), а затем ab initio, где ориентации и классы определяются из частиц согласно разделу 3.1. В режиме известных ориентаций используются параметры, примененные для рендеринга синтетических частиц или полученные при консенсусном уточнении экспериментальных данных. Раздел 4.5 оценивает работу B-RECOVAR для классификации без меток, а 4.6 — для непрерывной гетерогенности. Если не указано иное, мы приводим Cα RMSD и TM-score относительно эталонной модели, а также разрешение, при котором корреляция оболочек Фурье (FSC) пересекает порог 0.143 (Приложение D.2.4). Базовыми методами для плотностных данных являются RELION и cryoDRGN (с известными ориентациями), а также RELION ab initio и cryoDRGN-AI (без них). Также мы приводим результаты AlphaFold3 без экспериментального руководства в качестве контроля.&lt;/p&gt;\n&lt;h4 id=\"rukovodstvo-po-chasticam-protiv-rukovodstva-po-plotnosti\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#rukovodstvo-po-chasticam-protiv-rukovodstva-po-plotnosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Руководство по частицам против руководства по плотности&lt;/span&gt;&lt;/a&gt;Руководство по частицам против руководства по плотности&lt;/h4&gt;\n&lt;p&gt;Экспериментальная установка. Мы проверяем, обеспечивает ли руководство по отдельным частицам более точное восстановление структуры, чем руководство по реконструированной плотности при равном количестве частиц. Для этого мы используем синтетическую сборку 8U4E (3 304 остатка) и проводим ab initio вывод по 500 частицам при SNR 0.005. Консенсусная плотность реконструируется по оцененным ориентациям. Базовый метод (руководство по плотности) оптимизирует то же состояние Pairformer, но заменяет функцию правдоподобия частиц на потерю относительно консенсусной плотности.&lt;/p&gt;\n&lt;p&gt;Результаты. При равном количестве частиц руководство по частицам восстанавливает сборку, а по плотности — нет. Прогноз AlphaFold3 без руководства дает Cα RMSD 22.99 Å. Руководство по плотности снижает этот показатель до 17.95 Å, тогда как Fold’EM достигает 6.88 Å с TM-score 0.809 (Таблица A12), точно следуя огибающей плотности (Рис. 2). При 500 частицах плотность получается грубой, что делает её недостаточной для замены функции правдоподобия частиц.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f2.jpg\" alt=\"Рисунок 2: Направляемое частицами восстановление структуры, тогда как направление по их реконструированной ESP терпит не\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: Направляемое частицами восстановление структуры, тогда как направление по их реконструированной ESP терпит неудачу.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 2: Направляемое частицами восстановление структуры, тогда как направление по их реконструированной ESP терпит неудачу. Ab initio вывод на синтетическом 8U4E (3304 остатка) из 500 частиц при SNR 0,005. Серая поверхность — это консенсусная плотность, реконструированная из этих частиц при оцененных позах, а числа — Cα RMSD к депонированной модели. (A) Депонированная модель. (B) AlphaFold3 неправильно размещает домены сборки. (C) Направление по ESP оптимизирует то же состояние Pairformer с теми же частицами, позами и оптимизатором, но заменяет правдоподобие частиц функцией потерь относительно консенсусной плотности и улучшает предсказание, не восстанавливая расположение. (D) Fold’EM, направляемый правдоподобием частиц, восстанавливает его с TM-score 0,81 против 0,48 у AlphaFold3.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SNR (отношение сигнал/шум) — показатель качества данных; чем ниже значение, тем сложнее выделить полезный сигнал из фонового шума микроскопа.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"optimizaciya-h-protiv-z-i-koordinatnogo-prostranstva\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#optimizaciya-h-protiv-z-i-koordinatnogo-prostranstva\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оптимизация H против Z и координатного пространства&lt;/span&gt;&lt;/a&gt;Оптимизация H против Z и координатного пространства&lt;/h4&gt;\n&lt;p&gt;Экспериментальная установка. Мы сравниваем эффективность оптимизации промежуточного состояния Pairformer (H) с оптимизацией финального эмбеддинга (Z) или прямым воздействием на атомные координаты. Тесты проводились на синтетических сборках 9UGB и 8U4B (SNR 0.005, 250 или 1 000 частиц, известные ориентации). Мы сравниваем Fold’EM с методами IT-Opt и координатным руководством обратного диффузионного процесса.&lt;/p&gt;\n&lt;p&gt;Результаты. Оптимизация H обеспечивает наиболее сильное руководство. Все три метода улучшают прогноз AlphaFold3 для 9UGB, но Fold’EM показывает лучшие Cα RMSD, TM-score и разрешение FSC. На более крупной сборке 8U4B только Fold’EM восстанавливает структуру, тогда как другие методы ухудшают исходный прогноз (Рис. 3). Разница наиболее заметна на крупных сборках, где нефильтрованные обновления Z или координат уводят модель от эталона.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f3.jpg\" alt=\"Рисунок 3: Оптимизация промежуточного состояния Pairformer улучшает направление на уровне частиц.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3: Оптимизация промежуточного состояния Pairformer улучшает направление на уровне частиц.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 3: Оптимизация промежуточного состояния Pairformer улучшает направление на уровне частиц. Мы сравниваем три способа управления AlphaFold3 с тем же правдоподобием частиц, позами и подмножествами частиц: Fold’EM, который оптимизирует промежуточное состояние Pairformer H и передает обновления через финальные блоки Pairformer; IT-Opt (Maddipatla et al., 2026a), который оптимизирует терминальный эмбеддинг Z непосредственно при изотропном априорном распределении; и направление в координатном пространстве процесса обратной диффузии (Maddipatla et al., 2026b). Ряды: синтетические 8U4B и 9UGB из таблицы A2 при SNR 0,005 с известными позами, с использованием 250 и 1000 частиц. Столбцы: Cα-RMSD (↓, логарифмическая шкала) и TM-score (↑) относительно депонированной модели PDB; пунктирная линия отмечает предсказание AlphaFold3. На обеих мишенях Fold’EM значительно превосходит обе альтернативы и достигает почти атомного соответствия с депонированной моделью; изученная геометрия, индуцированная оптимизацией H, таким образом, сохраняет стабильность направления на уровне частиц при низком SNR и на крупных сборках.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"rukovodstvo-po-rabote-s-gomogennymi-vyborkami\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#rukovodstvo-po-rabote-s-gomogennymi-vyborkami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Руководство по работе с гомогенными выборками&lt;/span&gt;&lt;/a&gt;Руководство по работе с гомогенными выборками&lt;/h4&gt;\n&lt;p&gt;Экспериментальный дизайн. Исследователи оценили минимальное количество частиц, необходимое для определения структуры одного конформационного состояния, используя как известные ориентации (poses), так и метод ab initio. В качестве синтетических мишеней (Таблица A2) использовали структуры 9UGB, 9UGC, 8U4B и 8U4E при соотношении сигнал/шум (SNR) 0.01 и 0.005. Для известных ориентаций применяли от 100 до 1000 частиц, для ab initio — 500 частиц. Также протестировали пять экспериментальных наборов данных (Таблица A1): интегрин α 5β 1 с Fab-фрагментом BIIG2 (9B9J), 9B77, 8PWH и два состояния UvrA (9GXQ, 9GXR). При известных ориентациях использовали от 1/1000 до 1/50 от общего числа депонированных частиц; для ab initio — 1000 частиц для 9B9J и 9B77, и 5000 для остальных. Сравнение проводилось с базовыми методами, где FSC рассчитывался по реконструированной плотности, тогда как для Fold’EM — по модели, полученной из атомной структуры.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод ab initio (с лат. «с начала») — это способ построения структуры «с нуля», без использования априорных шаблонов или известных ориентаций частиц, что требует значительно больших вычислительных мощностей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Результаты. На синтетических данных 100 частиц с известными ориентациями оказались достаточны. AlphaFold3 ошибочно предсказал конформацию Pma1 (9UGB, TM-score 0.699, Cα RMSD 8.96 Å; Рис. 4A). Fold’EM при 100 частицах и SNR 0.005 достиг разрешения 3.25 Å (FSC), TM-score 0.965 и Cα RMSD 1.01 Å, что сопоставимо с депонированной моделью (3.39 Å; Таблицы A5, A6). Для 9UGC, 8U4B и 8U4E получены разрешения 3.45, 3.80 и 4.18 Å при TM-score 0.983, 0.979 и 0.973. Методы cryoDRGN и RELION показали худшие результаты (разрешение &amp;gt; 5 Å). Увеличение числа частиц до 1000 незначительно улучшило показатели Fold’EM. В режиме ab initio 500 частиц для 9UGB обеспечили разрешение 3.25 Å (SNR 0.005, TM-score 0.976, Cα RMSD 1.57 Å), тогда как RELION и cryoDRGN-AI показали 8.93 и 27.70 Å (Таблицы A11, A12).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f4.jpg\" alt=\"Рисунок 4: Fold’EM восстанавливает атомные структуры из 0,03% депонированных частиц с известными позами и из 0,27% ab in\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4: Fold’EM восстанавливает атомные структуры из 0,03% депонированных частиц с известными позами и из 0,27% ab initio.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 4: Fold’EM восстанавливает атомные структуры из 0,03% депонированных частиц с известными позами и из 0,27% ab initio. Каждый столбец — одна мишень: синтетический набор данных слева (A, C, E, G) и экспериментальный справа (B, D, F, H). Ряды показывают структуры (A, B; AlphaFold3 синим, Fold’EM красным, депонированная модель серым), репрезентативные частицы (C, D), разрешение FSC (E, F) и TM-score относительно депонированной модели (G, H) в зависимости от количества частиц; закрашенные маркеры обозначают известные позы, незакрашенные — ab initio, пунктирная линия — предсказание AlphaFold3. Слева: Pma1, дрожжевая плазматическая H+-АТФаза, в активированном (E2P) состоянии (9UGB); синтетические частицы при SNR 0,005. AlphaFold3 предсказывает трансмембранный домен, но неправильно размещает цитозольные A-, N- и P-домены, расположение которых меняется в ходе каталитического цикла (TM-score 0,70). Fold’EM восстанавливает депонированное состояние, достигая 3,3 Å и TM-score 0,97 из 100 частиц с известными позами и 3,3 Å из 500 частиц ab initio. Справа: Интегрин α5β1–BIIG2 (9B9J, EMPIAR-12552), где AlphaFold3 предсказывает оба фолда компонентов, но размещает Fab в неправильном сайте (TM-score 0,78); антитело-антигенные пары предоставляют мало парной коэволюционной информации. Fold’EM восстанавливает связанный комплекс и эпитоп, хотя и не интерфейсные вариабельные петли, достигая 3,5 Å и TM-score 0,97 из 100 частиц с известными позами и 3,5 Å из 1000 частиц ab initio; ни один базовый метод не достигает 6 Å, и Fold’EM превосходит AlphaFold3 даже при наименьшем количестве частиц. Разреженные данные частиц, таким образом, корректируют глобальное расположение, в значительной степени обеспеченное структурным априорным знанием. Разрешение (Å; FSC = 0,143).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;На экспериментальных данных Fold’EM успешно уточняет структуру при наличии базовых предсказаний. В случае 9B9J AlphaFold3 неверно расположил Fab-фрагмент (Рис. 4B), однако Fold’EM с 400 частицами (ab initio) определил верный эпитоп, достигнув разрешения лучше 3.5 Å и TM-score &amp;gt; 0.9 (Рис. 4F, 4H), тогда как базовые методы не преодолели порог 6 Å. Для 9B77, 9GXQ и 9GXR при 1/1000 от общего числа частиц Fold’EM достиг разрешений 2.88, 3.08 и 3.18 Å (Таблица A3). Исключением стал 8PWH: хотя Fold’EM повысил TM-score с 0.397 до 0.900 (Таблица A4), при использовании более 1/100 частиц cryoDRGN и RELION показали более высокое разрешение (5.16–5.01 Å против 7.06–6.13 Å).&lt;/p&gt;\n&lt;h4 id=\"analiz-pri-dvuh-sostoyaniyah-geterogennosti\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#analiz-pri-dvuh-sostoyaniyah-geterogennosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ при двух состояниях гетерогенности&lt;/span&gt;&lt;/a&gt;Анализ при двух состояниях гетерогенности&lt;/h4&gt;\n&lt;p&gt;Экспериментальный дизайн. Авторы исследовали возможность разделения двух конформационных состояний из смешанного набора частиц. Использовались как синтетические данные (смесь состояний Pma1: 9UGB и 9UGC, различие 9 Å по Cα RMSD, SNR 0.01 и 0.005, выборки 250–1000 частиц), так и экспериментальные (EMPIAR-13396, UvrA на ДНК с абакным сайтом: 9GXQ и 9GXR, выборки 500–10 000 частиц). В режиме ab initio метод B-RECOVAR инициализирует метки классов, а Fold’EM итеративно уточняет структуру, позы и классы, используя для каждого члена ансамбля наиболее достоверную половину частиц. Базовые методы (RELION, cryoDRGN) сначала кластеризуют частицы, а затем реконструируют плотность для каждого подмножества.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SNR (Signal-to-Noise Ratio) — отношение сигнал/шум; чем ниже этот показатель, тем сложнее восстановить структуру из-за высокого уровня помех.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Результаты. На синтетических данных для разделения состояний достаточно нескольких сотен частиц. AlphaFold3 не восстановил ни одно из них (TM-score 0.699 и 0.661; Рис. 5). При известных позах Fold’EM достигает разрешения 3.3 и 3.5 Å (TM-score 0.96 и 0.98) при SNR 0.005 и 250 частицах (Таблицы A19, A20). В тех же условиях RELION дает разрешение хуже 7.9 Å, а cryoDRGN требует 1000 частиц для достижения 3.6 и 4.8 Å. В режиме ab initio Fold’EM при SNR 0.005 и 500 частицах достигает 3.4 и 3.6 Å (TM-score 0.95 и 0.94), что лишь на 0.1 Å хуже результатов с известными позами (Таблицы A21, A22). RELION ab initio и cryoDRGN-AI показывают результаты хуже 6.9 и 16.6 Å соответственно. При 250 частицах и SNR 0.005 состояние 9UGB деградирует до 7.6 Å, что является пределом для совместного вывода параметров.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f5.jpg\" alt=\"Рисунок 5: Fold’EM разрешает оба состояния синтетической смеси 9UGB/9UGC из 250 частиц на состояние с известными позами \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5: Fold’EM разрешает оба состояния синтетической смеси 9UGB/9UGC из 250 частиц на состояние с известными позами и из 500 ab initio.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 5: Fold’EM разрешает оба состояния синтетической смеси 9UGB/9UGC из 250 частиц на состояние с известными позами и из 500 ab initio. Pma1 — это плазматическая протонная помпа дрожжей, P-тип АТФазы, чьи цитозольные A-, N- и P-домены перестраиваются в ходе каталитического цикла; 9UGB — активированное (E2P) состояние, а 9UGC — автоингибированное состояние. Частицы визуализированы из двух депонированных конформаций, различающихся примерно на 9 Å по Cα RMSD, и смешаны в равной пропорции при SNR 0,005. На каждой панели 9UGB слева, а 9UGC справа. (A) AlphaFold3 (синий) поверх депонированных моделей (серый) не восстанавливает ни одно из состояний (TM-score 0,70 и 0,66): трансмембранный домен предсказан верно, ошибка ограничена цитозольными доменами, расположение которых зависит от состояния цикла. (B) Fold’EM (красный) с известными позами разрешает оба из смешанного стека в 1000 частиц (500 на состояние). (C) Fold’EM ab initio разрешает оба из 2000 частиц (1000 на состояние). (D) Репрезентативные частицы каждого состояния. (E, F) Разрешение FSC (сверху) и TM-score относительно депонированной модели (снизу) в зависимости от количества частиц на состояние для 9UGB (E) и 9UGC (F); закрашенные маркеры обозначают известные позы, незакрашенные — ab initio, пунктирная серая линия — разрешение депонированной модели, пунктирная синяя линия — предсказание AlphaFold3.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Для UvrA успех зависит от точности исходного предсказания. AlphaFold3 предсказывает 9GXR (3.54 Å, TM-score 0.886), но не 9GXQ (11.69 Å, TM-score 0.734). При известных позах Fold’EM достигает 3.09 и 2.95 Å (Таблица A15), тогда как cryoDRGN — 4.34 и 4.41 Å, а RELION — 6.89 и 10.75 Å. В режиме ab initio Fold’EM восстанавливает 9GXR до 3.58 Å (500 частиц) и 3.02 Å (5000 частиц). Состояние 9GXQ восстанавливается при 10 000 частиц до 4.63 Å (TM-score 0.836; Рис. 6; Таблицы A17, A18). RELION и cryoDRGN-AI остаются хуже 8 Å. Разница в требуемом количестве частиц объясняется тем, что состояние 9GXQ отсутствует в исходном предсказании AlphaFold3.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f6.jpg\" alt=\"Рисунок 6: Fold’EM разрешает обе конформации UvrA–ДНК из 0,5% депонированных частиц с известными позами и из 5% ab initi\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 6: Fold’EM разрешает обе конформации UvrA–ДНК из 0,5% депонированных частиц с известными позами и из 5% ab initio.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 6: Fold’EM разрешает обе конформации UvrA–ДНК из 0,5% депонированных частиц с известными позами и из 5% ab initio. EMPIAR-13396 содержит два состояния UvrA, связанных с ДНК, содержащей абазитный сайт (PDB 9GXQ/9GXR); распознавание повреждений включает вставку клина Y62/Q65/F66 в дуплекс. (A) AlphaFold3 восстанавливает 9GXR, но не 9GXQ (TM-score 0,734). (B, C) Fold’EM разрешает оба состояния из 1000 частиц на состояние с известными позами и из 10 000 частиц на состояние ab initio (слева: 9GXQ, справа: 9GXR). (D) Репрезентативные частицы. (E) FSC в зависимости от количества частиц на состояние (закрашенные: известные позы; пустые: ab initio). С известными позами Fold’EM достигает 3,1/3,0 Å из 1000 частиц на состояние; ab initio он достигает 3,0 Å для 9GXR и 4,6 Å для 9GXQ, в то время как RELION и cryoDRGN-AI остаются выше 8 Å. (F) TM-score относительно депонированных моделей. (G) AlphaFold3 сохраняет полностью спаренный дуплекс, тогда как Fold’EM восстанавливает вставку клина и нарушенную ДНК, но не вывернутый нуклеотид, как и ожидалось, поскольку повреждение было подано в обе модели как интактная ДНК. Разрешение (Å; FSC = 0,143).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Восстановленные структуры функционально значимы: Fold’EM корректно определяет вставку клина (Y62, Q65, F66) в дуплекс ДНК и сопутствующую деформацию, в отличие от AlphaFold3, предсказывающего каноническую структуру (Рис. 6G).&lt;/p&gt;\n&lt;h4 id=\"klassifikaciya-bez-metok-s-pomoshyu-b-recovar\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#klassifikaciya-bez-metok-s-pomoshyu-b-recovar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Классификация без меток с помощью B-RECOVAR&lt;/span&gt;&lt;/a&gt;Классификация без меток с помощью B-RECOVAR&lt;/h4&gt;\n&lt;p&gt;Экспериментальная установка. Гетерогенные эксперименты зависят от исходных меток классов. Мы исследовали возможность классификации частиц без использования опорных структур при малом количестве частиц, когда существующие методы встраивания (embeddings) работают ненадежно. Для оценки мы использовали набор данных UvrA (EMPIAR-13396), варьируя количество частиц от 250 до 5000 на состояние (от 0,13% до 2,6% от общего числа депонированных частиц). Для каждого размера выборки проводилось десять случайных итераций с использованием поз из консенсусного уточнения, после чего результаты сравнивались с исходными метками. Мы сопоставили B-RECOVAR с методом RECOVAR и cryoDRGN (медиана по десяти запускам). Абляция B-RECOVAR проводилась при 1000 частиц на состояние.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Абляция — это метод анализа модели, при котором последовательно отключаются или изменяются её отдельные компоненты, чтобы понять вклад каждого из них в итоговый результат.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Результаты. Начиная с 500 частиц на состояние, B-RECOVAR демонстрирует более высокую точность и стабильность по сравнению с аналогами (Рис. 7A). У RECOVAR при таких объемах данных направление ковариации сильно зависит от случайной выборки частиц, из-за чего точность варьируется от случайной до почти идеальной. B-RECOVAR при 250 частицах менее точен, но при 5000 достигает 92,5% точности с разбросом менее 1 процентного пункта; cryoDRGN во всех случаях показывает более низкие результаты. Нормализованный маржин κ ансамбля служит показателем уверенности: точность монотонно растет с его увеличением, достигая 80% в высшем бине (44% частиц) (Рис. 7B). Метод Fold’EM использует этот показатель для фильтрации: отсечение половины наименее уверенных частиц увеличивает разделение между конформациями (измеряемое через Cα RMSD) и повышает TM-score относительно депонированных моделей (Таблица A26).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f7.jpg\" alt=\"Рисунок 7: B-RECOVAR присваивает частицам конформационные состояния более точно и надежно, чем RECOVAR и cryoDRGN при ма\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 7: B-RECOVAR присваивает частицам конформационные состояния более точно и надежно, чем RECOVAR и cryoDRGN при малом количестве частиц, а его показатель достоверности упорядочивает присвоения по их надежности.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 7: B-RECOVAR присваивает частицам конформационные состояния более точно и надежно, чем RECOVAR и cryoDRGN при малом количестве частиц, а его показатель достоверности упорядочивает присвоения по их надежности. Беспризнаковое назначение классов для комплекса белок-ДНК UvrA (EMPIAR-13396, 9GXQ против 9GXR), оцененное по депонированным меткам. (A) Точность как функция количества частиц на состояние, от 250 до 5000, то есть 0,13–2,6% частиц, депонированных для каждого состояния. Ящики суммируют десять случайных выборок для каждого размера, общих для B-RECOVAR и RECOVAR; треугольники отмечают cryoDRGN. Оценщик RECOVAR плохо обусловлен при таких размерах выборки, и его точность варьируется от случайной до почти идеальной между выборками одного размера; B-RECOVAR отстает от него по количеству частиц, но является более точным и заметно более стабильным, начиная с 500 частиц, а cryoDRGN остается ниже B-RECOVAR на всем протяжении. (B) Точность B-RECOVAR, стратифицированная по его показателю достоверности κk, нормализованному маржину ансамблевого голосования (Приложение D.4). Процент в каждом столбце — это доля частиц в этом бине; сплошная линия — точность по всем частицам, пунктирная — случайная. Точность монотонно возрастает с достоверностью, поэтому показатель ранжирует частицы по надежности их метки; Fold’EM использует это упорядочивание, чтобы направлять каждого члена ансамбля с помощью более достоверной половины своих частиц (Таблица A26). (C, D) Абляция оценщика при 1000 частиц на состояние. Базовый оценщик — это единичная подгонка ранга один к остаткам после вычитания консенсуса, одномерная подгонка RECOVAR без коррекции шума, которая улучшается за счет ограничения моды маской растворителя, перекрестно-проверенным уточнением меток и ансамблированием реплик по подвыборкам частиц, частотным полосам и инициализациям. (C) Точность каждого этапа с планками погрешностей по повторяющимся выборкам. (D) Распределение оценки класса для каждой частицы на каждом этапе для частиц обоих состояний с их разделением d′, разницей двух средних в единицах объединенного стандартного отклонения. Каждый шаг увеличивает разделение между состояниями, и ансамбль обеспечивает наибольший прирост.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Анализ компонентов (Рис. 7C, D) показал, что базовый оценщик (аналог одномерного RECOVAR без коррекции шума и маски растворителя) достигает 63,8% точности (d'=0,54). Ограничение области подбора маской растворителя повышает точность до 69,1%, а уточнение меток через перекрестную проверку с реконструкциями классов — до 72,1%. Наибольший прирост дает ансамблирование по подмножествам частиц, частотным полосам и инициализациям, что доводит точность до 80,6% и увеличивает разделение состояний с d'=1,13 до d'=2,33.&lt;/p&gt;\n&lt;h4 id=\"rukovodstvo-pri-nepreryvnoj-geterogennosti\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#rukovodstvo-pri-nepreryvnoj-geterogennosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Руководство при непрерывной гетерогенности&lt;/span&gt;&lt;/a&gt;Руководство при непрерывной гетерогенности&lt;/h4&gt;\n&lt;p&gt;Экспериментальный дизайн. Мы исследовали, можно ли представить непрерывную конформационную траекторию с помощью небольшого числа оптимизированных состояний Pairformer и их интерполяции. Для анализа использовался набор данных IgG-1D из CryoBench, включающий 100 эталонных атомных моделей, полученных из PDB 1HZH путем поворота одного Fab-домена вокруг шарнира на 360°. Было сгенерировано 25 000 синтетических частиц (SNR 0,01, по 250 на состояние) с известными ориентациями и функциями контрастной передачи (CTF). Каждую частицу встраивали в трехмерное конформационное пространство, используя три метода: латентное пространство VAE (cryoDRGN), главные компоненты RECOVAR и вложение в остаточное подпространство B-RECOVAR. В каждом случае мы фиксировали восемь опорных конформаций вдоль траектории и оптимизировали структуру Pairformer для 250 ближайших частиц. Это дало восемь независимых состояний &lt;span class=\"yfm-latex\" data-content=\"H_1%2C%20%5Cdots%2C%20H_8\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Промежуточные состояния H(α) вычислялись как выпуклая комбинация соседних опорных точек с кусочно-линейными коэффициентами c_k(α). Для каждой из 100 моделей проводилась обратная диффузия с уточнением в пространстве координат и последующей релаксацией (Рис. 8).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f8.jpg\" alt=\"Рисунок 8: Fold’EM разрешает непрерывную гетерогенность комплекса антител IgG.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 8: Fold’EM разрешает непрерывную гетерогенность комплекса антител IgG.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 8: Fold’EM разрешает непрерывную гетерогенность комплекса антител IgG. (A) В качестве ансамблей показаны 100 синтетических моделей CryoBench IgG-1D, соответствующих истине, окрашенных по углу шарнира; и (B) соответствующие структуры, восстановленные Fold’EM с классификацией частиц B-RECOVAR. На врезке изображены две главные компоненты оптимизированных состояний Pairformer, наложенные на вложение частиц B-RECOVAR. (C) TM-score и (D) Fourier NCC, построенные как функция угла шарнира для трех конформационных координат.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VAE (вариационный автокодировщик) — это нейросеть, которая сжимает сложные данные (например, изображения частиц) в компактное «латентное» пространство, позволяя находить скрытые закономерности, такие как непрерывные изменения формы белка.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Результаты. Восемь опорных точек оказались достаточными для описания траектории. В случае B-RECOVAR медианный NCC (коэффициент кросс-корреляции) составил 92% от эталонного, а медианный TM-score — 0,93, что сопоставимо с самими опорными точками (89% и 0,91). Для cryoDRGN показатели составили 85% и 0,89, для RECOVAR — 90% и 0,92 (Рис. 8). Главные компоненты состояний Pairformer сохраняют порядок углов поворота шарнира для всех трех методов (Рис. 9). Стереохимическое качество представлено в Таблице A25. Таким образом, конформационная организация частиц отражается в представлении AlphaFold, позволяя описывать непрерывные движения малым числом состояний.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f9.jpg\" alt=\"Рисунок 9: Оптимизированные состояния Pairformer сохраняют упорядочивание по углу шарнира для всех трех конформационных \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 9: Оптимизированные состояния Pairformer сохраняют упорядочивание по углу шарнира для всех трех конформационных координат.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 9: Оптимизированные состояния Pairformer сохраняют упорядочивание по углу шарнира для всех трех конформационных координат. Мы показываем геометрию и сгенерированные структуры для каждого из трех классификаторов частиц: cryoDRGN, RECOVAR и B-RECOVAR. Слева от каждой панели: две главные компоненты оптимизированных состояний Pairformer с восемью якорями в виде больших точек и интерполированными состояниями в виде маленьких точек, наложенные на координаты для каждой частицы соответствующего метода, отображенные в той же плоскости; все окрашены по углу шарнира состояния, которое они представляют, как указано цветовым кругом. Справа от каждой панели: подмножество из 10 структур, декодированных из интерполированных состояний, наложенных на фиксированное тело антитела и окрашенных по углу шарнира (вверху), и в белом цвете, чтобы показать размах движения Fab относительно шарнира (внизу). Во всех трех случаях якоря, упорядоченные по углу шарнира, образуют простое замкнутое кольцо в представлении, а декодированные структуры прослеживают полное вращение Fab.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"obzor-smezhnyh-rabot\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#obzor-smezhnyh-rabot\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор смежных работ&lt;/span&gt;&lt;/a&gt;Обзор смежных работ&lt;/h4&gt;\n&lt;p&gt;Реконструкция карт. Для построения атомных моделей обычно требуются десятки или сотни тысяч частиц. Методы RELION и cryoSPARC используют байесовский подход для совместной оценки ориентаций и карт. При гетерогенности данные делят на K дискретных классов. CryoDRGN применяет VAE для обучения непрерывного латентного пространства, а RECOVAR оценивает ковариацию объема. CryoDRGN-AI расширяет это до ab initio оценки. Современные методы используют модели предсказания структур (например, AlphaFold) в качестве априорного знания, направляемого экспериментальной плотностью. В рентгеновской кристаллографии Maddipatla и соавт. используют диффузионные модели для поиска альтернативных конформаций, включая AlphaFold3 как структурный априорный компонент. В крио-ЭМ CryoBoltz и подходы Maddipatla направляют AlphaFold3 к структурам, соответствующим картам потенциала (ESP). Embed-Opt и IT-Opt оптимизируют латентные представления AlphaFold для соответствия синтетическим картам. Наиболее близкая работа — CoCoFold, которая ограничивает AlphaFold напрямую через изображения частиц, используя FRC-функцию потерь при замороженном Evoformer.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-fS1.jpg\" alt=\"Рис. S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"tablicy\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#tablicy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Таблицы&lt;/span&gt;&lt;/a&gt;Таблицы&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 3.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-tT3.jpg\" alt=\"Таблица 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 4.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-tT4.jpg\" alt=\"Таблица 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 6.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-tT6.jpg\" alt=\"Таблица 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 7.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-tT7.jpg\" alt=\"Таблица 7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 10.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-tT10.jpg\" alt=\"Таблица 10\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 12.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-tT12.jpg\" alt=\"Таблица 12\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 14.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-tT14.jpg\" alt=\"Таблица 14\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 16.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-tT16.jpg\" alt=\"Таблица 16\" /&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;избыточность&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;данных в крио-&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ЭМ&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;интеграция&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;priors в&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нейросеть&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;атомная модель&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;из малого&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;числа частиц&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;изучение&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;редких&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;состояний&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;белков&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не прошёл рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия препринта&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;biophysics&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Advaith Maddipatla, Märt-Erik Mäeots, Marco Pegoraro, Nikolaus Dräger, Roberto Covino, Sanketh Vedula, Martin Pacesa, Alex M. Bronstein&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ссылка&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница препринта&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://arxiv.org/abs/2610.01358v1\" target=\"_blank\" rel=\"norefer
