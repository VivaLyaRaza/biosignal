        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"169\" cy=\"147\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"691\" cy=\"237\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · ECOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Морские водоросли прячут&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;углерод в глубинах океана на&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;тысячи лет&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may-f1.jpg\" alt=\"Экспериментальный рабочий процесс для отслеживания молекулярных отпечатков растворенного органического углерода (РОУ), с\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Экспериментальный рабочий процесс для отслеживания молекулярных отпечатков растворенного органического углерода (РОУ), связанного с ламинарией, в Мировом океане.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Экспериментальный рабочий процесс для отслеживания молекулярных отпечатков растворенного органического углерода (РОУ), связанного с ламинарией, в Мировом океане. (A) Мезокосмы in situ и микробная деградация. Мешочные мезокосмы были размещены на ферме по выращиванию ламинарии в заливе Сангоу (Желтое море) на стадиях быстрого роста (январь) и полной зрелости (июнь), каждый с тремя спорофитами ламинарии (Saccharina japonica) и тремя контрольными образцами только с морской водой. В общей сложности 10 литров обогащенной РОУ морской воды из каждого мешка фильтровали и инкубировали отдельно с естественным микробным инокулятом в темноте в течение 180 дней (n = 3 для каждого условия, пробы отбирались на 0 и 180 дни). Параллельная деградация детрита ламинарии проводилась в течение 210 дней (пробы отбирались на 5 и 210 дни; в трех повторностях). (B) Сравнительные эксперименты с РОУ: дополнительные инкубации включали детрит Gracilaria (10 и 90 дней) и аксеничные культуры диатомовых водорослей (Phaeodactylum tricornutum и Chaetoceros sp. DS1; 0 и 90 дней), каждая в трех повторностях. Экстракты РОУ из повторных флаконов при одинаковых условиях подвергались твердофазной экстракции, объединялись и затем анализировались методом масс-спектрометрии с ионизацией электрораспылением и преобразованием Фурье (FT-ICR MS). (C) Консервативный конвейер фильтрации удалил молекулярные формулы (МФ), общие с контрольными образцами морской воды и с эталонной базой данных первичных продуцентов, включающей МФ различных фитопланктонов и макроводорослей (как из опубликованных наборов данных, так и из этого исследования), что позволило получить 1753 уникальные МФ, связанные с ламинарией. (D) Обнаружение в Мировом океане. Образцы РОУ из западной части Тихого океана были проанализированы и интегрированы с глобальными наборами данных FT-ICR MS Мирового океана для создания набора данных GODOC-MS. Затем связанные с ламинарией МФ РОУ были сопоставлены с GODOC-MS; синие кружки на карте указывают станции, где были обнаружены потенциальные сигналы РОУ, связанные с ламинарией.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Прибрежные водоросли, такие как ламинария, поглощают огромное количество углекислого газа. Новое исследование показывает, что часть этого углерода превращается в устойчивые соединения и переносится течениями на тысячи километров в глубоководные зоны. Это открывает ранее неизвестный путь долгосрочного хранения углерода в океане.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Ламинария выделяет до 62% первичной продукции в виде растворенного углерода.&lt;/li&gt;\n&lt;li&gt;Устойчивые молекулы водорослей обнаружены на глубине 5500 метров.&lt;/li&gt;\n&lt;li&gt;Прибрежные экосистемы могут ежегодно связывать до 481 тераграмма углерода.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Ученые использовали масс-спектрометрию сверхвысокого разрешения (FT-ICR MS) для создания «молекулярного отпечатка» растворенного органического углерода (DOC), выделяемого ламинарией Saccharina japonica. В ходе 180-дневных экспериментов по микробной деградации исследователи разделили углерод на лабильные (легко разлагаемые) и рекальцитрантные (устойчивые к разложению) фракции. Для оценки стабильности соединений был разработан молекулярный индекс рекальцитрантности (MRS).&lt;/p&gt;\n&lt;p&gt;Анализ показал, что специфические молекулярные сигналы ламинарии присутствуют в пробах воды на расстоянии до 10 000 километров от берега и на глубинах до 5500 метров. Эти соединения обладают высоким индексом MRS, что подтверждает их устойчивость к переработке микроорганизмами. Глобальный вклад прибрежных экосистем водорослей в хранение рекальцитрантного углерода оценивается в 320,7–481,1 тераграмм углерода в год.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на лабораторных моделях деградации, которые могут не полностью отражать сложные процессы в реальном океане.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Преобразование атмосферного углекислого газа в растворенный органический углерод (РОУ) и взвешенный органический углерод (ВОУ) морскими первичными продуцентами является критическим потоком углерода из неорганического состояния в органическое и играет ключевую роль в регуляции глобального климата. Общий объем морского РОУ оценивается примерно в 660 миллиардов метрических тонн углерода, при этом на трудноразлагаемый РОУ (ТР-РОУ) приходится более 95% этого пула. Этот обширный резервуар включает в себя огромное молекулярное разнообразие: от лабильного РОУ (Л-РОУ), который быстро циркулирует в морских пищевых сетях, до ТР-РОУ, сохраняющегося тысячелетиями. ТР-РОУ в основном возникает в результате микробной переработки соединений Л-РОУ через «микробный углеродный насос» — ключевой путь долгосрочной секвестрации углерода в океане.&lt;/p&gt;\n&lt;p&gt;Несмотря на важность этого пула, текущее понимание формирования РОУ в океане сосредоточено почти исключительно на РОУ, полученном от фитопланктона, при этом вклад других первичных продуцентов в значительной степени игнорируется. Морские макроводоросли образуют наиболее обширные и продуктивные растительные местообитания в прибрежных зонах океана, фиксируя и высвобождая углерод со скоростями, на порядок превышающими показатели фитопланктона в прибрежных водах. Эта высокая продуктивность предполагает, что РОУ макроводорослевого происхождения может вносить существенный вклад в общий пул морского РОУ. Однако вклад макроводорослей в потоки РОУ остается недостаточно изученным из-за молекулярной сложности пула морского РОУ и методологических ограничений.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Макроводоросли являются высокопродуктивными источниками углерода, однако их вклад в глобальный пул РОУ до сих пор был недооценен из-за сложности анализа.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;РОУ (DOC) — растворенный органический углерод; ТР-РОУ (RDOC) — трудноразлагаемая фракция, устойчивая к микробному разложению; Л-РОУ (LDOC) — лабильная фракция, быстро потребляемая микроорганизмами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдательное исследование: текущие данные указывают на потенциальную связь, но не доказывают причинно-следственную связь в глобальном масштабе без дополнительных подтверждений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для характеристики динамики РОУ, полученного от ламинарии (Saccharina japonica), в условиях культивирования мы количественно оценили скорость высвобождения РОУ и последующие паттерны микробной деградации на двух фенологических стадиях: стадии быстрого роста и стадии полной зрелости (Рис. 2). Мы наблюдали существенные различия в высвобождении свежего РОУ в зависимости от стадии: на стадии полной зрелости скорость высвобождения была значительно выше [64,7 ± 3,6 мкмоль г⁻¹ сырой массы (СМ) в день], чем на стадии быстрого роста (43,6 ± 19,3 мкмоль г⁻¹ СМ в день; P &amp;lt; 0,05) (Рис. 2, A и B). Чистые концентрации РОУ после вычета фоновых значений морской воды составили 47 ± 21 мкМ на стадии быстрого роста и 334 ± 18 мкМ на стадии полной зрелости.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may-f2.jpg\" alt=\"Временная динамика продукции РОУ, полученного из ламинарии, и микробная деградация на различных стадиях роста.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Временная динамика продукции РОУ, полученного из ламинарии, и микробная деградация на различных стадиях роста.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Временная динамика продукции РОУ, полученного из ламинарии, и микробная деградация на различных стадиях роста. Изменения концентрации РОУ (A и B) во время стадий быстрого роста и полной зрелости культивируемой ламинарии и (C и D) во время длительной темновой микробной деградации РОУ, полученного на тех же стадиях роста. Контрольные эксперименты состояли из инкубации окружающей морской воды без ламинарии. Чистый РОУ, полученный из ламинарии, рассчитывался путем вычитания контрольных значений из значений опытных образцов в каждой временной точке. Значения представляют собой средние значения ± стандартное отклонение (SD) по результатам трех измерений.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Последующие эксперименты по длительной микробной деградации (180 дней) РОУ, полученного от ламинарии, выявили двухфазную динамику (Рис. 2, C и D). Первоначальное быстрое потребление происходило в течение первых 90 дней, за которым следовала стабилизация концентраций РОУ и численности микроорганизмов с 90-го по 180-й день (Рис. SN, A и B), что указывает на то, что остаточный РОУ был в значительной степени устойчив (ТР-РОУ) к микробной деградации. После поправки на контрольные группы остаточный РОУ составил 20,1% (9 ± 10 мкМ) и 30,5% (102 ± 13 мкМ) от начального РОУ для стадий быстрого роста и полной зрелости соответственно.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Скорость высвобождения РОУ ламинарией зависит от стадии роста, при этом до 30,5% высвобожденного углерода переходит в трудноразлагаемую форму (ТР-РОУ).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;FT-ICR MS (масс-спектрометрия ионно-циклотронного резонанса с преобразованием Фурье) — метод сверхвысокого разрешения, позволяющий идентифицировать тысячи индивидуальных молекулярных формул в одном образце.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Лабораторные эксперименты по деградации не полностью воспроизводят сложные природные условия, поэтому оценки лабильности могут отличаться от реальных показателей в океане.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may-f1.jpg\" alt=\"Экспериментальный рабочий процесс для отслеживания молекулярных отпечатков растворенного органического углерода (РОУ), с\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Экспериментальный рабочий процесс для отслеживания молекулярных отпечатков растворенного органического углерода (РОУ), связанного с ламинарией, в Мировом океане.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Экспериментальный рабочий процесс для отслеживания молекулярных отпечатков растворенного органического углерода (РОУ), связанного с ламинарией, в Мировом океане. (A) Мезокосмы in situ и микробная деградация. Мешочные мезокосмы были размещены на ферме по выращиванию ламинарии в заливе Сангоу (Желтое море) на стадиях быстрого роста (январь) и полной зрелости (июнь), каждый с тремя спорофитами ламинарии (Saccharina japonica) и тремя контрольными образцами только с морской водой. В общей сложности 10 литров обогащенной РОУ морской воды из каждого мешка фильтровали и инкубировали отдельно с естественным микробным инокулятом в темноте в течение 180 дней (n = 3 для каждого условия, пробы отбирались на 0 и 180 дни). Параллельная деградация детрита ламинарии проводилась в течение 210 дней (пробы отбирались на 5 и 210 дни; в трех повторностях). (B) Сравнительные эксперименты с РОУ: дополнительные инкубации включали детрит Gracilaria (10 и 90 дней) и аксеничные культуры диатомовых водорослей (Phaeodactylum tricornutum и Chaetoceros sp. DS1; 0 и 90 дней), каждая в трех повторностях. Экстракты РОУ из повторных флаконов при одинаковых условиях подвергались твердофазной экстракции, объединялись и затем анализировались методом масс-спектрометрии с ионизацией электрораспылением и преобразованием Фурье (FT-ICR MS). (C) Консервативный конвейер фильтрации удалил молекулярные формулы (МФ), общие с контрольными образцами морской воды и с эталонной базой данных первичных продуцентов, включающей МФ различных фитопланктонов и макроводорослей (как из опубликованных наборов данных, так и из этого исследования), что позволило получить 1753 уникальные МФ, связанные с ламинарией. (D) Обнаружение в Мировом океане. Образцы РОУ из западной части Тихого океана были проанализированы и интегрированы с глобальными наборами данных FT-ICR MS Мирового океана для создания набора данных GODOC-MS. Затем связанные с ламинарией МФ РОУ были сопоставлены с GODOC-MS; синие кружки на карте указывают станции, где были обнаружены потенциальные сигналы РОУ, связанные с ламинарией.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may-f3.jpg\" alt=\"Таксономическая специфичность и молекулярная характеристика РОУ, полученного из ламинарии.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Таксономическая специфичность и молекулярная характеристика РОУ, полученного из ламинарии.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Таксономическая специфичность и молекулярная характеристика РОУ, полученного из ламинарии. (A) График UpSet, показывающий уникальные и общие МФ среди макроводорослей и фитопланктона. (B) Тепловая карта иерархической кластеризации индексов сходства Жаккара среди макроводорослей и фитопланктона. (C) Диаграммы Ван Кревелена, сравнивающие молекулярный состав фракций лабильного (LDOC) и рекальцитрантного (RDOC) РОУ, связанных с ламинарией. (D) Количество МФ по классам соединений в LDOC и RDOC, связанных с ламинарией. Cond., конденсированные; HC, углеводороды; Unsat., ненасыщенные.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may-f4.jpg\" alt=\"Распределение MRS во фракциях лабильного (Kelp-LDOC) и рекальцитрантного (Kelp-RDOC) РОУ, связанных с ламинарией.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Распределение MRS во фракциях лабильного (Kelp-LDOC) и рекальцитрантного (Kelp-RDOC) РОУ, связанных с ламинарией.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Распределение MRS во фракциях лабильного (Kelp-LDOC) и рекальцитрантного (Kelp-RDOC) РОУ, связанных с ламинарией. (A) Тепловая карта, показывающая z-оценки масштабированных значений доминирующих молекулярных индексов (AImod, DBE, GFE, H/C и NOSC), определенных с помощью RF, которые отличают Kelp-RDOC от Kelp-LDOC. (B) Скрипичная диаграмма, отображающая распределение значений MRS во фракциях Kelp-LDOC и Kelp-RDOC. Красная пунктирная линия обозначает прогнозируемый порог MRS. Размер эффекта группового различия количественно определен с помощью d Коэна (d = 0,87), что отражает существенный сдвиг в молекулярной рекальцитрантности. (C) PCoA фракций Kelp-LDOC и Kelp-RDOC на основе различий Брея-Кертиса молекулярных индексов (MRS, AImod, DBE, NOSC, H/C, O/C и GFE). Точки представляют профили отдельных МФ, окрашенные по фракциям; закрашенные ромбы обозначают центроиды групп (многомерные средние). Эллипсы указывают области 95% доверительного интервала.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may-f5.jpg\" alt=\"Сетевой обзор МФ РОУ, связанных с ламинарией.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сетевой обзор МФ РОУ, связанных с ламинарией.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Сетевой обзор МФ РОУ, связанных с ламинарией. (A) Сеть молекулярного сходства РОУ, связанного с ламинарией, основанная на корреляциях между молекулярными индексами. Для визуализации отображаются только связи с коэффициентами корреляции выше 0,9. (B) Столбчатые диаграммы, суммирующие глобальные свойства сети (средняя длина пути, глобальная транзитивность, модульность и плотность сети) для сетей молекул, связанных с ламинарией, фитопланктоном и другими макроводорослями. (C) Скрипичные диаграммы, сравнивающие локальные коэффициенты кластеризации отдельных МФ среди трех групп. (D) Скрипичные диаграммы, сравнивающие центральность посредничества (betweenness centrality), представляющую относительную связующую роль молекул внутри каждой сети, по трем группам. Наложенные точки представляют отдельные МФ (смещенные для ясности). Белые ромбы обозначают средние значения групп.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may-f6.jpg\" alt=\"Распределение молекулярных формул (MF) растворенного органического углерода (DOC), ассоциированных с ламинариевыми водор\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Распределение молекулярных формул (MF) растворенного органического углерода (DOC), ассоциированных с ламинариевыми водорослями, в Мировом океане.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Распределение молекулярных формул (MF) растворенного органического углерода (DOC), ассоциированных с ламинариевыми водорослями, в Мировом океане. (A) Карта океанических станций, где были обнаружены молекулярные формулы DOC, ассоциированные с ламинариевыми, другими макроводорослями и фитопланктоном. Набор данных океанических MF составлен на основе работ Bercovici и соавт. (106, 107) и Stubbins и Dittmar (71). Голубым цветом заштрихованы прибрежные зоны, где обитают ламинариевые (Saccharina sp.) (распределение среды обитания по Eger и соавт. (108)). (B) Столбчатая диаграмма, показывающая процентное содержание молекулярных формул DOC, ассоциированных с фитопланктоном, ламинариевыми и другими макроводорослями, обнаруженных в наборе данных GODOC-MS. (C) Столбчатая диаграмма с накоплением, иллюстрирующая относительный состав лабильного (LDOC) и рекальцитрантного (RDOC) растворенного органического углерода, ассоциированного с ламинариевыми, а также других океанических MF в каждой глубинной зоне. Процентные доли указаны внутри столбцов; разрыв оси подчеркивает минорные компоненты выше 93%. (D) Скрипичные диаграммы, показывающие распределение MRS для лабильного и рекальцитрантного DOC, ассоциированного с ламинариевыми, по глубинным зонам. Отдельные MF представлены в виде точек; наложенные диаграммы размаха показывают межквартильный размах и медианы, звездочки обозначают уровни статистической значимости (*P &amp;lt; 0,05 и ****P &amp;lt; 0,0001).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Неизвестна&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;судьба&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;углерода&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;водорослей&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Масс-&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;спектрометрия&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;и анализ&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сигналов&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Углерод&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;переносится в&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;глубокий океан&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Новый механизм&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;поглощения&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;углерода&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале Science advances. Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id
