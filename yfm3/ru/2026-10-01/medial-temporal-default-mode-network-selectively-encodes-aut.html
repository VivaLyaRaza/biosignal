            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"263\" cy=\"171\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"577\" cy=\"179\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как мозг воспроизводит кадры&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;личных воспоминаний&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Когда мы воскрешаем в памяти свадьбу друга или утреннюю пробежку, перед глазами всплывают конкретные визуальные образы. До сих пор ученые спорили, кодирует ли мозг именно картинку прошлого или только абстрактный смысл события. С помощью диффузионных нейросетей исследователи синтезировали изображения по рассказам людей и сопоставили их с паттернами активности мозга. Оказалось, что за индивидуальную визуальную ткань автобиографических воспоминаний отвечает строго определенный участок дефолт-системы мозга.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Сеть &lt;a href=\"concepts/medial-temporal-default-mode-network.html\"&gt;MT-DMN&lt;/a&gt; избирательно кодирует зрительную структуру личных воспоминаний&lt;/li&gt;\n&lt;li&gt;Эффект сохраняется при строгом контроле абстрактной языковой семантики через GPT-2&lt;/li&gt;\n&lt;li&gt;В других сетях мозга и при пассивном чтении визуальный код воспоминаний не проявляется&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;В исследовании приняли участие 50 добровольцев (25 молодых людей в возрасте 24 ± 3 года и 25 пожилых в возрасте 73 ± 7 лет). До сканирования участники описывали 20 автобиографических ситуаций по нейтральным подсказкам вроде «тренировка» или «свадьба», оценивая яркость и реалистичность своих мысленных образов. На основе этих кратких описаний &lt;a href=\"concepts/stable-diffusion.html\"&gt;диффузионная нейросеть&lt;/a&gt; Stable Diffusion 2.1 генерировала персонализированные синтетические изображения (по пять на каждую сцену), отражающие субъективный визуальный опыт каждого человека. Затем полученные кадры анализировали с помощью сверточной нейросети &lt;a href=\"concepts/vgg-16.html\"&gt;VGG-16&lt;/a&gt;, извлекая 1000-мерные векторы активации предфинального слоя FC8 для построения визуальной модели сцены.&lt;/p&gt;\n&lt;p&gt;Во время сеанса функциональной магнитно-резонансной томографии (&lt;a href=\"concepts/functional-magnetic-resonance-imaging.html\"&gt;фМРТ&lt;/a&gt;) участники вновь мысленно переживали те же сюжеты по текстовым стимулам без озвучивания, чтобы избежать моторных и речевых артефактов. Паттерны активности коры картировали по 17 функциональным сетям атласа Йо. Используя &lt;a href=\"concepts/representational-similarity-analysis.html\"&gt;репрезентационный анализ сходства&lt;/a&gt; (RSA) с контролем невербальной семантики через языковую модель GPT-2 (16-й слой), авторы выявили, что уникальная структура зрительных образов избирательно кодируется медиальной височной подсетью дефолт-системы мозга (MT-DMN), включающей парагиппокампальную, ретросплениальную и латеральную париетальную кору. Эффект визуального кодирования полностью отсутствовал в остальных 16 сетях и исчезал при простом чтении текста без активного воображения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Синтетические изображения создавались ИИ по коротким описаниям и не оценивались самими участниками, поэтому они лишь приближенно отражают реальные субъективные образы в памяти.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Человеческий мозг реконструирует визуальные сцены по памяти, синтезируя внешний вид мест, людей и объектов, даже если эти ментальные образы расплывчаты [1]. Считается, что медиальная височная подсистема сети пассивного режима работы мозга (MT-DMN), включающая парагиппокампальную, ретроспленальную и латеральную теменную кору, поддерживает такое воображение, поскольку она активируется при выполнении задач, связанных с памятью, воображением и пространственной обработкой [2–4]. Однако нейронные коды, проспективно кодирующие реконструкцию визуальных сцен в пределах MT-DMN, остаются неизвестными. Идентификация этих кодов требует репрезентативной модели идиосинкразических сцен, которые представляют себе индивиды, что является сложной задачей, дополнительно осложненной необходимостью отделения визуальных компонентов от невизуальных, таких как аффект, диалог и социальная значимость.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование использует современные модели ИИ (Stable Diffusion и GPT-2) для моделирования визуальных и семантических компонентов воображаемых сцен, чтобы выявить нейронные корреляты в MT-DMN.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Здесь мы решаем эти задачи, объединяя современную модель искусственного интеллекта (ИИ) «текст-в-изображение» [Stable Diffusion; 5, 6] для моделирования воображаемых сцен по вербальным описаниям с большой языковой моделью [7, 8] для захвата сопутствующего невизуального семантического контента. Этот подход позволяет охарактеризовать нейронные корреляты самогенерируемых, специфичных для участника визуальных образов и оценить их специфичность для MT-DMN. Несмотря на обширные исследования самогенерируемых ментальных состояний и DMN [9–12], методы выделения нейронных репрезентаций, отражающих внутренне сгенерированные симуляции визуальных сцен, были ограничены.&lt;/p&gt;\n&lt;p&gt;Субъективные ментальные образы обычно изучались с использованием метода выборки опыта, при котором участники сообщали, являются ли их текущие мысли визуальными или вербальными по форме [13–16]. Однако такие грубые самоотчеты не могут различить разнообразные визуальные сцены, которые представляют себе люди. Аналогичным образом, хотя исследования эпизодического воспоминания и проспекции успешно дифференцировали нейронные репрезентации, связанные с отдельными событиями [17–20], их пространственным или временным контекстом [21, 22], а также людьми или объектами, которые они включают [23–28], они не идентифицировали нейронные корреляты идиосинкразических визуальных деталей, определяющих воображаемые сцены. Напротив, нейровычислительные описания ментальных образов для отдельных сущностей — таких как животные, инструменты, люди и здания — развиты сравнительно хорошо [1, 29].&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RSA (Representational Similarity Analysis) — метод анализа данных фМРТ, который сравнивает структуру сходства между паттернами активности мозга и структурой сходства в вычислительных моделях (например, ИИ-моделях).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;После ранних достижений в моделировании восприятия визуальных объектов [30–34] с использованием систем компьютерного зрения [например, 35, 36], аналогичные подходы были расширены для моделирования ментальных образов предварительно просмотренных изображений объектов [33, 37] и существительных, обозначающих объекты [38, 39]. Общий вывод для воображения и восприятия заключается в том, что паттерны активации вдоль вентрального визуального пути — центрального для распознавания объектов [40, 41] — коррелируют с репрезентациями изображений, извлеченными из вычислительных моделей распознавания объектов [32–34, 42, 43]. Эти репрезентации отражают высокоуровневые визуальные корреляты семантических категорий, таких как объекты, животные, ориентиры и другие сущности, которые абстрагируются от низкоуровневых вариаций положения, точки обзора и освещения.&lt;/p&gt;\n&lt;p&gt;Примечательно, что такие репрезентации изображений также предсказывают ответы функциональной магнитно-резонансной томографии (фМРТ) при просмотре естественных сцен в пределах областей, селективных к сценам [44], которые перекрываются с MT-DMN. Эти области кодируют категории объектов внутри сцен [45, 46], контекстуальные ассоциации между элементами сцены [47–49] и информацию о фоновой текстуре [50]. Относительная чувствительность моделей распознавания изображений к контексту объектов и текстуре, а не к форме [51–53], может даже сделать их преимущественными для моделирования активности в коре, селективной к сценам. Моделирование визуальных образов, связанных с автобиографическим опытом, представляет собой уникальную проблему, поскольку не существует объективной «истины» для ментальных образов. Хотя некоторые эпизодические воспоминания задокументированы фотографически, то, что люди вспоминают или воображают, часто расходится с реальностью, смешивая элементы из разных событий или вводя воображаемые детали [54–58].&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на данных фМРТ, где корреляция между активностью мозга и моделями ИИ не обязательно означает, что мозг использует те же алгоритмы, что и нейросети.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Недавние достижения в системах ИИ «текст-в-изображение», таких как Stable Diffusion [5, 6], теперь предлагают способ аппроксимировать эти внутренние визуализации путем генерации изображений непосредственно из вербальных описаний участников. Настоящее исследование использует этот подход, чтобы проверить, селективно ли паттерны активации в MT-DMN кодируют специфичную для участника (автобиографическую) визуальную структуру, и определить, отсутствует ли такая структура в других сетях мозга или когда воображение не задействовано. Тем самым эта работа продвигает понимание нейронных основ воображения и памяти и устанавливает генерацию изображений с помощью ИИ для различения внутренне сгенерированных визуальных образов в качестве методологического дополнения к связанным подходам нейронного декодирования на основе языковых моделей [например, 59–63].&lt;/p&gt;\n&lt;p&gt;Чтобы проверить гипотезу о том, что MT-DMN селективно кодирует специфичную для участника визуальную структуру во время автобиографического воображения, мы повторно проанализировали ранее собранный набор данных фМРТ от 50 взрослых [20, 62, 64] (Рис. 1A). Выборка включала 25 молодых взрослых (средний возраст ± SD = 24 ± 3 года; 16 женщин и 9 мужчин) и 25 пожилых взрослых (средний возраст ± SD = 73 ± 7 лет; 16 женщин и 9 мужчин). Хотя возрастные различия не были фокусом текущего исследования, анализы проводились как по всей группе, так и внутри возрастных групп для установления обобщаемости результатов.&lt;/p&gt;\n&lt;p&gt;Рис. 1. Идентификация структуры визуальной информации в данных фМРТ, полученных во время автобиографического воображения. (A) Перед сканированием участникам были представлены 20 общих сценариев-подсказок (например, танцы, упражнения и свадьба), и их попросили ярко представить, как они лично переживают каждое событие. Затем они устно описали каждый воображаемый сценарий. Во время фМРТ участники переосмысливали каждый сценарий, представленный в случайном порядке, на основе общих текстовых подсказок. Один объем фМРТ был извлечен для каждого сценария на каждого участника после стандартной предобработки.&lt;/p&gt;\n&lt;p&gt;Объемы были разделены на 17 сетей, связанных со схемой парцелляции Yeo (Рис. SN). Для моделирования структуры визуальной сцены использовался Stable Diffusion 2.1 [5] для синтеза пяти изображений на сценарий, руководствуясь описанием каждого участника. Затем изображения были пропущены через сеть распознавания объектов VGG-16 [36], и 1000D векторы активации из последнего слоя перед softmax (FC8) были извлечены и усреднены по пяти изображениям, чтобы получить единую репрезентацию на сценарий на участника. Эти векторы упоминаются в основном тексте как «Визуальная модель» и обозначены на рисунках значком камеры. Чтобы контролировать невизуальный семантический контент, каждое вербальное описание также моделировалось с использованием векторов активации скрытого состояния GPT-2 L16 [7] (значок книги) или OpenCLIP [8]. ИИ использовался для создания изображений сцен, реальные люди не представлены. (B) Чтобы проверить наличие структуры визуальной репрезентации в мозге, паттерны фМРТ были извлечены из MT-DMN. RSA на основе частной корреляции использовался для выделения дисперсии, объясняемой исключительно Визуальной моделью, с контролем GPT-2. Чтобы проверить специфичность для MT-DMN, анализ был повторен для подразделов Core-DMN и FT-DMN, а также 14 других сетей (Рис. SN). В дополнительном анализе модели были поменяны местами в частной RSA, чтобы изучить дисперсию, объясняемую исключительно GPT-2, при контроле Визуальной модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Как мозг&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;кодирует&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;образы памяти&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;фМРТ и&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;генерация сцен&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;через ИИ&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Зрительный код&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;найден в MT-&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;DMN&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Раскрыт&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;субстрат&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;визуальной&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;памяти&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале Science advances. Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt
