        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"171\" cy=\"73\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"589\" cy=\"270\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · GENETIC AND GENOMIC MEDICINE   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Почему некоторые люди&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;беззащитны перед сепсисом:&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;разгадка кроется в генах&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;редких популяций&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic-f1.jpg\" alt=\"Рисунок 1. Манхэттенский график результатов полногеномного поиска ассоциаций.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Манхэттенский график результатов полногеномного поиска ассоциаций.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1. Манхэттенский график результатов полногеномного поиска ассоциаций. Результаты ассоциации отдельных вариантов с предрасположенностью к сепсису у 210 пациентов отделения интенсивной терапии (68 случаев, 142 контроля). На оси x показана хромосомная позиция, а на оси y — -log10(p-значение). Пунктирная красная линия указывает на полногеномную значимость (p &amp;lt; 5×10⁻⁸), а пунктирная синяя линия — на порог предполагаемой значимости (p &amp;lt; 1×10⁻⁵). Обозначены основные локусы: STK32B (chr4p16.2), RP11-241F15.3 (chr4q13), MUC19 (chr12q12) и chr8p23.1 (кластер DEFB).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;a href=\"concepts/sepsis.html\"&gt;Сепсис&lt;/a&gt; ежегодно уносит миллионы жизней, оставаясь одной из главных загадок реаниматологии. Почему при одинаковой инфекции один человек выздоравливает, а другой погибает от отказа органов? Ученые обратились к геномам жителей Катара — закрытой популяции с уникальным генетическим наследием. Оказалось, что редкая мутация в гене &lt;a href=\"concepts/ube2l3.html\"&gt;UBE2L3&lt;/a&gt; лишает клетки способности вовремя «выключать» воспалительную реакцию, делая человека беззащитным перед бактериями.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Ученые секвенировали геномы 210 пациентов реанимации из Катара для поиска генетических причин сепсиса&lt;/li&gt;\n&lt;li&gt;Редкая мутация в гене UBE2L3 ломает механизм контроля воспаления и повышает уязвимость к инфекциям&lt;/li&gt;\n&lt;li&gt;Анализ данных 26 939 человек подтвердил связь поломок в этом гене с тяжелым течением бактериальных инфекций&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;В рамках исследования ученые провели &lt;a href=\"concepts/whole-genome-sequencing.html\"&gt;полногеномное секвенирование&lt;/a&gt; (WGS, определение полной последовательности ДНК) 210 пациентов отделений интенсивной терапии в Катаре. Среди них было 68 человек с подтвержденным сепсисом и 142 пациента с другими критическими состояниями в качестве контроля. С помощью метода GWAS (&lt;a href=\"concepts/gwas.html\"&gt;полногеномный поиск ассоциаций&lt;/a&gt;) и регрессии REGENIE Firth исследователи выявили 40 потенциально опасных мутаций-основателей в 31 гене. Особое внимание привлекла редкая мутация c.2T&amp;gt;G (p.Met1?) в гене UBE2L3, которая приводит к потере стартового кодона (start-loss) и, как следствие, к полной потере функции белка.&lt;/p&gt;\n&lt;p&gt;Этот вариант гена встретился у 3 из 68 пациентов с сепсисом и полностью отсутствовал в контрольной группе (p = 0.026). Для проверки значимости гена авторы обратились к базе данных All of Us, проанализировав данные 26 939 пациентов с бактериальными инфекциями. Выяснилось, что другие повреждающие мутации в UBE2L3 также резко повышают риск тяжелых инфекций (отношение шансов составило 23.10). Биологический механизм подтверждается экспериментами на мышах: отключение гена UBE2L3 в макрофагах (клетках иммунной системы) нарушает утилизацию провоспалительного цитокина IL-1Beta (&lt;a href=\"concepts/il-1beta.html\"&gt;интерлейкин-1 бета&lt;/a&gt;), что вызывает неконтролируемый воспалительный шторм.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование выполнено на очень малой выборке из 210 человек, а сама работа является препринтом, еще не прошедшим независимое рецензирование.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Сепсис ежегодно становится причиной около 11 миллионов летальных исходов во всем мире. Изучение геномов популяций основателей позволяет эффективно выявлять генетические факторы предрасположенности к данному состоянию. В рамках работы был проведен полногеномный поиск ассоциаций (GWAS) и поиск ассоциаций с экзомными данными (EXWAS) на основе полногеномного секвенирования (WGS) выборки из 210 арабских пациентов отделений интенсивной терапии (68 случаев сепсиса и 142 контрольных пациента с другими критическими состояниями).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GWAS и EXWAS — методы статистического анализа, позволяющие найти связь между конкретными генетическими вариациями и определенным заболеванием во всей совокупности генов или экзонов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для отбора значимых вариантов применялись жесткие критерии: регрессия REGENIE Firth с p &amp;lt; 0.05, показатель патогенности CADD &amp;gt; 20, а также обогащение альтернативной аллельной частоты (AAF) по сравнению с базами данных AllofUs и gnomAD. В результате было приоритизировано 40 вредоносных вариантов-основателей в 31 гене.&lt;/p&gt;\n&lt;p&gt;Ключевой находкой стал ранее не описанный вариант потери старт-кодона в гене UBE2L3 (c.2T&amp;gt;G; p.Met1?; &lt;a href=\"concepts/combined-annotation-dependent-depletion.html\"&gt;CADD&lt;/a&gt; = 25.6; SIFT = 0.001). Данная мутация была выявлена у 3 из 68 пациентов с сепсисом, тогда как в контрольной группе (0 из 142) она отсутствовала (точный тест Фишера, P = 0.026). Анализ данных базы All of Us (AoU) подтвердил, что накопление миссенс-мутаций в UBE2L3 статистически связано с риском бактериальных инфекций (n=26,939 случаев; SKAT-O P = 2.38 × 10⁻³; OR=23.10; 95% ДИ = [0.63–845.27]).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Выявлен редкий вариант в гене UBE2L3, ассоциированный с сепсисом, что подтверждается как клиническими данными, так и повышенным воспалительным ответом при нокауте этого гена у мышей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Использование специализированных моделей искусственного интеллекта, обученных для разработки лекарственных препаратов, присвоило гену UBE2L3 оценку 7.8 из 10 в качестве потенциальной терапевтической мишени. Эти данные согласуются с результатами экспериментов на мышах: &lt;a href=\"concepts/knock-out.html\"&gt;нокаут&lt;/a&gt; UBE2L3 приводит к усилению воспаления, опосредованного интерлейкином-1-бета (IL-1Beta), что усугубляет течение сепсиса.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на анализе специфической популяции и требует дальнейшей проверки на более широких этнических группах для подтверждения универсальности роли UBE2L3.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"opredelenie-i-epidemiologiya-sepsisa\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#opredelenie-i-epidemiologiya-sepsisa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение и эпидемиология сепсиса&lt;/span&gt;&lt;/a&gt;Определение и эпидемиология сепсиса&lt;/h4&gt;\n&lt;p&gt;Сепсис представляет собой жизнеугрожающую дисфункцию органов, возникающую вследствие неадекватного ответа организма на инфекцию. Согласно критериям Sepsis-3, диагноз устанавливается при повышении показателя по шкале &lt;a href=\"concepts/sequential-organ-failure-assessment.html\"&gt;Sequential Organ Failure Assessment&lt;/a&gt; (SOFA) на 2 и более баллов на фоне подтвержденной или подозреваемой инфекции. Ежегодно в мире регистрируется около 11 миллионов смертей от сепсиса, что делает его одной из ведущих причин заболеваемости и летальности в отделениях интенсивной терапии (ОИТ).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сепсис является критическим состоянием с высокой смертностью, ежегодно уносящим около 11 миллионов жизней, при этом точное прогнозирование индивидуальных рисков остается сложной задачей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"geneticheskaya-predraspolozhennost-i-ogranicheniya-tekushih-issledovanij\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#geneticheskaya-predraspolozhennost-i-ogranicheniya-tekushih-issledovanij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Генетическая предрасположенность и ограничения текущих исследований&lt;/span&gt;&lt;/a&gt;Генетическая предрасположенность и ограничения текущих исследований&lt;/h4&gt;\n&lt;p&gt;Роль генетических факторов в развитии сепсиса и исходах заболевания становится все более очевидной. Исследования близнецов и семейные анализы подтверждают наличие наследственного компонента в смертности от инфекционных заболеваний. Хотя полногеномные поиски ассоциаций (GWAS) позволили выявить ряд локусов, связанных с сепсисом, большинство из них проводились на европейских популяциях с использованием массивов генотипирования. Такие методы смещены в сторону распространенных вариантов и часто упускают редкие, специфичные для конкретных популяций аллели с большим размером эффекта. В каталоге GWAS на данный момент описаны 62 гена, связанных с сепсисом, однако общая генетическая архитектура предрасположенности к этому состоянию изучена не до конца.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GWAS (полногеномный поиск ассоциаций) — это метод поиска генетических вариаций, которые встречаются чаще у людей с определенным заболеванием, чем у здоровых, что помогает выявить гены, ответственные за предрасположенность к патологии.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"potencial-polnogenomnogo-sekvenirovaniya-v-specificheskih-populyaciyah\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#potencial-polnogenomnogo-sekvenirovaniya-v-specificheskih-populyaciyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Потенциал полногеномного секвенирования в специфических популяциях&lt;/span&gt;&lt;/a&gt;Потенциал полногеномного секвенирования в специфических популяциях&lt;/h4&gt;\n&lt;p&gt;Полногеномное секвенирование (WGS) в популяциях с эффектом основателя и недостаточно изученных группах позволяет обнаружить новые варианты, обогащенные в определенных этнических контекстах, но отсутствующие в глобальных базах данных. Арабские популяции, имеющие историю генетических «бутылочных горлышек» и высокого уровня кровнородственных браков, обладают уникальными аллелями, которые часто не представлены в крупных базах, таких как gnomAD или AoU. Эти варианты могут вносить значительный вклад в риск развития заболеваний в данных сообществах.&lt;/p&gt;\n&lt;h4 id=\"dizajn-issledovaniya-i-klyuchevye-nahodki\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#dizajn-issledovaniya-i-klyuchevye-nahodki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дизайн исследования и ключевые находки&lt;/span&gt;&lt;/a&gt;Дизайн исследования и ключевые находки&lt;/h4&gt;\n&lt;p&gt;В данной работе представлен GWAS по предрасположенности к сепсису, основанный на WGS данных n=210 арабских пациентов ОИТ из Катара. Мы провели тестирование ассоциаций единичных вариантов, стратифицированный по полу анализ, нагрузочное тестирование на уровне генов, анализ путей и независимую валидацию. Исследование выявило значимые ассоциации с редким арабским вариантом потери функции в гене UBE2L3. Использование генеративного ИИ для поиска лекарственных препаратов подтвердило перспективность этого гена как терапевтической мишени. В моделях нокаута (KO) UBE2L3 у мышей в макрофагах наблюдалось снижение убиквитинирования и деградации IL-1Beta, что приводило к усилению воспалительного ответа в модели сепсиса.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на выборке из 210 пациентов, а функциональные выводы о роли гена UBE2L3 частично опираются на модели нокаута у мышей, что требует осторожности при экстраполяции на человека.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"harakteristiki-kogorty\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#harakteristiki-kogorty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Характеристики когорты&lt;/span&gt;&lt;/a&gt;Характеристики когорты&lt;/h4&gt;\n&lt;p&gt;Исследуемая группа состояла из 210 пациентов отделения интенсивной терапии (ОИТ), из которых 68 (32,4%) имели диагноз сепсиса, а 142 (67,6%) составили контрольную группу. В выборку вошли 111 мужчин (52,9%) и 99 женщин (47,1%) в возрасте от 23 до 91 года (средний возраст 61,4 ± 15,8 лет) (Таблица 1). Все трое носителей варианта UBE2L3 p.Met1? были мужчинами с сепсисом и признаками органной дисфункции (SOFA ≥2).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Когорта из 210 пациентов (68 с сепсисом) позволила выявить редкий вариант UBE2L3 у трех мужчин с тяжелым течением заболевания.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"analiz-otdelnyh-variantov-gwas\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#analiz-otdelnyh-variantov-gwas\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ отдельных вариантов (GWAS)&lt;/span&gt;&lt;/a&gt;Анализ отдельных вариантов (GWAS)&lt;/h4&gt;\n&lt;p&gt;После совместного генотипирования GATK и фильтрации VQSR для анализа было отобрано 16,6 млн аутосомных биаллельных вариантов с минимальным количеством аллелей (MAC) ≥3. Использовался метод REGENIE с логистической регрессией Фирта, что обеспечило консервативную коррекцию. Коэффициент геномной инфляции λGC=0,840 указывает на небольшое дефлирование, обусловленное малым размером выборки (n=210) (Рис. SN 1). Вариантов, достигших порога полногеномной значимости (p &amp;lt; 5 × 10⁻⁸), не обнаружено (Рис. 1). Четыре варианта показали «предположительную» значимость (p &amp;lt; 5 × 10⁻⁵), однако они признаны артефактами, так как локализованы в генах, ранее не связанных с сепсисом. Всего 396 117 вариантов имели номинальные значения p &amp;lt; 0,05. Также было проанализировано 316 вариантов с предсказанной потерей функции (pLoF) или патогенных миссенс-мутаций, из которых 295 показали p &amp;lt; 0,05 (Таблица SN I, II).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic-f1.jpg\" alt=\"Рисунок 1. Манхэттенский график результатов полногеномного поиска ассоциаций.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Манхэттенский график результатов полногеномного поиска ассоциаций.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1. Манхэттенский график результатов полногеномного поиска ассоциаций. Результаты ассоциации отдельных вариантов с предрасположенностью к сепсису у 210 пациентов отделения интенсивной терапии (68 случаев, 142 контроля). На оси x показана хромосомная позиция, а на оси y — -log10(p-значение). Пунктирная красная линия указывает на полногеномную значимость (p &amp;lt; 5×10⁻⁸), а пунктирная синяя линия — на порог предполагаемой значимости (p &amp;lt; 1×10⁻⁵). Обозначены основные локусы: STK32B (chr4p16.2), RP11-241F15.3 (chr4q13), MUC19 (chr12q12) и chr8p23.1 (кластер DEFB).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GWAS (полногеномный поиск ассоциаций) — метод поиска генетических вариантов, связанных с определенным признаком, путем сравнения геномов тысяч людей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"geneticheskij-analiz-na-urovne-genov-burden-tests\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#geneticheskij-analiz-na-urovne-genov-burden-tests\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Генетический анализ на уровне генов (Burden tests)&lt;/span&gt;&lt;/a&gt;Генетический анализ на уровне генов (Burden tests)&lt;/h4&gt;\n&lt;p&gt;Анализ совокупного влияния редких вариантов проводился для 20 414 генов. Ни один ген не прошел порог значимости Бонферрони (α = 0,05, p &amp;lt; 2,4 × 10⁻⁶) (Рис. 2). Тем не менее, выявлены биологически значимые сигналы. Лидером стал ген TRPM5 (маска M2: &lt;a href=\"concepts/loss-of-function.html\"&gt;LoF&lt;/a&gt; + повреждающие миссенс-мутации) с отношением шансов (OR) 7,43 (p = 3,4 × 10⁻⁴), причем у женщин эффект был выражен сильнее (OR = 10,6, p = 0,012). Также значимые ассоциации показали IL19 (OR = 2,65, p = 7,1 × 10⁻⁴) и GZMM (OR = 14,0, p = 8,7 × 10⁻⁴) при маске M3.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic-f2.jpg\" alt=\"Рисунок 2. Манхэттенский график для теста на бремя редких вариантов (burden test).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2. Манхэттенский график для теста на бремя редких вариантов (burden test).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 2. Манхэттенский график для теста на бремя редких вариантов (burden test). На оси x показана хромосомная позиция, а на оси y — -log10(p-значение). Пунктирная красная линия указывает на полногеномную значимость (p &amp;lt; 5×10⁻⁸), а пунктирная синяя линия — на порог предполагаемой значимости (p &amp;lt; 1×10⁻⁵). Обозначены пять наиболее значимых генов: MTMR11 (chr1), IL19 (chr1), TRPM5 (chr11), SPATA7 (chr14) и GZMM (chr19).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анализ на уровне генов выявил потенциальную роль TRPM5, IL19 и GZMM в регуляции воспалительного ответа при сепсисе.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"identifikaciya-varianta-ube2l3-u-arabskoj-populyacii\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#identifikaciya-varianta-ube2l3-u-arabskoj-populyacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Идентификация варианта UBE2L3 у арабской популяции&lt;/span&gt;&lt;/a&gt;Идентификация варианта UBE2L3 у арабской популяции&lt;/h4&gt;\n&lt;p&gt;Среди 316 вариантов с высокой предсказанной патогенностью (CADD ≥20) и p ≤ 0,05 было выделено 40 вариантов в 31 гене, отсутствующих в базах AoU и GnomAD. С помощью языковых моделей (gemma4, txgemma) ген UBE2L3 был определен как наиболее перспективный кандидат. Вариант (chr22:21,567,746:T&amp;gt;G; p.Met1?) имеет оценку CADD 25,6 (входит в 0,3% самых патогенных), SIFT 0,001 и частоту аллеля 0,0071. Мутация затрагивает старт-кодон (ATG → AGG), что приводит к потере функции белка UBE2L3 (152 аминокислоты). Все трое носителей — мужчины с сепсисом (3/68 против 0/142 в контроле, p = 0,026 по Фишеру). Вариант не найден в базе gnomAD (более 945 000 человек), что указывает на его специфичность для арабской популяции. Верификация через IGV подтвердила наличие варианта у всех носителей (глубина прочтения 19x–40x) (Рис. SN 3).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Выборка мала, а вариант специфичен для одной популяции, поэтому результаты требуют независимой репликации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"nezavisimaya-validaciya-ube2l3\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#nezavisimaya-validaciya-ube2l3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Независимая валидация UBE2L3&lt;/span&gt;&lt;/a&gt;Независимая валидация UBE2L3&lt;/h4&gt;\n&lt;p&gt;Поскольку репликация на уровне конкретного варианта была невозможна, была проведена проверка на уровне гена в базе AoU (26 939 случаев инфекций, 243 470 контролей). Анализ миссенс-вариантов UBE2L3 подтвердил значимую ассоциацию (SKAT-O p = 2,38 × 10⁻³, OR = 23,10), что подкрепляет гипотезу о влиянии вариаций UBE2L3 на восприимчивость к инфекциям.&lt;/p&gt;\n&lt;h4 id=\"peresechenie-s-opublikovannymi-dannymi-gwas-po-sepsisu\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#peresechenie-s-opublikovannymi-dannymi-gwas-po-sepsisu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пересечение с опубликованными данными GWAS по сепсису&lt;/span&gt;&lt;/a&gt;Пересечение с опубликованными данными GWAS по сепсису&lt;/h4&gt;\n&lt;p&gt;Сравнение с каталогом GWAS, содержащим 62 гена, связанных с признаками сепсиса (Таблица SN V, VI), выявило 25 генов, общих с результатами нашего исследования (Таблица SN VII). В этот список вошли USP37, LRBA, KIF15, GPM6A, MAD1L1, RIN3, NFKBIL1, CHRNA7, SLAMF6, LINC00378, SAMD9, SLC35F4, TFRC, CLIC6, ANKMY2, CSMD1, FER, RPE65, HRH1, LPP, LINC00887, GAK, VPS13A, CRISPLD2 и FLT1.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование выявило 25 генов, ассоциированных с сепсисом, которые ранее уже были описаны в литературе.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"perekrestnye-ssylki-s-bazoj-dannyh-all-of-us\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#perekrestnye-ssylki-s-bazoj-dannyh-all-of-us\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Перекрестные ссылки с базой данных All of Us&lt;/span&gt;&lt;/a&gt;Перекрестные ссылки с базой данных All of Us&lt;/h4&gt;\n&lt;p&gt;Из 316 вариантов с показателем CADD ≥20 и p ≤0,05, 17 вариантов показали ассоциации в базе данных All of Us (AoU) (Таблица SN VIII, IX). В когорте пациентов отделения интенсивной терапии (HMC ICU) выявлено 117 вариантов, имеющих гомозиготных носителей. Двенадцать вариантов продемонстрировали значимость, специфичную для женщин (p&amp;lt;0,05 у женщин, p&amp;gt;0,05 у мужчин), а 58 вариантов в 57 генах оказались частыми в когорте ICU, но редкими в базе gnomAD, что указывает на популяционную специфичность.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CADD (Combined Annotation Dependent Depletion) — это метрика, оценивающая патогенность генетических вариантов; значения ≥20 означают, что вариант входит в 1% наиболее вредоносных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ бремени (burden testing) для 295 генов с вариантами CADD ≥20 и p ≤0,05 выявил 163 гена со значимостью p&amp;lt;0,05 (Таблица SN X). Гены HLA-DQA1 и PSMB8 имеют наиболее выраженные биологические связи с патофизиологией сепсиса. ABCG2 функционально связан с антибактериальным иммунитетом, а SBNO1, согласно протеомным данным, входит в состав пептидных сигнатур плазмы при сепсисе. Среди 163 генов 12 содержали 32 варианта, уникальных для когорты ICU: FAM72B, NOTCH2NL, SEC22B, BOD1, HLA-B, ZNF92, DYNLL1, GXYLT1, PABPC3, ZFYVE1, ZNF443 и UBE2L3.&lt;/p&gt;\n&lt;h4 id=\"regionalnyj-analiz-neravnovesnogo-scepleniya-lokusa-ube2l3\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#regionalnyj-analiz-neravnovesnogo-scepleniya-lokusa-ube2l3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Региональный анализ неравновесного сцепления локуса UBE2L3&lt;/span&gt;&lt;/a&gt;Региональный анализ неравновесного сцепления локуса UBE2L3&lt;/h4&gt;\n&lt;p&gt;Чтобы проверить, обусловлена ли ассоциация в локусе UBE2L3 (chr22:21,567,746 T&amp;gt;G; c.2T&amp;gt;G; p.Met1?) сцеплением с частым вариантом, был проведен анализ неравновесного сцепления (LD) в окне 350 т.п.н. (Таблица 3). Используя фазированные гаплотипы WGS всех 210 участников и программу PLINK2, мы рассчитали r² для 3620 вариантов (Рис. 3A).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic-f3.jpg\" alt=\"Рисунок 3. Региональная ассоциация и график неравновесного сцепления локуса UBE2L3.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3. Региональная ассоциация и график неравновесного сцепления локуса UBE2L3.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 3. Региональная ассоциация и график неравновесного сцепления локуса UBE2L3. A. -log₁₀(P) для 3620 биаллельных SNP в пределах региона chr22:21.4–21.76 Мб (GRCh38). Каждая точка представляет один вариант; цвет указывает на r² с фазированием относительно индексного варианта (chr22:21,567,746 T&amp;gt;G; фиолетовый ромб), вычисленный на основе гаплотипов WGS у 210 арабских пациентов отделения интенсивной терапии (PLINK2 v2.0.0 -r2-phased). Фиолетовая заливка обозначает тело гена UBE2L3. Пунктирная горизонтальная линия указывает на номинальную значимость (P=0.05). Отсутствие вариантов в сильном неравновесном сцеплении (максимальный r²=0.332; нет вариантов с r²&amp;gt;0.5) подтверждает, что сигнал ассоциации обусловлен редким аллелем, вызывающим потерю старт-кодона, а не сцепленным частым вариантом, что согласуется с арабо-специфичным аллелем-основателем на уникальном гаплотипе. B. Структура гена в локусе UBE2L3 (Ensembl GRCh38). Экзоны показаны в виде закрашенных прямоугольников; интроны — в виде горизонтальных линий с направленными стрелками, указывающими ориентацию транскрипции. Фиолетовая пунктирная вертикальная линия отмечает положение индексного варианта. Координаты GRCh38/hg38.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/ld.html\"&gt;Неравновесное сцепление&lt;/a&gt; (LD) — это неслучайная ассоциация аллелей в разных локусах; если варианты находятся в сильном LD, трудно понять, какой из них является истинной причиной болезни.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Структура LD в локусе UBE2L3 оказалась разреженной. Максимальное значение r² составило 0,332, а лишь девять вариантов во всем регионе имели r² &amp;gt; 0,1 (Таблица 3). Ни один вариант не достиг r² &amp;gt; 0,5. Отсутствие сильного сцепления подтверждает, что сигнал ассоциации вызван непосредственно редким аллелем потери старта трансляции (AF=0,007), а не сцепленным частым вариантом. Это характерно для «аллеля основателя» на уникальном гаплотипе, который не успел накопить LD с окружающими вариантами. Анализ структуры генов (Рис. 3B) показал, что вариант находится в первом экзоне UBE2L3, между генами YDJC и BCR, которые не содержат функционально значимых вариантов в LD с индексом. Таким образом, вариант p.Met1? является единственным достоверным причинным вариантом в данном локусе.&lt;/p&gt;\n&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;h4 id=\"geneticheskaya-osnova-predraspolozhennosti-k-sepsisu\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#geneticheskaya-osnova-predraspolozhennosti-k-sepsisu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Генетическая основа предрасположенности к сепсису&lt;/span&gt;&lt;/a&gt;Генетическая основа предрасположенности к сепсису&lt;/h4&gt;\n&lt;p&gt;В ходе полногеномного поиска ассоциаций (GWAS) с использованием полногеномного секвенирования (WGS) у 210 пациентов арабского происхождения, находящихся в отделениях интенсивной терапии, был обнаружен уникальный вариант потери функции в гене UBE2L3 (c.2T&amp;gt;G; p.Met1?). Этот вариант, вероятно, является «вариантом основателя», специфичным для арабской популяции: он отсутствовал у 14 669 участников программы Qatar Genome Programme и у 251 000 человек из базы данных gnomAD v4.1. Данная находка подчеркивает ограниченность стандартных GWAS, ориентированных на европейские популяции, в выявлении специфических этнических генетических маркеров.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Вариант c.2T&amp;gt;G в гене UBE2L3 является арабским «вариантом основателя», который полностью блокирует инициацию трансляции, что приводит к потере функции белка.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ген UBE2L3 кодирует E2-&lt;a href=\"concepts/ubiquitin.html\"&gt;убиквитин&lt;/a&gt;-конъюгирующий фермент, критически важный для активации NF-κB через путь TLR→NF-κB→цитокины. Мутация в стартовом кодоне, по прогнозам, полностью отключает синтез белка. Ранее UBE2L3 связывали с аутоиммунными заболеваниями (ревматоидный артрит, болезнь Крона, системная красная волчанка), а также с активностью естественных киллеров. Роль UBE2L3 в патогенезе сепсиса объясняется его участием в работе комплекса &lt;a href=\"concepts/lubac.html\"&gt;LUBAC&lt;/a&gt;, который способствует линейному убиквитинированию NEMO и последующей активации NF-κB. Экспериментальное истощение UBE2L3 снижает активацию NF-κB и экспрессию воспалительных генов, что делает этот белок ключевым регулятором интенсивности иммунного ответа.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LUBAC — это белковый комплекс, который «помечает» другие белки (например, NEMO) линейными цепочками убиквитина, запуская каскад воспалительной реакции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дополнительный механизм связи UBE2L3 с сепсисом заключается в регуляции IL-1β. В макрофагах человека и мышей UBE2L3 способствует деградации про-IL-1β через протеасомы. При дефиците UBE2L3 уровень про-IL-1β растет, что ведет к избыточной секреции зрелого IL-1β при активации инфламмасомы. Таким образом, нарушение функции UBE2L3 смещает баланс от защитного воспаления к патологическому «цитокиновому шторму».&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на выборке пациентов интенсивной терапии; выявленная связь требует осторожной интерпретации, так как частота носительства может быть смещена из-за специфики отбора пациентов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Доказательства роли UBE2L3 в предрасположенности к сепсису включают: предсказанную полную потерю функции (CADD = 25.6, SIFT = 0.001), отсутствие в базах данных gnomAD и AoU (более 945 000 человек), наличие только у пациентов (3/68 против 0/142 в контроле, p = 0.026), биологическую значимость в пути NF-κB, независимую валидацию в когорте AoU (SKAT-O P = 2.38×10⁻³) и высокий рейтинг как потенциальной терапевтической мишени.&lt;/p&gt;\n&lt;h4 id=\"ogranicheniya-issledovaniya\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#ogranicheniya-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения исследования&lt;/span&gt;&lt;/a&gt;Ограничения исследования&lt;/h4&gt;\n&lt;p&gt;Данная работа обладает рядом ограничений. Во-первых, относительно небольшая выборка из 210 пациентов снизила статистическую мощность, из-за чего ни один из выявленных вариантов не достиг порога полногеномной значимости. Полученные ассоциации носят предположительный характер и требуют проверки на более крупных когортах. Во-вторых, находка, связанная с геном UBE2L3, хотя и выглядит биологически обоснованной, опирается всего на трех носителей, что делает необходимым проведение функциональной валидации. В-третьих, исследование проводилось на базе одного отделения интенсивной терапии (ОИТ) в Катаре, что ставит под вопрос возможность экстраполяции выводов на другие популяции.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ограниченная выборка (n=210) и специфичность популяции требуют осторожности при интерпретации, однако работа доказывает эффективность полногеномного секвенирования (WGS) для поиска редких вариантов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В-четвертых, дисбаланс между группами (случаи составили 32%) мог снизить мощность анализа, несмотря на применение логистической регрессии Фирта для коррекции этого фактора. В-пятых, отбор участников в рамках одного третичного центра привел к систематической ошибке: контрольная группа состояла из критически больных пациентов без сепсиса, а не из здоровых добровольцев, что ограничивает применимость данных по частоте встречаемости аллелей для всей арабской популяции. Наконец, использование больших языковых моделей (&lt;a href=\"concepts/llm.html\"&gt;LLM&lt;/a&gt;) для приоритизации мишеней носит разведочный характер и не является окончательным доказательством.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование пациентов ОИТ в качестве контроля вместо здоровых людей может искажать популяционные оценки частоты генов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Несмотря на указанные ограничения, данное исследование демонстрирует потенциал полногеномного секвенирования (WGS) в популяциях с эффектом основателя. Этот подход позволяет выявлять редкие варианты с сильным эффектом, которые остаются незамеченными при стандартном генотипировании. Обнаружение специфичных для популяции вариантов с высокой значимостью имеет ключевое значение для развития персонализированной медицины при лечении сепсиса в различных этнических группах.&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"populyaciya-issledovaniya\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#populyaciya-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Популяция исследования&lt;/span&gt;&lt;/a&gt;Популяция исследования&lt;/h4&gt;\n&lt;p&gt;В исследование были включены 210 пациентов отделения интенсивной терапии (ОИТ) Hamad Medical Corporation (IRB 19-00037), из которых 68 случаев составили пациенты с сепсисом, а 142 — без него. Полногеномное секвенирование (WGS) проводилось на приборе Illumina HiSeq 4000 с получением парно-концевых прочтений 2x150 п.н. и целевой глубиной покрытия 30x. Выравнивание на референсный геном GRCh38 выполнялось с помощью BWA, а вызов вариантов — через GATK HaplotypeCaller. Для анализа отобрали 16,6 млн биаллельных аутосомных вариантов с минимальным количеством альтернативных аллелей (minMAC) ≥3.&lt;/p&gt;\n&lt;h4 id=\"kontrol-kachestva\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#kontrol-kachestva\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Контроль качества&lt;/span&gt;&lt;/a&gt;Контроль качества&lt;/h4&gt;\n&lt;p&gt;Контроль качества наиболее значимых сигналов ассоциации проводился через samtools mpileup (v1.20) для всех 210 BAM-файлов. Согласованность частот аллелей (VCF против pileup) проверялась с порогом разницы (deltaAF) &amp;lt;0,03. Также оценивался перекос цепей (strand bias) и проводилась визуальная проверка в Integrative Genomics Viewer (IGV) для подтверждения наличия альтернативных аллелей и исключения артефактов секвенирования.&lt;/p&gt;\n&lt;h4 id=\"fazirovanie\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#fazirovanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Фазирование&lt;/span&gt;&lt;/a&gt;Фазирование&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"concepts/fazirovanie.html\"&gt;Фазирование&lt;/a&gt; генотипов для определения гаплотипов всей когорты выполнено с помощью BEAGLE v5.1. Объединенный VCF-файл с нефазированными генотипами (0/1) был преобразован в фазированный (0/1) и проиндексирован через tabix. Для обеспечения единообразия между сериями секвенирования применялось межсерийное фазирование.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Фазирование — это процесс определения того, на какой из двух хромосом (от отца или от матери) расположены конкретные аллели, что критически важно для понимания гаплотипов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"annotaciya-variantov\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#annotaciya-variantov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Аннотация вариантов&lt;/span&gt;&lt;/a&gt;Аннотация вариантов&lt;/h4&gt;\n&lt;p&gt;Аннотация проводилась комплексом инструментов: rsID присваивались через dbSNP, функциональные эффекты (включая предсказания LOF и &lt;a href=\"concepts/nonsense-mediated-mrna-decay.html\"&gt;NMD&lt;/a&gt;) — через SnpEff (GRCh38.99), клиническая значимость — через ClinVar. Оценки патогенности (SIFT, PolyPhen-2 HDIV, REVEL, MutationTaster, FATHMM, MetaSVM, CADD) извлекались из dbNSFP v5.3.1a. Частоты аллелей в популяции брались из gnomAD v4.1, также проверялось наличие вариантов в базе данных AoU.&lt;/p&gt;\n&lt;h4 id=\"gwas-analiz\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#gwas-analiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GWAS анализ&lt;/span&gt;&lt;/a&gt;GWAS анализ&lt;/h4&gt;\n&lt;p&gt;Полногеномный поиск ассоциаций (GWAS) выполнялся в два этапа через REGENIE v3.2.9. На первом этапе строилась модель гребневой регрессии (LOCO) для оценки полигенного фона. На втором — логистическая регрессия Фирта для учета дисбаланса (68 случаев/142 контроля, доля случаев 32%). Ковариаты: возраст, пол, ИМТ, баллы SOFA и APACHE II, длительность пребывания в ОИТ. Анализ включал 16,6 млн вариантов (minMAC ≥3). Стратифицированный по полу анализ проведен для мужчин (n=111) и женщин (n=99).&lt;/p&gt;\n&lt;h4 id=\"genno-orientirovannoe-testirovanie-na-bremya\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#genno-orientirovannoe-testirovanie-na-bremya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Генно-ориентированное тестирование на бремя&lt;/span&gt;&lt;/a&gt;Генно-ориентированное тестирование на бремя&lt;/h4&gt;\n&lt;p&gt;Тестирование на бремя (burden testing) охватило 20 414 генов с использованием пяти тестов (SKAT, SKAT-O, SKATO-ACAT, ACATV, ACATO) и четырех масок вариантов: M1 (только LoF), M2 (LoF + патогенные миссенс-варианты с CADD ≥20), M3 (LoF + все миссенс-варианты) и M4 (синонимичные варианты как отрицательный контроль). Варианты распределялись по четырем частотным бинам (AAF). Порог значимости с поправкой Бонферрони составил p&amp;lt;6,8×10⁻⁷.&lt;/p&gt;\n&lt;h4 id=\"prioritizaciya-variantov-osnovatelej-i-nezavisimaya-validaciya\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#prioritizaciya-variantov-osnovatelej-i-nezavisimaya-validaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Приоритизация вариантов основателей и независимая валидация&lt;/span&gt;&lt;/a&gt;Приоритизация вариантов основателей и независимая валидация&lt;/h4&gt;\n&lt;p&gt;Кандидатные варианты основателей отбирались по значимости GWAS, высокой патогенности (CADD ≥20), отсутствию в базах gnomAD/AoU и биологической значимости для иммунитета. Из 316 вариантов 31 ген был признан потенциально уникальным для катарской популяции. Валидация гена UBE2L3 проводилась через SKAT-O на 26 939 случаях бактериальных инфекций из программы All of Us.&lt;/p&gt;\n&lt;h4 id=\"analiz-regionalnogo-neravnovesiya-po-scepleniyu\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#analiz-regionalnogo-neravnovesiya-po-scepleniyu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ регионального неравновесия по сцеплению&lt;/span&gt;&lt;/a&gt;Анализ регионального неравновесия по сцеплению&lt;/h4&gt;\n&lt;p&gt;Фазированное значение r² вычислялось через PLINK2 v2.0.0-a.7.1 для региона chr22:21,400,000–21,750,000 (GRCh38). После исключения 860 мультиаллельных вариантов и инделей для анализа осталось 3 620 биаллельных SNP. Координаты генов взяты из Ensembl release 109.&lt;/p&gt;\n&lt;h4 id=\"iskusstvennyj-intellekt-dlya-poiska-lekarstvennyh-mishenej\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#iskusstvennyj-intellekt-dlya-poiska-lekarstvennyh-mishenej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Искусственный интеллект для поиска лекарственных мишеней&lt;/span&gt;&lt;/a&gt;Искусственный интеллект для поиска лекарственных мишеней&lt;/h4&gt;\n&lt;p&gt;Для приоритизации потенциальных лекарственных мишеней исследователи использовали отобранные варианты-основатели, обладающие предсказанным вредоносным эффектом. В качестве инструментов анализа применялись три большие языковые модели (LLM): специализированная модель txgemma-9b, дообученная на данных Therapeutic Data Commons (включая показатели связи генов с заболеваниями из базы DisGeNet), а также две универсальные модели — gemma4-e4b и обновленная gemma4-12b-unified.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM (большие языковые модели) — это алгоритмы глубокого обучения, способные анализировать огромные массивы данных и предсказывать вероятности, в данном случае — оценивать перспективность гена как мишени для терапии.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Каждой модели предоставлялись сводные статистические данные и функциональные аннотации для всех исследуемых вариантов. Задача нейросетей заключалась в присвоении каждому гену балла от 0 до 10, отражающего его привлекательность в качестве мишени для лекарственного воздействия. Полученные результаты сравнивались как между различными моделями, так и внутри каждой модели путем сопоставления «априорных» оценок (полученных без учета данных об ассоциациях) и «апостериорных» оценок (с учетом предоставленной статистической информации).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\
