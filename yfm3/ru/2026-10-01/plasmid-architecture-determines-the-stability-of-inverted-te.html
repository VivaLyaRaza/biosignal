        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"156\" cy=\"139\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"604\" cy=\"255\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · MOLECULAR BIOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как одна деталь в ДНК-&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;конструкторе ломает&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;производство лекарств для&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;генной терапии&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-f1.jpg\" alt=\"Рис. 1. Исходные плазмиды AAV2.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1. Исходные плазмиды AAV2.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 1. Исходные плазмиды AAV2. (a) Одноцепочечный ДНК-геном AAV2 состоит из двух транскрипционных единиц, rep и cap, фланкированных &lt;a href=\"concepts/itr.html\"&gt;ITR&lt;/a&gt;. В контексте двухцепочечной ДНК каждый ITR может образовывать линейную или крестообразную структуру. (b) Исходный изолят AAV2 pSM620 был использован для получения psub201. Дикие 145-п.н. ITR были укорочены до 130 п.н. в процессе клонирования. Сайты XbaI, фланкирующие гены rep и cap, позволили заменить эндогенные геномные элементы на кассеты трансгенов. Относительные положения праймеров, использованных для секвенирования по Сэнгеру, указаны стрелками. (c) Расщепление SmaI выявляет гетерогенность ITR среди отдельных клонов, выделенных из эталонных запасов pSM620 и psub201. (d) Клоны pSM620, проанализированные на панели c, были расщеплены SmaI и BamHI для идентификации делетированного ITR.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Создание препаратов для генной терапии часто напоминает лотерею из-за нестабильности вирусных заготовок в бактериях. Особые концевые структуры ДНК, необходимые для сборки лечебных вирусов, постоянно мутируют и укорачиваются при размножении. Исследователи выяснили, что эта проблема напрямую связана с архитектурой плазмид — кольцевых молекул ДНК. Изменение взаимного расположения элементов внутри плазмиды позволяет полностью защитить терапевтический ген от повреждений.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Инвертированные повторы ITR в плазмидах для генной терапии теряют нуклеотиды из-за близости к точке начала репликации&lt;/li&gt;\n&lt;li&gt;Почти 68% исследованных плазмид из мирового репозитория Addgene уже содержат скрытую мутацию в виде делеции 11 пар нуклеотидов&lt;/li&gt;\n&lt;li&gt;Простая вставка-буфер между точкой начала репликации и повтором ITR полностью стабилизирует ДНК-конструкцию при размножении&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"concepts/raav.html\"&gt;Рекомбинантные аденоассоциированные вирусы&lt;/a&gt; (rAAV) служат основным средством доставки генов в современной медицине. Их производят с помощью бактериальных плазмид (кольцевых молекул ДНК), в которых целевой ген зажат между инвертированными концевыми повторами (ITR, участки ДНК длиной 145 нуклеотидов, способные сворачиваться в Т-образные шпильки). Из-за сложной пространственной структуры ITR-последовательности часто подвергаются делециям (выпадениям участков ДНК) при репликации в бактериях Escherichia coli. Авторы работы разработали биоинформатический конвейер для анализа сырых данных секвенирования Oxford Nanopore и изучили стабильность ITR в различных плазмидах.&lt;/p&gt;\n&lt;p&gt;Анализ базы данных Addgene, содержащей 7041 плазмиду для rAAV, показал, что 4773 из них несут идентичную делецию размером в 11 пар нуклеотидов. Оказалось, что мутациям подвергается преимущественно тот ITR, который расположен ближе к точке начала репликации (&lt;a href=\"concepts/origin-of-replication.html\"&gt;ori&lt;/a&gt;) плазмиды — в 95,3% случаев дефект локализовался именно там. Чтобы решить эту проблему, авторы создали новую векторную систему pAAV2ST, в которой отдалили точку ori от нестабильного повтора с помощью буферной вставки длиной 1320 пар нуклеотидов. Это позволило без потерь размножить крупную кассету &lt;a href=\"concepts/crispr-cas9.html\"&gt;CRISPR-Cas9&lt;/a&gt; размером 4750 пар нуклеотидов и упаковать ее в вирусные капсиды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа опубликована в виде препринта и еще не прошла независимое рецензирование, а влияние обнаруженных мутаций ITR на интеграцию вирусного генома в ДНК клеток пока показано лишь в предварительных тестах in vitro.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Рекомбинантные векторы, полученные из аденоассоциированных вирусов (rAAV), являются основой генной терапии человека. rAAV производятся из плазмид, содержащих трансгенные кассеты, фланкированные инвертированными терминальными повторами (ITR), которые образуют структурированные элементы ДНК, стабилизирующие концы одноцепочечного вирусного генома и являющиеся единственными вирусными последовательностями, необходимыми в цис-положении для упаковки генома. На протяжении десятилетий было известно, что размножение плазмид, содержащих ITR, может приводить к делециям и другим мутациям, что побуждает к использованию специализированных бактериальных штаммов, модифицированных условий культивирования и усеченных или измененных ITR. Несмотря на эти методы, нестабильность ITR остается постоянным источником гетерогенности плазмид.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нестабильность ITR в плазмидах rAAV является следствием их архитектуры, при этом наиболее часто делеции происходят в ITR, расположенном ближе всего к точке начала репликации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для определения детерминант стабильности ITR мы оценили целостность ITR в одном из исходных клонированных изолятов генома AAV2, реконструированной плазмиде AAV2 и синтетическом векторе rAAV, содержащем полноразмерные нативные ITR AAV2. Мы создали количественный биоинформатический рабочий процесс для анализа плазмид, содержащих ITR, и вирусных препаратов на основе необработанных данных секвенирования Oxford Nanopore. Эти эксперименты показали, что ITR были высокостабильными при кратковременном культивировании, тогда как длительное культивирование выявило сильные позиционные эффекты с преимущественной потерей или мутацией ITR, ближайшего к точке начала репликации плазмиды.&lt;/p&gt;\n&lt;p&gt;В соответствии с этой моделью, исследование 7 041 плазмиды &lt;a href=\"concepts/aav.html\"&gt;AAV&lt;/a&gt; из репозитория Addgene, подтвержденных секвенированием, выявило широко распространенную делецию 11 п.н. в ITR у 4 773 плазмид; среди анализируемых плазмид с двумя ITR эта делеция располагалась в проксимальном к точке начала репликации ITR в 95,3% случаев. Руководствуясь этими данными, мы сконструировали новый вектор rAAV со стабильными полноразмерными нативными ITR AAV2, который обеспечил эффективную упаковку кассеты «все в одном» CRISPR-Cas9 размером 4 750 п.н. Наконец, мы разработали клеточную стратегию для сравнения влияния мутаций ITR на интеграцию генома rAAV, предоставив предварительные доказательства того, что вариации последовательности ITR могут влиять на результаты интеграции. В совокупности эти результаты показывают, что нестабильность ITR является предотвратимым, зависящим от положения свойством архитектуры плазмиды, и определяют целостность ITR как важную переменную при проектировании и контроле качества векторов rAAV.&lt;/p&gt;\n&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"rekombinantnye-adenoassociirovannye-virusy\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#rekombinantnye-adenoassociirovannye-virusy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Рекомбинантные аденоассоциированные вирусы&lt;/span&gt;&lt;/a&gt;Рекомбинантные аденоассоциированные вирусы&lt;/h4&gt;\n&lt;p&gt;Рекомбинантные AAV, полученные из аденоассоциированного вируса серотипа 2 (AAV2), широко используются в качестве векторов для генной терапии. Немодифицированный AAV2 состоит из одноцепочечного ДНК-генома размером 4,7 т.п.н., который доставляется икосаэдрическим капсидом диаметром ~20 нм. Нативный геном кодирует две основные открытые рамки считывания, фланкированные инвертированными терминальными повторами (ITR). Эти элементы длиной 145 нт формируют защитные Т-образные дуплексные структуры, которые инициируют синтез второй цепи ДНК и служат сигналами упаковки во время капсидирования генома.&lt;/p&gt;\n&lt;p&gt;Успешное клонирование вирусного генома AAV2 более 40 лет назад позволило получить инфекционный вирус из рекомбинантной плазмиды. ITR являются единственными вирусными элементами, необходимыми для упаковки в цис-положении; остальные вирусные компоненты могут быть заменены кассетами трансгенов. Эти «бесгеномные» рекомбинантные геномы могут быть упакованы путем введения необходимых генов AAV и аденовируса в транс-положении. На практике упаковка rAAV обычно выполняется путем котрансфекции цис-плазмидного вектора, содержащего ITR AAV2, с плазмидами, экспрессирующими комплементарные элементы AAV и аденовируса. Чтобы использовать различный тропизм отдельных серотипов AAV, исследователи успешно упаковывали трансгены, фланкированные ITR AAV2, в различные природные и инженерные капсиды, что известно как псевдотипирование. Для исследовательских и терапевтических целей векторы rAAV ценятся за их способность инфицировать делящиеся и неделящиеся клетки, эписомальную персистенцию и благоприятный профиль безопасности.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Векторы rAAV на основе AAV2 являются стандартом генной терапии благодаря способности к упаковке трансгенов в капсиды с различным тропизмом, однако их производство сталкивается с проблемами гетерогенности состава.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"problemy-proizvodstva-i-geterogennost-raav\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#problemy-proizvodstva-i-geterogennost-raav\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Проблемы производства и гетерогенность rAAV&lt;/span&gt;&lt;/a&gt;Проблемы производства и гетерогенность rAAV&lt;/h4&gt;\n&lt;p&gt;Несмотря на многие технологические достижения, сохраняются серьезные проблемы при крупномасштабном производстве rAAV. Гомогенность и воспроизводимость являются особенно важными факторами для клинического применения. Несмотря на постоянные усилия по стандартизации реагентов и методов производства rAAV, гетерогенность внутри отдельных вирусных препаратов и вариабельность между препаратами остаются проблемными. Вирусные стоки обычно состоят из переменной смеси функциональных вирионов и дефектных частиц. Доля нефункциональных частиц rAAV может значительно варьироваться между препаратами и обычно включает пустые капсиды и вирионы, содержащие одноцепочечные ДНК-геномы с делециями или контаминирующими последовательностями. Для клинического использования дефектные частицы могут снижать эффективность и повышать токсичность, связанную с лечением.&lt;/p&gt;\n&lt;p&gt;Одним из важных контаминантов в препаратах rAAV является остов цис-плазмиды. Нефункциональные вирионы могут образовываться в результате явления, известного как обратная упаковка, при котором вместо желаемой вставки упаковывается остов плазмиды, создавая так называемые snapback-геномы, имеющие только один ITR. Было показано, что snapback-геномы возникают из ITR-подобных последовательностей вне фланкированного трансгена, которые фактически создают скрытые сайты разрешения для репликазного комплекса.&lt;/p&gt;\n&lt;p&gt;Еще одним потенциальным источником гетерогенности в препаратах rAAV является неоднородность стоков цис-плазмид rAAV, используемых для их производства. Хорошо задокументирована тенденция к нестабильности ITR AAV при размножении в стандартных цис-плазмидах. В более широком смысле, высокоструктурированные вирусные последовательности и различные типы повторяющихся элементов часто накапливают делеции и другие типы мутаций при размножении в рекомбинантных плазмидных векторах. Нестабильность ITR обычно считается следствием их палиндромной структуры и высокого содержания GC, что делает их особенно склонными к образованию шпилек и остановкам репликации. Мутации ITR могут нарушить эффективность упаковки, выход и эффективность rAAV in vivo. Чтобы минимизировать дефекты ITR, производители обычно используют различные модифицированные условия культивирования, такие как рост при пониженной температуре, и применяют специализированные штаммы. Несмотря на эти меры, стабильное размножение повторяющихся элементов остается проблематичным.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ITR (инвертированные терминальные повторы) — это концевые участки генома вируса, которые образуют вторичные структуры (шпильки), необходимые для репликации и упаковки вирусной ДНК.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vliyanie-konfiguracii-plazmidy-na-stabilnost-itr\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#vliyanie-konfiguracii-plazmidy-na-stabilnost-itr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Влияние конфигурации плазмиды на стабильность ITR&lt;/span&gt;&lt;/a&gt;Влияние конфигурации плазмиды на стабильность ITR&lt;/h4&gt;\n&lt;p&gt;Ретроспективный взгляд на самые ранние эксперименты по спасению AAV2 предполагает, что два ITR различаются по своей склонности к мутациям при размножении в плазмидных векторах. Было высказано предположение, что относительное положение двух ITR по отношению к началу репликации способствует нестабильности ITR. В этом исследовании мы разработали рабочий процесс, который позволил детально изучить, как конфигурация плазмиды влияет на нестабильность ITR в исходных изолятах AAV2 и синтетических векторах rAAV. Как в низкокопийных, так и в высококопийных векторах стабильность ITR оказалась связанной с положением ITR относительно начала репликации плазмиды. Простая модификация вектора устранила этот позиционный эффект и восстановила стабильность плазмиды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стабильность ITR в плазмидах критически зависит от их расположения относительно точки начала репликации; изменение этой конфигурации позволяет полностью устранить нестабильность.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"harakteristika-itr-v-ishodnyh-plazmidah-aav2\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#harakteristika-itr-v-ishodnyh-plazmidah-aav2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Характеристика ITR в исходных плазмидах AAV2&lt;/span&gt;&lt;/a&gt;Характеристика ITR в исходных плазмидах AAV2&lt;/h4&gt;\n&lt;p&gt;Первичное клонирование нативного генома AAV2 требовало преобразования одноцепочечного генома в двухцепочечную плазмидную вставку. В этой форме ITR могут либо самоотжигаться, принимая крестообразную структуру, либо образовывать линейный дуплекс с комплементарной цепью ДНК (Рис. 1a). Чтобы определить, как плазмидные элементы за пределами вставки AAV2 могут влиять на это структурное равновесие или иным образом воздействовать на стабильность ITR, мы изучили плазмиду pSM620, которая была одним из первых клонированных изолятов AAV2. Мы также исследовали производную pSM620 — плазмиду psub201, которая включает сайты рестрикции XbaI, позволяющие заменить всю область между двумя ITR на трансгенную вставку (Рис. 1b). &lt;a href=\"concepts/plasmid.html\"&gt;Плазмида&lt;/a&gt; psub201 стала предшественником многих векторов, которые в настоящее время широко используются для производства rAAV.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-f1.jpg\" alt=\"Рис. 1. Исходные плазмиды AAV2.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1. Исходные плазмиды AAV2.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 1. Исходные плазмиды AAV2. (a) Одноцепочечный ДНК-геном AAV2 состоит из двух транскрипционных единиц, rep и cap, фланкированных ITR. В контексте двухцепочечной ДНК каждый ITR может образовывать линейную или крестообразную структуру. (b) Исходный изолят AAV2 pSM620 был использован для получения psub201. Дикие 145-п.н. ITR были укорочены до 130 п.н. в процессе клонирования. Сайты XbaI, фланкирующие гены rep и cap, позволили заменить эндогенные геномные элементы на кассеты трансгенов. Относительные положения праймеров, использованных для секвенирования по Сэнгеру, указаны стрелками. (c) Расщепление SmaI выявляет гетерогенность ITR среди отдельных клонов, выделенных из эталонных запасов pSM620 и psub201. (d) Клоны pSM620, проанализированные на панели c, были расщеплены SmaI и BamHI для идентификации делетированного ITR.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анализ плазмид pSM620 и psub201 выявил структурную нестабильность ITR: 3 из 8 изолятов содержали ITR, устойчивые к рестрикции SmaI, что указывает на делеции или повреждения последовательности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Контрольные образцы ДНК pSM620 и psub201 были амплифицированы путем бактериальной трансформации и высева отдельных колоний. Из каждой чашки были случайным образом отобраны четыре колонии, которые выращивались в течение ночи в малом объеме. Экстрагированные ДНК были сначала проанализированы методом рестрикционного анализа. Каждый ITR содержит два сайта узнавания для рестриктазы SmaI (Рис. 1a), которая обычно используется для оценки целостности ITR. Три из восьми плазмидных изолятов содержали ITR, устойчивый к SmaI (Рис. 1c). Двойной рестрикционный анализ субклонов pSM620 показал, что каждый из двух клонов с дефектными ITR сохранил один поврежденный ITR (Рис. 1d).&lt;/p&gt;\n&lt;p&gt;Изоляты pSM620 и psub201, которые могли быть полностью расщеплены SmaI, были затем оценены методом секвенирования по Сэнгеру. Вторичная структура ITR AAV долгое время была препятствием для их секвенирования, но усовершенствованные методы теперь позволяют надежно проводить удлинение праймеров через GC-богатые шпильки и другие высокоструктурированные мотивы последовательностей. Используя праймеры, которые отжигались внутри генома AAV2 (Рис. 1b), мы подтвердили наличие сайтов SmaI в обоих ITR в каждой из двух плазмид. Однако качество последовательности различалось между ITR в каждой плазмиде, несмотря на использование одних и тех же праймеров. Матрица pSM620 дала высококачественную последовательность для правого ITR, в то время как достоверность определения оснований была стабильно ниже для левого ITR (Рис. 2a). Обратная ситуация наблюдалась для плазмиды psub201; в этом случае правый ITR дал данные последовательности относительно низкого качества, которых, тем не менее, было достаточно для выявления делеции размером 21 п.н. (Рис. 2b).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-f2.jpg\" alt=\"Рис. 2. Асимметричное качество секвенирования по Сэнгеру через ITR.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 2. Асимметричное качество секвенирования по Сэнгеру через ITR.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 2. Асимметричное качество секвенирования по Сэнгеру через ITR. Левый и правый ITR SmaI-чувствительных (a) pSM620 и (b) psub201 субклонов, отмеченных звездочками на рис. 1c, были секвенированы модифицированным методом Сэнгера с использованием праймеров, показанных на рис. 1b. Относительная достоверность определения нуклеотидов в каждой позиции указана высотой букв.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/sekvenirovanie-po-sengeru.html\"&gt;Секвенирование по Сэнгеру&lt;/a&gt; — метод определения последовательности ДНК, основанный на использовании терминаторов цепи, который требует высокого качества матрицы для точного прочтения GC-богатых участков.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтобы деконволюционировать то, что казалось гетерогенными последовательностями плазмидной матрицы, элементы ITR в pSM620 были дополнительно охарактеризованы на уровне отдельных молекул с помощью секвенирования ДНК с длинными прочтениями. Прочтения Nanopore, прошедшие минимальный порог качества, были гомогенными по обоим ITR (Рис. 3a, b). Этот анализ позволил определить левый ITR размером 143 п.н. и правый ITR размером 136 п.н., оба в ориентации flop. Два основания отсутствовали на 5’-конце левого ITR, и девять оснований отсутствовали на 3’-конце правого ITR. Небольшая доля прочтений содержала малые индели, встречающиеся с наибольшей частотой на 5’-конце левого ITR (Рис. 3a). В целом, области ITR демонстрировали наибольшую степень гетерогенности, о чем свидетельствуют ошибочные вызовы оснований в наложении прочтений (Рис. 3c).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-f3.jpg\" alt=\"Рис. 3. Нанопоровое секвенирование элементов ITR pSM620.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 3. &lt;a href=\"concepts/nanoporovoe-sekvenirovanie.html\"&gt;Нанопоровое секвенирование&lt;/a&gt; элементов ITR pSM620.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 3. Нанопоровое секвенирование элементов ITR pSM620. Графически проиллюстрирован анализ наслоения прочтений (read pileup) через левый ITR (a) и правый ITR (b). Столбчатая диаграмма с накоплением показывает долю оснований в каждой позиции, как указано на горизонтальной оси. Выявленные вставки и делеции представлены как доля всех прочтений в каждой позиции. График off-mode представляет расхождение прочтений с эталонной последовательностью в каждой позиции. (c) Расхождение последовательности в каждой позиции через вставку AAV2 в pSM620.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"rekonfiguraciya-psm620\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#rekonfiguraciya-psm620\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Реконфигурация pSM620&lt;/span&gt;&lt;/a&gt;Реконфигурация pSM620&lt;/h4&gt;\n&lt;p&gt;Поскольку асимметричное качество сanger-хроматограмм не находило отражения в лежащей в основе последовательности матрицы pSM620, мы проверили, не может ли низкое качество секвенирования по Сэнгеру с левого ITR быть связано со структурными ограничениями для элонгации праймера. Как в pSM620, так и в psub201 затронутый ITR находился рядом с плазмидной точкой начала репликации (Рис. 1b). Элемент точки начала pMB1 (ori типа ColE1) экспрессирует две короткие РНК, регулирующие число копий плазмиды. Мы предположили, что близость к матричным элементам этих высокоструктурированных РНК может объяснять противоречивые данные секвенирования.&lt;/p&gt;\n&lt;p&gt;Плазмида pSM620 изначально была получена путем вставки очищенного генома AAV2 в сайт PstI плазмиды pBR322 с использованием стратегии захвата, включавшей терминальное достраивание гомополимерных хвостов. Сайт вставки в родительской плазмиде pBR322 отделен от ori-элемента pMB1 расстоянием менее 500 п.н. (Рис. 4a). Чтобы исследовать возможное влияние положения точки начала репликации на соседние ITR, мы сконструировали новые плазмиды, встроив кассету AAV2 в &lt;a href=\"concepts/vektor-pbr322.html\"&gt;вектор pBR322&lt;/a&gt;, расщепленный ферментами NheI и BamHI. Полученные плазмиды pBR-AAV2(+) и pBR-AAV2(-) содержали полный геном AAV2, включая два ITR размером по 145 п.н., в обеих ориентациях. Перемещенные и полностью восстановленные ITR находились на расстоянии 1457 п.н. или 2144 п.н. от точки начала pMB1 (Рис. 4a).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-f4.jpg\" alt=\"Рис. 4. Ревизия pSM620.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 4. Ревизия pSM620.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 4. Ревизия pSM620. (a) Исходный изолят AAV2 pSM620 был захвачен в сайт PstI вектора клонирования pBR322, тем самым нарушив ген устойчивости к ампициллину. Чтобы изменить положение ITR относительно элемента ori (оранжевая стрелка), геном AAV2 был реконструирован как вставка NheI-BamHI, как показано. Полученная плазмида pBR-AAV2(-) имеет вставку в той же ориентации, что и pSM620, относительно направления элемента ori. Вторая плазмида, pBR-AAV2(+), содержит вставку AAV2 в противоположной ориентации и не показана. Числа в скобках относятся к нуклеотидным позициям в pBR322. (b) Секвенирование по Сэнгеру было выполнено с использованием праймеров, показанных на рис. 1b. Достоверность определения нуклеотидов в каждой позиции указана высотой букв. Сайты узнавания SmaI подчеркнуты. (c) Анализ наслоения прочтений нанопорового секвенирования через левый и правый ITR pBR-AAV2(-).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ITR (инвертированные концевые повторы) образуют устойчивые шпилечные структуры, а их чрезмерная близость к регуляторным РНК ori-элемента может мешать ферментам репликации и полимеразам.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ITR в плазмидах pBR-AAV2(+) и pBR-AAV2(-) были охарактеризованы с помощью секвенирования по Сэнгеру с использованием тех же праймеров и условий, что и при предыдущем анализе pSM620 и psub201. Оба ITR отлично разрешались на сanger-хроматограммах независимо от ориентации вставки AAV2 (Рис. 4b). Анализ наложений ONT выявил низкий уровень гетерогенности по обоим ITR (Рис. 4c).&lt;/p&gt;\n&lt;p&gt;Затем мы оценили стабильность ITR при длительном культивировании. Мы сравнили pSM620 и pBR-AAV2(-), в которых кассета AAV2 располагалась в одинаковой ориентации относительно точки начала репликации (Рис. 4a). Анализ с расщеплением рестриктазой SmaI показал, что обе плазмиды оставались структурно интактными на протяжении 72 ч культивирования без видимых делеций или перестроек (Рис. 5a). Хотя все четыре сайта узнавания были подтверждены секвенированием ДНК (Рис. 4b), фермент SmaI стабильно не мог расщепить плазмиду pSM620 до конца. Более того, продолжительное культивирование pSM620, по-видимому, вызывало умеренное увеличение относительной доли SmaI-устойчивой ДНК (Рис. 5a). Длинные прочтения ДНК pSM620, выделенной из 72-часовой культуры, выявили потерю 6 п.н. с 5'-конца левого ITR, но в остальном не обнаружили признаков экспансии субклональных популяций плазмид (Рис. 5b).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-f5.jpg\" alt=\"Рис. 5. Стабильность плазмид AAV2 при длительном культивировании.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 5. Стабильность плазмид AAV2 при длительном культивировании.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 5. Стабильность плазмид AAV2 при длительном культивировании. (a) Жидкие бактериальные культуры инкубировались непрерывно в течение 72 ч. С интервалом в 24 ч аликвота каждой культуры серийно разводилась в соотношении 1:1000 в свежую питательную среду. ДНК, экстрагированные в каждой временной точке, расщеплялись SmaI. (b) Анализ вставок и делеций через левый и правый ITR в pSM620 после 72 ч непрерывного культивирования. (c) 72-часовые культуры были высеяны на свежие чашки, и 10 колоний были индивидуально размножены в ночных культурах. Экстрагированные плазмидные ДНК были расщеплены SmaI. Культуры, отмеченные звездочками (*), были высеяны для второго раунда субклонального анализа. (d) Анализ наслоения прочтений нанопорового секвенирования через левый и правый ITR клона pSM620 4, как указано на панели c.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Чтобы более детально оценить стабильность при длительном культивировании, мы использовали 72-часовые образцы ДНК для трансформации бактерий, а затем индивидуально нарастили 10 случайных антибиотикорезистентных колоний. Выделенные ДНК проанализировали расщеплением SmaI, что выявило вариабельность среди субклонов (Рис. 5c). Изолят pSM620 с наибольшей долей нерасщепленной ДНК (клон 4) был подвергнут повторному субклонированию. Картина рестрикции SmaI продемонстрировала высокую частоту делеций ITR среди этих субклонов. Напротив, субклоны, полученные из pBR-AAV2(-), оставались относительно гомогенными даже после второго раунда субклонирования и наращивания (Рис. 5c). Гетерогенность в популяции плазмид клона 4 легко детектировалась с помощью длиннопрочтенного секвенирования (Рис. 5d) и полностью локализовалась в левом, проксимальном к ori, ITR.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Отодвигание ITR от точки начала репликации ori более чем на 1,4 т.п.н. в плазмиде pBR-AAV2(-) стабилизировало повторы и предотвратило появление делеций, которые массово накапливались в pSM620 при субклонировании.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"stabilnost-itr-razmerom-145-pn-v-vysokokopijnoj-plazmide\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#stabilnost-itr-razmerom-145-pn-v-vysokokopijnoj-plazmide\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Стабильность ITR размером 145 п.н. в высококопийной плазмиде&lt;/span&gt;&lt;/a&gt;Стабильность ITR размером 145 п.н. в высококопийной плазмиде&lt;/h4&gt;\n&lt;p&gt;Векторы rAAV, широко используемые сегодня, содержат мутантный ориджин репликации pMB1, который позволяет поддерживать плазмиды с высокой копийностью. Чтобы оценить стабильность ITR в контексте высококопийной плазмиды, мы сконструировали cis-вектор de novo. Правый ITR длиной 145 п.н. и левый ITR длиной 145 п.н. были отдельно синтезированы в бэкбоне pUC57, оба в ориентации flop, чтобы соответствовать конформации pSM620. Затем эти две плазмиды использовались для сборки cis-плазмиды pAAVcis, в которой экспрессионная кассета зелёного флуоресцентного белка (GFP) фланкирована двумя ITR (Рис. 6a).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-f6.jpg\" alt=\"Рисунок 6. Анализ синтетической плазмиды rAAV cis.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 6. Анализ синтетической плазмиды rAAV cis.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 6. Анализ синтетической плазмиды rAAV cis. (a) Кассета экспрессии GFP, фланкированная ITR AAV2 длиной 145 п.н., была собрана в высококопийном векторе клонирования pUC57-KAN. (b) После непрерывного культивирования в течение 72 ч было размножено 10 независимых субклонов, и экстрагированная ДНК была расщеплена SmaI. Культура, отмеченная звездочкой (*, клон 7), была высеяна на свежую чашку Петри для второго раунда субклонального анализа. (c) Анализ ITR плазмиды pAAVcis клона 7 методом нанопорового секвенирования. (d) Ошибочные вызовы оснований (off-mode basecalls) в данных нанопорового покрытия по всей вставке rAAV.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Серия клонирующих векторов pUC содержит множественный сайт клонирования, расположенный вблизи высококопийного ориджина pMB1. В pAAVcis, полученной из pUC57-KAN, ориджин плазмиды отделён от сайта вставки правого ITR расстоянием 477 п.н. (Рис. 6a). Используя стратегию итеративного субклонирования, применявшуюся для анализа плазмид на основе pBR322, мы изолировали клоны pAAVcis с делециями в ITR. Чтобы оценить стабильность ITR и гомогенность популяции плазмиды pAAVcis, мы высевали трансформированные бактерии в предельном разведении и наращивали 10 канамицин-резистентных субклонов для дальнейшего анализа (Рис. 6b). Рестрикция ферментом SmaI выявила явные различия между субклонами pAAVcis с варьирующими пропорциями SmaI-чувствительных и SmaI-резистентных ДНК.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;В высококопийной плазмиде pAAVcis при длительном культивировании правый ITR, расположенный рядом с ориджином репликации, самопроизвольно дивергирует с образованием ~27% инвертированных flip-изомеров, тогда как дальний левый ITR сохраняет стабильную flop-конформацию (&amp;gt;99%).&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Один клон (клон 7; Рис. 6b), который, по-видимому, давал несоразмерно высокий уровень нерасщеплённого материала, был дополнительно проанализирован методом нанопорового секвенирования. Прочтения по всему левому ITR были относительно гомогенными, однако наблюдалась заметная последовательностная гетерогенность среди прочтений, картированных на соседствующий с ori правый ITR (Рис. 6c). Интересно, что анализ последовательности выявил смесь изомеров flip и flop в области правого ITR. В отличие от конфигурации flip-flop в pSM620, оба ITR в pAAVcis были созданы в ориентации flop и поэтому были идентичны. После продолжительного пассирования около 27% молекул плазмид содержали отчётливый вариант последовательности во внутренней петле ближнего к ori правого ITR, причём каждая из 17 информативных позиций во внутренней петле указывала на наличие минорной популяции с ориентацией flip (Рис. 6c). Напротив, удалённый от ориджина левый ITR оставался гомогенно в ориентации flop (&amp;lt;1% flip в соответствующих позициях). Эти данные свидетельствуют о том, что чистая популяция плазмиды pAAVcis дивергировала в смесь плазмид, при этом в ближнем к ориджину ITR появились конфигурации как flip, так и flop. Анализ всей вставки rAAV показал, что отчётливый пик гетерогенности располагался именно внутри правого ITR (Рис. 6d).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Нанопоровое секвенирование — метод считывания длинных одиночных молекул ДНК или РНК в реальном времени при их прохождении через белковые поры в мембране, позволяющий выявлять структурные перестройки и смешанные варианты изомеров без необходимости &lt;a href=\"concepts/ptsr.html\"&gt;ПЦР&lt;/a&gt;-амплификации.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;pAAV2ST: стабилизированный вектор для клонирования rAAV&lt;/p&gt;\n&lt;p&gt;Далее мы проверили, можно ли стабилизировать правый ITR в плазмиде pAAVcis путем увеличения расстояния до ориджина репликации. Фрагмент ДНК размером 1 797 п.н., содержащий ген устойчивости к тетрациклину из pBR322, был вставлен между правым ITR и ориджином с получением входного вектора pAAV2ST (Рис. 7a). Чтобы оценить стабильность конструкции, более близкой к типичному rAAV, предназначенному для терапевтического переноса генов, мы заменили вставку NotI размером 1 569 п.н., содержащую экспрессионную кассету GFP, на систему «всё в одном» CRISPR/SaCas9, ранее разработанную Фэном Чжаном с соавторами для инактивации локуса Pcsk9 мыши in vivo. Общий размер полученной плазмиды pAAV2ST-Pcsk9sg1 составил 8 722 п.н. (Рис. 7b).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-f7.jpg\" alt=\"Рисунок 7. Стабильное распространение ITR, фланкирующих систему CRISPR/SaCas9 размером 4750 п.н.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 7. Стабильное распространение ITR, фланкирующих систему CRISPR/SaCas9 размером 4750 п.н.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 7. Стабильное распространение ITR, фланкирующих систему CRISPR/SaCas9 размером 4750 п.н. (a) Селективный маркер tetr из pBR322 был вставлен между соседними элементами ori и ITR в pAAVcis для создания нового входного вектора pAAV2ST (ST = стабильный). Элементы ori и правый ITR в pAAV2ST находятся на расстоянии 1797 п.н. друг от друга, как показано. Кассета GFP может быть вырезана путем расщепления NotI. Альтернативно, расщепление BsaI облегчает направленное клонирование методом Golden Gate (31). (b) Кассета экспрессии GFP была заменена вставкой SaCas9, запрограммированной на нацеливание на локус Pcsk9 мыши (17). (c) Бактерии, содержащие плазмиду pAAV2ST-Pcsk9sg1, культивировались серийно в течение 72 ч. ДНК, экстрагированные с интервалом 24 ч, были расщеплены SmaI. (d) ДНК pAAV2ST-Pcsk9sg1 из 10-мг гигапрепа была оставлена неразрезанной или расщеплена SmaI перед гель-электрофорезом, как указано. Расщепленные ДНК из 10 независимых субклонов были проанализированы на одном геле. (e) Анализ покрытия нанопоровых прочтений ITR из крупномасштабного препарата ДНК pAAV2ST-Pcsk9sg1. Нуклеотидные позиции показаны на горизонтальных осях.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Стабильность вектора pAAV2ST подтверждена при наработке в бактериальных культурах и упаковке в аденоассоциированные вирусные капсиды, однако его функциональная эффективность и безопасность требуeт дальнейшей валидации in vivo.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Вектор pAAV2ST-Pcsk9sg1 расщеплялся SmaI практически полностью и демонстрировал structural стабильность в ходе последовательного пассирования (Рис. 7c). Препарат плазмидной ДНК, наработанный в крупном масштабе для упаковки, состоял преимущественно из суперскрученной формы без детектируемых линейных молекул (Рис. 7d). Субклоны, полученные из этой популяции, содержали низкую долю высокомолекулярной ДНК после гидролиза SmaI, как ранее наблюдалось для pBR-AAV2(-). Нанопоровое секвенирование этого высокоамплифицированного препарата не выявило мутантных субпопуляций. Оба ITR выглядели гомогенными, за исключением фокальной области на 3'-конце правого ITR (Рис. 7e).&lt;/p&gt;\n&lt;p&gt;Вставка плазмиды pAAV2ST-Pcsk9sg1 была упакована в капсиды AAV8 коммерческим производителем с использованием стандартных методик. Согласно контролю качества на основе кПЦР, выполненному производителем, суммарно было упаковано 5,61E+13 вирусных геномов, что существенно превышало спецификацию в 1,0E+13. После очистки методом масс-фотометрии были разрешены две основные популяции частиц. Пик при 3 700 кДа, соответствующий пустым капсидам, составлял 29,5% популяции; 70,3% частиц представляли собой полные капсиды, сфокусированные в пике 5 200 кДа (Рис. 8a). Затем мы визуализировали отдельные капсиды в нашей лаборатории с помощью негативного контрастирования с последующей ПЭМ (Рис. 8b). Этот анализ показал, что 79,7 ± 3,0% капсидов были полными, а 20,2 ± 3,0% — пустыми.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-f8.jpg\" alt=\"Рисунок 8. Анализ вирусного стока, полученного из pAAV2ST-Pcsk9sg1.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 8. Анализ вирусного стока, полученного из pAAV2ST-Pcsk9sg1.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 8. Анализ вирусного стока, полученного из pAAV2ST-Pcsk9sg1. (a) Анализ методом масс-фотометрии градиентно-очищенных частиц AAV8. (b) Очищенные вирусные частицы, визуализированные с помощью просвечивающей электронной микроскопии при 57 000-кратном увеличении. Примеры пустых капсидов указаны белыми стрелками. Масштабная линейка = 100 нм. (c) Указано распределение прочтений, выравнивающихся с трансгенным грузом, ДНК Rep-Cap и вспомогательной плазмиды, геномом E. coli и некартированными прочтениями. (d) Распределение длин инкапсидированных геномных ДНК, оцененное методом нанопорового секвенирования ДНК. (e) Начальные и конечные координаты всех прочтений, картирующихся на фланкированный ITR трансген.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Вектор pAAV2ST обеспечил высокий выход полноразмерного вирусного генома при упаковке в капсиды AAV8 (5,61E+13 геномов; ~70–80% полных капсидов по данным масс-фотометрии и ПЭМ), при этом &amp;gt;98% инкапсидированной ДНК точно соответствовали цельной трансгенной кассете.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Целостность нативной инкапсидированной ДНК оценивали с помощью прямого нанопорового секвенирования с использованием новоразработанного рабочего процесса. Более 98% полученных прочтений картировались на трансгенную кассету (Рис. 8c) и по размеру соответствовали полной длине вставки pAAVST-Pcsk9sg1 (Рис. 8d,e).&lt;/p&gt;\n&lt;h4 id=\"shiroko-rasprostranennaya-mutaciya-itr\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#shiroko-rasprostranennaya-mutaciya-itr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Широко распространенная мутация ITR&lt;/span&gt;&lt;/a&gt;Широко распространенная мутация ITR&lt;/h4&gt;\n&lt;p&gt;Важным следствием нестабильности ITR является клональная экспансия мутантных субпопуляций. Делеция 11 п.н. в ITR (далее именуемая Δ11) была ранее обнаружена в распространенном векторе pAAV-MCS. Недавнее исследование rAAV-плазмид в репозитории Addgene, проведенное Radukic и соавт., показало, что внутренние делеции в ITR встречаются часто. Мы стремились определить распространенность специфического мутанта ITR Δ11 среди всех плазмид, депонированных в Addgene, и выяснить, демонстрирует ли эта мутация устойчивую позиционную связь с бактериальным началом репликации (ori).&lt;/p&gt;\n&lt;p&gt;Для оценки последовательностей ITR в репозитории плазмид Addgene был создан многоэтапный биоинформатический конвейер (Рис. 9a). Данные последовательностей были получены из комплексной публичной выгрузки Addgene, включающей приблизительно 1,34 Гб плазмидных последовательностей. Скрининг на основе метаданных выявил 7 491 плазмиду, связанную с AAV, которые затем были оценены путем поиска ITR на уровне последовательностей. Этот анализ выявил 7 041 плазмиду, содержащую как минимум один детектируемый ITR AAV. Большинство верифицируемых по последовательности плазмид AAV содержали два предполагаемых ITR: 6 824 плазмиды были классифицированы как векторы с двумя ITR, 213 — как векторы с одним ITR и 4 — как записи, похожие на векторы с тремя ITR. Из общего числа 13 873 обнаруженных ITR 13 752 (99,1%) были классифицированы как flop-изомеры и (0,9%) — как flip-изомеры.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-f9.jpg\" alt=\"Рисунок 9. Обзор архитектур ITR в плазмидах Addgene AAV cis на основе последовательностей.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 9. Обзор архитектур ITR в плазмидах Addgene AAV cis на основе последовательностей.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 9. Обзор архитектур ITR в плазмидах Addgene AAV cis на основе последовательностей. (a) Конвейер анализа: набор данных последовательностей плазмид Addgene содержал 177 835 плазмид и 297 680 записей последовательностей. Фильтрация метаданных выявила 7491 плазмиду-кандидат AAV, из которых 7041 содержала верифицируемые по последовательности ITR AAV. Большинство плазмид, содержащих ITR, имели два предполагаемых ITR. (b) Структурные классы среди 6824 плазмид с двумя ITR. Два ITR обозначены по их соответствующей длине как первый ITR/второй ITR. Доминирующая архитектура состояла из одного ITR длиной 119 п.н. с мутацией Δ11 и одного ITR длиной 130 п.н. Примерно одна треть этих плазмид содержала два ITR по 130 п.н. Значительно меньшее количество cis-плазмид содержало два полноразмерных ITR по 145 п.н.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мутация Δ11 обнаружена в 67,8% проанализированных ITR-позитивных плазмид, при этом в 95,3% случаев она локализована в ITR, ближайшем к бактериальному сайту начала репликации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Затем мы провели независимый поиск точного мотива для 34-п.н. последовательности, соответствующей мутации Δ11. Этот поиск выявил 4 773 плазмиды, содержащие как минимум один точный мотив Δ11, что составляет 67,8% ITR-позитивных плазмид и 69,8% плазмид с двумя или более предполагаемыми ITR. На уровне плазмид 4 763 плазмиды содержали один точный мотив Δ11, тогда как только 10 содержали два точных мотива Δ11. Ни одна плазмида, содержащая точный мотив Δ11, не была лишена детектируемого ITR, что подтверждает специфичность поиска на основе мотивов.&lt;/p&gt;\n&lt;p&gt;Поскольку наши экспериментальные данные предполагали, что на нестабильность ITR влияет близость к элементу ori, мы задались вопросом, локализованы ли ITR Δ11 преимущественно вблизи аннотированного начала репликации. Аннотации GenBank использовались для идентификации бактериальных начал репликации плазмид, а совместимость координат между данными Addgene и файлами GenBank была подтверждена на тестовой выборке. Мы ограничили анализ близости к началу репликации плазмидами, имеющими ровно два предполагаемых ITR и ровно один точный мотив Δ11 в репрезентативной полной последовательности. Из 4 773 Δ11-позитивных плазмид 25 были исключены, так как они не соответствовали этим критериям или не могли быть проанализированы. Среди оставшихся 4 748 плазмид ITR, содержащий Δ11, был ближайшим к бактериальному началу репликации в 4 524 случаях (95,3%) и не был ближайшим в 224 случаях (4,7%). Таким образом, среди тысяч депонированных последовательностей плазмид AAV делеция Δ11 сильно обогащена в ITR, проксимальном к началу репликации, что согласуется с асимметричной, зависящей от положения нестабильностью ITR.&lt;/p&gt;\n&lt;p&gt;Интересно, что небольшое количество плазмид содержало два точных мотива Δ11. Ручной осмотр этих 10 случаев показал, что 9 содержали два раздельных локуса Δ11, связанных с ITR, тогда как один, по-видимому, отражал локальную сборку или дупликацию, связанную с линеаризацией, а не два независимых мутантных ITR.&lt;/p&gt;\n&lt;p&gt;В большинстве плазмид AAV, распространяемых Addgene, элементы ITR имели длину либо 130 п.н., либо 119 п.н. (Рис. 9b). ITR длиной 130 п.н., по-видимому, возникли в результате 15-п.н. усечения, созданного при конструировании psub201. Дополнительная делеция Δ11 в ITR, проксимальном к ori, уменьшила общий размер до 119 п.н. Эта рекуррентная 11-п.н. мутация ITR расположена внутри шпильки C/C’ (Рис. 10a), где, согласно прогнозам, она нарушает спаривание оснований, стабилизирующее нативную Т-образную конформацию ITR.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-f10.jpg\" alt=\"Рисунок 10. ITR, представленные в опубликованных плазмидах rAAV cis.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 10. ITR, представленные в опубликованных плазмидах rAAV cis.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 10. ITR, представленные в опубликованных плазмидах rAAV cis. (a) Нативный ITR длиной 145 нт содержит дуплексную область (A/A'), две шпильки (B/B' и C/C') и одноцепочечный домен (D). Элемент связывания, распознаваемый белком Rep, выделен рамкой. Заштрихованные части представляют нуклеотиды, удаленные в результате 11-нт внутренней делеции и 15-нт усечения, обычно встречающихся в современных рекомбинантных векторах AAV. Дуплекс C/C' образует дуплексный сайт распознавания SmaI, как указано. (b) ITR длиной 130 нт был создан путем предкового 15-нт усечения. (c) Обычный ITR длиной 119 нт содержит 15-п.н. усечение и 11-нт внутреннюю делецию Δ11. (d) Плазмида с ITR длиной 145 нт (pL-ITR) и вариант, содержащий 11-п.н. внутреннюю делецию (pL-ITRΔ11), были синтезированы индивидуально. Две плазмиды были расщеплены возрастающими количествами SmaI и разделены в нативном агарозном геле. Положения суперспирализованных неразрезанных, линейных и ник-форм указаны на рисунке.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ITR (инвертированные терминальные повторы) — это специфические последовательности ДНК на концах генома AAV, которые образуют вторичные структуры (шпильки), необходимые для репликации и упаковки вирусного генома.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vliyanie-mutantnyh-posledovatelnostej-itr-na-genomnuyu-integraciyu\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#vliyanie-mutantnyh-posledovatelnostej-itr-na-genomnuyu-integraciyu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Влияние мутантных последовательностей ITR на геномную интеграцию&lt;/span&gt;&lt;/a&gt;Влияние мутантных последовательностей ITR на геномную интеграцию&lt;/h4&gt;\n&lt;p&gt;Мы создали две плазмиды с одним ITR, pL-ITR и pL-ITRΔ11, которые содержали 145-п.н. ITR и 134-п.н. ITR с делецией 11 п.н. соответственно, но в остальном были идентичны. Общая делеция устраняет один из двух сайтов SmaI, присутствующих в немутантном ITR. Одним из последствий внутренней делеции является прогнозируемая потеря дуплексной структуры в ядре сайта узнавания SmaI, 5’-CCCGGG-3’ (Рис. 10a). Поскольку только дуплексная форма сайта узнавания SmaI является субстратом для расщепления, мы смогли использовать SmaI для исследования структурного равновесия между дуплексной и нативной формами мутантного ITR (концепция проиллюстрирована на Рис. 4a). Мутантный ITR был более устойчив к расщеплению при предельных концентрациях фермента, что указывает на стабильную нативную конформацию (Рис. 10b). Дикий тип ITR, который должен быть чувствителен к SmaI как в нативной, так и в дуплексной конформации, был расщеплен почти полностью при предельных количествах фермента, как и ожидалось.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Делеция 11 п.н. в ITR стабилизирует нативную конформацию «шпильки», что снижает доступность сайта SmaI для ферментативного расщепления.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтобы начать исследовать, может ли эта измененная шпилька повлиять на склонность к вирусной интеграции в геном хозяина, мы разработали новый метод анализа вирусной интеграции. Этот метод был разработан для одновременного измерения негомологичной интеграции, которая в значительной степени зависит от микро-гомологий, общих для ITR и сайтов интеграции, и гомологичной интеграции, которая зависит от гомологично-зависимой репарации более крупных матриц. Мы предположили, что повышенная склонность к инсерционному мутагенезу будет отражаться в снижении соотношения гомологичной интеграции к негомологичной интеграции.&lt;/p&gt;\n&lt;p&gt;Мы модифицировали существующий вектор для направленного редактирования генов, pSEPT-p53, который интегрируется в локус TP53 человека с высокой эффективностью [24]. Конструкция pSEPT-p53 содержит синтетическую ловушку промотора экзона, которая позволяет экспрессировать селективный маркер только тогда, когда он интегрирован ниже эндогенного промотора, тем самым обогащая клоны, возникающие в результате событий гомологичной интеграции (Рис. 11a). Плечи гомологии в pSEPT-p53 были спроектированы таким образом, чтобы ген устойчивости к неомицину (neor) заменял 80-п.н. сегмент в первом кодирующем экзоне. Сама кассета лишена промотора, поэтому эписомальные ДНК не могут обеспечить устойчивость к препарату; события негомологичной интеграции могут быть обнаружены только в том случае, если neor расположен ниже активного промотора.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-f11.jpg\" alt=\"Рисунок 11. Оценка относительных уровней гомологичной и негомологичной интеграции.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 11. Оценка относительных уровней гомологичной и негомологичной интеграции.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 11. Оценка относительных уровней гомологичной и негомологичной интеграции. (a) Производная pAAV-MCS, pSEPT-p53, представляет собой вектор-ловушку промотора, предназначенный для гомологичной интеграции вирусных геномов в локус TP53 человека (18). Два домена гомологии (HA-1 и HA-2) определяют небольшую делецию во втором экзоне, которая при гомологичной интеграции заменяется на неомициновую кассету без промотора (слева). Эта конструкция также интегрируется в нецелевые сайты, имеющие микрогомологию с ITR; остатки ITR должны присутствовать на стыках между эндогенным геном и целевой конструкцией (справа). Относительный риск инсерционного мутагенеза можно оценить по соотношению целевых и нецелевых событий интеграции. (b) Вставка NotI-NotI из pSEPT-p53 была клонирована в обеих ориентациях в асимметричный остов pAAV-MCS и в pAAVcis. Указана длина правого и левого ITR в п.н. относительно ориентации вставки. (c) Количество колоний, устойчивых к неомицину (neor), полученных от каждого из трех векторов, было подсчитано через три недели после инфицирования клеток HCT116 (серые столбцы) или клеток hTERT-RPE1 (белые столбцы). Векторы обозначены как длина левого ITR / длина правого ITR вдоль горизонтальных осей. (d) Доля колоний neor, возникших в результате гомологичной интеграции в локус TP53.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/promoter-trap.html\"&gt;Ловушка промотора&lt;/a&gt; (promoter trap) — метод, при котором репортерный ген активируется только при встраивании в активный ген, что позволяет отбирать клетки с точной интеграцией.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Первоначально созданная на основе pAAV-MCS, плазмида pSEPT-p53 имеет 130-п.н. ITR выше селективного маркера и 119-п.н. ITR ниже (Рис. 11b). Вставка была фланкирована сайтами NotI, поэтому мы смогли перевернуть вставку и тем самым создать сопоставимый вектор в противоположной ориентации. Вставка для направленного редактирования генов NotI-NotI также была введена в плазмиду pAAVcis вместо кассеты экспрессии GFP (Рис. 7a).&lt;/p&gt;\n&lt;p&gt;Интеграция упакованных вирусных геномов, оцениваемая по образованию колоний, была примерно в 10 раз выше в линии клеток колоректального рака HCT116 с дефицитом репарации несоответствий, чем в иммортализованной теломеразой линии клеток человека hTERT-RPE1 (Рис. 11c). В обеих клеточных линиях вирус, полученный из конструкции с ITR дикого типа, генерировал меньшее количество устойчивых к препарату колоний, чем любой из двух вирусов, полученных из конструкций с мутантными ITR. В то время как доля гомологичных интегрантов в HCT116 была схожей для всех трех вирусов, конструкция с ITR дикого типа была связана с более высокой частотой гомологичной интеграции в hTERT-RPE1 (Рис. 11d). В hTERT-RPE1 вирус, полученный из конструкции со 119-п.н. ITR в вышестоящей конфигурации, по-видимому, интегрировался несколько чаще в целом, чем вектор в обратной ориентации (Рис. 11c), и генерировал умеренно более высокую долю гомологичных рекомбинантов (Рис. 11d).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдаемые различия в частоте интеграции получены на клеточных линиях in vitro; экстраполяция этих данных на живые организмы требует осторожности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;h4 id=\"stabilnost-itr-i-vliyanie-raspolozheniya-oridzhina-replikacii\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#stabilnost-itr-i-vliyanie-raspolozheniya-oridzhina-replikacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Стабильность ITR и влияние расположения ориджина репликации&lt;/span&gt;&lt;/a&gt;Стабильность ITR и влияние расположения ориджина репликации&lt;/h4&gt;\n&lt;p&gt;ITR-элементы AAV2 имеют хорошо известную склонность к делециям в ходе повторяющихся циклов амплификации плазмид. Эта специфическая форма генетической нестабильности приводит к гетерогенности популяций плазмид и является потенциальным источником вариабельности препаратов вируса. В данном исследовании мы продемонстрировали, что нестабильность не является внутренним свойством ITR, а представляет собой идиосинкразический дефект, обусловленный их расположением. Реконфигурировав исходный изолят AAV2 pSM620 так, чтобы оба ITR находились на расстоянии &amp;gt;1,4 т.п.н. от ориджина pMB1, мы смогли снизить потерю ITR до практически необнаруживаемого уровня. Синтетический вектор с высоким числом копий можно аналогичным образом стабилизировать путем увеличения расстояния между ориджином и ITR. Целостность ITR сохранялась даже при размножении плазмид в стандартных штаммах бактерий (E. coli DH5α), выращенных в обычных условиях культивирования.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Увеличение расстояния между ориджином pMB1 и ITR до &amp;gt;1,4 т.п.н. практически полностью устраняет делеции ITR, обеспечивая стабильность плазмид даже в стандартных штаммах E. coli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Секвенирование длинными прочтениями на платформе nanopore и анализ покрытия (pileup) сырых прочтений позволили количественно оценить гетерогенность плазмид и исследовать позиционный эффект с разрешением до одной молекулы. Мы обнаружили, что оба ITR сохранялись при амплификации pSM620 из одной колонии (Рис. 3a,b). Однако длительное культивирование в условиях насыщения приводило к деградации левого ITR и экспансии субклонов с делецией ITR (Рис. 5a-d). Асимметричная нестабильность ITR в pSM620, ставшая очевидной после длительного культивирования, наблюдалась и в синтетической конструкции pAAVcis (Рис. 6a-d), что подтверждает вывод о том, что близость к ориджину является определяющим фактором.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/nanopore-sekvenirovanie.html\"&gt;Nanopore-секвенирование&lt;/a&gt; — метод чтения длинных фрагментов ДНК, позволяющий выявлять структурные вариации и гетерогенность плазмид на уровне отдельных молекул.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ori pMB1 функционирует направленно, но, по-видимому, влияет на стабильность соседнего ITR независимо от ориентации. Асимметричное распределение сигнала flip/flop между двумя ITR в pAAVcis и его отсутствие в проксимальном к ориджину левом ITR низкокопийной плазмиды pSM620 (производной pBR322) позволяют предположить, что геометрия репликативной вилки может быть дополнительным фактором, способствующим наблюдаемым позиционным эффектам. В плазмидах типа ColE1 от ориджина исходит одна однонаправленная вилка. В pAAVcis ориджин ориентирован так, что репликативная вилка встречает правый ITR со стороны его внешнего палиндромного конца, при этом D-последовательность реплицируется последней (Рис. 6a). При такой геометрии смысловая цепь ITR служит матрицей для отстающей цепи и может образовывать каноническую Т-образную шпильку, в которой внутренняя петля flip/flop экспонирована как одноцепочечная петля.&lt;/p&gt;\n&lt;p&gt;Хотя наше исследование не было направлено на прямое изучение механистической основы наблюдаемого позиционного эффекта, мы предполагаем, что соседство ориджина и ITR создает гибриды РНК-ДНК, которые могут способствовать рекомбинации. Ori pMB1 представляет собой тонко настроенный РНК-ДНК-переключатель, опосредованный структурными взаимодействиями. Сам ориджин богат А/Т-парами, что облегчает денатурацию ДНК. Число копий плазмиды определяется взаимодействием двух некодирующих РНК. Транскрипт RNA II синтезируется со стартовой точки примерно на 550 п.н. выше, формируя структуру, известную как R-петля, которая служит праймером для репликации ДНК. Антисмысловая РНК, RNA I, образует три шпильки, которые разрушают R-петлю, оказывая тем самым супрессивное действие на праймирование. В низкокопийных плазмидах кодируемый плазмидой белок Rop стабилизирует взаимодействие между двумя РНК и, таким образом, дополнительно усиливает контроль числа копий. В конечном счете, число копий плазмиды является функцией относительных уровней этих двух РНК и стабильности их взаимодействия. Необходимы дальнейшие исследования, чтобы определить, какая область сложной структуры ориджина могла непосредственно повлиять на конформационное состояние ITR.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Механизм влияния ориджина на ITR остается гипотетическим; наблюдаемые эффекты могут зависеть от специфических условий репликации в бактериальных клетках.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Комплексный анализ, проведенный Radukic et al., недавно выявил несколько факторов, способствующих нестабильности ITR, включая близость к ориджину. Одним из примечательных выводов стало то, что остановка репликации ДНК на последовательностях ITR запускает деградацию комплексом нуклеаз SbcCD. Сообщалось, что очень близкое расположение ориджина и элементов ITR (&amp;lt;300 п.н.) является особенно сильным детерминантом деградации ITR. Культивирование плазмид, содержащих ITR, в штаммах с дефицитом SbcC при повышенной температуре 42°C приводило к значительному улучшению стабильности ITR. Radukic et al. отметили, что ITR были стабильны на минимальном расстоянии 438 п.н. от ориджина плазмиды. Напротив, в экспериментальных условиях нашего исследования мы наблюдали, что стабильность можно улучшить путем увеличения расстояния от ITR до ориджина с 474 п.н. до &amp;gt;1 т.п.н. Требуются дальнейшие исследования, чтобы определить, могут ли улучшенные методы, предложенные Radukic et al., синергировать с увеличением расстояния между ITR и ориджином.&lt;/p&gt;\n&lt;p&gt;Во многих случаях последствия мутаций ITR могут быть нивелированы в ходе репликации и упаковки генома. Небольшие изменения исправляются путем рекомбинации между двумя ITR, в то время как нуклеотиды, отсутствующие на любом из концов генома AAV, такие как терминальные п.н., утраченные в psub201, восстанавливаются путем матричного синтеза ДНК. Соответственно, экспериментально было показано, что небольшие делеции, затрагивающие один ITR, практически не влияют на продукцию вируса. Тем не менее, сохраняющаяся распространенность одной делеции в 11 п.н. среди опубликованных векторов и в большинстве верифицируемых по последовательности плазмид AAV в репозитории Addgene (Рис. 9a) ясно демонстрирует ограничения механизмов самовосстановления.&lt;/p&gt;\n&lt;p&gt;Крупные делеции ITR представляют собой более очевидную проблему. Вирионы могут быть эффективно получены из плазмидных векторов с одним ITR, но капсидированные геномы, как правило, неполные и загрязнены «snapback»-геномами. Простые меры, такие как использование векторов, оптимизированных по стабильности ITR, были бы прямым и недорогим подходом к минимизации потери ITR и, тем самым, к ограничению подобных дефектов.&lt;/p&gt;\n&lt;h4 id=\"stabilizaciya-itr-i-kachestvo-virusnyh-vektorov\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#stabilizaciya-itr-i-kachestvo-virusnyh-vektorov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Стабилизация ITR и качество вирусных векторов&lt;/span&gt;&lt;/a&gt;Стабилизация ITR и качество вирусных векторов&lt;/h4&gt;\n&lt;p&gt;Стабилизация элементов ITR плазмиды не привела к устранению образования пустых капсидов (Рис. 8a,b). Тем не менее, препарат AAV, полученный из стока pAAV2ST-Pcsk9sg1, характеризовался высоким качеством и титром. Согласно нашему анализу методом ПЭМ (Рис. 8b), доля полных капсидов AAV8, полученных из вектора pAAV2ST-Pcsk9sg1, была очень близка к доле полных капсидов (78,1%), описанной в работе Khaparde et al., где рассматривалось получение исследовательского стока AAV8, очищенного ультрацентрифугированием и проанализированного с помощью ПЭМ.&lt;/p&gt;\n&lt;p&gt;Влияние стабильности вектора на общее качество рескуированного вируса трудно поддается количественной оценке. Наши попытки снизить вероятность полной потери ITR в плазмидной ДНК, предназначенной для упаковки, по-видимому, не нарушили эффективность упаковки, однако неясно, произошло ли значительное улучшение стандартных показателей качества. Важно отметить, что сток pAAV2ST-Pcsk9sg1 был упакован и очищен однократно на коммерческом предприятии. Потребуются дополнительные исследования, чтобы подтвердить, что вирусы, полученные из входного вектора pAAV2ST, обладают стабильно высоким качеством и выходом.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стабилизация ITR не устранила образование пустых капсидов, но позволила получить вектор с высоким титром и долей полных капсидов (78,1%), сопоставимой с опубликованными данными.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"genomnaya-integraciya-raav\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#genomnaya-integraciya-raav\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Геномная интеграция rAAV&lt;/span&gt;&lt;/a&gt;Геномная интеграция rAAV&lt;/h4&gt;\n&lt;p&gt;Замечательная персистенция экспрессии трансгена, опосредованная rAAV, является одним из важных свойств этих векторов. Большинство внутриклеточных вирусных геномов стабилизируются в двухцепочечном эписомальном состоянии, но небольшая часть интегрируется в геном хозяина. Эти события интеграции, хотя и относительно редкие, вызвали опасения, что геномный мутагенез, опосредованный rAAV, может увеличить риск развития рака.&lt;/p&gt;\n&lt;p&gt;Геномная интеграция дикого типа AAV в специфические сайты генома человека требует вирусных белков Rep68 и Rep78, которые связываются с сайтом узнавания внутри ITR (Рис. 10A) и вносят разрыв в мотив, называемый сайтом терминального разрешения. Эта реакция никирования инициирует перенос цепи между ITR и участками генома хозяина, имеющими короткую область гомологии. В rAAV отсутствует ген Rep, поэтому они не интегрируются заметным образом в эти специфические локусы. Однако интеграция rAAV происходит с низкой частотой, как правило, через механизмы негомологичного соединения концов, включающие шпильки ITR. Негомологичная интеграция представляется неслучайной, поскольку геномы rAAV непропорционально часто интегрируются в многочисленные «горячие точки», которые обычно обнаруживаются в CpG-островках и активно транскрибируемых генах. Одноцепочечная область генома rAAV может служить отличным субстратом для гомологичной рекомбинации, и такие векторы широко используются для направленного редактирования генов.&lt;/p&gt;\n&lt;p&gt;Наш анализ геномной интеграции использовал высокую эффективность, с которой ранее разработанный вектор для направленного редактирования генов rAAV мог нарушать работу TP53. Мы предположили, что повышенная скорость негомологичной интеграции должна привести к большему количеству событий интеграции в целом и соразмерному снижению скорости гомологичной рекомбинации. В обеих клеточных линиях векторы, сохранившие делецию 11 п.н., стабильно интегрировались с более высокой частотой по сравнению с вектором, имевшим два полных ITR (Рис. 11C). Только в клетках hTERT-RPE1 эта более высокая частота интеграции была связана с более низкой частотой гомологичной интеграции. Повышенная скорость гомологичной рекомбинации в HCT116 во многом объясняется дефектной системой репарации ошибочно спаренных оснований (MMR), которая устраняет зависимость от полной идентичности последовательностей между вектором и сайтом-мишенью. Возможно, что более строгие требования к гомологичной рекомбинации в клетках hTERT-RPE1 с нормальной системой MMR подчеркнули различия между векторами. Таким образом, эти клетки могут идеально подходить для подобных анализов. В целом, rAAV интегрировались в клетки HCT116 со значительно более высокой частотой. Этот результат может просто отражать общую тенденцию раковых клеток переносить генетические изменения, но мы не можем исключить более специфические различия между этими двумя клеточными линиями, такие как их восприимчивость к AAV.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;rAAV — рекомбинантные аденоассоциированные вирусы, используемые как векторы для доставки генов; MMR — система репарации ДНК, исправляющая ошибки спаривания нуклеотидов.&lt;br /&gt;\n[!warning] Наблюдаемые различия в частоте интеграции могут зависеть от специфических свойств клеточных линий (например, дефектов MMR в HCT116), а не только от структуры ITR вектора.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Представленные здесь данные об интеграции следует интерпретировать с осторожностью. Наша цель состояла в том, чтобы изучить ратиометрический подход к оценке вирусной интеграции. Хотя наше исследование показало, что мутантные ITR оказывают измеримое влияние на баланс негомологичной и гомологичной интеграции, дизайн этого предварительного эксперимента исключал возможность строгого статистического анализа. Потребуются дополнительные эксперименты для подтверждения этих результатов с использованием нескольких вирусных стоков и повторных инфекций. С механистической точки зрения было бы важно идентифицировать специфические соединения между последовательностями генома хозяина и интегрированными векторами, чтобы оценить, могла ли мутация ITR повлиять на предпочтения в выборе сайта интеграции. Тем не менее, описанный здесь анализ представляет собой новый подход к изучению интеграции, который может быть применен более широко. Дальнейшие доработки этого метода могли бы значительно его улучшить. Например, использование вектора, который эффективно нацеливается на селектируемый ген, такой как HPRT, обеспечило бы более простое считывание результатов гомологичной интеграции. Учитывая, что векторы rAAV, содержащие делецию 11 п.н., весьма вероятно, использовались в клинических испытаниях, мы считаем, что дополнительные исследования вполне оправданы.&lt;/p&gt;\n&lt;p&gt;Данное исследование имело ряд других ограничений. В ходе реконфигурации плазмиды pSM620 мы устранили гомополимерные G/C-тракты, фланкирующие геномную вставку AAV2. Будучи пережитком исходного процесса клонирования, эти последовательности, как было показано ранее, увеличивают общую нестабильность ITR. Однако устранение нестабильности в синтетической конструкции pAAVcis, в которой отсутствуют фланкирующие гомополимерные последовательности pSM620, предполагает, что близость к точке начала репликации является более значимым дестабилизирующим фактором.&lt;/p&gt;\n&lt;p&gt;Наша зависимость от нескольких различных маркерных генов является еще одним потенциальным ограничением. Вектор pBR322 обеспечивает устойчивость как к ампициллину/карбенициллину, так и к тетрациклину/доксициклину (Рис. 4a). Расположение вставок AAV2 приводило к нарушению одного или другого из этих маркеров. В результате pSM620 приходилось размножать в присутствии доксициклина, тогда как для поддержания плазмид pBR-AAV2 требовалась селекция с помощью карбенициллина. Мы не можем исключить влияние различных селективных давлений как фактора, способствующего наблюдаемым различиям между низкокопийными плазмидами. Тем не менее, стабилизация pAAV2ST включала только селекцию канамицином, что вновь указывает на то, что близость к точке начала репликации имела первостепенное значение.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование различных маркерных генов и селективных условий могло повлиять на стабильность плазмид, однако близость к точке начала репликации остается ключевым фактором стабилизации pAAV2ST.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Вектор pBR322 — это классическая плазмида, используемая в молекулярном клонировании, которая содержит гены устойчивости к антибиотикам, позволяющие отбирать бактерии, успешно поглотившие плазмидную ДНК.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/spa
