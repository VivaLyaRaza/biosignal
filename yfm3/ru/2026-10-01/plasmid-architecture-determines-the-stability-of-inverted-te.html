n&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"plazmidy\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#plazmidy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Плазмиды&lt;/span&gt;&lt;/a&gt;Плазмиды&lt;/h4&gt;\n&lt;p&gt;Плазмиды AAV2 pSM620 и psub201 были получены из National Gene Vector Biorepository (NGVB). Плазмиды pAAV-RC и pHelper были изначально приобретены у Stratagene, ныне Agilent Technologies (Ла-Хойя, Калифорния), как компоненты их набора AAV-Helper Free.&lt;/p&gt;\n&lt;p&gt;Плазмидная ДНК размножалась в штамме E. coli DH5α, производном NEB5 (New England Biolabs, Ипсуич, Массачусетс). Данный штамм имеет генотип: fhuA2::IS2 Δ(mmuP-mhpD)169 ΔphoA8 glnX44 80d[ΔlacZ58(M15)] rfbD1 gyrA96 luxS11 recA1 endA1 rphWT thiE1 hsdR17. Химически компетентные бактерии трансформировались методом теплового шока и культивировались в бульоне Луриа-Бертани (LB) или на агаровых чашках LB. В зависимости от селективного маркера условия бактериальной селекции включали 100 мкг/мл карбенициллина, 50 мкг/мл канамицина или 20 мкг/мл доксициклина.&lt;/p&gt;\n&lt;p&gt;Два ITR AAV2 размером 145 п.н. были синтезированы в отдельных плазмидах компанией Genscript, Inc. (Пискатауэй, Нью-Джерси), оба в ориентации flop. Левый ITR был синтезирован в pUC57-KAN; правый ITR был синтезирован с кассетой экспрессии зеленого флуоресцентного белка (GFP) размером 1577 п.н. в pUC57-AMP. Кассета правого ITR-GFP была вырезана и вставлена в совместимые сайты плазмиды с левым ITR для создания плазмиды pAAVcis. Эта плазмида была дополнительно модифицирована путем отделения ori от правого ITR с помощью фрагмента-стаффера. Сегмент pBR322 размером 1320 п.н., содержащий открытую рамку считывания Tetr, был амплифицирован с помощью прямого праймера 5’-AACACATGTTCTCATGTTTGACAGCTTATC-3’ и обратного праймера 5’-accACATGTCTTGGAGTGGTGAATCCG-3’. Амплифицированная ДНК была очищена в геле, а концы обработаны PciI для лигирования в уникальный сайт рестрикции PciI в pAAVcis. Полученная плазмида pAAV2ST была депонирована в Addgene (плазмида №239400; http://n2t.net/addgene:239400; RRID:Addgene_239400).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ITR (инвертированные терминальные повторы) — это специфические последовательности ДНК на концах генома AAV, необходимые для репликации и упаковки вирусного вектора.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Плазмида pAAV2ST-Pcsk9sg1 была сконструирована путем внесения протоспейсера Pcsk1sg1 5’-CACCGCAGCCACGCAGAGCA-3’ [17] в плазмиду pX602-AAV-TBG::NLS-SaCas9-NLS-HA-OLLAS-bGHpA;U6::BsaI-sgRNA (предоставлена д-ром Фэн Чжаном, плазмида Addgene №61593) и последующей амплификации вставки NotI-NotI размером 4428 п.н. с использованием прямого праймера 5’-CCTGCGGCCGCTCTAGACTCGAGGGGCTGGAAG-3’ и обратного праймера 5’-CCTGCGGCCGCGAGGGCCTATTTCCCATGATTC-3’. Полученный фрагмент был клонирован в pAAV2ST, расщепленный NotI.&lt;/p&gt;\n&lt;p&gt;Плазмиды pBR-AAV2(-) и pBR-AAV2(+) были сконструированы в два этапа. Сначала фрагмент pAAVcis, содержащий оба ITR и трансген GFP, был вставлен в сайты NheI и BamHI плазмиды pBR322. Затем геномные последовательности AAV2 между двумя ITR в pSM620 были амплифицированы с помощью Platinum SuperFi II Master Mix (Thermo Scientific) с использованием праймеров 5’-ATCACTAGGGGTTCCTGGAGGGGTGGAGTCGTGACG-3’ и 5’-ATCACTAGGGGTTCCTTGTAGTTAATGATTAACCCG-3’. Полученная вставка была бесшовно клонирована в промежуточный вектор, расщепленный NotI, с помощью набора NEBuilder (New England Biolabs, Ипсуич, Массачусетс). Аннотированные последовательности для следующих плазмид были депонированы в GenBank: pSM620 (номер доступа PZ196606), pAAV2ST (номер доступа PX505299), pAAV2ST-Pcsk9sg1 (номер доступа PX505298).&lt;/p&gt;\n&lt;h4 id=\"virusnaya-upakovka-i-analiz\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#virusnaya-upakovka-i-analiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вирусная упаковка и анализ&lt;/span&gt;&lt;/a&gt;Вирусная упаковка и анализ&lt;/h4&gt;\n&lt;p&gt;Плазмида pAAV2ST-Pcsk9sg1 была амплифицирована в промышленном масштабе и впоследствии упакована в капсиды AAV8 компанией VectorBuilder, Inc. (Чикаго, Иллинойс). Очищенный препарат был первоначально оценен методом масс-фотометрии компанией SignaGen, Inc (Фредерик, Мэриленд). Для анализа методом просвечивающей электронной микроскопии (ПЭМ) частицы наносились непосредственно на сетку и окрашивались негативно 1% фосфорновольфрамовой кислотой. Подготовка образцов и визуализация проводились на базе микроскопии Медицинской школы Университета Джонса Хопкинса.&lt;/p&gt;\n&lt;h4 id=\"sekvenirovanie-dnk\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#sekvenirovanie-dnk\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Секвенирование ДНК&lt;/span&gt;&lt;/a&gt;Секвенирование ДНК&lt;/h4&gt;\n&lt;p&gt;ITR-области плазмид AAV2 были секвенированы компанией Genewiz/Azenta (Саут-Плейнфилд, Нью-Джерси) с использованием проприетарного протокола секвенирования по Сэнгеру, оптимизированного для шпилечных структур. Праймеры для секвенирования: правый ITR: 5’-ACTTTGGTCTCTGCGTATTTCT-3’; левый ITR: 5’-AACACTCACGTGACCTCTAATAC-3’.&lt;/p&gt;\n&lt;p&gt;Секвенирование длинными прочтениями Oxford Nanopore Technologies (ONT, Оксфорд, Великобритания) плазмидных конструкций было выполнено компанией Genewiz/Azenta. Кратко: образцы плазмид подвергались подготовке библиотеки, оптимизированной для кольцевых ДНК-матриц, и секвенировались на проточных ячейках ONT с использованием стандартной химии лигирования. Сырые прочтения nanopore были обработаны для определения оснований (basecalling) провайдером с использованием модели Oxford Nanopore dna_r10.4.1_e8.2_400bps_sup-v4.1.0 (высокоточная модель SUP для химии R10.4.1).&lt;/p&gt;\n&lt;p&gt;Гетерогенность определения оснований в каждой позиции по всей плазменной последовательности оценивалась с помощью пользовательского конвейера Python, примененного непосредственно к сырым прочтениям ONT FASTQ. Прочтения выравнивались с кольцевыми референсными последовательностями с использованием алгоритма seed-chain с заполнением гэпов методом Нидлмана-Вунша с полосой. Кратко: k-мерный индекс (k = 12, шаг = 3) был построен на основе референсной последовательности, и для каждого прочтения ориентация цепи определялась по плотности попаданий k-меров. Смещение выравнивания оценивалось путем диагонального голосования по попаданиям k-меров. Прочтения, охватывающие точку линеаризации референса, обнаруживались путем идентификации второй доминирующей диагонали, смещенной примерно на одну длину плазмиды. Выровненные основания записывались в каждой референсной позиции, а гэпы между якорями разрешались выравниванием Нидлмана-Вунша с полосой (полуширина полосы = 12). Концы прочтений выравнивались по той же процедуре на протяжении максимум 80 п.н. Для каждой референсной позиции были табулированы покрытие и количество оснований (A, T, G и C), а также вычислен показатель отклонения как доля определений оснований, не соответствующих референсному основанию. Позиции с отклонением ≥ 10% при покрытии ≥ 50× помечались для дальнейшей проверки.&lt;/p&gt;\n&lt;p&gt;Все анализы выполнялись с использованием Python 3.12 с библиотеками NumPy, pandas и matplotlib. Стороннее программное обеспечение для выравнивания не использовалось. Референсные последовательности линеаризовались в позиции, удаленной от обоих ITR (&amp;gt; 2 т.п.н.), чтобы предотвратить артефакты выравнивания на границах палиндромных последовательностей.&lt;/p&gt;\n&lt;h4 id=\"analiz-sekvenirovaniya-oxford-nanopore\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#analiz-sekvenirovaniya-oxford-nanopore\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ секвенирования Oxford Nanopore&lt;/span&gt;&lt;/a&gt;Анализ секвенирования Oxford Nanopore&lt;/h4&gt;\n&lt;p&gt;Считывания Oxford Nanopore, полученные из капсидированных вирусных геномов AAV, анализировались с помощью специализированного конвейера контроля качества (aav_genome_qc.py). Инвертированные терминальные повторы (ITR) автоматически детектировались из полноразмерной референсной последовательности cis-плазмиды на основе палиндромной структуры и специфичных для серотипа мотивов. Считывания выравнивались с референсом cis-плазмиды с использованием minimap2 через mappy с предустановкой «map-ont». Анализ контаминации проводился путем конкурентного картирования на референсные последовательности helper-плазмиды, rep-cap-плазмиды и хозяина (E. coli), при этом считывания присваивались тому референсу, который обеспечивал наивысший показатель качества картирования (минимальное значение &lt;a href=\"concepts/mapping-quality.html\"&gt;MAPQ&lt;/a&gt; ≥ 20).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MAPQ (Mapping Quality) — это показатель достоверности того, что считывание было картировано в правильное место генома; значение ≥ 20 означает вероятность ошибки менее 1%.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Считывания, картирующиеся на трансген, структурно классифицировались на полноразмерные одноцепочечные AAV (ssAAV), полноразмерные самокомплементарные AAV (scAAV), частичные ssAAV (фрагменты генома с неполным 5' или 3' концом), частичные scAAV (snapback-геномы) или продукты обратной упаковки на основе координат выравнивания относительно границ ITR. Попозиционное покрытие и покрытие, специфичное для цепи, рассчитывались по всей области вставки трансгена с фильтрацией по качеству оснований (минимальное Q ≥ 10). Статистика покрытия ITR вычислялась отдельно для обоих терминальных повторов. Горячие точки усечения идентифицировались по начальным и конечным координатам выравнивания считываний, картирующихся на трансген. Все результаты экспортировались в виде CSV-файлов и визуализировались в виде графиков в Excel. Все файлы FASTQ доступны в архиве Sequence Read Archive (PRJNA1439403, опубликовано 19.03.2026). Код анализа доступен по ссылке https://github.com/fredbunz-lgtm/aav-itr-pileup (DOI: 10.5281/zenodo.19186494).&lt;/p&gt;\n&lt;h4 id=\"obzor-repozitoriya-plazmid-addgene\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#obzor-repozitoriya-plazmid-addgene\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор репозитория плазмид Addgene&lt;/span&gt;&lt;/a&gt;Обзор репозитория плазмид Addgene&lt;/h4&gt;\n&lt;p&gt;Данные о последовательностях плазмид Addgene были получены через API для разработчиков Addgene с использованием аутентификации на основе токенов. Поскольку доступ к поиску по каталогу был ограничен, для анализа последовательностей использовалась массовая загрузка плазмид вместе с их последовательностями. Полученный JSON-файл считывался потоково, чтобы избежать загрузки всего набора данных в оперативную память. Сначала использовался скрининг на основе метаданных для идентификации плазмид-кандидатов, связанных с AAV. Затем плазмиды-кандидаты сканировались на наличие последовательностей ITR AAV с использованием рабочего процесса обнаружения ITR на основе локального выравнивания. Вызовы ITR на уровне последовательностей сводились к сводкам на уровне плазмид с использованием репрезентативных записей последовательностей, чтобы избежать учета нескольких файлов последовательностей одной и той же плазмиды как независимых биологических ITR. Если для плазмиды было доступно несколько записей последовательностей, репрезентативные записи для структурной классификации ITR выбирались на основе наличия и количества обнаруживаемых ITR.&lt;/p&gt;\n&lt;p&gt;Вызовы ITR классифицировались путем выравнивания с референсными последовательностями ITR AAV2, представляющими как конфигурации «flip» и «flop», так и обе депонированные ориентации цепей. Для каждого вызова ITR использовался наиболее подходящий референс для определения конфигурации «flip/flop». Структурные классы ITR присваивались на основе выровненного участка референса, выровненного участка плазмиды и статуса соединения Δ11. ITR классифицировались как полноразмерные ITR длиной 145 п.н., усеченные ITR длиной 130 п.н., ITR с делецией Δ11 длиной 119 п.н., ITR длиной 119 п.н., подобные Δ11, но не имеющие точного мотива Δ11, или другие измененные/усеченные ITR. Плазмиды, содержащие два предполагаемых ITR, затем суммировались по архитектуре парных ITR. pAAV2ST (плазмида Addgene 239400) служила положительным контролем для обнаружения двух полноразмерных ITR длиной 145 п.н.&lt;/p&gt;\n&lt;p&gt;Распространенность мутации Δ11 оценивалась путем поиска 34-п.н. последовательности, соответствующей 11-п.н. делеции, в обеих ориентациях. Кольцевые последовательности обрабатывались путем добавления первых 33 оснований каждой последовательности к ее концу, что позволяло обнаруживать экземпляры мотивов, охватывающие точку линеаризации последовательности, без дублирования подсчета внутренних мотивов. Известная контрольная последовательность, содержащая Δ11, использовалась для подтверждения того, что рабочий процесс поиска точного мотива сообщал об одном ожидаемом экземпляре мотива.&lt;/p&gt;\n&lt;p&gt;Для анализа близости к ориджину координаты бактериального начала репликации были получены из аннотаций признаков rep_origin в GenBank. Координаты ITR и Δ11, полученные из массовых последовательностей, сравнивались с координатами последовательностей GenBank после подтверждения соответствия длины последовательности, идентичности последовательности и положения Δ11 между репрезентативными записями массовых данных и GenBank. Плазмиды включались в первичный анализ близости к ориджину только в том случае, если репрезентативная последовательность содержала ровно два предполагаемых ITR и ровно один точный мотив Δ11. Рассчитывалось круговое расстояние от середины каждого ITR до середины бактериального ориджина, и ITR, содержащий Δ11, классифицировался в зависимости от того, был ли он ближе или дальше по отношению к аннотированному элементу ori плазмиды.&lt;/p&gt;\n&lt;h4 id=\"analiz-genomnoj-integracii\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#analiz-genomnoj-integracii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ геномной интеграции&lt;/span&gt;&lt;/a&gt;Анализ геномной интеграции&lt;/h4&gt;\n&lt;p&gt;Вектор для направленного редактирования генов pSEPTp53 содержит кассету для нокаута TP53, состоящую из двух плеч гомологии длиной ~1 т.п.н., фланкирующих синтетическую экзонную ловушку промотора. Данная кассета была клонирована в сайты NotI вектора AAV pAAV-MCS (Agilent). Плазмида pSEPTp53 была расщеплена ферментом NotI, и дефосфорилированный фрагмент был повторно вставлен в расщепленный NotI вектор pAAV-MCS в обеих ориентациях. Тот же фрагмент был напрямую клонирован в сайты NotI плазмиды pAAVcis. Три полученные плазмиды были упакованы в капсиды AAV2 с использованием системы AAV Helper-Free System (Agilent), как описано ранее. Неочищенные вирусные стоки были титрованы методом количественной ПЦР (&lt;a href=\"concepts/qpcr.html\"&gt;qPCR&lt;/a&gt;) и добавлены к клеткам HCT116 и hTERT-RPE1, растущим в виде субконфлюэнтных монослойных культур, при множественности заражения (&lt;a href=\"concepts/moi.html\"&gt;MOI&lt;/a&gt;), равной 10.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Множественность заражения (MOI) — это среднее количество вирусных частиц, приходящихся на одну клетку в культуре; в данном случае на каждую клетку приходится 10 вирусных частиц.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Через три дня после инфицирования клетки были откреплены с помощью трипсина-EDTA и высеяны методом предельных разведений в 96-луночные планшеты (Corning) в среде, дополненной 0,4 мг/мл генетицина (ThermoFisher Scientific). От 60 до 110 отдельных колоний было подсчитано для каждого набора планшетов, и геномная ДНК была экстрагирована непосредственно с использованием реагента Lyse-N-Go PCR (Pierce Biotechnology, Рокфорд, Иллинойс). ПЦР-скрининг на гомологичную интеграцию в локус TP53 проводился с использованием фермента Platinum Taq (ThermoFisher Scientific) согласно рекомендациям производителя с применением праймеров: p53R, 5’-TGTGTGTGACTGCTTGTAG-3’; NeoFor, 5’-TCTGGATTCATCGACTGTGG-3’. Образцы, давшие положительный сигнал размером 1,8 т.п.н., были подтверждены второй ПЦР с праймерами: p53F, 5’-CTGGGAGAAGGTGCGATGAT-3’; NeoRev, 5’-GTTGTGCCCAGTCATAGCCG-3’, которые генерировали полосу размером 2,2 т.п.н. при событиях гомологичной интеграции.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Мутации в&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;заготовках для&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;генной терапии&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Секвенирование&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Nanopore и&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;анализ Addgene&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Выявлена связь&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нестабильности&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;с точкой ori&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity
