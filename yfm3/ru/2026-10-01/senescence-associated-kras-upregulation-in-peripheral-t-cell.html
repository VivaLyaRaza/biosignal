            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"140\" cy=\"165\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"580\" cy=\"194\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · BIOINFORMATICS   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Почему иммунитет стареет&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;раньше времени: роль белка&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;KRAS в развитии сердечных&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;болезней&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell-f1.jpg\" alt=\"Рисунок 1. Рабочий процесс данного исследования.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Рабочий процесс данного исследования.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Сердечно-сосудистые заболевания все чаще встречаются у молодых людей, но причины этого процесса остаются не до конца понятными. Новое исследование показывает, что ключевую роль здесь может играть &lt;a href=\"concepts/kras.html\"&gt;белок KRAS&lt;/a&gt;, который активируется в иммунных клетках. Его избыток заставляет Т-лимфоциты «стареть» раньше времени, что провоцирует воспаление и повреждение сосудов. Это открытие может стать отправной точкой для разработки новых методов диагностики и терапии.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;KRAS выступает ключевым регулятором старения в эффекторных CD8+ Т-лимфоцитах&lt;/li&gt;\n&lt;li&gt;Высокий уровень KRAS в Т-клетках коррелирует с тяжестью атеросклеротических бляшек&lt;/li&gt;\n&lt;li&gt;Виртуальный скрининг выявил потенциальные малые молекулы для таргетного воздействия на KRAS&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Исследователи проанализировали транскриптомные профили мононуклеаров периферической крови (&lt;a href=\"concepts/pbmc.html\"&gt;PBMC&lt;/a&gt;) у пациентов с преждевременной ишемической болезнью сердца (PCAD) и контрольной группы. С помощью секвенирования РНК единичных клеток (&lt;a href=\"concepts/scrna-seq.html\"&gt;scRNA-seq&lt;/a&gt;) было установлено, что ген KRAS аномально экспрессируется преимущественно в эффекторных CD8+ Т-лимфоцитах. Эти клетки демонстрируют признаки клеточного старения и истощения, а также повышенную цитотоксичность, что способствует развитию атеросклеротических бляшек.&lt;/p&gt;\n&lt;p&gt;Для проверки функциональной значимости KRAS авторы применили &lt;a href=\"concepts/in-silico-gene-perturbation.html\"&gt;алгоритм виртуального нокаута&lt;/a&gt; (&lt;a href=\"concepts/virtualnyy-nokaut.html\"&gt;in silico&lt;/a&gt; gene perturbation), который показал, что подавление этого гена существенно меняет пути клеточного киллинга. С помощью методов молекулярного докинга и глубокого обучения было предсказано соединение, способное связываться с неактивной формой KRAS. Полученные данные подтверждают, что накопление «старых» Т-клеток в сосудистой стенке является важным патогенетическим звеном при раннем атеросклерозе.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа основана на корреляционном анализе и компьютерном моделировании; требуются экспериментальные исследования на живых организмах для подтверждения терапевтического эффекта.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Преждевременная ишемическая болезнь сердца (ПИБС) не имеет четко определенных молекулярных механизмов, а роль иммунного старения в её развитии остается неясной. В данной работе мы изучили, влияет ли нарушение регуляции генов, связанных со старением, в Т-лимфоцитах на возникновение ПИБС.&lt;/p&gt;\n&lt;p&gt;Для анализа мы использовали комплексный подход: полнотранскриптомное секвенирование (bulk &lt;a href=\"concepts/rna-seq.html\"&gt;RNA-seq&lt;/a&gt;) мононуклеаров периферической крови (PBMC) от 12 пациентов с ПИБС и 21 здорового добровольца, а также &lt;a href=\"concepts/single-cell-rna-sequencing.html\"&gt;секвенирование РНК единичных клеток&lt;/a&gt; (scRNA-seq) PBMC и образцов атеросклеротических бляшек человека. Применялись методы взвешенного анализа сетей коэкспрессии генов (&lt;a href=\"concepts/wgcna.html\"&gt;WGCNA&lt;/a&gt;), анализа сетей возмущений генов и молекулярного докинга.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;WGCNA — это статистический метод для поиска групп (модулей) генов, которые работают согласованно, что помогает выявить ключевые биологические процессы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ген KRAS был идентифицирован как центральный узел (хаб), связывающий гены, ассоциированные с ПИБС, и гены, связанные со старением. Анализ на уровне единичных клеток показал, что экспрессия KRAS повышена преимущественно в эффекторных CD8+ Т-клетках. Эти клетки демонстрировали наиболее высокие показатели старения (senescence scores), которые дополнительно возрастали при наличии заболевания. Имитационное воздействие на сеть KRAS показало его значительное влияние на пути клеточной цитотоксичности. &lt;a href=\"concepts/effector-cd8-t-lymphocytes.html\"&gt;Эффекторные CD8+ Т-клетки&lt;/a&gt; с высоким уровнем KRAS были обнаружены в коронарных и сонных артериях, где они проявляли признаки повышенной цитотоксичности, истощения и старения. Кроме того, с помощью компьютерного моделирования было предсказано малое молекулярное соединение, способное связываться с неактивной формой KRAS.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Повышенная экспрессия KRAS в стареющих цитотоксических CD8+ Т-клетках является ключевым звеном ПИБС, связывающим иммунное старение и ранний атеросклероз.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Активация KRAS в стареющих цитотоксических CD8+ Т-клетках ассоциирована с ПИБС, что позволяет рассматривать этот механизм как мост между иммуностарением и ранним атеросклерозом. Полученные данные открывают перспективы для использования KRAS в качестве биомаркера и потенциальной терапевтической мишени, однако требуют дальнейшей функциональной проверки.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа основана на биоинформатическом анализе и данных секвенирования; для подтверждения терапевтического потенциала необходимы экспериментальные исследования in vivo.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"aktualnost-i-klinicheskie-vyzovy-pcad\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#aktualnost-i-klinicheskie-vyzovy-pcad\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Актуальность и клинические вызовы PCAD&lt;/span&gt;&lt;/a&gt;Актуальность и клинические вызовы PCAD&lt;/h4&gt;\n&lt;p&gt;Преждевременная ишемическая болезнь сердца (PCAD) представляет собой сложную и всё более острую проблему кардиологии. Долгое время ей уделяли недостаточно внимания, так как заболеваемость среди молодых людей была значительно ниже, чем в старших возрастных группах. Однако смертность от сердечно-сосудистых заболеваний среди молодежи остается высокой, а доля острого инфаркта миокарда (AMI) в этой популяции неуклонно растет. Современные стратегии профилактики опираются на шкалы риска, разработанные для людей среднего и пожилого возраста, что приводит к систематической недооценке угроз для молодых пациентов. В результате диагноз часто ставится уже после острого сердечно-сосудистого события, а отсутствие надежных эпидемиологических данных ограничивает создание точных методов терапии.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PCAD часто диагностируется слишком поздно из-за неэффективности стандартных шкал риска, что требует поиска новых молекулярных драйверов болезни.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Хотя у большинства молодых пациентов присутствуют классические факторы риска (курение, ожирение, гиперлипидемия), ускоренное развитие атеросклероза требует более глубокого изучения. Старение является независимым фактором риска ИБС, сопровождающимся иммуностарением — функциональным ухудшением иммунной системы, характеризующимся нарушением секреции цитокинов и изменением состава иммунных клеток. Это состояние способствует хроническому воспалению, стимулирующему атеросклероз. В частности, у пожилых пациентов в атеросклеротических бляшках накапливаются стареющие Т-клетки, которые теряют способность распознавать антигены окисленного ЛПНП и секретируют провоспалительные хемокины.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/immunostarenie.html\"&gt;Иммуностарение&lt;/a&gt; — это процесс возрастного накопления «уставших» иммунных клеток, которые теряют защитные функции и начинают поддерживать хроническое воспаление.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rol-kras-i-dizajn-issledovaniya\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#rol-kras-i-dizajn-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Роль KRAS и дизайн исследования&lt;/span&gt;&lt;/a&gt;Роль KRAS и дизайн исследования&lt;/h4&gt;\n&lt;p&gt;Роль Т-клеточного иммуностарения при PCAD остается неясной. Белок KRAS, малая ГТФаза, регулирует пролиферацию и выживаемость клеток через каскады MAPK/ERK, PI3K/AKT/mTOR и другие. Известно, что аномальная активация KRAS (даже без мутаций) может индуцировать клеточное старение. В данном исследовании авторы интегрировали транскриптомное профилирование, scRNA-seq, виртуальный &lt;a href=\"concepts/knock-out.html\"&gt;нокаут&lt;/a&gt; генов, глубокое обучение для поиска соединений и &lt;a href=\"concepts/molekulyarnyy-doking.html\"&gt;молекулярный докинг&lt;/a&gt;. Было установлено, что KRAS является ключевым геном, связывающим PCAD с процессами старения, причем его экспрессия повышена преимущественно в эффекторных CD8+ Т-клетках.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Виртуальный нокаут — это вычислительный метод, позволяющий с помощью алгоритмов предсказать, как изменится поведение клетки, если «отключить» конкретный ген, не проводя реальный эксперимент.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ показал, что высокий уровень KRAS запускает цитотоксическую программу и ассоциирован с признаками клеточного старения. Эта субпопуляция CD8+ Т-клеток была подтверждена в данных по коронарным и каротидным бляшкам. С помощью ИИ-модели был предложен малый молекулярный кандидат, способный связываться с KRAS, что открывает путь к терапии «неподдающегося лечению» белка. Общий ход работы представлен на Рис. 1.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell-f1.jpg\" alt=\"Рисунок 1. Рабочий процесс данного исследования.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Рабочий процесс данного исследования.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"poluchenie-obshedostupnyh-dannyh\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#poluchenie-obshedostupnyh-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Получение общедоступных данных&lt;/span&gt;&lt;/a&gt;Получение общедоступных данных&lt;/h4&gt;\n&lt;p&gt;Для анализа использовались наборы данных из базы GEO. Транскриптомные данные (bulk RNA-seq) мононуклеаров периферической крови (PBMC) пациентов с PCAD и здоровых лиц взяты из GSE12288. Данные scRNA-seq PBMC получены из GSE231906 и GSE145154, а данные scRNA-seq коронарных атеросклеротических бляшек — из GSE252243 и GSE264666.&lt;/p&gt;\n&lt;h4 id=\"sbor-i-validaciya-klinicheskih-obrazcov\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#sbor-i-validaciya-klinicheskih-obrazcov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сбор и валидация клинических образцов&lt;/span&gt;&lt;/a&gt;Сбор и валидация клинических образцов&lt;/h4&gt;\n&lt;p&gt;Исследование типа «случай-контроль» проводилось на базе Второй дочерней больницы Харбинского медицинского университета в период с 1 января 2025 по 1 января 2026 года (одобрение этического комитета KY-2025394). Для валидации PBMC (мононуклеарных клеток периферической крови) отобрали 5 пациентов с преждевременной ишемической болезнью сердца (PCAD) и 5 здоровых добровольцев (возраст &amp;lt;45 лет). Диагноз PCAD подтверждался ангиографически (стеноз &amp;gt;70% в одной из крупных эпикардиальных артерий), в группе контроля стеноз отсутствовал. Уровни мРНК KRAS, SYK и TAB2 измеряли методом &lt;a href=\"concepts/qpcr.html\"&gt;qPCR&lt;/a&gt;. Для анализа бляшек использовали образцы сонных артерий от 5 пациентов с тяжелым симптоматическим стенозом, перенесших каротидную эндартерэктомию. Диагноз подтверждался DSA при наличии транзиторной ишемической атаки или инсульта в анамнезе (стеноз ≥50%) либо при стенозе 50–69% с признаками нестабильности бляшки. Учитывались факторы: возраст, пол, курение, гипертензия, диабет и липидный профиль.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Валидация проведена на 10 образцах PBMC и 5 образцах каротидных бляшек с учетом клинических факторов риска.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"differencialnaya-ekspressiya-i-wgcna\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#differencialnaya-ekspressiya-i-wgcna\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дифференциальная экспрессия и WGCNA&lt;/span&gt;&lt;/a&gt;Дифференциальная экспрессия и WGCNA&lt;/h4&gt;\n&lt;p&gt;Транскриптомные данные нормализовали и анализировали с помощью пакета limma (v3.62.2) в R (v4.4.3). Значимыми считались гены с p &amp;lt; 0.05 и абсолютным изменением экспрессии (fold change) &amp;gt; 1.5. Сетевой анализ WGCNA (v1.74) проводился при степени мягкого порога 12 для достижения безмасштабной топологии. Модули выделялись методом динамической обрезки дерева (минимальный размер 80). Ключевые гены модулей сопоставлялись с данными об ИБС и генами старения из базы Aging Atlas.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;WGCNA — метод поиска групп (модулей) коэкспрессирующихся генов, которые работают как единая функциональная сеть.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"obrabotka-dannyh-scrna-seq\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#obrabotka-dannyh-scrna-seq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обработка данных scRNA-seq&lt;/span&gt;&lt;/a&gt;Обработка данных scRNA-seq&lt;/h4&gt;\n&lt;p&gt;Данные scRNA-seq обрабатывались в Seurat (v5.5.0). Отфильтровывались клетки с &amp;lt; 200 генами и &amp;gt; 10% митохондриальных прочтений. Нормализация проводилась через SCTransform. &lt;a href=\"concepts/pca.html\"&gt;PCA&lt;/a&gt; выполнялся по 2000 вариабельным генам, для кластеризации (разрешение 0.6) использовали первые 20 главных компонент. Типы клеток идентифицировали по маркерам: T-клетки (CD3D, CD3E), NK-клетки (KLRD1, GNLY), B-клетки (MS4A1, CD79B), моноциты (CD14, LYZ), дендритные клетки (CDKN1C, LILRB2), макрофаги (CD68, C1QA), гладкомышечные клетки (ACTA2, MYH11), фибробласты (COL6A1, FN1) и эндотелиоциты (PECAM1, EGFL7).&lt;/p&gt;\n&lt;h4 id=\"mezhkletochnaya-kommunikaciya-i-analiz-putej\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#mezhkletochnaya-kommunikaciya-i-analiz-putej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Межклеточная коммуникация и анализ путей&lt;/span&gt;&lt;/a&gt;Межклеточная коммуникация и анализ путей&lt;/h4&gt;\n&lt;p&gt;Взаимодействия анализировали через CellChat (v2.1.1). Функциональные пути оценивали методом GSVA (v2.0.7) с использованием наборов генов MSigDB. Для T-клеток дифференциальную экспрессию между группами MI и Healthy определяли функцией FindMarkers (log-fold change &amp;gt; 0.5, p.adj &amp;lt; 0.05) с последующим анализом GO и KEGG через clusterProfiler (v4.14.6).&lt;/p&gt;\n&lt;h4 id=\"analiz-subpopulyacij-t-kletok-i-funkcionalnoe-profilirovanie\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#analiz-subpopulyacij-t-kletok-i-funkcionalnoe-profilirovanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ субпопуляций T-клеток и функциональное профилирование&lt;/span&gt;&lt;/a&gt;Анализ субпопуляций T-клеток и функциональное профилирование&lt;/h4&gt;\n&lt;p&gt;T-клетки перекластеризовали для выделения субпопуляций: наивные CD4+ (CD4, CCR7, SELL), CD4+ памяти (CD4, CXCR4, RORA), регуляторные CD4+ (CD4, FOXP3, IL2RA), наивные CD8+ (CD8A, CCR7, SELL) и эффекторные CD8+ (CD8A, GZMK, GZMB). Состояния (цитотоксичность, истощение, старение) оценивали пакетом TCellSI (v1.2.0).&lt;/p&gt;\n&lt;h4 id=\"virtualnyj-nokaut-genov\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#virtualnyj-nokaut-genov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Виртуальный нокаут генов&lt;/span&gt;&lt;/a&gt;Виртуальный нокаут генов&lt;/h4&gt;\n&lt;p&gt;Пакет scTenifoldKnk (v1.0.3) применялся для моделирования «нокаута» KRAS в T-клетках. Алгоритм строит регуляторную сеть, удаляет целевой ген и сравнивает изменения в сети. Топ-20 наиболее затронутых генов анализировались на обогащение путями GO и KEGG.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Виртуальный нокаут (in silico) — компьютерное моделирование последствий удаления гена без реального генетического вмешательства.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"prognozirovanie-lekarstvennyh-preparatov-na-osnove-glubokogo-obucheniya-i-molekulyarnyj-doking\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#prognozirovanie-lekarstvennyh-preparatov-na-osnove-glubokogo-obucheniya-i-molekulyarnyj-doking\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Прогнозирование лекарственных препаратов на основе глубокого обучения и молекулярный докинг&lt;/span&gt;&lt;/a&gt;Прогнозирование лекарственных препаратов на основе глубокого обучения и молекулярный докинг&lt;/h4&gt;\n&lt;p&gt;Модель глубокого обучения DrugReflector была обучена на базе данных Connectivity Map (CMap). В качестве входного сигнала для определения патологии использовали список генов с повышенной экспрессией (DEGs), выявленных при сравнении Т-клеток пациентов с инфарктом миокарда (MI) и здоровых доноров. Модель ранжировала соединения по их способности нивелировать патологический профиль экспрессии. Лидером рейтинга стало соединение BRD-K78432605, которое было отобрано для молекулярного докинга. Для этого использовали кристаллическую структуру неактивного белка KRAS, связанного с ВВП (PDB: 4EPR, разрешение 2,00 Å). Докинг проводили в программе AutoDock Vina (версия 4.2.6), область поиска (grid box) центрировали на интерфейсе связывания SOS. Визуализацию результатов выполнили в PyMOL (версия 2.6.0).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель DrugReflector определила BRD-K78432605 как наиболее перспективное соединение для коррекции профиля экспрессии генов при инфаркте миокарда.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kolichestvennaya-pcr-v-realnom-vremeni\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#kolichestvennaya-pcr-v-realnom-vremeni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Количественная ПЦР в реальном времени&lt;/span&gt;&lt;/a&gt;Количественная ПЦР в реальном времени&lt;/h4&gt;\n&lt;p&gt;Образцы тканей измельчали до состояния порошка, после чего добавляли реагент TRIzol (Invitrogen, США). Клеточные образцы обрабатывали TRIzol после удаления супернатанта. Экстракцию РНК проводили путем добавления хлороформа (350 мкл на 1 мл TRIzol) с последующим центрифугированием (15 мин, 12 000 об/мин, комнатная температура). Супернатант смешивали с 500 мкл изопропанола, выдерживали 10 минут и центрифугировали (10 мин, 12 000 об/мин, 4 °C). Осадок промывали 1 мл 75% этанола (центрифугирование 5 мин, 4 °C). После высыхания осадок растворяли в воде, свободной от нуклеаз, и измеряли концентрацию РНК (хранение при −80 °C). Синтез кДНК осуществляли с помощью набора Toyobo, а &lt;a href=\"concepts/ptsr.html\"&gt;ПЦР&lt;/a&gt; — с использованием 2X M5 HiPer SYBR Premix EsTaq plus. Относительную экспрессию рассчитывали методом 2⁻ΔΔ Ct с нормализацией по гену GAPDH. Использовались праймеры для генов TAB2, SYK, KRAS и GAPDH.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод 2⁻ΔΔ Ct позволяет оценить относительное изменение уровня экспрессии гена, сравнивая его с контрольным «домашним» геном (GAPDH) в разных условиях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"immunofluorescentnoe-okrashivanie-ateroskleroticheskih-blyashek\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#immunofluorescentnoe-okrashivanie-ateroskleroticheskih-blyashek\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Иммунофлуоресцентное окрашивание атеросклеротических бляшек&lt;/span&gt;&lt;/a&gt;Иммунофлуоресцентное окрашивание атеросклеротических бляшек&lt;/h4&gt;\n&lt;p&gt;Срезы человеческих каротидных бляшек (толщина 4 мкм) депарафинировали и подвергали демаскировке антигенов в цитратном буфере (pH 6,0) при нагревании в микроволновой печи. После блокировки 5% бычьим сывороточным альбумином срезы инкубировали с первичными антителами (анти-CD8a + анти-KRAS или анти-KRAS + анти-p16-INK4A) в течение ночи при 4 °C. Затем использовали вторичные антитела, конъюгированные с Alexa Fluor 488 и Alexa Fluor 594 (1:500). Ядра окрашивали &lt;a href=\"concepts/dapi.html\"&gt;DAPI&lt;/a&gt;. Изображения получали на микроскопе Zeiss Axio Observer и анализировали в ImageJ. Для каждой пары антител подсчитывали количество двойных позитивных клеток в пяти случайных полях зрения (×200).&lt;/p&gt;\n&lt;h4 id=\"statisticheskij-analiz\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#statisticheskij-analiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистический анализ&lt;/span&gt;&lt;/a&gt;Статистический анализ&lt;/h4&gt;\n&lt;p&gt;Анализ проводили в R (версия 4.4.3). Сравнение клинических групп (PCAD против контроля) выполняли с помощью t-критерия Стьюдента с поправкой на возраст, пол, курение, гипертензию, диабет и липидный профиль через многофакторную линейную регрессию. Для сравнения нескольких групп применяли однофакторный дисперсионный анализ (ANOVA) с пост-хок тестом Тьюки. Порог значимости p &amp;lt; 0,05. Для иммунофлуоресценции формальное статистическое тестирование не проводилось, так как это был дескриптивный этап валидации.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"identifikaciya-klyuchevyh-genov-stareniya-v-mononuklearah-perifericheskoj-krovi-pbmc-pri-prezhdevremennoj-ishemicheskoj-bolezni-serdca-pcad\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#identifikaciya-klyuchevyh-genov-stareniya-v-mononuklearah-perifericheskoj-krovi-pbmc-pri-prezhdevremennoj-ishemicheskoj-bolezni-serdca-pcad\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Идентификация ключевых генов старения в мононуклеарах периферической крови (PBMC) при преждевременной ишемической болезни сердца (PCAD)&lt;/span&gt;&lt;/a&gt;Идентификация ключевых генов старения в мононуклеарах периферической крови (PBMC) при преждевременной ишемической болезни сердца (PCAD)&lt;/h4&gt;\n&lt;p&gt;Авторы проанализировали транскриптомные данные PBMC из базы GSE12288, включающие 12 пациентов с ишемической болезнью сердца (CAD) в возрасте до 45 лет и 21 здорового донора. Используя пакет limma при порогах p &amp;lt; 0.05 и /fold change/ &amp;gt; 1.5, было выявлено 2289 дифференциально экспрессирующихся генов (&lt;a href=\"concepts/gene-expression.html\"&gt;DEG&lt;/a&gt;), из которых 1175 были гиперэкспрессированы, а 1114 — подавлены (Рис. 2A). Метод взвешенного анализа сетей коэкспрессии генов (WGCNA) выделил 23 модуля, среди которых пурпурный модуль показал наиболее сильную связь с PCAD (Рис. 2B). Пересечение 315 ключевых генов этого модуля с 2289 DEG и 503 генами, связанными со старением (база Aging Atlas), позволило выделить три регуляторных гена: TAB2, SYK и KRAS (Рис. 2C). Уровни их экспрессии в группе PCAD оказались выше, чем в контроле (Рис. 2D), что было подтверждено методом количественной ПЦР (Рис. 2E).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell-f2.jpg\" alt=\"Рисунок 2. Идентификация хабовых генов, связанных со старением, в мононуклеарах периферической крови (PBMC) пациентов с \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2. Идентификация хабовых генов, связанных со старением, в мононуклеарах периферической крови (PBMC) пациентов с преждевременной ишемической болезнью сердца (ИБС).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 2. Идентификация хабовых генов, связанных со старением, в мононуклеарах периферической крови (PBMC) пациентов с преждевременной ишемической болезнью сердца (ИБС). (A) Вулканический график дифференциально экспрессирующихся генов (DEG) между пациентами с ИБС и здоровыми контрольными лицами. (B) Тепловая карта ассоциаций модулей и признаков, полученная в результате взвешенного анализа сетей коэкспрессии генов (WGCNA); фиолетовый модуль показывает наиболее сильную корреляцию с ИБС. (C) Диаграмма Венна, иллюстрирующая пересечение 315 ключевых генов из фиолетового модуля, 2289 DEG и 503 генов, связанных со старением, из базы данных Aging Atlas, что позволило выявить три общих хабовых гена: TAB2, SYK и KRAS. (D) Скрипичные диаграммы, отображающие уровни экспрессии TAB2, SYK и KRAS в PBMC группы ИБС по сравнению с контрольной группой. (E) qPCR-валидация различий в экспрессии трех хабовых генов. Данные представлены как среднее ± стандартное отклонение; *p &amp;lt; 0,05, **p &amp;lt; 0,01, ***p &amp;lt; 0,001.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Гены TAB2, SYK и KRAS были идентифицированы как ключевые регуляторы, демонстрирующие повышенную экспрессию в PBMC пациентов с PCAD.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"giperekspressiya-kras-v-t-limfocitah-perifericheskoj-krovi-tesno-svyazana-s-pcad\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#giperekspressiya-kras-v-t-limfocitah-perifericheskoj-krovi-tesno-svyazana-s-pcad\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гиперэкспрессия KRAS в Т-лимфоцитах периферической крови тесно связана с PCAD&lt;/span&gt;&lt;/a&gt;Гиперэкспрессия KRAS в Т-лимфоцитах периферической крови тесно связана с PCAD&lt;/h4&gt;\n&lt;p&gt;Для уточнения клеточного контекста авторы переанализировали данные scRNA-seq (GSE231906 и GSE145154) от 2 пациентов с ишемической кардиомиопатией (группа MI, возраст &amp;lt;45 лет) и 4 здоровых лиц. Были идентифицированы пять типов клеток: Т-клетки, NK-клетки, В-клетки, моноциты и дендритные клетки. В группе MI наблюдалась повышенная доля Т-клеток и сниженная доля моноцитов (Рис. 3A, B). Анализ показал, что TAB2 и KRAS преимущественно экспрессируются в Т-клетках, а SYK — в моноцитах (Рис. 3C). Во всех типах клеток группы MI экспрессия этих генов была выше, чем в группе здоровых (Рис. 3D). Межклеточная коммуникация была глобально ослаблена в группе MI (Рис. 3F), при этом Т-клетки занимали центральное положение (Рис. 3E). Анализ GSVA выявил значительную активацию сигнального пути KRAS и пути p53 в группе MI (Рис. 3H). Дифференциальный анализ Т-клеток показал, что гены, активированные в группе MI, обогащены процессами сплайсинга РНК и апоптоза (Рис. 3I, J).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell-f3.jpg\" alt=\"Рисунок 3. Результаты секвенирования единичных клеток PBMC демонстрируют ключевые гены.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3. Результаты секвенирования единичных клеток PBMC демонстрируют ключевые гены.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 3. Результаты секвенирования единичных клеток PBMC демонстрируют ключевые гены. (A) UMAP-график PBMC и пропорции типов клеток; (B) Пузырьковая диаграмма экспрессии маркерных генов в различных типах клеток; (C) Распределение экспрессии TAB2, SYK и KRAS; (D) Уровни экспрессии TAB2, SYK и KRAS в различных группах и типах клеток (показаны в виде скрипичных диаграмм); (E) Результаты межклеточной коммуникации CellChat (количество и вес); (F) Сравнение результатов межклеточной коммуникации CellChat между различными группами (количество и вес); (G) Уровни активности путей взаимодействия в различных группах; (H) Тепловая карта показателей активности путей GSVA; (I) Пузырьковая диаграмма GO-обогащения для генов с повышенной экспрессией в Т-клетках группы инфаркта миокарда (MI); (J) Пузырьковая диаграмма KEGG-обогащения для генов с повышенной экспрессией в Т-клетках группы MI.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;scRNA-seq (одноклеточное секвенирование РНК) позволяет изучать профили экспрессии генов в каждой отдельной клетке, а не в усредненной массе тканей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдаемые изменения в межклеточных взаимодействиях и экспрессии генов основаны на данных малых выборок пациентов, что требует осторожности при интерпретации причинно-следственных связей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"giperekspressiya-kras-v-effektornyh-cd8-t-kletkah-uskoryaet-immunostarenie\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#giperekspressiya-kras-v-effektornyh-cd8-t-kletkah-uskoryaet-immunostarenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гиперэкспрессия KRAS в эффекторных CD8+ Т-клетках ускоряет иммуностарение&lt;/span&gt;&lt;/a&gt;Гиперэкспрессия KRAS в эффекторных CD8+ Т-клетках ускоряет иммуностарение&lt;/h4&gt;\n&lt;p&gt;При кластеризации Т-клеток были выделены пять подтипов: наивные CD4+, Т-клетки памяти CD4+, регуляторные CD4+, наивные CD8+ и эффекторные CD8+ Т-клетки. В группе MI доля наивных CD4+ Т-клеток была выше, а наивных CD8+ — ниже (Рис. 4A, B). KRAS экспрессировался во всех подтипах, достигая максимума в наивных CD4+ и эффекторных CD8+ Т-клетках (Рис. 4C, D). Алгоритм TCellSI показал, что эффекторные CD8+ Т-клетки имеют самый высокий индекс старения, который дополнительно возрастал в группе MI. Виртуальный нокаут KRAS (scTenifoldKnk) затронул такие гены, как CCR7 и PIK3IP1 (Рис. 4F-H), а анализ обогащения подтвердил связь KRAS с путями цитотоксичности и клеточной гибели (Рис. 4I, J).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell-f4.jpg\" alt=\"Рисунок 4. Функциональный анализ субпопуляций Т-клеток в PBMC.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4. Функциональный анализ субпопуляций Т-клеток в PBMC.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 4. Функциональный анализ субпопуляций Т-клеток в PBMC. (A) UMAP-график субпопуляций Т-клеток и пропорции типов клеток; (B) Пузырьковая диаграмма экспрессии маркерных генов в различных типах клеток; (C) Распределение экспрессии KRAS; (D) Уровень экспрессии KRAS в каждой субпопуляции Т-клеток; (E) Тепловая карта функциональных показателей TCellSI; (F) Круговая диаграмма доли значительно измененных генов после виртуального нокаута scTenifoldKnk; (G) Столбчатая диаграмма 10 наиболее значительно измененных генов; (H) Диаграмма рассеяния значительно измененных генов; (I) Пузырьковая диаграмма GO-обогащения значительно измененных генов; (J) Пузырьковая диаграмма KEGG-обогащения значительно измененных генов.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффекторные CD8+ Т-клетки с высоким уровнем KRAS демонстрируют признаки ускоренного иммуностарения, что функционально связано с их цитотоксической активностью.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"effektornye-cd8-t-kletki-s-vysokoj-ekspressiej-kras-infiltriruyut-ateroskleroticheskie-blyashki-i-proyavlyayut-usilennuyu-effektornuyu-funkciyu\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#effektornye-cd8-t-kletki-s-vysokoj-ekspressiej-kras-infiltriruyut-ateroskleroticheskie-blyashki-i-proyavlyayut-usilennuyu-effektornuyu-funkciyu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эффекторные CD8+ Т-клетки с высокой экспрессией KRAS инфильтрируют атеросклеротические бляшки и проявляют усиленную эффекторную функцию&lt;/span&gt;&lt;/a&gt;Эффекторные CD8+ Т-клетки с высокой экспрессией KRAS инфильтрируют атеросклеротические бляшки и проявляют усиленную эффекторную функцию&lt;/h4&gt;\n&lt;p&gt;Установив, что повышенная экспрессия KRAS в эффекторных CD8+ Т-клетках периферической крови усиливает их цитотоксичность и способствует старению у пациентов с преждевременной ишемической болезнью сердца (PCAD), мы исследовали, наблюдается ли этот процесс непосредственно в атеросклеротических бляшках. Был проведен повторный анализ общедоступных данных scRNA-seq (GSE252243 и GSE264666) образцов коронарных бляшек от пяти пациентов с прогрессирующим атеросклерозом. После снижения размерности и кластеризации были идентифицированы семь типов клеток: макрофаги, Т-клетки, NK-клетки, B-клетки, гладкомышечные клетки, фибробласты и эндотелиальные клетки (Рис. 5A, B). Как и в случае с периферической кровью, Т-клетки показали наибольшую долю и уровень экспрессии KRAS (Рис. 5C, D). При субкластеризации Т-клеток были выделены четыре подтипа: наивные CD4+, Т-клетки памяти CD4+, регуляторные CD4+ и эффекторные CD8+ Т-клетки (Рис. 5E, F). Разделив эффекторные CD8+ Т-клетки на группы с высоким и низким уровнем KRAS (по 75-му перцентилю), мы обнаружили, что группа с высоким KRAS демонстрирует более выраженные признаки цитотоксичности, истощения и старения согласно оценке TCellSI (Рис. 5G). Анализ GO-терминов показал обогащение генов, связанных с иммунным ответом и передачей сигналов через рецепторы клеточной поверхности, что подтверждает более активное состояние этих клеток в микроокружении бляшки (Рис. 5H). Иммунофлуоресцентное окрашивание тканей сонных артерий подтвердило наличие данной субпопуляции (Рис. 5I).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell-f5.jpg\" alt=\"Рисунок 5. Результаты секвенирования единичных клеток бляшек коронарных артерий подтверждают наличие и функцию субпопуля\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5. Результаты секвенирования единичных клеток бляшек коронарных артерий подтверждают наличие и функцию субпопуляции Т-клеток с повышенной экспрессией KRAS.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 5. Результаты секвенирования единичных клеток бляшек коронарных артерий подтверждают наличие и функцию субпопуляции Т-клеток с повышенной экспрессией KRAS. (A) UMAP-график бляшек коронарных артерий и пропорции типов клеток; (B) Пузырьковая диаграмма экспрессии маркерных генов в различных типах клеток внутри бляшек; (C) Распределение экспрессии KRAS; (D) Уровень экспрессии KRAS в различных типах клеток; (E) UMAP-график субпопуляций Т-клеток; (F) Пузырьковая диаграмма экспрессии маркерных генов в каждой субпопуляции Т-клеток внутри бляшек; (G) Сравнение функциональных показателей TCellSI между эффекторными CD8+ Т-клетками с высоким и низким уровнем KRAS; (H) GO-функциональный анализ обогащения дифференциально экспрессирующихся генов в субпопуляции с высоким уровнем KRAS; (I) Изображения иммунофлуоресцентной ко-локализации в бляшках сонной артерии человека.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффекторные CD8+ Т-клетки с высоким уровнем KRAS в бляшках обладают повышенной цитотоксичностью и способствуют локальному воспалению, что потенциально ведет к дестабилизации атеросклеротической бляшки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;scRNA-seq (секвенирование РНК единичных клеток) — метод, позволяющий изучать профиль экспрессии генов каждой отдельной клетки, что дает возможность увидеть редкие типы клеток и их функциональные различия в гетерогенной ткани.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"model-glubokogo-obucheniya-v-sochetanii-s-transkriptomnym-sekvenirovaniem-edinichnyh-kletok-dlya-prognozirovaniya-terapevticheskih-soedinenij\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#model-glubokogo-obucheniya-v-sochetanii-s-transkriptomnym-sekvenirovaniem-edinichnyh-kletok-dlya-prognozirovaniya-terapevticheskih-soedinenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модель глубокого обучения в сочетании с транскриптомным секвенированием единичных клеток для прогнозирования терапевтических соединений&lt;/span&gt;&lt;/a&gt;Модель глубокого обучения в сочетании с транскриптомным секвенированием единичных клеток для прогнозирования терапевтических соединений&lt;/h4&gt;\n&lt;p&gt;Для поиска малых молекул, способных обратить транскриптомные нарушения, вызванные KRAS, мы использовали модель глубокого обучения DrugReflector. Модель, обученная на базе данных CMap (9 597 возмущений в 52 клеточных линиях), ранжирует соединения по их способности возвращать профиль экспрессии генов к здоровому состоянию. В качестве «болезненной сигнатуры» мы использовали дифференциально экспрессируемые гены Т-клеток пациентов с инфарктом миокарда (Рис. 6A–D). Наивысший балл соответствия получил препарат BRD-K78432605, что указывает на его потенциальную способность связываться с KRAS или модулировать его пути (Рис. 6E, F). Для оценки взаимодействия мы провели молекулярный докинг с использованием неактивной закрытой конформации KRAS (PDB: 4EPR, разрешение 2,00 Å). Энергия связывания составила -16,154 ккал/моль (Рис. 6G). Это значение значительно ниже порога активности в -7,0 ккал/моль, что свидетельствует о термодинамически выгодном связывании и способности молекулы стабилизировать неактивное состояние KRAS.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell-f6.jpg\" alt=\"Рисунок 6. Предсказание лекарственных препаратов с помощью модели глубокого обучения DrugReflector и валидация методом м\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 6. Предсказание лекарственных препаратов с помощью модели глубокого обучения DrugReflector и валидация методом молекулярного докинга.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 6. Предсказание лекарственных препаратов с помощью модели глубокого обучения DrugReflector и валидация методом молекулярного докинга. (A–B) Вероятность и логит-оценка (ранжированные) соединений, предсказанных DrugReflector после ввода результатов анализа единичных клеток PBMC; (C–D) Графики распределения вероятности и логит-оценки соединений, предсказанных DrugReflector после ввода результатов анализа единичных клеток PBMC; (E–F) Топ-10 и Топ-20 соединений, отображенных на кривых предсказания вероятности и логит-оценки; (G) Схематическая диаграмма конформации молекулярного докинга BRD-K78432605 и закрытой конформации KRAS (PDB: 4EPR).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Молекулярный докинг — компьютерный метод моделирования, предсказывающий, как молекула лекарства (лиганд) «садится» в активный центр белка-мишени, оценивая прочность этого соединения через энергию связывания.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;h4 id=\"mehanizmy-svyazi-kras-i-prezhdevremennogo-stareniya-immuniteta\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#mehanizmy-svyazi-kras-i-prezhdevremennogo-stareniya-immuniteta\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Механизмы связи KRAS и преждевременного старения иммунитета&lt;/span&gt;&lt;/a&gt;Механизмы связи KRAS и преждевременного старения иммунитета&lt;/h4&gt;\n&lt;p&gt;Интегрируя данные транскриптомного профилирования, секвенирования единичных клеток, виртуального нокаута генов, глубокого обучения и молекулярного докинга, данное исследование выявило повышенную экспрессию протоонкогена KRAS в Т-лимфоцитах периферической крови у пациентов с преждевременной ишемической болезнью сердца (PCAD). Мы установили, что эффекторные CD8+ Т-клетки с высоким уровнем KRAS демонстрируют максимальные показатели старения (senescence scores), которые дополнительно возрастают в группе инфаркта миокарда (MI) по сравнению с контролем. Это указывает на ускоренное иммуностарение: у молодых людей специфические субпопуляции Т-клеток преждевременно приобретают фенотип старения, выделяя факторы &lt;a href=\"concepts/senescence-associated-secretory-phenotype.html\"&gt;SASP&lt;/a&gt; и проявляя повышенную цитотоксичность, что повреждает сосудистую стенку. Общая межклеточная коммуникация в мононуклеарах периферической крови (PBMC) в группе MI была снижена, что отражает потерю координации, характерную для стареющей иммунной системы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Повышение уровня KRAS в Т-клетках является ключевым молекулярным звеном, связывающим преждевременное иммуностарение и развитие атеросклероза у молодых пациентов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SASP (senescence-associated secretory phenotype) — это комплекс факторов (цитокинов, хемокинов, протеаз), которые секретируют стареющие клетки, вызывая воспаление и повреждение окружающих тканей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"klinicheskoe-znachenie-i-diagnosticheskij-potencial\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#klinicheskoe-znachenie-i-diagnosticheskij-potencial\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Клиническое значение и диагностический потенциал&lt;/span&gt;&lt;/a&gt;Клиническое значение и диагностический потенциал&lt;/h4&gt;\n&lt;p&gt;Диагностика PCAD остается сложной задачей, так как существующие шкалы риска, такие как уравнения Pooled Cohort Equations, не адаптированы для лиц моложе 40 лет, а рекомендации по оценке коронарного кальция (CAC) основаны на данных для пациентов старше 45 лет. Несмотря на кажущийся низкий 10-летний риск, пожизненный риск у молодых людей значителен, а прогноз при инфаркте миокарда часто неблагоприятен. В настоящее время специфические биомаркеры для PCAD ограничены: С-реактивный белок и индекс плазменного атеросклероза (AIP) показывают прогностическую ценность, но не внедрены в широкую практику. Наше открытие позволяет рассматривать KRAS и его транскрипционные сигнатуры как перспективные маркеры раннего биологического старения иммунной системы, дополняющие липидный профиль.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование носит наблюдательный характер; необходимы проспективные работы для подтверждения того, что экспрессия KRAS в Т-клетках может улучшить стратификацию риска и персонализацию терапии.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rol-ccr7-v-disfunkcii-t-kletok\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#rol-ccr7-v-disfunkcii-t-kletok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Роль CCR7 в дисфункции Т-клеток&lt;/span&gt;&lt;/a&gt;Роль CCR7 в дисфункции Т-клеток&lt;/h4&gt;\n&lt;p&gt;Виртуальный нокаут KRAS показал, что наиболее значимо меняется экспрессия гена CCR7 — рецептора, направляющего Т-клетки в лимфоидные органы. В норме сигналы CCR7 обеспечивают своевременное прекращение контакта Т-клетки с антигенпрезентирующей клеткой. При аберрантной активации KRAS экспрессия CCR7 подавляется, что приводит к двум последствиям: во-первых, Т-клетки избегают контроля в лимфоидных органах и мигрируют в периферические ткани, включая стенки артерий; во-вторых, из-за отсутствия сигнала «открепления» Т-клетки в бляшке подвергаются избыточной стимуляции рецепторов TCR, приобретая фенотип истощения с высокой экспрессией PD-1 и CTLA-4. Это объясняет парадоксальное сочетание высокой цитотоксичности и признаков истощения/старения в CD8+ Т-клетках, обнаруженных в атеросклеротических бляшках.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Виртуальный нокаут — это метод компьютерного моделирования, позволяющий предсказать последствия «выключения» функции конкретного гена на основе анализа транскриптомных данных без проведения реальных генетических манипуляций.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ogranicheniya-issledovaniya\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#ogranicheniya-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения исследования&lt;/span&gt;&lt;/a&gt;Ограничения исследования&lt;/h4&gt;\n&lt;p&gt;Данная работа имеет ряд ограничений, которые необходимо учитывать. Во-первых, из-за отсутствия полных данных клинического наблюдения в открытых источниках мы не смогли напрямую оценить связь между уровнем экспрессии KRAS в Т-клетках и клиническими исходами, такими как серьезные неблагоприятные сердечно-сосудистые события, что ограничивает прогностическую ценность KRAS как биомаркера. Во-вторых, использованные наборы данных охватывают различные патологические состояния: ишемическую болезнь сердца у пациентов моложе 45 лет, ишемию миокарда (ишемическую кардиомиопатию) и прогрессирующие атеросклеротические бляшки. Хотя все они относятся к спектру преждевременного атеросклероза, их стадии и клинические определения различаются, что может вносить гетерогенность при объединении данных.&lt;/p&gt;\n&lt;p&gt;В-третьих, анализ единичных клеток (scRNA-seq) периферической крови базировался на ограниченной выборке (два образца пациентов и четыре контрольных), что может усиливать влияние индивидуальной вариативности; однако ключевые выводы были подтверждены независимыми данными секвенирования бляшек и иммунофлуоресцентным окрашиванием. В-четвертых, все механистические выводы основаны на вычислительном анализе и повторной обработке существующих данных, без экспериментальной проверки функций KRAS (gain- or &lt;a href=\"concepts/loss-of-function.html\"&gt;loss-of-function&lt;/a&gt;). Вопрос о том, достаточно ли повышения уровня KRAS для формирования цитотоксического, стареющего фенотипа Т-клеток, требует проверки методами лентивирусной сверхэкспрессии или создания моделей с нокаутом гена Kras в Т-клетках.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Основные выводы ограничены вычислительными методами и требуют экспериментального подтверждения роли KRAS в формировании фенотипа Т-клеток.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нокаут (knock-out) — это генетическая технология «выключения» функции конкретного гена для изучения его роли в организме.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование носит преимущественно биоинформатический характер; корреляции, выявленные на малых выборках, требуют дальнейшей валидации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В-пятых, мы не исследовали наличие мутаций в гене KRAS в Т-клетках периферической крови, поэтому будущие работы должны уточнить вклад транскрипционной активации по сравнению с редкими мутациями. Наконец, кандидатное соединение BRD-K78432605, выявленное алгоритмами, требует экспериментальной проверки перед обсуждением его терапевтического потенциала.&lt;/p&gt;\n&lt;h4 id=\"zayavlenie-ob-ispolzovanii-ii\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#zayavlenie-ob-ispolzovanii-ii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заявление об использовании ИИ&lt;/span&gt;&lt;/a&gt;Заявление об использовании ИИ&lt;/h4&gt;\n&lt;p&gt;Авторы использовали инструменты на базе ИИ для анализа данных. Программа scTenifoldKnk (версия 1.0.3) применялась для моделирования «виртуального нокаута» гена: инструмент строит регуляторные сети единичных клеток, удаляет целевой ген и сравнивает измененную сеть с исходной для выявления нарушений. Для подбора лекарств использовалась модель DrugReflector, обученная на базе данных Connectivity Map (CMap), которая ранжирует соединения по их способности корректировать профиль экспрессии генов. Генеративные ИИ-инструменты для написания текста не применялись, за исключением коррекции грамматики.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Поиск причин&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;раннего&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;атеросклероза&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Анализ РНК&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;единичных&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;клеток и&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;докинг&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;KRAS ускоряет&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;старение&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Т-лимфоцитов&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Новая мишень&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;для лечения&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сосудов&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не прошёл рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия препринта&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;bioRxiv&lt;/td&gt;\n&lt;td&gt;bioinformatics&lt;/td&gt;\n&lt;td&gt;все права у авторов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Sun, Z.; Yang, Z.; Wang, X.; Zhang, M.; Gao, R.; Yang, M.; Li, Y.; Liu
