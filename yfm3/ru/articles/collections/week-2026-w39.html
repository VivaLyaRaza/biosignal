            {"data":{"leading":false,"html":"&lt;p&gt;30 статей&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html\"&gt;Как детские стрессы перестраивают мозг и усиливают страх&lt;/a&gt; — Ранний стресс меняет работу нейронов префронтальной коры и миндалины, заставляя подростков избегать угроз сильнее обычного.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun.html\"&gt;Как редкая мутация в гене AKAP11 запускает тревогу и депрессию&lt;/a&gt; — Ученые создали мышиную модель с человеческой мутацией и показали, как генетический сбой нарушает работу нейронов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html\"&gt;Как женский организм защищает мозг от аутизма&lt;/a&gt; — Ученые выяснили, почему аутизм диагностируют реже у девочек: дело в защитной роли половых хромосом и регуляции генов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html\"&gt;Генная терапия остановила развитие редкого синдрома у мышей&lt;/a&gt; — Однократная инъекция вирусного вектора в первые дни жизни предотвратила гибель нейронов и нарушение координации движений при тяжелом заболевании.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html\"&gt;Как мозг путает знакомое с новым: найден клеточный код памяти&lt;/a&gt; — Ученые впервые зафиксировали работу отдельных нейронов человеческого мозга, отвечающих за разделение похожих воспоминаний.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html\"&gt;Как отдельные нейроны мозга реагируют на правила общения&lt;/a&gt; — Ученые впервые заглянули в работу одиночных нейронов человеческого мозга при оценке социальных норм и справедливости.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html\"&gt;Иммунные клетки мозга при болезни Альцгеймера выгорают изнутри&lt;/a&gt; — Защитники мозга расходуют ресурс на борьбу с амилоидом и истощаются по мере развития болезни.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html\"&gt;Скрытые кольцевые молекулы РНК выдают опасное нейродегенеративное заболевание&lt;/a&gt; — Сбой важного белка в мозге запускает сборку аномальных кольцевых РНК, открывая новые пути для ранней диагностики.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html\"&gt;Как наш мозг превращает непонятное искусство в удовольствие&lt;/a&gt; — Ученые проследили путь от простого любопытства до озарения и радости от понимания картин.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html\"&gt;Как CRISPR заставляет мРНК забыть дорогу к метастазам&lt;/a&gt; — Ученые научились направлять молекулярные комплексы по новому адресу, лишая раковые клетки способности к миграции.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html\"&gt;Сбой ключевого белка при деменции запускает аномальные кольцевые РНК&lt;/a&gt; — Ученые выяснили, как дефицит белка TDP-43 создает новый класс скрытых кольцевых РНК в нейронах при болезнях мозга.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html\"&gt;Как сердце управляет кровью через печень после инфаркта&lt;/a&gt; — Ученые обнаружили прямую связь между сердцем и печенью, которая помогает восстанавливать уровень тромбоцитов после инфаркта.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html\"&gt;Умный диспетчер для создания белков ускоряет разработку лекарств&lt;/a&gt; — Искусственный интеллект научился эффективно распределять вычислительные ресурсы при проектировании новых молекул.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html\"&gt;Как вернуть иммунитету силу при терапии рака&lt;/a&gt; — Новый подход помогает Т-клеткам не впадать в спячку при лечении онкологии bispecific антителами.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html\"&gt;Как гормоны влияют на гены аутизма и расстройств развития мозга&lt;/a&gt; — Ученые проверили, как эстрадиол влияет на работу 36 генов, связанных с аутизмом и расстройствами развития мозга.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html\"&gt;Новый быстрый тест на опасную амебу Balamuthia mandrillaris&lt;/a&gt; — Создан первый экспресс-тест на редкую и смертельную амебу, позволяющий быстро поставить диагноз даже в обычных клиниках.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html\"&gt;Ученые впервые экспериментально доказали существование вирусоподобных РНК с генами&lt;/a&gt; — Ученые впервые в лаборатории доказали существование загадочных кольцевых РНК, которые кодируют белки и живут без ДНК.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html\"&gt;Как бета-амилоид запускает клеточную цепную реакцию при болезни Альцгеймера&lt;/a&gt; — Токсичные белки передаются между клетками через везикулы, повреждая соседние нейроны.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html\"&gt;Почему мозг людей с афантазией видит иначе?&lt;/a&gt; — Ученые выяснили, почему некоторые люди всю жизнь живут без внутреннего экрана и не могут представить яблоко.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html\"&gt;Как прерывистый сон запускает вспышки эпилепсии в \"&gt;Мозг дописывает реальность задним числом в первичной зрительной коре&lt;/a&gt; — То, что мы видим в моменте, зависит от событий будущего. Эксперимент с 7Т МРТ показал, как мозг корректирует восприятие.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html\"&gt;Карта развития гиппокампа человека для изучения ранней болезни Альцгеймера&lt;/a&gt; — Ученые составили детальную карту развития гиппокампа, чтобы увидеть, где именно начинаются сбои при болезни Альцгеймера.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html\"&gt;Как мозг выбирает простые объяснения&lt;/a&gt; — Люди интуитивно выбирают простые гипотезы для сложных данных, действуя по принципу бритвы Оккама.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html\"&gt;Как алгоритмы учатся безошибочно предсказывать болезни сердца&lt;/a&gt; — Новый подход к машинному обучению оценивает надежность прогнозов риска сердечно-сосудистых заболеваний с учетом пола пациентов.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"30 статей"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Неделя 2026-09-22 — 2026-09-25","description":"30 статей","vcsPath":"articles/collections/week-2026-w39.md"},"headings":[],"title":"Неделя 2026-09-22 — 2026-09-25"},"router":{"pathname":"articles/collections/week-2026-w39","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
