            {"data":{"leading":true,"data":{"blocks":[{"type":"header-block","title":"bioRxiv — препринты биологии","theme":"dark","width":"m","description":"&lt;p&gt;Все материалы темы: 34&lt;/p&gt;\n","background":{"color":"#2A9D8F"}},{"type":"card-layout-block","animated":false,"title":"bioRxiv&amp;nbsp;&amp;mdash; препринты биологии","colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell-card.jpg"},"content":{"title":"Клетки научили летать стаей с&amp;nbsp;помощью световых алгоритмов","text":"&lt;p&gt;Ученые создали интерфейс «клетка-машина», заставив человеческие лейкоциты двигаться по законам птичьих стай.&lt;/p&gt;\n","links":[{"url":"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta-card.jpg"},"content":{"title":"Почему при болезни Гоше возникают судороги: ответ скрыт в&amp;nbsp;развитии мозга","text":"&lt;p&gt;Ученые вырастили «мини-мозги» из клеток пациентов, чтобы понять, как редкая генетическая болезнь нарушает работу нейронов.&lt;/p&gt;\n","links":[{"url":"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system-card.jpg"},"content":{"title":"Спиральный катетер SpiraMed: новый способ доставки лекарств прямо в&amp;nbsp;мозг","text":"&lt;p&gt;Инженеры разработали гибкий катетер, который позволяет вводить клеточную и генную терапию в мозг через один прокол, избегая лишних травм.&lt;/p&gt;\n","links":[{"url":"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/drought-spec-net-early-tomato-drought-detection-and-potentia-card.jpg"},"content":{"title":"Как нейросеть учится видеть жажду у&amp;nbsp;томатов до&amp;nbsp;появления первых признаков увядания","text":"&lt;p&gt;Новая модель Drought-Spec-Net анализирует спектр света, отраженного от листьев, чтобы предсказать стресс у растений еще до их увядания.&lt;/p&gt;\n","links":[{"url":"2026-10-02/drought-spec-net-early-tomato-drought-detection-and-potentia.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise-card.jpg"},"content":{"title":"Как иммунные клетки провоцируют ожирение печени","text":"&lt;p&gt;Нейтрофилы, которые обычно защищают нас от инфекций, могут становиться виновниками развития стеатогепатита.&lt;/p&gt;\n","links":[{"url":"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell-card.jpg"},"content":{"title":"Почему иммунитет стареет раньше времени: роль белка KRAS в&amp;nbsp;развитии сердечных болезней","text":"&lt;p&gt;Ученые нашли молекулярный механизм, который связывает преждевременное старение иммунных клеток с ранним атеросклерозом.&lt;/p&gt;\n","links":[{"url":"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-card.jpg"},"content":{"title":"Как одна деталь в&amp;nbsp;ДНК-конструкторе ломает производство лекарств для генной терапии","text":"&lt;p&gt;Ученые нашли причину генетического брака в заготовках для вирусных векторов и придумали, как его исправить.&lt;/p&gt;\n","links":[{"url":"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun-card.jpg"},"content":{"title":"Как редкая мутация в&amp;nbsp;гене AKAP11 запускает тревогу и&amp;nbsp;депрессию","text":"&lt;p&gt;Ученые создали мышиную модель с человеческой мутацией и показали, как генетический сбой нарушает работу нейронов.&lt;/p&gt;\n","links":[{"url":"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-card.jpg"},"content":{"title":"Умный диспетчер для создания белков ускоряет разработку лекарств","text":"&lt;p&gt;Искусственный интеллект научился эффективно распределять вычислительные ресурсы при проектировании новых молекул.&lt;/p&gt;\n","links":[{"url":"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-25/combination-of-alk2-and-cholesterol-targeting-agents-exploit-card.jpg"},"content":{"title":"Уязвимость неизлечимой опухоли мозга найдена в&amp;nbsp;обмене холестерина","text":"&lt;p&gt;Ученые обнаружили, что подавление обмена холестерина делает резистентную глиому ствола мозга уязвимой к таргетной терапии.&lt;/p&gt;\n","links":[{"url":"2026-09-25/combination-of-alk2-and-cholesterol-targeting-agents-exploit.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en-card.jpg"},"content":{"title":"Как детские стрессы перестраивают мозг и&amp;nbsp;усиливают страх","text":"&lt;p&gt;Ранний стресс меняет работу нейронов префронтальной коры и миндалины, заставляя подростков избегать угроз сильнее обычного.&lt;/p&gt;\n","links":[{"url":"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-card.jpg"},"content":{"title":"Как женский организм защищает мозг от&amp;nbsp;аутизма","text":"&lt;p&gt;Ученые выяснили, почему аутизм диагностируют реже у девочек: дело в защитной роли половых хромосом и регуляции генов.&lt;/p&gt;\n","links":[{"url":"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte-card.jpg"},"content":{"title":"Как CRISPR заставляет мРНК забыть дорогу к&amp;nbsp;метастазам","text":"&lt;p&gt;Ученые научились направлять молекулярные комплексы по новому адресу, лишая раковые клетки способности к миграции.&lt;/p&gt;\n","links":[{"url":"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-card.jpg"},"content":{"title":"Генная терапия остановила развитие редкого синдрома у&amp;nbsp;мышей","text":"&lt;p&gt;Однократная инъекция вирусного вектора в первые дни жизни предотвратила гибель нейронов и нарушение координации движений при тяжелом заболевании.&lt;/p&gt;\n","links":[{"url":"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-card.jpg"},"content":{"title":"Иммунные клетки мозга при болезни Альцгеймера выгорают изнутри","text":"&lt;p&gt;Защитники мозга расходуют ресурс на борьбу с амилоидом и истощаются по мере развития болезни.&lt;/p&gt;\n","links":[{"url":"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur-card.jpg"},"content":{"title":"Сбой ключевого белка при деменции запускает аномальные кольцевые РНК","text":"&lt;p&gt;Ученые выяснили, как дефицит белка TDP-43 создает новый класс скрытых кольцевых РНК в нейронах при болезнях мозга.&lt;/p&gt;\n","links":[{"url":"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s-card.jpg"},"content":{"title":"Как сердце управляет кровью через печень после инфаркта","text":"&lt;p&gt;Ученые обнаружили прямую связь между сердцем и печенью, которая помогает восстанавливать уровень тромбоцитов после инфаркта.&lt;/p&gt;\n","links":[{"url":"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons-card.jpg"},"content":{"title":"Как вернуть иммунитету силу при терапии рака","text":"&lt;p&gt;Новый подход помогает Т-клеткам не впадать в спячку при лечении онкологии bispecific антителами.&lt;/p&gt;\n","links":[{"url":"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-card.jpg"},"content":{"title":"Как бета-амилоид запускает клеточную цепную реакцию при болезни Альцгеймера","text":"&lt;p&gt;Токсичные белки передаются между клетками через везикулы, повреждая соседние нейроны.&lt;/p&gt;\n","links":[{"url":"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-card.jpg"},"content":{"title":"Почему мозг людей с&amp;nbsp;афантазией видит иначе?","text":"&lt;p&gt;Ученые выяснили, почему некоторые люди всю жизнь живут без внутреннего экрана и не могут представить яблоко.&lt;/p&gt;\n","links":[{"url":"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi-card.jpg"},"content":{"title":"Мозг дописывает реальность задним числом в&amp;nbsp;первичной зрительной коре","text":"&lt;p&gt;То, что мы видим в моменте, зависит от событий будущего. Эксперимент с 7Т МРТ показал, как мозг корректирует восприятие.&lt;/p&gt;\n","links":[{"url":"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/how-occam-s-razor-guides-human-decision-making-card.jpg"},"content":{"title":"Как мозг выбирает простые объяснения","text":"&lt;p&gt;Люди интуитивно выбирают простые гипотезы для сложных данных, действуя по принципу бритвы Оккама.&lt;/p&gt;\n","links":[{"url":"2026-09-23/how-occam-s-razor-guides-human-decision-making.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h-card.jpg"},"content":{"title":"Как мозг путает знакомое с&amp;nbsp;новым: найден клеточный код памяти","text":"&lt;p&gt;Ученые впервые зафиксировали работу отдельных нейронов человеческого мозга, отвечающих за разделение похожих воспоминаний.&lt;/p&gt;\n","links":[{"url":"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l-card.jpg"},"content":{"title":"Как отдельные нейроны мозга реагируют на&amp;nbsp;правила общения","text":"&lt;p&gt;Ученые впервые заглянули в работу одиночных нейронов человеческого мозга при оценке социальных норм и справедливости.&lt;/p&gt;\n","links":[{"url":"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd-card.jpg"},"content":{"title":"Скрытые кольцевые молекулы РНК выдают опасное нейродегенеративное заболевание","text":"&lt;p&gt;Сбой важного белка в мозге запускает сборку аномальных кольцевых РНК, открывая новые пути для ранней диагностики.&lt;/p&gt;\n","links":[{"url":"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-card.jpg"},"content":{"title":"Как наш мозг превращает непонятное искусство в&amp;nbsp;удовольствие","text":"&lt;p&gt;Ученые проследили путь от простого любопытства до озарения и радости от понимания картин.&lt;/p&gt;\n","links":[{"url":"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-card.jpg"},"content":{"title":"Как гормоны влияют на&amp;nbsp;гены аутизма и&amp;nbsp;расстройств развития мозга","text":"&lt;p&gt;Ученые проверили, как эстрадиол влияет на работу 36 генов, связанных с аутизмом и расстройствами развития мозга.&lt;/p&gt;\n","links":[{"url":"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio-card.jpg"},"content":{"title":"Новый быстрый тест на&amp;nbsp;опасную амебу Balamuthia mandrillaris","text":"&lt;p&gt;Создан первый экспресс-тест на редкую и смертельную амебу, позволяющий быстро поставить диагноз даже в обычных клиниках.&lt;/p&gt;\n","links":[{"url":"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-card.jpg"},"content":{"title":"Ученые впервые экспериментально доказали существование вирусоподобных РНК с&amp;nbsp;генами","text":"&lt;p&gt;Ученые впервые в лаборатории доказали существование загадочных кольцевых РНК, которые кодируют белки и живут без ДНК.&lt;/p&gt;\n","links":[{"url":"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-card.jpg"},"content":{"title":"Как прерывистый сон запускает вспышки эпилепсии в&amp;nbsp;мозге","text":"&lt;p&gt;Ученые выяснили, почему микропробуждения во время сна провоцируют патологическую активность нейронов без расширения сети приступов.&lt;/p&gt;\n","links":[{"url":"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/plscr1-inhibits-murine-norovirus-entry-card.jpg"},"content":{"title":"Белок Plscr1 останавливает проникновение мышиного норовируса","text":"&lt;p&gt;Норовирус ищет лазейку, чтобы заразить клетку, но наш организм выставляет на пути неожиданный барьер.&lt;/p&gt;\n","links":[{"url":"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-card.jpg"},"content":{"title":"Как крысы избегают черных лебедей и&amp;nbsp;ищут джекпоты","text":"&lt;p&gt;Редкие и катастрофические события управляют выбором животных сильнее, чем рутина.&lt;/p&gt;\n","links":[{"url":"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in-card.jpg"},"content":{"title":"Грипп оставляет след в&amp;nbsp;мозге: как мутация LRRK2 запускает белковые сдвиги","text":"&lt;p&gt;Перенесенный грипп запускает в мозге носителей мутации LRRK2 изменения, похожие на ранние этапы нейродегенерации.&lt;/p&gt;\n","links":[{"url":"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-card.jpg"},"content":{"title":"Карта развития гиппокампа человека для изучения ранней болезни Альцгеймера","text":"&lt;p&gt;Ученые составили детальную карту развития гиппокампа, чтобы увидеть, где именно начинаются сбои при болезни Альцгеймера.&lt;/p&gt;\n","links":[{"url":"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html","text":"Читать","arrow":true,"theme":"normal"}]}}]}],"links":[]},"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"bioRxiv — препринты биологии","vcsPath":"rubrics/biorxiv.yaml"},"title":"bioRxiv — препринты биологии"},"router":{"pathname":"rubrics/biorxiv","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
