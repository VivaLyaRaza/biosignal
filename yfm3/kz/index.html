:[{"text":"Оқу","url":"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html","theme":"action"}]},{"type":"card-layout-block","animated":false,"title":{"text":"Жаңа шығарылым &amp;middot; 03.10.2026","url":"2026-10-03/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca-card.jpg"},"content":{"title":"Жасанды интеллект және көмір: электр станцияларының жабылуын кейінге қалдыру өлім-жітімді арттырады","text":"&lt;p&gt;Деректер орталықтары үшін электр энергиясына сұраныстың артуы көмір станцияларының өмірін ұзартып, адамдардың денсаулығына қауіп төндіруде.&lt;/p&gt;\n","links":[{"url":"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell-card.jpg"},"content":{"title":"Жасушалар құстар сияқты топтасып қозғалуға үйретілді","text":"&lt;p&gt;Ғалымдар «жасуша-машина» интерфейсі арқылы лейкоциттерді құстар үйірінің заңдылығымен жүруге бағыттады.&lt;/p&gt;\n","links":[{"url":"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a-card.jpg"},"content":{"title":"Диабет және АЖБ: зейін тапшылығы жүрек аурулары қаупіне қалай әсер етеді","text":"&lt;p&gt;Жеті елде жүргізілген ауқымды зерттеу 2-типті диабетпен ауыратын науқастарда АЖБ денсаулық болжамын қалай өзгертетінін көрсетті.&lt;/p&gt;\n","links":[{"url":"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-card.jpg"},"content":{"title":"Ақуыз құрылымын жүздеген есе аз&amp;nbsp;деректермен қалай көруге болады","text":"&lt;p&gt;Fold'EM алгоритмі ақуыз модельдерін жеке суреттер арқылы қалпына келтіруге мүмкіндік береді, бұл күрделі 3D карталарды қажет етпейді.&lt;/p&gt;\n","links":[{"url":"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may-card.jpg"},"content":{"title":"Теңіз балдырлары көміртекті мұхит түбінде мыңдаған жылдар бойы сақтайды","text":"&lt;p&gt;Ламинария балдырлары көміртекті мұхит түбіне жеткізу арқылы климаттың өзгеруімен күресуге көмектесетіні анықталды.&lt;/p&gt;\n","links":[{"url":"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-card.jpg"},"content":{"title":"Жасанды интеллект кенеттен болатын жүрек өлімін болжай ала ма","text":"&lt;p&gt;Ғалымдар Холтер мониторингі мен пациенттердің клиникалық тарихын біріктіріп, жүрек қаупін дәлірек бағалау әдісін тапты.&lt;/p&gt;\n","links":[{"url":"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html","text":"Оқу","arrow":true,"theme":"normal"}]}}]},{"type":"card-layout-block","animated":false,"title":{"text":"Шығарылым &amp;middot; 02.10.2026","url":"2026-10-02/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-10-02/optical-microscopy-predictions-of-focal-recurrence-in-gliobl-card.jpg"},"content":{"title":"Оптикалық микроскопия мен жасанды интеллект глиобластоманың қайталануын болжайды","text":"&lt;p&gt;Жаңа алгоритм ота кезінде алынған тіндерді талдап, ісіктің қайта өсу қаупі жоғары аймақтарын дәл көрсетеді.&lt;/p&gt;\n","links":[{"url":"2026-10-02/optical-microscopy-predictions-of-focal-recurrence-in-gliobl.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari-card.jpg"},"content":{"title":"АКТВ, туберкулез бен малярияны бірге анықтайтын CRISPR-тест жасалды","text":"&lt;p&gt;Ғалымдар АКТВ, туберкулез, малярия және антибиотикке төзімділікті бір мезетте анықтайтын тестілеу жүйесін ұсынды.&lt;/p&gt;\n","links":[{"url":"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta-card.jpg"},"content":{"title":"Гоше ауруы кезінде ми&amp;nbsp;неге құрысуға бейім болады","text":"&lt;p&gt;Ғалымдар науқастардың жасушаларынан «мини-ми» өсіріп, сирек генетикалық аурудың нейрондарға әсерін анықтады.&lt;/p&gt;\n","links":[{"url":"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/eggerthella-lenta-disrupts-the-gut-vascular-barrier-to-drive-card.jpg"},"content":{"title":"Ішектегі бактерия тоқ ішек қатерлі ісігінің бауырға метастаз беруіне ықпал етеді","text":"&lt;p&gt;Микробтар ішектің қан тамырлар тосқауылын бұзып, ісік жасушаларының қанға өтуіне жол ашады.&lt;/p&gt;\n","links":[{"url":"2026-10-02/eggerthella-lenta-disrupts-the-gut-vascular-barrier-to-drive.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system-card.jpg"},"content":{"title":"SpiraMed: миға дәрі-дәрмекті жеткізудің жаңа спиральді әдісі","text":"&lt;p&gt;Инженерлер миға жасушалық және гендік терапияны бір тесік арқылы енгізуге мүмкіндік беретін иілгіш катетер ойлап тапты.&lt;/p&gt;\n","links":[{"url":"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory-card.jpg"},"content":{"title":"Иммунитеттің жасырын қаруы: реттеуші Т-жасушалар қатерлі ісікпен қалай күреседі","text":"&lt;p&gt;Әдетте олар иммундық жауапты тежейді, бірақ дәрі-дәрмек әсерінен бұл жасушалар ісікті жоятын белсенді жауынгерге айналады.&lt;/p&gt;\n","links":[{"url":"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus-card.jpg"},"content":{"title":"Жүректегі ортақ артериялық дің: қан ағымы қалай жүреді?","text":"&lt;p&gt;Ғалымдар жүректің сирек кездесетін ақауының цифрлық моделін жасап, қанның араласуы мен клапандардың жұмысын талдады.&lt;/p&gt;\n","links":[{"url":"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data-card.jpg"},"content":{"title":"Нейрожелілер биологиялық деректер базасындағы хаосты реттей ала ма","text":"&lt;p&gt;Миллиондаған зертханалық тәжірибелер дұрыс сипатталмаған. Зерттеушілер жасанды интеллект бұл мәселені шеше алатынын тексерді.&lt;/p&gt;\n","links":[{"url":"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/drought-spec-net-early-tomato-drought-detection-and-potentia-card.jpg"},"content":{"title":"Нейрожелі қызанақтың су&amp;nbsp;тапшылығын солып қалмай тұрып қалай анықтайды","text":"&lt;p&gt;Жаңа Drought-Spec-Net моделі жапырақтан шағылысқан жарық спектрін талдап, өсімдік солып қалғанға дейін стрессті анықтайды.&lt;/p&gt;\n","links":[{"url":"2026-10-02/drought-spec-net-early-tomato-drought-detection-and-potentia.html","text":"Оқу","arrow":true,"theme":"normal"}]}}]},{"type":"card-layout-block","animated":false,"title":{"text":"Шығарылым &amp;middot; 01.10.2026","url":"2026-10-01/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-10-01/single-cell-atlas-of-transcriptomic-vulnerability-across-bra-card.jpg"},"content":{"title":"Ми&amp;nbsp;миының осалдық картасы: аурулар жасушаларды қалай өзгертеді","text":"&lt;p&gt;Ғалымдар Альцгеймер, Паркинсон және шизофрения ауруларының жасушалық деңгейдегі ортақ белгілерін түсіну үшін мидың ауқымды атласын жасады.&lt;/p&gt;\n","links":[{"url":"2026-10-01/single-cell-atlas-of-transcriptomic-vulnerability-across-bra.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise-card.jpg"},"content":{"title":"Иммундық жасушалар бауырдың майлануын қалай қоздырады","text":"&lt;p&gt;Әдетте инфекциялардан қорғайтын нейтрофилдер стеатогепатиттің дамуына себепкер болуы мүмкін.&lt;/p&gt;\n","links":[{"url":"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut-card.jpg"},"content":{"title":"Мидың жеке естеліктерді қалай бейнелейтіні анықталды","text":"&lt;p&gt;Нейрожелілер арқылы дефолт-жүйенің медиальды самай бөлігі естеліктердің визуалды бейнесін сақтайтыны дәлелденді.&lt;/p&gt;\n","links":[{"url":"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/a-serum-thyroid-hormone-metabolite-test-for-molecular-diagno-card.jpg"},"content":{"title":"Қалқанша без обырын анықтаудың жаңа әдісі: қан анализі","text":"&lt;p&gt;Ғалымдар қалқанша без түйіндерін биопсиясыз тексеруге мүмкіндік беретін гормон метаболиттеріне негізделген тест әзірледі ындамасындағы генетикалық ақаудың себебін тауып, оны түзетудің жолын ойлап тапты.&lt;/p&gt;\n","links":[{"url":"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont-card.jpg"},"content":{"title":"Қызыл иек ауруы мен артрит: ортақ генетикалық код","text":"&lt;p&gt;Ғалымдар пародонтит пен жүйелі ювенильді артритті байланыстыратын ортақ гендерді анықтады.&lt;/p&gt;\n","links":[{"url":"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html","text":"Оқу","arrow":true,"theme":"normal"}]}}]},{"type":"extended-features-block","animated":false,"title":"БиоСигнал қалай жұмыс істейді","items":[{"title":"Іріктеу","text":"&lt;p&gt;Күн сайын модель ондаған жаңа зерттеуді салыстырып, ең маңызды әрі түсініктілерін таңдайды.&lt;/p&gt;\n"},{"title":"Талдау","text":"&lt;p&gt;Мәні, негізгі қорытындылар мен шектеулер — қарапайым, бірақ дәл тілмен.&lt;/p&gt;\n"},{"title":"Үш тіл","text":"&lt;p&gt;Әр материал орыс, өзбек және қазақ тілдерінде шығады.&lt;/p&gt;\n"},{"title":"Суреттер және толық мәтін","text":"&lt;p&gt;Мақалалардың өз суреттері, ал ашық лицензиялар үшін — толық аударма.&lt;/p&gt;\n"}]},{"type":"questions-block","animated":false,"title":"Сұрақтар","items":[{"title":"&lt;p&gt;Бұл рецензияланған мақалалар ма?&lt;/p&gt;\n","text":"&lt;p&gt;Жоқ, бұл препринттер — рецензияға дейінгі жаңа жұмыстар. Әр материалда зерттеу шектеулері көрсетілген.&lt;/p&gt;\n"},{"title":"&lt;p&gt;Материалдар қаншалықты жиі шығады?&lt;/p&gt;\n","text":"&lt;p&gt;Күніне үш рет: таңертең, күндіз және кешке.&lt;/p&gt;\n"},{"title":"&lt;p&gt;Мәтіндерді пайдалануға бола ма?&lt;/p&gt;\n","text":"&lt;p&gt;Иә, БиоСигнал мен түпнұсқа мақалаға сілтеме жасап (DOI әр материалда көрсетілген).&lt;/p&gt;\n"}]}],"links":[]},"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"}],"style":["_ass
