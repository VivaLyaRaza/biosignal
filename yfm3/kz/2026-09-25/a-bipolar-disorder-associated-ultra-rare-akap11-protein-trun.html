сатылы алгоритм бойынша орындалды: 1. Нормализация. Ген экспрессиясы scuttle пакетінің (1.12.0 нұсқасы) normalizeCounts функциясы арқылы қалыпқа келтірілді. 2. Белгілерді таңдау. Митохондриальды және рибосомальды гендер алынып тасталды. Жоғары вариабельді гендер LOESS регрессиясы арқылы stats пакеті (4.3.0 нұсқасы) көмегімен анықталды. 3. Өлшемді төмендету. Негізгі компоненттер талдауы (&lt;a href=\"concepts/pca.html\"&gt;PCA&lt;/a&gt;) scater пакеті (1.28.0 нұсқасы) арқылы 50 компонент бойынша орындалды (нейрондар үшін 40 PCA). UMAP есептелді (scater, n_neighbors = 20). 4. SNN графтарын құру. SNN графтары scran пакеті (1.28.2 нұсқасы) көмегімен 20 жақын көрші негізінде құрылды. 5. Кластерлеу. SNN графы &lt;a href=\"concepts/leiden-algorithm.html\"&gt;Leiden алгоритмі&lt;/a&gt; арқылы бөлінді (igraph, 1.5.0.1 нұсқасы; objective_function=“CPM”, n_iterations=5). Кластерлердің тұрақтылығы Adjusted Rand Index көмегімен бағаланды. 6. Жасуша түрін тағайындау. Кластерлер [30] ұсынған тышқан қыртысының таксономиясына сәйкес әдебиеттер мен Allen институтының базасы негізінде аннотацияланды. CGE (Lamp5, Sncg, Vip) және MGE (Pvalb, Sst, Sst Chodl) интернейрондары бөлінді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;snRNA-seq деректерін кластерлеу Leiden алгоритмі арқылы және негізгі нейрондық пен глиальдық популяцияларды дәл анықтай отырып жүзеге асырылды.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кластерлеу және субкластерлеу жұмыстары панейрондарды, олигодендроциттерді, OPC, эндотелиальды жасушаларды, VSMC, астроциттерді, микроглияны, перициттерді және менингеальды жасушаларды қамтиды. Нейрондар глутаматергиялық (13 тип) және гамкергиялық (10 тип) болып бөлінді. Глутаматергиялық жасушалар үшін орташа deScore мәні 4.83 (мин: 3.78, макс: 7.29) болды, ал жарамды жасушалардың үлесі орташа 98.65% (мин: 90.15%, макс: 100%) құрады. Нейрондық емес жасушалар үшін оптималды шешімдер платоға жеткен сәтте таңдалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Leiden алгоритмі — графтарды тығыз қауымдастықтарға бөлу үшін қолданылатын математикалық әдіс, ол жасушалардың өзара байланысын қамтамасыз етеді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Генотиптер арасындағы жасуша түрлерінің құрамын дифференциалды экспрессия (DE) талдауы speckle пакеті (1.0.0 нұсқасы; robust=TRUE, transform=“logit”) арқылы орындалды. Pseudobulk DE талдауы scater::aggregateAcrossCells арқылы жүзеге асырылды. Төмен деңгейде экспрессияланған гендер edgeR::filterByExpr көмегімен сүзілді. Нормализация факторлары RLE әдісімен (edgeR::calcNormFactors) есептелді. Ген экспрессиясы edgeR пакеті (glmQLFit және glmQLFTest) арқылы теріс биномиалды модельдер көмегімен бағаланды. Баламалы талдаулар DESeq2 (1.40.2 нұсқасы) және limma (3.58.1 нұсқасы) көмегімен орындалды. Жеке жасушалардағы UMI мәндері бойынша GLMM талдауы nebula пакеті (1.5.5 нұсқасы; модель PMM, cpc=0.005, mincp=20) арқылы жүргізілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Барлық биоинформатикалық талдау кезеңдері сапасыз ядроларды қатаң сүзуді және көптік тестілеу (FDR) арқылы жалған оң нәтижелерді қатаң бақылауды талап етеді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тышқан гендерінің Gene Ontology (GO) аннотация базалары 2025 жылғы 10 қыркүйектегі жағдай бойынша clusterProfiler (4.10.1 нұсқасы) көмегімен org.Mm.eg.db (3.18.0 нұсқасы) пакетінен алынды. GO суб-онтологияларының үш класы қолданылды: биологиялық үрдіс (GO:BP), жасушалық компонент (GO:CC) және молекулярлық функция (GO:MF). Тышқанның Reactome жолдары базасы ReactomePA (1.46.0 нұсқасы) пакеті арқылы 2025 жылғы 10 қыркүйекте жүктелді. Сарапшылар таңдаған синаптикалық гендер базасы SynGO (20231201 нұсқасы) SynGO порталынан алынды. Психикалық бұзылыстармен байланысты ген жиынтықтары жарияланған зерттеулерден жиналды. GWAS тәуекелді гендері үшін генге негізделген ассоциациялық талдаулар арқылы таңдалған жиынтықтар қолданылды. 3G қосымша кестесінде мәліметтер көзі, басымдық беру әдісі және P-мәні шектері сияқты өңдеу процедуралары жинақталған. Сондай-ақ DisGeNET-тен (2026 жылғы жаңарту) Medical Subject Headings (MeSH) F03 «Психикалық бұзылыстар» категориясы бойынша 75 аннотацияланған ген жиынтығы алынды (2026 жылғы 6 шілдеде қол жеткізілді).&lt;/p&gt;\n&lt;p&gt;Шамадан тыс көріну талдауы (ORA) fgsea пакетіндегі (1.26.0 нұсқасы; minSize=5, maxSize=21955) fora функциясы арқылы жүзеге асырылды. P-мәндері гипергеометриялық тесттер көмегімен бағаланып, FDR әдісімен түзетілді. snRNA-seq деректері үшін фондық гендер жиынтығы біздің деректеріміздегі минималды экспрессия критерийлеріне сай келетін барлық гендер ретінде анықталды. Ген жиынтығын байыту талдауы (GSEA) гендерді &lt;span class=\"yfm-latex\" data-content=\"-%5Clog_%7B10%7DP%20%20imes%20%20ext%7Bsign%7D(%5Clog_2%20%20ext%7B%20fold%20change%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; бойынша ранжирлеу арқылы орындалды. GSEA fgsea::fgseaMultilevel (scoreType=“std”, maxSize=500, eps=0, nPermSimple=10000) көмегімен іске қосылды. Жиынтықтың минималды өлшемі snRNA-seq үшін 10, протеомикалық деректер үшін 15 болып белгіленді. P-мәндері 10000 қайталаудан тұратын пермутациялық тест арқылы бағаланды және FDR әдісімен түзетілді. Байытуды сенімді бағалау үшін GSEA тесті 20 рет қайталанды. Жолдар кем дегенде 70% жағдайда маңыздылыққа (FDR ≤ 0.05) жетсе, сенімді түрде байытылған деп есептелді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Байыту талдаулары (GSEA/ORA) мен морфологиялық өлшеулер эксперименттік үлгілердегі үлкен деректер массивтеріне негізделген, алайда бұл нәтижелерді тікелей адам патологиясына қатысты бірмәнді себеп-салдарлық байланыс ретінде қарастыруға болмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Протеомикалық және фосфопротеомикалық деректер үшін UniProt идентификаторлары biomaRt (2.58.2 нұсқасы) көмегімен MGI ген белгілеріне сәйкестендірілді. Маңызды жолдарды түсіндіруді жеңілдету үшін rrvgo пакеті (1.14.2 нұсқасы) арқылы семантикалық ұқсастық негізінде кластерленді. Жолдар арасындағы ұқсастық rrvgo::calculateSimMatrix көмегімен есептеліп, rrvgo::reduceSimMatrix арқылы топтастырылды.&lt;/p&gt;\n&lt;p&gt;DIV6 кезеңіндегі өсірілген нейрондар Axio Observer Z1 кең өрісті микроскопында (Zeiss, Германия), Axiocam705 камерасы және 40x/0.95 NA объективімен (Plan-Apochromat 40x/0.95 Corr M27; Zeiss) суретке түсірілді. Мозаикалық кескіндер бір тереңдікте әр мкм үшін 11.59 пиксель ажыратымдылықпен алынды. Әрбір жабын шынысынан бір Tau-1-оң нейриті және бірнеше MAP2-оң нейриттері бар жасушалар кездейсоқ таңдалды. Нейрондардың генотипін білмейтін зерттеуші Neurolucida (2025.1.2 нұсқасы; MBF Bioscience LLC) бағдарламасында қолмен сызды. Морфометриялық өлшеулер Neurolucida Explorer (2024.1.1 нұсқасы) көмегімен есептеліп, R (4.3.0 нұсқасы) ортасында Манн-Уитни U-тесті арқылы талданды.&lt;/p&gt;\n&lt;p&gt;Нейрондар LSM 800 конфокалды лазерлік сканерлеу модулі бар Axio Observer Z1 микроскопында (Zeiss) 63x/1.40 NA объективінің (Plan-Apochromat 63x/1.40 Oil DIC M27, Zeiss) көмегімен түсірілді. GFP-оң нейрондардың z-стек кескіндері әр мкм үшін 17.45 пиксель ажыратымдылықта және 0.29 мкм z-қадам өлшемінде алынды. Барлық үлгілер үшін бірдей пиксельді ұстау уақыты, лазер қуаты, пинхол өлшемі және күшейту қолданылды. Сомалар ImageJ (1.54p нұсқасы) бағдарламасында Оцу табалдырығын қолдану арқылы GFP арнасынан сегменттелді, содан кейін әрбір нейрон үшін сомадағы PKA RIα орташа флуоресценция қарқындылығы есептелді.&lt;/p&gt;\n&lt;p&gt;Уақыт бойынша алынған кескін сериялары ImageJ бағдарламасындағы SIFT белгілеріне негізделген біріктіру алгоритмі (SIFT MultiChannel бар Linear Stack Alignment) арқылы түзуленді. Нейрон денесін (соманы) сегментациялау үшін 488 нм сигналының минималды қарқындылық проекциясы жасалды, содан кейін σ=1.0 мәнімен Гаусс сүзгілеуі және оңтайлы сегментацияға қол жеткізу мақсатында «Auto Local Threshold» немесе «Auto Threshold» көмегімен шектік өңдеу қолданылды. Сегментацияланған сома ішіндегі орташа флуоресценция қарқындылығы сүзілмеген 488 нм және 405 нм сигналдары негізінде есептелді. Фондық флуоресценция әр арна үшін жасушалары жоқ өлшемі 50 × 50 пиксель болатын бес қызығушылық аймағы (&lt;a href=\"concepts/roi.html\"&gt;ROI&lt;/a&gt;) арқылы бағаланды. Фонның орташа қарқындылығы тиісті сома флуоресценциясы қарқындылығынан шегеріліп, фоннан тазартылған F₄₈₈ және F₄₀₅ сигналдары алынды. Әрбір уақыт нүктесіндегі PKA белсенділігі қозу қатынасы ретінде флуоресценция қатынасы R = F₄₈₈/F₄₀₅ арқылы есептелді. PKA белсенділігінің өзгерістері нормаланған флуоресценция қатынасының өзгерісі ретінде Δ R/R₀ = (R – R₀)/R₀ формулусымен анықталды, мұндағы R — берілген уақыт нүктесіндегі флуоресценция қатынасы, ал R₀ — эксперимент басындағы алғашқы уақыт нүктесіндегі көрсеткіш.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ImageJ бағдарламасындағы SIFT алгоритмі микроскоп кадрларының ығысуын бағдарламалық түрде түзетіп, нейрон денесіндегі екі толқынды PKA сенсорының флуоресценция қарқындылығын дәл өлшеуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun-f1.jpg\" alt=\"1-сурет. Пациенттен алынған, Akap11 ақуызының өте сирек кездесетін кесінділік (truncating) варьиантын тасымалдайтын гете\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Пациенттен алынған, Akap11 ақуызының өте сирек кездесетін кесінділік (truncating) варьиантын тасымалдайтын гетерозиготалы тышқандар Akap11 мРНК пен ақуызының төмендеуін, сондай-ақ үрей және депрессияға ұқсас фенотиптермен байланысты мінез-құлық…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет. Пациенттен алынған, Akap11 ақуызының өте сирек кездесетін кесінділік (truncating) варьиантын тасымалдайтын гетерозиготалы тышқандар Akap11 мРНК пен ақуызының төмендеуін, сондай-ақ үрей және депрессияға ұқсас фенотиптермен байланысты мінез-құлық тапшылығын көрсетеді. A. AKAP11 геніндегі пациенттен алынған өте сирек кездесетін ақуызды кесінділік варьианттың (PTV) схемасы және CRISPR-Cas9 геномды өңдеу көмегімен knock-in тышқан моделін жасау. B. Akap11+/+ және Akap11+/S384* тышқандарындағы Gapdh-ке қатысты қалыптасқан (нормализацияланған) Akap11 мРНК деңгейлері. PP1, PP2 және PP3 үш праймер жұбымен амплификацияланған тізбектерді көрсетеді. Қызыл жолақ бір нуклеотидті мутацияның орнын көрсетеді. †P = 0.057, Манн-Уитни U тесті арқылы. Толық статистикалық нәтижелер 1A қосымша кестесінде берілген. C. Akap11 ақуызының мөлшерін анықтау үшін иммуноблоттинг арқылы талданған ми аймақтарын көрсететін схема. Талданған аймақтар көк түспен белгіленген. D. Мидың төрт аймағындағы Akap11 иммуноблоттары (сол жақта) және сандық бағалау (оң жақта). Akap11 ақуызының мөлшері соматосенсорлық қыртыста (P = 0.015), префронтальды қыртыста (P = 0.041), гиппокампта (P = 0.0022) және стриатумда (P = 0.0087) төмендеген. *P ≤ 0.05; **P ≤ 0.01, Манн-Уитни U тесті арқылы. Толық статистикалық нәтижелер 1B қосымша кестесінде берілген. E. Бастапқы деңгейдегі және үш апта бойы жеке ұстау арқылы стресс индукцияланғаннан кейінгі мінез-құлықты сынаудың хронологиясы.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun-f2.jpg\" alt=\"2-сурет. Бір ядролы РНК секвенирлеу гетерозиготалы мутантты тышқандардың қыртысында синаптикалық ұйымдасумен, синаптикал\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет. Бір ядролы РНК секвенирлеу гетерозиготалы мутантты тышқандардың қыртысында синаптикалық ұйымдасумен, синаптикалық сигнализациямен және нейрондық өсінділермен байланысты транскрипциялық өзгерістерді анықтады.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сурет. Бір ядролы РНК секвенирлеу гетерозиготалы мутантты тышқандардың қыртысында синаптикалық ұйымдасумен, синаптикалық сигнализациямен және нейрондық өсінділермен байланысты транскрипциялық өзгерістерді анықтады. A. Бір ядролы РНК секвенирлеу (snRNA-seq) жұмыс процесінің схемасы. Барлығы 33 жасуша түрі және 92 субтир анықталды. B. Глутаматергиялық, ГАМК-эргейлік және нейрондық емес санаттарға топтастырылған 33 жасуша түріне аннотацияланған жасушалардың UMAP графиктері. C. 33 жасуша түрі бойынша жасуша түрі маркерлерінің орташа нормализацияланған, log2 түрлендірілген экспрессиясын көрсететін жылу карталары (heatmaps). D. Жасуша түрі бойынша топтастырылған 92 субтиптің әрқайсысында анықталған жоғары сенімді дифференциалды экспрессияланатын гендердің (DEG) санын көрсететін леденец диаграммасы (lollipop plot). Жоғары сенімді DEG edgeR квази-ықтималдық теріс биномиалды жалпыланған лог-сызықтық моделін қолдана отырып, жалған ашу жиілігі (FDR) ≤ 0.10 болатын және әдістер арасындағы өзгеріс бағыты сәйкес келетін псевдо-көлемдік (pseudobulk) дифференциалды экспрессия талдауында және бір жасушалы Пуассон-гамма аралас моделінде (PMM) номиналды P ≤ 0.05 болатын гендер ретінде анықталды. E. Жоғары экспрессияланған (upregulated) жоғары сенімді DEG арасында артық ұсынылған гендік онтология (GO) терминдері. Маңызды артық ұсынылу гипергеометриялық тест арқылы FDR ≤ 0.05 ретінде анықталды. Артық ұсынылуды талдау (ORA) ұпайы −log10FDR мәнін өзгеріс бағытына көбейту арқылы есептелді, мұнда оң мәндер Akap11+/S384* тышқандарында жоғарылаған гендер арасындағы байытуды, ал теріс мәндер төмендетілген гендер арасындағы байытуды көрсетеді. BP, биологиялық процесс; CC, жасушалық компонент. F. Кеңейтілген жоғары сенімді DEG арасында артық ұсынылған психикалық бұзылулардың қауіп гендерінің жиынтықтары. Маңызды артық ұсынылу гипергеометриялық тест арқылы FDR ≤ 0.05 ретінде анықталды. ORA ұпайы −log10FDR мәнін өзгеріс бағытына көбейту ретінде анықталады. Оң жақтағы матрицалық тор әрбір қауіп гені жиынтығы мен кеңейтілген жоғары сенімді DEG тізімі арасындағы қиылысатын гендерді көрсетеді. Тек кемінде төрт артық ұсынылған ген жиынтығында бар гендер көрсетілген. Қысқартулар: ADHD = зейін тапшылығы және гиперактивност синдромы, ANX = үрейлі бұзылу, ASD = аутизм спектрінің бұзылуы, BD = биполярлық бұзылу, DD = дамудың бұзылуы, MDD = үлкен депрессиялық бұзылу, PTSD = посттравматикалық стресс бұзылуы, SA = суицидке әрекет жасау, SCZ = шизофрения және SUD = психоактивті заттарды тұтыну бұзылулары.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun-f3.jpg\" alt=\"3-сурет. snRNA-seq гетерозиготалы мутантты тышқандар қыртысында ортақ және жасуша түріне тән транскрипциялық өзгерістерд\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет. snRNA-seq гетерозиготалы мутантты тышқандар қыртысында ортақ және жасуша түріне тән транскрипциялық өзгерістерді анықтады.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-сурет. snRNA-seq гетерозиготалы мутантты тышқандар қыртысында ортақ және жасуша түріне тән транскрипциялық өзгерістерді анықтады. A. Akap11+/+ және Akap11+/S384* тышқандары арасындағы таңдалған дифференциалды экспрессияланатын гендердің (DEG) нормализацияланған, log2 түрлендірілген экспрессиясын көрсететін скрипка диаграммалары (violin plots). +/+, Akap11+/+; +/S384*, Akap11+/S384*. B. Минималды экспрессия критерийлеріне сәйкес келетін кемінде 5000 гені бар субтиптер бойынша GO терминдері санаттары үшін орташа нормализацияланған байыту ұпайын (NES) көрсететін жылу картасы. Оң және теріс NES мәндері сәйкесінше Akap11+/S384* тышқандарындағы байытуды және сарқылуды көрсетеді. Маңыздылық перемутациялық тест арқылы FDR ≤ 0.05 ретінде анықталды. C. Таңдалған GO санаттары үшін жетекші шеткі гендердің (leading-edge genes) рангтерін көрсететін жылу карталары. Ген рангтері псевдо-көлемдік дифференциалды экспрессия тестінен −log10P x sign(log2 fold change) ретінде есептелді. Оң және теріс рангтер Akap11+/S384* тышқандарында сәйкесінше жоғары және төмен реттелуді көрсетеді. Жұлдызшалар сәйкес субтип пен жол санаты үшін жетекші гендерді көрсетеді. Тек псевдо-көлемдік дифференциалды экспрессия тестінде кемінде бір тиісті субтипте P ≤ 0.05 болатын гендер көрсетілген.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun-f5.jpg\" alt=\"5-сурет. Тірі жасушаларды визуализациялау гетерозиготалы мутантты тышқандардың қоздырғыш қыртыстық нейрондарында стимулғ\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет. Тірі жасушаларды визуализациялау гетерозиготалы мутантты тышқандардың қоздырғыш қыртыстық нейрондарында стимулға тәуелді PKA белсенділігінің әлсірегенін көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-сурет. Тірі жасушаларды визуализациялау гетерозиготалы мутантты тышқандардың қоздырғыш қыртыстық нейрондарында стимулға тәуелді PKA белсенділігінің әлсірегенін көрсетеді. A. In vitro (DIV) 4–6 күндерінде pCAG-GFP-пен трансфекцияланған және DIV21-22-де PKA RIα үшін иммунобояудан өткізілген қыртыстық нейрондардың өкілді суреттері. Масштабты сызықтар: 10 µm. B. Akap11+/S384* және Akap11+/+ нейрондарының сомасындағы PKA RIα иммунофлюоресценциясын сандық бағалау. Akap11+/S384* нейрондары Akap11+/+ нейрондарымен салыстырғанда PKA RIα иммунофлюоресценциясының жоғарылағанын көрсетті (Akap11+/+: N = 5 эмбрион, n = 26 нейрон; Akap11+/S384*: N = 6 эмбрион, n = нейрон; P = 0.047). &lt;em&gt;P ≤ 0.05, Манн-Уитни U тесті арқылы. Толық статистикалық нәтижелер 7A қосымша кестесінде көрсетілген. C. Қыртыстық нейрондарды өсіру, PKA сенсорымен трансфекциялау және тірі жасушаларды визуализациялау үшін эксперименталды хронология. D. DIV22-де Akap11+/+ нейронында (жоғарғы панельдер) және Akap11+/S384&lt;/em&gt; нейронында (төменгі панельдер) өкілді PKA сенсорлық сигналдары. Әрбір нейрон үшін форсколинмен/ролипраммен стимуляциядан кейінгі F488 сигналы (сол жақта), бастапқы деңгейдегі F488/F405 қатынасы (-FSK/Rol; ортасында) және стимуляциядан кейінгі F488/F405 қатынасы (+FSK/Roli; оң жақта) көрсетілген. Суреттер әрбір шарттың бірінші уақыт нүктесінен көрсетілген. Масштабты сызық: 10 µm. FSK, форсколин. Roli, ролипрам. E. PKA белсенділігін сандық бағалау. Қорапты диаграммалар (boxplots) бастапқы деңгейдегі орташа F488/F405 қатынасын (сол жақта) және форсколин/ролипрам стимуляциясына жауап ретінде F488/F405 қатынасының орташа нормализацияланған өзгерісін (орташа ΔR/R0) көрсетеді (оң жақта), мұнда R = F488/F405, R0 бірінші базалық уақыт нүктесіндегі қатынас, ал ΔR — R0-ге қатысты R өзгерісі. Бастапқы PKA белсенділігі Akap11+/+ нейрондарымен салыстырғанда Akap11+/S384* нейрондарында төмендеу үрдісін көрсетті (P = 0.075), ал стимул тудырған PKA белсенділігі Akap11+/S384* нейрондарында айтарлықтай төмендеді (Akap11+/+: N = 2 эмбрион, n = нейрон; Akap11+/S384*: N = 3 эмбрион, n = 15 нейрон; P = 0.0074). *&lt;em&gt;P ≤ 0.01, Манн-Уитни U тесті арқылы. Қорапты диаграммалар үшін төменгі жиек, ортаңғы сызық және жоғарғы жиек сәйкесеніше бірінші квартильді, медиананы және үшінші квартильді білдіреді. Мұртшалар қорап жиектерінен 1.5 × интерквартильдік ауқымды білдіреді. Сызықтық графиктер Akap11+/+ нейрондары (сол жақта) және Akap11+/S384&lt;/em&gt; нейрондары (оң жақта) үшін ΔR/R0 уақыт барысын көрсетеді. Жоғарғы, ортаңғы және төменгі қалың тұтас сызықтар сәйкесінше максималды, орташа және минималды ΔR/R0 мәндерін білдіреді. Жіңішке тұтас сызықтар жеке нейрондардың іздерін көрсетеді. Үзікті сызықтар препаратты қолдану кезіндегі, визуализация тоқтатылып тұрған 3 минуттық интервалды көрсетеді. Көлденең нүктелі сызықтар ΔR/R0 = 0 екенін білдіреді. Толық статистикалық нәтижелер 7C қосымша кестесінде көрсетілген.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun-f6.jpg\" alt=\"6-сур. Пациенттен алынған Akap11 PTV мутациясы жаңадан пайда болған дендриттердің морфогенезін бұзады.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сур. Пациенттен алынған Akap11 PTV мутациясы жаңадан пайда болған дендриттердің морфогенезін бұзады.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;6-сур. Пациенттен алынған Akap11 PTV мутациясы жаңадан пайда болған дендриттердің морфогенезін бұзады. A. Akap11+/+ және Akap11+/S384* культураларындағы өкілді DIV6 кортикальды нейрондарының іздері. Масштабты сызғыр, 50 мкм. B. DIV6 кезіндегі нейрон морфологиясын сандық талдау. Akap11+/S384* нейрондарында сома алаңы (P = 0,38), дендритті ағаштар саны (P = 0,11) және бастапқы аксон ұзындығы (P = 1,00) бойынша айтарлықтай айырмашылықтар байқалмады, бірақ дендриттердің орташа ұзындығы айтарлықтай азайғаны байқалды (P = 0,018). Akap11+/+: N = 2 эмбрион, n = 12 нейрон; Akap11+/S384*: N = 2 эмбрион, n = 9 нейрон. *P ≤ 0,05, n.s., P &amp;gt; 0,05 (Манн-Уитни U тесті арқылы). Толық статистикалық нәтижелер 8A қосымша кестесінде көрсетілген.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun-fS1.jpg\" alt=\"Қосымша 1-сур. Гомозиготты мутантты тышқандардағы Akap11 мРНҚ изоформалары және гетерозиготты мутантты тышқандардың міне\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қосымша 1-сур. Гомозиготты мутантты тышқандардағы Akap11 мРНҚ изоформалары және гетерозиготты мутантты тышқандардың мінез-құлық сипаттамасы. 1-суретке қатысты.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun-fS2.jpg\" alt=\"Қосымша 2-сур. Гетерозиготты мутантты тышқандардың неокортексінің бір ядролы РНҚ секвенирлеу профилі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қосымша 2-сур. Гетерозиготты мутантты тышқандардың неокортексінің бір ядролы РНҚ секвенирлеу профилі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Қосымша 2-сур. Гетерозиготты мутантты тышқандардың неокортексінің бір ядролы РНҚ секвенирлеу профилі. 2-суретке қатысты. A. Akap11+/S384* пен Akap11+/+ қатынасы ретінде есептелген генотиптер арасындағы кең жасуша түрі пропорцияларының қатынасы. Сұр нүктелер, propeller көмегімен модерацияланған t-тест арқылы жасуша түрі құрамының тестінде P &amp;gt; 0,05. B. Akap11+/S384* пен Akap11+/+ қатынасы ретінде есептелген генотиптер арасындағы жасуша түрі пропорцияларының қатынасы. Сұр нүктелер, propeller көмегімен модерацияланған t-тест арқылы жасуша түрі құрамының тестінде P &amp;gt; 0,05. C. Akap11+/S384* пен Akap11+/+ қатынасы ретінде есептелген генотиптер арасындағы субтиптер пропорцияларының қатынасы. Сұр нүктелер, propeller көмегімен модерацияланған t-тест арқылы жасуша түрі құрамының тестінде P &amp;gt; 0,05. D. Үш псевдокөлемді дифференциалды экспрессия (DE) тестінен (edgeR, DESeq2 және limma арқылы) және бір жасушалы Пуассон-гамма аралас моделіне (PMM) негізделген DE тестінен (nebula арқылы) алынған P мәндері арасындағы Пирсон корреляциясын көрсететін жылу картасы (heatmap). Корреляциялар 33 жасуша түрі (сол жақта) және 92 субтип (оң жақта) үшін көрсетілген. E. Әрбір 33 жасуша түрінде анықталған жоғары сенімді дифференциалды экспрессияланған гендердің (DEG) санын көрсететін леденец тәрізді график (lollipop plot). Жоғары сенімді DEG-тер edgeR көмегімен квазиұқсастық теріс биномиалды жалпыланған лог-сызықтық моделі арқылы псевдокөлемді DE тестінде FDR ≤ 0,10 және PMM негізделген бір жасушалы DE тестінде номиналды P ≤ 0,05 болатын, әдістер арасындағы өзгеріс бағыты сәйкес келетін гендер ретінде анықталды. F. Әрбір субтипте анықталған жоғары сенімді DEG саны. Жасыл түс жоғарылаған гендерді, ал қызыл түс Akap11+/S384* тышқандарында төмендеген гендерді көрсетеді. Субтип белгілері олар тиесілі жасуша түріне сәйкес боялған. G. Барлық субтиптер бойынша жоғарылаған жоғары сенімді DEG арасында шамадан тыс ұсынылған синапсқа тән ген онтологиясының (SynGO) терминдері. Маңызды шамадан тыс ұсынылу гипергеометриялық тест арқылы FDR ≤ 0,05 ретінде анықталды. Шамадан тыс ұсынылуды талдау (ORA) балы −log10FDR мәнін өзгеріс бағытына көбейту арқылы есептелді, оң мәндер Akap11+/S384* тышқандарында жоғарылаған гендер арасындағы байытуды, ал теріс мәндер төмендеген гендер арасындағы байытуды көрсетеді. H. Синаптикалық компартменттер бойынша шамадан тыс ұсынылған SynGO терминдерінің таралуы. I. Кеңейтілген жоғары сенімді DEG арасында шамадан тыс ұсынылған MeSH F03 санаттарындағы («психикалық бұзылулар») DisGeNET гендер жиынтығы. Маңызды шамадан тыс ұсынылу гипергеометриялық тест арқылы FDR ≤ 0,05 ретінде анықталды. ORA балы −log10FDR мәнін өзгеріс бағытына көбейту арқылы есептелді. Қысқартулар: ASD = аутизм спектрінің бұзылуы, BD = биполярлық бұзылу, MDD = негізгі депрессиялық бұзылу, SCZ = шизофрения.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun-fS3.jpg\" alt=\"Қосымша 3-сур. Гетерозиготты мутантты тышқандардың қыртысының протеомикалық профилі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қосымша 3-сур. Гетерозиготты мутантты тышқандардың қыртысының протеомикалық профилі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Қосымша 3-сур. Гетерозиготты мутантты тышқандардың қыртысының протеомикалық профилі. 4-суретке қатысты. A. Пермутация тесті арқылы Akap11+/S384* тышқандарында айтарлықтай байытылған немесе таусылған Reactome жолдары. Оң және теріс нормаланған байыту ұпайлары (NES) гетерозиготты тышқандарда сәйкесінше байытуды және таусылуды көрсетеді. Гендер арақатынасы реттелген ақуыз тізімінде көрсетілген жол гендерінің үлесі ретінде есептелді. Маңыздылық FDR ≤ 0,05 ретінде анықталды. Жолдар Reactome жолының иерархиясына сәйкес 10 топқа топтастырылған (https://reactome.org/ сайтынан алынды). Бірнеше жолды қамтитын санаттар үшін семантикалық жиынтықтар көрсетілген. B. 4C суретінде көрсетілген байытылған (жоғарыда) және таусылған (төменде) Ген онтологиясы (GO) терминдері үшін алдыңғы қатарлы ақуыздар (leading-edge proteins). Түс ақуыз ранкін көрсетеді, ол дифференциалды ақуыз мөлшерін талдаудан −log10P x таңба (log2 еселенген өзгеру) ретінде есептелді. Оң және теріс рангтер Akap11+/S384* тышқандарында сәйкесінше артқан және азайған мөлшерді көрсетеді. Тек P ≤ 0,01 болатын алдыңғы қатарлы ақуыздар және кем дегенде бір осындай ақуызы бар GO терминдері көрсетілген. C, E. Баламалы сынақ әдісін (VIPER) қолдана отырып, фосфосайт мөлшерінен (C) немесе фосфорлану жылдамдығынан (E) қорытылған болжалды киназа белсенділігін көрсететін жанартау графиктер (Volcano plots). VIPER −log10P x таңба(log2 еселенген өзгеру) мәніне қолданылды. Оң және теріс киназа белсенділігі ұпайлары Akap11+/S384* тышқандарында сәйкесінше артқан және азайған киназа белсенділігін көрсетеді. Киназалар кем дегенде үш субстрат болған кезде P ≤ 0,05 мәнінде маңызды деп саналды. D, F. RoKAI тестімен байланысты болжалды PKACA субстраттарын көрсете отырып, генотипке тәуелді фосфосайт мөлшеріндегі (D) және фосфорлану жылдамдығындағы (F) айырмашылықтарды көрсететін жанартау графиктер. Оң және теріс log2 еселенген өзгерістер Akap11+/S384* тышқандарында сәйкесінше фосфосайт мөлшерінің немесе фосфорлану жылдамдығының артқанын және азайғанын көрсетеді. Көлденең және тік сызықтар сәйкесінше 0,05 кезіндегі P мәнін және 0 кезіндегі log2 еселенген өзгеруді көрсетеді. G. Фосфосайт мөлшеріне негізделген −log10P x таңба(log2 еселенген өзгеру) арқылы реттелген фосфосайттарды пайдалана отырып, GO терминдерінің гендер жиынтығын байыту талдауы (GSEA). Оң және теріс NES мәндері Akap11+/S384* тышқандарында сәйкесінше артқан немесе азайған фосфосайт мөлшері бар ақуыздармен байланысқан жолдарды көрсетеді. P мәндері пермутация тесті арқылы бағаланды және маңыздылық FDR ≤ 0,05 ретінде анықталды. Гендер арақатынасы фосфосайт деректер жиынтығында бар жол гендерінің үлесі ретінде есептелді. H. Фосфорлану жылдамдығына негізделген −log10P x таңба(log2 еселенген өзгеру) бойынша реттелген фосфосайттарды пайдалана отырып, SynGO терминдерінің GSEA талдауы. Оң және теріс NES мәндері Akap11+/S384* тышқандарында сәйкесінше артқан немесе азайған фосфорлану жылдамдығы бар ақуыздармен байланысқан SynGO жолдарын көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun-fS4.jpg\" alt=\"Қосымша 4-сур. PKA сенсорын валидациялау.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қосымша 4-сур. PKA сенсорын валидациялау.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Қосымша 4-сур. PKA сенсорын валидациялау. 5-суретке қатысты. A. Форсколин/ролипрамға (FSK/Roli) жауап ретінде және форсколин/ролипрамның тұрақты қатысуында H-89 қосылуына жауап ретінде (FSK/Roli+H-89), Akap11+/+ нейрондарында бірінші уақыт нүктесіне нормаланған F488/F405 қатынасының орташа өзгеруін (орташа ΔR/R0) көрсететін жәшік диаграммалары (boxplots). Форсколин/ролипрам бастапқы деңгейге қатысты сенсор жауабын айтарлықтай арттырды (FDR = 7,32 x 10-4), ал кейіннен H-89 қосылуы жауапты бастапқы деңгейге қайтарды (FSK/Roli+H-89 және FSK/Roli: FDR = 7,32 x 10-4; FSK/Roli+H-89 және бастапқы деңгей: FDR = 0,50). N = 2 эмбрион, n = нейрондар. ***FDR ≤ 0,001, n.s., FDR &amp;gt; 0,05 жұптастырылған Уилкоксон таңбалы рангтер тесті арқылы. Жәшік диаграммалары үшін төменгі жиек, ортаңғы сызық және жоғарғы жиек сәйкесінше бірінші квартильді, медиананы және үшінші квартильді білдіреді. Мұртшалар жәшік жиектерінен 1,5 x интерквартильдік ауқымды білдіреді. Толық статистикалық нәтижелер 7B қосымша кестесінде көрсетілген. B. A суретінде көрсетілген нейрондар үшін ΔR/R0 өзгеруінің уақытша барысы. Үзіл сызықтар бейнелеу тоқтатылған кездегі препаратты енгізу кезіндегі интервалдарды көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Сирек AKAP11&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мутацияларының&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;рөлі&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;CRISPR-Cas9&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;арқылы тышқан&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жасау&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;PKA тапшылығы&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;және мазасыз&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мінез&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Психикалық&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бұзылыстардың&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жаңа моделі&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Препринт лицензиясы&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;bioRxiv&lt;/td&gt;\n&lt;td&gt;psychiatry and clinical psychology&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Luo AX, Deng L, Li Y, Zhang X, Li J, Zhu X, Mao X, Su Y, Wu B, Ross CA, Li PP.&lt;/p&gt;\n&lt;h3 id=\"derekkoezder\"&gt;&lt;a href=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Сілтеме&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница препринта&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://www.biorxiv.org/content/10.64898/2026.09.19.752887v1\" target=\"
