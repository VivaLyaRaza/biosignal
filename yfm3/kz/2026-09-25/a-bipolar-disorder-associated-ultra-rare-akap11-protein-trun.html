            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"259\" cy=\"102\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"521\" cy=\"201\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · PSYCHIATRY AND CLINICAL PSYCHOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;AKAP11 геніндегі сирек&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;мутация мазасыздық пен&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;депрессияны қалай туындайды&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun-f1.jpg\" alt=\"1-сурет. Пациенттен алынған, Akap11 ақуызының өте сирек кездесетін кесінділік (truncating) варьиантын тасымалдайтын гете\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Пациенттен алынған, &lt;a href=\"concepts/akap11.html\"&gt;Akap11&lt;/a&gt; ақуызының өте сирек кездесетін кесінділік (truncating) варьиантын тасымалдайтын гетерозиготалы тышқандар Akap11 мРНК пен ақуызының төмендеуін, сондай-ақ үрей және депрессияға ұқсас фенотиптермен байланысты мінез-құлық…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет. Пациенттен алынған, Akap11 ақуызының өте сирек кездесетін кесінділік (truncating) варьиантын тасымалдайтын гетерозиготалы тышқандар Akap11 мРНК пен ақуызының төмендеуін, сондай-ақ үрей және депрессияға ұқсас фенотиптермен байланысты мінез-құлық тапшылығын көрсетеді. A. AKAP11 геніндегі пациенттен алынған өте сирек кездесетін ақуызды кесінділік варьианттың (&lt;a href=\"concepts/protein-truncating-variant.html\"&gt;PTV&lt;/a&gt;) схемасы және &lt;a href=\"concepts/crispr-cas9.html\"&gt;CRISPR-Cas9&lt;/a&gt; геномды өңдеу көмегімен &lt;a href=\"concepts/knock-in.html\"&gt;knock-in&lt;/a&gt; тышқан моделін жасау. B. Akap11+/+ және Akap11+/S384* тышқандарындағы Gapdh-ке қатысты қалыптасқан (нормализацияланған) Akap11 мРНК деңгейлері. PP1, PP2 және PP3 үш праймер жұбымен амплификацияланған тізбектерді көрсетеді. Қызыл жолақ бір нуклеотидті мутацияның орнын көрсетеді. †P = 0.057, Манн-Уитни U тесті арқылы. Толық статистикалық нәтижелер 1A қосымша кестесінде берілген. C. Akap11 ақуызының мөлшерін анықтау үшін иммуноблоттинг арқылы талданған ми аймақтарын көрсететін схема. Талданған аймақтар көк түспен белгіленген. D. Мидың төрт аймағындағы Akap11 иммуноблоттары (сол жақта) және сандық бағалау (оң жақта). Akap11 ақуызының мөлшері соматосенсорлық қыртыста (P = 0.015), префронтальды қыртыста (P = 0.041), гиппокампта (P = 0.0022) және стриатумда (P = 0.0087) төмендеген. *P ≤ 0.05; **P ≤ 0.01, Манн-Уитни U тесті арқылы. Толық статистикалық нәтижелер 1B қосымша кестесінде берілген. E. Бастапқы деңгейдегі және үш апта бойы жеке ұстау арқылы стресс индукцияланғаннан кейінгі мінез-құлықты сынаудың хронологиясы.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Биполярлы бұзылыс пен шизофрениямен ауыратын науқастарды зерттеу AKAP11 геніндегі сирек өзгерістерді анықтады. Бұл механизмін түсіну үшін зерттеушілер ұқсас ақауды CRISPR-Cas9 көмегімен тышқандар геномына енгізді. Тіпті бір зақымдалған көшірме ақуыз тапшылығына әкеліп, жануарларда мазасыз және депрессиялық мінез-құлықты тудырды. Жұмыс генетикалық бұзылыстан синапстардағы өзгерістерге дейінгі молекулалық тізбекті ашады.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Akap11 геніндегі мутация тышқандарда ақуыздың гапложетіспеушілігін тудырады&lt;/li&gt;\n&lt;li&gt;Гетерозиготты еркек тышқандар мазасыздық пен депрессияға ұқсас мінез көрсетеді&lt;/li&gt;\n&lt;li&gt;Неокортексте &lt;a href=\"concepts/protein-kinase-a.html\"&gt;PKA&lt;/a&gt; сигналы мен дендриттердің дамуы бұзылады&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Ауыр психикалық бұзылыстардың генетикалық сәулеті кішігірім әсері бар кең таралған полиморфизмдерді де, жоғары пенетранттылығы бар сирек нұсқаларды да қамтиды. Бұрын жүргізілген экзомды толық секвенирлеу талдаулары биполярлы бұзылыс пен шизофрениямен ауыратын адамдарда AKAP11 генінде ақуызды кесетін аса сирек нұсқалардың жиілігін анықтаған болатын. Бұл ген протеинкиназа A (PKA) ферментін өз субстраттарымен байланыстыратын AKAP11 ақуызды кодтайды.&lt;/p&gt;\n&lt;p&gt;CRISPR-Cas9 көмегімен зерттеушілер тышқанның Akap11 генінің 7-экзонына c.1151C&amp;gt;A (p.Ser384*) нүктелік мутациясын енгізді. Гетерозиготы тышқандарда Akap11 мРНК пен ақуыз деңгейі шамамен екі есе азайды. Мұндай мутациясы бар еркек тышқандар ашық алаң және крест тәрізді лабиринт тесттерінде мазасыздық мен депрессияға ұқсас мінез-құлық ауытқуларын көрсетті.&lt;/p&gt;\n&lt;p&gt;Неокортексті транскриптомдық талдау синапстық ұйымдасу мен нейриттер морфогенезі үшін жауап беретін өзгерістерді анықтады. Мутантты жануарларда PKA I түpдегі реттеуші суббірліктерінің артуы және оның нысандарының фосфорлануының төмендеуі байқалды. Тірі нейрондарда PKA белсенділігінің төмендеуі мен дендриттердің дамуы бұзылғаны тіркелді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу бір нақты мутациясы бар тышқан моделінде орындалып, мінез-құлық өзгерістері негізінен еркек дарақтарда зерттелді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Психикалық бұзылыстармен байланысты сирек кездесетін генетикалық нұсқалар жеке әсер ету күшімен ерекшеленеді және генетика мен ауру фенотиптері арасындағы себеп-салдарлық байланысты түсінуге мүмкіндік береді. Жақында жүргізілген экзомды толық секвенирлеу мета-талдауы биполярлық бұзылыс пен шизофрениямен ауыратын науқастарда AKAP11 генінде ақуызды қысқартатын өте сирек кездесетін нұсқалардың (PTV) жиілігі жоғары екенін анықтады. AKAP11 гені протеинкиназа A (PKA) мен оның субстраттарын байланыстыратын А-киназалық якорьлік ақуызды кодтайды. Өте сирек AKAP11 нұсқаларының психикалық патологиялардың дамуына қалай әсер ететіні әum беймәлім болып қалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PTV (protein-truncating variant) — бұл ақуыз синтезінің ерте тоқтауына және қысқарған, көбінесе жұмыс істемейтін ақуыздың пайда болуына әкелетін мутация.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Осы мәселені зерттеу үшін ғалымдар CRISPR-Cas9 геномды өңдеу әдісі арқылы тышқанның Akap11 локусына биполярлық бұзылысы бар науқастан табылған өте сирек PTV енгізді. Бұл мутация тұрақты жаңа мРНК изоформаларын түзбестен, Akap11 мРНК пен ақуыз деңгейінің төмендеуіне, яғни Akap11 гапложетіспеушілігіне әкелді. Гетерозиготалы еркек тышқандарда үрей және депрессияға ұқсас мінез-құлық ауытқулары байқалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Адамның AKAP11 мутациясын тышқандарға енгізу ген жетіспеушілігіне және еркек дарақтарда үрей мен депрессияға ұқсас мінез-құлықтың пайда болуына әкелді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Неокортекстің транскриптомдық және протеомдық талдауы синапстық ұйымға, синапстық сигнал беруге және нейрит морфогенезіне әсер ететін молекулалық өзгерістерді көрсетті. Атап айтқанда, гетерозиготалы мутантты жануарларда неокортексте I типті (II тип емес) PKA реттеуші кіші бірліктерінің, сондай-ақ PKA каталитикалық кіші бірліктерінің таңдамалы түрде жоғарылағаны анықталды. Функциялық тұрғыдан бұл өзгерістер PKA субстраттарының фосфорлануының төмендеуімен, қыртыстық қоздырғыш нейрондардағы стимулға тәуелді PKA белсенділігінің әлсіреуімен және қыртыс нейрондарында бастапқы дендриттердің дамуының бұзылуымен бірге жүрді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тышқан моделінде жүргізілгендіктен, алынған нәтижелерді адамдардың психикалық бұзылыстарына қатысты қолданғанда сақтық таныту қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Психиатриялық аурулар жоғары полигенділік пен плейотропиямен сипатталатын күрделі генетикалық архитектураға ие. Геномдық ассоциациялық зерттеулер (&lt;a href=\"concepts/gwas.html\"&gt;GWAS&lt;/a&gt;) жалпы генетикалық нұсқаларды (минорлық аллель жиілігі [MAF] &amp;gt; 1%) анықтады, олардың әрқайсысы ауру қаупіне аз үлес қосады. Жақында экзом мен геномды толық секвенирлеу арқылы сирек (MAF &amp;lt; 1%) және өте сирек (MAF &amp;lt; 0,1%) нұсқалар табылды, олар шизофрения, биполярлық бұзылыс (ББ), аутизм спектрінің бұзылуы және даму кемістіктерінде маңызды рөл атқарады. Сирек нұсқалар популяция деңгейінде тұқым қуалаушылықтың аз бөлігін түсіндірсе де, олар жеке деңгейде күштірек әсер етеді және биологиялық тұрғыдан тікелей маңызға ие.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AKAP11 геніндегі өте сирек ақуыз-транкирлеуші нұсқалар (PTV) биполярлық бұзылыс және шизофрениямен байланысты, алайда олардың молекулалық жолдарға әсерін нақтырақ модельдер арқылы зерттеу қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ББ және шизофрения дүние жүзінде сәйкесінше 35,7 миллион (0,46%) және 26,9 миллион (0,34%) адамға әсер етеді. Экзом деректерін талдау AKAP11 локусында PTV нұсқаларының байытылғанын көрсетті. AKAP11 ақуызы PKA (протеинкиназа А) мен оның субстраттары арасындағы байланысты қамтамасыз етеді. Бұрынғы нокауттық (KO) тышқан модельдерінде (6 және/немесе 7-экзондар жойылған) стриатумдағы PKA динамикасының бұзылуы, &lt;a href=\"concepts/multichannel-electroencephalography.html\"&gt;ЭЭГ&lt;/a&gt; сигналдарының өзгеруі және депрессиялық мінез-құлық байқалған. Алайда, мұндай модельдер хроматин құрылымына немесе басқа гендердің экспрессиясына әсер етуі мүмкін үлкен геномдық сегменттерді жояды.&lt;/p&gt;\n&lt;p&gt;Біз CRISPR-Cas9 жүйесін қолдана отырып, тышқанның Akap11 генінің 7-экзонына биполярлық бұзылысы бар науқаста анықталған өте сирек PTV (c.1148C&amp;gt;A, p.Ser383*) нұсқасына гомологиялық бір нуклеотидті өзгерісті енгіздік. Таңдалған нұсқа (chr13:42299894C&amp;gt;A, аллель жиілігі 3,59 × 10⁻⁵) мерзімінен бұрын тоқтату кодонын (stop-codon) түзеді. Психиатриялық бұзылыстармен байланысты нұсқалар әдетте гетерозиготалы күйде кездесетіндіктен, біз гетерозиготалы еркек тышқандарды талдадық.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR-Cas9 — геномды дәл өңдеу әдісі, ол ДНҚ-да мақсатты өзгерістер жасауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біздің модель гетерозиготалы мутантты тышқандарда мазасыздық және депрессияға ұқсас мінез-құлық тапшылықтарын көрсетті. Неокортекстің транскриптомын, протеомын және фосфопротеомын талдау синапстар ұйымының, нейриттер морфогенезінің және PKA сигнал беруінің бұзылуын анықтады. Бұл нәтижелер тірі жасушалардағы PKA белсенділігін визуализациялау және нейрондардың морфометриялық талдауымен расталды.&lt;/p&gt;\n&lt;p&gt;Зерттеушілер CRISPR-Cas9 геномды өңдеу әдісін қолдана отырып, ENSMUST00000123853 тышқанның Akap11 транскриптінің 7-экзонына c.1151C&amp;gt;A (p.Ser384*) бір нуклеотидті нұсқасын енгізді (1A-сур.). ПЦР өнімдерін гель-электрофорез көмегімен талдау (SN 1G-сур.) және Сэнгер секвенирлеу арқылы растау F2 ұрпағының аталық негізін қалаушысында негізгі ықтимал нысанадан тыс бес сайтта инделдердің жоқтығын көрсетті. Гетерозиготалы және гомозиготалы тышқын топтары тіршілікке қабілетті болып шықты. Генотип дене салмағына шамалы ғана әсер етті, ең үлкен айырмашылық гетерозиготалы және гомозиготалы дарақтар арасында байқалды (SN 1H-сур.). Мұрын ұшынан құйрық түбіне дейін өлшенген дене ұзындығына генотип айтарлықтай әсер етті, гетерозиготалы да, гомозиготалы мутанттар да бақылау топтарына қарағанда қысқа болды (SN 1H-сур.).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR-Cas9 әдісі геномның нақты жеріндегі ДНҚ тізбегін өзгертуге мүмкіндік береді, ал RT-&lt;a href=\"concepts/qpcr.html\"&gt;qPCR&lt;/a&gt; арқылы клеткадағы РНК мөлшерін дәл анықтауға болады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;RT-qPCR талдауы Akap11+/S384* тышқандарының соматосенсорлық қыртысында Akap11 транскрипттері деңгейі шамамен 50%-ға төмендегенін көрсетті, мұнда мутация орналасқан жердің 5' және 3' бағыттарындағы праймерлер қолданылды (1B-сур.). Толық ұзындықтағы РНК секвенирлеу бақылау топтарымен (Akap11+/+) салыстырғанда гомозиготалы мутантты тышқандардың (Akap11S384*/S384*) соматосенсорлық қыртысында жаңа Akap11 транскрипт изоформаларын анықтаған жоқ (SN 1A-сур.). Сонымен қатар, Akap11+/S384* тышқандарының соматосенсорлық қыртысында, гиппокампта, префронтальды қыртыста және стриатумда Akap11 ақуызының экспрессиясы айтарлықтай төмендеді (1C-D-сур.).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Akap11 гетерозиготалы тышқандарында мРНҚ деңгейі 50% азаяды және мидың негізгі бөліктерінде ақуыз мөлшері түседі, бірақ тіршілік қабілеті сақталады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әрі қарай ғалымдар Akap11 геніндегі нұсқаның мінез-құлыққа әсерін бағалады. Ген мен ортаның өзара әрекеттесуі нейropsychiatric бұзылыстардың патогенезінде шешуші рөл атқаратындықтан, Akap11+/S384* және Akap11+/+ аталық тышқандарының мінез-құлық фенотиптері бастапқы жағдайда және кеміргіштерде жеңіл созылмалы стресс тудыру үшін үш апталық жеке ұстаудан кейін бағаланды (1E-сур.). «Ашық алаң» тестінде Akap11+/S384* тышқандары алғашқы 30 минут ішінде тік тұру (rearing) белсенділігінің төмендегенін көрсетті, ал жалпы белсенділік немесе орталық қатынас өзгерген жоқ (SN 1B-сур.). Үш апталық оқшауланудан кейін бұл айырмашылық байқалмады, бұған Akap11+/+ бақылау тышқандарында тік тұру белсенділігінің төмендеуі себеп болған шығар (1F-сур.). Екі сағаттық «ашық алаң» тесті кезінде жалпы белсенділік, орталық қатынас немесе тік тұрулар бойынша генотиптер арасында айырмашылықтар анықталмады (SN 1B-сур.).&lt;/p&gt;\n&lt;p&gt;Көтерілген крест тәрізді лабиринт тестінде Akap11+/S384* тышқандары бастапқы деңгейде ашық тармақтарда өткізген уақыт қатынасының қысқару тенденциясын көрсетті (P = 0.052; SN 1E-сур.) және оқшауланудан кейін ашық тармақтарда жүріп өткен қашықтық үлесі айтарлықтай төмен болды (1G-сур.). Akap11+/+ пен Akap11+/S384* тышқандарының екеуі де ашық тармақтарға қарағанда жабық тармақтарды артық көрді (SN 1C-сур.), жалпы жүріп өткен қашықтық немесе аймақтарға кіру саны бойынша ешқандай айырмашылық болмады (SN 1D-сур.).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мінез-құлықты бағалау тек аталық тышқандарда жүргізілді және кейбір ауытқулар тек статистикалық маңыздылыққа жақын тенденция шегінде болды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Үш камералы әлеуметтік өзара әрекеттесу тестінде Akap11+/S384* тышқандары бастапқы кезде камераларға негізделген әлеуметтену индексінің шекаралық төмендеуін көрсетті (P = 0.054; 1H-сур.). Алайda, үш апталық оқшауланудан кейін бұл айырмашылық маңызды болмай қалды (1H-сур.). Сондай-ақ Akap11+/S384* тышқандары бастапқыда бақылау топтарына қарағанда ойыншық камерасында көбірек уақыт өткізді, бірақ оқшауланудан кейін бұл эффект жоғалды, ал басқа тышқан камерасындағы уақыт және өзара әрекеттесу индексі генотип бойынша өзгеріссіз қалды (SN 1F-сур.). Қорыта айтқанда, Akap11 гетерозиготалы мутанттары мазасыздық және депрессия тәрізді фенотиптермен байланысты болуы мүмкін мінез-құлық тапшылықтарын көрсетеді, кейбір бұзылулар бастапқыда бар болса, басқалары жеңіл созылмалы стресс әсерінен күшейеді.&lt;/p&gt;\n&lt;p&gt;Патогенді Akap11 PTV вариациясымен байланысты молекулалық өзгерістерді анықтау үшін авторлар сенсорлық, медиальды және латеральды &lt;a href=\"concepts/neocortex.html\"&gt;неокортекс&lt;/a&gt; аймақтарынан бір ядролы РНК секвенирлеуін (&lt;a href=\"concepts/snrna-seq.html\"&gt;snRNA-seq&lt;/a&gt;) жүргізді. Экспериментте екі 12 апталық Akap11+/S384* тышқаны және бақылау тобынан бір ұядан шыққан үш Akap11+/+ тышқаны пайдаланылды (2A-Сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бір ядролы РНК секвенирулау (snRNA-seq) — бұл жеке жасушалардың (нақтырақ айтсақ, олардың ядроларының) деңгейінде гендер экспрессиясын талдау әдісі, ол ми сияқты күрделі тіндерді егжей-тегжейлі зерттеуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;94 693 жасуша мен 21 857 генді кластерлеу қабатқа тән глутаматергиялық жасуша түрлеріне, негізгі GABA-эргиялық жасуша түрлеріне және нейрондық емес жасуша түрлеріне сәйкес келетін 33 кластерді анықтады (2B-C-Сурет; SN-Кесте). Тышқан мен адам миы жасушаларының ішіндегі транскрипциялық, морфологиялық және физиологиялық гетерогенділігін ескере отырып, авторлар бұл 33 кластерді 92 кіші түрге бөліп (SN-Кесте), транскрипция өзгерістарін бірнеше ажыратымдылықта бағалады. Жалған жаңалықтар деңгейі (FDR) ≤ 0.05 бойынша генотиптер арасында жасуша құрамында айтарлықтай өзгерістер анықталған жоқ (SN-Сурет; SN-Кесте).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;94 693 жасуша мен 92 кіші түрді талдау мутантты тышқандардың ми қыртысының жасушалық құрамында өзгерістер жоқ екенін көрсетті, бірақ ерекше дифференциалды экспрессияланатын гендерді (DEGs) табуға мүмкіндік берді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сенімді дифференциалды экспрессияланатын гендер (DEGs) pseudobulk тестінде FDR ≤ 0.10 және өзгеріс бағыты сәйкес келетін жалпыланған сызықтық аралас модель (&lt;a href=\"concepts/glmm.html\"&gt;GLMM&lt;/a&gt;) негізіндегі тестіде номиналды P ≤ 0.05 бойынша анықталды (SN-Сурет; Әдістер). Осы критерийлерді қолдана отырып, авторлар 33 жасуша түрі бойынша 28 &lt;a href=\"concepts/gene-expression.html\"&gt;DEG&lt;/a&gt; (SN-Сурет; SN-Кесте) және 92 кіші түр бойынша 61 DEG анықтады (2D-Сурет; SN-Сурет; SN-Кесте).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер Akap11+/S384* гетерозиготалы тышқандарында алынды және адам патологияларының барлық аспектілерін толық қайталамайтын генетикалық модельді көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;92 кіші түрдің арасында соматосталинді (SST) экспрессиялайтын кіші түр ең көп DEG санын қамтыды, олардың барлығы Akap11+/S384* тышқандарында жоғарылады (2D-Сурет; SN-Сурет). Бұл кіші түр басқа SST кластерлерімен салыстырғанда Hpse жоғары экспрессиясын көрсетті, бұл ми қыртысының 4 (L4) және L5a қабаттарындағы Martinotti емес SST интернейрондарына сәйкес келуі мүмкін.&lt;/p&gt;\n&lt;p&gt;Биологиялық процестерді түсіну үшін авторлар Gene Ontology (GO) терминдері мен SynGO жолдарын пайдаланып, 92 кіші түр бойынша сенімді DEG талдауын жасады (2E-Сурет; SN-Сурет; SN-Кесте). Экспрессиясы жоғарылаған DEG синапстарға қатысты GO жолдарын, атап айтқанда «синапс», «постсинаптикалық тығыздық мембранасы» және «синаптический сигналдар» бойынша айтарлықтай байытты (FDR ≤ 0.05; 2E-Сурет). Сонымен қатар, олар постсинаптикалық компартментке немесе жалпы синапс санатына қатысты SynGO жолдарын да байытты (SN-Сурет). Бұдан басқа, жоғарылаған DEG нейрит морфогенезіне қатысты GO терминдері бойынша, атап айтқанда «дендриттік ағаш», «нейрондық проекция», «соматодендриттік компартмент» және «дендриттік омыртқалар мембранасы» бойынша байытылған (2E-Сурет). Экспрессиясы төмендеген (downregulated) DEG GO немесе SynGO терминдері бойынша айтарлықтай байытуды көрсеткен жоқ.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мутантты тышқандарда экспрессиясы жоғарылаған гендер синаптикалық берілуге, постсинаптикалық тығыздық пен дендриттер құрылымына байланысты және психикалық бұзылулардың қауіп факторларымен қиылысады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әрі қарай авторлар Akap11+/S384* тышқандарындағы транскрипциялық өзгерістердің genome-wide association (GWAS) немесе экзомды секвенирлеу (WES) зерттеулері бойынша нейропсихиатриялық бұзылулардың қауіп гендерімен байланысты екенін бағалады (SN-Кесте). Pseudobulk тестінде номиналды маңыздылыққа (P ≤ 5 × 10⁻⁴) және GLMM тестінде (P ≤ 0.05) негізделген кеңейтілген DEG жиынтығы пайдаланылды. Бұл кеңейтілген DEG көңіл-күй мен психотикалық бұзылуларға, соның ішінде үлкен депрессиялық бұзылысқа, биполярлық бұзылысқа және шизофренияға байланысты қауіп гендерінің байытылуын көрсетті (2F-Сурет; SN-Кесте). Бірнеше DEG бірнеше психикалық бұзылуларға қатысты болды, мысалы, аксондардың бағытын басқаратын Netrin-1 рецепторын кодтайтын және биполярлық бұзылыс пен шизофренияға әсер ететін Dcc гені (2F-Сурет). Кеңейтілген DEG сонымен қатар көңіл-күй, психотикалық бұзылулар және даму бұзылуларына қатысты DisGeNET ген жиынтықтарымен де байытылған (SN-Сурет; SN-Кесте).&lt;/p&gt;\n&lt;p&gt;Әрі қарай авторлар ортақ және жасуша типтеріне тән транскрипциялық өзгерістерді талдады. Атап айтқанда, парвальбумин (PV) экспрессиялайтын интернейронның бір кіші түрінде Spon1 генінің төмендегені анықталды (3А-сурет). Spon1 өсінділердің өсуі мен жасуша көші-қоны реттейтін жасушамаңы матриксінің адгезиялық молекуласы F-спондинді кодтайды. Сондай-ақ әртүрлі кортикальды және субкортикальды нысандарды иннервациялайтын терең қабаттың проекциялық нейрондарының төрт кіші түрінде төрт жасушалық адгезия молекуласы гендерінің (Alcam, Cdh12, Nxph1 және Cdh13) бұзылыстары байқалды (3А-сурет). Бұл гендер нейриттердің өсуі мен синапстардың түзілуінде маңызды рөл атқарады, бұл мутантты қыртыста нейрондық проекциялар мен байланыстардың өзгеруін көрсетеді.&lt;/p&gt;\n&lt;p&gt;Сонымен қатар, жетілген олигодендроциттердің екі кіші түрінде (3А-сурет; SN кестесі) және жалпы олигодендроциттер деңгейінде (SN кестесі) Sgk1 деңгейінің жоғарылағаны тіркелді. Sgk1 сарысу және глюкокортикоидпен реттелетін киназа 1-ді кодтайды, ал тышқандарда стресс әсері олигодендроциттердегі Sgk1 экспрессиясын арттырып, олардың морфологиясын өзгертеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;&lt;a href=\"concepts/gsea.html\"&gt;GSEA&lt;/a&gt; — зерттеліп жатқан деректер жиынтығында нақты биологиялық жолдар немесе гендер тобының байытылғанын анықтауға мүмкіндік беретін статистикалық талдау әдісі.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Akap11 PTV әсер еткен биологиялық жолдарды нақтылау үшін авторлар әрбір кіші түр үшін гендер жиынтығын байыту талдауын (GSEA) орындады. Гендер &lt;span class=\"yfm-latex\" data-content=\"-%5Clog_%7B10%7DP%20%20imes%20%20ext%7Bsign%7D(%5Clog_2%20%20ext%7Bfold%20change%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; мәні бойынша реттелді. Перемутациялық тесттің дұрыстығын қамтамасыз ету үшін GSEA экспрессия деңгейі бойынша сүзгіден өткен кемінде 5000 гені бар кластерлер үшін ғана жүргізілді. Барлық кіші түрлер бойынша семантикалық ұқсастық негізінде 40 категорияға топтастырылған 124 GO жолының ортақ және жасуша типіне тән байытылуы немесе сарқылуы байқалды (3B-сурет; SN кестесі; Әдістер).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;snRNA-seq profiling Akap11⁺/S384* тышқандарында синапстық ұйымдасу, жасушалық адгезия және нейрондық проекциялардың бұзылуын көрсетті.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жасушалық адгезияға қатысты GO терминдері Akap11⁺/S384* тышқандарында бір L4/5 интрателенцефальды (IT), екі L6 кортикоталамикалық (CT) және бір L6b кіші түрінде байытылған (3B-сурет). Бұл байытуды қамтамасыз еткен гендер қатарына классикалық кадгерин Cdh12 және атипті кадгериндер Cdh7, Cdh9, Cdh13 және Cdh20 кірді (3C-сурет). Сондай-ақ L4/5 IT, L6 CT және SST нейрон кіші түрлерінде ГАМК-эргиялық сигнализацияға қатысты GO терминдерінің, ал транскарбылық рецепторлық протеинкиназа белсенділігіне қатысты жолдардың L5 пирамидалық тракт (PT), Lamp5 және SST нейрон кіші түрлерінде байытылғаны байқалды (3B-C суреттері).&lt;/p&gt;\n&lt;p&gt;Синапсқа тән SynGO жолдарын пайдаланатын GSEA мутанттың негізінен синапстық гендер жиынтығының жоғарылауымен байланысты екенін көрсетті (3D-сурет; SN кестесі). Кейбір синапстық терминдер нейрондық емес кіші түрлерде де, соның ішінде олигодендроциттер мен астроциттерде де байқалды (3B, D суреттері), бұл кейбір GO терминдерінің бейспецификалық аннотациясымен түсіндірілуі мүмкін [42]. Қорытындылай келе, Akap11⁺/S384* тышқандарының неокортексіне snRNA-seq profiling жасау синапстық ұйымдасу, сигнал беру, жасушалық адгезия және нейрондық проекциялар бойынша гендік және жолдық деңгейдегі транскрипциялық өзгерістерді анықтады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Барлық қорытындылар нақты Akap11 мутациясы бар гетерозиготалы тышқан моделі негізінде алынды, сондықтан оларды адамға қатысты қолданғанда сақтық таныту қажет.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз неокортекстің жалпы протеомы мен фосфопротеомын талдау үшін TMT негізіндегі &lt;a href=\"concepts/zhidkostnaya-hromatografiya-tandemnaya-mass-spektrometriya.html\"&gt;LC-MS/MS&lt;/a&gt; әдісін қолдандық. Зерттеу 12 апталық еркек тышқандарда жүргізілді: 5 Akap11+/S384* және 4 Akap11+/+ (Сурет 4A). Барлығы 8742 ақуыз изоформасы анықталды. Қатаң P мәні шегі (P ≤ 5 × 10⁻⁴) және эффект мөлшері сүзгісін (абсолютті &lt;span class=\"yfm-latex\" data-content=\"%5Clog_2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; өзгеріс ≥ 0,10) қолдана отырып, 12 дифференциалды ақуыз (DAP) анықталды (Сурет 4B; Кесте SN 5A).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun-f4.jpg\" alt=\"4-сурет. Пациенттен алынған Akap11 PTV гетерозиготалы мутантты тышқандардағы қыртыстық протеом мен фосфопротеомды өзгерт\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет. Пациенттен алынған Akap11 PTV гетерозиготалы мутантты тышқандардағы қыртыстық протеом мен фосфопротеомды өзгертеді.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/tmt-mass-spektrometriya.html\"&gt;TMT-масс-спектрометрия&lt;/a&gt; — үлгілерді арнайы химиялық белгілермен таңбалау арқылы мыңдаған ақуыздардың концентрациясын дәл салыстыруға мүмкіндік беретін әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Akap11+/S384* тышқандарында 9 ақуыздың, соның ішінде PKA I типті реттеуші суббірліктері (RIα және RIβ) мен каталитикалық суббірліктерінің (Cα және Cβ) деңгейі жоғарылағаны анықталды (Сурет 4B). Иммуноблот талдауы RIα және RIβ деңгейлері сәйкесінше 69,8% және 36,3%-ға, ал Cα және Cβ 14,5% және 24,3%-ға өскенін растады (r ≥ 0,79; Сурет 4D). PKA II типті реттеуші суббірліктері (RIIα және RIIβ) өзгеріссіз қалды (Сурет 4D). Сондай-ақ Ctnnd1, Sphkap, Slc24a3, Mapt және Dhx9 деңгейлері жоғарылап, Znf787, Dstyk және Lrp11 деңгейлері төмендегені байқалды (Сурет 4B).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Akap11 мутациясы ми қыртысында PKA I типті суббірліктер мен каталитикалық суббірліктердің селективті жинақталуына әкеледі, бұл PKA сигналдық жолының бұзылуын көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жеңілдетілген критериймен (P ≤ 0,01) 117 DAP анықталды. GSEA талдауы 23 санатқа топтастырылған 56 ген онтологиясы (GO) терминін көрсетті (Сурет 4C). «Протеинкиназа А байланысуы», «cAMP/PKA сигнал беруі» және «GPCR сигнал беруі» терминдерінің байытылуы PKA сигнал беру жүйесіндегі дисфункцияны көрсетеді (Сурет 4C; Кесте SN 5C, D). Сонымен қатар, «транс-синапстық сигнал беруді реттеу» және «синапстарды ұйымдастыру» жолдарында өзгерістер байқалды (Сурет 4C, E). Сонымен қатар, миелин қабығы, биомолекулалар алмасуы және митохондриялық процестермен байланысты жолдардың төмендеуі тіркелді (Сурет 4C; Сурет SN 3A-B).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тышқан моделінде жүргізілгендіктен, протеомдағы өзгерістер адамдардағы психиатриялық аурулардың патофизиологиясын толық көрсетпеуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Пациенттерден алынған Akap11 PTV мутациясы I типті PKA реттеуші суббірліктерінің RIα/β және каталитикалық суббірліктерінің Cα/β ақуыз деңгейін таңдамалы түрде арттырды. PKA изоформалары мөлшерінің өзгеруі PKA-ға тәуелді фосфорлануға әсер етуі мүмкін екендігін ескере отырып, авторлар Akap11⁺/S384* тышқандарының неокортексінде жалпы фосфопротеомдық ландшафт пен PKA киназа белсенділігі қалай өзгеретінін зерттеді (4F сурет, S6A кесте). LC-MS/MS деректерінің фосформен байытылған фракцияларынан анықталған 10709 фосфосайттың 9-ы мутантты тышқандарда айтарлықтай ерекшеленді (P ≤ 5 × 10⁻⁴ және абсолютті &lt;span class=\"yfm-latex\" data-content=\"%5Clog_2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; өзгеру еселігі ≥ 0.10; 7-еуі өсті, 2-еуі азайды). Қатаң емес шекті мән кезінде (P ≤ 0.01 және абсолютті &lt;span class=\"yfm-latex\" data-content=\"%5Clog_2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; өзгеру еселігі ≥ 0.10) 325 дифференциалды фосфосайт анықталды, оның 164-і өсіп, 161-і азайды (4F сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Akap11 мутациясы бар тышқандарда ақуыздардың фосфорлануы ауқымды түрде өзгеретіні және синапстық әрі көпіршікті жолдардың бұзылуымен қатар PKA киназа белсенділігінің айтарлықтай төмендейтіні анықталды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жалпы протеомдағы 12 ақуыздың арасында (4B сурет) Prkar1a^S83 (P ≤ 5 × 10⁻⁴), сондай-ақ Prkar1a^S77, Prkacb^S339 және Sphkap^S1171 (P ≤ 0.01) деңгейлерінің өскені байқалды, ал Sphkap^S50 және Ctnnd1^S346 фосфорлануы төмендеді (P ≤ 0.01, 4F сурет). PKA RIα ақуызының консервативті S83 және S77 сайттарында фосфорлануы RIα-ның Cα-мен байланысуын күшейтеді және PKA белсенділігін тежейді [51]. Осыған сүйене отырып, авторлар Akap11⁺/S384* тышқандарында PKA белсенділігі төмендейді деген болжам жасады. Бұл гипотезаны тексеру үшін киназа белсенділігі PhosphoSitePlus [52] және Signor [53] деректер базасындағы субстраттардың фосфорлану күйі арқылы бағаланды. Z-тестке негізделген әдіс [54] арқылы 66 қиылысатын субстрат бойынша Akap11⁺/S384* тышқандарында PKA (PKACA) киназа белсенділігінің айтарлықтай төмендегені анықталды (4H сурет; S3D сурет; S6B-C кестелері). PKA белсенділігінің төмендеу тренді басқа киназа-субстрат базасы (PTMsigDB) [55] және аналитикалық рангке негізделген байыту талдауы мен ауыстырып қосу тесті арқылы да байқалды (P = 0.057; S3C сурет; S6D кесте).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GSEA (гендер жиынтығын байытуды талдау) — алдын ала анықталған гендер немесе ақуыздар топтарының зерттелетін деректердегі биологиялық үдерістермен немесе патологиялармен байланысын анықтайтын биоинформатикалық әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сонымен қатар, PKA/PKG/PKC топтарындағы (AGC) үш киназаның, кальций/кальмодулинге тәуелді протеинкиназалар (CAMK) тобындағы үшеуінің, STE7/STE11/STE20 (STE) тобындағы екеуінің және тирозинкиназа (TK) тобындағы біреуінің белсенділігі төмендеді (4H сурет). GSEA талдауы миелин қабығы жолы фосфорлану деңгейі төмен фосфосайттары бар ақуыздармен байланысты екенін көрсетті (S3G сурет; S6E кесте). Akap11⁺/S384* тышқандарындағы фосфорлану жылдамдығының өзгеруін анықтау үшін фосфосайттардың мөлшері тиісті жалпы протеом мөлшеріне қатысты нормасталды. 9565 фосфосайттың ішінде 4 сайттың фосфорлану жылдамдығы өзгерген (P ≤ 5 × 10⁻⁴ және абсолютті &lt;span class=\"yfm-latex\" data-content=\"%5Clog_2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; еселігі ≥ 0.10; 4G сурет; S6F кесте). Қатаң емес шекті мән кезінде (P ≤ 0.01 және абсолютті &lt;span class=\"yfm-latex\" data-content=\"%5Clog_2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; еселігі ≥ 0.10) 263 фосфосайттың фосфорлану жылдамдығы өзгерген (4G сурет). AKAP Sphkap ақуызының фосфорлану жылдамдығы S50 сайтында төмендеді (4G сурет), ал Sphkap ақуызының өзінің мөлшері артқан болатын (4B сурет); Ctnnd1 бес сайтта фосфорлану жылдамдығының төмендеуін көрсетсе, Dstyk бір сайтта өсуін көрсетті (4G сурет). Киназа-субстрат талдауы PKA (PKACA) белсенділігінің төмендегенін көрсетті (4I сурет; S3E-F суреттері; S6G-I кестелері).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Барлық негізгі тұжырымдар гетерозиготалы мутантты тышқандар моделінде алынды, сондықтан нәтижелерді адамның молекулалық патологиясына тікелей экстраполяциялау кезінде сақтық таныту қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Фосфорлану жылдамдығының өзгеруіне байланысты биологиялық жолдарды анықтау үшін GSEA орындалды. Синапс құрылымы мен қызметіне қатысты GO терминдері («пресинапс», «постсинапстық мамандану», «глутаматергиялық синапс» және «постсинапстық маманданудың ұйымдасуы») Akap11⁺/S384* тышқандарында фосфорлану жылдамдығы төмен фосфосайттары бар ақуыздармен байланысты болды (4J сурет; S6J кесте). Осыған сәйкес, SynGO жолдарын талдау фосфорлану жылдамдығы төмен фосфосайттар арасында синапстық жолдардың байығанын көрсетті (S3H сурет; S6K кесте). Ctnnd1 және Prune2 ақуыздары синапсқа қатысты жолдарға негізгі үлес қосушылар қатарында болды (S6K кесте). GO-ның «дендриттік ағаш» жолы да фосфорлану жылдамдығы төмен фосфосайттары бар ақуыздармен байланысты екені анықталды (4J сурет). Осылайша, синапстар мен нейрондық өсінділерге қатысты үдерістер Akap11⁺/S384* тышқандары неокортексінің транскриптомында, протеомында және фосфопротеомында бұзылған ортақ бағыттар ретінде көрінді. Сонымен қатар, көпіршіктерге қатысты жолдар («көпіршік мембранасы», «қапталған көпіршік» және «синапстағы көпіршік арқылы тасымалдау») фосфорлану жылдамдығы төмен ақуыздар арасында байытылған (4J сурет).&lt;/p&gt;\n&lt;p&gt;Біздің протеомикалық талдауымыз гетерозиготты мутантты тышқандардың неокортексінде протеинкиназа A (PKA) реттеуші суббірліктерінің II түрі емес, I түрінің, сондай-ақ PKA каталитикалық суббірліктерінің таңдамалы түрде жоғарылаған экспрессиясын көрсетті (4-сур.). Бұл өзгерістер болжамды PKA субстраттарының фосфорлануының төмендеуімен бірге жүрді (4-сур.), бұл PKA сигнализациясындағы ықтимал бұзылуларды көрсетеді. Эмбриональды дамудың 16.5-ші күнінде (E16.5) Akap11+/S384* эмбриондарынан алынған қыртыстық нейрондар in vitro (DIV) 21-22 күндерінде Akap11+/+ нейрондарына қарағанда күшейген PKA RIα иммунореактивтілігін көрсетті (5A-B-сур.). PKA киназалық белсенділігін тікелей бағалау үшін біз E16.5 Akap11+/S384* және Akap11+/+ эмбриондарының өсірілген қыртыстық нейрондарында Camk2a промоторының бақылауымен қоздыру-ратиометриялық PKA сенсорын ExRai-AKAR2 экспрессияладық (5C-D-сур.).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ExRai-AKAR2 ратиометриялық сенсоры екі толқын ұзындығындағы флуоресценция қарқындылығының өзгеруі арқылы PKA ферментінің белсенділігін нақты уақыт режимінде өлшеуге мүмкіндік беретін генетикалық құрал болып табылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз Akap11+/+ нейрондарында аденилатциклаза стимуляторы форсколин мен фосфодиэстераза-4 тежегіші ролипрамды, сондай-ақ қуатты PKA тежегіші H-89-ды қосу арқылы PKA сенсорының ерекшелігі мен екі бағытты сезімталдығын растадық (SN 4A-B-сур.). DIV22 қыртыстық қоздырғыш нейрондарында F₄₈₈/F₄₀₅ қоздыру қатынасымен көрсетілгендей, бастапқы деңгейде Akap11+/S384* нейрондарында Akap11+/+ нейрондарымен салыстырғанда PKA белсенділігінің шамалы төмендеуі байқалды (P = 0.075; 5E-сур.). Стимул тудырған PKA белсенділігі Δ R / R₀ ретінде бағаланды, мұндағы R = F₄₈₈/F₄₀₅, R₀ бірінші бастапқы уақыт нүктесіндегі қатынас, ал Δ R — R₀-ге қатысты R-дің өзгеруі. Форсколинмен (25 мкм) және ролипраммен (2 мкм) 3 минут бойы стимуляциялау Akap11+/+ нейрондарында PKA белсенділігін арттырды, ал Akap11+/S384* нейрондарында бұл жауап әлсіреді.&lt;/p&gt;\n&lt;p&gt;Атап айтқанда, форсколин мен ролипрам орташа Δ R / R₀ көрсеткішін Akap11+/+ нейрондарында шамамен 2.30 есеге, ал Akap11+/S384* нейрондарында тек 0.80 есеге арттырды (5E-сур.). Осылайша, фосфопротеомдық талдаудағы PKA-ға тәуелді фосфорланудың азаюына сәйкес, Akap11+/S384* тышқандарының қыртыстық қоздырғыш нейрондарында стимулға тәуелді PKA белсенділігі функционалды түрде бұзылған.&lt;/p&gt;\n&lt;p&gt;Akap11+/S384* тышқандарының қыртыстық транскриптомында, протеомында және фосфопротеомында нейрон өсінділері мен нейрит морфогенезіне қатысты молекулалар мен биологиялық жолдардың дисрегуляциясы қайталанатын тақырып ретінде пайда болды және біз мутантта белсенділікке тәуелді PKA сигнализациясының әлсірегенін байқадық (2-5-сур.). PKA өсу конустарының бағытталуы мен дендриттердің ұзаруында маңызды рөл атқарады [58, 59]. Сондықтан біз пациенттен алынған Akap11 геніндегі PTV (ақуызды тоқтататын мутация) қыртыстық нейрондарда нейриттердің дамуын бұзады деген болжам жасадық. Бұл болжамды тексеру үшін біз E16.5 Akap11+/+ және Akap11+/S384* эмбриондарынан алынған қыртыстық нейрондарды аз тығыздықта өсіріп, DIV6-да нейриттердің морфологиясына талдау жасадық. Бастапқы аксондар Tau-1-попозитивті/MAP2-позитивті процестер ретінде, ал дендриттер Tau-1-негативті/MAP2-позитивті процестер ретінде анықталды.&lt;/p&gt;\n&lt;p&gt;Сома алаңы, дендриттік ағаштардың саны және бірінші реттік аксонның ұзындығы генотиптер арасында ерекшеленген жоқ (6A-B-сур.). Керісінше, Akap11+/S384* нейрондары орташа дендрит ұзындығының айтарлықтай қысқарғанын көрсетті (Akap11+/+ нейрондары: 55.68 мкм, Akap11+/S384* нейрондары: 40.05 мкм; 6A-B-сур.), бұл Akap11 PTV мутациясының дамып келе жатқан қыртыстық нейрондарда ерте дендрит өсуін нашарлататынын көрсетеді.&lt;/p&gt;\n&lt;p&gt;Жақында жүргізілген экзомды толық секвенирлеу зерттеулері биполярлық бұзылыспен немесе шизофрениямен байланысты өте сирек кездесетін протеинді қысқартатын варианттарды (PTV) анықтады [10, 11], бірақ бұл варианттардың аурудың патогенезіне қалай әсер ететіні әлі де түсініксіз күйінде қалуда. Бұл жұмыста авторлар биполярлық бұзылысы бар пациенттен анықталған AKAP11 геніндегі өте сирек кездесетін PTV-ға назар аударып, гомологиялық варианты бар тышқан моделін жасады. Гетерозиготалы мутантты тышқандарда бұл вариант Akap11 мРНК деңгейін шамамен 50% төмендетті және Akap11 ақуызының мөлшерін азайтты. Гомозиготалы мутантты тышқандарда бұл вариант анықталатын тұрақты жаңа Akap11 мРНК изоформаларын түзбеді. Осы зерттеу бұрынғы Akap11 нокауттық (KO) модельдерінің нәтижелерін бірнеше маңызды бағытта кеңейтеді. Біріншіден, клиникалық тұрғыдан байқалған бір нуклеотидті PTV-ны модельдеу арқылы авторлар варианттың бір көшірмесі экзондары жойылған бұрынғы Akap11 функциясын жоғалту модельдеріне сәйкес келетін мінез-құлық ауытқулары мен протеинкиназа A (PKA) дисрегуляциясын тудыруға жеткілікті екенін көрсетті. Екіншіден, протеомдық және транскриптомдық талдаулар синапстар мен нейрон өсінділеріне қатысты жолдардағы ұқсас өзгерістерді анықтады. Үшіншіден, функционалдық талдаулар қыртыстық нейрондарда ынталандыруға тәуелді PKA сигналдық жолының әлсірегенін және морфогенездің бұзылғанын көрсетіп, терапиялық маңызы болуы мүмкін ықтимал механикалық жолдарды атап өтті.&lt;/p&gt;\n&lt;p&gt;Гетерозиготалы мутантты тышқандарда ашық алаң тестінде тік белсенділіктің (рейрингтің) тапшылығы және бастапқы деңгейде әлеуметтік белсенділіктің нашарлауы байқалды. Үш апта бойы жеке ұстау көтерілген крест тәрізді лабиринтте ашық тармақтардағы белсенділіктің қосымша төмендеуін тудырды (1-сурет). Осы көрсеткіштердегі ауытқулар кеміргіштердегі мазасыздық және депрессия тәрізді фенотиптермен байланысты [60–63]. Біздің нәтижелеріміз экзон делециясы бар гетерозиготалы Akap11 KO модельдерінің бұрынғы деректерімен сәйкес келді, олар ашық алаңдағы рейрингтің азайғанын, сахарозаны қалаудың төмендегенін, құйрықтан ілу тестінде қозғалмаушылықтың артқанын, крест тәрізді лабиринттің ашық тармақтарындағы белсенділіктің азайғанын және жарық қорапшасына кірулер санының азайғанын көрсетті [20, 21]. Алайда, біздің моделіміз де, бұрынғы KO модельдері де (гомозиготалы немесе гетерозиготалы) гиперактивтік және мазасыздықтың төмендеуі сияқты манияға ұқсайтын айқын мінез-құлық реакцияларын көрсетпеді [64, 65]. Осылайша, Akap11 функциясының жоғалуы мазасыздық пен депрессияға байланысты мінез-құлық ауытқуларын тудыру үшін жеткілікті болуы мүмкін, бірақ ықтимал қосымша полигендік және орта факторларын қажет ететін биполярлық бұзылыстың толық мінез-құлық спектрін қамту үшін жеткіліксіз [66, 67].&lt;/p&gt;\n&lt;p&gt;Akap11 және PKA суббірліктерінің ақуыз экспрессиясындағы өзгерістер бойынша біздің нәтижелеріміз бен гетерозиготалы KO модельдерін қолданған бұрынғы зерттеу арасында қайшылықтар бар. Авторлар 12 апталық жаста төрт қыртыстық және субқыртықтық аймақтарда Akap11 ақуыз экспрессиясының төмендегенін тіркеді (1D-сурет). Керісінше, Song және әріптестері [20] Akap11 6–7 экзон делециясы бар тышқандарды пайдалана отырып, гомозиготалы KO-да ми қыртысының лизаттарында Akap11-дің азайғанын, бірақ гетерозиготалы KO-да иммуноблоттар бойынша тұрақсыз өзгерістерді көрсетті. Сол сияқты, біз I типті PKA реттеуші суббірліктері RIα мен RIβ, сондай-ақ каталитикалық суббірліктер Cα мен Cβ-ның таңдамалы түрде жоғарылағанын байқадық. Бұл деректер Song және әріптестерінің [20] гомозиготалы KO-дағы PKA суббірліктерінің өзгерістеріне сәйкес келеді, бірақ олардың гетерозиготалы KO нәтижелерінен өзгеше, мұнда RIα мен Cα-ның жоғарылауы сенімді түрде анықталмаған болатын. Ықтимал техникалық түсіндірмелер ретінде басқа статистикалық тесттерді қолдану және Song және әріптестерінің [20] жұмысында β-актинді жүктеу бақылауы ретінде пайдалануы жатады. AKAP11 пен PKA актинді цитоқаңқамен әрекеттесетіні және оны реттейтіні көрсетілгендіктен [68], β-актин бойынша нормалау Akap11 мен PKA суббірліктерінің мөлшеріндегі өзгерістерді жасырып тастауы мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Akap11 геніндегі адамнан алынған PTV мутациясы ақуыз мөлшерін екі есе азайтады, мазасыздық пен депрессияға ұқсас мінез-құлықты тудырады және PKA сигнал беру жолдарын бұзады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Екінші жағынан, гетерозиготалы KO-да I типті PKA реттеуші суббірліктері мен каталитикалық суббірліктерінің көбейгенін көрсеткен Song және әріптестерінің [20] синаптикалық фракциялардағы протеомдық нәтижелерін кеңейте отырып, біздің деректеріміз адамнан алынған Akap11 PTV тасымалдайтын гетерозиготалы мутантты тышқандардың ми қыртысының жалпы лизаттарында осы суббірліктердің жоғарылағанын қосымша көрсетті. Осылайша, адамнан алынған Akap11-дегі PTV гетерозиготалы күйде Akap11 ақуызының мөлшерін азайтуға және нақты PKA суббірліктерінің экспрессиясын өзгертуге жеткілікті екендігі дәлелденді.&lt;/p&gt;\n&lt;p&gt;In vitro PKA субстратын фосфорлану талдауларын пайдалана отырып, Akap11 KO модельдерінің бұрынғы зерттеулері гомозиготалы KO-да синаптикалық фракциядағы базалық PKA белсенділігінің артқанын дәйекті түрде хабарлады, ал цитозольдік фракциядағы немесе жалпы лизаттағы өзгерістер, әсіресе гетерозиготалы KO-да, онша тұрақты болмады [19, 20]. Сонымен қатар, бұл талдаулар негізінен конститутивті PKA белсенділігін өлшеді, бұл жасушалық контексттегі ынталандыруға тәуелді PKA динамикасын белгісіз қалдырды. Мұнда мәдениетте өсірілген ми қыртысының қоздырғыш нейрондарының сомасындағы PKA сенсорының уақыт бойынша флуоресценттік бейнелеу әдісін қолдана отырып, авторлар гетерозиготалы мутантты нейронда базалық PKA белсенділігінің төмендеу тенденциясын және форсколинмен/ролипраммен ынталандырған кезде PKA активациясының әлсірегенін көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/datchik-pka.html\"&gt;PKA сенсоры&lt;/a&gt; — бұл тірі жасушалар ішінде ферменттің белсенділік деңгейін нақты уақыт режимінде бақылауға мүмкіндік беретін флуоресцентті белгісі бар генетикалық кодталған молекулалық құрал.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ынталандыруға тәуелді PKA сигналдары синаптикалық ақуыздарды, соның ішінде глутамат рецепторларын фосфорлау, тасымалдау және белсендіру, сондай-ақ нейромедиаторлардың бөлінуі және cAMP сезгіш элементті байланыстыратын ақуызға (CREB) тәуелді гендердің экспрессиясы арқылы нейрондық пластичностьты реттейді [69, 70]. Осылайша, ынталандыруға тәуелді PKA сигналдарының бұзылуы синаптикалық пластичностьты әлсіретіп, ұзақ мерзімді потенциацияға (LTP), оқуға және есте сақтауға әсер етуі мүмкін. Бұл гипотезаға сәйкес, LTP тәрізді қыртыстық пластичностьтың бұзылуы шизофрениямен және көңіл-күй бұзылыстарымен байланыстырылды [71, 72]. Авторлар сондай-ақ Song және әріптестерінің [20] жұмысында гомозиготалы KO стриатумында in vivo FLIM негізіндегі PKA сенсорының жазбалары базалық PKA белсенділігінің жоғарылағанын және D1 немесе D2 рецепторларының антагонистеріне жауап шамасының күшейгенін көрсеткенін атап өтеді. Гетерозиготалы KO-да базалық немесе туындаған PKA белсенділігінде ешқандай өзгерістер байқалмады [20]. Біздің нәтижелеріміз арасындағы қайшылық стриатум мен қыртыстағы жасуша түріне тән PKA динамикасына байланысты болуы мүмкін [73, 74]. Сонымен қатар, D1/D2 рецепторлары антагонисінің жүйелі түрде енгізілуі ми аймақтары бойынша D1/D2 рецепторларының кең таралуына байланысты әртүрлі жасуша түрлері мен тізбектерін қамтуы мүмкін [75].&lt;/p&gt;\n&lt;p&gt;Керісінше, мәдениетте өсірілген ми қыртысының қоздырғыш нейрондарында PKA сенсорын экспрессиялау және форсколин мен ролипрамды қолдану арқылы біздің нәтижелеріміз PKA динамикасындағы өзгерістердің жасуша түріне тән, тікелей оқылуын қамтамасыз етеді. Зерттеуіміздің шектеуі сонда, сомаға бағытталған PKA сенсорын бейнелеу синапстардағы немесе нейрондық өсінділердегі PKA динамикасы туралы ақпарат бермеді. Қазіргі уақытта қол жетімді PKA сенсорлары [57, 76] сондай-ақ болашақ зерттеулерде PKA RIα-Cα &lt;a href=\"concepts/dissotsiatsiya.html\"&gt;диссоциация&lt;/a&gt; динамикасының тікелей талдауларын талап ететін изоформаға тән PKA сигналдарын ажыратпайды.&lt;/p&gt;\n&lt;p&gt;Қорытындылай келе, біздің нәтижелеріміз адамнан алынған гетерозиготалы өте сирек кездесетін PTV Akap11-де психикалық бұзылыстардың негізгі аспектілерін еске түсіретін мінез-құлық фенотиптеріне әкелетінін және қыртыстық нейрондарда ынталандыруға тәуелді PKA сигналдарының бұзылуы мен морфогенездің бұзылуының қосымша дәлелдерімен бірге бұрын функцияны жоғалту модельдерінде байқалған молекулалық өзгерістерді қайталайтынын көрсетеді. Бұл деректер Akap11 гапложеткіліксіздігін ықтимал патогендік механизм ретінде қолдайды. Психикалық бұзылыстары бар пациенттердегі de novo және өте сирек кездесетін кодтаушы варианттар гетерозиготалы күйде әрекет етеді деп болжанатынын ескерсек [23, 24], бұл генетикалық тұрғыдан нақты модель сирек кодтаушы варианттардың психикалық бұзылыстардың негізінде қалай жататынын зерттеу үшін клиникалық маңызы бар жүйені қамтамасыз етеді.&lt;/p&gt;\n&lt;p&gt;Геннің рөлін зерттеу үшін авторлар CRISPR/Cas9 технологиясы мен гомологиялық рекомбинация көмегімен C57BL/6J генетикалық фонында гетерозиготалы Akap11⁺/S384* нокаутты тышқандар желісін жасап шығарды. Модификация дизайнын авторлар әзірледі, ал тышқандарды алу қызметін Shanghai Model Organisms атқарды (зиготаларға Cas9 ақуызын, бағыттаушы sgRNA және бір тізбекті мутантты олигоДНК енгізу арқылы). ДНК матрицасы Akap11 (ENSMUST00000123853) геніндегі c.1151C&amp;gt;A (p.Ser384*) мутациясын қамтыды, ол BipEx деректер базасындағы адамның AKAP11 PTV (chr13-42299894C&amp;gt;A) нұсқасына гомологиялық және ENST00000025301 изоформасындағы c.1148C&amp;gt;A (p.Ser383*) алмасуын кодтайды. F0 негізін қалаушылар нысаналы локусты ПЦР арқылы амплификациялау және Сэнгер секвенирлеу арқылы іріктелді. Дұрыс өзгертілген аналық C57BL/6J жабайы типті тышқандармен шағылыстырылды. Эксперименттік жануарлардың генотипі ПЦР және Сэнгер секвенирлеуімен немесе нақты уақыт режиміндегі ПЦР көмегімен анықталды. Барлық пайдаланылған жануарлар F2 буданының бір гетерозиготалы аталық тышқанынан тарады, ал тәжірибелер F4 және одан кейінгі буын дарақтарында жүргізілді (праймерлер SN-кестеде берілген). CRISPR/Cas9 мақсатсыз әсерлерін болдырмау үшін gRNA тізбегі Synthego CRISPR design tool құралы арқылы талданып, скрининг үшін үздік бес сайт таңдалды. OT-F/OT-R праймерлері мен Vazyme master-mixt көмегімен әрбір потенциалды сайтты қамтитын 400–600 б. ж. аймақтар амплификацияланды, содан кейін &lt;a href=\"concepts/sekvenirovanie-po-sengeru.html\"&gt;Сэнгер секвенирлеуі&lt;/a&gt; арқылы болжанған мақсатсыз сайттарда инделдердің жоқтығы расталды. Жануарларды ұстау Джонс Хопкинс университетінің Жануарларды күту және пайдалану жөніндегі комитетінің хаттамаларына және NIH нұсқауларына сәйкес жүзеге асырылды. Мінез-құлық тесттері мен нейрондық культуралардан басқа барлық тәжірибелер үшін аталық тышқандар 12 сағат жарық/12 сағат қараңғылық циклінде қапаста 3–5 басқа бөлініп ұсталды, су мен азық шектеусіз берілді. Тндер 12 апталық жануарлардан қараңғы фазада алынды. Бастапқы нейрондық культуралар екі жыныстағы E16.5 эмбриондарынан дайындалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;CRISPR/Cas9 — бұл арнайы ақуыз бен РНК көмегімен ДНК-ны дәл өңдеу әдісі, ал Сэнгер секвенирлеуі — нуклеотидтер тізбегін дәл оқудың классикалық әдісі.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жануарлардың мінез-құлқын бағалау үшін аталық тышқандар теңдестірілген генотиптер бойынша әр қапасқа төрт басқа бөлініп отырғызылды және мінез-құлық тесттеріне дейін кемінде екі апта бұрын кері күн/түн цикліне ауыстырылды. Бастапқы тестілеу 12 апталық жасында жүргізілді, содан кейін тышқандар үш апта бойы қоршаған ортаны байытусыз жеке ұсталып (әлеуметтік оқшаулану стресс моделі), соңынан тесттер қайталанды. Барлық тексерулер қараңғы фазада, қызыл жарық диодты жарықтандыру астында өтті, сынақ алдында жануарлар бөлмеге 30 минуттан 1 сағатқа дейін бейімделді. «Ашық алаң» тестінде әр тышқан инфрақызыл датчиктері бар камераның ортасына орналастырылды (San Diego Instruments), көлденең және тік қозғалыстар қараңғыда 2 сағат бойы 5 минуттық интервалдармен тіркелді. «Көтеріңкі крест тәрізді лабиринт» тестінде жануар лабиринтті 5 минут бойы зерттеді, ашық, жабық және орталық аймақтардағы қозғалыстар ANY-maze бағдарламасы (7.65 нұсқасы) арқылы бақыланды. Үш камералы әлеуметтік өзара әрекеттесу тестінде ([78] хаттамасына өзгерістер енгізіле отырып) үйрету фазасында тышқан бос ыдыстарды 6 минут бойы зерттеді. Сынақ фазасында бір ыдыстың астына бейтаныс Akap11⁺/+ аталық тышқан, ал екіншісіне ойыншық тышқан қойылды. Сыналушы тышқан 10 минут бойы еркін зерттеді, процесс видеоға түсірілді. Генотипті білмейтін зерттеуші келесі көрсеткіштерді қолмен бағалады: камераларда өткізген уақыт (T\textmouse chamber, T\texttoy chamber — денесінің кем дегенде 50%-ы камера ішінде болуы) және белсенді қарым-қатынас уақыты (T\textmouse, T\texttoy). Камералар бойынша әлеуметтік индекс \textSI\textchamber = T\textmouse chamber / T\texttoy chamber және қарым-қатынас индексі \textSI\textinteraction = T\textmouse / T\texttoy формулалары бойынша есептелді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Барлық мінез-құлық тесттері мен тндерді жинау тек оқшаулану стресс жағдайындағы аталықтарда жүргізілгенін нәтижелерді аналықтарға және басқа жағдайларға таратқан кезде ескеру қажет.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Биологиялық материалды алу үшін тышқандарға изофлюранмен анестезия жасалып, артынша 10 мл салқындатылған, нуклеазалардан таза 1X PBS ерітіндісімен жүрек арқылы перфузия жасалды. Кері транскрипция арқылы сандық ПТР және ұзын ридті РНК секвенирлеу үшін мидың көру айқасуынан алдыңғы бөлігі салқындатылған матрица көмегімен 1.5 мм коронарлы кесінділерге кесіліп, соматосенсорлық қыртыс жылдам бөлініп алынды да, құрғақ мұзда лезде қатырылды. Бірлік ядролардың транскриптомын талдау үшін неокортекс субкортикалық құрылымдардан бөлініп, сенсорлық аймақтар (соматосенсорлық, көру және есту қыртыстары), медиальды аймақ (ретроспленальды аймақ) және латеральды аймақтар (самай ассоциативті, экторинальды және перинарильды аймақтар) жиналып, құрғақ мұзда қатырылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Перфузия — зерттеу алдында тіндерді қаннан тазарту үшін лабороториялық жануардың тамыр жүйесін арнайы буфермен шаю үдерісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;RT-qPCR талдауы үшін үш Akap11+/S384* және төрт Akap11+/+ бақылау тобындағы еркек тышқандардың (12 апталық) қыртыс тіндері пайдаланылды. Тіндер BeadBug гомогенизаторы көмегімен TRIzol реагентінде гомогенизацияланды, содан кейін өндіруші нұсқаулығына сай Direct-zol RNA Miniprep жиынтығы арқылы РНК тазартылды. Жалпы РНК-ның кері транскрипциясы HiScript IV RT SuperMix for qPCR (+gDNA wiper) жиынтығы арқылы жүзеге асырылды. ПТР амплификациясы Taq Pro Universal SYBR qPCR Master Mix көмегімен QuantStudio 12K Flex жүйесінде орындалды. Akap11 және референстік гендерге арналған праймерлер тізімі Supplementary Table 1C кестесінде көрсетілген.&lt;/p&gt;\n&lt;p&gt;Толық ұзындықтағы РНК секвенирлеуі үш гомозиготты мутантты (Akap11S384*/S384*) және үш бақылау (Akap11+/+) тышқанының (еркек, 12 апталық) қыртыс тіндері негізінде Admera Health компаниясы тарапынан орындалды. Тоталды РНК RNeasy жиынтықтары арқылы бөлініп алынды, ал оның сапасы Tapestation жүйесіндегі High Sensitivity RNA ScreenTape Assay тесті арқылы бағаланып, AccuBlue Broad Range RNA Quantitation талдауымен анықталды. Толық ұзындықтағы кДНК кітапханалары Kinnex full-length RNA жиынтығы мен Iso-Seq Express 2.0 жүйесі арқылы 450 нг РНК көмегімен дайындалды. Әр генотип үшін 18.3 нг баркодталған кДНК сегіз параллель Kinnex ПТР реакциясы үшін біріктіріліп, ядролық өңдеу және SMRTbell кітапханасын дайындау жұмыстары жүргізілді. Кітапхана сапасы Genomic DNA ScreenTape арқылы тексеріліп, мөлшері Qubit 2.0 көмегімен өлшенді. Секвенирлеу Revio жүйесіндегі бір SMRTCell ячейкасында жүзеге асырылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Барлық тәжірибелер белгілі бір жастағы еркек тышқандардың шағын таңдамасында жүргізілгенін ескеру қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бірлік ядролардың РНК секвенирлеуі үшін екі Akap11+/S384* тышқаны және үш бақылау тобындағы туыстас тышқандар (Akap11+/+, еркек, 12 апталық) пайдаланылды. Тіндерді диссоциациялау және ядроларды бөліп алу жұмыстары Admera Health компаниясы тарапынан ядроларды экстракциялау буфери мен gentleMACS диссоциаторы көмегімен орындалды. Ядролар жуылып, 0.04% BSA қосылған PBS ерітіндісінде қайта суспензияланды. Ядролардың концентрациясы мен сапасы Cellometer Auto 2000 құрылғысында акридин сарысы және пропидий иодиді бояулары арқылы бағаланды. Ядролық 3’ ген экспрессиясы кітапханалары Chromium GEM-X Single Cell 3’ Kit v4 жиынтығы көмегімен дайындалды. Әр үлгі үшін 30000 ядро Chromium X құрылғысына жүктелді. Кері транскрипциядан кейін кДНК біріктіріліп, тазартылып, амплификацияланды. Кітапхана сапасы High Sensitivity D5000 ScreenTape арқылы тексеріліп, Qubit 2.0 көмегімен анықталды. Кітапханалар NovaSeq X Plus жүйесінде жұптық оқу конфигурациясында секвенирленді.&lt;/p&gt;\n&lt;p&gt;Вестерн-блоттинг талдауын жүргізу үшін авторлар барлығы 12 аталық тышқанды пайдаланды: олардың алтеуі Akap11⁺/S384* генотипіне ие болды, ал қалған алтеуі 12 апталық Akap11⁺/+ жабайы типтегі бақылау тышқандары еді. Жануарлар 300–500 мкл изофлуранмен терең наркозға түсіріліп, бас миы бас сүйегінен алынды. Алдын ала салқындатылған кемірушілердің ми матрицасын қолдана отырып, мидың алдыңғы бөлігі (көру айқасынан ростральды) 1.5 мм коронарлық кесінділерге кесілді. Стереомикроскоп астында бұл кесінділерден соматосенсорлық қыртыс, префронтальды қыртыс және стриатум жылдам бөлініп алынды, ал гиппокамп қалған каудальды тіннен бөлінді. Тін үлгілері құрғақ мұзда бірден мұздатылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Вестерн-блоттинг — бұл ақуыздарды электр өрісі арқылы өлшемі бойынша бөлуге, содан кейін арнайы антиденелерді қолдана отырып тіндегі нақты ақуыздың мөлшерін дәл өлшеуге мүмкіндік беретін зертханалық талдау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тіндерді гомогенизациялау процесі протеаз тежегіштері мен спецификалық фосфатаза тежегіштері қосылған RIPA буферінде пластикалық пестик көмегімен жүзеге асырылды. Ақуыз концентрациясы Pierce BCA Protein Assay Kit жиынтығы арқылы өлшенді. Әрбір шұңқырға 30 мкг жалпы ақуыз салынып, 4–20% Bis-Tris гельдерінде Tris-MOPS-SDS жүгіру буфері көмегімен электрофорез жасалды. Ақуыздар 0.45 мкм төмен флуоресцентті PVDF мембранасына ауыстырылды. Мембраналарды блокталғаны және антиденелермен инкубациялау үшін арнайы буферлік ерітінділер пайдаланылды.&lt;/p&gt;\n&lt;p&gt;Біріншілік антиденелермен 4 °C температурада түні бойы ақырын шайқау арқылы инкубация жүргізілді, ал екіншілік антиденелер бөлме температурасында 1–2 сағат бойы ұсталды. Нәтижелерді визуализациялау және сандық бағалау үшін LI-COR Odyssey Fc Imager жүйесі мен Image Studio бағдарламасының 5.2.5 нұсқасы қолданылды. Зерттеуде келесі біріншілік антиденелер пайдаланылды: қоянның анти-AKAP11, анти-PKA RIα, анти-PKA Cα, анти-PKA Cβ, қойдың анти-PKA RIβ, тышқанның анти-PKA RIIα, анти-PKA RIIβ, сонымен қатар бақылау ретінде GAPDH антиденелері. Екіншілік антидене ретінде хрен пероксидазасымен (HRP) және IR700 пен IR800 флуорофорларымен конъюгацияланған түрлері қолданылды.&lt;/p&gt;\n&lt;p&gt;DIV4 пен DIV6 аралығында pCAG-GFP плазмидасымен трансфекцияланған өсірілген нейрондар иммуноцитохимиялық талдау үшін DIV21 және DIV22 күндері аралығында фиксацияланды. Жасушалар бөлме температурасында 20 минут бойы PBS ішіндегі 4% параформальдегид көмегімен фиксацияланды және 0.1% Triton X-100 көмегімен 15 минут бойы пермеабилизацияланды. Жасушалар бөлме температурасында 1 сағат бойы 5% сиыр сарысуы альбуминінде (BSA) блокталды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нейрондар мәдениетінде (DIV21–DIV22) спецификалық антиденелер панелін қолдана отырып жүргізілген иммуноцитохимия PKA ақуыздары мен цитоскелеттің жасушішілік таралуын егжей-тегжейлі визуализациялауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;5% BSA ішінде сұйылтылған біріншілік антиденелермен инкубация 4 °C температурада түні бойы жүзеге асырылды, ал екіншілік антиденелер бөлме температурасында 1 сағат бойы инкубацияланды. Үлгілерді зат шыныларына орнатпас бұрын ядролар &lt;a href=\"concepts/dapi.html\"&gt;DAPI&lt;/a&gt; бояуымен (0.5 мкг/мл) 10 минут бойы боялды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DAPI — бұл жасуша ядросына еніп, ДНҚ-мен берік байланысатын флуоресцентті бояу, ол микроскоп астында жасуша ядроларын оңай анықтауға және санауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Зерттеуде PKA RIα, дендриттік маркер MAP2 және аксональды маркер Tau-1-ге қарсы біріншілік антиденелер қолданылды. Alexa Fluor 488 және Alexa Fluor 555 флуорофорларымен конъюгацияланған екіншілік антиденелер нейрондар мәдениетіндегі ақуыз құрылымдарын нақты ажыратуға мүмкіндік берді.&lt;/p&gt;\n&lt;p&gt;Сандық жалпы протеомдық және фосфопротеомдық талдаулар үшін бес Akap11+/S384* және төрт Akap11+/+ тышқандары пайдаланылды. Жануарлар мойын омыртқаларын ажырату арқылы эвтаназия жасалды, содан кейін иіс сезу пиязшығы алынып, ұстара көмегімен неокортекс субкортикалық құрылымдардан жылдам бөлініп алынды. Ферменттерді инактивациялау мақсатында тіндер Denator AB компаниясының Stabilizor T1 құрылғысында жылумен тұрақтандырылып, құрғақ мұзда дереу мұздатылды. Үлгілерді дайындау, соның ішінде изобаралық таңбалау және фракциялау жұмыстары Джонс Хопкинс протеомдық жаңалықтар орталығында бұрын сипатталған және кішігірім өзгерістер енгізілген хаттамаларға сәйкес орындалды. Тіндер 8 M мочевина мен 50 mM триэтиламмоний бикарбонатын қамтитын, протеаза және фосфатаза ингибиторлары қосылған ерітіндіде лизиске ұшыратылып, мұз үстінде ультрадыбыспен өңделді. Әрбір сынама үшін 100 мкг ақуыз 10 mM трис(2-карбоксиэтил)фосфинмен тотықсыздандырылып, 40 mM 2-хлорацетамидпен алкилденді және Lys-C эндопротеазасымен 1:50 қатынасында ыдыратылды. Содан кейін ерітінді шамамен 2 M мочевина концентрациясына дейін сұйылтылып, трипсинмен 37 °C температурада 1:50 қатынасында бір түн бойы өңделді. Алынған пептидтер қышқылдандырылып, C18 бағандарында тұздан тазартылды және бөлме температурасында бір сағат бойы Thermo Fisher Scientific компаниясының TMTpro 18-plex реагенттерімен таңбаланды. Реакция трис көмегімен тоқтатылып, үлгілер біріктірілді. Фракциялау Agilent 1260 HPLC/Extend-C18 бағанында жоғары pH мәні бар кері фазалы сұйықтық хроматографиясы әдісімен 0.3 мл/мин жылдамдықта 90 минуттық градиент арқылы жүзеге асырылды. Алынған фракциялардың он пайызы жаһандық протеомдық талдауға, ал қалған тоқсан пайызы Fe(III)-IMAC көмегімен фосфопептидтерді байытуға бағытталды.&lt;/p&gt;\n&lt;p&gt;Пептидтерді талдау Vanquish NEO UHPLC жүйесін және 120 минуттық градиентте 300 нл/мин жылдамдықта жұмыс істейтін Orbitrap Exploris 480 масс-спектрометрін қолдану арқылы жүргізілді. MS1 спектрлері m/z 375–1500 диапазонында 120 000 ажыратымдылықпен тіркелді; мұнда 3 секундтық цикл, 0.7 Да изоляция және жалғыз зарядталған иондарды алып тастау шарттары қолданылды. Ыдырату 36 қалыптасқан соқтығысу энергиясында жоғары энергиялы соқтығысу диссоциациясы арқылы орындалды, ал MS2 спектрлері TurboTMTPro режимін пайдалана отырып 30 000 ажыратымдылықпен алынды. Спектрлер бойынша іздеу Thermo Fisher Scientific компаниясының Proteome Discoverer бағдарламасының 3.2.0.450 нұсқасындағы SEQUEST HT көмегімен UniProt Mus musculus деректер базасына қарсы жүзеге асырылды. Іздеу барысында трипсинмен өтіп кеткен екі кесуге, ұзындығы кемінде 6 аминқышқыл болатын пептидтерге және 10 ppm немесе 0.02 Da массалық шектеріне рұқсат етілді. Цистеиндердің карбамидометилденуі мен TMTpro таңбалануы тұрақты етіп белгіленді; тотығу, деамидтеу және серин/треонин/тирозин фосфорлануы өзгермелі модификациялар ретінде енгізілді. Жалған жаңалықтар жиілігін бақылау деңгейі Proteome Discoverer бағдарламасының Percolator модулі көмегімен пептид-спектр сәйкестігі мен ақуыздар деңгейінде 1% шамасында қамтамасыз етілді. Фосфосайттар локализациясының сенімділігі ptmRS модулі арқылы бағаланды. Репортер иондарын сандық анықтау MS2 негізіндегі TMT квантификациясы көмегімен 20 ppm интеграциялық төзімділікпен орындалды, ал ақуыздарды топтастыру қатаң парсимония принципіне сәйкес жүргізілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тоғыз тышқанның тіндеріне жасалған протеомдық және фосфопротеомдық талдаулар жоғары дәлдіктегі заманауи масс-спектрометриялық платформалар көмегімен сәтті орындалды.&lt;br /&gt;\n[!tip] Изобаралық TMT таңбалау әдісі мен тандемді масс-спектрометрия бір уақытта мыңдаған ақуыздар мен олардың фосфорланған түрлерінің мөлшерін дәл өлшеуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Протеинкиназа A сенсорының pcDNA3.1(+)-ExRai-AKAR2 аталатын үлгісі Джинь Чжанг тарапынан ұсынылып, Addgene гендер қоймасында 161753-нөмірімен тіркелген. pAAV-Camk2a-ExRai-AKAR2-mScarlet плазмидасын жасау үшін PKA сенсорын қамтитын қажетті тізбек Genscript компаниясы арқылы синтезделіп, Xba1/EcoR1 сайттары бойынша сызықталған pAAV-hSyn-EGFP векторының ішіне клондалды. Бастапқы pAAV-hSyn-EGFP плазмидасы Брайан Рот тарапынан берілді (Addgene &lt;a href=\"concepts/plasmid.html\"&gt;плазмида&lt;/a&gt; нөмірі #50465). Нейрондық культураларда сирек таңбалау үшін Конни Сепко ұсынған pCAG-GFP плазмидасы қолданылды (Addgene плазмида нөмірі #11150).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нейрондардағы PKA киназасының белсенділігін визуализациялау үшін &lt;a href=\"concepts/aav.html\"&gt;AAV&lt;/a&gt; векторлары негізінде арнайы генетикалық құрылымдар сәтті жасалды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бастапқы ажыратылған жасуша культуралары E16.5 сатысындағы эмбриондардың ми қыртысынан дайындалды. Қыртысты бөліп алу жұмыстары Corning компаниясының DMEM ортасында, оған 1X GlutaMAX, 0.5% penicillin/streptomycin және 10% ірі қара мал сарысуын қосу арқылы орындалды. Фосфатты-тұзды буфермен жуылғаннан кейін, әрбір эмбрионның тіндері ұсақ бөлшектерге бөлініп, 37 °C температурада DNase I қосылған TrypLE ферменті көмегімен диссоциацияланды. Содан кейін тіндер Neurobasal культуралық ортасымен (B-27, GlutaMAX және 0.5% penicillin/streptomycin қосылған) жуылып, пипетка көмегімен біртекті жасуша суспензиясына айналдырылды. Бөлініп алынған жасушалар поли-L-орнитинмен өңделген жабын шыныларына немесе визуализация ыдыстарына егілді. Егу тығыздығы 12 мм болатын әрбір жабын шынысына 1.5 × 10⁵ жасушаны немесе 35 мм ыдысқа 4.5 × 10⁵ жасушаны құрады. Өсіп келе жатқан нейриттерге морфологиялық талдау жасау үшін жасушалар 12 мм шыныға 1.0 × 10³ тығыздықта егілді. Культуралар 5% көмірқышқыл газы бар ылғалдандырылған инкубаторда 37 °C температурада сақталды.&lt;/p&gt;\n&lt;p&gt;Әрбір эмбрионның құйрығынан алынған ДНК көмегімен Akap11 мутациясы мен жынысын анықтау мақсатында пост-факт генотиптеу жүргізілді; праймерлер тізбегі Supplementary Table 1C кестесінде келтірілген. PKA сенсорын уақытша трансфекциялау in vitro жағдайындағы 5–6-күндер аралығында (DIV5–DIV6) Lipofectamine 2000 реагентін қолдану арқылы жүзеге асырылды. Әрбір визуализация ыдысындағы жасушаларға 2 мкл липофектаминмен араластырылған 1 мкг плазмидалық ДНК қосылып, Neurobasal ортасында 4 сағат бойы инкубацияланды, содан кейін олар кондиционерленген культуралық ортаға қайтарылды. pCAG-GFP көмегімен уақытша трансфекциялау DIV4–DIV6 мерзімдерінде 1:1 ДНК және липофектамин қатынасында, 12 мм әрбір жабын шынысына 200 нг ДНК есебінен орындалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;E16.5 эмбриондарының қыртыс тіндерінен алынған бастапқы нейрондық культуралар сәтті өсіріліп, генотиптелді және in vitro жағдайында мақсатты гендермен трансфекцияланды.&lt;br /&gt;\n[!tip] Эмбриондар миынан алынған бастапқы жасуша культуралары нейриттердің өсуі мен сигнал берінділерін зертханалық жағдайда бақылауға мүмкіндік береді.&lt;br /&gt;\n[!warning] Бастапқы жасуша культураларындағы тәжірибелер нейрондардың дамуының тек кейбір аспектілерін көрсетеді және оларды тірі ағза деректерімен салыстыру қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Арнайы PKA сенсорын экспрессиялайтын культивацияланған кортикальды нейрондарда PKA ферментінің белсенділік динамикасын бақылау үшін Nikon Ti2 кең өрісті микроскопы қолданылды. Микроскоп CFI Apochromat TIRF 60X/1.49 NA объективімен, ORCA-Fusion Digital CMOS C14440-20UP камерасымен және NIS-Elements AR 6.10.02 бағдарламалық жасақтамасымен жабдықталған. Суретке түсіру in vitro жағдайындағы 21 және 22-ші күндер аралығында (DIV21–DIV22) жүргізілді. GFP екі еселік қозуы 405 нм толқын ұзындығында (10% лазер қуаты, 500 мс экспозиция) және 488 нм толқын ұзындығында (2.5% лазер қуаты, 500 мс экспозиция) 525/50 нм эмиссиялық сүзгі арқылы орындалды. mScarlet қызыл флуоресценциясы 561 нм қозу (5% қуат, 50 ms экспозиция) және 595/44 нм сүзгісі көмегімен тіркелді. Тірі жасушаларды бейнелеу үшін бастапқы кадрлар 5 минут бойы әр 1 минут сайын алынды. Содан кейін зерттеу ыдысына 25 µM концентрациядағы форсколин мен 2 µM ролипрам немесе 25 µM H-89 тежегіші қосылды. Жасушалар препараттармен 3 минут бойы инкубацияланып, содан кейін 1 минуттық интервалмен 15 минут бойы суретке түсіру қайта жалғастырылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Time-lapse imaging әдісі тірі жасушалардағы биологиялық процестерді нақты уақыт режимінде бақылауға мүмкіндік береді, ал PKA сенсорлары фермент белсенділігі өзгерген кезде жарық сигнализациясын өзгертеді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Барлық негізгі деректер, соның ішінде мінез-құлық тесттері, физикалық өлшеулер, иммуноблоттау, RT-qPCR, иммуноцитохимия және тірі жасушалардағы PKA белсенділігін бейнелеу нәтижелері Debian GNU/Linux 11.7 контейнерінде жұмыс істейтін R ортасының 4.3.0 нұсқасы арқылы талданды. Мінез-құлық деректерін талдауда әр генотип үшін квартираралық қашықтық (IQR) есептелді; бірінші квартильден (Q1) немесе үшінші квартильден (Q3) 1.5 × IQR қашықтықтан тыс қалған мәндер шығарындылар ретінде алынып тасталды. Физикалық өлшеулер үшін деректер алынып тасталмады. Генотип пен тұқымның әсерін ескеретін сызықтық регрессия қолданылды, ал жұптық салыстырулар Тьюки тесті арқылы орындалды. Иммуноблоттау, RT-qPCR, иммуноцитохимия және тірі жасушаларды бейнелеу деректері бойынша ешқандай нүктелер жойылған жоқ. Екі генотип арасындағы айырмашылықты анықтау үшін Манн-Уитни U-тесті пайдаланылды.&lt;/p&gt;\n&lt;p&gt;Толық ұзындықтағы РНК секвенирлеу деректерін өңдеу және талдау Python 2.7.15 көмегімен IsoSeq 4.3.0 жұмыс үрдісіне сәйкес жүзеге асырылды. HiFi оқулары Skera 1.4.0 және MAS-Seq Adapter v3 көмегімен сегменттерге бөлінді. Демльтиплексирование пен штрих-кодтарды анықтау lima 2.13.0 бағдарламасы арқылы Iso-Seq режимінде және Iso-Seq v2 12-плекс праймерлері көмегімен орындалды. Poly(A) құйрықтары қысқартылып, конкатемерлер isoseq refine көмегімен жойылды. Толық ұзындықтағы конкатемер емес (FLNC) оқулар isoseq cluster2 көмегімен кластерленді, кем дегенде екі FLNC оқуы бар изоформалар сақталды. Кластерленген изоформалар GRCm39/mm39 тышқан референс геномына minimap2 негізіндегі pbmm2 (1.17.0 нұсқасы) арқылы тураланды. Артық изоформалар isoseq collapse көмегімен біріктірілді. Артық емес изоформалар pbpigeon 1.4.0 (pigeon classify) арқылы жіктелді. Нәтижелер сапасы төмен изоформаларды аластату үшін pigeon filter арқылы сүзілді. Сапаны бақылау кезеңінде а) сплайсинг артефактілері («RTS_stage»=TRUE), б) транскрипт аяқталатын жерден кейінгі 20 bp терезеде 80%-дан астам аденин нуклеотидтері («perc_A_downstream_TTS» &amp;gt; 80), немесе в) жалпы саны 3-тен аз изоформалар қосымша түрде жойылды. Қалған изоформалар миллионға шаққандағы транскрипттерге (TPM) нормаланды. Akap11 геніне тиесілі изоформалар UCSC Genome Browser көмегімен визуализацияланды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;РНК секвенирлеу деректері сапаны қатаң бақылаудан және сүзуден өтіп, TPM мәндері негізінде Akap11 изоформалары нақты анықталды.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Протеомикалық деректер Ubuntu 20.04.6 LTS контейнеріндегі R (4.5.3 нұсқасы) ортасында талданды. Деректер Msnbase (2.34.1 нұсқасы) нысандары ретінде өңделді, ал ластаушы заттар (contaminants) алынып тасталды. Әрбір үлгі үшін ақуыз мөлшері &lt;span class=\"yfm-latex\" data-content=\"%5Clog_2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; түрлендірілді және limma (3.64.3 нұсқасы) пакетіндегі normalizeBetweenArrays функциясы (cyclicloess әдісі) арқылы &lt;a href=\"concepts/cyclic-loess.html\"&gt;циклдік loess&lt;/a&gt; нормализациясынан өтті. Дифференциалды мөлшерді талдау limma::lmFit арқылы сызықтық модельді сәйкестендіру және limma::eBayes (trend=TRUE, robust=TRUE) арқылы эмпирикалық Байес түзетулерін енгізу арқылы жүзеге асырылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Циклдік loess — бұл үлгілер арасындағы техникалық айырмашылықтарды жою және деректердің таралуын теңестіру үшін қолданылатын статистикалық әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Фосфопротеомикалық деректер Msnbase форматында өңделіп, &lt;span class=\"yfm-latex\" data-content=\"%5Clog_2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; түрлендірілді және циклдік loess әдісімен нормализацияланды. Фосфорлану жылдамдығын бағалау үшін жалпы протеом және фосфопротеома мәндері алдымен әр үлгі ішінде арна медианасына қатысты нормализацияланды. Фосфосайттар мөлшері сәйкес келетін жалпы протеом мөлшеріне қатысты нормализацияланып, &lt;span class=\"yfm-latex\" data-content=\"%5Clog_2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; түрлендірілді. Алынған фосфорлану жылдамдығы мәндері қайтадан циклдік loess нормализациясынан өтті. Дифференциалды талдау үшін limma құралдары қолданылды.&lt;/p&gt;\n&lt;p&gt;Киназа-субстрат аннотациялары 2026 жылғы 5 сәуірде алынған PTMsigDB (2.0.0 нұсқасы) және RoKAI (2.3.0 нұсқасы) коллекцияларынан алынды. RoKAI аннотациялары PhosphositePlus және Signor деректеріне негізделген. Киназа белсенділігін анықтау үшін фосфосайттарға арналған «DE ұпайлары» (DE scores) енгізілді, олар &lt;span class=\"yfm-latex\" data-content=\"-%5Clog_%7B10%7DP%20%20imes%20%20ext%7Bsign%7D(%5Clog_2%20%20ext%7Bfold%20change%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; формуласы бойынша есептелді. RoKAI әдісіне сәйкес, киназа белсенділігінің ұпайы оның субстраттарының DE ұпайларының орташа мәні ретінде анықталды және p-мәні Z-тесті арқылы бағаланды. Сондай-ақ, PTMsigDB аннотациялары мен viper (1.42.0 нұсқасы) пакеті арқылы баламалы киназа белсенділігі тесті қолданылды, бұл әдіс байыту ұпайларын (enrichment scores) бағалау үшін рангілік талдауды және p-мәндерін анықтау үшін ауыстыру тестін (permutation test) пайдаланады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Киназа белсенділігі RoKAI әдісі (субстраттар DE ұпайларының орташасы) және viper пакеті (рангілік байыту талдауы) арқылы бағаланып, жүйелі талдаудың сенімділігі қамтамасыз етілді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Секвенцияланған ридтер GRCm39/mm39 эталондық геномына (10x Genomics, GRCm39-2024-A) Cell Ranger (9.0.1 нұсқасы) көмегімен cellranger count пайплайны арқылы тураланды (--create-bam true, --include-introns=true, қалған параметрлер әдепкі бойынша). Есептеу матрицасы SingleCellExperiment объектілері ретінде өңделді (1.24.0 нұсқасы). Сапаны бақылау және кейінгі талдаулар Debian GNU/Linux 11.7 контейнерінде жұмыс істейтін R ортасында (4.3.0 нұсқасы) жүргізілді.&lt;/p&gt;\n&lt;p&gt;Сапаны бақылау scDblFinder пакеті (1.14.0 нұсқасы) көмегімен computeDoubletDensity (d=50) арқылы ықтимал дуплеттерді анықтауды және doubletThresholding (dbr=0.10, әдіс “griffiths”, returnType=“call”, p=0.01) арқылы шектеуді қамтиды. Әрі қарай жасушалар үлгі бойынша мына критерийлермен сұрыпталды: (a) бірегей молекулалық идентификаторлардың (&lt;a href=\"concepts/umi.html\"&gt;UMI&lt;/a&gt;) жалпы саны &amp;lt; 1000 немесе &amp;gt; 5 медиандық абсолюттік ауытқу (MAD); (b) бірегей анықталған гендер &amp;lt; 750 немесе &amp;gt; 5 MAD; (c) митохондриальды гендерге сәйкес келген UMI үлесі &amp;gt; 5 MAD. Соңында барлық үлгілерде 10 көшірмеден аз экспрессияланған гендер алынып тасталды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;snRNA-seq және UMI — ядролық РНҚ-ны секвенциялау және бірегей молекулалық белгілер, олар фондық шуды есепке алмай транскрипттерді дәл санауға мүмкіндік береді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кластерлеу және жасуша түрлерін аннотациялау көп
