        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"173\" cy=\"159\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"607\" cy=\"209\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · ECOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Ақуыздарды жобалауды&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;жылдамдататын жасанды&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;интеллект жүйесі&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-f1.jpg\" alt=\"1-сурет / T-REX шолуы. a. T-REX — бұл бекітіப்பட்ட есептеу бюджеті шеңберінде de novo ақуыз лиганды дизайны үшін есептеу\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет / &lt;a href=\"concepts/target-adaptive-rescue-explore-exploit.html\"&gt;T-REX&lt;/a&gt; шолуы. a. T-REX — бұл бекітіப்பட்ட есептеу бюджеті шеңберінде de novo ақуыз лиганды дизайны үшін есептеу құралдарын бейімделгіш түрде басқаратын агенттік жүйе.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет / T-REX шолуы. a. T-REX — бұл бекітіப்பட்ட есептеу бюджеті шеңберінде de novo ақуыз лиганды дизайны үшін есептеу құралдарын бейімделгіш түрде басқаратын агенттік жүйе. b, c. Дизайн нәтижелері кейінгі әрекеттер үшін әртүрлі басымдықтарды туындататын ақаулық режимдеріне бөлінеді: перспективалы дизайнды сақтау (Rescue), балама әдістер мен параметрлерді зерттеу (Explore) немесе өнімді жолдарды пайдалану (eXploit). d. Аяқталған және жүріп жатқан дизайн тапсырмалары туралы деректер науқанның дамушы күйінің құрылымдалған көрінісіне топтастырылады және екі &lt;a href=\"concepts/llm.html\"&gt;LLM&lt;/a&gt; агенті арқылы түсіндіріледі. Жоспарлаушы деректерге негізделген гипотезалар мен кейінгі әрекеттерді ұсынады, ал Супервайзер расталған әрекеттерге басымдық береді және олардың Rescue, Explore және eXploit арасында бөлінуін ұсынады. Детерминирленген басқарушы қолжетімді есептеу ресурстарын ескере отырып, тапсырмалардың орындалуын үйлестіреді. e. Ұсынылған әрекеттер қолжетімді GPU-ларда асинхронды түрде орындалады, ал аяқталған нәтижелер кейінгі жоспарлау және бөлу үшін жаңа деректерді береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Қажетті қасиеттері бар ақуыздарды жасау үлкен есептеу қуатын талап етеді. Зерттеушілер әртүрлі генеративті алгоритмдердің жұмысын үйлестіру үшін T-REX жүйесін ұсынды. Бұл тәсіл шектеулі уақыт пен ресурстар жағдайында көбірек бірегей құрылымдарды табуға мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;T-REX жүйесі ақуыз генеративті модельдерінің жұмысын үйлестіреді.&lt;/li&gt;\n&lt;li&gt;Тілдік модельдер қателерді талдап, есептеу тапсырмаларын бөледі.&lt;/li&gt;\n&lt;li&gt;Бірегей ақуыз құрылымдарын өндіру өнімділігі бірнеше есе өсті.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Заманауи жасанды интеллект әдістері ақуыз молекулаларын жасау үшін көптеген мамандандырылған құралдарды ұсынады. Алайда бұл құралдарды тиімді үйлестіру әлі де күрделі міндет болып отыр. Жаңа T-REX жүйесі бұл мәселені жобалау процесін агенттік басқару арқылы шешеді, міндеттерді перспективалы үміткерлерді сақтап қалу және сәтті бағыттарды масштабтау деп бөледі.&lt;/p&gt;\n&lt;p&gt;Жүйенің негізінде ағымдағы нәтижелерді талдайтын және келесі қадамдарды ұсынатын тілдік модельдер жатыр. Детерминивті бақылаушы бұл ұсыныстарды тексеріп, тапсырмаларды бөледі. Жеті түрлі нысана бойынша сынақтан өткізу кезінде жүйе дәстүрлі әдістермен салыстырғанда жоғары өнімділік көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер зертханада физикалық синтезсіз және эксперименталды тексерусіз компьютерлік модельдеуге негізделген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Жасанды интеллекттің дамуы ақуыздарды нолден жобалауға арналған әдістердің қарқынды өсіп келе жатқан экожүйесін қалыптастырды. Алайда зерттеушілер шектеулі есептеу ресурстары жағдайында көптеген арнайы құралдарды қалай тиімді пайдалану керектігімен жиі бетпе-бет келеді.&lt;/p&gt;\n&lt;p&gt;Бұл мәселені шешу үшін авторлар ақуыз байланыстырғыштарын әзірлеуге арналған Target-adaptive Rescue–Explore–eXploit (T-REX) агенттік жүйесін ұсынады. Бұл жүйе заманауи ақуыз генеративті модельдері мен құрылым бағалаушыларын үйлестіреді. Жобалау барысында үлкен тілдік модельдер (LLM) негізіндегі агенттер жиналған нәтижелерді талдап, перспективалы үміткерлерді сақтап қалу, балама баптауларды зерттеу немесе өнімді бағыттарды пайдалану туралы шешім қабылдайды, ал детерминирленген басқарушы ұсынылған әрекеттерді тексеріп, жоспарлайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Агенттік жүйе және LLM — бұл жасанды интеллект негізіндегі бағдарламалардың өз бетінше шешім қабылдайтын, аралық нәтижелерді талдайтын және тәжірибе қадамдарын жоспарлайтын тәсілі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жеті түрлі нысана бойынша жүргізілген сынақтар T-REX есептеу қуаттарын нақты нысананың ерекшеліктеріне сәйкес бейімделгіш түрде бөлетінін көрсетті. Жүйе барлық базалық әдістермен салыстырғанда құрылымдық жағынан бірегей сәтті ақуыз байланыстырғыштарын жасау бойынша ең жоғары өнімділікті көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;T-REX жүйесі есептеу ресурстарын тиімді бөледі және сынақтан өткен жеті нысана бойынша бірегей құрылымды сәтті нұсқалар саны бойынша стандартты тәсілдерден асып түседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Алынған деректер бейімделгіш басқарудың заманауи ақуызды жобалау модельдерін тиімді түрде толықтыра алатынын дәлелдейді. Авторлар ақуыз байланыстырғыштарын жасау кезінде есептеу шығындарын оңтайландыру үшін T-REX жүйесін ашық қолжетімділікке шығарады.&lt;/p&gt;\n&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;De novo ақуыздарын жобалау терапияда, катализде және молекулярлық инженерияда мүмкіндіктер аша отырып, қажетті құрылымдары мен функциялары бар жаңа макромолекулаларды жасаудың қуатты әдісіне айналып келеді. Жасанды интеллект саласындағы соңғы жетістіктер жобалау процесін өзгертетін есептеу құралдарын, атап айтқанда қаңқа құрылымдарының генеративті модельдерін, тізбекті жобалауға арналған кері фолдингті және құрылымды болжау модельдерін ұсынды. Құрылым мен тізбектің бірлескен генеративті модельдері, сондай-ақ &lt;a href=\"concepts/bindcraft.html\"&gt;BindCraft&lt;/a&gt; сияқты интеграцияланған конвейерлер заманауи de novo ақуыз байланыстырғыштарын жасауға қосымша жолдар ашады. Қолжетімді құралдардың саны артып келе жатқандықтан, қай әдістерді қандай параметрлермен қолдану керектігі және шектеулі есептеу ресурстарын қалай бөлу қажеттігі туралы сұрақ туындайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ақуызды жобалау науқаны — бұл белгілі бір нысана үшін орындалатын есептеулер, қайта жобалау және бағалау кезеңдерінің тізбегі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Арнайы құралдар өнімділігі мен есептеу құны бойынша ерекшеленуі мүмкін. Үміткерлер &lt;a href=\"concepts/virtualnyy-nokaut.html\"&gt;in silico&lt;/a&gt; критерийлеріне сай келмеуі немесе қателіктерге әкелуі мүмкін, бірақ сәтсіз нұсқалар кейінгі жетілдіру үшін бастапқы нүкте бола алады. Қолжетімді әдістерді тиімді басқару перспективалы дизайнды өзгерту немесе балама жолдарды сынау туралы шешім қабылдауды талап етеді. Ғылыми агенттер саласындағы соңғы жетістіктер үлкен тілдік модельдердің (LLM) контекстік пайымдау қабілеттерін қамтамасыз ете алатынын көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Үлкен тілдік модельдер мен ресурсты қажет ететін симуляцияларды пайдалану айтарлықтай есептеу шығындары мен токен бюджеттерін талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Aқуыздарды жасау және құрылымын бағалау есептеу тұрғысынан ауыр процесс болып қала береді, ал LLM көмегімен аралық нәтижелерді талдау салыстырмалы түрде жылдам жүреді. Параллель міндеттер әр түрлі уақытта аяқталатындықтан, келтірілген деректерді үнемі бағалап, келесі қадамдарды жоспарлай алатын науқан контроллері қажет болады. Біз de novo ақуыз байланыстырғыштарын жоғары өнімділікпен жобалауға арналған Target-adaptive Rescue–Explore–eXploit (T-REX) агенттік науқан контроллерін ұсынамыз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;T-REX жүйесі de novo дизайнының жеті нысанасы бойынша ағаш іздеу контроллерінен орташа есеппен 2.43 есе және ең күшті генеративті базалық модельдерден 2.48 есе асып түсті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;T-REX жүйесінде LLM агенттері жинақталған деректерді талдап, жұмысты үш стратегия бойынша басымдыққа ие етеді: Rescue (перспективті дизайнның әлсіз жақтарын түзету), Explore (аз қолданылатын әдістерді сынау) және eXploit (өнімді бағыттарға қосымша ресурстар бөлу). Детерминистік орындау қабаты ұсынылған тапсырыстарды растайды және ресурстар шектеулерін басқарады. Жеті нысана бойынша T-REX құрылымдық бірегей хиттердің ең жоғары өткізу қабілетіне қол жеткізді.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"21-t-rex-naukhan-kontrollerine-sholu\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#21-t-rex-naukhan-kontrollerine-sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.1. T-REX науқан контроллеріне шолу&lt;/span&gt;&lt;/a&gt;2.1. T-REX науқан контроллеріне шолу&lt;/h4&gt;\n&lt;p&gt;T-REX жүйесі белгіленген есептеу бюджеті шеңберінде құрылымдық жағынан ерекше «хиттерді» максимизациялау үшін әртүрлі ақуыз байланыстырғыштарын жобалау құралдарын бейімделгіш түрде басқаруға арналған (1-сур.). Құралдар жиынтығына алты генерация құралы — Proteína-Complexa-ның төрт нұсқасы (beam search, best-of-n, Feynman-Kac steering және Monte-Carlo Tree Search — MCTS), BindCraft және BoltzGen, сондай-ақ тізбекті қайта жобалауға арналған ProteinMPNN және құрылымды бағалау үшін AlphaFold2 (AF2) кіреді (1a-сур.).&lt;/p&gt;\n&lt;p&gt;De novo байланыстырғыштарын жобалау науқаны әр тапсырма нақты құралды, гиперпараметр конфигурациясын және ата-аналық дизайнды қамтитын есептеу тапсырмалары бойынша онлайн бөлу проблемасы ретінде тұжырымдалады (S5-кесте). Жобаланған ақуыздар in silico критерийлеріне сай болуы тиіс (pLDDT, iPAE, scRMSD шектері), ал жинақталған кандидаттар жинағы Foldseek көмегімен бірегей хиттерді санау үшін кластерленеді (4.2-бөлім, Әдістер). Науқан барысында хиттердің өндірілуі баяулауы немесе тоқтап қалуы мүмкін, бірақ хиттердің қарапайым саны мәселенің қай жерде екенін көрсетпейді. T-REX жүйесінде төрт операциялық ақаулық режимі бөлінеді (1b-сур.): генерация нәтиже бермеуі, бағалаудың кешігуі, кандидат критерийлерге жетпей қалуы немесе дизайнның бұрын табылған құрылымды қайталауы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;T-REX контроллері алты генерация құралын үйлестіреді және ақуыз байланыстырғыштарын жобалаудағы төрт түрлі ақаулық режимін еңсеру үшін тілдік модельдерге негізделген агенттерді пайдаланады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл әрекеттерді ұйымдастыру үшін T-REX үш басымдықты анықтайды: Rescue (қтқару), Explore (зерттеу) және eXploit (пайдалану) (1c-сур.). Тек хиттер санына сенудің орнына, нәтижелер мен ресурстарды біріктіретін EvidenceSummary жиынтығы қолданылады (1d-сур.; 4.3-бөлім, Әдістер; C.4-бөлім және S1-сур.). Оның негізінде науқанның жеті күйінің бірі тағайындалады. Контекстті түсіндіру үшін LLM агенттері қолданылады. Planner LLM гипотезаларды HypothesisCards түрінде тұжырымдайды, содан кейін тапсырмалар «Check + Build» тексеру сатысынан өтеді. Содан кейін Supervisor LLM кандидаттарды басымдықтар бойынша бөледі (1d-сур.).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM агенттері (Planner және Supervisor) — бұл есептеу науқанының күйін талдайтын және келесі әдістерді іске қосу туралы стратегиялық шешімдер қабылдайтын жасанды интеллект модельдері.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;a href=\"concepts/deterministic-controller.html\"&gt;Детерминированный контроллер&lt;/a&gt; GPU ресурстары босаған сайын тапсырмаларды таңдайды. Генерация мен бағалау уақыты әртүрлі болғандықтан, T-REX асинхронды орындауды пайдаланады (1e-сур.). Нәтижелер науқан мұрағатына (4.3-бөлім, Әдістер) және EvidenceSummary-ге енгізіледі (1e-сур.; 4.5-бөлім, Әдістер). Бұл жұмыста Planner мен Supervisor vLLM арқылы жұмыс істейтін Qwen3.6-27B-FP8 моделін қолданады.&lt;/p&gt;\n&lt;p&gt;T-REX PUCT ε-gr. CX BC BG T-REX нысанасының PUCT-ке, ең жақсы GO-ға қарағандағы артықшылығы&lt;br /&gt;\nCD45 2.090 0.479 0.188 0.347 0.014 0.035 4.36× 6.02×&lt;br /&gt;\nBetV1 0.444 0.236 0.118 0.118 0.021 0.104 1.88× 3.76×&lt;br /&gt;\nCbAgo 0.806 0.375 0.062 0.014 0.361 0.257 2.15× 2.23×&lt;br /&gt;\nHER2-&lt;a href=\"concepts/aav.html\"&gt;AAV&lt;/a&gt; 1.417 0.361 0.188 0.292 0.722 0.014 3.92× 1.96×&lt;br /&gt;\nSC2RBD 0.382 0.278 0.139 0.000 0.153 0.042 1.38× 2.50×&lt;br /&gt;\nPDL1 3.347 1.618 0.451 1.951 1.604 1.097 2.07× 1.72×&lt;br /&gt;\nIL7RA 1.660 0.660 0.278 1.160 1.236 1.035 2.52× 1.34×&lt;/p&gt;\n&lt;h4 id=\"22-t-rex-aertuerli-akhuyz-nysandary-bojynsha-zhoghary-oenimdi-in-silico-dizajnyna-khol-zhetkizedi\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#22-t-rex-aertuerli-akhuyz-nysandary-bojynsha-zhoghary-oenimdi-in-silico-dizajnyna-khol-zhetkizedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.2. T-REX әртүрлі ақуыз нысандары бойынша жоғары өнімді in silico дизайнына қол жеткізеді&lt;/span&gt;&lt;/a&gt;2.2. T-REX әртүрлі ақуыз нысандары бойынша жоғары өнімді in silico дизайнына қол жеткізеді&lt;/h4&gt;\n&lt;p&gt;Біз T-REX жүйесін үш тек генераторға негізделген базалық әдіспен және еét есептеу ресурстары шеңберіндегі екі агенттік емес бейімделгіш бақылаушымен Proteína-Complexa (Complexa) бенчмаркінен таңдалған жеті нысан бойынша салыстырдық: CD45, BetV1, CbAgo, HER2-AAV, SC2RBD, PDL1 және IL7RA (2-сурет; 1-кесте). Генераторлық базалар ретінде Complexa, BindCraft және BoltzGen қолданылды; ал бейімделгіш салыстыру құралдары ретінде PUCT ағашты іздеу бақылаушысы мен ε-greedy алгоритмі алынды. PUCT және ε-greedy T-REX жүйесімен бірдей әрекеттер кеңістігінде және орындау ортасында жұмыс істеді, бірақ тілдік модельдерге негізделген мәтіндік пайымдауларсыз, скалярлық сыйақыға негізделген бөлуді қолданды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;T-REX 0.6 TM табалдырығында топтастырылған 1461 құрылымдық бірегей хитті (SU) жасап шығарды, мұнда әрбір жобалау науқаны 4 H100 GPU түйінінде 48 сағатқа созылып, барлық бес базалық әдістен асып түсті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;T-REX өнімділігі әр түрлі нысандар үшін PUCT көрсеткішінен 1.38–4.36 есе жоғары болды, ал геометриялық орташа өсім PUCT-ке қарағанда 2.43 есе және ең күшті генераторлық базаға қарағанда 2.48 есе құрды (2-сурета; 1-кесте). 10, 50, 100 және 144 GPU сағаттарындағы салыстырулар өнімділік траекторияларын көрсетті (S10-кесте). T-REX өнімділігінің артуы құрылымдық әртүрлілік мен сапа анықтамаларына қатысты тұрақты болды (2b, c-суреттер). Жүйе 0.5, 0.6 және 0.8 TM-score табалдырықтарында және 70% ұқсастықтағы тізбектерді топтастыру кезінде көшбасшы болды (2b-сурет; S13, S14-кестелер). Хиттерге қойылатын талаптар қатаңдатылған кезде де артықшылық сақталды (S4-сурет). AF2, actifpTM, PRODIGY, ESMFold2 және Boltz-2 диагностикалары бойынша T-REX әрбір балл табалдырығынан өткен ең көп құрылымдық ерекше хиттерді сақтап қалды (2c-сурет; S6-сурет). CD45, SC2RBD және CbAgo үшін тәуелсіз басталған қайталанбалы науқандар T-REX жүйесінің тұрақты түрде басым болғанын көрсетті (2d-сурет). T-REX сондай-ақ SMAC3 оптимизаторынан да озып түсті (S11-кесте) және TNF-α мен TrkA үшін жоғары SU өнімділігіне қол жеткізді (S25-кесте).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Агенттік жүйелер модельдеу барысында аралық нәтижелерді талдай отырып, қажетті құралдар мен стратегияны автоматты түрде өзгерте алады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"23-t-rex-saetsizdikterdi-taldau-zhaene-kejingi-tapsyrmalardy-usynu-ueshin-naukhan-derekterin-biriktiredi\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#23-t-rex-saetsizdikterdi-taldau-zhaene-kejingi-tapsyrmalardy-usynu-ueshin-naukhan-derekterin-biriktiredi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.3. T-REX сәтсіздіктерді талдау және кейінгі тапсырмаларды ұсыну үшін науқан деректерін біріктіреді&lt;/span&gt;&lt;/a&gt;2.3. T-REX сәтсіздіктерді талдау және кейінгі тапсырмаларды ұсыну үшін науқан деректерін біріктіреді&lt;/h4&gt;\n&lt;p&gt;T-REX жүйесінің науқан мәнмәтінін қалай пайдаланатынын сапалы зерттеу үшін біз үш мысалды қарастырдық. HER2-AAV жүйесінде pLDDT сыйақысына негізделген сынақ бірде-бір мақұлданған дизайнды бермеді (0/32), бұл тізбек пен қаңқа үйлесімділігі туралы гипотезаны қайта қарауға әкелді және тізбекті нақтылау жұмысы 5/32 мақұлданған дизайнды берді (3а-сурет). CbAgo жағдайында iPAE мәндері шектен жоғары бес дизайн Feynman–Kac (FK) басқаруын кеңейтуге түрткі болып, 4/16 мақұлданған дизайнды қамтамасыз етті (3b-сурет). PDL1 үшін тек pLDDT тексеруінен өтпеген ата-аналық нұсқа ProteinMPNN көмегімен қайта жобаланып, 14/16 ұрпақтың сәтті өтуіне және бір жаңа SU алуға мүмкіндік берді (3c-сурет). Бұл мысалдар T-REX жүйесінің критерийлерге тән деректерді қайта пайдалана отырып, жаңа есептеу қадамдарын тиімді жоспарлай алатынын көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Алынған нәтижелер есептеулік дизайн тиімділігін көрсеткенімен, олар in vitro эксперименттері арқылы толық растауды қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"24-t-rex-naukhan-kuejlerine-saejkes-resurs-boeludi-bejimdejdi-zhaene-tyghyrykhtan-shyghugha-basymdykh-beredi\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#24-t-rex-naukhan-kuejlerine-saejkes-resurs-boeludi-bejimdejdi-zhaene-tyghyrykhtan-shyghugha-basymdykh-beredi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.4. T-REX науқан күйлеріне сәйкес ресурс бөлуді бейімдейді және тығырықтан шығуға басымдық береді&lt;/span&gt;&lt;/a&gt;2.4. T-REX науқан күйлеріне сәйкес ресурс бөлуді бейімдейді және тығырықтан шығуға басымдық береді&lt;/h4&gt;\n&lt;p&gt;Біз T-REX науқан күйлеріндегі Rescue (құтқару), Explore (зерттеу) және eXploit (пайдалану) басымдықтарының қалай өзгеретінін зерттедік. Науқан күйлері архивтелген деректер негізінде жеті күйлі жіктеу арқылы тағайындалды (1d-сурет). Расталған 1454 генерация мен қайта жобалаудың 74%-ы деректер аз кезде Explore үлесіне, 51%-ы тығырық немесе терең тығырық жағдайында Rescue үлесіне, ал 82%-ы құрылымдардың жиі қайталануына қарамастан жаңа нәтиже беретін өнімді күйлерде eXploit үлесіне тиесілі болды (4a-сурет). Осылайша, T-REX жұмысты икемді бөледі: деректер жетіспегенде Explore-ті, тығырық кезінде Rescue-ні, ал тиімді жолдар жалғасқанда eXploit-ті таңдайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Rescue басымдығы тығырықтан шығуда маңызды рөл атқарады: толық T-REX жүйесі осындай 27 жағдайдың 26-сында шықса, бұл басымдық алынып тасталғанда 20 жағдайдың 14-інде ғана шықты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз бұл басымдықты алып тастау арқылы Rescue-нің тығырықтан шығудағы рөлін тексердік. Алғашқы 100 GPU-сағат ішінде қалпына келтіру тығырыққа кірген сәттен бастап TM ≥ 0.6 болатын келесі жаңа дизайнға дейін өлшенді (4b-сурет). Толық T-REX осындай 27 жағдайдың 26-сында қалпына келсе, Rescue алынып тасталған нұсқада 20-ның 14-і ғана қалпына келді. Сәтті жағдайлар арасында келесі дизайнға дейінгі орташа уақыт толық T-REX үшін қалыпты тығырықта да (1.77 және 5.04 GPU-сағат), терең тығырықта да (3.52 және 7.60 GPU-сағат) қысқа болды. Сондай-ақ толық T-REX тығырық күйлерінде аз уақыт өткізді (3.8% және 27.7%). Бұл нәтижелер Rescue басымдығының маңызын растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Міндеттер нәтижелері мен басымдықтар арасындағы байланысты зерттеу AI-агенттің логикасын түсінуге көмектеседі: сенімділік төмен болғанда балмалар өзгереді, ал құрылым қайталанғанда іздеу баптаулары түзетіледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Соңында біз міндет нәтижелері, құрылымның қайталануы және бөлу басымдықтары арасындағы байланысты қарастырдық. Ретроспективті түрде анықталған бастапқы мақсаты бар 1305 генерация ішінде интерфейс сенімділігі (iPAE) және құрылымның қайталануы көбінесе eXploit-пен байланысты болса (тиісінше 65% және 93%), фолдинг сенімділігі (pLDDT) Rescue-мен байланысты болды (88%, 4c-сурет). Келесі міндеттер де дәлелдерге байланысты ерекшеленді: сенімділік көрсеткіштері генератор салмақтарын өзгертуге немесе реттілік дизайнын жаңартуға әкелсе, құрылымның қайталануы іздеу баптауларын өзгерте отырып белгілі жолдарды қайталауға әкелді (4d-сурет).&lt;/p&gt;\n&lt;h4 id=\"25-zhobalanghan-akhuyzdar-aertuerli-ekinshi-retti-khurylymdar-men-bolzhanghan-bajlanysu-oryndaryn-khamtidy\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#25-zhobalanghan-akhuyzdar-aertuerli-ekinshi-retti-khurylymdar-men-bolzhanghan-bajlanysu-oryndaryn-khamtidy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.5. Жобаланған ақуыздар әртүрлі екінші ретті құрылымдар мен болжанған байланысу орындарын қамтиды&lt;/span&gt;&lt;/a&gt;2.5. Жобаланған ақуыздар әртүрлі екінші ретті құрылымдар мен болжанған байланысу орындарын қамтиды&lt;/h4&gt;\n&lt;p&gt;Т-REX жасаған байланыстырушы құрылымдардың жиынтығын сипаттау үшін біз құрылымдық жағынан ерекше хиттердің екінші ретті құрылым құрамын зерттедік. Барлық 7 нысаналы науқан бойынша TM ≥ 0.6 болатын 1461 өкіл үшін DSSP жіктеуін пайдалана отырып, α-спираль мен β-талшық үлестерін есептедік (5a, 5b-суреттер). Әдістерді салыстыру үшін кластерлеуге дейін кемінде 20%-ы β-талшықтан тұратын барлық сапалы дизайндарды таңдадық. Жеті нысана бойынша T-REX TM ≥ 0.6 болатын 308 кластер түзсе, басқа әдістердің ішіндегі ең жоғарғы көрсеткіш – BoltzGen-only 95 кластер түзді (S23-кесте).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;T-REX басқа әдістерге қарағанда β-талшыққа бай кластерлерді көбірек түзіп (308-ге қарсы 95), әртүрлі екінші ретті құрылымдарды көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Содан кейін біз CbAgo нысанасына қатысты болжанған байланыстырушы орындарды талдадық. Әрбір болжанған кешенді нысанаға сәйкестендіргеннен кейін, әр байланыстырушының орталығын оның C_α атомдарының орташа орны ретінде анықтадық. Басты компоненттерді талдау (&lt;a href=\"concepts/pca.html\"&gt;PCA&lt;/a&gt;) T-REX байланыстырушы орталықтарының PUCT әдісіне қарағанда кеңірек аймақты алып жатқанын көрсетті (5c-сурет). Әр әдіс үшін 30 өкілден тұратын 1000 қайта таңдама негізінде байланыстырушы орталықтар арасындағы орташа қашықтық T-REX үшін 31.2 Å, ал PUCT үшін 9.97 Å болды (S24-кесте). Осылайша, T-REX құрылымдық әртүрлілікті және нысанаға қатысты кең ауқымды байланысу орындарын қамтамасыз етеді.&lt;/p&gt;\n&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;h4 id=\"naetizhelerdi-talkhylau-zhaene-t-rex-aedisining-perspektivalary\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#naetizhelerdi-talkhylau-zhaene-t-rex-aedisining-perspektivalary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелерді талқылау және T-REX әдісінің перспективалары&lt;/span&gt;&lt;/a&gt;Нәтижелерді талқылау және T-REX әдісінің перспективалары&lt;/h4&gt;\n&lt;p&gt;Авторлар Target-adaptive Rescue–Explore–eXploit (T-REX) агенттік науқан контроллерін ұсынады, ол мамандандырылған ақуыз құрылымының генераторлары мен бағалаушыларын үйлестіре отырып, de novo байланыстырғыш ақуыздарды жоғары өнімділікпен жобалауды қамтамасыз етеді. Бірнеше жобалау құралдары мен стратегияларын қолдана отырып, T-REX бірдей есептеу бюджеттері жағдайында бір генераторлы базалық модельдерге және агенттік емес бейімделгіш контроллерлерге қарағанда жоғары нәтиже көрсеткішіне қол жеткізді (Сурет 2). Бұл нәтижелер науқан деңгейіндегі үйлестіру арнайы ақуыз дизайны құралдарын жетілдірумен қатар маңызды қосымша бағытқа айналып келе жатқанын көрсетеді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-f2.jpg\" alt=\"2-сурет / T-REX дизайн науқаны барысында базалық әдістерге қарағанда құрылымдық жағынан бірегей хиттерді көбірек шығарад\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет / T-REX дизайн науқаны барысында базалық әдістерге қарағанда құрылымдық жағынан бірегей хиттерді көбірек шығарады. a.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сурет / T-REX дизайн науқаны барысында базалық әдістерге қарағанда құрылымдық жағынан бірегей хиттерді көбірек шығарады. a. T-REX, агенттік емес бейімделгіш тәсілдер және бір генераторлы базалық модельдер үшін жеті нысана бойынша GPU сағаттарына қатысты құрылымдық жағынан бірегей хиттердің жиынтық саны. b. Әрбір нысана үшін ең жоғары өнімділігі бар баламаға қатысты көрсетілген, 70% тізбек ұқсастығындағы MMseqs2 кластерлеуі кезіндегі хиттердің өткізу қабілеті. c. Жеті нысана бойынша біріктірілген баламалы post-hoc сапа шектері кезінде сақталған құрылымдық жағынан бірегей хиттердің саны. afpTM және ESMFold2 ipTM болжанған интерфейс сенімділігін өлшейді, ал PRODIGY байланысудың бос энергиясын (Δ𝐺, ккал моль−1) бағалайды. Әрбір шек бірдей TM0.6 кластер өкілдері жиынтығына бөлек қолданылады. d. CD45, SC2RBD және CbAgo бойынша тәуелсіз іске қосылған үш науқан үшін T-REX, PUCT және 𝜖-шақа (𝜖-greedy) үшін хиттердің өткізу қабілеті. Нүктелер жеке науқандарды көрсетеді; ромбтар мен қателік сызықтары орташа мән мен стандартты ауытқуды көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;T-REX жүйесінің өзегі тілдік модельдердің (LLM) пайымдауларына негізделген бейімделгіш шешім қабылдауды, нәтижелер мен қателік түрлерін құрылымдық жіктеуді және ресурстарды тиімді бөлу үшін детерминирленген бақылауды біріктіреді. LLM-ге ретсіз тарихты тікелей талдауды тапсырудың орнына, T-REX науқан нәтижелерін түсінікті қателік түрлері мен науқан күйлеріне реттейді (Сурет 1). Екі LLM агенті осы құрылымдық деректер негізінде жұмыс істейді: Жоспарлаушы (Planner) гипотезалар мен әрекеттерді ұсынады, ал Супервайзор (Supervisor) кандидат әрекеттерге басымдық беріп, есептеу қуаттарын Құтқару (Rescue), Зерттеу (Explore) және Пайдалану (eXploit) режимдері арасында бөлуді ұсынады (Сурет 3, 4).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-f1.jpg\" alt=\"1-сурет / T-REX шолуы. a. T-REX — бұл бекітіப்பட்ட есептеу бюджеті шеңберінде de novo ақуыз лиганды дизайны үшін есептеу\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет / T-REX шолуы. a. T-REX — бұл бекітіப்பட்ட есептеу бюджеті шеңберінде de novo ақуыз лиганды дизайны үшін есептеу құралдарын бейімделгіш түрде басқаратын агенттік жүйе.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет / T-REX шолуы. a. T-REX — бұл бекітіப்பட்ட есептеу бюджеті шеңберінде de novo ақуыз лиганды дизайны үшін есептеу құралдарын бейімделгіш түрде басқаратын агенттік жүйе. b, c. Дизайн нәтижелері кейінгі әрекеттер үшін әртүрлі басымдықтарды туындататын ақаулық режимдеріне бөлінеді: перспективалы дизайнды сақтау (Rescue), балама әдістер мен параметрлерді зерттеу (Explore) немесе өнімді жолдарды пайдалану (eXploit). d. Аяқталған және жүріп жатқан дизайн тапсырмалары туралы деректер науқанның дамушы күйінің құрылымдалған көрінісіне топтастырылады және екі LLM агенті арқылы түсіндіріледі. Жоспарлаушы деректерге негізделген гипотезалар мен кейінгі әрекеттерді ұсынады, ал Супервайзер расталған әрекеттерге басымдық береді және олардың Rescue, Explore және eXploit арасында бөлінуін ұсынады. Детерминирленген басқарушы қолжетімді есептеу ресурстарын ескере отырып, тапсырмалардың орындалуын үйлестіреді. e. Ұсынылған әрекеттер қолжетімді GPU-ларда асинхронды түрде орындалады, ал аяқталған нәтижелер кейінгі жоспарлау және бөлу үшін жаңа деректерді береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-f3.jpg\" alt=\"3-сурет / T-REX кейінгі дизайн стратегияларын ұсыну үшін науқан нәтижелерін пайдаланады.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет / T-REX кейінгі дизайн стратегияларын ұсыну үшін науқан нәтижелерін пайдаланады.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-сурет / T-REX кейінгі дизайн стратегияларын ұсыну үшін науқан нәтижелерін пайдаланады. Үш ретроспективті мысал T-REX байқалған нәтижелерді кейінгі есептеу әрекеттерін ұсыну үшін қалай пайдаланатынын көрсетеді. a. HER2-AAV үшін pLDDT оңтайландыратын топ сәтті дизайн шығармады, бұл тізбекті нақтылауға түрткі болды, ол 5/32 сәтті дизайнды және үш жаңа құрылымдық жағынан бірегей хитті өндірді. b. CbAgo үшін тек iPAE критерийінен өтпеген қайталанған дизайн Фейнман–Кац (FK) кеңірек іздеуіне түрткі болып, 4/16 сәтті дизайн мен екі жаңа құрылымдық жағынан бірегей хитті берді. c. PDL1 үшін тек pLDDT критерийінен өтпеген дизайн ProteinMPNN бекітілген қаңқалы тізбекті қайта жобалауға итермелеп, 14/16 сәтті дизайн мен бір жаңа құрылымдық жағынан бірегей хитті тудырды. Қызғылт сары және жасыл белгілер сәйкесінше өте алмаған және өткен дизайн критерийлерін көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-f4.jpg\" alt=\"4-сурет / T-REX дизайн стратегияларын науқан күйіне және жиналған деректерге бейімдейді. a.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет / T-REX дизайн стратегияларын науқан күйіне және жиналған деректерге бейімдейді. a.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-сурет / T-REX дизайн стратегияларын науқан күйіне және жиналған деректерге бейімдейді. a. Науқан күйі бойынша топтастырылған 1454 генерация және қайта жобалау тапсырмалары бойынша Rescue–Explore–eXploit (R/E/X) басымдықтары. b. Тоқтап қалған науқан күйіне кірген сәттен бастап T-REX және айқын Rescue басымдығы жоқ T-REX үшін келесі құрылымдық жағынан бірегей хитке дейінгі GPU сағаттары. Нүктелер жеке қалпына келтіру оқиғаларын көрсетеді; үлкенірек маркерлер мен жолақтар медианалар мен квартильаралық ауқымдарды көрсетеді. c. Әрбір шешім туралы ақпарат беретін негізгі деректер бойынша топтастырылған 1305 генерация және қайта жобалау тапсырмалары бойынша R/E/X басымдықтары. d. c тармағындағыдай негізгі деректер бойынша топтастырылған сол тапсырмалар үшін кейінгі дизайн стратегиялары.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;LLM агенттері (бұл жағдайда Qwen3.6-27B-FP8 негізінде) — әрекеттерді дербес жоспарлауға, аралық нәтижелерді талдауға және мәтіндік деректер негізінде шешім қабылдауға қабілетті бағдарламалар.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;T-REX әдісін бағалау тек есептеу ортасында, сәтті және бірегей нәтижелерді анықтау үшін орныққан in silico метрикаларын қолдана отырып жүргізілді. Эксперименталды тексеру қажет болғанымен, T-REX құрамындағы жеке генераторлар (Proteína-Complexa, BindCraft және BoltzGen) бұрынғы зерттеулерінде эксперименталды түрде расталған байланыстырғыштарды шығарған. Шынайы de novo дизайны сонымен қатар байланысу аффинндігін, ерекшелігін және әзірлену мүмкіндігін бағалауды талап етеді. Болашақта T-REX жүйесін робототехникамен және дербес зертханалармен біріктіру жобалау мен сынақ циклін жақындата алады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;T-REX әдісі науқан күйін құрылымдық ұсыну, LLM негізіндегі ұсыныстар және детерминирленген ресурстарды бөлу арқылы есептеу тиімділігін арттырады.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Әдісті бағалау тек виртуалды ортада орындалған, ал толыққанды енгізу үшін ақуыздардың нақты аффинндігі мен ерекшелігін бағалайтын эксперименталды тексеру қажет.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"41-kampaniya-specifikaciyasy-zhaene-ortakh-aereketter-kengistigi\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#41-kampaniya-specifikaciyasy-zhaene-ortakh-aereketter-kengistigi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.1. Кампания спецификациясы және ортақ әрекеттер кеңістігі&lt;/span&gt;&lt;/a&gt;4.1. Кампания спецификациясы және ортақ әрекеттер кеңістігі&lt;/h4&gt;\n&lt;p&gt;Кампанияны баптау және басқарушылар. T-REX жүйесі бекітілген есептеу бюджеті шеңберінде құрылымы жағынан әртүрлі байланыстырушы ақуыздардың (хиттердің) санын барынша арттыру үшін есептеу тапсырмаларын бейімделгіш түрде таңдайды. Кампания бір нысана үшін белгіленген ресурс бюджеті мен бірнеше графикалық процессорлардың көмегімен орындалатын генерациялау, қайта жобалау және бағалау тапсырмаларын қамтиды. Әрбір нысана үшін алдын ала белгіленген құрылым және байланысу сайтының ыстық нүктелері, сондай-ақ ақуыз ұзындығының стандартты диапазоны қолданылды (S1-кесте). Құрылымдық жағынан бірегей хиттер 4.2-бөлімде сипатталған компьютерлік іріктеу критерийлері мен кластерлеу арқылы есептелді. T-REX, PUCT және ε-greedy алгоритмдері кампания деңгейіндегі басқарушылар ретінде қызмет етті және олар ортақ параметр шекаралары мен бірыңғай орындау және бағалау ортасы бар бірдей әрекеттер кеңістігінде жұмыс істеді. PUCT және ε-greedy алгоритмдері үлкен тілдік модельдер негізіндегі мәнмәтіндік пайымдауларды қолданбай, скалярлық марапаттарға негізделген ресурстарды бөлуді пайдаланды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Әрекеттер кеңістігі — бұл жүйе ең жақсы ақуыз молекулаларын іздеу үшін басқаратын қолжетімді алгоритмдер мен олардың баптауларының жиынтығы.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ортақ әрекеттер кеңістігі. Бұл кеңістік кампанияда рұқсат етілген сегіз әрекет отбасы мен конфигурацияларын қамтиды: Complexa іздеудің төрт түрі көмегімен de novo генерациялау (сәулелік іздеу, best-of-n, Фейнман–Кац басқаруы және Монте-Карло ағашын іздеу), сондай-ақ BindCraft пен BoltzGen; ProteinMPNN көмегімен тізбекті қайта жобалау; және AF2 көмегімен бағалау. Осы кеңістік шеңберінде әрекет отбасы есептеу әдісін анықтайды, бағыт ұқсас баптаулары бар генерация немесе қайта жобалау тапсырмаларын топтастырады, ал тапсырма орындалатын нақты есептеуді, соның ішінде рұқсат етілген параметрлерді белгілейді. Басқарушылар отбасына тән баптаулар мен Complexa марапат шарттарының немесе BindCraft жоғалту салмақтарының мәндерін алдын ала белгіленген шекте реттей алатын. Алдын ала оқытылған модельдердің салмақтары мен әрекеттер кеңістігі кампания бойы өзгеріссіз қалды.&lt;/p&gt;\n&lt;p&gt;Кампанияны орындау. Барлық үш бейімделгіш басқарушылар ортақ бастапқы баптаулары бар алдын ала анықталған Complexa Beam, BoltzGen және BindCraft тапсырмаларымен жұмысты бастады. PUCT пен ε-greedy қосымша өздерінің төртінші жұмыс ағынында Complexa best-of-n тапсырмасын бастады. Нәтижелердің келіп түсуіне қарай келесі тапсырмалар жиналған деректер негізінде таңдалды. Жұмысшыларды пайдалану әр тапсырма бойынша, ал біліктілік әр дизайн бойынша есептелді. Басқарушы статистикасы үшін бағыттар нәтижелерді жинақтау бірлігі болып қызмет етті. Қайта жобалау бағыттары бастапқы генерация мәнмәтінін сақтап қалды. Операциялық тұрғыдан әрбір кампания жинақтау, жоспарлау және орындау циклі бойынша жүзеге асырылды: аяқталған тапсырмалар деректерді жаңартты, басқарушы оларды болашақ жұмысты жоспарлау үшін пайдаланды, ал олардың нәтижелері кейінгі шешімдерге негіз болды.&lt;/p&gt;\n&lt;h4 id=\"42-zhobalau-biliktiligi-zhaene-oetkizu-khabiletin-oelsheu\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#42-zhobalau-biliktiligi-zhaene-oetkizu-khabiletin-oelsheu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2. Жобалау біліктілігі және өткізу қабілетін өлшеу&lt;/span&gt;&lt;/a&gt;4.2. Жобалау біліктілігі және өткізу қабілетін өлшеу&lt;/h4&gt;\n&lt;p&gt;Дизайнды сапалық іріктеу және өткізу қабілетін өлшеу екі кезеңде жүзеге асырылды: алдымен нұсқалар жалпы іріктеу критерийлеріне сай болуы тиіс еді, содан кейін сападан өткен байланыстырушы тізбектер құрылымдық жағынан ерекше хиттерді (SU) анықтау үшін кластерлерге біріктірілді. Дизайндар тек байланыстырушының pLDDT көрсеткіші ≥ 90, қалыптасқан iPAE мәні ≤ 7/31 және байланыстырушының scRMSD ауытқуы &amp;lt; 1.5 Å болған жағдайда ғана жарамды деп танылды. Бұл шекті мәндер Proteina-Complexa бағалау хаттамасынан және ColabDesign негізіндегі стандартты AF2-Multimer хаттамасының өлшемдерінен алынды. Қалыптасқан iPAE мәні байланыстырушыдан нысанаға және нысанадан байланыстырушыға бағытталған екі PAE орташа мәндерінің қосындысын 31-ге бөлу арқылы есептелді. Байланыстырушының scRMSD көрсеткіші сәйкес нысана Cα атомдарын Кабш әдісі бойынша түзегеннен кейін жасалған және AF2 болжаған байланыстырушы құрылымдары арасындағы Cα орташа квадратының түбірлік ауытқуы ретінде анықталды. Complexa жүйесі генерация барысында барлық үш сапалық өлшемді өзі шығарды, ал BindCraft, BoltzGen және ProteinMPNN қайта жобалау нәтижелері 4.5-бөлімде сипатталған ережелерге сәйкес бөлек стандартталған AF2 бағалауды талап етті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стандартталған AF2 бағалауы және pLDDT, iPAE, сондай-ақ scRMSD сияқты көрсеткіштер тұрақты әрі сапалы ақуыз кешендерін нақты іріктеп алуға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Құрылымдық жаңашылдықты бағалау кезінде, егер жарамды дизайнның байланыстырушы тізбегі науқанда бұрыннан бар құрылыммен кластерленсе, ол жаңа SU қоспады деп есептелуі мүмкін еді. Foldseek бағдарламасы әр науқан шеңберінде жарамды байланыстырушы тізбектерді TM0.6 көрсеткіші бойынша бөлек кластерледі; бұл шекті мән бұрын жасалған ақуыз қаңқаларының құрылымдық алуан түрлілігін анықтау үшін қолданылған. Қосымша сезімталдық талдауы ретінде TM0.5 және TM0.8 мәндері де бағаланды (S14-кесте). Әрбір қорытынды кластер құрылымдық тұрғыдан бірегей бірлік (SU) ретінде есептелді, бұл биологиялық фолд немесе эпитоп ұқсастығын емес, дәл құрылымдық ұқсастықты сандық түрде бағалады. Хаттама және кластерлеу туралы егжей-тегжейлі мәліметтер B.1–B.2 бөлімдерінде және S4-кестеде келтірілген.&lt;/p&gt;\n&lt;p&gt;Өткізу қабілетін өлшеу кезінде T-REX, PUCT немесе ε-greedy адаптивті әдістерімен басқарылатын науқандардың қорытынды SU саны науқан барысында жасалған соңғы дәлелдер жиынтығынан көшірілмей, түпкілікті науқан жазбаларынан қайта есептелді (4.3-бөлімді қараңыз). Әрбір SU бағалау тапсырмасына емес, таңдалған өкілді нұсқаны жасаған генерация немесе қайта жобалау тапсырмасына жазылды; әр кластерден бір өкіл дизайнды таңдау ережелері B.2-бөлімінде берілген. Өткізу қабілеті NSU/H ретінде анықталды, мұндағы NSU — қорытынды кластерлер саны, ал H — негізгі бенчмарктегі әрбір әдіс пен нысана комбинациясы үшін 144 H100 жұмысшы GPU-сағаты. Адаптивті науқандар үшін генерация, қайта жобалау және стандартталған AF2 бағалау осы бюджетке кірді, өйткені бұл есептеулер науқан барысында орындалып, кейінгі бөлуге әсер етуі мүмкін еді. Тек генераторды қолданатын базалық әдістер үшін генерация мен іздеу бюджетке есептелді, бірақ генерация мерзімі аяқталғаннан кейін орындалған стандартталған AF2 бағалау шығарылып тасталды, өйткені ол қандай дизайн жасалғанына әсер ете алмас еді. T-REX үшін тіл моделіне (LLM) қызмет көрсету және апостериорлы талдаулар H көрсеткішіне енгізілмеді, өйткені бұл параметр дизайн науқаны кезінде пайдаланылатын жұмысшы есептеу қуатын қамтуға арналған. Баламалы есепке алу және науқан деңгейіндегі статистика D.1.3 және D.1.1-бөлімдерінде көрсетілген.&lt;/p&gt;\n&lt;h4 id=\"43-naukhan-muraghaty-zhaene-daeleldemelerdi-khuru\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#43-naukhan-muraghaty-zhaene-daeleldemelerdi-khuru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3. Науқан мұрағаты және дәлелдемелерді құру&lt;/span&gt;&lt;/a&gt;4.3. Науқан мұрағаты және дәлелдемелерді құру&lt;/h4&gt;\n&lt;p&gt;Жоспарлау, орындау және нәтижелер циклінің ашықтығын қамтамасыз ету үшін әрбір науқан барысында арнайы мұрағат жүргізілді. Жүйе ескі файлдарды өшірмей, жаңа жазбаларды үнемі қосып отырды. Негізгі ғылыми нәтижелер мен жоспарлау ақпаратын сақтау үшін үш жазба түрі қолданылды: ResultRecord, EvidenceSummary және HypothesisCard. ResultRecord жазбасы тапсырманың орындалу нәтижесін немесе қатесін тіркеп, әрбір нәтижені әрекеттер тобымен, бағытпен және ата-аналық дизайнмен байланыстырды. Сондай-ақ онда өлшемдер, жұмысшы есептеу ресурстары, орындалу күйі және файлдарға сілтемелер сақталды. Тапсырма бірнеше ResultRecord өндіре алатын. Егер дизайн жарамсыз болса да, ResultRecord қате күйін тіркейтін. Бұдан басқа, мұрағатта кандидаттық тапсырмалар, Supervisor рейтингтері, ресурстарды бөлу пропорциялары және LLM шақыру аудиті сақталды (Сурет S3).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS3.jpg\" alt=\"Сурет S3 / Үш T-REX іске қосылуы кезіндегі онлайн SU санақтары.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S3 / Үш T-REX іске қосылуы кезіндегі онлайн SU санақтары.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Сурет S3 / Үш T-REX іске қосылуы кезіндегі онлайн SU санақтары. Әрбір панель алдын ала белгіленген 144 H100 жұмысшы-GPU-сағ бөлшегі үшін бір нысанаға арналған дербес инициализацияланған үш науқанды көрсетеді. Тұтас қадамдар Foldseek кластерлеуі жаңартылған кезде азаюы мүмкін мұрағатталған онлайн TM0.6 SU санақтарын көрсетеді; ашық символдар түпкілікті қайта есептелген TM0.6 SU санақтарын көрсетеді. 2d суреті мен S9 қосымша кестесі тиісті адаптивті контроллерлерді салыстырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;EvidenceSummary жиынтығын құру Жоспарлаушы жаңа тесттерді ұсынғанға дейін жүзеге асырылды. Арнайы детерминирленген код мұрағатталған нәтижелер мен ресурстар негізінде EvidenceSummary жасады. Бұл жиынтық Жоспарлаушы мен Supervisor үшін ортақ контекст болды, ал олардың промптарына қысқартылған нұсқасы берілді. Сурет 1d көрсетілгендей, жиынтық деректерді алты бағыт бойынша ұйымдастырды: (1) құрылым сапасы; (2) құрылым жаңалығы; (3) нақты бағыт шығыны мен өнімі; (4) күтілетін бағалаулар; (5) ата-аналық желі және нәтижелер; (6) GPU ресурстары және белсенді тапсырмалар. Сонымен қатар, жүйе сәттілікке жақын нәтижелерді (near-miss) және көмекші өлшемдерді сақтады. Көмекші өлшемдерге ipTM, ipSAE, интерфейс энергиясы кірді. Толық схема мен сапа есептеулері Сурет S4.1–S4.3 сипатталған, ал LLM үшін қысқарту Сурет S5.2 берілген.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS4.jpg\" alt=\"Сурет S4 / Үш біліктілік критерийін бір мезгілде қатаңдатуға сезімталдық. Нормативтік pLDDT, iPAE және scRMSD өту шектер\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S4 / Үш біліктілік критерийін бір мезгілде қатаңдатуға сезімталдық. Нормативтік pLDDT, iPAE және scRMSD өту шектері кем дегенде 𝜏 болатын талапты қанағаттандыратын таңдалған өкілі бар жұмысшы-GPU-сағ başına тіркелген түпкілікті Foldseek TM0.6 кластерлері; 𝜏 = 0 бастапқы біліктілік ережесін қалпына келтіреді. Жылдамдықтар 144 H100 жұмысшы-GPU-сағ алдын ала белгіленген бөлшегін пайдаланады.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS4-2.jpg\" alt=\"Сурет S4 (жалғасы 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S4 (жалғасы 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS4-3.jpg\" alt=\"Сурет S4 (жалғасы 3)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S4 (жалғасы 3)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS4-4.jpg\" alt=\"Сурет S4 (жалғасы 4)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S4 (жалғасы 4)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS5.jpg\" alt=\"Сурет S5 / Нысаналар бойынша түпкілікті T-REX TM0.6 құрылымдық-бірегей бірліктерінің әрекет отбасы атрибуциясы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S5 / Нысаналар бойынша түпкілікті T-REX TM0.6 құрылымдық-бірегей бірліктерінің әрекет отбасы атрибуциясы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Сурет S5 / Нысаналар бойынша түпкілікті T-REX TM0.6 құрылымдық-бірегей бірліктерінің әрекет отбасы атрибуциясы. Әрбір баған таңдалған өкілді тікелей шығарған генерация немесе қайта жобалау отбасына сәйкес нысананың түпкілікті Foldseek TM0.6 кластерлерін бөледі; оң жақтағы белгілер құрылымдық-бірегей бірліктердің (SU) жалпы санын береді. Әрбір кластер бір рет есептелді және нәтижеге баға берген стандартталған AF2 тапсырмасы тікелей кредит алмады. Генерация немесе қайта жобалау тапсырмасы бірнеше дизайн шығара алады және сондықтан бірден көп SU-ға үлес қоса алады. График себептік үлес тиімділігін немесе бір басталуға шаққандағы тиімділікті емес, нәтиже атрибуциясын сипаттайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Детерминирленген код — бұл кіріс деректері бірдей болған кезде әрқашан бірдей нәтиже беретін қатаң ережелері бар алгоритм.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Науқан күйін тағайындау LLM пайымдаулары үшін контекст берді (Сурет 1d). Арнайы детерминирленген классификатор жеті науқан күйінің бірін тағайындады: дәлелдердің аздығы, құрылымдық дубликаттардың колапсы, өнімді, дубликатпен өнімді, near-miss байытылған, тоқырау немесе терең тоқырау. Классификатор өнімділікті, дубликацияны және есептеу ресурстарын талдады. Егер бірнеше күйдің шарттары орындалса, басымдықтар тәртібі қолданылды, ал әдепкі бойынша дәлелдердің аздығы таңдалды. Тағайындалған белгі EvidenceSummary құрамына енгізілді. Күй анықтамалары мен шектері Сурет S4.5 берілген.&lt;/p&gt;\n&lt;h4 id=\"44-daelelderge-negizdelgen-zhosparlau-zhaene-gipoteza-bojynsha-keri-bajlanys\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#44-daelelderge-negizdelgen-zhosparlau-zhaene-gipoteza-bojynsha-keri-bajlanys\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.4. Дәлелдерге негізделген жоспарлау және гипотеза бойынша кері байланыс&lt;/span&gt;&lt;/a&gt;4.4. Дәлелдерге негізделген жоспарлау және гипотеза бойынша кері байланыс&lt;/h4&gt;\n&lt;p&gt;LLM агенттерінің рөлдері. T-REX жүйесі LLM негізіндегі екі контроллер рөлін — Жоспарлаушы мен Супервизорды (1д-Сурет) пайдаланды. Екеуі де vLLM көмегімен бірдей жергілікті түрде жұмыс істейтін Qwen3.6-27B-FP8 моделі негізінде жасалды, бірақ бөлек промпттар мен &lt;a href=\"concepts/structured-output.html\"&gt;құрылымдалған шығыс&lt;/a&gt; схемаларын қолданды (Team, 2026; Kwon et al., 2023). Авторлар бұл ашық салмақты модельді бекітілген, нұсқасы бар модель снимкімен және алдын ала белгіленген қызмет көрсету конфигурациясымен жергілікті орналастыруды қамтамасыз ету үшін таңдады. Модель бір H100 графикалық процессорында жұмыс істетілді. Жеті негізгі науқан барысында 3125 LLM шақыруының тек 7-сі (0.22%) құрылымдалған шығысты валидациядан өте алмаған жауаптар берді; бұл жауаптар іске қосылу мақұлданғанға дейін қабылданбай, детерминирленген қосалқы жолдарды іске қосты (S15-Кесте). Функционалды түрде Жоспарлаушы нені және не үшін әрі қарай сынау керектігін ұсынса, Супервизор қай валидацияланған кандидаттар болашақта жұмысшылардың іске қосылуын алуы тиіс екенін басымдыққа бөлді. Ешбір LLM тапсырмаларды тікелей іске қосқан жоқ; кандидаттарды жасау, валидациялау, қабылдау, диспетчерлеу және орындау детерминирленген контроллер логикасымен басқарылды (4.5-Бөлім; C.8.2-Қосымша бөлім).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Құрылымдалған шығыс (structured-output) — бұл жасанды интеллект моделінің жауаптарын қатаң түрде алдын ала белгіленген үлгіде (мысалы, JSON форматында) қалыптастыруға мәжбүрлейтін техникалық механизм.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;LLM шешімдерін басшылыққа алу. Екі промпт та кейιнгі жұмыс өнімді бағытты кеңейтуі, анықталған әлсіздікті жоюы немесе баламалы жолды немесе конфигурацияны сынауы керек пе деген бағытта нұсқаулар берді. Бағыттың өнімділігі қажетті бағалау және ата-тектік тапсырмаларды қоса алғанда, осы бағытқа жұмсалған бір GPU-сағатқа шаққандағы жаңа TM0.6 құрылымдық пайдалылық бірліктерінің (SU) соңғы саны ретінде өлшенді. Әрі қарайғы есептеулер үшін қай бағыттарға басымдық беру керектігін анықтау үшін промпттар екі LLM рөліне де соңғы бағыт өнімділігін негізгі сандық критерий ретінде пайдалануды бұйырды. Өнімділігі төменірек бағыттың соңғы жаңа TM0.6 SU/GPU-сағат көрсеткіші өнімділігі жоғарырақ бағыттікінің кемінде 85%-ын құраған кезде, екі бағыт өнімділігі салыстырмалы деп есептелді, алайда екі промпт та бұл салыстыру аз бақылауларға немесе шағын есептеулерге негізделген кезде сақ болуды ескертті. Мұндай бағыттар үшін LLM рөлдеріне сапа көрсеткіштерінің 25-ші перцентилі жоғарырақ бағытті артық көру тапсырылды, ал медиана келесі салыстыру ретінде пайдаланылды (C.5.3, C.7 және C.4.3-Қосымша бөлімдер).&lt;/p&gt;\n&lt;p&gt;Жоспарлау. Жоспарлаушы EvidenceSummary және науқан күйінің контекстін, сондай-ақ сегізге дейін белсенді немесе жуырдағы HypothesisCards (гипотеза карточкаларын), қолжетімді әрекет отбаларын және олардың рөлдерін, рұқсат етілген параметрлер мен әр тапсырма үшін жұмыс жүктемесі шектеулерін алды. Промпт бір мен төрт аралығындағы жаңа HypothesisCards сұрады, олардың әрқайсысы дәлелдерге байланысты гипотезаны және ұсынылатын кейінгі есептеу сынағын сипаттады. Әрбір жаңа карточка қолдаушы дәлелдерге сілтеме жасады, әрекет отбалары мен параметрлерін ұсынды және сынақтың Rescue, Explore және eXploit үшін өзектілігін көрсетті. Сондай-ақ ол таңдалған біліктілік өлшемдерінің қалай өзгеретінін болжады және тиісті жағдайда басқа өлшемдердің белгіленген шектен тыс нашарламауы тиісін анықтады. Қызмет көрсету параметрлері, промпт мәліметтері және шақыру шарттары C.5 және C.5.4-Қосымша бөлімдерде көрсетілген.&lt;/p&gt;\n&lt;p&gt;Тексеру + Құрастыру және кандидаттарды валидациялау. Жоспарлаушы ұсыныстары тікелей орындалуға жатпады. Тұрақты Check + Build логикасы жаңа немесе сақталған HypothesisCards карточкаларын нақты ActionCandidates кандидаттарына айналдырды және сұралған операцияны, тіркелген әрекет отбасын, рұқсат етілген параметр мен жұмыс жүктемесі шекараларын, қажетті кіріс файлдарын және тиісті жағдайда ата-аналық жарамдылықты тексерді. Рұқсат етілген детерминирленген түзетулер қолданылды, әйтпесе жарамсыз кандидаттар қабылданбады. Бұл валидация қатаң әрекет кеңістігін сақтауды қамтамасыз етті, бұл LLM-ге тіркелмеген әрекет отбандарын енгізуге, алдын ала белгіленген параметр шектерін асып кетуге немесе мақсат, біліктілік критерийлері, құрылымдық жаңалық ережесі немесе жұмысшы бюджеті сияқты бекітілген науқан анықтамаларын өзгертуге жол бермеді. Тек құрастыру тексеруінен өткен кандидаттар ғана Супервизордың басымдық беруіне және кейінгі қабылдануына лайық болды. Check + Build тексеруінен өту жасалу уақытында жарамдылығын растады, бірақ орындалуына кепілдік бермеді; кандидаттар 4.5-бөлімде сипатталған соңғы қабылдау ережелері мен тікелей диспетчерлік тексерулерге бағынуын жалғастырды.&lt;/p&gt;\n&lt;p&gt;Супервизордың басымдығы мен бөлуі. Супервизор EvidenceSummary және науқан күйінің контекстін, сондай-ақ Жоспарлаушыдан гипотезалар мен жарамды кандидат тапсырмаларды алды. Ол кандидат тапсырмаларды орындауға ұсынды, әрбір ұсынылған тапсырманы Rescue, Explore немесе eXploit санатына тағайындады және оларды барлық үш басымдық бойынша рейтингке қойды. Сондай-ақ ол әрбір басымдық астында орындалатын тапсырмалардың қажетті пропорцияларын көрсететін қалыптастырылған R/E/X қоспасын қайтарды. Толық кіріс және шығыс сипаттамалары, рейтинг бойынша нұсқаулар мен бөлу ережелері C.5.2 және C.7-Қосымша бөлімдерде келтірілген.&lt;/p&gt;\n&lt;p&gt;Гипотеза бойынша кері байланыс. Кандидат тапсырмаларды таңдағаннан кейін контроллер Жоспарлаушы бұрын ұсынған кейінгі сынақтардың нәтижелерін бағалау үшін алдын ала белгіленген ережелерді пайдаланды. Әрбір HypothesisCards карточкасымен байланысты нәтижелер бұрын байқалған эталондық нәтижемен салыстырылды және қолдаушы, қайшы келетін немесе бейтарап деп жіктелді. Жиналған нәтижелер картаның қолдау тапқанын, жоққа шығарылғанын немесе белгіленген қызмет ету мерзімі аяқталғаннан кейін белсенді емес екенін анықтады. Бұл мәртебелер кейінгі Жоспарлаушы мен Супервизордың шешімдеріне әсер етті, бірақ жобаның біліктілігіне, SU несиесіне немесе ұсынылған себеп-салдарлық түсіндірмені валидациялауға әсер еткен жоқ. Толық бағалау және мәртебені жаңарту ережелері C.9-Қосымша бөлімде, ал практикалық мысал D.2.2-Қосымша бөлімде келтірілген.&lt;/p&gt;\n&lt;h4 id=\"45-tapsyrmalardy-asinhrondy-tuerde-boelu-zhaene-oryndau\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#45-tapsyrmalardy-asinhrondy-tuerde-boelu-zhaene-oryndau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.5. Тапсырмаларды асинхронды түрде бөлу және орындау&lt;/span&gt;&lt;/a&gt;4.5. Тапсырмаларды асинхронды түрде бөлу және орындау&lt;/h4&gt;\n&lt;p&gt;Үміткер тапсырмаларды таңдау 4.4-бөлімде сипатталған құрастыру арқылы тексерілген тапсырмаларға негізделді. Супервайзер ұсынылған әрбір үміткер тапсырманы Rescue, Explore немесе eXploit (R/E/X) категорияларының біріне тағайындады және оларды үш басымдық бойынша ретке келтірді. Бақылаушы бұл тапсырмаларды реттілік тәртібімен қарастырды және алдын ала белгіленген орындалу мүмкіндігі мен ресурс шектеулерін ескере отырып, кейінгі генерация және қайта жобалау басталуларын қалай бөлу керектігін бағыттау үшін R/E/X қоспасын қолданды. Егер ортақ жұмысшы кезграфіне қосымша тапсырмалар қабылданса, бақылаушы оларды әрекет отбасылары, маршрут өнімділігі және бағаланған тапсырма құны бойынша соңғы басталуларға негізделген детерминирленген ережелер арқылы қалған жарамды үміткерлердің арасынан таңдап алды. Таңдалған тапсырмалар ортақ жұмысшы кезграфіне енді, бірақ нақты R/E/X үлестіριміне тек расталған генерация және қайта жобалау басталулары ғана үлес қосты. Үміткерлерді ретке келтіру, бөлу, сақтық нұсқалары және диспетчерлеу ережелері C.7 қосымша бөлімінде және S8 кестесінде келтірілген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тапсырмаларды асинхронды орындау және динамикалық ресурстарды басқару есептеу қуаттарының бос тұруына жол бермей, нәтижелерді үздіксіз өңдеуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жұмысшыларды жоспарлау және асинхронды орындау барысында: T-REX жүйесі үш H100 GPU жұмысшысын және LLM қызмет көрсету үшін бөлек H100 GPU пайдаланды; PUCT және ε-greedy төрт жұмысшыдан қолданады. T-REX есеп беру бюджеті 144 жұмысшы GPU-сағатты құрады, бұл 48 сағат ішіндегі үш жұмысшы слотына сәйкес келеді (3 × 48 = 144). Жұмысшы босаған кезде, бақылаушы келесі тапсырманың кіріс деректерін, ата-аналық элементтердің жарамдылығын және ресурс қолжетімділігін оны бастау немесе кейінге қалдыру алдында қайта тексерді. Аяқталған нәтижелер науқан деректеріне олар қолжетімді болған бойда біріктірілді, бұл басқа тапсырмалар әлі орындалып жатқан кезде кейінгі жоспарлау мен тапсырманы таңдауда оларды пайдалануға мүмкіндік берді. Кезгекке қабылдау, жұмысшыларды іске қосу, параллелизм шектеулері және қателерді өңдеу ережелері C.8 қосымша бөлімінде сипатталған, ал бақылаушының жұмыс үрдісі S1 алгоритмінде жинақталған.&lt;/p&gt;\n&lt;p&gt;AF2 бағалауын қабылдау стандартталған AF2 бағалауы үшін генерация мен қайта жобалаумен бірдей үш жұмысшы GPU-ны пайдаланды, бірақ бөлек детерминирленген қабылдау саясатын ұстанды. Жарамды құрылымдары бар дизайн осы бағалауға генерация кезінде үш міндетті біліктілік өлшеуінің біреуі немесе бірнешеуі есептелмеген жағдайда рұқсат етілді (1e-сурет). Алдын ала белгіленген детерминирленген бақылаушы ережелері қай жарамды дизайнның бағаланатынын және қандай тәртіппен бағаланатынын анықтады. AF2 бағалауын талап ететін әрбір маршрут үшін бастапқыда төрт дизайнға дейін бағалануы мүмкін еді. Ағымдағы лимит шеңберіндегі барлық бағалаулардың нәтижелері алынғаннан кейін, жиынтық лимит 8, 16, 32 және 64 бағалауға дейін біртіндеп артуы және содан кейін екі еселенуді жалғастыруы мүмкін еді, бірақ тек маршрут алдыңғы лимит шекарасына қатысты жақсару белгілерін көрсеткен жағдайда ғана. Жақсару маршрутқа қатысты жаңа SU-лардың, жақын сәтсіздіктер (near-miss) санының, білікті құрылымдық кластерлер санының, білікті дизайн сапа көрсеткіштерінің 25-ші перцентилі немесе медианасының немесе дереккөзге тән көмекші диагностикалық балдың өсуі ретінде анықталды. Білікті дизайнның сапа көрсеткіштері құрылымдық кластер бойынша ең жоғары бал алған дизайнды сақтай отырып, үш қалыптастырылған өту шегі негізінде есептелді. Нақты бал анықтамалары, салыстыру ережелері, сыйымдылық шектеулері және бос сыйымдылық ерекшелігі C.4.3 және C.8.1 қосымша бөлімдерінде көрсетілген.&lt;/p&gt;\n&lt;p&gt;Науқанды аяқтау және соңғы нүктелерді қайта құру келесідей орындалды: «деректер – жоспарлау – орындау» циклі алдын ала белгіленген 48 сағаттық науқан уақыт шегіне жеткенге дейін жұмыс істеді; науқандар науқан күйіне, жаңа SU-лардың жоқтығына немесе бұрын алынған SU-лар санына байланысты аяқталмады. Бақылаушы уақыт шегін циклдің әрбір өтуі алдында тексеріп отырды; бұрыннан орындалып жатқан өтудің аяқталуына рұқсат етілді. Тоқтату кезінде әрбір жұмыс істеп тұрған тапсырмаға аяқтау үшін 600 секундқа дейін уақыт берілді. Аяқталған тапсырмалардың нәтижелері талданды. Орындау тоқтатылғаннан кейін, біліктілік критерийлері жарамды құрылымы және барлық үш міндетті біліктілік өлшеуі бар шығыстар үшін мұрағаттағы соңғы ResultRecord жазбаларына, соның ішінде тоқтату кезінде қалпына келтірілген кез келген осындай шығыстарға қатысты қайта қолданылды. Foldseek TM0.6 кластерлеуі біліктіліктен өткен дизайндар үшін қайта есептелді. Тоқтату, соңғы нүктеге қосу және кластерлеу ережелері C.8.3, B.3 және B.2 қосымша бөлімдерінде берілген.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 1.&lt;/strong&gt; T-REX пен базалық әдістер үшін ақуыз байланыстырғыш дизайн нәтижелерінің өткізу қабілеті&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Жоспарлаушы&lt;/th&gt;\n&lt;th&gt;LLM&lt;/th&gt;\n&lt;th&gt;Қысқартылған EvidenceSummary; науқан архивінен белсенді немесе соңғы HypothesisCards; қолжетімді әрекет отбасылары мен рұқсат етілген параметрлер.&lt;/th&gt;\n&lt;th&gt;Дәлелдемелермен байланыстырылған гипотезалары, кейінгі сынақтары және болжанған өлшем өзгерістері бар HypothesisCards.&lt;/th&gt;\n&lt;th&gt;C.5.2–C.5.3&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Hit throughput is reported as the number of &lt;a href=\"concepts/structurally-unique-hits.html\"&gt;structurally unique hits&lt;/a&gt; per GPU-hour under a total 144 H100 worker GPU-hour budget.Hits are designs that pass the prespecified in silico criteria and are clustered with Foldseek at a TM-score threshold of 0.6.Gain columns report the T-REX ratio relative to PUCT and the highest-throughput generator-only (GO) baseline for each target.𝜖-gr., 𝜖-greedy; CX, Complexa-only; BC, BindCraft-only; BG, BoltzGen-only.Bold and underline indicate the highest and second-highest throughput, respectively, for each target.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"46-daeleldemeler-zhiyntyghyn-khuru-zhaene-tuyndy-oelshemder-c4evidencesummary-construction-and-derived-measures\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#46-daeleldemeler-zhiyntyghyn-khuru-zhaene-tuyndy-oelshemder-c4evidencesummary-construction-and-derived-measures\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.6. Дәлелдемелер жиынтығын құру және туынды өлшемдер (C.4.EvidenceSummary construction and derived measures)&lt;/span&gt;&lt;/a&gt;4.6. Дәлелдемелер жиынтығын құру және туынды өлшемдер (C.4.EvidenceSummary construction and derived measures)&lt;/h4&gt;\n&lt;p&gt;Жоспарлаудың әрбір жаңартуында бақылаушы мұрағатталған нәтижелерді кезгекте тұрған және жұмыс істеп тұрған тапсырмалармен, AF2 бағалауын күтіп тұрған дизайндармен және қолжетімді жұмысшы сыйымдылығымен біріктіріп, EvidenceSummary құрады. Онда жиынтық біліктілік пен онлайн SU санағы, соңғы нәтижелер, сондай-ақ маршрут нәтижелері мен шығындары көрсетіледі (S1b-сурет). C.5.2 бөлімінде LLM-ге берілетін кішірек кіріс деректері сипатталған; D.2.1 бөлімінде JSON мысалы келтірілген.&lt;/p&gt;\n&lt;h4 id=\"c41-daeleldemeler-mazmuny-zhaene-zhazba-terezeleri\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c41-daeleldemeler-mazmuny-zhaene-zhazba-terezeleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.4.1. Дәлелдемелер мазмұны және жазба терезелері&lt;/span&gt;&lt;/a&gt;C.4.1. Дәлелдемелер мазмұны және жазба терезелері&lt;/h4&gt;\n&lt;p&gt;Өлшемдерді бағалау үшін медиандық мәндер мен біліктілік шектеріне дейінгі қашықтықтар, сондай-ақ сәтті, сәттілікке жақын (near-pass) және сәтсіз нәтижелердің саны қолданылады. Қатаң біліктілік strict ретінде белгіленеді. Foldseek TM0.6 онлайн тағайындаулары мен дупликация көрсеткіштері кластерлеу күйі мен қамтуды қамтиды. Қолжетімділік метрикалары ($ ext{metric_availability}$) деректердің бар-жоғын тіркейді, ал жетіспейтін мәндер толтырылмайды және қате ретінде қарастырылмайды. Жиынтық жиынтықтар барлық қолжетімді нәтижелерді пайдаланады, ал соңғы біліктілік шолулары соңғы 60 нәтиже жазбасын (ResultRecords) талдайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Foldseek пен pLDDT — ақуыз құрылымын талдау құралдары мен метрикалары; олар 3D құрылымдарды жылдам іздеуге және AlphaFold болжамдарының дәлдігін бағалауға мүмкіндік береді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;3–6 графикалық процессор терезесі (worker-GPU-h) жиынтық есептелген құн белгіленген мөлшерге жеткенше жазбаларды ең жаңасынан бастап кері тәртіпте таңдайды. Соңғы дупликация үлесі &lt;span class=\"yfm-latex\" data-content=\"f_%7B%20ext%7Bdup%7D%7D%20%3D%201%20-%20%5Cfrac%7BN_%7B%20ext%7Bclusters%7D%7D%7D%7BN_%7B%20ext%7Bassigned%7D%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; формуласы бойынша есептеледі, мұндағы Nassigned &amp;gt; 0 соңғы 60 жазба арасындағы Foldseek TM0.6 кластері бар жазбаларды, ал Nclusters олардың бөлек кластерлерінің санын білдіреді. Тапшылық өлшемнің біліктілік шегінен қаншалықты қалып қойғанын көрсетеді. Сәттілікке жақын нәтижелер үшін рұқсат етілген шегіністер 5 pLDDT пунктін, 0.05 &lt;a href=\"concepts/predicted-aligned-error.html\"&gt;нормаланған iPAE&lt;/a&gt; және 0.3 Å scRMSD құрайды.&lt;/p&gt;\n&lt;p&gt;Әдістердің жиынтықтары отбасы деңгейіндегі әрекеттерді, аяқталуларды, қателер мен шығындарды біріктіре отырып, тиімсіз тәсілдерді анықтайды. Соңғы жылдамдықтар соңғы 60 нәтиже жазбасындағы жаңа сәттілік бірліктерінің (SU) өсуі негізінде есептеледі. Бұрын сынақтан өткен конфигурациялар нәтижелерді әрекет түрі бойынша топтастырады, ал стратегия мен нәтижелер жиынтығы болашақ жоспарлау циклдерінде қайта пайдалану үшін әр тәсілдің тарихын сақтайды.&lt;/p&gt;\n&lt;h4 id=\"c42-onlajn-esepteu-birlikterin-su-taghajyndau-zhaene-esepteulerdi-esepke-alu\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c42-onlajn-esepteu-birlikterin-su-taghajyndau-zhaene-esepteulerdi-esepke-alu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.4.2. Онлайн есептеу бірліктерін (SU) тағайындау және есептеулерді есепке алу&lt;/span&gt;&lt;/a&gt;C.4.2. Онлайн есептеу бірліктерін (SU) тағайындау және есептеулерді есепке алу&lt;/h4&gt;\n&lt;p&gt;Routeattributionandcost модулі тапсырмаларды C.2.2-бөлімге сәйкес топтастырады. Стандартталған AF2 бағалауы кіріс деректерін тудырған генерация немесе қайта жобалау бағытына бекітіледі. Әрбір білікті онлайн кластер мұрағат тәртібінде өзінің бірінші білікті қатысушысын тудырған бағытқа тура бір есептеу бірлігін (SU) қосады. Басқа бағыттар қосымша SU кредитінсіз білікті қатысушыларға үлес қоса алады. Түпкілікті тағайындау бекітілген өкіл нысанды жасаған тапсырмаға сәйкес келеді (B.2-бөлім). Бағыт құны генерацияны немесе қайта жобалауды, міндетті бағалауды және ата-баба нұсқаларының тіркелген шығындарын қамтиды. Әрбір ата-баба ResultRecord бағыт шеңберінде бір рет есептеледі, бірақ бірнеше бағытта кездесуі мүмкін, сондықтан бағыт шығындарын жай ғана қосу науқан шығынын бермейді. Бірнеше шығысы бар тапсырманың құны оның ResultRecords арасында бөлінеді. Соңғы бағыт шығындары C.4.1-бөлімдегі бүкіл науқан бойынша терезелерді пайдаланады, соның ішінде ата-баба жазбасы терезейден бұрын болса да, қажетті ата-баба шығындарын қамтиды. S6 кестесі бұл шығындарды есеп беру бюджетінен және басқа онлайн уақыт өлшемдерінен ажыратады.&lt;/p&gt;\n&lt;p&gt;S6 кестесінде негізгі есеп беру бюджеті негізгі науқан үшін әрбір бөлінген жұмысшы бір рет есепке алына отырып, H = 144 сағат H100 жұмысшы слоты сағатына бекітілгені көрсетілген; қорытынды көрсеткіш NSU/H ретінде анықталады және бөлек LLM серверін және бастапқы есепке алу кезіндегі кесуден кейінгі генератор бағалауын қоспағанда. Өткен жұмысшы слотының уақыты конфигурацияланған жұмысшылар санына көбейтілген өткен науқан уақыты (worker_wall_gpu_h_total) болып табылады және бос тұрған слот уақытын қамтиды. Тіркелген жұмысшы құны ResultRecord.gpu_h мәндерінің қосындысын (worker_gpu_h_total) білдіреді, ол жұмыс істеп тұрған тапсырмалардың ішінара нәтижелерін қамтиды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;SU есептеу бірліктері мен шығындарды қадағалау ақуыздарды жасау және қайта жобалау тиімділігін бағалауға мүмкіндік береді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Соңғы жіктеуші экспозициясы соңғы 60 нәтиже терезесіндегі жазба шығындарының қосындысы болып табылады; өнімділік ставкасының бөлшемі осы қосынды мен 0.5 GPU сағатының үлкені болып табылады, бұл соңғы онлайн SU өсуімен байланыстырылған (C.4.2-бөлім). Жаңа SU-сыз жұмсалған уақыт тіркелген жұмысшы құны мен жұмыс істеп тұрған слоттардағы өткен уақыттың қосындысынан эталондық құнды шегеру арқылы анықталады (теріс мәндер нөлмен алмастырылады). Тоқтап қалу жағдайларын эскалациялау және сақтық шаралары өткен нақты уақытқа емес, жаңа SU жоқ уақытқа негізделген.&lt;/p&gt;\n&lt;p&gt;Нақты бағыт құны өндірісті, міндетті бағалауды және зарядталған қайта жобалау ата-бабаларын қамтиды. Соңғы бағыт көріністері бағыттарды біріктіруге дейін бүкіл науқанның 3 және 6 GPU сағаттық нәтиже терезелерін пайдаланады, бұл ортақ ата-бабаларға байланысты шығындарды бағыттар бойынша қосылмайтын етіп жасайды.&lt;/p&gt;\n&lt;p&gt;Жаңа онлайн SU және кластерлеу сенімділігі соңғы 60 ResultRecords ішінде алғаш рет көрсетілген онлайн SU ескереді. Әрбір жаңарту кезінде контроллер барлық жазбалардағы және осы терезеге дейінгі жазбалардағы білікті кластерлерді санап шығады, алдыңғы жазбалар санын толық саннан азайтады және ағымдағы кластер тағайындауларын пайдаланады. Өнімді күйді жіктеу Foldseek кластерлеу күйін ok, қамтуды ≥ 0.999, қолжетімді дубликат үлесін және байланыстырушы тізбегінен кешенді кластерлеуге қайту туралы хабардың жоқтығын талап етеді. Қамту — бұл кластерлер саны емес, білікті құрылымдық кластерлерге тағайындалған білікті ResultRecords үлесі. C.4.5-бөлім қосымша шарттарды белгілейді. Жақын жіберіп алулардың оң саны ok немесе cached_ok күйі бар және қамтуы ≥ 0.999 болатын бөлек кластерлеуді талап етінеді, әйтпесе жіктеуші нөл алады.&lt;/p&gt;\n&lt;p&gt;Жаңа онлайн SU жоқ уақыт мұрағат тәртібінде нәтижелерді сканерлеу арқылы эталондық құнды қалпына келтіру көмегімен есептеледі. Егер білікті дизайн өз кластерінің бірінші мүшесі болса, эталон сол нәтижеге дейінгі жиынтық тіркелген жұмысшы құнына айналады (бірінші SU-дан бұрын нөл). Егер жаңарту бұрынғыға қарағанда көбірек SU хабарласа, эталон ағымдағы тіркелген жұмысшы құнына тең болады. Тоқтап қалу уақыты сигналы ағымдағы тіркелген жұмысшы құны мен жұмыс істеп тұрған слоттардағы өткен уақыттың қосындысынан осы эталонды азайту арқылы анықталады.&lt;/p&gt;\n&lt;h4 id=\"c43-onlajn-sapa-zhaene-koemekshi-koersetkishter\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c43-onlajn-sapa-zhaene-koemekshi-koersetkishter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.4.3. Онлайн сапа және көмекші көрсеткіштер&lt;/span&gt;&lt;/a&gt;C.4.3. Онлайн сапа және көмекші көрсеткіштер&lt;/h4&gt;\n&lt;p&gt;Сапалы дизайн үшін өлшемдер біліктілік шектерінен қаншалықты жоғары екенін келесі шектік мәндер арқылы өлшейді: &lt;span class=\"yfm-latex\" data-content=\"u_p%20%3D%20%5Cmax%5C%7B0%2C%20(pLDDT%20-%2090)%2F5%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"u_i%20%3D%20%5Cmax%5C%7B0%2C%20(7%2F31%20-%20iPAE)%2F0.05%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; және &lt;span class=\"yfm-latex\" data-content=\"u_s%20%3D%20%5Cmax%5C%7B0%2C%20(1.5%20-%20scRMSD)%2F0.3%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Әрбір мән ең көбі 3 қосады, ал олардың қосындысы 9-ға бөлініп, 0 мен 1 аралығындағы q дизайн ұпайын береді: &lt;span class=\"yfm-latex\" data-content=\"q%20%3D%20%5C%7B%5Cmin(u_p%2C%203)%20%2B%20%5Cmin(u_i%2C%203)%20%2B%20%5Cmin(u_s%2C%203)%5C%7D%2F9\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Әрбір бағыт пен онлайн Foldseek кластерінде барлық үш өлшемі және ең жоғары q мәні бар квалификацияланған дизайн таңдалады. Әрбір кластер бір сапа бақылауын береді, мұнда кейінгі жоғары ұпайлы дизайн алдыңғысын алмастырады. Таңдалған дизайнның медианасы мен 25-ші перцентилі strict_quality_median және strict_quality_p25 ретінде сақталады. Отбасылық жиынтық ең жоғары 25-ші перцентилі бар бағыттың сапа статистикасын көшіреді. Жоспарлаушы мен Бақылаушы бұл деректерді бағыттарды салыстыру үшін пайдаланады, ал соңғы талдаулар &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; көрсеткішіне сүйенеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Перцентильдер мен шектік рұқсат интервалдары ақуыз дизайн құрылымының сапасын икемді түрде бағалауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қосымша диагностикалық жақсарту ұпайы қосымша өлшемдердің сапа шектеріне сәйкес келетінін немесе бұрынғы нәтижелермен салыстырғанда жақсарғанын жинақтайды. S7 кестесінде көзіне қатысты өлшемдер, шектер, рұқсат етілген ауытқулар, салмақтар мен қабылдау шектері келтірілген. Әрбір бағыт пен өлшем үшін соңғы бақылаулар 6-GPU-сағаттық нәтижелер терезесіндегі шекті мәндер ретінде анықталады. Өлшем кемінде екі соңғы бақылаумен немесе шекті мәнге жеткен бір ғана бақылаумен қолданылады.&lt;/p&gt;\n&lt;p&gt;Тапшылық өлшемнің сапа шегінен қаншалықты артта қалғанын білдіреді, ал шекке жеткен
