2 нәтижесі толық біліктілік ережесінен өткен кезде, жетіспейтін базалық сызық өлшемі қолдау ала алады. Басқа болжамды өзгерістер мен сақталу шектері өз күшінде қалады. Қолдау және қайшылық тәуелсіз түрде есептеледі; ешқандай тестке жауап бермейтін нәтижелер бейтарап болып қалады.&lt;/p&gt;\n&lt;p&gt;Карточка күйі. Берілген науқандарда әрбір қолдаушы нәтиже бір ұпай қосты; екі ұпай карточканы қолдау тапқан ретінде белгіледі. Әйтпесе, кемінде үш бағаланған нәтиже–базалық сызық жұбы және қайшылық үлесі ≥ 0.70 оны теріске шығарылған деп белгіледі (қайшы келетін ретінде мұрағатталған). Бейтарап жазбалар бұл бөлімде қалады. Егер екі шекті мән де орындалса, қолдау көрсету басымдыққа ие болады. Ешқандай шекті мәнге жетпейтін карточка жоспарлау жаңартуларында жасалған сәттен бастап есептелетін көрсетілген өмір сүру мерзіміне дейін белсенді болып қалады (әдепкі бойынша он; рұқсат етілген ауқым бірден жиырмаға дейін), содан кейін зейнетке шығарылады. Байланысқан нәтижелері жоқ мерзімі өткен карточкалар Жоспарлаушы шақырылғанға дейін зейнетке шығарылады; басқа күй жаңартулары жоғарыдағы жаңарту соңындағы бағалауға сәйкес келеді. Қолдау тапқан, теріске шығарылған және зейнетке шығарылған күйлер соңғы болып табылады.&lt;/p&gt;\n&lt;h4 id=\"d-khosymsha-eksperimentter-men-naukhan-taldaulary\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d-khosymsha-eksperimentter-men-naukhan-taldaulary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D. Қосымша эксперименттер мен науқан талдаулары&lt;/span&gt;&lt;/a&gt;D. Қосымша эксперименттер мен науқан талдаулары&lt;/h4&gt;\n&lt;p&gt;Төмендегі талдаулар өткізу қабілеті мен сенімділікті (2-сурет), мұрағатталған кейінгі шешімдерді (3-сурет), бөлу және қалпына келтіруді (4-сурет), сондай-ақ пост-хок сенімділік пен құрылымдық әртүрлілікті (2c және 5-суреттер) зерттейді. Қосымша нысандар бойынша барлау науқандары осы бастапқы бенчмарк талдауларынан кейін жүреді.&lt;/p&gt;\n&lt;h4 id=\"d11-khajtalanatyn-naukhandar\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d11-khajtalanatyn-naukhandar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.1.1. Қайталанатын науқандар&lt;/span&gt;&lt;/a&gt;D.1.1. Қайталанатын науқандар&lt;/h4&gt;\n&lt;p&gt;CD45, SC2RBD және CbAgo бойынша әрбір контроллер үшін тәуелсіз түрде іске қосылған үш науқанның барлығында әрбір T-REX науқаны сол нысандағы кез келген PUCT немесе ε-greedy науқанына қарағанда көбірек соңғы TM0.6 SU өндірді (2d-сурет; S9-кесте). B.7-бөлім репликация дизайнын сипаттайды. S3-сурет онлайн T-REX траекторияларын көрсетеді және соңғы қайта есептелген санақтарды бөлек белгілейді; кластерлеу жаңартылған кезде онлайн санақтар өзгеруі мүмкін (C.4.2-бөлім).&lt;/p&gt;\n&lt;p&gt;CD45, SC2RBD және CbAgo нысандары үшін Worker GPU-h басындағы құрылымдық тұрғыдан ерекшеленетін хиттер саны бойынша кесте деректері T-REX әдісінің барлық үш тәуелсіз іске қосуда (Run 0, Run 1, Run 2) PUCT пен ε-greedy әдістерінен тұрақты түрде басым екенін көрсетеді. CD45 үшін T-REX орташа 2.104 ± 0.014 мәніне жетеді, ал PUCT 0.505 ± 0.331, ал ε-greedy 0.171 ± 0.034 көрсетеді. SC2RBD нысаны үшін көрсеткіштер T-REX үшін 0.370 ± 0.033, PUCT үшін 0.266 ± 0.011 және ε-greedy үшін 0.153 ± 0.018 құрайды. CbAgo нысаны үшін T-REX 0.683 ± 0.125, PUCT 0.382 ± 0.039 және ε-greedy 0.120 ± 0.077 көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"d12-retrospektivti-bakhylau-nuekteleri-zhaene-kishirek-byudzhet-kezindegi-salystyrular\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d12-retrospektivti-bakhylau-nuekteleri-zhaene-kishirek-byudzhet-kezindegi-salystyrular\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.1.2. Ретроспективті бақылау нүктелері және кішірек бюджет кезіндегі салыстырулар&lt;/span&gt;&lt;/a&gt;D.1.2. Ретроспективті бақылау нүктелері және кішірек бюджет кезіндегі салыстырулар&lt;/h4&gt;\n&lt;p&gt;Жиналу қисықтарын қалпына келтіру үшін B.3 бөліміндегі дизайн үшін соңғы біліктілік пен TM0.6 кластер тағайындаулары пайдаланылды. Бейімделгіш қисықтар әр кластерді білікті мүшесі бар ең ерте мұрағаттық есепке байланыстырады; тек генераторға арналған қисықтар S10 кестесінде көрсетілген аяқталу оқиғаларына сүйенеді. Соңғы есептен кейін келіп түсетін PUCT HER2-AAV жазбалары 144 жұмысшы-GPU-сағ шегіне жатқызылады. Соңғы көлденең сегмент кластерлерді қоспастан соңғы санды сол шекте тұрақты ұстайды. Мұндай ретроспективті түрде қалпына келтірілген қисықтар онлайн кластер санақтарынан өзгеше болуы мүмкін. Әдістер бойынша тіркелген оқиғалар әртүрлі болғандықтан, аралық бақылау нүктелері нақты әдісаралық аяқталу уақыттарын емес, жиналу процесін сипаттайды. B жұмысшы-GPU-сағ бақылау нүктесінде N(B) мөлшері B-да немесе одан бұрын оқиға алған соңғы кластерлерді санап шығады, ал N(B)/B қатынасы бақылау нүктесінің жылдамдығын береді (S10 кестесі). Кластер тағайындаулары өзгеріссіз қалады; бұлар B-да дербес тоқтатылып аяқталған науқандар емес, 144 жұмысшы-GPU-сағ дейін жүгіртілген науқандардың бақылаулары болып табылады. 10 жұмысшы-GPU-сағ кезінде T-REX алты нысанада ең үлкен санға ие болды және HER2-AAV бойынша тек-BindCraft-пен тең түсті; ол 50, 100 және 144 жұмысшы-GPU-сағ кезінде барлық жеті нысанада көш бастады. Нысаналар бойынша T-REX/PUCT есептеу қатынастарының геометриялық орташа мәндері сәйкесінше 3.94, 3.10, 2.73 және 2.43 құрады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бақылау нүктелері (checkpoints) есептеу ресурстарының жұмсалуына қарай алгоритмдердің өнімділігін динамикада бағалауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Байестік оңтайландырумен салыстыру көрсеткендей, 100 жұмысшы-GPU-сағ кезінде дербес тоқтатылған SMAC3 науқандары жеті нысана бойынша барлығы 329 соңғы TM0.6 құрылымдық бірлігін шығарды, ал T-REX-тің 100 жұмысшы-GPU-сағ ретроспективті бақылау нүктелері 1,108 бірлікті құрады, және T-REX әрбір нысанада басым болды (S11 кестесі). SMAC3 төрт жұмысшыда шамамен 25 сағаттан кейін тоқтатылды (баптау B.5.2 бөлімінде), ал T-REX бақылау нүктелері 144 жұмысшы-GPU-сағ үшін жоспарланған үш жұмысшылы науқандардан алынған. Бұл салыстыру есептеу көлемін теңестіргенімен, T-REX-ті 100 жұмысшы-GPU-сағ кезінде дербес тоқтату нәтижесін анықтамайды.&lt;/p&gt;\n&lt;h4 id=\"d13-esepteulerdi-esepke-alu-sezimtaldyghy\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d13-esepteulerdi-esepke-alu-sezimtaldyghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.1.3. Есептеулерді есепке алу сезімталдығы&lt;/span&gt;&lt;/a&gt;D.1.3. Есептеулерді есепке алу сезімталдығы&lt;/h4&gt;\n&lt;p&gt;Тілдік модель (LLM) шақыруларының ресурс пен уақыт шығынын талдау 3 125 мұрағатталған модель шақыруын қамтыды. Жалпы аяғына дейінгі кідіріс уақыты 84 533 секундты (23,48 сағ; орташа есеппен бір шақыруға 27,05 с) құрады, бұл 336 сағаттық жалпы номиналды науқан уақытының (7 науқан, әрқайсысы 48 сағаттан) 6,99%-ына тең. LLM қызмет көрсетуі бөлек GPU-да жүзеге асырылды, ал жұмысшы тапсырмалары орындала берді, сондықтан бұл сома науқан ұзақтығының артуын да, кезек толықтырудағы кідірістерді де көрсетпейді. Жұмысшылар бюджетінің негізгі анықтамасы мен соңғы нүктелерді қосу ережелері B.3 бөлімінде келтірілген.&lt;/p&gt;\n&lt;p&gt;Бірінші сезімталдықты талдау әр науқанның қалпына келтірілген жұмысшы уақытына толық 48 сағаттық LLM сервер резерві қосылды. Бұл жеті науқан бойынша барлығы 336 H100 GPU сағатын құрайды немесе жалпы шақыру кідірісінен 14,3 есе көп. Бұл тәсіл үш жұмысшыдан тұратын орындау конфигурациясын сақтай отырып, әрбір T-REX науқанына шамамен 192 H100 GPU сағатын жүктейді. Осыған қарамастан, T-REX әдісі осы есеп айырысу бойынша да барлық нысаналарда PUCT-тен асып түсті: артықшылық жалпы H100 GPU сағатына шаққандағы TM0.6 SU мәнінде 1,03 мен 3,27 есе аралығын құрады, геометриялық орташа мәні 1,82 есе (S12a-кесте).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SU (Success Unit) және геометриялық орташа көрсеткіш — генерация сәттілігі мен әдістің барлық тесттердегі жалпы басымдығын көрсететін өлшемдер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Екінші сезімталдықты талдау толық сервер төлемін сақтап қалды және әр нысана үшін ең күшті түзетілген базалық сызықты таңдамас бұрын, тек генераторлардан тұратын барлық базалық сызықтарға мұрағаттағы кесуден кейінгі AlphaFold2 (AF2) бағалау уақытын қосты. Онлайн T-REX бағалауы жұмысшы уақытына әлдеқашан кіргізілген болатын; Complexa жалпы AF2 өлшемдерін жұмыс барысында қамтамасыз етті және кесуден кейінгі бөлек бағалау шығындарын қажет етпеді. Бұл сценарийде де T-REX барлық нысаналар бойынша көш бастап, 1,07–4,52 есе диапазонында артықшылық көрсетті, геометриялық орташа мәні 1,90 есе болды (S12b-кесте). S12-кестеде көрсетілгендей, a бөлігіндегі T-REX көрсеткіштері, жалпы шығындар мен түзетілген мөлшерлемелер b бөлігіне де қолданылады.&lt;/p&gt;\n&lt;p&gt;a. Толық LLM-сервер ақысы PUCT-ке қарсы&lt;/p&gt;\n&lt;p&gt;T-REX үшін жұмысшы жүктемесі мен толық 48 сағаттық GPU H100 сервер резерві есепке алынды. CD45 нысанасы үшін 143,8 SU, 191,8 жұмысшы GPU сағаты, барлығы 192,0 GPU сағаты және SU/total GPU-h қатынасы 1,570 құрады. BetV1 үшін — 144,0 SU, 192,0 жұмысшы GPU сағаты, барлығы 192,0 GPU сағаты, қатынасы 0,333. CbAgo үшін — 144,0 SU, 192,0 жұмысшы GPU сағаты, барлығы 192,0 GPU сағаты, қатынасы 0,604. HER2-AAV үшін — 144,0 SU, 192,0 жұмысшы GPU сағаты, барлығы 192,0 GPU сағаты, қатынасы 1,063. SC2RBD үшін — 144,0 SU, 192,0 жұмысшы GPU сағаты, барлығы 192,0 GPU сағаты, қатынасы 0,286. PDL1 үшін — 143,8 SU, 191,8 жұмысшы GPU сағаты, барлығы 191,8 GPU сағаты, қатынасы 2,513. IL7RA үшін — 144,0 SU, 192,0 жұмысшы GPU сағаты, барлығы 192,0 GPU сағаты, қатынасы 1,245.&lt;/p&gt;\n&lt;p&gt;LLM сервер төлемінсіз PUCT әдісі үшін CD45 бойынша 143,7 SU, 0,480 total GPU-h және 3,27 өнімділік қатынасы тіркелді. BetV1 үшін — 143,9 SU, 0,236 total GPU-h, қатынасы 1,41. CbAgo үшін — 144,0 SU, 0,375 total GPU-h, қатынасы 1,61. HER2-AAV үшін — 144,0 SU, 0,361 total GPU-h, қатынасы 2,94. SC2RBD үшін — 144,0 SU, 0,278 total GPU-h, қатынасы 1,03. PDL1 үшін — 143,6 SU, 1,623 total GPU-h, қатынасы 1,55. IL7RA үшін — 144,0 SU, 0,660 total GPU-h, қатынасы 1,89. Өткізу қабілетінің геометриялық орташа қатынасы 1,82 құрады.&lt;/p&gt;\n&lt;p&gt;b. Толық сервер ақысы және шекті мәннен кейінгі базалық бағалау ақысы&lt;/p&gt;\n&lt;p&gt;Толық сервер төлемі мен кесуден кейінгі AF2 базалық бағалау шығындары қосылған тек генераторлары бар базалық сызықтар үшін келесі деректер алынды. CD45 (Complexa-only) үшін базалық SU 0,000, кесуден кейінгі AF2 GPU уақыты 144,0 сағат, барлығы 0,347 GPU-h, қатынасы 4,52. BetV1 (Complexa-only) — 0,000 SU, 144,0 AF2 сағаты, 0,118 total GPU-h, қатынасы 2,82. CbAgo (BindCraft-only) — 4,710 SU, 148,7 AF2 сағаты, 0,350 total GPU-h, қатынасы 1,73. HER2-AAV (BindCraft-only) — 8,066 SU, 152,1 AF2 сағаты, 0,684 total GPU-h, қатынасы 1,55. SC2RBD (BindCraft-only) — 1,234 SU, 145,2 AF2 сағаты, 0,151 total GPU-h, қатынасы 1,89. PDL1 (Complexa-only) — 0,000 SU, 144,0 AF2 сағаты, 1,951 total GPU-h, қатынасы 1,29. IL7RA (Complexa-only) — 0,000 SU, 144,0 AF2 сағаты, 1,160 total GPU-h, қатынасы 1,07. Осы бөлік үшін өткізу қабілетінің геометриялық орташа қатынасы 1,90 құрады.&lt;/p&gt;\n&lt;h4 id=\"d14-aerkhilylykh-zhaene-irikteu-shekterine-sezimtaldykh\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d14-aerkhilylykh-zhaene-irikteu-shekterine-sezimtaldykh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.1.4. Әрқилылық және іріктеу шектеріне сезімталдық&lt;/span&gt;&lt;/a&gt;D.1.4. Әрқилылық және іріктеу шектеріне сезімталдық&lt;/h4&gt;\n&lt;p&gt;T-REX әдісі MMseqs2 тізбекті 70% ұқсастықта кластерлеу және Foldseek құрылымдық кластерлеудің TM0.5, TM0.6 және TM0.8 табалдырықтарында барлық жеті нысана бойынша ең жоғары кластер өткізу қабілетін сақтап қалды (2b сурет; S13 және S14 кестелер). Бұл талдауларда B.2 бөліміндегідей сапалы дизайн жиынтықтары мен кластерлеу параметрлері қолданылды, мұнда тізбекті кластерлеу құрылымдық дубликаттарды жоюдан бұрын қолданылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Тізбекті кластерлеу және TM-ұпай бойынша құрылымдық сүзу ұқсас ақуыз нұсқаларын топтастыруға және келешегі жоқтарды шығарып тастауға мүмкіндік береді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әрбір нысана (CD45, BetV1, CbAgo, HER2-AAV, SC2RBD, PDL1 және IL7RA) және әртүрлі тәсілдер (T-REX, PUCT, ε-greedy, Complexa-only, BindCraft-only және BoltzGen-only) үшін егжей-тегжейлі нәтижелер іріктен өткен нұсқалар санын (Qualified), тізбек кластерлерінің санын (Seq.clusters), жұмыс жылдамдығын (Seq.clusters/worker) және GPU сағатпен есептелген ресурс шығынын (GPU-h) көрсетеді. Мысалы, CD45 нысаны үшін T-REX әдісі жұмысшы başına 5.61 жылдамдықпен 1 936 іріктелген нұсқа жасады, ал PUCT 0.90, ε-greedy 0.44, Complexa-only 0.56, BindCraft-only 0.01, ал BoltzGen-only 0.15 GPU-h көрсетті. PDL1 нысаны үшін T-REX 14.33 GPU-h жұмсай отырып, 6 203 іріктелген нұсқа мен 2 064 тізбек кластеріне қол жеткізді, ал PUCT 5.38, ε-greedy 0.95, Complexa-only (2 897 нұсқа, 6.44 GPU-h), BindCraft-only (2 033 нұсқа, 2.77 GPU-h) және BoltzGen-only (1 412 нұсқа, 1 326 кластер, 9.21 GPU-h) талап етті. IL7RA үшін T-REX 1 178 нұсқаны (3.69 GPU-h), PUCT 1.14, ε-greedy 0.52, Complexa-only (1 086 нұсқа, 2.72 GPU-h), BindCraft-only (1 047 нұсқа, 1.72 GPU-h) және BoltzGen-only 3.34 GPU-h нәтижесін көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;GPU-h сияқты метрикалар есептеу күрделілігін бағаласа, TM0.5–TM0.8 параметрлері ақуыз модельдерінің құрылымдық ұқсастығын өлшейді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Баламалы TM-ұпай табалдырықтары (TM0.5, TM0.6, TM0.8) арқылы жүргізілген талдаулар T-REX-тің тұрақты артықшылығын көрсетті. Атап айтқанда, CD45 үшін T-REX көрсеткіштері 1.389 (TM0.5), 2.090 (TM0.6) және 3.271 (TM0.8) құрап, PUCT (0.326, 0.479, 0.604), ε-greedy (0.139, 0.188, 0.229), Complexa-only (0.257, 0.347, 0.486), BindCraft-only (барлық үш табалдырықта 0.014) және BoltzGen-only (0.028, 0.035, 0.104) нәтижелерінен асып түсті. BetV1 үшін T-REX 0.326, 0.444 және 0.542 мәндеріне қол жеткізді (PUCT үшін 0.188, 0.236, 0.250). CbAgo үшін T-REX мәндері 0.562, 0.806 және 1.042 болып, PUCT (0.250, 0.375, 0.417) және басқа тәсілдерден басым түсті. HER2-AAV үшін T-REX 0.951, 1.417 және 2.194 көрсетіп, PUCT (0.306, 0.361, 0.389) пен BindCraft-only (0.472, 0.722, 0.826) нәтижелерінен озды. SC2RBD үшін T-REX 0.236, 0.382 және 0.535, ал PUCT 0.215, 0.278 және 0.326 тіркеді. PDL1 үшін T-REX 1.875, 3.347 және 6.646 беріп, PUCT (1.021, 1.618, 2.792), Complexa-only (1.090, 1.951, 4.111) және BoltzGen-only (0.486, 1.097, 4.014) нәтижелерінен жоғары болды. Соңында, IL7RA үшін T-REX 1.062, 1.660 және 2.653 мәндерін көрсетіп, PUCT (0.465, 0.660, 0.833) пен қалған алгоритмдерді артта қалдырды.&lt;/p&gt;\n&lt;p&gt;Іріктеу шектеріне сезімталдық талдауы TM0.6 табалдырығындағы соңғы кластерлерді өзгеріссіз сақтайды және таңдалған өкілі &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D%20%5Cge%20%20au\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; шартын қанағаттандыратындарын іріктеп алады (S4 сурет; B.2 бөлімі). Әрбір өкіл өз кластері ішінде &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; шамасын барынша арттырады, сондықтан сақталған кластер барлық үш қатаңдатылган шекке сай келетін кем дегенде бір дизайнды қамтиды. Сүзгіден өткеннен кейін кластер мүшелігі қайта есептелмейді. τ = 0 кезінде іріктелген жиынтық бастапқы қатаң scRMSD шектеуін сақтай отырып, бастапқы санақты қалпына келтіреді. 63 нысана-шек тіркесімдерінен ($ au = 0, 0.05, \\dots, 0.40$) T-REX 50 жағдайда PUCT-тен асып түсті, он жағдайда (соның ішінде жеті нөлдік тең есеп) тең түсті және үштеуінде әр жолы дәл бір SU-ға төмен нәтиже көрсетті. Осылайша, өткізу қабілетіндегі артықшылық сынақтан өткен шек кесулерінің көбінде сақталды, ал кластерлер саны азайған сайын тең түсулер мен артта қалулар орын алды. Бұл шекті сақтау талдауы баламалы TM табалдырықтарында қайта кластерлеуден ерекшеленеді.&lt;/p&gt;\n&lt;h4 id=\"d21-muraghattalghan-zhosparlau-zhangartuyndaghy-daelelder\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d21-muraghattalghan-zhosparlau-zhangartuyndaghy-daelelder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.2.1. Мұрағатталған жоспарлау жаңартуындағы дәлелдер&lt;/span&gt;&lt;/a&gt;D.2.1. Мұрағатталған жоспарлау жаңартуындағы дәлелдер&lt;/h4&gt;\n&lt;p&gt;Бұл мысал мұрағатталған деректер мен LLM үшін қысқартылған кіріс негізінде HER2-AAV 6-жоспарлау жаңартуын көрсетеді, мұнда жаңарту нөмірлері уақытты емес, жоспарлау қадамдарын білдіреді. JSON үзінділері өріс атауларын, кірістірілген құрылымдарды және логикалық мәндерді сақтайды, сипаттамалық бүркеншек аттар қолданылады, ал өлшемдер төрт таңбаға дейін дөңгелектенеді.&lt;/p&gt;\n&lt;p&gt;Біліктілік және күтілетін бағалау. Кампанияда білікті дизайн немесе онлайн табыс бірліктері (SU) болған жоқ, екі шекті кластер (near-miss) және low_evidence күйі тіркелді. Талқыланып жатқан нұсқа pLDDT (90.8924) және scRMSD (0.7215 Å) шектерінен сәтті өтті, бірақ оның нормаланған iPAE көрсеткіші 0.2397 болып, рұқсат етілген шектен асып түсті. Кейінірек тілдік модель scRMSD қате түрде сәтсіз деп сипаттады, бірақ біліктілік үшін жазып алынған өлшемдер қолданылды. Білікті пул кластерлеуінде құрылымдар болмады (no_strict, нөлдік қамту), ал шекті кластерлеу аяқталды (ok, қамту 1.0). Он алты BoltzGen дизайнының төртеуі стандартталған AF2 бағалауынан өтті, он екісі рұқсат ету ережелері бойынша бағалауды күтті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Нормаланған iPAE (predicted aligned error) — ақуыз домендерінің кеңістіктік орналасу дәлдігін бағалайтын көрсеткіш, белгіленген шектен төмен мәндер кешеннің дұрыс моделделгенін растайды.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Критерийлер жиынтығы және құрылымдық қайталану. Әрбір критерий жиырма өлшемді қамтыды. pLDDT, нормаланған iPAE және scRMSD үшін сәтті/шекті/сәтсіз нәтижелер саны сәйкесінше 4/8/8, 0/5/15 және 8/2/10 болды, ал медианалар 85.7853, 0.3446 және 2.2067 Å тең болды. Жұптастырылған pLDDT және iPAE көрсеткіштері бойынша екеуі де сәтті 0, екеуі де сәтсіз 8, біреуі сәтті екіншісі сәтсіз 0 және екеуі де шекті 1 болып тіркелді. Соңғы кластер жазбалары арасында қайталану коэффициенті fdup = 0.75 құрады және ең үлкен кластер жазбалардың 20% қамтыды.&lt;/p&gt;\n&lt;p&gt;Жазылған нәтижелер мен есептеу шығындары. 36 ResultRecords жазбалары 16 Complexa Beam шығысын, 16 BoltzGen шығысын және ok мәртебесіндегі 4 стандартталған AF2 бағасын қамтыды. Олардың шығындары сәйкесінше 0.3216, 0.1362 және 0.0363 жұмысшы GPU-сағатты құрап, жиынтығында 0.4941 жұмысшы GPU-сағатқа жетті. Үш pending_children элементі белсенді тапсырмаларды орындап жатты. Жұмысшы уақыты 1.0003 GPU-сағатты, ал кідіріс уақыты сигналы 0.9673 GPU-сағатты құрады, алты жаңарту SU алмай өтті. Complexa Beam екі шекті кластерге де үлес қосты. Барлық үш біліктілік өлшемі Complexa Beam мен AF2 үшін қолжетімді болды, бірақ BoltzGen үшін болмады. Complexa Beam рецепті 4 сәуле ені, 4 тармақ және 4 үлгімен сегіз ұрпақты шекті нәтиже астында топтастырды.&lt;/p&gt;\n&lt;p&gt;Бір кампания ішіндегі төрт түрлі нәтиже түрі. Бұл жазбалар 1b суретіндегі айырмашылықтарды көрсетеді: кейінгі Complexa FK басқару тапсырмасы нәтижесіз тайм-аутпен аяқталды; 12 BoltzGen дизайны бағалауды күтті; көрсетілген Complexa Beam дизайны iPAE шегінен өте алмады. 11 және 12 жаңартулар арасында білікті дизайн саны 42-ден 43-ке көбейді, ал онлайн SU саны төрт болып қалды.&lt;/p&gt;\n&lt;p&gt;LLM үшін қысқартылған кіріс деректері. Келесі үзінді енгізуді қысқарту ережелері арқылы қалпына келтірілді. Мақсат идентификаторы алынып тасталды, 36 ата-аналық идентификатор есептегіш пен қолжетімділік жалаушасына айналдырылды, ал жиынтық мақсатты өрістер objective_summary астына топтастырылды. Ата-аналық идентификаторлар кандидаттарды құру үшін қолжетімді болып қалды, ал гипотеза карталары мен қадағалаушы тапсырмалары бөлек ұсынылды.&lt;/p&gt;\n&lt;h4 id=\"d22-usynystan-oryndaugha-zhaene-keri-bajlanyskha-dejin\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d22-usynystan-oryndaugha-zhaene-keri-bajlanyskha-dejin\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.2.2. Ұсыныстан орындауға және кері байланысқа дейін&lt;/span&gt;&lt;/a&gt;D.2.2. Ұсыныстан орындауға және кері байланысқа дейін&lt;/h4&gt;\n&lt;p&gt;Үдеріс D.2.1 бөліміндегі 6-жаңартудан басталып, бір гипотезаның іріктелуден бастап орындалуы мен кері байланыс алуына дейінгі толық жолын көрсетеді. Мұрағаттар шикі тілдік модель жауаптарын емес, бірдей сипаттаушы бүркеншек аттарды қолданатын құрылымдық HypothesisCard және ActionCandidate өрістерін қамтиды. Жоспарлаушының ұсынысы кезінде карточкалардың бірі нормализденген iPAE пен байланыстырушы scRMSD мәндерін төмендетуге, сонымен бірге жоғары pLDDT көрсеткішін сақтауға бағытталған Rescue тестін ұсынды, ал қалған екі карточка BindCraft және Complexa n ішінен үздік іздеу стратегияларын ұсынды.&lt;/p&gt;\n&lt;p&gt;Кандидаттарды құрастыру және валидациялау кезеңінде Check+Build модулі reward_i_ptm_weight параметрін алып тастады, өйткені интерфейс өлшемдері арасындағы ең үлкен бақылаулар саны 20-ны құрады, бұл талап етілген 32-ден төмен еді. Қалған баптаулар отбасының қолжетімділігін, конфигурацияны, жұмыс көлемі мен ресурс тексерулерінен сәтті өтті. Аталған дизайн салыстыру үшін бапталған базалық сызық ретінде қызмет етті, бірақ бұл генерация жұмысына ата-аналық құрылым ретінде берілмеді.&lt;/p&gt;\n&lt;h4 id=\"basymdykh-beru-zhaene-kezek\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#basymdykh-beru-zhaene-kezek\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басымдық беру және кезек&lt;/span&gt;&lt;/a&gt;Басымдық беру және кезек&lt;/h4&gt;\n&lt;p&gt;Супервизордың басымдық беру кезеңінде Complexa Beam Rescue әдісі бірінші орынға шықты, одан кейін BindCraft Explore және Complexa best-of-n Explore орналасты. Супервизордың 0.50 сенімділік деңгейі шартты бөлу шекараларын белсендірді, бірақ түзетуден кейін Rescue/Explore/eXploit үшін ұсынылған үлестер 0.40/0.60/0.00 деңгейінде қалды және ешқандай қосалқы нұсқалар қолданылмады. Бұл көрсеткіштер графикалық процессор (GPU) уақытының үлестері емес, келесі іске қосулардың мақсатты үлестері болып табылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Rescue/Explore/eXploit қатынасы жоспарлау алгоритмдерінде перспективалы идеяларды сақтау, жаңа салаларды зерттеу және табылған сәтті шешімдерді пайдалану арасындағы тепе-теңдікті анықтайды.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кезекке кіру үшін бір орын бос болды, бірақ үш жұмысшы да тапсырмаларды орындап жатты. Селектор супервизордың ағымдағы рейтингін басшылыққа алып, бірінші орын алған жұмысты қабылдады; қалған екеуі таңдалмады. Тіркелген іске қосылған күй кезекке қабылданғанын білдіреді, ал орындалуы бөлек расталды.&lt;/p&gt;\n&lt;h4 id=\"taeuelsiz-baghalau-zhaene-naetizheler\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#taeuelsiz-baghalau-zhaene-naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тәуелсіз бағалау және нәтижелер&lt;/span&gt;&lt;/a&gt;Тәуелсіз бағалау және нәтижелер&lt;/h4&gt;\n&lt;p&gt;Тәуелсіз бағалау және расталған іске қосу кезінде сол жаңартуда бағалау-қабылдау ережелері алдын ала генерацияланған BindCraft дизайнын стандартталған AF2 бағалауы үшін қабылдады. Диспетчерлік жазбалар бұл бағалаудың және таңдалған Complexa Beam жұмысының басталу уақытын тексеруден өтіп, сәтті басталғанын растады. 7-жаңартуда науқан BindCraft бағалауынан алғашқы білікті дизайнды және онлайн SU (жұмыс бірлігін) тіркеді.&lt;/p&gt;\n&lt;p&gt;Науқан күйі productive_duplicate болды, ал жалпы шығын 1.1468 жұмысшы GPU сағатын құрайды. Бұл бірінші SU таңдалған Complexa жұмысынан келген жоқ. BindCraft бағыты бір стандартталған AF2 бағалауынан өтті, оның құны 0.3491 GPU сағатын құрады, ал жалпы және соңғы өнімділік күйлері сау/өнімді деңгейде болды. Бір білікті кластермен оның сапа балының медианасы мен төменгі квартилі бірдей болып 0.3670 құрды, ал қосалқы диагностикалық жақсарту балы 1.0 тең болды.&lt;/p&gt;\n&lt;h4 id=\"tirkelgen-naetizheler-zhaene-gipoteza-keri-bajlanysy\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#tirkelgen-naetizheler-zhaene-gipoteza-keri-bajlanysy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тіркелген нәтижелер және гипотеза кері байланысы&lt;/span&gt;&lt;/a&gt;Тіркелген нәтижелер және гипотеза кері байланысы&lt;/h4&gt;\n&lt;p&gt;Өндіруші кандидат жұмысына сілтемелер ok күйі бар 32 ResultRecord-ты анықтады, олардың сегізі барлық үш біліктілік критерийіне сай келді. Олардың жаңарту идентификаторы нәтиже келген уақытқа емес, жұмыстың басталуына қатысты. Бұл нәтижелер саны тапсырмалардан, SU-лардан және гипотезаны қолдау нүктелерінен өзгеше.&lt;/p&gt;\n&lt;p&gt;9-жаңартуда карточканың 32 бағаланған ұрпағы, нөл қолдау нүктесі және нөл қайшылық нүктесі болды. Біліктілік салыстыру базалық сызығына қатысты болжанған өзгерістерді орната алмады. Базалық scRMSD талапқа сай болғандықтан және карточка абсолютті жақсарту шегін көрсетпегендіктен, қолдау көрсету үшін бастапқы 0.7215 Å-ден стандартты 1 Å төмендеу талап етілді — бұл қол жеткізуге болмайтын өзгеріс еді.&lt;/p&gt;\n&lt;p&gt;Бұрыннан өткен критерий әрбір болжамды теріске шығаруды талап ететін ереже бойынша қайшылық нүктелерінің пайда болуына да жол бермеді. Карточка белсенді күйінде қалып, он жаңартулық өмір сүру мерзімі аяқталғаннан кейін 16-жаңартуда зейнетке шықты.&lt;/p&gt;\n&lt;h4 id=\"d23-muraghattalghan-sheshim-trassalary-zhaene-burynghy-naetizhelerdi-pajdalanu\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d23-muraghattalghan-sheshim-trassalary-zhaene-burynghy-naetizhelerdi-pajdalanu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.2.3. Мұрағатталған шешім трассалары және бұрынғы нәтижелерді пайдалану&lt;/span&gt;&lt;/a&gt;D.2.3. Мұрағатталған шешім трассалары және бұрынғы нәтижелерді пайдалану&lt;/h4&gt;\n&lt;p&gt;3-суреттегі үш жағдай сәтсіз тест, қайталанатын жақын сәтсіздіктер немесе ата-объектіге тән ақаулар туындатқан қосымша тестілерді көрсету үшін ретроспективті түрде таңдалды. Мұнда сипатталған әрбір жағдай үшін авторлар ұсынысты, кандидаттық жұмысты және іске қосу шешімін расталған жұмыс басталуымен және кейιнгі нәтижелермен байланыстырды. Біліктілік көрсеткіштері мен көрсетілген pLDDT, iPAE және scRMSD мәндері стандартталған AF2 жазбаларынан алынды; желідегі TM0.6 SU өсімдері байланысқан науқан жиынтықтарынан алынды. HER2-AAV және CbAgo панельдері бағыт деңгейіндегі дәлелдер мен нәтижелерді салыстырады (3a, b-сурет), ал PDL1 тікелей ProteinMPNN ата-ұрпақ сызығына ереді (3c-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;scRMSD және pLDDT — ақуыз құрылымы сапасының метрикалары: біріншісі ақуыз қаңқасының кеңістіктік сәйкестігін бағаласа, екіншісі AlphaFold2 моделінің жергілікті құрылымды болжаудағы сенімділігін (100 балдық шкала бойынша) өлшейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Партияға тиесілілік және бағыт деңгейіндегі SU үлестірілімі жеке бағаланды: бір жұмыс бірнеше дизайнды тудыруы мүмкін, ал бағыт жиынтығы бірнеше жұмысты қамтуы мүмкін. Визуализация үшін шығыс кешендері нысана бойынша тиісті дәлелге немесе ата-кешенге қатаң түрде тураланды. Көрсетілген PDL1 ұрпағы өз ата-объектісінен 58 қалдықтың 35-і бойынша ерекшеленді және ата-объектіге қатысты нысанаға тураланған Cα атомдарының rmsd (scRMSD) мәні 0.714 Å құрады. Біліктілік scRMSD мәні осындай нысанаға негізделген туралауды пайдаланады, бірақ қайта жобаланған ұрпақпен ата-объектіні емес, генерацияланған кешенді оның AF2 болжамымен салыстырады.&lt;/p&gt;\n&lt;p&gt;Науқан аясында дәлелдерді қайта пайдалану жеті нысана бойынша бағаланды. Бұл ретроспективті түрде таңдалған жағдайлар сәтсіз қайта пайдалануды қамтиды және табыстылық көрсеткіштерін бағаламайды. Есептеулер білікті дизайнды жұмыспен тікелей байланысқан соңғы Foldseek TM0.6 өкілдерінен ажыратады; желілік конфигурация деңгейіндегі нәтижелер бөлек анықталады (C.4.2-бөлім). Көрсеткіштер мен дубликат үлестері ұсыныс жасалған кезде қолжетімді желілік деректерді сипаттайды (C.4-бөлім). Карточканы қолдау және жоққа шығару себеп-салдарлық түсініктемелерді емес, сандық болжамдарды бағалайды, ал жұмысты тоқтату екі тұжырымсыз да карточканың өмірлік циклін аяқтайды (C.9-бөлім).&lt;/p&gt;\n&lt;p&gt;CD45: өнімді бағытті жалғастыру және оны Құтқару (Rescue) үшін қайта пайдалану. Генератордың ішкі марапат салмақтары реттелген Complexa бағыты соңғы 2.32 SU/GPU-сағ жылдамдыққа ие болды, ал әдепкі бағытта соңғы SU болған жоқ және дубликат үлесі 0.81 құрады. Контроллер жазып алынған тазарту және интерфейске қатысты салмақтары бар өнімді Complexa Beam бағытын жалғастырды. Кейιнгі Rescue ұсынысы сол бағыт пен салмақ жұбын интерфейспен шектелген жақын сәтсіздік үшін қолданып, бұл конфигурацияның туыс жағдай үшін пайдалы болып қала беретінін тексерді. Өндірісі жалғасқан жұмыс 27 білікті дизайн және үш соңғы өкіл берді; кейιнгі Rescue жұмысы 11 білікті дизайн және бір соңғы өкіл әкелді.&lt;/p&gt;\n&lt;p&gt;SC2RBD: өнімді генератор ішіндегі әртүрлілікті арттыру. Сегіз қабылданған нативті дизайнды сұраған BindCraft бағыты 1.40 SU/GPU-сағ берген еді, бірақ барлық соңғы дизайн бір құрылымдық кластерге шоғырланған болатын. Он алты қабылданған нативті дизайнды сұраған бағыт кейіннен төрт кластерде төрт SU берді. Ұсынылған тест сұралған қабылданған нативті дизайн санын сегізден он алтыға дейін арттырып, интерфейстік салмақ конфигурациясын сақтап қалды, содан кейін тар бағыт қайтадан артық болып қалғаннан кейін осы конфигурацияны қайта пайдаланды. Бастапқы жұмыс 19 білікті ұрпақ пен үш соңғы өкіл берді; кейιнгі қайталау 10 білікті ұрпақ пен бір соңғы өкіл әкелді.&lt;/p&gt;\n&lt;p&gt;PDL1: аралық іріктеу параметрін сынақтан өткізу. Қаңқаны іріктеу шуының мәні 0.30 ең жоғары соңғы көрсеткішке (6.36 SU/GPU-сағ) ие болды, бірақ дубликат үлесі 0.84 еді. 0.20 мәні төменірек өнімділік пен үлкен құрылымдық дубликацияны көрсетті, ал сынақтан өткен 0.40 конфигурациясы төмендетілген өнімділікке ие болды. Контроллер өнімділік пен диверсификация арасындағы ықтимал ымыраны зерттеу үшін басқа бағыт параметрлерін сақтай отырып, рұқсат етілген шектерде 0.35 мәнін сынақтан өткізді. Жұмыс 30 білікті дизайн мен бес соңғы өкіл берді.&lt;/p&gt;\n&lt;p&gt;HER2-AAV: сәтсіз тесттен кейін гипотезаны қайта қарау. Complexa-ның FK бағыты бойынша нативті метрикалары жоғары интерфейстік сенімділікті (медиана ipTM 0.77), бірақ төменірек фолдинг сенімділігін (медиана pLDDT 83.4) көрсетті. Бұрынғы pLDDT марапат салмағының тесті білікті дизайндарды бермеді және оның карточкасы жоққа шығарылды. Кейιнгі ұсыныс FK бағытын сақтай отырып және тізбек галлюцинациясына ауысу арқылы тізбек пен қаңқаның үйлесімділігін тексерді (3a-сурет). Бес дизайн біліктілікке ие болды. Сол бағыт пен конфигурация үшін бірінші нәтижелер жиынтығы үш желілік SU туралы хабарлады; бұл есеп жеке жұмысқа жатпайды. Кері байланыс барлық 32 бағаланатын дизайнды біліктіліктен ерекшеленетін карточкаға тән жақсарту және сақтау тесттері аясында қолдау ретінде есепке алды.&lt;/p&gt;\n&lt;p&gt;BetV1: бұрынғы құрылымдық әртүрлілігі бар генераторға оралу. Complexa дубликаттарға бай болып қалған еді. BindCraft бұрын үлкен құрылымдық әртүрлілікпен 33 SU өндірген болатын, алайда соңғы терезеде ештеңе өндірмеген еді. Контроллер басқа генератор отбасы жаңалықты қалпына келтіре алатынын тексеру үшін сегіз қабылданған нативті дизайнды сұрап және оң спиральділік, ipTM мен pLDDT салмақтарын пайдаланып BindCraft-қа қайта оралды. Жұмыс 17 білікті дизайн мен екі соңғы өкіл берді. Оның гипотеза карточкасы өмірлік цикл шегінде жабылды.&lt;/p&gt;\n&lt;p&gt;BetV1: ерте конфигурацияны сәтсіз қайта пайдалану. Интерфейстік сенімділік бойынша Rescue ұсынысы білікті дизайн өндірген бұрынғы конфигурацияға сілтеме жасады. Контроллер басқа жақын сәтсіздік үшін тізбек галлюцинациясын, рұқсат етілген максималды интерфейстік сенімділік марапат салмағын және қаңқаны іріктеу шуын 0.50 қолдана отырып Complexa Beam бағытын қайта пайдаланды. Байланысқан 16 дизайнның ешқайсысы біліктілікке ие болмады. Гипотеза карточкасы өмірлік цикл шегінде жабылды. Осылайша, бұрын өнімді болған конфигурацияны қайта пайдалану біліктілікке кепілдік бермеді.&lt;/p&gt;\n&lt;p&gt;CbAgo: ең жоғары өнімді белсенді бағытты қайталау. Теріс iPAE марапат салмағы бар FK бағыты белсенді конфигурациялар арасында ең жоғары соңғы жылдамдыққа (2.72 SU/GPU-сағ) ие болды және бұрын білікті дизайндардың жоғары үлесін берген еді. Контроллер бұл бағытты құрылымдық кластерлерді қосуды жалғастыратынын тексеру үшін жазып алынған тазарту және интерфейске қатысты салмақтарымен қайта іске қосты. 3b-суреттегіден ерекшеленетін бұл жұмыс сегіз білікті дизайн мен бір соңғы өкіл әкелді.&lt;/p&gt;\n&lt;p&gt;IL7RA: дубликаттардың жоғары үлесіне қарамастан жалғасып жатқан өндіріс. BindCraft 1.46 SU/GPU-h өткізу қабілетін және 0.80 дубликат үлесі кезінде 57 SU жиынтық онлайн есебін көрсетті. Басқарушы басқа тапсырмалар баламаларды сынақтан өткізіп жатқан кезде, екі native қабылданған дизайнды сұрай отырып, бағытын жалғастырды. Екі байланысқан дизайн сараптамадан өтіп, картаның сандық болжамдарын растады.&lt;/p&gt;\n&lt;h4 id=\"d3-baskharushynyng-aereketi-zhaene-aralasuy-d31-llm-pajdalanu-zhaene-interfejsti-tekseru\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d3-baskharushynyng-aereketi-zhaene-aralasuy-d31-llm-pajdalanu-zhaene-interfejsti-tekseru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.3. Басқарушының әрекеті және араласуы D.3.1. LLM пайдалану және интерфейсті тексеру&lt;/span&gt;&lt;/a&gt;D.3. Басқарушының әрекеті және араласуы D.3.1. LLM пайдалану және интерфейсті тексеру&lt;/h4&gt;\n&lt;p&gt;Модель шақырулары мен шығысты валидациялау. Жеті негізгі науқанда 3,125 LLM шақыруы тіркелді: 1,719 Жоспарлаушы (Planner) және 1,406 Бақылаушы (Supervisor) шақырулары (S15 кестесі, А бөлігі). Бақылаушының жеті жауабы құрылымдық шығысты валидациядан өте алмады, бұл барлық модель шақыруларының 0.22% құрайды. Барлық жеті жауап JSON ретінде талданды, бірақ алтауы рұқсат етілген жиынтықтан тыс дәлелдерге сілтеме жасады және біреуі жарамсыз ресурс класын пайдаланды. Бұл қабылданбаған жауаптар детерминирленген сақтық көшірме ауысуын (fallback) тудырды; C.5.2 және C.7.1 бөлімдері валидация мен жауапты өңдеуді сипаттайды.&lt;/p&gt;\n&lt;p&gt;Таңдау жолдары және расталған бастамалар. Таңдау кезінде модель шақыруын валидациялау және сақтық көшірме ауысуы әртүрлі бөлімдерге ие. Авторлар Бақылаушы шешімдері жазбаларындағы бірегей жоспарлау жаңартуларын санап шықты және әрбір расталған генерация немесе қайта жобалау бастамасын LaunchDecision арқылы таңдаушы жаңартуға байланыстырды. 1,719 жаңартудың 1,398-і ағымдағы Бақылаушы кандидаттар рейтингін пайдаланды және 321-і (18.7%) сақтық көшірме нұсқасын пайдаланды. Бұларға Бақылаушы шақыруы үшін гипотезаларсыз немесе кандидаттарсыз 313 жаңарту, қабылданбаған Бақылаушы жауаптары бар жетеуі және жарамды Бақылаушы жауабына қарамастан бос Жоспарлаушы картасы тізімінен сақтық көшірме себебін алып жүрген біреуі кіреді. Бұл көрсеткіштерге ешқандай генерация немесе қайта жобалау жұмысын бастамаған жаңартулар да кіреді. Барлық 1,454 генерация немесе қайта жобалау бастамалары тіркелген таңдауға байланыстырылды: 1,446-сы Бақылаушы рейтингін пайдаланатын жаңартуларға және сегізі (0.55%) сақтық көшірме нұсқасына. Жеке қабылданған 3,160 AF2 бастамалары бұл бөлімнен шығарылып тасталды. Таңдау жолы LLM жұмысты ұсынғанын дәлелдемейді: қатаң құрылыс ережелері кез келген жолға кандидаттарды қоса алады (C.6 және C.7 бөлімдері).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Шығысты валидациялау модель жауаптарының қатаң техникалық талаптарға (мысалы, JSON схемаларына) сәйкестігін тексеріп, сақтық көшірме тетігі LLM қатесі кезінде бағдарламаланған ережелерді автоматты түрде іске қосады.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бақыланатын интерфейс тексерулері. Жоспарлаушы сынақтары бес синтетикалық дәлел жағдайын пайдаланды: өнімді жұмыс, сәттілікке жақын нәтижелердің шоғырлануы (near misses), тоқырау (stall), түсініксіз дәлелдер және сараптамадан өткен, бірақ құрылымдық жағынан артық шығыс. Бақылаушы сынақтары түсініксіз дәлелдерді қоспағанда, әрбір рөл үшін әрбір жағдайға бес шақырудан тұратын сол жағдайларды пайдаланды. Тексерулер жарамды талданған шығыстарды талап етті; қалыпқа келтірілген Бақылаушы үлестірім үлестері де жағдайға тән күтулерге сай болуы тиіс еді: өнімді режим, X ≥ 0.45 және E ≤ 0.30; сәттілікке жақын нәтижелер көп болғанда, R ≥ 0.40; тоқырау, E ≥ 0.25 және X ≤ 0.45; құрылымдық жағынан артық шығыс, E ≥ 0.25. Шығыстың жарамдылығы мен үлестірімі бойынша барлық тексерулер сәтті өтті (S15 кестесі, В бөлігі).&lt;/p&gt;\n&lt;p&gt;Қайталанушылық және таңдама сезімталдығы сынақтары бір фиксирленген өнімді дәлел жағдайын және бес кандидаттық тапсырманы пайдаланды: екі эксплуатация (eXploit), екі құтқару (Rescue) және бір зерттеу (Explore). Әрбір сынақ қайталанушылықты тексеру үшін 0 температурасында және таңдама сезімталдығын бағалау үшін 0.05 қадаммен 0.00 мен 0.45 аралығындагы температураларда он Бақылаушы шақыруын орындады. Әрбір сынақ шеңберінде жарамды жауаптардың барлық жұптары басымдықтар шеңберіндегі бірінші орынды алған кандидаттардың сәйкестігі, Кендалл корреляциясы және үлестірім үлестерінің абсолютті айырмашылықтарының қосындысы көмегімен салыстырылды (S15 кестесі, В бөлігі). Таңдама сериалдарының үштеуі бір Rescue кандидатын өткізіп алды, сондықтан көрсетілген сәйкестік толық рейтингтердің бірдейлігін дәлелдемейді. Бұл тексерулер сыннан өткен кіріс деректері үшін шығыстың жарамдылығы мен қайталанушылығын бағалайды, түсіндірмелерді растамайды және биологиялық дәлдікті, бүкіл науқан бойынша сенімділікті немесе LLM пайымдауларының себептік пайдасын анықтамайды. S15 кестесі LLM шақырулары мен бақыланатын интерфейс тексерулерін көрсетеді. А бөлігі Жоспарлаушының жарамды бас тартуларын қоса алғанда модель шақыруларын есептейді, бірақ өткізіп жіберілген шақырулар мен детерминирленген кеңесші жазбаларын шығарып тастайды. В бөлігі синтетикалық кіріс деректерін пайдаланады. Сәйкестік бірдей бірінші орындағы кандидаты бар басымдықтар шеңберіндегі жұптық салыстырулардың үлесі болып табылады. Кендалл корреляциясы кем дегенде екі тапсырмасы бар бірдей кандидаттар жиынтығын талап етеді. Үлестірім айырмашылығы — R/E/X үлестері бойынша абсолютті айырмашылықтардың қосындысы. Жарамсыз немесе қолжетімсіз тапсырмаларды фиксирленген түрде өңдеу C.5.2, C.6 және C.8.2 бөлімдерінде сипатталған.&lt;/p&gt;\n&lt;h4 id=\"a-model-shakhyrulary-men-khurylymdykh-shyghysty-validaciyalau\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#a-model-shakhyrulary-men-khurylymdykh-shyghysty-validaciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;А. Модель шақырулары мен құрылымдық шығысты валидациялау&lt;/span&gt;&lt;/a&gt;А. Модель шақырулары мен құрылымдық шығысты валидациялау&lt;/h4&gt;\n&lt;p&gt;Мақсатты модель шақырулары: Жоспарлаушы, Бақылаушы, Валидация қателері (CD45, BetV1, CbAgo, HER2-AAV, SC2RBD, PDL1, IL7RA). Барлығы 3,125 шақыру: 1,719-ы Жоспарлаушыда және 1,406-сы Бақылаушыда (0.22%). Модель шақыруларының саны Жоспарлаушының 201 жарамды бас тартуын қамтиды. Мұрағаттарда сондай-ақ Бақылаушының 313 өткізіліп жіберілген шақыруы және осы есептен шығарып тасталған 1,517 детерминирленген кеңесші жазбалары бар. Модель шақырулары 114,105,382 оқу және 4,430,504 жазу токенін пайдаланды. Кідіріс (latency) және ресурстарды есепке алу сезімталдығы D.1.3 бөлімінде және S12 кестесінде келтірілген.&lt;/p&gt;\n&lt;h4 id=\"v-bakhylanatyn-interfejs-tekseruleri\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#v-bakhylanatyn-interfejs-tekseruleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;В. Бақыланатын интерфейс тексерулері&lt;/span&gt;&lt;/a&gt;В. Бақыланатын интерфейс тексерулері&lt;/h4&gt;\n&lt;p&gt;Дәлелді тексеру, нәтиже: Стандартты жағдайлар (бес Жоспарлаушы және төрт Бақылаушы жағдайы, әрқайсысы бес қайталаудан) — Жоспарлаушы 25/25 және Бақылаушы 20/20 жарамды; барлық жағдайға тән үлестірім тексерулері сәтті өтті. Қайталанушылық (бір фиксирленген Бақылаушы жағдайы, 0 температурасында он шақыру) — 10/10 жарамды; басымдықтар шеңберіндегі бірінші кандидаттардың сәйкестігі және минималды сәйкес келетін Кендалл корреляциясы 1.00 құрды; үлестірім үлестерінің максималды жиынтық айырмашылығы 0.00 тең болды. Таңдама сезімталдығы (0.00–0.45 температураларындағы сол жағдай) — 10/10 жарамды; басымдықтар шеңберіндегі бірінші кандидаттардың сәйкестігі және минималды сәйкес келетін Кендалл корреляциясы 1.00 құрды; үлестірім үлестерінің максималды жиынтық айырмашылығы 0.10 тең болды.&lt;/p&gt;\n&lt;h4 id=\"naukhan-bojynsha-boei-zhaene-aereketter-kengistigin-nakhty-pajdalanu\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#naukhan-bojynsha-boei-zhaene-aereketter-kengistigin-nakhty-pajdalanu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Науқан бойынша бөלіנו және әрекеттер кеңістігін нақты пайдалану&lt;/span&gt;&lt;/a&gt;Науқан бойынша бөלіנו және әрекеттер кеңістігін нақты пайдалану&lt;/h4&gt;\n&lt;p&gt;4a-Суретте 1 454 расталған генерация және қайта жобалау басталуы науқан күйінің белгілері мен тіркелген R/E/X артықшылықтары бойынша топтастырылған; әрбір күй ішіндегі пайыздар міндетті AF2 бағалауларын қоспағанда, сол күйдегі барлық генерация және қайта жобалау басталуларын бөлім ретінде пайдаланады. Негізгі мәтіндегі пайыздар төмен дәлелдемелер деңгейіндегі 48/65 Explore басталуына, тоқырау және терең тоқырау күйлері біріктірілген 41/80 Rescue басталуына, сондай-ақ қайталануы бар өнімді күйлердегі 930/1 133 eXploit басталуына сәйкес келеді. Құрылымдық дубликаттардың күйреуі күйінде ешқандай генерация немесе қайта жобалау басталуы тіркелген жоқ. Күй ережелері C.4.5 қосымша бөлімінде анықталған; c, d панельдері ретроспективті аннотацияларды пайдаланады.&lt;/p&gt;\n&lt;p&gt;Дәлелдемелер фокусының аннотациясы. Әрбір басталу мақсат және кандидат тапсырмасының идентификаторы бойынша құрылымдық шешім мәтінімен байланыстырылып, қайталанатын басталулар жеке оқиғалар ретінде сақталды. Төрт аннотация санатына интерфейстің сенімділігі, бүктелудің сенімділігі, қаңқаның үйлесімділігі және құрылымдық артықтық кірді. Байланыстырылған шешімдер үшін 27 жобалау шешімін (35 басталу) қамтитын қолмен жасалған аннотациялар мәтіндік сәйкестендіруден басым болды. Әйтпесе, регистрді ескермейтін сәйкестендіру алдымен ұсынылған тапсырма сипаттамасын (не екенін) тексерді. Бұл өріс ешбір санатқа сәйкес келмеген жағдайда ғана сәйкестендіру біріктірілген дәлелдемелер мен негіздеме өрістерін қарастырды. Бір санатқа сәйкестік бірыңғай фокус тағайындады, ал бірнеше санатқа сәйкестік көп фокусты белгі берді. Сәйкестігі немесе байланыстырылған шешімі жоқ басталулар аннотацияланбаған күйінде қалды. c, d панельдері көп фокусты және аннотацияланбаған басталуларды қоспағанда, бірыңғай фокус тағайындалған 1 305 басталуды қамтиды. 4-Суреттегі қаңқаның үйлесімділігі белгісі scRMSD, поза қатесі немесе қаңқаның ығысуы туралы сөздерді қоса алғанда, құрылымдық өзін-өзі үйлесімділікті білдіреді. Бұл аннотациялар тәуелсіз түрде анықталған дизайн шектеулерін емес, келтірілген дәлелдемелерді сипаттайды; аннотациялау жабық түрде жүргізілмеді және сарапшылар арасындағы келісім бағаланбаған. S16-Қосымша кестеде өлшенген біліктілік қателері мен құрылымдық артықтық осы шешім мәтінінің аннотацияларынан бөлек хабарланады. Науқан күйі, дәлелдемелер фокусы және артықшылық арасындағы байланыстар сипаттамалық сипатқа ие: детерминирленген күй ережелері, кандидаттарды жасау және бөлу шекаралары да іске асырылған басталуларға әсер етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дәлелдемелер фокусын аннотациялау — зерттеушілер стратегиясын түсіну үшін ақуыз модельдерінің төрт негізгі сапа критерийі бойынша есептеу тапсырмаларының негіздемелерін жіктеу әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кестеде әртүрлі нысаналы ақуыздар үшін көрсеткіштер келтірілген: CD45 үшін 6 291 басталу, 67.6% iPAE қателері, 25.7% pLDDT қателері, 25.4% scRMSD қателері, 1 936 білікті TM ≥ 0.6 құрылымдары және есептеу бірлігіне (SU) 6.43 білікті нұсқа тіркелген; BetV1 үшін 2 310 басталу, 84.0% iPAE, 72.9% pLDDT, 51.7% scRMSD, 3.81 білікті SU; CbAgo үшін 5 170 басталу, 89.1% iPAE, 62.6% pLDDT, 43.5% scRMSD, 4.34 SU; HER2-AAV үшін 3 733 басталу, 73.0% iPAE, 62.8% pLDDT, 14.8% scRMSD, 4.21 SU; SC2RBD үшін 1 906 басталу, 79.3% iPAE, 82.5% pLDDT, 42.3% scRMSD, 4.58 SU; PDL1 үшін 9 099 басталу, 26.3% iPAE, 29.5% pLDDT, 10.5% scRMSD, 6 203 білікті TM ≥ 0.6 құрылымы және 12.87 SU; IL7RA үшін 3 163 басталу, 51.0% iPAE, 50.1% pLDDT, 24.5% scRMSD, 1 178 білікті құрылым және 4.93 SU.&lt;/p&gt;\n&lt;p&gt;Келесі тапсырма түрлері. 4d-Сурет үшін тапсырмалар келесі ретпен жіктелді: ProteinMPNN тапсырмалары кандидатты қайта жобалауға, мұрағатталған маршруттардың нақты қайталанулары жазылған маршрутты қайталауға, ал әрбір нысаналы науқан шеңберіндегі генерация отбасының бірінші басталуы әдісті бірінші рет пайдалануға тағайындалды. Қалған тапсырмалар үшін регистрді ескермейтін сәйкестендіру ұсынылған тапсырма сипаттамасын немесе мұндай сипаттама болмаған жағдайда тіркелген конфигурацияны пайдаланды. sequence[_-]?hallucination сәйкестігі кандидатты қайта жобалауды анықтады, әйтпесе reward, weight, penalty немесе objective сөздері ұпай қою салмақтарын түзетуге жатқызылды. Барлық қалған тапсырмалар іріктеуді немесе іздеуді реттеуге тағайындалды. Бұл рет санаттарды өзара жоққа шығаратын етеді; мәтінге негізделген санаттар ұсынылған тапсырмаларды сипаттайды және әрбір сәйкес келген тапсырма ұпай қою салмақтарын немесе іріктеу параметрлерін өзгерткенін дәлелдемейді.&lt;/p&gt;\n&lt;p&gt;Әрекеттер кеңістігін нақты пайдалану. Жеті негізгі T-REX науқаны барлық алты тіркелген генерация отбасы мен ProteinMPNN қайта жобалауын қолданып, 161 нысаналы конфигурацияны және 1 454 расталған генерация немесе қайта жобалау басталуын қамтыды (S17-Қосымша кесте). Кесте нысаналар бойынша тікелей SU бөлінісін біріктіреді; S5-Қосымша сурет нысаналар деңгейіндегі санақтарды көрсетеді. Әрбір соңғы SU өзінің таңдалған өкілін шығарған отбасыға жатқызылады, оның шығу тегіне үлес қосқан барлық тапсырмаларға емес. Бұл бөלініс себеттік үлесті немесе шығындарға қатысты қалыптастырылған тиімділікті өлшемейді. Рұқсат етілген конфигурация диапазондары S5-Қосымша кестеде келтірілген.&lt;/p&gt;\n&lt;h4 id=\"d33-ajkhyn-khutkharu-basymdyghynsyz-aralasu\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d33-ajkhyn-khutkharu-basymdyghynsyz-aralasu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.3.3. Айқын құтқару басымдығынсыз араласу&lt;/span&gt;&lt;/a&gt;D.3.3. Айқын құтқару басымдығынсыз араласу&lt;/h4&gt;\n&lt;p&gt;Айқын құтқару (Rescue) басымдығын сынау үшін авторлар жоспарланған 100 жұмысшы GPU-сағат бюджетімен әр нысанаға бір араласу науқанын жүргізді. Әрекеттер кеңістігі, құрылымдық дәлелдер, ресурс шектеулері және науқан күйінің шектері сақталды. Жоспарлаушы мен қадағалаушының басымдықтары тек Explore және eXploit шектелді; қосалқы бөлу және басымдық есебі де тек осы екі басымдықты пайдаланды. Детерминистік ережелер бойынша Rescue тағайындалған кандидаттар Explore деп қайта аталды. Rescue терминологиясы LLM нұсқауларынан алынып тасталды және жақын сәтсіздіктермен байытылған күй өзінің анықтамасын өзгертпестен blocker_rich бейтарап белгісін алды.&lt;/p&gt;\n&lt;p&gt;Қалпына келтіру және тоқтап қалу уақыты. 4b суретте әр саясаттың алғашқы 100 жұмысшы GPU-сағаты ішіндегі жоспарлау жазбалары қолданылады. Әр жұмысшы-уақыт мәніндегі соңғы жазба сақталғаннан кейін, тоқтап қалу немесе терең тоқтап қалу күйіне әр өту жаңа жазбаны бастады, оның ішінде тоқтап қалудан терең тоқтап қалуға өту де бар (күй анықтамалары C.4.5 бөлімінде). Қалпына келтіру осы уақытқа дейін байқталған ең жоғары онлайн TM0.6 SU саны кіру кезіндегі мәнінен асып түскен алғашқы кейінгі жоспарлау жазбасы болды, тіпті күй өзгерген болса да. Сондықтан қалпына келтіру уақыттары жоспарлау жазбасының ажыратымдылығына ие. Қалпына келтірусіз жазбалар қалпына келтіру үлесінің бөл1ге бөлімінде қалды. Қалпына келтіру уақытының медианалары түзетілмеген қалпына келтірілмеген жазбаларды есепке алмастан, тек қалпына келтірілген жазбаларды пайдаланды. Толық T-REX 27 жазбаның 26-сында қалпына келді, ал араласу кезінде 20-дан 14-і қалпына келді; сәйкесінше бір және алты жазбада бақыланатын қалпына келтіру болмады. Бұл жазбалар науқан ішіндегі қайталанатын бақылаулар болып табылады және қалпына келтіру бақылауын бөлісе алады: 26 және 14 қалпына келтірілген жазба сәйкесінше 9 бөлек нысана-қалпына-келтіру-уақыты жұптарына сәйкес келді. Тоқтап қалудың жұмысбастылығын есептеу үшін әр күй белгісі келесі жоспарлау жазбасына тасымалданды, соңғы белгі 100 жұмысшы GPU-сағатына дейін созылды. Тоқтап қалуға немесе терең тоқтап қалуға бөлінген жалпы ұзақтық, нысаналар бойынша жиынтық терезе ұзақтықтарына бөлінгенде, толық T-REX үшін 3.8% және араласу үшін 27.7% жиынтық жұмысбастылықты берді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Мұндай есептеу әдістерінде алгоритмдердің тиімділігін бағалау үшін нәтижелер есептегіштері (SU) және жұмсалған GPU уақыты талданады, сондай-ақ жоспарлаушының тоқтап қалу және қалпына келтіру кезеңдері өлшенеді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Соңғы нүктелерді салыстыру. SN кестеде араласудың соңғы SU сандары D.1.2 бөліміндегі ретроспективті түрде қалпына келтірілген жинақтау қисықтарынан алынған толық T-REX сандарымен салыстырылады. Толық T-REX 144 жұмысшы GPU-сағатына жоспарланған болатын, сондықтан бұл бірдей жоспарланған бюджетпен жүргізілген науқандар арасында емес, бірдей бақыланатын жұмысшы уақытындағы салыстыру болып табылады. CD45 үшін жұмысшы уақыты 99.742 сағат, SU 2.256, жылдамдық 2.316 SU/GPU-сағатты құрады; BetV1 үшін уақыт 99.991, SU 0.560, жылдамдық 0.430; CbAgo үшін уақыт 99.988, SU 0.490, жылдамдық 0.860; HER2-AAV үшін уақыт 99.977, SU 1.810, жылдамдық 1.440; SC2RBD үшін уақыт 99.968, SU 0.020, жылдамдық 0.430; PDL1 үшін уақыт 99.963, SU 3.111, жылдамдық 3.781; IL7RA үшін уақыт 99.951, SU 2.351, жылдамдық 1.821. Толық T-REX бұл бақылау нүктесінде төрт нысана үшін жоғарырақ және үш нысана үшін төменірек сандарға ие болды. Осылайша, салыстыру бірыңғай өткізу қабілеті артықшылығын орнатпайды. Rescue басымдығының алынып тасталуы тоқтап қалулардың жиілігін және қай тоқтап қалулардың қалпына келтіру талдауына кіргенін де өзгерте алады. Араласу LLM нұсқауларын, басымдықтарды бөлуді және күй белгілерінің тұжырымдарын бірлесіп өзгертті; ол бөлу коэффициентін немесе LLM пайылауларының үлесін оқшауламайды.&lt;/p&gt;\n&lt;h4 id=\"d4-bajlanystyrushy-dizajn-hoc-sipattamasy-d41-khosymsha-bolzhamdykh-modelder-men-metrikalar\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d4-bajlanystyrushy-dizajn-hoc-sipattamasy-d41-khosymsha-bolzhamdykh-modelder-men-metrikalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.4. Байланыстырушы дизайнポスト-hoc сипаттамасы D.4.1. Қосымша болжамдық модельдер мен метрикалар&lt;/span&gt;&lt;/a&gt;D.4. Байланыстырушы дизайнポスト-hoc сипаттамасы D.4.1. Қосымша болжамдық модельдер мен метрикалар&lt;/h4&gt;\n&lt;p&gt;Біз B.2 бөлімінде анықталған бекітілген өкілдік нұсқаларды қосымша модельдік болжамдар мен ұпайлар көмегімен сипаттадық. Жиынтық алты әдіс және жеті нысана бойынша 3766 өкілді қамтыды, әрбір әдіс–нысана жұбы үшін әрбір соңғы Foldseek TM ≥ 0.6 кластерінде бір өкілден болды. Барлық нәтижелер S19 кестесіндегі әрбір өлшем үшін шекті мәндерге ие болды. Біріздендірілген AlphaFold2 (AF2) кешендерді ортақ параметрлермен қайта бағалады, ал actifpTM сол AF2-Multimer конфигурациясын қолданды. Сондықтан екеуі де іріктеу кезеңіндегідей болжаушылар отбасын пайдаланды. Ал ESMFold2 мен Boltz-2 кешендерді тек нысана мен байланыстырушы тізбектері негізінде қайта болжады. Бұл post-hoc талдаулар бөлуге, іріктеуге, кластерлеуге немесе SU санына әсер еткен жоқ. AF2 түзуленген қателіктер негізіндегі өзара әрекеттесуді болжау ұпайы (ipSAE) интерфейстің сенімділік көрсеткіші болып табылады, онда жоғары мәндер жақсы нәтижеге сәйкес келеді (іріктеу кезінде қолданылған төменгі мәні жақсы болатын қалыптасқан iPAE-ден айырмашылығы). Біз оның екі бағытталған мәнінің арифметикалық ортасын келтіреміз, ал actifpTM интерфейс сенімділігін болжанған контакт ықтималдықтары бойынша салмақтайды. PRODIGY болжанған байланысудың бос энергиясын Δ G және одан шығарылатын диссоциация константасын &lt;a href=\"concepts/k-d.html\"&gt;K_D&lt;/a&gt; ұсынды. Бұл көрсеткіштер эксперименталды байланысу өлшемдері емес, сенімділік немесе аффинность болжамдары болып табылады. S19 кестесінде бағалаушының кіріс деректері, параметрлері, бірліктері және ұпайларды біріктіру тәсілдері келтірілген. 2c-суретте таңдалған post-hoc шекті мәндері көрсетілген, ал S6a–d қосымша суреттерінде біріздендірілген AF2, actifpTM, PRODIGY, ESMFold2 және Boltz-2 бойынша барлық 24 шекті мән берілген. Әрбір шекті мән бірдей бекітілген өкілдер жиынтығына бөлек қолданылды және өткен саны барлық жеті нысана бойынша жинақталды. T-REX әрбір шекті мәнде ең үлкен жиынтық санын сақтап қалды. Бұл жиынтық көрсеткіштер әр әдістің білікті өкілдер жиынының көлемін де, әр шектен өткен үлесін де көрсетеді. Шекті мәндер Δ G мен оның туындысы K_D-ны қоса алғанда, өзара байланысқан өлшемдерді қорытындылайды және тәуелсіз валидация тәжірибелері болып табылмайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Post-hoc талдаулар және ipSAE, ipTM немесе PRODIGY сияқты метрикалар дайын модельдер негізінде ақуыз кешендерінің сапасын бағалауға арналған қосымша есептеу әдістері болып табылады, олар нақты физикалық өлшемдерді алмастырмаса да, сәтсіз нұсқаларды сенімді түрде алып тастауға көмектеседі.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Шектен өткен дизайн саны әр құрал үшін кіріс деректері мен параметрлерге байланысты. Біріздендірілген AF2 S4 кестесіндегі жалпы AF2 іріктеу параметрлері бар өкілді кешенді және бекітілген кіріс тізбегін пайдаланады; тиімді кездейсоқ сан (seed) пен AF2 салмақ хеші сақталмаған. Ол тізбекаралық pTM (ipTM) пен екі бағытталған ipSAE мәнінің арифметикалық ортасын өлшейді. ActifpTM біріздендірілген AF2-мен бірдей өкілді кешен мен AF2-Multimer конфигурациясын қолданады; ол AF2 болжаған 8 Å төмен тізбекаралық қашықтық ықтималдықтарымен салмақталған интерфейстік pTM есептейді. PRODIGY параметрлерді өзгертпей, стандартты 25 ^°C түрлендіруін пайдалана отырып Δ G (ккал·моль⁻¹) пен K_D (М) болжау үшін біріздендірілген AF2-Multimer болжаған кешенді қолданады. ESMFold2 тек нысана және байланыстырушы тізбектерін пайдаланады; 20 цикл, 100 іріктеу қадамы, бір диффузиялық үлгі және өкілдің бекітілген бүтін сан түріндегі бағалау индексіне тең seed. Boltz-2 де тек тізбектерді бос көптік тізбекті түзу (MSA) режимімен, 200 іріктеу қадамымен, үш қайта өңдеу циклімен, бір диффузиялық үлгімен және толық PAE шығысымен пайдаланылады; ол ақуыздың ipTM-ін, екі бағыт бойынша орташаланған нысана-байланыстырушы қалдық жұптарының орташа PAE мәнін (Å) және байланыстырушының орташа pLDDT мәнін (0–1 шкаласы) береді.&lt;/p&gt;\n&lt;h4 id=\"d42-metrikagha-khatysty-khyskha-tizimder\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d42-metrikagha-khatysty-khyskha-tizimder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.4.2. Метрикаға қатысты қысқа тізімдер&lt;/span&gt;&lt;/a&gt;D.4.2. Метрикаға қатысты қысқа тізімдер&lt;/h4&gt;\n&lt;p&gt;S20–S22 кестелері әрбір әдіс пен нысана жұбы үшін белгіленген TM0.6 өкілдерін алты түрлі рейтинг жүйесі бойынша қорытындылайды: минималды біліктілік шегі, AF2 ipTM, орташа бағытталған ipSAE, ESMFold2 жалпы ipTM, actifpTM және PRODIGY болжанған жақындық (affinity). Әрбір рейтинг өзінің қысқаша тізімін құрайды; Δ G және K_D бірдей жақындық бойынша реттелген тізімді сипаттайды. Қолжетімді N өкілдерден әр тізім бос орындарсыз &lt;span class=\"yfm-latex\" data-content=\"n%20%3D%20%5Cmin(10%2C%20N)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; мөлшерін сақтайды. Шекті мәндер B.2 бөлімінде, ал посткалибрлік метрикалар D.4.1 бөлімінде сипатталған. Бұл жиынтықтар бір ортақ көп метрикалық тізімді емес, әр түрлі көлемдегі жиындардан метрикаға тән іріктеуді сипаттайды. Рейтинг ұпайлары таңдалған дизайнды да қорытындылайтындықтан, бұл тәуелсіз валидация болып табылмайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метрикаға қатысты қысқа тізімдер әрбір нысана (CD45, BetV1, CbAgo) үшін әртүрлі алгоритмдер (T-REX, PUCT, ε-greedy, Complexa-only, BindCraft-only, BoltzGen-only) негізінде AF2 ipTM және еркін энергия Δ G сияқты критерийлер бойынша ең жақсы 10 нұсқаға дейін іріктейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Іріктеу және тең нәтижелерді шешу (tie-breaking) қатаң иерархияға негізделген. Шекті рейтинг дизайнды кему ретімен &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, содан кейін орташа шекті мән, одан әрі pLDDT, iPAE және scRMSD шектері бойынша реттейді. Әрбір сенімділік рейтингі аталған көрсеткіштің кемитін мәндерін, содан кейін &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; мен орташа шекті мәнді қолданады. Жақындық рейтингі өсетін K_D, содан кейін Δ G, одан кейін кемитін &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; мен орташа шекті мәнді пайдаланады. Қалған теңдіктер тұрақты жазба идентификаторының өсу ретіндегі лексикографиялық тәртібімен шешіледі. Барлық рейтингтерде экранға шығару үшін дөңгелектеуге дейінгі бастапқы сандық мәндер қолданылады.&lt;/p&gt;\n&lt;p&gt;CD45 нысанасы үшін T-REX әдісі (N=301) n=10/10 таңдамасын құрайды: минималды шек &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D%20%3D%200.359\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; [0.395, 0.328], AF2 ipTM 0.872 [0.887, 0.865], орташа бағытталған ipSAE 0.714 [0.729, 0.711], ESMFold2 ipTM 0.813 [0.906, 0.778], actifpTM 0.959 [0.974, 0.958], PRODIGY Δ G = -12.90 [-13.40, -12.00] ккал моль⁻¹ және K_D = 3.6× 10⁻¹⁰ [1.5× 10⁻¹⁰, 1.5× 10⁻⁰⁹] М. PUCT әдісі (N=69) n=10/10 береді: &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D%20%3D%200.225\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; [0.364, 0.199], AF2 ipTM 0.824 [0.876, 0.819], ipSAE 0.622 [0.715, 0.594], ESMFold2 ipTM 0.716 [0.827, 0.685], actifpTM 0.946 [0.961, 0.934], Δ G = -11.50 [-13.00, -10.90], K_D = 3.7× 10⁻⁰⁹ [3.0× 10⁻¹⁰, 1.0× 10⁻⁰⁸]. ε-greedy нұсқасы (N=27) n=10/10 береді: &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D%20%3D%200.289\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; [0.497, 0.224], AF2 ipTM 0.838 [0.880, 0.
