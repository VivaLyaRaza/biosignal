жағдайда ол нөлге тең. Нормаланған тапшылықты табу үшін бұл мән сәйкес рұқсат шегіне бөлінеді. Одан кейін ағымдағы сапа мен жақсарту мәндері есептеледі. Ағымдағы сапа шекке жеткен бақылаулардың үлесін (1.0), рұқсат шегіндегілерді (0.5) және қалғандарын (0.0) есепке алады. Жақсарту өткен және қазіргі медиандық нормаланған тапшылықтардың айырмашылығын бағалайды. Алынған мәндер S7 кестесіндегі салмақтарға көбейтіледі (тікелей қатысты параметрлер үшін 1.0, қалғандары үшін 0.6). Бағыт ұпайы өлшемдер арасындағы ең үлкен салмақты мәнге тең болып, 0 мен 1 аралығында үш таңбаға дейін дөңгектеліп сақталады. S7 кестесінде қосымша өлшемдер үшін анықтамалық мәндер мен салмақтар толық берілген.&lt;/p&gt;\n&lt;h4 id=\"c44-marshrut-kuejining-erezheleri\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c44-marshrut-kuejining-erezheleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.4.4. Маршрут күйінің ережелері&lt;/span&gt;&lt;/a&gt;C.4.4. Маршрут күйінің ережелері&lt;/h4&gt;\n&lt;p&gt;Әрбір маршрутта қабылдау мен кейінге қалдыруды бағалау үшін қолданылатын жалпы күй (status), сондай-ақ жалғасып жатқан, кешіктірілген және төмендеп жатқан өнімділікті ажырататын соңғы өнімділік күйі (marginal_status) бар. Екеуі де төмендегі бірінші сәйкес келген ережені қайтарады және күтілудегі бағалауды бөлек анықтайды. Отбасылық агрегаттар да осы ережелерді пайдаланады, бірақ 32 аяқталу тесті ажыратылған және сапалы кластердің дубликат үлесі берілмейді. Бұл күйлер маршруттарды немесе отбасыларды сипаттайды; C.4.5 бөлімі бүкіл науқанның күйлерін анықтайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;&lt;/blockquote&gt;\n&lt;p&gt;Маршрут күйі мен өнімділік күйі ресурстар шығындарына, дубликаттар үлесіне және SU (ақы төленетін бірліктер) өсіміне сүйене отырып, есептеу тармақтарының өміршеңдігін автоматты түрде анықтайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Терезе анықтамалары. 60 жазбадан тұратын терезе соңғы 60 науқан ResultRecords нәтиже жазбаларын қамтиды; 3 және 6 GPU-сағаттық терезелер науқан бойынша жазылған шығындарды пайдаланады (C.4.1 бөлімі). Өсім — бұл көрсетілген терезе шегінде маршрутқа берілген жаңа желілік SU. Соңғы жақын қате жіберулер (near misses) — C.4.2 бөліміндегі кластерлік тексерулерге бағынатын 60 жазбалы терезедегі жеке жақын қате жазбалары. Маршрут шығындары тиісті ата-баба шығындарын қамтиды; өмірлік көрсеткіштер барлық бақыланатын тарихты пайдаланады.&lt;/p&gt;\n&lt;p&gt;Дубликат өлшемдері. Сапалы/SU қатынасы — бұл маршруттың сапалы жазбалар санын оған берілген SU санына бөлгендегі мән; SU саны нөлге тең болған кезде бұл қатынас қолжетімсіз. Маршруттың дубликат үлесі Eq. (S3) теңдеуі арқылы есептеледі, мұнда Nassigned пен Nclusters маршруттың жиынтық сапалы кластерге тағайындалған жазбалары бойынша есептеледі. Дубликат туралы ескерту сапалы/SU ≥ 8 немесе дубликат үлесі ≥ 0.80 екенін білдіреді. Жетіспейтін дубликат өлшемдері өздерінің шекті тестілерін қанағаттандыра алмайды.&lt;/p&gt;\n&lt;p&gt;Салыстыру жылдамдығы. Ең жақсы жетілген жылдамдық — бұл ең аз дегенде екі тағайындалған SU және екі маршруттық GPU-сағаты бар нақты маршруттар арасындағы ең үлкен өмірлік SU/GPU-h жылдамдығы; егер ешқайсысы сай келмесе, нөлге тең. Жетіспейтін жылдамдықтар тек төмендегі ережелерді салыстыру үшін нөл ретінде қарастырылады.&lt;/p&gt;\n&lt;p&gt;AF2 құрылымын бағалау жолдары. AF2 бағалау жолдары төмендегі генерация/қайта жобалау жіктеулерін айналып өтеді. Стандартталған бағалау plumbing мұрағат белгісін алып жүреді; код advisory мәнін басқа бағалау рөлдері үшін, соның ішінде ата-аналық модельді әдейі қайта бүктеу үшін сақтайды.&lt;/p&gt;\n&lt;p&gt;Жалпы күй ережелері:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;untried (сынақтан өтпеген): оң жинақталған маршрут шығыны жоқ.&lt;/li&gt;\n&lt;li&gt;awaiting_score_conversion (бағаны түрлендіруді күту): тағайындалған SU жоқ және стандартталған AF2 бағалауын күтіп тұрған кем дегенде бір перспективалы жарамды шығыс бар. Қабылдау сигналдары C.8.1 бөлімінде анықталған.&lt;/li&gt;\n&lt;li&gt;collapse_risk (құлдырау қаупі): не дубликат туралы ескерту, кем дегенде бір тағайындалған SU, кем дегенде сегіз сапалы жазба және 60 жазба немесе 6 GPU-сағаттық SU өсімінің болмауы; немесе сапалы/SU ≥ 8, өмірлік жылдамдық ≤ 0.30 және не 6 GPU-сағаттық өсімнің болмауы, не оң 60 жазбалы өсім.&lt;/li&gt;\n&lt;li&gt;defer (кейінге қалдыру): не өмірлік SU де, соңғы жақын қате жіберу де жоқ, кем дегенде 3 маршруттық GPU-сағаты немесе 32 аяқталған ResultRecords бар; немесе ең жақсы жетілген жылдамдық ≥ 0.50, кем дегенде 3 маршруттық GPU-сағаты, сол ең жақсы жылдамдықтың 35%-ынан төмен өмірлік жылдамдық және 60 жазба, 6 GPU-сағат немесе соңғы жақын қате жіберу өсімінің болмауы. Мұндағы аяқталған ResultRecords ok немесе no_artifacts күйіне ие; бір тапсырма бірнеше жазба шығара алады.&lt;/li&gt;\n&lt;li&gt;observed (stale) (бақыланатын / ескірген): кем дегенде бір өмірлік SU, бірақ 60 жазба, 6 GPU-сағат немесе соңғы жақын қате жіберу бойынша SU өсімі жоқ, 60 жазбалық терезеде кем дегенде 1 маршруттық GPU-сағаты бар.&lt;/li&gt;\n&lt;li&gt;diversify (диверсификациялау): кем дегенде бір өмірлік SU және не сапалы/SU ≥ 4, не дубликат үлесі ≥ 0.55.&lt;/li&gt;\n&lt;li&gt;promote (ілгерілету): кем дегенде бір өмірлік SU, оң ең жақсы жетілген жылдамдық және осы салыстырғыштың кем дегенде 80%-ын құрайтын өмірлік жылдамдық. 60 жазбалы SU өсімінің болмауы, сапалы/SU ≥ 8 немесе дубликат үлесі ≥ 0.70 ілгерілетуге кедергі жасайды.&lt;/li&gt;\n&lt;li&gt;healthy; otherwise observed (салауатты; әйтпесе бақыланатын): алдыңғы ережелерден кейін кем дегенде бір өмірлік SU немесе соңғы жақын қате жіберу healthy күйін береді; әйтпесе observed.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Соңғы өнімділік күйі (marginal_status):&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;untried; awaiting_score_conversion: жалпы күй жіктеуімен бірдей алғашқы екі тест қолданылады.&lt;/li&gt;\n&lt;li&gt;under_tested; otherwise dry_low_quality (жеткіліксіз тексерілген; әйтпесе құрғақ сапасыз): нөлдік өмірлік SU бар маршрут үшін, жинақталған маршрут шығыны 3 GPU-сағаттан төмен және аяқталулар 32 ResultRecords-тан аз болғанда немесе соңғы жақын қате жіберу болғанда under_tested қолданылады. Әйтпесе dry_low_quality пайдаланылады.&lt;/li&gt;\n&lt;li&gt;productive_but_duplicate (өнімді, бірақ дубликатты): дубликат туралы ескерту және 60 жазба немесе 3 GPU-сағаттық терезеде SU өсімі.&lt;/li&gt;\n&lt;li&gt;delayed_productive; duplicate variant (кешіктірілген өнімді; дубликат нұсқасы): 6 GPU-сағаттық терезеде SU өсімі бар, бірақ 60 жазба немесе 3 GPU-сағаттық терезелердің ешқайсысында жоқ. Дубликат туралы ескерту белгіні delayed_productive_duplicate етіп өзгертеді.&lt;/li&gt;\n&lt;li&gt;dry_duplicate (құрғақ дубликат): дубликат туралы ескерту, 3 немесе 6 GPU-сағаттық SU өсімінің болмауы және соңғы жылдамдықтың төмендеуі: 3 GPU-сағаттық терезеде кем дегенде 1 маршруттық GPU-сағаты болып, 60 жазба және 3 GPU-сағаттық терезелердегі үлкенірек SU/GPU-h жылдамдығы оң өмірлік жылдамдықтың 35%-ынан төмен болады.&lt;/li&gt;\n&lt;li&gt;productive (өнімді): 60 жазба немесе 3 GPU-сағаттық терезеде SU өсімі.&lt;/li&gt;\n&lt;li&gt;dry; otherwise observed (құрғақ; әйтпесе бақыланатын): соңғы жылдамдықтың төмендеуін тексеру және 6 GPU-сағаттық SU өсімінің болмауы dry күйін береді; қалған барлық маршруттар observed ретінде белгіленеді.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"c45-kampaniya-kuejin-anykhtau-erezheleri\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c45-kampaniya-kuejin-anykhtau-erezheleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.4.5. Кампания күйін анықтау ережелері&lt;/span&gt;&lt;/a&gt;C.4.5. Кампания күйін анықтау ережелері&lt;/h4&gt;\n&lt;p&gt;Бақылаушы ресурстар шығыны, соңғы нәтижелер, жаңа SU (құрылымдық бірліктер), дубликаттар, «дерлік сәтті» (near-miss) нәтижелер және критерийлер бойынша тапшылықтар негізінде жеті кампания күйінің бірін тағайындайды. Күй белгілері тапсырмаларды бөлу басымдықтарын басқарады. low_evidence деректер жинауға, productive тиімді бағыттарды жалғастыруға, productive_duplicate диверсификацияға, ал strict_duplicate_collapse балама конфигурацияларға бағытталған. rescue_rich ресурстарды шектеулі критерийге бағыттайды, stalled Rescue немесе Explore күйлерін іске қосады, ал deep_stall тиімсіз жолдардың басымдығын төмендетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SU (&lt;a href=\"concepts/structural-units.html\"&gt;Structural Units&lt;/a&gt;) — генерация процесінің сәттілігін бағалау үшін қолданылатын құрылымдық модельдердің сапасы немесе жаңалығының метрикасы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Критерийлер концентрациясы near-miss санынан бөлек есептеледі. a критерийі үшін соңғы 60 жазбадағы медиандық тапшылық d_a және рұқсат етілген қателік b_a анықталады. Классификатор &lt;span class=\"yfm-latex\" data-content=\"C_%7Baxis%7D%20%3D%20%5Cmax_a(d_a%2Fb_a)%20%5Csum_a(d_a%2Fb_a)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; көрсеткішін пайдаланады, мұнда 0,50 мәні масштабталған медиандық тапшылықтар үшін шекті мән болып табылады. «Суық старт» (cold start) шартына сәйкес, егер шығын 1,0 GPU-сағаттан аз немесе жазбалар саны 3-тен кем болса, low_evidence тағайындалады. Әйтпесе, ережелер тізбегі тексеріледі: құрылымдық дубликаттарды қысқарту, өнімділік, near-miss байыту және stalled/deep_stall күйлері.&lt;/p&gt;\n&lt;p&gt;Қысқарту күйі сенімді кластерлеуді, кемінде 40 білікті дизайнды, екі SU кластерін, әр SU үшін орташа 8 дизайнды, жинақталған шығын ≤ 0,30 SU/GPU-сағат және соңғы SU өсімі ≤ 1 болуын талап етеді. Foldseek кластерлерінің қатынасы (TM-score 0,8-ден 0,6-ға дейін) 1,30-дан аспауы тиіс. Өнімділік үшін өсім &amp;gt; 0 және жылдамдық ≥ 0,04 жаңа SU/GPU-сағат болуы шарт (кемінде 0,5 GPU-сағат, Кесте S6). Дубликаттар үлесі &amp;lt; 0,60 болса, productive, әйтпесе productive_duplicate күйі таңдалады. Near-miss байыту үшін ≥ 3 кластер және Caxis ≥ 0,50 талап етіледі. 12,0 GPU-сағат ішінде жаңа SU болмаса, жүйе deep_stall күйіне ауысады.&lt;/p&gt;\n&lt;h4 id=\"c51-model-zhaene-shakhyru-parametrleri\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c51-model-zhaene-shakhyru-parametrleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.5.1. Модель және шақыру параметрлері&lt;/span&gt;&lt;/a&gt;C.5.1. Модель және шақыру параметрлері&lt;/h4&gt;\n&lt;p&gt;Екі рөл де (Planner және Supervisor) бір H100 GPU-да vLLM арқылы жергілікті Qwen3.6-27B-FP8 чекпоинтін пайдаланды (Кесте S4). Контекст шегі 65 536 токен, GPU жадын пайдалану 0,90 болды. Шақыру параметрлері: max_tokens=3072, timeout_s=90, max_retries=1. Planner температурасы 0,2, Supervisor-дікі 0,0 болды. Сенімділік (confidence) 0,55-тен төмен болса, бұл тіркелді, бірақ жауап қабылданбады. Supervisor сенімділігі 0,65-тен төмен болса, бөлу шектеулері іске қосылуы мүмкін еді. Әр шақыру модель идентификаторымен, промпт хэшімен (SHA-256), формат нұсқасымен, парсинг күйімен және токендер санымен бірге сақталды.&lt;/p&gt;\n&lt;h4 id=\"c52-kiris-derekterining-mazmuny-zhaene-suralatyn-naetizheler\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c52-kiris-derekterining-mazmuny-zhaene-suralatyn-naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.5.2. Кіріс деректерінің мазмұны және сұралатын нәтижелер&lt;/span&gt;&lt;/a&gt;C.5.2. Кіріс деректерінің мазмұны және сұралатын нәтижелер&lt;/h4&gt;\n&lt;p&gt;LLM кіріс деректері мен көлем шектеулері. Архивтелген Дәлелдер жиынтығы (Evidence Summary) 32 дәл бағыт жолдарын (routerows) және 20 жоспарлау жаңартуларының жиынтығын (planning-updatesummaries) сақтап қалды. Екінші қысқарту екі LLM-ге де жиынтық онлайн TM0.6 SU қосындыларын, барлық әдіс жиынтықтарын және отбасы деңгейіндегі бағыт жолдарын, сондай-ақ басымдығы жоғары дәл бағыттарды, он сыналған конфигурация жиынтығын (recipes), сегіз стратегия нәтижелерінің жиынтығын (strategy_feedback), конфигурацияға байланысты сегіз дизайнды (exemplars), төрт иллюстрациялық нәтиже жазбасын (examples) және он жаңарту тарихы жазбасын ұсынды (S2a-сурет; анықтамалар C.4.1 бөлімінде келтірілген).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Контекстті сүзгілеу мен жинақы жүйелеу арқылы LLM модельдеріне түсетін жүктеме оңтайландырылады: бұл маңызды параметрлерді жоғалтпай, тек өзекті гипотеза карточкалары мен бағыттар жиынтығын өңдеуге мүмкіндік береді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жоспарлаушы сонымен қатар сегізге дейін белсенді немесе соңғы Гипотеза карточкаларын (HypothesisCards), қолжетімді әрекет отбасыларын, рұқсат етілген параметрлерді және тапсырма бойынша жұмыс жүктемесі шектеулерін қабылдады. Супервайзер ағымдағы карточкаларды, жарамды үміткер тапсырмаларды және таңдау контекстін, соның ішінде қолжетімді жұмысшы слоттары мен соңғы басталу оқиғаларын алды. Дәл бағыт жолдары отбасы жиынтықтарының алдында келді. Қысқарту процесі толық ата-аналық идентификаторлар тізімін санауышпен және қолжетімділік жалаушасымен алмастырды; нақты идентификаторлар таңдалған мысалдарда және үміткерлерді құру үшін қолжетімді болып қалды.&lt;/p&gt;\n&lt;p&gt;Процесс мақсатты идентификатор мен мақсатты сынып кілттерін рекурсивті түрде алып тастады, жоғары деңгейдегі жетіспейтін скалярларды және бос жолдарды өткізіп жіберді, бірақ recipes пен joint_patterns сияқты бос дәлелдер жиынтықтарын және нөлдік әрекеттері бар әдіс жиынтықтарын сақтап қалды. Бұл олқылықтар өлшемдерді болжап енгізуді білдірмейді. Екі динамикалық промпт қысқа дәлелдер дайджестімен (evidencedigest) басталып, одан кейін рөлге тән JSON келді. D.2.1 бөлімінде сақталған толық промпт емес, архивтелген дәлелдер жиынтығынан үзінді және қалпына келтірілген қысқартылған кіріс үзіндісі көрсетілген. Ешбір рөл бұл интерфейс арқылы еркін архив файлдарын оқыған жоқ немесе өлшемдерді жазған жоқ. S2b-сурет кірісті дайындауды, шақыруларды және кейінгі жазбаларды жоспарлау жаңартуы аясында орналастырады.&lt;/p&gt;\n&lt;p&gt;Сұралатын нәтижелер. Екі рөл де сервер арқылы мәжбүрлі JSON форматтауынсыз бір JSON облысын сұрады. Жоспарлаушы өрістері abstain, confidence, rationale және cards болды, қосымша fail_reason өрісі бар. Жоспарлаушының бас тартпаған жауабы бір мен төрт аралығындағы карточкаларды қамтуы талап етілді, олардың әрқайсысы дәлелдерге сілтеме жасап, талапты, R/E/X жақындықтарын (басымдық белгілері ретінде қолданылатын салыстырмалы салмақтарды), бір немесе бірнеше біліктілік өлшемдеріндегі болжанған өзгерістерді, сақтау шектеулерін, ұсынылған отбасыларды және қосымша параметрлерді көрсетті.&lt;/p&gt;\n&lt;p&gt;Болжанған өзгерістер бірдей реттелген базалық сілтемелерді бөлісті; C.9 бөлімі олардың кейінгі бағалануын анықтайды. D.2.2 бөлімі архивтелген карточка мен оның жасалған үміткер тапсырмасын береді. Супервайзер mode_mixture және ранжирленген candidate_decisions тізімін қайтарды, оларда abstain, confidence және rationale өрістері болды. Әрбір қайтарылған үміткер белгілі бір басымдыққа тиесілі болып, 1-ден қайтарылған мәнге дейінгі бірегей жаһандық рангтерге және әрбір басымдық шеңберіндегі бірегей оң рангтерге ие болды.&lt;/p&gt;\n&lt;p&gt;Бөлу мәндері (allocation values) шекті, теріс емес және қосындысы бірге тең болды. Төмендегі JSON бір үміткер үшін сұралатын өрістерді көрсетеді; шаршы жақшадағы жолдар толтырғыштар болып табылады, ал сан мәндері иллюстрациялық сипатта. D.2.2 бөлімі нақты басымдықтарды белгілеу мысалын береді.&lt;/p&gt;\n&lt;p&gt;Әрбір карточка мен шешім reasoning_trace ішінде үш қысқа түсіндірме өрісін сұрады: байқалған сигнал (observed_signal), қорытынды (inference) және әрекет салдары (action_implication). Бұлар жеке модель ойлауының жазбалары емес, есеп берілген түсіндірмелер еді. Супервайзер жауабы үміткерлердің тек ішкі жиынын, соның ішінде ешқайсысын да ранжирлей алатын еді. Оның ресурс сыныптары аудитті және даулы жағдайларды шешуді қолдады; бөлу шектеулері мен орындалу детерминирленген күйінде қалды (C.7.1 және C.8.2 бөлімдері).&lt;/p&gt;\n&lt;p&gt;Талдау және тексеру. Талдау бірінші JSON облысын шығарып алып, танылған өріс варианттарын қалыпқа келтірді. Жоспарлаушыны тексеру өріс түрлерін, дәлелдер сілтемелерін, өлшем бағыттарын және басымдық жақындықтарын тексерді; қолжетімді емес отбасылар жойылды және үміткерлерді құру параметрлер шекарасының сақталуын қамтамасыз етті. Супервайзерді тексеру үміткер/дәлел сілтемелерін, бөлу мәндерін, басымдық тағайындауларын, рангтерді және ресурс сыныптарын тексерді. Супервайзердің жетіспейтін түсіндірме өрістері қайтарылған сілтемелер мен түсіндірме мәтінінен толтырылуы мүмкін еді.&lt;/p&gt;\n&lt;h4 id=\"c53-prompt-nuskhaulary\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c53-prompt-nuskhaulary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.5.3. Промпт нұсқаулары&lt;/span&gt;&lt;/a&gt;C.5.3. Промпт нұсқаулары&lt;/h4&gt;\n&lt;p&gt;Әрбір рөл өз тапсырмасын анықтайтын жүйелік промптті және ағымдағы дәлелдер мен рөлге тән кірістерді қамтитын динамикалық пайдаланушы промптті алады (S2a-сурет). Төмендегі қораптар сақталған науқанды жинақтайды: жүйелік нұсқаулар қысқартылған, кіріс денелері схемалық, ал түзету хабары үлгі үзіндісі болып табылады. Олар архивтелмеген толық тарихи промпттер емес. Кіріс схемаларында шаршы жақшадағы жолдар құрылымдық жазбаларды немесе орындалу кезінде берілген мәтінді білдіреді. C.5.2 бөлімі сұралатын шығыс өрістерін көрсетеді; D.2.2 бөлімі архивтелген жауаптар мен байланысқан үміткер тапсырмаларын береді.&lt;/p&gt;\n&lt;h4 id=\"zhalpy-ghylymi-nuskhaular-khyskhartylghan\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#zhalpy-ghylymi-nuskhaular-khyskhartylghan\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жалпы ғылыми нұсқаулар (қысқартылған)&lt;/span&gt;&lt;/a&gt;Жалпы ғылыми нұсқаулар (қысқартылған)&lt;/h4&gt;\n&lt;p&gt;Шешімдер мақсатты бірегейлік туралы алдын ала болжамдарсыз, берілген нәтижелер мен шектеулерге негізделді. Басты мақсат — жұмсалған жұмыс сағатына шаққандағы жаңа TM0.6 SU көрсеткішін барынша арттыру. Әдістер мен конфигурацияларды салыстыру кезінде отбасылық қорытындыларға дейін нақты маршрут нәтижелері мен толық шығындар қолданылды (S6 кесте). Қайталанған тапсырмалар SU қоспады, ал басталмаған немесе өлшенбеген тапсырмалар қате ретінде емес, шешілмеген деректер ретінде қарастырылды. Қосымша өлшеулер кейінгі тексерулерге ұсыныс жасағанымен, негізгі критерийлерді алмастырмады. Нәтижелер мен түсіндірмелер үш reasoning_trace өрісі арқылы қайтарылды.&lt;/p&gt;\n&lt;p&gt;Науқан деңгейіндегі уақыт шығындары бос тұрған уақытты қоса есептегенде GPU жұмыс сағаттарымен өлшенді, ал маршруттар үшін толық шығындар ескерілді (S6 кесте). Төмен құнды Complexa маршруттары үшін шамамен 0.5 GPU сағаты, ал күрделірек немесе кешіктірілген бағыттар үшін (соның ішінде BindCraft, BoltzGen, ProteinMPNN redesign және Complexa MCTS) 1.5–2 сағат уақыт бағдары берілді.&lt;/p&gt;\n&lt;h4 id=\"planner-zhuejelik-nuskhaulary-khyskhartylghan\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#planner-zhuejelik-nuskhaulary-khyskhartylghan\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Planner жүйелік нұсқаулары (қысқартылған)&lt;/span&gt;&lt;/a&gt;Planner жүйелік нұсқаулары (қысқартылған)&lt;/h4&gt;\n&lt;p&gt;Жоспарлаушы соңғы деректер негізінде біредістен төртке дейін тексерілетін гипотеза карталарын ұсынды. Әрбір картада тұжырым, дәлелдер, ұсынылатын әдістер мен параметрлер, сондай-ақ pLDDT, iPAE немесе scRMSD көрсеткіштерінің болжамды өзгерістері көрсетілді. Болжам бойынша pLDDT артуы, ал iPAE пен binder scRMSD кемуі тиіс еді. Анықталған әлсіз тұстарға қарай әрекеттер таңдалды: scRMSD үшін реттілікті қайта жобалау, iPAE үшін интерфейс немесе қаңқа іздеу, ал төмен pLDDT үшін регенерация қолданылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Жоспарлаушы L0–L4 деңгейлерін қатаң реттілік ретінде емес, икемді басымдық ретінде пайдаланды: бастапқы қамтудан (L0) бастап, отбасыішілік параметрлерді өзгерту (L1), ата-аналық тармақтарды қайта өңдеу (L2), марапат салмақтарын реттеу (L3) және қымбатырақ іздеуді кеңейтуге (L4) дейінгі қадамдарды қамтыды.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Planner динамикалық сұранысы evidence, active_hypotheses, seed_action_families, available_families_this_cluster, family_role_table, allowed_params_per_family, eval_budget_per_family және instructions өрістері бар JSON құрылымы түрінде берілді. Детерминирленген кеңесші жалаушалар қосымша Critic LLM шақыруынсыз берілді (C.5.4 бөлімі) және тек ұсыныстар жасау үшін қызмет етті.&lt;/p&gt;\n&lt;h4 id=\"supervajzer-nuskhaulary-men-prompttary\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#supervajzer-nuskhaulary-men-prompttary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Супервайзер нұсқаулары мен промпттары&lt;/span&gt;&lt;/a&gt;Супервайзер нұсқаулары мен промпттары&lt;/h4&gt;\n&lt;p&gt;Супервайзер моделі ағымдағы деректерді, гипотеза карталарын және жарамды кандидат тапсырмаларды R/E/X ресурстарды бөлу үлестерін ұсыну және тапсырмаларды реттілікке қою үшін пайдаланады. Бұл үлестер шекті, теріс емес және қосындысы бірге тең болуы тиіс, әрі олар GPU уақыт үлестеріне емес, болашақ генерация және қайта жобалау бастамаларына қатысты. Реттеу үшін тек ұсынылған кандидат идентификаторлары қолданылады және олардың әрқайсысы 1 мен N аралығындағы бірегей жаһандық рангке ие болады. Бірінші ранг келесі жұмыс процесі үшін еדі жоғары басымдықты білдіреді. Басқа жағдайлар тең болған кезде, жүйе дәл маршруттың толық құны үшін соңғы жаңа SU бірліктеріне басымдық береді. Тиімділігі салыстырмалы маршруттар арасында төменгі квартильдік біліктілік бағасы жоғарырақ нұсқа, содан кейін оның медианасы таңдалады (C.4.3-бөлім).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;R/E/X бөлу — ғылыми эксперименттерді оңтайландыру үшін есептеу ресурстары мен тапсырмаларды ықтималдықтар немесе салмақтар көмегімен басқару әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сирек толтырылған есептеуіштерге сақтықпен қаралады, өйткені жоғары сапа тиімділіктегі айтарлықтай артта қалуды өтемейді. Арнайы диагностикалық деректерді тексеру жергілікті генератордың қабылдануын біліктілік ретінде есепке алмай, негізделген келесі қадамды таңдауға мүмкіндік береді. Ұсынылған үлестер тапсырмалардың ағымдағы басымдықтарына сәйкес келуі тиіс. Ағымдағы қажеттіліктерді түсіндіру үшін науқан күйі, құрылымдық телмерею, жаңа SU жоқ уақыт, күтудегі жұмыстар және расталған бастамалар қолданылады. Таңдалған, бірақ әлі басталмаған тапсырма сәтсіз ғылыми сынақ емес, орындалу кезектегі міндет болып саналады. AF2 көмегімен міндетті бағалау детерминирленген ережелерге бағынады және тілдік модельдің R/E/X бөлінісіне кірмейді.&lt;/p&gt;\n&lt;p&gt;Супервайзердің динамикалық пайдаланушы промпты дәлелдер дайджестін (EVIDENCEDIGEST), араластыру нұсқаулығын (MIXTUREGUIDANCE) және JSON құрылымын қамтиды. Валидация қатесі орын алған жағдайда, әрбір кандидат ID-інің тек БІР режимде болуын және барлық кандидаттарға 1..N аралығында бірегей жаһандық ранг берілуін талап ететін шартты түзету хабары жіберілуі мүмкін. Бұл түзету C.5.2-бөлімде сипатталған қателер үшін бір рет жіберілуі мүмкін.&lt;/p&gt;\n&lt;h4 id=\"shakhyru-sharttary-men-kengestik-tekseruler\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#shakhyru-sharttary-men-kengestik-tekseruler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шақыру шарттары мен кеңестік тексерулер&lt;/span&gt;&lt;/a&gt;Шақыру шарттары мен кеңестік тексерулер&lt;/h4&gt;\n&lt;p&gt;Жоспарлаушының сегіз картадан тұратын жады әр карта үшін ең соңғы жазбаны пайдаланды, бұл ретте белсенді карталарға, сондай-ақ жақында қолдау тапқан немесе жоққа шығарылған карталарға басымдық берілді, ал ескірген карталар шығарып тасталды. Жарамсыз, бос немесе бейтарап жауаптар жаңа карталар тудырмады, сондықтан жүйе сақталған карталар мен ережелер бойынша енгізілген кандидаттарға сүйенді. Жоққа шығарылған немесе аяқталған карталар жаңа кандидаттар тудыра алмады. C.9-бөлім карта күйі мен өмірлік циклін анықтайды. Супервайзер бос емес карталар тізімімен және жарамды кандидаттар жинағымен шақырылды, әйтпесе бақылаушы шақыруды өткізіп жіберу себебін тіркеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Детерминирленген тексеру — ықтималдық тәсілдерін қолданмай, деректерді қатаң ережелер бойынша тексеру процедурасы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қосылған детерминирленген кеңестік тексеру жоспарлаушының карталарды қамтитын жарамды жауабы үстінен іске қосылды. Ол алдын ала есептелген орындалу уақыты қалған жұмыс уақытынан асып кеткен отбасыларды белгіледі. Сондай-ақ бірдей отбасыдағы сақталған сәтсіз рецептпен кемінде екі ортақ параметр бойынша сәйкес келетін конфигурациялар анықталды. Барлық ортақ мәндер сәйкес келуі, сәтсіз рецепт кемінде екі сәтсіз ұрпаққа ие болуы және оның хэші сақталған табысты рецепттер арасында болмауы тиіс еді. Тексеру ағымдағы карталарды, кандидаттарды және таңдауды өзгертпеді. Жалаулар нөлдік токен және нөлдік кідіріске ие LLM шақыру жазбасы ретінде сақталды (S15-кесте, А бөлігі).&lt;/p&gt;\n&lt;h4 id=\"kandidattardy-khuru-zhaene-validaciyalau\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#kandidattardy-khuru-zhaene-validaciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кандидаттарды құру және валидациялау&lt;/span&gt;&lt;/a&gt;Кандидаттарды құру және валидациялау&lt;/h4&gt;\n&lt;p&gt;Тексеру және құрастыру (Check + Build) процесі әрекет отбасыларын, ұсынылған баптауларды және қажетті ата-аналық элементтерді әрекеттер тізілімімен және архивпен сәйкестендіру арқылы гипотеза карталарын кандидат тапсырмаларға айналдырады. Валидация рұқсат етілген баптауларды сақтайды, қолдау таппайтын жазбаларды жояды және сан мәндерін шектеулерге сай келтіреді (S5-кесте). Түзетуге келмейтін тапсырмалар жарамсыз болып қалады. Ата-аналық шекараларды қайта жобалау және бағалау жарамды нысаналы және байланыстырушы тізбектері бар шешілетін құрылымды талап етеді. C.8-бөлім кезек пен басталу уақытын тексеру процестерін сипаттайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кандидаттарды валидациялау — есептеу эксперименттеріне рұқсат беру алдында жасалған тапсырмалар параметрлерінің дұрыстығын автоматты түрде тексеру процесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"c62-complexa-konfiguraciyasyna-tolykhtyrular-men-auystyrular\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c62-complexa-konfiguraciyasyna-tolykhtyrular-men-auystyrular\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.6.2. Complexa конфигурациясына толықтырулар мен ауыстырулар&lt;/span&gt;&lt;/a&gt;C.6.2. Complexa конфигурациясына толықтырулар мен ауыстырулар&lt;/h4&gt;\n&lt;p&gt;Өлшемге негізделген әдепкі параметрлер мен нақтылау. Негізгі көрсеткіш HypothesisCard-тағы бірінші болжамды өзгеріспен анықталады; егер ол көрсетілмесе, әдепкі бойынша iPAE қолданылады. Болжамды өзгерістер бар болса, бірақ параметрлер белгіленбесе, байланыстырушы домен scRMSD үшін &lt;a href=\"concepts/sequence-hallucination.html\"&gt;sequence hallucination&lt;/a&gt; немесе iPAE үшін адаптивті шу (sc_scale_noise = 0,30) қолданылады. Ашкөз оңтайландыру (greedy optimization) қосылғанда немесе итерациялар саны белгіленгенде, sequence hallucination алгоритмі таңдалады. Марапаттау салмақтары (reward weights) жоқ конфигурациялар үшін бұл алгоритм жүйе тоқтап қалғанда (stalled, deep-stall) немесе құрылымдық дубликаттар болғанда таңдалады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sequence hallucination — бұл ақуыз тізбектерін белгілі бір құрылымға сәйкестендіру арқылы жасау әдісі, мұнда алгоритм жаңа аминқышқыл тізбектерін «қияли» түрде жасайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Марапаттау салмақтарын өзгерту. Шу, температура, сәуле ені (beam width), үлгілер немесе репликалар саны сияқты параметрлердің өзгеруі маңызды іздеу өзгерісі болып саналады. Егер бақылаулар саны 32-ден аз болса, марапаттау салмақтары алынып тасталады (егер Complexa MCTS қолданылмаса). 32 және одан да көп бақылауларда салмақтар сақталады. Төрттен көп репликасы бар «best-of-n» конфигурацияларында жадты үнемдеу үшін batch size 8-ге дейін шектеледі.&lt;/p&gt;\n&lt;p&gt;Адаптивті таңдама шуы. Сандық толықтырулар [L, U] диапазонының f үлесі ретінде L + (U - L)f формуласы бойынша қосылады. Мәндер жуықталады. sc_scale_noise үшін f₀ үлесі топтардағы (pLDDT, iPAE, scRMSD) сәтсіз (F_g) және сәтті (S_g) бақылаулар негізінде анықталады. Бастапқы f₀ үлесі F_g және S_g шектеріне қарай 0,50-ден 0,85-ке дейін өзгереді. ProteinMPNN (rMPNN) деректері болғанда, f₀ қосымша шектеледі (мысалы, rMPNN ≥ 0,50 болғанда 0,50-ге дейін). Сигнал болмағанда 0,55 мәні қолданылады, ол терең тоқтап қалу күйінде 0,65-ке дейін арттырылады.&lt;/p&gt;\n&lt;p&gt;Іздеу параметрлерін реттік қосу. Егер марапаттауды тексеру өзгерісті талап етсе, жүйе келесі ретпен параметрлерді қосады: 1) Complexa MCTS үшін n_simulations, exploration_prob және exploration_constant; 2) FK steering үшін температура (дубликат қысымында 0,45, әйтпесе 0,30); 3) Басқа Complexa отбасылары үшін сәуле ені (0,43) және репликалар (0,60); 4) Белгілі бір өлшемдер (iPAE, scRMSD, pLDDT) үшін сәуле ені, шу және sequence hallucination комбинациялары; 5) Соңғы кезекте сәуле ені (0,35), репликалар (0,50) және шу (0,45) стандартты мәндері қолданылады.&lt;/p&gt;\n&lt;h4 id=\"c63-turakhty-erezheler-arkhyly-zhasalatyn-khosymsha-kandidattar\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c63-turakhty-erezheler-arkhyly-zhasalatyn-khosymsha-kandidattar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.6.3. Тұрақты ережелер арқылы жасалатын қосымша кандидаттар&lt;/span&gt;&lt;/a&gt;C.6.3. Тұрақты ережелер арқылы жасалатын қосымша кандидаттар&lt;/h4&gt;\n&lt;p&gt;PrespecifiedMCTSprobe. Құрастырушы картаға негізделген тапсырмаларды осы пункттегі кандидаттармен толықтыра алады. Бұл қосымшалар тексеруден және іріктеуден өтуге тиіс, ал олардың болуы іске қосуды міндетті етпейді. Төмен дәлелдемелі күйден тыс, ол қиын нысандарға арналған Proteina-Complexa шығару уақытындағы іздеу баптауынан бейімделген Complexa MCTS конфигурациясын қоса алады (Didi et al., 2026b). Бұл ереже үшін жаңа SU жоқ кемінде алты жұмысшы GPU-сағаты, сондай-ақ pLDDT бойынша өтпеген, бірақ iPAE бойынша өткен дизайн, не стандартты pLDDT немесе қосалқы binder-pLDDT бақылауларының кемінде жартысының сәтсіздігі, сонымен бірге стандартты iPAE немесе қосалқы минималды iPAE, ipTM немесе орташа ipSAE үшін кемінде 25% сәтті немесе соған жақын көрсеткіш талап етіледі. Мұнда C.4.2 бөліміндегі бос тұру уақытының сигналы қолданылады. Зонд 400 диффузия қадамын, төрт таңдаманы, 16 батч өлшемін, 20 MCTS симуляциясын, 0.5 зерттеу ықтималдығын, 1.0 зерттеу тұрақтысын және 100 сүзгі шегін пайдаланады. Оның iPAE және pLDDT марапат салмақтары сәйкесінше -1.0 және 1.0; sequence_hallucination үшін ықыласпен оңтайландыру (greedy optimization), 15 итерация және greedy_percentage=5 қолданылады. Конфигурация мен триггер барлық нысандар үшін бірдей. Қосымшалар MCTS жиынтығында SU, жуырдағы жақын қателіктер (near miss), 0.35-тен төмен қосалқы диагностикалық жақсарту бағасы болмаса және күтіп тұрған стандартталған AF2 бағалауы болмаса, кемінде үш маршруттық GPU-сағатынан және ok немесе no_artifacts күйіндегі екі ResultRecord-тан кейін тоқтатылады. Бұл тексеру отбасы жиынтығына немесе егер ол болмаса, ең жоғары шығынды дәл маршрутқа сүйенеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MCTS және pLDDT/iPAE — ақуыз құрылымының сапасын бағалау мен іздеу алгоритмдерінің негізгі әдістері болып табылады, олар модель сенімсіздіктерін анықтауға көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұрын бағаланған конфигурациялар. Егер ешбір жарамды кандидат parent-bound ProteinMPNN қайта жобалауды немесе өзгертілген модель, қайта пайдалану және инициализация баптауларымен AF2 қайта бүктелуін ұсынбаса, құрастырушы үшке дейін мұрағатталған генерация конфигурациясын қайта енгізе алауы мүмкін. Мұнда сыналмаған, тек бағалауға арналған, коллапс қаупі бар маршруттар мен бұрыннан бар конфигурациялар алынып тастала отырып, дәл маршрут жолдары қолданылады. SU немесе жақын қателік дәлелдері бар маршруттар тек қосалқы ілгерілеуі барлардан бұрын келеді. Олардың SU/GPU-сағат жылдамдығы 3 GPU-сағаттық, 6 GPU-сағаттық немесе сәйкес 60 жазба терезесінен қолжетімді бірінші жылдамдық болып табылады, содан кейін өмірлік жылдамдық қолданылады. Соңғы SU немесе жақын қателіктер болмаған кезде, маршрутқа кемінде 0.10 SU/GPU-сағат қажет және ол кез келген соңғы терезеде кемінде бір маршруттық GPU-сағатынан кейін алынып тасталады. Жаңа SU-сыз 12 жұмысшы GPU-сағатынан кейін, егер тек өмірлік деректер қалса немесе оның жылдамдығы шығынға негізделген терезелердің ешқайсысынан жылдамдықсыз немесе оң SU санысыз 60 жазба терезесінен алынған болса, ол да шығарылып тасталады. Терезелер мен маршруттар анықтамалары C.4.1 және C.4.4 бөлімдерінде келтірілген. SU және жақын қателік дәлелдері жоқ маршрут, егер оның нәтижелері бөлек AF2 бағалауын талап етсе, күтіп тұрғандары болмаса, қосалқы диагностикалық жақсарту бағасы кемінде 0.35 болса және жинақталған маршрут шығыны 6 GPU-сағаттан аспаса, қайта енгізілуі мүмкін. Оның жалпы күй мәртебесі dry_low_quality, dry_duplicate немесе collapse_risk болмауы тиіс. Жалпы күйді кейінге қалдыру маршруттары тек осы қосалқы баға ережесі арқылы ғана құқылы. Екі жол үшін де 60 жазба жылдамдықтары тек маршрутта төменгі ағындағы AF2 бағалау шығыны да, AF2 біліктілік рөлі де болмаған кезде ғана қолданылады.&lt;/p&gt;\n&lt;p&gt;Басқа генератор түбірлерінен кандидаттар. Доминантты түбір — ең көп жиналған генератор-маршрут GPU уақыты бар генератор түбірі (C.2.2 бөлімі), бұл ретте қолжетімді болғанда дәл маршрут жолдары, ал басқа жағдайда отбасы жиынтықтары пайдаланылады; теңдік кезінде лексикографиялық тұрғыдан үлкен түбір аты таңдалады. Бұл кандидаттардың қолжетімділік ережесі үшін ағымдағы SU дәлелі 3 немесе 6 GPU-сағаттық терезеде сол түбір үшін кез келген маршрутта немесе отбасы жиынтығында оң SU саны বা жылдамдығын білдіреді. 60 жазба есебі немесе жылдамдығы да жаңа SU-сыз 12 жұмысшы GPU-сағатынан бұрын жарамды, бірақ тек төменгі ағындағы AF2 бағалау шығыны мен AF2 біліктілік рөлі жоқ маршруттар үшін. Бұл терезелер мен шығындар C.4.1 және C.4.2 бөлімдерін сәйкестендіреді. Мүмкіндігінше, келесілердің кез келгені орындалған кезде, жарамды кандидат тапсырмалар мен кезекте тұрған немесе орындалып жатқан тапсырмалар арасында кемінде басқа екі түбір ұсынылады:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Күй төмен дәлелдемелі немесе тоқырау күйінде, жиынтық және соңғы SU сандары нөл, кемінде 0.10 тіркелген жұмысшы GPU-сағаты және бір ResultRecord жиналған; доминантты түбір бар және ағымдағы SU дәлелдері жоқ.&lt;/li&gt;\n&lt;li&gt;Күй терең тоқырау болып табылады және доминантты түбірдің ағымдағы SU деректері жоқ.&lt;/li&gt;\n&lt;li&gt;Күй тоқырауда немесе құрылымдық дубликат коллапсында, жаңа SU-сыз кемінде алты жұмысшы GPU-сағаты өтті және доминантты түбірдің ағымдағы SU деректері жоқ.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Кез келген өнімді күйде, кішірек талап — соңғы SU өсімі оң болса, алдыңғы он жоспарлау жаңартуының кемінде төртеуі нөлдік SU өсімі бар терең тоқырау жаңартулары болған және жиынтық өткізу қабілеті әр жұмысшы GPU-сағатына көбімен 0.25 SU болған кезде басқа бір түбір болып табылады. Соңғы өсім 60 жазба терезесін пайдаланады (C.4.2 бөлімі). Қосымша түбір сыналмаған немесе жеткіліксіз тексерілген отбасыға, AF2 бағалауын күтіп тұрған отбасыға немесе SU, соңғы жақын қателіктер, оң SU/GPU-сағат немесе кемінде 0.35 қосалқы диагностикалық жақсарту бағасы бар отбасыға ие болуы тиіс. Жаңа SU-сыз өткен уақыт шарттары бос тұру уақытының сигналын пайдаланады, ал жиынтық өткізу қабілеті тіркелген жұмысшы шығынын пайдаланады (S6-кесте).&lt;/p&gt;\n&lt;h4 id=\"c7-supervajzerding-prioritetteui-zhaene-deterministik-irikteu\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c7-supervajzerding-prioritetteui-zhaene-deterministik-irikteu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.7. Супервайзердің приоритеттеуі және детерминистік іріктеу&lt;/span&gt;&lt;/a&gt;C.7. Супервайзердің приоритеттеуі және детерминистік іріктеу&lt;/h4&gt;\n&lt;p&gt;Супервайзердің рейтинг жасау нұсқаулары. Супервайзер кандидат тапсырмаларды Rescue, Explore және eXploit бойынша рейтингтейді және олардың қажетті бөлу пропорцияларын ұсынады. Оған дәл маршруттарды соңғы SU/GPU-сағат бойынша, талап етілетін бағалау шығындарын қоса отырып салыстыру тапсырылған. Екі жылдамдықтың төмені көбінің 85%-дан кем болмаған кезде, ол онлайн сапа бағасының q (C.4.3 бөлімі) жоғарырақ 25-ші перцентилін, содан кейін медианасын қалауы керек. Сұраныс аз бақылаулар немесе аз есептеу ресурстары кезінде абай болуды талап етеді; ол бұл салыстыру үшін қосымша минималды таңдама санын жүктемейді. Осы сапа диапазонынан тыс, сапа тиімділіктен артық кетпейді. Арзан маршурт жеткілікті сапамен салыстырмалы немесе үлкенірек SU/GPU-сағат берген кезде қымбатырақ маршруттан бұрын болуы тиіс. Нұсқаулар сондай-ақ жаңа SU-сыз алты жұмысшы GPU-сағатынан кейін көбірек диверсификация жасауды талап етеді және он екіден кейін жақын қателіктерді жеткілікті прогресс ретінде қабылдауға кеңес бермейді. Созылмалы терең тоқыраудан шектеулі қалпына келгеннен кейін олар басқа генератор түбірін қарастыруды жалғастыруды сұрайды. Бұлар LLM үшін нұсқаулар болып табылады; C.6.3 және C.8.2 бөлімдері жеке кандидаттардың қолжетімділік және параллельдік ережелерін белгілейді. D.2.2 бөлімінде мұрағаттық приоритеттеу мысалы келтірілген.&lt;/p&gt;\n&lt;h4 id=\"c71-zhauaptardy-oengdeu-zhaene-uelestiru-shekteri\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c71-zhauaptardy-oengdeu-zhaene-uelestiru-shekteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.7.1. Жауаптарды өңдеу және үлестіру шектері&lt;/span&gt;&lt;/a&gt;C.7.1. Жауаптарды өңдеу және үлестіру шектері&lt;/h4&gt;\n&lt;p&gt;S8B кестесі жарамды Supervisor жаһандық ретін, жаһандық ретсіз жарамды үлестіру пропорцияларын және сақтық көшірме нұсқасын (fallback) ажыратады. Берілетін сақтық көшірме себебі Supervisor пропорцияларын А бөлігіндегі күйге тәуелді мәндермен алмастырады және оның жаһандық ретін ажыратады. Сақталған карталар үміткерлерді ұсынуды жалғастыра жеді. Егер жауап жеке үміткер шешімдерін сақтаса, олардың басымдық адекватты рангтері мен ресурс кластары төменде сипатталған бекітілген ретке кіре алады. Үміткерге тән қателер тек сол үміткерге ғана әсер етеді. Сенім деңгейін жазу C.5.1 бөліміне сәйкес жүзеге асырылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Сақтық көшірме (fallback) және үлестіру шектері — тілдік модель (LLM) жауаптарында қателер немесе төмен сенімділік орын алған кезде ресурс үлестерін (Rescue, Explore, eXploit) автоматты түрде реттейтін алгоритмдік қорғаныс механизмдері.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Үлестіру шектері. Қажетті пропорциялар S8C кестесіндегі негізгі немесе шартты шектерін қолдану арқылы нормализацияланады және түзетіледі. Шартты шектеулер сақтық көшірме нұсқасы кезінде, орнатылған немесе құрылымдық дубликатты қысқарту күйлерінде, құрылымдық концентрация кемінде 0.50 болғанда, хабарланған Supervisor сенімділігі 0.65-тен төмен болғанда немесе соңғы төрт қолжетімді LLM қоңырау жазбаларының кемінде 30%-ы сақтық көшірмені немесе OK емес талдауды көрсеткенде қолданылады. Сенімділіктің жоқтығы және терең тоқырау (deep stall) өзінен-өзі оларды белсендірмейді. Бұл шектеулер кейінгі расталған іске қосулардың қажетті үлестерін шектейді; жаһандық рет пен үміткерлердің қолжетімділігі іске қосу үлестері мен GPU уақыт фракцияларын өзгерте ала үді. Құрылымдық концентрация соңғы 60 ResultRecords жазбасындағы қолжетімді доминантты кластер үлестерінің үлкені болып табылады: онлайн құрылымдық тағайындауы бар барлық жазбалар арасында немесе білікті кластер тағайындауы бар білікті жазбалар арасында. Білікті үлес тек кемінде төрт тағайындалған білікті жазба болғанда ғана қолданылады (бұлар жазбалар, төрт бөлек SU емес). Шартты шектеулер кезінде екі өнімді күй жиынтығындағы ≥ 0.50 концентрация eXploit жоғарғы шегін 0.60 етіп, ал Explore аралығын 0.20–0.40 етіп орнатады, қалған шектеулерді сақтайды. Жақын қателермен байытылған күйде (near-miss-enriched) ≥ 0.70 концентрация Rescue төменгі шегін сақтай отырып, Explore жоғарғы шегін 0.50-ге дейін көтереді. Бұл шектер C.4.5 бөліміндегі 0.75 тоқырау күйі тестінен ерекшеленеді.&lt;/p&gt;\n&lt;h4 id=\"khutkharu-rescue-zertteu-explore-pajdalanu-exploit\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#khutkharu-rescue-zertteu-explore-pajdalanu-exploit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Құтқару (Rescue) Зерттеу (Explore) Пайдалану (eXploit)&lt;/span&gt;&lt;/a&gt;Құтқару (Rescue) Зерттеу (Explore) Пайдалану (eXploit)&lt;/h4&gt;\n&lt;p&gt;Төмен дәлелдер 0.30 0.35 0.35&lt;br /&gt;\nӨнімді 0.25 0.10 0.65&lt;br /&gt;\nДубликатталған өнімді 0.35 0.10 0.55&lt;br /&gt;\nҚұрылымдық дубликатты қысқарту 0.15 0.75 0.10&lt;br /&gt;\nЖақын қателермен байытылған 0.50 0.20 0.30&lt;br /&gt;\nТоқыраған 0.35 0.45 0.20&lt;br /&gt;\nТерең тоқырау 0.30 0.50 0.20&lt;/p&gt;\n&lt;h4 id=\"b-khatelerdi-oengdeu-zhaene-irikteu-sayasatyn-sheshu\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#b-khatelerdi-oengdeu-zhaene-irikteu-sayasatyn-sheshu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;B. Қателерді өңдеу және іріктеу саясатын шешу&lt;/span&gt;&lt;/a&gt;B. Қателерді өңдеу және іріктеу саясатын шешу&lt;/h4&gt;\n&lt;p&gt;Шешілген жол — Іріктеу әрекеті. Supervisor жарамды жаһандық рангтері; таратылған сақтық көшірме себебі жоқ: оның үлестіру пропорциялары мен ағымдағы жаһандық реті қолданылады (қысқарақ рет тек қайтарылған ішкі жиынды ғана реттейді). Жарамды жаһандық ретсіз жарамды пропорциялар; сақтық көшірме себебі жоқ: жарамды жаһандық рет жоқ, түзетілген пропорциялар мен тасымалданатын үлестіру айырмашылығы басымдық квоталарын басқарады. Жарамсыз немесе қалыс қалған Supervisor: күйге тәуелді сақтық көшірме пропорциялары мен квота таңдауы қолданылады; жаһандық рет қолданылмайды. Жоспарлаушы себебі (planner_invalid, planner_abstain немесе planner_empty_cards): бұл себептер тіпті жарамды Supervisor жауабы арқылы да таратылады — сақтық көшірме пропорциялары қолданылады және жаһандық реттеу өшіріледі (басымдық ішіндегі сақталған рангтер бекітілген пул ретіне кіре алады, C.7.2 бөлімі). Басқа Жоспарлаушы себеп жолдары өзінен-өзі бұл таралуды белсендірмейді. Бір үміткер сәйкестік немесе тікелей іске қосу тексерісінен өтпейді: сол үміткер қабылданбайды немесе кейінге қалдырылады; қалған ұсыныстар өз тексерістерін сақтайды (бұл оқиға өзінен-өзі жаһандық жауап сақтық көшірмесін жасамайды). Жарамды шығыспен төмен сенімділік: әдеттегі жауап жолы сақталады, сенімділік аудиті жүргізіледі және жеке шартты шек тесттері қолданылады.&lt;/p&gt;\n&lt;h4 id=\"c-normalizaciyalanghan-khazhetti-uelestiru-proporciyalaryna-khojylatyn-shekteuler\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c-normalizaciyalanghan-khazhetti-uelestiru-proporciyalaryna-khojylatyn-shekteuler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C. Нормализацияланған қажетті үлестіру пропорцияларына қойылатын шектеулер&lt;/span&gt;&lt;/a&gt;C. Нормализацияланған қажетті үлестіру пропорцияларына қойылатын шектеулер&lt;/h4&gt;\n&lt;p&gt;Науқан күйі — Негізгі шектер — Шартты шектер. Төмен дәлелдер: E ≥ 0.05 / E ≥ 0.05. Өнімді: X ≤ 0.95, E ≥ 0.05 / 0.45 ≤ X ≤ 0.80, R ≥ 0.10, 0.05 ≤ E ≤ 0.20. Дубликатталған өнімді: X ≤ 0.90, E ≥ 0.05 / 0.40 ≤ X ≤ 0.70, R ≥ 0.20, 0.05 ≤ E ≤ 0.30. Құрылымдық дубликатты қысқарту: X ≤ 0.30, E ≥ 0.45 / X ≤ 0.20, R ≤ 0.30, E ≥ 0.55. Жақын қателермен байытылған: R ≥ 0.10 / R ≥ 0.40, E ≤ 0.30. Тоқыраған: X ≤ 0.35, R ≥ 0.25, E ≥ 0.25 / негізгі шектермен бірдей, шартты шектер әрқашан қолданылады. Терең тоқырау: X ≤ 0.40, E ≥ 0.35 / X ≤ 0.30, R ≥ 0.15, E ≥ 0.45.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Кезекте тұрған AlphaFold2 (AF2) тапсырмалары мен кезек сыйымдылығы ережелері есептегіштің сыйымдылыққа қатынасын бағалау арқылы жоғары жүктеме кезінде Rescue төменгі шегін динамикалық түрде жоюға мүмкіндік береді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Күтудегі AF2 тапсырмалары және Rescue төменгі шегінен бас тарту (Rescue-floor waiver). K^* қосымша кезек позициялары бар жаңарту үшін бұл тексеріс &lt;span class=\"yfm-latex\" data-content=\"4%20%5Cmax(1%2C%20K%5E*)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; сыйымдылығын пайдаланады. Ол байланысқан ResultRecord жазбасы жоқ таңдалған немесе іске қосылған жеке AF2 үміткер тапсырмаларын санап шығады. Жазылған диспетчерлеу немесе талдау қателері жоғары құнды жұмыс істеп тұрған жұмыс лимитінен туындаған кейінге қалдыруларды қоспағанда, үміткерлерді алып тастайды. Есептегіш/сыйымдылық қатынасы ≥ 0.95 болғанда, Rescue төменгі шегі алынып тасталады. Бұл санақ дайын кезек ұзындығынан және бағаланбаған дизайн санынан бөлек тұрады (C.8.1 бөлімі). Басқарушы ауқымнан тыс пропорцияларды өз шектеріне дейін қысқартады және қалған үлесті шекте ұсталмайтын басымдықтар арасында пропорционалды түрде қайта бөледі; нөлге тең қалған кіріс салмағы тең үлестерді береді. Түзету бес өтуден аспайтын жиілікпен қайталанады. Бұл түзетулер үміткерлердің жарамдылығын өзгертпестен, үлестіру мақсаттарын өзгертеді. Кезек сыйымдылығы мен жұмысшылардың қолжетімділігі бөлек шамалар болып қала береді (S1 алгоритмі).&lt;/p&gt;\n&lt;h4 id=\"c73-iske-khosular-bojynsha-boeiu-zhaene-kvotalykh-khorghanys-tetikteri\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c73-iske-khosular-bojynsha-boeiu-zhaene-kvotalykh-khorghanys-tetikteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.7.3. Іске қосулар бойынша бөלіу және квоталық қорғаныс тетіктері&lt;/span&gt;&lt;/a&gt;C.7.3. Іске қосулар бойынша бөלіу және квоталық қорғаныс тетіктері&lt;/h4&gt;\n&lt;p&gt;Тасымалданған бөлу айырмасы. Түзетілген пропорциялар p = (p_R, p_E, p_X) үшін контроллер мұрағатталған шешімдер мен бастамалар негізінде тасымалданған бөлу айырмасын d қалпына келтіреді. Әрбір мұрағатталған жаңарту кезінде ол осы жаңартудың пропорцияларын оның мақұлданған генерация/редизайн іске қосу ниеттері санының немесе байланыстырылған расталған бастамалар санының үлкеніне көбейтіп қосады, содан кейін сәйкес басымдықтан әрбір расталған бастама үшін бірін азайтады. Әрбір компонент әрбір жаңартудан кейін [-3, 3 диапазонына шектеледі. Сондықтан ешқашан іске қосылмайтын мақұлданған или кезекке қойылған тапсырма жүзеге асырылған бөлу ретінде есепке алынмайды. Жаһандық реттегі жаңартулар өздерінің пропорциялары мен бастамаларын сол реконструкцияға қосады, бірақ квоталар олардың тікелей таңдалуын басқармайды. K^* позициясы бар квотаны жаңарту үшін $m \\in {R, E, X$ болғанда уақытша бөлу айырмалары d_m + K^* p_m құрайды және [-3, 3] шегіне дейін қысқарады. Әрбір позиция ең үлкен айырмасы бар сәйкес басымдыққа тағайындалады; алты ондық таңбаға дейін дөңгелектегеннен кейінгі теңдіктер үлкен p_m мәніне, содан кейін eXploit, Rescue, Explore санаттарына басымдық береді. Әрбір тағайындау осы уақытша айырмадан бірді азайтады. Мұндай алдын ала азайтулар ағымдағы квоталарды бөледі; кейінгі реконструкция расталған бастамаларды пайдаланады. Сәйкес кандидаттары жоқ басымдықтар квота алмайды, ал пайдаланылмаған позициялар C.7.2-бөлім арқылы толтырылуы мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тасымалданған бөлу айырмасы мен квоталар — бұл бос тұрған тапсырмаларды есепке ала отырып, есептеу ресурстарын басымдықтар бойынша әділ бөлуді қамтамасыз ететін алгоритмдік механизм.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Өнімді есептеулерді қолдау. Квота жолында бір eXploit позициясы өнімді, қайталануы бар өнімді немесе сәтсіздікке жақын нәтижелермен байытылған күйлерде сақталуы мүмкін, егер бос тұру уақыты ең көбі 6 worker GPU-сағатты құраса, алдыңғы eXploit бөлінісі бір бастамадан артық аспаса және лайықты кандидат оң бағытқа немесе соңғы отбасылық SU/GPU-сағат өнімділігіне ие болса. Оң 3-GPU-сағаттық жылдамдығы немесе 3-/6-GPU-сағаттық SU өсімі жоқ dry_duplicate белгісі бар қайта пайдаланылатын конфигурациялар тек маршрут жылдамдығы бойынша квотаға үміткер бола алмайды. Құрылымдық дубликаттардың құлауы бұл қорғаныс шарасына жол бермейді. Бос тұру уақыты C.4.2-бөлімге сәйкес келеді. Кемінде үш позиция, ең көбі 3 worker GPU-сағат бос тұру уақыты және науқанның соңғы өткізу қабілеті ≥ 0.50 SU/GPU-сағат немесе кемінде екі SU өсімі болған кезде, квота екі eXploit позициясын сақтай алады. Өсім алдыңғы ең жоғары жиынтық SU санымен салыстырғандағы өсуді немесе мұндай өсу нөлге тең болмаған немесе қолжетімсіз болған кездегі 60 жазба бойынша өсімді білдіреді. Екі жетекші eXploit кандидаты да жоғары құнды отбасынан тыс болуы, төмен, диагностикалық немесе стандартты болжалды құны болуы, жоғарыда аталған қайта пайдаланылатын конфигурация ерекшелігінен аулақ болуы және ≥ 0.50 SU/GPU-сағат маршрут немесе соңғы отбасылық өткізу қабілеті болуы тиіс. Қажетті AF2 бағалаулары бұл позицияларды қамтамасыз ете алмайды.&lt;/p&gt;\n&lt;p&gt;Кросс-генератор кандидатын сақтау. Қарапайым іріктеуден кейін квота жолы C.6.3-бөлімдегі кросс-генератор ережесі қосқан бір кандидатты сақтай алады. Ол пайдаланылмаған позицияны толтырады немесе Басымдық ішіндегі жетекші рангі бірге тең емес кандидатты алмастырады. BindCraft, BoltzGen немесе ProteinMPNN ұсынған мұндай кандидат маршрут бойынша кейінге қалдырылған пулдан қалпына келтірілмейді, егер оның отбасында байланыстырылған стандартталған AF2 нәтижесі жоқ кемінде source ResultRecords және сондай нәтижесі бар кемінде төртеуі болса, сондай-ақ отбасылық немесе сәйкес келетін маршруттық SU немесе сәтсіздікке жақын нәтиже және келешегі бар күтілетін құрылым болмаса. Бұл шектеу кросс-генератор қорғанысына да, осы пулдан әдеттегі толтыруға да қолданылады. Бастау уақытының жарамдылығы мен сыйымдылығын тексерулер әлі де C.8.2-бөлімді орындайды.&lt;/p&gt;\n&lt;h4 id=\"c8-baghalaugha-rukhsat-beru-zhaene-worker-arkhyly-oryndau\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c8-baghalaugha-rukhsat-beru-zhaene-worker-arkhyly-oryndau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.8. Бағалауға рұқсат беру және worker арқылы орындау&lt;/span&gt;&lt;/a&gt;C.8. Бағалауға рұқсат беру және worker арқылы орындау&lt;/h4&gt;\n&lt;p&gt;Генерация, редизайн және стандартталған AF2 бағалауы үш ортақ worker GPU ресурсын бөліседі. Бағалауға рұқсат беру қай жобалардың жалпы біліктілік хаттамасына енетінін анықтайды; кезектерді басқару олардың тапсырмаларының қашан басталатынын белгілейді. S2b суреті және S1 алгоритмі осы бөлек қадамдарды көрсетеді. Бағалауды күтіп тұрған жобалар біліктілік қатесі ретінде есептелместен күту күйінде қалады.&lt;/p&gt;\n&lt;h4 id=\"c81-standarttalghan-af2-baghalauy-khabyldau-zhaene-syjymdylykh\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c81-standarttalghan-af2-baghalauy-khabyldau-zhaene-syjymdylykh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.8.1. Стандартталған AF2 бағалауы: қабылдау және сыйымдылық&lt;/span&gt;&lt;/a&gt;C.8.1. Стандартталған AF2 бағалауы: қабылдау және сыйымдылық&lt;/h4&gt;\n&lt;p&gt;Контроллер кіріс деректерін басымдыққа бөлу үшін нативті өлшемдер мен өткен бағыт нәтижелерін пайдалана отырып, генерация және қайта жобалаумен қатар AlphaFold2 стандартталған бағалауын жоспарлайды. Бағалау көзі отбасы — бұл бағалау кірісін шығарған генерация немесе қайта жобалау тобы. BindCraft немесе Complexa түріндегі құрылым генераторлық 0–100 шкаласындағы pLDDT ≥ 90, қалыптастырылған iPAE ≤ 7/31 және байланысқан нысанның RMSD немесе scRMSD мәні &amp;lt; 1.5 Å болғанда нативті тәрізді деп есептеледі. Басқа құралдар үшін жеке болашағы бар сигналдар анықталған: BindCraft үшін бұл генератор қабылдаған шығыс немесе барлық үш нативті өлшемі бар және near-pass рұқсат шектерінен тыс ең көбі бір критерийі бар нысан; BoltzGen үшін — жоба ipTM ≥ 0.80, жоба-нысана ipTM ≥ 0.65, интерфейстік ipTM ≥ 0.65, минималды жоба-нысана PAE ≤ 7 Å, құрылым сенімділігі ≥ 0.75 және нативті рефолдинг RMSD &amp;lt; 2.0 Å параметрлерінің кем дегенде екеуі; ProteinMPNN үшін — тізбекті қалпына келтіру үлесі 0.15 пен 0.85 аралығында немесе көрсетілмеген жағдайда, қалдыққа шаққандағы жаһандық немесе жергілікті теріс логарифмдік ықтималдық ≤ 1.20.&lt;/p&gt;\n&lt;p&gt;Кірістер нативті тәрізді болса, олардың нақты бағыты promote мәртебесіне ие болса, соңғы SU өсімі, таңдалған бағыттың оң үлесі немесе healthy мәртебесімен бірге соңғы near miss тіркелсе, ең жоғары бағалау басымдығы беріледі. Әрбір бағыт шеңберінде мұндай кірістер болашағы бар прокси-объектерден бұрын келеді, ал diversify және defer/collapse_risk төменірек басымдыққа ие болады. Нативті бағалаулар мен тұрақты идентификаторлар теңдіктерді шешеді. Әрбір нақты бағыт үшін жиынтық лимит бастапқыда төрт стандартталған AF2 бағасын құрайды және дәлелдемелік база жақсарған сайын 8, 16, 32, 64 дейін өсіп, кейін екі еселене алады. Төрттен сегізге өту ережелерді айналып өтпестен ең көбі төрт қосымша бағалауды қосуға мүмкіндік береді. Шекті арттыру үшін контроллер ағымдағы жиынтықты алдыңғы конфигурацияланған шектен аспайтын ең жақын ертеректегі жиынтықпен салыстырады. Алты өлшемнің кем дегенде біреуі өсуі тиіс: бағытқа қатысты SU, жеке near-miss нәтижелерінің саны, сапалы кластерлер саны, онлайн сапа көрсеткішінің 25-перцентилі немесе медианасы, қосалқы диагностикалық жақсарту балы. Көрсеткіштердің өсуі 10⁻⁶ мәнінен асуы тиіс, ал диагностикалық бал үш таңбаға дейін сақталады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;AlphaFold2 стандартталған бағалауы және pLDDT, iPAE, RMSD, ipTM, PAE сияқты метрикалар нейрондық желі алгоритмдері арқылы жасалған ақуыз құрылымдарын физикалық синтезге дейін автоматты түрде сүзгіден өткізуге және ең сапалыларын таңдауға қолданылады.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әдеттегі қабылдау ағымдағы қолдау көрсетілмейтін бағалаулар үшін іске қосылған және бұрыннан таңдалған тапсырмаларды ескере отырып, әрбір бағалау көзі отбасына ең көбі 24 рұқсат береді. Отбасының бір жоспарлау-жаңарту идентификаторы астындағы жалпы мақұлдаулары қолдау таппаған кандидат үшін төрт немесе дәлелдемелік базасы бар кандидат үшін он алты шегімен салыстырылады; бұл квоталар қосылмайды. Кем дегенде 20 іске қосу тіркелгеннен кейін, резервтеу жүйесі стандартталған AF2 іске қосуларының санын соңғы 40 қолжетімді іске қосу арасында 24 шегімен салыстырады (өнімді дубликаттау немесе құрылымдық дубликаттардың құлау күйлерінде 20 дейін азайтылады). 20 іске қосуға дейін тиісті шектер 12 және 10 құрайды. Егер бұл бюджет таусылса, қолжетімді нативті тәрізді кірістер ең көбі екі позицияға немесе терең тоқырау күйінде бір позиция үшін ерекшелік жасауға мүмкіндік береді.&lt;/p&gt;\n&lt;h4 id=\"kezekterdi-brondau\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#kezekterdi-brondau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кезектерді брондау&lt;/span&gt;&lt;/a&gt;Кезектерді брондау&lt;/h4&gt;\n&lt;p&gt;AlphaFold2 (AF2) тапсырмалары бөлініске дейін кезектің басына және кезек қайта толықтырылған кезде қайтадан енгізілуі мүмкін. Бұл өтулер сәйкесінше бос жұмысшыларды &lt;span class=\"yfm-latex\" data-content=\"F(%5Cmathcal%7BW%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; және кезек кеңістігін &lt;span class=\"yfm-latex\" data-content=\"K(%5Cmathcal%7BQ%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; пайдаланады; бірінші тәсіл кезек тереңдігін мақсатты мәннен уақытша асыра алады. Екі өту де бір цикл үшін бір шекті бөліседі, бұл шек үшін пайдаланылатын күтілетін шығыс саны 32-ге жеткенде екіге дейін өседі. Бұл санды есептеу үшін болған жағдайда түпнұсқа тәрізді немесе прокси-перспективті нәтижелер қолданылады, әйтпесе барлық жарамды бағаланбаған нәтижелер есепке алынады. Әрбір өту белгіленген шектен осы циклдегі алдыңғы брондарды да, қазір орындалып жатқан AF2 тапсырмаларын да шегеріп тастайды (S1 алгоритмі). Кезектен тыс тұрған AF2 тапсырмасы басқа броньның жасалуына жол бермейді. Сондай-ақ әрбір өту қолжетімді позициялар мен жарамды үміткер тапсырмаларды тексереді.&lt;/p&gt;\n&lt;p&gt;Жергілікті шектеу осындай позициялардың жартысынан аспайды, жоғары қарай дөңгелектенеді және екі немесе одан көп позиция қолжетімді болған кезде біреуін брондалмаған күйде қалдырады. Оның бірден екіге дейін өсуі осы өтуде 32 жарамды үміткердің болуын талап етеді, сондықтан үш жұмысшы конфигурациясы кезінде әрбір өту ең көбі бір үміткерді қабылдайды. Терең тоқырау кезінде, егер жарамды нәтиже әлі де AF2 бағалауын күтіп тұрса, ортақ шек бірге тең болады; бұл ретте түпнұсқа тәрізді дәлелдер талап етілмейді. Жаңартылған күй терең тоқырауға кірген кезде кезектегі артық брондалған AF2 тапсырмалары жойылады. Бағаланбаған нәтиже болған кезде бағалау үшін бір бос позицияны пайдалануға болады; әйтпесе бұл позиция генерация немесе қайта жобалау үшін қалдырылады. Бұл ережелер графикалық процессорды бағалауға тұрақты түрде бекітудің орнына кезек позицияларын брондайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кезектерді басқару және ресурстарды бөлу ережелері&lt;br /&gt;\nБұл жүктемені динамикалық басқару және есептеу ресурстарын бөлу механизмі болып табылады, онда тапсырмалар қолжетімді жұмысшыларға, отбасылық шектеулерге және жүйенің ағымдағы күйіне байланысты кезекте орын алады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"bos-kezek-poziciyalaryn-toltyru\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#bos-kezek-poziciyalaryn-toltyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бос кезек позицияларын толтыру&lt;/span&gt;&lt;/a&gt;Бос кезек позицияларын толтыру&lt;/h4&gt;\n&lt;p&gt;Генерация және қайта жобалау таңдауынан кейін, егер кезекте орын қалса, жүйе терең тоқырау күйінде болмаса және стандартты AF2 тапсырмасы кезекте тұрмаса немесе орындалып жатпаса, бір AF2 тапсырмасын қосуға болады. Бұл жол алдымен әдеттегі бағыт квоталарын пайдаланады. Егер олар үміткер бермесе, ол квотасы таусылған бағыттан үміткерді таңдай алады, бұл ретте қолдау көрсетілмейтін отбасылар үшін жиынтық шектеу де айналып өтіледі. Әрбір жаңарту үшін отбасылық шектеулер және іске қосу кезіндегі тексерулер өз күшінде қалады. Бұл ерекшелік кезек сыйымдылығының бос бөлігін пайдаланады; ол жақсартылған дәлелдерді де жасамайды, бағыт квотасын да екі еселемейді.&lt;/p&gt;\n&lt;h4 id=\"c82-kezekke-khabyldau,-iske-khosu-zhaene-naetizhelerdi-zhinau\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c82-kezekke-khabyldau,-iske-khosu-zhaene-naetizhelerdi-zhinau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.8.2. Кезекке қабылдау, іске қосу және нәтижелерді жинау&lt;/span&gt;&lt;/a&gt;C.8.2. Кезекке қабылдау, іске қосу және нәтижелерді жинау&lt;/h4&gt;\n&lt;p&gt;Кезек толтыру. Үміткерлерге тапсырыс беру және оларды бөлу C.7.2 және C.7.3 бөлімдеріне сәйкес орындалады, ал C.6 бөлімінде растау жүргізіледі. Кезек сыйымдылығы &lt;span class=\"yfm-latex\" data-content=\"K(%5Cmathcal%7BQ%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; және бос жұмысшылар &lt;span class=\"yfm-latex\" data-content=\"F(%5Cmathcal%7BW%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; S1 алгоритмінде анықталған. Жоспарлаушы барлық жұмысшылар бос емес кезде, бірінші мақсатты &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-khiqhkcj\"&gt;ResultRecord&lt;/code&gt; келгеннен кейін кезек толтыра алады; оған дейін егер әрбір жұмысшы бос болмаса, бұл үдеріс тоқтатыла тұрады. Кезекті тапсырмалар жаңа жоспарлау шақыруларына дейін және кезек толтырылғаннан кейін алгоритмнің екі диспетчерлік нүктесінде қайта басталуы мүмкін.&lt;/p&gt;\n&lt;p&gt;Кезек тәртібі және жаңа деректер. Диспетчерлікке дейін қажетті AF2 тапсырмалары бірінші орынға қойылады. Генерация және қайта жобалау тапсырмалары өздерінің тіркелген аннотацияларына сәйкес келеді: соңғы SU немесе жақын сәтті (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ozhp19m1\"&gt;near-miss&lt;/code&gt;) нәтижелер, диагностикалық жақсартулар, кәдімгі ұсыныстар және соңында тек өмірлік деректермен (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h2yszfpv\"&gt;lifetime evidence&lt;/code&gt;) қолдау көрсетілетін қайта пайдаланылатын конфигурациялар. Топ ішінде таңдау жазбалары (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s7d9p63q\"&gt;selection records&lt;/code&gt;) бар тапсырмалар олар жоқтардан бұрын орындалады; жаңа таңдау жаңартулары бірінші болып келеді, ал қолданыстағы кезек тәртібі теңдікті шешеді. Бұл реттілік маршрут бағаларын қайта есептеудің орнына үміткерлер мен таңдау жазбаларындағы аннотацияларды пайдаланады. Жаңа нәтижелер немесе күйдің өзгеруі кәдімгі кезектегі тапсырмаларды өздігінен жойып жібермейді. Ерекшелік — кез келген нәтиже пайда болғанға дейін төмен дәлелдерде таңдалған тапсырмалар: бірінші нәтиже келген бойда, жоспарлаушы жаңа деректерді пайдалана алуы үшін бұл кезектегі тапсырмалар жойылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;BindCraft — бұл жинақталған есептеу шығындары мен өткен итерациялардың сәттілігіне байланысты қатаң бір мезгілде орындалу шектеулері бар жоғары ресурсты қажет ететін ақуыз дизайны әдісі.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;BindCraft параллелизм лимиті. BindCraft — бұл жоғары шығынды отбасы, ол жұмыс істейтін бір тапсырмаға арналған әдеттегі лимитке ие. Таңдауда толтыру үшін бірден артық кезек позициясы болған кезде, BindCraft-тан кемінде бір позиция ұстап қалынады; бұл шектеу тіпті балама болмаса да қолданылады. Үш жұмысшыдан тұратын пул да ең көбі екі бір мезгілде орындалатын BindCraft тапсырмасына рұқсат береді. Осы параллелизмді тексеру үшін ағымдағы маршрут деректері 3 немесе 6 сағаттық GPU терезесіндегі оң SU санын, 3 сағаттық GPU жылдамдығын немесе сенімді соңғы жақын сәтсіздікті білдіреді. Кейінгі AF2 шығындары жоқ және AF2 біліктілік рөлі жоқ жолдар да 60 жазбалы SU санын және 3 сағаттық GPU жылдамдығы жоқ болған кезде оның жылдамдығын пайдалана алады (C.4.1 бөлімі). Лимит бірден екіге дейін келесі шарттардың кез келгені бойынша артуы мүмкін:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Отбасылық деректер: әдіс түйіндемесіндегі оң соңғы тікелей немесе атрибутталған SU/GPU-сағат жылдамдығы немесе сенімді соңғы жақын сәтсіздік (C.4.1 бөлімі); балама ретінде, өмірлік SU немесе жақын сәтті деректер, егер бұл деректер ескірмеген болса, ≥ 0.25 SU/GPU-сағат өмірлік жылдамдыққа ие.&lt;/li&gt;\n&lt;li&gt;Маршрут деректері: отбасының ең жоғары жылдамдықтағы маршруты немесе отбасылық түйіндемелер кемінде бір SU, кемінде 1.0 маршрут GPU-сағатын және ағымдағы SU немесе жақын сәтті деректерді қамтамасыз етеді. Олардың жылдамдығы (ең үлкен ағымдағы немесе өмірлік мәнді ала отырып) кемінде 0.10 SU/GPU-сағат және ағымдағы деректері бар бәсекелес түйіндемелер арасындағы ең жақсы ағымдағы жылдамдықтың 80%-ы болуы тиіс. Тең ең жоғары жылдамдықты түйіндемелер үшін ең үлкен сан мен шығын және ағымдағы деректердің болуы қолданылады.&lt;/li&gt;\n&lt;li&gt;Тоқтап қалу кезінде баламаны сынау: кемінде 32 &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-049l9k5i\"&gt;ResultRecord&lt;/code&gt;, жаңа SUsiz кемінде 0.75 жұмысшы GPU-сағаты және төмен дәлелдер, тоқтап қалу, терең тоқтау немесе құрылымдық дубликат құлауы жағдайындағы бағалау отбасына кірмейтін ең жақсы соңғы жылдамдық 0.25 SU/GPU-сағаттан төмен.&lt;/li&gt;\n&lt;li&gt;Кешіктірілген бастаулармен қайта басымдық беру: мұрағатталған Супервайзер үміткер шешімдеріндегі кемінде алты BindCraft жазбасы, бастаудың кіріске қатынасы ≤ 0.35 және сыйымдылығы бойынша кейінге қалдырылған немесе таңдалған, бірақ басталмаған кемінде бір тапсырма. Күй төмен дәлелдер, тоқтап қалу, терең тоқтау немесе құрылымдық дубликат құлауы болуы тиіс, немесе науқан төрттен аз SU-ға ие болуы тиіс. Өмірлік деректер ескірмеген болуы тиіс.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Өмірлік деректер, егер отбасылық немесе маршруттық түйіндемелер ағымдағы SU немесе сенімді жақын сәтті деректерді сақтамаса және бұрын өнімді болған түйіндеме кемінде 1.0 соңғы маршрут GPU-сағатын жинақтаған болса, ескірген болып саналады. Соңғы терезелер C.4.1 бөліміне сәйкес келеді; маршрут жылдамдықтары C.4.2 бөліміне сәйкес келеді. SU негізіндегі жылжыту сол жерде сипатталған кластерлеуді тексеруді талап етеді, ал жақын сәтсіздіктер C.4.2 бөлімін пайдаланады. 2–4 шарттар кемінде 6 тіркелген отбасылық GPU-сағаттан кейін және тікелей немесе атрибутталған SU немесе сенімді өмірлік/соңғы жақын сәтсіздіктерсіз бір реттен артық уақыт біткеннен кейін блокталды. Лимитті көтеру басқа бастауға рұқсат береді, бірақ тапсырманы таңдамайды; кезектегі тапсырмалар жұмыс істеп тұрған тапсырмалар деп есептелмейді.&lt;/p&gt;\n&lt;p&gt;Бастаулар, кейінге қалдырулар және қателер. Бекітілген іске қосу шешімдері (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k994n0z3\"&gt;Launch Decisions&lt;/code&gt;) кезекке қабылдауға рұқсат береді; диспетчерлік жазбалар (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ytt90icv\"&gt;Dispatch Records&lt;/code&gt;) іске қосу және орындау оқиғаларын жазып алады (C.3 бөлімі). Басталғанға дейін басқарушы қажетті кірістерді шешеді және ағымдағы шектеулерді қайта тексереді. Параллелизмді кейінге қалдыру әрекетті шығындамай тапсырманы кезекке қайтарады. Басқа уақытша іске қосу қателері барлық қазіргі уақытта бос жұмысшылар қарастырылғаннан кейін ең көбі үш рет, барлығы төрт рет қайталанады. Тұрақты қателер мен сарқылған әрекеттер тапсырманы жояды. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r8kkuxi2\"&gt;Dispatch Records&lt;/code&gt; терминалды іске қосу қателерін және сыйымдылықты кейінге қалдырудың жеке себептерін сақтайды; аралық уақытша қайталанулар әрбір жеке жазбаны тудыруы міндетті емес. Кейінгі орындау немесе шығыстарды жинау қатесі бұрын расталған бастауды өшірмейді.&lt;/p&gt;\n&lt;p&gt;Біртіндеп және түпкілікті нәтижелерді жинау. Жұмыс істеп тұрған BindCraft тапсырмалары C.8.3 бөліміндегі интервалда жаңа шығыстардың бар-жоғына тексеріледі. Тек бұрын мұрағатталмаған &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-waoloxs6\"&gt;ResultRecords&lt;/code&gt; қосылады. Нәтижелерді прецедентті қосудан бастап жұмысшы уақыты жаңа жазбалар арасында бөлінеді; түпкілікті талдау кез келген қалған шығыстарды жинайды. Осылайша жұмыс істеп тұрған тапсырма жазылған нәтижелер мен шығындарға әлдеқашан үлес қоса алады. Мұрағатталған шығыстарды қайта оқу оларды қайтадан қоспайды. Егер түпкілікті талдау бұрынғы нәтижелерден кейін жаңа дизайн бермесе немесе мүлде шығыс бермесе, синтетикалық аяқтау жазбасы ≥ 0.005 GPU-сағат төленбеген қалдықты немесе сәтсіз нәтижені сақтайды. Ол басқа дизайнды емес, шығын мен нәтижені білдіреді. Басқа жолмен бұрын мұрағатталған шығыстарды сәтті қайта оқу екінші төлемді қоспайды. Осы шектен төмен сәтті, бос талдау оның орнына &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0w7mif65\"&gt;ResultRecord&lt;/code&gt;-сыз шығыстарды жинау қатесін жазып алады. Түпкілікті талдау ерекшеліктері бөлек жазылады; кемінде 0.005 өткен GPU-сағаттан кейін қате жазбасы бұрынғы ішінара зарядтармен қабаттаса алатын толық өткен тапсырма құнын сақтайды. Таблица S6 бұл жазбаларды басқа есептеу мөлшерлерінен ажыратады.&lt;/p&gt;\n&lt;h4 id=\"c83-zhumysshy-uakhytynyng-shekteuleri-zhaene-khatelerdi-oengdeu\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c83-zhumysshy-uakhytynyng-shekteuleri-zhaene-khatelerdi-oengdeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.8.3. Жұмысшы уақытының шектеулері және қателерді өңдеу&lt;/span&gt;&lt;/a&gt;C.8.3. Жұмысшы уақытының шектеулері және қателерді өңдеу&lt;/h4&gt;\n&lt;p&gt;Сұрау және жоспарлау қателіктері. Белсенді контроллер итерациялары әдетте сұраулар арасында 5 с күтеді; жоспарланған, кезекке қойылған, жіберілген немесе орындалып жатқан тапсырмалары жоқ итерация 120 с күтеді. Нәтижелер саны, жұмысшылардың қолжетімділігі, жұмыс істеп тұрған жұмысшының 0.25 GPU-сағ қадамына дейін төмен қарай дөңгелектелген құны және отбасылар бойынша кезектегі/жұмыстағы тапсырмалар саны өзгермеген жағдайда, кэштелген науқан күйін есептеу 60 с дейін қайта пайдаланылуы мүмкін. Күйді тексерудегі қате алдыңғы күйді сақтайды. Толық жоспарлауды жаңарту ерекшелігі бұрын қосылған жазбаларды сақтайды, 60 с күтеді және қосымша қабылдау немесе жіберу алдында циклды қайта іске қосады. Қосымша BindCraft жинау жұмыстары әдепкі бойынша 600 с интервалмен, төменгі шекарасы 300 с болып орындалады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кэштеу және сұрау аралықтары өзгермейтін параметрлерді қайта-қайта есептемеу арқылы есептеу ресурстарын үнемдейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Прогресс бақылау нүктелері. Жеке бақылау нүктесі барлық жұмысшылар жұмыс істеп жатқан кездерді қоса алғанда, өткен науқан уақытын және мониторинг деректерін әдепкі 60-с интервалда сақтайды. Жергілікті немесе перспективалы дизайн стандартталған AF2 бағалауын күтіп тұрғанда және стандартты AF2 тапсырмасы орындалып жатқанда, бақылау нүктесі ағымдағы деректерді қайта есептейді және науқан күйін жаңарта алады. Әйтпесе, ол соңғы мұрағатталған жиынтықты пайдаланады және өткен уақытты жаңартады. Бақылау нүктелері JSONL тарихына EvidenceSummary қоспайды және LLM шақырмайды.&lt;/p&gt;\n&lt;p&gt;Тапсырма уақытының шектеулері. Шектеулер бір жұмысшы ұяшығы үшін өткен секундтар болып табылады. ComplexaBeam, best-of-n және FK тапсырмалары 5,400 с шегіне ие; MCTS үшін бұл шек 9,000 с құрайды. Standardталған AF2, ProteinMPNN және BoltzGen шектері 2,160, 900 және 10,800 с құрайды. Шектеу асып кеткен кезде, контроллер қолжетімді нәтижелерді жинауға тырысады және аяқталмаған тапсырманы тоқтатады. Бұл шектер күтілетін орындалу уақытын немесе таңдау құнын көрсетудің орнына артық орындалуды шектейді. BindCraft мұның орнына прогресті бақылайтын таймерді (progress watchdog) пайдаланады. 5,400 с жеңілдік кезеңінен кейін бірінші тексеру прогресс жоқтығы таймерін іске қосады. Бағаланатын нәтижелер санының өсуі оны нөлдейді; мұндай прогресссіз 5,400 с-тан астам уақыт өтуі тоқтатуға әкеледі. Тек аралық файлдардың өсуі таймерді өзі өшірмейді.&lt;/p&gt;\n&lt;p&gt;Қайта-қайта сәтсіз болған отбасыларды өшіру. Ата-ананы талап етпейтін басқа қолжетімді генерация отбасы қалған жағдайда, нәтижелерінде сәйкес келетін немесе шегіне жақын метрикалық дәлелдері жоқ, кем дегенде екі таймаут ResultRecord және 3 жазылған жұмысшы GPU-сағатынан кейін отбасы қолжетімсіз болады. Стандартталған AF2 бұдан тыс қалдырылады. Контроллер сол отбасынан қосымша үміткерлердің пайда болуына жол бермейді және оның кезектегі тапсырмаларын жояды, ал жұмыс істеп тұрған тапсырмалар жалғаса береді. Өшірудің өзі таймаутты да, жаңа жұмысшының басталуын да тіркемейді.&lt;/p&gt;\n&lt;p&gt;Науқан уақытының шектеуі және жұмысты аяқтау. Контроллердің 48 сағаттық шегі циклға кіру кезінде тексеріледі және егер науқан жалғасса, сақталған өткен уақытты қамтиды. Жоспарлау және жіберу бұрыннан басталған итерация шеңберінде аяқталуы мүмкін. B.3 бөлімі 144 H100 жұмысшы GPU-сағатының бөлек есептік бөлімшесін анықтайды. Жұмысты аяқтау кезінде бос емес жұмысшылар пул тәртібімен қаралады және әрқайсысы аяқтау үшін 600 с дейін алады. Қалыпты аяқталу келесі жұмысшыға өтуден бұрын талданады; таймаут нәтижелерді қалпына келтіруге әрекет жасауды, содан кейін тоқтатуды тудырады. Жоспарлаушы барлық күтулер аяқталмай тұрып бөлуді аяқтай алады. Соңғы соңғы нүктені қосу осы орындалу уақытын күтулерге емес, B.3 бөліміне сәйкес келеді.&lt;/p&gt;\n&lt;h4 id=\"c9-gipotezalar-bojynsha-ker-bajlanys\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c9-gipotezalar-bojynsha-ker-bajlanys\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.9. Гипотезалар бойынша кер байланыс&lt;/span&gt;&lt;/a&gt;C.9. Гипотезалар бойынша кер байланыс&lt;/h4&gt;\n&lt;p&gt;Гипотезалар бойынша кер байланыс HypothesisCards (C.5.2-бөлім) болжаған өлшем өзгерістерін сынақтан өткізеді. Әрбір жоспарлау жаңартуының соңында детерминистік ережелер бұрын белсенді болған карточкаларды сол жаңартудың басында қолжетімді нәтижелер негізінде бағалайды. Жаңартылған карточкалар біліктілікті немесе SU несиесін өзгертпестен, кейінгі жоспарлау үшін (C.3-бөлім) сол гипотеза идентификаторы астында қосылады. Бұл тесттер себеп-салдарлы түсіндірулерді емес, сандық болжамдарды бағалайды. D.2.2-бөлімдегі мысалда сегіз ұрпақ біліктіліктен өтті, бірақ ешқайсысы карточканың нақты болжамдарын қолдаған жоқ.&lt;/p&gt;\n&lt;p&gt;Нәтижелер және салыстырудың базалық сызықтары. Нәтиже оны тудырған кандидат тапсырма арқылы карточкамен байланыстырылады, соның ішінде сол гипотеза сілтемесін алып жүретін кейінгі бағалау тапсырмалары да кіреді. Әрбір кандидат барлық болжамды өлшемдер үшін ортақ бір салыстыру базалық сызығын пайдаланады: карточканың реттелген базалық сілтемелері арасындағы бірінші шешілетін нәтиже, одан кейін оның дәйексөз келтірілген дәлелдері. Кейінгі бағалау бұл базалық сызықты мұрагерлікке ала алмайды; әйтпесе, жазылған салыстыру базалық сызығы жоқ тапсырма өзінің орындаушы ата-анасын пайдаланады. Осылайша, салыстыру базалық сызығы тапсырмаға кіріс ретінде берілген дизайн болуы міндетті емес. Шешілетін базалық сызығы жоқ нәтижелер шығарып тасталады. Есептеулер әрбір жаңартуда сол дәлелді қайта қосудың орнына, барлық байланысқан нәтиже–базалық сызық жұптарынан қайта есептеледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Салыстырудың базалық сызығы — жоспарлау барысында жаңа кандидаттардың жақсаруы бағаланатын бастапқы референстік нәтиже.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Болжамды жақсару. dbaseline мен dresult өлшемнің теріс емес біліктілік тапшылықтарын белгілесін (C.4.1-бөлім). dbaseline &amp;gt; 0.01 үшін салыстырмалы тапшылықтың қысқаруы (dbaseline - dresult)/dbaseline карточкада көрсетілген минималды талапқа сай болуы тиіс. dbaseline ≤ 0.01 болған кезде, қолдау көрсету үшін қолайлы бағытта көрсетілген абсолютті жақсару талап етіледі, егер мән жоқ болса немесе нөлге тең болса, осы өлшем бірліктерінде 1.0 болып есептеледі. 0.01 допускі әрбір өлшемнің бірліктерінде қолданылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Барлық болжамды өзгерістер талаптарды орындап, нашарлау шектері бұзылмаса және екі қолдау ұпайы жиналса, карточка қолдау тапқан деп есептеледі.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нәтиже деңгейіндегі дәлелдер. Нәтиже карточканы қолдайды, қашан әрбір болжамды өзгеріс өз жақсару талабына сай келсе және нашарлайтын өлшемдер бойынша тексерілген ешқандай шектеу бұзылмаса. Әрбір осындай шектеу үшін базалық сызық тапшылығы ≤ 0.01 болып қалуы тиіс; әйтпесе, нәтиже тапшылығы базалық сызық тапшылығын карточка рұқсат еткен салыстырмалы өсудің бір қосылған мәніне көбейтіндісінен аспауы тиіс. Шектеу тек базалық және нәтиже өлшемдері қолжетімді болған кезде ғана тексеріледі. Жетіспейтін салыстыруды өткізіп жіберу өлшемнің сақталғанын дәлелдемейді. Нәтиже карточкаға қайшы келеді, қашан әрбір болжамды өлшем базалық сызық тапшылығы &amp;gt; 0.01 және салыстырмалы тапшылықтың қысқаруы ≤ 0.05 мәніне ие болса. Қолдау көрсету де, қайшылық та болжамды бағыттың өлшемнің қолайлы бағытына сәйкес келуін талап етеді. Жетіспейтін болжамды өлшемдер кез келген қорытындыны болдырмайды, бір ерекшелікті қоспағанда: байланысқан стандартталған AF
