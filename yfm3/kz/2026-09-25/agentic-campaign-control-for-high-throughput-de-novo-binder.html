1.6e-09]) p-мәніне ие болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;p-мәні (p-value) бұл контексте айырмашылықтардың статистикалық маңыздылығын немесе модель болжамдарының сенімділігін көрсетеді, кішірек мәндер нәтижелердің жоғары дәлдігін білдіреді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сонымен қатар, HER2-AAV үшін Complexa-only әдісі (4210/10 мәнінде) -13.75 [-15.70, -13.10] орташа мәнін және 9.4e-11 ([2.9e-12, 2.4e-10]) p-мәнін берді, ал BindCraft-only (10410/10) әдісі -14.50 [-15.40, -13.70] және 2.3e-11 ([5.3e-12, 8.7e-11]) p-мәнін көрсетті, BoltzGen-only (2/10†) болса -10.30 [-11.40, -9.20] пен 8.7e-08 ([4.7e-09, 1.7e-07]) нәтижесін көрсетті. SC2RBD нысаны үшін нәтижелер төмендегідей бөлінді: T-REX (5510/10) — -12.30 [-13.60, -11.90], 9.1e-10 ([1.1e-10, 1.7e-09]); PUCT (4010/10) — -12.85 [-16.20, -12.20], 4.0e-10 ([1.3e-12, 1.1e-09]); ε-greedy (2010/10) — -12.25 [-13.60, -11.00], 1.1e-09 ([1.1e-10, 9.3e-09]); Complexa-only (0/10†) сәтті деректерді көрсетпеді; BindCraft-only (2210/10) — -12.25 [-13.90, -11.60], 1.1e-09 ([6.6e-11, 3.3e-09]); BoltzGen-only (6/10†) — -12.30 [-13.80, -10.60], 1.0e-09 ([7.2e-11, 1.7e-08]).&lt;/p&gt;\n&lt;p&gt;PDL1 нысаны бойынша келесі көрсеткіштер алынды: T-REX (10/10) — -13.15 [-14.40, -12.70], 2.4e-10 ([2.7e-11, 5.1e-10]); PUCT (23310/10) — -11.65 [-12.70, -11.20], 2.8e-09 ([4.5e-10, 5.8e-09]); ε-greedy (6510/10) — -11.50 [-12.70, -10.70], 3.7e-09 ([4.8e-10, 1.5e-08]); Complexa-only28110/10 — -12.00 [-12.90, -11.70], 1.5e-09 ([3.6e-10, 2.5e-09]); BindCraft-only (23110/10) — -11.80 [-12.40, -11.40], 2.2e-09 ([8.1e-10, 4.1e-09]); BoltzGen-only (10/10) — -12.35 [-14.50, -11.10], 9.0e-10 ([2.3e-11, 7.6e-09]). Сонымен қатар, IL7RA үшін келесі параметрлер тіркелді: T-REX (10/10) — -11.45 [-12.70, -11.30], 4.0e-09 ([4.5e-10, 5.1e-09]); PUCT (9510/10) — -11.15 [-13.50, -10.80], 7.1e-09 ([1.2e-10, 1.2e-08]); ε-greedy (4010/10) — -10.85 [-12.60, -9.70], 1.1e-08 ([5.9e-10, 7.8e-08]); Complexa-only16710/10 — -11.25 [-12.70, -11.00], 5.5e-09 ([4.7e-10, 9.2e-09]); BindCraft-only (17810/10) — -11.45 [-12.60, -10.90], 4.2e-09 ([5.8e-10, 1.0e-08]); BoltzGen-only (10/10) — -11.55 [-13.30, -10.90], 3.3e-09 ([1.8e-10, 1.0e-08]).&lt;/p&gt;\n&lt;h4 id=\"d43-ekinshi-rettik-khurylym-zhaene-bajlanysu-ornynyng-aertuerliligi\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d43-ekinshi-rettik-khurylym-zhaene-bajlanysu-ornynyng-aertuerliligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.4.3. Екінші реттік құрылым және байланысу орнының әртүрлілігі&lt;/span&gt;&lt;/a&gt;D.4.3. Екінші реттік құрылым және байланысу орнының әртүрлілігі&lt;/h4&gt;\n&lt;p&gt;Екінші реттік құрылым мен мысалдарды талдау үшін 5a,b суреттерінде авторлар MDTraj 1.11.0 бағдарламасын қолдана отырып, 1,461 соңғы T-REX TM0.6 өкілін зерттеді (compute_dssp функциясы, simplified=True). DSSP күйлері H, G және I спиральдар ретінде, ал E және B бета-қабаттар ретінде жіктелді. Әдістер арасындағы бета-құрылымдарға бай нәтижелерді салыстыру үшін әр әдіс пен нысана шеңберінде Foldseek TM0.6 кластерлеуіне дейін кемінде 20% талшығы бар барлық жобалар таңдалды. T-REX әдісі 308 кластер (әрбір жұмысшы GPU-сағатына 0.306-дан) түзе отырып, екінші орын алған BoltzGen-only (95 кластер, GPU-сағатына 0.94) көрсеткішінен айтарлықтай асып түсті (S23 кестесі).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DSSP және Foldseek кластерлеуі ақуыздардың екінші реттік құрылымдарын автоматты түрде анықтауға және ұқсас үш өлшемді модельдерді топтастыруға көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нысана мен байланысушы ақуыз арасындағы байланыстардың өзгергіштігін бағалау үшін 6  Å қашықтықтағы ауыр атомдар жұбы ескерілді. Байланыс белгілері нысандағы орнын және аминқышқылының сыныбын біріктірді: гидрофобты (A/V/L/I/M/C), ароматты (F/Y/W), полярлы (S/T/N/Q/H), оң зарядталған (K/R), теріс зарядталған (D/E), глицин (G), пролин (P) және басқалар. Айырмашылық дәрежесі &lt;span class=\"yfm-latex\" data-content=\"1%20-%20%2FF_i%20%5Ccap%20F_j%2F%20%2F%20%2FF_i%20%5Ccup%20F_j\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; формуласы бойынша 0 мен 1 аралығында есептелді. 5c суреті үшін CbAgo кешендері ортақ нысанға C_α-атомдары арқылы сәйкестендірілді. Негізгі компоненттер талдауы (PCA) 116 CbAgo T-REX және 54 PUCT TM0.6 өкілдері үшін қолданылды. Жоғары бағаланған нұсқалар арасындағы позициялық әртүрлілікті көрсету үшін pLDDT, iPAE және scRMSD бағалары негізінде P1–P3 құрылымдары таңдалды, мұнда P1 ең жоғары нәтиже көрсетті (n = 58), ал P2 және P3 кеңістіктік қашықтық пен байланыс айырмашылығын ескере отырып таңдалды.&lt;/p&gt;\n&lt;p&gt;Таңдама көлеміне сәйкестендірілген салыстырулар. Барлық нысаналар үшін салыстыру мақсатында біз ортақ таңдама көлеміндегі түйісу үлгілерін салыстырдық және PDB қалдықтары нөмірлерінің ауытқуларын жою үшін жаһандық тізбекті сәйкестендіруді қолданып нысана орындарын түзедік. Әрбір нысана үшін эталон ретінде T-REX пен PUCT-та бақыланған ең ұзын тізбек алынды, ал ұзындықтары тең болғанда ең жиі кездесетініне басымдық берілді. Сәйкестендіру ұпайлары сәйкестік үшін +2, сәйкес келмеу үшін -1 және бос орын үшін -2 болып белгіленді; ұпайлар тең келген жағдайда диагональды қадамға, содан кейін сұраныстағы бос орынға, соңында эталондағы бос орынға басымдық берілді. Тек бірдей сәйкестендірілген қалдықтар ғана орын сәйкестіктерін қамтамасыз етті. Бұл сәйкестіктер әр тізбектің кемінде 70%-ын қамтып, бос емес сәйкестендірілген жұптардың кемінде 90%-ын құрауы тиіс еді. Сәйкестендірілген нысана орны жоқ түйісулер алынып тасталды; сақталған әрбір дизайн құрғақ емес сипаттамалар жиынтығына ие болды. CbAgo орындарын қайта таңдап салыстыру үшін де осы тізбекті сәйкестендіру қолданылды, барлық сәйкестендірілген нысана Cα атомдары бойынша Кабш сәйкестендіруі қолданылды. 5c-суретте мұның орнына жоғарыда анықталған қайталанатын түйісу қалдықтары қолданылады. Әрбір нысана мен әдіс үшін біз қайтарусыз TM0.6 бойынша 30 соңғы өкілді таңдап алып, таңдаманы 1,000 рет қайталадық (кездейсоқ ұрық 20260831); барлық жиынтықтарда кемінде 30 өкіл болды. Әрбір таңдама жұптық түйісу үлгілері айырмашылығының медианасын немесе CbAgo орындары үшін байланыстырушы орталықтары арасындағы үш өлшемді Евклид қашықтығының медианасын берді. Біз осы қайта таңдалған медианалардың орташа мәнін және 5-ші мен 95-ші перцентильдерін келтіреміз. Интервалдар тәуелсіз науқандар бойынша сенімділік интервалдарын емес, бақыланатын жиынтықтардың ішкі жиындары арасындағы ауытқуды сипаттайды. CbAgo үшін орташа қайта таңдалған медианалық қашықтық T-REX үшін 31.2 Å [25.2–36.6] және PUCT үшін 9.97 Å [9.08–11.00] құрды. Түйісу үлгілерінің айырмашылығы жеті нысанның төртеуінде T-REX үшін жоғары болды (S24-кесте). Бұл салыстырулар CbAgo үшін болжанған байланыстырушы орындарының кеңірек екенін растайды, ал түйісу үлгілерін салыстыру барлық нысаналар бойынша қандай да бір әдіске біркелкі басымдық бермеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кабш сәйкестендіруі — бұл орташа квадратық ауытқуды азайту үшін екі атомдар жиынтығының кеңістіктегі орналасуын бірінің үстіне бірін қою әдісі, ал Евклид қашықтығы ақуыздардың орталықтары арасындағы тікелей сызықтық қашықтықты өлшейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"d5-khosymsha-nysanalar-bojynsha-zertteu-naukhandary\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d5-khosymsha-nysanalar-bojynsha-zertteu-naukhandary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.5. Қосымша нысаналар бойынша зерттеу науқандары&lt;/span&gt;&lt;/a&gt;D.5. Қосымша нысаналар бойынша зерттеу науқандары&lt;/h4&gt;\n&lt;p&gt;Біз T-REX пен PUCT әдістерін негізгі жеті нысаннан тұратын эталон шеңберінен тыс TNF-α пен TrkA үшін салыстырдық (нысана кіріс деректері A.2-бөлімде). Әрбір нысана шеңберінде екі әдіс те бірдей нысана спецификациясын, сегіз әрекет отбасын, in silico біліктілік өлшемдерін және Foldseek TM0.6 кластерлеуін пайдаланды. 100 жұмысшы GPU-сағ шегінде салыстыру үшін біз 144 жұмысшы GPU-сағ бюджетіне жоспарланған T-REX науқандарынан осы шектегі немесе одан төмен соңғы мұрағатталған EvidenceSummary есебін пайдаландық. PUCT 100 жұмысшы GPU-сағ бюджетімен бөлек іске қосылды және біз оның соңғы мұрағатталған жиынтығын пайдаландық. S25-кестеде әр әдіс пен нысан үшін бір науқаннан келтірілген. Білікті дизайн мен онлайн SU саны кейінгі қайта кластерлеусіз тікелей таңдалған жиынтықтардан алынды. TNF-α бойынша T-REX екі онлайн TM0.6 кластерінде екі білікті дизайнды тіркеді; PUCT білікті дизайндарды тіркеген жоқ. TrkA бойынша PUCT T-REX-ке қарағанда көбірек білікті дизайн шығарды (3,714-ке қарсы 2,369), алайда T-REX көбірек онлайн TM0.6 SU (451-ге қарсы 414) тіркеп, жоғары SU өткізу қабілетін көрсетті. Бұл зерттеу нәтижелері біріктірілген бастапқы эталон нәтижелерінен шығарып тасталды. S25-кестеде екі қосымша нысан бойынша зерттеу науқандары келтірілген. Әрбір жол бір науқанды сипаттайды. T-REX мәндері жұмысшы GPU-сағ бюджеті бар науқандарда 100 жұмысшы GPU-сағ деңгейінде немесе одан төмен соңғы мұрағатталған EvidenceSummary есебінен алынған; PUCT мәндері 100 жұмысшы GPU-сағ бюджеті бар науқандардың соңғы жиынтықтары болып табылады. Білікті дизайн B.1-бөлімдегі үш in silico өлшемінен өткен; онлайн TM0.6 SU саны тіркелген Foldseek кластерлерінің саны болып табылады. Жұмысшы GPU-сағ тіл моделіне қызмет көрсететін T-REX GPU-ын қоспағанда, T-REX үшін үш жұмысшыға немесе PUCT үшін төрт жұмысшыға көбейтілген жұмсалған науқан уақыты ретінде есептеледі. Өткізу қабілеті онлайн SU-ды дөңгелектелмеген тіркелген жұмысшы уақытына бөлу арқылы анықталады. Бұл науқандар бастапқы эталоннан шығарып тасталды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-f5.jpg\" alt=\"5-сурет / T-REX әртүрлі құрылымдары мен болжанған байланысу орындары бар лигандтарды шығарады. a. 𝛼-спиральге бай IL7RA \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет / T-REX әртүрлі құрылымдары мен болжанған байланысу орындары бар лигандтарды шығарады. a. 𝛼-спиральге бай IL7RA лигандын, аралас 𝛼-спираль/𝛽-талшықты CbAgo лигандын және 𝛽-қабатқа бай PDL1 лигандын көрсететін өкілді болжанған кешендер. b.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-сурет / T-REX әртүрлі құрылымдары мен болжанған байланысу орындары бар лигандтарды шығарады. a. 𝛼-спиральге бай IL7RA лигандын, аралас 𝛼-спираль/𝛽-талшықты CbAgo лигандын және 𝛽-қабатқа бай PDL1 лигандын көрсететін өкілді болжанған кешендер. b. DSSP көмегімен есептелген T-REX хиттерінің екінші ретті құрылымдық үлестері (𝑛= 1461). Нөмірленген нүктелер a суретіндегі мысалдарға сәйкес келеді. c. CbAgo-дағы әртүрлі болжанған байланысу орындарындағы өкілді T-REX хиттері. d. T-REX (𝑛= 116) және PUCT (𝑛= 54) хиттері үшін нысанаға қатысты лиганд орындарының негізгі компоненттер талдауы (PCA).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS1.jpg\" alt=\"Сурет S1 / Науқан архиві және EvidenceSummary құрылысы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S1 / Науқан архиві және EvidenceSummary құрылысы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Сурет S1 / Науқан архиві және EvidenceSummary құрылысы. a, Бастапқы науқандарда сақталған тек қосуға болатын тоғыз жазба ағыны рөлдер бойынша топтастырылған (C.3 бөлім). ResultRecord өлшемдерді, ата-аналық сілтемелерді, жұмысшы шығындарын, күйді және шығыс жолдарын сақтайды. Raw logs және файлдар іске қосу каталогында қалады; LLMCallRecord толық промпт мәтінінің орнына промпт хэшін және ықшам аудитті сақтайды. b, Детерминилденген ережелер мұрағатталған жазбаларды ағымдағы тапсырмалар мен ресурстар туралы ақпаратпен біріктіріп, толық мұрағатталған EvidenceSummary құрады (стрелка). 3 және 6 жұмысшы-GPU-сағ терезелері науқан бойы жазылған жұмысшы шығындарын пайдаланады. S2 суреті LLM-ге берілетін кішірек кіріс деректерін көрсетеді. Түпкілікті біліктілік пен SU санақтары соңғы нүктені қосу ережелері қолданылғаннан кейін бөлек қайта есептеледі (B.3 бөлім). Сұр түс нәтижелерді, таңдауларды және қысқарту кірістерін; жасыл түс дәлелдеме/шешім жазбаларын және жиынтық мазмұнын; көк түс іске қосу/орындау жазбаларын білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS2.jpg\" alt=\"Сурет S2 / LLM кірістері және жоспарлау мен орындау тәртібі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S2 / LLM кірістері және жоспарлау мен орындау тәртібі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Сурет S2 / LLM кірістері және жоспарлау мен орындау тәртібі. a, Науқан күйін қоса алғандағы қысқартылған EvidenceSummary екі LLM арқылы бөліседі (шектеулер: C.5.2 бөлім; маршрут пен жинақ анықтамалары: C.2.2 және C.4.1 бөлімдер). Жоспарлаушы қосымша сегізге дейін белсенді немесе соңғы HypothesisCards, қолжетімді әрекет отбасыларын, рұқсат етілген параметрлерді және жұмыс жүктемесі шектеулерін алады; Супервайзер ағымдағы HypothesisCards, жарамды кандидат тапсырмалар мен таңдау контекстін алады. Дәлелдеме көрінісінен нақты мақсат идентификаторы мен мақсат класы кілттері жойылады. b, Күлгін түс LLM ұсыныстары мен басымдыққа ие болуын, қоңыр түс детерминилденген кандидат құрылысы мен таңдауын, көк түс жұмысшының орындалуын білдіреді. Әрбір EvidenceSummary шартты LLM шақырулары алдында мұрағатталады (S1 алгоритмі). Кезекте тұрған тапсырмалар ертерек басталуы мүмкін; кезекке кіру бірден басталуға кепілдік бермейді. Кейінгі жиынтықтар шешімдерді, расталған басталуларды және жаңадан жазылған нәтижелерді қамтиды. Тапсырма басталғанға дейін тек оқу үшін қолжетімді дәлелдеме жаңартулары EvidenceSummary қоспайды және бірде-бір LLM-ді шақырмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS6.jpg\" alt=\"S6-сурет. Пост-хок бағалау табалдырықтары бойынша сақталған бекітілген кластер өкілдері.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S6-сурет. Пост-хок бағалау табалдырықтары бойынша сақталған бекітілген кластер өкілдері.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;S6-сурет. Пост-хок бағалау табалдырықтары бойынша сақталған бекітілген кластер өкілдері. a, үйлестірілген AF2 ipTM және actifpTM; b, PRODIGY болжаған Δ𝐺 (ккал моль−1) және алынған 𝐾D (нМ); c, ESMFold2 кешенінің орташа pLDDT және пакетте хабарланған жалпы ipTM; және d, Boltz-2 ақуыз ipTM және байланыстырушы pLDDT табалдырықтарынан өткен соңғы Foldseek TM0.6 кластерлерінен бекітілген өкілдердің саны. ESMFold2 және Boltz-2 pLDDT табалдырықтары хабарланған 0–1 шкаласын пайдаланады. Сандар жеті нысана бойынша біріктірілген. Әрбір табалдырық бірдей өкілдер жиынтығына бөлек қолданылды. Барлық төрт панель бір сан шкаласын бөліседі; қою мәндер әрбір табалдырықтағы ең үлкен санды белгілейді. Complexa, BindCraft және BoltzGen тек генераторға арналған базалық сызықтарды білдіреді. Бұл пост-хок диагностикасы бөлуге, біліктілікке немесе SU санауға әсер еткен жоқ.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS7.jpg\" alt=\"Сурет S7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S7&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS8.jpg\" alt=\"Сурет S8\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S8&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ақуыз&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;дизайнындағы&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ресурстар&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тапшылығы&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;LLM арқылы&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;агенттік&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;басқару&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бірегей&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;құрылымдар&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;өнімінің өсуі&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;дәрілік&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;заттарды&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тиімді іздеу&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан ө
