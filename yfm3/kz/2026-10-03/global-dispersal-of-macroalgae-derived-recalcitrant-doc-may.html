            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"169\" cy=\"147\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"691\" cy=\"237\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · ECOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Теңіз балдырлары көміртекті&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;мұхит түбінде мыңдаған&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;жылдар бойы сақтайды&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may-f1.jpg\" alt=\"Теңіз балдырымен байланысты еріген органикалық көміртектің (ЕОК) молекулалық ізін әлемдік мұхит бойынша қадағалауға арна\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Теңіз балдырымен байланысты еріген органикалық көміртектің (ЕОК) молекулалық ізін әлемдік мұхит бойынша қадағалауға арналған эксперименттік жұмыс үдерісі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Теңіз балдырымен байланысты еріген органикалық көміртектің (ЕОК) молекулалық ізін әлемдік мұхит бойынша қадағалауға арналған эксперименттік жұмыс үдерісі. (A) In situ мезокосмдар және микробтық деградация. Қапшық мезокосмдар Сангоу шығанағындағы (Сары теңіз) теңіз балдыры фермасында қарқынды өсу (қаңтар) және толық жетілу (маусым) кезеңдерінде орналастырылды, әрқайсысында үш теңіз балдыры (Saccharina japonica) спорофиті және тек теңіз суы бар үш бақылау үлгісі болды. Әр қапшықтан 10 литр ЕОК-пен байытылған теңіз суы сүзіліп, қараңғы жерде табиғи микробтық инокулятпен 180 күн бойы бөлек инкубацияланды (n = 3 әр жағдай үшін, сынамалар 0 және 180-күндері алынды). Теңіз балдыры детритінің параллель деградациясы 210 күн бойы жүргізілді (сынамалар 5 және 210-күндері алынды; үш қайталанымда). (B) ЕОК бойынша салыстырмалы эксперименттер: қосымша инкубациялар құрамына Gracilaria детриті (10 және 90 күн) және аксенді диатомды балдыр дақылдары (Phaeodactylum tricornutum және Chaetoceros sp. DS1; 0 және 90 күн) кірді, әрқайсысы үш қайталанымда. Бірдей жағдайдағы қайталанбалы құтылардан алынған ЕОК сығындылары қатты фазалық экстракциядан өтіп, біріктірілді және FT-ICR MS әдісімен талданды. (C) Консервативті сүзу құбыры теңіз суының бақылау үлгілерімен және әртүрлі фитопланктон мен макробалдырлардың молекулалық формулаларымен (МФ) (жарияланған деректер жиынтығынан да, осы зерттеуден де) ортақ МФ-ны алып тастады, нәтижесінде теңіз балдырымен байланысты 1753 бірегей МФ алынды. (D) Әлемдік мұхитта анықтау. Тынық мұхитының батыс бөлігінен алынған ЕОК үлгілері талданды және әлемдік мұхит ЕОК FT-ICR MS (GODOC-MS) деректер жиынтығын құру үшін әлемдік мұхит FT-ICR MS деректер жиынтығымен біріктірілді. Содан кейін теңіз балдырымен байланысты ЕОК МФ-лары GODOC-MS-пен салыстырылды; картадағы көк түсті шеңберлер теңіз балдырымен байланысты ЕОК сигналдары анықталған станцияларды көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Ламинария сияқты жағалаудағы балдырлар көмірқышқыл газын көп мөлшерде сіңіреді. Жаңа зерттеу көрсеткендей, бұл көміртектің бір бөлігі тұрақты қосылыстарға айналып, ағыстар арқылы мыңдаған шақырым қашықтықтағы мұхиттың терең қабаттарына жетеді. Бұл мұхитта көміртекті ұзақ мерзімді сақтаудың бұрын белгісіз болған жолын ашып отыр.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Ламинария бастапқы өнімінің 62%-ға дейінін еріген көміртегі ретінде бөледі.&lt;/li&gt;\n&lt;li&gt;Балдырларға тән тұрақты молекулалар 5500 метр тереңдіктен табылды.&lt;/li&gt;\n&lt;li&gt;Жағалау экожүйелері жылына 481 тераграммға дейін көміртекті байланыстыра алады.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Ғалымдар Saccharina japonica ламинариясынан бөлінетін еріген органикалық көміртекті (DOC) талдау үшін аса жоғары дәлдіктегі масс-спектрометрияны (FT-ICR MS) қолданды. 180 күндік микробтық ыдырау тәжірибелері барысында көміртегі лабильді (тез ыдырайтын) және рекальцитрантты (ыдырауға төзімді) фракцияларға бөлінді. Қосылыстардың тұрақтылығын бағалау үшін молекулалық рекальцитранттылық индексі (MRS) әзірленді.&lt;/p&gt;\n&lt;p&gt;Талдау нәтижелері ламинарияға тән молекулалық сигналдардың жағалаудан 10 000 шақырым қашықтықта және 5500 метр тереңдікте кездесетінін көрсетті. Бұл қосылыстардың MRS индексі жоғары, бұл олардың микроорганизмдер тарапынан ыдырауға төзімділігін дәлелдейді. Жағалаудағы балдырлар экожүйелерінің рекальцитрантты көміртекті сақтауға қосқан жаһандық үлесі жылына 320,7–481,1 тераграмм көміртекті құрайды деп бағалануда.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу мұхиттағы күрделі табиғи процестерді толық қамтымауы мүмкін зертханалық модельдерге негізделген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Атмосфералық көмірқышқыл газының теңіз алғашқы өнімдері арқылы еріген органикалық көміртекке (ЕОК) және бөлшектік органикалық көміртекке (БОК) айналуы көміртектің бейорганикалық күйден органикалық күйге өтуінің маңызды ағынын білдіреді және жаһандық климатты реттеуде шешуші рөл атқарады. Теңіз ЕОК қоры шамамен 660 миллиард метрикалық тонна көміртекке бағаланады, мұнда төзімді ЕОК (Т-ЕОК) жалпы ЕОК қорының 95%-дан астамын құрайды. Бұл кең қор молекулалық әртүрлілікті қамтиды: теңіз азық-түлік тізбегі арқылы тез айналатын лабильді ЕОК (Л-ЕОК) молекулаларынан бастап, мыңдаған жылдар бойы сақталатын Т-ЕОК молекулаларына дейін. Т-ЕОК негізінен микробтық көміртек сорғысы арқылы Л-ЕОК қосылыстарының микробтық қайта өңделуі нәтижесінде түзіледі, бұл мұхиттағы көміртекті ұзақ мерзімді секвестрлеудің негізгі жолы.&lt;/p&gt;\n&lt;p&gt;Осы молекулалық әртүрлілік пен көміртекті сақтаудағы маңыздылығына қарамастан, мұхиттағы ЕОК түзілуі туралы қазіргі түсінік тек фитопланктоннан алынған ЕОК-қа ғана бағытталған, ал басқа алғашқы өнімдердің үлесі ескерілмейді. Теңіз макробалдырлары жаһандық жағалау мұхитындағы ең кең және өнімді өсімдік мекендейтін ортаны құрайды, олар көміртекті жағалау суларындағы фитопланктоннан бір есе жоғары жылдамдықпен бекітеді және бөледі. Бұл жоғары өнімділік макробалдырлардан алынған ЕОК теңіз ЕОК қорына елеулі үлес қосуы мүмкін екенін көрсетеді. Алайда, макробалдырлардың теңіз ЕОК ағындарына қосқан үлесі молекулалық күрделілік пен әдіснамалық шектеулерге байланысты толық зерттелмеген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Макробалдырлар көміртектің жоғары өнімді көздері болып табылады, алайда олардың жаһандық ЕОК қорына қосқан үлесі талдаудың күрделілігіне байланысты осы уақытқа дейін жеткіліксіз бағаланған.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ЕОК (DOC) — еріген органикалық көміртек; Т-ЕОК (RDOC) — микробтық ыдырауға төзімді фракция; Л-ЕОК (LDOC) — микроорганизмдер тез тұтынатын лабильді фракция.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бақылау зерттеуі: қолда бар деректер әлеуетті байланысты көрсетеді, бірақ қосымша растаусыз жаһандық деңгейде себеп-салдарлық байланысты дәлелдемейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ламинария (Saccharina japonica) бөлетін ЕОК динамикасын өсіру жағдайында сипаттау үшін біз ЕОК бөліну жылдамдығын және одан кейінгі микробтық ыдырау үлгілерін ламинария өсірудің екі түрлі фенологиялық кезеңінде: тез өсу кезеңі және толық жетілген кезеңде сандық түрде анықтадық (Сурет 2). Біз ЕОК-тың жаңа бөлінуінде кезеңге байланысты елеулі өзгерістерді байқадық, мұнда толық жетілген кезең тез өсу кезеңіне (43,6 ± 19,3 мкмоль г⁻¹ шикі салмақ (ШС) күніне) қарағанда айтарлықтай жоғары ЕОК бөліну жылдамдығын [64,7 ± 3,6 мкмоль г⁻¹ ШС күніне] көрсетті (P &amp;lt; 0,05) (Сурет 2, A және B). Теңіз суының фонын алғаннан кейінгі таза ЕОК концентрациялары тез өсу кезеңінде 47 ± 21 мкМ және толық жетілген кезеңде 334 ± 18 мкМ болды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may-f2.jpg\" alt=\"Теңіз балдырынан алынған ЕОК өндірісінің уақытша динамикасы және әртүрлі өсу кезеңдеріндегі микробтық деградация.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Теңіз балдырынан алынған ЕОК өндірісінің уақытша динамикасы және әртүрлі өсу кезеңдеріндегі микробтық деградация.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Теңіз балдырынан алынған ЕОК өндірісінің уақытша динамикасы және әртүрлі өсу кезеңдеріндегі микробтық деградация. ЕОК концентрациясының өзгеруі (A және B) теңіз балдырын өсірудің қарқынды өсу және толық жетілу кезеңдерінде және (C және D) сол өсу кезеңдерінен алынған ЕОК-тың ұзақ уақытқа созылған қараңғы микробтық деградациясы кезінде. Бақылау эксперименттері теңіз балдырынсыз инкубацияланған қоршаған орта теңіз суынан тұрды. Теңіз балдырынан алынған таза ЕОК әр уақыт нүктесінде бақылау мәндерін тәжірибелік мәндерден азайту арқылы есептелді. Мәндер үш өлшемнің орташа ± SD көрсеткіштерін білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Ламинариядан алынған ЕОК-тың кейінгі ұзақ мерзімді микробтық ыдырау эксперименттері (180 күн) екі фазалы ЕОК динамикасын анықтады (Сурет 2, C және D). Бастапқы тез тұтыну алғашқы 90 күн ішінде орын алды, содан кейін 90-күннен 180-күнге дейін ЕОК концентрациялары мен микробтық көбею тұрақталды (Сурет SN, A және B), бұл қалдық ЕОК-тың микробтық ыдырауға негізінен төзімді (Т-ЕОК) екенін көрсетеді. Бақылау топтары үшін түзетуден кейін, қалдық ЕОК (оперативті түрде Т-ЕОК деп белгіленген) тез өсу және толық жетілген кезеңдер үшін бастапқы ЕОК-тың сәйкесінше 20,1% (9 ± 10 мкМ) және 30,5% (102 ± 13 мкМ) бөлігін құрады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ЕОК-тың бөліну жылдамдығы өсу кезеңіне байланысты, ал бөлінген көміртектің 30,5%-ға дейінгі бөлігі төзімді формаға (Т-ЕОК) ауысады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;FT-ICR MS (Фурье түрлендіруі иондық циклотрондық резонанстық масс-спектрометрия) — бір үлгідегі мыңдаған жеке молекулалық формулаларды анықтауға мүмкіндік беретін өте жоғары дәлдіктегі әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зертханалық ыдырау эксперименттері күрделі табиғи жағдайларды толық қайталамайды, сондықтан лабильділік бағалары мұхиттағы нақты көрсеткіштерден өзгеше болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may-f1.jpg\" alt=\"Теңіз балдырымен байланысты еріген органикалық көміртектің (ЕОК) молекулалық ізін әлемдік мұхит бойынша қадағалауға арна\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Теңіз балдырымен байланысты еріген органикалық көміртектің (ЕОК) молекулалық ізін әлемдік мұхит бойынша қадағалауға арналған эксперименттік жұмыс үдерісі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Теңіз балдырымен байланысты еріген органикалық көміртектің (ЕОК) молекулалық ізін әлемдік мұхит бойынша қадағалауға арналған эксперименттік жұмыс үдерісі. (A) In situ мезокосмдар және микробтық деградация. Қапшық мезокосмдар Сангоу шығанағындағы (Сары теңіз) теңіз балдыры фермасында қарқынды өсу (қаңтар) және толық жетілу (маусым) кезеңдерінде орналастырылды, әрқайсысында үш теңіз балдыры (Saccharina japonica) спорофиті және тек теңіз суы бар үш бақылау үлгісі болды. Әр қапшықтан 10 литр ЕОК-пен байытылған теңіз суы сүзіліп, қараңғы жерде табиғи микробтық инокулятпен 180 күн бойы бөлек инкубацияланды (n = 3 әр жағдай үшін, сынамалар 0 және 180-күндері алынды). Теңіз балдыры детритінің параллель деградациясы 210 күн бойы жүргізілді (сынамалар 5 және 210-күндері алынды; үш қайталанымда). (B) ЕОК бойынша салыстырмалы эксперименттер: қосымша инкубациялар құрамына Gracilaria детриті (10 және 90 күн) және аксенді диатомды балдыр дақылдары (Phaeodactylum tricornutum және Chaetoceros sp. DS1; 0 және 90 күн) кірді, әрқайсысы үш қайталанымда. Бірдей жағдайдағы қайталанбалы құтылардан алынған ЕОК сығындылары қатты фазалық экстракциядан өтіп, біріктірілді және FT-ICR MS әдісімен талданды. (C) Консервативті сүзу құбыры теңіз суының бақылау үлгілерімен және әртүрлі фитопланктон мен макробалдырлардың молекулалық формулаларымен (МФ) (жарияланған деректер жиынтығынан да, осы зерттеуден де) ортақ МФ-ны алып тастады, нәтижесінде теңіз балдырымен байланысты 1753 бірегей МФ алынды. (D) Әлемдік мұхитта анықтау. Тынық мұхитының батыс бөлігінен алынған ЕОК үлгілері талданды және әлемдік мұхит ЕОК FT-ICR MS (GODOC-MS) деректер жиынтығын құру үшін әлемдік мұхит FT-ICR MS деректер жиынтығымен біріктірілді. Содан кейін теңіз балдырымен байланысты ЕОК МФ-лары GODOC-MS-пен салыстырылды; картадағы көк түсті шеңберлер теңіз балдырымен байланысты ЕОК сигналдары анықталған станцияларды көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may-f3.jpg\" alt=\"Теңіз балдырынан алынған ЕОК-тың таксономиялық ерекшелігі және молекулалық сипаттамасы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Теңіз балдырынан алынған ЕОК-тың таксономиялық ерекшелігі және молекулалық сипаттамасы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Теңіз балдырынан алынған ЕОК-тың таксономиялық ерекшелігі және молекулалық сипаттамасы. (A) Макробалдырлар мен фитопланктон арасындағы бірегей және ортақ МФ-ны көрсететін UpSet графигі. (B) Макробалдырлар мен фитопланктон арасындағы Jaccard ұқсастық индекстерінің иерархиялық кластерлеу жылу картасы. (C) Теңіз балдырымен байланысты LDOC және RDOC фракцияларының молекулалық құрамын салыстыратын Ван Кревелен диаграммалары. (D) Теңіз балдырымен байланысты LDOC және RDOC-тағы қосылыстар кластары бойынша МФ саны. Cond., конденсацияланған; HC, көмірсутектер; Unsat., қанықпаған.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may-f4.jpg\" alt=\"Теңіз балдырымен байланысты лабильді (Kelp-LDOC) және рекальцитрантты (Kelp-RDOC) ЕОК фракцияларындағы MRS таралуы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Теңіз балдырымен байланысты лабильді (Kelp-LDOC) және рекальцитрантты (Kelp-RDOC) ЕОК фракцияларындағы MRS таралуы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Теңіз балдырымен байланысты лабильді (Kelp-LDOC) және рекальцитрантты (Kelp-RDOC) ЕОК фракцияларындағы MRS таралуы. (A) Kelp-RDOC-ты Kelp-LDOC-тан ажырататын RF арқылы анықталған доминантты молекулалық индекстердің (AImod, DBE, GFE, H/C және NOSC) z-баллмен масштабталған мәндерін көрсететін жылу картасы. (B) Kelp-LDOC және Kelp-RDOC фракцияларындағы MRS мәндерінің таралуын бейнелейтін скрипка диаграммасы. Қызыл нүктелі сызық болжамды MRS шегін білдіреді. Топтық айырмашылықтың әсер ету көлемі Коэн d (d = 0,87) арқылы сандық анықталады, бұл молекулалық рекальцитранттылықтағы елеулі өзгерісті көрсетеді. (C) Молекулалық деңгейдегі индекстердің (MRS, AImod, DBE, NOSC, H/C, O/C және GFE) Брей-Кертис айырмашылықтарына негізделген Kelp-LDOC және Kelp-RDOC фракцияларының PCoA талдауы. Нүктелер фракциялар бойынша түстермен белгіленген жеке МФ профильдерін білдіреді; толтырылған ромбтар топ центроидтарын (көп өлшемді орташа) білдіреді. Эллипстер 95% сенімділік аймақтарын көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may-f5.jpg\" alt=\"Теңіз балдырымен байланысты ЕОК МФ-ларының желілік шолуы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Теңіз балдырымен байланысты ЕОК МФ-ларының желілік шолуы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Теңіз балдырымен байланысты ЕОК МФ-ларының желілік шолуы. (A) Молекулалық индекстер арасындағы корреляцияға негізделген теңіз балдырымен байланысты ЕОК-тың молекулалық ұқсастық желісі. Визуализация үшін тек корреляция коэффициенті 0,9-дан жоғары байланыстар көрсетілген. (B) Теңіз балдыры, фитопланктон және басқа макробалдырлармен байланысты молекулалық желілер үшін жаһандық желілік қасиеттерді (орташа жол ұзындығы, жаһандық транзитивтілік, модульділік және желі тығыздығы) жинақтайтын бағанды диаграммалар. (C) Үш топ арасындағы жеке МФ-лардың жергілікті кластерлеу коэффициенттерін салыстыратын скрипка диаграммалары. (D) Әр желі ішіндегі молекулалардың салыстырмалы көпір рөлін білдіретін аралық орталықтылықты (betweenness centrality) үш топ бойынша салыстыратын скрипка диаграммалары. Үстіне қойылған нүктелер жеке МФ-ларды білдіреді (айқындық үшін ығыстырылған). Ақ ромбтар топ орташаларын білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may-f6.jpg\" alt=\"Әлемдік мұхиттағы ламинариямен байланысты еріген органикалық көміртектің (DOC) молекулалық формулаларының (MF) таралуы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Әлемдік мұхиттағы ламинариямен байланысты еріген органикалық көміртектің (DOC) молекулалық формулаларының (MF) таралуы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Әлемдік мұхиттағы ламинариямен байланысты еріген органикалық көміртектің (DOC) молекулалық формулаларының (MF) таралуы. (A) Ламинариямен, басқа макробалдырлармен және фитопланктонмен байланысты DOC молекулалық формулалары анықталған мұхит станцияларының картасы. Мұхиттық MF деректер жинағы Bercovici және т.б. (106, 107) және Stubbins пен Dittmar (71) еңбектері негізінде құрастырылған. Ашық көк түспен ламинария (Saccharina sp.) мекендейтін жағалау аймақтары белгіленген (мекендеу ортасының таралуы Eger және т.б. (108) бойынша). (B) GODOC-MS деректер жинағында анықталған фитопланктонмен, ламинариямен және басқа макробалдырлармен байланысты DOC молекулалық формулаларының пайыздық үлесін көрсететін бағанды диаграмма. (C) Әрбір тереңдік аймағындағы ламинариямен байланысты лабильді (LDOC), рекальцитрантты (RDOC) еріген органикалық көміртектің және басқа мұхиттық MF-тердің салыстырмалы құрамын көрсететін жинақталған бағанды диаграмма. Пайыздық үлестер бағандардың ішінде көрсетілген; осьтің үзілуі 93%-дан жоғары шағын компоненттерді ерекшелейді. (D) Тереңдік аймақтары бойынша ламинариямен байланысты лабильді және рекальцитрантты DOC үшін MRS таралуын көрсететін скрипка диаграммалары. Жекелеген MF-тер нүктелер түрінде көрсетілген; үстіне қойылған жәшік диаграммалары квартиларалық ауқым мен медианаларды көрсетеді, жұлдызшалар статистикалық маңыздылық деңгейлерін білдіреді (*P &amp;lt; 0,05 және ****P &amp;lt; 0,0001).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Балдыр&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;көміртегінің&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тағдыры&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;белгісіз&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Масс-&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;спектрометрия&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;және талдау&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Көміртегі&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"1
