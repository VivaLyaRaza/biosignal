            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"248\" cy=\"124\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"512\" cy=\"291\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · CARDIOVASCULAR MEDICINE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Жасанды интеллект кенеттен&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;болатын жүрек өлімін болжай&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ала ма&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-f1.jpg\" alt=\"1-сурет. Амбулаториялық ЭКГ жазбаларын клиникалық деректермен бірге талдауға арналған мультимодальды жұмыс процесі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Амбулаториялық ЭКГ жазбаларын клиникалық деректермен бірге талдауға арналған мультимодальды жұмыс процесі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет. Амбулаториялық ЭКГ жазбаларын клиникалық деректермен бірге талдауға арналған мультимодальды жұмыс процесі. ЭКГ жазбалары алдын ала өңделіп, қысқа терезелерге сегменттеледі. Әрбір терезе үшін жүрек соғысының өзгермелілігі (HRV) көрсеткіштері алынып, Multiple Instance Learning–Temporal Convolutional Network (MIL–TCN) арқылы кодталады, бұл ЭКГ кескінін, 𝜀ECG қалыптастырады. Параллель түрде клиникалық айнымалылар үлкен тілдік модель (&lt;a href=\"concepts/llm.html\"&gt;LLM&lt;/a&gt;) арқылы жасалған мәтін, детерминирленген клиникалық мәтін немесе кестелік белгілер ретінде ұсынылады. LLM жасаған және детерминирленген мәтіндер пациент деңгейіндегі мәтіндік кескіндерді, 𝜀TXT алу үшін биомедициналық мәтіндік кодтағыш арқылы кодталады, ал алдын ала өңделген кестелік айнымалылар кестелік кескінді, 𝜀TAB құрайды. ЭКГ, мәтіндік және кестелік кескіндердің әрқайсысы унимодальды модельдер ретінде бағаланды, ал мәтіндік және кестелік кескіндер кенеттен болатын жүрек өлімін (SCD) және жүрек жеткіліксіздігінен болатын өлімді (PFD) болжау үшін мультимодальды модельдерде ЭКГ кескінімен жеке біріктірілді. Үзік сызықтар мультимодальды біріктіру үшін мәтіндік (TXT) немесе кестелік (TAB) кескінді пайдалануды көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Кенеттен болатын жүрек өлімі мен жүрек жеткіліксіздігі медицинадағы күрделі мәселелердің бірі. Зерттеушілер ЭКГ жазбаларын пациенттердің медициналық карталарымен бірге талдайтын модель жасады. Сандық деректер мен клиникалық ақпараттың үйлесімі тек мәтін немесе тек ЭКГ графиктерін қолданғаннан гөрі тиімдірек екені анықталды.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Модель MIL-TCN нейрондық желісі арқылы ЭКГ сегменттерін талдайды.&lt;/li&gt;\n&lt;li&gt;Кенеттен болатын өлімді болжауда ЭКГ мен мәтін комбинациясы тиімді.&lt;/li&gt;\n&lt;li&gt;Жүрек жеткіліксіздігі қаупін бағалауда кестелік деректер ең дәл нәтиже берді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Авторлар төрт жылдық өлім қаупін бағалау үшін MUSIC когортасындағы 730 пациенттің деректерін пайдаланды. Жүректің электрлік белсенділігін талдау үшін MIL-TCN (уақытша конволюциялық нейрондық желі) архитектурасы қолданылды, ол Холтер мониторингінің 30 секундтық сегменттерін өңдейді. Клиникалық деректер үш форматта ұсынылды: кестелер, нақты мәтіндік сипаттамалар және үлкен тілдік модельдер (LLM) арқылы жасалған есептер.&lt;/p&gt;\n&lt;p&gt;Нәтижелер көрсеткендей, кенеттен болатын жүрек өлімін (SCD) болжауда ЭКГ мен нақты мәтін комбинациясы 0,711 AUROC көрсеткішіне жетті. Жүрек жеткіліксіздігінен болатын өлім (PFD) үшін кестелік деректерге негізделген модель ең тиімді болды (AUROC 0,787). Зерттеу мультимодальды модельдердің тиімділігі клиникалық деректерді ұсыну тәсіліне қатты тәуелді екенін және қарапайым құрылымдалған форматтар көбінесе күрделі LLM сипаттамаларынан асып түсетінін растады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бұл әлі рецензиядан өтпеген препринт, сондықтан нәтижелерді кеңірек пациенттер тобында тексеру қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Амбулаториялық электрокардиограммалар (ЭКГ) жүректің электрлік белсенділігін үздіксіз бақылауды қамтамасыз етеді, алайда машиналық оқытудың көптеген тәсілдері бұл жазбаларды пациенттің кеңірек клиникалық контекстін ескермей талдайды. Біз кенеттен болатын жүрек өлімін (КЖӨ) және жүрек жеткіліксіздігінен болатын өлімді (ЖЖӨ) төрт жылдық кезеңге болжау үшін амбулаториялық ЭКГ-дан алынған көріністерді клиникалық ақпаратпен біріктіретін мультимодальды құрылымды бағаладық. Талдау MUSIC когортасынан 730 пациентті қамтыды, оның ішінде 71 КЖӨ және 82 ЖЖӨ жағдайы бар. Амбулаториялық ЭКГ жазбалары сегменттерге бөлініп, multiple instance learning – уақытша конволюциялық нейрондық желі көмегімен кодталды, ал клиникалық айнымалылар үлкен тіл моделі (LLM) арқылы жасалған мәтін, детерминирленген мәтін немесе кестелік белгілер ретінде ұсынылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Multiple instance learning — машиналық оқыту әдісі, мұнда модель жеке объектілерді емес, объектілер топтарын («қаптарды») жіктейді, бұл ЭКГ жазбаларын талдауға қолайлы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модельдер бес сыртқы және төрт ішкі қабатты пациент деңгейіндегі өзара тексеру (nested cross-validation) көмегімен әзірленіп, бағаланды; бұл ретте деректерді алдын ала өңдеу, модель мен біріктіру архитектурасын таңдау, калибрлеу және шекті мәндерді таңдау тек оқыту деректерімен шектелді. КЖӨ үшін ЭКГ мен детерминирленген мәтін комбинациясы 0,711 (95% CI, 0,643–0,773) ең жоғары AUROC-қа қол жеткізді, ал ЭКГ мен кестелік клиникалық белгілер 0,248 (0,180–0,357) ең жоғары PR-&lt;a href=\"concepts/area-under-the-curve.html\"&gt;AUC&lt;/a&gt; көрсетті. ЖЖӨ үшін унимодальды кестелік модель 0,787 (0,732–0,839) AUROC және 0,360 (0,275–0,470) PR-&lt;a href=\"concepts/roc-auc.html\"&gt;AUC&lt;/a&gt;-пен ең жоғары нәтиже көрсетті, ал ЭКГ мен кестелік белгілер 0,756 (0,697–0,811) AUROC және 0,353 (0,261–0,461) PR-AUC көрсетті. ЭКГ мен LLM мәтінінің комбинациясы тек LLM мәтінінен гөрі жақсы нәтиже берді, бірақ унимодальды ЭКГ моделінен асып түскен жоқ.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ЭКГ мен клиникалық деректердің мультимодальды интеграциясы деректерді ұсыну түріне тәуелді екенін көрсетті: детерминирленген және кестелік форматтар LLM арқылы жасалған мәтіндерге қарағанда болжамдық тұрғыдан құндырақ болды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Атрибуция мен токендерді маскалау талдаулары модель түсіндірмелерінің кіріс деректерінің үстірт өзгерістеріне ішінара төзімді екенін, сонымен бірге модель мен маскалау шарттарына сезімтал болып қалғанын дәлелдейтін қосымша айғақтар берді. Көріністер мен пациент мәтіндерінің ауыстырылуын талдау болжамдық құндылықтың клиникалық ақпараттың қалай ұсынылғанына қатты тәуелді екенін көрсетті. Бұл нәтижелер мультимодальды интеграцияның артықшылығы нәтиже мен деректерді ұсыну әдісіне байланысты екенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу бақылау сипатында (MUSIC когортасы), сондықтан анықталған байланыстар себеп-салдарлық қатынасты дәлелдемейді; нәтижелер клиникалық деректерді ұсыну әдістерінің ерекшелігіне байланысты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Кенеттен болатын жүрек өлімі (КБЖӨ) және жүрек жеткіліксіздігінен болатын өлім (ЖЖӨ) жүрек жеткіліксіздігі кезіндегі өлімнің екі негізгі себебі болып табылады. Фармакологиялық терапия мен медициналық құрылғылардағы жетістіктерге қарамастан, бұл нәтижелердің жоғары қаупі бар адамдарды дәл анықтау клиникалық мәселе болып қала береді. Амбулаториялық электрокардиограммалар (ЭКГ), соның ішінде ұзақ мерзімді Холтер мониторингі, жүрек ырғағын үздіксіз бағалауды қолдайды, өтпелі аритмияларды, эктопиялық жүктемені және мезгіл-мезгіл болатын өткізгіштік бұзылыстарын тіркейді. Бұл өтпелі ауытқулар КБЖӨ мен ЖЖӨ қаупін бағалау үшін маңызды прогностикалық ақпаратты қамтиды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кенеттен болатын жүрек өлімі мен жүрек жеткіліксіздігінен болатын өлім маңызды мәселелер болып табылады, ал амбулаториялық ЭКГ болжау үшін маңызды, бірақ түсіндіруге қиын деректерді ұсынады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Алайда, амбулаториялық ЭКГ жазбаларын ұзақ мерзімді жүрек өлімінің сенімді және клиникалық тұрғыдан іске асырылатын болжаушыларына айналдыру күнделікті тәжірибеде күрделі және ресурсты қажет ететін процесс болып қала береді. Машиналық оқыту (МО) және жасанды интеллект (ЖИ) модельдері бұл мәселелерді шешуде ерте уәделер берді. ЖИ/МО модельдері толқын морфологиясын (мысалы, P толқындары, QRS ұзақтығы) сипаттауда және аритмия оқиғаларын (мысалы, жүрекшелер фибрилляциясы, жүрекшелер дірілі) анықтауда күшті қабілетті көрсетті. Сонымен қатар, үлкен тіл модельдері (ҮТМ) құрылымдалған және құрылымдалмаған деректер жиынтығында пайымдау қабілетін көрсетті. Доменге бейімделген медициналық ҮТМ клиникалық белгілерді (мысалы, демография, медициналық тарих, зертханалық мәндер) синтездеп, биомедициналық пайымдауларды жасай алады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ҮТМ (LLM) — бұл үлкен көлемдегі мәтіндер негізінде оқытылған, медициналық карталарды талдап, сарапшылар сияқты логикалық қорытындылар жасай алатын алгоритмдер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл жетістіктерге қарамастан, маңызды олқылықтар сақталуда. Амбулаториялық ЭКГ талдауы үшін көптеген ЖИ/МО модельдері бірыңғай модальды (unimodal) болып табылады, олар негізінен пациенттің кеңірек контекстін қоспастан, ЭКГ жазбасындағы өрнектерді анықтауға бағытталған. Алдыңғы зерттеулер клиникалық контексттің ЭКГ-ны түсіндіруге дәрігерлер де, ЖИ/МО модельдері де әсер ете алатынын көрсетеді. Сондықтан ЭКГ жазбаларын пациент деңгейіндегі клиникалық ақпаратпен интеграциялау нәтижелерді болжау үшін қосымша ақпаратты ұсына алады. Алайда, мультимодальды интеграция өнімділікті автоматты түрде жақсартпайды: оның құндылығы нәтижеге, әрбір модальдылықтың өкілдігіне, деректердің бір-бірімен сәйкес келу дәрежесіне және біріктіру стратегиясына байланысты болуы мүмкін. Сондықтан, мультимодальды тәсілдер қашан мағыналы нәтижелерді ұсынатынын және қашан ұсынбайтынын анықтау үшін бірыңғай модальды және дәстүрлі құрылымдалған деректер модельдерімен қатаң салыстырулар қажет.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мультимодальды модельдер әрқашан бірыңғай модальды модельдерден артық емес; олардың табысы деректер сапасы мен оларды біріктіру стратегиясына байланысты, бұл мұқият тексеруді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Осы қажеттілікті қанағаттандыру үшін біз амбулаториялық ЭКГ жазбаларынан алынған пациент деңгейіндегі өкілдіктерді құрылымдалған айнымалылар, детерминирленген мәтін немесе ҮТМ жасаған бағалаулар ретінде көрсетілген клиникалық ақпаратпен біріктіретін мультимодальды жүйені әзірледік және жүйелі түрде бағаладық. Біз клиникалық пайдалану жағдайы ретінде КБЖӨ мен ЖЖӨ-ні төрт жылдық болжауды қолдандық. Біз жалпы ішкі өзара тексеру (nested cross-validation) шеңберінде бірыңғай модальды және мультимодальды тәсілдерді салыстырдық және өнімділіктің нәтижелер мен клиникалық өкілдіктер бойынша қалай өзгеретінін тексердік. Бұл зерттеудің негізгі үлестері төмендегідей:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Төрт жылдық КБЖӨ мен ЖЖӨ болжамы үшін амбулаториялық ЭКГ, кестелік клиникалық айнымалылар, детерминирленген клиникалық мәтін және ҮТМ жасаған клиникалық бағалаулардың қатаң бенчмаркі, соның ішінде бірыңғай модальды модельдер мен ЭКГ-клиникалық синтез модельдері.&lt;/li&gt;\n&lt;li&gt;Мультимодальды синтез стратегиялары, соның ішінде конкатенация, проекцияланған конкатенация, скалярлық гейтинг, векторлық гейтинг және салмақталған қосынды тек оқу деректерін пайдалана отырып салыстырылған және таңдалған ішкі өзара тексеру жүйесі, бұл модель таңдаудағы бұрмалаушылықты азайта отырып, мультимодальды интеграцияны бағалауға мүмкіндік береді.&lt;/li&gt;\n&lt;li&gt;Құрылымдалған айнымалыларды қайта баяндаудан немесе қайталаудан қосымша мультимодальды ақпаратты ажыратуға арналған өкілдік және беріктік талдауларының жиынтығы, соның ішінде дәстүрлі кестелік модельдермен, детерминирленген мәтінмен, пайымдау және қауіп белгілерінің абляцияларымен, ЭКГ-үсті-үстіне түсу талдауларымен, пациент-мәтін алмасуымен, сондай-ақ атрибут тұрақтылығы мен пертурбация талдауларымен салыстырулар.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"2-khatysty-zhumystar\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#2-khatysty-zhumystar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Қатысты жұмыстар&lt;/span&gt;&lt;/a&gt;2. Қатысты жұмыстар&lt;/h4&gt;\n&lt;p&gt;2.1. Амбулаториялық ЭКГ талдауы&lt;/p&gt;\n&lt;p&gt;Ерте есептеу зерттеулері амбулаториялық ЭКГ өрнектерін жүрек фенотиптерімен байланыстыру үшін уақыт және жиілік доменіндегі белгілерді бөліп алуға баса назар аударды. Badilini және басқалар [26] циркадиялық өзгерістер мен бета-блокатор әсерін бағалау үшін спектрлік талдауды қолданды, ал Bakhshi және басқалар [27] аритмияларды синустық ырғақтан ажырату үшін екінші ретті авторегрессиялық модельдеу мен сызықтық классификацияны пайдаланды. Жақында жасалған жұмыстар өкілдікті оқыту мен ырғақ классификациясын автоматтандыру үшін терең оқытуды (deep learning) қабылдады. Huang және басқалар [28] ЭКГ сегменттерін спектрограммаларға айналдырды және ырғақ классификациясы үшін екі өлшемді конволюциялық нейрондық желілерді қолданды, ал Biton және басқалар [29] RR интервалдары бойынша уақытша тәуелділіктерді модельдеу үшін Ar-Net2-ні ұсынды. Ben-Moshe және басқалар [30] таралу ығысуларын шешу және 30 секундтық жазбалардан тікелей жүрекшелер фибрилляциясын анықтау үшін RawECGNet-ті ұсынды. Han және басқалар [31] аритмияны анықтау үшін Gramian Angular Field өкілдіктерін көп мысалды оқытумен (multiple instance learning) біріктірді. Sameh және басқалар [32] уақытша контекст пен амбулаториялық ЭКГ-ның алдыңғы өкілдігін өзгерту жүрекшелер фибрилляциясы мен жүрекшелер дірілін анықтауға қалай әсер ететінін зерттеді.&lt;/p&gt;\n&lt;p&gt;Бұл тәсілдер бойынша амбулаториялық ЭКГ жазбалары әдетте қысқарақ сегменттер жиынтығы ретінде талданады, болжамдар сегмент деңгейінде жасалады және кейбір жағдайларда жазба деңгейіндегі нәтижелерді алу үшін көп мысалды оқыту сияқты механизмдер арқылы біріктіріледі. Алайда, бұл стратегиялар көбінесе локализацияланған ырғақты анықтаумен шектеледі.&lt;/p&gt;\n&lt;h4 id=\"22-llm-zhaene-multimodaldy-integraciya\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#22-llm-zhaene-multimodaldy-integraciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.2. LLM және мультимодальды интеграция&lt;/span&gt;&lt;/a&gt;2.2. LLM және мультимодальды интеграция&lt;/h4&gt;\n&lt;p&gt;LLM және пәндік салаға бейімделген тілдік модельдер клиникалық мәтіндерді түсіну және шешім қабылдауды қолдау қосымшаларындағы пайдалылығы үшін зерттелді. Ли және авторлар BioBERT-ті ұсынды, ал Хуан және авторлар ClinicalBERT-ті әзірледі; екі модель де клиникалық баяндаулар мен электронды медициналық карталардың құрылымдалған деректерін кодтауды жақсарту үшін трансформер архитектурасын биомедициналық және клиникалық корпустарға бейімдеу мақсатында салалық алдын ала оқытуды пайдаланады. Жақында Се және авторлар Me-LLaMA-ны ұсынды, ал Ли және авторлар LLaVA-Med-ті таныстырды, олар пациенттер туралы гетерогенді ақпарат негізінде қорытындылау, сұрақтарға жауап беру және нәтижелерді болжау сияқты жоғары деңгейлі клиникалық пайымдауды қамтамасыз ету үшін нұсқаулықтарды баптау және мультимодальды сәйкестендіру стратегияларын зерттеді.&lt;/p&gt;\n&lt;p&gt;Ян және авторлар аритмиялық оқиғаларды жіктеу және емдеу стратегияларын ұсыну үшін қысқа мерзімді ЭКГ мен клиникалық жазбаларды өңдейтін ECG-LM-ді құрды. Бұл тәсілдер тілдік модельдерді мәтіндік деректерге және кейбір жағдайларда қысқа мерзімді ЭКГ сигналдарына қолданады, бұл ретте бірінші кезекте репрезентацияны оқыту және аритмияны жіктеу міндеттеріне назар аударылады. Біздің білуімізше, пациенттің клиникалық контекстін 24 сағаттық амбулаторлық ЭКГ сигналдарымен интеграциялау бойынша жұмыстар шектеулі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қолданыстағы модельдер (BioBERT, ClinicalBERT, Me-LLaMA, LLaVA-Med, ECG-LM) мәтіндермен және қысқа ЭКГ жазбаларымен сәтті жұмыс істейді, алайда клиникалық контекстті 24 сағаттық ЭКГ мониторингімен интеграциялау әлі де аз зерттелген сала болып табылады.&lt;br /&gt;\n[!tip] LLM (Large Language Models) — бұл үлкен мәтіндік деректер базасында оқытылған, адам тілін түсінуге және генерациялауға қабілетті нейрондық желілер, ал мультимодальдылық модельдің бір уақытта әртүрлі деректер түрлерін, мысалы, мәтін мен ЭКГ графиктерін өңдеу қабілетін білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;h4 id=\"naetizhelerdi-talkhylau\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#naetizhelerdi-talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелерді талқылау&lt;/span&gt;&lt;/a&gt;Нәтижелерді талқылау&lt;/h4&gt;\n&lt;p&gt;Біз амбулаториялық ЭКГ-дан алынған көріністерді клиникалық мәтінмен және кестелік деректермен біріктіретін мультимодальды интеграция стратегияларын жүйелі түрде бағаладық. Мультимодальды интеграция әрқашан бірдей тиімді бола бермейді және клиникалық ақпараттың ұсынылу тәсіліне қатты тәуелді. SCD (кенеттен болатын жүрек өлімі) үшін ЭКГ мен детерминирленген мәтін комбинациясы ең жоғары AUROC көрсеткішіне қол жеткізді, ал ЭКГ мен кестелік клиникалық белгілердің комбинациясы PR-AUC бойынша ең жақсы нәтиже көрсетті. PFD (прогрессивті жүрек жеткіліксіздігі) үшін унимодальды кестелік модель жалпы алғанда ең тиімді болып қалды, ал ЭКГ мен кестелік белгілердің комбинациясы унимодальды ЭКГ моделінен айтарлықтай асып түссе де, тек кестелік белгілердің өзінен озып кетпеді. ЭКГ мен LLM арқылы жасалған толық мәтін комбинациясы екі нәтиже үшін де унимодальды LLM моделіне қарағанда жақсаруды көрсетті, бірақ унимодальды ЭКГ моделінен асып түспеді. Унимодальды клиникалық көріністер арасында детерминирленген және кестелік деректер, әсіресе PFD үшін, LLM арқылы жасалған толық бағалауға қарағанда жоғарырақ дискриминациялық қабілетті қамтамасыз етті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мультимодальды модельдердің тиімділігі клиникалық деректерді ұсыну тәсіліне байланысты: кестелік белгілер көбінесе SCD және PFD-ді болжауда LLM жасаған мәтіндік сипаттамалардан басым түседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл нәтижелер клиникалық контекст амбулаториялық ЭКГ деректерін толықтыра алатынын көрсетеді, алайда оның болжамдық құндылығы нәтижеге де, қолданылған ұсыну тәсіліне де байланысты. Болжамдық тиімділіктен бөлек, біз мультимодальды модельдердегі ЭКГ назары мен мәтін маңыздылығының пациент деңгейіндегі визуализациясын ұсындық. Модель назар аударатын ЭКГ сегменттерін жүрек соғысы жиілігінің өзгермелілік белгілерімен және клиникалық мәтінмен байланыстыра отырып, бұл талдаулар модельдің жеке болжамдарымен байланысты ерекшеліктерді айқындайды. Атрибуция рейтингтері кіріс деректеріндегі үстірт өзгерістерге қатысты салыстырмалы түрде тұрақты, бірақ оқытылған модель параметрлеріндегі өзгерістерге сезімтал болды. Токендерді маскалау талдауы градиенттік атрибуция бойынша ең жоғары деңгейдегі токендерді маскалау әдетте кездейсоқ таңдалған токендерді маскалауға қарағанда болжанған ықтималдықта үлкен өзгерістерге әкелетінін көрсетті, дегенмен бұл айырмашылықтың шамасы нәтиже мен маскалау үлесіне қарай өзгерді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Атрибуция (attribution) — жасанды интеллектіні түсіндіру әдісі, ол қай кіріс деректері (мысалы, ЭКГ сегменттері немесе мәтіндегі сөздер) модель шешіміне ең үлкен үлес қосқанын анықтауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Көріністер мен беттесулер бойынша абляциялар детерминирленген мәтін мен тікелей кестелік клиникалық айнымалылар LLM жасаған толық бағалауға қарағанда көбірек болжамдық ақпаратты сақтайтынын көрсетті. ЭКГ қорытындыларын қосу кестелік тиімділікке айтарлықтай әсер етпеді және PFD үшін SCD-ге қарағанда LLM көрінісі үшін пайдалырақ болды. Мұның мүмкін түсіндірмелерінің бірі — ырғақ бұзылыстары жүрек жеткіліксіздігінің ауырлығы мен жүрек резервінің төмендеуі белгілері үшін қосымша контекст қамтамасыз ете алады, бұл прогрессивті сорғы жеткіліксіздігімен тікелей байланысты, ал SCD негізінде жатқан гетерогенді аритмиялық субстрат Холтер мониторингінің осы бес категориялық қорытындыларымен толық қамтылмауы мүмкін. Алайда, бұл түсіндірме бастапқы болып табылады, әсіресе бірдей ЭКГ қорытындыларын кестелік модельдерге қосу екі нәтиже үшін де онша үлкен емес тиімділік өзгерістеріне әкелгендіктен. Сонымен қатар, «пациент-мәтін» сәйкестігін араластыру ЭКГ мен LLM синтезінің тиімділігіне аз әсер етті, бұл толық LLM мәтіндік көрінісінде пациентке тән сәйкестікті сақтау осы талдау аясында тиімділіктің өлшенетін пайдасын бермегенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу бір деректер жиынтығына негізделген, бұл нәтижелерді жалпылау мүмкіндігін шектейді; сондай-ақ SCD және PFD оқиғаларының аздығы модельдердің тұрақтылығын төмендетуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Шешім қабылдау қисықтарын зерттеу талдауы көрініске тәуелді осындай заңдылықты көрсетті. Бастапқы кестелік клиникалық белгілерді қамтитын модельдер «бәрін емдеу» және «емдемеу» стратегияларына қатысты оң таза пайданың ең кең аймақтарын көрсетті, әсіресе PFD үшін, ал ЭКГ мен толық LLM мәтіні бағаланған шекті аралықта шектеулі пайда көрсетті. Бұл шектер зерттеу сипатында болғандықтан және расталған араласу стратегиясымен байланысты болмағандықтан, бұл нәтижелерді нақты емдеу шегі үшін дәлел ретінде емес, әлеуетті клиникалық пайдалылықтың салыстырмалы бағасы ретінде түсіндіру керек. Бірнеше шектеулерді ескеру қажет. Біріншіден, зерттеу бір деректер жиынтығында жүргізілді; жалпылау мүмкіндігін бағалау үшін сыртқы валидация қажет. Екіншіден, SCD және PFD оқиғаларының салыстырмалы түрде шектеулі саны модельдің сенімділігін шектеуі мүмкін, әсіресе сирек кездесетін нәтижелерді болжау үшін. Үшіншіден, ағымдағы жүйе толық end-to-end шикі сигналды модельдеудің орнына әзірленген HRV белгілеріне сүйенеді, бұл толқын пішіні деңгейіндегі күрделірек ақпаратты қамтуды шектеуі мүмкін. Сонымен қатар, тіл моделі жасаған пайымдаулардың сапасы мен дәйектілігі мәтіндік көріністерге өзгермелілікті енгізуі мүмкін. Болашақ жұмыстар бұл тәсілдерді тәуелсіз когорталарда бағалауы, end-to-end шикі ЭКГ көріністерін тексеруі және уақыт қатарлары мен клиникалық көріністер арасындағы толықтырушы сәйкестікті зерттеу әдістерін іздеуі керек.&lt;/p&gt;\n&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;p&gt;Біз амбулаторлық ЭКГ деректерін әртүрлі клиникалық ақпарат формаларымен біріктіріп, төрт жылдық кезеңге арналған кенеттен болатын жүрек өлімі (КЖӨ) мен жүрек жеткіліксіздігінен болатын өлімді (ЖЖӨ) болжауға арналған мультимодальды жасанды интеллект жүйесін ұсынамыз. Мультимодальды интеграция барлық модальдіктер үшін біркелкі емес, таңдалған нәтиже мен ұсыну комбинациялары үшін тиімдірек болды. КЖӨ үшін ЭКГ мен детерминирленген мәтін комбинациясы ең жоғары AU-&lt;a href=\"concepts/roc-krivaya.html\"&gt;ROC&lt;/a&gt; көрсеткішіне қол жеткізді, ал ЭКГ мен кестелік клиникалық белгілер комбинациясы ең жоғары PR-AUC көрсеткішін көрсетті; ЖЖӨ үшін унимодальды кестелік модель ең мықты болып қалды. ЭКГ мен толық LLM мәтінінің комбинациясы тек LLM мәтініне қарағанда жақсы нәтиже берді, бірақ унимодальды ЭКГ моделінен асып түсе алмады. Детерминирленген және кестелік ұсыныстар әдетте толық LLM арқылы жасалған бағалауға қарағанда көбірек болжамды ақпаратты сақтап қалды, ал пациент-мәтін ауыстырылымдары толық LLM мәтіні ішінде пациентке тән хат алмасуды сақтаудан келетін өлшенетін пайданың шектеулі екенін көрсетті. Назар аудару, атрибуция және токендерді маскалау талдаулары модельдің мінез-құлқы туралы қосымша мәліметтер берді және түсініктемелердің модель таңдауы мен деректердегі өзгерістерге сезімталдығын атап өтті. Жалпы алғанда, бұл нәтижелер мультимодальды жүрек нәтижелерін болжауда модальдікті таңдау мен клиникалық ақпаратты ұсынудың маңыздылығын көрсетеді және сыртқы когорталарда ұсынуға негізделген мультимодальды тәсілдерді одан әрі бағалауды қолдайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мультимодальды интеграция әрқашан унимодальды модельдерден басым емес; детерминирленген және кестелік деректер LLM мәтіндеріне қарағанда көбірек болжамды құндылыққа ие.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AU-ROC және PR-AUC — модельдің жіктеу сапасын бағалайтын метрикалар; олар модельдің сыныптарды ажырату қабілеті мен сирек кездесетін оқиғаларды анықтау дәлдігін өлшейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу болжамды модель (TRIPOD+AI) болып табылады; нәтижелер клиникалық маңыздылығын растау үшін тәуелсіз когорталарда сыртқы тексеруді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Кесте 1.&lt;/strong&gt; Тәуекелді бағалау нұсқаулығы&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Параметр&lt;/th&gt;\n&lt;th&gt;Шығыс пішімі&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;SCD тәуекелі (4 жыл)&lt;/td&gt;\n&lt;td&gt;SCD_RISK: &amp;lt;Low/Moderate/High&amp;gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;SCD негіздемесі&lt;/td&gt;\n&lt;td&gt;SCD_RATIONALE: &amp;lt;қысқаша негіздеме&amp;gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;PFD тәуекелі (4 жыл)&lt;/td&gt;\n&lt;td&gt;PFD_RISK: &amp;lt;Low/Moderate/High&amp;gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;PFD негіздемесі&lt;/td&gt;\n&lt;td&gt;PFD_RATIONALE: &amp;lt;қысқаша негіздеме&amp;gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;SCD — кенеттен болатын жүрек өлімі; PFD — жүрек жеткіліксіздігінен болатын өлім.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 2.&lt;/strong&gt; Жалпы бағалау ережелері&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Ереже&lt;/th&gt;\n&lt;th&gt;Сипаттама&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Бастапқы деректер&lt;/td&gt;\n&lt;td&gt;Тек ұсынылған 24 сағаттық Холтер мониторингі деректерін пайдалану&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Шектеулер&lt;/td&gt;\n&lt;td&gt;Жоқ ақпаратты ойдан шығармау және болжамау&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Тыйым салынады&lt;/td&gt;\n&lt;td&gt;Пациенттің нәтижесін, бақылау ұзақтығын, өлім себебін немесе кейінгі оқиғаларды пайдалану&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Пішім&lt;/td&gt;\n&lt;td&gt;Шығыс пішімін қатаң сақтау, емдеу бойынша ұсыныстар қоспау&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"33-kestelik-klinikalykh-belgiler-modelderi\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#33-kestelik-klinikalykh-belgiler-modelderi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.3. Кестелік клиникалық белгілер модельдері&lt;/span&gt;&lt;/a&gt;3.3. Кестелік клиникалық белгілер модельдері&lt;/h4&gt;\n&lt;p&gt;Құрылымдалған клиникалық айнымалыларды мәтінге түрлендіру олардың болжамдық құндылығын сақтайтынын немесе жақсартатынын бағалау үшін сол айнымалылар тікелей кестелік түрде модельденді. Бастапқы кестелік шарт ЭКГ ақпаратынсыз LLM промпттарын құру үшін қолданылған базалық демографиялық деректерді, клиникалық сипаттамаларды, медициналық тарихты, зертханалық өлшемдерді, жүрек функциясын және дәрі-дәрмектерді қамтыды. Екінші шарт ЭКГ-ны қамтитын промптта қолданылған бес Холтер-ЭКГ әсерін қосымша қамтыды: қарыншалық экстрасистолия, қарыншалық тахикардия, тұрақты емес қарыншалық тахикардия, пароксизмальды жүрекше үсті тахиаритмиясы және брадикардия. ЭКГ-ны қамтитын бұл кестелік шарт тек &lt;a href=\"concepts/ablyatsiya.html\"&gt;абляция&lt;/a&gt; ретінде бағаланды және негізгі кестелік талдауларда қолданылмады. Жоғалған деректерді толтыру үшін үздіксіз айнымалылар олардың медианалық мәндерімен ауыстырылды және жетіспеушілік индикаторларымен толықтырылды, ал жоғалған бинарлық және категориялық мәндер бөлек категория ретінде ұсынылды. Үздіксіз айнымалылар кейіннен орташа мәні нөлге және стандартты ауытқуы бірге тең болатындай етіп стандартталды, ал бинарлық және категориялық айнымалылар one-hot кодтаудан өтті. Барлық алдын ала өңдеу параметрлері тек модельді сәйкестендіру үшін қолжетімді деректерді пайдалана отырып бағаланды және бағалау кезінде өзгеріссіз қолданылды. Сонымен қатар, екі дәстүрлі кестелік модельдер тобы бағаланды: L2-пенализацияланған логистикалық регрессия және гистограммаға негізделген градиенттік бустинг. SCD және PFD болжамы үшін бөлек модельдер құрылды.&lt;/p&gt;\n&lt;h4 id=\"341-ekg,-maetin-zhaene-kestelik-koerinisterdi-dajyndau\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#341-ekg,-maetin-zhaene-kestelik-koerinisterdi-dajyndau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.4.1. ЭКГ, мәтін және кестелік көріністерді дайындау&lt;/span&gt;&lt;/a&gt;3.4.1. ЭКГ, мәтін және кестелік көріністерді дайындау&lt;/h4&gt;\n&lt;p&gt;&lt;span class=\"yfm-latex\" data-content=\"%5Cbeth_0%2C%20%5Cbeth_8\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; және &lt;span class=\"yfm-latex\" data-content=\"%5Cbeth.\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ЭКГ, мәтін және кестелік көріністердің өлшемдерін белгілесін. ЭКГ модальділігі үшін оқытылған MIL–TCN энкодері мұздатылды және әрбір пациент үшін назар аударумен біріктірілген (attention-pooled) шығыстан алынған пациент деңгейіндегі &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon_%7BECG%7D%20%5Cin%20%5Cmathbb%7BR%7D%5E%7B%5Cbeth_0%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; көрінісі бөліп алынды. Мәтіндік модальділік үшін &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon_%7BTXT%7D%20%5Cin%20%5Cmathbb%7BR%7D%5E%7B%5Cbeth_8%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; эмбеддингтері мұздатылған биомедициналық мәтіндік энкодерден алынды. Оларға LLM арқылы жасалған тәуекел бағалары мен детерминистік клиникалық мәтін эмбеддингтері кірді. Кестелік модальділік үшін &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon_%7BTAB%7D%20%5Cin%20%5Cmathbb%7BR%7D%5E%7B%5Cbeth.%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; жоғарыда сипатталғандай, стандартталған үздіксіз айнымалыларды, үздіксіз айнымалылардың жетіспеушілік индикаторларын және one-hot кодталған категориялық айнымалыларды қамтитын алдын ала өңделген клиникалық белгілер векторы болды. Кестелік көрініс оқытылған кестелік классификатордан бөліп алынбай, тікелей қолданылды. Сонымен қатар, ЭКГ көрінісі LLM жасаған мәтінмен, детерминистік мәтінмен және кестелік клиникалық көріністермен бөлек жұптастырылды. Бұл модальділікке тән көріністер төменде сипатталған мультимодальды синтез модельдері үшін кіріс деректері ретінде қызмет етті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;One-hot кодтау — категориялық деректерді бинарлық векторларға түрлендіру әдісі, мұнда тек бір элемент 1-ге, қалғандары 0-ге тең болады, бұл машиналық оқыту модельдеріне сандық емес белгілермен тиімді жұмыс істеуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"342-multimodaldy-sintez-strategiyalary\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#342-multimodaldy-sintez-strategiyalary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.4.2. Мультимодальды синтез стратегиялары&lt;/span&gt;&lt;/a&gt;3.4.2. Мультимодальды синтез стратегиялары&lt;/h4&gt;\n&lt;p&gt;&lt;span class=\"yfm-latex\" data-content=\"%5Cvartheta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; пациенті үшін ЭКГ көрінісі &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon_%7BECG%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; және мәтіндік көрініс &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon_%7BTXT%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; берілген жағдайда, біз біріктірілген &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon_%7B%0Aabla%20%5Cvartheta%7D%20%D0%BA%D3%A9%D1%80%D1%96%D0%BD%D1%96%D1%81%D1%96%D0%BD%20%D3%A9%D0%BD%D0%B4%D1%96%D1%80%D1%83%20%D2%AF%D1%88%D1%96%D0%BD%20%D0%B1%D0%B5%D1%81%20%D0%BC%D1%83%D0%BB%D1%8C%D1%82%D0%B8%D0%BC%D0%BE%D0%B4%D0%B0%D0%BB%D1%8C%D0%B4%D1%8B%20%D1%81%D0%B8%D0%BD%D1%82%D0%B5%D0%B7%20%D1%81%D1%82%D1%80%D0%B0%D1%82%D0%B5%D0%B3%D0%B8%D1%8F%D1%81%D1%8B%D0%BD%20%D0%B1%D0%B0%D2%93%D0%B0%D0%BB%D0%B0%D0%B4%D1%8B%D2%9B.%20%D0%A1%D0%BE%D0%BB%20%D1%81%D1%82%D1%80%D0%B0%D1%82%D0%B5%D0%B3%D0%B8%D1%8F%D0%BB%D0%B0%D1%80%20%5Cvarepsilon_%7BTXT%7D-%D1%82%D1%96%20%D1%81%D3%99%D0%B9%D0%BA%D0%B5%D1%81%20%D0%B0%D0%BB%D0%B4%D1%8B%D0%BD%20%D0%B0%D0%BB%D0%B0%20%D3%A9%D2%A3%D0%B4%D0%B5%D0%BB%D0%B3%D0%B5%D0%BD%20%D0%
