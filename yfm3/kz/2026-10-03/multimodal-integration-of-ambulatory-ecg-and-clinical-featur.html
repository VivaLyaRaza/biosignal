D1%96%D0%BA%20%D0%BA%D3%A9%D0%B1%D0%B5%D0%B9%D1%82%D1%83%D0%B4%D1%96%20%D0%B1%D1%96%D0%BB%D0%B4%D1%96%D1%80%D0%B5%D0%B4%D1%96.%20%D0%A1%D0%B0%D0%BB%D0%BC%D0%B0%D2%9B%D1%82%D1%8B%20%D2%9B%D0%BE%D1%81%D1%8B%D0%BD%D0%B4%D1%8B%20(WS)%20%D0%BF%D1%80%D0%BE%D0%B5%D0%BA%D1%86%D0%B8%D1%8F%D0%BB%D0%B0%D0%BD%D2%93%D0%B0%D0%BD%20%D0%BA%D3%A9%D1%80%D1%96%D0%BD%D1%96%D1%81%D1%82%D0%B5%D1%80%D0%B4%D1%96%20%D0%B1%D1%96%D1%80%20%D2%93%D0%B0%D0%BD%D0%B0%20%D0%B6%D0%B0%D2%BB%D0%B0%D0%BD%D0%B4%D1%8B%D2%9B%20%D0%BE%D2%9B%D1%8B%D1%82%D1%8B%D0%BB%D2%93%D0%B0%D0%BD%20%D2%9B%D0%BE%D1%81%D0%BF%D0%B0%20%D1%81%D0%B0%D0%BB%D0%BC%D0%B0%D2%93%D1%8B%D0%BD%20%D0%BF%D0%B0%D0%B9%D0%B4%D0%B0%D0%BB%D0%B0%D0%BD%D1%8B%D0%BF%20%D0%B1%D1%96%D1%80%D1%96%D0%BA%D1%82%D1%96%D1%80%D0%B5%D0%B4%D1%96%3A%20%5Cvarepsilon_%7B%0Aabla%20%5Cvartheta%7D%20%3D%20%5Clambda%20%5Cbeth_%7BECG%7D%20%2B%20(1%20-%20%5Clambda)%20%5Cbeth_%7BTXT%7D%2C%20%5Clambda%20%3D%20%5Csigma(s)%2C%20(12)%20%D0%BC%D2%B1%D0%BD%D0%B4%D0%B0%20s%20%5Cin%20%5Cmathbb%7BR%7D%20%D0%B1%D0%B0%D1%80%D0%BB%D1%8B%D2%9B%20%D0%BF%D0%B0%D1%86%D0%B8%D0%B5%D0%BD%D1%82%D1%82%D0%B5%D1%80%20%D2%AF%D1%88%D1%96%D0%BD%20%D0%BE%D1%80%D1%82%D0%B0%D2%9B%20%D0%BE%D2%9B%D1%8B%D1%82%D1%8B%D0%BB%D2%93%D0%B0%D0%BD%20%D1%81%D0%BA%D0%B0%D0%BB%D1%8F%D1%80%D0%BB%D1%8B%D2%9B%20%D0%BF%D0%B0%D1%80%D0%B0%D0%BC%D0%B5%D1%82%D1%80%20%D0%B1%D0%BE%D0%BB%D1%8B%D0%BF%20%D1%82%D0%B0%D0%B1%D1%8B%D0%BB%D0%B0%D0%B4%D1%8B.%20%D0%91%D0%B0%D1%80%D0%BB%D1%8B%D2%9B%20%D0%B6%D0%B0%D2%93%D0%B4%D0%B0%D0%B9%D0%B4%D0%B0%20%5Cvarepsilon_%7B%0Aabla%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; SCD және PFD үшін бөлек тапсырмаға тән болжам тармақтарына жіберілді. ЭКГ+LLM мәтіндік мультимодальды модельдерін түсіндіру үшін ЭКГ маңыздылығы MIL назар аудару салмақтарын пайдаланып, ал мәтін маңыздылығы градиентке негізделген токен салиенттілігін пайдаланып бағаланды. Әрбір токен үшін салиенттік оның эмбеддингі мен болжанған SCD немесе PFD ықтималдығының осы эмбеддингке қатысты градиенті арасындағы элементтік көбейтіндінің Евклид нормасы ретінде есептелді. Токен балдары визуализация үшін LLM жасаған клиникалық мәтінге қайта карталанды және сондықтан ішкі LLaMA генераторының назар аудару салмақтарын емес, сәйкестендірілген мультимодальды модель ішіндегі мәтіндік жолды көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"351-shyghyn-funkciyalary\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#351-shyghyn-funkciyalary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.5.1. Шығын функциялары&lt;/span&gt;&lt;/a&gt;3.5.1. Шығын функциялары&lt;/h4&gt;\n&lt;p&gt;ЭКГ, мәтіндік және мультимодальды синтез желілері SCD және PFD-ні бірлесіп болжау үшін көп тапсырмалы мақсатты пайдаланып оқытылды. Әрбір тапсырма үшін біз салмақты бинарлық кросс-энтропия шығын функциясын қолдандық, мұнда оң сынып салмағы оқыту деректеріндегі теріс жағдайлардың оң жағдайларға қатынасы ретінде белгіленді:&lt;/p&gt;\n&lt;p&gt;$w_t = \\frac{\\rho(t)&lt;em&gt;{neg}}{\\rho(t)&lt;/em&gt;{pos}}, t \\in {SCD, PFD}. (13)&lt;/p&gt;\n&lt;p&gt;PFD-мен ауыратын пациенттер SCD шығынынан алынып тасталды және SCD-мен ауыратын пациенттер PFD шығынынан алынып тасталды, осылайша бәсекелес жүрек өлімі оқиғалары теріс нәтижелер ретінде қаралмады. Жүрек өлімі болмаған пациенттер екі тапсырма үшін де теріс жағдайлар ретінде үлес қосты. Жалпы мақсат екі тапсырмаға тән шығындардың қосындысы болды: &lt;span class=\"yfm-latex\" data-content=\"%5Cmathcal%7BL%7D%20%3D%20%5Cmathcal%7BL%7D_%7BSCD%7D%20%2B%20%5Cmathcal%7BL%7D_%7BPFD%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. (14) Дәстүрлі кестелік модельдер SCD және PFD үшін сол тапсырмаға тән сыныпты салмақтау тәсілі және бәсекелес жүрек өлімі нәтижесін алып тастау арқылы бөлек сәйкестендірілді.&lt;/p&gt;\n&lt;h4 id=\"352-llm-zhaene-biomedicinalykh-maetindik-kodtaghyshtar-konfiguraciyalary\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#352-llm-zhaene-biomedicinalykh-maetindik-kodtaghyshtar-konfiguraciyalary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.5.2. LLM және биомедициналық мәтіндік кодтағыштар конфигурациялары&lt;/span&gt;&lt;/a&gt;3.5.2. LLM және биомедициналық мәтіндік кодтағыштар конфигурациялары&lt;/h4&gt;\n&lt;p&gt;Клиникалық мәтіндік нәтижелер Hugging Face Transformers v4.44.2 көмегімен нұсқаулықтар бойынша бапталған екі модельмен генерацияланды: LLaMA-3.1-8B-Instruct және LLaMA-3.2-3B-Instruct. LLaMA модельдері кванттаусыз 16-биттік өзгермелі нүктелі дәлдікпен жүктелді. Генерация кезінде do_sample=False, ең көбі 256 жаңа токен, 1,1 қайталану айыппұлы, төрттік batch size және 42 генерация seed-і бар детерминирленген greedy decoding қолданылды. Sampling өшірілгендіктен, Temperature, top-p және top-k параметрлері қолданылмады. Генерация төрт NVIDIA GeForce RTX 2080 Ti графикалық процессорының көмегімен теңдестірілген құрылғы орналасуымен орындалды (аппараттық сипаттамалар үшін 3.5.3-бөлімді қараңыз). Барлық LLM инференсі жүктелген модель салмақтарын қолдану арқылы жергілікті деңгейде орындалды; пациент деңгейіндегі деректер сыртқы коммерциялық LLM қызметтеріне жіберілмеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Инференс — бұл оқытылған модельді жаңа деректер негізінде болжам жасау немесе мәтін генерациялау үшін қолдану процесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Генерацияланған және детерминирленген мәтіндік кіріс деректері мұздатылған BioBERT немесе ClinicalBERT биомедициналық мәтіндік кодтағыштары арқылы кодталды. Кодтағыштар когорта мен оқиғалар санына қатысты оқытылатын параметрлер санын шектеу және ішкі модель таңдау кезінде шамадан тыс бейімделу (&lt;a href=\"concepts/overfitting.html\"&gt;overfitting&lt;/a&gt;) қаупін азайту үшін мұздатылған күйде сақталды. Бұл архитектура салыстыруды биомедициналық мәтіндік кодтағыштың нақты нәтижеге бейімделуінен гөрі, клиникалық мәтіндік көріністерден туындайтын айырмашылықтарға шоғырландыруға мүмкіндік берді. Мәтін ең көбі 512 токен ұзындығымен өңделді. Осы ұзындықтан асатын кіріс деректері үшін 64 токендік қадаммен (stride) бір-бірінің үстіне шығатын 512 токендік бөліктер бөлек кодталды және 768 өлшемді бірыңғай мәтіндік эмбеддинг алу үшін [CLS] токендерінің жасырын көріністері бөліктер бойынша орташаланды. Екі LLaMA генераторы және екі биомедициналық мәтіндік кодтағыш төрт «LLaMA–кодтағыш» комбинациясын анықтады. Тиісті модельдердің хэштері B қосымшасындағы B.1-кестеде келтірілген.&lt;/p&gt;\n&lt;h4 id=\"353-okhytu-hattamasy,-kross-validaciya-zhaene-model-tangdau\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#353-okhytu-hattamasy,-kross-validaciya-zhaene-model-tangdau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.5.3. Оқыту хаттамасы, кросс-валидация және модель таңдау&lt;/span&gt;&lt;/a&gt;3.5.3. Оқыту хаттамасы, кросс-валидация және модель таңдау&lt;/h4&gt;\n&lt;p&gt;Барлық эксперименттер Ubuntu операциялық жүйесінде жұмыс істейтін және NVIDIA GeForce RTX 2080 Ti графикалық процессорларымен жабдықталған Linux серверінде өткізілді. Нейрондық модельдер PyTorch v2.5.1 және CUDA 12.4 көмегімен іске асырылды. Модельдер пациент деңгейіндегі ішкі кросс-валидацияны қолдану арқылы әзірленді және бағаланды, мұнда бес өзара айрықша сыртқы фолд пен төрт ішкі фолд және 42 базалық кездейсоқ seed қолданылды. Фолдтар төрт жылдық нәтижелердің өзара айрықша санаттары бойынша стратификацияланды: жүрек өлімінің болмауы, SCD және PFD. Белгілі бір пациенттің барлық ЭКГ сегменттері, мәтіндік көріністері және кестелік клиникалық көріністері бір фолдқа тағайындалды.&lt;/p&gt;\n&lt;p&gt;Әрбір сыртқы оқыту фолды ішінде барлық модель әзірлеу кезеңдері, соның ішінде алдын ала өңдеу, белгілерді масштабтау, сыныптарды салмақтау, гиперпараметрлер мен модель конфигурациясын таңдау, ерте тоқтату, біріктіру стратегиясын таңдау, ықтималдықты калибрлеу және классификация шегін таңдау үшін төрт бөлімді ішкі кросс-валидация қолданылды. Модель таңдалғаннан кейін, таңдалған конфигурация толық сыртқы оқыту фолды көмегімен бейімделді және тиісті сыртқы тест фолдында бір рет бағаланды. Сыртқы тест фолды модель әзірлеу кезінде көрінбейтін күйде қалды және оның нәтижелері алдын ала өңдеу, баптау, калибрлеу, шек таңдау немесе модель таңдау үшін қолданылмады. Айнымалылардың шығу тегі мен гиперпараметрлерді іздеу кеңістігі туралы мәліметтер сәйкесінше C және D қосымшаларында келтірілген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ішкі кросс-валидация — модель параметрлерін таңдау үшін ішкі цикл, ал модель сапасын бағалау үшін сыртқы цикл қолданылатын бағалау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ерте тоқтату параметрлері барлық конфигурациялар үшін бекітілді және баптауға болатын гиперпараметрлер ретінде қаралмады. ЭКГ модельдері ең көбі 30 дәуір (epoch), кемінде бес дәуір және жеті дәуірлік шыдамдылықпен (patience) оқытылды. Мәтіндік классификаторлар мен мультимодальды біріктіру модельдері ең көбі 100 дәуір, кемінде 10 дәуір және 15 дәуірлік шыдамдылықпен оқытылды. SCD және PFD тапсырмалары бойынша ең жоғары орташа валидациялық AUROC мәніне ие бақылау нүктесі (checkpoint) сақталды. Әрбір конфигурация үшін SCD және PFD AUROC мәндерін есептемес бұрын ішкі валидациялық фолдтардан алынған болжамдар біріктірілді. Модель таңдау осы екі AUROC мәнінің орташасына негізделді, мұнда соңғы нүктелер тең салмаққа ие болды. Ең жоғары көрсеткіші бар конфигурациядан 0,005-тен аз абсолютті AUROC айырмашылығы бар конфигурациялар модель күрделілігі, содан кейін орташа PR-AUC бойынша салыстырылды. Нейрондық модельдер үшін күрделілік оқытылатын параметрлер санымен анықталды. Кестелік модельдер үшін алдын ала белгіленген тәртіп градиенттік бустингке қарағанда реттеуі бар логистикалық регрессияны таңдады және әрбір модель тобы ішінде қарапайым, күштірек реттелген конфигурацияларды қолайлы деп тапты.&lt;/p&gt;\n&lt;h4 id=\"4-eksperimentter-41-derekter-zhiyntyghy-zhaene-pacientter-kogortasyn-tangdau\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#4-eksperimentter-41-derekter-zhiyntyghy-zhaene-pacientter-kogortasyn-tangdau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Эксперименттер 4.1. Деректер жиынтығы және пациенттер когортасын таңдау&lt;/span&gt;&lt;/a&gt;4. Эксперименттер 4.1. Деректер жиынтығы және пациенттер когортасын таңдау&lt;/h4&gt;\n&lt;p&gt;Эксперименттер созылмалы жүрек жеткіліксіздігі бар пациенттердің проспективті көп орталықты когортасы болып табылатын MUSIC (MUerte S’ubita en Insuﬁciencia Cardiaca) көпшілікке қолжетімді деректер жиынтығын пайдалана отырып жүргізілді. Деректер жиынтығы демографиялық сипаттамаларды, медициналық тарихты, зертханалық өлшемдерді, дәрі-дәрмектерді және жүрек функциясының көрсеткіштерін қоса алғанда, деидентификацияланған клиникалық ақпаратты қамтиды. Бұл зерттеуде тек ашық деректер жиынтығында қолжетімді деидентификацияланған айнымалылар пайдаланылды; пациенттердің тікелей идентификаторлары LLM промпттарына қосылмады. Зерттеуге 2003 жылдың сәуірі мен 2004 жылдың желтоқсаны аралығында сегіз испан университеттік ауруханасынан 992 пациент қатысты, бақылаудың медианалық кезеңі 44 айды құрады. Амбулаторлық ЭКГ деректері SpiderView тіркеуіштері (&lt;a href=\"concepts/early-life-adversity.html\"&gt;ELA&lt;/a&gt; Medical, Sorin Group, Париж, Франция) көмегімен 200 Гц жиілікте және 1 мкВ амплитудалық ажыратымдылықта алынған екі немесе үш ортогоналды жетектеу (X, Y және Z) арқылы жиналды. Сигналды талдау үшін тек Y жетектеуі пайдаланылды. Бұл жетектеу жоғарғы-төменгі электрлік осьті білдіреді және стандартты 12-арналы ЭКГ-ның II жетектеуіне ұқсас бағытқа ие, бұл оны NeuroKit2 көмегімен жүрек соғысын анықтау және жүрек ырғағының өзгермелілігін талдау үшін қолайлы етеді. Бастапқы 24 сағаттық Холтер жазбасы индекс уақыты ретінде пайдаланылды және нәтижелер төрт жылдық болжам көкжиегі бойынша анықталды. Когортаны таңдау 2-суретте жинақталған, тиісті бастапқы сипаттамалар 1-кестеде, ал ЭКГ әсерлері 2-кестеде келтірілген. Тіркелген 992 пациенттің ішінен біз Холтер жазбасы жоқ 56 адамды; жазылған нәтижесі алдын ала белгіленген жүрек өлімінің болмауы, кенеттен болатын жүрек өлімі (КЖӨ) және үдемелі жүрек жеткіліксіздігі (ҮЖЖ) санаттарына жатпайтын 57 адамды; бұрын имплантацияланған жүрек құрылғысы бар 121 адамды; жүрек трансплантациясына байланысты зерттеуден шыққан 12 адамды және төрт жылдық нәтижесін анықтау мүмкін болмаған 16 адамды алып тастадық. ҮЖЖ-ні білдіретін екі деректер жиынтығының коды бір санатқа біріктірілді және КЖӨ мен ҮЖЖ болжам көкжиегінде өзара ерекшеленді. Қорытынды когорта үш өзара ерекшеленетін төрт жылдық нәтиже белгісі бар 730 пациентті қамтыды: 577-сі жүрек өлімінсіз, 71-і КЖӨ-мен және 82-сі ҮЖЖ-мен. Пациент деңгейіндегі ішкі кросс-валидация әрқайсысы 146 пациенттен тұратын бес өзара ерекшеленетін сыртқы қабатты пайдаланды, бұл әр итерацияда модельді әзірлеу үшін 584 пациентті және бөлек бағалау үшін 146 пациентті берді. Сыртқы қабаттар үш нәтиже санаты бойынша стратификацияланды және әрбір сыртқы оқыту жиынтығы модельді әзірлеу және таңдау үшін төрт бөлімді ішкі кросс-валидациядан өтті. Жеке бинарлық классификация тапсырмалары үшін КЖӨ тобы жүрек өлімі болмаған топпен салыстырылды, ал ҮЖЖ бар пациенттер алынып тасталды (n = 648).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ішкі кросс-валидация (nested cross-validation) — бұл модельді бағалау әдісі, мұнда деректер сыртқы блоктарға (тестілеу үшін) және ішкі блоктарға (параметрлерді баптау үшін) бөлінеді, бұл шамадан тыс бейімделудің (overfitting) алдын алуға және болжам дәлдігін объективті бағалауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"daeri-daermekpen-emdeu\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#daeri-daermekpen-emdeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дәрі-дәрмекпен емдеу&lt;/span&gt;&lt;/a&gt;Дәрі-дәрмекпен емдеу&lt;/h4&gt;\n&lt;p&gt;Кальций арналарының блокаторлары 112 (15,3) 87 (15,1) 15 (21,1) 10 (12,2). Қант диабетін емдеуге арналған препараттар 221 (30,3) 160 (27,7) 26 (36,6) 35 (42,7). Амиодарон 130 (17,8) 93 (16,1) 18 (25,4) 19 (23,2). Ангиотензин II рецепторларының блокаторлары 131 (17,9) 106 (18,4) 10 (14,1) 15 (18,3). Антикоагулянттар/антитромботикалық құралдар 610 (83,6) 487 (84,4) 59 (83,1) 64 (78,0). Бета-блокаторлар 501 (68,6) 417 (72,3) 45 (63,4) 39 (47,6). Дигоксин 236 (32,3) 173 (30,0) 27 (38,0) 36 (43,9). Ілмекті диуретиктер 512 (70,1) 392 (67,9) 53 (74,6) 67 (81,7). Спиронолактон 260 (35,6) 188 (32,6) 35 (49,3) 37 (45,1). Статиндер 324 (44,4) 256 (44,4) 35 (49,3) 33 (40,2). Гидралазин 20 (2,7) 14 (2,4) 3 (4,2) 3 (3,7). АӨФ тежегіштері 580 (79,5) 476 (82,5) 50 (70,4) 54 (65,9). Нитро-вазодилататорлар 90 (12,3) 64 (11,1) 13 (18,3) 13 (15,9). Мәндер қолжетімді бастапқы бақылауларға негізделген; жетіспейтін мәндер сипаттамалық жиынтықтар үшін импутацияланбаған. Жасы (φ=1), альбумин (φ=1), гамма-глутамилтрансфераза (φ=1), глюкоза (φ=1), гемоглобин (φ=3), HDL (φ=24), калий (φ=1), LDL (φ=24), натрий (φ=1), Pro-BNP (φ=71), ақуыз (φ=1), T3 (φ=273), T4 (φ=86) және тропонин (φ=110) бойынша деректердің жетіспеушілігі орын алды. Басқа барлық сипаттамалар толық болды. Модельді сәйкестендіру үшін үздіксіз айнымалылар жетіспеушілік индикаторы бар сәйкес оқыту фолдының медианасы арқылы импутацияланды, ал жетіспейтін бинарлық және категориялық айнымалылар жеке категория ретінде көрсетілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/imputatsiya.html\"&gt;Импутация&lt;/a&gt; — бұл статистикалық талдау үшін деректер жиынтығының көлемін сақтап қалу мақсатында жетіспейтін мәндерді толтыру әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қорытынды төрт жылдық MUSIC когортасындағы нәтижелер бойынша стратификацияланған Холтер негізіндегі ЭКГ әсерлері. Мәндер n (%) түрінде берілген.&lt;/p&gt;\n&lt;h4 id=\"ekg-aeserleri\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#ekg-aeserleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ЭКГ әсерлері&lt;/span&gt;&lt;/a&gt;ЭКГ әсерлері&lt;/h4&gt;\n&lt;p&gt;Қарыншалық экстрасистолия: Жоқ 19 (2,6) 18 (3,1) 0 (0,0) 1 (1,3); Мономорфты 213 (29,5) 187 (32,7) 11 (15,7) 15 (18,8); Полиморфты 490 (67,9) 367 (64,2) 59 (84,3) 64 (80,0). Қарыншалық тахикардия: Жоқ 460 (63,9) 387 (68,1) 35 (50,0) 38 (46,3); Тұрақты емес ҚТ 260 (36,1) 181 (31,9) 35 (50,0) 44 (53,7). Тұрақты емес қарыншалық тахикардия: Жоқ 523 (71,6) 439 (76,1) 37 (52,1) 47 (57,3); Иә 207 (28,4) 138 (23,9) 34 (47,9) 35 (42,7). Пароксизмальды суправентрикулярлық тахиаритмия: Жоқ 406 (56,2) 332 (58,3) 35 (49,3) 39 (47,6); ТПСВ 168 (23,3) 135 (23,7) 16 (22,5) 17 (20,7); Пароксизмальды ЖФ 4 (0,6) 2 (0,4) 1 (1,4) 1 (1,2); Пароксизмальды жүрекшелердің дірілі 1 (0,1) 0 (0,0) 1 (1,4) 0 (0,0); Созылмалы ЖФ салдарынан қолданылмайды 143 (19,8) 100 (17,6) 18 (25,4) 25 (30,5). Брадикардия: Жоқ 532 (92,4) 435 (92,8) 46 (88,5) 51 (92,7); Синус түйінінің дисфункциясы 17 (3,0) 13 (2,8) 3 (5,8) 1 (1,8); Бірінші дәрежелі АВ блокадасы 8 (1,4) 5 (1,1) 1 (1,9) 2 (3,6); Екінші дәрежелі АВ блокадасы, I тип 9 (1,6) 8 (1,7) 0 (0,0) 1 (1,8); Екінші дәрежелі АВ блокадасы, II тип 7 (1,2) 6 (1,3) 1 (1,9) 0 (0,0); Үшінші дәрежелі АВ блокадасы 1 (0,2) 0 (0,0) 1 (1,9) 0 (0,0); Пароксизмальды АВ блокадасы 2 (0,3) 2 (0,4) 0 (0,0) 0 (0,0).&lt;/p&gt;\n&lt;p&gt;Кардиалды өлім болмаған топпен салыстырғанда, SCD (кенеттен болатын кардиалды өлім) бар пациенттер алынып тасталды (φ = 659). Когортадан шығару және қорытынды нүктелер бойынша талдау популяциялары туралы толық ақпарат E қосымшасында берілген.&lt;/p&gt;\n&lt;h4 id=\"42-tiimdilikti-baghalau\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#42-tiimdilikti-baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2. Тиімділікті бағалау&lt;/span&gt;&lt;/a&gt;4.2. Тиімділікті бағалау&lt;/h4&gt;\n&lt;p&gt;Тиімділік біріктірілген сыртқы тест болжамдары арқылы бағаланды. Бес сыртқы фолдтың барлығынан алынған болжамдар SCD және PFD қорытынды нүкте когорталары үшін бөлек біріктірілді және әрбір тиімділік метрикасы сәйкес біріктірілген бөлінген болжамдар жиынтығынан бір рет есептелді. Дискриминация қабілеті қабылдаушының операциялық сипаттамасы қисығы астындағы аудан (AUROC) және дәлдік-қайтару қисығы астындағы аудан (PR-AUC) көмегімен шикі болжам балдарынан бағаланды [50]. Ықтималдықты калибрлеу әрбір сыртқы фолд пен нәтиже ішінде Platt масштабтау көмегімен бөлек жүзеге асырылды, ол сыртқы оқыту когортасынан алынған ішкі фолдтан тыс болжамдарға сәйкестендірілді. Сәйкестендірілген калибрлеу картасы сәйкес сыртқы тест болжамдарына өзгеріссіз қолданылды. Калибрлеу калибрлеу графиктерi, калибрлеу интерсепті, калибрлеу көлбеуі және Brier балы көмегімен бағаланды. Калибрлеу интерсепті мен көлбеуі бақыланатын бинарлық нәтижені калибрленген болжамды ықтималдықтың log-odds мәніне регрессия жасау арқылы бағаланды:&lt;/p&gt;\n&lt;p&gt;ext{logit}( ext{Pr}(y_i = 1)) = \\alpha + \\beta \\cdot  ext{logit}(\\hat{p}_i), (15)&lt;/p&gt;\n&lt;p&gt;мұнда &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7Bp%7D_i\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — i пациент үшін оң нәтиже (яғни SCD немесе PFD) үшін калибрленген болжамды ықтималдық. Brier балы $ ext{Brier} = \\frac{1}{n} \\sum_{i=1}^{n} (y_i - \\hat{p}_i)^2$ ретінде есептелді. (16)&lt;/p&gt;\n&lt;p&gt;Шекті бағалау үшін әрбір сыртқы фолд пен қорытынды нүкте үшін тек калибрленген ішкі фолдтан тыс болжамдарды пайдалана отырып, Youden статистикасын максималдау арқылы классификация шегі таңдалды. Байланысты мәндер жоғарырақ сезімталдыққа ие шекті, содан кейін төменірек шекті таңдау арқылы шешілді. Таңдалған шек сәйкес сыртқы тест болжамдарына өзгеріссіз қолданылды. TP, TN, FP және FN сәйкесінше шынайы оң, шынайы теріс, қате оң және қате теріс нәтижелер санын білдірсін. Келесі шекті метрикалар есептелді:&lt;/p&gt;\n&lt;p&gt;ext{Дәлдік (Accuracy)} = \\frac{TP + TN}{TP + TN + FP + FN}, (17)&lt;/p&gt;\n&lt;p&gt;ext{Сезімталдық (&lt;a href=\"concepts/recall.html\"&gt;Recall&lt;/a&gt;)} = \\frac{TP}{TP + FN}, (18)&lt;/p&gt;\n&lt;p&gt;ext{Оң болжамдық мән (&lt;a href=\"concepts/ppv.html\"&gt;PPV&lt;/a&gt;/Precision)} = \\frac{TP}{TP + FP}, (20)&lt;/p&gt;\n&lt;p&gt;ext{F1 көрсеткіші (F1 score)} = \\frac{2TP}{2TP + FP + FN}. (22)&lt;/p&gt;\n&lt;p&gt;Белгісіздік 5000 пациент деңгейіндегі бутстреп репликациялары көмегімен сандық бағаланды, олардан дискриминация, калибрлеу және шекті метрикалар үшін 95% сенімділік интервалдары есептелді. Модельдер арасындағы салыстырулар жұптастырылған бутстреп ресемплинг көмегімен жүзеге асырылды, мұнда әрбір репликацияда екі модель үшін де бірдей ресемплинг жасалған пациенттер пайдаланылды. Holm процедурасы әрбір алдын ала белгіленген салыстыру отбасы ішінде көптеген салыстырулар үшін түзету енгізуде қолданылды. 0,05-тен кіші p-мәні статистикалық тұрғыдан маңызды деп саналды. Эксплоративті шешімдер қисығын талдау фолдқа тән калибрленген сыртқы тест ықтималдықтары көмегімен жүзеге асырылды [51]. p_t қауіп шегінде таза пайда $ ext{NetBenefit} = \\frac{TP(p_t)}{n} - \\frac{FP(p_t)}{n} \\cdot \\frac{p_t}{1 - p_t}$ ретінде есептелді. (23)&lt;/p&gt;\n&lt;p&gt;Модельдің таза пайдасы 2%-дан 25%-ға дейінгі шектер бойынша «барлығын емдеу» және «ешкімді емдемеу» стратегияларымен пациент деңгейіндегі бутстреп белгісіздігімен салыстырылды. Бұл эксплоративті диапазон бақыланатын оқиғалардың таралуын және қауіпке қатысты кең толеранттылықты қамтыды; алайда, болжамды төрт жылдық SCD немесе PFD қаупі үшін ешқандай араласуға тән шекті диапазон клиникалық тұрғыдан расталмаған [52, 53]. Осыған сәйкес, шешімдер қисықтары модельдің мінез-құлқын салыстыру үшін пайдаланылды және орнатылған клиникалық пайдалылық дәлелі ретінде түсіндірілмеді.&lt;/p&gt;\n&lt;h4 id=\"43-taezhiribe-naetizheleri\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#43-taezhiribe-naetizheleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3. Тәжірибе нәтижелері&lt;/span&gt;&lt;/a&gt;4.3. Тәжірибе нәтижелері&lt;/h4&gt;\n&lt;p&gt;SCD және PFD болжамына арналған унимодальды және мультимодальды модельдердің тиімділік көрсеткіштері сәйкесінше 3-кесте мен 4-кестеде жинақталған. Тиісті қателік матрицалары, AUROC қисықтары, PR-AUC графиктер және шешім қабылдау қисықтары сәйкесінше 3-сурет, 4-сурет, 5-сурет және 6-суретте көрсетілген. Калибрлеу графиктер мен кестелер F қосымшасындағы SN-сурет пен SN-кестеде берілген. Модельдерді егжей-тегжейлі салыстыру F қосымшасындағы SN-кесте мен SN-кестеде көрсетілген. Сандық тиімділікті бағалаудан бөлек, 7-сурет пен 8-суретте SCD және PFD жағдайлары үшін ЭКГ сегменттері мен клиникалық мәтін бойынша мультимодальды модель атрибуциясы визуализацияланған. Атрибуцияның тұрақтылығы модельді қайта баптау, мағынаны сақтайтын кіріс деректерін өзгерту және токендерді маскалау тәжірибелері арқылы бағаланды. Өкілдік және қабаттасу абляциялары LLM жасаған мәтінді, детерминирленген мәтінді, тікелей кестелік клиникалық айнымалыларды және Холтер ЭКГ қорытындыларын 5-кестеде жинақталғандай салыстырды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Атрибуция — бұл жасанды интеллекттің шешім қабылдау процесінде қай деректер (мысалы, ЭКГ бөліктері немесе мәтіндегі сөздер) ең маңызды әсер ететінін анықтау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"431-unimodaldy-modelding-tiimdiligi\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#431-unimodaldy-modelding-tiimdiligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3.1. Унимодальды модельдің тиімділігі&lt;/span&gt;&lt;/a&gt;4.3.1. Унимодальды модельдің тиімділігі&lt;/h4&gt;\n&lt;p&gt;Біз алдымен ЭКГ негізіндегі өкілдікті, LLM жасаған толық клиникалық бағалауды және кестелік клиникалық белгілерді жеке унимодальды кіріс деректері ретінде бағаладық. Детерминирленген мәтіндік өкілдік те бірдей клиникалық айнымалыларды нақты форматта көрсету үшін бақылау ретінде бағаланды. SCD болжамы үшін кестелік модель AUROC және PR-AUC бойынша ең жоғары нүктелік бағаларды көрсетті, одан кейін детерминирленген мәтін, тек ЭКГ және толық LLM мәтіндік модельдері келеді. Толық LLM өкілдігіне қатысты, кестелік өкілдік...&lt;/p&gt;\n&lt;p&gt;[SCD және PFD болжамына арналған унимодальды және мультимодальды модельдерді салыстыру, 95% сенімділік интервалдарымен.]&lt;/p&gt;\n&lt;h4 id=\"koepmodaldy\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#koepmodaldy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Көпмодальды&lt;/span&gt;&lt;/a&gt;Көпмодальды&lt;/h4&gt;\n&lt;p&gt;ECG+fullLLMtext: 0,603; 0,170; 0,109; 0,646; 0,184; 0,537; 0,662; 0,910; 0,274 (0,538–0,666; 0,130–0,240; 0,091–0,128; 0,610–0,681; 0,136–0,236; 0,431–0,643; 0,623–0,699; 0,882–0,936; 0,209–0,338). ECG+deterministictext: 0,675; 0,240; 0,104; 0,677; 0,209; 0,573; 0,692; 0,919; 0,306 (0,612–0,735; 0,172–0,327; 0,086–0,122; 0,640–0,713; 0,156–0,264; 0,463–0,681; 0,653–0,728; 0,892–0,944; 0,236–0,373). ECG+tabularclinicalfeatures: 0,756; 0,353; 0,097; 0,763; 0,292; 0,634; 0,782; 0,938; 0,400 (0,697–0,811; 0,261–0,461; 0,080–0,114; 0,730–0,794; 0,227–0,361; 0,529–0,741; 0,747–0,814; 0,915–0,958; 0,323–0,476).&lt;/p&gt;\n&lt;p&gt;Модель AUROC көрсеткішін 0,165-ке (95% CI, 0,073–0,255; түзетілген p=0,052) және PR-AUC көрсеткішін 0,112-ге (95% CI, 0,041–0,204; түзетілген p=0,032) арттырды. Тиісті AUROC айырмашылығы көптік түзетуден кейін статистикалық тұрғыдан маңызды болмай қалды, ал PR-AUC айырмашылығы маңызды болып қалды. SCD бойынша басқа ешқандай унимодальды салыстыру Holm түзетуінен кейін статистикалық тұрғыдан маңызды болмады. PFD болжамы үшін кестелік модель ең жоғары AUROC және PR-AUC көрсеткіштерін берді, одан кейін детерминистік мәтіндік көрсету келді. Толық LLM көрсетуіне қатысты кестелік модель AUROC бойынша 0,321-ге (95% CI, 0,236–0,404; түзетілген p=0,014) және PR-AUC бойынша 0,229-ға (95% CI, 0,136–0,331; түзетілген p=0,014) жоғары нәтиже көрсетті. Кестелік модель сонымен қатар AUROC бойынша детерминистік мәтіндік көрсетуден 0,111-ге (95% CI, 0,057–0,169; түзетілген p=0,014) асып түсті, дегенмен олардың PR-AUC айырмашылығы статистикалық тұрғыдан маңызды болмады. Детерминистік мәтін сонымен қатар PFD үшін AUROC, PR-AUC және Brier балы бойынша толық LLM мәтінінен асып түсті, барлық үш салыстыру үшін түзетілген p=0,014. Калибрленген Brier балдары SCD модельдері бойынша жалпы алғанда ұқсас болды, ал PFD үшін детерминистік мәтіндік көрсету толық LLM көрсетуіне қарағанда жақсырақ калибрлеу қатесін көрсетті. Жалпы алғанда, тікелей кестелік және детерминистік көрсетулер бірдей клиникалық айнымалыларды толық LLM арқылы жасалған клиникалық бағалауға айналдырудан гөрі көбірек болжамды ақпаратты сақтап қалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AUROC және PR-AUC — классификация сапасын бағалау метрикалары: біріншісі модельдің сыныптарды ажырату қабілетін, екіншісі деректер теңгерімсіз болған кездегі дәлдікті бағалайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"432-multimodaldy-sintez-tiimdiligi\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#432-multimodaldy-sintez-tiimdiligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3.2. Мультимодальды синтез тиімділігі&lt;/span&gt;&lt;/a&gt;4.3.2. Мультимодальды синтез тиімділігі&lt;/h4&gt;\n&lt;p&gt;Әрі қарай, біз ЭКГ көрсетулерінің мәтіндік және кестелік клиникалық деректер көрсетулерімен мультимодальды синтезін бағаладық. Әрбір модальды жұп және сыртқы қабат үшін LLaMA LLM, биомедициналық мәтін кодтаушысы, төменгі мәтін классификаторы және синтез архитектурасы тек тиісті ішкі кросс-валидация деректері арқылы таңдалды. Сәйкесінше, хабарланған мультимодальды тиімділік барлық сыртқы қабаттарға қолданылатын бірыңғай синтез архитектурасын емес, қабатқа тән таңдалған конфигурациялардан алынған біріктірілген сыртқы тест болжамдарын білдіреді. Мұнда «LLMtext» таңдалған LLaMA LLM арқылы құрылған пациент айнымалыларынан жасалған және кейіннен таңдалған биомедициналық мәтін кодтаушысы арқылы кодталған толық клиникалық қауіпті бағалау мәтінін білдіреді.&lt;/p&gt;\n&lt;p&gt;SCD болжамы үшін ECG+fullLLMtext 0,591 AUROC және 0,158 PR-AUC-ке қол жеткізді, бұл унимодальды LLM-text моделіне қарағанда жоғарырақ нүктелік бағаларға ие, бірақ унимодальды ЭКГ моделіне қарағанда төменірек нүктелік бағаларға ие. ECG+deterministictext SCD AUROC бойынша ең жоғары нүктелік бағаға қол жеткізді (0,711), ал ECG+tabularclinicalfeatures ең жоғары PR-AUC нүктелік бағасын (0,248) берді. Алдын ала белгіленген мультимодальды және тиісті унимодальды салыстырулардың ешқайсысы статистикалық тұрғыдан маңызды деп табылған жоқ. PFD болжамы үшін ECG+fullLLMtext 0,603 AUROC және 0,170 PR-AUC-ке қол жеткізді. Оның AUROC көрсеткіші унимодальды full LLM-text моделінен 0,136-ға (95% CI, 0,059–0,215; түзетілген p=0,028) асып түсті, дегенмен тиісті PR-AUC және Brier балы айырмашылықтары статистикалық тұрғыдан маңызды болмады. ECG+tabularclinicalfeatures 0,756 AUROC және 0,353 PR-AUC-ке қол жеткізді. Унимодальды ЭКГ моделіне қатысты бұл AUROC-тың 0,129-ға (95% CI, 0,072–0,186; түзетілген p=0,014) жақсаруына және PR-AUC-тің 0,171-ге (95% CI, 0,085–0,259; түзетілген p=0,041) жақсаруына, сонымен қатар Brier балының 0,010-ға (95% CI, 0,005–0,016; түзетілген p=0,041) азаюына сәйкес келді. Алайда, ECG+tabularclinicalfeatures унимодальды кестелік модельден асып түскен жоқ. ECG+deterministictext тек детерминистік мәтін сияқты жұмыс істеді. Шектік метрикалар ұқсас нәтижені көрсетті. SCD үшін унимодальды ЭКГ моделі ең жоғары дәлдікті, прецизиондықты және спецификалықты сақтап қалды, ал ECG+deterministictext бағаланған модельдер арасында ең жоғары F1 балына қол жеткізді. PFD үшін унимодальды кестелік модель ең жоғары сезімталдықты, NPV және F1 балын сақтап қалды, ал ECG+tabularclinicalfeatures ең жоғары дәлдікке, прецизиондыққа және спецификалыққа қол жеткізді. Жалпы алғанда, мультимодальды синтез барлық модальды жұптар бойынша тиімділікті бірдей жақсартудан гөрі, таңдалған нәтижелер мен клиникалық көрсетулер үшін пайда әкелді.&lt;/p&gt;\n&lt;h4 id=\"433-sheshim-khabyldau-khisykhtaryn-zertteu-taldauy\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#433-sheshim-khabyldau-khisykhtaryn-zertteu-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3.3. Шешім қабылдау қисықтарын зерттеу талдауы&lt;/span&gt;&lt;/a&gt;4.3.3. Шешім қабылдау қисықтарын зерттеу талдауы&lt;/h4&gt;\n&lt;p&gt;Шешім қабылдау қисықтарын зерттеу талдауы унимодальді (ЭКГ, LLM-мәтін және кестелік) модельдерді, сондай-ақ іштей таңдалған ЭКГ + LLM-мәтін және ЭКГ + кестелік модельдерді бағалады. Бұл модельдер 2%-дан 25%-ға дейінгі тәуекел шектерінде «барлығын емдеу» және «ешкімді емдемеу» эталондық стратегияларымен салыстырылды, мұнда таза пайда үшін 95% нүктелік сенімділік интервалдары 5000 пациент деңгейіндегі бутстреп-таңдамалар негізінде алынды. SCD (кенеттен болатын жүрек өлімі) болжамы үшін ЭКГ + LLM-мәтін моделі бағаланған шектер диапазонында екі эталондық стратегиядан да дәйекті түрде асып түскен жоқ. Керісінше, ЭКГ + кестелік клиникалық белгілер моделі екі стратегияға қатысты шамамен 8,8%–21,8% диапазонында оң таза пайда көрсетті. Унимодальді кестелік модель шамамен 8,3%–20,0% диапазонының көп бөлігінде қолайлы таза пайда көрсетті, ал унимодальді ЭКГ моделі шамамен 10,8%–14,0% тар аралықта екі стратегиядан да асып түсті. PFD (үдемелі жүрек жеткіліксіздігі) болжамы үшін ЭКГ + LLM-мәтін моделі шамамен 11,0%–13,0% тар шектік аралықта екі стратегиядан да асып түсті. Унимодальді кестелік модель шамамен 6,5%-дан 25,0%-ға дейінгі шектердің көпшілігінде оң таза пайда берді, ал ЭКГ + кестелік клиникалық белгілер моделі 6,8%-дан 24,5%-ға дейінгі аралықта солай істеді. Осылайша, оң таза пайданың ең кең және тұрақты аймақтары бастапқы кестелік клиникалық белгілерді қамтитын модельдер үшін байқалды. Осы төрт жылдық нәтижелер үшін ешқандай араласуға тән тәуекел шегі клиникалық түрде расталмағандықтан, 2%–25% аралығы байқалған оқиғалардың таралуын және мүмкін болатын тәуекел төзімділіктерін қамтитын зерттеу диапазоны ретінде таңдалды. Сонымен қатар, сенімділік интервалдары нүктелік болып табылады және бүкіл шектік диапазон бойынша бір мезгілде қамтуды қамтамасыз етпейді. Сондықтан бұл нәтижелер гипотетикалық шешім қабылдау шектері кезіндегі модельдердің салыстырмалы мінез-құлқын сипаттайды және нақты клиникалық әрекеттермен байланысты шектерді қолдана отырып, болашақ сыртқы және проспективті зерттеулер үшін негіз береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Шешім қабылдау қисықтарын талдау (Decision Curve Analysis) — бұл диагностикалық модельдердің клиникалық пайдалылығын бағалау әдісі, ол тәуекел ықтималдығының әртүрлі шектерінде шынайы оң нәтижелерді анықтаудан түсетін пайда мен жалған оң нәтижелерден келетін зиянды теңестіруді ескереді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"434-model-atribuciyasy-zhaene-turakhtylykh-taldaulary\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#434-model-atribuciyasy-zhaene-turakhtylykh-taldaulary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3.4. Модель атрибуциясы және тұрақтылық талдаулары&lt;/span&gt;&lt;/a&gt;4.3.4. Модель атрибуциясы және тұрақтылық талдаулары&lt;/h4&gt;\n&lt;p&gt;ЭКГ + LLM-мәтін мультимодальді модельдерінің мінез-құлқын көрсету үшін біз SCD және PFD болатыны болжанған репрезентативті пациенттер үшін ЭКГ назар (attention) және мәтін-салиенттілік визуализацияларын сәйкесінше 7-сурет пен 8-суретте ұсынамыз. Толық амбулаторлық ЭКГ бойынша есептелген назар салмақтары (7a-сурет және 8a-сурет) бір оқшауланған аралықта емес, бүкіл 24 сағаттық жазба бойына таралды. Бұл өрнектер уақытша агрегация механизмі жазбаның бірнеше бөлігінен алынған ақпаратты қамтығанын көрсетеді. LLM арқылы жасалған клиникалық бағалаулар үшін (7b-сурет және 8b-сурет) градиентке негізделген токен салиенттілігі жасалған мәтіннің бірнеше бөлігіне таралды, оның ішінде LVEF, NYHA класы, Pro-BNP, тәуекел белгілері және жүрек жеткіліксіздігінің ауырлығы немесе функционалдық күйі туралы мәлімдемелер сияқты клиникалық маңызды дескрипторлар бар. Жергілікті ЭКГ мінез-құлқын зерттеу үшін репрезентативті 30 секундтық сегменттер сегмент деңгейіндегі HRV белгілерімен және олардың сәйкес салиенттілік мәндерімен бірге көрсетілген (7c-сурет және 8c-сурет). Визуализациялар уақытша агрегация кезінде тағайындалған назардың жүрек соғу жиілігі, SDNN, RMSSD, pNN50, ең ұзақ RR үзілісі және фокустық сегмент айналасындағы қарыншалық экстрасистолалар (PVC) жүктемесіндегі өзгерістермен бірге қалай қарастырылуы мүмкін екенін көрсетеді. Жиынтығында, бұл визуализациялар модельдің қай уақытша және клиникалық белгілерге сүйенетінін зерттеудің қосымша әдісін ұсынады, бұл модель болжамдарын SCD және PFD-мен байланысты патофизиологияның танылатын аспектілерімен байланыстыруға көмектеседі. Біз мәтіндік атрибуция рейтингтерінің тұрақтылығын бірнеше бақыланатын бұзылулар кезінде қосымша бағаладық (9a,b-сурет). Атрибуция рейтингтері интеграция қадамдарының санындағы өзгерістерге қатысты жоғары тұрақты болды және мағынаны сақтайтын енгізу бұзылулары, соның ішінде бос орындар, тыныс белгілері, жолдар реті және бейтарап префикстердің өзгеруі кезінде салыстырмалы түрде тұрақты болып қалды. Тұрақтылық әртүрлі кездейсоқ бастапқы сандармен (random seeds) қайта оқыту кезінде төменірек болды, SCD үшін орташа Спирмен корреляциясы 0,596 және PFD үшін 0,594 болды. Классификатор басын рандомизациялау атрибуция келісімін одан әрі төмендетті, SCD және PFD үшін орташа Спирмен корреляциялары сәйкесінше 0,492 және 0,484 болды. Жалпы алғанда, екі нәтиже үшін де ұқсас өрнектер байқалды, бұл атрибуция рейтингтерінің беткейлік енгізу өзгерістеріне төзімді, бірақ орнатылған модель параметрлеріндегі вариацияларға сезімтал екенін көрсетеді. Соңында, жоғары салиенттілікке ие токендер болжанған ықтималдықтарға көбірек әсер ететінін бағалау үшін токендерді маскалау қолданылды (9c,d-сурет). Қатысқан, арнайы емес токендер арасында жоғары және төмен салиенттіліктегі токендер градиентке негізделген токен салиенттілігі бойынша сәйкесінше жоғарғы және төменгі бөлікте орналасқандар деп белгіленді, ал кездейсоқ маскалау тең мөлшердегі жарамды токендерді ауыстырусыз біркелкі таңдап алды. Жоғары атрибуциялы токендерді маскалау әдетте кездейсоқ маскалауға қарағанда болжанған ықтималдықта үлкен абсолютті өзгерістерді тудырды, дегенмен бұл айырмашылықтың шамасы маскалау фракциясына байланысты өзгерді. SCD үшін жоғары атрибуция мен кездейсоқ маскалау арасындағы орташа айырмашылық 5%, 10% және 20% маскалау фракцияларында оң болды, 95% сенімділік интервалдары нөлді қоспағанда, бірақ 30%-да кішірек болды және нөлден ажыратылмады. PFD үшін айырмашылық 5% және 30%-да оң болды, ал 10% және 20%-да сенімділік интервалдары нөлді қамтыды. Жиынтығында, бұл талдаулар атрибуция әдісі модель шығысымен байланысты мәтіндік аймақтарды анықтайтынын көрсететін қосымша дәлелдер ұсынады, сонымен бірге атрибуция рейтингтері мен маскалау әсерлері орнатылған модельдегі немесе бұзылу параметрлеріндегі өзгерістерге қатысты инвариантты емес екенін көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"435-koersetilimder-men-khabattasu-ablyaciyalary\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#435-koersetilimder-men-khabattasu-ablyaciyalary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3.5. Көрсетілімдер мен қабаттасу абляциялары&lt;/span&gt;&lt;/a&gt;4.3.5. Көрсетілімдер мен қабаттасу абляциялары&lt;/h4&gt;\n&lt;p&gt;Біз болжамдық тиімділік LLM арқылы жасалған бағалау мен пайымдаулардан, клиникалық айнымалылардың детерминистік вербализациясынан немесе бастапқы клиникалық деректерді тікелей модельдеуден туындайтынын анықтау үшін бірнеше көрсетілім және абляция шарттарын бағаладық. Мәтіндік шарттарға толық LLM тәуекел бағасы, тек тәуекел белгілері, тек негіздемелер, бейтарап клиникалық түйіндеме (SCD немесе PFD тәуекелін бағалаусыз берілген клиникалық ақпараттың LLM түйіндемесі) және LLM емес детерминистік үлгі кіреді. Тікелей клиникалық деректерді бақылау ретінде бастапқы сандық және категориялық айнымалылар бес Холтер ЭКГ әсерлерін ескере отырып және ескермей, айыппұлдық логистикалық регрессия көмегімен модельденді. Нәтижелер 5-кестеде жинақталған. SCD болжамы үшін толық LLM бағасы 0,531 AUROC және 0,130 PR-AUC көрсеткішіне қол жеткізді. Тек тәуекел белгілері мен тек негіздемелер көрсетілімдері дискриминацияны жақсартпады, ал бейтарап клиникалық түйіндеме 0,574 AUROC және 0,141 PR-AUC көрсеткіштерімен біршама жоғары нүктелік бағаларды берді. Керісінше, детерминистік үлгі 0,681 AUROC және 0,204 PR-AUC көрсеткішіне жетіп, тікелей кестелік клиникалық айнымалы модельдерінің тиімділігіне жақындады. SCD Brier-score үшін ең төменгі нүктелік баға клиникалық айнымалылар мен ЭКГ әсерлерін қолданатын айыппұлдық логистикалық регрессия кезінде байқалды. PFD болжамы үшін толық LLM бағасы 0,459 AUROC және 0,134 PR-AUC көрсеткішіне қол жеткізді. Тек тәуекел белгілері мен тек негіздемелер көрсетілімдері де шектеулі дискриминацияны көрсетті, ал бейтарап клиникалық түйіндеме 0,620 AUROC және 0,188 PR-AUC көрсеткіштерімен жақсырақ нәтиже берді. Детерминистік үлгі 0,680 AUROC және 0,300 PR-AUC көрсеткішіне жетіп, одан әрі жақсарды, дегенмен тікелей кестелік клиникалық айнымалы модельдері жалпы алғанда ең мықты болып қалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AUROC және PR-AUC — классификация сапасын бағалау метрикалары: біріншісі модельдің сыныптарды ажырату қабілетін, екіншісі сирек кездесетін оқиғаларды анықтаудағы дәлдікті өлшейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ЭКГ модальділігімен ықтимал қабаттасуды бағалау үшін бес Холтер ЭКГ әсері LLM сұрауларына және кестелік болжаушыларға бөлек қосылды. SCD үшін бұл әсерлерді толық LLM бағасына қосу дискриминацияны жақсартпады: AUROC 0,531-ден 0,516-ға дейін, ал PR-AUC 0,130-дан 0,117-ге дейін төмендеді. Керісінше, PFD үшін ЭКГ әсерлерін қосу AUROC-ты 0,459-дан 0,655-ке дейін, ал PR-AUC-ты 0,134-тен 0,245-ке дейін арттырды. Тиісті кестелік AUROC мәндері тек шамалы ғана өсті: SCD үшін 0,696-дан 0,710-ға дейін және PFD үшін 0,787-ден 0,792-ге дейін. Жалпы алғанда, ЭКГ әсерлері өрістері PFD үшін LLM көрсетіліміне SCD-ге қарағанда айтарлықтай көбірек үлес қосқандай көрінеді.&lt;/p&gt;\n&lt;p&gt;Науқас-мәтін сәйкестігі әрбір сыртқы тест қабатындағы науқастар арасында мәтіндік көрсетілімдерді кездейсоқ алмастыру және ЭКГ көрсетілімдері мен нәтижелерді өзгеріссіз қалдыру арқылы бағаланды. Оқытылған синтез модельдері қайта баптаусыз қолданылды. Бұл процедура мәтіндік эмбеддингтердің жалпы таралуын сақтап, әрбір науқас пен оның мәтіндік көрсетілімі арасындағы сәйкестікті бұзды. 6-кестеде көрсетілгендей, науқас-мәтін сәйкестігін бұзу тиімділікте шамалы өзгерістерге әкелді. SCD үшін дұрыс жұптастырылған көрсетілімдер аралас жұптарға қарағанда сәл төменірек AUROC және PR-AUC көрсеткіштеріне ие болды, айырмашылықтар сәйкесінше -0,011 және -0,008 құрады, ал Brier-score айырмашылығы минималды болды. PFD үшін AUROC, PR-AUC және Brier-score бойынша тиісті айырмашылықтар да елеусіз болды. Ешбір ауыстыру тесті статистикалық тұрғыдан маңызды болған жоқ. Бұл нәтижелер ЭКГ-LLM синтез моделі толық LLM-мәтіндік көрсетілімінде науқасқа тән сәйкестікті сақтаудан өлшенетін тиімділік пайдасын алмағанын көрсетеді. Олар сондай-ақ детерминистік және тікелей кестелік көрсетілімдер LLM арқылы жасалған бағалауға қарағанда көбірек пайдалы болжамдық ақпаратты сақтап қалғаны туралы кеңірек қорытындыны нығайтады.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-f1.jpg\" alt=\"1-сурет. Амбулаториялық ЭКГ жазбаларын клиникалық деректермен бірге талдауға арналған мультимодальды жұмыс процесі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Амбулаториялық ЭКГ жазбаларын клиникалық деректермен бірге талдауға арналған мультимодальды жұмыс процесі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет. Амбулаториялық ЭКГ жазбаларын клиникалық деректермен бірге талдауға арналған мультимодальды жұмыс процесі. ЭКГ жазбалары алдын ала өңделіп, қысқа терезелерге сегменттеледі. Әрбір терезе үшін жүрек соғысының өзгермелілігі (HRV) көрсеткіштері алынып, Multiple Instance Learning–Temporal Convolutional Network (MIL–TCN) арқылы кодталады, бұл ЭКГ кескінін, 𝜀ECG қалыптастырады. Параллель түрде клиникалық айнымалылар үлкен тілдік модель (LLM) арқылы жасалған мәтін, детерминирленген клиникалық мәтін немесе кестелік белгілер ретінде ұсынылады. LLM жасаған және детерминирленген мәтіндер пациент деңгейіндегі мәтіндік кескіндерді, 𝜀TXT алу үшін биомедициналық мәтіндік кодтағыш арқылы кодталады, ал алдын ала өңделген кестелік айнымалылар кестелік кескінді, 𝜀TAB құрайды. ЭКГ, мәтіндік және кестелік кескіндердің әрқайсысы унимодальды модельдер ретінде бағаланды, ал мәтіндік және кестелік кескіндер кенеттен болатын жүрек өлімін (SCD) және жүрек жеткіліксіздігінен болатын өлімді (PFD) болжау үшін мультимодальды модельдерде ЭКГ кескінімен жеке біріктірілді. Үзік сызықтар мультимодальды біріктіру үшін мәтіндік (TXT) немесе кестелік (TAB) кескінді пайдалануды көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-f2.jpg\" alt=\"2-сурет. MUSIC когортасын таңдау және төрт жылдық нәтижелер топтары.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет. MUSIC когортасын таңдау және төрт жылдық нәтижелер топтары.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-f3.jpg\" alt=\"3-сурет. Кенеттен болатын жүрек өлімі (a) және жүрек жеткіліксіздігінен болатын өлім (b) үшін унимодальды (тек ЭКГ, тек \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет. Кенеттен болатын жүрек өлімі (a) және жүрек жеткіліксіздігінен болатын өлім (b) үшін унимодальды (тек ЭКГ, тек LLM мәтіні, тек кестелік деректер) және мультимодальды (ЭКГ + кестелік деректер, ЭКГ + LLM мәтіні) модельдердің қателік матрицаларын салыстыру.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-f4.jpg\" alt=\"4-сурет. Кенеттен болатын жүрек өлімі (a) және жүрек жеткіліксіздігінен болатын өлім (b) үшін унимодальды (тек ЭКГ, тек \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет. Кенеттен болатын жүрек өлімі (a) және жүрек жеткіліксіздігінен болатын өлім (b) үшін унимодальды (тек ЭКГ, тек LLM мәтіні, тек кестелік деректер) және мультимодальды (ЭКГ + кестелік деректер, ЭКГ + LLM мәтіні) модельдердің AUROC қисықтарын салыстыру.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-f5.jpg\" alt=\"5-сурет. Кенеттен болатын жүрек өлімі (a) және жүрек жеткіліксіздігінен болатын өлім (b) үшін унимодальды (тек ЭКГ, тек \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет. Кенеттен болатын жүрек өлімі (a) және жүрек жеткіліксіздігінен болатын өлім (b) үшін унимодальды (тек ЭКГ, тек LLM мәтіні, тек кестелік деректер) және мультимодальды (ЭКГ + кестелік деректер, ЭКГ + LLM мәтіні) модельдердің PR-AUC қисықтарын салыстыру.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-f6.jpg\" alt=\"6-сурет: Кенеттен болатын жүрек өлімі (a) және жүрек жеткіліксіздігінен болатын өлім (b) жағдайларын болжауға арналған у\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сурет: Кенеттен болатын жүрек өлімі (a) және жүрек жеткіліксіздігінен болатын өлім (b) жағдайларын болжауға арналған унимодальды (тек ЭКГ, тек LLM мәтіні, тек кестелік деректер) және мультимодальды (ЭКГ + кестелік деректер, ЭКГ + LLM мәтіні) модельдердің DCA қисықтарын салыстыру.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-f7.jpg\" alt=\"7-сурет: Амбулаториялық ЭКГ үшін назар аудару картасы (a), LLM арқылы жасалған клиникалық мәтін үшін градиентке негіздел\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-сурет: Амбулаториялық ЭКГ үшін назар аудару картасы (a), LLM арқылы жасалған клиникалық мәтін үшін градиентке негізделген токендердің маңыздылық картасы (b), сондай-ақ таңдалған ЭКГ сегменті мен жүрек соғысының өзгермелілігі (HRV) көрсеткіштері үшін маңыздылық карталары (c). Бұл карталар ЭКГ + LLM мультимодальды моделіне қатысты, онда пациентте алдағы төрт жыл ішінде кенеттен болатын жүрек өлімі орын алады деп болжанады.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-f8.jpg\" alt=\"8-сурет: Амбулаториялық ЭКГ үшін назар аудару картасы (a), LLM арқылы жасалған клиникалық мәтін үшін градиентке негіздел\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-сурет: Амбулаториялық ЭКГ үшін назар аудару картасы (a), LLM арқылы жасалған клиникалық мәтін үшін градиентке негізделген токендердің маңыздылық картасы (b), сондай-ақ таңдалған ЭКГ сегменті мен жүрек соғысының өзгермелілігі (HRV) көрсеткіштері үшін маңыздылық карталары (c). Бұл карталар ЭКГ + LLM мультимодальды моделіне қатысты, онда пациентте алдағы төрт жыл ішінде жүрек жеткіліксіздігінен болатын өлім орын алады деп болжанады.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-f9.jpg\" alt=\"9-сурет: SCD және PFD болжамы үшін атрибуттардың тұрақтылығын (a, b) және токендерді маскалауды (c, d) талдау.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;9-сурет: SCD және PFD болжамы үшін атрибуттардың тұрақтылығын (a, b) және токендерді маскалауды (c, d) талдау.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-fS1.jpg\" alt=\"Сурет S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S1&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызба " y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Деректер&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;форматы&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;дәлдікке әсер&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;етеді&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Кардиологиядағ&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ы жасанды&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;интеллект&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Препринт лицензиясы&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;
