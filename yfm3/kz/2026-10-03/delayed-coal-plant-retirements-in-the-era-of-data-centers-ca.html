        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"96\" cy=\"170\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"544\" cy=\"182\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · EPIDEMIOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Жасанды интеллект және&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;көмір: электр станцияларының&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;жабылуын кейінге қалдыру&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;өлім-жітімді арттырады&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca-f1.jpg\" alt=\"1-сурет. 2024 жылдың қаңтары мен 2026 жылдың қаңтары аралығында көмір электр станцияларын пайдаланудан шығару кестелерін\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. 2024 жылдың қаңтары мен 2026 жылдың қаңтары аралығында көмір электр станцияларын пайдаланудан шығару кестелеріне енгізілген өзгерістер.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет. 2024 жылдың қаңтары мен 2026 жылдың қаңтары аралығында көмір электр станцияларын пайдаланудан шығару кестелеріне енгізілген өзгерістер. 2024 жылғы қаңтардағы &lt;a href=\"concepts/eia-860m.html\"&gt;EIA-860M&lt;/a&gt; түгендеуіне сәйкес 2035 жылға дейін жабылуы жоспарланған АҚШ-тың 50 көмір электр станциясының картасы. Нүктелердің түсі 2026 жылғы қаңтардағы EIA-860M түгендеуіндегі жағдайды білдіреді: жабылған, өзгеріссіз, жабылуы кейінге қалдырылған немесе жабылу күні алынып тасталған. Нүкте өлшемі 2024 жылғы &lt;a href=\"concepts/sulfur-dioxide.html\"&gt;SO2&lt;/a&gt; шығарындыларына пропорционал. Жабылуы кейінге қалдырылған немесе жабылу күні алынып тасталған 20 станция денсаулыққа әсерді талдауда пайдаланылған қайта қаралған станциялар жиынтығын құрайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Жасанды интеллект пен бұлтты технологиялардың дамуы электр энергиясына деген сұранысты күрт арттырды, бұл көптеген көмір электр станцияларының жабылу мерзімін кейінге қалдыруға мәжбүр етті. Зерттеушілер осындай 20 нысанды талдап, олардың жұмыс істеу мерзімін ұзарту атмосфераға зиянды бөлшектердің шығарылуын көбейтетінін анықтады. Бұл жағдай алдағы онжылдықта өлім-жітім көрсеткіштерінің айтарлықтай өсуіне әкеледі.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;20 көмір станциясы деректер орталықтарына байланысты жабылуды кейінге қалдырды.&lt;/li&gt;\n&lt;li&gt;2035 жылға дейін &lt;a href=\"concepts/particulate-matter-pm2-5.html\"&gt;PM2.5&lt;/a&gt; эмиссиясы 1256 қосымша өлімге әкеледі.&lt;/li&gt;\n&lt;li&gt;Көмір PM2.5 бөлшектері басқа көздерге қарағанда 2,1 есе қауіпті.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеу 2024 жылдың қаңтары мен 2026 жылдың қаңтары аралығында жабылу мерзімін кейінге қалдырған немесе жойған 20 көмір электр станциясына арналған. Авторлар EIA-860M деректер базасын пайдаланып, PM2.5 (диаметрі 2,5 микрометрден кіші ұсақ бөлшектер) атмосферадағы қозғалысын модельдеді. Бұл бөлшектер тыныс алу жолдары арқылы қанға өтіп, жүрек және өкпе ауруларын тудырады.&lt;/p&gt;\n&lt;p&gt;Салдарды бағалау үшін &lt;a href=\"concepts/medicare.html\"&gt;Medicare&lt;/a&gt; (АҚШ-тағы медициналық сақтандыру жүйесі) пайдаланушылары арасындағы өлім статистикасы талданды. Модельдеу нәтижелері көрсеткендей, бұл станциялардың 2026–2035 жылдардағы қызметі 1256 қосымша өлім жағдайына себеп болады. 18 жағдайда станция операторлары қызметтің жалғасуын дәл осы деректер орталықтарының жүктемесімен түсіндірген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бұл жұмыс рецензияланбаған препринт болып табылады және болжамды модельдерге негізделген, болашақтағы эмиссияны азайту технологияларын ескермеуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;АҚШ-тағы көмірмен жұмыс істейтін электр станциялары ұсақ дисперсті бөлшектердің (PM2.5) негізгі көзі болып қала береді және бұл халықтың өлім-жітім көрсеткіштерімен тікелей байланысты. Станцияларды жабу бойынша бекітілген жоспарларға қарамастан, бұлтты есептеулер мен жасанды интеллект технологияларының дамуы электр энергиясына деген сұранысты арттырып, энергетикалық компаниялар мен реттеушілерді бұл жоспарларды қайта қарауға мәжбүр етуде.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;20 көмір электр станциясының жабылу мерзімін кейінге қалдыру 2026–2035 жылдар аралығында 1256 қосымша өлім жағдайына әкеледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;2024 жылғы қаңтардағы жағдай бойынша 50 көмір электр станциясы 2035 жылға дейін жабылуы тиіс еді. Алайда 2026 жылғы қаңтарға қарай олардың 20-сының жабылу мерзімі кейінге шегерілді немесе жоспардан алынып тасталды. Авторлар осы 20 нысанның PM2.5 шығарындылары 2026–2035 жылдар аралығында Medicare бағдарламасының бенефициарлары арасындағы өлім-жітімге қалай әсер ететінін модельдеді. Есептеулерге сәйкес, кестенің қайта қаралуы 1256 қосымша өлімге (сенімділік аралығы 1136-дан 1376-ға дейін) әкеледі, бұл денсаулық сақтау жүйесіне түсетін жүктемені бастапқы жоспарға қарағанда 3,1 есеге арттырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Medicare — АҚШ-та негізінен егде жастағы халықты қамтитын мемлекеттік медициналық сақтандыру бағдарламасы, оның деректері ауаның ластануының өлім-жітімге әсерін бағалау үшін жиі қолданылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Зерттеу көрсеткендей, 20 станцияның 18-і гипер-ауқымды деректерді өңдеу орталықтарының (data-centers) сұранысы жоғары аймақтарда орналасқан. Энергетикалық компаниялардың құжаттарында станциялардың жұмысын ұзарту қажеттілігі дәл осы IT-сектордың өсіп келе жатқан қажеттіліктерін қамтамасыз етумен түсіндірілген. Авторлар станцияларды жабу кестелері халықтың денсаулығына әсерін бағалаудан гөрі тезірек өзгертіліп жатқанын және бұл кешігулер өлшенетін адам шығынына әкелетінін атап өтеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Өлім-жітім көрсеткіштері болжамды модельдеуге негізделген, ол шығарындыларды тазарту технологияларындағы болашақ өзгерістерді ескермеуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"koemir-elektr-stanciyalarynyng-halykh-densaulyghyna-aeseri\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#koemir-elektr-stanciyalarynyng-halykh-densaulyghyna-aeseri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Көмір электр станцияларының халық денсаулығына әсері&lt;/span&gt;&lt;/a&gt;Көмір электр станцияларының халық денсаулығына әсері&lt;/h4&gt;\n&lt;p&gt;Көмірмен жұмыс істейтін электр станциялары АҚШ-тағы ұсақ дисперсті бөлшектер (PM2.5) ластануының негізгі көзі болып қала береді. Көмір PM2.5 бөлшектерінен туындайтын өлім қаупі басқа барлық көздерден келетін PM2.5-ке қарағанда 2,1 есе жоғары. 1999 жылдан 2020 жылға дейін бұл Medicare бағдарламасының бенефициарлары арасында шамамен 460 000 өлім жағдайына әкелді. Эмиссиялар құрамына бастапқы бөлшектер мен екінші реттік PM2.5 түзілуіне ықпал ететін газ тәрізді прекурсорлар (күкірт диоксиді, азот оксидтері) кіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Көмір PM2.5 бөлшектері 2,1 есе жоғары өлім қаупін тудырады және 21 жыл ішінде 460 000 адамның өліміне себеп болды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;АҚШ-та көмір станцияларының саны азайып келе жатқанымен, 2026 жылғы қаңтардағы жағдай бойынша 208 нысан жұмыс істеп тұрды. Жасанды интеллект пен бұлтты есептеулерге арналған деректер орталықтары (data centers) тарапынан электр энергиясына сұраныстың артуы станцияларды жабу жоспарларына әсер етеді. 2023 жылы деректер орталықтары үлкен көлемде энергия тұтынды, ал 2028 жылға қарай бұл көрсеткіш 325–580 ТВт·сағ-қа жетуі мүмкін. Станцияларды жабу мерзімдерінің кейінге шегерілуі эмиссиялардың сақталуына және қосымша өлім жағдайларына әкелуі мүмкін.&lt;/p&gt;\n&lt;h4 id=\"keshiktiru-saldarlaryn-baghalau-aedisteri\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#keshiktiru-saldarlaryn-baghalau-aedisteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кешіктіру салдарларын бағалау әдістері&lt;/span&gt;&lt;/a&gt;Кешіктіру салдарларын бағалау әдістері&lt;/h4&gt;\n&lt;p&gt;Авторлар 2024 жылғы қаңтар мен 2026 жылғы қаңтардағы EIA-860M есептерінде жазылған 50 көмір электр станциясын жабу жоспарларын салыстырды. 20 нысан бойынша мерзімдердің кейінге шегерілгені немесе жойылғаны анықталды. Осы нысандар үшін 2026–2035 жылдар аралығында пошта индекстері (&lt;a href=\"concepts/zip-code-tabulation-area.html\"&gt;ZCTA&lt;/a&gt;) деңгейінде халықтың көмір PM2.5 әсеріне ұшырауы есептелді. Бағалау тек SO₂-ден түзілген екінші реттік PM2.5 компонентін ескерді, бұл есептеулерді консервативті етеді. Өлім деңгейі Medicare деректері негізінде бағаланды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ZCTA (ZIP Code Tabulation Area) — пошта индекстері бойынша деректерді жинақтау үшін АҚШ халық санағы бюросы қолданатын статистикалық аумақтар.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу негізінен Medicare бенефициарларына (егде жастағылар) бағытталған, сондықтан жалпы өлім көрсеткіштері өзгеше болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;p&gt;Тарихи тұрғыдан алғанда, көмір жағудан бөлінетін PM2.5 бөлшектерінің әсері АҚШ-тың оңтүстік және шығыс аймақтарында, соның ішінде Огайо алқабы, Аппалачи, Орта Батыс және Оңтүстік-Шығыстың бір бөлігінде шоғырланған (Rasm SN). Бұл кеңістіктік үлгі көмір электр станцияларының орналасуымен де, бөлшектердің атмосфера арқылы ұзақ қашықтыққа тасымалдануымен де байланысты. Халық санына қарай өлшенген тарихи әсер демографиялық топтар бойынша әртүрлі болды, ең үлкен ауытқу қара нәсілді халық арасында байқалды (Rasm SN).&lt;/p&gt;\n&lt;h4 id=\"koemir-stanciyalaryn-zhabu-zhosparlaryna-engizilgen-oezgerister\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#koemir-stanciyalaryn-zhabu-zhosparlaryna-engizilgen-oezgerister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Көмір станцияларын жабу жоспарларына енгізілген өзгерістер&lt;/span&gt;&lt;/a&gt;Көмір станцияларын жабу жоспарларына енгізілген өзгерістер&lt;/h4&gt;\n&lt;p&gt;Көмір электр станцияларын жабу кестелері 2024 жылғы қаңтар мен 2026 жылғы қаңтардағы EIA-860M түгендеулері арасында айтарлықтай өзгерді. 2024 жылғы деректер бойынша 2035 жылға дейін жабылуы жоспарланған 50 станцияның 20-сында (40%) жабылу мерзімі кейінге қалдырылды немесе мүлдем жойылды (Rasm 1 және Jadval SN). Осы 20 станцияның 10-ында мерзімдер кейінге қалдырылса, 10-ында жабылу күні мүлдем көрсетілмеген. EIA-860M әр генератор бойынша есеп беретіндіктен, кем дегенде бір көмір генераторының күні өзгерген болса, станция әсерге ұшыраған деп саналды; барлығы 44 генератордың 34-і әсерге ұшырады. Бұл нысандардың SO₂ шығарындыларындағы үлесі Sherburne County (MN) станциясындағы 5%-дан 12 станциядағы 100%-ға дейін өзгерді (Jadval SN).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;2035 жылға дейін жабылуы жоспарланған көмір станцияларының 40 пайызында жабылу мерзімдері кейінге қалдырылды немесе жойылды, бұл 34 генераторға әсер етті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"stanciyalar-denggejinde-oelim-zhitim-koersetkishterin-baghalau\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#stanciyalar-denggejinde-oelim-zhitim-koersetkishterin-baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Станциялар деңгейінде өлім-жітім көрсеткіштерін бағалау&lt;/span&gt;&lt;/a&gt;Станциялар деңгейінде өлім-жітім көрсеткіштерін бағалау&lt;/h4&gt;\n&lt;p&gt;Станциялар деңгейіндегі талдау ұлттық өлім-жітім көрсеткіштерінің дәл жабылу мерзімі өзгерген нысандармен байланысты екенін көрсетті. 2026–2035 жылдары Medicare бенефициарларының өлімі бойынша Welsh (TX) 435, Coleto Creek (TX) 316, Limestone (TX) 279 және Dave Johnston (WY) 99 қосымша өлім жағдайына себеп болуы болжанды (Rasm 4 және Jadval SN). Осы төрт ірі нысан жалпы өлім жағдайларының 90%-ын құрайды. Жалпы алғанда, үш ірі станция (Welsh, Coleto Creek және Limestone) 1256 қосымша өлім жағдайының шамамен 1030-ына (82%) жауапты. Бұл станциялар Техас пен оған іргелес аймақтарда кең ауқымды әсер ету аймақтарын құрды (Rasm 5).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жабылу мерзімі ұзартылған төрт электр станциясы 2026–2035 жылдар аралығында Medicare бенефициарлары арасында күтілетін қосымша өлім жағдайларының 90 пайызын құрайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Станция деңгейіндегі атрибуция» әдісі жалпы өлім-жітім көрсеткіштерін жекелеген нысандардың шығарындыларымен, жұмыс істеу мерзімімен және ауа ағындарының бағытымен байланыстыруға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gipermasshtabty-derekter-ortalykhtarynyng-hdc-suranysy\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#gipermasshtabty-derekter-ortalykhtarynyng-hdc-suranysy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гипермасштабты деректер орталықтарының (HDC) сұранысы&lt;/span&gt;&lt;/a&gt;Гипермасштабты деректер орталықтарының (HDC) сұранысы&lt;/h4&gt;\n&lt;p&gt;(36)-дереккөздегі атрибуция моделін пайдалана отырып, авторлар жабылу мерзімі өзгерген 20 станцияны EIA идентификаторларымен және EPA eGRID2023 деректерімен салыстырды (37). 20 станцияның 18-і &lt;a href=\"concepts/hyperscale-data-centers.html\"&gt;HDC&lt;/a&gt; электр энергиясына сұраныс жоғары болған жеті теңестіруші аймақта орналасқаны анықталды (Jadval SN). Ресми құжаттар мен есептер Campbell (MI), Centralia (WA), Craig (CO), Culley (IN) және Schahfer (IN) станцияларының жұмыс мерзімін ұзартуды жасанды интеллект пен деректер орталықтарының тез өсуімен байланыстырады (38-44). Мысалы, Campbell станциясы үшін 1 ГВт қуатты деректер орталығына жеткізу жоспары көрсетілген. Сондай-ақ, Висконсин мен Флорида мен Флорида және Флорида және Флорида және Флорида штаттарында да деректер орталықтары үшін электр энергиясына сұраныс станциялардың жабылуын кейінге қалдыруға негіз болды (45-49).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу модельдеу мен әкімшілік есептерге негізделген; деректер орталықтарының сұранысы мен станциялардың жұмыс мерзімі арасындағы байланыс әрқашан тікелей себеп-салдарлық байланысты білдірмейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;h4 id=\"naetizhelerdi-talkhylau-zhaene-densaulykhkha-aeseri\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#naetizhelerdi-talkhylau-zhaene-densaulykhkha-aeseri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелерді талқылау және денсаулыққа әсері&lt;/span&gt;&lt;/a&gt;Нәтижелерді талқылау және денсаулыққа әсері&lt;/h4&gt;\n&lt;p&gt;Бұл зерттеу көмір электр станцияларын жабу кестесін қайта қарау PM2.5 бөлшектерінің әсерін күшейтіп, өлім-жітімнің айтарлықтай артуына әкелетінін көрсетеді. 2024 жылдың қаңтары мен 2026 жылдың қаңтары аралығындағы EIA-860M деректерін талдау 2035 жылға дейін жабылуы тиіс станциялардың 40%-ы мерзімді кейінге қалдырғанын немесе жоспардан алып тастағанын көрсетті. Қайта қаралған сценарий бойынша, 2026–2035 жылдар аралығында Medicare бенефициарлары арасында көмірден бөлінетін PM2.5 әсерінен болатын қосымша өлім-жітім 1256 жағдайды құрайды, бұл бастапқы сценарийден 3,11 есе жоғары.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Көмір станцияларын жабуды кейінге қалдыру 2026–2035 жылдары 1256 қосымша өлімге әкеледі, бұл күтілген деңгейден 3,11 есе көп.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;18 станцияның гипер-ауқымды деректер орталықтарына (data-center) сұраныс жоғары аймақтарда орналасуы алаңдатарлық жайт. Деректер орталықтарының электр энергиясына деген сұранысы жаңа қуаттарды салу жылдамдығынан асып түсетіндіктен, ескірген көмір блоктары негізгі энергия көзіне айналуда. Бұл экономикалық пайда көрмейтін, бірақ ластанған ауадан зардап шегетін халыққа теріс әсер етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Medicare — АҚШ-тағы негізінен 65 жастан асқан адамдарды қамтитын мемлекеттік медициналық сақтандыру бағдарламасы; зерттеуде өлім-жітімді бағалау үшін осы топ алынған.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zertteu-shekteuleri-zhaene-aedisnamalykh-aspektiler\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#zertteu-shekteuleri-zhaene-aedisnamalykh-aspektiler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу шектеулері және әдіснамалық аспектілер&lt;/span&gt;&lt;/a&gt;Зерттеу шектеулері және әдіснамалық аспектілер&lt;/h4&gt;\n&lt;p&gt;Біздің талдау станция деңгейіндегі SO₂ шығарындылары мен PM2.5 әсері арасындағы тарихи байланысқа негізделген. Welsh, Coleto Creek, Limestone және Dave Johnston сияқты станциялар өлім-жітімнің негізгі көздері болып табылады. Бұл нақты диспетчерлік болжам емес, сценарийге негізделген талдау. Біз 2023–2025 жылдардағы орташа жылдық SO₂ шығарындыларын қолдандық, бірақ болашақтағы технологиялық өзгерістерді модельдемедік.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Өлім-жітімді бағалау тек Medicare бенефициарларымен шектелген және жас халықты, тыныс алу жолдарының ауруларын немесе жүрек-қан тамырлары аурулары сияқты өлімге әкелмейтін зардаптарды есепке алмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модель консервативті болып табылады: 10% бенефициарлар үшін әсер бағаланбаған. Сондай-ақ, біз газ генерациясы сияқты алмастырушы қуаттарды модельдемедік, сондықтан нәтижелер көмір станцияларын сақтап қалудың жалпы әсерін көрсетеді. Энергия жүйесінің сенімділігі маңызды болғанымен, көмір станцияларын сақтап қалу денсаулық сақтау үшін қауіпсіз емес және бұл шешімдер қоғамдық денсаулыққа тигізетін салдарымен бірге бағалануы тиіс.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"zertteu-dizajny-zhaene-pajdalanudan-shygharu-scenarijleri\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#zertteu-dizajny-zhaene-pajdalanudan-shygharu-scenarijleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу дизайны және пайдаланудан шығару сценарийлері&lt;/span&gt;&lt;/a&gt;Зерттеу дизайны және пайдаланудан шығару сценарийлері&lt;/h4&gt;\n&lt;p&gt;Көмір электр станцияларын пайдаланудан шығару кестелері АҚШ Энергетикалық ақпарат басқармасының (EIA-860M) деректері негізінде жасалды. Бастапқы кесте үшін 2024 жылғы қаңтар, ал қайта қаралған сценарий үшін 2026 жылғы қаңтардағы түгендеу деректері пайдаланылды. Талдауға 2024 жылғы қаңтардағы есеп бойынша жабылу мерзімі белгіленген кемінде бір жұмыс істеп тұрған көмір блогы бар станциялар енгізілді. Талдау бірлігі ретінде әрбір генератор алынды, бұл станция деңгейінде деректерді жинақтау кезіндегі қателіктерді болдырмады. Таңдалған 50 станцияның 20-сы критерийлерге сәйкес келді; олардағы 44 генератордың 19-ында жабылу мерзімі кешіктірілген, 15-інде күні алынып тасталған, 7-еуі өзгеріссіз қалған, 2-еуі жабылған және 1-еуі табиғи газға ауыстырылған (Кесте S1).&lt;/p&gt;\n&lt;p&gt;Пайдаланудан шығару жылын есепке алу үшін &lt;a href=\"concepts/koeffitsient-kalendarnoy-dostupnosti.html\"&gt;күнтізбелік қолжетімділік коэффициенті&lt;/a&gt; қолданылды: жабылуға дейінгі толық жылдар үшін 1, жабылғаннан кейін 0 және жабылу жылы үшін айлар санының 12-ге қатынасы. Қайта қаралған сценарийде күні алынып тасталған генераторлар үшін 2035 жылға дейін 1 коэффициенті сақталды. Станция деңгейіндегі коэффициенттер 2023–2025 жылдардағы орташа SO₂ шығарындылары бойынша өлшенді, бұл қуатқа қарағанда дәлірек нәтиже береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Күнтізбелік қолжетімділік коэффициенті — бұл жылдық шығарындыларды станция жабылған жылдың қай бөлігінде жұмыс істегеніне қарай пропорционалды бөлу әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"so-shygharyndylary\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#so-shygharyndylary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SO₂ шығарындылары&lt;/span&gt;&lt;/a&gt;SO₂ шығарындылары&lt;/h4&gt;\n&lt;p&gt;SO₂ шығарындылары бойынша жылдық деректер EPA Clean Air Markets базасынан алынды. 2026–2035 жылдарға арналған болжамдарда әрбір генератордың базалық шығарындысы 2023–2025 жылдардағы орташа көрсеткіш ретінде белгіленді. Бұл көрсеткіш сценарийге сәйкес жабылу мерзіміне дейін өзгеріссіз сақталды және күнтізбелік қолжетімділік коэффициентіне көбейтілді. Тиісті EIA есептерінде көрсетілген жабылу мерзімінен кейін шығарындылар нөлге тең деп қабылданды.&lt;/p&gt;\n&lt;h4 id=\"koemir-pm25-aeserin-modeldeu\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#koemir-pm25-aeserin-modeldeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Көмір PM2.5 әсерін модельдеу&lt;/span&gt;&lt;/a&gt;Көмір PM2.5 әсерін модельдеу&lt;/h4&gt;\n&lt;p&gt;Көмір жағудан түзілетін PM2.5 бөлшектерінің әсерін бағалау үшін 1999–2020 жылдардағы деректер жиынтығы пайдаланылды. АҚШ-тағы көмір электр станцияларынан шығатын күкірт диоксиді (SO2) мен PM2.5 концентрациясы HyADS (HYSPLIT орташа дисперсия моделі) көмегімен есептелді. Бұл деректер ZCTA (пошта индексі аймақтары) бойынша біріктіріліп, станция деңгейіндегі жылдық SO2 шығарындыларымен байланыстырылды. Зерттеуде «көмір PM2.5» деп тек SO2-мен байланысты компонент түсініледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/model-hyads.html\"&gt;HyADS моделі&lt;/a&gt; — бұл шығарынды көздерін белгілі бір аумақтағы ластану деңгейімен байланыстыратын, атмосферадағы бөлшектердің таралуын есептейтін жеңілдетілген модель.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;2026–2035 жылдарға арналған HyADS деректері болмағандықтан, лог-лог модель қолданылды: &lt;span class=\"yfm-latex\" data-content=\"%5Clog(%20ext%7BcoalPM%7D_%7B2.5%2Cpzt%7D)%20%3D%20%5Calpha_%7Bpz%7D%20%2B%20%5Cgamma%20%5Clog(%20ext%7BSO%7D_%7B2%2Cpt%7D)%20%2B%20%5Cepsilon_%7Bpzt%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Мұндағы αpz — станция-ZCTA жұбы үшін тұрақты әсер, γ — серпімділік коэффициенті (SO2-нің 1% өзгеруі PM2.5-тің γ% өзгеруіне әкеледі). Модель ең кіші квадраттар әдісімен оқытылды. Модельдің дәлдігі R² = 0,945 және ішкі R² = 0,834 болды. Серпімділік γ мәні 1,165 (95% CI: 1,124–1,206, Кесте S4) деп бағаланды, бұл SO2 шығарындысы артқан сайын PM2.5 концентрациясы пропорционалды түрде сәл көбірек өсетінін көрсетеді.&lt;/p&gt;\n&lt;p&gt;Болашақ концентрацияларды болжау үшін станциялардың жабылу сценарийлері бойынша SO2 шығарындылары пайдаланылды. Логарифмдік шкаладан нақты мәндерге өту үшін Duan smearing коэффициенті қолданылды (әр станция үшін жеке есептелген, диапазоны 1,063–1,226, орташа мәні 1,169, Кесте S4). Талдау 616 801 жұп бойынша 12 474 346 бақылауды қамтыды. Қосымша PM2.5 әсері станциялардың жабылуын кешіктіру сценарийі мен базалық сценарий арасындағы айырмашылық ретінде есептелді. Өлім-жітім жағдайлары әр станцияның ZCTA-дағы жалпы PM2.5 концентрациясына қосқан үлесіне пропорционалды түрде бөлінді.&lt;/p&gt;\n&lt;h4 id=\"topshamalar-bojynsha-aeserdi-taldau\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#topshamalar-bojynsha-aeserdi-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Топшамалар бойынша әсерді талдау&lt;/span&gt;&lt;/a&gt;Топшамалар бойынша әсерді талдау&lt;/h4&gt;\n&lt;p&gt;Біз көмір PM2.5 бөлшектерінің халық санына қарай өлшенген әсерін жынысы, нәсілі және жас топтары бойынша есептедік. ZCTA деңгейіндегі демографиялық деректер 2020 жылғы АҚШ халық санағы бюросының есептерінен алынды. Бұл көрсеткіштер тек топшамалар бойынша салмақтық коэффициенттер үшін пайдаланылды және өлім-жітімді есептеуге енгізілмеді. Тарихи талдау үшін (1999–2020) біз жылдық орташа PM2.5 концентрацияларын қолдандық және топшамалар үшін орташа әсер деңгейін жалпы халықтық орташа көрсеткішке қатысты пайызбен есептедік. 2026–2035 жылдарға арналған станцияларды пайдаланудан шығару сценарийлері аясында біз жиынтық әсерді есептедік. Қайта қаралған сценарий бойынша пайыздық өсім, қайта қаралған және бастапқы сценарийлер арасындағы айырмашылықты бастапқы сценарий көрсеткішіне бөлу арқылы анықталды.&lt;/p&gt;\n&lt;h4 id=\"medicare-halkhy-zhaene-bazalykh-oelim-zhitim-denggeji\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#medicare-halkhy-zhaene-bazalykh-oelim-zhitim-denggeji\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Medicare халқы және базалық өлім-жітім деңгейі&lt;/span&gt;&lt;/a&gt;Medicare халқы және базалық өлім-жітім деңгейі&lt;/h4&gt;\n&lt;p&gt;Medicare тіркеу деректері CMS есептерінен, ал 2026–2035 жылдарға арналған болжамдар Medicare Қамқоршылар есебінен алынды (SN5-кесте). ZCTA деңгейіндегі халық санын жобалау үшін ұлттық болжамдар 2019 жылғы үлестерге пропорционалды түрде бөлінді. Ұлттық тіркеу саны 2025 жылғы 69,5 миллионнан 2035 жылға қарай 81,3 миллионға дейін (шамамен 17% өсім) көтеріледі. Базалық өлім-жітім деңгейі 2019 жылғы деректер негізінде есептелді (SN6-кесте). Біз 2020 жылды емес, 2019 жылды таңдадық, себебі COVID-19 пандемиясы 2020 жылы өлім-жітім көрсеткіштерін жасанды түрде өсіріп жіберген еді (0,04377-ге қарсы 2019 жылы 0,03801).&lt;/p&gt;\n&lt;h4 id=\"statistikalykh-taldau\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#statistikalykh-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистикалық талдау&lt;/span&gt;&lt;/a&gt;Статистикалық талдау&lt;/h4&gt;\n&lt;p&gt;Өлім-жітім көрсеткіштері «станция – ZCTA – жыл» деңгейінде есептеліп, кейіннен жинақталды. Көмір PM2.5-пен байланысты өлім-жітім саны келесі формула бойынша анықталды: &lt;span class=\"yfm-latex\" data-content=\"B_%7Bi%2Cj%2Ct%7D%20%3D%20C_%7Bj%2Ct%7D%20%20imes%20E_%7Bj%2Ct%7D%20%20imes%20(1%20-%20%5Cexp(-%5Cbeta%20%20imes%20coalPM_%7Bi%2Cj%2Ct%7D))\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Мұндағы β (&lt;a href=\"concepts/mortality-response-coefficient.html\"&gt;өлім-жітімге жауап коэффициенті&lt;/a&gt;) 1 µ g/m³ үшін 1,0125 (CI: 1,0113–1,0137) салыстырмалы қауіпке сәйкес келеді. 2026–2035 жылдарға арналған жиынтық өлім-жітім барлық станциялар мен ZCTA-лар бойынша жинақталды. Сценарийлер арасындағы айырмашылық қосымша өлім-жітім ретінде бағаланды. Өлім-жітім бағаларының төменгі және жоғарғы шекаралары β коэффициентінің сенімділік интервалдары негізінде анықталды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Өлім-жітімге жауап коэффициенті (mortality-response coefficient) — ластаушы зат концентрациясының бір бірлікке артуы өлім қаупін қаншалықты арттыратынын көрсететін статистикалық өлшем.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"so2-shygharyndylary-men-pajdalanudan-shygharu-merzimderi-bojynsha-sezimtaldykhty-taldau\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#so2-shygharyndylary-men-pajdalanudan-shygharu-merzimderi-bojynsha-sezimtaldykhty-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SO2 шығарындылары мен пайдаланудан шығару мерзімдері бойынша сезімталдықты талдау&lt;/span&gt;&lt;/a&gt;SO2 шығарындылары мен пайдаланудан шығару мерзімдері бойынша сезімталдықты талдау&lt;/h4&gt;\n&lt;p&gt;Негізгі талдау жұмыс істеп тұрған станциялардың жылдық SO2 шығарындылары мен жабылу мерзімі алынып тасталған нысандардың жұмыс ұзақтығы туралы болжамдарға негізделді. Базалық деңгей ретінде 2023–2025 жылдардағы орташа жылдық шығарындылар алынды. Болашақ шығарындылар электр энергиясына сұранысқа немесе станцияның жұмыс қарқындылығына байланысты өзгеруі мүмкін болғандықтан, белгісіздікті бағалау үшін үш қосымша талдау жүргізілді. Олар шығарындылардың пропорционалды өзгеруін, әр генератордың жеке жұмыс диапазонын және қысқартылған жұмыс мерзімдерін қамтыды. Барлық талдауларда станция-ZCTA тұрақты әсерлері, SO₂-көмір PM2.5 серпімділігі, Medicare халық болжамдары және өлім-жітім коэффициенттері өзгеріссіз қалдырылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/analiz-chuvstvitelnosti.html\"&gt;Сезімталдықты талдау&lt;/a&gt; — бұл модельдің кіріс параметрлері өзгерген кезде нәтижелердің қаншалықты тұрақты екенін тексеру әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"shygharyndylardy-birkelki-masshtabtau-scenarijleri\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#shygharyndylardy-birkelki-masshtabtau-scenarijleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шығарындыларды біркелкі масштабтау сценарийлері&lt;/span&gt;&lt;/a&gt;Шығарындыларды біркелкі масштабтау сценарийлері&lt;/h4&gt;\n&lt;p&gt;Шығарындылардың жоғары немесе төмен болу салдарын бағалау үшін 2023–2025 жылдардағы орташа көрсеткіштердің 50%, 75%, 125% және 150% мәндері қолданылды. Бұл базалық деңгейден пропорционалды ауытқулар нәтижесінде жүктеменің қалай өзгеретінін көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"generatorgha-taen-shygharyndy-scenarijleri\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#generatorgha-taen-shygharyndy-scenarijleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Генераторға тән шығарынды сценарийлері&lt;/span&gt;&lt;/a&gt;Генераторға тән шығарынды сценарийлері&lt;/h4&gt;\n&lt;p&gt;Біркелкі масштабтау барлық станцияларға бірдей әсер етеді, сондықтан біз әр генератор үшін 2023–2025 жылдары тіркелген минималды және максималды жылдық SO2 шығарындыларын жеке талдадық. Бұл станция деңгейіндегі гетерогенділікті сақтайды және жақында байқалған төмен және жоғары шығарынды жағдайларын көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"zhabylu-merzimderi-bojynsha-balama-bolzhamdar\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#zhabylu-merzimderi-bojynsha-balama-bolzhamdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жабылу мерзімдері бойынша балама болжамдар&lt;/span&gt;&lt;/a&gt;Жабылу мерзімдері бойынша балама болжамдар&lt;/h4&gt;\n&lt;p&gt;Негізгі талдауда жабылу мерзімі алынып тасталған станциялар 2026–2035 жылдар аралығында жұмысын жалғастырады деп қаралды. Осы болжамның әсерін тексеру үшін біз жабылу мерзімін бастапқы мерзімнен 2 және 5 жылға кейінге шегердік. Белгіленген жабылу жылында ішінара жұмыс істеуді ескере отырып, күнтізбелік қолжетімділік үлесі қолданылды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca-f1.jpg\" alt=\"1-сурет. 2024 жылдың қаңтары мен 2026 жылдың қаңтары аралығында көмір электр станцияларын пайдаланудан шығару кестелерін\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. 2024 жылдың қаңтары мен 2026 жылдың қаңтары аралығында көмір электр станцияларын пайдаланудан шығару кестелеріне енгізілген өзгерістер.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет. 2024 жылдың қаңтары мен 2026 жылдың қаңтары аралығында көмір электр станцияларын пайдаланудан шығару кестелеріне енгізілген өзгерістер. 2024 жылғы қаңтардағы EIA-860M түгендеуіне сәйкес 2035 жылға дейін жабылуы жоспарланған АҚШ-тың 50 көмір электр станциясының картасы. Нүктелердің түсі 2026 жылғы қаңтардағы EIA-860M түгендеуіндегі жағдайды білдіреді: жабылған, өзгеріссіз, жабылуы кейінге қалдырылған немесе жабылу күні алынып тасталған. Нүкте өлшемі 2024 жылғы SO2 шығарындыларына пропорционал. Жабылуы кейінге қалдырылған немесе жабылу күні алынып тасталған 20 станция денсаулыққа әсерді талдауда пайдаланылған қайта қаралған станциялар жиынтығын құрайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca-f2.jpg\" alt=\"2-сурет. Көмір электр станцияларын жабудың кейінге қалдырылуына байланысты PM2.5 әсерінің жиынтық өсуі, 2026–2035 жж.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет. Көмір электр станцияларын жабудың кейінге қалдырылуына байланысты PM2.5 әсерінің жиынтық өсуі, 2026–2035 жж.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сурет. Көмір электр станцияларын жабудың кейінге қалдырылуына байланысты PM2.5 әсерінің жиынтық өсуі, 2026–2035 жж. (бастапқы сценариймен салыстырғанда). Қайта қаралған сценарий бойынша ZCTA деңгейіндегі PM2.5 әсерінің жиынтық айырмашылығы. Түстер 2026–2035 жылдар аралығындағы сценарийлер арасындағы PM2.5 әсерінің жиынтық айырмашылығын көрсетеді. Нүктелер жабылу күні кейінге қалдырылған көмір электр станцияларын білдіреді. Мәндер текше метр-жыл үшін микрограмммен келтірілген. Сұр аймақтар станция-ZCTA тарихи әсер коэффициенті есептелмеген ZCTA-ларды, ал ақ аймақтар халық санағының ZCTA қамту аймағынан тыс жерлерді білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca-f3.jpg\" alt=\"3-сурет. Жабылу күні кейінге қалдырылған 20 көмір электр станциясынан шығатын PM2.5 әсеріне байланысты Medicare бенефици\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет. Жабылу күні кейінге қалдырылған 20 көмір электр станциясынан шығатын PM2.5 әсеріне байланысты Medicare бенефициарлары арасындағы барлық себептер бойынша жиынтық өлім-жітім.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-сурет. Жабылу күні кейінге қалдырылған 20 көмір электр станциясынан шығатын PM2.5 әсеріне байланысты Medicare бенефициарлары арасындағы барлық себептер бойынша жиынтық өлім-жітім. Көк және қызыл сызықтар сәйкесінше бастапқы және қайта қаралған сценарийлер бойынша жиынтық өлім-жітімді көрсетеді. Штрихталған аймақтар PM2.5 өлім-жітімі бойынша «концентрация-жауап» функциясының төменгі және жоғарғы шектеріне негізделген бағалауларды көрсетеді. Жасыл бағандар бастапқы сценарийге қатысты қайта қаралған сценарий бойынша қосымша өлім-жітімді көрсетеді; қателік сызықтары «концентрация-жауап» функциясындағы белгісіздікті көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca-f4.jpg\" alt=\"4-сурет. Жабылудың кейінге қалдырылуына байланысты станциялар деңгейіндегі өлім-жітім жүктемесі, 2026–2035 жж.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет. Жабылудың кейінге қалдырылуына байланысты станциялар деңгейіндегі өлім-жітім жүктемесі, 2026–2035 жж.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-сурет. Жабылудың кейінге қалдырылуына байланысты станциялар деңгейіндегі өлім-жітім жүктемесі, 2026–2035 жж. Жабылуы кейінге қалдырылған көмір электр станцияларынан шығатын PM2.5 әсеріне байланысты Medicare бенефициарлары арасындағы барлық себептер бойынша жиынтық өлім-жітім, 2026–2035 жылдар үшін жинақталған. Көк бағандар бастапқы сценарий бойынша, ал қызыл бағандар қайта қаралған сценарий бойынша өлім-жітімді көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca-f5.jpg\" alt=\"5-сурет. Coleto Creek (TX), Limestone (TX) және Welsh (TX) станциялары үшін жабылудың кейінге қалдырылуына байланысты PM\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет. Coleto Creek (TX), Limestone (TX) және Welsh (TX) станциялары үшін жабылудың кейінге қалдырылуына байланысты PM2.5 әсерінің өсуі, 2026–2035 жж.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-сурет. Coleto Creek (TX), Limestone (TX) және Welsh (TX) станциялары үшін жабылудың кейінге қалдырылуына байланысты PM2.5 әсерінің өсуі, 2026–2035 жж. Карталар қайта қаралған сценарий бойынша бастапқы сценарийге қатысты 2026–2035 жылдардағы PM2.5 әсерінің жиынтық өсуін көрсетеді. Мәндер ZCTA деңгейінде болжам жылдары бойынша жинақталған және текше метр-жыл үшін микрограмммен келтірілген. Бұл үш станция болжанған қосымша өлім-жітімнің 82%-ын құрайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Көмір&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;станцияларының&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жабылуының&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;кешігуі&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;EIA деректері&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;және PM2.5&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;модельдеу&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;1256 қосымша&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;өлім жағдайы&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;AI инфрақұрылы&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мының&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;денсаулыққа&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;әсері&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a
