        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"148\" cy=\"126\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"572\" cy=\"284\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · PHYSIOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Жүректегі ортақ артериялық&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;дің: қан ағымы қалай жүреді?&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus-f1.jpg\" alt=\"Сурет 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Ортақ артериялық дің — бұл жүректің туа біткен ауыр ақауы, онда негізгі қан тамырлары туылғанға дейін бөлінбей қалады. Салдарынан оттегіге бай және кедей қан араласып, клапандарға түсетін жүктеме артады. Стэнфорд университетінің зерттеушілері науқастың жеке қан ағымының моделін жасап, отаға дейін және одан кейін қанның қалай қозғалатынын бақылады. Бұл жұмыс күрделі анатомиялық ақаулар кезінде жүрек қызметін қалпына келтіру механизмдерін түсінуге көмектеседі.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Ортақ артериялық дің гидродинамикасын зерттейтін алғашқы жұмыс.&lt;/li&gt;\n&lt;li&gt;Клапанның дұрыс жабылмауы өкпе артерияларындағы құйындарға байланысты.&lt;/li&gt;\n&lt;li&gt;Ақауы бар жүректе де қан ағымының қолайлы бөлінуі расталды.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеушілер қан мен төрт жармалы клапанның өзара әрекеттесуін модельдеу үшін «Immersed Boundary Method» әдісін қолданды. Тамырлар мен клапанның геометриясы науқастың компьютерлік томографиясы мен эхокардиография деректері негізінде құрылды. Клапан жармаларының серпімділік параметрлері науқастың нақты анатомиялық өлшемдеріне сәйкестендірілді.&lt;/p&gt;\n&lt;p&gt;Ағымдарды талдау Лагранж когерентті құрылымдары (LCS) және бөлшектерді қадағалау (LPT) арқылы жүргізілді. Отаға дейін клапан жармаларының асимметриялық қозғалысы мен қанның кері ағуы (регургитация) өкпе артерияларындағы төмен қысым мен құйындардың әсерінен болғаны анықталды. Модель қанның араласуына қарамастан, «қолайлы ағымдық бөліну» бар екенін көрсетті: сол қарыншадан қан негізінен аортаға, ал оң қарыншадан өкпе артерияларына бағытталады. Отадан кейін жүрек гидродинамикасы қалыпты жағдайға оралды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тек бір науқастың деректері негізінде жүргізілген, бұл нәтижелерді барлық жағдайға жалпылауға мүмкіндік бермейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Жалпы артериялық дің (ЖАД) — бұл жүректен шығатын екі негізгі артерияның іштей даму кезінде бөлінбей қалуынан туындайтын сирек кездесетін және ауыр туа біткен жүрек ақауы. Нәтижесінде бір дің мен бір клапан қалыптасып, олар арқылы аралас қан ағады. Науқастардың шамамен 25%-ында төрт жармалы клапан кездеседі, бұл көбінесе регургитацияға бейім және қайта ота жасауды қажет етеді. Клапан мен қан ағымының өзара әрекеттесуінің маңыздылығына қарамастан, ЖАД кезіндегі гидродинамика толық зерттелмеген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ЖАД магистральдық қан тамырлардың бөлінбеуімен сипатталады, ал науқастардың 25%-ында клапан дисфункциясына бейім төрт жармалы клапан болады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ЖАД-қа ота жасалғанға дейінгі және кейінгі компьютерлік томография деректері негізінде сұйықтық пен құрылымның өзара әрекеттесуін модельдеу жүргізілді. Төрт жармалы клапанның геометриясы икемділік негізінде құрылды, ал еркін жиек ұзындығы мен биіктігі эхокардиография деректерінен алынды. Қан мен клапанның өзара әрекеттесуі «Immersed Boundary Method» (батырылған шекаралар әдісі) арқылы модельденді. Шекаралық шарттар әр науқастың жеке деректеріне сәйкес бапталды. Қанның араласуын және ағыс бағыттарын зерттеу үшін Лагранж когерентті құрылымдары (LCS) және Лагранж бөлшектерін қадағалау (LPT) әдістері қолданылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Immersed Boundary Method» — сұйықтық ағынындағы икемді денелердің (мысалы, клапан жармаларының) қозғалысын есептеуге арналған математикалық тәсіл.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Төмен қысым мен өкпе артерияларының (ӨА) бір жақты орналасуы жүрек циклі бойы жармалардың қозғалысына әсер етіп, асимметриялық жабылуға және регургитацияға әкелетіні анықталды. Аортадағы голодиастолалық кері ағыс ӨА-ға қан жеткізуді және регургитациялық ағынды қамтамасыз етеді. LCS және LPT талдаулары оксигенделген қанның сол жақ қарыншадан аортаға, ал деоксигенделген қанның оң жақ қарыншадан ӨА-ға бағытталғанын көрсетті. Отадан кейін қалыпты гемодинамика қалпына келді.&lt;/p&gt;\n&lt;p&gt;Бұл ЖАД гидродинамикасын зерттеу бойынша алғашқы жұмыс. Жеке модельдерде ағынды талдаудың сапалық және сандық әдістерін қолдана отырып, ӨА-ның бір жақты шығуынан туындаған гемодинамикалық бұзылыстар анықталды және отадан кейін қалыпты гемодинамиканың қалпына келуі көрсетілді. Зерттеу қан ағымының қолайлы таралуы (streaming) аралас қан ағымы бар ақауларда маңызды механизм екенін растады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу жеке науқастардың модельдеріне негізделген, сондықтан нәтижелерді анатомиялық ерекшеліктерді ескере отырып бағалау қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"truncus-arteriosus-ta-turaly-zhalpy-maelimet\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#truncus-arteriosus-ta-turaly-zhalpy-maelimet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Truncus arteriosus (TA) туралы жалпы мәлімет&lt;/span&gt;&lt;/a&gt;Truncus arteriosus (TA) туралы жалпы мәлімет&lt;/h4&gt;\n&lt;p&gt;Truncus arteriosus (TA) — бұл жүректің екі негізгі артериясы эмбрионалды даму кезінде бөлінбей қалуынан туындайтын сирек кездесетін және ауыр туа біткен жүрек ақауы. Нәтижесінде бірыңғай артериялық дің мен бір клапан түзіледі, ол арқылы веноздық және артериялық қан қоспасы өтеді. Қарыншааралық перде ақауы (ҚАП) екі қарыншадан да қанның осы клапанға келуін қамтамасыз етеді, ал өкпе артериялары тікелей аортадан шығады. Өкпе артерияларындағы қан ағымы көбінесе аортадағы ағымнан үш есе жоғары болып, бұл өкпе гиперциркуляциясына әкеледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TA ортақ артериялық дің мен өкпе гиперциркуляциясымен сипатталады, бұл өмірдің алғашқы апталарында хирургиялық түзетуді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"hirurgiya-zhaene-klapan-morfologiyasy\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#hirurgiya-zhaene-klapan-morfologiyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Хирургия және клапан морфологиясы&lt;/span&gt;&lt;/a&gt;Хирургия және клапан морфологиясы&lt;/h4&gt;\n&lt;p&gt;TA-ны хирургиялық түзету ҚАП-ты жабуды, өкпе артерияларын аортадан бөлуді және оң қарынша үшін клапанды кондуит орнатуды қамтиды. Операцияның сәттілігі транкустық клапанның функциясына тікелей байланысты. Көбінесе клапан жармалары қалыңдаған және диспластикалық болады. Көп жағдайда клапан үш жармалы болғанымен, 25% науқастарда төрт жармалы морфология кездеседі (7 фенотипке бөлінеді). Мұндай науқастардың үштен бірінен астамы клапан сақинасының кеңеюі салдарынан туындайтын регургитация себебінен қайта операцияға мұқтаж болады, бұл ретте трикуспидализация ең төзімді әдіс болып саналады.&lt;/p&gt;\n&lt;h4 id=\"kholdanystaghy-zertteulerge-sholu\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#kholdanystaghy-zertteulerge-sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қолданыстағы зерттеулерге шолу&lt;/span&gt;&lt;/a&gt;Қолданыстағы зерттеулерге шолу&lt;/h4&gt;\n&lt;p&gt;Эхокардиография қолданылғанымен, TA-дағы гемодинамиканы инженерлік тұрғыдан зерттеу әлі де жеткіліксіз. Бұрын шошқа жүрегінің модельдерінде жүргізілген зерттеулер төрт жармалы клапандардың үш жармалыларға қарағанда асинхронды жабылуын және баяу кинематикасын көрсеткен. Сонымен қатар, қалыпты аорта клапандарының гидродинамикасы, оның ішінде ашылу кезіндегі құйын түзілуі және жабылу механизмдері егжей-тегжейлі зерттелген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Регургитация — клапан толық жабылмаған кезде қанның кері ағуы, бұл жүрекке қосымша жүктеме түсіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zertteu-makhsaty-men-aedisteri\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#zertteu-makhsaty-men-aedisteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу мақсаты мен әдістері&lt;/span&gt;&lt;/a&gt;Зерттеу мақсаты мен әдістері&lt;/h4&gt;\n&lt;p&gt;TA-ның күрделі анатомиясы қан ағымын талдауды қиындатады. Қанның «артықшылықты ағымы» (streaming) теориясы бар болғанымен, TA үшін бұл әлі дәлелденбеген. Бұл жұмыс TA гидродинамикасын зерттеу бойынша алғашқы еңбек болып табылады. Авторлар пациентке тән модельдерде сапалық және сандық талдау әдістерін қолданып, хирургиялық түзетуге дейінгі және кейінгі гемодинамиканы бағалады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу пациентке тән модельдерге негізделген, сондықтан нәтижелерді барлық TA науқастарына толықтай қолдануда сақтық таныту қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"trunkus-arteriozusyn-tuezetkennen-kejingi-gemodinamika-zhaene-klapan-funkciyasy\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#trunkus-arteriozusyn-tuezetkennen-kejingi-gemodinamika-zhaene-klapan-funkciyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Трункус артериозусын түзеткеннен кейінгі гемодинамика және клапан функциясы&lt;/span&gt;&lt;/a&gt;Трункус артериозусын түзеткеннен кейінгі гемодинамика және клапан функциясы&lt;/h4&gt;\n&lt;p&gt;Бұған дейін біз клапан жармаларына тікелей араласусыз жалпы артериялық діңді (трункус) түзетуге дейінгі және одан кейінгі гемодинамикалық факторлардың клапан жұмысына әсерін бағалаған болатынбыз. Біздің есептеу модельдеріміз операция барысында өзгеретін фенотиптерді қайта жаңғыртуға және операциядан кейінгі клапан жұмысын жақсарту механизмдерін анықтауға қабілетті екенін көрсетті. Бұл біздің тәсіліміздің клиникалық маңыздылығы мен қолданылу мүмкіндігін растады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әзірленген есептеу модельдері операциядан кейінгі гемодинамикалық өзгерістерді сәтті көрсетеді, бұл хирургиялық араласудың тиімділігін бағалауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ағымдағы зерттеуде біз трункус артериозус (ТА) кезіндегі гидродинамиканы және оның оттегімен қаныққан және қанықпаған қанның араласу процестерімен байланысын түсіну үшін классикалық ағын талдауы құралдарын қолдандық (1-сурет). Қан ағымы, клапан анатомиясы және қан тамырлары арасындағы жеке сұйықтық-құрылымдық өзара әрекеттесуді (fluid-structure interaction) модельдеу арқылы біз операцияға дейінгі жағдайда қалыптан тыс гидродинамиканың бар екенін көрсеттік. Сондай-ақ, хирургиялық түзету ағын параметрлерін сау жүрек көрсеткіштеріне жақын деңгейге дейін қалпына келтіретіні көрсетілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сұйықтық-құрылымдық өзара әрекеттесу (FSI) — бұл қан ағымы мен қан тамырлары немесе клапандардың деформацияланатын қабырғалары арасындағы өзара әсерді ескеретін компьютерлік модельдеу әдісі, ол жүрек-қан тамырлары ауруларын талдау үшін өте маңызды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"gemodinamika,-tolkhyn-pishinderi-zhaene-zharmalar-kinematikasy\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#gemodinamika,-tolkhyn-pishinderi-zhaene-zharmalar-kinematikasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гемодинамика, толқын пішіндері және жармалар кинематикасы&lt;/span&gt;&lt;/a&gt;Гемодинамика, толқын пішіндері және жармалар кинематикасы&lt;/h4&gt;\n&lt;p&gt;Операцияға дейінгі жағдайда пациенттің анатомиясы ортақ артериялық бағанадан (ОАБ) сол жақтан шығатын өкпе артерияларының (ӨА) тармақтарымен сипатталды. ӨА шығу орындарына проксимальды орналасқан клапан жармаларына сол және алдыңғы жармалар жатты, ал оң және артқы жармалар қарама-қарсы жақта болды. ӨА-ның асимметриялық орналасуы және өкпе қан айналымындағы төмен қысым қалыптан тыс гемодинамикаға әкелді: ӨА «төмен қысым резервуары» қызметін атқарды, бұл клапаннан кейін қысымның төмендеуіне себеп болды. Клапандағы регургитация және ӨА-дағы тура қан ағымы аортадан келетін голодиастолалық ағыммен қамтамасыз етілді. Хирургиялық түзету гемодинамиканы қалыпқа келтіріп, аорталық ағымды қалпына келтірді және регургитацияны айтарлықтай азайтты (3-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ОАБ-ны хирургиялық жолмен түзету клапаннан кейінгі қалыптан тыс төмен қысымды және голодиастолалық регургитацияны жойып, ағым профильдерін қалыпқа келтірді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Операцияға дейін бағанада сыртқы қисықтыққа бағытталған асимметриялық ағым және систола кезінде ішкі қисықтық бойымен ретроградтық ағым байқалды. ӨА-дағы ағым жылдамдығы аортадағыдан айтарлықтай жоғары болды. Клапан жабылған кезде, бағанадағы ағым баяулап, бағытын өзгертті, ал ӨА-да тура ағым сақталды. Диастола кезінде аортадан клапан арқылы оң қарыншаға (ОҚ) ретроградтық ағым байқалды. Операциядан кейін (4-сурет) диастоладағы ағым қозғалысы айтарлықтай азайды және голодиастолалық кері ағым жойылды.&lt;/p&gt;\n&lt;p&gt;Қысым мен ағым қисықтарын талдау (5A-сурет) операцияға дейін ОҚ-ның соққы көлеміне қосқан үлесі сол қарыншадан (СҚ) 25%-ға жоғары болғанын, систола кезіндегі ең жоғары жылдамдықтар 16,25 мл/с (СҚ) және 26,67 мл/с (ОҚ) болғанын көрсетті. Регургитацияны есептемегендегі жалпы соққы көлемі 4,87 мл, клапаннан кейінгі ең жоғары ағым 42,76 мл/с болды. Клапан аймағындағы операцияға дейінгі Рейнольдс саны 1721-ді құрады, операциядан кейін ол 618-ге дейін төмендеді, систола кезіндегі ең жоғары ағым 31,14 мл/с-қа тең болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Рейнольдс саны — ағымның инерция және тұтқырлық күштерінің қатынасын сипаттайтын өлшемсіз шама; жоғары мәндер турбуленттілікті, төмен мәндер ламинарлық (тәртіпті) ағымды білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жүйелік және өкпе қан айналымы арасындағы қысым айырмашылығы 3,2:1 қатынасындағы ағымды тудырды. Операцияға дейін бағанадағы қысым қалыптан тыс төмен болып, аорталық және өкпелік қысымдар аралығында болды. ӨА-ның асимметриясы жармалардың біркелкі емес жабылуына әкелді (5B-сурет). Систола кезіндегі максималды ығысу: сол — 3,6 мм, алдыңғы — 3,7 мм, артқы — 3,0 мм, оң — 2,7 мм. Коаптация биіктігі (жармалардың түйісу аймағы) геометриялық биіктіктің 20,0%-ын құрады. Түзетуден кейін жабылу симметриялырақ болды (оң — 3,3 мм, артқы — 4,3 мм, сол — 4,3 мм, алдыңғы — 3,6 мм), ал коаптация биіктігі 30,8%-ға дейін артты.&lt;/p&gt;\n&lt;h4 id=\"khujyndardyng-damuy-men-ydyrauy\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#khujyndardyng-damuy-men-ydyrauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Құйындардың дамуы мен ыдырауы&lt;/span&gt;&lt;/a&gt;Құйындардың дамуы мен ыдырауы&lt;/h4&gt;\n&lt;p&gt;Систолалық үдеу кезінде қақпақша ашылып, бастапқы құйын қалыптасады. Оның пішіні жапырақшалар геометриясы мен гемодинамикаға байланысты. Төрт жапырақшалы қақпақта төрт бөлікті құйын байқалады, алайда қан тамырларының анатомиясы оған қатты әсер етеді. Операцияға дейінгі жағдайда өкпе артерияларындағы (ӨА) бойлық құйындар бүкіл жүрек циклі бойы сақталып, қақпақша ашылғанда бастапқы құйынмен қосылып кеткен (6A-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Операцияға дейінгі жағдайда құйындар тұрақсыз және тез ыдырайды, ал диастола кезінде оң қарыншаға регургитация байқалады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Операцияға дейін құйын онша когерентті болмай, тез бұзылған. Систолада магистральдың ішкі қисығы бойында ұсақ құйындар, ал диастолада оң қарыншаға бағытталған регургитация ағыны байқалған. Операциядан кейін (ӨА алынған соң), құйынның үш жағы қақпақша тесігіне параллель қалып, төртіншісі аорта қисығы бойымен созылған «шаш қыстырғыш» пішінді құйынды түзеді. Диастолада аортада когерентті құрылымдар анықталмады, бұл турбуленттіліктің толық басылғанын білдіреді.&lt;/p&gt;\n&lt;h4 id=\"lagranzh-kogerentti-khurylymdary\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#lagranzh-kogerentti-khurylymdary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Лагранж когерентті құрылымдары&lt;/span&gt;&lt;/a&gt;Лагранж когерентті құрылымдары&lt;/h4&gt;\n&lt;p&gt;Операцияға дейінгі жағдайдағы Лагранж когерентті құрылымдары (LCS) қарыншааралық перде ақауы (ҚАПА) бойындағы айқын материалдық бетті және систола кезінде қақпақша деңгейіндегі ӨА әсерін көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Лагранж когерентті құрылымдары (LCS) және FTLE өрістері — бұл сұйықтық ағынының «қаңқасын» визуализациялайтын математикалық әдістер, олар әртүрлі ағын мінез-құлқы бар аймақтарды бөліп тұратын шекараларды көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;FTLE өрісінің локальды максимумдарымен анықталатын материалдық бет масса тасымалдау үшін тосқауыл қызметін атқарады. Операцияға дейін мұндай бет ҚАПА және магистраль қақпақшасы бойымен өткен. FTLE визуализациясы бұл беттің аортаға бағытталған ағынды ӨА-ға бағытталған ағыннан бөліп тұратынын көрсетті. ӨА әсері қақпақшаға дейін жеткен. Қақпақша арқылы өтетін ағын оң қарыншадан ӨА-ға және магистральдан аортаға бағытталған бөліктерге бөлінген. Операциядан кейін, ӨА жоқтығына байланысты, FTLE өрістері аорта ағынының ауытқуын және реконструкция аймағындағы рециркуляция аймақтарын көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"oksigendelgen-zhaene-dezoksigendelgen-khan-aghynynyng-uelgileri\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#oksigendelgen-zhaene-dezoksigendelgen-khan-aghynynyng-uelgileri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оксигенделген және дезоксигенделген қан ағынының үлгілері&lt;/span&gt;&lt;/a&gt;Оксигенделген және дезоксигенделген қан ағынының үлгілері&lt;/h4&gt;\n&lt;p&gt;Бөлшектерді Лагранж әдісімен бақылау сол және оң қарыншалардан келетін қанның қақпақшаға қарай спираль түрінде қозғалатынын көрсетті (6C-сурет). Ағындар арасындағы шекаралық бет аортаға кіргенге дейін сақталады, бұл систола кезінде ҚАПА деңгейінде қан араласуының минималды екенін растайды. Систоланың көп бөлігінде оң қарыншадан келетін дезоксигенделген қан ӨА-ға, сол қарыншадан келетін оксигенделген қан аортаға бағытталады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қарыншалардан келетін ағындардың бөлінуі науқастағы жоғары сатурацияны (21% FiO2 кезінде 93%) түсіндіреді, бұл жалпы артериялық магистральда қанның тиімді араласу гипотезасын растайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Систола соңында ағын бәсеңдегенде, аортадан қайтқан қан ӨА деңгейінде араласуды тудырады. Диастолада ағын шекаралары айқын емес. Бұл деректер жалпы артериялық магистралі бар науқаста клиникалық тұрғыдан тіркелген жоғары сатурацияны (21% FiO2 кезінде 93%) түсіндіреді және анатомиялық ақау болса да, қан ағындарының тиімді бөлінуі мүмкін екенін дәлелдейді.&lt;/p&gt;\n&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;p&gt;Бұл зерттеу truncus arteriosus (TA) гидродинамикасын зерттеген алғашқы жұмыс болып табылады. Біз қалыптан тыс гидродинамика өкпе артерияларының (ӨА) орналасуына қатты тәуелді екенін көрсеттік; олар төмен қысым аймағы ретінде әрекет етіп, трункустық ағын мен клапан арасында асимметриялық өзара әрекеттесуді тудырады. Хирургиялық операция кезінде ӨА ажырату қалыпты гидродинамиканы қалпына келтіреді және клапан регургитациясын айтарлықтай азайтады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ӨА-ның бір жақты орналасуы қысым градиентін тудырып, ағынның асимметриясына және клапан жармаларының толық жабылмауына әкеледі, бұл регургитацияны күшейтеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ағын асимметриясының негізгі себебі — жүйелік қан айналымына қарағанда өкпе айналымындағы қысымның төмендігі және өкпе тамырларының кедергісінің аздығы. Трункустық клапан арқылы өтетін ағынның бұрылыстылығы (вортиктілігі) ӨА бойымен бағытталған вортикстерді (құйынды ағындарды) қалыптастырады. Бұл төмен қысымды вортикстер клапан астындағы қысым өрісін біркелкі емес етеді, нәтижесінде систола кезінде клапан жармалары біркелкі емес ашылады және диастола басында кешігіп жабылады. Бұл жармалардың толық жанаспауына (коаптацияның бұзылуына) және регургитацияға әкеледі. Тамыр геометриясының қайта құрылуы (синустар мен синотубулярлы түйісу) жармалардың жұмысын жақсартады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Коаптация — клапан жармаларының бір-біріне тығыз жабысып, қанның кері ағуына тосқауыл қою процесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;TA әдетте қанның толық араласуымен сипатталатын ақау болса да, біз сол жақ қарыншадан (СЖҚ) қолқаға және оң жақ қарыншадан (ОЖҚ) ӨА-ға қанның ішінара бөлініп ағуын (стриминг) анықтадық. FTLE өрістері мен Лагранж бөлшектерін бақылау клапаннан өткенге дейін қан ағындарының араласуы өте аз екенін растады. Бұл пациентте байқалған жоғары оттегі сатурациясын түсіндіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу сандық ағын өрістеріне негізделген, сондықтан болашақта адвекция-диффузия модельдері арқылы сандық бағалауды қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;p&gt;Біз қан ағыны, клапан және тамыр анатомиясы арасындағы өзара әрекеттесуді (FSI) модельдеу үшін эхокардиография деректерін қолдандық. Төрт жармалы клапанды құру үшін валидацияланған тәсіл қолданылды. Қарыншалардың жиырылуы нәтижесінде туындайтын уақытқа тәуелді ағын камераны белсендіру моделі арқылы симуляцияланды. Ағынды бағалау үшін СЖҚ және ОЖҚ-ға сәйкесінше «оттегімен қаныққан» және «оттегімен қанықпаған» бөлшектер енгізілді. Болашақта ӨА орналасуын параметрлеу және адвекция-диффузиялық модельдеу арқылы дәлірек нәтижелерге қол жеткізу жоспарлануда.&lt;/p&gt;\n&lt;h3 id=\"aedister1\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#aedister1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"gidrodinamika-men-klapan-khurylymyn-modeldeu\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#gidrodinamika-men-klapan-khurylymyn-modeldeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гидродинамика мен клапан құрылымын модельдеу&lt;/span&gt;&lt;/a&gt;Гидродинамика мен клапан құрылымын модельдеу&lt;/h4&gt;\n&lt;p&gt;Клапан жармалары мен қан тамырлары қабырғаларының қан ағынымен өзара әрекеттесуі IBAMR бағдарламалық кітапханасында жүзеге асырылған Immersed Boundary Method әдісі арқылы модельденді. Сұйықтық тығыздығы &lt;span class=\"yfm-latex\" data-content=\"%5Crho%20%3D%201.0\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; г/см³ және динамикалық тұтқырлығы µ = 0.04 Пуаз болатын сығылмайтын орта ретінде қарастырылды. Навье-Стокс теңдеулеріне сұйықтыққа әсер ететін құрылымдық күштер қосылды. Барлығы үш жүрек циклі модельденді, талдау үшін екінші цикл алынды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Immersed Boundary Method — бұл иілгіш құрылымдардың (мысалы, клапан жармалары) тұтқыр сұйықтықпен өзара әрекеттесуін модельдеуге мүмкіндік беретін есептеу әдісі, мұнда объект шекаралары ағын торына «батырылады».&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"klinikalykh-derekter-zhaene-geometriya\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#klinikalykh-derekter-zhaene-geometriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Клиникалық деректер және геометрия&lt;/span&gt;&lt;/a&gt;Клиникалық деректер және геометрия&lt;/h4&gt;\n&lt;p&gt;Жаңа туған нәресте пациент операцияға дейінгі және кейінгі кескіндердің болуы және клапанда хирургиялық өзгерістердің жоқтығы негізінде таңдалды. Пациентке төрт жармалы клапан (А түрі) және артериялық дің (II түрі) диагнозы қойылды. КТ кескіндерін сегменттеу SimVascular бағдарламасында жүргізіліп, қан тамырларының 3D геометриясы жасалды (Сурет 2A).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus-f2.jpg\" alt=\"Сурет 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 2&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"klapandy-zhobalau-zhaene-shekaralykh-sharttar\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#klapandy-zhobalau-zhaene-shekaralykh-sharttar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Клапанды жобалау және шекаралық шарттар&lt;/span&gt;&lt;/a&gt;Клапанды жобалау және шекаралық шарттар&lt;/h4&gt;\n&lt;p&gt;Төрт жармалы клапан серпімділікке негізделген дизайн тәсілі арқылы құрылды. Жармалардың гетерогенді талшықты құрылымы мен материалдың қаттылығы тепе-теңдік теңдеулері арқылы анықталды (Сурет 2B). Пациентке тән еркін жиек ұзындығы (FEL) және геометриялық биіктігі (GH) эхокардиография арқылы өлшенді. Операцияға дейінгі конфигурация үшін FEL 7.56 мм және GH 6.5 мм, ал операциядан кейінгі үшін FEL 8.95 мм және GH 6.5 мм болып белгіленді (Сурет 2C). Шекаралық шарттар 3D FSI модельдеулері мен svZeroDSolver көмегімен 0D модель арасындағы итерациялар арқылы реттелді (Сурет 2C).&lt;/p&gt;\n&lt;h4 id=\"aghyn-men-kinematikany-taldau\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#aghyn-men-kinematikany-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ағын мен кинематиканы талдау&lt;/span&gt;&lt;/a&gt;Ағын мен кинематиканы талдау&lt;/h4&gt;\n&lt;p&gt;Ағын өрісін бағалау үшін жылдамдықтың бойлық компоненті u_s есептелді. Қысым мен ағын толқындары кіріс (LV, RV) және шығыс (аорта, LPA, RPA) бөліктерінде, сондай-ақ клапан комиссураларынан 0.12 см жоғары деңгейде талданды. Жармалар кинематикасы орталық ұшын бақылау және диастола кезінде коаптация нүктесіне дейінгі қашықтықты есептеу арқылы бағаланды. Құйынның дамуы Q-критерийімен, ал көлік кедергілері FTLE арқылы визуализацияланды. Қанның араласуы массасыз Лагранж бөлшектері арқылы бақыланды: LV-ден бөлшектер (қызыл) және RV-ден бөлшектер (көк) клапан ашылғанға дейін жіберіліп, екінші цикл бойы қадағаланды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus-f1.jpg\" alt=\"Сурет 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus-f3.jpg\" alt=\"3-сурет: Операцияға дейінгі конфигурация: тамырлардың сәйкес осьтік сызықтарына жанама ағын бойындағы u жылдамдық компон\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет: Операцияға дейінгі конфигурация: тамырлардың сәйкес осьтік сызықтарына жанама ағын бойындағы u жылдамдық компоненті және бір жүрек циклі ішіндегі (t = (0,55, 0,90) с) клапанның жоғарыдан көрінісі. Өкпе артерияларындағы бүкіл жүрек циклі ішіндегі тікелей қан ағымы да, клапан регургитациясы да аортадағы голодиастолалық кері ағынмен қамтамасыз етілді. Трункальды клапан арқылы өтетін регургитациялық ағын оң қарыншаға түсті.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus-f4.jpg\" alt=\"4-сурет: Операциядан кейінгі конфигурация: тамырлардың сәйкес осьтік сызықтарына жанама ағын бойындағы u жылдамдық компо\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет: Операциядан кейінгі конфигурация: тамырлардың сәйкес осьтік сызықтарына жанама ағын бойындағы u жылдамдық компоненті және бір жүрек циклі ішіндегі (t = (0,55, 0,90) с) клапанның жоғарыдан көрінісі. Трункустағы хирургиялық араласу тікелей аорталық ағын, клапаннан төмен қалыпты қысым және клапан регургитациясының айтарлықтай төмендеуі сияқты күтілетін гемодинамиканы қалпына келтірді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus-f5.jpg\" alt=\"5-сурет: (A) Кіріс (сол қарынша, оң қарынша) және шығыс (аорта, сол және оң өкпе артериясы) бөліктеріндегі кеңістік бойы\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет: (A) Кіріс (сол қарынша, оң қарынша) және шығыс (аорта, сол және оң өкпе артериясы) бөліктеріндегі кеңістік бойынша орташаланған операцияға дейінгі және операциядан кейінгі қысым мен ағын толқындарының пішіндері.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-сурет: (A) Кіріс (сол қарынша, оң қарынша) және шығыс (аорта, сол және оң өкпе артериясы) бөліктеріндегі кеңістік бойынша орташаланған операцияға дейінгі және операциядан кейінгі қысым мен ағын толқындарының пішіндері. Жасыл қисық («Клапан») клапаннан тікелей дистальды орналасқан, клапан комиссурасы деңгейінен 0,12 см жоғары (операцияға дейінгі конфигурация үшін өкпе артериясының басталуынан төмен) кесіндіде есептелген кеңістік бойынша орташаланған ағын мен қысымды сипаттайды. Өкпе артериялары қысым ағыны ретінде әрекет еткендіктен, клапаннан тікелей төмен қысым деңгейлері операцияға дейінгі конфигурацияда операциядан кейінгіге қарағанда төменірек. (B) Операцияға дейінгі және операциядан кейінгі конфигурациялар үшін бір жүрек циклі ішіндегі жармалар кинематикасы. Өкпе артерияларының бір жақты орналасуы нәтижесінде пайда болған ағынның біркелкі емес өрісі мен трункальды клапан арасындағы өзара әрекеттесу клапанның асимметриялық жабылуына әкелді. Жармалар жұптасып ашылып, жабылды, бұл ретте өкпе артерияларынан жоғары орналасқан жармалар кеңірек ашылып, кешірек жабылды. Трункусты түзету арқылы сау гемодинамиканы қалпына келтіру клапанның неғұрлым симметриялы жабылуына әкелді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus-f6.jpg\" alt=\"6-сурет: (A) Операцияға дейінгі және операциядан кейінгі конфигурацияда клапан ашылғаннан кейінгі, систола шыңындағы жән\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сурет: (A) Операцияға дейінгі және операциядан кейінгі конфигурацияда клапан ашылғаннан кейінгі, систола шыңындағы және диастола ортасындағы бастапқы құйын үшін клапан сақинасы жазықтығына нормаль жылдамдық компоненті бойынша боялған Q-критерийінің…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;6-сурет: (A) Операцияға дейінгі және операциядан кейінгі конфигурацияда клапан ашылғаннан кейінгі, систола шыңындағы және диастола ортасындағы бастапқы құйын үшін клапан сақинасы жазықтығына нормаль жылдамдық компоненті бойынша боялған Q-критерийінің изо-беттері. Төрт жармалы клапан морфологиясы төрт қалақшалы бастапқы құйынды жасады. Трункустағы операцияға дейін өкпе артерияларындағы ағын бойындағы құйындар бүкіл жүрек циклі ішінде сақталып, трункустағы ағын өрісі мен құйын динамикасына әсер етті. (B) Лагранж когерентті құрылымдары (LCS): операцияға дейінгі және операциядан кейінгі конфигурация үшін тікелей шекті уақыттық Ляпунов көрсеткішінің (FTLE) скалярлық өрістері. Уақыт сәттері мен масштабтау ағынның тиісті сипаттамаларына негізделіп таңдалды. Қарыншааралық перде ақауы (ҚАП) бойында араласу деңгейі елеусіз болатын айқын материалдық бет анықталды. LCS систола кезінде клапан деңгейінде өкпе артерияларының әсерін анықтады. Диастола кезінде аортаның сыртқы қисығынан ағын өкпе артерияларына кірді. Трункустағы операциядан кейін төрт жармалы клапанның арқасында шаршы пішінді аорталық ағынмен және диастола кезіндегі елеусіз ағынмен систолалық гемодинамика қалпына келтірілді. (C) Лагранж бөлшектерін қадағалау: сол және оң қарыншаларда орналастырылған «оттегімен қаныққан» (қызыл) және «оттегімен қанықпаған» (көк) бөлшектердің әртүрлі көру бұрыштарында және жүрек циклінің әртүрлі уақыт нүктелерінде таралуы. Бөлшектер клапан ашылғанға дейін орналастырылады және бір жүрек циклі ішінде қадағаланады. Лагранж бөлшектерін қадағалау оң қарыншадан өкпе артерияларына және сол қарыншадан аортаға қарай оттегімен қаныққан және қанықпаған ағындардың қолайлы бөлінуін анықтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&
