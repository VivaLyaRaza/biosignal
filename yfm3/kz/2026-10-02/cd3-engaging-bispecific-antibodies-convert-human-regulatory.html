мдеуге дейінгі (C1-ге дейін) және кейінгі (C3-тен кейін) PD-1 (CD279), 4-1BB (CD137) және NKG7 (CD314) медианалық флуоресценция қарқындылығы (MFI). (I) Терапияның C1-ге дейін және C3-тен кейін науқастардың перифериялық қанында гранзим A (GZMA) бірлесіп экспрессиялайтын FOXP3⁺ Tregs-тің репрезентативті жасушаішілік FACS-графиктері мен сандық бағалауы. (G–I) панельдері жұпталған t-критерийлері арқылы талданды. Деректер перифериялық қан үлгілерін ағындық цитометриялық талдау арқылы алынған. (J) Бірлескен өсіру жүйесіне шолу. BCMA — B-жасушасының жетілу антигені. MM — көптік миелома. PBMC — перифериялық қанның мононуклеарлы жасушалары. (K) Блинатумомабпен (αCD3×αCD19), OKT3-пен (αCD3) немесе Теклистамабпен (αCD3×αBCMA) өңделген сау донор Tregs-імен 48 сағаттық бірлескен өсіруден кейінгі MM1.S жасушаларының тіршілік қабілеттілігі. Екі факторлы дисперсиялық талдау (ANOVA) (n=6). (L) Теклистамабтың артып келе жатқан концентрацияларымен өңделген Tregs-пен 48 сағаттық бірлескен өсіруден кейінгі MM1.S жасушаларының тіршілік қабілеттілігі (n=3). (M) OKT3-тің эквимолярлы концентрацияларымен өңделген Tregs-пен 48 сағаттық бірлескен өсіруден кейінгі MM1.S жасушаларының тіршілік қабілеттілігі (n=3). (N) Сол емдеу жағдайында 72 сағаттық бірлескен өсіруден кейінгі цитокин секрециясы (Гранзим A, Гранзим B). Екі факторлы дисперсиялық талдау (ANOVA) (n=6). (O) In vitro теклистамабпен өңделген Tregs пен өңделмеген бақылау тобы арасындағы цитотоксикалық және желіні анықтайтын гендердің орташа экспрессиясын салыстыратын жылу карталары. Деректер bulk-РНҚ секвенирлеу арқылы алынған. (P) Seahorse XF көмегімен өлшенген 48 сағаттық бірлескен өсіруден кейінгі өңделмеген және теклистамабпен өңделген Tregs пен пан-Т-жасушаларының оттегін тұтыну жылдамдығы (OCR). Қайталанатын өлшемдері бар бір факторлы дисперсиялық талдау (ANOVA) (n=5).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory-f4.jpg\" alt=\"4-сурет. IMiD-тер биспецификалық нысандар мен гематологиялық қатерлі ісіктерге қарамастан, Treg жасушаларының BTCE/AP-1 \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет. IMiD-тер биспецификалық нысандар мен гематологиялық қатерлі ісіктерге қарамастан, Treg жасушаларының BTCE/AP-1 арқылы басқарылатын цитотоксикалық қайта бағдарламалануын күшейтеді.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-сурет. IMiD-тер биспецификалық нысандар мен гематологиялық қатерлі ісіктерге қарамастан, Treg жасушаларының BTCE/AP-1 арқылы басқарылатын цитотоксикалық қайта бағдарламалануын күшейтеді. (A) Жоғарыда: терапиядан кейінгі (C3-тен кейін) және дейінгі (C1-ге дейін) алынған сүйек кемігі үлгілерінен бөлінген Treg жасушаларында BATF локусындағы дифференциалды хроматин қолжетімділігін көрсететін ATAC-seq тректері. Төменде: AP-1 отбасы мотивтерінің репрезентативті еселенген байытылуын көрсететін дифференциалды қолжетімді аймақтардың AP-1 мотивін байыту талдауы. (B) Теклистамабпен (αBCMA×αCD3) немесе онсыз MM1.S миелома жасушаларымен бірлескен өсіруден кейінгі Treg ген экспрессиясының qPCR талдауы. Гендер функциясы бойынша топтастырылған: Treg сәйкестігі (FOXP3, IKZF2), сигнал реттегіштері (MAP3K1, DUSP4, DUSP16, TNFAIP3), цитотоксикалық эффекторлар (GZMA, GZMB, NKG7) және транскрипция факторлары (BATF, JUNB, TOX). Салыстыру үшін жұпталған t-критерийлері қолданылды. (C) BCMA×CD3 өзара әрекеттесуі арқылы Treg жасушаларында индукцияланған ұсынылған транскрипциялық желі. Түйін түсінің қарқындылығы B панеліндегі log₂ еселенген өзгерістерді көрсетеді. (D) OKT3, Теклистамаб, Леналидомид немесе олардың комбинацияларымен өңделген сау донор Tregs-імен 48 сағаттық бірлескен өсіруден кейінгі MM1.S жасушаларының тіршілік қабілеттілігі. Екі факторлы дисперсиялық талдау (ANOVA) (n=5). (E) Сол емдеу жағдайында 72 сағаттық бірлескен өсіруден кейінгі цитокин секрециясы (Гранзим A, Гранзим B, CCL5, IL-10). Екі факторлы дисперсиялық талдау (ANOVA) (n=5). (F) Өңделмеген Tregs пен in vitro иммуномодуляциялаушы агент (IMiD) леналидомидпен, биспецификалық Т-жасуша активаторы (BTCE) теклистамабпен немесе екеуінің комбинациясымен өңделген Tregs арасындағы цитотоксикалық және желіні анықтайтын гендердің орташа экспрессиясын салыстыратын жылу карталары. Деректер bulk-РНҚ секвенирлеу арқылы алынған. (G) MajesTEC-5 сынағына (n=2 E тобы; n=1 E1 тобы) енгізілген және талькетамаб (G-ақуызбен байланысқан рецептор класы C тобы 5 мүшесі D (GPRC5D)xCD3), даратумумаб, леналидомид және дексаметазон (Tal-DRd) комбинациясымен индукциялық терапиядан өтіп жатқан n=3 жаңадан диагноз қойылған көптік миелома (NDMM) науқастарының схемалық иллюстрациясы. Үлгілер 1-циклге (C1) дейін (pre) және 3-циклден (C3) кейін (post) жиналды. (H) Tal-DRd алған науқастар арасындағы Т-жасуша субпопуляцияларының таралуын көрсететін UMAP-графигі. Деректер сүйек кемігі үлгілерін бір жасушалы РНҚ секвенирлеу арқылы алынған. (I) Tal-DRd алған науқастарда терапияға дейінгі (C1-ге дейін) және кейінгі (C3-тен кейін) уақыт нүктелері арасындағы Treg жасушаларының z-баллмен нормаланған, цитотоксикалық ген экспрессиясын салыстыруды көрсететін жылу картасы. Деректер сүйек кемігі үлгілерін бір жасушалы РНҚ секвенирлеу арқылы алынған. (J) Талькетамабтың артып келе жатқан дозаларында сау донор PBMC-лерінен бөлінген Treg жасушаларымен 72 сағаттық бірлескен өсіруден кейінгі MM1.S жасушаларының тіршілік қабілеттілігі (αCD3×αGPRC5D) (n=3). (K) Блинатумомабтың (αCD3×αCD19) артып келе жатқан дозаларына ұшыраған сау донор PBMC-лерінен бөлінген Treg жасушаларымен 72 сағаттық бірлескен өсіруден кейінгі Nalm6 жасушаларының тіршілік қабілеттілігі (n=3).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;BTCE&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;терапиясындағы&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Tregs рөлі&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;RNA, ATAC және&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;TCR&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;секвенирлеуді&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;талдау&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Tregs&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;цитотоксикалық&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;функцияға ие&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;болады&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Иммунотерапиян&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ы оңтайландыру&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;әдісі&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Препринт лицензиясы&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/t
