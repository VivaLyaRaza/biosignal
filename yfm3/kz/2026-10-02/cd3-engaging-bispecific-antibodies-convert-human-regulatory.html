        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"257\" cy=\"96\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"563\" cy=\"215\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · ONCOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Иммунитеттің жасырын қаруы:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;реттеуші Т-жасушалар қатерлі&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ісікпен қалай күреседі&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory-f1.jpg\" alt=\"1-сурет. Бірінші желідегі BTCE терапиясы жаңадан диагноз қойылған миелома кезінде клиникалық жауапты күшейтеді және пери\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Бірінші желідегі BTCE терапиясы жаңадан диагноз қойылған миелома кезінде клиникалық жауапты күшейтеді және перифериялық Т-жасушалардың құрамын өзгертеді.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет. Бірінші желідегі BTCE терапиясы жаңадан диагноз қойылған миелома кезінде клиникалық жауапты күшейтеді және перифериялық Т-жасушалардың құрамын өзгертеді. (A) Жаңадан диагноз қойылған көптік миелома (NDMM) (сол жақта) және рецидивті/рефрактерлі көптік миелома (RRMM) (оң жақта) когорталары үшін емдеу мерзімдерін, клиникалық жауаптарды және үлгі жинау нүктелерін көрсететін «жүзуші» графиктер. BTCE — биспецификалық Т-жасуша активаторы. C — цикл. D — күн. DRd — даратумумаб + леналидомид + дексаметазон. DVRd — даратумумаб + бортезомиб + леналидомид + дексаметазон. PR — ішінара жауап. (B) NDMM (BTCE-DRd, n=14; BTCE-DVRd, n=3; DRd, n=6) және RRMM (n=18) бар науқастар үшін 3-циклден кейінгі жауап санаттарының таралуы. Жауап санаттарына мыналар жатады: PD (прогрессивті ауру), SD (аурудың тұрақтануы), MR (минималды жауап), n.d. (орындалмаған немесе бағаланбаған), PR (ішінара жауап), VGPR (өте жақсы ішінара жауап) және CR/sCR (толық жауап/қатаң толық жауап). (C) BTCE-D(V)Rd және DRd емдеу когорталары үшін уақыт өте келе перифериялық қандағы лимфоциттердің абсолютті саны (ALC) (сол жақта); BTCE-D(V)Rd (n=17) және DRd (n=6) арасындағы емдеуден кейінгі (C3-тен кейін) ALC салыстыруы (ортасында); және BTCE-D(V)Rd (n=16) үшін емдеуге дейінгі (C1-ге дейін) және кейінгі (C3-тен кейін) жұпталған ALC (оң жақта). P-мәндері көрсетілген салыстырулар үшін берілген және сәйкесінше Манн-Уитни U-критерийі мен жұпталған таңдамаларға арналған Уилкоксон критерийі арқылы есептелген. (D) BTCE терапиясына дейінгі (C1-ге дейін) және кейінгі (C3-тен кейін) перифериялық қандағы лимфоциттердің негізгі субпопуляцияларының ағындық цитометриясы, соның ішінде тірі &lt;a href=\"concepts/pbmc.html\"&gt;PBMC&lt;/a&gt; құрамындағы CD3⁺ Т-жасушаларының, NK-жасушаларының және B-жасушаларының пайызы, CD3⁺ Т-жасушаларының ішіндегі CD4⁺ Т-көмекші жасушалары мен CD8⁺ цитотоксикалық Т-жасушаларының пайызы, сондай-ақ CD4⁺ Т-жасушаларының ішіндегі FOXP3⁺ реттеуші Т-жасушаларының (Tregs) пайызы. (E) CCR7 және CD45RO экспрессиясы бойынша анықталған наивті, орталық жады (CM) және эффекторлық жады (EM) Т-жасушаларының репрезентативті FACS-графиктері мен сандық бағалауы. (F) CD4⁺ және CD8⁺ Т-жасушалары құрамындағы наивті, CM және EM субпопуляцияларын сандық бағалау. (G) Емдеуге дейінгі (C1-ге дейін) және кейінгі (C3-тен кейін) перифериялық қандағы CD3⁺ Т-жасушаларындағы PD-1 экспрессиясының репрезентативті FACS-графигі және сандық бағалауы. (D–G) панельдері үшін статистикалық маңыздылық жұпталған t-критерийлері арқылы бағаланды. Жұпталған деректер BTCE-D(V)Rd когортасынан n=17 науқас үшін қолжетімді болды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Реттеуші Т-жасушалар (Tregs) дәстүрлі түрде иммунитеттің «бейбітшілік сақтаушылары» болып саналады. Алайда жаңа зерттеу қатерлі ісік терапиясында қолданылатын биспецификалық антиденелер олардың қызметін түбегейлі өзгертетінін көрсетеді. Ісікті қорғаудың орнына, бұл жасушалар оны жоюға кірісіп, аурумен күресте белсенді қатысушыға айналады.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;BTCE реттеуші Т-жасушаларды цитотоксикалық эффектілерге айналдырады&lt;/li&gt;\n&lt;li&gt;Процесс AP-1 және BATF факторлары арқылы хроматинді қайта құруға негізделген&lt;/li&gt;\n&lt;li&gt;Иммуномодуляторлар бұл жасушалардың белсенділігін арттырады&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Биспецификалық Т-жасушалық энгейджерлер (BTCE) — бұл ісік жасушалары мен Т-лимфоциттерді жақындастырып, қатерлі ісікті жою процесін іске қосатын препараттар. Зерттеушілер MajesTEC-5 клиникалық сынағы аясында көптік миеломамен ауыратын науқастардан алынған сүйек кемігі мен қан үлгілерін талдады. BTCE әсерінен FOXP3 маркерін көрсететін реттеуші Т-жасушалар (Tregs) қайта бағдарламалау процесінен өтетіні анықталды. Олардың ядросында AP-1 және BATF транскрипция факторлары басқаратын хроматинді қайта құру процесі жүреді, бұл оларды цитотоксикалық эффектілерге айналдырады.&lt;/p&gt;\n&lt;p&gt;Зертханалық тәжірибелерде мұндай «қайта оқытылған» Tregs өздерінің негізгі маркерлерін сақтай отырып, ісік жасушаларын тікелей жою қабілетін көрсетті. Иммуномодуляциялық дәрілерді (IMiDs) қосу бұл цитотоксикалық әсерді одан әрі күшейтеді. Бұл жаңалық иммундық жүйенің икемділігі туралы түсінікті өзгертеді және иммунитетті басатын жасушаларды да қатерлі ісікке қарсы күреске бағыттауға болатынын көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бұл зерттеу әлі рецензиядан өтпеген препринт болып табылады және шектеулі клиникалық сынақ деректеріне негізделген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Биспецификалық T-жасушалық энгейджерлер (BTCE) B-жасушалық қатерлі ісіктерді емдеуде үлкен өзгерістер жасады, бірақ олардың дәстүрлі емес T-жасушалық тізбектерге әсері және біріктірілген емдеу стратегиялары әлі де толық зерттелмеген. Бұл жұмыста CD3-бағытталған BTCE адамның FOXP3⁺ реттеуші T-жасушаларын (Tregs) AP-1 факторы арқылы басқарылатын гибридті цитотоксикалық күйге ауыстыратыны және бұл ісікті жоюға ықпал ететіні көрсетілген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BTCE реттеуші T-жасушаларын цитотоксикалық эффекторларға қайта бағдарламалайды, бұл ісік жасушаларын жоюға көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторлар 2-фазалық клиникалық сынаққа (GMMG-HD10/DSMM-XX/MajesTEC-5) қатысқан, жаңадан диагностикаланған көптік миеломасы (NDMM) бар науқастардан алынған сүйек кемігі мен шеткі қан үлгілерін талдады. Зерттеуде бір жасушалы РНҚ, ATAC және TCR секвенирлеуі, сондай-ақ функционалды және метаболикалық профильдеу әдістері қолданылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ATAC-seq — хроматиннің қолжетімділігін талдау әдісі, ол жасушадағы қай гендердің белсенді екенін анықтауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;BTCE негізіндегі индукциялық терапия цитотоксикалық CD8⁺ клондарының кеңеюін және GZMA, GNLY және NKG7 экспрессиялайтын Treg популяциясының пайда болуын ынталандырады. Бұл жасушалар BATF-AP-1 айналасындағы хроматинді қайта құру арқылы цитотоксикалық гендердің байытылған сигнатураларымен сипатталады. In vitro тәжірибелерінде бұл Tregs ісік жасушаларын лизис жасау қабілетіне ие екені және бұл процесс доза мен нысанаға байланысты екені расталды. Сонымен қатар, жасушалар классикалық Treg белгілерін сақтай отырып, эффекторлық фенотипке қарай метаболикалық қайта құрылудан өтеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;In vitro бақыланған әсерлер науқастардағы ісік микроортасының күрделілігін толық көрсетпеуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Иммуномодуляциялаушы дәрілер (IMiD) бұл цитотоксикалық бағдарламаны іске қоспайды, бірақ оны сандық және сапалық тұрғыдан күшейтеді, бұл BTCE-IMiD біріктірілген сызбаларының тиімділігін негіздейді. Treg-тердің бұл пластикалығы BCMA, GPRC5D және CD19-ға бағытталған BTCE-лерде, сондай-ақ көптік миелома мен жедел лимфобластты лейкоз кезінде байқалады. Бұл нәтижелер цитотоксикалық Treg-терді биомаркерлер және иммунотерапияны оңтайландыру құралдары ретінде пайдалану үшін жаңа мүмкіндіктер ашады.&lt;/p&gt;\n&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"t-zhasushalaryn-baghyttaushy-immunoterapiya\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#t-zhasushalaryn-baghyttaushy-immunoterapiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Т-жасушаларын бағыттаушы иммунотерапия&lt;/span&gt;&lt;/a&gt;Т-жасушаларын бағыттаушы иммунотерапия&lt;/h4&gt;\n&lt;p&gt;Т-жасушаларын қайта бағыттаушы иммунотерапия қатерлі ісікті емдеу тәсілдерін түбегейлі өзгертуде және аутоиммундық аурулар саласына да еніп келеді. Бұл жерде биспецификалық Т-жасушалық энгейджерлер (BTCE) негізгі құрал болып табылады — олар ісік антигені мен Т-жасушаларындағы CD3-пен бір мезгілде байланысып, жасанды иммундық синапсты қалыптастырады және классикалық антиген таныстыруына тәуелсіз цитотоксикалық реакцияны тудырады. BCMA немесе GPRC5D-ге бағытталған BTCE препараттары көптеген емдеу курстарынан өткен миелома, В-жасушалық лимфомалар және жедел лимфобластты лейкозбен ауыратын науқастарда жоғары нәтиже көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BTCE терапиясы қуатты ісікке қарсы жауап береді, алайда төзімділік механизмдері мен ұзақ мерзімді тиімділік әлі де толық зерттелмеген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Емдеуге жауап әрқашан тұрақты емес және резистенттілік механизмдері пайда болуда. Бұрын клиникалық табыс CX3CR1⁺ цитотоксикалық CD8⁺ Т-жасушаларының көбею қабілетіне байланысты екені, ал сарқылған (exhausted) фенотиптер емдеудің сәтсіздігімен байланысты екені анықталған. Алайда, BTCE әсері астындағы реттеуші Т-жасушалардың (Tregs) тағдыры мен функциясы толық анықталмаған. FOXP3 экспрессиялайтын Tregs перифериялық толеранттылық үшін маңызды, бірақ ісіктер оларды иммунитетті басу үшін пайдаланады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tregs (реттеуші Т-жасушалар) — бұл иммундық жүйенің шамадан тыс белсенділігін тежейтін және ағзаның өз тіндеріне төзімділігін сақтайтын арнайы Т-лимфоциттер популяциясы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"btce-terapiyasy-kezindegi-retteushi-t-zhasushalardyng-khajta-baghdarlamalanuy\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#btce-terapiyasy-kezindegi-retteushi-t-zhasushalardyng-khajta-baghdarlamalanuy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;BTCE терапиясы кезіндегі реттеуші Т-жасушалардың қайта бағдарламалануы&lt;/span&gt;&lt;/a&gt;BTCE терапиясы кезіндегі реттеуші Т-жасушалардың қайта бағдарламалануы&lt;/h4&gt;\n&lt;p&gt;Біз BTCE терапиясы Т-жасушалар құрамын қалай өзгертетінін анықтау үшін бір жасушалы мультиомикалық талдау мен функционалдық модельдеуді біріктірдік. MajesTEC-5 клиникалық сынағында BCMA×CD3 BTCE-мен емделген миеломасы бар науқастардың сүйек кемігі мен шеткі қаны талданды. Нәтижелер BTCE терапиясы тек цитотоксикалық CD8⁺ клондардың көбеюін ғана емес, сонымен қатар FOXP3⁺ Tregs жасушаларының ерекше цитотоксикалық күйге қайта бағдарламалануын тудыратынын көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу клиникалық үлгілерге негізделген, сондықтан бақыланған өзгерістердің себеп-салдарлық байланысын түсіндіруде сақтық таныту қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл жасушалар GZMA, GZMB, GNLY, NKG7 және TBX21 экспрессиялай бастайды, метаболикалық қайта құрылу мен BATF-AP-1 орталықтандырылған хроматин ремодельденуін көрсетеді. BTCE әсеріне ұшыраған Tregs өздерінің негізгі белгілерін сақтай отырып, ісік жасушаларына қарсы тікелей литикалық белсенділікке ие болады. Бұл цитотоксикалық конверсия иммуномодуляторлық дәрілермен күшейеді. Бұл деректер Tregs жасушаларының қатерлі ісік иммунотерапиясындағы пассивті супрессор ретіндегі дәстүрлі көзқарастарға күмән келтіреді және олардың белсенді эффекторларға айнала алатынын көрсетеді.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;p&gt;BTCE-мен толықтырылған индукциялық терапия ісік жүктемесі жоғары болған кезде де тиімді және жаңадан анықталған миеломада жүйелі Т-жасушалық иммунитетті қайта қалыптастырады&lt;/p&gt;\n&lt;p&gt;Бұл зерттеу Majes-TEC-5 (NCT05695508) клиникалық сынағының деректеріне негізделген, онда BCMA×CD3 биспецификалық Т-жасушалық энгаджерлері (BTCE) теклистамаб жаңадан анықталған көптік миеломаны (NDMM) индукциялық терапияға енгізілген. Біз 17 пациенттің емге дейінгі және 3-циклден кейінгі сүйек кемігі мен шеткі қан үлгілерін талдадық. Топтар теклистамаб, даратумумаб, леналидомид және дексаметазон (BTCE-DRd, n=14) және теклистамаб, даратумумаб, бортезомиб, леналидомид және дексаметазон (BTCE-DVRd, n=3) схемаларын қамтыды. Бақылау тобы ретінде тек DRd алған 6 пациент талданды. Сондай-ақ, RRMM-мен ауыратын 18 пациенттің BTCE монотерапиясы бойынша бұрынғы деректері салыстырылды (1-сурет A, SN 1-2 кестелері).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BTCE (биспецификалық Т-жасушалық энгаджерлері) — бұл пациенттің Т-лимфоциттерін ісік жасушаларына жақындатып, иммундық жүйені оларды жоюға мәжбүрлейтін препараттар.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;BTCE тобында клиникалық жауап әмбебап және терең болды: 3-циклден кейін барлық пациенттерде (17/17, 100%) жауап байқалды және олардың барлығында 10⁻⁵ сезімталдықта MRD-теріс нәтижеге қол жеткізілді (1-сурет B). Бақылау барысында барлық 17 пациентте қатаң толық жауап (sCR) тіркелді. SOC (DRd) тобында жауап деңгейі 66,7% (4/6) болды және барлық пациенттер MRD-оң болып қалды. Маңыздысы, теклистамаб тобы емді ісік жүктемесі айтарлықтай жоғары деңгейде бастаған еді (плазмалық жасушалар инфильтрациясының медианасы 60% қарсы 25%; p=0,01; SN 1A-B суреттері).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BTCE-ні индукциялық терапияға қосу ісік жүктемесі жоғары болғанда да 100% MRD-теріс нәтижені қамтамасыз етеді және стандартты емдеу схемаларынан басым түседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;BTCE-мен емдеу лимфоциттердің жүйелі кеңеюіне әкелді. Бастапқы лимфоциттер деңгейі (ALC) салыстырмалы болды (медиана 1,35 × 10⁹ қарсы 1,02 × 10⁹ жасуша/л; p=0,9), бірақ 3-циклден кейін BTCE тобында бұл көрсеткіш DRd тобына қарағанда айтарлықтай жоғары болды (медиана 1,67 × 10⁹ қарсы 0,84 × 10⁹ жасуша/л; p=0,005; 1-сурет C). Жалпы лейкоциттер мен нейтрофилдер санында айырмашылық байқалмады, бұл лимфоциттердің селективті белсенуін көрсетеді (SN 1C суреті). Көп параметрлі ағынды цитометрия CD3+ Т-жасушаларының айтарлықтай өсуін (p=0,0008), негізінен CD8+ популяциясы есебінен (p&amp;lt;0,0001) көрсетті, ал CD4+, NK және B-жасушаларының үлесі азайды (1-сурет D, SN 2A суреті).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу шағын таңдамамен (n=17) шектелген, сондықтан нәтижелерді үлкенірек топтарда растау қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Т-жасушаларының «naive» (қарапайым) күйден эффекторлы-жады фенотипіне ауысуы байқалды (1-сурет E-F). Теклистамаб тобындағы Т-жасушалары белсену (CD314, CD29), дифференциация (CD45RO) және ерте шаршау (PD-1) маркерлерін арттырды, сонымен бірге CD62L және CD27high сияқты аз дифференциацияланған жасушалар маркерлерін төмендетті (1-сурет G, SN 2 суреті). Қорытындылай келе, BTCE тек терең ремиссияны қамтамасыз етіп қана қоймай, иммундық жүйені түбегейлі қайта қалыптастырады.&lt;/p&gt;\n&lt;h4 id=\"btce-terapiyasy-t-zhasushalarynyng-klonotipterin-khajta-khurylymdajdy-zhaene-suejek-kemigindegi-t-zhasushalarynda-citotoksikalykh-baghdarlamany-iske-khosady\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#btce-terapiyasy-t-zhasushalarynyng-klonotipterin-khajta-khurylymdajdy-zhaene-suejek-kemigindegi-t-zhasushalarynda-citotoksikalykh-baghdarlamany-iske-khosady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;BTCE терапиясы T-жасушаларының клонотиптерін қайта құрылымдайды және сүйек кемігіндегі T-жасушаларында цитотоксикалық бағдарламаны іске қосады&lt;/span&gt;&lt;/a&gt;BTCE терапиясы T-жасушаларының клонотиптерін қайта құрылымдайды және сүйек кемігіндегі T-жасушаларында цитотоксикалық бағдарламаны іске қосады&lt;/h4&gt;\n&lt;p&gt;BTCE-ге негізделген индукциялық терапияның адамның T-жасушаларына әсерін зерттеу үшін біз MajesTEC-5 зерттеуіне қатысқан науқастардың сүйек кемігінің үлгілерін талдадық. Жеке жасуша транскриптомы мен TCR-репертуарын профильдеу арқылы біз Tec-DRd алған 9 науқас, DRd стандартымен емделген 6 науқас және BCMA×CD3 BTCE монотерапиясын алған 18 RRMM науқасындағы өзгерістерді бағаладық (Rasm SN3). T-жасушаларының атласына проекциялау арқылы біз 6 CD8⁺, 5 CD4⁺ T-жасуша субпопуляциясын және Treg жасушаларын анықтадық (Rasm 2A, Rasm SN3B-D).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TCR-репертуар — бұл ағзадағы барлық бірегей T-жасуша рецепторларының жиынтығы, ол иммундық жүйенің антигендерді тану қабілетін анықтайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бастапқыда NDMM және RRMM науқастарының T-жасушалық құрамы әртүрлі болды: NDMM-де CD8⁺ эффекторлық жасушалары басым болса, RRMM-де CD8⁺ T-жасушалары азайған. NDMM тобында Tec-DRd және DRd топтары арасында бастапқы айырмашылықтар байқалмады (Rasm 2B, Rasm SN4A), бұл кейінгі айырмашылықтардың емдеу нәтижесі екенін көрсетеді.&lt;/p&gt;\n&lt;p&gt;Клондардың таралуындағы теңсіздікті өлшеу үшін Джини индексін қолданып, біз Tec-DRd алған NDMM науқастарында клоналды ауытқудың айтарлықтай өскенін анықтадық, бұл BTCE әсерінен клоналды кеңеюді білдіреді (Rasm 2C-D, Rasm SN4B-C). Фенотиптер мен TCR-клонотиптерін интеграциялау BTCE терапиясынан кейін NDMM сүйек кемігінде CD8⁺ эффекторлық және CD8⁺ тыныш күйдегі клондардың кеңейіп, наивті CD8⁺ T-жасушаларының қысқарғанын көрсетті (Rasm 2C). RRMM науқастарында ұқсас архитектура байқалды, ал DRd-мен емделгендерде «прогениторлық сарқылу» фенотиптеріне қарай ауытқу айқынырақ болды (Rasm 2C).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;NDMM науқастарында Tec-DRd терапиясы цитотоксикалық клондардың күшті кеңеюін тудырады, бұл стандартты терапияда байқалмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Емдеуге дейінгі және кейінгі клондарды талдау GZMA, GZMH, GNLY және CCL5 сияқты цитотоксикалық гендердің тек Tec-DRd алған NDMM науқастарында күшті индукциясын көрсетті (Rasm 2E). Бұл бағдарлама DRd немесе RRMM-дегі BTCE монотерапиясында белсендірілмеді (Rasm 2E-F). Цитотоксикалық гендер сигнатурасы тек NDMM BTCE тобында жоғары екені расталды (Rasm 2G-H). Осылайша, жоғары цитотоксикалық клондардың пайда болуы бірінші қатардағы BTCE терапиясының ерекше белгісі болып табылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу сүйек кемігі үлгілеріне негізделген; байқалған өзгерістер клиникалық тиімділікпен байланысты, бірақ себеп-салдарлық байланысты анықтау үшін қосымша зерттеулер қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"btce-terapiyasy-foxp3-retteushi-t-zhasushalaryn-in-vivo-gibridti-citotoksikalykh-effektorlykh-treg-zhasushalaryna-ajnaldyrady\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#btce-terapiyasy-foxp3-retteushi-t-zhasushalaryn-in-vivo-gibridti-citotoksikalykh-effektorlykh-treg-zhasushalaryna-ajnaldyrady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;BTCE терапиясы FOXP3⁺ реттеуші Т-жасушаларын in vivo гибридті цитотоксикалық эффекторлық Treg жасушаларына айналдырады&lt;/span&gt;&lt;/a&gt;BTCE терапиясы FOXP3⁺ реттеуші Т-жасушаларын in vivo гибридті цитотоксикалық эффекторлық Treg жасушаларына айналдырады&lt;/h4&gt;\n&lt;p&gt;BTCE терапиясы жоғары цитотоксикалық Т-жасушалық клондардың пайда болуына әкеледі, бұл ретте ең айқын өзгерістер реттеуші Т-жасушалар (Treg) компартментінде байқалады. Жаңадан диагноз қойылған көптеген миеломасы (NDMM) бар 15 науқастан алынған 432 947 сүйек кемігі Т-жасушаларын талдау BTCE-DRd терапиясынан кейін Treg жасушаларының ерекше кластері қалыптасатынын көрсетті (3A-сурет). Бұл жасушалар FOXP3 және IL2RA маркерлерін сақтай отырып, GZMA, GNLY және NKG7 цитотоксикалық гендерін экспрессиялайды (3B-C суреттері). &lt;a href=\"concepts/gsea.html\"&gt;GSEA&lt;/a&gt; талдауы NF-κB және қабыну жолдарының белсендірілуін, ал mTOR және IL-2/STAT5 бағдарламаларының өзгеріссіз қалғанын көрсетті (3D-E суреттері).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BTCE терапиясы Treg жасушаларын жоймайды, оларды гибридті цитотоксикалық күйге қайта бағдарламалайды, эффекторлық бағдарламаны базалық реттеуші профильдің үстіне қосады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GSEA — белгілі бір биологиялық процесспен байланысты гендер тобының өзгеруін статистикалық бағалау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;DRd бақылау тобымен салыстырғанда, BTCE терапиясы Treg жасушаларын «exTregs» фенотипіне ауыстырады, яғни олар супрессорлық қасиетін жоғалтып, TBX21, TCF7 және CCL5 экспрессиясымен сипатталатын эффекторлық функцияларға ие болады (3F-сурет). Ағынды цитометрия (n=17) өзгерістердің жүйелі сипатын растады: Treg жасушаларының нативті (CD45RA⁺) күйден жады (CD45RO⁺) күйіне ауысуы, CD137, NKG2D және PD-1 рецепторларының индукциясы (3G-H суреттері) және гранзим А өндірілуі байқалды (3I-сурет, SN-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;In vivo және in vitro бақыланған эффектілер Treg жасушаларының жүйелі қайта құрылуын көрсетеді, алайда бұл процестің ісікті бақылаудағы ұзақ мерзімді маңызы қосымша зерттеуді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тазартылған CD25⁺CD127low Treg жасушаларымен жүргізілген in vitro тәжірибелер тек теклистамабтың (BTCE) миелома жасушаларына қарсы дозаға тәуелді цитотоксикалық әсер ететінін көрсетті (3J-M суреттері). Супернатанттарды талдау гранзим А және B секрециясын растады (3N-сурет, SN-сурет). РНҚ-секвенирлеу FOXP3, CTLA4 және IKZF2 факторларының сақталуымен қатар цитотоксикалық гендердің (GZMB, NKG7, GNLY) экспрессиясын растады (3O-сурет). Метаболикалық талдау (Seahorse) мұндай Treg жасушалары эффекторлық Т-жасушаларға тән жоғары энергиялы гликолитикалық-тотықтырғыш профильге ауысатынын көрсетті (3P-сурет, SN-сурет).&lt;/p&gt;\n&lt;h4 id=\"ap-1-ortalykhtandyrylghan-hromatindi-khajta-khuru-btce-aeserinen-gibridti-citotoksikalykh-treg-kuejin-licenziyalajdy\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#ap-1-ortalykhtandyrylghan-hromatindi-khajta-khuru-btce-aeserinen-gibridti-citotoksikalykh-treg-kuejin-licenziyalajdy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AP-1 орталықтандырылған хроматинді қайта құру BTCE әсерінен гибридті цитотоксикалық Treg күйін лицензиялайды&lt;/span&gt;&lt;/a&gt;AP-1 орталықтандырылған хроматинді қайта құру BTCE әсерінен гибридті цитотоксикалық Treg күйін лицензиялайды&lt;/h4&gt;\n&lt;p&gt;Treg жасушаларының BTCE әсерінен цитотоксикалық функцияларды иемдену механизмін түсіну үшін NDMM-мен ауыратын науқастардың сүйек кемігінен бөлінген Treg жасушаларында BTCE-DRd терапиясына дейін және одан кейін scATAC-seq талдауы жүргізілді. Хроматиннің қолжетімділігін талдау терапиядан кейін BATF локусының қолжетімділігі артқанын көрсетті (4A-сурет). BATF AP-1 транскрипциялық факторлар желісінің орталық бөлігі болып табылады және әдетте JUN отбасы мүшелерімен өзара әрекеттесіп, TCR сигналдарын интеграциялау арқылы Т-жасушаларында эффекторлық бағдарламаларды іске қосады. BTCE әсеріндегі Treg жасушаларында BATF локусының ашылуы AP-1 делдалдығымен жүретін бақылау Treg жасушаларында цитотоксикалық күйді қамтамасыз ету үшін қайта қолданылатынын көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AP-1 реттеуші модулінің белсендірілуі, соның ішінде BATF-JUNB байланысу орындары, Treg жасушаларының цитотоксикалық трансформациясын қамтамасыз ететін негізгі эпигенетикалық оқиға болып табылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;JASPAR мотивтерін байыту талдауы емдеуден кейін қолжетімділігі артқан аймақтардың AP-1 мотивтерімен, атап айтқанда BATF-JUNB гетеродимерінің байланысу орындарымен байығанын растады (4A-сурет). Сондай-ақ, MAPK сигналдық жолы арқылы AP-1-мен ынтымақтасатын ETS мотивтерінің байығаны байқалды, бұл BTCE арқылы күшті CD3 стимуляциясы MAPK-AP-1 осін іске қосып, Treg хроматинін қайта сымдайтынын растайды (S6I-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;scATAC-seq — жеке жасушалар деңгейінде хроматиннің қолжетімділігін талдау әдісі, ол генетикалық материалдың қай бөліктері транскрипция үшін ашық екенін анықтауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл деректерді транскрипция деңгейінде растау үшін in vitro дақылдарынан алынған Treg жасушаларында RT-qPCR талдауы жүргізілді. Хроматиннің қолжетімділігі деректеріне сәйкес, BTCE-мен өңделген Treg жасушаларында BATF және оның серіктесі JUNB-тің күшті индукциясы байқалды (4B-сурет). Сондай-ақ, AP-1 белсенділігінде кері байланыс реттеушілері болып табылатын DUSP4 және DUSP16 фосфатазаларының айтарлықтай өсуі тіркелді. AP-1 белсендірілуінен кейін Treg жасушалары GZMA, GZMB және NKG7 сияқты цитотоксикалық эффекторларды, сондай-ақ NF-κB, NFAT және TOX сигналдық молекулаларын жоғары деңгейде экспрессиялады (4C-сурет). Осылайша, BTCE классикалық эффекторлық Т-жасушалық бағдарламаны FOXP3⁺ линиясына көшіріп, Treg жасушаларын олардың негізгі сәйкестігін жоғалтпай гибридті цитотоксикалық жасушаларға айналдырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу миеломамен ауыратын науқастардың деректері мен in vitro модельдеріне негізделген; бұл қайта бағдарламаланған Treg қызметінің ұзақ мерзімді әсерін бағалау үшін клиникалық растаулар қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"imid-btce/ap-1-baskharylatyn-citotoksikalykh-treg-khajta-baghdarlamalauyn-kueshejtedi\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#imid-btce/ap-1-baskharylatyn-citotoksikalykh-treg-khajta-baghdarlamalauyn-kueshejtedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;IMiD BTCE/AP-1-басқарылатын цитотоксикалық Treg қайта бағдарламалауын күшейтеді&lt;/span&gt;&lt;/a&gt;IMiD BTCE/AP-1-басқарылатын цитотоксикалық Treg қайта бағдарламалауын күшейтеді&lt;/h4&gt;\n&lt;p&gt;Біздің когортадағы NDMM (жаңадан диагноз қойылған көптеген миелома) бар науқастар IMiD қамтитын индукциялық терапия алғанын ескере отырып, біз IMiD-тің BTCE әсерінен Treg қайта бағдарламалау сапасына әсерін зерттедік. In vitro тәжірибелерімізде леналидомидті теклистамабпен біріктіру миелома жасушаларының жойылуын айтарлықтай арттырды, ал леналидомидтің өзі Treg немесе ісік жасушаларының тіршілігіне әсер етпеді (4D-сурет). &lt;a href=\"concepts/elisa.html\"&gt;ELISA&lt;/a&gt; талдаулары леналидомид пен BTCE комбинациясы секретом профилін өзгертетінін көрсетті: Granzyme A және CCL5 деңгейі артады, ал Granzyme B және IL-10 азаяды (4E-сурет). Бұл Treg-тің қабыну сигналдарына бейімділігін және супрессивті цитокиндердің азаюын білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;IMiD және BTCE комбинациясы Treg-тің цитотоксикалық әлеуетін синергиялық түрде арттырып, қабыну факторларын көбейтеді және классикалық супрессивті цитокиндерді азайтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;РНҚ секвенирлеуі (bulk &lt;a href=\"concepts/rna-seq.html\"&gt;RNA-seq&lt;/a&gt;) леналидомид пен BTCE комбинациясы BTCE-нің өзіне қарағанда күштірек цитотоксикалық бағдарламаны (GZMA, GZMB, CCL5, NKG7 гендерінің жоғары экспрессиясы) тудыратынын растады (4F-сурет). Сонымен қатар, Treg-тер өздерінің негізгі маркерлерін (FOXP3, IL2RA, CTLA4, IKZF2) сақтап қалды. Леналидомид монотерапиясы болса цитотоксикалық модульді іске қоспастан, Treg идентификация маркерлерін төмендетті, бұл тиімді дифференциация үшін BTCE болуы шарт екенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;IMiD (иммуномодуляциялаушы дәрілер) — миеломаны емдеуде қолданылатын, иммундық жасушалардың қызметін өзгертетін дәрілер тобы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз бұл әсердің BCMA-ға тән екенін немесе жоқтығын тексердік. MajesTEC-5 зерттеуінен алынған &lt;a href=\"concepts/scrna-seq.html\"&gt;scRNA-seq&lt;/a&gt; деректері талькетамаб (GPRC5D×CD3) және IMiD алған науқастарда Treg-тердің дәл осындай цитотоксикалық қолтаңбаға ие болғанын көрсетті (4G-I-сурет, SN S7A-B-сурет). In vitro тәжірибелерінде талькетамаб та дозаға байланысты миелома жасушаларын жойды (4J-сурет). Блинатумомаб (CD19×CD3) көмегімен жедел лимфобластты лейкемия (B-ALL) жасушаларына қарсы тәжірибелерде де Treg-тер цитотоксикалық белсенділікті көрсетті (4K-сурет). Демек, Treg-терді қайта бағдарламалау CD3-бағытталған антиденелер үшін жалпы қасиет болып табылады, мұнда IMiD-тер күшейтуші фактор ретінде қызмет етеді. Бұл нәтижелер NDMM науқастарында байқалатын күшті цитотоксикалық жауапты түсіндіреді. BTCE-лер антигенге тәуелді CD3 сигналын қамтамасыз етеді, ал IMiD-тер транскрипциялық бақылауды модуляциялап, Treg-терді гибридті цитотоксикалық эффекторға дейін айналдырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер in vitro және клиникалық үлгілер комбинациясына негізделген; барлық гематологиялық ауруларға экстраполяциялау кезінде сақтық таныту қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;h4 id=\"bispecifikalykh-t-zhasushalykh-engejdzherler-btce-terapiyasy-kezindegi-retteushi-t-zhasushalardyng-khajta-baghdarlamalanuy\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#bispecifikalykh-t-zhasushalykh-engejdzherler-btce-terapiyasy-kezindegi-retteushi-t-zhasushalardyng-khajta-baghdarlamalanuy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Биспецификалық Т-жасушалық энгейджерлер (BTCE) терапиясы кезіндегі реттеуші Т-жасушалардың қайта бағдарламалануы&lt;/span&gt;&lt;/a&gt;Биспецификалық Т-жасушалық энгейджерлер (BTCE) терапиясы кезіндегі реттеуші Т-жасушалардың қайта бағдарламалануы&lt;/h4&gt;\n&lt;p&gt;BTCE — бұл қатерлі ісікті емдеудегі инновациялық бағыт, алайда олардың классикалық емес Т-жасушаларға әсері толық зерттелмеген. Жаңадан анықталған миеломаны BTCE негізіндегі индукциялық терапиямен емдеу барысында FOXP3⁺ реттеуші Т-жасушалары (Tregs) жай ғана бақылаушы емес, ісікті жоюға белсенді қатысатын цитотоксикалық эффекторлық жасушаларға айналатыны анықталды. Бір жасушалы транскриптомика, эпигеномика және TCR профильдеу әдістері арқылы GZMA, GZMB, GNLY, NKG7, TBX21 гендерінің индукциясымен және AP-1 орталықтандырылған хроматиндік бағдарламасымен ерекшеленетін цитотоксикалық Tregs популяциясы табылды. Бұл гибридті күй леналидомид сияқты иммуномодуляциялаушы препараттармен (IMiDs) нығайтылады және әртүрлі BTCE түрлерінде байқалады, бұл Tregs-тің цитотоксикалық қайта бағдарламалануының әмбебап сипатта екенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BTCE және IMiDs әсерінен реттеуші Т-жасушалар GZMA/B және NKG7 сияқты цитотоксикалық гендерді экспрессиялап, ісікке қарсы белсенді жасушаларға айналады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"citotoksikalykh-transformaciya-mehanizmderi-zhaene-ortanyng-roeli\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#citotoksikalykh-transformaciya-mehanizmderi-zhaene-ortanyng-roeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Цитотоксикалық трансформация механизмдері және ортаның рөлі&lt;/span&gt;&lt;/a&gt;Цитотоксикалық трансформация механизмдері және ортаның рөлі&lt;/h4&gt;\n&lt;p&gt;Дәстүрлі модельдер бойынша BTCE әсері негізінен CD8⁺ Т-жасушаларына бағытталған деп саналған. Алайда, зерттеулер цитотоксикалық гендердің ең күшті индукциясы дәл FOXP3⁺ Tregs компартментінде болатынын көрсетеді. BTCE-мен емделген пациенттерде Tregs белсенді фенотипке ие болып, ісік жасушаларын лизиске ұшырату қабілетін көрсетеді. Механикалық тұрғыдан бұл жасушалар FOXP3, IL2RA, CTLA4 және IKZF2 маркерлерін сақтай отырып, метаболизмді эффекторлық деңгейге өзгертеді. Multiome талдаулары BATF локусы мен AP-1 мотивтерінің бұл процестегі орталық рөлін растады. In vitro тәжірибелері бұл Tregs-тің CD8⁺ Т-жасушаларына ұқсас гранулалық эффекторлық молекулаларды бөліп шығаратынын көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Multiome — бір жасушаның ішінде гендер белсенділігін (транскриптом) және хроматиннің қолжетімділігін (эпигенетика) бір мезгілде талдау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"immunomodulyatorlardyng-tregs-plastikasyna-aeseri\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#immunomodulyatorlardyng-tregs-plastikasyna-aeseri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Иммуномодуляторлардың Tregs пластикасына әсері&lt;/span&gt;&lt;/a&gt;Иммуномодуляторлардың Tregs пластикасына әсері&lt;/h4&gt;\n&lt;p&gt;BTCE тиімділігі қосымша терапияға тікелей байланысты. Леналидомид BTCE-мен бірге қолданылғанда, Tregs-тің ісікті жою қабілетін арттырады және секретомды (GZMA мен CCL5-ті жоғарылатып, GNLY, GZMB және IL-10-ды төмендетіп) қайта қалыптастырады. Бұл MajesTEC-5 зерттеуіндегі жоғары клиникалық жауапты түсіндіреді. Басқа жағынан, монотерапия жағдайында (мысалы, блинатумомаб) Tregs IL-10 өндіру арқылы иммундық жауапты басуы мүмкін. Демек, Tregs-тің BTCE-ге жауабы контекстке байланысты және IMiDs көмегімен оларды ісікке қарсы күресетін күйге бағыттауға болады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Байқалған әсерлер терапия контекстіне байланысты: IMiDs-пен комбинация Tregs-ті басушы функциядан цитотоксикалық функцияға ауыстыру үшін шешуші маңызға ие.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"citotoksikalykh-treg-ting-klinikalykh-mangyzy\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#citotoksikalykh-treg-ting-klinikalykh-mangyzy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Цитотоксикалық Treg-тің клиникалық маңызы&lt;/span&gt;&lt;/a&gt;Цитотоксикалық Treg-тің клиникалық маңызы&lt;/h4&gt;\n&lt;p&gt;Биспецификалық T-жасушалық энгажерлер (BTCE) терапиясы кезінде цитотоксикалық реттеуші T-жасушалардың (Treg) пайда болуы екіжақты маңызға ие. Бір жағынан, Treg қайта бағдарламалануы жергілікті иммуносупрессияны жойып, қосымша эффекторлық жасушалар пулын қалыптастыруы мүмкін, бұл науқастарда ісіктің тез кішірейуін және терең ремиссияны түсіндіреді. Екінші жағынан, Treg сәйкестігінің бұзылуы перифериялық толеранттылықты жоғалту және иммундық-дәнекерленген уыттылық қаупін тудырады, әсіресе аурудың ерте сатыларында қолданғанда.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BTCE терапиясындағы цитотоксикалық Treg-тер ісікке қарсы күресте көмектесуі мүмкін, бірақ олардың иммундық қауіпсіздікке әсері толеранттылықтың жойылу қаупіне байланысты тереңірек зерттеуді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біздің зерттеуімізде BTCE алған науқастарда канондық реттеуші гендердің экспрессиясы сақталған және аутоиммунитет белгілері байқалмаған, бұл цитотоксикалық Treg күйінің уақытша және өзін-өзі шектейтін сипатқа ие екенін көрсетеді. Дегенмен, бұл жасушалардың фенотипі мен жағымсыз әсерлер (инфекциялар, цитопениялар, ағза қабынуы) арасындағы байланысты анықтау үшін ұзақ мерзімді бақылаулар қажет.&lt;/p&gt;\n&lt;h4 id=\"zertteu-shekteuleri-zhaene-khajta-baghdarlamalau-mehanizmderi\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#zertteu-shekteuleri-zhaene-khajta-baghdarlamalau-mehanizmderi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу шектеулері және қайта бағдарламалау механизмдері&lt;/span&gt;&lt;/a&gt;Зерттеу шектеулері және қайта бағдарламалау механизмдері&lt;/h4&gt;\n&lt;p&gt;Жұмыстың бірқатар шектеулері бар: науқастар топтарының шағындығы және емдеу сызбаларындағы айырмашылықтар BTCE әсерін, ауру эволюциясын және алдыңғы терапияның Treg пластикасына әсерін ажыратуды қиындатады. Біз in vivo жағдайында сигналдық жолдарды (мысалы, AP-1 блокадасы) тікелей манипуляцияламадық, сондықтан цитотоксикалық Treg-тердің ісікті бақылаудағы үлесі CD8⁺ эффекторлық жасушаларға қарағанда болжамды болып қалады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AP-1 — транскрипциялық факторлар кешені, ол BTCE әсерінен Treg-терді цитотоксикалық бағдарламаға көшіруде негізгі рөл атқарады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біздің деректер деплециялаушы терапия (анти-CD38, даратумумаб) мен қайта бағдарламалау (BTCE, теклистамаб) синергиялық әсер ететінін көрсетеді. BTCE-DRd FOXP3/IL2RA маркерлерін сақтап қалған, бірақ цитотоксикалық бағдарламаны (GZMA, GNLY, NKG7) игерген FOXP3⁺ Treg-тердің пайда болуына әкелді. Даратумумаб CD38high Treg пулын жойып, супрессивті фонды төмендетеді, ал теклистамаб CD3 арқылы қалған FOXP3⁺ жасушаларды AP-1 басқаратын гибридті күйге ауыстырады. Леналидомид бұл қайта бағдарламалауды одан әрі күшейтеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қорытындылар клиникалық деректер мен функционалдық жүйелерге негізделген; себеп-салдарлық байланыстар in vivo модельдерінде расталуы керек.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"zertteuge-khatysushylar\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#zertteuge-khatysushylar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеуге қатысушылар&lt;/span&gt;&lt;/a&gt;Зерттеуге қатысушылар&lt;/h4&gt;\n&lt;p&gt;Зерттеуге алғаш рет диагноз қойылған және бұрын ем алмаған 26 көптік миелома (NDMM) науқасы енгізілді. Науқастар мен аурудың сипаттамасы SN 1-2 кестелерінде берілген. Олардың 20-сы 2-фазалық клиникалық сынақ (NCT05695508) аясында BTCE-мен индукциялық терапия алды: 14 науқас Tec-DRD (n=5 A тобы, n=6 A1 тобы, n=3 D тобы), 3 науқас Tec-D-VRD (B тобы) және 3 науқас Talq-DRD (n=2 E тобы, n=1 E1 тобы) сызбасы бойынша емделді. Тағы 6 NDMM науқасы Гейдельберг университетінің клиникасында стандартты DRD терапиясын алды. Деректердің сапасын қамтамасыз ету үшін тек осы орталықта емделген науқастар талдауға алынды. Сүйек кемігі мен шеткі қан үлгілері емге дейін (pre) және үш циклден кейін (post) жиналды (1A-сурет). Барлық қатысушы жазбаша келісім берді; зерттеу Гейдельберг медициналық факультетінің этикалық комитетімен мақұлданды (S-096/2017, S-777/2024).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BTCE (биспецификалық антиденелер) — ісік жасушалары мен Т-лимфоциттерді бір мезгілде байланыстырып, иммундық жүйені ісікке қарсы күресуге мәжбүрлейтін жасанды ақуыздар.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қосымша бақылау ретінде BCMAxCD3 BTCE монотерапиясын алған 18 рецидивті/рефрактерлі миелома науқасының деректері қайта талданды. Үлгілер емге дейін, 1-циклден кейін (post/early) және 4-циклден кейін немесе рецидив болған жағдайда (post/late) алынды (1A-сурет).&lt;/p&gt;\n&lt;h4 id=\"suejek-kemigi-uelgilerin-oengdeu\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#suejek-kemigi-uelgilerin-oengdeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сүйек кемігі үлгілерін өңдеу&lt;/span&gt;&lt;/a&gt;Сүйек кемігі үлгілерін өңдеу&lt;/h4&gt;\n&lt;p&gt;Сүйек кемігінің аспираты 1:1 қатынасында буфермен (0,1% BSA және 2 мМ EDTA қосылған PBS) сұйылтылды. Мононуклеарлы жасушалар Bicoll ерітіндісінде центрифугалау (20 минут, 1300g) арқылы бөлінді. Жуылғаннан кейін (5 минут, 470g) эритроциттер RCL буферінде (155 мМ NH4Cl, 10 мМ KHCO3, 0,1 мМ EDTA) 10 минут бойы лизис жасалды. Қатерлі плазмалық жасушалар CD138-микросфералар көмегімен бөлініп, 90% FBS және 10% DMSO қоспасында сұйық азотта мұздатылды. Басқа мононуклеарлы жасушалар да сол әдіспен, әр аликвотта 1 × 10^7 жасуша концентрациясында сақталды.&lt;/p&gt;\n&lt;h4 id=\"spektrlik-aghyndy-citometriya-koemegimen-t-zhasushalarynyng-immunofenotiptelui\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#spektrlik-aghyndy-citometriya-koemegimen-t-zhasushalarynyng-immunofenotiptelui\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Спектрлік ағынды цитометрия көмегімен Т-жасушаларының иммунофенотиптелуі&lt;/span&gt;&lt;/a&gt;Спектрлік ағынды цитометрия көмегімен Т-жасушаларының иммунофенотиптелуі&lt;/h4&gt;\n&lt;p&gt;PBMC үлгілері X-vivo 15 ортасында 0,04% бензоназамен ерітілді. Жасушалардың тіршілік қабілетін анықтау үшін Fixable Viability Stain 440UV (4°C-та 15 минут) қолданылды. Беткейлік маркерлер (CD4, CD34, CD33, CD314, CD19, CD45RA, CD45, CD29, LAG-3, CD8, CD56, PD-1, CD94, CD137, CD62L, CD45RO, CD69, CD27, CD138, CD127, CD25, CXCR3, CCR7, CD3) әртүрлі флуорохромдармен (BUV, BV, FITC, RB, PE, APC) боялды.&lt;/p&gt;\n&lt;p&gt;Жасушаішілік цитокиндерді өлшеу үшін жасушалар PMA (50 нг/мл) және иономицинмен (500 нг/мл) GolgiPlug ингибиторының қатысуымен 6 сағат бойы стимуляцияланды. Тіршілік қабілеті (eFluor 780) және беткейлік маркерлер (CD3, CD4, CD8, CD25, CD127) боялғаннан кейін, жасушалар Foxp3/Transcription Factor Staining Buffer Set көмегімен пермеабилизацияланды. Жасушаішілік цитокиндер (Гранзим A, B, Гранулизин, CCL5, IFNγ) және FoxP3 бөлме температурасында қараңғы жерде 30 минут бойы боялды. Талдау Cytek Aurora жүйесінде жүргізілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Спектрлік ағынды цитометрия бір уақытта көптеген маркерлерді анықтау үшін спектрлері бір-біріне жақын флуорохромдарды ажыратып алуға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"cd45-cd3-t-zhasushalaryn-fluorescenciyamen-belsendirilgen-suryptau-facs\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#cd45-cd3-t-zhasushalaryn-fluorescenciyamen-belsendirilgen-suryptau-facs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CD45+ CD3+ Т-жасушаларын флуоресценциямен белсендірілген сұрыптау (FACS)&lt;/span&gt;&lt;/a&gt;CD45+ CD3+ Т-жасушаларын флуоресценциямен белсендірілген сұрыптау (FACS)&lt;/h4&gt;\n&lt;p&gt;Single-cell талдауы үшін үлгілер 37°C-та ерітіліп, 10% FBS және 0,02% бензоназа қосылған RPMI ортасына ауыстырылды. Жасушалар саналып, 8 аликвотаға бөлінді және 400 g жылдамдықта 5 минут бойы (4°C) центрифугаланды. FACS буферінде (0,4% BSA бар PBS) жасушалар TotalSeq хэштег-антиденелерімен, eFluor 780 және CD45, CD3, CD38 антиденелерімен белгіленіп, сұрыпталды.&lt;/p&gt;\n&lt;p&gt;CD4+ CD127low CD25+ реттеуші Т-жасушаларын (Tregs) бөліп алу үшін үлгілер тиісті антиденелермен боялып, BD Aria Fusion жүйесінде сұрыпталды.&lt;/p&gt;\n&lt;h4 id=\"cd4-cd127low-cd25-retteushi-t-zhasushalaryn-boelip-alu\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#cd4-cd127low-cd25-retteushi-t-zhasushalaryn-boelip-alu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CD4+ CD127low CD25+ реттеуші Т-жасушаларын бөліп алу&lt;/span&gt;&lt;/a&gt;CD4+ CD127low CD25+ реттеуші Т-жасушаларын бөліп алу&lt;/h4&gt;\n&lt;p&gt;In vitro тәжірибелері және ATAC-секвенирлеу үшін Tregs Ficoll-Paque PLUS көмегімен градиентті центрифугалау (450 g, 35 минут) арқылы бөлінді. Тазарту EasySep Human CD4+ CD127low CD25+ Regulatory T Cell Kit жинағы арқылы өндірушінің нұсқаулығына сәйкес жүзеге асырылды. Жасушалардың тіршілік қабілеті талдау алдында CD3, CD4, CD25, CD127 және eFluor 780 көмегімен тексерілді.&lt;/p&gt;\n&lt;h4 id=\"zheke-zhasushaly-transkriptom,-vdj-zhaene-atac-taldaulary\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#zheke-zhasushaly-transkriptom,-vdj-zhaene-atac-taldaulary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жеке жасушалы транскриптом, V(D)J және ATAC талдаулары&lt;/span&gt;&lt;/a&gt;Жеке жасушалы транскриптом, V(D)J және ATAC талдаулары&lt;/h4&gt;\n&lt;p&gt;scRNA және V(D)J талдаулары үшін тіршілікке қабілетті CD45⁺CD3⁺ жасушалары BD Aria Fusion™ жүйесінде &lt;a href=\"concepts/protochnaya-tsitometriya.html\"&gt;ағындық цитометрия&lt;/a&gt; арқылы бөліп алынды (Сурет SN). Кітапханаларды дайындау Chromium платформасында (10x Genomics) Single Cell 5′ Reagent Kit v2 жиынтығымен орындалды (әр арнаға 40 000 жасуша). Секвенирлеу Illumina NovaSeq 6000 құрылғысында жүргізілді. Бастапқы деректер Cell Ranger (v7.1) көмегімен GRCh38 (2020-A) геномы негізінде өңделді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/single-cell-rna-sequencing.html\"&gt;scRNA-seq&lt;/a&gt; және ATAC-seq әдістері әрбір жеке жасуша деңгейінде гендердің белсенділігі мен хроматиннің қолжетімділігін бір уақытта зерттеуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ген экспрессиясы мен ATAC талдауы үшін сүйек кемігінің мононуклеарларынан CD4⁺CD127lowCD25⁺ реттеуші Т-жасушалары (Tregs) бөлініп алынды. Ядроларды бөлу 10X Genomics хаттамасы (CG000365 Rev C) бойынша атқарылды. Кітапхана сапасы TapeStation D1000/D5000 (Agilent) жүйесінде бағаланып, Illumina NovaSeq 6000 құрылғысында секвенирленді.&lt;/p&gt;\n&lt;h4 id=\"sapany-bakhylau-zhaene-khalypkha-keltiru\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#sapany-bakhylau-zhaene-khalypkha-keltiru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сапаны бақылау және қалыпқа келтіру&lt;/span&gt;&lt;/a&gt;Сапаны бақылау және қалыпқа келтіру&lt;/h4&gt;\n&lt;p&gt;Демультиплексирлеу Seurat (v5.0.1) жүйесіндегі HTODemux функциясы арқылы жүзеге асырылды. Дублеттер scDblFinder пакетінің көмегімен жойылды. TCR альфа/бета тізбегі жоқ жасушалар талдаудан шығарылды. Деректер SCTransform арқылы қалыпқа келтіріліп, миеломамен ауыратын науқастардың сүйек кемігінің деректер базасына сәйкестендірілді. Талдауға 200–3000 гені анықталған және митохондриялық ДНҚ мөлшері &amp;lt;10% болатын жасушалар енгізілді.&lt;/p&gt;\n&lt;h4 id=\"differencialdy-ekspressiya-zhaene-zholdardy-bajytu\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#differencialdy-ekspressiya-zhaene-zholdardy-bajytu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дифференциалды экспрессия және жолдарды байыту&lt;/span&gt;&lt;/a&gt;Дифференциалды экспрессия және жолдарды байыту&lt;/h4&gt;\n&lt;p&gt;Дифференциалды экспрессия MAST моделі (FindMarkers, Seurat) арқылы бағаланды (Benjamini–Hochberg түзетуімен). Жолдар деңгейіндегі өзгерістер scGSEA әдісімен Hallmark жолдары бойынша талданды. Т-жасушалардың цитотоксиктігін бағалау үшін 27 генді қамтитын AddModuleScore функциясы қолданылды (Сурет 2H).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory-f2.jpg\" alt=\"2-сурет. BTCE цитотоксикалық транскрипциялық бағдарламаларды ынталандырады және Т-жасушаларының клоналды архитектурасын \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет. BTCE цитотоксикалық транскрипциялық бағдарламаларды ынталандырады және Т-жасушаларының клоналды архитектурасын өзгертеді.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сурет. BTCE цитотоксикалық транскрипциялық бағдарламаларды ынталандырады және Т-жасушаларының клоналды архитектурасын өзгертеді. (A) NDMM және RRMM үлгілерінен алынған (барлығы 504 969 Т-жасуша) Т-жасуша субпопуляцияларының UMAP-визуализациясы, 3 негізгі топқа және 12 транскрипциялық анықталған кластерге бөлінген. NDMM — жаңадан диагноз қойылған көптік миелома. RRMM — рецидивті/рефрактерлі көптік миелома. (B) Емдеу топтары бойынша бастапқы (терапияға дейін / C1-ге дейін) Т-жасуша кластерлерінің таралуы, әрбір баған жеке науқасты білдіреді. (C–D) DRd, BTCE-DRd (NDMM) және BTCE (RRMM) когорталарында емдеуге дейінгі (C1-ге дейін) және кейінгі (C3-тен кейін) уақыт нүктелерін салыстыра отырып, UMAP кеңістігінде CD8 эффекторлық жады (EM) Т-жасушаларының кеңістіктік таралуын сандық анықтайтын Джини индекстері. Әрбір үлгі ең аз жұпталған Т-жасуша санына дейін қысқартылды. P-мәндері жұпталған t-критерийлерінің нәтижелерін көрсетеді. BTCE — биспецификалық Т-жасуша активаторы. DRd — даратумумаб/леналидомид/дексаметазон. (E–F) Науқастарда тек емдеуге дейінгі (pre / C1-ге дейін) және тек емдеуден кейінгі (post / C3-тен кейін) Т-жасуша клондары арасындағы дифференциалды ген экспрессиясын көрсететін жанартау графиктер. Тек терапияға дейін бар клондар pre; тек терапиядан кейін барлары post деп жіктелді. P-мәндері Бенджамини-Хохберг әдісімен түзетілді. (G) DRd (сары) немесе BTCE-DRd (көк) алған NDMM науқастарында цитотоксикалықпен байланысты гендердің (NKG7, CCL5, CST7, GNLY, GZMA, GZMB, GZMH, GZMK) экспрессиясын көрсететін скрипка диаграммалары. (H) NDMM (BTCE-DRd), n=9; RRMM (BTCE), n=9; және NDMM мен RRMM бастапқы когорталарында терапияға дейінгі (C1-ге дейін) және кейінгі (C3-тен кейін) үлгілерді салыстыратын цитотоксикалық көрсеткіші (Әдістерді қараңыз). P-мәндері жұпталған t-критерийлері арқылы есептелген.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"tregs-subklasterleui\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#tregs-subklasterleui\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tregs субкластерлеуі&lt;/span&gt;&lt;/a&gt;Tregs субкластерлеуі&lt;/h4&gt;\n&lt;p&gt;Реттеуші Т-жасушалардың гетерогенділігін зерттеу үшін FOXP3 экспрессиялайтын жасушалар іріктелді. &lt;a href=\"concepts/pca.html\"&gt;PCA&lt;/a&gt; талдауы мен UMAP проекциялары арқылы кластерлер анықталды. Маркерлік гендер (FOXP3, IL2RA, CTLA4) және цитотоксиктік гендер (GZMA, GZMB, NKG7) FeaturePlot және Nebulosa көмегімен визуализацияланды.&lt;/p&gt;\n&lt;h4 id=\"tcr-vdj-repertuaryn-taldau\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#tcr-vdj-repertuaryn-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TCR V(D)J репертуарын талдау&lt;/span&gt;&lt;/a&gt;TCR V(D)J репертуарын талдау&lt;/h4&gt;\n&lt;p&gt;Cell Ranger арқылы жасалған TCR V(D)J контигтері scRepertoire пакетімен өңделіп, Seurat-тағы транскриптомдық профильдермен байланыстырылды. Талдауға тек өнімді жұптасқан TRA–TRB рецепторлары бар жасушалар алынды. Клонотиптер TRA және TRB CDR3 аминқышқылдық тізбектері мен V/J гендерін қолдану негізінде анықталды. Клондардың молдығы әр үлгі үшін есептеліп, гипер-кеңейген, ірі, орташа, шағын және сирек санаттарға бөлінді. Ұзақ мерзімді бақылау әр пациент үшін емге дейінгі (T_pre) және емнен кейінгі (T_post) клонотиптерді бөлу арқылы жүргізілді. Клондардың теңсіздігі ineq R пакетімен есептелген Джини индекстері арқылы сандық бағаланды. Бірінші Джини метрикасы барлық T-жасушалары, CD4⁺ және CD8⁺ T-жасушалары ішіндегі клондардың теңсіздігін сипаттады. Екінші кеңістіктік Джини метрикасы UMAP кеңістігіндегі T-жасушаларының таралуын бағалады. Үлгі алудағы қателіктерді болдырмау үшін барлық жұптық талдаулар ең аз T-жасуша санына дейін азайтылған деректер жиынтығында орындалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Джини индексі — популяциядағы клоналды экспансия дәрежесін көрсететін статистикалық көрсеткіш; жоғары мән белгілі бір клондардың басымдығын білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tregs-ueshin-bir-zhasushaly-atac-seq-taldauy\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#tregs-ueshin-bir-zhasushaly-atac-seq-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tregs үшін бір жасушалы ATAC-seq талдауы&lt;/span&gt;&lt;/a&gt;Tregs үшін бір жасушалы ATAC-seq талдауы&lt;/h4&gt;\n&lt;p&gt;BTCE–DRd терапиясын алған NDMM пациенттерінің Tregs жасушалары 10x Genomics Chromium Single Cell Multiome платформасында профильденіп, Cell Ranger ARC арқылы GRCh38/hg38 геномына қатысты өңделді. R (v4.4) ортасында Seurat және Signac көмегімен шыңдар (peaks) стандартты хромосомалармен шектелді. EnsDb.Hsapiens.v86 ген аннотациялары хроматин талдауына қосылды. Әр үлгі үшін кемінде 10 жасуша талап етіліп, ChromatinAssay құрылды. Сапаны бақылау үшін орташа ATAC кітапхана күрделілігі (10³–10⁵ фрагмент/жасуша) және төмен митохондриялық мазмұны (&amp;lt;5%) бар жасушалар таңдалды. Өте кішкентай (&amp;lt;20 bp) немесе өте үлкен (&amp;gt;10 kb) аймақтар алынып тасталды. Хроматин қолжетімділігі TF–IDF трансформациясымен қалыпқа келтірілді, жоғары өзгермелі белгілер FindTopFeatures() арқылы таңдалды және LSI (RunSVD()) арқылы өлшемдер қысқартылды. UMAP бейнелері LSI компоненттері 2–50 негізінде есептелді.&lt;/p&gt;\n&lt;p&gt;Пациенттер мен уақыт нүктелері бойынша интеграцияланған талдау үшін бірыңғай шыңдар жиынтығы анықталды (Signac reduce() GRanges). Әр үлгі үшін фрагменттер FeatureMatrix() арқылы қайта есептелді. Seurat объектілері біріктіріліп, Signac-тың LSI-негізіндегі интеграция жұмыс процесі (FindIntegrationAnchors(), IntegrateEmbeddings()) қолданылды. Емге дейінгі және кейінгі Tregs арасындағы хроматин қолжетімділігінің айырмашылығы (DA) Signac көмегімен, Benjamini–Hochberg FDR түзетулерімен бағаланды. DA шыңдарында AP-1 отбасы (BATF/JUNB) үшін мотивтерді байыту талдауы жүргізілді.&lt;/p&gt;\n&lt;h4 id=\"zhasusha-zhelileri\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#zhasusha-zhelileri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жасуша желілері&lt;/span&gt;&lt;/a&gt;Жасуша желілері&lt;/h4&gt;\n&lt;p&gt;Nalm-6 gfp luc (Blaeschke Lab, DKFZ) және MM1.S gfp luc (MDC) желілері қолданылды. Жасушалар 37°C температурада және 5% CO2 ортасында 10% FBS және 1X Пенициллин-Стрептомицин қосылған RPMI1640 ортасында өсірілді.&lt;/p&gt;\n&lt;h4 id=\"aghyndy-citometriya-taldauy\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#aghyndy-citometriya-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ағынды цитометрия талдауы&lt;/span&gt;&lt;/a&gt;Ағынды цитометрия талдауы&lt;/h4&gt;\n&lt;p&gt;Жасушалар BCMA (REA315), GPCR5D (571932), CD19 (SJ25C1) антиденелерімен және Fixable Viability Dye eFluor™ 780 бояғышымен 4°C-та 30 минут бойы боялды. Үлгі Cytek® Aurora аппаратында талданды. Спектрлік бөлу үшін GFP BrightComp eBeads™ қолданылды.&lt;/p&gt;\n&lt;h4 id=\"birlesken-kultivaciyalau-zhuejesi\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#birlesken-kultivaciyalau-zhuejesi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бірлескен культивациялау жүйесі&lt;/span&gt;&lt;/a&gt;Бірлескен культивациялау жүйесі&lt;/h4&gt;\n&lt;p&gt;Реттеуші Т-жасушаларының (Treg) көптік миелома немесе жедел лимфобластты лейкемия жасушаларымен өзара әрекеттесуін зерттеу үшін моно- және ко-культуралар қолданылды. Сау донорлардан алынған тазартылған CD4+ CD127low CD25+ Treg-жасушалары люцифераза экспрессиялайтын нысаналы жасушалармен бірге өсірілді. 96-ұяшықты планшеттерде 5x10^4 Treg және 1x10^4 ісік жасушалары, 384-ұяшықтыларда 1x10^4 және 2x10^3 қатынасында пайдаланылды. RPMI ортасы 10% FBS-пен толықтырылды, E:T қатынасы 5:1 болды. Теклистамаб, блинатумомаб, талькетамаб, anti-CD3 антиденелері және леналидомид әртүрлі концентрацияларда қолданылды. Бақылау ретінде PanT-жасушалары алынды. Инкубация 48 және 72 сағатқа созылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ко-культура — екі немесе одан да көп жасуша түрлерін бір ортада өсіру арқылы олардың өзара әсерін бақылау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"citotoksikalykh-taldau\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#citotoksikalykh-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Цитотоксикалық талдау&lt;/span&gt;&lt;/a&gt;Цитотоксикалық талдау&lt;/h4&gt;\n&lt;p&gt;Теклистамабтың MM.1S миелома және Nalm-6 лейкемия жасушаларына әсерін бағалау үшін жоғарыдағы жағдайларда ко-культуралар дайындалды. Теклистамаб немесе талькетамабтың әртүрлі концентрациялары, сондай-ақ бақылау ретінде эквимолярлы anti-CD3 антиденелері қолданылды. Қосымша 100 нг/мл теклистамаб, 52,3 нг/мл OKT3, 37,7 нг/мл блинатумомаб, 1 мкМ леналидомид және олардың комбинациялары сыналды. Жасушалардың тіршілік қабілеті Bio-Glo™ люцифераза жүйесі және Spectramax ID3 құрылғысы арқылы анықталды. Treg-жасушалары FACS сұрыптау әдісімен CD3, CD4, CD25 және CD127 маркерлері арқылы бөліп алынды.&lt;/p&gt;\n&lt;h4 id=\"elisa-aedisimen-supernatanttardy-taldau\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#elisa-aedisimen-supernatanttardy-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ELISA әдісімен супернатанттарды талдау&lt;/span&gt;&lt;/a&gt;ELISA әдісімен супернатанттарды талдау&lt;/h4&gt;\n&lt;p&gt;Супернатанттарды талдау үшін Treg-жасушалары (1x10^6 жасуша/мл) MM.1S жасушаларымен (2x10^5 жасуша/мл) 72 сағат бойы инкубацияланды. Емдеу шарттарына теклистамаб (100 нг/мл), OKT3 (52,3 нг/мл), блинатумомаб (37,7 нг/мл), леналидомид (1 мкМ) және олардың комбинациялары кірді. Жиналған супернатанттар -80°C температурада сақталды. Гранзим A және B, гранулизин, CCL5, IL35 және IL10 концентрациялары ELISA жинақтары арқылы өндіруші нұсқаулығына сәйкес анықталды.&lt;/p&gt;\n&lt;h4 id=\"treg-birlesken-dakhylynan-kejingi-zhasushaishilik-citokinderdi-aghyndykh-citometriyamen-taldau\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#treg-birlesken-dakhylynan-kejingi-zhasushaishilik-citokinderdi-aghyndykh-citometriyamen-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Treg бірлескен дақылынан кейінгі жасушаішілік цитокиндерді ағындық цитометриямен талдау&lt;/span&gt;&lt;/a&gt;Treg бірлескен дақылынан кейінгі жасушаішілік цитокиндерді ағындық цитометриямен талдау&lt;/h4&gt;\n&lt;p&gt;Сау донорлардың CD4+ CD127low CD25+ реттеуші Т-жасушаларын (Treg) MM.1S миелома жасушаларымен бірге инкубациялап, оларға теклистамаб (50 нг/мл), OKT3 (26,15 нг/мл), леналидомид (1 мкМ) немесе олардың комбинациясымен әсер еткеннен кейін спектрлік ағындық цитометрия қолданылды. 66 сағаттық дақылдандырудан кейін Гольджи аппаратында цитокиндердің жинақталуын қамтамасыз ету үшін BD GolgiPlug™ қосылды. Тіршілікке қабілеттілікті Fixable Viability Dye eFluor™ 780 бояуымен (4°C-та 15 минут) анықтағаннан кейін, беттік маркерлер (CD3, CD4, CD8, CD25, CD127) 30 минут ішінде 4°C-та боялды. Жасушалар eBioscience™ Foxp3 / Transcription Factor Staining Buffer Set көмегімен пермеабилизацияланды. Жасушаішілік цитокиндер (гранзимдер A және B, гранулизин, CCL5, IFNy) және FoxP3 факторы қараңғыда, бөлме температурасында 30 минут ішінде боялды. Талдау Cytek® Aurora жүйесінде жүргізілді, спектрлік бөлу үшін GFP BrightComp eBeads™ қолданылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Спектрлік ағындық цитометрия әр бояудың толық флуоресценция спектрін талдауға мүмкіндік береді, бұл көп маркерлі талдауларда сигналдарды дәл ажыратуды қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;нақты уақыт режиміндегі ПТР&lt;/p&gt;\n&lt;p&gt;MM1.S жасушаларымен 72 сағаттық бірлескен дақылдандырудан кейін Treg жасушалары бөлініп алынды және RNeasy Micro Kit көмегімен РНҚ бөлінді. cDNA синтезі High-Capacity cDNA Reverse Transcription Kit көмегімен жүргізілді (жалпы көлемі 20 мкл). qPCR талдауы QuantStudio™ 3 жүйесінде TaqMan™ Fast Advanced Master Mix көмегімен орындалды. Сигнал беру, транскрипция және эффекторлық гендер (MAP3K1, MAPK8/JNK1, MAPK14/p38, STAT1/3/5B, TNFAIP3, DUSP4/16, NFATC1, BATF, JUN/B, FOS, IRF4, PRDM1/BLIMP1, TOX, FOXP3, IKZF2/Helios, GZMA/B, NKG7, PRF1, IFNG, CCR8, IL2RA/CD25, CTLA4, TIGIT) зерттелді. Әр жағдай үш биологиялық қайталауда және техникалық дубликаттарда өлшенді, деректер ΔΔ Ct әдісімен үй шаруашылығы гендеріне (&lt;a href=\"concepts/18s-rrna.html\"&gt;18S rRNA&lt;/a&gt;, GAPDH, HPRT1, GUSB) қатысты қалыпқа келтірілді.&lt;/p&gt;\n&lt;h4 id=\"bulk-rnkh-sekvenirleu\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#bulk-rnkh-sekvenirleu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bulk РНҚ секвенирлеу&lt;/span&gt;&lt;/a&gt;Bulk РНҚ секвенирлеу&lt;/h4&gt;\n&lt;p&gt;Бастапқы адам Treg жасушаларынан РНҚ RNeasy Micro Kit көмегімен бөлінді және SMARTer Ultra Low RNA Kit көмегімен кітапханалар дайындалды. Секвенирлеу NovaSeq X 10B платформасында (100 п.н., жұптық оқу) жүргізілді. Деректерді өңдеу (туралау, сапаны бақылау, сандық талдау) RNAseqWorkflow (DKFZ-ODCF) арқылы орындалды. Оқулар STAR көмегімен GENCODE референстік геномына тураланды. featureCounts көмегімен ген деңгейінде есептеу жүргізілді (X, Y хромосомалары, митохондриялық геном, рРНҚ және тРНҚ алынып тасталды). Дифференциалды экспрессия DESeq2 (v1.48.2) көмегімен талданды. Төмен экспрессияланған гендер (5 үлгіде 10-нан аз оқу) алынып тасталғаннан кейін, DESeq() функциясы арқылы қалыпқа келтіру және статистикалық талдау жүргізілді.&lt;/p&gt;\n&lt;h4 id=\"treg-zhasushalarynyng-metabolizmin-profildeu\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#treg-zhasushalarynyng-metabolizmin-profildeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Treg жасушаларының метаболизмін профильдеу&lt;/span&gt;&lt;/a&gt;Treg жасушаларының метаболизмін профильдеу&lt;/h4&gt;\n&lt;p&gt;CD4⁺CD127^lowCD25⁺ фенотипті оқшауланған реттеуші Т-жасушалары (Tregs) немесе жалпы Т-жасушалар популяциясы MM1.S миелома жасушаларымен 72 сағат бойы бірге өсірілді. Ортаға 100 нг/мл концентрациясында теклистамаб қосылды. Инкубация аяқталғаннан кейін CD138 маркерін көрсететін MM1.S жасушалары CD138 MicroBeads магниттік микротүйіршіктерінің көмегімен қоспадан бөліп алынды. Қалған Т-жасушалары Seahorse XFe96 Analyzer жүйесінің көмегімен XF T Cell Persistence Assay хаттамасы бойынша метаболикалық талдаудан өткізілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Seahorse XFe96 жүйесі жасушалардағы оттегін тұтыну жылдамдығын (OCR) және жасушадан тыс ортаның қышқылдануын (ECAR) нақты уақыт режимінде өлшеу арқылы тотығу фосфорлануы мен гликолиз процестерін бағалауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sandykh-baghalau-zhaene-statistikalykh-taldau\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#sandykh-baghalau-zhaene-statistikalykh-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сандық бағалау және статистикалық талдау&lt;/span&gt;&lt;/a&gt;Сандық бағалау және статистикалық талдау&lt;/h4&gt;\n&lt;p&gt;Деректер жеке мәндер немесе орташа қателікпен (SEM) бірге орташа мәндер түрінде ұсынылған. Таңдама көлемі (n) және қолданылған статистикалық тесттер сурет түсініктемелерінде көрсетілген. Барлық p мәндері екі жақты есептелді. Статистикалық маңыздылық және көптік салыстыруларға түзетулер сурет түсініктемелеріндегі хаттамаларға сәйкес жүргізілді. Есептеулер үшін R (4.3.2 нұсқасы) немесе GraphPad Prism 10.0 бағдарламалық жасақтамасы қолданылды. Функционалдық тәжірибелерде сүйек кемігінің үлгілері зерттеушілерден жасырылды (blinded). Шеннон индексі және басқа да әртүрлілік көрсеткіштері vegan пакеті немесе Gini функциясы арқылы есептелді. Таңдама көлемі қолжетімді материал мөлшерімен анықталды. Сапа бақылауынан өткен барлық жасушалар (Сурет SN) жеке жасуша деңгейіндегі талдауларға енгізілді.&lt;/p&gt;\n&lt;h4 id=\"derekterdi-vizualizaciyalau\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#derekterdi-vizualizaciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деректерді визуализациялау&lt;/span&gt;&lt;/a&gt;Деректерді визуализациялау&lt;/h4&gt;\n&lt;p&gt;Жеке жасушаларды секвенирлеу нәтижесінде алынған кестелік деректер tidyverse топтамасының көмегімен өңделді. Визуализация R ортасында ggplot2 пакеті немесе Python ортасында matplotlib кітапханасы арқылы жүзеге асырылды. Деректердің басқа түрлері GraphPad Prism 10.0 бағдарламасында визуализацияланды. Суреттердің түпкілікті дизайны Adobe Illustrator 2024 бағдарламасында дайындалды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory-f1.jpg\" alt=\"1-сурет. Бірінші желідегі BTCE терапиясы жаңадан диагноз қойылған миелома кезінде клиникалық жауапты күшейтеді және пери\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Бірінші желідегі BTCE терапиясы жаңадан диагноз қойылған миелома кезінде клиникалық жауапты күшейтеді және перифериялық Т-жасушалардың құрамын өзгертеді.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет. Бірінші желідегі BTCE терапиясы жаңадан диагноз қойылған миелома кезінде клиникалық жауапты күшейтеді және перифериялық Т-жасушалардың құрамын өзгертеді. (A) Жаңадан диагноз қойылған көптік миелома (NDMM) (сол жақта) және рецидивті/рефрактерлі көптік миелома (RRMM) (оң жақта) когорталары үшін емдеу мерзімдерін, клиникалық жауаптарды және үлгі жинау нүктелерін көрсететін «жүзуші» графиктер. BTCE — биспецификалық Т-жасуша активаторы. C — цикл. D — күн. DRd — даратумумаб + леналидомид + дексаметазон. DVRd — даратумумаб + бортезомиб + леналидомид + дексаметазон. PR — ішінара жауап. (B) NDMM (BTCE-DRd, n=14; BTCE-DVRd, n=3; DRd, n=6) және RRMM (n=18) бар науқастар үшін 3-циклден кейінгі жауап санаттарының таралуы. Жауап санаттарына мыналар жатады: PD (прогрессивті ауру), SD (аурудың тұрақтануы), MR (минималды жауап), n.d. (орындалмаған немесе бағаланбаған), PR (ішінара жауап), VGPR (өте жақсы ішінара жауап) және CR/sCR (толық жауап/қатаң толық жауап). (C) BTCE-D(V)Rd және DRd емдеу когорталары үшін уақыт өте келе перифериялық қандағы лимфоциттердің абсолютті саны (ALC) (сол жақта); BTCE-D(V)Rd (n=17) және DRd (n=6) арасындағы емдеуден кейінгі (C3-тен кейін) ALC салыстыруы (ортасында); және BTCE-D(V)Rd (n=16) үшін емдеуге дейінгі (C1-ге дейін) және кейінгі (C3-тен кейін) жұпталған ALC (оң жақта). P-мәндері көрсетілген салыстырулар үшін берілген және сәйкесінше Манн-Уитни U-критерийі мен жұпталған таңдамаларға арналған Уилкоксон критерийі арқылы есептелген. (D) BTCE терапиясына дейінгі (C1-ге дейін) және кейінгі (C3-тен кейін) перифериялық қандағы лимфоциттердің негізгі субпопуляцияларының ағындық цитометриясы, соның ішінде тірі PBMC құрамындағы CD3⁺ Т-жасушаларының, NK-жасушаларының және B-жасушаларының пайызы, CD3⁺ Т-жасушаларының ішіндегі CD4⁺ Т-көмекші жасушалары мен CD8⁺ цитотоксикалық Т-жасушаларының пайызы, сондай-ақ CD4⁺ Т-жасушаларының ішіндегі FOXP3⁺ реттеуші Т-жасушаларының (Tregs) пайызы. (E) CCR7 және CD45RO экспрессиясы бойынша анықталған наивті, орталық жады (CM) және эффекторлық жады (EM) Т-жасушаларының репрезентативті FACS-графиктері мен сандық бағалауы. (F) CD4⁺ және CD8⁺ Т-жасушалары құрамындағы наивті, CM және EM субпопуляцияларын сандық бағалау. (G) Емдеуге дейінгі (C1-ге дейін) және кейінгі (C3-тен кейін) перифериялық қандағы CD3⁺ Т-жасушаларындағы PD-1 экспрессиясының репрезентативті FACS-графигі және сандық бағалауы. (D–G) панельдері үшін статистикалық маңыздылық жұпталған t-критерийлері арқылы бағаланды. Жұпталған деректер BTCE-D(V)Rd когортасынан n=17 науқас үшін қолжетімді болды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory-f3.jpg\" alt=\"3-сурет. BTCE реттеуші Т-жасушаларының (Tregs) фенотиптік, функционалдық және метаболикалық қайта бағдарламалануын цитот\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет. BTCE реттеуші Т-жасушаларының (Tregs) фенотиптік, функционалдық және метаболикалық қайта бағдарламалануын цитотоксикалық эффекторлық жасушаларға айналдырады.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-сурет. BTCE реттеуші Т-жасушаларының (Tregs) фенотиптік, функционалдық және метаболикалық қайта бағдарламалануын цитотоксикалық эффекторлық жасушаларға айналдырады. (A) DRd (жоғарыда) және BTCE-DRd (төменде) алған NDMM науқастарындағы FOXP3⁺ реттеуші Т-жасушаларын (Tregs) көрсететін UMAP-графиктері. Цитотоксикалық Tregs бөліп көрсетілген. BTCE — биспецификалық Т-жасуша активаторы. DRd — даратумумаб + леналидомид + дексаметазон. NDMM — жаңадан диагноз қойылған көптік миелома. (B) Treg популяциясы құрамындағы Treg-сәйкестік гендерінің (FOXP3, IL2RA, IKZF2) және цитотоксикалықпен байланысты гендердің (GZMA, GNLY, NKG7) UMAP-экспрессия карталары. (C) BTCE-DRd алған науқастардың Tregs-інде терапиядан кейінгі (C3-тен кейін) және дейінгі (C1-ге дейін) үлгілерді салыстырғандағы дифференциалды ген экспрессиясын көрсететін жанартау графигі. Цитотоксикалықпен байланысты жоғары экспрессияланған гендер (NKG7, CCL5, GZMK, GNLY, GZMA, GZMH) бөліп көрсетілген. (D) BTCE-DRd алған науқастардың терапиядан кейінгі (C3-тен кейін) Tregs-інде белсендірілген иммундық жолдар үшін P-мәндерін, FDR-түзетілген P-мәндерін және байыту көрсеткіштерін көрсететін scGSEA нүктелік графигі. (E) Таңдалған жолдар, соның ішінде қабыну реакциясы, NFκB арқылы TNFα сигналдануы, IL2/STAT5 сигналдануы және mTORC1 сигналдануы үшін репрезентативті байыту қисықтары. (F) DRd және BTCE-DRd Tregs-інде емдеуге дейінгі (C1-ге дейін) және кейінгі (C3-тен кейін) әдебиетте сипатталған exTreg қолтаңба гендері (TBX21, CCL5, NKG7, GAS7, CCL3, CCL4, S1PR5, CEBPD) үшін z-баллмен нормаланған экспрессияның жылу картасы. (A)-(F) панельдеріндегі деректер сүйек кемігі үлгілерін бір жасушалы РНҚ секвенирлеу әдісімен алынған. (G) Емдеуге дейінгі (C1-ге дейін) және кейінгі (C3-тен кейін) наивті және эффекторлық Treg субпопуляцияларының ағындық цитометриясы. (H) Перифериялық қан Tregs-інде е
