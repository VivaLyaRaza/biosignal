            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"213\" cy=\"96\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"607\" cy=\"216\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Гоше ауруы кезінде ми неге&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;құрысуға бейім болады&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta-f1.jpg\" alt=\"Сурет 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Гоше ауруы көбінесе ауыр неврологиялық бұзылыстармен, соның ішінде эпилепсиялық ұстамалармен сипатталады. Бұған дейін бұл процестерді жануарлар модельдерінде зерттеу қиын болған. Зерттеушілер адам миының дамуын қайталайтын органоидтарды жасап шығарды. Бұл әдіс липидтердің жиналуы мидағы қозу мен тежелу тепе-теңдігін қалай бұзатынын көрсетіп берді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;GBA1 мутациясы липидтер алмасуын бұзады&lt;/li&gt;\n&lt;li&gt;Ми органоидтарында глутаматергиялық қозудың күшеюі анықталды&lt;/li&gt;\n&lt;li&gt;Тежеуші нейрондар функциясының төмендеуі байқалды&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Гоше ауруы GBA1 геніндегі мутациялар салдарынан болатын лизосомалық ауру. Бұл мутация глюкоцереброзидаза ферментінің жетіспеушілігіне әкеледі, нәтижесінде жасушаларда улы липидтер жиналады. Зерттеушілер индуцирленген плюрипотентті дің жасушаларын (iPSC) пайдаланып, сау және ауру жасушалар желілерін жасады. Осы жасушалардан ми қыртысы мен субпаллиалды бөліктерді имитациялайтын органоидтар өсірілді.&lt;/p&gt;\n&lt;p&gt;Жеке жасушалардың транскриптомдық талдауы мутацияның липидтер алмасуы мен митохондрия функцияларын ерте кезеңде бұзатынын көрсетті. Кортикальды органоидтарда нейрондардың көбеюі азайып, олардың глутаматергиялық (қоздырушы) бағытқа ауысуы байқалды. Функционалдық тесттер органоидтардағы нейрондық желілерде патологиялық гиперқозғыштықты растады. ГАМК-ергиялық (тежеуші) нейрондар бұл артық қозуды теңестіре алмады, бұл науқастардағы емдеуге қиын құрысулардың себебін түсіндіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу in vitro жағдайында жүргізілді, сондықтан ағзаның күрделі жүйелі өзара әрекеттесуін толық қамтымайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Гоше ауруы — бұл GBA1 геніндегі аутосомды-рецессивті мутациялар салдарынан туындайтын сирек кездесетін лизосомалық ауру. Бұл ген лизосомалық глюкоцереброзидаза ферментін кодтайды. Аурудың үш түрі бар, олар жүйке жүйесінің зақымдану дәрежесіне қарай жіктеледі. 2-типтегі ауру ерте басталатын нейропатологиямен, дамудың тежелуімен, эпилепсиялық ұстамалармен және ерте өліммен сипатталады. Нейропатиялық Гоше ауруының механизмдерін зерттеу негізінен жануарлар модельдеріне сүйенеді және көбінесе нейрондардың кешкі фенотиптеріне бағытталған.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;2-типтегі Гоше ауруы — мидың дамуының ерте кезеңдеріндегі механизмдері толық зерттелмеген ауыр нейродегенеративті жағдай.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз сау донорлар мен Гоше ауруы бар науқастардан алынған индуцирленген плюрипотентті діңгекті жасушалар (иПСК) желілерін жасадық және олардан изогенді бақылау желілерін алдық. Осы желілерді қолдана отырып, кортикальды және субпаллиальды ми органоидтары өсірілді. Бұл модельдерде біз липид алмасуының ерте бұзылуларын анықтадық: глюкозилцерамидтің жинақталуы, глюкозилсфингозин деңгейінің айтарлықтай жоғарылауы және кейінірек ганглиозидтер концентрациясының артуы байқалды, бұл клиникалық нәтижелерді қайталайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;иПСК (индуцирленген плюрипотентті діңгекті жасушалар) — кез келген жасуша түріне, соның ішінде нейрондарға айнала алатын, ересек жасушалардан қайта бағдарламалау арқылы алынған жасушалар.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бір жасушалы транскрипциялық профильдеу (&lt;a href=\"concepts/scrna-seq.html\"&gt;scRNA-seq&lt;/a&gt;) арқылы жаңа фенотиптер ашылды. Субпаллиальды органоидтарда холестерин алмасуын күшейтетін миграциялық интернейрондардың ерте көбеюі байқалды. Кортикальды органоидтарда митохондриялық гендердің ерте белсендірілуі және пролиферацияның төмендеуі, содан кейін ГАМК-ергиялық нейрондардан глутаматергиялық нейрондарға ауысу және синаптикалық құрылымға қатысты гендер экспрессиясының күрт артуы анықталды.&lt;/p&gt;\n&lt;p&gt;Функционалдық талдаулар кортикальды органоидтардың жоғары қозғыштығын және ГАМК-А рецепторларының блокадасына жауаптың төмендегенін көрсетті. Қосымша 2D нейрондық желі модельдері органоидтардан алынған деректерді растады: Гоше ауруы кезінде глутаматергиялық нейрондар гиперқозғыштықты көрсетеді, ал ГАМК-ергиялық нейрондар бұл артық қозуды теңестіре алмайды. Қоздыру/тежелу тепе-теңдігінің бұл бұзылуы науқастарда емге төзімді ұстамалардың дамуын түсіндіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу органоидтар мен 2D-дақылдарда жүргізілді, бұл адам миының жеңілдетілген моделі болып табылады, сондықтан нәтижелер клиникалық жағдайда қосымша тексеруді қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"goshe-auruy-zhaene-kholdanystaghy-modelderding-shekteuleri\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#goshe-auruy-zhaene-kholdanystaghy-modelderding-shekteuleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гоше ауруы және қолданыстағы модельдердің шектеулері&lt;/span&gt;&lt;/a&gt;Гоше ауруы және қолданыстағы модельдердің шектеулері&lt;/h4&gt;\n&lt;p&gt;Лизосомалық қор жинақталу аурулары (LSD) лизосомалық ферменттердің тапшылығынан туындайтын сирек кездесетін тұқым қуалайтын метаболикалық аурулар тобы болып табылады. Бұл жасушалық гомеостаз үшін маңызды лизосомалық жүйенің бұзылуына және ыдырамаған молекулалардың жинақталуына әкеледі. Гоше ауруы — GBA1 геніндегі мутациялар салдарынан болатын LSD-дің ең көп таралған түрі, ол β-глюкоцереброзидаза (GCase) ферментін кодтайды. GCase тапшылығы лизосомаларда глюкозилцерамидтің (GlcCer) жинақталуына әкеліп, гепатоспленомегалия, панцитопения және сүйек зақымдануын тудырады. Сонымен қатар, GBA1 мутациясын тасымалдау Паркинсон ауруының даму қаупімен байланысты.&lt;/p&gt;\n&lt;p&gt;Гоше ауруы үш түрге бөлінеді: I тип (нейронопатиялық емес) анемиямен және ағзалардың ұлғаюымен сипатталады; II тип (жедел нейронопатиялық) сәбилерде тез дамитын нейродегенерациямен және ерте өліммен көрінеді; III тип (созылмалы нейронопатиялық) баяу дамиды. Қазіргі емдеу әдістері (фермент алмастырушы терапия) жүйелі симптомдарды жақсартқанымен, неврологиялық көріністерге әсері аз, өйткені ферменттер қан-ми тосқауылынан өте алмайды. Бұл миды аурудың дамуына осал қалдырады және паркинсонизммен байланысын түсіндіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GBA1 мутациясынан туындаған Гоше ауруы GlcCer мен нейроуытты глюкозилсфингозиннің (GlcSph) жинақталуына әкеледі, алайда қолданыстағы емдеу әдістері қан-ми тосқауылына байланысты неврологиялық бұзылыстарды тиімді түзете алмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;GlcCer Гольджи аппаратында синтезделеді және мидың дамуы үшін қажетті ганглиозидтер сияқты күрделі гликосфинголипидтердің бастапқы өнімі болып табылады. Лизосомалық ыдырау бұзылғанда, GlcCer жинақталып, GlcSph-ке айналады — бұл аурудың нейроуытты биомаркері. Дәстүрлі тышқан модельдері түрлік айырмашылықтар мен ми құрылымының қарапайымдылығына байланысты адам ауруының уақытша динамикасын толық қайталамайды.&lt;/p&gt;\n&lt;h4 id=\"organoidtar-koemegimen-goshe-auruyn-modeldeu\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#organoidtar-koemegimen-goshe-auruyn-modeldeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Органоидтар көмегімен Гоше ауруын модельдеу&lt;/span&gt;&lt;/a&gt;Органоидтар көмегімен Гоше ауруын модельдеу&lt;/h4&gt;\n&lt;p&gt;Адам миының тіндерінің тапшылығын жою үшін ғалымдар индуцирленген плюрипотентті дің жасушаларын (iPSC) пайдаланады. Олар әртүрлі нейрон түрлеріне дифференциациялану және ми органоидтарын қалыптастыру қабілетіне ие. Бұған дейін нейрондар мен астроциттердің модельдері, сондай-ақ Паркинсон ауруын зерттеу үшін ортаңғы ми органоидтары жасалған болатын.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;iPSC (индуцирленген плюрипотентті дің жасушалары) — бұл ересек жасушаларды (мысалы, тері фибробласттары) эмбрионалдық дің жасушалары күйіне қайтару арқылы алынған жасушалар, олар кез келген тін түріне айнала алады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл зерттеуде біз Гоше ауруы бар науқастың фибробласттарынан iPSC алдық. Геномды редакциялау әдістерімен науқас желісіндегі мутациялар түзетілді және бақылау желісінде GBA1 гені нокаутқа ұшыратылды, осылайша изогенді жұптар жасалды. Бұл төрт iPSC желісі кортикальды және субпаллиальды алдыңғы ми органоидтарына дифференциацияланды. Біз GlcSph жинақталуын және ганглиозидтер (GM1) деңгейінің өсуін анықтадық. Бір жасушалы транскриптомика талдауы нейрондық спецификация, миграция және жетілу процестеріндегі өзгерістерді көрсетті. Функционалдық тесттер глутаматергиялық және ГАМКергиялық нейрондардағы кемшіліктерді растады, бұл ауру механизмдері туралы жаңа мәлімет береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу in vitro модельдерге (органоидтарға) негізделген, олар мидың дамуын дәл қайталағанымен, бүкіл ағзаның жүйелі өзара әрекеттесуін толық көрсете алмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"sau-bakhylau-zhaene-goshe-auruynyng-ipsk-zhelilerin-tiisti-izogendi-bakhylaumen-khuru\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#sau-bakhylau-zhaene-goshe-auruynyng-ipsk-zhelilerin-tiisti-izogendi-bakhylaumen-khuru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сау бақылау және Гоше ауруының iPSK желілерін тиісті изогенді бақылаумен құру&lt;/span&gt;&lt;/a&gt;Сау бақылау және Гоше ауруының iPSK желілерін тиісті изогенді бақылаумен құру&lt;/h4&gt;\n&lt;p&gt;Нейронопатиялық Гоше ауруын модельдеу үшін біз науқастың тері фибробласттарын мРНҚ-репрограммалау арқылы iPSK желілерін алдық. Клондар ISSCR стандарттарына сәйкес сипатталды: олар типтік морфологияға (Сурет S1A) және NANOG, OCT3/4, SOX2 және TRA-1-81 маркерлерінің ақуыз (Сурет S1A) және мРНҚ (Сурет S1B) деңгейіндегі экспрессиясына ие болды. Гоше ауруы (GD) желісі хромосомалық ауытқуларсыз (Сурет S1C) және үш ұрық жапырақшасына дифференциациялану қабілетіне ие болды (Сурет S1D). &lt;a href=\"concepts/sekvenirovanie-po-sengeru.html\"&gt;Сэнгер секвенирлеуі&lt;/a&gt; GBA1 геніндегі P415R және L483P мутацияларын растады (Сурет S1E). Бастапқы «сау» желіде N370S мутациясы анықталғандықтан, ол сау тасымалдаушы (HC) желісі деп қайта аталды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;iPSK (индукцияланған плюрипотентті діңгекті жасушалар) — бұл ересек жасушаларды эмбрионалдық діңгекті жасушалар күйіне қайтару арқылы алынған, кез келген ұлпаға айнала алатын жасушалар.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;HC желісінде &lt;a href=\"concepts/knock-out.html\"&gt;нокаут&lt;/a&gt; (HC-KO) жасау үшін CRISPR/Cas9 қолданылды. GBA1LP псевдогенімен 96% гомологияға байланысты, біз GBA1-дің 9-экзонындағы 55 б.ж. ұзындықтағы бірегей бөлікті нысанаға алдық (Сурет 1A). Екі аллелі де зақымдалған клон алынды: 74 б.ж. кірістіру (K447fsX21 стоп-кодоны) және 30 б.ж. делециясы (F436_T446delinsS) (Сурет 1B). Дәл осы стратегия GD желісіндегі P415R мутациясын түзетуге мүмкіндік берді (Сурет 1C). 10-экзондағы L444P мутациясын түзету үшін псевдогенмен айырмашылығы болмағандықтан, ДНҚ-ның екі тізбекті үзілуінен аулақ болу үшін прайм-редакциялау (PE3b) қолданылды (Сурет 1C). Алынған GD-iso желісі плюрипотенттілікті, қалыпты кариотипті және дифференциациялану қабілетін сақтап қалды (Сурет 1D–G).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta-f1.jpg\" alt=\"Сурет 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 1&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Изогенді желілер (HC-KO және GD-iso) GCase ферментінің белсенділігін толық қалпына келтірді немесе имитациялады: GD-iso үшін 73,46 нмоль/сағ·мг ақуыз (бастапқы GD 11,57 болды) және HC-KO үшін 7,39 нмоль/сағ·мг (бақылау HC 72,23 болды).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Функционалдық тексеру HC желісіндегі GCase белсенділігі 72,23 нмоль/сағ·мг ақуызды құрағанын, ал GD желісінде небәрі 11,57 болғанын көрсетті. HC-KO желісінде белсенділік 7,39-ға дейін төмендеді, ал түзетілген GD-iso желісінде 73,46 нмоль/сағ·мг-ға дейін қалпына келді (Сурет 1H). Осылайша, Гоше ауруының механизмдерін зерттеу үшін екі жұп изогенді желі (Кесте S1) құрылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR/Cas9 және прайм-редакциялау әдістері жанама мутациялар қаупін азайтқанымен, off-target эффектілерді мұқият бақылау қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"goshe-auruy-bar-mi-organoidtarynda-sfingolipidterding-progressivti-zhinakhtaluy\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#goshe-auruy-bar-mi-organoidtarynda-sfingolipidterding-progressivti-zhinakhtaluy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гоше ауруы бар ми органоидтарында сфинголипидтердің прогрессивті жинақталуы&lt;/span&gt;&lt;/a&gt;Гоше ауруы бар ми органоидтарында сфинголипидтердің прогрессивті жинақталуы&lt;/h4&gt;\n&lt;p&gt;Гоше ауруының нейронопатиялық түрін модельдеу үшін біз iPSC желілерін (HC, HC-KO, GD және GD-iso) қолданып, оларды алдыңғы мидың субпаллиалды (hSO) және кортикальды (hCO) органоидтарына дифференциацияладық (2A-сурет). Органоидтар 150 күнге дейін (DIV) өсірілді, барлық желілер ұқсас өсу динамикасын көрсетті (2B-сурет). DIV75 кезінде барлық желілерде SOX2+ нейрондық розеткалар мен NeuN+ нейрондар қалыптасты (2C, D-суреттер).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;iPSC (индукцияланған плюрипотентті діңгекті жасушалар) — бұл ересек ағза жасушалары, олар зертханалық жағдайда эмбрионалды діңгекті жасушалар күйіне қайтарылған және кез келген ұлпаға, соның ішінде нейрондарға айнала алады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Lysotracker бояуының көмегімен FACS талдауы HC-KO желісінде лизосомалардың көлемі мен саны бақылау тобына (HC) қарағанда айтарлықтай артқанын көрсетті. Сигналдың өсуі hSO үшін 1,48 есе және hCO үшін 1,32 есе (DIV75), ал DIV150 кезінде сәйкесінше 1,48 және 1,52 есені құрады (2E-сурет). GD және GD-iso желілерінде айқын айырмашылықтар байқалмады, бұл HC-KO желісіндегі ферментативті белсенділіктің төмендігіне байланысты фенотиптің ауырлауымен түсіндіріледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HC-KO желісі GD желісіне қарағанда әлдеқайда күшті лизосомалық дисфункцияны көрсетеді, бұл 150-күнге дейін Lysotracker сигналының артуымен расталады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Глюкозилцерамид (GlcCer) ыдырауының бұзылуына байланысты біз DIV150 кезінде дот-блот талдауын өткіздік (2F-сурет, SN-сурет). HC-KO-да GlcCer деңгейі бақылау тобына қарағанда 2,6 (hSO) және 2,5 (hCO) есе өсті, ал GD желісінде өсім аз болды (1,25 және 1,05 есе). HPLC-MS көмегімен DIV150 кезінде жүргізілген GlcSph талдауы HC-KO (1987,75 және 1364,55 нмоль/г ақуыз) және GD (2,4 және 7,46 нмоль/г ақуыз) желілерінде жоғары деңгейді көрсетті (2G-сурет). GD желісінде GlcSph жинақталуы DIV75 кезінде-ақ анықталды (SN-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу органоидтарда жүргізілді; бұл жасанды модельдер адам миындағы барлық патологиялық процестерді толық көрсете алмауы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз ганглиозидтер метаболизмін де зерттедік. Жұқа қабатты хроматография DIV150 кезінде GM1 жинақталуын көрсетті (SN-сурет). Vybrant Alexa Fluor 555 көмегімен FACS талдауы мембранада GM1 жинақталуын растады: DIV75 кезінде флуоресценцияның өсуі HC-KO-да 1,37 және GD-да 1,21 есені, ал DIV150 кезінде hSO-да 1,77 (HC-KO) және 1,39 (GD) есені, hCO-да 1,29 (HC-KO) және 1,21 (GD) есені құрады (2H-сурет). Бұл нәтижелер GlcCer катаболизмінің бұзылуы нейрондық мембраналарда күрделі сфинголипидтердің жинақталуына әкелетінін көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"goshe-auruy-bar-hso-da-migraciyalanatyn-internejrondar-sanynyng-artuy\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#goshe-auruy-bar-hso-da-migraciyalanatyn-internejrondar-sanynyng-artuy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гоше ауруы бар hSO-да миграцияланатын интернейрондар санының артуы&lt;/span&gt;&lt;/a&gt;Гоше ауруы бар hSO-да миграцияланатын интернейрондар санының артуы&lt;/h4&gt;\n&lt;p&gt;Гликосфинголипидтер мидың қалыпты дамуы үшін маңызды. Гоше ауруы кезінде hSO (мидың алдыңғы бөлігінің органоидтары) және hCO (қыртыс органоидтары) жасушалық құрамына әсерін зерттеу үшін бір жасушалы РНҚ секвенирлеуі (&lt;a href=\"concepts/single-cell-rna-sequencing.html\"&gt;scRNA-seq&lt;/a&gt;) талдауы жүргізілді. Зерттеуде 4 iPSC желісінен және 3 тәуелсіз дифференциация сериясынан алынған DIV75 және DIV150 күндік органоидтар пайдаланылды. Үлгілерді бір уақытта өңдеу үшін 10x Fixed RNA Profiling жүйесі қолданылды. Барлығы 21 295 Гоше және 17 939 бақылау жасушалары (hSO үшін), сондай-ақ 20 322 және 23 017 жасушалар (hCO үшін) талданды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;scRNA-seq — күрделі тіндердегі әрбір жасушаның генетикалық белсенділігін жеке-жеке зерттеуге мүмкіндік беретін әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;hSO-да 9 жасушалық популяция, соның ішінде бөлінетін жасушалар, радиалды глия, астроглия және әртүрлі нейрондар анықталды (3A-B-сурет, 3D-сурет). Бақылау және Гоше топтарында DIV75-тен DIV150-ге дейін вентральды прогениторлар мен миграцияланатын интернейрондар саны артты (SN3A-сурет). DIV75-те Гоше органоидтарында стриарлы MSN-нейрондардың азаюы және миграцияланатын интернейрондардың айтарлықтай өсуі байқалды (3C-сурет, SN3D-сурет). DIV150-де айырмашылықтар азайды: тек холинергиялық нейрондар сәл азайып, MSN-нейрондар саны өсті (SN3B, G-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DIV75 сатысында Гоше ауруы кезінде миграцияланатын интернейрондар популяциясы айтарлықтай өскен.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дифференциалды экспрессияланатын гендер (&lt;a href=\"concepts/gene-expression.html\"&gt;DEG&lt;/a&gt;) талдауы DIV75-те 114 жоғары және 70 төмен, ал DIV150-де 106 жоғары және 22 төмен экспрессияланған гендерді көрсетті (SN3C, D, F, G-сурет). NR2F1 гені екі мерзімде де ең көп төмендеген ген болды, ол нейрондар балансын басқарады. GO талдауы DIV75-те плазмалық мембрана процестерінің төмендегенін, лизосомалық және синаптикалық жолдардың белсендірілгенін көрсетті (SN3E-сурет). DIV150-де синаптикалық функциялар белсендіріліп, миграция және жасушадан тыс матрицамен байланысты жолдар бәсеңдеді (SN3H-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер зертханалық жағдайдағы органоидтарда алынған, бұл тірі ағзадағы процестердің толық көшірмесі емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;DIV75-тегі миграцияланатын интернейрондар талдауы 89 жоғары және 29 төмен экспрессияланған гендерді анықтады (3E-сурет, SN3D-сурет). Холестерин метаболизмі мен синаптикалық адгезия белсендірілген, ал Гольджи аппаратының функциясы, аутофагия және PKC-сигналдау бәсеңдеген (3F-сурет). Қорытындылай келе, Гоше ауруында мидың дамуы кезінде интернейрондар миграциясы мен холестерин алмасуы бұзылады.&lt;/p&gt;\n&lt;h4 id=\"goshe-auruy-kezindegi-hco-da-mitohondriyalykh-genderding-erte-belsendirilui-zhaene-nejrondykh-damudyng-auysuy\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#goshe-auruy-kezindegi-hco-da-mitohondriyalykh-genderding-erte-belsendirilui-zhaene-nejrondykh-damudyng-auysuy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гоше ауруы кезіндегі hCO-да митохондриялық гендердің ерте белсендірілуі және нейрондық дамудың ауысуы&lt;/span&gt;&lt;/a&gt;Гоше ауруы кезіндегі hCO-да митохондриялық гендердің ерте белсендірілуі және нейрондық дамудың ауысуы&lt;/h4&gt;\n&lt;p&gt;Адам миының органоидтарын (hCO) талдау прогениторлар, радиалды глия, астроглия және әртүрлі нейрон түрлерін қоса алғанда 14 жасушалық популяцияны анықтады (4A, 4D-сурет). 75-күннен 150-күнге дейінгі (DIV) кезеңде бақылау және Гоше органоидтарында Кахаль-Ретциус нейрондарының азаюы және GABA-ергиялық нейрондардың көбеюі байқалды (4B-сурет және SN4A-сурет). Алайда, Гоше ауруында (GD) 75-күні GABA-ергиялық нейрондардың артық мөлшері анықталса, 150-күні тежегіш нейрондардың есебінен қоздырушы (глутаматергиялық) нейрондар мен аралық прогениторлардың үлесі артқаны байқалды (4C-сурет, SN4B-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Гоше ауруы кезінде нейрондардың жедел жетілуі байқалады: 75-күні GABA-ергиялық жасушалар басым болса, 150-күні глутаматергиялық фенотипке ауысу жүреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дифференциалды экспрессияланатын гендерді (DEG) талдау 75-күні 659 жоғары және 1008 төмен экспрессияланған генді, ал 150-күні 498 жоғары және 72 төмен экспрессияланған генді көрсетті (SN4C-F-сурет). 75-күні органоидтарда жасушалық цикл жолдарының төмендеуі және синаптикалық гендердің белсендірілуі байқалды, бұл жедел дифференциацияны білдіреді (4E-сурет). &lt;a href=\"concepts/gsea.html\"&gt;GSEA&lt;/a&gt; талдауы электрон тасымалдау белсенділігінің күшеюін көрсетті (4F-сурет), бұл 10 митохондриялық генмен байланысты (SN4C, SN5A-сурет). Бұл нейрондардың жетілуі кезінде гликолизден тотығу фосфорлануына ауысуды көрсетуі мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GSEA (Gene Set Enrichment Analysis) — бұл жекелеген гендерді емес, функционалды байланысты гендер топтарының өзгеруін анықтауға арналған статистикалық әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу органоидтарда жүргізілген; митохондриялық және жасушалық өзгерістер адам миындағы патофизиологияны толықтай көрсетпеуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;TMRM қарқындылығын өлшеу GD кезінде нейрондардың екі түрінде де митохондриялық потенциалдың артқанын растады (SN5B, C-сурет). 150-күні GO-талдауы GABA-ергиялық нейрондардың даму жолдарының белсендірілуін көрсетті (4G-сурет), бұл олардың тапшылығы кезіндегі компенсаторлық механизм болуы мүмкін. Бұл GABA-ергиялық желі гендерінің (DLX1/2/5, SLAIN1, SP9, TOX3) төмендеуімен және глутаматергиялық маркерлердің (BHLHE22, EMX1, NEUROD2/6, SATB2) артуымен расталады (4G, 4H-сурет). Қорытындылай келе, нәтижелер Гоше ауруында ерте митохондриялық дисфункция мен нейрондардың жедел жетілуін көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"goshe-auruy-organoidtaryndaghy-khozdyrushy-zhaene-tezheushi-nejrondykh-funkciyalardyng-oezgerui-zhelilik-giperkhozugha-aekeledi\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#goshe-auruy-organoidtaryndaghy-khozdyrushy-zhaene-tezheushi-nejrondykh-funkciyalardyng-oezgerui-zhelilik-giperkhozugha-aekeledi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гоше ауруы органоидтарындағы қоздырушы және тежеуші нейрондық функциялардың өзгеруі желілік гиперқозуға әкеледі&lt;/span&gt;&lt;/a&gt;Гоше ауруы органоидтарындағы қоздырушы және тежеуші нейрондық функциялардың өзгеруі желілік гиперқозуға әкеледі&lt;/h4&gt;\n&lt;p&gt;Липидтерді талдау және бір жасушалы РНҚ секвенирлеу нәтижелері (GABA-ергиялық бағыттан глутаматергиялық бағытқа ауысу) негізінде біз тежеуші нейрондардың функционалдық тапшылығын зерттедік. Ол үшін біз 64 электродты MEA жүйесін қолданып, органоидтарды дамудың 150-күнінде (DIV150) электродтарға орналастырдық (5-сурет A). GABA-ергиялық нейрондардың тапшылығын анықтау үшін біз базальды белсенділікті тіркеп, содан кейін тежелуді бөгеу үшін PTX, ал қозуды бөгеу үшін NBQX және APV қостық (5-сурет A). Біз жүйенің базальды белсенділікті, PTX-тен кейінгі қозудың артуын және NBQX/APV-ден кейінгі белсенділіктің тоқтауын дұрыс анықтайтынын растадық (5-сурет B).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MEA (көп электродты матрица) — нейрондық желілердің электрлік белсенділігін нақты уақыт режимінде тіркеу әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әр желіден 9–10 органоидты талдағаннан кейін, PTX қосқанда барлық үлгілерде қозудың артқанын байқадық (5-сурет B). Алайда, GD (Гоше ауруы) және GD-iso (бақылау) органоидтарының реакциясы әртүрлі болды: GD-iso-да спайк қатынасы 2,44 есе, ал GD-де 1,39 есе өсті (5-сурет C). Бұл тежелудің бұзылғанын немесе глутаматергиялық нейрондардың басымдығы гиперқозуды тудыратынын көрсетеді. GD hCO-ның базальды белсенділігі GD-iso-дан әлдеқайда жоғары болды (5-сурет D), бұл дамудағы өзгерістердің гиперқозудың негізгі себебі екенін растайды. HC және HC-KO жұбында (SN-сурет) сәйкесінше 1,41 және 1,74 есе өсу байқалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Гоше ауруы бар органоидтар жоғары базальды белсенділікті көрсетеді және тежелуді бөгеуге аз жауап береді, бұл нейрондық желінің гиперқозу күйіне әкеледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;hSO үшін PTX-тен кейінгі өзгерістер ұқсас болды: GD-iso үшін 2,73 есе және GD үшін 2,49 есе өсу (5-сурет B, C). HC және HC-KO жұбында сәйкесінше 2,03 және 3,24 есе өсу байқалды (SN-сурет). hSO негізінен GABA-ергиялық нейрондардан тұратындықтан, тежелуді бөгеу белсенділікке қатты әсер етті. hCO-дан айырмашылығы, hSO-да базальды белсенділік деңгейі жоғары емес еді (SN-сурет), бұл глутаматергиялық нейрондардың гиперқозу фенотипінің драйвері екенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу органоидтарда (in vitro) жүргізілген, сондықтан нәтижелерді адам миындағы процестерге тікелей көшіру сақтықты талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"goshe-auruy-kezindegi-gaba-ergiyalykh-zhaene-glutamatergiyalykh-nejrondary-bar-2d-dakhyldar-nejrondykh-zheli-disfunkciyasynyng-zhasushalykh-mehanizmderin-anykhtajdy\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#goshe-auruy-kezindegi-gaba-ergiyalykh-zhaene-glutamatergiyalykh-nejrondary-bar-2d-dakhyldar-nejrondykh-zheli-disfunkciyasynyng-zhasushalykh-mehanizmderin-anykhtajdy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гоше ауруы кезіндегі GABA-ергиялық және глутаматергиялық нейрондары бар 2D-дақылдар нейрондық желі дисфункциясының жасушалық механизмдерін анықтайды&lt;/span&gt;&lt;/a&gt;Гоше ауруы кезіндегі GABA-ергиялық және глутаматергиялық нейрондары бар 2D-дақылдар нейрондық желі дисфункциясының жасушалық механизмдерін анықтайды&lt;/h4&gt;\n&lt;p&gt;Гоше ауруы (GD) органоидтарындағы гиперқозғыштықтың себебі дамудағы өзгерістер ме, әлде басқа факторлар ма екенін анықтау үшін біз 2D-дақылдарда жоғары тығыздықтағы MEA жазбаларын жүргіздік. Біз GD және GD-iso (бақылау) изогендік желілерін қолдандық. Бағытталған бағдарламалау әдісімен глутаматергиялық нейрондардың, GABA-ергиялық нейрондардың және астроциттердің таза популяциялары алынды. Біз химералық дақылдар жасадық: сау глутаматергиялық нейрондар/астроциттер ауру GABA-ергиялық нейрондармен және керісінше (6A-сурет). Бұл әр нейрон түрі үшін жасуша санын сәйкестендіруге және олардың желілік гиперқозғыштыққа әсерін DIV14-тен DIV54-ке дейін бақылауға мүмкіндік берді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ауру глутаматергиялық нейрондары бар дақылдар айқын гиперқозғыштықты (DIV50-де 1,2 Гц) көрсетті, ал ауру GABA-ергиялық нейрондар бақылау тобына жақын (0,86 Гц) нәтиже берді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Барлық топтарда орташа импульс жиілігі (firing rate) уақыт өте келе 0,5 Гц-тен 0,76–1,55 Гц-ке дейін өсті (6B, 6C-сурет). Толық GD дақылдарында DIV50-де жиілік 1,55 Гц-ке жетті, ал GD-iso-да 0,76 Гц болды. Ауру GABA-ергиялық нейрондары бар дақылдар бақылау тобына ұқсас (0,86 Гц), ал ауру глутаматергиялық нейрондары бар дақылдар орташа гиперқозғыштық (1,2 Гц) көрсетті. Спайк амплитудасы мен интервалдары айтарлықтай ерекшеленбеді (6C-сурет). Пикротоксинмен (PTX) өңдеу ауру GABA-ергиялық нейрондар тобында белсенділіктің арту тенденциясын көрсетті (SN-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MEA (микроэлектродты матрица) — нейрондардың электрлік белсенділігін нақты уақыт режимінде тіркейтін құрылғы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Глутаматергиялық нейрондардың рөлін нақтылау үшін біз CAMKIIɑ промоторы бар кальций сенсорын және бикукуллин (BIC) көмегімен GABA-A рецепторларын блоктайтын әдісті қолдандық (DIV28–DIV49). DIV42 және DIV49-да ауру глутаматергиялық және сау GABA-ергиялық нейрондары бар топтарда көбірек жасушалар (63–70%) ұжымдық оқиғаларға тартылды (7B-сурет). BIC қосқаннан кейін синхрондалу барлық топтарда артты, бірақ ауру глутаматергиялық нейрондары бар дақылдарда бұл көрсеткіш төменірек болып қалды (90,5%-дан төмен), әсіресе ауру GABA-ергиялық нейрондар да болған кезде (75,8%-дан төмен).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу 2D-дақылдарда жүргізілген, бұл мидың күрделі құрылымын толықтай көрсетпеуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"nejrondar-belsendiligi-men-kalcij-dinamikasyn-taldau\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#nejrondar-belsendiligi-men-kalcij-dinamikasyn-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нейрондар белсенділігі мен кальций динамикасын талдау&lt;/span&gt;&lt;/a&gt;Нейрондар белсенділігі мен кальций динамикасын талдау&lt;/h4&gt;\n&lt;p&gt;Бикукуллинді қолдану әр жасушадағы шыңдар (peaks) санын арттырды, әсіресе DIV35, DIV42 және DIV49 мерзімдерінде. Химерлік дақылдарда (сау глутаматергиялық + ауру ГАМК-ергиялық немесе керісінше) шыңдар саны әрқашан 22-ден жоғары болды, ал екі түрі де зақымдалған дақылдарда бұл көрсеткіш 14-тен төмен қалды (7C-сурет). Орташа транзиенттер санын талдау (SN-сурет) көрсеткендей, ауру глутаматергиялық нейрондардың сау ГАМК-ергиялық нейрондармен бірлескен базалық белсенділігі толық сау дақылдарға қарағанда айтарлықтай жоғары: DIV28-де (10,9 қарсы 7,7), DIV35-те (12,9 қарсы 10,2) және DIV49-да (11,7 қарсы 6,5) (SN-сурет). Ауру глутаматергиялық нейрондардың сау ГАМК-ергиялық нейрондармен бірлескен белсенділігі сау глутаматергиялық нейрондардың ауру ГАМК-ергиялық нейрондармен бірлескен белсенділігінен DIV35 (12,9 қарсы 9,9) және DIV49 (11,7 қарсы 8,0) мерзімдерінде айтарлықтай ерекшеленді (SN-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ауру глутаматергиялық нейрондар сау ГАМК-ергиялық нейрондармен бірге болғанда жоғары белсенділік көрсетеді, бұл компенсаторлық механизмдердің бар екенін білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бикукуллин — ГАМК рецепторларының антагонисі, ол тежегіш әсерді бөгеп, глутаматергиялық желілердің жасырын қозғыштығын бағалауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Толық «ауру» дақылдарда максималды белсенділіктің байқалмауы MEA деректері мен тек қоздырушы кірісті талдау арасындағы алшақтықты көрсетеді. Мүмкін, артық белсенділік ГАМК-ергиялық нейрондардың гиперқозғыш глутаматергиялық жасушаларға жауабымен байланысты. Шыңдар астындағы аудан (&lt;a href=\"concepts/area-under-the-curve.html\"&gt;AUC&lt;/a&gt;) тек ауру ГАМК-ергиялық нейрон бар дақылдарда айтарлықтай жоғары болды (DIV35-те 388 және DIV42-де 259). Тек ауру глутаматергиялық нейрон болғанда аралық фенотип (187 және 180), ал толық ауру дақылдарда ең төменгі мәндер (84 және 118, 7D-сурет) тіркелді. Бұл сау глутаматергиялық нейрондардың ауру ГАМК-ергиялық нейронның күшті тежегіш әсеріне жауап ретінде гомеостатикалық түзету қабілеті бар екенін, ал ауру глутаматергиялық нейрондарда бұл механизмнің бұзылғанын білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу жасуша дақылдарында жүргізілген, сондықтан байқалған компенсаторлық механизмдер тірі ағзадағы процестерден өзгеше болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;MEA және кальций имиджингінің нәтижелері Гоше ауруында глутаматергиялық нейронның гиперқозғыш екенін растайды. ГАМК-ергиялық нейрон да гиперқозғыш болуы мүмкін, бірақ олардың желілік өзгерістерге қосқан үлесі шектеулі.&lt;/p&gt;\n&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;h4 id=\"naetizhelerdi-talkhylau\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#naetizhelerdi-talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелерді талқылау&lt;/span&gt;&lt;/a&gt;Нәтижелерді талқылау&lt;/h4&gt;\n&lt;p&gt;Біз алғаш рет индуцирленген плюрипотентті бағаналы жасушалардан (iPSC) алынған адамның алдыңғы ми органоидтары негізінде Гоше ауруының моделін жасадық. Ол үшін науқас (GD) және сау донор (HC) жасуша желілерін пайдаланып, геномды редакциялау арқылы изогенді жұптарды (GD-iso және HC-KO) құрдық. Алынған кортикальды (hCO) және субпаллиальды (hSO) органоидтар патологияға тән липидтердің жинақталуын қайталайды. Бұл құрылымдардың таңдалуы науқастарда байқалатын қыртыс дегенерациясы мен глиоз туралы клиникалық мәліметтерге негізделген. Біздің модельдеріміз гликосфинголипидтердің жинақталуын көрсетеді, бұл нейрондардың жетілуін бұзады, глутаматергиялық және ГАМК-ергиялық желілердің дисфункциясына және олардың гиперқозғыштығына әкеледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Гоше ауруының ми органоидтарындағы алғашқы моделі жасалды; ол липидтердің жинақталуын, нейрондардың жетілуінің бұзылуын және патологиялық гиперқозғыштықты растады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Lysotracker бояуының көмегімен лизосомаларды талдау HC-KO желісінде HC-ға қарағанда лизосомалар саны артқанын көрсетті, бірақ GD желісінде GD-iso-ға қарағанда айтарлықтай айырмашылықтар анықталмады. Метаболиттерді талдағанда, глюкозилцерамид (GlcCer) деңгейі тек HC-KO-да жоғарылағаны, ал глюкозилсфингозин (GlcSph) екі ауру желісінде де, әсіресе HC-KO-да айтарлықтай жоғары екені анықталды. Бұл ферментативті белсенділікпен корреляцияланады: HC-KO желісі GD-ге қарағанда небәрі 60% белсенділікті көрсетеді, бұл Гоше ауруының II түріне тән ауыр перинатальды фенотипті көрсетуі мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Изогенді желілер — бұл генетикалық фоны бірдей, бірақ белгілі бір мутациясы редакцияланған жасушалар, олар геннің әсерін нақты зерттеуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Липидтердің жинақталуы лизосомалардағы өзгерістерден бұрын жүреді (GD желісінде) және GM1 ганглиозиді деңгейінің артуымен қатар жүреді. Гликосфинголипидтер мидың дамуында маңызды рөл атқаратындықтан, бұл Гоше ауруының пренатальды дамуға әсер етіп, болашақ неврологиялық бұзылыстарға негіз қалайтыны туралы гипотезаны растайды. Бір жасушалы транскриптомика мәліметтері митохондриялық функцияның ерте бұзылуын көрсетеді. Бұл нейрондардың жетілу процесінде гликолизден тотығу фосфорлануына ауысуымен байланысты болуы мүмкін. Субпаллиальды органоидтарда біз холестерин алмасуы мен Гольджи аппаратының дисфункциясымен байланысты интернейрондар миграциясының аномалиясын анықтадық.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу органоидтарда жүргізілді; олар күрделі болғанымен, тірі мидағы барлық өзара әрекеттесулерді толық қайталамайды, сондықтан клиникалық симптомдармен байланысын қосымша тексеру қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Функционалдық тесттер Гоше ауруы органоидтарында тепе-теңдіктің глутаматергиялық нейрондар жағына қарай ауысқанын және бұл желінің гиперқозғыштығына әкелетінін көрсетті. Химерлі культураларда глутаматергиялық нейрондардың өздігінен гиперқозғыш екендігі, ал ГАМК-ергиялық нейрондар жүйенің талпыныстарына қарамастан, бұл әсерді компенсациялай алмайтыны расталды. Осылайша, біздің модельдеріміз молекулалық бұзылыстарды желілік дисфункциямен байланыстыруға мүмкіндік береді, бұл терапевтік нысаналарды іздеу үшін жаңа мүмкіндіктер ашады.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"fibroblast-dakhyldary\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#fibroblast-dakhyldary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Фибробласт дақылдары&lt;/span&gt;&lt;/a&gt;Фибробласт дақылдары&lt;/h4&gt;\n&lt;p&gt;Адам терісінің фибробласттары (GM08398, GM01260) Coriell медициналық зерттеу институтынан алынды. Жасушалар 10% фетальды бұзау сарысуы (FBS) және 1% GlutaMAX қосылған DMEM ортасында, 37°C температурада және 5% CO2 бар ылғалды ауада өсірілді. Пассаждау 80% конфлюэнттікке жеткенде 0,25% трипсин көмегімен жүргізілді.&lt;/p&gt;\n&lt;p&gt;иПСК желілерін алу және ұстау&lt;/p&gt;\n&lt;p&gt;Индукцияланған плюрипотентті дің жасушалары (иПСК) фибробласттарды мРНҚ негізінде қайта бағдарламалау әдісімен (StemRNA 3rd Gen хаттамасы) алынды. Клоналды желілер эмбрионалды дің жасушаларына ұқсас колонияларды таңдау арқылы бекітілді. Жасушалар mTeSR1 ортасында ұсталды және 80% конфлюэнттікке жеткенде StemPro Accutase реагентімен диссоциацияланды. Центрифугалаудан кейін (300 x g) жасушалар 10 мкМ Rho-киназа тежегіші Y-27632 қосылған Matrigан Matrigel жабыны бар планшеттерге 1,5–2,5 × 10⁴ жасуша/см² тығыздықта егілді. Дақылдар 37°C, 95% O2 және 5% CO2 инкубаторында қалдырылды. Микоплазмаға тұрақты тексеру MycoAlert жинағымен жүргізілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;иПСК — бұл ересек жасушалардан алынған және эмбрионалды күйге қайтарылған, кез келген ұлпаға айналу қабілеті бар жасушалар.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gba1-mutaciyasyn-taldau\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#gba1-mutaciyasyn-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GBA1 мутациясын талдау&lt;/span&gt;&lt;/a&gt;GBA1 мутациясын талдау&lt;/h4&gt;\n&lt;p&gt;GBA1 генотипі фибробласттар мен иПСК желілерінен геномдық ДНҚ бөліп алу (DNeasy жинағы) арқылы расталды. GBA1 экзондары Master Cycler Nexus термоциклерінде Phusion ДНҚ полимеразасымен ПТР арқылы күшейтілді (Кесте S2, S3). Сэнгер секвенирлеуі EuroFins Genomics қызметі арқылы орындалды және тізбектер SnapGene (V5.0) бағдарламасында адамның GBA1 генінің (ENSG00000177628) референстік геномымен салыстырылды.&lt;/p&gt;\n&lt;h4 id=\"g-bending-zhaene-molekulalykh-kariotipteu\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#g-bending-zhaene-molekulalykh-kariotipteu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;G-бэндинг және молекулалық кариотиптеу&lt;/span&gt;&lt;/a&gt;G-бэндинг және молекулалық кариотиптеу&lt;/h4&gt;\n&lt;p&gt;Кариотиптік талдау Sant Joan de Déu Барселона балалар ауруханасында жүргізілді. Молекулалық кариотиптеу SNP-матрица (Infinium Global Screening Array-24) технологиясы арқылы бағаланды. Талдау GenomeStudio V2.0.5 және CNV-Partition 3.2.0 бағдарламаларында орындалды. Минималды зонд саны 30, есеп беру шегі 400 кб (өсу/жоғалу үшін) және 5 Мб (гетерозиготалылықтың жоғалуы үшін) 35 сенімділік деңгейінде белгіленді.&lt;/p&gt;\n&lt;h4 id=\"immunocitohimiya\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#immunocitohimiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Иммуноцитохимия&lt;/span&gt;&lt;/a&gt;Иммуноцитохимия&lt;/h4&gt;\n&lt;p&gt;иПСК колониялары 12-ұяшықты слайдтарда өсіріліп, 4% параформальдегидпен бекітілді және Triton X-100 мен 5% есек сарысуымен өңделді. Бастапқы антиденелермен инкубация 4°C-та түнде, ал екінші реттік антиденелермен және Hoescht 33342 (2 мкг/мкл) бояғышымен 2 сағат бөлме температурасында жүргізілді. Кескіндер Leica SP8 конфокалды микроскопында (20x объектив) алынды және Fiji бағдарламасында өңделді.&lt;/p&gt;\n&lt;h4 id=\"keri-transkripciya-zhaene-sandykh-ptr-rt-qpcr\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#keri-transkripciya-zhaene-sandykh-ptr-rt-qpcr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кері транскрипция және сандық ПТР (RT-qPCR)&lt;/span&gt;&lt;/a&gt;Кері транскрипция және сандық ПТР (RT-qPCR)&lt;/h4&gt;\n&lt;p&gt;Плюрипотенттілік гендерінің экспрессиясы RT-qPCR арқылы анықталды. РНҚ RNeasy жинағымен РНҚ бөлініп, ДНКаза I-мен тазартылды. Концентрация Nanodrop One құрылғысында өлшенді. 1 мкг РНҚ qScript жинағымен кДНҚ-ға айналдырылды. ПТР 15 мкл көлемде, 3 техникалық қайталаумен QuantStudio 7 жүйесінде (40 цикл) TaqMan талдаулары арқылы жүргізілді.&lt;/p&gt;\n&lt;h4 id=\"uesh-khabatty-differenciaciya\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#uesh-khabatty-differenciaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Үш қабатты дифференциация&lt;/span&gt;&lt;/a&gt;Үш қабатты дифференциация&lt;/h4&gt;\n&lt;p&gt;Адамның иПСК жасушалары Matrigel жабыны бар 24-ұяшықты планшеттерге (Ibidi GmbH) 10 мкМ RI қосылған mTeSR1 ортасында егілді. Экто- және энтодермалық бағыттар үшін 1 × 10⁵, мезодермалық бағыт үшін 5 × 10⁴ жасуша тығыздығы қолданылды. Дифференциация STEMdiff™ Trilineage Differentiation Kit (StemCell Technologies) көмегімен 7 күн ішінде жүргізілді. Жасушалар 4% PFA-мен 15 минут бекітіліп, тиісті маркерлерге иммундық бояу жасалды (S4-кесте). Суреттер Leica SP8 конфокалды микроскопында (20x объектив) түсіріліп, Fiji бағдарламасында өңделді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Үш қабатты дифференциация — бұл иПСК-ның барлық үш ұрық жапырақшасына (эктодерма, мезодерма, энтодерма) айналу қабілетін растайтын стандартты сынақ.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"genomdy-redakciyalau-konstrukciyalaryn-zhasau\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#genomdy-redakciyalau-konstrukciyalaryn-zhasau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Геномды редакциялау конструкцияларын жасау&lt;/span&gt;&lt;/a&gt;Геномды редакциялау конструкцияларын жасау&lt;/h4&gt;\n&lt;p&gt;Стандартты CRISPR/Cas9 үшін Benchling құралы арқылы екі sgРНҚ жобаланды (S6-кесте). GBA1 генін GBA1LP псевдогенінен ажырату үшін sgРНҚ-4 GBA1 9-экзонындағы 55-bp ерекше аймаққа бағытталды. Олигонуклеотидтер (Eurofins Genomics) фосфорланып, термоциклерде (37°C-та 30 мин, 95°C-та 5 мин, 5°C/мин жылдамдықпен салқындату) буландырылды. Реакция pX459 немесе pX462 (Addgene #62988, #62987) векторлары, FastDigest Bpil және T7 лигазасының қатысуымен 6 цикл (37°C және 23°C-та 5 минуттан) бойы жүргізілді. Сызықтық ДНҚ-ны жою үшін &lt;a href=\"concepts/plasmid.html\"&gt;Plasmid&lt;/a&gt;-safe ДНКазасы қолданылды.&lt;/p&gt;\n&lt;p&gt;GBA1 P415R мутациясын түзету үшін 30 nt гомологиялық иықтары бар ssODN донорлары пайдаланылды. Prime Editing (PE3b) үшін L444P мутациясы бар 10-экзон нысанаға алынды. pegРНҚ және ngРНҚ кандидаттары PrimeDesign59 арқылы таңдалды. Векторларды жинақтау үшін pU6-pegRNA-GG (Addgene #132777) векторы BsaI ферментімен кесіліп, гельден бөлініп алынды. Олигонуклеотидтер (спейсер, ұзарту және скаффолд) лигаза көмегімен векторға қосылды. PE3b үшін ngРНҚ конструкциялары BPK1520 (Addgene #65777) векторы мен Esp3I ферменті арқылы дайындалды. Барлық плазмидалар компетентті жасушаларға трансформацияланып, секвенирлеу (hU6 праймері, EuroFins Genomics) арқылы SnapGene бағдарламасында талданды.&lt;/p&gt;\n&lt;h4 id=\"crispr-cas9-zhaene-prime-editing-koemegimen-pacientterding-ipsc-zhelilerin-genomdykh-redakciyalau\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#crispr-cas9-zhaene-prime-editing-koemegimen-pacientterding-ipsc-zhelilerin-genomdykh-redakciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CRISPR-Cas9 және Prime Editing көмегімен пациенттердің iPSC желілерін геномдық редакциялау&lt;/span&gt;&lt;/a&gt;CRISPR-Cas9 және Prime Editing көмегімен пациенттердің iPSC желілерін геномдық редакциялау&lt;/h4&gt;\n&lt;p&gt;Плазмидаларды дайындау үшін EndoFree Maxi Kit (QIAGEN) қолданылды, ДНҚ концентрациясы NanoDrop 1000 спектрофотометрімен өлшенді. Пациенттің iPSC желісіндегі P415R мутациясын түзету үшін &lt;a href=\"concepts/crispr-cas9.html\"&gt;CRISPR-Cas9&lt;/a&gt;, sgRNA және ssODN конструкторлары гомологиялық репарацияны (HDR) ынталандыру үшін қолданылды. 80% конфлюэнттіліктегі iPSC жасушалары (4,5 × 10⁵) Matrigel жағылған 6-ұяшықты планшеттерге 10 мкМ RI (ROCK ингибиторы) қосылған mTeSR1 ортасында отырғызылды. Бір күннен кейін LipoStem (6 мкл) және ДНҚ қоспасымен (1,5 мкг CRISPR-Cas9 және 0,5 мкг ssODN) трансфекция жасалды. Трансфекциядан кейінгі екі күнде ортаға пуромицин (1,25 мкг/мл) және RI қосылды. Жасушалар 50% конфлюэнттілікке жеткенде, олар ламинин-521 жағылған планшеттерге ауыстырылды. Диаметрі 1–2 мм колониялар іріктеліп, 24-ұяшықты планшеттерде экспансияланды. GBA1 нокауттық (KO) желісін жасау үшін ssODN қолданылмады немесе pX462 плазмидасы мен екі sgRNA пайдаланылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR-Cas9 әдісі sgRNA көмегімен ДНҚ-ның қажетті бөлігін тауып, Cas9 ферменті арқылы кеседі. Матрица (ssODN) болған кезде HDR арқылы мутация түзетіледі, ал матрица болмаса, геннің үзілуі (нокаут) жүреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нуклеофекция үшін 20-пассаждан төмен, 60–70% конфлюэнттіліктегі iPSC жасушалары қолданылды. Жасушалар Accutase арқылы жеке суспензияға айналдырылып, 8 × 10⁵ жасуша 90 мкл P3 (Lonza) ерітіндісінде ресуспензияланды. PE3b нұсқасы үшін 5 мкг ДНҚ (PE-MAX, pegRNA және sgRNA, 3,5:1:0,5 қатынасында) қолданылды. Электропорация Lonza 4D Nucleofector (CB150 бағдарламасы) құрылғысында орындалды. Бластицидинмен (10 мкг/мл) селекциядан кейін жасушалар клоналды экспансия үшін 40 жасуша/ұяшық тығыздығында отырғызылды. Генотиптеу ПТР, MboI немесе XmaI ферменттерімен кесу және GelRed бояғышы бар агарозды гельде талдау арқылы жүргізілді. Аллельдік құрамды растау үшін TOPO-клондау және 20 колонияны секвенирлеу (SnapGene бағдарламасында талдау) орындалды.&lt;/p&gt;\n&lt;h4 id=\"off-target-taldauy\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#off-target-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Off-target талдауы&lt;/span&gt;&lt;/a&gt;Off-target талдауы&lt;/h4&gt;\n&lt;p&gt;P415R sgRNA үшін off-target әсерінің ең ықтимал 5 аймағы Benchling бағдарламасы арқылы болжанды (Кесте SN). Бұл аймақтар ПТР (30 цикл: 98°C — 10 с, 66°C — 10 с, 72°C — 30 с) арқылы күшейтіліп, секвенирленді. Нәтижелер ата-аналық желінің тізбегімен салыстырылды.&lt;/p&gt;\n&lt;h4 id=\"indukciyalanghan-nejrondardaghy-fermentativti-belsendilikti-taldau\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#indukciyalanghan-nejrondardaghy-fermentativti-belsendilikti-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Индукцияланған нейрондардағы ферментативті белсенділікті талдау&lt;/span&gt;&lt;/a&gt;Индукцияланған нейрондардағы ферментативті белсенділікті талдау&lt;/h4&gt;\n&lt;p&gt;Индукцияланған нейрондар (iN) 80% конфлюенттіліктегі iPSC жасушаларынан алынды. Жасушалар (3,5 x 10^5) Matrigel жабыны бар планшеттерге 10 мкМ RI қосылған mTeSR1 ортасында егілді. Келесі күні rtTA және Ngn2 лентивирустары қосылды. 0-күннен бастап ортаға 2,5 мкг/мл доксициклин (Dox) қосылып, эксперимент бойы сақталды. 1-күннен бастап 0,5% N2 және 1% B27 қосылған BrainPhys ортасы қолданылды және 1,25 мкг/мл пуромицинмен селекция жүргізілді. 5-күннен бастап орта күн сайын 10 нг/мл NT3 және 10 нг/мл BDNF қосылған BrainPhys ортасына ауыстырылды. 7-күні жасушалар жиналып, 300 x g жылдамдықта центрифугаланды және -80°C температурада мұздатылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Индукцияланған нейрондар (iN) — бұл арнайы транскрипция факторларын (мысалы, Ngn2) экспрессиялау арқылы діңгекті жасушалардан тікелей нейрондарға айналдырылған жасушалар.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Фермент белсенділігін талдау үшін жасушалар McIlvain буферінде (0,2 М Na2HPO4, 0,1 М лимон қышқылы, 1% натрий таураты, 0,2% Triton X-100) ультрадыбыстық дезинтеграция (2 минут, 100 Вт) арқылы ыдыратылды. Центрифугалаудан (20 000 x g, 20 минут, 4°C) кейін супернатант BCA талдауы арқылы 1 мг/мл ақуыз концентрациясына дейін нормаланды. GCase белсенділігі 20 мкл үлгіні 180 мкл субстрат буферімен (15 мМ 4-метилумбеллиферилглюкопиранозид) 37°C-та 1 сағат инкубациялау арқылы өлшенді. Реакция глицин ерітіндісімен (pH 10,4) тоқтатылды және флуоресценция 365/460 нм толқын ұзындығында өлшенді. Белсенділік (U) 1 сағатта 1 нмоль 4-метилумбеллиферон (4MU) бөлінуіне негізделіп есептелді.&lt;/p&gt;\n&lt;h4 id=\"organoidtardy-oesiru\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#organoidtardy-oesiru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Органоидтарды өсіру&lt;/span&gt;&lt;/a&gt;Органоидтарды өсіру&lt;/h4&gt;\n&lt;p&gt;Кортикальды (hCO) және субпаллиальды (hSO) органоидтар STEMdiff жиынтықтарын қолдану арқылы дайындалды. iPSC жасушалары (3 x 10^5 жасуша/мл) 10 мкМ Y-27632 қосылған ортада Aggrewell 800 планшеттеріне егіліп, 100 x g жылдамдықта 3 минут центрифугаланды. 1-5 күндері күн сайын STEMdiff Neural Organoid Basal medium 1 ауыстырылды. 6-күні органоидтар Forebrain Organoid Expansion ортасына (әр ұяшыққа 40-50-ден) ауыстырылды. 8-25 күндері орта әр 48 сағат сайын жаңартылды. 25-күні органоидтар саны 15-20-ға дейін азайтылып, 43-күнге дейін дифференциация ортасына ауыстырылды. 43-күннен бастап органоидтар (8-10-нан) қолдаушы ортаға (Neurobasal A, 2% B27, 1% Glutamax, 1% Pen/Strep) ауыстырылды. 49-күннен бастап қоректік заттардың диффузиясын жақсарту үшін орбитальды шейкер (80 айн/мин) қолданылды.&lt;/p&gt;\n&lt;h4 id=\"organoidtardy-facs-aedisimen-boyau\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#organoidtardy-facs-aedisimen-boyau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Органоидтарды FACS әдісімен бояу&lt;/span&gt;&lt;/a&gt;Органоидтарды FACS әдісімен бояу&lt;/h4&gt;\n&lt;p&gt;Талдау үшін 75 және 150-күндік даму кезеңіндегі органоидтардың жеке жасушалары пайдаланылды. Центрифугалаудан кейін жасушалық тұнба 900 мкл салқындатылған PBS-те қайта суспензияланып, бақылау және тәжірибелік топтар арасындағы жасуша тығыздығын стандарттау үшін 70 мкм тордан өткізілді. 250 мкл суспензия DNA LoBind түтікшелеріне ауыстырылды. Бояу үшін 250 мкл (2x) ерітінді (LysoTracker Deep Red 1:5000, LipidTOX Deep Red 1:100 немесе Lipidraft 555 CT-B 1:500) қосылды. Lipidraft 555 үлгілері 4°C-та 10 минут инкубацияланып, 200 g-де 3 минут центрифугаланды, PBS-те қайта суспензияланып, 4°C-та тағы 15 минут Lipidraft 555 CT-B антиденелерімен (1:200) боялды. Lysotracker және LipidTOX үлгілері бөлме температурасында 30 минут инкубацияланды. Жасушалардың тіршілік қабілеті &lt;a href=\"concepts/dapi.html\"&gt;DAPI&lt;/a&gt; (0,1 мкг/мл) көмегімен бағаланды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;FACS (ағынды цитометрия) — сұйықтық ағынындағы жасушаларды талдау әдісі, ол мыңдаған жеке жасушалардың физикалық параметрлері мен флуоресценция деңгейін жылдам бағалауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gangliozidterding-zhukha-khabatty-hromatografiyasy-zhkhh\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#gangliozidterding-zhukha-khabatty-hromatografiyasy-zhkhh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ганглиозидтердің жұқа қабатты хроматографиясы (ЖҚХ)&lt;/span&gt;&lt;/a&gt;Ганглиозидтердің жұқа қабатты хроматографиясы (ЖҚХ)&lt;/h4&gt;\n&lt;p&gt;Жасушалар метанол/хлороформ (1:1, 1 мл) қоспасында ультрадыбыс көмегімен гомогенизацияланып, содан кейін 0,5 мл су қосылып, қайта ультрадыбыспен өңделді. Ганглиозидтер ақуыздардан 2000 айн/мин жылдамдықта 20 минут центрифугалау арқылы бөлінді. Жоғарғы сулы фаза жиналып, органикалық фазаға қайта экстракция үшін 0,25 мл су қосылды. Біріктірілген фазалар Waters LC-18 бағанасынан өткізіліп, ганглиозидтер метанолмен (6 мл) және метанол/хлороформмен (1:1, 6 мл) элюцияланды. Фракциялар вакуумда буландырылып, құрғақ қалдық өлшенді және метанол/хлороформда ерітілді. Талдау Silica F254 (20x10 см, 15 мкм) пластиналарында метанол/хлороформ/0,2% CaCl2 (45:55:10) мобильді фазасында жүргізілді. Нәтижелер орцинол бояуымен визуализацияланып, шошқа миы ганглиозидтерінің стандарттарымен салыстырылды. Пластиналар Sony IMX789 (48 Мп) камерасымен суретке түсіріліп, кескіндер ImageJ бағдарламасында талданды. Жалпы ақуыз мөлшерін нормалау үшін Lowry әдісі қолданылды.&lt;/p&gt;\n&lt;h4 id=\"glyukozilsfingozin-lyso-gb1-di-lc-ms/ms-arkhyly-sandykh-anykhtau\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#glyukozilsfingozin-lyso-gb1-di-lc-ms/ms-arkhyly-sandykh-anykhtau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Глюкозилсфингозин (lyso-Gb1)-ді LC-MS/MS арқылы сандық анықтау&lt;/span&gt;&lt;/a&gt;Глюкозилсфингозин (lyso-Gb1)-ді LC-MS/MS арқылы сандық анықтау&lt;/h4&gt;\n&lt;p&gt;Органоидтар (75-күн) құрғақ мұзда мұздатылды. Лизаттар PBS-те (10 мг тіндерге 100 мкл) ультрадыбыс көмегімен дайындалды. 10% көлемі BCA ақуыз талдауы үшін алынды. Қалған бөлігіне 3 көлем метанол қосылып, араластырылды, 1500 g-де 4°C-та 5 минут центрифугаланып, супернатант жиналды. 100 мкл ерітілген супернатантқа 20 мкл ішкі стандарт және 300 мкл ацетонитрил қосылып, –20°C-та 20 минут инкубацияланды, содан кейін 1300 айн/мин-де 10 минут центрифугаланды. Супернатант азот астында 40°C-та (45–60 минут) буландырылды. Қалдық су/ацетонитрил/құмырсқа қышқылы (65/35/0,1) қоспасында ерітіліп, 15 мкл үлгі &lt;a href=\"concepts/zhidkostnaya-hromatografiya-tandemnaya-mass-spektrometriya.html\"&gt;LC-MS/MS&lt;/a&gt; әдісімен талданды.&lt;/p&gt;\n&lt;h4 id=\"bir-zhasushaly-rnkh-sekvenirleui-scrnaseq\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#bir-zhasushaly-rnkh-sekvenirleui-scrnaseq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бір жасушалы РНҚ секвенирлеуі (scRNAseq)&lt;/span&gt;&lt;/a&gt;Бір жасушалы РНҚ секвенирлеуі (scRNAseq)&lt;/h4&gt;\n&lt;p&gt;Талдау үшін 75 ± 3 (7–10 дана) және 150 (2–3 дана) күндік органоидтар жинақталды. Ұлпаларды диссоциациялау үшін ферментативті әдіс қолданылды: органоидтар 1 мм² бөлшектерге бөлініп, папаин (30–50 Ед/мл), L-цистеин (4 мг/20 мл) және ДНКаза I (12500 Ед/мл) ерітіндісінде 37°C температурада 75–90 минут бойы инкубацияланды. Тірі жасушалар Low/High Ovo ерітінділері арқылы центрифугалау жолымен бөліп алынды. Жасушалар Chromium Fixed RNA Profiling (10X Genomics) хаттамасы бойынша фиксацияланып, -80°C температурада сақтау үшін глицерин қосылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Диссоциация — ұлпаларды жеке жасушаларға бөлу процесі, бұл әр жасушаның РНҚ профилін жеке зерттеуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бастапқы деректер Nextflow (CellRanger v7.1.0) конвейері арқылы өңделді. EmptyDrops (FDR ≤ 0.01) көмегімен бос тамшылар алынып тасталды, нәтижесінде әр үлгіде 5,7–7,6 мың жасуша алынды. Кейінгі талдаулар R (v4.2.2) және Seurat (v4.3.0) пакеті арқылы жүргізілді. Деректер hCO (ми органоидтары) және hSO (жұлын органоидтары) топтарына бөлінді. Сапа бақылауы (QC) аясында дублеттер (DoubletFinder, 5%) және митохондриялық гендердің мөлшері &amp;gt; 15% немесе анықталған гендер саны &amp;lt; 2000 болатын жасушалар алынып тасталды. Қорытынды таңдамада hCO үшін 43 339 және hSO үшін 39 234 жасуша қалды.&lt;/p&gt;\n&lt;p&gt;Кластерлеу UMAP, FindNeighbors және FindClusters әдістерімен орындалды. hCO үшін интеграцияланған талдау, hSO үшін SCT-трансформация қолданылды. Маркерлік гендер Уилкоксон тесті (min.pct = 0.8, logFC &amp;gt; 0.65) арқылы анықталды. Даму траекториялары Monocle3 көмегімен құрылды. Дифференциалды экспрессия (DEA) t-тесті (шегі /log2FC/ &amp;gt; 0.65, padj &amp;lt; 0.05, Бонферрони түзетуімен) арқылы бағаланды. Функционалды байыту (GO) және GSEA талдаулары clusterProfiler пакеті арқылы орындалды (Сурет SN).&lt;/p&gt;\n&lt;h4 id=\"mikroelektrodty-matricalarda-mea-tirkeu\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#mikroelektrodty-matricalarda-mea-tirkeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Микроэлектродты матрицаларда (MEA) тіркеу&lt;/span&gt;&lt;/a&gt;Микроэлектродты матрицаларда (MEA) тіркеу&lt;/h4&gt;\n&lt;p&gt;150 күндік және одан үлкен hCO және hSO органоидтары CO₂ мен температурасы теңестірілген BrainPhys ортасында 60PedotMEA200/30iR-Au матрицаларына ауыстырылды. Органоидтарды электродтар үстінде ұстап тұру үшін арнайы қысқыш (harp) қолданылды. 30 минуттық тұрақтандырудан кейін (37^° C, 5% CO₂, 95% O₂), үлгілер MEA2100 жүйесіне ауыстырылды. 5 минуттық базалық жазбадан кейін, кезең-кезеңімен пикротоксин (PTX, 100 мкМ) және PTX (100 мкМ), NBQX (5 мкМ) мен DL-APV (100 мкМ) қоспасы қосылды. Әр кезеңнен кейін 5 минуттық тепе-теңдік және 5 минуттық жазу жүргізілді. Деректер .hdf5 форматында сақталып, Python және R Studio көмегімен талданды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MEA (Microelectrode arrays) — нейрондардың электрлік белсенділігін нақты уақыт режимінде бақылауға мүмкіндік беретін құрылғы, ол органоидтардың функционалдық жетілуін бағалау үшін қолданылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"baghyttalghan-baghdarlamalau-arkhyly-trikulturalardy-zhasau\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#baghyttalghan-baghdarlamalau-arkhyly-trikulturalardy-zhasau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бағытталған бағдарламалау арқылы трикультураларды жасау&lt;/span&gt;&lt;/a&gt;Бағытталған бағдарламалау арқылы трикультураларды жасау&lt;/h4&gt;\n&lt;p&gt;Индукцияланған нейрондар (iNs), интернейрондар (iGNs) және астроциттерді (iA) алу үшін лентивирустық трансдукция әдісі қолданылды. iPSC жасушалары Matrigel жабыны бар ыдыстарға 3 × 10⁵ (iNs), 3,5 × 10⁵ (iGNs) немесе 4 × 10⁵ (iA) мөлшерінде егілді. 0-күннен бастап трансгендер экспрессиясын белсендіру үшін ортаға доксициклин (2,5 мкг/мл) қосылды. Нейрондар мен интернейрондар үшін сәйкесінше 48 сағат бойы пуромицин (1,25 мкг/мл) және гигромицин (200 мкг/мл) арқылы селекция жүргізілді.&lt;/p&gt;\n&lt;p&gt;5-күннен бастап нейрондар үшін NT3 және BDNF (10 нг/мл), интернейрондар үшін AraC (5 мкМ) қосылды. Астроциттер үшін FGFb (8 нг/мл), CNTF (5 нг/мл) және BMP4 (10 нг/мл) бар орта қолданылды. 7-күні жасушалар диссоциацияланып, 6:3:2 (iN:iGN:iA) қатынасында қайта егілді (барлығы 2,8 × 10⁵ жасуша).&lt;/p&gt;\n&lt;h4 id=\"zhoghary-tyghyzdykhtaghy-mikroelektrodtykh-matricalar-hd-mea\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#zhoghary-tyghyzdykhtaghy-mikroelektrodtykh-matricalar-hd-mea\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жоғары тығыздықтағы микроэлектродтық матрицалар (HD-MEA)&lt;/span&gt;&lt;/a&gt;Жоғары тығыздықтағы микроэлектродтық матрицалар (HD-MEA)&lt;/h4&gt;\n&lt;p&gt;Химерлі трикультуралар «Forward programmed tricultures» хаттамасы бойынша дайындалды. MaxTwo 24-ұяшықты планшеттер 0,6 мл ортамен 48 сағат бойы 5% CO2 және 37°C жағдайында кондицияланды. Ұяшықтар 50 мкл 0,1 мг/мл PDL ерітіндісімен қапталып, 1 сағат 37°C-та инкубацияланды және жуылды. Содан кейін 50 мкл 5 мкг/мл RhLam521 (Biolamina) қосылып, 4°C-та сақталды. Нейрондар, интернейрондар және астроциттер 6:3:2 қатынасында (6,2 × 10⁴ жасуша, 10 мкМ Rho-киназа тежегішімен) егілді. 1 сағаттан кейін тағы 0,6 мл орта мен 1:100 пенициллин/стрептомицин қосылды. 14-54 күндер аралығында үлгілер MaxTwo HD-MEA жүйесіне (MaxWell Biosystems) ауыстырылды. 5 минуттық бейімделуден кейін белсенділікті сканерлеу (90 с, Checker Board) жүргізілді. Жазып алу электродтары 300 секундтық базалық жазба негізінде таңдалды. 54-күні 100 мкМ пикротоксин немесе DMSO (бақылау) қосылып, 10 минуттық тұрақтандырудан кейін қайталама жазба алынды. Деректер .hdf5 форматында Python және R Studio арқылы талданды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HD-MEA — бұл мәдениеттегі мыңдаған нейрондардың электрлік белсенділігін бір уақытта жоғары дәлдікпен тіркеуге мүмкіндік беретін технология.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kalcijlik-imidzhing\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#kalcijlik-imidzhing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кальцийлік имиджинг&lt;/span&gt;&lt;/a&gt;Кальцийлік имиджинг&lt;/h4&gt;\n&lt;p&gt;14-күні трикультуралар 0,5 мкл ssAAV-DJ/2-mCaMKIIa-jGCaMP8m-WPRE-bGHp(A) (9,0 × 10¹² vg/мл) векторымен трансдукцияланды. 20-күні орта BPIO (BrainPhys Imaging, 0,5% N2, 1% B27, 10 нг/мл NT3 және BDNF) ортасына ауыстырылды. 21-49 күндер аралығында апта сайын базалық жазба, 10 мкМ бикукуллинмен өңдеу және 3 минуттық қайталама жазба жүргізілді. Жуылғаннан кейін жасушалар жаңа және кондицияланған BPIO ортасына қайтарылды. Ultimeyes микроскопы (Cairn GmBH) көмегімен 20 Гц жиілікте (CellCam Kikker камерасы, GFP сүзгісі) кескіндер алынды. Кальцийлік сигналдар NetCal78 бағдарламасы арқылы талданды.&lt;/p&gt;\n&lt;h4 id=\"statistikalykh-taldau\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#statistikalykh-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистикалық талдау&lt;/span&gt;&lt;/a&gt;Статистикалық талдау&lt;/h4&gt;\n&lt;p&gt;Барлық тәжірибелер 3 биологиялық қайталауда орындалды. Нәтижелер орташа ± SEM түрінде көрсетілді. Статистикалық талдау Prism бағдарламасында суреттердің түсініктемелерінде көрсетілген тесттер арқылы жүзеге асырылды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta-f2.jpg\" alt=\"Сурет 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta-f3.jpg\" alt=\"Сурет 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta-f4.jpg\" alt=\"Сурет 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta-f6.jpg\" alt=\"Сурет 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 6&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta-f7.jpg\" alt=\"7-сурет. Химералық тікелей бағдарламаланған трикультуралардағы CAMKIIa-GCaMP8m кальций визуализациясы қозу мен тежелудің\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-сурет. Химералық тікелей бағдарламаланған трикультуралардағы CAMKIIa-GCaMP8m кальций визуализациясы қозу мен тежелудің теңгерімсіздігін көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;7-сурет. Химералық тікелей бағдарламаланған трикультуралардағы CAMKIIa-GCaMP8m кальций визуализациясы қозу мен тежелудің теңгерімсіздігін көрсетеді. A) Дамудың 49-күнінде (DIV49) бикукуллинді (BIC) қосқанға дейін (CONTROL) және қосқаннан кейін бірден алынған әрбір мәдениет жағдайы үшін кальций визуализациясының репрезентативті жазбасынан алынған спайктарды көрсететін растрлық графиктер. B) Бикукуллинді (BIC) қосқанға дейін (Control) және қосқаннан кейін (DIV28-ден DIV49-ға дейін) уақыт өте келе ұжымдық оқиғалардың көлемін көрсететін, ұжымдық белсенділік оқиғаларына қатысатын жасушалардың пайызы ретінде көрсетілген графиктер. C) Бикукуллинді (BIC) қосқанға дейін (Control) және қосқаннан кейін (DIV28-ден DIV49-ға дейін) әр жасушаға шаққандағы шыңдар санын көрсететін графиктер. D) Бикукуллинді (BIC) қосқанға дейін (Control) және қосқаннан кейін (DIV28-ден DIV49-ға дейін) уақыт өте келе әрбір шыңның қисық астындағы ауданын көрсететін графиктер.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Гоше&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ауруындағы&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;құрысу&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;себептері&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;iPSC негізінде&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ми&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;органоидтарын&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жасау&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қозу мен&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тежелу тепе-&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;теңдігінің&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бұзылуы&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жаңа дәрілерді&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сынауға&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;арналған&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;платформа&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Препринт лицензиясы&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;bioRxiv&lt;/td&gt;\n&lt;td&gt;neuroscience&lt;/td&gt;\n&lt;td&gt;все права у авторов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Crowe, J. A.; Matusova, Z.; Girard, A. S.; Rajon, A.; Colameo, D.; Oburoglu, L.; Zetterdahl, O. G.; Bjorklund, J.; Puigsasllosas Pastor, C.; Krupp, S.; Ellervik, U.; Cremonesi, A.; Tornero, D.; Penton Ribas, D.; Ahlenius, H.; Valihrach, L.; Canals, I.&lt;/p&gt;\n&lt;h3 id=\"derekkoezder\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=
