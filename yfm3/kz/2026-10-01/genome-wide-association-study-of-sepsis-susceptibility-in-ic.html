        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"171\" cy=\"73\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"589\" cy=\"270\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · GENETIC AND GENOMIC MEDICINE   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Неліктен кейбір адамдар&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;сепсиске қарсы тұра алмайды:&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;жауап сирек популяциялардың&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;генінде жатыр&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic-f1.jpg\" alt=\"1-сурет. Геном бойынша ассоциация нәтижелерінің Манхэттен графигі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Геном бойынша ассоциация нәтижелерінің Манхэттен графигі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет. Геном бойынша ассоциация нәтижелерінің Манхэттен графигі. Интенсивті терапия бөлімінің 210 пациентіндегі (68 жағдай, 142 бақылау) сепсиске бейімділік үшін жекелеген нұсқалардың ассоциация нәтижелері. X осі хромосомалық позицияны, ал Y осі -log10(p-мәнін) көрсетеді. Үзік қызыл сызық геномдық маңыздылықты (p &amp;lt; 5×10⁻⁸), ал үзік көк сызық болжамды маңыздылық шегін (p &amp;lt; 1×10⁻⁵) білдіреді. Негізгі локустар белгіленген: STK32B (chr4p16.2), RP11-241F15.3 (chr4q13), MUC19 (chr12q12) және chr8p23.1 (DEFB кластері).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;a href=\"concepts/sepsis.html\"&gt;Сепсис&lt;/a&gt; жыл сайын миллиондаған адамның өмірін қиып, реаниматологияның басты жұмбақтарының бірі болып қалуда. Неліктен бірдей инфекция жұққанда бір адам жазылып кетсе, екіншісі ағзаларының жұмысы тоқтап, көз жұмады? Ғалымдар Катардың тұйық әрі бірегей генетикалық қоры бар тұрғындарының геномын зерттеді. Белгілі болғандай, &lt;a href=\"concepts/ube2l3.html\"&gt;UBE2L3&lt;/a&gt; геніндегі сирек мутация жасушалардың қабыну реакциясын дер кезінде өшіру қабілетін бұзып, адамды бактериялар алдында дәрменсіз етеді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Сепсистің генетикалық себептерін іздеу үшін Катардағы 210 реанимация пациентінің геномы секвенирленді&lt;/li&gt;\n&lt;li&gt;UBE2L3 геніндегі сирек мутация қабынуды бақылау жүйесін бұзып, инфекцияға сезімталдықты арттырады&lt;/li&gt;\n&lt;li&gt;26 939 адамның деректері бұл гендегі ақаулардың ауыр инфекцияларға әкелетінін растады&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеу аясында ғалымдар Катардағы реанимация бөлімшелерінде жатқан 210 пациенттің геномына толық секвенирлеу (&lt;a href=\"concepts/whole-genome-sequencing.html\"&gt;WGS&lt;/a&gt;) жүргізді. Олардың ішінде 68 адам сепсиспен ауырса, 142 пациент бақылау тобында болды. &lt;a href=\"concepts/gwas.html\"&gt;GWAS&lt;/a&gt; (геном бойынша қауымдастықтарды іздеу) және REGENIE Firth регрессиясы әдістерінің көмегімен зерттеушілер 31 геннен 40 қауіпті негізін қалаушы мутацияны анықтады. Әсіресе UBE2L3 геніндегі c.2T&amp;gt;G (p.Met1?) мутациясы ерекше назар аударды, себебі ол старт-кодонның жоғалуына (start-loss) және нәтижесінде ақуыз қызметінің толық бұзылуына әкеледі.&lt;/p&gt;\n&lt;p&gt;Бұл ген нұсқасы сепсисі бар 68 пациенттің үшеуінде кездесіп, бақылау тобында мүлдем табылмады (p = 0.026). Геннің маңыздылығын дәлелдеу үшін авторлар All of Us дерекқорындағы бактериялық инфекциясы бар 26 939 пациенттің мәліметтерін талдады. UBE2L3 геніндегі басқа да зақымдаушы мутациялар ауыр инфекциялардың даму қаупін айтарлықтай арттыратыны белгілі болды (мүмкіндіктер қатынасы 23.10 құрады). Биологиялық механизм тышқандарға жасалған тәжірибелермен расталды: макрофагтарда UBE2L3 генін өшіру қабынуды қоздыратын &lt;a href=\"concepts/il-1beta.html\"&gt;IL-1Beta&lt;/a&gt; цитокинінің ыдырауын бұзып, бақылаусыз қабыну дауылын тудырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу небәрі 210 адамнан тұратын шағын таңдамада жүргізілген және бұл жұмыс әлі тәуелсіз рецензиядан өтпеген препринт болып табылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Сепсис жыл сайын әлем бойынша шамамен 11 миллион адамның өліміне себеп болады. Негізін қалаушы популяциялардың толық геномын секвенирлеу (WGS) сепсиске бейімділікпен байланысты гендерді анықтауға бірегей мүмкіндік береді. Біз қарқынды терапия бөліміндегі 210 араб пациентінің (68 сепсис жағдайы және 142 бақылау тобы) WGS деректері негізінде GWAS және EXWAS талдауларын жүргіздік.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GWAS және EXWAS — бүкіл геном немесе экзом бойынша аурумен байланысты генетикалық өзгерістерді анықтауға көмектесетін статистикалық талдау әдістері.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Іріктеу үшін REGENIE Firth регрессиясы (p &amp;lt; 0.05), CADD көрсеткіші &amp;gt; 20 және AllofUs/gnomAD базаларына қатысты AAF байытылуы сияқты қатаң критерийлер қолданылды. Нәтижесінде 31 гендегі 40 зиянды вариант басым деп танылды.&lt;/p&gt;\n&lt;p&gt;Басты жаңалық UBE2L3 геніндегі жаңа start-loss варианты (c.2T&amp;gt;G; p.Met1?; &lt;a href=\"concepts/combined-annotation-dependent-depletion.html\"&gt;CADD&lt;/a&gt; = 25.6; SIFT = 0.001) болды. Бұл мутация 68 сепсис пациентінің 3-еуінде анықталды, ал бақылау тобында (142 адам) кездескен жоқ (Фишердің нақты тесті, P = 0.026). All of Us (AoU) деректер базасында UBE2L3 миссенс-мутацияларының жинақталуы бактериялық инфекциялармен байланысты екені расталды (n=26,939 жағдай; SKAT-O P = 2.38 × 10⁻³; OR=23.10; 95% CI = [0.63–845.27]).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;UBE2L3 геніндегі сепсиспен байланысты сирек вариант анықталды, бұл клиникалық деректермен және тышқандардағы ген нокауты нәтижесінде туындаған қабынумен расталады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дәрілік заттарды әзірлеуге бейімделген жасанды интеллект модельдері UBE2L3 генін сепсиске қарсы дәрілік нысана ретінде 10 балдан 7.8 баллға бағалады. Бұл нәтижелер тышқандардағы UBE2L3 нокауты IL-1Beta делдалдығымен жүретін қабынудың күшеюіне әкелетінімен сәйкес келеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу белгілі бір популяцияға негізделген, сондықтан нәтижелердің әмбебаптығын растау үшін басқа этникалық топтарда да тексеру қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"sepsisting-anykhtamasy-zhaene-epidemiologiyasy\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#sepsisting-anykhtamasy-zhaene-epidemiologiyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сепсистің анықтамасы және эпидемиологиясы&lt;/span&gt;&lt;/a&gt;Сепсистің анықтамасы және эпидемиологиясы&lt;/h4&gt;\n&lt;p&gt;Сепсис — бұл инфекцияға жауап ретінде ағзаның дұрыс жұмыс істемеуінен туындайтын өмірге қауіпті орган дисфункциясы. Sepsis-3 критерийлеріне сәйкес, диагноз расталған немесе күдікті инфекция жағдайында &lt;a href=\"concepts/sequential-organ-failure-assessment.html\"&gt;Sequential Organ Failure Assessment&lt;/a&gt; (SOFA) шкаласы бойынша 2 және одан да көп ұпай жинағанда қойылады. Әлемде жыл сайын шамамен 11 миллион адам сепсистен қайтыс болады, бұл оны қарқынды терапия бөлімшелеріндегі (ҚТБ) аурушаңдық пен өлімнің негізгі себептерінің біріне айналдырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сепсис — өлім деңгейі жоғары критикалық жағдай, ол жыл сайын 11 миллионға жуық адамның өмірін қияды, ал жеке тәуекелдерді дәл болжау әлі де күрделі мәселе болып қалуда.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"genetikalykh-bejimdilik-zhaene-aghymdaghy-zertteulerding-shekteuleri\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#genetikalykh-bejimdilik-zhaene-aghymdaghy-zertteulerding-shekteuleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Генетикалық бейімділік және ағымдағы зерттеулердің шектеулері&lt;/span&gt;&lt;/a&gt;Генетикалық бейімділік және ағымдағы зерттеулердің шектеулері&lt;/h4&gt;\n&lt;p&gt;Сепсистің дамуы мен нәтижелерінде генетикалық факторлардың рөлі барған сайын айқындала түсуде. Егіздер мен отбасылық талдаулар инфекциялық аурулардан болатын өлімде тұқым қуалаушылық компонентінің бар екенін растайды. Геномдық деңгейдегі ассоциациялық зерттеулер (GWAS) сепсиспен байланысты бірқатар локустарды анықтағанымен, олардың көпшілігі еуропалық популяцияларда жүргізілген. Мұндай әдістер жиі кездесетін нұсқаларға бейім келеді және әсер ету күші жоғары сирек кездесетін, популяцияға тән аллельдерді жіберіп алады. GWAS каталогында сепсиспен байланысты 62 ген тіркелген, бірақ сепсиске бейімділіктің генетикалық архитектурасы әлі толық зерттелмеген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GWAS (геномдық деңгейдегі ассоциациялық зерттеу) — аурумен байланысты генетикалық өзгерістерді анықтау үшін бүкіл геномды сканерлеу әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tolykh-genomdykh-sekvenirleuding-wgs-aeleueti\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#tolykh-genomdykh-sekvenirleuding-wgs-aeleueti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толық геномдық секвенирлеудің (WGS) әлеуеті&lt;/span&gt;&lt;/a&gt;Толық геномдық секвенирлеудің (WGS) әлеуеті&lt;/h4&gt;\n&lt;p&gt;Толық геномдық секвенирлеу (WGS) негізін қалаушы популяцияларда аурумен байланысты жаңа нұсқаларды анықтаудың қуатты құралы болып табылады. Араб популяциялары тарихи «бөтелке мойны» эффектісі мен туысқандық некелердің жоғары деңгейіне байланысты gnomAD немесе AoU сияқты ірі дерекқорларда кездеспейтін бірегей аллельдерге ие. Бұл нұсқалар аталған қауымдастықтардағы ауру қаупіне айтарлықтай әсер етуі мүмкін.&lt;/p&gt;\n&lt;h4 id=\"zertteu-dizajny-zhaene-negizgi-naetizheler\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#zertteu-dizajny-zhaene-negizgi-naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу дизайны және негізгі нәтижелер&lt;/span&gt;&lt;/a&gt;Зерттеу дизайны және негізгі нәтижелер&lt;/h4&gt;\n&lt;p&gt;Бұл жұмыста Қатардағы n=210 араб ҚТБ пациенттерінде WGS деректерін пайдалана отырып, сепсиске бейімділік бойынша GWAS ұсынылған. Біз жеке нұсқалардың ассоциациясын тексеруді, жыныс бойынша стратификацияланған талдауды, ген деңгейіндегі жүктемелік тестілеуді және жолдар талдауын жүргіздік. Талдаулар UBE2L3 геніндегі функцияны жоғалтатын араб нұсқасының маңызды ассоциациясын анықтады. Дәрі-дәрмектерді іздеуге арналған генеративті жасанды интеллект бұл генді сепсис үшін тартымды нысана ретінде белгіледі. Макрофагтарда UBE2L3 &lt;a href=\"concepts/knock-out.html\"&gt;нокаут&lt;/a&gt; (KO) жасалған тышқандар моделінде IL-1Beta убиквитинденуі мен деградациясының төмендеуі байқалды, бұл сепсис моделінде қабыну реакциясының күшеюіне әкелді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу 210 пациенттен тұратын шағын топта жүргізілген және UBE2L3 генінің рөлі туралы қорытындылар тышқандардағы нокаут модельдеріне негізделген, сондықтан нәтижелерді адамдарға тікелей қолдануда сақтық таныту қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"kogorta-sipattamasy\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#kogorta-sipattamasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Когорта сипаттамасы&lt;/span&gt;&lt;/a&gt;Когорта сипаттамасы&lt;/h4&gt;\n&lt;p&gt;Зерттеу тобы 210 қарқынды терапия бөлімінің (ҚТБ) пациентінен тұрды, оның 68-і (32,4%) сепсиспен, ал 142-сі (67,6%) бақылау тобында болды. Таңдамаға 111 ер адам (52,9%) және 99 әйел (47,1%) кірді, жасы 23 пен 91 аралығында (орташа жасы 61,4 ± 15,8) (1-кесте). UBE2L3 p.Met1? нұсқасының барлық үш тасымалдаушысы да мүшелер дисфункциясы (SOFA ≥2) бар сепсиспен ауыратын ер адамдар болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;210 пациенттен тұратын когорта сепсиспен ауыратын 3 ер адамда UBE2L3 генінің сирек нұсқасын анықтауға мүмкіндік берді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zheke-nuskhalardy-taldau-gwas\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#zheke-nuskhalardy-taldau-gwas\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жеке нұсқаларды талдау (GWAS)&lt;/span&gt;&lt;/a&gt;Жеке нұсқаларды талдау (GWAS)&lt;/h4&gt;\n&lt;p&gt;GATK және VQSR сүзгілеуінен кейін ассоциацияны тексеру үшін MAC ≥3 болатын 16,6 миллион аутосомды биаллельді нұсқа таңдап алынды. REGENIE әдісі мен Фирт логистикалық регрессиясы қолданылды. Геномдық инфляция коэффициенті λGC=0,840 болды, бұл шағын таңдама (n=210) үшін тән дефляцияны көрсетеді (SN 1-сурет). Геном бойынша маңыздылық шегіне (p &amp;lt; 5 × 10⁻⁸) ешқандай нұсқа жеткен жоқ (1-сурет). Төрт нұсқа «болжамды» маңыздылыққа (p &amp;lt; 5 × 10⁻⁵) жетті, бірақ олар сепсиспен байланысты емес гендерде орналасқандықтан артефакт деп танылды. Барлығы 396 117 нұсқа p &amp;lt; 0,05 номиналды мәніне ие болды. Сондай-ақ, 316 қызметін жоғалту (pLoF) немесе патогенді миссенс-мутациялар талданды, олардың 295-і p &amp;lt; 0,05 нәтижесін көрсетті (SN I, II-кесте).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GWAS — бұл белгілі бір белгімен байланысты генетикалық нұсқаларды табу үшін мыңдаған адамның геномын салыстыру әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gen-denggejindegi-taldau-burden-tests\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#gen-denggejindegi-taldau-burden-tests\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ген деңгейіндегі талдау (Burden tests)&lt;/span&gt;&lt;/a&gt;Ген деңгейіндегі талдау (Burden tests)&lt;/h4&gt;\n&lt;p&gt;Сирек нұсқалардың жалпы әсерін талдау 20 414 ген үшін жүргізілді. Бонферрони түзету шегінен (α = 0,05, p &amp;lt; 2,4 × 10⁻⁶) ешқандай ген өткен жоқ (2-сурет). Соған қарамастан, биологиялық маңызды сигналдар анықталды. TRPM5 гені (M2 маскасы: &lt;a href=\"concepts/loss-of-function.html\"&gt;LoF&lt;/a&gt; + зақымдаушы миссенс-мутациялар) 7,43 OR және p = 3,4 × 10⁻⁴ көрсеткішімен көш бастады, әйелдерде бұл әсер күштірек байқалды (OR = 10,6, p = 0,012). Сондай-ақ, IL19 (OR = 2,65, p = 7,1 × 10⁻⁴) және GZMM (OR = 14,0, p = 8,7 × 10⁻⁴) маңызды ассоциацияларды көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ген деңгейіндегі талдау сепсистегі қабыну реакциясын реттеуде TRPM5, IL19 және GZMM гендерінің әлеуетті рөлін анықтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"arab-populyaciyasyndaghy-ube2l3-nuskhasyn-saejkestendiru\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#arab-populyaciyasyndaghy-ube2l3-nuskhasyn-saejkestendiru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Араб популяциясындағы UBE2L3 нұсқасын сәйкестендіру&lt;/span&gt;&lt;/a&gt;Араб популяциясындағы UBE2L3 нұсқасын сәйкестендіру&lt;/h4&gt;\n&lt;p&gt;Жоғары патогендік (CADD ≥20) және p ≤ 0,05 мәні бар 316 нұсқаның ішінен AoU және GnomAD базаларында кездеспейтін 31 гендегі 40 нұсқа бөлініп алынды. Тілдік модельдер (gemma4, txgemma) көмегімен UBE2L3 ең перспективалы үміткер деп танылды. Нұсқа (chr22:21,567,746:T&amp;gt;G; p.Met1?) 25,6 CADD балына (ең патогенді 0,3% ішінде), 0,001 SIFT балына және 0,0071 аллель жиілігіне ие. Мутация старт-кодонды (ATG → AGG) өзгертеді, бұл UBE2L3 ақуызының (152 аминқышқыл) қызметін жоғалтуына әкеледі. Барлық үш тасымалдаушы сепсиспен ауыратын ер адамдар болды (68-ден 3-і, бақылауда 142-ден 0-і, Фишер тесті p = 0,026). Нұсқа gnomAD базасында (945 000-нан астам адам) табылмады, бұл оның араб популяциясына тән екенін көрсетеді. IGV арқылы тексеру барлық тасымалдаушыларда нұсқаны растады (оқу тереңдігі 19x–40x) (SN 3-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Таңдама шағын және нұсқа белгілі бір популяцияға тән болғандықтан, нәтижелер тәуелсіз репликацияны талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ube2l3-ti-taeuelsiz-validaciyalau\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#ube2l3-ti-taeuelsiz-validaciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;UBE2L3-ті тәуелсіз валидациялау&lt;/span&gt;&lt;/a&gt;UBE2L3-ті тәуелсіз валидациялау&lt;/h4&gt;\n&lt;p&gt;Нұсқа деңгейінде репликация жасау мүмкін болмағандықтан, AoU базасында (26 939 инфекция жағдайы, 243 470 бақылау) ген деңгейінде тексеру жүргізілді. UBE2L3 миссенс-нұсқаларын талдау маңызды ассоциацияны растады (SKAT-O p = 2,38 × 10⁻³, OR = 23,10), бұл UBE2L3 вариацияларының инфекцияларға бейімділікке әсер ету гипотезасын қолдайды.&lt;/p&gt;\n&lt;h4 id=\"sepsis-bojynsha-zhariyalanghan-gwas-derekterimen-khiylysu\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#sepsis-bojynsha-zhariyalanghan-gwas-derekterimen-khiylysu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сепсис бойынша жарияланған GWAS деректерімен қиылысу&lt;/span&gt;&lt;/a&gt;Сепсис бойынша жарияланған GWAS деректерімен қиылысу&lt;/h4&gt;\n&lt;p&gt;Сепсис белгілерімен байланысты 62 генді қамтитын GWAS каталогымен (SN Кесте V, VI) салыстыру біздің зерттеуіміздегі 25 геннің бұрын хабарланған ассоциациялармен сәйкес келетінін анықтады (SN Кесте VII). Олардың қатарына USP37, LRBA, KIF15, GPM6A, MAD1L1, RIN3, NFKBIL1, CHRNA7, SLAMF6, LINC00378, SAMD9, SLC35F4, TFRC, CLIC6, ANKMY2, CSMD1, FER, RPE65, HRH1, LPP, LINC00887, GAK, VPS13A, CRISPLD2 және FLT1 жатады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу сепсиспен байланысты және бұрынғы әдебиеттерде сипатталған 25 генді анықтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"all-of-us-derekter-bazasymen-ajkhaspaly-siltemeler\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#all-of-us-derekter-bazasymen-ajkhaspaly-siltemeler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;All of Us деректер базасымен айқаспалы сілтемелер&lt;/span&gt;&lt;/a&gt;All of Us деректер базасымен айқаспалы сілтемелер&lt;/h4&gt;\n&lt;p&gt;Осы зерттеудегі CADD ≥20 және p ≤0,05 болатын 316 нұсқаның 17-сі All of Us (AoU) базасында ассоциация көрсетті (SN Кесте VIII, IX). Сонымен қатар, қарқынды терапия бөлімінің (HMC ICU) когортасында 117 нұсқаның гомозиготалы тасымалдаушылары анықталды. Он екі нұсқа әйелдерге тән маңыздылықты көрсетті (әйелдерде p&amp;lt;0,05, ерлерде p&amp;gt;0,05), ал 57 гендегі 58 нұсқа ICU когортасында жиі кездескенімен, gnomAD базасында сирек болды, бұл популяциялық ерекшелікті көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CADD (Combined Annotation Dependent Depletion) — генетикалық нұсқалардың патогенділігін бағалайтын метрика; ≥20 мәні нұсқаның ең зиянды 1%-ға жататынын білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;GWAS нәтижелері бойынша CADD ≥20 және p ≤0,05 болатын 295 генге жүктемені талдау (burden testing) p&amp;lt;0,05 болатын 163 генді анықтады (SN Кесте X). HLA-DQA1 және PSMB8 гендері сепсис патофизиологиясымен ең күшті биологиялық байланыс көрсетті. ABCG2 антибактериалды иммунитетпен механикалық байланысқа ие, ал SBNO1 протеомдық деректер бойынша сепсиске тән плазмалық пептидтік қолтаңбалармен байланысты. p&amp;lt;0,05 болатын 163 геннің ішінде ICU когортасына тән 32 нұсқаны қамтитын 12 ген болды: FAM72B, NOTCH2NL, SEC22B, BOD1, HLA-B, ZNF92, DYNLL1, GXYLT1, PABPC3, ZFYVE1, ZNF443 және UBE2L3.&lt;/p&gt;\n&lt;h4 id=\"ube2l3-lokusynyng-ajmakhtykh-bajlanystylykh-ld-taldauy\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#ube2l3-lokusynyng-ajmakhtykh-bajlanystylykh-ld-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;UBE2L3 локусының аймақтық байланыстылық (LD) талдауы&lt;/span&gt;&lt;/a&gt;UBE2L3 локусының аймақтық байланыстылық (LD) талдауы&lt;/h4&gt;\n&lt;p&gt;UBE2L3 локусындағы (chr22:21,567,746 T&amp;gt;G; c.2T&amp;gt;G; p.Met1?) ассоциация жақын маңдағы жиі кездесетін нұсқамен байланыстылыққа (LD) немесе сирек кездесетін start-loss аллелінің өзіне байланысты ма, соны анықтау үшін 350 кб терезеде аймақтық LD талдауы жүргізілді (3-Кесте). Барлық 210 қатысушының фазаланған WGS гаплотиптері мен PLINK2 бағдарламасын қолдана отырып, 3620 нұсқа үшін r² есептелді (3A-Сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/ld.html\"&gt;Байланыстылық&lt;/a&gt; (LD) — әртүрлі локустардағы аллельдердің кездейсоқ емес ассоциациясы; егер нұсқалар күшті LD күйінде болса, қайсысы аурудың нақты себебі екенін анықтау қиын.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;UBE2L3 локусындағы LD құрылымы өте сирек болды. Максималды r² мәні 0,332-ні құрады, ал бүкіл аймақта небәрі тоғыз нұсқа ғана r² &amp;gt; 0,1 мәнінен асты (3-Кесте). Ешбір нұсқа r² &amp;gt; 0,5 деңгейіне жеткен жоқ. Күшті байланыстылықтың болмауы ассоциация сигналының тікелей сирек кездесетін start-loss аллелі (AF=0,007) арқылы басқарылатынын растайды. Бұл бірегей гаплотиптегі «негізін қалаушы аллель» (founder allele) үшін тән. Ген құрылымын талдау (3B-Сурет) нұсқаның UBE2L3-тің бірінші экзонында, YDJC және BCR гендерінің арасында орналасқанын көрсетті. Осылайша, p.Met1? нұсқасы осы локустағы жалғыз сенімді себепкер нұсқа болып табылады.&lt;/p&gt;\n&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;h4 id=\"sepsiske-bejimdilikting-genetikalykh-negizi\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#sepsiske-bejimdilikting-genetikalykh-negizi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сепсиске бейімділіктің генетикалық негізі&lt;/span&gt;&lt;/a&gt;Сепсиске бейімділіктің генетикалық негізі&lt;/h4&gt;\n&lt;p&gt;Жансақтау бөліміндегі 210 араб пациентінде жүргізілген толық геномдық ассоциациялық зерттеу (GWAS) барысында UBE2L3 (c.2T&amp;gt;G; p.Met1?) геніндегі функцияны жоғалтушы ерекше нұсқа анықталды. Бұл нұсқа Qatar Genome Programme (14 669 адам) және gnomAD v4.1 (251 000 адам) деректер базасында кездеспейді, бұл оның араб популяциясына тән «негізін қалаушы нұсқа» екенін көрсетеді. Бұл нәтиже еуропалық популяцияларға бағытталған дәстүрлі GWAS әдістерінің кейбір этникалық генетикалық маркерлерді анықтаудағы шектеулілігін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;UBE2L3 геніндегі c.2T&amp;gt;G нұсқасы трансляцияның басталуын толық тоқтатып, ақуыз функциясының жойылуына әкелетін араб «негізін қалаушы нұсқасы» болып табылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;UBE2L3 гені TLR→NF-κB→цитокин жолында маңызды рөл атқаратын E2-&lt;a href=\"concepts/ubiquitin.html\"&gt;убиквитин&lt;/a&gt;-конъюгациялаушы ферментті кодтайды. Старттық кодондағы мутация ақуыз синтезін толығымен тоқтатады. UBE2L3 бұрын ревматоидты артрит, Крон ауруы және жүйелі қызыл жегі сияқты аутоиммунды аурулармен байланыстырылған. Сепсис патогенезіндегі рөлі оның &lt;a href=\"concepts/lubac.html\"&gt;LUBAC&lt;/a&gt; кешені арқылы NF-κB-ны белсендіру қабілетімен түсіндіріледі. UBE2L3 деңгейінің төмендеуі NF-κB белсенділігін және қабыну гендерінің экспрессиясын азайтады, бұл оны иммундық жауаптың негізгі реттеушісіне айналдырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LUBAC — бұл басқа ақуыздарды (мысалы, NEMO) сызықтық убиквитин тізбектерімен «белгілеп», қабыну каскадын іске қосатын ақуыз кешені.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;UBE2L3-тің сепсиспен тағы бір байланысы — IL-1β реттелуі. Адам мен тышқан макрофагтарында UBE2L3 про-IL-1β-ның протеасомалар арқылы ыдырауына ықпал етеді. UBE2L3 тапшылығында про-IL-1β деңгейі артып, инфламмасома белсендірілгенде жетілген IL-1β-ның шамадан тыс бөлінуіне әкеледі. Бұл UBE2L3 функциясының бұзылуы қорғаныш қабынуынан патологиялық «цитокиндік дауылға» ауысуға себеп болатынын білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу жансақтау бөліміндегі пациенттер негізінде жүргізілді; таңдама ерекшеліктеріне байланысты тасымалдаушылық жиілігін жалпы халыққа экстраполяциялауда сақтық таныту керек.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;UBE2L3-тің сепсиске бейімділіктегі рөлі келесі дәлелдермен расталады: функцияның толық жойылуы (CADD = 25.6, SIFT = 0.001), gnomAD және AoU базаларында (945 000-нан астам адам) болмауы, тек пациенттерде кездесуі (3/68 қарсы 0/142, p = 0.026), NF-κB жолындағы биологиялық маңызы, AoU когортасындағы тәуелсіз валидация (SKAT-O P = 2.38×10⁻³) және дәрілік нысана ретіндегі жоғары рейтингі.&lt;/p&gt;\n&lt;h4 id=\"shekteuler\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#shekteuler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер&lt;/span&gt;&lt;/a&gt;Шектеулер&lt;/h4&gt;\n&lt;p&gt;Бұл зерттеудің бірқатар шектеулері бар. Біріншіден, 210 пациенттен тұратын салыстырмалы түрде шағын таңдама статистикалық қуатты төмендетті, соның салдарынан ешқандай нұсқа геномдық маңыздылық деңгейіне жетпеді. Анықталған ассоциациялар болжамды сипатқа ие және ірі когорталарда тексерілуі тиіс. Екіншіден, UBE2L3 геніне қатысты жаңалық биологиялық тұрғыдан негізделгенімен, небәрі үш тасымалдаушыға негізделген, бұл функционалдық валидацияны қажет етеді. Үшіншіден, зерттеу Катардағы бір қарқынды терапия бөлімшесі (ҚТБ) базасында жүргізілді, бұл қорытындыларды басқа популяцияларға экстраполяциялау мүмкіндігіне күмән келтіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;210 адамдық шектеулі таңдама және популяцияның ерекшелігі нәтижелерді түсіндіруде сақтықты талап етеді, алайда жұмыс толық геномды секвенирлеу (WGS) арқылы сирек кездесетін нұсқаларды анықтаудың тиімділігін дәлелдейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Төртіншіден, топтар арасындағы теңгерімсіздік (жағдайлар 32%-ды құрады) бұл факторды түзету үшін Фирт логистикалық регрессиясы қолданылғанына қарамастан, талдау қуатын төмендеткен болуы мүмкін. Бесіншіден, қатысушыларды бір орталық шеңберінде таңдау жүйелі қателікке әкелді: бақылау тобы сау еріктілерден емес, сепсисі жоқ ауыр науқастардан құралды, бұл аллельдер жиілігі бойынша деректердің бүкіл араб популяциясына қолданылуын шектейді. Ақырында, мақсатты басымдықтарды белгілеу үшін үлкен тілдік модельдерді (&lt;a href=\"concepts/llm.html\"&gt;LLM&lt;/a&gt;) пайдалану ізденіс сипатында және түпкілікті дәлел болып табылмайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сау адамдардың орнына ҚТБ пациенттерін бақылау тобы ретінде пайдалану гендер жиілігін бағалауда қателіктерге әкелуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Аталған шектеулерге қарамастан, бұл зерттеу негізін қалаушы популяцияларда толық геномды секвенирлеудің (WGS) әлеуетін көрсетеді. Бұл тәсіл стандартты генотиптеуде назардан тыс қалатын күшті әсері бар сирек нұсқаларды анықтауға мүмкіндік береді. Популяцияға тән жоғары маңыздылыққа ие нұсқаларды табу әртүрлі этникалық топтарда сепсисті емдеуде дербестендірілген медицинаны дамыту үшін маңызды мәнге ие.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"zertteu-populyaciyasy\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#zertteu-populyaciyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу популяциясы&lt;/span&gt;&lt;/a&gt;Зерттеу популяциясы&lt;/h4&gt;\n&lt;p&gt;Зерттеуге Hamad Medical Corporation (IRB 19-00037) қарқынды терапия бөлімінің (ҚТБ) 210 науқасы кірді, оның 68-і сепсиспен, 142-сі сепсис емес жағдайлар. Толық геномдық секвенирлеу (WGS) Illumina HiSeq 4000 аспабында 2x150 ж.н. жұптық оқылымдармен және 30x қамту тереңдігімен орындалды. GRCh38 референстік геномына туралау BWA көмегімен, ал варианттарды анықтау GATK HaplotypeCaller арқылы жүзеге асты. Талдау үшін minMAC ≥3 болатын 16,6 миллион биаллельді аутосомды варианттар іріктелді.&lt;/p&gt;\n&lt;h4 id=\"sapany-bakhylau\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#sapany-bakhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сапаны бақылау&lt;/span&gt;&lt;/a&gt;Сапаны бақылау&lt;/h4&gt;\n&lt;p&gt;Ассоциацияның ең маңызды сигналдарының сапасын бақылау барлық 210 BAM-файл үшін samtools mpileup (v1.20) арқылы жүргізілді. Аллель жиіліктерінің сәйкестігі (VCF және pileup) &amp;lt;0,03 айырмашылық шегімен (deltaAF) бағаланды. Сондай-ақ, тізбек ауытқуы (strand bias) бағаланып, Integrative Genomics Viewer (IGV) арқылы визуалды тексеру жүргізілді.&lt;/p&gt;\n&lt;h4 id=\"fazalau\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#fazalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Фазалау&lt;/span&gt;&lt;/a&gt;Фазалау&lt;/h4&gt;\n&lt;p&gt;Гаплотиптерді анықтау үшін генотиптерді &lt;a href=\"concepts/fazirovanie.html\"&gt;фазалау&lt;/a&gt; BEAGLE v5.1 көмегімен орындалды. Фазаланбаған генотиптері (0/1) бар біріктірілген VCF-файл фазаланған (0/1) файлға айналдырылып, tabix арқылы индекстелді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Фазалау — бұл аллельдердің қай хромосомада (әке немесе ана) орналасқанын анықтау процесі, бұл гаплотиптерді түсіну үшін өте маңызды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"varianttardy-annotaciyalau\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#varianttardy-annotaciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Варианттарды аннотациялау&lt;/span&gt;&lt;/a&gt;Варианттарды аннотациялау&lt;/h4&gt;\n&lt;p&gt;Аннотация бірнеше құралдар арқылы жүргізілді: rsID dbSNP арқылы, функционалдық әсерлер (LOF және &lt;a href=\"concepts/nonsense-mediated-mrna-decay.html\"&gt;NMD&lt;/a&gt;) SnpEff (GRCh38.99) арқылы, клиникалық маңыздылығы ClinVar арқылы қосылды. Патогендік баллдар (SIFT, PolyPhen-2 HDIV, REVEL, MutationTaster, FATHMM, MetaSVM, CADD) dbNSFP v5.3.1a-дан алынды. Популяциялық аллель жиіліктері gnomAD v4.1-ден аннотацияланды және AoU деректер базасында бар-жоғы тексерілді.&lt;/p&gt;\n&lt;h4 id=\"gwas-taldauy\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#gwas-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GWAS талдауы&lt;/span&gt;&lt;/a&gt;GWAS талдауы&lt;/h4&gt;\n&lt;p&gt;Толық геномдық ассоциация (GWAS) REGENIE v3.2.9 көмегімен екі кезеңде жүзеге асырылды. Бірінші кезеңде полигендік фонды бағалау үшін ridge регрессия (LOCO) моделі қолданылды. Екінші кезеңде Firth логистикалық регрессиясы (68 жағдай/142 бақылау, 32% жағдай үлесі) қолданылды. Ковариаттар: жасы, жынысы, BMI, SOFA және APACHE II баллдары, ҚТБ-дағы күндер. Талдау 16,6 миллион вариантпен шектелді. Жыныс бойынша стратификацияланған талдау ерлер (n=111) және әйелдер (n=99) үшін жүргізілді.&lt;/p&gt;\n&lt;h4 id=\"genge-negizdelgen-zhuekteme-taldauy\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#genge-negizdelgen-zhuekteme-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Генге негізделген жүктеме талдауы&lt;/span&gt;&lt;/a&gt;Генге негізделген жүктеме талдауы&lt;/h4&gt;\n&lt;p&gt;Жүктеме талдауы (burden testing) 20 414 ген бойынша бес тест (SKAT, SKAT-O, SKATO-ACAT, ACATV, ACATO) және төрт варианттық маска (M1-M4) көмегімен жүргізілді. Варианттар төрт жиілік (AAF) тобына бөлінді. Бонферрони түзетуімен маңыздылық шегі p&amp;lt;6,8×10⁻⁷ деп белгіленді.&lt;/p&gt;\n&lt;h4 id=\"negizdeushi-varianttardy-basymdykhtandyru-zhaene-taeuelsiz-validaciya\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#negizdeushi-varianttardy-basymdykhtandyru-zhaene-taeuelsiz-validaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Негіздеуші варианттарды басымдықтандыру және тәуелсіз валидация&lt;/span&gt;&lt;/a&gt;Негіздеуші варианттарды басымдықтандыру және тәуелсіз валидация&lt;/h4&gt;\n&lt;p&gt;Негіздеуші варианттар GWAS маңыздылығы, жоғары патогенділігі (CADD ≥20), gnomAD/AoU-да жоқтығы және иммундық жүйеге қатыстылығы бойынша таңдалды. 316 варианттың ішінен 31 ген Катар популяциясы үшін бірегей деп танылды. UBE2L3 генінің валидациясы All of Us бағдарламасындағы 26 939 бактериялық инфекция жағдайы бойынша SKAT-O көмегімен жүргізілді.&lt;/p&gt;\n&lt;h4 id=\"ajmakhtykh-bajlanys-taldauy\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#ajmakhtykh-bajlanys-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Аймақтық байланыс талдауы&lt;/span&gt;&lt;/a&gt;Аймақтық байланыс талдауы&lt;/h4&gt;\n&lt;p&gt;Фазаланған r² мәні PLINK2 v2.0.0-a.7.1 көмегімен chr22:21,400,000–21,750,000 (GRCh38) аймағы үшін есептелді. 860 мультиаллельді варианттар шығарылғаннан кейін, 3 620 биаллельді &lt;a href=\"concepts/snp.html\"&gt;SNP&lt;/a&gt; талдау үшін қалды. Ген координаттары Ensembl release 109-дан алынған.&lt;/p&gt;\n&lt;h4 id=\"daerilik-nysanalardy-izdeuge-arnalghan-zhasandy-intellekt\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#daerilik-nysanalardy-izdeuge-arnalghan-zhasandy-intellekt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дәрілік нысаналарды іздеуге арналған жасанды интеллект&lt;/span&gt;&lt;/a&gt;Дәрілік нысаналарды іздеуге арналған жасанды интеллект&lt;/h4&gt;\n&lt;p&gt;Дәрілік нысаналарды басымдыққа бөлу үшін зерттеушілер зиянды әсері бар деп болжанған негізін қалаушы нұсқаларды пайдаланды. Талдау құралы ретінде үш үлкен тілдік модель (LLM) қолданылды: Therapeutic Data Commons деректері (соның ішінде DisGeNet базасындағы ген-ауру байланыстары) негізінде қайта оқытылған txgemma-9b мамандандырылған моделі және екі әмбебап модель — gemma4-e4b мен жаңартылған gemma4-12b-unified.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM (үлкен тілдік модельдер) — бұл үлкен көлемдегі деректерді талдауға және ықтималдықтарды болжауға қабілетті терең оқыту алгоритмдері, бұл жағдайда олар геннің дәрілік нысана ретіндегі тартымдылығын бағалау үшін қолданылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әрбір модельге нұсқалар бойынша жиынтық статистикалық деректер мен функционалдық аннотациялар берілді. Нейрондық желілердің міндеті әрбір генге 0-ден 10-ға дейінгі шкала бойынша балл қою болды, бұл балл геннің дәрілік әсер ету нысанасы ретіндегі тартымдылығын көрсетеді. Алынған нәтижелер модельдер арасында да, сондай-ақ әрбір модельдің ішінде «априорлық» (ассоциация деректерінсіз) және «апостериорлық» (статистикалық деректермен бірге) бағаларды салыстыру арқылы талданды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic-f1.jpg\" alt=\"1-сурет. Геном бойынша ассоциация нәтижелерінің Манхэттен графигі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Геном бойынша ассоциация нәтижелерінің Манхэттен графигі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет. Геном бойынша ассоциация нәтижелерінің Манхэттен графигі. Интенсивті терапия бөлімінің 210 пациентіндегі (68 жағдай, 142 бақылау) сепсиске бейімділік үшін жекелеген нұсқалардың ассоциация нәтижелері. X осі хромосомалық позицияны, ал Y осі -log10(p-мәнін) көрсетеді. Үзік қызыл сызық геномдық маңыздылықты (p &amp;lt; 5×10⁻⁸), ал үзік көк сызық болжамды маңыздылық шегін (p &amp;lt; 1×10⁻⁵) білдіреді. Негізгі локустар белгіленген: STK32B (chr4p16.2), RP11-241F15.3 (chr4q13), MUC19 (chr12q12) және chr8p23.1 (DEFB кластері).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic-f2.jpg\" alt=\"2-сурет. Жүктеме тестіне (burden test) арналған Манхэттен графигі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет. Жүктеме тестіне (burden test) арналған Манхэттен графигі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сурет. Жүктеме тестіне (burden test) арналған Манхэттен графигі. X осі хромосомалық позицияны, ал Y осі -log10(p-мәнін) көрсетеді. Үзік қызыл сызық геномдық маңыздылықты (p &amp;lt; 5×10⁻⁸), ал үзік көк сызық болжамды маңыздылық шегін (p &amp;lt; 1×10⁻⁵) білдіреді. Ең маңызды бес ген белгіленген: MTMR11 (chr1), IL19 (chr1), TRPM5 (chr11), SPATA7 (chr14) және GZMM (chr19).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic-f3.jpg\" alt=\"3-сурет. UBE2L3 локусының аймақтық ассоциациясы және байланыс диссонансы графигі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет. UBE2L3 локусының аймақтық ассоциациясы және байланыс диссонансы графигі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-сурет. UBE2L3 локусының аймақтық ассоциациясы және байланыс диссонансы графигі. A. chr22:21.4–21.76 Мб (GRCh38) аймағындағы 3620 биаллельді SNP үшін -log₁₀(P). Әрбір нүкте бір нұсқаны білдіреді; түс индекс нұсқасына (chr22:21,567,746 T&amp;gt;G; күлгін ромб) қатысты фазаланған r²-ді көрсетеді, ол 210 араб интенсивті терапия пациенттерінің WGS гаплотиптері негізінде есептелген (PLINK2 v2.0.0 -r2-phased). Күлгін көлеңке UBE2L3 генінің денесін білдіреді. Үзік көлденең сызық номиналды маңыздылықты (P=0.05) көрсетеді. Күшті байланыс диссонансындағы нұсқалардың болмауы (максималды r²=0.332; r²&amp;gt;0.5 нұсқасы жоқ) ассоциация сигналының байланысқан жалпы нұсқа емес, старт-кодонның жоғалуына әкелетін сирек аллель арқылы басқарылатынын растайды, бұл жеке гаплотиптегі арабтарға тән негізін қалаушы аллельмен сәйкес келеді. B. UBE2L3 локусындағы ген құрылымы (Ensembl GRCh38). Экзондар толтырылған тіктөртбұрыштар түрінде; интрондар транскрипция бағытын көрсететін бағыттаушы көрсеткілері бар көлденең сызықтар ретінде көрсетілген. Күлгін үзік тік сызық индекс нұсқасының позициясын белгілейді. GRCh38/hg38 координаттары.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Реанимацияда&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сепсистен&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;болатын жоғары&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;өлім-жітім&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Катардағы 210&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;пациенттің&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;геномын&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;секвенирлеу&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;UBE2L3 генінен&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;start-loss&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мутациясы&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;табылды&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Қабынуды&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;емдеуге&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;арналған жаңа&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нысана&lt;/text&gt;&lt;text x=\"626\" y=\"162\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;анықталды&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Препринт лицензиясы&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;medRxiv&lt;/td&gt;\n&lt;td&gt;genetic and genomic medicine&lt;/td&gt;\n&lt;td&gt;все права у авторов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Rostami, M. R.; Ait Hssain, A.; Robay, A.; Schenck, E. J.; Mezey, J. G.; Crystal, R. G.; Rodriguez-Flores, J. L.&lt;/p&gt;\n&lt;h3 id=\"derekkoezder\"&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Сілтеме&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница препринта&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://www.medrxiv.org/content/10.64898/2026.
