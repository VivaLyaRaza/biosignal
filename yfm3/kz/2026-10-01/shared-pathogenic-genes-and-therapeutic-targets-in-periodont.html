;5-сур. Машиналық оқыту негізінде негізгі диагностикалық гендерді скринингтеу және валидациялау.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-сур. Машиналық оқыту негізінде негізгі диагностикалық гендерді скринингтеу және валидациялау. (A) Модельдердің тиімділігін салыстыру әртүрлі когорталардағы әртүрлі модельдер үшін AUC мәндерін көрсететін жылу картасымен бейнеленген. Суреттің сол жақ бағаны модельдерге сәйкес келеді, ал оң жақ бағаны AUC-ті көрсетеді, мұнда жоғары мәндер жақсырақ өнімділікті білдіреді. Түстерді пайдалану әрбір когортаның шығу тегін белгілеуге қызмет етеді. (B, C) PD оқу деректер жиынындағы және sJIA оқу деректер жиынындағы 6 негізгі диагностикалық геннің ROC қисығы. (D, E) 6 негізгі диагностикалық геннің экспрессиясы.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont-f6.jpg\" alt=\"Сурет 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 6&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont-f7.jpg\" alt=\"Сурет 7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 7&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont-f8.jpg\" alt=\"Сурет 8\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 8&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont-f9.jpg\" alt=\"9-сур. Үш лиганд-ақуыз кешенінің (Кемпферол-IL1B, Кемпферол-ITGAM және Дезоксихоль қышқылы-MMP1) 100 нс ішіндегі молекул\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;9-сур. Үш лиганд-ақуыз кешенінің (Кемпферол-IL1B, Кемпферол-ITGAM және Дезоксихоль қышқылы-MMP1) 100 нс ішіндегі молекулалық динамика (MD) талдауы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;9-сур. Үш лиганд-ақуыз кешенінің (Кемпферол-IL1B, Кемпферол-ITGAM және Дезоксихоль қышқылы-MMP1) 100 нс ішіндегі молекулалық динамика (MD) талдауы. (A) Ақуыз қаңқасының орташа квадраттық ауытқуы (RMSD). (B) Гирация радиусы (Rg). (C) Әрбір қалдық үшін орташа квадраттық флуктуация (RMSF). (D) 0,35 нм шегіндегі сутектік байланыстар. (E) Гиббс еркін энергия ландшафттары (3D беті және 2D контур).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Пародонтит пен&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сЮИА байланысы&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Биоинформатика&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;және ML&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;37 ортақ ген&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;анықталды&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Жаңа&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;терапиялық&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нысандар&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мақала рецензияланатын PLoS computational biology журналында жарияланған. Бірақ бұл да бір зерттеу ғана, түпкілікті қорытынды емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\"
