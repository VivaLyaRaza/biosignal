            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"158\" cy=\"179\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"662\" cy=\"161\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · IMMUNOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Иммундық жасушалар бауырдың&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;майлануын қалай қоздырады&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise-f1.jpg\" alt=\"1-сурет. Бауырдағы HNP1 инфильтрациясының жоғарылауы клиникалық пациенттердегі бауыр стеатозымен корреляцияланады.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Бауырдағы HNP1 инфильтрациясының жоғарылауы клиникалық пациенттердегі бауыр стеатозымен корреляцияланады.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет. Бауырдағы HNP1 инфильтрациясының жоғарылауы клиникалық пациенттердегі бауыр стеатозымен корреляцияланады. (a) Бауыр стеатозының әртүрлі ауырлық дәрежесіндегі адам бауырының кесінділеріндегі &lt;a href=\"concepts/human-neutrophil-peptides.html\"&gt;HNP&lt;/a&gt; деңгейлері мен таралуын көрсететін өкілді ИГХ суреттері. Масштабты сызық: 100 мкм. (b) Бауыр стеатозы жоқ (n = 8) немесе жеңіл (n = 14) және ауыр стеатозы бар (n = 7) пациенттердің бауыр кесінділерін ИГХ бағалау, сондай-ақ осы үлгілердегі ИГХ-оң аймақтар бойынша нормаланған HNP деңгейлерінің жартылай сандық талдауы. (c-d) Бауыр HNP деңгейлерінің стеатоз аймағымен (c) және НАЖБП белсенділік көрсеткіштерімен (d) корреляциялық талдауы. (e) Минималды, жеңіл және ауыр бауыр стеатозы топтарынан алынған клиникалық үлгілердегі дифференциалды экспрессияланатын гендерді (&lt;a href=\"concepts/gene-expression.html\"&gt;DEG&lt;/a&gt;) көрсететін көп жанартаулық графиктер. (f) Он алты адам бауыры үлгісіндегі липидтерді тасымалдау және метаболизмі, P450, фиброз және қабынумен байланысты гендердің экспрессиясының өзгеруін көрсететін &lt;a href=\"concepts/rna-seq.html\"&gt;RNA-seq&lt;/a&gt; профильдері, салыстырмалы HNP деңгейлері бағаналы диаграммалар түрінде қосылған. (g-j) Салыстырмалы HNP мазмұны мен липидтерді тасымалдау (g), липогенез (h), β-тотығу (i) және липидтердің жиналуы (j) арасындағы корреляцияны көрсететін шашырау диаграммалары. Детерминация коэффициенттері (R2) және P мәндері көрсетілген. Статистикалық маңыздылық көптік салыстырулар үшін Бонферрони түзетуімен бір факторлы дисперсиялық талдау арқылы есептелді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Бауырдың метаболикалық ауруы кезінде ағзаға нейтрофилдер — туа біткен иммунитет жасушалары енеді. Бұрын олардың бұл процестегі рөлі белгісіз еді. Жаңа зерттеу көрсеткендей, нейтрофил ақуыздары гепатоциттердің митохондрияларын зақымдап, майдың жиналуына және аурудың асқынуына әкеледі.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Нейтрофилдік альфа-дефензиндер бауыр митохондрияларында &lt;a href=\"concepts/vdac1.html\"&gt;VDAC1&lt;/a&gt; мультимеризациясын қоздырады&lt;/li&gt;\n&lt;li&gt;Тіндердегі HNP мөлшері науқастардағы стеатоздың ауырлығымен байланысты&lt;/li&gt;\n&lt;li&gt;HNP-VDAC1 өзара әрекеттесуін бөгеу тышқандарда стеатогепатиттің алдын алады&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Метаболикалық дисфункциямен байланысты стеатотикалық бауыр ауруы (&lt;a href=\"concepts/metabolic-dysfunction-associated-steatotic-liver-disease.html\"&gt;MASLD&lt;/a&gt;) липидтердің жиналуымен және қабынумен сипатталады. Авторлар MASLD бар науқастардың биопсиясын талдап, тіндердегі адам нейтрофилдік пептидтерінің (HNP немесе альфа-дефензиндер) мөлшері мен стеатоздың ауырлығы арасындағы тікелей байланысты анықтады. In vitro тәжірибелерінде HNP гепатоциттерге еніп, митохондриялардың сыртқы мембранасындағы VDAC1 (потенциалға тәуелді аниондық арна 1) ақуызының мультимеризациясын тудыратыны көрсетілді. Бұл органеллалар жұмысының бұзылуына және липидтердің жиналуына әкеледі.&lt;/p&gt;\n&lt;p&gt;Гипотезаны тексеру үшін HNP1 экспрессиялайтын &lt;a href=\"concepts/transgennye-myshi.html\"&gt;трансгенді тышқандар&lt;/a&gt; қолданылды. Стандартты рационда жануарлар сау қалды, бірақ майлы диета аясында оларда семіздік пен &lt;a href=\"concepts/mash.html\"&gt;стеатогепатит&lt;/a&gt; дамыды. VDAC1 мультимеризациясын бөгейтін дәріні қолдану патологияның алдын алды. Осылайша, HNP бауыр липидтермен шамадан тыс жүктелген кезде патогендік эффекторлар ретінде әрекет етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер трансгенді тышқандар мен жасуша дақылдарында алынған, бұл клиникалық сынақтарда қауіпсіздікті растауды талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Метаболикалық дисфункциямен байланысты бауырдың майлы ауруы (MASLD) қарапайым стеатоздан стеатогепатит сатысына өткенде бауыр тініне нейтрофилдердің инфильтрациясы байқалады. Алайда, нейтрофил эффекторлары бұл ауысудың жай ғана маркері ме, әлде оның тікелей себепкері ме деген сұрақ белгісіз болып келді.&lt;/p&gt;\n&lt;p&gt;Біздің зерттеуіміз адамның нейтрофилдік пептидтері (HNP) немесе α-дефензиндер аурудың жай ғана жанама қатысушылары емес, оның негізгі қозғаушы күштері екенін көрсетеді. Бауыр гемангиомасына байланысты хирургиялық ота жасалған және MASLD белгілері бар науқастарда бауыр биоптаттарындағы HNP мөлшері стеатоздың гистологиялық ауырлығымен корреляцияланады. In vitro тәжірибелерінде HNP гепатоциттерге еніп, митохондриялардың сыртқы мембранасындағы потенциалға тәуелді аниондық арна 1 (VDAC1) мультимеризациясын қоздыратыны, бұл өз кезегінде митохондриялық дисфункцияға және липидтердің жиналуына әкелетіні анықталды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HNP пептидтері гепатоциттер митохондрияларында VDAC1 мультимеризациясын тудырады, бұл стеатогепатиттің дамуына тікелей әсер етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Липидтермен шамадан тыс жүктелген диета кезінде (стандартты рационда емес), HNP1 трансгенді тышқандарында семіздік пен стеатогепатиттің өршуі байқалды. Бұл патологиялық үдерісті HNP әсерінен болатын VDAC1 мультимеризациясын тежейтін ауызша қабылданатын &lt;a href=\"concepts/prolekarstvo.html\"&gt;продәрі&lt;/a&gt; арқылы жоюға болады. Бұл нәтижелер нейтрофилдердің туа біткен иммунитетін гепатоциттердің митохондриялық дисфункциясымен байланыстырады, қорғаныш қызметін атқаратын HNP-ді липидтермен жүктелген гепатоциттерде патогендік эффекторлар ретінде қайта қарастырады және HNP–VDAC1 осін MASLD үшін терапевтік нысана ретінде айқындайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VDAC1 — митохондриялардың сыртқы мембранасындағы ақуыздық арна, ол метаболиттердің тасымалдануын реттейді; оның бақылаусыз мультимеризациясы жасушаның энергетикалық алмасуын бұзады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"metabolikalykh-disfunkciya-zhaene-bauyr-aurularynyng-oershui\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#metabolikalykh-disfunkciya-zhaene-bauyr-aurularynyng-oershui\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Метаболикалық дисфункция және бауыр ауруларының өршуі&lt;/span&gt;&lt;/a&gt;Метаболикалық дисфункция және бауыр ауруларының өршуі&lt;/h4&gt;\n&lt;p&gt;Метаболикалық қауымдастырылған стеатотикалық бауыр ауруы (MASLD), бұрын NAFLD деп аталған, әлем халқының 30%-ына дейін әсер ететін ең көп таралған созылмалы бауыр ауруы болып табылады. Патология қалыпты стеатоздан (MASL) қабыну, митохондриялық дисфункция, эндоплазмалық тор стрессі және фиброзбен сипатталатын стеатогепатит (MASH) спектріне дейін ауытқиды, бұл цирроз бен гепатоцеллюлярлы карцинома қаупін айтарлықтай арттырады. Қарапайым стеатоздың MASH-қа өту механизмдері бауыр метаболизмі саласындағы шешілмеген негізгі мәселе болып қала береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стеатоздан MASH-қа өту қабыну процестерімен байланысты, мұнда айналымдағы лейкоциттердің 50–70%-ын құрайтын нейтрофилдердің рөлі жеткіліксіз зерттелген, дегенмен олар қабыну кезінде тіндерге жаппай ену қабілетіне ие.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нейтрофилдер иммундық жүйенің алғашқы «жауапкерлері» болғанымен, олардың MASLD патогенезіндегі рөлі резидентті макрофагтарға қарағанда аз зерттелген. MASLD кезінде нейтрофилдер қан ағымынан бауыр тініне белсенді көшіп, қабынуды күшейтеді. Қорғаныс қызметтерін атқарғаннан кейін, бұл жасушалар бағдарламаланған өлімге ұшырап, α-дефензиндер 1–4 (HNP 1–4) бөледі. Адам ағзасында тәулігіне 10–15 мг/кг дене салмағына өндірілетін бұл катионды пептидтер дәстүрлі түрде микробқа қарсы агенттер деп саналған. Алайда, олардың иммундық жауап аяқталғаннан кейінгі рөлі түсініксіз күйінде қалып отыр.&lt;/p&gt;\n&lt;h4 id=\"defenzinder-zhaene-mitohondriyalykh-disfunkciya\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#defenzinder-zhaene-mitohondriyalykh-disfunkciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дефензиндер және митохондриялық дисфункция&lt;/span&gt;&lt;/a&gt;Дефензиндер және митохондриялық дисфункция&lt;/h4&gt;\n&lt;p&gt;Бауыр ауруларындағы дефензиндердің рөлі туралы қолда бар деректер қайшылықты: кейбір зерттеулер HNP1-3 жоғары деңгейін фиброздың ауырлығымен байланыстырса, басқалары гиперхолестеринемия кезінде қорғаныс әсерін көрсетеді. Авторлар HNP жай ғана қабыну маркерлері ме, әлде гепатоциттерге әсер ететін белсенді патология қоздырғыштары ма деген сұрақты ортаға салады. Олардың ықтимал нысанасы — митохондрияның сыртқы мембранасындағы негізгі ақуыз VDAC1, ол метаболиттер мен Ca2+ иондарының тасымалдануына жауап береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VDAC1 (потенциалға тәуелді анионды арна 1) — бұл митохондрияның «қақпасы»; оның олигомеризациясы (молекулалардың жабысуы) органелла жұмысын бұзады, бұл жасуша өліміне және метаболикалық ақауларға әкеледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жұмыста HNP-дің стеатозбен корреляциясын талдау үшін бауыр гемангиомасы бойынша ота жасалған науқастардың бауыр биопсиясының үлгілері пайдаланылды. HNP1-трансгенді тышқандардағы зерттеулер жоғары майлы диета кезінде оларда стеатогепатит пен семіздік дамитынын, ал стандартты жемде фенотиптің көрінбейтінін көрсетті. VDAC1 олигомеризациясын блоктайтын ауызша қабылданатын продәрілік затты қолдану бұл әсерлерді жояды. Осылайша, «нейтрофилді дефензиндер — VDAC1» осі гепатоциттер липидтермен артық жүктелген кезде MASLD өршуінің шешуші буыны болып табылады.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"bauyrdaghy-hnp-denggejining-zhogharylauy-klinikalykh-pacientterdegi-bauyr-steatozynyng-auyrlyghymen-tyghyz-korrelyaciyada\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#bauyrdaghy-hnp-denggejining-zhogharylauy-klinikalykh-pacientterdegi-bauyr-steatozynyng-auyrlyghymen-tyghyz-korrelyaciyada\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бауырдағы HNP деңгейінің жоғарылауы клиникалық пациенттердегі бауыр стеатозының ауырлығымен тығыз корреляцияда&lt;/span&gt;&lt;/a&gt;Бауырдағы HNP деңгейінің жоғарылауы клиникалық пациенттердегі бауыр стеатозының ауырлығымен тығыз корреляцияда&lt;/h4&gt;\n&lt;p&gt;Нейтрофилдер бөлетін альфа-дефензиндердің негізгі бөлігін HNP 1-3 құрайды, ал HNP4 өте аз мөлшерде экспрессияланады (Rasm S1). HNP 1-3-тің бауыр стеатозындағы клиникалық маңызын бағалау үшін бауыр гемангиомасымен операция жасалған 29 пациенттен биопсия алынды. Тіндер Oil Red O (ORO) боялу ауданына қарай топтарға бөлінді: стеатозсыз (&amp;lt;5%, n=8), жеңіл стеатоз (5-33%, n=14) және ауыр стеатоз (&amp;gt;33%, n=7). Гистопатологиялық талдау (H&amp;amp;E, ORO, Массон трихромы, Sirius red) стеатоз өршіген сайын баллонды дистрофия мен макровезикулярлы стеатоз белгілері артатынын көрсетті (Rasm S2a-b), бұл NAFLD белсенділік балдарының (NAS) және фиброздың өсуімен расталады (Rasm S2c-d). Sirius red бояуы IV типті коллагеннің жинақталуын көрсетті, ал ауыр стеатоз кезінде I типті коллагеннің көбеюі байқалды, бұл цирроз қаупін болжайды (Rasm S2a, S2e).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ауыр стеатоз кезінде бауырдағы HNP 1-3 деңгейі бақылау топтарына қарағанда айтарлықтай жоғары және стеатоз ауданымен (P &amp;lt; 0.0001, R2 = 0.8579), NAS (P &amp;lt; 0.0001, R2 = 0.6611) және фиброзбен (P &amp;lt; 0.0001, R2 = 0.6038) тығыз корреляцияда.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Иммуногистохимиялық (ИГХ) талдау ауыр стеатоз тобында үлгілердің 57,1%-ы күшті және 42,9%-ы орташа оң нәтиже бергенін, ал стеатозсыз топта 100% үлгілер әлсіз оң болғанын көрсетті (Rasm 1b, Rasm S2f). Транскриптомикалық талдау дифференциалды экспрессияланатын гендер (DEG) санының 216-дан (стеатозсыз vs жеңіл) 2639-ға дейін (стеатозсыз vs ауыр) өскенін анықтады (Rasm 1e). Ауыр стеатоз кезінде липидтер тасымалы, метаболизм, фиброз және қабыну жолдары белсендіріліп, P450 гендері төмендеген (Rasm 1f). Липид алмасу гендері (Apoe, Cd36, Fbp1, Slc27a2, Acaca, Acly, Dgat2, Srebf2, Acot7, Acsl4, Plin2, Pnpla4) HNP деңгейімен корреляцияланған (Rasm 1g-j).&lt;/p&gt;\n&lt;h4 id=\"hnp1-transgendi-tyshkhandar-zhoghary-majly-dietada-masld-damuyna-bejim\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#hnp1-transgendi-tyshkhandar-zhoghary-majly-dietada-masld-damuyna-bejim\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HNP1 трансгенді тышқандар жоғары майлы диетада MASLD дамуына бейім&lt;/span&gt;&lt;/a&gt;HNP1 трансгенді тышқандар жоғары майлы диетада MASLD дамуына бейім&lt;/h4&gt;\n&lt;p&gt;Тышқандарда нейтрофилдер дефензиндер бөлмейтіндіктен, &lt;a href=\"concepts/crispr-cas9.html\"&gt;CRISPR-Cas9&lt;/a&gt; және нейтрофилді эластаза промоторын қолданып, HNP1 трансгенді (&lt;a href=\"concepts/hnp1tg.html\"&gt;HNP1TG&lt;/a&gt;) тышқандар жасалды. DEFA1 гені енгізілгеннен кейін (Rasm S3), 6 апталық еркек HNP1TG және жабайы типтегі (WT) тышқандар 12 апта бойы жоғары майлы диетамен (HFD) қоректендірілді (Rasm 2a). Азық тұтыну бірдей болғанына қарамастан (Rasm S4a), HNP1TG тышқандары тезірек салмақ жинады (Rasm 2b, S4b), бұл дене мен бауыр көлемінің ұлғаюына әкелді (Rasm 2c). Трансгенді тышқандар 4, 8 және 12-апталарда WT бақылау тобына қарағанда сәйкесінше 14,7%, 18,1% және 10,6%-ға ауыр болды (Rasm 2d). Бақылау диетасында (CFD) фенотиптік айырмашылықтар байқалмады (Rasm S5a-d).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Трансгенді тышқандар — генетикалық инженерия арқылы белгілі бір ген енгізілген немесе өзгертілген жануарлар.&lt;br /&gt;\n[!warning] Зерттеу HNP1-дің метаболизмге әсерін көрсеткенімен, адамдардағы иммундық жүйенің ерекшеліктеріне байланысты нәтижелерді сақтықпен түсіндіру керек.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"bauyr-men-maj-tinderindegi-patologiyalykh-oezgerister\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#bauyr-men-maj-tinderindegi-patologiyalykh-oezgerister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бауыр мен май тіндеріндегі патологиялық өзгерістер&lt;/span&gt;&lt;/a&gt;Бауыр мен май тіндеріндегі патологиялық өзгерістер&lt;/h4&gt;\n&lt;p&gt;Жоғары майлы диетада (HFD) 12 апта бойы ұсталған тышқандар түні бойы аш қалдырылғаннан кейін эвтаназияланды. HNP1TG трансгендік тышқандарында бауыр стеатозының айқын белгілері: гепатоциттердің баллонды дистрофиясы, макровезикулярлық майлану және қабыну инфильтрациясы байқалды (2e-сурет). Жартылай сандық талдау бұл патологиялық маркерлердің айтарлықтай күшейгенін растады (2f-h суреттері). Сонымен қатар, дене және бауыр салмағы артты (2i-j суреттері), бұл ретте бауыр индексі (бауыр салмағының дене салмағына қатынасы) трансгендік дараларда WT бақылау тобына қарағанда кемінде екі есе жоғары болды (2k-сурет). Қызығы, HNP1TG тышқандарында эпидидимальды май тінінің (EAT) салмағы шамамен 25%-ға төмендеген (SN c-d суреттері).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HNP1TG тышқандарында бауыр индексі екі есе артуымен және май тінінің 25%-ға азаюымен сипатталатын ауыр бауыр стеатозы дамыды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;EAT май тінінде адипоциттердің үлкеюі және «тәж тәрізді құрылымдардың» (CLS) пайда болуы анықталды, бұл липид алмасуының жүйелі қайта құрылуы мен созылмалы қабынудан хабар береді (SN e-g суреттері). Клиникалық тұрғыдан, барлық HNP1TG тышқандарында MASH сатысы (NAS &amp;gt; 5) дамыды, ал WT тышқандарында мұндай жағдай байқалмады (SN h-суреті). Трансгендік тышқандар бауырында фиброз талшықтары кесіндінің шамамен 9% аумағын алып жатса, WT тышқандарында фиброз іс жүзінде анықталмады (SN i-j суреттері).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MASH (метаболикалық қауымдасқан стеатогепатит) — бауыр қабынуы мен жасушалардың зақымдануымен жүретін бауыр майлануының прогрессивті түрі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"metabolikalykh-buzylystar-zhaene-omikstik-taldau\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#metabolikalykh-buzylystar-zhaene-omikstik-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Метаболикалық бұзылыстар және омикстік талдау&lt;/span&gt;&lt;/a&gt;Метаболикалық бұзылыстар және омикстік талдау&lt;/h4&gt;\n&lt;p&gt;HNP1TG тышқандарында қан сарысуы мен бауырдағы триглицеридтер мен холестерин деңгейінің жоғары екендігі (2l-m суреттері), бауырдың зақымдану белгілерімен бірге анықталды (SN k-l суреттері). HNP1TG тышқандарында аш қарынға қан глюкозасы 50%-ға өсті (SN m-суреті). Глюкозаға төзімділік тесті (GTT) глюкозаны реттеу қабілетінің төмендегенін (2n-сурет) және инсулинге төзімділіктің дамығанын көрсетті (SN n-o суреттері). Бақылау диетасында (CFD) топтар арасында айтарлықтай айырмашылықтар байқалмады (SN e-t суреттері).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тышқандар моделінде жүргізілген, сондықтан нәтижелерді адам метаболизміне тікелей көшіруде сақтық таныту қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бауырдың транскриптомикалық және метаболомикалық талдауы HNP1TG және WT топтары арасында негізгі компоненттер талдауы (&lt;a href=\"concepts/pca.html\"&gt;PCA&lt;/a&gt;) бойынша айқын айырмашылықтарды көрсетті (SN 6-сурет). Липид алмасуы гендеріндегі өзгерістерден бөлек (2o-сурет), трансгендік тышқандарда холестерин мен триглицеридтердің ұзын тізбекті түрлері көбейген. Бұл май қышқылдарын митохондрияға тасымалдайтын L-карнитин көлік жүйесінің бұзылғанын білдіреді (2p-q суреттері). Нәтижелер HNP1 экспрессиясының MASLD дамуына бейімділіктің негізгі факторы екенін растайды.&lt;/p&gt;\n&lt;h4 id=\"hnp1-gepatocitterde-lipidterding-zhinaluyna-ykhpal-etetin-mitohondriyalykh-disfunkciyany-tudyrady\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#hnp1-gepatocitterde-lipidterding-zhinaluyna-ykhpal-etetin-mitohondriyalykh-disfunkciyany-tudyrady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HNP1 гепатоциттерде липидтердің жиналуына ықпал ететін митохондриялық дисфункцияны тудырады&lt;/span&gt;&lt;/a&gt;HNP1 гепатоциттерде липидтердің жиналуына ықпал ететін митохондриялық дисфункцияны тудырады&lt;/h4&gt;\n&lt;p&gt;HNP1-дің бауыр стеатозының дамуындағы зиянды рөлін in vitro зерттеу үшін BNL CL.2 тышқан гепатоциттері желісі, бастапқы тышқан гепатоциттері және THLE-2 адам гепатоциттері желісі қолданылған липотоксикалық модель жасалды. Жасушалар 0,5 мМ пальмитин қышқылымен (FFA) инкубацияланды (3a-сурет). Тәжірибелер көрсеткендей, 4 мкМ HNP1 қосу барлық үш жасуша түрінде липидтердің жиналуын айтарлықтай арттырды, ал сызықтық L-HNP1 пептиді бірдей концентрацияда мұндай әсер көрсетпеді (3b-c-суреттер). Бұл HNP1-дің липидтердің жиналуын күшейту қабілеті оның құрылымына байланысты екенін білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HNP1 липотоксикалық стресс жағдайында гепатоциттерде липидтердің жиналуын күшейтеді, бұл әсер пептидтің құрылымдық ерекшеліктеріне тікелей тәуелді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Молекулалық механизмдерді түсіну үшін 4 мкМ HNP1 әсеріндегі бастапқы тышқан гепатоциттеріне RNA-seq талдауы жүргізілді. Тек FFA-мен өңделген жасушалардың транскрипция профилі бақылау тобына жақын болды, ал FFA және HNP1 бірге қолданылғанда иммунометаболикалық жолдардың бұзылуы байқалды (S7a-сурет). GO талдауы липид алмасуы, энергия гомеостазы және қабынумен байланысты гендер экспрессиясының өзгергенін көрсетті (S7b-сурет). Желілік талдау бұл өзгерістерді MASLD және митохондриялық процестермен (иондық арналар мен ақуыз кешендері) байланыстырды (S7c-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RNA-seq — жасушадағы барлық гендердің белсенділігін бір уақытта бағалауға мүмкіндік беретін әдіс, ал GO-талдау бұл гендерді биологиялық функцияларына қарай топтастырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Катионды амфифильді молекула ретінде HNP1 теріс зарядталған митохондриялық мембраналармен өзара әрекеттесе алады. FAM-мен белгіленген HNP1 жасуша ішіне еніп, митохондриялармен колокализацияланатыны расталды (3d-сурет). 12 апта бойы жоғары майлы диета (HFD) алған HNP1TG тышқандарының бауыр тіндерінің электронды микроскопиясы (TEM) митохондриялардың айтарлықтай зақымданғанын: кристалардың жойылуын, өлшемдерінің кішірейуін және фрагментацияны көрсетті (3e-сурет, S8a-сурет). Дәл осындай өзгерістер стеатозы бар науқастардың (n = 6) үлгілерінде де анықталды (3f-сурет, S8b-сурет). Бұл нәтижелер HNP1-дің тікелей митохондрияларға әсер етіп, стеатозға тән дисфункцияны тудыратынын дәлелдейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу жасушалық желілер, трансгенді тышқандар және шектеулі клиникалық үлгілер деректеріне негізделген, сондықтан нәтижелерді адам патологиясының барлық түрлеріне толық қолдануда сақтық таныту қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;HNP1 VDAC1-тің N-терминалды спиральді доменін нысанаға алып, оның олигомеризациясын ынталандырады және гепатоциттердегі липид алмасуының бұзылуына әкеледі.&lt;/p&gt;\n&lt;p&gt;Альфа-дефензиндер иммундық жауапты реттеу үшін әртүрлі молекулалық нысаналармен, соның ішінде мембраналық рецепторлармен әрекеттеседі. Митохондриядағы HNP1 нысанын анықтау үшін авторлар VDAC1 ақуызына назар аударды. Транскриптомикалық талдау потенциалға тәуелді иондық арналардың реттелуімен байланысты жолдардың байығанын көрсетті (Сурет SN). HNP1 мен VDAC1-дің науқастардың бауыр тіндерінде бірге орналасуы (кокализация) анықталды (Сурет 4a). Тазартылған VDAC1 (N-терминалды спиральді домені бар β-бөшкелі ақуыз, Сурет 4b) FAM-белгіленген HNP1-мен флуоресценция поляризациясы әдісімен тексерілді. HNP1-дің VDAC1-мен &lt;a href=\"concepts/k-d.html\"&gt;K_d&lt;/a&gt; = 83,4 нМ болатын жоғары аффиндікпен байланысатыны расталды (Сурет 4c).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise-f4.jpg\" alt=\"4-сурет. HNP1 гепатоциттердегі липидтер метаболизмінің бұзылуына әкелетін олигомеризацияны ынталандыру үшін VDAC1-дің N-\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет. HNP1 гепатоциттердегі липидтер метаболизмінің бұзылуына әкелетін олигомеризацияны ынталандыру үшін VDAC1-дің N-терминалды спиральді доменін нысанаға алады.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-сурет. HNP1 гепатоциттердегі липидтер метаболизмінің бұзылуына әкелетін олигомеризацияны ынталандыру үшін VDAC1-дің N-терминалды спиральді доменін нысанаға алады. (a) Бауыр стеатозы бар немесе жоқ клиникалық пациенттердің бауыр кесінділерінің иммунофлуоресцентті суреттері. Көк, ядро; жасыл, VDAC1; қызыл, HNP1. Масштабты сызық: 100 мкм. (b) Адам VDAC1 кристалдық құрылымы (PDB: 6G6U). (c-d) Флуоресцентті поляризациямен бағаланған HNP1-дің толық ұзындықтағы адам VDAC1 (c) және 26-аминқышқылды VDAC1 N-терминалды пептиді (d) мен байланысу жақындығы. Деректер үш биологиялық қайталанымнан орташа ± SEM ретінде ұсынылған. (e) VDAC1 олигомеризациясы нәтижесінде туындайтын механикалық және функционалдық нәтижелердің схемалық диаграммасы. (f) Тазартылған адам VDAC1-дің HNP1 арқылы қоздырылған олигомеризациясы электрофорез кезінде олигомерлерді тұрақтандыру үшін EGS өзара байланыстырушы реагентімен өңделгеннен кейін иммуноблоттинг көмегімен визуализацияланды. (g) 0,5 мМ пальмитин қышқылы, 4 мкМ HNP1 немесе 20 мкМ &lt;a href=\"concepts/vbit-12.html\"&gt;VBIT-12&lt;/a&gt; болған немесе болмаған жағдайда тышқан бастапқы гепатоциттеріндегі VDAC1 олигомеризациясы иммуноблоттинг көмегімен визуализацияланды. (h) HNP1 өзінің N-терминалды доменімен өзара әрекеттесу арқылы VDAC1 олигомеризациясын ынталандыратын ұсынылған модельдің схемалық диаграммасы. (i) 4 мкМ HNP1 және/немесе 20 мкМ VBIT-12 болған немесе болмаған жағдайда 0,5 мМ пальмитин қышқылымен өңделген ORO-мен боялған гепатоциттердің өкілді суреттері. Масштабты сызық, 100 мкм. (j) ORO-оң аймақ пайыздары негізінде гепатоциттердегі липидтердің жиналуын жартылай сандық талдау (n = 3 &lt;a href=\"concepts/biological-replicate.html\"&gt;биологиялық қайталаным&lt;/a&gt;). Деректер орташа ± SD ретінде көрсетілген. Статистикалық маңыздылық көптік салыстырулар үшін Бонферрони түзетуімен бір факторлы дисперсиялық талдау арқылы талданды. (k) Бақылау ретінде тасымалдаушы болған жағдайда, 4 мкМ HNP1 немесе 4 мкМ HNP1 плюс 20 мкМ VBIT-12-мен FFA-мен өңделген немесе өңделмеген (бос) Hoechst (апоптоз) және TMRE (митохондриялық потенциал) боялған гепатоциттердің өкілді суреттері. Ақ көрсеткілер, апоптотикалық гепатоциттер. Қара көрсеткілер, мембраналық потенциал деполяризациясы бар гепатоциттер. Масштабты сызық: 50 мкм. (l-m) Гепатоциттердегі Hochest (l) және TMRE (m) флуоресцентті қарқындылығын жартылай сандық талдау (n = 3 биологиялық қайталаным). Деректер орташа ± SD ретінде көрсетілген. Статистикалық маңыздылық көптік салыстырулар үшін Бонферрони түзетуімен бір факторлы дисперсиялық талдау арқылы талданды. (n) Әртүрлі емдеу әдістерімен гепатоциттердегі липогенез және липидтер катаболизмімен байланысты гендердің транскрипциялық деңгейлері. Салыстырмалы mRNA деңгейлері 2-ΔΔCT математикалық моделіне сәйкес бос бақылауларға қатысты сандық анықтау ретінде есептелді. Қорытынды деректер Z-баллмен нормаланды және микрочипті жылу картасында Z-балл ретінде көрсетілді. Әр топ үшін n = 3 биологиялық қайталаным.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HNP1 VDAC1-пен K_d = 83,4 нМ аффиндікпен тікелей байланысады және оның N-терминалды спиральді доменін нысанаға алады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Байланысу орнын анықтау үшін N-терминалды спиральді доменді қамтитын 26 аминқышқылдық NTP пептиді қолданылды. HNP1 NTP-мен K_d = 161 нМ аффиндікпен байланысты (Сурет 4d). VDAC1 тотығу стрессі жағдайында олигомеризацияға бейім келіп, митохондрияның сыртқы мембранасында Ca²⁺, мтДНҚ, цитохром c және АФК тасымалдауға арналған арналар түзеді (Сурет 4e). Бұл процестер липоапоптоз бен инсулинге төзімділікке әкеледі. HNP1-дің VDAC1 димерлері, тримерлері және жоғары ретті мультимерлерінің түзілуін күшейтетіні in vitro жағдайында расталды (Сурет 4f). 0,5 мМ FFA және 4 мкМ HNP1 бар тышқан гепатоциттерінде VDAC1 олигомеризациясы күшейді, бұл VBIT-12 ингибиторы арқылы жойылды (Сурет 4g-h).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VBIT-12 — VDAC1 олигомеризациясын блоктайтын арнайы ингибитор, ол митохондриялық дисфункцияның алдын алу үшін қолданылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ТЭМ әдісімен 0,5 мкМ концентрацияда HNP1 және NTP қоспасының ірі олигомерлер түзетіні көрсетілді (Сурет SN). Динамикалық жарық шашырату (DLS) әдісі 0,1, 0,5, 2,5 және 12,5 мкМ концентрацияларда гидродинамикалық диаметрдің (d_h) дозаға тәуелді өсуін растады (Сурет SN). VBIT-12 HNP1 тудырған стеатоз, апоптоз және мембраналық потенциалдың деполяризациясын тиімді төмендетті (Сурет 4i-m). RT-qPCR талдауы HNP1-дің FFA қатысуымен липид катаболизмі гендерін төмендететінін және липогенез гендерін күшейтетінін көрсетті, ал VBIT-12 бұл профильді қалпына келтірді (Сурет 4n).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тышқан гепатоциттері мен in vitro модельдерінде жүргізілген, сондықтан нәтижелерді in vivo жағдайында сақтықпен түсіндіру қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"hnp1-zhaene-vdac1-oezara-aerekettesuining-khurylymdykh-negizderi\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#hnp1-zhaene-vdac1-oezara-aerekettesuining-khurylymdykh-negizderi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HNP1 және VDAC1 өзара әрекеттесуінің құрылымдық негіздері&lt;/span&gt;&lt;/a&gt;HNP1 және VDAC1 өзара әрекеттесуінің құрылымдық негіздері&lt;/h4&gt;\n&lt;p&gt;HNP1-дің VDAC1-дің N-терминалды спиральді доменімен өзара әрекеттесуін зерттеу үшін 15N-белгіленген NTP пептиді қолданылды (Rasm SN). Талдау 2D 1H-15N гетероядролық бір квантты корреляциялық (HSQC) ЯМР-спектроскопиясы әдісімен жүргізілді. 10 мМ фосфатты буферде (PB) NTP 7,3–9,0 м.д. диапазонында шыңдары бар α-спиральді конформацияны көрсетті. HNP1-ді NTP-ге 0,2:1 молярлық қатынаста қосқанда бірқатар резонанстық шыңдардың әлсіреуі мен ығысуы байқалды (Rasm 5a). 40% трифторэтанол (TFE) қатысуымен шыңдар дисперсті бола түсті, бұл α-спиральділіктің күшеюін білдіреді; бұл жағдайда HNP1 сигналдың өшуіне емес, химиялық ығысуларға әкелді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HSQC ЯМР әдісі атом ядроларының химиялық ортасындағы өзгерістерді бақылауға мүмкіндік береді, бұл байланысуға қатысатын молекула бөліктерін анықтауға көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ақуыздар арасындағы өзара әрекеттесу 0,2% натрий додецилсульфатын (SDS) қосқанда толығымен тоқтады, бұл HNP1 бар және жоқ кездегі NTP спектрлерінің толық сәйкес келуімен расталды (Rasm 5a). 200 мкМ NTP-ді 0,5, 1 немесе 2 эквивалент HNP1-мен титрлеу кезінде A2, V3, T6, A8, L10, K12, S13, A14, V17 және T19 қалдықтары үшін сигналдар қарқындылығының дозаға тәуелді төмендеуі байқалды, бұл HNP1 әсерінен NTP олигомеризациясын көрсетеді (Rasm 5b). Ең маңызды ығысулар A2, V3, T6, A14 және V17 үшін тіркелді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ЯМР талдауы VDAC1 N-терминалды доменінің HNP1-мен байланысуына қажетті маңызды қалдықтарды анықтады, бұл процесс дозаға тәуелді және пептидтің олигомеризациясына әкеледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Деректерді растау үшін 200-нс молекулалық динамика (МД) модельдеуі жүргізілді. MM/GBSA әдісі бойынша есептеулер HNP1-дің C-терминалды қалдықтары байланысу энергиясына ең үлкен үлес қосатынын және Trp26 негізгі рөл атқаратынын растады. W26A-HNP1 мутантты аналогымен жүргізілген эксперименттік тексеру флуоресценция поляризациясы сынағында NTP-мен байланысудың айтарлықтай әлсірегенін көрсетті. Тышқандардың бастапқы гепатоциттеріндегі тәжірибелерде W26A мутациясы дефензин тудыратын липидтердің жиналуын айтарлықтай төмендетті, бұл Trp26 қалдығының функционалдық маңыздылығын растайды (Rasm 5e-i).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу оқшауланған пептидтер мен бастапқы жасуша дақылдарында жүргізілгендіктен, нәтижелерді күрделі организм процестеріне экстраполяциялауда сақтық таныту қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vbit-12-prodaerisin-ishke-khabyldau-hfd-men-khorektengen-hnp1tg-tyshkhandarynda-maslzh-damuyna-zhol-bermejdi\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#vbit-12-prodaerisin-ishke-khabyldau-hfd-men-khorektengen-hnp1tg-tyshkhandarynda-maslzh-damuyna-zhol-bermejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;VBIT-12 продәрісін ішке қабылдау HFD-мен қоректенген HNP1TG тышқандарында МАСЛЖ дамуына жол бермейді&lt;/span&gt;&lt;/a&gt;VBIT-12 продәрісін ішке қабылдау HFD-мен қоректенген HNP1TG тышқандарында МАСЛЖ дамуына жол бермейді&lt;/h4&gt;\n&lt;p&gt;VBIT-12-нің липидтердің жиналуын азайтудағы in vitro белсенділігіне сүйене отырып, біз «HNP1-VDAC1 олигомерлену» осіне әсер етудің жаңа терапевтік парадигмасын растау үшін оның in vivo тиімділігін тексердік. Ішке қабылдауды жеңілдету үшін біз VBIT-12-дегі бос карбоксил тобын эфирлеу арқылы VBIT-12 продәрісін (VBIT-12pro) синтездедік (Сурет S12). Бұл модификация липофильділікті арттырып, молекуланың ішек мембраналары арқылы өтіп, бауырға тиімді сіңуін қамтамасыз етті, онда эндогенді карбоксилэстеразалар эфир байланысын үзіп, белсенді VBIT-12-ні босатады. Сурет S13-те көрсетілгендей, VBIT-12 және әсіресе VBIT-12pro 100 мкМ ең жоғары концентрацияда THLE-2 және BNL CL.2 жасушалық желілеріне қатысты цитотоксикалық әсер көрсетпеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Продәрі — бұл ағзада метаболикалық өзгерістер нәтижесінде белсенді түрге айналатын дәрілік заттың модификацияланған түрі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Алты апта бойы HFD (жоғары майлы диета) алған HNP1TG тышқандарына келесі 6 апта ішінде күн сайын 20 мг/кг VBIT-12pro ішке немесе 20 мг/кг VBIT-12 іш қуысына инъекция ретінде берілді (бақылау топтарымен салыстырғанда) (Сурет 6a). Алғашқы 6 аптада барлық топтар бірдей жылдамдықпен салмақ қосты (Сурет 6b және Сурет S14a-b, S15a). Алайда, емдеу басталғаннан кейін VBIT-12 немесе VBIT-12pro топтарында салмақ қосу айтарлықтай баяулады (Сурет S14c және S15b). 8 және 12 апталық HFD-ден кейін VBIT-12pro қабылдаған тышқандардың дене салмағы бақылау тобына қарағанда сәйкесінше 8,65% және 13,8%-ға төмен болды (Сурет 6c).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise-f6.jpg\" alt=\"6-сурет. VBIT-12 про-дәрісін ауыз арқылы енгізу арқылы HNP1TG тышқандарындағы MASLD ауруын жеңілдету.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сурет. VBIT-12 про-дәрісін ауыз арқылы енгізу арқылы HNP1TG тышқандарындағы MASLD ауруын жеңілдету.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;6-сурет. VBIT-12 про-дәрісін ауыз арқылы енгізу арқылы HNP1TG тышқандарындағы MASLD ауруын жеңілдету. (a) HNP1TG тышқандарында MASLD-ға қарсы VBIT-12 және VBIT-12pro-ның in vivo тиімділігін бағалауға арналған эксперименттік дизайн. Салмағы 21-23 г болатын алты апталық еркек HNP1TG C57BL/6J тышқандары 6 апта бойы дәрі-дәрмексіз жоғары майлы диетамен (HFD) қоректендірілді, содан кейін келесі 6 апта ішінде күнделікті ішпердеішілік инъекция (i.p.) арқылы VBIT-12 немесе 20 мг/кг дозада ауыз арқылы (p.o.) VBIT-12pro берілді, содан кейін олар өлтіріліп, терең талдау үшін тіндері алынды. (b) HFD-мен қоректенген және тасымалдаушы немесе VBIT-12pro-мен емделген HNP1TG тышқандарының апталық дене салмағы (n = 6 тышқан әр топта). (c) 0, 4, 8 және 12-апталарда тасымалдаушы және VBIT-12pro-мен емделген HNP1TG тышқандарының дене салмағының жиынтық деректері мен статистикалық салыстырулары. (d) 12 апталық HFD диетасынан кейін тасымалдаушы немесе VBIT-12pro-мен емделген HNP1TG тышқандарының (төменде) және олардың бауырының (жоғарыда) өкілдік фотосуреттері. (e-g) 12 апталық HFD диетасынан кейін тасымалдаушы және VBIT-12pro-мен емделген HNP1TG тышқандарының дене салмағы (e), бауыр салмағы (f) және бауыр салмағының дене салмағына қатынасы (g) (n = 6 тышқан әр топта). (h-i) 12 апталық HFD диетасынан кейін тасымалдаушы және VBIT-12pro-мен емделген HNP1TG тышқандарының сарысуындағы (h) және бауырындағы (i) триглицерид пен холестерин деңгейлері (n = 6 тышқан әр топта). (j) H&amp;amp;E және ORO-мен боялған тышқан бауырының кесінділері мен H&amp;amp;E-мен боялған EAT кесінділерінің өкілдік суреттері. Масштабты сызғыш: 100 мкм. (k) ImageJ көмегімен әр кесінді үшін үш аймақ негізінде ORO-оң аймақтың пайыздық мөлшерін (сол жақта), баллондалған гепатоциттерді (ортасында) және макровезикулярлы майлы гепатоциттерді (оң жақта) сандық талдау (n = 6 тышқан әр топта). (l) 12 апталық HFD диетасынан кейін тасымалдаушы немесе VBIT-12pro-мен емделген HNP1TG тышқандары бауырының NAFLD белсенділік көрсеткіші (NAS) (n = 6 тышқан әр топта). (m) ImageJ көмегімен әр кесінді үшін үш аймақ негізінде EAT кесінділеріндегі адипоциттер санын есептеу (n = 6 тышқан әр топта). (n) Тасымалдаушы және VBIT-12pro-мен емделген HNP1TG тышқандарының H&amp;amp;E-мен боялған EAT кесінділеріндегі адипоциттер аймағын сандық талдау (сәйкесінше 305 және 510 адипоцит өлшенген). (o-p) HFD-мен қоректенген және тасымалдаушы немесе VBIT-12pro-мен емделген HNP1TG тышқандары бауырындағы гепатоцит митохондриялары мен липидті тамшылардың өкілдік TEM суреттері (o) және олардың TEM суреттері негізінде митохондриялық параметрлерді сандық талдау (p). (q) 12 апта бойы HFD-мен қоректенген және соңғы 6 апта ішінде күнделікті тасымалдаушы немесе VBIT-12pro-мен емделген HNP1TG тышқандарының сарысуындағы аш қарынға қандағы глюкоза деңгейлері. Барлық деректер орташа ± стандартты ауытқу (SD) ретінде көрсетілген. Статистикалық маңыздылық жұпталмаған, 2-жақты Стьюдент t-тесті арқылы талданды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VBIT-12pro терапиясы тышқандардың дене салмағын 13,8%-ға, бауыр салмағын бақылау тобымен салыстырғанда 3 есеге азайтып, МАСЛЖ дамуын тоқтатты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Емдеу бауыр көлемін қалыпқа келтірді (Сурет 6d және S14d). 6 апталық емдеуден кейін VBIT-12pro қабылдаған тышқандардың дене салмағы 14%-ға төмендеді (Сурет 6e), ал бауыр салмағы бақылау тобының үштен бірін құрады (Сурет 6f-g), сонымен бірге EAT тіндері 46%-ға артты (Сурет S15c-d). Қан сарысуы мен бауырдағы триглицерид және холестерин деңгейлері төмендеді, бұл ALT және AST деңгейлерінің төмендеуімен расталған бауыр зақымдануының азайғанын көрсетеді (Сурет S15e-f).&lt;/p&gt;\n&lt;p&gt;VBIT-12pro-ны ішке қабылдау баллондалған гепатоциттер мен макровезикулярлы стеатозды айтарлықтай азайтты (Сурет 6j-k). Бақылау тобындағы барлық тышқандарда МАСГ (NAS &amp;gt; 5) дамыса, VBIT-12pro ауруды МАСГ-дан МАСЛЖ-ға қайтарды (Сурет 6l). Сондай-ақ, EAT тіндерінде адипоциттердің кішірейгені байқалды (Сурет 6j, m және n). TEM суреттері бақылау тобында липидті тамшылар мен митохондриялық фрагментацияны көрсетті, ал VBIT-12pro тобында митохондриялар жақсы сақталған (Сурет 6o-p). Қандағы глюкоза деңгейі де қалыпқа келді (Сурет 6q). VBIT-12pro МАСЛЖ және басқа метаболикалық ауруларды емдеу үшін жаңа терапевтік құрал ретінде үлкен әлеуетке ие.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу генетикалық түрлендірілген тышқандарда жүргізілді; нәтижелер адамдарда клиникалық сынақтарды талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;h4 id=\"maslj-patogenezindegi-nejtrofildi-a-defenzinderding-roeli\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#maslj-patogenezindegi-nejtrofildi-a-defenzinderding-roeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MASLJ патогенезіндегі нейтрофильді α-дефензиндердің рөлі&lt;/span&gt;&lt;/a&gt;MASLJ патогенезіндегі нейтрофильді α-дефензиндердің рөлі&lt;/h4&gt;\n&lt;p&gt;Бауырға липидтердің шамадан тыс келуі Купфер жасушалары арқылы нейтрофилдердің тартылуына әкеледі, олардың тұрақты инфильтрациясы май алмасуының бұзылуына және гепатоциттердің өліміне ықпал етеді, бұл метаболикалық қауымдастырылған стеатотикалық бауыр ауруына (MASLJ) тән. Нейтрофилдер α-дефензиндерді азурофильді түйіршіктерде 10–50 мг/мл концентрацияда сақтайтыны белгілі болса да, олардың зақымдалған жасушалардан босап шыққаннан кейінгі тағдыры ұзақ уақыт белгісіз болды. Біз стеатозбен ауыратын науқастардың бауырында адам нейтрофильді пептидтерінің (HNP) деңгейі айтарлықтай жоғарылағанын анықтадық. Бұл пептидтер гепатоциттерге еніп, VDAC1 ақуызының мультимеризациясын тудырады, бұл митохондриялық дисфункцияға, липидтердің жиналуына және MASLJ өршуіне әкеледі. Бұл процесс VDAC1 мультимеризациясының ингибиторлары арқылы қайтымды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нейтрофильді α-дефензиндер (HNP) VDAC1 мультимеризациясы арқылы гепатоциттердің митохондрияларын зақымдап, MASLJ дамуында патологиялық фактор ретінде көрінеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біздің нәтижелеріміз іргелі маңызға ие. Біріншіден, дәстүрлі түрде қорғаныш антимикробтық факторлар ретінде қарастырылатын α-дефензиндер метаболикалық бұзылыстарда «екі жүзді қылыш» ретінде жұмыс істейді. Екіншіден, біз HNP митохондриялық дисфункция арқылы стеатозды күшейтетін каскадты іске қосатынын анықтадық. Үшіншіден, VDAC1 негізгі терапиялық нысанаға айналады. Төртіншіден, VBIT-12 ингибиторы негізінде біз MASLJ емдеуде in vitro және in vivo жоғары тиімділік көрсететін ауызша қабылданатын дәрілік үміткерді әзірледік.&lt;/p&gt;\n&lt;h4 id=\"defenzinder-men-katelicidinderding-patologiyalykh-koep-khyrlylyghy\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#defenzinder-men-katelicidinderding-patologiyalykh-koep-khyrlylyghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дефензиндер мен кателицидиндердің патологиялық көп қырлылығы&lt;/span&gt;&lt;/a&gt;Дефензиндер мен кателицидиндердің патологиялық көп қырлылығы&lt;/h4&gt;\n&lt;p&gt;Нейтрофильді α-дефензиндер басқа да патологиялық рөлдерді атқаруы мүмкін. Мысалы, HNP1 CCL5 хемокинімен гетеромерлер түзіп, тышқандарда миокард инфарктісі кезінде моноциттердің тартылуын күшейтеді. HNP1/HNP2 және HNP1/HNP3 трансгендік модельдерінде бұл пептидтер өкпе зақымдануына және эндотелий жасушаларының пироптозына әкеледі. Сонымен қатар, HNP-нің сублетальды концентрациялары A. baumannii биофильмдерінің қалыптасуына және Shigella инвазиясына ықпал етеді. Ішектегі α-дефензин 5 (HD5) үшін де ұқсас механизмдер сипатталған, ол OmpA ақуызы және P2Y11 рецепторымен өзара әрекеттесу арқылы бактериялық жабысуды жеңілдетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/piroptoz.html\"&gt;Пироптоз&lt;/a&gt; — бұл күшті қабыну жауабымен жүретін бағдарламаланған жасуша өлімінің түрі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HNP-нің патологиялық әсері бойынша деректердің көпшілігі трансгендік тышқандарда немесе инфекция модельдерінде алынған, сондықтан оларды адамға қолдануда сақтық қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;LL-37 пептиді де аутоиммундық процестерге (псориаз, жүйелі қызыл жегі) қатысады. LL-37 адамдарда семіздікпен байланысты болғанымен, оның рөлі қайшылықты: HNP-ден айырмашылығы, тышқандарда LL-37 гиперэкспрессиясы CD36 рецепторын тежеу арқылы бауыр стеатозын азайтады, бұл әртүрлі антимикробтық пептидтердің функционалдық ерекшелігін көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"vdac1-multimerlenuining-gepatocitter-metabolizmine-aeser-etu-mehanizmderi\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#vdac1-multimerlenuining-gepatocitter-metabolizmine-aeser-etu-mehanizmderi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;VDAC1 мультимерленуінің гепатоциттер метаболизміне әсер ету механизмдері&lt;/span&gt;&lt;/a&gt;VDAC1 мультимерленуінің гепатоциттер метаболизміне әсер ету механизмдері&lt;/h4&gt;\n&lt;p&gt;VDAC1-тің қалыптан тыс мультимерленуі митохондрия қызметін бұзып, гепатоциттерде липидтердің жиналуын күшейтеді. Біріншіден, бұл май қышқылдарының β-тотығуын тежеп, бауырдың артық энергияны кәдеге жарату қабілетін төмендетеді. Екіншіден, VDAC1 димерлері митохондрияның сыртқы мембранасы арқылы липидтерді тасымалдайтын скрамблаза қызметін атқарғандықтан, олардың шамадан тыс мультимерленуі мембрана гомеостазын бұзады. Үшіншіден, сыртқы мембрана өткізгіштігінің артуы mtDNK-ның шығуына және NLRP3-инфламмасоманың белсенуіне әкеледі, бұл стеатозды өршітеді. Pemt және BRD4 сияқты реттегіштер белгілі болғанымен, MASLD жағдайында VDAC1 мультимерленуінің тікелей молекулалық драйверлері әлі толық зерттелмеген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VDAC1 мультимерленуі β-тотығу мен мембрана гомеостазын бұзып, NLRP3-инфламмасоманы белсендіреді және бауыр стеатозын күшейтеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"hnp1-ting-mitohondriyalykh-dinamika-men-metabolizmge-aeseri\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#hnp1-ting-mitohondriyalykh-dinamika-men-metabolizmge-aeseri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HNP1-тің митохондриялық динамика мен метаболизмге әсері&lt;/span&gt;&lt;/a&gt;HNP1-тің митохондриялық динамика мен метаболизмге әсері&lt;/h4&gt;\n&lt;p&gt;Қалыпты жағдайда гепатоциттер митохондриялары үнемі қосылу және бөліну циклдарынан өтеді. MASLD дамуында бұл процесс бұзылады. 12 апта бойы жоғары майлы диета (HFD) алған HNP1TG тышқандарында митохондриялардың ультрақұрылымы айтарлықтай өзгерген (кристалардың жойылуы байқалған), бұл бақылау тобындағы (WT) тышқандарда байқалмады. Сонымен қатар, HNP1TG тышқандарында бауыр стеатозы күшейіп, эпикардиалды май тіні (EAT) азайды. Бұл ақ май тініндегі инсулинге төзімділік пен қабынуға байланысты болуы мүмкін, бұл глюкоза мен май қышқылдарын бауырға бағыттап, артық метаболикалық жүктеме тудырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HNP1TG — адамның нейтрофилді пептиді 1 (HNP1) экспрессиялайтын трансгенді тышқандар желісі, оның метаболизмге әсерін зерттеу үшін қолданылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zertteu-perspektivalary-zhaene-terapiyalykh-aeleuet\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#zertteu-perspektivalary-zhaene-terapiyalykh-aeleuet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу перспективалары және терапиялық әлеует&lt;/span&gt;&lt;/a&gt;Зерттеу перспективалары және терапиялық әлеует&lt;/h4&gt;\n&lt;p&gt;Нейтрофилді α-дефенсиндер мен митохондриялық дисфункция арасындағы байланыс бұл факторлардың иммунитеттен тыс метаболизмдегі маңызды рөлін көрсетеді. Болашақ зерттеулер мыналарға бағытталуы керек: 1) ЯМР-спектроскопия, рентгендік кристаллография және крио-электронды микроскопия көмегімен HNP әсерінен VDAC1 мультимерленуінің молекулалық негіздерін анықтау; 2) HNP1TG тышқандарында ұзақ мерзімді HFD көмегімен стеатоздың цирроз және гепатоцеллюлярлы карциномаға (HCC) өтуін бағалау; 3) басқа дефенсиндердің метаболикалық синдромдағы рөлін зерттеу. VDAC1 метаболикалық белсенді тіндерде кең таралғандықтан, VBIT-12pro сияқты мультимерлену ингибиторлары қатерлі ісік, нейродегенеративті және жүрек-қан тамыр ауруларын емдеуде жаңа терапиялық құрал болуы мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тышқандар моделінде жүргізілген; нәтижелерді адамдарға тікелей көшіруде сақтық таныту қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise-f1.jpg\" alt=\"1-сурет. Бауырдағы HNP1 инфильтрациясының жоғарылауы клиникалық пациенттердегі бауыр стеатозымен корреляцияланады.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Бауырдағы HNP1 инфильтрациясының жоғарылауы клиникалық пациенттердегі бауыр стеатозымен корреляцияланады.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет. Бауырдағы HNP1 инфильтрациясының жоғарылауы клиникалық пациенттердегі бауыр стеатозымен корреляцияланады. (a) Бауыр стеатозының әртүрлі ауырлық дәрежесіндегі адам бауырының кесінділеріндегі HNP деңгейлері мен таралуын көрсететін өкілді ИГХ суреттері. Масштабты сызық: 100 мкм. (b) Бауыр стеатозы жоқ (n = 8) немесе жеңіл (n = 14) және ауыр стеатозы бар (n = 7) пациенттердің бауыр кесінділерін ИГХ бағалау, сондай-ақ осы үлгілердегі ИГХ-оң аймақтар бойынша нормаланған HNP деңгейлерінің жартылай сандық талдауы. (c-d) Бауыр HNP деңгейлерінің стеатоз аймағымен (c) және НАЖБП белсенділік көрсеткіштерімен (d) корреляциялық талдауы. (e) Минималды, жеңіл және ауыр бауыр стеатозы топтарынан алынған клиникалық үлгілердегі дифференциалды экспрессияланатын гендерді (DEG) көрсететін көп жанартаулық графиктер. (f) Он алты адам бауыры үлгісіндегі липидтерді тасымалдау және метаболизмі, P450, фиброз және қабынумен байланысты гендердің экспрессиясының өзгеруін көрсететін RNA-seq профильдері, салыстырмалы HNP деңгейлері бағаналы диаграммалар түрінде қосылған. (g-j) Салыстырмалы HNP мазмұны мен липидтерді тасымалдау (g), липогенез (h), β-тотығу (i) және липидтердің жиналуы (j) арасындағы корреляцияны көрсететін шашырау диаграммалары. Детерминация коэффициенттері (R2) және P мәндері көрсетілген. Статистикалық маңыздылық көптік салыстырулар үшін Бонферрони түзетуімен бір факторлы дисперсиялық талдау арқылы есептелді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise-f2.jpg\" alt=\"2-сурет. HNP1 трансгенді тышқандарында MASLD-ге бейімділіктің жоғарылауы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет. HNP1 трансгенді тышқандарында MASLD-ге бейімділіктің жоғарылауы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сурет. HNP1 трансгенді тышқандарында MASLD-ге бейімділіктің жоғарылауы. (a) MASLD прогрессиясындағы HNP1 рөлін бағалауға арналған эксперименталды дизайн. MASLD-ні қоздыру үшін 12 апта бойы жоғары майлы диетамен (HFD) қоректенген, салмағы 21-23 г болатын алты апталық еркек WT және HNP1TG C57BL/6J тышқандары, содан кейін олар құрбан етілді және терең талдау үшін тіндер үлгілері жиналды. (b) HFD-мен қоректену кезінде апта сайын өлшенген WT және HNP1TG тышқандарының дене салмағы (топта n = 10 тышқан). (c) 12 апталық HFD-мен қоректенуден кейінгі WT және HNP1TG тышқандарының (төменде) және олардың бауырының (жоғарыда) өкілді фотосуреттері. (d) 0, 4, 8 және 12-апталардағы WT және HNP1TG тышқандары арасындағы дене салмағы және статистикалық салыстырулардың қысқаша мазмұны. (e) H&amp;amp;E және ORO-мен боялған тышқан бауыры кесінділерінің өкілді суреттері. Сұр, жасыл және қызыл көрсеткілер сәйкесінше қабыну инфильтрациясын, гепатоциттердің баллондануын (Ballooned.hep) немесе макровезикулярлы майды (Macroves.fat) көрсетеді. Масштабты сызық: 200 мкм. (f-h) ImageJ көмегімен жоғары үлкейту аймағында (HMF) баллонданған гепатоциттерді (f), ORO-оң аймақтың пайызын (g) және макровезикулярлы майы бар гепатоциттерді (h) сандық талдау, әр кесінді үшін үш аймақ негізінде (топта n = 6 тышқан). (i-k) 12 апталық HFD-мен қоректенуден кейінгі WT және HNP1TG тышқандарының дене салмағы (i), бауыр салмағы (j) және бауыр салмағы/дене салмағы қатынасы (k) (топта n = 6 тышқан). (l-m) 12 апталық HFD-мен қоректенуден кейінгі тышқандардың сарысуындағы (l) және бауырындағы (m) триглицерид пен холестерин деңгейлері (топта n = 6 тышқан). (n) 12 апта бойы HFD-мен қоректенуден кейінгі WT және HNP1TG тышқандарында глюкозаға төзімділік сынағы (сол жақ панель), қан глюкозасының қисық астындағы ауданның (&lt;a href=\"concepts/area-under-the-curve.html\"&gt;AUC&lt;/a&gt;) еселік өзгерістерімен (топта n = 6 тышқан) (оң жақ панель). (o) WT және HNP1TG тышқандарының бауырындағы липидтер метаболизмімен байланысты DEG экспрессиясының үлгілерін көрсететін жылу картасы (топта n = 6 тышқан). Түс кілті экспрессия деңгейлерін көрсетеді. (p-q) WT және HNP1TG тышқандарының бауырындағы холестериннен алынған (p) және триглицеридтен алынған (q) липид түрлері деңгейлерінің метаболомдық талдауы (топта n = 6 тышқан). Барлық деректер орташа ± SD ретінде көрсетілген. Статистикалық маңыздылық жұптастырылмаған, 2 жақты Student t-тестімен талданды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise-f3.jpg\" alt=\"3-сурет. HNP1 гепатоциттер стеатозын жеңілдету үшін митохондриялық дисфункцияны тудырады.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет. HNP1 гепатоциттер стеатозын жеңілдету үшін митохондриялық дисфункцияны тудырады.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-сурет. HNP1 гепатоциттер стеатозын жеңілдету үшін митохондриялық дисфункцияны тудырады. (a) 0,5 мМ пальмитин қышқылымен өңделген гепатоциттердің үш түрінде құрылған in vitro липотоксикалық моделінің эксперименталды диаграммасы. (b) 4 мкМ HNP1 немесе сызықтық HNP1 болған немесе болмаған жағдайда 0,5 мМ пальмитин қышқылымен өңделген ORO-мен боялған гепатоциттердің өкілді суреттері. Масштабты сызық: 100 мкм. (c) ORO-оң аймақ пайыздары негізінде гепатоциттердегі липидтердің жиналуын жартылай сандық талдау (n = 6 биологиялық қайталаным). Деректер орташа ± SD ретінде көрсетілген. Статистикалық маңыздылық көптік салыстырулар үшін Бонферрони түзетуімен бір факторлы дисперсиялық талдау арқылы талданды. (d) 4 мкМ FAM-белгіленген HNP1-мен инкубацияланған, содан кейін MitoTracker Red-пен митохондрияларды бояумен тышқан гепатоциттерінің BNL CL.2 жасушалық желісінің флуоресцентті суреттері. Масштабты сызық: 25 мкм. (e) 12 апталық HFD-мен қоректенуден кейінгі WT және HNP1TG тышқандарының бауырындағы гепатоцеллюлярлы митохондриялардың өкілді TEM суреттері. (f) Бауыр стеатозы бар немесе жоқ клиникалық пациенттерден бөлінген бауыр гепатоцеллюлярлы митохондрияларының өкілді TEM суреттері.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise-f5.jpg\" alt=\"5-сурет. HNP1-дің VDAC1 N-терминалды олигомеризация доменімен байланысуы үшін құрылымдық негіз.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет. HNP1-дің VDAC1 N-терминалды олигомеризация доменімен байланысуы үшін құрылымдық негіз.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-сурет. HNP1-дің VDAC1 N-терминалды олигомеризация доменімен байланысуы үшін құрылымдық негіз. (a) Әртүрлі буферлік жағдайларда 80 мкМ HNP1 болған және болмаған жағдайда 400 мкМ 15N-белгіленген NTP-нің 2D (15N, 1H) HSQC спектрлері. (b) 0,5, 1 немесе 2 эквивалент HNP1-мен титрленген NTP спектрлерімен үсті-үсті қойылған 200 мкМ 15N-белгіленген NTP-нің 2D (15N, 1H) HSQC спектрлері. (c) Адам VDAC1 кристалдық құрылымынан (PDB: 6G6U) алынған NTP құрылымы, таяқша ретінде көрсетілген маңызды қалдықтармен. (d) NTP (жоғарыда) және HNP1 (төменде) қалдықтарының MM/GBSA байланысу еркін энергиясына қосқан үлесі. Деректер орташа ± SD ретінде ұсынылған. (e) HNP1 димерінің кристалдық құрылымы (PDB: 3GNY). (f-g) 4 мкМ HNP1 немесе W26A-HNP1 болған немесе болмаған жағдайда 0,5 мМ пальмитин қышқылымен өңделген ORO-мен боялған бастапқы гепатоциттердің өкілді суреттері (f) және ORO-оң аймақ пайыздары негізінде гепатоциттердегі липидтердің жиналуын жартылай сандық талдау (g) (n = 3 биологиялық қайталаным). Масштабты сызық, 100 мкм. Деректер орташа ± SEM ретінде көрсетілген. Статистикалық маңыздылық көптік салыстырулар үшін Бонферрони түзетуімен бір факторлы дисперсиялық талдау арқылы талданды. (h-i) Флуоресцентті поляризациямен бағаланған VDAC1 N-терминалды пептидінің HNP1 және оның W26A мутантымен байланысу жақындығы (h) және Kd мәндері (i). Деректер орташа ± SEM ретінде көрсетілген. Статистикалық маңыздылық көптік салыстырулар үшін Бонферрони түзетуімен бір факторлы дисперсиялық талдау арқылы талданды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;MASLD&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;кезіндегі&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нейтрофилдер&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;рөлі&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Биопсия&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;талдауы және&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;трансгенді&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тышқандар&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;HNP VDAC1&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;арқылы&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;митохондрияны&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;зақымдайды&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Стеатогепатитт&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;і емдеудің&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жаңа нысанасы&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"v
