        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"140\" cy=\"165\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"580\" cy=\"194\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · BIOINFORMATICS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Иммунитеттің ерте қартаюы:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;KRAS ақуызы жүрек ауруларына&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;қалай әсер етеді&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell-f1.jpg\" alt=\"1-сурет. Осы зерттеудің жұмыс барысы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Осы зерттеудің жұмыс барысы.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Жүрек-қан тамыр аурулары жастар арасында жиілеп барады, бірақ оның нақты себептері әлі де зерттелуде. Жаңа зерттеу иммундық жасушаларда белсенетін &lt;a href=\"concepts/kras.html\"&gt;KRAS&lt;/a&gt; ақуызының бұл процесте маңызды рөл атқаратынын көрсетеді. Оның артық мөлшері Т-лимфоциттердің мерзімінен бұрын қартаюына әкеліп, қан тамырларының қабынуын күшейтеді. Бұл жаңалық болашақта диагностика мен емдеудің жаңа әдістерін жасауға негіз бола алады.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;KRAS эффекторлық CD8+ Т-лимфоциттерінің қартаюын реттейтін негізгі фактор&lt;/li&gt;\n&lt;li&gt;Т-жасушаларындағы KRAS-тың жоғары деңгейі атеросклероз ауырлығымен байланысты&lt;/li&gt;\n&lt;li&gt;Виртуалды скрининг KRAS-қа бағытталған жаңа молекулаларды анықтады&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеушілер ерте коронарлық артерия ауруы (PCAD) бар науқастардың перифериялық қан мононуклеарлы жасушаларын (&lt;a href=\"concepts/pbmc.html\"&gt;PBMC&lt;/a&gt;) талдады. Бір жасушалы РНК секвенирлеуі (&lt;a href=\"concepts/scrna-seq.html\"&gt;scRNA-seq&lt;/a&gt;) арқылы KRAS генінің негізінен эффекторлық CD8+ Т-лимфоциттерінде аномальды түрде экспрессияланатыны анықталды. Бұл жасушалар қартаю белгілері мен жоғары цитотоксикалық қасиеттерді көрсетеді, бұл атеросклеротикалық бляшкалардың дамуына ықпал етеді.&lt;/p&gt;\n&lt;p&gt;KRAS-тың функционалдық маңыздылығын тексеру үшін авторлар виртуалды &lt;a href=\"concepts/knock-out.html\"&gt;нокаут&lt;/a&gt; (&lt;a href=\"concepts/in-silico-gene-perturbation.html\"&gt;in silico gene perturbation&lt;/a&gt;) алгоритмін қолданды, ол генді басу жасушаның жою жолдарын айтарлықтай өзгертетінін көрсетті. Молекулалық докинг және терең оқыту (deep learning) әдістері арқылы KRAS-тың белсенді емес түрімен байланыса алатын қосылыс болжанды. Алынған нәтижелер қан тамырларында «қартайған» Т-жасушалардың жиналуы ерте атеросклероздың маңызды патогенетикалық буыны екенін растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу корреляциялық талдау мен компьютерлік модельдеуге негізделген; терапевтік әсерді растау үшін тірі ағзалардағы эксперименттер қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Жүректің ишемиялық ауруының ерте дамуы (ЖИАЕД) нақты молекулалық қозғаушы күштерге ие емес, ал иммундық қартаюдың бұл процестегі рөлі түсініксіз. Біз Т-жасушаларындағы қартаюға байланысты гендердің реттелуінің бұзылуы ЖИАЕД-ке ықпал ететінін зерттедік.&lt;/p&gt;\n&lt;p&gt;Біз 12 ЖИАЕД науқасы мен 21 бақылау тобындағы адамдардың шеткі қан мононуклеарлы жасушаларының (PBMC) транскриптомикасын, сондай-ақ PBMC және адамның атеросклеротикалық бляшкаларының бір жасушалы РНҚ секвенирлеуін (&lt;a href=\"concepts/single-cell-rna-sequencing.html\"&gt;scRNA-seq&lt;/a&gt;) біріктірдік. Талдау үшін гендердің ко-экспрессиялық желісін салмақты талдау (&lt;a href=\"concepts/wgcna.html\"&gt;WGCNA&lt;/a&gt;), гендердің бұзылу желісін талдау және молекулалық докинг әдістері қолданылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;WGCNA — бұл бірлесіп жұмыс істейтін гендер топтарын анықтауға арналған статистикалық әдіс, ол маңызды биологиялық процестерді ашуға көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;KRAS гені ЖИАЕД-пен байланысты гендер мен қартаюға байланысты гендердің қиылысындағы орталық ген (хаб-ген) ретінде анықталды. Бір жасушалы талдау KRAS экспрессиясының негізінен эффекторлы CD8+ Т-жасушаларында жоғарылағанын көрсетті. Бұл жасушалар қартаюдың ең жоғары көрсеткіштеріне ие болды, олар ауру кезінде одан әрі өсті. KRAS желісінің бұзылуы жасушаларды жою жолына қатты әсер етті. KRAS деңгейі жоғары эффекторлы CD8+ Т-жасушалары коронарлық және ұйқы артерияларының бляшкаларында анықталды, олар күшейген цитотоксикалық, сарқылу және қартаю белгілерін көрсетті. Сонымен қатар, компьютерлік модельдеу арқылы белсенді емес KRAS-пен байланыса алатын шағын молекула болжанды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қартайған цитотоксикалық CD8+ Т-жасушаларындағы KRAS экспрессиясының жоғарылауы ЖИАЕД-пен байланысты және иммундық қартаю мен ерте атеросклероз арасындағы байланысты білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қартайған, цитотоксикалық CD8+ Т-жасушаларындағы KRAS экспрессиясының жоғарылауы ЖИАЕД-пен байланысты, бұл иммундық қартаю мен ерте атеросклерозды біріктіреді. Бұл жаңалық жаңа биомаркер мен әлеуетті терапиялық нысананы ұсынады, бірақ ол әрі қарай функционалдық тексеруді талап етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу биоинформатикалық талдау мен секвенирлеу деректеріне негізделген; терапиялық әлеуетті растау үшін қосымша эксперименттік зерттеулер қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"pcad-oezektiligi-zhaene-klinikalykh-maeseleler\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#pcad-oezektiligi-zhaene-klinikalykh-maeseleler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PCAD өзектілігі және клиникалық мәселелер&lt;/span&gt;&lt;/a&gt;PCAD өзектілігі және клиникалық мәселелер&lt;/h4&gt;\n&lt;p&gt;Ерте басталған жүрек ишемиялық ауруы (PCAD) кардиологиядағы күрделі және өзекті мәселелердің бірі. Бұрын жастар арасында коронарлық аурулар сирек кездескендіктен, бұл тақырыпқа аз көңіл бөлінген. Алайда, жастар арасында жүрек-қан тамыр ауруларынан болатын өлім-жітім жоғары деңгейде қалып отыр және жедел миокард инфарктісімен (AMI) ауыратын жас пациенттердің үлесі тұрақты түрде өсуде. Қазіргі профилактикалық стратегиялар орта және егде жастағы адамдарға негізделген, бұл жас пациенттердегі тәуекелді жүйелі түрде төмен бағалауға әкеледі. Нәтижесінде, PCAD көбінесе жедел жүрек-қан тамыр оқиғасынан кейін ғана анықталады, ал нақты эпидемиологиялық деректердің жетіспеушілігі тиімді терапияны дамытуды шектейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PCAD көбінесе кеш диагностикаланады, себебі қолданыстағы тәуекел шкалалары жас пациенттер үшін тиімсіз, бұл жаңа молекулалық драйверлерді іздеуді қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дәстүрлі тәуекел факторлары (семіздік, темекі шегу) болғанымен, атеросклероздың жедел дамуы тереңірек зерттеуді талап етеді. Қартаю — иммундық жүйенің функционалдық төмендеуімен (иммуносенсценция) сипатталатын тәуелсіз фактор. Бұл процесс цитокиндер секрециясының бұзылуына және иммундық жасушалар құрамының өзгеруіне әкеледі. Бұл созылмалы қабынуды тудырып, атеросклерозды өршітеді. Егде жастағы пациенттердің атеросклеротикалық бляшкаларында жинақталған қартайған Т-жасушалар тотыққан ЛПНП антигендерін тану қабілетін жоғалтып, қабынуды күшейтетін хемокиндерді көп мөлшерде бөледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Иммуносенсценция — бұл иммундық жүйенің қартаюы, мұнда жасушалар өз қорғаныс қызметін жоғалтып, қабынуды тудыратын факторларға айналады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kras-roeli-zhaene-zertteu-dizajny\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#kras-roeli-zhaene-zertteu-dizajny\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;KRAS рөлі және зерттеу дизайны&lt;/span&gt;&lt;/a&gt;KRAS рөлі және зерттеу дизайны&lt;/h4&gt;\n&lt;p&gt;PCAD кезіндегі Т-жасушалық иммуносенсценцияның рөлі әлі толық зерттелмеген. KRAS ақуызы MAPK/ERK, PI3K/AKT/mTOR каскадтары арқылы жасуша пролиферациясын реттейді. KRAS-тың қалыптан тыс белсенуі (мутациясыз да) жасушаның қартаюын қоздыруы мүмкін. Бұл зерттеуде авторлар транскриптомдық профильдеуді, scRNA-seq, виртуалды ген нокаутын, жасанды интеллект және молекулалық докингті біріктірді. KRAS PCAD және қартаюмен байланысты гендердің қиылысындағы орталық ген ретінде анықталды, оның экспрессиясы негізінен эффекторлық CD8+ Т-жасушаларында жоғары екені белгілі болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Виртуалды нокаут — бұл компьютерлік алгоритмдер арқылы белгілі бір генді өшіргенде жасушаның қалай өзгеретінін болжайтын әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Талдаулар KRAS-тың жоғары деңгейі цитотоксикалық бағдарламаны іске қосатынын және жасушаның қартаю белгілерімен байланысты екенін көрсетті. Бұл CD8+ Т-жасушалық субпопуляция коронарлық және каротидтік атеросклеротикалық бляшкаларда расталды. AI моделі арқылы KRAS-пен байланыса алатын жаңа шағын молекула анықталды, бұл «емделмейтін» деп саналатын ақуызға қарсы күресуге мүмкіндік береді. Зерттеу процесі 1-суретте көрсетілген.&lt;/p&gt;\n&lt;h4 id=\"khoghamdykh-derekterdi-alu\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#khoghamdykh-derekterdi-alu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қоғамдық деректерді алу&lt;/span&gt;&lt;/a&gt;Қоғамдық деректерді алу&lt;/h4&gt;\n&lt;p&gt;Талдау үшін GEO деректер базасы пайдаланылды. PCAD және сау бақылау тобындағы PBMC транскриптомдық деректері (bulk &lt;a href=\"concepts/rna-seq.html\"&gt;RNA-seq&lt;/a&gt;) GSE12288-ден алынды. PBMC scRNA-seq деректері GSE231906 және GSE145154-тен, ал коронарлық атеросклеротикалық бляшкалардың scRNA-seq деректері GSE252243 және GSE264666-дан жүктелді.&lt;/p&gt;\n&lt;h4 id=\"klinikalykh-uelgilerdi-zhinau-zhaene-validaciya\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#klinikalykh-uelgilerdi-zhinau-zhaene-validaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Клиникалық үлгілерді жинау және валидация&lt;/span&gt;&lt;/a&gt;Клиникалық үлгілерді жинау және валидация&lt;/h4&gt;\n&lt;p&gt;Зерттеу 2025 жылғы 1 қаңтар мен 2026 жылғы 1 қаңтар аралығында Харбин медициналық университетінің екінші ауруханасында «жағдай-бақылау» дизайны бойынша жүргізілді (этикалық комитеттің мақұлдауы KY-2025394). PBMC валидациясы үшін 5 PCAD (жүректің ишемиялық ауруы) бар науқас және 5 сау адам (жасы &amp;lt;45) таңдалды. PCAD диагнозы ангиографиялық стеноз &amp;gt;70% арқылы расталды. PBMC бөлініп, KRAS, SYK және TAB2 mRNA деңгейлері qPCR көмегімен өлшенді. Қақпақшалар (бляшкалар) валидациясы үшін каротидті эндартерэктомиядан өткен 5 науқастан алынған үлгілер қолданылды. Клиникалық деректер (жасы, жынысы, темекі шегу, гипертензия, диабет және липидтік профиль) статистикалық түзетулер үшін жиналды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Валидация 10 PBMC және 5 каротидтік бляшка үлгілері негізінде клиникалық қауіп факторларын ескере отырып жүзеге асырылды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"differencialdy-ekspressiya-zhaene-wgcna\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#differencialdy-ekspressiya-zhaene-wgcna\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дифференциалды экспрессия және WGCNA&lt;/span&gt;&lt;/a&gt;Дифференциалды экспрессия және WGCNA&lt;/h4&gt;\n&lt;p&gt;Транскриптомдық деректер limma (v3.62.2) пакетімен талданды. P &amp;lt; 0.05 және fold change &amp;gt; 1.5 болған гендер маңызды деп танылды. WGCNA (v1.74) талдауы 12 жұмсақ шектік қуатпен (soft-thresholding power) өткізілді. Модульдер динамикалық ағаш кесу әдісімен (минималды көлемі 80) анықталды. Негізгі модульдер Aging Atlas базасындағы қартаюмен байланысты гендермен салыстырылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;WGCNA — бірге экспрессияланатын гендер топтарын анықтау және олардың клиникалық белгілермен байланысын зерттеу әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;scRNA-seq деректерін өңдеу&lt;/p&gt;\n&lt;p&gt;Деректер Seurat (v5.5.0) көмегімен өңделді. &amp;lt; 200 гені және &amp;gt; 10% митохондриялық оқылымы бар жасушалар алынып тасталды. &lt;a href=\"concepts/pca.html\"&gt;PCA&lt;/a&gt; 2000 өзгермелі ген бойынша жүргізілді, кластерлеу (resolution 0.6) алғашқы 20 басты компонент арқылы іске асты. Жасуша түрлері канондық маркерлер (T-жасушалар, NK, B, моноциттер, дендритті жасушалар, макрофагтар, тегіс бұлшықет, фибробласттар және эндотелий жасушалары) негізінде белгіленді.&lt;/p&gt;\n&lt;h4 id=\"zhasushaaralykh-kommunikaciya-zhaene-zholdar-taldauy\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#zhasushaaralykh-kommunikaciya-zhaene-zholdar-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жасушааралық коммуникация және жолдар талдауы&lt;/span&gt;&lt;/a&gt;Жасушааралық коммуникация және жолдар талдауы&lt;/h4&gt;\n&lt;p&gt;CellChat (v2.1.1) көмегімен жасушааралық өзара әрекеттесулер анықталды. GSVA (v2.0.7) арқылы MSigDB гендер жиынтығы бағаланды. T-жасушалар үшін MI және сау топтар арасындағы айырмашылықтар FindMarkers (log-fold change &amp;gt; 0.5, p.adj &amp;lt; 0.05) функциясымен анықталып, clusterProfiler (v4.14.6) арқылы GO және KEGG талдауы жасалды.&lt;/p&gt;\n&lt;h4 id=\"t-zhasusha-subpopulyaciyalary-zhaene-funkcionaldykh-kueji\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#t-zhasusha-subpopulyaciyalary-zhaene-funkcionaldykh-kueji\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;T-жасуша субпопуляциялары және функционалдық күйі&lt;/span&gt;&lt;/a&gt;T-жасуша субпопуляциялары және функционалдық күйі&lt;/h4&gt;\n&lt;p&gt;T-жасушалар қайта кластерленіп, субпопуляциялар (naive CD4+, memory CD4+, reg CD4+, naive CD8+, effector CD8+) маркерлер бойынша бөлінді. Функционалдық күйлер (цитотоксикалық, сарқылу, қартаю) TCellSI (v1.2.0) пакетімен есептелді.&lt;/p&gt;\n&lt;h4 id=\"virtualdy-gen-nokauty\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#virtualdy-gen-nokauty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Виртуалды ген нокауты&lt;/span&gt;&lt;/a&gt;Виртуалды ген нокауты&lt;/h4&gt;\n&lt;p&gt;scTenifoldKnk (v1.0.3) көмегімен T-жасушаларда KRAS генінің &lt;a href=\"concepts/virtualnyy-nokaut.html\"&gt;in silico&lt;/a&gt; нокауты жасалды. Алгоритм гендік реттеуші желіні құрып, нысаналы генді алып тастау арқылы өзгерістерді бағалады. Ең көп өзгерген 20 ген GO және KEGG талдауына енгізілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;In silico нокаут — ген функциясын компьютерлік модельдеу арқылы өшіру әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tereng-okhytugha-negizdelgen-daerilik-zattardy-bolzhau-zhaene-molekulalykh-doking\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#tereng-okhytugha-negizdelgen-daerilik-zattardy-bolzhau-zhaene-molekulalykh-doking\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Терең оқытуға негізделген дәрілік заттарды болжау және молекулалық докинг&lt;/span&gt;&lt;/a&gt;Терең оқытуға негізделген дәрілік заттарды болжау және молекулалық докинг&lt;/h4&gt;\n&lt;p&gt;DrugReflector терең оқыту моделі Connectivity Map (CMap) деректер базасында оқытылды. MI (миокард инфарктісі) және сау Т-жасушаларын салыстыру нәтижесінде анықталған жоғары экспрессиялы гендер (DEGs) тізімі аурудың қолтаңбасы ретінде енгізілді. Модель қосылыстарды олардың осы қолтаңбаны өзгерту қабілетіне қарай саралады. Ең жоғары орын алған BRD-K78432605 қосылысы молекулалық докинг үшін таңдап алынды. GDP-мен байланысқан белсенді емес KRAS ақуызының кристалдық құрылымы (PDB: 4EPR, ажыратымдылығы 2,00 Å) Protein Data Bank-тан алынды. Молекулалық докинг AutoDock Vina (4.2.6 нұсқасы) көмегімен жүзеге асырылды, grid қорабы SOS-байланысу интерфейсіне орталықтандырылды. Нәтижелер PyMOL (2.6.0 нұсқасы) көмегімен визуализацияланды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DrugReflector моделі BRD-K78432605 қосылысын миокард инфарктісінің генетикалық профилін түзету үшін ең перспективалы үміткер деп тапты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sandykh-real-time-pcr\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#sandykh-real-time-pcr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сандық Real-Time PCR&lt;/span&gt;&lt;/a&gt;Сандық Real-Time PCR&lt;/h4&gt;\n&lt;p&gt;Тіндер ұнтақ күйіне келтіріліп, TRIzol реагентіне (Invitrogen, АҚШ) қосылды. Жасуша үлгілері супернатант алынып тасталғаннан кейін TRIzol-мен өңделді. РНҚ экстракциясы үшін хлороформ (1 мл TRIzol үшін 350 мкл) қосылып, 15 минут бойы 12 000 айн/мин жылдамдықта центрифугаланды. Супернатант 500 мкл изопропанолмен араластырылып, 10 минут тұрғаннан кейін, тағы 10 минут 12 000 айн/мин жылдамдықта 4 °C температурада центрифугаланды. Тұнба 1 мл 75% этанолмен жуылып, 5 минут центрифугаланды. Кептірілген тұнба ферментсіз суда ерітіліп, РНҚ концентрациясы өлшенді және -80 °C-та сақталды. cDNA Toyobo жиынтығы көмегімен синтезделді, содан кейін 2X M5 HiPer SYBR Premix EsTaq plus көмегімен qRT-PCR өткізілді. Салыстырмалы экспрессия 2⁻ΔΔ Ct әдісімен GAPDH геніне нормаланды. TAB2, SYK, KRAS және GAPDH гендері үшін праймерлер қолданылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;2⁻ΔΔ Ct әдісі ген экспрессиясының өзгеруін бақылау генімен (GAPDH) салыстыру арқылы анықтауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"aterosklerotikalykh-blyashkalardy-immunofluorescentti-boyau\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#aterosklerotikalykh-blyashkalardy-immunofluorescentti-boyau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атеросклеротикалық бляшкаларды иммунофлуоресцентті бояу&lt;/span&gt;&lt;/a&gt;Атеросклеротикалық бляшкаларды иммунофлуоресцентті бояу&lt;/h4&gt;\n&lt;p&gt;Адамның каротидтік атеросклеротикалық бляшкалары (қалыңдығы 4 мкм) депарафинизацияланып, цитрат буферінде (pH 6,0) микротолқынды пеште антигендері ашылды. 5% сиыр сарысуы альбуминінде блокталғаннан кейін, кесінділер бастапқы антиденелермен (anti-CD8a + anti-KRAS немесе anti-KRAS + anti-p16-INK4A) 4 °C-та бір түн бойы инкубацияланды. Кейін Alexa Fluor 488 және 594-пен конъюгацияланған екінші реттік антиденелер (1:500) қосылды. Ядролар &lt;a href=\"concepts/dapi.html\"&gt;DAPI&lt;/a&gt;-мен боялды. Кескіндер Zeiss Axio Observer микроскопында алынып, ImageJ бағдарламасында талданды. Әр жұп үшін бес кездейсоқ жоғары үлкейту аймағында (×200) екі жақты оң жасушалар саналды.&lt;/p&gt;\n&lt;h4 id=\"statistikalykh-taldau\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#statistikalykh-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистикалық талдау&lt;/span&gt;&lt;/a&gt;Статистикалық талдау&lt;/h4&gt;\n&lt;p&gt;Статистикалық талдаулар R (4.4.3 нұсқасы) бағдарламасында орындалды. Клиникалық валидация үшін PCAD және бақылау топтары арасындағы айырмашылықтар Student t-тесті көмегімен, жас, жыныс, темекі шегу, гипертензия және липидтік профиль сияқты факторларды ескере отырып, көп айнымалы сызықтық регрессия арқылы бағаланды. Топаралық салыстыру ANOVA және Tukey тестімен жүзеге асырылды. p &amp;lt; 0,05 статистикалық маңызды деп қабылданды. Иммунофлуоресцентті валидация үшін ресми статистикалық тест өткізілмеді, бұл сипаттамалық сипатқа ие болды.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"pcad-bar-naukhastardyng-pbmc-zhasushalarynda-khartayumen-bajlanysty-negizgi-genderdi-anykhtau\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#pcad-bar-naukhastardyng-pbmc-zhasushalarynda-khartayumen-bajlanysty-negizgi-genderdi-anykhtau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PCAD бар науқастардың PBMC жасушаларында қартаюмен байланысты негізгі гендерді анықтау&lt;/span&gt;&lt;/a&gt;PCAD бар науқастардың PBMC жасушаларында қартаюмен байланысты негізгі гендерді анықтау&lt;/h4&gt;\n&lt;p&gt;Авторлар 45 жасқа дейінгі 12 коронарлық артерия ауруы (CAD) бар науқастар мен 21 сау донордың PBMC транскриптомдық деректерін (GSE12288) талдады. p &amp;lt; 0.05 және /fold change/ &amp;gt; 1.5 шекті мәндерін қолдана отырып, limma талдауы 2289 дифференциалды экспрессияланатын генді (&lt;a href=\"concepts/gene-expression.html\"&gt;DEG&lt;/a&gt;) анықтады, оның 1175-і жоғары, ал 1114-і төмен экспрессияланған (2A-сурет). WGCNA талдауы 23 модульді бөлді, олардың ішінде күлгін модуль PCAD-пен ең күшті байланысты көрсетті (2B-сурет). Осы модульдегі 315 негізгі геннің, 2289 DEG және Aging Atlas дерекқорындағы 503 қартаюмен байланысты гендердің қиылысуы үш негізгі реттеуші генді анықтады: TAB2, SYK және KRAS (2C-сурет). Бұл үш геннің экспрессия деңгейі PCAD тобында бақылау тобына қарағанда жоғары болды, бұл qPCR әдісімен расталды (2E-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TAB2, SYK және KRAS гендері PCAD науқастарының PBMC жасушаларында жоғары экспрессияланатын негізгі реттеушілер ретінде анықталды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"periferiyalykh-khannyng-t-zhasushalarynda-kras-tyng-zhoghary-ekspressiyasy-pcad-pen-tyghyz-bajlanysty\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#periferiyalykh-khannyng-t-zhasushalarynda-kras-tyng-zhoghary-ekspressiyasy-pcad-pen-tyghyz-bajlanysty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Перифериялық қанның Т-жасушаларында KRAS-тың жоғары экспрессиясы PCAD-пен тығыз байланысты&lt;/span&gt;&lt;/a&gt;Перифериялық қанның Т-жасушаларында KRAS-тың жоғары экспрессиясы PCAD-пен тығыз байланысты&lt;/h4&gt;\n&lt;p&gt;PCAD кезіндегі бұл гендердің жасушалық контекстін түсіну үшін 45 жасқа дейінгі 2 ишемиялық кардиомиопатия (MI тобы) және 4 сау адамның scRNA-seq деректері (GSE231906 және GSE145154) қайта талданды. Бес негізгі жасуша түрі анықталды: Т-жасушалар, NK-жасушалар, В-жасушалар, моноциттер және дендриттік жасушалар. MI тобында Т-жасушалардың үлесі жоғары, ал моноциттердің үлесі төмен болды (3A, B-сурет). TAB2 және KRAS негізінен Т-жасушаларда, ал SYK моноциттерде экспрессияланған (3C-сурет). MI тобында барлық жасуша түрлерінде бұл гендердің экспрессиясы сау топқа қарағанда жоғары болды (3D-сурет). Жасушааралық байланыс талдауы MI тобында өзара әрекеттесулердің жалпы азайғанын және Т-жасушалардың орталық орын алатынын көрсетті (3E, F-сурет). GSVA талдауы MI тобында KRAS және p53 сигналдық жолдарының белсендірілгенін растады (3H-сурет). Т-жасушаларындағы гендер талдауы РНҚ сплайсингі мен апоптоз процестерінің күшейгенін көрсетті (3I, J-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;scRNA-seq — бұл әрбір жеке жасушаның ген экспрессия профилін зерттеуге мүмкіндік беретін технология.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу шағын таңдамалар негізінде жүргізілген, сондықтан бақыланған корреляциялар тікелей себеп-салдарлық байланысты білдірмейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kras-zhoghary-ekspressiyalanatyn-effektorlykh-cd8-t-zhasushalary-zhedeldetilgen-immundykh-khartayugha-ushyrajdy\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#kras-zhoghary-ekspressiyalanatyn-effektorlykh-cd8-t-zhasushalary-zhedeldetilgen-immundykh-khartayugha-ushyrajdy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;KRAS жоғары экспрессияланатын эффекторлық CD8+ Т-жасушалары жеделдетілген иммундық қартаюға ұшырайды&lt;/span&gt;&lt;/a&gt;KRAS жоғары экспрессияланатын эффекторлық CD8+ Т-жасушалары жеделдетілген иммундық қартаюға ұшырайды&lt;/h4&gt;\n&lt;p&gt;Т-жасушалардың субкластерленуі бес топты анықтады: наивті CD4+, жады CD4+, реттеуші CD4+, наивті CD8+ және эффекторлық CD8+ Т-жасушалары. MI тобында наивті CD4+ Т-жасушаларының үлесі жоғары, ал наивті CD8+ Т-жасушаларының үлесі төмен болды (4A, B-сурет). KRAS барлық топшаларда экспрессияланды, бірақ ең жоғары деңгей наивті CD4+ және эффекторлық CD8+ Т-жасушаларында байқалды (4C, D-сурет). TCellSI алгоритмі эффекторлық CD8+ Т-жасушаларында қартаю көрсеткіші ең жоғары екенін және MI тобында бұл көрсеткіш одан әрі өскенін көрсетті. scTenifoldKnk көмегімен KRAS-тың виртуалды нокауты CCR7 және PIK3IP1 гендеріне әсер етті (4F-H-сурет), бұл KRAS сигналдық жолының Т-жасушаларының цитотоксикалық бағдарламасымен тығыз байланысты екенін растады (4I, J-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;KRAS деңгейі жоғары эффекторлық CD8+ Т-жасушалары жеделдетілген иммундық қартаю белгілерін көрсетеді және бұл олардың цитотоксикалық функцияларымен байланысты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;KRAS экспрессиясы жоғары эффекторлы CD8+ T-жасушалары атеросклеротикалық бляшкаларға инфильтрацияланады және күшейтілген эффекторлы функцияны көрсетеді&lt;/p&gt;\n&lt;p&gt;Ерте кезеңдегі ишемиялық ауруы (PCAD) бар пациенттерде перифериялық қанның эффекторлы CD8+ T-жасушаларында KRAS деңгейінің жоғарылауы олардың цитотоксикалық қасиетін арттырып, қартаюын тездететінін анықтағаннан кейін, біз бұл құбылыстың атеросклеротикалық бляшкалар ішінде де орын алатынын зерттедік. Біз бес пациенттің коронарлық бляшкаларынан алынған жалпыға қолжетімді scRNA-seq деректерін (GSE252243 және GSE264666) қайта талдадық. Өлшемдерді азайту және кластерлеуден кейін жеті жасуша түрі анықталды: макрофагтар, T-жасушалар, NK-жасушалар, B-жасушалар, тегіс бұлшықет жасушалары, фибробласттар және эндотелий жасушалары (5A және B-сурет). PBMC нәтижелеріне сәйкес, KRAS T-жасушаларында ең жоғары экспрессия деңгейін көрсетті (5C және D-сурет). T-жасушаларын субкластерлеу арқылы төрт топ бөлінді: наивті CD4+, жады CD4+, реттеуші CD4+ және эффекторлы CD8+ T-жасушалары (5E және F-сурет). Бляшкалардағы KRAS-жоғары эффекторлы CD8+ T-жасушаларын 75-перцентиль бойынша топтарға бөліп, біз TCellSI балы бойынша KRAS-жоғары топтың цитотоксикалық және қартаю белгілерінің күштірек екенін анықтадық (5G-сурет). GO-терминдерін талдау KRAS-жоғары топта иммундық жауап пен жасуша бетіндегі рецепторлардың сигнал беру жолдарымен байланысты гендердің белсенді екенін көрсетті (5H-сурет). Ұйқы артериясының бляшкаларын иммунофлуоресцентті бояу әдісімен осы субпопуляцияның бар екендігі расталды (5I-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бляшкалардағы KRAS-жоғары CD8+ T-жасушалары күшейтілген цитотоксикалық әлеуетке ие, олар жергілікті қабынуды тудырып, бляшканың тұрақсыздығына әкелуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;scRNA-seq (бір жасушалы РНҚ секвенирлеу) — әрбір жеке жасушаның ген экспрессиясын талдауға мүмкіндік беретін технология, ол тіндердегі жасушалық әртүрлілікті анықтауға көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tereng-okhytu-modeli-zhaene-bir-zhasushaly-transkriptomikalykh-sekvenirleu-kandidattykh-terapiyalykh-khosylystardy-bolzhajdy\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#tereng-okhytu-modeli-zhaene-bir-zhasushaly-transkriptomikalykh-sekvenirleu-kandidattykh-terapiyalykh-khosylystardy-bolzhajdy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Терең оқыту моделі және бір жасушалы транскриптомикалық секвенирлеу кандидаттық терапиялық қосылыстарды болжайды&lt;/span&gt;&lt;/a&gt;Терең оқыту моделі және бір жасушалы транскриптомикалық секвенирлеу кандидаттық терапиялық қосылыстарды болжайды&lt;/h4&gt;\n&lt;p&gt;PCAD пациенттерінде KRAS жоғарылауынан туындаған транскриптомикалық ауытқуларды түзету үшін біз DrugReflector терең оқыту моделін қолдандық. 52 жасушалық желіде 9 597 пертурбацияны қамтитын CMap деректер базасында оқытылған бұл модель ген экспрессиясы профилін сау күйге қайтару қабілетіне қарай қосылыстарды саралайды. Біз MI және сау топтар арасындағы айырмашылықты гендерді аурудың қолтаңбасы ретінде енгіздіük (6A–D-сурет). Болжам нәтижелері бойынша BRD-K78432605 ең жоғары сәйкестік балын алды, бұл оның KRAS-пен байланысу немесе оның жолдарын модуляциялау ықтималдығын көрсетеді (6E және F-сурет). Молекулалық докинг талдауы BRD-K78432605-тің KRAS-тың белсенді емес жабық конформациясымен (PDB: 4EPR) -16,154 ккал/моль байланысу энергиясына ие екенін көрсетті (6G-сурет). Бұл мән -7,0 ккал/моль белсенділік шегінен айтарлықтай төмен, бұл қосылыстың термодинамикалық тұрақтылығын және KRAS-ты белсенді емес күйде ұстап тұру әлеуетін растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Молекулалық докинг — дәрілік молекула мен ақуыз-нысана арасындағы өзара әрекеттесуді компьютерлік модельдеу әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;h4 id=\"kras-zhaene-immundykh-zhuejening-erte-khartayuy-arasyndaghy-bajlanys-mehanizmderi\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#kras-zhaene-immundykh-zhuejening-erte-khartayuy-arasyndaghy-bajlanys-mehanizmderi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;KRAS және иммундық жүйенің ерте қартаюы арасындағы байланыс механизмдері&lt;/span&gt;&lt;/a&gt;KRAS және иммундық жүйенің ерте қартаюы арасындағы байланыс механизмдері&lt;/h4&gt;\n&lt;p&gt;Транскриптомдық профильдеу, жеке жасушалық секвенирлеу, виртуалды гендік нокаут, терең оқыту және молекулярлық докинг әдістерін біріктіре отырып, бұл зерттеу ерте жүретін ишемиялық жүрек ауруы (PCAD) бар науқастардың шеткері қан Т-лимфоциттерінде KRAS прото-онкогені экспрессиясының жоғарылағанын анықтады. Біз жоғары KRAS деңгейі бар эффекторлы CD8+ Т-жасушалары қартаюдың ең жоғары көрсеткіштерін (senescence scores) көрсететінін және бұл көрсеткіштер миокард инфарктісі (MI) тобында сау бақылау тобымен салыстырғанда жоғары екенін байқадық. Бұл иммундық жүйенің жедел қартаюын білдіреді: жас адамдарда Т-жасушалардың белгілі бір субпопуляциялары мерзімінен бұрын қартаю фенотипін иеленіп, &lt;a href=\"concepts/senescence-associated-secretory-phenotype.html\"&gt;SASP&lt;/a&gt; факторларын бөледі және жоғары цитотоксикалық қасиет көрсетіп, қан тамырларының қабырғасын зақымдайды. MI тобындағы шеткері қан мононуклеарлы жасушаларындағы (PBMC) жасушааралық коммуникацияның төмендеуі қартайған иммундық жүйеге тән үйлестірудің жоғалуын көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Т-жасушаларындағы KRAS деңгейінің жоғарылауы иммундық жүйенің ерте қартаюы мен жас науқастардағы атеросклероздың дамуын байланыстыратын негізгі молекулярлық буын болып табылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SASP (senescence-associated secretory phenotype) — бұл қартайған жасушалар бөлетін цитокиндер, хемокиндер және протеазалар кешені, олар қабыну мен тіндердің зақымдалуына әкеледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"klinikalykh-mangyzy-zhaene-diagnostikalykh-aeleuet\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#klinikalykh-mangyzy-zhaene-diagnostikalykh-aeleuet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Клиникалық маңызы және диагностикалық әлеует&lt;/span&gt;&lt;/a&gt;Клиникалық маңызы және диагностикалық әлеует&lt;/h4&gt;\n&lt;p&gt;PCAD диагностикасы күрделі мәселе болып қала береді, өйткені қолданыстағы тәуекел шкалалары (мысалы, Pooled Cohort Equations) 40 жасқа толмаған адамдар үшін бейімделмеген, ал коронарлық кальций (CAC) бойынша ұсыныстар 45 жастан асқан науқастардың деректеріне негізделген. 10 жылдық тәуекел төмен болып көрінгенімен, жастарда өмір бойғы тәуекел айтарлықтай және миокард инфарктісі кезіндегі болжам көбінесе нашар. Қазіргі уақытта PCAD үшін арнайы биомаркерлер шектеулі: С-реактивті ақуыз бен плазмалық атеросклероз индексі (AIP) болжамдық мәнге ие, бірақ кең клиникалық тәжірибеге енгізілмеген. Біздің жаңалығымыз KRAS және оның транскрипциялық сигнатураларын иммундық жүйенің ерте биологиялық қартаюын көрсететін және липидтік профильмен бірге қолданылатын перспективалы биомаркерлер ретінде қарастыруға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу бақылау сипатында; Т-жасушаларындағы KRAS экспрессиясы тәуекелді стратификациялауға және емдеуді дараландыруға көмектесетінін растау үшін проспективті жұмыстар қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ccr7-ning-t-zhasushalykh-disfunkciyadaghy-roeli\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#ccr7-ning-t-zhasushalykh-disfunkciyadaghy-roeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CCR7-нің Т-жасушалық дисфункциядағы рөлі&lt;/span&gt;&lt;/a&gt;CCR7-нің Т-жасушалық дисфункциядағы рөлі&lt;/h4&gt;\n&lt;p&gt;KRAS виртуалды нокауты CCR7 генінің экспрессиясы ең көп өзгеретінін көрсетті. CCR7 — бұл Т-жасушаларын лимфоидты органдарға бағыттайтын рецептор. Қалыпты жағдайда CCR7 сигналдары Т-жасушаның антиген ұсынатын жасушамен байланысын уақытылы тоқтатуды қамтамасыз етеді. KRAS-тың қалыптан тыс белсендірілуі нәтижесінде CCR7 экспрессиясы басылады, бұл екі салдарға әкеледі: біріншіден, Т-жасушалары лимфоидты органдардағы бақылаудан қашып, шеткері тіндерге, соның ішінде артерия қабырғаларына көшеді; екіншіден, «ажырау» сигналының болмауына байланысты, бляшка ішіндегі Т-жасушалары TCR рецепторларының шамадан тыс стимуляциясына ұшырайды және PD-1 мен CTLA-4-тің жоғары экспрессиясымен сипатталатын сарқылу (exhaustion) фенотипін иеленеді. Бұл атеросклеротикалық бляшкаларда анықталған CD8+ Т-жасушаларындағы жоғары цитотоксикалық пен сарқылу/қартаю белгілерінің парадоксалды түрде бірге болуын түсіндіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Виртуалды нокаут — бұл генетикалық манипуляциясыз транскриптомдық деректерді талдау негізінде белгілі бір ген функциясын «өшірудің» салдарын болжауға мүмкіндік беретін компьютерлік модельдеу әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zertteu-shekteuleri\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#zertteu-shekteuleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу шектеулері&lt;/span&gt;&lt;/a&gt;Зерттеу шектеулері&lt;/h4&gt;\n&lt;p&gt;Бұл зерттеудің бірқатар шектеулері бар. Біріншіден, ашық дереккөздерде толық клиникалық бақылау ақпаратының болмауына байланысты, біз Т-жасушаларындағы KRAS экспрессия деңгейі мен жүрек-қан тамырларының ауыр асқынулары арасындағы байланысты тікелей бағалай алмадық. Екіншіден, деректер жиынтығы әртүрлі ауру контексттерінен, соның ішінде 45 жасқа дейінгі пациенттердегі коронарлық артерия ауруы, миокард ишемиясы және дамыған атеросклеротикалық бляшкалардан алынған. Бұл жағдайлар ерте атеросклероз спектріне жатса да, олардың сатылары мен клиникалық анықтамалары толық сәйкес келмейді, бұл деректердің гетерогенділігін тудыруы мүмкін.&lt;/p&gt;\n&lt;p&gt;Үшіншіден, PBMCs (перифериялық қанның мононуклеарлы жасушалары) бойынша жалғыз жасушалық талдау (scRNA-seq) өте шектеулі донорлар санына (екі ауру үлгісі және төрт бақылау) негізделген. Дегенмен, негізгі нәтижелер бляшкалардың тәуелсіз scRNA-seq деректерімен және иммунофлуоресцентті бояумен расталды. Төртіншіден, барлық механикалық тұжырымдар есептеу талдауларына және қолданыстағы деректерді қайта өңдеуге негізделген, KRAS функциясын тікелей тексеру (gain- or &lt;a href=\"concepts/loss-of-function.html\"&gt;loss-of-function&lt;/a&gt;) жүргізілмеген. KRAS деңгейінің жоғарылауы Т-жасушаларының цитотоксикалық, қартайған фенотипін қалыптастыру үшін жеткілікті ме, жоқ па, оны лентивирустық артық экспрессия немесе Т-жасушасына тән Kras нокаут модельдері арқылы анықтау қажет.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу негізінен есептеу әдістеріне сүйенеді, сондықтан KRAS-тың Т-жасуша фенотипіне әсерін эксперименталды түрде растау қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нокаут (knock-out) — бұл геннің функциясын өшіру арқылы оның биологиялық рөлін анықтау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу негізінен биоинформатикалық талдауға негізделген; шағын таңдама көлемі жеке вариацияларды күшейтуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бесіншіден, біз перифериялық қандағы Т-жасушаларында KRAS мутацияларының бар-жоғын тексермедік. Соңында, компьютерлік болжам арқылы анықталған BRD-K78432605 қосылысы терапиялық маңызын дәлелдеу үшін эксперименталды тексеруден өтуі керек.&lt;/p&gt;\n&lt;h4 id=\"ai-zhaene-ai-koemekshi-khuraldary-turaly-maelimdeme\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#ai-zhaene-ai-koemekshi-khuraldary-turaly-maelimdeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AI және AI көмекші құралдары туралы мәлімдеме&lt;/span&gt;&lt;/a&gt;AI және AI көмекші құралдары туралы мәлімдеме&lt;/h4&gt;\n&lt;p&gt;Авторлар деректерді талдау кезінде жасанды интеллект технологияларын қолданды. scTenifoldKnk (1.0.3 нұсқасы) in silico гендік нокаут талдауы үшін пайдаланылды. Бұл құрал жалғыз жасушалық гендік реттеуші желілерді құрады және мақсатты генді алып тастау арқылы оның реттеуші рөлін анықтайды. DrugReflector моделі Connectivity Map (CMap) дерекқоры негізінде дәрілік заттарды болжау үшін қолданылды. Мәтін жазу үшін генеративті AI құралдары қолданылмады.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell-f1.jpg\" alt=\"1-сурет. Осы зерттеудің жұмыс барысы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Осы зерттеудің жұмыс барысы.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell-f2.jpg\" alt=\"2-сурет. Ерте кезеңдегі жүрек ишемия ауруы (ЖИА) бар пациенттердің шеткі қан мононуклеарлы жасушаларындағы (PBMC) қартаю\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет. Ерте кезеңдегі жүрек ишемия ауруы (ЖИА) бар пациенттердің шеткі қан мононуклеарлы жасушаларындағы (PBMC) қартаюмен байланысты негізгі гендерді анықтау.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сурет. Ерте кезеңдегі жүрек ишемия ауруы (ЖИА) бар пациенттердің шеткі қан мононуклеарлы жасушаларындағы (PBMC) қартаюмен байланысты негізгі гендерді анықтау. (A) ЖИА пациенттері мен сау бақылау тобы арасындағы дифференциалды экспрессияланатын гендердің (DEG) жанартау графигі. (B) Салмақталған гендердің ко-экспрессиялық желілік талдауы (WGCNA) нәтижесінде алынған модуль-белгі ассоциацияларының жылу картасы; күлгін модуль ЖИА-мен ең күшті корреляцияны көрсетеді. (C) Күлгін модульден 315 негізгі ген, 2289 DEG және Aging Atlas дерекқорынан қартаюмен байланысты 503 ген арасындағы қиылысуды көрсететін Венн диаграммасы, бұл үш ортақ негізгі генді анықтауға мүмкіндік берді: TAB2, SYK және KRAS. (D) ЖИА тобы мен бақылау тобының PBMC-індегі TAB2, SYK және KRAS экспрессия деңгейлерін көрсететін скрипка диаграммалары. (E) Үш негізгі геннің экспрессия айырмашылықтарын qPCR арқылы растау. Деректер орташа ± стандартты ауытқу ретінде ұсынылған; *p &amp;lt; 0,05, **p &amp;lt; 0,01, ***p &amp;lt; 0,001.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell-f3.jpg\" alt=\"3-сурет. PBMC бір жасушалы секвенирлеу нәтижелері негізгі гендерді көрсетеді.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет. PBMC бір жасушалы секвенирлеу нәтижелері негізгі гендерді көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-сурет. PBMC бір жасушалы секвенирлеу нәтижелері негізгі гендерді көрсетеді. (A) PBMC-тің UMAP графигі және жасуша түрлерінің пропорциясы; (B) Әртүрлі жасуша түрлеріндегі маркерлік ген экспрессиясының көпіршікті диаграммасы; (C) TAB2, SYK және KRAS экспрессиясының таралуы; (D) Әртүрлі топтар мен жасуша түрлеріндегі TAB2, SYK және KRAS экспрессия деңгейлері (скрипка диаграммалары ретінде көрсетілген); (E) CellChat жасушааралық коммуникация нәтижелері (саны мен салмағы); (F) Әртүрлі топтар арасындағы CellChat жасушааралық коммуникация нәтижелерін салыстыру (саны мен салмағы); (G) Әртүрлі топтардағы өзара әрекеттесу жолдарының белсенділік деңгейлері; (H) GSVA жолының белсенділік көрсеткіштерінің жылу картасы; (I) Миокард инфарктісі (MI) тобындағы Т-жасушаларында жоғары экспрессияланған гендердің GO байыту талдауының көпіршікті диаграммасы; (J) MI тобындағы Т-жасушаларында жоғары экспрессияланған гендердің KEGG байыту талдауының көпіршікті диаграммасы.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell-f4.jpg\" alt=\"4-сурет. PBMC-тегі Т-жасуша субпопуляцияларының функционалдық талдауы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет. PBMC-тегі Т-жасуша субпопуляцияларының функционалдық талдауы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-сурет. PBMC-тегі Т-жасуша субпопуляцияларының функционалдық талдауы. (A) Т-жасуша субпопуляцияларының UMAP графигі және жасуша түрлерінің пропорциясы; (B) Әртүрлі жасуша түрлеріндегі маркерлік ген экспрессиясының көпіршікті диаграммасы; (C) KRAS экспрессиясының таралуы; (D) Әрбір Т-жасуша субпопуляциясындағы KRAS экспрессия деңгейі; (E) TCellSI функционалдық көрсеткіштерінің жылу картасы; (F) scTenifoldKnk виртуалды нокаутынан кейінгі айтарлықтай өзгерген гендер үлесінің дөңгелек диаграммасы; (G) Ең айтарлықтай өзгерген 10 геннің бағаналы диаграммасы; (H) Айтарлықтай өзгерген гендердің шашырау диаграммасы; (I) Айтарлықтай өзгерген гендердің GO байыту талдауының көпіршікті диаграммасы; (J) Айтарлықтай өзгерген гендердің KEGG жолының байыту талдауының көпіршікті диаграммасы.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell-f5.jpg\" alt=\"5-сурет. Коронарлық артерия бляшкаларының бір жасушалы секвенирлеу нәтижелері KRAS жоғары экспрессияланған Т-жасуша субп\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет. Коронарлық артерия бляшкаларының бір жасушалы секвенирлеу нәтижелері KRAS жоғары экспрессияланған Т-жасуша субпопуляциясының бар екенін және қызметін растайды.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-сурет. Коронарлық артерия бляшкаларының бір жасушалы секвенирлеу нәтижелері KRAS жоғары экспрессияланған Т-жасуша субпопуляциясының бар екенін және қызметін растайды. (A) Коронарлық артерия бляшкаларының UMAP графигі және жасуша түрлерінің пропорциясы; (B) Бляшкалар ішіндегі әртүрлі жасуша түрлеріндегі маркерлік ген экспрессиясының көпіршікті диаграммасы; (C) KRAS экспрессиясының таралуы; (D) Әртүрлі жасуша түрлеріндегі KRAS экспрессия деңгейі; (E) Т-жасуша субпопуляцияларының UMAP графигі; (F) Бляшкалар ішіндегі әрбір Т-жасуша субпопуляциясындағы маркерлік ген экспрессиясының көпіршікті диаграммасы; (G) KRAS-жоғары және KRAS-төмен Эффекторлы CD8+ Т-жасушалары арасындағы TCellSI функционалдық көрсеткіштерін салыстыру; (H) KRAS-жоғары субпопуляциядағы дифференциалды экспрессияланатын гендердің GO функционалдық байыту талдауы; (I) Адамның ұйқы артериясы бляшкаларындағы иммунофлуоресцентті ко-локализация кескіндері.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell-f6.jpg\" alt=\"6-сурет. DrugReflector терең оқыту моделі арқылы дәрілік заттарды болжау және молекулалық докинг әдісімен валидациялау.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сурет. DrugReflector терең оқыту моделі арқылы дәрілік заттарды болжау және молекулалық докинг әдісімен валидациялау.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;6-сурет. DrugReflector терең оқыту моделі арқылы дәрілік заттарды болжау және молекулалық докинг әдісімен валидациялау. (A–B) PBMC бір жасушалы нәтижелерін енгізгеннен кейін DrugReflector болжаған қосылыстардың ықтималдығы мен логит-бағасы (ранжирленген); (C–D) PBMC бір жасушалы нәтижелерін енгізгеннен кейін DrugReflector болжаған қосылыстардың ықтималдығы мен логит-бағасының таралу графиктері; (E–F) Ықтималдық пен логит-бағаны болжау қисықтарында көрсетілген Топ-10 және Топ-20 қосылыстар; (G) BRD-K78432605 молекулалық докинг конформациясы мен KRAS жабық конформациясының (PDB: 4EPR) схемалық диаграммасы.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Ерте&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;атеросклероз&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;себептерін&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;іздеу&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Бір жасушалы&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;РНК талдауы&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;және докинг&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;KRAS Т-&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жасушаларының&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қартаюын&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тездетеді&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Қан тамырларын&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;емдеудің жаңа&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нысанасы&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Препринт лицензиясы&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;bioRxiv&lt;/td&gt;\n&lt;td&gt;bioinformatics&lt;/td&gt;\n&lt;td&gt;все права у
