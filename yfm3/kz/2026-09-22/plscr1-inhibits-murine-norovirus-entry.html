        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"273\" cy=\"121\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"667\" cy=\"296\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · MICROBIOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Plscr1 ақуызы тышқан&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;норовирусының енуін тежейді&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-f1.jpg\" alt=\"1-сурет: Plscr1 MNV инфекциясын оңтайлы бақылау үшін қажет.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Plscr1 &lt;a href=\"concepts/murine-norovirus.html\"&gt;MNV&lt;/a&gt; инфекциясын оңтайлы бақылау үшін қажет.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет: Plscr1 MNV инфекциясын оңтайлы бақылау үшін қажет. (A) Үш түрлі скрининг бойынша сақталған «хиттерді» (оң нәтижелерді) көрсететін Венн диаграммасы. (B) Бос векторды немесе Plscr1 экспрессиялайтын HeLa-CD300lf жасушалары 0,05 инфекция көптігімен (&lt;a href=\"concepts/moi.html\"&gt;MOI&lt;/a&gt;) MNVCW3 (сол жақта) немесе MNVCR6 (оң жақта) жұқтырылды. Вирустық өнімділік бляшка әдісімен (PFU; бляшка түзуші бірліктер) есептелді. (C) Тышқан немесе адам Plscr1 экспрессиялайтын HeLa-CD300lf жасушалары 48 сағат ішінде 0,5 MOI MNVCW3-HiBiT-пен зақымдалды. Инфекция Nano-Glo HiBiT Lytic Detection System (RLU; салыстырмалы люминесценция бірліктері) көмегімен сандық түрде анықталды. (D) Көрсетілген антиденелермен боялған, FLAG-белгісі бар тышқан (ms) немесе адам (hu) Plscr1 экспрессиялайтын HeLa-CD300lf жасушаларының өкілдік вестерн-блоты. (E) Векторлық бақылауды немесе Plscr1 экспрессиялайтын, 5,0 MOI MNVCW3-пен жұқтырылған және инфекциядан кейінгі көрсетілген сағаттарда (hpi) лизис жасалған HeLa-CD300lf жасушаларының өкілдік вестерн-блоты. (F) Интерферонмен өңделмеген, 1000 бірлік/мл интерферон α немесе 0,1 мкг/мл интерферон γ-мен өңделген және көрсетілген антиденелермен боялған HeLa-CD300lf немесе HeLaΔPlscr1-CD300lf жасушаларының өкілдік вестерн-блоты. (G) HeLa-CD300lf немесе HeLaΔPlscr1-CD300lf жасушалары 0,5 MOI MNVCW3-HiBiT-пен зақымдалды. 48 сағаттан кейін инфекция Nano-Glo HiBiT Lytic Detection System көмегімен сандық түрде анықталды. (H) HeLa-CD300lf немесе HeLaΔPlscr1-CD300lf жасушалары интерферон α-ның көрсетілген дозаларымен (бірлік/мл) өңделді, содан кейін 48 сағат ішінде 0,5 MOI MNVCW3-HiBiT-пен зақымдалды. Инфекция Nano-Glo HiBiT Lytic Detection System көмегімен сандық түрде анықталды. Көрсетілген жасуша түрлері үшін интерферон α-ның 50% тиімді концентрациясы (EC50) есептелді. (I) Plscr1+/+ (WT) немесе Plscr1-/- (KO) бір туысқан жануарлардағы көрсетілген тіндердегі Plscr1 экспрессиясы. Үзік сызық анықтау шегін көрсетеді. (J) Plscr1+/+ (WT) немесе Plscr1-/- (KO) бір туысқан жануарлар 1 x 10^6 PFU MNVCW3-пен жұқтырылды және инфекциядан 3 күн өткен соң эвтаназия жасалды. Тоқ ішек, мықын ішегі, шажырқай лимфа түйіндері (MLN), көкбауыр және бауыр MNV геном көшірмелері үшін &lt;a href=\"concepts/qpcr.html\"&gt;qPCR&lt;/a&gt; арқылы талданды және актин бойынша қалыпқа келтірілді. Әрбір тін үшін скрипка диаграммасымен (violin plot) бірге жеке деректер нүктелері көрсетілген. Манн-Уитни тестінің P-мәндері келтірілген. Үзік сызық анықтау шегін көрсетеді. Барлық деректер үш тәуелсіз эксперименттің орташа мәні ± стандартты ауытқу ретінде ұсынылған және Тьюкидің көптік салыстыру тестімен бір факторлы дисперсиялық талдау (ANOVA) (B және C), T-тест (G) немесе Манн-Уитни тесті (J) көмегімен талданды. *P &amp;lt; 0,05, **P &amp;lt; 0,01, ***P &amp;lt; 0,001, ****P &amp;lt; 0,0001.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Норовирустар ішек инфекцияларын тудырады және жасушаларға күрделі молекулалық механизмдер арқылы енеді. Зерттеушілер Plscr1 ақуызы вирусқа қарсы «күзетші» қызметін атқарып, оны ену сатысында бөгейтінін анықтады. Бұл жаңалық иммундық жүйенің вирустың таралуын қалай шектейтінін түсінуге көмектеседі.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Plscr1 тышқан норовирусының жасушаға енуін шектейді&lt;/li&gt;\n&lt;li&gt;Plscr1 тапшылығы вирус репликациясының өсуіне әкеледі&lt;/li&gt;\n&lt;li&gt;Ақуыз вирустың эндосомамен қосылуына кедергі жасайды&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Норовирустар (Caliciviridae тұқымдасы) инфекцияны бастау үшін жасуша бетіндегі арнайы рецепторларды пайдаланады. Бұл зерттеуде мембранадағы липидтердің таралуына қатысатын Plscr1 (фосфолипид-скрамблаза 1) ақуызының рөлі зерттелді. Авторлар вирустық бөлшектердің жасушалық құрылымдармен өзара әрекеттесуін талдау үшін тышқан норовирусы (MNV) моделін қолданды.&lt;/p&gt;\n&lt;p&gt;Тәжірибелер Plscr1 ақуызының вирустың цитозольге ену қабілетін шектейтінін көрсетті. Жасушаларда Plscr1 гені өшірілгенде (&lt;a href=\"concepts/knock-out.html\"&gt;нокаут&lt;/a&gt;), вирустық жүктеменің айтарлықтай өсуі байқалды, бұл ақуыздың қорғаныс функциясын растайды. Әсер ету механизмі мембрана қасиеттерінің өзгеруімен байланысты, бұл вирус қабығының эндосомамен қосылуына кедергі келтіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тышқан моделінде жүргізілген, сондықтан адам норовирустарымен өзара әрекеттесу механизмдері өзгеше болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Норовирустар бүкіл әлемде гастроэнтериттің негізгі себептерінің бірі болып қала береді, алайда олардың репликациясын шектейтін жасушалық механизмдер толық зерттелмеген. &lt;a href=\"concepts/crispr-screening.html\"&gt;CRISPR-активация&lt;/a&gt; және CRISPR-нокаут көмегімен жүргізілген геномдық скрининг арқылы зерттеушілер интерферонмен ынталандырылатын Plscr1 генін тышқан норовирусының (MNV) көбеюін шектейтін фактор ретінде анықтады. Бұрын Plscr1 қабықшалы вирустардың эндоцитарлық мембраналармен қосылуына кедергі келтіретіні белгілі болған, сондықтан оның қабықшасыз MNV-ге қарсы антивирустық белсенділігі күтпеген нәтиже болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR-скрининг — бұл жасушалардағы мыңдаған гендерді өшіру (нокаут) немесе белсендіру (активация) арқылы олардың вирусқа төзімділікке әсерін бақылауға мүмкіндік беретін генетикалық әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эксперименттер Plscr1-дің in vitro жағдайында MNV инфекциясын шектеу үшін қажет және жеткілікті екенін, сондай-ақ тышқандардың тоқ ішегіндегі вирус жүктемесін бақылауға қатысатынын көрсетті. Механистикалық талдау Plscr1-дің MNV-дің жасушаға енуін вирус беткейге бекітілгеннен кейінгі кезеңде тоқтататынын анықтады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Plscr1 вирустың бекітілуінен кейінгі кезеңде жасушаға енуін блоктай отырып, MNV инфекциясын басады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу жасушалық дақылдар мен тышқан модельдері негізінде жүргізілген; нәтижелерді адамдарға қолдану мүмкіндігін анықтау қосымша тексеруді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кіші капсидтік &lt;a href=\"concepts/vp2-capsid-protein.html\"&gt;VP2&lt;/a&gt; ақуызындағы жалғыз аминқышқылдық алмасу вирусты Plscr1 әсеріне төзімді ететіні анықталды. VP2 ақуызы калицивирустардың жасушаға ену процесінде эндоцитарлық мембраналарды тесіп, вирустық РНҚ-ны жеткізу қызметін атқаратындықтан, бұл нәтижелер Plscr1-дің вирус ену процесінің кешкі кезеңдеріне әсер ететінін көрсетеді. Алынған нәтижелер PLSCR1-дің антивирустық белсенділік спектрін қабықшасыз вирустарға дейін кеңейтеді және қабықшалы және қабықшасыз вирустардың жасушаға ену жолдары арасындағы күтпеген байланыс нүктесін анықтайды.&lt;/p&gt;\n&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Норовирустар — вирустық гастроэнтериттің негізгі себепкері болып табылатын қабықшасыз, оң тізбекті РНҚ вирустары. Олардың жаһандық денсаулық сақтау мен экономикаға тигізетін зияны орасан: тек АҚШ-тың өзінде жыл сайынғы шығын 10,6 миллиард долларды құрайды. Адам норовирусын (HNoV) зерттеу in vitro жағдайында өсірудің қиындығына және шағын жануарлар моделінің жоқтығына байланысты ұзақ уақыт бойы шектелген болатын. Адамның ішек энтероидтарын (HIE) ашу арқылы бұл кедергі еңсерілді, алайда HNoV биологиясын зерттеу үшін сенімді жүйелерді құру әлі де күрделі міндет болып қалуда.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Норовирустар айтарлықтай экономикалық шығын келтіреді, ал оларды зерттеу HIE жүйелері мен тышқан модельдерін дамыту арқылы мүмкін болды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тышқан норовирусы (MNV) жасушалық желілерде белсенді көбейетіндіктен, ыңғайлы модель ретінде қолданылады. Тышқандарда құсу рефлексі жоқ және диарея сирек кездессе де, MNV мен HNoV геном ұйымдастырылуы, репликация механизмдері және берілу жолдары бойынша ұқсастықтарға ие. MNV штаммдары интерферонға (IFN) сезімталдығы бойынша ерекшеленеді. Мысалы, MNVCW3 штаммы IFN-α/βR−/− тапшылығы бар тышқандар үшін өлімге әкеледі, ал I және III типті IFN сигналдары ішектегі туфт жасушаларында инфекцияны шектейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Энтероидтар (HIE) — ішек дің жасушаларынан алынған үш өлшемді құрылымдар, олар ішек қызметін имитациялайды және бұрын өсіруге келмеген вирустарды зерттеуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;IFN норовирус патогенезінде маңызды рөл атқарғанымен, норовирусты шектейтін нақты интерферон-стимулданған гендер (ISG) әлі белгісіз. CRISPR/Cas9 скрининг деректерін талдау арқылы авторлар фосфолипид-скрамблаза 1 (PLSCR1) генін MNV шектеуші факторы ретінде анықтады. PLSCR1 интерферонның барлық үш түрімен индукцияланады және қабықшалы вирустардың (мысалы, АИТВ және SARS-CoV-2) мембраналармен қосылуын бөгейтіні белгілі. Бұл жұмыста PLSCR1-дің MNV сияқты қабықшасыз вирустарды шектей алатындығы зерттеледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тышқан моделіне негізделген; нәтижелерді адамға тікелей қатыстыруға болмайды, себебі вирус пен иесінің өзара әрекеттесу механизмдері әр түрлі болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"plscr1-mnv-replikaciyasyn-shekteu-ueshin-zhetkilikti\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plscr1-mnv-replikaciyasyn-shekteu-ueshin-zhetkilikti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PLSCR1 MNV репликациясын шектеу үшін жеткілікті&lt;/span&gt;&lt;/a&gt;PLSCR1 MNV репликациясын шектеу үшін жеткілікті&lt;/h4&gt;\n&lt;p&gt;Біз антивирустық гендерді анықтау үшін бұрын жүргізілген үш CRISPR-скрининг деректерін талдадық. Бірінші зерттеуде тышқан &lt;a href=\"concepts/microglia.html\"&gt;микроглия&lt;/a&gt; жасушалары (BV2) нокаут (CRISPR knockout) әдісімен тексерілді, мұнда MNV инфекциясына сезімталдықты арттыратын гендер таңдалды. Екінші скринингте BV2 жасушаларында гендерді белсендіру (CRISPRa) әдісі қолданылды. Үшінші скрининг (CRISPRa) MNV рецепторы CD300lf-ті экспрессиялайтын HeLa жасушаларында жүргізілді. Талдау көрсеткендей, IFITM2 және PLSCR1 гендері MNV-ге қарсы тұрақты антивирустық белсенділік көрсетеді (Rasm 1A).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR-скрининг — вирустық инфекция кезінде жасушалардың тіршілік қабілетіне әсер ететін гендерді табу үшін геномдағы барлық гендерді өшіру (knockout) немесе белсендіру (CRISPRa) әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;IFITM2 және PLSCR1 интерферонмен стимуляцияланатын гендер (ISG). IFITM2 вирустардың эндомембраналық компартменттерден кіруін блоктайды, ал PLSCR1 қабықшалы вирустардың (мысалы, АИТВ, SARS-CoV-2) мембраналармен қосылуына кедергі жасайды. PLSCR1-дің қабықшасыз вирустарға әсері зерттелмегендіктен, біз оның MNV-ді шектеудегі рөлін зерттедік. HeLa-CD300lf жасушаларында тышқан Plscr1 генінің шамадан тыс экспрессиясы (сверхэкспрессия) MNV штаммдарының (MNVCW3 және MNVCR6) өсуін бақылау жасушаларымен салыстырғанда айтарлықтай бәсеңдетті (Rasm 1B). Тышқан және адам PLSCR1 ақуыздарының тізбегі 75% ұқсас болғанына қарамастан, екі ақуыз да MNV-HiBiT репортерлік жүйесі арқылы MNV репликациясын тиімді басатыны расталды (Rasm 1C, 1D). Plscr1 экспрессиясы бар жасушаларда вирустық ақуыздар деңгейі өте төмен болды (Rasm 1E).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HeLa-CD300lf жасушаларында тышқан немесе адам PLSCR1 генінің шамадан тыс экспрессиясы MNV репликациясын басады, бұл вирус жүктемесі мен вирустық ақуыздар деңгейінің төмендеуімен расталады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"plscr1-in-vitro-zhaghdajynda-mnv-di-shekteu-ueshin-khazhet\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plscr1-in-vitro-zhaghdajynda-mnv-di-shekteu-ueshin-khazhet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Plscr1 in vitro жағдайында MNV-ді шектеу үшін қажет&lt;/span&gt;&lt;/a&gt;Plscr1 in vitro жағдайында MNV-ді шектеу үшін қажет&lt;/h4&gt;\n&lt;p&gt;PLSCR1-дің қажеттілігін тексеру үшін біз осы ген нокаут етілген HeLaΔPLSCR1-CD300lf жасушалар желісін жасадық (Rasm 1F). PLSCR1 болмаған кезде, HeLaΔPLSCR1-CD300lf жасушаларында MNV-HiBiT репликациясы бақылаумен салыстырғанда артты (Rasm 1G). PLSCR1 тікелей антивирустық агент пе, әлде интерферон жауабын күшейтуші ме, соны анықтау үшін біз IFN-α-ға сезімталдықты салыстырдық. Интерферонмен өңдеу PLSCR1 бар-жоғына қарамастан MNV репликациясын азайтты, бұл ретте EC₅₀ мәндері статистикалық тұрғыдан ерекшеленбеді (Rasm 1H). Бұл PLSCR1-дің интерферон сигналдық жолын модуляцияламай, тікелей антивирустық фактор ретінде жұмыс істейтінін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу in vitro жасушалық желілерінде жүргізілді; нәтижелер бүкіл ағзадағы вирус пен иммундық жүйе арасындағы күрделі өзара әрекеттесуді толық көрсетпеуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"plscr1-tapshylyghy-bar-tyshkhandarda-tokh-ishekte-mnv-replikaciyasynyng-birshama-oesui-bajkhalady\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plscr1-tapshylyghy-bar-tyshkhandarda-tokh-ishekte-mnv-replikaciyasynyng-birshama-oesui-bajkhalady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Plscr1 тапшылығы бар тышқандарда тоқ ішекте MNV репликациясының біршама өсуі байқалады&lt;/span&gt;&lt;/a&gt;Plscr1 тапшылығы бар тышқандарда тоқ ішекте MNV репликациясының біршама өсуі байқалады&lt;/h4&gt;\n&lt;p&gt;Интерферон сигналдық жолдары MNV инфекциясының in vivo динамикасын реттейді. Алайда, инфекцияны шектейтін нақты ISG эффекторлары жеткіліксіз зерттелген. Зерттеушілер Plscr1-/- тышқандарын пайдаланып, олардың MNV-ге сезімтал тіндеріндегі Plscr1 транскрипттерінің деңгейін бағалады. Жабайы типтегі тышқандарда Plscr1 экспрессиясы тоқ және мықын ішекте ең жоғары болды, ал нокаутталған тышқандарда транскрипттер анықталмады (Сурет 1I). MNVCW3-пен ауыз арқылы зақымданғаннан 3 күн өткен соң (Сурет 1J), вирус геномдары көкбауыр, бауыр және мезентериалды лимфа түйіндерінде (MLN) табылды. Жабайы типтегі тышқандардың ішектерінде вирус іс жүзінде анықталмады. Plscr1 тапшылығы бар тышқандарда көкбауыр, бауыр және MLN-дегі инфекция динамикасы бақылау тобымен бірдей болды, бірақ тоқ ішекте MNVCW3 мөлшерінің статистикалық тұрғыдан маңызды, алайда шамалы өсуі байқалды (Сурет 1J). Мықын ішекте де ұқсас үрдіс байқалды, бірақ ол статистикалық маңыздылыққа ие болмады. Бұл деректер Plscr1-дің тоқ ішекте MNVCW3 репликациясын тежейтінін көрсетеді, бірақ басқа ISG эффекторлары да қатысуы мүмкін.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-f1.jpg\" alt=\"1-сурет: Plscr1 MNV инфекциясын оңтайлы бақылау үшін қажет.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Plscr1 MNV инфекциясын оңтайлы бақылау үшін қажет.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет: Plscr1 MNV инфекциясын оңтайлы бақылау үшін қажет. (A) Үш түрлі скрининг бойынша сақталған «хиттерді» (оң нәтижелерді) көрсететін Венн диаграммасы. (B) Бос векторды немесе Plscr1 экспрессиялайтын HeLa-CD300lf жасушалары 0,05 инфекция көптігімен (MOI) MNVCW3 (сол жақта) немесе MNVCR6 (оң жақта) жұқтырылды. Вирустық өнімділік бляшка әдісімен (PFU; бляшка түзуші бірліктер) есептелді. (C) Тышқан немесе адам Plscr1 экспрессиялайтын HeLa-CD300lf жасушалары 48 сағат ішінде 0,5 MOI MNVCW3-HiBiT-пен зақымдалды. Инфекция Nano-Glo HiBiT Lytic Detection System (RLU; салыстырмалы люминесценция бірліктері) көмегімен сандық түрде анықталды. (D) Көрсетілген антиденелермен боялған, FLAG-белгісі бар тышқан (ms) немесе адам (hu) Plscr1 экспрессиялайтын HeLa-CD300lf жасушаларының өкілдік вестерн-блоты. (E) Векторлық бақылауды немесе Plscr1 экспрессиялайтын, 5,0 MOI MNVCW3-пен жұқтырылған және инфекциядан кейінгі көрсетілген сағаттарда (hpi) лизис жасалған HeLa-CD300lf жасушаларының өкілдік вестерн-блоты. (F) Интерферонмен өңделмеген, 1000 бірлік/мл интерферон α немесе 0,1 мкг/мл интерферон γ-мен өңделген және көрсетілген антиденелермен боялған HeLa-CD300lf немесе HeLaΔPlscr1-CD300lf жасушаларының өкілдік вестерн-блоты. (G) HeLa-CD300lf немесе HeLaΔPlscr1-CD300lf жасушалары 0,5 MOI MNVCW3-HiBiT-пен зақымдалды. 48 сағаттан кейін инфекция Nano-Glo HiBiT Lytic Detection System көмегімен сандық түрде анықталды. (H) HeLa-CD300lf немесе HeLaΔPlscr1-CD300lf жасушалары интерферон α-ның көрсетілген дозаларымен (бірлік/мл) өңделді, содан кейін 48 сағат ішінде 0,5 MOI MNVCW3-HiBiT-пен зақымдалды. Инфекция Nano-Glo HiBiT Lytic Detection System көмегімен сандық түрде анықталды. Көрсетілген жасуша түрлері үшін интерферон α-ның 50% тиімді концентрациясы (EC50) есептелді. (I) Plscr1+/+ (WT) немесе Plscr1-/- (KO) бір туысқан жануарлардағы көрсетілген тіндердегі Plscr1 экспрессиясы. Үзік сызық анықтау шегін көрсетеді. (J) Plscr1+/+ (WT) немесе Plscr1-/- (KO) бір туысқан жануарлар 1 x 10^6 PFU MNVCW3-пен жұқтырылды және инфекциядан 3 күн өткен соң эвтаназия жасалды. Тоқ ішек, мықын ішегі, шажырқай лимфа түйіндері (MLN), көкбауыр және бауыр MNV геном көшірмелері үшін qPCR арқылы талданды және актин бойынша қалыпқа келтірілді. Әрбір тін үшін скрипка диаграммасымен (violin plot) бірге жеке деректер нүктелері көрсетілген. Манн-Уитни тестінің P-мәндері келтірілген. Үзік сызық анықтау шегін көрсетеді. Барлық деректер үш тәуелсіз эксперименттің орташа мәні ± стандартты ауытқу ретінде ұсынылған және Тьюкидің көптік салыстыру тестімен бір факторлы дисперсиялық талдау (ANOVA) (B және C), T-тест (G) немесе Манн-Уитни тесті (J) көмегімен талданды. *P &amp;lt; 0,05, **P &amp;lt; 0,01, ***P &amp;lt; 0,001, ****P &amp;lt; 0,0001.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Plscr1 тапшылығы тоқ ішекте MNV репликациясының аздап артуына әкеледі, бұл ақуыздың ішінара қорғаныс функциясын білдіреді.&lt;br /&gt;\n[!warning] Зерттеу тышқандарда жүргізілді; нәтижелерді адамдарға тікелей қолдануға болмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"genetikalykh-skrining-plscr1-ge-toezimdilikti-khamtamasyz-etetin-vp2-oezgerisin-anykhtady\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#genetikalykh-skrining-plscr1-ge-toezimdilikti-khamtamasyz-etetin-vp2-oezgerisin-anykhtady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Генетикалық скрининг Plscr1-ге төзімділікті қамтамасыз ететін VP2 өзгерісін анықтады&lt;/span&gt;&lt;/a&gt;Генетикалық скрининг Plscr1-ге төзімділікті қамтамасыз ететін VP2 өзгерісін анықтады&lt;/h4&gt;\n&lt;p&gt;Plscr1 әсер ету механизмін зерттеу үшін MNVCR6 вирусы Plscr1 экспрессиялайтын HeLa-CD300lf жасушаларында 11 пассаж бойы бейімделді (Сурет 2A). Plscr1 қатысуымен 11 пассаждан өткен вирус (Plscr1 p11) бақылау тобымен салыстырғанда өсу артықшылығын көрсетті (Сурет 2B). Ампликондарды тізбектей талдау (Сурет 2C, Кесте SN) Plscr1 p11 популяциясында 30%-дан астам жиіліктегі үш генетикалық өзгерісті анықтады (Сурет 2D). Олардың екеуі миссенс-мутациялар (NS2F304L және VP2Q32R; Сурет 2E) болды. Бұл өзгерістерді MNVCR6 молекулалық клонына енгізу тек VP2Q32R мутациясы ғана вирусқа Plscr1 бар жасушаларда өсуге мүмкіндік беретінін көрсетті, бұл оның «қашу» мутациясы екенін растайды (Сурет 2F). Норовирус капсиді VP1 және VP2 ақуыздарынан тұрады. VP2-нің рөлі толық зерттелмегенімен, калицивирустар (FCV) бойынша деректер VP2-нің РНҚ-ның цитоплазмаға енуі үшін порталдық құрылым түзетінін болжайды. Q32R өзгерісінің осы порталдың жиналуына әсері алдағы зерттеулердің тақырыбы болып табылады.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-f2.jpg\" alt=\"Сурет 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 2&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Қашу» мутациясы — вирустың жасушалық қорғаныс тосқауылын, бұл жағдайда Plscr1 ақуызының әсерін жеңіп өтуге мүмкіндік беретін генетикалық өзгеріс.&lt;br /&gt;\n[!tip] Ампликондарды тізбектей талдау — вирустың бейімделу процесінде пайда болған мутацияларды тез анықтауға мүмкіндік беретін әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"plscr1-mnv-nyng-zhasushagha-enuin-bekitiluden-kejingi-kezengde-shekteu-ueshin-membranamen-aerekettesetin-ajmakhtardy-khazhet-etedi\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plscr1-mnv-nyng-zhasushagha-enuin-bekitiluden-kejingi-kezengde-shekteu-ueshin-membranamen-aerekettesetin-ajmakhtardy-khazhet-etedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Plscr1 MNV-ның жасушаға енуін бекітілуден кейінгі кезеңде шектеу үшін мембранамен әрекеттесетін аймақтарды қажет етеді&lt;/span&gt;&lt;/a&gt;Plscr1 MNV-ның жасушаға енуін бекітілуден кейінгі кезеңде шектеу үшін мембранамен әрекеттесетін аймақтарды қажет етеді&lt;/h4&gt;\n&lt;p&gt;VP2 ақуызы вирустың енуіне де, жиналуына да қатысатындықтан, ену кезеңін айналып өту тәжірибесі жүргізілді. MNVCW3 вирустық РНҚ-сын Plscr1 экспрессиялайтын HeLa жасушаларына трансфекциялау вирус титрлерін бақылау жасушаларының деңгейіне дейін қалпына келтірді (3A-сурет). Бұл Plscr1-дің дәл MNV ену сатысын тежейтінін растайды. Вирустың жасушалармен байланысуын талдау CD300lf экспрессиясы MNV байланысуын айтарлықтай арттыратынын көрсетті, алайда Plscr1-дің болуы CD300lf бар-жоғына қарамастан бұл процеске әсер етпеді (3B-сурет). Бұл Plscr1-дің байланысудан кейінгі ену сатысын блоктайтынын көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Plscr1 MNV-ның жасушаға бекітілуінен кейінгі кезеңде енуін блоктайды, оның вирусқа қарсы белсенділігі CD300lf рецепторымен байланысу қабілетіне тәуелді емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Plscr1 әсер ету механизмдерін зерттеу үшін ақуыздың мутантты формалары тексерілді. Ядролық локализация сайтындағы мутация (267AISAA271) ақуыз экспрессиясының төмендеуіне әкелді, сондықтан ол талдаудан шығарылды. Әдебиеттерге сәйкес, скрамблаза белсенділігін жоғалтатын Plscr1F290A мутанты HeLa-CD300lf жасушаларында MNV репликациясын блоктай алу қабілетін сақтап қалды (3D және 3E-суреттер). Керісінше, пальмитоилдену сайтының бұзылуы (Plscr1PalmA мутанты, 193AAFPAA198) Plscr1-дің MNV-ны шектеу қабілетін айтарлықтай әлсіретті (3D және 3E-суреттер).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Пальмитоилдену — бұл ақуызға май қышқылдарын қосу процесі, ол ақуыздың жасуша мембранасына берік бекітілуіне көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу HeLa жасушалық желілерінде жүргізілді; нәтижелер мембраналық ассоциация мен вирусқа қарсы әсер арасындағы корреляцияны көрсетеді, бірақ барлық жасуша түрлері үшін себеп-салдарлық байланысты дәлелдемейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Зерттеушілер сонымен қатар адамдардағы COVID-19 ауырлығымен байланысты PLSCR1 полиморфизмдерінің әсерін зерттеді. PLSCR1-дің 262-позициясында гистидин, тирозин немесе глутамин бар нұсқалары MNV репликациясын бірдей деңгейде шектеді (3F және 3H-суреттер). «Адамдық» полиморфизмді (тирозин) тышқан Plscr1-іне енгізу де оның вирусқа қарсы белсенділігін төмендетпеді (3G және 3H-суреттер). Осылайша, Plscr1-дің MNV-ны шектеу механизмі SARS-CoV-2-ге қарсы әсер ету механизмінен ерекшеленеді, өйткені ол 262-позициядағы полиморфизмдерге сезімтал емес.&lt;/p&gt;\n&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;h4 id=\"plscr1-akhuyzy-arkhyly-mnv-virusynyng-enuin-shekteu-mehanizmi\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plscr1-akhuyzy-arkhyly-mnv-virusynyng-enuin-shekteu-mehanizmi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PLSCR1 ақуызы арқылы MNV вирусының енуін шектеу механизмі&lt;/span&gt;&lt;/a&gt;PLSCR1 ақуызы арқылы MNV вирусының енуін шектеу механизмі&lt;/h4&gt;\n&lt;p&gt;Бұл зерттеуде PLSCR1 ақуызы қабықшасы жоқ тышқан норовирусының (MNV) енуін тежейтіні анықталды. Тежелу процесі вирус жасушаға бекінгеннен кейінгі кезеңде жүреді (Сурет 3A, 3B). VP2 ақуызындағы бір нүктелі мутация (VP2Q32R) вирусқа бұл кедергіні жеңуге мүмкіндік береді (Сурет 2F). VP2 вирус РНҚ-сын эндосомадан цитоплазмаға мембрананы тесу арқылы жеткізетін арна түзеді деп есептесек, PLSCR1 эндоцитарлы мембраналардың қасиеттерін өзгертіп, РНҚ-ның шығуын бөгейді деп болжаймыз. Q32R мутациясы бұл кедергіні қалай айналып өтетіні әзірге белгісіз, бірақ бұл өзгеріс процесті зерттеу үшін генетикалық құрал ретінде қызмет етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PLSCR1 қабықшасыз MNV вирусының енуін шектейді, бұл оны қабықшалы вирустарға қарсы қорғаныс механизмдерімен байланыстырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ISG (интерферонмен ынталандырылған гендер) — инфекциялармен күресу үшін интерферон әсерінен белсенділігі артатын гендер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"plscr1-ding-tua-bitken-immunitet-zhuejesindegi-roeli\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plscr1-ding-tua-bitken-immunitet-zhuejesindegi-roeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PLSCR1-дің туа біткен иммунитет жүйесіндегі рөлі&lt;/span&gt;&lt;/a&gt;PLSCR1-дің туа біткен иммунитет жүйесіндегі рөлі&lt;/h4&gt;\n&lt;p&gt;PLSCR1 in vitro жағдайында MNV-ні тиімді басу үшін қажет болғанымен, оның жоқтығы I типті интерферон жауабында айтарлықтай өзгерістерге әкелмеді (Сурет 1H). Бұл MNV-ні шектейтін басқа ISG-лердің бар екенін көрсетеді. Plscr1 тапшылығы бар тышқандарда тоқ ішектегі MNVCW3 вирус жүктемесі тек аздап қана өскен (Сурет 1J). Біздің деректеріміз, соның ішінде IFITM2-нің анықталуы, PLSCR1-дің интерферон арқылы қоздырылатын кеңірек қорғаныс тосқауылының бір бөлігі екенін растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу жасушалық дақылдар мен тышқан модельдері негізінде жүргізілді; жануарлардағы нәтижелер әрқашан адамға тікелей қатысты болмауы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"plscr1-funkcionaldy-domenderi-zhaene-virus-specifikasy\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plscr1-funkcionaldy-domenderi-zhaene-virus-specifikasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PLSCR1 функционалды домендері және вирус спецификасы&lt;/span&gt;&lt;/a&gt;PLSCR1 функционалды домендері және вирус спецификасы&lt;/h4&gt;\n&lt;p&gt;Біз MNV-ні шектеу үшін фосфолипидті скрамблаза белсенділігі емес, бүтін пальмитоилдену мотиві қажет екенін анықтадық (Сурет 3D). Пальмитоилденуге тәуелділік SARS-CoV-2-ні басу кезінде де байқалады. Алайда, PLSCR1-дің H262 және Y262 нұсқалары MNV-ні бірдей деңгейде шектейді, бұл әртүрлі вирустарға қарсы қорғаныс механизмдеріндегі айырмашылықтарды көрсетеді. Осылайша, PLSCR1 вирустардың ену стратегияларына қарамастан, іргелі түрде ерекшеленетін вирустар кластарына ортақ шектеулер қояды.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"zhasusha-zhelileri-zhaene-oesiru\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#zhasusha-zhelileri-zhaene-oesiru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жасуша желілері және өсіру&lt;/span&gt;&lt;/a&gt;Жасуша желілері және өсіру&lt;/h4&gt;\n&lt;p&gt;293T, HeLa және BV2 жасушалары 5% фетальды бұзау сарысуы қосылған DMEM ортасында өсірілді. Тұрақты гиперэкспрессиясы бар жасуша желілері лентивирустық трансдукция әдісімен алынды. Лентивирустық плазмидалар, орау векторы (psPax2) және псевдотиптеу векторы (pCMV-VSV-G) PEI көмегімен 293T жасушаларына енгізілді. 48 сағаттан кейін вирус жиналып, 0,45 мкм сүзгі арқылы өткізілді және нысаналы жасушаларға қосылды. Тағы 48 сағаттан соң орта тиісті антибиотиктермен (350 мкг/мл гигромицин немесе 5 мкг/мл бластицидин және/немесе 1 мкг/мл пуромицин) ауыстырылды. Барлық желілер микоплазманың жоқтығына тұрақты тексерілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Лентивирустық трансдукция — бұл генетикалық материалды вирус арқылы жасуша геномына енгізу әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;HeLaΔPlscr1 желісін жасау үшін HeLa жасушалары PLSCR1 геніне бағыттаушы РНК-сы бар pSpCas9(BB)-2A-Blast және pSpCas9(BB)-2A-Puro плазмидаларымен трансфекцияланды. 48 сағаттан кейін жасушалар екі күн бойы 5 мкг/мл бластицидин және 1 мкг/мл пуромицин ортасында ұсталып, содан кейін антибиотиксіз ортаға ауыстырылды. Жеке жасушалық клондар бөлініп алынды, геномдық ДНҚ бөлінді және &lt;a href=\"concepts/sekvenirovanie-po-sengeru.html\"&gt;Сэнгер секвенирлеуі&lt;/a&gt; арқылы талданды. Нәтижесінде стоп-кодондарға әкелетін делециялары бар аллельдер анықталды.&lt;/p&gt;\n&lt;h4 id=\"virustykh-taldaular\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#virustykh-taldaular\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вирустық талдаулар&lt;/span&gt;&lt;/a&gt;Вирустық талдаулар&lt;/h4&gt;\n&lt;p&gt;MNVCW3, MNVCR6 және олардың мутанттары 293T жасушаларына трансфекциялау және BV2 жасушаларында көбейту арқылы алынды. Инфекция үшін HeLa-CD300lf жасушалары 96-ұяшықты планшеттерге егіліп, 0,05 MOI (инфекция көптігі) деңгейінде вирустандырылды. Планшеттер 1 сағат бойы бөлме температурасында шайқалып, 37°C және 5% CO2 жағдайында инкубацияланды. Вирус титрлері бляшка әдісімен анықталды. MNV-HiBiT талдауларында 0,5 немесе 5 MOI қолданылды, люминесценттік белсенділік Synergy LX құрылғысы және Nano-Glo HiBiT жүйесі арқылы өлшенді.&lt;/p&gt;\n&lt;h4 id=\"plazmidalykh-khurylymdar\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plazmidalykh-khurylymdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Плазмидалық құрылымдар&lt;/span&gt;&lt;/a&gt;Плазмидалық құрылымдар&lt;/h4&gt;\n&lt;p&gt;Plscr1 (тышқан және адам) кДНҚ-сы және мутациялар N-терминалды 3xFLAG белгісімен pCDH-EF1-MCS-IRES-Puro векторына клондалды. MNV молекулалық клондары GenBank (EF014462.1 және JQ237823) деректеріне сәйкес келеді. Барлық плазмидалар қолданылар алдында толық секвенирлеуден өтті.&lt;/p&gt;\n&lt;h4 id=\"immunoblotting\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#immunoblotting\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Иммуноблоттинг&lt;/span&gt;&lt;/a&gt;Иммуноблоттинг&lt;/h4&gt;\n&lt;p&gt;Laemmli буферінде лизис жасалған үлгілер SDS-PAGE әдісімен бөлініп, PVDF мембраналарына ауыстырылды. Мембраналар 5% сүт ұнтағымен блокталды және тиісті антиденелермен (Plscr1, GAPDH, FLAG, STAT1, фосфо-STAT1) және MNV ақуыздарына қарсы антиденелермен инкубацияланды.&lt;/p&gt;\n&lt;h4 id=\"tyshkhandardy-zhukhtyru\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#tyshkhandardy-zhukhtyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тышқандарды жұқтыру&lt;/span&gt;&lt;/a&gt;Тышқандарды жұқтыру&lt;/h4&gt;\n&lt;p&gt;Жануарларға қатысты зерттеулер Техас университетінің Оңтүстік-батыс медициналық орталығының (UT Southwestern) Жануарларды күту және пайдалану жөніндегі комитетінің бақылауымен жүргізілді. Plscr1-/- тышқандары мен бақылау тобы ретінде олардың бір тумалас серіктері SPF (спецификалық патогендерден таза) жағдайында ұсталды. Жануарлар ауыз арқылы 1 × 10⁶ БОЕ (PFU) MNVCW3 вирусымен жұқтырылды және дереу жеке торларға бөлінді. 3 күннен кейін тышқандар эвтаназияланды және тіндер 1 мм-лік силикат шарларының көмегімен TRIzol ортасында гомогенизацияланды. РНҚ бөлініп алынды және кДНҚ синтезі үшін пайдаланылды. Вирустық геном, актин және Plscr1 көшірмелерінің мөлшері нақты уақыт режиміндегі ПТР (qPCR) әдісімен арнайы праймерлер мен зондтар арқылы бағаланды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нақты уақыт режиміндегі ПТР (qPCR) — бұл үлгідегі ДНҚ немесе РНҚ көшірмелерінің мөлшерін амплификация процесі кезінде нақты уақытта анықтауға мүмкіндік беретін молекулалық биологиялық әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"plscr1-toezimdiligin-anykhtaugha-arnalghan-tikelej-genetikalykh-skrining\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plscr1-toezimdiligin-anykhtaugha-arnalghan-tikelej-genetikalykh-skrining\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Plscr1 төзімділігін анықтауға арналған тікелей генетикалық скрининг&lt;/span&gt;&lt;/a&gt;Plscr1 төзімділігін анықтауға арналған тікелей генетикалық скрининг&lt;/h4&gt;\n&lt;p&gt;Тәжірибелер BSL2 жағдайында өткізілді. Вектор немесе Plscr1 экспрессиялайтын HeLa-CD300lf жасушалары (2 × 10⁶) MNVCR6 вирусымен 0,05 MOI (жұқтыру көптігі) деңгейінде жұқтырылды. Әр 48–72 сағат сайын вирус пассаждалды (барлығы 11 рет). Соңғы пассаждан кейін вирустық супернатанттан РНҚ бөлініп алынды, кДНҚ синтезделді және MNV геномының 250–3000 жұп негіздік фрагменттері ПТР арқылы күшейтіліп, секвенирленді. Деректер MNVCR6 WT клонымен салыстырылды; Plscr1-ге тән мутацияларды анықтау үшін Plscr1 тобындағы сәйкессіздік пайызынан вектор тобындағы сәйкессіздік пайызы алынып тасталды. Нәтижелер нуклеотидтерді анықтау сенімділігін көрсететін Phred Q көрсеткішімен салыстырылды.&lt;/p&gt;\n&lt;h4 id=\"enu-satysyn-ajnalyp-oetu-taldauy\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#enu-satysyn-ajnalyp-oetu-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ену сатысын айналып өту талдауы&lt;/span&gt;&lt;/a&gt;Ену сатысын айналып өту талдауы&lt;/h4&gt;\n&lt;p&gt;MNVCW3-тен бөлініп алынған 4 мкг вирустық РНҚ, бос вектор немесе тышқан Plscr1 экспрессиялайтын HeLa жасушаларына Lipofectamine 3000 көмегімен трансфекцияланды. Маңыздысы, бұл жасушалар CD300lf рецепторын экспрессияламайды, бұл көп циклді инфекциялардың алдын алады. 24 сағаттық инкубациядан кейін үлгілер -80°C-та мұздатылды және вирус титрлері бляшка әдісімен анықталды.&lt;/p&gt;\n&lt;h4 id=\"virustyng-bajlanysuyn-taldau\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#virustyng-bajlanysuyn-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вирустың байланысуын талдау&lt;/span&gt;&lt;/a&gt;Вирустың байланысуын талдау&lt;/h4&gt;\n&lt;p&gt;2,5 × 10⁵ жасуша 1,6 × 10⁹ БОЕ MNVCR6 вирусымен 5% FBS қосылған DMEM ортасында 4°C температурада 1 сағат бойы араластырылды. Центрифугалаудан (500 g, 5 минут) кейін жасушалар үш рет суық PBS-пен жуылды. Байланысқан вирусты сандық анықтау үшін жасушалардан РНҚ бөлініп алынды және жоғарыда сипатталғандай qPCR өткізілді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-fS1.jpg\" alt=\"Сурет S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-fS2.jpg\" alt=\"Қосымша сурет 2: Қолжазбада пайдаланылған түпнұсқа вестерн-блоттар. 3-суретте бейнеленген блоттарға сәйкес келетін өзгер\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қосымша сурет 2: Қолжазбада пайдаланылған түпнұсқа вестерн-блоттар. 3-суретте бейнеленген блоттарға сәйкес келетін өзгертілмеген иммуноблот хемилюминесценция кескіндері.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Норовирустың&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жасушаға ену&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;механизмі&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Тышқандарда&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Plscr1 генін&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нокауттау&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Plscr1 вирус&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;енуін&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;блоктайды&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stro
