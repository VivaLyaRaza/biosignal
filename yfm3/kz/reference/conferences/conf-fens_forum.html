        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференциялар&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;европейский форум нейронаук&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-fens_forum.jpg\" alt=\"FENS Forum\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;европейский форум нейронаук&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не аламыз&lt;/td&gt;\n&lt;td&gt;европейские лаборатории нейронауки&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-brain.html\"&gt;Ми және жүйке жүйесі&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"bul-khandaj-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-fens_forum.html#bul-khandaj-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қандай конференция&lt;/span&gt;&lt;/a&gt;Бұл қандай конференция&lt;/h2&gt;\n&lt;p&gt;FENS Forum (Еуропалық нейроғылымдар форумы) — ми мен жүйке жүйесін зерттеуге арналған Еуропадағы ең ірі ғылыми конференция. Іс-шара нейрондардың жұмыс істеу механизмдерін, ми патологияларын және оларды емдеу әдістерін талқылау үшін әлемнің түкпір-түкпірінен мыңдаған зерттеушілерді біріктіреді. Бұл молекулярлық процестерден бастап күрделі когнитивті функцияларға дейінгі нейроғылымдардың өзекті күн тәртібі қалыптасатын алаң.&lt;/p&gt;\n&lt;h2 id=\"ujymdastyrushylar-zhaene-tarihy\"&gt;&lt;a href=\"reference/conferences/conf-fens_forum.html#ujymdastyrushylar-zhaene-tarihy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйымдастырушылар және тарихы&lt;/span&gt;&lt;/a&gt;Ұйымдастырушылар және тарихы&lt;/h2&gt;\n&lt;p&gt;Конференция Еуропалық нейроғылыми қоғамдар федерациясының (FENS) қолдауымен өткізіледі. Ұйым ұлттық нейробиологтар қоғамдастықтарының жұмысын үйлестіреді және Еуропа зертханалары арасында білім алмасуға ықпал етеді. FENS Forum екі жылда бір рет өткізіледі және әр жолы қабылдаушы қаланы ауыстырып отырады, бұл Еуропаның әртүрлі ғылыми орталықтарын талқылауға тартуға мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"takhyryptar-men-sekciyalar\"&gt;&lt;a href=\"reference/conferences/conf-fens_forum.html#takhyryptar-men-sekciyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тақырыптар мен секциялар&lt;/span&gt;&lt;/a&gt;Тақырыптар мен секциялар&lt;/h2&gt;\n&lt;p&gt;Форум бағдарламасы нейроғылымдардың барлық аспектілерін қамтиды. Негізгі бағыттар:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Молекулярлық және жасушалық нейробиология: Альцгеймер ауруы сияқты нейродегенерация механизмдерін зерттеу.&lt;/li&gt;\n&lt;li&gt;Мидың дамуы: Гоше ауруы сияқты генетикалық аурулар және ерте жастағы стресстің ми байланыстарына әсері.&lt;/li&gt;\n&lt;li&gt;Когнитивті нейроғылым: мидың естеліктерді қалай сақтайтыны, визуалды бейнелерді қалай қайта жаңғыртатыны немесе афантазияның себептері.&lt;/li&gt;\n&lt;li&gt;Терапевтік стратегиялар: гендік терапия және жасушалар арасындағы уытты ақуыздардың алмасу механизмдері.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"onda-ne-pajda-bolady\"&gt;&lt;a href=\"reference/conferences/conf-fens_forum.html#onda-ne-pajda-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Онда не пайда болады&lt;/span&gt;&lt;/a&gt;Онда не пайда болады&lt;/h2&gt;\n&lt;p&gt;FENS Forum серпінді зерттеулердің алғашқы таныстырылым орны болып табылады. Ғалымдар мұнда «мини-ми» тәжірибелерінің нәтижелерін, жұмыс жады бойынша fMRI талдауларын және тәуелділікті емдеудің жаңа тәсілдерін ұсынады. Сондай-ақ, конференция академиялық ортадағы гендерлік теңсіздік сияқты жүйелі мәселелерді талқылау үшін платформа қызметін атқарады.&lt;/p&gt;\n&lt;h2 id=\"khalaj-bakhylaugha-zhaene-khatysugha-bolady\"&gt;&lt;a href=\"reference/conferences/conf-fens_forum.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай бақылауға және қатысуға болады&lt;/span&gt;&lt;/a&gt;Қалай бақылауға және қатысуға болады&lt;/h2&gt;\n&lt;p&gt;Форумға қатысу кәсіби нейробиологтар, аспиранттар мен студенттер үшін ашық. Бағдарлама пленарлық дәрістерді, симпозиумдар мен постерлік сессияларды қамтиды. Жеке қатыса алмайтындар үшін FENS баяндама тезистеріне және European Journal of Neuroscience сияқты бейінді журналдардағы жарияланымдарға қолжетімділікті қамтамасыз етеді. Хабарландыруларды федерацияның ресми порталында бақылауға болады.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/conferences/conf-fens_forum.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%90%D0%B2%D1%82%D0%BE%D0%BC%D0%BE%D0%B1%D0%B8%D0%BB%D0%B8%D1%81%D1%82%D1%8B_%D0%B4%D0%BB%D1%8F_%D1%81%D0%B5%D0%B1%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Автомобилисты для себя — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:IBRO_logo_main_2022.png\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Carolaraujos, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1111/ejn.12644\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Neural and psychological mechanisms underlying compulsive drug seeking habits and drug memories--indications for novel treatments of addiction&lt;/a&gt; — шолу, Eur J Neurosci 2014&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3389/fnhum.2019.00180\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Neural Correlates of Verbal Working Memory: An fMRI Meta-Analysis&lt;/a&gt; — шолу, Front Hum Neurosci 2019&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.neuron.2021.06.002\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Gender bias in academia: A lifetime problem that needs solutions&lt;/a&gt; — шолу, Neuron 2021&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференциялар&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"европейский форум нейронаук"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"FENS Forum","description":"европейский форум нейронаук","vcsPath":"reference/conferences/conf-fens_forum.md"},"headings":[{"title":"Бұл қандай конференция","href":"reference/conferences/conf-fens_forum.html#bul-khandaj-konferenciya","level":2},{"title":"Ұйымдастырушылар және тарихы","href":"reference/conferences/conf-fens_forum.html#ujymdastyrushylar-zhaene-tarihy","level":2},{"title":"Тақырыптар мен секциялар","href":"reference/conferences/conf-fens_forum.html#takhyryptar-men-sekciyalar","level":2},{"title":"Онда не пайда болады","href":"reference/conferences/conf-fens_forum.html#onda-ne-pajda-bolady","level":2},{"title":"Қалай бақылауға және қатысуға болады","href":"reference/conferences/conf-fens_forum.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady","level":2},{"title":"Дереккөздер","href":"reference/conferences/conf-fens_forum.html#derekkoezder","level":2}],"title":"FENS Forum"},"router":{"pathname":"reference/conferences/conf-fens_forum","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
