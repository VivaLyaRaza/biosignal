        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференциялар&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Американское общество гематологии&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-ash_annual_meeting.jpg\" alt=\"ASH Annual Meeting\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;Американское общество гематологии&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не аламыз&lt;/td&gt;\n&lt;td&gt;лейкозы, лимфомы, клеточная терапия&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-cancer.html\"&gt;Қатерлі ісік және онкология&lt;/a&gt;, &lt;a href=\"concepts/spec-medicine.html\"&gt;Медицина және денсаулық&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"bul-khandaj-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-ash_annual_meeting.html#bul-khandaj-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қандай конференция&lt;/span&gt;&lt;/a&gt;Бұл қандай конференция&lt;/h2&gt;\n&lt;p&gt;ASH Annual Meeting — Америкалық гематология қоғамы (American Society of Hematology) ұйымдастыратын жыл сайынғы ғылыми конференция. Бұл қан және онымен байланысты ауруларды зерттеуге арналған әлемдегі ең ірі іс-шара. Конференция ғалымдар, гематолог дәрігерлер және биотехнологиялық компаниялар өкілдері арасында деректер алмасу үшін басты алаң болып табылады. Мұнда қан ауруларының даму механизмдері мен жаңа емдеу әдістерінің клиникалық сынақ нәтижелері талқыланады.&lt;/p&gt;\n&lt;h2 id=\"ujymdastyrushylar-zhaene-tarihy\"&gt;&lt;a href=\"reference/conferences/conf-ash_annual_meeting.html#ujymdastyrushylar-zhaene-tarihy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйымдастырушылар және тарихы&lt;/span&gt;&lt;/a&gt;Ұйымдастырушылар және тарихы&lt;/h2&gt;\n&lt;p&gt;Ұйымдастырушы — Америкалық гематология қоғамы, ол бүкіл әлемдегі мыңдаған мамандарды біріктіретін кәсіби ұйым. Қоғам гематология саласындағы зерттеулерді ілгерілетуді, медициналық көмек сапасын жақсартуды және білім беру бағдарламаларын қолдауды мақсат етеді. Конференция жыл сайын өткізіліп, ондаған мың қатысушыны жинайды, бұл оны әлемдік онкогематология күнтізбесіндегі орталық оқиғаға айналдырады.&lt;/p&gt;\n&lt;h2 id=\"takhyryptar-men-sekciyalar\"&gt;&lt;a href=\"reference/conferences/conf-ash_annual_meeting.html#takhyryptar-men-sekciyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тақырыптар мен секциялар&lt;/span&gt;&lt;/a&gt;Тақырыптар мен секциялар&lt;/h2&gt;\n&lt;p&gt;Ғылыми бағдарлама молекулалық биологиядан бастап клиникалық тәжірибеге дейінгі кең ауқымды қамтиды. Негізгі бағыттарға мыналар жатады:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Лейкоздар, лимфомалар және миелома ауруы: қан жасушаларының қатерлі өзгеру механизмдерін зерттеу.&lt;/li&gt;\n&lt;li&gt;Жасушалық терапия: CAR-T технологияларын дамыту, мұнда пациенттің иммундық жасушалары қатерлі ісікпен күресу үшін қайта бағдарламаланады.&lt;/li&gt;\n&lt;li&gt;Діңгекті жасушаларды трансплантациялау: миелодиспластикалық синдромдарды (МДС) және басқа да клоналды ауруларды емдеу әдістері.&lt;/li&gt;\n&lt;li&gt;Генетика және диагностика: патологияларды ерте анықтау үшін молекулалық маркерлерді пайдалану.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"onda-ne-pajda-bolady\"&gt;&lt;a href=\"reference/conferences/conf-ash_annual_meeting.html#onda-ne-pajda-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Онда не пайда болады&lt;/span&gt;&lt;/a&gt;Онда не пайда болады&lt;/h2&gt;\n&lt;p&gt;ASH Annual Meeting-те маңызды клиникалық зерттеулердің нәтижелері алғаш рет ұсынылады. Дәл осы жерде ғылыми қоғамдастық жаңа мақсатты препараттардың тиімділігі, жасушалық терапия сынақтары (мысалы, CD19-бағытталған CAR-T жасушалары) және трансплантациялаудың жаңа хаттамалары туралы біледі. Конференция әлемдік клиникалық тәжірибеге енгізілетін емдеу стандарттарын белгілейді. Мұнда ісіктің микроортасы, соның ішінде бактериялық флора мен иммундық жасушалардың аурулардың өршуіне қалай әсер ететіні туралы жаңалықтар талқыланады.&lt;/p&gt;\n&lt;h2 id=\"khalaj-bakhylaugha-zhaene-khatysugha-bolady\"&gt;&lt;a href=\"reference/conferences/conf-ash_annual_meeting.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай бақылауға және қатысуға болады&lt;/span&gt;&lt;/a&gt;Қалай бақылауға және қатысуға болады&lt;/h2&gt;\n&lt;p&gt;Конференцияға медицина және биология саласындағы мамандар қатыса алады. Кең аудитория үшін Америкалық гематология қоғамы ресми сайтта баспасөз хабарламалары мен негізгі баяндамалардың түйіндерін жариялайды. Іс-шара аяқталғаннан кейін қан қатерлі ісігімен күресу әдістері мен іргелі зерттеулердің нәтижелері бойынша өзекті деректерді қамтитын тезистер жинағы жарияланады.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/conferences/conf-ash_annual_meeting.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9C%D0%B8%D0%B5%D0%BB%D0%BE%D0%B4%D0%B8%D1%81%D0%BF%D0%BB%D0%B0%D1%81%D1%82%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B8%D0%B9_%D1%81%D0%B8%D0%BD%D0%B4%D1%80%D0%BE%D0%BC\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Миелодиспластический синдром — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Hypogranular_neutrophil_with_a_pseudo-Pelger-Huet_nucleus_in_MDS.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: The Armed Forces Institute of Pathology (AFIP), Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1182/blood-2016-02-629063\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;CD19-targeted CAR T-cell therapeutics for hematologic malignancies: interpreting clinical outcomes to date&lt;/a&gt; — шолу, Blood 2016&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3389/fimmu.2022.927153\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;CAR-T Cell Therapy in Hematological Malignancies: Current Opportunities and Challenges&lt;/a&gt; — шолу, Front Immunol 2022&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1182/blood-2016-06-724500\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Allogeneic hematopoietic stem cell transplantation for MDS and CMML: recommendations from an international expert panel&lt;/a&gt; — шолу, Blood 2017&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференциялар&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Американское общество гематологии"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"ASH Annual Meeting","description":"Американское общество гематологии","vcsPath":"reference/conferences/conf-ash_annual_meeting.md"},"headings":[{"title":"Бұл қандай конференция","href":"reference/conferences/conf-ash_annual_meeting.html#bul-khandaj-konferenciya","level":2},{"title":"Ұйымдастырушылар және тарихы","href":"reference/conferences/conf-ash_annual_meeting.html#ujymdastyrushylar-zhaene-tarihy","level":2},{"title":"Тақырыптар мен секциялар","href":"reference/conferences/conf-ash_annual_meeting.html#takhyryptar-men-sekciyalar","level":2},{"title":"Онда не пайда болады","href":"reference/conferences/conf-ash_annual_meeting.html#onda-ne-pajda-bolady","level":2},{"title":"Қалай бақылауға және қатысуға болады","href":"reference/conferences/conf-ash_annual_meeting.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady","level":2},{
