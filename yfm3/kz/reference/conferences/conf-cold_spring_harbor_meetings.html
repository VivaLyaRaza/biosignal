        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференциялар&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;встречи лаборатории Колд-Спринг-Харбор (она же ведёт bioRxiv)&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;встречи лаборатории Колд-Спринг-Харбор (она же ведёт bioRxiv)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не аламыз&lt;/td&gt;\n&lt;td&gt;геномика, нейронаука, рак&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-genes.html\"&gt;Гендер мен геномдар&lt;/a&gt;, &lt;a href=\"concepts/spec-brain.html\"&gt;Ми және жүйке жүйесі&lt;/a&gt;, &lt;a href=\"concepts/spec-cancer.html\"&gt;Қатерлі ісік және онкология&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"bul-khandaj-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-cold_spring_harbor_meetings.html#bul-khandaj-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қандай конференция&lt;/span&gt;&lt;/a&gt;Бұл қандай конференция&lt;/h2&gt;\n&lt;p&gt;Cold Spring Harbor Meetings — Нью-Йорк штатындағы Колд-Спринг-Харбор (CSHL) зертханасының базасында өткізілетін ғылыми конференциялар сериясы. Бұл кездесулер әлемдік ғылымдағы ең беделді алаңдардың бірі болып саналады, онда биология мен медицина саласындағы озық жетістіктер талқыланады. Жаппай конгрестерден айырмашылығы, CSHL кездесулері көбінесе камералық және бағытталған сипатқа ие, бұл жетекші сарапшылар мен жас зерттеушілер арасында терең деректер алмасуға ықпал етеді.&lt;/p&gt;\n&lt;h2 id=\"ujymdastyrushylar-men-tarihy\"&gt;&lt;a href=\"reference/conferences/conf-cold_spring_harbor_meetings.html#ujymdastyrushylar-men-tarihy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйымдастырушылар мен тарихы&lt;/span&gt;&lt;/a&gt;Ұйымдастырушылар мен тарихы&lt;/h2&gt;\n&lt;p&gt;Колд-Спринг-Харбор зертханасы — Лонг-Айлендтегі Лорел-Холлоу қаласында орналасқан жеке коммерциялық емес зерттеу ұйымы. Зертхана тарихы молекулалық биологияның дамуымен тығыз байланысты. Бүгінгі таңда CSHL тек іргелі зерттеулер орталығы ғана емес, сонымен қатар ғылыми коммуникация үшін негізгі хаб болып табылады, оның ішінде ғалымдар өз жұмыстарын журналдарда ресми рецензиядан өткенге дейін жариялайтын bioRxiv платформасын қолдауды қамтиды.&lt;/p&gt;\n&lt;h2 id=\"takhyryptar-men-sekciyalar\"&gt;&lt;a href=\"reference/conferences/conf-cold_spring_harbor_meetings.html#takhyryptar-men-sekciyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тақырыптар мен секциялар&lt;/span&gt;&lt;/a&gt;Тақырыптар мен секциялар&lt;/h2&gt;\n&lt;p&gt;Конференциялар бағдарламасы зертхананың негізгі бағыттарын қамтиды: геномика, нейроғылым, онкология, сандық биология және ботаника. Кездесу тақырыптары көбінесе қазіргі заманғы медицинаның өзекті мәселелерімен қиылысады. Мысалы, конференцияларда глиобластоманың даму механизмдері және оны холестерин алмасуы сияқты метаболикалық жолдар арқылы жеңу жолдары талқыланады. Сондай-ақ, сирек кездесетін аурулардың генетикалық негіздері, ішек микробиомының қатысуымен ісіктердің метастаздану механизмдері және қатерлі ісікпен күресудің иммунологиялық стратегиялары, соның ішінде реттеуші Т-жасушаларын қайта бағдарламалау назарда.&lt;/p&gt;\n&lt;h2 id=\"ol-zherde-ne-pajda-bolady\"&gt;&lt;a href=\"reference/conferences/conf-cold_spring_harbor_meetings.html#ol-zherde-ne-pajda-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ол жерде не пайда болады&lt;/span&gt;&lt;/a&gt;Ол жерде не пайда болады&lt;/h2&gt;\n&lt;p&gt;CSHL конференциялары жаңа идеялар үшін «инкубатор» қызметін атқарады. Дәл осы жерде медициналық кескіндерді талдау үшін жасанды интеллект әдістерін қолданатын зерттеу нәтижелері немесе естеліктерді сақтауға жауапты мидың нейрондық желілерін зерттеудің жаңа тәсілдері алғаш рет айтылады. Қатысушылар пациенттердің жасушаларынан өсірілген «мини-ми» (органоидтар) көмегімен алынған деректерді немесе инвазивті биопсияны алмастыра алатын гормон метаболиттеріне арналған қан талдауының нәтижелерін ұсынады. Сондай-ақ, мұнда кейбір адамдардың неліктен сепсис сияқты қабыну процестеріне басқаларға қарағанда осал екенін түсінуге көмектесетін популяциялардың генетикалық зерттеулері талқыланады.&lt;/p&gt;\n&lt;h2 id=\"khalaj-bakhylaugha-zhaene-khatysugha-bolady\"&gt;&lt;a href=\"reference/conferences/conf-cold_spring_harbor_meetings.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай бақылауға және қатысуға болады&lt;/span&gt;&lt;/a&gt;Қалай бақылауға және қатысуға болады&lt;/h2&gt;\n&lt;p&gt;CSHL конференцияларына қатысу алдын ала тіркелуді және көбінесе конкурстық іріктеуден өтуді талап етеді, өйткені жоғары деңгейдегі пікірталастарды сақтау үшін орындар саны шектеулі. Жеке қатыса алмайтындар үшін зертхана өз ақпараттық ресурстары арқылы материалдарға қолжетімділікті қамтамасыз етеді. Осы кездесулерде талқыланатын жаңа жаңалықтарды авторлар өз мақалаларын орналастыратын bioRxiv платформасы, сондай-ақ алдағы симпозиумдар мен өткен сессиялар туралы есептер жарияланатын зертхананың ресми сайты арқылы бақылауға болады.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/conferences/conf-cold_spring_harbor_meetings.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Cold_Spring_Harbor_Laboratory\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Cold Spring Harbor Laboratory — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференциялар&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"встречи лаборатории Колд-Спринг-Харбор (она же ведёт bioRxiv)"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Cold Spring Harbor Meetings","description":"встречи лаборатории Колд-Спринг-Харбор (она же ведёт bioRxiv)","vcsPath":"reference/conferences/conf-cold_spring_harbor_meetings.md"},"headings":[{"title":"Бұл қандай конференция","href":"reference/conferences/conf-cold_spring_harbor_meetings.html#bul-khandaj-konferenciya","level":2},{"title":"Ұйымдастырушылар мен тарихы","href":"reference/conferences/conf-cold_spring_harbor_meetings.html#ujymdastyrushylar-men-tarihy","level":2},{"title":"Тақырыптар мен секциялар","href":"reference/conferences/conf-cold_spring_harbor_meetings.html#takhyryptar-men-sekciyalar","level":2},{"title":"Ол жерде не пайда болады","href":"reference/conferences/conf-cold_spring_harbor_meetings.html#ol-zherde-ne-pajda-bolady","level":2},{"title":"Қалай бақылауға және қатысуға болады","href":"reference/conferences/conf-cold_spring_harbor_meetings.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady","level":2},{"title":"Дереккөздер","href":"reference/conferences/conf-cold_spring_harbor_meetings.html#derekkoezder","level":2}],"title":"Cold Spring Harbor Meetings"},"router":{"pathname":"reference/conferences/conf-cold_spring_harbor_meetings","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
