        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;20 ұғым&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/chmp5.html\"&gt;Chmp5&lt;/a&gt; — Везикулалар мен экзосомалардың түзілуін реттейтін ESCRT-III кешенінің көмекші ақуызы; оны басу ақаулардың жасушааралық таралуын бөгейді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cnbp.html\"&gt;CNBP&lt;/a&gt; — CNBP — мРНҚ құрамындағы гуанин мен аденинге бай элементтермен байланысатын және жасушалық процестерде маңызды рөл атқаратын ақуыз.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kras.html\"&gt;KRAS&lt;/a&gt; — Жасушалардың пролиферациясы мен тіршілігін реттейтін шағын ГТФаза, оның Т-лимфоциттердегі шамадан тыс белсендірілуі олардың мерзімінен…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/net1.html\"&gt;NET1&lt;/a&gt; — CNBP ақуызымен өзара әрекеттесуі блокталған кезде тасымалдануы бұзылатын нысаналы транскрипт, бұл ісік жасушаларының қозғалғыштығы мен…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tdp-43.html\"&gt;TDP-43&lt;/a&gt; — Әдетте сплайсингті реттейтін және нейродегенерация кезінде қызметін жоғалтып, криптикалық сақиналы РНҚ-лардың патологиялық синтезін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ube2l3.html\"&gt;UBE2L3&lt;/a&gt; — Мутациялары қабыну реакциясын бақылауды бұзатын және бактериялық инфекциялардың ауыр өту қаупін арттыратын ген.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vp2-capsid-protein.html\"&gt;VP2&lt;/a&gt; — Эндоцитоздық мембраналарда тесіктердің түзілуіне жауап беретін вирустық ақуыз; ондағы мутациялар вирустың Plscr1 әсеріне төзімділігін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zfx.html\"&gt;ZFX&lt;/a&gt; — X-хромосомамен байланысты транскрипция факторы, әйелдерде оның жоғары экспрессия деңгейі РАС-пен байланысты генетикалық мутацияларды…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/beta-amyloid.html\"&gt;бета-амилоид&lt;/a&gt; — Амилоидты ақуыз ізашарының ыдырау өнімі болып табылатын пептид, оның Альцгеймер ауруы кезінде жинақталуы эндолизосомалық ақаулар мен…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/glucosylsphingosine.html\"&gt;Глюкозилсфингозин&lt;/a&gt; — Глюкозилцерамидтің деацетилденуінен түзілетін потенциалды нейроуытты өнім, оның деңгейі Гоше ауруы кезінде айтарлықтай артады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sulfur-dioxide.html\"&gt;Диоксид серы&lt;/a&gt; — Көмір электр станциялары шығаратын газ тәріздес прекурсор, ол атмосферада қайталама ұсақ бөлшектердің түзілуіне ықпал етеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/isoniazid.html\"&gt;Изониазид&lt;/a&gt; — Туберкулезді емдеуге арналған антибиотик, оған төзімділік inhA және katG гендеріндегі мутацияларды анықтау арқылы белгіленеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/il-1beta.html\"&gt;Интерлейкин-1 бета&lt;/a&gt; — UBE2L3 генінің ақаулары кезінде утилизациясы бұзылатын қабынуға қарсы цитокин, бұл бақыланбайтын қабынуға әкеледі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/corticotropin-releasing-hormone.html\"&gt;Кортикотропин-рилизинг-гормон&lt;/a&gt; — Ми нейрондарында экспрессияланатын гормон, стресске жауап ретінде нейропластиканы іске қосатын эффектор қызметін атқарады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/protein-kinase-a.html\"&gt;Протеинкиназа A&lt;/a&gt; — Белсенділігі AKAP11 якорьлік ақуызымен реттелетін, жасушаішілік сигнал беруге қатысатын фермент.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tau-protein.html\"&gt;Тау-белок&lt;/a&gt; — Нейродегенерацияға қатысатын ақуыз; жұмыста вирустық инфекциядан кейінгі мидағы патологиялық өзгерістердің маркері ретінде қолданылады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thrombopoietin.html\"&gt;Тромбопоэтин&lt;/a&gt; — Ағзадағы тромбоциттердің түзілуі мен жетілуін ынталандыратын негізгі гормон-реттегіш.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ubiquitin.html\"&gt;Убиквитин&lt;/a&gt; — Субстраттармен ковалентті байланысу немесе бос күйінде бола отырып, жасушалық процестерді реттейтін 76 аминқышқылынан тұратын консервативті…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/phenol-red.html\"&gt;Феноловый красный&lt;/a&gt; — Реакция қоспасының түсінің өзгеруі арқылы амплификация нәтижелерін визуалды анықтау үшін қолданылатын химиялық индикатор.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/human-neutrophil-peptides.html\"&gt;Человеческие нейтрофильные пептиды&lt;/a&gt; — Нейтрофилдер бөлетін катионды пептидтер, олар метаболикалық жүктеме жағдайында патогендік эффекторлар ретінде әрекет етіп, митохондриялық…&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"20 ұғым"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Заттар","description":"20 ұғым","vcsPath":"reference/substances.md"},"headings":[],"title":"Заттар"},"router":{"pathname":"reference/substances","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
