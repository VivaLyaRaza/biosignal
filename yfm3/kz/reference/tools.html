            {"data":{"leading":false,"html":"&lt;p&gt;13 ұғым&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/casrx.html\"&gt;CasRx&lt;/a&gt; — Нейральді прогениторлы жасушалар дақылында арнайы гендердің белсенділігін басу (нокдаун) үшін қолданылатын РНҚ-басқарылатын фермент.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dcas13.html\"&gt;dCas13&lt;/a&gt; — РНҚ-ның нақты бөліктерін стерикалық блоктау үшін қолданылатын Cas13 ақуызының каталитикалық белсенді емес нұсқасы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dsrbd.html\"&gt;dsRBD&lt;/a&gt; — dCas13/gРНҚ кешенінің нысаналы мРНҚ-ға жақындығын арттыру үшін dCas13-ке қосылатын домен.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/psychad.html\"&gt;PsychAD&lt;/a&gt; — Нейродегенеративті және психиатриялық аурулар кезінде транскриптомдар атласын жасау үшін қолданылатын 1494 бірегей ми донорларының…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rfdiffusion.html\"&gt;RFdiffusion&lt;/a&gt; — Берілген байланысу қасиеттері бар ақуыздарды есептеу дизайны үшін қолданылатын терең оқыту алгоритмі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rnase-r.html\"&gt;RNase R&lt;/a&gt; — Сызықтық РНҚ молекулаларын таңдамалы түрде ыдырататын фермент, бұл үлгілердегі сақиналы РНҚ-ларды шоғырландыруға және талдауға мүмкіндік…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/target-adaptive-rescue-explore-exploit.html\"&gt;T-REX&lt;/a&gt; — Ақуыздарды автоматтандырылған жобалауға арналған агенттік жүйе, ол генеративті модельдерді үйлестіреді және есептеу ресурстарын бөледі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bicos.html\"&gt;Биспецифические костимуляторы&lt;/a&gt; — Т-жасушаларын белсендіру үшін екінші сигналды CD28 рецепторымен бивалентті байланысу арқылы қамтамасыз ететін молекулалар.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/deterministic-controller.html\"&gt;Детерминированный контроллер&lt;/a&gt; — LLM-агенттерінің ұсыныстарын тексеретін, ресурстар шектеулерін басқаратын және тапсырмаларды графикалық процессорларға бөлетін жүйе…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stable-diffusion.html\"&gt;Диффузионная нейросеть&lt;/a&gt; — Қатысушылардың ауызша сипаттамалары негізінде жекелендірілген визуалды бейнелерді синтездеу үшін қолданылатын «мәтіннен кескінге»…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/brain-organoids.html\"&gt;Мозговые органоиды&lt;/a&gt; — Индукцияланған плюрипотентті дің жасушаларынан алынған зертханалық модель, ол мидың ерте дамуының негізгі ерекшеліктерін қайталайды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vgg-16.html\"&gt;Сверточная нейросеть VGG-16&lt;/a&gt; — Сахнаның визуалды моделін құру үшін синтезделген кескіндерден 1000 өлшемді активтену векторларын алу үшін қолданылатын компьютерлік көру…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/7t-fmri.html\"&gt;сверхвысокопольное 7Т МРТ&lt;/a&gt; — Қыртыстың жеке қабаттарының белсенділігін оқшаулауға мүмкіндік беретін, воксельдің жоғары ажыратымдылығы бар нейровизуализация құралы.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"13 ұғым"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Құралдар","description":"13 ұғым","vcsPath":"reference/tools.md"},"headings":[],"title":"Құралдар"},"router":{"pathname":"reference/tools","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
