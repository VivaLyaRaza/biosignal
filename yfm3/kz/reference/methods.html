        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;22 ұғым&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/1d-cnn.html\"&gt;1D-CNN&lt;/a&gt; — Деректерден жергілікті спектрлік белгілер мен жаһандық заңдылықтарды алу үшін қолданылатын нейрондық желі архитектурасы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/crispr-screening.html\"&gt;CRISPR-скрининг&lt;/a&gt; — CRISPR-скрининг — бұл CRISPR/Cas9 жүйесінің көмегімен жасушалардағы мыңдаған гендерді кезекпен өшіру (нокаут) немесе белсендіру арқылы…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fold-em.html\"&gt;Fold'EM&lt;/a&gt; — Ақуыздың атомдық құрылымын қалпына келтіруге арналған фреймворк, генеративті модельдерден алынған априорлық білімдерді бөлшектердің…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vis-nir.html\"&gt;Vis-NIR&lt;/a&gt; — Модельді оқыту кезінде қызанақ жапырақтарының спектрлік профильдерін алу үшін қолданылатын толқын ұзындығы диапазоны.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rolling-circle-amplification.html\"&gt;Амплификация с круговой петлей&lt;/a&gt; — Орталық жүйке жүйесінің тіндеріндегі патологиялық сақиналы РНҚ-ны анықтау үшін қолданылатын жоғары сезімтал анықтау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fisher-information-approximation.html\"&gt;Аппроксимация фишеровской информации&lt;/a&gt; — Модель күрделілігі үшін айыппұлдарды геометриялық құрамдас бөліктерге: өлшем, параметрлер кеңістігінің көлемі, шекаралық әсерлер және…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/in-silico-gene-perturbation.html\"&gt;Виртуальный нокаут генов&lt;/a&gt; — Жасушалардың реттеуші желісін модельдеу және нақты геннің (KRAS) басылуының жасушалық функцияларға әсерін бағалау үшін қолданылатын есептеу…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hybrid-imputation.html\"&gt;Гибридная импутация&lt;/a&gt; — Тізбекті теңдеулер арқылы көптік толтыру (MICE) мен кездейсоқ орман алгоритмін біріктіретін жетіспейтін деректерді өңдеу стратегиясы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ultimatum-game.html\"&gt;Игра в ультиматум&lt;/a&gt; — Қатысушылар серіктестерден ақшалай ұсыныстарды қабылдайтын немесе қабылдамайтын мінез-құлық парадигмасы, ол әлеуметтік нормаларға…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/lagrangian-coherent-structures.html\"&gt;Лагранжевы когерентные структуры&lt;/a&gt; — Масса тасымалдау шекараларын және жүректегі қан ағындарының бөлінуін визуализациялауға мүмкіндік беретін ағындарды талдаудың математикалық…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multichannel-electroencephalography.html\"&gt;Многоканальная электроэнцефалография&lt;/a&gt; — Мидің электрлік белсенділігін бас терісіндегі электродтар арқылы тіркеу әдісі, сөйлеу дамуын бағалау үшін қолданылады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cox-proportional-hazards-models.html\"&gt;Модели пропорциональных рисков Кокса&lt;/a&gt; — Жұмыста жүрек-қан тамырлары оқиғалары мен жалпы өлім-жітімді бағалау үшін қолданылатын статистикалық әдіс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/limited-bedding-and-nesting.html\"&gt;Модель ограниченного количества подстилочного материала и гнезд&lt;/a&gt; — Ерте постнатальды кезеңде тышқандар үшін ресурстардың тапшылығына еліктейтін және стресс тудыратын эксперименталды модель.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multimodal-data.html\"&gt;Мультимодальные данные&lt;/a&gt; — Танымның физиологиялық корреляттарын қадағалау үшін ЭЭГ, ЭКГ және көз қозғалыстарын бір уақытта тіркеуді қамтитын деректерді жинаудың…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/optogenetic-inhibition.html\"&gt;Оптогенетическое подавление&lt;/a&gt; — Жұмыста стресс салдарларын жою үшін қолданылатын, жарық көмегімен нейрондардың белсенділігін басқару әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/whole-genome-sequencing.html\"&gt;Полногеномное секвенирование&lt;/a&gt; — Сирек генетикалық нұсқаларды іздеу үшін қолданылатын ағзаның толық ДНҚ тізбегін анықтау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/causal-forest.html\"&gt;Причинный лес&lt;/a&gt; — Қауіп факторларының гетерогенді әсерін бағалау және себеп-салдарлық байланыстарды талдау үшін қолданылатын құрал.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/oxford-nanopore-sequencing.html\"&gt;Секвенирование Oxford Nanopore&lt;/a&gt; — ITR тұрақтылығын бағалау үшін қолданылатын ДНҚ нуклеотидтік тізбегін талдау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/random-forest.html\"&gt;Случайный лес&lt;/a&gt; — Тәуекелдерді жіктеу және жетіспейтін деректерді гибридті импутациялау үшін қолданылатын машиналық оқыту алгоритмі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stereotactic-injection.html\"&gt;Стереотаксическая инъекция&lt;/a&gt; — Аспаптарды мидың белгіленген нүктесіне дәл бағыттау үшін инелерді қолданатын, препараттарды жергілікті жеткізуге арналған хирургиялық әдіс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/functional-magnetic-resonance-imaging.html\"&gt;Функциональная магнитно-резонансная томография&lt;/a&gt; — Автобиографиялық сюжеттерді ойша бастан кешіру кезінде ми қыртысының белсенділік өрнектерін картаға түсіру үшін қолданылатын…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/four-armed-bandit-task.html\"&gt;Четырехрукий бандит&lt;/a&gt; — Жануарлар әртүрлі марапаттар мен жазалары бар төрт нұсқаның арасынан таңдау жасайтын эксперименттік мінез-құлық сынағы.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"22 ұғым"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Әдістер","description":"22 ұғым","vcsPath":"reference/methods.md"},"headings":[],"title":"Әдістер"},"router":{"pathname":"reference/methods","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
