        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;21 ұғым&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/aggresomes.html\"&gt;Агресомы&lt;/a&gt; — Убиквитин-протеасомалық жүйе бұзылған кезде түзілетін, дұрыс бүктелмеген убиквитинденген ақуыздардан тұратын перинуклеарлық құрылымдар.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/anabolic-program.html\"&gt;Анаболическая программа&lt;/a&gt; — Микроглиядағы метаболикалық процесс, фагоцитарлық белсенділікті сақтау үшін жаңа ақуыздар синтезін митохондриялар биогенезімен біріктіреді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/haploinsufficiency.html\"&gt;Гаплонедостаточность&lt;/a&gt; — Геннің бір функционалды көшірмесі ағзаның қалыпты жұмыс істеуі үшін жеткілікті ақуыз деңгейін қамтамасыз ете алмайтын жағдай.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ischemia-and-reperfusion.html\"&gt;Ишемия и реперфузия&lt;/a&gt; — Инфаркттан кейінгі тромбоциттер динамикасын зерттеу үшін қолданылатын миокард зақымдануының эксперименталды моделі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/collateral-activity.html\"&gt;Коллатеральная активность&lt;/a&gt; — Cas13a ферментінің нысаналы РНҚ-мен байланысқаннан кейін айналадағы РНҚ молекулаларын арнайы емес түрде ыдырату қабілеті, бұл флуоресцентті…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mevalonate-pathway.html\"&gt;Мевалонатный путь&lt;/a&gt; — Холестерин синтезінің метаболикалық жолы, оның ферменттері (DHCR24, EBP) ісіктің терапияға сезімталдығын арттыру үшін негізгі нысана болып…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/microarousals.html\"&gt;Микропробуждения&lt;/a&gt; — Ұйқы кезіндегі қысқа мерзімді ауысулар, мидың қалыптан тыс электрлік белсенділігінің жергілікті өсуін тудырады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/neural-tracking.html\"&gt;Нейронный трекинг&lt;/a&gt; — Мидің өз электрлік белсенділігін сөйлеудің буын ырғағымен синхрондау қабілеті.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/feedback.html\"&gt;обратная связь&lt;/a&gt; — Ерте сигналдарды модуляциялауға мүмкіндік беретін, жоғары деңгейлі мультисенсорлы аймақтардан бастапқы сенсорлы қыртысқа сигналдарды беру…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/shared-transcriptomic-vulnerability.html\"&gt;общая транскриптомная уязвимость&lt;/a&gt; — Әртүрлі аурулар кезіндегі ген экспрессиясының өзгеруінің қайталанатын үлгілері, бұл ортақ патогендік механизмдерді көрсетеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/overfitting.html\"&gt;Переобучение&lt;/a&gt; — Модельдің деректердегі кездейсоқ шуға шамадан тыс бейімделуі және нақты заңдылықтарды көрсету қабілетін жоғалту құбылысы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/chromatin-remodeling.html\"&gt;Ремоделирование хроматина&lt;/a&gt; — AP-1 және BATF транскрипция факторлары арқылы басқарылатын процесс, ол реттеуші Т-жасушаларында цитотоксикалық гендердің белсендірілуін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/reflux.html\"&gt;Рефлюкс&lt;/a&gt; — Дәрілік препараттың ине каналы бойымен сыртқа қарай жағымсыз қозғалысы, бұл жеткізу көлемі мен тиімділігін шектейді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/familial-alzheimer-s-disease.html\"&gt;Семейная форма болезни Альцгеймера&lt;/a&gt; — APP, PSEN1 немесе PSEN2 гендеріндегі аутосомды-доминантты мутациялардан туындайтын Альцгеймер ауруының ерте түрі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/endoplasmic-reticulum-stress.html\"&gt;Стресс эндоплазматического ретикулума&lt;/a&gt; — SIL1 тапшылығы кезінде дұрыс оралмаған ақуыздардың жинақталуынан туындайтын, UPR каскадын және нейрондардың апоптозын қоздыратын…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/transcriptional-convergence.html\"&gt;Транскрипционная конвергенция&lt;/a&gt; — Әртүрлі бастапқы нысана гендердің бұзылуы бірыңғай реттеуші желідегі үйлестірілген ақауға және экспрессиядағы ұқсас өзгерістерге әкелетін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/black-swans.html\"&gt;Черные лебеди&lt;/a&gt; — Сирек кездесетін, ықтималдығы төмен, бірақ жойқын оқиғалар, олардан жануарлар ұсақ шығындар есебінен аулақ болуға тырысады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gene-expression.html\"&gt;Экспрессия генов&lt;/a&gt; — Мутациялар мен гормоналды терапияның молекулалық деңгейдегі әсерін бағалау үшін профилі талданатын процесс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aha-effect.html\"&gt;Эффект «ага»&lt;/a&gt; — Кенеттен түсіну немесе инсайт сәтімен бірге жүретін феноменалды сезім, ол метакогнитивті кері байланыс сигналы ретінде қызмет етеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/female-protective-effect.html\"&gt;Эффект защиты женского пола&lt;/a&gt; — Әйел ағзасының аутизмнің дамуына төзімдірек болуы және аурудың көрінуі үшін көбірек генетикалық жүктемені талап ететін биологиялық механизм.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/title-effect.html\"&gt;Эффект названия&lt;/a&gt; — Мәтін түріндегі қосымша семантикалық ақпарат өнер туындыларын қабылдауды, түсіндіруді және бағалауды өзгертетін құбылыс.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"21 ұғым"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Құбылыстар","description":"21 ұғым","vcsPath":"reference/phenomena.md"},"headings":[],"title":"Құбылыстар"},"router":{"pathname":"reference/phenomena","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
        </script>
