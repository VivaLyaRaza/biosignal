ірек ұқсастығын сандық…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/limit-of-detection.html\"&gt;Предел обнаружения&lt;/a&gt; — Тест үлгіде сенімді түрде анықтай алатын ДНҚ-ның минималды концентрациясы немесе трофозоиттер саны.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/major-adverse-cardiovascular-events.html\"&gt;Серьезные нежелательные сердечно-сосудистые события&lt;/a&gt; — Жедел миокард инфарктісін, инсультты немесе жүрек-қан тамырлары ауруларынан болатын өлімді қамтитын құрамдастырылған көрсеткіш.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/structurally-unique-hits.html\"&gt;Структурно уникальные хиты&lt;/a&gt; — Сапа сүзгілерінен өткен және өз құрылымымен ерекшеленетін сәтті ақуыз үміткерлерінің санын көрсететін жобалау тиімділігінің көрсеткіші.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sequential-organ-failure-assessment.html\"&gt;Шкала SOFA&lt;/a&gt; — Сепсисті диагностикалау үшін қолданылатын ағзалар дисфункциясының дәрежесін бағалауға арналған клиникалық шкала.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"12 ұғым"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Метрикалар","description":"12 ұғым","vcsPath":"reference/metrics.md"},"headings":[],"title":"Метрикалар"},"router":{"pathname":"reference/metrics","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
