            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Мамандық&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/spec-brain.jpg\" alt=\"Ми және жүйке жүйесі\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет: Ilya Repin, Public domain&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:I.P.Pavlov_by_Repin.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"anykhtama\"&gt;&lt;a href=\"concepts/spec-brain.html#anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтама&lt;/span&gt;&lt;/a&gt;Анықтама&lt;/h2&gt;\n&lt;p&gt;неврология; нейронаука; поведение и познание животных&lt;/p&gt;\n&lt;h2 id=\"sholu\"&gt;&lt;a href=\"concepts/spec-brain.html#sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу&lt;/span&gt;&lt;/a&gt;Шолу&lt;/h2&gt;\n&lt;p&gt;Ми және жүйке жүйесі — ағзаны басқаруды, ақпаратты өңдеуді және мінез-құлықты қалыптастыруды қамтамасыз ететін ең күрделі биологиялық аппарат. «БиоСигнал» аясында біз бұл саланы нейробиология, неврология және когнитивті ғылымдардың жиынтығы ретінде қарастырамыз. Бұл жүйені зерттеу жасушалардағы физикалық процестердің қалай ойларға, естеліктерге және қоршаған ортаға реакцияға айналатынын түсінуге мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/spec-brain.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Жүйке жүйесі орталық (бас және жұлын) және шеткі бөлімдерден тұрады. Оның жұмысының іргелі принципі — нейрондар арасында электрлік және химиялық сигналдарды беру. Жоғары жүйке қызметі, классикалық түсініктерге сәйкес, үлкен ми сыңарларының қыртысының жұмысына негізделеді. Нейроғылым бүгінде тек анатомияны ғана емес, молекулалық механизмдерді де зерттейді: ақуыздар, РНҚ және мидың иммундық жасушалары гомеостазды қалай қолдайды және олардың дисфункциясы қандай патологияларға әкеледі.&lt;/p&gt;\n&lt;h2 id=\"bul-khalaj-zhumys-istejdi\"&gt;&lt;a href=\"concepts/spec-brain.html#bul-khalaj-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қалай жұмыс істейді&lt;/span&gt;&lt;/a&gt;Бұл қалай жұмыс істейді&lt;/h2&gt;\n&lt;p&gt;Ми көп деңгейлі желі ретінде жұмыс істейді. Микродеңгейде нейрондар синапстар арқылы сигналдар алмасады. Мезодеңгейде естеліктердің визуалды бөлшектеріне жауап беретін медиальды самай желісі сияқты функционалдық желілер қалыптасады. Макродеңгейде миндаль тәрізді дене және префронтальды қыртыс сияқты құрылымдар эмоционалды реакцияларды реттейді. Көмекші жасушалар — глия маңызды рөл атқарады, олар ауру кезінде «жанып кетіп», нейрондарды улы ақуыздардан қорғау қабілетін жоғалтуы мүмкін.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"concepts/spec-brain.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Заманауи зерттеулер жоғары технологиялық тәсілдерге сүйенеді. Ғалымдар генетикалық ауруларды модельдеу үшін пациенттердің дің жасушаларынан өсірілген «мини-ми» (органоидтар) қолданады. Деректерді талдау үшін нейрондар белсенділігіндегі заңдылықтарды анықтауға көмектесетін машиналық оқыту алгоритмдері қолданылады.&lt;/p&gt;\n&lt;h2 id=\"khajda-kholdanylady\"&gt;&lt;a href=\"concepts/spec-brain.html#khajda-kholdanylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда қолданылады&lt;/span&gt;&lt;/a&gt;Қайда қолданылады&lt;/h2&gt;\n&lt;p&gt;Мидың құрылымын түсіну медицина үшін өте маңызды. «Ми жеке естеліктер кадрларын қалай қайта жаңғыртады» мақаласында нейрожелілердің есте сақтауды карталауға қалай көмектесетіні көрсетілген. «Альцгеймер ауруы кезінде мидың иммундық жасушалары іштей жанып кетеді» зерттеуі ағзаның қорғаныс жүйелерінің сарқылу механизмдерін ашады. «Гендік терапия тышқандардағы сирек синдромның дамуын тоқтатты» жұмысы нейрондар жұмысына араласудың әлеуетін көрсетеді.&lt;/p&gt;\n&lt;h2 id=\"shekteuler-men-khiyndykhtar\"&gt;&lt;a href=\"concepts/spec-brain.html#shekteuler-men-khiyndykhtar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен қиындықтар&lt;/span&gt;&lt;/a&gt;Шектеулер мен қиындықтар&lt;/h2&gt;\n&lt;p&gt;Басты қиындық мидың орасан зор пластикалығында. Стресс, генетикалық мутациялар және жасқа байланысты өзгерістер нейрондық байланыстарды үнемі қайта құрып отырады. Сонымен қатар, афантазия немесе жасырын сақиналы РНҚ түзілуі сияқты көптеген процестер биология, биоинформатика және психология түйіскен жерінде талдауды талап етеді.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Сызба: Ми және жүйке жүйесі&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9E%D1%80%D1%82%D0%B0%D0%BB%D1%8B%D2%9B%20%D0%B6%D2%AF%D0%B9%D0%BA%D0%B5%20%D0%B6%D2%AF%D0%B9%D0%B5%D1%81%D1%96%5D%20--%3E%20B%5B%D0%9C%D0%B8%20%D0%B6%D3%99%D0%BD%D0%B5%20%D0%B6%D2%B1%D0%BB%D1%8B%D0%BD%5D%0A%20%20B%20--%3E%20C%5B%D0%9D%D0%B5%D0%B9%D1%80%D0%BE%D0%BD%D0%B4%D1%8B%D2%9B%20%D0%B6%D0%B5%D0%BB%D1%96%D0%BB%D0%B5%D1%80%5D%0A%20%20C%20--%3E%20D%5B%D0%A1%D0%B8%D0%BD%D0%B0%D0%BF%D1%81%D1%82%D1%8B%D2%9B%20%D0%B1%D0%B0%D0%B9%D0%BB%D0%B0%D0%BD%D1%8B%D1%81%D1%82%D0%B0%D1%80%5D%0A%20%20C%20--%3E%20E%5B%D0%A4%D1%83%D0%BD%D0%BA%D1%86%D0%B8%D0%BE%D0%BD%D0%B0%D0%BB%D0%B4%D1%8B%D2%9B%20%D0%B0%D0%B9%D0%BC%D0%B0%D2%9B%D1%82%D0%B0%D1%80%5D%0A%20%20E%20--%3E%20F%5B%D0%95%D1%81%D1%82%D0%B5%20%D1%81%D0%B0%D2%9B%D1%82%D0%B0%D1%83%20%D0%B6%D3%99%D0%BD%D0%B5%20%D1%8D%D0%BC%D0%BE%D1%86%D0%B8%D1%8F%D0%BB%D0%B0%D1%80%5D%0A%20%20E%20--%3E%20G%5B%D2%9A%D0%BE%D0%B7%D2%93%D0%B0%D0%BB%D1%8B%D1%81%D1%82%D1%8B%20%D2%AF%D0%B9%D0%BB%D0%B5%D1%81%D1%82%D1%96%D1%80%D1%83%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bajlanysty-ughymdar\"&gt;&lt;a href=\"concepts/spec-brain.html#bajlanysty-ughymdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты ұғымдар&lt;/span&gt;&lt;/a&gt;Байланысты ұғымдар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-neurology.html\"&gt;Неврология&lt;/a&gt; — болезни нервной системы: инсульт, эпилепсия, нейродегенерация&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-neuroscience.html\"&gt;Нейронаука&lt;/a&gt; — как устроены нейроны, сети мозга и память&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-animal_behavior_and_cognition.html\"&gt;Поведение и познание животных&lt;/a&gt; — обучение, решения и общение у животных&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khaj-zherde-kezdesedi\"&gt;&lt;a href=\"concepts/spec-brain.html#khaj-zherde-kezdesedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде кездеседі&lt;/span&gt;&lt;/a&gt;Қай жерде кездеседі&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html\"&gt;Гоше ауруы кезінде ми неге құрысуға бейім болады&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut.html\"&gt;Мидың жеке естеліктерді қалай бейнелейтіні анықталды&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html\"&gt;Бала кездегі стресс миды қалай өзгертеді&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html\"&gt;Гендік терапия тышқандардағы сирек синдромның алдын алды&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html\"&gt;Альцгеймер кезінде мидың иммундық жасушалары неге шаршайды&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html\"&gt;Ми аурулары кезіндегі ақуыз ақауы жаңа сақиналы РНК түзілуін туындайды&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html\"&gt;Альцгеймер кезіндегі жасушааралық зақымдану қалай таралады&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html\"&gt;Афантазия: ми адамдары неге бейнелей алмайды?&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html\"&gt;Ми визуалды қыртыстың терең қабаттарында шындықты кейіннен жинақтайды&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html\"&gt;Ми қарапайым түсіндірмелерді қалай таңдайды&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html\"&gt;Ми танысты жаңадан қалай ажыратады: жадтың жасушалық коды табылды&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html\"&gt;Ми нейрондары әлеуметтік ережелерді қалай өңдейді&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html\"&gt;Жасырын сақина тәрізді РНК молекулалары қауіпті нейродегенеративті ауруды көрсетеді&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html\"&gt;Миымыз түсініксіз өнерді қалай ләззатқа айналдырады&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html\"&gt;Үзілісті ұйқы мидағы эпилепсиялық дүмпулерді қалай қоздырады&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html\"&gt;Егеуқұйрықтар қара аққулардан қалай қашып, джекпот іздейді&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html\"&gt;Тұмау мида із қалдырады: LRRK2 мутациясы ақуыз өзгерістерін қалай қоздырады&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html\"&gt;Альцгеймер ауруын зерттеуге арналған адам гиппокампының жасушалық картасы&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Анықтамалықта: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"concepts/spec-brain.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A4%D0%B8%D0%B7%D0%B8%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%8F_%D0%B2%D1%8B%D1%81%D1%88%D0%B5%D0%B9_%D0%BD%D0%B5%D1%80%D0%B2%D0%BD%D0%BE%D0%B9_%D0%B4%D0%B5%D1%8F%D1%82%D0%B5%D0%BB%D1%8C%D0%BD%D0%BE%D1%81%D1%82%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Физиология высшей нервной деятельности — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:I.P.Pavlov_by_Repin.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Ilya Repin, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-9-559\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;WGCNA: an R package for weighted correlation network analysis&lt;/a&gt; — шолу, BMC Bioinformatics 2008&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41592-019-0686-2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;SciPy 1.0: fundamental algorithms for scientific computing in Python&lt;/a&gt; — шолу, Nat Methods 2020&lt;/li&
