        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Мамандық&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/spec-cancer.jpg\" alt=\"Қатерлі ісік және онкология\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет: Stevenfruitsmaak, CC BY-SA 4.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Tumor_Mesothelioma2_legend.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"anykhtama\"&gt;&lt;a href=\"concepts/spec-cancer.html#anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтама&lt;/span&gt;&lt;/a&gt;Анықтама&lt;/h2&gt;\n&lt;p&gt;биология рака; гематология; клиническая онкология&lt;/p&gt;\n&lt;h2 id=\"sholu\"&gt;&lt;a href=\"concepts/spec-cancer.html#sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу&lt;/span&gt;&lt;/a&gt;Шолу&lt;/h2&gt;\n&lt;p&gt;Онкология — ісік ауруларының табиғатын, пайда болу механизмдерін және олармен күресу әдістерін зерттейтін медицина саласы. Пәннің негізінде қалыпты жасушалардың патологиялық күйге ауысуы, яғни бөліну мен өлуді бақылау қабілетін жоғалту процестерін түсіну жатыр. Қазіргі заманғы онкология ісік биологиясын, гематологияны және клиникалық тәжірибені біріктіріп, тек ісікті жоюды ғана емес, пациенттің өмір сүру сапасын сақтауды да мақсат етеді.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/spec-cancer.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Онкология іргетасы жасушалардағы генетикалық және метаболикалық өзгерістерді зерттеуге негізделген. Қатерлі трансформация жасушада бөлінуді бақылау және апоптоздан қорғану механизмдерін өшіретін мутациялар жинақталғанда орын алады. Негізгі түсініктерге геномның тұрақсыздығы, иммундық бақылаудан жалтару және ісіктің өз қажеттіліктері үшін микроортаны қайта құру қабілеті жатады.&lt;/p&gt;\n&lt;h2 id=\"bul-khalaj-zhumys-istejdi\"&gt;&lt;a href=\"concepts/spec-cancer.html#bul-khalaj-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қалай жұмыс істейді&lt;/span&gt;&lt;/a&gt;Бұл қалай жұмыс істейді&lt;/h2&gt;\n&lt;p&gt;Ісіктің дамуы — көп сатылы процесс. Алдымен жасуша бақылаусыз бөліну қабілетіне ие болады. Содан кейін ол айналадағы тіндермен өзара әрекеттесе бастайды, мысалы, метастаз үшін қан тамырларының тосқауылдарын бұзады немесе өсуді қолдау үшін холестерин сияқты ресурстарды иемденеді. Иммундық жүйе көбінесе қауіпті «көрмейді», өйткені ісік жасушалары иммундық жауапты басу үшін реттеуші Т-жасушаларын пайдаланады.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"concepts/spec-cancer.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Бүгінгі таңда диагностика мен терапия жоғары технологиялық әдістерге сүйенеді. Оларға қалқанша безінің қатерлі ісігін анықтау үшін гормон метаболиттерін талдау, хирургиялық жараның шеттерін талдау үшін жасанды интеллектпен біріктірілген оптикалық микроскопия және ісіктің ерекше әлсіз тұстарына бағытталған мақсатты терапия жатады.&lt;/p&gt;\n&lt;h2 id=\"khajda-kholdanylady\"&gt;&lt;a href=\"concepts/spec-cancer.html#khajda-kholdanylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда қолданылады&lt;/span&gt;&lt;/a&gt;Қайда қолданылады&lt;/h2&gt;\n&lt;p&gt;Онкология әдістері озық зерттеулерде көрініс табады. Мысалы, «Оптикалық микроскопия мен жасанды интеллект глиобластома рецидивін болжауға қалай көмектеседі» мақаласында ісіктің қайта өсуінің алдын алу үшін тіндерді талдайтын алгоритм сипатталған. «Ішектегі бактерия тоқ ішек қатерлі ісігінің бауырға метастаз беруіне көмектеседі» зерттеуі микробиоманың аурудың өршуіндегі рөлін көрсетеді.&lt;/p&gt;\n&lt;h2 id=\"shekteuler-men-khiyndykhtar\"&gt;&lt;a href=\"concepts/spec-cancer.html#shekteuler-men-khiyndykhtar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен қиындықтар&lt;/span&gt;&lt;/a&gt;Шектеулер мен қиындықтар&lt;/h2&gt;\n&lt;p&gt;Онкологияның басты қиындығы — ісіктердің гетерогенділігі: тіпті бір жаңа түзілімнің ішінде де жасушалар бір-бірінен қатты ерекшеленуі мүмкін. Бұл терапияға төзімділіктің дамуына әкеледі. Сонымен қатар, көптеген диагностикалық әдістер қауіпсіз және қатерлі процестерді ажырату үшін жоғары дәлдікті талап етеді.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Сызба: Қатерлі ісік және онкология&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%93%D0%B5%D0%BD%D0%B5%D1%82%D0%B8%D0%BA%D0%B0%D0%BB%D1%8B%D2%9B%20%D0%BC%D1%83%D1%82%D0%B0%D1%86%D0%B8%D1%8F%D0%BB%D0%B0%D1%80%5D%20--%3E%20B%5B%D0%91%D0%B0%D2%9B%D1%8B%D0%BB%D0%B0%D1%83%D1%81%D1%8B%D0%B7%20%D0%B1%D3%A9%D0%BB%D1%96%D0%BD%D1%83%5D%0A%20%20B%20--%3E%20C%5B%D0%86%D1%81%D1%96%D0%BA%D1%82%D1%96%D2%A3%20%D3%A9%D1%81%D1%83%D1%96%5D%0A%20%20C%20--%3E%20D%5B%D0%9C%D0%B8%D0%BA%D1%80%D0%BE%D0%BE%D1%80%D1%82%D0%B0%D0%BC%D0%B5%D0%BD%20%D3%A9%D0%B7%D0%B0%D1%80%D0%B0%20%D3%99%D1%80%D0%B5%D0%BA%D0%B5%D1%82%D1%82%D0%B5%D1%81%D1%83%5D%0A%20%20D%20--%3E%20E%5B%D0%9C%D0%B5%D1%82%D0%B0%D1%81%D1%82%D0%B0%D0%B7%D0%B4%D0%B0%D1%80%5D%0A%20%20C%20--%3E%20F%5B%D0%98%D0%BC%D0%BC%D1%83%D0%BD%D0%B4%D1%8B%D2%9B%20%D0%B6%D2%AF%D0%B9%D0%B5%D0%B4%D0%B5%D0%BD%20%D0%B6%D0%B0%D0%BB%D1%82%D0%B0%D1%80%D1%83%5D%0A%20%20F%20--%3E%20G%5B%D0%A2%D0%B0%D1%80%D0%B3%D0%B5%D1%82%D1%82%D1%96%20%D1%82%D0%B5%D1%80%D0%B0%D0%BF%D0%B8%D1%8F%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bajlanysty-ughymdar\"&gt;&lt;a href=\"concepts/spec-cancer.html#bajlanysty-ughymdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты ұғымдар&lt;/span&gt;&lt;/a&gt;Байланысты ұғымдар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cancer_biology.html\"&gt;Биология рака&lt;/a&gt; — как клетка становится опухолью и как опухоль уходит от защиты&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-hematology.html\"&gt;Гематология&lt;/a&gt; — кровь и кроветворение, лейкозы и анемии&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-oncology.html\"&gt;Клиническая онкология&lt;/a&gt; — диагностика и лечение рака у пациентов&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khaj-zherde-kezdesedi\"&gt;&lt;a href=\"concepts/spec-cancer.html#khaj-zherde-kezdesedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде кездеседі&lt;/span&gt;&lt;/a&gt;Қай жерде кездеседі&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/optical-microscopy-predictions-of-focal-recurrence-in-gliobl.html\"&gt;Оптикалық микроскопия мен жасанды интеллект глиобластоманың қайталануын болжайды&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/eggerthella-lenta-disrupts-the-gut-vascular-barrier-to-drive.html\"&gt;Ішектегі бактерия тоқ ішек қатерлі ісігінің бауырға метастаз беруіне ықпал етеді&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html\"&gt;Иммунитеттің жасырын қаруы: реттеуші Т-жасушалар қатерлі ісікпен қалай күреседі&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/a-serum-thyroid-hormone-metabolite-test-for-molecular-diagno.html\"&gt;Қалқанша без обырын анықтаудың жаңа әдісі: қан анализі&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-25/combination-of-alk2-and-cholesterol-targeting-agents-exploit.html\"&gt;Ми ісігін емдеудің жаңа жолы холестерин алмасуынан табылды&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Анықтамалықта: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"concepts/spec-cancer.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9E%D0%BD%D0%BA%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Онкология — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Tumor_Mesothelioma2_legend.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Stevenfruitsmaak, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.cell.2011.02.013\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Hallmarks of cancer: the next generation&lt;/a&gt; — шолу, Cell 2011&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-9-559\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;WGCNA: an R package for weighted correlation network analysis&lt;/a&gt; — шолу, BMC Bioinformatics 2008&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/gb-2009-10-3-r25\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Ultrafast and memory-efficient alignment of short DNA sequences to the human genome&lt;/a&gt; — шолу, Genome Biol 2009&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"биология рака; гематология; клиническая онкология"}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Қатерлі ісік және онкология","description":"биология рака; гематология; клиническая онкология","vcsPath":"concepts/spec-cancer.md"},"headings":[{"title":"Анықтама","href":"concepts/spec-cancer.html#anykhtama","level":2},
