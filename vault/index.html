<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Архив · БиоСигнал</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0e14;color:#e8eefc;font:16px system-ui,sans-serif}
.box{width:min(380px,90vw);padding:32px;border-radius:18px;background:#141a26;box-shadow:0 0 0 3px #fff,0 0 0 6px #000}
h1{margin:0 0 6px;font-size:22px}p{color:#8fa0c0;margin:0 0 18px;font-size:14px}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;font-size:16px}
input{border:1px solid #2b3550;background:#0b0e14;color:#fff;margin-bottom:12px}button{border:0;background:#7A3FCC;color:#fff;cursor:pointer}
#st{margin-top:12px;font-size:13px;color:#8fa0c0;min-height:18px}a{color:#9fb4ff}</style></head><body>
<form class="box" id="f"><h1>Личный архив</h1><p>Все рисунки и полные тексты. Содержимое зашифровано.</p>
<input id="pw" type="password" placeholder="Пароль" autocomplete="current-password" autofocus><button>Открыть</button>
<div id="st"></div><p style="margin-top:14px"><a href="#" id="lock">Заблокировать на этом устройстве</a></p></form>
<script src="fflate.min.js"></script>
<script>
const st = t => document.getElementById('st').textContent = t;
const base = location.pathname.replace(/[^/]*$/, '');
const types = {html:'text/html; charset=utf-8',js:'text/javascript',css:'text/css',json:'application/json',svg:'image/svg+xml',jpg:'image/jpeg',png:'image/png',woff2:'font/woff2',woff:'font/woff',txt:'text/plain'};
document.getElementById('f').onsubmit = async e => {
  e.preventDefault(); st('Загрузка архива…');
  try {
    const buf = new Uint8Array(await (await fetch(base + 'vault.bin', {cache: 'no-store'})).arrayBuffer());
    st('Проверка пароля…');
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt: buf.slice(0,16), iterations: 310000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    let zip; try { zip = new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv: buf.slice(16,28)}, key, buf.slice(28))); }
    catch { st('Неверный пароль'); return; }
    st('Распаковка…'); const files = fflate.unzipSync(zip);
    await caches.delete('biosignal-vault'); const cache = await caches.open('biosignal-vault');
    await Promise.all(Object.entries(files).map(([p, data]) => cache.put(base + 'app/' + p,
      new Response(data, {headers: {'Content-Type': types[p.split('.').pop()] || 'application/octet-stream'}}))));
    await navigator.serviceWorker.register(base + 'sw.js', {scope: base}); await navigator.serviceWorker.ready;
    location.href = base + 'app/index.html';
  } catch (err) { st('Ошибка: ' + err.message); }
};
document.getElementById('lock').onclick = async e => { e.preventDefault(); await caches.delete('biosignal-vault'); st('Заблокировано'); };
</script></body></html>
