        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"229\" cy=\"138\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"531\" cy=\"257\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · INFECTIOUS DISEASES   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;АКТВ, туберкулез бен&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;малярияны бірге анықтайтын&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;CRISPR-тест жасалды&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari-f1.jpg\" alt=\"HTM CARMEN CRISPR диагностикалық панелінің дизайны мен жұмыс процесі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;&lt;a href=\"concepts/htm-carmen.html\"&gt;HTM CARMEN&lt;/a&gt; CRISPR диагностикалық панелінің дизайны мен жұмыс процесі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;HTM CARMEN CRISPR диагностикалық панелінің дизайны мен жұмыс процесі. (A) HTM CARMEN жұмыс процесінің сызбасы, үлгілерді жинауды, нуклеин қышқылдарын экстракциялауды, нысананы амплификациялауды және CARMEN платформасында &lt;a href=\"concepts/crispr-cas13a.html\"&gt;CRISPR-Cas13a&lt;/a&gt; анықтауды, сондай-ақ АИТВ, Plasmodium, Mtb және коинфекцияларды мультиплексті анықтауды көрсетеді. (B) Plasmodium түрлерін дифференциациялауға арналған дизайн стратегиясы. P. falciparum, P. vivax, P. ovale және P. malariae 18S рРНҚ консенсустық тізбектері бойынша тізбектердің консервативтілігі амплификация праймерлері мен түрге тән &lt;a href=\"concepts/crrnk.html\"&gt;crРНҚ&lt;/a&gt; орналасуымен бірге көрсетілген. Праймерлер консервативті аймақтар ішінде орналастырылды, ал crРНҚ ADAPT көмегімен анықталған түрлерді ажырататын аймақтарға бағытталды. (C) Mtb inhA промоторы −777 C&amp;gt;T және katG S315T/N локустары үшін аллельге тән crРНҚ анықтау сызбасы. Туыстас crРНҚ-нысана жұптасуы Cas13a белсендірілуіне және флуоресценцияның генерациясына ықпал етеді, ал бір нуклеотидті сәйкессіздік белсендірілуді төмендетеді, бұл салыстырмалы флуоресценция сигналдары негізінде жабайы типтегі және мутантты аллельдерді ажыратуға мүмкіндік береді. (D) Таңдалған Plasmodium және Mtb талдауларының NCBI тізбектерінің жалпыға қолжетімді деректер жиыны бойынша болжамды қамтылуы. Қамтылу праймерлердің байланысуын және crРНҚ белсенділігін қолдайды деп болжанған тізбектердің үлесін білдіреді. Әрбір талдау үшін бағаланған жалпы тізбектерге қатысты қамтылған тізбектер саны көрсетілген.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;АКТВ, туберкулез және малярия жиі қатар жүреді, бірақ дәстүрлі диагностика әр ауруды бөлек тексеруге мәжбүрлейді. Бұл емдеуді кешіктіріп, науқас өміріне қауіп төндіреді. Зерттеушілер CRISPR-Cas13a жүйесіне негізделген HTM CARMEN мультиплексті платформасын жасап шығарды. Ол бір тестілеу ішінде малярия плазмодийінің төрт түрін, АКТВ-1, АКТВ-2, туберкулез микобактериясын және изониазидке төзімділік мутацияларын анықтай алады.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;CRISPR-тест АКТВ, туберкулез, малярияның 4 түрін және тұрақтылық мутацияларын бірден табады&lt;/li&gt;\n&lt;li&gt;Клиникалық үлгілердегі дәлдік малярия мен АКТВ үшін 95%, туберкулез үшін 100% құрады&lt;/li&gt;\n&lt;li&gt;Жүйе қан, сарысу, қақрық және кептірілген қан дақтарында бірдей нәтиже береді&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;HTM CARMEN платформасы Leptotrichia wadei Cas13a (LwaCas13a) белогін және ADAPT пен BADGERS алгоритмдері арқылы әзірленген кРНҚ (crRNA) жинағын қолданады. Нуклеин қышқылдары бөлінгеннен кейін сегіз нысана бойынша біріктірілген кері транскрипциялы ПТР жүргізіледі. Нысана танылған кезде Cas13a ферменті қосымша РНҚ-азалық белсенділік танытып, флуоресцентті зондтарды ыдыратады. Жүйе Plasmodium-ның 4 түрін, АКТВ-1, АКТВ-2, Mycobacterium tuberculosis (Mtb) және изониазидке төзімділікпен байланысты inhA −15 C&amp;gt;T бен katG S315T/N мутацияларын ажыратады.&lt;/p&gt;\n&lt;p&gt;Клиникалық үлгілерді тексеру барысында сезімталдық көрсеткіші малярия үшін 95% (19/20), АКТВ-1 үшін 95% (19/20) және Mtb үшін 100% (30/30) құрады, ал спецификалылығы барлық нысаналар бойынша 100% болды. Сонымен қатар, тест АКТВ мен туберкулездің қосарланған инфекциясы расталған барлық 9 клиникалық үлгіде екі патогенді де қатар анықтады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу шағын клиникалық таңдамада (патогенге 9-дан 30-ға дейін үлгі) жүргізілген және жұмыс препринт түрінде жарияланғандықтан, тәуелсіз тексеруді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;АИТВ, туберкулез (ТБ) және безгек жиі қатар кездесетін жұқпалы аурулар болғанымен, оларды диагностикалау әдетте әр ауруға жеке жүргізіледі, бұл коинфекцияларды анықтауды және дәрілік төзімділікті тексеруді қиындатады. Авторлар HTM CARMEN жүйесін ұсынды — бұл CRISPR-Cas13a негізіндегі жоғары мультиплексті молекулалық диагностикалық платформа. Ол АИТВ-1, АИТВ-2, Plasmodium-ның төрт түрін және Mycobacterium tuberculosis (Mtb) қоздырғышын, сондай-ақ изониазидке төзімділікпен байланысты inhA және katG гендерінің нұсқаларын бір мезгілде анықтауға қабілетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HTM CARMEN жүйесі АИТВ, туберкулез және безгекті бір мезгілде диагностикалауға және дәрілік төзімділікті тексеруге мүмкіндік береді, мұнда Mtb үшін 100%, ал АИТВ-1 мен безгек үшін 95% дәлдік тіркелген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR-Cas13a — бұл РНҚ-ны өңдеу жүйесі, ол диагностикада патогеннің нақты тізбегін тапқан кезде іске қосылатын және флуоресцентті сигнал тудыратын «молекулалық қайшы» ретінде қолданылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Зертханалық сынақтар барысында жүйе жоғары селективтілікті және әртүрлі биологиялық орталарда (тұтас қан, сарысу, қақырық және кептірілген қан дақтары) бір нуклеотидті айырмашылықтарды ажырату қабілетін көрсетті. Әр жағдай үшін 20 жасанды үлгіні тексеру кезінде HTM CARMEN төмен концентрациялы патогендерді анықтауда &lt;a href=\"concepts/qpcr.html\"&gt;qPCR&lt;/a&gt; әдісінен жоғары нәтиже берді. P. falciparum/АИТВ-1 және Mtb/АИТВ-1 коинфекциялары үлгілерінде екі қоздырғыш та әртүрлі концентрация қатынастарында сәтті анықталды.&lt;/p&gt;\n&lt;p&gt;Расталған клиникалық үлгілерде әдіс безгек үшін 95% (19/20), АИТВ-1 үшін 95% (19/20) және Mtb үшін 100% (30/30) оң сәйкестікті (PPA) көрсетті. Теріс сәйкестік (NPA) барлық нысаналы көрсеткіштер үшін 100% болды. Сонымен қатар, жүйе АИТВ-ТБ коинфекциясы расталған барлық тоғыз үлгіде екі патогенді де анықтады. Бұл нәтижелер бірнеше инфекцияны диагностикалау мен төзімділікті талдауды бірыңғай бағдарламаланатын платформада біріктірудің тиімділігін дәлелдейді.&lt;/p&gt;\n&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"infekciyalardyng-zhahandykh-zhuektemesi-zhaene-diagnostikalykh-maeseleler\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#infekciyalardyng-zhahandykh-zhuektemesi-zhaene-diagnostikalykh-maeseleler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Инфекциялардың жаһандық жүктемесі және диагностикалық мәселелер&lt;/span&gt;&lt;/a&gt;Инфекциялардың жаһандық жүктемесі және диагностикалық мәселелер&lt;/h4&gt;\n&lt;p&gt;Туберкулез (ТБ), АИТВ және безгек жыл сайын 270-280 миллионға жуық адамды зақымдайды, бұл негізінен табысы төмен және орташа елдерде байқалады. Қазіргі клиникалық диагностика көбінесе бір патогенге бағытталған тесттерге сүйенеді, бұл коинфекцияларды анықтауды қиындатады. Бұл аурулар бір уақытта таралған аймақтарда интеграцияланған жүйелердің болмауы емдеу мен эпидемиологиялық қадағалауда «соқыр дақтарды» тудырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жыл сайын 280 миллионға дейін ТБ, АИТВ және безгек жағдайлары тіркеледі, ал бір патогенге арналған диагностикалық әдістер коинфекцияларды анықтауда тиімсіз.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"koinfekciyalardyng-klinikalykh-mangyzy\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#koinfekciyalardyng-klinikalykh-mangyzy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Коинфекциялардың клиникалық маңызы&lt;/span&gt;&lt;/a&gt;Коинфекциялардың клиникалық маңызы&lt;/h4&gt;\n&lt;p&gt;АИТВ туберкулезге бейімділікті арттырады және көбінесе қақырық арқылы диагноз қою қиын болатын өкпеден тыс түрлерін тудырады. &lt;em&gt;Plasmodium&lt;/em&gt; туысына жататын төрт түрдегі (&lt;em&gt;P. falciparum&lt;/em&gt;, &lt;em&gt;P. vivax&lt;/em&gt;, &lt;em&gt;P. ovale&lt;/em&gt;, &lt;em&gt;P. malariae&lt;/em&gt;) безгек те АИТВ және ТБ-мен қиылысады. Коинфекциялар емдеуді қиындатады: мысалы, туберкулезді емдеуде қолданылатын рифампицин безгекке қарсы артемизинин негізіндегі препараттардың тиімділігін төмендетеді. Сонымен қатар, қолданыстағы әдістер көбінесе изониазидке (&lt;a href=\"concepts/isoniazid.html\"&gt;INH&lt;/a&gt;) төзімділікті назардан тыс қалдырып, тек рифампицинге (RIF) назар аударады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Синдромика — бұл бірнеше ауруға тән клиникалық белгілер жиынтығы, ол коинфекциялар кезінде дифференциалды диагноз қоюды қиындатады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"carmen-tehnologiyasy-zhaene-htm-panelin-aezirleu\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#carmen-tehnologiyasy-zhaene-htm-panelin-aezirleu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CARMEN технологиясы және HTM-панелін әзірлеу&lt;/span&gt;&lt;/a&gt;CARMEN технологиясы және HTM-панелін әзірлеу&lt;/h4&gt;\n&lt;p&gt;Авторлар бұл мәселелерді шешу үшін CRISPR-Cas13a негізіндегі CARMEN платформасын пайдаланды. Бұл технология жоғары өнімділікті қамтамасыз етеді: бір микрофлюидті чипте 192 үлгіні 24 тестпен талдап, барлығы 4608 реакция өткізуге мүмкіндік береді. HTM CARMEN панелі АИТВ-1, АИТВ-2, ТБ (INH-қа төзімділік маркерлерімен) және &lt;em&gt;Plasmodium&lt;/em&gt; түрлерін ажыратуды біріктіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/sherlock.html\"&gt;SHERLOCK&lt;/a&gt; және CARMEN — бұл Cas13 ферментін қолданатын молекулалық диагностика әдістері, олар нысаналы РНҚ-ны анықтаған кезде репортерлік молекулаларды кесіп, өлшенетін сигнал тудырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"validaciya-zhaene-tiimdilikti-baghalau\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#validaciya-zhaene-tiimdilikti-baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Валидация және тиімділікті бағалау&lt;/span&gt;&lt;/a&gt;Валидация және тиімділікті бағалау&lt;/h4&gt;\n&lt;p&gt;Авторлар &lt;em&gt;in vitro&lt;/em&gt; жағдайында талдаудың ерекшелігін және бір нуклеотидті өзгерістерді ажырату қабілетін бағалады. Сынақтар қақырық, сарысу, тұтас қан және кептірілген қан дақтары сияқты әртүрлі биоматериалдарда өткізілді. Жүйенің тиімділігі жасанды үлгілер көмегімен сандық ПТР (qPCR) әдісімен салыстырылды. Соңғы кезеңде безгек, АИТВ немесе ТБ-мен ауыратын, сондай-ақ АИТВ-ТБ коинфекциясы бар клиникалық үлгілер тексерілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу әдіснамалық әзірлеме болып табылады; жүйенің нақты клиникалық жағдайдағы тиімділігі қосымша тексеруді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"htm-multipleksti-panelin-zhobalau-zhaene-damytu\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#htm-multipleksti-panelin-zhobalau-zhaene-damytu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HTM мультиплексті панелін жобалау және дамыту&lt;/span&gt;&lt;/a&gt;HTM мультиплексті панелін жобалау және дамыту&lt;/h4&gt;\n&lt;p&gt;Біз патогендерді анықтауға, Plasmodium түрлерін ажыратуға және Mycobacterium tuberculosis (Mtb) изониазидке (INH) төзімділігімен байланысты мутацияларды анықтауға арналған CRISPR-Cas13a негізіндегі HTM CARMEN мультиплексті жүйесін жасадық (1-сурет A). Панель 11 диагностикалық тестті қамтиды: Plasmodium falciparum (Pf), Plasmodium vivax (Pv), Plasmodium ovale (Po), Plasmodium malariae (Pm), HIV-1, HIV-2, Mtb IS6110 тізбегі, сондай-ақ inhA (промотор -777 C&amp;gt;T) және katG (S315T/N) локустарындағы жабайы және мутантты аллельдер (S1-S3 кестелері).&lt;/p&gt;\n&lt;p&gt;Plasmodium түрлерін ажырату үшін crРНҚ 18S рРНҚ локусының түрге тән аймақтарына бағытталды, ал амплификация праймерлері барлық төрт түрді бір уақытта көбейту үшін консервативті аймақтарға орналастырылды (1-сурет B, S4 кестесі). Бақылау ретінде Babesia microti (Bm) және Toxoplasma gondii (Tg) паразитіне қарсы crРНҚ қосылды (S2-S3 кестелері, S3-сурет A). Кандидаттық crРНҚ-лар ADAPT машиналық оқыту алгоритмі арқылы таңдалды. Mtb үшін жоғары сезімталдығы бар IS6110 тізбегі таңдап алынды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR-Cas13a — бұл РНҚ-ны нысанаға алатын жүйе, ол мақсатты тізбекті таныған кезде репортерлік молекулаларды кесіп, флуоресцентті сигнал тудырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;INH төзімділігін талдау үшін біз екі crРНҚ тәсілін қолдандық: біреуі жабайы типке (WT), екіншісі мутантты (MUT) тізбекке бағытталған (1-сурет C). Бұл әр генотип үшін тәуелсіз флуоресцентті сигнал алуға мүмкіндік береді. Дизайн BADGERS-Cas13 есептеу платформасы арқылы орындалды. Панельге бұрын валидацияланған HIV-1 және HIV-2 crРНҚ-лары да енгізілді.&lt;/p&gt;\n&lt;p&gt;Геномдық деректер базасын талдау жүйенің жоғары тиімділігін көрсетті (1-сурет D). Қамту ауқымы 95%-дан 100%-ға дейін болды: Pf 18S үшін 95,8% (68/71), Pv үшін 100% (15/15), Po үшін 100% (34/34), Pm үшін 100% (6/6), Mtb IS6110 үшін 99,1% (9364/9445), inhA үшін 98,3% (178/181) және katG үшін 100% (1000/1000).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жасалған HTM мультиплексті панелі 95-100% геномдық қамтуды қамтамасыз етеді және Mtb, АИТВ, безгек плазмодийлерін, сондай-ақ Mtb-дің INH-ке төзімділігін бір уақытта анықтауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"htm-taldaularynyng-zhoghary-ereksheligi-zhaene-snp-diskriminaciyasy\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#htm-taldaularynyng-zhoghary-ereksheligi-zhaene-snp-diskriminaciyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HTM талдауларының жоғары ерекшелігі және SNP дискриминациясы&lt;/span&gt;&lt;/a&gt;HTM талдауларының жоғары ерекшелігі және SNP дискриминациясы&lt;/h4&gt;\n&lt;p&gt;Алдымен біз әзірленген crRNA белсенділігін жеке SHERLOCK реакцияларында олардың нысаналарына қатысты бағаладық. Әрбір күшейтілген нысана азайып бара жатқан концентрацияларда тиісті crRNA және Cas13a ақуызымен инкубацияланды, содан кейін флуоресцентті талдау жүргізілді (Сурет S1). Таңдалған барлық crRNA үшін минималды фондық сигналмен жылдам және қарқынды флуоресценция белсенділігі байқалды. Содан кейін біз CARMEN мультиплексті форматында айқаспалы реактивтілікті бағаладық. HTM панеліндегі әрбір нысана үшін геномдық немесе синтетикалық материал панельдегі әрбір crRNA-ға қарсы сыналды (Сурет 2A, Сурет S2). Флуоресценцияның белсенділенуі негізінен нысаналы жұптармен шектелгені анықталды, тек Mtb геномдық ДНҚ-сы күтілгендей IS6110, inhA және katG локустары үшін сигнал берді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari-f2.jpg\" alt=\"HTM CARMEN панелінің аналитикалық ерекшелігі мен тиімділігі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;HTM CARMEN панелінің аналитикалық ерекшелігі мен тиімділігі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;HTM CARMEN панелінің аналитикалық ерекшелігі мен тиімділігі. (A) In vitro жағдайында HTM CARMEN талдауларының мультиплексті сезімталдығы мен ерекшелігі. Жылу картасы 10^4-тен 10^-1 көшірме/мкл дейінгі концентрацияларда көрсетілген геномдық немесе синтетикалық нысаналар үшін 60 минуттағы қалыпқа келтірілген флуоресценцияны көрсетеді. (B) inhA промоторы −777 C&amp;gt;T және katG S315T/N локустарына бағытталған crРНҚ аллельдік дискриминациясы. «Нысаналы/нысаналы емес» флуоресценция қатынастары 60 минутта жабайы типтегі Mtb геномдық ДНҚ-сын немесе 10^4 көшірме/мкл концентрациясындағы синтетикалық мутантты gBlocks-ты пайдаланып есептелді. Үзік сызық 2 қатынасын көрсетеді, бұл аллельді артықшылықты танудың жоқтығына сәйкес келеді. Деректер үш тәуелсіз биологиялық қайталанымнан алынған орташа ± стандартты ауытқу ретінде көрсетілген. (C) Төрт Plasmodium түрі талдауының және 10^4 көшірме/мкл концентрациясында тексерілген туыстас апикомплексті бақылаулар Toxoplasma gondii мен Babesia microti-дің өзара аналитикалық ерекшелігі. (D) Mtb IS6110 crРНҚ-ның Mtb және сегіз туберкулездік емес микобактерия түрлеріне қатысты 10^4 көшірме/мкл концентрациясындағы ерекшелігі. Үзік сызық талдаудың оң нәтиже шегін көрсетеді, ол нысанасыз бақылаудың орташа мәні мен үш стандартты ауытқу ретінде анықталған. (E-G) (E) Plasmodium, (F) АИТВ және (G) Mtb суб-панельдері үшін in vitro нысананы сұйылту сериясы бойынша qPCR цикл шегі (Ct) мен қалыпқа келтірілген CARMEN флуоресценциясы арасындағы байланыс. Үзік тік сызық 38 циклдегі qPCR Ct шегін білдіреді, одан жоғары qPCR нәтижелері анықталмаған деп саналды. &lt;a href=\"concepts/no-template-control.html\"&gt;NTC&lt;/a&gt; = Нысанасыз бақылау.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HTM талдаулары патогендерді, түрлерді және тіпті жеке нуклеотидтік ауысуларды (&lt;a href=\"concepts/snp.html\"&gt;SNP&lt;/a&gt;) 13.69-ға дейінгі сигнал/шу қатынасымен тиімді ажырата отырып, жоғары селективтілікті көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;WT және MUT нысаналары бір нуклеотидпен ерекшеленетіндіктен, біз inhA және katG үшін жұптық crRNA көмегімен аллельдерді ажырату қабілетін сандық бағаладық. 10⁴ көшірме/мкл⁻¹ концентрациясында әрбір crRNA өз аллелін таңдады. Мақсатты/мақсатты емес белсенділік қатынасы inhA WT үшін 13.69 ± 3.08, inhA MUT үшін 4.38 ± 0.92, katG WT үшін 3.15 ± 0.39 және katG MUT үшін 3.99 ± 0.77 құрады (Сурет 2B, Сурет S3B, Кесте S5). Ең жақсы дискриминация inhA гидтерінде байқалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SNP (бір нуклеотидтік полиморфизм) — бұл ДНҚ тізбегіндегі бір нуклеотидтің айырмашылығы, ол бактериялардың антибиотиктерге төзімділігін анықтауы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз сондай-ақ жақын түрлер бойынша ерекшелікті тексердік. Plasmodium үшін ерекшелік матрицасында төрт тест басқа Plasmodium, Tg және Bm түрлеріне қарағанда өз нысанасын анықтады (Сурет 2C). Mtb тесттері сегіз туберкулездік емес микобактерия (NTM) түрлеріне қарсы сыналды. IS6110, inhA WT және katG WT үшін сигналдар тек Mtb үшін күшті болды, ал NTM үшін анықтау шегінен төмен қалды (Сурет 2D, Сурет S3C-D). Соңында біз CARMEN флуоресценциясын qPCR Ct мәндерімен салыстырдық. Кері тәуелділік анықталды: анықталмаған өлшемдер (Ct ≥38) алынып тасталғанда, Пирсон корреляция коэффициенттері -0.75-тен -0.96-ға дейін болды (Сурет 2E-G, Кесте S6).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер in vitro зертханалық жағдайда алынған; клиникалық үлгілердегі тиімділік биологиялық матрицаның күрделілігіне байланысты өзгеше болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"htm-carmen-klinikalykh-uelgilerde-zhoghary-sezimtaldykh-pen-selektivtilikti-sakhtajdy\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#htm-carmen-klinikalykh-uelgilerde-zhoghary-sezimtaldykh-pen-selektivtilikti-sakhtajdy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HTM CARMEN клиникалық үлгілерде жоғары сезімталдық пен селективтілікті сақтайды&lt;/span&gt;&lt;/a&gt;HTM CARMEN клиникалық үлгілерде жоғары сезімталдық пен селективтілікті сақтайды&lt;/h4&gt;\n&lt;p&gt;&lt;em&gt;In vitro&lt;/em&gt; жағдайында аналитикалық селективтілікті растағаннан кейін, біз HTM CARMEN платформасының клиникалық маңызды матрицаларда (қақырық, сарысу, тұтас қан және кептірілген қан дақтары - &lt;a href=\"concepts/dbs.html\"&gt;DBS&lt;/a&gt;) жұмыс істеу қабілетін бағаладық (3-сурет, S4–S10-суреттер). Патогені жоқ бақылау үлгілерінде флуоресценция деңгейі төмен күйінде қалды, ал жасанды түрде жұқтырылған үлгілерде барлық концентрацияларда мақсатты сигнал тіркелді (S4-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HTM CARMEN күрделі биологиялық матрицаларда нуклеотидтер тізбегін ажырату қабілетін сақтайды, мұнда мақсатты және мақсатты емес сигналдың арақатынасы 2,99-дан 9,05-ке дейін болады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз &lt;em&gt;inhA&lt;/em&gt; және &lt;em&gt;katG&lt;/em&gt; гендері мысалында аллельдерді ажырату қабілеті сақталғанын растадық. Әр матрица үшін 20 үлгіде мақсатты аллельге басымдық тұрақты болды. Мақсатты/мақсатты емес белсенділіктің орташа көрсеткіштері: қақырық үшін 2,99–9,05, тұтас қан үшін 2,99–8,92 және DBS үшін 4,17–6,08 құрады (3A–C-суреттер, S7-кесте).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/contrived-samples.html\"&gt;Жасанды түрде жұқтырылған үлгілер&lt;/a&gt; (contrived samples) — бұл тест жүйесінің дәлдігін тексеру үшін белгілі мөлшердегі патогеннің генетикалық материалы қосылған биологиялық үлгілер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анықтау жиілігі әр концентрация үшін 20 үлгіде бағаланды. Тұтас қандағы &lt;em&gt;Pf&lt;/em&gt; ДНҚ-сы үшін CARMEN 10³, 10² және 10¹ көшірме/мкл концентрацияларында 18/20, ал 10⁰ көшірме/мкл кезінде 10/20 оң нәтиже көрсетті (3D-сурет). АИТВ-1 РНҚ-сы үшін: 10³ көшірме/мкл кезінде 20/20 және 10², 10¹, 10⁰ көшірме/мкл кезінде 19/20 оң нәтиже тіркелді (3E-сурет). Қақырықтағы &lt;em&gt;Mtb IS6110&lt;/em&gt; үшін 10³ пен 10⁻¹ көшірме/мкл аралығында 20/20 оң нәтиже алынды (3F-сурет, S6–S9-суреттер).&lt;/p&gt;\n&lt;p&gt;CARMEN және qPCR әдістерін салыстыру төмен концентрацияларда CARMEN-нің тиімділігі жоғары екенін көрсетті. Мысалы, 10¹ көшірме/мкл концентрацияда тұтас қанда CARMEN &lt;em&gt;Pf&lt;/em&gt;-ті 18/20 жағдайда, ал qPCR 7/20 жағдайда анықтады (3G, H-суреттер). Қақырықтағы &lt;em&gt;Mtb IS6110&lt;/em&gt; үшін 10⁻¹ көшірме/мкл кезінде CARMEN 20/20, ал qPCR 3/20 нәтиже көрсетті (3I-сурет, S8-кесте).&lt;/p&gt;\n&lt;h4 id=\"aitv-bezgek-zhaene-aitv-tuberkulez-zhasandy-koinfekciyalaryn-multipleksti-anykhtau\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#aitv-bezgek-zhaene-aitv-tuberkulez-zhasandy-koinfekciyalaryn-multipleksti-anykhtau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;АИТВ-безгек және АИТВ-туберкулез жасанды коинфекцияларын мультиплексті анықтау&lt;/span&gt;&lt;/a&gt;АИТВ-безгек және АИТВ-туберкулез жасанды коинфекцияларын мультиплексті анықтау&lt;/h4&gt;\n&lt;p&gt;Біз HTM CARMEN платформасының бір талдау аясында бірнеше инфекцияны бір мезгілде анықтау қабілетін бағаладық. Ол үшін клиникалық маңызы бар орталарда АИТВ-1 және безгек қоздырғышы (Pf) немесе АИТВ-1 және туберкулез микобактериясы (Mtb) бар үлгілер дайындалды. Pf және АИТВ-1 бар тұтас қанда тиісті crРНҚ-лар арқылы екі патоген үшін де флуоресцентті сигнал тіркелді, ал тек бір патогені бар үлгілер күтілген арнайы сигналдарды берді (4A-сурет, S12-сурет). Mtb және АИТВ-1 бар қақырық үлгілерінде де ұқсас нәтижелер алынды: флуоресценцияның белсенуі тек нысаналы арналарда байқалып, бөтен патогендер үшін минималды белсену тіркелді (4B-сурет, S12-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CARMEN платформасы екі патогенді бір мезгілде сәтті анықтайды және тіпті төмен концентрацияларда да qPCR көрсеткіштерінен жоғары сезімталдықты көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;crРНҚ (CRISPR-РНҚ) — бұл Cas ферменттерін патогеннің нақты ДНҚ немесе РНҚ тізбектеріне бағыттайтын және нысана анықталған кезде флуоресцентті сигналды іске қосатын бағыттаушы молекулалар.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әдістің тиімділігі әрбір концентрация комбинациясы үшін 20 жасанды үлгіде qPCR-мен салыстырылды (4C–F-суреттер, S12-сурет). Pf және АИТВ-1 коинфекциясы үшін CARMEN кең концентрация диапазонында анықтаудың жоғары жиілігін сақтады. Екі патоген де 10¹ көшірме/мкл концентрациясында болғанда, CARMEN Pf-ті 19/20 жағдайда және АИТВ-1-ді 18/20 жағдайда анықтады, ал qPCR сәйкесінше 8/20 және 9/20 жағдайда ғана анықтады. Концентрация 10⁰ көшірме/мкл-ге дейін төмендегенде, CARMEN Pf-ті 18/20 және АИТВ-1-ді 14/20 үлгіде анықтады, ал qPCR тек 3/20 және 4/20 жағдайда анықтады.&lt;/p&gt;\n&lt;p&gt;Қақырықтағы Mtb және АИТВ-1 коинфекциясы үшін 10¹ көшірме/мкл концентрациясында CARMEN екі патоген үшін де 20/20 сәтті анықтауды көрсетті, ал qPCR 12/20 (Mtb) және 18/20 (АИТВ-1) нәтижені тіркеді (4E–F-суреттер). 10⁰ көшірме/мкл концентрациясында CARMEN әр патогенді 18/20 үлгіде анықтады, ал qPCR сәйкесінше 11/20 және 12/20 нәтижені көрсетті. Бұл деректер CARMEN мультиплекстеу процесі төмен концентрацияларда да нысаналарды анықтауға кедергі келтірмейтінін және бұл жағдайларда әдіс qPCR-ден тұрақты түрде жоғары екенін растайды.&lt;/p&gt;\n&lt;h4 id=\"aitv,-bezgek,-tuberkulez-zhaene-aitv-tb-koinfekciyasyn-klinikalykh-anykhtau\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#aitv,-bezgek,-tuberkulez-zhaene-aitv-tb-koinfekciyasyn-klinikalykh-anykhtau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;АИТВ, безгек, туберкулез және АИТВ-ТБ коинфекциясын клиникалық анықтау&lt;/span&gt;&lt;/a&gt;АИТВ, безгек, туберкулез және АИТВ-ТБ коинфекциясын клиникалық анықтау&lt;/h4&gt;\n&lt;p&gt;Жасанды матрицалардағы аналитикалық сипаттамаларды растағаннан кейін, біз CARMEN жүйесін патоген дақылдарынан бөлінген нуклеин қышқылдарында сынадық. Әдіс &lt;em&gt;P. falciparum&lt;/em&gt; (Pf) паразитемиясын 1%-дан 0,01%-ға дейінгі диапазонда, АИТВ-1 РНҚ-сын 10⁷ мен 100 көшірме/мкл аралығында және &lt;em&gt;M. tuberculosis&lt;/em&gt; (Mtb) бактерияларын 10 000, 100 және 1 КОЕ/мл концентрацияларында анықтады (Сурет S13A-C). CARMEN флуоресценциясы qPCR Ct мәндерімен күтілгендей кері байланысты көрсетті (Сурет S13D-F).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CARMEN жүйесі жоғары сезімталдық танытып, патогендерді кең концентрациялық диапазонда анықтады және флуоресценция сигналы стандартты qPCR нәтижелерімен сәйкес келді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Келесі кезекте біз клиникалық үлгілерде толық мультиплексті панельді қолдандық (Сурет 5). Безгекпен ауыратын 20 расталған үлгінің 19-ы (95%) анықталды, ал 10 теріс үлгі дұрыс классификацияланды (Сурет 5A-B, Сурет S14). АИТВ-1 үшін де ұқсас нәтижелер алынды: 20 оң үлгінің 19-ы (95%) анықталып, 10 теріс үлгі дұрыс жіктелді (Сурет 5C-D, Сурет S14). Туберкулез бойынша 30 оң үлгіде CARMEN IS6110 маркерін 100% жағдайда анықтады, ал 20 теріс үлгі теріс күйінде қалды (Сурет 5E-F, Сурет S14).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari-f5.jpg\" alt=\"Клиникалық үлгілерде безгек, АИТВ-1, туберкулез және АИТВ-туберкулез коинфекциясын анықтау.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Клиникалық үлгілерде безгек, АИТВ-1, туберкулез және АИТВ-туберкулез коинфекциясын анықтау.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Клиникалық үлгілерде безгек, АИТВ-1, туберкулез және АИТВ-туберкулез коинфекциясын анықтау. (A-B) Безгек клиникалық үлгілерін (S1-20) талдау, (A) 20 расталған оң үлгі үшін көрсетілген HTM crРНҚ бойынша қалыпқа келтірілген CARMEN флуоресценциясын және (B) расталған оң және расталған теріс үлгілердегі қалыпқа келтірілген флуоресценцияны көрсетеді. (C-D) АИТВ-1 клиникалық үлгілерін талдау, (C) 20 расталған оң үлгі үшін көрсетілген HTM crРНҚ бойынша қалыпқа келтірілген CARMEN флуоресценциясын және (D) расталған оң және расталған теріс үлгілердегі қалыпқа келтірілген флуоресценцияны көрсетеді. (E-F) Туберкулез клиникалық үлгілерін талдау, (E) 30 GeneXpert-оң үлгі үшін Mtb суб-панелі бойынша қалыпқа келтірілген CARMEN флуоресценциясын және (F) расталған оң және расталған теріс үлгілердегі Mtb IS6110 талдауының флуоресценциясын көрсетеді. (G) Безгек, АИТВ және туберкулез үшін CARMEN жіктемесі мен референстік инфекция мәртебесі арасындағы оң пайыздық сәйкестік (PPA) және теріс пайыздық сәйкестік (NPA). (H) Расталған теріс үлгілермен салыстырғанда тоғыз расталған оң АИТВ-туберкулез коинфекцияланған клиникалық үлгілердегі Mtb IS6110 және АИТВ-1 үшін қалыпқа келтірілген флуоресценция. Барлық сызылған графиктер үшін жеке нүктелер клиникалық үлгілерді білдіреді, ал үзік сызықтар тиісті оң нәтиже шегін көрсетеді. Теріс қалыпқа келтірілген флуоресценция мәндері қалыпқа келтіру үшін пайдаланылатын фондық референстік мәннен төмен сигналды көрсетеді. CPC = біріктірілген оң бақылау. NTC = Нысанасыз бақылау. NDC = Анықтау бақылауы жоқ.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;qPCR (полимеразалық тізбекті реакция) — ДНҚ-ны көбейту әдісі, мұнда Ct (табалдырықты цикл) бастапқы генетикалық материал мөлшеріне кері пропорционал: Ct неғұрлым төмен болса, үлгіде патоген соғұрлым көп болады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Туберкулез панелі аясында біз &lt;em&gt;inhA&lt;/em&gt; және &lt;em&gt;katG&lt;/em&gt; гендеріндегі мутацияларды да талдадық. 30 үлгінің 11-інде &lt;em&gt;inhA&lt;/em&gt; -777 C&amp;gt;T және &lt;em&gt;katG&lt;/em&gt; S315T/N мутациялары болды; CARMEN барлық 11 жағдайды дұрыс анықтады (Сурет 5E). Қалған үлгілер изониазидке сезімтал (10/30) немесе панельге кірмеген басқа мутациялары бар (9/30) үлгілер болды. Референстік деректермен сәйкестік безгек пен АИТВ-1 үшін 95%, Mtb үшін 100% (PPA) болды, ал барлық топтар үшін теріс сәйкестік (NPA) 100%-ды құрады (Сурет 5G).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу шектеулі клиникалық үлгілерде жүргізілді; резистенттілік бойынша нәтижелер тек екі мутациямен шектелген, бұл штамдардың барлық генетикалық әртүрлілігін қамтымайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Соңында, біз АИТВ-ТБ коинфекциясы бар 9 үлгіні сынадық. CARMEN барлық 9 жағдайда екі патогенді де бір уақытта анықтады (Сурет 5H, Сурет S14). Бұл платформаның кешенді диагностика үшін, соның ішінде бірнеше инфекция мен дәрілік төзімділік маркерлерін бір жұмыс процесінде анықтау үшін тиімділігін растайды.&lt;/p&gt;\n&lt;h4 id=\"talkhylau-zhaene-khorytyndy\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#talkhylau-zhaene-khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау және қорытынды&lt;/span&gt;&lt;/a&gt;Талқылау және қорытынды&lt;/h4&gt;\n&lt;p&gt;АИТВ, туберкулез (ТБ) және безгек аурулары географиялық тұрғыдан жиі қабаттасатынына және клиникалық маңызды коинфекциялар тудыратынына қарамастан, әдетте әрқайсысы үшін жеке диагностикалық жолдар қолданылады. Біз HTM CARMEN жүйесін әзірледік — бұл CRISPR-Cas13a негізіндегі мультиплексті диагностикалық платформа, ол АИТВ-1, АИТВ-2, Plasmodium-ның төрт түрін және Mycobacterium tuberculosis (Mtb) бактериясын, сондай-ақ inhA және katG гендеріндегі дәрілік төзімділікпен байланысты нұсқаларды бір уақытта анықтай алады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR-Cas13a — бұл РНҚ-ны анықтауға арналған молекулалық құрал, ол патогеннің белгілі бір тізбегін тапқан кезде сигнал беретін молекуланы ыдыратады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;In vitro және клиникалық үлгілерде жүргізілген тәжірибелер HTM панелінің жоғары селективтілігін және бір нуклеотидті айырмашылықтарды анықтау қабілетін көрсетті. Расталған клиникалық үлгілерде жүйе безгек үшін 95% (19/20), АИТВ-1 үшін 95% (19/20) және Mtb IS6110 үшін 100% (30/30) оң сәйкестік деңгейін (PPA) көрсетті. Әрбір нысана үшін теріс сәйкестік (NPA) 100% құрады. Сондай-ақ, АИТВ-ТБ коинфекциясы расталған тоғыз үлгінің барлығында АИТВ-1 де, Mtb де анықталды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HTM CARMEN жүйесі вирустық, бактериялық және паразиттік инфекцияларды бір тестте біріктіріп, Mtb үшін 100% және АИТВ мен безгек үшін 95% дәлдікті қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл тәсілдің құндылығы — бір уақытта бірнеше инфекцияны талдау мүмкіндігінде. Бұл әсіресе АИТВ-ТБ коинфекциясы үшін маңызды, себебі ол аурудың ағымын өзгертеді және қақырық талдауына негізделген дәстүрлі диагностиканы қиындатады. 192-ге 24 микрофлюидті архитектурасы бір интегралды схемада 4608-ге дейін реакцияны жүзеге асыруға мүмкіндік береді. Қазіргі пішінде бұл технология орталықтандырылған зертханаларға арналған және көптеген ауруларға тән молекулалық әдістерді бірыңғай талдау жүйесіне біріктіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бұл жүйе жоғары өнімді зертханаларға арналған және әзірге жедел диагностикалық тесттердің орнын баса алмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"naetizheler-zhaene-klinikalykh-mangyzy\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#naetizheler-zhaene-klinikalykh-mangyzy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер және клиникалық маңызы&lt;/span&gt;&lt;/a&gt;Нәтижелер және клиникалық маңызы&lt;/h4&gt;\n&lt;p&gt;Жасанды коинфекциялық тәжірибелер HTM CARMEN жүйесінің тиімділігін растады. Жүйе P. falciparum/HIV-1 және Mtb/HIV-1 патогендерін, тіпті олардың салыстырмалы концентрациясы әртүрлі болған жағдайда да сәтті анықтады. Төмен концентрацияларда HTM CARMEN qPCR әдісіне қарағанда көбірек үлгілерді оң деп таныды, әсіресе P. falciparum/HIV-1 матрицаларында айырмашылықтар айқын болды. Расталған тоғыз клиникалық HIV-TB коинфекция үлгісінде HIV-1 және Mtb екеуінің де анықталуы бұл аналитикалық мүмкіндікті клиникалық тәжірибемен байланыстырудағы алғашқы қадам болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HTM CARMEN әртүрлі концентрацияларда патогендерді анықтауда тиімді және кейбір жағдайларда qPCR-ге қарағанда жоғары сезімталдық көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Патогеннің бар-жоғын анықтаудан бөлек, жүйе безгек түрлерін ажыратуға және Mtb резистенттілігін генотиптеуге мүмкіндік береді. Арнайы crRNA көмегімен Mtb-нің inhA (-777 C&amp;gt;T) және katG (S315T/N) локустары бойынша жабайы және мутантты түрлерін ажыратуға қол жеткізілді. Бұл маңызды, себебі изониазидке (INH) резистенттілік көбінесе тек рифампицинге бағытталған скрининг кезінде назардан тыс қалады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;crRNA (CRISPR-РНҚ) — бұл CRISPR жүйесіне қай ДНҚ немесе РНҚ тізбегін анықтау керектігін көрсететін бағыттаушы молекула.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"shekteuler-men-perspektivalar\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#shekteuler-men-perspektivalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен перспективалар&lt;/span&gt;&lt;/a&gt;Шектеулер мен перспективалар&lt;/h4&gt;\n&lt;p&gt;Ағымдағы зерттеуде бірқатар шектеулер бар. Клиникалық когорталар салыстырмалы түрде шағын болды және олар проспективті түрде іріктелген науқастар емес, референттік үлгілерден тұрды. Диагностикалық құндылықты бағалау үшін әртүрлі географиялық аймақтарда, патогендік жүктеме мен үлгі сапасын ескере отырып, ауқымды зерттеулер қажет. Сондай-ақ, INH резистенттілігі панелі барлық генетикалық нұсқаларды қамтымайтыны анықталды: 19 Mtb үлгісінің тоғызы резистентті болғанымен, оларда тексерілген локустардан тыс мутациялар болды. Mtb үшін IS6110 нысанасын пайдалану да көшірме саны аз штаммдарда жалған теріс нәтижелер қаупін тудырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Таңдама көлемінің шағындығы және референттік үлгілерді пайдалану нәтижелерді жалпы клиникалық популяцияға толық қолдануды шектейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;HTM CARMEN техникалық жағынан нуклеин қышқылдарын бөліп алуды және Biomark микрофлюидтік платформасын талап етеді, бұл оны орталықтандырылған зертханалар үшін қолайлы етеді. Дегенмен, CRISPR-дің бағдарламаланатын табиғаты эпидемиологиялық жағдай өзгерген кезде панельді жаңартуға мүмкіндік береді. Болашақта жүйе ДДСҰ алгоритмдеріне қосымша ретінде аймақтық зертханаларда коинфекцияларды кешенді талдау үшін қызмет ете алады.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"panel-dizajny-zhaene-aezirleu\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#panel-dizajny-zhaene-aezirleu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Панель дизайны және әзірлеу&lt;/span&gt;&lt;/a&gt;Панель дизайны және әзірлеу&lt;/h4&gt;\n&lt;p&gt;Барлық организмдердің геномындағы консервативті аймақтарды анықтау үшін олигонуклеотидті праймерлер мен бес crRNA-гид жобаланды. Бес патоген (&lt;em&gt;Plasmodium falciparum 3D7&lt;/em&gt;, &lt;em&gt;P. vivax&lt;/em&gt;, &lt;em&gt;P. ovale&lt;/em&gt;, &lt;em&gt;P. malariae&lt;/em&gt; және &lt;em&gt;Mycobacterium tuberculosis&lt;/em&gt;) үшін консервативті аймақтар таңдап алынды. &lt;em&gt;M. tuberculosis&lt;/em&gt; үшін изониазидке төзімділікпен байланысты &lt;em&gt;inhA&lt;/em&gt; -777 C&amp;gt;T және &lt;em&gt;katG&lt;/em&gt; S315T/N мутацияларын анықтау үшін екі crRNA жұбы әзірленді. HIV және RNase P үшін бұрын сипатталған әдістер қолданылды. Басқа нысаналар үшін ADAPT (https://adapt.run/) алгоритмі арқылы &amp;gt;95% қамтуы бар crRNA дизайндары жасалды. &lt;em&gt;P. malariae&lt;/em&gt; &lt;a href=\"concepts/18s-rrna.html\"&gt;18S rRNA&lt;/a&gt; тізбегі NCBI деректері негізінде реконструкцияланды. &lt;em&gt;P. malariae&lt;/em&gt; үшін SHERLOCK скринингі арқылы бірегей аймақтар итеративті түрде анықталды. &lt;em&gt;M. tuberculosis&lt;/em&gt; SNP талдауы үшін BADGERS бағдарламалық жасақтамасы қолданылды. &lt;em&gt;katG&lt;/em&gt; S315T/N үшін арналған crRNA нысана алдында гуанин (жабайы түр) болған кезде Cas13a белсенділігінің төмендеуін пайдаланады. Праймерлер NCBI Primer-BLAST көмегімен 60^° C балқу температурасында жобаланды. Барлық тізбектер S2-S4 кестелерінде келтірілген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;crRNA (CRISPR RNA) — бұл Cas13 ферментін нақты генетикалық тізбекке бағыттайтын және оны анықтауға көмектесетін қысқа РНҚ молекуласы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;crRNA in vitro транскрипциясы&lt;/p&gt;\n&lt;p&gt;crRNA-лар M2 қосымша әдісіне сәйкес in vitro транскрипция (IVT) арқылы жасалды. Гид шаблондары мен T7-промотор праймерлері Thermo Fisher Scientific компаниясынан ssDNA-олигонуклеотидтер ретінде тапсырыс берілді.&lt;/p&gt;\n&lt;h4 id=\"himiyalykh-sintezdelgen-nuklein-khyshkhyldary\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#himiyalykh-sintezdelgen-nuklein-khyshkhyldary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Химиялық синтезделген нуклеин қышқылдары&lt;/span&gt;&lt;/a&gt;Химиялық синтезделген нуклеин қышқылдары&lt;/h4&gt;\n&lt;p&gt;Әрбір нысана ампликоны үшін синтетикалық қос тізбекті ДНҚ (gBlocks) Integrated DNA Technologies компаниясынан алынды. Түпкі концентрация 10¹⁰ көшірме/мкл етіп дайындалды. Бұл gBlocks crRNA тиімділігін анықтау және CARMEN талдауларында қолданылды.&lt;/p&gt;\n&lt;h4 id=\"sandykh-sintetikalykh-rnkh-zhaene-dnkh\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#sandykh-sintetikalykh-rnkh-zhaene-dnkh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сандық синтетикалық РНҚ және ДНҚ&lt;/span&gt;&lt;/a&gt;Сандық синтетикалық РНҚ және ДНҚ&lt;/h4&gt;\n&lt;p&gt;&lt;em&gt;P. vivax&lt;/em&gt; (PRA-3004SD) және &lt;em&gt;P. malariae&lt;/em&gt; (PRA-3001SD) үшін синтетикалық ДНҚ, сондай-ақ HIV-1 (VR-3351SD) және HIV-2 (VR-3266SD) үшін синтетикалық РНҚ ATCC-тен, ал &lt;em&gt;P. ovale&lt;/em&gt; 18S rRNA плазмидасы BEI Resources-тен сатып алынды. Бұл материалдар сезімталдық пен ерекшелікті тексеру үшін пайдаланылды.&lt;/p&gt;\n&lt;h4 id=\"genomdykh-dnkh-uelgileri\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#genomdykh-dnkh-uelgileri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Геномдық ДНҚ үлгілері&lt;/span&gt;&lt;/a&gt;Геномдық ДНҚ үлгілері&lt;/h4&gt;\n&lt;p&gt;&lt;em&gt;B. microti&lt;/em&gt; (PRA-398DQ) және &lt;em&gt;P. falciparum&lt;/em&gt; (PRA-405D) геномдық ДНҚ-сы ATCC-тен, ал &lt;em&gt;T. gondii&lt;/em&gt; ДНҚ-сы UCLA Bradley зертханасынан алынды.&lt;/p&gt;\n&lt;h4 id=\"keri-transkripciya-zhaene-ptr-amplifikaciya\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#keri-transkripciya-zhaene-ptr-amplifikaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кері транскрипция және ПТР-амплификация&lt;/span&gt;&lt;/a&gt;Кері транскрипция және ПТР-амплификация&lt;/h4&gt;\n&lt;p&gt;РНҚ нысаналарын күшейту үшін SuperScript IV кері транскриптазасы қолданылды. 13 мкл көлемде 10 пг–5 мкг РНҚ, 1 мкл праймер (2 мкМ) және 1 мкл dNTP (10 мМ) араластырылды. 65°C-та 5 минут қыздырылғаннан кейін ферменттер қосылып, 55°C-та 15 минут инкубацияланды. Мультиплексті ПТР үшін New England Biolabs жиынтығы қолданылды. 50 мкл реакциялық қоспа 10 мкл мастер-микс, 5 мкл праймерлер және 4 мкл матрицадан тұрды. Бағдарлама: 95°C (2 минут), 40 цикл (95°C — 30 с, 58°C — 60 с, 72°C — 60 с) және 72°C-та 5 минуттық соңғы ұзарту.&lt;/p&gt;\n&lt;h4 id=\"384-uyashykhty-planshettik-rider-koemegimen-cas13a-detekciyasy-sherlock\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#384-uyashykhty-planshettik-rider-koemegimen-cas13a-detekciyasy-sherlock\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;384-ұяшықты планшеттік ридер көмегімен Cas13a детекциясы (SHERLOCK)&lt;/span&gt;&lt;/a&gt;384-ұяшықты планшеттік ридер көмегімен Cas13a детекциясы (SHERLOCK)&lt;/h4&gt;\n&lt;p&gt;crRNA таңдау үшін SHERLOCK әдістемесі қолданылды. gBlocks фрагменттері 10⁴ пен 10⁰ көшірме/мкл аралығындағы концентрацияларға дейін сұйылтылып, ПТР арқылы күшейтілді. Детекцияға арналған мастер-микс құрамына 40 мМ Tris-HCl, 1 мМ DTT, 1 мМ rNTP, 1 бірлік/мкл РНКаза ингибиторы, 22,5 нМ LwaCas13a, 1 бірлік/мкл T7 РНҚ-полимеразасы, 62,5 нМ флуоресцентті зонд (FAM-rUrUrUrUrUrU-3IABkFQ) және 14 мМ MgOAc кірді. 96-ұяшықты планшетке 58,5 мкл мастер-микс, 1,67 мкл crRNA (24 нг/мкл) және 3,15 мкл күшейтілген нысана қосылды. NTC (нысанасыз бақылау) үшін 3,15 мкл ПТР теріс бақылауы пайдаланылды. Қоспа 384-ұяшықты планшетке (20 мкл-ден үш қайтара) ауыстырылып, QuantStudio 5 жүйесінде 37°C-та 3 сағат бойы әр 5 минут сайын флуоресценция өлшенді. Деректер Design and Analysis v2.7.0 бағдарламасында өңделді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SHERLOCK — бұл Cas13a ферментін қолданатын молекулалық диагностика әдісі, ол өзіне тән РНҚ-нысананы танығанда айналасындағы РНҚ молекулаларын, соның ішінде флуоресцентті зондтарды ыдырата бастайды, бұл патогеннің бар екенін көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"biomark-hd-zhuejesindegi-carmen-taldaulary\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#biomark-hd-zhuejesindegi-carmen-taldaulary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Biomark HD жүйесіндегі CARMEN талдаулары&lt;/span&gt;&lt;/a&gt;Biomark HD жүйесіндегі CARMEN талдаулары&lt;/h4&gt;\n&lt;p&gt;CARMEN талдаулары Biomark HD платформасында 24x192 интегралданған микрофлюидті чиптер (IFC) көмегімен жүргізілді. Реакция үлгілер мен талдау қоспаларының комбинаторлық араласуына негізделген. Талдау қоспасы (1,33X) құрамында 600 нМ LwaCas13a, 1,67 бірлік/мкл T7 РНҚ-полимеразасы және 450 нМ crRNA болды. Үлгі қоспасы (1,5X) T7 буферін, арнайы үлгі буферін (66,66 мМ Tris-HCl, 8,33 мМ NaCl, 15 мМ MgCl₂, 1,67 мМ DTT, 1,67% PEG-8K), 1,5 бірлік/мкл РНКаза ингибиторын, 1,5 мМ rNTP, 0,75 мМ флуоресцентті зондты және ROX-референсті қамтыды. 192.24 IFC чипі IFC Controller RX құрылғысына жүктеліп, 37°C-та 3 сағат бойы әр 5 минут сайын флуоресценция кескіндері жиналды.&lt;/p&gt;\n&lt;h4 id=\"biomark-hd-da-in-vitro-cas13a-detekciyasynyng-sezimtaldyghy\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#biomark-hd-da-in-vitro-cas13a-detekciyasynyng-sezimtaldyghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Biomark HD-да in vitro Cas13a детекциясының сезімталдығы&lt;/span&gt;&lt;/a&gt;Biomark HD-да in vitro Cas13a детекциясының сезімталдығы&lt;/h4&gt;\n&lt;p&gt;Нысаналардың геномдық материалы суда 10⁴, 10³, 10², 10¹, 10⁰ және 10⁻¹ көшірме/мкл концентрацияларына дейін сұйылтылды. Үлгілер техникалық дубликаттарда талданды. Реакция кинетикасы әрбір crRNA үшін диагностикалық шектік мәндермен салыстырылды.&lt;/p&gt;\n&lt;h4 id=\"nuklein-khyshkhyldaryn-ekstrakciyalau-aedisteri\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#nuklein-khyshkhyldaryn-ekstrakciyalau-aedisteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нуклеин қышқылдарын экстракциялау әдістері&lt;/span&gt;&lt;/a&gt;Нуклеин қышқылдарын экстракциялау әдістері&lt;/h4&gt;\n&lt;p&gt;M. tuberculosis, P. falciparum және HIV-1 генетикалық материалы стандартты хаттамаларға сәйкес бөліп алынды.&lt;/p&gt;\n&lt;h4 id=\"m-tuberculosis-gdnkh-syn-ekstrakciyalau\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#m-tuberculosis-gdnkh-syn-ekstrakciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M. tuberculosis гДНҚ-сын экстракциялау&lt;/span&gt;&lt;/a&gt;M. tuberculosis гДНҚ-сын экстракциялау&lt;/h4&gt;\n&lt;p&gt;M. tuberculosis гДНҚ-сын бөлу үшін QIAamp DNA Mini Kit қолданар алдында механикалық жасуша бұзу (bead beating) әдісі қолданылды. 10 мл дақыл центрифугаланды (5000 x g, 10 минут). Тұнба 180 мкл ATL буферінде суспензияланып, 300 мкл цирконий/силика моншақтары (0,1 мм) қосылды және мұз үстінде суытып, 1 минуттан үш рет вортекстелді. 20 мкл протеиназа K қосылып, 56°C-та 3 сағат инкубацияланды. Содан кейін 200 мкл AL буфері (70°C-та 10 минут) және 200 мкл 100% этанол қосылды. Лизат QIAamp колонкаларына ауыстырылып, AW1 және AW2 буферлерімен жуылды (6000 x g), содан кейін ДНҚ 50 мкл сумен элюцияланды.&lt;/p&gt;\n&lt;h4 id=\"p-falciparum-dakhylyn-oesiru-zhaene-rnkh-ekstrakciyasy\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#p-falciparum-dakhylyn-oesiru-zhaene-rnkh-ekstrakciyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;P. falciparum дақылын өсіру және РНҚ экстракциясы&lt;/span&gt;&lt;/a&gt;P. falciparum дақылын өсіру және РНҚ экстракциясы&lt;/h4&gt;\n&lt;p&gt;P. falciparum 3D7 штаммы адамның қызыл қан түйіршіктерінде (O+ тобы) 0,5% Albumax II, 2 мМ L-глутамин, 50 мг/л гипоксантин, 25 мМ HEPES, 0,225% NaHCO3 және 10 мг/мл гентамицин қосылған RPMI 1640 ортасында өсірілді. Инкубация 37°C температурада, 5% O2, 5% CO2 және 90% N2 қоспасы астында жүргізілді. РНҚ 1% паразитемиясы бар P. falciparum 3D7 дақылдарынан екі биологиялық қайталауда бөлініп алынды. Жасушалар PBS-пен жуылып, центрифугаланды және TRIzol® LS реагентінде (37°C-та 5 минут) лизиске ұшырады. Хлороформ қосып, вортекс және центрифугалаудан кейін РНҚ бар сулы фаза бөлініп алынды және изопропанолмен -20°C-та бір түн бойы тұндырылды. Тұнба этанолмен жуылып, РНҚ-сыз суда ерітілді. ДНҚ ластануы 4 бірлік ДНКаза I (NEB) көмегімен жойылды және EDTA-мен инактивацияланды. РНҚ сапасы гель-электрофорезбен тексерілді; талдау үшін 0,1% және 0,01% сұйылтылған үлгілер дайындалды.&lt;/p&gt;\n&lt;h4 id=\"aitv-1-rnkh-ekstrakciyasy\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#aitv-1-rnkh-ekstrakciyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;АИТВ-1 РНҚ экстракциясы&lt;/span&gt;&lt;/a&gt;АИТВ-1 РНҚ экстракциясы&lt;/h4&gt;\n&lt;p&gt;Лизиске ұшыраған АИТВ-1 вирус үлгілері профессор Отто Янгтың (UCLA) зертханасынан алынды. РНҚ экстракциясы Quick DNA/RNA™ MagBead Kit (Zymo Research) жинағымен M1 хаттамасы бойынша орындалды (SN-сурет).&lt;/p&gt;\n&lt;h4 id=\"khurghakh-khan-dakhtaryn-dbs-dajyndau-zhaene-elyuciyalau\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#khurghakh-khan-dakhtaryn-dbs-dajyndau-zhaene-elyuciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Құрғақ қан дақтарын (DBS) дайындау және элюциялау&lt;/span&gt;&lt;/a&gt;Құрғақ қан дақтарын (DBS) дайындау және элюциялау&lt;/h4&gt;\n&lt;p&gt;DBS үлгілері Qiagen FTA DBS карталарына генетикалық материалы бар тұтас қанды тамызу арқылы дайындалды (әр дақ ~50 мкл). 4 сағат кептірілгеннен кейін карталар кептіргішпен -20°C-та сақталды. Элюция үшін қан дағы кесіліп, 500 мкл элюция буферіне (PBS + 0,05% Tween) салынды, 5 рет вортекс жасалды және 5 мкл протеиназа K (Zymo Research) қосылды. Инкубация: 56°C-та 1 сағат, содан кейін 95°C-та 10 минут. Элюаттар Quick DNA/RNA™ MagBead Kit көмегімен тазартылды.&lt;/p&gt;\n&lt;h4 id=\"khakhyrykhtan,-sarysudan,-khannan-zhaene-dbs-ten-nuklein-khyshkhyldaryn-boelip-alu\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#khakhyrykhtan,-sarysudan,-khannan-zhaene-dbs-ten-nuklein-khyshkhyldaryn-boelip-alu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қақырықтан, сарысудан, қаннан және DBS-тен нуклеин қышқылдарын бөліп алу&lt;/span&gt;&lt;/a&gt;Қақырықтан, сарысудан, қаннан және DBS-тен нуклеин қышқылдарын бөліп алу&lt;/h4&gt;\n&lt;p&gt;Нуклеин қышқылдары Quick DNA/RNA™ MagBead Kit (M1 хаттамасы) көмегімен бөлінді. Үлгілер DNA/RNA Shield™-пен 2:1 қатынасында араластырылып (соңғы көлемі 400 мкл), 8 мкл протеиназа K (20 мг/мл) қосылды және 30°C-та 30 минут инкубацияланды. Центрифугалаудан (16 000 x g, 2 минут) кейін супернатант тең көлемдегі 100% изопропанолмен араластырылып, M1 хаттамасы бойынша тазартылды. Соңғы элюция нуклеазасыз суда жүргізілді.&lt;/p&gt;\n&lt;h4 id=\"zhasandy-uelgilerdi-synau\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#zhasandy-uelgilerdi-synau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жасанды үлгілерді сынау&lt;/span&gt;&lt;/a&gt;Жасанды үлгілерді сынау&lt;/h4&gt;\n&lt;p&gt;Тазартылған нуклеин қышқылдары мен gBlocks (SNP нысаналары) сұйылтылып, әртүрлі матрицаларға (қақырық, сарысу, қан, DBS) 10³, 10², 10¹, 10⁰ және 10⁻¹ көшірме/мкл концентрациясында қосылды. Әр комбинация 20 қайталауда HTM crRNA панелімен сыналды. ТБ дәрілік төзімділігі мен M. tuberculosis ДНҚ-сы қақырық, қан және DBS-те бағаланды. P. falciparum ДНҚ, АИТВ-1 РНҚ, сондай-ақ P. ovale, P. vivax, P. malariae және АИТВ-2 материалдары қан, сарысу және DBS-те сыналды. Сондай-ақ АИТВ-ТБ және АИТВ-P. falciparum коинфекция үлгілері (10³–10⁰ көшірме/мкл) дайындалды. Экстракция MagBead жинағымен, сынақ CARMEN әдісімен (Biomark HD) орындалды. RNase P геніне қарсы праймерлер оң бақылау ретінде қолданылды.&lt;/p&gt;\n&lt;h4 id=\"zhasandy-uelgilerdi-qpcr-arkhyly-synau\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#zhasandy-uelgilerdi-qpcr-arkhyly-synau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жасанды үлгілерді qPCR арқылы сынау&lt;/span&gt;&lt;/a&gt;Жасанды үлгілерді qPCR арқылы сынау&lt;/h4&gt;\n&lt;p&gt;Сезімталдықты салыстыру үшін үлгілер qPCR арқылы бағаланды. РНҚ кері транскрипцияланды. 2X PowerUp SYBR Green Master Mix (Applied Biosystems) қолданылды. Параметрлер: 50°C-та 2 минут, 95°C-та 2 минут, 40 цикл (95°C-та 30 с, 58°C-та 60 с, 72°C-та 60 с). Реакциялар үш данада (10 мкл көлем) өткізілді. Деректер Design and Analysis v2.7.0 бағдарламасында талданды.&lt;/p&gt;\n&lt;h4 id=\"etika-maelimdemesi\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#etika-maelimdemesi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Этика мәлімдемесі&lt;/span&gt;&lt;/a&gt;Этика мәлімдемесі&lt;/h4&gt;\n&lt;p&gt;Клиникалық үлгілер тиісті мекеме хаттамалары негізінде анонимді түрде алынды.&lt;/p&gt;\n&lt;h4 id=\"sau-donor-uelgileri\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#sau-donor-uelgileri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сау донор үлгілері&lt;/span&gt;&lt;/a&gt;Сау донор үлгілері&lt;/h4&gt;\n&lt;p&gt;20 сау донордың (10 ер, 10 әйел) сарысуы BioIVT-дан, тұтас қан UCLA қан орталығынан, қақырық Стэнфорд университетінен алынды және жасанды тәжірибелер үшін патогендердің генетикалық материалымен байытылды.&lt;/p&gt;\n&lt;h4 id=\"aitv-1-bar-naukhastardyng-uelgileri\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#aitv-1-bar-naukhastardyng-uelgileri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;АИТВ-1 бар науқастардың үлгілері&lt;/span&gt;&lt;/a&gt;АИТВ-1 бар науқастардың үлгілері&lt;/h4&gt;\n&lt;p&gt;UCLA Клиникалық микробиология зертханасынан (IRB-25-2048) 10 теріс және ОТ-ПТР арқылы АИТВ-1 оң деп расталған 20 үлгі (вирустық жүктеме 32-ден 2 660 000 көшірме/мл-ге дейін) жиналды. Плазма үлгілері жылумен инактивацияланып, -80°C температурада сақталды. CARMEN талдауына дейін үлгілер лизистен өткізіліп, нуклеин қышқылдары Quick-DNA/RNA MagBead Kit (Zymo Research, SN кестесін қараңыз) жиынтығымен бөлініп алынды.&lt;/p&gt;\n&lt;h4 id=\"bezgekpen-auyratyn-naukhastardyng-uelgileri\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#bezgekpen-auyratyn-naukhastardyng-uelgileri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Безгекпен ауыратын науқастардың үлгілері&lt;/span&gt;&lt;/a&gt;Безгекпен ауыратын науқастардың үлгілері&lt;/h4&gt;\n&lt;p&gt;BinaxNOW Malaria және/немесе ОТ-ПТР арқылы безгекке оң нәтиже берген 20 үлгі Boca Biolistics компаниясынан сатып алынды. Оның 8-і сарысу, 12-сі тұтас қан үлгілері. Үлгілер құрғақ мұзда тасымалданып, -80°C-та сақталды. CARMEN талдауы алдында үлгілер Quick DNA/RNA MagBead Kit (Zymo Research, SN кестесін қараңыз) көмегімен өңделді.&lt;/p&gt;\n&lt;h4 id=\"tuberkulezben-auyratyn-naukhastardyng-uelgileri\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#tuberkulezben-auyratyn-naukhastardyng-uelgileri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Туберкулезбен ауыратын науқастардың үлгілері&lt;/span&gt;&lt;/a&gt;Туберкулезбен ауыратын науқастардың үлгілері&lt;/h4&gt;\n&lt;p&gt;FIND Specimen Bank (Женева, Швейцария) GeneXpert арқылы M. tuberculosis-ке оң нәтиже берген 30 үлгіні ұсынды. Сонымен қатар, M. tuberculosis және АИТВ-1-ге оң нәтиже берген 9 плазма үлгісі сатып алынды. Бұл 9 үлгі SN кестесінде көрсетілген әдіс бойынша өңделді.&lt;/p&gt;\n&lt;h4 id=\"derekterdi-taldau-zhaene-diagnostikalykh-kriterijler\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#derekterdi-taldau-zhaene-diagnostikalykh-kriterijler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деректерді талдау және диагностикалық критерийлер&lt;/span&gt;&lt;/a&gt;Деректерді талдау және диагностикалық критерийлер&lt;/h4&gt;\n&lt;p&gt;Biomark HD құрылғысынан алынған флуоресценция деректерін өңдеу үшін Python скрипті қолданылды. FAM репортер сигналы әр реакция камерасында мына формула бойынша нормаланды: Нормаланған сигнал = (үлгі сигналы / бақылау сигналы). CARMEN үшін шекті мәндер (threshold) әр crRNA үшін NTC (үлгісіз бақылау) сигналының орташа мәні мен 3 стандартты ауытқудың (SD) қосындысы ретінде белгіленді: шек = NTC орташа мәні + 3 * SD. Егер нормаланған сигнал осы шектен асса, үлгі оң деп танылды. qPCR талдауында Ct &amp;lt; 38 болса оң, Ct ≥ 38 немесе анықталмаған болса теріс нәтиже деп есептелді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;NTC (No Template Control) — бұл реагенттердің ластануын тексеру үшін құрамында нысаналы ДНҚ/РНҚ жоқ бақылау үлгісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;inhA және katG гендеріндегі SNP (бір нуклеотидті полиморфизмдерді) анықтау үшін 60 минуттан кейін WT және MUT crRNA арасындағы флуоресценция қатынасы есептелді. Егер MUT/WT қатынасы 2-ден асса, мутантты аллель доминантты деп саналды. Диагностикалық дәлдік PPA (оң сәйкестік пайызы) және NPA (теріс сәйкестік пайызы) көрсеткіштері арқылы анықталды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari-f1.jpg\" alt=\"HTM CARMEN CRISPR диагностикалық панелінің дизайны мен жұмыс процесі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;HTM CARMEN CRISPR диагностикалық панелінің дизайны мен жұмыс процесі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;HTM CARMEN CRISPR диагностикалық панелінің дизайны мен жұмыс процесі. (A) HTM CARMEN жұмыс процесінің сызбасы, үлгілерді жинауды, нуклеин қышқылдарын экстракциялауды, нысананы амплификациялауды және CARMEN платформасында CRISPR-Cas13a анықтауды, сондай-ақ АИТВ, Plasmodium, Mtb және коинфекцияларды мультиплексті анықтауды көрсетеді. (B) Plasmodium түрлерін дифференциациялауға арналған дизайн стратегиясы. P. falciparum, P. vivax, P. ovale және P. malariae 18S рРНҚ консенсустық тізбектері бойынша тізбектердің консервативтілігі амплификация праймерлері мен түрге тән crРНҚ орналасуымен бірге көрсетілген. Праймерлер консервативті аймақтар ішінде орналастырылды, ал crРНҚ ADAPT көмегімен анықталған түрлерді ажырататын аймақтарға бағытталды. (C) Mtb inhA промоторы −777 C&amp;gt;T және katG S315T/N локустары үшін аллельге тән crРНҚ анықтау сызбасы. Туыстас crРНҚ-нысана жұптасуы Cas13a белсендірілуіне және флуоресценцияның генерациясына ықпал етеді, ал бір нуклеотидті сәйкессіздік белсендірілуді төмендетеді, бұл салыстырмалы флуоресценция сигналдары негізінде жабайы типтегі және мутантты аллельдерді ажыратуға мүмкіндік береді. (D) Таңдалған Plasmodium және Mtb талдауларының NCBI тізбектерінің жалпыға қолжетімді деректер жиыны бойынша болжамды қамтылуы. Қамтылу праймерлердің байланысуын және crРНҚ белсенділігін қолдайды деп болжанған тізбектердің үлесін білдіреді. Әрбір талдау үшін бағаланған жалпы тізбектерге қатысты қамтылған тізбектер саны көрсетілген.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari-f3.jpg\" alt=\"HTM CARMEN клиникалық маңызды үлгі матрицаларында аллельдік дискриминация мен сезімтал анықтауды сақтайды.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;HTM CARMEN клиникалық маңызды үлгі матрицаларында аллельдік дискриминация мен сезімтал анықтауды сақтайды.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;HTM CARMEN клиникалық маңызды үлгі матрицаларында аллельдік дискриминация мен сезімтал анықтауды сақтайды. (A-C) (A) қақырық, (B) тұтас қан және (C) кептірілген қан дақтары (DBS) үлгілерінде тексерілгеннен кейінгі Mtb inhA және katG crРНҚ аллельдік дискриминациясы. Белсенділік қатынастары әрбір жасанды үлгі үшін 10^4 көшірме/мкл концентрациясында 60 минуттағы «нысаналы/нысаналы емес» қалыпқа келтірілген флуоресценция ретінде есептелді және 20 үлгі бойынша орташа ± стандартты ауытқу ретінде көрсетілген. Үзік сызық 2 белсенділік қатынасын көрсетеді, бұл аллельді артықшылықты танудың жоқтығына сәйкес келеді. (D-F) (D) тұтас қандағы P. falciparum геномдық ДНҚ-сын, (E) тұтас қандағы АИТВ-1 геномдық РНҚ-сын немесе (F) қақырықтағы Mtb геномдық ДНҚ-сын қамтитын 20 жасанды үлгідегі төмен концентрациялы нысаналарды анықтау. Бағандар орташа қалыпқа келтірілген CARMEN флуоресценциясын ± стандартты ауытқуды көрсетеді; жеке нүктелер әрбір жасанды үлгіні білдіреді. Үзік сызықтар талдаудың оң нәтиже шектерін көрсетеді. (G-I) (G) P. falciparum, (H) АИТВ-1 және (I) Mtb IS6110 үшін нысана концентрациясы мен үлгі матрицасы бойынша CARMEN және qPCR анықтауды салыстыру. Жылу карталары P. falciparum және АИТВ-1 үшін тұтас қан, сарысу және DBS-те, ал Mtb IS6110 үшін қақырық, тұтас қан және DBS-те әрбір нысана концентрациясында 20-дан оң деп жіктелген үлгілер санын көрсетеді. Түс шкалалары 20-дан оң деп жіктелген үлгілер санын көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari-f4.jpg\" alt=\"Жасанды Pf-АИТВ-1 және Mtb-АИТВ-1 коинфекцияларын мультиплексті анықтау.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Жасанды Pf-АИТВ-1 және Mtb-АИТВ-1 коинфекцияларын мультиплексті анықтау.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Жасанды Pf-АИТВ-1 және Mtb-АИТВ-1 коинфекцияларын мультиплексті анықтау. (A-B) (A) тұтас қанға бір мезгілде қосылған Pf және АИТВ-1 және (B) қақырыққа бір мезгілде қосылған Mtb және АИТВ-1-ді көрсетілген нысана концентрацияларында мультиплексті CARMEN анықтау. Жылу карталары коинфекцияланған үлгілер үшін көрсетілген HTM crРНҚ бойынша 60 минуттағы қалыпқа келтірілген флуоресценцияны және көрсетілген нысана концентрацияларындағы тиісті бір нысаналы бақылауларды көрсетеді. РНКаза P оң бақылауы және нысанасыз бақылау (NTC) көрсетілген жерде көрсетілген. (C-F) (C) CARMEN және (D) тұтас қандағы тиісті crРНҚ-мен Pf және АИТВ-1-ді qPCR анықтау; және (E) CARMEN және (F) қақырықтағы тиісті crРНҚ-мен Mtb және АИТВ-1-ді qPCR анықтау үшін әрбір концентрация бойынша 20 жасанды коинфекция үлгісі бойынша анықтау жиілігі. Жылу картасының мәндері АИТВ-1 және коинфекциялаушы патоген концентрациясының әрбір комбинациясында 20-дан оң деп жіктелген үлгілер санын көрсетеді. Түс шкалалары 20-дан оң деп жіктелген үлгілер санын көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Қосарланған&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;инфекцияны&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ұзақ бағалау&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Мультиплексті&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;CRISPR-Cas13a&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;талдауы&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Жоғары дәлдік&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;және мутация&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тану&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Күрделі&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;дерттерге&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;арналған&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бірыңғай тест&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Препринт лицензиясы&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;medRxiv&lt;/td&gt;\n&lt;td&gt;infectious diseases&lt;/td&gt;\n&lt;td&gt;все права у авторов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Jain, A. S.; Si, A.; Yap, J.; Schwartz, L. A.; Susilo, C.; Balamurugan, A.; Neal, A.; Le Roch, K. G.; Yang, O.; Garner, O.; Kamariza, M.&lt;/p&g
