        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"273\" cy=\"133\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"667\" cy=\"269\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · BIOENGINEERING   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;SpiraMed: миға дәрі-дәрмекті&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;жеткізудің жаңа спиральді&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;әдісі&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system-f1.jpg\" alt=\"1-сурет. SpiraMed ми терапиясын жеткізу тұжырымдамасы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. &lt;a href=\"concepts/spiramed.html\"&gt;SpiraMed&lt;/a&gt; ми терапиясын жеткізу тұжырымдамасы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет. SpiraMed ми терапиясын жеткізу тұжырымдамасы. A: Әрбір маңдай SpiraMed инесінің қол жеткізу траекториясы стриатумның ұзын осін қамтитын SpiraMed жеткізу катетерін ортогональды түрде орналастыруға мүмкіндік береді. B: Спиральды орналастыруды көрсететін SpiraMed 2-ші буын прототипінің компьютерлік жобалауы. C: Паркинсон ауруы, AADC тапшылығы немесе Хантингтон ауруы кезінде &lt;a href=\"concepts/advanced-therapy-medicinal-products.html\"&gt;ATMP&lt;/a&gt; енгізу үшін қарастырылған екі жақты путаминалды жеткізу стратегиясы. Стандартты маңдай бұрғылау тесіктері арқылы алдыңғы стриатумға екі жақты SpiraMed инесінің қол жеткізуі путаменнің нысаналы көлемін (жасыл) қамтитын SpiraMed катетерін орналастырумен жалғасады. SpiraMed катетерінің спираль қадамы 8 мм, диаметрі 8 мм, 4,5 спираль орамымен модельденген. Траектория және нысаналы ядролар жеке аксиалды, коронарлы және сагитталды жазықтықтарда (жоғарғы панельдер) және сәйкес 3D көлемдік қабаттасулар ретінде (төменгі панельдер) визуализацияланған. D: Хирургиялық резекцияға жарамсыз деп танылған мультифокальды жоғары дәрежелі глиомаға химиотерапияны енгізу үшін қарастырылған жеткізу стратегиясының мысалы. Маңдай және төбе SpiraMed тәсілінің траекториялары сәйкесінше бастапқы моторлы және сенсорлы қыртыстың алдында және артында жоспарланған. Маңдай катетері үшін 6 спираль орамы және төбе катетері үшін 4,5 ораммен, 8 мм қадаммен және 8 мм диаметрмен SpiraMed катетері модельденген. Траекториялар және шамамен емдеу көлемдері жеке аксиалды, коронарлы және сагитталды жазықтықтарда (жоғарғы панельдер) және сәйкес 3D көлемдік қабаттасулар ретінде (төменгі панельдер) визуализацияланған.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Мидың терең құрылымдарына дәрі жеткізу көптеген тесіктерді және ұзақ ота жасауды талап етеді. Жаңа SpiraMed жүйесі бір кіру нүктесі арқылы енгізілетін және дәріні нысаналы аймаққа біркелкі тарататын иілгіш спиральді катетерді пайдаланады. Бұл ота уақытын қысқартып, сау тіндердің зақымдану қаупін азайтады.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;SpiraMed бірнеше тесіктің орнына бір кіру нүктесін пайдаланып, қан кету қаупін азайтады.&lt;/li&gt;\n&lt;li&gt;Катетердің спиральді пішіні дәрі көлемін науқастың анатомиясына бейімдеуге мүмкіндік береді.&lt;/li&gt;\n&lt;li&gt;Сынақтар катетер арқылы өткеннен кейін жасушалардың өміршеңдігі сақталатынын растады.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Стандартты стереотаксикалық (мидың нақты нүктесіне құралдарды бағыттау әдісі) дәрі жеткізу көбінесе инемен бірнеше рет кіруді талап етеді, бұл қан кету қаупін арттырады және ота ұзақтығын 10-12 сағатқа дейін созады. SpiraMed жүйесі бұл мәселені тікелей мидың нысаналы аймағында ашылатын спиральді катетер арқылы шешеді. Спиральдің геометриясы — қадамы мен диаметрі — науқастың ота алдындағы МРТ суреттері мен қан тамырларының анатомиясы негізінде жеке реттеледі.&lt;/p&gt;\n&lt;p&gt;Агарозды фантомдарда (мидың гельдік модельдері), қойлар мен адам мәйіттерінде жүргізілген клиникаға дейінгі сынақтарда SpiraMed терапиялық агенттерді тезірек және біркелкі тарататынын көрсетті. Құрылғыны қолдану дәрінің ине каналы арқылы кері ағып кетуінсіз (&lt;a href=\"concepts/reflux.html\"&gt;рефлюкс&lt;/a&gt;) енгізілетін көлемін 64 мкл-ден 290 мкл-ге дейін арттыруға мүмкіндік берді. Маңыздысы, жүйе арқылы өту дофаминергиялық прогениторлық жасушалар мен CAR-T жасушаларының өміршеңдігін төмендетпейді, бұл жасушалық терапияның тиімділігі үшін өте маңызды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу клиникаға дейінгі кезеңде жануарлар мен мәйіттерде жүргізілген, сондықтан адамдардағы қауіпсіздігі клиникалық сынақтарда дәлелденуі тиіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Стереотаксистік ине арқылы енгізу әдісі озық терапиялық медициналық өнімдерді (ATMP) адам миына жергілікті жеткізудің стандартты әдісі болып қала береді. Әдетте, ATMP енгізу бірнеше траекторияны қажет етеді, бұл операция уақытын ұзартады және жиынтық тәуекелдерді арттырады. Сонымен қатар, препараттың кері ағуы (рефлюкс) және біркелкі таралмауы клиникалық нәтижелерді нашарлатады.&lt;/p&gt;\n&lt;p&gt;Авторлар «SpiraMed» деп аталатын жаңа тәсілді ұсынады, онда спираль пішінді катетер қолданылады. Жүйе әрбір нысана үшін бір ғана кіру траекториясы арқылы жұмыс істейді. Спиральді кері тарту процесі терапияны енгізумен синхрондалған, бұл нысаналы аймақты бірнеше секунд ішінде толық қамтуға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SpiraMed жүйесі бір ғана кіру нүктесі арқылы нысаналы аймақты толық қамтиды, бұл рефлюкс тәуекелін азайтады және хирургиялық операцияны жеделдетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Спиральдің қадамы мен диаметрі пациенттің жеке нысана көлемі мен қан тамырларының анатомиясына қарай, операция алдындағы стереотаксистік жоспарлау кезеңінде дәл бапталады. Жүйенің тиімділігі агарозды фантомдарда, тірі қойларда және адамның кадаверлік ми үлгілерінде сыналды.&lt;/p&gt;\n&lt;p&gt;Нәтижелер көрсеткендей, дәрілік заттарды жеткізу көлемі мен жылдамдығы артқан, нысаналы аймақты қамту сапасы жақсарған. Сондай-ақ, рефлюкс құбылыстары мен қан кету асқынуларының қаупі айтарлықтай төмендеген. SpiraMed орталық жүйке жүйесі ауруларын емдеуде жасушалық және гендік терапияның трансформациялық әлеуетін жүзеге асыру үшін жаңа парадигма болып табылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/agaroznye-fantomy.html\"&gt;Агарозды фантомдар&lt;/a&gt; — бұл ми тіндерінің физикалық қасиеттеріне ұқсас гельдік модельдер, олар дәріні жеткізу дәлдігін тексеру үшін қолданылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"ozhzh-ge-terapiyalykh-agentterdi-zhetkizu-maeselesi\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#ozhzh-ge-terapiyalykh-agentterdi-zhetkizu-maeselesi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ОЖЖ-ге терапиялық агенттерді жеткізу мәселесі&lt;/span&gt;&lt;/a&gt;ОЖЖ-ге терапиялық агенттерді жеткізу мәселесі&lt;/h4&gt;\n&lt;p&gt;Орталық жүйке жүйесінің (ОЖЖ) аурулары бүкіл әлем бойынша 3,4 миллиард адамға әсер етіп, жылына 11 миллион өлімге себеп болады. Қан-ми тосқауылы жүйелі терапияны шектейді, сондықтан препараттардың тек 8%-ы ғана клиникалық сынақтардан сәтті өтеді. Жасушалық, гендік және химиотерапиялық агенттерді қажетті концентрацияда жеткізудің жалғыз жолы — оларды тікелей ми паренхимасына енгізу. Қазіргі уақытта 60-тан астам гендік терапия және 20 жасуша алмастыру сынақтары жүргізілуде. Алайда, қолданыстағы әдістер кеміргіштердегі клиникаға дейінгі зерттеулерден алынған стереотаксикалық инелерге негізделген. ClearPoint Neuro SmartFlow сияқты құрылғылар Паркинсон ауруы кезіндегі дофаминергиялық иннервацияны қалпына келтіру сияқты күрделі міндеттер үшін арнайы әзірленбеген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қолданыстағы жеткізу әдістері тікелей инелерді пайдаланумен шектелген, бұл көптеген тесіктерді қажет етеді, қан кету қаупін және операция уақытын арттырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;TRANSEURO зерттеуінде (NCT01898390) фетальды дофаминергиялық трансплантаттарды енгізу әр стриатум үшін 5 траекторияны және әр жарты шар үшін 10–12 сағаттық операцияны талап етті. 11 пациенттің 2-уінде ми ішілік қан кету байқалды, ал операцияның ұзақтығы жасушалардың өміршеңдігін төмендетуі мүмкін еді. SpiraMed жүйесі осы шектеулерді еңсеру үшін құрылды.&lt;/p&gt;\n&lt;h4 id=\"zamanaui-nejrohirurgiyalykh-zhetkizuding-shekteuleri\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#zamanaui-nejrohirurgiyalykh-zhetkizuding-shekteuleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заманауи нейрохирургиялық жеткізудің шектеулері&lt;/span&gt;&lt;/a&gt;Заманауи нейрохирургиялық жеткізудің шектеулері&lt;/h4&gt;\n&lt;p&gt;Адам стриатумының көлемі (35 000 мм³) тышқандікінен (23 мм³) 1000 есе үлкен. Бұл хирургтарды бірнеше траекторияны пайдалануға мәжбүр етеді, бұл қан тамырларының зақымдану қаупін (инені әр енгізген сайын 1%-ға дейін) және гематоманың дамуын арттырады. Сонымен қатар, «рефлюкс» (препараттың ине бойымен кері ағуы) инфузия жылдамдығы мен таралу көлемін шектейді, бұл нысаналы аймақтың біркелкі емес жабылуына әкеледі. Ұзаққа созылған операциялар анестезиологиялық тәуекелдерді және төсек жараларының даму ықтималдығын арттырады, ал жұлын сұйықтығының ағып кетуі мидың ығысуына әкелуі мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/ced.html\"&gt;Конвекциялық күшейтілген жеткізу&lt;/a&gt; (CED) — ми тіндерінде препараттарды біркелкі тарату үшін қысыммен енгізу әдісі, бірақ ол көбінесе сұйықтықтың кері ағуы (рефлюкс) мәселесіне тап болады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Путамен гендік терапиясында диффузия миллиметрмен шектелген және CED қолдану көбінесе нысаналы көлемнің тек 26%-ын ғана қамтиды. Артқы траекториялар арқылы қамтуды жақсарту әрекеттері пациентті күрделі орналастыруды және иненің маңызды қыртыс аймақтарынан өтуін талап етеді. Біз SpiraMed шешімін ұсынамыз: путаменнің ұзын осі бойымен катетерді ортогональды орналастыру арқылы бір фронтальды траекторияны пайдалану, бұл тәуекелдерді азайтады және толық қамтуды қамтамасыз етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ұсынылған деректер клиникаға дейінгі тұжырымдаманың дәлелі болып табылады; SpiraMed әдісінің тиімділігі мен қауіпсіздігі клиникалық жағдайда расталуы керек.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"spiramed-spiral-negizindegi-zhetkizu-koncepciyasy-zhaene-prototipteu\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#spiramed-spiral-negizindegi-zhetkizu-koncepciyasy-zhaene-prototipteu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SpiraMed спираль негізіндегі жеткізу концепциясы және прототиптеу&lt;/span&gt;&lt;/a&gt;SpiraMed спираль негізіндегі жеткізу концепциясы және прототиптеу&lt;/h4&gt;\n&lt;p&gt;SpiraMed жүйесі стандартты стереотаксикалық жабдық пен жоспарлау бағдарламаларын пайдалана отырып, мидың нысаналы бөлігіне бірыңғай траектория бойынша дәрілік заттарды жеткізеді. Спиральды катетер ине ұшынан шығып, нысаналы көлемді қамтиды, содан кейін дәріні үздіксіз синхронды түрде жібере отырып, кері тартылады, бұл рефлюксті (кері ағуды) барынша азайтады (1A-сурет; SN 1-сурет). Бірінші (механикалық) және екінші (электронды) буын прототиптері әзірленді (1B-сурет; SN 1-5 суреттер). Хирургиялық жоспарларға путаменге екі жақты дәрі жіберу (1C-сурет) және жоғары дәрежелі глиоманы химиотерапиялау кіреді (1D-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/stereotaksis.html\"&gt;Стереотаксия&lt;/a&gt; — мидың терең құрылымдарына нақты координаттар бойынша аспаптарды енгізуге мүмкіндік беретін нейрохирургиялық әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бірінші буын прототиптері белгіленген өлшемдегі спиральды қалыптастыру үшін қолмен басқарылатын механизмді пайдаланады (SN 2-сурет). Екінші буын электронды жетектің көмегімен катетерді иілген жол бойымен қозғалтады және бір уақытта спираль қалыптастыру үшін ось бойымен бұралуды жүзеге асырады (2A-сурет; SN 3,4,5-суреттер). Бұл тәсіл Френе-Серре формулаларына сәйкес катетердің айналу жылдамдығына қарай спираль қадамы мен диаметрін өзгертуге мүмкіндік береді (2B-сурет). Ұшы rtip=4 мм болатын ине үшін қолжетімді параметрлер көрсетілген (2C-сурет). Компоненттер 316L тот баспайтын болаттан жасалған, бұл биологиялық үйлесімділікті қамтамасыз етеді. Иненің сыртқы диаметрі 14G (2 мм), ал катетердікі 20G (сыртқы диаметрі 0,91 мм, ішкі диаметрі 0,6 мм) өлшеміне ие.&lt;/p&gt;\n&lt;h4 id=\"spiral-oelshemderi-zhaene-ornalastyru\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#spiral-oelshemderi-zhaene-ornalastyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Спираль өлшемдері және орналастыру&lt;/span&gt;&lt;/a&gt;Спираль өлшемдері және орналастыру&lt;/h4&gt;\n&lt;p&gt;Адам путамені (шамамен 4x2x1 см) үшін траектория ұзындығы мен қамту көлемі арасындағы оңтайлы тепе-теңдік ретінде қадамы мен диаметрі шамамен 8 мм болатын спиральдар таңдалды (2D-сурет). Берілген айналу жылдамдығында жасалған спиральдардың өлшемдері өте жоғары дәлдікті көрсетті (2E-сурет). Теориялық есептеулерден шағын ауытқулар иненің серпімді деформациясы сияқты факторларға байланысты, олар бағдарламалық қамтамасыз етуде оңай ескеріледі (2C-сурет; SN 4B-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SpiraMed спиралін орналастыру дәлдігі нейрохирургиядағы стандартты талаптардан (1–1,5 мм) жоғары және параметрлер тұрақты күйінде қалады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Спиральдың тіндерге қатысты төзімділігін тексеру үшін ми және бұлшықет тіндеріне еліктейтін агароза гельдері (0,6–4,0% w/v) пайдаланылды (2F-сурет). 2,0%-ға дейінгі концентрацияларда айтарлықтай өзгерістер байқалмады. Тек ең қатты (4,0%) гельдерде спираль қадамы аздап азайды, бірақ диаметрі өзгерген жоқ (2G-сурет; SN 2-сурет). Қорытындылай келе, SpiraMed әдісі клиникалық дәлдік стандарттарына толық жауап беретін болжамды жеткізуді қамтамасыз етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу физикалық модельдер (агароза фантомдары) үстінде өткізілді, бұл тірі ми тіндерінің күрделілігін толық көрсетпейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"mi-miyasy-fantomdarynda-terapiyany-zhetkizu\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#mi-miyasy-fantomdarynda-terapiyany-zhetkizu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ми миясы фантомдарында терапияны жеткізу&lt;/span&gt;&lt;/a&gt;Ми миясы фантомдарында терапияны жеткізу&lt;/h4&gt;\n&lt;p&gt;Біз терапияның қамтылуын және рефлюксті бағалау үшін аллура қызыл және метилен көк бояуларын қолдана отырып, терапияны жеткізу тиімділігін талдадық. Катетерді шығарумен синхрондалған бояуды жеткізу 90 секунд ішінде 110 мм траектория бойынша 110 мкл көлемді рефлюкссіз жеткізуді көрсетті (3A-сурет). Агарозды нысандардың аралық кескіндері спиральды траектория бойымен диффузия арқылы мақсатты көлемді тез және біркелкі қамтуды сапалық тұрғыдан растады (3B-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SpiraMed 290,5 мкл рефлюкс шегін қамтамасыз етеді, бұл стандартты инелер үшін 64,0 мкл-ден айтарлықтай жоғары, бұл препараттардың үлкен көлемін енгізуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;SpiraMed-ті дәстүрлі стереотаксикалық ине әдісімен салыстырғанда, спиральды жеткізудің артықшылығы анықталды (4C-сурет). Үш тік ине өту жолы (әрқайсысы 100 мм) үшін рефлюкс шегі 64,0 мкл (95% CI 34,3–90,2 мкл) болды, ал бір SpiraMed жеткізуі үшін (3 мм қадам; 11 мм диаметр; 8 айналым) бұл көрсеткіш 290,5 мкл (95% CI 181,1–365,1 мкл) жетті (4B-сурет). Агарозды текшедегі бояудың таралуын бағалау SpiraMed үшін мақсатты көлемдегі орташа тығыздық 20351 болғанын, ал бес дүркін стандартты инъекцияда 17136 болғанын көрсетті (t=4,53, q=0,004). Сонымен қатар, «кіру қыртысына» рефлюкс SpiraMed үшін төменірек болды (10517-ге қарсы 15603, t=5,56, q=0,0029) (3D-сурет).&lt;/p&gt;\n&lt;h4 id=\"atmp-biouejlesimdiligi\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#atmp-biouejlesimdiligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ATMP биоүйлесімділігі&lt;/span&gt;&lt;/a&gt;ATMP биоүйлесімділігі&lt;/h4&gt;\n&lt;p&gt;316L болат биоүйлесімді болып саналғанымен, біз спиральды орналастырудың жасушалық терапияға (ATMP) әсерін тексердік. Біз орта мидың дофаминергиялық прогениторлық жасушаларын (vmDA) (8x10^6 жасуша/мл) қолдандық. SpiraMed катетері арқылы өткеннен кейін (5 айналым, 1 мм/с шығару жылдамдығы, 1 мкл/с жеткізу), ағынды цитометриямен өлшенген жасушалардың тіршілік қабілеті өзгермеді (4B, 4C-сурет). CAR-T жасушалары үшін де ұқсас нәтижелер алынды: жеткізуден 0 және 24 сағат өткен соң тіршілік қабілеті өзгермеді (4D, 4E-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ATMP (Advanced Therapy Medicinal Products) — бұл ген, тін немесе жасушаларға негізделген препараттар, олар енгізу кезінде өте ұқыпты қарауды талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"iri-zhanuarlar-men-kadaverlik-materialdardaghy-synakhtar\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#iri-zhanuarlar-men-kadaverlik-materialdardaghy-synakhtar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ірі жануарлар мен кадаверлік материалдардағы сынақтар&lt;/span&gt;&lt;/a&gt;Ірі жануарлар мен кадаверлік материалдардағы сынақтар&lt;/h4&gt;\n&lt;p&gt;Қойларда өткізілген тәжірибелерде контрастты зат мидың терең құрылымдарына енгізілді: SpiraMed бір жарты шарға және үш стандартты траектория қарама-қарсы жарты шарға (5A, 5B-сурет). SpiraMed көмегімен мақсатты аймақта сақталған контраст көлемі жоғарырақ болды (орташа 782,1 мкл-ге қарсы 196,8 мкл; p=0,0497) (5C-сурет). Дәстүрлі әдісте бір жағдайда микроқан кету байқалды, ал SpiraMed-пен асқынулар тіркелмеді (5D-сурет). Ақырында, Leksell G стереотаксикалық жақтауындағы адам басында SpiraMed-ті клиникалық процеске интеграциялау мүмкіндігі расталды: 1000 мкл контраст енгізілгеннен кейін, КТ спиральды көлемнің дәл қалыптасқанын көрсетті (сол жақта 700,8 мм³, оң жақта 994,4 мм³) (5E, 7D–F-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жануарлар мен кадаверлік модельдердегі зерттеу қауіпсіздікті көрсетеді, бірақ адамдарда клиникалық сынақтарды талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;h4 id=\"spiramed-zhuejesining-artykhshylykhtary-men-klinikalykh-aeleueti\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#spiramed-zhuejesining-artykhshylykhtary-men-klinikalykh-aeleueti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SpiraMed жүйесінің артықшылықтары мен клиникалық әлеуеті&lt;/span&gt;&lt;/a&gt;SpiraMed жүйесінің артықшылықтары мен клиникалық әлеуеті&lt;/h4&gt;\n&lt;p&gt;SpiraMed — ми тіндеріне терапевтік агенттерді жеткізудің инновациялық әдісі, ол қазіргі технологиялардың шектеулерін еңсеруге бағытталған. Радиальды тармақталған орналастыру (RBD) әдісінен айырмашылығы, SpiraMed терапияны «бір өтуде» (single-pass) жүзеге асырады. RBD катетерді қайта-қайта енгізуді және бағыттауды талап етіп, хирургиялық процесті күрделендіреді және рефлюкс қаупін арттырады. 1-кестеде көрсетілгендей, SpiraMed терапия көлемін, нысаналы аймақты қамтуды және хирургиялық қауіпсіздікті айтарлықтай жақсартады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SpiraMed ми тіндеріндегі жалпы траектория ұзындығын бес дәстүрлі стереотаксикалық тәсілмен салыстырғанда шамамен 50%-ға қысқартады, бұл тіндердің зақымдануы мен қан кету қаупін азайтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ATMP (Advanced Therapy Medicinal Products) — гендік терапияны, жасушалық технологияларды және тіндік инженерияны қамтитын озық медициналық өнімдер, оларды орталық жүйке жүйесіне дәл жеткізу талап етіледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Траектория ұзындығын есептеуде путаменнің жоғары қан тамырлылығы ескерілмегенін мойындаймыз, сондықтан клиникалық қолдану алдында қан тамырларының қауіпсіздігі бойынша қосымша зерттеулер қажет. SpiraMed көмегімен хирургиялық уақыттың қысқаруы және жұмыс процесінің жеңілдеуі ATMP терапиясын клиникалық тәжірибеге кеңінен енгізу үшін маңызды фактор болуы мүмкін.&lt;/p&gt;\n&lt;h4 id=\"integraciya-perspektivalary-zhaene-bolashakh-aezirlemeler\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#integraciya-perspektivalary-zhaene-bolashakh-aezirlemeler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интеграция перспективалары және болашақ әзірлемелер&lt;/span&gt;&lt;/a&gt;Интеграция перспективалары және болашақ әзірлемелер&lt;/h4&gt;\n&lt;p&gt;SpiraMed технологиясы жаңа клиникалық зерттеу парадигмаларын ашады. Мысалы, Паркинсон ауруымен ауыратын науқастарда &lt;a href=\"concepts/dbs.html\"&gt;DBS&lt;/a&gt; (миды терең стимуляциялау) және SpiraMed жасушалық терапиясын бір уақытта өткізу арқылы «жалған» (sham) операцияларға байланысты этикалық мәселелерді шешуге болады. Адаптивті DBS жүйелері арқылы жергілікті өріс потенциалдарын бақылау жасушалардың функционалды орнығуын бағалауға көмектеседі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ұсынылған аралас терапия мен DBS интеграциясы әзірге теориялық сипатқа ие және болашақта клиникалық сынақтар арқылы расталуы тиіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;SpiraMed конвекциялық күшейтілген жеткізу (CED) әдісімен бірге үлкен көлемдегі гендік терапия препараттарын енгізу үшін де қолданылуы мүмкін. Жүйені дамытудың келесі кезеңдері стереотаксикалық жоспарлау бағдарламаларын, төтенше жағдайларда катетерді шығару механизмдерін және интраоперациялық МРТ үшін титан қорытпаларын қолдануды қамтиды. Роботтандырылған платформалармен интеграция процесті одан да жылдам және дәл ету арқылы орталық жүйке жүйесі ауруларын емдеуде жаңа мүмкіндіктер туғызады.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system-f1.jpg\" alt=\"1-сурет. SpiraMed ми терапиясын жеткізу тұжырымдамасы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. SpiraMed ми терапиясын жеткізу тұжырымдамасы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет. SpiraMed ми терапиясын жеткізу тұжырымдамасы. A: Әрбір маңдай SpiraMed инесінің қол жеткізу траекториясы стриатумның ұзын осін қамтитын SpiraMed жеткізу катетерін ортогональды түрде орналастыруға мүмкіндік береді. B: Спиральды орналастыруды көрсететін SpiraMed 2-ші буын прототипінің компьютерлік жобалауы. C: Паркинсон ауруы, AADC тапшылығы немесе Хантингтон ауруы кезінде ATMP енгізу үшін қарастырылған екі жақты путаминалды жеткізу стратегиясы. Стандартты маңдай бұрғылау тесіктері арқылы алдыңғы стриатумға екі жақты SpiraMed инесінің қол жеткізуі путаменнің нысаналы көлемін (жасыл) қамтитын SpiraMed катетерін орналастырумен жалғасады. SpiraMed катетерінің спираль қадамы 8 мм, диаметрі 8 мм, 4,5 спираль орамымен модельденген. Траектория және нысаналы ядролар жеке аксиалды, коронарлы және сагитталды жазықтықтарда (жоғарғы панельдер) және сәйкес 3D көлемдік қабаттасулар ретінде (төменгі панельдер) визуализацияланған. D: Хирургиялық резекцияға жарамсыз деп танылған мультифокальды жоғары дәрежелі глиомаға химиотерапияны енгізу үшін қарастырылған жеткізу стратегиясының мысалы. Маңдай және төбе SpiraMed тәсілінің траекториялары сәйкесінше бастапқы моторлы және сенсорлы қыртыстың алдында және артында жоспарланған. Маңдай катетері үшін 6 спираль орамы және төбе катетері үшін 4,5 ораммен, 8 мм қадаммен және 8 мм диаметрмен SpiraMed катетері модельденген. Траекториялар және шамамен емдеу көлемдері жеке аксиалды, коронарлы және сагитталды жазықтықтарда (жоғарғы панельдер) және сәйкес 3D көлемдік қабаттасулар ретінде (төменгі панельдер) визуализацияланған.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system-f2.jpg\" alt=\"2-сурет. A: SpiraMed катетерінің спираль қадамы p және диаметрі d Френе-Серре моделіне сәйкес жеткізу инесінің ішкі жол \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет. A: SpiraMed катетерінің спираль қадамы p және диаметрі d Френе-Серре моделіне сәйкес жеткізу инесінің ішкі жол радиусы rtip, осьтік айналу жылдамдығы және катетердің деформация қасиеттерін көрсететін f тұрақтысының функциясы ретінде болжанады.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сурет. A: SpiraMed катетерінің спираль қадамы p және диаметрі d Френе-Серре моделіне сәйкес жеткізу инесінің ішкі жол радиусы rtip, осьтік айналу жылдамдығы және катетердің деформация қасиеттерін көрсететін f тұрақтысының функциясы ретінде болжанады. B: Сәйкес теңдеулер мен болжамды спиральдар rtip= 4 мм, f = 0,86 және катетердің айналу жылдамдығы = (i) 35°/мм (ii) 15°/мм (iii) 1°/мм үшін көрсетілген (сондай-ақ 4B-қосымша суретті қараңыз). C: Өлшенген және болжамды спираль өлшемдері rtip= 4 мм, f = 0,86 болатын жеткізу инесінің ұшы радиусы үшін катетердің айналу жылдамдығының функциясы ретінде көрсетілген (сондай-ақ 4C-қосымша суретті қараңыз). D: SpiraMed зертханалық сынағының мысалы: орналастыру және тарту (rtip=3 мм; айналу жылдамдығы = 5°/мм). E: Көрсетілген әрбір айналу жылдамдығында, бір SpiraMed инесінің ұшы rtip= 3 мм-ден 5 рет қатарынан SpiraMed катетерін орналастыру нәтижесінде спираль қадамдары (ортаңғы панель) және диаметрлері (оң жақ панель) көрсетілген. F: Агарозды ми фантомдарында SpiraMed зертханалық сынағы. G: Көрсетілген әрбір агароза концентрациясында үш қайталанатын SpiraMed жеткізу катетері бірдей SpiraMed инесінің ұшы rtip= 3 мм арқылы, катетердің айналу жылдамдығы = 5,73°/мм болғанда үш рет орналастырылды және тартылды. 2-факторлы дисперсиялық талдау (ANOVA) агароза концентрациясының спираль қадамына айтарлықтай әсерін (F = 12,74, df = 4, p&amp;lt;0,001), бірақ орналастыру санына әсерін (F = 2,05, df = 2, p = 0,1462) анықтайды. Жұптық Тьюки тесттері 4,0% агарозада басқа барлық жағдайлармен салыстырғанда қадамның айтарлықтай азайғанын анықтады (барлық жағдайда p&amp;lt;0,01), ал басқа салыстырулар маңыздылыққа жетпеді. Агароза концентрациясының немесе орналастыру санының спираль диаметріне айтарлықтай әсері анықталмаған.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system-f3.jpg\" alt=\"3-сурет. A: 0,6% (м/к) агарозды ми фантомының нысаналы көлемдеріне бояғышты рефлюксіз жеткізумен синхрондалған SpiraMed \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет. A: 0,6% (м/к) агарозды ми фантомының нысаналы көлемдеріне бояғышты рефлюксіз жеткізумен синхрондалған SpiraMed катетерін орналастыру және тарту мысалы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-сурет. A: 0,6% (м/к) агарозды ми фантомының нысаналы көлемдеріне бояғышты рефлюксіз жеткізумен синхрондалған SpiraMed катетерін орналастыру және тарту мысалы. B: Жеткізуден кейін бірнеше сағат бойы нысаналы көлем бойынша терапия диффузиясының 'Brain-in-a-box' визуализациясы. C: Бояғыштың сынақ көлемдері (100 мкл, 200 мкл, 300 мкл, 500 мкл, 700 мкл, 900 мкл) үш қайталаныммен жаңа агарозды блоктарға енгізілді, бұл ретте көлем 3 тікелей ине енгізу (сол жақ панель) немесе бір SpiraMed жеткізу (оң жақ панель) арасында бөлінді. Рефлюкс көлемі сорғыш қағазды алдында және кейін өлшеу арқылы өлшенді. Нөлдік рефлюкспен байланысты максималды жеткізу көлемінің ('рефлюкс шегі') бағалары алынған сызықтық регрессиялардың x-қиылысулары ретінде ұсынылған: 3 тікелей ине үшін 64 мкл (34-90 мкл), бір SpiraMed жеткізу үшін 290 мкл (181-365 мкл). F-тест x-қиылысуларындағы/рефлюкс шегіндегі айтарлықтай айырмашылықты растайды (F-тест F=101,0, DFn=1, Dfd=24, P&amp;lt;0,0001). D: Бір SpiraMed (сол жақта) және бес стереотаксикалық траектория (оң жақта) үшін нысаналы көлем ішіндегі (көк &lt;a href=\"concepts/roi.html\"&gt;ROI&lt;/a&gt;)/сыртындағы (қызыл ROI) кескіндер мен интеграцияланған бояғыш тығыздығының мысалы. Сулы ерітіндідегі барлығы 350 мкл метилен көгі енгізілді және әрбір жағдайда 4 қайталаным үшін қайталанды. Нысана ішіндегі (жұпталмаған t-тест t=0,004) және нысана сыртындағы (жұпталмаған t-тест t=0,001) бояғыш тығыздығындағы айтарлықтай айырмашылықтар айқын көрінеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system-f4.jpg\" alt=\"4-сурет. A: Дофаминергиялық ізашар жасушаларды алмастыруды жасау үшін қолданылатын дифференциация протоколы (сол жақта, \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет. A: Дофаминергиялық ізашар жасушаларды алмастыруды жасау үшін қолданылатын дифференциация протоколы (сол жақта, Kunath және т.б.45).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-сурет. A: Дофаминергиялық ізашар жасушаларды алмастыруды жасау үшін қолданылатын дифференциация протоколы (сол жақта, Kunath және т.б.45). Трансплантацияға жарамды ізашар популяциялары 16-күні иммунофлуоресценция арқылы OTX2, LMX1A, FOXA2 ортаңғы ми маркерлерін көрсетеді (жоғарғы оң жақ панель). In vitro одан әрі дифференциация 60-күнге қарай TH/MAP2 оң дофаминергиялық нейрондарды береді (төменгі оң жақ панель). Масштабтық сызықтар 20 мкм. B: 16-күндік культивацияланған дофаминергиялық ізашарларда (сол жақ панель) және диссоциациядан, SpiraMed жеткізу катетеріне аспирациядан, содан кейін катетерді орналастырудан және жасушаларды планшеттерге қайта жеткізуден кейін ортаңғы ми ізашар маркерлерін иммунофлуоресцентті бағалау. Масштабтық сызық 100 мкм. C: Культивацияланған mDA ізашарларында (сол жақта) және SpiraMed жүйесі арқылы аспирация мен жеткізуден кейін (ортасында) пропидиум иодидінің (PI) (өлі жасуша маркері) қосылуын ағындық цитометриялық бағалау мысалы. Тірі жасушалардың пайызы (пропидиум иодиді теріс) 3 биологиялық қайталанатын жасуша партиясы үшін көрсетілген (бір партия 16-күнге дейінгі тірі жасуша культурасы, екі партия криоконсервацияланған және жеткізуден 4 сағат бұрын қалпына келтірілген). Бақылау және SpiraMed арқылы жеткізілген фракциялар арасында өміршеңдікте айырмашылық жоқ (жұптық t-тест t=1,9; df=2; p=0,20). D: Адам донорларының бастапқы &lt;a href=\"concepts/pbmc.html\"&gt;PBMC&lt;/a&gt;-лерінен CAR-T жасушаларын жасау үшін қолданылатын протоколдың схемалық көрінісі (сол жақта) және тікелей (бақылау) немесе SpiraMed аспирациясынан/жеткізуден кейін GFP-белгіленген глиома дің жасушаларымен бірге культивацияланған CAR-T жасушаларының жарық өрісіндегі кескіндері. Масштабтық сызықтар 100 мкм. E: CAR-T жасушаларында 488 нм арналы өлі жасуша маркерінің қосылуын (сол жақта) және SpiraMed жүйесі арқылы аспирация мен жеткізуден кейін (ортасында) ағындық цитометриялық бағалау мысалы. Тірі жасушалардың пайызы (488 теріс) модификацияланбаған T-жасуша және CAR T-жасуша партиялары мен жұпталған аналогтары үшін, SpiraMed аспирациясынан/жеткізуден 0 сағат және 24 сағат өткен соң көрсетілген. Бақылау және SpiraMed арқылы жеткізілген фракциялар арасында өміршеңдікте айырмашылық жоқ (t=2,1, df=3, p=0,13).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system-f5.jpg\" alt=\"5-сурет. SpiraMed тірі жануарлар мен адам мәйіттерінде сынау.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет. SpiraMed тірі жануарлар мен адам мәйіттерінде сынау.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-сурет. SpiraMed тірі жануарлар мен адам мәйіттерінде сынау. A: Niopam CT контраст көлемдері 4 қойдың миына бір жарты шарға маңдай SpiraMed инесін орналастыру арқылы және қарама-қарсы жарты шарға спиральсыз 3 SpiraMed ине траекториясы арқылы жеткізілді (сол жақта). Катетерді орналастыруға және контрастты затты жеткізуге дайын, Kopf ірі жануарларға арналған стереотаксикалық рамасында орналастырылған SpiraMed 2-ші буын прототипі көрсетілген (оң жақта). B: Аксиалды МРТ спиральды жеткізу траекториясына сәйкес келетін нүктелі контрастты күшейтуді көрсетеді (сол жақта). Коронарлы КТ визуализациясы тірі қойда қол жеткізілген бұрғылау тесігі мен жеткізу траекториясын көрсетеді (оң жақта). C: 4 қойда SpiraMed және инемен нысаналанған жарты шарлар үшін қайта құрылған 3D контраст көлемдері (Уэлч түзетуімен жұпталмаған t-тест екі жақты p=0,0497, t=2,539, df=5,25). D: Жалпы патология бөлімдері 3 кәдімгі стереотаксикалық траекториядан (қызыл) кейінгі және бір SpiraMed жеткізуден (көк) кейінгі нысаналы көлемдерді бейнелейді. Микроқан кету де 3 өтумен байланысты беткей ақ затта ерекшеленген. E: Адам мәйіттерінде валидациялау үшін екі жақты путаминалды жеткізу стратегиясы (жоғарғы сол жақ панельдер). Компьютерлік томография реконструкциясы мәйіттің басына қолданылған Leksell G стереотаксикалық рамасын, маңдай бұрғылау тесігі арқылы орналастырылған SpiraMed-пен көрсетеді (жоғарғы оң жақ панельдер). Терең миға екі жақты спиральды траекторияларда контрастты жеткізу КТ реконструкцияларында айқын көрінеді, сондай-ақ бас сүйегінің негізінің сүйек анатомиясы да көрінеді (төменгі сол жақ панельдер) және көлемдік 3D реконструкциялар ретінде (төменгі оң жақ панельдер; сол жақ жарты шардың есептелген контраст көлемі 701 мм3, оң жақ жарты шар 994 мм3).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system-f5-2.jpg\" alt=\"Сурет 5 (жалғасы 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 5 (жалғасы 2)&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Миға көптеген&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тесік жасау&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қаупі&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;SpiraMed&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;спиральді&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;катетері&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Рефлюкссіз&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;біркелкі&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жеткізу&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Қауіпсіз және&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жылдам&lt;/text&gt;&l
