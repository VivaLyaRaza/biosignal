            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"125\" cy=\"106\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"695\" cy=\"192\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Нейрожелілер биологиялық&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;деректер базасындағы хаосты&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;реттей ала ма&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data-f1.jpg\" alt=\"1-сурет: Сурет толық BAO OWL файлын жүктеп алу және PowerPoint бағдарламасында тармақталған құрылымды жасау арқылы дайын\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Сурет толық &lt;a href=\"concepts/bioassay-ontology.html\"&gt;BAO&lt;/a&gt; OWL файлын жүктеп алу және PowerPoint бағдарламасында тармақталған құрылымды жасау арқылы дайындалды.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;PubChem сияқты ірі биологиялық деректер базалары миллиондаған тәжірибе жазбаларын қамтиды, бірақ олардың көпшілігінде құрылымдалған метадеректер жоқ. Стандартталған сипаттамалардың болмауы ғалымдарға әртүрлі зерттеу нәтижелерін салыстыруға және оларды нейрожелілерді оқыту үшін тиімді пайдалануға кедергі келтіреді. Авторлар жеті тілдік модельді сынақтан өткізіп, олардың тәжірибе хаттамаларын BAO онтологиясына сәйкес автоматты түрде жіктей алатынын тексерді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;PubChem жазбаларының 99,9%-дан астамында BAO метадеректері жоқ.&lt;/li&gt;\n&lt;li&gt;Тілдік модельдер талдау форматтарын жіктеуде 0,96-дан жоғары дәлдік көрсетеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/llm.html\"&gt;LLM&lt;/a&gt; қолданыстағы сараптамалық аннотациялардағы қателерді анықтауға қабілетті.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеушілер PubChem-дегі 2 миллионға жуық биоталдауды талдап, деректердің жетіспеушілігін анықтады: 36% жазбада талдау форматы, ал 89%-ында биоталдау түрі көрсетілмеген. Бұл мәселені шешу үшін олар жеті түрлі тілдік модельді (LLM) пайдаланып, BioAssay Ontology (BAO) белгілерін автоматты түрде тағайындауды сынақтан өткізді. Нәтижелердің дәлдігін тексеру үшін ChEMBL базасындағы деректер эталон ретінде пайдаланылды.&lt;/p&gt;\n&lt;p&gt;Нәтижелер модельдердің талдау форматы мен анықтау әдісін белгілеуде жоғары дәлдікке (&lt;a href=\"concepts/recall.html\"&gt;recall&lt;/a&gt; 0,96-дан жоғары) қол жеткізетінін көрсетті. Сапалық талдау барысында сарапшы-куратор жасанды интеллекттің қолданыстағы аннотациялардағы қателерді таба алатынын және кейде бастапқы деректерге қарағанда дәлірек жіктеу ұсынатынын растады. Ашық және жабық модельдер арасындағы тиімділік айырмашылығы аз болды, бұл автоматтандыруды кең ауқымды ғылыми міндеттер үшін қолжетімді етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бұл жұмыс препринт болып табылады және сирек кездесетін талдау түрлерінде модельдердің дәлдігі төмендейді, сондықтан адам бақылауы қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Молекулалардың қасиеттерін болжауға арналған базалық модельдерді дамыту деректердің жоғары дайындығын, соның ішінде метадеректерді аннотациялаудың сенімділігін талап етеді. Қазіргі уақытта ашық репозиторийлер де, өнеркәсіптік скринингтік деректер базалары да биологиялық талдаулар (bioassays) аннотацияларының жоқтығы, қайшылығы немесе шатасуы мәселесіне тап болуда. Бұл жұмыста авторлар BioAssay Ontology (BAO) негізінде талдау форматы мен физикалық анықтау әдісі өрістері үшін PubChem базасындағы аннотациялардың жетіспеушілік ауқымын бағалады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BioAssay Ontology (BAO) — биологиялық тәжірибелерді стандартталған түрде сипаттауға арналған жүйе, ол компьютерлерге талдау түрі мен шарттарын «түсінуге» мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Талдау шамамен 2 миллион биоталдауды қамтитын PubChem базасында деректердің тапшылығы өте жоғары екенін көрсетті: 36% жағдайда талдау форматы, 89% жағдайда биоталдау түрі жоқ, ал жазбалардың 99,9%-дан астамында BAO бойынша формат немесе анықтау технологиясы терминдері мүлдем көрсетілмеген. Бұл метадеректерді курациялау процесін автоматтандыру қажеттілігін көрсетеді.&lt;/p&gt;\n&lt;p&gt;Осы мәселені шешу үшін зерттеушілер жеті түрлі тілдік модельдің (LLM), соның ішінде ашық және меншікті модельдердің, талдау мәтіндері негізінде аннотацияларды болжау және тексеру қабілетін зерттеді. Бағалау PubChem және ChEMBL деректер жиынтығы арқылы жүргізілді және модельдердің болжамдары қолданыстағы «күміс» белгілермен (бұрын автоматты түрде белгіленген аннотациялар) салыстырылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модельдер биохимиялық және жасушалық талдау форматтарын анықтауда жоғары дәлдік (recall кемінде 0,96) көрсетті, анықтау технологиялары үшін де ұқсас нәтижелер тіркелді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модельдер мен бастапқы деректер арасындағы келіспеушіліктер сирек кездесетін сыныптар үшін артқанымен, қолмен тексеру көптеген сәйкессіздіктер модель қателерінен емес, бастапқы дереккөздердегі қайшылықтардан туындағанын көрсетті. Өнеркәсіптік сарапшы-куратордың қатысуымен өткен сапалық зерттеуде LLM келтірген дәлелдер маманға өз белгілерін қайта қарауға көмектескені анықталды, бұл модельдердің қате белгіленген деректерді анықтаудағы әлеуетін растайды. Меншікті және ашық модельдер арасындағы тиімділік айырмашылығы аз болып шықты. Нәтижелер LLM-дер талдау метадеректерін ауқымды аннотациялау және аудиттеуде көмектесе алатынын көрсетеді, алайда мұндай белгілерді машиналық оқыту конвейерлеріне енгізбес бұрын әр сынып үшін сенімділікті бағалау және адам тарапынан тексеру қажет.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу қолданыстағы деректер базаларымен салыстыруға негізделген; автоматтандырылған аннотациялар сарапшылық бақылауды талап етеді, өйткені модельдер оқу үлгілеріндегі қателерді мұрагерлік жолмен алуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"fair-khaghidattary-zhaene-bioanalitikalykh-derekterdegi-maeseleler\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#fair-khaghidattary-zhaene-bioanalitikalykh-derekterdegi-maeseleler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;FAIR қағидаттары және биоаналитикалық деректердегі мәселелер&lt;/span&gt;&lt;/a&gt;FAIR қағидаттары және биоаналитикалық деректердегі мәселелер&lt;/h4&gt;\n&lt;p&gt;FAIR қағидаттары (табылуы, қолжетімділігі, өзара үйлесімділігі, қайта пайдаланылуы) ғылыми деректерді ретке келтіруге бағытталған, алайда олардың жасанды интеллект (ЖИ) модельдері үшін дайындығы төмен күйінде қалуда. Негізгі мәселе ғылыми репозиторийлердегі толық емес, қайшылықты немесе қате метадеректер болып табылады. Биоаналитикалық (bioassay) жинақтар дәрі-дәрмек іздеудегі машиналық оқыту модельдері үшін іргелі дереккөз болып табылады, өйткені олар биологиялық жүйелердің заттарға реакциясын сипаттайды. PubChem базасында 100 миллионнан астам қосылыс пен 1 миллионнан астам талдау нәтижесі бар, бірақ көптеген жазбаларда эксперимент форматы немесе анықтау әдісі туралы құрылымдық метадеректер жоқ.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PubChem сияқты ірі деректер базаларында миллиондаған жазбалар құрылымдық метадеректерге ие емес, бұл оларды машиналық оқытуда тиімді пайдалануға кедергі келтіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Түсініксіздік мәселесін шешу үшін BioAssay Ontology (BAO) әзірленді. Ол талдау сипаттамасын ортогональды осьтерге: биологиялық формат, физикалық анықтау әдісі, өлшенетін көрсеткіш және нысанаға бөледі. Бұл ұқсас форматтағы, бірақ әртүрлі анықтау әдістерін қолданатын талдауларды ажыратуға мүмкіндік береді. Алайда, PubChem-дегі «In vivo/Toxicity» немесе «Cell-based/RNAi» сияқты белгілер форматты, модальділікті және соңғы нүктені бір жолға біріктіреді, мұны миллиондаған жазба үшін қолмен түзету мүмкін емес. Авторлар бұл процесті автоматтандыру үшін үлкен тілдік модельдерді (LLM) пайдалануды ұсынады. Жұмыста 4 ашық және 3 жабық модель BAO бойынша формат пен анықтау әдістерін жіктеу тұрғысынан бағаланады.&lt;/p&gt;\n&lt;h4 id=\"biotaldau-ontologiyasy-bioassay-ontology,-bao\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#biotaldau-ontologiyasy-bioassay-ontology,-bao\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Биоталдау онтологиясы (BioAssay Ontology, BAO)&lt;/span&gt;&lt;/a&gt;Биоталдау онтологиясы (BioAssay Ontology, BAO)&lt;/h4&gt;\n&lt;p&gt;BAO жоғары өнімді скрининг нәтижелерін еркін мәтіннен логикалық қатаң сипаттамаларға ауыстыру үшін жасалған. BAO моделі талдауларды биологиялық компонент, нысана, соңғы нүкте, формат және әдіс бойынша бөлуге бағытталған. Тұрақты жаңартуларға қарамастан — 2026 жылғы 6 мамырдағы v2.8.19 нұсқасы 7918 сыныпты қамтиды — барлық талдауларды қамту күрделі мәселе болып қалуда. Мысалы, 2014 жылы BAO ChEMBL-дегі барлық тасымалдаушы талдауларын жеткілікті түрде сипаттай алмады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Онтология — бұл ұғымдар мен олардың арасындағы байланыстарды айқындайтын, компьютерлерге деректер құрылымын «түсінуге» мүмкіндік беретін ресімделген білім жүйесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұрын BAO-ны қолдану қолмен белгілеуді талап еткен. Vempati және басқалар 944 PubChem талдауын 20 BAO терминімен байланыстырып, терминологиялық түсініксіздікті азайтуға болатынын көрсетті. Өнеркәсіп те бұл тәсілді қолданады: AstraZeneca компаниясы 381 ішкі (2005–2013 жж.) және 233 PubChem талдауын түсіндіру үшін BAO-ны қолданды. Алайда, қолмен белгілеу миллиондаған биоанализдер үшін ауқымды емес.&lt;/p&gt;\n&lt;h4 id=\"annotaciyalanghan-ashykh-derekter-repozitorijleri\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#annotaciyalanghan-ashykh-derekter-repozitorijleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Аннотацияланған ашық деректер репозиторийлері&lt;/span&gt;&lt;/a&gt;Аннотацияланған ашық деректер репозиторийлері&lt;/h4&gt;\n&lt;p&gt;Бұл жұмыста біз биоталдау аннотацияларының үш дереккөзін қолданамыз: PubChem, ChEMBL және BARD. PubChem — 2004 жылдан бері жинақталған жоғары өнімді скрининг пен медициналық химия деректерінің ең ірі жинағы. Жүктеп алу кезінде базада шамамен 1,9 миллион биоталдау (AID) бар. Алайда, метадеректердің сапасы біркелкі емес: олар көбінесе құрылымдалмаған мәтін түрінде болады. Бұл мәселені шешу үшін BARD жобасы NIH Molecular Libraries Program аясында PubChem жазбалары үшін BAO (BioAssay Ontology) аннотацияларының кураторлық жинағын жасады. Сарапшылар мәтіндік хаттамаларды BAO терминдерімен қолмен сәйкестендірді. BARD порталы жабылғанымен, 1000 талдау үшін 4477 аннотация PubChem-де қолжетімді. Олардың 997-сінде анықтау әдісі, 998-інде талдау форматы аннотацияланған.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BARD ең дәл, сарапшылар тексерген аннотацияларды ұсынады, ал PubChem мен ChEMBL ауқымдырақ, бірақ құрылымы аз немесе толық емес деректерді қамтиды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ChEMBL — бұл ғылыми әдебиеттер мен ерікті жарналар негізінде қолмен курацияланатын биоактивтілік базасы, ол шамамен 2,0 миллион талдауды қамтиды. Стандарттауға қарамастан, жазбалардың шамамен 10%-ында формат көрсетілмеген, ал анықтау әдістерінің белгілері жиі жоқ немесе сенімсіз алгоритмдермен жасалған. Біз дереккөздерді сенімділігі бойынша реттейміз: BARD — эталон ретінде, ChEMBL — екінші дереккөз, ал PubChem-нің жергілікті метадеректері — ең аз сенімді дереккөз ретінде. LIT-PCBA, MF-PCBA немесе CAPRICHO сияқты қолданыстағы тәсілдер деректерді тазартуға немесе қателерді белгілеуге тырысады, бірақ олар кілт сөздер мен бар өрістерді пайдаланумен шектелген, бұл LLM арқылы автоматтандырудың қажеттілігін көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"tildik-modelder-koemegimen-biotaldaulardy-kuraciyalau\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#tildik-modelder-koemegimen-biotaldaulardy-kuraciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тілдік модельдер көмегімен биоталдауларды курациялау&lt;/span&gt;&lt;/a&gt;Тілдік модельдер көмегімен биоталдауларды курациялау&lt;/h4&gt;\n&lt;p&gt;LLM биомедициналық жазбалардан метадеректерді алуда жоғары тиімділік көрсетуде. Мысалы, LLaMA негізіндегі модельдер ChIP-seq параметрлерін немесе жасушалық желілер мен генетикалық өзгерістер туралы деректерді сәтті бөліп алады және дәстүрлі сәйкестендіру әдістерінен басым түседі. Талдау форматтарын аннотациялау саласында аталған нысандарды анықтау (NER) және онтологиялармен байланыстыру (text2term) әдістері қолданылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM (Large Language Models) — мәтінді түсіну және жасау қабілеті бар нейрондық желілер, бұл контексте тәжірибелердің бейресми сипаттамаларын құрылымдау үшін қолданылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM-ді пайдалану стандартты емес белгілерді жасау қаупімен байланысты, сондықтан заманауи әдістер модель нәтижесін ресми онтологияларға байланыстыру кезеңдерін қамтиды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;RELATE сияқты қолданыстағы тәсілдер LLM жауаптарын онтология терминдеріне байланыстыру үшін «іздеу-содан соң-промпт» жүйелерін пайдаланады, бұл жарамсыз белгілердің пайда болу қаупін азайтады. Қазіргі уақытта мұндай стратегиялар еркін мәтін негізінде BAO белгілерін (формат, анықтау, нысана) сенімді және біркелкі тағайындай алатыны зерттелмеген және біздің жұмысымыз осы олқылықты толтыруға бағытталған.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"uelken-tildik-modelder-llm-negizindegi-audit-zhumys-procesi\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#uelken-tildik-modelder-llm-negizindegi-audit-zhumys-procesi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Үлкен тілдік модельдер (LLM) негізіндегі аудит жұмыс процесі&lt;/span&gt;&lt;/a&gt;Үлкен тілдік модельдер (LLM) негізіндегі аудит жұмыс процесі&lt;/h4&gt;\n&lt;p&gt;Алдыңғы бөлімде анықталған метадеректердің жетіспеушілігін, гетерогенділігін және қайшылықтарын ескере отырып, біз биоталдау метадеректерін белгілеуде LLM қолдану мүмкіндігін бағаладық. Модель болжамдары PubChem, ChEMBL және BARD базаларынан алынған қолданыстағы аннотациялармен (біз оларды «күміс» белгілер деп атаймыз) салыстырылды. Бұл дереккөздердің өзі толық емес немесе қате болуы мүмкін болғандықтан, ұсынылған классификация метрикаларын дәлдіктің түпкілікті көрсеткіші деп санауға болмайды. Осы шектеулерді бақылау үшін біз деректердің шағын бөлігін қолмен тексердік.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Коэн каппасы (Cohen’s κ) — екі бағалаушы арасындағы келісім дәрежесін өлшейтін статистикалық көрсеткіш; 1 толық сәйкестікті, 0 кездейсоқ сәйкестікті білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kuemis-derekkoezderge-khatysty-senimdilik\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#kuemis-derekkoezderge-khatysty-senimdilik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;«Күміс» дереккөздерге қатысты сенімділік&lt;/span&gt;&lt;/a&gt;«Күміс» дереккөздерге қатысты сенімділік&lt;/h4&gt;\n&lt;p&gt;Біз LLM-дердің өзара келісімін Коэн каппасы арқылы бағаладық. ChEMBL талдау форматы жиынтығында барлық жеті LLM жоғары келісімді (κ &amp;gt; 0,9) көрсетті, BAO тапсырмаларында да ұқсас нәтижелер алынды. PubChem-BAO шағын жиынтығында келісім төмендеді, бірақ әлі де жоғары (κ &amp;gt; 0,8), тек Gemma 3 27B моделі басқалардан төмен нәтиже көрсетті. Көпшілік дауыс беру әдісінде LLM-дер 96% жағдайда ChEMBL белгілерімен сәйкес келді. «Жасушалық» және «биохимиялық» форматтар тұрақты түрде жақсы классификацияланды (recall ≥ 96%). «Ағзаға негізделген» форматта көрсеткіштер әртүрлі болды: Gemma 3 27B ең жоғары дәлдікті (precision) көрсетті, бірақ ең аз болжам жасады. Бұл сынып үшін recall 87% және precision 77% құрады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM модельдері жоғары келісім (κ &amp;gt; 0,8–0,9) және 96%-ға дейінгі дәлдікті көрсетті, алайда сирек кездесетін деректер сыныптарында тиімділік төмендейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;«Жасушасыз» және «тіндік» форматтар үшін дәлдік пен толықтық айтарлықтай төмен болды (әр сыныпта ең көп дегенде бір дұрыс болжам). Алайда, қолмен тексеру 8 жағдайдың 7-уінде BARD белгісі ChEMBL-ден өзгеше екенін және LLM-дер BARD-пен сәйкес келгенін немесе сарапшы модельдің дұрыстығын растағанын көрсетті. Біз LLM-дердің ChEMBL-мен сәйкес келмеген 43 жағдайын талдадық (2-кесте). 17 жағдайда (59%) LLM консенсусы ChEMBL-ге қарағанда қатаң тексеруден өтетін BARD белгілерімен сәйкес келді. ChEMBL және BARD сәйкес келіп, модельдер сәйкес келмеген жағдайларда, LLM-дердің өзара келіспеушілігі толық емес еді, бұл модельдерді «құрылымдық пікірталасқа» шақыру арқылы жауаптарды нақтылау мүмкіндігін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Күміс» белгілерді эталон ретінде пайдалану олардың ықтимал қателігіне байланысты шектеулі; LLM болжамдары мен деректер базалары арасындағы корреляция модельдердің қатесіздігін дәлелдемейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sarapshylykh-baghalau\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#sarapshylykh-baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сарапшылық бағалау&lt;/span&gt;&lt;/a&gt;Сарапшылық бағалау&lt;/h4&gt;\n&lt;p&gt;Біз 17 талдау (AID) бойынша сарапшылар мен үлкен тілдік модельдер (LLM) консенсусы арасындағы қайшылықтарды зерттеу үшін қосымша талдау жүргіздік. Таңдамаға ChEMBL және PubChem BARD белгілері сәйкес келіп, LLM шешімі өзгеше болған жағдайлар; LLM BARD-пен сәйкес келіп, ChEMBL-мен сәйкес келмеген төрт жағдай; сондай-ақ LLM ешбір дереккөзбен сәйкес келмеген жағдайлар енгізілді. Сарапшыларға LLM үшін берілген барлық ақпарат: атауы, сипаттамасы, түсініктемесі және хаттамасы ұсынылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BAO (BioAssay Ontology) — бұл биологиялық талдауларды стандартталған жіктеу жүйесі, ол дәрілік заттарды зерттеу әдістерін реттеуге көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сарапшылар тапсырманың күрделілігін атап өтті. 6 жағдайда олар LLM қорытындысымен бірден келісті, тағы 6 жағдайда модельдердің дәлелдерін көргеннен кейін келісті. 4 қосымша жағдайда сарапшылар LLM жіктеуін негізді деп тапты (3 жағдайда дәлелдерді зерттегеннен кейін), бірақ нақты белгі бере алмады. Бұл кейбір талдаулар бірнеше санатқа сәйкес келуі немесе нақты жіктеу үшін жеткілікті ақпарат болмауы мүмкін екенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кейбір жағдайларда LLM сарапшыларға BAO анықтамаларына назар аудармау салдарынан туындаған қателерді түзетуге көмектесті, алайда модельдер де жасушалық желілерді тұтас организмдермен шатастырып, қателіктер жіберді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мысалы, AID 2695 үшін сарапшы бастапқыда талдауды «жасушалық» деп белгілеген, бірақ LLM дәлелдерін қарап шыққаннан кейін, BAO ережелеріне сәйкес бір жасушалы организмдер «организм» форматына жататынын мойындады. AID 588769 жағдайында модельдер PubChem белгілеуіндегі қатені анықтады. Алайда, AID 504631 үшін сарапшы ChEMBL белгісін дұрыс деп тапты, өйткені LLM дәлелдерді дұрыс ажыратқанымен, тірі организмді қате түрде жасушалық желі деп жіктеген. PubChem деректерімен салыстыру (3-кесте) LLM көбінесе тәуелсіз PubChem аннотацияларына қарағанда BARD-пен көбірек сәйкес келетінін көрсетті, бұл деректер базасында «шынайы» белгілеу бойынша бірыңғай стандарттың жоқтығын білдіреді.&lt;/p&gt;\n&lt;h4 id=\"talkhylau-zhaene-khorytyndy\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#talkhylau-zhaene-khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау және қорытынды&lt;/span&gt;&lt;/a&gt;Талқылау және қорытынды&lt;/h4&gt;\n&lt;p&gt;Біздің аудит PubChem-нің жаппай жүктелетін деректерінде метадеректердің толық еместігін көрсетті: жазбалардың шамамен 36%-ында талдау форматы көрсетілмеген және 0,1%-дан азында BAO (BioAssay Ontology) құрылымдық аннотациясы бар. Сондай-ақ, біз ресурстар арасындағы айтарлықтай келіспеушіліктерді байқадық: BARD және ChEMBL формат белгілері бар 236 талдаудың 10%-ында деректер сәйкес келмеген. Бұл олқылықтар метадеректер өрістерінің міндетті еместігімен және PubChem-нің «Assay Format» өрісінің BAO иерархиясына қарағанда шектеулі сөздік қорымен байланысты.&lt;/p&gt;\n&lt;p&gt;Бұл мәселені шешу үшін біз жеті LLM (меншікті және ашық бастапқы кодты) моделін бағаладық. Олар бір-бірімен жоғары деңгейде келісіп, талдау форматының кластарын 0,96-дан жоғары recall (толықтық) көрсеткішімен қалпына келтірді. LLM жауаптары «күміс» (silver) белгілермен сәйкес келмеген жағдайларды қолмен тексеру, қателіктердің көбінесе дереккөздер арасындағы қайшылықтарға немесе қате таңбалауға байланысты екенін көрсетті. LLM-дердің көпшілігі ChEMBL-мен келіспеген жағдайлардың үштен бірінен астамында олар шын мәнінде PubChem/BARD белгісімен сәйкес келген, ал біздің бас кураторымыз модель келтірген дәлелдерді көргеннен кейін өз шешімдерін қайта қараған.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM талдау форматтарын жіктеуде жоғары дәлдік (recall &amp;gt; 0,96) көрсетеді және қолмен курациялауға қарағанда әлдеқайда арзан әрі тиімді құрал бола алады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Күміс» белгілер — бұл автоматтандырылған әдістермен немесе қолданыстағы базалардан алынған, оқыту үшін сапалы деп саналатын, бірақ эталондық (алтын стандарт) болып табылмайтын деректер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Меншікті және ашық модельдер арасындағы айырмашылықтар аз болды, бұл ашық модельдерді ауқымды аннотациялау үшін қолайлы нұсқаға айналдырады. 1000 жазбаны аудиттеу құны $3–9 құрайды, бұл қолмен қайта тексеруден әлдеқайда арзан. Біз LLM-дердің аннотациялау процесінде маңызды рөл атқаратынын болжаймыз: олар қайшылықты жазбаларды белгілейді, мәтіндік дәлелдерді шығарады және күмәнді жағдайларды адам-кураторларға бағыттайды. Дегенмен, зерттеудің шектеулері бар: «күміс» белгілер тек ішінара сенімді, сондықтан есептелген recall қолданыстағы курациямен келісімді білдіреді, абсолютті ақиқатты емес. Сондай-ақ, бағалау BAO-ның бірінші деңгейінде жүргізілді және PUG JSON API шектеулері таңдама көлемін шектеді.&lt;/p&gt;\n&lt;p&gt;Сапалы валидация да бір ғана сарапшының пікірімен шектелген. Біз қателіктердің бір түрін анықтадық: AID 504631 үшін модельдер дұрыс дәлелдерді келтірген (Plasmodium falciparum бір жасушалы ағза екендігі), бірақ талдауды ағзаға негізделген емес, жасушаға негізделген деп қате жіктеген. Бұл адам тарапынан таңдамалы тексерудің қажеттілігін көрсетеді. Процесс BAO онтологиясындағы олқылықтарды да ашты: «биосенсор» үшін анықтаманың жоқтығы және «қарапайым өлшеу» мен «визуалды бақылау» әдістерінің анық еместігі. Болашақта біз BAO гранулярлығын тереңдетуді және LLM көмегімен «күміс» белгілердегі қайшылықтарды шешуді жоспарлап отырмыз.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 1.&lt;/strong&gt; ChEMBL базалық моделі үшін сынып бойынша recall/дәлдік (талдау форматы)&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Модель&lt;/th&gt;\n&lt;th&gt;Acc.&lt;/th&gt;\n&lt;th&gt;mF1&lt;/th&gt;\n&lt;th&gt;mF1top3&lt;/th&gt;\n&lt;th&gt;организмге негізделген (n=784)&lt;/th&gt;\n&lt;th&gt;тінге негізделген (n=252)&lt;/th&gt;\n&lt;th&gt;жасушасыз (n=53)&lt;/th&gt;\n&lt;th&gt;(n=6)&lt;/th&gt;\n&lt;th&gt;(n=2)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Claude Sonnet&lt;/td&gt;\n&lt;td&gt;4.6&lt;/td&gt;\n&lt;td&gt;0.963&lt;/td&gt;\n&lt;td&gt;0.560&lt;/td&gt;\n&lt;td&gt;0.934&lt;/td&gt;\n&lt;td&gt;0.98 / 0.99&lt;/td&gt;\n&lt;td&gt;0.96 / 0.98&lt;/td&gt;\n&lt;td&gt;0.88 / 0.83&lt;/td&gt;\n&lt;td&gt;0.00 / – 0.00 / 0.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Gemini 3.6 Flash&lt;/td&gt;\n&lt;td&gt;0.957&lt;/td&gt;\n&lt;td&gt;0.578&lt;/td&gt;\n&lt;td&gt;0.919&lt;/td&gt;\n&lt;td&gt;0.97 / 0.99&lt;/td&gt;\n&lt;td&gt;0.96 / 0.97&lt;/td&gt;\n&lt;td&gt;0.94 / 0.71&lt;/td&gt;\n&lt;td&gt;0.00 / –&lt;/td&gt;\n&lt;td&gt;0.50 / 0.08&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;GPT-4o&lt;/td&gt;\n&lt;td&gt;0.954&lt;/td&gt;\n&lt;td&gt;0.551&lt;/td&gt;\n&lt;td&gt;0.919&lt;/td&gt;\n&lt;td&gt;0.96 / 0.99&lt;/td&gt;\n&lt;td&gt;0.96 / 0.97&lt;/td&gt;\n&lt;td&gt;0.91 / 0.74&lt;/td&gt;\n&lt;td&gt;0.00 / –&lt;/td&gt;\n&lt;td&gt;0.00 / 0.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;GPT-OSS 20B&lt;/td&gt;\n&lt;td&gt;0.956&lt;/td&gt;\n&lt;td&gt;0.602&lt;/td&gt;\n&lt;td&gt;0.908&lt;/td&gt;\n&lt;td&gt;0.97 / 0.98&lt;/td&gt;\n&lt;td&gt;0.96 / 0.97&lt;/td&gt;\n&lt;td&gt;0.77 / 0.79&lt;/td&gt;\n&lt;td&gt;0.17 / 1.00&lt;/td&gt;\n&lt;td&gt;0.00 / 0.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Gemma 3 27B&lt;/td&gt;\n&lt;td&gt;0.979&lt;/td&gt;\n&lt;td&gt;0.576&lt;/td&gt;\n&lt;td&gt;0.960&lt;/td&gt;\n&lt;td&gt;0.99 / 0.98&lt;/td&gt;\n&lt;td&gt;0.99 / 0.97&lt;/td&gt;\n&lt;td&gt;0.85 / 0.98&lt;/td&gt;\n&lt;td&gt;0.00 / –&lt;/td&gt;\n&lt;td&gt;0.00 / 0.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Gemma 4 31B&lt;/td&gt;\n&lt;td&gt;0.951&lt;/td&gt;\n&lt;td&gt;0.545&lt;/td&gt;\n&lt;td&gt;0.909&lt;/td&gt;\n&lt;td&gt;0.96 / 0.99&lt;/td&gt;\n&lt;td&gt;0.96 / 0.97&lt;/td&gt;\n&lt;td&gt;0.91 / 0.70&lt;/td&gt;\n&lt;td&gt;0.00 / –&lt;/td&gt;\n&lt;td&gt;0.00 / 0.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Llama 3.3 70B&lt;/td&gt;\n&lt;td&gt;0.976&lt;/td&gt;\n&lt;td&gt;0.572&lt;/td&gt;\n&lt;td&gt;0.954&lt;/td&gt;\n&lt;td&gt;0.99 / 0.98&lt;/td&gt;\n&lt;td&gt;0.99 / 0.98&lt;/td&gt;\n&lt;td&gt;0.85 / 0.94&lt;/td&gt;\n&lt;td&gt;0.00 / –&lt;/td&gt;\n&lt;td&gt;0.00 / 0.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Majority vote&lt;/td&gt;\n&lt;td&gt;0.961&lt;/td&gt;\n&lt;td&gt;0.553&lt;/td&gt;\n&lt;td&gt;0.921&lt;/td&gt;\n&lt;td&gt;0.97 / 0.98&lt;/td&gt;\n&lt;td&gt;0.97 / 0.97&lt;/td&gt;\n&lt;td&gt;0.87 / 0.77&lt;/td&gt;\n&lt;td&gt;0.00 / –&lt;/td&gt;\n&lt;td&gt;0.00 / 0.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Мәндер R/P ретінде көрсетілген; қолдау (ntrue) тақырыптағы әр баған үшін бір рет көрсетілген. Ең аз қолдау көрсетілетін екі сынып (тіндерге негізделген және жасушасыз, n&amp;lt;10) сенімді жиынтық көрсеткіштер үшін тым кішкентай. Дұрыс емес болжамдар осы көрсеткіштерден алынып тасталды. Болжамдар болмаған кезде дәлдік «–» ретінде көрсетілген.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 12.&lt;/strong&gt; ChEMBL BAO талдау форматы белгісімен LLM-дердің көпшілігі келіспеген 43 талдауды қолмен тексеру&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;ID&lt;/th&gt;\n&lt;th&gt;ChEMBL&lt;/th&gt;\n&lt;th&gt;BARD (егер өзгеше)&lt;/th&gt;\n&lt;th&gt;Түсініктеме&lt;/th&gt;\n&lt;th&gt;ndis&lt;/th&gt;\n&lt;th&gt;nal&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;2096&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;organism-based&lt;/td&gt;\n&lt;td&gt;ChEMBL and BARD agree; LLMs disagree&lt;/td&gt;\n&lt;td&gt;4 3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2695&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;organism-based&lt;/td&gt;\n&lt;td&gt;ChEMBL and BARD agree; LLMs disagree&lt;/td&gt;\n&lt;td&gt;4 3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;492959&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;organism-based&lt;/td&gt;\n&lt;td&gt;ChEMBL and BARD agree; LLMs disagree&lt;/td&gt;\n&lt;td&gt;4 3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;651893&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;organism-based&lt;/td&gt;\n&lt;td&gt;ChEMBL and BARD agree; LLMs disagree&lt;/td&gt;\n&lt;td&gt;4 3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;504494&lt;/td&gt;\n&lt;td&gt;biochemical&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;cell-free&lt;/td&gt;\n&lt;td&gt;LLMs disagree with both ChEMBL and BARD&lt;/td&gt;\n&lt;td&gt;5 2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;463208&lt;/td&gt;\n&lt;td&gt;biochemical&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;cell-free (6 att.)&lt;/td&gt;\n&lt;td&gt;LLMs disagree with both ChEMBL and BARD&lt;/td&gt;\n&lt;td&gt;4 2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Барлық белгілер — BAO талдау форматтары; орынды үнемдеу үшін «format» жұрнағы түсіріп қалдырылған. ndis — ChEMBL-мен келіспейтін модельдер саны, nal — ChEMBL-мен келісетін модельдер саны; басқаша көрсетілмесе, әр жол үшін жеті модель пайдаланылды. Сұр түспен белгіленген жолдар аға өнеркәсіптік куратордың тексеруіне жіберілді (13-кесте).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 2.&lt;/strong&gt; LLM-дердің көпшілігі ChEMBL BAO талдау форматы белгісімен келіспеген 43 ChEMBL талдауын санаттау&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Келіспеушілік үлгісі&lt;/th&gt;\n&lt;th&gt;Саны&lt;/th&gt;\n&lt;th&gt;%&lt;/th&gt;\n&lt;th&gt;Тексеруге жіберілген&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;LLMs support the BARD label against ChEMBL&lt;/td&gt;\n&lt;td&gt;623968&lt;/td&gt;\n&lt;td&gt;spectrophotometry / fluorescence method / quantitative reverse transcription PCR (this is not a physical detection method but an assay supporting method)&lt;/td&gt;\n&lt;td&gt;– 3/3 (6 att.)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;ChEMBL and BARD agree and LLMs disagree with both&lt;/td&gt;\n&lt;td&gt;588778&lt;/td&gt;\n&lt;td&gt;fluorescence / spectrophotometry / (no other)&lt;/td&gt;\n&lt;td&gt;– 5/2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;ChEMBL and BARD disagree and LLMs disagree with both (novel prediction)&lt;/td&gt;\n&lt;td&gt;602418&lt;/td&gt;\n&lt;td&gt;luminescence / fluorescence / (no other)&lt;/td&gt;\n&lt;td&gt;– 3/0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;No BARD label available; ChEMBL-only ground truth&lt;/td&gt;\n&lt;td&gt;588816&lt;/td&gt;\n&lt;td&gt;fluorescence / simple measurement method / (no other)&lt;/td&gt;\n&lt;td&gt;– 3/1 (6 att.)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;602170&lt;/td&gt;\n&lt;td&gt;spectrophotometry / visual observation method / (no other)&lt;/td&gt;\n&lt;td&gt;– 3/1&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;624103&lt;/td&gt;\n&lt;td&gt;fluorescence / simple measurement method / (no other)&lt;/td&gt;\n&lt;td&gt;– 3/2 (6 att.)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Аға өнеркәсіптік куратордың тексеруіне жіберілген келіспеушілік үлгілерінің саны мен пайызы көрсетілген (13-кесте).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 15.&lt;/strong&gt; PubChem жаппай жүктеуіндегі үшінші тарап BAO белгісімен модельдердің көпшілігі келіспеген 34 физикалық анықтау әдісі талдауларын қолмен тексеру&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;AID&lt;/th&gt;\n&lt;th&gt;BAO белгісі (үшінші тарап)&lt;/th&gt;\n&lt;th&gt;Көпшілік болжамы&lt;/th&gt;\n&lt;th&gt;Биоталдау аннотациясы (PubChem)&lt;/th&gt;\n&lt;th&gt;Түсініктеме&lt;/th&gt;\n&lt;th&gt;nmaj./nal.&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;624135&lt;/td&gt;\n&lt;td&gt;fluorescence&lt;/td&gt;\n&lt;td&gt;simple measurement method&lt;/td&gt;\n&lt;td&gt;(no other)&lt;/td&gt;\n&lt;td&gt;–&lt;/td&gt;\n&lt;td&gt;3/2 (6 att.)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;624334&lt;/td&gt;\n&lt;td&gt;fluorescence&lt;/td&gt;\n&lt;td&gt;visual observation method&lt;/td&gt;\n&lt;td&gt;(no other)&lt;/td&gt;\n&lt;td&gt;–&lt;/td&gt;\n&lt;td&gt;2/0 (6 att.)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Барлық белгілер BAO физикалық анықтау әдістеріне жатады; орынды үнемдеу үшін «method» жұрнағы алынып тасталды. nmaj. — көпшілік болжамын қолдайтын модельдер саны; nal. — үшінші тарап BAO белгісімен сәйкес келетін болжамдар саны. Басқаша көрсетілмесе, әр жол үшін 7 модель сыналды. Сұр түспен белгіленген жолдарды аға өнеркәсіптік куратор қосымша тексерді.&lt;/em&gt;&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"derekter-zhinaghyn-khuru\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#derekter-zhinaghyn-khuru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деректер жинағын құру&lt;/span&gt;&lt;/a&gt;Деректер жинағын құру&lt;/h4&gt;\n&lt;p&gt;LLM модельдерінің биоталдау метадеректерінің сыныптарын болжау қабілетін бағалау үшін PubChem BioAssay деректері негізінде жинақ құрылды. Жалпы 1 994 310 AID жазбасынан 1 770 568-і іріктелді. Жетіспейтін өрістерді толтыру үшін PUG REST API қолданылды. Деректер ChEMBL 37 базасымен салыстырылды. Қорытынды жинаққа ChEMBL бойынша 1097 талдау, тек PubChem бойынша 226 талдау және физикалық анықтау әдістері бойынша 308 талдау енгізілді. Белгілер BAO иерархиясына сәйкес жіктелді (Сурет SN 1, 2). Бастапқы аннотацияларда қайшылықтар болғандықтан, олар «күміс белгілер» (silver labels) деп аталады және модель жауаптарымен келісімді тексеру үшін қолданылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Күміс белгілер» — бұл қолданыстағы дерекқорлардан алынған, сарапшылар толық тексермеген және қателіктері болуы мүмкін деректер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tapsyrma-anykhtamasy-zhaene-kholdanylghan-llm\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#tapsyrma-anykhtamasy-zhaene-kholdanylghan-llm\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тапсырма анықтамасы және қолданылған LLM&lt;/span&gt;&lt;/a&gt;Тапсырма анықтамасы және қолданылған LLM&lt;/h4&gt;\n&lt;p&gt;Модельдер талдау форматын немесе физикалық анықтау әдісін тақырып, сипаттама және хаттама негізінде болжауы керек. API арқылы GPT-4o, Gemini 3.6 Flash, Claude Sonnet 4.6 және Ollama v0.17.4 арқылы Gemma 4 31B, GPT-OSS 20B, Qwen 3.5, Llama 3.3 70B модельдері қолданылды. Промпттардың әсерін бағалау үшін 500 талдаудан тұратын стратификацияланған іріктеме алынды. Жергілікті модельдерде белгілер сөздігін шектеу үшін JSON-Schema параметрі қолданылды.&lt;/p&gt;\n&lt;h4 id=\"pubchem-bioassay-metaderekterindegi-olkhylykhtar-men-saejkessizdikter\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#pubchem-bioassay-metaderekterindegi-olkhylykhtar-men-saejkessizdikter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PubChem BioAssay метадеректеріндегі олқылықтар мен сәйкессіздіктер&lt;/span&gt;&lt;/a&gt;PubChem BioAssay метадеректеріндегі олқылықтар мен сәйкессіздіктер&lt;/h4&gt;\n&lt;p&gt;1 994 310 жазбаның тек 89%-ында атауы, сипаттамасы және түсініктемесі бар, ал 10%-дан азында ғана бірегей сипаттама бар. Метадеректердің төрт санатын (формат, BAO форматы, BAO анықтау технологиясы, BioAssay түрі) талдау жоғары гетерогенділікті көрсетті. «BioAssay түрі» өрісі формат, әдіснама және түпкілікті нүктелерді араластырғандықтан жіктеуге жарамсыз деп табылды (Кесте SN 9). PubChem сөздігінің шектеулілігі (тек 3 санат) BAO иерархиясымен салыстырғанда қателіктерге әкеледі. Ішкі сәйкессіздіктер анықталды: мысалы, AID 1885 веб-интерфейсте «жасушалық», ал жүктеп алынған файлда «жасушалық/организмдік» деп көрсетілген. 236 талдаудың 24-інде (10,2%) BARD және ChEMBL белгілері арасында қайшылық байқалды. Сонымен қатар, жазбалардың 36%-ында формат туралы деректер жоқ, ал 0,1%-дан азында ғана BAO аннотациялары бар.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data-f1.jpg\" alt=\"1-сурет: Сурет толық BAO OWL файлын жүктеп алу және PowerPoint бағдарламасында тармақталған құрылымды жасау арқылы дайын\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Сурет толық BAO OWL файлын жүктеп алу және PowerPoint бағдарламасында тармақталған құрылымды жасау арқылы дайындалды.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data-f2.jpg\" alt=\"2-сурет: Сурет толық BAO OWL файлын жүктеп алу және PowerPoint бағдарламасында тармақталған құрылымды жасау арқылы дайын\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: Сурет толық BAO OWL файлын жүктеп алу және PowerPoint бағдарламасында тармақталған құрылымды жасау арқылы дайындалды.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data-f3.jpg\" alt=\"Сурет 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data-f6.jpg\" alt=\"Сурет 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 6&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data-f6-2.jpg\" alt=\"Сурет 6 (жалғасы 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 6 (жалғасы 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data-f7.jpg\" alt=\"7-сурет: ChEMBL талдау форматтарының ішкі жиыны үшін меншікті LLM болжамдарына екі промпт пертурбациясының әсері.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-сурет: ChEMBL талдау форматтарының ішкі жиыны үшін меншікті LLM болжамдарына екі промпт пертурбациясының әсері.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;7-сурет: ChEMBL талдау форматтарының ішкі жиыны үшін меншікті LLM болжамдарына екі промпт пертурбациясының әсері. BAO анықтамаларын алып тастау (Without defs) сыныптар ретін өзгертуге (Order swap) қарағанда әлдеқайда көп болжамдарды өзгертеді, әсіресе Gemini 3.6 Flash үшін бұл айырмашылық айтарлықтай жоғары (10,8%). Баған сегменттері әрбір өзгерген болжамның басқа белгіден «күміс» белгіге (жасыл), «күміс» белгіден басқа белгіге (қызыл) немесе «күміс» белгіден өзгеше екі белгі арасында (қызғылт сары) ауысқанын көрсетеді; әр бағанның үстіндегі пайыздық көрсеткіштер өзгерген болжамдардың жалпы үлесін білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;деректер&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;базасында мета&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;деректердің&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жоқтығы&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жеті тілдік&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;модельді&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сынақтан&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;өткізу&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жіктеудің&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жоғары дәлдігі&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\
