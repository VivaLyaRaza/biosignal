lt;a href=\"concepts/conf-sfn_neuroscience.html\"&gt;SfN Neuroscience&lt;/a&gt; — крупнейший съезд нейробиологов (Society for Neuroscience)&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/conf-fens_forum.html\"&gt;FENS Forum&lt;/a&gt; — европейский форум нейронаук&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/conf-aacr_annual_meeting.html\"&gt;AACR Annual Meeting&lt;/a&gt; — главная конференция по биологии рака&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/conf-asco_annual_meeting.html\"&gt;ASCO Annual Meeting&lt;/a&gt; — ведущий съезд клинических онкологов&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/conf-ash_annual_meeting.html\"&gt;ASH Annual Meeting&lt;/a&gt; — Американское общество гематологии&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/conf-ashg_annual_meeting.html\"&gt;ASHG Annual Meeting&lt;/a&gt; — Американское общество генетики человека&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/conf-ismb.html\"&gt;ISMB&lt;/a&gt; — Intelligent Systems for Molecular Biology — главная конференция биоинформатики&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/conf-recomb.html\"&gt;RECOMB&lt;/a&gt; — вычислительная молекулярная биология&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/conf-neurips_ml_for_health_mlcb.html\"&gt;NeurIPS ML for Health / MLCB&lt;/a&gt; — секции машинного обучения в биологии и медицине&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/conf-cell_bio_ascb_embo.html\"&gt;Cell Bio (ASCB | EMBO)&lt;/a&gt; — совместная встреча клеточных биологов&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/conf-isscr_annual_meeting.html\"&gt;ISSCR Annual Meeting&lt;/a&gt; — стволовые клетки и регенеративная медицина&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/conf-escmid_global.html\"&gt;ESCMID Global&lt;/a&gt; — европейский конгресс клинической микробиологии и инфекций&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/conf-croi.html\"&gt;CROI&lt;/a&gt; — конференция по ретровирусам и оппортунистическим инфекциям&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/conf-ias_aids_conference.html\"&gt;IAS / AIDS Conference&lt;/a&gt; — Международное общество СПИДа&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/conf-esc_congress.html\"&gt;ESC Congress&lt;/a&gt; — Европейское общество кардиологов&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/conf-keystone_symposia.html\"&gt;Keystone Symposia&lt;/a&gt; — узкие симпозиумы по молекулярной биологии и иммунологии&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/conf-cold_spring_harbor_meetings.html\"&gt;Cold Spring Harbor Meetings&lt;/a&gt; — встречи лаборатории Колд-Спринг-Харбор (она же ведёт bioRxiv)&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/conf-synbiobeta_igem_grand_jamboree.html\"&gt;SynBioBeta / iGEM Grand Jamboree&lt;/a&gt; — синтетическая биология: индустрия и студенческие команды&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/conf-evolution_meeting.html\"&gt;Evolution Meeting&lt;/a&gt; — совместная встреча обществ эволюционной биологии&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/conf-esa_annual_meeting.html\"&gt;ESA Annual Meeting&lt;/a&gt; — Экологическое общество Америки&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"kaesip\"&gt;&lt;a href=\"concepts/index.html#kaesip\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кәсіп&lt;/span&gt;&lt;/a&gt;Кәсіп&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/prof-neuroscientist.html\"&gt;Нейробиолог&lt;/a&gt; — изучает, как нейроны и сети мозга создают поведение и память&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/prof-oncologist_researcher.html\"&gt;Онколог-исследователь&lt;/a&gt; — ищет, как опухоли растут и как их остановить&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/prof-epidemiologist.html\"&gt;Эпидемиолог&lt;/a&gt; — считает, кто и почему болеет, и проверяет меры защиты&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/prof-clinical_researcher.html\"&gt;Врач-исследователь&lt;/a&gt; — проводит клинические исследования и переносит открытия к пациентам&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/prof-immunologist.html\"&gt;Иммунолог&lt;/a&gt; — разбирается, как иммунитет узнаёт угрозы, и разрабатывает вакцины и терапии&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/prof-microbiologist.html\"&gt;Микробиолог&lt;/a&gt; — изучает бактерии, вирусы и микробиомы, ищет новые антибиотики&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/prof-geneticist.html\"&gt;Генетик&lt;/a&gt; — находит, какие варианты генов связаны с признаками и болезнями&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/prof-bioinformatician.html\"&gt;Биоинформатик&lt;/a&gt; — пишет программы и модели для геномов, белков и клинических данных&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/prof-cell_biologist.html\"&gt;Клеточный биолог&lt;/a&gt; — смотрит внутрь клетки и разбирается, как она живёт и делится&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/prof-structural_biologist.html\"&gt;Структурный биолог&lt;/a&gt; — определяет форму белков и молекул — основу для лекарств&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/prof-bioengineer.html\"&gt;Биоинженер&lt;/a&gt; — создаёт генетические схемы, ткани, устройства и биопроизводство&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/prof-ecologist.html\"&gt;Эколог-эволюционист&lt;/a&gt; — изучает виды, экосистемы и как жизнь меняется со временем&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Шығарылымдардағы мақалалардан алынған ұғымдар: әрқайсысына жеке мақала — бұл не, зерттеушілер ол туралы қалай жазады, немен байланысты және қай жерде кездеседі."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Ұғымдар","description":"Шығарылымдардағы мақалалардан алынған ұғымдар: әрқайсысына жеке мақала — бұл не, зерттеушілер ол туралы қалай жазады, немен байланысты және қай жерде кездеседі.","vcsPath":"concepts/index.md"},"headings":[{"title":"Мамандық","href":"concepts/index.html#mamandykh","level":2},{"title":"Процесс","href":"concepts/index.html#process","level":2},{"title":"Термин","href":"concepts/index.html#termin","level":2},{"title":"Әдіс","href":"concepts/index.html#aedis","level":2},{"title":"Зат","href":"concepts/index.html#zat","level":2},{"title":"Материал","href":"concepts/index.html#material","level":2},{"title":"Құрал","href":"concepts/index.html#khural","level":2},{"title":"Стандарт","href":"concepts/index.html#standart","level":2},{"title":"Организм / модель","href":"concepts/index.html#organizm-/-model","level":2},{"title":"Құбылыс","href":"concepts/index.html#khubylys","level":2},{"title":"Метрика","href":"concepts/index.html#metrika","level":2},{"title":"Конференция","href":"concepts/index.html#konferenciya","level":2},{"title":"Кәсіп","href":"concepts/index.html#kaesip","level":2}],"title":"Ұғымдар"},"router":{"pathname":"concepts/index","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
