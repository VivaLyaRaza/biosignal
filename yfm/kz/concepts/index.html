            {"data":{"leading":false,"html":"&lt;p&gt;Шығарылымдардағы мақалалардан алынған ұғымдар: әрқайсысына жеке мақала — бұл не, зерттеушілер ол туралы қалай жазады, немен байланысты және қай жерде кездеседі.&lt;/p&gt;\n&lt;p&gt;403 ұғым.&lt;/p&gt;\n&lt;h2 id=\"mamandykh\"&gt;&lt;a href=\"concepts/index.html#mamandykh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мамандық&lt;/span&gt;&lt;/a&gt;Мамандық&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-brain.html\"&gt;Ми және жүйке жүйесі&lt;/a&gt; — неврология; нейронаука; поведение и познание животных&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-mind.html\"&gt;Психика және мінез-құлық&lt;/a&gt; — медицина зависимостей; психиатрия и клиническая психология&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-cancer.html\"&gt;Қатерлі ісік және онкология&lt;/a&gt; — биология рака; гематология; клиническая онкология&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-health.html\"&gt;Инфекциялар және эпидемиология&lt;/a&gt; — вич и спид; гигиена труда и среды; инфекционные болезни; общественное и глобальное здоровье…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-medicine.html\"&gt;Медицина және денсаулық&lt;/a&gt; — акушерство и гинекология; гастроэнтерология; гериатрия; дерматология…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-immunity.html\"&gt;Микробтар және иммунитет&lt;/a&gt; — аллергология; иммунология; микробиология&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-genes.html\"&gt;Гендер мен геномдар&lt;/a&gt; — генетика; геномика; геномная медицина&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-compute.html\"&gt;Биологиядағы есептеу және ЖИ&lt;/a&gt; — биоинформатика; медицинская информатика; системная биология&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-cells.html\"&gt;Жасушалар мен молекулалар&lt;/a&gt; — биология развития; биофизика; биохимия; клеточная биология…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-biotech.html\"&gt;Биотехнологиялар&lt;/a&gt; — биоинженерия; синтетическая биология&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-nature.html\"&gt;Табиғат, эволюция және экология&lt;/a&gt; — биология растений; зоология; палеонтология; эволюционная биология…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"process\"&gt;&lt;a href=\"concepts/index.html#process\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Процесс&lt;/span&gt;&lt;/a&gt;Процесс&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-neurology.html\"&gt;Неврология&lt;/a&gt; — болезни нервной системы: инсульт, эпилепсия, нейродегенерация&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-neuroscience.html\"&gt;Нейронаука&lt;/a&gt; — как устроены нейроны, сети мозга и память&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-animal_behavior_and_cognition.html\"&gt;Поведение и познание животных&lt;/a&gt; — обучение, решения и общение у животных&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-addiction_medicine.html\"&gt;Медицина зависимостей&lt;/a&gt; — алкоголь, никотин, опиоиды: механизмы и помощь&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-psychiatry_and_clinical_psychology.html\"&gt;Психиатрия и клиническая психология&lt;/a&gt; — депрессия, тревога, шизофрения, аутизм и их лечение&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cancer_biology.html\"&gt;Биология рака&lt;/a&gt; — как клетка становится опухолью и как опухоль уходит от защиты&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-hematology.html\"&gt;Гематология&lt;/a&gt; — кровь и кроветворение, лейкозы и анемии&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-oncology.html\"&gt;Клиническая онкология&lt;/a&gt; — диагностика и лечение рака у пациентов&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-hiv_aids.html\"&gt;ВИЧ и СПИД&lt;/a&gt; — профилактика, терапия и поиск излечения&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-occupational_and_environmental_health.html\"&gt;Гигиена труда и среды&lt;/a&gt; — воздух, вода, химия и работа как факторы здоровья&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-infectious_diseases.html\"&gt;Инфекционные болезни&lt;/a&gt; — вирусы, бактерии и паразиты у людей: течение и лечение&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-public_and_global_health.html\"&gt;Общественное и глобальное здоровье&lt;/a&gt; — здоровье популяций, системы здравоохранения&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-nutrition.html\"&gt;Питание&lt;/a&gt; — еда, диеты и обмен веществ&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-sexual_and_reproductive_health.html\"&gt;Сексуальное и репродуктивное здоровье&lt;/a&gt; — фертильность, контрацепция, беременность&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-epidemiology.html\"&gt;Эпидемиология&lt;/a&gt; — кто и почему болеет: когорты, риски, распространение&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-obstetrics_and_gynecology.html\"&gt;Акушерство и гинекология&lt;/a&gt; — беременность, роды, женское здоровье&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-gastroenterology.html\"&gt;Гастроэнтерология&lt;/a&gt; — пищеварение, печень, кишечник&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-geriatric_medicine.html\"&gt;Гериатрия&lt;/a&gt; — старение и болезни пожилых&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-dermatology.html\"&gt;Дерматология&lt;/a&gt; — кожа&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-intensive_care_and_critical_care_medicine.html\"&gt;Интенсивная терапия&lt;/a&gt; — реанимация, сепсис, ИВЛ&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cardiovascular_medicine.html\"&gt;Кардиология&lt;/a&gt; — сердце и сосуды&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-clinical_trials.html\"&gt;Клинические испытания&lt;/a&gt; — проверка лечения на людях: дизайн и результаты&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-radiology_and_imaging.html\"&gt;Лучевая диагностика&lt;/a&gt; — КТ, МРТ, УЗИ и ИИ для снимков&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pain_medicine.html\"&gt;Медицина боли&lt;/a&gt; — механизмы и лечение боли&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-nephrology.html\"&gt;Нефрология&lt;/a&gt; — почки&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-ophthalmology.html\"&gt;Офтальмология&lt;/a&gt; — глаза и зрение&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pathology.html\"&gt;Патология&lt;/a&gt; — что меняется в тканях при болезни&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pediatrics.html\"&gt;Педиатрия&lt;/a&gt; — здоровье детей&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-respiratory_medicine.html\"&gt;Пульмонология&lt;/a&gt; — лёгкие и дыхание&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-rheumatology.html\"&gt;Ревматология&lt;/a&gt; — суставы и аутоиммунные болезни&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-toxicology.html\"&gt;Токсикология&lt;/a&gt; — вредные вещества и их действие&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-transplantation.html\"&gt;Трансплантология&lt;/a&gt; — пересадка органов и тканей&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-urology.html\"&gt;Урология&lt;/a&gt; — мочевая система&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pharmacology_and_toxicology.html\"&gt;Фармакология и токсикология&lt;/a&gt; — как действуют лекарства и яды&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pharmacology_and_therapeutics.html\"&gt;Фармакотерапия&lt;/a&gt; — лекарства в клинике&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-physiology.html\"&gt;Физиология&lt;/a&gt; — как работают органы и системы тела&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-surgery.html\"&gt;Хирургия&lt;/a&gt; — операции и их исходы&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-endocrinology.html\"&gt;Эндокринология&lt;/a&gt; — гормоны, диабет, щитовидная железа&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-allergy_and_immunology.html\"&gt;Аллергология&lt;/a&gt; — аллергии и иммунодефициты в клинике&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-immunology.html\"&gt;Иммунология&lt;/a&gt; — как иммунитет распознаёт и уничтожает угрозы&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-microbiology.html\"&gt;Микробиология&lt;/a&gt; — бактерии, вирусы, грибы и микробиомы&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-genetics.html\"&gt;Генетика&lt;/a&gt; — наследственность и мутации&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-genomics.html\"&gt;Геномика&lt;/a&gt; — геномы целиком: секвенирование, регуляция, вариации&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-genetic_and_genomic_medicine.html\"&gt;Геномная медицина&lt;/a&gt; — генетика в диагностике и лечении&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bioinformatics.html\"&gt;Биоинформатика&lt;/a&gt; — алгоритмы и программы для биологических данных&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-health_informatics.html\"&gt;Медицинская информатика&lt;/a&gt; — данные пациентов, ИИ в клинике&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-systems_biology.html\"&gt;Системная биология&lt;/a&gt; — клетка и организм как сеть взаимодействий&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-developmental_biology.html\"&gt;Биология развития&lt;/a&gt; — как из клетки вырастает организм&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-biophysics.html\"&gt;Биофизика&lt;/a&gt; — физика молекул и клеток, структуры белков&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-biochemistry.html\"&gt;Биохимия&lt;/a&gt; — ферменты и реакции живого&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cell_biology.html\"&gt;Клеточная биология&lt;/a&gt; — устройство и жизнь клетки&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-molecular_biology.html\"&gt;Молекулярная биология&lt;/a&gt; — ДНК, РНК и белки в работе&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bioengineering.html\"&gt;Биоинженерия&lt;/a&gt; — устройства, материалы и ткани из живого&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-synthetic_biology.html\"&gt;Синтетическая биология&lt;/a&gt; — проектирование генетических схем и организмов&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-plant_biology.html\"&gt;Биология растений&lt;/a&gt; — рост, защита и урожай растений&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-zoology.html\"&gt;Зоология&lt;/a&gt; — животные: строение и образ жизни&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-paleontology.html\"&gt;Палеонтология&lt;/a&gt; — древняя жизнь по окаменелостям и ДНК&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-evolutionary_biology.html\"&gt;Эволюционная биология&lt;/a&gt; — как возникают и меняются виды&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-ecology.html\"&gt;Экология&lt;/a&gt; — виды, сообщества и экосистемы&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"termin\"&gt;&lt;a href=\"concepts/index.html#termin\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Термин&lt;/span&gt;&lt;/a&gt;Термин&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/17-estradiol.html\"&gt;17β-эстрадиол&lt;/a&gt; — Ген экспрессиясын модуляциялау және мутациялар кезіндегі нейрондық гиперқозғыштық фенотиптерін түзету үшін қолданылатын жыныстық гормон.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/18s-rrna.html\"&gt;18S рРНК&lt;/a&gt; — B. mandrillaris амебасын LAMP әдісімен анықтау үшін маркер ретінде қолданылатын генетикалық нысана.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aav.html\"&gt;AAV&lt;/a&gt; — Жұмыста терапия мақсатында сау SIL1 генін орталық жүйке жүйесіне жеткізу үшін қолданылатын вирустық вектор.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vektor-aav-php-eb.html\"&gt;AAV-PHP.eB векторы&lt;/a&gt; — Терапиялық генетикалық материалды орталық жүйке жүйесінің тіндеріне тиімді жеткізетін жасанды түрде жасалған вирустық тасымалдаушы агент.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/akap11.html\"&gt;AKAP11&lt;/a&gt; — PKA протеинкиназасының якорьлік ақуызын кодтайтын ген, ол PKA-ны субстраттармен байланыстырып, жасушаішілік сигнал беруді үйлестіреді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/apfc.html\"&gt;aPFC&lt;/a&gt; — Жоспарлау, өзін-өзі тану және назарды басқару сияқты жоғары когнитивті функцияларға жауап беретін ми аймағы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/artr-seq.html\"&gt;ARTR-seq&lt;/a&gt; — Кері транскрипция процесінде биотинмен белгіленген нуклеотидтерді тікелей енгізу арқылы белгілі бір ақуызбен байланысқан РНҚ-ны карталау…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aso.html\"&gt;ASO&lt;/a&gt; — ASO (антисезімдік олигонуклеотидтер) — бұл РНҚ-мен байланысып, оның трансляциясын бөгейтін немесе сплайсинг процесін өзгерте алатын қысқа…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/area-under-the-curve.html\"&gt;AUC&lt;/a&gt; — Классификатор сапасын өлшейтін метрика, ол модельдің кездейсоқ оң нысанды кездейсоқ теріс нысанға қарағанда дұрыс ранжирлеу ықтималдығын…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/metod-basescope.html\"&gt;BaseScope әдісі&lt;/a&gt; — In situ гибридизацияның жоғары сезімтал түрі, ол қысқа зондтардың көмегімен жекелеген РНҚ молекулаларын, соның ішінде сақиналы РНҚ түрлерін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bindcraft.html\"&gt;BindCraft&lt;/a&gt; — Жинақталған есептеу шығындары мен өткен итерациялардың сәттілігіне байланысты қатаң бір мезгілде орындалу шектеулері бар жоғары ресурсты…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/blastn.html\"&gt;BLASTn&lt;/a&gt; — Нуклеотидтік тізбектерді деректер базасындағы басқа тізбектермен салыстыру үшін қолданылатын алгоритм.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/blood-oxygen-level-dependent.html\"&gt;BOLD-сигнал&lt;/a&gt; — Қандағы оттегі деңгейінің өзгеруіне негізделген ми белсенділігінің көрсеткіші. Қабылдау өрнектерінің ұқсастығы ми адам «көріп отырған»…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/brier-score.html\"&gt;Brier ұпайы&lt;/a&gt; — Ықтималдық болжамдарының дәлдігін бағалайтын метрика, мұнда нөлге жақын мәндер модельдің мінсіз калибрленгенін білдіреді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/combined-annotation-dependent-depletion.html\"&gt;CADD&lt;/a&gt; — Генетикалық нұсқалардың патогенділігін бағалайтын метрика; ≥20 мәні нұсқаның ең зиянды 1%-ға жататынын білдіреді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/causalforestdml.html\"&gt;CausalForestDML&lt;/a&gt; — Кездейсоқ ормандар мен себептік талдауды біріктіретін озық әдіс, ол қатер факторларының жасырын, сызықтық емес байланыстарын қатаң…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/circrna.html\"&gt;circRNA&lt;/a&gt; — Кері сплайсинг арқылы түзілетін сақиналы РНҚ молекулалары, мұнда интронның 3'-ұшы экзонның 5'-ұшымен бірігеді, бұл оларды деградацияға…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ciri2.html\"&gt;CIRI2&lt;/a&gt; — CircRNA-ларға тән «кері» сплайсинг орындарын анықтауға арналған биоинформатикалық құрал, ол экзондардың қалыптан тыс қосылуын…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/crispr-cas9.html\"&gt;CRISPR-Cas9&lt;/a&gt; — Тышқандардың геномына нақты мутацияларды енгізу үшін қолданылатын геномды редакциялау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/skrining-crispr-cas9.html\"&gt;CRISPR/Cas9 скринингі&lt;/a&gt; — Мыңдаған гендерді бір уақытта «сөндіру» арқылы қай гендердің жоғалуы қатерлі ісік клеткаларын емге сезімтал ететінін тексеруге мүмкіндік…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/crispr-ko.html\"&gt;CRISPR-KO&lt;/a&gt; — Аутизм және даму бұзылыстары қаупі бар 36 генді мақсатты түрде өшіру (нокаут) үшін қолданылатын геномды редакциялау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/skrining-crispr-s-kombinatsiyami-preparatov.html\"&gt;CRISPR комбинациялық скринингі&lt;/a&gt; — Ісіктің осал тұстарын табу үшін дәрілік терапиямен бірге көптеген гендерді бір уақытта белсенді емес ету әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/crispri.html\"&gt;CRISPRi&lt;/a&gt; — ДНҚ-ны кеспей ген экспрессиясын басу әдісі, жұмыста нейрондардың жасушалық моделінде TDP-43 ақуызының тапшылығын жасау үшін қолданылады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cytotrace2.html\"&gt;CytoTRACE2&lt;/a&gt; — Бір жасушалы деректердегі жасушалардың даму әлеуетін (дифференциация әлеуетін) бағалау үшін қолданылатын көрсеткіш.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/disease-associated-microglia.html\"&gt;DAM&lt;/a&gt; — Альцгеймер ауруы кезінде липидтерді тану және фагоцитоз үшін ген экспрессиясының өзгеруімен сипатталатын микроглияның ерекше күйі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dam-mgnd.html\"&gt;DAM/MGnD&lt;/a&gt; — Бляшкалар маңындағы микроглия гендері белсенділігінің арнайы профильдері, мұнда TREM2 рецепторы жасушаларды фагоцитозға ауыстыруда басты…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dapi.html\"&gt;DAPI&lt;/a&gt; — Жасуша ядросына еніп, ДНҚ-мен берік байланысатын флуоресцентті бояу, ол микроскоп астында жасуша ядроларын оңай анықтауға және санауға…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dcas13-dsrbd.html\"&gt;dCas13-dsRBD&lt;/a&gt; — Нысана РНҚ молекуласына берігірек бекіну үшін «мүжілмеген» dCas13 ферментіне dsRBD ақуыз домені қосылған өзгертілген CRISPR жүйесі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ddpcr.html\"&gt;ddPCR&lt;/a&gt; — Стандартты қисықтарды қолданмай ДНК немесе РНК молекулаларының абсолютті мөлшерін жоғары дәлдікпен анықтайтын әдіс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dpca.html\"&gt;dPCA&lt;/a&gt; — Тапсырма параметрлеріне байланысты нейрондық өрнектерді жалпы шуылдан бөліп көрсететін деректер өлшемділігін азайту әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dropout.html\"&gt;Dropout&lt;/a&gt; — Нейрондық желілерді оқыту кезінде шамадан тыс бейімделудің алдын алу үшін кездейсоқ нейрондарды өшіру әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/elastic-net.html\"&gt;Elastic Net&lt;/a&gt; — Маңызды белгілерді таңдайтын және олардың арасындағы өзара байланысты реттейтін LASSO мен Ridge әдістерінің гибридті қосындысы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/elisa.html\"&gt;ELISA&lt;/a&gt; — Антителалар көмегімен ақуыздарды сандық анықтау әдісі, ал екі факторлы ANOVA екі тәуелсіз айнымалының және олардың өзара әрекеттесуінің…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/escrt-iii.html\"&gt;ESCRT-III&lt;/a&gt; — Интралюминальды везикулалар мен экзосомалардың биогенезін басқаратын, патологиялық сигналдардың таралуында шешуші рөл атқаратын ақуыздар…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fluorescence-activated-nuclear-sorting.html\"&gt;FANS&lt;/a&gt; — Жасуша ядроларын олардың флуоресцентті белгілері негізінде сұрыптау әдісі, ол күрделі қоспадан қажетті ядро популяцияларын бөліп алуға…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fs.html\"&gt;Fehr-Schmidt (FS) моделі&lt;/a&gt; — Мінез-құлық экономикасында адамның әділетсіз бөліністен аулақ болу үшін жеке пайдасынан бас тартуға дайындығын сандық бағалайтын…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fish.html\"&gt;FISH&lt;/a&gt; — Арнайы таңбаланған зондтардың көмегімен жасуша ішіндегі нақты ДНҚ немесе РНҚ молекулаларының орналасқан жерін көруге мүмкіндік беретін әдіс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fnab.html\"&gt;FNAB&lt;/a&gt; — Цитологиялық талдау үшін жіңішке ине көмегімен тіндердің үлгісін алу процедурасы; Bethesda жүйесі осы нәтижелерді түсіндіруді стандарттайды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/funcat.html\"&gt;FUNCAT&lt;/a&gt; — Жасушаларда жаңадан синтезделген ақуыздарды in vivo визуализациялау және талдау үшін таңбалау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/glmm.html\"&gt;GLMM&lt;/a&gt; — Бүкіл топ үшін ортақ заңдылықтарды да, әрбір жеке пациенттің немесе электродтың жеке ерекшеліктерін де бір мезгілде ескеруге мүмкіндік…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gmr-gal4.html\"&gt;GMR-GAL4&lt;/a&gt; — Drosophila көзінде гендердің мақсатты экспрессиясы үшін қолданылатын генетикалық жүйе, ол нақты ақуыздардың тіндердің құрылымына әсерін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/biological-process.html\"&gt;GO BP&lt;/a&gt; — Гендердің олар қатысатын биологиялық процестер бойынша классификациясы, бұл жасушалардағы өзгерістердің функционалдық бағытын түсінуге…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gsea.html\"&gt;GSEA&lt;/a&gt; — GSEA — зерттеу деректерінде белгілі бір биологиялық жолдардың немесе гендердің функционалдық топтарының байытылғанын анықтауға мүмкіндік…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gst-pulldown.html\"&gt;GST-pulldown&lt;/a&gt; — Ерітіндідегі ақуыздарды және олардың өзара әрекеттесу серіктерін бөліп алу үшін глутатион-трансферазаны пайдаланатын аффинді тұндыру әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gwas.html\"&gt;GWAS&lt;/a&gt; — Генетикалық нұсқалар мен нақты аурулар немесе белгілер арасындағы байланысты анықтауға арналған статистикалық талдау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/grnk.html\"&gt;gРНҚ&lt;/a&gt; — CRISPR кешенін геномның немесе транскрипттің қажетті бөлігіне бағыттайтын РНҚ молекуласы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/histone-deacetylase-6.html\"&gt;HDAC6&lt;/a&gt; — Бос убиквитинді байланыстыру үшін табиғи мотив болып табылатын ZnF-домені бар гистондеацетилаза 6.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hnp1tg.html\"&gt;HNP1TG&lt;/a&gt; — Жоғары майлы диета кезінде MASLD патогенезін зерттеу үшін қолданылатын, адамның HNP1-ін экспрессиялайтын модельді жануарлар.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/icv-inektsiya.html\"&gt;ICV-инъекция&lt;/a&gt; — Заттарды тікелей ми қарыншаларына енгізу әдісі, ол гематоэнцефалдық тосқауылды айналып өтуге мүмкіндік береді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/igluts.html\"&gt;iGLUTs&lt;/a&gt; — Пациенттің діңгекті жасушаларынан алынған және глутамат арқылы қоздырушы сигналдарды беруге маманданған нейрондар. Нокаут — ген функциясын…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/virtualnyy-nokaut.html\"&gt;In silico нокаут&lt;/a&gt; — Ген функциясын компьютерлік модельдеу арқылы өшіру әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gibridizatsiya-in-situ.html\"&gt;In situ гибридизациясы&lt;/a&gt; — Тіндердегі РНҚ тізбектерін тікелей анықтау әдісі, ол ген экспрессиясының кеңістіктік таралуын көруге мүмкіндік береді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/infernal.html\"&gt;INFERNAL&lt;/a&gt; — Құрылымдық РНҚ-ларды іздеуге арналған биоинформатикалық әдіс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/itr.html\"&gt;ITR&lt;/a&gt; — Т-тәрізді ілмектерге оралуға қабілетті 145 нуклеотидтен тұратын ДНҚ бөліктері; вирус геномын қаптау үшін қажет.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/k-d.html\"&gt;K_d&lt;/a&gt; — Байланысу күшінің көрсеткіші: сан неғұрлым кіші болса, байланыс соғұрлым берік болады. RFdiffusion — белгіленген құрылымы бар ақуыздарды…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/lamp.html\"&gt;LAMP&lt;/a&gt; — Күрделі жабдықтарсыз диагностика жүргізуге мүмкіндік беретін изотермиялық жағдайда өтетін нуклеин қышқылдарын репликациялау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/leiden-algorithm.html\"&gt;Leiden алгоритмі&lt;/a&gt; — Графтарды тығыз қауымдастықтарға бөлу үшін қолданылатын математикалық әдіс, ол жасушалардың өзара байланысын қамтамасыз етеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/llm.html\"&gt;LLM&lt;/a&gt; — LLM (үлкен тілдік модельдер) — бұл үлкен көлемдегі деректерді талдауға және ықтималдықтарды болжауға қабілетті терең оқыту алгоритмдері.…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/loss-of-function.html\"&gt;LOF&lt;/a&gt; — Ақуыздың өзінің қалыпты биологиялық қызметін атқара алмауы, бұл жасушалық процестердің бұзылуына алып келеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/lowess.html\"&gt;LOWESS&lt;/a&gt; — Қисық пішініне қатысты қатаң алдын ала математикалық болжамдарсыз сызықтық емес трендтерді табу үшін деректерді тегістеу әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/lubac.html\"&gt;LUBAC&lt;/a&gt; — Басқа ақуыздарды (мысалы, NEMO) сызықтық убиквитин тізбектерімен «белгілеп», қабыну каскадын іске қосатын ақуыз кешені.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mapping-quality.html\"&gt;MAPQ&lt;/a&gt; — Оқылымның геномның дұрыс жеріне карталанғанына деген сенімділік көрсеткіші; ≥ 20 мәні қателік ықтималдығы 1%-дан аз екенін білдіреді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mash.html\"&gt;MASH&lt;/a&gt; — Липидтердің жиналуы аясында дамитын және гепатоциттердің зақымдануымен сипатталатын бауыр ауруының қабыну сатысы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mice.html\"&gt;MICE&lt;/a&gt; — Әрбір айнымалыны басқалары негізінде дәйекті түрде модельдеу арқылы бос орындарды толтыратын итеративті әдіс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/klassifikator-mininet.html\"&gt;MiniNet классификаторы&lt;/a&gt; — Флуоресцентті белгісі бойынша ісік ошақтарын автоматты түрде іздеуге және сегменттеуге арналған конволюциялық нейрондық желіге негізделген…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/memory-selective.html\"&gt;MS жасушалары&lt;/a&gt; — Тітіркендіргіштің жаңа немесе таныстығына қарай белсенділігі өзгеретін нейрондар, олар жад ізінің күшін кодтауға мүмкіндік береді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/faza-n2-sna.html\"&gt;N2 ұйқы сатысы&lt;/a&gt; — Дельта-белсенділіктің тұрақсыздығымен және CAP микрооянуларымен ерекшеленетін, эпилепсиялық разрядтардың пайда болуын жеңілдететін жеңіл…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/nonsense-mediated-mrna-decay.html\"&gt;NMD&lt;/a&gt; — NMD (nonsense-mediated mRNA decay) — бұл жасушаның сапаны бақылау механизмі, ол мерзімінен бұрын тоқтату кодондары бар ақаулы мРНҚ…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/noddi.html\"&gt;NODDI&lt;/a&gt; — Диффузия сигналындағы нейриттер тығыздығы мен олардың бағдарлану тәртібін бөліп көрсететін модель, ол тіндердің микроқұрылымын стандартты…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/metod-otsu-threshold.html\"&gt;Otsu шегі&lt;/a&gt; — Кескінді екі бөлікке (фон және нысан) бөлу үшін оңтайлы шекті автоматты түрде анықтайтын статистикалық әдіс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pbmc.html\"&gt;PBMC&lt;/a&gt; — Лимфоциттер мен моноциттерден тұратын қан фракциясы, ол иммунологиялық зерттеулерде терапияға жауапты бағалау үшін жиі қолданылады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vektor-pbr322.html\"&gt;pBR322 векторы&lt;/a&gt; — Молекулалық клондауда қолданылатын классикалық плазмида, оның құрамында антибиотиктерге төзімділік гендері бар, бұл плазмидалық ДНҚ-ны…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pca.html\"&gt;PCA&lt;/a&gt; — Деректер көлемін азайту және үлгілер топтары арасындағы ұқсастықты визуализациялау үшін статистикалық әдіс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/perk-terk.html\"&gt;pERK/tERK&lt;/a&gt; — Нейрондар белсенділігін визуализациялау әдісі, мұнда фосфорланған ERK (pERK) кальций ағынының маркері ретінде жасушаның қозуын көрсетеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/datchik-pka.html\"&gt;PKA сенсоры&lt;/a&gt; — Тірі жасушалар ішінде ферменттің белсенділік деңгейін нақты уақыт режимінде бақылауға мүмкіндік беретін флуоресцентті белгісі бар…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/platform-mediated-avoidance.html\"&gt;PMA тесті&lt;/a&gt; — Кеміргіштер токтың соғуынан бұрын болатын дыбыстық сигналдан арнайы платформаға қашып құтылуды үйренетін мінез-құлық әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ppv.html\"&gt;PPV&lt;/a&gt; — Тест нәтижесі оң болған науқаста аурудың (қалқанша безі обыры) болу ықтималдығы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/protein-truncating-variant.html\"&gt;PTV&lt;/a&gt; — Ақуыз синтезінің мерзімінен бұрын аяқталуына және оның қысқаруына әкелетін генетикалық мутациялар.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/q-learning.html\"&gt;Q-learning&lt;/a&gt; — Q-learning — бұл агент күтілетін жалпы сыйақыны барынша арттыру үшін әрекеттерді таңдауды үйренетін нығайту арқылы оқыту әдісі. Бұл…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/q-obuchenie.html\"&gt;Q-оқыту&lt;/a&gt; — Агент әлеуметтік нормаларға емес, болжау қателеріне (RPE) негізделіп, болашақ сыйақыны барынша арттыратын әрекеттерді таңдауды үйренетін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/raav.html\"&gt;rAAV&lt;/a&gt; — Гендік терапияда генетикалық материалды жасушаларға жеткізу үшін қолданылатын вирустық векторлар.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rbp.html\"&gt;RBP&lt;/a&gt; — МННҚ молекулаларына қосылып, олардың жасушадағы синтезінен бастап ыдырауына дейінгі тағдырын басқаратын молекулалық реттеушілер.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rna-seq.html\"&gt;RNA-seq&lt;/a&gt; — Жасушадағы барлық гендердің белсенділігін бір уақытта бағалауға мүмкіндік беретін әдіс, ал GO-талдау бұл гендерді биологиялық функцияларына…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rnai.html\"&gt;RNAi&lt;/a&gt; — Ген функциясын зерттеу үшін нақты бір ген экспрессиясын «өшіру» немесе төмендету әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rnascope.html\"&gt;RNAscope&lt;/a&gt; — РНҚ экспрессиясын жеке молекулалар деңгейінде визуализациялауға арналған жоғары сезімтал in situ гибридтеу әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/roc-krivaya.html\"&gt;ROC-талдауы&lt;/a&gt; — Тану дәлдігі мен субъектінің жауаптарына деген сенімділігі арасындағы байланысты сандық бағалауға арналған статистикалық құрал.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/roi.html\"&gt;ROI&lt;/a&gt; — Талданатын кескіннің бөлінген бөлігі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/representational-similarity-analysis.html\"&gt;RSA&lt;/a&gt; — Ми белсенділігінің өрнектері мен визуалды көріністердің есептеу модельдері арасындағы корреляцияны анықтау үшін қолданылатын статистикалық…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/senescence-associated-secretory-phenotype.html\"&gt;SASP&lt;/a&gt; — Қартайған жасушалар бөлетін цитокиндер, хемокиндер және протеазалар кешені, олар қабыну мен тіндердің зақымдалуына әкеледі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scpoli.html\"&gt;scPoli&lt;/a&gt; — Анықтамалық атластан жаңа эксперименталды деректерге жасуша түрлерінің аннотацияларын тасымалдау үшін нейрондық желілерге негізделген…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scrna-seq.html\"&gt;scRNA-seq&lt;/a&gt; — scRNA-seq (жеке жасушалардың РНҚ секвенирлеуі) — әрбір жеке жасушаның ген экспрессиясының профилін зерттеуге мүмкіндік беретін әдіс, бұл…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scrnaseq.html\"&gt;scRNAseq&lt;/a&gt; — Мыңдаған гендердің экспрессиясын әрбір жеке жасушада зерттеуге, жасырын кіші типтерді және олардың популяциядағы үлесін анықтауға мүмкіндік…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sequence-hallucination.html\"&gt;Sequence hallucination&lt;/a&gt; — Ақуыз тізбектерін белгілі бір құрылымға сәйкестендіру арқылы жасау әдісі, мұнда алгоритм жаңа аминқышқыл тізбектерін «қияли» түрде жасайды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/snrna-seq.html\"&gt;snRNA-seq&lt;/a&gt; — snRNA-seq (жеке ядролардың РНҚ секвенирлеуі) — бұл мұздатылған ми тінінен ядроларды бөліп алу арқылы әрбір жасушаның транскриптомын…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/soz.html\"&gt;SOZ&lt;/a&gt; — Мида эпилепсия ұстамалары пайда болатын ошақ, ал гиппокамп пен амигдала есте сақтау мен эмоцияларды өңдеуде маңызды рөл атқарады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spri-selektsiya.html\"&gt;SPRI-селекция&lt;/a&gt; — Қажетті өлшемдегі фрагменттерді іріктеп алуға мүмкіндік беретін магнитті бөлшектер арқылы ДНҚ-ны тазарту әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sparse-reconstruction-error-alleviation.html\"&gt;SREA&lt;/a&gt; — Мемристорлық чиптерде есептеулерді орындау кезінде қателерді өтеуге және азайтуға арналған арнайы архитектура.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stat3.html\"&gt;STAT3&lt;/a&gt; — Миокардтың зақымдануына жауап ретінде тромбопоэтин синтезін реттейтін бауырдың сигналдық жолына қатысатын ақуыз.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/str-profilirovanie.html\"&gt;STR-профильдеу&lt;/a&gt; — Жасушалардың генетикалық төлпатын анықтау және олардың басқа сызықтармен ластанбағанын растау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/structural-units.html\"&gt;SU&lt;/a&gt; — Генерация процесінің сәттілігін бағалау үшін қолданылатын құрылымдық модельдердің сапасы немесе жаңалығының метрикасы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/small-volume-computational-clearing.html\"&gt;SVCC&lt;/a&gt; — Кескінді өңдеу алгоритмі, ол фокустан тыс фондық жарықты (тұмандықты) жойып, тіндердің терең қабаттарын анық суретке түсіруге мүмкіндік…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thm.html\"&gt;THM&lt;/a&gt; — Қалқанша безі гормондарының метаболикалық жолдарында түзілетін заттар, олардың қандағы деңгейі обырды диагностикалау үшін қолданылады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tmt-mass-spektrometriya.html\"&gt;TMT-масс-спектрометрия&lt;/a&gt; — Үлгілерді арнайы химиялық белгілермен таңбалау арқылы мыңдаған ақуыздардың концентрациясын дәл салыстыруға мүмкіндік беретін әдіс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/umi.html\"&gt;UMI&lt;/a&gt; — РНҚ немесе ДНҚ молекулаларын амплификацияға дейін таңбалау үшін қолданылатын қысқа нуклеотидтер тізбегі, ол нақты биологиялық көшірмелерді…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/unc13a.html\"&gt;UNC13A&lt;/a&gt; — БАС дамуына қатысатын ген, одан терапия тиімділігінің биомаркері ретінде пайдаланылатын ерекше сақиналы РНҚ түзіледі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vbit-12.html\"&gt;VBIT-12&lt;/a&gt; — VDAC1 олигомеризациясын блоктайтын арнайы ингибитор, ол митохондриялық дисфункцияның алдын алу үшін қолданылады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vdac1.html\"&gt;VDAC1&lt;/a&gt; — Митохондрияның сыртқы мембранасының ақуызы, оның HNP әсерінен мультимеризациясы митохондриялық дисфункцияға және липидтердің жиналуына…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vlmc.html\"&gt;VLMC&lt;/a&gt; — Қан тамырлары мен жұмсақ ми қабығының жасушалары, олар қан-ми тосқауылын сақтау және мидың лимфа дренажында маңызды рөл атқарады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vviq.html\"&gt;VVIQ&lt;/a&gt; — Субъектінің өз сезімін бағалау шкаласы, мұнда төмен ұпайлар ментальді суреттерді жасай алмауды (афантазия), ал жоғары ұпайлар қалыпты…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/watershed.html\"&gt;Watershed&lt;/a&gt; — Кескінді сегменттеу алгоритмі, ол пиксель жарықтығын топографиялық бедер ретінде қарастырып, бір-біріне тиіп тұрған объектілерді бөледі…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/wgcna.html\"&gt;WGCNA&lt;/a&gt; — WGCNA — бұл бірлесіп жұмыс істейтін гендер топтарын (модульдерін) табуға арналған статистикалық әдіс. Ол негізгі биологиялық процестерді…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/z-test.html\"&gt;Z-тест&lt;/a&gt; — Екі топтың орташа мәндері арасындағы статистикалық маңызды айырмашылықты анықтауға көмектесетін статистикалық талдау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zenith.html\"&gt;Zenith&lt;/a&gt; — Жолдар деңгейінде гендердің дифференциалды экспрессиясын талдауға арналған статистикалық әдіс, ол үлгілер арасындағы корреляцияны ескереді…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aha-rating.html\"&gt;Ага-эффект»&lt;/a&gt; — Когнитивті белгісіздік шешілгенде кенеттен пайда болатын түсіну немесе жаңалық ашу сезімі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rolling-circle-replication.html\"&gt;Айналмалы сақина механизмі&lt;/a&gt; — Сақиналы РНҚ-лардың көбею механизмі, мұнда ұзын мультимерлі тізбектердің синтезі жүреді, олар кейіннен рибозимдермен кесіледі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aktinomitsin-d.html\"&gt;Актиномицин D&lt;/a&gt; — РНҚ синтезін тоқтататын зат, ол РНҚ-ның жартылай ыдырау мерзімін анықтау үшін қолданылады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/anergiya.html\"&gt;Анергия&lt;/a&gt; — Бірінші сигналды (CD3) костимуляциясыз жеке ынталандырғанда пайда болатын Т-жасушаларының функционалдық белсенді емес күйі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/human-developing-hippocampus-atlas.html\"&gt;Атлас развивающегося гиппокампа человека&lt;/a&gt; — Адам гиппокампының эмбрионалды кезеңнен жасөспірімдік шаққа дейінгі дамуын қамтитын интеграцияланған бір жасушалы анықтамалық жүйе.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/afantaziya.html\"&gt;Афантазия&lt;/a&gt; — Елестетуде ерікті визуалды бейнелердің өмір бойы болмауымен сипатталатын, бірақ көру және визуалды жады функциялары сақталған күй.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/protochnaya-tsitometriya.html\"&gt;Ағындық цитометрия&lt;/a&gt; — Ағынды цитометрия — бұл сұйықтық ағынындағы жасушаларды талдау әдісі, ол лазерлер мен флуоресцентті белгілердің көмегімен мыңдаған жеке…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aha-experience.html\"&gt;Аҳа» сезімі&lt;/a&gt; — Белгісіздік жойылғанда немесе жасырын мағына түсінілгенде пайда болатын кенеттен түсіну немесе инсайт күйі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/basolateral-amygdala.html\"&gt;Базолатеральная миндалина&lt;/a&gt; — Лимбиялық жүйеге кіретін ми аймағы, оның белсенділігі қауіптен қашу реакцияларымен байланысты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bayesovskiy-vyvod.html\"&gt;Байестік вывод&lt;/a&gt; — Шамадан тыс икемді модельдерді жазалайтын және барлық жасырын себептер бойынша ықтималдықтарды біріктіретін статистикалық шешім қабылдау…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ld.html\"&gt;Байланыстылық&lt;/a&gt; — Әртүрлі локустардағы аллельдердің кездейсоқ емес ассоциациясы; егер нұсқалар күшті LD күйінде болса, қайсысы аурудың нақты себебі екенін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/batches.html\"&gt;Батчтар&lt;/a&gt; — Зертханалар арасындағы техникалық айырмашылықтарды жою үшін математикалық алгоритмдер арқылы біріктірілетін жеке тәжірибе немесе…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/de-novo-proteins.html\"&gt;Белки de novo&lt;/a&gt; — Есептеу әдістері арқылы нөлден жасалған, белгіленген құрылымы мен функциялары бар ақуыз молекулалары.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/betaviroid-like-rnas.html\"&gt;бетавироидоподобные РНК&lt;/a&gt; — Әрбір полярлық тізбегінде рибозим мен ашық оқу рамкасының болуымен сипатталатын кодтаушы сақиналы РНҚ класы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/biological-replicate.html\"&gt;Биологиялық қайталаным&lt;/a&gt; — Тәуелсіз биологиялық көздерден (мысалы, әртүрлі жасуша культуралары немесе жануарлар) алынған үлгілер, бұл нәтижелердің қайталануын…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ortotopicheskaya-implantatsiya.html\"&gt;Биолюминесценция&lt;/a&gt; — Тірі ағзалар немесе жасушалар шығаратын жарық, бұл зертханада ісіктердің өсуі мен таралуын тірідей бақылауға мүмкіндік береді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bispecific-t-cell-engagers.html\"&gt;Биспецифические Т-клеточные рекрутеры&lt;/a&gt; — Т-жасушаларының рецепторларын (CD3) ынталандыру арқылы оларды ісік жасушаларына қарсы бағыттайтын препараттар.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/globus-pallidus-internus.html\"&gt;Бледный шар внутренний&lt;/a&gt; — Қара субстанцияға іргелес жатқан ми ядросы, оның белсенділігі осы жұмыста бақылау аймағы ретінде пайдаланылды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/occam-s-razor.html\"&gt;Бритва Оккама&lt;/a&gt; — Басқа жағдайлар бірдей болғанда, күрделі түсініктемелерге қарағанда қарапайым түсініктемелерге артықшылық беру керек деген қағида.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/single-unit-recording.html\"&gt;Бірлік жазбасы&lt;/a&gt; — Жеке нейрондардың электрлік белсенділігін микроэлектродтар арқылы тіркеу әдісі, ол ми жасушаларының жұмысын түсінуге көмектеседі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/upr.html\"&gt;Бүктелмеген ақуыздарға жауап&lt;/a&gt; — Эндоплазмалық ретикулумда ақаулы ақуыздар жиналған кезде жасушаны қорғайтын күрделі сигналдық жол, ол созылмалы түрде белсенгенде апоптозға…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/superior-temporal-cortex.html\"&gt;верхняя височная кора&lt;/a&gt; — Бастапқы визуалды қыртыс үшін төмен қарай кері байланыс көзі ретінде қызмет ететін мидың мультисенсорлы аймағы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vestern-blotting.html\"&gt;Вестерн-блоттинг&lt;/a&gt; — Вестерн-блоттинг (иммуноблоттинг) — бұл ақуыздарды электр өрісінің көмегімен өлшемі бойынша бөлуге және арнайы антиденелерді қолдану арқылы…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/viroid-like-rnas.html\"&gt;вироидоподобные РНК&lt;/a&gt; — Бір тізбекті сақиналы РНҚ геномы бар инфекциялық агенттер, олар көбінесе айналмалы сақина механизмі бойынша репликацияланады және өздігінен…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/grn.html\"&gt;Гендік реттеуші желі&lt;/a&gt; — Жасушада гендердің қосылуы мен өшуін басқаратын ДНҚ, РНҚ және ақуыздар арасындағы өзара әрекеттесудің күрделі жүйесі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dense-core-granules.html\"&gt;гранулы с плотным ядром&lt;/a&gt; — Ақуыздар агрегацияланатын секреторлық органеллалар; Альцгеймер ауруы кезінде олардың түзілуі бұзылып, эндолизосомалық ақауларға әкеледі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gw.html\"&gt;Громов-Вассерштейн (GW) қашықтығы&lt;/a&gt; — Әртүрлі «кеңістіктегі» (мысалы, гендер мен фенотиптер) деректер құрылымын олардың өз топтары ішіндегі өзара байланыстарын салыстыру арқылы…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dio.html\"&gt;Дейодиназалар&lt;/a&gt; — Тироксин (T4) молекуласынан йод атомдарын біртіндеп бөліп алып, T3, реверсивті T3 және ақыр соңында йодсыз тиронинге (T0) айналдыратын…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/desialirovanie.html\"&gt;Десиалирлену&lt;/a&gt; — Жасуша бетінен сиал қышқылының қалдықтарын ферментативті түрде алып тастау процесі, бұл олардың бауыр арқылы тазалануын тездетеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zeta-viruses.html\"&gt;дзета-вирусы&lt;/a&gt; — Тандемді қайталанатын ақуыздарды кодтау қабілеті бар және өздігінен кесілетін рибозимдері бар сақиналы РНҚ геномы бар инфекциялық агенттер…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/variance-partition.html\"&gt;Дисперсияны бөлу талдауы&lt;/a&gt; — Деректер өзгергіштігінің қай бөлігі (ген экспрессиясы жағдайында) донордың биологиялық ерекшеліктері немесе тәжірибенің техникалық…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/differentiated-thyroid-cancer.html\"&gt;Дифференцированный рак щитовидной железы&lt;/a&gt; — Қалқанша безі обырының 95%-дан астамын құрайтын қатерлі ісіктер тобы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dorsolateral-prefrontal-cortex.html\"&gt;дорсолатеральная префронтальная кора&lt;/a&gt; — Популяциялық транскриптомдар атласын жасау үшін негізгі нысан ретінде таңдалған бас ми қыртысының аймағы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dvuhfaktornyy-anova-s-povtornymi-izmereniyami.html\"&gt;Екі факторлы қайталанатын өлшемдер ANOVA&lt;/a&gt; — Екі фактордың бір объектке әртүрлі уақытта немесе жағдайларда тигізетін әсерін бағалауға арналған статистикалық әдіс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/memristornye-vychisleniya-v-pamyati-cim.html\"&gt;Жадтағы есептеулер (CIM&lt;/a&gt; — Computing-in-Memory) — бұл деректерді сақтау мен өңдеуді бір физикалық құрылғыда біріктіретін озық архитектура, ол процессор мен жад…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/imunogistohimiya.html\"&gt;Иммуногистохимия&lt;/a&gt; — Ұлпадағы спецификалық ақуыздарды арнайы белгіленген антиденелер көмегімен анықтау әдісі; калбиндин Пуркинье жасушаларын санау үшін маркер…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/imputatsiya.html\"&gt;Импутация&lt;/a&gt; — Импутация — бұл белгілі бір заңдылықтар мен референстік панельдер негізінде генотиптердегі немесе медициналық карталардағы жетіспейтін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/moi.html\"&gt;Инфекциялану көптігі&lt;/a&gt; — Дақылдағы әрбір жасушаға келетін орташа вирус бөлшектерінің саны; бұл жағдайда әрбір жасушаға 10 вирус бөлшегі келеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ngs.html\"&gt;Келесі буын секвенирлеу&lt;/a&gt; — Үлгіде қандай қоздырғыш бар екенін алдын ала білмей-ақ, миллиондаған ДНК фрагменттерін бір мезгілде талдап, кез келген микробтық…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/back-splicing.html\"&gt;Кері сплайсинг&lt;/a&gt; — Back-splicing (кері сплайсинг) — бұл экзонның 3'-ұшын сол немесе жоғарыда орналасқан экзонның 5'-ұшымен қосып, сақиналы РНҚ (circRNA) түзу…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rt-pcr.html\"&gt;Кері транскрипция ПЦР&lt;/a&gt; — РНК-ны алдымен комплементарлы ДНК-ға айналдырып, содан кейін қажетті учаскені талдау үшін еселеп көбейтуге мүмкіндік беретін әдіс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/metabolomnyy-analiz.html\"&gt;Конфлюенттік&lt;/a&gt; — Өсіру ыдысының түбін жасушалардың толық жабу пайызы (мысалы, 70% жасушалар қабатының тығыздығын білдіреді).&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ces.html\"&gt;Криптикалық оқиғалар&lt;/a&gt; — Жасуша ядросында TDP-43 ақуызының қалыпты функциясының жоғалуы салдарынан пайда болатын қалыптан тыс РНК процессингінің нұсқалары.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kripticheskie-ekzony.html\"&gt;Криптикалық экзондар&lt;/a&gt; — Қалыпты жағдайда интрон болып табылатын, бірақ сплайсинг механизмі бұзылғанда геннің кодтаушы бөлігі ретінде оқылатын РНҚ учаскелері.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cryptic-circrna.html\"&gt;Криптические кольцевые РНК&lt;/a&gt; — Криптикалық сақиналы РНҚ-лар — бұл TDP-43 ақуызының тапшылығы кезінде пайда болатын және интрондық тізбектерден қалыптасқан экзондарды…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/medial-temporal-default-mode-network.html\"&gt;Медиальная височная подсеть дефолт-системы мозга&lt;/a&gt; — Мидың парагиппокампальды, ретросплениальды және латеральды париетальды қыртысын қамтитын, жеке естеліктердің визуалды құрылымын таңдамалы…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/metabolic-dysfunction-associated-steatotic-liver-disease.html\"&gt;Метаболическая дисфункция-ассоциированная стеатотическая болезнь печени&lt;/a&gt; — Липидтердің жиналуымен, қабынумен және митохондриялық дисфункциямен сипатталатын бауырдың созылмалы ауруы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vybor-modeley.html\"&gt;Модельді таңдау&lt;/a&gt; — Шулы деректерге шамадан тыс бейімделіп қалудың алдын алу үшін модельдің дәлдігі мен оның қарапайымдылығы арасындағы теңгерімді табуға…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/molekulyarnyy-doking.html\"&gt;Молекулярный докинг&lt;/a&gt; — Молекулалық докинг — дәрі молекуласының (лиганд) ақуыз-нысананың белсенді орталығына қалай орналасатынын болжайтын компьютерлік модельдеу…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/neocortex.html\"&gt;Неокортекс&lt;/a&gt; — Мидың анатомиялық аймағы, онда микро-ояну кезінде эпилептиформды разрядтардың ең айқын өсуі байқалады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/knock-in.html\"&gt;Нок-ин&lt;/a&gt; — Жануардың геномына белгілі бір мутацияны енгізу арқылы оның патологиялардың дамуына әсерін зерттеуге мүмкіндік беретін генетикалық…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/knock-out.html\"&gt;Нокаут&lt;/a&gt; — Нокаут — бұл организмдегі нақты генді «өшіру» немесе алып тастауға бағытталған генетикалық технология. Бұл әдіс модельдік организмдердегі…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/nokdaun.html\"&gt;Нокдаун&lt;/a&gt; — Нокдаун — бұл РНҚ-интерференция немесе CRISPR жүйелерінің көмегімен нақты геннің экспрессиясын төмендету әдісі. Бұл әдіс ген мен оған…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/predicted-aligned-error.html\"&gt;Нормаланған iPAE&lt;/a&gt; — Ақуыз домендерінің кеңістіктік орналасу дәлдігін бағалайтын көрсеткіш, белгіленген шектен төмен мәндер кешеннің дұрыс моделделгенін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/npe.html\"&gt;Норманы болжау қателіктері&lt;/a&gt; — Әлеуметтік өзара іс-қимыл барысында ұсынылған әділдік пен серіктестің нақты ұсынысы арасындағы айырмашылықты көрсететін метрика.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/single-cell-rna-sequencing.html\"&gt;Одномолекулярное секвенирование РНК&lt;/a&gt; — Бір жасушалы РНҚ секвенирлеуі (scRNA-seq) — бұл әрбір жеке жасушадағы гендердің белсенділігін талдаудың озық әдісі, ол жасушалар арасындағы…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/periodontitis.html\"&gt;Пародонтит&lt;/a&gt; — Пародонтит - тіс айналасындағы тіндердің созылмалы инфекциялық-қабыну ауруы, ол қызыл иек, альвеолярлы сүйек пен дентиннің бұзылуымен…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/primary-visual-cortex.html\"&gt;первичная зрительная кора&lt;/a&gt; — Қазіргі уақытты бастапқы талдауға, болашақты болжауға және визуалды тәжірибені ретроспективті өңдеуге қатысатын ми аймағы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/piroptoz.html\"&gt;Пироптоз&lt;/a&gt; — Күшті қабыну жауабымен жүретін бағдарламаланған жасуша өлімінің түрі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/polisomnografiya.html\"&gt;Полисомнография&lt;/a&gt; — Ұйқы құрылымын бағалау үшін ми, бұлшықет және көз қозғалысының белсенділігін жазуды қамтитын кешенді ұйқы зерттеуі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/postdiktsiya.html\"&gt;Постдикция&lt;/a&gt; — Кешігіп келетін ақпарат бұрын болған тітіркендіргішті қабылдауды өзгертетін құбылыс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pre-supplementary-motor-area.html\"&gt;Пре-дополнительная моторная зона&lt;/a&gt; — Ми аймағы, онда жад тапсырмаларын орындау кезінде нейрондық популяциялар субъектінің түпкілікті шешімі туралы сигнал береді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/prolekarstvo.html\"&gt;Продәрі&lt;/a&gt; — Ағзада метаболикалық өзгерістер нәтижесінде белсенді түрге айналатын дәрілік заттың модификацияланған түрі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/promoter-trap.html\"&gt;Промотор тұзағы&lt;/a&gt; — Репортер ген тек белсенді генге енгізілгенде ғана белсендірілетін әдіс, ол нақты интеграциясы бар жасушаларды таңдауға мүмкіндік береді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/early-life-adversity.html\"&gt;Ранний жизненный стресс&lt;/a&gt; — Ерте жастағы қолайсыз жағдайлар, мысалы, қамқорлықтың болмауы немесе тұрақсыз орта, бұл мазасыздық бұзылыстарының қаупін арттырады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/autism-spectrum-disorder.html\"&gt;Расстройство аутистического спектра&lt;/a&gt; — Жоғары тұқым қуалаушылықпен және гендік желілердегі конвергентті молекулалық ақаулармен сипатталатын нейро даму бұзылыстарының тобы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rare-and-extreme-events.html\"&gt;Редкие и экстремальные события&lt;/a&gt; — Пайда болу ықтималдығы бір пайыздан төмен және орташа мәннен он стандартты ауытқудан артық ерекшеленетін оқиғалар.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/retikulyarnye-trombotsity.html\"&gt;Ретикулярлы тромбоциттер&lt;/a&gt; — Сүйек кемігінен жаңа шыққан жас формалар, олардың көбеюі тромбопоэздің күшейгенін білдіреді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/reguliruemaya-sekretsiya.html\"&gt;Реттелетін секреция&lt;/a&gt; — Жасушалар секрецияланатын заттарды арнайы түйіршіктерде жинап, белгілі бір сигналдарға жауап ретінде шығаратын процесс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hammerhead-ribozymes.html\"&gt;рибозимы типа III «молоток»&lt;/a&gt; — Репликацияның аралық өнімдерін дәл кесуді қамтамасыз ететін, өздігінен кесілуге қабілетті РНҚ-ның каталитикалық бөліктері.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rnk-immunopretsipitatsiya.html\"&gt;РНҚ-иммунопреципитация&lt;/a&gt; — Белгілі бір ақуызбен байланысқан РНҚ молекулаларын осы ақуызға қарсы антиденелердің көмегімен бөліп алу және зерттеу әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dml.html\"&gt;Себеп-салдарлық машиналық оқыту&lt;/a&gt; — Себеп-салдарлық байланыстарды анықтау және қауіп факторларының патологиялардың дамуына әсерін бағалау үшін қолданылатын әдіс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sepsis.html\"&gt;Сепсис&lt;/a&gt; — Ағзаның инфекцияға сәйкес емес жауабы салдарынан туындайтын өмірге қауіпті ағзалар дисфункциясы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/svd.html\"&gt;Сингулярлық жіктеу&lt;/a&gt; — Матрицаны құрамдас бөліктерге бөлу арқылы үлкен деректер массивтерін талдау үшін қолданылатын әмбебап сызықтық алгебра әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/marinesco-sjogren-syndrome.html\"&gt;Синдром Маринеско — Шёгрена&lt;/a&gt; — SIL1 геніндегі мутацияларға байланысты мишық атаксиясымен, миопатиямен және нейрондардың дегенерациясымен сипатталатын сирек кездесетін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/systemic-juvenile-idiopathic-arthritis.html\"&gt;Системный ювенильный идиопатический артрит&lt;/a&gt; — Балаларда кездесетін сирек аутоиммунды ауру, ол жүйелі қабынумен, қызбамен және тері бөртпелерімен көрінеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ins.html\"&gt;СНТ&lt;/a&gt; — Деректер негізінде тапсырмаларды шешу үшін оқытылатын математикалық модельдер; бұл контексте олар адам ойлауымен салыстырылады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spike-sorting.html\"&gt;Спайктерді сұрыптау&lt;/a&gt; — Бір микроэлектрод жазып алған әртүрлі нейрондардың электрлік сигналдарын олардың бірегей толқын пішіні бойынша бөліп алуға арналған…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stadii-braaka.html\"&gt;Стадии Браака&lt;/a&gt; — Браак сатылары — бұл Альцгеймер ауруы кезіндегі нейродегенерацияның дамуын бағалау жүйесі, ол тау-ақуызы мен нейрофибриллярлы түйіндердің…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/statistical-learning.html\"&gt;Статистическое обучение&lt;/a&gt; — Буындардың пайда болу ықтималдығына негізделе отырып, сөйлеу ағынынан сөздерді бөліп алудың когнитивті процесі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stereoelektroentsefalografiya.html\"&gt;Стереоэлектроэнцефалография&lt;/a&gt; — Мидың терең құрылымдарының электрлік белсенділігін жоғары кеңістіктік-уақыттық ажыратымдылықпен инвазивті тіркеу әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/lmm.html\"&gt;Сызықты аралас модельдер&lt;/a&gt; — Сызықтық аралас модельдер (LMM) — бұл топтастырылған немесе иерархиялық құрылымы бар деректерді талдауға арналған статистикалық әдіс. Ол…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sekvenirovanie-po-sengeru.html\"&gt;Сэнгер секвенирлеуі&lt;/a&gt; — Сэнгер секвенирлеуі — бұл тізбек терминаторларын қолдануға негізделген ДНҚ нуклеотидтік тізбегін анықтаудың «алтын стандарты». Әдіс нақты…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zhidkostnaya-hromatografiya-tandemnaya-mass-spektrometriya.html\"&gt;Сұйықтық хроматографиясы-тандемдік масс-спектрометрия&lt;/a&gt; — Қан сарысуындағы қалқанша безі гормоны метаболиттерінің концентрациясын өлшеу үшін қолданылатын сезімтал және тұрақты аналитикалық әдіс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dbs.html\"&gt;Терең ми стимуляциясы&lt;/a&gt; — Науқастардағы жеке нейрондардың белсенділігін тіркеу үшін қолданылатын электродтарды орнату бойынша нейрохирургиялық процедура.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/otritsatelnaya-binomialnaya-glmm.html\"&gt;Теріс биномиалды GLMM&lt;/a&gt; — Оқиғалар жиілігінің дисперсиясы орташа мәннен асып түсетін деректерді талдауға арналған статистикалық әдіс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/origin-of-replication.html\"&gt;Точка начала репликации&lt;/a&gt; — Плазмидадағы репликация процесі басталатын арнайы ДНҚ тізбегі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/traktografiya.html\"&gt;Трактография&lt;/a&gt; — Мидың ақ затының өткізгіш жолдарын визуализациялауға және олардың құрылымдық ұйымдастырылуын бағалауға мүмкіндік беретін МРТ деректерін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/transgennye-myshi.html\"&gt;Трансгенді тышқандар&lt;/a&gt; — Генетикалық инженерия арқылы белгілі бір ген енгізілген немесе өзгертілген жануарлар.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fazirovanie.html\"&gt;Фазалау&lt;/a&gt; — Аллельдердің қай хромосомада (әке немесе ана) орналасқанын анықтау процесі, бұл гаплотиптерді түсіну үшін өте маңызды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fa.html\"&gt;Фракциялық анизотропия&lt;/a&gt; — Ақ зат талшықтары бойымен су диффузиясының бағытталу көрсеткіші, өткізгіш жолдардың тұтастығы мен миелиндену дәрежесін көрсетеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/korrespondentsiya.html\"&gt;Хат алмасу&lt;/a&gt; — Мақала авторларымен байланысудың ресми арнасы, онда зерттеудің дұрыстығы мен ғылыми қауымдастықпен қарым-қатынас жасауға жауапты тұлға…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cyclic-loess.html\"&gt;Циклдік loess&lt;/a&gt; — Үлгілер арасындағы техникалық айырмашылықтарды жою және деректердің таралуын теңестіру үшін қолданылатын статистикалық әдіс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/substantia-nigra-pars-reticulata.html\"&gt;Черная субстанция ретикулярная&lt;/a&gt; — Мидің терең құрылымы, әлеуметтік нормаларды болжау қателерінің валенттілігін кодтайтын нейрондарды қамтиды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ekzogennyy-holesterin.html\"&gt;Экзогенді холестерин&lt;/a&gt; — Ісік жасушаларының микроорта есебінен тапшылықты толықтыра алатынын тексеру үшін қоректік ортаға сырттан қосылатын холестерин.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ekzosomy.html\"&gt;Экзосомалар&lt;/a&gt; — Уытты сигналдар мен эндолизосомалық тасымалдау ақаулары жасушалар арасында тасымалданатын жасушадан тыс көпіршіктер.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/endolizosomalnyy-trafik.html\"&gt;Эндолизосомалық трафик&lt;/a&gt; — Молекулаларды эндосомалар мен лизосомалар арасында тасымалдайтын және өңдейтін жасушаішілік көлік жүйесі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/epistemicheskaya-duga.html\"&gt;Эпистемическая дуга&lt;/a&gt; — Мотивациялық оқытудың іргелі жолы, ол ішкі күйлердің тізбегін білдіреді: қызығушылықтан бастап түсіну мен ләззат алуға дейін.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aesthetic-aha.html\"&gt;Эстетикалық түсіну&lt;/a&gt; — Ғылыми жаңалыққа ұқсас өнер туындысының мәнін бір сәтте түсініп, айқындау сезімі, ол оның эмоционалды бағасын арттырады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/effector-cd8-t-lymphocytes.html\"&gt;Эффекторные CD8+ Т-лимфоциты&lt;/a&gt; — KRAS гені қалыптан тыс экспрессияланатын Т-жасушалардың субпопуляциясы, бұл олардың цитотоксикалығының артуына, сарқылуына және…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/amr.html\"&gt;Эшвелл-Морелл рецепторы&lt;/a&gt; — Десиалирленген тромбоциттерді байланыстыратын және JAK2-STAT3 сигналдық жолын белсендіретін бауыр рецепторы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rsv.html\"&gt;Қалдық сингулярлық мәндер векторлары&lt;/a&gt; — Дефляцияның әр қадамында негізгі компоненттер алынып тасталғаннан кейін пайда болатын және жоғары дәлдіктегі есептеулерді талап ететін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/power-analysis.html\"&gt;Қуаттылықты талдау&lt;/a&gt; — Эксперимент нақты ғылыми әсерді анықтай алатынына көз жеткізу үшін қажетті қатысушылардың ең аз санын математикалық түрде есептеу әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/structured-output.html\"&gt;Құрылымдалған шығыс&lt;/a&gt; — Жасанды интеллект моделінің жауаптарын қатаң түрде алдын ала белгіленген үлгіде (мысалы, JSON форматында) қалыптастыруға мәжбүрлейтін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ied.html\"&gt;Ұстамааралық эпилептиформдық разрядтар&lt;/a&gt; — Эпилепсия ұстамалары арасында мида пайда болатын патологиялық электрлік импульстер, олардың жиілігі ұйқының тұрақсыздығы кезінде артады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/razdelenie-patternov.html\"&gt;Өрнекті ажырату&lt;/a&gt; — Гиппокамптағы есептеу процесі, ол миға ұқсас, бірақ әртүрлі стимулдарды ажыратуға және жаңа мен таныс объектілерді шатастырмауға мүмкіндік…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"aedis\"&gt;&lt;a href=\"concepts/index.html#aedis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдіс&lt;/span&gt;&lt;/a&gt;Әдіс&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/crispr-screening.html\"&gt;CRISPR-скрининг&lt;/a&gt; — CRISPR-скрининг — бұл CRISPR/Cas9 жүйесінің көмегімен жасушалардағы мыңдаған гендерді кезекпен өшіру (нокаут) немесе белсендіру арқылы…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rolling-circle-amplification.html\"&gt;Амплификация с круговой петлей&lt;/a&gt; — Орталық жүйке жүйесінің тіндеріндегі патологиялық сақиналы РНҚ-ны анықтау үшін қолданылатын жоғары сезімтал анықтау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fisher-information-approximation.html\"&gt;Аппроксимация фишеровской информации&lt;/a&gt; — Модель күрделілігі үшін айыппұлдарды геометриялық құрамдас бөліктерге: өлшем, параметрлер кеңістігінің көлемі, шекаралық әсерлер және…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/in-silico-gene-perturbation.html\"&gt;Виртуальный нокаут генов&lt;/a&gt; — Жасушалардың реттеуші желісін модельдеу және нақты геннің (KRAS) басылуының жасушалық функцияларға әсерін бағалау үшін қолданылатын есептеу…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hybrid-imputation.html\"&gt;Гибридная импутация&lt;/a&gt; — Тізбекті теңдеулер арқылы көптік толтыру (MICE) мен кездейсоқ орман алгоритмін біріктіретін жетіспейтін деректерді өңдеу стратегиясы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ultimatum-game.html\"&gt;Игра в ультиматум&lt;/a&gt; — Қатысушылар серіктестерден ақшалай ұсыныстарды қабылдайтын немесе қабылдамайтын мінез-құлық парадигмасы, ол әлеуметтік нормаларға…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multichannel-electroencephalography.html\"&gt;Многоканальная электроэнцефалография&lt;/a&gt; — Мидің электрлік белсенділігін бас терісіндегі электродтар арқылы тіркеу әдісі, сөйлеу дамуын бағалау үшін қолданылады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/limited-bedding-and-nesting.html\"&gt;Модель ограниченного количества подстилочного материала и гнезд&lt;/a&gt; — Ерте постнатальды кезеңде тышқандар үшін ресурстардың тапшылығына еліктейтін және стресс тудыратын эксперименталды модель.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multimodal-data.html\"&gt;Мультимодальные данные&lt;/a&gt; — Танымның физиологиялық корреляттарын қадағалау үшін ЭЭГ, ЭКГ және көз қозғалыстарын бір уақытта тіркеуді қамтитын деректерді жинаудың…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/optogenetic-inhibition.html\"&gt;Оптогенетическое подавление&lt;/a&gt; — Жұмыста стресс салдарларын жою үшін қолданылатын, жарық көмегімен нейрондардың белсенділігін басқару әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/whole-genome-sequencing.html\"&gt;Полногеномное секвенирование&lt;/a&gt; — Сирек генетикалық нұсқаларды іздеу үшін қолданылатын ағзаның толық ДНҚ тізбегін анықтау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/causal-forest.html\"&gt;Причинный лес&lt;/a&gt; — Қауіп факторларының гетерогенді әсерін бағалау және себеп-салдарлық байланыстарды талдау үшін қолданылатын құрал.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/oxford-nanopore-sequencing.html\"&gt;Секвенирование Oxford Nanopore&lt;/a&gt; — ITR тұрақтылығын бағалау үшін қолданылатын ДНҚ нуклеотидтік тізбегін талдау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/random-forest.html\"&gt;Случайный лес&lt;/a&gt; — Тәуекелдерді жіктеу және жетіспейтін деректерді гибридті импутациялау үшін қолданылатын машиналық оқыту алгоритмі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/functional-magnetic-resonance-imaging.html\"&gt;Функциональная магнитно-резонансная томография&lt;/a&gt; — Автобиографиялық сюжеттерді ойша бастан кешіру кезінде ми қыртысының белсенділік өрнектерін картаға түсіру үшін қолданылатын…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/four-armed-bandit-task.html\"&gt;Четырехрукий бандит&lt;/a&gt; — Жануарлар әртүрлі марапаттар мен жазалары бар төрт нұсқаның арасынан таңдау жасайтын эксперименттік мінез-құлық сынағы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"zat\"&gt;&lt;a href=\"concepts/index.html#zat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зат&lt;/span&gt;&lt;/a&gt;Зат&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/chmp5.html\"&gt;Chmp5&lt;/a&gt; — Везикулалар мен экзосомалардың түзілуін реттейтін ESCRT-III кешенінің көмекші ақуызы; оны басу ақаулардың жасушааралық таралуын бөгейді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cnbp.html\"&gt;CNBP&lt;/a&gt; — CNBP — мРНҚ құрамындағы гуанин мен аденинге бай элементтермен байланысатын және жасушалық процестерде маңызды рөл атқаратын ақуыз.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kras.html\"&gt;KRAS&lt;/a&gt; — Жасушалардың пролиферациясы мен тіршілігін реттейтін шағын ГТФаза, оның Т-лимфоциттердегі шамадан тыс белсендірілуі олардың мерзімінен…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/net1.html\"&gt;NET1&lt;/a&gt; — CNBP ақуызымен өзара әрекеттесуі блокталған кезде тасымалдануы бұзылатын нысаналы транскрипт, бұл ісік жасушаларының қозғалғыштығы мен…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tdp-43.html\"&gt;TDP-43&lt;/a&gt; — Әдетте сплайсингті реттейтін және нейродегенерация кезінде қызметін жоғалтып, криптикалық сақиналы РНҚ-лардың патологиялық синтезін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ube2l3.html\"&gt;UBE2L3&lt;/a&gt; — Мутациялары қабыну реакциясын бақылауды бұзатын және бактериялық инфекциялардың ауыр өту қаупін арттыратын ген.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vp2-capsid-protein.html\"&gt;VP2&lt;/a&gt; — Эндоцитоздық мембраналарда тесіктердің түзілуіне жауап беретін вирустық ақуыз; ондағы мутациялар вирустың Plscr1 әсеріне төзімділігін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zfx.html\"&gt;ZFX&lt;/a&gt; — X-хромосомамен байланысты транскрипция факторы, әйелдерде оның жоғары экспрессия деңгейі РАС-пен байланысты генетикалық мутацияларды…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/beta-amyloid.html\"&gt;бета-амилоид&lt;/a&gt; — Амилоидты ақуыз ізашарының ыдырау өнімі болып табылатын пептид, оның Альцгеймер ауруы кезінде жинақталуы эндолизосомалық ақаулар мен…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/il-1beta.html\"&gt;Интерлейкин-1 бета&lt;/a&gt; — UBE2L3 генінің ақаулары кезінде утилизациясы бұзылатын қабынуға қарсы цитокин, бұл бақыланбайтын қабынуға әкеледі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/corticotropin-releasing-hormone.html\"&gt;Кортикотропин-рилизинг-гормон&lt;/a&gt; — Ми нейрондарында экспрессияланатын гормон, стресске жауап ретінде нейропластиканы іске қосатын эффектор қызметін атқарады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/protein-kinase-a.html\"&gt;Протеинкиназа A&lt;/a&gt; — Белсенділігі AKAP11 якорьлік ақуызымен реттелетін, жасушаішілік сигнал беруге қатысатын фермент.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tau-protein.html\"&gt;Тау-белок&lt;/a&gt; — Нейродегенерацияға қатысатын ақуыз; жұмыста вирустық инфекциядан кейінгі мидағы патологиялық өзгерістердің маркері ретінде қолданылады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thrombopoietin.html\"&gt;Тромбопоэтин&lt;/a&gt; — Ағзадағы тромбоциттердің түзілуі мен жетілуін ынталандыратын негізгі гормон-реттегіш.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ubiquitin.html\"&gt;Убиквитин&lt;/a&gt; — Субстраттармен ковалентті байланысу немесе бос күйінде бола отырып, жасушалық процестерді реттейтін 76 аминқышқылынан тұратын консервативті…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/phenol-red.html\"&gt;Феноловый красный&lt;/a&gt; — Реакция қоспасының түсінің өзгеруі арқылы амплификация нәтижелерін визуалды анықтау үшін қолданылатын химиялық индикатор.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/human-neutrophil-peptides.html\"&gt;Человеческие нейтрофильные пептиды&lt;/a&gt; — Нейтрофилдер бөлетін катионды пептидтер, олар метаболикалық жүктеме жағдайында патогендік эффекторлар ретінде әрекет етіп, митохондриялық…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"material\"&gt;&lt;a href=\"concepts/index.html#material\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Материал&lt;/span&gt;&lt;/a&gt;Материал&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/induced-pluripotent-stem-cells.html\"&gt;Индуцированные плюрипотентные стволовые клетки&lt;/a&gt; — Генетикалық бұзылыстар кезінде гормондардың әсерін сынау үшін адам нейрондарын алуға пайдаланылатын жасушалық материал.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/plasmid.html\"&gt;Плазмида&lt;/a&gt; — Бактерияларда генетикалық конструкцияларды көбейту және сақтау үшін вектор ретінде қолданылатын сақиналы ДНҚ молекуласы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khural\"&gt;&lt;a href=\"concepts/index.html#khural\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Құрал&lt;/span&gt;&lt;/a&gt;Құрал&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/casrx.html\"&gt;CasRx&lt;/a&gt; — Нейральді прогениторлы жасушалар дақылында арнайы гендердің белсенділігін басу (нокдаун) үшін қолданылатын РНҚ-басқарылатын фермент.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dcas13.html\"&gt;dCas13&lt;/a&gt; — РНҚ-ның нақты бөліктерін стерикалық блоктау үшін қолданылатын Cas13 ақуызының каталитикалық белсенді емес нұсқасы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dsrbd.html\"&gt;dsRBD&lt;/a&gt; — dCas13/gРНҚ кешенінің нысаналы мРНҚ-ға жақындығын арттыру үшін dCas13-ке қосылатын домен.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/psychad.html\"&gt;PsychAD&lt;/a&gt; — Нейродегенеративті және психиатриялық аурулар кезінде транскриптомдар атласын жасау үшін қолданылатын 1494 бірегей ми донорларының…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rfdiffusion.html\"&gt;RFdiffusion&lt;/a&gt; — Берілген байланысу қасиеттері бар ақуыздарды есептеу дизайны үшін қолданылатын терең оқыту алгоритмі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rnase-r.html\"&gt;RNase R&lt;/a&gt; — Сызықтық РНҚ молекулаларын таңдамалы түрде ыдырататын фермент, бұл үлгілердегі сақиналы РНҚ-ларды шоғырландыруға және талдауға мүмкіндік…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/target-adaptive-rescue-explore-exploit.html\"&gt;T-REX&lt;/a&gt; — Ақуыздарды автоматтандырылған жобалауға арналған агенттік жүйе, ол генеративті модельдерді үйлестіреді және есептеу ресурстарын бөледі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bicos.html\"&gt;Биспецифические костимуляторы&lt;/a&gt; — Т-жасушаларын белсендіру үшін екінші сигналды CD28 рецепторымен бивалентті байланысу арқылы қамтамасыз ететін молекулалар.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/deterministic-controller.html\"&gt;Детерминированный контроллер&lt;/a&gt; — LLM-агенттерінің ұсыныстарын тексеретін, ресурстар шектеулерін басқаратын және тапсырмаларды графикалық процессорларға бөлетін жүйе…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stable-diffusion.html\"&gt;Диффузионная нейросеть&lt;/a&gt; — Қатысушылардың ауызша сипаттамалары негізінде жекелендірілген визуалды бейнелерді синтездеу үшін қолданылатын «мәтіннен кескінге»…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/brain-organoids.html\"&gt;Мозговые органоиды&lt;/a&gt; — Индукцияланған плюрипотентті дің жасушаларынан алынған зертханалық модель, ол мидың ерте дамуының негізгі ерекшеліктерін қайталайды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vgg-16.html\"&gt;Сверточная нейросеть VGG-16&lt;/a&gt; — Сахнаның визуалды моделін құру үшін синтезделген кескіндерден 1000 өлшемді активтену векторларын алу үшін қолданылатын компьютерлік көру…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/7t-fmri.html\"&gt;сверхвысокопольное 7Т МРТ&lt;/a&gt; — Қыртыстың жеке қабаттарының белсенділігін оқшаулауға мүмкіндік беретін, воксельдің жоғары ажыратымдылығы бар нейровизуализация құралы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"standart\"&gt;&lt;a href=\"concepts/index.html#standart\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Стандарт&lt;/span&gt;&lt;/a&gt;Стандарт&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/bethesda-system.html\"&gt;Система Bethesda&lt;/a&gt; — Қалқанша безі түйіндерінің қатерлілік дәрежесін бағалау үшін қолданылатын жіңішке инелі аспирациялық биопсияның цитологиялық нәтижелерінің…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"organizm-/-model\"&gt;&lt;a href=\"concepts/index.html#organizm-/-model\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Организм / модель&lt;/span&gt;&lt;/a&gt;Организм / модель&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/balamuthia-mandrillaris.html\"&gt;Balamuthia mandrillaris&lt;/a&gt; — Өте қауіпті баламутиялық амебалық энцефалитті қоздыратын еркін өмір сүретін амеба.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/influenza-a-virus-h1n1.html\"&gt;Вирус гриппа А серотипа H1N1&lt;/a&gt; — Респираторлық инфекцияны қоздыру және оның ми протеомына әсерін зерттеу үшін қолданылатын пневмотропты РНҚ вирусы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/danio-rerio.html\"&gt;Данио-рерио&lt;/a&gt; — Дернәсілдері сенсомоторлық мінез-құлықты талдау және терапия кезіндегі мінез-құлық бұзылыстарын компенсациялау үшін қолданылатын модельдік…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/purkinje-cells.html\"&gt;Клетки Пуркинье&lt;/a&gt; — SIL1 ақуызының тапшылығы кезінде дегенерацияға ұшырайтын және атаксияның дамуына әкелетін мишық нейрондарының түрі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/megakaryocytes.html\"&gt;Мегакариоциты&lt;/a&gt; — Тромбоциттер тапшылығын өтеу үшін көкбауырда саны артатын тромбоциттердің ізашар жасушалары.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/microglia.html\"&gt;Микроглия&lt;/a&gt; — Мияның иммундық жасушалары, тазалаушы қызметін атқарады, Альцгеймер ауруы кезінде жүйке тінін улы ақуыздардан тазартуға тырысады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/woozy-mice.html\"&gt;Мыши линии woozy&lt;/a&gt; — Marinesco-Sjogren синдромының белгілерін қайталау үшін модель ретінде пайдаланылатын Sil1 генінде мутациясы бар тышқандар желісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/murine-norovirus.html\"&gt;Мышиный норовирус&lt;/a&gt; — Тышқандарда гастроэнтерит тудыратын қабықшасыз вирус, оның репликациясы Plscr1 ақуызымен шектеледі.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khubylys\"&gt;&lt;a href=\"concepts/index.html#khubylys\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Құбылыс&lt;/span&gt;&lt;/a&gt;Құбылыс&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/aggresomes.html\"&gt;Агресомы&lt;/a&gt; — Убиквитин-протеасомалық жүйе бұзылған кезде түзілетін, дұрыс бүктелмеген убиквитинденген ақуыздардан тұратын перинуклеарлық құрылымдар.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/anabolic-program.html\"&gt;Анаболическая программа&lt;/a&gt; — Микроглиядағы метаболикалық процесс, фагоцитарлық белсенділікті сақтау үшін жаңа ақуыздар синтезін митохондриялар биогенезімен біріктіреді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/haploinsufficiency.html\"&gt;Гаплонедостаточность&lt;/a&gt; — Геннің бір функционалды көшірмесі ағзаның қалыпты жұмыс істеуі үшін жеткілікті ақуыз деңгейін қамтамасыз ете алмайтын жағдай.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ischemia-and-reperfusion.html\"&gt;Ишемия и реперфузия&lt;/a&gt; — Инфаркттан кейінгі тромбоциттер динамикасын зерттеу үшін қолданылатын миокард зақымдануының эксперименталды моделі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mevalonate-pathway.html\"&gt;Мевалонатный путь&lt;/a&gt; — Холестерин синтезінің метаболикалық жолы, оның ферменттері (DHCR24, EBP) ісіктің терапияға сезімталдығын арттыру үшін негізгі нысана болып…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/microarousals.html\"&gt;Микропробуждения&lt;/a&gt; — Ұйқы кезіндегі қысқа мерзімді ауысулар, мидың қалыптан тыс электрлік белсенділігінің жергілікті өсуін тудырады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/neural-tracking.html\"&gt;Нейронный трекинг&lt;/a&gt; — Мидің өз электрлік белсенділігін сөйлеудің буын ырғағымен синхрондау қабілеті.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/feedback.html\"&gt;обратная связь&lt;/a&gt; — Ерте сигналдарды модуляциялауға мүмкіндік беретін, жоғары деңгейлі мультисенсорлы аймақтардан бастапқы сенсорлы қыртысқа сигналдарды беру…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/shared-transcriptomic-vulnerability.html\"&gt;общая транскриптомная уязвимость&lt;/a&gt; — Әртүрлі аурулар кезіндегі ген экспрессиясының өзгеруінің қайталанатын үлгілері, бұл ортақ патогендік механизмдерді көрсетеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/overfitting.html\"&gt;Переобучение&lt;/a&gt; — Модельдің деректердегі кездейсоқ шуға шамадан тыс бейімделуі және нақты заңдылықтарды көрсету қабілетін жоғалту құбылысы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/familial-alzheimer-s-disease.html\"&gt;Семейная форма болезни Альцгеймера&lt;/a&gt; — APP, PSEN1 немесе PSEN2 гендеріндегі аутосомды-доминантты мутациялардан туындайтын Альцгеймер ауруының ерте түрі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/endoplasmic-reticulum-stress.html\"&gt;Стресс эндоплазматического ретикулума&lt;/a&gt; — SIL1 тапшылығы кезінде дұрыс оралмаған ақуыздардың жинақталуынан туындайтын, UPR каскадын және нейрондардың апоптозын қоздыратын…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/transcriptional-convergence.html\"&gt;Транскрипционная конвергенция&lt;/a&gt; — Әртүрлі бастапқы нысана гендердің бұзылуы бірыңғай реттеуші желідегі үйлестірілген ақауға және экспрессиядағы ұқсас өзгерістерге әкелетін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/black-swans.html\"&gt;Черные лебеди&lt;/a&gt; — Сирек кездесетін, ықтималдығы төмен, бірақ жойқын оқиғалар, олардан жануарлар ұсақ шығындар есебінен аулақ болуға тырысады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gene-expression.html\"&gt;Экспрессия генов&lt;/a&gt; — Мутациялар мен гормоналды терапияның молекулалық деңгейдегі әсерін бағалау үшін профилі талданатын процесс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aha-effect.html\"&gt;Эффект «ага»&lt;/a&gt; — Кенеттен түсіну немесе инсайт сәтімен бірге жүретін феноменалды сезім, ол метакогнитивті кері байланыс сигналы ретінде қызмет етеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/female-protective-effect.html\"&gt;Эффект защиты женского пола&lt;/a&gt; — Әйел ағзасының аутизмнің дамуына төзімдірек болуы және аурудың көрінуі үшін көбірек генетикалық жүктемені талап ететін биологиялық механизм.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/title-effect.html\"&gt;Эффект названия&lt;/a&gt; — Мәтін түріндегі қосымша семантикалық ақпарат өнер туындыларын қабылдауды, түсіндіруді және бағалауды өзгертетін құбылыс.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"metrika\"&gt;&lt;a href=\"concepts/index.html#metrika\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Метрика&lt;/span&gt;&lt;/a&gt;Метрика&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/roc-auc.html\"&gt;ROC-AUC&lt;/a&gt; — ROC-AUC — бұл классификация сапасының көрсеткіші, мұнда 0,5 мәні кездейсоқ болжамды, ал 1,0 сыныптардың мінсіз бөлінуін білдіреді. Бұл…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/evoked-potentials.html\"&gt;Вызванные потенциалы&lt;/a&gt; — Шақырылған потенциалдар (ШП) — бұл ЭЭГ көмегімен өлшенетін, тітіркендіргіштерге жауап ретіндегі мидың электрлік белсенділігі. Олардың…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/peripheral-distribution-index.html\"&gt;Индекс периферического распределения&lt;/a&gt; — Жасушадағы мРНҚ-ның таралуын сандық бағалау үшін қолданылатын көрсеткіш, мұнда жоғары мәндер перифериялық таралуды, ал төмен мәндер…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pattern-perceptual-similarity.html\"&gt;перцептивное сходство паттернов&lt;/a&gt; — Иллюзия нәтижесінде туындаған белсенділіктің объектіні қабылдауға немесе тор қабықтағы физикалық сигналға көбірек ұқсастығын сандық…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/limit-of-detection.html\"&gt;Предел обнаружения&lt;/a&gt; — Тест үлгіде сенімді түрде анықтай алатын ДНҚ-ның минималды концентрациясы немесе трофозоиттер саны.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/structurally-unique-hits.html\"&gt;Структурно уникальные хиты&lt;/a&gt; — Сапа сүзгілерінен өткен және өз құрылымымен ерекшеленетін сәтті ақуыз үміткерлерінің санын көрсететін жобалау тиімділігінің көрсеткіші.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sequential-organ-failure-assessment.html\"&gt;Шкала SOFA&lt;/a&gt; — Сепсисті диагностикалау үшін қолданылатын ағзалар дисфункциясының дәрежесін бағалауға арналған клиникалық шкала.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"konferenciya\"&gt;&lt;a href=\"concepts/index.html#konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конференция&lt;/span&gt;&lt;/a&gt;Конференция&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&
