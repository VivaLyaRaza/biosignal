            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"anykhtama\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтама&lt;/span&gt;&lt;/a&gt;Анықтама&lt;/h2&gt;\n&lt;p&gt;как устроены нейроны, сети мозга и память&lt;/p&gt;\n&lt;h2 id=\"sholu\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу&lt;/span&gt;&lt;/a&gt;Шолу&lt;/h2&gt;\n&lt;p&gt;Нейроғылым (нейробиология) — бұл жүйке жүйесінің құрылысын, дамуын, генетикасын, биохимиясын, физиологиясын және патологиясын зерттейтін пәнаралық ғылым саласы. Ол қарапайым биологиялық құрылымдардың қабылдауды, қозғалысты, эмоционалдық реакцияларды, жады мен ойлауды қалай қалыптастыратынын қарастырады.&lt;/p&gt;\n&lt;p&gt;Бұл бағыттың назарында ұйымдасудың барлық деңгейлеріндегі үдерістер тұр: жекелеген молекулалар мен гендерден бастап, нейрондық желілер мен ағзаның тұтас мінез-құлқына дейін. Аталған тетіктерді түсіну іргелі ғылым үшін де, нейродегенеративті және генетикалық ауруларды емдеу әдістерін жасау үшін де аса маңызды.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Жүйке жүйесі мамандандырылған жасушалар — нейрондар мен глиоциттер негізінде қызмет етеді. Нейрондар қозғыштық қасиетке ие, олар электрлік импульстер тудырып, химиялық медиаторлар немесе электрлік сигналдар арқылы синапстар арқылы ақпарат тасымалдайды.&lt;/p&gt;\n&lt;p&gt;Нейроғылым бірнеше іргелі қағидаларға сүйенеді:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Иерархиялық құрылым: молекулалық өзара әрекеттесулер иондық өзектер мен синапстардың жұмысын анықтайды, синапстар микрожүйелерді құрайды, ал жергілікті желілер қыртыс пен қыртысасты орталықтарының ауқымды жолдарына бірігеді.&lt;/li&gt;\n&lt;li&gt;Нейропластикалық: синапстық байланыстар мен жүйке контурларының сыртқы тәжірибе, күйзеліс, оқу немесе зақымданулар әсерінен қайта құрылу қабілеті.&lt;/li&gt;\n&lt;li&gt;Интеграция және мамандану: мидың әртүрлі бөліктері нақты функцияларға жауап береді, бірақ күрделі когнитивті процестер таралған желілердің үйлесімді жұмысы арқылы жүзеге асады.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Нейроғылым жүйке жүйесінің ауруларын клиникалық диагностикалау мен емдеуге бағытталған неврологиямен, сондай-ақ жоғары жүйке қызметінің эволюциялық аспектілерін зерттейтін жануарлардың мінез-құлқы мен танымы туралы ғылымдармен тығыз байланысты.&lt;/p&gt;\n&lt;h2 id=\"bul-khalaj-zhumys-istejdi\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#bul-khalaj-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қалай жұмыс істейді&lt;/span&gt;&lt;/a&gt;Бұл қалай жұмыс істейді&lt;/h2&gt;\n&lt;p&gt;Мидың құрылымдық негізін өзара байланысқан функционалдық блоктар құрайды:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Нейрондар және синапстар. Жасушалар кіріс сигналдарды дендриттер арқылы қабылдайды, оларды жасуша денесінде жинақтап, әрекет потенциалын аксон арқылы береді. Синапстық беріліс ақуыздар, рецепторлар және везикулалық тасымал арқылы реттеледі.&lt;/li&gt;\n&lt;li&gt;Глиальды орта. Астроциттер, олигодендроциттер және микроглия гомеостазды сақтайды, миелинді қабықтар түзеді, тіндерді қорғауға және жасушалық қалдықтарды жоюға қатысады.&lt;/li&gt;\n&lt;li&gt;Сенсорлық және эмоционалдық контурлар. Мысалы, бадамша тәрізді дене қауіп деңгейін бағалап, қорқыныш реакциясын тудырады, ал префронтальды қыртыс жоғарыдан төмен қарай бақылау жасап, мінез-құлықты реттейді.&lt;/li&gt;\n&lt;li&gt;Жады және қабылдау жүйелері. Медиальды самай желісі мен гиппокамп визуалды бөлшектерді кодтайды, қысқа мерзімді тәжірибені ұзақ мерзімді жады іздеріне айналдырады және бейнелерді қайта жаңғыртуды қамтамасыз етеді.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Жүйке жүйесін зерттеу үшін әртүрлі масштабтағы тәсілдер қолданылады:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Молекулалық-генетикалық әдістер: гендер экспрессиясын талдау, РНҚ секвенирлеу және вирустық векторлар арқылы емдік құрылымдарды жеткізетін гендік терапия.&lt;/li&gt;\n&lt;li&gt;Жасушалық модельдер: даму бұзылыстарын зерттеу үшін пациенттердің дің жасушаларынан органоидтарды («шағын ми») өсіру.&lt;/li&gt;\n&lt;li&gt;Нейровизуализация және электрофизиология: функционалдық МРТ, жасушалардың электрлік белсенділігін тіркеу және жүйке желілерін көзбен көрудің оптикалық әдістері.&lt;/li&gt;\n&lt;li&gt;Есептеуіш талдау: ми белсенділігін шифрдан шығару және көру жадының үлгілерін зерттеу үшін жасанды нейрондық желілерді қолдану.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khajda-kholdanylady\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#khajda-kholdanylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда қолданылады&lt;/span&gt;&lt;/a&gt;Қайда қолданылады&lt;/h2&gt;\n&lt;p&gt;Нейроғылым әдістері биомедицинада, фармакологияда, нейропротездеуде және когнитивтік зерттеулерде пайдаланылады.&lt;/p&gt;\n&lt;p&gt;Қолданбалы зерттеулерде ғалымдар нақты патологиялық тетіктерді ашуда. «Почему при болезни Гоше возникают судороги: ответ скрыт в развитии мозга» жұмысында өсірілген органоидтар аурудың ерте кезеңдерін бақылауға көмектесті. «Как мозг воспроизводит кадры личных воспоминаний» мақаласында есептеу модельдері медиальды самай желісінің рөлін дәлелдеуге мүмкіндік берді. Ал «Генная терапия остановила развитие редкого синдрома у мышей» зерттеуінде молекулалық деңгейдегі араласу нейрондардың өлімін тоқтатты.&lt;/p&gt;\n&lt;h2 id=\"shekteuler-men-eskeretin-zhajttar\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#shekteuler-men-eskeretin-zhajttar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен ескеретін жайттар&lt;/span&gt;&lt;/a&gt;Шектеулер мен ескеретін жайттар&lt;/h2&gt;\n&lt;p&gt;Технологиялық жетістіктерге қарамастан, нейроғылым елеулі қиындықтармен бетпе-бет келеді. Жануарлар модельдері мен жасушалық органоидтар ересек адам миының барлық күрделілігін толық көтере алмайды. Иммундық жасушалардың компенсаторлық реакциялары аурудың бастапқы сатысын бүркемелеуі мүмкін, ал уытты ақуыздардың везикулалар арқылы таралуы секілді каскадты процестерді сау тіндерге зақым келтірмей бөгеу қиынға соғады.&lt;/p&gt;\n&lt;p&gt;Сонымен қатар, жеке ерекшеліктер де бар: ми қыртысы аймақтары арасындағы байланыстардың ерекшелігі бейнелерді ойша елестете алмау сияқты қабылдаудың өзгеше формаларына әкелуі мүмкін, сондықтан тәжірибелік мәліметтерді жалпылау барысында аса сақ болу талап етіледі.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Сызба: Нейронаука&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9C%D0%BE%D0%BB%D0%B5%D0%BA%D1%83%D0%BB%D1%8B%20%D0%B8%20%D0%B3%D0%B5%D0%BD%D1%8B%5D%20--%3E%20B%5B%D0%98%D0%BE%D0%BD%D0%BD%D1%8B%D0%B5%20%D0%BA%D0%B0%D0%BD%D0%B0%D0%BB%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BD%D0%B0%D0%BF%D1%81%D1%8B%5D%0A%20%20B%20--%3E%20C%5B%D0%9D%D0%B5%D0%B9%D1%80%D0%BE%D0%BD%D1%8B%20%D0%B8%20%D0%B3%D0%BB%D0%B8%D0%B0%D0%BB%D1%8C%D0%BD%D1%8B%D0%B5%20%D0%BA%D0%BB%D0%B5%D1%82%D0%BA%D0%B8%5D%0A%20%20C%20--%3E%20D%5B%D0%9B%D0%BE%D0%BA%D0%B0%D0%BB%D1%8C%D0%BD%D1%8B%D0%B5%20%D0%BC%D0%B8%D0%BA%D1%80%D0%BE%D1%81%D0%B5%D1%82%D0%B8%5D%0A%20%20D%20--%3E%20E%5B%D0%A4%D1%83%D0%BD%D0%BA%D1%86%D0%B8%D0%BE%D0%BD%D0%B0%D0%BB%D1%8C%D0%BD%D1%8B%D0%B5%20%D0%BE%D1%82%D0%B4%D0%B5%D0%BB%D1%8B%20%D0%BC%D0%BE%D0%B7%D0%B3%D0%B0%5D%0A%20%20E%20--%3E%20F%5B%D0%9F%D0%BE%D0%B2%D0%B5%D0%B4%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%BA%D0%BE%D0%B3%D0%BD%D0%B8%D1%82%D0%B8%D0%B2%D0%BD%D1%8B%D0%B5%20%D1%84%D1%83%D0%BD%D0%BA%D1%86%D0%B8%D0%B8%20%D0%B8%20%D0%BF%D0%B0%D0%BC%D1%8F%D1%82%D1%8C%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bajlanysty-ughymdar\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#bajlanysty-ughymdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты ұғымдар&lt;/span&gt;&lt;/a&gt;Байланысты ұғымдар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-brain.html\"&gt;Ми және жүйке жүйесі&lt;/a&gt; — неврология; нейронаука; поведение и познание животных&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-neurology.html\"&gt;Неврология&lt;/a&gt; — болезни нервной системы: инсульт, эпилепсия, нейродегенерация&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-animal_behavior_and_cognition.html\"&gt;Поведение и познание животных&lt;/a&gt; — обучение, решения и общение у животных&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khaj-zherde-kezdesedi\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#khaj-zherde-kezdesedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде кездеседі&lt;/span&gt;&lt;/a&gt;Қай жерде кездеседі&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html\"&gt;Гоше ауруы кезінде ми неге құрысуға бейім болады&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut.html\"&gt;Мидың жеке естеліктерді қалай бейнелейтіні анықталды&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html\"&gt;Бала кездегі стресс миды қалай өзгертеді&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html\"&gt;Гендік терапия тышқандардағы сирек синдромның алдын алды&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html\"&gt;Альцгеймер кезінде мидың иммундық жасушалары неге шаршайды&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html\"&gt;Ми аурулары кезіндегі ақуыз ақауы жаңа сақиналы РНК түзілуін туындайды&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html\"&gt;Альцгеймер кезіндегі жасушааралық зақымдану қалай таралады&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html\"&gt;Афантазия: ми адамдары неге бейнелей алмайды?&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html\"&gt;Ми визуалды қыртыстың терең қабаттарында шындықты кейіннен жинақтайды&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html\"&gt;Ми қарапайым түсіндірмелерді қалай таңдайды&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html\"&gt;Ми танысты жаңадан қалай ажыратады: жадтың жасушалық коды табылды&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html\"&gt;Ми нейрондары әлеуметтік ережелерді қалай өңдейді&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html\"&gt;Жасырын сақина тәрізді РНК молекулалары қауіпті нейродегенеративті ауруды көрсетеді&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html\"&gt;Миымыз түсініксіз өнерді қалай ләззатқа айналдырады&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html\"&gt;Үзілісті ұйқы мидағы эпилепсиялық дүмпулерді қалай қоздырады&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html\"&gt;Тұмау мида із қалдырады: LRRK2 мутациясы ақуыз өзгерістерін қалай қоздырады&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html\"&gt;Альцгеймер ауруын зерттеуге арналған адам гиппокампының жасушалық картасы&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Анықтамалықта: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"concepts/proc-neuroscience.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9D%D0%B5%D0%B9%D1%80%D0%BE%D0%B1%D0%B8%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Нейробиология — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"как устроены нейроны, сети мозга и память"}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Нейронаука","description":"как устроены нейроны, сети мозга и память","vcsPath":"concepts/proc-neuroscience.md"},"headings":[{"title":"Анықтама","href":"concepts/proc-neuroscience.html#anykhtama","level":2},{"title":"Шолу","href":"concepts/proc-neuroscience.html#sholu","level":2},{"title":"Теория","href":"concepts/proc-neuroscience.html#teoriya","level":2},{"title":"Бұл қалай жұмыс істейді","href":"concepts/proc
