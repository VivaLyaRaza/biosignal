        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;21 мақала&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/optical-microscopy-predictions-of-focal-recurrence-in-gliobl.html\"&gt;Оптикалық микроскопия мен жасанды интеллект глиобластоманың қайталануын болжайды&lt;/a&gt; — Жаңа алгоритм ота кезінде алынған тіндерді талдап, ісіктің қайта өсу қаупі жоғары аймақтарын дәл көрсетеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html\"&gt;АКТВ, туберкулез бен малярияны бірге анықтайтын CRISPR-тест жасалды&lt;/a&gt; — Ғалымдар АКТВ, туберкулез, малярия және антибиотикке төзімділікті бір мезетте анықтайтын тестілеу жүйесін ұсынды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html\"&gt;Гоше ауруы кезінде ми неге құрысуға бейім болады&lt;/a&gt; — Ғалымдар науқастардың жасушаларынан «мини-ми» өсіріп, сирек генетикалық аурудың нейрондарға әсерін анықтады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/eggerthella-lenta-disrupts-the-gut-vascular-barrier-to-drive.html\"&gt;Ішектегі бактерия тоқ ішек қатерлі ісігінің бауырға метастаз беруіне ықпал етеді&lt;/a&gt; — Микробтар ішектің қан тамырлар тосқауылын бұзып, ісік жасушаларының қанға өтуіне жол ашады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html\"&gt;SpiraMed: миға дәрі-дәрмекті жеткізудің жаңа спиральді әдісі&lt;/a&gt; — Инженерлер миға жасушалық және гендік терапияны бір тесік арқылы енгізуге мүмкіндік беретін иілгіш катетер ойлап тапты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/single-cell-atlas-of-transcriptomic-vulnerability-across-bra.html\"&gt;Ми миының осалдық картасы: аурулар жасушаларды қалай өзгертеді&lt;/a&gt; — Ғалымдар Альцгеймер, Паркинсон және шизофрения ауруларының жасушалық деңгейдегі ортақ белгілерін түсіну үшін мидың ауқымды атласын жасады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html\"&gt;Жасанды интеллект және көмір: электр станцияларының жабылуын кейінге қалдыру өлім-жітімді арттырады&lt;/a&gt; — Деректер орталықтары үшін электр энергиясына сұраныстың артуы көмір станцияларының өмірін ұзартып, адамдардың денсаулығына қауіп төндіруде.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html\"&gt;Иммундық жасушалар бауырдың майлануын қалай қоздырады&lt;/a&gt; — Әдетте инфекциялардан қорғайтын нейтрофилдер стеатогепатиттің дамуына себепкер болуы мүмкін.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut.html\"&gt;Мидың жеке естеліктерді қалай бейнелейтіні анықталды&lt;/a&gt; — Нейрожелілер арқылы дефолт-жүйенің медиальды самай бөлігі естеліктердің визуалды бейнесін сақтайтыны дәлелденді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html\"&gt;Иммунитеттің жасырын қаруы: реттеуші Т-жасушалар қатерлі ісікпен қалай күреседі&lt;/a&gt; — Әдетте олар иммундық жауапты тежейді, бірақ дәрі-дәрмек әсерінен бұл жасушалар ісікті жоятын белсенді жауынгерге айналады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a.html\"&gt;Диабет және АЖБ: зейін тапшылығы жүрек аурулары қаупіне қалай әсер етеді&lt;/a&gt; — Жеті елде жүргізілген ауқымды зерттеу 2-типті диабетпен ауыратын науқастарда АЖБ денсаулық болжамын қалай өзгертетінін көрсетті.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/a-serum-thyroid-hormone-metabolite-test-for-molecular-diagno.html\"&gt;Қалқанша без обырын анықтаудың жаңа әдісі: қан анализі&lt;/a&gt; — Ғалымдар қалқанша без түйіндерін биопсиясыз тексеруге мүмкіндік беретін гормон метаболиттеріне негізделген тест әзірледі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html\"&gt;Иммунитеттің ерте қартаюы: KRAS ақуызы жүрек ауруларына қалай әсер етеді&lt;/a&gt; — Ғалымдар иммундық жасушалардың ерте қартаюы мен ерте атеросклероз арасындағы молекулалық байланысты анықтады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html\"&gt;Ақуыз құрылымын жүздеген есе аз деректермен қалай көруге болады&lt;/a&gt; — Fold'EM алгоритмі ақуыз модельдерін жеке суреттер арқылы қалпына келтіруге мүмкіндік береді, бұл күрделі 3D карталарды қажет етпейді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html\"&gt;Неліктен кейбір адамдар сепсиске қарсы тұра алмайды: жауап сирек популяциялардың генінде жатыр&lt;/a&gt; — Генетиктер Катар тұрғындарынан қауіпті қабынуды дер кезінде тоқтатуға кедергі келтіретін сирек мутацияны анықтады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/a-designed-ubiquitin-binding-protein-selectively-enriches-an.html\"&gt;Еркін убиквитин: ғалымдар жасушадағы «көрінбейтін» реттегішті бақылауды үйренді&lt;/a&gt; — Жаңа UBiP10 ақуыздық зонды еркін убиквитинді анықтауға және оның жасуша өміріндегі рөлін зерттеуге мүмкіндік береді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html\"&gt;Жүректегі ортақ артериялық дің: қан ағымы қалай жүреді?&lt;/a&gt; — Ғалымдар жүректің сирек кездесетін ақауының цифрлық моделін жасап, қанның араласуы мен клапандардың жұмысын талдады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html\"&gt;Нейрожелілер биологиялық деректер базасындағы хаосты реттей ала ма&lt;/a&gt; — Миллиондаған зертханалық тәжірибелер дұрыс сипатталмаған. Зерттеушілер жасанды интеллект бұл мәселені шеше алатынын тексерді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/drought-spec-net-early-tomato-drought-detection-and-potentia.html\"&gt;Нейрожелі қызанақтың су тапшылығын солып қалмай тұрып қалай анықтайды&lt;/a&gt; — Жаңа Drought-Spec-Net моделі жапырақтан шағылысқан жарық спектрін талдап, өсімдік солып қалғанға дейін стрессті анықтайды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html\"&gt;ДНК конструкторындағы бір бөлшек гендік терапияға арналған дәрілердің өндірісін қалай бұзады&lt;/a&gt; — Ғалымдар вирустық векторлар дайындамасындағы генетикалық ақаудың себебін тауып, оны түзетудің жолын ойлап тапты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html\"&gt;Қызыл иек ауруы мен артрит: ортақ генетикалық код&lt;/a&gt; — Ғалымдар пародонтит пен жүйелі ювенильді артритті байланыстыратын ортақ гендерді анықтады.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"21 мақала"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Апта 2026-10-01 — 2026-10-03","description":"21 мақала","vcsPath":"articles/collections/week-2026-w40.md"},"headings":[],"title":"Апта 2026-10-01 — 2026-10-03"},"router":{"pathname":"articles/collections/week-2026-w40","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
