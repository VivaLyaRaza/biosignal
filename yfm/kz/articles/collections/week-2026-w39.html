            {"data":{"leading":false,"html":"&lt;p&gt;30 мақала&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html\"&gt;Бала кездегі стресс миды қалай өзгертеді&lt;/a&gt; — Ерте жастағы стресс префронтальды қыртыс пен бадамша дене нейрондарының жұмысын өзгертіп, жасөспірімдерде қауіптен қашуды күшейтеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun.html\"&gt;AKAP11 геніндегі сирек мутация мазасыздық пен депрессияны қалай туындайды&lt;/a&gt; — Ғалымдар адам мутациясы бар тышқан моделін жасап, генетикалық ақау нейрондар жұмысын қалай бұзатынын көрсетті.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html\"&gt;Әйел ағзасы миды аутизмнен қалай қорғайды&lt;/a&gt; — Ғалымдар қыздарда аутизм неге сирек кездесетінін түсіндірді: мәселе жыныстық хромосомалардың қорғаныш рөлінде.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html\"&gt;Гендік терапия тышқандардағы сирек синдромның алдын алды&lt;/a&gt; — Өмірінің алғашқы күндеріндегі вирустық вектор инъекциясы нейрондардың өлімі мен қимыл үйлесімінің бұзылуын тоқтатты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html\"&gt;Ми танысты жаңадан қалай ажыратады: жадтың жасушалық коды табылды&lt;/a&gt; — Ғалымдар алғаш рет адам миындағы ұқсас естеліктерді бөлектейтін жеке нейрондардың жұмысын тіркеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html\"&gt;Ми нейрондары әлеуметтік ережелерді қалай өңдейді&lt;/a&gt; — Ғалымдар әлеуметтік нормаларды бағалау кезінде мидың жекелеген нейрондарының жұмысын алғаш рет тіркеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html\"&gt;Альцгеймер кезінде мидың иммундық жасушалары неге шаршайды&lt;/a&gt; — Мидың қорғаушылары амилоидпен күресіп, ауру асқынған сайын әлсірейді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html\"&gt;Жасырын сақина тәрізді РНК молекулалары қауіпті нейродегенеративті ауруды көрсетеді&lt;/a&gt; — Мидағы маңызды ақуыздың бұзылуы аномальді сақина тәрізді РНК-лардың жиналуын бастайды, бұл ерте диагностикаға жол ашады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html\"&gt;Миымыз түсініксіз өнерді қалай ләззатқа айналдырады&lt;/a&gt; — Ғалымдар қызығушылықтан бастап кенеттен түсіну мен қуанышқа дейінгі жолды қадағалады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html\"&gt;CRISPR көмегімен мРНК тасымалдауды бағыттау әдісі&lt;/a&gt; — Ғалымдар молекулалық бағыттарды өзгертіп, ісік жасушаларының миграциясын тежеу жолын тапты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html\"&gt;Ми аурулары кезіндегі ақуыз ақауы жаңа сақиналы РНК түзілуін туындайды&lt;/a&gt; — TDP-43 ақуызының тапшылығы нейрондарда ерекше жасырын сақиналы РНК молекулаларының пайда болуына әкелетіні анықталды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html\"&gt;Инфаркттен кейін жүрек бауыр арқылы қанды қалай басқарады&lt;/a&gt; — Ғалымдар инфарктен кейін тромбоциттер деңгейін қалпына келтіруге көмектесетін жүрек пен бауыр арасындағы байланысты тапты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html\"&gt;Ақуыздарды жобалауды жылдамдататын жасанды интеллект жүйесі&lt;/a&gt; — Жасанды интеллект жаңа молекулаларды жасау кезінде есептеу ресурстарын тиімді бөлуді үйренді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html\"&gt;Ракты емдеу кезінде иммунитетті қалай қалпына келтіруге болады&lt;/a&gt; — Жаңа тәсіл онкология терапиясы кезінде Т-жасушалардың шаршап қалуына жол бермейді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html\"&gt;Гормондар аутизм және мидың дамуы гендеріне қалай әсер етеді&lt;/a&gt; — Ғалымдар эстрадиолдың аутизммен және ми дамуының бұзылуымен байланысты 36 генге әсерін зерттеп көрді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html\"&gt;Қауіпті амебаны анықтайтын жаңа жылдам тест әдісі&lt;/a&gt; — Сирек кездесетін қауіпті амебаны кәдімгі клиникаларда тез анықтауға мүмкіндік беретін алғашқы экспресс-тест жасалды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html\"&gt;Ғалымдар кодтаушы сақиналы РНК-лардың бар екенін алғаш рет дәлелдеді&lt;/a&gt; — Ғалымдар зертханада ДНК-сыз өмір сүретін және ақуыз кодтайтын жұмбақ сақиналы РНК бар екенін дәлелдеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html\"&gt;Альцгеймер кезіндегі жасушааралық зақымдану қалай таралады&lt;/a&gt; — Токсикалық ақуыздар көпіршіктер арқылы жасушадан жасушаға беріліп, нейрондарды зақымдайды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html\"&gt;Афантазия: ми адамдары неге бейнелей алмайды?&lt;/a&gt; — Ғалымдар саналы түрде елестете алмайтын адамдардың ми құрылымындағы ерекшеліктерді тапты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html\"&gt;Үзілісті ұйқы мидағы эпилепсиялық дүмпулерді қалай қоздырады&lt;/a&gt; — Ұйқы кезіндегі микрооянулардың ұстама ауқымын кеңейтпей, нейрон белсенділігін неліктен арттыратыны анықталды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html\"&gt;Есептеу мен жадты біріктіретін жаңа буын мемристорлы чиптері&lt;/a&gt; — Мемристорларға негізделген жаңа архитектура матрицалық есептеулерді бірнеше есе жылдамдатады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html\"&gt;Plscr1 ақуызы тышқан норовирусының енуін тежейді&lt;/a&gt; — Ғалымдар норовирустың жасушаға енуіне жол бермейтін маңызды жасушалық ақуызды тапты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html\"&gt;Егеуқұйрықтар қара аққулардан қалай қашып, джекпот іздейді&lt;/a&gt; — Сирек әрі қауіпті оқиғалар жануарлардың таңдауына күнделікті рутинадан да қатты әсер етеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html\"&gt;Тұмау мида із қалдырады: LRRK2 мутациясы ақуыз өзгерістерін қалай қоздырады&lt;/a&gt; — Бұрын өткерген тұмау LRRK2 мутациясы бар ағзада нейродегенерацияның алғашқы кезеңдеріне ұқсас өзгерістерді тудырады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-25/infants-at-high-and-low-likelihood-for-autism-show-different.html\"&gt;Аутизм қаупі бар сәбилер миы тілді қалай өңдейді&lt;/a&gt; — Ғалымдар аутизмге бейімділігі әртүрлі сәбилердің сөйлеу ағынынан сөздерді қалай ажырататынын анықтады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-25/combination-of-alk2-and-cholesterol-targeting-agents-exploit.html\"&gt;Ми ісігін емдеудің жаңа жолы холестерин алмасуынан табылды&lt;/a&gt; — Ғалымдар холестерин алмасуын тежеу ми глиомасын мақсатты терапияға сезімтал ететінін анықтады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html\"&gt;Ми визуалды қыртыстың терең қабаттарында шындықты кейіннен жинақтайды&lt;/a&gt; — Қазір көріп тұрған нәрсеміз болашақ оқиғаларға байланысты. 7Т МРТ көмегімен жасалған тәжірибе мидың қабылдауды қалай түзететінін көрсетті.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html\"&gt;Альцгеймер ауруын зерттеуге арналған адам гиппокампының жасушалық картасы&lt;/a&gt; — Альцгеймер ауруының зертханалық модельдерін тексеру үшін гиппокамптың толық картасы жасалды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html\"&gt;Ми қарапайым түсіндірмелерді қалай таңдайды&lt;/a&gt; — Адамдар анық емес деректермен жұмыс істегенде Оккам ұстарасын басшылыққа алып, қарапайым гипотезаларды жөн көреді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html\"&gt;Жүрек ауруларының қаупін болжайтын жасанды интеллект жүйесі&lt;/a&gt; — Машиналық оқыту алгоритмдері науқастардың жыныстық ерекшеліктерін ескере отырып, жүрек патологияларын дәл анықтайды.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"30 мақала"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Апта 2026-09-22 — 2026-09-25","description":"30 мақала","vcsPath":"articles/collections/week-2026-w39.md"},"headings":[],"title":"Апта 2026-09-22 — 2026-09-25"},"router":{"pathname":"articles/collections/week-2026-w39","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
