            {"data":{"leading":false,"html":"&lt;p&gt;18 мақала&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html\"&gt;Гоше ауруы кезінде ми неге құрысуға бейім болады&lt;/a&gt; — Ғалымдар науқастардың жасушаларынан «мини-ми» өсіріп, сирек генетикалық аурудың нейрондарға әсерін анықтады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut.html\"&gt;Мидың жеке естеліктерді қалай бейнелейтіні анықталды&lt;/a&gt; — Нейрожелілер арқылы дефолт-жүйенің медиальды самай бөлігі естеліктердің визуалды бейнесін сақтайтыны дәлелденді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html\"&gt;Бала кездегі стресс миды қалай өзгертеді&lt;/a&gt; — Ерте жастағы стресс префронтальды қыртыс пен бадамша дене нейрондарының жұмысын өзгертіп, жасөспірімдерде қауіптен қашуды күшейтеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html\"&gt;Гендік терапия тышқандардағы сирек синдромның алдын алды&lt;/a&gt; — Өмірінің алғашқы күндеріндегі вирустық вектор инъекциясы нейрондардың өлімі мен қимыл үйлесімінің бұзылуын тоқтатты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html\"&gt;Альцгеймер кезінде мидың иммундық жасушалары неге шаршайды&lt;/a&gt; — Мидың қорғаушылары амилоидпен күресіп, ауру асқынған сайын әлсірейді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html\"&gt;Ми аурулары кезіндегі ақуыз ақауы жаңа сақиналы РНК түзілуін туындайды&lt;/a&gt; — TDP-43 ақуызының тапшылығы нейрондарда ерекше жасырын сақиналы РНК молекулаларының пайда болуына әкелетіні анықталды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html\"&gt;Альцгеймер кезіндегі жасушааралық зақымдану қалай таралады&lt;/a&gt; — Токсикалық ақуыздар көпіршіктер арқылы жасушадан жасушаға беріліп, нейрондарды зақымдайды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html\"&gt;Афантазия: ми адамдары неге бейнелей алмайды?&lt;/a&gt; — Ғалымдар саналы түрде елестете алмайтын адамдардың ми құрылымындағы ерекшеліктерді тапты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html\"&gt;Ми визуалды қыртыстың терең қабаттарында шындықты кейіннен жинақтайды&lt;/a&gt; — Қазір көріп тұрған нәрсеміз болашақ оқиғаларға байланысты. 7Т МРТ көмегімен жасалған тәжірибе мидың қабылдауды қалай түзететінін көрсетті.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html\"&gt;Ми қарапайым түсіндірмелерді қалай таңдайды&lt;/a&gt; — Адамдар анық емес деректермен жұмыс істегенде Оккам ұстарасын басшылыққа алып, қарапайым гипотезаларды жөн көреді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html\"&gt;Ми танысты жаңадан қалай ажыратады: жадтың жасушалық коды табылды&lt;/a&gt; — Ғалымдар алғаш рет адам миындағы ұқсас естеліктерді бөлектейтін жеке нейрондардың жұмысын тіркеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html\"&gt;Ми нейрондары әлеуметтік ережелерді қалай өңдейді&lt;/a&gt; — Ғалымдар әлеуметтік нормаларды бағалау кезінде мидың жекелеген нейрондарының жұмысын алғаш рет тіркеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html\"&gt;Жасырын сақина тәрізді РНК молекулалары қауіпті нейродегенеративті ауруды көрсетеді&lt;/a&gt; — Мидағы маңызды ақуыздың бұзылуы аномальді сақина тәрізді РНК-лардың жиналуын бастайды, бұл ерте диагностикаға жол ашады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html\"&gt;Миымыз түсініксіз өнерді қалай ләззатқа айналдырады&lt;/a&gt; — Ғалымдар қызығушылықтан бастап кенеттен түсіну мен қуанышқа дейінгі жолды қадағалады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html\"&gt;Үзілісті ұйқы мидағы эпилепсиялық дүмпулерді қалай қоздырады&lt;/a&gt; — Ұйқы кезіндегі микрооянулардың ұстама ауқымын кеңейтпей, нейрон белсенділігін неліктен арттыратыны анықталды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html\"&gt;Егеуқұйрықтар қара аққулардан қалай қашып, джекпот іздейді&lt;/a&gt; — Сирек әрі қауіпті оқиғалар жануарлардың таңдауына күнделікті рутинадан да қатты әсер етеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html\"&gt;Тұмау мида із қалдырады: LRRK2 мутациясы ақуыз өзгерістерін қалай қоздырады&lt;/a&gt; — Бұрын өткерген тұмау LRRK2 мутациясы бар ағзада нейродегенерацияның алғашқы кезеңдеріне ұқсас өзгерістерді тудырады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html\"&gt;Альцгеймер ауруын зерттеуге арналған адам гиппокампының жасушалық картасы&lt;/a&gt; — Ғалымдар гиппокамп дамуының егжей-тегжейлі картасын жасап, Альцгеймер ауруы кезіндегі ақаулардың қайдан басталатынын анықтады.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"18 мақала"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Ми және жүйке жүйесі","description":"18 мақала","vcsPath":"articles/collections/topic-brain.md"},"headings":[],"title":"Ми және жүйке жүйесі"},"router":{"pathname":"articles/collections/topic-brain","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
