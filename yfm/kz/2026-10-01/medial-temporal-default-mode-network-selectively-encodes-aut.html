            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"263\" cy=\"171\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"577\" cy=\"179\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Мидың жеке естеліктерді&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;қалай бейнелейтіні анықталды&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Өткен күндерді еске алғанда көз алдымызға бұлыңғыр болса да нақты суреттер мен көріністер келеді. Ғалымдар ми оқиғаның тек мағынасын емес, дәл сол визуалды бейнесін қалай қайта құратынын нейрожелілер көмегімен зерттеді. Еріктілердің сипаттамасы бойынша жасанды интеллект салған суреттер ми белсенділігінің үлгілерімен сәйкестендірілді. Нәтижесінде автобиографиялық көрнекі бейнелерге мидың белгілі бір ішкі желісі ғана жауап беретіні белгілі болды.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/medial-temporal-default-mode-network.html\"&gt;MT-DMN&lt;/a&gt; торабы жеке естеліктердің көрнекі құрылымын арнайы кодтайды&lt;/li&gt;\n&lt;li&gt;Нәтиже GPT-2 көмегімен абстрактілі мәтін мағынасы шегерілгенде де сақталды&lt;/li&gt;\n&lt;li&gt;Басқа 16 ми желісінде және пассивті мәтін оқуда бұл визуалды код байқалмады&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеуге 50 ересек адам (24 ± 3 жастағы 25 жас және 73 ± 7 жастағы 25 қарт адам) қатысты. Томографияға дейін қатысушылар «үйлену тойы» немесе «жаттығу» сияқты жалпылама түрткілер бойынша өз өмірлеріндегі 20 оқиғаны елестетіп, қысқаша мәтіндік сипаттама берді. Бұл мәтіндер негізінде &lt;a href=\"concepts/stable-diffusion.html\"&gt;Stable Diffusion 2.1&lt;/a&gt; моделі әр жағдайға 5 синтетикалық сурет жасап шығарды, ал &lt;a href=\"concepts/vgg-16.html\"&gt;VGG-16&lt;/a&gt; конволюциялық желісінің FC8 қабатынан 1000 өлшемді белсендіру векторлары алынып, визуалды модельге айналдырылды.&lt;/p&gt;\n&lt;p&gt;Функционалдық МРТ кезінде қатысушылар осы оқиғаларды сөйлемей, тек іштей қайта елестетті. Ұқсастықты репрезентациялық талдау (&lt;a href=\"concepts/representational-similarity-analysis.html\"&gt;RSA&lt;/a&gt;) және GPT-2 тілдік моделі арқылы вербалды мағынаны бақылау нәтижесінде, жеке визуалды құрылым тек дефолт-жүйенің медиальды самай ішкі торабында (MT-DMN: парагиппокамп, ретросплениальды және латеральды төбе қыртысы) ғана кодталатыны анықталды. Бұл визуалды әсер қалған 16 функционалдық желіде де, белсенді қиялсыз жай ғана мәтін оқу кезінде де тіркелген жоқ.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Синтетикалық суреттер қысқа сипаттамалар негізінде ЖИ арқылы жасалғандықтан, олар адамның ішкі бейнесін толық дәлдікпен көрсетпеуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Адам миы естелік бойынша визуалды көріністерді қайта құрастырып, орындардың, адамдардың және заттардың сыртқы түрін, тіпті бұл ойша бейнелер бұлыңғыр болса да, синтездейді [1]. Әдепкі режим желісінің медиальды самайлық кіші жүйесі (MT-DMN), оның ішінде парагиппокампальды, ретроспленальды және латеральды төбелік қыртыстар, мұндай қиялды қолдайды деп саналады, өйткені ол жады, қиял және кеңістіктік өңдеуді қамтитын тапсырмалар кезінде белсендіріледі [2–4]. Алайда, MT-DMN ішінде визуалды көріністердің реконструкциясын кодтайтын нейрондық кодтар белгісіз күйінде қалуда. Бұл кодтарды анықтау жеке адамдар елестететін идиосинкразиялық көріністердің репрезентативті моделін талап етеді, бұл күрделі міндет, оны визуалды компоненттерді аффект, диалог және әлеуметтік маңыздылық сияқты визуалды емес компоненттерден ажырату қажеттілігі одан әрі қиындатады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу MT-DMN-дегі нейрондық корреляттарды анықтау үшін елестетілген көріністердің визуалды және семантикалық компоненттерін модельдеу үшін заманауи AI модельдерін (Stable Diffusion және GPT-2) пайдаланады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мұнда біз бұл мәселелерді ауызша сипаттамалардан елестетілген көріністерді модельдеу үшін ең заманауи жасанды интеллект (AI) «мәтіннен кескінге» моделін [Stable Diffusion; 5, 6] және ілеспе визуалды емес семантикалық мазмұнды қамту үшін үлкен тіл моделімен [7, 8] біріктіру арқылы шешеміз. Бұл тәсіл өздігінен пайда болатын, қатысушыға тән визуалды бейнелердің нейрондық корреляттарын сипаттауға және олардың MT-DMN-ге тән екендігін бағалауға мүмкіндік береді. Өздігінен пайда болатын психикалық күйлер мен DMN бойынша ауқымды зерттеулерге қарамастан [9–12], іштей пайда болатын визуалды көрініс симуляцияларын көрсететін нейрондық репрезентацияларды бөліп алу әдістері шектеулі болды.&lt;/p&gt;\n&lt;p&gt;Субъективті психикалық бейнелер әдетте тәжірибе таңдау әдісі арқылы зерттелген, мұнда қатысушылар өздерінің ағымдағы ойларының визуалды немесе ауызша түрде екенін хабарлайды [13–16]. Алайда, мұндай өрескел өзіндік есептер адамдар елестететін әртүрлі визуалды көріністерді ажырата алмайды. Сол сияқты, эпизодтық еске алу және проспекцияны зерттеу жеке оқиғалармен байланысты нейрондық репрезентацияларды [17–20], олардың кеңістіктік немесе уақытша контекстін [21, 22], сондай-ақ олар қамтитын адамдарды немесе заттарды [23–28] сәтті ажыратқанымен, олар елестетілген көріністерді анықтайтын идиосинкразиялық визуалды бөлшектердің нейрондық корреляттарын анықтамады. Керісінше, жануарлар, құралдар, адамдар және ғимараттар сияқты жеке нысандар үшін психикалық бейнелердің нейро-есептеу сипаттамалары салыстырмалы түрде жақсы дамыған [1, 29].&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RSA (Representational Similarity Analysis) — бұл ми белсенділігінің өрнектері мен есептеу модельдері (мысалы, AI модельдері) арасындағы ұқсастық құрылымын салыстыратын fMRI деректерін талдау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Визуалды нысандарды қабылдауды модельдеудегі алғашқы жетістіктерден кейін [30–34] компьютерлік көру жүйелерін қолдана отырып [мысалы, 35, 36], ұқсас тәсілдер алдын ала қаралған нысан кескіндерінің психикалық бейнелерін [33, 37] және нысан зат есімдерін [38, 39] модельдеу үшін кеңейтілді. Қиял мен қабылдау бойынша жалпы қорытынды — нысандарды тану үшін орталық болып табылатын вентральды визуалды жол бойындағы белсендіру өрнектері [40, 41] есептеу нысандарын тану модельдерінен алынған кескін репрезентацияларымен корреляцияланады [32–34, 42, 43]. Бұл репрезентациялар нысандар, жануарлар, көрікті жерлер және басқа нысандар сияқты семантикалық санаттардың жоғары деңгейлі визуалды корреляттарын көрсетеді, олар позицияның, көру нүктесінің және жарықтың төмен деңгейлі өзгерістерінен абстракцияланады.&lt;/p&gt;\n&lt;p&gt;Айта кету керек, мұндай кескін репрезентациялары MT-DMN-мен қиылысатын көріністерді таңдау салаларында [44] табиғи көріністерді көру кезінде функционалды магнитті-резонанстық томография (fMRI) жауаптарын да болжайды. Бұл салалар көріністер ішіндегі нысан санаттарын [45, 46], көрініс элементтері арасындағы контекстік ассоциацияларды [47–49] және фон текстурасы туралы ақпаратты [50] кодтайды. Нысан контексті мен текстурасына, пішінге емес, кескіндерді тану модельдерінің салыстырмалы сезімталдығы [51–53] оларды көріністерді таңдау қыртысындағы белсенділікті модельдеу үшін тіпті артықшылықты етуі мүмкін. Автобиографиялық тәжірибемен байланысты визуалды бейнелерді модельдеу өзіндік мәселені тудырады, өйткені психикалық бейнелер үшін объективті «ақиқат» жоқ. Кейбір эпизодтық естеліктер фотосуреттермен құжатталғанымен, адамдар еске түсіретін немесе елестететін нәрселер көбінесе әртүрлі оқиғалардан элементтерді араластыру немесе елестетілген бөлшектерді енгізу арқылы шындықтан өзгеше болады [54–58].&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу fMRI деректеріне негізделген, ми белсенділігі мен AI модельдері арасындағы корреляция ми нейрондық желілермен бірдей алгоритмдерді қолданады дегенді білдірмейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Stable Diffusion [5, 6] сияқты «мәтіннен кескінге» AI жүйелеріндегі соңғы жетістіктер қазір қатысушылардың ауызша сипаттамаларынан тікелей кескіндерді жасау арқылы осы ішкі визуализацияларды жақындату әдісін ұсынады. Қазіргі зерттеу бұл тәсілді MT-DMN-дегі белсендіру өрнектері қатысушыға тән (автобиографиялық) визуалды құрылымды таңдап кодтайтынын немесе жоқтығын тексеру және мұндай құрылым басқа ми желілерінде немесе қиял қолданылмаған кезде жоқтығын анықтау үшін пайдаланады. Осылайша, бұл жұмыс қиял мен жадының нейрондық негіздерін түсінуді дамытады және іштей пайда болатын визуалды бейнелерді ажырату үшін AI көмегімен кескін жасауды тиісті тіл моделі негізіндегі нейрондық декодтау тәсілдеріне әдістемелік қосымша ретінде орнатады [мысалы, 59–63].&lt;/p&gt;\n&lt;p&gt;MT-DMN автобиографиялық қиял кезінде қатысушыға тән визуалды құрылымды таңдап кодтайды деген гипотезаны тексеру үшін біз 50 ересек адамнан бұрын жиналған fMRI деректер жиынтығын қайта талдадық [20, 62, 64] (Сурет 1A). Үлгі 25 жас ересектерді (орташа жасы ± SD = 24 ± 3 жыл; 16 әйел және 9 ер адам) және 25 қарт ересектерді (орташа жасы ± SD = 73 ± 7 жыл; 16 әйел және 9 ер адам) қамтыды. Жасына байланысты айырмашылықтар қазіргі зерттеудің назарында болмаса да, талдаулар нәтижелердің жалпылануын анықтау үшін бүкіл топ бойынша да, жас топтары ішінде де жүргізілді.&lt;/p&gt;\n&lt;p&gt;Сурет 1. Автобиографиялық қиял кезінде сканерленген fMRI деректерінде визуалды ақпарат құрылымын анықтау. (A) Сканерлеу алдында қатысушыларға 20 жалпы сценарий-нұсқаулық (мысалы, би, жаттығулар және үйлену тойы) ұсынылды және олардан әр оқиғаны жеке бастан кешіріп жатқанын жарқын елестету сұралды. Содан кейін олар әр елестетілген сценарийді ауызша сипаттап берді. fMRI кезінде қатысушылар жалпы мәтіндік нұсқаулар негізінде кездейсоқ тәртіпте ұсынылған әр сценарийді қайта елестетті. Стандартты алдын ала өңдеуден кейін әр қатысушы үшін әр сценарий бойынша бір fMRI көлемі алынды.&lt;/p&gt;\n&lt;p&gt;Көлемдер Yeo парцелляция схемасына қатысты 17 желіге бөлінді (Сурет SN). Визуалды көрініс құрылымын модельдеу үшін әр қатысушының сипаттамасына негізделе отырып, сценарий үшін бес кескінді синтездеу үшін Stable Diffusion 2.1 [5] қолданылды. Содан кейін кескіндер VGG-16 нысандарды тану желісі арқылы өткізілді [36] және softmax-қа дейінгі соңғы қабаттан (FC8) 1000D белсендіру векторлары шығарылды және әр қатысушы үшін сценарий бойынша бірыңғай репрезентацияны алу үшін бес кескін бойынша орташа есептелді. Бұл векторлар негізгі мәтінде «Визуалды модель» деп аталады және суреттерде камера белгісімен көрсетілген. Визуалды емес семантикалық мазмұнды бақылау үшін әр ауызша сипаттама GPT-2 L16 [7] (кітап белгісі) немесе OpenCLIP [8] жасырын күй белсендіру векторлары көмегімен модельденді. AI көрініс кескіндерін жасау үшін қолданылды, нақты адамдар бейнеленбеген. (B) Ми ішіндегі визуалды репрезентация құрылымын тексеру үшін fMRI өрнектері MT-DMN-нен шығарылды. Ішінара корреляцияға негізделген RSA GPT-2 бақылауымен Визуалды модель арқылы бірегей түрде түсіндірілген дисперсияны бөліп алу үшін қолданылды. MT-DMN-ге тән екендігін тексеру үшін талдау Core-DMN және FT-DMN кіші бөлімдері, сондай-ақ 14 басқа желілер үшін қайталанды (Сурет SN). Қосымша талдауда, Визуалды модельді бақылауда тек GPT-2 арқылы түсіндірілген дисперсияны зерттеу үшін ішінара RSA-да модельдер ауыстырылды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\"
