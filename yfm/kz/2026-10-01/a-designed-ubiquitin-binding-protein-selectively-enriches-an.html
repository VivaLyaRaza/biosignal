        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"90\" cy=\"158\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"530\" cy=\"210\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · BIOENGINEERING   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Еркін убиквитин: ғалымдар&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;жасушадағы «көрінбейтін»&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;реттегішті бақылауды үйренді&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"concepts/ubiquitin.html\"&gt;Убиквитин&lt;/a&gt; — ақуыздардың жұмысын басқаратын шағын молекула, бірақ оның «еркін» түрі ұзақ уақыт бойы ғылым үшін жұмбақ болып келді. Нақты құралдардың жоқтығынан зерттеушілер оның вирустарға қарсы қорғаныста және Альцгеймер мен Паркинсон аурулары кезіндегі рөлін толық түсіне алмады. Енді ғалымдар еркін убиквитинмен таңдамалы түрде байланысатын UBiP10 жасанды ақуызын жасап шығарды. Бұл жаңалық жасушалық реттеу механизмдерін зерттеуге жол ашады.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-01/a-designed-ubiquitin-binding-protein-selectively-enriches-an.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Еркін убиквитинді анықтау үшін жоғары аффинді UBiP10 зонды жасалды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/histone-deacetylase-6.html\"&gt;HDAC6&lt;/a&gt; ZnF доменіндегі V1091L мутациясы байланысу қабілетін айтарлықтай арттырды.&lt;/li&gt;\n&lt;li&gt;UBiP10 агресомалар айналасындағы еркін убиквитин қабатын анықтауға көмектесті.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-01/a-designed-ubiquitin-binding-protein-selectively-enriches-an.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Убиквитин (Ub) — 76 аминқышқылынан тұратын консервативті ақуыз, ол әдетте субстраттармен ковалентті байланысып, оларды протеасомаларда ыдырауға бағыттайды. Алайда, убиквитиннің едәуір бөлігі жасушада бос күйінде болады. Оны анықтаудың дәстүрлі әдістері, мысалы, изопептидаза T (USP5) ферментінің BUZ доменіне негізделген әдістер, төмен аффиндік (&lt;a href=\"concepts/dissotsiatsiya.html\"&gt;диссоциация&lt;/a&gt; константасы Kd ≈ 2,8 мкМ) салдарынан шектеулі болды.&lt;/p&gt;\n&lt;p&gt;Бұл жұмыста зерттеушілер бағытталған эволюция мен ақуыздарды есептеу дизайны әдістерін қолданды. Алдымен HDAC6 ақуызының мырышты саусақ (ZnF) домені V1091L мутациясы арқылы оңтайландырылды, бұл убиквитинмен байланысу күшін арттырды. Содан кейін &lt;a href=\"concepts/rfdiffusion.html\"&gt;RFdiffusion&lt;/a&gt; алгоритмі көмегімен 11 жаңа байланыстырушы ақуыз (UBiP) жобаланды. Олардың ішінде UBiP10 нұсқасы жоғары селективтілік көрсетіп, протеасомалар жұмысы бұзылғанда пайда болатын агресомалар айналасындағы еркін убиквитин қабатын визуализациялауға мүмкіндік берді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу жасушалық модельдер мен лизаттарда жүргізілді; зондтың күрделі тіндердегі ерекшелігін in vivo жағдайында тексеру қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-01/a-designed-ubiquitin-binding-protein-selectively-enriches-an.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Убиквитин (Ub) — бұл көптеген биологиялық процестерді посттрансляциялық модификатор ретінде реттейтін 76 аминқышқыл қалдығынан (8,6 кДа) тұратын кең таралған ақуыз. Ub-тің C-терминалды Gly қалдығын субстрат ақуыздарындағы Lys қалдықтарына қосудың ферментативті процесі ақуыздарды убиквитиндеу деп аталады [1]. Ub басқа Ub молекуласына жалғанған кезде, ол Ub тізбегін түзеді, оны акцепторлық Lys орналасуына қарай, мысалы, K48-байланысқан немесе K63-байланысқан тізбектер және т.б. ретінде жіктеуге болады. Сонымен қатар, Ub жасушада ақуыздарға қосылмаған мономер немесе полимер тізбектер түрінде де кездеседі, олар байланыспаған Ub деп аталады [2, 3]. Ақуыздарды убиквитиндеу, негізінен, Ub протеасома жүйесі (UPS) арқылы ақуыздардың деградациясына жауап беретін болғандықтан, өте егжей-тегжейлі зерттелген, ал байланыспаған Ub әлдеқайда аз зерттелген. Бұл түсініктің жетіспеушілігі негізінен байланыспаған Ub-ті оның ковалентті байланысқан формаларынан ажыратуға арналған құралдардың шектеулілігімен байланысты. Пайда болып жатқан деректер байланыспаған Ub-тің әртүрлі биологиялық жолдарда, мысалы, ие-патоген өзара әрекеттесуінде және ақуыз агрегаттарының өмірлік циклінде өте маңызды екенін көрсетеді.&lt;/p&gt;\n&lt;p&gt;Мысалы, тұмау А вирусы (IAV) инфекциясы кезінде вирус бөлшегі ішіндегі байланыспаған Ub гистондеацетилаза 6 (HDAC6)-ны тартады және вирионның қабығын шешуді жеңілдететін моторлы ақуыздар динеин мен миозинмен кешен түзуге көмектеседі [4]. Вирустық РНҚ цитозолға шыққаннан кейін, K63-байланысқан байланыспаған Ub тізбектері вирустық РНҚ сенсоры — меланома дифференциациясымен байланысты 5-ақуыз (MDA5) — арқылы жасушаның туа біткен иммундық жауабын белсендіреді, нәтижесінде интерферон реттеуші фактор 3 белсенділігін қоздырады және интерферон экспрессиясын ынталандырады [5]. Сонымен қатар, байланыспаған Ub тізбектері агресомалардың протеасома делдалдығымен бөлшектенуіне қатысады [6], олар UPS бұзылған кезде түзілетін убиквитинденген, дұрыс оралмаған ақуыздардың перинуклеарлы агрегаттары болып табылады [7] және Альцгеймер мен Паркинсон ауруы сияқты нейродегенеративті аурулармен байланысты [8]. Алайда, агресомаларда байланыспаған Ub-тің бар екенін көрсететін тікелей дәлелдер жоқ.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Байланыспаған убиквитин иммундық жауап пен агресомалар динамикасында маңызды рөл атқарады, бірақ оны зерттеу құралдары шектеулі, бұл жаңа жоғары аффинді ақуыздарды әзірлеуді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қазіргі уақытта байланыспаған Ub-ті зерттеудің негізгі құралы изоптидаза T (IsoT; немесе USP5) деубиквитиндендіруші ферментінің мырыш саусақ (ZnF) Ub-байланыстырушы доменіне (BUZ домені) негізделген, ол байланыспаған Ub-пен 2,8 мкМ &lt;a href=\"concepts/k-d.html\"&gt;K_d&lt;/a&gt; диссоциация константасымен байланысады [9]. Жасушалардағы байланыспаған Ub-ті сандық анықтау үшін IsoT_BUZ негізіндегі екі әдіс әзірленген: масса-спектрометрия (MS) көмегімен ақуыз стандарттарын абсолютті сандық анықтау [10] және IsoT_BUZ-дан алынған tUI ақуызын фторофорлармен біріктіріп, байланыспаған Ub флуктуацияларын визуализациялау [11]. Алайда, екі әдістің де өз шектеулері бар. IsoT_BUZ доменінің антиденелерге қарағанда төмен аффинділігі байланыспаған Ub-ті аффинді тазартуды тиімсіз етеді, бұл анық емес сандық бағалауға әкеледі, ал tUI-дің жасушалардағы байланыспаған Ub-ті визуализациялау және жасуша лизаттарынан байыту үшін өзіндік ерекшелігі әлі де расталмаған күйде қалуда. Сонымен, байланыспаған Ub-ті ұстау және анықтау үшін тиімдірек құралдарға нақты қажеттілік бар.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;K_d (диссоциация константасы) — байланысу күшінің көрсеткіші: сан неғұрлым кіші болса, байланыс соғұрлым берік болады. RFdiffusion — белгіленген құрылымы бар ақуыздарды жобалауға арналған терең оқыту әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ақуыз дизайнындағы соңғы жетістіктер, әсіресе RFdiffusion [12] сияқты терең оқыту алгоритмдерімен, жақсартылған өзіндік ерекшелігі мен аффинділігі бар ақуыздарды инженериялау үшін жаңа жолдар ашты. Осы зерттеуде біз байланыспаған Ub-ті нысанаға алу үшін жоғары аффинділік пен өзіндік ерекшелікке ие құралды әзірлеуді мақсат еттік, ол үшін байланыспаған Ub-ті байланыстыратын табиғи ақуыз болып табылатын HDAC6-ның ZnF_UBP (бұдан әрі ZnF) доменінен бастадық. Біз осы ZnF доменінің көп өлшемді мутагенезі мен аффинділік жетілуін пайдаланып, байланысу аффинділігі айтарлықтай жақсарған мутантты әзірледік. Біз бұл мутантты RFdiffusion көмегімен de novo жобаланған құрылымдармен және басқа да белгілі Ub-байланыстырушы домендермен біріктіру үшін қосымша модификацияладық. AlphaFold2 [13] көмегімен &lt;a href=\"concepts/virtualnyy-nokaut.html\"&gt;in silico&lt;/a&gt; бағалаудан кейін, біз 11 жаңа Ub-байланыстырушы ақуызды (UBiPs) жобаладық, мұнда UBiP10 байланыспаған Ub-ке қатысты ең селективті болып шықты. Аффинді тазарту құралы ретінде UBiP10 байланыспаған Ub-ті жасуша және IAV лизаттарынан, тіпті көп мөлшердегі убиквитинденген ақуыздар болған кезде де байытты. Біз UBiP10-ды иммунофлуоресцентті микроскопиямен бірге протеасома ингибиторы бортезомиб немесе E1 Ub-белсендіруші фермент ингибиторы TAK-243-пен өңдегеннен кейін жасушалардағы байланыспаған Ub деңгейіндегі флуктуацияларды анықтау және визуализациялау үшін пайдаландық. Сонымен қатар, UBiP10 бізге протеасома ингибициясы нәтижесінде туындаған агресомалардың түзілуі кезінде байланыспаған Ub локализациясын зерттеуге мүмкіндік берді: біз байланыспаған Ub агресомалар түзілуі кезінде жасуша ядросының айналасында жиналатынын және жетілген агресома айналасында қабық түзетінін анықтадық. Сонымен, UBiP10 жасушалық реттеуде байланыспаған Ub-ті зерттеу үшін жаңа және қуатты құрал болып табылады.&lt;/p&gt;\n&lt;p&gt;Байланыспаған Ub байланыспаған C-терминалды (-LRLRGG) (1A-сурет) болуымен сипатталады, бұл антиденелерді өндіру немесе de novo ақуыз байланыстырушы агенттерді жобалау үшін қажетті эпитоптары жоқ қысқа, құрылымдалмаған мотив. HDAC6 ZnF домені байланыспаған Ub-ті байланыстыратын табиғи мотив болып табылады. Кристалл құрылымы R1155/Y1156 және W1182 қақпашы қалдықтары сәйкесінше байланыспаған Ub-ке қатысты өзіндік ерекшелік пен аффинділікті белгілейтінін көрсетеді [14] (SN-сурет). Байланыспаған Ub-тің құрылымдық қарапайымдылығы мен эпитоптық шектеулері оны өзіндік антиденелерді әзірлеу үшін өте қиын нысанаға айналдырады; сондықтан біз жаңа құралды әзірлеу үшін HDAC6 ZnF-ті рационалды және тиімді бастапқы нүкте ретінде таңдадық. Біз HDAC6 ZnF доменінің (1A-сурет) Ub-ке қатысты аффинділігін жетілдіруден бастауға және кейіннен байланыспаған Ub-ті зерттеу үшін мамандандырылған құралды әзірлеу үшін қосымша Ub-байланыстырушы мотивтерді қосуға шешім қабылдадық. Бастапқы жұмыстар тышқан (m) HDAC6, mHDAC6_(1007–1149)-ның C-терминалды ақуыз фрагменті, оның ZnF домені және кейбір жоғары тізбектерді қамти отырып, ~60 нМ K_d мен байланыспаған Ub-ке қатысты ерекше жоғары аффинділікке ие екенін көрсетті [15].&lt;/p&gt;\n&lt;p&gt;Оптимизацияларымызды бастау үшін қай конструкция ең жақсы екенін шешу үшін біз алдымен осы тышқан ақуыз фрагментін адам (h) ақуызы, hHDAC6_(1073–1215)-тің эквивалентті фрагментімен, сондай-ақ Ub-пен кешенде кристалданған қысқарақ ZnF домені фрагменті, hHDAC6_(1108–1215) — бұдан әрі ZnF домені [14] — және толық ұзындықтағы ақуыз, hHDAC6_(1–1215) (1B-сурет) салыстырдық. Біз тазартылған ақуыздардың Ub-ке қатысты байланысу аффинділігін изотермиялық титрлеу калориметриясы (ITC) көмегімен өлшедік және алдыңғы нәтижелермен жақсы сәйкестікте, тышқан мен адамның кеңейтілген ZnF фрагменттері (69,9 ± 4,6) нМ (1C-сурет) және (73,5 ± 3,3) нМ (SN-сурет) K_d мен Ub-ке қатысты салыстырмалы аффинділікке ие екенін анықтадық. Күтпеген жерден, толық ұзындықтағы ақуыз бен ZnF домені екеуі де (1,04 ± 0,20) мкМ (SN-сурет) және (5,16 ± 0,47) мкМ (1D-сурет) K_d мен әлдеқайда төмен аффинділікке ие болды. Бұл ZnF доменінің N-терминалындағы ~30 қалдықтан тұратын иілгіш ілмек Ub байланысуын айтарлықтай күшейтетінін көрсетеді. Мұны одан әрі зерттеу үшін біз Ub-пен байланысқан кеңейтілген mHDAC6_ZnF_(1007–1149) құрылымын болжау үшін жергілікті орнатылған AlphaFold2-ні пайдаландық. Модель бірінші α-спираль алдындағы N-терминалды иілгіш аймақ Ub айналасында оралғанын көрсетті (1E-сурет), бұл кеңейтілген ZnF доменінің жоғары байланысу аффинділігін түсіндіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кеңейтілген ZnF домені (1007–1149) иілгіш N-терминалды ілмек арқасында ядролық доменге қарағанда ~70 есе жоғары убиквитин аффинділігіне ие.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу in vitro және in silico жүргізілді; тірі жүйелерге экстраполяция жасау жасушалық ортаның күрделілігіне байланысты сақтықты талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-01/a-designed-ubiquitin-binding-protein-selectively-enriches-an.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;
