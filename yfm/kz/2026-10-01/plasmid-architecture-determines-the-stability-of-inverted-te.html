-bp қысқартылған ITR-лер, 119-bp Δ11 ITR-лер, нақты Δ11 мотиві жоқ 119-ұқсас ITR-лер немесе басқа өзгертілген/қысқартылған ITR-лер ретінде жіктелді. Екі ITR-ді қамтитын плазмидтер жұп ITR архитектурасы бойынша жинақталды. pAAV2ST (Addgene плазмиді 239400) екі толық ұзындықтағы 145-bp ITR-ді анықтау үшін оң бақылау ретінде қызмет етті.&lt;/p&gt;\n&lt;p&gt;Δ11 мутациясының таралуы 11-bp делециясына сәйкес келетін 34-bp тізбегін екі бағытта іздеу арқылы бағаланды. Дөңгелек тізбектер әрбір тізбектің алғашқы 33 негізін оның соңына қосу арқылы өңделді, бұл ішкі мотивтер есебін қайталамай, тізбекті сызықты ету нүктесін қамтитын мотив үлгілерін анықтауға мүмкіндік берді. Δ11-ді қамтитын белгілі бақылау тізбегі нақты мотив жұмыс процесі бір күтілетін мотив үлгісі туралы хабарлағанын тексеру үшін қолданылды.&lt;/p&gt;\n&lt;p&gt;Шығу тегі жақындығын талдау үшін бактериялық репликацияның шығу тегі координаттары GenBank rep_origin сипаттамаларынан алынды. Жаппай тізбектерден алынған ITR және Δ11 координаттары өкілдік жаппай және GenBank жазбалары арасында тізбек ұзындығы, тізбек идентификациясы және Δ11 күйінің сәйкестігін растағаннан кейін GenBank тізбек координаттарымен салыстырылды. Плазмидтер бастапқы шығу тегі жақындығын талдауға тек өкілдік тізбегі нақты екі ITR және нақты бір Δ11 мотивін қамтыған жағдайда ғана енгізілді. Әрбір ITR ортасынан бактериялық шығу тегі ортасына дейінгі дөңгелек қашықтық есептелді және Δ11-ді қамтитын ITR аннотацияланған плазмид ori элементіне қатысты жақынырақ немесе алысырақ екеніне қарай жіктелді.&lt;/p&gt;\n&lt;h4 id=\"genomdykh-integraciyany-taldau\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#genomdykh-integraciyany-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Геномдық интеграцияны талдау&lt;/span&gt;&lt;/a&gt;Геномдық интеграцияны талдау&lt;/h4&gt;\n&lt;p&gt;Гендерді мақсатты редакциялауға арналған pSEPTp53 векторы TP53 нокаутына арналған кассетаны қамтиды, ол синтетикалық экзондық промотор тұзағын қоршап тұрған екі ~1 кб ұзындықтағы гомология иықтарынан тұрады. Бұл кассета pAAV-MCS (Agilent) AAV векторының NotI сайттарына клондалды. pSEPTp53 плазмидасы NotI ферментімен кесілді және дефосфорланған фрагмент NotI-мен кесілген pAAV-MCS векторына екі бағытта да қайта енгізілді. Дәл сол фрагмент pAAVcis плазмидасының NotI сайттарына тікелей клондалды. Алынған үш плазмида бұрын сипатталғандай, AAV Helper-Free System (Agilent) көмегімен AAV2 капсидтеріне оралды. Тазартылмаған вирустық қорлар мөлшерлік ПТР (qPCR) әдісімен титрленді және 10-ға тең инфекциялану көптігінде (&lt;a href=\"concepts/moi.html\"&gt;MOI&lt;/a&gt;) субконфлюэнтті моноқабатты дақылдарда өсіп жатқан HCT116 және hTERT-RPE1 жасушаларына қосылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Инфекциялану көптігі (MOI) — бұл дақылдағы әрбір жасушаға келетін орташа вирус бөлшектерінің саны; бұл жағдайда әрбір жасушаға 10 вирус бөлшегі келеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Инфекциядан үш күн өткен соң, жасушалар трипсин-EDTA көмегімен бөлініп, 0,4 мг/мл генетицинмен (ThermoFisher Scientific) байытылған ортада 96 ұяшықты планшеттерге (Corning) шектеулі сұйылту әдісімен егілді. Әрбір планшеттер жиынтығы үшін 60-тан 110-ға дейін жеке колониялар есептелді және геномдық ДНҚ тікелей Lyse-N-Go PCR (Pierce Biotechnology, Rockford, IL) реагентінің көмегімен бөліп алынды. TP53 локусына гомологиялық интеграцияны тексеру үшін ПТР скринингі өндірушінің ұсыныстарына сәйкес Platinum Taq (ThermoFisher Scientific) ферментін қолдана отырып, келесі праймерлермен жүзеге асырылды: p53R, 5’-TGTGTGTGACTGCTTGTAG-3’; NeoFor, 5’-TCTGGATTCATCGACTGTGG-3’. 1,8 кб өлшеміндегі оң сигнал берген үлгілер p53F, 5’-CTGGGAGAAGGTGCGATGAT-3’ және NeoRev, 5’-GTTGTGCCCAGTCATAGCCG-3’ праймерлерімен екінші ПТР арқылы расталды, олар гомологиялық интеграция оқиғалары кезінде 2,2 кб өлшеміндегі жолақ түзеді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-f2.jpg\" alt=\"2-сурет. ITR бойынша Сэнгер секвенирлеуінің асимметриялық сапасы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет. ITR бойынша Сэнгер секвенирлеуінің асимметриялық сапасы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сурет. ITR бойынша Сэнгер секвенирлеуінің асимметриялық сапасы. 1c-суретте жұлдызшалармен белгіленген SmaI-сезімтал (a) pSM620 және (b) psub201 субклондарының сол және оң жақ ITR-лері 1b-суретте көрсетілген праймерлермен модификацияланған Сэнгер әдісі арқылы секвенирленді. Әрбір позициядағы нуклеотидті анықтаудың салыстырмалы сенімділігі әріптердің биіктігімен көрсетілген.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-f3.jpg\" alt=\"3-сурет. pSM620 ITR элементтері бойынша нанопорлы секвенирлеу.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет. pSM620 ITR элементтері бойынша нанопорлы секвенирлеу.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-сурет. pSM620 ITR элементтері бойынша нанопорлы секвенирлеу. Сол жақ ITR (a) және оң жақ ITR (b) бойынша оқылымдарды жинақтау (read pileup) талдауы графикалық түрде көрсетілген. Жиынтық бағандық диаграмма көлденең осьте көрсетілгендей, әрбір позициядағы негіздердің үлесін көрсетеді. Анықталған кірістірулер мен делециялар әрбір позициядағы барлық оқылымдардың үлесі ретінде берілген. Off-mode графигі әрбір позициядағы оқылымдардың эталондық тізбектен ауытқуын білдіреді. (c) pSM620-дағы AAV2 кірістіруі бойынша әрбір позициядағы тізбектің ауытқуы.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-f6.jpg\" alt=\"6-сурет. Синтетикалық rAAV cis плазмидасын талдау.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сурет. Синтетикалық rAAV cis плазмидасын талдау.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;6-сурет. Синтетикалық rAAV cis плазмидасын талдау. (a) 145 п.н. AAV2 ITR-мен шектелген GFP экспрессия кассетасы жоғары көшірмелі pUC57-KAN клондау векторында жинақталды. (b) 72 сағат бойы үздіксіз өсіргеннен кейін 10 тәуелсіз субклон көбейтілді және бөлінген ДНҚ SmaI ферментімен өңделді. Жұлдызшамен белгіленген дақыл (*, 7-клон) субклондық талдаудың екінші кезеңі үшін жаңа бактериялық табақшаға егілді. (c) pAAVcis 7-клонының ITR-ін нанопоралық секвенирлеу арқылы талдау. (d) rAAV кірістіруі бойынша нанопоралық pileup деректеріндегі қате базалық шақырулар (off-mode basecalls).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-f7.jpg\" alt=\"7-сурет. 4750 п.н.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-сурет. 4750 п.н.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;7-сурет. 4750 п.н. CRISPR/SaCas9 жүйесін шектейтін ITR-лердің тұрақты таралуы. (a) pBR322-ден алынған tetr селекциялық маркері pAAVcis-тегі іргелес ori және ITR элементтерінің арасына енгізіліп, жаңа pAAV2ST (ST = тұрақты) кіру векторы жасалды. pAAV2ST-тегі ori және оң жақ ITR көрсетілгендей 1797 п.н. қашықтықта орналасқан. GFP кассетасын NotI арқылы кесуге болады. Сонымен қатар, BsaI арқылы кесу Golden Gate әдісімен (31) бағытталған клондауды жеңілдетеді. (b) GFP экспрессия кассетасы тышқанның Pcsk9 локусына (17) бағытталған SaCas9 кірістіруімен ауыстырылды. (c) pAAV2ST-Pcsk9sg1 плазмидасы бар бактериялар 72 сағат бойы сериялы түрде өсірілді. 24 сағаттық аралықпен бөлінген ДНҚ-лар SmaI-мен өңделді. (d) 10 мг гигапрептен алынған pAAV2ST-Pcsk9sg1 ДНҚ-сы гель-электрофорез алдында кесілмеген немесе SmaI-мен өңделген күйде қалдырылды. 10 тәуелсіз субклоннан алынған өңделген ДНҚ-лар бір гельде талданды. (e) pAAV2ST-Pcsk9sg1 ДНҚ-сының ірі көлемді препаратынан ITR-лердің нанопоралық оқылымдарын талдау. Нуклеотидтік позициялар көлденең осьтерде көрсетілген.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-f8.jpg\" alt=\"8-сурет. pAAV2ST-Pcsk9sg1-ден алынған вирустық қорды талдау.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-сурет. pAAV2ST-Pcsk9sg1-ден алынған вирустық қорды талдау.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;8-сурет. pAAV2ST-Pcsk9sg1-ден алынған вирустық қорды талдау. (a) Градиентті тазартылған AAV8 бөлшектерін массалық фотометрия арқылы талдау. (b) 57 000 есе үлкейту кезінде трансмиссиялық электронды микроскопия арқылы визуализацияланған тазартылған вирус бөлшектері. Бос капсидтердің мысалдары ақ көрсеткілермен белгіленген. Масштабтық сызық = 100 нм. (c) Трансгендік жүкке, Rep-Cap және көмекші плазмида ДНҚ-ларына, E. coli геномына және картаға түсірілмеген оқылымдарға сәйкес келетін оқылымдардың таралуы көрсетілген. (d) Нанопоралық ДНҚ секвенирлеуі арқылы бағаланған инкапсидтелген геномдық ДНҚ-лардың ұзындық бойынша таралуы. (e) ITR-мен шектелген трансгенге картаға түсірілген барлық оқылымдардың басталу және аяқталу координаттары.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-f9.jpg\" alt=\"9-сурет. Addgene AAV cis плазмидаларындағы ITR архитектураларын тізбек негізінде зерттеу.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;9-сурет. Addgene AAV cis плазмидаларындағы ITR архитектураларын тізбек негізінде зерттеу.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;9-сурет. Addgene AAV cis плазмидаларындағы ITR архитектураларын тізбек негізінде зерттеу. (a) Талдау конвейері: Addgene плазмидалық тізбектер деректер жинағы 177 835 плазмиданы және 297 680 тізбек жазбасын қамтыды. Метадеректерді сүзу 7491 кандидат AAV плазмидасын анықтады, олардың 7041-і тізбегі расталған AAV ITR-лерін қамтыды. ITR бар плазмидалардың көпшілігінде екі болжамды ITR болды. (b) 6824 екі ITR-лі плазмидалар арасындағы құрылымдық кластар. Екі ITR өздерінің тиісті ұзындықтары бойынша бірінші ITR/екінші ITR ретінде белгіленеді. Доминантты архитектура Δ11 мутациясы бар 119 п.н. ITR және 130 п.н. ITR-ден тұрды. Бұл плазмидалардың шамамен үштен бірі екі 130 п.н. ITR-ді қамтыды. Cis-плазмидалардың әлдеқайда аз санында екі толық өлшемді 145 п.н. ITR болды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-f10.jpg\" alt=\"10-сурет. Жарияланған rAAV cis плазмидаларында көрсетілген ITR-лер.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;10-сурет. Жарияланған rAAV cis плазмидаларында көрсетілген ITR-лер.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;10-сурет. Жарияланған rAAV cis плазмидаларында көрсетілген ITR-лер. (a) Табиғи 145 нт ITR дуплексті аймақты (A/A'), екі ілмекті (B/B' және C/C') және бір тізбекті доменді (D) қамтиды. Rep ақуызы танитын байланыстырушы элемент жақтауға алынған. Көлеңкеленген бөліктер заманауи рекомбинантты AAV векторларында жиі кездесетін 11 нт ішкі делеция және 15 нт қысқарту нәтижесінде жойылған нуклеотидтерді білдіреді. C/C' дуплексі көрсетілгендей, дуплексті SmaI тану сайтын құрайды. (b) 130 нт ITR ата-бабалық 15 нт қысқарту арқылы жасалған. (c) Жалпы 119 нт ITR 15 п.н. қысқартуды және 11 нт ішкі Δ11 делециясын қамтиды. (d) 145 нт ITR плазмидасы (pL-ITR) және 11 п.н. ішкі делециясы бар нұсқа (pL-ITRΔ11) жеке синтезделді. Екі плазмида SmaI-дің артып келе жатқан мөлшерімен өңделіп, нативті агарозды гельде бөлінді. Суперспиральданған кесілмеген, сызықтық және никтелген түрлердің позициялары көрсетілгендей.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te-f11.jpg\" alt=\"11-сурет. Гомологиялық және гомологиялық емес интеграцияның салыстырмалы деңгейлерін бағалау.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;11-сурет. Гомологиялық және гомологиялық емес интеграцияның салыстырмалы деңгейлерін бағалау.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;11-сурет. Гомологиялық және гомологиялық емес интеграцияның салыстырмалы деңгейлерін бағалау. (a) pAAV-MCS туындысы pSEPT-p53, вирус геномдарының адамның TP53 локусына гомологиялық интеграциялануына арналған промотор-тұзақ векторы болып табылады (18). Екі гомологиялық домен (HA-1 және HA-2) 2-экзондағы шағын делецияны анықтайды, ол гомологиялық интеграция кезінде промоторсыз неомицин кассетасымен алмастырылады (сол жақта). Бұл конструкция ITR-мен микро-гомологиясы бар нысаналы емес сайттарға да интеграцияланады; ITR қалдықтары эндогендік ген мен нысаналы конструкция арасындағы түйісу нүктелерінде болуы керек (оң жақта). Инсерциялық мутагенездің салыстырмалы қаупін нысаналы және нысаналы емес интеграция оқиғаларының қатынасы бойынша бағалауға болады. (b) pSEPT-p53-тен алынған NotI-NotI кірістірмесі екі бағытта да асимметриялық pAAV-MCS қаңқасына және pAAVcis-ке клондалды. Кірістірме бағытына қатысты оң және сол жақ ITR ұзындықтары (б.ж.) көрсетілген. (c) Үш вектордың әрқайсысынан алынған неомицинге төзімді (neor) колониялар саны HCT116 жасушалары (сұр бағандар) немесе hTERT-RPE1 жасушалары (ақ бағандар) инфекцияланғаннан кейін үш апта өткен соң есептелді. Векторлар көлденең осьтер бойымен сол жақ ITR ұзындығы / оң жақ ITR ұзындығы ретінде белгіленген. (d) TP53 локусына гомологиялық интеграция нәтижесінде пайда болған neor колонияларының үлесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Гендік терапия&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;дайындамасында&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ғы мутациялар&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Nanopore&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=
