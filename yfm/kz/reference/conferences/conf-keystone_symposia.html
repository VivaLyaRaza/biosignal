        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференциялар&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;узкие симпозиумы по молекулярной биологии и иммунологии&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;узкие симпозиумы по молекулярной биологии и иммунологии&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не аламыз&lt;/td&gt;\n&lt;td&gt;передний край фундаментальной науки&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-cells.html\"&gt;Жасушалар мен молекулалар&lt;/a&gt;, &lt;a href=\"concepts/spec-immunity.html\"&gt;Микробтар және иммунитет&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"bul-khandaj-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-keystone_symposia.html#bul-khandaj-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қандай конференция&lt;/span&gt;&lt;/a&gt;Бұл қандай конференция&lt;/h2&gt;\n&lt;p&gt;Keystone Symposia — молекулалық биология, иммунология және биомедицинаның іргелі мәселелеріне арналған тар шеңбердегі ғылыми конференциялар сериясы. Тұтас салаларды қамтитын ірі конгрестерден айырмашылығы, бұл симпозиумдар нақты молекулалық механизмдер мен жасушалық процестерге назар аударады. Бұл ғалымдар ғылымның «алдыңғы шебін» — әлі оқулыққа енбеген, бірақ өмірді молекулалық деңгейде түсінуімізді өзгертіп жатқан зерттеулерді талқылайтын алаң.&lt;/p&gt;\n&lt;h2 id=\"ujymdastyrushylar-zhaene-tarihy\"&gt;&lt;a href=\"reference/conferences/conf-keystone_symposia.html#ujymdastyrushylar-zhaene-tarihy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйымдастырушылар және тарихы&lt;/span&gt;&lt;/a&gt;Ұйымдастырушылар және тарихы&lt;/h2&gt;\n&lt;p&gt;Keystone Symposia ұйымы зерттеушілерге тығыз ортада терең білім алмасу мүмкіндігін беру үшін құрылған. Негізгі мақсат — биологтар, химиктер және дәрігерлер арасында пәнаралық өзара іс-қимылды дамыту. Конференциялар тек ресми баяндамалар емес, пікірталастарды ынталандыратын форматтарда өткізіледі.&lt;/p&gt;\n&lt;h2 id=\"takhyryptar-men-sekciyalar\"&gt;&lt;a href=\"reference/conferences/conf-keystone_symposia.html#takhyryptar-men-sekciyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тақырыптар мен секциялар&lt;/span&gt;&lt;/a&gt;Тақырыптар мен секциялар&lt;/h2&gt;\n&lt;p&gt;Симпозиумдар бағдарламасы құрылымдық биология мен генетикадан бастап, ағзаның иммундық жауаптарына дейінгі кең ауқымды тақырыптарды қамтиды. Негізгі бағыттар:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Аурулардың молекулалық механизмдері (мысалы, стеатогепатит).&lt;/li&gt;\n&lt;li&gt;Гендік терапия және вирустық векторларды құру.&lt;/li&gt;\n&lt;li&gt;Иммунология: нейтрофилдер, Т-жасушалар және онкологиямен күрес механизмдері.&lt;/li&gt;\n&lt;li&gt;Биоинформатика және деректерді талдау алгоритмдері.&lt;/li&gt;\n&lt;li&gt;Микробиология және патогендерді зерттеу.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"onda-ne-pajda-bolady\"&gt;&lt;a href=\"reference/conferences/conf-keystone_symposia.html#onda-ne-pajda-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Онда не пайда болады&lt;/span&gt;&lt;/a&gt;Онда не пайда болады&lt;/h2&gt;\n&lt;p&gt;Keystone Symposia-да кейіннен серпінді технологиялардың негізі болатын нәтижелер алғаш рет жарияланады. Мұнда мыналар талқыланады:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fold'EM сияқты жаңа алгоритмдер.&lt;/li&gt;\n&lt;li&gt;Рак терапиясындағы Т-жасушалардың «ұйқы» күйі және оларды белсендіру тәсілдері.&lt;/li&gt;\n&lt;li&gt;РНҚ биологиясындағы жаңалықтар, соның ішінде ДНҚ-сыз ақуыз кодтай алатын РНҚ-лар.&lt;/li&gt;\n&lt;li&gt;Гендік терапия үшін генетикалық ақауларды түзету әдістері.&lt;/li&gt;\n&lt;li&gt;Сирек кездесетін амебаларға арналған экспресс-тесттер сияқты жаңа диагностикалық тәсілдер.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khalaj-bakhylaugha-zhaene-khatysugha-bolady\"&gt;&lt;a href=\"reference/conferences/conf-keystone_symposia.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай бақылауға және қатысуға болады&lt;/span&gt;&lt;/a&gt;Қалай бақылауға және қатысуға болады&lt;/h2&gt;\n&lt;p&gt;Симпозиумдарға қатысу талқыланып жатқан салада терең сараптаманы талап етеді. Зерттеушілер үшін бұл өз деректерін әлемдік деңгейдегі әріптестеріне ұсыну мүмкіндігі. Ғылымды бақылап жүргендер үшін конференция материалдары алдағы жылдары қай бағыттардың басым болатынын көрсететін индикатор болып табылады.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/conferences/conf-keystone_symposia.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D1%82%D0%B5%D1%84%D0%B0%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%2C_%D0%93%D1%80%D0%B5%D0%B3%D0%BE%D1%80%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Стефанопулос, Грегори — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1002/pro.5560040502\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The metzincins--topological and sequential relations between the astacins, adamalysins, serralysins, and matrixins (collagenases) define a superfamily of zinc-peptidases&lt;/a&gt; — шолу, Protein Sci 1995&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nrendo.2017.42\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Endocrine-disrupting chemicals and fatty liver disease&lt;/a&gt; — шолу, Nat Rev Endocrinol 2017&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1084/jem.20091903\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Regulation of pathogenesis and immunity in helminth infections&lt;/a&gt; — шолу, J Exp Med 2009&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференциялар&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"узкие симпозиумы по молекулярной биологии и иммунологии"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Keystone Symposia","description":"узкие симпозиумы по молекулярной биологии и иммунологии","vcsPath":"reference/conferences/conf-keystone_symposia.md"},"headings":[{"title":"Бұл қандай конференция","href":"reference/conferences/conf-keystone_symposia.html#bul-khandaj-konferenciya","level":2},{"title":"Ұйымдастырушылар және тарихы","href":"reference/conferences/conf-keystone_symposia.html#ujymdastyrushylar-zhaene-tarihy","level":2},{"title":"Тақырыптар мен секциялар","href":"reference/conferences/conf-keystone_symposia.html#takhyryptar-men-sekciyalar","level":2},{"title":"Онда не пайда болады","href":"reference/conferences/conf-keystone_symposia.html#onda-ne-pajda-bolady","level":2},{"title":"Қалай бақылауға және қатысуға болады","href":"reference/conferences/conf-keystone_symposia.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady","level":2},{"title":"Дереккөздер","href":"reference/conferences/conf-keystone_symposia.html#derekkoezder","level":2}],"title":"Keystone Symposia"},"router":{"pathname":"reference/conferences/conf-keystone_symposia","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
