        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференциялар&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;крупнейший съезд нейробиологов (Society for Neuroscience)&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;крупнейший съезд нейробиологов (Society for Neuroscience)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не аламыз&lt;/td&gt;\n&lt;td&gt;тренды нейронауки, свежие тезисы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-brain.html\"&gt;Ми және жүйке жүйесі&lt;/a&gt;, &lt;a href=\"concepts/spec-mind.html\"&gt;Психика және мінез-құлық&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"bul-khandaj-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-sfn_neuroscience.html#bul-khandaj-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қандай конференция&lt;/span&gt;&lt;/a&gt;Бұл қандай конференция&lt;/h2&gt;\n&lt;p&gt;SfN Neuroscience (Neuroscience) — Нейроғылымдар қоғамы (Society for Neuroscience) ұйымдастыратын жыл сайынғы халықаралық конференция. Бұл ми мен жүйке жүйесін зерттеу саласында жұмыс істейтін он мыңдаған зерттеушілерді, дәрігерлер мен әзірлеушілерді біріктіретін әлемдегі ең ірі ғылыми оқиға. Конференция деректер алмасу, озық әдістемелерді талқылау және нейроғылымның алдағы жылдардағы күн тәртібін қалыптастыру үшін негізгі алаң болып табылады.&lt;/p&gt;\n&lt;h2 id=\"ujymdastyrushylar-zhaene-tarihy\"&gt;&lt;a href=\"reference/conferences/conf-sfn_neuroscience.html#ujymdastyrushylar-zhaene-tarihy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйымдастырушылар және тарихы&lt;/span&gt;&lt;/a&gt;Ұйымдастырушылар және тарихы&lt;/h2&gt;\n&lt;p&gt;Ұйымдастырушы — 1969 жылы құрылған коммерциялық емес ұйым, Нейроғылымдар қоғамы. Оның миссиясы ми мен жүйке жүйесі бойынша іргелі зерттеулерді ілгерілету және ғылыми білім беруді қолдау болып табылады. Конференция жыл сайын Солтүстік Американың әртүрлі қалаларында өткізіліп, ағзаның барлық жүйелерінің қызметін реттейтін жүйке жүйесінің интегративті табиғатын талқылау үшін сарапшыларды жинайды.&lt;/p&gt;\n&lt;h2 id=\"takhyryptar-men-sekciyalar\"&gt;&lt;a href=\"reference/conferences/conf-sfn_neuroscience.html#takhyryptar-men-sekciyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тақырыптар мен секциялар&lt;/span&gt;&lt;/a&gt;Тақырыптар мен секциялар&lt;/h2&gt;\n&lt;p&gt;Конференция бағдарламасы нейроғылымдардың барлық спектрін қамтиды: молекулалық биологиядан когнитивті психологияға дейін. Негізгі бағыттар:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Молекулалық және жасушалық механизмдер: генетикалық мутацияларды (мысалы, AKAP11) және олардың нейрондар жұмысына әсерін, сондай-ақ Гоше ауруы сияқты сирек кездесетін ауруларды зерттеу.&lt;/li&gt;\n&lt;li&gt;Мидың дамуы: нейрондық байланыстардың қалыптасуын талдау, соның ішінде дің жасушаларынан «мини-ми» жасау.&lt;/li&gt;\n&lt;li&gt;Когнитивті процестер: есте сақтау механизмдері, естеліктердің визуалды бөлшектерін жаңғырту және нәрестелердің сөзді қабылдауы.&lt;/li&gt;\n&lt;li&gt;Клиникалық нейробиология: психикалық бұзылулар (СДВГ, депрессия, аутизм) мен диабет сияқты соматикалық аурулардың байланысы және гендік терапия әдістерін әзірлеу.&lt;/li&gt;\n&lt;li&gt;Нейротехнологиялар: Альцгеймер және Паркинсон сияқты нейродегенеративті аурулардың ортақ биологиялық маркерлерін іздеу үшін ми атластарын жасау.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"onda-ne-pajda-bolady\"&gt;&lt;a href=\"reference/conferences/conf-sfn_neuroscience.html#onda-ne-pajda-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Онда не пайда болады&lt;/span&gt;&lt;/a&gt;Онда не пайда болады&lt;/h2&gt;\n&lt;p&gt;SfN Neuroscience — ауқымды зерттеулердің нәтижелері алғаш рет жарияланатын орын. Дәл осы жерде ғылыми қоғамдастық аурулардың жаңа модельдерімен, клиникалық сынақтардың нәтижелерімен және миды визуализациялаудың инновациялық әдістерімен танысады. Конференция ашық деректер (Open Data) мәдениетін дамытуға ықпал етеді, бұл ғалымдарға мидың осалдығын картаға түсіру немесе ерте стресстің префронтальды қыртыс пен миндалинаға әсерін зерттеу сияқты күрделі міндеттерді шешуде күш біріктіруге мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"khalaj-bakhylaugha-zhaene-khatysugha-bolady\"&gt;&lt;a href=\"reference/conferences/conf-sfn_neuroscience.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай бақылауға және қатысуға болады&lt;/span&gt;&lt;/a&gt;Қалай бақылауға және қатысуға болады&lt;/h2&gt;\n&lt;p&gt;Конференцияға қатысу күндізгі және қашықтық форматтарда мүмкін. Нәтижелерді бақылаудың негізгі жолдары:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тезистерді (Abstracts) зерделеу: жыл сайын ағымдағы зерттеулер бойынша қысқаша есептердің үлкен массиві жарияланады.&lt;/li&gt;\n&lt;li&gt;Бейінді жарияланымдар: SfN-де ұсынылған көптеген баяндамалар кейіннен жетекші ғылыми журналдардағы мақалалар үшін негіз болады.&lt;/li&gt;\n&lt;li&gt;Қоғамдастық ресурстары: Нейроғылымдар қоғамының ресми сайты конференция мұрағаттарына, білім беру материалдарына және нейробиологиядағы басты трендтер туралы жаңалықтарға қол жеткізуге мүмкіндік береді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/conferences/conf-sfn_neuroscience.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9D%D0%B5%D1%80%D0%B2%D0%BD%D0%B0%D1%8F_%D1%81%D0%B8%D1%81%D1%82%D0%B5%D0%BC%D0%B0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Нервная система — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1007/s12021-021-09533-8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Promoting FAIR Data Through Community-driven Agile Design: the Open Data Commons for Spinal Cord Injury (odc-sci.org)&lt;/a&gt; — шолу, Neuroinformatics 2022&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1007/s12021-008-9019-9\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Domain-specific data sharing in neuroscience: what do we have to learn from each other?&lt;/a&gt; — шолу, Neuroinformatics 2008&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференциялар&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"крупнейший съезд нейробиологов (Society for Neuroscience)"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"SfN Neuroscience","description":"крупнейший съезд нейробиологов (Society for Neuroscience)","vcsPath":"reference/conferences/conf-sfn_neuroscience.md"},"headings":[{"title":"Бұл қандай конференция","href":"reference/conferences/conf-sfn_neuroscience.html#bul-khandaj-konferenciya","level":2},{"title":"Ұйымдастырушылар және тарихы","href":"reference/conferences/conf-sfn_neuroscience.html#ujymdastyrushylar-zhaene-tarihy","level":2},{"title":"Тақырыптар мен секциялар","href":"reference/conferences/conf-sfn_neuroscience.html#takhyryptar-men-sekciyalar","level":2},{"title":"Онда не пайда болады","href":"reference/conferences/conf-sfn_neuroscience.html#onda-ne-pajda-bolady","level":2},{"title":"Қалай бақылауға және қатысуға болады","href":"reference/conferences/conf-sfn_neuroscience.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady","level":2},{"title":"Дереккөздер","href":"reference/conferences/conf-sfn_neuroscience.html#derekkoezder","level":2}],"title":"SfN Neuroscience"},"router":{"pathname":"reference/confere
