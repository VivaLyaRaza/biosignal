        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Кәсіптер&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;изучает, как нейроны и сети мозга создают поведение и память&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/professions/prof-neuroscientist.jpg\" alt=\"Нейробиолог\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Немен айналысады&lt;/td&gt;\n&lt;td&gt;изучает, как нейроны и сети мозга создают поведение и память&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не білу керек&lt;/td&gt;\n&lt;td&gt;электрофизиология, визуализация, анализ данных&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-brain.html\"&gt;Ми және жүйке жүйесі&lt;/a&gt;, &lt;a href=\"concepts/spec-mind.html\"&gt;Психика және мінез-құлық&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"nemen-ajnalysady\"&gt;&lt;a href=\"reference/professions/prof-neuroscientist.html#nemen-ajnalysady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Немен айналысады&lt;/span&gt;&lt;/a&gt;Немен айналысады&lt;/h2&gt;\n&lt;p&gt;Нейробиолог — жүйке жүйесінің құрылымын, дамуы мен жұмыс істеуін зерттейтін ғалым. Оның міндеті — нейрондар мен олардың желілеріндегі физикалық процестердің қалайша мінез-құлыққа, есте сақтауға, эмоциялар мен когнитивті қабілеттерге айналатынын түсіну. Нейробиология мидың ағзаны қалыпты жағдайда және патология кезінде қалай басқаратынын түсіндіру үшін генетика, биохимия, физиология және психологияны біріктіреді.&lt;/p&gt;\n&lt;h2 id=\"tiptik-mindetter\"&gt;&lt;a href=\"reference/professions/prof-neuroscientist.html#tiptik-mindetter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типтік міндеттер&lt;/span&gt;&lt;/a&gt;Типтік міндеттер&lt;/h2&gt;\n&lt;p&gt;Нейробиологтың жұмысы ми қызметінің негізінде жатқан механизмдерді іздеуге бағытталған. Негізгі бағыттар:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Аурулардың жасушалық механизмдерін зерттеу: Гоше ауруы сияқты сирек кездесетін генетикалық бұзылыстарды талдау үшін пациенттердің діңгекті жасушаларынан «мини-милер» өсіру.&lt;/li&gt;\n&lt;li&gt;Миды карталау: нейродегенеративті (Альцгеймер, Паркинсон) және психикалық аурулар (шизофрения) кезінде жасушалардың осалдық атластарын жасау.&lt;/li&gt;\n&lt;li&gt;Нейрондық желілерді талдау: мидың медиальды самай желісі естеліктердің визуалды бөлшектерін қалай кодтайтынын зерттеу.&lt;/li&gt;\n&lt;li&gt;Патологияларды модельдеу: тышқандар модельдері арқылы мутациялардың (мысалы, AKAP11 гені) депрессия мен мазасыздық күйлеріне әсерін зерттеу.&lt;/li&gt;\n&lt;li&gt;Дамуды зерттеу: ерте стресстің префронтальды қыртыс пен миндалина жұмысын қалай өзгертетінін немесе сәбилер миының сөйлеуді қабылдауға қалай бейімделетінін талдау.&lt;/li&gt;\n&lt;li&gt;Терапияны әзірлеу: ауыр синдромдар кезінде нейрондардың өлуіне жол бермеу үшін гендік инженерия әдістерін сынақтан өткізу.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"daghdylar-men-khuraldar\"&gt;&lt;a href=\"reference/professions/prof-neuroscientist.html#daghdylar-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дағдылар мен құралдар&lt;/span&gt;&lt;/a&gt;Дағдылар мен құралдар&lt;/h2&gt;\n&lt;p&gt;Нейробиологтар міндеттерді шешу үшін әдістердің кең спектрін қолданады:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Электрофизиология: сигналдардың берілуін түсіну үшін нейрондардың электрлік белсенділігін тіркеу.&lt;/li&gt;\n&lt;li&gt;Визуализация (Imaging): ми құрылымы мен жасушалардың белсенділігін нақты уақыт режимінде бақылау үшін заманауи микроскоптар мен МРТ әдістері.&lt;/li&gt;\n&lt;li&gt;Деректерді талдау және нейрожелілер: нейрондық желілердегі заңдылықтарды анықтау үшін үлкен көлемдегі деректерді математикалық өңдеу.&lt;/li&gt;\n&lt;li&gt;Генетикалық модельдеу: трансгенді жануарлар желілерін құру және гендер жұмысын түзету үшін вирустық векторларды пайдалану.&lt;/li&gt;\n&lt;li&gt;Тіндерді өсіру: даму процестерін ағзадан тыс зерттеу үшін ми органоидтарын өсіру.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khajda-okhu-kerek\"&gt;&lt;a href=\"reference/professions/prof-neuroscientist.html#khajda-okhu-kerek\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда оқу керек&lt;/span&gt;&lt;/a&gt;Қайда оқу керек&lt;/h2&gt;\n&lt;p&gt;Нейробиологтың базалық білімі әдетте университеттердің биология, медицина немесе биофизика факультеттерінен басталады. Мамандану магистратура мен аспирантурада жүзеге асады, онда назар нейроғылымдарға аударылады. Математикалық талдау, бағдарламалау (Python, R) және статистика саласындағы дайындық маңызды, өйткені заманауи нейробиология деректерді талдауға сүйенеді.&lt;/p&gt;\n&lt;h2 id=\"khajda-zhumys-isteu-zhaene-khalaj-oesu-kerek\"&gt;&lt;a href=\"reference/professions/prof-neuroscientist.html#khajda-zhumys-isteu-zhaene-khalaj-oesu-kerek\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда жұмыс істеу және қалай өсу керек&lt;/span&gt;&lt;/a&gt;Қайда жұмыс істеу және қалай өсу керек&lt;/h2&gt;\n&lt;p&gt;Нейробиологтар академиялық институттарда, университет зертханаларында және фармацевтикалық компаниялардың R&amp;amp;D бөлімдерінде жұмыс істейді. Мансаптық өсу әдетте зерттеуші-лаборанттан өз зертханасының жетекшісіне (Principal Investigator) дейінгі жолды білдіреді. Ғалымдар нәтижелерді ғылыми журналдарда жариялайды, гранттық конкурстарға қатысады және іргелі жаңалықтарды ауруларды емдеу тәжірибесіне енгізу үшін клиницистермен ынтымақтасады.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/professions/prof-neuroscientist.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9D%D0%B5%D0%B9%D1%80%D0%BE%D0%B1%D0%B8%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Нейробиология — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Santiago_Ram%C3%B3n_y_Cajal_(1852-1934)_portrait_(restored).jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Original photo is anonymous although published by Clark University in 1899. Restoration by Garrondo, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1289/ehp.00108s3511\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Critical periods of vulnerability for the developing nervous system: evidence from humans and animal models&lt;/a&gt; — шолу, Environ Health Perspect 2000&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nn.4502\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Network neuroscience&lt;/a&gt; — шолу, Nat Neurosci 2017&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1177/1073858406293182\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Small-world brain networks&lt;/a&gt; — шолу, Neuroscientist 2006&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/professions.html\"&gt;Кәсіптер&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"изучает, как нейроны и сети мозга создают поведение и память"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Нейробиолог","description":"изучает, как нейроны и сети мозга создают поведение и память","vcsPath":"reference/professions/prof-neuroscientist.md"},"headings":[{"title":"Немен айналысады","href":"reference/professions/prof-neuroscientist.html#nemen-ajnalysady","level":2},{"title":"Типтік міндеттер","href":"reference/professions/prof-neuroscientist.html#tiptik-mindetter","level":2},{"title":"Дағдылар мен құралдар","href":"reference/pr
