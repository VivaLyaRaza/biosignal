        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"161\" cy=\"163\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"659\" cy=\"200\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · SYNTHETIC BIOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Жасушалар құстар сияқты&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;топтасып қозғалуға үйретілді&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell-f1.jpg\" alt=\"Сурет 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Құстардың аспанда біртұтас үйір болып, қақтығыспай ұшуы қарапайым ережелерге сүйенеді. Зерттеушілер жасушалар арасындағы осындай байланыс заңдылықтарын арнайы алгоритмдер арқылы қайта жазды. Компьютерлік көру жүйесі жасушалардың қозғалысын тіркеп, жарық импульстері арқылы олардың бағытын дер кезінде түзетіп отырды. Соның нәтижесінде кәдімгі лейкоциттер құстар секілді үйірленіп, химиялық ізді әлдеқайда дәл таба бастады.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;CMI интерфейсі компьютерлік көру мен opto-PI3K көмегімен жасушаларды нақты уақытта басқарды&lt;/li&gt;\n&lt;li&gt;HL-60 жасушалары жеті көршісіне қарап бағыт түзейтін құстар моделіне бағындырылды&lt;/li&gt;\n&lt;li&gt;Ұжымдық үйлестіру fMLP пептидіне қарай бағытталған хемотаксис тиімділігін екі есе өсірді&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Синтетикалық биологияда жасушалардың ұжымдық әрекетін өзгерту ұзақ уақыт бойы күрделі генетикалық құрастыруды қажет етіп келді. Мақала авторлары компьютерлік көру және кері байланысты оптогенетикаға негізделген «жасуша-машина» интерфейсін (cell-machine interface, CMI) ұсынды. Зерттеуде нейтрофил тәрізді HL-60 жасушалық желісі пайдаланылып, олардың қозғалысы жарықпен белсендірілетін фосфоинозитид-3-киназа (opto-PI3K) ферменті арқылы бағытталды.&lt;/p&gt;\n&lt;p&gt;Бағдарлама нақты уақыт режимінде жасушаларды құстар үйірінің ережесі бойынша ең жақын жеті көршісінің орташа траекториясына сәйкестендіріп отырды. Бұл тәсіл әдетте ретсіз қозғалатын HL-60 жасушаларының өздігінен үйір құрып, популяциялық поляризация көрсетуіне алып келді. Сонымен қатар, фотобұғатталған fMLP пептиді арқылы жасалған градиент кезінде осы ұжымдық байланыс ережесі жасушалардың хемотаксис тиімділігін бақылау тобымен салыстырғанда екі еседен астам арттырды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жұмыс тек HL-60 жасуша дақылында in vitro жағдайында орындалған және bioRxiv сайтындағы бұл препринт әлі сараптамадан өтпеген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Құстар мен жәндіктерде байқалатын ұжымдық қозғалыс топтарға жеке даралардың шамасы келмейтін міндеттерді орындауға мүмкіндік береді. Мұндай мінез-құлық жергілікті өзара әрекеттесулер нәтижесінде туындайды, алайда жасушалық деңгейде бұл процестерді ұйымдастыратын ережелер эксперименттік бақылаудың қиындығына байланысты жеткіліксіз зерттелген. Бұл жұмыста авторлар нақты уақыт режимінде ұжымдық көші-қон ережелерін белгілеуге мүмкіндік беретін «жасуша-машина» интерфейсін жасады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Жасуша-машина» интерфейсі — бұл тірі жасушалардың мінез-құлқын тұйық контурда басқару үшін компьютерлік көру жүйесі мен оптогенетиканы (жарық көмегімен жасуша белсенділігін басқару) біріктіретін жүйе.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Зерттеушілер генетикалық түрлендірілген жалғыз жасушалық желіні пайдаланды, онда жасушааралық өзара әрекеттесу ережелері бағдарламалық қамтамасыз ету арқылы белгіленді және кері байланысы бар оптогенетикалық басқару арқылы жүзеге асырылды. Бұл жасушаларға үйірге өздігінен ұйымдасуға, иммундық жасушалар тобының өзара әрекеттесу логикасын қайталайтын регенеративті сигналдарды таратуға және жеке жасушалар анықтай алмайтын сигналдық молекулалардың градиенттерін ұжымдық түрде еңсеруге мүмкіндік берді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жасушааралық қарапайым өзара әрекеттесу ережелерін өзгерту жүйенің жеке элементтері үшін мүмкін емес жаңа ұжымдық қабілеттерді жасауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жұмыс өзара әрекеттесудің негізгі қағидаттарын модификациялау күрделі топтық функциялардың пайда болуы үшін жеткілікті екенін көрсетеді. Ұсынылған тәсіл көпжасушалы жүйелердің үйлестіру қағидаттарын зерттеу және белгіленген қасиеттері бар синтетикалық ұжымдарды жобалау үшін эксперименттік база жасайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу in vitro жасушалық желілерінде жүргізілді; нәтижелер мінез-құлықты басқарудың іргелі мүмкіндігін көрсетеді, бірақ қосымша тексерулерсіз күрделі ағзаларға тікелей қолданылуы мүмкін емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"uzhymdykh-koeshi-khon-zhaene-sintetikalykh-biologiya\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#uzhymdykh-koeshi-khon-zhaene-sintetikalykh-biologiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұжымдық көші-қон және синтетикалық биология&lt;/span&gt;&lt;/a&gt;Ұжымдық көші-қон және синтетикалық биология&lt;/h4&gt;\n&lt;p&gt;Ұжымдық көші-қон топтарға жеке дара қол жеткізе алмайтын міндеттерді орындауға мүмкіндік береді. Бұған құстардың жыртқыштардан қашу үшін қозғалысын үйлестіруі, құмырсқалардың қорек іздеу үшін феромон іздерін нығайтуы, сондай-ақ иммундық жасушалардың көші-қоны мен жаралардың жазылуы мысал бола алады. Бақылаулар, ақпарат тасымалдаушыларға әсер ету және математикалық модельдеу арқылы ғалымдар жергілікті өзара әрекеттесулердің популяция ауқымындағы қозғалысты қалай қалыптастыратынын зерттеді. Алайда, әртүрлі жүйелер арасындағы жалпы қағидаларды түсіну қиын болып қалуда. Авторлар жасушааралық өзара әрекеттесу ережелерін синтетикалық қайта бағдарламалау арқылы жаңа тәсілді ұсынды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Авторлар жасушалардың көші-қон процесін басқарудың синтетикалық әдісін әзірледі, мұнда биологиялық сигналдар бағдарламалық қамтамасыз етумен алмастырылады, бұл жасушаларды генетикалық қайта құрусыз өзара әрекеттесу логикасын тез өзгертуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Синтетикалық биология жүйе логикасын нөлден құру арқылы оны түсінуді тексеруге мүмкіндік береді. Бұрын бұл тәсіл биологиялық осцилляторларды, жасуша күйінің өзгеруін және көп жасушалы құрылымдарды қалыптастыруды зерттеуде қолданылған. Авторлар ұжымдық көші-қонды бағдарламалауға болатын процеске айналдыруды мақсат етті. Дәстүрлі әдістер әр тәжірибе үшін жаңа генетикалық конструкцияларды жасауды талап етеді, бұл айларға созылуы мүмкін. Жаңа тәсіл кері байланысы бар оптогенетикалық басқаруды пайдаланады, мұнда «кіріс-шығыс» ережелері бағдарламалық кодпен белгіленеді, бұл итерациялар арасындағы уақытты минуттарға дейін қысқартады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оптогенетика — жарық көмегімен жасушалар қызметін басқару әдісі, мұнда жарыққа сезімтал ақуыздар жасушалық процестерді белсендіреді немесе тежейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"baskharu-zhuejesining-arhitekturasy-cmi\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#baskharu-zhuejesining-arhitekturasy-cmi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басқару жүйесінің архитектурасы (CMI)&lt;/span&gt;&lt;/a&gt;Басқару жүйесінің архитектурасы (CMI)&lt;/h4&gt;\n&lt;p&gt;Өзара әрекеттесу ережелерін қайта жазу үшін авторлар CMI (Cell-Machine Interface) жүйесін жасады. Ол үш компоненттен тұрады: жасуша күйін оқу (компьютерлік көру жүйесі), мінез-құлықты басқару (субжасушалық оптогенетика) және олардың арасындағы кіріс-шығыс қатынасын белгілейтін тұйық контур (Сурет 1A). Жүйе өткен жасуша әрекеттерін белгіленген алгоритм бойынша келесі оптогенетикалық стимуляциямен байланыстырады (Сурет 1B). Орындаушы механизм ретінде фосфоинозитид-3-киназаның (opto-PI3K) оптогенетикалық белсендірілуі қолданылды (Сурет 1C, Сурет SN 1).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell-f1.jpg\" alt=\"Сурет 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 1&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу жасушалық модельдерде жүргізілген; басқару қағидаларын күрделі организмдерге көшіру қосымша тексерулерді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;CMI жүйесі жасушаларға құстар сияқты топталуға (Сурет 2, Сурет SN 2–4), навигациялық міндеттерді бірлесіп шешуге (Сурет 3, Сурет SN 5) және нейтрофилдер сияқты топ болып қозғалуға (Сурет 4, Сурет SN 6–7) мүмкіндік берді. Алғашқы сынақ ретінде екі жасушаның соқтығысуын бағдарламалау жүзеге асырылды. Әр жасушаны көршісінің қозғалысына перпендикуляр бағыттайтын ереже жасушалардың жылдамдығы мен траекториясын бір-біріне бейімдеуіне әкелді (Сурет 1D, Сурет SN 1). Бұл ұжымдық мінез-құлық компьютерлік интерфейс арқылы жүзеге асырылған жергілікті ережелер негізінде туындауы мүмкін екенін және жасуша әрекеті мен басқару алгоритмі арасында өзара байланыс бар екенін дәлелдейді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell-f2.jpg\" alt=\"2-сурет: Құстар тобының қозғалыс ережелері миграциядағы жасушалардың ұжымдық өзін-өзі ұйымдастыруын анықтайды.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: Құстар тобының қозғалыс ережелері миграциядағы жасушалардың ұжымдық өзін-өзі ұйымдастыруын анықтайды.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сурет: Құстар тобының қозғалыс ережелері миграциядағы жасушалардың ұжымдық өзін-өзі ұйымдастыруын анықтайды. Біз тірі жасушаларды құстар тобының классикалық ережелері негізінде өзара әрекеттесуге қайта бағдарламалауға тырыстық. A) Құстар тобының қозғалысы индивидтер өз қозғалысын жеті жақын көршісімен үйлестіргенде пайда болады деп есептеледі. B) Бұл ережені CMI көмегімен жүзеге асыру әдетте үйлестірілмеген HL-60 жасушаларының (сол жақта) топтарға (ортада, оң жақта) өзін-өзі ұйымдастыруына әкелді. C) 7 көршіден тұратын топ үшін CMI ережесі іске қосылғанға дейін (үзік сызықтан сол жақта) және одан кейін симуляцияланған (қара сызық) және эксперименталды (көгілдір нүктелер) популяциялардың уақыт өте келе орташа поляризациясы. D) Құстар тобының симуляцияларында әрбір индивид өз қозғалысын орташа есептейтін көршілер саны ұжымдық мінез-құлықты басқаратын негізгі параметр болып табылады. Бұл параметрді тірі құстарда манипуляциялау қиын, бірақ CMI көмегімен тірі жасушаларда тез және дәл өзгертілуі мүмкін, бұл поляризацияның күтілетін сандық өзгерістеріне әкеледі. B панелінде трек сегменттері қозғалыс бұрышына қарай түспен кодталған, масштаб сызығы — 100 мкм, барлық суреттер бірдей масштабта. Сұр көрсеткілер C панеліндегі тиісті уақыт нүктелеріне нұсқайды. C-дағы қателіктер симуляция нәтижелері бойынша жалпы поляризацияның орташа стандартты қатесін (SEM) білдіреді, штрихталған аймақ — бұрыштық жылдамдық параметрінің бір стандартты ауытқуына (+/-) тең симуляция (әдіс мәліметтерін қараңыз).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell-f3.jpg\" alt=\"3-сурет: Жаһандық үйлестіру ұжымдық хемотаксистік бағыттауды күшейтеді.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет: Жаһандық үйлестіру ұжымдық хемотаксистік бағыттауды күшейтеді.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-сурет: Жаһандық үйлестіру ұжымдық хемотаксистік бағыттауды күшейтеді. Кейін біз үйлестіру жасуша ұжымдарына нақты биологиялық мәселелерді шешуге мүмкіндік беретінін немесе бермейтінін зерттедік. A) HL-60 жасушалары хемотаксистік градиенттерді сезеді және оларға айтарлықтай көп жасушалы үйлестірусіз жеке индивидтер сияқты жауап береді (жоғарғы панель). Біз жасушаларды популяцияның орташа қозғалыс векторына бағыттау үшін жаһандық үйлестіру ережесін енгіздік (төменгі панель). B) Градиенттерді жеке индивидтер сияқты түсіндіретін жасушалар тек қайнар көз жанында хемоаттрактанттар бойынша теңестірілуі мүмкін (жоғарғы панель). Біз синтетикалық түрде үйлестірілген жасушалар өз сезімталдық диапазонын кеңейтеді деп болжадық (төменгі панель). C) CMI арқылы қозғалысты жаһандық үйлестіру (төменде) осы үйлестіруге ие емес жасушаларға қарағанда градиентті жақсырақ қабылдауды қамтамасыз етеді (жоғарыда); екі жасуша тобы да бір көру аймағында, бірақ CMI тек төменгі жасушаларда іске қосылған. D) Үш биологиялық қайталау бойынша уақыт өте келе орташа хемотаксистік индекс +/- SEM. Тік сызықтар сәйкесінше хемотаксистік градиент пен CMI ережесінің басталуын білдіреді. CMI көмегімен жасушалардың жаһандық үйлесуі популяция үшін градиентті қабылдауды айтарлықтай жақсартады. E) Хемотаксистік градиенттің сол жақ шетінен қашықтыққа қарай орташа хемотаксистік индекс. CMI хемоаттрактант көзіне жақын және алыс жерде градиент бойынша жоғары теңестірілуге әкелді, CMI жоқ жасушалар болса көзден алыста әлсіз теңестірілуге ие болды. Мәліметтер D-дағы плато бойынша (45-60 минут) 3 биологиялық қайталау бойынша +/- SEM-мен топталған. C-дағы масштаб сызығы — 500 мкм.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell-f4.jpg\" alt=\"4-сурет: Синтетикалық сигнал релелері ұзақ қашықтықтарда тартуды күшейту үшін бағыттаушы ақпаратты таратады.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет: Синтетикалық сигнал релелері ұзақ қашықтықтарда тартуды күшейту үшін бағыттаушы ақпаратты таратады.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-сурет: Синтетикалық сигнал релелері ұзақ қашықтықтарда тартуды күшейту үшін бағыттаушы ақпаратты таратады. Біздің алдыңғы тәжірибемізде (3-сурет) жасушалар жаһандық деңгейде үйлескен еді. Мұнда біз неитрофилдердің топталу ережелерінен шабыттанған жергілікті үйлестіруді сынаймыз. A) Неитрофилдер топталуы кезінде зақымдану және инфекция орындарына жеткен бастамашы жасушалар екінші реттік хемоаттрактантты шығару арқылы қосымша жасушаларды тартады. Бұл сигнал жақын маңдағы жасушаларды өзіне тартады және оларды өздері де хемоаттрактант бөлуге итермелейді, бұл тез таралатын өзін-өзі күшейтетін сигнал релесін құрайды. B) Біз тірі жасушаларда виртуалды хемотаксис және реле ережелерін жүзеге асыру үшін CMI қолдандық. Компьютер виртуалды хемоаттрактанттың өндірілуі мен диффузиясын симуляциялайды, тірі жасушалар болса CMI басқаратын миграция арқылы туындайтын градиенттерді сезеді және оларға жауап береді. Жеткілікті мөлшердегі виртуалды хемоаттрактант әсеріне ұшыраған жасушалар екінші реттік көздерге айналып, регенеративті реле құрайды. C) Тек хемотаксис ережесін қолданатын жасушалармен (жоғарыда) салыстырғанда, реле ережесімен де бағдарламаланған популяциялар (төменде) виртуалды хемоаттрактант толқынын бүкіл көру аймағы бойынша таратты. D) Реле жасушалардың мақсатқа тартылуын айтарлықтай күшейтті. E) Бағыттаушы ақпарат жасушадан жасушаға берілгендіктен, бұл табиғи неитрофил топтарында байқалғандай, жасушалардың мақсат бойынша теңестірілу толқынының таралуына әкеледі (үзік көрсеткі, оң жақта). Реле жоқ жасушалар тек мақсат жанында теңестіріледі. C-дағы масштаб сызығы — 200 мкм, суреттер шамамен 8, 16 және 30-минуттарға сәйкес келеді. D-да штрихталған аймақ үш техникалық қайталау бойынша бастапқы тығыздықтан орташа өзгеріс +/- SEM. Стьюденттің t-критерийі: p=0,03.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"zhasushalardyng-uzhymdykh-minez-khulkhyn-baghdarlamalau\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#zhasushalardyng-uzhymdykh-minez-khulkhyn-baghdarlamalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жасушалардың ұжымдық мінез-құлқын бағдарламалау&lt;/span&gt;&lt;/a&gt;Жасушалардың ұжымдық мінез-құлқын бағдарламалау&lt;/h4&gt;\n&lt;p&gt;Зерттеушілер құстар тобының мінез-құлық ережелерін HL60 нейтрофил тәрізді жасушаларына қолданды. Табиғатта құстар өз қозғалысын жеті жақын көршісіне сәйкестендіреді. HL60 жасушалары көре алмайтындықтан, ғалымдар микроскоп пен компьютер арқылы көршілердің қозғалысын қадағалайтын және оптогенетикалық PI3K белсендіруі арқылы жасуша қозғалысын бағыттайтын компьютерлік интерфейсті (CMI) пайдаланды (Сурет 2A). Сыртқы басқарусыз HL60 жасушалары ретсіз қозғалады (Сурет 2B-C, сол жақта). «Жеті көрші» ережесі енгізілгенде, жасушалар өздігінен топ құрып, бірлесіп бағытты өзгерте бастады (Сурет 2B-C, орта-оң жақта), бұл популяция поляризациясының артуына әкелді (Сурет 2C).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Жеті көрші» алгоритмін пайдалану HL60 жасушаларына топтық мінез-құлықты имитациялауға және популяция поляризациясын айтарлықтай арттыруға мүмкіндік берді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CMI (Cell-Machine Interface) — жасушалардың мінез-құлқын нақты уақыт режимінде басқару үшін микроскопия, компьютерлік қадағалау және оптогенетиканы біріктіретін жүйе.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу in vitro HL60 жасушалық желісінде жүргізілді; бұл механизмдерді тірі ағзаларға көшіру қосымша тексерулерді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"modeldeu-zhaene-oezara-aerekettesu-parametrlerin-baptau\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#modeldeu-zhaene-oezara-aerekettesu-parametrlerin-baptau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модельдеу және өзара әрекеттесу параметрлерін баптау&lt;/span&gt;&lt;/a&gt;Модельдеу және өзара әрекеттесу параметрлерін баптау&lt;/h4&gt;\n&lt;p&gt;Өзара әрекеттесудің ұжымдық мінез-құлыққа әсерін тексеру үшін авторлар HL60 көші-қон жылдамдығы, ротациялық диффузия және оптогенетикалық басқаруға жауап параметрлеріне бейімделген агенттік модель жасады. Модель көршілер санының екеуге дейін азаюы поляризацияны төмендететінін, ал онға дейін артуы оны күшейтетінін болжады (Сурет 2D). Тірі жасушалардағы тәжірибелер бұл болжамдарды растады (Сурет 2D, Сурет SN). Бұл тәсіл биологиялық жүйені өзгертпей, бағдарламалық қамтамасыз ету арқылы өзара әрекеттесу параметрлерін икемді өзгертуге және теориялық модельдерді нақты жасушалардың мінез-құлқымен салыстыруға мүмкіндік береді.&lt;/p&gt;\n&lt;h4 id=\"uzhymdykh-hemotaksis-zhaene-navigaciya\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#uzhymdykh-hemotaksis-zhaene-navigaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұжымдық хемотаксис және навигация&lt;/span&gt;&lt;/a&gt;Ұжымдық хемотаксис және навигация&lt;/h4&gt;\n&lt;p&gt;Ғалымдар жасушалар тобының навигациялық тапсырмаларды жеке жасушаларға қарағанда тиімдірек шеше алатынын тексерді. Әдетте HL60 жасушалары fMLP пептидінің градиентіне тек қайнар көзіне жақын жерде жауап береді. Бұл шектеуді жеңу үшін CMI жүйесі енгізілді, мұнда әрбір жасуша өз қозғалысын бүкіл популяцияның орташа векторына сәйкестендіреді (Сурет 3A). Бұл градиент әсеріндегі жасушаларға бағыт туралы ақпаратты қалғандарына жеткізуге мүмкіндік береді (Сурет 3B). Фотобелсендірілетін fMLP аналогы арқылы градиент жасалғанда, CMI белсендірілген популяциялар бақылау тобына қарағанда айтарлықтай жоғары хемотаксис индексін көрсетті (Сурет 3C-D). Тәжірибе соңында CMI тобындағы хемотаксис индексі бақылау тобындағыдан екі есе жоғары болды және fMLP қайнар көзінен алыста да жоғары деңгейде сақталды (Сурет 3E).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CMI арқылы үйлестіру жасушаларға fMLP градиенті бойымен тиімді қозғалуға мүмкіндік берді, хемотаксис индексі бақылау деңгейінен 2 есе жоғары болды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zhasushalykh-toptardaghy-himiyalykh-signaldanudy-modeldeu\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#zhasushalykh-toptardaghy-himiyalykh-signaldanudy-modeldeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жасушалық топтардағы химиялық сигналдануды модельдеу&lt;/span&gt;&lt;/a&gt;Жасушалық топтардағы химиялық сигналдануды модельдеу&lt;/h4&gt;\n&lt;p&gt;Алдыңғы тәжірибелерде (Сурет 3) қозғалыс бағыты туралы ақпарат бүкіл популяцияға лезде таратылды. Табиғи жағдайда жасушааралық байланыс кеңістік пен уақытпен шектелген, мысалы, сигналдық молекулалардың диффузиясы арқылы. Нейтрофилдердің топтасуы (swarming) кезінде зақымданған аймаққа жеткен алғашқы жасушалар LTB4 липидін бөледі. Бұл лиганд басқа жасушаларды тартып қана қоймай, оларды да LTB4 бөлуге итермелеп, өзін-өзі күшейтетін релелік толқын тудырады (Сурет 4A). Біз қолданатын HL60 жасушалары әдетте топтаспайтындықтан, біз оларды компьютерлік өзара әрекеттесу (CMI) арқылы қайта бағдарламалауға тырыстық. Жүйе нақты уақыт режимінде виртуалды сигналдық молекулалардың диффузиясын есептейді, ал оптогенетикалық стимуляция жасушаларды градиент бойымен қозғалуға мәжбүрлейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CMI (computer-mediated interaction) — компьютер жасушалардың мінез-құлқын бақылап, оптогенетика арқылы олардың миграциясын басқаратын және жасанды орта жасайтын әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Алдымен біз жасушаларға виртуалды хемоаттрактант градиентімен жоғары қарай қозғалуға мүмкіндік беретін CMI ережесін енгіздік. Жүйе әр жасуша үшін жергілікті градиентті есептейді және миграцияны басқару үшін опто-PI3K қолданады (Сурет 4B). Тұрақты виртуалды сигнал көзі болған кезде, HL60 жасушалары нақты химиялық зат болмаса да, көздің айналасында жинала бастады (Сурет 4C, 4D, Сурет SN 6). Алайда, бағытталған қозғалыс тек көзіне жақын орналасқан жасушаларда байқалды (Сурет 4E сол жақта).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Базалық хемотаксис моделі жасушалардың көз айналасында жиналуына мүмкіндік берді, бірақ әсер ету радиусы шектеулі болды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Молекулалық релені қайталау үшін біз екінші ереже қостық: егер жергілікті виртуалды хемоаттрактант концентрациясы белгіленген шектен асса, жасуша виртуалды хемоаттрактант көзіне айналады (Сурет 4B). Бұл тірі жасушалар сигналды сезіп қана қоймай, оны қайта тарататын жүйені жасауға мүмкіндік берді.&lt;/p&gt;\n&lt;p&gt;Тексеру үшін біз таза хемотаксисті реле ережесімен салыстырдық. Релені енгізу бастапқы көз айналасында жасушалардың жиналуын айтарлықтай арттырды (Сурет 4C, 4D, Сурет SN 7). Бастапқы сигналды анықтаған алғашқы жасушалар екінші реттік көздерге айналып, бүкіл көру аймағы бойынша таралатын виртуалды сигнал толқынын бастады (Сурет 4C-D, Сурет SN 7). Бұл толқын жасушалардың көз жағына бағытталған қозғалысымен бірге жүрді (Сурет 4E оң жақта), бұл бастапқы сигналдың әсер ету аймағынан тыс жасушаларды да тартуға мүмкіндік берді. Релесіз популяцияларда мұндай эффектілер байқалмады (Сурет 4C, 4D, 4E).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу HL60 жасушалық желісінде жасанды оптогенетикалық жүйе көмегімен жүргізілді; бұл механизмдердің тірі ағзаларға қолданылуы қосымша дәлелдерді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;h4 id=\"uzhymdykh-minez-khulykhtyng-zhanga-formalary\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#uzhymdykh-minez-khulykhtyng-zhanga-formalary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұжымдық мінез-құлықтың жаңа формалары&lt;/span&gt;&lt;/a&gt;Ұжымдық мінез-құлықтың жаңа формалары&lt;/h4&gt;\n&lt;p&gt;Біздің зерттеуіміз жасушааралық өзара әрекеттесудің қарапайым ережелерін өзгерту ұжымдық ұйымдасудың жаңа түрлерін және жеке жасушаларда кездеспейтін қабілеттерді қалыптастыру үшін жеткілікті екенін көрсетеді. Біз құс топтары мен нейтрофилдердің шоғырлануы сияқты әртүрлі жүйелерден алынған ережелерді бірыңғай жасушалық платформада қолдандық. Бұл ұжымдық мінез-құлықтың негізгі сипаттамалары биологиялық механизмдерге емес, жергілікті өзара әрекеттесу логикасына байланысты екенін анықтауға мүмкіндік берді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жергілікті өзара әрекеттесу логикасы жасушалардың ұжымдық қабілеттерін анықтайды және оларға күрделі биологиялық жүйелерге еліктеуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жасушааралық өзара әрекеттесу жасушалардың сыртқы тітіркендіргіштерге жауап беру қашықтығын кеңейтеді. Біз үйлестірудің екі стратегиясын көрсеттік: ақпаратты бүкіл популяция бойынша тарату және жасушадан жасушаға дәйекті түрде жеткізу. Бірінші жағдайда, хемоаттрактант көзінен алыс орналасқан жасушалар деректерді оған жақын жасушалардан алады. Екінші жағдайда, ақпарат жергілікті байланыстар арқылы біртіндеп таралады. Осы өзара әрекеттесу архитектурасы сигналдарды тарату тәсілдерін және ұжымның пайда болатын қасиеттерін тікелей анықтайды.&lt;/p&gt;\n&lt;h4 id=\"zhasusha-mashina-interfejsi-zertteu-khuraly-retinde\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#zhasusha-mashina-interfejsi-zertteu-khuraly-retinde\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;«Жасуша-машина» интерфейсі зерттеу құралы ретінде&lt;/span&gt;&lt;/a&gt;«Жасуша-машина» интерфейсі зерттеу құралы ретінде&lt;/h4&gt;\n&lt;p&gt;«Жасуша-машина» интерфейсі (CMI) бұл ережелерді эксперименталды тексеру үшін қуатты платформа болып табылады. Өзара әрекеттесу ережелері бағдарламалық түрде белгіленіп, тірі жасушалармен орындалатындықтан, CMI дәстүрлі молекулалық әдістермен жүзеге асыру қиын модельдерді, мысалы, көршілердің қозғалысын нақты уақытта бақылауды жүзеге асыруға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CMI — бұл бағдарламалық басқару мен тірі жасушаларды біріктіретін жүйе, мұнда жасушалардың мінез-құлық ережелері алгоритмдік түрде белгіленеді және жарыққа сезімтал атқарушы механизмдер арқылы орындалады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бұл жұмыс ұжымдық көші-қонға бағытталған; бұл қағидаларды басқа биологиялық процестерге қолдану қосымша зерттеулерді талап етеді және дәлелденген факт емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бағдарламалық басқару жасушалық жүйені өзгертпей, өзара әрекеттесу ережелерін жылдам және дәл өзгертуге мүмкіндік береді. Бұл теориялық модельдер мен эксперименттер, сондай-ақ табиғи және синтетикалық үйлестіру тәсілдері арасында тікелей көпір жасайды. Қазіргі зерттеу көші-қонға бағытталғанымен, ұсынылған тәсіл жасуша күйін микроскопия арқылы өлшеуге және жарықпен реттелетін актуаторлар арқылы басқаруға болатын кез келген процестерге қолданылуы мүмкін. Жергілікті ережелерді бағдарламалау көпжасушалы ұйымдар кеңістігін зерттеуге мүмкіндік береді, бұл табиғи ұжымдардың қағидаларын түсінуге және табиғатта кездеспейтін мінез-құлықтың жаңа формаларын жобалауға көмектеседі.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"zhasushalardy-kultivaciyalau\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#zhasushalardy-kultivaciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жасушаларды культивациялау&lt;/span&gt;&lt;/a&gt;Жасушаларды культивациялау&lt;/h4&gt;\n&lt;p&gt;Жұмыста Генри Борн зертханасынан алынған және STR-профилирлеу арқылы тексерілген HL-60 жасуша желісі қолданылды. Оптогенетикалық желі жарыққа сезімтал AsLov2-SsrA-mTagBFP2-CAAX ақуызын, оның PI3K-мен байланысатын серіктесін (ISH2-EGFP-SspBMicro) және HaloTag-CAAX конструкциясын экспрессиялайды. Дифференцияланбаған жасушалар 25 мМ HEPES және 10% ыстықпен инактивтелген фетальды сиыр сарысуы (FBS) қосылған RPMI 1640 ортасында өсірілді. Жасушалар 37°C және 5% CO₂ жағдайында, 0,2–1,0 млн/мл тығыздықта ұсталды және әр 2–3 күн сайын субкультивацияланды. Нейтрофиль тәрізді қозғалмалы жасушаларды алу үшін 1 млн жасуша 1,4% DMSO қосылған 5 мл ортада 4–5 күн бойы инкубацияланды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HL-60 — адамның промиелоцитарлық лейкемия желісі, ол DMSO сияқты заттардың әсерінен нейтрофилдерге тән морфология мен функцияларға ие жасушаларға дифференциялана алады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"mikroskopiyagha-arnalghan-zhasushalardy-dajyndau\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#mikroskopiyagha-arnalghan-zhasushalardy-dajyndau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Микроскопияға арналған жасушаларды дайындау&lt;/span&gt;&lt;/a&gt;Микроскопияға арналған жасушаларды дайындау&lt;/h4&gt;\n&lt;p&gt;Жасушалар балқу температурасы төмен агароз қабаты мен 96-ұяшықты планшеттің шынысы арасында суретке түсірілді. Плазмалық мембрана HaloTag-CAAX-пен конъюгацияланған JaneliaFluor JFX549 бояуымен, ал ядролар (Сурет 2–4) Spy650-DNA көмегімен белгіленді. Жасушалар 200 rcf жылдамдықта 10 минут центрифугаланды, 1 мкМ JFX549 және Spy650-DNA (өндіруші ұсынғаннан 2 есе жоғары концентрацияда) бар RPMI ортасында ресуспендирленді және 37°C-та 1 сағат инкубацияланды. Жуылғаннан кейін жасушалар 2% FBS бар ортаға ауыстырылды. Шыны беттері 5% Hellmanex III ерітіндісінде ультрадыбыс көмегімен тазартылды, жуылды, кептірілді және плазмамен өңделді. Ұяшықтар 2% сиыр сарысуы альбуминімен қапталды. 0,9% агароз жастықшалары 2% FBS қосылған RPMI 1640 ортасында дайындалды. Жасушалар 10 минут бойы тұнуы үшін қалдырылды, содан кейін агароз жастықшаларымен жабылды. fMLP градиенттері жоқ тәжірибелерде (Сурет 3) миграцияны бірқалыпты стимуляциялау үшін агарозға 10 нМ fMLP қосылды.&lt;/p&gt;\n&lt;h4 id=\"mikroskopiya-zhabdykhtary\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#mikroskopiya-zhabdykhtary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Микроскопия жабдықтары&lt;/span&gt;&lt;/a&gt;Микроскопия жабдықтары&lt;/h4&gt;\n&lt;p&gt;Сурет 1-дегі тәжірибелер Borealis сәуле қалыптастыру блогымен, CSU-W1 spinning-disk, iXon Ultra EMCCD камерасымен және лазерлік модульмен (405, 488, 561, 638 нм) жабдықталған Nikon Eclipse Ti инверттелген микроскопында өткізілді. Nikon 20x NA 0,75 (Сурет 1A) және 40x NA 0,95 (Сурет 1B) объективтері қолданылды. Оптогенетикалық стимуляция 470 нм LED және DMD модулі арқылы жүзеге асырылды. Басқа тәжірибелер Nikon Ti2 жүйесінде, CrestOptics X-Light V3 spinning-disk, Lumencor Celesta жарық көзі, Nikon 10x CFI Plan Apo Lambda объективі, Photometrics Kinetix sCMOS камерасы және 365/488 нм LED-і бар Mightex Polygon1000 DMD жүйесінде орындалды. Жабдықтар μManager немесе Pycro-Manager бағдарламалары және CyborgScope платформасы арқылы басқарылды.&lt;/p&gt;\n&lt;h4 id=\"hemotaktikalykh-gradientterdi-zhasau\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#hemotaktikalykh-gradientterdi-zhasau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Хемотактикалық градиенттерді жасау&lt;/span&gt;&lt;/a&gt;Хемотактикалық градиенттерді жасау&lt;/h4&gt;\n&lt;p&gt;fMLP градиенттерімен өткізілген тәжірибелер (Сурет 3) үшін агароз жастықшаларына 500 нМ Nv-fMLP қосылды. Бұл fMLP туындысы UV сәулелену әсерінен қорғаушы топ алынбағанша жасушалар үшін белсенді емес болып табылады. Кеңістіктік градиент DMD модулі көмегімен UV өрнектерін оптогенетикалық стимуляция үшін көк жарықпен алмастыра қолдану арқылы жасалды.&lt;/p&gt;\n&lt;h4 id=\"platforma-interfejsa-kletka-mashina-cmi\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#platforma-interfejsa-kletka-mashina-cmi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Платформа интерфейса «клетка-машина» (CMI)&lt;/span&gt;&lt;/a&gt;Платформа интерфейса «клетка-машина» (CMI)&lt;/h4&gt;\n&lt;p&gt;Платформа CyborgScope построена на базе программного обеспечения с открытым исходным кодом Pycro-Manager и μManager. Система позволяет управлять микроскопом в режиме замкнутого цикла с помощью скриптов на Python. Рабочий цикл состоит из получения изображений, анализа состояния клеток и настройки оборудования микроскопа (включая световые стимулы) в соответствии с биологическими правилами. Все метаданные и параметры стимуляции сохраняются автоматически. Интерфейс на базе Napari позволяет просматривать изображения и осуществлять ручное управление в режиме реального времени.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Замкнутый цикл управления (closed-loop control) — это процесс автоматической корректировки системой своих действий для поддержания состояния объекта на основе данных, полученных в реальном времени.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"segmentaciya-izobrazhenij,-treking-i-optogeneticheskaya-stimulyaciya\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#segmentaciya-izobrazhenij,-treking-i-optogeneticheskaya-stimulyaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сегментация изображений, трекинг и оптогенетическая стимуляция&lt;/span&gt;&lt;/a&gt;Сегментация изображений, трекинг и оптогенетическая стимуляция&lt;/h4&gt;\n&lt;p&gt;Для идентификации клеток использовался сигнал HaloTag-CAAX, конъюгированный с JFX549. Обработка изображений (сглаживание, определение пороговых значений, очистка от шумов) осуществлялась с помощью библиотеки scikit-image. Отслеживание центров мембранного сигнала выполнялось с помощью библиотеки trackpy. Для управления движением световые точки направлялись к краям клеток, при этом угол поворота для каждого кадра ограничивался текущим вектором движения клетки.&lt;/p&gt;\n&lt;h4 id=\"algoritm-stolknoveniya-kletok-cmi\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#algoritm-stolknoveniya-kletok-cmi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Алгоритм столкновения клеток CMI&lt;/span&gt;&lt;/a&gt;Алгоритм столкновения клеток CMI&lt;/h4&gt;\n&lt;p&gt;Алгоритм управления (Рис. 1D) реализован в скрипте crash_test_acquisition.py. Система выбирает две ближайшие клетки и вычисляет точки, вызывающие столкновение под углом θ = 90^°. Выбор производится на основе скалярного произведения векторов. Вычисления обновляются в каждом кадре, что позволяет адаптироваться к изменениям скорости и траектории клетки.&lt;/p&gt;\n&lt;h4 id=\"algoritm-gruppovogo-dvizheniya-kletok-cmi\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#algoritm-gruppovogo-dvizheniya-kletok-cmi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Алгоритм группового движения клеток CMI&lt;/span&gt;&lt;/a&gt;Алгоритм группового движения клеток CMI&lt;/h4&gt;\n&lt;p&gt;Алгоритм управления (Рис. 2) представлен в файле cyborg_flock_acquisition.py. Для поиска n ближайших соседей используется алгоритм KDTree из библиотеки SciPy. Средний угол направления соседей определяет направление оптогенетического воздействия на клетку.&lt;/p&gt;\n&lt;h4 id=\"modelirovanie-kletok-hl-60\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#modelirovanie-kletok-hl-60\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Моделирование клеток HL-60&lt;/span&gt;&lt;/a&gt;Моделирование клеток HL-60&lt;/h4&gt;\n&lt;p&gt;Симуляция группового движения построена на модели активных броуновских частиц с периодическими граничными условиями в двухмерном пространстве. Частицы движутся с постоянной скоростью и подвергаются ротационной диффузии с гауссовским шумом. Управляющий сигнал ограничен максимальной скоростью поворота. Топологическое выравнивание рассчитывается как сумма векторов n ближайших соседей в зоне контроля.&lt;/p&gt;\n&lt;h4 id=\"khozghalys-parametrlerin-anykhtau-zhaene-uzhymdykh-navigaciya-algoritmi\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#khozghalys-parametrlerin-anykhtau-zhaene-uzhymdykh-navigaciya-algoritmi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қозғалыс параметрлерін анықтау және ұжымдық навигация алгоритмі&lt;/span&gt;&lt;/a&gt;Қозғалыс параметрлерін анықтау және ұжымдық навигация алгоритмі&lt;/h4&gt;\n&lt;p&gt;Элементарлы белсенді бөлшектердің қасиеттері, соның ішінде ротациялық диффузия мен жылдамдық, оптогенетикалық басқарусыз HL-60 жасушаларының орташа квадраттық ығысуларын аппроксимациялау арқылы анықталды. Жасушалардың максималды бұрылу жылдамдығы алдыңғы зерттеулерден алынды. Ұжымдық навигация (CMI) алгоритмі кері байланыс процедурасы арқылы жүзеге асырылады, мұнда fMLP градиентін тудыратын УК-фотостимуляция нұсқаулары қозғалысты басқару үшін көк жарықпен кезектесіп отырады. CMI аймағындағы барлық жасушалардың орташа қозғалыс бұрышы әрбір жасушаның бағытын түзету үшін қолданылады. CMI аймағынан тыс жасушалар градиентті ұжымдық қабылдауға қатыспайды.&lt;/p&gt;\n&lt;h4 id=\"virtualdy-himiyalykh-signaldar-men-retranslyaciyany-modeldeu\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#virtualdy-himiyalykh-signaldar-men-retranslyaciyany-modeldeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Виртуалды химиялық сигналдар мен ретрансляцияны модельдеу&lt;/span&gt;&lt;/a&gt;Виртуалды химиялық сигналдар мен ретрансляцияны модельдеу&lt;/h4&gt;\n&lt;p&gt;Виртуалды химиялық сигнал динамикасы диффузия коэффициентін, деградация жылдамдығын және секреция тығыздығын ескеретін екі өлшемді реакция-диффузия теңдеуімен сипатталады. Нақты уақыт режимінде жұмыс істеу үшін диффузия мүшесі Эйлердің жасырын схемасы арқылы интеграцияланады, ал теңдеу сирек торда шешіліп, кейіннен сызықтық интерполяцияланады. Әрбір жасуша өз маскасы бойынша концентрацияны орташалау арқылы жергілікті сигналды сезеді. Қозғалыс бағыты жасушаның масса орталығынан сигнал қарқындылығының ауырлық орталығына дейінгі вектормен анықталады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Реакция-диффузия әдісі — заттың кеңістікте таралуы мен бір уақытта ыдырауы немесе өндірілуінің математикалық сипаттамасы, бұл химиялық градиенттерді модельдеуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Хемотаксис тәжірибелерінде (Сурет 4) сыртқы көз 25×25 пиксель (17×17 мкм) аймаққа виртуалды зат қосады. Ретрансляция тәжірибелерінде жасушалардың өзі сигнал көзіне айналады: th белсендіру шегінен асқанда және жасуша 2,5 пикселден (1,7 мкм) артық ығысқанда, ол ретранслятор күйіне ауысады. Тәжірибе параметрлері: диффузия жылдамдығы 125 мкм/с, секреция жылдамдығы 0,03 нМ/с, анықтау шегі 0,01 нМ және белсендіру шегі 0,05 нМ. Ретрансляциясыз сигнал 160 мкм қашықтықта сөнеді, ал ретрансляциямен белсендіру фронты ~1 мм-ге жетеді (Сурет 4).&lt;/p&gt;\n&lt;h4 id=\"keskinderdi-taldau-zhaene-statistikalykh-koersetkishter\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#keskinderdi-taldau-zhaene-statistikalykh-koersetkishter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кескіндерді талдау және статистикалық көрсеткіштер&lt;/span&gt;&lt;/a&gt;Кескіндерді талдау және статистикалық көрсеткіштер&lt;/h4&gt;\n&lt;p&gt;Жасушаларды бақылау үшін ядролардың орналасуы пайдаланылды, бұл соқтығысу кезінде дәлдікті арттырады. Ядролар Гаусс Лаплас сүзгісі арқылы анықталды. Популяция поляризациясы барлық бөлшектердің орташа бағыт векторының модулі ретінде есептеледі. C(r) функциясы арқылы есептелетін корреляция ұзындығы топтағы жасушалар қозғалысының үйлесімділік дәрежесін сипаттайды.&lt;/p&gt;\n&lt;h4 id=\"korrelyaciya-funkciyasy-men-korrelyaciya-uzyndyghyn-esepteu\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#korrelyaciya-funkciyasy-men-korrelyaciya-uzyndyghyn-esepteu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Корреляция функциясы мен корреляция ұзындығын есептеу&lt;/span&gt;&lt;/a&gt;Корреляция функциясы мен корреляция ұзындығын есептеу&lt;/h4&gt;\n&lt;p&gt;Арнайы корреляция қашықтығын анықтау үшін авторлар логарифмдік биннинг (деректерді топтау) әдісін қолдана отырып C(R) функциясын есептейді. Жылдамдық флуктуациялары талданғандықтан, жеткілікті үлкен қашықтықта корреляция функциясы теріс мәндерді қабылдайды деп күтіледі. Дәрежелік заң (power law) арқылы жылдамдық флуктуацияларындағы корреляция нөлге теңесетін қашықтық анықталады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Логарифмдік биннинг — бұл деректерді топтау әдісі, мұнда интервалдар логарифмдік шкала бойынша өседі, бұл бірнеше шама ретін қамтитын деректерді тиімді талдауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;C(r) функциясын сәйкестендіру үшін жеткілікті статистиканы жинақтау көбінесе бір симуляция немесе эксперименттік уақыт нүктесіндегі деректер көлемінен асып түседі. Эксперименттік деректерді біріктіру үшін тұрақты күйде жиналған барлық C(r) нүктелері біріктіріледі, топталады және бірге талданады. Бұл тәсіл үлкен көлемдегі C(r) деректер жиынына тән n² масштабталу күрделілігін азайтуға көмектеседі.&lt;/p&gt;\n&lt;h4 id=\"uzhymdykh-khozghalys-metrikalary\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#uzhymdykh-khozghalys-metrikalary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұжымдық қозғалыс метрикалары&lt;/span&gt;&lt;/a&gt;Ұжымдық қозғалыс метрикалары&lt;/h4&gt;\n&lt;p&gt;Корреляция ұзындығы метрикасы популяция поляризациясынан өзгеше, өйткені соңғысы жүйені тек тұтас сипаттайды және көршілес жасушалар арасындағы өзара қатынастарды ескермейді. Қорытынды өлшем жасушалар орташа есеппен бір-біріне әсер етпейтін нақты қашықтықты белгілейді.&lt;/p&gt;\n&lt;p&gt;Хемотаксистік индекс жасуша қозғалысы векторы мен бағыт векторы (3-суретте көрсетілген көлденең вектор немесе жасуша ядросынан хемотаксистік қайнар көзге дейінгі вектор, 4-сурет) арасындағы бұрыштың косинусы ретінде есептелді. Қозғалысты кеңістік пен уақыт бойынша топтау параметрлері суреттерді жасау үшін қолданылған кодта көрсетілген.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell-fS1.jpg\" alt=\"Сурет S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S1&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Жасушалық&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;байланысты&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;басқару қиын&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Кері&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;байланысты&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;оптогенетика&lt;/text&gt;&lt;path stroke=\"#1
