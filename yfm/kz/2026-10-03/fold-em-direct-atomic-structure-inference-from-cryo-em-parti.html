&gt;\n&lt;td&gt;AlphaFold3&lt;/td&gt;\n&lt;td&gt;8.21&lt;/td&gt;\n&lt;td&gt;19.29&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;PDB&lt;/td&gt;\n&lt;td&gt;3.39&lt;/td&gt;\n&lt;td&gt;3.47&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 15.&lt;/strong&gt; Белгілі және ab initio құрылымдары үшін MolProbity бағалауы&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Санат&lt;/th&gt;\n&lt;th&gt;Көрсеткіш&lt;/th&gt;\n&lt;th&gt;Мәні 1&lt;/th&gt;\n&lt;th&gt;Мәні 2&lt;/th&gt;\n&lt;th&gt;Мәні 3&lt;/th&gt;\n&lt;th&gt;Мәні 4&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Known&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;MolProbity score&lt;/td&gt;\n&lt;td&gt;1.16&lt;/td&gt;\n&lt;td&gt;1.13&lt;/td&gt;\n&lt;td&gt;1.09&lt;/td&gt;\n&lt;td&gt;1.11&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Clashscore&lt;/td&gt;\n&lt;td&gt;3.72&lt;/td&gt;\n&lt;td&gt;3.40&lt;/td&gt;\n&lt;td&gt;3.01&lt;/td&gt;\n&lt;td&gt;3.16&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Ramachandran outliers&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;0.12&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Ab initio&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;MolProbity score&lt;/td&gt;\n&lt;td&gt;1.39&lt;/td&gt;\n&lt;td&gt;1.48&lt;/td&gt;\n&lt;td&gt;1.44&lt;/td&gt;\n&lt;td&gt;1.46&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Clashscore&lt;/td&gt;\n&lt;td&gt;5.85&lt;/td&gt;\n&lt;td&gt;7.28&lt;/td&gt;\n&lt;td&gt;6.65&lt;/td&gt;\n&lt;td&gt;6.72&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Ramachandran outliers&lt;/td&gt;\n&lt;td&gt;0.12&lt;/td&gt;\n&lt;td&gt;0.12&lt;/td&gt;\n&lt;td&gt;0.12&lt;/td&gt;\n&lt;td&gt;0.25&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;p&gt;Fold’EM — бұл шикі крио-ЭМ кескіндерінен атомдық құрылымдар ансамблі мен бөлшектерге тән кедергі келтіретін айнымалыларды (nuisance variables) бірлесіп анықтайтын әдіс. Ансамбльдің әрбір мүшесі AlphaFold3 диффузиялық моделін шарттайтын аралық Pairformer күйімен сипатталады, ал бөлшектің кедергі айнымалыларына оның кеңістіктегі орны (pose) және гетерогенді үлгілердегі дискретті класы жатады. Процесс бөлшектерді ортақ координаттар жүйесіне келтіруден басталады, содан кейін алгоритм құрылымдық күйлерді жаңарту мен кедергі айнымалыларын нақтылау арасында ауысып отырады. Реконструкцияланған көлемдер тек инициялау және кадрларды теңестіру үшін қолданылады (1-сурет, 1-алгоритм).&lt;/p&gt;\n&lt;h4 id=\"kiris-derekteri,-iniciyalau-zhaene-koordinattar-zhuejesi\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#kiris-derekteri,-iniciyalau-zhaene-koordinattar-zhuejesi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріс деректері, инициялау және координаттар жүйесі&lt;/span&gt;&lt;/a&gt;Кіріс деректері, инициялау және координаттар жүйесі&lt;/h4&gt;\n&lt;p&gt;Fold’EM үшін кіріс деректері ретінде бөлшектер кескіндерінің жиынтығы мен молекулалық тізбек алынады. Пиксель/бокс өлшемі мен CTF параметрлері алдын ала белгілі деп есептеледі, ал бөлшектер орталықтандырылған болуы тиіс. Тізбек — жалғыз құрылымдық кіріс; AlphaFold3 MSA мен болжамды ешқандай сыртқы атомдық модельсіз немесе жоғары ажыратымдылықтағы реконструкциясыз жасайды. Гетерогенді деректер үшін класс саны n көрсетіледі, гомогенді деректер үшін n=1.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Крио-ЭМ (криоэлектронды микроскопия) — биомолекулаларды мұздатылған күйде бейнелеу әдісі, ол молекулалардың табиғи құрылымын сақтауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ab initio режимінде кеңістіктік күйді бағалау үш кезеңде жүреді: (i) VDAM (бейімделгіш моменттері бар градиенттік түсу алгоритмі) кездейсоқ инициялаудан дөрекі көлем мен бөлшек күйлерін бағалайды; (ii) Винер кері проекциясы арқылы консенсустық тығыздық реконструкцияланады; (iii) AlphaFold3 болжамы құрылымдық координаттар жүйесін анықтау үшін осы тығыздыққа орналастырылады. Крио-ЭМ ықтималдығы глобалды қатты трансформацияларға қатысты инвариантты болғандықтан, шешім SE(3) глобалды трансформациясына дейін анықталады және ол барлық бөлшек күйлерін сәйкестендірілген құрылымға қатысты өрнектеу арқылы бекітіледі.&lt;/p&gt;\n&lt;h4 id=\"boelshekterdi-ornalastyru-zhaene-klassifikaciyalau\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#boelshekterdi-ornalastyru-zhaene-klassifikaciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бөлшектерді орналастыру және классификациялау&lt;/span&gt;&lt;/a&gt;Бөлшектерді орналастыру және классификациялау&lt;/h4&gt;\n&lt;p&gt;Класс белгілері белгісіз болғанда, біз B-RECOVAR (bootstrapped residual-subspace estimator) әдісін қолданамыз. Бөлшектер саны аз болғанда cryoDRGN немесе RECOVAR әдістері кластарды әрқашан сенімді ажырата алмайды, сондықтан B-RECOVAR екі күй үшін: (i) класс ауытқу көлемдерін консенсустық реконструкциядан қалған қалдықтарға сәйкестендіреді; (ii) кластар бойынша реконструкциялармен өзара тексеру арқылы тағайындауларды нақтылайды; (iii) спектрлік мета-оқыту арқылы рандомизацияланған кіші таңдамалар нәтижелерін біріктіреді. Екіден көп күйлер үшін дефляция қолданылады. Классификациядан кейін әрбір класс үшін көмекші көлем құрылады (2-алгоритм, D.4-қосымша).&lt;/p&gt;\n&lt;h4 id=\"ansambldik-khorytyndy\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#ansambldik-khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ансамбльдік қорытынды&lt;/span&gt;&lt;/a&gt;Ансамбльдік қорытынды&lt;/h4&gt;\n&lt;p&gt;Құрылымды анықтау процесі бөлшектерге, эталондық құрылымға және олардың өзара бағдарларына (позаларына) негізделеді. Гетерогенді үлгілер үшін деректер классификацияланады, ал позалар сәйкес кластармен синхрондалады. 2-теңдеу құрылымдық күйлерді H және кедергі келтіретін айнымалыларды &lt;span class=\"yfm-latex\" data-content=\"%5Ceta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (бөлшектердің позалары мен кластары) байланыстырады; оларды оңтайландыру &lt;a href=\"concepts/metod-chereduyuschegosya-koordinatnogo-spuska.html\"&gt;координаталық өсу әдісі&lt;/a&gt; арқылы жүзеге асырылады. Әрбір r итерациясында алгоритм алдымен &lt;span class=\"yfm-latex\" data-content=\"%5Ceta%5E%7B(r)%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; бекітілген кезде H^(r+1) құрылымын жаңартады, содан кейін X^(r+1) құрылымы бекітілген кезде &lt;span class=\"yfm-latex\" data-content=\"%5Ceta%5E%7B(r%2B1)%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; айнымалыларын нақтылайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Координаталық өсу әдісі — бұл күрделі оңтайландыру есептерін шешу үшін параметрлердің бір тобын бекітіп, қалғандарын кезектесіп жақсартуға негізделген итеративті тәсіл.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бірінші кезеңде (құрылымды анықтау) H^(r+1) жаңартылуы логарифмдік ықтималдықты максималдау арқылы орындалады (3-теңдеу). Біз IT-Opt тәсіліне ұқсас әдісті қолданамыз, мұнда ықтималдық градиенттері AlphaFold3 латентті күйлеріне жіберіледі. Генеративті модель ретінде диффузиялық процесс (4-теңдеу) қолданылады, мұнда X_T ~ N(0, σ²_T I) нүктесінен t=0 дейінгі кері диффузия g(H) негізінде құрылымды қалыптастырады. Әрбір итерация үшін Q тәуелсіз диффузиялық іске қосу орындалады, бұл ретте H іске қосулар арасында «жад» ретінде сақталады. Әрбір t қадамында латентті күйлер γ_h қадам мөлшерімен градиенттік өсу арқылы жаңартылады (5-теңдеу), бұл AlphaFold генераторын эксперименталды деректермен расталатын конфигурацияларға қарай бағыттайды.&lt;/p&gt;\n&lt;p&gt;Екінші кезеңде (кедергі келтіретін айнымалыларды анықтау) X^(r+1) құрылымы бекітіледі және әрбір k бөлшегі үшін ықтималдық максималданады (6-теңдеу). Бұл позаны &lt;span class=\"yfm-latex\" data-content=\"%5Cphi_k\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (бөлшекті ағымдағы құрылымдарға қатысты теңестіру) және класты c_k (бөлшекті ансамбльдің ең сәйкес мүшесіне жатқызу) нақтылауды қамтиды. Позалар эталондық координаттар жүйесінде өрнектеледі, бұл жаһандық SE(3) калибрлеуінің белгісіздігін жояды. Осы екі қадамның кезектесуі сигнал-шу қатынасы төмен болғанда өте маңызды, себебі позадағы немесе классификациядағы қателер құрылымдық градиенттерді бұрмалауы мүмкін. Диффузияның стохастикалық табиғаты мен мини-батчтарды қолдануға байланысты мақсатты функцияның монотонды жақсаруына кепілдік берілмесе де, бұл тәсіл құрылым мен бөлшек параметрлерін бірлесіп анықтау үшін сенімді негіз болып табылады.&lt;/p&gt;\n&lt;h4 id=\"taezhiribeler\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#taezhiribeler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тәжірибелер&lt;/span&gt;&lt;/a&gt;Тәжірибелер&lt;/h4&gt;\n&lt;p&gt;Біз Fold’EM жұмысын белгілі құрылымдардан алынған синтетикалық бөлшектер мен EMPIAR-дағы эксперименталды жиынтықтар арқылы бағалаймыз (A2 және A1 кестелері). 4.1 және 4.2-бөлімдерде біз екі негізгі жобалық шешімді жеке сынаймыз: реконструкцияланған тығыздық орнына бөлшектердің өзі арқылы басқару және терминалдық эмбеддинг немесе атомдық координаттар орнына аралық Pairformer күйін оңтайландыру. 4.3 және 4.4-бөлімдер гомогенді үлгілер мен екі күйлі қоспалар үшін құрылымды анықтауды бағалайды. Мұнда алдымен белгілі бағыттармен (ориентациялармен), содан кейін ab initio (бөлшектерден анықталған бағыттармен) сынақтар жүргізіледі. Белгілі бағыттар режимінде синтетикалық бөлшектерді рендерингтеу үшін қолданылған немесе эксперименталды деректерді нақтылаудан алынған параметрлер қолданылады. 4.5-бөлім B-RECOVAR көмегімен белгісіз классификацияны, ал 4.6-бөлім үздіксіз гетерогенділікті бағалайды. Егер басқаша көрсетілмесе, біз Cα RMSD және TM-score көрсеткіштерін, сондай-ақ Fourier қабығының корреляциясы (FSC) 0.143 шегінен өтетін дәлдік деңгейін келтіреміз (D.2.4 қосымшасы). Тығыздыққа негізделген базалық әдістер ретінде RELION және cryoDRGN (белгілі бағыттармен), сондай-ақ RELION ab initio және cryoDRGN-AI (оларсыз) қолданылады. Бақылау ретінде AlphaFold3-тің эксперименталды басқарусыз нәтижелері де келтіріледі.&lt;/p&gt;\n&lt;h4 id=\"boelshekter-bojynsha-baskharu-vs-tyghyzdykh-bojynsha-baskharu\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#boelshekter-bojynsha-baskharu-vs-tyghyzdykh-bojynsha-baskharu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бөлшектер бойынша басқару vs. тығыздық бойынша басқару&lt;/span&gt;&lt;/a&gt;Бөлшектер бойынша басқару vs. тығыздық бойынша басқару&lt;/h4&gt;\n&lt;p&gt;Эксперименталды қондырғы. Біз бөлшектердің өзі арқылы басқару, реконструкцияланған тығыздық арқылы басқаруға қарағанда дәлірек құрылымды қалпына келтіре ме, жоқ па, соны тексереміз. Ол үшін біз 8U4E синтетикалық жиынтығын (3 304 қалдық) аламыз және SNR 0.005 кезінде 500 бөлшек бойынша ab initio қорытынды жасаймыз. Консенсус тығыздық бағаланған бағыттар бойынша реконструкцияланады. Базалық әдіс (тығыздық бойынша басқару) сол Pairformer күйін оңтайландырады, бірақ бөлшектер ықтималдығын консенсус тығыздыққа қатысты жоғалту (loss) функциясымен алмастырады.&lt;/p&gt;\n&lt;p&gt;Нәтижелер. Тең мөлшердегі бөлшектерде бөлшектер бойынша басқару жиынтықты қалпына келтіреді, ал тығыздық бойынша басқару — жоқ. AlphaFold3-тің басқарусыз болжамы Cα RMSD 22.99 Å береді. Тығыздық бойынша басқару мұны 17.95 Å-ге дейін төмендетеді, ал Fold’EM 6.88 Å және TM-score 0.809-ға жетеді (A12 кестесі), тығыздық қабығын дәл қадағалайды (2-сурет). 500 бөлшекте тығыздық өрескел болып, ол бөлшектер ықтималдығы функциясын алмастыра алмайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SNR (сигнал-шу қатынасы) — деректер сапасын көрсететін көрсеткіш; мән неғұрлым төмен болса, пайдалы сигналды бөліп алу соғұрлым қиындайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"h-ti-ongtajlandyru-vs-z-zhaene-koordinata-kengistigi\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#h-ti-ongtajlandyru-vs-z-zhaene-koordinata-kengistigi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;H-ті оңтайландыру vs. Z және координата кеңістігі&lt;/span&gt;&lt;/a&gt;H-ті оңтайландыру vs. Z және координата кеңістігі&lt;/h4&gt;\n&lt;p&gt;Эксперименталды қондырғы. Біз аралық Pairformer күйін (H) оңтайландырудың тиімділігін терминалдық эмбеддинг (Z) немесе атомдық координаттарға тікелей әсер етумен салыстырамыз. Сынақтар 9UGB және 8U4B синтетикалық жиынтықтарында (SNR 0.005, 250 немесе 1 000 бөлшек, белгілі бағыттар) өткізілді. Біз Fold’EM-ді IT-Opt және кері диффузия процесінің координаталық басқаруымен салыстырамыз.&lt;/p&gt;\n&lt;p&gt;Нәтижелер. H-ті оңтайландыру ең күшті басқаруды қамтамасыз етеді. Үш әдіс те 9UGB үшін AlphaFold3 болжамын жақсартады, бірақ Fold’EM ең жақсы Cα RMSD, TM-score және FSC дәлдігін көрсетеді. Ірірек 8U4B жиынтығында тек Fold’EM құрылымды қалпына келтіреді, ал басқа әдістер бастапқы болжамды нашарлатады (3-сурет). Айырмашылық ірі жиынтықтарда айқын көрінеді, өйткені Z немесе координаттардың сүзгіден өтпеген жаңартулары модельді эталоннан алыстатады.&lt;/p&gt;\n&lt;h4 id=\"birtekti-uelgilermen-zhumys-isteu-bojynsha-nuskhaulykh\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#birtekti-uelgilermen-zhumys-isteu-bojynsha-nuskhaulykh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Біртекті үлгілермен жұмыс істеу бойынша нұсқаулық&lt;/span&gt;&lt;/a&gt;Біртекті үлгілермен жұмыс істеу бойынша нұсқаулық&lt;/h4&gt;\n&lt;p&gt;Эксперименталды дизайн. Зерттеушілер құрылымның бір конформациялық күйін анықтау үшін қажетті бөлшектердің минималды санын, белгілі бағыттар (poses) және &lt;a href=\"concepts/metod-ab-initio.html\"&gt;ab initio әдісі&lt;/a&gt; арқылы бағалады. Синтетикалық нысандар ретінде (Кесте A2) 9UGB, 9UGC, 8U4B және 8U4E құрылымдары 0.01 және 0.005 сигнал-шуыл қатынасында (SNR) қолданылды. Белгілі бағыттар үшін 100-ден 1000-ға дейін, ab initio үшін 500 бөлшек пайдаланылды. Сондай-ақ бес эксперименталды деректер жиыны (Кесте A1) сыналды: BIIG2 Fab-пен байланысқан интегрин α 5β 1 (9B9J), 9B77, 8PWH және екі UvrA күйі (9GXQ, 9GXR). Белгілі бағыттарда депонирленген бөлшектердің 1/1000-нан 1/50-іне дейін, ал ab initio үшін 9B9J және 9B77-ге 1000, қалғандарына 5000 бөлшек жұмсалды. Нәтижелер базалық әдістермен салыстырылды, мұнда FSC реконструкцияланған тығыздық бойынша, ал Fold’EM үшін атомдық модельден рендерленген карта бойынша есептелді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ab initio әдісі (лат. «басынан») — бұл белгілі үлгілерді немесе бөлшектер бағыттарын қолданбай, «нөлден» құрылым құру тәсілі, ол есептеу ресурстарын көп қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нәтижелер. Синтетикалық деректерде 100 бөлшек белгілі бағыттармен жеткілікті болды. AlphaFold3 Pma1 конформациясын (9UGB) қате болжады (TM-score 0.699, Cα RMSD 8.96 Å; Сурет 4A). Fold’EM 100 бөлшек және 0.005 SNR кезінде 3.25 Å FSC ажыратымдылығына, 0.965 TM-score және 1.01 Å Cα RMSD-ге жетті, бұл депонирленген модельге жақын (3.39 Å; Кесте A5, A6). 9UGC, 8U4B және 8U4E үшін 3.45, 3.80 және 4.18 Å ажыратымдылық пен 0.983, 0.979 және 0.973 TM-score алынды. cryoDRGN және RELION әдістері төменірек нәтиже көрсетті (ажыратымдылық &amp;gt; 5 Å). Бөлшектер санын 1000-ға дейін арттыру Fold’EM нәтижелерін айтарлықтай өзгертпеді. Ab initio режимінде 500 бөлшек 9UGB үшін 3.25 Å ажыратымдылықты (SNR 0.005, TM-score 0.976, Cα RMSD 1.57 Å) қамтамасыз етті, ал RELION және cryoDRGN-AI 8.93 және 27.70 Å көрсетті (Кесте A11, A12).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f4.jpg\" alt=\"4-сурет: Fold’EM атомдық құрылымдарды белгілі позалармен депозиттелген бөлшектердің 0,03%-ынан және ab initio 0,27%-ынан\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет: Fold’EM атомдық құрылымдарды белгілі позалармен депозиттелген бөлшектердің 0,03%-ынан және ab initio 0,27%-ынан қалпына келтіреді.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-сурет: Fold’EM атомдық құрылымдарды белгілі позалармен депозиттелген бөлшектердің 0,03%-ынан және ab initio 0,27%-ынан қалпына келтіреді. Әр баған — бір нысан: сол жақта синтетикалық деректер жиыны (A, C, E, G) және оң жақта эксперименталды (B, D, F, H). Жолдар құрылымдарды (A, B; AlphaFold3 көк түспен, Fold’EM қызыл түспен, депозиттелген модель сұр түспен), өкілдік бөлшектерді (C, D), FSC ажыратымдылығын (E, F) және бөлшектер санына қарай депозиттелген модельге қатысты TM-score-ды (G, H) көрсетеді; толтырылған маркерлер белгілі позаларды, бос маркерлер ab initio-ны, нүктелі сызық AlphaFold3 болжамын білдіреді. Сол жақта: Pma1, ашытқы плазмалық H+-АТФазасы, белсендірілген (E2P) күйінде (9UGB); SNR 0,005 кезіндегі синтетикалық бөлшектер. AlphaFold3 трансмембраналық доменді болжайды, бірақ цитозольдік A-, N- және P-домендерін дұрыс орналастырмайды, олардың орналасуы каталитикалық цикл барысында өзгереді (TM-score 0,70). Fold’EM депозиттелген күйді қалпына келтіреді, белгілі позалармен 100 бөлшектен 3,3 Å және 0,97 TM-score-ға, ал ab initio 500 бөлшектен 3,3 Å-ға жетеді. Оң жақта: Интегрин α5β1–BIIG2 (9B9J, EMPIAR-12552), мұнда AlphaFold3 екі компоненттің фолдын болжайды, бірақ Fab-ты дұрыс емес жерге қояды (TM-score 0,78); антидене–антиген жұптары аз жұптасқан коэволюциялық ақпарат береді. Fold’EM байланысқан кешен мен эпитопты қалпына келтіреді, интерфейстік өзгермелі ілмектер болмаса да, белгілі позалармен 100 бөлшектен 3,5 Å және 0,97 TM-score-ға, ал ab initio 1000 бөлшектен 3,5 Å-ға жетеді; ешқандай базалық әдіс 6 Å-ға жетпейді және Fold’EM тіпті ең аз бөлшектер санында да AlphaFold3-тен асып түседі. Сирек бөлшектер дәлелдері осылайша құрылымдық априорлық біліммен қамтамасыз етілген жаһандық орналасуды түзетеді. Ажыратымдылық (Å; FSC = 0,143).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Эксперименталды деректерде Fold’EM базалық болжамдар болған кезде құрылым дәлдігін арттырады. 9B9J жағдайында AlphaFold3 Fab-фрагментті қате орналастырды (Сурет 4B), бірақ Fold’EM 400 бөлшекпен (ab initio) дұрыс эпитопты анықтап, 3.5 Å-ден жоғары ажыратымдылыққа және 0.9-дан жоғары TM-score-ге қол жеткізді (Сурет 4F, 4H), ал базалық әдістер 6 Å шегінен аса алмады. 9B77, 9GXQ және 9GXR үшін депонирленген бөлшектердің 1/1000 бөлігімен Fold’EM 2.88, 3.08 және 3.18 Å ажыратымдылыққа жетті (Кесте A3). 8PWH ерекше жағдай болды: Fold’EM TM-score-ді 0.397-ден 0.900-ге дейін көтергенімен (Кесте A4), 1/100-ден астам бөлшектермен cryoDRGN және RELION жоғарырақ ажыратымдылық көрсетті (5.16–5.01 Å-ге қарсы 7.06–6.13 Å).&lt;/p&gt;\n&lt;h4 id=\"eki-kuejli-geterogendilik-zhaghdajyndaghy-baghyttau\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#eki-kuejli-geterogendilik-zhaghdajyndaghy-baghyttau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Екі күйлі гетерогенділік жағдайындағы бағыттау&lt;/span&gt;&lt;/a&gt;Екі күйлі гетерогенділік жағдайындағы бағыттау&lt;/h4&gt;\n&lt;p&gt;Эксперименттік дизайн. Авторлар аралас бөлшектер жиынтығынан екі конформациялық күйді ажырату мүмкіндігін зерттеді. Синтетикалық деректер (Pma1 күйлері: 9UGB және 9UGC, Cα RMSD бойынша 9 Å айырмашылық, SNR 0.01 және 0.005, 250–1000 бөлшек) және эксперименттік деректер (EMPIAR-13396, абазикалық сайты бар ДНҚ-мен байланысқан UvrA: 9GXQ және 9GXR, 500–10 000 бөлшек) қолданылды. Ab initio режимінде B-RECOVAR сынып белгілерін инитиализациялайды, ал Fold’EM құрылымды, позаларды және сыныптарды итеративті түрде нақтылайды. Базалық әдістер (RELION, cryoDRGN) алдымен бөлшектерді кластерлейді, содан кейін әрбір жиынтық үшін тығыздықты реконструкциялайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SNR (Signal-to-Noise Ratio) — сигнал мен шуылдың қатынасы; бұл көрсеткіш неғұрлым төмен болса, шуыл деңгейі жоғары болғандықтан, құрылымды қалпына келтіру соғұрлым қиындайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нәтижелер. Синтетикалық деректерде күйлерді ажырату үшін бірнеше жүз бөлшек жеткілікті. AlphaFold3 олардың ешқайсысын қалпына келтіре алмады (TM-score 0.699 және 0.661; 5-сурет). Белгілі позалармен Fold’EM SNR 0.005 және 250 бөлшекпен 3.3 және 3.5 Å дәлдікке жетеді (TM-score 0.96 және 0.98; A19, A20-кестелері). Осы жағдайда RELION 7.9 Å-дан нашар нәтиже береді, ал cryoDRGN 3.6 және 4.8 Å-ға жету үшін 1000 бөлшекті талап етеді. Ab initio режимінде Fold’EM SNR 0.005 және 500 бөлшекпен 3.4 және 3.6 Å дәлдікті көрсетеді (TM-score 0.95 және 0.94; A21, A22-кестелері). RELION ab initio және cryoDRGN-AI сәйкесінше 6.9 және 16.6 Å-дан нашар нәтиже береді. 250 бөлшек және SNR 0.005 жағдайында 9UGB 7.6 Å-ға дейін деградацияға ұшырайды, бұл параметрлерді бірлесіп анықтау үшін шекті мән болып табылады.&lt;/p&gt;\n&lt;p&gt;UvrA үшін табыс бастапқы болжамның дәлдігіне байланысты. AlphaFold3 9GXR-ді болжайды (3.54 Å, TM-score 0.886), бірақ 9GXQ-ді емес (11.69 Å, TM-score 0.734). Белгілі позалармен Fold’EM 3.09 және 2.95 Å-ға жетеді (A15-кестесі), cryoDRGN — 4.34 және 4.41 Å, RELION — 6.89 және 10.75 Å. Ab initio режимінде Fold’EM 9GXR-ді 3.58 Å (500 бөлшек) және 3.02 Å (5000 бөлшек) дейін қалпына келтіреді. 9GXQ 10 000 бөлшекпен 4.63 Å-ға дейін қалпына келеді (TM-score 0.836; 6-сурет; A17, A18-кестелері). RELION және cryoDRGN-AI 8 Å-дан нашар нәтиже береді. Бөлшектер санындағы айырмашылық 9GXQ күйінің AlphaFold3 болжамында жоқтығымен түсіндіріледі.&lt;/p&gt;\n&lt;p&gt;Қалпына келтірілген құрылымдар функционалды тұрғыдан маңызды: Fold’EM ДНҚ дуплексіне сынаның (Y62, Q65, F66) енгізілуін және оған байланысты деформацияны дұрыс анықтайды, ал AlphaFold3 канондық құрылымды болжайды (6G-суреті).&lt;/p&gt;\n&lt;h4 id=\"b-recovar-koemegimen-belgisiz-klassifikaciya\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#b-recovar-koemegimen-belgisiz-klassifikaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;B-RECOVAR көмегімен белгісіз классификация&lt;/span&gt;&lt;/a&gt;B-RECOVAR көмегімен белгісіз классификация&lt;/h4&gt;\n&lt;p&gt;Эксперименталды қондырғы. Гетерогенді эксперименттер бастапқы класс белгілеріне тәуелді. Біз қолданыстағы embedding әдістері сенімсіз жұмыс істейтін бөлшектердің аз саны кезінде тірек құрылымдарынсыз бөлшектерді классификациялау мүмкіндігін зерттедік. Бағалау үшін біз EMPIAR-13396 UvrA деректер жиынын қолдандық және әр күй үшін 250-ден 5000 бөлшекке дейін (жалпы бөлшектердің 0,13% - 2,6%) өзгерттік. Әрбір үлгі көлемі үшін консенсусты нақтылаудан алынған позалармен он кездейсоқ итерация жүргізіліп, нәтижелер бастапқы белгілермен салыстырылды. Біз B-RECOVAR әдісін RECOVAR және cryoDRGN (он іске қосу бойынша медиана) әдістерімен салыстырдық. B-RECOVAR абляциясы әр күй үшін 1000 бөлшек деңгейінде жүргізілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/ablyatsiya.html\"&gt;Абляция&lt;/a&gt; — модельдің әрбір компонентінің қорытынды нәтижеге қосқан үлесін түсіну үшін оларды біртіндеп өшіру немесе өзгерту әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нәтижелер. 500 бөлшектен бастап B-RECOVAR аналогтарға қарағанда жоғары дәлдік пен тұрақтылықты көрсетеді (7A-сурет). RECOVAR әдісінде мұндай деректер көлемінде ковариация бағыты кездейсоқ таңдауға тәуелді болып, дәлдік кездейсоқ деңгейден дерлік мінсізге дейін ауытқиды. B-RECOVAR 250 бөлшекте азырақ дәлдік көрсетсе де, 5000 бөлшекте 92,5% дәлдікке жетеді (айырмашылық 1 пайыздық пункттен аз); cryoDRGN барлық жағдайда төменірек нәтиже береді. Ансамбльдің нормаланған маржасы κ сенімділік көрсеткіші ретінде қызмет етеді: дәлдік оның өсуімен монотонды түрде артып, ең жоғары бинде (бөлшектердің 44%) 80%-ға жетеді (7B-сурет). Fold’EM әдісі бұл көрсеткішті сүзгі ретінде пайдаланады: ең аз сенімді бөлшектердің жартысын алып тастау конформациялар арасындағы бөлінуді (Cα RMSD арқылы өлшенеді) арттырады және TM-score мәнін жақсартады (A26-кесте).&lt;/p&gt;\n&lt;p&gt;Компоненттерді талдау (7C, D-суреттер) базалық бағалаушының (шуды түзетусіз және еріткіш маскасынсыз бір өлшемді RECOVAR аналогы) 63,8% дәлдікке жететінін көрсетті (d'=0,54). Таңдау аймағын еріткіш маскасымен шектеу дәлдікті 69,1%-ға, ал белгілерді сыныптар бойынша реконструкциялармен өзара тексеру арқылы нақтылау 72,1%-ға дейін арттырады. Ең үлкен өсім бөлшектер жиындары, жиілік диапазондары және инициализациялар бойынша ансамбльдеу арқылы қол жеткізіледі, бұл дәлдікті 80,6%-ға жеткізіп, күйлер арасындағы бөлінуді d'=1,13-тен d'=2,33-ке дейін екі есе арттырады.&lt;/p&gt;\n&lt;h4 id=\"uezdiksiz-geterogendilik-kezindegi-baghyttau\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#uezdiksiz-geterogendilik-kezindegi-baghyttau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Үздіксіз гетерогенділік кезіндегі бағыттау&lt;/span&gt;&lt;/a&gt;Үздіксіз гетерогенділік кезіндегі бағыттау&lt;/h4&gt;\n&lt;p&gt;Эксперименттік қондырғы. Біз үздіксіз конформациялық траекторияны оңтайландырылған Pairformer күйлері мен олардың интерполяциясы арқылы көрсетуге болатынын тексердік. Ол үшін 1HZH PDB жазбасынан Fab-доменді 360° бұру арқылы алынған 100 атомдық модель және 25 000 синтетикалық бөлшектерден (SNR 0,01, әр күйге 250-ден) тұратын CryoBench IgG-1D деректер жинағы пайдаланылды. Әр бөлшек үш координаталық жүйеге енгізілді: cryoDRGN &lt;a href=\"concepts/vae.html\"&gt;VAE&lt;/a&gt; латенттік кеңістігі, RECOVAR бас компоненттері және B-RECOVAR қалдық астыңғы кеңістігі. Әр әдіс үшін траектория бойында сегіз тірек конформациясы бекітілді және әрқайсысы үшін 250 ең жақын бөлшек негізінде Pairformer құрылымы оңтайландырылды. Бұл &lt;span class=\"yfm-latex\" data-content=\"H_1%2C%20%5Cdots%2C%20H_8\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; күйлерін берді. Интерполяцияланған H(α) күйі көршілес тірек нүктелерінің дөңес комбинациясы ретінде есептелді. Әр модель үшін кері диффузия және координаталар кеңістігінде нақтылау жүргізілді (8-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VAE (вариациялық автокодтауыш) — бұл күрделі деректерді (мысалы, бөлшектер кескіндерін) ықшам «латенттік» кеңістікке сығып, ақуыз пішінінің үздіксіз өзгеруі сияқты жасырын заңдылықтарды табуға көмектесетін нейрондық желі түрі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нәтижелер. Сегіз тірек нүктесі траекторияны сипаттау үшін жеткілікті болды. B-RECOVAR әдісінде медиандық NCC көрсеткіші эталонның 92%-ын, ал TM-score 0,93-ті құрады (тірек нүктелері үшін сәйкесінше 89% және 0,91). CryoDRGN үшін бұл көрсеткіштер 85% және 0,89, RECOVAR үшін 90% және 0,92 болды (8-сурет). Pairformer күйлерінің бас компоненттері барлық үш координата үшін топса бұрышының ретін сақтайды (9-сурет). Стереохимиялық сапа A25-кестеде берілген. Демек, бөлшектердің конформациялық ұйымдасуы AlphaFold бейнесінде көрініс табады және үздіксіз траекторияны аз ғана оңтайландырылған күйлермен көрсетуге болады.&lt;/p&gt;\n&lt;h4 id=\"khatysty-zhumystar\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#khatysty-zhumystar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қатысты жұмыстар&lt;/span&gt;&lt;/a&gt;Қатысты жұмыстар&lt;/h4&gt;\n&lt;p&gt;Карта реконструкциясы. Атомдық модельді құру үшін әдетте он мыңдаған бөлшектер қажет. RELION және cryoSPARC бөлшектердің бағдарын және картасын Байес тәсілі арқылы бірлесіп бағалайды. Гетерогенді деректер үшін олар бөлшектерді K дискретті сыныпқа бөледі. CryoDRGN VAE көмегімен үздіксіз латенттік кеңістікті үйренеді, ал RECOVAR көлем ковариациясын бағалайды. CryoDRGN-AI мұны ab initio деңгейіне дейін кеңейтеді. Заманауи тәсілдер AlphaFold сияқты құрылымдық болжау модельдерін пайдаланып, оларды эксперименталды тығыздықпен бағыттайды. Рентгендік кристаллографияда Maddipatla және басқалар диффузиялық модельдерді қолданып, балама конформацияларды анықтайды. Крио-ЭМ-де CryoBoltz және Maddipatla тәсілдері AlphaFold3-ті ESP карталарына сәйкес құрылымдарға бағыттайды. Embed-Opt және IT-Opt AlphaFold-тың латенттік бейнелерін оңтайландырады. Ең жақын жұмыс — CoCoFold, ол Evoformer-ді тоқтата тұрып, FRC жоғалту функциясы арқылы AlphaFold-ты тікелей бөлшектер кескіндерімен шектейді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f1.jpg\" alt=\"1-сурет: Fold’EM атомдық құрылымдарды тікелей сирек крио-ЭМ бөлшектер кескіндерінен анықтайды.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Fold’EM атомдық құрылымдарды тікелей сирек крио-ЭМ бөлшектер кескіндерінен анықтайды.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет: Fold’EM атомдық құрылымдарды тікелей сирек крио-ЭМ бөлшектер кескіндерінен анықтайды. (A) Fold’EM құрылымдық қорытындыны поза мен класты нақтылаумен кезектестіреді. (B) Бөлшектердің дәлелдері аралық Pairformer H күйлеріне кері таралады және AlphaFold3 диффузиясына дейін қалған Pairformer блоктары арқылы эксперименталды жаңартуларды сүзеді. (C) Интегрин–BIIG2 Fab кешені үшін (PDB 9B9J) AlphaFold3 жеке компоненттерді болжайды, бірақ Fab-ты дұрыс емес байланысу орнына орналастырады. (D) Ab initio Fold’EM байланысқан кешен мен эпитопты небәрі 1000 бөлшектен — депозиттелген реконструкция үшін пайдаланылғандардың 0,26% — 2,49 Å RMSD, 0,956 TM-score және 3,52 Å FSC ажыратымдылығымен қалпына келтіреді (депозиттелген карта: 2,6 Å).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f2.jpg\" alt=\"2-сурет: Бөлшектермен бағыттау құрылымды қалпына келтіреді, ал олардың реконструкцияланған ESP-імен бағыттау сәтсіздікке\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: Бөлшектермен бағыттау құрылымды қалпына келтіреді, ал олардың реконструкцияланған ESP-імен бағыттау сәтсіздікке ұшырайды.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сурет: Бөлшектермен бағыттау құрылымды қалпына келтіреді, ал олардың реконструкцияланған ESP-імен бағыттау сәтсіздікке ұшырайды. SNR 0,005 кезінде 500 бөлшектен алынған синтетикалық 8U4E (3304 қалдық) бойынша ab initio қорытынды. Сұр бет — бұл бағаланған позаларда осы бөлшектерден реконструкцияланған консенсустық тығыздық, ал сандар — депозиттелген модельге қатысты Cα RMSD. (A) Депозиттелген модель. (B) AlphaFold3 құрастыру домендерін дұрыс орналастырмайды. (C) ESP бағыттауы сол Pairformer күйін сол бөлшектермен, позалармен және оптимизатормен оңтайландырады, бірақ бөлшектердің ықтималдығын консенсустық тығыздыққа қарсы жоғалту функциясымен ауыстырады және орналасуды қалпына келтірмей болжамды жақсартады. (D) Бөлшектердің ықтималдығымен бағытталған Fold’EM оны AlphaFold3 үшін 0,48-ге қарсы 0,81 TM-score-мен қалпына келтіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f3.jpg\" alt=\"3-сурет: Аралық Pairformer күйін оңтайландыру бөлшектер деңгейіндегі бағыттауды жақсартады.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет: Аралық Pairformer күйін оңтайландыру бөлшектер деңгейіндегі бағыттауды жақсартады.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-сурет: Аралық Pairformer күйін оңтайландыру бөлшектер деңгейіндегі бағыттауды жақсартады. Біз AlphaFold3-ті сол бөлшектер ықтималдығымен, позалармен және бөлшектердің ішкі жиындарымен басқарудың үш әдісін салыстырамыз: Fold’EM, аралық Pairformer H күйін оңтайландырады және жаңартуларды соңғы Pairformer блоктары арқылы өткізеді; IT-Opt (Maddipatla және т.б., 2026a), изотропты априорлық үлестірім астында терминалды Z эмбеддингті оңтайландырады; және кері диффузия процесінің координаттық кеңістігінде бағыттау (Maddipatla және т.б., 2026b). Жолдар: SNR 0,005 кезінде белгілі позалармен A2 кестесінен синтетикалық 8U4B және 9UGB, 250 және 1000 бөлшекті пайдалана отырып. Бағандар: депозиттелген PDB моделіне қатысты Cα-RMSD (↓, логарифмдік шкала) және TM-score (↑); үзік сызық AlphaFold3 болжамын белгілейді. Екі нысанда да Fold’EM екі баламадан да айтарлықтай асып түседі және депозиттелген модельмен дерлік атомдық сәйкестікке жетеді; H-ті оңтайландыру арқылы индукцияланған үйретілген геометрия осылайша төмен SNR кезінде және ірі құрастырылымдарда бөлшектер деңгейіндегі бағыттауды тұрақты сақтайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f5.jpg\" alt=\"5-сурет: Fold’EM 9UGB/9UGC синтетикалық қоспасының екі күйін де белгілі позалармен әр күй үшін 250 бөлшектен және ab ini\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет: Fold’EM 9UGB/9UGC синтетикалық қоспасының екі күйін де белгілі позалармен әр күй үшін 250 бөлшектен және ab initio 500 бөлшектен шешеді.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-сурет: Fold’EM 9UGB/9UGC синтетикалық қоспасының екі күйін де белгілі позалармен әр күй үшін 250 бөлшектен және ab initio 500 бөлшектен шешеді. Pma1 — ашытқының плазмалық протон сорғысы, P-типті АТФаза, оның цитозольдік A-, N- және P-домендері каталитикалық цикл барысында қайта орналасады; 9UGB белсендірілген (E2P) күй, ал 9UGC автоингибирленген күй. Бөлшектер Cα RMSD бойынша шамамен 9 Å айырмашылығы бар екі депозиттелген конформациядан рендерленген және SNR 0,005 кезінде тең пропорцияда араластырылған. Әр панельде 9UGB сол жақта, 9UGC оң жақта. (A) AlphaFold3 (көк) депозиттелген модельдер (сұр) үстінде ешбір күйді қалпына келтірмейді (TM-score 0,70 және 0,66): трансмембраналық домен дұрыс болжанған және қателік цитозольдік домендермен шектелген, олардың орналасуы цикл күйіне байланысты. (B) Белгілі позалармен Fold’EM (қызыл) 1000 бөлшектен тұратын аралас стектен (әр күй үшін 500) екеуін де шешеді. (C) Fold’EM ab initio 2000 бөлшектен (әр күй үшін 1000) екеуін де шешеді. (D) Әр күйдің өкілдік бөлшектері. (E, F) 9UGB (E) және 9UGC (F) үшін әр күйдегі бөлшектер санына қарай FSC ажыратымдылығы (жоғарыда) және депозиттелген модельге қатысты TM-score (төменде); толтырылған маркерлер белгілі позаларды, бос маркерлер ab initio-ны білдіреді, үзік сұр сызық депозиттелген модельдің ажыратымдылығы, нүктелі көк сызық AlphaFold3 болжамы.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f6.jpg\" alt=\"6-сурет: Fold’EM 0,5% белгілі позалары бар және 5% ab initio бөлшектерінен UvrA–ДНҚ конформацияларын анықтайды.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сурет: Fold’EM 0,5% белгілі позалары бар және 5% ab initio бөлшектерінен UvrA–ДНҚ конформацияларын анықтайды.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;6-сурет: Fold’EM 0,5% белгілі позалары бар және 5% ab initio бөлшектерінен UvrA–ДНҚ конформацияларын анықтайды. EMPIAR-13396 құрамында абазиттік сайты бар ДНҚ-мен байланысқан UvrA-ның екі күйі бар (PDB 9GXQ/9GXR); зақымдануды тану Y62/Q65/F66 сынасын дуплекске енгізуді қамтиды. (A) AlphaFold3 9GXR-ді қалпына келтіреді, бірақ 9GXQ-ді емес (TM-score 0,734). (B, C) Fold’EM әр күй үшін 1000 белгілі позалы бөлшектен және 10 000 ab initio бөлшектен екі күйді де анықтайды (сол жақта: 9GXQ, оң жақта: 9GXR). (D) Өкілдік бөлшектер. (E) FSC-нің әр күйге шаққандағы бөлшектер санына қатынасы (толтырылған: белгілі позалар; ашық: ab initio). Белгілі позалармен Fold’EM әр күй үшін 1000 бөлшектен 3,1/3,0 Å ажыратымдылыққа жетеді; ab initio әдісімен ол 9GXR үшін 3,0 Å және 9GXQ үшін 4,6 Å ажыратымдылыққа жетеді, ал RELION және cryoDRGN-AI 8 Å-ден жоғары қалады. (F) Депозиттелген модельдерге қатысты TM-score. (G) AlphaFold3 толық жұптасқан дуплексті сақтайды, ал Fold’EM сынаның енгізілуін және бұзылған ДНҚ-ны қалпына келтіреді, бірақ сыртқа шыққан нуклеотидті емес, өйткені зақымдану екі модельге де бүтін ДНҚ ретінде ұсынылған. Ажыратымдылық (Å; FSC = 0,143).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f7.jpg\" alt=\"7-сурет: B-RECOVAR бөлшектерді конформациялық күйлерге RECOVAR және cryoDRGN-ге қарағанда аз бөлшектер санында дәлірек ж\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-сурет: B-RECOVAR бөлшектерді конформациялық күйлерге RECOVAR және cryoDRGN-ге қарағанда аз бөлшектер санында дәлірек және сенімдірек тағайындайды, ал оның сенімділік көрсеткіші тағайындауларды сенімділігіне қарай реттейді.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;7-сурет: B-RECOVAR бөлшектерді конформациялық күйлерге RECOVAR және cryoDRGN-ге қарағанда аз бөлшектер санында дәлірек және сенімдірек тағайындайды, ал оның сенімділік көрсеткіші тағайындауларды сенімділігіне қарай реттейді. UvrA ақуыз-ДНҚ кешені (EMPIAR-13396, 9GXQ және 9GXR) бойынша белгісіз сыныпты тағайындау, депозиттелген белгілерге қатысты бағаланған. (A) Әр күй үшін бөлшектер санына қарай дәлдік, 250-ден 5000-ға дейін, яғни әр күй үшін депозиттелген бөлшектердің 0,13–2,6%. Жәшіктер B-RECOVAR және RECOVAR үшін ортақ әр өлшем үшін он кездейсоқ таңдауды жинақтайды; үшбұрыштар cryoDRGN-ді белгілейді. RECOVAR бағалаушысы мұндай үлгі өлшемдерінде нашар жұмыс істейді және оның дәлдігі бірдей өлшемдегі таңдаулар арасында кездейсоқтан дерлік мінсізге дейін өзгереді; B-RECOVAR бөлшектер саны бойынша одан қалысады, бірақ 500 бөлшектен бастап дәлірек және тұрақтырақ, ал cryoDRGN бүкіл процесс бары процесс бойында B-RECOVAR-дан төмен қалады. (B) B-RECOVAR-дың сенімділік көрсеткіші κk бойынша стратификацияланған дәлдігі, ансамбльдік дауыс берудің қалыпқа келтірілген шегі (D.4-қосымша). Әр бағандағы пайыз – бұл ұяшықтағы бөлшектер үлесі; тұтас сызық барлық бөлшектер бойынша дәлдік, үзік сызық – кездейсоқ дәлдік. Дәлдік сенімділікпен бірге монотонды артады, сондықтан көрсеткіш бөлшектерді белгінің сенімділігіне қарай реттейді; Fold’EM бұл реттілікті әр ансамбль мүшесін өз бөлшектерінің сенімді жартысымен басқару үшін пайдаланады (A26-кесте). (C, D) Әр күй үшін 1000 бөлшекте бағалаушыны абляциялау. Негізгі бағалаушы – бұл консенсустан алынған қалдықтарға бір дәрежелі сәйкестендіру, шуды түзетусіз бір өлшемді RECOVAR сәйкестендіруі, ол моданы еріткіш маскасымен шектеу, белгілерді өзара тексерілген нақтылау және бөлшектердің кіші үлгілері, жиілік диапазондары және инициализациялар бойынша репликаларды ансамбльдеу арқылы жақсартылады. (C) Әр кезеңнің дәлдігі, қайталанатын таңдаулар бойынша қателік сызықтарымен. (D) Әр кезеңде әр бөлшектің сынып бағасының таралуы, олардың d′ ажыратылуымен, яғни біріктірілген стандартты ауытқу бірліктерінде екі орташа мәннің айырмашылығы. Әр қадам күйлер арасындағы ажыратылуды кеңейтеді және ансамбль ең үлкен нәтижені қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f8.jpg\" alt=\"8-сурет: Fold’EM IgG антидене кешенінің үздіксіз гетерогенділігін анықтайды.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-сурет: Fold’EM IgG антидене кешенінің үздіксіз гетерогенділігін анықтайды.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;8-сурет: Fold’EM IgG антидене кешенінің үздіксіз гетерогенділігін анықтайды. (A) Ансамбльдер ретінде 100 CryoBench IgG-1D синтетикалық моделі көрсетілген, олар ілмек бұрышы бойынша боялған; және (B) B-RECOVAR бөлшектер классификациясымен Fold’EM арқылы қалпына келтірілген сәйкес құрылымдар. Кіші суретте оңтайландырылған Pairformer күйлерінің екі негізгі компоненті бейнеленген, олар B-RECOVAR бөлшектер орналасуының үстіне қойылған. (C) TM-score және (D) Fourier NCC үш конформациялық координата үшін ілмек бұрышы функциясы ретінде сызылған.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f9.jpg\" alt=\"9-сурет: Оңтайландырылған Pairformer күйлері барлық үш конформациялық координата үшін ілмек бұрышы ретін сақтайды.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;9-сурет: Оңтайландырылған Pairformer күйлері барлық үш конформациялық координата үшін ілмек бұрышы ретін сақтайды.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;9-сурет: Оңтайландырылған Pairformer күйлері барлық үш конформациялық координата үшін ілмек бұрышы ретін сақтайды. Біз үш бөлшек классификаторының әрқайсысы үшін геометрия мен жасалған құрылымдарды көрсетеміз: cryoDRGN, RECOVAR және B-RECOVAR. Әр панельдің сол жағында: оңтайландырылған Pairformer күйлерінің екі негізгі компоненті, сегіз якорь үлкен нүктелер ретінде және интерполяцияланған күйлер кіші нүктелер ретінде, бір жазықтыққа ауыстырылған сәйкес әдістің әр бөлшек координаталарының үстіне қойылған; барлығы түстер дөңгелегінде көрсетілгендей, олар білдіретін күйдің ілмек бұрышы бойынша боялған. Әр панельдің оң жағында: интерполяцияланған күйлерден декодталған 10 құрылымның кіші жиынтығы, антидененің қатаң денесінің үстіне қойылған және ілмек бұрышы бойынша боялған (жоғарыда), және Fab-тың ілмек айналасында қозғалуын көрсету үшін ақ түсте (төменде). Барлық үш жағдайда ілмек бұрышы бойынша реттелген якорьлар бейнеде қарапайым тұйықталған сақинаны құрайды және декодталған құрылымдар Fab-тың толық айналуын қадағалайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-fS1.jpg\" alt=\"Сурет S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S1&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"kesteler\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#kesteler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кестелер&lt;/span&gt;&lt;/a&gt;Кестелер&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 3.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-tT3.jpg\" alt=\"Кесте 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 4.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-tT4.jpg\" alt=\"Кесте 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 6.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-tT6.jpg\" alt=\"Кесте 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 7.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-tT7.jpg\" alt=\"Кесте 7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 10.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-tT10.jpg\" alt=\"Кесте 10\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 12.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-tT12.jpg\" alt=\"Кесте 12\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 14.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-tT14.jpg\" alt=\"Кесте 14\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 16.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-tT16.jpg\" alt=\"Кесте 16\" /&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;крио-ЭМ-дегі&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;деректер&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;артықтығы&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нейрондық&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;желіге priors&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;интеграциясы&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;аз бөлшектен&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;атомдық модель&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ақуыздың сирек&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;күйлерін&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;зерттеу&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Препринт лицензиясы&lt;/strong&gt;&lt;/th&gt;\n&lt
