            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"262\" cy=\"137\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"518\" cy=\"260\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · BIOPHYSICS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Ақуыз құрылымын жүздеген есе&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;аз деректермен қалай көруге&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;болады&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f1.jpg\" alt=\"1-сурет: Fold’EM атомдық құрылымдарды тікелей сирек крио-ЭМ бөлшектер кескіндерінен анықтайды.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Fold’EM атомдық құрылымдарды тікелей сирек &lt;a href=\"concepts/cryo-em.html\"&gt;крио-ЭМ&lt;/a&gt; бөлшектер кескіндерінен анықтайды.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет: Fold’EM атомдық құрылымдарды тікелей сирек &lt;a href=\"concepts/krio-em.html\"&gt;крио-ЭМ&lt;/a&gt; бөлшектер кескіндерінен анықтайды. (A) Fold’EM құрылымдық қорытындыны поза мен класты нақтылаумен кезектестіреді. (B) Бөлшектердің дәлелдері аралық Pairformer H күйлеріне кері таралады және AlphaFold3 диффузиясына дейін қалған Pairformer блоктары арқылы эксперименталды жаңартуларды сүзеді. (C) Интегрин–BIIG2 Fab кешені үшін (PDB 9B9J) AlphaFold3 жеке компоненттерді болжайды, бірақ Fab-ты дұрыс емес байланысу орнына орналастырады. (D) Ab initio Fold’EM байланысқан кешен мен эпитопты небәрі 1000 бөлшектен — депозиттелген реконструкция үшін пайдаланылғандардың 0,26% — 2,49 Å &lt;a href=\"concepts/root-mean-square-deviation.html\"&gt;RMSD&lt;/a&gt;, 0,956 &lt;a href=\"concepts/tm-score.html\"&gt;TM-score&lt;/a&gt; және 3,52 Å FSC ажыратымдылығымен қалпына келтіреді (депозиттелген карта: 2,6 Å).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Дәстүрлі криоэлектронды микроскопия сапалы 3D карта жасау үшін мыңдаған молекула суреттерін талап етеді. Жаңа &lt;a href=\"concepts/fold-em.html\"&gt;Fold'EM&lt;/a&gt; әдісі микроскопия деректерін ақуыз құрылымын болжайтын модельдермен тікелей байланыстырады. Бұл тәсіл әдеттегіден әлдеқайда аз деректермен молекулалық құрылымды анықтауға мүмкіндік береді. Технология әсіресе ақуыздардың сирек кездесетін және тұрақсыз күйлерін зерттеуде өте тиімді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Fold'EM криоэлектронды микроскопияда 3D тығыздықты реконструкциялау кезеңін алып тастайды.&lt;/li&gt;\n&lt;li&gt;Әдіс шулы суреттерді түсіндіру үшін AlphaFold3 модельдерін пайдаланады.&lt;/li&gt;\n&lt;li&gt;Құрылымды анықтау үшін әдеттегіден 20–1000 есе аз бөлшек жеткілікті.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Криоэлектронды микроскопияның (cryo-EM) дәстүрлі процесі мыңдаған шулы суреттерден электростатикалық потенциал (ESP) картасын реконструкциялауды және оған атомдық модельді сәйкестендіруді көздейді. Fold'EM әдісі аралық тығыздықты реконструкциялау кезеңін айналып өтіп, AlphaFold3 сияқты генеративті модельдерден алынған құрылымдық білімдерді тікелей бөлшектер суретін өңдеу процесіне интеграциялайды. Авторлар AlphaFold3 құрамындағы Pairformer блогын бөліктерге бөліп, аралық H күйін оңтайландыру арқылы эксперименталды деректерді нейрондық желі қабаттарынан өткізуге қол жеткізді.&lt;/p&gt;\n&lt;p&gt;Зерттеушілер бұл әдісті синтетикалық және эксперименталды деректер жиынында сынақтан өткізді. Бөлшектердің бағыты белгілі болғанда, алгоритм стандартты деректердің небәрі 0,1% бөлігімен жеткілікті дәлдікке жетеді. Ал бөлшектердің бағыты мен конформациясы белгісіз ab initio режимінде әдіс классикалық реконструкция үшін қажетті бөлшектердің небәрі 3–5% бөлігін пайдаланып, нақты нәтижелер береді. Бұл гетерогенді үлгілердегі әртүрлі конформациялық күйлерді жеке карталар салмай-ақ ажыратып алуға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жұмыс препринт түрінде ұсынылған және әртүрлі биологиялық үлгілермен тәуелсіз тексеруді қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Криоэлектронды микроскопия (cryo-EM) биомолекулалардың құрылымын анықтаудың негізгі әдісіне айналды. Дәстүрлі есептеу процесі көптеген бөлшектердің кескіндерін біріктіріп, электростатикалық потенциал (ESP) картасын қалпына келтіреді, содан кейін оған атомдық модельді сәйкестендіреді. Бұл әдіс үлкен көлемдегі деректерді қажет етеді, бұл әсіресе құрылымы әртекті үлгілер үшін зерттеуді қымбат және өнімділігі төмен етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Криоэлектронды микроскопия (cryo-EM) — мұздатылған биологиялық үлгілерді электронды сәулелер арқылы атомдық деңгейде бейнелеу әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторлар Fold’EM жүйесін ұсынады. Бұл әдіс ақуыз құрылымын болжаушы генеративті модельдерден алынған алдын ала білімдерді тікелей cryo-EM бөлшектерінің кескіндерімен біріктіреді. Fold’EM аралық тығыздық картасын қалпына келтіру және оған модель құру кезеңдерін айналып өтіп, аз ғана бөлшек кескіндерінен атомдық модельдерді анықтауға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Fold’EM тығыздық картасын қалпына келтіру кезеңінсіз, аз ғана кескіндер негізінде дәл атомдық құрылымдарды қалпына келтіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Синтетикалық тесттер мен эксперименталды cryo-EM деректерінде Fold’EM бөлшектердің бағыты белгілі болған жағдайда да, бағыттар құрылыммен бірге анықталатын ab initio режимінде де дәл атомдық құрылымдарды қалпына келтіреді. Әртекті деректер жиынтығында Fold’EM әрбір күй үшін бөлек карта құрмастан, аралас популяциялардан әртүрлі конформациялық күйлерді ажыратып көрсетеді. Бұл нәтижелер аз үлгілі режимде құрылымды анықтау және сирек конформациялық күйлерді тікелей бөлшектерден сипаттау үшін жаңа мүмкіндіктер ашады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдістің тиімділігі әртүрлі биологиялық жүйелерде кеңірек тексерілуі қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"zheke-boelshekterding-krioelektrondy-mikroskopiyasy-muemkindikter-men-shekteuler\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#zheke-boelshekterding-krioelektrondy-mikroskopiyasy-muemkindikter-men-shekteuler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жеке бөлшектердің криоэлектронды микроскопиясы: мүмкіндіктер мен шектеулер&lt;/span&gt;&lt;/a&gt;Жеке бөлшектердің криоэлектронды микроскопиясы: мүмкіндіктер мен шектеулер&lt;/h4&gt;\n&lt;p&gt;Жеке бөлшектердің криоэлектронды микроскопиясы (cryo-EM) ірі макромолекулалық кешендердің құрылымын кристалданусыз жоғары ажыратымдылықта анықтауға мүмкіндік беріп, құрылымдық биологияны түбегейлі өзгертті. Жеке молекулаларды әртүрлі конформацияда бейнелеу қабілеті биологиялық функцияларды басқаратын құрылымдық өзгерістерді түсінуге жол ашады. Алайда, бастапқы өлшемдер өте шулы: радиациялық зақымдану әр бөлшекке түсетін электрон дозасын шектейді, бұл жеке кескіндерді тікелей түсіндіруге жарамсыз етеді. Электростатикалық потенциал (ESP) картасын алу үшін көптеген бақылауларды туралау және орташалау қажет, содан кейін атомдық модельді құру кезеңі келеді, бұл жергілікті ажыратымдылық төмен болғанда қиынға соғады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Cryo-EM әдісі орташа мәндерді есептеу үшін өте үлкен деректер жиынын талап етеді, бұл сирек немесе тұрақсыз ақуыз конформацияларын зерттеуді шектейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"geterogendilik-maeselesi-zhaene-derekterding-tapshylyghy\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#geterogendilik-maeselesi-zhaene-derekterding-tapshylyghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гетерогенділік мәселесі және деректердің тапшылығы&lt;/span&gt;&lt;/a&gt;Гетерогенділік мәселесі және деректердің тапшылығы&lt;/h4&gt;\n&lt;p&gt;Когерентті орташа мәндерді алу қажеттілігі кеңістіктік ажыратымдылық пен биологиялық толықтық арасындағы қайшылықты тудырады. Әртүрлі конформациядағы бөлшектерді біріктіру құрылымдық ерекшеліктерді бұлдыратады, ал оларды біртекті топтарға бөлу әр күй үшін бақылаулар санын азайтады. Сирек және өтпелі күйлерді қалпына келтіру қиын, өйткені олар көп кездесетін конформациялармен араласып кетуі немесе таңдау процесінде алынып тасталуы мүмкін. Гетерогенділікті модельдеудің қолданыстағы әдістері конформациялық өзгергіштікті анықтауға мүмкіндік береді, бірақ олар бөлшектерді алдын ала таңдау және туралау сапасына тәуелді. Осылайша, үлкен көлемдегі бөлшектерге деген іргелі қажеттілік шешілмеген күйінде қалуда.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/krio-em-rekonstruktsiya.html\"&gt;Cryo-EM реконструкциясы&lt;/a&gt; — бұл мыңдаған шулы 2D-проекцияларды 3D-модельге айналдыру процесі, мұнда «орташалау» шуды басуға көмектеседі, бірақ бөлшектердің жоғары біртектілігін талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"khurylymdykh-apriorlykh-bilimderdi-integraciyalau\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#khurylymdykh-apriorlykh-bilimderdi-integraciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Құрылымдық априорлық білімдерді интеграциялау&lt;/span&gt;&lt;/a&gt;Құрылымдық априорлық білімдерді интеграциялау&lt;/h4&gt;\n&lt;p&gt;Дәстүрлі реконструкция әдістері ақуыз құрылымы туралы жалпы білімдерді аз пайдаланады. RELION-дағы Blush сияқты нейрондық желілер немесе AlphaFold сияқты болжамдық модельдер құрылымдық білімдерді енгізу сигнал әлсіз болғанда реконструкция сапасын жақсартатынын көрсетеді. Алайда, заманауи тәсілдер бұл білімдерді реконструкциядан кейін қолданады, бұл бөлшектердің көп санына тәуелділікті сақтайды. Бұл жұмыста біз мынадай сұрақ қоямыз: құрылымдық априорлық білімдерді тікелей бөлшек деңгейінде енгізіп, аралық жоғары ажыратымдылықтағы реконструкциясыз сирек деректерден атомдық деңгейде қорытынды жасауға бола ма?&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ұсынылып отырған тәсіл бөлшектер саны бойынша шектеулерді жеңуге бағытталған, алайда әдістің тиімділігі сигнал-шу қатынасы өте төмен нақты эксперименталды деректерде тексерілуі керек.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;p&gt;Біз Fold’EM жүйесін ұсындық — бұл крио-ЭМ бөлшектер кескінінен атомдық құрылымдарды тікелей анықтауға арналған фреймворк. Ол тығыздықты қайта құру және модель салу кезеңдерін айналып өтіп, AlphaFold3 жұмысын бөлшектер деңгейіндегі дәлелдермен бағыттайды. Біз тығыздықты сәйкестендіру тек эксперименттік метрикалар кезінде ғана бөлшектердің ықтималдығын қайталайтынын және поза немесе класс белгісіз болғанда консенсустық тығыздық жеткілікті статистика болмайтынын көрсеттік. Pairformer-дің түпкілікті емес, аралық күйлерін оңтайландыру бағыттауды күшейтетін геометрияны қалыптастырады. Fold’EM дәстүрлі реконструкциялау әдістеріне қарағанда 1%-дан аз бөлшектермен дәл құрылымдарды қалпына келтіреді (ab initio үшін 3%, гетерогенді үлгілер үшін 5%). Бұл әдіс Integrin α5β1–BIIG2 байланысу орны немесе UvrA-дағы бұрмаланған ДНҚ сияқты әдеттегі болжамдарда көрінбейтін бөлшектерді анықтауға мүмкіндік береді. Бөлшектер кеңістігіндегі конформациялық ұйымдасу AlphaFold бейнесінде көрініс табады, бұл үздіксіз қозғалыстарды бірнеше тірек күйлері арқылы сипаттауға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Fold’EM AlphaFold3-тің алдын ала білімдері мен эксперименттік деректерді біріктіріп, дәстүрлі әдістерге қарағанда 20–100 есе аз бөлшектермен құрылымды анықтауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Шектеулер: Fold’EM әлі крио-ЭМ процесін толық алмастыра алмайды: кіріс деректер &lt;a href=\"concepts/contrast-transfer-function.html\"&gt;CTF&lt;/a&gt; параметрлері белгілі іріктелген бөлшектер болып табылады, ал ab initio қорытынды бастапқы позалардың дәлдігіне сүйенеді. Гликандар, лигандтар немесе иілгіш аймақтар сияқты модельде жоқ компоненттер түсініксіз сигнал ретінде қабылданады. Болашақта тазартылмаған бөлшектермен жұмыс істеу және жергілікті бөлшектерді нақтылау бойынша жұмыстар жүргізіледі.&lt;/p&gt;\n&lt;h4 id=\"ai-pajdalanu-turaly-maelimdeme\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#ai-pajdalanu-turaly-maelimdeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AI пайдалану туралы мәлімдеме&lt;/span&gt;&lt;/a&gt;AI пайдалану туралы мәлімдеме&lt;/h4&gt;\n&lt;p&gt;Қолжазбаны дайындау барысында ChatGPT және Claude сияқты генеративті AI құралдары тілді өңдеу, құрылымды жақсарту, математикалық есептеулерді тексеру және код жазуға көмектесу үшін пайдаланылды. Барлық ғылыми тұжырымдар мен нәтижелер авторлармен тексерілген және олар мақала мазмұны үшін толық жауапты.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте S3.&lt;/strong&gt; Эксперименталды крио-ЭМ деректер жиындары үшін Фурье қабығының корреляциясы (FSC) = 0.143 (↓, Å) бойынша ажыратымдылық&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Әдіс&lt;/th&gt;\n&lt;th&gt;1/500&lt;/th&gt;\n&lt;th&gt;1/250&lt;/th&gt;\n&lt;th&gt;1/100&lt;/th&gt;\n&lt;th&gt;1/50&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Fold’EM&lt;/td&gt;\n&lt;td&gt;3.73&lt;/td&gt;\n&lt;td&gt;3.35&lt;/td&gt;\n&lt;td&gt;3.50&lt;/td&gt;\n&lt;td&gt;3.46&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;cryoDRGN&lt;/td&gt;\n&lt;td&gt;2.85&lt;/td&gt;\n&lt;td&gt;2.73&lt;/td&gt;\n&lt;td&gt;2.73&lt;/td&gt;\n&lt;td&gt;2.75&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;RELION&lt;/td&gt;\n&lt;td&gt;6.63&lt;/td&gt;\n&lt;td&gt;6.63&lt;/td&gt;\n&lt;td&gt;7.06&lt;/td&gt;\n&lt;td&gt;6.13&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;AlphaFold3&lt;/td&gt;\n&lt;td&gt;3.02&lt;/td&gt;\n&lt;td&gt;3.95&lt;/td&gt;\n&lt;td&gt;3.09&lt;/td&gt;\n&lt;td&gt;3.36&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;PDB&lt;/td&gt;\n&lt;td&gt;3.20&lt;/td&gt;\n&lt;td&gt;3.09&lt;/td&gt;\n&lt;td&gt;3.26&lt;/td&gt;\n&lt;td&gt;3.45&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Fold’EM, AlphaFold3 және PDB құрылымдары үшін FSC phenix.model_map көмегімен есептеледі. Бастапқы деректер жиынының әртүрлі үлесіндегі (белгілі позалары бар 500 бөлшек) барлық базалық көрсеткіштер сақталған EMD картасына қатысты бағаланады. Қалың қаріппен үздік нәтижелер көрсетілген (PDB-ны қоспағанда).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 1.&lt;/strong&gt; Әртүрлі сұйылту коэффициенттеріндегі сапаны бағалау нәтижелері&lt;/p&gt;\n&lt;table&gt;\n&lt;thead& атар 7&lt;/td&gt;\n&lt;td&gt;0.967&lt;/td&gt;\n&lt;td&gt;0.967&lt;/td&gt;\n&lt;td&gt;0.987&lt;/td&gt;\n&lt;td&gt;0.983&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Қатар 8&lt;/td&gt;\n&lt;td&gt;0.9923&lt;/td&gt;\n&lt;td&gt;0.9909&lt;/td&gt;\n&lt;td&gt;0.9828&lt;/td&gt;\n&lt;td&gt;0.9822&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h4 id=\"algoritmder\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#algoritmder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Алгоритмдер&lt;/span&gt;&lt;/a&gt;Алгоритмдер&lt;/h4&gt;\n&lt;p&gt;1-алгоритм Fold’EM процесін сипаттайды: бұл бағытталған &lt;a href=\"concepts/obratnaya-diffuziya.html\"&gt;кері диффузия&lt;/a&gt; арқылы құрылымды анықтау мен кедергі келтіретін параметрлерді (nuisance variables) жетілдіруді кезектестіретін координаттық көтерілу әдісі. 2-алгоритм B-RECOVAR қалдық кіші кеңістікті бағалаушысын сипаттайды, ол ab initio гетерогенді тапсырмалар үшін бастапқы кластарды бөлуді қамтамасыз етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кері диффузия — кездейсоқ шудан жоғары сапалы кескін немесе құрылым алу үшін шуды кезең-кезеңімен алып тастау процесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"aldyn-ala-oengdeu\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#aldyn-ala-oengdeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Алдын ала өңдеу&lt;/span&gt;&lt;/a&gt;Алдын ала өңдеу&lt;/h4&gt;\n&lt;p&gt;Синтетикалық деректер жинағы PDB құрылымдары негізінде дайындалды. Шусыз бөлшектер Xexpt құрылымын кескін қалыптастыру моделі арқылы проекциялау жолымен алынды. Фурье аймағында ақ Гаусс шуы қосылды, мұнда &lt;span class=\"yfm-latex\" data-content=\"%5Csigma_%7Bnoise%7D%20%3D%20%20ext%7Bstd%7D(%5Chat%7By%7D)%20%2F%20%5Csqrt%7B%5BSNR%5D(..%2Fconcepts%2Fsubstantia-nigra-pars-reticulata.md)%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; формуласы қолданылды. Тәжірибелерде SNR мәні 0,01 немесе 0,005 деп белгіленді.&lt;/p&gt;\n&lt;p&gt;Эксперименталды деректер EMPIAR базасынан жүктелді. Процесс STAR файлдарындағы бөлшектерді сұрыптауды, жарамсыздарын алып тастауды, орталықтандыруды, 128 × 128 пиксельге дейін Фурье-қиюды, фазаны түзетуді және 0,4 радиусты жұмсақ дөңгелек масканы қолдануды қамтыды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Синтетикалық деректер 0,01–0,005 SNR деңгейінде дайындалды, ал нақты деректер EMPIAR-дан алынып, қатаң сүзгіден және стандарттаудан өтті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"bazalykh-aedister\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#bazalykh-aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Базалық әдістер&lt;/span&gt;&lt;/a&gt;Базалық әдістер&lt;/h4&gt;\n&lt;p&gt;Белгілі позициялармен (poses) жұмыс істеуде RELION және CryoDRGN салыстырылды. CryoDRGN тренингі zdim=8 және n=50 параметрлерімен өткізілді. RELION-да 60 Å төмен жиілікті тірек маскасы қолданылды. Ab initio (позициясыз) тапсырмаларда CryoDRGN-AI (zdim=8, 50 дәуір) және RELION салыстырылды. RELION екі кезеңде жұмыс істеді: VDAM арқылы бастапқы модель (200 итерация, K=1) және кездейсоқ жартыға бөлу арқылы 3D-авторефаймент. Fold’EM әдісінде кейінгі нақтылау үшін бірінші кезеңдегі позициялар мен карта пайдаланылды. Гетерогенді жинақтар алдымен кластерленіп, әр топ үшін жеке реконструкция орындалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/ab-initio-rekonstruktsiya.html\"&gt;Ab initio реконструкция&lt;/a&gt; — бұл бөлшектердің бағыты туралы алдын ала мәлімет болмаған кезде 3D-құрылымды қалпына келтіру әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Кесте 9.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-tT9.jpg\" alt=\"Кесте 9\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"alphafold3-zhaene-apparattykh-resurstar\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#alphafold3-zhaene-apparattykh-resurstar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AlphaFold3 және аппараттық ресурстар&lt;/span&gt;&lt;/a&gt;AlphaFold3 және аппараттық ресурстар&lt;/h4&gt;\n&lt;p&gt;Protenix v1.0.4 (AlphaFold3 имплементациясы), карталар мен позицияларды бағалау үшін RELION 5.0.0 және валидация үшін Phenix v1.21.2-5419 қолданылды. Тәжірибелер NVIDIA H100 және L40S GPU-ларында, Debian GNU/Linux 12 жүйесінде орындалды.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 11.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-tT11.jpg\" alt=\"Кесте 11\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"sokhtyghysu-zhaene-bajlanys-uzyndyghy-ueshin-ajyppuldar\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#sokhtyghysu-zhaene-bajlanys-uzyndyghy-ueshin-ajyppuldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Соқтығысу және байланыс ұзындығы үшін айыппұлдар&lt;/span&gt;&lt;/a&gt;Соқтығысу және байланыс ұзындығы үшін айыппұлдар&lt;/h4&gt;\n&lt;p&gt;Құрылымдардың физикалық тұрғыдан дұрыстығын қамтамасыз ету үшін регуляризаторлар қолданылады. Байланыс ұзындығының айыппұлы Lbond m атом үшін δbond = 0,2 Å рұқсатпен есептеледі. Соқтығысу айыппұлы Lcollision байланыспаған атомдардың бір-біріне кіріп кетуін pcollision = 0,4 Å буферлік қашықтығымен минималдайды. Ансамбльдің жалпы ықтималдығы λbond және λcollision айыппұлдарының қосындысы арқылы анықталады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модельдердің физикалық сенімділігі байланыс ұзындығы (0,2 Å рұқсат) және стерикалық соқтығысулар (0,4 Å буфер) үшін айыппұлдарды минималдау арқылы қамтамасыз етіледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Кесте S24.&lt;/strong&gt; EMPIAR-13396 деректер жиынындағы Fold’EM құрылымдарын MolProbity бағалау&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Санат&lt;/th&gt;\n&lt;th&gt;Көрсеткіш&lt;/th&gt;\n&lt;th&gt;Мәні 1&lt;/th&gt;\n&lt;th&gt;Мәні 2&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Known&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;MolProbity score&lt;/td&gt;\n&lt;td&gt;1.16&lt;/td&gt;\n&lt;td&gt;1.20&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Clashscore&lt;/td&gt;\n&lt;td&gt;1.48&lt;/td&gt;\n&lt;td&gt;1.66&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Ramachandran outliers&lt;/td&gt;\n&lt;td&gt;0.16&lt;/td&gt;\n&lt;td&gt;0.16&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;phenix.molprobity (Williams et al., 2018) көмегімен есептелген медианалық MolProbity score (↓), clash score (↓) және Ramachandran outlier (↓) мәндері.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"relaksaciya\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#relaksaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Релаксация&lt;/span&gt;&lt;/a&gt;Релаксация&lt;/h4&gt;\n&lt;p&gt;Қалған кішігірім соқтығысуларды жою үшін құрылымдар вакуумда AMBER14 күш өрісі көмегімен релаксациядан өткізіледі. Энергия 2,39 ккал/моль шегі және 10,0 ккал/моль/Å қаттылықпен минималданады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AMBER14 күш өрісін пайдалану геометрияны түзету үшін қажет, өйткені оңтайландыру процесінде кейбір кішігірім стерикалық қайшылықтар сақталып қалуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"metrikalar\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#metrikalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Метрикалар&lt;/span&gt;&lt;/a&gt;Метрикалар&lt;/h4&gt;\n&lt;p&gt;Fold’EM жасаған құрылымдардың дәлдігін бағалау үшін Cα-атомдары бойынша орташа квадраттық ауытқу (RMSD) қолданылады. Алдымен X құрылымы Кабш алгоритмі (Rkabsch және tkabsch) арқылы эксперименталды Xexpt құрылымымен сәйкестендіріледі. Содан кейін RMSDCα = √ (1/NCα) * Σ /Rkabschxi + tkabsch - xexpt i/^2 формуласы есептеледі, мұнда NCα — сәйкестендірілген атомдар саны.&lt;/p&gt;\n&lt;p&gt;Жаһандық құрылымдық ұқсастықты бағалау үшін TM-score қолданылады, ол RMSD-ге қарағанда жергілікті ауытқуларға сезімтал емес. Ол TMScore = max(R,t) (1/Lref) * Σ [1 / (1 + (di(R,t)/d0(Lref))^2)] формуласымен анықталады, мұнда Lref — қалдықтар саны, d0(Lref) = 1.24(Lref-15)^(1/3) - 1.8 Å. TM-score мәндері (0, 1] аралығында болады, үлкен мәндер жоғары ұқсастықты білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RMSD және TM-score метрикалары модельдердің дәлдігін сандық бағалауға мүмкіндік береді: RMSD жергілікті ауытқуды, ал TM-score жаһандық ұқсастықты өлшейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TM-score — бұл ақуыз мөлшеріне қарамастан атомдар арасындағы қашықтықты қалыпқа келтіретін сапа көрсеткіші.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Стереохимиялық сапа phenix.molprobity пакеті арқылы бағаланады. Біз үш көрсеткішті келтіреміз: clashscore (1000 атомға келетін стерикалық қақтығыстар саны), Рамачандран ауытқуларының пайызы (ϕ және ψ бұрыштары рұқсат етілген аймақтан тыс қалдықтар) және жалпы MolProbity балы. MolProbity балы неғұрлым төмен болса, модель сапасы соғұрлым жоғары болады. Рұқсатты бағалау үшін FSC=0.143 критерийі қолданылады, ол phenix.map_box арқылы модельді EMD эксперименталды тығыздық картасымен салыстыру үшін есептеледі.&lt;/p&gt;\n&lt;h4 id=\"krio-em-keskin-khalyptastyru-modeli-zhaene-ykhtimaldykh-funkciyasy\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#krio-em-keskin-khalyptastyru-modeli-zhaene-ykhtimaldykh-funkciyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Крио-ЭМ кескін қалыптастыру моделі және ықтималдық функциясы&lt;/span&gt;&lt;/a&gt;Крио-ЭМ кескін қалыптастыру моделі және ықтималдық функциясы&lt;/h4&gt;\n&lt;p&gt;y бөлшек кескіні үшін X конформациясы мен ϕ позициясы берілгенде, логарифмдік ықтималдық log p(y / X, ϕ) = log p(y / yc(X, ϕ)) түрінде жазылады, мұнда yc — шусыз модельденген кескін.&lt;/p&gt;\n&lt;h4 id=\"keskin-khalyptastyru-modeli\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#keskin-khalyptastyru-modeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кескін қалыптастыру моделі&lt;/span&gt;&lt;/a&gt;Кескін қалыптастыру моделі&lt;/h4&gt;\n&lt;p&gt;X атомдық құрылымы атомдық потенциалдардың суперпозициясы ретінде көрсетіледі: ρX(r) = Σ ρei(r - xi). Фурье кеңістігінде молекула потенциалы bρX(ξ) электронды шашырау факторлары fei(∥ξ∥) және фазалық ығысу арқылы өрнектеледі. Pϕ проекциялау операторы 3D-потенциалды ϕ позициясына (R бұрылу және t ығысу) сәйкес жазықтыққа ауыстырады. Орталық қима теоремасына сәйкес, проекциялау 3D Фурье бейнесінің қимасына сәйкес келеді. Шусыз кескін yc Фурье кеңістігінде контрастты тасымалдау функциясын (CTF) G(ω) қолдану арқылы қалыптасады: yc(X, ϕ) = F^-1[G * SϕbρX].&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CTF (Contrast Transfer Function) — электронды микроскоп енгізетін бұрмалауларды сипаттайтын математикалық функция.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"shu-shu-modeli-zhaene-ykhtimaldykh-funkciyasy\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#shu-shu-modeli-zhaene-ykhtimaldykh-funkciyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шу шу моделі және ықтималдық функциясы&lt;/span&gt;&lt;/a&gt;Шу шу моделі және ықтималдық функциясы&lt;/h4&gt;\n&lt;p&gt;Детектор шуы Пуассон үлестіріміне бағынғанымен, өңделген крио-ЭМ кескіндері үшін қарапайым Пуассон моделі жарамайды. Біз шуды Фурье кеңістігінде қосылатын Гаусс шуы ретінде модельдейміз, мұнда әрбір коэффициент жиілікке тәуелді σ²(ω) дисперсиясы бар нөлдік орташасы бар кешенді Гаусс шамасы болып табылады. Логарифмдік ықтималдық (13)-теңдеумен анықталады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тікелей оңтайландырудың орнына, біз масштабқа инвариантты нормаланған өзара корреляцияны қолданамыз, бұл контрасттың өзгеруіне тұрақтылықты қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Іс жүзінде біз Lcorr(y, y_c) функциясын қолданамыз. Бұл тәсіл глобалды контраст айырмашылықтарын елемей, кескіннің фазалық құрылымы мен жиілік құрамына назар аударуға мүмкіндік береді. &lt;span class=\"yfm-latex\" data-content=\"%5COmega\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; жиілік диапазоны фондық шу мен сенімсіз жоғары жиіліктерді алып тастайды.&lt;/p&gt;\n&lt;h4 id=\"atomdykh-khurylymnan-boelshek-keskinin-renderiu\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#atomdykh-khurylymnan-boelshek-keskinin-renderiu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атомдық құрылымнан бөлшек кескінін рендериу&lt;/span&gt;&lt;/a&gt;Атомдық құрылымнан бөлшек кескінін рендериу&lt;/h4&gt;\n&lt;p&gt;Кескіннің қалыптасу моделі &lt;span class=\"yfm-latex\" data-content=\"X%20%3D%20%5C%7B(x_i%2C%20e_i)%5C%7D_%7Bi%3D1%7D%5Em\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; атомдық құрылымына негізделген. Әрбір атомның потенциалы Z_i амплитудасы және σpx ≈ 0.45 пиксель ені бар изотропты Гаусспен жуықталады. Проекцияны есептеу үшін 3D-тор құрудың қажеті жоқ: &lt;span class=\"yfm-latex\" data-content=\"%5Cphi%20%3D%20(R%2C%20t)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; позасы үшін атомдар 2D-ға проекцияланады және пиксель ауданы бойынша интеграл erf(x) қателік функциясы арқылы аналитикалық түрде табылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Аналитикалық рендериу 2D-Гаусс функцияларының бөлінетіндік қасиетін пайдаланып, есептеу процесін айтарлықтай жылдамдатады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kontrastty-beru-funkciyasy-ctf\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#kontrastty-beru-funkciyasy-ctf\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Контрастты беру функциясы (CTF)&lt;/span&gt;&lt;/a&gt;Контрастты беру функциясы (CTF)&lt;/h4&gt;\n&lt;p&gt;Біз әлсіз фаза жуықтауы шеңберінде CTF параметрлерін модельдейміз. Дефокустау d_u, d_v және астигматизмді ескере отырып, df(θ) тиімді дефокустау анықталады. CTF фазасы γ(ω) электрон толқын ұзындығына λ, сфералық аберрация коэффициентіне C_s және фазалық ығысуға &lt;span class=\"yfm-latex\" data-content=\"%5Cphi\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; тәуелді. G(ω) функциясы проекцияның Фурье-бейнесіне қолданылады, ал фазасы түзетілген деректер үшін /G(ω)/ модулі қолданылады.&lt;/p&gt;\n&lt;h4 id=\"b-recovar-bootstrap-agregaciyalanghan-synyptardy-taghajyndau\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#b-recovar-bootstrap-agregaciyalanghan-synyptardy-taghajyndau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;B-RECOVAR: bootstrap-агрегацияланған сыныптарды тағайындау&lt;/span&gt;&lt;/a&gt;B-RECOVAR: bootstrap-агрегацияланған сыныптарды тағайындау&lt;/h4&gt;\n&lt;p&gt;Ab-initio гетерогенді жағдайларда алгоритм бөлшектерді сыныптарға бастапқы бөлуді талап етеді. CryoDRGN латентті координаттары немесе RECOVAR ковариациясының бас компоненттері сияқты стандартты әдістер, әр сыныпқа келетін бөлшектер саны аз болғанда, шудың (қозғалыс, дефокус, үлгіні дайындау) әсерінен сенімсіз болуы мүмкін. B-RECOVAR әдісі bootstrap-ішкі таңдамаларын пайдаланатын ансамбльдік тәсіл болып табылады. Әр итерация реттелген кері проекция арқылы төмен өлшемді қалдық кеңістікті бағалайды, бөлшектердің коэффициенттерін кластерлейді және белгілерді өзара тексеру (cross-validation) арқылы нақтылайды. Қорытынды белгілер спектрлік дауыс беру арқылы біріктіріледі, мұнда нормаланған дауыс беру шегі бөлшек деңгейіндегі сенімділік балы ретінде қызмет етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;B-RECOVAR шуды сүзу және сыныпқа жататындығы бойынша сенімділікті бағалау үшін ансамбльдік тәсілді қолданып, бөлшектерді жіктеу сенімділігін арттырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"model-zhaene-belgileuler\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#model-zhaene-belgileuler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модель және белгілеулер&lt;/span&gt;&lt;/a&gt;Модель және белгілеулер&lt;/h4&gt;\n&lt;p&gt;K бөлшек кескіндерінің жиынтығы қарастырылады, олар &lt;span class=\"yfm-latex\" data-content=\"%5Crho_1%2C%20%5Cdots%2C%20%5Crho_n\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; тығыздықтары және π_j үлестері бар n конформациялар қоспасын білдіреді. Позалар &lt;span class=\"yfm-latex\" data-content=\"%5Cphi_k\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; және контрастты тасымалдау функциялары (CTF) G_k консенсустық нақтылаудан алынған. Деректер &lt;span class=\"yfm-latex\" data-content=\"%5COmega_a\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; Фурье қабықтарымен шектелген, мұнда төменгі жиіліктер контраст үшін, ал жоғары жиіліктер шу үшін жауап береді. k бөлшегі үшін визуализация операторы &lt;span class=\"yfm-latex\" data-content=\"A_k%20%3D%20G_k%20S_%7B%5Cphi_k%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ретінде жазылады, мұнда &lt;span class=\"yfm-latex\" data-content=\"y_k%20%3D%20%5Calpha_k%5E*%20A_k%20%5Crho_%7Bc_k%7D%20%2B%20%5Cepsilon_k\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;h4 id=\"khaldykh-kengistik\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#khaldykh-kengistik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалдық кеңістік&lt;/span&gt;&lt;/a&gt;Қалдық кеңістік&lt;/h4&gt;\n&lt;p&gt;Сынып ауытқулары &lt;span class=\"yfm-latex\" data-content=\"%5Cdelta_j%20%3D%20%5Crho_j%20-%20%5Cbar%7B%5Crho%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; өлшемі q ≤ n-1 болатын кеңістікті құрайды. Бөлшек қалдығы &lt;span class=\"yfm-latex\" data-content=\"r_k%20%5Capprox%20%5Csum_%7Bm%3D1%7D%5Eq%20b_%7Bcm%7D%20A_k%20U_m%20%2B%20%5Cepsilon'_k\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (14-теңдеу) ретінде өрнектеледі. n=2 болғанда, кеңістік &lt;span class=\"yfm-latex\" data-content=\"%5CDelta%5Crho%20%3D%20%5Crho_1%20-%20%5Crho_2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; векторымен анықталады. Базис W_m мен коэффициенттерді  ildeb_k бағалау үшін дефляциясы бар маскаланған ең кіші квадраттар әдісі қолданылады. M маскасы еріткіштің үлесін басады және бағалау дәлдігін арттырады. Барлық модалар таңдалғаннан кейін, коэффициенттер әр бөлшек үшін бірлесіп анықталады және k-means кластерлеуі қолданылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дефляциясы бар ең кіші квадраттар әдісі құрылымның ең маңызды компоненттерін (модаларын) дәйекті түрде табады және қалған сигналдарды бөліп алу үшін оларды деректерден \"алып тастайды\".&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"oezara-tekseru-arkhyly-nakhtylau\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#oezara-tekseru-arkhyly-nakhtylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Өзара тексеру арқылы нақтылау&lt;/span&gt;&lt;/a&gt;Өзара тексеру арқылы нақтылау&lt;/h4&gt;\n&lt;p&gt;Әр итерацияда бөлшектер J және J' екі топқа (фолд) бөлінеді. Әр сынып үшін бір фолд бойынша $ ilde{\\rho}_j^F$ реконструкциясы құрылады, содан кейін басқа фолдтағы бөлшектер &lt;span class=\"yfm-latex\" data-content=\"s_%7Bkj%7D%20%3D%20L_%7Bcorr%7D(%5Ccheck%7By%7D_k%2C%20A_k%20%20ilde%7B%5Crho%7D_j%5E%7BF%5Ec%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; корреляциясы арқылы бағаланады (15-теңдеу). Фолд ішіндегі бағаларды орталықтандыру реконструкция дәлдігіндегі айырмашылықтарды компенсациялайды. Бұл тәсіл өзін-өзі корреляциялауды болдырмайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдіс әр сынып үшін екі фолдта да жеткілікті мөлшердегі бөлшектерді талап етеді, әйтпесе өзара тексеру тұрақсыз нәтижелерге әкелуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ansambldik-dauys-beru\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#ansambldik-dauys-beru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ансамбльдік дауыс беру&lt;/span&gt;&lt;/a&gt;Ансамбльдік дауыс беру&lt;/h4&gt;\n&lt;p&gt;Конформацияға арналған бөлшектер саны аз болғанда, қалдық кеңістіктегі сәйкестендіру тұрақсыз болуы мүмкін (n=2 болса да), себебі кездейсоқ инициализациялар шу бағытын құрылымдық сигнал деп қабылдауы мүмкін. Мұны шешу үшін 2-алгоритмнің B рандомизацияланған репликасы қолданылады, олардың әрқайсысы I_b бөлшектер жиынын, таңдалған жиілік диапазонын және тәуелсіз инициализацияны пайдаланады.  ildec^(b)_k сынып белгілері &lt;a href=\"concepts/vengerskiy-algoritm.html\"&gt;Венгрия алгоритмі&lt;/a&gt; арқылы сәйкестендіріледі.&lt;/p&gt;\n&lt;p&gt;n=2 үшін теңдестірілген дәлдік &lt;span class=\"yfm-latex\" data-content=\"%5Cpsi_b\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; және дауыстар ковариациясы (16)-теңдеуге сәйкес есептеледі, мұнда β = π₁ - π₂. Спектрлік мета-үйренуші арқылы &lt;span class=\"yfm-latex\" data-content=\"u%20%5Cin%20%5Cmathbb%7BR%7D%5EB\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; салмақтары алынады, олар  ildev_k салмақталған дауыс беруді және &lt;span class=\"yfm-latex\" data-content=\"%5Ckappa_k%20%3D%20%2F%20ilde%7Bv%7D_k%2F%20%2F%20%5Csum_%7Bb%3D1%7D%5EB%20%2Fu_b%2F\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; сенімділік көрсеткішін анықтауға мүмкіндік береді. n &amp;gt; 2 болғанда, әдіс «барлығына қарсы біреу» индикаторларына қолданылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ансамбльдік дауыс беру B=24 реплика нәтижелерін спектрлік мета-талдау арқылы біріктіріп, κ_k сенімділік көрсеткіші арқылы шағын таңдамаларда классификация тұрақтылығын арттырады.&lt;br /&gt;\n[!tip] Венгрия алгоритмі — әртүрлі алгоритмдер іске қосылғанда сынып белгілерін бір-біріне сәйкестендіру үшін қолданылатын оңтайландыру әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"recovar-men-salystyru\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#recovar-men-salystyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RECOVAR-мен салыстыру&lt;/span&gt;&lt;/a&gt;RECOVAR-мен салыстыру&lt;/h4&gt;\n&lt;p&gt;RECOVAR және B-RECOVAR консенсустық позициялар мен CTF-терді пайдаланады және нейрондық желілерді оқытуды талап етпейді. RECOVAR-дан айырмашылығы, B-RECOVAR тек n-1 сынып ауытқу модаларын бағалайды, бұл бөлшектер саны аз болғанда шу әсерін азайтады. B-RECOVAR (15)-теңдеудегі өзара тексерілген нақтылау процесін қолданады, бұл бөлшек пен ол салыстырылып жатқан көлем арасындағы өзіндік корреляцияны болдырмайды.&lt;/p&gt;\n&lt;h4 id=\"iske-asyru-maelimetteri\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#iske-asyru-maelimetteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Іске асыру мәліметтері&lt;/span&gt;&lt;/a&gt;Іске асыру мәліметтері&lt;/h4&gt;\n&lt;p&gt;kmin=3 және &lt;span class=\"yfm-latex\" data-content=\"k_%7Bmax%7D%20%5Cin%20%5C%7B24%2C%2032%2C%2040%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; Фурье пикселдері қолданылады. Регуляризация λ_w = 0,1-ге тең. Еріткіш маскасы ең үлкен тығыздығы бар 8% вокселді қамтиды және 2 воксел стандартты ауытқуы бар Гаусс арқылы тегістеледі. Параметрлерге T=8 жаңарту итерациясы, B=24 реплика және 80% бөлшектер шағын таңдамасы кіреді. Әр конформация үшін 5000-нан кем бөлшек болғанда, ансамбльдік агрегация өте маңызды. 10⁴ бөлшек үшін D=128 торда есептеу шамамен 10 минут процессор уақытын алады.&lt;/p&gt;\n&lt;h4 id=\"giperparametrler-zhaene-iske-asyru-egzhej-tegzhejleri\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#giperparametrler-zhaene-iske-asyru-egzhej-tegzhejleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гиперпараметрлер және іске асыру егжей-тегжейлері&lt;/span&gt;&lt;/a&gt;Гиперпараметрлер және іске асыру егжей-тегжейлері&lt;/h4&gt;\n&lt;p&gt;Барлық эксперименттер үшін бірыңғай гиперпараметрлер қолданылды. Жедел жадтың шектеулеріне байланысты, әрбір оңтайландыру қадамында &lt;span class=\"yfm-latex\" data-content=\"%5Cmin(%2FY%2F%2C%20128)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; бөлшектері пайдаланылады. Оңтайландыру алгоритмі ретінде &lt;a href=\"concepts/adam.html\"&gt;Adam&lt;/a&gt; таңдалды, оның оқу жылдамдығы 0,06 және градиенттің максималды нормасы 0,6 деп белгіленді. Байланыстар мен соқтығысулар үшін реттеу коэффициенттері λbond = 10⁻³ және λcollision = 0,09 мәндеріне тең. Сыртқы итерациялар саны R нақты деректер үшін 3, ал синтетикалық деректер үшін 5 құрайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Adam — бұл әрбір параметр үшін оқу жылдамдығын автоматты түрде реттейтін оңтайландыру алгоритмі, ол нейрондық желілердің жылдам үйренуіне мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Априорлық мүшеге келетін болсақ, алдыңғы зерттеулерде &lt;span class=\"yfm-latex\" data-content=\"%5Clog%20p(Z%2Fa)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ықтималдығы өте маңызды болды, өйткені ол оңтайландыру процесінің Pairformer моделіне тән емес эмбеддинг кеңістігіне ауытқуына жол бермеді. Қазіргі параметрлеуде бұл функция ішінара қайта параметрлеу (reparameterization) процесі арқылы орындалады. H-дағы ығысулар шартты айнымалыға тек g функциясы арқылы берілетіндіктен, олар модель архитектурасы қолдайтын бағыттар базисінде өрнектеледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қайта параметрлеу әдісі оңтайландыру процесін тұрақтандырады және қосымша априорлық шектеулерсіз модельдің дұрыс жұмыс істеуін қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Кесте 5.&lt;/strong&gt; Fold’EM және AlphaFold3 салыстыру&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Метрика&lt;/th&gt;\n&lt;th&gt;Әдіс&lt;/th&gt;\n&lt;th&gt;Мәні 1&lt;/th&gt;\n&lt;th&gt;Мәні 2&lt;/th&gt;\n&lt;th&gt;Мәні 3&lt;/th&gt;\n&lt;th&gt;Мәні 4&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Cα RMSD (↓, Å)&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Fold’EM&lt;/td&gt;\n&lt;td&gt;1.78&lt;/td&gt;\n&lt;td&gt;1.57&lt;/td&gt;\n&lt;td&gt;2.35&lt;/td&gt;\n&lt;td&gt;3.07&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Fold’EM&lt;/td&gt;\n&lt;td&gt;3.948&lt;/td&gt;\n&lt;td&gt;3.941&lt;/td&gt;\n&lt;td&gt;7.684&lt;/td&gt;\n&lt;td&gt;6.885&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;t
