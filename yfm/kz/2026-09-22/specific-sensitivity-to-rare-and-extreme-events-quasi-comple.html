\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Әрбір жол бір егеуқұйрықты білдіреді, ал түсті кодтар 2-суретте көрсетілгендей жануардың бейнесін көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте S9.&lt;/strong&gt; BIC values for all augmented Q-Learning model with outcome range-adaptation, withselectedvaluehighlighted Model1 Model2 Model3 Model4&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-tTS9.jpg\" alt=\"Кесте S9\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте S10.&lt;/strong&gt; AIC values for all augmented Q-Learning model with outcome range-adaptation, withselectedvaluehighlighted Model1 Model2 Model3 Model4&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-tTS10.jpg\" alt=\"Кесте S10\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f4.jpg\" alt=\"4-сурет: 20 егеуқұйрықтың әрқайсысы үшін\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет: 20 егеуқұйрықтың әрқайсысы үшін&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-сурет: 20 егеуқұйрықтың әрқайсысы үшін (a) панельдегі «Джекпоттардан» кейін және (b) панельдегі «Қара аққулардан» кейін соңғы 41 сеанс бойынша орташаланған REE-ге жалпы сезімталдықтың және REE-ге біржақты сезімталдықтың жауаптары. Әрбір нүкте бір егеуқұйрықты көрсетеді және нүктелер 2-суреттегідей жануардың профилін көрсету үшін түспен кодталған. Қара пунктирлі сызықтар REE әсерінен кейін оған дейінгі жағдаймен салыстырғанда сезімталдықтың өзгеруі жоқ екенін көрсетеді. Қара тұтас сызықтар сплайн бағалауларын білдіреді - «Материалдар және әдістерді» қараңыз.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f4-2.jpg\" alt=\"Сурет 4 (жалғасы 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 4 (жалғасы 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f5.jpg\" alt=\"5-сурет: REE-ге жалпы сезімталдық (y осі) REE-ге біржақты сезімталдыққа (x осі) қарсы — әр егеуқұйрық үшін 41 сеанс бойы\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет: REE-ге жалпы сезімталдық (y осі) REE-ге біржақты сезімталдыққа (x осі) қарсы — әр егеуқұйрық үшін 41 сеанс бойынша орташа мәндер; жоғарғы панель 2-суреттің оң жақ панелін қайталайды: байқалған сезімталдықтар; төменгі сол жақ панель: таңдалған…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-сурет: REE-ге жалпы сезімталдық (y осі) REE-ге біржақты сезімталдыққа (x осі) қарсы — әр егеуқұйрық үшін 41 сеанс бойынша орташа мәндер; жоғарғы панель 2-суреттің оң жақ панелін қайталайды: байқалған сезімталдықтар; төменгі сол жақ панель: таңдалған модельдерден алынған болжалды сезімталдықтар; төменгі оң жақ панель: жасанды 41 сеанс барысында таңдалған модельдердің жұмысынан есептелген модельденген сезімталдықтар. 5-суретте эмпирикалық түрде байқалған сезімталдықтармен салыстырғандағы (жоғарғы жағы; 2-суреттің оң жақ панелімен бірдей) болжалды сезімталдықтар (төменгі сол жақта) және модельденген сезімталдықтар (төменгі оң жақта) көрсетілген. Болжалды сезімталдықтар — әр егеуқұйрықтың бағаланған параметрлері мен нақты марапат тізбегі арқылы есептелген — эмпирикалық сезімталдық үлгілерін дәл қайталайды. Модельденген сезімталдықтар көк және жасыл фенотиптер үшін медианалық параметрлерді (және қызыл мен қызғылт егеуқұйрықтар үшін жеке параметрлерді) пайдалана отырып, әрбір таңдалған модельді жасанды 41 сеанстық деректер жиыны арқылы іске қосу арқылы алынды. Бұл симуляциялар таңдалған модельдердің көк, қызыл және қызғылт жануарлар үшін тұрақты мінез-құлық фенотиптерін тудыратынын көрсетеді. Алайда, жасыл егеуқұйрықтар тік (Біржақты сезімталдық) осі бойымен екі тұрақты шағын топқа бөлінуге бейім.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f8.jpg\" alt=\"8-сурет: «Материалдар мен әдістер» бөлімінің «Эксперименттік әдіс мәліметтері» бөлімшесіндегі 3-қадамға сәйкес, жаттығу \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-сурет: «Материалдар мен әдістер» бөлімінің «Эксперименттік әдіс мәліметтері» бөлімшесіндегі 3-қадамға сәйкес, жаттығу сессияларында байқталған көрсеткіштермен салыстырғанда соңғы экспериментальды сессияларда байқалған таңдаулардың вариациясы&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;8-сурет: «Материалдар мен әдістер» бөлімінің «Эксперименттік әдіс мәліметтері» бөлімшесіндегі 3-қадамға сәйкес, жаттығу сессияларында байқталған көрсеткіштермен салыстырғанда соңғы экспериментальды сессияларда байқалған таңдаулардың вариациясы; (a) панелінде REE-ге жалпы сезімталдық (y осі) пен REE-ге бір жақты сезімталдықтың (x осі) вариациялары көрсетілген, яғни қою түспен белгіленген нүктелер 20 егеуқұйрықтың әрқайсысы үшін 40 сессия бойынша орташа мәндерді қайталайды (2-суреттегі (c) панелін қараңыз) және сәйкес қою түсті нүктелермен сызықтар арқылы қосылған, ашық түсті нүктелермен бейнеленген сол егеуқұйрық үшін жаттығу сессияларындағы орташа мәндермен жұптастырылған; (b) панелінде жалпы вариация қашықтығы көрсетілген, яғни соңғы сессиялардағы мұрын түртулерін қайталау үшін жаттығу сессияларындағы жалпы мұрын түртулерінің үлесін өзгерту қажет. (a) REE-ге жалпы сезімталдық және REE-ге бір жақты сезімталдық&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-fS1.jpg\" alt=\"S1-сурет: 20 егеуқұйрықтың әрқайсысы үшін дөңестік сыйақылары (жол) — мәліметтер үшін Қосымшаны қараңыз.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S1-сурет: 20 егеуқұйрықтың әрқайсысы үшін дөңестік сыйақылары (жол) — мәліметтер үшін Қосымшаны қараңыз.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;S1-сурет: 20 егеуқұйрықтың әрқайсысы үшін дөңестік сыйақылары (жол) — мәліметтер үшін Қосымшаны қараңыз. Әрбір жол егеуқұйрықты білдіреді және түс коды 2-суреттегідей жануардың бейнесін көрсетеді. Оң жаққа қарай нүкте әр сынақта дөңес мәзір таңдалған жағдайда алынатын санға қатысты қанша пеллет алынғанын көрсетеді. Сол жаққа қарай түрлі-түсті нүкте әр сынақта ойыс мәзір таңдалған жағдайда алынатын санға қатысты алынған айыппұлдың жалпы секундтарын көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-fS2.jpg\" alt=\"Сурет S2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S2&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сирек&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;экстремалды&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;оқиғаларды&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;зерттеу&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;төрт тармақты&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бандит тесті&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мен модель&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қара&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;аққулардан&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қашу және ұтыс&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;іздеу&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;таралу&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;шеттерін&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;дербес өңдеу&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Препринт лицензиясы&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;bioRxiv&lt;/td&gt;\n&lt;td&gt;animal behavior and cognition&lt;/td&gt;\n&lt;td&gt;все права у авторов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Degoulet, M.; Willem, L.-M.; Baunez, C.; Luchini, S.; Pintus, P.&lt;/p&gt;\n&lt;h3 id=\"derekkoezder\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong
