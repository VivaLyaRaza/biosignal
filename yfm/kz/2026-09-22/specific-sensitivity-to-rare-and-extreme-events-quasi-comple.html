        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"277\" cy=\"156\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"503\" cy=\"215\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · ANIMAL BEHAVIOR AND COGNITION   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Егеуқұйрықтар қара&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;аққулардан қалай қашып,&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;джекпот іздейді&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f1.jpg\" alt=\"Figure 1: Experimental Design. (a) Schematic of the operant conditioning chamber. Rats\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 1: Experimental Design. (a) Schematic of the operant conditioning chamber. Rats&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Көптеген зерттеулер шешімдерді болжамды жағдайда тексереді, бірақ шынайы өмір маңызды нәтижелерге толы. Мамандар кеміргіштердің сирек және шектен тыс жағдайларға қалай бейімделетінін тексерді. Ми рутина мен төтенше оқиғаларды бөлек қарастыратыны белгілі болды.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Егеуқұйрықтар сирек жазадан қашу үшін ұсақ шығындарға шыдайды.&lt;/li&gt;\n&lt;li&gt;Бөлек салмақтары бар модель жануарлардың таңдауын жақсы сипаттайды.&lt;/li&gt;\n&lt;li&gt;Ми таралу шеттерін рутинадан бөлек өңдейді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Мінез-құлық тесттерінде нәтижелердің ықтималдығы көбінесе он пайыздан асады. Авторлар ықтималдығы бір пайыздан аз және орташа мәнінен он стандартты ауытқудан асатын сирек оқиғаларды (REE) бағалау ортасын жасады. Төрт тармақты бандит тестінде жануарлар қант түйіршіктері мен уақытты жоғалту жазалары арасында таңдау жасады.&lt;/p&gt;\n&lt;p&gt;Кеміргіштердің мінез-құлқы асимметрияны көрсетті. Егеуқұйрықтар «қара аққулар» деп аталатын сирек жазалардан толық дерлік қашты, бірақ ірі ұтыстарға жартылай ұмтылды. Осының арқасында жануарлар ұсақ шығындарға төзуге келісті. Стандартты оқыту модельдері бұл стратегияны түсіндіре алмады.&lt;/p&gt;\n&lt;p&gt;Зерттеушілер сирек оқиғаларды бөлек салмақтайтын модельді қолданды. Бұл кеміргіштердің миы оқиғалардың орталық бөлігі мен шеттерін дербес өңдейтінін көрсетті. Бұл бөлініс жануарларға зілзалалардан қорғануға көмектеседі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу зертханалық егеуқұйрықтарда жүргізілгендіктен, нәтижелерді адамдардың күрделі шешімдеріне тікелей қолдануға болмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"sirek-zhaene-toetenshe-okhighalargha-taen-sezimtaldykh\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#sirek-zhaene-toetenshe-okhighalargha-taen-sezimtaldykh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сирек және төтенше оқиғаларға тән сезімталдық&lt;/span&gt;&lt;/a&gt;Сирек және төтенше оқиғаларға тән сезімталдық&lt;/h3&gt;\n&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Авторлардың пікірінше, жануарлардың мінез-құлқын зерттеулердің көпшілігі 10%-дан астам ықтималдықтарды қарастырады, ал шынайы шешімдер көбінесе өте сирек кездесетін, бірақ салдары ауыр оқиғаларды бағалауды талап етеді. Осы олқылықтың орнын толтыру үшін зерттеушілер егеуқұйрықтардың сирек (&amp;lt; 1%) және экстремалды (орташа мәннен 10 стандартты ауытқудан асатын) оқиғаларға (REE) қалай бейімделетінін өлшеу үшін тәжірибелік және есептеу жүйесін жасады.&lt;/p&gt;\n&lt;p&gt;Төрт рычагты бандит тапсырмасын қолдана отырып, жануарлар ықтимал марапаттар (қант түйіршіктері) немесе жазалар (күту уақыты) арасында таңдау жасады. Бұл стандартты және ауыр құйрықты таралулар туралы ақпараттың қалай біріктірілетінін зерттеуге мүмкіндік берді.&lt;/p&gt;\n&lt;p&gt;Жануарлардың мінез-құлқы шектеулі әртараптандыруды (әдетте төрт опцияның екеуін таңдау) және REE-ге сезімталдықты көрсетті. Егеуқұйрықлар сирек және экстремалды жазалардан («қара аққулар») жүйелі түрде қашты, бірақ сирек және экстремалды ұтыстарға («джекпоттар») делуге ішінара жол берді. Бұл асимметрия жиі болатын үлкен ұтыстардан бас тарту және жиі болатын шығындарды қабылдау арқылы қол жеткізілді.&lt;/p&gt;\n&lt;p&gt;Нәтижелерді түсіндіру үшін зерттеушілер REE-ні жиі болатын оқиғалардан бөлек бағалайтын күшейтілген оқыту моделін қолданды. Стандартты Q-оқыту моделі байқалған асимметрияны қайталай алмады, ал жаңа модель егеуқұйрық миы орталық таралу мен оның шеткі аймақтарын бөлек қарастыратынын сәтті көрсетті.&lt;/p&gt;\n&lt;h4 id=\"sirek-zhaene-ekstremaldy-okhighalar-turaly-zertteuge-kirispe\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#sirek-zhaene-ekstremaldy-okhighalar-turaly-zertteuge-kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сирек және экстремалды оқиғалар туралы зерттеуге кіріспе&lt;/span&gt;&lt;/a&gt;Сирек және экстремалды оқиғалар туралы зерттеуге кіріспе&lt;/h4&gt;\n&lt;p&gt;Авторлардың пікірінше, белгісіздік жағдайында адамдар мен жануарлардың бейімделу тәртібінде ортаны зерттеу (exploration) мен жинақталған тәжірибені пайдалану (exploitation) негізгі құрамдас бөліктер болып табылады. Дегенмен, мұндай мінез-құлық процестері өте сирек кездесетін және зор салдары бар нәтижелермен — Сирек және экстремалды оқиғалармен (REE) қалай реттелетіні әлі де аз зерттелген. Зертханалық шешім қабылдау тапсырмаларының көпшілігі нәтиже ықтималдығы 10%-дан асатын бөліністерге сүйенеді, бұл табиғи ортаны толық көрсетпейді, өйткені табиғатта сирек оқиғалар түрлердің жойылуына әкелуі немесе технологиялық серпілістерге түрткі болуы мүмкін. Мұндай оқиғалардың ықтималдығы мен ауқымын қалыпты тәжірибе негізінде сенімді бағалау мүмкін еместіктен, REE оқыту механизмі үшін үлкен қиындықтар тудырады. Осы олқылықтың орнын толтыру үшін зерттеушілер мінез-құлық жүйелері нейроғылымында кеңінен қолданылатын егеуқұйрықтарды зерттей отырып, жануарлар 1%-дан аз ықтималдықпен және орташа нәтижеден 10 стандартты ауытқудан асатын REE-мен кездесетін төрт тармақты бандиттің жаңа түрін жасады.&lt;/p&gt;\n&lt;h4 id=\"minez-khulykh-strategiyalary-zhaene-antihrupkolykh-tuzhyrymdamasy\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#minez-khulykh-strategiyalary-zhaene-antihrupkolykh-tuzhyrymdamasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мінез-құлық стратегиялары және антихрупколық тұжырымдамасы&lt;/span&gt;&lt;/a&gt;Мінез-құлық стратегиялары және антихрупколық тұжырымдамасы&lt;/h4&gt;\n&lt;p&gt;Эксперимент аясында авторлар егеуқұйрықтардың экстремалды жоғалтулардың (\"Қара аққулар\") әсерін барынша азайта отырып, экстремалды ұтыстарға (\"Джекпоттар\") қол жеткізу мүмкіндігін сақтайтын стратегияларды қолданатынын тексеруді мақсат етті. «Антихрупколық» концепциясына ұқсас бұл тәсіл джекпоттарды жойып, қара аққулардың әсерін сақтайтын стратегияларды «хрупкий» (нәзік) деп атады. Сонымен қатар, барлық REE-ні жоққа шығаратын «тұрақты» (Robust) және жануарларды екі REE түріне де ұшырататын «осал» (Vulnerable) нұсқалар анықталды. Тапсырма кеңістігі үш ықтималдық доменге бөлінді: қалыпты оқиғалар (шамамен 90%), сирек оқиғалар (шамамен 10%) және REE (1%-дан аз). Марапаттар мен жазалар сызықтық емес түрде масштабталды: дөңес опциялар ықтималдық азайған сайын үлкен ұтыстар әкелді (джекпоттар), ал ойыс опциялар шығындарды арттырды (қара аққулар). Теориялық талдаулар REE ортасында антихрупколық стратегиялардың оңтайлы болатынын көрсетеді, өйткені қара аққулардан қашу ішкі түрде есептелмесе, тым қымбатқа түседі.&lt;/p&gt;\n&lt;h4 id=\"minez-khulykh-metrikalary-zhaene-ree-ge-sezimtaldykhty-baghalau\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#minez-khulykh-metrikalary-zhaene-ree-ge-sezimtaldykhty-baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мінез-құлық метрикалары және REE-ге сезімталдықты бағалау&lt;/span&gt;&lt;/a&gt;Мінез-құлық метрикалары және REE-ге сезімталдықты бағалау&lt;/h4&gt;\n&lt;p&gt;Жануарлардың әртүрлі валенттіліктегі ынталандыруларға (соның ішінде марапат ретінде қант түйіршіктері және жаза ретінде тайм-ауттар) қалай жауап беретінін бағалау үшін ғалымдар екі негізгі мінез-құлық көрсеткішін шығарды. Біріншісі — REE-ге жалпы сезімталдық, ол ұтыс және ұтылыс салаларындағы дөңес таңдаулардың жиынтық жиілігі ретінде анықталады және егеуқұйрықтардың REE-ні өз стратегиясына енгізетінін көрсетеді. Екіншісі — REE-ге бір жақты сезімталдық, бұл дөңес ұтыс таңдаулары мен дөңес шығын таңдаулары арасындағы айырмашылық ретінде есептеледі. Бұл метрика джекпот іздеу мен қара аққулардан қашу арасындағы асимметрияны сандық түрде өлшейді. Әзірленген әдіснамалық тәсіл белгісіздік жағдайында шығындар мен пайданы бағалаудың нейрондық механизмдерін зерттеу үшін жаңа мүмкіндіктер ашады.&lt;/p&gt;\n&lt;h4 id=\"toert-tarmakhty-bandittik-tapsyrmada-sirek-zhaene-toetenshe-okhighalargha-sezimtaldykh-oelshemderi\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#toert-tarmakhty-bandittik-tapsyrmada-sirek-zhaene-toetenshe-okhighalargha-sezimtaldykh-oelshemderi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Төрт тармақты бандиттік тапсырмада сирек және төтенше оқиғаларға сезімталдық өлшемдері&lt;/span&gt;&lt;/a&gt;Төрт тармақты бандиттік тапсырмада сирек және төтенше оқиғаларға сезімталдық өлшемдері&lt;/h4&gt;\n&lt;p&gt;Бұл бөлімde төрт баламалы таңдау тапсырмасында егеуқұйрықтардың сирек және төтенше оқиғаларға реакциясын бағалауға арналған тәжірибелік құрылғы мен әдістеме сипатталған. Зерттеуге 20 егеуқұйрық қатысты, олардың әрқайсысы арнайы камерда 41 сессиядан өтті (Сурет 1a–b). Нәтижелердің ықтималдығы мен көлемі дөңес немесе ойыс заңдылықтар бойынша өзгеретін, бұл кәде сыйлықтар (пелеттер) мен уақытша блоктаулардың үлестірілімін қамтитын.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f1.jpg\" alt=\"Figure 1: Experimental Design. (a) Schematic of the operant conditioning chamber. Rats\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 1: Experimental Design. (a) Schematic of the operant conditioning chamber. Rats&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Зерттеушілер ұтыс пен ұтылыс функцияларын біріктіру арқылы төрт мінез-құлық опциясын қалыптастырды: анти-нәзік, нәзік, тұрақты және осал (Сурет 1c). Анти-нәзік стратегия ірі ұтыстарға қол жеткізуге мүмкіндік беріп, апатты шығындардан сақтануға көмектесті. Артықшылықтарды өлшеу үшін авторлар екі негізгі көрсеткішті есептеп шығарды (Сурет 1d): төтенше оқиғаларға жалпы сезімталдық және пайда мен шығын арасындағы асимметрияны көрсететін бір жақты сезімталдық.&lt;/p&gt;\n&lt;h4 id=\"anti-fragile\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#anti-fragile\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Anti-fragile&lt;/span&gt;&lt;/a&gt;Anti-fragile&lt;/h4&gt;\n&lt;p&gt;Бұл кіші бөлім марапаттарды алу және шығындардан аулақ болу үшін дөңес функцияларды біріктіретін анти-нәзік таңдау опциясына арналған. Мұндай конфигурация жануарларға ірі сыйлықтармен ішінара байланыста болуға және оларды ұзақ тайм-ауттардан қорғауға мүмкіндік береді.&lt;/p&gt;\n&lt;p&gt;Бұл бөлімде p3 ретінде белгіленген аралық модельдеу параметрлері мен мінез-құлық тенденциялары қарастырылады. Олар күшейту тарихына байланысты белгілі бір опцияларды таңдау ықтималдығын сипаттайды.&lt;/p&gt;\n&lt;h4 id=\"robust\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#robust\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Robust&lt;/span&gt;&lt;/a&gt;Robust&lt;/h4&gt;\n&lt;p&gt;Тұрақты (Robust) опция жануарлардың жойқын шығындардан толықтай аулақ болатын, бірақ ірі ұтыстардан бас тартатын стратегиясын білдіреді. Нәтижелер бойынша егеуқұйрықтардың едәуір бөлігі осы стратегияға бейімділік көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"fragile\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#fragile\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fragile&lt;/span&gt;&lt;/a&gt;Fragile&lt;/h4&gt;\n&lt;p&gt;Нәзік (Fragile) стратегия кішігірім тұрақты марапаттар әкеледі, бірақ кеміргіштерді төтенше шығындар қаупіне ұшыратады. Эксперименталды мәліметтер егеуқұйрықтардың басым бөлігі нәзік мінез-құлықтан аулақ болатынын көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"vulnerable\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#vulnerable\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Vulnerable&lt;/span&gt;&lt;/a&gt;Vulnerable&lt;/h4&gt;\n&lt;p&gt;Осал (Vulnerable) опция ірі ұтыстар мен төтенше шығындардың әсерін біріктіріп, сыналушылар үшін белсіздік пен тәуекел деңгейін арттырады. Жануарлар теріс жағдайлардан қорғану үшін тұрақты және анти-нәзік стратегияларды таңдауға тырысады.&lt;/p&gt;\n&lt;h4 id=\"negizgi-fenotip-shekten-tys-syjakhylardy-ishinara-irikteu-arkhyly-shekten-tys-zhazalardan-khatang-tuerde-aulakh-bolu\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#negizgi-fenotip-shekten-tys-syjakhylardy-ishinara-irikteu-arkhyly-shekten-tys-zhazalardan-khatang-tuerde-aulakh-bolu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Негізгі фенотип: шектен тыс сыйақыларды ішінара іріктеу арқылы шектен тыс жазалардан қатаң түрде аулақ болу&lt;/span&gt;&lt;/a&gt;Негізгі фенотип: шектен тыс сыйақыларды ішінара іріктеу арқылы шектен тыс жазалардан қатаң түрде аулақ болу&lt;/h4&gt;\n&lt;p&gt;Бұл бөлімде авторлар шешім қабылдау стратегияларын анықтау үшін 20 егеуқұйрықтың 41 күнлік сессия барысындағы мінез-құлық деректерін талдады. Сирек кездесетін экстремалды оқиғаларға (REE) жалпы сезімталдық пен бір жақты сезімталдықтан тұратын екі өлшемді кеңістікте Сурет 2 арқылы жануарлардың таңдаулары көрсетілді. Нәтижелер көрсеткендей, бірде-бір егеуқұйрық тек бір ғана шекті стратегияны ұстанған жоқ; барлық жануарлар түрлі нұсқаларды біріктірді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f2.jpg\" alt=\"Figure 2: Total sensitivity to Rare and Extreme Events (REE) (y-axis) plotted against one-sided\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 2: Total sensitivity to Rare and Extreme Events (REE) (y-axis) plotted against one-sided&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"population-levelpatterns\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#population-levelpatterns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Population-levelpatterns&lt;/span&gt;&lt;/a&gt;Population-levelpatterns&lt;/h4&gt;\n&lt;p&gt;2a панелінде (шамамен 800 сессияны қамтитын) негізгі деректер көрсетілген, сессиялардың көп бөлігі мінез-құлық кеңістігінің сол жақ бөлігінде орналасқан. Бұл REE-ден аулақ болу стратегияларын білдіреді. Нүктелердің көпшілігі жоғарғы квадрантқа түсіп, орташадан жоғары жалпы сезімталдықты көрсетеді — егеуқұйрықтар апатты шығындардан қашу үшін өз таңдауларын жүйелі түрде бейімдеген.&lt;/p&gt;\n&lt;h4 id=\"zheke-minez-khulykh-profilderi\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#zheke-minez-khulykh-profilderi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жеке мінез-құлық профильдері&lt;/span&gt;&lt;/a&gt;Жеке мінез-құлық профильдері&lt;/h4&gt;\n&lt;p&gt;2b панелінде әр егеуқұйрықтың 41 сессия бойындағы жеке бейіндері көрсетілген. 17-егеуқұйрықты (қызыл) қоспағанда, барлық жануарлар орташа немесе жоғары жалпы сезімталдық танытты. 19-егеуқұйрық (күлгін) ең жоғары сезімталдық пен үлкен сыйлықтарды іздеу қасиетін көрсеткен жалғыз жануар болды. Қалған 18 егеуқұйрық екі тұрақты топқа бөлінді: көк топ (13 егеуқұйрық) шығындардан қашуды және сенімді нұсқаларды таңдаса, жасыл топ (5 егеуқұйрық) ұтыстар мен шығындарға қатысты симметриялы мінез-құлық көрсетті.&lt;/p&gt;\n&lt;h4 id=\"sirek-zhaene-ekstremaldy-okhighalargha-ree-sezimtaldykhty-taldau\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#sirek-zhaene-ekstremaldy-okhighalargha-ree-sezimtaldykhty-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сирек және экстремалды оқиғаларға (REE) сезімталдықты талдау&lt;/span&gt;&lt;/a&gt;Сирек және экстремалды оқиғаларға (REE) сезімталдықты талдау&lt;/h4&gt;\n&lt;p&gt;Авторлар жалпы сезімталдық пен бір жақты сезімталдық (жоғалтудан қашу бейімділігі) арасындағы байланысты зерттеді. Ең сезімтал 16 егеуқұйрықта оң корреляция анықталды: REE-ге күштірек жауап беретін жануарлар «қара аққулардан» (өте жағымсыз оқиғалар) азырақ қашуға бейім, бұл олардың тәуекелге бару стратегиясын өзгертетінін көрсетеді. Бұл байланыс уақыт өте келе күшейе түседі, бұл оқыту процесінде корреляция коэффициентінің 0,17-ден 0,64-ке дейін өсуімен расталады.&lt;/p&gt;\n&lt;h4 id=\"syjakhy-izdeu-zhaene-zhazadan-khashudyng-minez-khulykh-koersetkishteri\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#syjakhy-izdeu-zhaene-zhazadan-khashudyng-minez-khulykh-koersetkishteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сыйақы іздеу және жазадан қашудың мінез-құлық көрсеткіштері&lt;/span&gt;&lt;/a&gt;Сыйақы іздеу және жазадан қашудың мінез-құлық көрсеткіштері&lt;/h4&gt;\n&lt;p&gt;Сурет 2-де авторлар егеуқұйрықтардың екі фенотипін салыстырады: «көк» (REE-ге жоғары сезімталдық және «қара аққулардан» қашу) және «жасыл» (бейтарап мінез-құлық). Сол жақ панель «көк» фенотиптің жағымсыз салдардан жиі қашатынын көрсетсе, оң жақ панель олардың «джекпот» (сирек кездесетін сыйақылар) алуға деген жоғары мотивациясын көрсетеді. Топтар арасындағы айырмашылықтар Уилкоксон тесті бойынша статистикалық тұрғыдан маңызды (p &amp;lt; 0,01).&lt;/p&gt;\n&lt;h4 id=\"khara-akhkhu-saldary-ree-ge-sezimtaldykhty-kueshejtedi,-al-dzhekpottar-olaj-etpejdi\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#khara-akhkhu-saldary-ree-ge-sezimtaldykhty-kueshejtedi,-al-dzhekpottar-olaj-etpejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;«Қара аққу» салдары REE-ге сезімталдықты күшейтеді, ал «джекпоттар» олай етпейді&lt;/span&gt;&lt;/a&gt;«Қара аққу» салдары REE-ге сезімталдықты күшейтеді, ал «джекпоттар» олай етпейді&lt;/h4&gt;\n&lt;p&gt;Сурет 4-те авторлар сирек кездесетін оқиғаға тап болғанға дейінгі және одан кейінгі егеуқұйрықтардың мінез-құлқындағы өзгерістерді талдайды. «Джекпот» алу таңдау стратегиясын дерлік өзгертпейтіні анықталды. Керісінше, «қара аққумен» соқтығысу REE-ге жалпы сезімталдықты жүйелі түрде күшейтеді және жоғалтудан қашу ниетін арттырады. Бұл жағымсыз сирек оқиғалардың шешім қабылдау процесіне жағымды оқиғаларға қарағанда әлдеқайда күшті әсер ететінін және жануарларда өте сақтық стратегиясын нығайтатынын дәлелдейді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f4.jpg\" alt=\"Figure 4 summarizes these within-session dynamics. For each rat (color-coded as in Fig-\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 4 summarizes these within-session dynamics. For each rat (color-coded as in Fig-&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"q-okhytu-modelderi-egeukhujrykhtardyng-minez-khulkhyn-elikteu-ueshin-ree-sheshim-khabyldaudyng-arnajy-salmakhtaryn-khazhet-etedi\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#q-okhytu-modelderi-egeukhujrykhtardyng-minez-khulkhyn-elikteu-ueshin-ree-sheshim-khabyldaudyng-arnajy-salmakhtaryn-khazhet-etedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q-оқыту модельдері егеуқұйрықтардың мінез-құлқын еліктеу үшін REE шешім қабылдаудың арнайы салмақтарын қажет етеді&lt;/span&gt;&lt;/a&gt;Q-оқыту модельдері егеуқұйрықтардың мінез-құлқын еліктеу үшін REE шешім қабылдаудың арнайы салмақтарын қажет етеді&lt;/h4&gt;\n&lt;p&gt;Авторлар егеуқұйрықтардың мінез-құлқын дәл қайталау үшін сирек кездесетін және экстремальды оқиғаларға (REE) — «Қара аққулар» мен ірі ұтыстарға («джекпоттар») сезімталдықты біріктіретін күшейтілген оқыту (Reinforcement Learning) модельдерінің жаңа класын ұсынды. Негізгі мақсат — осы жетілдірілген алгоритмдердің нақты жануарлардың таңдауларын қаншалықты дәл көрсете алатынын бағалау. Модельдің параметрлері әрбір егеуқұйрық үшін бақыланған таңдаулар мен нәтижелер негізінде есептелді.&lt;/p&gt;\n&lt;p&gt;Жаңа модельдің басты ерекшелігі — шешім қабылдау процесінде арнайы салмақтарды қолдану арқылы қалыпты нәтижелерді сирек және экстремальды нәтижелерден ажыратуы. Нәтижелер көрсеткендей, REE-ге сезімталдықты қосу модельдің тәжірибелік деректерге өте жақсы сәйкестенетінін қамтамасыз етті, ал REE ескермейтін стандартты Q-learning моделі барлық дерлік егеуқұйрықтар үшін қабылданбады. Төрт мүмкін нұсқаның әрқайсысы үшін авторлар ұтыс пен ұтылыстың қосалқы мәндерін енгізіп, олар арнайы формулуалар мен оқыту жылдамдықтары арқылы жаңартылатынын көрсетті.&lt;/p&gt;\n&lt;h4 id=\"opciyalar-khundylyghyn-zhaene-sirek-kezdesetin-toetenshe-okhighalardyng-ree-salmakhtaryn-modeldeu\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#opciyalar-khundylyghyn-zhaene-sirek-kezdesetin-toetenshe-okhighalardyng-ree-salmakhtaryn-modeldeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Опциялар құндылығын және сирек кездесетін төтенше оқиғалардың (REE) салмақтарын модельдеу&lt;/span&gt;&lt;/a&gt;Опциялар құндылығын және сирек кездесетін төтенше оқиғалардың (REE) салмақтарын модельдеу&lt;/h4&gt;\n&lt;p&gt;Авторлар стандартты Q-оқыту алгоритмін кеңейте отырып, қолжетімді әрбір таңдаудың құндылығын бағалау үшін ресми модель жасады. (2)-теңдеу екі негізгі компонентті жинақтайды: ұтыс пен ұтылыстың салмақталған ішкі мәндері (λ_g және λ_l параметрлерімен), сондай-ақ 1JP(o) және 1BS(o) индикаторлық функциялары мен γ_g және γ_l коэффициенттері арқылы «джекпоттарға» және «қара аққуларға» бөлінген сирек төтенше оқиғаларға (REE) арналған арнайы салмақтар. Әрбір әрекеттің таңдалу ықтималдығы Softmax функциясы (мультиномиальды Logit моделі) арқылы есептелді. Бастапқы модель γ_g пен γ_l үшін нөлдік мәндерді болжады, ал кеңейтілген модельдер жануарлардың сирек оқиғаларға ерекше мән беріп, оларды әдеттегі орташа марапаттардан бөлек өңдейтіні туралы гипотезаны сынады.&lt;/p&gt;\n&lt;h4 id=\"1-keste-bojynsha-modelderdi-salystyru-zhaene-fenotipterding-taraluy\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#1-keste-bojynsha-modelderdi-salystyru-zhaene-fenotipterding-taraluy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1-кесте бойынша модельдерді салыстыру және фенотиптердің таралуы&lt;/span&gt;&lt;/a&gt;1-кесте бойынша модельдерді салыстыру және фенотиптердің таралуы&lt;/h4&gt;\n&lt;p&gt;Модельдерді сәйкестендіру барысында зерттеушілер сегізге дейін еркін параметрді, соның ішінде ұтыстар мен ұтылыстар үшін оқу және ұмыту жылдамдығын, сондай-ақ REE салмақтарын бағалады. 1-кестеде келтірілген ақпараттық критерийлер негізіндегі салыстыру 20 жануардың 17-сінде таңдау арнайы γ_g және γ_l салмақтары арқылы анықталатынын көрсетті. Егеуқұйрықтардың көпшілігі өз шешімдерін қалыптастыру үшін осы коэффициенттерге сүйенеді. Көк егеуқұйрықтардың азгина бөлігі ғана REE-ні ішкі мәндерге де, шешім салмақтарына да біріктіреді, ал үш егеуқұйрық ерекше REE салмағын пайдаланбайды. Авторлар bunu жануарлардың сирек төтенше оқиғаларды әдеттегі сыйақылардан сапалық тұрғыдан өзгеше қабылдауының дәлелі ретінде түсіндіреді.&lt;/p&gt;\n&lt;h4 id=\"sirek-toetenshe-shyghyndar-men-utystargha-khatysty-asimmetriyalykh-minez-khulykh-reakciyalary\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#sirek-toetenshe-shyghyndar-men-utystargha-khatysty-asimmetriyalykh-minez-khulykh-reakciyalary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сирек төтенше шығындар мен ұтыстарға қатысты асимметриялық мінез-құлық реакциялары&lt;/span&gt;&lt;/a&gt;Сирек төтенше шығындар мен ұтыстарға қатысты асимметриялық мінез-құлық реакциялары&lt;/h4&gt;\n&lt;p&gt;Үзіндінің соңғы бөлігінде әрбір егеуқұйрық үшін 41 сессия бойынша орташаланған төтенше стимулдарға реакциялар асимметриясының мінез-құлық көріністері талқыланады. Нақты байқалған сезімталдықты (2-суреттің логикасын жалғастыратын жоғарғы панель), таңдалған модельдерден алынған болжалды мәндерді (төменгі сол жақ панель) және жасанды сессиялар бойынша симуляцияларды (төменгі оң жақ панель) салыстыру модельдің болжау дәлдігінің жоғары екенін көрсетеді. Алынған нәтижелер жануарлардың сирек ірі ұтыстар мен ұтылыстарға тап болған кезде айқын асимметрия көрсететінін растайды және бұл ұсынылған тәсіл шеңберінде γ_g және γ_l параметрлері арқылы сәтті қамтылады.&lt;/p&gt;\n&lt;h4 id=\"naetizheleri-men-interpretaciyasy\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#naetizheleri-men-interpretaciyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелері мен интерпретациясы&lt;/span&gt;&lt;/a&gt;Нәтижелері мен интерпретациясы&lt;/h4&gt;\n&lt;p&gt;Авторлар алдымен тәжірибедегі барлық егеуқұйрықтардың сирек кездесетін оқиғаларға (REE) белгілі бір деңгейде сезімталдық көрсететінін, көп жануарларда бұл көрсеткіш орташа немесе жоғары екенін анықтады. Екіншіден, зерттеушілер басым мінез-құлық фенотипін атап өтті: кеміргіштер «қара аққулардан» (жағымсыз сирек оқиғалар) дерлік толықтай қашып, «джекпоттарға» (жағымды сирек оқиғалар) жартылай ғана ұмтылған. Алынған деректер жағымсыз және жағымды сирек стимулдарға реакция жасаудағы іргелі асимметрия ретінде түсіндіріледі.&lt;/p&gt;\n&lt;p&gt;Ықтимал шектеулерді талқылай отырып, авторлар толық джекпотқа ұмтылмауға қанығу әсер етпеді деп толық жоққа шығара алмайтынын, бірақ зерттеушілер жануарлардың оны іздеуді мүлдем тоқтатқан сәттерін тіркемегенін атап өтеді. Сирек нәтижелер әр сессиядағы 10-шы немесе 60-шы белсендіруге сәйкес келетін етіп жоспарланғандықтан (Қосымша материалдардағы S1 кестені қараңыз), жануарлар бұл заңдылықты меңгерді ме деген сұрақ туындайды. Егер кеміргіштер бұл аралықты шынымен үйреніп алса, олардың таңдау стратегиясы анағұрлым оңтайлы болар еді.&lt;/p&gt;\n&lt;p&gt;Атап айтқанда, джекпотты ұсынатын нұсқалар жиі болатын пайданы барынша арттыру тұрғысынан оңтайлы емес, сондықтан жануарлар оларды тек 10-шы және 60-шы әрекеттер кезінде ғана таңдауы тиіс еді. Олардың қалған таңдауларының көп бөлігі жиі болатын табысы үлкен нұсқаларға бағытталуы керек болатын. Алайда іс жүзінде байқалатын мінез-құлық мүлдем басқаша көрінеді.&lt;/p&gt;\n&lt;h4 id=\"sirek-okhighalardyng-asimmetriyasy-zhaene-minez-khulykh-strategiyalary\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#sirek-okhighalardyng-asimmetriyasy-zhaene-minez-khulykh-strategiyalary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сирек оқиғалардың асимметриясы және мінез-құлық стратегиялары&lt;/span&gt;&lt;/a&gt;Сирек оқиғалардың асимметриясы және мінез-құлық стратегиялары&lt;/h4&gt;\n&lt;p&gt;Авторлар жағымсыз экстремалды оқиғалардан (қара аққулардан) қашу мен оң екпінді нәтижелерге (джекпоттарға) ұмтылу арасындағы іргелі айырмашылықты талдайды. Тәжірибе жағдайында егеуқұйрықтар шығындардың белгілі бір дөңес кестелерін таңдау арқылы ірі шығындардан толықтай аулақ бола алды, ал сирек кездесетін оқиғалардың стохастикалық табиғаты салдарынан джекпоттың орындалуы ешқашан кепілдендірілмеген еді (мысалы, 150 әрекет кезінде ықтималдығы 1% болатын оқиғаның көріну ықтималдығы шамамен 78% құрап, нөлдік нәтиже ықтималдығын да қалдырады). Бұл асимметрия жануарларды тәуекелдерді әртүрлі бағалауға мәжбүр етеді: жиі кездесетін ұсақ ұтыстар мен шығындар «қылғын» нұсқаны тартымды етеді, бірақ антифрагильді және сенімді опцияларды біріктіру арқылы қара аққулардан толық қашу жалпы стохастикалық үстемдікті қамтамасыз етеді. Керісінше, толық джекпот соңынан қуу тиімсіз, өйткені жиі болатын ұсақ табыстардан айырылу супер жүлдемен толық өтелмейді, сондықтан аралас стратегия тиімдірек болады.&lt;/p&gt;\n&lt;h4 id=\"egeukhujrykhtardyng-okhuy-zhaene-kengistiktik-nemese-uakhytsha-aeserlerding-zhokhtyghy\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#egeukhujrykhtardyng-okhuy-zhaene-kengistiktik-nemese-uakhytsha-aeserlerding-zhokhtyghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Егеуқұйрықтардың оқуы және кеңістіктік немесе уақытша әсерлердің жоқтығы&lt;/span&gt;&lt;/a&gt;Егеуқұйрықтардың оқуы және кеңістіктік немесе уақытша әсерлердің жоқтығы&lt;/h4&gt;\n&lt;p&gt;Эмпирикалық нәтижелер «көк» егеуқұйрықтар қара аққулардан қашу үшін сенімді және антифрагильді опцияларды біріктіріп, осы логиканы сәтті меңгергенін көрсетеді, ал «жасыл» егеуқұйрықтар антифрагильді және нәзік опцияларды араластырып, тәуекелге баруын жалғастырды. Жануарлар мінез-құлық икемділігін көрсеткендіктен, зерттеушілер кеңістіктік бейімділіктің әсерін жоққа шығарды. Жаттығу кезінде сүйікті тесік антифрагильді опцияға арнайы берілсе және сирек оқиғалар 10-шы және 60-шы әрекеттерге жоспарланғанымен, егеуқұйрықтар белгілі бір уақытқа немесе орынға тәуелді болып қалған жоқ. Бұл олардың бастапқы жағдайларға қарамастан барлық опцияларды өз бетінше меңгергенін дәлелдейді.&lt;/p&gt;\n&lt;h4 id=\"stohastikalykh-uestemdikti-menggeru-zhyldamdyghy\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#stohastikalykh-uestemdikti-menggeru-zhyldamdyghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Стохастикалық үстемдікті меңгеру жылдамдығы&lt;/span&gt;&lt;/a&gt;Стохастикалық үстемдікті меңгеру жылдамдығы&lt;/h4&gt;\n&lt;p&gt;Теориялық тұрғыдан жануарлар жиі болатын салалардағы стохастикалық үстемдікті тез анықтауы тиіс, бірақ бұрынғы жұмыстар мен ағымдағы деректер бұл үшін көптеген сессиялар қажет екенін көрсетеді. Авторлар мұны ықтималдықтарды дұрыс бағалау үшін жануарларға сирек оқиғалардың әлі орын алмағанын және оларды болжамды үлгіден алып тастауға болатынын түсіну үшін үлкен тәжірибе қажет екендігімен түсіндіреді.&lt;/p&gt;\n&lt;h4 id=\"kengejtilgen-q-okhytu-modelderi-ree-kodtau-ueshin-arnajy-nejrondykh-zholdy-usynady\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#kengejtilgen-q-okhytu-modelderi-ree-kodtau-ueshin-arnajy-nejrondykh-zholdy-usynady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кеңейтілген Q-оқыту модельдері REE кодтау үшін арнайы нейрондық жолды ұсынады&lt;/span&gt;&lt;/a&gt;Кеңейтілген Q-оқыту модельдері REE кодтау үшін арнайы нейрондық жолды ұсынады&lt;/h4&gt;\n&lt;p&gt;Авторлар алынған деректерді перспективалар теориясы, шығыннан қашу және белгісіздік тұрғысынан талдайды. Эксперимент егеуқұйрықтардың сирек кездесетін экстремалды оқиғаларға (REE) қатысты белгісіздікті азайту стратегиясын қолданатынын көрсетті: олар «Қара аққулардан» аулақ болып, «Джекпоттарға» деген белгілі бір қызығушылықты сақтайды. Классикалық Q-модельдері бұл мінез-құлықты сипаттай алмады, ал REE-ге сезімталдығы бар жетілдірілген Q-модельдер γl параметрі арқылы нәтижелерді дәл қайталады.&lt;/p&gt;\n&lt;p&gt;Жетілдірілген Q-модельдердің жоғары дәлдігіне сүйене отырып, зерттеушілер жаңа нейробиологиялық гипотезаны ұсынады. Талдау көрсеткендей, «көк» топтағы 13 егеуқұйрық әдеттегі REE-ні Q-мәндерін жаңартудан алып тастайды, бірақ теріс γl параметрі арқылы «Қара аққуларға» қарсы ерекше сезімталдық көрсетеді. Бұл жануарлардың нұсқаларды бағалау кезінде мұндай экстремалды шығындарды орташа мәнге бөлмейтінін, керісінше қауіпті опциялардың субъективті құнын төмендететін арнайы салмақ коэффициентін қолданатынын білдіреді.&lt;/p&gt;\n&lt;h4 id=\"adamdar-ueshin-mangyzy\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#adamdar-ueshin-mangyzy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Адамдар үшін маңызы&lt;/span&gt;&lt;/a&gt;Адамдар үшін маңызы&lt;/h4&gt;\n&lt;p&gt;Авторлар егеуқұйрықтарда алынған нәтижелерді адамдардың қабылдауы мен жады ерекшеліктерімен салыстырады, мұнда сирек және экстримді стимулдар да жоғары маңызға ие. Мұндай сирек оқиғаларды (REE) өңдеу әдеттегі сыйақыларға жауап беретін классикалық дофаминерgикалық жолдардан ерекшеленетін арнайы нейрондық желілерге сүйенуі мүмкін екендігі талқыланады.&lt;/p&gt;\n&lt;p&gt;Жұмыста алдыңғы аралшық және бадамша тәрізді дене сияқты ми құрылымдары эмоциялық маңыздылық пен болжауға болмайтын нәтижелерді өңдеудегі рөлін ескере отырып, экстримді шығындар мен ұтыстарды есепке алуға жауапты болуы мүмкін деп болжанады. Есептеу тұрғысынан алғанда, шектен тыс ауытқуларды жалпы деректерден бөлек қарастыру бағалаулардың бұрмалануын болдырмауға көмектеседі, бұл өзгермелі ортада бейімделу артықшылықтарын береді және болашақ нейроғылыми зерттеулер үшін жаңа бағыттар ашады.&lt;/p&gt;\n&lt;h4 id=\"animalsubjects\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#animalsubjects\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AnimalSubjects&lt;/span&gt;&lt;/a&gt;AnimalSubjects&lt;/h4&gt;\n&lt;p&gt;Бұл бөлімде зерттеу барысында пайдаланылған биологиялық модельдер сипатталған. Тәжірибе үшін салмағы келу кезінде шамамен 200 грамм болатын ересек Lister Hooded тұқымды 20 аталық егеуқұйрық қолданылды. Жануарлар арнайы торларда жұптасып ұсталып, бақыланатын микроклимат пен кері жарық циклі жағдайында бағылды.&lt;/p&gt;\n&lt;p&gt;Мінез-құлық сынақтары кезінде мотивацияны сақтау үшін кеміргіштердің азық рациондары тәуліктік норманың 80 пайызына дейін шектелді, ал су еркін түрде берілді. Жануарларды күтіп-баптау және олармен жұмыс істеу бойынша барлық процедуралар Францияның заңнамалық нормаларына қатаң сәйкес жүргізіліп, жергілікті этика комитетінің ресми мақұлдауынан өтті.&lt;/p&gt;\n&lt;h4 id=\"apparatus\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#apparatus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Apparatus&lt;/span&gt;&lt;/a&gt;Apparatus&lt;/h4&gt;\n&lt;p&gt;Бұл бөлімше тәжірибенің техникалық жабдықталуына арналған, алайда берілген үзіндіде мәтін атауымен аяқталады. Жабдықтар жануарларда сирек кездесетін төтенше жағдайлардан қашу және үлкен марапаттарды іздеу стратегияларын бағалау міндеттерін жүзеге асыру үшін жобаланған.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f3.jpg\" alt=\"Figure 3 reports more intuitive behavioral metrics: the proportion of choices that (i)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 3 reports more intuitive behavioral metrics: the proportion of choices that (i)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f5.jpg\" alt=\"Figure 5: Total Sensitivity to REE (y-axis) against One-sided Sensitivity to REE (x-\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 5: Total Sensitivity to REE (y-axis) against One-sided Sensitivity to REE (x-&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сирек&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;экстремалды&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;оқиғаларды&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;зерттеу&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;төрт тармақты&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бандит тесті&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мен модель&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-widt
