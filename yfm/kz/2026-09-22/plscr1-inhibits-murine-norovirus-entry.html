        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"273\" cy=\"121\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"667\" cy=\"296\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · MICROBIOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Plscr1 ақуызы тышқан&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;норовирусының енуін тежейді&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-f1.jpg\" alt=\"1-сурет: MNV инфекциясын оңтайлы бақылау үшін Plscr1 қажет. (A) Үш түрлі скрининг бойынша консервативті хиттерді көрсете\" /&gt;&lt;/p&gt;\n&lt;p&gt;*1-сурет: MNV инфекциясын оңтайлы бақылау үшін Plscr1 қажет. (A) Үш түрлі скрининг бойынша консервативті хиттерді көрсететін Венн диаграммасы. (B) Бос векторды немесе Plscr1 экспрессиялайтын HeLa-CD300lf клеткалары 0,05 инфекция көптігімен (MOI) MNVCW3 (сол жақта) немесе MNVCR6 (оң жақта) инфекцияланды. Вирустық өнімділік бляшка түзуші бірліктер (PFU) көмегімен есептелді. (C) Тышқан немесе адам Plscr1 экспрессиялайтын HeLa-CD300lf клеткалары 48 сағат бойы 0,05 MOI-да MNVCW3-HiBiT-пен сыналды. Инфекция Nano-Glo HiBiT Lytic Detection System (RLU; салыстырмалы люминесценттік бірліктер) көмегімен сандық түрде бағаланды. (D) Көрсетілген антителалармен тексерілген FLAG-белгісі бар тышқан (ms) немесе адам (hu) Plscr1 экспрессиялайтын HeLa-CD300lf клеткаларының өкілді вестерн-блоттыгы. (E) Векторлық бақылауды немесе Plscr1 экспрессиялайтын, 5,0 MOI-да MNVCW3-пен инфекцияланған және инфекциядан кейінгі көрсетілген сағаттарда (hpi) лизистелген HeLa-CD300lf клеткаларының өкілді вестерн-блоттыгы. (F) Интерферонсыз, 1000 бірлік/мл интерферон α немесе 0,1 мкг/мл интерферон γ өңделген HeLa-CD300lf немесе HeLaΔPlscr1-CD300lf клеткаларының көрсетілген антителалармен тексерілген өкілді вестерн-блоттыгы. (G) HeLa-CD300lf немесе HeLaΔPlscr1-CD300lf клеткалары 0,5 MOI MNVCW3-HiBiT-пен сыналды. 48 сағаттан кейін инфекция Nano-Glo HiBiT Lytic Detection System көмегімен сандық түрде бағаланды. (H) HeLa-CD300lf немесе HeLaΔPlscr1-CD300lf клеткалары интерферон α көрсетілген дозаларымен (Бірлік/мл) өңделді, содан кейін 48 сағат бойы 0,5 MOI-да MNVCW3-HiBiT-пен сыналды. Инфекция Nano-Glo HiBiT Lytic Detection System көмегімен сандық түрде бағаланды. Көрсетілген клетка түрлері үшін интерферон α тиімді концентрациясы 50 (EC50) есептелді. (I) Көрсетілген тіндерде Plscr1+/+ (WT) немесе Plscr1-/- (KO) туыс тармақтардан Plscr1 экспрессиясы. Үзілген сызық анықтау шегін көрсетеді. (J) Plscr1+/+ (WT) немесе Plscr1-/- (KO) туыс тармақтар 1 × 10^6 PFU MNVCW3-пен инфекцияланды және инфекциядан кейін 3 күн өткен соң эвтаназия жасалды. Тоқ ішек, мықын ішек, шажырқай лимфа түйіндері (MLN), көкбауыр және бауыр MNV геномының көшірмелеріне qPCR арқылы талданып, актинге нормаланды. Әрбір тән үшін скрипка диаграммасымен бірге жеке деректер нүктелері көрсетілген. Манн-Уитни тесті бойынша P-мәндері көрсетілген. Үзілген сызық анықтау шегін көрсетеді. Барлық деректер үш тәуелсіз эксперименттің орташа мәні ± стандартты ауытқуы ретінде көрсетілген және Тьюкидің көптік салыстыру тестімен бірфакторлы дисперсиондық талдау (ANOVA) (B және C), t-тест (G) немесе Манн-Уитни (J) арқылы талданды. *P &amp;lt; 0,05, **P &amp;lt; 0,01, ***P &amp;lt; 0,001, ***&lt;em&gt;P &amp;lt; 0,0001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Норовирустар гастроэнтериттің негізгі себебі болып табылады, бірақ ағзаның қорғаныс механизмдері әлі де нашар зерттелген. Ғалымдар интерферонмен ынталандырылатын Plscr1 гені норовирустың көбеюін шектейтінін анықтады. Plscr1 вирустың жасушаға жабысқаннан кейінгі кезеңде енуіне кедергі жасайтыны белгілі болды. VP2 ақуызындағы жалғыз аминқышқылдық алмастыру вирустың бұл қорғанысты айналып өтуіне көмектеседі.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Норовирустар бүкіл әлемде гастроэнтериттің негізгі себептерінің бірі болып табылады, алайда вирус репликациясын тежейтін иесінің факторлары әлі де толық зерттелмеген. CRISPR-активациялау және CRISPR-нокауттау жүйелерін қолдана отырып жүргізілген толық геномдық скринингтерді талдау барысында зерттеушілер интерферонмен ынталандырылатын &lt;em&gt;Plscr1&lt;/em&gt; генін тышқан норовирусы (MNV) үшін шектеуші фактор ретінде анықтады. Plscr1 ақуызы әдетте қабықшалы вирустардың эндоцитоздық мембраналармен қосылуын (fusion) тежейді, сондықтан оның қабықшасыз MNV вирусына қарсы белсенділік көрсетуі күтпеген жаңалық болды. Бұл жұмыста Plscr1 ақуызы &lt;em&gt;in vitro&lt;/em&gt; жағдайында MNV инфекциясын шектеу үшін қажетті әрі жеткілікті екені, сондай-ақ тышқандардың тоқ ішегіндегі инфекцияны бақылауға қатысатыны дәлелденді. Механизм тұрғысынан алғанда, Plscr1 норовирустың жасушаға енуін вирионның жасуша бетіне жабысқаннан кейінгі кезеңінде тежейтіні анықталды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бұған дейін тек қабықшалы вирустарға қарсы әсер етеді деп есептелген Plscr1 ақуызы қабықшасыз тышқан норовирусының (MNV) жасушаға енуін жабысқаннан кейінгі кезеңде тежеп, инфекцияни &lt;em&gt;in vitro&lt;/em&gt; және &lt;em&gt;in vivo&lt;/em&gt; жағдайында тиімді шектейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR-скрининг — бұл CRISPR/Cas9 жүйесінің көмегімен жасушадағы мыңдаған гендерді кезекпен өшіру (нокаут) немесе белсендіру (активация) арқылы олардың белгілі бір процеске (мысалы, вирусқа төзімділікке) әсерін анықтайтын жоғары технологиялық әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кіші капсидті VP2 ақуызындағы бір ғана аминқышқылының алмасуы вирусқа Plscr1 әсеріне төзімділік беретіні анықталды. Калицивирустардың жасушаға енуі кезінде VP2 ақуызы эндоцитоздық мембраналарды тесу арқылы вирустық РНҚ-ны жеткізетіндіктен, бұл жаңалық Plscr1 ақуызының дәл осы енудің соңғы кезеңін нысанаға алатынын көрсетеді. Алынған нәтижелер PLSCR1 ақуызының вирусқа қарши белсенділік аясын қабықшасыз вирустарға дейін кеңейтеді және қабықшалы және қабықшасыз вирустардың жасушаға ену жолдарындағы күтпеген ортақ тоғысу нүктесін айқындайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тышқан норовирусы моделінде жүргізілгендіктен, адам норовирустары мен адамның PLSCR1 ақуызы арасындағы өзара әрекеттесуді толық растау үшін қосымша клиникалық және жасушалық зерттеулер қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"plscr1-mnv-replikaciyasyn-shekteu-ueshin-zhetkilikti\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plscr1-mnv-replikaciyasyn-shekteu-ueshin-zhetkilikti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PLSCR1 MNV репликациясын шектеу үшін жеткілікті&lt;/span&gt;&lt;/a&gt;PLSCR1 MNV репликациясын шектеу үшін жеткілікті&lt;/h4&gt;\n&lt;p&gt;Авторлар әлеуетті вирустық гендерді жүйелі түрде анықтау үшін бұрын жүргізілген үш геномдық CRISPR скринингінің деректерін талдады. Барлық скринингтер тышқан норовирусымен (MNV) инфекциядан кейінгі жасушаның тірі қалуын селективті қысым ретінде пайдаланған пулдағы скринингтер болды, бірақ жасуша түрлері мен стратегиялары бойынша ерекшеленді. Бірінші скрининг BV2 жасушаларында (MNV инфекциясына табиғи түрде бейім тышқан микроглия жасушаларының линиясы) орындалған жоғары тығыздықтағы CRISPR нокауттық скринингі болды, онда теріс селекция стратегиясы арқылы инфекцияға сезімталдықты арттыратын гендер анықталды. Екінші скрининг BV2 жасушаларында CRISPR активация (CRISPRa) тәсілін қолданды, мұнда болжамды вирустық гендердің шамадан тыс экспрессиясы MNV-мен зақымдалған кезде жасушаларға өсу артықшылығын берді. Талдауға енгізілген соңғы скрининг сондай-ақ HeLa жасушаларында MNV рецепторы — CD300lf экспрессиялайтын CRISPRa скринингі болды. Осы үш тәсілді талдау тұрақты түрде MNV-ге қарсы вирустық белсенділігі бар екі генді анықтады: IFITM2 және PLSCR1 (1A-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;CRISPR скринингтері — бұл вирустық инфекция кезінде жасушаның тірі қалуына әсер ететін факторларды табу үшін бүкіл геном масштабында гендердің жұмысын өшіру немесе күшейту үшін қолданылатын жоғары өнімді генетикалық әдістер.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;IFITM2 және PLSCR1 екеуі де интерферонмен стимуляцияланған гендер (ISG) болып табылады және қабықты вирустардың енуін бұғаттауда белгілі вирустық рөлдерге ие. IFITM2 вирустардың эндомембраналық компартменттерден енуін бұғаттайтын IFITM ақуыз отбасына кіреді, ал PLSCR1 барлық үш типтегі IFN арқылы индукцияланады және АИТВ пен SARS-CoV-2-нің эндоцитарлық мембраналармен бірігуін бұғаттайды. Бүгінгі күнге дейін PLSCR1 ешқандай қабықсыз вирусты тежей алатыны көрсетілмеген. Сондықтан авторлар PLSCR1 MNV репликациясын қалай шектейтінін зерттеуге назар аударды. PLSCR1 MNV репликациясын тежеу үшін жеткілікті екенін тексеру үшін олар HeLa-CD300lf жасушаларында PLSCR1 шамадан тыс экспрессияланған кезде MNV көбею қабілетін бағалады (1B-сурет). MNV-тің екі штаммы (MNVCW3 және MNVCR6) бақылау жасушаларында белсенді репликацияланғанымен, тышқан Plscr1 экспрессиясы вирус өсуін айтарлықтай төмендетті (1B-сурет). Тышқан мен адам PLSCR1 ақуыздары тек 75% тізбектік ұқсастыққа ие болғанымен, олардың кез келгенінің шамадан тыс экспрессиясы люцифераза есепші жүйесі көмегімен өлшенгендей HeLa-CD300lf-те MNV репликациясын тежеді (1C және 1D-суреттер). Вирустық өнімнің төмендеуіне сәйкес, Plscr1 экспрессиялайтын жасушалар MNV-мен шайқастан кейін бақылау жасушаларымен салыстырғанда вирустық ақуыз өндірісінің ең аз деңгейін көрсетті (1E-сурет). Жалпы алғанда, бұл деректер PLSCR1 MNV репликациясын тежеу үшін жеткілікті екенін көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"plscr1-in-vitro-zhaghdajynda-mnv-shekteu-ueshin-khazhet\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plscr1-in-vitro-zhaghdajynda-mnv-shekteu-ueshin-khazhet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Plscr1 in vitro жағдайында MNV шектеу үшін қажет&lt;/span&gt;&lt;/a&gt;Plscr1 in vitro жағдайында MNV шектеу үшін қажет&lt;/h4&gt;\n&lt;p&gt;PLSCR1 MNV-ті оңтайлы шектеу үшін қажет екенін анықтау үшін зерттеушілер CD300lf экспрессиялайтын HeLaΔPLSCR1 жасушаларын (HeLaΔPLSCR1-CD300lf) жасады. PLSCR1 нокаут жасалғаны IFN-α немесе IFN-γ стимуляциясынан кейін HeLa-CD300lf және HeLaΔPLSCR1-CD300lf лизаттарында вестерн-блот арқылы расталды (1F-сурет). Скрининг деректеріне сәйкес, MNV-HiBiT-пен зақымдалған кезде HeLa-CD300lf-пен салыстырғанда HeLaΔPLSCR1-CD300lf жасушаларында вирус репликациясының өскені байқалды (1G-сурет). PLSCR1 I типті IFN жауабын күшейтуі немесе тікелей әсер ететін вирустық агент болуы мүмкін екенін тексеру үшін авторлар эндогендік PLSCR1 бар немесе жоқ жағдайда MNV-тің I типті IFN-ге сезімталдығын салыстырды. IFN-α мен емдеу PLSCR1 экспрессиясына қарамастан дозаға тәуелді түрде MNV репликациясын айтарлықтай төмендетті (1H-сурет). Бұл жасуша линиялары арасындағы EC₅₀ мәндерінде айтарлықтай айырмашылықтар байқалмады, бұл PLSCR1 тапшылығы MNV шектеу үшін I типті IFN жауабын өзгертпейтінін көрсетеді (1H-сурет). Осылайша, деректер PLSCR1 MNV-ті оңтайлы бақылау үшін қажетті тікелей вирустық молекула ретінде жұмыс істейтінін растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;PLSCR1 нокауты MNV репликациясының артуына әкеледі, бірақ I типті интерферонға сезімталдықты (EC₅₀) өзгертпейді, бұл PLSCR1-дің тікелей вирустық рөлін дәлелдейді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"plscr1-tapshy-tyshkhandarda-zhuan-ishek-mnv-replikaciyasynyng-birshama-oesui-bajkhalady\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plscr1-tapshy-tyshkhandarda-zhuan-ishek-mnv-replikaciyasynyng-birshama-oesui-bajkhalady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Plscr1 тапшы тышқандарда жуан ішек MNV репликациясының біршама өсуі байқалады&lt;/span&gt;&lt;/a&gt;Plscr1 тапшы тышқандарда жуан ішек MNV репликациясының біршама өсуі байқалады&lt;/h4&gt;\n&lt;p&gt;Интерферон сигналдары in vivo жағдайында MNV инфекциясының динамикасын қалыптастырады. Авторлар бұрын сипатталған Plscr1⁻/- тышқандарын алып, MNV инфекциясына қатысты тіндерде Plscr1 транскрипттерінің деңгейін бағалады. Plscr1 транскрипттері жабайы типтегі тышқандардың барлық зерттелген тіндерінде анықталды — ең жоғары экспрессия жуан және мықын ішекте байқалды, ал нокаутты тышқандарда транскрипттер анықталмады (1I-сурет). Plscr1 жеткілікті және тапшы тышқандарды ауыз арқылы MNVCW3-пен зақымдады және инфекциядан кейін 3 күн өткен соң тіндерді жинады (1J-сурет). Предыдущие есептерге сәйкес, жабайы типтегі тышқандардың талағында, бауырында және мезентериальды лимфа түйіндерінде (MLN) MNVCW3 геномдары анықталды.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;p&gt;Жасушалық линиялар және жасуша культурасы&lt;/p&gt;\n&lt;p&gt;Тәжірибелер үшін 293T, HeLa және BV2 жасуша линиялары қолданылып, олар 5% ірі қара малдың фетальді сарысуы қосылған Dulbecco’s Modified Eagle Medium ортасында өсірілді. Тұрақты жоғары экспрессиясы бар жасушалық линиялар лентивирустық трансдукция көмегімен алынды. Ол үшін лентивирустық плазмидалар қаптаушы psPax2 векторымен және псевдотиптеуші pCMV-VSV-G векторымен бірге Polysciences PEI реагенті арқылы 293T жасушаларына ко-трансфекция жасалды. Трансдукциядан кейін 48 сағат өткен соң лентивирус жиналып, 0.45 мкм сүзгі арқылы сүзілді және жасушаларға қосылды. Тағы 48 сағаттан кейін орта тиісті антибиотиктері бар ортаға (350 мкг/мл гигромицин, 5 мкг/мл бластицидин және/немесе 1 мкг/мл пуромицин) ауыстырылды. Барлық линиялар микоплазмамен ластанбағаны тұрақты түрде тексеріліп отырды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Лентивирустық трансдукция жасуша геномына қажетті генетикалық материалды тұрақты түрде енгізуге және уытты заттардың әсерінен аман қалатын тұрақты популяцияларды бөліп алуға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;HeLaΔPlscr1 нокауттық жасушаларын алу үшін ата-аналық HeLa жасушалары pSpCas9(BB)-2A-Blast және pSpCas9(BB)-2A-Puro плазмидаларымен ко-трансфекцияланды (puro: 5’ GGGTCAAGAAGTCATAACTC 3’, blast: 5’ TCAGGAGGTCTGTGATCAAT 3’). Трансфекциядан кейін 48 сағат өткен соң екі күн бойы 5 мкг/мл бластицидин және 1 мкг/мл пуромицинмен селекция жүргізіліп, содан кейін жасушалар жуылды және антибиотигі жоқ ортаға қайтарылды. Жеке жасушалық клондар шектеулі сұйылту әдісі арқылы бөлініп алынды және Zymo (D3025) жиынтығы көмегімен геномдық ДНК бөлініп шығарылды. ДНК келесі праймерлер көмегімен амплификацияланды (тура: 5’ ggggtatcatcaaaaactgg 3’; кері: 5’ gcacacaacacatggaccac 3’). Әрбір клон үшін инделдер Сэнгер секвенирлеу әдісімен тексерілді. Алынған HeLaΔPlscr1 клоны стоп-кодондары бар аллельдік өзгерістерге ие.&lt;/p&gt;\n&lt;h4 id=\"virustykh-taldaular\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#virustykh-taldaular\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вирустық талдаулар&lt;/span&gt;&lt;/a&gt;Вирустық талдаулар&lt;/h4&gt;\n&lt;p&gt;MNVCW3, MNVCR6 және олардың мутантты нұсқалары молекулалық клондарды 293T жасушаларына трансфекциялау және BV2 жасушаларында амплификациялау арқылы алынды. Вирустық инфекциялар үшін 96-ұяшықты планшеттерге көрсетілген HeLa-CD300lf жасушалары отырғызылып, келесі күні 25 мкл MNV штамдарымен MOI 0.05 көрсеткішінде инокуляцияланды. Планшеттер бөлме температурасында 1 сағат бойы шайқалып, қосымша 75 мкл орта қосылды. Үлгілер 37 °C температурада және 5% \textCO₂ жағдайында инкубацияланып, белгіленген уақыт нүктелерінде −80 °C температурада мұздатылды. Вирус титрлері бляшка түзу әдісімен анықталды. MNV-HiBiT талдаулары 10⁴ H1 HeLa-CD300lf жасушаларын 96-ұяшықты планшеттерге отырғызу және оларды MOI 0.5 немесе 5 кезінде 25 мкл MNV штамдарымен инокуляциялау арқылы жүргізілді. Шайқау және орта қосу процедураларынан кейін үлгілер 37 °C және 5% \textCO₂ ортасында инкубацияланып, −80 °C-та мұздатылды. Ерідіктен кейін люминесценттік белсенділік Nano-Glo HiBiT Lytic Detection System жүйесін қолдана отырып, Synergy LX multi-mode reader аспабында өлшенді.&lt;/p&gt;\n&lt;h4 id=\"plazmidtik-khurylymdar\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plazmidtik-khurylymdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Плазмидтік құрылымдар&lt;/span&gt;&lt;/a&gt;Плазмидтік құрылымдар&lt;/h4&gt;\n&lt;p&gt;Тышқан мен адамның Plscr1 кДНҚ-сы және олардың тиісті мутациялары N-ұшындағы 3xFLAG белгісі бар pCDH-EF1-MCS-IRES-Puro лентивирустық векторына клондолды. MNVCW3 (GenBank EF014462.1) және MNVCR6 (GenBank JQ237823) үшін молекулалық клондар бұрын сипатталған. Барлық плазмидтік тізбектер қолданар алдында толық плазмидтік секвенирлеу арқылы тексерілді.&lt;/p&gt;\n&lt;h4 id=\"immunoblotting\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#immunoblotting\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Иммуноблоттинг&lt;/span&gt;&lt;/a&gt;Иммуноблоттинг&lt;/h4&gt;\n&lt;p&gt;Laemmli буферінде лизиске ұшыраған үлгілер SDS-PAGE көмегімен бөлініп, PVDF мембраналарына ауыстырылды. Мембраналар антителолармен өңдеу алдында 5% құрғақ майсыз сүт қосылған TBS-T ерітіндісінде блокталды. Қолданылған антителолар: тышқанның α-Plscr1 (1:1,000; Sigma MABS482), α-GAPDH-HRP (1:10,000; Sigma G9295), α-FLAG M2-HRP (1:2,500; Sigma A8592), қоянның α-STAT1 phospho Y701 (1:1,000; Cell Signaling 9167S), α-STAT1 (1:1,000; Cell Signaling 9172S), екіншілік α-rabbit-HRP (1:10,000; Thermo Fisher 34102) және α-mouse-HRP (1:10,000; Cell Signaling 7076S). MNV құрылымдық емес ақуыздарына арналған антителолар (тышқанның α-NS1 және қоянның α-NS6/7) бұрынғы әдістерге сай қолданылды. Клондардың тізбегі жабайы типті N M G Q E V I T L E R P L R C S және 17, 25 пен 5 жұп негіздік делеция нұсқаларын қамтиды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-f1.jpg\" alt=\"1-сурет: MNV инфекциясын оңтайлы бақылау үшін Plscr1 қажет. (A) Үш түрлі скрининг бойынша консервативті хиттерді көрсете\" /&gt;&lt;/p&gt;\n&lt;p&gt;*1-сурет: MNV инфекциясын оңтайлы бақылау үшін Plscr1 қажет. (A) Үш түрлі скрининг бойынша консервативті хиттерді көрсететін Венн диаграммасы. (B) Бос векторды немесе Plscr1 экспрессиялайтын HeLa-CD300lf клеткалары 0,05 инфекция көптігімен (MOI) MNVCW3 (сол жақта) немесе MNVCR6 (оң жақта) инфекцияланды. Вирустық өнімділік бляшка түзуші бірліктер (PFU) көмегімен есептелді. (C) Тышқан немесе адам Plscr1 экспрессиялайтын HeLa-CD300lf клеткалары 48 сағат бойы 0,05 MOI-да MNVCW3-HiBiT-пен сыналды. Инфекция Nano-Glo HiBiT Lytic Detection System (RLU; салыстырмалы люминесценттік бірліктер) көмегімен сандық түрде бағаланды. (D) Көрсетілген антителалармен тексерілген FLAG-белгісі бар тышқан (ms) немесе адам (hu) Plscr1 экспрессиялайтын HeLa-CD300lf клеткаларының өкілді вестерн-блоттыгы. (E) Векторлық бақылауды немесе Plscr1 экспрессиялайтын, 5,0 MOI-да MNVCW3-пен инфекцияланған және инфекциядан кейінгі көрсетілген сағаттарда (hpi) лизистелген HeLa-CD300lf клеткаларының өкілді вестерн-блоттыгы. (F) Интерферонсыз, 1000 бірлік/мл интерферон α немесе 0,1 мкг/мл интерферон γ өңделген HeLa-CD300lf немесе HeLaΔPlscr1-CD300lf клеткаларының көрсетілген антителалармен тексерілген өкілді вестерн-блоттыгы. (G) HeLa-CD300lf немесе HeLaΔPlscr1-CD300lf клеткалары 0,5 MOI MNVCW3-HiBiT-пен сыналды. 48 сағаттан кейін инфекция Nano-Glo HiBiT Lytic Detection System көмегімен сандық түрде бағаланды. (H) HeLa-CD300lf немесе HeLaΔPlscr1-CD300lf клеткалары интерферон α көрсетілген дозаларымен (Бірлік/мл) өңделді, содан кейін 48 сағат бойы 0,5 MOI-да MNVCW3-HiBiT-пен сыналды. Инфекция Nano-Glo HiBiT Lytic Detection System көмегімен сандық түрде бағаланды. Көрсетілген клетка түрлері үшін интерферон α тиімді концентрациясы 50 (EC50) есептелді. (I) Көрсетілген тіндерде Plscr1+/+ (WT) немесе Plscr1-/- (KO) туыс тармақтардан Plscr1 экспрессиясы. Үзілген сызық анықтау шегін көрсетеді. (J) Plscr1+/+ (WT) немесе Plscr1-/- (KO) туыс тармақтар 1 × 10^6 PFU MNVCW3-пен инфекцияланды және инфекциядан кейін 3 күн өткен соң эвтаназия жасалды. Тоқ ішек, мықын ішек, шажырқай лимфа түйіндері (MLN), көкбауыр және бауыр MNV геномының көшірмелеріне qPCR арқылы талданып, актинге нормаланды. Әрбір тән үшін скрипка диаграммасымен бірге жеке деректер нүктелері көрсетілген. Манн-Уитни тесті бойынша P-мәндері көрсетілген. Үзілген сызық анықтау шегін көрсетеді. Барлық деректер үш тәуелсіз эксперименттің орташа мәні ± стандартты ауытқуы ретінде көрсетілген және Тьюкидің көптік салыстыру тестімен бірфакторлы дисперсиондық талдау (ANOVA) (B және C), t-тест (G) немесе Манн-Уитни (J) арқылы талданды. *P &amp;lt; 0,05, **P &amp;lt; 0,01, ***P &amp;lt; 0,001, ***&lt;em&gt;P &amp;lt; 0,0001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-f2.jpg\" alt=\"Сурет 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-fS1.jpg\" alt=\"Сурет S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-fS2.jpg\" alt=\"Қосымша сурет 2: Қолжазбада қолданылған түпнұсқа вестерн-блоттар. 3-суретте көрсетілген блоттарға сәйкес келетін өзгерті\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қосымша сурет 2: Қолжазбада қолданылған түпнұсқа вестерн-блоттар. 3-суретте көрсетілген блоттарға сәйкес келетін өзгертілмеген иммуноблот хемилюминесценттік кескіндері.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Норовирусқа&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қарсы қорғаныс&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;белгісіз&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;CRISPR&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;скринингі және&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;зертханалық&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тесттер&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/r
