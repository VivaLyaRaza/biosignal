        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"241\" cy=\"128\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"639\" cy=\"280\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Альцгеймер ауруын зерттеуге&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;арналған адам гиппокампының&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;жасушалық картасы&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f1.jpg\" alt=\"Figure 1. Human Developing Hippocampus Atlas (HuDeHA) captures the temporal dynamics of hippocampal development from ear\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 1. Human Developing Hippocampus Atlas (HuDeHA) captures the temporal dynamics of hippocampal development from early embryonic to postnatal stages.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Ғалымдар эмбриондық кезеңнен жасөспірімдік шаққа дейінгі адам гиппокампының бірыңғай жасушалық атласын жасады. Оның көмегімен отбасылық Альцгеймер ауруын тудыратын мутациясы бар ми органоидтары зерттелді. Талдау барысында жасуша құрамының бұзылуы және нейрондардың ерте жетілуі анықталды. Бұл жаңа деректер базасы зертханада жүйке ауруларын дәлірек модельдеуге көмектеседі.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"adamnyng-damu-uestindegi-gippokampynyng-oemirlik-ciklining-bir-zhasushaly-atlasy-otbasylykh-alcgejmer-auruynyng-mi-organoidtary-ueshin-etalon-bolyp-tabylady\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#adamnyng-damu-uestindegi-gippokampynyng-oemirlik-ciklining-bir-zhasushaly-atlasy-otbasylykh-alcgejmer-auruynyng-mi-organoidtary-ueshin-etalon-bolyp-tabylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Адамның даму үстіндегі гиппокампының өмірлік циклінің бір жасушалы атласы отбасылық Альцгеймер ауруының ми органоидтары үшін эталон болып табылады&lt;/span&gt;&lt;/a&gt;Адамның даму үстіндегі гиппокампының өмірлік циклінің бір жасушалы атласы отбасылық Альцгеймер ауруының ми органоидтары үшін эталон болып табылады&lt;/h3&gt;\n&lt;p&gt;Бұл кіріспе бөлімде АҚШ-тың жетекші ғылыми орталықтарының, соның ішінде Питтсбург университеті мен Гарвард медицина мектебінің зерттеушілері Петр Барановтың жетекшілігімен жұмыстың тақырыбы мен авторларын көрсетеді.&lt;/p&gt;\n&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Авторлар APP, PSEN1 және PSEN2 гендеріндегі мутациялардан туындайтын отбасылық Альцгеймер ауруын зерттейді, мұнда гиппокамп бірінші болып зақымданады. Осыны зерттеу үшін ғалымдар ұрықтың дамуының 3 аптасынан 15,3 жасқа дейінгі аралықты қамтитын 658 059 жасушадан тұратын Адамның дамушы гиппокамп атласын (HuDeHA) құрды. Бұл эталон Колумбия халқында жиі кездесетін PSEN1E280A мутациясы бар ми органоидтарын бағалау үшін қолданылды. Салыстырмалы талдау радиальды глияның азайғанын, жүйке өсіндісінен пайда болған нейрондардың көбейгенін, MEIS2 факторының белсенгенін және TTR ақуызының деңгейі түскенін көрсетті. Алынған нәтижелер HuDeHA жүйесінің маңыздылығын дәлелдейді.&lt;/p&gt;\n&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Бұл бөлім зерттеудің өзектілігіне кіріспе болып табылады және Альцгеймер ауруының ерте сатыларын түсіну үшін бірыңғай транскриптомдық атласты құру қажеттілігін негіздейді.&lt;/p&gt;\n&lt;h4 id=\"naetizheler-adamnyng-damu-uestindegi-gippokamp-atlasy-hudeha-pre-zhaene-postnataaldik-kezengder-arasyndaghy-negizgi-zhasusha-klastaryn-anykhtajdy\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#naetizheler-adamnyng-damu-uestindegi-gippokamp-atlasy-hudeha-pre-zhaene-postnataaldik-kezengder-arasyndaghy-negizgi-zhasusha-klastaryn-anykhtajdy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер: Адамның даму үстіндегі гиппокамп атласы (HuDeHA) пре- және постнатаaldik кезеңдер арасындағы негізгі жасуша кластарын анықтайды&lt;/span&gt;&lt;/a&gt;Нәтижелер: Адамның даму үстіндегі гиппокамп атласы (HuDeHA) пре- және постнатаaldik кезеңдер арасындағы негізгі жасуша кластарын анықтайды&lt;/h4&gt;\n&lt;p&gt;Авторлар ми органоидтарын талдау үшін сенімді эталон жасау мақсатында 658 059 жасушаны қамтитын даму үстіндегі адам гиппокампының атласын (HuDeHA) құрды. Бұл ауқымды деректер базасы құрсақішілік дамудың 3-ші аптасынан 16-шы аптасына дейінгі (PCW3–PCW16) барлық кезеңдерін, сондай-ақ кейінгі фетальды, постнатаaldı және жасөспірімдік жасқа дейінгі кезеңдерді қамтиды. Нейрондық және нейрондық емес сызықтардың болуы қалыпты жағдайдағы жасушалық құрам мен жетілу траекторияларын егжей-тегжейлі сипаттауға мүмкіндік берді.&lt;/p&gt;\n&lt;p&gt;Мұндай атластың жасалуы органоидтарды түсіндірудегі қиындықтарды жеңу үшін қажет еді, өйткені органоид жасушалары көбінесе гетерогенді және жетілмеген болады. HuDeHA-ны эталондық карта ретінде пайдалана отырып, зерттеушілер PSEN1(E280A) мутациясы бар органоидтардағы жасуша популяцияларын нақты анықтап, шынайы патологиялық өзгерістерді өсіру артефактілерінен ажырата алды. Салыстырмалы талдау мутантты органоидтардың радиальды глияның азаюымен, жүйке қыртысынан шыққан нейрондардың көбеюімен және жетілу бағдарламаларындағы өзгерістермен ерекшеленетінін көрсетті.&lt;/p&gt;\n&lt;h4 id=\"hudeha-fad-organoidtarynyng-derekterin-etalon-negizinde-kartagha-tuesiruge-muemkindik-beredi\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#hudeha-fad-organoidtarynyng-derekterin-etalon-negizinde-kartagha-tuesiruge-muemkindik-beredi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HuDeHA fAD органоидтарының деректерін эталон негізінде картаға түсіруге мүмкіндік береді&lt;/span&gt;&lt;/a&gt;HuDeHA fAD органоидтарының деректерін эталон негізінде картаға түсіруге мүмкіндік береді&lt;/h4&gt;\n&lt;p&gt;Авторлар жалпы саны 658 059 жасушасы бар 107 топтаманы біріктіре отырып, адамның даму үстіндегі гиппокампының атласын (HuDeHA) құрды (Сурет 1A; Сурет S1A, B; Кесте S1). Зерттелген уақыт аралығы ұрықтанудан кейінгі 3-ші аптадан бастап постнатальды жасөспірімдік кезеңге (15.3 жасқа) дейінгі кезеңді қамтыды. Белгілі маркерлік гендерді қолдана отырып, зерттеушілер HuDeHA атласында 20 негізгі жасуша класын анықтады (Сурет 1D). Нейроэктодермалық желілерге радиальды глия, аралық ізашар жасушалар, ерте және жетілген нейрондар, сондай-ақ Кахаль-Рициус жасушалары кірді. Глиальды топқа глия ізашарлары, олигодендроцит ізашарлары, жетілген олигодендроциттер мен астроциттер жатты. Сонымен қатар эпендимальды жасушалар, хориоидты өрім жасушалары, жүйке қыртысының популяциялары, сондай-ақ мезенхима, эндотелий және микроглия сияқты эктодермалық емес элементтер анықталды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f1.jpg\" alt=\"Figure 1. Human Developing Hippocampus Atlas (HuDeHA) captures the temporal dynamics of hippocampal development from ear\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 1. Human Developing Hippocampus Atlas (HuDeHA) captures the temporal dynamics of hippocampal development from early embryonic to postnatal stages.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Эмбриональды дамудың 3-ші аптасынан 15.3 жасқа дейінгі жасушалық құрамның динамикасы зерттелді (Сурет 1B, C; Сурет S1D). Ерте эмбриональды үлгілерде радиальды глия мен жүйке қыртысы жасушалары басым болса, кейінгі кезеңдерде ерте нейрондар көбейіп, глия ізашарлары пайда болды. Постнатальды үлгілерде жетілген нейрондар мен дифференциацияланған глия көп болды. CytoTRACE2 алгоритмі арқылы даму әлеуетін бағалау жасушалардың жетілуіне қарай дифференциациялық әлеуеттің біртіндеп төмендейтінін көрсетті (Сурет 1G; Сурет S1C): пролиферацияланатын ізашарларда көрсеткіштер жоғары болса, жетілген нейрондар мен астроциттерде ең төменгі мәндерге жетті.&lt;/p&gt;\n&lt;h4 id=\"dinggekti-kletka-derekterin-taldau-zhaene-kletkalykh-annotaciya\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#dinggekti-kletka-derekterin-taldau-zhaene-kletkalykh-annotaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Діңгекті клетка деректерін талдау және клеткалық аннотация&lt;/span&gt;&lt;/a&gt;Діңгекті клетка деректерін талдау және клеткалық аннотация&lt;/h4&gt;\n&lt;p&gt;Авторлар PSEN1 және APOE гендері бойынша әртүрлі генотиптері бар индуцияланған плюрипотентті діңгекті клеткалардан (iPSC) алынған ми органоидтарының scRNA-seq деректер жиынтығын пайдаланды (барлығы сегіз клеткалық желі). Деректерді біріктіру және белгілеу үшін зерттеушілер HuDeHA эталондық жиынтығы негізінде жасушаларды ортақ латентті кеңістікке прокциялайтын жартылай бақыланатын scPoli нейрондық желі моделін қолданды (Сурет 2A). Бұл тәсіл ата-тектік клеткалар, нейрондар, эпителиial/вентрикулярлық, мезенхималық және жүйке қабығынан (NC) шыққан желілерді сәтті ажыратуға мүмкіндік берді (Сурет 2B). Бұл ретте дифференциацияланған глиялық, иммундық немесе тамырлы клеткалар анықталған жоқ.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f2.jpg\" alt=\"Figure 2. Reference mapping to HuDeHA enables comparison of iPSC-derived brain organoids with in vivo hippocampal cell s\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 2. Reference mapping to HuDeHA enables comparison of iPSC-derived brain organoids with in vivo hippocampal cell states and developmental time. (A) Schematic of the analysis workflow. HuDeHA (PCW 3 to 15.3 years; 20 annotated cell classes) served as reference for scPoli-based transfer of cell-class and developmental-age labels to iPSC- derived PSEN1WT and PSEN1E280A human brain organoids. scPoli was trained on the intersection gene set between reference and query (22,467 genes), and organoid cells were projected into the learned latent space for label prediction. (B) UMAP of iPSC-derived human brain organoids colored by 12 predicted cell classes inferred from HuDeHA, followed by limite&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Нейрондық желі ішінде прогениторлық клеткалар (IPC), сондай-ақ ерте және жетілген нейрондар бөлініп шықты, мұнда ерте нейрондар (19 131 клетка) мен радиальды глия (18 384 клетка) басым болды, ал IPC (1 308 клетка) пен жетілген нейрондар (877 клетка) азшылықты құрады. IPC клеткалары ASCL1 және HES6 маркерлерін көрсетті, ерте нейрондар TUBB3, STMN2 және DCX экспрессиясымен сипатталса, жетілген нейрондар GRIN2B пен GRIA2 экспрессиялады (Сурет 2C, D). Сонымен қатар, негізінен NC компартментінде анықталған S100B күшті сигналы байқалды (Сурет 2B, C), бұл аймақта MPZ, FOXD3 және SOX10 маркерлері де экспрессияланды (Сурет 2D). Алынған нәтижелер органоидтардың клеткалық құрамын жан-жақты сипаттайды.&lt;/p&gt;\n&lt;h4 id=\"annotaciyanyng-belgisizdigin-taldau-zhaene-erekshe-populyaciyalardy-anykhtau\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#annotaciyanyng-belgisizdigin-taldau-zhaene-erekshe-populyaciyalardy-anykhtau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Аннотацияның белгісіздігін талдау және ерекше популяцияларды анықтау&lt;/span&gt;&lt;/a&gt;Аннотацияның белгісіздігін талдау және ерекше популяцияларды анықтау&lt;/h4&gt;\n&lt;p&gt;Авторлар жасушаларды жіктеу моделінің сенімділігіне баға берді; ол жалпы жақсы нәтиже көрсетсе де, эпендима, глиальды прогениторлар және хориоидты өрім үшін жоғары белгісіздікті анықтады (Сурет S2A). Баламалы орналастыру мен каноникалық маркерлерді қолдана отырып, зерттеушілер HuDeHA бақылау атласында тікелей ұқсасы жоқ, CFAP гендеріне (CFAP126, CFAP144, CFAP276, CFAP141, CFAP90) бай бөлек жасуша тобын тапты (Сурет S2B). Бұл популяция ерте эпендималық жасушалар ретінде жіктелді және FOXJ1 экспрессиясымен мен цилиогенез бағдарламасының ішінара іске қосылуымен сипатталды, бірақ кірпікшелердің жиналуына қажетті негізгі гендер болмады [6, 20, 21]. Бұл жасушалар сонымен қатар хориоидты өрім маркерлерімен ішінара сәйкес келіп, органоидтарда қарыншалық эпителийдің дифференциациясы толық емес екенін көрсетті.&lt;/p&gt;\n&lt;h4 id=\"glialdy-progenitorlar-men-radialdy-gliyanyng-sipattamasy\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#glialdy-progenitorlar-men-radialdy-gliyanyng-sipattamasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Глиальды прогениторлар мен радиальды глияның сипаттамасы&lt;/span&gt;&lt;/a&gt;Глиальды прогениторлар мен радиальды глияның сипаттамасы&lt;/h4&gt;\n&lt;p&gt;Глиальды прогениторлар дорсальды ортаңғы сызық және төбе пластинкасының маркерлерімен, соның ішінде LMX1A/B, MSX1 және GDF7-мен байытылғанын көрсетті (Сурет S2C), сондай-ақ WNT отбасы гендерінің таңдамалы экспрессиясын көрсетті (Сурет 2C, Сурет S2C). Сонымен қатар, in vivo глиальды прогениторлардың классикалық маркерлері (TNC, BCAN, NFIB) әлсіз экспрессияланды немесе мүлдем болмады (Сурет S2D). Радиальды глия да болжамның төмен сенімділігін көрсетті (Сурет S2A), бұл органоидтардағы жасуша күйлерінің біркелкі еместігімен түсіндіріледі: SOX2 және NES сияқты негізгі маркерлермен қатар, бұл жасушалар глиальды прогениторларға тән гендерді ішінара көрсетті.&lt;/p&gt;\n&lt;h4 id=\"organoidtardyng-etalondykh-atlaspen-transkripciyalykh-ukhsastyghyn-baghalau\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#organoidtardyng-etalondykh-atlaspen-transkripciyalykh-ukhsastyghyn-baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Органоидтардың эталондық атласпен транскрипциялық ұқсастығын бағалау&lt;/span&gt;&lt;/a&gt;Органоидтардың эталондық атласпен транскрипциялық ұқсастығын бағалау&lt;/h4&gt;\n&lt;p&gt;In vivo және органоид жасушалары арасындағы ұқсастық дәрежесін тәуелсіз бағалау үшін авторлар ең көп ерекшеленетін 1500 ген бойынша Жаккар ұқсастығы мен Пирсон корреляциясын есептеді (Сурет 2E, Сурет S3A-C). Эталондық атласпен ең жоғары сәйкестікті мезенхималық жасушалар (Жаккар индексі 0.38) мен ерте нейрондар (0.32) көрсетті, бұл органоидтық үлгіде негізгі нейрондық және мезенхималық сәйкестіктердің сақталғанын растайды. Пролиферацияланатын прогениторлар радиальды глиямен және пролиферацияланатын жасушалармен сәйкестік көрсетті (0.32 және 0.29). Ерте эпендималық популяция барлық референттік кластармен тұрақты түрде төмен ұқсастық көрсетті. Бақылау популяциялары (астроциттер, олигодендроциттер, микроглия) органоидтармен елеулі ұқсастық көрсетпеді, ал қосымша талдаулар бұл заңдылықтарды толығымен растады (Сурет S3D-F).&lt;/p&gt;\n&lt;p&gt;scPoli көмегімен органоидтардың даму сатыларын болжау&lt;/p&gt;\n&lt;p&gt;Зерттеушілер fAD органоидтарының деректер жиынтығындағы даму кезеңдерінің ұқсастығын бағалау үшін HuDeHA жас аннотацияларына сүйене отырып scPoli құралын қолданды. 2F суретінде көрсетілгендей, болжанған органоид күйлері ерте пренатальды кезеңнен постнатальды кезеңге дейінгі аралықты қамтып, ендіру кеңістігінде жас бойынша қалыпты ұйымдасуды көрсетті.&lt;/p&gt;\n&lt;p&gt;2G суретінде берілген сандык талдау нәтижелері органоид жасушаларының басым бөлігі ерте пренатальды мерзімдерге (негізінен PCW4–PCW9 апталарына) сәйкес келетінін көрсетті. Сонымен қатар, тек 1%-ға жуық жасуша ғана PCW11 және одан кейінгі кезеңдерге, соның ішінде постнатальды жасқа сәйкес келді.&lt;/p&gt;\n&lt;p&gt;Авторлар әрбір жасуша түрі үшін жас топтарына тиесілі жасушалардың үлесін есептеп, оны жылу картасы түрінде көрсетті (2H суреті). Алынған бөлініс биологиялық даму заңдылықтарына толық сәйкес келді: жасуша-текшелері және нейрондық емес популяциялар ерте жастармен байланысты болса, жетілген нейрон тәрізді жасушалар кеш және постнатальды кезеңдерге тән болжамдарды көрсетті.&lt;/p&gt;\n&lt;h4 id=\"psen1e280a-organoidtary-zhasusha-klastarynyng-khuramyndaghy-zhaene-transkripciyalykh-profilderindegi-ajyrmashylykhtardy-koersetedi\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#psen1e280a-organoidtary-zhasusha-klastarynyng-khuramyndaghy-zhaene-transkripciyalykh-profilderindegi-ajyrmashylykhtardy-koersetedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PSEN1E280A органоидтары жасуша кластарының құрамындағы және транскрипциялық профильдеріндегі айырмашылықтарды көрсетеді&lt;/span&gt;&lt;/a&gt;PSEN1E280A органоидтары жасуша кластарының құрамындағы және транскрипциялық профильдеріндегі айырмашылықтарды көрсетеді&lt;/h4&gt;\n&lt;p&gt;Бұл бөлімде авторлар PSEN1E280A мутациясы бақылау (PSEN1WT) органоидтарымен салыстырғанда жасушалық құрамға және гендердің экспрессия профильдеріне қалай әсер ететінін зерттеді. Жасуша топтарының пропорцияларын есептеу үшін scCODA байестік әдісі қолданылды (3A-B сурет). Бұл талдау мутантты органоидтарда жүйке өсіндісінен шыққан нейрондардың (NC-derived neurons) көбейгенін және радиальды глияның азайғанын көрсетті, бұл жасушалық күйдің өзгергенін білдіреді.&lt;/p&gt;\n&lt;p&gt;Содан кейін зерттеушілер жылу картасы (3C сурет) және Cliff’s delta көрсеткіші арқылы болжамды жасты бағалады. Талдау көрсеткіштері бойынша, мутантты органоидтардағы пролиферацияланатын прекурсорлар мен NC-нейрондар бақылау үлгілеріне қарағанда «жас» болып шықты (сәйкесінше 5.5 және 6.7 апта). Дифференциалды экспрессия талдауы NC жасушаларында, нейрондарда және хориоидты өрімде ең үлкен өзгерістерді анықтады (3D сурет). Атап айтқанда, жетілген нейрондарда MEIS2, MEIS1, NR2F1 және TAC1 деңгейлері көтеріліп, HES6, NEUROD1 және NFIA нейрогенез реттеушілері белсенділенді. Пролиферацияланатын жасушаларда S100B мен APOE артып, WNT жолымен байланысты гендер төмендеді. Хориоидты өрімде TTR мен митохондриялық транскрипттердің азайғаны, ал FOLR1 мен MSX1 көбейгені байқалды (S2 кесте).&lt;/p&gt;\n&lt;p&gt;Соңында, авторлар сигналдық жолдардың байытылуын мутантты және бақылау органоидтары арасында, сондай-ақ HuDeHA эталондық жасушаларымен салыстырды (S4A-B суреттер). Ең айқын айырмашылықтар пролиферацияланатын прекурсорларда байқалды, мұнда мутантты органоидтарда WNT сигналдық жолына қатысты көрсеткіштер төмен болды.&lt;/p&gt;\n&lt;h4 id=\"nejrondykh-traektoriyany-taldau-zhetilu-dinamikasynyn-oezgergenin-koersetedi\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#nejrondykh-traektoriyany-taldau-zhetilu-dinamikasynyn-oezgergenin-koersetedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нейрондық траекторияны талдау жетілу динамикасынын өзгергенін көрсетеді&lt;/span&gt;&lt;/a&gt;Нейрондық траекторияны талдау жетілу динамикасынын өзгергенін көрсетеді&lt;/h4&gt;\n&lt;p&gt;Бұл бөлімша атауы зерттеудің келесі кезеңіне кіріспе болып табылады, онда авторлар мутация жағдайында олардың жетілу динамикасын егжей-тегжейлі зерттеу үшін нейрондардың даму траекторияларын талдайды.&lt;/p&gt;\n&lt;h4 id=\"nejrondykh-liniya-zhaene-psevdouakhyttykh-taldau\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#nejrondykh-liniya-zhaene-psevdouakhyttykh-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нейрондық линия және псевдоуақыттық талдау&lt;/span&gt;&lt;/a&gt;Нейрондық линия және псевдоуақыттық талдау&lt;/h4&gt;\n&lt;p&gt;Зерттеушілер HuDeHA деректерін in vivo эталон ретінде пайдалана отырып, аралық ізбасар жасушалар (IPC), ерте және жетілген нейрондар арасындағы псевдоуақыт (pseudotime) траекториясын құрды (4A, B суреттері). Талдау көрсеткіштері бойынша, псевдоуақыттың бастапқы кезеңдерінде нейрогенезге жауап беретін транскрипция факторлары (NEUROG1, ASCL1, NEUROD1, NEUROD4) басым болса, кейінгі кезеңдерде нейрон құрылымы мен синапстық функция гендері (MAPT, SNAP25, SYT1, VAMP2, NLGN1) белсенді болды (4E сурет, S5 сурет). Траектория алты интервалға бөлініп зерттелгенде, жасушалық бағдарламалардың алмасуы анықталды: басында биосинтез бен метаболизм басым болса, соңында нейрондардың дифференциациясы мен синапс ұйымдасуы күшейген (4D сурет). Апоптоз гендерінің соңында емес, басында шоғырланғаны анықталды. Генотиптерді салыстыру барысында, PSEN1WT жасушалары ерте және орташа кезеңдерде жиналса, PSEN1E280A мутантты жасушалары кешірек псевдоуақыт интервалдарында көбірек байқалып, жетілген күйлерге қарай ығысқаны көрінді (4B′, C суреттері).&lt;/p&gt;\n&lt;h4 id=\"in-vivo-salystyru-zhaene-talkhylau\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#in-vivo-salystyru-zhaene-talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;In vivo салыстыру және талқылау&lt;/span&gt;&lt;/a&gt;In vivo салыстыру және талқылау&lt;/h4&gt;\n&lt;p&gt;Авторлар HuDeHA деректері негізінде in vivo траекториясын қайта қалпына келтірді, бұл органоидтардағыдай соңғы сатыда жасушалардың тым көп жиналуын көрсетпеді (S6A–D суреттері). Pearson корреляциясы арқылы жүргізілген салыстыру барлық органоидтық генотиптердің in vivo эталонына қарағанда негізінен ерте кезеңдерге (t1–t2) көбірек ұқсайтынын көрсетті (S6E суреті). Дегенмен, PSEN1E280A органоидтары кешірек псевдоуақытта HuDeHA-ның аралық t3 кезеңіне сәл жоғарырақ ұқсастық көрсетті. «Талқылау» (Discussion) бөлімінде авторлар бұл нәтижелерді қорытындылап, PSEN1E280A мутациясының органоидтық үлгілердегі нейрондық дифференциация қарқыны мен бейініне тигізетін әсерін сипаттайды.&lt;/p&gt;\n&lt;h4 id=\"anykhtamalykh-kartagha-tuesiru-aertuerli-zhaene-organoidkha-taen-populyaciyalardy-anykhtajdy\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#anykhtamalykh-kartagha-tuesiru-aertuerli-zhaene-organoidkha-taen-populyaciyalardy-anykhtajdy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтамалық картаға түсіру әртүрлі және органоидқа тән популяцияларды анықтайды&lt;/span&gt;&lt;/a&gt;Анықтамалық картаға түсіру әртүрлі және органоидқа тән популяцияларды анықтайды&lt;/h4&gt;\n&lt;p&gt;Авторлар HuDeHA атласын қолдана отырып, PSEN1E280A мутациясы бар ми органоидтарының жасушаларын картаға түсірді. Талдау көрсеткіштері бұл органоидтардың негізінен ерте эмбриональды дамуды (шамамен 5-9 апта) қайталайтынын көрсетті, бұл дифференцировка сатысындағы мақсатсыз церебральды органоидтардың прогениторлық құрамына сәйкес келеді. Органоидтарда айқын нейрондық желі, сондай-ақ жүйке қырқасына ұқсас және мезенхималық компартменттер анықталды, ал дифференцияланған глия жасушалары байқалмады. Жүйке қырқасы жасушаларының болуы мутацияның тікелей әсері емес, протоколдағы нейрондық емес күйлердің кеңеюімен түсіндіріледі.&lt;/p&gt;\n&lt;p&gt;Нейрондық желіде радиальды глия мен ерте нейрондар басым болды, ал аралық прогениторлар мен жетілген нейрондар аз мөлшерде ғана кездесті. HuDeHA эталонымен салыстырғанда, хориоидты өрім және эпендималық жасушалардың in vivo күйіне ұқсастығы шектеулі екені анықталды, бұл органоидтардағы қарыншалық жасушалардың жетілмегенін көрсетеді. Сондай-ақ HuDeHA-да тікелей баламасы жоқ, кірпікшелер түзілу бағдарламасы ішінара белсендірілген жетілмеген қарыншалық эпителий жасушаларының популяциясы табылды. Глиальды прогениторларға ұқсас жасушалар ми қалқаны мен кортикальды гем маркерлерін көрсетіп, бұл шын мәніндегі глия емес, кортикальды гемге жақын сигналдық күй екенін аңғартады.&lt;/p&gt;\n&lt;h4 id=\"khuramdykh-taldau-zhaene-zhasushalykh-balans\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#khuramdykh-taldau-zhaene-zhasushalykh-balans\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Құрамдық талдау және жасушалық баланс&lt;/span&gt;&lt;/a&gt;Құрамдық талдау және жасушалық баланс&lt;/h4&gt;\n&lt;p&gt;Авторлар PSEN1E280A мутациясы органоидтардағы жасушалық желілердің таралуына қалай әсер ететінін анықтау үшін талдау жасады. Зерттеу нәтижесінде радиальды глия жасушаларының азайғаны және жүйке өсіндісі популяциясының артқаны байқалып, жасушалық тепе-теңдіктің бұзылғаны анықталды.&lt;/p&gt;\n&lt;p&gt;Бұл өзгерістер бастапқы жасушалардың мінез-құлқының өзгергенін көрсетеді: олар радиальды глияны ұстап тұру қабілетін жоғалтып, нейрондық дифференциацияға тезірек өтеді. Жүйке өсіндісі жасушаларының саны дифференциация әдістемесіне де тәуелді болуы мүмкін болғандықтан, бұл өсуді мутацияның тікелей салдарынан гөрі, онымен байланысты құбылыс деп түсіндіру орынды. Жалпы алғанда, бұл деректер ерте даму сигналдары бұзылған кезде жасушалық желілерді таңдау бағыты ауытқуы мүмкін деген болжамды растайды [28].&lt;/p&gt;\n&lt;h4 id=\"nejrondykh-traektoriyany-taldau-damu-barysynyng-oezgergenin-koersetedi\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#nejrondykh-traektoriyany-taldau-damu-barysynyng-oezgergenin-koersetedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нейрондық траекторияны талдау даму барысының өзгергенін көрсетеді&lt;/span&gt;&lt;/a&gt;Нейрондық траекторияны талдау даму барысының өзгергенін көрсетеді&lt;/h4&gt;\n&lt;p&gt;Бұл бөлімде авторлар PSEN1E280A мутациясының жасуша дифференциациясына қалай әсер ететінін түсіну үшін нейрондардың даму траекторияларын зерттеді. Талдау көрсеткендей, мутантты органоидтар жасуша тағдырын анықтауға, прогениторлық бағдарламаларға және қарыншалық эпителий құрылымдарына әсер ететін транскрипциялық белсенділіктегі елеулі өзгерістерге ұшырайды. Атап айтқанда, аймақтық өрнектелудің өзгергенін көрсететін MEIS2, MEIS1, NR2F1 және TAC1 факторлары экспрессиясының тұрақты өсуі байқалды. Радиалды глия жасушалары S100B және APOE деңгейлерінің жоғарылағанын көрсетіп, жетілген популяциялар пайда болғанға дейін глияның патологиялық процестерге ерте араласатынын көрсетті.&lt;/p&gt;\n&lt;p&gt;Ғалымдар HES6 және NEUROD1 экспрессиясының күшеюі арқылы ерте нейрогендік бағдарламалардың белсендірілгенін тіркеді, бірақ бұл жылдам жетілуден гөрі жетілмеген дифференциацияланған күйдің созылып кеткенін білдіреді. Хорoidтық өріммен байланысты популяцияларда амилоид-бета-ны байланыстыратын негізгі ақуыз транстиретин (TTR) деңгейінің айтарлықтай төмендегені анықталды. Бұл Альцгеймер ауруының патогенезіне тән секреторлық функцияның бұзылуын және Aβ клиренсінің ерте ақауларын көрсетуі мүмкін.&lt;/p&gt;\n&lt;p&gt;Сигналдық жолдарды салыстыру прогениторларда Notch белсенділігінің біршама төмендегенін көрсетті, ал WNT жолдарының басылуы радиалды глия жасушаларының жоғалуы мен нейрондардың жетілу бағытының өзгеруінің ықтимал себебі болып табылады. Картаға түсіру арқылы жасушалардың биологиялық жасын бағалау органоидтардың жүктіліктің 5-9 апталарына (бірінші триместр) сәйкес келетінін көрсетті. Сонымен қатар, мутантты үлгілер жабайы типпен салыстырғанда прогениторлар мен нейрондар үшін жас жасқа қарай кішігірім ауытқуды көрсетті.&lt;/p&gt;\n&lt;h4 id=\"shekteuler\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#shekteuler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер&lt;/span&gt;&lt;/a&gt;Шектеулер&lt;/h4&gt;\n&lt;p&gt;Бұл зерттеудің белгілі бір шектеулері бар. Пайдаланылған органоидтардың деректер жинағында тек екі PSEN1WT және алты PSEN1E280A органоиды болды, бұл статистикалық қуатты шектейді және мутацияға байланысты әсерлерді органоидтар арасындағы өзгермеліктен ажыратуды қиындатады. Сонымен қатар, нерв қырына ұқсас жасушалар популяциясының байқалған өсуі тікелей PSEN1E280A салдарынан гөрі, протоколға тәуелді бағытталу ерекшеліктеріне байланысты болуы мүмкін.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;p&gt;HuDeHA құрастыру үшін деректер жинау және алдын ала өңдеу&lt;/p&gt;\n&lt;h4 id=\"derekterdi-zhinau\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#derekterdi-zhinau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деректерді жинау&lt;/span&gt;&lt;/a&gt;Деректерді жинау&lt;/h4&gt;\n&lt;p&gt;Авторлар ми органоидтарының жасушалық күйлерін салыстыруға және оларды адамның in vivo даму процестерімен байланыстыруға арналған HuDeHA анықтамалық базасын құруға қажетті бастапқы деректерді жинау кезеңін сипаттады.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f3.jpg\" alt=\"Figure 3. PSEN1E280A is associated with altered lineage balance and cell-class-specific dysregulation of neuronal specif\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 3. PSEN1E280A is associated with altered lineage balance and cell-class-specific dysregulation of neuronal specification, progenitor, and ventricular programs.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f4.jpg\" alt=\"Figure 4. PSEN1E280A alters neuronal differentiation toward more mature developmental states.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 4. PSEN1E280A alters neuronal differentiation toward more mature developmental states.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f5.jpg\" alt=\"Figure 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 5&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Ми органоидтар&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ының құрылымын&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бағалау&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қиындығы&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;658 мың&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жасушадан&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тұратын&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;гиппокамп&lt;/text&gt;&lt;text x=\"226\" y=\"162\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;атласы құрыл&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Мутациясы бар&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;органоидтардан&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ақаулар&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;табылды
