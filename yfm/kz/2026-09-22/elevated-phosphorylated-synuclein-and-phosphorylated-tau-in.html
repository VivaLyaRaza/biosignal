        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"210\" cy=\"141\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"670\" cy=\"250\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Тұмау мида із қалдырады:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;LRRK2 мутациясы ақуыз&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;өзгерістерін қалай қоздырады&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in-f1.jpg\" alt=\"1-сурет. Lrrk2G2019S аллельдері тұмау вирусымен (А түрі, H1N1) мұрын арқылы инфицирленген тышқандардың өмір сүру қабілет\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Lrrk2G2019S аллельдері тұмау вирусымен (А түрі, H1N1) мұрын арқылы инфицирленген тышқандардың өмір сүру қабілетін, салмағының өзгеруін немесе өкпедегі вирустық титрлерін өзгертпейді. Осы зерттеуде қолданылған эксперименттік уақыт шкаласы (A). Ересек тышқандарға (еркек және ұрғашы; жасы 5-7 апта) А түріндегі тұмау вирусының (H1N1 серотипі) 2 x бляшка түзуші бірліктері (PFU) мұрын арқылы енгізілді. Өмір сүру қабілеті инокуляциядан кейінгі күндерге (p.i.) қатысты өмір сүру пайызы ретінде графикалық түрде көрсетілген (B, E), ал салмақтар p.i. күндеріне қатысты бастапқы дене салмағының пайызы ретінде көрсетілген (C, F). Деректер ұрғашы (B-D) және еркек (E-G) тышқандар үшін бөлек көрсетілген. Вирустық титрлер өкпеде p.i. 3-күні өлшенді (D, G). Әрбір белгі бір жануарды білдіреді. Қате сызықтары орташа мәнді ± орташа мәннің стандартты қателігін (SEM) көрсетеді. WT = жабайы тип; GS = Lrrk2G2019S мутантты аллелі. Қолданылған статистикалық тесттер: өмір сүру қисықтары үшін лог-ранк (Mantel-Cox) тесті; вирустық титрді талдау үшін бір факторлы дисперсиялық талдау (ANOVA).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Паркинсон ауруына генетикалық бейімділігі бар адамдардың кейбірінде белгілер байқалса, басқаларында неге білінбейді? Зерттеушілер бұған жұқпалы аурулар сияқты сыртқы факторлар түрткі болады деп болжады. Тышқандарға жасалған тәжірибе тұмау вирусы LRRK2 геніндегі мутация аясында ми тіндегі ақуыздардың жиналуына әкелетінін көрсетті. Бұл жаңалық нейродегенеративті аурулардың даму механизмін түсінуге көмектеседі.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;LRRK2 мутациялары тышқандарда өткір тұмаудың ауырлығын өзгертпейді&lt;/li&gt;\n&lt;li&gt;Тұмаудан алты апта өткен соң мида pSer129 альфа-синуклеин деңгейі өседі&lt;/li&gt;\n&lt;li&gt;Инфекция мидағы тотығу стресс пен ақуыз модификациясын күшейтеді&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;LRRK2 геніндегі мутациялар Паркинсон ауруы қаупін арттырады, бірақ патология барлық тасымалдаушыларда дами бермейді. Бұған дейін ғалымдар аурудың көрінуі үшін вирустық инфекция сияқты қосымша сыртқы әсер қажет деп болжаған. Зерттеушілер тобы LRRK2 мутациясы бар (соның ішінде киназа белсенділігі жоғары p.G2019S нұсқасы) тышқандарды H1N1 тұмау вирусымен зақымдап, осы гипотезаны тексеріп көрді.&lt;/p&gt;\n&lt;p&gt;Инфекцияның өткір фазасы мен жануарлардың өмір сүру деңгейі ерекшеленбесе де, алты аптадан кейінгі талдау алаңдатарлық өзгерістерді көрсетті. Гомозиготты LRRK2 p.G2019S мутациясы бар аман қалған тышқандардың миында фосфорланған альфа-синуклеин (pSer129) мен тау-ақуыз (pSer199) деңгейінің өскені анықталды. Сондай-ақ ми протеомында тотығу стресс белгілерінің артқаны тіркелді.&lt;/p&gt;\n&lt;p&gt;Алынған деректер тыныс жолдарының вирустық инфекциясы генетикалық осал ағзаларда ми протеомын өзгертуге қабілетті екенін көрсетеді. Бұл перифериялық инфекциялардың нейродегенеративті үдерістерді бастаудағы рөлін түсіндіруі мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тек жануарлар моделінде және бір вирустық штабта орындалған.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Тұмау вирусының әсері паркинсонизмнің жиілігін арттырады. Бұған дейін біз және басқа зерттеушілер Паркинсон ауруымен байланысты LRRK2 локусындағы аллельді варианттардың иесінің вирулентті микробтарға қарсы жауаптарын модляциялайтынын анықтадық.&lt;/p&gt;\n&lt;p&gt;Біз мұрын арқылы алынған өкпе инфекциясынан кейін ересек жануарларда Lrrk2 мутациялары аурудың нәтижелерін өзгертетінін зерттедік.&lt;/p&gt;\n&lt;p&gt;Біз мутантты нок-ин Lrrk2 генотиптері бар C57BL/6J тышқандарын H1N1 серотипіндегі тұмау вирусымен (1 × LD₅₀ = 2000 тізбек түзуші бірлік) инкуляцияладық.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нок-ин (knock-in) — бұл табиғи жағдайда олардың әсерін зерттеу үшін нақты генді оның мутантты аналогымен (бұл жағдайда Lrrk2 варианттарымен) алмастыратын гендік инженерия әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;H1N1 туындаған пневмония кезінде киназа белсенділігін арттыратын Lrrk2G2019S немесе киназа белсенділігі жоқ Lrrk2D1994S гомозиготалы да, гетерозиготалы да мутациялары жабайы типтегі бауырлас тышқандармен салыстырғанда аурудың ағымын өзгертпеді; бұл тірі қалу көрсеткіштері, вирус титрлері және екі жыныстағы дене салмағының өзгерістері арқылы анықталды. Алайда инокуляциядан алты апта өткен соң H1N1 әсер еткен гомозиготалы Lrrk2 p.G2019S жануарларының миында жалған өңделген мутантты тышқандарға қарағанда жоғары pSer129 α-синуклеин және pSer199 тау-белок деңгейлері байқалды (P &amp;lt; 0.01). Фосфорланған тау мен жалпы таудың және фосфорланған α-синуклеин мен жалпы α-синуклеиннің арақатынастары да H1N1 әсер еткен Lrrk2 p.G2019S тышқандарында өсті (P &amp;lt; 0.05). Сонымен қатар, біз Lrrk2G2019S аман қалғандарының ми протеомының нитротирозинденуі жалған әсер еткен бауырластарына қарағанда айтарлықтай өскенін анықтадық (P &amp;lt; 0.05). Мидағы H₂O₂ концентрациялары H1N1-мен инокуляцияланған аталық жабайы типтегі жануарларда жоғары болды (ұрғашылар мен Lrrk2G2019S тышқандарында да осындай үрдіс байқалды), бұл әсер киназа белсенділігі жоқ Lrrk2D1994S тышқандарында жойылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Өмірге қауіпті пневмотропты РНК вирусының инфекциясын бастан өткерген гомозиготалы Lrrk2G2019S тышқандарында алты аптадан кейін pSer129 α-синуклеин, pSer199 тау және тотығу стресс деңгейлерінің жоғарылағаны анықталды (P &amp;lt; 0.05 – P &amp;lt; 0.01).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Өмірге қауіпті пневмотропты РНК вирусы инфекциясынан аман қалған гомозиготалы Lrrk2G2019S-мутантты тышқандар мидағы тотығу стресі, pSer199 тау және pSer129 α-синуклеин деңгейлерінің өзгерістерін көрсетеді. Бұл нәтижелер адамдарда нейродегенерациямен байланысты өзгерістердің басталуына қатысты болуы мүмкін және LRRK2 мутанттарының пенетранттық жиілігі мен экспрессивтілігіндегі айырмашылықтарды түсіндіруге көмектеседі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тышқан модельдерінде жүргізілген; байқалған биохимиялық өзгерістер олардың адамның Паркинсон ауруының патогенезіне қатыстылығын бағалау үшін қосымша клиникалық растауды қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Паркинсон ауруы (ПА) күрделі нейродегенеративті бұзылыс бола тұра, таралуы артып келеді, алайда бұл аурудың этиологиясы әлі күнге дейін толық анықталмаған. ПА генетикалық қатердің, қоршаған орта факторларының және қартаюдың күрделі өзара әрекеттесуінен пайда болады деп есептеледі. Қоршаған ортаның бірнеше қатер факторлары, соның ішінде нейротропты емес вирустық инфекциялар анықталды. Мысалы, H1N1 серотипінің тұмау A вирусы туындатқан тұмау пандемиясы фон Экономо энцефалитінің, соның ішінде инфекциядан кейінгі паркинсонизммен байланысты түрінің кейіннен пайда болуымен қатар жүрді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Вирустық инфекциялар мен паркинсонизм арасындағы байқалған клиникалық байланыстар негізінен эпидемиологиялық сипатқа ие және адамдарда тікелей себеп-салдарлық байланысты дәлелдемейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жақында жүргізілген зерттеулерде тұмаумен ауырған анамнездің оң болуы (он бес жылға дейінгі кезеңде) ПА сырқаттанушылығының артуымен байланысты екені анықталды. Тышқандарда жоғары патогенді құс тұмауының H1N1 серотипімен (нейротропты вирус) мұрын арқылы инфицирленуі жабайы типтегі тышқандардың миында α-синуклеиннің фосфорлануы мен агрегациясына, сондай-ақ дофаминерgik жасушалардың жоғалуына әкелді. Сонымен қатар, H1N1 ex vivo жағдайында α-синуклеин деңгейін арттыратыны көрсетілді, бұл әсер тұмауға қарсы препаратпен алдын ала өңдеу арқылы жойылды.&lt;/p&gt;\n&lt;p&gt;Қоршаған ортаның қатер факторларынан басқа, ПА қатердің өзгеруімен байланысты 90-нан астам локус анықталды, соның ішінде LRRK2 геніндегі мутациялар, олар мамандандырылған клиникаларда тіркелген паркинсонизм жағдайларының шамамен 2% құрайды. Бұл гендегі мутациялар отбасылық және спорадикалық ПА түрлері үшін де қатер төндіреді, алайда механизмдері әлі де түסiniciksiz болып қала береді. Айта кету керек, LRRK2 мутациялары үшін, соның ішінде ең көп таралған p.G2019S варианты үшін толық емес пенетранттық тән.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Пенетранттық — мутантты геннің фенотипте көріну жиілігі; толық емес пенетранттық мутацияның болуы әрқашан аурудың дамуына әкелмейтінін білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл бізге LRRK2 мутациясын тасымалдаушыларда аурудың көрініс беруі үшін екінші қоздырғыш — генетикалық немесе экологиялық фактор қажет болуы мүмкін деген ой салды; біз және басқа зерттеушілер соңғы фактор микробтық табиғатқа ие болуы мүмкін деп болжадық. Маңыздысы, LRRK2 локусындағы мутациялар Крон ауруымен, алапеспен және жүйелі қызыл жегімен де байланыстырылған. Бұл аурулардың әрқайсысы созылмалы түрде бұзылған қабыну процестерімен сипатталады. Төрт түрлі ауру үшін ортақ қатер локусы LRRK2 эволюциялық сақталған функциясына иммундық жауапты реттеу кіре ме деген мәселені көтереді.&lt;/p&gt;\n&lt;p&gt;LRRK2 гені миға қарағанда шеткері аймақтарда (мысалы, кемік майында, өкпеде) жоғары деңгейде экспрессияланады және нейрондарға қарағанда иммундық жүйе жасушаларында (нейтрофилдер, моноциттер және макрофагтар) көбірек кездеседі. Сонымен қатар, бұл ақуыз жұқпалы патогендер мен қабыну медиаторларының (мысалы, IFN-γ және NF-κB) әсерінен күшеюі мүмкін, бұл LRRK2 патогендерден қорғануға және иммундық жүйенің жауаптарына қатысатынын көрсетеді. Бірқатар зерттеулер LRRK2 бактериялық патогендікке микробқа тәуелді түрде әсер ететінін көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бұл зерттеу C57BL/6J желісіндегі ересек тышқандарда LRRK2 варианттарының өкпе инфекциясына және тұмау вирусы туындататын ми патологиясына әсерін бағалады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз бұрын да вирустық инфекцияларға жауап ретінде LRRK2 рөлін зерттеген болатынбыз; онда біз реовируспен [типі-3 Dearing изотипі (T3D)] мұрын арқылы инфицирленген жас тышқандарда аурудың нәтижелері жынысқа байланысты түрде LRRK2 аллельді варианттарына тәуелді екенін көрсеттік. Бұл жұмыста біз LRRK2 аллельді варианттары әлеуетті өлімге әкелетін өкпе инфекциясының ағымын ересек C57BL/6J тышқандарында өзгерте алатынын және пневмотропты РНК вирусының әсерінен кейін ми патологиясын анықтай алатынын тексердік. Біз LRRK2 киназа-гиперактивті варианты өкпедегі вирус репликациясын төмендетіп, ересек жануарлардың өмір сүру көрсеткіштерін өзгерте алады деп болжадық. Сонымен қатар, бұл инфекция тірі қалған жануарларда нейрохимиялық маркерлердің өзгеруіне әкелуі мүмкін деп есептедік. Мұны тексеру үшін біз жабайы типтегі және LRRK2 нок-ин мутантты тышқандарында пневмонитті туындату үшін тышқандарға бейімделген тұмау A вирусын, H1N1 серотипін (A/Fort Monmouth/1/1947) қолдандық. Біз LRRK2 p.G2019S де, p.D1994S де жіті аурудың нәтижелерін өзгертпегенін анықтадық. Дегенмен, H1N1 тұмау инфекциясын бастан кешіріп аман қалған гомозиготалы LRRK2 p.G2019S жануарлардың миында бір ұядағы бақылау тобындағы жануарлармен салыстырғанда тотығу стресс деңгейінің жоғарылауы және α-синуклеин мен тау метаболизмінде өзгерістер байқалды.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"lrrk2-pg2019s-tyshkhandary-h1n1-pnevmonity-kezinde-zhabajy-tiptegi-tyshkhandar-siyakhty-auru-aghymyn-koersetedi\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#lrrk2-pg2019s-tyshkhandary-h1n1-pnevmonity-kezinde-zhabajy-tiptegi-tyshkhandar-siyakhty-auru-aghymyn-koersetedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Lrrk2 p.G2019S тышқандары H1N1 пневмониты кезінде жабайы типтегі тышқандар сияқты ауру ағымын көрсетеді&lt;/span&gt;&lt;/a&gt;Lrrk2 p.G2019S тышқандары H1N1 пневмониты кезінде жабайы типтегі тышқандар сияқты ауру ағымын көрсетеді&lt;/h4&gt;\n&lt;p&gt;Біз алдымен Lrrk2G2019S және жабайы типтегі бір туыс тышқандарда нейротропты емес вирусты қолдана отырып, иесінің жауаптарындағы күшейтілген Lrrk2 киназа белсенділігінің рөлін зерттедік (1-сурет). Тұмау А вирусы, H1N1 серотипі (FM-MA штаммы) өкпе тропизміне ие және тышқандарда белгілі бір дозаларда өлімге әкелетін пневмонитті тудыруы мүмкін. Айта кету керек, Lrrk2 өкпеде жоғары деңгейде экспрессияланады. Жас шамасы 5–7 апталық ересек тышқандарға бұрын анықталған LD50 дозасы (2× 10³ ПФЕ) мұрын арқылы егілді; жануарлар өкпедегі вирус титрін талдау үшін 3dpi кезінде өлтірілді немесе аман қалуы бағаланды, содан кейін аман қалғандар қартайтылды (1a-сурет). Аман қалу деңгейі мен салмағы ұрғашы (1b, c-сурет) және еркек (1e, f-сурет) жануарларда 14dpi дейін өлшенді. Ұрғашы тышқандар жалпы алғанда еркектерге қарағанда жоғары өлім көрсеткіштерін көрсетті, бұл C57BL/6J тышқандарында H1N1 әртүрлі штамдарын қолданған бұрынғы есептерге сәйкес келеді. Алайда, біз жабайы типтегі бір туыстармен салыстырғанда Lrrk2 p.G2019S нок-ин тышқандарының аман қалуында ешқандай айырмашылықтарды анықтаған жоқпыз. Сол сияқты, ауру мен қалпына келтірудің суррогаттары болып қызмет еткен бастапқы салмақ жоғалтуда немесе кейінгі салмақ қосуда генотиптер (және мутантты аллель саны) арасында айтарлықтай айырмашылықтар болған жоқ. H1N1 инфекциясының үшінші нәтижесі ретінде біз жеке когортада инфекцияның шыңында, атап айтқанда 3dpi кезінде өкпедегі вирус титрін өлшедик. Біз гомозиготалы Lrrk2G2019S ұрғашы тышқандарында төменірек титрлерге қарай үрдісті байқағанымызбен (мұны жаңа туылған нәрестелердегі реовирус T3D нәтижелерінен күткен едік), сәйкес еркектерде титрлердің үлкен өзгергіштігі байқалды. Жалпы алғанда, 3dpi кезінде вирус титрлері үшін генотиптер арасында айтарлықтай айырмашылықтар есептелмеді (1d, g-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Lrrk2 p.G2019S мутациясы H1N1 инфекциясы кезінде аман қалуға, дене салмағының динамикасына және 3dpi кезіндегі өкпе вирус титрлеріне әсер етпейді.&lt;br /&gt;\n[!tip] ПФЕ (бляшка түзуші бірліктер) — бұл тірі вирустың концентрациясын өлшеу бірлігі, ал LD50 — жануарлардың 50%-ының өліміне әкелетін доза.&lt;br /&gt;\n[!warning] Эксперименттер C57BL/6J тышқандарында жүргізілді, және ұрғашылар жоғары өлім көрсеткішін көрсеткендіктен, нәтижелер жынысқа байланысты болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"h1n1-infekciyasyna-kharsy-zhedel-iesining-khorghanysy-ueshin-lrrk2-kinaza-belsendiligi-khazhet-emes\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#h1n1-infekciyasyna-kharsy-zhedel-iesining-khorghanysy-ueshin-lrrk2-kinaza-belsendiligi-khazhet-emes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;H1N1 инфекциясына қарсы жедел иесінің қорғанысы үшін Lrrk2 киназа белсенділігі қажет емес&lt;/span&gt;&lt;/a&gt;H1N1 инфекциясына қарсы жедел иесінің қорғанысы үшін Lrrk2 киназа белсенділігі қажет емес&lt;/h4&gt;\n&lt;p&gt;Біз гиперактивті киназа p.G2019S мутациясы берген аман қалудың ешқандай модуляциясын анықтамағандықтан, біз жаңа туылған нәрестелерде реовирус-T3D-ге жауап ретінде көргеніміздей, Lrrk2 белсенділігінің жоғалуы H1N1 инфекциясының ауру нәтижелеріне әсер ететінін зерттедик. Жоғарыдағыдай тәсілді қолдана отырып, біз Lrrk2 киназа белсенді емес p.D1994S нок-ин мутациясын тасымалдайтын тышқандарға инокуляция жасадық. Біз H1N1 инфекциясынан кейін еркек те, ұрғашы да гомозиготалы және гетерозиготалы Lrrk2D1994S тышқандары жабайы типтегі тышқандар сияқты аман қалу деңгейі мен салмақ өзгерістерін көрсеткенін анықтадық (S1a, b, d, e-суреттер). Әрі қарай зерттеу үшін біз осы тышқандардың өкпесінде 3dpi кезінде H1N1 вирус титрлерін өлшедик және жабайы типтегі, гетерозиготалы және гомозиготалы Lrrk2 p.D1994S жануарлары арасында топтык айырмашылықтарды тағы da анықтамадық (S1c, f-суреттер). Бұл жиынтық нәтижелер бізге Lrrk2 киназа белсенділігінің өзі H1N1 пневмонитінің жедел фазасы кезінде ересек тышқандардың жауабында байқалатын әсер көрсетпегенін болжады.&lt;/p&gt;\n&lt;h4 id=\"h1n1-den-aman-khalghandardyng-miynda-virus-akhuyzy-ekspressiyasynyng-belgileri-zhokh\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#h1n1-den-aman-khalghandardyng-miynda-virus-akhuyzy-ekspressiyasynyng-belgileri-zhokh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;H1N1-ден аман қалғандардың миында вирус ақуызы экспрессиясының белгілері жоқ&lt;/span&gt;&lt;/a&gt;H1N1-ден аман қалғандардың миында вирус ақуызы экспрессиясының белгілері жоқ&lt;/h4&gt;\n&lt;p&gt;Біз келесі кезекте аман қалған тышқандарда миға H1N1 вирусының әсерінен кейінгі әсерлерін және Lrrk2G2019S нок-ин мутациясына байланысты болуы мүмкін кез келген әсерді зерттедик. H1N1 инфекциясынан аман қалған гомозиготалы тышқандар алдымен қосымша төрт апта бойы жалпы 6wpi дейін ұсталды (1a-сурет). Содан кейін біз H1N1 және жасанды түрде инокуляцияланған (mock) жануарлардың гомогенаттарын қояндардың anti-H1N1 иммундық сарысуы арқылы Western blotting әдісімен зерттедик. 3dpi кезіндегі инфицирленген өкпені оң бақылау ретінде қолдана отырып, біз аман қалған тышқандар когортасының миында ешқандай вирустық H1N1 ақуыздарын, атап айтқанда нуклеопротеин NP және матрикс ақуызы M1 таба алмадық (деректер көрсетілмеген), бұл күтілгендей, осындай жағдайларда мида H1N1 анықталмағанын көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"h1n1-infekciyasynan-kejin-lrrk2-pg2019s-mutantty-miynda-fosforlanghan-tau-akhuyzy-artady\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#h1n1-infekciyasynan-kejin-lrrk2-pg2019s-mutantty-miynda-fosforlanghan-tau-akhuyzy-artady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;H1N1 инфекциясынан кейін Lrrk2 p.G2019S мутантты миында фосфорланған тау ақуызы артады&lt;/span&gt;&lt;/a&gt;H1N1 инфекциясынан кейін Lrrk2 p.G2019S мутантты миында фосфорланған тау ақуызы артады&lt;/h4&gt;\n&lt;p&gt;Тұмау А (H1N1) вирусы пандемиясының құрбандарындағы паркинсонизмнің постэнцефалиттік жағдайларында бұрын орындалған ми аутопсиялары тауопатияның белгілерін анықтады. Айта кету керек, LRRK2-мен байланысты PD жағдайларында байқалатын ми патологиясы өзгермелі болып табылады және альфа-синуклеиннің өрнекті агрегаттарын, фосфорланған тау-байланысты патологияны, қосындылардың түзілуінсіз нейрондық жоғалуды немесе аралас патологияларды қамтиды. Сондықтан біз алдымен жалпы тау мөлшерін, содан кейін 6wpi кезінде H1N1-инфекцияланған және mock-өңделген жануарлардың жалпы ми гомогенаттарының еритін фракциясында ELISA көмегімен фосфорланған тау (pSer199 tau) деңгейін өлшедик (2a-c-суреттер). Осы лизаттардағы жалпы тауды өлшеген кезде, біз инфекцияға немесе мутацияға (2a-сурет) немесе жынысқа байланысты (S2a, 3a-суреттер) ешқандай айырмашылықты байқамадық. PSer199 tau мөлшерін анықтаған кезде, екі факторлы дисперсиондық талдау (ANOVA) маңызды инфекция x генотип өзара әрекеттесуін анықтады (F(1, 23)=5.418, P=0.0291; 2b-сурет). Мұнда pSer199 tau mock-өңделген мутантты тышқандармен салыстырғанда инфицирленген Lrrk2 p.G2019S тышқандарында айтарлықтай өсті (P=0.0099), бұл әсер жабайы типтегі тышқандарда болған жоқ. Содан кейін біз осы үлгілердегі фосфорланған және жалпы тау ақуызының арақатынасын есептедик (2c-сурет), мұнда біз mock-өңделген мутантты тышқандармен салыстырғанда инфицирленген, Lrrk2 p.G2019S-мутантты жануарларда айтарлықтай өсуді анықтадық. H1N1-инфекцияланған мутантты тышқандар сонымен қатар инфицирленген жабайы типтегі тышқандарға қарағанда едәуір жоғары қатынасты көрсетті (P&amp;lt;0.05; 2c-сурет). Екі факторлы ANOVA соңғы қатынас үшін маңыздылыққа қарай үрдісті анықтады (P=0.0521). Бұл нәтижелер H1N1 инфекциясынан кейін мида еритін pSer199 tau концентрациясының жоғарылағанын көрсетті, бұл гомозиготалы Lrrk2G2019S нок-ин мутациясының экспрессиясымен байланысты болды. pSer199 tau үшін туыс киназа болып табылатын GSK3β үшін сол гомогенаттарды зерттеген кезде (активті және активті емес формалар Western blotting арқылы зерттелді), нәтижелер инфекцияға, жынысқа немесе мутацияға байланысты ешқандай әсерді көрсетпеді (деректер көрсетілмеген). Бүгінгі күнге дейін біз басқа тау киназаларын әлі зерттеген жоқпыз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;H1N1 инфекциясы Lrrk2 p.G2019S нок-ин тышқандарының миында 6wpi кезінде pSer199 tau деңгейінің айтарлықтай артуына әкеледі (P=0.0291).&lt;br /&gt;\n[!tip] ELISA — бұл антителалар көмегімен ақуыздарды сандық анықтау әдісі, ал екі факторлы ANOVA екі тәуелсіз айнымалының және олардың өзара әрекеттесуінің әсерін бағалайды.&lt;br /&gt;\n[!warning] PSer199 tau деңгейінің жоғарылауы тек тышқан моделінде байқалды және мида вирус ақуыздарының табылмауы бұл нәтижені адам патологиясына экстраполяциялау кезінде сақтықты талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"h1n1-zhukhtyrudan-kejin-lrrk2-pg2019s-mutantty-miynda-fosforlanghan-a-sinuklein-artady\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#h1n1-zhukhtyrudan-kejin-lrrk2-pg2019s-mutantty-miynda-fosforlanghan-a-sinuklein-artady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;H1N1 жұқтырудан кейін Lrrk2 p.G2019S мутантты миында фосфорланған α-синуклеин артады&lt;/span&gt;&lt;/a&gt;H1N1 жұқтырудан кейін Lrrk2 p.G2019S мутантты миында фосфорланған α-синуклеин артады&lt;/h4&gt;\n&lt;p&gt;Содан кейін біз сол жануарлардағы α-синуклеин метаболизмін зерттедік (Сурет 2d-f). Біз бұған дейін реовируспен (T3D) жұқтырылған жаңа туған тышқандардың миында Lrrk2G2019S тәуелді жалпы α-синуклеиннің өскенін байқаған едік. Сондықтан біз аман қалған ұрғашы және еркек дарақтардың тұтас ми гомогенаттарына вестерн-блоттинг және ИФА жасап, жалпы синуклеин мен pSer129 α-синуклеин деңгейлерін анықтадық. Екі факторлы дисперсиялық талдау мутантты ұрғашылардың миындағы жалпы α-синуклеинге алдыңғы H1N1 инфекциясының әсерін көрсетті (F(1, 8)=7.32, P=0.0268, Сурет SN 3d), ал еркектерде бұл байқалмады (Сурет SN 2d); соған қарамастан, жыныстар біріктірілген кезде инфекция әсері маңызды болып қала берді (P=0.0474) (Сурет 2d).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in-f2.jpg\" alt=\"2-сурет. Lrrk2 p.G2019S экспрессиясы H1N1 тұмау пневмониясынан кейін тышқандардың миындағы тау және альфа-синуклеин мета\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет. Lrrk2 p.G2019S экспрессиясы H1N1 тұмау пневмониясынан кейін тышқандардың миындағы тау және альфа-синуклеин метаболизмін, сондай-ақ тотығу стресс деңгейін өзгертеді. Инокуляциядан кейінгі 14 күннен кейін аман қалған ересек жалған инфицирленген (H1N1 -) және H1N1-мен инфицирленген (H1N1 +) тышқандар (еркектер мен ұрғашылары көрсетілген; жасы 5-7 апта) қосымша 4 апта бойы ұсталып, олардың миы жиналды. Бағанды диаграммалар жалпы тау ақуызының деңгейін (A), фосфорланған тауды (pSer199) (B), фосфорланған таудың жалпы тау деңгейіне қатынасын (C); жалпы альфа-синуклеинді (ИФА арқылы орындалған; D), фосфорланған альфа-синуклеинді (pSer129) (E) және фосфорланған альфа-синуклеиннің жалпы альфа-синуклеинге қатынасын (екеуі де Вестерн-блоттинг арқылы орындалған; F) көрсетеді. Тышқандардың екі бөлек тобындағы H2O2 деңгейлері (G, H). Мидың ақуыз нитротирозиндеу мөлшері (I) (H2O2 және нитротирозиндеу өлшемдері ми салмағына қатысты көрсетілген). Әрбір белгі бір жануарды білдіреді. Қате сызықтары орташа мәнді ± SEM көрсетеді. WT = жабайы тип; GS = Lrrk2 p.G2019S мутантты тышқандары; DS = Lrrk2 p.D1994S мутантты тышқандары. Статистикалық талдау: түзетілмеген Фишердің LSD пост-hoc тестімен екі факторлы ANOVA. P мәні &amp;lt;0,05 (&lt;/em&gt;), P мәні &amp;lt;0,01 (&lt;strong&gt;), P мәні &amp;lt;0,001 (&lt;/strong&gt;&lt;em&gt;), P мәні &amp;lt;0,0001 (&lt;/em&gt;**&lt;em&gt;).&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ауруды бастан өткерген мутантты тышқандарда pSer129 α-синуклеин деңгейінің жоғарылағаны байқалды (P=0.0037), бұл ретте ұрғашыларда жоғары көрсеткіштер тіпті бастапқы күйде де тіркелген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сонымен қатар, біз аман қалған жануарларда pSer129 α-синуклеин деңгейінің өскенін анықтадық (Сурет 2e). Екі факторлы дисперсиялық талдау генотиптің елеулі әсерін (F(1, 20)=54.73, P&amp;lt;0.0001), инфекцияның елеулі әсерін (F(1, 20)=10.76, P=0.0037) және генотип × инфекцияның елеулі өзара әрекеттесуін (F(1, 20)=6.186, P=0.0218) көрсетті, бұл негізінен ұрғашы жануарларға байланысты болды (Сурет SN 3e). Қызығы, Lrrk2 p.G2019S ұрғашы тышқандарының миында бастапқы деңгейде pSer129 α-синуклеиннің жоғарылағаны байқалды (Сурет SN 3e).&lt;/p&gt;\n&lt;p&gt;Фосфорланған және жалпы α-синуклеин деңгейлерінің арақатынасын есептеген кезде, жұптық салыстырулар бойынша жұқтырылған жабайы типтегі жануарлармен салыстырғанда жұқтырылған мутантты тышқандарда жоғары арақатынасты анықтадық (P&amp;lt;0.05) (Сурет 2f), бұл ең алдымен еркектерде байқалды (Сурет SN 2f); екі факторлы дисперсиялық талдау бұл өзара әрекеттесудің маңыздылығын көрсетті (P=0.0381). Бұл нәтижелер бізге H1N1 пневмониясы аман қалған гомозиготалы Lrrk2 p.G2019S жануарларының миында еритін, фосфорланған α-синуклеиннің дисрегуляциясына әкелуі мүмкін екенін ойлатты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Вестерн-блоттинг пен ИФА — бұл биологиялық үлгілердегі нақты ақуыздар мен олардың модификацияларын сандық түрде өлшеуге мүмкіндік беретін зертханалық әдістер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Polo тәрізді киназа-2 (Plk2) бірнеше топтар, соның ішінде біздің топ тарапынан Ser129 жерінде α-синуклеинді фосфорлауға арналған сәйкес фермент ретінде анықталғанын ескере отырып, біз оны вестерн-блоттинг көмегімен ми лизаттарында да тексердік. Біз бастапқы деңгейде мутантты ұрғашылардың миында Plk2 ақуызының айтарлықтай өскенін байқадық (P&amp;lt;0.05) (Сурет SN 3g), бұл жабайы типтегі жануарларда алдыңғы H1N1 инфекциясы кезінде нашарлады; бұл әсер жыныстар біріктірілген кезде байқалмады (деректер келтірілмеген). Болашақ жұмыстар H1N1 пневмониясынан аман қалған жануарлардың миында Plk2 ферменттік белсенділігінің өзі (немесе pSer129 α-синуклеиннің дефосфорлануы) өзгергенін анықтайды.&lt;/p&gt;\n&lt;h4 id=\"h1n1-pnevmoniti-lrrk2-pg2019s-tyshkhandarynyng-miynda-totyghu-stresining-artuyna-aekeledi\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#h1n1-pnevmoniti-lrrk2-pg2019s-tyshkhandarynyng-miynda-totyghu-stresining-artuyna-aekeledi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;H1N1 пневмониті Lrrk2 p.G2019S тышқандарының миында тотығу стресінің артуына әкеледі&lt;/span&gt;&lt;/a&gt;H1N1 пневмониті Lrrk2 p.G2019S тышқандарының миында тотығу стресінің артуына әкеледі&lt;/h4&gt;\n&lt;p&gt;Біз одан кейін екі когорталық салыстыруда үш әртүрлі гомозиготалы генотиптері бар тірі қалған жануарлардың миындағы тотығу стресінің деңгейлерін өлшедік (Сурет 2g, h). H1N1 жұқтырған тірі қалған тышқандардың гомогенаттарындағы H₂O₂ концентрациясы Amplex® Red талдауы көмегімен анықталды. Онда біз екі факторлы дисперсиялық талдауды (ANOVA) қолдану арқылы жабайы түрдегі және Lrrk2 p.G2019S жануарларының когортасында пневмониттің H₂O₂ деңгейлеріне әсерін анықтадық, атап айтқанда, инфекция жұқтырған жабайы түрдегі аталықтар мен жалған өңделген тышқандар арасында (F(1, 12)=10,20, P=0,0077) (Қосымша Сурет 2h); алайда бұл когортадағы басқа салыстырулар үшін айтарлықтай айырмашылық табылмады (Сурет 2g).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;H1N1 инфекциясы мидағы сутегі асқын тотығы мен ақуыз нитрозилирленуінің жоғарылауын тудырады, ал Lrrk2 p.G2019S мутациясы бар аталықтарда бұл өзгерістер вирустың тікелей нейротропизмі болмаса да айқын көрінеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;H₂O₂ концентрацияларын бөлек когортада өлшеген кезде, онда біз жабайы түрдегі тышқандарды Lrrk2 p.D1994S киназалық белсенді емес мутантты тышқандарымен салыстырдық, біз тағы да жабайы түрдегі аталық тышқандарда айтарлықтай айырмашылықты байқадық (F(1, 18)=7,869, P=0,0117) (Сурет 2h; Қосымша Сурет 1g, h). Post-hoc талдауында алдыңғы H1N1 инфекциясы жалған өңделген жануарлармен салыстырғанда жабайы түрдегі жануарларда H₂O₂ деңгейінің айтарлықтай жоғары болуына әкелді (P=0,0087); мидағы H₂O₂ деңгейінің өсу тенденциясы инфекцияға байланысты түрде аналық және аталық Lrrk2 p.G2019S-мутантты тышқандарында да байқалды (Сурет 2g; Қосымша Сурет 2h, 3h). Бір қызығы, H1N1 әсер еткен, киназалық белсенді емес Lrrk2 p.D1994S жануарларының миында H₂O₂ концентрациясының жоғарылауы анықталмады (Сурет 2h; Қосымша Сурет 1g, h).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in-f1.jpg\" alt=\"1-сурет. Lrrk2G2019S аллельдері тұмау вирусымен (А түрі, H1N1) мұрын арқылы инфицирленген тышқандардың өмір сүру қабілет\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Lrrk2G2019S аллельдері тұмау вирусымен (А түрі, H1N1) мұрын арқылы инфицирленген тышқандардың өмір сүру қабілетін, салмағының өзгеруін немесе өкпедегі вирустық титрлерін өзгертпейді. Осы зерттеуде қолданылған эксперименттік уақыт шкаласы (A). Ересек тышқандарға (еркек және ұрғашы; жасы 5-7 апта) А түріндегі тұмау вирусының (H1N1 серотипі) 2 x бляшка түзуші бірліктері (PFU) мұрын арқылы енгізілді. Өмір сүру қабілеті инокуляциядан кейінгі күндерге (p.i.) қатысты өмір сүру пайызы ретінде графикалық түрде көрсетілген (B, E), ал салмақтар p.i. күндеріне қатысты бастапқы дене салмағының пайызы ретінде көрсетілген (C, F). Деректер ұрғашы (B-D) және еркек (E-G) тышқандар үшін бөлек көрсетілген. Вирустық титрлер өкпеде p.i. 3-күні өлшенді (D, G). Әрбір белгі бір жануарды білдіреді. Қате сызықтары орташа мәнді ± орташа мәннің стандартты қателігін (SEM) көрсетеді. WT = жабайы тип; GS = Lrrk2G2019S мутантты аллелі. Қолданылған статистикалық тесттер: өмір сүру қисықтары үшін лог-ранк (Mantel-Cox) тесті; вирустық титрді талдау үшін бір факторлы дисперсиялық талдау (ANOVA).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Тотығу стресінің екінші реттік өлшемі ретінде біз H1N1 жұқтырған тышқандардың миынан алынған ақуыз сығындыларында 6wpi кезінде қайтымсыз ақуыз нитротирозинделуін зерттедік (Сурет 2i). Вестерн-блоттинг және денситометрия көмегімен біз барлық аналықтарда H1N1 әсерінің ақуыз нитротирозинделуіне айтарлықтай әсерін анықтадық (F(1, 8)=13,34, P=0,0065) (Қосымша Сурет 3i). Аталықтардағы тиісті деңгейлерді талдаған кезде, екі факторлы ANOVA инфекция (F(1, 8)=8,484, P=0,0195) және генотип (F(1, 8)=13,62, P=0,0061) үшін айтарлықтай әсерлерді көрсетті (Қосымша Сурет 2i).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Вестерн-блоттинг — ақуыздарды өлшемі бойынша бөліп, арнайы антиденелер арқылы анықтау әдісі, ал денситометрия гельдегі немесе пленкадағы жолақтардың қарқындылығын өлшейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Post-hoc талдаулары H1N1 әсер еткен аталық Lrrk2 p.G2019S тышқандарының құрамында жалған өңделген мутантты жануарларға және егілген жабайы түрдегі тышқандарға қарағанда жоғары нитротирозинделу деңгейлері бар екенін растады. Жуықта екі топ, соның ішінде біздің топ, NADPH оксидаза-2 (NOX2) белсенділігін жоғарылатуда Lrrk2 p.G2019S рөлін анықтады, бұл белгілі бір иммундық жасушалар арқылы ROS өндірісінің қарқынды шығуына әкеледі; сондықтан біз сонымен қатар оның белсенді кешені ішіндегі NOX2 p47phox суббірлігін зерттедік, оны біз бұрын нейтрофилдерде Lrrk2 p.G2019S арқылы гиперфосфорланғанын анықтаған едік.&lt;/p&gt;\n&lt;p&gt;Бүгінгі күнге дейін, жоғарыда зерттелгендей, H1N1 инфекциясынан аман қалғандар мен жалған егілген жануарлардың бірдей ми лизаттарын anti-p47phox көмегімен Вестерн-блоттинг арқылы талдау анық нәтиже бермеді (деректер көрсетілмеген). Қорытындылай келе, біз төменгі тыныс жолдарының вирустық инфекциясы салдарынан өміріне қауіп төндіретін пневмонитті бастан өткерген ересек C57BL/6J тышқандарының миында нейрохимиялық өзгерістер болғанын көрсеттік. Пневмотропты H1N1 инфекциясы инокуляциядан кейін 6 апта өткен соң, яғни аман қалғандар жедел аурудан айыққан кезде, ересек Lrrk2 p.G2019S-мутантты тышқандарында тотығу стресінің айтарлықтай артуына және фосфорланған α-синуклеин мен фосфорланған тау ақуызының көтерілуіне әкелді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер 5–7 апталық жастағы генетикалық модификацияланған тышқандарға негізделген, бұл адамдардағы қартаю және созылмалы патогенез процестерін толық көрсетпеуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біздің нәтижелеріміз Ne Lrrk2 p.G2019S, не Lrrk2 p.D1994S мутанты жедел вирустық H1N1 өкпе инфекциясы кезінде ұқсас өмір сүру деңгейлері, вирус титрлері және салмақ өзгерістері арқылы айқын көрініп тұрғандай, ешқандай артықшылық бермегенін немесе қауіпті арттырмағанын көрсетеді (Сурет 1). Біздің бұрынғы зерттеулерімізде Lrrk2 p.G2019S Salmonella typhimurium бактериялық сепсис моделінде және Listeria monocytogenes инфекция моделінде қорғанысты қамтамасыз еткен еді, бірақ реовирус (T3D) тудырған энцефалит кезінде аналық жыныс әсерімен өмір сүруді нашарлатқан болатын.&lt;/p&gt;\n&lt;p&gt;Бұл нәтижелер Lrrk2 p.G2019S мутанты мидан тыс кейбір микробтық инфекцияларға қарсы иесінің қорғанысын күшейте алады, бірақ инфекция жүйке жүйесіне жеткен кезде (жабайы түрдегі жануарлармен және Lrrk2 p.D1994S тышқандарымен салыстырғанда) нейрондардың жоғалу қаупін арттырады деген гипотезаны тудырған еді. Біздің бұрынғы зерттеулерімізге сүйене отырып, ми саулығының нашарлауына ықпал ететін факторларға ROS өндірісінің артықтығы (мысалы, жоғарылаған NOX2 белсенділігі арқылы), микроглия реактивтілігінің күшеюі және миға миелоидты жасушалардың күшейтілген хемотаксисі кірді.&lt;/p&gt;\n&lt;p&gt;Өйткені H1N1 миға тікелей тропизмге ие емес, біз шеткері жерлерде басталған қабынуға қарсы жауаптар миға жетіп, мұнда сипатталған пневмонит моделімізде оның нейрондық және/немесе глиальды метаболизміне әсер етті деп болжаймыз, бұл тұжырым ғасыр бұрынғы H1N1 пандемиясынан кейінгі постенцефалиттік паркинсонизм үшін Кадар және әріптестері жасаған қорытындыға сәйкес келеді. α-синуклеиннің жоғарылауы әртүрлі қабыну триггерлеріне жауап ретінде in vivo хабарланған.&lt;/p&gt;\n&lt;p&gt;Мұнда біз H1N1 инфекциясынан кейін аналық және аталық тышқандардағы pSer129 α-синуклеиннің стационарлық күйіне Lrrk2 p.G2019S негізделген әсерін анықтадық. Демек, біздің жаңалықтарымыз тұмау А вирусы инфекциясының кейінгі кеш басталған ПК (Паркинсон ауруы) жиілігімен қауіп қауымдастығы үшін, әсіресе синуклеопатия дамитын мутантты LRRK2 генотипінің тасымалдаушыларында маңызды болуы мүмкін. LRRK2-мен байланысты ПК плейотропты ми патологиясын көрсетеді, ал ондағы мутациялар сонымен қатар үдемелі супрануклеарлық салдың (PSP) тауопатиясымен байланыстырылған.&lt;/p&gt;\n&lt;p&gt;Осы контекстте біз бұрынғы H1N1 инфекциясының тау метаболизміне әсерін бағаладық. Біз pSer199 тау тұрақты күйіне қатысты маңызды инфекция және генотип өзара әрекеттесуін анықтадық; мұнда деңгейлер H1N1 инфекциясынан кейін Lrrk2 p.G2019S-мутантты (бірақ жабайы түрдегі емес) аналық тышқандарда айтарлықтай жоғарылады. Адамдарда еримейтін нейрофибриллярлық түйіндерді қамтитын тауопатия постинфекциялық паркинсонизм жағдайларында ғана емес, сонымен қатар қызылша вирусы тудырған жедел склероздаушы панэнцефалитте де сипатталған.&lt;/p&gt;\n&lt;p&gt;Болашақ жұмыстарда шеткері иммундық медиаторлар, мысалы, айналымдағы цитокиндер, хемокиндер және инфильтрациялайтын иммундық жасушалар біздің пневмонит моделімізде байқалған нейрохимиялық өзгерістерге механикалық үлесі үшін бағалануы қажет. Біздің зерттеуімізде шектеулер бар. Біріншіден, талдаулар инокуляциядан кейін 6 аптамен шектелді, бұл аурудың жойылуының толық траекториясын қамтымауы мүмкін. Екіншіден, біз жас ерекшелігіне байланысты сезімталдықты бағаламадық, өйткені барлық тышқандар салыстырмалы түрде жас (5-7 апталық) болды және иммундық жауаптар, сондай-ақ қан-ми тосқауылының тұтастығы өмір бойы өзгеретіні белгілі.&lt;/p&gt;\n&lt;p&gt;Үшіншіден, бірнеше зерттеулер тау фосфорлануы гипотермия, қызба, анестезия және ұйқы-ояу циклі сияқты орта факторлары мен стресс жағдайларына өте сезімтал екенін көрсетті. Біздің зерттеулерімізде біз бұл ықтимал модификаторларға назар аудардық, бірақ басқалары (әлі анықталмаған) модуляциялаушы рөл атқарған болуы мүмкін. Төртіншіден, біз H1N1 пневмонитінен аман қалған Lrrk2 p.G2019S тышқандарындағы α-синуклеин мен тау ақуызының гиперфосфорлануының артындағы механизмдерді әлі ашқан жоқпыз (атап өткен жөн, Lrrk2 өзі тау немесе α-синуклеин үшін нейрондық киназа болып саналмайды).&lt;/p&gt;\n&lt;p&gt;Бесіншіден, еритін ми лизаттарындағы екі ақуыздың гиперфосфорлануы өмірдің кейінгі кезеңінде нейрондар ішінде түйін түзілуімен және Леви типті қосындылармен байланысты еримейтін, амилоидогенді агрегаттардың пайда болуына тең емес; алайда ол алғашқы оқиға ретінде қызмет етуі мүмкін. Соңында, әрбір эксперименталды тармаққа көбірек жануарлардың қосылуы біздің нейрохимиялық көрсеткіштеріміздегі жыныстық әсерлерге бұдан да көп жарық түсіруі мүмкін еді. Дегенмен, біздің нәтижелеріміз пневмотропты РНК вирусымен инфекция H1N1-тің тікелей нейротропизмі болмасына қарамастан (және сол кезде мида анықталатын вирус ақуыздары болмаса да) мұрын арқылы инокуляциядан кейін алты апта өткен соң C57BL/6J жабайы түрдегі тышқандарының миында тотығу стресін күшейте алатынын және Lrrk2 p.G2019S нок-ин жануарларында фосфорланған α-синуклеин мен фосфорланған тау ақуызын көтере алатынын көрсетеді. Бақыланатын жағдайларда ұсталатын ересек тышқандардағы біздің жаңалықтарымыз таңдалған вирулентті микробтар, соның ішінде шеткері органдарды нысанаға алатындар мен иесінің геномы арасындағы өзара әрекеттесулер ересек адамның миында нейродегенерациямен байланысты өзгерістердің бастамашылары бола алады деген тұжырымды толықтырады.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"tyshkhan-koloniyalary\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#tyshkhan-koloniyalary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тышқан колониялары&lt;/span&gt;&lt;/a&gt;Тышқан колониялары&lt;/h4&gt;\n&lt;p&gt;Барлық тышқан колониялары гетерозиготалы будандастыру жұптарын қолдана отырып, C57BL/6J генетикалық фонында ұсталды. Жануарларға қатысты эксперименттер Канаданың Жануарларды күту жөніндегі кеңесінің нұсқауларына сәйкес орындалды және Оттава университетінің Жануарларды күту комитетінің этикалық комиссиясымен мақұлданды. Вирустық инфекцияларды қамтитын эксперименттер биологиялық қауіпсіздіктің 2-деңгейіндегі жануарларға арналған виварий мекемесінде жүргізілді. Lrrk2 p.G2019S (MGI:5295368) және Lrrk2 p.D1994S (MGI:5295371) нок-ин тышқандарын сипатталғандай (32) д-р Дерья Шимшек (Dr. Derya Shimshek) мейірімділікпен ұсынды. Бұл зерттеуде көрсетілгендей, ұрғашы да, еркек тышқандар да пайдаланылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Нок-ин (knock-in) — бұл жануардың геномына белгілі бір мутацияны (бұл жағдайда Lrrk2 геніне) енгізу арқылы оның патологиялардың дамуына әсерін зерттеуге мүмкіндік беретін генетикалық модификация.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tyshkhandargha-bejimdelgen-tumau-a-h1n1-virusymen-muryn-arkhyly-inficirleu\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#tyshkhandargha-bejimdelgen-tumau-a-h1n1-virusymen-muryn-arkhyly-inficirleu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тышқандарға бейімделген тұмау A H1N1 вирусымен мұрын арқылы инфицирлеу&lt;/span&gt;&lt;/a&gt;Тышқандарға бейімделген тұмау A H1N1 вирусымен мұрын арқылы инфицирлеу&lt;/h4&gt;\n&lt;p&gt;Тұмау A H1N1 вирусының тышқандарға бейімделген вариантының [A/Fort Monmouth/1/1947 (‘FM-MA’)] жасалуы бұрын сипатталған (33). Жасы 5–7 апталық ересек тышқандар 1 минут бойы 1 л/мин жылдамдықтағы O₂ ішіндегі 3% изофлуранмен анестезияланды. 50 мкл PBS-те дайындалған FM-MA H1N1-дің 2× 10³ бляшка түзуші бірлік (PFU) мөлшері мұрын жолдарына енгізіліп, шамамен 50% өліммен аяқталатын ауыр пневмонитті тудырды (1  LD₅₀). Тышқандар инокуляциядан кейін 14 күн бойы (dpi) бақыланды және 4–14 dpi аралығында күн сайын екі рет өлшенді. Эвтаназия жасауға көрсеткіш болатын соңғы критерийлерге өлімі жақын күй, тыныс алудың қиындауы немесе дене салмағының ≥ 30% жоғалуы кірді. Жедел вирустық инфекциядан аман қалған (14 dpi кезінде тірі қалуымен расталған) тышқандар инокуляциядан кейінгі жалпы 6 аптаға дейін (wpi) қосымша 4 апта бойы ұсталды (1a-сур.). H1N1 әсер еткен тышқандармен қатар, бақылаудағы (mock-inoculated) жануарларға вируссыз 50 мкл PBS берілді.&lt;/p&gt;\n&lt;h4 id=\"tumau-a-virusy-h1n1-serotipine-arnalghan-blyashka-testi\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#tumau-a-virusy-h1n1-serotipine-arnalghan-blyashka-testi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тұмау A вирусы H1N1 серотипіне арналған бляшка тесті&lt;/span&gt;&lt;/a&gt;Тұмау A вирусы H1N1 серотипіне арналған бляшка тесті&lt;/h4&gt;\n&lt;p&gt;2× 10³ PFU H1N1 мұрын арқылы жұқтырылған тышқандар 3 dpi кезінде өлтірілді. Өкпелер лезде мұздатылды, содан кейін Magna Lyser (Roche) құрылғысында металл моншақтарды қолдана отырып максималды жылдамдықта 10 секунд ішінде PBS-те (3:1, v:w) гомогенизацияланды, содан кейін бір рет мұздатылып ерітілді. MDCK жасушалары 6 ұяшықты планшеттерде 90% конфлюенттікке дейін өсірілды. Өкпе гомогенаттары центрифугаланды (5000 айн/мин) және супернатанттар сарысусыз DMEM-де қатарлап сұйылтылды (10 есе). MDCK моноқабаттары PBS-пен екі рет жуылды, әрбір сұйылтудан 100 мкл құйылды және 15 минут сайын шайқала отырып, 37 °C, 5% CO₂ жағдайында 30 минут бойы инкубацияланды. Бір сағаттан кейін жасушалардың бетіне 0,1 мкг/мл TPCK-трипсині бар 1:1 1,2% агароза мен 2xDMEM қоспасынан 3 мл құйылып, 3 күн бойы инкубацияланды. Жасушалар метанол мен сірке қышқылының қоспасында (3:1) бір сағат бойы фиксирленді. Қабаттар ағын су астында алынып тасталды және Кумасси көк бояуымен 30 минут бойы боялды. Бляшкалар визуалды түрде есептелді. Вирус титрлері тіннің грамына шаққандағы PFU түрінде көрсетілді.&lt;/p&gt;\n&lt;h4 id=\"akhuyzdy-ekstrakciyalau\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#akhuyzdy-ekstrakciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ақуызды экстракциялау&lt;/span&gt;&lt;/a&gt;Ақуызды экстракциялау&lt;/h4&gt;\n&lt;p&gt;Ақуыз жоғарыда вирустық титрді талдау үшін сипатталғандай тіндерді гомогенизациялау арқылы экстракцияланды. Аликвоталар 1% Triton-X 100 және 2x фосфатаза тежегіштері бар протеаз тежегіштерінде (Thermo Scientific) дайындалды және 4 °C температурада 30 минут бойы 14 800 айн/мин жылдамдықта центрифугаланды. Ақуыз концентрациялары микропланшеттік процедураға сәйкес бицинхонин қышқылын (BCA) анықтауға арналған жиынтық (Thermo Fisher Scientific, 23227) көмегімен анықталды.&lt;/p&gt;\n&lt;p&gt;α-синуклеин мен тау ақуызын ИФА арқылы мөлшерлік анықтау&lt;/p&gt;\n&lt;p&gt;Лизаттардағы жалпы α-синуклеин мөлшері бұрын сипатталғандай (34, 35) сэндвич-ИФА көмегімен өлшенді. α-синуклеин ақуызының концентрациялары әр үлгідегі жалпы ақуыз концентрациясына норматирленді. Тышқанның жалпы тау ақуызы Tau (Total) Mouse ELISA Kit (KMB7011, Invitrogen) көмегімен өлшенді. Тышқанның фосфо-тау (фосфо-серин 199) мөлшері Mouse Tau (Phospho) [Ser199] ELISA Kit (KMB7041, Invitrogen) көмегімен өлшенді.&lt;/p&gt;\n&lt;h4 id=\"vestern-blotting\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#vestern-blotting\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вестерн-блоттинг&lt;/span&gt;&lt;/a&gt;Вестерн-блоттинг&lt;/h4&gt;\n&lt;p&gt;Ақуыз үлгілері (әр лункаға 40 мкг; анти-нитротирозин үшін 75 мкг) 1xNuPAGE™ LDS буфером араластырылды, 95 °C температурада 5 минут бойы қайнатылды және 4–12% градиентті SDS-MES гельдерінде қалпына келтіретін жағдайларда (анти-нитротирозин үшін қалпына келтірмейтін жағдайларда) жүгіртілді. Ақуыздар трис-глицин-метанол буферінде жартылай құрғақ тасымалдау әдісі арқылы PVDF мембраналарына көшірілді. Анти-нитротирозин антиденесімен (Cell Signalling, 9691S) блоттар пленкаға түсіріліп, ImageJ көмегімен мөлшерленді және Ponceau S бояуына норматирленді. Фосфо-α-синуклеин (Ser129) (Abcam, ab51253), hSA4 (рекомбинантты, толық ұзындықтағы, адам α-синуклеиніне қарсы сипатталғандай (Mollenhauer et al. 2008) алынған және аффинді түрде тазартылған коммерциялық емес поликлоналды антидене) және Plk2 (Novus Biologicals, NBP3-04961) антидене блоттары BioRad ChemiDoc көмегімен суретке түсіріліп, ImageLab көмегімен мөлшерленді. Фосфорланған α-синуклеин мен жалпы α-синуклеин сигналдары жүктеме бақылауы ретінде актинге (Santa Cruz, sc-47778) норматирленді (Plk2 Ponceau S бояуына норматирленді) және блотаралық мөлшерлеу үшін ішкі блот бақылауларына қосымша норматирленді.&lt;/p&gt;\n&lt;h4 id=\"reaktivti-ottegi-tuerlerin-moelsherlik-anykhtau\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#reaktivti-ottegi-tuerlerin-moelsherlik-anykhtau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Реактивті оттегі түрлерін мөлшерлік анықтау&lt;/span&gt;&lt;/a&gt;Реактивті оттегі түрлерін мөлшерлік анықтау&lt;/h4&gt;\n&lt;p&gt;Тіндердегі H₂O₂ мөлшерін анықтау үшін H₂O₂ эндогендік деңгейлерін бақылау мақсатында Amplex® Red сутегі асқын тотығы/пероксидаза талдау жиынтығы (Invitrogen, A22188) пайдаланылды. Сагитальды түрде кесілген жартылай ми бөліктері жоғарыда сипатталғандай PBS-те лизизделді. Гомогенаттардағы H₂O₂ деңгейлері өндірушінің нұсқауларына сәйкес өлшенді. Алынған H₂O₂ мәндері (µ M) тін салмағына (г) норматирленді.&lt;/p&gt;\n&lt;h4 id=\"statistikalykh-taldaular\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#statistikalykh-taldaular\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистикалық талдаулар&lt;/span&gt;&lt;/a&gt;Статистикалық талдаулар&lt;/h4&gt;\n&lt;p&gt;Барлық статистикалық талдаулар GraphPad Prism 11 нұсқасы (GraphPad Software, Сан-Диего, Калифорния, АҚШ) арқылы орындалды. Тірі қалу тесттеріндегі топтар арасындағы айырмашылықтар лог-рангтық (Мантел-Кокс) тест көмегімен бағаланды. Топтар арасындағы айырмашылықтар Түзетілмеген Фишердің LSD пост-хок тестімен екі факторлы дисперсиялық талдау (ANOVA) арқылы бағаланды. Деректер орынды жерде және сурет сипаттамаларында сипатталғандай орташа мән ± стандартты қате (SEM) түрінде көрсетілген. Деректер *P&amp;lt;0.05, **P&amp;lt;0.01, ***P&amp;lt;0.001, ****P&amp;lt;0.0001 ретінде көрсетілген P мәндерімен көрсетілген.&lt;/p&gt;\n&lt;h4 id=\"derekterding,-hattamalardyng-zhaene-materialdardyng-kholzhetimdiligi\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#derekterding,-hattamalardyng-zhaene-materialdardyng-kholzhetimdiligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деректердің, хаттамалардың және материалдардың қолжетімділігі&lt;/span&gt;&lt;/a&gt;Деректердің, хаттамалардың және материалдардың қолжетімділігі&lt;/h4&gt;\n&lt;p&gt;Бұл зерттеуде пайдаланылған және/немесе талданған деректер жиынтықтары мен суреттер, сонымен қатар егжей-тегжейлі хаттамалар мен негізгі зертханалық материалдарды олардың тұрақты идентификаторларымен бірге қамтитын Негізгі ресурстар кестесі (KRT) Zenodo платформасында қолжетімді: https://doi.org/10.5281/zenodo.16576378.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;LRRK2 пенентра&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нттылық&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;себептері&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;белгісіз&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;LRRK2&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мутациялы&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тышқандарды&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;H1N1-мен&lt;/text&gt;&lt;text x=\"226\" y=\"162\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;зақымдау&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;6 аптадан&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;кейін мида&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;фосфорланған&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ақуыздар өсті&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Инфекция нейро&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;дегенерация&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;триггері болуы&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мүмкін&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Препринт лицензиясы&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;neuroscience&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Lunn, M. O.; Thakur, K.; Lengacher, N. A.; Hake-Volling, Q.; aSCENT-PD Investigators,  ; Tomlinson, J. J.; Sad, S.; Brown, E. G.; Schlossmacher, M. G.&lt;/p&gt;\n&lt;h3 id=\"derekkoezder\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;st
