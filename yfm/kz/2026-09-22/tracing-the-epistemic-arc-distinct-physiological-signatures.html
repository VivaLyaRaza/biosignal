әне түсіну сезімі жүрек соғу жиілігіне әсер етуі мүмкін сияқты; бұл түсіндіруде декодталудың бірінші маңызды шыңы (стимулдың пайда болуы шамасында) тек атау алдындағы бейнеден алынған түсінуді (плюс ұзақ уақыт кідірісін) көрсетуі мүмкін, ал екінші шың атаулардан алынған қосымша түсінуді көрсетуі мүмкін.&lt;/p&gt;\n&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;p&gt;Визуалды өнермен және атаулар немесе кураторлық ескертпелер сияқты қосымша мәтіндік ақпаратпен жұмыс істеу «түсінуден ләззат алудың» парадигматикалық жағдайы болып табылады, мұнда ақпараттық олқылық қызығушылықты, мағынаны түсіну әрекеттерін және сайып келгенде, алынған түсініктен туындайтын ләззатты тудырады. Біз қызығушылық, түсінік, сезілетін түсінік және эстетикалық тартымдылық құбылыстарын бірыңғай парадигмада зерттей отырып, осы эпистемиялық доғаны құрайтын табиғат пен ішкі процестерге жаңа көзқарас ұсынамыз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Өнер мен мәтіннің өзара әрекеттесуін бірыңғай парадигма арқылы зерттеу ақпарат көлеміне байланысты қызығушылық, түсінік және эстетикалық ләззат арасындағы сызықтық емес байланыстарды ашады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;1-эксп. біз визуалды өнердің көмегімен түсінікті сенімді түрде ояту үшін парадигманы орнаттық және қызығушылық, түсінік, сезілетін түсінік және эстетикалық ұнайту сезімдері арасындағы күрделі өзара әрекеттесу туралы жаңа түсінік алдық, бұл белгілі бір стимул ұсынатын ақпараттың түрі мен мөлшерімен қалыптасатын ішінара сызықтық емес қатынастарды көрсетті. 2-эксп. біздің көп модалы физиологиялық корреляттарды талдауымыз барлық априори гипотезаларымызды растамағанына қарамастан, болашақта бұл тақырыпты әрі қарай зерттеу үшін жаңа қырларды ашты, бұл мағына құруды және оның эстетикалық бағалау процесіндегі рөлін механикалық түсінуге әкеледі. Зерттеуді қажет ететін дүниелер әлі де көп болғанымен, біздің зерттеуіміз ынталандырылған ақпаратты іздеудің негізгі мінез-құлық және физиологиялық қасиеттеріне жаңа терезе ашады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Парадигма — нақты ғылыми гипотезаны тексеру шарттарын белгілейтін стандартталған эксперимент схемасы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;p&gt;Екі экспериментте біз қатысушыларға визуалды өнер туындыларын (картиналарды), олардан кейін не олардың бастапқы атауын (семантикалық ақпарат қосатын), не бейнелерді түсіндіруге көмектесетін жалған атауды («атаусыз»; жаңа ақпаратсыз) көрсеттік. Парадигма Ван де Крюйс пен әріптестерінің (Van de Cruys et al., 2021) Муни бейнелерімен жүргізген зерттеуіне мұқият еліктеді. Қолданылған эксперименталды парадигма негізінен бірдей болғанымен, екі эксперимент маңызды аспектілері бойынша ерекшеленді (1-эксперимент: тек мінез-құлық деректері, онлайн зерттеу, үлкенірек стимулдар жиынтығы; 2-эксперимент: мінез-құлық және физиологиялық деректер, зертханаға негізделген зерттеу, 1-эксперименттің бағалауларына негізделген шектеулі стимулдардың ішкі жиынтығы). Эксперименталды дизайн және біздің гипотезаларымыз алдын ала тіркелді (1-эксперимент үшін https://doi.org/10.17605/OSF.IO/PAGVH және 2-эксперимент үшін https://doi.org/10.17605/OSF.IO/6KW9N қараңыз). Алдын ала тіркелген жоспардан ерекшеленетін соңғы әдістердің кез келген бөлшегі анық сипатталған және солай талқыланған. Қатысушылар мен жазу құрылғылары туралы мәліметтер Адам миын картаға түсіру ұйымы ұсынған M/EEG зерттеулеріне арналған стандарттарға сәйкес хабарланады (COBIDAS Pernet et al., 2018, 2020).&lt;/p&gt;\n&lt;h4 id=\"irikteme-koelemin-baghalau\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#irikteme-koelemin-baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Іріктеме көлемін бағалау&lt;/span&gt;&lt;/a&gt;Іріктеме көлемін бағалау&lt;/h4&gt;\n&lt;p&gt;Мақсатты іріктеме көлемі G*Power бағдарламалық құралын (Faul et al., 2007, 3.1 нұсқасы) пайдалана отырып, априори қуат талдауы арқылы бағаланды. Көп деңгейлі сызықтық модельдер үшін қуат талдауы (Статистикалық талдауды қараңыз) оңай болмағандықтан, біз зерттеуіміздің қуатын «ANOVA: Repeated measures within factors» параметрлерімен, альфа = 0,05, қуат = 0,8, әсер өлшемі f = 0,1758631 (&lt;span class=\"yfm-latex\" data-content=\"%5Ceta%5E2_p%20%3D%200%2C03\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; баламалы, шағын әсер өлшемі), 1 топ, 26 өлшем (3x4x2 + 2 дизайны, төменде қараңыз) және қайталанатын өлшемдер арасындағы 0 корреляцияның консервативті күтуімен ұқсас қайталанатын өлшемдер дисперсиялық талдауы (ANOVA) үшін есептедік. Бұл 30 адамнан тұратын мақсатты іріктеме көлеміне әкелді. Зерттеу онлайн режимінде өткізілгендіктен және біз деректерді жинау ортасын басқара алмағандықтан, біз N = 50 қатысушыдан тұратын айтарлықтай үлкен іріктемені мақсат еттік. Дегенмен, қатысушылар қоры біздің институтымыздағы зерттеулердің ынталы, көбінесе тұрақты қатысушыларынан тұрғандықтан, басқа онлайн зерттеулермен салыстырғанда жоғары сапалы деректерді күттік. Іріктеу — Қатысушылар Германиядағы Рейн-Майн метрополитент аймағындағы жалпы жұртшылықтан ыңғайлы іріктеу (convenience-sampled) әдісімен, институттың қатысушылар деректер базасының мүшелеріне тікелей хат жіберу арқылы таңдалды (жинау кезінде &amp;gt; 2000 мүше, кез келген адам жазыла алады). Слоттар бірінші келген, бірінші қызмет көрсетілген қағидат бойынша тағайындалды. Бұл зерттеуге қатысу үшін арнайы қосу критерийлері болған жоқ.&lt;/p&gt;\n&lt;h4 id=\"khorytyndy-irikteme\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#khorytyndy-irikteme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды іріктеме&lt;/span&gt;&lt;/a&gt;Қорытынды іріктеме&lt;/h4&gt;\n&lt;p&gt;N = 56 қатысушы зерттеуге қатысты және N = 54 деректерді жинауды аяқтады. 2 толық емес деректер жиынтығы (13/56 сынақ және 53/56 сынақ) бәрібір талдауға енгізілді. Осы 56 қатысушының ішінен 2 қатысушы белсенді медициналық ем қабылдау кезінде өткен немесе қазіргі неврологиялық мәселелері (инсульт, БС) бар екенін хабарлады. Тағы 5 қатысушы психикалық немесе психологиялық бұзылулардың ағымдағы немесе өткен эпизодтары туралы хабарлады. Осы 5 қатысушының 2-і қазіргі уақытта медициналық ем қабылдап жатқанын көрсетті. Қатысушылардың жасы 20–82 жас аралығында болды (орташа мәні = 40,0 жас, стандартты ауытқу = 17,0 жас; 1 қатысушы өз жасын көрсетпеген). 37-сі әйел, 19-ы ер және 0-і «басқа» деп көрсетті. 3-і солақай, 49-ы оңқай және 3-і екі қолын да бірдей қолданатын (өзін-өзі есеп беру негізінде, 1 жауап жоқ). Қатысушылар 7–26 жыл білім алған (орташа мәні = 17.4 жыл, стандартты ауытқу = 3.9 жыл; 3 қатысушы бұл деректерді ұсынбаған). Іріктеме жоғары білімді адамдарға қатысты күшті ауытқуды көрсетті: 56 адамның ішінде ең жоғары біліктілік ретінде неміс Абитуры (Abitur) немесе университет дәрежесі барлығында болды, тек 1 қатысушы бұл деректерді ұсынбаған. Қатысушылардың демографиялық көрсеткіштері туралы толық мәліметтерді А.1 және А.2 қосымша кестелерінен қараңыз. Қатысушылар онлайн деректер жинауды аяқтау үшін орташа есеппен 50:12 минут жұмсады (стандартты ауытқу = 23:35, мин: 31:23, 25%: 36:56, 50%: 42:24, 75%: 50:27, макс: 2:22:35). 5 қатысушы үшін уақыт белгілерінің жоқтығына байланысты бұл есептеу мүмкін болмады. Барлық қатысушылар экспериментті аяқтағаны үшін 10С ақшалай өтемақы алды және қатыспас бұрын хабардар етілген келісімін берді. Зерттеу Хельсинки декларациясының этикалық стандарттарына сәйкес келді және жергілікті этика комитетімен (Макс Планк қоғамының Этикалық кеңесі) стандартты зертханалық зерттеулерге арналған зерттеу этикасы шеңберіндегі өтінім негізінде мақұлданды. Деректер 2021 жылдың желтоқсанынан 2022 жылдың қаңтарына дейін жиналды.&lt;/p&gt;\n&lt;h4 id=\"stimuldar\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#stimuldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Стимулдар&lt;/span&gt;&lt;/a&gt;Стимулдар&lt;/h4&gt;\n&lt;p&gt;Әрбір қатысушы 120 өнер стимулы мен 20 Муни бейнесінен тұратын стимулдар жиынтығынан 56 өнер стимулы мен 8 Муни бейнесінің ішкі жиынтығын көрді. Өнер стимулдары — Барлық өнер стимулдары қоғамдық игіліктегі мыңдаған бейнелерді қамтитын WikiArt.org деректер базасынан алынды. Бұл зерттеуде қолданылған 120 бейне жиынтығы WikiArt метадеректері мен WikiArt Emotions деректер базасына (Mohammad &amp;amp; Kiritchenko, 2018) негізделе отырып, келесі процедура бойынша жасалды: 1) біз алдымен соңғы 2 ғасырдың 8 батыстық өнер стиліндегі барлық картиналарды таңдадық (яғни романтизм, реализм, импрессионизм, экспрессионизм, кубизм, сюрреализм, дерексіз экспрессионизм, лирикалық абстракция — WikiArt метадеректеріне сәйкес), 2) содан кейін беттерді қамтитын барлық картиналарды алып тастадық (WikiArt Emotions бағалауларына сәйкес), 3) қалған өнер туындылары «дерексіз» («abstract»), «жартылай дерексіз» («semi-abstract») немесе «фигуративті» («figurative») болып санатталды, 4) олардың атаулары бойынша «тек сипаттамалық» атау, «түсіндірмелі» атау және «әсерлі» («evocative») атауларға бөлінді (екеуі де зерттеуші тарапынан), 5) соңында біз а) көптеген ықтимал өнер стильдеріндегі стимулдарды қосуды және б) WikiArt emotions деректер базасынан жоғары «өнер:тосынсый» («art:surprise») бағасын алуды мақсат етіп, 9 факторлық комбинацияның әрқайсысы үшін 10 стимулдан таңдадық. «Түсіндірмелі атау» бар 3 ішкі топта біз әр контейнер үшін 10-ның орнына 20 стимул алдық, бұл техникалық тұрғыдан түсіндірмелі атаулары бар 3 қосымша топқа әкелді (алдын ала бағаланған «art:surprise» сәл төменірек). Бұл процедура барлығы 120 өнер стимулын берді, олардың әрқайсысы өздерінің бастапқы атауымен (WikiArt деректер базасында сақталғандай, неміс тіліне аударылған) бірге келді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ыңғайлы іріктеу (convenience sampling) — зерттеушіге оңай қолжетімді және қатысуға дайын адамдарды таңдауға негізделген тәсіл.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"muni-keskinderi\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#muni-keskinderi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Муни кескіндері&lt;/span&gt;&lt;/a&gt;Муни кескіндері&lt;/h4&gt;\n&lt;p&gt;Муни кескіндері Van de Cruys et al. 2021 жұмысынан алынып, желіде ақпарат көзі ретінде қолжетімді болды. Біздің зерттеуімізде қолданылған стимулдар екі критерий бойынша таңдалды: 1) адамдар бейнеленбеген және 2) Van de Cruys et al. 2021 жұмысындағы орташа «аха» рейтингі. Біз осы зерттеуден ең жоғары «аха» рейтингі бар 10 стимулды және ең төменгі «аха» рейтингі бар 10 стимулды алдық. Әрбір Муни кескіні оның шығу тегі болып табылатын сәйкес ақ-қара суретпен бірге жүрді (көркемөнер стимулдарының нақты атауларына ұқсас «шешім» ретінде ұсынылған).&lt;/p&gt;\n&lt;h4 id=\"eksperimenttik-dizajn\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#eksperimenttik-dizajn\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эксперименттік дизайн&lt;/span&gt;&lt;/a&gt;Эксперименттік дизайн&lt;/h4&gt;\n&lt;p&gt;Біз қайталанатын өлшеулері бар субъектіішілік факторлық дизайнды және 5 түрлі қатысушылар тобын (стимулдардың ішкі жиынтықтары негізінде, төменде қараңыз) қолдандық. Дизайнды 3 × 4 × 2 + 2 ретінде ресімдеуге болады: қатысушылар визуалды өнер стимулдарын 3 абстракция дәрежесінде (фигуративті, жартылай абстрактілі, абстрактілі) және атаудың 4 түрінде (сипаттамалық атау, эвокативті атау, 1-топтың түсіндірмелі атауы, 2-топтың түсіндірмелі атауы), атаудың ашылуының 2 шартының кез келгенінде (нақты атау немесе «атаусыз» жалған атау) көрді. Бұл факторлар толық қиылысты, ал 24 фактор комбинациясының әрқайсысы үшін 2 сынақтан өткізілді (48 көркемөнер стимулы). Сонымен қатар Муни сынақтарының 2 тобы ұсынылды (Van de Cruys et al., 2021 бойынша жоғары «аха» рейтингі немесе төмен «аха» рейтингі), әр қатысушы үшін әрқайсысы 4 сынақтан (8 Муни стимулы). Бұл әр қатысушыға барлығы 56 сынақты құрады (стимулдар туралы қосымша мәліметтерді төменде қараңыз).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Субъектіішілік факторлық дизайн әрбір қатысушының барлық тәжірибелік шарттардан өтетінін білдіреді, бұл талдаудың статистикалық қуатын арттырады.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tapsyrma-procedurasy\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#tapsyrma-procedurasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тапсырма процедурасы&lt;/span&gt;&lt;/a&gt;Тапсырма процедурасы&lt;/h4&gt;\n&lt;p&gt;Қатысушылар жеке сілтеме арқылы Labvanced (Scicovery GmbH, Германия) платформасында жүзеге асырылған онлайн-экспериментке кірді. Ақпараттандырылған келісім алынғаннан кейін олар көмекші сауалнамалар жиынтығына жауап берді (төменде қараңыз). Негізгі экспериментке арналған нұсқаулар көрсетілді, одан кейін 5 жаттығу сынағы (2 Муни суреті және 3 көркемөнер стимулы олардың нақты атауларымен бірге; бұл стимулдар негізгі экспериментте қайта ұсынылмады). Содан кейін негізгі эксперимент басталды, одан кейін қысқа қорытынды сауалнама жүргізілді. Аяқтағаннан кейін қатысушылар ақшалай өтемақы алу үшін өз деректерін беру мақсатында GDPR талаптарына сәйкес келетін жеке Limesurvey серверіне (LimeSurvey GmbH, Германия) бағытталды. Негізгі эксперимент үшін біз қатысушыларға визуалды өнер туындыларын (картиналарды), олардан кейін олардың түпнұсқа атауларын немесе қосымша ақпараты жоқ жалған атауларды («атаусыз») ұсындық. Әрбір сынақ үшін қатысушылар келесі реттіліктен өтті: 1) 5 секунд бойы визуалды стимул (өнер туындысы немесе Муни кескіні), 2) атауға немесе Муни шешіміне қаншалықты қызығушылық танытқанын бағалау (үздіксіз шкаладағы жүгірткіні пайдалана отырып өз қарқынымен берілген жауап), 3) қосымша семантикалық белгі (3 секундтық көрсету уақыты); көркемөнер стимулдары жағдайында бұл түпнұсқа атау немесе «атаусыз» жалған атау болды (шарт кездейсоқ таңдалды, қатысушылар арасында толық теңгерілді), Муни суреттері жағдайында бұл кескін алынған ақ-қара фотосурет болды және 4) бастапқы кескін қайтадан ұсынылды (5 секундтық көрсету уақыты). Содан кейін олар бағалады: 5) қандай дәрежеде «аха» тәжірибесін бастан кешіргенін, 6) кескінді эстетикалық тартымдылығын және 7) кескінді қабылдау түсінігін (барлық жауаптар өз қарқынымен, үздіксіз шкаладағы жүгірткіні пайдалана отырып). Реттілік 1а-суретте көрсетілген. Осы 1-экспериментте соңғы екі бағалау жүгірткісі (эстетикалық артықшылық және сезілген түсінік) бір бетте бір-биринің үстіне орналастырылды. Рандомизация – әрбір көркемөнер стимулын атауы бар немесе атаусыз шартқа тағайындау кездейсоқ жүргізіліп, қатысушылар арасында толық теңгерілді. Әрбір қатысушы үшін стимулдардың реттілігі толық араластырылған сынақтармен рандомизацияланды (қатарынан бірдей фактор комбинациясының 1 стимулынан артық емес). Қатысушылар кездейсоқ түрде 5 топтың біріне тағайындалды — бұл 5 топтағы стимулдардың ішкі жиынтықтары ерекшеленді, бірақ бір-бірімен толық қиылысты: әрбір жеке стимул 5 топтың 2-інде ұсынылды.&lt;/p&gt;\n&lt;h4 id=\"minez-khulykh-koersetkishteri-zhaene-saualnamalar\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#minez-khulykh-koersetkishteri-zhaene-saualnamalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мінез-құлық көрсеткіштері және сауалнамалар&lt;/span&gt;&lt;/a&gt;Мінез-құлық көрсеткіштері және сауалнамалар&lt;/h4&gt;\n&lt;p&gt;Алдымен қатысушылар бірқатар сауалнамаларға жауап берді: тұлғаның үлкен бестігі сауалнамасы (BFI-2-XS: Rammstedt et al., 2020; Soto &amp;amp; John, 2017), қысқа індетті жалықтыру бейімділігі шкаласы (sBPS: Struk et al., 2017), жағымды және жағымсыз аффект кестесінің қысқа түрі (PANAS-SF: Thompson, 2007) және эстетикалық қабылдағыштық бағасы (AReA: Schlotz et al., 2020) неміс тіліндегі нұсқаларында, сондай-ақ негізгі демографиялық ақпарат бойынша фондық сауалнама (жасын, жынысын, білімін және көңіл-күй немесе неврологиялық бұзылулар туралы ақпаратты қоса алғанда).&lt;/p&gt;\n&lt;h4 id=\"derekterdi-taldau\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#derekterdi-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деректерді талдау&lt;/span&gt;&lt;/a&gt;Деректерді талдау&lt;/h4&gt;\n&lt;p&gt;Статистикалық талдау және деректерді визуализациялау Macintosh дербес компьютеріндегі (Apple Inc.) виртуалды орталарда Python (3.7.11 нұсқасы) және R (4.1.3 нұсқасы) көмегімен жүзеге асырылды. Суреттер мен нәтижелерді қайталайтын Jupyter блокноттары желіде ақпарат көзі ретінде қолжетімді (деректердің қолжетімділігін қараңыз).&lt;/p&gt;\n&lt;h4 id=\"syzykhty-aralas-modelder\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#syzykhty-aralas-modelder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сызықты аралас модельдер&lt;/span&gt;&lt;/a&gt;Сызықты аралас модельдер&lt;/h4&gt;\n&lt;p&gt;Негізгі гипотезалар R бағдарламасындағы lme4 пакетінің lmer функциясы арқылы сызықты аралас әсерлі регрессиялар көмегімен тексерілді (1.1-30 нұсқасы). Жеке әсер коэффициенттері үшін маңыздылық мәндері R тіліндегі lmertest пакетінде іске асырылған Саттертуэйттың еркіндік дәрежелері әдісі арқылы бағаланды (3.1-3 нұсқасы). Supp.A.2.2 үшін толық LMM кестелері R тіліндегі sjPlot пакетінің tab_model функциясы көмегімен жасалды. Келтірілген сызықты модельдердің жалпы маңыздылығын бағалау үшін ұқсастық қатынасы тесттері (Likelihood Ratio Tests) орындалды: LMM коэффициенттері R бағдарламасының anova функциясын пайдалана отырып, қысқартылған тек кесісу моделімен (фиксирленген әсер жоқ, бірақ қатысушы мен стимулдардың кездейсоқ әсерлері бар) салыстырылды. Тақырыптың әртүрлі бағалауларға әсерін бағалау үшін келесі алдын ала тіркелген LMM формулалары қолданылды:&lt;/p&gt;\n&lt;p&gt;түсіну ~ тақырып шарты + (тақырып шарты/қатысушы) + (тақырып шарты/сурет) (1)&lt;/p&gt;\n&lt;p&gt;ұнату ~ тақырып шарты + (тақырып шарты/қатысушы) + (тақырып шарты/сурет) (2)&lt;/p&gt;\n&lt;p&gt;аха ~ тақырып шарты + (тақырып шарты/қатысушы) + (тақырып шарты/сурет) (3)&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сызықты аралас модельдер (LMM) — қатысушылар мен кескіндердің жеке ерекшеліктерін ескеруге мүмкіндік беретін статистикалық талдау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мұнда тек өнер туындылары сынақтарының деректері пайдаланылды (Муни сынақтары алынып тасталды). Тақырыбы бар («titled») санаттағы орташа бағаны тақырыбы жоқ («untitled», бастапқы деңгей) санатпен салыстыру үшін біз жалған кодтауды (dummy coding) қолдандық. Қатысушы × тақырып шарты үшін кездейсоқ көлбеу әсері (random slope effect) алдын ала тіркелген болатын, өйткені біз қатысушылардың тақырып әсеріне сезімталдығы бойынша ерекшеленетінін күттік. Сондай-ақ біз кескін × тақырып шарты үшін кездейсоқ көлбеу әсерін де алдын ала тіркеген едік, өйткені тақырып әсері кескінге байланысты өзгереді деп болжанған болатын. Алайда, әрбір қатысушы әрбір кескінді бір тақырып шартында тек бір рет қана көргені бұл салыстыруды әлсіретуі мүмкін еді — сондықтан Supp.A.2.2-де біз әрбір кескін үшін кездейсоқ кесісулері бар балама модельдерді келтіреміз; бұл нәтижелерді түбегейлі өзгерткен жоқ. Бейнелеу өнері туындылары Муни кескіндеріне қарағанда ұнайды бағаларын жоғарырақ алады деген гипотезамызды тексеру үшін біз келесі формуланы қолдандық:&lt;/p&gt;\n&lt;p&gt;ұнату ~ өнер стилі + (1/қатысушы) + (1/сурет) (4)&lt;/p&gt;\n&lt;p&gt;Мұнда барлық сынақтар пайдаланылды. Барлық ұяшықтардағы орташа ұнайды бағасын Муни кескіндерімен (бастапқы деңгей) салыстыру үшін біз жалған кодтауды қолдандық. Бейнелеу өнері мен олардың тақырыптары тудыратын түсіну/ашу сезімінің («aha») күшін Муни кескіндері тудырған сезіммен салыстыру үшін біз келесі формуланы бейімдедік:&lt;/p&gt;\n&lt;p&gt;аха ~ өнер стилі : тақырып стилі + (1/қатысушы) + (1/сурет) (5)&lt;/p&gt;\n&lt;p&gt;Мұнда тек Муни кескіндері мен өздерінің шынайы тақырыптарымен көрсетілген өнер туындыларының деректері пайдаланылды («untitled» деп белгіленген сынақтар алынып тасталды). Барлық өзара әрекеттесу ұяшықтарындағы орташа түсіну/ашу бағасын Муни кескіндерімен (бастапқы деңгей) салыстыру үшін біз жалған кодтауды қолдандық. Әртүрлі тақырып шарттары шеңберінде қызығушылық пен түсіну/ашу арасындағы сызықтық байланысты тексеру үшін біз келесі LMM формуласын қолдандық:&lt;/p&gt;\n&lt;p&gt;аха ~ қызығушылық : тақырып шарты + (1/қатысушы) + (1/сурет) (6)&lt;/p&gt;\n&lt;p&gt;Мұнда барлық сынақтардың деректері пайдаланылды (тақырып шарты «untitled art», «titled art» немесе «mooney» ретінде кодталды). Жоғарыдағы барлық модельдер үшін ұқсастық қатынасы тесттері сәйкес келетін тек кесісу модельдеріне қарсы орындалды:&lt;/p&gt;\n&lt;p&gt;қызығушылық рейтингі ~ 1 + (1/қатысушы) + (1/сурет) (7)&lt;/p&gt;\n&lt;h4 id=\"kvadrattykh-muesheleri-bar-syzykhty-aralas-modelder\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#kvadrattykh-muesheleri-bar-syzykhty-aralas-modelder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Квадраттық мүшелері бар сызықты аралас модельдер&lt;/span&gt;&lt;/a&gt;Квадраттық мүшелері бар сызықты аралас модельдер&lt;/h4&gt;\n&lt;p&gt;Жергілікті регрессияны қолдана отырып деректерді визуализациялау (төменде қараңыз) зерттеу сипатындағы қосымша талдау ретінде деректерді сызықтық емес квадраттық әсерлерді пайдалана отырып қосымша модельдеуге итермеледі. Квадраттық полиномды мүшелері бар модельдің сызықтық мүшелері бар сәйкес модельмен салыстырғандағы ұқсастық қатынасы тесттері бұл процедураның модельдің сәйкестік сапасын айтарлықтай жақсартқанын бағалау үшін пайдаланылды. Біз қызығушылықтың түсіну/ашу сезіміне әсері тақырып стилімен квадраттық түрде модуляцияланатынын (8, 9-теңд.), түсіну/ашу сезімінің ұнайды бағасына әсері өнер стилімен квадраттық түрде модуляцияланатынын (10, 11-теңд.) және түсіну/ашу сезімінің түсінуге әсері өнер стилімен квадраттық түрде модуляцияланатынын (12, 13-теңд.) сынап көрдік.&lt;/p&gt;\n&lt;p&gt;аха ~ қызығушылық : тақырып стилі + (1/қатысушы) + (1/сурет) (8)&lt;/p&gt;\n&lt;p&gt;аха ~ квадраттық(қызығушылық) : тақырып стилі + (1/қатысушы) + (1/сурет) (9)&lt;/p&gt;\n&lt;p&gt;ұнату ~ аха : өнер стилі + (1/қатысушы) + (1/сурет) (10)&lt;/p&gt;\n&lt;p&gt;ұнату ~ квадраттық(аха) : өнер стилі + (1/қатысушы) + (1/сурет) (11)&lt;/p&gt;\n&lt;p&gt;түсіну ~ аха : өнер стилі + (1/қатысушы) + (1/сурет) (12)&lt;/p&gt;\n&lt;p&gt;түсіну ~ квадраттық(аха) : өнер стилі + (1/қатысушы) + (1/сурет) (13)&lt;/p&gt;\n&lt;h4 id=\"zhergilikti-regressiya\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#zhergilikti-regressiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жергілікті регрессия&lt;/span&gt;&lt;/a&gt;Жергілікті регрессия&lt;/h4&gt;\n&lt;p&gt;Жергілікті регрессия графиктары Python тіліне арналған seaborn модулінде іске асырылған жергілікті салмақталған шашырау диаграммасын тегістеу (LOWESS) көмегімен жасалды (Waskom, 2021, 0.11.2 нұсқасы).&lt;/p&gt;\n&lt;h4 id=\"derekterdi-vizualizaciyalau\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#derekterdi-vizualizaciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деректерді визуализациялау&lt;/span&gt;&lt;/a&gt;Деректерді визуализациялау&lt;/h4&gt;\n&lt;p&gt;Деректерді визуализациялау Python seaborn модулін пайдаланатын пайдаланушы коды арқылы жасалды (Waskom, 2021, 0.11.2 нұсқасы).&lt;/p&gt;\n&lt;h4 id=\"tangdau-koelemin-baghalau\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#tangdau-koelemin-baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Таңдау көлемін бағалау&lt;/span&gt;&lt;/a&gt;Таңдау көлемін бағалау&lt;/h4&gt;\n&lt;p&gt;Атау эффектісі немесе өнерді қабылдаудағы инсайт бойынша алдыңғы ЭЭГ зерттеулерінің жоқтығын ескере отырып, біз зерттеудің қуаттылығын біз байқағымыз келген мінез-құлық эффектісі: ынталандыру категориясының aha рейтингтеріне негізгі әсері негізінде есептеуді ұйғардық. Біз мақсатты таңдау көлемін G*Power (Faul et al., 2007, 3.1-нұсқа) көмегімен алдын ала бағаладық. Біз 1-экспериментте қолданылған сызықтық аралас модельдерге (LMM) ұқсас қайталанатын өлшемдері бар ANOVA дизайны үшін экспериментіміздің қуаттылығын қайта есептедік. Біз α = 0,05, қуаттылық = 0,8, әсер ету өлшемі f = 0,1758631 (&lt;span class=\"yfm-latex\" data-content=\"%5Ceta%5E2_p%20%3D%200%7B%2C%7D03\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; шағын әсер ету өлшеміне тең), 1 топ, 7 өлшем (3 × 2 + 1 дизайны, төменде қараңыз) және қайталанатын өлшемдер арасындағы корреляция r = 0,42 болатын «ANOVA: Факторлар ішіндегі қайталанатын өлшемдер» параметрлерін қолдандық. Қайталанатын өлшемдер арасындағы корреляция онлайн-зерттеу деректері негізінде, осы зерттеуде қолданылған 7 стимулдық фактор комбинациялары бойынша қатысушылардың орташа инсайт рейтингтерінің орташа корреляция коэффициенті ретінде бағаланды. Бұл қуаттылықты талдау N = 38 мақсатты таңдау көлеміне әкелді. Қатысушылардың қатыспай қалуын ескеру үшін біз кемінде N = 45 қатысушыдан деректер жинауды ұйғардық.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қуаттылықты талдау (power analysis) — эксперимент нақты ғылыми әсерді анықтай алатынына көз жеткізу үшін қажетті қатысушылардың ең аз санын математикалық түрде есептеу әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Іріктеу – Қатысушылар Германияның Рейн-Майн агломерация аймағындағы жалпы халық арасынан ыңғайлы іріктеу әдісімен таңдалды. Іріктеу рәсімі 1-эксперименттегідей болды. Іріктеудің қосылу критерийлері мыналар болды: жасы 18–55 жас аралығында, неміс тілін жақсы меңгерген, көру қабілеті жақсы және зерттеу кезінде көзілдірік кию қажеттілігінің жоқтығы (өйткені бұл көзді бақылау сапасын төмендетеді), белгілі неврологиялық бұзылыстардың жоқтығы және алдыңғы онлайн-зерттеуге қатыспағаны.&lt;/p&gt;\n&lt;p&gt;Қорытынды іріктеу – 50 қатысушы тіркеліп, деректерді жинауды аяқтады. Неврологиялық проблемалары бар (эссенциалды тремор) 1 қатысушы қосылу критерийлеріне қарамастан тіркеліп, сондықтан кейіннен талдаудан шығарылды, бұл талдау үшін 49 деректер жинағын қалдырды. Кейбір қатысушыларда кішігірім ақаулар немесе нашар сапалы жазбалар салдарынан деректері жоғалған кезеңдер (ЭЭГ, ЭКГ, көзді бақылау және/немесе рейтингтер) болды, бірақ олар талдаудан шығарылмады. Қатысушылардың жасы 18–52 жас аралығында болды (орташа = 28,0 жас, стандартты ауытқу = 7,2 жас). 28-і әйел, 19-ы еркек және «басқа» деп көрсеткен. 8-і солақай, 41-і оңқай және 0-і екі қолын да бірдей пайдаланатын (Флиндерс латеральды сауалнамасы; Nicholls et al., 2013). 17 қатысушыда сол көз, 28 қатысушыда оң көз, ал 4 қатысушыда көздің доминанттылығы байқалмады (экспериментатор бағалады; төменде қараңыз). Қатысушылар 8–27 жыл білім алғанын көрсетті (орташа = 17,3 жыл, стандартты ауытқу = 3,9 жыл; бұл ретте 1 қатысушы бұл деректерді ұсынбаған).&lt;/p&gt;\n&lt;p&gt;Іріктеу жоғары білімді адамдарға қарай өте үлкен ауытқуды көрсетті: барлық 49 қатысушы өздерінің ең жоғары біліктілігі ретінде неміс аттестатын (Abitur) немесе университет дәрежесін көрсетті. 49 қатысушының 11-і психикалық немесе психологиялық бұзылыстардың ағымдағы немесе өткен эпизодтары туралы хабарлады, олардың 7-сі қазіргі уақытта дәрі-дәрмек қабылдайтынын көрсетті. Бұл шығарып тастау критерийі болмаса да, біз эксперимент күні қатысушылардың кофеин қабылдауын да бағаладық: ол дене салмағының 0–3,61 мг/кг аралығында болды (орташа = 1,06 мг/кг, стандартты ауытқу = 0,923 мг/кг). Қатысушылардың 8-і қатысуға дейін кофеин тұтынуы нөлге тең екенін көрсетті. Қатысушылардың демографиялық көрсеткіштері туралы толық мәліметтерді A.1 және A.2 қосымша кестелерінен қараңыз. Барлық қатысушылар әр 30 минут үшін 7 еуро мөлшерінде ақшалай өтемақы алды және қатысқанға дейін хабардар етілген жазбаша келісімін берді. Зерттеу Хельсинки декларациясының этикалық стандарттарына сәйкес келді және жергілікті этика комитетімен (Макс Планк қоғамының Этика кеңесі) Стандартты зертханалық зерттеулерге арналған зерттеу этикасы шеңберіндегі өтінім негізінде мақұлданды. Деректер 2022 жылдың наурызынан 2022 жылдың шілдесіне дейін жиналды.&lt;/p&gt;\n&lt;h4 id=\"stimuldar1\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#stimuldar1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Стимулдар&lt;/span&gt;&lt;/a&gt;Стимулдар&lt;/h4&gt;\n&lt;p&gt;Әрбір қатысушы калибрленген СКД мониторында 48 көркем өнер стимулын және 16 Муни суретін көрді. Бұл стимулдар 1-эксперименттің бағалау деректерін пайдалана отырып, 1-эксперименттегі 120 көркем өнер стимулы мен 20 Муни суretiнен тұратын үлкенірек стимулдар жиынтығынан алдын ала таңдалған болатын.&lt;/p&gt;\n&lt;h4 id=\"suretti-tangdau\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#suretti-tangdau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Суретті таңдау&lt;/span&gt;&lt;/a&gt;Суретті таңдау&lt;/h4&gt;\n&lt;p&gt;Жоғарыда 1-эксперимент үшін сипатталған 140 стимулдан біз сызықтық аралас модель негізінде 64 стимулды таңдадық, формуласы:&lt;/p&gt;\n&lt;p&gt;&lt;span class=\"yfm-latex\" data-content=\"%5Ctext%7Baha%7D%20%5Csim%20%5Ctext%7B%D0%BA%D3%A9%D1%80%D1%81%D0%B5%D1%82%D1%96%D0%BB%D0%B3%D0%B5%D0%BD%20%D0%B0%D1%82%D0%B0%D1%83%7D%20%2B%20(%5Ctext%7B%D0%BA%D3%A9%D1%80%D1%81%D0%B5%D1%82%D1%96%D0%BB%D0%B3%D0%B5%D0%BD%20%D0%B0%D1%82%D0%B0%D1%83%7D%20%5Cmid%20%5Ctext%7B%D2%9B%D0%B0%D1%82%D1%8B%D1%81%D1%83%D1%88%D1%8B%7D)%20%2B%20(%5Ctext%7B%D0%BA%D3%A9%D1%80%D1%81%D0%B5%D1%82%D1%96%D0%BB%D0%B3%D0%B5%D0%BD%20%D0%B0%D1%82%D0%B0%D1%83%7D%20%5Cmid%20%5Ctext%7B%D1%81%D1%83%D1%80%D0%B5%D1%82%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (14)&lt;/p&gt;\n&lt;p&gt;яғни инсайт рейтингін атау шартынан (нақты атау немесе атаусыз) болжайтын модель, әрбір қатысушы мен әрбір стимул үшін кездейсоқ көлбеулер мен қиылысулар арқылы (бұл атау эффектісінің күші әрбір қатысушы мен әрбір стимул үшін әртүрлі болуы мүмкін екенін білдіреді). Барлық стимулдар үшін кездейсоқ көлбеу коэффициенттері рейтингтелді және біз әр сурет категориясы (абстрактілі өнер, жартылай абстрактілі өнер, фигуративті өнер, Муни суреттері) ішіндегі ең жоғары көлбеуі бар 16 стимулды таңдадық — бұлар 1-экспериментте aha рейтингтеріне ең күшті атау әсері бар суреттер еді. 1-эксперименттегі үшінші толық қиылысқан шарт (атау түрі: сипаттамалық, түсіндірмелі, эвокативті) мұнда алынып тасталды, өйткені бұл іріктеу процесіндегі еркіндікті күрт төмендететін еді. Рянгтирленген көлбеу коэффициенттері мен іріктеу SN A.1-суретте көрсетілген. Барлық стимулдар (суреттер мен атаулар) SN A.1.4 бөлімінде сипатталған.&lt;/p&gt;\n&lt;h4 id=\"eksperimentaldy-dizajn\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#eksperimentaldy-dizajn\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эксперименталды дизайн&lt;/span&gt;&lt;/a&gt;Эксперименталды дизайн&lt;/h4&gt;\n&lt;p&gt;Біз қайталанатын өлшемдері бар субъектішілік факторлық дизайнды қолдандық. Оны 3 × 2 + 1 дизайны ретінде формализациялауға болады: қатысушылар визуалды өнер стимулдарын 3 абстракция дәрежесінде (фигуративті, жартылай абстрактілі, абстрактілі), 2 атауды ашу шартының бірінде (нақты атау немесе «атаусыз» жалған атау) көрді. Бұл факторлар толығымен қиылысты, 6 фактор комбинациясының әрқайсысы үшін 8 сынақтан тұрды (48 көркем өнер стимулы). Сонымен қатар, әрбір қатысушыға Муни суреттері бар 16 сынақ ұсынылды. Бұл әр қатысушы үшін барлығы 64 сынаққа әкелді. 1-эксперименттен айырмашылығы, барлық қатысушылар кездейсоқ тағайындалған атаулармен болса да, бірдей стимулдарды көрді.&lt;/p&gt;\n&lt;h4 id=\"tapsyrmany-oryndau-procedurasy\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#tapsyrmany-oryndau-procedurasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тапсырманы орындау процедурасы&lt;/span&gt;&lt;/a&gt;Тапсырманы орындау процедурасы&lt;/h4&gt;\n&lt;p&gt;Алдымен қатысушы Labvanced (Scicovery GmbH, Германия) бағдарламасында іске асырылған қосымша сауалнамалар жиынтығын толтырды (төменде қараңыз). Қатысушы кабинаға кірді, содан кейін оған электроэнцефалографиялық бас киім және электрокардиограммаға (ЭКГ) арналған шеткі электродтар тағылды. ЭЭГ электродтары электролиттік гель көмегімен импеданс 10 кОм-нан төмен немесе соған жақын болғанша өңделді. Дайындық аяқталғаннан кейін қатысушыға шайнау, жыпылықтау және мойын бұлшықеттерін жиырудың ЭЭГ сигналына әсері көрсетілді, бұл артефактілердің көздері туралы хабардарлықты арттыру үшін жасалды, сонымен қатар көздері жұмулы қысқа кезең ішінде жеке альфа-тербелістер көрсетілді. Негізгі эксперименттің нұсқаулары экранға шығарылды, оның артынан 3 жаттығу сынағы орындалды (1 Муни суреті және 2 көркемдік стимул олардың нақты атауларымен бірге; бұл стимулдар негізгі экспериментте қайта көрсетілмеді).&lt;/p&gt;\n&lt;p&gt;Жаттығу блогынан кейін экспериментатор қатысушылардың отыру қалпын, бас тірегін реттеп, көзді қадағалайтын құрылғыны (айтрекерді) орнатты. Содан бері қатысушыдан бас тірегіндегі қалпын сақтау және сынақ кезеңдерінде шайнаудан, жұтынудан немесе басты қозғаудан бас тарту сұралды. Стимулдар 10 стимулдан тұратын блоктар түрінде ұсынылды және әр блоkтан кейін қатысушылар демалу үшін өз қарқынымен қысқа үзіліс жасай алды. Парадигма 1-экспериментке негізінен ұқсас болды (сонымен қатар 1а-суретті қараңыз). Алайда онлайн-зерттеуден айырмашылығы, барлық суреттер мен атаулардың алдында 2–2,5 с (джиттермен) ұсынылатын фиксациялық крест болды, стимуларалық интервал 1–1,5 с (джиттермен) құрды және барлық бағалау шкалалары (соның ішінде эстетикалық артық көру және түсіну сезімі) жеке беттерде ұсынылды. Рәсім PsychoPy көмегімен пайдаланушы коды арқылы іске асырылды (Peirce, 2007).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Айтрекер — бұл адамның көз қозғалысын және назар аудару бағытын нақты уақыт режимінде дәл бақылайтын құрылғы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эксперимент аяқталғаннан кейін қатысушылар қысқа сауалнаманы толтырды (Labvanced, Scicovery GmbH, Германия бағдарламасында іске асырылған). Рандомизация — көркемдік стимулды атауы бар немесе атауы жоқ шартқа тағайындау қатысушылар арасында толығымен кездейсоқ жүргізілді. Алайда рандомизация әрбір өнер стилі (абстрактілі, жартылай абстрактілі, фигуративті) шеңберінде атауы бар және атауы жоқ сынақтардың түпкілікті саны теңгерілген болатындай етіп бақыланды. Барлық деректер жиынтығы үшін тағайындаулардың бөлінісін теңгерімді ұстау үшін псевдокездейсоқ тағайындау тек әрбір екінші қатысушы үшін (1, 3, 5 және т.б.) орындалды, ал кейінгі қатысушылар (2, 4, 6 және т.б.) алдыңғы қатысушының кері тағайындауларын көрді. Әрбір қатысушы үшін стимулдардың реттілігі толығымен аралас сынақтармен кездейсоқ етіп жасалды (қатарынан бір түрдегі 2-ден артық стимул болмады).&lt;/p&gt;\n&lt;h4 id=\"minez-khulykh-koersetkishteri-zhaene-saualnamalar1\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#minez-khulykh-koersetkishteri-zhaene-saualnamalar1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мінез-құлық көрсеткіштері және сауалнамалар&lt;/span&gt;&lt;/a&gt;Мінез-құлық көрсеткіштері және сауалнамалар&lt;/h4&gt;\n&lt;p&gt;1-экспериментте қолданылған скринингтік құралдарға қосымша, келу алдында кофеинді тұтыну (Bühler et al., 2014) және қолдың басымдығы (FLANDERS; Nicholls et al., 2013) жүйелі сауалнамалар арқылы бағаланды. Окулярлық доминантность экспериментатормен Порта тестінің өзгертілген түрін қолдана отырып анықталды (Roth, 2002 сипатталғандай).&lt;/p&gt;\n&lt;p&gt;Барлық сынақ бойынша бағалаулар (қызығушылық, аҳа-тәжірибе, эстетикалық ұнату, түсіну) тінтуірді жылжыту арқылы басқарылатын жүгірткісі бар үздіксіз шкала көмегімен жиналды. Бағалаулар да, реакция уақыты да тіркелді. Жалқаулықпен жауап бермеудің алдын алу үшін қатысушылар тінтуірді алдын ала жылжытпай тұрып жауапты тіркей алмады. Шкалалардың ұштары «+» және «–» таңбаларымен белгіленді және әрбір шкалаға тиісті сұрақтар сүйемелденді: қызығушылықты бағалау үшін «Wie neugierig sind Sie auf den Titel / die Auflösung?» («Сіз атауды / шешімді қаншалықты қызықтырасыз?»), аҳа-бағалау үшін «Hatten Sie ein Aha!Erlebnis?» («Сізде аҳа-тәжірибе болды ма?»), эстетикалық бағалау үшін «Wie ästhetisch ansprechend fanden Sie das Bild?» («Суретті қаншалықты эстетикалық тартымды деп таптыңыз?») немесе түсінуді бағалау үшін «Denken Sie, dass Sie das Bild verstanden haben?» («Суретті түсіндім деп ойлайсыз ба?»). Бұл бағалаулардың реттілігі бекітілген болатын. Зерттеу алдындағы егжей-тегжейлі тапсырма сипаттамасында барлық бағалаулар түсіндірілді — толық сипаттамаларды Supp.A.1.2 бөлімінен табуға болады.&lt;/p&gt;\n&lt;h4 id=\"derekterdi-zhinau-zhaene-apparattykh-khuraldar-zertteu-ortasy\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#derekterdi-zhinau-zhaene-apparattykh-khuraldar-zertteu-ortasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деректерді жинау және аппараттық құралдар. Зерттеу ортасы&lt;/span&gt;&lt;/a&gt;Деректерді жинау және аппараттық құралдар. Зерттеу ортасы&lt;/h4&gt;\n&lt;p&gt;ЭЭГ жазуы акустикалық тұрғыдан қорғалған кабинада (модель: IAC 120a, IAC GmbH, Германия; ішкі өлшемдері: 2,74 × 2,54 × 2,3 м) жүзеге асырылды. Қатысушылар иегін маңдай тіреуіші бар иек тіреуішке (SR Research Head Support, SR Research Ltd., Канада) қойды; иек тіреуіш пен экран арақашықтығы 72 см болды. Үстел биіктігі қатысушылар зерттеу уақыты boyunca сақтай алатын ыңғайлы тік қалыпта отыратындай етіп реттелді. Барлық деректерді ЭЭГ гелін дайындау кезінде көмек көрсеткен бір соб экспериментатор жинады. Қатысушы кабинаға орнатылған бөлме микрофоны арқылы кез келген уақытта экспериментатормен байланыса алатын еді.&lt;/p&gt;\n&lt;p&gt;Эксперимент 64 биттік Microsoft Windows 7.1.7601 service pack 1 (Microsoft Corporation, АҚШ) операциялық жүйесінде жұмыс істейтін дербес компьютерде PsychoPy3 автономды бағдарламалық жасақтамасын (Peirce, 2007, 3.0.7 нұсқасы) пайдалана отырып іске қосылды. Визуалды стимулдар 24 дюймдік BenQ XL2420Z экранында (BenQ Corporation, Тайвань) 144 Гц номиналды кадр жиілігімен және 1920 × 1080 пиксель ажыратымдылығымен ұсынылды (экспериментатор үшін көрсетілді). Жарықтық пен түсті калибрлеу экран параметрлерін пайдалана отырып орындалды және PsychoPy монитор орталығының баспалдақты тәртібімен (staircase routine) хромметр (Konica Minolta CS-150) көмегімен тексерілді; өлшенген гамма қисығын OSF репозиторийінен онлайн табуға болады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Мониторды калибрлеу және PsychoPy сияқты арнайы бағдарламаларды пайдалану когнитивтік ЭЭГ парадигмалары үшін өте маңызды болып табылатын визуалды стимулдардың кідіріссіз, уақыт пен кеңістік бойынша дәл ұсынылуын қамтамасыз етеді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ЭЭГ және шеткі физиология деректерін жинау: биосигналдар 24 биттік цифрлауы мен тұрақты токтан (DC) 280 Гц дейінгі аналогтық жолақты сүзгісі бар BIP2Aux адаптерлері бар BrainVision actiCHamp күшейткішінің (Brain Products GmbH, Германия) көмегімен күшейтілді. Күшейткіш 2 ActiPower PowerPacks (Brain Products GmbH, Германия) арқылы тұрақты ток батареясымен қоректенді. Деректер Microsoft Windows 7 басқаратын тәуелсіз жазу компьютерінен BrainVision Recorder (1.21.0303 нұсқасы; Brain Products GmbH, Германия) көмегімен 1 кГц дискретизация жиілігімен жазылды. Экспериментатор компьютерінен келген TTL триггерлері параллель порт арқылы күшейткішке жіберілді.&lt;/p&gt;\n&lt;p&gt;ЭЭГ деректері кеңейтілген халықаралық 10-20 локализация жүйесіне сәйкес орналастырылған (Commitee, 1958; Oostenveld &amp;amp; Praamstra, 2001), белсенді экрандауынсыз белсенді Ag/AgCl электродтары бар 64 арналы actiCAP жүйесі (Brain Products GmbH, Германия) көмегімен жиналды, мұнда FCz онлайн жазу референсі және AFz жерлендіру нүктесі ретінде пайдаланылды. Импедансты жақсарту үшін маңдай мен құлақ артындағы тері спиртпен сүртілді. Қалпақ Cz электродын назион-инион және сол құлақ-оң құлақ осьтеріне орталықтандыру арқылы орналастырылды. Деректерді жинау аяқталғаннан кейін электрод орындары Polhemus FastTrak жүйесі (Polhemus, АҚШ) және Curry бағдарламалық жасақтамасы (8 нұсқа; Compumedics Neuroscan) арқылы цифрланды.&lt;/p&gt;\n&lt;p&gt;ЭКГ деректері ЭЭГ күшейткішімен биполярлы қосымша арна ретінде жазылды: бір реттік электродтарды (Covidien, АҚШ) пайдалана отырып, электродтар Эйнтховеннің II әкетуіне сәйкес оң ортаңғы бұғанаға және төменгі сол жақ қабықшаға орналастырылды. ЭЭГ деректерінің сапасын жақсарту үшін қатысушылардан шашты сәндеу өнімдерін қолданбау шақыру хатында сұралды.&lt;/p&gt;\n&lt;h4 id=\"koezdi-bakhylau-derekterin-zhinau\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#koezdi-bakhylau-derekterin-zhinau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Көзді бақылау деректерін жинау&lt;/span&gt;&lt;/a&gt;Көзді бақылау деректерін жинау&lt;/h4&gt;\n&lt;p&gt;Бинокулярлық көзқарас орны (экрандағы координаттар) және қарашық өлшемі үстелге орнатылатын EyeLink 1000 Plus көзді бақылау жүйесі (SR Research Ltd.) және тәуелсіз жазу компьютерінде жұмыс істейтін EyeLink 1000 Plus Host бағдарламалық жасақтамасы арқылы тіркелді. Экспериментатор компьютері мен EyeLink жазу жүйесі Ethernet арқылы қосылды, ал трекер жүйесі PyLink Python модулі (SR Research Ltd., 1.11.0.0 нұсқасы) арқылы басқарылды. Деректер әр блок арасындағы жазу үзілістерімен 500 Гц дискретизация жиілігімен жазылды. Көз трекері әр сынақ блогының алдында 13 нүктелі көлденең және тік калибрлеу тәртібін қолдана отырып (қайта) калибрленді. Деректер сапасын жақсарту үшін қатысушылардан шақыру хатында макияж, әсіресе көз контуры мен тушь жақпау сұралды.&lt;/p&gt;\n&lt;h4 id=\"derekterdi-taldau1\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#derekterdi-taldau1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деректерді талдау&lt;/span&gt;&lt;/a&gt;Деректерді талдау&lt;/h4&gt;\n&lt;p&gt;Деректерді алдын ала өңдеу, өңдеу және статистикалық талдау институтының жоғары өнімді компьютерінде (HPC) Python (3.10.4 нұсқасы), conda виртуалды ортасындағы R (3.6.1 нұсқасы) және Matlab (The MathWorks Inc., R2019b нұсқасы) көмегімен орындалды. Суреттер мен нәтижелерді қайта шығаратын Jupyter блокноттары OSF желісінде көпшілікке қолжетімді.&lt;/p&gt;\n&lt;h4 id=\"eeg-derekterin-erte-aldyn-ala-oengdeu\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#eeg-derekterin-erte-aldyn-ala-oengdeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ЭЭГ деректерін ерте алдын ала өңдеу&lt;/span&gt;&lt;/a&gt;ЭЭГ деректерін ерте алдын ала өңдеу&lt;/h4&gt;\n&lt;p&gt;ЭЭГ деректері MNE-BIDS Python модулі (Appelhoff et al., 2019, 0.10 нұсқасы) арқылы BIDS форматына (Pernet et al., 2019, 1.6.0 нұсқасы) көшірілді. Алдын ала тіркелген талдау жоспарынан ауытқи отырып, біз ICA қамтитын алдын ала өңдеу және тазарту конвейерін қолданбадық. Оның орнына біз PREP конвейерін (0.56.0 нұсқасы, MATLAB жүйесіндегі EEGLAB плагині, әдепкі параметрлер жиынтығын қолдана отырып; Bigdely-Shamlo et al., 2015) пайдаландық; бұл тек желілік шуды жою, (сенімді) орташа референтке қайта бағыттау, сондай-ақ шулы арналарды анықтау және интерполяциялаудан тұратын аз агрессивті, толық автоматтандырылған ерте сатыдағы алдын ала өңдеу конвейері болып табылады. Бұл шешім 1) ауыр алдын ала өңдеу және/немесе деректерді қабылдамау кейде ойлағаннан гөрі аз пайдалы болуы мүмкін екенін көрсететін соңғы жұмыстарға (Delorme, 2023), өйткені сигнал/шу қатынасындағы кез келген ұтыс деректерді қабылдамауға байланысты статистикалық қуаттың төмендеуінен асып түсуі керек, және 2) ICA негізінде деректерді тазарту деректерде қалдықтар қалдыруы мүмкін екенін (Dimigen, 2020; Robbins et al., 2020) және бұл қалдықтар осы зерттеуде жоспарланғандай, сезімтал машиналық оқыту алгоритмдері үшін проблема болып қалуы мүмкін екенін көрсеткен жұмыстарға (Quax et al., 2019; Thielen et al., 2019) негізделді.&lt;/p&gt;\n&lt;h4 id=\"eeg,-kharashykh-oelshemi-zhaene-lezdik-zhuerek-soghu-zhiiligi-negizinde-uakhyt-bojynsha-sheshiletin-kodtan-shygharu\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#eeg,-kharashykh-oelshemi-zhaene-lezdik-zhuerek-soghu-zhiiligi-negizinde-uakhyt-bojynsha-sheshiletin-kodtan-shygharu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ЭЭГ, қарашық өлшемі және лездік жүрек соғу жиілігі негізінде уақыт бойынша шешілетін кодтан шығару&lt;/span&gt;&lt;/a&gt;ЭЭГ, қарашық өлшемі және лездік жүрек соғу жиілігі негізінде уақыт бойынша шешілетін кодтан шығару&lt;/h4&gt;\n&lt;p&gt;Біз көп өлшемді физиологиялық деректерден (ЭЭГ, қарашық өлшемі, жүрек соғу жиілігі) әртүрлі мақсатты көрсеткіштерді (стимул категориялары мен бағалауларды) декодтауға тырыстық. Уақыт бойынша шешілетін декодтау жылжымалы терезе тәсілі көмегімен іске асырылды: 64 ЭЭГ датчигі (немесе 2 қарашық іздері, немесе бір жүрек соғу жиілігі арнасы) бойынша әрбір уақыт үлгісінде тәуелсіз декодтау модельдері сәйкестендірілді. Бұл талдау физиологиялық сигналдардан бағалауды немесе шартты сызықтық түрде декодтауға болатынын және қашан болатынын көрсететін декодтау уақыт қатарын берді. Декодтау уақыт қатарлары кейін қатысушылар арасында екінші деңгейлі кластерлік түзетуден өткізілді (төменде қараңыз). Декодтау конвейерлері: біз қайталап көрсету (суретті 1-ші/2-ші рет көрсету), стимул шарты (Муни/өнер) және тақырып шарты (нақты немесе жалған тақырып) үшін 3 түрлі категориялық жіктеу конвейерін және әртүрлі бағалаулар үшін (қызығушылық, инсайт, ұнату, түсіну; барлығы қатысушы бойынша z-ұпайларға түрлендірілген) 4 түрлі жалпы мәнді болжау конвейерін құрдық. Декодер дизайны Gwilliams and King (2020) жұмысына тығыз сәйкес келеді және MNE Python бағдарламасында іске асырылған: біз категориялық жіктеу үшін логистикалық регрессияны (scikit-learn; Pedregosa et al., 2011, әдепкі параметрлер: C = 1) және үздіксіз болжау үшін қырлы регрессияны (әдепкі параметрлер: alpha = 1) қолдандық. Декодтау өнімділігі стратификацияланған 10 қабатты кросс-тексеру арқылы бағаланды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стратификацияланған 10 қабатты кросс-тексеру (10-fold cross-validation) — модельдің сапасын бағалау үшін деректерді тең бөліктерге бөліп, сыныптардың пропорциясын сақтай отырып оқыту және сынау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Декодтау дәлдігі логистикалық регрессия үшін AUC метрикасы және қырлы регрессия үшін Спирмен R коэффициенті арқылы бағаланды. Барлық декодерлер оқыту жиынтығының орташа мәні мен стандартты ауытқуы арқылы қалыпқа келтірілген деректерді пайдаланды.&lt;/p&gt;\n&lt;h4 id=\"derekter-muemkindikteri\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#derekter-muemkindikteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деректер мүмкіндіктері&lt;/span&gt;&lt;/a&gt;Деректер мүмкіндіктері&lt;/h4&gt;\n&lt;p&gt;Бұл декодтау конвейерлері әртүрлі деректерге қолданылды: біріншіден, барлық алпыс төрт арнадағы уақыт аймағындағы ЭЭГ-ге (бір сынақтық ERP) – үздіксіз PREP алдын ала өңделген ЭЭГ деректері жолақты сүзгіден өткізіліп (0.1–40 Гц, FIR, MNE әдепкі параметрі) эпохаларға кесілді (стимулдың басталуы айналасында -0.5–5 с); базалық сызықты түзету базалық кезеңнің орташа мәнін (-0.5–0 с) бүкіл эпохадан азайту арқылы орындалды (әрбір сынақ пен арна үшін жеке). Деректер шексіз анықтамалық нүктеге қайта есептелді (REST; Yao, 2001, MNE жүйесінде іске асырылған). Соңында, толығымен автоматты түрде сынақты қабылдамау рәсімі қолданылды (әрбір қатысушы шегіндегі сынақ деректерінің мин-макс амплитудасына негізделген): сәйкес декодтау ішкі жиынтығында қолданылған барлық сынақтардың мин-макс амплитудаларының эмпирикалық үлестіріміне гамма үлестірімі сәйкестендіріліп, сәйкестендірілген үлестірімнің 90-шы процентилінен тыс мәні бар эпохалар аномалия ретінде қабылданбады. Бұл қадам біздің сынақтар санын азайтқанымен (төмендегі сан), біз оны қажет деп санадық, өйткені масштабтау кезеңі декодтау конвейерін аномалияларға осал етеді. Декодтау үшін екінші деректер жиынтығы барлық алпыс төрт арнадағы канондық жиілік диапазондарындағы жиілік диапазонының қуаты болды – PREP алдын ала өңделген үздіксіз ЭЭГ деректері тиісті жиілік диапазонына жолақты сүзгіден өткізіліп (дельта: 0.1–4 Гц; тета: 4–8 Гц; альфа: 8–23 Гц; бета: 13–30 Гц; гамма: 30–80 Гц – FIR, MNE әдепкі параметрі) және талданатын деректерде шеткі артефактілерді болдырмау үшін бастапқыда қажет етілгеннен ұзағырақ эпохаларға кесілді (дельта үшін -2–6.5 с және қалған диапазон үшін -1–5.5 с); бұл кезеңде базалық сызықты түзету қолданылған жоқ. Деректер шексіз анықтамалық нүктеге қайта есептелді.&lt;/p&gt;\n&lt;p&gt;Тербелмелі белсенділікті анықтау үшін қоздырылған жауап әрбір жеке сынақтан азайтылды және Гильберт түрлендірілген ЭЭГ орауышы уақыт-жиілік жауабы (TFR) ретінде есептелді. Соңында эпохалар декодтауға арналған уақыт терезесіне (-0.5–5 с) дейін қиылып, базалық кезеңнің орташа мәнін (-0.5–0 с) бүкіл эпохадан азайту арқылы базалық сызықты түзету қолданылды (әрбір сынақ пен арна үшін жеке). ERP деректері үшін орындалған сынақты қабылдамау әрекеті қайталанды. Үшінші деректер жиынтығы бинокулярлық қарашық ізі болды. Шикі үздіксіз деректер төмен жиілікті сүзгіден өткізілді (кесу жиілігі 10 Гц, FIR, MNE әдепкі параметрлері). Көздің жыпылықтауына байланысты жоғалған деректер сызықтық түрде интерполяцияланды (MNE interpolate_blinks функциясын пайдалана отырып), ал мин-макс амплитудасы орташа мәннен екі стандартты ауытқудан үлкен сынақтар аномалия ретінде қабылданбады. Төртінші деректер жиынтығы лездік жүрек соғу жиілігі болды. ЭКГ жазбалары neurokit2 python модулі көмегімен алдын ала өңделді (0.2.7 нұсқасы; Makowski et al., 2021): жазбалар neurokit2 ecg_invert функциясы арқылы инверттелген сигналға тексерілді және қажет болса инверттелді, бастапқыда қажет етілгеннен ұзағырақ эпохаларға кесілді (-3.5–8 с; базалық сызықты түзетусіз), содан кейін деректерді тазарту (neurokit ecg_clean функциясы), R-шыңдарды анықтау (neurokit ecg_peak функциясы) және лездік жүрек соғу жиілігіне түрлендіру (neurokit ecg_rate функциясы, барлығы әдепкі параметрлермен) орындалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жиілікті төмендету (down-sampling) есептеулерді жылдамдату және көлемді азайту үшін сигналдың дискретизация жиілігін азайту әдісі болып табылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Соңында эпохалар декодтауға арналған уақыт терезесіне (-0.5–5 с) дейін қиылып алынды. Әрбір сынақтағы жазба сапасы neurokit ecg_quality функциясы көмегімен (Zhao &amp;amp; Zhang, 2018 бойынша бағалау әдісін қолдана отырып) бағаланды және «өте жақсы» деп бағаланбаған барлық сынақтар талдаудан шығарылды. ERP, TFR, қарашық және жүрек соғу жиілігі деректері декодтау алдында 50 Гц жиілікке дейін қайта дискретизацияланды (MNE resample функциясын әдепкі параметрлермен пайдалана отырып).&lt;/p&gt;\n&lt;h4 id=\"synakhtardy-khabyldamau\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#synakhtardy-khabyldamau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сынақтарды қабылдамау&lt;/span&gt;&lt;/a&gt;Сынақтарды қабылдамау&lt;/h4&gt;\n&lt;p&gt;Төменде біз берілген деректер модальділігі шеңберіндегі барлық түрлі декодтау құбырлары бойынша сынақтарды қабылдамау туралы хабарлаймыз. Қайталанатын әсерді (1-ші немесе 2-ші презентация) және стимул санатын (Муни немесе визуалды өнер) декодтау үшін барлық 64 сынақ пайдаланылды (өнер және Муни суреттері), қалған барлық талдауларда тек өнер сынақтары пайдаланылды (әр қатысушыға 48 сынақ). Шығарынды сынақтарды қабылдамау критерийлері жоғарыда әр деректер модальділігі бойынша сипатталған.&lt;/p&gt;\n&lt;p&gt;Сонымен қатар, берілген декодтау құбыры шеңберінде қатысушы толығымен алынып тасталды, егер 1) кросс-валидация үшін қажетті сынақтардан аз қалса, немесе 2) декодтау моделінің жинақталуы үшін қатысушының бағалауларындағы дисперсия тым төмен болса. Жоғарыда сипатталған тазарту және сынақтарды қабылдамау процедуралары төмен пайыздық диапазонда сынақтардың орташа қабылданбауына әкелді. Максималды сынақтар саны құбырға байланысты өзгеретінін ескеріңіз.&lt;/p&gt;\n&lt;p&gt;ЭРП – 46–49 қатысушыдан алынған деректер (орташа = 49-дан 48,2 немесе 98,45%) және олардың ішінде мүмкін болатын максималды сынақтардың 91,3–95,6% (орташа = 93,51%) пайдаланылды. EEG дельта – 47–49 қатысушыдан алынған деректер (орташа = 49-дан 48,3 немесе 98,64%) және олардың ішінде мүмкін болатын максималды сынақтардың 91,0–95,3% (орташа = 92,85%) пайдаланылды. EEG тета – 41–49 қатысушыдан алынған деректер (орташа = 49-дан 47,9 немесе 97,71%) және олардың ішінде мүмкін болатын максималды сынақтардың 87,8–93,3% (орташа = 91,06%) пайдаланылды. EEG альфа – 45–49 қатысушыдан алынған деректер (орташа = 49-дан 48,3 немесе 98,64%) және олардың ішінде мүмкін болатын максималды сынақтардың 88,7–94,5% (орташа = 91,46%) пайдаланылды. EEG бета – 47–49 қатысушыдан алынған деректер (орташа = 49-дан 48,5 немесе 98,89%) және олардың ішінде мүмкін болатын максималды сынақтардың 93,3–96,6% (орташа = 95,01%) пайдаланылды. EEG гамма – 47–49 қатысушыдан алынған деректер (орташа = 49-дан 48,4 немесе 98,70%) және олардың ішінде мүмкін болатын максималды сынақтардың 91,8–96,6% (орташа = 94,29%) пайдаланылды. Қарашықтың кеңеюі – 47–49 қатысушыдан алынған деректер (орташа = 49-дан 48,3 немесе 98,64%) және олардың ішінде мүмкін болатын максималды сынақтардың 98,9–99,4% (орташа = 99,07%) пайдаланылды. Жүрек соғу жиілігі – 45–49 қатысушыдан алынған деректер (орташа = 49-дан 47,0 немесе 95,98%) және олардың ішінде мүмкін болатын максималды сынақтардың 95,8–98,3% (орташа = 97,12%) пайдаланылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кросс-валидация — бұл машиналық оқыту моделінің жаңа деректерде қаншалықты жақсы жұмыс істейтінін бағалау үшін деректер жиынын оқу және сынақ бөліктеріне бөлетін әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"dekodtau-daeldikterining-ekinshi-denggejdegi-statistikalykh-taldauy\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#dekodtau-daeldikterining-ekinshi-denggejdegi-statistikalykh-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Декодтау дәлдіктерінің екінші деңгейдегі статистикалық талдауы&lt;/span&gt;&lt;/a&gt;Декодтау дәлдіктерінің екінші деңгейдегі статистикалық талдауы&lt;/h4&gt;\n&lt;p&gt;Бір өлшемді және көп өлшемді декодтау нәтижелерінің маңыздылығы MNE функциясы permutation_cluster_1samp_test іске асырылған бір таңдамалы ауыстырып қою кластерлік тестінің көмегімен тексерілді (Maris &amp;amp; Oostenveld, 2007). Жеке декодтау траекторияларындағы шуды ескеру үшін әрбір қатысушы үшін декодтау уақыт қатарлары ауыстырып қою тестіне дейін сәл тегіселді (scipy-тің gaussian_filter функциясы көмегімен, sigma=1.0).&lt;/p&gt;\n&lt;p&gt;Деректер тиісті метрика үшін теориялық кездейсоқ деңгей төңірегінде орталықтандырылды (AUC үшін 0.5, Спирмен R үшін 0). Содан кейін ауыстырып қою кластерлік тесті орындалды: біріншіден, бір жақты бір таңдамалы t-тесттер бастапқы деректердің әрбір уақыт нүктесінде жасалды. Кеңістіктік-уақыттық көршілес деректер нүктелері p &amp;lt; 0.05 мәніне сәйкес келетін кластер қалыптастыру табалдырығы негізінде кластерленді және әрбір кластер үшін тест статистикасы уақыт бойынша t-мәндердің қосындысы ретінде табылды.&lt;/p&gt;\n&lt;p&gt;Содан кейін ауыстырып қою нөлдік бөлінісі жасалды (10000 ауыстырып қою қадамы): кездейсоқ таңба ауысулары бар бастапқы деректерден кездейсоқтандырылған деректер жасалды және кластерлер мен тест статистикасының жаңа жиынтығы қалыптастырылды. Бастапқы тест статистикасы содан кейін статистикалық маңыздылықты бағалау үшін ауыстырып қою нөлдік бөлінісімен салыстырылды.&lt;/p&gt;\n&lt;h4 id=\"derekterdi-vizualizaciyalau1\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#derekterdi-vizualizaciyalau1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деректерді визуализациялау&lt;/span&gt;&lt;/a&gt;Деректерді визуализациялау&lt;/h4&gt;\n&lt;p&gt;Уақыт бойынша шешілген декодтау талдауына арналған деректерді визуализациялау matplotlib Python модулін (Hunter, 2007, 3.8.0 нұсқасы) пайдалана отырып, пайдаланушы коды арқылы жасалды және .svg форматында экспорталды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-f3.jpg\" alt=\"3-сурет: Қайталанатын көрсетілім мен кескін санатын декодтау (өнер туындысы және Муни сынақтары) – а) Кескіннің 1-ші нем\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет: Қайталанатын көрсетілім мен кескін санатын декодтау (өнер туындысы және Муни сынақтары) – а) Кескіннің 1-ші немесе 2-ші көрсетілімі: декодтау барлық деректер модальділіктерінен сенімді түрде мүмкін болды, бірақ уақыт доменіндегі ЭЭГ-дан ең жақсысы (сурет шыққаннан кейін шамамен 0,5–1 с шамасында айқын шыңы бар, бүкіл сынақ бойы кездейсоқ деңгейден айтарлықтай жоғары). Оқушы іздерін декодтауда Муни кескіндеріне қарағанда өнермен жақсы жұмыс істеді, мұнда декодтау тек сынақ соңында ғана маңызды болды. Бұл ішінара осы санаттағы сынақтардың аз болуына байланысты болуы мүмкін (бір қатысушы үшін 48 өнер және 16 Муни сынағы). Жүрек соғу жиілігі сынақтардың басында санатты сәл жақсырақ болжайтын сияқты. Мұны бірге қабылдайтын болсақ, бұл стимулдардың қайталанатын көрсетілім кезінде бірдей өңделмегенін қатаң түрде көрсетеді. б) Стимул домені (Муни кескіні немесе өнер туындысы): кескін санатын ЭЭГ, оқушы деректері және жүрек соғу жиілігі үшін кескін көрсетілімінің басынан бастап сенімді түрде декодтауға болады, тағы да уақыт доменіндегі ЭЭГ-дан ең жақсысы. Айта кету керек, жіктеу бастапқы көрсетілімге қарағанда екінші кескін көрсетілімі кезінде сенімдірек жұмыс істеді (аз айырмашылық болған оқушы деректерін қоспағанда). Жиілік доменіндегі ЭЭГ (гамма диапазонын қоспағанда) екі санат үшін де шулы, бірақ маңызды декодтау нәтижелерін берді; барлық сынақтар мен шарттардың графиктер үшін Supp.A.2.5 қараңыз. Декодтау уақыт курстары қабатталған 10 еселік кросс-тексеруде әрбір жеке қатысушы үшін есептелді; маңыздылық екінші деңгейлі статистикалық сынақ арқылы анықталды (кластерлік ауыстыру t-тесті, маңыздылық деңгейі p &amp;lt; 0,05). X осі кездейсоқ деңгейді көрсетеді (қолданылатын AUC метрикасы үшін 0,5).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-f4.jpg\" alt=\"4-сурет: Мағынаны жасаудың физиологиялық корреляттарын декодтау (тек өнер туындысы сынақтары) – а) «Атау әсерін» декодта\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет: Мағынаны жасаудың физиологиялық корреляттарын декодтау (тек өнер туындысы сынақтары) – а) «Атау әсерін» декодтау: біз кескін стимулының өзінің нақты атауымен немесе ақпараттық емес жалған белгімен («атауы жоқ») жұптастырылғанын айтарлықтай дәрежеде декодтай алдық. Бұл екінші қарау кезінде (атаудан кейін) уақыт доменіндегі ЭЭГ-дан, сондай-ақ оқушы өлшемі мен жүрек соғу жиілігінен ең жақсы жұмыс істейді (2-көрсетілім кезіндегі жүрек соғу жиілігі бұрынғы өңдеуден әсер еткен сияқты, мысалы, атауды көрсету кезінде, және декодтау нәтижелері сурет пайда болғанға дейін және одан кейін көп ұзамай жақсырақ болады). Күтілгендей, атау шартын кескіндердің бірінші көрсетілімінен (атау ұсынылғанға дейін) декодтау мүмкін емес еді. б) Атауға деген қызығушылықтың, аха, эстетикалық ұнату және түсіну сезімінің сынақ бойынша рейтингтерін декодтау: біз жазылған физиологиялық сигналдардың біреуінен немесе бірнешеуінен рейтингтердің әрбір түрін декодтай аламыз. Сезілетін түсінуді уақыт доменіндегі ЭЭГ-дан (атауға дейінгі және кейінгі сынақтарда), кеш дельта диапазонының қуатынан (атаудан кейінгі сынақтарда) және жүрек соғу жиілігінен (атаудан кейінгі сынақтарда, атау шартын декодтауға арналған уақыт курстарына ұқсас уақыт курсымен, бірақ сәл ертерек) ең жақсы декодтауға болады. Оқушының кеңюі атаудан кейінгі сынақтар кезінде де кездейсоқ деңгейден жоғары декодтауды көрсетті (ERP-ге ұқсас уақыт курсымен), бірақ маңызды болмады. Атауға деген қызығушылықты кеш атауға дейінгі оқушы сигналынан және ерте атаудан кейінгі уақыт доменіндегі ЭЭГ-дан айтарлықтай декодтауға болады. Инсайт (аха) рейтингтерін атаудан кейінгі сынақтардың басында оқушы өлшемінен айтарлықтай декодтауға болады. Эстетикалық ұнату рейтингтері атаудан кейінгі уақыт доменіндегі ЭЭГ-да маңызды декодтаудың қысқа шыңын көрсетті. Маңызды болмаса да, оқушы өлшемі сигналы ерте атауға дейінгі сынақтарда айқын шыңы бар жалпы кездейсоқ деңгейден жоғары декодтауды қамтамасыз етті. Басқа деректер модальділіктері атауға дейінгі немесе кейінгі сынақтарда маңызды нәтижелерді көрсеткен жоқ; барлық сынақтар мен шарттардың графиктер үшін Supp.A.2.5 қараңыз. Декодтау уақыт курстары қабатталған 10 еселік кросс-тексеруде әрбір жеке қатысушы үшін есептелді; маңыздылық екінші деңгейлі статистикалық сынақ арқылы анықталды (кластерлік ауыстыру t-тесті, маңыздылық деңгейі p &amp;lt; 0,05). X осі кездейсоқ деңгейді көрсетеді (бинарлы декодтаудағы AUC метрикасы үшін 0,5 және үздіксіз рейтингтердегі сперман R метрикасы үшін 0).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1.jpg\" alt=\"5-сурет: ЭЭГ зерттеуі үшін стимулды қосалқы іріктеу. Сұр қораптар таңдалған стимулдарды көрсетеді (санат бойынша 16-дан)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет: ЭЭГ зерттеуі үшін стимулды қосалқы іріктеу. Сұр қораптар таңдалған стимулдарды көрсетеді (санат бойынша 16-дан)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1-2.jpg\" alt=\"Сурет S1 (жалғасы 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S1 (жалғасы 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1-3.jpg\" alt=\"Сурет S1 (жалғасы 3)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S1 (жалғасы 3)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1-4.jpg\" alt=\"Сурет S1 (жалғасы 4)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S1 (жалғасы 4)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1-5.jpg\" alt=\"Сурет S1 (жалғасы 5)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S1 (жалғасы 5)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1-6.jpg\" alt=\"Сурет S1 (жалғасы 6)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S1 (жалғасы 6)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1-7.jpg\" alt=\"Сурет S1 (жалғасы 7)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S1 (жалғасы 7)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1-8.jpg\" alt=\"Сурет S1 (жалғасы 8)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S1 (жалғасы 8)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1-9.jpg\" alt=\"Сурет S1 (жалғасы 9)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S1 (жалғасы 9)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1-10.jpg\" alt=\"Сурет S1 (жалғасы 10)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S1 (жалғасы 10)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS2.jpg\" alt=\"A.2-сурет: Бағалаулардың корреляциясы. Қайталанған өлшемдер корреляциясы; мәндер R көрсетеді; барлық p &amp;lt; 0.05 (1-экспери\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A.2-сурет: Бағалаулардың корреляциясы. Қайталанған өлшемдер корреляциясы; мәндер R көрсетеді; барлық p &amp;lt; 0.05 (1-эксперимент деректері).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS3.jpg\" alt=\"A.3-сурет: Бағалаулардың (сызықтық емес) байланысы. Стимул санақтары бойынша топтастырылған локалдық регрессия (LOWESS) \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A.3-сурет: Бағалаулардың (сызықтық емес) байланысы. Стимул санақтары бойынша топтастырылған локалдық регрессия (LOWESS) қисықтары бар шашырау диаграммалары (1-эксперимент деректері).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS4.jpg\" alt=\"A.4-сурет: Уақыт саласындағы сигналдардағы жалпы орташа физиологиялық жауаптар – 1-ші және 2-ші көрсетілім. Барлық өнер \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A.4-сурет: Уақыт саласындағы сигналдардағы жалпы орташа физиологиялық жауаптар – 1-ші және 2-ші көрсетілім. Барлық өнер туындысы сынақтары бойынша жалпы орташа жауаптар көрсетілген, сынақ шарттары бойынша бөлінген (pretitle – атауына дейінгі 1-ші көрсетілім, posttitle – атауынан кейінгі 2-ші көрсетілім, diff – 2-ші көрсетілім кезіндегі із минус 1-ші көрсетілім кезіндегі із). ЭЭГ-дегі түрлі-түсті сызықтар жеке арналарды, қара сызық жалпы орташа мәнді бейнелейді, ал төменде жаһандық өріс қуаты (GFP) орналасқан. Уақыт барысының үстінде 6 өкілді уақыт нүктесінде топографиялық графиктер орналасқан (таңдау деректерге негізделмеген). Қарашық өлшемі мен жүрек соғу жиілігінде тек 2 және 1 деректер арнасы бар, сондықтан график тазарақ.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS5.jpg\" alt=\"A.5-сурет: Кескіндерді 1-ші және 2-ші рет көрсету үшін толық декодтау нәтижелері. Уақыт бойынша декодтау жылдамдығы, маң\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A.5-сурет: Кескіндерді 1-ші және 2-ші рет көрсету үшін толық декодтау нәтижелері. Уақыт бойынша декодтау жылдамдығы, маңызды уақыт терезелері түсті астармен белгіленген (екінші деңгейдегі кластерлік ауыстырып қосу T-тестіне негізделген маңыздылық деңгейі p &amp;lt; 0.05).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS6.jpg\" alt=\"A.6-сурет: Тақырып алдындағы сигналға негізделген толық декодтау нәтижелері (кескіндерді 1-ші рет көрсету). Уақыт бойынш\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A.6-сурет: Тақырып алдындағы сигналға негізделген толық декодтау нәтижелері (кескіндерді 1-ші рет көрсету). Уақыт бойынша декодтау жылдамдығы, маңызды уақыт терезелері түсті астармен белгіленген (екінші деңгейдегі кластерлік ауыстырып қосу T-тестіне негізделген маңыздылық деңгейі p &amp;lt; 0.05).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS7.jpg\" alt=\"А.7-сурет: Кескіндерді 2-рет ұсынудан кейінгі сигнал негізіндегі толық декодтау нәтижелері: уақыт бойынша декодтау жылда\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;А.7-сурет: Кескіндерді 2-рет ұсынудан кейінгі сигнал негізіндегі толық декодтау нәтижелері: уақыт бойынша декодтау жылдамдығы, маңызды уақыт терезелері түсті астармен белгіленген (екінші деңгейлі кластерлік ауыстыру t-тесті негізіндегі маңыздылық деңгейі p &amp;lt; 0.05).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS8.jpg\" alt=\"А.8-сурет: Дифференциалдық сигнал негізіндегі толық декодтау нәтижелері (2-ші ұсыну – 1-ші ұсыну): уақыт бойынша декодта\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;А.8-сурет: Дифференциалдық сигнал негізіндегі толық декодтау нәтижелері (2-ші ұсыну – 1-ші ұсыну): уақыт бойынша декодтау жылдамдығы, маңызды уақыт терезелері түсті астармен белгіленген (екінші деңгейлі кластерлік ауыстыру t-тесті негізіндегі маңыздылық деңгейі p &amp;lt; 0.05).&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;өнерді&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қабылдау&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;динамикасы&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;белгісіз&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ээг, экг және&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;көзді бақылау&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;әдісі&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;кезеңдер үшін&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бөлек&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;маркерлер&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;табылды&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=
