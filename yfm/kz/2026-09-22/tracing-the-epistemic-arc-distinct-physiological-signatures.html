        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"136\" cy=\"85\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"544\" cy=\"242\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Миымыз түсініксіз өнерді&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;қалай ләззатқа айналдырады&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-f1.jpg\" alt=\"1-сурет: Өздерінің шынайы атаулары бар өнер туындылары «атауы жоқ» өнерге қарағанда түсіну сезімін жоғары деңгейде тудыр\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Өздерінің шынайы атаулары бар өнер туындылары «атауы жоқ» өнерге қарағанда түсіну сезімін жоғары деңгейде тудырады (алдыңғы нәтижелерді қайталау). а) Экспериментальды тізбек: қатысушылар визуалды өнер суреттерін көріп, оның атауына деген қызығушылығын бағалауды сұрады. Содан кейін өнер туындысының атауы – түпнұсқа атауы немесе ақпараттық емес жалған атау («атауы жоқ») берілді. Содан кейін олар түпнұсқа суретті қайта көріп, өздерінің аха сезімін, эстетикалық ұнатуын және бұл туындыны түсінгенін сезінген-сезінбегенін бағалауы тиіс еді. Визуалды өнер туындыларынан басқа, Муни кескіндерінің сериясы (Mooney &amp;amp; Ferguson, 1951) (кездейсоқ араластырылып) ұсынылды. Нақты немесе жалған атаудың орнына Муни суретін жасау үшін пайдаланылған негізгі фотосурет көрсетілді. б) Түсінуге деген атау әсерін қайталау, бірақ эстетикалық ұнатуға емес: скрипка диаграммалары барлық бағалаулардың таралуын (56 қатысушы арасында n=3090) әрбір стимул санаты үшін бөлек (фигуративтіліктің 3 деңгейіндегі визуалды өнер плюс Муни кескіндері), атау шарты бойынша бөлінген (нақты немесе атаусыз; барлық Муни кескіндері өзінің нақты базалық фотосуретімен бірге жүрді, мұнда атауы бар деп жіктелген). Біз өнердің барлық 3 санатында бар сезілетін түсінуге атау манипуляциясының күшті әсерін қайталадық, бірақ эстетикалық ұнату үшін маңызды айырмашылықтар болған жоқ.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Абстрактілі картинаға қарап, оның мәнін бірден түсінген кезде мида реакциялар тізбегі іске қосылады. Зерттеушілер бұл таным жолын алғашқы қызығушылықтан эстетикалық ләззатқа дейін бақылап көрді. Бұл үдерістің әр кезеңі ағзада өзіндік физиологиялық із қалдыратыны анықталды.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Қызығушылық пен түсіну біртұтас танымдық тізбек құрайды&lt;/li&gt;\n&lt;li&gt;Қарашық өлшемі картинаның мәнін ұққан сәтті көрсетеді&lt;/li&gt;\n&lt;li&gt;Эстетикалық ләззат мидың жылдам реакциясымен байланысты&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Адамның танымдық процесі көбінесе белсіздіктен кенеттен түсінуге өтуге негізделеді және бұл «аха» әсерімен сүйемелденеді. Авторлар бұл үдерістің динамикасын тіркеу үшін психологиялық сауалнамаларды электроэнцефалограмма (ЭЭГ), электрокардиограмма (ЭКГ) және көз қимылын бақылаумен біріктірді.&lt;/p&gt;\n&lt;p&gt;Тәжірибеге екі топ қатысты: мінез-құлық бөлігінде 55 адам және физиологиялық зерттеуде 49 адам. Қатысушыларға полотнолар көрсетіліп, атауына деген қызығушылығы бағаланды, содан кейін түпнұсқа немесе жасанды атау ұсынылып, түсіну мен ұнату деңгейі өлшенді.&lt;/p&gt;\n&lt;p&gt;Талдау нәтижелері түсіну сәті эстетикалық ләззатпен сызықтық, ал ұғынумен сызықтық емес түрде байланысты екенін көрсетті. Физиологиялық көрсеткіштер түсінуді ұзақ уақыттық белсенділік арқылы, аха әсерін қарашық өлшемінен, ал эстетикалық ұнатуды ЭЭГ-тің жылдам жауабынан анықтауға болатынын дәлелдеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жұмыс субъектілі бағалаулар мен таңдалған өнер туындыларына негізделген, ал себеп-салдарлық байланыстар қосымша тексеруді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Қызығушылықтан (мотивациялық күйден) түсініп кетуге (белгісіздікті азайтуға) және ләззат алуға (марапаттау және күшейту) дейінгі ішкі күйлер тізбегі мотивацияланған оқытудың іргелі жолын білдіруі мүмкін. Бұл жұмыста біз осы эпистемиялық доғаның контурларын көрсету және оның нейрондық корреляттарын қадағалау үшін қызығушылықты, түсіну сәтін («аха» эффектісі), ұғынуды және ұнатуды өлшеуді біріктіретін тәсілді ұсынамыз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу қызығушылықтан ләззатқа дейінгі эпистемиялық доғаны сипаттайды және оның мінез-құлық пен нейрофизиологиялық корреляттарын ашады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Алдын ала тіркелген екі экспериментте біз «тақырып әсерін» қолдандық — қосымша семантикалық ақпарат өнер туындысын қалай түсінуге және ләззат алуға әсер ете алатынын көрсететін құбылыс. Қатысушылар картиналарды қарап шығып, тақырыпты көруге деген қызығушылығын бағалады. Содан кейін оларға түпнұсқа атау немесе қосымша ақпараттан мақрұн жалған атау көрсетілді, одан кейін сурет қайта көрсетілді және қатысушылар «аха» әсерінің күшін, эстетикалық ләззатты және туындыны түсіну сезімін бағалады.&lt;/p&gt;\n&lt;p&gt;Мінез-құлық зерттеуінде (n = 55 қатысушы) біз атаулары бар визуалды өнердің «аха» сезімін тудыра алатынын эмпирикалық түрде анықтадық. Бағалаулар арасындағы байланыс күрделі және стимулдардағы ақпараттың түрі мен мөлшеріне байланысты қалыптасады; мысалы, «аха» сезімі ұнатумен сызықтық, ал түсінумен сызықтық емес түрде байланысқан. ЭЭГ, ЭКГ және көз қозғалысын қадағалауды қолданған зерттеуде (n = 49 қатысушы) ақпаратты өңдеу тізбегін қадағалау үшін уақыт бойынша шешілетін декодтау пайдаланылды. Түсіну процесін ұзақ уақыт аралығында әртүрлі (нейро)физиологиялық корреляттар арқылы декодтауға болады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ЭЭГ (электроэнцефалография) — бас сүйегінің сыртынан мидың электрлік белсенділігін жазып алуға мүмкіндік беретін әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тақырыптарға дейін де, олардан кейін де қызығушылықты сенімді түрде декодтау оның эпистемиялық доға шеңберіндегі маңыздылығын растайды. «Аха» әсерін қарашық өлшемі бойынша декодтауға болды, бірақ ЭЭГ деректерінен анықталған жоқ. Соңында, жылдам бастапқы ЭЭГ жауабы эстетикалық ұнатумен байланысты болды. Зерттейтін дүниелер әлі де көп болғанымен, біздің жұмысымыз мотивацияланған ақпарат іздеудің негізгі мінез-құлық және физиологиялық қасиеттеріне жаңа көзқарас береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер салыстырмалы түрде шағын қатысушылар санына (n = 55 және n = 49) негізделген, бұл қорытындыларды жалпылауда сақтықты талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Түйінді сөздер: MVPA декодтау · таным · ақпаратты өңдеу · түсіну сәті · визуалды эстетика · ЭЭГ · мультимодальды деректер&lt;/p&gt;\n&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Біз үнемі жаңа, әлеуетті екіұшты стимулдарға тап боламыз, және осы келіп түсетін ақпаратты түсінуге тырысу (яғни үйлесімді, мағыналы көріністерді қалыптастыру) адам танымының негізі болып табылады. Көбінесе мағынаны түсіну инсайтты қамтиды — бұл түсініктегі кенеттен секіріс, мысалы, бұрын шешілмеген мәселенің шешімі анық болған кезде немесе жаңа ақпарат жақсырақ түсінуге мүмкіндік берген кезде (Sternberg &amp;amp; Davidson, 1995). Жарқын мысалдарды визуалды саладан табуға болады, онда біздің екіұшты стимулды қабылдауымыз кенеттен өзгеріп, құрылымды көруге мүмкіндік береді (нашарлаған екі түсті «Муни» суреттері сияқты; Mooney &amp;amp; Ferguson, 1951). Инсайтты белсіздіктің жылдам төмендеуі немесе ақпараттың артуы ретінде сипаттауға болады. Соңғы жұмыстар инсайтты қызығушылықтың алдыңғы күйімен байланыстырды (Van de Cruys et al., 2021): қызығушылық қаншалықты көп болса, «аха» эффектісі соғұрлым үлкен болады — бұл инсайтпен бірге жүретін феноменальды сезімнің өлшемі. Бұл нәтиже инсайтты мотивациялық шеңберге орналастыру үшін қолданылуы мүмкін: қызығушылық — белсіздікті азайтуға арналған ынталандыру күйі, жақсартылған түсінік — қажетті нәтиже, ал инсайт (немесе «аха») белсіздікті әсіресе тиімді азайту сәттерін белгілейді. Өз нәтижелеріне сүйене отырып, Van de Cruys et al. (2021) «аха» оқыту тиімділігін оңтайландыруға және шектеулі когнитивтік ресурстарды шешілетін тапсырмаларға бөлуге көмектесетін метакогнитивті кері байланыс сигналы ретінде әрекет етуі мүмкін деген болжам жасайды (сондай-ақ қараңыз: Laukkonen et al., 2023). Егер инсайт мотивациялық каскадты тудырса, ол марапаттау процестерін қосымша қамтып, ләззатпен байланысты болуы тиіс — «түсінуден ләззат алу» (Vessel, n.d.). Шынында да, кейбір зерттеулер «аха» жағымды сезіле алатынын (Skaar &amp;amp; Reber, 2020; Shen et al., 2016) және марапаттау жүйесімен байланысты екендігінің эмпирикалық дәлелдерін ұсынады (Cristofori et al., 2018; Oh et al., 2020). Біз бұл процестер тізбегі, қызығушылықтан инсайтқа, ләззат пен марапатқа дейін, ынталандырылған оқыту үшін іргелі жолды білдіруі мүмкін деп болжаймыз — бұл «эпистемикалық доға» деп аталады (Van de Cruys et al., 2024).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Инсайт метакогнитивті кері байланыс сигналы ретінде әрекет етіп, қызығушылықты түсіну ләззатына айналдырады және ынталандырылған оқытудың іргелі «эпистемикалық доғасын» қалыптастырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мұнда біз күрделі натуралистикалық стимулдардан мағына жасауды зерттеу үшін парадигманы ұсынамыз. Біз жаңа ақпаратты басқарылатын жеткізуді (стимулдарымыз арқылы) қызығушылық, инсайт («аха»), түсіну және ұнату өлшемдерімен біріктіреміз, бұл эпистемикалық доғаның контурын анықтауға және олардың уақытша тізбегі мен нейрондық механизмдерін зерттеуге мүмкіндік береді. Van de Cruys et al. (2021) визуалды судағы перцептивті түсінудің салыстырмалы түрде төмен деңгейдегі тапсырмасы — атап айтқанда Муни суреттері (Mooney &amp;amp; Ferguson, 1951) арқылы инсайт пен ақпаратты өңдеуді зерттеді, олар бастапқыда түсіндіру қиын, бірақ түпнұсқа фотосуретті көргеннен кейін оңай түсіндірілетін фотосуреттерден алынған ақ-қара екі түсті суреттер болып табылады. Бұл әдіс өте тиімді болғанымен, ұқсас механизмдер когнитивті иерархияның жоғары деңгейлерінде де жұмыс істей алатыны анық. Мысалы, инсайт әртүрлі сенсорлық модальділіктерден ақпаратты біріктіру арқылы (мысалы, жаңалықтарды көру кезінде визуалды кіріс пен тілдік белгілерді біріктіру) немесе жаңа стимулдарды алдыңғы біліммен немесе жеке естеліктермен контекстуализациялау арқылы қол жеткізілуі мүмкін. Бұл зерттеуде біз визуалды өнерді қолданамыз және «атау эффектісі» деп аталатын құбылысты қолданамыз — бұл өнер туындысын толықтыратын мәтіндік, семантикалық ақпарат (мысалы, тек атаулар ғана емес) бақылаушының визуалды өнер туындысын қалай түсінетініне, түсіндіретініне немесе бағалайтынына әсер етуі мүмкін. Муни суреттері үшін белгілі бір суретпен «аха» күші кейінгі эстетикалық ұнату рейтингтерін де болжайтыны көрсетілген (Muth &amp;amp; Carbon, 2013ဒ). Біз бұл әсер визуалды өнерге де таралады деп күтеміз. Шын мәнінде, инсайт көптеген адамдар өнерден ләззат алу арқылы ала алатын таңдану немесе әсерлену сезімдеріне ықпал ететін негізгі фактор болуы мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эпистемикалық доға — бұл адамның қызығушылық пен белсіздік күйінен жарық көру арқылы сәтті танымның ләззатына жету жолын сипаттайтын теориялық тұжырымдама.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"atau-effekti-estetikalykh-tuesinu-zhaghdajy-ma\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#atau-effekti-estetikalykh-tuesinu-zhaghdajy-ma\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;«Атау эффекті» — эстетикалық түсіну жағдайы ма?&lt;/span&gt;&lt;/a&gt;«Атау эффекті» — эстетикалық түсіну жағдайы ма?&lt;/h4&gt;\n&lt;p&gt;Бірнеше психологиялық зерттеулер көрнекі өнерді бағалауға атаулардың әсерін зерттеді. Біз тапқан барлық зерттеулер қолданылған атау манипуляциясының бір немесе бірнеше тәуелді айнымалыларға айтарлықтай әсер еткенін хабарлағанымен, нәтижелер толықтай бірмәнді емес. Туындыны түсіну немесе оның мәнін сезіну бағалары бойынша ең анық көрініс байқалады: 6 зерттеудегі барлығы 10 эксперимент атау манипуляциясының айтарлықтай әсерін анықтады, ал 2 зерттеудегі тек 2 экспериментте бұл байқалмады. Дегенмен, жалпы маңызды емес нәтижелер туралы хабарлаған зерттеулердің өзінде атауы бар және атауы жоқ жағдайлар арасында айырмашылықтар болды (Russell, 2003, Exp. 1; Bubić et al., 2017). Жиынтыğында, бұл зерттеулер мәтін түрінде берілген қосымша семантикалық ақпарат бақылаушының картиналарды субъектілі түсінуін өзгертетініне сенімді дәлелдер ұсынады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Алты зерттеудегі он эксперимент атаулардың картиналарды түсінуді өзгертетінін растайды, ал эстетикалық артықшылықтарға әсері атау түрі мен өнер жанрына байланысты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эстетикалық артықшылықтарды бағалауды (мысалы, ұнату, әсерлену және т. б.) қарастырған кезде, нәтижелер онша айқын емес: бірнеше зерттеулер атауы бар өнер туындылары үшін атауы жоқтарға қарағанда едәуір жоғары бағалар туралы хабарлады. Алайда, көп жағдайда бұл әсерлер тек белгілі бір атау түрлері үшін пайда болды: сипаттамалық немесе кездейсоқ емес, түсіндірмелі атаулар үшін; семантикалық байланысқан, бірақ байланыспаған атаулар үшін; немесе туындының нақты тақырыбын көрсететін ойдан шығарылған атаулар үшін, ал түпнұсқа атаулар немесе бұл тұжырымдаманы төмендететін атаулар үшін емес. Сонымен қатар, өнер туындысының санаты да маңызды болуы мүмкін: бір зерттеуде сәйкес келетін және сәйкес келмейтін атаулар арасындағы айырмашылық тек абстрактілі өнер үшін айқын байқалды, ал жартылай абстрактілі немесе фигуративті өнер үшін байқалмады, ал басқа зерттеулердің көпшілігі өте біркелкі стимул жиынтықтарымен шектелді және сондықтан бұл мәселені анықтауға көмектесе алмады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эстетикалық түсіну (aesthetic aha) — бұл ғылыми жаңалыққа ұқсас өнер туындысының мәнін бір сәтте түсініп, айқындау сезімі, ол оның эмоционалды бағасын арттырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дегенмен, бірнеше басқа зерттеулер өте ұқсас жағдайларда нөлдік нәтижелер туралы хабарлады: атауды атаусызбен, сипаттамалық атауларды егжей-тегжейлі атаулармен, сәйкес келетін атауларды сәйкес келмейтіндермен немесе тек атауларды ұзағырақ мәтіндік сипаттамалармен салыстырған кезде. Бұл зерттеулердің ешқайсысы түсіну немесе инсайт бағаларын жинамағанымен — бұл әсер ағымдағы зерттеуде анықталуы тиіс — алдыңғы жұмыстар төмен деңгейдегі перцептивтік ашулар үшін инсайт пен эстетикалық ұнату арасындағы байланысты ұсынды: Муни суреттерімен алынған түсіну күші эстетикалық артықшылық бағаларын оң болжады, мұны Мут пен Карбон (Muth and Carbon, 2013) «эстетикалық түсіну эффектісі» деп атады.&lt;/p&gt;\n&lt;h4 id=\"epistemiyalykh-doghany-insajt-pen-estetikalykh-artykh-koeruding-fiziologiyalykh-korrelyattarymen-bajlanystyru\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#epistemiyalykh-doghany-insajt-pen-estetikalykh-artykh-koeruding-fiziologiyalykh-korrelyattarymen-bajlanystyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эпистемиялық доғаны инсайт пен эстетикалық артық көрудің физиологиялық корреляттарымен байланыстыру&lt;/span&gt;&lt;/a&gt;Эпистемиялық доғаны инсайт пен эстетикалық артық көрудің физиологиялық корреляттарымен байланыстыру&lt;/h4&gt;\n&lt;p&gt;Болжамды эпистемиялық доғаның тізбегін қадағалау үшін біз оның компоненттері мен олардың уақытша бейінін бақылауға тырысамыз. Ол үшін біз қатысушылардың жауаптарымен бірге мультимодальды (нейро)физиологиялық деректерді жазып аламыз және талдаймыз. Бірнеше зерттеулер сәйкесінше инсайттың немесе эстетикалық артық көрудің нейрофизиологиялық корреляттарын анықтауға тырысты. Инсайт нейробиологиясы бойынша бұрынғы зерттеулер жиі жартышарлық айырмашылықтарға бағытталған еді, бұл гипотеза әлеуетті сәйкес ми аймақтарындағы нейроанатомиялық және цитоархитектоникалық асимметриялар жиынтығымен үйлесімді (әсіресе тілді өңдеу контекстінде; шолу үшін Kounios &amp;amp; Beeman, 2014 қараңыз). Алайда, инсайт туралы ЭЭГ әдебиеттері шағын және салыстырмалы түрде тұрақты нәтижелерді көрсетеді — атап айтқанда, қашықтағы ассоциация тапсырмалары (Jung-Beeman et al., 2004; Sandkühler &amp;amp; Bhattacharya, 2008), вербалық жұмбақтар (Sheth et al., 2009) немесе анаграмманы шешу тапсырмалары (Oh et al., 2020) сияқты әртүрлі мәтіндік тапсырмаларда сыналушылардың өздері хабарлаған инсайт сәттеріне дейін болатын гамма-диапазондағы белсенділік жарқылдары.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Инсайт пен эстетика бойынша ЭЭГ зерттеулері түсіну сәті немесе бағалау алдында гамма- және альфа-диапазондардағы тұрақты өзгерістерді тіркейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Гамма-диапазондағы белсенділікке қосымша, бұл зерттеулерде альфа-қуаттың артуы (Jung-Beeman et al., 2004; Sandkühler &amp;amp; Bhattacharya, 2008, екеуі де қашықтағы ассоциация тапсырмаларын пайдаланған) және шешім табуға дейін бета-белсенділіктің артуы (Oh et al., 2020) немесе азаюы (Sheth et al., 2009) сирек тұрақтылықпен хабарланды. Бұл белсенділік үлгілері эстетикалық артық көруге арналған шағын жиіліктік М/ЭЭГ әдебиеттерінде хабарланғандарға жалпы ұқсайды. Зерттеулер барлық каноникалық жиілік диапазондырында, бірақ ең тұрақты түрде гамма (Lopez-Persem et al., 2020; Cela-Conde et al., 2004; Munar, Nadal, Rosselló, et al., 2012; Munar, Nadal, Castellanos, et al., 2012; Strijbosch et al., 2021) және альфа диапазондында маңызды әсерлерді хабарлады (Munar, Nadal, Castellanos, et al., 2012; Kang et al., 2015; Strijbosch et al., 2021).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оқиғамен байланысты потенциалдар (ERP) — бұл ақпаратты өңдеу кезеңдерін көрсететін, белгілі бір стимулға жауап ретінде ЭЭГ көмегімен тіркелген мидың электрлік белсенділігінің өзгерістері.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сонымен қатар, альфа қуатындағы жартышарлық айырмашылықтар (фронтальды альфа асимметриясы) нейроэстетикалық зерттеулердің ерекше нысаны болды (Babiloni et al., 2013; Moon et al., 2013; Cheung et al., 2019), ал кейбір зерттеулер тіпті мінез-құлықтық бағалаулар арқылы қосымша тексерусіз эстетикалық артық көрудің прокси-көрсеткіші ретінде ЭЭГ асимметрия индексін пайдаланды (Babiloni et al., 2015; Lee et al., 2017). Оқиғамен байланысты потенциалдар (ERP) да эстетикалық артық көру контекстінде зерттелген. Әртүрлі жақсы зерттелген ERP компоненттеріне, соның ішінде артқы P2 (Righi et al., 2017; Noguchi &amp;amp; Murota, 2013), алдыңғы P2 (Righi et al., 2017; Ma et al., 2015; Jiang &amp;amp; Cai, 2013; Wang et al., 2012), N2 (Bölte et al., 2017; Righi et al., 2017; Ma et al., 2015; de Tommaso et al., 2008; Oliver-Rodríguez et al., 1999; Carbon et al., 2018; Augustin et al., 2011), P3 (Bölte et al., 2017; Righi et al., 2017; Ma et al., 2015; de Tommaso et al., 2008; Oliver-Rodríguez et al., 1999) және азырақ тұрақтылықпен P1 (Righi et al., 2017; Bölte et al., 2017) пен LPP (Marzi &amp;amp; Viggiano, 2010; Werheid et al., 2007; Schacht et al., 2008) бойынша әсерлер хабарланған.&lt;/p&gt;\n&lt;p&gt;Бұрынғы зерттеуде біз өте кеш латентті потенциалдардағы айырмашылықтар туралы хабарладық (стимул пайда болғаннан кейін 3-5 с өткен соң; Strijbosch et al., 2021), алайда біз бұрын тізімделген ERP нәтижелерінің ешқайсысын қайталай алмадық. Ұсынылған ЭЭГ нәтижелері толықтай түпкілікті болмаса да, олар соған қарамастан артық көруге қатысты ақпаратты инвазивті емес бас терісі ЭЭГ-сінен қалпына келтіруге болатынын көрсетеді. Көз қозғалысын бақылау және электрокардиография (ЭКГ) сияқты қосымша физиологиялық деректер модальдықтары да қызықты үміткерлер болып табылады: жүрек соғу жиілігі эстетикалық бағалаумен байланыстырылды (Tschacher et al., 2012), қарашық өлшемі «аха» тәжірибелерінің әлеуетті индикаторы (Salvi et al., 2020) және музыка тыңдау кезіндегі таңдану ретінде зерттелді (Liao et al., 2018), ал көздің қарау үлгілері эмпирикалық эстетикадағы қызықты мінез-құлық ретінде зерттелді (қарау үлгілеріне/іздеу мінез-құлқына әлеуетті атау әсерлерімен; Bubić et al., 2017; Kapoula et al., 2009; Temme, 1992; Hristova et al., 2011). Физиологиялық деректердің бұл түрлерінің барлығы осы зерттеуде қолданылған көп өлшемді декодтау тәсіліне сәйкес келеді.&lt;/p&gt;\n&lt;h4 id=\"khazirgi-zertteu\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#khazirgi-zertteu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қазіргі зерттеу&lt;/span&gt;&lt;/a&gt;Қазіргі зерттеу&lt;/h4&gt;\n&lt;p&gt;Біз Ван де Крюйс пен басқалардың (Vande Cruys et al., 2021) парадигмасының кеңейтілген нұсқасын әзірлеп, оны алдын ала тіркелген екі экспериментте қолдандық: бірінші таза мінез-құлық тапсырмасында қатысушыларға визуалды өнер туындысы көрсетіліп, оның атауына қаншалықты қызығушылық танытқанын бағалау сұралды. Бұдан кейін жұмыстың түпнұсқа атауы немесе туынды «атауы жоқ» деген тұжырым берілді (нақты немесе қолдан жасалған атау шарты кездейсоқ тағайындалып, қатысушылар арасында толық теңгерілді). Содан кейін қатысушылар өнер туындысын қайта көріп, өздерінің «аҳа» сезімін, эстетикалық ләззатын және туындыны қаншалықты түсінгенін бағалады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;«Аҳа» сезімі (aha experience) — бұл белгісіздік жойылғанда немесе жасырын мағына түсінілгенде пайда болатын кенеттен түсіну немесе инсайт күйі.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл бізге «аҳа» және мағына қалыптастыру туралы бұрынғы нәтижелердің жаңа ынталандыру санатында (өнер) қайталанатынын тексеруге, сондай-ақ әдетте бөлек зерттелетін әртүрлі бағалау процестерін функционалды түрде байланыстыруға мүмкіндік берді. Біз сәйкес атаулары бар әртүрлі өнер туындыларының стимулдарын жинадық: стимулдар өнер туындысының визуалды абстракция дәрежесіне (көркемдік стиль: фигуративті, жартылай абстрактілі немесе абстрактілі) және атаулардың ақпараттық мазмұнына (атау стилі: жаңа ақпарат қоспайтын таза сипаттамалық атаулар, бейнеленген мазмұнды түсінуге көмектесетін түсіндірмелі атаулар немесе жаңа, алыс ұғымдармен байланыс жасайтын эвокативті атаулар) байланысты ерекшеленді.&lt;/p&gt;\n&lt;p&gt;Бұл мағына қалыптастыру мен артықшылықтарға осы факторлардың әсерлері мен өзара әрекеттесуін егжей-тегжейлі зерттеуге мүмкіндік берді. Біз сондай-ақ визуалды өнер мен олардың атаулары тудыратын «аҳа» сезімінің күшін перцептивті ауысулардан туындаған «аҳа» сезімімен салыстыру үшін Муни (Mooney) суреттерін қостық. Атап айтқанда, біз келесі гипотезаларды алдын ала тіркедік: қосымша ақпарат жағдайында («атауы жоқ» өнерге қарағанда шынайы атауы бар өнер немесе Муни суреті) «аҳа» тәжірибесі күшейеді; қызығушылық бағалаулары «аҳа» тәжірибесінің күшін болжайды; «аҳа» бағалаулары эстетикалық артықшылық бағалауларын болжайды; шынайы атаулары бар өнер туындылары атауы жоқ стимулдарға қарағанда жоғары эстетикалық бағалар алады; шынайы атаулары бар өнер туындылары атауы жоқ стимулдарға қарағанда жоғары түсіну бағаларын алады; кем дегенде түсіну бағасы үшін абстракция дәрежесімен өзара әрекеттесу болады.&lt;/p&gt;\n&lt;p&gt;Екінші экспериментте біз сыйақыны өңдеудің физиологиялық корреляттары мен уақытша тізбегін зерттеуді мақсат еттік, сондықтан мінез-құлық бағалауларынан басқа қатысушылардың ЭЭГ, пупиллометрия және ЭКГ көрсеткіштерін тіркедік. ЭЭГ (уақыт және жиілік домендерінде), қарашықтың кеңейюі және лездік жүрек соғу жиілігі бағалауға қатысты ақпараттың тиісті жазбаларда көрсетілгенін және қашан көрсетілгенін көрсетуге арналған уақыт бойынша шешілген декодтау тәсілі арқылы талданды (Гвиллиамс пен Кинг (Gwilliams &amp;amp; King, 2020) бойынша, әдістерді қараңыз).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Мінез-құлық бағалаулары, ЭЭГ, пупиллометрия және ЭКГ көмегімен алдын ала тіркелген екі экспериментте авторлар атаулар мен абстракция дәрежесінің инсайтқа, түсінуге және эстетикалық артықшылықтарға әсерін бағалайды.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эксперименттің бұл бөлігі көбірек зерттеу сипатында болды және біз бұрынғы жұмыстарға негізделген бірнеше жалпы гипотезаларды ғана алдын ала тіркедік: біз гамма диапазонында инсайтқа қатысты белсенділікті табамыз; эстетикалық артықшылық пен гамма диапазонының қуаты арасында оң сызықтық байланыс болады; альфа қуаты мен эстетикалық артықшылық арасында сызықтық емес байланыс болады.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"1-taezhiribe-khyzyghushylykh,-insajt,-estetikalykh-talgham-zhaene-tuesinu-bojynsha-minez-khulykh-rejtingteri\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#1-taezhiribe-khyzyghushylykh,-insajt,-estetikalykh-talgham-zhaene-tuesinu-bojynsha-minez-khulykh-rejtingteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1-тәжірибе – Қызығушылық, инсайт, эстетикалық талғам және түсіну бойынша мінез-құлық рейтингтері&lt;/span&gt;&lt;/a&gt;1-тәжірибе – Қызығушылық, инсайт, эстетикалық талғам және түсіну бойынша мінез-құлық рейтингтері&lt;/h4&gt;\n&lt;p&gt;Стимулдар жиынтығы әртүрлі өнер стильдерінен (абстрактілі, жартылай абстрактілі немесе фигуративті өнер) және тақырып стильдерінен (сипаттамалық, түсіндірмелі, ассоциативті тақырыптар) тең мөлшердегі сынақтарды қамтитындай етіп әзірленді. Тақырып шартын (нақты немесе ақпараттық емес жалған тақырып) және Муни кескіндерінің қарама-қарсы санатын өзгерту арқылы бұл қатысушыға берілетін ақпараттың түрі мен көлемі бойынша әртүрлі рейтингтерді салыстыратын көптеген талдаулар жүргізуге мүмкіндік береді. Төменде тексерілген гипотезалардың көпшілігі алдын ала тіркелген (https://doi.org/10.17605/OSF.IO/PAGVH) және қосымша ізденіс талдаулары солай деп нақты белгіленген. Барлық есеп берілген сызықтық аралас модельдердің (LMM) толық мәліметтерін Сурет SN-нен табуға болады.&lt;/p&gt;\n&lt;h4 id=\"akhparattykh-takhyryptar-aga-effektini-zhaene-sezilgen-tuesinikti-arttyrady,-birakh-estetikalykh-tartymdylykhty-emes\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#akhparattykh-takhyryptar-aga-effektini-zhaene-sezilgen-tuesinikti-arttyrady,-birakh-estetikalykh-tartymdylykhty-emes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ақпараттық тақырыптар «ага-эффектіні» және сезілген түсінікті арттырады, бірақ эстетикалық тартымдылықты емес&lt;/span&gt;&lt;/a&gt;Ақпараттық тақырыптар «ага-эффектіні» және сезілген түсінікті арттырады, бірақ эстетикалық тартымдылықты емес&lt;/h4&gt;\n&lt;p&gt;Біз алдымен әртүрлі мінез-құлық рейтингтерінде «тақырып әсерінің» бар-жоғын (яғни, мағыналы тақырыптары бар сынақтар мен «тақырыпсыз» сынақтар арасындағы рейтинг айырмашылықтарын) тексердік. Ол үшін біз үш алдын ала тіркелген LMM-ді (1–3-теңдеулер) қолдандық. Бұл талдауда тек өнер стимулдары бар сынақтар пайдаланылды, Муни кескіндері ескерілмеді. Дегенмен, салыстыру үшін суреттерде Муни кескіндері бойынша да деректер енгізілген. Біз өз гипотезамызды растауға және қабылданған түсінікке тақырыптың оң әсері туралы алдыңғы нәтижелерді қайталауға қол жеткіздік, бірақ эстетикалық рейтингтерге емес (Сурет 1b; стимулдарды өнер стилі, яғни абстракция дәрежесі бойынша бөлу). Сезілген түсінікке тақырып әсері айтарлықтай болды (көлбеу = 11,06, CI = [8,11; 14,02], p &amp;lt; 0,001; бұл көлбеу тақырыптармен орташа түсіну рейтингі 0–100 балдық шкала бойынша тақырыпсызға қарағанда 11,06 балға жоғары екенін көрсетеді). Ықтималдық қатынасы тесті айтарлықтай болды (χ2[5] = 173,88, p &amp;lt; 0,001). Эстетикалық рейтингке тақырып әсері болса, тек шекаралық болды (көлбеу = 1,69, CI = [−0,16; 3,53], p = 0,073) және ықтималдық қатынасы тесті айтарлықтай емес болды (χ2[5] = 6,53, p = 0,258), осылайша біздің алдын ала тіркелген гипотезамыз жоққа шығарылды. Біз мұның өнер немесе тақырып стильдерінің ешқайсысында өзгешеленетіні туралы ешқандай белгі көрмедік (мысалы, Сурет 1b-ге қараңыз). Бұрын зерттелген осы тақырып әсерлерін қайта қараудан бөлек, біз мағыналы тақырыптар «ага-эффект» рейтингтерін де арттыратыны туралы алдын ала тіркелген жаңа гипотезамызды растадық (Сурет 2a-ға қараңыз). Тақырыптардың «ага»-ға әсері түсіну рейтингтеріне қарағанда күштірек болды (көлбеу = 17,89, CI = [13,80; 21,97], p &amp;lt; 0,001) және ықтималдық қатынасы тесті айтарлықтай болды (χ2[5] = 564,95, p &amp;lt; 0,001). Маңыздысы, тақырып манипуляциясының «ага-эффект» рейтингтеріне әсері стимулдар бойынша күрт өзгерді, олардың кейбіреулері тіпті нақты тақырыппен жалған тақырыптарға қарағанда төменірек «ага» рейтингтерін алды (Сурет SN-ге қараңыз).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-f1.jpg\" alt=\"1-сурет: Өздерінің шынайы атаулары бар өнер туындылары «атауы жоқ» өнерге қарағанда түсіну сезімін жоғары деңгейде тудыр\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Өздерінің шынайы атаулары бар өнер туындылары «атауы жоқ» өнерге қарағанда түсіну сезімін жоғары деңгейде тудырады (алдыңғы нәтижелерді қайталау). а) Экспериментальды тізбек: қатысушылар визуалды өнер суреттерін көріп, оның атауына деген қызығушылығын бағалауды сұрады. Содан кейін өнер туындысының атауы – түпнұсқа атауы немесе ақпараттық емес жалған атау («атауы жоқ») берілді. Содан кейін олар түпнұсқа суретті қайта көріп, өздерінің аха сезімін, эстетикалық ұнатуын және бұл туындыны түсінгенін сезінген-сезінбегенін бағалауы тиіс еді. Визуалды өнер туындыларынан басқа, Муни кескіндерінің сериясы (Mooney &amp;amp; Ferguson, 1951) (кездейсоқ араластырылып) ұсынылды. Нақты немесе жалған атаудың орнына Муни суретін жасау үшін пайдаланылған негізгі фотосурет көрсетілді. б) Түсінуге деген атау әсерін қайталау, бірақ эстетикалық ұнатуға емес: скрипка диаграммалары барлық бағалаулардың таралуын (56 қатысушы арасында n=3090) әрбір стимул санаты үшін бөлек (фигуративтіліктің 3 деңгейіндегі визуалды өнер плюс Муни кескіндері), атау шарты бойынша бөлінген (нақты немесе атаусыз; барлық Муни кескіндері өзінің нақты базалық фотосуретімен бірге жүрді, мұнда атауы бар деп жіктелген). Біз өнердің барлық 3 санатында бар сезілетін түсінуге атау манипуляциясының күшті әсерін қайталадық, бірақ эстетикалық ұнату үшін маңызды айырмашылықтар болған жоқ.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-f2.jpg\" alt=\"2-сурет: Визуалды өнер көмегімен инсайтты тудыру үшін атау әсерін пайдалану. а) Сезілетін ахаға атау әсерін орнату: атау\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: Визуалды өнер көмегімен инсайтты тудыру үшін атау әсерін пайдалану. а) Сезілетін ахаға атау әсерін орнату: атау манипуляциясы қатысушылардың аха сезіміне қатты әсер етті (өнердің барлық 3 санатында бар); бұл әсер тіпті сезілетін түсінуге қарағанда үлкенірек болды. б) Қызығушылық пен инсайт арасындағы байланыс шешім белгілерінің ақпараттық мазмұнымен әрекеттеседі: біз Муни кескіндері үшін қызығушылық пен аха арасындағы күшті сызықтық байланысты қайталадық (қызғылт сары LOWESS қисығы; бұрын Van de Cruys et al., 2021 хабарлаған) және түсіндірме атаулары бар өнер туындылары үшін ұқсас, бірақ сәл әлсіздеу байланысты көрдік (яғни, өнер туындысында не бейнеленгені туралы анықсыздық қалдырмайтын атаулар; ең қараңғы LOWESS қисығы). Алайда, аз немесе айқын қосымша ақпарат бермейтін атаулар үшін байланыс әлсірей түсті (мысалы, суретте не бейнеленгенін сөзбен сипаттайтын сипаттамалық атаулар және ешқандай семантикалық ақпарат қоспайтын «атауы жоқ» жалған атаулар; ақшыл сұр LOWESS қисығы). Визуалды суретте оңай бейнеленмеген жаңадан енгізілген тұжырымдамаға сілтеме жасайтын эвокативті атаулар (қою сұр LOWESS қисығы) басқа атау шарттарымен салыстырғанда төмен қызығушылық сынақтарында жоғары аха рейтингтері бар әлсіздеу сызықтық қатынасты көрсетті. LOWESS қисықтары стимул санатымен ішінара сызықтық емес әрекеттесулерді болжағанымен, сызықтық мүшелері бар LMM мен қосылған квадраттық мүшелері бар LMM-нің ықтималдық қатынасы бұл бақылауды статистикалық тұрғыдан қолдамады. в) Аха мен эстетикалық ұнату арасындағы оң байланыс: барлық стимул санаттарында оң сызықтық қатынас болды. Бұрын хабарланғандай, орташа эстетикалық ұнату фигуративті өнер үшін ең жоғары болды (көк LOWESS қисығы). Муни кескіндерінде (қызғылт сары LOWESS қисығы) ең төменгі орташа эстетикалық рейтингтер болды. г) Аха мен түсіну арасындағы байланыс стимул санатымен сызықтық емес түрде әрекеттеседі: абстрактілі өнер үшін (жасыл LOWESS қисығы) аха мен түсіну рейтингтері арасында сызықтық байланыс болды. Фигуративті өнер (көк LOWESS қисығы), екінші жағынан, өте төмен және өте жоғары аха сынақтары үшін жоғары түсінумен айтарлықтай сызықтық емес U-тәрізді қатынасты көрсетті. Жартылай абстрактілі өнер (сары LOWESS қисығы) аралық үлгіні көрсетті. Муни кескіндері (қызғылт сары LOWESS қисығы) де U-тәрізді қатынасты көрсетті, бірақ орташа есеппен фигуративті өнерге қарағанда түсіну рейтингтері төмен болды. Сызықтық мүшелері бар LMM мен қосылған квадраттық мүшелері бар LMM-нің ықтималдық қатынасы бұл LOWESS қисықтары ұсынған сызықтық емес әрекеттесу әсерлері барлық өнер стилі x атау стилі комбинациялары үшін маңызды болғанын растайды.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тақырыптар субъективті түсінікті (көлбеу 11,06) және «ага-эффектіні» (көлбеу 17,89) айтарлықтай арттырады, бірақ эстетикалық бағалауларға әсер етпейді.&lt;br /&gt;\n[!tip] «Ага-эффект» (aha rating) — бұл когнитивті белгісіздік шешілгенде кенеттен пайда болатын түсіну немесе жаңалық ашу сезімі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"koeptegen-oener-tuyndylary-ueshin-zhoghary-unatu,-birakh-muni-keskinderine-kharaghanda-toemenirek-aga-effekt\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#koeptegen-oener-tuyndylary-ueshin-zhoghary-unatu,-birakh-muni-keskinderine-kharaghanda-toemenirek-aga-effekt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Көптеген өнер туындылары үшін жоғары ұнату, бірақ Муни кескіндеріне қарағанда төменірек «ага-эффект»&lt;/span&gt;&lt;/a&gt;Көптеген өнер туындылары үшін жоғары ұнату, бірақ Муни кескіндеріне қарағанда төменірек «ага-эффект»&lt;/h4&gt;\n&lt;p&gt;Біз визуалды өнер Муни кескіндеріне қарағанда жоғарырақ ұнату рейтингтерін алатыны туралы алдын ала тіркелген гипотезамызды ішінара растадық (Сурет 1b-ге де қараңыз). Біздің LMM кескін санатының жалпы әсерін (абстрактілі, жартылай абстрактілі немесе фигуративті өнер, тақырыпты және тақырыпсыз, немесе Муни кескіндері; 4-теңдеу) Муни кескіндері базалық сызық ретінде (intercept = 50,87, CI = [46,19; 55,56], p &amp;lt; 0,001) сынап көрді. Фигуративті өнер (көлбеу = 10,62, CI = [5,65; 15,59], p &amp;lt; 0,001) және жартылай абстрактілі өнер (көлбеу = 5,58, CI = [0,61; 10,55], p = 0,028) Муни кескіндеріне қарағанда айтарлықтай жоғарырақ ұнату рейтингтерін алды, бірақ абстрактілі өнер емес (көлбеу = 1,68, CI = [−3,29; 6,65], p = 0,507). Модель үшін ықтималдық қатынасы тесті айтарлықтай болды (χ2[3] = 24,26, p &amp;lt; 0,001).&lt;/p&gt;\n&lt;p&gt;Біз Муни кескіндері орташа есеппен визуалды өнерге қарағанда жоғарырақ «ага-эффект» тудыратыны туралы гипотезаны алдын ала тіркеген едік. Осы критерий үшін біз Муни кескіндері сынақтары және барлық тақырыпты өнер сынақтарынан (тақырыпсыз жағдайдағы өнер стимулдары бар сынақтарды есепке алмағанда) «ага» рейтингтері бойынша LMM (5-теңдеу) сәйкестендірдік. Муни кескіндері қайтадан базалық сызық ретінде белгіленді (intercept = 71,27, CI = [66,20; 76,33], p &amp;lt; 0,001). Күтілгендей, біз барлық басқа санаттар үшін төменірек «ага» рейтингтерін бақыладық және айырмашылық...&lt;/p&gt;\n&lt;h4 id=\"takhyryp-tueri-rejtingterdi-notrivialdy-taesildermen-khalyptastyrdy\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#takhyryp-tueri-rejtingterdi-notrivialdy-taesildermen-khalyptastyrdy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тақырып түрі рейтингтерді нотривиалды тәсілдермен қалыптастырды&lt;/span&gt;&lt;/a&gt;Тақырып түрі рейтингтерді нотривиалды тәсілдермен қалыптастырды&lt;/h4&gt;\n&lt;p&gt;Біз жергілікті регрессия (LOWESS, Сурет 2b-ге қараңыз) көмегімен қызығушылық пен «ага-эффект» арасындағы байланысты одан әрі зерттедік. Сапалық тұрғыдан, бұл тақырып белгісі түрімен нотривиалды өзара әрекеттесу болуы мүмкін екенін көрсетті: Муни кескіндері мен түсіндірмелі тақырыптар (яғни, не бейнеленгені туралы аз белгісіздік қалдыратын тақырыптар) қызығушылық пен «ага» арасында салыстырмалы түрде сызықтық байланысты көрсетсе де, бұл ассоциация белгісіздікті азырақ дәрежеде немесе мүлдем азайтпайтын тақырыптар үшін әлсізірек және айтарлықтай сызықтық емес болды (мысалы, кескінде не бейнеленгенін сөзбен сипаттайтын сипаттамалық тақырыптар және мүлдем жаңа ақпарат қоспайтын «тақырыпсыз» жалған тақырыптар). Мұнда төменнен орташа жоғары қызығушылық сынақтары үшін «ага» рейтингтерінің LOWESS қисық сызығы монотонды түрде өсті, бірақ кейін жоғары қызығушылық сынақтары үшін тегістелді және тіпті түсіп кетті. Бұл жоғары қызығушылыққа ие, бірақ кейін жеңілдік немесе аяқталу таппаған (яғни, тақырыптан нақты ақпарат алмаған) сынақтар үшін көңіл қалу әсерімен сәйкес келеді. Визуалды кескінде оңай бейнеленбеген жаңа тұжырымдаманы енгізетін және онымен байланыстыратын ассоциативті тақырыптар қайтадан сызықтық байланысты көрсетті, жалпы көлбеуі түсіндірмелі тақырыптарға немесе Муни кескіндеріне қарағанда төменірек, бірақ төмен қызығушылық сынақтарында басқа барлық тақырып шарттарына қарағанда жоғарырақ «ага» рейтингтеріне ие болды. Бұл тенденциялар өте қызықты көрінгенімен, ықтималдық қатынасы тесті көрсеткендей, квадраттық мүшелер қосылған LMM (9-теңдеу) деректерге тек сызықтық мүшелері бар модельден (8-теңдеу; χ2[6] = 0, p = 1) айтарлықтай жақсырақ сәйкес келмейді, бұл бақыланған өрнектің қате болуы мүмкін екенін көрсетеді. Модельдің толық мәліметтері үшін Кесте SN-ге қараңыз.&lt;/p&gt;\n&lt;h4 id=\"tuesinistik-effektisi-unatu-koersetkishimen-syzykhtykh,-al-ughynu-koersetkishimen-syzykhtykh-emes-tuerde-bajlanyskhan\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#tuesinistik-effektisi-unatu-koersetkishimen-syzykhtykh,-al-ughynu-koersetkishimen-syzykhtykh-emes-tuerde-bajlanyskhan\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түсіністік эффектісі ұнату көрсеткішімен сызықтық, ал ұғыну көрсеткішімен сызықтық емес түрде байланысқан&lt;/span&gt;&lt;/a&gt;Түсіністік эффектісі ұнату көрсеткішімен сызықтық, ал ұғыну көрсеткішімен сызықтық емес түрде байланысқан&lt;/h4&gt;\n&lt;p&gt;Біз түсіністік (аха) пен ұнату бағалары арасындағы маңызды сызықтық байланысты анықтадық, бұл алдын ала тіркелген тағы یک гипотезаны растады. Модель (10-теңдеу) бұл әсер барлық кескін категориялары үшін маңызды болғанын көрсетеді (Муни суреттері: көлбеу = 0.15, СУ = [0.10; 0.20], p &amp;lt; 0.001; жартылай абстрактілі өнер: көлбеу = 0.24, СУ = [0.19; 0.29], p &amp;lt; 0.001; абстрактілі өнер: көлбеу = 0.26, СУ = [0.21; 0.31], p &amp;lt; 0.001; фигуративті өнер: көлбеу = 0.32, СУ = [0.27; 0.37], p &amp;lt; 0.001 — атауы бар және атаусыз суреттерді біріктіргенде).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Түсіністік эффектісі барлық визуалды стимул категорияларында ұнату бағасымен тұрақты сызықтық байланыс көрсетеді (көлбеулері 0.15 мен 0.32 аралығында, p &amp;lt; 0.001).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Түсіндірме атаулары бар жартылай абстрактілі өнер категориясы тіпті жоғары әлеуетке ие сияқты: біз зерттеу дизайнына қатаңырақ сәйкес келетін модельді де таңдадық (яғни стимулдарды түсіндірме атаулармен қайта іріктеуді ескере отырып, қ. Әдістер, оларды Wikiarts Emotion деректер жиынындағы «таңқаларлық» бағасы бойынша реттелген екі бөлек атау тобына «түсіндірмелі (жоғары)» және «түсіндірмелі (төмен)» деп бөлу арқылы). Бұл жерде жартылай абстрактілі х түсіндірмелі (жоғары) тобы Муни суреттеріне қарағанда сәл төменірек түсіністік бағаларына ие болды (көлбеу = −7.36, СУ = [−15.11; −0.38], p = 0.062; атаусыз сынақтар үшін қосымшадағы А.11-кестені қараңыз).&lt;/p&gt;\n&lt;p&gt;Кейінгі жергілікті регрессия бұл байланыстың шынымен де сызықтық екенін және сурет түріне аса тәуелді емес екенін көрсетті (2c-суреттегі LOWESS қисық сызығын қараңыз). Шындықтың қатынасы тесті квадраты қосылған мүшелері бар модельдің (11-теңдеу) деректерді сызықтық мүшелері бар модельге қарағанда айтарлықтай жақсырақ сипаттамайтынын растады (10-теңдеу; χ²[4] = 0, p = 1). Осылайша, біздің деректеріміз бұрынғы Муни суреттерімен жасалған бақылаулардың (Muth &amp;amp; Carbon, 2013) басқа стимул домендеріне, бұл жағдайда визуалды өнерге тарала алатынын көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LOWESS (жергілікті салмақталған регрессия) — қисық пішініне қатысты қатаң алдын ала математикалық болжамдарсыз сызықтық емес трендтерді табу үшін деректерді тегістеу әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Түсіністік пен ұғыну арасындағы байланысқа келсек, жергілікті регрессия стимул категориясымен сызықтық емес өзара әрекеттесуді көрсетті. Шын мәнінде, біз ұғыну бағалары стимулдың абстракция деңгейімен өзара әрекеттеседі деп болжаған едік (алдын ала тіркелген, бірақ өзара әрекеттесудің қалай болатыны туралы нақты гипотеза болмаған). Абстрактілі өнер үшін байланыс сызықтық болғанымен, жартылай абстрактілі және фигуративті өнер үшін ол көбірек квадраты (U-тәрізді) сипатқа ие болды. Муни суреттері де U-тәрізді байланысты көрсетті (2d-суреттегі LOWESS қисықтарын қараңыз).&lt;/p&gt;\n&lt;p&gt;Бұл жерде шындықтың қатынасы тесті квадраты қосылған мүшелері бар модельдің (13-теңдеу) деректерді сызықтық мүшелері бар модельге (12-теңдеу) қарағанда шынымен де айтарлықтай жақсырақ сипаттайтынын растады (χ²[4] = 115.03, p &amp;lt; 0.001). Квадраты мүшелер фигуративті өнер (бағалау = 216.92, СУ = [118.04; 315.44], p &amp;lt; 0.001), Муни суреттері (бағалау = 141.51, СУ = [12.73; 270.30], p = 0.031) және жартылай абстрактілі өнер (бағалау = 96.42, СУ = [3.87; 188.98], p = 0.041) үшін маңызды болды, бірақ абстрактілі өнер үшін маңызды болған жоқ (бағалау = −19.48, СУ = [−116.45; 77.48], p = 0.694; толық модель мәліметтері үшін қосымшадағы А.17 және А.18-кестелерді қараңыз).&lt;/p&gt;\n&lt;p&gt;Егер төмен түсіністік және жоғары ұғыну байқалған сынақтар суреттерді бастапқыда жоғары деңгейде түсінуге байланысты болса (атауларсыз немесе Муни шешімінсіз де), байқалған үлгі логикалық тұрғыдан орынды болар еді, өйткені бұл қосымша ақпарат арқылы азайтылатын белсіздікті аз қалдырар еді (сондай-ақ қосымшадағы А.3-суретті қараңыз).&lt;/p&gt;\n&lt;h4 id=\"2-eksperiment-nejrondykh-korrelyattar-zhaene-akhparatty-oengdeuding-uakhytsha-tizbegi\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#2-eksperiment-nejrondykh-korrelyattar-zhaene-akhparatty-oengdeuding-uakhytsha-tizbegi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2-эксперимент – Нейрондық корреляттар және ақпаратты өңдеудің уақытша тізбегі&lt;/span&gt;&lt;/a&gt;2-эксперимент – Нейрондық корреляттар және ақпаратты өңдеудің уақытша тізбегі&lt;/h4&gt;\n&lt;p&gt;Эпистемиялық доғаның уақытша бейінін зерттеу үшін біз бақылаушылардың ЭЭГ, жүрек соғу жиілігін және қарашық өлшемін жазып ала отырып, экспериментті қайталадық. Эксперимент дизайны алдын ала тіркелген (https://doi.org/10.17605/OSF.IO/6KW9N), бірақ зерттеудің бұл бөлігі негізінен ізденіс сипатында болғандықтан, біз ешқандай нақты талдауға байланбаған едік.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;2-эксперимент негізінен ізденіс сипатында (exploratory) болғандықтан, оның нәтижелері болашақ зерттеулерде тәуелсіз түрде расталуын талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Физиологиялық сигналдар сәйкес ақпараттың физиологиялық деректерде көрініс тапқанын не таппағанын және қашан көрінгенін көрсету үшін уақыт бойынша шешілген кодтан шығару тәсілі арқылы талданды. Біз эксперименттік жағдайларды да, сынақтар кезінде жиналған әртүрлі мінез-құлық бағаларын да кодтан шығаруды мақсат еттік.&lt;/p&gt;\n&lt;p&gt;Маңыздысы, біз бұл кодтан шығару құбырларын атауға дейінгі сынақтар мен атаудан кейінгі сынақтардың деректері үшін бөлек іске қостық, бұл аралықта ұсынылған атаудың немесе Муни шешімінің ықтимал әсерлерін ашу үшін жасалды (сынақтардың атауға дейінгі немесе атаудан кейінгі жағдайға тиесілі екенін арнайы кодтан шығаратын бір құбырды қоспағанда).&lt;/p&gt;\n&lt;p&gt;Біз сондай-ақ құбырларды айырмашылық сигналына (атаудан кейінгі минус атауға дейінгі сынақтар) қолдандық; бұл нәтижелер А.2.4 бөлімінде баяндалған. Табулар төменде сипатталған, ал маңызды кодтан шығару нәтижелері 3 және 4-суреттерде көрсетілген. Барлық деректер модальдіктері мен барлық жағдайлар үшін кодтан шығару графиктер жиынтығы А.2.5 бөлімінде берілген.&lt;/p&gt;\n&lt;h4 id=\"koersetilimdi,-suret-sanatyn-zhaene-atau-shartyn-senimdi-dekodtau\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#koersetilimdi,-suret-sanatyn-zhaene-atau-shartyn-senimdi-dekodtau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Көрсетілімді, сурет санатын және атау шартын сенімді декодтау&lt;/span&gt;&lt;/a&gt;Көрсетілімді, сурет санатын және атау шартын сенімді декодтау&lt;/h4&gt;\n&lt;p&gt;Біз қолданған категориялық эксперименталды әсерлерді өте сенімді түрде анықтауға болатын еді. Кез келген берілген сурет стимулының 1-ші және 2-ші көрсетілімі арасындағы контрастты декодтау (3a-сур. қараңыз) барлық деректер модальділіктері бойынша дерлік сенімді түрде жүзеге асырылды. Бұл стимулдардың қайталап көрсету кезінде бірдей өңделмейтінін қатаң түрде көрсетеді; керісінше, когнитивті өңдеу анықталатын түрде ерекшеленеді. Бұл жай ғана қайталау әсерінен басылудан (cf. Kim, 2017) немесе қосымша ақпаратпен аралық контекстуализация (яғни нақты немесе жалған атау, не болмаса Муни суретінің шешімі) немесе әртүрлі айқын емес немесе айқын тапсырмалар (мысалы, бағалау) сияқты зерттеуге тән басқа факторлардан туындағанын бұл кезеңде нақты анықтау мүмкін емес. Ұсынылған сурет санатын (Муни суреті немесе картина) ЭЭГ және қарашық деректері бойынша да сурет басталғаннан кейін бірден сенімді түрде декодтауға болатын еді (3b-сур. қараңыз).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Декодтау нәтижелері бірінші және екінші көрсетілімдердің арасындағы айырмашылықтарды, сондай-ақ атау шарттарын анықтау мүмкіндігін көрсетті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Атап өткен жөн, қарашық деректерін қоспағанда (талқылауды қараңыз), жіктеу бірінші суретті көрсетуге қарағанда екінші көрсету кезінде сенімдірек жұмыс істеді (яғни жоғарырақ декодтау көрсеткіштері және тұрақтырақ маңыздылық); бұл осы зерттеудегі зерттелген декодтау тапсырмаларының көпшілігі үшін тән болды. Нәтижелердің толығырақ сипаттамасын A.2.6 қосымшасынан табуға болады.&lt;/p&gt;\n&lt;p&gt;Осы зерттеу үшін анағұрлым маңызды сұрақтарға көшетін болсақ, өнер туындыларындағы атау шарты (нақты атау немесе жалған атау) уақыттық облыс сигналдарынан да айтарлықтай дәрежеде декодталуы мүмкін еді (4a-сур. қараңыз). Алайда, атау шартын сенімді декодтау үшін ЭЭГ жиілік диапазондарының ешқайсысы пайдаланыла алмады. Екінші қарау кезіндегі (атаудан кейінгі) ЭП бойынша декодтау сурет басталғаннан кейінгі тұрақты, бірақ салыстырмалы түрде ерте терезеде ең жоғары дәлдікті көрсетті (0.3 с бастап 2 қысқа үзіліспен маңызды). Қарашық өлшемі бойынша декодтау атаудан кейінгі жағдайда 1.47–2.37 с аралығындағы уақыт терезесінде маңызды болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ЭП (Қозғалған потенциалдар) — бұл ЭЭГ көмегімен өлшенетін стимулдарға жауап ретіндегі мидың электрлік белсенділігі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Екінші қарау кезіндегі жүрек соғу жиілігі шартты сәйкесінше -0.50–0.64 с және 3.31–5.00 с екі уақыт терезесінде айтарлықтай болжады. Күтілгендей, атау шарты бірінші қарау кезінде (атау немесе жалған атау әлі ұсынылмаған кезде) тіркелген деректер модальділіктерінің ешқайсысы бойынша айтарлықтай дәрежеде декодталмады.&lt;/p&gt;\n&lt;h4 id=\"subuektivti-oengdeuding-fiziologiyalykh-belgileri-tuesinumen-anykhtaldy\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#subuektivti-oengdeuding-fiziologiyalykh-belgileri-tuesinumen-anykhtaldy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Субъективті өңдеудің физиологиялық белгілері түсінумен анықталды&lt;/span&gt;&lt;/a&gt;Субъективті өңдеудің физиологиялық белгілері түсінумен анықталды&lt;/h4&gt;\n&lt;p&gt;Қатысушылардың қызығушылық, ұнату және түсіну бағалауларын 5 секундтық сурет көрсету кезінде ЭП деректерінен белгілі бір уақытта айтарлықтай декодтауға болатын еді, ал түсінік қарашық өлшемінен сенімді декодталуы мүмкін еді, және түсіну&lt;/p&gt;\n&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;p&gt;Біз осы құрылымдарды ақпаратты іздеудің біртұтас тұжырымдамасы аясында біріктіруге тырысып, қызығушылық, инсайт, сезілетін түсінік және эстетикалық ұнату арасындағы байланысты зерттедік. Бұл тәсілді біз мағына жасаудың «эпистемикалық доғасы» деп атаймыз. Біз осы процестердің өзара әрекеттесуін жақсырақ түсіну үшін а) мінез-құлық бағалаулары саласын да, оқиғалардың уақытша тізбегі туралы түсінік алу үшін б) олардың (нейро)физиологиялық корреляттарын да зерттедік. Біз бейнелеу өнерін инсайтты зерттеудегі қалыптасқан стимул санаты болып табылатын Муни суреттерімен салыстыра отырып, мағына жасау мен инсайтты тудыра алатын бақыланатын, бірақ табиғи стимулдар класы ретінде зерттедік.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Біз бейнелеу өнері мен Муни суреттерін пайдалана отырып, қызығушылықты, инсайтты және эстетикалық бағалауды біріктіру үшін «эпистемикалық доға» тұжырымдамасын ұсындық.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сонымен қатар біз инсайт пен эстетикалық бағалау туралы мінез-құлық әдебиеттеріндегі бірқатар бұрынғы нәтижелерді қайталай алдық. Ең бастысы, біз стимулдық материал арқылы берілген ақпараттың түрі мен мөлшері арқылы қалыптасқан бағалаулар арасындағы күрделі және ішінара сызықтық емес байланыстарды анықтадық. Уақыт бойынша шешілетін декодтау тәсілін және көпмодальды физиологиялық деректерді (ЭЭГ, пупиллометрия, жүрек соғу жиілігі) пайдалана отырып, біз жылдам жауаптардың да, уақыт өте келе дамитын баяу процестердің де дәлелдерін тапtuk, алайда нәтижелерімізді біртұтас уақытша тізбек моделіне біріктіру қиынға соқты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ЭЭГ мидың электрлік белсенділігін уақыт бойынша жоғары дәлдікпен өлшейді, ал пупиллометрия мен жүрек соғу жиілігі назар мен эмоционалды қозуға байланысты вегетативті жүйке жүйесінің өзгерістерін көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"khyzyghushylykh,-insajt-zhangalyk-ashu,-tuesingenin-sezinu-zhaene-estetikalykh-baghalau-rejtingteri-arasyndaghy-bajlanys\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#khyzyghushylykh,-insajt-zhangalyk-ashu,-tuesingenin-sezinu-zhaene-estetikalykh-baghalau-rejtingteri-arasyndaghy-bajlanys\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қызығушылық, инсайт-жаңалык ашу, түсінгенін сезіну және эстетикалық бағалау рейтингтері арасындағы байланыс&lt;/span&gt;&lt;/a&gt;Қызығушылық, инсайт-жаңалык ашу, түсінгенін сезіну және эстетикалық бағалау рейтингтері арасындағы байланыс&lt;/h4&gt;\n&lt;p&gt;Мінез-құлық зерттеуі (1-эксперимент) біздің тіркелген гипотезаларымыздың көпшілігін растады: біз атауды манипуляциялаудың визуалды өнерді қабылданатын түсіну рейтингтеріне күшті әсерін қайталай алдық және атаулардың «аха» (жаңалық ашу) рейтингтеріне тиісті (тіпті күшейтілген) әсерін орната алдық. Дегенмен, біз атаудың эстетикалық артықшылық рейтингтеріне айтарлықтай әсерін қайталай алмадық, осылайша бұрыннан қайшылықты әдебиеттерді толықтыра түстік. Бұрын көп рет хабарланғандай (мысалы, [12], [12]), біз әртүрлі стимул категориялары бойынша эстетикалық артықшылық рейтингтерінде айырмашылықтарды байқадық, жалпы алғанда фигуративті өнер үшін абстрактілі өнерге қарағанда жоғарырақ рейтингтер байқалды, ал жартылай абстрактілі өнер ортада орын алды. Қабылданатын түсіну үшін бұл айырмашылық тіпті үлкен болды. Дегенмен, «аха» рейтингтерінде жартылай абстрактілі өнер үшін фигуративті немесе абстрактілі өнерге қарағанда «аха» көрсеткішінің сәл жоғары болуына қарай үрдіс байқалды. Визуалды өнерден басқа біз Муни кескіндері жиынтығын және сәйкес шешімдерді қостық. Олар күшті «аха» сезімін тудыратын перцептивті өзгерістерді тудыруы мүмкін, демек, бенчмарк ретінде әрекет ете алады. Бірнеше превиус зерттеулер Муни кескіндерін қолданып, бірақ визуалды өнерсіз біздікіне ұқсас сұрақтарды зерттеді ([12], [12]). Күтілгендей, «аха» рейтингтері барлық өнер субкатегорияларына қарағанда Муни кескіндері үшін жоғары болды, түсіндірме атаулары бар кейбір жартылай абстрактілі өнерді қоспағанда — бұл санат Муни кескіндеріне біршама ұқсайды, өйткені екеуі де берілген түсіндірmeden кейін (мысалы, кейбір кубистік картиналарда) перцептивті өзгерістерге әкелуі мүмкін. Екінші жағынан, эстетикалық артықшылық рейтингтері Муни кескіндері үшін өнерге қарағанда орташа есеппен сәл төмен болды. Сезілетін түсінуге келетін болсақ, Муни кескіндері фигуративті және атауы бар абстрактілі өнер арасында, жартылай абстрактілі стимулдармен бір деңгейде жатты. Атауға немесе шешімге деген қызығушылық кейінгі «аха»-ны болжады (бұрын Муни кескіндері үшін хабарланғандай, [12]), бірақ біздің деректеріміз ассоциация күші атау нұсқауларының ақпараттық мазмұнына тәуелді екенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қызығушылық пен түсіну рейтингтері инсайтты болжайды, мұнда байланыс күші атаулардың ақпараттылығы мен стимул категориясына байланысты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сипаттамалық LOWESS қисықтары бұл өзара әрекеттесу ішінара сызықтық емес ассоциацияларға әкелуі мүмкін екенін болжағанымен, біз мұның статистикалық маңызды дәлелдерін таппадық. «Аха» ұнатумен оң байланысты (мүлдем сызықты түрде, бұрын Муни кескіндері үшін хабарланғандай, [12]), сонымен қатар сезілетін түсінумен де байланысты. «Аха» мен түсіну арасындағы бұл ассоциация стимулдардың абстракция дәрежесімен сызықтық емес түрде өзара әрекеттеседі — абстрактілі өнердегі сызықтық ассоциациядан басқа модальділіктердегі U тәрізді қатынастарға дейін (фигуративті өнерде ең күшті). Инсайт бойынша басқа соңғы зерттеулер де сызықтық емес ассоциацияларды байқады, осылайша әдетте тек сызықтық қатынастарды ғана тексерген превиус нәтижелерді кеңейтті. Мысалы, [12] мәтінге негізделген ұқсастықты шешу тапсырмасында тапсырманың күрделілігі мен шешімге деген сенімнің екеуі де «аха» рейтингтерімен U тәрізді ассоциациясын тапты (өте оңай және өте қиын сынақтар орташа сынақтарға қарағанда төменірек «аха» тудырды). Бұл нәтиже бастапқы белсіздігі төмен «оңай» стимулдарды белгілейтін төмен «аха» және жоғары түсіну сынақтарын интерпретациялауымызға сәйкес келеді. Екінші жағынан, [12] зерттеуі 3 түрлі мәтіндік тапсырмалар бойынша жауаптардың сырттай бағаланған шығармашылығы «стимул — жауап» жұптарының семантикалық қашықтығымен сызықтық емес түрде байланысқанын анықтады (белгілі бір шекке дейін оң сызықтық, содан кейін семантикалық қашықтықтың артуы «аха»-ны арттыруды тоқтатты). Біздің жағдайда бұл бейнеленген визуалды контентке жоғары концептуальды қашықтығы бар екендігі үшін анық таңдалған эвокативті атаулардың нәтижелерін түсіндіру үшін әсіресе маңызды болуы мүмкін, ал аз дәрежеде абстрактілі өнер үшін. Субъективті «аха» рейтингтері шығармашылықты бағалауға тең болмағанымен, біз оң корреляцияны күтер едік. Біздің деректерімізде біз таза сипаттамалық атаулары бар өнердің (яғни өте төмен концептуальды қашықтық) ең төменгі орташа «аха» рейтингтерін алғанын шынымен көреміз. Екінші жағынан, эвокативті атаулар жалпы алғанда түсіндірме атаулармен бір деңгейдегі «аха» рейтингтерін алды, ал ең жоғары жалпы «аха» түсіндірме атаулары бар жартылай абстрактілі өнер үшін болды. Бұл паттерн [12] нәтижелеріне өте ұқсас. Біз олардың талдауын нақты қайталай алмағанымызбен, өйткені біз өнер мен атау арасындағы концептуальды қашықтықтың стимулға тән нақтырақ өлшемін тағайындамадық, деректерімізді шоғырландырылған түрде қайта талдау бұл сызықтық емес ассоциацияның шынымен модальділіктер бойынша жалпыланатынын және визуалды өнер үшін шекті мәндердің дәл қай жерде орналасқанын тағы да күштірек дәлелдей алар еді. Жанама ескерту ретінде, біз ең жоғары жалпы «аха» рейтингтері әлі де семантикалық немесе концептуальды қашықтық өлшемдері (шығармашылықты айтпағанда) оңай қолданылмайтын Муни кескіндері үшін берілгенін есте ұстауымыз керек. Дегенмен, жоғары «аха» көрсетілген сынақтарда орын алуы мүмкін перцептивті өзгерістер бақылаушылардың ішкі өкілдік кеңістігіндегі қашықтықты азайтады (мысалы, мысықтың түсіндіруге қиын Муни суреті мен қатысушының ішкі «мысық» концептісі арасында). Ұқсас жағдай репрезентациялық кеңістіктегі үлкен қашықтықтан кіші қашықтыққа фазалық ауысуды да тудыра алатын түсіндірме атаулар үшін де орын алуы мүмкін. Сол сияқты, бұл санат үшін концептуальды қашықтық өлшемін тағайындау да қиын болуы мүмкін, өйткені бұл қатысушының алдыңғы күйіне байланысты — егер түсіндірме белгісіз болса, қашықтық жоғары, бірақ бұрыннан таныс болса, төмен болады. Дәйексөз келтірілген жұмыстар біздің нәтижелерімізге сәйкес инсайт пен шығармашылықты зерттеудегі сызықтық емес трендтер туралы хабарлағанымен, біз бір және сол тапсырма аясында ассоциация пішінінің стимул категориясына тәуелді екенін табатын басқа жұмыстан хабардар емеспіз (яғни абстрактілі өнердегі «аха» мен түсінудің сызықтық ассоциациясы, бірақ басқа сурет категорияларындағы бірте-бірте сызықтық емес ассоциациялар туралы біздің дәлелдеріміз).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;U тәрізді қисық экстремалды жағдайлар (тым оңай немесе тым күрделі) орташа деңгейге қарағанда жаңалық ашу сезімін азырақ тудыратынын білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жиынтықта, байқалған рейтингтік паттерндер мағына жасаудағы және эстетикалық артықшылықтарды қалыптастырудағы инсайттың рөлі туралы түсінігімізді арттырады. Қызығушылық пен түсінудің «аха»-мен байланысы (әсіресе жоғары «аха» диапазонында) «аха» ақпарат алудың немесе белсіздікті азайтудың жарамды индикаторы бола алады деген пікірді қолдайды ([12] тұжырымдарына сәйкес). Сынақ бойынша қызығушылық рейтингтері, бұл логика бойынша, ақпарат алудың күтілетін әлеуетін көрсете алады — бірақ оның іске асырылуы қосымша семантикалық ақпаратқа байланысты, атау стилінің әсері көрсеткендей (яғни жаңадан ұсынылған семантикалық ақпарат мөлшері) атауды көргеннен кейін қызығушылық пен «аха» арасындағы қатынасқа (қран. 2b сурет): белсіздікті азайту қаншалықты мүмкін немесе күтілген болса (жоғары қызығушылық рейтингтерімен көрсетілген), берілген нұсқаудың әсері соғұрлым күшті болады және демек қызығушылық пен «аха» арасындағы ассоциация соғұрлым күшті болады (ең күшті байланыс Муни суреттерінде, ал ең әлсізі атауы жоқ өнерде байқалған). Екінші жағынан, төмен сезілетін түсіну қалған немесе қалдық белсіздіктің индикаторы ретінде түсіндірілуі мүмкін. ЭЭГ декодтау нәтижелері бұл түсіндіруді қолдайды, өйткені түсіну 2-сынақтың соңына қарай ең жақсы декодталатын болды (уақыт доменіндегі ЭЭГ-ден де, тета қуатынан да), барлық ақпарат біріктірілген кезде. «Аха» рейтингтерінің жоғары болуы (үлкен ақпарат өсуі) жоғары түсінумен тұрақты түрде байланысты болды, бірақ стимулдарға байланысты (өнер санаты және атау стилі) жоғары түсіну рейтингтері төмен «аха» сынақтарында да пайда болды. Бұл әсіресе фигуративті өнер мен Муни суреттері үшін орын алды (қран. 2b сурет), мұнда төмен «аха» әсіресе төмен қызығушылық рейтингтерінен кейін келді (сонымен қатар қран. A.3 қосымша сурет). Бұл стимулдардың едәуір бөлігі үшін қатысушылардың атауға/шешімге деген қызығушылығы азырақ болуы мүмкін, өйткені бірінші кезекте белсіздік аз болды және демек «аха» үшін әлеует те аз болды — шөпті алқаптың фигуративті картинасы немесе бірінші қарағанда танылған Муни суреті атауды немесе негізгі суретті соншалықты қалауын тудырмауы мүмкін, ал абстрактілі және жартылай абстрактілі өнер туындылары көрермен үшін мүлдем бір мағыналы болу ықтималдығы салыстырмалы түрде төмен. Екінші жағынан, ұнату рейтингтері барлық басқа рейтингтермен — қызығушылықпен, «аха»-мен және түсінумен оң және біршама сызықты түрде болжанды. Бұл ассоциациялар өнер стилі немесе атау стилі сияқты басқа факторлардан айтарлықтай әсер етпеді (қран. 2d сурет және A.2.1 қосымша). Бір қарағанда, бұл эстетикалық бағалаудың рөлі (немесе бұл зерттеудегі біздің рейтингтік операционализациямыз) шынымен де өте қарапайым екенін көрсетуі мүмкін: эстетикалық ұнату жай ғана басқа оң таңбалы пікірлерге ереді, ал бұл басқа рейтингтер күрделірек шығу тегіне ие болуы мүмкін. Алайда, біздің деректеріміз мұндай тым қарапайым себептік интерпретацияға қарсы дәлелдерді де қамтиды: біз (бұрынғы көптеген топтар сияқты) фигуративті өнердің жартылай абстрактілі және абстрактілі өнерге қарағанда орташа есеппен жоғары эстетикалық рейтингтер алғанын анықтағанымызбен, бұл «аха» мен қызығушылық үшін олай болмады — өнер туындысының санаты «аха» рейтингтері үшін үлкен маңызға ие болмады (тек жартылай абстрактілі өнер ғана басқаларға қарағанда жоғары ұпай жинады) және қызығушылық фигуративті өнер үшін көбірек абстрактілі санаттарға қарағанда айтарлықтай төмен болды. Сонымен қатар, атауды манипуляциялаудың эстетикалық ұнатуға айтарлықтай әсері болмады, ал ол сезілетін түсінуге де, «аха»-ға да айтарлықтай әсер етті (қызығушылық үшін бұл салыстыру мағынасыз, өйткені атаулар бұл рейтинг жиналғаннан кейін ұсынылды). Барлық үш рейтинг сынақ деңгейінде ұнатуды сызықты түрде болжағанымен, ұнату басқа рейтингтерге жай ғана еретін сияқты көрінбесе, әйтпесе жалпы орташа паттерндер ұқсас болар еді. Сонымен қатар, декодтау уақыт барысында ұнату сынақтардың басында, басқа рейтингтерден әлдеқайда бұрын декодталу шыңын көрсетті (төменде толығырақ талқыланады). Нәтижелерімізге сүйене отырып, болашақ зерттеулер осы өзара байланыстарды жақынырақ, идеалды түрде көбірек себептік тұрғыдан қарастыру үшін интервенциялық зерттеулерді жобалай алады. Жоғарыда біз ақпараттық мазмұнның әсері және мағына жасаудағы әртүрлі басқа стимул ерекшеліктері туралы көптеген қызықты нәтижелерді талқыладық, бірақ біз сондай-ақ үлес қосатын басқа да маңызды факторлар бар екенін атап өткіміз келеді. Әсіресе қатысушылар арасындағы жеке айырмашылықтар тек бастапқы айырмашылықтарға қарағанда күрделірек өзара әрекеттесулерде көрінуі мүмкін. Мысалы, [12] зерттеуі әртүрлі визуалды іздеу стратегияларының (өнер сараптамасымен немесе жай ғана жаттығумен байланысты) кубистік картиналарда объектіні жылдамырақ және дәлірек тануға әкелуі мүмкін екенін көрсетті (яғни ақпаратты тиімдірек шығару). Сондай-ақ оң көңіл-күй «аха» сезімін күшейтетіні анықталды ([12]), және бұл барлық жағдайларда бірдей қолданылатыны немесе күрделірек өзара әрекеттесулерді көрсететіні белгісіз болып қала береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Алынған нәтижелер зертханалық жағдайда анықталған, ал қатысушылардың жеке ерекшеліктері мен көңіл-күйі нәтижелерге әсер етуі мүмкін екенін ескеру қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"fiziologiyalykh-korrelyattar-zhaene-akhparatty-oengdeuding-uakhytsha-rettiligi\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#fiziologiyalykh-korrelyattar-zhaene-akhparatty-oengdeuding-uakhytsha-rettiligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Физиологиялық корреляттар және ақпаратты өңдеудің уақытша реттілігі&lt;/span&gt;&lt;/a&gt;Физиологиялық корреляттар және ақпаратты өңдеудің уақытша реттілігі&lt;/h4&gt;\n&lt;p&gt;Екінші экспериментте біз жылдам (нейро)физиологиялық корреляттарды бақылау арқылы эпистемикалық доғаның уақытча бейінін сипаттауды мақсат еттік. Зерттеудің бұл бөлігі көбірек ізденіс сипатында болды және бұрынғы жұмыстарға негізделген алдын ала тіркелген екі жалпы гипотезамыз ғана болды, атап айтқанда EEG альфа және гамма диапазоны белсенділігі мен инсайт және ұнату бағалары арасындағы байланыс. Біз бұл гипотезаларды қолндайтын дәлелдер таба алмадық. Біздің көп өлшемді декодтау тәсіліміз уақыт саласындағы EEG, жиілік саласындағы EEG (гамма диапазонын қоспағанда), жүрек соғу жиілігі және қарашық деректері негізінде негізгі эксперименталды манипуляцияларды сенімді түрде анықтай алғанымен, сатылы бағаларды қалпына келтіру қиынырақ болды және декодтау жиілік саласындағы EEG-ге қарағанда әртүрлі уақыт саласындағы сигналдар үшін жақсырақ жұмыс істеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ескерту: талдаудың ізденістік сипаты және бағалау шкалалары үшін маңызды нәтижелердің болмауы жылдам физиологиялық корреляттар туралы деректердің әзірге алдын ала сипатта екенін білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"pupillometriya-zhaene-zhuerek-soghu-zhiiligi-bojynsha-dekodtau\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#pupillometriya-zhaene-zhuerek-soghu-zhiiligi-bojynsha-dekodtau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пупиллометрия және жүрек соғу жиілігі бойынша декодтау&lt;/span&gt;&lt;/a&gt;Пупиллометрия және жүрек соғу жиілігі бойынша декодтау&lt;/h4&gt;\n&lt;p&gt;Күтілгендей, пупиллометрия өте перспективалы деректер модальділігі болып шықты: оны категориялық факторларды (1-ші немесе 2-ші презентация, Муни суреттері немесе өнер туындылары) сенімді түрде декодтау үшін пайдалануға болады, атау эффектісі, қызығушылық және түсіну/ашу (aha) бағалары үшін маңызды уақыт терезелерін көрсетті, сондай-ақ ұнату мен түсіну үшін қызықты уақытча профильдері бар кездейсоқ мәннен жоғары, бірақ маңызды емес декодтауды көрсетті (3- және 4-суреттерді қараңыз).&lt;/p&gt;\n&lt;p&gt;Эстетикалық ұнату нәтижелері ешқандай маңызды әсерлерді көрсетпесе да, біз сынақтың көп бөлігінде кездейсоқ деңгейден жоғары декодтауды және атау алдындағы сынақтардың бірінші секундында декодталудың айқын шыңын байқадық (атаудан кейінгі сынақтарда бұл жоқ). Егер бұл дұрыс болса, бұл преференцияларды қалыптастырудағы бірінші және жылдам компонент үшін қосымша дәлел болып табылады (ат қойылғаннан кейінгі ERP деректерін қ.). Маңыздысы, қарашық өлшемі біз ашу (aha) бағаларын сенімді түрде болжай алатын жалғыз жазылған деректер модальділігі де болды (дифференциалды сигналдың ЭЭГ тета-диапазонындағы қысқа кластерді қоспағанда; А.2.4-қосымшаны қ.).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Пупиллометрия — бұл қарашық диаметрінің өзгеруін өлшеу әдісі, ол жарықтан басқа когнитивтік жүктемеге, эоционалдық қозуға және мидың жарқын түсіну сәттеріне де жауап береді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мүмкін, қарашық салыстырмалы түрде баяу немесе инертті сигнал ретінде (жүрек соғу жиілігі сияқты баяу болмаса да) түсіну сәттері арасындағы синхрондаудың болмауынан аз зардап шегеді. Бұл сынақ ұзақтығы бойынша баяу монотонды өсуді көрсеткен дифференциалды сигналдың декодтау уақыт барысымен үйлесуі мүмкін (А.2.4-қосымшаны және А.8-қосымша суретті қ.). Атаудан кейінгі сынақтарда бейне пайда болғаннан кейін жарты секунд өткен соң маңызды болатын ашу үшін декодтаудың маңызды терезесі болды. Bуны бейне жоғалғанға дейінгі соңғы секундта, атау алдындағы сынақтардың соңында айқын маңызды әсерлерді көрсеткен қызығушылық бағаларын декодтаумен салыстыру қызықты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Пупиллометрия категориялық факторларды және түсіну бағаларын сәтті декодтайды, алайда қарашықтың ерте реакциялары жарықтық өзгерістеріне қатты тәуелді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жиынтығында бұл өрнек қарашықты ақпаратты өңдеудегі қызығушылықтың, түсінудің және түсінудің өзара әрекеттесуі бойынша болашақ зерттеулер үшін өте перспективалы кандидат етеді (және преференцияларды қалыптастыру жұмыстары үшін де). Өкінішке орай, сынақтың басындағы қарашық өлшемі (бейне пайда болғаннан кейінгі бірінші секунд шамасында) жоғары деңгейдегі когнитивтік процестер үшін сенімді сигнал болмауы мүмкін. Біздің деректерімізде сынақтардың ерте бөлігінде ешқандай баға да, атау шарты да декодталмағанын көреміз. Бұл уақытта қарашық экрандағы жарықтық өзгерістеріне еріксіз түрде бейімделеді (А.4-қосымша суреттегі жалпы орташа қарашық іздерін қ.). Алайда, атау алдындағы ұнату бағаларындағы қызықты маңызды емес өрнек дәл осы уақыт профиліне түскенін және атаудан кейінгі сынақтардағы ашудың маңызды декодталуы бірден кейін басталатынын ескеріңіз, бұл қарашықтың ашуға байланысты әртүрлі кеңейю деңгейіне қайта реттелетінін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Сынақтың алғашқы секундтарындағы қарашық өзгерістері күрделі когнитивтік процестерге емес, экранның физикалық жарықтығына негізделген.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Муни суреттері мен өнер туындылары арасындағы контраст, керісінше, осы уақыт терезесінде ерекше жақсы декодталуы мүмкін еді; Муни суреттері таза ақ пиксельдердің үлкен үлесі бар жоғары контрастты қара/ақ суреттер екенін ескерсек, бұл таңқаларлық емес — демек, қарашық орташа есеппен азырақ жарық болатын өнер туындыларымен салыстырғанда осындай суреттерге қаттырақ бейімделуі тиіс. Бұл түсіндірмені одан әрі растай отырып, Муни суреттері ішіндегі 1-ші және 2-ші презентация ерте қарашық деректерінен маңызды түрде декодталмады (тек сынақта кейінірек), ал бұл өнер туындылары стимулдары мен ЭЭГ сияқты басқа деректер модальділіктері үшін сенімді жұмыс істеді (3-суретті және А.2.5-қосымшаны қ.).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Жүрек соғу жиілігі вегетативті жүйке жүйесі арқылы реттеледі және физиологиялық реакцияларды да, когнитивтік белсенділікті де көрсетеді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Симпатикалық/парасимпатикалық жолдар арқылы автономды жүйке жүйесімен тығыз байланысты сигнал — жүрек соғу жиілігі эстетикалық өңдеуден әсер ететін тағы бір кандидат деректер модальділігі болды. Алдыңғы жұмыстардағыдай, біз визуалды стимулдардың пайда болуынан кейін жүрек соғу жиілігінің айқын баяулауын байқадық (Palomba et al., 1997; Welke &amp;amp; Vessel, 2022). Бұл баяулау екінші презентацияға қарағанда бірінші (атау алдындағы) презентация үшін күштірек болды, өйткені екінші презентацияда жүрек соғу жиілігі бұрыннан төмен деңгейден басталды (А.2.3-қосымшаны қ.). Атау алдындағы сынақтарда біз жүрек соғу жиілігінен ешқандай категорияны немесе бағаны декодтай алмадық, бірақ атаудан кейінгі сынақтарда бұл мүмкін болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Жүрек соғу жиілігі стимулдардан кейін айқын баяулауды көрсетті және базалық сызыққа түзетудің болмауына байланысты постстимулды сынақтардағы оқиғаларды декодтауға мүмкіндік берді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сигналдың инерттілігіне байланысты, алдыңғы атау алдындағы сынақ кезіндегі оқиғалар немесе атаудың ашылуы атаудан кейінгі сынақтар кезіндегі жазбаларға ауысып кетуі мүмкін (маңыздысы, басқа барлық деректер модальділіктерінен айырмашылығы, біз жүрек соғу жиілігі деректерін базалық сызық бойынша түзетемідік). Бұл біз неге бейне категориясы немесе атау шарты сияқты оқиғаларды екінші бейне презентациясының стимулға дейінгі кезеңінде-ақ сенімді түрде декодтай алғанымызды түсіндіре алады — барлық қажетті ақпарат сол жерде болды. Атаудан кейінгі сынақтардың стимулға дейінгі кезеңінде біртіндеп түсіну бағаларын декодтау — бұл анағұрлым қызықты нәтиже. ERP деректерінде атау алдындағы сынақтардың басында маңызды түсіну сигналы болды, ж
