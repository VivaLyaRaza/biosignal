рлық туындаған реакциялардың медиандық кідірісіне сәйкес келеді, IQR = 0.46–2.10 с). Бұл дизайн дыбыстың спецификалық емес әсерін бақылай отырып, ояңсулардың нақты әсерлерін бөліп алуға мүмкіндік берді. Спонтанды ояңсуларды талдау үшін ояңсудың басынан басталатын 3 секундтық дәуір мен сәйкес келетін базалық дәуір таңдалды.&lt;/p&gt;\n&lt;h4 id=\"interiktaldy-epileptiformdy-razryadtardy-taldau\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#interiktaldy-epileptiformdy-razryadtardy-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интериктальды эпилептиформды разрядтарды талдау&lt;/span&gt;&lt;/a&gt;Интериктальды эпилептиформды разрядтарды талдау&lt;/h4&gt;\n&lt;p&gt;Ұстамааралық эпилептиформдық разрядтар (IED) таңдалған дәуірлерде биполярлы SEEG арналарында бұрын валидацияланған детектор көмегімен автоматты түрде анықталды. Электродтардың имплантация тығыздығындағы пациенттер арасындағы айырмашылықтарды ескеру үшін талдаулар белсенді арналармен шектелді — IED жиілігі 4.4 оқиға/мин асатын арналар. Белсенді SEEG арналарындағы IED саны жалпыланған сызықтық аралас модель (GLMM) көмегімен модельденді.&lt;/p&gt;\n&lt;p&gt;IED кеңістіктік таралуын зерттеу үшін зерттеушілер әрбір тәуелсіз IED кезінде тартылған SEEG арналарының санын есептеді. Егер разрядтар кез келген арнада алдыңғы IED-тен кемінде 120 мс қашықтықта пайда болса, олар тәуелсіз деп саналды. Берілген дәуірде анықталған бірінші IED бастапқы IED (source IED) болып саналды, ал одан кейінгі 120 мс ішіндегі қосымша спайктар таралатын IED (propagating IEDs) болып саналды. Арна бойынша IED саны мен таралатын арналардың саны алдын ала анықталған төрт дәуір үшін бөлек есептелді. Жоғары жиілікті тербелістер (HFO, &amp;gt;80 Гц) де SEEG-те автоматты түрде анықталып, олардың саны GLMM арқылы модельденді.&lt;/p&gt;\n&lt;h4 id=\"modulyaciyalaushy-faktorlardy-taldau\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#modulyaciyalaushy-faktorlardy-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модуляциялаушы факторларды талдау&lt;/span&gt;&lt;/a&gt;Модуляциялаушы факторларды талдау&lt;/h4&gt;\n&lt;p&gt;Оянуға байланысты ұстама аралық белсенділіктің өзгеруіне әсер ететін факторларды зерттеу үшін зерттеушілер мидың анатомиялық аймағының, ұстаманың басталу аймағының қатысуы мен ұйқы сатысының ықпалын бағалады. Оянулардың ұстама аралық разрядтардың таралуына айтарлықтай әсері байқалмағандықтан, модульдеуші факторларды кейінгі талдау тек олардың санын есептеу үшін жүргізілді. Электродтарды локализациялау бұрынғы жұмыстарда қолданылған стандартты рәсімдер бойынша орындалды. Имплантациядан кейінгі КТ немесе МРТ сканерлері әр пациенттің операцияға дейінгі МРТ суреттерімен сәйкестендіріліп, олар өз кезегінде ICBM152 симметриялы ми моделіне бейнеленді. Бұл электродтардың орнын бірыңғай стереотаксикалық кеңістікте дәл анықтауға мүмкіндік берді. Электродтық арналар әр контактінің координаттарында орналасқан 5 мм радиустағы сфераны қолдана отырып, MICCAI атласы негізінде анатомиялық аймақтарға бөлінді. Арналар ұйқыны реттейтін маңызды аймақ таламуспен функционалдық байланыстардағы айырмашылықтарды көрсету үшін мезиотемпоральды (амигдала, гиппокамп және энторинальды қыртысты қамтитын) немесе неокортикальды болып жіктелді. Неокортикальды аймақтар кең таламокортикальды проекцияларды алса, мезиотемпоральды аймақтар таламуспен сирек байланысқан. Бұл анатомиялық жіктеу ұйқы мен эпилепсия арақатынасын зерттеген бұрынғы терең ЭЭГ зерттеулеріне сәйкес келді. Ұстама аралық разрядтардың саны неокортикальды және мезиотемпоральды аймақтардан шығатын разрядтар үшін бөлек есептелді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мезиотемпоральды және неокортикальды ми аймақтары таламуспен байланыс тығыздығы бойынша ерекшеленеді, бұл олардың ұйқы кезіндегі эпилепсиялық белсенділігіндегі айырмашылықтарды түсіндіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ұстаманың басталу аймағының ояну кезіндегі ұстама аралық динамикаға әсері разрядтардың осы аймақ ішінде немесе сыртында пайда болғанына қарай жіктелуі арқылы бағаланды. Әрбір пациент үшін бұл аймақты клиникалық терең ЭЭГ жазбалары негізінде нейрофизиология және эпилептология мамандығы бар сертификатталған невролог анықтады. Ұстаманың басталуы фондық белсенділіктен визуалды түрде ерекшеленетін алғашқы тұрақты ырғақты ЭЭГ өзгерісі ретінде анықталды. Егер бірнеше ұстама тіркелсе, контактілердің барлық жағдайда тұрақты қатысуы ескерілді. Әрбір терең ЭЭГ арнасы «ұстама басталған аймақ» немесе «аймақтан тыс» деп белгіленді, бұл ояну мен бақылау жағдайларына байланысты төрт 3 секундтық интервалдағы разрядтар санын бөлек анықтауға мүмкіндік берді. Кез келген арна топшасында үштен аз арнасы бар пациенттер тиісті талдаулардан шығарылды.&lt;/p&gt;\n&lt;p&gt;Ұйқы сатысына тәуелділікті бағалау үшін оқиғалар олар орын алған NREM ұйқы сатысына қарай бөлінді. Аудиторлық стимулдар стандартты ұйқы өлшемдерін қолдана отырып, N2 немесе N3 сатыларында пайда болғанына қарай топтастырылды. Сатылар арасындағы ауысу кезіндегі оянулар жіктеудің тұрақтылығын қамтамасыз ету үшін алынып тасталды. Барлық арналар бойынша разрядтар саны ояну және бақылау жағдайында әр ұйқы сатысы үшін бөлек есептелді. N2 немесе N3 сатыларында оянулары жоқ пациенттер бұл талдаудан шығарылды.&lt;/p&gt;\n&lt;p&gt;Баяу толқынды белсенділіктің әсерін бағалау үшін баяу толқындар биполярлы терең ЭЭГ арналарында бұрын әзірленген алгоритм көмегімен автоматты түрде анықталды. Стимулдарға жауаптар 3 секундтық ояну немесе бақылау интервалында кез келген арнада баяу толқын анықталғанына қарай баяу толқынды оянулар немесе оқшауланған баяу толқынды жауаптар ретінде жіктелді.&lt;/p&gt;\n&lt;h4 id=\"statistikalykh-taldaular\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#statistikalykh-taldaular\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистикалық талдаулар&lt;/span&gt;&lt;/a&gt;Статистикалық талдаулар&lt;/h4&gt;\n&lt;p&gt;Интерприступтық эпилептиформдық белсенділіктің (IED) барлық көрсеткіштері, атап айтқанда IED саны мен таралу арналарының мөлшері алдын ала анықталған төрт үш секундтық уақыт аралығы бойынша салыстырылды: оянуды тудырған есту стимулдарына дейінгі базалық кесінді, туындаған ояну терезесі, ояну тудырмаған бақылау стимулдарына арналған базалық кесінді және бейтарап стимулдар үшін сәйкес келетін бақылау терезесі. 3 секундтық эпохаларды қолдану дыбыстық сигнал берілгенге дейін және ояну кезіндегі жергілікті ұйқы микромүйелерін тіркеуге мүмкіндік берді. Престимулдық кезеңдердегі IED көрсеткіштері пациенттің жалпы базалық жағдайын дұрыс көрсететініне көз жеткізу үшін авторлар нормализденген IED мәндерін түн бойы кездейсоқ таңдалған және оянудан бос эпохалармен салыстырды. Бұл үшін Tweedie бөлінісі мен логарифмдік байланыс функциясы бар жалпыланған сызықтық аралас модель (GLMM) қолданылды.&lt;/p&gt;\n&lt;p&gt;IED саны теріс биномиалдық бөлінісі және логарифмдік функциясы бар GLMM көмегімен модельденді, өйткені бұл әдіс шамадан тыс тараған санақтық деректерді талдауға өте қолайлы. Негізгі зерттелетін фактор ретінде шарт (туындаған ояну және бақылау) алынды, ал бастапқы IED саны мен стимул қарқындылығы ковариаталар ретінде енгізілді. Пациенттер арасындағы және контактілер арасындағы вариабельділікті ескеру үшін SEEG контактілері үшін кездейсоқ қиылысулар белгіленді. IED таралу арналарының орташа саны оң бағытталған үзіліссіз айнымалыларға арналған Gamma GLMM көмегімен модельденді. Негізгі ояну талдауы үшін төрт IED моделі құрылды: біріншісі барлық белсенді арналарды қамтыды, ал қалған үшеуі анатомиялық ми аймағы, SOZ қатысуы және ұйқы сатысы сияқты модуляциялаушы факторлардың әсерін тексеру үшін өзара әсерлесу мүшелерін қамтыды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GLMM (жалпыланған сызықтық аралас модельдер) — бұл бүкіл топ үшін ортақ заңдылықтарды да, әрбір жеке пациенттің немесе электродтың жеке ерекшеліктерін де бір мезгілде ескеруге мүмкіндік беретін қуатты статистикалық әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Таралу арналары моделі шарт бойынша айтарлықтай әсер етпегендіктен, таралуға қатысты қосымша факторлар талданбады. Бұл нәтижелердің өздігінен болатын оянуларға да қатысты екенін бағалау үшін ұқсас теріс биномиалдық және Gamma GLMM архитектуралары қолданылып, бастапқы деңгейге түзету жасалды. Қосымша ретінде, туындаған оянулар кезіндегі жоғары жиілікті тербелулердің (HFO) саны теріс биномиалдық GLMM арқылы зерттелді.&lt;/p&gt;\n&lt;p&gt;Оянулар кезінде байқалатын IED өсуіне ми жағдайындағы бастапқы айырмашылықтар әсер етпегенін тексеру үшін, бастапқы IED саны жеке теріс биномиалдық GLMM көмегімен бағаланды. Сондай-ақ оянулардың өткір әсері ұзағырақ уақыт шкаласына таралатынын анықтау үшін, NREM ұйқысы кезінде ұйқыны бөлшектеу үшін дыбыстық стимуляция берілген бірінші жартысы мен қалпына келтіру ұйқысына мүмкіндік берілген екінші жартысындағы жаһандық IED жиіліктері салыстырылды. Бұл дизайн пациент пен түн жағдайын бірдей ұстай отырып, жоғары және төмен бөлшектелу кезеңдерін салыстыруға мүмкіндік берді. Жаһандық IED жиіліктері екі жақты Уилкоксон критерийі арқылы салыстырылды.&lt;/p&gt;\n&lt;h4 id=\"stimulyaciya-aldyndaghy-midyng-fono-zhaghdajynyng-elektrofiziologiyalykh-zhauapkha-aeseri\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#stimulyaciya-aldyndaghy-midyng-fono-zhaghdajynyng-elektrofiziologiyalykh-zhauapkha-aeseri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Стимуляция алдындағы мидың фоно-жағдайының электрофизиологиялық жауапқа әсері&lt;/span&gt;&lt;/a&gt;Стимуляция алдындағы мидың фоно-жағдайының электрофизиологиялық жауапқа әсері&lt;/h4&gt;\n&lt;p&gt;Стимуляция алдындағы мидың фоно-жағдайы тітіркендіруге берілетін электрофизиологиялық жауапты анықтайтынын тікелей тексеру үшін авторлар тағы екі модель жиынтығын құрды. Стимуляция алдындағы спектрлік қуат қатынасы скальптік ЭЭГ деректері бойынша (Fz-Cz немесе Fz-Cz қолжетімсіз болған екі пациент үшін F3-C3) δ/(θ+α+β) ([0.5-4 Hz]/[4.5-30 Hz]) ретінде анықталды. Бұл қатынас дыбыстық стимулдың алдындағы тікелей 3 секундтық кезең үшін есептеліп, содан кейін логарифмдік түрлендіруден (&lt;span class=\"yfm-latex\" data-content=\"%5C_%5Ctext%7Blog%7D_%7B10%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;) және z-скарлаудан өткізілді. Қуат мәндері стандартты ЭЭГ жиілік диапазондары үшін алынды: δ (0.5–4 Гц), θ (4.5–8 Гц), α (8–12 Гц) және β (12–30 Гц). Біріншіден, ояну (arousal) жауабының оқшауланған баяу толқынды жауапқа қарағандағы ықтималдығы логит байланыс функциясы бар биномиалды GLMM көмегімен модельденді. Тіркелген әсерлер ретінде стимуляция алдындағы спектрлік қуат қатынасы, стимул қарқындылығы және бастапқы эпилептиформды разрядтардың (IED) саны енгізілді, ал пациент ID идентификаторына кіріктірілген СЭЭГ контактілері кездейсоқ қиылысулар ретінде қолданылды. Бұл модель алдын ала δ-белсенділік ояну ықтималдығын болжайтынын тексерді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Теріс биномиалды GLMM — бұл оқиғалар жиілігінің дисперсиясы орташа мәннен асып түсетін деректерді талдауға арналған статистикалық әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;«Жауап түрі × спектрлік қуат қатынасы» өзара әрекеттесуі маңыздылық деңгейіне жеткендіктен, әрбір жауап түрі үшін IED санының спектрлік қуатқа тәуелділік көлбеуін бағалау мақсатында post-hoc simple slopes талдауы жүргізілді. Бұл байланыстың бағыты мен маңыздылығын сипаттауға, сондай-ақ фоновое δ-белсенділіктің рөлін нақтылауға мүмкіндік берді. δ-күйі жауап түрі мен IED саны арасындағы тікелей байланыстырушы фактор (конфаундер) болуы ықтималдығын жою үшін өзгерісті бағалау сезімталдық талдауы (change-in-estimate sensitivity analysis) жасалды: жауап түрінің IED санына әсері спектрлік қуат қатынасы ескерілмеген және ескерілген модельдермен салыстырылды.&lt;/p&gt;\n&lt;h4 id=\"stimul-kharkhyndylyghyn-bakhylau-zhaene-talamusty-taldau\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#stimul-kharkhyndylyghyn-bakhylau-zhaene-talamusty-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Стимул қарқындылығын бақылау және таламусты талдау&lt;/span&gt;&lt;/a&gt;Стимул қарқындылығын бақылау және таламусты талдау&lt;/h4&gt;\n&lt;p&gt;Стимул қарқындылығының өзі IED санын басқарып тұрғанын тексеру үшін бақылау кезеңдеріндегі IED саны теріс биномиалды GLMM көмегімен модельденді. Мұнда қызығушылық тудыратын тіркелген әсер ретінде стимул қарқындылығы алынып, бастапқы IED саны мен пациенттердің СЭЭГ контактілері ескерілді. Бұл модель байқалатын ояну болмаған кезде стимул қарқындылығының IED санымен байланысын тексерді. Содан кейін оянулар мен бақылау кезеңдері арасындағы IED санының айырмашылығы стимул қарқындылығына тәуелді екендігі оқиға түрі, стимул қарқындылығы және олардың өзара әрекеттесуін қамтитын теріс биномиалды GLMM көмегімен зерттелді. Таламус ішіне СЭЭГ электродтары орнатылған төрт пациентте таламустық спектрлік қуат қатынасы δ/(θ+α+β) биполярлы референтті таламустық контактілерден есептелді. Бақылау және стимуляция алдындағы кезеңдер арасындағы айырмашылық ретінде есептелген бұл қатынастың өзгеруі гаусстық отбасылық GLMM көмегімен модельденді.&lt;/p&gt;\n&lt;h4 id=\"koeptik-salystyrulargha-arnalghan-statistikalykh-tuezetuler\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#koeptik-salystyrulargha-arnalghan-statistikalykh-tuezetuler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Көптік салыстыруларға арналған статистикалық түзетулер&lt;/span&gt;&lt;/a&gt;Көптік салыстыруларға арналған статистикалық түзетулер&lt;/h4&gt;\n&lt;p&gt;Көптік салыстыруларды басқару үшін модельдер нәтиже айнымалысына (IED саны, HFO саны және таралу арналарының саны) және талдау контекстіне қарай алдын ала анықталған отбасыларға топтастырылды. Екі деңгейлі түзету тәсілі қолданылды. Біріншіден, бірінші кезектегі қызығушылық тудыратын тіркелген әсер үшін p-мәндері әр отбасы ішіндегі модельдер саны бойынша Бонферрони түзетуінен өткізілді. Атап айтқанда, викликания ояну IED санын талдау төрт модельден тұратын отбасын құрды (p × 4). Сол сияқты, спонтанды ояну IED және викликания HFO талдаулары жеке төрттік отбасыларды құрды (p × 4); баяу толқынды талдау отбасы екі модельден тұрды (p × 2); ал таралу арналарының модельдері жеке бір модельдік отбасылар ретінде қарастырылды. Екіншіден, өзара әрекеттесу маңыздылыққа жеткен кез келген модель үшін жұптық post-hoc контрастарының p-мәндері модель ішінде қосымша Бонферрони түзетуінен өтті (p × 2). Әсер өлшемдері инциденттер жиілігінің қатынасы (IRR) ретінде келтірілді, ал модель болжаған орташа мәндер 95% сенім интервалдарымен көрсетілді.&lt;/p&gt;\n&lt;h4 id=\"uakhytsha-taldau-zhaene-spajktardy-statistikalykh-oengdeu\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#uakhytsha-taldau-zhaene-spajktardy-statistikalykh-oengdeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Уақытша талдау және спайктарды статистикалық өңдеу&lt;/span&gt;&lt;/a&gt;Уақытша талдау және спайктарды статистикалық өңдеу&lt;/h4&gt;\n&lt;p&gt;Ояну және стимулдың басталуы кезіндегі ұстамааралық эпилептиформдық разрядтардың (IED) динамикасын зерттеу үшін әр пациенттің көрсеткіштері оның максималды мәніне нормализделді. Содан кейін деректер 500 мс аралықтарға біріктіріліп, барлық пациенттер бойынша орташаланды, нәтижелер орташа ± стандартты қателік ретінде ұсынылды. IED тіркелген барлық SEEG арналары ескерілді. Оқиғадан кейінгі әрбір уақыт аралығы үшін топтық нормализделген IED көрсеткіштері бір жақты Манн — Уитни тесттері арқылы бастапқы базалық мәндермен салыстырылды, бұл ретте p &amp;lt; 0.05 кезіндегі статистикалық маңызды аралықтар графиктерде жұлдызшалармен белгіленді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Манн — Уитни тесті — бұл деректердің қалыпты бөлінуін талап етпей, екі тәуелсіз топты салыстыруға арналған параметрлік емес статистикалық әдіс.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ояну ұзақтығы мен IED жиілігі арасындағы байланысты бағалау үшін оңға қисық үздіксіз айнымалыларды модельдеуге қолайлы гамма-үлестірілімі мен логарифмикалық байланыстыру функциясы бар жалпыланған сызықтық аралас модель (GLMM) қолданылды. Тәуелсіз айнымалы ретінде ояну ұзақтығы секундпен, ал тәуелді айнымалы ретінде арна бойынша толық ояну кезіндегі IED нормализделген саны немесе секундтағы IED жиілігі алынды. Базалық мәні нөл болуына байланысты анықталмаған мәндері бар оянулар GLMM талдауынан шығарылып тасталды. Пациенттер арасындағы айырмашылықтарды және қайталанатын өлшеулерді ескеру үшін модельге пациенттің ID нөмірі кездейсоқ қиылысу ретінде енгізілді.&lt;/p&gt;\n&lt;h4 id=\"talamus-pen-khyrtys-arasyndaghy-bajlanystardy-taldau\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#talamus-pen-khyrtys-arasyndaghy-bajlanystardy-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Таламус пен қыртыс арасындағы байланыстарды талдау&lt;/span&gt;&lt;/a&gt;Таламус пен қыртыс арасындағы байланыстарды талдау&lt;/h4&gt;\n&lt;p&gt;Зерттеушілер сонымен қатар таламустың спектрлік белсенділігі ояну кезіндегі IED өзгерістерімен байланысты екенін тексеріп, таламусқа SEEG электродтары орнатылған төрт пациентке шағын топтық талдау жүргізді. Бұл пациенттерде N2 ұйқы фазасы кезінде пайда болған барлығы 56 туындатылған ояну жағдайы қарастырылды. Әрбір ояну үшін биполярлық байланысқан таламус контактілері арқылы 3 секундтық ояну дәуіріндегі таламустың спектрлік қуат қатынасы δ/(θ+α+β) ([0.5-4 Гц]/[4.5-30 Гц]) есептелді. Баяу және жылдам таламустық белсенділіктің қатынасын көрсететін бұл көрсеткіш стимулға дейінгі 3 секундтық базалық кезеңге нормализделді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Спектрлік қуат пен дельта-ритмдер терең ұйқы фазаларына тән нейрондардың синхрондалған белсенділігін білдірсе, жылдам ырғақтар ояну және когнитивтік белсенділікпен байланысты.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;IED саны сол 3 секундтық ояну кезеңінде барлық SEEG арналарынан алынып, арналар санына да, стимулға дейінгі базалық деңгейге де нормализделді. Содан кейін таламустың спектрлік қуат қатынасы нормализделген IED санын болжай алатынын тексеру үшін гамма-үлестірілімі мен логарифмикалық байланысы бар GLMM қолданылды. Модель таламустың спектрлік қуат қатынасын тіркелген әсер (fixed effect) ретінде және пациент ID-ін кездейсоқ қиылысу ретінде қамтыды. Модель бағалаулары β ±  SE түрінде берілді, статистикалық маңыздылық Вальд тесттері арқылы (P &amp;lt; 0.05) бағаланды, ал нәтижелер 95% сенім интервалдарымен толықтырылды. Стимуляция туындатқан ұйқының фрагментациясы мен қалпына келу ұйқысы арасындағы жалпы IED жиілігі мен ояну жиілігін салыстыру үшін Клифф дельтасы (Cliff's d) арқылы әсер өлшемдері есептелді. Барлық статистикалық талдаулар α = 0.05 маңыздылық шегінде жүргізілді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-f1.jpg\" alt=\"1-сурет. Түнгі SEEG-PSG жазбалары кезіндегі ұйқыны фрагментациялау хаттамасына шолу. (a) Дәріге төзімді фокальды эпилепс\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Түнгі SEEG-PSG жазбалары кезіндегі ұйқыны фрагментациялау хаттамасына шолу. (a) Дәріге төзімді фокальды эпилепсиясы бар, хирургиялық алдындағы тексеруден өтіп жатқан пациенттердің түнгі ұйқысы кезінде синхрондалған SEEG және ұйқы (PSG) жазбалары алынды. SEEG электродтары диагностикалық тексерудің бір бөлігі ретінде әр пациенттің клиникалық талаптарына сәйкес имплантацияланды. PSG стандартты халықаралық 10-20 жүйесіне сәйкес орналастырылған бас терісінің субдермальды ЭЭГ жазбаларын, сондай-ақ иек және үлкен жіліншік бұлшықеттерінің (LFlex/RFlex) беткейлік электроокулографиясын (EOG) және электромиографиясын (EMG) қамтыды. (b) Ұйқының фрагментациясы ұйқының бірінші жартысында, пациенттің әдеттегі ұйықтау уақытынан бастап, тұрақты NREM ұйқысы кезінде 40 пен 100 дБ аралығындағы қарқындылықтағы 5 секундтық, 1 кГц дыбыстық сигналдарды беру арқылы туындады. Аудиостимуляция толық оятпай сергектік тудыру үшін нақты уақыттағы PSG ұйқы бағалаулары негізінде құлаққаптар арқылы қолмен берілді. (c) Сергектік PSG жазбаларын қолдана отырып офлайн режимінде белгіленді; егер оқиға стимул басталғаннан кейін 6.5 с ішінде басталса, ол «туындаған сергектік» ретінде жіктелді. Ұстамааралық эпилепсиялық разрядтардың (IED) саны мен таралуы 3 секундтық дәуірлер бойынша салыстырылды: стимулға дейінгі бастапқы деңгей және стимул басталғаннан кейінгі терезе. Сергектік тудырған стимулдар үшін стимул басталғаннан кейінгі терезе сергектіктің басталу сәтінен басталды. Сергектік тудырмаған стимулдар үшін ол стимул басталғаннан кейін 1.08 с өткен соң басталды, бұл стимулдан сергектіктің басталуына дейінгі медиандық латенттілікке сәйкес келеді (латенттілігі сәйкестендірілген бақылау терезесі).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-f2.jpg\" alt=\"2-сурет. Аудиостимуляция эпилепсиямен ауыратын пациенттерде туындаған сергектіктер мен ұйқы фрагментациясын сенімді түрд\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет. Аудиостимуляция эпилепсиямен ауыратын пациенттерде туындаған сергектіктер мен ұйқы фрагментациясын сенімді түрде тудырады. (a) Барлық пациенттерде түнгі SEEG-PSG жазбалары кезіндегі жалпы ұйқы уақыты (TST). (b) Әр қатысушыда аудиостимуляция хаттамасы арқылы туындаған сергектіктердің жалпы саны. (c) Әр қатысушыда туындаған сергектіктерге әкелген стимулдардың пайызы. (a-c) панельдеріндегі қызыл үзіл сызық топтың орташа мәнін көрсетеді. (d) Барлық пациенттер бойынша жинақталған, сергектіктерді туындату үшін қолданылған дыбыстық стимул көлемдерінің бөлінуі. 90 дБ туындаған сергектіктерді туындату үшін е жиі қолданылған көлем болды. (e) NREM 2-сатысы (N2) және 3-сатысы (N3) ұйқысы ретінде бағаланған дәуірлер кезіндегі әр қатысушыдағы туындаған сергектіктер саны. Тұрақты ұйқы күйін жіктеуді қамтамасыз ету үшін сатылар арасындағы ауысуларды қамтитын сергектіктер сатыға тән есептеулерден шығарылды. (f) Ұйқы түнінің бірінші және екінші жартысында, дыбыс әсерінен туындаған сергектіктерді де, аудиостимуляцияға тәуелсіз өздігінен пайда болатын сергектіктерді де қоса алғанда, сергектіктің жалпы жиілігі. Аудиостимуляция хаттамасы қолданылған түннің бірінші жартысында едәуір көп сергектіктер орын алды (Уилкоксонның таңбалы рангтер тесті, p = 0.00118, Клифф d = 0.46). Деректер жеке пациент мәндері ретінде ұсынылған. Визуалды салыстыру үшін самай бөлігінің эпилепсиясы (TLE; сары шеңберлер) және экстратемпоральды эпилепсиясы (ETLE; қою көк шеңберлер) бар пациенттер ажыратылған. Түннің бірінші және екінші жартысында TLE және ETLE топшалары арасында сергектік жиіліктерінде тұрақты айырмашылықтар байқалмады. Бұл нәтижелер эпилепсиясы бар пациенттерде аудиостимуляция хаттамасының тиімділігін растады.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-f3.jpg\" alt=\"3-сурет. Туындаған ұйқы сергектіктері ұстамааралық эпилепсиялық разрядтардың (IED) санын арттырады, бірақ олардың таралу\" /&gt;&lt;/p&gt;\n&lt;p&gt;*3-сурет. Туындаған ұйқы сергектіктері ұстамааралық эпилепсиялық разрядтардың (IED) санын арттырады, бірақ олардың таралуын арттырмайды. (a) Бас терісінің ЭЭГ, электроокулография (EOG) және иек пен үлкен жіліншік (LFlex) арналарының электромиографиясын (EMG) көрсететін бір пациенттің полисомнография (PSG) іздерінің өкілдік мысалы. Сары боялған аймақ қызыл сызықпен көрсетілген дыбыстық стимул арқылы туындаған сергектікті көрсетеді. (b) Солақай самай бөлігіне бағытталған терең электродтан (биполярлы арналар LTP1-LTP10) бірдей уақыт терезесінен сәйкес SEEG іздері. Аудиостимуляциядан кейін сергектік кезеңінде (сары боялған аймақ) IED-тің айтарлықтай өсуі байқалады. (c) Стандартты ми үлгісіне прокцияланған барлық пациенттер бойынша (n = 17 пациент) SEEG контактілерінің кеңістіктік бөлінісі. (d) Стимулға дейінгі IED санына және стимул қарқындылығына түзетілген, бақылау және туындаған сергектік жағдайларындағы арна-дәуір үшін модель болжаған орташа IED саны. Болжанған IED саны туындаған сергектіктер кезінде бақылау жағдайларына қарағанда едәуір жоғары болды (жалпыланған сызықтық аралас әсерлер моделі (GLMM), β-бағалау ± стандартты қате (SE): 0.537 ± 0.012, оқиғалар жиілігінің қатынасы (IRR) = 1.71, p &amp;lt; 0.0001), бұл бақылауға қарағанда 71% өсуге сәйкес келеді. (e) Стимулға дейінгі таралу арналарының санына және стимул қарқындылығына түзетілген, бақылау және туындаған сергектік жағдайларындағы әр дәуір үшін модель болжаған IED таралу арналарының саны. Таралу арналарының саны туындаған сергектіктер мен бақылау арасында айтарлықтай ерекшеленбеді (GLMM, β-бағалау ± SE: 0.212 ± 0.408, IRR = 1.24, P = 0.604). Қате сызықтары 95% сенімділік интервалдарын білдіреді. **&lt;em&gt;p &amp;lt; 0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-f4.jpg\" alt=\"4-сурет. Ұстамааралық эпилепсиялық разрядтардың (IED) сергектікке байланысты өсуі неокортикальды аймақтарда орын алады, \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет. Ұстамааралық эпилепсиялық разрядтардың (IED) сергектікке байланысты өсуі неокортикальды аймақтарда орын алады, бірақ мезиотемпоральды аймақтарда орын алмайды. (a) Өңірлік талдау үшін қолданылатын екі анатомиялық санатты көрсететін схема: мезиотемпоральды (жасыл) және неокортикальды (қызғылт сары) аймақтар салыстырылды. (b) Мезиотемпоральды (жасыл) және неокортикальды (қызғылт сары) контакт орналасқан жерлерін көрсететін, стандартты ми үлгісіне прокцияланған барлық пациенттер бойынша (n = 17 пациент) SEEG контактілерінің кеңістіктік бөлінісі. (c) Стимулға дейінгі IED санына және стимул қарқындылығына түзетілген, бақылау және туындаған сергектік жағдайларындағы анатомиялық аймақ бойынша (мезиотемпоральды және неокортикальды) арна-дәуір үшін модель болжаған орташа IED саны. Жағдай мен анатомиялық аймақ арасындағы өзара әсерлесу маңызды болды (жалпыланған сызықтық аралас әсерлер моделі (GLMM), β-бағалау ± стандартты қате (SE): 0.737 ± 0.041, оқиғалар жиілігінің қатынасы (IRR) = 2.09, p &amp;lt; 0.0001), бұл туындаған сергектіктердің IED санына әсері мезиотемпоральды және неокортикальды аймақтар арасында ерекшеленетінін көрсетеді. Мезиотемпоральды аймақтарда (n = 14 пациент) болжанған IED саны туындаған сергектіктер мен бақылау арасында айтарлықтай ерекшеленбеді (GLMM, β-бағалау ± SE: -0.087 ± 0.039, IRR = 0.92, P = 0.054). Неокортикальды аймақтарда (n = 17 пациент) болжанған IED саны туындаған сергектіктер кезінде бақылауға қарағанда едәуір жоғары болды (GLMM, β-бағалау ± SE: 0.650 ± 0.013, IRR = 1.92, p &amp;lt; 0.0001), бұл 92% өсуге сәйкес келеді. Қате сызықтары 95% сенімділік интервалдарын білдіреді. *** p &amp;lt; 0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-f5.jpg\" alt=\"5-сурет. Ұстамааралық эпилепсиялық разрядтардың (IED) сергектікке байланысты өсуі ұстаманың басталу аймағымен (SOZ) моду\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет. Ұстамааралық эпилепсиялық разрядтардың (IED) сергектікке байланысты өсуі ұстаманың басталу аймағымен (SOZ) модуляцияланбайды. (a) SEEG контактілерінің анатомиялық жіктелуін көрсететін схема: SOZ аймақтарында (қызыл) және SOZ емес аймақтарда (көк) пайда болатын IED салыстырылды. (b) SOZ (қызыл) және SOZ емес (көк) контакт орналасқан жерлерін көрсететін, анықталған SOZ бар барлық пациенттер бойынша (n = 12) стандартты ми үлгісіне прокцияланған SEEG контактілерінің кеңістіктік бөлінісі. (c) Стимулға дейінгі IED санына және стимул қарқындылығына түзетілген, бақылау және туындаған сергектік жағдайларындағы SOZ күйі бойынша (SOZ сыртында және ішінде) арна-дәуір үшін модель болжаған орташа IED саны. Жағдай мен SOZ күйі арасындағы өзара әсерлесу маңызды болмады (жалпыланған сызықтық аралас әсерлер моделі (GLMM), β-бағалау ± стандартты қате (SE): 0.005 ± 0.026, оқиғалар жиілігінің қатынасы (IRR) = 1.00, P = 1.00), бұл туындаған сергектіктердің IED санына әсері SOZ ішіндегі және сыртындағы контактілер арасында ерекшеленбегенін көрсетеді. Қате сызықтары 95% сенімділік интервалдарын білдіреді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-f6.jpg\" alt=\"6-сурет. Оятуға байланысты интердиктальды эпилептиформдық разрядтардың (ИЭР) көбеюі ұйқы сатысына байланысты. (a) Слухов\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сурет. Оятуға байланысты интердиктальды эпилептиформдық разрядтардың (ИЭР) көбеюі ұйқы сатысына байланысты. (a) Слуховая стимуляция протоколы жүргізілген, әр пациенттің әдеттегі ұйықтау уақытынан кейінгі алғашқы 4 сағат ретінде анықталған түннің бірінші жартысында NREM 2-сатысы (N2) мен 3-сатысы (N3) ерекше көрсетілген схемалық гипнограммалар. N2 және N3 ұйқы кезінде пайда болатын туындаған оянулар (арузолдар) ұйқы сатысының ояту арқылы туындаған интердиктальды эпилептиформдық разрядтарға (ИЭР) әсерін бағалау үшін салыстырылды. (b) Стимулға дейінгі ИЭР саны мен стимул қарқындылығына түзетілген, бақылау және туындаған ояну жағдайларындағы ұйқы сатысы (N2 және N3 ұйқы) бойынша арна-эпох үшін модель болжаған орташа ИЭР саны. Жағдай мен ұйқы сатысы арасындағы өзара әрекеттесу маңызды болды (жалпыланған сызықтық аралас әсерлер моделі (GLMM), β-бағалау ± стандартты қате (SE): -0.271 ± 0.031, инциденттер жиілігінің қатынасы (IRR) = 0.76, p &amp;lt; 0.0001), бұл туындаған оянулардың ИЭР санына әсері N2 және N3 ұйқыда әртүрлі болғанын көрсетеді, бұл N2-мен салыстырғанда N3-те 24%-ға аз өсуге сәйкес келеді. N2 ұйқысында (n = 16 пациент) болжанған ИЭР саны туындаған оянулар кезінде бақылауға қарағанда едәуір жоғары болды (GLMM, β-бағалау ± SE: 0.718 ± 0.017, IRR = 2.05, p &amp;lt; 0.0001). N3 ұйқысында (n = 13 пациент) болжанған ИЭР саны да туындаған оянулар кезінде бақылауға қарағанда едәуір жоғары болды, дегенмен N2-ге қарағанда кішірек амплитудамен (GLMM, β-бағалау ± SE: 0.447 ± 0.026, IRR = 1.56, p &amp;lt; 0.0001). Қате сызықтары 95% сенім интервалдарын көрсетеді. *** p &amp;lt; 0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-f7.jpg\" alt=\"7-сурет. Интердиктальды эпилептиформдық разрядтар (ИЭР) оқшауланған баяу толқындардан гөрі, ең алдымен ояну реакцияларым\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-сурет. Интердиктальды эпилептиформдық разрядтар (ИЭР) оқшауланған баяу толқындардан гөрі, ең алдымен ояну реакцияларымен (арузолдармен) шақырылады, ал стимулға дейінгі дельта-белсенділік жағдайға тән модуляциялаушы әсер көрсетеді. (a) Оқшауланған баяу толқындарға және баяу толқындары бар арузолдарға әкелген есту стимулдарына дейінгі спектрлік қуат қатынасының таралуын көрсететін гистограммалар (δ/(θ+α+β) ((0.5–4 Гц)/(4.5–30 Гц), логарифмдік түрлендірілген 10 негізі бойынша). (b) Стимул қарқындылығы мен стимулға дейінгі базалық ИЭР санына түзетілген, стимулға ояну реакциясының ықтималдығының стимулға дейінгі спектрлік қуат қатынасына тәуелділігі ретінде модель болжаған ықтималдық. Стимулға дейінгі спектрлік қуат қатынасы оқшауланған баяу толқын реакциясына қатысты ояну реакциясының ықтималдығымен байланысты болмады (жалпыланған сызықтық аралас әсерлер моделі (GLMM), β-бағалау ± стандартты қате (SE): 0.032 ± 0.014, P = 0.052). (c) Оқшауланған баяу толқындар мен баяу толқындары бар арузолдар үшін модель болжаған орташа ИЭР саны. Баяу толқындары бар арузолдар оқшауланған баяу толқындармен салыстырғанда едәуір жоғары ИЭР санымен байланысты болды (GLMM, β-бағалау ± SE: 0.542 ± 0.012, инциденттер жиілігінің қатынасы (IRR) = 1.72, p &amp;lt; 0.0001), бұл ИЭР санының 72%-ға өсуіне сәйкес келеді. (d) Жауап түрі мен стимулға дейінгі спектрлік қуат қатынасы арасындағы өзара әрекеттесу де маңызды болды (GLMM, β-бағалау ± SE: -0.073 ± 0.013, IRR = 0.93, p &amp;lt; 0.0001). Постхок қарапайым көлбеулер талдауы жоғарырақ стимулға дейінгі спектрлік қуат қатынасы оқшауланған баяу толқындар кезінде ИЭР санын едәуір арттырғанын көрсетті (GLMM, β-бағалау ± SE = 0.066 ± 0.009, IRR = 1.07, p &amp;lt; 0.0001), бұл стимулға дейінгі спектрлік қуат қатынасының әрбір 1.0 артуына ИЭР санының 7%-ға өсуіне сәйкес келеді. Керісінше, стимулға дейінгі спектрлік қуат қатынасы арузол қоздырылғаннан кейін ИЭР санына әсер етпеді (GLMM, β-бағалау ± SE = -0.007 ± 0.012, IRR = 0.99, P = 1). Қате сызықтары мен көлеңкеленген аймақтар 95% сенім интервалдарын көрсетеді. *** p &amp;lt; 0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-f8.jpg\" alt=\"8-сурет. Туындаған оянулар кезіндегі интердиктальды эпилептиформдық разрядтардың (ИЭР) уақытша динамикасы. (a-c) Әрбір п\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-сурет. Туындаған оянулар кезіндегі интердиктальды эпилептиформдық разрядтардың (ИЭР) уақытша динамикасы. (a-c) Әрбір пациенттің максималды мәніне нормаланған (бин ені: 500 мс) және барлық пациенттер бойынша орташаланған, топтық деректер орташа ± стандартты қате ретінде ұсынылған, арузол мен есту стимулының басталуына қатысты ИЭР уақытша таралуын көрсететін топтық деңгейдегі гистограммалар. Басталуына дейінгі базалық кезеңдегі ИЭР саны бір жақты Манн-Уитни тестілері көмегімен басталудан кейінгі әрбір бинмен салыстырылды (n = 17 пациент, маңызды биндер (p &amp;lt; 0.05) жұлдызшалармен көрсетілген). (a) Туындаған оянулар басталғаннан кейін ИЭР саны едәуір артты (қызыл үзік сызық), ояну басталғаннан кейін 0.5-1 с өткенде шыңына жетті. (b) Есту стимулдарының басталуына тураланған кезде, ИЭР саны туындаған оянулар кезінде қайтадан едәуір артты, стимул басталғаннан кейін 2-2.5 с өткенде шыңына жетті. Үстіне қойылған қара қисық сызық (оң жақ ось) уақыт өте келе белсенді оянулардың пайызын көрсетеді. (c) Бақылау (оятпайтын) есту стимулдары кезінде стимул басталғаннан кейін ИЭР санының ешқандай маңызды модуляциясы байқалмады, бұл (b)-де байқалған ИЭР көбеюі туындаған оянуларға тән екенін көрсетеді. (d) Әрбір пациенттегі SEEG контактілерінің саны бойынша нормаланған ИЭР саны ояну ұзақтығымен бірге едәуір артты (жалпыланған сызықтық аралас әсерлер моделі (GLMM), β-бағалау ± стандартты қате (SE): секундына 0.078 ± 0.006, p &amp;lt; 0.0001), бұл ұзағырақ оянулардың үлкен ИЭР санымен байланысты екенін растайды. (e) Керісінше, ИЭР жиілігі ояну ұзақтығымен бірге едәуір төмендеді (GLMM, β-бағалау ± SE: –0.051 ± 0.006 секундына, p &amp;lt; 0.0001), бұл ұзағырақ оянулар көбірек ИЭР қамтығанымен, олар ояну барысында біртіндеп баяулайтын жиілікте болатынын көрсетеді. (f) Таламикалық спектрлік белсенділік оянуға байланысты ИЭР санымен байланысты. Таламикалық SEEG электродтары бар төрт пациенттегі шағын топтық талдау (N2 ұйқы кезінде n = 56 ояну) жоғарырақ таламикалық спектрлік қуат қатынасы (δ/(θ+α+β) ((0.5–4 Гц)/(4.5–30 Гц))) төменірек нормаланған ИЭР санымен байланысты екенін көрсетті (GLMM, β-бағалау ± SE: спектрлік қуат қатынасының әрбір 1.0 артуына –0.081 ± 0.035, P = 0.022), бұл ояну кезінде жылдамырақ таламикалық ырғақтарға ауысу үлкен интердиктальды спайктермен байланысты екенін көрсетеді. (d-f) панельдеріндегі әрбір нүкте пациенттер бойынша біріктірілген бір ояну оқиғасын білдіреді, ал көлеңкеленген аймақтар модель фитінің айналасындағы 95% сенім интервалдарын білдіреді.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ұйқы тұрақсызд&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ығының әсері&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;СЭЭГ және&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;дыбыстық&lt;/te
