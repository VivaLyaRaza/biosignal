            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"272\" cy=\"70\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"548\" cy=\"276\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Үзілісті ұйқы мидағы&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;эпилепсиялық дүмпулерді&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;қалай қоздырады&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-f1.jpg\" alt=\"1-сурет. Түнгі SEEG-PSG жазбалары кезіндегі ұйқыны фрагментациялау хаттамасына шолу. (a) Дәріге төзімді фокальды эпилепс\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Түнгі SEEG-PSG жазбалары кезіндегі ұйқыны фрагментациялау хаттамасына шолу. (a) Дәріге төзімді фокальды эпилепсиясы бар, хирургиялық алдындағы тексеруден өтіп жатқан пациенттердің түнгі ұйқысы кезінде синхрондалған SEEG және ұйқы (PSG) жазбалары алынды. SEEG электродтары диагностикалық тексерудің бір бөлігі ретінде әр пациенттің клиникалық талаптарына сәйкес имплантацияланды. PSG стандартты халықаралық 10-20 жүйесіне сәйкес орналастырылған бас терісінің субдермальды ЭЭГ жазбаларын, сондай-ақ иек және үлкен жіліншік бұлшықеттерінің (LFlex/RFlex) беткейлік электроокулографиясын (EOG) және электромиографиясын (EMG) қамтыды. (b) Ұйқының фрагментациясы ұйқының бірінші жартысында, пациенттің әдеттегі ұйықтау уақытынан бастап, тұрақты NREM ұйқысы кезінде 40 пен 100 дБ аралығындағы қарқындылықтағы 5 секундтық, 1 кГц дыбыстық сигналдарды беру арқылы туындады. Аудиостимуляция толық оятпай сергектік тудыру үшін нақты уақыттағы PSG ұйқы бағалаулары негізінде құлаққаптар арқылы қолмен берілді. (c) Сергектік PSG жазбаларын қолдана отырып офлайн режимінде белгіленді; егер оқиға стимул басталғаннан кейін 6.5 с ішінде басталса, ол «туындаған сергектік» ретінде жіктелді. Ұстамааралық эпилепсиялық разрядтардың (IED) саны мен таралуы 3 секундтық дәуірлер бойынша салыстырылды: стимулға дейінгі бастапқы деңгей және стимул басталғаннан кейінгі терезе. Сергектік тудырған стимулдар үшін стимул басталғаннан кейінгі терезе сергектіктің басталу сәтінен басталды. Сергектік тудырмаған стимулдар үшін ол стимул басталғаннан кейін 1.08 с өткен соң басталды, бұл стимулдан сергектіктің басталуына дейінгі медиандық латенттілікке сәйкес келеді (латенттілігі сәйкестендірілген бақылау терезесі).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Түнгі ұйқының сапасы эпилепсиямен ауыратын адамдардың ми жұмысының тұрақтылығына тікелей әсер етеді. Дыбыс арқылы жасалған тәжірибелер әрбір қысқа ояну патологиялық разрядтардың өсуін тудыратынын көрсетті. Бұл ретте ұстама ошағы кеңеймейді, бірақ нашар ұйқы когнитивтік функцияларды нашарлатады.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Ұйқыдағы микрооянулар эпилепсиялық разрядтардың санын күрт арттырады.&lt;/li&gt;\n&lt;li&gt;Бұл әсер неокортексте және баяу ұйқының екінші сатысында айқын көрінеді.&lt;/li&gt;\n&lt;li&gt;Жергілікті нейрон қозуы артады, бірақ разрядтар кеңге таралмайды.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеушілер ұйқы тұрақсыздығы мен ұстамааралық эпилептиформдық разрядтардың (IED) өзара байланысын зерделеді. Ол үшін стереоэлектроэнцефалография (СЭЭГ, ми белсенділігін жіңішке электродтар арқылы тіркеу әдісі) пен полисомнография деректері біріктірілді. Дәрілік терапияға көнбейтін фокальды эпилепсиясы бар 17 пациент қатысқан сынақта түнгі ұйқының алғашқы сағаттарында 3-15 секундтық микрооянулар тудырылды.&lt;/p&gt;\n&lt;p&gt;Нәтижелер бұл жасанды оянулардың эпилептиформдық разрядтар санының күрт өсуіне әкелетінін көрсетті. Бұл әсер тек неокортексте және баяу ұйқының екінші мен үшінші сатыларында байқалды. Разрядтардың кеңістікте таралу ауқымы өзгермегенімен, жергілікті қозу күшейді. Бұл ұйқы тұрақтылығы мидың патологиялық белсенділігін бақылауда маңызды рөл атқаратынын дәлелдейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу ауыр дәрілік эпилепсиясы бар стационардағы пациенттердің шағын топтарында жүргізілді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Ұйқы мен эпилепсиялық белсенділік өзара күрделі байланыста, алайда адам миында патологиялық разрядтарды қоздыру мен реттеудегі ұйқы тұрақсыздығының себептік рөлі әлі де толық зерттелмеген. Авторлар мұны тікелей зерттей отырып, эпилепсиямен ауыратын науқастарда стереоэлектроэнцефалография және полисомнография жазбаларын біріктіре отырып, эксперименттік жолмен туындаған ұйқының микрооянулары мен ұстамааралық эпилепсиформдық разрядтар (IED) арасындағы жоғары дәлдіктегі уақытша байланысты сипаттады.&lt;/p&gt;\n&lt;p&gt;Зерттеу эпилепсиямен ауыратын науқастардан алынған стереоэлектроэнцефалография және полисомнография жазбаларын бірлесіп талдауға негізделген. Динамиканы бағалау үшін эксперименттік түрде туындатылған ұйқы микрооянуларының мидың түрлі анатомиялық аймақтары мен ұйқы сатыларындағы ұстамааралық эпилепсиформдық разрядтар жиілігіне уақытша тәуелділігін анықтау әдістері қолданылды.&lt;/p&gt;\n&lt;blockquote&gt;\n&lt;p&gt;[!tip] Стереоэлектроэнцефалография (сЭЭГ) — ми тіндерінің терең қабаттарына енгізілген электродтар арқылы электрлік белсенділікті тіркеу әдісі, ал полисомнография — ұйқы кезіндегі ми толқындарын, көз қозғалысын және бұлшықет тонусын кешенді зерттеу.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;p&gt;Ұйқы кезіндегі микрооянулар ұстамааралық эпилепсиформдық разрядтар жиілігінің жылдам өсуін туындатты, бұл ретте бұл әсер мидың анатомиялық аймағымен және нақты ұйқы сатысымен қатаң реттелді. Көрсеткіштердің өсуі тек неокортикалық аймақтармен шектеліп, N2 баяу толқынды ұйқы сатысында да, N3 сатысында да байқалды, сонымен қатар N2 сатысында үлкен әсер тіркелді. Айта кету керек, IED санының артуы ұстаманың басталу аймағы мен оны қоршаған аймақтар арасында ерекшеленген жоқ. Разрядтардың жалпы санының өскеніне қарамастан, микрооянулар олардың кеңістіктік таралуын өзгертпеді, бұл кеңірек эпилепсиялық желілерді тартпастан, жергілікті қыртыстық қозғыштықтың күшейетінін көрсетеді.&lt;/p&gt;\n&lt;blockquote&gt;\n&lt;p&gt;[!important] Ұйқыдағы микрооянулар неокортексте ұстамааралық эпилепсиформдық разрядтардың (әсіресе N2 сатысында) жылдам әрі жергілікті өсуіне әкеледі, бірақ олардың кеңістіктік таралу аймағын кеңейтпейді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;p&gt;Алынған нәтижелер ұйқы тұрақсыздығының уақытша және кеңістіктік ауқымда патологиялық белсенділікті белсенді түрде қоздырудағы себептік рөлін дәлелдейді. Сондай-ақ олар ұйқыны тұрақтандыруды эпилепсиялық жүктемені азайту және ми қыртысы желілерінің жұмысын сақтау үшін перспективалы терапиялық стратегия ретінде көрсетеді.&lt;/p&gt;\n&lt;blockquote&gt;\n&lt;p&gt;[!warning] Бұл жұмыс фармакорезистентті эпилепсиясы бар науқастардың инвазивті деректеріне негізделген, сондықтан қорытындыларды басқа популяцияларға жеке ерекшеліктерді ескермей тарату сақтықты талап етеді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Эпилепсиямен ауыратын науқастардың жартысынан көбі ұйқының сапасыздығы, ұйқысыздық және күндізгі шамадан тыс ұйқышылдық сияқты ұйқы бұзылыстарына тап болады. Бұл мәселелер өмір сапасын төмендетіп қана қоймай, ұстамаларды қоздырады, ал түнгі ұстамалар эпилепсияға байланысты өлімнің негізгі себебі болып табылатын кенеттен болатын қауіпті жағдайдың (SUDEP) қаупін арттырады. Бұрынғы зерттеулер ұйқы тұрақсыздығы мен эпилепсиялық белсенділік арасындағы тығыз байланысты анықтады, әсіресе жылдам емес көз қозғалысы (NREM) ұйқысының тұрақсыздығы кезінде және ЭЭГ-дегі 3-15 секундқа созылатын микрооянулар кезінде эпилепсиялық белсенділік жиі байқалады. Циклдік ауыспалы өрнек (CAP) және тыныс алудың бұзылуы сияқты оянумен байланысты жағдайлар ұстамалардың көбеюімен байланыстырылды.тереоэлектроэнцефалографияны (SEEG) қолданған ішкі зерттеулер эпилепсиялық белсенділіктің ояну ауытқуларымен байланысты екенін, яғни неокортикалық аймақтарда микрооянулар басталғанға дейін және ояну кезінде интерictal эпилепсиялық разрядтардың (IED) жиілігі артатынын көрсетті. Сондай-ақ бұл белсенділік терең N3 фазасына қарағанда жеңіл N2 ұйқы фазасында жиірек кездеседі. Дегенмен, маңызды олқылықтар қалады: әдебиеттердің көпшілігі бақылау сипатында, бұл себеп-салдарлық байланыстарды анықтауды қиындатады, ал бас сүйек ЭЭГ фокальды немесе терең эпилепсиялық белсенділікті байқамай қалуы мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эпилепсиямен ауыратын науқастардың жартысынан көбі ұйқының бұзылуынан зардап шегеді, бұл ұстамалардың жиілеуі мен SUDEP қаупіне тікелей әсер етеді, бірақ ұйқы тұрақсыздығының әсерін дәлелдейтін эксперименталды зерттеулер жетіспеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ujkhy-turakhsyzdyghy-men-epilepsiyany-zertteuding-eksperimentaldy-taesili\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#ujkhy-turakhsyzdyghy-men-epilepsiyany-zertteuding-eksperimentaldy-taesili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйқы тұрақсыздығы мен эпилепсияны зерттеудің эксперименталды тәсілі&lt;/span&gt;&lt;/a&gt;Ұйқы тұрақсыздығы мен эпилепсияны зерттеудің эксперименталды тәсілі&lt;/h4&gt;\n&lt;p&gt;Дәріге төзімді эпилепсиямен ауырып, хирургиялық операция алдындағы тексеруден өтіп жатқан науқастарда орындалатын стереоэлектроэнцефалография (SEEG) мидың терең құрылымдарына жоғары кеңістіктік-уақыттық ажыратымдылықпен қол жеткізуге мүмкіндік береді. Бас сүйек ЭЭГ, электромиография (ЭМГ) және электроокулографияны (ЭОГ) қамтитын полисомнографиямен (ПСГ) біріктіргенде, SEEG ұйқы тұрақтылығы мен эпилепсиялық белсенділік арасындағы уақытша динамиканы сипаттауға мүмкіндік береді. Бұл жұмыста авторлар дәріге төзімді фокальды эпилепсиясы бар науқастардың SEEG-ПСГ жазбаларын пайдалана отырып, ұйқы тұрақтылығын эксперименталды түрде басқарды. Микрооянуларды тудыру және ұйқы тұрақсыздығының бақыланатын ауытқуларын жасау үшін есту стимуляциясы қолданылды, содан кейін осы оқиғаларға дейін және олардың барысында IED саны мен таралуы салыстырылды. Бұл тәсіл адам миында IED пайда болуына оянумен байланысты ұйқы тұрақсыздығының тікелей әсерін бағалауға мүмкіндік берді. Интерictal желіге назар аудару желінің қоздырғыштығындағы шұғыл өзгерістерді анықтауға жоғары сезімталдық берді, өйткені IED сыртқы оқиғаларға дәл уақыт бойынша байланыстырылуы мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стереоэлектроэнцефалография (SEEG) — мидың терең құрылымдарына енгізілген электродтар көмегімен мидың электрлік белсенділігін тіркейтін инвазивті әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"oyanulardyng-epilepsiyalykh-belsendilikke-aeseri\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#oyanulardyng-epilepsiyalykh-belsendilikke-aeseri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оянулардың эпилепсиялық белсенділікке әсері&lt;/span&gt;&lt;/a&gt;Оянулардың эпилепсиялық белсенділікке әсері&lt;/h4&gt;\n&lt;p&gt;Зерттеушілер оянулар эпилепсиялық спайктарды күшейтіп, нейрондық желілердің жоғарылаған қозғыштығын көрсете отырып, олардың кеңірек таралуына ықпал етеді деген болжам жасады. Осы гипотезаны растай келе, ояну басталғаннан кейінгі кезеңдерде оянуға дейінгі кезеңдермен салыстырғанда ұстамааралық эпилептиформдық разрядтардың (IED) саны айтарлықтай өскені байқалды, бұл оянулардың эпилепсиялық динамикаға тікелей әсер ететінін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оянулар неокортексте және N2 пен N3 ұйқы сатыларында IED санының айтарлықтай өсуін тудырады, ең үлкен әсер N2 сатысында байқалады, ал разрядтардың кеңістікте таралуы өзгеріссіз қалады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторлар сонымен қатар бұл әсердің мидың нақты аймағына, ұстаманың басталу аймағының (SOZ) қатысуына және ұйқы сатысына байланысты екенін талдады. Неокортекстегі спайктардың саны медиотемпоральды аймақтарға қарағанда көбірек болады деп болжанды, өйткені неокортекск пен ұйқыны реттеуде орталық рөл атқаратын таламус арасындағы функционалдық байланыстар күштірек. Сондай-ақ оянулар мен эпилепсиялық белсенділік арасындағы байланыс ең күшті болатын N2 ұйқы сатысында үлкен әсер күтілді. Алынған нәтижелер бұл гипотезаларды толығымен растады: неокортексте, сондай-ақ N2 және N3 ұйқы сатыларында IED санының өсуі тіркеліп, N2-де әсер басым болды, бұл таламокортикалық контурлар мен ұйқы сатылары динамикасының маңызды рөлін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ұстамааралық эпилептиформдық разрядтар (IED) — бұл эпилепсиясы бар адамдарда ұстамалар арасындағы аралықта электроэнцефалограммада тіркелетін ми белсенділігінің үлгілері.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қызығы, оянуларға байланысты IED санының артуы ұстаманың басталу аймағы (SOZ) пен оны қоршаған тұлғалар арасында ерекшеленген жоқ, бұл SOZ-тің ояну тудырған қысқа мерзімді қоздырушы өзгерістерге таңдамалы түрде тартылмайтынын көрсетеді. IED жиілігіне әсерінен айырмашылығы, оянулар мұндай разрядтардың кеңістіктік таралуына әсер етпеді. Алынған деректердің жиынтығы ұйқы кезіндегі қысқа мерзімді оянулар IED таралуы үшін қажетті кеңірек желілік механизмдерді қоспастан, жергілікті кортикальды қозғыштықты таңдамалы түрде күшейтетінін және бұл байланыс мидың анатомиялық аймағы мен ұйқы сатыларына тәуелді екенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бақылаулар стационарлық мониторинг жағдайында дәрі-дәрмекке төзімді эпилепсиясы бар науқастардың қысқа мерзімді микробөліністеріне қатысты, бұл қорытындыларды эпилепсияның барлық түрлеріне қолдануда сақтықты талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Осылайша, бұл жұмыс ұйқы кезіндегі оянулар мен эпилепсиялық белсенділіктің жергілікті модуляциясы арасындағы байланыстың тікелей дәлелдерін ұсынады. Бұл ми жағдайының қысқа мерзімді ауытқулары эпилепсиялық динамикаға қалай әсер ететінінің қолданыстағы модельдерін нақтылауға көмектеседі және ұйқы тұрақтылығын адам миындағы патологиялық белсенділікті анықтайтын негізгі фактор ретінде атап көрсетеді.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"estu-stimulyaciyasy-epilepsiyamen-auyratyn-naukhastarda-ujkhynyng-fragmentaciyasy-men-mikrooyanulardy-tuyndatady\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#estu-stimulyaciyasy-epilepsiyamen-auyratyn-naukhastarda-ujkhynyng-fragmentaciyasy-men-mikrooyanulardy-tuyndatady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Есту стимуляциясы эпилепсиямен ауыратын науқастарда ұйқының фрагментациясы мен микрооянуларды туындатады&lt;/span&gt;&lt;/a&gt;Есту стимуляциясы эпилепсиямен ауыратын науқастарда ұйқының фрагментациясы мен микрооянуларды туындатады&lt;/h4&gt;\n&lt;p&gt;Ұйқы кезінде жасанды түрде туындаған микрооянулардың ұстамааралық белсенділікке әсерін бағалау үшін зерттеушілер алдымен өздері әзірлеген дыбыстық стимуляция хаттамасы пациенттерде ояну мен ұйқының фрагментациясын сенімді түрде қоздыратынына көз жеткізді. Зерттеуге фармрезистентті фокальды эпилепсиясы бар n = 17 науқас қатысты, оларға түнде стереоэлектроэнцефалография және полисомнография (SEEG-PSG) тіркеу жұмыстары жүргізілді. Түннің алғашқы төрт сағат ішінде тұрақты баяу ұйқы фазасында (NREM) әртүрлі қарқындылықтағы дыбыс сигналдары берілді. Бұл тексерілген әдіс пациентті толық оятпастан микрооянулар жиілігін арттыруға бағытталған және PSG деректері негізінде нақты уақыт режимінде бақыланды (1-сурет).&lt;/p&gt;\n&lt;p&gt;Қатысушылардың жалпы ұйқы уақыты (TST) орта есеппен 400.9 ± 89.9 мин құрады (ауқымы 214.5–542.0 мин) (2a-сурет, клиникалық мәліметтер S1-кестеде келтірілген). Дыбыстық әсер жалпы есеппен 440 туындаған микрооянуды тудырды, бұл бір қатысушыға орта есеппен 25.9 ± 9.8 оқиғаға сәйкес келеді (ауқымы 9–48) (2b-сурет). Берілген дыбыс сигналдарының орта есеппен 31.6 ± 17.2% (ауқымы 10.7–86.2%) сәтті түрде оянуларды туындатты (2c-сурет). Бұл ретте 90 дБ дыбыс қаттылығы ең көп қолданылды (2d-сурет), алайда дыбыс қарқындылығына реакция әртүрлі пациенттерде әрқалай болды (S1-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Полисомнография (PSG) және стерео-ЭЭГ (SEEG) — мидың электрлік белсенділігі мен ұйқы көрсеткіштерін тіркеудің кешенді әдістері, олар ұйқы құрылымы мен ояну сәттерін дәл қадағалауға мүмкіндік береді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Туындаған микрооянулардың орташа ұзақтығы 7.8 ± 3.3 с құрады (ауқымы 3–15 с) (S2a-сурет). Олар терең N3 ұйқы фазасына (5.2 ± 6.4, ауқымы 0–29) қарағанда N2 сатысында (14.7 ± 7.0, ауқымы 1–32) жиірек байқалды (2e-сурет). Айта кетерлік жайт, жалпы ояну жиілігі — дыбыстық стимуляцияға тәуелсіз пайда болатын спотанды оянуларды қоса алғанда — стимуляция жүргізілген түннің бірінші жартысында (27.0 ± 9.5 оқиға/сағат [медиана және квазиаралық ауқым], ауқымы 11.5–74.3 оқиға/сағат) екінші жартысымен салыстырғанда (18.0 ± 10.2 оқиға/сағат, ауқымы 5.8–52.4 оқиға/сағат) айтарлықтай жоғары болды (Вилкоксонның таңбалы рангтер тесті, p = 0.00118, Клифф d = 0.46, n = 17, 2f-сурет). Алынған нәтижелер таңдалған есту стимуляциясы әдісі осы топтағы ұйқының фрагментациясын тиімді түрде күшейткенін растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;17 эпилепсия науқасында ұйқы кезіндегі есту стимуляциясы әр адамға орта есеппен 25.9 ± 9.8 микрооянуды тудырып (стимулдардың 31.6%), түннің бірінші жартысында ұйқының фрагментациясын едәуір арттырды (27.0 пен 18.0 оқиға/сағат, p = 0.00118).&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"khozdyrylghan-oyanular-interiktaldy-epileptiformdy-razryadtardyng-sanyn-zhedel-tuerde-arttyrady,-birakh-olardyng-kengistiktik-taraluyn-arttyrmajdy\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#khozdyrylghan-oyanular-interiktaldy-epileptiformdy-razryadtardyng-sanyn-zhedel-tuerde-arttyrady,-birakh-olardyng-kengistiktik-taraluyn-arttyrmajdy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қоздырылған оянулар интериктальды эпилептиформды разрядтардың санын жедел түрде арттырады, бірақ олардың кеңістіктік таралуын арттырмайды&lt;/span&gt;&lt;/a&gt;Қоздырылған оянулар интериктальды эпилептиформды разрядтардың санын жедел түрде арттырады, бірақ олардың кеңістіктік таралуын арттырмайды&lt;/h4&gt;\n&lt;p&gt;Зерттеу барысында дыбыстық стимуляция арқылы туындаған ұйқының қысқа мерзімді оянуларының эпилепсиялық белсенділікке әсері бағаланды. Приступ аралық эпилептиформдық разрядтар (IED) валидацияланған детектор көмегімен биполярлы SEEG арналарында тіркелді. Талдауда қолданылған SEEG арналарының медиандық саны 2-ні құрады (интерквартильдік қашықтық, IQR 5; ауқымы 1–135) (S2b-сур.); пациенттердің түндегі IED жиілігі бойынша жалпы деректер S2-кестеде келтірілген. IED саны төрт жағдай бойынша 3 секундтық кезеңдерде есептелді: оянуды тудырған стимулдар үшін стимулға дейінгі және оянудан кейінгі терезелер, сондай-ақ оянуды тудырмаған дыбыстық стимулдар үшін бақылау терезелері (1c-сур.). Ояну мен бақылау жағдайларын салыстыру дыбыс әсерінен тәуелсіз түрде оянудың жергілікті разрядтарға тигізетін тікелей әсерін бөліп алуға мүмкіндік берді. Стимулға дейінгі кезеңдердің бастапқы деңгейді көрсететініне көз жеткізу үшін олар жалпыланған сызықтық аралас модельдер (GLMM) арқылы түн бойы кездейсоқ таңдалған оянусыз кезеңдермен салыстырылды. Айтарлықтай айырмашылықтар анықталған жоқ (GLMM, β-бағалау ± стандартты қате (SE): -0.052 ± 0.027, P = 0.053, S3-сур.).&lt;/p&gt;\n&lt;p&gt;Жағдайлар арасындағы приступ аралық спайк белсенділігінің өзгеруін анықтау үшін бастапқы IED деңгейі мен стимул қарқындылығы ескеріліп, GLMM қолданылды (n = 17 пациент, 3-сур.). Талдау жағдайдың айтарлықтай әсерін көрсетті: ояну кезінде болжанған IED саны бақылау көрсеткіштеріне қарағанда айтарлықтай жоғары болды (GLMM, β-бағалау ± SE: 0.537 ± 0.012, оқиғалар жиілігінің қатынасы (IRR) = 1.71, p &amp;lt; 0.0001), бұл бақылаумен салыстырғанда IED санының 71%-ға өскенін білдіреді (3d-сур.). Эпилепсия түрі және МРТ мәртебесі бойынша қосымша топтастырулар барлық топтарда ұқсас трендті көрсетті (S4-сур.). Стимул қарқындылығы ескеріліп, ояну алдындағы кезеңдер салыстырылған кезде айтарлықтай айырмашылықтар табылған жоқ (GLMM, β-бағалау ± SE: 0.019 ± 0.014, IRR = 1.02, P = 0.182, S5-сур.).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Туындаған оянулар приступ аралық эпилептиформдық разрядтардың санын 71%-ға (IRR = 1.71, p &amp;lt; 0.0001) және жоғары жиілікті тербелістерді 70%-ға арттырады, бірақ олардың кеңістіктік таралуына әсер етпейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SEEG (стереоэлектроэнцефалография) — мидың терең құрылымдарына электродтар енгізу арқылы оның электрлік белсенділігін тіркейтін инвазивті әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Спонтанды оянулар да IED санының біршама, бірақ маңызды өсуімен қатар жүрді (GLMM, β-бағалау ± SE: 0.046 ± 0.010 SE, IRR = 1.05, p &amp;lt; 0.0001, S6a-сур.). Жоғары жиілікті тербелістер (HFO) де зерттеліп, олардың болжанған саны ояну кезінде айтарлықтай жоғары екені анықталды (GLMM, β-бағалау ± SE: 0.530 ± 0.014, IRR = 1.70, p &amp;lt; 0.0001, S7-сур.), бұл IED үлгісін қайталай отырып, 70% өсімді көрсетті. Бұл нәтижелер оянулардың эпилепсиялық белсенділікті күрт күшейтетінін дәлелдейді.&lt;/p&gt;\n&lt;p&gt;Содан кейін зерттеушілер туындаған оянулардың IED санына ғана емес, сонымен қатар олардың кеңістіктік таралуына әсер ететінін тексерді (n = 17). Таралу арнасы ретінде бастапқы IED-тен 120 мс ішінде тіркелген кез келген SEEG арнасы есептелді. Таралу арналарының саны GLMM көмегімен модельденді. IED санына тигізетін әсерінен айырмашылығы, таралу арналарының саны оянулар мен бақылау жағдайлары арасында айтарлықтай ерекшеленген жоқ (GLMM, β-бағалау ± SE: 0.212 ± 0.408 SE, IRR = 1.24, P = 0.604, 3e-сур.). Спонтанды оянулар да таралу арналарының саны бойынша айтарлықтай айырмашылық көрсетпеді (GLMM, β-бағалау ± SE: 0.109 ± 0.317 SE, IRR = 1.12, P = 0.733, S6b-сур.). Демек, оянулар жергілікті қоздырғыштықты арттырып, приступ аралық белсенділікті күшейткенімен, кең ауқымды эпилепсиялық желілерді белсендіре алмайды.&lt;/p&gt;\n&lt;h4 id=\"zhalpy-interiktaldy-spajktanu-stimulyaciya-arkhyly-tuyndaghan-ujkhynyng-fragmentaciyasy-kezinde-zhogharylajdy\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#zhalpy-interiktaldy-spajktanu-stimulyaciya-arkhyly-tuyndaghan-ujkhynyng-fragmentaciyasy-kezinde-zhogharylajdy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жалпы интериктальды спайктану стимуляция арқылы туындаған ұйқының фрагментациясы кезінде жоғарылайды&lt;/span&gt;&lt;/a&gt;Жалпы интериктальды спайктану стимуляция арқылы туындаған ұйқының фрагментациясы кезінде жоғарылайды&lt;/h4&gt;\n&lt;p&gt;Зерттеушілер одан әрі оянудың жедел әсерлері эпилепсиялық ұстамалар арасындағы разрядтарға (IED) ұзақ уақыт аралығында әсер ететінін тексөрді. Ол үшін олар NREM ұйқы фазасы кезіндегі пациенттер деңгейіндегі жаһандық IED жиілігін салыстырды: түнгі уақыттың бірінші жартысында дыбыстық стимуляция ұйқының фрагментациясын тудырса, екінші жартысында қалпына келетін ұйқыға мүмкіндік беру үшін стимуляция тоқтатылған болатын. Стимуляция арқылы туындаған ұйқы фрагментациясы кезінде нормаланған IED жиілігі едәуір жоғары болды (0.80 ± 0.56 оқиға/мин, медиана және интерквартильдік ауқым, диапазон 0.32–1.50 оқиға/мин), стимуляциясыз кезеңдермен салыстырғанда (0.72 ± 0.48 оқиға/мин, диапазон 0.25–1.44 оқиға/мин) (Уилкоксонның таңбалы рангтер тесті, p = 0.017, Клифф d = 0.15, n = 17, 8a-Сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дыбыстық стимуляция тудырған ұйқы фрагментациясы түн бойы ұстамааралық разрядтар жиілігінің жалпы өсуіне әкеледі (0.80 қарсы 0.72 оқиға/мин, p = 0.017).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл заңдылық түн бойы кездейсоқ таңдалған оянусыз 3 секундтық базалық кезеңдерді талдау арқылы да расталды: стимуляция кезіндегі нормаланған IED саны стимуляция жоқ кезеңдерге қарағанда айтарлықтай жоғары болды (GLMM, β-бағалау ± стандартты қате: -0.112 ± 0.003, жиілік қатынасы = 0.89, p &amp;lt; 0.0001, 8b-Сурет). Бұл дыбыстық стимуляция тоқтатылған кезде IED санының 10.6%-ке төмендеуіне сәйкес келеді. Алынған нәтижелер дыбыстық стимуляция хаттамасы туындатқан ұйқы макроқұрылымының бұзылуы тікелей ояну терезесінен тыс ұзақ уақыт аралығында жаһандық IED белсенділігінің күшеюімен байланысты екенін көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"oyanu-arkhyly-tuyndajtyn-interiktaldy-spajktanu-anatomiyalykh-ajmakhkha-taeueldi\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#oyanu-arkhyly-tuyndajtyn-interiktaldy-spajktanu-anatomiyalykh-ajmakhkha-taeueldi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ояну арқылы туындайтын интериктальды спайктану анатомиялық аймаққа тәуелді&lt;/span&gt;&lt;/a&gt;Ояну арқылы туындайтын интериктальды спайктану анатомиялық аймаққа тәуелді&lt;/h4&gt;\n&lt;p&gt;Әрі қарай ғалымдар оянудан туындаған IED өсуі нақты анатомиялық аймаққа байланысты ма екенін анықтады. Ол үшін олар мезиотемпоральды SEEG контактілерінде (соның ішінде гиппокамп, парагиппокампальды қатпар, энторинальды қыртыс және бадамша дене) пайда болатын IED разрядтарын неокортекстегі разрядтармен салыстырды (4a, b-Сурет). Бұл салыстыру ұйқыны реттеудегі маңызды құрылым болып табылатын таламуспен әр түрлі механизмдер арқылы байланысқан мезиотемпоральды және неокортикальды аймақтардың жауабында айырмашылық бар-жоғын тексеруге мүмкіндік берді.&lt;/p&gt;\n&lt;p&gt;Талдау үшін зерттеушілер GLMM көмегімен әр арна-эпоха үшін IED санын модельдеді. Жағдай (туындаған ояну мен бақылау), анатомиялық аймақ (мезиотемпоральды және неокортикальды) және олардың өзара әрекеттесуі тұрақты әсерлер ретінде қарастырылды. Талдау жағдай мен анатомиялық аймақ арасында айтарлықтай өзара әрекеттесу бар екенін көрсетті (GLMM, β-бағалау ± SE: 0.737 ± 0.041, IRR = 2.09, p &amp;lt; 0.0001, 4c-Сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Туындаған оянулар неокортексте IED-тің күрт өсуін тудырады (+92%, p &amp;lt; 0.0001), ал мезиотемпоральды аймақтарда айтарлықтай өзгерістер байқалмайды (p = 0.054).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;≥ 3 мезиотемпоральды арнасы бар пациенттерде (n = 14) постхок-контрасттар мезиотемпоральды аймақтардағы болжанған IED саны туындаған оянулар мен бақылау арасында айтарлықтай ерекшеленбейтінін көрсетті (β-бағалау = -0.087 ± 0.039, IRR = 0.92, P = 0.054, 4c-Сурет). Керісінше, неокортексте (n = 17 пациент) бақылаумен салыстырғанда туындаған оянулар кезінде болжанған IED санының 92%-ке айтарлықтай өскені байқалды (β-бағалау = 0.650 ± 0.013, IRR = 1.92, p &amp;lt; 0.0001, 4c-Сурет).&lt;/p&gt;\n&lt;p&gt;Бұл аймақтық таңдамалылықтың спонтанды оянуларға да қатысты екенін бағалау үшін авторлар осындай GLMM құрылымын қолданды (9-Сурет). Алайда, туындаған оянулардан айырмашылығы, спонтанды оянулар бақылауға қарағанда мезиотемпоральды аймақтарда болжанған IED санының 27%-ке айтарлықтай төмендеуімен (β-бағалау = -0.320 ± 0.028, IRR = 0.73, p &amp;lt; 0.0001) және неокортексте 14%-ке шамалы өсуімен қатар жүрді (β-бағалау = 0.135 ± 0.011, IRR = 1.14, p &amp;lt; 0.0001).&lt;/p&gt;\n&lt;p&gt;Жоғары жиілікті осцилляциялар (HFO) үшін де осындай талдау жүргізіліп, туындаған оянулар үшін маңызды өзара әрекеттесу анықталды (GLMM, β-бағалау = 0.664 ± 0.050, IRR = 1.94, p &amp;lt; 0.0001, 10-Сурет). Мезиотемпоральды HFO санында бақылаумен айтарлықтай айырмашылық болмады (β-бағалау = -0.054 ± 0.048, IRR = 0.95, P = 0.511), ал неокортексте 84%-ке айтарлықтай өсім байқалды (β-бағалау = 0.610 ± 0.015, IRR = 1.84, p &amp;lt; 0.0001). Қорытындылай келе, оянумен байланысты ұстамааралық белсенділік тек неокортексте басым түрде артады, ал мезиотемпоральды аймақтар өзгеріссіз қалады.&lt;/p&gt;\n&lt;h4 id=\"oyanumen-bajlanysty-ustama-aralykh-spajk-belsendiligi-ustamanyng-bastalu-ajmaghymen-rettelmejdi\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#oyanumen-bajlanysty-ustama-aralykh-spajk-belsendiligi-ustamanyng-bastalu-ajmaghymen-rettelmejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оянумен байланысты ұстама аралық спайк белсенділігі ұстаманың басталу аймағымен реттелмейді&lt;/span&gt;&lt;/a&gt;Оянумен байланысты ұстама аралық спайк белсенділігі ұстаманың басталу аймағымен реттелмейді&lt;/h4&gt;\n&lt;p&gt;Зерттеушілер содан кейін ояну тудырған ұстама аралық эпилептиформды белсенділіктің (IED) өсуі стереоэлектроэнцефалография (SEEG) контактілері арасында ұстаманың басталу аймағының (SOZ) ішінде және сыртында ерекшеленетінін тексерді (5a, b-сур.). SOZ ұстама басталған кездегі ең ерте электрографиялық өзгерістер негізінде клиникалық түрде анықталды. Бұл салыстыру SOZ функционалдық электрографиялық құрылым ретінде оянуларға айналадағы аймақтарға қарағанда басқаша жауап беретінін немесе бұл өзгерістерге төзімді болып қалатынын анықтауға мүмкіндік берді. Кем дегенде n = 3 SEEG арнасында айқын клиникалық SOZ бар пациенттер үшін (n = 12) арна-эпоха başına IED саны жалпыланған сызықтық аралас модель (GLMM) арқылы модельденді. Шарт (туындатылған ояну және бақылау), SOZ күйі (SOZ сыртында және ішінде) және олардың өзара әрекеттесуі тіркелген әсерлер ретінде ескерілді, ынталандыруға дейінгі бастапқы IED саны мен стимул қарқындылығы түзетілді, сондай-ақ пациентке орнатылған SEEG контактілері үшін кездейсоқ қиылысулар қосылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;GLMM (жалпыланған сызықтық аралас модель) және IRR (жиіліктер қатынасы) — пациенттердің жеке ерекшеліктерін ескере отырып, күрделі медициналық деректерді талдау әдістері.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Талдау шарт пен SOZ күйі арасында елеулі өзара әрекеттесудің жоқтығын көрсетті (GLMM, β бағалауы ± SE: 0.005 ± 0.026, IRR = 1.00, P = 1.00, 5-сур.). Бұл туындатылған оянулардың IED санына әсері SOZ және SOZ емес аймақтар арасында айтарлықтай ерекшеленбегенін білдіреді. Өзара әрекеттесудің болмауына байланысты кейінгі салыстырулар жеке жүргізілген жоқ.&lt;/p&gt;\n&lt;p&gt;Спонтанды оянулар да шарт пен SOZ күйі арасында елеулі өзара әрекеттесуді көрсетпеді (GLMM, β бағалауы = -0.025 ± 0.021, IRR = 0.98, P = 0.940, SN 11-сур.). Жоғары жиілікті тербелістер (HFO) үшін де осындай заңдылық байқалды: туындатылған оянулар кезінде шарт пен SOZ күйі арасында елеулі өзара әрекеттесу болмады (GLMM, β бағалауы = -0.056 ± 0.030, IRR = 0.95, P = 0.239, SN 12-сур.). Бұл нәтижелер оянуға байланысты IED мен HFO қоса алғандағы ұстама аралық белсенділіктің өсуі SOZ ішінде де, сыртында да бірдей болатынын көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Ұстаманың басталу аймағы (SOZ) ояну кезіндегі эпилепсиялық жарқылдардың (IED және HFO) өсуін басқармайды — бұл өсім ми бойымен біркелкі жүреді (P = 1.00).&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"oyanugha-bajlanysty-ustama-aralykh-belsendilik-ujkhy-satysyna-taeueldi\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#oyanugha-bajlanysty-ustama-aralykh-belsendilik-ujkhy-satysyna-taeueldi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оянуға байланысты ұстама аралық белсенділік ұйқы сатысына тәуелді&lt;/span&gt;&lt;/a&gt;Оянуға байланысты ұстама аралық белсенділік ұйқы сатысына тәуелді&lt;/h4&gt;\n&lt;p&gt;Содан кейін ғалымдар оянулардың IED-ке әсері олардың орын алатын ұйқы сатысына байланысты екенін зерттеді. Олар нейрондық синхронизация мен кортикальды қоздырғыштықтың әртүрлі деңгейлерін көрсететін 2-ші (N2) және 3-ші (N3) баяу толқынды ұйқы кезіндегі оянуларды салыстырды (6a-сур.). N2 ұйқы ұршықтары мен К-комплекстерімен сипатталатын жеңіл саты болса, N3 жоғары амплитудалы, төмен жиілікті (0.5-2 Гц) дельта белсенділігімен және төмендеген кортикальды жауаппен ерекшеленеді. Ұқсас GLMM моделін қолдана отырып, шарт, ұйқы сатысы және олардың өзара әрекеттесуі бағаланды, сондай-ақ бастапқы IED саны мен стимул күшіне түзетулер жасалды. Нәтижесінде шарт пен ұйқы сатысы арасында айтарлықтай өзара әрекеттесу бары анықталды (GLMM, β бағалауы ± SE: -0.271 ± 0.031, IRR = 0.76, p &amp;lt; 0.0001, 6b-сур.).&lt;/p&gt;\n&lt;p&gt;Атап айтқанда, туындатылған оянуға байланысты IED санының өсуі N3 сатысында N2 сатысына қарағанда шамамен 24% аз болды. Кейιнгі салыстырулар болжамды IED саны бақылаумен салыстырғанда N2-де де (n = 16 пациент; β = 0.718 ± 0.017, IRR = 2.05, p &amp;lt; 0.0001, 6b-сур.), N3-те де (n = 13 пациент; β = 0.447 ± 0.026, IRR = 1.56, p &amp;lt; 0.0001, 6b-сур.) оянулар кезінде айтарлықтай жоғары екенін көрсетті, бірақ бұл өсім N2-де үлкенірек болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Жасанды туындатылған және табиғи спонтанды оянулардың ұйқы сатыларына қатысты әсерлері қарама-қайшы болуы мүмкін.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Спонтанды оянулар үшін де шарт пен ұйқы сатысы арасында елеулі өзара әрекеттесу табылды (GLMM, β бағалауы = 0.089 ± 0.029, IRR = 1.09, P = 0.0075, SN 13-сур.). Болжамды IED саны бақылауға қарағанда N2-де де (β = 0.143 ± 0.015, IRR = 1.15, p &amp;lt; 0.0001), N3-те де (β = 0.232 ± 0.025, IRR = 1.26, p &amp;lt; 0.0001) жоғары болды. Айта кетерлік жайт, спонтанды оянуларда IED санының өсуі N3-те N2-ге қарағанда 10% артық болды, бұл туындатылған оянуларға қарама-қайшы келеді.&lt;/p&gt;\n&lt;p&gt;HFO үшін де туындатылған ояну нәтижелеріне ұқсас жағдай байқалды: шарт пен ұйқы сатысы арасында елеулі өзара әрекеттесу бар (GLMM, β бағалауы = -0.275 ± 0.036, IRR = 0.76, p &amp;lt; 0.0001, SN 14-сур.). Болжалды HFO саны N2 (n = 16, β = 0.758 ± 0.020, IRR = 2.13, p &amp;lt; 0.0001) және N3-те (n = 13, β = 0.483 ± 0.030, IRR = 1.62, p &amp;lt; 0.0001) бақылауға қарағанда жоғары болып, N3-тегі өсім N2-ге қарағанда 24% аз болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Оянулар эпилепсиялық белсенділікті N2 және N3 ұйқы сатыларында да күшейтеді, бірақ туындатылған оянуларда бұл өсім N3-те 24% аз болса, спонтанды оянуларда керісінше, N3-те 10% артық болады.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қорытындылай келе, оянулар N2 және N3 ұйқы сатыларында эпилепсиялық белсенділікті арттырады, бірақ бұл әсердің салыстырмалы шамасы ұйқы сатысына байланысты. Туындатылған оянулар кезінде бұл әсер N3-ке қарағанда N2-де айтарлықтай үлкен болды, бұл N2 сатысының жоғары кортикальды қоздырғыштық күйін көрсетеді. Қызығы, бұл заңдылық спонтанды оянулар үшін керісінше болды.&lt;/p&gt;\n&lt;h4 id=\"stimulgha-zhauap-tueri-men-stimul-aldyndaghy-delta-belsendilikting-interiktaldy-spajktargha-aeseri\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#stimulgha-zhauap-tueri-men-stimul-aldyndaghy-delta-belsendilikting-interiktaldy-spajktargha-aeseri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Стимулға жауап түрі мен стимул алдындағы дельта-белсенділіктің интерiktалды спайктарға әсері&lt;/span&gt;&lt;/a&gt;Стимулға жауап түрі мен стимул алдындағы дельта-белсенділіктің интерiktалды спайктарға әсері&lt;/h4&gt;\n&lt;p&gt;Авторлар ояну кезіндегі эпилептиформды разрядтардың (IED) көбеюі тікелей оянудың өзімен немесе ілеспе баяу толқынды жауаппен байланысты екенін, сондай-ақ стимул алдындағы фоновое дельта-белсенділік электрфизиологиялық жауапқа әсер ететінін тексерді. Зерттеу IED өсуі тек қана жылдам оянуларға тән бе, әлде баяу тербелістердің стимул кезіндегі жалпы тұрақсыздығын көрсете ме деген сұраққа жауап берді. Бұл үшін жалпыланған сызықтық аралас модельдер (GLMM) қолданылды. Талдауға 17 пациент кірді, өйткені ЭЭГ-жауабы байқалмаған стимулдар тек 4 пациентте ғана кездесіп, шығарып тасталды. Стимул алдындағы спектрлік қуат қатынасы (δ / [θ + α + β], жиіліктері 0.5--4 Гц және 4.5--30 Гц) басты әсер ретінде бағаланды, мұнда стимул қарқындылығы мен бастапқы IED саны ескерілді, ал пациенттер ішіндегі SEEG контактілері үшін кездейсоқ қиылысулар енгізілді. Бұл қуат көрсеткішінің таралуы екі жауап түрі үшін де ұқсас болды (7a-сур.), бұл статистикалық тұрғыдан расталды: стимул алдындағы спектрлік қатынас ояну ықтималдығына әсер етпеді (GLMM, бағалау ± SE: 0.032 ± 0.014, P = 0.052, 7b-сур.).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GLMM (жалпыланған сызықтық аралас модель) — пациенттер мен контактілердің жеке ерекшеліктерін де, жалпы тенденцияларды да бір мезгілде ескеретін күрделі статистикалық талдау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Содан кейін GLMM көмегімен жауап түрінің IED санына әсері және дельта-белсенділіктің бұл байланысты реттеуші ретіндегі рөлі бағаланды. Модельге жауап түрі (оқшауланған баяу толқын және баяу толқынды ояну), дельта-қуат көрсеткіші және олардың өзара әрекеттесуі кіргізілді. Баяу толқынды оянулар оқшауланған баяу толқындармен салыстырғанда айтарлықтай жоғары IED санын көрсетті (GLMM, бағалау ± SE: 0.542 ± 0.012, IRR = 1.72, p &amp;lt; 0.0001, 7c-сур.), бұл IED санының 72%-Fез өсуіне сәйкес келеді. Жауап түрі мен дельта-қатынас арасындағы өзара әрекеттесу де маңызды болды (GLMM, бағалау \\pm SE: -0.073 \\pm 0.013, IRR = 0.93, p &amp;lt; 0.0001$, 7d-сур.), яғни дельта-белсенділік пен IED саны арасындағы байланыс жауап түріне тәуелді болды. Қосымша сараптау нәтижесінде оқшауланған баяу толқыннан кейін жоғары дельта-қуат үлкен IED санымен байланысты екені анықталды (бағалау = 0.066 ± 0.009, IRR = 1.07, p &amp;lt; 0.0001, 7d-сур.), бұл дельта-көрсеткіштің әрбір бірлік өсуіне IED-тің 7% көбеюін береді. Керісінше, оянудан кейін бастапқы дельта-белсенділік пен IED саны арасында байланыс байқалмады (бағалау = -0.007 ± 0.012, IRR = 0.99, P = 1, 7d-сур.). Демек, фоновое дельта-күйі тек ояну болмаған жағдайда ғана спайктарды күшейтеді, ал ояну басталған кезде қосымша әсер етпейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оянулар оқшауланған баяу толқындармен салыстырғанда IED санының 72% өсуіне әкеледі (IRR = 1.72, p &amp;lt; 0.0001), ал бастапқы дельта-белсенділік тек ояну болмаған кезде ғана спайктерді арттырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дельта-белсенділіктің араласушы фактор (конфаундер) еместігін тексеру үшін сезімталдық талдауы жүргізілді. Дельта-қуат көрсеткіші қосылған модель (GLMM, бағалау ± SE: 0.537 ± 0.012, IRR = 1.71, p &amp;lt; 0.0001) түзетілмеген модельмен (GLMM, бағалау ± SE: 0.538 ± 0.012, IRR = 1.71, p &amp;lt; 0.0001) салыстырғанда жауап түрінің IED-ке әсерін өзгертпеді. Сонымен қатар, дельта-қуат қатынасы түзетілген модельде IED санының дербес болжаушысы болмады (бағалау = 0.009 ± 0.005, IRR = 1.01, P = 0.081). Бұл стимул алдындағы дельта-белсенділік басты бұрмалаушы фактор емес екенін көрсетіп, стимулдан кейінгі эпилептиформды белсенділіктің негізгі қозғаушы күші ретінде мидың фоновое күйін емес, жауап түрін растайды.&lt;/p&gt;\n&lt;h4 id=\"stimul-kharkhyndylyghynyng-ustama-aralykh-razryadtar-zhiiligine-aeseri\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#stimul-kharkhyndylyghynyng-ustama-aralykh-razryadtar-zhiiligine-aeseri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Стимул қарқындылығының ұстама аралық разрядтар жиілігіне әсері&lt;/span&gt;&lt;/a&gt;Стимул қарқындылығының ұстама аралық разрядтар жиілігіне әсері&lt;/h4&gt;\n&lt;p&gt;Стимул қарқындылығының өзі ұстама аралық разрядтардың (IED) санын анықтауы мүмкін деген болжамды жоққа шығару үшін, авторлар дыбыстық стимулдар сезілетін ояну реакциясын тудырмаған бақылау кезеңдерін талдады. Мұндай бақылау кезеңдерінде стимул қарқындылығы IED санының шағын, бірақ статистикалық маңызды өсуімен байланысты болды (жалпыланған сызықтық аралас модель немесе GLMM, β-коэффициент ± SE: 0.0056 ± 0.0005, жиіліктер қатынасы IRR = 1.006, p &amp;lt; 0.0001, Сурет 15a): стимул қарқындылығының әр 1 дБ артуына IED 0.6% өсуі сәйкес келді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бақылау кезеңіндегі әр 1 дБ үшін 0.6% шағын өсім ояну кезіндегі ауқымды өзгерістерді түсіндіре алмайды, өйткені олардың өзара әрекеті статистикалық тұрғыдан маңызды емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Алайда, оқиға түрі (туындаған ояну және бақылау) мен стимул қарқындылығы арасындағы өзара әрекет ету маңызды болмады (GLMM, β-коэффициент ± SE: -0.0004 ± 0.0006, IRR = 1.00, P = 0.514, Сурет 15b). Бұл туындаған оянулар кезінде байқалатын IED үлкен өсімі дыбыс қаттылығына тәуелсіз болатын бөлек күйдің өзгеруін көрсететінін дәлелдейді. Сонымен қатар, таламусына SEEG электродтары орнатылған пациенттерде (n = 4 адам) бақылау кезеңдерінде стимул қарқындылығы таламустың спектrлік қуат қатынасының ауытқуларымен байланысты болмады (GLMM, β-коэффициент ± SE: -0.008 ± 0.009, P = 0.382, Сурет 15c).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GLMM (жалпыланған сызықтық аралас модель) — топтық үрдістермен қатар әр пациенттің жеке ерекшеліктерін ескеретін күрделі статистикалық талдау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жинақтай келгенде, бұл нәтижелер бақылау кезеңдерінде IED шағын, қарқындылыққа тәуелді өсуі байқалғанымен (полисомнограммада көрінбейтін шектік деңгейден төмен оянуларға байланысты), бұл әсер нақты оянулар кезінде тіркелген қуатты эпилептиформды белсенділіктің күрт өсуін түсіндіре алмайтынын көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"oyanu-kezindegi-interiktaldy-belsendilikting-uakhytsha-dinamikasy\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#oyanu-kezindegi-interiktaldy-belsendilikting-uakhytsha-dinamikasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ояну кезіндегі интериктальды белсенділіктің уақытша динамикасы&lt;/span&gt;&lt;/a&gt;Ояну кезіндегі интериктальды белсенділіктің уақытша динамикасы&lt;/h4&gt;\n&lt;p&gt;Қысқа мерзімді оянулар кезінде интериктальды эпилептиформдық разрядтардың (IED) қалай артатынын анықтағаннан кейін, зерттеушілер бұл құбылыстың уақытша динамикасын талдады. Ғалымдар IED саны мен уақыты ояну ұзақтығына байланысты ма, және бұл өсімдер оянудың басталуына қатаң түрде қатысты ма, әлде бүкіл ояну кезеңі бойына тарала ма деген сұрақтарды зерттедi. Ол үшін 17 пациенттің IED таралуын ояну мен дыбыстық стимулдың басталуына қатысты талдады, көрсеткіштер әр пациенттің максималды мәніне нормаланып, 500 миллисекундтық интервалдарға (биндерге) біріктірілді (8a-c сурет). Ояну алдындағы бастапқы деңгеймен салыстырғанда, IED жиілігі ояну басталғаннан кейін бірден күрт өсіп, оянудан кейінгі 4.5 секунд ішінде жоғары деңгейде сақталды (бір жақты Манн-Уитни тесттері, p &amp;lt; 0.05, 8a сурет), бұл көрсеткіш ояну басталғаннан кейін 0.5–1 секунд өткенде шыңына жетті. Пациенттер бойынша IED нормаланған таралуы разрядтардың ояну кезеңінің басында шоғырлануға бейім екенін көрсетті, бұл қыртыстық қозғыштықтың ояну басталған сәтте күрт артып, кейін тұраάатынын білдіреді (16-қосымша сурет). Дыбыстық стимулдарға қатысты есептегенде де, IED ояну кезінде айтарлықтай көбейіп, стимулдан кейін шамамен 2–2.5 секундта ең жоғары шыңына жетті (бір жақты Манн-Уитни тесттері, p &amp;lt; 0.05, 8b сурет). Уақыт өте келе белсенді оянулардың үлесі бұл үлгіні дәл қайталап, ояну мен IED өсуі арасында тығыз уақытша байланыс бар екенін көрсетті. Керісінше, ояну тудырмайтын бақылау дыбыстық стимулдары кезінде IED белсенділігінде ешқандай айтарлықтай өзгеріс байқалмады (бір жақты Манн-Уитни тесттері, p &amp;gt; 0.05, 8c сурет), бұл байқалған өсудің кәдімгі дыбысқа емес, оянуға байланысты қыртыстық белсенділікке тән екенін растады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Бинтер — бұл деректерді есептеу және графиктерді құру үшін зерттеушілер үздіксіз ағынды бөліктерге (мысалы, 500 миллисекундтық аралықтарға) бөлетін уақыт кесінділері.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ояну ұзақтығы мен интериктальды белсенділік арасындағы байланысты бағалау үшін авторлар 17 пациенттің барлық оянулары мен олармен байланысты IED деректерін біріктіріп, жалпыланған сызықтық аралас модельдерді (GLMM) қолданды. Мұнда ояну ұзақтығы тәуелсіз айнымалы, ал нормаланған IED саны немесе жиілігі тәуелді айнымалы ретінде алынды. Белгілі болғандай, ояну ұзақтығының артуымен жалпы IED саны айтарлықтай өскен (GLMM, бета коэффициентінің бағасы ± стандартты қате: оянудың әрбір 1 секундқа ұзаюымен IED саны 0.078 ± 0.006-ға артқан, p &amp;lt; 0.0001, 8b сурет). Бұл ұзағырақ оянулар жалпы алғанда көбірек интериктальды белсенділікті қамтитынын көрсетеді. Бір қызығы, бүкіл ояну ұзақтығы бойындағы IED жиілігі керісінше айтарлықтай төмендеген (GLMM, бета коэффициентінің бағасы ± стандартты қате: оянудың әрбір 1 секундқа ұзаюымен IED жиілігі 0.051 ± 0.006 с⁻¹ төмендеген, p &amp;lt; 0.0001, 8c сурет). Басқаша айтқанда, ұзағырақ оянулар кезінде жиынтық разрядтар көп болғанымен, олар ояну барысында біртіндеп баяулайтын жылдамдықпен орын алады. Жиынтықта бұл нәтижелер оянудың басталуы эпилепсиялық белсенділіктің қысқа мерзімді жарқылын тудыратынын, ал ояну тұрақтанған сайын бұл белсенділік бәсеңдейтінін және бұл үдеріс қыртыстық қозғыштықтың динамикалық ауытқуларымен басқарылатынын көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Оянудың басталуы алғашқы 0.5–1 секундта эпилептиформдық разрядтардың лездік шыңын тудырады, ал IED жалпы саны ояну ұзақтығына қарай өседі (әрбір секунд сайын 0.078-ге, p &amp;lt; 0.0001), дегенмен олардың секундтық жиілігі біртіндеп төмендейді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Соңында, авторлар ояну әсерінен интериктальды белсенділіктің өсуін таламокортикалық белсендіру арқылы түсіндіруге болатынын тексерді. Ол үшін таламус ішіне стереоэлектроэнцефалография (SEEG) электродтары орнатылған 4 пациенттің ішкі тобына талдау жасалды. N2 сатысындағы оянулар кезінде (n = 56) таламустың спектрлік қуаты IED санымен байланысты ма екенін тексеру үшін GLMM қолданылды, бұл сатыда разрядтардың ең үлкен өсімі байқалған болатын. Барлық SEEG арналары бойынша нормаланған IED саны таламустық спектрлік қуат қатынасының функциясы ретінде моделденді: стимул алдындағы бастапқы деңгейге қатысты 3 секундтық ояну дәуірінде есептелген баяу дельта-толқындарының жылдамырақ тета, альфа және бета ырғақтарына қатынасы — δ/(θ+α+β) ([0.5–4 Гц] / [4.5–30 Гц]). Таламустық спектрлік қуат қатынасы мен IED саны арасында айтарлықтай теріс байланыс анықталды (GLMM, бета коэффициентінің бағасы ± стандартты қате: таламус қуат қатынасы 1.0-ге өскенде IED саны 0.081 ± 0.035-ке азайған, P = 0.022, 8f сурет). Демек, баяу дельта-белсенділігі төменірек болған (жылдамырақ таламус ырғақтарына қарай ығысуды көрсететін) оянулар IED санының жоғары болуымен байланысты болды. Бұл нәтижелер оянуға байланысты интериктальды белсенділіктің таламус ырғақтарының үдеуі арқылы қыртыстық қозғыштық пен IED түзілуін жеңілдететін таламокортикалық механизмдермен байланысты екенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Таламустың рөлі туралы қорытындылар тек 4 пациенттен тұратын шағын топтың талдауына негізделген (N2 сатысындағы 56 ояну), сондықтан бұл нәтижелерді эпилепсиясы бар барлық адамдарға тарату барысында сақтық таныту қажет.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;h4 id=\"ujkhy-mikrokhurylymynyng-epilepsiyalykh-belsendilikti-modulyaciyalaudaghy-roeli\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#ujkhy-mikrokhurylymynyng-epilepsiyalykh-belsendilikti-modulyaciyalaudaghy-roeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйқы микроқұрылымының эпилепсиялық белсенділікті модуляциялаудағы рөлі&lt;/span&gt;&lt;/a&gt;Ұйқы микроқұрылымының эпилепсиялық белсенділікті модуляциялаудағы рөлі&lt;/h4&gt;\n&lt;p&gt;Алынған деректер ұйқы микроқұрылымы және спонтанды немесе шақырылған микрогоянулар интерiktal эпилепсиялық белсенділіктің қуатты динамикалық модуляторлары болып табылатынын сенімді түрде дәлелдейді. Ұйқы тұрақтылығын мақсатты түрде өзгерту үшін бақыланатын есту стимуляциясымен бірге интракраниальды электроэнцефалография мен полисомнографияны қолдана отырып, авторлар оянулардың патологиялық разрядтарды желілік ерекше сипатта күрт арттыратынын көрсетті. Эпилепсия мен ұйқы арасындағы күрделі екі жақты байланыс ертеден белгілі болғанымен, дәл оянуларды эксперименталды түрде туындату арқылы ұйқы тұрақсыздығының интерiktal эпилепсиялық разрядтардың дереу өсуіне тікелей себеп болатындығының алғашқы тікелей дәлелдері алынды. Бұл заңды әсер жоғары жиілікті тербелістерге де, есту әсерімен байланысты емес табиғи спонтанды оянуларға да қатысты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ұйқы кезіндегі транзиторлық микрогоянулар интерiktal разрядтар мен жоғары жиілікті тербелістер жиілігінің дереу секіруін тудырады, бұл ұйқы тұрақсыздығының патологиялық желі динамикасын белсендірудегі себептік рөлін растайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қызығы, интерiktal разрядтардың саны күрт өскенімен, олардың кеңістіктік таралу сипаты өзгеріссіз қалды. Бұл ұйқының фрагментациясы разрядтардың түзілуіне жергілікті түрде әсер етіп, кең көлемдегі ми құрылымдарын тартпайтынын көрсетеді. Мұндай құбылыс қыртыстың қозуының қысқа мерзімді жергілікті өсуімен түсіндіріледі, мұны эпилепсиялық белсенділіктің күшеюі тек неокортикальды аймақтарда байқалатыны және самай бөлігінің мезиальды бөліктерінде мүлдем жоқ екендігі растайды. Сонымен қатар, разрядтардың өсуі ұстамалардың басталу аймағында да, оны қоршаған тінде де бірдей көрінеді, бұл эпилептогенді аймақтың ұйқы тұрақсыздығымен байланысты қозу ауытқуларына басым түрде тартылмағанын көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"ujkhy-satylary-men-talamokortikaldy-mehanizmderding-aeseri\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#ujkhy-satylary-men-talamokortikaldy-mehanizmderding-aeseri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйқы сатылары мен таламокортикальды механизмдердің әсері&lt;/span&gt;&lt;/a&gt;Ұйқы сатылары мен таламокортикальды механизмдердің әсері&lt;/h4&gt;\n&lt;p&gt;Оянулар арқылы интерiktal разрядтарды ынталандыру әсері түнгі демалыс сатыларына айқын тәуелділікті көрсетеді: мұндай динамика N2 және N3 баяу ұйқы сатыларының екеуінде де тіркеледі, бірақ N2 сатысында әсер әлдеқайда күштірек болады. Бұл осы сатыда эпилепсиялық үлгілерді ынталандыруы мүмкін күштірек таламокортикальды синхронизациямен тікелей сәйкес келеді. Таламус ядроларында электродтары бар пациенттер тобының нәтижелері N2 оянулары кезінде таламокортикальды белсенділіктің жылдамырақ болуы интерiktal разрядтардың жоғары санымен байланысты екенін көрсетті. Фондық дельта-белсенділіктің өзі жеке баяу толқынды жауаптар кезінде разрядтарға ықпал етсе де, ояну пайда болуымен бұл модуляциялық әсер толығымен басылып, микрогоянулар фрагменттелген ұйқы кезіндегі интерiktal разрядталудың басты драйверіне айналады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Таламокортикальды синхронизация — таламус пен бас миы қыртысы арасындағы үйлестірілген ырғақты белсенділік, ол N2 сатысында әсіресе күшті болып, ояну кезінде эпилепсиялық разрядтардың күшеюіне ықпал етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"khyrtys-khozuynyng-dinamikasy-zhaene-razryadtardy-zhergilikti-tuezu-mehanizmderi\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#khyrtys-khozuynyng-dinamikasy-zhaene-razryadtardy-zhergilikti-tuezu-mehanizmderi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қыртыс қозуының динамикасы және разрядтарды жергілікті түзу механизмдері&lt;/span&gt;&lt;/a&gt;Қыртыс қозуының динамикасы және разрядтарды жергілікті түзу механизмдері&lt;/h4&gt;\n&lt;p&gt;Шақырылған оянулар кезінде разрядтар санының дереу өсуі ұйқы мен ояулық жағдайлары арасындағы күрт ауысуға тән қыртыс қозуының өзгеруін көрсетеді. Мұндай ауысулар қыртыстық желілердегі қозу мен тежелу арасындағы нәзік тепе-теңдікті уақытша бұзып, разрядтардың түзілуіне қолайлы аса қозғыш ортаны тудыруы мүмкін. Оянулардың қысқа мерзімділігін ескерсек, олармен байланысты қозудың өсуі ұстамаларды тудыру үшін тым қысқа мерзімді болуы ықтимал, бұл разрядтардың көбеюіне себеп болғанымен, ояну кезінде ұстамалардың жоқтығын түсіндіреді. Разрядтар жиілігі ояну басталған бойда шыңына жетіп, оның дамуына қарай төмендейтіні интерiktal разрядталудың ояну күйіне алғашқы тұрақсыз ауысу кезеңіне уақытша байланысты екенін растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Байқалған нәтижелер интракраниальды мониторинг кезінде фармакорезистентті эпилепсиясы бар арнайы пациенттер тобынан алынды, сондықтан оларды сау адамдарға немесе басқа патология формалары бар жалпы популяцияға автоматты түрде таратуға болмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторлардың болжамына қайшы, шақырылған оянулар разрядтардың жалпы санын тұрақты түрде арттырғанымен, олардың кеңістіктік таралуына әсер етпеді. Бұл әртүрлі әсерлер оянулардың оның таралуына ықпал ететін кеңірек эпилепсиялық желілерді тартпай, тек интерiktal белсенділіктің жергілікті түзілуін модуляциялайтынын көрсетеді. Сондықтан ояну кезінде қыртыс қозуының өткінші ауытқулары жергілікті желілерде разрядтарды бастау үшін бастапқы фактор ретінде қызмет ете алады, бірақ кең көлемді желінің белсенуі үшін қажетті шекті деңгейге жетпейді.&lt;/p&gt;\n&lt;h4 id=\"ajmakhtykh-erekshelikter-zhaene-ujkhy-satylarynyng-epileptiformdy-belsendilikke-aeseri\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#ajmakhtykh-erekshelikter-zhaene-ujkhy-satylarynyng-epileptiformdy-belsendilikke-aeseri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Аймақтық ерекшеліктер және ұйқы сатыларының эпилептиформды белсенділікке әсері&lt;/span&gt;&lt;/a&gt;Аймақтық ерекшеліктер және ұйқы сатыларының эпилептиформды белсенділікке әсері&lt;/h4&gt;\n&lt;p&gt;Ұйқыдан ояну кезіндегі миішілік эпилептиформды разрядтардың (IED) жиілігінің артуындағы аймақтық айырмашылықтар таламокортикалық байланыстың әртүрлілігімен түсіндіриледі. Тығыз таламиялық проекцияларды алатын неокортекс ояну кезінде IED көбеюін көрсетті, ал мезиотемпоральды аймақтарда таламуспен байланыстың әлсіздігіне байланысты айтарлықтай әсер байқалмады. Спонтанды оянулар неокортексте IED өсуімен бірге жүрді, бірақ мезиотемпоральды аймақтарда олардың төмендеуі байқалды. Спонтанды ояну кезінде мезиотемпоральды IED басылуы ояну түрлері арасындағы орталық және перифериялық компоненттердің айырмашылықтарын көрсетуі мүмкін. Есту арқылы оянулар желі десинхронизациясына қарсы тұратын сенсорлық жолдарды белсендіреді.&lt;/p&gt;\n&lt;p&gt;Таламиялық SEEG электродтары бар емделушілердің кіші тобын талдау бұл аймақтық ерекшелікті растады: жылдамырақ таламиялық белсенділікпен жүретін оянулар жоғары IED санымен байланысты болды. Бұл уақытша таламокортикалық белсендіру неокортексте түйіндерді тудыратынын көрсетеді. Гиппокамп пейпец шеңбері арқылы таламустың алдыңғы ядроларымен байланысса, неокортикалық белсендіруді ми қабығының күйін реттейтін жүйелер қолдайды. Болашақта таламиялық ядролардың анатомиялық локализациясын ескеру бұл механизді тереңірек түсінуге көмектеседі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ояну кезінде IED артуы аймақтық сипатқа ие: күшті таламокортикалық байланыстардың арқасында неокортекс белсенділік көрсетеді, ал мезиотемпоральды аймақтар басқаша жауап береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эпилептогенді аймақтың (SOZ) ішіндегі және сыртындағы IED өсуі салыстырылып, ұқсас нәтижелер алынды, бұл құбылыстың ошақ ішіндегі күшеюден гөрі жаһандық желілік феномен екенін көрсетеді. IED реакциясы ұйқы сатысына байланысты болды: N2 фазасында әсер N3-ке қарағанда айтарлықтай күштірек болды. N2 кезеңі үлкен тұрақсыздықпен, циклдік ауыспалы үлгілермен (CAP) және жиі оянулармен сипатталса, N3 тұрақты синхрондалған ұйқыны көрсетеді. Қызығы, спонтанды оянулар N3-те N2-ге қарағанда IED-тің әлдеқайда үлкен өсуін көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;N2 ұйқы сатысы — бұл дельта-белсенділіктің тұрақсыздығымен және CAP микрооянуларымен ерекшеленетін, эпилепсиялық разрядтардың пайда болуын жеңілдететін жеңіл NREM ұйқы сатысы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"oyanu,-delta-belsendilik-zhaene-stimul-kharkhyndylyghynyng-oezara-aerekettesui\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#oyanu,-delta-belsendilik-zhaene-stimul-kharkhyndylyghynyng-oezara-aerekettesui\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ояну, дельта-белсенділік және стимул қарқындылығының өзара әрекеттесуі&lt;/span&gt;&lt;/a&gt;Ояну, дельта-белсенділік және стимул қарқындылығының өзара әрекеттесуі&lt;/h4&gt;\n&lt;p&gt;Авторлар IED күшеюі ояну реакциясының өзіне немесе фондық баяу толқынды белсенділікке байланысты екенін зерттеді. Толық кортикалық оянулар оқшауланған баяу толқынды жауаптарға қарағанда едәуір жоғары IED санын тудырды. Стимулға дейінгі дельта жағдайы оқшауланған баяу толқындар үшін үлкен IED санын болжады. Алайда ояну орын алғаннан кейін фондық дельта күйі IED санымен байланысты болмай қалды, өйткені ояну ми қабығының қозуына жеткілікті түрде әсер етіп, фондық тербелулерді басып тастады.&lt;/p&gt;\n&lt;p&gt;Стимул қарқындылығы бақылау кезеңдерінде IED санына аз ғана дозаға тәуелді әсер етті, бірақ ояну кезіндегі үлкен IED өсуі стимул қарқындылығына тәуелсіз болды. Таламиялық спектрде өзгерістердің болмауы стимул қарқындылығы таламокортикалық модуляция арқылы емес, сенсорлық өңдеу арқылы әсер ететінін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Алынған нәтижелер фармакорезистентті эпилепсиясы бар науқастарды клиникалық бақылауға негізделген, ұйқы параметрлері мен стимуляцияның вариабельділігін үлкенірек таңдауларда зерттеу қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"klinikalykh-saldarlar-zhaene-tuezetu-perspektivalary\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#klinikalykh-saldarlar-zhaene-tuezetu-perspektivalary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Клиникалық салдарлар және түзету перспективалары&lt;/span&gt;&lt;/a&gt;Клиникалық салдарлар және түзету перспективалары&lt;/h4&gt;\n&lt;p&gt;Алынған деректер оянулардың ми қабығының қозуын тұрақсыздандыратын өткір динамикалық факторлар екенін көрсете отырып, ұйқы мен эпилепсия арасындағы байланысты түсінуді кеңейтеді. Ұйқы кезіндегі жиі IED есте сақтауды консолидациялауды бұзады, когнитивтік функцияларды нашарлатады және құрысулардың табалдырығын төмендетеді. Түнгі ұстамалар SUDEP қаупімен байланысты. Оянуларды өзгертуге болатын триггер ретінде анықтау емдеудің жаңа жолдарын ашады: апноэні скринингтен өткізу және емдеу, ұйқы архитектурасын бұзбайтын препараттарды қолдану және желі тұрақсыздығын нақты уақыт режимінде басатын тұйық контурлы (closed-loop) нейромодуляция технологиялары. N3 баяу толқынды ұйқымен қатар N2 ұйқысын тұрақтандыру да маңызды.&lt;/p&gt;\n&lt;h4 id=\"zertteu-shekteuleri-men-bolashakh-perspektivalar\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#zertteu-shekteuleri-men-bolashakh-perspektivalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу шектеулері мен болашақ перспективалар&lt;/span&gt;&lt;/a&gt;Зерттеу шектеулері мен болашақ перспективалар&lt;/h4&gt;\n&lt;p&gt;Біздің жұмысымыз ұйқы тұрақтылығының эпилепсиялық белсенділікке әсерін анықтау және қорытындылардың жалпылама қолданылуын арттыру үшін әртүрлі клиникалық көріністері бар пациенттердің біртекті емес тобын қамтуға арналды. Салдарынан, когортаға әртүрлі құрылымдық ауытқулары мен МРТ-негативті жағдайлары бар науқастар кірді, ал гистопатологиялық растау барлық қатысушыларда бола бермеді. Туындаған гетерогенділік пен жекелеген патологиялық санаттардағы аз көрсеткіштер зақымдану субстратына байланысты аймақтық әсерлердің өзгеретінін бағалау үшін мазмұнды статистикалық талдау жасауға мүмкіндік бермеді, сондай-ақ эпилепсия кіші түрлері бойынша нақты қорытынды жасау жұмыс ауқымынан тыс болды. Соған қарамастан, нәтижелеріміз нақты патологиялық субстраттардың жеткілікті өкілдігі бар ірі когорталардағы болашақ көп орталықты зерттеулер үшін құнды негіз қалайды. Ұстаманың басталу аймағы (SOZ) ерте байқалатын иктальды өзгерістер негізінде клиникалық электрографиялық критерийлер арқылы анықталды, сондықтан шын эпилептогендік аймаққа сәйкес келмеуі мүмкін және ұстаманы бастауға қатысатын аймақтарды қамтитын функционалдық құрылым болып табылады. Тағы бір шектеу — зерттеу тек фармакорезистентті эпилепсиямен ауыратын пациенттерде жүргізілді, бұл адам миының ішіне клиникалық мақсатта электродтар орнатылатын жалғыз топ, сондықтан қорытындылар ұстамасы бақыланатын адамдарға таратылмауы мүмкін. Имплантация тығыздығының әсері негізгі талдауларды IED бар белсенді арналармен шектеу және арна деңгейіндегі GLMM тәсілін қолдану арқылы азайтылды, алайда имплантация стратегиясы клиникалық түрде басқарылады. Болашақта арна деңгейіндегі белсенділік өлшемдерін тіпа деңгейіндегі патологиялық корреляттармен біріктіретін зерттеулер бұл айырмашылықты нақтылауға көмектеседі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Зерттеу тек интракраниальды электродтары бар ауыр фармакорезистентті эпилепсия пациенттерінде жүргізілгендіктен, нәтижелерді аурудың жеңіл түрлеріне механикалық түрде таңуға болмайды.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Соңында, біздің дизайн микрооянулардың IED-ке әсерін бұрынғы бақылау жұмыстарына қарағанда тікелей зерттеуге мүмкіндік бергенімен, біз IED де оянуды тудыра алатынын және екі жақты байланыстың бар екенін мойындаймыз. Болашақ зерттеулер ұйқы мен ЭЭГ жазбаларын қатар жүргізу арқылы оянудан туындаған IED өсуінің есте сақтау мен когнитивті функцияларға функционалдық салдарын нақтылауы тиіс.&lt;/p&gt;\n&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;p&gt;Қорытындылай келе, біздің жұмысымыз транзиторлық ұйқы тұрақсыздығы, атап айтқанда NREM ұйқысы кезіндегі микрооянулар фармакорезистентті эпилепсиядағы интерктальды белсенділікті күшейте алатыны туралы жаңа дәлелдер ұсынады. Ұйқы тұрақтылығын дәл уақыттық бақылаумен эксперименталды түрде басқара отырып, біз оянудан туындаған интерктальды спайктердің неокортексте болатынын және N2 ұйқысында үлкен әсер ететінін көрсетеміз. Сонымен қатар, оянулар интерктальды спайктердің жүктемесін арттырғанымен, олардың кеңістіктік таралуына әсер етпейтінін көрсеттік. Бұл оянуға қатысты спайктер кең ауқымды эпилепсиялық желілерді жеткіліксіз тартылуымен жергілікті қыртыстық қозудың жоғарылағанын көрсетеді. Біріктіре келгенде, бұл нәтижелер ұйқыға негізделген парадигмалардың эпилепсия мен мидың басқа патологиялық жағдайларындағы желілік динамиканы зерттеудегі күшті құрал ретіндегі әлеуетін нығайтады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Жасанды түрде туындаған микрооянулар N2 ұйқысы кезінде фармакорезистентті эпилепсияда кеңістіктік таралуды өзгертпестен, неокортекстегі жергілікті интерктальды белсенділікті таңдамалы түрде күшейтеді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"pacientterdi-irikteu\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#pacientterdi-irikteu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пациенттерді іріктеу&lt;/span&gt;&lt;/a&gt;Пациенттерді іріктеу&lt;/h4&gt;\n&lt;p&gt;Операция алдындағы клиникалық тексеру а、「оқылымы ретінде стереоэлектроэнцефалографиядан (СЭЭГ) өтіп жатқан дәріге төзімді фокальды эпилепсиясы бар ересек пациенттер қатыстырылды. Қатысушылар 2025 жылдың мамыры мен қаңтары аралығында екі орталықта: Монреаль неврологиялық институты мен ауруханасында (MNI) және Дьюк кешенді эпилепсия орталығында (DCEC) іріктелді, барлығы 20 пациент қабылданды. Талдаудан үш пациент шығарылды: екеуінде есту ынталандыру хаттамасы бойынша техникалық мәселелер туындады, ал біреуінде ұйқыны бағалауды сенімсіз еткен қалыптан тыс ұйқы өрнектері байқалды. Қорытынды іріктеуге 17 пациент кірді (8 әйел, 14 оңқай, орташа жасы 37.2 ± 8.1; SN-кесте), олардың 10-ы MNI-ден және 7-сі DCEC-тен болды. Зерттеуді MNI Резюме этикалық кеңесі (2021-7516) және Дьюк университетінің денсаулық сақтау жүйесінің институционалдық этикалық кеңесі (Pro00113635) мақұлдады, әр пациенттен жазбача хабардар етілген келісім алынды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;СЭЭГ және полисомнография деректерін біріктіріп жазу ми ішілік электродтар арқылы эпилептогенді аймақты дәл анықтауға және ұйқы құрылымын бақылауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"seeg-psg-zhazbalary\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#seeg-psg-zhazbalary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;СЭЭГ-ПСГ жазбалары&lt;/span&gt;&lt;/a&gt;СЭЭГ-ПСГ жазбалары&lt;/h4&gt;\n&lt;p&gt;Барлық қатысушылар бұрынғы зерттеулерде сипатталғандай біріктірілген СЭЭГ-ПСГ жазбаларынан өтті. СЭЭГ терең электродтары эпилептогенді аймақты анықтау үшін ми ішіне енгізілді, электродтардың орналасуын MNI және DCEC клиникалық топтары анықтады. СЭЭГ сигналдары MNI жүйесінде Neuroworkbench жүйесі (Nihon Kohden, Токио, Жапония) немесе DCEC жүйесінде Natus Quantum LTM күшейткіші (Natus Medical Inc., Миддлтон, Висконсин, АҚШ) көмегімен, болжалды эпилептогенді аймаққа қарама-қарсы төбе бөлігіне орналастырылған электродқа қатысты 2048 Гц жиілікте жиналды. MNI-де СЭЭГ сигналдары 0.08 Гц жоғары жиілікті және 600 Гц төмен жиілікті сүзгілерден өткізілді, ал DCEC-те сигналдар сәйкесінше 0.01 Гц және 1000 Гц жиілікте сүзгіленді. ПСГ жазбалары мен дыбыстық ынталандыру хаттамасы хирургиялық алды тексерудің ерте кезеңінде, СЭЭГ электродтары орнатылғаннан кейін кемінде 48 сағат өткен соң және пациенттер эпилепсияға қарсы толық дәрі-дәрмек курсын қабылдауды жалғастырған немесе әдеттегі күтім шеңберінде тек шектеулі, клиникалық көрсеткіштер бойынша дозаны азайтқан кезде орындалды. ПСГ жазбалары операция кезінде орнатылған тері астындағы жіңішке сымды электродтар көмегімен алынған стандартты 10-20 жүйесінің орындарынан (F3, F4, C3, C4, O1, O2, M1, M2) бас терісінің ЭЭГ, сонымен қатар ұйқыны бағалауды жеңілдету үшін иек пен үлкен жіліншік бұлшықеттерінің беткейлік электроокулографиясы (ЭОГ) мен электромиографиясын (ЭМГ) қамтыды. Талданған ынталандыру сеанстары кезінде ешқандай ұстамалар байқалмады.&lt;/p&gt;\n&lt;h4 id=\"dybystykh-yntalandyru-hattamasy\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#dybystykh-yntalandyru-hattamasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дыбыстық ынталандыру хаттамасы&lt;/span&gt;&lt;/a&gt;Дыбыстық ынталандыру хаттамасы&lt;/h4&gt;\n&lt;p&gt;Дыбыстық ынталандыру хаттамасының мақсаты Америка ұйқы бұзылыстары қауымдастығының нұсқауларына сәйкес оянуларды тудыру болды. Дыбыстық стимулдар 1 кГц жиіліктегі, ұзақтығы 5 секунд болатын және дыбыс деңгейі 40 пен 100 дБ аралығындағы таза тондардан тұрды. Стимулдар қатысушының әдеттегі ұйықтайтын уақытынан басталатын 4 сағат ретінде анықталған түннің бірінші жартысында жоғары сапалы құлақ ішілік түтікшелі құлаққаптар (ER3C, Etyomic, Иллинойс, АҚШ) арқылы қолмен жеткізілді, бұл дыбысты дәл жеткізуге және ЭЭГ-дегі сыртқы шу кедергілерін азайтуға мүмкіндік берді. Ұйқыны бағалау бойынша дайындықтан өткен зерттеушілер (SH, AH) ұйқы сатысын нақты уақыт режимінде бағалау және стимулдарды жеткізуді бағыттау, соның ішінде оянудың сәтті туындағанын растау үшін үздіксіз онлайн ПСГ мониторингін жүргізді. Бұл нақты уақыттағы бағалау Америка ұйқы медицинасы академиясының стандартты ұйқыны бағалау критерийлеріне сәйкес ағымдағы ЭЭГ, ЭОГ және ЭМГ белсенділігін көзбен шолып тексеруге негізделген еді. Ынталандыру ұйқы ұршығы немесе К-комплекстің пайда болуымен белгіленетін тұрақты NREM ұйқысының 5 минуттан кейін басталды және дыбыс деңгейі ояну орын алғанша біртіндеп арттырылды. Ынталандыру хаттамасы нақты уақыттағы ұйқыны бағалау кезінде оянулардың пайда болуын барынша арттыру үшін NREM және REM ұйқысы кезінде де қолданылды; алайда талдаулар эпилепсиялық белсенділікті күшейтудегі жақсы белгілі роліне байланысты және көптеген пациенттер ынталандырудан туындаған ұйқының бөлінуіне байланысты REM ұйқысына жете алмағандықтан, NREM ұйқысына бағытталды. Егер ынталандыру толық оянуға әкелсе, хаттама тоқтатылып, ПСГ жазбаларында ұйқы ұршығы, К-комплекс немесе жылдам көз қозғалыстарының қайта пайда болуымен анықталатын 2 минуттық тұрақты ұйқыдан кейін төменірек дыбыс деңгейінде (-10 дБ) қайта басталды. Ынталандыру оянуды тудырған жағдайларда, келесі стимул 2 минуттық тұрақты ұйқыдан кейін сол дыбыс деңгейінде берілді, ал егер ояну орын алмаса, келесі стимул 10 секундтан кейін жоғарырақ дыбыс деңгейінде (+10 дБ) берілді. Бұл хаттама жалпы ұйқы уақытына әсер етпестен ояну индексін сағатына 20 оқиғаға дейін арттыратыны көрсетілді.&lt;/p&gt;\n&lt;h4 id=\"ujkhyny-baghalau-zhaene-oyanudy-anykhtau\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#ujkhyny-baghalau-zhaene-oyanudy-anykhtau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйқыны бағалау және оянуды анықтау&lt;/span&gt;&lt;/a&gt;Ұйқыны бағалау және оянуды анықтау&lt;/h4&gt;\n&lt;p&gt;Ұйқы сатылары мен микрогояңсулар (arousals) Американдық ұйқы медицинасы академиясынын (AASM) стандартты критерийлеріне сәйкес қолмен бағаланды. Талдау бас терісінің ЭЭГ, ЭОГ және ЭМГ қамтитын полисомнография (ПСГ) жазбаларына негізделді. Белгілеуді SEEG деректерінен хабарсыз білікті маман қызметкерлер (SH, LP-D) орындады. Ұйқы 30 секундтық дәуірлерге бөлінді; әрбір дәуір ЭЭГ, ЭОГ және ЭМГ үлгілері негізінде N1, N2, N3, REM немесе ояу болу сатыларының біріне жіктелді. Микрогояңсу альфа, тета және/немесе 16 Гц-тен жоғары жиіліктерді қамтитын, ұзақтығы 3-15 с болатын және өзгеріске дейін кемінде 10 с тұрақты ұйқы жүретін ЭЭГ жиілігінің күрт ауысуы ретінде анықталды. Ояңсулар олар пайда болған ұйқы сатысына сәйкес жіктелді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Полисомнография (ПСГ) — бұл ұйқы кезіндегі физиологиялық параметрлерді (ЭЭГ, ЭОГ, ЭМГ және т.б.) тіркейтін кешенді әдіс, ол ұйқы архитектоникасы мен микрогояңсу эпизодтарын дәл анықтауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дыбыстық ынталандыру басталғаннан кейін 6.5 секунд ішінде пайда болған ояңсулар туындаған (evoked) деп саналды. Бұл уақыт терезесі ынталандыру ұзақтығының 5 секунды мен ынталандыру мен ояңсудың көрінуі арасындағы кідіріске арналған қосымша 1.5 секундты есепке алды. Осы тереден тыс қалған ояңсулар спонтанды ояңсулар ретінде жіктелді. Ұйқы сатылары мен ояңсуларды барлық белгілеу ұйқы медицинасы бойынша мамандандырылған сертификатталған неврологпен (BF, LP-D) тексерілді.&lt;/p&gt;\n&lt;h4 id=\"epohany-tangdau\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#epohany-tangdau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эпоханы таңдау&lt;/span&gt;&lt;/a&gt;Эпоханы таңдау&lt;/h4&gt;\n&lt;p&gt;Ояңсулардың ұстамааралық эпилептиформдық разрядтарға (IED) әсерін бағалау үшін авторлар барлық пациенттердегі әрбір дыбыстық ынталандыру оқиғасына уақыт бойынша байланыстырылған SEEG-тегі төрт әртүрлі 3 секундтық дәуірді талдады (1c-сур.). Бұл уақыт терезелері дыбыстық ынталандыру мен ояңсу басталғанға дейін және кейін бірден болатын транзиторлық өзгерістерді тіркеу үшін таңдалды. 3 секундтық ұзақтық IED-тің жылдам өзгерістерін анықтау үшін жеткілікті уақытша ажыратымдылықты қамтамасыз етті.&lt;/p&gt;\n&lt;p&gt;Сәтті ояңсу тудырған стимулдар үшін стимул алдындағы базалық деңгей (стимул басталғанға дейінгі 3 секундтық дәуір) және туындаған ояңсу терезесі алынды. Ояңсусыз дыбыстық әсерлерді бақылау үшін тағы екі бақылау дәуірі анықталды: бақылау базасы (стимулға дейінгі 3 секунд) және стимул басталғаннан кейін 1.08 с соң басталатын 3 секундтық бақылау дәуірі (ба
