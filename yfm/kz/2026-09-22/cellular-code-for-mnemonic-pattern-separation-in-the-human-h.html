ектіге тән МРТ-КТ бірлескен тіркеулерін визуалды тексеруге негізделген.&lt;/p&gt;\n&lt;h4 id=\"ustamanyng-bastalu-ajmaghyn-soz-lokalizaciyalau\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#ustamanyng-bastalu-ajmaghyn-soz-lokalizaciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұстаманың басталу аймағын (SOZ) локализациялау&lt;/span&gt;&lt;/a&gt;Ұстаманың басталу аймағын (SOZ) локализациялау&lt;/h4&gt;\n&lt;p&gt;SOZ орналасқан жері әр пациент үшін стационарда болу соңында қол жетімді бассүйекішілік мониторинг нәтижелері негізінде анықталды (S1-кесте). Біз тіркелген әрбір нейронды гиппокамп (HPC) және амигдала (AMY) үшін медиальды самай құрылымының (MTL) немесе алдыңғы белдеулік қыртыс (ACC) және пресуплементарлы моторлық аймақ (preSMA) үшін медиальды маңдай қыртысының (MFC) сол жарты шарында SOZ бар-жоғына байланысты SOZ ішінде немесе сыртында локализацияладық. Екі жақты SOZ бар субъектілерде тіркелген барлық нейрондар SOZ ішінде екендігі анықталды. Нәтижесінде HPC және AMY-да SOZ ішінде сәйкесінше 406/950 және 476/1187, ал ACC пен preSMA-да 18/684 және 55/685 нейрон локализацияланды. SOZ ішіндегі және сыртындағы HPC үшін эталонды деректерді декодтауды салыстыру үшін (төменде қараңыз) біз барлық HPC жасушаларын нақты науқаста HPC электродтарын қамтитын SOZ бар-жоғына байланысты SOZ ішінде немесе сыртында локализацияладық. Нәтижесінде 396 жасуша SOZ сыртында, 398 жасуша ішінде және 156 жасушаның нақты орналасқан жері белгісіз болып шықты (S8d-сурет). Сол сияқты, жадқа талғампаз (MS) 36 жасуша SOZ сыртында, 26 жасуша ішінде және 14 жасушаның орналасқан жері белгісіз күйде тіркелді (S8e-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SOZ (ұстаманың басталу аймағы) — бұл мида эпилепсия ұстамалары пайда болатын ошақ, ал гиппокамп пен амигдала есте сақтау мен эмоцияларды өңдеуде маңызды рөл атқарады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"nejrondardy-tangdau\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#nejrondardy-tangdau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нейрондарды таңдау&lt;/span&gt;&lt;/a&gt;Нейрондарды таңдау&lt;/h4&gt;\n&lt;p&gt;Спайктар стимул берілгеннен кейін 200 ms өткен соң басталатын 1,5 с терезеде саналды. Жадқа талғампаз (MS) нейрондар осы терезе ішінде дұрыс анықталған жаңа және таныс стимулдар арасында айтарлықтай айырмашылық көрсететіндер ретінде анықталды (p-value &amp;lt; 0.05, орташа мәндердің екі жақты бутстрэп салыстыруы, 1000 итерация). Егер ескі сынақтар үшін орташа импульс жиілігі жаңа сынақтардікінен асып түссе, MS нейроны танысуға талғампаз (FS) болып жіктелді. Егер нейронның жаңа сынақтарға арналған импульс жиілігі ескілердікінен асып түссе, MS жасушасы жаңалыққа талғампаз болып жіктелді (NS, 3d, e-суреттер үшін маңызды). Визуалды талғампаз (VS) нейрондар бірдей спайк санақтары бойынша бір факторлы ANOVA көмегімен анықталды (фактор: визуалды санат, 5 деңгей) (p-value &amp;lt; 0.05).&lt;/p&gt;\n&lt;h4 id=\"nejrondardy-khosu-kriterijleri\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#nejrondardy-khosu-kriterijleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нейрондарды қосу критерийлері&lt;/span&gt;&lt;/a&gt;Нейрондарды қосу критерийлері&lt;/h4&gt;\n&lt;p&gt;Талдауға енгізу үшін жасушаның барлық сынақтар бойынша стимулды көрсету кезеңінде &amp;gt;0,2 Hz орташа импульс жиілігі болуы талап етілді. Сонымен қатар, әрбір нақты талдау үшін біз тек әрбір мүмкін болатын түрдің белгілі бір минималды сынақ саны бар жасушаларды қостық (әдетте ROC талдауы үшін 2 және декодтау талдаулары үшін 5). Қажетті минималды сынақ саны әр әдісті сипаттайтын кейінгі бөлімдерде көрсетілген.&lt;/p&gt;\n&lt;p&gt;Жалған оң (FP) жиіліктері стимул санатына байланысты, кейбір санаттарға тиесілі суреттер (мысалы, «жануарлар») басқа санаттарға қарағанда жиірек FP ретінде хабарланады (1–3 тапсырма нұсқалары үшін S1a-c-сурет). Осы себепті, визуалды санатты да кодтайтын MS жасушалары біздің талдауымыз үшін кедергі келтіретін фактор болуы мүмкін. Санатқа баптаурылған MS жасушалары сирек кездессе де (сәйкесінше HPC, AMY, ACC, preSMA-да 1,9% (18/950), 1,85% (22/1187), 1,5% (10/684), 1,6% (11/685)), біз сақтық шарасы ретінде 3g-суреттен кейінгі барлық талдаулар үшін оларды алып тастадық (3c-суретте осындай жасушаның мысалы көрсетілген).&lt;/p&gt;\n&lt;h4 id=\"zhasushalardy-tangdau-ueshin-kezdejsokhtykh-denggeji\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#zhasushalardy-tangdau-ueshin-kezdejsokhtykh-denggeji\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жасушаларды таңдау үшін кездейсоқтық деңгейі&lt;/span&gt;&lt;/a&gt;Жасушаларды таңдау үшін кездейсоқтық деңгейі&lt;/h4&gt;\n&lt;p&gt;Жасушаларды таңдау үшін кездейсоқтық деңгейлерін бағалау үшін жадқа талғампаз жасушаларды анықтау процедурасы сынақ белгілерін (дұрыс жаңа/ескі) 500 рет кездейсоқ ауыстырғаннан кейін қайталанды.&lt;/p&gt;\n&lt;h4 id=\"zheke-nejrondy-taldau\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#zheke-nejrondy-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жеке нейронды талдау&lt;/span&gt;&lt;/a&gt;Жеке нейронды талдау&lt;/h4&gt;\n&lt;p&gt;Перистимулдық уақыт гистограммаларын (PSTH, 3a, b-сурет; 4f-i-сурет) құру үшін біз 16 ms қадамы бар 200 ms жылжымалы терезеде спайктарды санаймыз.&lt;/p&gt;\n&lt;h4 id=\"zheke-nejrondardyng-roc-taldauy\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#zheke-nejrondardyng-roc-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жеке нейрондардың ROC-талдауы&lt;/span&gt;&lt;/a&gt;Жеке нейрондардың ROC-талдауы&lt;/h4&gt;\n&lt;p&gt;Нейрондық ROC-қисықтары стимул басталғаннан кейін 200 мс өткен соң басталатын 1,5 секундтық терезедегі импульстер (spike) саны негізінде есептелді. Анықтау шегі байқалған ең аз және ең көп импульстер саны арасында өзгеріп, 20 қадамға сызықты түрде бөлінді. AUC мәні ROC-қисығы астындағы ауданды интеграциялау арқылы алынды. Біз жекелеген MS-нейрондарының қызығушылық тудыратын әртүрлі сынақтарды қаншалықты жақсы ажырата алатынын сандық бағалау үшін ROC-талдауын жүргіздік.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ROC-талдауы (Receiver Operating Characteristic) — бұл бинарлық классификацияның сапасын бағалаудың статистикалық әдісі, мұнда AUC (қисық астындағы аудан) нейронның екі күйді ажырата алу қабілетін көрсетеді: AUC 1-ге неғұрлым жақын болса, нейрон сигналдарды соғұрлым жақсы ажыратады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жоғары және төмен сенімділікті салыстыру (3d, e-сурет). MS-нейрондарының жаңа және таныс сынақтарды әртүрлі сенімділік деңгейлерінде қалай ажырататынын бағалау үшін төрт сенімділік деңгейінің әрқайсысында кемінде екі сынағы бар нейрондар ғана талданды. Әділ салыстыру үшін ROC-талдауындағы бір топ сенімділік деңгейі бойынша стратификацияланды, ал екіншісі өзгеріссіз қалдырылды. FS-нейрондары үшін барлық TN-сынақтары (сенімділік деңгейіне қарамастан) өзгеріссіз топ қызметін атқарды және жоғары және төмен сенімділіктегі TP-сынақтарымен салыстырылды. NS-нейрондары үшін барлық TP-сынақтары өзгеріссіз деп алынды және жоғары және төмен сенімділіктегі TN-сынақтарымен салыстырылды.&lt;/p&gt;\n&lt;p&gt;Қате сынақтарын талдау (S5b-сурет, сондай-ақ 4a-e-суреттерге қатысты). MS-жасушаларының мінез-құлық үлгілерін ажырату сәтсіз болған сынақтарға (FP) жауап беру өрнегін бағалау үшін біз бірдей мінез-құлық таңдауына ие, бірақ нақты күйі әртүрлі (TP және FP) немесе таңдауы әртүрлі, бірақ нақты күйі бірдей (TN және FP) сынақтар жұбы үшін AUC мәнін есептедік. Бұл талдауға кемінде 5 қате сынағы бар нейрондар ғана енгізілді.&lt;/p&gt;\n&lt;p&gt;Жеке жасушаларды декодтау (3, 4-суреттер). Жеке жасушаларды декодтау Пуассонның қарапайым Байес классификаторы көмегімен орындалды. Әрбір нейрон үшін біз импульстер санын белгілер (features) ретінде қолдандық. Күтілетін импульстер саны (λ) әр сынып үшін жеке оқу сынақтары бойынша орташа мән ретінде бағаланды. Содан кейін әрбір тест бақылауы үшін логарифмдік ықтималдылық сәйкес λ мәндерімен параметрленген Пуассон таралулары көмегімен есептелді және сыныпқа жататындығы осы ықтималдылық негізінде белгіленді. Әрбір декодтау кезеңінде (n=100) біз тест үшін әр сыныптан кездейсоқ түрде бір сынақты (барлығы 2 сынақ) алып тастадық. Көрсетілген өнімділік осы 2x100 сынақтың классификациялары бойынша орташа мән болып табылады. Декодтау өнімділігі үшін нөлдік таралуды бағалау үшін біз дәл сол декодтау процедурасын қайталадық, бірақ сынып белгілерін 1000 рет араластырғаннан кейін. Топтық деңгейдегі маңыздылықты тексеру үшін біз әр жасуша үшін нөлдік таралуды есептедік, содан кейін әрбір ауыстыру (permutation) үшін жасушалар бойынша кездейсоқ өнімділіктерді орташаладық, нәтижесінде 1x1000 нөлдік таралу пайда болды. P-мәні жасушалар бойынша орташа декодтау өнімділігінен асатын нөлдік мәндер санына теңестірілді. Егер ешқандай нөлдік мән бақыланған өнімділіктен аспаса, p-мәні ауыстырулар санына (1/1000) бөлінген бірге теңестірілді.&lt;/p&gt;\n&lt;p&gt;Қате сынақтарын талдау (3g, h-суреттер). MS-жасушаларының FP-сынақтарын TP-сынақтарынан ажырата алатынын тексеру және бұл ажырату қабілетін дұрыс орындалған сынақтармен (TP және TN) әділ салыстыру үшін біз барлық тіркелген жасушаларды талдадық. Енгізілу үшін жасушаның кемінде 5 FP-сынағы болуы керек еді. Біз стимул басталғаннан кейін ms өткен соң басталатын 1,5 секундтық терезедегі импульстерді санадық. Біз жоғарыда сипатталған дәл сол өзара тексеру (cross-validation) процедурасын қолдандық. Оқу сынақтары декодерді TP-ді TN-нен немесе TP-ді FP-ден ажыратуға үйрету және жоғарыда сипатталғандай MS-жасушаларын таңдау үшін пайдаланылды. Әрбір нейрон үшін бұл екі декодтау өнімділігінің өлшемін және оның MS-жасушасы ретінде классификацияланған жүгірістер үлесін берді. Содан кейін біз кемінде 75% жүгірістерде MS ретінде классификацияланған жасушалар үшін декодтау өнімділіктерін салыстырдық. MS-жасушаларын классификациялау шегін 85 немесе 95%-ға өзгерту негізгі мәтінде келтірілген нәтижелерді өзгертпеді (S3f, g-сурет).&lt;/p&gt;\n&lt;p&gt;MS-жасушаларын классификациялау (4a-e-суреттер). MS-жасушасының жады таңдауы немесе жады ақиқаты сигналын алып жүретінін бағалау үшін біз кемінде 5 FP-сынағы бар MS-жасушаларын талдадық. Біз стимул басталғаннан 200 мс өткен соң басталатын 1,5 секундтық терезедегі импульстерді санадық. Біз жоғарыда сипатталған дәл сол өзара тексеру процедурасын қолдандық. Оқу сынақтары декодерді TP-ді FP-ден (бірдей таңдау, әртүрлі нақты күй) немесе TN-ді FP-ден (әртүрлі таңдау, бірдей нақты күй) ажыратуға үйрету және дәл сол жұптар үшін AUC мәнін есептеу үшін пайдаланылды (сондай-ақ «Жеке нейрондардың ROC-талдауы. Қате сынақтарын талдау» бөлімін қараңыз).&lt;/p&gt;\n&lt;p&gt;Әрбір MS-жасушасы, егер оның TN және FP үшін AUC мәні TP және FP үшін AUC мәнінен жоғары болса, MC ретінде, немесе егер оның TP және FP үшін AUC мәні TN және FP үшін AUC мәнінен жоғары болса, PS ретінде классификацияланды. Әрбір MS-нейроны үшін бұл екі декодтау өнімділігінің өлшемін және оның MC немесе PS жасушасы ретінде классификацияланған жүгірістер үлесін берді. Содан кейін біз кемінде 75% жүгірістерде кез келген түр ретінде классификацияланған жасушалар үшін декодтау өнімділіктерін салыстырдық.&lt;/p&gt;\n&lt;h4 id=\"populyaciyalykh-taldau-demikshirlengen-bas-komponentter-taldauy-dpca\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#populyaciyalykh-taldau-demikshirlengen-bas-komponentter-taldauy-dpca\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Популяциялық талдау: Демикширленген бас компоненттер талдауы (dPCA)&lt;/span&gt;&lt;/a&gt;Популяциялық талдау: Демикширленген бас компоненттер талдауы (dPCA)&lt;/h4&gt;\n&lt;p&gt;Біз бұрын сипатталғандай dPCA қолдандық. Алдымен когнитивті немесе сенсорлық өзгерістерді бағалау үшін косинустық тереземен 16 мс қадамы бар 500 мс жылжымалы терезеде әр нейрон үшін спайк жиілігінің траекториясын есептедік және оны базалық мәнге (стимул басталғанға дейінгі 1 с уақыт терезесі) қатысты орташа мән мен стандартты ауытқу арқылы z-мәніне айналдырдық. dPCA алгоритмі популяциялық белсенділікті мүдделі айнымалыларға сәйкес келетін маргинализацияланған деректер матрицаларына бөлуден басталады. Біз стимулдың нақты мәні мен мінез-құлық таңдауына қатысты маргинализацияланған деректер матрицаларын құрдық. Ескере кетйік, дұрыс сынақтар (TP және TN) екі маргинализацияда да әрқашан бірдей белгілерге ие, ал дұрыс емес сынақтар (FP және FN) стимул мен таңдауда қарама-қарсы белгілерге ие. Әрбір маргинализацияланған орташа мән үшін алгоритм содан кейін реттелген төмендетілген рангті регрессияны қолдана отырып, бөлек кодтау және декодтау матрицаларын есептейді. Декодтау матрицасының бағандары N өлшемді деректер (тестілеу үшін жеке сынақ деректері және оқыту үшін сынақтар бойынша орташаланған деректер) прокцияланатын демикширленген бас компоненттер (dPCs) ретінде пайдаланылды. Бұл матрицаның мәндері әр нейронның маргинализацияланған ұсынысқа қосқан үлесін сандық түрде көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;dPCA (демикширленген бас компоненттер талдауы) — бұл нейрондардың жалпы белсенділігін стимулды қабылдау немесе шешім қабылдау сияқты тапсырманың әртүрлі айнымалыларын көрсететін жеке компоненттерге бөлетін математикалық әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Декодтау талдауы үшін (5k–o-сурет) біз бір уақыт терезесінің деректерін пайдаландық (стимул басталғаннан кейін 200 мс кейін басталатын 1,5 с), осылайша уақытқа байланысты дисперсияны алып тастадық. dPCA декодтау талдауына орташа спайк жиілігі кемінде 0,2 Гц және әр шарт үшін кемінде бес сынағы бар нейрондар ғана кіргізілді. Кодтау өлшемдерінің статистикалық маңыздылығын бағалау үшін біз жеке сынақты декодтау процедурасын қолдандық. Әрбір итерация үшін сынақ түрінің біréуі («жаңа» және «ескі» стимулдар үшін дұрыс және дұрыс емес сынақтар) кездейсоқ таңдалып, жеке сынақ белсенділігі матрицасы құрылды. Қалған сынақтар dPCA кодтау өлшемдерін есептеу үшін пайдаланылатын оқыту деректері матрицасын құру үшін орташаланды. Содан кейін бөліп қойылған жеке сынақ деректері бірінші кодтау өлшеміне (оқыту деректеріндегі ең үлкен дисперсияны қамтитын) прокцияланды және ең жақын класс орташа мәніне сәйкес классификацияланды. Бұл процедура 1000 рет қайталанды, ал декодтау дәлдігі қайталаулар арасындағы дұрыс классификациялардың үлесі ретінде анықталды. Нөлдік бөлініс сынақ белгілерін араластыру және декодтау процедурасын 500 рет қайталау арқылы жасалды. P-мәні байқалған декодтау өнімділігінен асатын нөлдік мәндердің санына тең етіп қойылды.&lt;/p&gt;\n&lt;p&gt;Гиппокамптағы (HPC) декодтауға қолжетімді нейрондардың үлкен саны әсер етпегенін қамтамасыз ету үшін бақылау ретінде (512 vs 422; бұл сандар осы талдау үшін әр түрі 5 сынақтан азы бар нейрондарды алып тастауға байланысты 1e-суретте көрсетілгендерден төмен екенін ескеріңіз), біз HPC популяциясының 75%-ын кездейсоқ таңдадық (n = 384) және декодтауды 250 рет қайталадық. Нәтижелер сапалық жағынан ұқсас болып қалды, HPC-те есте сақтаудың нақты мәні мен таңдаудың маңызды декодталуы байқалды (S6c-сурет; сәйкесінше p = 0,009 және p = 0,018). Екі декодерді тікелей салыстыру үшін (S6d-суреттегі HPC және preSMA, SOZ ішінде және сыртында, сондай-ақ S8-суреттегі сол және оң HPC) біз нейрондар санын сәйкестендіргеннен кейін олардың арасындағы декодтау дәлдігінің айырмашылығын есептедік және бұл айырмашылықты сынақ белгілерін араластырғаннан кейін есептелген декодтау айырмашылықтарының нөлдік бөлінісімен салыстырдық (n = 500 араластыру). Ол үшін әрбір декодер алмасуында (n = 250) біз екі популяциядан да ең кіші популяцияның 80–85%-ын (preSMA, n = 340; SOZ ішінде, n = 170; сол жақ HPC, n = 190) кездейсоқ таңдадық және жоғарыдағыдай декодтау процедурасын қайталадық. Сонымен қатар, біз сынақ белгілерін 500 рет араластырдық және декодтау өнімділігі айырмашылықтарының нөлдік бөлінісін есептедік. P-мәні байқалған айырмашылықтан асатын нөлдік мәндердің санына тең етіп қойылды, егер ешқандай нөлдік мән байқалған мәннен аспаса, төменгі шекара 1/250 етіп алынды.&lt;/p&gt;\n&lt;h4 id=\"zheke-synakh-prorekciyasy\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#zheke-synakh-prorekciyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жеке сынақ прорекциясы&lt;/span&gt;&lt;/a&gt;Жеке сынақ прорекциясы&lt;/h4&gt;\n&lt;p&gt;Есте сақтауды кодтау бағыты бойынша жеке сынақ прорекцияларының таралуын бағалау үшін біз dPC мәндерін тек бір уақыт терезесінде (стимул басталғаннан кейін 200 ms басталатын 1.5 с) алдын ала таңдалған MS жасушаларында ғана есептедік. Жоғарыда сипатталғандай, біз кездейсоқ түрде әр түрлі сынақтың біреуін шетке қалдырдық. Қалған сынақтарды орташалап, олардың үстінде dPCA кодтау өлшемдерін есептедік. Әрбір өлшем үшін декодер матрицасы (шынайы есте сақтау күйі немесе таңдау үшін ең үлкен дисперсия компоненті) кодтау векторын бағалау үшін бірлік амплитудаға дейін нормализделді. Шетке қалдырылған сынақтар скаляр көбейту көмегімен осы кодтау векторына прорекцияланды. Бұл процедура 1000 рет қайталанып, әрбір кодтау бағыты бойынша жеке сынақ прорекцияларының таралуын тудырды. Әр түрлі сынақ түрлерінің таралулары арасындағы бөліну d-prime көмегімен сандық түрде бағаланды: &lt;span class=\"yfm-latex\" data-content=\"d'%20%3D%20%5Cfrac%7B%2F%5Cmu_1%20-%20%5Cmu_2%2F%7D%7B%5Csqrt%7B%5Cfrac%7B%5Csigma_1%5E2%20%2B%20%5Csigma_2%5E2%7D%7B2%7D%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, мұндағы µ₁ және µ₂ — 1 және 2 таралулардың орташа мәндері, ал σ₁² және σ₂² — 1 және 2 таралулардың дисперсиялары.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;d-prime (d') көрсеткіші орташа мәндер мен шашыраңқылықтағы айырмашылықты ескере отырып, екі деректер таралуын қаншалықты жақсы ажыратуға болатынын өлшейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз алдымен FP және TN таралуларының бөлінетінін тексердік (d'&amp;gt;0). Ол үшін біз FP пен TN арасындағы d' мәнін есептедік (6c-сурет, d'₁) және оны сынақ белгілерін араластырғаннан кейін сол процедура көмегімен жасалған d-prime нөлдік таралуымен салыстырдық. Әрбір бір сынақты қалдыру итерациясында (n=1000, жоғарыны қараңыз) біз әр сынақ түрі үшін 1×500 жеке сынақ прорекциясының таралуын генерациялай отырып, сынақ белгілерін 500 рет араластырдық және араластырылған d-prime мәнін есептедік. Бұл бақыланатын d'₁ мәнімен салыстырылатын 1000 нөлдік FP-TN d-prime мәндерін берді. Нөлдік мәндердің ешқайсысы бақыланатын d-prime мәнінен асып түспегендіктен, p-мәні 1/1000 (нөлдік таралудың өлшемділігі) етіп белгіленді.&lt;/p&gt;\n&lt;p&gt;Содан кейін біз сәйкес d-prime айырмашылықтарын пайдалана отырып, FP–TN және шын оң және жалған оң нәтижелердің (TP–FP) (6c-сурет, d'₂) таралуларының бөлінуін салыстырдық. d'₂ мен d'₁ арасындағы оң айырмашылық FP сынақтары TP-ге қарағанда TN-ге жақынырақ болып қалатынын, бірақ соған қарамастан dPCA шынайы күй осі бойымен TP бағытына қарай ығысатынын көрсетер еді. Бұны статистикалық тұрғыдан тексеру үшін біз жоғарыда сипатталғандай алынған араластырылған белгі таралуларын пайдаландық және TP-FP таралулары FP-TN таралуларына қарағанда көбірек бөлінбейді деген гипотеза бойынша нөлдік таралуды генерациялау үшін d-prime айырмашылығын есептедік. Бұл 1000 нөлдік d-prime айырмашылығын тудырды. Содан кейін біз TP-FP d-prime және FP-TN d-prime бақыланатын айырмашылығын осы нөлдік таралумен салыстырдық. Нөлдік айырмашылықтардың ешқайсысы d-prime бақыланатын айырмашылығынан асып түспегендіктен, p-мәні 1/1000 (нөлдік таралудың өлшемділігі) етіп белгіленді. 6f-сурет үшін жеке сынақ прорекциясының таралулары ұқсас түрде генерацияланды, бірақ тестілеуге (прорекциялауға) арналған TP сынақтары олардың сенімділігіне (жоғары немесе төмен) байланысты таңдалды. 6g-сурет үшін PS жасушалары («MS жасушаларын жіктеу» бөлімінде сипатталғандай анықталған) MS жасушалары популяциясынан шығарылды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h-f1.jpg\" alt=\"1-сурет. Тапсырма, мінез-құлық және тіркелген жасушалардың жиынтығы. a, Тану сынағының мысалы. b, Ми атласында көрсетілг\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Тапсырма, мінез-құлық және тіркелген жасушалардың жиынтығы. a, Тану сынағының мысалы. b, Ми атласында көрсетілген электродтардың орналасуы. Әрбір нүкте тіркеу аймағы бойынша боялған микрометрлік сымдар шоғын білдіреді. Ақ зат немесе мақсатты емес координаттар үлгі мимен біріктірілгендіктен пайда болады. c, Мүмкін болатын сынақ түртері: Жалған оң нәтижелер (қызыл түспен ерекшеленген FP) субъект «жаңа» суретті «ескі» ретінде жіктеген кезде пайда болады («Иә» жауабы). d, Сол жақта: зерттелген мақсатты суреттің мысалы (ескі). Оң жақта: зерттелмеген (жаңа), бірақ жоғары ықтималдықпен ескі (FP) ретінде жіктелген визуалды ұқсас тұзақ суреті (FP жиілігі = 54%). e, Оқшауланған бірліктердің саны (сұр, барлық ми аймақтары бойынша жалпы n = 3506) және мінез-құлық негізінде алынып тасталған бірліктердің саны (қызыл, n = 660). (f-j) Мінез-құлық. f, Тану жадының дәлдігі. Әрбір нүкте — бір сессия (97 пациент бойынша n = 133), қызыл — орташа ± стандартты ауытқу. (g-f), Жеке сессиялар (сұр) және орташа (қызыл) үшін сенімділік функциясы ретіндегі дәлдік. Әрбір деректер нүктесі әртүрлі сенімділік деңгейін білдіреді, мұнда 6 ескі сынақтар үшін ең жоғары сенімділікке сәйкес келеді. h, (g)-де көрсетілген ROC қисығы астындағы AUC. Үзілген қызыл сызық қосу критерийлерінің бірі болып табылады (AUC&amp;gt;=0.6, қосылған n = 112, 84 пациент). i, Дәлдік төмен сенімділік сынақтарымен салыстырғанда жоғары сенімділік сынақтарында айтарлықтай жоғары болды (p=1.24x10-31, t(110)=16.55, жұптастырылған t-тест). Әрбір сызық — бөлек сессия. j, Қате жауаптардың («иә» немесе «жоқ») дұрыс жауаптармен салыстырғанда сенімділік рейтингтері айтарлықтай төмен болды (TP пен FP: t(110)=13.41, p= 7.05x10-25, жұптастырылған t-тест; TN пен FN: t(111)=-8.72, p= 3.11x10-14, жұптастырылған t-тест. Теріс t статистикасы «жоқ» жауабы үшін төменгі сенімділікке сәйкес келетін жоғары сенімділік рейтингіне байланысты екенін ескеріңіз, a панелін қараңыз). *** p&amp;lt;0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h-f3.jpg\" alt=\"3-сурет. Тану жадының жеке нейрондық қолтаңбалары: Жадты таңдаушы жасушалар. (a-b) Жадты таңдаушы жасушалардың мысалдары\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет. Тану жадының жеке нейрондық қолтаңбалары: Жадты таңдаушы жасушалар. (a-b) Жадты таңдаушы жасушалардың мысалдары. Стимулдың басталуы t=1 кезінде. a, Дұрыс танылған ескі және жаңа стимулдар үшін импульсация жиілігін ең көп арттырған гиппокамп нейронының мысалы. b, Дұрыс танылған жаңа және ескі стимулдар үшін импульсация жиілігін арттыратын басқа мысал жасуша. c, Жадты таңдаушы (MS) жасушалары ретінде сапаланған барлық тіркелген жасушалардың үлесі. Қою сұр түс қосымша VS жасушалары ретінде де сапаланған MS жасушаларын көрсетеді. MS жасушаларының үлесі барлық аймақтарда кездейсоқ күтілгеннен үлкенірек (қызыл сызық) (HPC, p=0.001, AMY, p=0.001, ACC, p=0.002, preSMA, p=0.001). d, e, MS жасушасының сигналы төмен сенімділік сынақтарымен салыстырғанда жоғары сенімділік сынақтарында күштірек. d, Ми аймақтары бойынша жоғары және төмен сенімділік үшін MS жасушаларының AUC мәндерін жұптық салыстыру (p-мәндері жұптастырылған t-тест). ACC-дан басқа барлық ми аймақтарындағы MS жасушаларында (p=0.1) төмен сенімділікке қарағанда жоғары сенімділік сынақтары үшін айтарлықтай жоғары AUC болды (HPC p=0.006, AMY p=0.0009, preSMA p=0.03). d және e талдауына тек пациенттер жоғары және төмен сенімділікті ажырата алатын мінез-құлық сессиялары кірді (53 пациент бойынша 69 сессия). e, d сияқты, бірақ барлық 4 ми аймағында жаңашылдықты ұнататын (көк нүктелер) және таныстықты ұнататын (қызыл нүктелер) жасушалар үшін бөлек шашыранды график ретінде салынған. MS жасушаларының екі түрі үшін де жоғары сенімділік сынақтарына арналған AUC төмен сенімділікке қарағанда жоғары екенін ескеріңіз. f, Гипотезаның иллюстрациясы: өрнекті бөлуді пайдаланатын нейрондардың белсенділігі (көк нүктелер) жауап кез келген жағдайда «ескі» болуына қарамастан, шынайы ескі (TP) және жалған ескі (FP) стимулдарды сенімді түрде ажыратады. Керісінше, өрнекті аяқтауға ұқсас белсенділікті көрсететін нейрондар (күлгін нүктелер) FP сынақтарына TP сынақтары сияқты немесе ұқсас түрде жауап береді. Нүктелер гипотетикалық модельденген деректерді көрсетеді. (g-h) (f)-де көрсетілген гипотезаны тексеруге арналған деректер. Барлық тіркелген MS жасушаларында белсенділік шешім сигналы емес, жадтың бар екенін көрсете отырып, TP және FP сынақтары арасында айтарлықтай ерекшеленді. g, Ми аймағы бойынша түспен кодталған, кездейсоқ таңдалған сынақтардың кем дегенде 75%-ында жадты таңдаушы болған нейрондар үшін өзара тексерілген жеке жасушалық декодтау өнімділігі. Қызыл — орташа ± стандартты ауытқу. Көптеген MS жасушалары үшін TP және FP декодтау өнімділігі кездейсоқ деңгейден асып түсті. h, g-дегі жасушалар үшін TP пен TN және TP пен FP декодтау өнімділіктерін жұптық салыстыру. HPC, ACC және preSMA-да TP пен TN және TP пен FP екеуі де кездейсоқтықтан айтарлықтай жоғары деңгейде декодталды (p=0.001), TP пен TN декодтауы TP пен FP-ге қарағанда айтарлықтай жоғары болды (HPC p=7.5x10-5, ACC p=7.6x10-5, preSMA p=7.4x10-6, signrank тесті). AMY-да тек TP пен TN айтарлықтай декодталды (p=0.001, TP пен FP p=0.4). * p&amp;lt;0.05, ** p&amp;lt;0.01, *** p&amp;lt;0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h-f4.jpg\" alt=\"4-сурет. Мінез-құлық қателеріне қарамастан, MS жасушаларының өрнекті бөлу ішкі түрінің белсенділігі шынайы ескі және жал\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет. Мінез-құлық қателеріне қарамастан, MS жасушаларының өрнекті бөлу ішкі түрінің белсенділігі шынайы ескі және жалған ескі стимулдарды ажыратады.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h-f5.jpg\" alt=\"5-сурет. Жадтың негізгі шындығы да, мінез-құлық таңдауы да популяция деңгейінде ұсынылған. a-e, HPC-дегі жад пен таңдау \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет. Жадтың негізгі шындығы да, мінез-құлық таңдауы да популяция деңгейінде ұсынылған. a-e, HPC-дегі жад пен таңдау көріністерінің араласпаған бас компоненттерінің талдауы (dPCA). a, Бөлінген HPC (жасыл түс) бар Brainnetome атласын пайдаланатын 3D ми моделі. b, Негізгі шындық, шешім және екеуінің арасындағы өзара әрекеттесу дисперсияның айтарлықтай бөлігін түсіндіреді (сәйкесінше 19%, 19% және 18%). c-e, Әрбір айнымалы үшін ең көп дисперсияны түсіндіретін негізгі шындық (c), шешім (d) және өзара әрекеттесу (e) dPC-леріне прокцияланған нейрондық белсенділік. c-де жад негізгі шындығының (қызыл және көк түстер), d-де мінез-құлық таңдауларының (тұтас және үзілген сызықтар) және e-де дұрыс және қате сынақтардың ажыратылатынына назар аударыңыз. f-j, a-e сияқты, бірақ preSMA үшін. k, Сол жақтағы жолақ тек бір уақыт терезесі (стимул басталғаннан кейін 1.5 с) қарастырылған кезде dPCA параметрлерімен түсіндірілетін дисперсияны көрсетеді. HPC-де жадтың негізгі шындығы да, шешім де тиісті dPCA осьтерінен жеке сынақ деңгейінде декодталуы мүмкін (стимул басталғаннан кейін 1.5 с ішіндегі орташа). Әрбір шартта кемінде 5 сынағы бар жасушалар ғана қарастырылды (n=512). HPC-де негізгі шындықты да (p=0.003), шешімді де (p=0.009) декодтау маңызды болды. Бейж түсті нүкте FP сынақтарын жіктеу дәлдігін белгілейді. i, k сияқты, бірақ preSMA үшін. preSMA-да тек шешім ғана маңызды түрде декодталды (p=1.7x10-8, негізгі шындық p=0.17). m-o, HPC-дегі популяция (dPCA нәтижесі) мен жеке жасушалық баптау арасындағы байланыс. MC және PS жасушалары негізгі шындық (MS p=5.9x10-9, PS p=1.6x1-36) және шешім (MC p=2.2x10-20, PS p=9.2x10-21) осьтері үшін MS емес жасушаларға қарағанда жоғары dPCA салмақтарына ие болды. PS жасушаларында сондай-ақ MC жасушаларына қарағанда негізгі шындық декодері осі үшін айтарлықтай жоғары салмақтар болды (p=0.005, шешім осі MC пен PS p=0.2). Барлық m және n p-мәндері екі таңдамалы t-тест болып табылады. o, m және n сияқты, бірақ бір-бәріне қарсы салынған. Жоғарғы оң жақ бұрыштағы кірістіру негізгі шындық (ашық көк) және шешім (қызғылт) осьтері үшін dPCA салмақтарының таралуы болып табылады. 0-ге орталықтанғанына назар аударыңыз. * p&amp;lt;0.05, ** p&amp;lt;0.01, *** p&amp;lt;0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h-f6.jpg\" alt=\"6-сурет. Өрнекті ажыратумен байланысты нейрондық белсенділік жады күшінің үздіксіз сигналына үлес қосады. a, HPC популяц\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сурет. Өрнекті ажыратумен байланысты нейрондық белсенділік жады күшінің үздіксіз сигналына үлес қосады. a, HPC популяциясынан PS түріндегі MS жасушаларын (n=20) алып тастау шынайы мәнді (ground truth) декодтау қабілетін жояды (p=0.5), бірақ шешімді емес (p=0.03). b, Тіркелген барлық MS жасушалары популяциясындағы дисперсияның көп бөлігі сәйкесінше HPC және preSMA-да шынайы мәнмен (53%) және шешіммен (58%) түсіндіріледі. Барлық MS жасушаларының dPCA негізінде. c, TP, TN және FP сынақтары үшін dPC шынайы мән декодерінің осіне жеке сынақ проекцияларының бөлінуі (қызыл, көк және бежевый түстер). TP және FP бөліністері FP және TN-ге қарағанда көбірек ажыратылды (сәйкесінше d-prime = 1.68 (d’2) және 0.76 (d’1)). d, Байқалған FP-TN d-prime (d’1) және TP-FP (d’2) пен FP-TN d-primes айырмашылығын сынақ белгілерін араластырғаннан кейін d-primes пен айырмашылықты есептеу арқылы жасалған нөлдік бөліністермен салыстыру. Ауыстырылған мәндердің ешқайсысы d’1 және d’2 - d’1 үшін байқалған мәндерден асып түскен жоқ (екеуі ҳам p=0.001, ауыстырулар санына бөлінген ретінде белгіленген). e, Сигналды анықтау теориясы (SDT) болжамдарының схемалары. Жоғарғы жағы: жады күші бұл сигнал шешім шегінен асатынына негізделген тану шешімдері бар үздіксіз сигнал ретінде ұсынылған. Осы осьте жоғары сенімді шешімдер үлкен жады күшімен байланысты және орташа критеріезден алысырақ орналасады. Төменгі жағы: PS жасушаларынсыз әртүрлі жады күші бар «ескі» шешімдер арасында ешқандай бөлінуге қол жеткізілмейді (жоғары, төмен сенімділік TP, FP). f, c-мен бірдей, бірақ жоғары және төмен сенімділік шешімдері үшін бөлек салынған TP сынақтарымен. HPC-де жоғары сенімділік TP (қызыл түс) бөлінісі TN сынақтарынан ең көп ажыратылған болды, төмен сенімділік TP үшін ажыратылуы азырақ және FP сынақтары үшін одан да аз, SDT болжағандай. PS жасушалары алынып тасталған кезде (g), әртүрлі шешімдері бар сынақтардың проекциялары әлі де бөлінген, ал жоғары сенімділік, төмен сенімділік TP және FP сынақ проекциялары (бірдей шешім) шынайы мән осьінде құлайды. *** p&amp;lt;0.001&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#zertteu-s
