            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"274\" cy=\"127\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"526\" cy=\"282\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · MICROBIOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Ғалымдар кодтаушы сақиналы&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;РНК-лардың бар екенін алғаш&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;рет дәлелдеді&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-f1.jpg\" alt=\"1-сур. Зета-вирустардың құрылымдық ерекшеліктері. (A) ZV1, ZV2 және ZV3 РНК-ларының минималды бос энергиясының екінші ре\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сур. Зета-вирустардың құрылымдық ерекшеліктері. (A) ZV1, ZV2 және ZV3 РНК-ларының минималды бос энергиясының екінші реттік құрылымының дөңгелек диаграммасы. РНК геномы ішіндегі болжанған комплементарлы жұптасу өзара әрекеттесулері доғалармен көрсетілген, олардың түстері (ақтан қою қызылға дейін) жергілікті бос энергия үлесі (ккал/моль) ретінде көрсетілген жұптың тұрақтылығын көрсетеді. (+) және (-) балға тәрізді рибозимдердің (HHRz) салыстырмалы орналасуы сәйкесінше күлгін және қызғылт сары түстермен белгіленген. ORF A ((+) тізбегі) және ORF B ((-) тізбегі) сәйкесінше көк және жасыл түстермен көрсетілген, ал үшбұрыштар сәйкес бастапқы кодондарды белгілейді. (B) ZV1, ZV2 және ZV3 (+) (сол жақта) және (-) (оң жақта) HHRz екінші реттік құрылымы. Кесу орны көрсеткімен белгіленген және каталитикалық ядро ішіндегі консервативті нуклеотидтер қара фонмен ерекшеленген.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Ғалымдар алғаш рет дзета-вирустардың өмір сүретінін тәжірибе жүзінде растады және бетавироид тәрізді жаңа РНК түрін ашты. Бұл сақиналы молекулалар ақуызды кодтай алады, ДНК-сыз көбейеді және симметриялы репликацияны қолданады. Метатранскриптомикалық талдау олардың топырақ пен батпақты жерлерде кең таралғанын көрсетті. Бұл зерттеу сақиналы РНК репликондарының әртүрлілігін айтарлықтай кеңейтеді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Топырақ үлгілерінде дзета-вирустардың бар екені дәлелденді.&lt;/li&gt;\n&lt;li&gt;Бетавироид тәрізді жаңа кодтаушы сақиналы РНК-лар ашылды.&lt;/li&gt;\n&lt;li&gt;ДНК қатысуынсыз жүретін симметриялы репликация расталды.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Вироид тәрізді РНК — бұл өзін-өзі кесетін рибозимі бар сақиналы геномды жұқпалы агенттер. Жаңа зерттеу дзета-вирустардың өмір сүретініне алғаш рет тәжірибелік дәлелдер ұсынып, жаңа бетавироид тәрізді РНК класын сипаттады. Ғалымдар топырақтан үш жаңа дзета-вирусты анықтап, олардың бірін зертханада толық зерттеді.&lt;/p&gt;\n&lt;p&gt;Зерттеушілер екі полярлы жіптің де бар екенін, ДНК формаларының жоқтығын және рибозимдердің белсенділігін растады. Сонымен қатар, әртүрлі рибозимдері бар 16 дзета-вирус табылды. Бұл нәтижелер олардың кең таралуын және айналмалы репликация механизмін қолданатынын көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бұл зерттеу препринт болып табылады және бұл РНК-лардың нақты иелері әлі де толық зерттелмеген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Бұл зерттеу ақуызды кодтау қабілеті бар вироид тәрізді РНК-лардың екі жаңа тобының бар екенін дәлелдеп, осындай жұқпалы агенттердің әртүрлілігі мен күрделілігін айтарлықтай кеңейте түседі. Вироид тәрізді РНК-ларға тән қасиеттермен қатар — сақиналы РНК геномдары, ықшам екінші реттік құрылымдар және екі полярлық тізбекте де белсенді жұмыс істейтін өзін-өзі кесетін рибозимдер — бұл молекулалар екі тізбекте де ақуызды кодтау әлеуетіне ие, ал бұл кодтау қабілеті геномдық РНК-ның өзінің ұзындығынан асып түседі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу жұмысы репликация мен ақуызды кодтау тізбектері бірдей геномдық аймақтарда тоғысқан жаңа кодтаушы вироид тәрізді РНК-лардың (дзета-вирустар мен бетавироид тәрізді РНК-лар) бар екенін алғаш рет эксперименталды түрде дәлелдеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Репликациямен байланысты РНК мотивтері мен ақуызды кодтаушы тізбектердің бір геномдық аймақта қатар өмір сүруі генетикалық ақпараттың тым жоғары деңгейде тығыздалғанын көрсетеді және геномның ұйымдастырылуының бұрын беймәлім болған стратегиясын ашады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Өзін-өзі кесетін рибозимдер — бұл ақуыз-ферменттердің көмегінсіз өз тізбегін өзі қиып ала алатын РНК учаскелері, олар осындай агенттердің көбею процесінде шешуші рөл атқарады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сонымен қатар, бұл нәтижелер осы РНК-лардың шығу тегіне, эволюциясына, экспрессиясына және биологиялық рөлдеріне, сондай-ақ осындай өте ықшам геномдық сәулетті қалыптастырған сұрыптау қысымдарына қатысты маңызды сұрақтар туындатады.&lt;/p&gt;\n&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Вироид тәрізді РНК-лар (vdlRNAs) — тығыз, комплементарлы жұптасқан екіншілік құрылымды түзетін бір тізбекті сақиналы геномы бар жұқпалы агенттер тобы. Олардың репликациясы әдетте иесінің ферменттері арқылы жүзеге асатын сақиналы репликация механизмі мен аралық РНК түзілімдері арқылы жүреді. Бірқатар жағдайларда оларда репликация өнімдерін дәл кесуді кататиздейтін өздігінен кесілетін рибозималар болады. Тобына қарай vdlRNAs коодтамайтын болуы мүмкін немесе репликация мен тіршілік циклінің басқа қырларына қажетті гипотетикалық ақуыздарды кодтайтын бір немесе бірнеше ашық оқу рамкаларын (ORF) ұстайды. Бұл кең санатқа геном көлемі, иелер ауқымы және көбею стратегиялары бойынша ерекшеленетін әртүрлі агенттер кіреді. Вироид тәрізді РНК-лар арасында вироидтар ең кішкентай жұқпалы агенттер болып саналады (шамамен 200–450 нуклеотид, nt), олар сақиналы кодтамайтын РНК-лардан тұрады, дербес репликацияланады және өсімдіктерді жүйелі түрде зақымдайды. Вироид тәрізді сателлиттік РНК-лар құрылымы жағынан вироидтарға ұқсайды және өсімдіктерге әсер етеді, бірақ жұқпалы болу үшін көмекші вирусты қажет етеді.&lt;/p&gt;\n&lt;p&gt;Гепатит дельта вирусы (HDV) және дельтавирус тәрізді РНК-лар вироидтар мен сателлиттік РНК-ларға қарағанда үлкенірек сақиналы геномдарға ие (шамамен 1200–2000 nt), дельта-антигенді немесе туыстас ақуыздарды кодтайды және адамдар мен жануарларды зақымдайды. Вироид тәрізді элементтердің тағы бір тобына ретрозимдер мен ретровироидтар жатады, алайда олар жұқпалы емес және жануар немесе өсімдік иесінің геномына біріктірілген ДНК эквивалентіне ие. Соңғы кездегі метатранскриптомдық талдаулар vdlRNAs бұрын ойлағаннан әлдеқайда кең тарағанын және әртүрлі экологиялық орталарда, соның ішінде саңырауқұлақтар мен бактерияларда кездесетінін көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метатранскриптомика — табиғи үлгілерден тікелей бөлініп алынған барлық РНК молекулаларын ауқымды түрде талдау әдісі, ол зертханада алдын ала өсірмей-ақ жаңа вирус геномдарын табуға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zhanga-viroid-taerizdi-agentter-zhaene-olardyng-khasietteri\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#zhanga-viroid-taerizdi-agentter-zhaene-olardyng-khasietteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жаңа вироид тәрізді агенттер және олардың қасиеттері&lt;/span&gt;&lt;/a&gt;Жаңа вироид тәрізді агенттер және олардың қасиеттері&lt;/h4&gt;\n&lt;p&gt;Жақында сипатталған vdlRNAs ерекше тобына тек in silico анықталған дзета-вирустар жатады. Бүгінгі таңда қоршаған орта мен омыртқасыздардан алынған метатранскриптомдық деректер қорынан шамамен 311 дзета-вирус тізбегі анықталды, алайда олардың нақты иелері әлі белгісіз және олардың бар екендігіне ешқандай тәжірибелік дәлел келтірілмеген. Дзета-вирустар сақиналы РНК болып табылады (324–789 nt) және таяқша тәрізді екіншілік құрылымға оралады деп болжанады. Бұл топтың басты ерекшелігі — олардың геномдық РНК-сы үшке еселі нуклеотидтер санынан тұрады және әрбір полярлық тізбекте бүкіл геномын қамтитын, стоп-кодондары жоқ бір ORF кодтайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу барысында дзета-вирустың алғашқы тәжірибелік идентификациясы мен сипаттамасы ұсынылып, әрбір тізбекте рибозима мен ORF бар бетавироид тәрізді РНК-лардың жаңа тобы ашылды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл жұмыста авторлар дзета-вирустың алғашқы тәжірибелік идентификациясы мен молекулалық сипаттамасын беретін деректерді ұсынады. Сонымен қатар, әрбір полярлық тізбекте рибозима да, ORF те бар, бетавироид тәрізді РНК-лар деп аталатын коодтайтын vdlRNAs жаңа тобы сипатталған. Айта кету керек, мономерлі РНК молекуласы ішіндегі ORF-те рамкаішілік тоқтау кодоны жоқ. Оның орнына трансляцияның тоқтауы болжамды мультимерлі репликация аралық өніміндегі рамканың ығысуы оқиғасынан кейін немесе сақиналы РНК-ның қайталанмалы трансляциясы арқылы жүзеге асады. Екі жағдайда да түзілетін кодтаушы тізбек мономерлі vdlRNA геномының ұзындығынан асып түседі. Сондай-ақ табиғатта бетавироид тәрізді РНК-лардың кездесетінін растайтын деректер көрсетіліп, талқыланды.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"zhanga-dzeta-virustardy-anykhtau-zhaene-sipattau\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#zhanga-dzeta-virustardy-anykhtau-zhaene-sipattau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жаңа дзета-вирустарды анықтау және сипаттау&lt;/span&gt;&lt;/a&gt;Жаңа дзета-вирустарды анықтау және сипаттау&lt;/h4&gt;\n&lt;p&gt;Рибозимдері бар РНҚ-ларды анықтау мақсатында INFERNAL алгоритмі (16) арқылы топырақтан алынген алты RNAseq кітапханасының үшеуінде (C30, C105 және C110) сәйкесінше 109, 32 және 17 контиг (болжамды vdlРНҚ-ларға сәйкес келетін) анықталды. Осы контигтердің арасынан кейінгі сипаттау үшін дзета-вирустардың тән белгілерін көрсететін үшеуі таңдап алынды. C105 және C110 кітапханаларынан алынған NODE_21658 (647 нт ұзындық; 3.67 жабындық) және NODE_1090 (721 нт ұзындық; 11.18 жабындық) контигтері ZV1 деп аталған 600 нт өлшемдегі бірдей болжамды сақиналы РНҚ-ға сәйкес келеді (1A-сурет). C30 кітапханасынан алынған NODE_198789 (591 нт ұзындық; 22.62 жабындық) және NODE_416260 (447 нт ұзындық; 0.52 жабындық) контигтері сәйкесінше ZV2 және ZV3 деп аталған 405 және 399 нт өлшемдегі екі болжамды сақиналы РНҚ-ға сәйкес келеді (1A-сурет). Бұл РНҚ-лардың нуклеотидтік тізбегінің өзара ұқсастығы 52%-дан 58.5%-ға дейін құрайды және BLAST іздеу нәтижелері бойынша бұрын хабарланған басқа тізбектермен ешқандай елеулі ұқсастық көрсетпеді. Барлық үш РНҚ-ның әрбір полярлық тізбегінде III типті балға тәрізді рибозим (HHRz) болды (1B-сурет), ал HHRz тізбектері болжамды таяқша тәрізді екінші реттік құрылымда жұптасқан (1A-сурет). Кейінгі деректер бойынша (-) тізбегінде орналасқан ZV1-дің бір HHRz рибозимі сақталған каталитикалық орталығында мутацияға ие (әдеттегі CUGA мотиві CCGA-мен ауыстырылған).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;INFERNAL — бұл құрылымдық РНҚ-ларды іздеуге арналған биоинформатикалық әдіс, ал III типті балға тәрізді рибозимдер (HHRz) — өзін-өзі кесуге қабілетті каталитикалық РНҚ учаскелері.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Барлық осы vdlРНҚ-лар әрбір полярлық тізбекте бір ашық оқу рамкасын (ORF) қамтиды, мұнда әрбір ORF рамкаішілік стоп-кодондарсыз бүкіл (сақиналы) геномды қамтиды. Нәтижесінде, ZV1, ZV2 және ZV3-тің әрбір тізбегі болжам бойынша сәйкесінше 200, 135 және 133 аминқышқылдан (aa) тұратын тізбектің шексіз тандемдік қайталануынан тұратын ақуызды кодтайды. Эукариоттық кодтан басқа генетикалық кодтарды қолданған кезде қосымша ORF-тер табылмады. Ықшам сақиналы, таяқша тәрізді РНҚ екінші реттік құрылымы, жұптасқан HHRz-тердің болуы және сақиналы РНҚ-ны болжамды шексіз тандемдік қайталанатын ақуыздарға үзіліссіз аударуды қамтамасыз ететін үшке еселік геном ұзындығы (405, 399 және 600 нт) дзета-вирустардың айқындаушы белгілерін құрайды.&lt;/p&gt;\n&lt;p&gt;Алты болжамды мономерлік дзета-вирус ақуыздары бір-бірімен 11.3%-дан 24.8%-ға дейінгі төмен аминқышқылдық тізбектік ұқсастықты көрсетті. AlphaFold 3 арқылы болжанған мономерлік дзета-вирус ақуыздарының үшінші реттік құрылымдары негізінен α-спиральді мотивтерді көрсетті (S1-сурет). Алайда, сәйкес үлгілеу (pTM) ұпайлары төмен болып, 0.16 мен 0.24 аралығында өзгерді, бұл құрылымдық модельдерге деген сенімнің шектеулі екенін көрсетеді (pTM &amp;lt; 0.5). Сақиналы немесе мультимерлік дзета-вирус РНҚ-ларының қайталанатын трансляциясы нәтижесінде түзілуі мүмкін димерлік және тримерлік ақуыздардың болжамды құрылымдары да негізінен α-спиральді мотивтерді көрсетті, бірақ бұл модельдер де төмен pTM ұпайларына ие болды (S1-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Дзета-вирустардың геномдары жұптасқан HHRz рибозимдері бар 399, 405 және 600 нт ұзындықта және тандемдік қайталанатын ақуыздарды кодтайтын үшке еселік оқу рамкаларына ие.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дзета-вирус геномдарындағы тізбектің вариабельділігін бағалау үшін HTS секвенирлеу деректері талданды. Тізбектің вариабельділігі өте шектеулі болады деп күтілді, өйткені геном бір мезгілде сақталған РНҚ құрылымдық ерекшеліктерін (ықшам екінші реттік құрылым және өзін-өзі кесетін рибозимдер) сақтай отырып, екі полярлық тізбекте де кодтау қабілетін сақтауы тиіс. Сонымен қатар, тандемдік қайталанатын ақуыздарды кодтаудың әлеуетті қабілеті геном ұзындығының үш нуклеотидке еселі болып қалуын талап етеді.&lt;/p&gt;\n&lt;p&gt;C105 және C110 кітапханаларынан сәйкесінше 150 және 627 оқулар (reads) ZV1 тізбегінде картаға түсірілді. Түзетілген оқуларды талдау C110 кітапханасында 57.1% жиілікпен бірыңғай полиморфты сайтты (137-позициядағы G&lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;C алмасуы) анықтады (варианттың p-мәні = 6.3 × 10⁻⁵). Бұл нуклеотидтік ауыстыру екі ORF кодтаған болжамды ақуыздардың ешқайсысында мерзімінен бұрын стоп-кодондарды тудырған жоқ. Алайда, бұл ORF A кодтаған әлеуетті ақуызда консервативті емес аминқышқылдық алмасуға (Триптофан &lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; Серин) және ORF B кодтаған ақуызда консервативті алмасуға (Глутамин &lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; Глутамин қышқылы) әкелді. C30 кітапханасында барлығы 508 оқу ZV2 тізбегінде картаға түсіріліп, екі полиморфты сайтты (сәйкесінше және 16-позициялардағы G&lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;А және T&lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;А алмасулары) анықтауға мүмкіндік берді. Бұл варианттар сәйкесінше 69.1% (p-мәні = 6.8 × 10⁻¹³⁰) және 35.6% (p-мәні = 4.7 × 10⁻⁹²) жиіліктермен орын алды. G&lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;А мутациясы екі болжамды ақуызда да консервативті емес алмасуларға әкеліп соқтырып, ORF A және ORF B өнімдерінде Глицин &lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; Глутамин қышқылы және Пролин &lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; Серин өзгерістерін тудырды. Сол сияқты, T&lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;А ауыстыруы екі болжамды ақуызда да консервативті емес алмасуларға, атап айтқанда ORF A-да Триптофан &lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; Аргинин және ORF B-де Глутамин &lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; Лейцин өзгерістеріне әкелді. C30 кітапханасынан тек сегіз оқу ZV3 тізбегіне картаға түсірілді және ешқандай полиморфты сайттар анықталмады, бұл ең ықтимал жағдайда өте төмен секвенирлеу тереңдігіне байланысты. Маңыздысы, талданған vdlРНҚ-лардың ешқайсысында нуклеотидтердің кірістірілуі немесе жойылуы анықталған жоқ, бұл геном ұзындығы мен оқу рамкасы тұтастығының қатаң сақталғанын көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Кейбір үлгілер үшін секвенирлеудің төмен тереңдігі (мысалы, ZV3 үшін тек 8 оқу) вариабельділікті талдау дәлдігін шектейді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қосымша сипаттау үшін біз ZV1-ді үлгі ретінде пайдаландық. ZV1-ді анықтау үшін топырақ үлгілерінен алынған РНҚ препараттары кездейсоқ праймерлер көмегімен кері транскрипцияланды, содан кейін сақиналы мономерлік және/немесе мультимерлік пішіндерді амплификациялауға қабілетті қарама-каршы полярлықтағы екі көршілес арнайы праймермен (ZetaV_1 және ZetaV_2, S1-кесте) ПЦР-амплификация жүргізілді. ZV1-дің толық ұзындықтағы геномына сәйкес келетін өлшемдегі ампликон C105 және C110 топырақ үлгілерінің екеуінен де алынды (2A-сурет). Амплификацияланған кДНК-ларды клонирлеу және Сэнгер бойынша секвенирлеу олардың тізбегі in silico анықталған ZV1 геномдық РНҚ-сына сәйкес келетінін растады, бұл оның бар екендігінің эксперименталды дәлелдерін қамтамасыз етті (ZV1 GenBank қол жеткізу нөмірі:&lt;/p&gt;\n&lt;h4 id=\"zv1-ting-dnk-predshestvennigining-zhokhtyghy,-tizbek-polyarlyghy-zhaene-ribozimdik-belsendiligi\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#zv1-ting-dnk-predshestvennigining-zhokhtyghy,-tizbek-polyarlyghy-zhaene-ribozimdik-belsendiligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ZV1-тің ДНК-предшественнигінің жоқтығы, тізбек полярлығы және рибозимдік белсенділігі&lt;/span&gt;&lt;/a&gt;ZV1-тің ДНК-предшественнигінің жоқтығы, тізбек полярлығы және рибозимдік белсенділігі&lt;/h4&gt;\n&lt;p&gt;ZV1 РНК-сының ДНК көшірмесінің бар-жоғын тексеру үшін C105 және C110 топырақ үлгілерінен алынған кДНК және ДНК препараттары қолданылды, мұнда 184 нт құрайтын фрагментті өсіруге арналған ZV1-ге тән ZetaV_184_3 және ZetaV_184_4 праймерлерімен ПЦР-амплификация жүргізілді. Бұрын жарияланған деректерге сай, осы үлгілерде саңырауқұлақ ДНК-сы болуы тиіс екендігі ескеріліп, оң бақылау ретінде әмбебап ITS4/ITS5 саңырауқұлақ праймерлері пайдаланылды. ДНК матрица ретінде қолданылған кезде ZV1-ге тән праймерлермен ешқандай амплификация өнімі анықталмады, ал сол матрицада саңырауқұлақ праймерлерімен және кДНК препараттарында ZV1 праймерлерімен күтілген мөлшердегі ампликондар алынды (2B-сур.). Бұл нәтижелер ZV1-де ДНК эквивалентінің жоқ екенін көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кері транскрипция ПЦР (RT-PCR) — РНК-ны алдымен комплементарлы ДНК-ға айналдырып, содан кейін қажетті учаскені талдау үшін еселеп көбейтуге мүмкіндік беретін әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;РНК-ның екі полярлығының бар-жоғын бағалау және жоғары деңгейде жиналатын тізбекке (+) полярлығын беру үшін жартылай сандық RT-PCR орындалды. Әрбір полярлық тізбек ZetaV_1 немесе ZetaV_2 арнайы праймерлері арқылы жеке кері транскрипцияланды. Алынған кДНК-ның әртүрлі сұйылтулары (сұйылтылмаған, 1:2, 1:10, 1:20) ZetaV_184_3 және ZetaV_184_4 праймерлері көмегімен ПЦР арқылы амплификацияланды. Нәтижесінде РНК-ның екі полярлығы да амплификацияланды, бірақ ZetaV_2 көмегімен транскрипцияланған ZV1 РНК полярлығының тұрақты күй деңгейі едәуір жоғары екендігі байқалды (2C-сур.), сондықтан ол (+) полярлық тізбегі ретінде қабылданды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жартылай сандық RT-PCR нәтижелері ZetaV_2 праймерімен синтезделген ZV1 РНК тізбегінің басым екенін және (+) полярлыққа жататынын дәлелдеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ZV1 балға тәрізді рибозимдерінің өзін-өзі кесу белсенділігі екі полярлық тізбектің мономерлік геномдық РНК-сын in vitro транскрипциялау арқылы бағаланды. Екі жағдайда да толық ұзындықтағы транскрипт және балға тәрізді рибозим арқылы өзін-өзі кесу нәтижесінде пайда болады деп күтілген екі өнім анықталды (2D-сур.). Сонымен қатар, (+) және (-) HHRz дәл кесу орындары 5’-RACE талдауы арқылы расталды, бұл транскрипция кезінде рибозимдердің белсенділігімен түзілген 3’-фрагменттердің күтілетін 5’-ұштарына ие екенін көрсетті (2E-сур.). Жалпы алғанда, бұл деректер ZV1 балға тәрізді рибозимдерінің in vitro белсенді екенін растады және симметриялы айналмалы шеңбер механизмі арқылы репликацияланатынын меңзейді.&lt;/p&gt;\n&lt;h4 id=\"ueshinshi-tiptegi-balgha-taerizdi-ribozimderden-baskha-oezdiginen-kesiletin-ribozimderi-bar-zeta-virustardyng-rnkh-laryn-anykhtau\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#ueshinshi-tiptegi-balgha-taerizdi-ribozimderden-baskha-oezdiginen-kesiletin-ribozimderi-bar-zeta-virustardyng-rnkh-laryn-anykhtau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Үшінші типтегі балға тәрізді рибозимдерден басқа өздігінен кесілетін рибозимдері бар зета-вирустардың РНҚ-ларын анықтау&lt;/span&gt;&lt;/a&gt;Үшінші типтегі балға тәрізді рибозимдерден басқа өздігінен кесілетін рибозимдері бар зета-вирустардың РНҚ-ларын анықтау&lt;/h4&gt;\n&lt;p&gt;Балға тәрізді рибозимдер РНҚ молекуласының ұштары қай спиральда орналасқанына байланысты үш топологиялық класқа (I, II және III) бөлінеді [18]. Бұған дейін әдебиетте сипатталған зета-вирустар екі геномдық полярлықта да III типтегі HHRz болуымен сипатталады [15]. Басқа типтегі өздігінен кесілетін рибозимдерді камтитын зета-вирустардың бар-жоғын зерттеу үшін, бұрын Форжи және т.б. [10] &lt;i&gt;in silico&lt;/i&gt; әдісімен анықтаған вироид тәрізді РНҚ жиынтығы бойынша іздеу жүргізілді. Бір қызығы, бұл іздеу әр түрлі комбинациялардағы III типтегі HHRz-тен басқа өздігінен кесілетін рибозимдері бар 16 зета-вирусты (3-сурет) анықтады (1-кесте және 4-сурет). Жаңадан анықталған зета-вирустар таяқша тәрізді немесе квазитаяқша тәрізді болжанған екінші реттік құрылымды көрсетті. Бірден-бір маңызды ерекшелік едәуір тармақталған құрылысты көрсеткен ZV130856 зета-вирусы болды (3-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Өздігінен кесілетін рибозимдер — ақуыздардың қатысуынсыз өз фосфодиэфирлік байланысының үзілуін катализдей алатын функционалды РНҚ молекулалары, ал олардың кластары кеңістіктік сәулетімен ерекшеленеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл нысандар қатарына нақты метагеномдық идентификаторлары мен қамту параметрлері бар мына нұсқалар кірді: ZV28323 (SRR11829260; NODE_28323_length_742_cov_26.500747; DVRz 5.7e-05 және 5.7e-05), ZV42858 (SRR10482243; NODE_42858_length_739_cov_170.015015; DVRz 8.4e-05 және 8.6e-03), ZV12952 (SRR7428111; NODE_12952_length_715_cov_3.442943; DVRz 1.4e-03 және 1.2e-04), ZV31793 (SRR11450578; NODE_31793_length_535_cov_103.549784; DVRz 8.0e-05 және 1.5e-04), ZV39444 (SRR5864101; NODE_39444_length_535_cov_1.967532_1; DVRz 7.6e-04 және 8.0e-05), ZV36159 (SRR11614418; NODE_36159_length_751_cov_5.014749; DVRz 1.1e-04 және 9.0e-03), ZV18610 (SRR8512518; NODE_18610_length_676_cov_17.376396; DVRz 1.5e-04 және 8.1e-02), ZV52073 (SRR7286070; NODE_52073_length_484_cov_65.367397; DVRz 2.8e-02 және 1.9e-04), ZV110734 (SRR8857868; NODE_110734_length_484_cov_15.513382; DVRz 2.8e-02 және 9.4e-03), ZV130856 (SRR11565845; NODE_130856_length_499_cov_8.208920; HPRz 3.1e-08 және TWRz 1.2e-06), ZV98882 (SRR11828805; NODE_98882_length_550_cov_4.985325; HHRz II 3.2e-09 және HHRz III 2.2e-01), ZV138865 (SRR11011818; NODE_138865_length_412_cov_3.073746; HHRz II 6.7e-04 және 3.2e-07), ZV39584 (SRR5839026; NODE_39584_length_481_cov_9.259804; HHRz II 9.3e-04 және HHRz III 3.9e-08), ZV63649 (SRR12264489; NODE_63649_length_541_cov_16.369658; HHRz III 1.8e-04 және HHRz II 1.0e-03), ZV45724 (SRR6323866; NODE_45724_length_541_cov_3.835470; HHRz III 9.4e-07 және HHRz II 1.8e-02) сондай-ақ ZV5877 (SRR5864110; NODE_5877_length_1072_cov_3.852853; екі позицияда да TWRz 9.7e-12).&lt;/p&gt;\n&lt;p&gt;Бұл зета-вирустардың тоғызында екі полярлық тізбегінде де дельта-рибозимдер (DVRz) бар (4-сурет). Бір зета-вируста (ZV138865) екі полярлықта да II типтегі HHRz бар, ал төртеуі (ZV98882, ZV39584, ZV63649 және ZV45724) бір полярлықта II типтегі HHRz және екіншісінде III типтегі HHRz қамтиды (4-сурет). Сонымен қатар, бір зета-вирус (ZV130856) бір полярлық тізбегінде твистер рибозимін (TWRz) және қарама-қарсы полярлықта шашқы рибозимін (HPRz) ұстаса, басқасы (ZV5877) екі полярлықта да твистер рибозимдерін қамтиды (4-сурет). Бір қызығы, ZV130856 бір полярлығында анықталған TWRz каноникалық TWRz құрылымында жоқ қосымша спиральды-ілмекті элементке ие, ал тиісті нуклеотидтер 4-суретте қызыл түспен белгіленген. Сонымен қатар, екі TWRz қамтитын ZV5877 999 нуклеотид болатын геном ұзындығына ие, бұл оны осы уақытқа дейін хабарланған барлық басқа зета-вирустардан ұзынырақ етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Іздеу нәтижесінде дельта-рибозимдерді, II типтегі балғаларды, твистерлерді және шашқы рибозимдерді қоса алғанда, балама рибозимдері бар 16 жаңа зета-вирус табылды, ал ZV5877 штаммы 999 нуклеотидтік рекорды ұзындыққа жетті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;AlphaFold 3 көмегімен осы жаңадан анықталған зета-вирустардың екі полярлығында кодталған болжамды сақина тәрізді ақуыздардың үш реттік құрылымдарын болжау 0.5-тен төмен pTM мәндерін берді (деректер көрсетілмеген), бұл алынған құрылымдық модельдердің сенімділігі төмен екенін көрсетеді.&lt;/p&gt;\n&lt;p&gt;Тізбектердің жұптық ұқсастығы осы зерттеуде анықталған зета-вирустар арасында нуклеотидтер деңгейінде де (S2A-сурет), ORF A және ORF B әлеуетті кодтайтын ақуыздар арасында да (S2B-сурет) өте өзгермелі және жалпы алғанда төмен болды. Нуклеотидтік тізбектердің ұқсастығы 28%-дан 58%-ға дейінгі диапазонда болды, тек екі дельта-рибозимі бар және 90% тізбек ұқсастығын бөлісетін ZV52073 және ZV110734 қоспағанда. Аминқышқылдық тізбектердің ұқсастығы максималды 45%-ға жетті, алайда дельта-рибозимдері бар зета-вирустардың екі ақуызын да қамтитын алты жұптық салыстыру (ZV31793 пен ZV39444, ZV12952 пен ZV42858, сондай-ақ ZV52073 пен ZV110734) 82%-дан 95%-ға дейінгі аминқышқылдық ұқсастықты көрсетті.&lt;/p&gt;\n&lt;p&gt;Жаңадан анықталған зета-вирустар негізінен шөгінділерді, микробтық төсеніштерді, батпақты жерлерді, топырақты, тұщы су орталарын және компостты қоса алғанда, экологиялық метатранскриптомдық деректер жиынтығымен байланысты болды. Бірден-бір ерекшелік екі полярлықта да DVRz қамтитын ZV31659 емес, ZV36159 болып табылды, ол омыртқасыздар үлгілерімен, атап айтқанда &lt;i&gt;Frankliniella intonsa&lt;/i&gt; трипстерімен байланысты вирустық геномдар жиынтығынан анықталды.&lt;/p&gt;\n&lt;h4 id=\"zhanga-khasietteri-bar-viroid-taerizdi-rnkh-lardy-anykhtau-zhaene-sipattau\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#zhanga-khasietteri-bar-viroid-taerizdi-rnkh-lardy-anykhtau-zhaene-sipattau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жаңа қасиеттері бар вироид тәрізді РНҚ-ларды анықтау және сипаттау&lt;/span&gt;&lt;/a&gt;Жаңа қасиеттері бар вироид тәрізді РНҚ-ларды анықтау және сипаттау&lt;/h4&gt;\n&lt;p&gt;C30, CD95 және CD99 кітапханаларында зерттеушілер болжамды вироид тәрізді РНҚ-ларға (vdlRNAs) сәйкес келетін төрт қосымша контигті таңдады (сәйкесінше 109, 17 және 31 контиг). Бұл элементтер өзіндік қызықты кодтау қасиеттеріне байланысты назар аударды. CD95 кітапханасында ұзындығы 784 нт, жабыны 1.76 болатын NODE_786, CD99 кітапханасында ұзындығы 721 нт, жабыны 2.12 болатын NODE_1793, ал C30 кітапханасында ұзындығы 525 нт, жабыны 2.29 болатын NODE_270217 және ұзындығы 608 нт, жабыны 9.71 болатын NODE_184674 анықталды. Олар сәйкесінше 664, 685, 514 және 481 нт болатын сақиналы РНҚ-ларға сәйкес келеді. BLASTn талдауы бұл контигтер мен деректер базасындағы бұрын хабарланған РНҚ тізбектері арасында айтарлықтай ұқсастықты көрсетпеді. Барлық бұл РНҚ элементтері таяқша тәрізді немесе квазитаяқша тәрізді екінші реттік құрылымдарға оралады (5A-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BLASTn және INFERNAL — бұл биоинформатикалық құралдар: біріншісі деректер базасынан ұқсас ДНҚ/РНҚ тізбектерін іздесе, екіншісі арнайы стохастикалық грамматикалар көмегімен РНҚ құрылымдық мотивтерін анықтайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;INFERNAL талдауы осы болжамды вироид тәрізді РНҚ-лардың әрбір полярлық тізбегінен III типті HHRz рибозимін анықтады (5B-сурет). CD95 және CD99 кітапханаларындағы vdlRNA-ларда екі рибозимнің бірі консервативті каталитикалық орталығында мутацияға ұшыраған, мұнда канондік CUGA учаскесі CCGA-мен алмастырылған (5B-сурет). Бұл мутация осы зерттеуде анықталған кейбір зета-вирустарда да байқалған болатын. Төрт вироид тәрізді РНҚ өзара 47.95% пен 56.97% аралығындағы нуклеотидтік тізбек ұқсастығын бөліседі және ұқсас құрылымдық және кодтаушы ерекшеліктерді көрсетеді. Әрбір полярлық тізбекте әрбір РНҚ геномдық РНҚ ұзындығынан асатын жалғыз ашық оқу рамкасын (ORF) қамтиды, бұл ретте стоп-кодон мультимерлік РНҚ-ның екінші мономеріне сәйкес келеді (5C-сурет). Бұл аталмыш vdlRNA геномдарының мөлшері үшке еселі еместігіне байланысты (664, 685, 514 және 481 нт), бұл зета-вирустардан ерекшеленеді. Бұл сценарий трансляция матрицасы ретінде репликация кезінде түзілетін циркулярлық РНҚ-лардың немесе мультимерлік сызықтық РНҚ-лардың қатысуын болжайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Авторлар ұзындығы 481 мен 685 нт аралығындағы, III типті HHRz рибозимдері мен геном ұзындығынан асатын бірегей ORF-тері бар төрт жаңа вироид тәрізді РНҚ-ны анықтап, оларды бетавироид тәрізді РНҚ-лар (βvdl786, βvdl1793, βvdl270217 және βvdl184674) деп атауды ұсынды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Геномдық РНҚ-дан ұзынырақ ORF-тердің бар екенін ескере отырып, оларды тандемді ақуыз қайталануларын тудыратын ORF-тері бар зета-вирустардан ажырату үшін бетавироид тәрізді РНҚ-лар (betaviroid-like RNAs) атауы ұсынылды. CD95, CD99 және C30 топырақ кітапханаларынан табылған жаңа vdlRNA-лар бетвироид тәрізді РНҚ 786 (βvdl786), бетвироид тәрізді РНҚ 1793 (βvdl1793), бетвироид тәрізді РНҚ 270217 (βvdl270217) және бетвироид тәрізді РНҚ 184674 (βvdl184674) деп аталды. BLASTp іздеулері бұл РНҚ-лар кодтайтын болжамды ақуыздар мен бұрын хабарланған ақуыздар арасында елеулі ұқсастықты көрсетпеді. Жұптық салыстыру бетвироид тәрізді РНҚ-лар кодтайтын сегіз ақуыздың арасында аминқышқылдық тізбектің 9.77% пен 33.33% аралығындағы төмен ұқсастығын көрсетті. AlphaFold 3 көмегімен үшінші реттік құрылымдарды болжау төмен pTM мәндерін берді (0.16–0.23; S3-сурет), бұл алынған модельдердің сенімділігі төмен екенін білдіреді. Тізбектелген ридтерді βvdl786, βvdl1793, βvdl270217 және βvdl184674 геномдық РНҚ-ларына карталау арқылы ешқандай полиморфты позициялар анықталған жоқ, бұл геномдық тізбектердің қатаң сақталғанын растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AlphaFold 3 көмегімен ақуыздардың үшінші реттік құрылымдарын болжау өте төмен pTM бағаларын (0.16–0.23) көрсетті, бұл гипотетикалық ақуыздардың нақты үш өлшемді құрылымына қатысты жоғары белгісіздік дәрежесін көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анықталған төрт бетавироид тәрізді РНҚ ішінен βvdl786 және βvdl1793 қосымша зерттеу үшін таңдалды. Таңдалған РНҚ-лардың бар екенін, ДНҚ көшірмесінің жоқтығын және рибозимнің өзін-өзі ыдырату белсенділігін растау үшін зета-вирус үшін қолданылған сондай эксперименттік тәсіл қолданылды. Кері транскрипция және көршілес пен комплементарлы арнайы праймерлерді қолдана отырып ПЦР (S1-кесте) CD95 және CD99 топырақ үлгілерінен сәйкесінше βvdl786 және βvdl1793 үшін күтілетін өлшемдегі ампликондарды генерациялады (6A-сурет). Осы ампликондарды клондау және Сэнгер әдісімен секвенирлеу RNA-seq талдау нәтижелерін растады (GenBank нөмірлері: PZ584208 және PZ584209). Анықталған РНҚ тізбектерінің ДНҚ түрінде де бар-жоғын тексеру үшін CD95 және CD99 топырақ үлгілерінің ДНҚ препараттары ПЦР арқылы тексерілді (S1-кесте). Оң бақылау ретінде сол топырақ үлгілерінен алынған кДНК және саңырауқұлақтың әмбебап праймерлері ITS4/ITS5 пайдаланылды (6B-сурет). ДНҚ препараттарынан βvdl786 және βvdl1793 ПЦР өнімдері алынған жоқ, бұл зерттелген топырақтарда ДНҚ эквиваленттерінің жоқтығын растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ПЦР және ДНҚ үлгілерімен жүргізілген тәжірибелер CD95 және CD99 топырақтарында бетавироид тәрізді РНҚ-лар тек РНҚ түрінде ғана болатынын, олардың ДНҚ интермедиаты жоқ екенін растады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Екі полярлық тізбектің болуын бағалау және олардың салыстырмалы мөлшеріне қарай (+) және (-) тізбектерін ажырату үшін βvdl786 және βvdl1793 үшін арнайы праймерлерді қолдана отырып жартылай сандық ОТ-ПЦР орындалды (S1-кесте). (+) және (-) полярлықтарға арналған праймерлер бөлек қолданылып, алынған кДНК-лардың әртүрлі сұйылтулары (сұйылтылмаған, 1:2, 1:10, 1:20, 1:200) ПЦР көмегімен амплификацияланды. Екі бетавироид тәрізді РНҚ үшін де екі полярлық тізбек анықталды. βvdl786 және βvdl1793 бір РНҚ полярлығы айтарлықтай жоғары деңгейде жиналды. Осы дәлелдерге сүйене отырып, бұл РНҚ полярлығы (+) болып саналды (6C-сурет).&lt;/p&gt;\n&lt;p&gt;Hammerhead рибозимдерінің (HHRz) өздігінен кесілу белсенділігі βvdl786 толық ұзындықтағы кДНҚ мономерін қамтитын плазмидалар көмегімен in vitro транскрипция арқылы бағаланды. Екі полярлық тізбек үшін де толық ұзындықтағы транскрипт пен күтілетін екі кесілу өніміне сәйкес келетін үш жолақ анықталды (6D-сурет), бұл HHRz-тің in vitro белсенді екенін көрсетеді. Кесілу орындары 5’ RACE талдауымен расталды, ол рибозим белсенділігі нәтижесінде түзілген 3’-фрагменттердің күтілетін 5’-ұштарына ие екенін көрсетті (6E-сурет). Бұл деректер бетавироидқа ұқсас РНҚ репликациясында симметриялы айналмалы сақина механизмінің қатысатынын растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;In vitro тәжірибелері HHRz рибозимдерінің белсенділігін және βvdl786 РНҚ үшін симметриялы репликация механизмінің бар екенін дәлелдеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"khoghamdykh-derekter-bazalarynda-on-bir-zhanga-betaviroidkha-ukhsas-rnkh-ny-anykhtau\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#khoghamdykh-derekter-bazalarynda-on-bir-zhanga-betaviroidkha-ukhsas-rnkh-ny-anykhtau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қоғамдық деректер базаларында он бір жаңа бетавироидқа ұқсас РНҚ-ны анықтау&lt;/span&gt;&lt;/a&gt;Қоғамдық деректер базаларында он бір жаңа бетавироидқа ұқсас РНҚ-ны анықтау&lt;/h4&gt;\n&lt;p&gt;Бұл РНҚ-лардың таралуын зерттеу үшін ашық деректер базаларына скрининг жүргізілді. Ұзындығы 286-дан 685 нт-ге дейінгі және бетавироидтарға ұқсас құрылымдық әрі кодтаушы белгілері бар 11 қосымша vdlРНҚ анықталды (2-кесте). Барлық тізбектер табиғи ортадан: батпақты жерлерден, тоқыраған сулардан, өсімдік қалдықтары мен орман топырақтарынан алынған. Екінші мономердегі стоп-кодонның орналасуы әртүрлі: кейбірінде ол мономердің басында, басқаларында 260 нт қашықтықта орналасқан (2-кесте).&lt;/p&gt;\n&lt;p&gt;BLASTn талдауы жаңа циклдік vdlРНҚ-лардың бұрын белгілі тізбектермен айтарлықтай ұқсастығын таппады. Анықталған РНҚ-лар арасындағы нуклеотидтік ұқсастық 33,33%-дан 77,09%-ға дейін (SN4A-сурет), ал болжамды ақуыздардың аминқышқылдық ұқсастығы 59,55%-ға дейін жетті (SN4B-сурет). RNAfold болжамына сәйкес, барлық жаңа РНҚ-лар таяқша тәрізді екінші реттік құрылымдарды түзеді (7-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BLASTn — нуклеотидтік тізбектерді деректер базасындағы басқа тізбектермен салыстыру үшін қолданылатын алгоритм.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;INFERNAL талдауы барлық vdlРНҚ-ларда амбисенс HHRz III типті мотивтерін анықтады (8-сурет). Олардың үшеуі (βvdl34831, βvdl37279 және βvdl725174) βvdl786 және βvdl1793 HHRz-теріндегідей каталитикалық ядрода бірдей мутацияға (CUGA орнына CCGA) ие. Кейбір жағдайларда ORF старт және стоп-кодондары рибозим мотивтерімен қабаттасады. Үш vdlРНҚ (βvdl34283, βvdl40399, βvdl590361) шамамен 42-55 нт ұзындықтағы ұзын I сабақшасымен ерекшеленетін HHRz-ке ие. AlphaFold 3 деректері бойынша, болжамды ақуыздар төмен дәлдіктегі (pTM &amp;lt; 0,5) бүктелуді көрсетеді.&lt;/p&gt;\n&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;h4 id=\"zhalpy-sipattamalar-zhaene-zhanga-viroid-taerizdi-rnkh-lardyng-ashyluy\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#zhalpy-sipattamalar-zhaene-zhanga-viroid-taerizdi-rnkh-lardyng-ashyluy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жалпы сипаттамалар және жаңа вироид тәрізді РНҚ-лардың ашылуы&lt;/span&gt;&lt;/a&gt;Жалпы сипаттамалар және жаңа вироид тәрізді РНҚ-лардың ашылуы&lt;/h4&gt;\n&lt;p&gt;Бұл жұмыста топырақ үлгілерінен анықталған дзета-вирус алғаш рет молекулалық тұрғыдан сипатталып, оның бар екендігі экспериментальды түрде дәлелденді. Зерттеу оң (+) және теріс (-) полярлықтағы сақиналы РНҚ нысандарының бар екенін, ДНҚ-ның жоқтығын, сондай-ақ екі полярлық тізбектегі балға басты рибозимдердің (hammerhead ribozymes) өздігінен кесу белсенділігін растады, бұл симметриялық айналмалы сақина механизмі арқылы репликация болатынын көрсетеді. Сондай-ақ авторлар құрамында балға басты рибозимдері мен толық ұзындықтағы сақиналы геномнан сәл ұзынырақ оқу рамкалары (ORF) бар vdlРНҚ-лардың жаңа тобы — бетавироид тәрізді РНҚ-ларды анықтап, сипаттады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу барысында топырақ дзета-вирустарының тіршілік ететіні экспериментальды түрде дәлелденді және айналмалы сақина механизмі арқылы көбейетін бетавироид тәрізді РНҚ-лардың жаңа тобы ашылды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;«Бетавироид тәрізді РНҚ-лар» термині бұл РНҚ элементтерінің вироидқа ұқсас табиғатын көрсету және оларды классикалық вирустардан ажырату үшін қабылданды, өйткені бұл РНҚ-лардан РНҚ-тәуелді РНҚ-полимераза анықталмаған. Олардың екеуі үшін сақиналылығы, ДНҚ формасының жоқтығы және балға басты рибозимдердің каталитикалық белсенділігі де расталды. Дзета-вирустармен ортақ белгілеріне қарамастан, бетавироид тәрізді РНҚ-лар ерекше геномдық архитектураға ие. Атап айтқанда, олардың геномының ұзындығы ешқашан үшке еселік емес нуклеотидтер санымен сипатталады. Бұл ерекшелік мономерлі (сызықтық немесе сақиналы) геном толық трансляцияланғаннан кейін орын алатын рамканың ығысуымен (frameshift) сәйкес келеді, бұл ақырында стоп-кодонның пайда болуына әкеледі. Бұл жағдай геномындағы нуклеотидтер саны үшке еселік болатын және әлеуетті шексіз ақуыздарды трансляциялауға мүмкіндік беретін дзета-вирустардан күрт ерекшеленеді.&lt;/p&gt;\n&lt;h4 id=\"taraluy,-aertuerliligi-zhaene-ykhtimal-translyaciya-mehanizmderi\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#taraluy,-aertuerliligi-zhaene-ykhtimal-translyaciya-mehanizmderi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Таралуы, әртүрлілігі және ықтимал трансляция механизмдері&lt;/span&gt;&lt;/a&gt;Таралуы, әртүрлілігі және ықтимал трансляция механизмдері&lt;/h4&gt;\n&lt;p&gt;Дзета-вирустар да, бетавироид тәрізді РНҚ-лар да экологиялық үлгілерден анықталды. Сондықтан олардың иесі болып табылатын организмдер әзірге белгісіз күйінде қалып отыр. Дегенмен, жалпыға қолжетімді метатранскриптомдық деректер базасынан он екі қосымша әлеуетті бетавироид тәрізді РНҚ-ның табылуы vdlРНҚ элементтерінің бұл класының таралғанын тағы da растайды. Сонымен қатар, III типті HHRz-тен өзгеше рибозимдері бар дзета-вирустардың (соның ішінде DVRz, TWRz, HPrP және II типті HHRz) анықталуы осы РНҚ элементтерімен байланысты рибозимдердің белгілі әртүрлілігін кеңейте түседі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Айналмалы сақина механизмі (rolling-circle replication) — сақиналы нуклеин қышқылдарын үздіксіз көшіру тәсілі, мұнда ферменттер шеңбер бойымен қозғалып, қайталанатын бөліктерден тұратын ұзын бастапқы тізбектерді түзеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл vdlРНҚ-лардың дзета-вирустар мен бетавироид тәрізді РНҚ-ларда кодтайтын ORF-терінің ерекше қасиеттері олардың трансляция стратегиялары туралы маңызды сұрақтар туындатады. Ықтимал нұсқалардың бірі — айналмалы сақина трансляциясы (rolling-circle translation) деп аталатын қайталанатын трансляция циклі арқылы тікелей сақиналы РНҚ-дан жүзеге асуы. Мұндай механизм in vitro синтезделген сақиналы РНҚ құрамында бактериялық [19] және эукариотикалық жасушаларда [20] көрсетілген. Айналмалы сақина трансляциясы механизмі сондай-ақ адамның сақиналы-EGFR сияқты эндогендік сақиналы РНҚ-ларында да болатыны дәлелденген, оның айналмалы сақина және -1 рибосомалық рамканың ығысуы арқылы трансляциялануы полимерлі ақуыз кешенін түзген [21]. Сақиналы РНҚ-лар үшін трансляцияның басталуының ішкі рибосомалық кіру сайты (IRES), N⁶-метиладенозин (m⁶A) элементтері, A-to-I РНҚ өңдеу, экзон түйісу кешені (EJC) арқылы басталу, сондай-ақ рибосомалық шунтинг және RAN трансляциясы сияқты әртүрлі стратегиялар ұсынылған [22].&lt;/p&gt;\n&lt;p&gt;Дегенмен, қатаң сақталған канондық трансляция басталу сигналдарының болмауы сақиналы матрицалардан трансляцияны жоққа шығармайды, өйткені сақиналы РНҚ-лар IRES, 5'-кэп немесе поли(A) құйрығы болмаған жағдайда да ақуыз синтезін қолдай алатыны көрсетілген [20]. Балама ретінде трансляция vdlРНҚ репликациясының аралық өнімдеріне сәйкес келетін сызықтық мультимерлі РНҚ-лардан жүруі мүмкін. Сақиналы РНҚ матрицасында трансляция рибосомаларды тартуда қиындықтар тудырғанымен, сызықтық матрица моделінде рибозимдер кейбір вирустар үшін жақында ұсынылғандай, трансляцияны бастауда рөл атқаруы мүмкін [23].&lt;/p&gt;\n&lt;h4 id=\"zeta-virustar-men-betaviroid-taerizdi-rnkh-lardyng-kodtau-aeleueti-zhaene-genomnyng-biregej-ujymdasuy\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#zeta-virustar-men-betaviroid-taerizdi-rnkh-lardyng-kodtau-aeleueti-zhaene-genomnyng-biregej-ujymdasuy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зета-вирустар мен бетавироид тәрізді РНҚ-лардың кодтау әлеуеті және геномның бірегей ұйымдасуы&lt;/span&gt;&lt;/a&gt;Зета-вирустар мен бетавироид тәрізді РНҚ-лардың кодтау әлеуеті және геномның бірегей ұйымдасуы&lt;/h4&gt;\n&lt;p&gt;Зета-вирустар мен бетавироид тәрізді РНҚ-ларда ашық оқу рамкаларының анықталуы белгілі вироид тәрізді агенттердің алуантүрлілігін едәуір кеңейтеді. Бұл агенттер гепатит Delta вирусы мен Kolmioviridae тұқымдасына жататын агенттерге, амбивирустар мен обелискілерге ұқсас, ақуызды кодтау қабілетін вироидтардың негізгі белгілерімен, соның ішінде тұйықталған сақиналы геномдармен, өздігінен кесілетін рибозимдермен және айналмалы сақина механизмі арқылы репликациямен біріктіреді. Трансляция жасау қабілеті бұрын күріштің сары дақтылығы вирусымен байланысты вирусоид үшін де көрсетілген болатын, ол вироидтар мен сателлиттік РНК-лар арасында бірегей еді.&lt;/p&gt;\n&lt;p&gt;Қызығы, зета-вирустар мен бетавироид тәрізді РНҚ-лар да осындай амбисенстік кодтау қабілетіне ие, алайда кодтаушы тізбектердің орналасуы айтарлықтай ерекшеленеді. Амбивирустарда екі консервативті ашық оқу рамкасы қарама-қарсы тізбектердің бөлек, қиылыспайтын аймақтарында орналасқан. Керісінше, зета-вирустар мен бетавироид тәрізді РНҚ-лардың рамкалары бүкіл геномды екі полярлықта да қамтиды, бұл репликацияланатын РНК-да немесе вируста бұрын сипатталмаған геномның шектен тыс қабаттасу түрін білдіреді. Сонымен қатар, бұл ұйымдасу генетикалық ақпараттың шектен тыс сығылуын білдіреді, мұнда бірдей нуклеотидтер тізбегі бір уақытта екі тізбекте де ақуызды кодтауға үлес қосады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Геномды шектен тыс сығу — бұл бірдей нуклеотидтер тізбегі РНҚ-ның екі тізбегінде де бір мезгілде әртүрлі ақуыздарды кодтап, құрылымдық функцияларды атқаратын бірегей жағдай.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;РНҚ вирустарында бір-бірімен қабаттасатын кодтаушы тізбектер мутацияларға сезімталдықты арттырады, өйткені бір нуклеотидтің өзгеруі бірнеше аймаққа әсер етуі мүмкін. Бұл геномдық ұйымдасу жоғары мутация жиілігіне қарсы тұру үшін үлкен мутациялық тұрақтылықпен байланысты. Осыған байланысты, зета-вирустар мен бетавироид тәрізді РНҚ-лардың ұйымдасуы осы репликондар үшін аса жоғары мутациялық тұрақтылық қажет екенін көрсетеді. Бұл зерттеуде зета-вирустар мен бетавироид тәрізді РНҚ-лар үшін байқалған өте төмен генетикалық өзгергіштік мұны растайды. Зета-вирустар мен бетавироид тәрізді РНҚ-лардың таңғажайып геномдық құрылымы олардың шығу тегі мен эволюциялық стратегиялары туралы қызықты сұрақтар туындатады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зета-вирустар мен бетавироид тәрізді РНҚ-лар минималды генетикалық өзгергіштікпен бірге бұрын-соңды görülмеген геномның сығылуы мен амбисенстік ашық рамкалардың қабаттасуын көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жалпы алғанда, алынған нәтижелер ақуыз кодтайтын вироид тәрізді РНҚ-лардың белгілі алуантүрлілігін кеңейтеді және зета-вирустар мен бетавироид тәрізді РНҚ-лардың генетикалық ақпаратты таңғажайып түрде сығуын атап көрсетіп, олардың эволюциясы мен биологиялық ролін түсіну үшін жаңа перспективалар ашады.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"rnkh-zhaene-dnkh-ekstrakciyasy-zhaene-bioinformatikalykh-taldau\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#rnkh-zhaene-dnkh-ekstrakciyasy-zhaene-bioinformatikalykh-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;РНҚ және ДНҚ экстракциясы және биоинформатикалық талдау&lt;/span&gt;&lt;/a&gt;РНҚ және ДНҚ экстракциясы және биоинформатикалық талдау&lt;/h4&gt;\n&lt;p&gt;Зерттеуде 2019 жылы Тосканадағы (Италия) каштан (Castanea sativa) плантациясынан алынған топырақ үлгілері пайдаланылды. Әрбір үлгі кемінде екі метр қашықтықта орналасқан 200 см³ көлемдегі бес топырақ кернінің қоспасынан тұрды. Жалпы РНҚ RNeasy PowerSoil Total RNA (QIAGEN) жинағы арқылы алты үлгіден бөліп алынды. Дайындалған кітапханалар (C30, CD50, CD95, CD99, C105 және C110) Novogene компаниясында Illumina NovaSeq 6000 (2x150 п.н.) платформасында Illumina TruSeq Stranded Total RNA хаттамасы және RiboZero Plant көмегімен рибосомалық РНҚ-ны жою арқылы секвенирленді. ДНҚ FastDNA™ SPIN Kit for Soil (MP Biomedicals) көмегімен бөліп алынды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RNA-seq технологиясы үлгідегі барлық транскрипттерді анықтауға мүмкіндік береді, бұл жаңа вирустық тізбектерді табу үшін маңызды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бастапқы деректер FASTX-Toolkit арқылы сапа бақылауынан өтті және cutadapt көмегімен өңделді: адаптерлер, сапасы төмен (Phred Q&amp;lt;20) және қысқа (L&amp;lt;50 п.н.) оқылымдар, сондай-ақ анықталмаған нуклеотидтер алынып тасталды. Жинақтау (assembly) SPAdes (v3.13.0) бағдарламасында multi k-mer стратегиясы (51-ден 121 п.н.-ге дейін, 10 қадаммен) арқылы жүзеге асырылды. Контигтердің функционалдық аннотациясы DIAMOND (v2.1.7) көмегімен NCBI деректер базасына (2023 жылғы 4 тамыздағы жағдай бойынша) қарсы BLASTx іздеуі арқылы орындалды.&lt;/p&gt;\n&lt;p&gt;Рибозимдерді анықтау үшін INFERNAL (v1.1.2) алгоритмі және RFAM (v14) базасындағы ковариациялық модельдер қолданылды. Жұп рибозимдері бар, сақиналы топологиясы бар және BLAST аннотациясы жоқ тізбектер таңдап алынды. Тізбектердің өзгергіштігін бағалау үшін Geneious Prime (v2026.0) бағдарламасында референстік контигтерге карталау жүргізілді. Варианттарды іздеу (variant calling) кемінде 50 оқылым жабыны, 0,3% минималды вариант жиілігі, 1 × 10⁻⁴ вариант p-мәні және 0,01 тізбек ығысуы p-мәні шарттары негізінде орындалды.&lt;/p&gt;\n&lt;p&gt;Нуклеотидтік және аминқышқылдық тізбектердің ұқсастығы Clustal Omega (EMBL-EBI) арқылы талданды, жылу карталары (heatmaps) RStudio (ggplot2) көмегімен жасалды. 2000 нт-ден қысқа сақиналы мономерлер компьютерлік жолмен димерлендірілді және ORF талдауы жүргізілді. РНҚ екіншілік құрылымдары RNAfold (ViennaRNA 2.6.3) арқылы болжанды, визуализация Jupyter Notebook (Python 3) ортасында жүзеге асырылды. Ақуыз құрылымдары AlphaFold 3 арқылы болжанды; «шексіз» ORF үшін бастапқы кодон ең жоғары pTM (predicted template modelling) ұпайы негізінде таңдалды.&lt;/p&gt;\n&lt;h4 id=\"rt-pcr-zhaene-klondau\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#rt-pcr-zhaene-klondau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RT-PCR және клондау&lt;/span&gt;&lt;/a&gt;RT-PCR және клондау&lt;/h4&gt;\n&lt;p&gt;Барлық нуклеин қышқылдары кездейсоқ гексамерлер мен Superscript IV кері транскриптазасын қолдану арқылы кері транскрипцияланды (RT). Алынған кДНК реакциясының екі микролитрі 0.25 бірлік GoTaq ДНК полимеразасымен бірге PCR амплификациясы үшін матрица ретінде пайдаланылды. Жалпы көлемі 25 мкл болатын қоспа құрамында 1X Green GoTaq реакциялық буфері, 0.2 mM dNTP және 0.2 mkM әрбір арнайы праймер болды (S1 кесте). Термоциклдеу шарттары келесідей жүргізілді: 94 °C-та 3 минут бастапқы денатурация, одан кейін 94 °C-та 30 секундтан 32 цикл, 57 °C-та 30 секунд, 72 °C-та секундтар (бастапқы деректе уақыты түсіріп қалдырылған) және 72 °C-та 5 минут бойы соңғы ұзарту қадамы. Қажетті мөлшердегі өнімдер агароза гельінен кесіп алынып, тазартылды, pGEM-T Easy векторына клондалды және Сэнгер әдісімен секвенирленді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сэнгер әдісімен секвенирлеу — ДНК молекуласындағы нуклеотидтердің нақты тізбегін анықтап, генетикалық құрылымды дәл тексеруге мүмкіндік беретін классикалық әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;vdlRNA-лардың әрбір полярлық тізбегінің мөлшерлік талдауы тізбекке тән кері транскрипция және одан кейінгі жартылай мөлшерлік PCR көмегімен бағаланды. Әрбір тізбек үшін кері транскрипция арнайы праймердің көмегімен орындалды, содан кейін кДНК-ның қатарлы сұйылтулары (сұйылтылмаған, 1:2, 1:10, 1:20, 1:200) S1 кестесінде көрсетілген праймерлерді қолдана отырып, жоғарыда сипатталғандай PCR үшін матрица ретінде қызмет етті.&lt;/p&gt;\n&lt;h4 id=\"rnkh-nyng-oezin-oezi-kesuin-taldau\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#rnkh-nyng-oezin-oezi-kesuin-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;РНҚ-ның өзін-өзі кесуін талдау&lt;/span&gt;&lt;/a&gt;РНҚ-ның өзін-өзі кесуін талдау&lt;/h4&gt;\n&lt;p&gt;vdlRNA-лардың толық ұзындықтағы кДНК тізбегін қамтитын pGEM-T Easy плазмидаларының in vitro транскрипциясы арқылы екі полярлық тізбектің мономерлі транскрипттері алынды. Рекомбинантты плазмидалар тиісті рестрикциялық ферментпен сызықтық күйге келтіріліп, фенол-хлороформдық экстракция және этанолмен тұндыру арқылы тазартылды, содан кейін T7 немесе SP6 РНК полимеразалары арқылы in vitro транскрипциясы үшін матрица ретінде пайдаланылды. Транскрипция өнімдері бромид этидиімен боялып, УК сәулесі астында визуализацияланған денатурациялаушы 5% ПААГ (8 М мочевина, 1 X TBE: 89 mM трис, 89 mM бор қышқылы, 2.5 mM EDTA, pH 8.3) көмегімен талланды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Денатурациялаушы ПААГ электрофорезі РНК молекулаларын екінші реттік құрылымдарды жою арқылы ұзындығы бойынша дәл бөліп, өзін-өзі кесу өнімдерін анықтауға көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;In vitro транскрипция кезінде түзілген 3' өзін-өзі кесу өнімдері акриламид гельдерінен бөлініп алынды, ал олардың 5' ұшының тізбегі 5'-RACE (кДНК ұштарын жылдам амплификациялау) әдісі арқылы анықталды. Қысқайтқанда, кесілген 3' РНҚ фрагменттері гельден бөлініп, фенол-хлороформдық экстракция және этанолмен тұндыру арқылы тазартылды, содан кейін арнайы праймерлермен кері транскрипцияланды (S1 кесте). Терминалды дезоксинуклеотидилтрансфераза көмегімен poly(G) құйрығы қосылғаннан кейін, осы кДНК-лар GoTaq ДНК полимеразасы, polyC RACE праймері және кДНК синтезінде қолданылған праймерге бағытталған (nested) арнайы праймер көмегімен PCR арқылы амплификацияланды (S1 кесте). PCR өнімдері гельде тазартылып, клондалды және Сэнгер әдісімен секвенирленді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-f1.jpg\" alt=\"1-сур. Зета-вирустардың құрылымдық ерекшеліктері. (A) ZV1, ZV2 және ZV3 РНК-ларының минималды бос энергиясының екінші ре\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сур. Зета-вирустардың құрылымдық ерекшеліктері. (A) ZV1, ZV2 және ZV3 РНК-ларының минималды бос энергиясының екінші реттік құрылымының дөңгелек диаграммасы. РНК геномы ішіндегі болжанған комплементарлы жұптасу өзара әрекеттесулері доғалармен көрсетілген, олардың түстері (ақтан қою қызылға дейін) жергілікті бос энергия үлесі (ккал/моль) ретінде көрсетілген жұптың тұрақтылығын көрсетеді. (+) және (-) балға тәрізді рибозимдердің (HHRz) салыстырмалы орналасуы сәйкесінше күлгін және қызғылт сары түстермен белгіленген. ORF A ((+) тізбегі) және ORF B ((-) тізбегі) сәйкесінше көк және жасыл түстермен көрсетілген, ал үшбұрыштар сәйкес бастапқы кодондарды белгілейді. (B) ZV1, ZV2 және ZV3 (+) (сол жақта) және (-) (оң жақта) HHRz екінші реттік құрылымы. Кесу орны көрсеткімен белгіленген және каталитикалық ядро ішіндегі консервативті нуклеотидтер қара фонмен ерекшеленген.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-f2.jpg\" alt=\"2-сур. Зета-вирус 1-дің (ZV1) молекулалық сипаттамасы. (A) C105 және C110 топырақ үлгілерінен қарама-қарсы полярлықтағы \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сур. Зета-вирус 1-дің (ZV1) молекулалық сипаттамасы. (A) C105 және C110 топырақ үлгілерінен қарама-қарсы полярлықтағы көрші праймерлерді қолдана отырып, геномдық толық ұзындықтағы ZV1-ді RT-PCR амплификациясы. (B) ДНҚ баламасының жоқтығын растау үшін арнайы праймерлерді (ZetaV_184_3 және ZetaV_184_4) және матрица ретінде кДНҚ немесе ДНҚ препараттарын қолдана отырып ZV1 фрагментінің (184 нт) ПЦР амплификациясы (сол жақта). Саңырауқұлақтардың әмбебап праймерлерін ITS4/ITS5 қолдана отырып ДНҚ препараттарын ПЦР амплификациясы оң бақылау ретінде пайдаланылды (оң жақта). (C) Шартты түрде (+) полярлық деп аталатын ең көп таралған ZV1 полярлық тізбегін анықтау үшін тізбекке тән RT және одан кейінгі жартылай сандық ПЦР. н.д., сұйылтылмаған. M, Gene ruler DNA ladder mix ДНҚ ұзындығының маркері (Thermo Scientific). (D) In vitro транскрипция арқылы түзілген ДНҚ матрицаларының және мономерлі РНК өнімдерінің схемалық көрінісі. SpeI көмегімен линеаризацияланған және T7 РНК-полимеразасымен транскрипцияланған мономерлі ZV1 тізбегін қамтитын плазмида оң полярлықтағы мономерлі транскрипттерді (Толық ұзындықтағы, FL) түзеді; HHRz өзін-өзі кесу белсенділігінен туындайтын күтілетін 5' және 3' фрагменттердің (5'F және 3'F) өлшемдері көрсетілген (сол жақ). NcoI көмегімен линеаризациялау және сол плазмиданы SP6 РНК-полимеразасымен транскрипциялау теріс полярлықтағы мономерлі транскрипттерді (FL) және олардың сәйкес өзін-өзі кесетін 5'F және 3'F фрагменттерін шығарады (оң жақта). Жасыл түспен плазмида тізбектері; сары түспен полимераза промоторы; көк түспен бағытын көрсететін көрсеткілері бар ZV1 тізбегі белгіленген; көрсеткі ұштары мен қайшылар өзін-өзі кесу орындарының орнын белгілейді. РНК фрагменттерінің күтілетін өлшемдері сол жақта көрсетілген. Ортаңғы панельде оң және теріс ZV1 мономерлерінің in vitro транскрипция реакциясының PAGE талдауы көрсетілген. M, РНК маркері (Low range ssRNA ladder, New England Biolabs), өлшемдері (нт) сол жақта көрсетілген. (E) HHRz арқылы жүретін белсенділік нәтижесінде пайда болған 3'F фрагментінің 5' RACE әдісімен өзін-өзі кесу орнын (қызыл көрсеткі) анықтау. (+) және (-) 3'F өзін-өзі кесу фрагменттерінің 5' RACE өнімдерінің секвенирлеу электроферограммалары сәйкесінше сол жақта, жоғарғы және төменгі панельдерде көрсетілген. (+) және (-) HHRz өзін-өзі кесу орындары (қызыл көрсеткі) (оң жақта) өзін-өзі кесетін 3'F фрагменттерінің 5'RACE әдісімен анықталды. Рибозимдердің екінші реттік құрылымдары оң жақта көрсетілген.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-f3.jpg\" alt=\"3-сур. Метатранскриптомдық деректер жиынтығында анықталған III типті HHRz-ден өзгеше рибозимдері бар зета-вирустардың ми\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сур. Метатранскриптомдық деректер жиынтығында анықталған III типті HHRz-ден өзгеше рибозимдері бар зета-вирустардың минималды бос энергиясының екінші реттік құрылымының дөңгелек диаграммасы. (+) және (-) рибозимдердің салыстырмалы орналасуы сәйкесінше күлгін және қызғылт сары түстермен белгіленген. (+) және (-) тізбектерінде кодталған ORF-тер сәйкесінше көк және жасыл түстермен көрсетілген, ал үшбұрыштар сәйкес бастапқы кодондарды белгілейді (мәліметтер үшін 1-сур. анықтамасын қараңыз).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-f4.jpg\" alt=\"4-сур. Метатранскриптомдық деректер жиынтығынан табылған және жұптасқан III типті HHRz қамтымайтын зета-вирустардағы (+)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сур. Метатранскриптомдық деректер жиынтығынан табылған және жұптасқан III типті HHRz қамтымайтын зета-вирустардағы (+) және (-) рибозимдердің екінші реттік құрылымы. DVRz: дельта-рибозим; HHRz II: II типті балға тәрізді рибозимдер; HHRz III: III типті балға тәрізді рибозимдер; HPRz: шашқыш рибозим; TWRz: твистер рибозимы. Кесу орны қызыл көрсеткімен белгіленген және каталитикалық ядро ішіндегі консервативті нуклеотидтер қара фонмен ерекшеленген. ZV130856 бір полярлығындағы твистер рибозимінде анықталған қосымша спираль-ілмек элементін түзуші нуклеотидтер қызыл түспен белгіленген.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-f5.jpg\" alt=\"5-сур. Бетавироид тәрізді РНК-лардың құрылымдық ерекшеліктері (βvdl786, βvdl1793, βvdl270217 және βvdl184674). (A) Миним\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сур. Бетавироид тәрізді РНК-лардың құрылымдық ерекшеліктері (βvdl786, βvdl1793, βvdl270217 және βvdl184674). (A) Минималды бос энергиясы бар бетавироид тәрізді РНК екінші реттік құрылымдарының дөңгелек диаграммасы (толығырақ 1-суреттің анықтамасынан қараңыз). (+) және (-) полярлықпен кодталған ORF A және B (сәйкесінше көк және жасыл түсті) геномдық РНК-дан ұзынырақ, мұнда басталу және тоқтау кодондары сәйкесінше үшбұрышпен және шаршымен (қызыл) белгіленген. (+) және (-) полярлық тізбектеріндегі балға тәрізді рибозимнің салыстырмалы орналасуы сәйкесінше күлгін және қызғылт сары түстермен көрсетілген. (B) (+) (сол жақта) және (-) (оң жақта) полярлық тізбектеріндегі балға тәрізді рибозимдердің болжанған екінші реттік құрылымы. (C) Бастан құйрыққа дейінгі мультимерлі бетавироид тәрізді РНК фрагментінің схемалық көрінісі.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-f6.jpg\" alt=\"6-сур. βvdl786 және βvdl1793 молекулалық сипаттамасы. (A) Қарама-қарсы полярлықтағы іргелес арнайы праймерлерді қолдану \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сур. βvdl786 және βvdl1793 молекулалық сипаттамасы. (A) Қарама-қарсы полярлықтағы іргелес арнайы праймерлерді қолдану арқылы CD95 және CD99 топырақ РНҚ үлгілерінен толық ұзындықтағы βvdl786 (664 нт, жоғарғы панель) және βvdl1793 (685 нт, төменгі панель) RT-PCR амплификациясы. (B) ДНҚ баламасының жоқтығын растау үшін матрица ретінде кДНҚ немесе ДНҚ препараттарын пайдаланып, βvdl786 (248 нт, сол жақ жоғарғы панель) және βvdl1793 (256 нт, сол жақ төменгі панель) ішінара фрагментінің ПТР амплификациясы. Оң жақ панельде оң бақылау ретінде саңырауқұлақтың әмбебап праймерлері ITS4/ITS5 көмегімен CD95 және CD99 ДНҚ амплификациясы көрсетілген. (C) Келісім бойынша (+) полярлық деп белгіленетін, ең көп таралған полярлық тізбегін βvdl786 (жоғарғы панель) және βvdl1793 (төменгі панель) анықтауға арналған тізбекке тән жартылай мөлшерлік RT-ПТР амплификациясы. n.d., сұйылтылмаған. M, Gene ruler ДНҚ баспалдақ қоспасы (Thermo Scientific). (D) βvdl786 өзін-өзі кесу белсенділігін талдау. In vitro транскрипция арқылы түзілген плюс және минус полярлықтағы плазмида мен βvdl786 РНҚ өнімдерінің схемалық көріністері сәйкесінше оң және сол жақ панельдерде көрсетілген. βvdl786 мономерлі кДНҚ тізбегі бар плазмида сызықтандырылып, (+) (оң жақта) және (−) (сол жақта) полярлық тізбектерінің толық ұзындықтағы мономерлі транскриптерін (FL), сондай-ақ HHRz өзін-өзі кесу белсенділігінен туындайтын тиісті 5′ (5′F) және 3′ (3′F) фрагменттерін өндіру үшін транскрипцияланды. Плазмидалық вектордың тізбектері жасыл түспен, ал полимераза промоторы мен βvdl786 тізбектері сәйкесінше сары және көк түстермен көрсетілген. Қайшылар өзін-өзі кесу орындарының орнын белгілейді. Әрбір РНҚ фрагментінің күтілетін мөлшері оң жақта көрсетілген. Ортаңғы панельде (+) және (-) βvdl786 мономерлерінің in vitro транскрипциясының 5% PAGE талдауы көрсетілген. M, РНҚ маркері (төмен диапазонды ssРНҚ баспалдағы, New England Biolabs), өлшемдері (нт) сол жақта көрсетілген.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-f7.jpg\" alt=\"7-сур. Метатранскриптомдық деректер жиынтығында анықталған бетавироид тәрізді РНҚ-лардың болжанған екінші реттік құрылым\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-сур. Метатранскриптомдық деректер жиынтығында анықталған бетавироид тәрізді РНҚ-лардың болжанған екінші реттік құрылымдарының дөңгелек диаграммасы. Екі полярлық тізбегіндегі ORF A және B (көк және жасыл) салыстырмалы орындары, басталу (үшбұрыштар) және тоқтау (қызыл квадраттар) кодондары, сондай-ақ болжанған балға тәрізді рибозимдер (күлгін және қызғылт сары) көрсетілген.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-f8.jpg\" alt=\"8-сур. Метатранскриптомдық деректер жиынтығында анықталған бетавироид тәрізді РНҚ-лардың (+) және (-) балға тәрізді рибо\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-сур. Метатранскриптомдық деректер жиынтығында анықталған бетавироид тәрізді РНҚ-лардың (+) және (-) балға тәрізді рибозимдерінің екінші реттік құрылымы. Кесу орны көрсеткімен белгіленген және каталитикалық ядро ішіндегі консервативті нуклеотидтер қара фонмен ерекшеленген.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-fS1.jpg\" alt=\"S1-сур. AlphaFold 3 негізінде жұмыс істейтін AlphaFold Server көмегімен болжанған дзета вирусы ZV1, ZV2 және ZV3 болжамд\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S1-сур. AlphaFold 3 негізінде жұмыс істейтін AlphaFold Server көмегімен болжанған дзета вирусы ZV1, ZV2 және ZV3 болжамды ақуыздарының үшінші реттік құрылымдары (A және B).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-fS2.jpg\" alt=\"S2-сур. Дзета вирустарының нуклеотидтік және аминқышқылдық тізбегінің ұқсастықтары. (A) Рибозимдердің әртүрлі түрлері ба\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S2-сур. Дзета вирустарының нуклеотидтік және аминқышқылдық тізбегінің ұқсастықтары. (A) Рибозимдердің әртүрлі түрлері бар барлық анықталған дзета вирустарының нуклеотидтік тізбегінің пайыздық ұқсастық матрицасын көрсететін жылу картасы (H: III типті балға тәрізді; H2: II типті балға тәрізді; D: дельта; T: твистер; HP: шашқыс рибозимдер). (B) Дзета вирустарының болжамды ақуыздарының (ORF A және ORF B) аминқышқылдық тізбегінің пайыздық ұқсастық матрицасын көрсететін жылу картасы. DVRz: дельта рибозим; II HHRz: II типті балға тәрізді рибозимдер; III HHRz: III типті балға тәрізді рибозимдер; HPRz: шашқыс рибозим; TWRz: твистер рибозим.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-fS3.jpg\" alt=\"Сурет. S3. AlphaFold 3 негізінде жұмыс істейтін AlphaFold Server көмегімен болжанған бетавироид тәрізді РНҚ-лар (βvdl786\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет. S3. AlphaFold 3 негізінде жұмыс істейтін AlphaFold Server көмегімен болжанған бетавироид тәрізді РНҚ-лар (βvdl786, βvdl1793, βvdl270217 және βvdl184674) кодтайтын болжамды ақуыздардың үшінші реттік құрылымдары.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-fS4.jpg\" alt=\"Сурет. S4. Бетавироид тәрізді РНҚ-лардың нуклеотидтік және аминқышқылдық тізбектерінің ұқсастығы. (A) Барлық анықталған \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет. S4. Бетавироид тәрізді РНҚ-лардың нуклеотидтік және аминқышқылдық тізбектерінің ұқсастығы. (A) Барлық анықталған бетавироид тәрізді РНҚ нуклеотидтік тізбектерінің ұқсастық пайызы матрицасын көрсететін жылу картасы. (B) Он бес бетавироид тәрізді РНҚ кодтайтын болжамды ақуыздардың (ORF A және ORF B) аминқышқылдық тізбектерінің ұқсастық пайызы матрицасын көрсететін жылу картасы.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-fS5.jpg\" alt=\"Сурет S5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S5&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-fS6.jpg\" alt=\"Сурет S6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S6&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"kesteler\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#kesteler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кестелер&lt;/span&gt;&lt;/a&gt;Кестелер&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 1.&lt;/strong&gt; III типті HHRz-тен басқа рибозималары бар болжамды дзета-вирустар тізімі.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;ID&lt;/th&gt;\n&lt;th&gt;Contig&lt;/th&gt;\n&lt;th&gt;Геном өлшемі (нт)&lt;/th&gt;\n&lt;th&gt;Рибозим (+)&lt;/th&gt;\n&lt;th&gt;E-value (+)&lt;/th&gt;\n&lt;th&gt;Рибозим (-)&lt;/th&gt;\n&lt;th&gt;E-value (-)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 2.&lt;/strong&gt; Метатранскриптомдық деректер жиынтығында анықталған болжамды бетавироид тәрізді РНҚ тізімі.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;ID&lt;/th&gt;\n&lt;th&gt;Contig&lt;/th&gt;\n&lt;th&gt;Геном өлшемі (нт)&lt;/th&gt;\n&lt;th&gt;Болжамды ақуыз 1 (aa)&lt;/th&gt;\n&lt;th&gt;ORF A соңы / 2-мономердегі орны (нт)&lt;/th&gt;\n&lt;th&gt;Болжамды ақуыз 2 (aa)&lt;/th&gt;\n&lt;th&gt;ORF B соңы / 2-мономердегі орны (нт)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Кесте S1.&lt;/strong&gt; Осы зерттеуде қолданылған праймерлер тізімі.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Праймер атауы&lt;/th&gt;\n&lt;th&gt;Тізбегі (5’ - 3’)&lt;/th&gt;\n&lt;th&gt;Мақсаты&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;ZetaV 1 _&lt;/td&gt;\n&lt;td&gt;TTTTACAATTCCACTCGACCGA&lt;/td&gt;\n&lt;td&gt;ZV1 толық ұзындықтағы геномын ПТР амплификациялау&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;ZetaV 2 _&lt;/td&gt;\n&lt;td&gt;AGGGAAAGGAGGGTAAGAATGA&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;ZetaV 184 3 _ _&lt;/td&gt;\n&lt;td&gt;GTCCGAAACTCTCTCTCCGA&lt;/td&gt;\n&lt;td&gt;ZV1 фрагментін ПТР амплификациялау (184 нт)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;ZetaV 184 4 _ _&lt;/td&gt;\n&lt;td&gt;CCAACCAGAGAAACCAAGCC&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;ZetaV 184 4 _ _&lt;/td&gt;\n&lt;td&gt;CCAACCAGAGAAACCAAGCC&lt;/td&gt;\n&lt;td&gt;5’ RACE ZV1 (+)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Zeta nRacePlus 82 _ _&lt;/td&gt;\n&lt;td&gt;CCTGATAGGAGTGAT
