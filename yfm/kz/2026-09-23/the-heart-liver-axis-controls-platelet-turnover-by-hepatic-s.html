        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"186\" cy=\"166\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"554\" cy=\"192\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · MOLECULAR BIOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Инфаркттен кейін жүрек бауыр&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;арқылы қанды қалай басқарады&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s-f1.jpg\" alt=\"1-сурет. Миокард инфаркті тромбоциттердің алмасуының күшеюіне әкеледі. Тышқандар жабық кеуде қуысы моделін қолдана отыры\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Миокард инфаркті тромбоциттердің алмасуының күшеюіне әкеледі. Тышқандар жабық кеуде қуысы моделін қолдана отырып, ишемиялық/реперфузиялық (И/Р) зақымдануға ұшырады. И/Р зақымдануынан кейінгі сол жақ қарыншаның функциясы эхокардиография арқылы бағаланды. (A) Миокардтың зақымдалғанын растау үшін И/Р кейінгі көрсетілген уақыт нүктелерінде жүрек шығару фракциясы анықталды (n=4). (B) Тромбоциттер саны И/Р зақымдануына дейін және кейін жабайы типтегі тышқандардың тұтас қанында өлшенді (n=12 (сау), 7 (6 сағ), 12 (24 сағ), 7 (5 күн), 10 (21 күн)). (C) Жуылған тұтас қандағы GPIb оң тромбоциттер FSC шашырау профилінің геометриялық орташа мәнімен анықталған мөлшеріне қатысты талданды (n=9). (D) Ретикулярлы тромбоциттердің саны ағынды цитометрия көмегімен тиазол сарысымен бояу арқылы анықталды (n=9). (E) Десиализацияланған тромбоциттер олардың Ricinus communis агглютинині-1 (RCA) байланысу профиліне қатысты талданды (n=9). (F) Апоптоздық тромбоциттер AnnexinV байланысуы арқылы анықталды (n=6). (G-H) Көрсетілген уақыт нүктелерінде тромбоциттердің активациясы белсенді интегрин IIb3 (G) пен байланысатын JON/A-PE антиденелерін және тромбоциттердің дегрануляция маркері ретінде P-селектинді (H) қолдану арқылы анықталды (n=5-10). Деректер орташа ± SEM түрінде ұсынылған. Статистикалық талдаулар Тьюкидің бірнеше салыстыру тесті бар кәдімгі бір бағытты ANOVA арқылы жасалды. * p &amp;lt; 0,05, ** p &amp;lt; 0,01, *** p &amp;lt; 0,001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Жедел миокард инфарктінен кейін ағза қауіпті асқынулардың алдын алу үшін тромбоциттер деңгейін шұғыл қалпына кіріседі. Осы уақытқа дейін сүйек кемігі қан жасушаларының жетіспеушілігі туралы сигналды қалай алатыны жұмбақ болып келді. Тышқандарда жасалған жаңа тәжірибелер бұл процесте бауырдың маңызды рөл атқаратынын көрсетті. Зақымдалған жүрек қабыну сигналдарын жіберіп, бауырды тромбопоэтин гормонын көбірек шығаруға мәжбүрлейді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Инфаркт қандағы тромбоциттердің жаңаруын тездетеді.&lt;/li&gt;\n&lt;li&gt;Бауыр STAT3 сигналдық жолы арқылы тромбопоэтин өндірісін белсендіреді.&lt;/li&gt;\n&lt;li&gt;Тромбоциттердің жедел жоғалуы мен рецептор тапшылығы әртүрлі жұмыс істейді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеушілер инфарктен кейінгі алғашқы тәуліктерде тромбоциттер популяциясының өзгеру динамикасын зерттеу үшін тышқандардағы ишемия және реперфузия моделін қолданды. Жануарлардың қанында жас ретикуляцияланған және десиалирленген тромбоциттер санының өскені анықталды, бұл жасушалардың жедел жаңаруын көрсетеді. Тін талдауы бауырда Asgr1/2 және IL-6R рецепторларының белсенгенін, сондай-ақ STAT3 ақуызының фосфорлануы артқанын көрсетті.&lt;/p&gt;\n&lt;p&gt;Миокард зақымдалғаннан кейін жиырма төрт сағат өткен соң қан плазмасында тромбопоэтин концентрациясы айтарлықтай өсіп, тромбоциттер тапшылығын тез жоюға мүмкіндік берді. GPIbα антиденелері арқылы тромбоциттерді жасанды түрде азайту тәжірибелері бұл реакцияның компенсаторлық сипатын растады. Сонымен қатар, GPVI рецепторы жоқ тышқандарда мұндай өзгерістер байқалмады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тышқан үлгілерінде жүргізілгендіктен, қорытындыларды адам физиологиясына тікелей көшіру клиникалық растауды талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Ғылыми жұмысқа Дюссельдорф университетінің клиникасы (Германия) жанындағы қан тамыр және эндоваскулярлық хирургия бөлімінің профессоры Маргитта Элверс жетекшілік етеді. Зерттеу әдістемесі, нәтижелері немесе ынтымақтастық туралы барлық сұрақтар бойынша Эксперименталды қан тамыр медицинасы бөліміне (мекенжайы: Moorenstr. 5, 40225 Düsseldorf) хабарласуға болады. Жедел байланыс үшін +49 (0)211 81-08851 телефон нөмірі мен +49 (0)211 81-17498 факс нөмірі қарастырылған.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Хат алмасу (Correspondence) — бұл мақала авторларымен байланысудың ресми арнасы, онда зерттеудің дұрыстығы мен ғылыми қауымдастықпен қарым-қатынас жасауға жауапты тұлға көрсетіледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"zhuerek-bauyr-osi-zhaene-trombocitter-rettelui\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#zhuerek-bauyr-osi-zhaene-trombocitter-rettelui\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жүрек-бауыр осі және тромбоциттер реттелуі&lt;/span&gt;&lt;/a&gt;Жүрек-бауыр осі және тромбоциттер реттелуі&lt;/h4&gt;\n&lt;p&gt;Тромбоциттер жедел миокард инфарктінен (МИ) кейінгі тромбо-қабыну процестерінде маңызды рөл атқарады. Зерттеу МИ-ден кейін бауыр тромбопоэтинінің (ТПО) реттелуіне әсерін қарастырады. Тәжірибелер жабайы типтегі, тромбоцитопениясы бар және GPVI жетіспеушілігі бар тышқандарда ишемия/реперфузия (И/Р) зақымдануы моделінде жүргізілді. Тромбоциттердің белсенуі мен алмасуы, сондай-ақ ТПО реттелуіне қатысатын бауыр рецепторлары талданды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;МИ-ден кейін «жүрек-бауыр» осі белсеніп, 24 сағат ішінде плазмадағы ТПО деңгейін арттырады және STAT3 сигналдары арқылы тромбоциттер санын жылдам қалпына келтіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нәтижелер МИ-ден кейін тромбоциттер алмасуының жеделдегенін, ретикулярлы және десиалданған формалардың көбейгенін көрсетті. Бауырда Asgr1/2 және IL-6R рецепторларының экспрессиясы артып, STAT3 фосфорлануы күшейді, ал көкбауырда мегакариоциттер саны өсті. Тромбоциттердің тапшылығы ТПО-ның компенсаторлық өсуіне әкеледі, бірақ Gp6-/- тышқандарында бұл өзгерістер байқалмайды, бұл жедел тромбоцитопения мен созылмалы рецепторлық жетіспеушілік арасындағы айырмашылықты көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"trombocitter-fiziologiyasy-zhaene-rettelu-mehanizmderi\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#trombocitter-fiziologiyasy-zhaene-rettelu-mehanizmderi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тромбоциттер физиологиясы және реттелу механизмдері&lt;/span&gt;&lt;/a&gt;Тромбоциттер физиологиясы және реттелу механизмдері&lt;/h4&gt;\n&lt;p&gt;Тромбоциттер санын тұрақты ұстау (қалыпты жағдайда 150–400 × 10³ мкл⁻¹) қан кету мен тромбоздың алдын алу үшін маңызды. МИ-ден кейінгі алғашқы кезеңде мегакариоциттердің пролиферациясы мен тромбоциттер санының өсуі байқалады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эшвелл-Морелл рецепторы (AMR) — бауырдағы ASGPR1 және ASGPR2 суббірліктерінен тұратын кешен, ол ескірген тромбоциттерді танып, оларды жою арқылы ТПО синтезін басқаратын JAK2/STAT3 жолын белсендіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ТПО мегакариоциттер дифференциациясының негізгі реттеушісі болып табылады. Тромбоциттер AMR арқылы тазартылады, бұл JAK2-ні белсендіреді. Сонымен қатар, IL-6-ның IL-6R-мен байланысуы STAT3-ті белсендіріп, ТПО mRNA биосинтезін ынталандырады. Авторлар тышқандардағы И/Р модельдері арқылы AMR-IL-6R-STAT3 жолы МИ-ден кейін тромбоциттер гомеостазын сақтауда шешуші рөл атқаратынын растады.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"31-zhedel-miokard-infarkti-trombocitterding-zhedel-zhangaruyna-aekeledi\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#31-zhedel-miokard-infarkti-trombocitterding-zhedel-zhangaruyna-aekeledi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.1 Жедел миокард инфаркті тромбоциттердің жедел жаңаруына әкеледі&lt;/span&gt;&lt;/a&gt;3.1 Жедел миокард инфаркті тромбоциттердің жедел жаңаруына әкеледі&lt;/h4&gt;\n&lt;p&gt;C57BL/6J тышқандарында LAD лигациясы арқылы 60 минуттық жедел миокард инфарктісі (ЖМИ) және одан кейінгі 24 сағат, 7 және 21 күндік реперфузия (I/R) жүргізілді. Хирургиялық жарақатты азайту үшін жабық кеуде қуысы моделі қолданылды. Сол жақ қарыншаның дисфункциясы эхокардиография арқылы расталды (Сурет 1A). Тромбоциттер саны I/R-ден кейін тек 6 сағаттан соң айтарлықтай төмендеді, ал 24 сағаттан кейін қалыпқа келіп, 21 күнге дейін тұрақты болды (Сурет 1B). GPIb-оң тромбоциттердің геометриялық орташа көлемі 6 сағаттан кейін ұлғайып, 24 сағаттан кейін азайды (Сурет 1C). Тиазол қызғылт сары бояуымен боялған ретикулярлы тромбоциттер саны 6 сағаттан кейін артты (Сурет 1D). RCA-1 лектині көмегімен жүргізілген талдау 6 сағаттан кейін десиалирленген тромбоциттер үлесінің артқанын көрсетті (Сурет 1E). 24 сағат және 5 күннен кейін айырмашылықтар байқалмады. Annexin-V-оң (апоптозға ұшыраған) тромбоциттер саны 24 сағаттан кейін артты (Сурет 1F). Сонымен қатар, I/R-ден 4 сағат өткен соң, JON-A байланысуы (белсенді αIIbβ₃ интегрині) және P-селектин экспрессиясы арқылы тыныштық күйдегі тромбоциттердің белсенуі анықталды (Сурет 1G-H). 21 күннен кейін базальды белсену бақылау тобымен салыстырғанда төмендеді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s-f1.jpg\" alt=\"1-сурет. Миокард инфаркті тромбоциттердің алмасуының күшеюіне әкеледі. Тышқандар жабық кеуде қуысы моделін қолдана отыры\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Миокард инфаркті тромбоциттердің алмасуының күшеюіне әкеледі. Тышқандар жабық кеуде қуысы моделін қолдана отырып, ишемиялық/реперфузиялық (И/Р) зақымдануға ұшырады. И/Р зақымдануынан кейінгі сол жақ қарыншаның функциясы эхокардиография арқылы бағаланды. (A) Миокардтың зақымдалғанын растау үшін И/Р кейінгі көрсетілген уақыт нүктелерінде жүрек шығару фракциясы анықталды (n=4). (B) Тромбоциттер саны И/Р зақымдануына дейін және кейін жабайы типтегі тышқандардың тұтас қанында өлшенді (n=12 (сау), 7 (6 сағ), 12 (24 сағ), 7 (5 күн), 10 (21 күн)). (C) Жуылған тұтас қандағы GPIb оң тромбоциттер FSC шашырау профилінің геометриялық орташа мәнімен анықталған мөлшеріне қатысты талданды (n=9). (D) Ретикулярлы тромбоциттердің саны ағынды цитометрия көмегімен тиазол сарысымен бояу арқылы анықталды (n=9). (E) Десиализацияланған тромбоциттер олардың Ricinus communis агглютинині-1 (RCA) байланысу профиліне қатысты талданды (n=9). (F) Апоптоздық тромбоциттер AnnexinV байланысуы арқылы анықталды (n=6). (G-H) Көрсетілген уақыт нүктелерінде тромбоциттердің активациясы белсенді интегрин IIb3 (G) пен байланысатын JON/A-PE антиденелерін және тромбоциттердің дегрануляция маркері ретінде P-селектинді (H) қолдану арқылы анықталды (n=5-10). Деректер орташа ± SEM түрінде ұсынылған. Статистикалық талдаулар Тьюкидің бірнеше салыстыру тесті бар кәдімгі бір бағытты ANOVA арқылы жасалды. * p &amp;lt; 0,05, ** p &amp;lt; 0,01, *** p &amp;lt; 0,001.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ЖМИ алғашқы 6–24 сағат ішінде тромбоциттер санының уақытша төмендеуіне және олардың жедел жаңаруына әкеледі.&lt;br /&gt;\n[!tip] Ретикулярлы тромбоциттер — бұл сүйек кемігінен жаңа шыққан жас формалар, олардың көбеюі тромбопоэздің күшейгенін білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"32-ishemiya-men-reperfuziyadan-kejin-trombopoetin-ekspressiyasynyng-erte-artuy\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#32-ishemiya-men-reperfuziyadan-kejin-trombopoetin-ekspressiyasynyng-erte-artuy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.2 Ишемия мен реперфузиядан кейін тромбопоэтин экспрессиясының ерте артуы&lt;/span&gt;&lt;/a&gt;3.2 Ишемия мен реперфузиядан кейін тромбопоэтин экспрессиясының ерте артуы&lt;/h4&gt;\n&lt;p&gt;Біз тромбоциттер санының қалпына келу механизмдерін талдадық. Плазмадағы тромбопоэтин (TPO) деңгейі I/R-ден 24 сағат өткен соң айтарлықтай артты (Сурет 2A). Десиалирленген тромбоциттер бауырдағы AMR рецепторларымен байланысып, JAK2-STAT3 жолын белсендіреді. STAT3 белсенуі I/R-ден 6 сағат өткен соң айтарлықтай артып, 24 сағаттан кейін қалыпқа оралды (Сурет 2B). Asgr1 суббірлігінің экспрессиясы 6–24 сағат ішінде өсу тенденциясын көрсетті, ал Asgr2 24 сағаттан кейін айтарлықтай артты (Сурет 2C). Бауырда IL-6 рецепторы экспрессиясының өсу тенденциясы да байқалды. Tpo экспрессиясы I/R-ден 6 және 24 сағат өткен соң артып, 5–21 күндері төмендеді (Сурет 2C). Соңында, біз AMR/IL-6-STAT3-TPO жолының белсенуі көкбауырдағы мегакариопоэзді ынталандыратынын анықтадық: мегакариоциттер саны айтарлықтай артты, бірақ көкбауыр салмағының дене салмағына қатынасы өзгермеді (Сурет 2D-E).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s-f2.jpg\" alt=\"2-сурет. Миокард инфарктінен кейін ерте кезеңде ТРО экспрессиясының жоғарылауы. (A) И/Р зақымдануына дейін және 24 сағат\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет. Миокард инфарктінен кейін ерте кезеңде ТРО экспрессиясының жоғарылауы. (A) И/Р зақымдануына дейін және 24 сағаттан кейін жабайы типтегі тышқандардың плазмасындағы тромбопоэтин (TPO) концентрациясын талдау (n=4). (B) Жабайы типтегі тышқандардың бүкіл бауыр тіні И/Р зақымдануынан кейінгі көрсетілген уақыт нүктелерінде STAT3 фосфорлануына талданды (n=3). (C) Tpo экспрессиясын реттеуге қатысатын әртүрлі рецепторлардың салыстырмалы гендік экспрессиясы И/Р зақымдануынан кейін жабайы типтегі тышқандардың бүкіл бауыр тінінде көрсетілген уақыт нүктелерінде талданды (n = 3-4). (D) Тышқандарда И/Р зақымдануынан кейін көкбауырдың салыстырмалы салмағы өлшенді (n=5-9). (E) Көкбауыр кесінділері дайындалып, әр көру өрісіне (FOV) мегакариоциттердің жалпы санын санау үшін H&amp;amp;E боялды (n=6). Деректер орташа ± SEM түрінде ұсынылған. Статистикалық талдаулар жұпталмаған Стьюдент t-тесті (A+E) немесе Тьюкидің бірнеше салыстыру тесті бар кәдімгі бір бағытты ANOVA (B-D) арқылы жасалды. * p &amp;lt; 0,05, ** p &amp;lt; 0,01, *** p &amp;lt; 0,001. Масштабтық сызықша = 20 мкм. H&amp;amp;E = гематоксилин және эозин; FOV = көру өрісі.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ЖМИ-ден кейін бауырдағы AMR-JAK2-STAT3-TPO сигналдық жолының ерте белсенуі көкбауырдағы мегакариопоэзді ынталандыру арқылы тромбоциттер деңгейін қалпына келтіреді.&lt;br /&gt;\n[!warning] Зерттеу тышқан моделінде жүргізілген, сондықтан нәтижелерді адам патофизиологиясына тікелей көшіруде сақтық таныту қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"33-zhedel-trombocitopeniya-miokard-infarktinen-kejin-megakariopoezdi-khozdyrady\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#33-zhedel-trombocitopeniya-miokard-infarktinen-kejin-megakariopoezdi-khozdyrady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.3 Жедел тромбоцитопения миокард инфарктінен кейін мегакариопоэзді қоздырады&lt;/span&gt;&lt;/a&gt;3.3 Жедел тромбоцитопения миокард инфарктінен кейін мегакариопоэзді қоздырады&lt;/h4&gt;\n&lt;p&gt;Десиалирленген тромбоциттердің бауырдағы AMR-IL6R-STAT3 сигналдық жолын белсендірудегі рөлін және тромбоцитопенияның миокард инфарктінен (МИ) кейінгі тромбоциттер айналымына әсерін бағалау үшін біз тромбоцитопениясы бар тышқандар моделін қолдандық. Тромбоциттерді азайтатын антиденелерді енгізу арқылы олардың санын бақылау тобының &amp;lt;1%-на дейін төмендеттік (3A-сурет). Көкбауыр массасында өзгеріс байқалмады (3B-сурет). Тромбоцитопениясы бар тышқандарда плазмадағы IL-6 цитокинінің деңгейі төмендегені анықталды, бұл қабыну процесінде тромбоциттердің маңызды рөлін растайды. Ишемия/реперфузиядан (И/Р) 6 сағат өткен соң, плазмадағы тромбопоэтин (TPO) деңгейі бақылау тобымен салыстырғанда тромбоцитопениясы бар тышқандарда айтарлықтай жоғары болды (3D-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тромбоцитопения плазмадағы IL-6 деңгейін төмендетеді, бірақ И/Р-дан 6 сағат өткен соң TPO концентрациясын арттырады, бұл бауырдың компенсаторлық реакциясын көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бауырдағы Tpo генінің экспрессиясы бастапқы күйде тромбоциттері азайтылған тышқандарда жоғарырақ болды, бірақ И/Р-дан 6 және 24 сағат өткен соң топтар арасында елеулі айырмашылықтар байқалмады (3E-сурет). Дегенмен, И/Р-дан 24 сағат өткен соң, Tpo экспрессиясы тромбоцитопениясы бар тышқандарда жоғары деңгейде сақталды, ал бақылау тобында ол төмендеді. Асиалогликопротеин рецепторының (AMR) Asgr1 және Asgr2 суббірліктерінің экспрессиясы И/Р-дан 6 сағат өткен соң өсті, бірақ 24 сағатқа қарай тромбоцитопениясы бар тышқандарда базальды деңгейге дейін түсті, ал бақылау тобында бұл төмендеу азырақ байқалды (3E-сурет). Бауырдағы STAT3 фосфорлануы И/Р-дан 6 сағат өткен соң IgG бақылау тобында тромбоцитопениясы бар тышқандарға қарағанда айтарлықтай жоғары болды (3F-сурет). Көкбауырдағы мегакариоциттер санында айырмашылық байқалмады (3G-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тышқандар моделінде жүргізілген, сондықтан нәтижелерді адам ағзасындағы процестерге тікелей көшіру сақтықты талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"34-gpvi-ding-i/r-zakhymdanuynan-kejin-bauyrlykh-tpo-signaldary-arkhyly-trombocitter-sanyn-retteuge-aeseri\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#34-gpvi-ding-i/r-zakhymdanuynan-kejin-bauyrlykh-tpo-signaldary-arkhyly-trombocitter-sanyn-retteuge-aeseri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.4 GPVI-дің И/Р зақымдануынан кейін бауырлық TPO сигналдары арқылы тромбоциттер санын реттеуге әсері&lt;/span&gt;&lt;/a&gt;3.4 GPVI-дің И/Р зақымдануынан кейін бауырлық TPO сигналдары арқылы тромбоциттер санын реттеуге әсері&lt;/h4&gt;\n&lt;p&gt;Алдыңғы зерттеулер гликопротеин VI (GPVI)-дің инфарктіден кейінгі жүрек ремодельденуіндегі рөлін анықтады. Біз Gp6+/+ және Gp6-/- (нокаут) тышқандарын салыстыра отырып, GPVI-дің бауырдағы TPO синтезіне әсерін зерттедік. Бауырдағы Tpo, Asgr1, Asgr2 және Il6r гендерінің экспрессиясын талдау көрсеткендей, екі генотипте де И/Р-дан кейін Tpo және Asgr1 экспрессиясының уақытқа тәуелді өсуі байқалды (4A-D-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нокаут — бұл функцияны зерттеу үшін белгілі бір генді ағзадан алып тастау немесе «өшіру» процесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;TPO синтезінің негізгі реттеушісі болып табылатын STAT3 фосфорлануы екі топта да И/Р-дан 6 сағат өткен соң айтарлықтай өсті және 24 сағатқа қарай базальды деңгейге оралды. Gp6+/+ және Gp6-/- тышқандары арасында STAT3 белсендірілуінде статистикалық тұрғыдан елеулі айырмашылықтар анықталмады (4E-сурет). Осылайша, GPVI-дің болмауы миокард инфарктінен кейін жүйелі TPO деңгейіне немесе бауырдағы STAT3 белсендірілуіне елеулі әсер етпейді.&lt;/p&gt;\n&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;p&gt;Тромбоциттердің гиперреактивтілігі жүрек-қан тамырлары патологияларында, соның ішінде жедел миокард инфарктісінде (ЖМИ) жақсы зерттелген құбылыс болып табылады, мұнда олар реперфузиялық зақымдануды күшейтеді. ЖМИ-ден кейін тромбоциттердің айналымының артуы алыс болжамдардың нашарлауына байланысты ретикулярлы тромбоциттер санының өсуine әкеледі. Біздің жұмыста біз жабайы түрдегі (WT) тышқандарда инфаркттан кейінгі жедел фазада 1 C+D суретте ретикулярлы тромбоциттердің көбейгенін ғана емес, сонымен қатар 1 E+F суретте кәрі тромбоциттер жиілігінің жоғарылауымен тромбоциттер субпопуляцияларының ығысқанын байқадық. Бұл нәтижелер тромбоциттер гемостазының белсенді реттелетінін, ықтимал ЖМИ-ден кейінгі бауырдың тромбопоэтинді (ТПО) реттеуі арқылы жүзеге асатынын көрсетеді. ТПО реттелуін және бұл процестегі тромбоциттердің рөлін зерттеу үшін біз екі модельді қолдандық: (1) жедел тромбоцитопенияны тудыру үшін антиденелер көмегімен тромбоциттерді азайту және (2) созылмалы GPVI тапшылығын бағалау үшін генетикалық түрлендірілген GP6⁻/- тышқандар.&lt;/p&gt;\n&lt;p&gt;Бауыр тромбоқабынудан кейін тромбоциттерді тазартуда маңызды рөл атқарып, қабыну реакцияларын, соның ішінде ТПО синтезін реттейді. Біздің деректеріміз бауырдағы ТПО экспрессиясы ЖМИ-ден кейін WT тышқандарда күшейген pSTAT3 сигнализациясымен бірге айтарлықтай өсетінін көрсетті. Қызығы, бауыр тініндегі AMR және IL6R экспрессиясы да ЖМИ-ден кейін 2 B-C суретте күшейді. Бұл нәтижелер миокард зақымдануы кезінде жүрек-бауыр байланысын IL-6/STAT3 жолы арқылы реттейтінін көрсететін бұрынғы зерттеулермен сәйкес келеді. Бұл ось гепатоциттердегі минералокортикоидты рецепторларды тікелей тежеп, ЖМИ нәтижесін жақсартады. Тромбоциттер моноциттер мен макрофагтардың IL-6 секрециясын реттейтінін ескере отырып, біз тромбоцитопениялық тышқандарда 3C суретте плазмадағы IL-6 деңгейінің төмендеуін және STAT3 фосфорлануының әлсірегенін байқадық. Тромбоциттердің десиалирленуі AMR арқылы STAT3 белсенділігіне әсер ететіндіктен, реперфузиядан кейін 6 сағат өткен соң бауыр тінінде pSTAT3 күшеюімен қатар десиалирленудің де артқанын анықтадық. Сондықтан тромбоциттердің айналымы десиалирленген тромбоциттердің байланысуы және бауыр тінінің иммуномодуляциясы арқылы тромбоқабынуды күшейте отырып, бауырдың сигналдық жолдарын реттейді деп ұсынамыз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тромбоциттері азайған тышқандарда плазмалық IL-6 төмендеуі кезінде ТПО генінің экспрессиясы мен плазмадағы ТПО деңгейі 3D-E суретте компенсаторлы түрде өсті, ал STAT3 дисрегуляциясы 3F суретте сақталды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Плазмалық IL-6 деңгейінің төмендеуінен басқа, тромбоцитопениялық тышқандар 3D-E суретте ТПО генінің экспрессиясы мен плазмадағы ТПО деңгейінің компенсаторлы жоғарылауын көрсетті. Қызығы, тромбоцитопениядан кейінгі ТПО-ның компенсаторлы өсуі әдеттегі жағдай емес және оның себебіне тығыз байланысты. Иммундық тромбоцитопениясы бар науқастарда ТПО деңгейі күтілгеннен төмен болса, тромбоцитемия ТПО деңгейінің көтерілуіне әкеледі. Бұл тромбоциттер массасы мен плазмалық ТПО деңгейінің кері корреляциясы туралы тұжырымға күмән келтіреді. Дегенмен, бұл тышқандарда STAT3 сигнализациясы бұзылған күйінде қалды, бұл тромбоцитопенияның 3F суретте STAT3 фосфорлануының динамикалық реттелуін бұзатынын білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Десиалирлену — жасуша бетінен сиал қышқылының қалдықтарын ферментативті түрде алып тастау процесі, бұл олардың бауыр арқылы тазалануын тездетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Алайда ұқсас фенотип жақында тышқандық тромбоцитопения моделінде сипатталған еді. Sun және әріптестері Notch1 сигнализациясы бауыр тінінде ТПО өндірісін реттейтінін дәлелдеді. Олардың моделінде гепатоцит-спецификалық (HC) Notch1⁻/- тышқандарда бауыр тінінде STAT3 фосфорлануы мен ТПО экспрессиясы төмендетілген тромбоцитопения байқалды. HC-Notch1⁻/- тышқандарындағы төмендеген p-STAT3-тен айырмашылығы, біз мұнда ЖМИ-ден кейін 3E суретте ТПО-ға қатысты гендердің экспрессиясына шамалы әсер ететін тромбоциттердің азаюын көрсеттік. Бұл STAT3 реттеу механизмінің күрделірек екенін және ЖМИ-ден кейінгі тромбоцитопенияның қайталама әсері ретінде пайда болатынын көрсетейді.&lt;/p&gt;\n&lt;p&gt;Керісінше, GP6⁻/- тышқандар 4A-D суретте WT тышқандармен салыстырғанда рецептор немесе ТПО реттелуінде айтарлықтай өзгерістер көрсетпеді, тек ЖМИ-ден кейін ерте кезеңде IL6R экспрессиясында шамалы өзгерістер байқалды, бұл ықтимал GP6⁻/- бауыр тініндегі бастапқы IL6R деңгейінің біраз жоғары болуына байланысты. Сонымен қатар, STAT3 белсенділігінде ешқандай айырмашылықтар байқалмады 4E сурет. Бұл нәтижелер GPVI тапшылығы ЖМИ-ден кейінгі жедел қабыну реакцияларына айтарлықтай әсер етпейтінімен, бірақ тыртық түзілуі сияқты ұзақ мерзімді жүрек ремоделингіне әсер ететіні туралы бұрынғы есептермен сәйкес келеді. Біздің деректеріміз жедел тромбоциттердің азаюы бауырдың ТПО жауабын тудырса да, созылмалы GPVI тапшылығы мұндай реттеуші әсер етпейтінін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Алынған ТПО жауабы мен сигнализация нәтижелері жедел миокард инфарктісінің тышқандық модельдерінде алынды және оларды адамдарға толығымен экстраполяциялау сақтықты талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Көрсетілгендей, көкбауыр ЖМИ-ден кейінгі тромбоциттер динамикасында маңызды рөл атқарады. Көкбауырдан тромбоциттердің босап шығуы айналымдағы тромбоциттердің көлемінің ұлғаюына және ЖМИ-ден кейінгі қабынуға ықпал ететіні көрсетілген. Көкбауырдағы CD41 сигналдары ЖМИ-ден кейін азаяды, бұл тромбоциттердің қан айналымына жұмылдырылуының күшейгенін білдіреді. Тромбоциттердің айналымының артқаны туралы деректерімізді ескерсек, көкбауыр тромбоциттері байқалған субпопуляциялық өзгерістер мен бауырдың ТПО реттелуіне үлес қосуы ықтимал. Біздің зерттеуіміз сондай-ақ GPVI-ға бағытталған терапиялардың тромбоциттер гомеостазына әсер ету мүмкіндігі туралы сұрақтар туындатады. Ревацепт сияқты антитромбоцитарлық терапиялар тромбоцит-эндотелий өзара әрекеттесуін болдырмау арқылы ЖМИ-ден кейін инфаркт көлемін азайтып, жүрек функциясын жақсартатыны көрсетілген. Алайда, GPVI ингибирлеуінің тромбоциттердің өндірілуіне және бауырдың ТПО реттелуіне салдары әлі де түсініксіз күйінде қалып отыр.&lt;/p&gt;\n&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;p&gt;Біздің зерттеуіміз миокард инфарктісінен (МИ) кейінгі тромбоциттер алмасуының динамикалық реттелуі мен бауырдың TPO сигналдық жолдары туралы жаңа деректер ұсынады. Біз өткір тромбоцитопенияның бауырдағы TPO өндірісінің өтемпаз (компенсаторлық) артуына әкелетінін, бұл үрдіске STAT3 сигналының бұзылуы қатар жүретінін көрсетеміз, ал GPVI-дің созынкөй жетіспеушілігі бұл жолдарға айтарлықтай әсер етпейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жедел миокард инфарктісі және тромбоцитопения бауырда TPO синтезінің өтемпаз артуы мен STAT3 бұзылуын тудырады, ал GPVI жетіспеушілігі бұл жүйелерді өзгертпейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сонымен қатар, біздің нәтижелеріміз көкбауырда тромбоциттердің жұмылдырылуы және жүйелік тромбоқабыну реакциялары МИ-ден кейінгі тромбоциттер алмасуы мен бауырдың бейімделуіне ықпал ететінін көрсетеді. Жүрек-қан тамырлары ауруларында GPVI-ге бағытталған терапияның маңызы артып келе жатқанын ескерсек, болашақ зерттеулер олардың тромбоцитарлық гомеостазға, бауырдың TPO реттелуіне және жүректің ұзақ мерзімді нәтижелеріне әсерін зерттеуі тиіс.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бұл жұмыс тәжірибелік модельдерде орындалғандықтан, алынған деректерді адамдарға тікелей қолдану сақтықты талап етеді және клиникалық тексерулерді қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tромбоциттер, бауыр сигналдары және көкбауыр динамикасы арасындағы өзара байланысты түсіну миокард инфарктісінен кейін тромбоциттерді қалпына келтіру қабілетін сақтай отырып, тромбоқабынуды азайтуға бағытталған емдеу стратегияларын айтарлықтай жетілдіре алады.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"21-zhanuarlar\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#21-zhanuarlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.1 Жануарлар&lt;/span&gt;&lt;/a&gt;2.1 Жануарлар&lt;/h4&gt;\n&lt;p&gt;Барлық тәжірибелер ARRIVE нұсқаулықтарына және Еуропалық парламенттің зертханалық жануарлармен жұмыс істеу нормаларына, сондай-ақ Германияның жануарларды қорғау заңнамасына сәйкес жүргізілді. Протоколдар Генрих Гейне университетінің және Солтүстік Рейн-Вестфалия үкіметінің этикалық комитеттерімен мақұлданды (рұқсаттар AZ 84-02.04.2015.A558; AZ 81-02.04.2019.A270). Зерттеуде тек Janvier Labs компаниясынан алынған еркек C57BL/6J тышқандары пайдаланылды. GPVI тапшылығы бар (Gp6-/-) тышқандар гетерозиготалы дараларды шағылыстыру арқылы алынды, бұл нокауттық және бақылау (Gp6+/+) топтарын бөліп алуға мүмкіндік берді. Жануарлар 22 ± 1°C температурада және 12 сағаттық жарық циклінде ұсталды, оларға азық пен су еркін қолжетімді болды. Тромбоцитопенияны индукциялау үшін тышқандарға LAD артериясын байлаудан 24 сағат бұрын 2 мкг/г дозада GPIbα антиденелері (#R300) немесе бақылау IgG (#C301) енгізілді. Қан құрамы Sysmex анализаторында бақыланды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нокаут (Gp6-/-) — бұл белгілі бір ақуыздың (GPVI) синтезіне жауап беретін генді әдейі өшіру арқылы жасалатын генетикалық модификация.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"22-zhedel-miokard-infarktisi-zhmi-zhaene-reperfuziya-modeli\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#22-zhedel-miokard-infarktisi-zhmi-zhaene-reperfuziya-modeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.2 Жедел миокард инфарктісі (ЖМИ) және реперфузия моделі&lt;/span&gt;&lt;/a&gt;2.2 Жедел миокард инфарктісі (ЖМИ) және реперфузия моделі&lt;/h4&gt;\n&lt;p&gt;Хирургиялық жарақатты азайту үшін жабық кеуде моделі қолданылды. 10–12 апталық еркек тышқандар кетамин (100 мг/кг) және ксилазин (10 мг/кг) қоспасымен жансыздандырылды. Инфаркт сол жақ алдыңғы түсуші артерияны (LAD) 60 минутқа байлау арқылы шақырылды. Реперфузия ЭКГ-дағы ST-сегментінің өзгеруімен расталды. Сол жақ қарыншаның функциясы Vevo 3100 аппараты көмегімен 1, 5 және 21-күндері эхокардиография арқылы бағаланды.&lt;/p&gt;\n&lt;h4 id=\"23-trombocitter-sanyn-oelsheu\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#23-trombocitter-sanyn-oelsheu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.3 Тромбоциттер санын өлшеу&lt;/span&gt;&lt;/a&gt;2.3 Тромбоциттер санын өлшеу&lt;/h4&gt;\n&lt;p&gt;Қан үлгілері изофлуран (2–3%) анестезиясы астында ретробульбарлы веналық өрімнен алынды. Қан гепаринді ерітіндіге (20 Ед/мл) жиналып, Sysmex гематологиялық анализаторында талданды.&lt;/p&gt;\n&lt;h4 id=\"24-trombocitterding-aghyndykh-citometriyasy\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#24-trombocitterding-aghyndykh-citometriyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.4 Тромбоциттердің ағындық цитометриясы&lt;/span&gt;&lt;/a&gt;2.4 Тромбоциттердің ағындық цитометриясы&lt;/h4&gt;\n&lt;p&gt;Қан Tyrode буферінде (pH 7,35) 650 g жылдамдықта 5 минут бойы екі рет жуылды. Тромбоциттердің күйін бағалау үшін ағындық цитометрия қолданылды: жас тромбоциттер тиазол қызғылт сары бояуымен және GPIbα антиденелерімен анықталды. Тромбоциттердің десиалдануы RCA-1 лектинімен, ал фосфатидилсерин (PS) экспозициясы Annexin V байланысуы арқылы анықталды. Деректер FlowJo бағдарламасында талданды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ағындық цитометрия — сұйықтық ағынындағы жасушаларды талдау әдісі, ол жасуша бетіндегі ақуыздарды және олардың күйін жедел анықтауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"25-koekbauyr-kesindilerining-immunogistohimiyasy\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#25-koekbauyr-kesindilerining-immunogistohimiyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.5 Көкбауыр кесінділерінің иммуногистохимиясы&lt;/span&gt;&lt;/a&gt;2.5 Көкбауыр кесінділерінің иммуногистохимиясы&lt;/h4&gt;\n&lt;p&gt;Инфарктен кейін көкбауырлар алынып, парафинге қатырылды және Microm HM355 микротомы көмегімен 5 мкм қалыңдықтағы кесінділерге бөлінді. Гематоксилин және эозинмен боялғаннан кейін, әрбір көру аймағындағы мегакариоциттер саны есептелді.&lt;/p&gt;\n&lt;h4 id=\"bauyr-tinnen-sandykh-nakhty-uakhyttaghy-polimerazdy-tizbekti-reakciya-qrt-pcr\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#bauyr-tinnen-sandykh-nakhty-uakhyttaghy-polimerazdy-tizbekti-reakciya-qrt-pcr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бауыр тіннен сандық нақты уақыттағы полимеразды тізбекті реакция (qRT-PCR)&lt;/span&gt;&lt;/a&gt;Бауыр тіннен сандық нақты уақыттағы полимеразды тізбекті реакция (qRT-PCR)&lt;/h4&gt;\n&lt;p&gt;Tpo, Asgr1 (Clec4h1), Asgr2 (Clec4h2) және интерлейкин-6 рецепторының (Il6ra) гендерінің экспрессия деңгейін бағалау үшін миокард инфарктіне дейін, сондай-ақ инфарктен кейін 6 және 24 сағат өткен соң алынған бауырдың жалпы РНК үлгілері пайдаланылды. Бауыр тіні 500 мкл салқын Trizol реагентінде Precellys 24-Dual (Bertin, Майндағы Франкфурт, Германия) гомогенизаторы және Precellys Lysing Kit жиынтығы көмегімен 5000 айн/мин жылдамдықта 30 секунд ішінде ұсақталып гомогенизацияланды. Жалпы РНК-ны бөліп алу Trizol және хлороформ көмегімен экстракция әдісі арқылы жүзеге асырылды. Ол үшін бауыр лизатына 100 мкл хлороформ қосылып, 4°C температурада 18000 g жылдамдықпен 15 минут бойы центрифугаланды.&lt;/p&gt;\n&lt;p&gt;Жоғарғы сулы фаза жиналып, ДНҚ тұндыру үшін 100% этанолмен араластырылды. Үлгілер өндірушінің нұсқаулығына сәйкес RNAeasy Mini Kit (Qiagen, Хильден, Германия) жиынтығы арқылы тазартылды. Алынған жалпы РНК концентрациясы мен тазалығы Eppendorf BioPhotometer® D30 спектрофотометрі көмегімен өлшенді. КДНҚ синтездеу үшін Reverse Transcription Kit (InPromII Reverse Transcription System; Promega, Вальдорф, Германия) жиынтығымен бірге барлығы 200 нг РНК пайдаланылды. Кері транскрипциядан кейін Fast Sybr Green Master Mix (Thermo Fisher Scientific, Уолтем, АҚШ) көмегімен сандық ПТР амплификациясы орындалды. Мақсатты гендердің экспрессия деңгейі бақылау тобындағы сау тышқандардың Follistatin Like 1 (Fstl1) РНК деңгейіне қатысты нормаға келтірілді. Мәліметтерді талдау үшін ΔΔCT әдісі қолданылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;qRT-PCR әдісі ағзадағы белгілі бір гендердің белсенділігін нақты санмен өлшеуге мүмкіндік береді, бұл инфарктнен кейін бауыр жасушаларындағы өзгерістерді бағалауға көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"bauyr-tinin-western-blot-wb-aedisimen-taldau\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#bauyr-tinin-western-blot-wb-aedisimen-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бауыр тінін Western Blot (WB) әдісімен талдау&lt;/span&gt;&lt;/a&gt;Бауыр тінін Western Blot (WB) әдісімен талдау&lt;/h4&gt;\n&lt;p&gt;STAT3 ақуызы мен оның фосфорланған түрінің жалпы деңгейін анықтау үшін миокард инфарктіне дейін және кейін алынған бауыр лизаттарына Western Blot талдауы жүргізілді. Ол үшін Cell Signaling Technology (Дэнверс, АҚШ) компаниясының STAT3 (D3Z26) Rabbit mAb (№ 12640) және P-STAT3 (Y705) Rabbit mAb (№ 9145) антиденелері пайдаланылды. Бауыр тіні RIPA буферінде (150 мM NaCl, 50 мM Tris-Base, 0.1% SDS, 0.5% натрий дезоксихолаты, 1% TritonX-100, 1x протеаза тежегіштері, pH=8.0) Precellys 24-Dual гомогенизаторы көмегімен 5000 айн/мин жылдамдықта 30 секунд ішінде гомогенизацияланды.&lt;/p&gt;\n&lt;p&gt;Ақуыз концентрациясы анықталғаннан кейін үлгілер Laemmli қалпына келтіру буферінде 50 мкг/үлгі концентрацияда дайындалып, 95°C температурада 5 минут бойы денатурацияланды, SDS-полиакриламидті гельде бөлініп, нитроцеллюлозалық мембранаға (GE Healthcare, Херкулес, АҚШ) ауыстырылды. Барлық антиденелер Cell Signaling (Кембридж, Ұлыбритания) компаниясынан алынып, хаттамалар қатаң сақталды. Визуализация үшін мембраналар пероксидазамен коньюгацияланған ешкінің қоянға қарсы IgG (GE Healthcare, Чикаго, АҚШ) және Immobilon Western Chemiluminescent HRP Substrate ерітіндісімен инкубацияланды. GAPDH (14C10, № 2118, Cell Signaling Technology) ақуызы бақылау ретінде қызмет етті.&lt;/p&gt;\n&lt;h4 id=\"fermentpen-bajlanyskhan-immunosorbentti-taldau-elisa\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#fermentpen-bajlanyskhan-immunosorbentti-taldau-elisa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ферментпен байланысқан иммуносорбентті талдау (ELISA)&lt;/span&gt;&lt;/a&gt;Ферментпен байланысқан иммуносорбентті талдау (ELISA)&lt;/h4&gt;\n&lt;p&gt;Миокард инфарктінен кейінгі әр түрлі уақыт аралығында тышқандардың қан плазмасындағы IL-6 және TPO цитокиндерінің мөлшерін анықтау үшін гепарині бар қан 650 g жылдамдықта 10 минут бойы центрифугаланып, плазма бөліп алынды. Цитокин мөлшері R&amp;amp;D Systems компаниясының Mouse IL-6 DuoSet ELISA (DY406) және Mouse Thrombopoietin DuoSet ELISA (DY488) жиынтықтары арқылы өндірушінің нұсқаулығына сай өлшенді.&lt;/p&gt;\n&lt;h4 id=\"statistikalykh-taldau\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#statistikalykh-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистикалық талдау&lt;/span&gt;&lt;/a&gt;Статистикалық талдау&lt;/h4&gt;\n&lt;p&gt;Барлық тәжірибелер кемінде үш рет қайталанды, мұнда n ретінде жеке жануар алынды. Мәліметтер арифметикалық орташа мәндер мен орташа мәннің стандартты қателігі (SEM) түрінде көрсетілді. Статистикалық талдау GraphPad Prism 9.5.1 (GraphPad Software, Сан-Диего, АҚШ) бағдарламалық жасақтамасы арқылы жүзеге асырылды. Екі топ арасындағы статистикалық айырмашылықтарды бағалау үшін жұптастырылмаған Стьюденттің t-тесті немесе көптік t-тест қолданылды. Үш және одан көп топтарды салыстыру үшін Tukey, Sidak немесе Dunnett түзетулері бар бір факторлы немесе екі факторлы дисперсиялық талдау (ANOVA) орындалды. P &amp;lt; 0.05 мәні статистикалық маңызды деп қабылданды. Барлық графиктердегі жұлдызшалар мен ромбтар айтарлықтай айырмашылықтарды білдіреді (*, # p &amp;lt; 0.05; **, ## p &amp;lt; 0.01; ***, ### p &amp;lt; 0.001).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s-f3.jpg\" alt=\"3-сурет. Жедел тромбоцитопения И/Р зақымдануынан кейін мегакариопоэзге түрткі болады. Тышқандар LAD лигациясынан 24 саға\" /&gt;&lt;/p&gt;\n&lt;p&gt;*3-сурет. Жедел тромбоцитопения И/Р зақымдануынан кейін мегакариопоэзге түрткі болады. Тышқандар LAD лигациясынан 24 сағат бұрын антидене арқылы туындаған тромбоциттердің сарқылуына ұшырады. (A) Тышқандардың тұтас қанында анықталған И/Р зақымдануынан 6 сағат өткен соң тромбоциттер санын анықтау (n=10). (B) Тромбоциттері сарқылған және тиісті бақылау тышқандарында И/Р зақымдануынан 6 сағат өткен соң көкбауыр салмағының салыстырмалы коэффициенттерін анықтау (n=10). И/Р зақымдануынан кейін тромбоциттері сарқылған тышқандар мен тиісті бақылау топтарының IL-6 (C) және TPO (D) плазмалық деңгейлерін бағалау (n=9-10). (E) Тромбоциттері сарқылған және тиісті бақылау тышқандарының бүкіл бауыр тінінде И/Р зақымдануына дейін және кейін Tpo экспрессиясын реттеуге қатысатын әртүрлі рецепторлардың салыстырмалы гендік экспрессиясы талданды (n=4-5). (F) Бүкіл бауыр тіні И/Р зақымдануына дейін және кейін тромбоциттері сарқылған тышқандар мен тиісті бақылау топтарын қолдана отырып, көрсетілген уақыт нүктелерінде STAT3 фосфорлануына талданды (n=4). pSTAT3 мөлшерін анықтау (сол жақ панель) және pSTAT3, жалпы STAT3 пен GAPDH өкілдік Вестерн блоттары (оң жақ панель) көрсетілген. (G) Көкбауыр кесінділері дайындалып, әр FOV үшін мегакариоциттердің жалпы санын санау үшін H&amp;amp;E боялды (n=6). Деректер орташа ± SEM түрінде ұсынылған. Статистикалық талдаулар жұпталмаған Стьюдент t-тесті (A-D), жұпталмаған бірнеше t-тест (E) немесе Тьюкидің бірнеше салыстыру тесті бар екі бағытты ANOVA (F-G) арқылы жасалды. Жұлдызшалар сарқылу мен тиісті бақылаулар арасындағы статистикалық айырмашылықты көрсетеді, ал ромб бір топ ішіндегі МИ дейін немесе кейін әртүрлі уақыт нүктелері арасындағы айырмашылықтарды көрсетеді; *, # p &amp;lt; 0,05, **; ## p &amp;lt; 0,01; **&lt;em&gt;, ### p &amp;lt; 0,001. H&amp;amp;E = гематоксилин және эозин; FOV = көру өрісі.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s-f4.jpg\" alt=\"4-сурет. GPVI тапшылығы И/Р зақымдануынан кейінгі ерте кезеңде бауыр тінінде тромбопоэтин өндірілуіне немесе STAT3 актив\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет. GPVI тапшылығы И/Р зақымдануынан кейінгі ерте кезеңде бауыр тінінде тромбопоэтин өндірілуіне немесе STAT3 активациясына әсер етпейді. GPVI тапшылығы И/Р зақымдануынан кейін тромбоциттердің алмасуына айтарлықтай әсер етпейді. (A) Gp6+/+ және Gp6-/- тышқандарының плазмасындағы TPO бағалау 24 сағаттық И/Р зақымдануынан кейін (n=6). (B-E) И/Р зақымдануына дейін және кейін Gp6+/+ және Gp6-/- тышқандарының бүкіл бауыр тінінде Tpo экспрессиясын реттеуге қатысатын әртүрлі рецепторлардың салыстырмалы гендік экспрессиясы талданды (n=3-4). Asgr1 (B), Asgr2 (C), IL6r немесе TPO (E) салыстырмалы гендік экспрессиясында ешқандай айырмашылықтар анықталған жоқ. (F) STAT3 фосфорлануы И/Р зақымдануына дейін және кейін көрсетілген уақыт нүктелерінде Gp6+/+ және Gp6-/- тышқандарының бүкіл бауыр тінінде талданды. pSTAT3, жалпы STAT3 пен GAPDH өкілдік Вестерн блоттары (сол жақ панель) және STAT3 фосфорлануын сандық анықтау (оң жақ панель) көрсетілген (n=3-8). Деректер орташа ± SEM түрінде ұсынылған. Статистикалық талдаулар жұпталмаған Стьюдент t-тесті (A) немесе Тьюкидің бірнеше салыстыру тесті бар екі бағытты ANOVA (B-F) арқылы жасалды.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"kesteler\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#kesteler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кестелер&lt;/span&gt;&lt;/a&gt;Кестелер&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 1.&lt;/strong&gt; ПТР праймерлері&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Ген&lt;/th&gt;\n&lt;th&gt;Тікелей праймер&lt;/th&gt;\n&lt;th&gt;Кері праймер&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Tpo&lt;/td&gt;\n&lt;td&gt;forward 5´CACAGCTGTCCCAAGCAGTA 3´&lt;/td&gt;\n&lt;td&gt;reverse 5´CATTCACAGGTCCGTGTGTC 3`&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Asgr1 (Clec4h1)&lt;/td&gt;\n&lt;td&gt;forward 5´ACGTGAAGCAGTTAGTGTCTG 3´&lt;/td&gt;\n&lt;td&gt;reverse 5´CCTTCATACTCCACCCAGTTG 3´&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Asgr1 (Clec4h2)&lt;/td&gt;\n&lt;td&gt;forward 5´GCTCAGTGGCGATGATG 3´&lt;/td&gt;\n&lt;td&gt;reverse 5´AGAGGCGCTGAGGAAAGG 3´&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Il6ra&lt;/td&gt;\n&lt;td&gt;forward 5´ACCTTCGGCTTCAAAATGCCAGTT 3´&lt;/td&gt;\n&lt;td&gt;reverse 5´CACCTAGAAAACCCTGCTGCGA 3´&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Fstl1&lt;/td&gt;\n&lt;td&gt;forward 5´AGC CCA CGT GCC TCT GCA TT 3´&lt;/td&gt;\n&lt;td&gt;reverse 5´GGC TGG CAG ATG GAC TCG CA 3´&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;инфарктен&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;кейінгі&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тромбоцит&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;реттелуі&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тышқандарда&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ишемияны&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;модельдеу&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жүрек-бауыр&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;өсінің ашылуы&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;терапия үшін&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жаңа нысаналар&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;stron
