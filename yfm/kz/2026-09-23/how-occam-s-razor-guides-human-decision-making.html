        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"220\" cy=\"68\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"520\" cy=\"280\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Ми қарапайым түсіндірмелерді&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;қалай таңдайды&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-f1.jpg\" alt=\"Сурет 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Белсіздік жағдайында шешім қабылдаған кезде миымыз күрделі емес, қарапайым нұсқаларды таңдайды. Жаңа зерттеу бұл жай әдет емес, нақты математикалық есептеу екенін көрсетті. Адамдардың мінез-құлқы кездейсоқ деректерге тым бейімделіп кетуден сақтайтын статистикалық модель таңдау теориясына сәйкес келеді. Ал жасанды нейрондық желілер мұны әрдайым қайталай бермейді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Адамдар шулы деректерде қарапайым түсіндірмелерді қалайды&lt;/li&gt;\n&lt;li&gt;Қатысушылардың таңдауы байестік модельдерге сәйкес келеді&lt;/li&gt;\n&lt;li&gt;Нейрожелілер бұл қарапайымдылық бейімділігін көрсетпейді&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеушілер адамдардың шулы әрі толық емес деректер негізінде қалай шешім қабылдайтынын талдады. Тәжірибе барысында қатысушылар он нүкте белгілі бір фигурамен жасалғанының ықтималдығын бағалады. Авторлар модель күрделілігіне берілетін айыппұлдарды өлшеу үшін Фишер ақпаратын жақындату әдісін қолданды. Адамдардың таңдауы барлық ықтимал жасырын себептерді біріктіру ережелеріне дәл сәйкес келетіні анықталды.&lt;/p&gt;\n&lt;p&gt;Мұндай біріктіру кез келген шуға үйлесе алатын тым икемді түсіндірмелерді шектейді. Адамдар бұл қарапайымдылыққа ұмтылысты тиімсіз жағдайларда да сақтайтыны байқалды, бірақ кейбір жасанды нейрожелілерде бұл қасиет жоқ. Бұл статистикалық модельдеу қағидаттарының адам танымы үшін маңызды екенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жұмыс басқарылатын мінез-құлық эксперименттеріне негізделген және мидың нейрондық белсенділігін тікелей зерттемейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Оккам ұстарасы — басқа жағдайлар бірдей болғанда, күрделі түсіндірулерге қарағанда қарапайым түсіндірулерге басымдық беру керек деген қағидат. Бұл қағидат адамның шешім қабылдауын басқарады деп есептеледі, бірақ бұл басқарудың табиғаты әлі белгісіз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Алдын ала тіркелген мінез-құлық эксперименттері адамдардың анық емес деректер үшін екі балама түсіндірудің ең қарапайымын сандық тұрғыдан абзал көретінін көрсетті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз бұл жерде алдын ала тіркелген мінез-құлық эксперименттерін қолдана отырып, адамдардың анық емес деректердің екі балама түсіндіруінің ішіндегі ең қарапайымын таңдауға бейім екенін көрсеттік. Бұл артық көрулер шамадан тыс икемділікті жазалайтын ресми модель таңдау теорияларының болжамдарымен сандық түрде сәйкес келеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модельді таңдау — шулы деректерге шамадан тыс бейімделіп қалудың алдын алу үшін модельдің дәлдігі мен оның қарапайымдылығы арасындағы теңгерімді табуға бағытталған статистикалық тәсіл.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз сондай-ақ бұл қарапайымдылыққа ұмтылу адамдарда сақталатынын, бірақ кейбір жасанды нейрондық желілерде, тіпті олар бейімделмеген жағдайларда да жоқ екенін көрсетеміз. Біздің нәтижелеріміз статистикалық модельді таңдаудың іргелі ұғымдары, соның ішінде шулы деректерге шамадан тыс қалыптасып қалудың алдын алу мақсатында ықтимал жасырын себептер бойынша интеграциялау, адамның шешім қабылдауында орталық рөл атқаруы мүмкін екенін білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу адамдардың қатысуымен жасалған мінез-құлық тестілеріне және жасанды желілермен салыстыруға негізделген; нәтижелер математикалық модельдермен тек корреляцияны көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Шын әлемде шешім қабылдаған кезде бізге көбінесе шулы және сирек деректер үшін бірнеше орынды түсіндірудің арасынан таңдау жасауға тура келеді. Бәсекелес түсіндірулерді бағалаған кезде Оккам ұстарасы біз тек олардың бақыланған деректерді қаншалықты жақсы түсіндіретінін ғана емес, сонымен қатар әлі бақыланмаған баламалы және ықтималды түрде қатысы жоқ деректерді сипаттаудағы олардың әлеуетті шамадан тыс икемділігін де ескеруimiz керектігін айтады (Baker, 2022) (мысалы, «мұны елес жасады!»; 1a, b-сурет). Мұндай қарапайымдылықты ұстану психикалық қызметтің ұйымдастырушы принципі ретінде бұрыннан ұсынылған (Feldman, 2016), мысалы, гештальт-психологиядағы ертеректегі Prägnanz тұжырымдамасы (Koffka, 2014; Wagemans et al., 2012), көру қабілетіне арналған бірқатар «минималды принциптер» (Hatfield, 1985) және танымдағы деректерді сығуға орталық рөл беретін теориялар (Chater, 1999; Chater &amp;amp; Vitányi, 2003). Сондай-ақ қарапайымдылық түсіндірмелі құндылықтың кеңірек теориялары шеңберінде түсіндірменің артықшылықтарын бағалауға көмектесетін негізгі ерекшеліктердің бірі ретінде ұсынылды (Wojtowicz &amp;amp; DeDeo, 2020).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қарапайымдылыққа басымдық беру (Оккам ұстарасы) — шулы деректерді бағалау және бәсекелес түсіндірулерді таңдау кезіндегі адам танымының іргелі ұйымдастырушы принципі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Көптеген мінез-құлық зерттеулері шешім қабылдаушылардың перцептивті бағалауды, көзді қайта құруды және себеп-салдарды түсіндіруді қоса алғанда, әртүрлі тапсырмаларды орындау кезінде қарапайымдылыққа басымдық беретінін көрсетті (Chater, 1999; Genewein &amp;amp; Braun, 2014; Gershman &amp;amp; Niv, 2013; Griffiths &amp;amp; Tenenbaum, 2005; Johnson et al., 2014; Körding et al., 2007; Little &amp;amp; Shiffrin, 2009; Lombrozo, 2007; Pothos &amp;amp; Chater, 2002). Бұл зерттеулер осындай жағдайларда қалаулы болатын (немесе баламалы түрде ұнамсыз «күрделілік») «қарапайымдылықтың» неден тұратыны туралы бірнеше формальды анықтамаларды ұсынды, соның ішінде түсіндіруде келтірілген бақыланбайтын немесе түсіндірілмеген себептердің саны (Pacer &amp;amp; Lombrozo, 2017), сипаттама ұзындығы және Колмогоров күрделілігі (Chater, 1999), немесе байестік выводта маргиналды ықтималдықтарды есептеуден туындайтын статистикалық күрделілік (Griffiths &amp;amp; Tenenbaum, 2005; Körding et al., 2007). Байестік түсіндіруге сәйкес, кейбір жағдайларда қарапайымдылыққа деген бұл артықшылықтар көбірек ықтималды дәлелдер берілген кезде әлсірейді, бұл қарапайым түсіндірулерге көбірек салмақ беретін байестік априорлықты көрсетеді деп ұсынылды (Bonawitz &amp;amp; Lombrozo, 2012; Lombrozo, 2007; Pacer &amp;amp; Lombrozo, 2017). Адамның басқа пікірлері икемді түсіндірулерге айыппұл салатын байестік шеңбермен үйлесімді екендігі көрсетілді, мұнда бұл икемділік оның өлшемділігімен емес, параметрлер кеңістігінің өлшемімен басқарылады (Blanchard et al., 2018). Дегенмен, қарапайымдылыққа деген мұндай артықшылықтардың теориялық күрделілік ұғымдарымен белгіленетін қарапайымдылық пен түсіндірудің сәйкестік сапасы арасындағы нақты ымыраға сан жағынан қалай қатысты екені белгісіз күйінде қалып отыр.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Байестік вывод — жаңа деректердің келіп түсуіне қарай гипотезаның ықтималдығын жаңартып отыратын, модельдің қарапайымдылығы мен дәлдігі арасындағы тепе-теңдікті сақтауға мүмкіндік беретін статистикалық әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Осы зерттеудің мақсаты адамның перцептивті шешім қабылдауындағы қарапайымдылыққа бейімділіктің теориялық негізделген, сандық сипаттамасын жасау болды. Ол үшін біз бұл шешімдерді статистикалық модельді таңдау проблемасы ретінде формализациялайтын тапсырмалар жиынтығын әзірледік. Бұл тәсіл бізге бір модельді (яғни бақыланатын деректердің әлеуетті көзін) екіншісіне қарағанда көбірек (немесе азырақ) күрделі ететін және осылайша шамадан тыс икемділікке байланысты олардың сәйкестік сапасына болжамды әсеріне қарсы тұру үшін арнайы айыппұлдарды талап ететін нақты ерекшеліктерді анықтауға мүмкіндік берді (Balasubramanian, 1997). Ең бастысы, бұл айыппұлдар деректерге байланысты болуы мүмкін және сондықтан жалпы қарапайымдылыққа деген артықшылық арқылы толығымен еліктей алмайды (Blanchard et al., 2018; Lombrozo, 2007). Төменде егжей-тегжейлі сипаттағанымыздай, бұл тәсіл бізге Оккам ұстарасы жай ғана артықшылық емес, керісінше икемді түсіндірулерді шулы деректермен сәйкестендіруге тырысқанда туындайтын мәселелерге қарсы тұру үшін ықтимал, латентті себептерді біріктіретін негізгі шешім қабылдау процестерінің көрінісі болып табылатынын қолдайтын қарапайымдылыққа бейімділіктің нақты формаларын анықтауға мүмкіндік берді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бұл зерттеу мінез-құлықтық шешім қабылдау модельдеріне бағытталған және оның тұжырымдары кеңірек перцептивті тапсырмалар сыныптарында қосымша тексеруді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"adamdar-teoriyalykh-turghydan-negizdelgen-kharapajymdylykh-artykhshylykhtaryn-koersetedi\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#adamdar-teoriyalykh-turghydan-negizdelgen-kharapajymdylykh-artykhshylykhtaryn-koersetedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Адамдар теориялық тұрғыдан негізделген қарапайымдылық артықшылықтарын көрсетеді&lt;/span&gt;&lt;/a&gt;Адамдар теориялық тұрғыдан негізделген қарапайымдылық артықшылықтарын көрсетеді&lt;/h4&gt;\n&lt;p&gt;FIA күрделілік мүшелерін адамдар да, жасанды шешім қабылдаушылар да көрсететін әлеуетті артықшылықтармен байланыстыру үшін біз қарапайым шешім қабылдау тапсырмасын әзірледік. Әрбір сынақ үшін N = 10 бір мезгілде ұсынылған, шулы бақылаулар (1e-суреттегі қызыл нүктелер) екі ықтимал пішіндердің бірінің ішінде бір жерде орталықтандырылған 2 өлшемді қалыпты («генеративті») бөліністен кездейсоқ таңдап алынды (1e-суреттегі қара пішіндер). Деректерді тудыратын пішіннің сәйкестігі (жоғарғы немесе төменгі) бірдей ықтималдықпен кездейсоқ түрде таңдалды. Сол сияқты, таңдалған пішін ішіндегі қалыпты бөлініс орталығының орналасуы Джеффрис приориін пайдалана отырып, модель параметрлеуіне тәуелді болмайтын тәсілмен кездейсоқ біркелкі таңдалды (Jaynes, 2003). Бақылауларды ескере отырып, шешім қабылдаушы генеративті бөліністің орталығын қамту ықтималдығы жоғарырақ пішінді (модельді) таңдады. Біз тапсырманың төрт нұсқасын қолдандық, олардың әрқайсысы Байестік модельді таңдауда жазаланатын анық геометриялық ерекшеліктердің бірін бірінші кезекте зерттеуге арналған еді. Басқаша айтқанда, әрбір нұсқа үшін Байестік бақылаушының әрбір жұптағы күрделірек баламадан алыс белгілі бір сандық артықшылыққа ие болуы күтіледі (1c және d суреттері). Осы тапсырма үшін FIA дәл Байестік апостериорлық бөліністің жақсы жақындашуын қамтамасыз етті (Қосымша ақпараттың B.1 бөлімі). Сәйкесінше, Байестік бақылаушы сияқты жасырын себептерді көбірек интеграциялаған модельденген бақылаушылар FIA-ға ұқсас артып келе жатқан ығысуларды көрсетті. Бұл ығысулар артып келе жатқан сенсорлық және/немесе таңдау шуының әсерлерінен ерекшеленді (және олармен азайтылды) (Қосымша ақпараттың B.7.1 бөлімі және B.10-сурет).&lt;/p&gt;\n&lt;p&gt;Адамдардың қатысуымен жүргізілген зерттеулеріміз үшін біз тапсырманы жүзеге асыру үшін Pavlovia онлайн зерттеу платформасын және қатысушыларды іріктеу және сынақтан өткізу үшін Prolific-ті қолдандық. Алдын ала тіркелген тәсілдерімізге сүйене отырып (Piasini et al., 2020, 2021), 1e-суретте көрсетілген тапсырманың төрт бөлек нұсқасының бірін орындаған төрт топқа бөлінген 202 қатысушыдан деректер жинадық (әр топта шамамен 50 қатысушы болды). Екі гүлзардың бірінде орналасқан гүл тұқымдарының ұқсастығын пайдаланатын нұсқауларды ұсындық, бұл екі модель отбасының бірінен шыққан параметрлік модельдің белгілі бір данасы тудырған шулы деректердің негізгі тұжырымдамаларын интуитивті түрде қалыптастыру үшін қамтамасыз етілді. Қатысушылардың әр сессия барысында айқын емес немесе айқын кері байланыс негізінде гүлзарларды оңтайлырақ (яғни қарапайымдылықты артық көретін) таңдауды үйрену ықтималдығын барынша азайту үшін біз: 1) FIA сәйкес модель күрделілігін жазалаған идеальды бақылаушылар мен тек модель ықтималдығын ғана пайдаланған модельденген бақылаушылар арасындағы өнімділік айырмашылығы шамамен 1% болатын жағдайларды қолдандық (тапсырма түріне байланысты; 1e-сурет, ішкі суреттер), бұл бүкіл эксперимент барысында шамамен 5 қосымша дұрыс сынаққа тең келеді; және 2) әрбір сынақта емес, тек 100 сынақтан тұратын әр блок соңында ғана кері байланыс ұсындық.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эксперимент қатысушылары белсіздік жағдайларында ең қарапайым баламаларды жиірек таңдай отырып, FIA бойынша геометриялық күрделіліктің барлық төрт түріне сезімталдық көрсетті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қарапайым мінез-құлық жиынтықтары екі модельдің ықтималдығы ұқсас болған анық емес сынақтар үшін (атап айтқанда, деректер екі модельден де бірдей қашықтықта орналасқан, бұл Оккам ұстарасының классикалық тұжырымының «барлық басқа жағдайлар тең болғанда» шартқа сәйкес келеді) қатысушылар ең қарапайым баламаны жиірек таңдағанын көрсетеді (3a-суреттегі көк қисықтардан жоғары созылған қызғылт аймақ). Бұл тенденцияны барлық ынталандыру жағдайларында, соның ішінде бір модельдің басқасына қарағанда жоғарырақ ықтималдығы болған кезде де тексеру үшін және әр қатысушының таңдауына модель ықтималдығы мен FIA белгілерінің әрқайсысы қаншалықты әсер еткенін сандық түрде бағалау үшін біз деректерімізді иерархиялық (Байестік) логистикалық регрессия тәсілін қолдана отырып талдадық (A.6 әдістер бөлімін қараңыз). Біз әр қатысушының әр FIA мүшесіне сезімталдығын олардың ықтималдық сезімталдығына қатысты қалыптасқан шама ретінде анықтадық (яғни берілген FIA мүшесімен байланысты логистикалық коэффициентті ықтималдықпен байланысты логистикалық коэффициентке бөлу арқылы). Бұл талдау қатысушылардың барлық төрт модель күрделілігі формаларына сезімтал екенін көрсетті (3-сурет). Атап айтқанда, бағаланған қалыптасқан популяция деңгейіндегі сезімталдық (апостериорлық орташа ± стандартты ауытқу, мұнда нөл сезімталдықтың жоқтығын, ал бір Байес-оңтайлы сезімталдықты білдіреді) өлшем үшін 4.66 ± 0.96, шекара үшін 1.12 ± 0.10, көлем үшін 0.23 ± 0.12 және сенімділік үшін 2.21 ± 0.12 құрады (алдын ала тіркелген жоспарымызға сәйкес, біз мұнда және негізгі мәтін бойында Байестік тәсілдерді қолдана отырып параметрлерді бағалауға баса назар аударамыз, ал қосымша нөлдік гипотезаны маңыздылыққа тексеруді B.6 Қосымша ақпарат бөлімінде және B.8 кестесінде береміз).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Байестік модельді таңдау және Акаике ақпараттық критерийі (AIC) артық параметрлер мен қисық шешім шекараларын жазалау арқылы модельдердің күрделілігін математикалық тұрғыдан бағалауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз бұл талдауларды формалды модель салыстыруларымен (WAIC; B.6.1 Қосымша ақпарат бөлімін және B.6 және B.7 кестелерін қараңыз) толықтырдық, олар қатысушылардың мінез-құлқы тек модель мен деректер арасындағы минималды қашықтыққа ғана сүйенбей (яғни максималды ықтималдық шешімі), Байестік модельді таңдау теориясымен анықталатын геометриялық айыппұлдарды ескере отырып жақсырақ сипатталатынын растады. Олардың шешімдері сонымен қатар жасырын себептерді интеграциялауға бейім процестермен үйлесімді болды (және сенсорлық шудың орташа деңгейлерін және төмен таңдау шуын көрсетті; B.7 Қосымша ақпарат бөлімі және B.11 және B.12 суреттері). Жалпы алғанда, біздің талдауларымыз адамдардың модель күрделілігін сипаттайтын Байестік модельді таңдаудағы геометриялық белгілерге сезімталдық ретінде көрінетін Оккам ұстарасын тудыратын тәсілмен жасырын себептерді интеграциялауға бейім екенін көрсетеді.&lt;/p&gt;\n&lt;p&gt;Қатысушылар сонымен қатар өнімділікте оңтайлы және оңтайлы емес мәндерді қамтитын әр FIA мүшесіне сезімталдық диапазон вариацияларын қамтитын айтарлықтай жеке вариабельділікті көрсетті. Бұл вариабельділік қатысушы деңгейіндегі сезімталдық бағалауларымен байланысты белсіздікпен салыстырғанда үлкен болды (B.4 Қосымша ақпарат) және өнімділікке тиісті түрде бапталған (яғни Байес-оңтайлыға жақын) қарапайымдылық артықшылықтарының пайдалылығын көрсететін тәсілмен әсер етті: дәлдік теориялық болжамдардан алысырақ FIA сезімталдығы бар қатысушылар үшін төмендеу тенденциясына ие болды (2c-сурет; дәлдік пен /β - 1/ арасындағы Спирмен rho коэффициентінің апостериорлық орташа ± стандартты ауытқуы, мұнда β — сезімталдық: өлшем, -0.69 ± 0.05; шекара, -0.21 ± 0.11; көлем, -0.10 ± 0.10; сенімділік, -0.54 ± 0.10). Көптеген қатысушылар көрсеткен оңтайлы емес сезімталдық тапсырмаға қатысудың жоқтығынан туындамаған сияқты, өйткені FIA сезімталдығы оңай сынақтардағы қателермен корреляцияланбады (A.6.1 әдістер бөлімінде толық сипатталған кеңейтілген регрессиялық модельмен бағаланған жіберіп алу жиілігі мен оңтайлы сезімталдықтан абсолютті айырмашылық арасындағы Спирмен rho коэффициентінің апостериорлық орташа ± стандартты ауытқуы: өлшем, 0.08 ± 0.12; шекара, 0.15 ± 0.12; көлем, -0.04 ± 0.13; сенімділік, 0.15 ± 0.14; B.5 Қосымша ақпарат бөлімін қараңыз). Сол сияқты, оңтайлы емес FIA сезімталдығы шекара (rho = -0.13 ± 0.11) және көлем (rho = -0.06 ± 0.11) мүшелері үшін әлсізірек ықтималдық сезімталдығымен корреляцияланбады, бірақ өлшем (-0.35 ± 0.07) және сенімділік (-0.56 ± 0.10) мүшелерімен күшірек, теріс қатынастар осы жағдайлардағы экстремалды және вариабельді қарапайымдылық артықшылықтары (және орташа алғанда төменірек өнімділік; 2c-суретті қараңыз) тапсырманың сол нұсқаларын орындаудағы жалпы қиындықты көрсеткенін болжайды.&lt;/p&gt;\n&lt;h4 id=\"zhasandy-nejrondykh-zheliler-ongtajly-kharapajymdylykh-artykhshylykhtaryn-menggeredi\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#zhasandy-nejrondykh-zheliler-ongtajly-kharapajymdylykh-artykhshylykhtaryn-menggeredi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жасанды нейрондық желілер оңтайлы қарапайымдылық артықшылықтарын меңгереді&lt;/span&gt;&lt;/a&gt;Жасанды нейрондық желілер оңтайлы қарапайымдылық артықшылықтарын меңгереді&lt;/h4&gt;\n&lt;p&gt;Біздің адам қатысушыларымыз көрсететін қарапайымдылық артықшылықтарының оңтайлылығын, өзгермелілігін және жалпылығын жақсырақ түсіну үшін біз олардың нәтижелерін осы тапсырманы орындауды оңтайландыруға үйретілген жасанды нейрондық желілердің (ANN) нәтижелерімен салыстырдық. Біз жоғарыда сипатталған тапсырмаға қолданылатын пішінде статистикалық модельді таңдауды орындау үшін әзірлеген жаңа ANN архитектурасын қолдандық (4a, b-сурет). Әрбір әрекетте желі кіріс ретінде салыстырылатын модельдерді білдіретін екі кескінді және сол әрекеттегі бақылауларды білдіретін координаттар жиынтығын алды. Желінің шығысы softmax векторы ретінде кодталған екі модель арасындағы шешім болды. Біз ANN-нің 50 данасын талдадық, олар тек салмақтардың кездейсоқ инициялизациясымен және оқыту кезінде көрген мысалдарымен ерекшеленді, бұнда адам қатысушылары үшін қолданылған логистикалық регрессия тәсілін қолдандық.&lt;/p&gt;\n&lt;p&gt;ANN келесідей жобаланған (толығырақ әдістерді қараңыз). Кіріс кезеңі екі алдын ала үйретілген VGG16 конволюциялық нейрондық желілерінен (CNN) тұрды, олардың әрқайсысы қарастырылып отырған екі модельдің бірінің бейнелік көрінісін қабылдады. VGG адамның көру жүйесімен салыстыру үшін жиі эталон ретінде қабылданатын танымал архитектура ретінде таңдалды. CNN желілері салмақтары алдын ала үйретілген мәндерінде сақталған конволюциялық қабаттар стекінен, содан кейін оқыту кезінде өзгеруі мүмкін үш толық байланысқан қабаттан тұрды. CNN шығыстары сызықтық, түзетілген сызықтық (ReLU) және пакеттік нормалау қабаттарынан тұратын көп қабатты перцептронға (MLP) берілді. Содан кейін MLP шығыстары біріктіріліп, эквивариантты MLP-ге берілді, бұл арнайы параметрлерді бөлісу схемасы арқылы екі модельдің позициялары ауыстырылған кезде желі шығысының эквиварианттылығын қамтамасыз етеді. Желі сонымен қатар әрбір модельге шартты түрде деректерді генерациялау процесін қайталауға ұмтылған және сондықтан жоғарыдағы толық байланысқан қабаттарды тапсырмаға қатысты белгілерді қамтитын модельдік көріністерді үйренуге итермелеген екі шартты вариациялық автокодтаушы (C-VAE) құрылымдарын қамтыды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оқытылған ANN-дер дәлдік бойынша адамдардан асып түсті және теориялық тұрғыдан оңтайлы мәндерге жақын қарапайымдылық артықшылықтарын көрсетті, олардың ішкі өзгермелілігі адамдікінен айтарлықтай төмен болды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Оқытудан кейін ANN-дер тапсырманы адам қатысушыларына қарағанда айтарлықтай жақсы орындады, жалпы дәлдік жоғары болды, соның ішінде ықтималдыққа қатысты жоғары сезімталдық (SN-сурет) және теориялық тұрғыдан оңтайлы мәндерге дәлірек сәйкес келетін қарапайымдылық артықшылықтары (4c, d-сурет). Бұл қарапайымдылық артықшылықтары FIA-жуықтау емес, нақты Байес моделінің постериорын қолданатын симуляцияланған бақылаушылардан күтілетіндерге жақын болды, бұл FIA нақты Байес постериорына кемелсіз жуықтауды қамтамасыз ететінімен сәйкес келеді. Бұл қарапайымдылық артықшылықтары әртүрлі желілер бойынша көлемі жағынан сәл ерекшеленді, бірақ адам қатысушыларынан айырмашылығы, бұл өзгермелілік салыстырмалы түрде аз болды (3c және 4d-суреттердегі мәндер диапазондарын салыстырыңыз, әртүрлі x-осі шкалаларында салынған) және бұл желінің субоптималды мінез-құлқының белгісі емес еді, өйткені ол әрбір шарт үшін жалпы жоғары дәлдік көрсеткіштеріндегі айырмашылықтармен жүйелі түрде байланысты емес еді (4d-сурет; дәлдік пен /β − 1/ арасындағы Спирмен rho-ның постериорлық орташа мәні ± ст. ауытқу, мұнда β - сезімталдық: өлшемділік, -0.14 ± 0.10; шекара, 0.08 ± 0.11; көлем, -0.12 ± 0.11; тұрақтылық, -0.08 ± 0.11).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тапсырманың стохастикалық табиғаты артықшылықтардың өзгермелілігіне белгілі бір үлес қосқанымен, ол адамдарда байқалатын субоптималдылықты түсіндіре алмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл нәтижелер тапсырманың стохастикалық табиғаты орындау дәлдігін оңтайландыру үшін қарқынды оқытудан кейін де қарапайымдылық бейімділіктерінде белгілі бір өзгермелілікті тудыратынын білдіреді, бірақ өзгермеліліктің бұл көзі адам қатысушылары көрсеткен сезімталдық (және субоптималдылық) диапазонын өздігінен түсіндіре алмайды.&lt;/p&gt;\n&lt;h4 id=\"adamdar,-snt-dan-zhasandy-nejrondykh-zheliler-ajyrmashylyghy,-suboptimaldy-kharapajymdylykhkha-degen-artykhshylykhty-sakhtajdy\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#adamdar,-snt-dan-zhasandy-nejrondykh-zheliler-ajyrmashylyghy,-suboptimaldy-kharapajymdylykhkha-degen-artykhshylykhty-sakhtajdy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Адамдар, СНТ-дан (жасанды нейрондық желілер) айырмашылығы, субоптималды қарапайымдылыққа деген артықшылықты сақтайды&lt;/span&gt;&lt;/a&gt;Адамдар, СНТ-дан (жасанды нейрондық желілер) айырмашылығы, субоптималды қарапайымдылыққа деген артықшылықты сақтайды&lt;/h4&gt;\n&lt;p&gt;Біздің нәтижелеріміз, сонымен қатар қатысушыларға тапсырманы орындау барысында әрбір әрекет үшін кері байланыс бермегенімізбен бірге, біз өлшеген адамдардың қарапайымдылыққа деген артықшылықтары жай ғана осы тапсырма шарттары үшін үйретілген оңтайландырулар емес, керісінше, белгісіздік жағдайында шешім қабылдауымыздың тереңірек (және өзгермелі) бөлігі екенін көрсетеді. Алайда, біз әрбір қатысушыға байестік пайымдауды еске түсіретін нұсқаулар (Әдістерді қараңыз) және тест сессиясына дейін кері байланысы бар қысқаша оқу жиынтығын ұсынғандықтан, біз тек 3-суретте келтірілген деректерге сүйене отырып, адам қатысушылардан өлшенген қарапайымдылық артықшылықтарының кем дегенде кейбір аспектілері осы нақты нұсқаулар мен оқыту шарттарына байланысты екенін жоққа шығара алмаймыз. Сондықтан біз бұл мүмкіндікті жоққа шығару үшін екінші экспериментті өткіздік.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Адамдар нұсқаулардан тәуелсіз қарапайымдылыққа тұрақты бейімділікті көрсетеді, ал СНТ оқыту шарттарына бейімделеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл эксперимент үшін біз жоғарыдағыдай тапсырма нұсқаларын қолдандық, бірақ қатысушыларды максималды ықтималдық моделін таңдауға итермелеу үшін арналған басқа нұсқаулар мен оқыту жиынтығын қолдандық (яғни, жасырын себептер бойынша интеграция жасамау, керісінше, бақыланатын деректерге ең жақсы сәйкес келетін жалғыз себепті қарастыру), осылайша модельдің күрделілігін ескермедік. Атап айтқанда, визуалды белгілер бастапқы эксперименттегідей болды, бірақ қатысушылардан экрандағы екі пішіннің қайсысы нүктелер бұлтының масса орталығына жақынырақ екенін хабарлау сұралды. Біз осы «максималды ықтималдық» тапсырмасы үшін жалдаған қатысушылардың бастапқы «генеративті» тапсырмаға қатыспағанына көз жеткіздік. Біз қайтадан эксперимент пен талдау үшін алдын ала тіркелген жоспарды ұстандық және 201 қатысушыдан деректер жинадық, олар әрқайсысы ~50 адамнан тұратын төрт топқа бөлінді. Сондай-ақ, біз СНТ-ны осы тапсырма нұсқасында оқыттық және сынадық, мұнда дұрыс жауап ретінде максималды ықтималдық шешімін қолдандық.&lt;/p&gt;\n&lt;p&gt;Нұсқаулар мен оқытудағы бұл үлкен айырмашылыққа қарамастан, адам қатысушылар генеративті және максималды ықтималдық тапсырмаларында ұқсас қарапайымдылық артықшылықтарын көрсетті, бұл адамдарда тиісті нұсқауларсыз немесе ынталандырусыз да қарапайымдылыққа деген жалпы бейімділік бар екенін көрсетеді (5-сурет, сол жақта). Атап айтқанда, кейбір сандық айырмашылықтарға қарамастан, салыстырмалы сезімталдық таралуы екі тапсырма үшін де бірдей негізгі өрнектерді көрсетті, мұнда салыстырмалы сезімталдық көлемнен (максималды ықтималдық тапсырмасы үшін 0,19 ± 0,08; жоғарыдағы мәндермен салыстырыңыз) шекараға (0,89 ± 0,10), беріктікке (2,27 ± 0,15) және өлшемділікке (2,29 ± 0,41) қарай жалпы өсу байқалды. Адам деректері мен шынайы генеративті тапсырмада оқытылған СНТ-дан айырмашылығы, максималды ықтималдық тапсырмасында модель күрделілігіне қатысты СНТ сезімталдығы барлық төрт термин үшін нөлге жақын болды (5-сурет, оң жақта).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;СНТ (жасанды нейрондық желілер) — деректер негізінде тапсырмаларды шешу үшін оқытылатын математикалық модельдер; бұл контексте олар адам ойлауымен салыстырылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Адамдар мен СНТ осы тапсырмалар үшін шешім қабылдау мінез-құлқын басқаруда қарапайымдылық бейімділіктерін қалай қолданғанын және олардың өнімділікке әсерін қорытындылау үшін 6-суретте біз сынаған әрбір шарттар жиынтығы үшін жалпы дәлдік көрсетілген. Атап айтқанда, әрбір қатысушы немесе СНТ, тапсырма конфигурациясы және нұсқаулар жиынтығы үшін біз генеративті тапсырма (яғни, теориялық тұрғыдан оңтайлы жұмыс қарапайымдылық бейімділіктеріне байланысты болатын) және максималды ықтималдық тапсырмасы (яғни, теориялық тұрғыдан оңтайлы жұмыс қарапайымдылық бейімділіктеріне байланысты болмайтын) бойынша дұрыс жауаптар пайызын есептедік. Максималды ықтималдық шешімдері детерминистік болғандықтан (олар тек деректер орталығы қай модельге жақынырақ екеніне байланысты және сондықтан тамаша жұмыс істеуге әкелетін оңтайлы, нақты шешім шекарасы бар) және генеративті шешімдер олай емес (олар ықтималдық және бейімділік терминдеріне ықтималдық тұрғыдан байланысты, сондықтан тамаша нәтижеге жету әдетте мүмкін емес), біріншісінде жұмыс екіншісіне қарағанда жоғары болады деп күтіледі. Сәйкесінше, СНТ да, (азырақ дәрежеде) адамдар да максималды ықтималдық шешімдеріне қатысты бағаланғанда жақсырақ жұмыс істеуге бейім болды. Сонымен қатар, СНТ берілген тапсырма шарттарына оңтайландыруға сәйкес келетін мінез-құлықты көрсетті: максималды ықтималдық шешімдерін табуға оқытылған желілер максималды ықтималдық тапсырмасы үшін генеративті шешімдерді табуға оқытылған желілерден жақсырақ жұмыс істеді, ал генеративті шешімдерді табуға оқытылған желілер генеративті тапсырма үшін максималды ықтималдық шешімдерін табуға оқытылған желілерден жақсырақ жұмыс істеді. Керісінше, адамдар тапсырма шарттарына қарамастан, барлық жағдайда байестік қарапайымдылық бейімділіктерін қолданып, ұқсас стратегияларды қабылдауға бейім болды. Қысқаша айтқанда, СНТ тек оқытылған кезде ғана қарапайымдылық артықшылықтарын көрсетті, ал адам қатысушылар нұсқаулар мен оқытудан тәуелсіз оларды көрсетті.&lt;/p&gt;\n&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;p&gt;Қарапайымдылық ұзақ уақыт бойы тиімді пайымдау мен ұтымды шешім қабылдаудың негізгі элементі ретінде қарастырылып келеді. Ол философияда, психологияда, статистикалық қорытындыда және жақында машиналық оқытуда іргелі қағида ретінде ұсынылды (дегенмен, жоғары күрделі модельдердің ғылымдағы бұл дәстүрлі көзқарасқа қалай қарсы шыққаны және оны толықтырғаны туралы жақында жарияланған мақаланы қараңыз). Сәйкесінше, адамның таным процесінде қарапайымдылыққа деген артықшылықтың әртүрлі формалары анықталды, мысалы, шулы бақыланатын деректердің латентті көзі ретінде тегіс (қарапайым) қисық сызықтарды таңдау бейімділігі, сондай-ақ топтастыру, контурды анықтау және пішінді тануға қатысты визуалды қабылдау. Алайда, бұл зерттеулердің берік теориялық негізіне қарамастан, ешкім адам мінез-құлқындағы қарапайымдылыққа деген артықшылықтың сандық ұғымын анықтауға тырысқан жоқ (жай ғана анықтау емес, оның шамасын өлшеу). Бұл жұмыста біз қарапайымдылыққа деген артықшылықтардың байестік модель таңдау мен ақпарат теориясының қиылысында орналасқан Оккам ұстарасының (Occam’s razor) арнайы математикалық тұжырымдамасымен тығыз байланысты екенін көрсеттік. Бұл тұжырымдама бізге деректер үшін қарапайым түсініктемелерге деген артықшылықты жай ғана анықтаудан асып түсуге және әртүрлі теориялық негізделген жағдайларда жасанды және адам қатысушыларында бұл артықшылықтың күшін дәл өлшеуге мүмкіндік берді.&lt;/p&gt;\n&lt;h4 id=\"teoriyalykh-ueles-zhaene-parametrler-shekarasy\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#teoriyalykh-ueles-zhaene-parametrler-shekarasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теориялық үлес және параметрлер шекарасы&lt;/span&gt;&lt;/a&gt;Теориялық үлес және параметрлер шекарасы&lt;/h4&gt;\n&lt;p&gt;Біздің зерттеуіміз бірнеше жаңа үлес қосады. Біріншісі — теориялық: біз байестік модель таңдауда Фишер ақпараттық аппроксимациясының (FIA) жаңа мүшесін шығардық, ол ең жақсы модельдің модельдер отбасының шекарасында болуы мүмкіндігін ескереді (Әдістер бөлімінің А.2 тармағындағы мәліметтерді қараңыз). Бұл шекаралық мүше маңызды, өйткені ол деректердегі шуға байланысты бір параметрдің (немесе параметрлер комбинациясының) ең жақсы мәні экстремалды мәнге ие болуы мүмкіндігін ескере алады. Бұл шарт нақты деректер модельдерінде жиі кездесетін «параметрлердің булануы» құбылысымен байланысты. Сонымен қатар, параметрлер шекаралары сенсорлық стимулдар эксперименттік қондырғының физикалық шектеулерімен шектелген және сондықтан шектелмеген параметрлер туралы пайымдау бақылаушылар үшін проблемалы болатын қабылдау шешімдерін қабылдау зерттеулері үшін өте маңызды. Мысалы, қатысушылардан визуалды стимулдың орналасқан жері туралы хабарлауды талап ететін экспериментті жобалауды елестетіп көріңіз. Бұл жағдайда мүмкін болатын орындардың шектелмеген жиынтығы (мысалы, қашықтықта солға және оңға шексіз созылған сызық бойымен) анық қабылданбайды. Біздің «шекаралық» мүшеміз мүмкіндіктер жиынтығын шекаралары бар деп қарастырудың әсерін ресмилендіреді, бұл деректерге жақын жергілікті гипотезалар санын азайту арқылы жергілікті күрделілікті арттыруға бейім (1b-суретін қараңыз).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Біз параметрлер шекарасын ескеретін жаңа FIA мүшесін шығардық, бұл физикалық шектеулер жағдайында шешім қабылдауды дәлірек модельдеуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zhasandy-nejrondykh-zheliler-zhaene-okhytu\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#zhasandy-nejrondykh-zheliler-zhaene-okhytu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жасанды нейрондық желілер және оқыту&lt;/span&gt;&lt;/a&gt;Жасанды нейрондық желілер және оқыту&lt;/h4&gt;\n&lt;p&gt;Бұл жұмыстың екінші үлесі жасанды нейрондық желілерге (ANN) қатысты: біз бұл желілердің қалай оқытылатынына байланысты қарапайымдылыққа деген артықшылықтарды оңтайлы түрде (яғни теорияда белгіленген шамаларға сәйкес) пайдалануды немесе оларға назар аудармауды үйрене алатынын көрсеттік. Бұл нәтижелер қарапайым функцияларды жүзеге асыру терең нейрондық желілерде жалпылаудың кілті болуы мүмкін деген идеяға бағытталған жақындағы жұмыстардан ерекшеленеді және оларды толықтырады. Мұнда біз тиімді оқыту нормативтік қарапайымдылық артықшылықтарын қалыптастыруда шешім қабылдау функциясының емес, гипотезалар кеңістігінің күрделілігін ескере алатынын көрсеттік. Бір жағынан, бұл нәтижелер таңқаларлық емес, өйткені ANN-дер және әсіресе терең желілер кең ауқымды қорытынды жасау тапсырмаларында іс жүзінде жақсы жұмыс істейтін қуатты функция аппроксиматорлары болып табылады. Сәйкесінше, нақты генеративті шешімдер бойынша оқытылған біздің ANN-дер берілген бақылаулар жиынтығының генеративті көзі туралы, соның ішінде қарапайымдылық артықшылықтарымен тиімді шешімдер қабылдай алды. Сол сияқты, максималды ықтималдық шешімдері бойынша оқытылған біздің ANN-дер берілген бақылаулар жиынтығы үшін максималды ықтималдық сәйкестігі туралы қарапайымдылық артықшылықтарынсыз тиімді шешімдер қабылдай алды. Екінші жағынан, бұл нәтижелер ANN-дерді белгілі бір мәселелер үшін қандай шешімдер шығаратынын жақсырақ түсіну үшін қалай талдауға болатыны туралы жаңа түсініктер береді. Атап айтқанда, біз байқаған қарапайымдылық артықшылықтарының түрлерінің бар-жоғын бағалау ANN-нің оқу деректеріне шамадан тыс бейімделуден (overfitting) аулақ болу және неғұрлым жалпыланатын шешімдерді ұсыну ықтималдығын анықтауға көмектесуі мүмкін.&lt;/p&gt;\n&lt;h4 id=\"adam-minez-khulkhy-zhaene-bajestik-integraciya\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#adam-minez-khulkhy-zhaene-bajestik-integraciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Адам мінез-құлқы және байестік интеграция&lt;/span&gt;&lt;/a&gt;Адам мінез-құлқы және байестік интеграция&lt;/h4&gt;\n&lt;p&gt;Бұл жұмыстың үшінші және ең маңызды үлесі адам мінез-құлқына қатысты: адамдар белгілі бір негізгі есептеулерді қамтитын шешімдер қабылдағанда қарапайымдылық артықшылықтарының белгілі бір формаларын қолдануға бейім. Теориялық тұрғыдан алғанда, байестік шешім (яғни қарапайымдылық артықшылықтарын қамтитын) мен максималды ықтималдық шешімі (яғни қарапайымдылық артықшылықтарын қамтымайтын) арасындағы айырмашылық мынада: соңғысы әр отбасынан тек бір ең сәйкес келетін модельді ескереді, ал біріншісі әр отбасындағы барлық мүмкін болатын модельдерді интеграциялайды. Бұл интеграция процесі қарапайымдылыққа деген бейімділікті тудырады, бұл, ең бастысы, сенімсіз сенсорлық бейнелеу немесе стохастикалық таңдау процесіне байланысты стимулдың әртүрлі мүмкін себептері бойынша іріктеу алу сияқты қарапайым механизмдерден туындай алмайды (2-суретті қараңыз). Біздің адамдардың ANN-дерден айырмашылығы, максималды ықтималдық шешімдерін қолдану туралы нұсқау берілгенде де байестік шешімді қолдануға бейім екендігі туралы қорытындымыз, біздің табиғи түрде шешімдерді мүмкіндіктер отбасындағы жалғыз ең жақсы немесе архетиптік үлгі негізінде емес, бүкіл отбасы бойынша интеграциялай отырып қабылдайтынымызды білдіреді. Біздің тапсырмамыз тұрғысынан нақтырақ айтқанда, деректер нүктелеріне ең жақын пішінді анықтау сұралғанда, қатысушылар әр пішіндегі қай нақты орналасу ең жақын екеніне сенімсіз болған. Сондықтан олар табиғи түрде барлық мүмкіндіктер бойынша интеграциялады, бұл байестік шешім белгілеген қарапайымдылық артықшылықтарын тудырады. Бұл нәтижелер мидың тиісті шешім қабылдау мәселелері үшін осы интеграцияланған шешімдерді қай жерде және қалай жүзеге асыратынын және сақтайтынын анықтау бойынша болашақ зерттеулерді ынталандыруға және хабардар етуге көмектеседі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Байестік шешім барлық мүмкін болатын модельдердің ықтималдығын ескереді, ал максималды ықтималдық әдісі тек бір ең сәйкес модельді таңдайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"artykhshylykhtardyng-aertuerlilik-koezderi\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#artykhshylykhtardyng-aertuerlilik-koezderi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Артықшылықтардың әртүрлілік көздері&lt;/span&gt;&lt;/a&gt;Артықшылықтардың әртүрлілік көздері&lt;/h4&gt;\n&lt;p&gt;Біздің нәтижелеріміздің келешекте зерттеуге тұрарлық тағы бір негізгі ерекшелігі — адам қатысушылары көрсеткен артықшылықтардың шамасы мен өзгермелілігі. Орташа алғанда, адамның әрбір геометриялық модель сипаттамасына сезімталдығы: 1) нөлден үлкен, 2) оңтайлы мәннен кем дегенде сәл өзгеше (мысалы, өлшемділік пен беріктік үшін үлкенірек, көлем үшін кішірек), 3) әртүрлі сипаттамалар мен әртүрлі қатысушылар үшін әртүрлі және 4) нұсқаулар мен оқытуға қатысты салыстырмалы түрде сезімтал емес болды. Бұл әртүрліліктің көзі неде? Бір гипотеза бойынша, адамдар есептеу оңайырақ немесе арзанырақ болатын модель сипаттамаларына көбірек салмақ беруі мүмкін. Біздің эксперименттерімізде ең көп салмақ берілген сипаттама модельдің өлшемділігі болды. Біздің математикалық құрылымымызда бұл сипаттама бақыланатын деректер үшін мүмкін болатын түсініктеменің еркіндік дәрежелерінің санына сәйкес келеді және сондықтан салыстырмалы түрде оңай бағалануы мүмкін. Керісінше, ең аз салмақ берілген сипаттама модель көлемі болды. Бұл сипаттама модель құрамындағы ажыратылатын ықтималдық таралуларының санын есептейді және сондықтан бүкіл модель отбасы бойынша интеграцияны қамтиды. Басқаша айтқанда, әлемнің қанша түрлі жағдайын белгілі бір гипотезамен түсіндіруге болатынын санау үшін оларды санап шығу керек. Бұл операция есептеу тұрғысынан қымбат болуы мүмкін (дегенмен біз тапсырмаларымызда қолданған модельдер үшін бұл сан тікелей экранда сызылған сызықтардың ұзындығымен байланысты, шудың стандартты ауытқу бірліктерінде өлшенеді және сондықтан қатысушыларымыз үшін анықтау өте оңай болуы мүмкін, Әдістер бөлімінің А.4 тармағын қараңыз). Басқа екі мүше, шекара және беріктік, адам салмағы мен есептеу қиындығы тұрғысынан орташа болып табылады. Оларды өлшемділікке қарағанда есептеу қиынырақ, өйткені олар деректерге және максималды ықтималдық орналасуындағы модель сипаттамаларына байланысты. Алайда, олар көлем мүшесіне қарағанда қарапайым, өйткені олар бүкіл модель манифолды бойынша интеграцияны талап етпейтін жергілікті шамалар болып табылады. Бұл түйсік салыстырылып жатқан түсініктемелердің күрделілігі мен шешім қабылдау процесінің өзінің күрделілігі арасындағы байланыс туралы жаңа сұрақтарды тудырады, бұл шектеулі ұтымдылық пен оңтайлы қорытындыдағы азайып бара жатқан табыстар ұғымдарына күмән келтіреді. Мұндай сұрақтарға жауап беру осы жұмыстың ауқымынан тыс, бірақ болашақта зерттеуге тұрарлық.&lt;/p&gt;\n&lt;h4 id=\"bolashakh-baghyttar-men-shekteuler\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#bolashakh-baghyttar-men-shekteuler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Болашақ бағыттар мен шектеулер&lt;/span&gt;&lt;/a&gt;Болашақ бағыттар мен шектеулер&lt;/h4&gt;\n&lt;p&gt;Тағы бір қызықты болашақ бағыт — қарапайымдылықтың пайда болуына қатысты басқа ресми тәсілдермен салыстыру, бұл әртүрлі болжамдарға әкелуі мүмкін. Жақында жүргізілген зерттеулер Джеффрис априорлық таралуы (біздің геометриялық тәсіліміз негізделген) табиғи ғылымдарда жиі кездесетін және модель мінез-құлқына әсер етпейтін көптеген параметрлер комбинациясын қамтитын модель класының күрделілігі туралы толық емес бейне беретінін атап өтті және оның орнына деректерге тәуелді априорлық таралуларды қолдануды ұсынды. Екі әдіс, әсіресе деректер шектеулі режимде әртүрлі нәтижелерге әкеледі. Бұл айырмашылықтардың адам және машина шешім қабылдауы үшін маңыздылығын түсіну пайдалы болар еді. Біздің тапсырма дизайнымыз бен талдауларымыз болашақ зерттеулерде шешілуі мүмкін бірнеше шектеулерге ие болды. Біз тек төрт тапсырма нұсқасын қолдандық, бұл нәтижелеріміздің жалпылануын шектейді (дегенмен шекара және беріктік айыппұлдары модельге және деректерге байланысты болғандықтан, олар тапсырмалар барысында мәндер континуумын болжағанын және шекара айыппұлы барлық тапсырма түрлері үшін өзекті болғанын атап өту керек). Біз сондай-ақ тек белгіленген N үлгі көлемін, тартылған модельдер үшін FIA аналитикалық түрде есептелуі мүмкін шарттарды және қайталанатын шешімдердің дәйекті аспектілерін ескермейтін тәуелсіз сынақтарды қарастырдық. Бұл тәсілімізді осы болжамдарды жеңілдету үшін кеңейту немесе модельдердің көлемі немесе өлшемділігі еркінірек өзгеруіне мүмкіндік беретін шарттарды енгізу, адамдар шешім қабылдағанда қарапайымдылық артықшылықтарын қашан және қалай көрсететіні туралы қосымша түсініктер береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Біздің зерттеуіміз нақты математикалық модельдерге және шектеулі тапсырмалар жиынтығына негізделген; нәтижелер неғұрлым күрделі немесе динамикалық жағдайларда өзгеше болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қорытындылай келе, біздің жұмысымыз модель күрделілігінің ресми ұғымдарының адам мінез-құлқына тікелей, сандық маңыздылығын көрсетеді. Теориялық жетістіктер, есептеу модельдеу және мінез-құлық эксперименттерінің үйлесіміне сүйене отырып, біз белгісіздік жағдайында шешім қабылдау үшін жаңа нормативтік анықтамалық нүктелерді орнаттық. Бұл нәтижелер адам танымын оңтайлы қорытынды жасау процестеріне қатысты өлшеуге болатын жаңа алаңды ашады, бұл мидағы ақпаратты өңдеуге әсер ететін шектеулер туралы жаңа түсініктерге әкелуі мүмкін.&lt;/p&gt;\n&lt;h4 id=\"derekterding-kholzhetimdiligi\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#derekterding-kholzhetimdiligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деректердің қолжетімділігі&lt;/span&gt;&lt;/a&gt;Деректердің қолжетімділігі&lt;/h4&gt;\n&lt;p&gt;Осы жұмыста жиналған барлық эксперименталды деректер doi:10.17605/OSF.IO/R6D8N мекенжайында қолжетімді.&lt;/p&gt;\n&lt;h4 id=\"kodtyng-kholzhetimdiligi\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#kodtyng-kholzhetimdiligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кодтың қолжетімділігі&lt;/span&gt;&lt;/a&gt;Кодтың қолжетімділігі&lt;/h4&gt;\n&lt;p&gt;Эксперименттерді қайта өндіруге қажетті барлық деректер мен код (соның ішінде онлайн психофизикалық тапсырмаларды орындау, сондай-ақ нейрондық желілерді оқыту және сынақтан өткізу), сондай-ақ деректерді талдау және барлық суреттерді жасау doi:10.17605/OSF.IO/R6D8N мекенжайында қолжетімді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-f1.jpg\" alt=\"Сурет 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-f2.jpg\" alt=\"Сурет 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-f3.jpg\" alt=\"Сурет 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-f4.jpg\" alt=\"Сурет 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-f5.jpg\" alt=\"Сурет 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 5&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-f6.jpg\" alt=\"Сурет 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 6&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-fS1.jpg\" alt=\"Сурет S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-fS2.jpg\" alt=\"Сурет S2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-fS2-2.jpg\" alt=\"Сурет S2 (жалғасы 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S2 (жалғасы 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-fS3.jpg\" alt=\"Сурет S3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-fS4.jpg\" alt=\"Сурет S4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-fS4-2.jpg\" alt=\"Сурет S4 (жалғасы 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S4 (жалғасы 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-fS4-3.jpg\" alt=\"Сурет S4 (жалғасы 3)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S4 (жалғасы 3)&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"kesteler\"&gt;&lt;a href=\"202
