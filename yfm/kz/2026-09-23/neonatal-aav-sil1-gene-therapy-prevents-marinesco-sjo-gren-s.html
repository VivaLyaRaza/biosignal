            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"187\" cy=\"103\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"493\" cy=\"198\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Гендік терапия тышқандардағы&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;сирек синдромның алдын алды&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-f1.jpg\" alt=\"1-сурет. AAV-медиацияланған SIL1 экспрессиясы PC-ларда барлық жерде немесе таңдамалы түрде экспрессияланған кезде woozy \" /&gt;&lt;/p&gt;\n&lt;p&gt;*1-сурет. AAV-медиацияланған SIL1 экспрессиясы PC-ларда барлық жерде немесе таңдамалы түрде экспрессияланған кезде woozy тышқандарында қозғалыс белсенділігі мен мишық патологиясын жақсартады. (A, B) Гетерозиготалы бақылау (CT) және woozy (wz) тышқандар топтарына icv арқылы PBS, AAV-CAG-moSIL1 немесе AAV-L7-6-moSIL1 егілді. Жануарларға ілінген бөренемен жүру қабілеті апта сайын тексерілді. Деректер артқы аяқтың сүріну санының (A) және бөренеден өтудің орташа уақытының (B) орташа ± SEM ретінде ұсынылған. (A)-да F(3.543, 31.89) = 17.66, P &amp;lt; 0.0001; (B)-да екі факторлы қайталанатын өлшеулер ANOVA (RM ANOVA) бойынша F(4.926, 44.34) = 5.775, P = 0.0004; Даннеттің пост-хок тесті бойынша **P &amp;lt; 0.01, **P &amp;lt; 0.05, ****P &amp;lt; 0.0001. (C, D) 9 апталық CT және woozy тышқандарының мишық кесінділерінде кальбиндинге (C) немесе CHOP-қа (D) иммуногистохимиялық талдау. Масштабтық сызық 200 мкм. (E, F) Мишық қыртысындағы кальбиндин-оң аймақты (E) және CHOP-оң PC-ларды (F) сандық бағалау. Деректер орташа ± SEM болып табылады. (E)-де F(2, 10) = 6.648, P = 0.0146; (F)-та екі факторлы ANOVA бойынша F(2, 9) = 33.35, P &amp;lt; 0.0001; Даннеттің пост-хок тесті бойынша *P &amp;lt; 0.05, ***P &amp;lt; 0.001, ***&lt;em&gt;P &amp;lt; 0.0001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Марнеско — Шегрен синдромы — SIL1 ақуызының жетіспеушілігінен туындайтын және қимыл координациясының бұзылуымен сипатталатын сирек тұқым қуалайтын ауру. Зерттеушілер аденоассоцияланған вирус көмегімен сау генді орталық жүйке жүйесіне жеткізу әдісін сынап көрді. Бұл әдіс ауру белгілерінің дамуын тоқтатып, нейрондарды сақтап қалуға мүмкіндік берді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;SIL1 генін вирустық вектор арқылы жеткізу атаксияның алдын алады.&lt;/li&gt;\n&lt;li&gt;Терапия мишықтағы Пуркинье жасушаларының өлуіне жол бермейді.&lt;/li&gt;\n&lt;li&gt;Емдеу нәтижесі 26 апта бойы тұрақты түрде сақталды.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Бұл ауру эндоплазмалық ретикулум жұмысын қамтамасыз ететін SIL1 геніндегі мутациялармен байланысты. Бұл ақуыз болмаған кезде жасушаішілік стресс туындайды да, мишықтағы Пуркинье жасушалары өледі. Бұрын қолданылған дәрі-дәрмектер бұл процесті тоқтата алмаған немесе қосымша уытты әсер көрсеткен.&lt;/p&gt;\n&lt;p&gt;Жаңа зерттеуде SIL1 ақауы бар тышқандардың ми қарыншаларына өмірінің басында SIL1 гені бар AAV-PHP.eB вирустық векторлары енгізілді. Генді жеткізу атаксияның дамуына жол бермеді, жасушалық стресс деңгейін төмендетті және мишық құрылымын сақтады. Пуркинье жасушаларында генді таңдамалы түрде қалпына келтірудің өзі қимыл белсенділігін қайтаруға жеткілікті болды.&lt;/p&gt;\n&lt;p&gt;Терапиялық әсер 26 апталық бақылау кезеңі бойы сақталды. Сонымен қатар процедура бұлшықет тінінің жұмысын да жақсартты. Аталмыш нәтижелер бұл синдромды адамдарда емдеудің жаңа жолдарын ашады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тек тышқан үлгісінде орындалғандықтан, әдісті клиникалық тәжірибеге енгізу үшін ірі жануарлар мен адамдарда қауіпсіздік сынақтары қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Маринеско — Шегрен синдромы сирек кездесетін, ерте басталатын мультижүйелік ауру болып табылады, ол негізінен мишық атаксиясы және миопатиямен сипатталады және SIL1 геніндегі функцияны жоғалтатын мутациялар салдарынан дамиды. Қазіргі уақытта бұл дертке қарсы тиімді патогенетикалық ем жоқ. Авторлар адено-ассоциацияланған вирустар (AAV) негізіндегі гендік терапия woozy тышқан моделінде аурудың алдын ала алатынын зерттеп көрді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Маринеско — Шегрен синдромы SIL1 генінің ақауларынан туындайды және емі жоқ, сондықтан зерттеушілер woozy тышқандарында AAV векторлық гендік терапиясын қолданды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;p&gt;Жаңа туған тышқандарға жалпы немесе Пуркинье жасушаларына тән промотордың бақылауымен SIL1 генін кодтайтын AAV-PHP.eB векторлары интрацеребровентрикулярлы түрде егілді. Жануарларды бақылау және олардың жағдайын бағалау 26 апта бойы жүргізілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AAV-PHP.eB векторы — бұл терапиялық генетикалық материалды орталық жүйке жүйесінің тіндеріне тиімді жеткізетін жасанды түрде жасалған вирустық тасымалдаушы агент.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;p&gt;Плацебо алған бақылау тобындағы woozy тышқандарында мишықтағы Пуркинье жасушаларының өлімімен және эндоплазмалық ретикулум стресс жолдарының белсенуімен бірге жүретін ауыр қимыл-қозғалыс бұзылыстары байқалды. Керісінше, AAV-SIL1 енгізу атаксияның дамуына толық жол бермеді, Пуркинье жасушаларын сақтап қалды және стресс жолдарының белсенділігін төмендетті. SIL1 экспрессиясын тек Пуркинье жасушаларында таңдамалы түрде қалпына келтіру қозғалыс көрсеткіштерін жақсарту үшін жеткілікті болып шықты, бұл патагенезде осы нейрондар дисфункциясының маңызды рөлін растайды. Терапиялық тиімділік 26 апталық бақылау кезеңі бойы сақталды және бұл бұлшықет функциясының жақсаруымен мен бұлшықет патологиясының азаюымен қатар жүрді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эксперименттер тышқан моделінде (woozy) жүргізілді, сондықтан клиникалық тәжірибеге енгізер алдында ірірек организмдерде қосымша трансляциялық зерттеулер қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe1\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#kirispe1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Маринско — Шёгрен синдромы (MSS) — бұл ерте балалық шақта басталатын және қазіргі уақытта емдеу әдісі жоқ сирек кездесетін аутосомды-рецессивті бұзылыс. Туа біткен катаракта, мишық атрофиясы және миопатия MSS-тің негізгі диагностикалық белгілері болып табылады. Сонымен қатар, интеллектуалды бұзылулар, ниетті тремор, дизартрия, қаңқа аномалиялары, аласа бойлылық, нистагм, қиғаштық және гипергонадотропты гипогонадизм жиі байқалады. Бастапқы белгілер әдетте өмірдің алғашқы айларында пайда болады, өйткені науқас сәбилер ерте моторлық дағдыларды игере алмайды. Қозғалыс функциясы балалық шақта нашарлайды, бірақ бірнеше жылға созылған прогрессиядан кейін ауру болжанбайтын жаста және ауырлық дәрежесінде тұрақтанады, ал өмір сүру ұзақтығы қалыпты болып қалады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Маринско — Шёгрен синдромы — катаракта, атаксия және миопатиямен сипатталатын, алғашқы нашарлаудан кейін тұрақтанатын ауыр туа біткен ауру.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Аурудың ерте кезеңінде оның өршуінің алдын алатын, кешіктіретін немесе әлсірететін араласулар моторлық функция мен өмір сапасына терең әрі ұзақ мерзімді әсер етуі мүмкін. Шамамен 60% жағдайда MSS SIL1 геніндегі гомозиготалы немесе компаунд-гетерозиготалы мутациялардан туындайды, бұл SIL1 ақуызының экспрессиясының және/немесе функциясының жоғалуына әкеледі. Sil1 геніндеги спонтанды мутация сонымен қатар адам ауруының негізгі аспектілерін, соның ішінде Пуркинье жасушаларының дегенерациясымен жүретін мишықтық атаксия мен қаңқа бұлшықеттерінің патологиясын қайталайтын жақсы зерттелген woozy (wz) тышқандары моделінің фенотипіне негіз болады.&lt;/p&gt;\n&lt;p&gt;SIL1 ақуызы эндоплазмалық ретикулумда (ЭР) ақуыздардың дұрыс бүктелуін реттейтін басты шаперон — BiP үшін нуклеотидтік алмасу факторы ретінде жұмыс істейді. BiP шаперондық белсенділігі ATP байланысу және гидролиз циклімен реттеледі. SIL1 BiP молекуласындағы ADP-ATP алмасуын жеңілдетіп, субстраттың тиімді босап шығуын қамтамасыз етеді. SIL1 жетіспеушілігі нуклеотидтік алмасудың бұзылуына, BiP пен клиент ақуыздардың ұзақ уақыт байланысуына, бүктелмеген ақуыздардың жиналуына, ЭР стресіне және бүктелмеген ақуыздарға жауаптың (UPR) активациясына әкеледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бүктелмеген ақуыздарға жауап (UPR) — бұл эндоплазмалық ретикулумда ақаулы ақуыздар жиналған кезде жасушаны қорғайтын күрделі сигналдық жол, ол созылмалы түрде белсенгенде апоптозға әкелуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;UPR — бұл ЭР протеостазын қалпына келтіруге бағытталған күрделі сигналдық жол. PERK киназасы UPR-дің үш негізгі эффекторының бірі болып табылады, қалғандары ATF6 және IRE1. Белсендірілген PERK эукариоттық трансляцияны бастау факторы 2-нің альфа кіші бірлігін (eIF2α) фосфорлайды. Бұл мРНК трансляциясын тежеп, жалпы ақуыз синтезін азайтады. Алайда, ATF4 трансляция факторы сияқты кейбір арнайы мРНК-лар басым түрде трансляцияланады. Егер жасушалар бүктелмеген ақуыздардың жүктемесімен күресе алмаса, ұзаққа созылған ATF4 синтезі CHOP-ты қоздырып, апоптозға әкеледі. Бұл жол синапстарды сақтау және өмір сүру үшін тұрақты ақуыз синтезіне тәуелді нейрондар үшін әсіресе зиянды.&lt;/p&gt;\n&lt;p&gt;Авторлар бұған дейін PERK/eIF2α сигналдары woozy тышқандарында Пуркинье жасушаларының дегенерациясы мен атаксиясынан бұрын болатынын, сондай-ақ миопатияның басталуымен бір уақытта қаңқа бұлшықетінде белсенді болатынын көрсеткен еді. PERK ингибиторы GSK2606414-ті ерте пресимптомды енгізу нейродегенерация мен моторлық белгілерді кешіктірді, симптомсыз кезеңді ұзартты және бұлшықет патологиясын жақсартты. Алайда, GSK2606414 ұйқы безінің уыттылығымен байланысты болды және ауруды толық емдей алмады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PERK ингибиторлары мен бұрын сынақтан өткен қосылыстар (тразодон, TUDCA) жанама әсерлер немесе тиімсіздік салдарынан MSS моделін толық емдей алмады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Уыттылықты айналып өту және қолданыстағы дәрілік қосылыстарды пайдалану үшін зерттеушілер дәрілерді қайта бағыттау тәсілін қолдана отырып, eIF2α-дан төменгі ағында PERK сигналдарын модуляциялайтын дибензоилметан мен тразодонды зерттеді. Алайда, бұл қосылыстар woozy моделінде тиімсіз болып шықты және моторлық тапшылықтың немесе Пуркинье жасушаларының жоғалуының алдын ала алмады. Сол сияқты, өт циррозы үшін мақұлданған және MSS жасушалық моделінде тиімді екендігі көрсетілген химиялық шаперон тауроурсодезоксихоль қышқылы woozy тышқандарында ешқандай пайдалы әсер көрсетпеді.&lt;/p&gt;\n&lt;p&gt;MSS жағдайларының көп бөлігі SIL1 геніндегі функцияны жоғалтатын мутациялардан туындайтындықтан, SIL1-ді қалпына келтіру салдарларын емес, бастапқы молекулалық ақауды шешетін тікелей терапиялық стратегияны білдіреді. Сондықтан авторлар өз күштерін гендік терапия тәсіліне бағыттады. Рекомбинантты аденовируспен байланысқан вирустық (AAV) векторлар бұл мақсат үшін өте қолайлы, өйткені олар ОЖЖ және қаңқа бұлшықеттері сияқты митотикалық емес тіндерде трансгеннің тұрақты экспрессиясын қамтамасыз етеді және преклиникалық және клиникалық зерттеулерде қолайлы қауіпсіздік бейінін көрсетті. Сонымен қатар, капсидтерді инженерлік жобалаудағы соңғы жетістіктер ОЖЖ-ге гендерді жеткізу тиімділігін едәуір арттырды.&lt;/p&gt;\n&lt;p&gt;Бұл зерттеуде авторлар SIL1 экспрессиялайтын AAV векторларын неонаталды интрацеребро-вентрикулярлы енгізу MSS-тің woozy тышқан моделінде мишық және бұлшықет патологиясының дамуына жол бермейтінін және ұзақ мерзімді функционалдық пайда әкелетінін бағалады. Сондай-ақ олар тек Пуркинье жасушаларында SIL1 экспрессиясын таңдамалы түрде қалпына келтіру мишық дисфункциясын жоя алатынын, осылайша MSS кезіндегі нейродегенерацияның жасушалық негізін шешетінін зерттеді.&lt;/p&gt;\n&lt;h3 id=\"naetizheler1\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#naetizheler1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"aav-vektory-endoplazmalykh-retikulumda-durys-oryn-alatyn-tiimdi-zhaene-zhasusha-selektivti-sil1-ekspressiyasyn-khamtamasyz-etedi\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#aav-vektory-endoplazmalykh-retikulumda-durys-oryn-alatyn-tiimdi-zhaene-zhasusha-selektivti-sil1-ekspressiyasyn-khamtamasyz-etedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AAV векторы эндоплазмалық ретикулумда дұрыс орын алатын тиімді және жасуша-селективті SIL1 экспрессиясын қамтамасыз етеді&lt;/span&gt;&lt;/a&gt;AAV векторы эндоплазмалық ретикулумда дұрыс орын алатын тиімді және жасуша-селективті SIL1 экспрессиясын қамтамасыз етеді&lt;/h4&gt;\n&lt;p&gt;Зерттеушілер pAAV-CAG-GFP плазмидасындағы жасыл флуоресцентті ақуыз (GFP) тізбегін сәйкес SIL1 кДНК-ларымен алмастыру арқылы, барлық жерде кездесетін CAG промоторының бақылауымен тышқан (mo) немесе адам (hu) SIL1 кодтайтын аденовирустық векторларды (AAV) жасады. SIL1 экспрессиясын Пуркинье жасушаларында (PCs) таңдамалы түрде қалпына келтіру мишық дисфункциясын жоюға жеткілікті екенін анықтау үшін, moSIL1 немесе GFP ақуыздарын PCs-ке тән L7-6 промоторының бақылауымен экспрессиялайтын AAV векторлары жасалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AAV (адено-ассоциацияланған вирустар) — бұл ғылыми және терапиялық мақсатта генетикалық материалды жасушалар мен тіндерге жеткізу үшін қолданылатын қауіпсіз вирустық векторлар.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;AAV9 немесе AAV-PHP.eB (бұдан әрі PHP.eB) капсидтері ішінде эндогендік SIL1 жоқ woozy тышқандарының эмбриональды фибробласттарында (MEFs) сынақтан өткізілді. AAV9-CAG-moSIL1 және PHP.eB-CAG-moSIL1 векторларының екеуі де SIL1 экспрессиясын тудырды, бұл ретте PHP.eB S1A-Суретте жалпы жоғары тиімділікті көрсетті. Күтілгендей, AAV9-L7-6-moSIL1 векторы бұл жасуша түрінде SIL1 экспрессиясын қоздырмады, бұл L7-6 промоторының дәл Пуркинье жасушаларына қатаң спецификалығын растайды.&lt;/p&gt;\n&lt;p&gt;Иммунофлуоресцентті талдау трансгенді SIL1 ақуызы эндоплазмалық ретикулум (ЭР) маркері PDI-мен S1B-Суретте бірге орналасатынын, бірақ Гольджи аппаратының маркері GM130-бен S1C-Суретте қиылыспайтынын көрсетті, бұл трансгенді ақуыздың дұрыс ішкіжасушалық таралуын растайды. AAV арқылы кодталған SIL1 ақуызы PNGase F және Endo H ферменттерімен дегликозили сезгіш болып шықты, соңғысы эндоплазмалық ретикулум ішінде сақталатын ақуыздарға тән жетілмеген жоғары маннозалық N-гликандардың бар екенін көрсетеді (S2-Сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CAG және L7-6 промоторлары бар AAV векторлары эндоплазмалық ретикулумда дұрыс орналасқан және Пуркинье жасушаларына қатысты жоғары таңдамалылыққа ие SIL1 синтезін сәтті іске қосады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;L7-6 промоторы трансген экспрессиясын тек Пуркинье жасушаларында басқаратынын тексеру үшін, мәдениеттелген органотиптік мишық кесінділерін (COCS) AAV9-CAG-GFP немесе AAV9-L7-6-GFP векторларымен трансдукциялады. AAV9-CAG-GFP кең таралған GFP белгілерін берсе, ал AAV9-L7-6-GFP өңделген COCS-терде GFP сигналы S3C-Суретте тек кальбиндин-оң Пуркинье жасушаларымен шектелді, бұл L7-6 промоторының осы нейрондар үшін жоғары спецификалығын растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тәжірибелер жасушалық желілер мен кемірушілердің органотиптік мишық кесінділерінде жүргізілгендіктен, терапиялық әсерді түпкілікті бағалау үшін тұтас организмдерде қосымша зерттеулер қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;PHP.eB-CAG-SIL1 немесе PHP.eB-L7-6-SIL1 векторларымен трансдукцияланған woozy COCS-ке вестерн-блоттинг талдауын жасау екі жағдайда да SIL1 ақуызының пайда болғанын растады. Бұл ретте PHP.eB-L7-6-SIL1 векторымен өңделген кесінділердегі экспрессия деңгейі S4-Суретте айтарлықтай төмен болды, бұл ақуыз синтезінің тек Пуркинье жасушаларымен шектелуіне толығымен сәйкес келеді.&lt;/p&gt;\n&lt;p&gt;SIL1 кодтайтын AAV векторларын ми қарыншаларына енгізу (жалпы немесе Пуркинье жасушаларында таңдамалы түрде) CHOP-оң Пуркинье жасушаларын азайтады, ерте дегенерацияны жұмсартады және атаксияның алдын алады&lt;/p&gt;\n&lt;p&gt;Woozy тышқандарында атаксия 6-7 аптада ағаш сырықта жүру тестінде, ал 9-10 аптада үдемелі ротарод тестінде байқала бастайды, бұл ретте қозғалыс бұзылыстары 16 аптаға дейін күшейіп, содан кейін тұрақталады. Пуркинье жасушаларының (ПЖ) дегенерациясы 7-8 аптадан басталып, 16 аптаға қарай толық дерлік жойылуға әкеледі. Бастапқы тәжірибелер сериясында авторлар неонатальды AAV инъекциясы өмірдің алғашқы 9 аптасында моторлық дисфункциялар мен ерте нейродегенерацияның алдын ала алатынын тексерді (S5A-сур).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Жаңа туған тышқандардың ми қарыншаларына қауіпсіз вирустық векторлар (AAV) арқылы гендерді енгізу орталық жүйке жүйесіне терапиялық ақуыздарды жеткізудің тиімді әдісі болып табылады.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Орталық жүйке жүйесінде трансгеннің тиімді синтезіне қол жеткізу үшін интрацеребро-вентрикулярлық инъекция қолданылды. Бұл тәсіл CAG промоторы арқылы барлық ОЖЖ бойынша жасыл флуоресцентті ақуыздың (GFP) кең тараған экспрессиясын немесе L7-6 промоторының бақылауымен тек Пуркинье жасушаларында шектелген синтезін қамтамасыз етті (S6A-сур). Бұрынғы мәліметтерге сәйкес, GFP негізінен нейрондарда байқалды (S7-сур) және мишықта универсал CAG промоторы қолданылса да, негізінен ПЖ-мен шектелді (S6-сур). PHP.eB капсиді тең вирус титрлерінде AAV9-ға қарағанда жоғары трансдукция тиімділігін көрсеткендіктен (S6-сур), кейінгі барлық тәжірибелер үшін осы капсид пайдаланылды.&lt;/p&gt;\n&lt;p&gt;Жалпы және ПЖ-спецификалық SIL1 синтезінің әсерін салыстыру үшін гетерозиготалы (CT) және ауру woozy тышқандарына P0 жасында латеральды ми қарыншаларына 10¹¹ vg/mouse мөлшерінде PHP.eB-CAG-moSIL1, PHP.eB-L7-6-moSIL1 немесе еріткіш (PBS) енгізілді. Тышқандар әр апта сайын сырықта жүру тестінен өткізіліп, миды биохимиялық және иммуногистохимиялық талдау үшін 9 апталығында өлтірілді (S5A-сур). Қосымша топтар 6 апталығында UPR стресс маркерлерін бағалау үшін алынды, өйткені бұл жаста woozy тышқандарында UPR белсенділігі ең жоғары деңгейге жетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;SIL1 векторларын жаңа туған woozy тышқандарына енгізу қозғалыс бұзылыстарын толығымен болдырмайды және Пуркинье жасушаларын сақтайды.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;5 апталыққа дейін топтар арасында сырықта жүру көрсеткіштері бойынша айырмашылықтар байқалмады (1-сур, A мен B). 6-аптадан бастап PBS алған woozy тышқандарында қателіктер саны (1A-сур) мен өту уақыты (1B-сур) гетерозиготалы бақылауға қарағанда айтарлықтай өсті. Керісінше, SIL1 експрессиялайтын AAV алған woozy тышқандары тәжірибе барысында моторлық көрсеткіштерінің жақсарғанын көрсетті және бақылау тобынан ерекшеленбеді.&lt;/p&gt;\n&lt;p&gt;ПЖ бастапқы дегенерациясын бағалау үшін кальбиндинге қарсы антиденелермен иммуногистохимия қолданылды. PBS алған woozy тышқандарында кальбиндин-оң аймақ 27% азайғаны анықталды (1-сур, C пен E). CAG немесе L7-6 промоторлары басқаратын SIL1 векторларымен емделген woozy тышқандары бұл аймақтың айтарлықтай жақсы сақталғанын көрсетті. CHOP антиденелерімен талдау AAV алған тышқандарда CHOP-оң ПЖ үлесі айтарлықтай азайғанын көрсетті (1-сур, D мен F). 6 апталық жастағы ddPCR талдауы BiP, ATF4 және CHOP мРНК деңгейлерінің төмендегенін растады (S8-сур).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Деректер зертханалық тышқандарда алынған және трансгендердің экспрессия деңгейі қолданылған промоторға байланысты өзгеруі мүмкін.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Western blot (WB) талдауы PHP.eB-CAG-moSIL1 алған тышқандардың үлкен ми сыңарлары мен мишығында SIL1 синтезін растады (S9A-сур). PHP.eB-L7-6-moSIL1 кезінде SIL1 тек мишықта және әлдеқайда төмен деңгейде анықталды (S9B-сур). ddPCR мәліметтері бойынша, трансгендік SIL1 мРНК деңгейі бақылау көрсеткішінен шамамен 4 есе жоғары болды (S8-сур).&lt;/p&gt;\n&lt;p&gt;Нәтижелерді растау үшін адам SIL1 (huSIL1) кодтайтын векторлармен тәжірибе қайталанды. Бақылау ретінде PHP.eB-CAG-GFP алған woozy тышқандары тобы қосылды. GFP алған тышқандарда атаксия үдей түсті (2-сур, A мен B). moSIL1 немесе huSIL1 алған тышқандардың көрсеткіштері CT тышқандарына ұқсас болды (2-сур, A мен B). Кальбиндин және CHOP иммуногистохимиясы 9 аптада ПЖ сақталғанын растады (2-сур, C-F).&lt;/p&gt;\n&lt;p&gt;Мишық гомогенаттарының Western blot талдауы moSIL1 тобындағы SIL1 деңгейі табиғи нормадан 1.5 есе, ал huSIL1 тобында шамамен 6 есе жоғары болғанын көрсетті (3-сур).&lt;/p&gt;\n&lt;p&gt;Тышқанның немесе адамның SIL1 ақуызын кодтайтын AAV-лар церебеллярлық атаксия мен Пуркинье жасушаларының дегенерациясынан ұзақ мерзімді қорғанысты қамтамасыз етеді&lt;/p&gt;\n&lt;p&gt;AAV терапиясының терапиялық әсері ұзақ уақыт сақталатынын анықтау үшін тәжірибе қайталанып, жануарлар 26 апталық жасқа дейін бақыланды (S5B сурет). Бұл кеңейтілген талдау созылмалы сатыларда емдеудің жағымсыз әсерлерінің пайда болуын бағалауға мүмкіндік берді. Алғашқы 9 апта ішінде брусокпен жүру көрсеткіштерін талдау қозғалыс бұзылыстарының дамуына емнің оң әсерін растады (4 сурет, A және B; S1 кино). Осы кезеңнен кейін плацебо алған woozy тышқандары артқы аяқтарын сүйретіп және брусоктан жиі құлап, тестті орындай алмады. Керісінше, AAV алған woozy тышқандары тестті нашарлаусыз орындауды жалғастырып, CT бақылау тобына ұқсас нәтижелер көрсетті (4 сурет, A және B; S2 кино).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тышқан немесе адам SIL1 гендерін кодтайтын AAV көмегімен ұзақ мерзімді емдеу woozy тышқандарында қозғалыс бұзылыстары мен атаксияның алдын алып, 26 аптада да сау жануарлар деңгейін сақтайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл ұзақ мерзімді тиімділік ауыртылықтың кеш сатысындағы woozy тышқандары орындай алатын айналмалы стерженьдегі (rotarod) жылдамдатылған тест арқылы расталды. Бұрын хабарланғандай (Grande et al, 2018), PBS енгізілген woozy тышқандары құлау латенттілігінің біртіндеп төмендеуін, содан кейін тұрақтануын көрсетті (4C сурет). Керісінше, moSIL1 немесе huSIL1 кодтайтын AAV алған woozy тышқандарының көрсеткіштері CT бақылау тобынан ерекшеленбеді (4C сурет).&lt;/p&gt;\n&lt;p&gt;Прогрессивті тремор woozy тышқандарының неврологиялық фенотипінің бір бөлігі болып табылады (Zhao et al, 2005). Жеңіл тремор алғаш рет 10 аптада ілулі брусокпен жүргенде байқалады (Grande et al, 2018). Тремор 20 және 26 апталарда бағаланды. Екі уақыт нүктесінде де плацебо тобындағы барлық тоғыз тышқанда ауыр тремор байқалды, ал AAV алған 13 тышқанның ешқайсысында көрінетін тремор байқалмады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Иммуногистохимия — ұлпадағы спецификалық ақуыздарды арнайы белгіленген антиденелер көмегімен анықтау әдісі; калбиндин Пуркинье жасушаларын санау үшін маркер ретінде қолданылды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;26 аптада калбиндин иммуногистохимиясы PBS алған woozy тышқандарында Пуркинье жасушаларының толық жоғалғанын көрсетті (5 сурет, A және B). Морфометриялық талдау бұл жануарларда мишық қыртысының молекулалық қабатының айтарлықтай жұқарғанын анықтады (5C сурет). Керісінше, AAV алған woozy тышқандарында Пуркинье жасушалары да, молекулалық қабат қалыңдығы да айтарлықтай сақталғаны көрінді (5 сурет). Сонымен қатар, емделген тышқандардың Пуркинье жасушаларында CHOP белсенуі анықталмады (S10 сурет), бұл эндоплазмалық ретикулум стресінің басылуына сәйкес келеді.&lt;/p&gt;\n&lt;p&gt;SIL1 гендік терапиясының мишық патологиясына әсерін бағалау үшін 26 аптада GFAP иммунобояуы арқылы астроцитарлық белсендіру зерттелді. PBS алған woozy тышқандары мишық қыртысы бойында айқын GFAP иммунореактивтілігін көрсетті (6 сурет). AAV алған woozy тышқандарында GFAP иммунореактивтілігі айтарлықтай төмендеді (6 сурет). Бұл деректер AAV арқылы SIL1 жеткізу Пуркинье жасушаларын сақтайтынын және реактивті астроциттердің жауабын азайтатынын көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"aav-terapiyasy-bulshykhet-kueshin-zhakhsartady-zhaene-ultrakhurylymdykh-bulshykhet-patologiyasyn-zhakhsartady\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#aav-terapiyasy-bulshykhet-kueshin-zhakhsartady-zhaene-ultrakhurylymdykh-bulshykhet-patologiyasyn-zhakhsartady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AAV терапиясы бұлшықет күшін жақсартады және ультрақұрылымдық бұлшықет патологиясын жақсартады&lt;/span&gt;&lt;/a&gt;AAV терапиясы бұлшықет күшін жақсартады және ультрақұрылымдық бұлшықет патологиясын жақсартады&lt;/h4&gt;\n&lt;p&gt;Woozy тышқандарында қаңқа бұлшықеттерінің ауыр прогрессивті миопатиясы дамиды, ол 16 аптада электронды микроскопия арқылы анықталады (Grande et al, 2018; Roos et al, 2014). Торға іліну және күш сынау тесттері PHP.eB-CAG-SIL1 алған woozy тышқандарында бұлшықет төзімділігі мен күші жақсарғанын көрсетті (7 сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Алынған нәтижелер сирек кездесетін аурудың тышқан үлгісіне негізделген және оларды адамдарға көшіру клиникалық растауды қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұны бағалау үшін біз емделген тышқандардың төрт басты бұлшықеттерін (quadriceps) гистология және трансмиссиялық электронды микроскопия (TEM) арқылы талдадық. Жарық микроскопиясы PBS алған woozy тышқандарында ядролары сарколемма астында орналаспаған бұлшықет талшықтарының жоғары пайызын анықтады (Roos et al, 2014). Бұл пайыз тышқан немесе адам SIL1 кодтайтын AAV алған woozy тышқандарында айтарлықтай төмендеді (S11 сурет). TEM талдауы PBS алған woozy тышқандарында саркоплазмалық ретикулумның кеңеюі және миелин тәрізді вакуольдер сияқты өзгерістерді анықтады (8A сурет). AAV алған тышқандарда бұл өзгерістер әлдеқайда аз байқалды (8A сурет, 8B сурет).&lt;/p&gt;\n&lt;p&gt;Функционалдық пайда мен бұлшықет патологиясының жақсаруы трансгендік SIL1 экспрессиясына байланысты екенін анықтау үшін біз Вестерн-блот (WB) талдауын жүргіздік. Трансгендік SIL1 экспрессиясы қаңқа бұлшықеттерінде анықталды. Мидағыдан айтарлықтай төмен болса да, AAV алған тышқандардың quadriceps бұлшықетіндегі SIL1 деңгейлері CT тышқандарының эндогендік деңгейлерімен салыстырмалы болды (S12 сурет).&lt;/p&gt;\n&lt;p&gt;Маңыздысы, терапиялық пайда уыттылық белгілерімен бірге жүрмеді. AAV алған CT және woozy тышқандары зерттеу барысында қалыпты мінез-құлық көрсетті, ал 26 аптада өлшенген қан сарысуының параметрлері норма шегінде болды (S1 кесте).&lt;/p&gt;\n&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;h4 id=\"naetizhelerdi-talkhylau\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#naetizhelerdi-talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелерді талқылау&lt;/span&gt;&lt;/a&gt;Нәтижелерді талқылау&lt;/h4&gt;\n&lt;p&gt;Бұл зерттеу ерте нәрестелік шақта басталатын, қазіргі уақытта патогенетикалық емдеу әдісі жоқ өте сирек әрі ауыр ауру — Маринеско-Шегрен синдромына (MSS) қарсы гендік терапия тәсілін тексеруге бағытталды. Біз дикий типтегі SIL1 генін кодтайтын AAV векторларын жаңа туған тышқандардың ми қарыншаларына енгізу атаксияның дамуына жол бермейтінін, Пуркинье жасушаларын сақтап қалу және астроглиозды азайту арқылы мишықтың дегенерациясын бәсеңдететінін, сондай-ақ woozy тышқан моделінде қаңқа бұлшықеттерінің дисфункциясы мен патологиясын жақсартатынын анықтадық.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жаңа туған woozy тышқандарына AAV-SIL1 енгізу атаксияның дамуын болдырмады, Пуркинье жасушаларын сақтап қалды және уыттылық белгілерінсіз қозғалыс функциясын жақсартты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Маңыздысы, woozy немесе бақылау тобындағы тышқандарда AAV енгізуімен немесе трансгенді SIL1 артық экспрессиясымен байланысты уыттылық немесе жағымсыз әсерлер байқалмады. SIL1 экспрессиясын Пуркинье жасушаларында таңдамалы түрде қалпына келтіру мишық атаксиясының алдын алу үшін жеткілікті болды, бұл аурудың патогенезіне дәл осы Пуркинье жасушалары дисфункциясының жасушалық автономиялық үлес қосатынын көрсетеді. Бұл деректер MSS үшін перспективалы терапиялық стратегия ретінде AAV көмегімен SIL1 гендік терапиясын қолдауға болатын дәлелдер береді.&lt;/p&gt;\n&lt;p&gt;Қазіргі уақытта MSS үшін тиімді ем жоқ. Woozy тышқандарымен жүргізілген бұрынғы зерттеулер PERK жолын модульдеу арқылы эндоплазмалық ретикулум стресс пен дұрыс бейімделмеген UPR сигналдарын әлсіретуге бағытталған фармакологиялық тәсілдерді зерттеген болатын. Бұл шаралар ішінара пайда әкелгенімен, моторлық дисфункцияны немесе мишық дегенерациясын толық қалпына келтіре алмады, бұл тек төменгі ағынды стресс жолдарын нысанаға алу SIL1 тапшылығының салдарымен күресу үшін жеткіліксіз екенін көрсетеді. Жақында woozy тышқандарында жасушаға енетін SIL1-TAT біріктірілген ақуызын кодтайтын AAV8 векторын бауыр арқылы жеткізуге негізделген гендік терапия тәсілі бағаланды. Бұл стратегияда бауыр TAT тізбегінің болуына байланысты ОЖЖ қоса алғанда, бірнеше органдарға енуі тиіс SIL1-TAT химерасын жүйелі түрде өндіру үшін «биофабрика» ретінде пайдаланылды. SIL1-TAT қаңқа бұлшықеттерінде анықталды, бірақ мишықта табылмады және терапевтік әсер ету баған бойынша жүру және ротарод көрсеткіштерінің біршама жақсаруымен шектеліп, қозғалыс бұзылыстарының өршуін кешіктірді. Бұл бақылаулар SIL1 жүйке жүйесіне тиімді түрде жеткізілуі сенімді терапевтік пайда үшін қажет екенін қатаң түрде көрсетеді. Осыған байланысты, бұл зерттеу ОЖЖ-ге бағытталған AAV көмегімен жүзеге асырылатын гендік терапия бұрын зерттелген фармакологиялық немесе шеткі генді жеткізу тәсілдеріне қарағанда айтарлықтай жоғары тиімділікке қол жеткізетінін дәлелдейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AAV (аденоассоциацияланған вирустар) — сау гендерді пациенттің жасушаларына жеткізу үшін қолданылатын қауіпсіз тасымалдаушы вирустар, ал вестерн-блот және ddPCR — ақуыздар мен ДНҚ/РНК-ны талдау әдістері.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл жұмыстың негізгі нәтижесі AAV арқылы SIL1 жеткізу ОЖЖ-де күшті трансген экспрессиясына әкеліп соққанын және 26 апта бойы атаксиямен байланысты моторлық тапшылықтардың тұрақты түрде жойылуын қамтамасыз еткенін көрсетті.&lt;/p&gt;\n&lt;p&gt;Мишық сығындыларын вестерн-блот талдауы moSIL1-мен емделген тышқандарда эндогендік дикий типті деңгейден сәл жоғары, ал huSIL1-мен емделген жануарларда шамамен алты есе жоғары SIL1 иммунореактивтілігін көрсетті. Дегенмен, иммуноблоттинг үшін қолданылған антитела адамның SIL1-іне қарсы алынғандықтан, huSIL1-мен емделген тышқандарда байқалған күштірек сигнал адам ақуызына қатысты антителаның жоғары жақындығын ішінара көрсетуі мүмкін. Сонымен қатар, микродиссекция жасалған Пуркинье жасушаларының ddPCR талдауы нысана нейрондық популяция ішінде SIL1 мРНК-сының шамамен екі есе артық экспрессиясын көрсетті, бұл қуатты, бірақ тым артық физиологиялық емес трансген экспрессиясына сәйкес келеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тәжірибелер тышқан моделінде жүргізілді, ал адам SIL1 нұсқасын алған тышқандарда ақуыз сигналының күшеюі антителалардың ерекшеліктеріне байланысты болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мінез-құлықтың қалпына келуі Пуркинье жасушаларының айтарлықтай сақталуымен және GFAP иммунореактивтілігінің төмендеуімен көрінген мишық астроглиозының айқын төмендеуімен қатар жүрді. Реактивті астроцитоз көптеген нейродегенеративті аурулардың жақсы белгісі болып табылады, бірақ оның MSS патогенезіне қосқан үлесі бұрын зерттелмеген еді. Трансген экспрессиясы негізінен Пуркинье жасушаларында және басқа нейрондарда байқалғандықтан, мишық астроглиозының айқын бәсеңдеуі астроциттерді тікелей түзету нәтижесі болуы екіталай. Керісінше, бұл реактивті глиальды жауап нейрондық дегенерацияның қайталама салдары екенін және осал Пуркинье жасушаларын қорғау арқылы оның алдын алуға болатынын көрсетеді. Жиынтықта бұл деректер SIL1 генін жеткізу Пуркинье жасушаларын сақтап қана қоймай, мишық дегенерациясымен байланысты реактивті глиальды жауапты да бәсеңдететінін көрсетеді.&lt;/p&gt;\n&lt;p&gt;AAV-мен емделген woozy тышқандарында Пуркинье жасушаларының сақталуы айтарлықтай болды, бірақ толық емес еді.&lt;/p&gt;\n&lt;p&gt;Дегенмен, емделген тышқандардың қозғалыс көрсеткіштері гетерозиготалы бақылау тобынан еш айырмашылығы жоқ еді. Бұл нәтижелер функциялардың күшті қалпына келуіне қол жеткізу үшін мишық дегенерациясының толық анатомиялық сақталуы талап етілмеуі мүмкін екенін көрсетеді. Бұл тұжырым мишық атаксиясының бірнеше тышқан модельдеріндегі зерттеулермен расталады, онда Пуркинье жасушалары популяцияларының ішінара сақталуы немесе олардың жұмысының қалпына келуі қозғалыс мінез-құлқында айтарлықтай жақсаруларға әкелуі мүмкін, бұл мишық тізбектерінің айтарлықтай функционалдық резерві мен компенсаторлық мүмкіндіктерін көрсетеді. Сондықтан біздің деректеріміз осал Пуркинье жасушаларының жеткілікті бөлігінде SIL1 экспрессиясын қалпына келтіру қалдықты нейродегенерация болғанның өзінде мишық тізбегінің функциясын сақтап қалуға және айқын атаксияның пайда болуына жол бермеуге қабілетті екенін көрсетеді.&lt;/p&gt;\n&lt;p&gt;Тағы бір маңызды бақылау — терапевтік әсердің таңқаларлық төзімділігі. AAV-SIL1 препаратымен емделген woozy тышқандары осы зерттеуде талданған соңғы уақыт нүктесі болып табылатын 26 апталық бақылау кезеңі бойы гетерозиготалы бақылау топтарынан мінез-құлқы бойынша айырмашылығы жоқ күйінде қалды. Бұл тұрақты пайда неврологиялық симптомдар әдетте нәрестелік шақта пайда болатын және балалық шақта өрбитін, бірақ кейіннен ауру тұрақтанатын және өмір сүру ұзақтығы әдетте қысқармайтын MSS контекстінде ерекше жігерлендіреді.&lt;/p&gt;\n&lt;h4 id=\"klinikalykh-kholdanu-perspektivalary-zhaene-terapiya-khauipsizdigi\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#klinikalykh-kholdanu-perspektivalary-zhaene-terapiya-khauipsizdigi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Клиникалық қолдану перспективалары және терапия қауіпсіздігі&lt;/span&gt;&lt;/a&gt;Клиникалық қолдану перспективалары және терапия қауіпсіздігі&lt;/h4&gt;\n&lt;p&gt;Өмірдің алғашқы кезеңінде терапияны ерте бастау қозғалыс функцияларының ұзақ уақыт сақталуын қамтамасыз етіп, пациенттердің дербестігі мен өмір сапасын едәуір жақсарта алады. Тәжірибелер барысында жаңа туған тышқандарға AAV векторларын интрацеревентрикулярлы енгізумен немесе SIL1 ақуызының ұзақ мерзімді шамадан тыс экспрессиясымен байланысты ешқандай жағымсыз әсерлер байқалмағанын атап өткен жөн (woozi мутантты тышқандарында да, сау бақылау жануарларында да). Бұл бақылаулар орталық жүйке жүйесіндегі SIL1 деңгейінің шамадан тыс экспрессиясы ағзамен жақсы көтерілетінін көрсетеді. Жиынтық түрде бұл нәтижелер AAV арқылы SIL1 жеткізу көрінетін уыттылықсыз тұрақты терапиялық әсер беретінін растайды.&lt;/p&gt;\n&lt;h4 id=\"purkine-zhasushalarynyng-roeli-zhaene-fenotipti-selektivti-tuezetu\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#purkine-zhasushalarynyng-roeli-zhaene-fenotipti-selektivti-tuezetu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пуркинье жасушаларының рөлі және фенотипті селективті түзету&lt;/span&gt;&lt;/a&gt;Пуркинье жасушаларының рөлі және фенотипті селективті түзету&lt;/h4&gt;\n&lt;p&gt;Жұмыстың қызықты нәтижесі L7-6 промоторының бақылауымен SIL1-дің тек Пуркинье жасушаларында таңдамалы түрде экспрессиялануы атаксияның дамуын болдырмау үшін жеткілікті болғаны. SIL1 тапшылығы бұл нейрондарды эндоплазмалық ретикулум стресске осал етеді, ал осы жасушаларда SIL1 деңгейін қалпына келтіру нейродегенерацияны азайтады және мишық қызметін қалыпқа келтіреді. Алынған деректер басқа тұқым қуалайтын атаксиялардың нәтижелерімен үйлеседі, мұнда Пуркинье жасушалары негізгі нысана болып табылады. Осылайша, Пуркинье жасушаларына әсер ету woozi тышқан моделінде мишық фенотипін түзетуге қабілетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SIL1-дің Пуркинье жасушаларында селективті экспрессиясы атаксияның дамуын толығымен болдырмайды және мишық функциясын қалыпқа келтіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"khangkha-bulshykhetterine-aeseri-zhaene-zhuejelik-aeserler\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#khangkha-bulshykhetterine-aeseri-zhaene-zhuejelik-aeserler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қаңқа бұлшықеттеріне әсері және жүйелік әсерлер&lt;/span&gt;&lt;/a&gt;Қаңқа бұлшықеттеріне әсері және жүйелік әсерлер&lt;/h4&gt;\n&lt;p&gt;AAV көмегімен емделген woozi тышқандары бұлшықет күші мен төзімділігінің айтарлықтай жақсарғанын көрсетті, бұл ұстау күші мен торда ұстау тестілерінде расталды. Функционалдық жақсартуларға сәйкес, гистологиялық зерттеу қаңқа бұлшықеттері патологиясының айқын төмендегенін көрсетті: орталық ядролары бар бұлшықет талшықтарының саны азайды. Вестерн-блоттинг әдісі трансгенді SIL1 ақуызының қаңқа бұлшықеттерінде гетерозиготты тышқандар деңгейінде бар екенін тіркеді. Осылайша, SIL1-дің салыстырмалы түрде төмен қалпына келтіру деңгейінің өзі бұлшықет тіні үшін маңызды пайда әкелуі мүмкін.&lt;/p&gt;\n&lt;h4 id=\"keleshek-zertteu-baghyttary\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#keleshek-zertteu-baghyttary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Келешек зерттеу бағыттары&lt;/span&gt;&lt;/a&gt;Келешек зерттеу бағыттары&lt;/h4&gt;\n&lt;p&gt;AAV негізіндегі SIL1 гендік терапиясын MSS үшін әлеуетті емдеу әдісі ретінде әзірлеуді қолдайды. Дегенмен, бірқатар маңызды сұрақтар қалып отыр. Жаңа туған нәрестелерге интрацеревентрикулярлы енгізу тышқандарда жоғары тиімді болғанымен, клиникалық тәжірибеге көшу орталық жүйке жүйесі мен шеткі тіндерді тиімді трансдукциялауға қабілетті жеткізу стратегияларын оңтайландыруды талап етеді. Болашақ зерттеулер нысаналы тіндерде жеткілікті SIL1 экспрессиясын қамтамасыз ететін жүйелік енгізу әдістерін бағалауы тиіс.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Деректер тышқан моделінде алынды, сондықтан клиникалық қолдану үшін жүйелік жеткізу әдістерін әзірлеу қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Клиникалық аудару үшін тағы бір маңызды сұрақ — неонаталды емдеу кезінде байқалатын терапиялық пайданы аурудың кейінгі сатыларына таратуға бола ма. Жаңа туған нәрестелерді скрининг бағдарламалары болашақта алдын ала емдеуге мүмкіндік берсе де, симптомдар басталғаннан кейін AAV-SIL1 терапиясы тиімді болып қала беретінін анықтау маңызды. Соңында, терапиялық пайда 26 апталық бақылау кезеңінде сақталғанымен, өмір бойы SIL1 экспрессиясының салдарын бағалау үшін ұзақ мерзімді зерттеулер қажет болады.&lt;/p&gt;\n&lt;h3 id=\"aedister1\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#aedister1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"zertteu-dizajny\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#zertteu-dizajny\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу дизайны&lt;/span&gt;&lt;/a&gt;Зерттеу дизайны&lt;/h4&gt;\n&lt;p&gt;Бұл жұмыс MSS ауруының woozy (wz/wz) тышқан моделі мен бақылау ретіндегі гетерозиготалы бір туысқандарын (CT) қолданған бақыланатын, рандомизацияланған зертханалық зерттеу болып табылады. Жабайы тип (wt/wt) пен гетерозиготалар (wt/wz) арасында қозғалыс белсенділігі немесе мишық құрылымы бойынша маңызды айырмашылықтар жоқтығы бұрын дәлелденгендіктен, тәжірибе барысында гетерозиготалы жануарлар бақылау тобы ретінде пайдаланылды. wt/wz × wz/wz будандастырудан алынған (шамамен 50% бақылау және 50% woozy ұрпақ беретін) жаңа туған тышқандар AAV векторын немесе плацебоны (vehicle) алу үшін аналық топ деңгейінде кездейсоқ бөлінді. Туылған кезде жынысын сенімді анықтау мүмкін болмағандықтан, екі жыныстағы жаңа туған тышқандар топтарды құру кезінде жынысына қарамай енгізілді. Мінез-құлық сынақтары, сондай-ақ гистологиялық және ультрақұрылымдық талдаулар генотип пен емдеу әдісінен бейхабар зерттеушілер тарапынан жүргізілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Соқыр тестілеу әдісі (blinding) зерттеушілердің жануарлардың қай топқа жататынын білмей отырып бағалауын қамтамасыз етеді, бұл субъективті қателіктерді болдырмауға көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қысқа мерзімді тәжірибелер емдеудің моторлық бұзылулардың басталуына және Пуркинье жасушаларының ерте дегенерациясына әсерін бағалау үшін S5A-суретте көрсетілген схема бойынша атқарылды. Тышқандар 4 апталық жасында жіңішке бөренеде жүру тестіне (beam-walking test) жаттықтырылып, 9 апталық жасқа жеткенге дейін апта сайын тексеріліп тұрды. Негізгі нәтиже ретінде woozy тышқандарындағы қозғалысты үйлестіру мен тепе-теңдіктің ерте бұзылуларын сезімтал түрде көрсететін бөренеде жүру тесті алынды. Іріктеу көлемі алдын ала қуат талдауы арқылы есептелді: емделмеген woozy тышқандарында 5, 6, 7, 8 және 9 апталық жаста аяқтың сүрінуі орташа есеппен сәйкесінше 2, 6, 16, 23 және 37 рет болады деп болжанып, AR(1) корреляциясы 0.50, қалдық дисперсиясы 2.00 және I түрдегі қателік 0.05 пен қуаты 90% болған жағдайда сүріну санын 60%-ға азайтуды анықтау үшін әр топта алты жануар қажет екені анықталды.&lt;/p&gt;\n&lt;p&gt;Ұзақ мерзімді тәжірибелер S5B-суреттегі дизайнға сай жүргізілді. Жануарлар 26 апталық жасқа дейін бақыланды. Бөренеде жүрумен қатар, қозғалыс қабілеті woozy тышқандарында шамамен 9-10 апталық жастан бастап қозғалыс ақауларын анықтайтын және ауру асқынған кезеңдерде де қолайлы болып қалатын үдемелі ротарод (accelerating rotarod) арқылы бағаланды. Бұлшықет функциясы кері тор (inverted grid) және ұстау күші (grip strength) тесттері арқылы тексерілді.&lt;/p&gt;\n&lt;p&gt;Жануарлар белгіленген тәжірибелік кезеңдердің соңында эвтаназия жасалды. Тін жинау кезінде әр мидың бір жартышары гистологиялық, иммуногистохимиялық немесе ультрақұрылымдық талдау үшін батырылып бекітілді, ал қарама-қарсы жартышар биохимиялық зерттеулер үшін тез мұздатылды. Төрт басты сан бұлшықеттері де осындай тәртіппен өңделді: бір бұлшықет ультрақұрылымдық талдау үшін бекітілсе, екіншісі гистологиялық және биохимиялық зерттеу үшін мұздатылды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-f1.jpg\" alt=\"1-сурет. AAV-медиацияланған SIL1 экспрессиясы PC-ларда барлық жерде немесе таңдамалы түрде экспрессияланған кезде woozy \" /&gt;&lt;/p&gt;\n&lt;p&gt;*1-сурет. AAV-медиацияланған SIL1 экспрессиясы PC-ларда барлық жерде немесе таңдамалы түрде экспрессияланған кезде woozy тышқандарында қозғалыс белсенділігі мен мишық патологиясын жақсартады. (A, B) Гетерозиготалы бақылау (CT) және woozy (wz) тышқандар топтарына icv арқылы PBS, AAV-CAG-moSIL1 немесе AAV-L7-6-moSIL1 егілді. Жануарларға ілінген бөренемен жүру қабілеті апта сайын тексерілді. Деректер артқы аяқтың сүріну санының (A) және бөренеден өтудің орташа уақытының (B) орташа ± SEM ретінде ұсынылған. (A)-да F(3.543, 31.89) = 17.66, P &amp;lt; 0.0001; (B)-да екі факторлы қайталанатын өлшеулер ANOVA (RM ANOVA) бойынша F(4.926, 44.34) = 5.775, P = 0.0004; Даннеттің пост-хок тесті бойынша **P &amp;lt; 0.01, **P &amp;lt; 0.05, ****P &amp;lt; 0.0001. (C, D) 9 апталық CT және woozy тышқандарының мишық кесінділерінде кальбиндинге (C) немесе CHOP-қа (D) иммуногистохимиялық талдау. Масштабтық сызық 200 мкм. (E, F) Мишық қыртысындағы кальбиндин-оң аймақты (E) және CHOP-оң PC-ларды (F) сандық бағалау. Деректер орташа ± SEM болып табылады. (E)-де F(2, 10) = 6.648, P = 0.0146; (F)-та екі факторлы ANOVA бойынша F(2, 9) = 33.35, P &amp;lt; 0.0001; Даннеттің пост-хок тесті бойынша *P &amp;lt; 0.05, ***P &amp;lt; 0.001, ***&lt;em&gt;P &amp;lt; 0.0001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-f2.jpg\" alt=\"2-сурет. Тышқан немесе адам SIL1 кодтайтын AAV-лардың жаңа туылған ми қарыншаішілік (icv) инъекциясы woozy тышқандарында\" /&gt;&lt;/p&gt;\n&lt;p&gt;*2-сурет. Тышқан немесе адам SIL1 кодтайтын AAV-лардың жаңа туылған ми қарыншаішілік (icv) инъекциясы woozy тышқандарында моторлық тапшылық пен PC дегенерациясының дамуын болдырмайды. (A, B) Жаңа туылған woozy және гетерозиготалы (CT) бауырластарға icv арқылы PHP.eB-CAG-GFP, PHP.eB-CAG-moSIL1 немесе PHP.eB-CAG-huSIL1 (1011 вг/тышқан) егіліп, төрт апталық жастан бастап ілінген бөренемен жүру қабілеті апта сайын тексерілді. Деректер артқы аяқтың сүріну санының (A) және бөренеден өтуге қажетті уақыттың (B) орташа ± SEM мәні болып табылады. (A)-да F(5.605, 50.44) = 8.614, P &amp;lt; 0.0001; (B)-да екі факторлы RM ANOVA бойынша F(5.356, 48.21) = 3.966, P = 0.0036; Даннеттің пост-хок тесті бойынша *P &amp;lt; 0.05, **P &amp;lt; 0.01, ***P &amp;lt; 0.001. (C, D) апталық CT және woozy тышқандарының мишық кесінділерінде кальбиндинге (C) немесе CHOP-қа (D) иммуногистохимиялық талдау. Масштабтық сызық 200 мкм. (E, F) Мишық қыртысындағы кальбиндин-оң аймақты (E) және CHOP-оң PC-ларды (F) сандық бағалау. Деректер орташа ± SEM болып табылады. (E)-де F(2, 8) = 12.50, P = 0.0035; (F)-та екі факторлы ANOVA бойынша F(2, 10) = 6.942, P = 0.0129; Даннеттің пост-хок тесті бойынша *P &amp;lt; 0.05, *&lt;em&gt;P &amp;lt; 0.01.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-f3.jpg\" alt=\"3-сурет. PHP.eB-CAG-huSIL1 және PHP.eB-CAG-moSIL1 ми қарыншаішілік инъекциясы мишықта күшті трансген экспрессиясын тудыр\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет. PHP.eB-CAG-huSIL1 және PHP.eB-CAG-moSIL1 ми қарыншаішілік инъекциясы мишықта күшті трансген экспрессиясын тудырады. (A) 9 апталық жасында P0 кезінде PHP.eB-CAG-GFP, PHP.eB-CAG-huSIL1 немесе PHP.eB-CAG-moSIL1 icv енгізілген CT және woozy тышқандарының мишық гомогенаттарындағы SIL1, GFP және GAPDH вестерн-блот талдауы. (B) SIL1 деңгейлері денситометрия көмегімен сандық бағаланды, GAPDH деңгейіне қатысты нормализденді және PHP.eB-CAG-GFP енгізілген CT тышқандарындағы эндогендік SIL1 мөлшеріне қатысты графикке түсірілді. Деректер топқа шаққандағы 2-3 жануардың орташа ± SEM мәні болып табылады.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-f4.jpg\" alt=\"4-сурет. Жаңа туылған woozy тышқандарына PHP.eB-CAG-moSIL1 және PHP.eB-CAG-huSIL1 ми қарыншаішілік инъекциясы қозғалыс д\" /&gt;&lt;/p&gt;\n&lt;p&gt;*4-сурет. Жаңа туылған woozy тышқандарына PHP.eB-CAG-moSIL1 және PHP.eB-CAG-huSIL1 ми қарыншаішілік инъекциясы қозғалыс дисфункциясынан тұрақты қорғанысты қамтамасыз етеді. (A) Жаңа туылған woozy және гетерозиготалы (CT) бауырластарға icv арқылы PBS, PHP.eB-CAG-moSIL1 немесе PHP.eB-CAG-huSIL1 егіліп, төрт апталық жастан бастап ілінген бөренемен жүру қабілеті тексерілді. Тышқандар 9 апталық жасқа дейін апта сайын тексерілді, содан кейін PBS-пен өңделген woozy тышқандары тестті орындай алмады. Басқа топтарға жататын тышқандар 12, 16, 20 және 24 апталық жастарында қайта тексерілді. Бағандар артқы аяқтың сүріну санының (A) және бөренеден өтуге қажетті уақыттың (B) орташа ± SEM мәнін көрсетеді. (A)-да F(4.420, 44.20) = 7.994, P &amp;lt; 0.0001; (B)-да екі факторлы RM ANOVA (1-9 апта) бойынша F(6.050, 60.50) = 5.038, P = 0.0003; Даннеттің пост-хок тесті бойынша *P &amp;lt; 0.05, **P &amp;lt; 0.01, ***P &amp;lt; 0.001, ****P &amp;lt; 0.0001; (C) Сол жануарлар 4 апталық жасында (бастапқы деңгей) және кейін 9 аптадан бастап апта сайын үдемелі ротародта тексерілді. Бағандар құлауға дейінгі орташа ± SEM латенттілігін (с) көрсетеді. F(3.169, 30.10) = 26.62, P &amp;lt; 0.0001; Даннеттің пост-хок тесті бойынша *P &amp;lt; 0.05, **P &amp;lt; 0.01, ***P &amp;lt; 0.001, ***&lt;em&gt;P &amp;lt; 0.0001. (A)-дағы аңыз барлық панельдерге қолданылады.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-f5.jpg\" alt=\"5-сурет. PHP.eB-CAG-moSIL1 және PHP.eB-CAG-huSIL1 ми қарыншаішілік инъекциясы woozy тышқандарындағы PC дегенерациясын құ\" /&gt;&lt;/p&gt;\n&lt;p&gt;*5-сурет. PHP.eB-CAG-moSIL1 және PHP.eB-CAG-huSIL1 ми қарыншаішілік инъекциясы woozy тышқандарындағы PC дегенерациясын құтқарады. (A) 26 апталық жасында PBS, PHP.eB-CAG-moSIL1 немесе PHP.eB-CAG-huSIL1-мен өңделген CT немесе woozy тышқандарында кальбиндинге иммуногистохимиялық талдау. Масштабтық сызық 100 мкм. (B) Мишық қыртысындағы кальбиндин оң аймақтың пайызы. Деректер эксперименталды топтағы 5-6 тышқаннан алынған 3 ми кесіндісінің орташа ± SEM мәні болып табылады. Екі факторлы ANOVA бойынша F(2, 7) = 20.98, P = 0.0011; Даннеттің пост-хок тесті бойынша **P &amp;lt; 0.01, ***P &amp;lt; 0.001. (C) Молекулярлық қабаттың қалыңдығы. Деректер орташа ± SEM болып табылады. Екі факторлы ANOVA бойынша F(2, 7) = 56.45, P &amp;lt; 0.0001; Даннеттің пост-хок тесті бойынша ***P &amp;lt; 0.001, ***&lt;em&gt;P &amp;lt; 0.0001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-f6.jpg\" alt=\"6-сурет. PHP.eB-CAG-moSIL1 және PHP.eB-CAG-huSIL1 ми қарыншаларына енгізу астроциттердің белсенділігін төмендетеді. (A) \" /&gt;&lt;/p&gt;\n&lt;p&gt;*6-сурет. PHP.eB-CAG-moSIL1 және PHP.eB-CAG-huSIL1 ми қарыншаларына енгізу астроциттердің белсенділігін төмендетеді. (A) 26 апталық жастағы PBS, PHP.eB-CAG-moSIL1 немесе PHP.eB-CAG-huSIL1 енгізілген CT немесе woozy тышқандарындағы GFAP үшін иммуногистохимиялық талдау. Масштабтық сызғыр 100 мкм. (B) Мишық қыртысының молекулярлық қабатындағы GFAP оң аймақтың пайызы. Деректер әрбір тәжірибелік топтағы 4-8 тышқаннан алынған 3 ми қимасының орташа ± SEM мәнін білдіреді. Краскел-Уоллис тесті бойынша P &amp;lt; 0.0001; Даннның пост-хок тесті бойынша **&lt;em&gt;P &amp;lt; 0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-f7.jpg\" alt=\"7-сурет. PHP-CAG-SIL1 егілген woozy тышқандары бұлшықет функциясының жақсарғанын көрсетеді. PBS, PHP.eB-CAG-moSIL1 және \" /&gt;&lt;/p&gt;\n&lt;p&gt;*7-сурет. PHP-CAG-SIL1 егілген woozy тышқандары бұлшықет функциясының жақсарғанын көрсетеді. PBS, PHP.eB-CAG-moSIL1 және PHP.eB-CAG-huSIL1 енгізілген жануарлар сәйкесінше 20 және 25 апталық жаста торда ұсталып тұру (A) және ұстау күші (B) тесттерінен өткізілді. Деректер орташа ± SEM мәнін білдіреді. (A) бөлігінде: Краскел-Уоллис тесті бойынша P &amp;lt; 0.0001; Даннның пост-хок тесті бойынша ***P &amp;lt; 0.001. (B) бөлігінде: Краскел-Уоллис тесті бойынша P = 0.0033; Даннның пост-хок тесті бойынша &lt;em&gt;P &amp;lt; 0.05.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-f8.jpg\" alt=\"8-сурет. AAV-SIL1 енгізу woozy тышқандарының санның төрт басты бұлшықет талшықтарындағы ультрақұрылымдық өзгерістерді әл\" /&gt;&lt;/p&gt;\n&lt;p&gt;*8-сурет. AAV-SIL1 енгізу woozy тышқандарының санның төрт басты бұлшықет талшықтарындағы ультрақұрылымдық өзгерістерді әлсіретеді. (A) 26 апталық жастағы PBS және AAV енгізілген тышқандардың сан бұлшықетінің ультрақұрылымы. PBS енгізілген CT тышқандарындағы қалыпты миофибриллярлық (i) және перинуклеарлық (v) бұлшықет талшықтары ультрақұрылымының өкілді мысалдары; еріткішпен (ii) немесе тышқан (iii) не адам (iv) SIL1 кодтайтын AAV-лармен емделген woozy тышқанының миофибриллярлық компартментіндегі саркоплазмалық ретикулумның патологиялық ұлғаюы; PBS (vi) немесе тышқан (vii) не адам (viii) SIL1 кодтайтын AAV-лармен емделген woozy тышқанының қаңқа бұлшықетіндегі миелин тәрізді жарғақтық материалы бар перинуклеарлық аутофагиялық вакуольдер (ақ көрсеткілер). Масштабтық сызғыр 1 мкм. (B) Тышқандардың әртүрлі топтарында саркоплазмалық ретикулуммен (SR) қамтылған миофибриллярлық аймақтың пайызы. Деректер орташа ± SEM мәнін білдіреді. Екі факторлы ANOVA бойынша F(3, 8) = 101.7, P &amp;lt; 0.0001; Даннетттің пост-хок тесті бойынша ****P &amp;lt; 0.0001. (C) Перинуклеарлық ультрақұрылымдық өзгерістері бар ядролардың пайызы. Деректер орташа ± SEM мәнін білдіреді. Екі факторлы ANOVA бойынша F(3, 8) = 45.75, P &amp;lt; 0.0001; Даннетттің пост-хок тесті бойынша ***&lt;em&gt;P &amp;lt; 0.0001.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;SIL1 мутациясы&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жасушалардың&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;өліміне&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;әкеледі&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;AAV векторы&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;арқылы генді&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жеткізу&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нейрондар мен&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;координация&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сақталды&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;адамдардағы&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;емге негіз&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қаланды&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt
