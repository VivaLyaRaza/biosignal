            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"223\" cy=\"80\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"517\" cy=\"253\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Альцгеймер кезінде мидың&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;иммундық жасушалары неге&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;шаршайды&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-f1.jpg\" alt=\"1-сурет: Микроглия Aβ патологиясына протеомдық анаболикалық бейімделуді көрсетеді. (A) Эксперимент схемасы. Кешенді прот\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Микроглия Aβ патологиясына протеомдық анаболикалық бейімделуді көрсетеді. (A) Эксперимент схемасы. Кешенді протеомдық және транскриптомдық профильдеу үшін 3 және 9 айлық AppNL-G-F және AppNL-G-F;Trem2KO тышқандарынан бастапқы микроглия бөлініп алынды. (B) 9 айлық AppNL-G-F микроглиясындағы 3 айлық AppNL-G-F микроглиясымен салыстырғанда дифференциалды түрде көрінетін ақуыздардың (DAP) Ingenuity жолдарының талдауы (IPA), ақуыз синтезі жолдарының байытылуын атап көрсетеді (қызыл көрсеткілер). (C–D) Жасушалық компонент (C) және Биологиялық процесс (D) терминдері үшін гендер жиынтығын байыту талдауының (GSEA) нүктелік графиктер. Қызыл көрсеткілер 9 айлық AppNL-G-F микроглиясында «Рибосома» (анаболикалық) қолтаңбасының бір мезгілде байытылғанын көрсетеді, ал сары көрсеткілер 9 айлық AppNL-G-F микроглиясында байытылған «Лизосомалық мембрана» (катаболикалық) қолтаңбаларын көрсетеді. (E) IPA және (F) 9 айлық AppNL-G-F-тегі дифференциалды экспрессияланған геннің (DEG) GSEA, ақуыз трансляциясына (қызыл көрсеткілер) және катаболикалық процестерге (сары көрсеткілер) қатысатын гендерді көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Мидың басты тазалаушылары — микроглия жасушалары ақуыз жиынтықтарын жоюға тырысады. Бұл үшін оларға үлкен энергия мен жаңа ақуыздар қажет. Алайда бляшкалар көбейген сайын бұл құтқарушы механизм әлсіреп, жасушаларды қорғаныссыз қалдырады.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Микроглия TREM2-ге тәуелді анаболикалық жауап береді.&lt;/li&gt;\n&lt;li&gt;Бляшкалар өскен сайын жасушалардың қорғанысы азаяды.&lt;/li&gt;\n&lt;li&gt;Бұл құбылыс 523 донор деректері арқылы расталды.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Альцгеймер ауруы кезінде микроглия амилоидты бляшкаларды қоршайды. Ғалымдар бұл процесс TREM2 рецепторына тәуелді анаболикалық бағдарламаны қосатынын анықтады. Бұл бағдарлама ақуыз синтезі мен митохондриялардың өсуін біріктіреді.&lt;/p&gt;\n&lt;p&gt;Алайда тышқандар мен 523 донордың тіндерін талдау бұл ресурс уақыт өте келе сарқылатынын көрсетті. Аурудың кеш сатысында жасушалардың биосинтез мүмкіндігі төмендейді. Бұл антителалармен емдеу кезінде жасушалардың толық шаршап қалу қаупін тудырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу жануарлар үлгілері мен адам тіндерін талдауға негізделген, сондықтан тікелей емдеу әдістерін ұсынбайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Микроглия Альцгеймер ауруының (АА) дамуында шешуші рөл атқарады және ең күшті генетикалық қауіп факторларының бірі болып табылатын TREM2 ақуызы амилоидты бляшкалармен әрекеттесу үшін қажетті аурумен байланысқан микроглия (DAM) күйін қамтамасыз етеді. TREM2 бұл қорғаныш функциясын қалай сақтайтыны және аурудың өршуіне қарай неліктен әлсірейтіні әлі де түсініксіз. Протеомика, жеке жасушалық транскриптомика және in vivo метаболизмдік таңбалау әдістерін қолдана отырып, бляшкалармен байланысқан микроглия жаңа ақуыз синтезін митохондриялық биогенезбен байланыстыратын TREM2 тәуелді анаболикалық бағдарламаны іске қосатыны көрсетілді.&lt;/p&gt;\n&lt;p&gt;Дәл осы метаболизмдік бағдарлама, DAM қолтаңбасы емес, фагоцитарлық қабілеті бар микроглияны сипаттайды; оның жоғалуы протеостатикалық шамадан тыс жүктелумен және митохондриялық дисфункциямен байланысты. Күтпеген жерден бұл анаболикалық бағдарлама өзін-өзі шектейтіні анықталды: оның белсенділігі төмен амилоидты жүктеме кезінде шыңына жетеді де, жүктеме артқан сайын төмендейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анаболикалық әлеует микроглияның белсенділік күйіне қарағанда Альцгеймер ауруындағы жасушалық төзімділіктің дәлірек маркері болып табылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл төмендеу үрдісі адамдарда да сақталады: 523 донордың деректері бойынша, анаболикалық қабілет TREM2 деңгейіне сәйкес келеді, бірақ DAM қолтаңбасы өсіп жатса да, Брактың кейінгі сатыларында төмендеп кетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Брак сатылары — Альцгеймер ауруы кезіндегі патологиялық өзгерістердің таралу дәрежесін және нейродегенеративті процестің ауырлығын көрсететін гистологиялық жіктеу жүйесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Демек, микроглияның белсендірілген күйі емес, оның анаболикалық сыйымдылығы АА кезіндегі жасушалық тұрақтылықты анықтайды, ал антиамилоидты антиденелер көмегімен фагоцитозды үздіксіз ынталандыру биосинтетикалық шаршауға және терапиялық тиімділіктің төмендеуіне әкелуі мүмкін.&lt;/p&gt;\n&lt;h3 id=\"kirispe1\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#kirispe1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"alcgejmer-auruyndaghy-mikrogliyanyng-roeli-zhaene-metabolikalykh-syn-khaterler\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#alcgejmer-auruyndaghy-mikrogliyanyng-roeli-zhaene-metabolikalykh-syn-khaterler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Альцгеймер ауруындағы микроглияның рөлі және метаболикалық сын-қатерлер&lt;/span&gt;&lt;/a&gt;Альцгеймер ауруындағы микроглияның рөлі және метаболикалық сын-қатерлер&lt;/h4&gt;\n&lt;p&gt;Альцгеймер ауруында (АА) микроглия нейроуытты Aβ агрегаттарын оқшаулау және тазарту міндеті жүктелген негізгі қорғаныс шебі болып қызмет етеді. Генетикалық зерттеулер микроглия функциясын АА қауіп факторларының орталығына қойып, қуатты туымалы иммундық жауап патогенездің дамуын кешіктіруге көмектесетінін көрсетеді. Алайда, бұл қорғаныс қабілеті тұрақты емес. Патологияның өршуіне қарай микроглия терең фенотиптік өзгерістерге ұшырайды: алдымен ол қорғаныс жауабын қалыптастырады, бірақ жиі нейродегенерацияны шектей алмайтын реттелмеген, қартайған немесе шаршаған күйлерге ауысады. Сондықтан созылмалы протеотоксикалық стресс жағдайында микроглияның функционалдық тұрақтылығын сақтауға мүмкіндік беретін механизмдерді түсіну терапиялық араласу үшін бірінші кезектегі міндет болып табылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Микроглия миды Aβ агрегаттарынан қорғайды, бірақ АА кезінде шаршайды, сондықтан оның жасушалық тұрақтылық механизмдерін табу терапия үшін аса маңызды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бір жасушалы транскриптоникадағы соңғы жетістіктер осы жауаптың траекториясын картаға түсіріп, «Аурумен байланысқан микроглияның» (DAM) немесе «Микроглиальды нейродегенеративті фенотиптің» (MGnD) консервативті қолтаңбасын анықтады. Негізінен TREM2 (myeloid жасушаларында экспрессияланатын қоздырушы рецептор 2) арқылы басқарылатын бұл бағдарлама гомеостатикалық бақылау нүктелерін төмендетуді (мысалы, P2ry12, Cx3cr1) және липидтерді сезетін және фагоцитарлық жолдарды индукциялауды (мысалы, Apoe, Lpl, Clec7a) қамтиды. Функцияны жоғалтатын варианттар (мысалы, R47H) TREM2 маңыздылығын айқындайды, өйткені олар АА қаупін айтарлықтай арттырады және бляшкалар айналасындағы микроглиальды кластерленудің бұзылуымен және диффузиялық, нейроуытты амилоидты патологиямен байланысты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DAM/MGnD — бұл бляшкалар маңындағы микроглия гендері белсенділігінің арнайы профильдері, мұнда TREM2 рецепторы жасушаларды фагоцитозға ауыстыруда басты рөл атқарады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;DAM/MGnD тұжырымдамасы өте ықпалды болғанымен, адамдардағы зерттеулер микроглиальды күйлердің кеңірек спектрін сипаттайды, бұл тек транскрипциялық күйдің функционалдық әлеуетті толық көрсете алмайтынын білдіреді. Шын мәнінде, транскрипциялық қолтаңбаға қол жеткізу — бұл тек жоба: бляшкалармен байланысқан микроглия функцияларын орындау (пролиферация, миграция және үздіксіз фагоцитоз) орасан зор биосинтетикалық және биоэнергетикалық талап қояды, бұл Aβ ыдырауы кезінде жұмсалғандардың орнын толтыру үшін жаңа мембраналарды, гидролитикалық ферменттерді және органеллаларды үнемі синтездеуді талап etedi. АА миында микроглия бұл күйді сақтау үшін метаболикалық ресурстарды қалай алатыны әлі де нашар түсінілген.&lt;/p&gt;\n&lt;h4 id=\"mikrogliyanyng-metabolikalykh-toezimdiligin-zertteuding-keshendi-taesili\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#mikrogliyanyng-metabolikalykh-toezimdiligin-zertteuding-keshendi-taesili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Микроглияның метаболикалық төзімділігін зерттеудің кешенді тәсілі&lt;/span&gt;&lt;/a&gt;Микроглияның метаболикалық төзімділігін зерттеудің кешенді тәсілі&lt;/h4&gt;\n&lt;p&gt;Бұл жұмыста біз Aβ патологиясына микроглиальды тұрақтылықтың биосинтетикалық және биоэнергетикалық ерекшеліктерін сипаттау үшін интеграцияланған протеомиканы, транскриптомиканы, бір жасушалы РНК секвенирлеуін және &lt;em&gt;in vivo&lt;/em&gt; метаболикалық таңбалауды біріктіреміз. Біз Aβ патологиясымен бірге TREM2-ге тәуелді анаболикалық бағдарламаның жүретінін анықтаймыз, бұл ақуыз синтезі мен митохондриялық биогенездің үйлесімді өсуі болып табылады. Біз мұны &lt;em&gt;in situ&lt;/em&gt; фагоцитарлық шекарада анықтадық және дәл осы бағдарлама DAM транскрипциялық қолтаңбасына қарағанда фагоцитарлық қабілеті бар микроглияны ерекшелендіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Байқалған әсерлер тышқандар мен адам тіндерінде тексеріледі, алайда зертханалық нәтижелерді клиникаға ауыстыру иммундық жүйенің айырмашылықтарына байланысты сақтықты талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Күтпеген жерден, бұл бағдарлама өздігінен шектелетін болып шықты: ол төмен амилоидты жүктемесі бар микроглияда шыңына жетеді және жүктеме өскен сайын тышқан пен адам тіндерінде біртіндеп басылады. TREM2 болмаған жағдайда, микроглия бұл жауапты сақтамайды және оның орнына протеостатикалық шамадан тыс жүктеме мен митохондриялық дисфункцияны көрсетеді. Біз бұл бақылауларды микроглиальды тазартудың сұраныс-ұсыныс моделіне біріктіреміз және оның тиімділігі сол фагоцитарлық қабілетке тәуелді амилоидқа қарсы иммунотерапия үшін салдарын қарастырамыз.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"mikrogliya-amiloidty-patologiyagha-zhauap-retinde-trem2-ge-taeueldi-anabolikalykh-baghdarlamany-iske-khosady\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#mikrogliya-amiloidty-patologiyagha-zhauap-retinde-trem2-ge-taeueldi-anabolikalykh-baghdarlamany-iske-khosady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Микроглия амилоидты патологияға жауап ретінде TREM2-ге тәуелді анаболикалық бағдарламаны іске қосады&lt;/span&gt;&lt;/a&gt;Микроглия амилоидты патологияға жауап ретінде TREM2-ге тәуелді анаболикалық бағдарламаны іске қосады&lt;/h4&gt;\n&lt;p&gt;Микроглияның амилоидты патологияға бейімделу механизмдерін түсіну үшін ғалымдар 3 және 9 айлық жастағы App^NL-G-F және App&lt;sup&gt;NL-G-F;Trem2&lt;/sup&gt;KO тышқандарынан бөлініп алынған бастапқы микроглия жасушаларына кешенді протеомдық және транскриптомдық талдау жасады, бұл амилоидтың жиналуының ерте және аралық сатыларына сәйкес келеді (Сурет 1A).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-f1.jpg\" alt=\"1-сурет: Микроглия Aβ патологиясына протеомдық анаболикалық бейімделуді көрсетеді. (A) Эксперимент схемасы. Кешенді прот\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Микроглия Aβ патологиясына протеомдық анаболикалық бейімделуді көрсетеді. (A) Эксперимент схемасы. Кешенді протеомдық және транскриптомдық профильдеу үшін 3 және 9 айлық AppNL-G-F және AppNL-G-F;Trem2KO тышқандарынан бастапқы микроглия бөлініп алынды. (B) 9 айлық AppNL-G-F микроглиясындағы 3 айлық AppNL-G-F микроглиясымен салыстырғанда дифференциалды түрде көрінетін ақуыздардың (DAP) Ingenuity жолдарының талдауы (IPA), ақуыз синтезі жолдарының байытылуын атап көрсетеді (қызыл көрсеткілер). (C–D) Жасушалық компонент (C) және Биологиялық процесс (D) терминдері үшін гендер жиынтығын байыту талдауының (GSEA) нүктелік графиктер. Қызыл көрсеткілер 9 айлық AppNL-G-F микроглиясында «Рибосома» (анаболикалық) қолтаңбасының бір мезгілде байытылғанын көрсетеді, ал сары көрсеткілер 9 айлық AppNL-G-F микроглиясында байытылған «Лизосомалық мембрана» (катаболикалық) қолтаңбаларын көрсетеді. (E) IPA және (F) 9 айлық AppNL-G-F-тегі дифференциалды экспрессияланған геннің (DEG) GSEA, ақуыз трансляциясына (қызыл көрсеткілер) және катаболикалық процестерге (сары көрсеткілер) қатысатын гендерді көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Протеомдық және транскриптомдық талдау жасушадағы барлық ақуыздар мен белсенді гендерді бір уақытта бағалауға мүмкіндік береді, ал Trem2 гені нокаутка ұшыраған тышқан линиялары ауруға жауап қайтарудағы осы рецептордың рөлін түсінуге көмектеседі.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;App^NL-G-F микроглиясында протеомдық талдау 7000-нан астам ақуызды анықтады, олардың 2621-і 3 пен 9 ай аралығында айтарлықтай өөзгерген, бұл патологияның өршуіне қарай протеомның ауқымды түрде қайта құрылғанын көрсетеді. Ingenuity жолдарының талдауы (IPA) ақуыз синтезі жолдарының, соның ішінде трансляцияның басталуы, ұзаруы және аяқталуы, сондай-ақ EIF2 сигнал беру жолдарының қуатты түрде белсендірілгенін көрсетті (Сурет 1B). Жасушалық компоненттер мен биологиялық процестер бойынша гендер жиынтығын байыту талдауы (GSEA) цитозольді және митохондриялық рибосомалық кіші бірліктерді қоса алғанда, трансляция аппараты компоненттерінің көбейгенін растады (Сурет 1C–D; Сурет S1A). Сонымен қатар, аутофагосома, лизосома мембраналары және фагоцитарлық везикулалар сияқты деградация процестерімен байланысты ақуыздар да байытылды (Сурет 1C–D). Транскриптомдық талдау бұл бейімделу жауабын, аз дәрежеде болса да, растады және ақуыз трансляциясы (Сурет 1E), рибосомалар биогенезі мен митохондриялық тыныс алу тізбегі кешендері гендері экспрессиясының артқанын көрсетті (Сурет 1F; Сурет S1B). Жалпы алғанда, микроглия Aβ патологиясы кезінде үйлестірілген метаболикалық өзгерістерге ұшырайды, протеомның жаңаруын қамтамасыз ету үшін ақуыз синтезін жоғарылатылған деградация қабілетімен біріктіреді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS1.jpg\" alt=\"Кеңейтілген 1-сурет. (A) Гендік-концептуалдық желілік графиктер «кіші рибосомалық суббірлік», «үлкен рибосомалық суббірл\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Кеңейтілген 1-сурет. (A) Гендік-концептуалдық желілік графиктер «кіші рибосомалық суббірлік», «үлкен рибосомалық суббірлік» және «митохондриялық рибосома» гендік онтологиясы (GO) терминдерімен байланысты дифференциалды түрде көп ақуыздардың алғашқы 10-дығын көрсетеді. Бұл ақуыздар 3 айлық бақылау топтарымен салыстырғанда 9 айлық AppNL-G-F микроглиасында айтарлықтай байытылған. Визуализация Камада–Каваи орналасу алгоритмі арқылы жасалды. (B) AppNL-G-F микроглиасының транскриптомын көрсететін Биологиялық процестің (BP) терминдерінің Гендер жиынтығын байыту талдауының (GSEA) нүктелік графиктер. Қызыл көрсеткілер анаболикалық қолтаңбалардың байытылуын және қызғылт сары көрсеткілер 3 айлық аналогтармен салыстырғанда 9 айлық AppNL-G-F микроглиасында байытылған катаболикалық қолтаңбаларды көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Амилоидты патологияның дамуы жағдайында микроглия ақуыз синтезі мен ыдырауын күшейтеді, алайда TREM2 жетіспеушілігі 9 айға қарай бұл анаболикалық бағдарламаны толығымен бұзады.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл метаболикалық өзгерістердің TREM2-ге тәуелді екенін анықтау үшін авторлар App^NL-G-F және App&lt;sup&gt;NL-G-F;Trem2&lt;/sup&gt;KO тышқандарының профильдерін салыстырды. TREM2 жоқтығының әсері тікелей ауру сатысына байланысты болды. Aβ мөлшері ең аз болатын 3 айлық жаста TREM2 жетіспеушілігі микроглия протеомында айтарлықтай өзгеріс тудырған жоқ (Сурет S2A). Алайда, 9 айға қарай TREM2 жоғалуы протеомды түбегейлі бұзып, 1480 ақуыздың маңызды өзгеруіне әкелді (Сурет 2A). Протеом да, транскриптом деңгейінде де TREM2 жоғалуы аурумен байланысты микроглия (DAM) қолтаңбаларын, атап айтқанда Gpnmb, Cst7 және Lpl сияқты маркерлерді күрт төмендетті (Сурет 2A–B), бұл TREM2-нің Aβ стрессі кезінде гомеостатикалық микроглияны DAM-ға айналдырудағы шешуші рөлін растайды. DAM қолтаңбасының басылуынан басқа, TREM2 жетіспеушілігінің басты салдары анаболикалық жауаптың күйреуі болды. Протеомдық IPA трансляциямен байланысты жолдардың, соның ішінде SRP-ге тәуелді ақуызды бағыттау, трансляцияның ұзаруы мен аяқталуының айтарлықтай төмендегенін анықтады (Сурет 2C). GSEA цитозольді және митохондриялық рибосомалық компоненттердің, сондай-ақ рибосомалар биогенезінің қысқарғанын растады (Сурет 2D; Сурет S2B). Транскриптомдық талдау ақуыз трансляциясы, рибосомаларды жинау және митохондриялық кешендерге қатысатын гендер экспрессиясының төмендеуін көрсетіп, бұл нәтижелерді толықтырды (Сурет 2E–F; Сурет S2C).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS2.jpg\" alt=\"Кеңейтілген 2-сурет. (A) 3 айлық жаста AppNL-G-F;Trem2KO және AppNL-G-F микроглиалары арасында дифференциалды көп ақуызд\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Кеңейтілген 2-сурет. (A) 3 айлық жаста AppNL-G-F;Trem2KO және AppNL-G-F микроглиалары арасында дифференциалды көп ақуыздардың жоқтығын көрсететін Вулкан графикасы (түзетілген P &amp;lt; 0,05). (B, C) AppNL-G-F;Trem2KO микроглиасының протеомы мен транскриптомын көрсететін BP терминдерінің GSEA. Нүктелік графиктер 9 айлық AppNL-G-F аналогтарымен салыстырғанда AppNL-G-F;Trem2KO микроглиасының протеомындағы (B) және транскриптындағы (C) байытылған жолдарды иллюстрациялайды. Көк көрсеткілер басылған «рибосомалық» қолтаңбаларды көрсетеді. (D) ActivePathways көмегімен транскриптом мен протеомның бағытталған интеграциясының корреляциялық талдауы. AppNL-G-F микроглиасындағы (9 ай және 3 ай) бағытталған талдау (DPM, y-осі) және бағытталмаған талдау (Браун әдісі, x-осі) арқылы есептелген біріктірілген P мәндерін көрсететін шашырау диаграммасы. Мәндер жиынтығы бойынша бағыты бойынша дәйекті өзгерістері бар басым гендер диагональда немесе оған жақын орналасқан (көк), ал қарама-қайшы бағыт өзгерістері бар гендер жазаланып, диагональдан төменірек орналасқан (қоңыр). (E) AppNL-G-F микроглиасының көп омикалық жолды байытуы. AppNL-G-F микроглиасында анықталған, бірақ AppNL-G-F;Trem2KO микроглиасы деректер жиынтығында жоқ бірегей GO терминдерін көрсететін бағанды диаграмма. Көп омикалық деректерді біріктіру ActivePathways көмегімен орындалды, мұнда бағытталған p мәнін біріктіру (DPM) әдісі арқылы жасалған біріктірілген маңыздылық бағалары қолданылды. Бұл басым терминдер протеостазбен байланысты және алты функционалдық санатқа топтастырылған (түспен көрсетілген). Маңыздылық байыту талдауы үшін кіріс деректері ретінде біріктірілген P мәндері арқылы анықталды.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-f2.jpg\" alt=\"2-сурет: TREM2 тапшылығы анаболикалық жауаптың бұзылуына әкеледі. (A) 9 айлық AppNL-G-F және AppNL-G-F;Trem2KO микроглия\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: TREM2 тапшылығы анаболикалық жауаптың бұзылуына әкеледі. (A) 9 айлық AppNL-G-F және AppNL-G-F;Trem2KO микроглиясының протеомын салыстыратын жанартау диаграммасы. Үшбұрышты нүктелер AppNL-G-F;Trem2KO микроглиясындағы бірегей өзгерген ақуыздарды көрсетеді. Венн диаграммасы транскриптом мен протеом арасындағы бірегей және ортақ гендер мен ақуыздарды көрсетеді. (B) 9 айлық AppNL-G-F және AppNL-G-F;Trem2KO микроглиясының транскриптомын салыстыратын жанартау диаграммасы. (C) AppNL-G-F;Trem2KO микроглиясындағы ең жоғары ранкті жолдардың IPA талдауы, ақуыз трансляциясы жолдарының арнайы басылуын (көк көрсеткілер) және синаптикалық ақуыздар деңгейінің жоғарылауын (қызыл көрсеткілер) көрсетеді. (D) Trem2KO микроглиясында цитозольдік және митохондриялық рибосомалық компоненттердің кең көлемде азайғанын растайтын GSEA нүктелік графиктер (көк көрсеткілер); қызыл көрсеткілер синаптикалық және миелиндік қолтаңбалардың бір мезгілде жиналуын көрсетеді. (E) IPA және (F) 9 айлық AppNL-G-F және AppNL-G-F;Trem2KO микроглиясындағы дифференциалды экспрессияланған геннің (DEG) GSEA талдауы, ақуыз трансляциясы мен рибосомаға қатысатын басылған гендерді атап көрсетеді (көк көрсеткілер).&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Зерттеу қорытындылары жасанды мутациялары бар генетикалық тышқан үлгілерінде алынған, сондықтан нәтижелерді адамдардағы спорадиалық Альцгеймер ауруына тікелей көшіру кезінде сақтық таныту қажет.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Протеомның жаңаруындағы ақаулардың салдарынан Trem2^KO жасушаларында фагоцитоздан кейін тазартылуы тиіс синапстық және миелиндік ақуыздар жиналып қалды (Сурет 2C–D). Бұл протеостатикалық ақау ерекше жоғарылаған ақуыздардың көбі синапстық компоненттер болғанынан көрінді (Сурет 2A). Бұл деректер микроглия Aβ патологиясына протеомды қайта құрумен және протеостазды сақтаумен байланысты TREM2-ге тәуелді анаболикалық бағдарлама арқылы бейімделетінін көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"trem2-blyashkalarmen-bajlanyskhan-mikrogliyadaghy-zhanga-akhuyz-sintezin-yntalandyrady\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#trem2-blyashkalarmen-bajlanyskhan-mikrogliyadaghy-zhanga-akhuyz-sintezin-yntalandyrady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TREM2 бляшкалармен байланысқан микроглиядағы жаңа ақуыз синтезін ынталандырады&lt;/span&gt;&lt;/a&gt;TREM2 бляшкалармен байланысқан микроглиядағы жаңа ақуыз синтезін ынталандырады&lt;/h4&gt;\n&lt;p&gt;Омикалық талдаулар арқылы in vivo анықталған анаболикалық бағдарламаны растау үшін зерттеушілер жаңадан синтезделген ақуыздарды таңбалау мақсатында Fluorescent Non-Canonical Amino Acid Tagging (FUNCAT) әдісін қолданды (3A-сур.). Жаңа ақуыздар құрамына енетін метионин аналогы — азидогомоаланин (AHA) іш пердесіне енгізілгеннен кейін 16 сағат өткен соң, CX3CR1+ CD45+ микроглия жасушалары ағынды цитометрия көмегімен талданды (SN-сур.). 3 айлық жаста FUNCAT қарқындылығы AppNL-G-F және AppNL-G-F;Trem2KO тышқандарында бірдей болды. Алайda 9 айлық кезінде AppNL-G-F тышқандарының микроглиясында ақуыз синтезі шамамен екі есе өскені байқалды, ал TREM2 жетіспеушілігі бұл белсенділікті толығымен тежеді (3B-C-сур.). Гистограммалар AppNL-G-F микроглиясында жоғары FUNCAT деңгейі бар ерекше шағын популяцияның пайда болғанын көрсетті (3B-сур., қызыл көрсеткі). CD45high микроглия бляшкалардың маңында жиналатыны белгілі болғандықтан, авторлар мұны ақуыз синтезімен байланыстырып зерттеді. CD45high субпопуляциясы Aβ патологиясының өсуіне қарай кеңейсе де (SN-сур.), бұл процесс Trem2 нокаут жасалған тышқандарда байқалмады. CD45high микроглия жасушалары CD45low жасушаларына қарағанда айтарлықтай жоғары FUNCAT қарқындылығын көрсетті (3D-сур.), бұл бляшкалармен байланысқан микроглия ақуыз синтезі ең жоғары деңгейде жүретін негізгі популяция екенін білдіреді. In situ FUNCAT әдісі AppNL-G-F тышқандарының бляшка маңындағы микроглиясында ақуыз синтезінің күшейгенін растады, ал бұл әсер TREM2 болмаған кезде жоғалады (3E-F-сур.).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;FUNCAT — бұл стандартты емес аминқышқылдарын флуоресцентті түрде таңбалау арқылы тірі жасушалардағы жаңа ақуыз синтезінің жылдамдығын тікелей өлшеуге мүмкіндік беретін әдіс.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Трансляция аппаратының тікелей компоненті арқылы бұл өсуді растау үшін ғалымдар анаболикалық қолтаңба гендерінің бірі эукариоттық элонгация факторы 1α1 (EEF1A1) үшін бояу жұмыстарын жүргізді. EEF1A1 экспрессиясы AppNL-G-F тышқандарының бляшка маңындағы микроглиясында айтарлықтай артты, бірақ AppNL-G-F;Trem2KO тышқандарында бұл байқалмады (3G, H-сур.). Бұл деректер FUNCAT нәтижелерімен толық сәйкес келіп, анаболикалық бағдарламаның трансляциялық әлеуеттің артуымен тікелей байланысты екенін дәлелдеді. Аталған нәтижелер бұрын анықталған TREM2-mTOR осіне сәйкес келеді: mTORC1 белсенділігінің классикалық маркері болып табылатын фосфорланған рибосомалық ақуыз S6 (p-RPS6) бляшкалармен байланысқан микроглияда TREM2-ге тәуелді түрде өскен (SN-сур.). Жалпы алғанда, бұл нәтижелер TREM2-ге тәуелді анаболикалық бағдарлама бляшка маңындағы микроглияда трансляциялық әлеуеттің артуымен және жаңа ақуыз синтезімен бірге жүретінін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;9 айлық AppNL-G-F тышқандарында микроглиядағы ақуыз синтезі шамамен 2 есе артады, және бұл процесс толығымен функционалды TREM2 рецепторына тәуелді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"anabolikalykh-bejimdelu-trem2-ge-taeueldi-zhaene-ab-zhuektemesining-oesuimen-shekteledi\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#anabolikalykh-bejimdelu-trem2-ge-taeueldi-zhaene-ab-zhuektemesining-oesuimen-shekteledi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анаболикалық бейімделу TREM2-ге тәуелді және Aβ жүктемесінің өсуімен шектеледі&lt;/span&gt;&lt;/a&gt;Анаболикалық бейімделу TREM2-ге тәуелді және Aβ жүктемесінің өсуімен шектеледі&lt;/h4&gt;\n&lt;p&gt;Фагоцитарлық жүктеме мен метаболикалық жауап арасындағы байланысты бағалау үшін біз фибриллярлы Aβ-ны таңбалайтын Methoxy-X04 (X04) флуоресцентті зондын қолдана отырып, Aβ-мен әрекеттесетін микроглия транскриптомдарын талдадық (4A-сурет). AppNL-G-F және AppNL-G-F;Trem2KO тышқандарынан алынған бастапқы микроглия X04⁺ (фагоциттеуші) және X04⁻ (фагоциттемейтін) популяцияларға бөлінді. X04⁺ жасушалары қарқындылығы бойынша төмен, орташа және жоғары жүктеме топтарына жіктелді (4B-сурет). Патологияның ерте сатысында (5-6 ай) X04⁺ жасушаларының үлесі генотиптер арасында ұқсас болды, бұл Aβ-ны бастапқы жұтудың TREM2-ге тәуелді еместігін көрсетеді. Алайда, 9-10 айлық кезеңде TREM2 тапшылығы X04⁺ популяциясын айтарлықтай азайтты, бұл негізінен X04high субпопуляциясының жойылуымен байланысты (4B-C суреттері).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TREM2 тапшылығы амилоидты жұтуға кедергі жасамайды, бірақ 9 айлық жаста жоғары амилоидты жүктемесі бар (X04high) микроглияның өміршеңдігін күрт төмендетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Негізгі компоненттер талдауы (PCA) генотип пен X04 қарқындылығы градиентіне қарай транскриптомдық профильдердің нақты бөлінуін растады (4D-сурет; SN 4A-B суреттері). AppNL-G-F тышқандарында Aβ фагоцитозы митохондриялық жолдарды (тотығу фосфорлануы, электрон тасымалдау тізбегі) және ақуыз синтезі бағдарламаларын (трансляция, SRP-тәуелді бағыттау) күшейтеді (4E-сурет). TREM2-нің болмауы бұл бағдарламаны толығымен блоктайды (SN 4C-сурет). Талдаулар анаболикалық гендердің экспрессиясы X04low жасушаларында ең жоғары деңгейге жететінін және жүктеме артқан сайын төмендейтінін көрсетті. Керісінше, DAM-белгі жолдары (MHC II антигенін таныстыру) X04 қарқындылығымен бірге артады, ал қабыну жолдары (TNF, IFN-γ) басылады (4F-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DAM (Disease-Associated Microglia) — нейродегенерация кезінде микроглияның гомеостатикалық функцияларын жоғалтып, патологиямен күресу үшін гендерді белсендіретін арнайы күйі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Trem2KO тышқандарында анаболикалық жауап тіпті X04low және X04medium топтарында да байқалмайды (4G-сурет). Жүктеме артқан сайын бұл жасушаларда митохондриялық дисфункция белгілері, компенсаторлық гликолиз және қабыну сигналдарының күшеюі байқалады (4G-H суреттері). Қорытындылай келе, анаболикалық бағдарлама TREM2-ге тәуелді және өзін-өзі шектейді: ол Aβ жұтылғанда белсендіріледі, төмен жүктемеде шыңына жетеді және жүктеме артқан сайын сөнеді, бұл TREM2 тапшылығы кезінде микроглияның метаболикалық күйреуіне әкеледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тышқандардың модельдік желілерінде жүргізілді; анықталған метаболикалық өзгерістер адам патологиясы контекстінде расталуы керек.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"anabolikalykh-khabilet-fagocitarlykh-khuzyretti-mikrogliyanyng-belgisi-retinde\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#anabolikalykh-khabilet-fagocitarlykh-khuzyretti-mikrogliyanyng-belgisi-retinde\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анаболикалық қабілет фагоцитарлық құзыретті микроглияның белгісі ретінде&lt;/span&gt;&lt;/a&gt;Анаболикалық қабілет фагоцитарлық құзыретті микроглияның белгісі ретінде&lt;/h4&gt;\n&lt;p&gt;Микроглияның белсенуіндегі анаболикалық бейімделудің рөлін анықтау үшін 9-10 айлық AppNL-G-F тышқандарынан бөлінген X04⁺ (фагоциттейтін) және X04⁻ (фагоциттемейтін) жасушаларына scRNA-seq талдауы жасалды. Кластерлеу HM (гомеостатикалық), ARM (белсенген) және TRM (өтпелі) күйлерін анықтады (Сурет SN 5A-B). Алайда, классикалық DAM (аурумен байланысты микроглия) қолтаңбасын талдау DAM гендерінің X04⁺ және X04⁻ популяцияларында кеңінен таралғанын көрсетті (Сурет SN 5C). Бұл DAM транскрипциялық белгісінің фагоцитозбен айналысатын жасушаларды патологиялық ортаға жауап беретін жасушалардан ажыратуға жеткіліксіз екенін білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DAM — нейродегенерация кезінде микроглияда пайда болатын және көбінесе функционалдық белсенділіктің әмбебап маркері деп қате қабылданатын транскрипциялық профиль.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кластерлеу ажыратымдылығын арттыру арқылы HM-ді 0 (фагоциттемейтін) және 2 (фагоциттейтін), ал TRM-ді 6 (фагоциттемейтін) және 1 (фагоциттейтін) субкластерлерге бөлуге мүмкіндік туды (Сурет 5A, B). DAM модульдік ұпайлары фагоциттейтін және фагоциттемейтін жұптар арасында ұқсас болды (Сурет SN 5E), бұл DAM мен фагоцитоз арасындағы байланыстың әлсіз екенін растайды. IPA және GSEA талдаулары фагоцитарлық күйдің рибосома биогенезінің, ақуыз синтезінің және митохондриялық тотығу фосфорлануының синхронды күшеюімен сипатталатынын көрсетті (Сурет 5C; Сурет SN 5F-H).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-f5.jpg\" alt=\"5-сурет: Анаболикалық бейімделу қолтаңбасы фагоцитарлық құзыреттілікті канондық DAM қолтаңбасына қарағанда дәлірек анықт\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет: Анаболикалық бейімделу қолтаңбасы фагоцитарлық құзыреттілікті канондық DAM қолтаңбасына қарағанда дәлірек анықтайды. (A) 9-10 айлық AppNL-G-F тышқандарынан бөлініп алынған сұрыпталған X04+ (фагоциттейтін) және X04- (фагоцитемейтін) микроглияның бір жасушалы RNA-seq профильдерінің UMAP проекциясы (0,3 ажыратымдылықта). Жоғары ажыратымдылықтағы субкластерлеу канонды түрде анықталған Гомеостатикалық (HM) және Өтпелі (TRM) кластерлерді фагоцитарлық құзыреттілігі бойынша бөлінетін фагоциттейтін және фагоцитемейтін байытылған ішкі субпопуляцияларға бөледі (HM 0 және 2 кластерлеріне; TRM 1 және 6 кластерлеріне). (B) Әрбір субкластердің X04+ мен X04- фракцияларындағы салыстырмалы байытылуын көрсететін кластер құрамының сандық бағасы. (C) Фагоциттейтін байытылған субпопуляцияны (1-кластер) фагоцитемейтін субпопуляциямен (6-кластер) салыстыратын Гендер жиынтығын байыту талдауы (GSEA), фагоциттейтін субпопуляцияда Рибосома және Тотығу фосфорлану жолдарының күшті байығанын ашып көрсетеді. (D) Гомеостатикалық қолтаңбаның (Tmem119, P2ry12, Cx3cr1), DAM қолтаңбасының (Trem2, Cst7, Itgax, Cd74, H2-Aa) және Анаболикалық бейімделу қолтаңбасының (Atp5e, Cox4i1, Ndufa1, Eif3f, Eef1a1, Rpl10, Rpl13) анықталған субпопуляциялар бойынша экспрессиясын көрсететін скрипка графиктер. DAM қолтаңбасы фагоциттейтін және фагоцитемейтін күйлер арасында салыстырмалы болғанымен, анаболикалық бейімделу қолтаңбасы фагоцитарлық кластерлерде (1 және 2) таңдамалы түрде жоғарылаған. (E) Iba1, DAM маркері CD74 және FUNCAT (жаңа ақуыз синтезі) үшін бірлесіп боялған 9 айлық AppNL-G-F тышқандарындағы бляшкалармен байланысқан микроглияның өкілді конфокальды суреттері. Iba1high микроглиясының көпшілігі күшті FUNCAT сигналын көрсетеді, ал CD74 тек ішкі жиынтықта ғана индукцияланады. Масштабты сызық: 50 мкм. (F) Транскрипциялық DAM күйі анаболикалық белсенділікті болжамайтынын көрсететін, жеке Iba1+ микроглия ішіндегі FUNCAT және CD74 қарқындылығы арасындағы корреляцияның сандық бағасы (Пирсон R = -0,12, P = 0,187).&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Микроглияның фагоцитарлық белсенділігі классикалық DAM қолтаңбасына қарағанда анаболикалық профильмен (ақуыз және АТФ синтезі) жақсырақ сипатталады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анаболикалық бейімделу Eef1a1 трансляция факторының, рибосомалық суббірліктердің (Rpl10, Rpl13) және электрон тасымалдау тізбегі компоненттерінің (Ndufa1, Cox4i1, Atp5e) индукциясын қамтиды (Сурет 5D). Фагоциттейтін кластерлерде (1, 2) нейроқабыну сигналдары фагоциттемейтін кластерлерге (6, 0) қарағанда төмендеген (Сурет SN 5F, G). 9 айлық AppNL-G-F тышқандарының ми кесінділерінде Iba1, CD74 және FUNCAT әдісі арқылы жүргізілген тексерулер бляшкалар маңындағы көптеген жасушалардың (Iba1high) жоғары анаболикалық белсенділікке ие екенін, ал CD74 тек ішінара индукцияланып, FUNCAT қарқындылығымен корреляцияланбайтынын растады (R = −0.12, P = 0.187; Сурет 5E, F).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тышқандардың Альцгеймер моделінде жүргізілген; анаболизм мен фагоцитоз арасындағы корреляция тікелей себеп-салдарлық байланысты білдірмейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"anabolikalykh-baghdarlamanyng-zhojyluy-proteostatikalykh-shamadan-tys-zhuektelumen-bajlanysty\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#anabolikalykh-baghdarlamanyng-zhojyluy-proteostatikalykh-shamadan-tys-zhuektelumen-bajlanysty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анаболикалық бағдарламаның жойылуы протеостатикалық шамадан тыс жүктелумен байланысты&lt;/span&gt;&lt;/a&gt;Анаболикалық бағдарламаның жойылуы протеостатикалық шамадан тыс жүктелумен байланысты&lt;/h4&gt;\n&lt;p&gt;Біздің омикстік зерттеулеріміз микроглияның фагоцитозды қолдау қабілеті энергиямен қамтамасыз етуге тікелей байланысты екенін көрсетеді. Біз TREM2 тапшылығы фагоциттелген материалды қайта өңдеудің бұзылуына әкелетінін тексердік. Конфокальды микроскопия Trem2KO микроглиясында амилоидты бляшкалардың жанында постсинаптикалық PSD95 ақуызының айтарлықтай жиналатынын көрсетті (6-сурет A, B). Бұл шоғырлар CD68+ лизосомаларымен қоршалған, бұл деградация процестерінің тоқтап қалғанын білдіреді (SN-сурет). Осыған ұқсас жинақталу пресинаптикалық vGluT1 маркері (SN-сурет) және миелинді MBP ақуызы үшін де байқалды (6-сурет C, D). PSD95 пен MBP амилоид құрамына кірмейтіндіктен, олардың жинақталуы TREM2 арқылы жүретін анаболикалық қолдау болмаған кезде деградация механизмдерінің жалпы істен шыққанын көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TREM2 болмаған кезде микроглия фагоциттелген материалды қайта өңдей алмайды, бұл жасуша ішінде синаптикалық және миелиндік «қоқыстардың» жиналуына әкеледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Trem2KO микроглиясының бір бөлігінде біз PSD95 немесе MBP-ға толы ірі (2–8 мкм) көпіршіктерді байқадық (SN-сурет). 3D-реконструкция бұл құрылымдардың микроглия өсінділерінен пайда болып, олармен жіңішке нанотүтікшелер арқылы байланысқанын көрсетті (6-сурет E, H; SN-сурет). Мұндай өсінділердің ішінде Aβ, PSD95 және MBP жиналады. Сандық талдау бұл ауытқулардың күрт өскенін растады: 105 мкм³ көлемде AppNL-G-F;Trem2KO тышқандарында орташа есеппен 7–8 осындай өсінді анықталды, ал бақылау тобында 0,5-тен аз (6-сурет G, J). Бляшкалар айналасындағы Trem2KO микроглиясының 60–70%-ы протеостатикалық шамадан тыс жүктелу белгілерін көрсетті, ал бақылауда — 2%-дан аз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу трансгендік тышқандарда жүргізілді; жасушалардағы ақуыздардың жинақталуы функционалдық тапшылықты көрсетеді, бірақ адам патологиясына қатысты сақтықпен қарау керек.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"anabolikalykh-baghdarlamanyng-zhojyluy-mitohondriyalykh-disfunkciyamen-bajlanysty\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#anabolikalykh-baghdarlamanyng-zhojyluy-mitohondriyalykh-disfunkciyamen-bajlanysty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анаболикалық бағдарламаның жойылуы митохондриялық дисфункциямен байланысты&lt;/span&gt;&lt;/a&gt;Анаболикалық бағдарламаның жойылуы митохондриялық дисфункциямен байланысты&lt;/h4&gt;\n&lt;p&gt;Биоэнергетиканы бағалау үшін біз MitoTracker Green (митохондрияның жалпы массасы) және Red CMXRos (мембраналық потенциал) бояғыштарымен ағынды цитометрияны қолдандық. AppNL-G-F тышқандарында бляшкалар жанындағы микроглия (CD45high) Aβ клиренсіне бейімделіп, потенциалды да, лизосомалық массаны да арттырды (7-сурет A, B). Керісінше, Trem2KO-да ажырау байқалды: митохондрия массасы артқанымен, олардың мембраналық потенциалы төмендеді. Митохондриялық денсаулық индексі Trem2KO жасушаларында айтарлықтай төмен болды (7-сурет C), бұл метаболикалық тұрғыдан белсенді емес митохондриялардың жинақталуын білдіреді. Лизосомалық масса (LysoTracker) генотиптер арасында ерекшеленбеді (7-сурет D).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Митохондриялық денсаулық индексі — бұл функционалды белсенді митохондрияларды зақымдалғандарынан ажыратуға мүмкіндік беретін есептік көрсеткіш.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Биогенезді бағалау үшін біз AHA метаболикалық таңбасын және жаңа синтезделген TOM20 ақуызын анықтау үшін PLA-талдауын қолдандық. AppNL-G-F тышқандарында бляшкалар жанындағы микроглия белсенді түрде жаңа митохондриялар синтездеді (TOM20-PLA+ сигналы; 7-сурет E, F). Trem2KO-да бұл процесс басылған, бұл митохондриялық биогенезді индукциялау үшін TREM2 қажет екенін дәлелдейді. Жаңару болмаса да, Trem2KO жасушаларында митохондриялардың жалпы массасы жоғары болып қалды (SN-сурет), бұл ескі органеллалардың жинақталуын көрсетеді. VDAC1 және аутофагия рецепторы p62/SQSTM1-ді бірге бояу Trem2KO микроглиясында P62+/VDAC1+ агрегаттарын анықтады (7-сурет G, H), бұл митофагия — зақымдалған митохондрияларды жою процесінің бұзылғанын білдіреді.&lt;/p&gt;\n&lt;h4 id=\"adam-mikrogliyasyndaghy-anabolikalykh-baghdarlamanyng-alcgejmer-auruynyng-oershuimen-aelsireui\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#adam-mikrogliyasyndaghy-anabolikalykh-baghdarlamanyng-alcgejmer-auruynyng-oershuimen-aelsireui\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Адам микроглиясындағы анаболикалық бағдарламаның Альцгеймер ауруының өршуімен әлсіреуі&lt;/span&gt;&lt;/a&gt;Адам микроглиясындағы анаболикалық бағдарламаның Альцгеймер ауруының өршуімен әлсіреуі&lt;/h4&gt;\n&lt;p&gt;Тышқандарда анықталған анаболикалық бағдарламаның адам ауруындағы маңыздылығын тексеру үшін біз 523 донордың жасы мен Браак сатылары жазылған адам миының ядролық транскриптом атласын (ssKIND) талдадық (1-кесте). Әрбір микроглия ядросы үш модуль бойынша бағаланды: анаболикалық, DAM (аурумен байланысты микроглия) және гомеостатикалық. Талдаулар бұл күйлердің транскриптом картасында бөлек аймақтарды алатынын көрсетті, бұл анаболикалық күйдің ерекшелігін растайды (8A-сурет, SN-сурет). Ауру 0–II сатыдан V–VI сатыға өткенде, анаболикалық индекс жасқа қарай түзетілгенде айтарлықтай төмендеді (β = -0,41, P = 1,8 × 10⁻⁵; Spearman R = -0,35), ең күрт төмендеу III–IV және V–VI сатылар арасында байқалды (8B-сурет). Бақылау гендері мен анықталған гендер саны тұрақты болып қалды, бұл техникалық қателіктерді жоққа шығарады (SN-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Адам микроглиясының анаболикалық белсенділігі Альцгеймер ауруында прогрессивті түрде төмендейді, бұл жоғары анаболикалық индексі бар жасушалар үлесінің III–IV сатылардағы 66,7%-дан V–VI сатылардағы 21,4%-ға дейін қысқаруында көрінеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Браак сатылары — бұл мидағы патологиялық ақуыздардың таралуына негізделген нейродегенерацияның ауырлығын бағалау жүйесі: бастапқы (I–II) сатылардан кешкі (V–VI) сатыларға дейін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз микроглияларды «анаболикалық белсенді» (индекс бойынша жоғарғы 30%) топтарға бөлдік және олардың үлесіндегі өзгерістерді талдадық. Мұндай жасушалардың үлесі кешкі сатыларда күрт қысқарды (P &amp;lt; 1 × 10⁻⁴, Spearman R = -0,32; 8C-сурет), ал топ ішіндегі орташа индекс аздап төмендеді (8D-сурет). Декомпозиция төмендеудің шамамен 62%-ы жасушалар санының азаюымен, ал 38%-ы жасуша ішіндегі белсенділіктің төмендеуімен байланысты екенін көрсетті (SN-сурет). TREM2 экспрессиясы барлық сатыларда анаболикалық индекспен оң корреляция жасады (8E-сурет) және бұл байланыс Браак сатысы бақыланғанда да сақталды (ішінара корреляция коэффициенттері +0,24-тен +0,35-ке дейін; SN-сурет), бұл функционалдық байланысты көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу мидың өлімнен кейінгі транскриптом деректеріне негізделген, сондықтан анықталған корреляциялар TREM2 мен анаболизм арасындағы тікелей себеп-салдарлық байланысты дәлелдемейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анаболикалық бағдарлама мен DAM-таңбаның орташа көрсеткіштері қарама-қарсы бағытта өзгергенімен (8F-сурет), Браак сатысы бақыланғанда олардың арасында оң байланыс анықталды (ішінара R = 0,23; 8H-сурет) және TREM2-мен де (ішінара R = +0,28, P &amp;lt; 1 × 10⁻⁴; SN-сурет). Бұл аурудың бір сатысында анаболизм мен DAM-күйі бірге өмір сүре алатынын, бірақ патология өршіген сайын DAM-таңба сақталса да, анаболикалық бағдарламаның әлсірейтінін білдіреді. Бұл биосинтетикалық құзыреттіліктің микроглияның функционалдық тұрақтылығының классикалық DAM-маркерлеріне қарағанда тәуелсіз және дәлірек көрсеткіші екенін растайды.&lt;/p&gt;\n&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;h4 id=\"alcgejmer-auruy-kezindegi-mikrogliyanyng-belsendilenui\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#alcgejmer-auruy-kezindegi-mikrogliyanyng-belsendilenui\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Альцгеймер ауруы кезіндегі микроглияның белсенділенуі&lt;/span&gt;&lt;/a&gt;Альцгеймер ауруы кезіндегі микроглияның белсенділенуі&lt;/h4&gt;\n&lt;p&gt;Альцгеймер ауруы кезінде микроглияның белсенділенуі дәстүрлі түрде аурумен байланысты микроглия (DAM) күйіне өтуімен анықталады. Бұл қолтаңба фагоцитарлық рецепторларды (мысалы, Clec7a, Axl, MerTK) қамтитындықтан, DAM фенотипі көбінесе күшейтілген фагоцитарлық функциямен теңестіріледі. Біздің нәтижелеріміз бұл теңдіктің дұрыс емес екенін көрсетеді. Бір жасушалы және in situ талдауларында DAM қолтаңбасы мен фагоцитарлық қабілет ажыратылды: DAM модулінің көрсеткіштері метаболикалық жетіспеушілігі бар микроглияның өзінде патологиялық жүктемеге сай болды, ал жеке, TREM2-ге тәуелді анаболикалық бағдарлама (митохондриальды биогенезбен байланысқан күшейтілген ақуыз синтезі) функционалды түрде белсенді жасушаларды жақсырақ ажыратты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DAM транскрипциялық қолтаңбасы тазартуға деген тек «сұранысты» көрсетсе, микроглияның функционалдық тұрақтылығы тәуелсіз, TREM2-ге тәуелді анаболикалық бағдарламамен («ұсыныс») анықталады, ол патология күшейген сайын таусылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;In situ талдауы — тіндердің табиғи құрылымын бұзбай, жасушаларды өз ортасында тікелей зерттеу әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Перифериялық макрофагтарда метаболизм көбінесе гликолитикалық қабынуға қарсы және тотығу-фосфорлануға тәуелді қабынуға қарсы емес күйлерге бөлінеді. Біздің мәліметтеріміздегі бляшкалармен байланысқан микроглия бұл бинарлыққа сай келмеді, бір мезгілде биомасса синтезін және митохондриальды тыныс алуды қосты, бұл белсендірілген T-жасушаларындағы mTOR басқаратын трансляциялық және митохондриальды сыйымдылықтың ұлғаюын еске түсіреді. Ұсынылып отырған функционалдық мәні протеостатикалық болып табылады: Aβ және жасушалық қоқыстарды үздіксіз ішке қабылдау лизосомалық ферменттерді, мембраналарды және АТФ-ты гомеостатикалық синтез ауыстыра алатын жылдамдықтан тезірек тұтынады. Байқалған рибосомалық және митохондриальды биогенездің жоғарылауы осы протеостатикалық ресурс пен сыйымдылықты сақтауға қызмет етуі мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Митохондриальды биогенез жетіспеушілігі мен Trem2KO микроглиясындағы функционалдық бұзылулар арасындағы себеп-салдарлық тізбек ассоциативті сипатқа ие, өйткені анаболикалық өске тікелей әсер ететін ортогональды манипуляция жасалған жоқ.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл бақылауларды адам ауруына кеңейте отырып, біз Браак сатыларын қамтитын біріктірілген адам ядролық атласы арқылы микроглияның анаболикалық бейімделуін зерттедік. Анаболикалық бағдарлама кеш Браак сатысында (V-VI) микроглияда төмендеді және ауру сатысы шегінде TREM2-мен оң байланыста қалды, бұл оның адам микроглиясында сақталғанын және аурудың өршуімен бірге жойылатынын көрсетеді. Тышқанның X04 градиенті және адамның Браак градиенті осылайша жүктемеге тәуелді бірдей басылуды екі масштабта сипаттайды. Бұл бақылаулар кросс-секциялық және корреляциялық сипатта болғанымен, түраралық ұқсастық анаболикалық өстің адамның Альцгеймер ауруы үшін маңыздылығын нығайтады.&lt;/p&gt;\n&lt;p&gt;Бұл бақылаулар амилоидқа қарсы иммунотерапия үшін потенциалды салдарға ие. Aβ-ға бағытталған антителалардың клиникалық тиімділігі ішінара микроглияның Fc-рецептор арқылы фагоцитозды жүзеге асыру қабілетіне байланысты, бұл айтарлықтай биоэнергетикалық шығынды талап етеді. Егер фагоцитозды қолдайтын анаболикалық бағдарламаның өзі фагоцитарлық жүктемемен басылса, онда ұзақ мерзімді фармакологиялық стимуляция микроглияны биосинтетикалық шаршауға әкелуі мүмкін. Бұл амилоидты иммунотерапияны анаболикалық өсті қолдайтын шаралармен біріктіру микроглияның тазарту қабілетін сақтауға көмектеседі деген гипотезаны тудырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Патологияның өсуі кезінде микроглияның анаболикалық әлеуетінің төмендеуі амилоидқа қарсы иммунотерапияның сәттілігіне қатер төндіреді, бұл тазарту қабілетін сақтау үшін метаболикалық қоспаларды бірге қолдану қажеттілігін көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Негізгі реагенттер мен ресурстар&lt;/strong&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Реагент немесе ресурс&lt;/th&gt;\n&lt;th&gt;Дереккөз&lt;/th&gt;\n&lt;th&gt;Идентификатор&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\
