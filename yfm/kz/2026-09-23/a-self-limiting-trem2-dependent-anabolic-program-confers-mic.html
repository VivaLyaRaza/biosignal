;td&gt;v0.10.2 / v0.11.9&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;umap-learn&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;v0.5.9&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;numpy / pandas / scipy / statsmodels&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;v2.2.5 / v2.3.3 / v1.15.3 / v0.14.5&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;matplotlib / seaborn&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;v3.10.8 / v0.13.2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;GraphPad Prism&lt;/td&gt;\n&lt;td&gt;GraphPad Software&lt;/td&gt;\n&lt;td&gt;v9.5.1; RRID:SCR_002798&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h4 id=\"eksperimenttik-modelder-zhaene-nysan-sipattamalary\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#eksperimenttik-modelder-zhaene-nysan-sipattamalary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эксперименттік модельдер және нысан сипаттамалары&lt;/span&gt;&lt;/a&gt;Эксперименттік модельдер және нысан сипаттамалары&lt;/h4&gt;\n&lt;p&gt;Зерттеу барысында App^NL-G-F линиясындағы тышқандар мен Trem2 гені нокаут жасалған тышқандар (Trem2KO, #027197 штаммы) пайдаланылды. Қос мутантты алу үшін App^NL-G-F тышқандары Trem2KO-мен будандастырылып, екі модификация бойынша да гомозиготты App^NL-G-F; Trem2KO ұрпағы алынды. Жануарлар патогенсіз тосқауылды виварийде, стандартты 12 сағаттық жарық пен қараңғылық циклінде, су мен азыққа еркін қолжетімділік жағдайында ұсталды. Торлардың тығыздығы бір торға ең көбі 5 дарақтан келетіндей етіп сақталды. Тәжірибелерге еркек те, ұрғашы тышқандар да қатысты. Жануарлармен жасалатын барлық процедуралар Ұлттық денсаулық сақтау институттарының (NIH) нұсқаулықтарына қатаң сәйкес жүргізіліп, Огайо штаты университетінің Жануарларды күту және пайдалану комитетімен (IACUC) мақұлданды. Адам микроглиасына деректерді талдау үшін ssKIND біріктірілген ядролық атласынан жасушалар іріктелді. Микроглиа ретінде аннотацияланған (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zj3gjfym\"&gt;cell_type = “Microglia”&lt;/code&gt;), Альцгеймер ауруы диагнозы расталған (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vaj9ie12\"&gt;Disease_consistent = “AD”&lt;/code&gt;) және жасы мен Браак сатылары бойынша сенімді метадеректері бар донорлардың жасушалары қалдырылды. Браак сатылары 0–II, III–IV, V–VI топтарға бөлінді; донорлардың жасы 51–78 жас және 78 жастан асқан деп топтастырылды (ең жас 20–51 жастағы топта Альцгеймерге сәйкес келетін микроглиа жасушалары болмады). Қорытынды деректер жиынтығы ми аймақтарынан жиналған 523 донордан алынған 204 283 микроглиа жасушасын қамтыды. Өңделмеген бүтін сан есептегіштері псевдобулк жинақтау үшін сақталды, ал кластерлеу мен орналастыру үшін біріктірілген scVI латентті кеңістігі (30 өлшемді) қолданылды. Егер басқаша көрсетілмесе, талдаулар барлық жастағы донорларды біріктіріп, тек Браак сатыларын ғана ажыратады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ген нокауты — зертханалық жануарларда белгілі бір геннің қызметін зерттеу мақсатында оны әдейі жұмыс істемейтін етіп өшіру әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"aedis-turaly-tolykh-maelimet\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#aedis-turaly-tolykh-maelimet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдіс туралы толық мәлімет&lt;/span&gt;&lt;/a&gt;Әдіс туралы толық мәлімет&lt;/h4&gt;\n&lt;p&gt;In vivo метаболикалық таңбалау үшін тышқандарға стерильді фосфат-тұзды буферде (PBS) ерітілген азидогомоаланин (AHA) 50 мг/кг дозада құршішілік инъекция арқылы егілді. Жануарлар инъекциядан кейін 16 сағат өткен соң эвтаназия жасалды. Ағынды цитометрия үшін бөлінген жасушалар өндірушінің нұсқаулығына сай Click-iT Cell Reaction Buffer Kit жиынтығы көмегімен Alexa Fluor 647-Alkyne заттарымен әрекеттестірілді. Жақындықты лигирлеу талдауы (PLA) үшін мидың еркін кесінділері антиденелермен инкубациялау алдында Click-iT жиынтығын қолдана отырып, биотин-алкинмен әрекетке түсірілді. Ересек тышқандардың микроглиасын бөліп алу және сұрыптау магнитті-белсендірілген жасушалық сұрыптау (MACS) әдісімен жүзеге асырылды. Жануарларға наркоз беріліп, қан айналымындағы лейкоциттерді шайып шығару үшін мұздатылған PBS көмегімен жүрек арқылы перфузия жасалды. Ми кесіліп, мұзда салқындатылды және Neural Tissue Dissociation Kit (P) мен gentleMACS Tissue Dissociator құрылғысы көмегімен ыдыратылды. Жасуша суспензиясы 70 мкм сүзгі арқылы өткізіліп, 300 × g жылдамдықта 10 минут бойы центрифугаланды. Миелин Myelin Removal Beads II магниттік моншақтары арқылы аластатылды. Алынған біржасушалы суспензия дереу цитометрияға қолданылды немесе CD11b MicroBeads мен LS бағандары арқылы транскриптомдық талдау үшін байытылды.&lt;/p&gt;\n&lt;p&gt;Амилоидты жүктемені бағалау үшін Метокси-X04 (X04) қосындысы диметилсульфоксидте (DMSO) ерітіліп, артынан тұрақты сарғыш-жасыл эмульсия алу үшін пропиленгликоль мен PBS қоспасында (1:1 қатынасында) сұйылтылды. Жаңадан дайындалған ерітінді тіндерді жинауға 16 сағат қалғанда 10 мг/кг дозада құршішілік егілді. Ағынды цитометриялық талдау үшін бөлінген жасушалар өлі жасушаларды алып тастау және арнайы емес байланысуды болдырмау үшін Fixable Viability Dye eFluor 780 (1:1000) және anti-CD16/32 (Fc Block, 1:200) реагенттерімен инкубацияланды. Содан кейін жасушалар CD11b, CD45 және CX3CR1 маркерлеріне қарсы флуороформен конъюгацияланған антиденелермен боялды. Тірі микроглиалар (CD45^int; CD11b⁺; CX3CR1⁺) DAPI қоздыру арнасындағы (405 нм) флуоресценция бойынша X04⁺ немесе X04⁻ болып гейттелді. Гейтинг шектерін анықтау үшін Метокси-X04 егілген жабайы типтегі жануарлар биологиялық теріс бақылау ретінде пайдаланылды.&lt;/p&gt;\n&lt;h4 id=\"pla-in-situ-proximity-ligation-assay-aedisimen-taldau\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#pla-in-situ-proximity-ligation-assay-aedisimen-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PLA (In Situ Proximity Ligation Assay) әдісімен талдау&lt;/span&gt;&lt;/a&gt;PLA (In Situ Proximity Ligation Assay) әдісімен талдау&lt;/h4&gt;\n&lt;p&gt;Жаңадан түзілген митохондриялық ақуыздарды визуалдау үшін AHA енгізілген тышқандардың ми кесінділері биотин-алкинмен «клик-реакцияға» түсірілді. Жуылғаннан кейін кесінділер TOM20 (1:500) және биотинге (1:500) қарсы антиденелермен инкубацияланды. Сигналды күшейту үшін өндірушінің хаттамасына сәйкес PLA зондтары (Duolink) қолданылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PLA әдісі жасуша ішіндегі ақуыздық өзара әрекеттесулерді немесе молекулаларды жоғары дәлдікпен анықтауға мүмкіндік береді, мұнда тек екі нысаналы антидене 40 нм-ден жақын қашықтықта орналасқанда ғана флуоресцентті сигнал түзіледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rnkh-sekvenirleu-zhaene-bioinformatika\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#rnkh-sekvenirleu-zhaene-bioinformatika\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;РНҚ секвенирлеу және биоинформатика&lt;/span&gt;&lt;/a&gt;РНҚ секвенирлеу және биоинформатика&lt;/h4&gt;\n&lt;p&gt;Микроглиядан жалпы РНҚ Quick-RNA жиынтығы арқылы бөлініп алынды (РНҚ тұтастық индексі &amp;gt; 8). cDNA кітапханалары SMART Seq® mRNA LP Kit көмегімен дайындалып, HiSeq 4000 жүйесінде секвенирленді. FASTQ деректері STAR (v2.7.10a) арқылы тышқан геномына (GRCm39) теңестірілді, Flexbar арқылы адаптерлер алынып тасталды және featureCounts арқылы есептелді. Талдау R (v4.3.3) ортасында жүргізілді.&lt;/p&gt;\n&lt;h4 id=\"sandykh-proteomdykh-taldau\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#sandykh-proteomdykh-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сандық протеомдық талдау&lt;/span&gt;&lt;/a&gt;Сандық протеомдық талдау&lt;/h4&gt;\n&lt;p&gt;Ми лизаттары (5% SDS, 50 мМ TEAB) STrap Midi MS құрылғысының көмегімен өңделді (әр үлгі үшін 2000 мкг ақуыз). Процесс DTT-мен қалпына келтіруді, иодоацетамидпен алкилдеуді және трипсин/Lys-C-мен қорытуды қамтыды. Пептидтер TMT-белгілерімен белгіленіп, біріктірілді және HPLC (12 фракция) арқылы фракцияланды. Талдау Proteome Discoverer 2.5 көмегімен LC-MS/MS жүйесінде жүргізілді. FDR ≤ 0.05 (Бенджамини-Хохберг әдісі) маңызды деп қабылданды.&lt;/p&gt;\n&lt;h4 id=\"gistologiyalykh-taldau-zhaene-mikroskopiya\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#gistologiyalykh-taldau-zhaene-mikroskopiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гистологиялық талдау және микроскопия&lt;/span&gt;&lt;/a&gt;Гистологиялық талдау және микроскопия&lt;/h4&gt;\n&lt;p&gt;Қалыңдығы 40 мкм ми кесінділері иммунофлуоресцентті әдіспен (Aβ, Iba1, PSD95, VGLUT1, TOM20, VDAC1, MBP, Caspase-3, CD74 маркерлерімен) боялды. Кескіндер ZEISS Axio Observer немесе Nikon AXR конфокалды микроскоптарында алынды. 2D кескіндер ImageJ бағдарламасында «Otsu» немесе «Triangle» автоматты шектері арқылы талданды. Статистика t-критерийі немесе ANOVA арқылы есептелді.&lt;/p&gt;\n&lt;h4 id=\"bir-zhasushaly-sekvenirleu-scrna-seq\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#bir-zhasushaly-sekvenirleu-scrna-seq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бір жасушалы секвенирлеу (scRNA-seq)&lt;/span&gt;&lt;/a&gt;Бір жасушалы секвенирлеу (scRNA-seq)&lt;/h4&gt;\n&lt;p&gt;Кітапханалар 10x Genomics Chromium (әр үлгі үшін 10 000 жасуша) көмегімен дайындалып, Illumina NovaSeq жүйесінде секвенирленді (әр жасуша үшін 50 000–100 000 оқылым). Деректер Cell Ranger (v7.0.0) арқылы mm10 геномына теңестірілді. Seurat (v4.1.1) көмегімен &amp;lt; 1500 белгісі, &amp;lt; 3000 UMI немесе &amp;gt; 5% митохондриялық оқылымы бар жасушалар алынып тасталды.&lt;/p&gt;\n&lt;h4 id=\"statistikalykh-taldau-zhaene-funkcionaldy-bajytu\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#statistikalykh-taldau-zhaene-funkcionaldy-bajytu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистикалық талдау және функционалды байыту&lt;/span&gt;&lt;/a&gt;Статистикалық талдау және функционалды байыту&lt;/h4&gt;\n&lt;p&gt;Гендердің дифференциалды экспрессиясы (DEG) DESeq2 (v1.42.1) көмегімен FDR &amp;lt; 0.05 деңгейінде есептелді. Жолдар талдауы IPA (Ingenuity Pathway Analysis) арқылы z-score көмегімен жүзеге асырылды. GSEA талдауы clusterProfiler пакеті арқылы өткізілді, гендер log2 Fold Change және p-мәні бойынша реттелді. Нәтижелер нүктелі диаграммалар және «ген-концепция» желілері (cnetplot) арқылы визуалдандырылды.&lt;/p&gt;\n&lt;h4 id=\"3d-konfokaldy-vizualizaciya-zhaene-ierarhiyalykh-statistikalykh-modeldeu\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#3d-konfokaldy-vizualizaciya-zhaene-ierarhiyalykh-statistikalykh-modeldeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3D конфокальды визуализация және иерархиялық статистикалық модельдеу&lt;/span&gt;&lt;/a&gt;3D конфокальды визуализация және иерархиялық статистикалық модельдеу&lt;/h4&gt;\n&lt;p&gt;Iba1-оң (Iba1+) микроглиалды қызығушылық аймақтарының (ROI) морфологиялық және биохимиялық қасиеттерін сандық бағалау үшін Nikon AXR конфокальды микроскопы қолданылды. AppNL-G-F тышқандарындағы микроглияның жоғары тығыздығына байланысты, ROI жеке жасушалар емес, морфологиялық бірліктер ретінде анықталды. Реконструкция және талдау Imaris (v11.0) бағдарламасында орындалды. Iba1+ беттерін сегменттеу машиналық оқыту алгоритмі арқылы жүзеге асырылды. Маркерлердің көлемдік колокализациясы фондық шуды түзету арқылы есептелді және көлемдер воксел санына ауыстырылды. Iba1+ беттеріндегі маркерлердің орташа флуоресценция қарқындылығы өлшенді. Микроглия плакалармен байланысты (PAM) және байланысты емес (NPAM) түрлеріне бөлінді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ROI (қызығушылық аймағы) — талданатын кескіннің бөлінген бөлігі, ал GLMM — деректердің иерархиялық құрылымын (мысалы, бір жануардан алынған көптеген ROI) ескеретін статистикалық модель.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Иерархиялық деректерді талдау үшін R ортасында (glmmTMB, emmeans пакеттері) жалпыланған сызықтық аралас модельдер (GLMM) қолданылды. Пропорционалды деректер үшін бета-биномиалды, үздіксіз деректер үшін гамма-таралу таңдалды. Модельдердің сәйкестігі DHARMa пакетімен тексерілді. Нәтижелер 95% сенімділік интервалдарымен бағаланған маржиналды орташа мәндер (EMM) ретінде ұсынылды.&lt;/p&gt;\n&lt;h4 id=\"mikrogliya-khosyndylaryn-sandykh-taldau-zhaene-parametrlik-emes-statistika\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#mikrogliya-khosyndylaryn-sandykh-taldau-zhaene-parametrlik-emes-statistika\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Микроглия қосындыларын сандық талдау және параметрлік емес статистика&lt;/span&gt;&lt;/a&gt;Микроглия қосындыларын сандық талдау және параметрлік емес статистика&lt;/h4&gt;\n&lt;p&gt;Қосындылардың тығыздығы (PSD95, MBP) «соқыр» әдіспен бағаланды: бірінші талдаушы плаканы белгіледі, екіншісі қосындыларды санады. Тығыздық плака көлемінің 10⁵ µ m³ бөлігіне келетін қосындылар саны ретінде көрсетілді. AK (бақылау) және AKTK (тәжірибе) топтары арасындағы айырмашылықтарға байланысты стандартты GLMM сәйкес келмеді, сондықтан coin (v1.4.3) пакетінің көмегімен нақты ауыстырымды Вилкоксон тесті қолданылды.&lt;/p&gt;\n&lt;h4 id=\"aldyn-ala-khalypkha-keltiru-zhaene-dubletterdi-zhoyu\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#aldyn-ala-khalypkha-keltiru-zhaene-dubletterdi-zhoyu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Алдын ала қалыпқа келтіру және дублеттерді жою&lt;/span&gt;&lt;/a&gt;Алдын ала қалыпқа келтіру және дублеттерді жою&lt;/h4&gt;\n&lt;p&gt;Seurat көмегімен сапаны бақылаудан (QC) кейін деректер қалыпқа келтірілді. Митохондриялық және рибосомалық гендердің үлесі сақталды. DoubletFinder (v2.0.3) көмегімен дублеттер (орташа 10%) анықталып, жойылды. Қорытынды талдауда 26 096 жасуша қалды.&lt;/p&gt;\n&lt;h4 id=\"sctransform-khalypkha-keltirui,-integraciya-zhaene-klasterleu\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#sctransform-khalypkha-keltirui,-integraciya-zhaene-klasterleu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SCTransform қалыпқа келтіруі, интеграция және кластерлеу&lt;/span&gt;&lt;/a&gt;SCTransform қалыпқа келтіруі, интеграция және кластерлеу&lt;/h4&gt;\n&lt;p&gt;SCTransform көмегімен қалыпқа келтіру жүргізіліп, 3000 ең өзгермелі ген таңдалды. Төрт үлгіні интеграциялау үшін FindIntegrationAnchors және IntegrateData (reciprocal PCA, k=5) функциялары пайдаланылды. Кластерлеу Louvain алгоритмімен (20 негізгі компонент, 0.3 ажыратымдылық) орындалды. Визуализация UMAP арқылы жүзеге асырылды.&lt;/p&gt;\n&lt;h4 id=\"klasterlerdi-annotaciyalau-zhaene-differencialdy-ekspressiya\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#klasterlerdi-annotaciyalau-zhaene-differencialdy-ekspressiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кластерлерді аннотациялау және дифференциалды экспрессия&lt;/span&gt;&lt;/a&gt;Кластерлерді аннотациялау және дифференциалды экспрессия&lt;/h4&gt;\n&lt;p&gt;Жасуша түрлері маркерлер (Вилкоксон тесті) және AppNL-G-F деректер базасымен салыстыру арқылы анықталды. Микроглия емес жасушалар шығарылғаннан кейін (25 776 қалды), 7 микроглия күйі анықталды. Дифференциалды экспрессияланған гендер (DE) Бонферрони түзетуімен (p &amp;lt; 0.05) анықталды.&lt;/p&gt;\n&lt;h4 id=\"gen-modulderi-men-signaturalar-taldauy\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#gen-modulderi-men-signaturalar-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ген модульдері мен сигнатуралар талдауы&lt;/span&gt;&lt;/a&gt;Ген модульдері мен сигнатуралар талдауы&lt;/h4&gt;\n&lt;p&gt;Микроглия күйлерін (HM, ARM, TRM, IRM, CPM, DAM т.б.) бағалау үшін AddModuleScore функциясы пайдаланылды. Экспрессия деңгейлері «скрипка» графиктерде (stacked violin plots) көрсетілді.&lt;/p&gt;\n&lt;h4 id=\"multi-omika-zhaene-integrativti-taldau\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#multi-omika-zhaene-integrativti-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мульти-омика және интегративті талдау&lt;/span&gt;&lt;/a&gt;Мульти-омика және интегративті талдау&lt;/h4&gt;\n&lt;p&gt;AppNL-G-F және Trem2KO тышқандарынан алынған РНҚ-секвенирлеу және протеомика деректері интеграцияланды. Venn диаграммасы (VennDiagram v1.7.3) арқылы қиылысулар анықталды. Ортақ процестерді табу үшін Brown әдісі және [mRNA=1, protein=1] салмақ векторымен ActivePathways әдісі қолданылды.&lt;/p&gt;\n&lt;h4 id=\"integrativti-zholdardy-bajytu-taldauy\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#integrativti-zholdardy-bajytu-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интегративті жолдарды байыту талдауы&lt;/span&gt;&lt;/a&gt;Интегративті жолдарды байыту талдауы&lt;/h4&gt;\n&lt;p&gt;Функционалдық байыту біріктірілген деректер жиынтығында айтарлықтай көрінетін биологиялық процестерді анықтау үшін R тіліндегі ActivePathways пакеті көмегімен жүзеге асырылды. Талдауда бағытталған деректерді біріктіруден алынған біріктірілген P-мәндері бойынша ранжирленген гендер тізімі пайдаланылды. Gene Ontology (GO) терминдерінің оңтайлы байытылуын анықтау үшін ранжирленген гипергеометриялық тест қолданылды. Гендер жиынтығы (m5.go.v2023.2.Mm.symbols.gmt) шамадан тыс ерекше немесе тым жалпы терминдерден туындайтын қателіктерді азайту үшін тек 10 мен 500 аралығындағы аннотацияланған гендерді қамтитын жолдарды сүзу үшін қолданылды. Маңызды GO терминдері Холмның отбасылық қателік деңгейі (FWER) &amp;lt; 0.05 көмегімен анықталды. Биологиялық түсіндіруді жеңілдету үшін бірегей және маңызды GO терминдері гистограммалар арқылы визуализацияланды, мұнда x өсі &lt;span class=\"yfm-latex\" data-content=\"-%5Clog_%7B10%7D(%5Ctext%7B%D1%82%D2%AF%D0%B7%D0%B5%D1%82%D1%96%D0%BB%D0%B3%D0%B5%D0%BD%20P-%D0%BC%D3%99%D0%BD%D0%B4%D0%B5%D1%80%D1%96%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; сипаттады, ал y өсі кеңірек функционалдық санаттары бойынша топтастырылған нақты GO терминдерін тізбектеді.&lt;/p&gt;\n&lt;h4 id=\"statistikalykh-taldau\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#statistikalykh-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистикалық талдау&lt;/span&gt;&lt;/a&gt;Статистикалық талдау&lt;/h4&gt;\n&lt;p&gt;Статистикалық талдаулар GraphPad Prism 9 бағдарламасы (v9.5.1; GraphPad Software, Сан-Диего, Калифорния, АҚШ) көмегімен орындалды. Деректер орташа мән ± орташаның стандартты қатесі (SEM) ретінде ұсынылған. Жұптық салыстырулар екі жақты жұптастырылмаған t-тесттер көмегімен талданды. Бірнеше салыстырулар бір факторлы немесе екі факторлы дисперсиялық талдау (ANOVA) және одан кейінгі Tukey немесе Sidak post-hoc тесттері арқылы талданды. P &amp;lt; 0.05 мәні статистикалық маңызды деп есептелді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;ANOVA пен t-тесттер зерттеу топтары арасындағы айырмашылықтардың кездейсоқ еместігін, ал шынайы биологиялық өзгерістерді көрсететінін тексеруге көмектеседі.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gendik-modulder\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#gendik-modulder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гендік модульдер&lt;/span&gt;&lt;/a&gt;Гендік модульдер&lt;/h4&gt;\n&lt;p&gt;Төрт гендік модуль бағаланды. Анаболикалық модуль тотығу фосфорлану суббірліктерін (ATP5E, COX4I1, NDUFA1, NDUFB9, NDUFS8, UQCRB, COX7B) және ақуыз трансляциясы гендерін (RPS3A, RPS9, RPL10, RPL13, RPL18A, EIF3F, EEF1A1, MRPL42, MRPS14) біріктіреді. Аурумен байланысты микроглия (DAM) модулі SPP1, APOE, CD9, ITGAX, GPNMB, CD68, CST7, LPL, LGALS3 қамтыды; гомеостатикалық модуль P2RY12, CX3CR1, TMEM119, HEXB қамтыды. Үй шаруашылығы трегі (ACTB, GAPDH, B2M) тек РНК сапасының бақылауы ретінде бағаланды.&lt;/p&gt;\n&lt;h4 id=\"donordyng-psevdoobuemdik-zhaene-moduldik-koersetkishteri\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#donordyng-psevdoobuemdik-zhaene-moduldik-koersetkishteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Донордың псевдообъемдік және модульдік көрсеткіштері&lt;/span&gt;&lt;/a&gt;Донордың псевдообъемдік және модульдік көрсеткіштері&lt;/h4&gt;\n&lt;p&gt;Әрбір донор үшін микроглияның шикі санақтары гендер бойынша жинақталып, миллионға шаққандағы санақтарға (CPM) және &lt;span class=\"yfm-latex\" data-content=\"%5Clog_2(%5Ctext%7BCPM%7D%2B1)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; мәніне нормаланды да, донордың псевдообъемдік профилі алынды. Донор модулінің көрсеткіші — бұл модуль гендері бойынша &lt;span class=\"yfm-latex\" data-content=\"%5Clog_2%5Ctext%7BCPM%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; мәнінің әр ген үшін z-ұпайының орташа мәні, мұндай z-ұпай барлық донорлар бойынша есептелді. Мұндай донор деңгейіндегі дизайн (әр донорға бір мән) жеке жасушаларды тәуелсіз репликалар ретінде қарастырудан туындайтын жалған маңыздылықты болдырмайды.&lt;/p&gt;\n&lt;h4 id=\"zhasusha-denggejindegi-upajlar,-khajta-klasterleu-zhaene-ornalastyru\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#zhasusha-denggejindegi-upajlar,-khajta-klasterleu-zhaene-ornalastyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жасуша деңгейіндегі ұпайлар, қайта кластерлеу және орналастыру&lt;/span&gt;&lt;/a&gt;Жасуша деңгейіндегі ұпайлар, қайта кластерлеу және орналастыру&lt;/h4&gt;\n&lt;p&gt;Бір жасушалы визуализациялар (UMAP) үшін әр жасуша модулінің ұпайлары лог-нормаланған экспрессияның әр ген үшін z-ұпайының модуль гендері бойынша орташа мәні ретінде есептелді, мұнда z жасушалар бойынша есептелді. Микроглия осы жасушалармен шектелген біріктірілген scVI латентті кеңістігінде қайта кластерленді: k-ең жақын көршілер графтары (k = 15) 30 өлшемді латентті кеңістікте құрылды, 0.4 ажыратымдылықтағы Leiden кластерлеуі 11 субкластерді берді, ал UMAP сол графтан қайта құрылды. Модуль-ген нүктелік графы орташа экспрессияны (кластерлер бойынша z) және әр субкластердегі экспрессиялайтын жасушалар үлесін қорытындылайды.&lt;/p&gt;\n&lt;h4 id=\"trem2-zhaene-dam-stratifikaciyasy\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#trem2-zhaene-dam-stratifikaciyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TREM2 және DAM стратификациясы&lt;/span&gt;&lt;/a&gt;TREM2 және DAM стратификациясы&lt;/h4&gt;\n&lt;p&gt;Егер жасуша кем дегенде бір TREM2 санағын қамтыса, ол TREM2-оң, ал басқа жағдайда TREM2-теріс деп бағаланды; әр донор үшін TREM2-оң үлесі және бөлек TREM2-оң / TREM2-теріс псевдообъемдік профильдері есептелді. Жоғары DAM жасушалары жасуша деңгейіндегі DAM ұпайының жоғарғы терцилі ретінде анықталды (барлық жасушалар бойынша есептелген); DAM ішіндегі талдаулар үшін жоғары DAM жасушаларымен шектелген донор псевдообъемы пайдаланылды. TREM2 тамшылы бір ядролы деректерде төмен деңгейлі транскрипт болып табылады, сондықтан TREM2-оң үлесі анықтау сезімталдығын көрсетеді және абсолютті оң көрсеткіш ретінде емес, салыстырмалы түрде (Браак сатысы бойынша) түсіндіріледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Псевдообъемдік орташалау (pseudobulk) бірыңғай жасушалар деректеріндегі техникалық шуды азайту үшін бірдей жасуша типтерінің көрсеткіштерін біріктіреді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"statistika\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#statistika\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистика&lt;/span&gt;&lt;/a&gt;Статистика&lt;/h4&gt;\n&lt;p&gt;Браак сатылары бойынша анаболикалық төмендеу донор псевдообъемы бойынша қарапайым ең кіші квадраттар әдісімен тексерілді (ұпай ~ жас + Браак + жас × Браак); жасуша басына шаққандағы медиандық гендер, митохондриялық оқылымдар пайызы және үй шаруашылығы модулі РНК сапасын бақылау ретінде бірдей модельденді. Көршілес Браак сатылары арасындағы жұптық салыстырулар Манн–Уитни U-тесті көмегімен жүргізілді (донор деңгейінде, жұптастырылмаған). Модуль ұпайлары мен TREM2 экспрессиясы арасындағы байланыс Спирменнің рангтік корреляциясы (&lt;span class=\"yfm-latex\" data-content=\"%5Crho\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, суреттерде R ретінде көрсетілген) арқылы жалпы, әр Браак сатысы ішінде және жоғары DAM жасушалары ішінде бағаланды; рангтік корреляция қолданылды, себебі донор деңгейіндегі ұпайлар Пірсон корреляциясы сезімтал болатын шектен тыс мәндерді қамтиды.&lt;/p&gt;\n&lt;p&gt;Ауру сатысына тәуелсіз байланысты сатылар аралық трендтен ажырату үшін (Симпсон парадоксы, мұнда біріктірілген анаболикалық-DAM корреляциясы екі бағдарламаның қарама-қарсы Браак градиенттерімен жасырылады), Браак сатысын басқаратын жартылай Спирмен корреляциялары есептелді. DAM/анаболикалық диссоциация сатылар бойынша орташа модуль ұпайларымен қорытындыланды; ерте (Браак 0–II/III–IV) және кеш (Браак V–VI) сатылар арасындағы сатыішілік анаболикалық-DAM корреляциясының өзгерісі Фишердің z салыстыру тестімен тексерілді. Донор деңгейіндегі анаболикалық төмендеудің композициялық немесе жасушішілік екенін анықтау үшін жасушалар бірыңғай жаһандық шекті мән бойынша анаболикалық-жоғары деп белгіленді (барлық жасушалар бойынша жасуша деңгейіндегі анаболикалық ұпайдың жоғарғы 30%); әр донор үшін біз анаболикалық-жоғары жасушалардың үлесін және олардың ішіндегі орташа ұпайды есептедік, ал донорлардың орташа мәнінің Браак 3–4 сатысынан 5–6 сатысына өзгеруі shift-share декомпозициясы арқылы композициялық және жасушішілік компоненттерге бөлінді. Барлық тесттер екі жақты болды.&lt;/p&gt;\n&lt;h4 id=\"baghdarlamalykh-khamtamasyz-etilim\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#baghdarlamalykh-khamtamasyz-etilim\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бағдарламалық қамтамасыз етілім&lt;/span&gt;&lt;/a&gt;Бағдарламалық қамтамасыз етілім&lt;/h4&gt;\n&lt;p&gt;Барлық талдаулар Python 3.10.6 нұсқасында орындалды. Бір ядролы деректерді өңдеу, көрші графтарын құру және UMAP орналастыру scanpy (v1.11.5) 46 және anndata (v0.11.4) 47 көмегімен жүзеге асырылды; субкластерлер leidenalg (v0.10.2) 48 және python-igraph (v0.11.9) көмегімен Leiden кластерлеуі арқылы анықталды, ал орналастырулар umap-learn (v0.5.9) 49 көмегімен есептелді. Микроглияның статистикалық талдауларында numpy (v2.2.5), pandas (v2.3.3), scipy (v1.15.3) 50 және statsmodels (v0.14.5) пайдаланылды. Суреттер matplotlib (v3.10.8) 51 және seaborn (v0.13.2) 52 көмегімен жасалды.&lt;/p&gt;\n&lt;h4 id=\"zheke-yadrolykh-rnk-sekvenirleu-taldauy\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#zheke-yadrolykh-rnk-sekvenirleu-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жеке ядролық РНК секвенирлеу талдауы&lt;/span&gt;&lt;/a&gt;Жеке ядролық РНК секвенирлеу талдауы&lt;/h4&gt;\n&lt;p&gt;Бұл зерттеуде барлық донорлар жеке ядролардың РНК секвенирлеу әдісі (single-nucleus RNA-seq) арқылы талданды. Нейродегенеративті процестің дамуын бағалау үшін барлық үлгілер Браак сатыларына сәйкес үш топқа бөлінді: бастапқы сатылар (0–II), аралық сатылар (III–IV) және ауыр сатылар (V–VI).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жеке ядролық РНК секвенирлеу (snRNA-seq) әдісі мидың әртүрлі жасушалық тіндеріндегі гендердің экспрессиясын жеке ядролар деңгейінде зерттеуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Алынған экспрессия профильдері патологияның дамуымен бірге жүретін транскрипциялық өзгерістерді анықтау үшін Браак сатыларының бөлінген топтары арасында салыстырылды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-f3.jpg\" alt=\"3-сурет: TREM2 бляшкалармен байланысқан микроглияда жаңа ақуыз синтезін ынталандырады. (A) In vivo FUNCAT таңбалау схема\" /&gt;&lt;/p&gt;\n&lt;p&gt;*3-сурет: TREM2 бляшкалармен байланысқан микроглияда жаңа ақуыз синтезін ынталандырады. (A) In vivo FUNCAT таңбалау схемасы. Тышқандарға микроглияны оқшаулау және талдау алдында 16 сағат бұрын Азидогомоаланин (AHA, 50 мг/кг) егілді. (B) CX3CR1+ CD45+ микроглиясындағы FUNCAT қарқындылығының өкілді ағынды цитометрия гистограммалары. Қызыл көрсеткі AppNL-G-F микроглиясында бар, бірақ Trem2KO тышқандарында жоқ «жоғары FUNCAT» иығын көрсетеді. (C) FUNCAT сигналы үшін орташа флуоресценция қарқындылығының (MFI) сандық бағасы. (D) CD45high және CD45low микроглия популяциялары арасындағы CD45 және FUNCAT қарқындылығын салыстыру. (E) Iba1 (жасыл), Aβ (82E1, сұр) және жаңадан пайда болған ақуыздарға (FUNCAT, қызыл) боялған кортикальды бляшкалардың өкілді конфокальды суреттері. Масштабты сызық: 50 мкм. (F) Бляшкалармен байланысқан микроглиядағы FUNCAT қарқындылығының сандық бағасы. (G) Iba1 (жасыл) және Aβ (Көгілдір) үшін бірлесіп боялған 9 айлық AppNL-G-F және AppNL-G-F;Trem2KO тышқандарынан алынған бляшкалармен байланысқан микроглиядағы трансляция элонгация факторы EEF1A1 (Күлгін) өкілді конфокальды суреттері. Ақ көрсеткілер Iba1+ бляшкалармен байланысқан микроглия ішіндегі EEF1A1 индукциясын көрсетеді. Масштабты сызық: 20 мкм. (H) Iba1+ бляшкалармен байланысқан микроглия ішіндегі EEF1A1 қарқындылығының сандық бағасы. n = әр топқа 7-8 тышқан. **&lt;em&gt;P &amp;lt; 0,001 екі жақты жұптаспаған t-тест бойынша.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-f4.jpg\" alt=\"4-сурет: Микроглияның анаболикалық бейімделуі TREM2-ге тәуелді және Aβ жүктеме градиенті бойынша өзін-өзі шектейді. (A) \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет: Микроглияның анаболикалық бейімделуі TREM2-ге тәуелді және Aβ жүктеме градиенті бойынша өзін-өзі шектейді. (A) Транскрипциялық профильдеу үшін Methoxy-X04 (X04) оң (X04+) және теріс (X04-) микроглияны сұрыптау үшін қолданылатын гейтинг стратегиясының схемасы. (B) Aβ-фагоциттейтін микроглияның гейтингін көрсететін өкілді ағынды цитометрия графиктер. Жоғарғы панельдер: Жабайы типтегі (WT) және AppNL-G-F тышқандарын салыстыру X04 сигналының ерекшелігін растайды. Төменгі панельдер: AppNL-G-F және AppNL-G-F;Trem2KO тышқандарында фагоцитарлық жүктеменің артуын білдіретін X04+ популяциясын Төмен, Орташа және Жоғарғы флуоресценция қарқындылығы биндеріне стратификациялау. (C) Aβ-фагоциттейтін микроглияның уақытша талдауы. Жоғарғы панельдер: AppNL-G-F тышқандарында X04+ популяциясының 5–6 айдан 9–10 айға дейін кеңеюі. Төменгі панельдер: 9 айлық AppNL-G-F және AppNL-G-F;Trem2KO тышқандарындағы X04 қарқындылығының таралуын салыстыру, бұл TREM2KO микроглиясында X04high популяциясының айтарлықтай азайғанын көрсетеді. (D) Жаппай RNA-seq үлгілерінің басты компоненттер талдауы (PCA) (n = 46). Нүктелер генотиптер бойынша жеке биологиялық қайталауларды білдіреді: WT (n = 5), AppNL-G-F (n = 23) және AppNL-G-F;Trem2KO (n = 18). Түстер X04 жіктелуін көрсетеді (X04- және X04+ ішкі жиынтықтары: Төмен, Орташа, Жоғарғы). X04 деңгейлері PC2 бойымен бөлінуді тудырып, айқын бляшка-фагоцитарлық күйлерді анықтайтынын ескеріңіз. (E) X04+ және X04- AppNL-G-F микроглиясында байытылған ең жоғары ранкті жолдардың IPA талдауы. Көрсеткілер Aβ-мен әрекеттескен кезде митохондриялық биогенездің/тотығу фосфорлануының (қызыл) және ақуызды бағыттаудың/синтездеудің (сары) қарқынды индукциясын атап көрсетеді. (F, G) AppNL-G-F тышқандарында (F) және 9 айлық AppNL-G-F;Trem2KO тышқандарында (G) X04- бақылауларына қатысты фагоцитарлық градиент (X04high, X04med, X04low) бойынша микроглияның транскрипциялық өзгерістерін көрсететін IPA салыстырмалы талдауы. (H) 9 айлық жаста Methoxy-X04 қарқындылығы бойынша стратификацияланған AppNL-G-F мен AppNL-G-F;Trem2KO IPA салыстыруы. Таңдалған айтарлықтай байытылған канондық жолдар үшін активация z-ұпайлары (Фишердің дәл тесті; түзетілген P &amp;lt; 0,05) жылу картасы ретінде ұсынылған. Түс шкаласы жолдардың болжамды бағытын көрсетеді: қызыл оң z-ұпайларға (болжамды активация) сәйкес келеді, көк теріс z-ұпайларды (болжамды тежелу) білдіреді, ал сұр IPA бағытын болжай алмаған жолдарды білдіреді. Статистикалық маңыздылығы жоқ жолдар жұлдызшамен (&lt;/em&gt;) белгіленген. Жолдардың жолдары биологиялық маңызына қарай төрт санатқа топтастырылған.*&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-f6.jpg\" alt=\"6-сурет: TREM2 жоғалуы қорытылмаған субстраттың жасушаішілік жиналуына әкеледі. (A, C) PSD95 (постсинаптикалық маркер, A\" /&gt;&lt;/p&gt;\n&lt;p&gt;*6-сурет: TREM2 жоғалуы қорытылмаған субстраттың жасушаішілік жиналуына әкеледі. (A, C) PSD95 (постсинаптикалық маркер, A) немесе миелиннің негізгі ақуызы (MBP, C), сондай-ақ Iba1 және Aβ үшін бірге боялған 9 айлық тышқандардың бляшкамен байланысқан микроглиасының өкілді конфокальды суреттері. Ақ көрсеткілер Trem2KO микроглиоциттерінің сомасындағы PSD95 және MBP нүктелік жиынтықтарының айқын жасушаішілік жиналуын көрсетеді. Масштабтық сызық: 50 мкм. (B, D) Бляшкаға жақындығына қарай субстраттың жиналуын сандық бағалау. Скрипка графикасы плакетикамен байланыспаған (NPAM) немесе плакетикамен байланысқан (PAM) ретінде жіктелген Iba1+ ROI шегіндегі PSD95 (B) немесе MBP (D) воксельдерінің қабаттасу пайызын көрсетеді. Түрлі-түсті нүктелер жеке ROI-ді білдіреді; тұтас қара дөңгелектер мен қателік сызықтары бета-биномиалды жалпыланған сызықтық аралас модельден (GLMM) алынған шекті орташа мәндерді (EMM) ± 95% сенім интервалдарын көрсетеді. Сызықтар биологиялық қайталаулар аясындағы жұптастырылған аймақтарды қосады (әр топ үшін n = 5-6 тышқан). Жұптық салыстырулар Дельта әдісі арқылы орындалды. Маңыздылық деңгейлері: *P &amp;lt; 0.05, **P &amp;lt; 0.01, ***P &amp;lt; 0.001, ***&lt;em&gt;P &amp;lt; 0.0001. Маңызды емес үрдістер үшін нақты p мәндері көрсетілген. (E) DAPI, PSD95 (жасыл), Iba1 (күлгін) және Aβ (көгілдір) үшін бірге боялған AppNL-G-F;Trem2KO тышқандарындағы бляшкамен байланысқан микроглиалық жасушаның 3D беттік көрінісі (Imaris). Субстратқа толы үлкен өсіндінің шығуына назар аударыңыз. (F) PSD95 нүктелері мен Aβ агрегаттарының Iba1+ өсіндісінің ішіне орналасқанын растайтын жоғары үлкейтудегі (63X) бірыңғай оптикалық кесінді (0.17 мкм). (G) Бляшка нишасындағы PSD95+ өсінділерін сандық бағалау (105 мкм³ ROI). Әрбір нүкте жеке бляшка ROI білдіреді. Медианалар мен интерквартильдік ауқымдар (IQRs) сәйкесінше нүктелер мен жолақтармен көрсетілген. Статистикалық маңыздылық дәл ауыстыру арқылы параметрлік емес Уилкоксон рангтік-сомалық тесті арқылы анықталды (R пакеті coin, v1.4.3). (H) Миелиннің негізгі ақуызының (MBP) қалдықтарын қамтитын өсінділердің 3D беттік көрінісі. (I) Өсінді люменіндегі MBP субстратының бар екенін бірыңғай оптикалық кесінді арқылы растау (0.17 мкм). (J) Генотиптер арасындағы MBP+ өсінділері тығыздығын сандық бағалау.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-f7.jpg\" alt=\"7-сурет: TREM2 жоғалуы бляшкамен байланысқан микроглиада митохондриялық биогенез бен жаңарудың төмендеуіне әкеледі. (A) \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-сурет: TREM2 жоғалуы бляшкамен байланысқан микроглиада митохондриялық биогенез бен жаңарудың төмендеуіне әкеледі. (A) Митохондриялық массаны (MitoTracker Green), мембраналық потенциалды (MitoTracker Red CMXRos) және митохондриялық денсаулық индексін (мембраналық потенциалдың массаға қатынасы) сандық бағалайтын 9 айлық AppNL-G-F тышқандарының CD45low (бляшкамен байланыспаған) және CD45high (бляшкамен байланысқан) микроглиасындағы митохондриялық жарамдылықты ағынды цитометриялық талдау. CD45high микроглиасы жоғарылаған мембраналық потенциалды көрсетеді, бұл кеңейтілген биоэнергетикалық сыйымдылықты білдіреді. (B) Сол популяциялардағы лизосомалық масса (LysoTracker Deep Red); CD45high микроглиасы жоғары лизосомалық массаны көрсетіп, деградациялық қабілеттің индукциясын растайды. (C) 9 айлық AppNL-G-F және AppNL-G-F;Trem2KO тышқандарының бастапқы микроглиасындағы митохондриялық жарамдылық (A-дағыдай көрсеткіштер). Trem2KO микроглиасы метаболикалық тұрғыдан жарамсыз органеллалардың жиналуын көрсететіn «Жоғары масса / Төмен потенциал» фенотипән көрсетеді. (D) Лизосомалық масса (LysoTracker Deep Red); генотип айырмашылығының болмауы митохондриялық жиналудың лизосомалық жетіспеушілікпен байланысты емес екенін көрсетеді. (E) AHA-TOM20 жақындық лигациялық талдауы (PLA) арқылы in situ пайда болатын митохондриялық биогенез. Өкілді конфокальды суреттер бляшка нишасындағы Iba1+ микроглиасының (жасыл) ішіндегі жаңадан синтезделген TOM20-ны (TOM20-PLA нүктелері, қызыл) көрсетеді, ол AppNL-G-F-те айқын және Trem2KO микроглиасында әлсіреген. (F) Әрбір микроглиоцитке шаққандағы пайда болатын TOM20-PLA нүктелерінің санын сандық бағалау (әр тышқан үшін кездейсоқ таңдалған 10-15 бляшка сандық түрде бағаланды). (G) VDAC1, P62 (автофагия рецепторы) және Iba1 үшін бірге боялған бляшкамен байланысқан микроглианың өкілді конфокальды суреттері (MIP, 5 мкм). Ақ көрсеткілер Trem2KO микроглиасындағы жоғары p62 бар VDAC1+ митохондрияларын көрсетеді. Масштабтық сызық: 20 мкм. (H) IBA1⁺VDAC1⁺ аймақтарындағы P62 қарқындылығын сандық бағалау; әр тышқан үшін 20-30 бляшка сандық түрде бағаланды.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-f8.jpg\" alt=\"8-сурет: Микроглиалық анаболикалық бағдарлама адамдарда сақталады және АД өршуімен бірге төмендейді. (A) Біріктірілген а\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-сурет: Микроглиалық анаболикалық бағдарлама адамдарда сақталады және АД өршуімен бірге төмендейді. (A) Біріктірілген адам микроглиалық UMAP-қа жобаланған анаболикалық, DAM және гомеостатикалық бағдарламалар үшін әр ядроға арналған модульдік ұпайлар (ssKIND атласы; 523 донор). (B) Брак сатылары (0–II, III–IV, V–VI) бойынша донор деңгейіндегі псевдо-көлемдік анаболикалық модуль ұпайы. Әрбір нүкте — бір донор; жәшіктер медиана мен интерквартильдік ауқымды көрсетеді. Анаболикалық ұпай Брак сатысы бойынша төмендейді (сызықтық модель β = −0,41, P = 1,8×10⁻⁵; Спирман R = −0,35), ең күрт Брак III–IV пен V–VI арасында. n = 34 / 223 / 266 донор (Брак 0–II / III–IV / V–VI). Жұптық салыстырулар, Манн–Уитни U. (C) Әр донор үшін анаболизмі жоғары жасушалардың үлесі; (D) сол жоғары жасушалар ішіндегі орташа анаболикалық ұпай; жасушалар жаһандық шекте (барлық жасушалар бойынша жасуша деңгейіндегі анаболикалық ұпайдың ең жоғарғы 30%-ы) анаболизмі жоғары деп белгіленді. (E) Брак сатысы бойынша донорлар кесіндісіндегі TREM2 экспрессиясы (log₂ CPM) және анаболикалық модуль ұпайы. Спирман R әр сатыда оң; Брак сатысын бақылайтын жартылай R = +0,28. Қызыл сызық, сызықтық жуықтау; боялған жолақ, 95% сенім интервалы. (F) Брак сатылары бойынша орташа анаболикалық және DAM модуль ұпайлары (қателік сызықтары, s.e.m.), Брак V–VI сатыларында алшақтайтынын көрсетеді. Брак сатысын бақылайтын жартылай Спирман корреляциялары: анаболикалық–TREM2 R = +0,28; анаболикалық–DAM R = +0,23; анаболикалық–гомеостатикалық R = +0,08 (n.s.). (G) Барлық донорлар бойынша біріктірілген DAM модулімен анаболикалық бағдарламаның донор деңгейіндегі байланысы (жеке регрессия, біріктірілген Спирман R). (H) DAM модулімен анаболикалық бағдарламаның донор деңгейіндегі байланысы; жартылай Спирман R арқылы Бракішілік регрессия (Брак сатысын бақылау).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS3.jpg\" alt=\"Қосымша 3-сурет. (A) Ми тін суспензиясынан тіршілік қабілетті, жеке микроглиалды жасушаларды (CX3CR1+ CD45+) бөліп алу ү\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Қосымша 3-сурет. (A) Ми тін суспензиясынан тіршілік қабілетті, жеке микроглиалды жасушаларды (CX3CR1+ CD45+) бөліп алу үшін қолданылатын ағынды цитометриялық гейтинг стратегиясы. (B) AppNL-G-F тышқандарында 3 айдан 9 айға дейінгі жаста CD45 жоғары микроглиалды популяцияның уақытша ұлғаюын көрсететін ағынды цитометрияның репрезентативті графиктер. Назар аударыңыз, бұл ұлғаю AppNL-G-F;Trem2KO тышқандарында айтарлықтай әлсіреген. (C) 3 және 9 айлық жастағы AppNL-G-F және AppNL-G-F;Trem2KO тышқандарынан бөлініп алынған бастапқы микроглиадағы CD45 орташа флуоресценция қарқындылығының (MFI) сандық бағасы. (D) Iba1 және Aβ үшін бірлесіп боялған, 9 айлық AppNL-G-F және AppNL-G-F;Trem2KO тышқандарының бляшкамен байланысқан микроглиасындағы фосфорланған рибосомалық S6 ақуызының (p-RPS6, Ser235/236) репрезентативті конфокалды кескіндері. (E) Әрбір микроглиалды жасуша үшін p-RPS6 қарқындылығының сандық бағасы. n = тобына 6–8 тышқан. Екі жақты жұптастырылмаған t-тест бойынша **&lt;em&gt;P &amp;lt; 0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS3-2.jpg\" alt=\"Сурет S3 (жалғасы 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S3 (жалғасы 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS4.jpg\" alt=\"Қосымша 4-сурет. (A, B) 9 айлық AppNL-G-F және AppNL-G-F;Trem2KO микроглиасындағы әртүрлі Aβ жүктемесі дәрежелерін көрсе\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қосымша 4-сурет. (A, B) 9 айлық AppNL-G-F және AppNL-G-F;Trem2KO микроглиасындағы әртүрлі Aβ жүктемесі дәрежелерін көрсететін X04 қарқындылығымен байланысқан микроглианың әртүрлі транскрипциялық күйлері. (A) 9 айлық AppNL-G-F тышқандарынан бөлініп алынған микроглианың жалпы RNA-seq PCA талдауы (X04H, n = 5; X04M, n = 3; X04L, n = 3; X04P, n = 6; X04N, n = 6). (B) 9 айлық AppNL-G-F;Trem2KO тышқандарынан бөлініп алынған микроглианың жалпы RNA-seq PCA талдауы (X04H, n = 3; X04M, n = 3; X04L, n = 3; X04P, n = 5; X04N, n = 5). Стрелка (көктен ақшыл көкке дейінгі градиент) төменнен (оң жақта) жоғарыға (сол жақта) дейінгі X04 қарқындылығы спектрін білдіреді. (C) 9 айлық AppNL-G-F;Trem2KO тышқандарының X04+ және X04- микроглиасын салыстыратын IPA канондік жолдарының талдауы. Бағанды диаграмма X04+ микроглиасында айтарлықтай байытылған үздік 20 канондік жолды көрсетеді (Фишердің нақты тестінің p-мәні &amp;lt; 0.05). Назар аударыңыз, анаболикалық бейімделу TREM2 тапшылығы бар микроглиада толығымен жойылған. Жолдар байыту маңыздылығы бойынша −log10(P-value) ретінде тізбектелген.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS5.jpg\" alt=\"Қосымша 5-сурет. (A) scRNA-seq деректерінің біркелкі көпқабатты жуықтауы мен проекциясы (UMAP) (ажыратымдылық 0.2) алты \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қосымша 5-сурет. (A) scRNA-seq деректерінің біркелкі көпқабатты жуықтауы мен проекциясы (UMAP) (ажыратымдылық 0.2) алты түрлі микроглиалды кластерді анықтайды: гомеостатикалық микроглиа (HM), белсендірілген жауап микроглиасы (ARM), өтпелі жауап микроглиасы (TRM), интерферондық жауап микроглиасы (IRM), циклдік/пролиферацияланатын микроглиа (CPM) (Sala Frigerio және б., 2019) және рибосомалық микроглиа (Mancuso және б., 2024), сондай-ақ шағын аннотацияланбаған кластер. (B) Белгіленген модуль ұпайларын пайдаланып кластер сәйкестігін растау. Белгі графиктары Sala Frigerio және б. (2019) гендік қолтаңбаларының проекциясын көрсетіп, ағымдағы кластерлену мен бұрын анықталған күйлер арасындағы сәйкестікті растайды. Түс градиенттері әрбір жасуша үшін есептелген модуль ұпайын білдіреді (Көк: Төмен; Қызыл: Жоғары). (C) Аурумен байланысты канондік микроглиа (DAM) қолтаңбасының таралуы. UMAP проекциялары (сол жақта) және скрипка диаграммалары (оң жақта) фагоцитарлы емес X04- және фагоцитарлы X04+ жағдайларында DAM қолтаңбасының (Chen &amp;amp; Colonna, 2021) экспрессиясын көрсетеді. Y осі модуль ұпайын білдіреді; скрипка ені жасуша тығыздығын көрсетеді. (D) X04 жағдайлары бойынша кластерлеудің сапа бақылауы. Фагоцитарлы емес (X04-) және фагоцитарлы (X04+) жағдайларға бөлінген жоғары ажыратымдылықтағы субкластерлердің (ажыратымдылық 0.3) UMAP проекциялары X04+ және X04- жасушаларының бөлек субкластерлерді алатынын көрсетеді. (E) X04- және X04+ жағдайларындағы әрбір субкластер (ажыратымдылық 0.3) үшін DAM модуль ұпайларын көрсететін скрипка диаграммалары. Назар аударыңыз, DAM ұпайлары фагоцитарлы және фагоцитарлы емес субкластерлер арасында салыстырмалы. (F) Фагоцитарлы 1-кластерді фагоцитарлы емес 6-кластермен салыстыратын ең жоғары рейтингті канондік жолдардың IPA. Қызыл көрсеткілер ақуыз синтезі мен трансляция жолдарының индукциясын көрсетеді; көк көрсеткі нейроқабыну сигналдарының басылуын білдіреді. (G) Фагоцитарлы байытылған 2-кластерді фагоцитарлы емес 0-кластермен салыстыратын ең жоғары рейтингті канондік жолдардың IPA. Қызыл көрсеткілер рибосомалар биогенезі мен ақуыз синтезінің күшеюін көрсетеді; сары көрсеткілер митохондриялық тотығу фосфорлануының активациясын білдіреді. (H) 0-кластермен салыстырғанда 2-кластерде арнайы байытылған биологиялық процестің (BP) терминдерінің GSEA нүктелік графигі. Түс градиенті түзетілген P-мәндерін білдіреді. Қосымша 5-сурет (Жалғасы)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS5-2.jpg\" alt=\"Сурет S5 (жалғасы 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S5 (жалғасы 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS6.jpg\" alt=\"Қосымша 6-сурет. (A) Gene Ontology (GO) «Синапс», «Миелин қабығы» және «Лизосома» терминдерімен байланысты дифференциалд\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Қосымша 6-сурет. (A) Gene Ontology (GO) «Синапс», «Миелин қабығы» және «Лизосома» терминдерімен байланысты дифференциалды мол ақуыздарды көрсететін гендік-концептуалды желі (cnet) графиктары. Назар аударыңыз, бұл жүк ақуыздары 9 айлық AppNL-G-F бақылауымен салыстырғанда Trem2KO микроглиасында арнайы байытылған, бұл ішке қабылданған материалды ыдырата алмауын көрсетеді. (B) PSD95 (постсинаптикалық маркер), CD68 (лизосомалық маркер) және Iba1 үшін бірлесіп боялған, 9 айлық тышқандардың бляшкамен байланысқан микроглиасының репрезентативті конфокалды кескіндері. Ақ көрсеткілер жүктің сәтті ішке қабылданғанын және деградациялық компартменттерге тасымалданғанын көрсететін CD68+ фаголизосомаларының ішіндегі PSD95 нүктелі шоғырларын көрсетеді. Масштабты шкала: 50 мкм. (C) vGluT1 (пресинаптикалық маркер), Iba1 және Aβ үшін бірлесіп боялған, 9 айлық тышқандардың бляшкамен байланысқан микроглиасының репрезентативті конфокалды кескіндері. Ақ көрсеткілер Trem2KO микроглиасының сомасы ішіндегі vGluT1 нүктелі шоғырларының айқын жасушішілік жиналуын көрсетеді. Масштабты шкала: 50 мкм. (D) 9–10 айлық AppNL-G-F және AppNL-G-F;Trem2KO тышқандарының ми кесінділеріндегі жасушішілік жүк жиналуының (vGluT1 және т.б.) сандық бағасы. Түсті нүктелер жеке ROI-ларды білдіреді; тұтас қара шеңберлер мен қателік сызықтары бета-биномдық жалпыланған сызықтық аралас модельден (GLMM) алынған болжалды маргиналды орташаларды (EMM) ± 95% сенім интервалдарын білдіреді. (n = тобына 5–6 тышқан). Жұптық салыстырулар Дельта әдісі арқылы орындалды. Маңыздылық деңгейлері: *P &amp;lt; 0.05, **P &amp;lt; 0.01, ***P &amp;lt; 0.001, ***&lt;em&gt;P &amp;lt; 0.0001. (E) PSD95 (постсинаптикалық маркер), Iba1 және Aβ үшін бірлесіп боялған, бляшкамен байланысқан микроглианың репрезентативті конфокалды кескіндері (MIP, 5 мкм). Ақ көрсеткілер Trem2KO микроглиасынан шығатын, PSD95 нүктелерімен толтырылған өсінділермен байланысты үлкен (&amp;gt;2 мкм) жүк қосындыларын көрсетеді. Қызыл көрсеткі 6E суретіндегі 3D беттік рендерлеу үшін пайдаланылған жасушаны көрсетеді. Масштабты шкала: 20 мкм. (F) Миелиннің негізгі ақуызына (MBP), Iba1 және Aβ үшін бірлесіп боялған репрезентативті конфокалды кескіндері (MIP, 5 мкм). Ақ көрсеткілер Trem2KO микроглиасындағы MBP-мен толтырылған жүк қосындыларын көрсетеді. Қызыл көрсеткі 6H суретіндегі 3D беттік рендерлеу үшін пайдаланылған жасушаны көрсетеді. Масштабты шкала: 20 мкм. (G-H) PSD95 (қызыл, G) немесе MBP (жасыл, H) қамтитын жүк қосындыларының бүршіктенетін морфологиясын растайтын AppNL-G-F;Trem2KO тышқандарының бляшкамен байланысқан микроглиасының қосымша 3D беттік рендерлеулері (Imaris). Микроглиалды мембрана маджента түспен (Iba1) бейнеленген. Қосымша 6-сурет (Жалғасы)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS6-2.jpg\" alt=\"Сурет S6 (жалғасы 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S6 (жалғасы 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS7.jpg\" alt=\"Қосымша 7-сурет. (A) TOM20 жақындық лигациялық талдауына (PLA) арналған теріс бақылау. Бастапқы TOM20 антиденесі алынып \" /&gt;&lt;/p&gt;\n&lt;p&gt;*Қосымша 7-сурет. (A) TOM20 жақындық лигациялық талдауына (PLA) арналған теріс бақылау. Бастапқы TOM20 антиденесі алынып тасталып параллель өңделген бляшкамен байланысқан микроглианың репрезентативті конфокалды кескіндері; PLA сигналының жоқтығы TOM20-PLA реакциясының ерекшелігін растайды. Масштабты шкала: 20 мкм. (B) TOM20 (митохондрия), Iba1 және FUNCAT (жаңадан түзілген ақуыз синтезі) үшін бірлесіп боялған, 9–10 айлық AppNL-G-F және AppNL-G-F;Trem2KO тышқандарының бляшкамен байланысқан микроглиасының репрезентативті конфокалды кескіндері (MIP, 4 мкм z-стек). Масштабты шкала: 20 мкм. (C) Екі генотипте де TREM2, Iba1 және Aβ үшін бірлесіп боялған репрезентативті конфокалды кескіндері (MIP, 4 мкм z-стек). Ақ рамкалар 7E суретінде көрсетілген жергілікті митохондриялық биогенез орындарымен кеңістіктік түрде сәйкес келетін AppNL-G-F микроглиасының өсінділері ішіндегі TREM2 ақуызының арнайы индукциясын көрсетеді. Масштабты шкала: 20 мкм. (D-E) Бляшка жақындығына қатысты митохондриялық масса жиналуының репрезентативті кескіндері мен сандық бағасы. Скрипка диаграммалары бляшкамен байланыспаған (NPAM) немесе бляшкамен байланысқан (PAM) деп жіктелген Iba1+ ROI-лары шегіндегі TOM20 воксельдік қабаттасуының таралуын көрсетеді. Түсті нүктелер жеке ROI-ларды білдіреді; тұтас шеңберлер мен қателік сызықтары бета-биномдық жалпыланған сызықтық аралас модельден (GLMM) алынған болжалды маргиналды орташаларды (EMM) ± 95% сенім интервалдарын білдіреді. Сызықтар биологиялық қайталаулар шегіндегі жұпталған аймақтарды біріктіреді (n = 5–6 тышқан). Жұптық салыстырулар Дельта әдісі арқылы орындалды. ***P &amp;lt; 0.001, ***&lt;em&gt;P &amp;lt; 0.0001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS8.jpg\" alt=\"Кеңейтілген 8-сурет. (A) Адам микроглиясын бақылаусыз қайта кластерлеу (Leiden ажыратымдылығы 0.4) және DAM-marker-high \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Кеңейтілген 8-сурет. (A) Адам микроглиясын бақылаусыз қайта кластерлеу (Leiden ажыратымдылығы 0.4) және DAM-marker-high субкластерінен ерекшеленетін рибосомалық/жоғары анаболикалық субкластерді анықтайтын модуль-ген нүктелік графигі. (B) qPCR/RNA-seq нормализация әдебиеттерінен алынған тоғыз кең қолданылатын тұрақты референс гендерге негізделген Браак сатылары бойынша тұрақты-референс бақылау модулінің ұпайы (n.s.): ACTB, TBP, POLR2A, PPIA, HPRT1, YWHAZ, PUM1, CASC3, ELF1. (C) Браак сатылары бойынша әр ядроға анықталған медианалық гендер (секвенирлеу тереңдігін бақылау; n.s.). (D) Браак бойынша әр жасушаға шаққандағы анаболикалық бөлініс. Донор деңгейіндегі төмендеу негізінен композициялық сипатта (жоғары анаболикалық жасушалар аз) кішірек жасушаішілік компоненті бар. (E) DAMhigh микроглия ішіндегі TREM2 және анаболикалық ұпай, Браак сатысы бойынша (Спирмен R). (F) Анаболикалық бағдарламаның TREM2-мен донорлық деңгейдегі байланысы. Жоғарғы қатар: Браак сатысы шеңберіндегі регрессия ішінара Спирмен R көмегімен (Браак сатысын бақылай отырып). Төменгі қатар: барлық донорлар бойынша біріктірілген осы байланыс (бірыңғай регрессия, біріктірілген Спирмен R). (G) Анаболикалық бағдарламаның гомеостатикалық модульмен донорлық деңгейдегі байланысы (теріс бақылау). Жоғарғы қатар: Браак сатысы шеңберіндегі регрессия ішінара Спирмен R көмегімен (Браак сатысын бақылай отырып). Төменгі қатар: барлық донорлар бойынша біріктірілген осы байланыс (бірыңғай регрессия, біріктірілген Спирмен R).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS8-2.jpg\" alt=\"Сурет S8 (жалғасы 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S8 (жалғасы 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS8-3.jpg\" alt=\"Сурет S8 (жалғасы 3)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S8 (жалғасы 3)&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"kesteler\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#kesteler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кестелер&lt;/span&gt;&lt;/a&gt;Кестелер&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 1.&lt;/strong&gt; Браак сатысы бойынша адамның АД микроглия деректер жиынтығының когорталық сипаттамалары&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Сипаттама&lt;/th&gt;\n&lt;th&gt;Браак 0–II&lt;/th&gt;\n&lt;th&gt;Браак III–IV&lt;/th&gt;\n&lt;th&gt;Браак V–VI&lt;/th&gt;\n&lt;th&gt;Барлығы&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Донорлар, n&lt;/td&gt;\n&lt;td&gt;34&lt;/td&gt;\n&lt;td&gt;223&lt;/td&gt;\n&lt;td&gt;266&lt;/td&gt;\n&lt;td&gt;523&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Жас, жыл — орташа (диапазон)&lt;/td&gt;\n&lt;td&gt;81.2 (64–96)&lt;/td&gt;\n&lt;td&gt;89.2 (68–108)&lt;/td&gt;\n&lt;td&gt;83.7 (56–101)&lt;/td&gt;\n&lt;td&gt;85.9 (56–108)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Жынысы, Ә / Ер&lt;/td&gt;\n&lt;td&gt;21 / 13&lt;/td&gt;\n&lt;td&gt;130 / 93&lt;/td&gt;\n&lt;td&gt;162 / 104&lt;/td&gt;\n&lt;td&gt;313 / 210&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Платформа (snRNA / scRNA)&lt;/td&gt;\n&lt;td&gt;34 / 0&lt;/td&gt;\n&lt;td&gt;223 / 0&lt;/td&gt;\n&lt;td&gt;266 / 0&lt;/td&gt;\n&lt;td&gt;523 / 0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Микроглия, n (ядролар)&lt;/td&gt;\n&lt;td&gt;8,445&lt;/td&gt;\n&lt;td&gt;53,609&lt;/td&gt;\n&lt;td&gt;142,229&lt;/td&gt;\n&lt;td&gt;204,283&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Деректер 14 бір ядролы РНК-секвенирлеу зерттеуінен алынған 523 донорды (313 әйел / 210 еркек) қамтиды.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ми&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;иммунитетінің&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;әлсіреуі&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&g
