 SLF-I/II/III — жоғарғы бойлық буданың I, II және III тармақтары.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-fS5.jpg\" alt=\"Қосымша сурет S5. Бақылау талдаулары парцелляция схемалары бойынша желі нәтижелерінің беріктігін растайды. (A) Gordon 33\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қосымша сурет S5. Бақылау талдаулары парцелляция схемалары бойынша желі нәтижелерінің беріктігін растайды. (A) Gordon 333-аймақтық атласы. Граф-теориялық метрикалар бойынша ұқсас топтық айырмашылықтар байқалды, афантазиялық индивидтер сол жақ алдыңғы инсулада төмендетілген кластерлеу коэффициентін (Vis. &amp;gt; Aph., көк) және оң жақ дорсомедиальды префронтальды қыртыста (dmPFC; Aph. &amp;gt; Vis., қою қызыл) артқан қатысу коэффициентін көрсетті. (B) Schaefer-Yeo 100-аймақтық атласы. Афантазиялық индивидтер екі жақты dmPFC-де артқан қатысу коэффициентін (Aph. &amp;gt; Vis.) және оң жақ латеральды префронтальды қыртыста төмендетілген қатысу коэффициентін (Vis. &amp;gt; Aph.) көрсетті. (C) Schaefer-Yeo 400-аймақтық атласында сол жақ алдыңғы инсула түйініне қосылған ақ зат трактілері. Төменгі маңдай-шүйде будасы (IFOF) пен доға тәрізді буда (AF) негізгі талдауда төмендетілген кластерлеу коэффициентін көрсететін түйін болып табылатын сол жақ алдыңғы инсулада түйіседі. Сол жақ алдыңғы префронтальды қыртыс (aPFC) пен фузиформды бейнелеу түйіні (FIN) жеке ақ зат жолдарымен, негізінен сәйкесінше IFOF және AF арқылы байланысқан. Қою қызыл түс Aph. &amp;gt; Vis., ал көк түс Vis. &amp;gt; Aph. көрсетеді. A және B панельдерінде көрсетілген барлық топтық айырмашылықтар p &amp;lt; 0.05 мәнінде, FDR түзетуімен маңызды болды. Сол жақ маңдай көз өрісі (FEF) парцелляция шекараларындағы белсіздікке сәйкес атластар бойынша тұрақты түрде анықталған жоқ.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-fS6.jpg\" alt=\"Қосымша сурет S6. Афантазиялық индивидтер мен визуализаторлар арасындағы қыртыстық NODDI микроқұрылымдық айырмашылықтары\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қосымша сурет S6. Афантазиялық индивидтер мен визуализаторлар арасындағы қыртыстық NODDI микроқұрылымдық айырмашылықтары. Қыртыстық NODDI метрикалары BrainStat-та іске асырылған кездейсоқ өрістер теориясын қолдана отырып, кластерлік деңгейдегі FWE түзетуімен (p &amp;lt; 0.05) топтар арасында салыстырылды. Афантазиялық индивидтер парагиппокампальды жүлге мен энторинальды қыртысты қоса алғанда, екі жақты медиотемпоральды аймақтарда, сондай-ақ сол жақ прекнеусте артқан невральды тығыздық индексін (NDI) және сол жақ дорсомедиальды префронтальды қыртыста төмендеген NDI көрсетті. Бағдар дисперсиясы индексі (ODI), изотропты көлемдік фракция (ISOVF) және орташа диффузиялық (MD) сонымен қатар маңызды топтық айырмашылықтарды көрсетті. Төмендеген MD аймақтары медиотемпоральды қыртыстағы артқан NDI аймақтарымен кеңістіктік түрде қабаттасты, бұл өрнек бұл аймақтардағы нериттердің тығызырақ орналасуына және жалпы төменірек диффузиялыққа сәйкес келеді.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"kesteler\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#kesteler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кестелер&lt;/span&gt;&lt;/a&gt;Кестелер&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 1.&lt;/strong&gt; Афантазия және визуализаторлар арасындағы ақ зат жолдарын салыстыру&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Жол&lt;/th&gt;\n&lt;th&gt;Бөлшектік анизотропия (FA)&lt;/th&gt;\n&lt;th&gt;Аксьялдык диффузия (AD)&lt;/th&gt;\n&lt;th&gt;Радиалдык диффузия (RD)&lt;/th&gt;\n&lt;th&gt;Неврит тыгыздыгы индекси (NDI)&lt;/th&gt;\n&lt;th&gt;Бағдардың таралу индексі (ODI)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Vis &amp;gt; Aph&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;right UF&lt;/td&gt;\n&lt;td&gt;77-84 (0.018; 3.43; 1.09 [0.53, 1.82], 17.13)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;78-83 (0.061; 2.50; -0.90 [-1.64, -0.32]; 5.45)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;left UF&lt;/td&gt;\n&lt;td&gt;75-77 (0.048; 2.89; 0.94 [0.38, 1.65], 6.93)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;74-78 (0.085; 2.54; -0.82 [-1.57, -0.21]; 3.41)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;interparietal corpus callosum&lt;/td&gt;\n&lt;td&gt;47-50 (0.039; 3.01; 0.97 [0.34, 1.83], 8.18)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;47-52 (0.071; 2.71; -0.86 [-1.79, -0.21]; 4.17)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Aph &amp;gt; Vis&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Aph &amp;gt; Vis&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Vis &amp;gt; Aph&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Aph &amp;gt; Vis&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Vis &amp;gt; Aph&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;right dorsal cingulum&lt;/td&gt;\n&lt;td&gt;46-69 (0.019; 2.85; -0.90 [-1.63, -0.30], 5.44)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;40-76 (0.016; 2.96; 0.89 [0.30, 1.62]; 5.17)&lt;/td&gt;\n&lt;td&gt;44-63 (0.046; 2.17; -0.72 [- 1.40, -0.11] 2.06)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;left dorsal cingulum&lt;/td&gt;\n&lt;td&gt;39-68 (0.003; 3.95; -1.03 [-1.71, -0.46], 12.22)&lt;/td&gt;\n&lt;td&gt;52-61 (0.068; 2.51; -0.78 [- 1.48, -0.17], 2.74)&lt;/td&gt;\n&lt;td&gt;30-69 (0.004; 3.78; 1.00 [0.44, 1.65]; 9.88)&lt;/td&gt;\n&lt;td&gt;59-62 (0.047; 2.50; -0.81 [- 1.59, -0.20]; 3.22)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Кесте S5.&lt;/strong&gt; Афантазиясы бар тұлғалар мен визуализаторлар арасындағы қыртыс қалыңдығының айырмашылықтары&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Облыс&lt;/th&gt;\n&lt;th&gt;Кластер өлшемі&lt;/th&gt;\n&lt;th&gt;Шыңдық t-мәні&lt;/th&gt;\n&lt;th&gt;Шыңдық p-мәні (FDR)&lt;/th&gt;\n&lt;th&gt;MNI координаттары (x, y, z)&lt;/th&gt;\n&lt;th&gt;Хеджес g [Bootstrap 95% CI]&lt;/th&gt;\n&lt;th&gt;BF10&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Vis. &amp;gt; Aph.&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Left aPFC&lt;/td&gt;\n&lt;td&gt;52&lt;/td&gt;\n&lt;td&gt;4.68&lt;/td&gt;\n&lt;td&gt;0.000&lt;/td&gt;\n&lt;td&gt;-36, 54, 4&lt;/td&gt;\n&lt;td&gt;1.53 [0.87, 2.53]&lt;/td&gt;\n&lt;td&gt;433.22&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Left PoCG&lt;/td&gt;\n&lt;td&gt;49&lt;/td&gt;\n&lt;td&gt;3.73&lt;/td&gt;\n&lt;td&gt;0.005&lt;/td&gt;\n&lt;td&gt;-64, -14, 22&lt;/td&gt;\n&lt;td&gt;1.21 [0.55, 2.22]&lt;/td&gt;\n&lt;td&gt;41.42&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Aph. &amp;gt; Vis.&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Left PHG/EC&lt;/td&gt;\n&lt;td&gt;6.83&lt;/td&gt;\n&lt;td&gt;0.000&lt;/td&gt;\n&lt;td&gt;-25, -19, -23&lt;/td&gt;\n&lt;td&gt;-2.23 [-3.27, -1.60]&lt;/td&gt;\n&lt;td&gt;132680.97&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Left ACC&lt;/td&gt;\n&lt;td&gt;3.61&lt;/td&gt;\n&lt;td&gt;0.005&lt;/td&gt;\n&lt;td&gt;-4, 18, 23&lt;/td&gt;\n&lt;td&gt;-1.18 [-2.03, -0.57]&lt;/td&gt;\n&lt;td&gt;31.67&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Right RSC&lt;/td&gt;\n&lt;td&gt;3.52&lt;/td&gt;\n&lt;td&gt;0
