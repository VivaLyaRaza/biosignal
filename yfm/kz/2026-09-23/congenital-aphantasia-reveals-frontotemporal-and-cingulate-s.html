        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"219\" cy=\"159\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"681\" cy=\"207\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Афантазия: ми адамдары неге&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;бейнелей алмайды?&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-f1.jpg\" alt=\"1-сурет. Трактометрия афантазия кезінде ақ заттың микроқұрылымдық таңдамалы айырмашылықтарын көрсетеді. (A) Визуализатор\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Трактометрия афантазия кезінде ақ заттың микроқұрылымдық таңдамалы айырмашылықтарын көрсетеді. (A) Визуализаторлармен салыстырғанда афантазиясы бар тұлғаларда фракциялық анизотропиясы (FA) төмендеген трактілер (Vis. &amp;gt; Aph.): сол жақ ілмек тәрізді буда (UF), оң жақ UF және артқы париетаралық аралық corpus callosum. Жоғарғы панельдер тракт профильдерін (орташа ± SEM) көрсетеді; төменгі панельдер сегмент орналасуы бойынша түспен кодталған (1-100 түйіндер) үлгілі қатысушының тракт реконструкцияларын көрсетеді. Қызыл сызықтар афантазиясы бар тұлғаларды, көк сызықтар визуализаторларды білдіреді. Көлеңкеленген сұр аймақтар топтар арасындағы маңызды айырмашылықтары бар сегменттерді белгілейді (p &amp;lt; 0.05, FWE түзетілген). (B) Визуализаторлармен салыстырғанда афантазиясы бар тұлғаларда FA жоғарылаған трактілер (Aph. &amp;gt; Vis.): сол және оң жақ дорсальды белдеулік буда. Жоғарғы панельдер тракт профильдерін (орташа ± SEM) көрсетеді; төменгі панельдер сегмент орналасуы бойынша түспен кодталған үлгілі тракт реконструкцияларын көрсетеді. Қызыл сызықтар афантазиясы бар тұлғаларды, көк сызықтар визуализаторларды білдіреді. Көлеңкеленген сұр аймақтар мен x осіндегі қара сызықтар маңызды сегменттерді белгілейді (p &amp;lt; 0.05, FWE түзетілген). Жіңішке сызықтар жеке қатысушылардың профильдерін, қалың сызықтар топтық орташа мәндерді көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Көпшілік көзін жұмып алманы елестете алса, туабіткен афантазиясы бар адамдар мұны жасай алмайды. Оларда жад пен көру қабілеті сақталғанымен, саналы бейнелер жасау мүмкіндігі жоқ. Бұрын бұл көру жүйесінің ақауы делінген болса, жаңа МРТ деректері жоғары деңгейдегі бақылау жүйелерін меңзейді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Афантазия кезінде маңдай-самаурын ақ зат жолдары өзгерген&lt;/li&gt;\n&lt;li&gt;Бастапқы көру қыртысы мен негізгі визуалды жолдар өзгеріссіз&lt;/li&gt;\n&lt;li&gt;Бейнелердің болмауы жоғары деңгейдегі интеграцияға байланысты&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Туабіткен афантазия ерікті түрде визуалды бейнелерді жасай алмаумен сипатталады. Бұл жағдайда көру білімі мен қабылдауы толық жұмыс істейді. Зерттеушілер бұл құбылысты түсіндіру үшін визуальды жолдардың немесе ассоциативті желілердің айырмашылығын тексерді.&lt;/p&gt;\n&lt;p&gt;Жұмысқа 18 афантазиясы бар және 18 бақылау тобындағы адам қатысты. Диффузиялық және құрылымдық МРТ көмегімен ақ зат микродұрылымы, граф теориясы негізіндегі желі ұйымы және қыртыс морфометриясы талданды. Нәтижесінде афантазиясы бар адамдарда маңдай-самаурын және белдеулік ақ зат жолдарында құрылымдық айырмашылықтар бары анықталды.&lt;/p&gt;\n&lt;p&gt;Сонымен қатар бастапқы көру қыртысында немесе негізгі көру жолдарында топтар арасында сенімді айырмашылықтар табылмады. Шағын іріктеме көлемі бұл нәтижелердің алдын ала сипатта екенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу шағын іріктемемен (18 адам) жүргізілгендіктен, қосымша тексеруді қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Туа біткен афантазия ерікті түрде визуалды образдарды елестете алмау қабілетсіздігімен сипатталады, алайда бұл ретте көрнекі білім сақталады. Бұл сенсорлық көріністер мен саналы қиялды ажырату үшін табиғи модель болып табылады. Функционалдық зерттеулер бұл айырмашылық жоғары деңгейдегі бақылау жүйелері мен жоғары деңгейдегі көру қыртысы арасындағы төмен бағытталған өзара әрекеттесудің өзгеруінен туындауы мүмкін екенін көрсетеді, бірақ оның құрылымдық белгілері әлі беймәлім күйінде қалған еді.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;p&gt;Туа біткен афантазияның екі бәсекелес гипотезасын — бірі көру жолдарындағы, екіншісі жоғары деңгейдегі ассоциативті желілердегі құрылымдық айырмашылықтарды болжайды — тексеру үшін авторлар диффузиялық және құрылымдық МРТ қолданды. Зерттеуге туа біткен афантазиясы бар 18 адам және сәйкестендірілген визуализация қабілеті бар 18 бақылау топ мүшесі қатысты. Ақ заттың микроқұрылымы, функционалдық қызығушылық аймақтары негізіндегі трактография, граф-теориялық желі ұйымы және ми қыртысының морфометриясы бойынша кешенді мультимодальды талдаулар жүргізілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Трактография — бұл тірі мидағы ақ заттың өткізгіш жолдарын (трактілерін) қалпына келтіруге және зерттеуге мүмкіндік беретін МРТ әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;p&gt;Афантазиясы бар адамдарда маңдай-самаурын және белдік ақ зат жолдарында, соның ішінде ілмекті шоқта (uncinate fasciculus), артқы төбешік аралық каллезді талшықтарда және дорсальды цингулумда құрылымдық айырмашылықтар анықталды. Сонымен қатар, алдыңғы инсула, алдыңғы префронтальды қыртыс және медиалды самаурын қыртысы сияқты фронтотемпоральды қыртыс аймақтарында да өзгерістер тіркелді. Бұл көрсеткіштер афантазияның кең когнитивті-аффективті профилі үшін нейроанатомиялық негіз құрайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ғалымдар ерте көру қыртысында, негізгі көру жолдарында немесе негізгі қиял желісінің тікелей құрылымдық байланыстарында топтар арасында сенімді айырмашылықтарды таппады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;p&gt;Алынған нәтижелер туа біткен афантазия негізгі көру жолдарын сақтай отырып, негізінен маңдай-самаурын және белдік жүйелеріндегі құрылымдық өзгерістермен сипатталатынын көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Іріктеме көлемінің шағын болуына байланысты бұл нәтижелер зерттеу сипатында және гипотеза тудырушы болып табылады тексеруді қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Соған қарамастан, бұл деректер саналы бейнелердің болмауына бірінші кезекте визуалды көріністердің өзі емес, интеграция мен саналы қолжетімділікті қамтамасыз ететін жоғары деңгейдегі жүйелер ықпал етуі мүмкін екенін болжайды.&lt;/p&gt;\n&lt;h3 id=\"kirispe1\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#kirispe1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Тума афантазия — бұл ерікті көру образдарын өмір бойы елестете алмау сипатымен ерекшеленетін жағдай, ол популяцияның шамамен 2–4% пайызында кездеседі. Бұл құбылыс қызықты парадокс тудырады: афантазиясы бар адамдар заттардың көру қасиеттерін жадтан дәл қалпына келтіріп, көру қабілетіне қатысты көптеген тапсырмаларды қалыпты орындай алады, бірақ субъектілі визуализация тәжірибесінің жоқтығын немесе өте төмен екенін айтады. Мұндай диссоциация образдардың феноменологиялық тәжірибесі болмаған кезде де көру білімдеріне қолжетімділік сақталатынын көрсетеді. Сондықтан тума афантазия ішкі жасалған көріністерді саналы көру тәжірибесіне айналдыру үшін қандай жоғары деңгейдегі механизмдер қажет екенін түсінуге көмектесетін тиімді модель болып табылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тума афантазия халықтың 2–4% қамтиды және жадтан ақпаратты алу сақталғанымен, субъектілі визуализация тәжірибесінің толық болмауымен сипатталады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Көру образдарының жоқтығынан басқа, афантазия әртүрлі өмір бойы сақталатын когнитивті және мінез-құлық белгілерін көрсетеді. Функционалды зерттеулер афантазиясы бар адамдар өмірбаяндық естеліктерді еске түсіргенде аз феноменологиялық бөлшектерді қалпына келтіретінін көрсетеді, бұл гиппокамп пен шүйде бөлігі арасындағы функционалды байланыстың төмендеуімен байланысты. Жадтан бөлек, бет-әлпетті тану және эмоцияларды түсіну қабілеттерінің бұзылуы байқалады, ал еріксіз еске түсетін естеліктер көру формасын сирек қабылдайды. Бұл нәтижелер афантазия бастапқы көру жүйесінен әлдеқайда кең таралған жоғары деңгейдегі жүйелерді қамтитынын білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Афантазия — адамның миында саналы түрде көз алдына елестету образдарын құра алмайтын нейropsixologik ерекшелік.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Соңғы көзқарастар афантазияны құрылымдық және функционалдық байланыстардың кең көлемде азаюымен сипатталатын ортақ нейродаму механизмдерімен байланыстырады. Алайда, бұл кең когнитивті-аффективті профильдің ортақ анатомиялық негізге сүйенетіні әзірге белгісіз. Тума прозопагнозия, АДРШ және аутизм спектрі бұзылыстары сияқты басқа нейродаму жағдайларында да ұқсас ерекшеліктер мидың зақымдануынсыз ақ заттың микроқұрылымдық өзгерістерімен түсіндіріледі. Құрылымдық нейровизуализация афантазиядағы функционалды өзгерістердің ұқсас нейроанатомиялық негізге ие екенін тексеру үшін маңызды әдіс болып табылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Афантазияның кең когнитивті профилі мидың әр түрлі жүйелеріндегі құрылымдық айырмашылықтарды көрсеткенімен, оның нақты анатомиялық негізі әлі де зерттелуде.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Афантазияны нейробейнелеу зерттеулері көру бейнелерінің болмауын түсіндіретін үш бәсекелес болжамды ұсынады. Біріншісі — сенсорлық күш көзқарасы — бұл жағдай ерте визуалды аймақтар мен жолдардың өзгеруінен туындап, ішкі бейнелердің сенсорлық қарқындылығын төмендетеді деп болжайды. Бұған бинокулярлық бәсекелестік кезінде прайминг әсерінің болмауы және елестету тапсырмалары кезінде қарашық өлшемі сияқты физиологиялық сигналдардың азаюы дәлел бола алады. Сонымен қатар, V1 аймағындағы өзгерген кросс-декодтау ментальді бейнелердің әдеттегі перцептивті форматқа жетпейтінін көрсетеді.&lt;/p&gt;\n&lt;p&gt;Екінші, саналы қолжетімділік көзқарасы мидың жоғары деңгейдегі бөлімдерінен төменге бағытталған реттеудің бұзылуына баса назар аударады. Афантазиясы бар адамдарда жоғары визуалды аймақтардағы белсенділік сақталғанымен, фузиформды елестету түйіні (FIN) мен сол жақ префронтальды аймақтардың, соның ішінде алдыңғы префронтальды қыртыстың (aPFC) және маңдайлық көз өрісінің (FEF) арасындағы функционалдық байланыс әлсіреген. Назар аудару мен маңыздылық аймақтары ішкі сигналдарды күшейтуде маңызды рөл атқарады, ал алдыңғы инсула дорсальды назар аудару және әдепкі режим желілері арасындағы ауысуды реттейді. Бұл көзқарас жоғары деңгейдегі визуалды аймақтарда қабылдау мен елестету көріністерінің қиылысуы азайғанымен расталады.&lt;/p&gt;\n&lt;h4 id=\"afantaziya-bolzhamdary-zhaene-zertteu-makhsattary\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#afantaziya-bolzhamdary-zhaene-zertteu-makhsattary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Афантазия болжамдары және зерттеу мақсаттары&lt;/span&gt;&lt;/a&gt;Афантазия болжамдары және зерттеу мақсаттары&lt;/h4&gt;\n&lt;p&gt;Үшінші бағыт — ерікті түрде генерациялау тұжырымдамасы — көптеген афантазиямен ауыратындар ояу кезінде айқын бейнелерді көрмесе де түс көретініне сүйене отырып, афантазияны бейнелерді ерікті түрде іске қосудағы нақты тапшылық ретінде түсіндіреді. Бұл теория саналы қолжетімділік көзқарасымен жоғары құрылымдардың қатысуы бойынша ұқсас болғанымен, егжей-тегжейінде өзгешеленеді: ерікті генерация тапшылығы сенсорлық көріністердің мүлдем болмауын болжаса, саналы қолжетімділік теориясы олардың туындайтынын, бірақ сана деңгейіне дейін күшейтілмейтінін айтады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеулер афантазияның үш негізгі түсіндірмесін бөліп көрсетеді: ерте визуалды жолдардың ақауы, жоғары аймақтардан саналы қолжетімділіктің бұзылуы және бейнелерді ерікті түрде генерациялау механизмінің жетіспеушілігі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл көзқарастарг түрлі анатомиялық болжамдар жасайды: жергілікті визуалды жолдар болжамы вертикальды шүйде бумасы (VOF), төменгі бойлық бума (ILF) және төменгі маңдай-шүйде бумасында (IFOF) айырмашылықтарды күтеді. Ал жоғары деңгейдегі теория фронто-темиртас жолдары мен ірі ми желілеріндегі өзгерістерді болжайды.&lt;/p&gt;\n&lt;p&gt;Осы жұмыстың мақсаты — афантазияның кең когнитивті-аффективті профилінің ортақ нейроанатомиялық маркерлерін анықтау және саналы бейне тәжірибесінің болмауы туралы бәсекелес болжамдарды тексеру. Ол үшін авторлар көпмодальды диффузиялық және T1 өлшемді МРТ қолданды. Жол, желі және қыртыс деңгейлеріндегі ықтимал топтық айырмашылықтарды сипаттау үшін төрт тәсіл — трактометрия, функционалдық қызығушылық аймақтарына (fROI) негізделген трактография, графтар теориясына негізделген желілік талдау және беткейлік қыртыс морфометриясы біріктірілді (S1-суреттегі талдау схемасын қараңыз).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Трактометрия — бұл мидың ақ зат жолдарының бойындағы микрукұрылымдық қасиеттерін талдауға және сигнал беру ерекшеліктерін дәл анықтауға мүмкіндік беретін әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"naetizheler1\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#naetizheler1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"atlaskha-negizdelgen-traktometriya-tangdamaly-mikrkhurylymdykh-ajyrmashylykhtardy-anykhtajdy\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#atlaskha-negizdelgen-traktometriya-tangdamaly-mikrkhurylymdykh-ajyrmashylykhtardy-anykhtajdy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атласқа негізделген трактометрия таңдамалы микрқұрылымдық айырмашылықтарды анықтайды&lt;/span&gt;&lt;/a&gt;Атласқа негізделген трактометрия таңдамалы микрқұрылымдық айырмашылықтарды анықтайды&lt;/h4&gt;\n&lt;p&gt;Біз атлас арқылы анықталған негізгі ақ зат трактілері бойымен фракциялық анизотропияны (FA) сандық түрде бағаладық, бұл ақ зат микрқұрылымының трактілік-профильдік көрсеткішін қамтамасыз етті. Көруді өңдеуге қатысатын негізгі жолдар, соның ішінде VOF, IFOF және ILF, сондай-ақ жоғары деңгейлі функциялармен байланысты трактілер, атап айтқанда фронто-париеталды назар жолдары (жоғарғы ұзынынан кеткен буда: SLF, доғал буда: AF), медиальды фронто-темпоральды жолдар (унсинатты буда: UF, вентральды цингулюм) және когнитивті басқару жолдары (дорсальды цингулюм) бағаланды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Фракциялық анизотропия (FA) — су молекулаларының ақ зат талшықтары бойымен қаншалықты бағытталған түрде таралатынын көрсететін көрсеткіш.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл нәтижелерді толық сипаттау үшін зақымдалған сегменттерде аксиальды диффузияны (AD), радиальды диффузияны (RD) және нейрит бағдарының дисперсиясы мен тығыздығын бейнелеу (NODDI) метрикаларын зерттедік (S2 сурет және S1 кесте). Бұл қосымша талдаулар талшықтар геометриясының артефактілеріне емес, микроқұрылымдық өзгерістерге сәйкес келді.&lt;/p&gt;\n&lt;p&gt;Оң жақ SLF-II және оң жақ вентральды цингулюм FA мәнінің шамалы төмендеуін көрсетті (S3 сурет); алайда бұл әсерлер талшық геометриясымен байланысты болуы мүмкін, сондықтан кейіннен түсіндірілмеді.&lt;/p&gt;\n&lt;h4 id=\"graf-teoriyalykh-zhelilik-taldau-buzylghan-segregaciya-men-zheliaralykh-ortalykhtylykhty-ashady\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#graf-teoriyalykh-zhelilik-taldau-buzylghan-segregaciya-men-zheliaralykh-ortalykhtylykhty-ashady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Граф-теориялық желілік талдау бұзылған сегрегация мен желіаралық орталықтылықты ашады&lt;/span&gt;&lt;/a&gt;Граф-теориялық желілік талдау бұзылған сегрегация мен желіаралық орталықтылықты ашады&lt;/h4&gt;\n&lt;p&gt;Әрі қарай, трактілік деңгейдегі айырмашылықтар ауқымды ми желілерінің құрылымдық ұйымдасуына әсер ететінін тексеру үшін граф-теориялық талдауды қолдандық. Schaefer 17-желілік парцелляциясына негізделген 400 × 400 өлшемді бүкіл мидың құрылымдық байланыс матрицасын жасадық (таллдау барысы 2A-суретте көрсетілген). Осы салмақталған бағдарланбаған графтан желі ұйымын сипаттау үшін түйіндік метрикаларды есептедік.&lt;/p&gt;\n&lt;p&gt;Топтар арасындағы айырмашылықтар үш жоғары деңгейлі желілік метрикада байқалды (2B–D суреттер; S2 кесте). Афантазияда дорсальды назар желісінің негізгі түйіні болып табылатын сол жақ FEF (2A суреттегі DAN B) түйін күшінің төмендеуін көрсетті, бұл осы түйіндегі жалпы құрылымдық байланыстың әлсірегенін білдіреді. Саламаттылық/вентральды назар желісінің (VAN A) бөлігі болып табылатын сол жақ алдыңғы инсула және әдепкі режим желісінің (Default B) сол жақ дорсолатеральды префронтальды қыртысы (dlPFC) азайған кластерлену коэффициентін көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Желілік талдау сол жақ FEF-те түйін күшінің төмендеуін, сол жақ инсула мен dlPFC-те кластерлену коэффициентінің азаюын, ал оң жақ dmPFC-те қатысу коэффициентінің артуын анықтады.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Керісінше, әдепкі режим желісінің (Default A) оң жақ дорсомедиальды префронтальды қыртысы (dmPFC) артқан қатысу коэффициентін көрсетті, бұл афантазиясы бар тұлғаларда желіаралық байланыстың күшейгенін білдіреді. Сонымен қатар, оң жақ соматомоторлық желіде қатысу коэффициентінің азайғаны байқалды. Баламалы парцелляцияларды қолданған бақылау талдаулары бұл нәтижелердің барлық атлас нұсқаларында тұрақты екенін растады (S5A–B суреттер).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Қатысу коэффициенті (participation coefficient) түйін байланыстарының әртүрлі ми желілері арасында қалай тарағанын көрсетеді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кластерлену коэффициенттері бойынша сезімталдық талдауы айтарлықтай топтық айырмашылықтарды таппады (сол жақ инсула: B-M статистикасы = -0.06; сол жақ dlPFC: B-M статистикасы = 1.30; барлық pFDR &amp;gt; 0.86), бұл инсула мен dlPFC кластерлену айырмашылықтарының желі топологиясына тән емес екенін көрсетеді.&lt;/p&gt;\n&lt;p&gt;Осы түйіндерге тікелей құрылымдық байланыстарды трассирлеу сол жақ алдыңғы инсуланың негізінен AF және IFOF арқылы қосылғанын көрсетсе (S5C сурет), dmPFC байланысы дорсальды цингулюм жолдарын қамтыды. Керісінше, негізгі көру жолдарында трактометриялық айырмашылықтардың жоқтығына сәйкес, зерттелген көру қыртысының түйіндерінде айтарлықтай айырмашылықтар байқалмады.&lt;/p&gt;\n&lt;h4 id=\"negizgi-bejneleu-zhelisining-akh-zat-bajlanystarynda-ajyrmashylykh-tabylmady\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#negizgi-bejneleu-zhelisining-akh-zat-bajlanystarynda-ajyrmashylykh-tabylmady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Негізгі бейнелеу желісінің ақ зат байланыстарында айырмашылық табылмады&lt;/span&gt;&lt;/a&gt;Негізгі бейнелеу желісінің ақ зат байланыстарында айырмашылық табылмады&lt;/h4&gt;\n&lt;p&gt;Әрі қарай біз функционалдық қасиеттері афантазияда өзгерген негізгі бейнелеу желісінің ақ зат байланыстарын сипаттадық. 7T фМРТ нәтижелері негізінде fROI-ларды анықтадық (Liu, Zhan, et al., 2025): FIN, сол жақ aPFC, сол жақ OFC және оң жақ алдыңғы интрапариетальды жүлге (aIPS). Әрбір топтағы төрт ROI үшін (S4A сурет) сұр/ақ зат шекарасындағы проекциясын қиып өтетін ағымдарды анықтадық және тракт құрылымын екі индекс арқылы бағаладық: көлем бойынша нормаланған ағымдар саны (S4B сурет) және анатомиялық анықталған будалардағы ағымдар үлесі (S4C сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Қорытындылар топтарды салыстыру мен байестік талдауға негізделген, алайда кейбір жолдардағы өзгерістердің жоқтығын үлкенірек таңдамаларда тексеру қажет.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бірнеше салыстырулар үшін түзетуден кейін ешқандай индекс үшін айтарлықтай топтық айырмашылықтар байқалмады. Байес факторы (BF) талдауы дорсальды және вентральды көру қыртысын байланыстыратын негізгі ақ зат будасы VOF-тағы (BF = 0.32) көлем бойынша нормаланған ағымдар санында топтық айырмашылықтың жоқтығына орташа дәлел берді.&lt;/p&gt;\n&lt;h4 id=\"khyrtys-khalyngdyghy-sol-zhakh-apfc-te-azajghan,-limbikalykh-ajmakhtarda-artkhan\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#khyrtys-khalyngdyghy-sol-zhakh-apfc-te-azajghan,-limbikalykh-ajmakhtarda-artkhan\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қыртыс қалыңдығы: сол жақ aPFC-те азайған, лимбикалық аймақтарда артқан&lt;/span&gt;&lt;/a&gt;Қыртыс қалыңдығы: сол жақ aPFC-те азайған, лимбикалық аймақтарда артқан&lt;/h4&gt;\n&lt;p&gt;Соңында біз бүкіл ми бойынша қыртыс қалыңдығын зерттедік. Бұрынғы жұмыстар префронтальды және ерте көру қыртысының қалыңдығын образды ойлаудың айқындығындағы жеке айырмашылықтармен байланыстырған еді (Bergmann және т.б., 2016b). Сондықтан біз афантазияның V1 қалыңдауымен немесе ұлғаюымен байланысты екенін тексердік.&lt;/p&gt;\n&lt;h4 id=\"khyr-khabyghynyng-morfometriyasy-zhaene-akh-zattyng-mikrokhurylymy\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#khyr-khabyghynyng-morfometriyasy-zhaene-akh-zattyng-mikrokhurylymy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қыр қабығының морфометриясы және ақ заттың микроқұрылымы&lt;/span&gt;&lt;/a&gt;Қыр қабығының морфометриясы және ақ заттың микроқұрылымы&lt;/h4&gt;\n&lt;p&gt;Ерте көру қыртысы аймақтарының ешқайсысында қабық қалыңдығы немесе көлемі бойынша айтарлықтай айырмашылықтар байқалмады, Байес факторлары (BF) калькариналық қыртыс (S3 кесте) пен V1 үшін де (S4 кесте) топтардың эквиваленттігін орташа дәрежеде растады. Керісінше, миды тұтас талдау кезінде афантазиясы бар адамдарда сол жақ алдыңғы префронтальды қыртыста (aPFC) қалыңдығы азайған бір ғана маңызды префронтальды кластер анықталды (3A сурет). Кластердің статистикалық көрсеткіштері S5 кестеде берілген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Афантазия кезінде сол жақ aPFC қалыңдығының төмендеуі және медиальды самай-лимбикалық аймақтарда қалыңдықтың артуы, сондай-ақ NODDI мәліметтері бойынша ақ зат микроқұрылымындағы өзгерістер анықталды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сонымен қатар, афантазия кезінде бірқатар медиальды самай-лимбикалық аймақтарда, соның ішінде сол жақ алдыңғы парагиппокамп қатпаршағында, энториналды қыртыста, сондай-ақ оң жақ энториналды қыртыста, ретроспленальды қыртыста және артқы белдеулі қыртыста қалыңдығы жоғары екендігі байқалды. NODDI талдауы афантазия кезінде екі жақты медиальды самай аймақтарында және сол жақ precuneus-те жоғары NDI мәндерін анықтады (S6 сурет), бұл аталған медиальды самай аймақтарындағы микроқұрылымдық айырмашылықтармен сәйкес келеді.&lt;/p&gt;\n&lt;h4 id=\"funkcionaldykh-kontekst-zhaene-metaanalitikalykh-dekodtau\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#funkcionaldykh-kontekst-zhaene-metaanalitikalykh-dekodtau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Функционалдық контекст және метааналитикалық декодтау&lt;/span&gt;&lt;/a&gt;Функционалдық контекст және метааналитикалық декодтау&lt;/h4&gt;\n&lt;p&gt;Анықталған қалыңдық айырмашылықтарының функционалдық мағынасын түсіндіру үшін авторлар Neurosynth көмегімен t-картаның метааналитикалық декодтауын жүргізді (3B сурет). Сол жақ aPFC кластері «ниеттер» (r = 0.26), «әрекеттер» (r = 0.25) және «жақын (кеңістік)» (r = 0.25) терминдерімен тығыз байланыс көрсетті. Ал афантазия кезінде қалыңдығы артқан аймақтар гиппокамп, парагиппокамп және амигдала сияқты анатомиялық ұғымдармен корреляция көрсетті (барлық r &amp;gt; 0.14), бұл анықталған аймақтардың функционалдық табиғатын айқындай түседі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метааналитикалық декодтау – бұл мидың анықталған координаттарын бұрын жарияланған мыңдаған нейровизуализациялық зерттеулермен салыстырып, ықтимал психологиялық функцияларды анықтау тәсілі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"koepoelshemdi-logistikalykh-regressiyalykh-taldau\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#koepoelshemdi-logistikalykh-regressiyalykh-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Көпөлшемді логистикалық регрессиялық талдау&lt;/span&gt;&lt;/a&gt;Көпөлшемді логистикалық регрессиялық талдау&lt;/h4&gt;\n&lt;p&gt;Зерттеу барысында топтарды ең жақсы ажырататын құрылымдық белгілер жиынтығын анықтау үшін айыппұл салынған көпөлшемді логистикалық регрессия қолданылды. Бірлік талдауда топтық айырмашылықтарды көрсеткен параметрлерді ғана пайдалана отырып, фракциялық анизотропия (FA), қабық қалыңдығы және граф теориясы көрсеткіштері үшін жеке модельдер құрылды. Зерттеу модельдері жоғары ішкі дискриминациялық қабілетті көрсетті, барлық қисық асты аумақтары (AUC) 0.92-ден жоғары болды.&lt;/p&gt;\n&lt;p&gt;Барлық модельдер бойынша афантазияның ең күшті тәуелсіз предикторы мыналар болды: оң жақ ілмекті будада (uncinate fasciculus) және артқы париетаралық сүйелді дене бөлігінде (interparietal corpus callosum) төмендеген FA, сол жақ дорсальды белдеу будасында жоғарылаған FA, сол жақ алдыңғы инсулада төмендеген кластерлену коэффициенті, сол жақ FEF-те түйін күшінің азаюы, сол жақ aPFC қалыңдығының азаюы, сондай-ақ алдыңғы парагиппокамп және ретроспленальды қыртыс қалыңдығының артуы. Модельдің толық статистикасы қосымша материалдарда берілген.&lt;/p&gt;\n&lt;h4 id=\"geterogendilikti-tekseru\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#geterogendilikti-tekseru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гетерогенділікті тексеру&lt;/span&gt;&lt;/a&gt;Гетерогенділікті тексеру&lt;/h4&gt;\n&lt;p&gt;Афантазияның ықтимал әртүрлілігін ескере отырып, барлық қатысушылар ерікті бейнелердің өмір бойы жоқ екенін мәлімдегеніне қарамастан, Левевне тесті арқылы әрбір айнымалының дисперсиясы топтар арасында ерекшеленетінін тексердік. Топтар арасында дисперсия айтарлықтай ерекшеленген жоқ (S6 кесте), алайда әр топта 18 қатысушы болғандықтан, бұл тест гетерогенділікті анықтауда шектеулі қуатқа ие. Қатысушылардың көпшілігі (13/18) ядролық афантазия бар екенін хабарлады, сондықтан бұл нейроанатомиялық профиль дәл осы топты сипаттауы ықтимал.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әр топтағы шағын іріктеме көлемі (n=18) жеке фенотиптік гетерогенділік пен топтар арасындағы шағын айырмашылықтарды анықтау мүмкіндігін шектейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"talkhylau1\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#talkhylau1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;h4 id=\"tua-bitken-afantaziyanyng-anatomiyalykh-negizderi\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#tua-bitken-afantaziyanyng-anatomiyalykh-negizderi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Туа біткен афантазияның анатомиялық негіздері&lt;/span&gt;&lt;/a&gt;Туа біткен афантазияның анатомиялық негіздері&lt;/h4&gt;\n&lt;p&gt;Бұл жұмыста туа біткен афантазия сенсорлық көріністің оқшау тапшылығы емес, жоғары деңгейлі префронтальды жүйелер мен жоғары деңгейдегі көру қыртысы арасындағы функционалдық байланыстың төмендеуімен байланысты деген болжамды растайтын алғашқы тікелей анатомиялық дәлелдер ұсынылған. Трактметрия, желілік талдау және қыртыс морфометриясы арқылы афантазиясы бар тұлғаларда фронто-темпоральды және цингулярлы жүйелерге шоғырланған таңдамалы құрылымдық айырмашылықтар анықталды. Бұл ретте бастапқы көру қыртысында немесе зерттелген негізгі көру жолдарында сенімді топтық айырмашылықтар табылмады. Алынған нәтижелер туа біткен афантазия жеке фокальды аймақта емес, таратылған, бірақ өзара байланысқан жоғары деңгейлі ми желілеріндегі нейроанатомиялық өзгерістерді қамтитынын көрсетеді.&lt;/p&gt;\n&lt;p&gt;Бұл құрылымдық фенотип төрт бақылаумен сипатталады. Біріншіден, қатысушыларда ілмекті шоғырда (UF) және артқы париеталық мозо денесінде фракциялық анизотропияның (FA) төмендеуі байқалды, бұл фронто-темпоральды және жартышарлар аралық ассоциативті жолдардың өзгергенін білдіреді. Бұл үлгі орбитофронтальды қыртыс (OFC) пен алдыңғы уақытша аймақтар арасындағы функционалдық байланыстың бұрын анықталған төмендеуіне сәйкес келеді. Сондай-ақ бұл ерекшеліктер автобиографиялық естелік, бет-әлпетті тану және эмоционалдық сана сияқты мінез-құлық сипаттамаларына қатысты болуы мүмкін, алайда құрылым мен функция арасындағы тікелей байланыстарды болашақ зерттеулерде тексеру қажет.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Туа біткен афантазия бастапқы көру қыртысында өзгерістер болмаған кезде, ілмекті шоғыр мен мозо денесіндегі FA төмендеуін қамтитын фронто-темпоральды және цингулярлы жүйелердегі құрылымдық өзгерістермен сипатталады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Екіншіден, дорсальды цингулумда FA және невриттер тығыздығының артуы когнитивтік бақылау жолының ұйымдастырылуының өзгергенін көрсетеді. Бұл өзгеріс өзгертілген үстінен-астыға (top-down) реттеудің ішкі жасалған бейнелерге саналы түрде қол жеткізуге әсер ететінін көрсетуі мүмкін. Үшіншісі, желілік деңгейде афантазия сол жақ алдыңғы инсулада локальды сегрегацияның төмендеуімен, маңдайлық ассоциативті аймақтарда байланыс метрикаларының өзгеруімен және оң жақ dmPFC-де желіаралық түйіндер орталықтылығының артуымен қатар жүрді. Бұл нәтижелер назар аудару, салиенттік және әдепкі режим жүйелерінің ұйымдастырылуының өзгергеніне нұсқайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Фракциялық анизотропия (FA) — ми тіндеріндегі су диффузиясының бағытын өлшейтін көрсеткіш, ол ақ заттың тұтастығы мен миелиндену дәрежесін көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Төртіншіден, сол жақ aPFC қыртысының қалыңдығы таңдамалы түрде азайғаны анықталды — бұл аймақ афантазияда функционалды түрде ажыратылғаны бұрын анықталған болатын. Керісінше, энториналды және ретросплениальды қыртысты қамтитын медиальды уақытша лимбиялық аймақтарда қыртыс қалыңдығы артқан. Жалпы алғанда, трактар мен желілер бойынша нәтижелер байқалған құрылымдық айырмашылықтарды негізінен фронто-темпоральды және цингулярлы жүйелерге локализациялайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бұл нәтижелер корреляциялық сипатта және тек туа біткен афантазия үшін алынған; себеп-салдарлық байланыстарды дәлелдеу үшін пролонгирленген зерттеулер қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"elestetu-men-afantaziyanyng-uesh-satyly-modeli\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#elestetu-men-afantaziyanyng-uesh-satyly-modeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Елестету мен афантазияның үш сатылы моделі&lt;/span&gt;&lt;/a&gt;Елестету мен афантазияның үш сатылы моделі&lt;/h4&gt;\n&lt;p&gt;Алынған нәтижелер саналы елестетудің көп сатылы моделімен (Liu, 2026) сәйкес келеді. Бұл тұжырымдамаға сәйкес, елестету үш процеске сүйенеді: ішкі визуалды репрезентацияларды генерациялау, оларды тұтас объектілерге немесе көріністерге интеграциялау және саналы қолжетімділік үшін осы контентті күшейту. Функционалды нейровизуализация бірінші саты — генерация — афантазиясы бар адамдарда сақталғанын көрсетеді: елестету тапсырмалары кезінде визуалды қыртыс белсендіріледі, бұл семантикалық және эпизодтық жадтан ақпаратты алумен байланысты болуы мүмкін. Біздің ROI талдауымыз топтар арасындағы негізгі елестету желісіндегі құрылымдық байланыстылықта айырмашылықтардың жоқтығын растайды. Мінез-құлық деректері де афантазиясы бар адамдардың жарқын бейнелер болмаса да, визуализаторлар сияқты карталарды ақыл-оймен зерттеу кезінде мақсатты көз қозғалыстарын жасайтынын көрсетеді (Takamura et al., 2026).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Афантазия кезінде визуалды бейнелерді генерациялау сақталған, бірақ кейінгі интеграция мен саналы қолжетімділік бұзылған, бұл афантазиясы бар адамдардың ерікті түрде сенсорлық репрезентацияларды жасай алмауы туралы гипотезаны жоққа шығарады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"integraciya,-kueshejtu-zhaene-prefrontaldy-khyrtystyng-roeli\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#integraciya,-kueshejtu-zhaene-prefrontaldy-khyrtystyng-roeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интеграция, күшейту және префронталды қыртыстың рөлі&lt;/span&gt;&lt;/a&gt;Интеграция, күшейту және префронталды қыртыстың рөлі&lt;/h4&gt;\n&lt;p&gt;Осы модель аясында афантазия кезінде бейнелердің жарқындығының төмендеуі интеграцияның бұзылуымен, ал саналы қолжетімділіктің шектелуі — назарды күшейтудегі кемшіліктермен түсіндіріледі. Алдыңғы префронталды қыртыс (aPFC) осы процестің реттеушісі рөліне негізгі үміткер болып табылады. Біз осы аймақта қыртыс қалыңдығының азайғанын анықтадық, бұл сол жақ aPFC мен визуалды қыртыстың жоғары бөлімдері арасындағы функционалды байланыстың төмендеуі туралы деректерге сәйкес келеді (Liu &amp;amp; Bartolomeo, 2025). aPFC-нің рөлі бейнелерді генерациялауда емес, ерікті бақылау мен контентті таңдауда көрінеді. Саналы түс көрумен ұқсастық, яғни aPFC белсенділігі түстің жарқындығы мен айқындығын бақылаумен байланыстылығы, афантазияда дәл бақылау механизмі зардап шегетінін, бейнелерді еріксіз генерациялау қабілеті емес екенін растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;aPFC (алдыңғы префронталды қыртыс) — жоспарлау, өзін-өзі тану және назарды басқару сияқты жоғары когнитивті функцияларға жауап беретін ми аймағы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"elestetu-men-zhad-arasyndaghy-nejroanatomiyalykh-bajlanystar\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#elestetu-men-zhad-arasyndaghy-nejroanatomiyalykh-bajlanystar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Елестету мен жад арасындағы нейроанатомиялық байланыстар&lt;/span&gt;&lt;/a&gt;Елестету мен жад арасындағы нейроанатомиялық байланыстар&lt;/h4&gt;\n&lt;p&gt;Үш сатылы модель афантазияның эпизодтық жадтың бұзылуымен байланысын түсіндіруге мүмкіндік береді. Біздің ілмек тәрізді шоғыр (uncinate fasciculus), сондай-ақ энторинальды және ретроспленальды қыртыстағы құрылымдық өзгерістер туралы деректеріміз афантазия патофизиологиясына мнемоникалық жүйелердің тартылғанын көрсетеді. Бұл фронталды-темпоральды бақылау желілері мен жад жүйелеріндегі жалпы нейроанатомиялық өзгерістер екі фенотиптің де негізінде жатқанын болжайды. Дегенмен, біздің деректеріміз құрылымдық сипатта болғандықтан, олар ақпаратты өңдеудің қай сатысы бұзылудың бастапқы буыны екенін нақты анықтауға мүмкіндік бермейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бұл зерттеу құрылымдық деректерге (МРТ) негізделген, олар корреляцияларды көрсетеді, бірақ нақты анатомиялық өзгерістер мен елестету сатыларының бұзылуы арасындағы себеп-салдарлық байланысты дәлелдемейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"alghashkhy-koeru-khyrtysynyng-roeli-zhaene-khurylymdykh-oezgerister\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#alghashkhy-koeru-khyrtysynyng-roeli-zhaene-khurylymdykh-oezgerister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Алғашқы көру қыртысының рөлі және құрылымдық өзгерістер&lt;/span&gt;&lt;/a&gt;Алғашқы көру қыртысының рөлі және құрылымдық өзгерістер&lt;/h4&gt;\n&lt;p&gt;V1 аймағындағы құрылымдық айырмашылықтардың болмауы алғашқы көру қыртысының визуалды бейнелерді қалыптастыру үшін міндетті емес деген дәлелдермен сәйкес келеді. Қыртыстық соқырлықпен ауыратын науқастардағы зерттеулер V1 зақымдануы визуалды елестету қабілетінің жойылуына әрқашан алып келмейтінін көрсетеді. Қазіргі теориялық модельдерге сәйкес, V1 белсенділігі жоғары деңгейлі желілер арқылы реттелетін тежегіш сигналдармен басқарылады. Афантазия кезіндегі V1 белсенділігінің өзгеруі алғашқы ақау емес, жоғары деңгейлі желілердің модуляциясының бұзылуы болуы мүмкін. Біздің деректеріміз және Байес факторлары ерте көру аймақтарының көпшілігінің эквиваленттілігін көрсетеді, дегенмен беткейлік U-тәрізді талшықтардың рөлі әлі де зерттеуді қажет етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;V1 аймағында құрылымдық айырмашылықтардың болмауы афантазияның алғашқы сенсорлық өңдеу емес, жоғары деңгейлі когнитивті желілердің дисфункциясымен байланысты екенін растайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"nejroanatomiyalykh-oezgeristerding-oernekteri\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#nejroanatomiyalykh-oezgeristerding-oernekteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нейроанатомиялық өзгерістердің өрнектері&lt;/span&gt;&lt;/a&gt;Нейроанатомиялық өзгерістердің өрнектері&lt;/h4&gt;\n&lt;p&gt;Анықталған өзгерістер бірыңғай ақау өрнегін құрамайды. Афантазия кезінде кейбір құрылымдардың көлемінің артуы негізінен медиальды қыртыстық және белдеулік аймақтарда (дорсальды цингулюм, белдеулік қыртыс, медиальды префронтальды қыртыс) байқалады. Бұл когнитивті бақылау және жад жүйелерінің қайта ұйымдастырылғанын көрсетуі мүмкін. Мұндай өзгерістер компенсаторлық сипатқа ие болуы мүмкін, өйткені афантазиясы бар адамдар визуалды елестетуді талап ететін тапсырмаларда баламалы стратегияларды қолданады және алдыңғы белдеулік қыртыс пен гиппокамп арасында жоғары функционалды байланысты көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Байес факторы — деректердің айырмашылықтардың жоқтығы (эквиваленттілік) гипотезасын қаншалықты қолдайтынын бағалауға мүмкіндік беретін статистикалық көрсеткіш.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tuesindiru-zhaene-shekteuler\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#tuesindiru-zhaene-shekteuler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түсіндіру және шектеулер&lt;/span&gt;&lt;/a&gt;Түсіндіру және шектеулер&lt;/h4&gt;\n&lt;p&gt;Нәтижелердің когнитивті түсіндірмесі жанама болып қала береді, өйткені бақылау желілерінің функциялары бірдей қатысушыларда тәуелсіз бағаланбаған. Афантазияның фенотиптік гетерогенділігі болашақта үлкенірек таңдамалармен жұмыс істеуді талап етеді. Сондай-ақ, диффузиялық МРТ модельге негізделген бағалауларды ұсынатынын, тікелей биологиялық көрсеткіштер емес екенін ескеру қажет. Дегенмен, қыртыс қалыңдығын бағалау үшін Т1-салмақты МРТ деректерін пайдалану қорытындылардың сенімділігін арттырады. Жалпы алғанда, зерттеу саналы елестетудің құрылымдық негізі сенсорлық бейнелерде емес, жоғары деңгейлі интегративті жүйелерде орналасқанын көрсетеді.&lt;/p&gt;\n&lt;h3 id=\"aedister1\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#aedister1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"khatysushylar\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#khatysushylar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қатысушылар&lt;/span&gt;&lt;/a&gt;Қатысушылар&lt;/h4&gt;\n&lt;p&gt;Өз бетінше хабарлаған туабіткен афантазиясы бар 18 адам (орташа жасы және ауытқуы 31.79 ± 12.11 жас; 11 әйел) және 18 типтік визуализатор (32.29 ± 9.53 жас; 15 әйел) зерттеуге қабылданды. Афантазиясы бар он қатысушы және бес визуализатор бұрын психикалық образдар бойынша 7 Тесла fMRI зерттеуіне қатысқан болатын. Әр топтағы 18 адамнан тұратын іріктеу көлемі халықтың шамамен 2–4% құрайтын туабіткен афантазияны жинау шектеулерін көрсетеді, бұл ұқсас туабіткен жағдайларға арналған негізгі құрылымдық МРТ жұмыстарымен салыстырмалы. Барлық қатысушылар 1-ден («мүлдем образ жоқ») 5-ке («кәдімгі көрудей тамаша анық және айқын») дейін бағаланатын 16 тармақтан тұратын визуалды образдардың айқындылығы сауалнамасын (VVIQ) толтырды, ал жалпы ұпай 16 мен 80 аралығын құрады.&lt;/p&gt;\n&lt;p&gt;Афантазиясы бар барлық қатысушылардың VVIQ ұпайлары 22-ден төмен болды (орташасы 17.06 ± 2.10, 18 адамның 13-інде ядролық афантазия), ал Дж.Л. жүргізген құрылымдық сұхбат арқылы ерікті визуалды образдардың өмір бойы болмағаны расталды, өйткені қазіргі уақытта кең танылған объективті диагностикалық маркер жоқ. Визуализаторлардың барлығының VVIQ ұпайлары 50-ден жоғары болды (63.67 ± 9.54). Барлық қатысушылар оңқайлар еді, көру және есту қабілеті қалыпты немесе қалыптыға дейін түзелген, сондай-ақ неврологиялық немесе психикалық бұзылулардың тарихы жоғын хабарлады. Екі топ жасы, жынысы және білім жылдары бойынша сәйкестендірілді. Зерттеуді INSERM институционалдық комитеті C13-41 хаттамасы бойынша мақұлдады және барлық қатысушылар Хельсинки декларациясына сәйкес жазбача хабардар етілген келісім берді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VVIQ (визуалды образдардың айқындылығы сауалнамасы) — бұл субъектінің өз сезімін бағалау шкаласы, мұнда төмен ұпайлар ментальді суреттерді жасай алмауды (афантазия), ал жоғары ұпайлар қалыпты визуализацияны білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"keskindi-alu\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#keskindi-alu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кескінді алу&lt;/span&gt;&lt;/a&gt;Кескінді алу&lt;/h4&gt;\n&lt;p&gt;Барлық МРТ деректері Париж ми институтының Нейробейнелеу зерттеу орталығында (CENIR) 64 арналы бас орамымен жабдықталған Siemens 3T MAGNETOM Prisma сканерінде алынды. Диффузиялық-салмақталған томография (DWI) деректері төрт тізбек бойынша (барлығы 398 көлем) екі фазалық кодирлеу бағытында (алдыңғы-арқалық, AP; артқы-алдыңғы, PA) жиналды, олардың әрқайсысы екі b мәнінде (b = 1500 және 3000 с/мм²) 98–99 бірдей таратылған диффузия бағыттарын қамтыды. Сонымен қатар, диффузиялық салмақталмаған 28 көлем (b = 0) алынды. Жоғары ажыратымдылықтағы T1-салмақталған анатомиялық суреттер сол сессияда TR = 2400 мс, TE = 2.22 мс және 9° еңкейту бұрышы параметрлерімен жазылды.&lt;/p&gt;\n&lt;h4 id=\"dwi-zhaene-t1-oelshengen-derekterdi-oengdeu-sur-zatty/akh-zatty-segmentteu\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#dwi-zhaene-t1-oelshengen-derekterdi-oengdeu-sur-zatty/akh-zatty-segmentteu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;DWI және T1-өлшенген деректерді өңдеу Сұр затты/ақ затты сегменттеу&lt;/span&gt;&lt;/a&gt;DWI және T1-өлшенген деректерді өңдеу Сұр затты/ақ затты сегменттеу&lt;/h4&gt;\n&lt;p&gt;Анатомиялық T1-суреттер тендікті сенімді сегменттеу үшін терең оқыту және орныққан нейробейнелеу құралдарын біріктіретін DeepPrep 25.1.0 конвейері арқылы алдын ала өңделді. Өңдеу FreeSurfer (v7.2.0; RRID: SCR_001847) көмегімен қозғалысты түзетуді, SimpleITK (v2.3.0) арқылы ығысу өрісін түзетуді, FastSurfer (v1.1.0) ішіндегі FastSurferCNN көмегімен бас сүйегін алып тастау және тіндерді сегменттеуді, сондай-ақ FastCSR (v1.0.0) арқылы қыртыс бетін қайта құруды қамтыды. Алдын ала өңделген T1-сурет кейінгі диффузиялық талдаулар үшін анатомиялық бағдар ретінде қызмет етті.&lt;/p&gt;\n&lt;h4 id=\"diffuziyalykh-oelshengen-keskindi-aldyn-ala-oengdeu\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#diffuziyalykh-oelshengen-keskindi-aldyn-ala-oengdeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Диффузиялық-өлшенген кескінді алдын ала өңдеу&lt;/span&gt;&lt;/a&gt;Диффузиялық-өлшенген кескінді алдын ала өңдеу&lt;/h4&gt;\n&lt;p&gt;Диффузиялық-салмақталған суреттер әдепкі параметрлері бар QSIPrep v1.0.2 көмегімен өңделді. Фазалық кодирлеу полярлығы бірдей тізбектер өңдеу алдында біріктірілді. Конвейер MP-PCA шуды кетіруді, Гиббс сақиналарын жоюды, b = 0 суреттері бойынша қарқындылықты нормалауды, N4 ығысу өрісін түзетуді, сондай-ақ бас қозғалысын, құйынды токтарды және магниттік сезгіштік бұрмалануларын FSL құралдары eddy және TOPUP көмегімен шығарындыларды ауыстыруды қоса отырып түзетуді қамтыды. Соңғы интерполяция якобиандық модуляцияны қолдана отырып орындалды және деректер әр қатысушының жеке AC-PC кеңістігіне 1.25 мм изотropты ажыратымдылықта қайта үлгіленді.&lt;/p&gt;\n&lt;h4 id=\"talshykhty-khajta-khuru\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#talshykhty-khajta-khuru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талшықты қайта құру&lt;/span&gt;&lt;/a&gt;Талшықты қайта құру&lt;/h4&gt;\n&lt;p&gt;Алдын ала өңделген DWI деректері mrtrix_multishell_msmt_ACT-hsvs жұмыс процесін қолдана отырып, QSIRecon v1.0.1 арқылы қайта құрылды. Қайта құру барысында antsBrainExtraction ми маскалары пайдаланылды. Көп тінді жауап функциялары Дхолландер алгоритмі арқылы бағаланды, ал ақ зат талшықтарының бағдарының таралуы (FOD) көп тінді шектелген сфералық деконволюция көмегімен есептелді және mtnormalize арқылы қарқындылығы нормаланды. Алынған FOD трактография үшін пайдаланылды, ал анатомиялық шектеулер бес тін түрінің суреттерін жасау үшін T1-салмақталған гибридті бет-көлемдік сегментациядан (hsvs) алынды. Мидың толық трактографиясы анатомиялық шектелген трактография (ACT) арқылы жүзеге асырылды, мұнда ағын сызықтары сұр-ақ зат шекарасында басталып, аяқталуға шектелді. SIFT2 әр ағын сызығының салмақтарын бағалау үшін қолданылды және кейінгі шоғыр сегментациясы мен байланыс талдаулары үшін сақталды.&lt;/p&gt;\n&lt;h4 id=\"shoghyrdy-segmentteu\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#shoghyrdy-segmentteu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шоғырды сегменттеу&lt;/span&gt;&lt;/a&gt;Шоғырды сегменттеу&lt;/h4&gt;\n&lt;p&gt;Қызығушылық тудыратын ақ зат шоғырлары mrtrix_multishell_msmt_pyafq_tractometry жұмыс процесін орындай отырып, QSIRecon ішіндегі pyAFQ (Kruper et al., 2021) көмегімен анықталды. pyAFQ құрамына кіретін стандартты ірі талшық шоғырларынан басқа, өткен зерттеулердегі қызығушылық аймақтары (ROI) анықтамалары негізінде гипотезаға бағытталған талдаулар үшін бірнеше арнайы тракттар анықталды. Бұған жоғарғы бойлық шоғыр бөлімшелері (Thiebaut de Schotten et al., 2011) (SLF I, II, III) және артқы белдік пен медиальды самай проекцияларын қамтитын вентральды цинкулюм жолдары кірді. Барлық ROI әр қатысушының жеке AC-PC кеңістігіне түрлендірілді. Ассоциациялық талшықтар жартышар шегінде қалумен шектелді және шоғырды нақтылау итеративті шығарындыларды жою және ағын сызықтарын кластерлеу арқылы орындалды.&lt;/p&gt;\n&lt;h4 id=\"traktometriya\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#traktometriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Трактометрия&lt;/span&gt;&lt;/a&gt;Трактометрия&lt;/h4&gt;\n&lt;p&gt;Әрбір сегменттелген шоғыр үшін тракт профильдері pyAFQ жұмыс процесі арқылы ағын сызықтарын (streamlines) 100 тең қашықтықтағы түйінге қайта дискреттеу арқылы алынды. Диффузия және микроқұрылым метрикалары (FA, MD, RD, AD және NODDI параметрлері) ағын сызықтары бойынша өлшенген орташа мәндер ретінде есептелді. FA талшықтар ұйымдастырылуын көрсететінімен, микроқұрылымдық айырмашылықтар мен геометриялық әсерлерді (талшықтардың қиылысуы немесе иілуі) ажырата алмайды, сондықтан нейриттер тығыздығы индексі (NDI) мен бағдар дисперсиясы индексі (ODI) қосымша есептелді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;NODDI — бұл диффузия сигналындағы нейриттер тығыздығы мен олардың бағдарлану тәртібін бөліп көрсететін модель, ол тіндердің микроқұрылымын стандартты көрсеткіштерге қарағанда дәлірек бағалауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;NODDI моделі QSIRecon-дағы AMICO іске асырылуымен, параллель диффузия 1.7 × 10⁻³ мм²/с және изотропты диффузия 3.0 × 10⁻³ мм²/с деп белгіленіп бапталды. Топтық статистикалық талдау алдында тракт профильдері 3 түйіндік FWHM ядросымен тегістелді.&lt;/p&gt;\n&lt;p&gt;fROI талшықтарын қадағалау&lt;/p&gt;\n&lt;p&gt;Афантазия бойынша 7 Тесла fMRI зерттеуінен алынған төрт ROI (FIN, aPFC, OFC және aIPS) қолданылды. Бұл ROI-лар FreeSurfer (RRID:SCR_001847) арқылы қыртыс бетіне проекцияланып, сұр және ақ зат шекарасына сәйкестендірілді. Ағын сызықтарын іздеу MRtrix3 көмегімен 2 мм радиуста жүзеге асырылды. Әрбір ROI үшін ағын сызықтары жергілікті кеңістікте сандық бағаланды: анатомиялық белгіленген шоғырларға жататын сызықтар үлесі және ROI көлемі бойынша нормаланған сызықтар саны есепке алынды. FIN үшін AF, pAF, IFOF, ILF және VOF шоғырлары; aPFC және OFC үшін IFOF және UF; aIPS үшін pAF және SLF I, II, III шоғырлары талданды.&lt;/p&gt;\n&lt;h4 id=\"graf-teoriyalykh-zhelilik-taldau\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#graf-teoriyalykh-zhelilik-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Граф-теориялық желілік талдау&lt;/span&gt;&lt;/a&gt;Граф-теориялық желілік талдау&lt;/h4&gt;\n&lt;p&gt;Қыртыстық парцелляция Schaefer (400 учаске, 17 желі) атласы арқылы орындалды. Құрылымдық байланыстылық SIFT2-салмақты ағын сызықтарының ұштары мен парцелляция ROI-ларының қиылысуы арқылы бағаланды. Байланыс күші SIFT2 салмақтарының қосындысы ретінде, парцелляция көлемі бойынша нормаланып есептелді. Симметриялық матрицалар 50% қатысушыда жоқ байланыстарды нөлге теңестіру арқылы шектелді. Метрикалар (түйін күші, кластерлеу коэффициенті, жаһандық тиімділік және т.б.) MATLAB R2024b-дегі Brain Connectivity Toolbox көмегімен есептелді. Тұрақтылықты тексеру үшін талдау Schaefer (100) және Gordon (333) атластарымен қайталанды.&lt;/p&gt;\n&lt;h4 id=\"betti-boelip-alu-zhaene-betke-negizdelgen-morfometriya\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#betti-boelip-alu-zhaene-betke-negizdelgen-morfometriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бетті бөліп алу және бетке негізделген морфометрия&lt;/span&gt;&lt;/a&gt;Бетті бөліп алу және бетке негізделген морфометрия&lt;/h4&gt;\n&lt;p&gt;Морфометрия SPM12-дегі CAT12 көмегімен жүргізілді. Қыртыс қалыңдығы ішкі (сұр-ақ зат шекарасы) және сыртқы (сұр зат-жұлын сұйықтығы шекарасы) беттер арасындағы қашықтық ретінде бағаланды. Қалыңдық карталары 12 мм FWHM Гаусс ядросымен тегістеліп, 32k бетке қайта дискреттелді. T-карталар Neurosynth (BrainStat) көмегімен мета-аналитикалық белсендіру карталарымен корреляцияны есептеу үшін қолданылды. Көру қыртысы үшін сұр зат көлемі Neuromorphometrics атласы, ал қалыңдығы HCP-MMP Glasser атласы арқылы бөлініп алынып, жалпы интракраниалды көлемге қатысты нормаланды.&lt;/p&gt;\n&lt;h4 id=\"sur-zat-pen-akh-zat-zholdaryndaghy-noddi-koersetkishterin-sandykh-baghalau\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#sur-zat-pen-akh-zat-zholdaryndaghy-noddi-koersetkishterin-sandykh-baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сұр зат пен ақ зат жолдарындағы NODDI көрсеткіштерін сандық бағалау&lt;/span&gt;&lt;/a&gt;Сұр зат пен ақ зат жолдарындағы NODDI көрсеткіштерін сандық бағалау&lt;/h4&gt;\n&lt;p&gt;Қыр қалыңдығының талдауын микрометрық тұрғыдан түсінікті көрсеткіштермен толықтыру үшін NODDI метрикалары ми қыртысының сұр затында да өлшенді. NODDI моделі жоғарыда сипатталған AMICO көмегімен есептеліп, NDI және ODI көлемдік карталары пиальді қабат пен ақ зат шекаралары арасында Nilearn кітапханасының vol_to_surf функциясы арқылы бірқалыпты түрде қыртыс бетіне көшіріліп, fsLR-32k бетіне қайта үлгіленді. Бұл әдіс гистологиялық өлшеулер арқылы расталған, ал ODI индексі демиелинизация сияқты микрометрық өзгерістерді сезетіні көрсетілген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;NODDI және оның NDI мен ODI индекстері — бұл диффузиялық МРТ көмегімен нейриттер тығыздығы мен өсінділердің бағытталу дәрежесін бағалауға мүмкіндік беретін нейробейнелеу әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"logistikalykh-regressiya\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#logistikalykh-regressiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Логистикалық регрессия&lt;/span&gt;&lt;/a&gt;Логистикалық регрессия&lt;/h4&gt;\n&lt;p&gt;Топтық тиесілілікпен байланысты және өлшемдердің ортақ дисперсиясын ескеретін құрылымдық белгілеулердің ықшам жиынтықтарын анықтау үшін екі сатылы әдіс қолданылды. Бірінші кезеңде R тіліндегі glmnet пакеті көмегімен LASSO айыбы бар логистикалық регрессия әрбір метрика домені үшін бөлек қолданылды: трактометрия FA, қыр қалыңдығы және графтық көрсеткіштер. Болжам жасаушылар ретінде маңызды тракт түйіндеріндегі орташа FA, қыр қалыңдығы және граф метрикалары алынды. Үлгі көлемінің шағындығын ескере отырып (N = 36), айнымалылардың қатынасын шектеу үшін домендік модельдер бөлек қолданылды. Модельді таңдау кластардың теңгерілген таралуы бар 5 реттік кросс-валлидация арқылы орындалды және регляризация параметрі 1 стандартты қателік ережесі (λ₁se) бойынша таңдалды. Екінші кезеңде LASSO сақтап қалған айнымалылар шағын үлгі қателерін азайту үшін Фриттің айыппұлды логистикалық регрессиясына енгізілді. Конвергенцияға әкелмеген айнымалылар p-мәніне негізделген сатылы процедура арқылы алынып тасталды. Үлгіден тыс болжамды бағалау үшін әрбір домендік модель 1000 қайталанатын стратификацияланған 5 реттік кросс-валлидациямен тексерілді.&lt;/p&gt;\n&lt;h4 id=\"statistikalykh-taldau-bajes-faktorlary\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#statistikalykh-taldau-bajes-faktorlary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистикалық талдау: Байес факторлары&lt;/span&gt;&lt;/a&gt;Статистикалық талдау: Байес факторлары&lt;/h4&gt;\n&lt;p&gt;Топтар арасындағы айырмашылықтардың дәлелдерін бағалау үшін JASP бағдарламасында Байес t-тесттері мен Манн-Уитни тесттері арқылы Байес факторлары (BF) есептелді. BF₁₀ &amp;gt; 3 топтар арасындағы айырмашылықтың орташа дәлелі ретінде, ал BF₀₁ &amp;gt; 3 (яғни BF₁₀ &amp;lt; 1/3) айырмашылықтың жоқтығының орташа дәлелі ретінде қабылданды.&lt;/p&gt;\n&lt;h4 id=\"aeser-koelemi\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#aeser-koelemi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әсер көлемі&lt;/span&gt;&lt;/a&gt;Әсер көлемі&lt;/h4&gt;\n&lt;p&gt;Маңызды нәтижелер үшін әсер көлемдері әрбір маңызды аймақтағы орташа мәндер негізінде есептелді. Хеджес g көрсеткіші шағын үлгі қатесін азайту үшін FA, қыр қалыңдығы және NODDI метрикалары үшін стандартталған өлшем ретінде қолданылды. Клифф дельтасы графтық метрикалар үшін параметрлік емес өлшем ретінде пайдаланылды. Барлық әсер көлемдері үшін 95% сенімділік интервалдары 10 000 бутстрэп қайта үлгілеуі көмегімен бағаланды.&lt;/p&gt;\n&lt;h4 id=\"traktometriya1\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#traktometriya1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Трактометрия&lt;/span&gt;&lt;/a&gt;Трактометрия&lt;/h4&gt;\n&lt;p&gt;Тракт профильдеріндегі топтық айырмашылықтар PALM бағдарламасында 10 000 пермутациямен жүзеге асырылған, тракт түйіндері бойымен бір өлшемді шектік кластерді күшейту (TFCE; E = 0.5, H = 2) арқылы бағаланды. TFCE еркін шекті талап етпейтін кеңістіктік ұзартылған әсерлерді анықтайды. Жалған нәтижелерді азайту үшін кем дегенде 3 тізбекті маңызды түйінді қамтитын кластерлер ғана есепке алынды. Статистикалық маңыздылық p &amp;lt; 0.05 (FWE түзетілген) деп белгіленді.&lt;/p&gt;\n&lt;h4 id=\"graftykh-zhelini-taldau\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#graftykh-zhelini-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Графтық желіні талдау&lt;/span&gt;&lt;/a&gt;Графтық желіні талдау&lt;/h4&gt;\n&lt;p&gt;Түйін деңгейіндегі графтық метрикалардағы топтық айырмашылықтар Бруннер-Мунцель параметрлік емес тесті арқылы бағаланып, барлық түйіндер бойынша жалған жаңалықтар деңгейіне (FDR) түзету жасалды. Сонымен қатар, топологиялық ерекшеліктерді анықтау үшін Brain Connectivity Toolbox көмегімен нөлдік желінің сезімталдық талдауы жүргізілді. Талдау салмақталған кластерлеу коэффициентіне бағытталды. Әрбір қатысушы үшін бастапқы матрицаның дәреже мен салмақ таралуын сақтай отырып, 100 нөлдік желі жасалды. Нөлдік-нормаланған кластерлеу коэффициентінің мәндері топтар арасында салыстырылды.&lt;/p&gt;\n&lt;p&gt;fROI талшықтарын қадағалау&lt;/p&gt;\n&lt;p&gt;Әрбір fROI ішіндегі сүзілген тракттардағы топтық айырмашылықтар Манн-Уитни тесті арқылы бағаланды, өйткені деректер нөлдік мәндерді көп қамтыды.&lt;/p&gt;\n&lt;h4 id=\"betkejge-negizdelgen-morfometriya\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#betkejge-negizdelgen-morfometriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Беткейге негізделген морфометрия&lt;/span&gt;&lt;/a&gt;Беткейге негізделген морфометрия&lt;/h4&gt;\n&lt;p&gt;Ми қыртысының қалыңдығын статистикалық тұрғыдан талдау BrainStat бағдарламалық құралы көмегімен сызықтық модельді, бір жақты тестті және жалған жаفырлану деңгейіне (FDR) түзетуді қолдану арқылы орындалды. Маңызды төбешіктердің кеңістіктік байланысқан кластерлерін анықтау мақсатында шуды ескеретін иерархиялық тығыздық кластерлеу әдісі (HDBSCAN) қолданылды. Бұл алгоритм маңызды төбешіктердің x, y және z координаттары негізінде кеңістікте өзара жақын орналасқандарын топтастырды. Талдау үшін кемінде 30 төбешігі бар кластерлер ғана қалдырылды, ал анықталған аймақтардың анатомиялық орнын табу үшін Десикан — Киллиани атласы пайдаланылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HDBSCAN әдісі кездейсоқ шуларды сүзе отырып, ми бетіндегі өзара тығыз орналасқан нүктелерді топтарға бөлуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sur-zat-noddi\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#sur-zat-noddi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сұр зат NODDI&lt;/span&gt;&lt;/a&gt;Сұр зат NODDI&lt;/h4&gt;\n&lt;p&gt;Ми қыртысының сұр зат көрсеткіштері BrainStat ортасында іске асырылған кездейсоқ өрістер теориясы арқылы топтар арасында салыстырылды. Кластер деңгейіндегі талдауда p &amp;lt; 0.05 кластер түзу шегі және FWE түзетуімен p &amp;lt; 0.05 кластер маңыздылығы шегі қолданылды.&lt;/p&gt;\n&lt;h4 id=\"dispersiyalardyng-tengdigin-baghalaugha-arnalghan-leven-testi\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#dispersiyalardyng-tengdigin-baghalaugha-arnalghan-leven-testi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дисперсиялардың теңдігін бағалауға арналған Левен тесті&lt;/span&gt;&lt;/a&gt;Дисперсиялардың теңдігін бағалауға арналған Левен тесті&lt;/h4&gt;\n&lt;p&gt;Зерттелетін таңдамалардағы афантазия профилінің гетерогенділігін бағалау үшін Левен тестінің Браун — Форсайт балама әдісі әрбір метрика үшін жеке-жеке қолданылды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-f1.jpg\" alt=\"1-сурет. Трактометрия афантазия кезінде ақ заттың микроқұрылымдық таңдамалы айырмашылықтарын көрсетеді. (A) Визуализатор\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Трактометрия афантазия кезінде ақ заттың микроқұрылымдық таңдамалы айырмашылықтарын көрсетеді. (A) Визуализаторлармен салыстырғанда афантазиясы бар тұлғаларда фракциялық анизотропиясы (FA) төмендеген трактілер (Vis. &amp;gt; Aph.): сол жақ ілмек тәрізді буда (UF), оң жақ UF және артқы париетаралық аралық corpus callosum. Жоғарғы панельдер тракт профильдерін (орташа ± SEM) көрсетеді; төменгі панельдер сегмент орналасуы бойынша түспен кодталған (1-100 түйіндер) үлгілі қатысушының тракт реконструкцияларын көрсетеді. Қызыл сызықтар афантазиясы бар тұлғаларды, көк сызықтар визуализаторларды білдіреді. Көлеңкеленген сұр аймақтар топтар арасындағы маңызды айырмашылықтары бар сегменттерді белгілейді (p &amp;lt; 0.05, FWE түзетілген). (B) Визуализаторлармен салыстырғанда афантазиясы бар тұлғаларда FA жоғарылаған трактілер (Aph. &amp;gt; Vis.): сол және оң жақ дорсальды белдеулік буда. Жоғарғы панельдер тракт профильдерін (орташа ± SEM) көрсетеді; төменгі панельдер сегмент орналасуы бойынша түспен кодталған үлгілі тракт реконструкцияларын көрсетеді. Қызыл сызықтар афантазиясы бар тұлғаларды, көк сызықтар визуализаторларды білдіреді. Көлеңкеленген сұр аймақтар мен x осіндегі қара сызықтар маңызды сегменттерді белгілейді (p &amp;lt; 0.05, FWE түзетілген). Жіңішке сызықтар жеке қатысушылардың профильдерін, қалың сызықтар топтық орташа мәндерді көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-f2.jpg\" alt=\"2-сурет. Құрылымдық желілік анализ туылған афантазия кезінде жергілікті сегрегацияның төмендегенін және желіаралық торап\" /&gt;&lt;/p&gt;\n&lt;p&gt;*2-сурет. Құрылымдық желілік анализ туылған афантазия кезінде жергілікті сегрегацияның төмендегенін және желіаралық тораптылықтың жоғарылағанын көрсетеді. (A) Анализ құбыры. Мидың барлық ақмиының трактография ағындары сфералық деконволюция негізінде сүзілген трактограммалар (SIFT2) арқылы салмақталды және Schaefer 17-желілік парцелляциясына негізделген 400 × 400 құрылымдық байланыстылық матрицасын жасау үшін ROI көлемі бойынша нормаланды. Түйін деңгейіндегі граф теориясының метрикалары содан кейін салмақталған бағдарланбаған графтан есептелді. (B) Түйін күші сол жақ маңдайлық көз өрісінде (FEF; дорсальды назар аудару желісі B, DAN B) визуализаторлармен салыстырғанда афантазиясы бар тұлғаларда төмендеді, бұл осы түйінде жалпы құрылымдық байланыстылықтың әлсіз екенін көрсетеді. (C) Кластерлену коэффициенті сол жақ алдыңғы инсулада (сальнгентті/вентральды назар аудару желісі A, Sal/VAN A) және сол жақ дорсолатеральды префронтальды қыртыста (dlPFC; Default B) төмендеді, бұл сальнгенттік және ассоциациялық желі аймақтарында жергілікті желі сегрегациясының төмендегенін білдіреді. (D) Қатысу коэффициенті афантазияда оң жақ дорсомедиальды префронтальды қыртыста (dmPFC; Default A) жоғарылады, бұл осы түйіндегі үлкенірек желіаралық тораптылықты көрсетеді. Көк түс Vis. &amp;gt; Aph. көрсетеді; қою қызыл түс Aph. &amp;gt; Vis. көрсетеді. Қорапты диаграммалар медиана мен интерквартильдік ауқымды көрсетеді; *p &amp;lt; 0.05, **p &amp;lt; 0.01, **&lt;em&gt;p &amp;lt; 0.001, FWE түзетілген.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-f3.jpg\" alt=\"3-сурет. Афантазиясы бар тұлғалар мен визуализаторлар арасындағы қыртыс қалыңдығының аймақтық айырмашылықтары. (A) Топты\" /&gt;&lt;/p&gt;\n&lt;p&gt;*3-сурет. Афантазиясы бар тұлғалар мен визуализаторлар арасындағы қыртыс қалыңдығының аймақтық айырмашылықтары. (A) Топтық салыстырудың миды толық қамтитын картасы. Көк түс афантазияда қыртыс қалыңдығы азайған аймақтарды, ал қызыл түс қалыңдығы артқан аймақтарды көрсетеді (бүкіл қыртыс үшін FDR түзетуімен). Қорапты диаграммалар жеке қатысушылардың мәндерін (нүктелер), медиананы және интерквартильдік ауқымды көрсетеді. *p &amp;lt; 0.05, **p &amp;lt; 0.01, **&lt;em&gt;p &amp;lt; 0.001. Vis., визуализаторлар; Aph., афантазия. aPFC: алдыңғы префронтальды қыртыс; PoCG: орталықтан кейінгі жүлге; PHG: гиппокамп маңындағы жүлге; EC: энториналды қыртыс; ITG: төменгі самайлық жүлге; RSC: ретроспленальды қыртыс; PCC: артқы белдеулік қыртыс. (B) Neurosynth көмегімен t-картаны метааналитикалық дешифрлаудан алынған функционалдық термин ассоциациялары. Көк терминдер афантазияда қыртыс қалыңдығы азайған аймақтармен, ал қызыл терминдер қалыңдығы артқан аймақтармен байланысты. Терминнің өлшемі сәйкес метааналитикалық белсендіру картасымен Пирсон корреляциясының күшін көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-fS1.jpg\" alt=\"Қосымша сурет S1. Анализ құбырының шолуы. Үш деректер ағыны параллель түрде өңделді. Диффузиялық МРТ деректері мидың бар\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қосымша сурет S1. Анализ құбырының шолуы. Үш деректер ағыны параллель түрде өңделді. Диффузиялық МРТ деректері мидың барлық трактографиясын жасау үшін алдын ала өңдеуден және талшықты реконструкциялаудан өтті. Анатомиялық T1-өлшенген кескіндер сұр/ақ затты (GM/WM) сегментациялау және қыртыс бетін шығарып алу үшін өңделді. Психикалық бейнелеудің алдыңғы 7T фМРТ зерттеуінен алынған функционалдық ROI (Liu, Zhan, et al., 2025) әрбір қатысушының туған кеңістігіне тіркелді. Бұл кіріс деректері содан кейін төрт өзара толықтыратын анализ үшін пайдаланылды: (1) трактометрия, мұнда ақ зат будалары сегменттерге бөлінді және микромөлшерлік қасиеттері, соның ішінде фракциялық анизотропия (FA), тракт профильдері бойымен сандық бағаланды; (2) fROI негізіндегі трактография, мұнда функционалдық ROI ядролық бейнелеу желісінің аймақтарын біріктіретін ағын сызықтарын анықтау үшін GM/WM интерфейсіне жобаланды; (3) граф теориясына негізделген желілік анализ, мұнда қыртыс парцелляциясы және SIFT2 арқылы салмақталған ағын сызықтарының саны құрылымдық байланыстылық матрицаларын құру және түйін деңгейіндегі желілік метрикаларды шығару үшін пайдаланылды; және (4) беттік морфометрия, мұнда қыртыс қалыңдығы шығарып алынған қыртыс беттерінен бағаланды және ми бойынша топтар арасында салыстырылды.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-fS2.jpg\" alt=\"Қосымша сурет S2. Айтарлықтай FA айырмашылықтарын көрсететін ақ зат трактілеріндегі NODDI микроқұрылымдық профильдері. (\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қосымша сурет S2. Айтарлықтай FA айырмашылықтарын көрсететін ақ зат трактілеріндегі NODDI микроқұрылымдық профильдері. (A) Неврит тығыздығы индексінің (NDI) тракт профильдері. (B) Бағдардың дисперсия индексінің (ODI) тракт профильдері. Профильдер негізгі трактометрия анализінде анықталған трактілер — екі жақты ілмек тәрізді буда, артқы париетаралық аралық corpus callosum және екі жақты дорсальды белдеулік буда үшін көрсетілген. Қызыл сызықтар афантазиясы бар тұлғаларды, көк сызықтар визуализаторларды білдіреді. Жіңішке сызықтар жеке қатысушылардың профильдерін, қалың сызықтар топтық орташа мәндерді ± SEM көрсетеді. Көлеңкеленген сұр аймақтар мен қара сызықтар топтар арасындағы маңызды айырмашылықтарды көрсетеді (p &amp;lt; 0.05, FWE түзетілген).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-fS3.jpg\" alt=\"Қосымша сурет S3. Оң жақ SLF-II және оң жақ вентральды цингулумдағы FA-ның маргиналды төмендеуі бағдардың дисперсиясының\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қосымша сурет S3. Оң жақ SLF-II және оң жақ вентральды цингулумдағы FA-ның маргиналды төмендеуі бағдардың дисперсиясының артуымен бірге жүреді. (A) Төменде көрсетілген репрезентативті тракт реконструкцияларымен бірге, оң жақ SLF-II (p = 0.082, FWE түзетуімен) және оң жақ вентральды цингулум (p = 0.079, FWE түзетуімен) үшін фракциялық анизотропия (FA) тракт профильдері. Сұр түспен боялған аймақтар мен қара жолақтар топтар арасындағы маргиналды айырмашылықтарды көрсететін сегменттерді білдіреді. Қызыл сызықтар афантазиялық индивидтерді, ал көк сызықтар визуализаторларды көрсетеді; жіңішке сызықтар жеке қатысушылардың профильдерін, ал қалың сызықтар топтық орташа мәндерді ± SEM көрсетеді. (B) Сол тракттар үшін бағдар дисперсиясы индексінің (ODI) профильдері. Екі трактіде де FA маргиналды төмендеуі афантазиялық индивидтердегі артық ODI-мен қабаттасты, бұл бұл әсерлерге сенімді микроқұрылымдық айырмашылықтардан гөрі жергілікті талшық геометриясы әсер етуі мүмкін екенін көрсетеді. Сондықтан бұл нәтижелер әрі қарай түсіндірілмеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-fS4.jpg\" alt=\"Қосымша сурет S4. Негізгі бейнелеу желісінің ақ зат байланыстары. (A) Сагитальды МРТ кесінділерінде көрсетілген негізгі \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қосымша сурет S4. Негізгі бейнелеу желісінің ақ зат байланыстары. (A) Сагитальды МРТ кесінділерінде көрсетілген негізгі бейнелеу желісінің әрбір функционалдық ROI-імен байланысқан ақ зат ағым сызықтары (стримлайн): сол жақ фузиформды бейнелеу түйіні (FIN), сол жақ орбитофронтальды қыртыс (OFC), сол жақ алдыңғы префронтальды қыртыс (aPFC) және оң жақ алдыңғы интрапариетальды жүлге (aIPS). (B) Әрбір функционалдық ROI үшін ROI көлемімен нормаланған стримлайн саны. FIN негізінен доға тәрізді буданың ұзын сегментімен (AF), артқы доға тәрізді будамен (pAF) және тік шүйде будасымен (VOF) байланысқан. Сол жақ OFC төменгі маңдай-шүйде будасымен (IFOF) де, ілмекті будамен (UF) де байланысқан, ал сол жақ aPFC негізінен IFOF арқылы байланысқан. Бұл талдауда FIN мен сол жақ aPFC арасында тікелей құрылымдық байланыс анықтал жоқ. Оң жақ aIPS басым түрде жоғарғы бойлық буданың үшінші тармағымен (SLF-III) байланысқан. FIN-мен байланысқан сол жақ AF үшін афантазиялық индивидтерде нормаланған стримлайн санының номиналды өсуі байқалды (түзетілмеген p = 0.039, U = 229, Клифф d = -0.41), бірақ бұл әсер бірнеше салыстырулар үшін түзетуден өтпеді. Байес факторының талдауы FIN-мен байланысқан VOF стримлайн санында топтық айырмашылықтың жоқтығына орташа дәлел берді (BF = 0.32). (C) Әрбір ROI үшін әрбір қызығушылық трактісіне тағайындалған стримлайндардың үлесі. Ашық жолақтар визуализаторларды, ал қара жолақтар афантазиялық индивидтерді білдіреді. Қате жолақтары SEM көрсетеді, ал нүктелер жеке қатысушыларды көрсетеді. IFOF — төменгі маңдай-шүйде будасы; ILF — төменгі бойлық буда; AF — доға тәрізді буданың ұзын сегменті; pAF — артқы доға тәрізді буда; VOF — тік шүйде будасы; UF — ілмекті буда;
