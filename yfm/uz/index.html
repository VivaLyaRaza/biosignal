apiyasi kam uchraydigan sindromning oldini oldi","text":"&lt;p&gt;Hayotning ilk kunlarida virusli vektorning kiritilishi og'ir kasallikda harakat va neyronlar yemirilishining oldini oldi.&lt;/p&gt;\n","links":[{"url":"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-f1.jpg"},"content":{"title":"Alzgeymer kasalligida miya hujayralari nima uchun charchaydi","text":"&lt;p&gt;Miyaning himoya hujayralari oqsil yig'indilari bilan kurashda ichki zaxiralarini yo'qotadi.&lt;/p&gt;\n","links":[{"url":"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur-f1.jpg"},"content":{"title":"Miya kasalliklarida oqsil yetishmovchiligi noodatiy halqasimon RNKlarni hosil qiladi","text":"&lt;p&gt;TDP-43 oqsili yo'qolganda neyronlarda qanday qilib barqaror va yashirin halqasimon RNKlar paydo bo'lishi aniqlandi.&lt;/p&gt;\n","links":[{"url":"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s-fS1.jpg"},"content":{"title":"Infarktdan keyin yurak jigar yordamida qonni qanday boshqaradi","text":"&lt;p&gt;Olimlar yurak va jigar o'rtasida infarktdan keyin trombotsitlar miqdorini tiklovchi to'g'ridan-to'g'ri aloqani aniqladilar.&lt;/p&gt;\n","links":[{"url":"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons-f1.jpg"},"content":{"title":"Rak terapiyasida immun tizimini qanday tiklash mumkin","text":"&lt;p&gt;Yangi yondashuv onkologiyada t-hujayralarning charchab qolishining oldini oladi.&lt;/p&gt;\n","links":[{"url":"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f1.jpg"},"content":{"title":"Altsgeymer kasalligida hujayralararo zanjirli shikastlanish mexanizmi","text":"&lt;p&gt;Toksik oqsillar hujayralar orasida pufakchalar orqali uzrilib, qo'shni neyronlarni nobud qiladi.&lt;/p&gt;\n","links":[{"url":"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-f1.jpg"},"content":{"title":"Afaziya va&amp;nbsp;ong: nima uchun ba&amp;rsquo;zilar tasavvur qila olmaydi?","text":"&lt;p&gt;Olimlar tug'ma afantaziyaga ega odamlarning miyasida nima o'zgarganini aniqlashdi.&lt;/p&gt;\n","links":[{"url":"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi-f1.jpg"},"content":{"title":"Miyamiz voqelikni orqadan turib birlamchi koʻrish qobigʻida qayta tiklaydi","text":"&lt;p&gt;Hozir koʻrayotgan narsamiz kelajakdagi voqealarga bogʻliq. 7T MRT yordamida oʻtkazilgan tajriba miya idrakni qanday tuzatishini koʻrsatdi.&lt;/p&gt;\n","links":[{"url":"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/how-occam-s-razor-guides-human-decision-making-f1.jpg"},"content":{"title":"Miya nima uchun sodda tushuntirishlarni tanlaydi","text":"&lt;p&gt;Insonlar noaniq ma'lum natures.jpg"},"content":{"title":"Miya san&amp;rsquo;at asarini tushunishdan qanday zavq oladi","text":"&lt;p&gt;Olimlar oddiy qiziquvchanlikdan to to'satdan anglash va zavqlanishgacha bo'lgan yo'lni kuzatishdi.&lt;/p&gt;\n","links":[{"url":"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-f1.jpg"},"content":{"title":"Gormonlar autizm va&amp;nbsp;miya rivojlanishi genlariga qanday ta&amp;rsquo;sir qiladi","text":"&lt;p&gt;Olimlar estradiolning autizm va miya rivojlanishi buzilishlari bilan bog'liq 36 ta gengae ta'sirini o'rganib chiqdi.&lt;/p&gt;\n","links":[{"url":"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio-f1.jpg"},"content":{"title":"Balamuthia mandrillaris xavfli amebasi uchun yangi tezkor test","text":"&lt;p&gt;Kam uchraydigan va o'limga olib keluvchi ameba uchun ilk ekspress-test yaratildi, u oddiy klinikalarda ham tezkor tashxis qo'yish imkonini beradi.&lt;/p&gt;\n","links":[{"url":"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-f1.jpg"},"content":{"title":"Olimlar kodlovchi halqasimon RNK larning mavjudligini birinchi marta isbotladilar","text":"&lt;p&gt;Olimlar laboratoriyada DNK siz yashovchi va oqsil kodlaydigan sirli halqasimon RNK larning mavjudligini isbotladilar.&lt;/p&gt;\n","links":[{"url":"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/sleep-fragmentatio
