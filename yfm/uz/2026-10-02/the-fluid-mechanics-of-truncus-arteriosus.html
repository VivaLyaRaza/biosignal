        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"148\" cy=\"126\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"572\" cy=\"284\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · PHYSIOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Yurakdagi umumiy arterial&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;o‘zak: qon oqimi qanday&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;kechadi?&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Umumiy arterial o‘zak — bu tug‘ma yurak nuqsoni bo‘lib, unda asosiy qon tomirlari ajralmay qoladi. Natijada kislorodga boy va kambag‘al qon aralashib ketadi va klapanlarga yuklama ortadi. Stenford universiteti tadqiqotchilari bemorning individual qon oqimi modelini yaratib, jarrohlikdan oldin va keyin qon qanday harakatlanishini kuzatishdi. Bu ish murakkab anatomik nuqsonlarda yurak faoliyatini tiklash mexanizmlarini tushunishga yordam beradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Umumiy arterial o‘zak gidrodinamikasini o‘rganuvchi ilk tadqiqot.&lt;/li&gt;\n&lt;li&gt;Klapan yopilishidagi nuqsonlar o‘&lt;a href=\"concepts/protein-kinase-a.html\"&gt;pka&lt;/a&gt; arteriyalaridagi uyurmalar bilan bog‘liq.&lt;/li&gt;\n&lt;li&gt;Nuqsonli yurakda ham qon oqimining qulay taqsimlanishi tasdiqlandi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqotchilar qon va to‘rt tabaqali klapan o‘zaro ta’sirini modellashtirish uchun «&lt;a href=\"concepts/immersed-boundary-method.html\"&gt;Immersed Boundary Method&lt;/a&gt;» usulidan foydalanishdi. Tomirlar va klapan geometriyasi bemorning kompyuter tomografiyasi va exokardiyografiya ma’lumotlari asosida qurildi. Klapan tabaqalarining elastiklik parametrlari bemorning real anatomik o‘lchamlariga moslashtirildi.&lt;/p&gt;\n&lt;p&gt;Oqimlar tahlili Lagranj kogerent tuzilmalari (&lt;a href=\"concepts/lagrangian-coherent-structures.html\"&gt;LCS&lt;/a&gt;) va zarralarni kuzatish (LPT) yordamida amalga oshirildi. Aniqlanishicha, operatsiyadan oldin klapan tabaqalarining assimetrik harakati va qonning orqaga qaytishi (&lt;a href=\"concepts/regurgitatsiya.html\"&gt;regurgitatsiya&lt;/a&gt;) o‘pka arteriyalaridagi past bosim va uyurmalar tufayli yuzaga kelgan. Model qon aralashishiga qaramay, «qulay oqim taqsimoti» mavjudligini ko‘rsatdi: chap qorinchadan qon asosan aortaga, o‘ng qorinchadan esa o‘pka arteriyalariga yo‘naladi. Jarrohlikdan so‘ng yurak gidrodinamikasi me’yorga qaytdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot faqat bitta bemor ma'lumotlari asosida o'tkazilgan, bu esa natijalarni barcha holatlarga tatbiq etishni cheklaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Umumiy arterial o‘zak (UAO) — bu yurakdan chiquvchi ikkita asosiy arteriyaning embrional rivojlanish davrida ajralmasligi natijasida yuzaga keladigan kamyob va og‘ir tug‘ma yurak nuqsonidir. Natijada bitta o‘zak va bitta klapan hosil bo‘lib, ular orqali aralash qon oqadi. Bemorlarning taxminan 25 foizida to‘rt tabaqali klapan kuzatiladi, bu esa ko‘pincha yetishmovchilikka (regurgitatsiya) olib keladi va qayta jarrohlik amaliyotini talab qiladi. Klapan va qon oqimi o‘rtasidagi o‘zaro ta’sir muhimligiga qaramay, UAOda gidrodinamika yetarli darajada o‘rganilmagan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;UAO magistral qon tomirlarning ajralmasligi bilan tavsiflanadi, bemorlarning 25 foizida esa klapan disfunksiyasiga moyil bo‘lgan to‘rt tabaqali klapan uchraydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Jarrohlik amaliyotidan oldingi va keyingi kompyuter tomografiyasi ma’lumotlari asosida suyuqlik va strukturaning o‘zaro ta’sirini modellashtirish amalga oshirildi. To‘rt tabaqali klapan elastiklik asosida loyihalashtirildi, bunda erkin qirra uzunligi va geometrik balandlik exokardiyografiya ma’lumotlaridan olindi. Qon va klapan o‘rtasidagi o‘zaro ta’sir \"Immersed Boundary Method\" (botirilgan chegaralar usuli) yordamida simulyatsiya qilindi. Chegaraviy shartlar bemorning individual ko‘rsatkichlariga moslashtirildi. Qon oqimining aralashuvi va oqim yo‘nalishlarini o‘rganish uchun Lagranj kogerent tuzilmalari (LCS) va Lagranj zarrachalarini kuzatish (LPT) usullari qo‘llanildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;\"Immersed Boundary Method\" — bu suyuqlik oqimi ichidagi egiluvchan jismlar (masalan, klapan tabaqalari) harakatini hisoblash uchun ishlatiladigan matematik usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Past bosim va o‘pka arteriyalarining (O‘A) bir tomonlama joylashuvi butun yurak sikli davomida tabaqalar harakatiga ta’sir qilib, assimetrik yopilish va regurgitatsiyaga olib kelishi aniqlandi. Aortadagi holodiastolik teskari oqim O‘A ga qon yetkazib berishni va regurgitatsiya oqimini ta’minlaydi. LCS va LPT tahlillari shuni ko‘rsatdiki, oksihenlangan qon chap qorinchadan aortaga, deoksihenlangan qon esa o‘ng qorinchadan O‘A ga yo‘naltirilgan. Jarrohlikdan so‘ng normal gemodinamika tiklandi.&lt;/p&gt;\n&lt;p&gt;Bu UAO gidrodinamikasini o‘rganish bo‘yicha ilk tadqiqotdir. Individual modellarda oqim tahlilining sifat va miqdoriy usullaridan foydalanib, O‘A ning bir tomonlama kelib chiqishi sababli buzilgan gemodinamika aniqlandi va tuzatishdan keyin normal holat qanday tiklanishi ko‘rsatildi. Tadqiqot qon oqimining qulay taqsimlanishi (streaming) aralash qon oqimi bilan bog‘liq nuqsonlarda muhim mexanizm ekanligini tasdiqladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot bemorlarga xos individual modellarga asoslangan bo‘lib, natijalar anatomik xilma-xillikni hisobga olgan holda talqin qilinishi kerak.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"truncus-arteriosus-ta-haqida-umumiy-malumot\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#truncus-arteriosus-ta-haqida-umumiy-malumot\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Truncus arteriosus (TA) haqida umumiy ma'lumot&lt;/span&gt;&lt;/a&gt;Truncus arteriosus (TA) haqida umumiy ma'lumot&lt;/h4&gt;\n&lt;p&gt;Truncus arteriosus (TA) — bu yurakning ikkita asosiy arteriyasi embrional rivojlanish davrida ajralmasdan qolishi natijasida yuzaga keladigan kamyob va og'ir tug'ma yurak nuqsonidir. Natijada yagona arterial o'zak va bitta klapan hosil bo'ladi, u orqali venoz va arterial qon aralashmasi o'tadi. Qorinchalararo to'siq nuqsoni (QATN) har ikkala qorinchadan qonning ushbu klapanga oqib kelishini ta'minlaydi, o'pka arteriyalari esa bevosita aortadan chiqadi. O'pka arteriyalaridagi qon oqimi ko'pincha aorta oqimidan uch baravar yuqori bo'lib, bu o'pka gipertsirkulyatsiyasiga olib keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TA umumiy arterial o'zak va o'pka gipertsirkulyatsiyasi bilan tavsiflanadi, bu hayotning dastlabki haftalarida jarrohlik aralashuvini talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"jarrohlik-va-klapan-morfologiyasi\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#jarrohlik-va-klapan-morfologiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Jarrohlik va klapan morfologiyasi&lt;/span&gt;&lt;/a&gt;Jarrohlik va klapan morfologiyasi&lt;/h4&gt;\n&lt;p&gt;TA ni jarrohlik yo'li bilan tuzatish QATN ni yopish, o'pka arteriyalarini aortadan ajratish va o'ng qorincha uchun klapanli konduit o'rnatishni o'z ichiga oladi. Operatsiya muvaffaqiyati trunkus klapanining funksiyasiga bog'liq. Ko'pincha klapan tabaqalari qalinlashgan va displastik bo'ladi. Aksariyat hollarda klapan uch tabaqali bo'lsa-da, 25% bemorlarda to'rt tabaqali morfologiya uchraydi (7 ta fenotipga bo'linadi). Bunday bemorlarning uchdan bir qismidan ko'prog'i klapan halqasining kengayishi tufayli yuzaga keladigan regurgitatsiya sababli qayta operatsiyaga muhtoj bo'ladi, bunda trikuspidalizatsiya eng bardoshli usul hisoblanadi.&lt;/p&gt;\n&lt;h4 id=\"mavjud-tadqiqotlar-sharhi\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#mavjud-tadqiqotlar-sharhi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavjud tadqiqotlar sharhi&lt;/span&gt;&lt;/a&gt;Mavjud tadqiqotlar sharhi&lt;/h4&gt;\n&lt;p&gt;Echokardiyografiya qo'llanilsa-da, TA dagi gemodinamikani muhandislik nuqtai nazaridan o'rganish kam rivojlangan. Ilgari cho'chqa yuragi modellarida o'tkazilgan tadqiqotlar to'rt tabaqali klapanlarning uch tabaqalilarga nisbatan asinxron yopilishini va sekinroq kinematikasini ko'rsatgan. Shu bilan birga, normal aorta klapanlarining gidrodinamikasi, jumladan, ochilishdagi vorteks hosil bo'lishi va yopilish mexanizmlari batafsil o'rganilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Regurgitatsiya — klapan to'liq yopilmaganda qonning orqaga oqib ketishi bo'lib, yurakka qo'shimcha yuklama beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tadqiqot-maqsadi-va-usullari\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#tadqiqot-maqsadi-va-usullari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot maqsadi va usullari&lt;/span&gt;&lt;/a&gt;Tadqiqot maqsadi va usullari&lt;/h4&gt;\n&lt;p&gt;TA ning murakkab anatomiyasi qon oqimini tahlil qilishni qiyinlashtiradi. Qonning «afzal oqim» (streaming) nazariyasi mavjud bo'lsa-da, TA uchun bu hali isbotlanmagan. Ushbu ish TA gidrodinamikasini o'rganish bo'yicha birinchi tadqiqotdir. Mualliflar bemorga xos modellarda sifat va miqdoriy tahlil usullaridan foydalanib, jarrohlikdan oldingi va keyingi gemodinamikani baholadilar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot bemorga xos modellarga asoslangan, shuning uchun natijalarni barcha TA bemorlariga to'liq tatbiq etishda ehtiyotkorlik talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"truncus-arteriozus-tuzatilgandan-keyin-gemodinamika-va-klapan-funksiyasi\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#truncus-arteriozus-tuzatilgandan-keyin-gemodinamika-va-klapan-funksiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Truncus arteriozus tuzatilgandan keyin gemodinamika va klapan funksiyasi&lt;/span&gt;&lt;/a&gt;Truncus arteriozus tuzatilgandan keyin gemodinamika va klapan funksiyasi&lt;/h4&gt;\n&lt;p&gt;Avvalroq biz klapan tabaqalariga bevosita aralashuvsiz umumiy arterial o‘zak (truncus arteriosus) tuzatilgunga qadar va undan keyin gemodinamikaning klapan ishlashiga ta’sirini baholagan edik. Bizning hisoblash modellarimiz operatsiya jarayonida o‘zgaradigan fenotiplarni qayta tiklashga va operatsiyadan keyingi klapan faoliyatini yaxshilash mexanizmlarini aniqlashga qodirligini ko‘rsatdik. Bu bizning yondashuvimizning klinik ahamiyatini va hayotiyligini tasdiqladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ishlab chiqilgan hisoblash modellari operatsiyadan keyingi gemodinamik o‘zgarishlarni muvaffaqiyatli aks ettiradi va jarrohlik aralashuvining samaradorligini baholash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu tadqiqotda biz truncus arteriosus (TA) holatidagi gidrodinamikani va uning kislorodga boy hamda kislorod bilan to‘yinmagan qonning aralashish jarayonlari bilan bog‘liqligini tushunish uchun klassik oqim tahlili vositalaridan foydalandik (1-rasm). Qon oqimi, klapan anatomiyasi va qon tomirlari o‘rtasidagi individual suyuqlik-tuzilma o‘zaro ta’sirini (fluid-structure interaction) modellashtirish orqali biz operatsiyadan oldingi holatda g‘ayritabiiy gidrodinamikani aniqladik. Shuningdek, jarrohlik tuzatish oqim parametrlarini sog‘lom yurak ko‘rsatkichlariga yaqin darajaga qaytarishi ko‘rsatildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/fsi.html\"&gt;Suyuqlik-tuzilma o‘zaro ta’siri&lt;/a&gt; (FSI) — bu qon oqimi va qon tomirlari yoki klapanlarning deformatsiyalanuvchi devorlari o‘rtasidagi o‘zaro ta’sirni hisobga oluvchi kompyuter modellashtirish usuli bo‘lib, yurak-qon tomir kasalliklarini tahlil qilishda muhim ahamiyatga ega.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"gemodinamika,-tolqin-shakllari-va-tabaqalar-kinematikasi\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#gemodinamika,-tolqin-shakllari-va-tabaqalar-kinematikasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gemodinamika, to‘lqin shakllari va tabaqalar kinematikasi&lt;/span&gt;&lt;/a&gt;Gemodinamika, to‘lqin shakllari va tabaqalar kinematikasi&lt;/h4&gt;\n&lt;p&gt;Operatsiyadan oldingi holatda bemor anatomiyasi umumiy arterial tanadan (UAT) chap tomonda joylashgan o‘pka arteriyalari (OA) shoxlari bilan tavsiflangan. OA kelib chiqish joyidan proksimalda joylashgan klapan tabaqalari chap va oldingi tabaqalarni o‘z ichiga olgan, o‘ng va orqa tabaqalar esa qarama-qarshi tomonda bo‘lgan. OA ning asimmetrik joylashuvi va o‘pka qon aylanishidagi past bosim g‘ayritabiiy gemodinamikaga olib kelgan: OA «past bosim rezervuari» vazifasini bajargan, bu esa klapandan keyin bosimning pasayishiga sabab bo‘lgan. Klapandagi regurgitatsiya va OA dagi to‘g‘ridan-to‘g‘ri qon oqimi aorta orqali golodiastolik oqim bilan ta’minlangan. Jarrohlik tuzatish gemodinamikani normallashtirib, aorta oqimini tikladi va regurgitatsiyani sezilarli darajada kamaytirdi (3-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;UAT ni jarrohlik yo‘li bilan tuzatish klapandan keyingi g‘ayritabiiy past bosimni va golodiastolik regurgitatsiyani bartaraf etib, oqim profillarini normallashtirdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Operatsiyadan oldin tanada tashqi egrilikka yo‘naltirilgan asimmetrik oqim va sistola davomida ichki egrilik bo‘ylab retrograd oqim kuzatilgan. OA dagi oqim tezligi aortadagiga qaraganda sezilarli darajada yuqori bo‘lgan. Klapan yopilganda, tanadagi oqim sekinlashgan va yo‘nalishini o‘zgartirgan, OA da esa to‘g‘ridan-to‘g‘ri oqim saqlanib qolgan. Diastola davomida aortadan klapan orqali o‘ng qorinchaga (O‘Q) retrograd oqim kuzatilgan. Operatsiyadan keyin (4-rasm) diastoladagi oqim harakati sezilarli darajada kamaydi va golodiastolik teskari oqim bartaraf etildi.&lt;/p&gt;\n&lt;p&gt;Bosim va oqim egri chiziqlarini tahlil qilish (5A-rasm) shuni ko‘rsatdiki, operatsiyadan oldin O‘Q ning zarba hajmiga qo‘shgan hissasi chap qorinchaga (ChQ) qaraganda 25% ga yuqori bo‘lgan, sistola davomida eng yuqori tezliklar 16,25 ml/s (ChQ) va 26,67 ml/s (O‘Q) ni tashkil etgan. Regurgitatsiyani hisobga olmaganda umumiy zarba hajmi 4,87 ml, klapandan keyingi eng yuqori oqim esa 42,76 ml/s bo‘lgan. Klapan sohasidagi operatsiyadan oldingi &lt;a href=\"concepts/chislo-reynoldsa.html\"&gt;Reynolds soni&lt;/a&gt; 1721 ni tashkil etgan, operatsiyadan keyin u 618 gacha tushgan, sistola davomida eng yuqori oqim esa 31,14 ml/s ga teng bo‘lgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Reynolds soni — oqimning inertsiya va qovushqoqlik kuchlari nisbatini ifodalovchi o‘lchamsiz kattalik; yuqori qiymatlar turbulentlikni, past qiymatlar esa laminar (tartibli) oqimni bildiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Sistemali va o‘pka qon aylanishi o‘rtasidagi bosim farqi 3,2:1 nisbatdagi oqimni yaratgan. Operatsiyadan oldin tanadagi bosim g‘ayritabiiy darajada past bo‘lib, aorta va o‘pka bosimlari oralig‘ida bo‘lgan. OA ning asimmetriyasi tabaqalarning notekis yopilishiga olib kelgan (5B-rasm). Sistola davomida maksimal siljish: chap — 3,6 mm, oldingi — 3,7 mm, orqa — 3,0 mm, o‘ng — 2,7 mm. &lt;a href=\"concepts/koaptatsiya.html\"&gt;Koaptatsiya&lt;/a&gt; balandligi (tabaqalar tutashuv maydoni) geometrik balandlikning 20,0% ini tashkil etgan. Tuzatishdan keyin yopilish simmetrikroq bo‘ldi (o‘ng — 3,3 mm, orqa — 4,3 mm, chap — 4,3 mm, oldingi — 3,6 mm), koaptatsiya balandligi esa 30,8% gacha oshdi.&lt;/p&gt;\n&lt;h4 id=\"vortekslarning-rivojlanishi-va-tarqalishi\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#vortekslarning-rivojlanishi-va-tarqalishi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Vortekslarning rivojlanishi va tarqalishi&lt;/span&gt;&lt;/a&gt;Vortekslarning rivojlanishi va tarqalishi&lt;/h4&gt;\n&lt;p&gt;Sistolik tezlanish davrida klapan ochilib, boshlang‘ich vorteks hosil bo‘ladi. Uning shakli tabaqalar geometriyasi va gemodinamikaga bog‘liq. To‘rt tabaqali klapanda to‘rt bo‘lakli vorteks kuzatiladi, ammo qon tomirlar anatomiyasi unga kuchli ta’sir ko‘rsatadi. Operatsiyagacha bo‘lgan holatda o‘pka arteriyalaridagi (O‘A) bo‘ylama vortekslar butun yurak sikli davomida saqlanib qolgan va klapan ochilishi bilan qo‘shilib ketgan (6A-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Operatsiyagacha bo‘lgan holatda vortekslar kamroq barqaror va tezroq parchalanadi, diastolada esa o‘ng qorinchaga regurgitatsiya kuzatiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Operatsiyagacha vorteks kamroq kogerent bo‘lib, tezroq buzilgan. Sistolada magistralning ichki egriligi bo‘ylab mayda vortekslar, diastolada esa o‘ng qorinchaga yo‘nalgan regurgitatsiya oqimi kuzatilgan. Operatsiyadan so‘ng (O‘A olib tashlangach), vorteksning uch tomoni klapan teshigiga parallel qolgan, to‘rtinchisi esa aorta egriligi bo‘ylab cho‘zilgan «soch qadag‘ich» shaklidagi vorteksni hosil qilgan. Diastolada aortada kogerent tuzilmalar aniqlanmagan, bu turbulentlikning to‘liq so‘nganini bildiradi.&lt;/p&gt;\n&lt;h4 id=\"lagranj-kogerent-tuzilmalari\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#lagranj-kogerent-tuzilmalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Lagranj kogerent tuzilmalari&lt;/span&gt;&lt;/a&gt;Lagranj kogerent tuzilmalari&lt;/h4&gt;\n&lt;p&gt;Operatsiyagacha bo‘lgan holatdagi Lagranj kogerent tuzilmalari (LCS) qorinchaaro to‘siq nuqsoni (QATN) bo‘ylab aniq material sirtni va sistola vaqtida klapan darajasida O‘A ta’sirini ko‘rsatdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Lagranj kogerent tuzilmalari (LCS) va FTLE maydonlari — bu suyuqlik oqimining «skeletini» vizualizatsiya qiluvchi matematik usullar bo‘lib, ular turli xil oqim xulq-atvoriga ega hududlarni ajratib turuvchi chegaralarni ko‘rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;FTLE maydonining lokal maksimumlari bilan aniqlanadigan material sirt massa o‘tkazish uchun to‘siq vazifasini bajaradi. Operatsiyagacha bunday sirt QATN va magistral klapan bo‘ylab o‘tgan. FTLE vizualizatsiyasi shuni ko‘rsatdiki, bu sirt aortaga yo‘nalgan oqimni O‘Aga yo‘nalgan oqimdan ajratib turadi. O‘A ta’siri klapangacha yetib borgan. Klapan orqali o‘tadigan oqim o‘ng qorinchadan O‘Aga va magistraldan aortaga yo‘nalgan qismlarga bo‘lingan. Operatsiyadan so‘ng, O‘A yo‘qligi sababli, FTLE maydonlari aorta oqimining og‘ishini va rekonstruksiya sohasida retsirkulyatsiya zonalarini ko‘rsatadi.&lt;/p&gt;\n&lt;h4 id=\"oksigenlangan-va-deoksigenlangan-qon-oqimining-namunalari\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#oksigenlangan-va-deoksigenlangan-qon-oqimining-namunalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Oksigenlangan va deoksigenlangan qon oqimining namunalari&lt;/span&gt;&lt;/a&gt;Oksigenlangan va deoksigenlangan qon oqimining namunalari&lt;/h4&gt;\n&lt;p&gt;Zarrachalarni Lagranj usulida kuzatish shuni ko‘rsatdiki, chap va o‘ng qorinchalardan kelayotgan qon klapanga spiral shaklida harakatlanadi (6C-rasm). Oqimlar orasidagi chegara sirti aortaga kirguncha saqlanib qoladi, bu sistola vaqtida QATN darajasida qon aralashuvi minimal ekanligini tasdiqlaydi. Sistolaning katta qismida o‘ng qorinchadan kelgan deoksigenlangan qon O‘Aga, chap qorinchadan kelgan oksigenlangan qon esa aortaga yo‘naladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Qorinchalardan kelayotgan oqimlarning ajralishi bemorda yuqori saturatsiyani (21% FiO2 da 93%) tushuntiradi, bu umumiy arterial magistralda qonning samarali aralashish gipotezasini tasdiqlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Sistola oxirida oqim sekinlashganda, aortadan qaytgan qon O‘A darajasida aralashishni keltirib chiqaradi. Diastolada oqim chegaralari aniq emas. Ushbu ma’lumotlar umumiy arterial magistralga ega bemorda klinik jihatdan qayd etilgan yuqori saturatsiyani (21% FiO2 da 93%) tushuntiradi va anatomik nuqson bo‘lsa ham, qon oqimlarining samarali ajralishi mumkinligini isbotlaydi.&lt;/p&gt;\n&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;p&gt;Ushbu tadqiqot truncus arteriosus (TA) gidrodinamikasini o‘rgangan birinchi ishdir. Biz g‘ayritabiiy gidrodinamika o‘pka arteriyalarining (OA) joylashuviga bog‘liqligini aniqladik; ular bosim pastligi zonasi sifatida ishlaydi va trunkus oqimi hamda klapan o‘rtasida assimetrik ta’sirni keltirib chiqaradi. Jarrohlik amaliyoti davomida OA ning uzilishi normal gidrodinamikani tiklaydi va klapan regurgitatsiyasini sezilarli darajada kamaytiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;OA ning bir tomonlama joylashuvi bosim gradientini hosil qilib, oqim assimetriyasiga va klapan tabaqalarining noto‘g‘ri yopilishiga olib keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Oqim assimetriyasining asosiy sababi tizimli qon aylanishiga nisbatan o‘pka qon aylanishidagi bosimning pastligi va o‘pka tomirlari qarshiligining kamligidir. Trunkus klapani orqali o‘tayotgan qon oqimining vortikligi (aylanma harakati) OA bo‘ylab yo‘naltirilgan vortikslarni hosil qiladi. Bu past bosimli vortikslar klapan ostidagi bosim maydonini notekis qiladi, natijada sistola vaqtida klapan tabaqalari notekis ochiladi va diastola boshida kechikib yopiladi. Bu esa tabaqalarning to‘liq yopilmasligiga va regurgitatsiyaga olib keladi. Tomir geometriyasining qayta shakllanishi (sinuslar va sinotubulyar birikma) tabaqalarning yaxshiroq ishlashiga yordam beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Koaptatsiya — klapan tabaqalarining bir-biriga jips yopishib, qonning orqaga qaytishiga to‘sqinlik qilish jarayoni.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;TA odatda qonning to‘liq aralashuvi bilan kechadigan nuqson hisoblansa-da, biz chap qorinchadan (ChQ) aortaga va o‘ng qorinchadan (O‘Q) OA ga qonning qisman ajralib oqishini (streaming) aniqladik. FTLE maydonlari va Lagranj zarrachalarini kuzatish klapandan o‘tgunga qadar qon oqimlarining aralashuvi juda kamligini tasdiqladi. Bu bemorda kuzatilgan yuqori kislorod saturatsiyasini tushuntirib beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot raqamli oqim maydonlariga asoslangan bo‘lib, kelgusida adveksiya-diffuziya modellari orqali miqdoriy baholashni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"metodlar\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#metodlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Metodlar&lt;/span&gt;&lt;/a&gt;Metodlar&lt;/h4&gt;\n&lt;p&gt;Biz qon oqimi, klapan va tomir anatomiyasi o‘rtasidagi o‘zaro ta’sirni (FSI) modellashtirish uchun exokardiyografiya ma’lumotlaridan foydalandik. To‘rt tabaqali klapanni qurish uchun tasdiqlangan yondashuv qo‘llanildi. Qorinchalar qisqarishi natijasida yuzaga keladigan vaqtga bog‘liq oqim kamera aktivatsiyasi modeli orqali simulyatsiya qilindi. Oqimni baholash uchun ChQ va O‘Q ga mos ravishda «kislorodli» va «kislorodsiz» zarrachalar kiritildi. Kelgusida OA joylashuvini parametrlash va adveksiya-diffuziya modellashtirish orqali aniqroq natijalarga erishish rejalashtirilgan.&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"gidrodinamika-va-klapan-tuzilishini-modellashtirish\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#gidrodinamika-va-klapan-tuzilishini-modellashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gidrodinamika va klapan tuzilishini modellashtirish&lt;/span&gt;&lt;/a&gt;Gidrodinamika va klapan tuzilishini modellashtirish&lt;/h4&gt;\n&lt;p&gt;Klapan tabaqalari va qon tomir devorlarining qon oqimi bilan o‘zaro ta’siri IBAMR dasturiy kutubxonasida amalga oshirilgan Immersed Boundary Method yordamida modellashtirildi. Suyuqlik zichligi &lt;span class=\"yfm-latex\" data-content=\"%5Crho%20%3D%201.0\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; g/sm³ va dinamik qovushqoqligi µ = 0.04 Puaz bo‘lgan siqilmaydigan muhit sifatida qaraldi. Navier-Stokes tenglamalariga suyuqlikka ta’sir qiluvchi strukturaviy kuchlar kiritildi. Jami uchta yurak sikli simulyatsiya qilindi, tahlil uchun ikkinchi sikl tanlab olindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Immersed Boundary Method — bu moslashuvchan tuzilmalarning (masalan, klapan tabaqalari) qovushqoq suyuqlik bilan o‘zaro ta’sirini modellashtirishga imkon beruvchi hisoblash usuli bo‘lib, unda obyekt chegaralari oqim to‘riga «botiriladi».&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"klinik-malumotlar-va-geometriya\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#klinik-malumotlar-va-geometriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Klinik ma’lumotlar va geometriya&lt;/span&gt;&lt;/a&gt;Klinik ma’lumotlar va geometriya&lt;/h4&gt;\n&lt;p&gt;Chaqaloq bemor operatsiyadan oldingi va keyingi tasvirlarning mavjudligi hamda klapanda jarrohlik o‘zgarishlari yo‘qligi asosida tanlab olindi. Bemorga to‘rt tabaqali klapan (A turi) va arterial stvol (II turi) tashxisi qo‘yildi. KT tasvirlarini segmentatsiyalash SimVascular dasturida amalga oshirilib, qon tomirlarning 3D geometriyasi yaratildi (Rasm 2A).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus-f2.jpg\" alt=\"Rasm 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 2&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"klapanni-loyihalash-va-chegaraviy-shartlar\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#klapanni-loyihalash-va-chegaraviy-shartlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Klapanni loyihalash va chegaraviy shartlar&lt;/span&gt;&lt;/a&gt;Klapanni loyihalash va chegaraviy shartlar&lt;/h4&gt;\n&lt;p&gt;To‘rt tabaqali klapan elastiklikka asoslangan dizayn yondashuvi yordamida qurildi. Tabaqalarning geterogen tola tuzilishi va material qattiqligi muvozanat tenglamalari orqali aniqlandi (Rasm 2B). Bemorga xos bo‘lgan erkin qirra uzunligi (FEL) va geometrik balandlik (GH) exokardiyografiya orqali o‘lchandi. Operatsiyadan oldingi konfiguratsiya uchun FEL 7.56 mm va GH 6.5 mm, operatsiyadan keyingi uchun esa FEL 8.95 mm va GH 6.5 mm qilib belgilandi (Rasm 2C). Chegaraviy shartlar 3D FSI simulyatsiyalari va svZeroDSolver yordamida 0D model o‘rtasidagi iteratsiyalar orqali sozlandi (Rasm 2C).&lt;/p&gt;\n&lt;h4 id=\"oqim-va-kinematikani-tahlil-qilish\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#oqim-va-kinematikani-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Oqim va kinematikani tahlil qilish&lt;/span&gt;&lt;/a&gt;Oqim va kinematikani tahlil qilish&lt;/h4&gt;\n&lt;p&gt;Oqim maydonini baholash uchun tezlikning bo‘ylama komponenti u_s hisoblandi. Bosim va oqim to‘lqinlari kirish (LV, RV) va chiqish (aorta, LPA, RPA) qismlarida, shuningdek, klapan komissuralaridan 0.12 sm yuqorida tahlil qilindi. Tabaqalar kinematikasi markaziy uchini kuzatish va diastola davomida koaptatsiya nuqtasigacha bo‘lgan masofani hisoblash orqali baholandi. Vorteks rivojlanishi Q-kriteriy, transport to‘siqlari esa FTLE yordamida vizuallashtirildi. Qon aralashuvi massasiz Lagranj zarralari orqali kuzatildi: LV dan zarralar (qizil) va RV dan zarralar (ko‘k) klapan ochilishidan oldin chiqarilib, ikkinchi sikl davomida kuzatildi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus-f3.jpg\" alt=\"3-rasm: Operatsiyagacha bo'lgan konfiguratsiya: oqim bo'ylab tezlik komponenti u, tegishli qon tomir o'qlari bo'ylab uri\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm: Operatsiyagacha bo'lgan konfiguratsiya: oqim bo'ylab tezlik komponenti u, tegishli qon tomir o'qlari bo'ylab urinma va bir yurak sikli davomida (t = (0,55, 0,90) s) klapanning yuqoridan ko'rinishi. O'pka arteriyalaridagi to'g'ridan-to'g'ri qon oqimi ham, klapan regurgitatsiyasi ham aortadagi xolodiastolik teskari oqim bilan ta'minlangan. Truncal klapan orqali regurgitatsion oqim o'ng qorinchaga kirgan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus-f4.jpg\" alt=\"4-rasm: Operatsiyadan keyingi konfiguratsiya: oqim bo'ylab tezlik komponenti u, tegishli qon tomir o'qlari bo'ylab urinm\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm: Operatsiyadan keyingi konfiguratsiya: oqim bo'ylab tezlik komponenti u, tegishli qon tomir o'qlari bo'ylab urinma va bir yurak sikli davomida (t = (0,55, 0,90) s) klapanning yuqoridan ko'rinishi. Truncus jarrohligi to'g'ridan-to'g'ri aorta oqimi, klapan ostidagi normal bosim va sezilarli darajada kamaygan klapan regurgitatsiyasi kabi kutilgan gemodinamikani tikladi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus-f5.jpg\" alt=\"5-rasm: (A) Kirish (chap qorincha, o'ng qorincha) va chiqish (aorta, chap va o'ng o'pka arteriyasi) qismlarida fazoviy o\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm: (A) Kirish (chap qorincha, o'ng qorincha) va chiqish (aorta, chap va o'ng o'pka arteriyasi) qismlarida fazoviy o'rtacha hisoblangan operatsiyagacha va operatsiyadan keyingi bosim va oqim to'lqin shakllari.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-rasm: (A) Kirish (chap qorincha, o'ng qorincha) va chiqish (aorta, chap va o'ng o'pka arteriyasi) qismlarida fazoviy o'rtacha hisoblangan operatsiyagacha va operatsiyadan keyingi bosim va oqim to'lqin shakllari. Yashil egri chiziq ('Klapan') klapandan darhol distal joylashgan fazoviy o'rtacha oqim va bosimni tavsiflaydi, ular klapan komissurasi darajasidan 0,12 sm yuqorida (operatsiyagacha bo'lgan konfiguratsiya uchun o'pka arteriyasi boshlanishidan pastda) joylashgan kesmada hisoblanadi. O'pka arteriyalari bosim drenaji vazifasini bajargani uchun, klapandan darhol pastdagi bosim darajalari operatsiyagacha bo'lgan konfiguratsiyada operatsiyadan keyingiga qaraganda pastroq. (B) Operatsiyagacha va operatsiyadan keyingi konfiguratsiyalar uchun bir yurak sikli davomida tabaqalar kinematikasi. O'pka arteriyalarining bir tomonlama joylashuvi natijasida hosil bo'lgan quyi oqimning notekis maydoni va truncal klapan o'rtasidagi o'zaro ta'sir klapanning assimetrik yopilishiga olib keldi. Tabaqalar juft bo'lib ochildi va yopildi, bunda o'pka arteriyalaridan yuqorida joylashgan tabaqalar kengroq ochilib, kechroq yopildi. Truncus tuzatish orqali sog'lom gemodinamikani tiklash klapanning yanada simmetrik yopilishiga olib keldi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus-f6.jpg\" alt=\"6-rasm: (A) Operatsiyagacha va operatsiyadan keyingi konfiguratsiyada klapan ochilgandan keyin, sistola cho'qqisida va d\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm: (A) Operatsiyagacha va operatsiyadan keyingi konfiguratsiyada klapan ochilgandan keyin, sistola cho'qqisida va diastola o'rtasida boshlang'ich vorteks uchun klapan halqasi tekisligiga normal tezlik komponenti bo'yicha ranglangan Q-mezonining…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;6-rasm: (A) Operatsiyagacha va operatsiyadan keyingi konfiguratsiyada klapan ochilgandan keyin, sistola cho'qqisida va diastola o'rtasida boshlang'ich vorteks uchun klapan halqasi tekisligiga normal tezlik komponenti bo'yicha ranglangan Q-mezonining izo-sirtlari. To'rt tabaqali klapan morfologiyasi to'rt qanotli boshlang'ich vorteksni yaratdi. Truncus jarrohligidan oldin, o'pka arteriyalaridagi oqim bo'ylab yo'naltirilgan vortekslar butun yurak sikli davomida saqlanib qolgan holda truncusdagi oqim maydoni va vorteks dinamikasiga ta'sir qildi. (B) Lagranj kogerent tuzilmalari (LCS): operatsiyagacha va operatsiyadan keyingi konfiguratsiya uchun to'g'ridan-to'g'ri chekli vaqtli Lyapunov eksponenti (FTLE) skalyar maydonlari. Vaqt lahzalari va masshtablar tegishli oqim xususiyatlariga asoslanib tanlangan. VSD bo'ylab aralashish darajasi ahamiyatsiz bo'lgan aniq moddiy sirt aniqlandi. LCS sistola davomida klapan darajasida o'pka arteriyalarining ta'sirini aniqladi. Diastola davomida aorta tashqi egriligidan oqim o'pka arteriyalariga kirdi. Truncus jarrohligidan so'ng, to'rt tabaqali klapan tufayli kvadrat shaklidagi aorta oqimi va diastola davomida ahamiyatsiz oqim bilan sistolik gemodinamika tiklandi. (C) Lagranj zarrachalarini kuzatish: chap va o'ng qorinchalarda joylashtirilgan 'oksigenlangan' (qizil) va 'deoksigenlangan' (ko'k) zarrachalarning turli ko'rish burchaklarida va yurak siklining turli vaqt nuqtalarida taqsimlanishi. Zarrachalar klapan ochilishidan biroz oldin joylashtiriladi va bir yurak sikli davomida kuzatiladi. Lagranj zarrachalarini kuzatish o'ng qorinchadan o'pka arteriyalariga va chap qorinchadan aortaga oqim bilan oksigenlangan va deoksigenlangan oqimlarning qulay oqimini aniqladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Nuqson gidrodi&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;namikasi&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;noma'lum&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/pa
