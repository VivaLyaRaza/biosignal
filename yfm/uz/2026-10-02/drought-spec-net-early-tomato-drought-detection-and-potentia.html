            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"201\" cy=\"105\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"699\" cy=\"193\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · PLANT BIOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Neyrotarmoq pomidorlarning&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;suvsizlikdan aziyat&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;chekayotganini qanday&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;aniqlaydi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/drought-spec-net-early-tomato-drought-detection-and-potentia.jpg\" alt=\"Solanum lycopersicum - 1001.jpg\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Solanum lycopersicum - 1001.jpg&lt;/em&gt; — &lt;a href=\"https://commons.wikimedia.org/wiki/File:Solanum_lycopersicum_-_1001.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;DenesFeri · CC BY-SA 4.0&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;Dehqonlar ko‘pincha pomidorning suvga muhtojligini o‘simlik so‘lishni boshlaganda payqashadi. Tadqiqotchilar spektral tahlil yordamida barglardagi yashirin o‘zgarishlarni aniqlaydigan Drought-Spec-Net neyrotarmoqni ishlab chiqishdi. Tizim nafaqat stress darajasini belgilaydi, balki hosildorlik yo‘qotishlari prognozi bilan avtomatik hisobotlarni ham tayyorlaydi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/drought-spec-net-early-tomato-drought-detection-and-potentia.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Gibrid 1D-CNN modeli suv stressini 97% aniqlik bilan erta aniqlaydi.&lt;/li&gt;\n&lt;li&gt;Tizim spektral ma’lumotlarni hosil yo‘qotishlarining miqdoriy bahosiga aylantiradi.&lt;/li&gt;\n&lt;li&gt;AgriLLaMA integratsiyasi dehqonlar uchun avtomatik tavsiyalar yaratadi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/drought-spec-net-early-tomato-drought-detection-and-potentia.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Drought-Spec-Net modelini o‘qitish uchun 348–1052 nm to‘lqin uzunligi oralig‘ida (ko‘rinadigan va yaqin infraqizil spektr, Vis-NIR) olingan 378 ta pomidor (Solanum lycopersicum L.) spektral profillari to‘plamidan foydalanildi. Arxitektura mahalliy spektral belgilarni va global qonuniyatlarni bir vaqtning o‘zida ajratib oluvchi gibrid bir o‘lchovli konvolyutsion neyrotarmoq (1D-CNN) hisoblanadi. 76 ta mustaqil namunada o‘tkazilgan sinovlarda model 97% aniqlik va 97% F1-ko‘rsatkichiga erishdi.&lt;/p&gt;\n&lt;p&gt;Stressni tasniflashdan tashqari, mualliflar 60% maksimal ta’sir chegarasi bilan ehtimollik tahliliga asoslangan hosil yo‘qotishlarini baholash mexanizmini joriy etishdi. Natijalarni talqin qilish uchun AgriLLaMA katta til modeli moslashtirildi, u texnik ma’lumotlarni tushunarli agronomik tavsiyalarga aylantiradi. Qo‘shimcha ravishda, o‘simlik toji darajasida qurg‘oqchilik og‘irligi indeksini (DSI) baholash uchun ilastik vositasi yordamida RGB-tasvirlar segmentatsiyasi o‘tkazildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Hosil yo‘qotishlarini baholash ushbu tajribadagi meva massasining bevosita o‘lchovlariga emas, balki adabiyot ma’lumotlariga asoslangan nazariy modeldir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/drought-spec-net-early-tomato-drought-detection-and-potentia.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Pomidorlarda&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;yashirin suv&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;stressi&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Gibrid 1D-CNN&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;spektral&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\"
