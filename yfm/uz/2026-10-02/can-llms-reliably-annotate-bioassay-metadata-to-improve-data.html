        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"125\" cy=\"106\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"695\" cy=\"192\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;LLM biologik ma'lumotlar&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;bazasidagi tartibsizlikni&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;bartaraf eta oladimi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data-f1.jpg\" alt=\"1-rasm: Rasm toʻliq BAO OWL faylini yuklab olish va PowerPoint dasturida quyi daraxtni yaratish orqali tayyorlangan.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Rasm toʻliq &lt;a href=\"concepts/bioassay-ontology.html\"&gt;BAO&lt;/a&gt; OWL faylini yuklab olish va PowerPoint dasturida quyi daraxtni yaratish orqali tayyorlangan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;PubChem kabi yirik biologik ma'lumotlar bazalari millionlab tajriba yozuvlarini o'z ichiga oladi, ammo ularning aksariyati tizimlashtirilgan metama'lumotlarga ega emas. Standartlashtirilgan tavsiflarning yo'qligi olimlarga turli tadqiqot natijalarini solishtirishga va ularni sun'iy intellektni o'qitish uchun ishlatishga to'sqinlik qiladi. Mualliflar yettita til modelini sinab ko'rib, ular tajriba protokollarini BAO ontologiyasiga muvofiq avtomatik tarzda tasniflay olishini tekshirishdi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;PubChem'dagi yozuvlarning 99,9% dan ortig'ida BAO metama'lumotlari yo'q.&lt;/li&gt;\n&lt;li&gt;Til modellari tahlil formatlarini tasniflashda 0,96 dan yuqori aniqlik ko'rsatadi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/llm.html\"&gt;LLM&lt;/a&gt; mavjud ekspert annotatsiyalaridagi xatolarni aniqlashga qodir.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqotchilar PubChem'dagi 2 millionga yaqin bioanalizni tahlil qilib, ma'lumotlar yetishmovchiligini aniqlashdi: 36% yozuvlarda tahlil formati, 89% holatda esa bioanaliz turi ko'rsatilmagan. Ushbu muammoni hal qilish uchun ular yettita turli til modelidan (LLM) foydalanib, BioAssay Ontology (BAO) yorliqlarini avtomatik belgilashni sinovdan o'tkazishdi. Natijalarni tekshirish uchun ChEMBL bazasidagi ma'lumotlar etalon sifatida ishlatildi.&lt;/p&gt;\n&lt;p&gt;Natijalar shuni ko'rsatdiki, modellar tahlil formati va aniqlash usulini belgilashda yuqori aniqlikka (&lt;a href=\"concepts/recall.html\"&gt;recall&lt;/a&gt; 0,96 dan yuqori) erishadi. Sifat tahlili davomida ekspert-kurator sun'iy intellekt mavjud annotatsiyalardagi xatolarni topa olishini va ba'zan asl ma'lumotlardan ko'ra aniqroq tasnif taklif qilishini tasdiqladi. Ochiq va yopiq modellar o'rtasidagi samaradorlik farqi kichik bo'lib, bu avtomatlashtirishni keng ko'lamli ilmiy vazifalar uchun qulay qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Bu ish preprint hisoblanadi va kam uchraydigan tahlil turlarida modellarning aniqligi pasayadi, shuning uchun inson nazorati talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Molekulalar xossalarini bashorat qilish uchun bazaviy modellarni rivojlantirish yuqori darajadagi maʼlumotlar tayyorligini, jumladan, metadata annotatsiyasining ishonchliligini talab qiladi. Hozirgi kunda ham ochiq repozitoriylar, ham sanoat skrining maʼlumotlar bazalari biologik tahlillar (bioassays) annotatsiyalarining yetishmasligi, nomuvofiqligi yoki chalkashligi muammosiga duch kelmoqda. Ushbu ishda mualliflar BioAssay Ontology (BAO) asosida tahlil formati va fizik aniqlash usuli maydonlari uchun PubChem bazasidagi annotatsiyalar yetishmovchiligi ko‘lamini baholadilar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BioAssay Ontology (BAO) — bu biologik tajribalarni standartlashtirilgan tarzda tavsiflash uchun mo‘ljallangan tizim bo‘lib, u kompyuterlarga tahlil turi va shartlarini «tushunish» imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;O‘tkazilgan tahlil shuni ko‘rsatdiki, taxminan 2 million bioanalizni o‘z ichiga olgan PubChem bazasida maʼlumotlar tanqisligi juda yuqori: 36% holatlarda tahlil formati, 89% holatlarda bioanaliz turi mavjud emas, 99,9% dan ortiq yozuvlarda esa BAO bo‘yicha format yoki aniqlash texnologiyasi atamalari umuman ko‘rsatilmagan. Bu metadata kuratsiyasi jarayonini avtomatlashtirish zarurligini ko‘rsatadi.&lt;/p&gt;\n&lt;p&gt;Ushbu muammoni hal qilish uchun tadqiqotchilar yettita turli til modellarining (LLM), jumladan ochiq va xususiy modellarning, tahlil matnlari asosida annotatsiyalarni bashorat qilish va tekshirish qobiliyatini o‘rgandilar. Baholash PubChem va ChEMBL maʼlumotlar to‘plamlari yordamida amalga oshirildi va modellarning bashoratlari mavjud «kumush» yorliqlar (avval avtomatik tarzda belgilangan annotatsiyalar) bilan solishtirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Modellar biokimyoviy va hujayraviy tahlil formatlarini aniqlashda yuqori aniqlik (recall kamida 0,96) ko‘rsatdi, aniqlash texnologiyalari uchun ham shunga o‘xshash natijalar qayd etildi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Modellar va dastlabki maʼlumotlar o‘rtasidagi kelishmovchiliklar kam uchraydigan sinflar uchun ortib borsa-da, qo‘lda tekshirish shuni ko‘rsatdiki, ko‘plab nomuvofiqliklar model xatolaridan emas, balki dastlabki manbalardagi qarama-qarshiliklardan kelib chiqqan. Sanoat eksperti-kuratori ishtirokidagi sifat tadqiqotida LLM tomonidan keltirilgan dalillar mutaxassisga o‘z yorliqlarini qayta ko‘rib chiqishga yordam bergani aniqlandi, bu esa modellarning noto‘g‘ri belgilangan maʼlumotlarni aniqlashdagi salohiyatini tasdiqlaydi. Xususiy va ochiq modellar o‘rtasidagi samaradorlik farqi kichik bo‘lib chiqdi. Natijalar shuni ko‘rsatadiki, LLMlar tahlil metadatalarini keng ko‘lamli annotatsiya qilish va auditdan o‘tkazishda yordam berishi mumkin, biroq bunday yorliqlarni mashinali o‘qitish quvurlariga kiritishdan oldin har bir sinf uchun ishonchlilikni baholash va inson nazorati zarur.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot mavjud maʼlumotlar bazalari bilan taqqoslashga asoslangan; avtomatlashtirilgan annotatsiyalar ekspert nazoratini talab qiladi, chunki modellar o‘quv namunalaridagi xatolarni meros qilib olishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"fair-tamoyillari-va-bioanalitik-malumotlardagi-muammolar\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#fair-tamoyillari-va-bioanalitik-malumotlardagi-muammolar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;FAIR tamoyillari va bioanalitik maʼlumotlardagi muammolar&lt;/span&gt;&lt;/a&gt;FAIR tamoyillari va bioanalitik maʼlumotlardagi muammolar&lt;/h4&gt;\n&lt;p&gt;FAIR tamoyillari (topiluvchanlik, foydalanish imkoniyati, oʻzaro muvofiqlik, qayta foydalanish) ilmiy maʼlumotlarni tartibga solishga qaratilgan, ammo ularning sunʼiy intellekt (AI) modellari uchun tayyorligi pastligicha qolmoqda. Asosiy muammo ilmiy omborlardagi toʻliq boʻlmagan, qarama-qarshi yoki notoʻgʻri metamaʼlumotlardir. Bioanalitik (bioassay) toʻplamlar dori vositalarini izlashda mashinali oʻqitish modellari uchun fundamental manba hisoblanadi, chunki ular biologik tizimlarning moddalarga taʼsirini oʻlchaydi. PubChem bazasida 100 milliondan ortiq birikmalar va 1 milliondan ortiq tahlil natijalari mavjud, ammo koʻplab yozuvlarda tajriba formati yoki aniqlash usuli haqida strukturaviy metamaʼlumotlar yetishmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PubChem kabi yirik maʼlumotlar bazalarida millionlab yozuvlar strukturaviy metamaʼlumotlarga ega emas, bu esa ularni mashinali oʻqitishda samarali qoʻllashga toʻsqinlik qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Noaniqlik muammosini hal qilish uchun BioAssay Ontology (BAO) ishlab chiqilgan. U tahlil tavsifini ortogonal oʻqlarga: biologik format, fizik aniqlash usuli, oʻlchanadigan koʻrsatkich va nishonga ajratadi. Bu bir xil formatdagi, lekin turli aniqlash usullariga ega tahlillarni farqlash imkonini beradi. Biroq, PubChem’dagi «In vivo/Toxicity» yoki «Cell-based/RNAi» kabi yorliqlar format, modalik va yakuniy nuqtani bitta satrga birlashtiradi, buni millionlab yozuvlar uchun qoʻlda tuzatib boʻlmaydi. Mualliflar bu jarayonni avtomatlashtirish uchun katta til modellaridan (LLM) foydalanishni taklif qilmoqdalar. Ishda 4 ta ochiq va 3 ta yopiq model BAO boʻyicha format va aniqlash usullarini tasniflash boʻyicha baholanadi.&lt;/p&gt;\n&lt;h4 id=\"bioassay-ontology-bao\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#bioassay-ontology-bao\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;BioAssay Ontology (BAO)&lt;/span&gt;&lt;/a&gt;BioAssay Ontology (BAO)&lt;/h4&gt;\n&lt;p&gt;BAO yuqori samarali skrining natijalarini erkin matndan mantiqiy qatʼiy tavsiflarga oʻtkazish uchun yaratilgan. BAO modeli tahlillarni biologik komponent, nishon, yakuniy nuqta, format va usul boʻyicha qismlarga ajratishga qaratilgan. Doimiy yangilanishlarga qaramay — 2026-yil 6-maydagi v2.8.19 versiyasi 7918 ta sinfni oʻz ichiga oladi — barcha tahlillarni qamrab olish qiyinligicha qolmoqda. Masalan, 2014-yilda BAO ChEMBL’dagi barcha transportyor tahlillarini yetarli darajada tasvirlay olmagan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ontologiya — bu tushunchalar va ular oʻrtasidagi bogʻliqliklarni belgilovchi, kompyuterlarga maʼlumotlar tuzilishini «tushunish» imkonini beruvchi rasmiylashtirilgan bilimlar tizimi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ilgari BAO’ni qoʻllash qoʻlda belgilashni talab qilgan. Vempati va boshqalar 944 ta PubChem tahlilini 20 ta BAO termini bilan bogʻlab, terminologik noaniqlikni kamaytirish mumkinligini koʻrsatishgan. Sanoat ham bu yondashuvdan foydalanadi: AstraZeneca kompaniyasi 381 ta ichki (2005–2013) va 233 ta PubChem tahlilini izohlash uchun BAO’dan foydalangan. Biroq, qoʻlda belgilash millionlab bioanalizlar uchun masshtablanmaydi.&lt;/p&gt;\n&lt;h4 id=\"annotatsiyalangan-ochiq-malumotlar-omborlari\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#annotatsiyalangan-ochiq-malumotlar-omborlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiyalangan ochiq maʼlumotlar omborlari&lt;/span&gt;&lt;/a&gt;Annotatsiyalangan ochiq maʼlumotlar omborlari&lt;/h4&gt;\n&lt;p&gt;Ushbu ishda biz bioanalizlar annotatsiyalarining uchta manbasidan foydalanamiz: PubChem, ChEMBL va BARD. PubChem — 2004-yildan buyon to‘plangan yuqori samarali skrining va tibbiy kimyo maʼlumotlarining eng yirik to‘plamidir. Yuklab olish vaqtida bazada taxminan 1,9 million bioanaliz (AID) mavjud. Biroq, metamaʼlumotlar sifati turlicha: ular ko‘pincha tuzilmagan matn ko‘rinishida bo‘ladi. Ushbu muammoni hal qilish uchun BARD loyihasi NIH Molecular Libraries Program doirasida PubChem yozuvlari uchun BAO (BioAssay Ontology) annotatsiyalarining kuratorlik to‘plamini yaratdi. Ekspertlar matnli protokollarni BAO terminlari bilan qo‘lda moslashtirdilar. BARD portali yopilgan bo‘lsa-da, 1000 ta tahlil uchun 4477 ta annotatsiya PubChem’da mavjud. Ulardan 997 tasida aniqlash usuli, 998 tasida esa tahlil formati annotatsiya qilingan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BARD eng aniq, ekspertlar tomonidan tekshirilgan annotatsiyalarni taqdim etadi, PubChem va ChEMBL esa kengroq, ammo kamroq tuzilgan yoki to‘liq bo‘lmagan maʼlumotlarni o‘z ichiga oladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ChEMBL — bu ilmiy adabiyotlar va ixtiyoriy badallar asosida qo‘lda kuratsiya qilinadigan bioaktivlik bazasi bo‘lib, taxminan 2,0 million tahlilni o‘z ichiga oladi. Standartlashtirishga qaramay, yozuvlarning taxminan 10 foizida format ko‘rsatilmagan, aniqlash usullari belgilari esa ko‘pincha yo‘q yoki ishonchsiz algoritmlar tomonidan yaratilgan. Biz manbalarni ishonchlilik bo‘yicha tartiblaymiz: BARD — etalon sifatida, ChEMBL — ikkilamchi manba va PubChem’ning mahalliy metamaʼlumotlari — eng kam ishonchli manba sifatida. LIT-PCBA, MF-PCBA yoki CAPRICHO kabi mavjud yondashuvlar maʼlumotlarni tozalashga yoki xatolarni belgilashga harakat qiladi, ammo ular kalit so‘zlar va mavjud maydonlardan foydalanish bilan cheklangan, bu esa LLM orqali avtomatlashtirish zarurligini ko‘rsatadi.&lt;/p&gt;\n&lt;h4 id=\"til-modellari-yordamida-bioanalizlarni-kuratsiya-qilish\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#til-modellari-yordamida-bioanalizlarni-kuratsiya-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Til modellari yordamida bioanalizlarni kuratsiya qilish&lt;/span&gt;&lt;/a&gt;Til modellari yordamida bioanalizlarni kuratsiya qilish&lt;/h4&gt;\n&lt;p&gt;LLM biomedikal yozuvlardan metamaʼlumotlarni ajratib olishda yuqori samaradorlikni ko‘rsatmoqda. Masalan, LLaMA asosidagi modellar ChIP-seq parametrlarini yoki hujayra liniyalari va genetik o‘zgarishlar haqidagi maʼlumotlarni muvaffaqiyatli ajratib oladi va anʼanaviy moslashtirish usullaridan ustun keladi. Tahlil formatlarini annotatsiya qilish sohasida nomlangan obyektlarni aniqlash (NER) va ontologiyalar bilan bog‘lash (text2term) usullari qo‘llaniladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM (Large Language Models) — matnni tushunish va yaratish qobiliyatiga ega neyron tarmoqlar bo‘lib, bu kontekstda tajribalarning norasmiy tavsiflarini tuzilmalashtirish uchun ishlatiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM dan foydalanish standart bo‘lmagan belgilarni yaratish xavfi bilan bog‘liq, shuning uchun zamonaviy usullar model natijasini rasmiy ontologiyalarga bog‘lash bosqichlarini o‘z ichiga oladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;RELATE kabi mavjud yondashuvlar LLM javoblarini ontologiya terminlariga bog‘lash uchun «qidiruv-so‘ngra-promt» tizimlaridan foydalanadi, bu esa yaroqsiz belgilar paydo bo‘lish xavfini kamaytiradi. Hozirgi vaqtda bunday strategiyalar erkin matn asosida BAO belgilarini (format, aniqlash, nishon) ishonchli va bir xilda tayinlay olishi o‘rganilmagan va bizning ishimiz ushbu bo‘shliqni to‘ldirishga qaratilgan.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"katta-til-modellari-llm-asosidagi-audit-ish-jarayoni\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#katta-til-modellari-llm-asosidagi-audit-ish-jarayoni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Katta til modellari (LLM) asosidagi audit ish jarayoni&lt;/span&gt;&lt;/a&gt;Katta til modellari (LLM) asosidagi audit ish jarayoni&lt;/h4&gt;\n&lt;p&gt;Oldingi bo‘limda aniqlangan ma’lumotlarning yetishmasligi, geterogenligi va nomuvofiqliklarini hisobga olgan holda, biz bioanaliz metama’lumotlarini belgilashda LLM'lardan foydalanish imkoniyatini baholadik. Model bashoratlari PubChem, ChEMBL va BARD bazalaridan olingan mavjud annotatsiyalar (biz ularni «kumush» yorliqlar deb ataymiz) bilan solishtirildi. Ushbu ma’lumotlar manbalari to‘liq bo‘lmasligi yoki xatoliklarga ega bo‘lishi mumkinligi sababli, keltirilgan tasniflash metrikalarini yakuniy aniqlik ko‘rsatkichi deb hisoblamaslik kerak. Ushbu cheklovlarni yumshatish uchun biz ma’lumotlarning kichik qismini qo‘lda tekshirdik.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Koen kappasi (Cohen’s κ) — ikki baholovchi o‘rtasidagi kelishuv darajasini o‘lchaydigan statistik ko‘rsatkich; 1 to‘liq moslikni, 0 esa tasodifiy moslikni bildiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kumush-manbalarga-nisbatan-ishonchlilik\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#kumush-manbalarga-nisbatan-ishonchlilik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;«Kumush» manbalarga nisbatan ishonchlilik&lt;/span&gt;&lt;/a&gt;«Kumush» manbalarga nisbatan ishonchlilik&lt;/h4&gt;\n&lt;p&gt;Biz LLM'larning o‘zaro kelishuvini Koen kappasi yordamida baholadik. ChEMBL tahlil formati to‘plamida barcha yettita LLM yuqori kelishuvni (κ &amp;gt; 0,9) ko‘rsatdi, BAO vazifalarida ham shunga o‘xshash natijalar olindi. PubChem-BAO kichik to‘plamida kelishuv pasaydi, ammo baribir yuqori bo‘lib qoldi (κ &amp;gt; 0,8), faqat Gemma 3 27B modeli boshqalardan pastroq natija ko‘rsatdi. Ko‘pchilik ovoz berish usulida LLM'lar 96% hollarda ChEMBL yorliqlari bilan mos keldi. «Hujayraviy» va «biokimyoviy» formatlar barqaror darajada yaxshi tasniflandi (recall ≥ 96%). «Organizmga asoslangan» formatda ko‘rsatkichlar turlicha bo‘ldi: Gemma 3 27B eng yuqori aniqlikni (precision) ko‘rsatdi, ammo eng kam bashorat qildi. Ushbu sinf uchun recall 87% va precision 77% ni tashkil etdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM modellari yuqori kelishuv (κ &amp;gt; 0,8–0,9) va 96% gacha aniqlikni ko‘rsatdi, biroq kam uchraydigan ma’lumotlar sinflarida samaradorlik pasayadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;«Hujayrasiz» va «to‘qimalarga asoslangan» formatlar uchun aniqlik va to‘liqlik sezilarli darajada past bo‘ldi (har bir sinfda ko‘pi bilan bitta to‘g‘ri bashorat). Biroq, qo‘lda tekshirish shuni ko‘rsatdiki, 8 ta holatdan 7 tasida BARD yorlig‘i ChEMBL'dan farq qilgan va LLM'lar BARD bilan mos kelgan yoki ekspert modelning to‘g‘riligini tasdiqlagan. Biz LLM'larning ChEMBL bilan mos kelmagan 43 ta holatini tahlil qildik (2-jadval). 17 ta holatda (59%) LLM konsensusi ChEMBL'ga qaraganda qattiqroq tekshiruvdan o‘tadigan BARD yorliqlari bilan mos keldi. ChEMBL va BARD mos kelgan, ammo modellar mos kelmagan holatlarda, LLM'larning o‘zaro kelishmovchiligi to‘liq emas edi, bu esa modellarni «tuzilmaviy bahs»ga chorlash orqali javoblarni aniqlashtirish imkoniyatini ko‘rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Kumush» yorliqlarni etalon sifatida ishlatish ularning potentsial xatoligi tufayli cheklangan; LLM bashoratlari va ma’lumotlar bazalari o‘rtasidagi korrelyatsiya modellarning xatosizligini isbotlamaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ekspert-baholash\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#ekspert-baholash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ekspert baholash&lt;/span&gt;&lt;/a&gt;Ekspert baholash&lt;/h4&gt;\n&lt;p&gt;Biz 17 ta tahlil (AID) bo‘yicha ekspertlar va katta til modellari (LLM) konsensusi o‘rtasidagi tafovutlarni o‘rganish uchun qo‘shimcha tahlil o‘tkazdik. Tanlamaga ChEMBL va PubChem BARD yorliqlari mos kelib, LLM qarori farq qilgan holatlar; LLM BARD bilan mos kelib, ChEMBL bilan farqlangan to‘rtta holat; hamda LLM hech qaysi manba bilan mos kelmagan holatlar kiritildi. Ekspertlarga LLM uchun taqdim etilgan barcha ma’lumotlar: nom, tavsif, izoh va protokol berildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BAO (BioAssay Ontology) — bu biologik tahlillarni standartlashtirilgan tasniflash tizimi bo‘lib, dori vositalarini tadqiq qilish usullarini tartibga solishga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ekspertlar vazifaning murakkabligini ta’kidlashdi. 6 ta holatda ular LLM xulosasiga darhol qo‘shilishdi, yana 6 tasida esa modellarning dalillarini ko‘rgandan so‘ng rozi bo‘lishdi. 4 ta qo‘shimcha holatda ekspertlar LLM tasnifini asosli deb topishdi (3 tasida dalillarni o‘rgangach), ammo aniq yorliq bera olishmadi. Bu shuni ko‘rsatadiki, ba’zi tahlillar bir nechta toifaga mos kelishi yoki aniq tasniflash uchun yetarli ma’lumotga ega bo‘lmasligi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ayrim hollarda LLM ekspertlarga BAO ta’riflariga e’tibor bermaslik oqibatida yuzaga kelgan xatolarni tuzatishga yordam berdi, ammo modellar ham hujayra liniyalarini butun organizmlar bilan adashtirib xatoga yo‘l qo‘ydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Masalan, AID 2695 uchun ekspert dastlab tahlilni «hujayraviy» deb belgilagan, ammo LLM dalillarini ko‘rib chiqqach, BAO qoidalariga ko‘ra bir hujayrali organizmlar «organizm» formatiga kirishini tan olgan. AID 588769 holatida modellar PubChem belgilashidagi xatoni aniqladi. Biroq, AID 504631 uchun ekspert ChEMBL yorlig‘ini ma’qul ko‘rdi, chunki LLM dalillarni to‘g‘ri ajratib olsa-da, tirik organizmni noto‘g‘ri tarzda hujayra liniyasi deb tasniflagan. PubChem ma’lumotlari bilan solishtirish (3-jadval) LLM ko‘pincha mustaqil PubChem annotatsiyalariga qaraganda BARD bilan ko‘proq mos kelishini ko‘rsatdi, bu esa ma’lumotlar bazalarida «haqiqiy» belgilash bo‘yicha yagona standart yo‘qligini anglatadi.&lt;/p&gt;\n&lt;h4 id=\"muhokama-va-xulosalar\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#muhokama-va-xulosalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama va xulosalar&lt;/span&gt;&lt;/a&gt;Muhokama va xulosalar&lt;/h4&gt;\n&lt;p&gt;Bizning auditimiz shuni koʻrsatadiki, PubChem ommaviy yuklamalari toʻliq boʻlmagan tahlil metadata (assay metadata) bilan taʼminlaydi: yozuvlarning taxminan 36 foizida tahlil formati koʻrsatilmagan va 0,1 foizdan kamrogʻida BAO (BioAssay Ontology) strukturaviy annotatsiyasi mavjud. Shuningdek, biz resurslar oʻrtasida sezilarli tafovutlarni kuzatdik: BARD va ChEMBL format belgilari mavjud boʻlgan 236 ta tahlilning 10 foizida maʼlumotlar mos kelmagan. Bu boʻshliqlar metadata maydonlarining ixtiyoriyligi va PubChem’ning «Assay Format» maydoni lugʻatining BAO ierarxiyasiga nisbatan cheklanganligi bilan bogʻliq.&lt;/p&gt;\n&lt;p&gt;Ushbu muammoni hal qilish uchun biz yettita LLM (tijoriy va ochiq kodli) modellarini baholadik. Ular bir-biri bilan kuchli moslikni koʻrsatdi va tahlil formati klasslarini 0,96 dan yuqori recall (toʻliqlik) bilan aniqladi. LLM javoblari «kumush» (silver) yorliqlar bilan mos kelmagan holatlarni qoʻlda tekshirish shuni koʻrsatdiki, xatolar koʻpincha manbalar oʻrtasidagi nomuvofiqliklar yoki notoʻgʻri belgilash bilan bogʻliq. LLM’larning koʻpchiligi ChEMBL bilan kelishmagan holatlarning uchdan biridan koʻprogʻida ular aslida PubChem/BARD yorligʻi bilan mos kelgan va bizning bosh kuratorimiz model keltirgan dalillarni koʻrgach, oʻz yorliqlarini qayta koʻrib chiqqan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM tahlil formatlarini tasniflashda yuqori aniqlik (recall &amp;gt; 0,96) koʻrsatadi va mavjud bazalardagi qarama-qarshiliklarni aniqlashda qoʻlda kuratsiyaga qaraganda ancha arzon yechim boʻla oladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Kumush» yorliqlar — bu avtomatlashtirilgan usullar yoki mavjud bazalardan olingan, oʻqitish uchun yetarli darajada sifatli deb hisoblangan, ammo mutlaq haqiqat (oltin standart) boʻlmagan maʼlumotlar.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tijoriy va ochiq modellar oʻrtasidagi farqlar kichik boʻlib, bu arzonroq ochiq modellarni keng koʻlamli annotatsiya uchun maqbul variantga aylantiradi. 1000 ta yozuvni audit qilish narxi $3–9 ni tashkil etadi, bu qoʻlda qayta ishlashdan ancha arzon. Biz LLM’larning annotatsiya jarayonida muhim rol oʻynashini bashorat qilamiz: ular nomuvofiq yozuvlarni belgilaydi, matnli dalillarni yuzaga chiqaradi va noaniq holatlarni inson kuratorlariga yoʻnaltiradi. Biroq, tadqiqot cheklovlari mavjud: «kumush» yorliqlar faqat qisman ishonchli, shuning uchun hisoblangan recall mavjud kuratsiya bilan kelishuvni anglatadi, mutlaq haqiqatni emas. Shuningdek, baholash BAO’ning birinchi darajasida oʻtkazildi va PUG JSON API cheklovlari namunalar hajmini cheklab qoʻydi.&lt;/p&gt;\n&lt;p&gt;Sifatli validatsiya ham birgina ekspert tomonidan oʻtkazilgani bilan cheklangan. Biz aniq bir xato turini aniqladik: AID 504631 uchun modellar toʻgʻri dalillarni keltirgan (Plasmodium falciparum bir hujayrali organizm ekanligi), ammo tahlilni organizmga asoslangan emas, balki hujayraga asoslangan deb notoʻgʻri tasniflagan. Bu inson tomonidan tanlab tekshirish zarurligini koʻrsatadi. Jarayon BAO ontologiyasidagi kamchiliklarni ham yuzaga chiqardi: «biosensor» uchun taʼrif yoʻqligi va «oddiy oʻlchov» hamda «vizual kuzatuv» usullarining noaniqligi. Kelgusida biz BAO granulyarligini chuqurlashtirish va LLM yordamida «kumush» yorliqlar ziddiyatlarini hal qilishni rejalashtirmoqdamiz.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 1.&lt;/strong&gt; ChEMBL bazaviy modeli uchun sinf boʻyicha recall/aniqlik (tahlil formati)&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Model&lt;/th&gt;\n&lt;th&gt;Acc.&lt;/th&gt;\n&lt;th&gt;mF1&lt;/th&gt;\n&lt;th&gt;mF1top3&lt;/th&gt;\n&lt;th&gt;organizmga asoslangan (n=784)&lt;/th&gt;\n&lt;th&gt;toʻqimaga asoslangan (n=252)&lt;/th&gt;\n&lt;th&gt;hujayrasiz (n=53)&lt;/th&gt;\n&lt;th&gt;(n=6)&lt;/th&gt;\n&lt;th&gt;(n=2)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Claude Sonnet&lt;/td&gt;\n&lt;td&gt;4.6&lt;/td&gt;\n&lt;td&gt;0.963&lt;/td&gt;\n&lt;td&gt;0.560&lt;/td&gt;\n&lt;td&gt;0.934&lt;/td&gt;\n&lt;td&gt;0.98 / 0.99&lt;/td&gt;\n&lt;td&gt;0.96 / 0.98&lt;/td&gt;\n&lt;td&gt;0.88 / 0.83&lt;/td&gt;\n&lt;td&gt;0.00 / – 0.00 / 0.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Gemini 3.6 Flash&lt;/td&gt;\n&lt;td&gt;0.957&lt;/td&gt;\n&lt;td&gt;0.578&lt;/td&gt;\n&lt;td&gt;0.919&lt;/td&gt;\n&lt;td&gt;0.97 / 0.99&lt;/td&gt;\n&lt;td&gt;0.96 / 0.97&lt;/td&gt;\n&lt;td&gt;0.94 / 0.71&lt;/td&gt;\n&lt;td&gt;0.00 / –&lt;/td&gt;\n&lt;td&gt;0.50 / 0.08&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;GPT-4o&lt;/td&gt;\n&lt;td&gt;0.954&lt;/td&gt;\n&lt;td&gt;0.551&lt;/td&gt;\n&lt;td&gt;0.919&lt;/td&gt;\n&lt;td&gt;0.96 / 0.99&lt;/td&gt;\n&lt;td&gt;0.96 / 0.97&lt;/td&gt;\n&lt;td&gt;0.91 / 0.74&lt;/td&gt;\n&lt;td&gt;0.00 / –&lt;/td&gt;\n&lt;td&gt;0.00 / 0.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;GPT-OSS 20B&lt;/td&gt;\n&lt;td&gt;0.956&lt;/td&gt;\n&lt;td&gt;0.602&lt;/td&gt;\n&lt;td&gt;0.908&lt;/td&gt;\n&lt;td&gt;0.97 / 0.98&lt;/td&gt;\n&lt;td&gt;0.96 / 0.97&lt;/td&gt;\n&lt;td&gt;0.77 / 0.79&lt;/td&gt;\n&lt;td&gt;0.17 / 1.00&lt;/td&gt;\n&lt;td&gt;0.00 / 0.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Gemma 3 27B&lt;/td&gt;\n&lt;td&gt;0.979&lt;/td&gt;\n&lt;td&gt;0.576&lt;/td&gt;\n&lt;td&gt;0.960&lt;/td&gt;\n&lt;td&gt;0.99 / 0.98&lt;/td&gt;\n&lt;td&gt;0.99 / 0.97&lt;/td&gt;\n&lt;td&gt;0.85 / 0.98&lt;/td&gt;\n&lt;td&gt;0.00 / –&lt;/td&gt;\n&lt;td&gt;0.00 / 0.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Gemma 4 31B&lt;/td&gt;\n&lt;td&gt;0.951&lt;/td&gt;\n&lt;td&gt;0.545&lt;/td&gt;\n&lt;td&gt;0.909&lt;/td&gt;\n&lt;td&gt;0.96 / 0.99&lt;/td&gt;\n&lt;td&gt;0.96 / 0.97&lt;/td&gt;\n&lt;td&gt;0.91 / 0.70&lt;/td&gt;\n&lt;td&gt;0.00 / –&lt;/td&gt;\n&lt;td&gt;0.00 / 0.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Llama 3.3 70B&lt;/td&gt;\n&lt;td&gt;0.976&lt;/td&gt;\n&lt;td&gt;0.572&lt;/td&gt;\n&lt;td&gt;0.954&lt;/td&gt;\n&lt;td&gt;0.99 / 0.98&lt;/td&gt;\n&lt;td&gt;0.99 / 0.98&lt;/td&gt;\n&lt;td&gt;0.85 / 0.94&lt;/td&gt;\n&lt;td&gt;0.00 / –&lt;/td&gt;\n&lt;td&gt;0.00 / 0.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Majority vote&lt;/td&gt;\n&lt;td&gt;0.961&lt;/td&gt;\n&lt;td&gt;0.553&lt;/td&gt;\n&lt;td&gt;0.921&lt;/td&gt;\n&lt;td&gt;0.97 / 0.98&lt;/td&gt;\n&lt;td&gt;0.97 / 0.97&lt;/td&gt;\n&lt;td&gt;0.87 / 0.77&lt;/td&gt;\n&lt;td&gt;0.00 / –&lt;/td&gt;\n&lt;td&gt;0.00 / 0.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Qiymatlar R/P sifatida koʻrsatilgan; qoʻllab-quvvatlash (ntrue) sarlavhadagi har bir ustun uchun bir marta koʻrsatilgan. Eng kam qoʻllab-quvvatlanadigan ikkita sinf (toʻqimalarga asoslangan va hujayrasiz, n&amp;lt;10) ishonchli agregat koʻrsatkichlar uchun juda kichikdir. Notoʻgʻri bashoratlar ushbu koʻrsatkichlardan chiqarib tashlangan. Bashoratlar boʻlmaganda aniqlik «–» sifatida koʻrsatilgan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 12.&lt;/strong&gt; ChEMBL BAO tahlil formati yorligʻi bilan LLMlarning aksariyati rozi boʻlmagan 43 ta tahlilni qoʻlda tekshirish&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;ID&lt;/th&gt;\n&lt;th&gt;ChEMBL&lt;/th&gt;\n&lt;th&gt;BARD (agar farqli)&lt;/th&gt;\n&lt;th&gt;Izoh&lt;/th&gt;\n&lt;th&gt;ndis&lt;/th&gt;\n&lt;th&gt;nal&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;2096&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;organism-based&lt;/td&gt;\n&lt;td&gt;ChEMBL and BARD agree; LLMs disagree&lt;/td&gt;\n&lt;td&gt;4 3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2695&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;organism-based&lt;/td&gt;\n&lt;td&gt;ChEMBL and BARD agree; LLMs disagree&lt;/td&gt;\n&lt;td&gt;4 3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;492959&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;organism-based&lt;/td&gt;\n&lt;td&gt;ChEMBL and BARD agree; LLMs disagree&lt;/td&gt;\n&lt;td&gt;4 3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;651893&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;organism-based&lt;/td&gt;\n&lt;td&gt;ChEMBL and BARD agree; LLMs disagree&lt;/td&gt;\n&lt;td&gt;4 3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;504494&lt;/td&gt;\n&lt;td&gt;biochemical&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;cell-free&lt;/td&gt;\n&lt;td&gt;LLMs disagree with both ChEMBL and BARD&lt;/td&gt;\n&lt;td&gt;5 2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;463208&lt;/td&gt;\n&lt;td&gt;biochemical&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;cell-free (6 att.)&lt;/td&gt;\n&lt;td&gt;LLMs disagree with both ChEMBL and BARD&lt;/td&gt;\n&lt;td&gt;4 2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Barcha yorliqlar BAO tahlil formatlari; joyni tejash uchun «format» qoʻshimchasi tushirib qoldirilgan. ndis — ChEMBL bilan rozi boʻlmagan modellar soni, nal — ChEMBL bilan rozi boʻlgan modellar soni; boshqacha koʻrsatilmagan boʻlsa, har bir qator uchun yettita model ishlatilgan. Kulrang rang bilan belgilangan qatorlar katta sanoat kuratori tomonidan tekshiruvga yuborilgan (13-jadval).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 2.&lt;/strong&gt; LLMlarning aksariyati ChEMBL BAO tahlil formati yorligʻi bilan rozi boʻlmagan 43 ta ChEMBL tahlilini kategoriyalash&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Kelishmovchilik namunasi&lt;/th&gt;\n&lt;th&gt;Miqdori&lt;/th&gt;\n&lt;th&gt;%&lt;/th&gt;\n&lt;th&gt;Tekshiruvga yuborilgan&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;LLMs support the BARD label against ChEMBL&lt;/td&gt;\n&lt;td&gt;623968&lt;/td&gt;\n&lt;td&gt;spectrophotometry / fluorescence method / quantitative reverse transcription PCR (this is not a physical detection method but an assay supporting method)&lt;/td&gt;\n&lt;td&gt;– 3/3 (6 att.)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;ChEMBL and BARD agree and LLMs disagree with both&lt;/td&gt;\n&lt;td&gt;588778&lt;/td&gt;\n&lt;td&gt;fluorescence / spectrophotometry / (no other)&lt;/td&gt;\n&lt;td&gt;– 5/2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;ChEMBL and BARD disagree and LLMs disagree with both (novel prediction)&lt;/td&gt;\n&lt;td&gt;602418&lt;/td&gt;\n&lt;td&gt;luminescence / fluorescence / (no other)&lt;/td&gt;\n&lt;td&gt;– 3/0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;No BARD label available; ChEMBL-only ground truth&lt;/td&gt;\n&lt;td&gt;588816&lt;/td&gt;\n&lt;td&gt;fluorescence / simple measurement method / (no other)&lt;/td&gt;\n&lt;td&gt;– 3/1 (6 att.)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;602170&lt;/td&gt;\n&lt;td&gt;spectrophotometry / visual observation method / (no other)&lt;/td&gt;\n&lt;td&gt;– 3/1&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;624103&lt;/td&gt;\n&lt;td&gt;fluorescence / simple measurement method / (no other)&lt;/td&gt;\n&lt;td&gt;– 3/2 (6 att.)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Katta sanoat kuratori tomonidan tekshiruvga yuborilgan kelishmovchilik naqshlarining soni va foizi koʻrsatilgan (13-jadval).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 15.&lt;/strong&gt; PubChem ommaviy yuklamasidagi uchinchi tomon BAO yorligʻi bilan koʻpchilik modellar rozi boʻlmagan 34 ta fizik aniqlash usuli tahlillarini qoʻlda tekshirish&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;AID&lt;/th&gt;\n&lt;th&gt;BAO yorligʻi (uchinchi tomon)&lt;/th&gt;\n&lt;th&gt;Koʻpchilik bashorati&lt;/th&gt;\n&lt;th&gt;Bioanaliz annotatsiyasi (PubChem)&lt;/th&gt;\n&lt;th&gt;Izoh&lt;/th&gt;\n&lt;th&gt;nmaj./nal.&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;624135&lt;/td&gt;\n&lt;td&gt;fluorescence&lt;/td&gt;\n&lt;td&gt;simple measurement method&lt;/td&gt;\n&lt;td&gt;(no other)&lt;/td&gt;\n&lt;td&gt;–&lt;/td&gt;\n&lt;td&gt;3/2 (6 att.)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;624334&lt;/td&gt;\n&lt;td&gt;fluorescence&lt;/td&gt;\n&lt;td&gt;visual observation method&lt;/td&gt;\n&lt;td&gt;(no other)&lt;/td&gt;\n&lt;td&gt;–&lt;/td&gt;\n&lt;td&gt;2/0 (6 att.)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Barcha yorliqlar BAO fizik aniqlash usullariga tegishli; joyni tejash uchun «method» qoʻshimchasi tushirib qoldirilgan. nmaj. — koʻpchilik bashoratini qoʻllab-quvvatlaydigan modellar soni; nal. — uchinchi tomon BAO yorligʻi bilan mos keladigan bashoratlar soni. Boshqacha koʻrsatilmagan boʻlsa, har bir qator uchun 7 ta model sinab koʻrilgan. Kulrang rang bilan belgilangan qatorlar katta sanoat kuratori tomonidan qoʻshimcha ravishda koʻrib chiqilgan.&lt;/em&gt;&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"malumotlar-toplamini-yaratish\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#malumotlar-toplamini-yaratish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Maʼlumotlar toʻplamini yaratish&lt;/span&gt;&lt;/a&gt;Maʼlumotlar toʻplamini yaratish&lt;/h4&gt;\n&lt;p&gt;LLM modellarining bioanaliz metadata sinflarini bashorat qilish qobiliyatini baholash uchun PubChem BioAssay maʼlumotlari asosida dataset tuzildi. Jami 1 994 310 ta AID yozuvidan 1 770 568 tasi tanlab olindi. Yetishmayotgan maydonlarni toʻldirish uchun PUG REST API ishlatildi. Maʼlumotlar ChEMBL 37 bazasi bilan solishtirildi. Yakuniy toʻplamga ChEMBL boʻyicha 1097 ta, faqat PubChem boʻyicha 226 ta va fizik aniqlash usullari boʻyicha 308 ta tahlil kiritildi. Belgilar BAO iyerarxiyasiga muvofiq tasniflandi (Rasm SN 1, 2). Asl annotatsiyalar qarama-qarshiliklarga ega boʻlgani uchun ular «kumush yorliqlar» (silver labels) deb ataladi va modellarning javoblari bilan kelishuvni tekshirish uchun ishlatiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Kumush yorliqlar» — bu mavjud bazalardan olingan, ekspertlar tomonidan tasdiqlanmagan va xatoliklarga ega boʻlishi mumkin boʻlgan maʼlumotlar.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vazifa-tarifi-va-foydalanilgan-llm\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#vazifa-tarifi-va-foydalanilgan-llm\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Vazifa taʼrifi va foydalanilgan LLM&lt;/span&gt;&lt;/a&gt;Vazifa taʼrifi va foydalanilgan LLM&lt;/h4&gt;\n&lt;p&gt;Modellar tahlil formati yoki fizik aniqlash usulini sarlavha, tavsif va protokol asosida bashorat qilishi kerak. API orqali GPT-4o, Gemini 3.6 Flash, Claude Sonnet 4.6 va Ollama v0.17.4 orqali Gemma 4 31B, GPT-OSS 20B, Qwen 3.5, Llama 3.3 70B modellari ishlatildi. Promptlar taʼsirini baholash uchun 500 ta tahlildan iborat stratifikatsiyalangan namuna tanlandi. Mahalliy modellarda yorliqlar lugʻatini cheklash uchun JSON-Schema parametri qoʻllanildi.&lt;/p&gt;\n&lt;h4 id=\"pubchem-bioassay-metadatalaridagi-kamchiliklar-va-nomuvofiqliklar\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#pubchem-bioassay-metadatalaridagi-kamchiliklar-va-nomuvofiqliklar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PubChem BioAssay metadatalaridagi kamchiliklar va nomuvofiqliklar&lt;/span&gt;&lt;/a&gt;PubChem BioAssay metadatalaridagi kamchiliklar va nomuvofiqliklar&lt;/h4&gt;\n&lt;p&gt;1 994 310 ta yozuvning atigi 89 foizi nom, tavsif va izohga ega, 10 foizdan kamrogʻi esa noyob tavsifga ega. Toʻrtta metadata kategoriyasi (format, BAO format, BAO aniqlash texnologiyasi, BioAssay turi) tahlili yuqori geterogenlikni koʻrsatdi. «BioAssay turi» maydoni format, metodologiya va yakuniy nuqtalarni aralashtirib yuborgani uchun tasniflashga yaroqsiz deb topildi (Jadval SN 9). PubChem lugʻatining cheklanganligi (atigi 3 ta kategoriya) BAO iyerarxiyasi bilan solishtirishda xatoliklarga olib keladi. Ichki nomuvofiqliklar aniqlandi: masalan, AID 1885 veb-interfeysda «hujayraviy», yuklab olish faylida esa «hujayraviy/organizm» deb koʻrsatilgan. 236 ta tahlilning 24 tasida (10,2%) BARD va ChEMBL yorliqlari oʻrtasida ziddiyat kuzatildi. Bundan tashqari, yozuvlarning 36 foizida format haqida maʼlumot yoʻq, 0,1 foizdan kamrogʻida esa BAO annotatsiyalari mavjud.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data-f1.jpg\" alt=\"1-rasm: Rasm toʻliq BAO OWL faylini yuklab olish va PowerPoint dasturida quyi daraxtni yaratish orqali tayyorlangan.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Rasm toʻliq BAO OWL faylini yuklab olish va PowerPoint dasturida quyi daraxtni yaratish orqali tayyorlangan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data-f2.jpg\" alt=\"2-rasm: Rasm toʻliq BAO OWL faylini yuklab olish va PowerPoint dasturida quyi daraxtni yaratish orqali tayyorlangan.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: Rasm toʻliq BAO OWL faylini yuklab olish va PowerPoint dasturida quyi daraxtni yaratish orqali tayyorlangan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data-f3.jpg\" alt=\"Rasm 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data-f6.jpg\" alt=\"Rasm 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 6&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data-f6-2.jpg\" alt=\"Rasm 6 (davomi 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 6 (davomi 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data-f7.jpg\" alt=\"7-rasm: ChEMBL tahlil formatlari toʻplami uchun xususiy LLM bashoratlariga ikkita prompt perturbatsiyasining taʼsiri.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-rasm: ChEMBL tahlil formatlari toʻplami uchun xususiy LLM bashoratlariga ikkita prompt perturbatsiyasining taʼsiri.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;7-rasm: ChEMBL tahlil formatlari toʻplami uchun xususiy LLM bashoratlariga ikkita prompt perturbatsiyasining taʼsiri. BAO taʼriflarini olib tashlash (Without defs) sinflar tartibini oʻzgartirishga (Order swap) qaraganda ancha koʻp bashoratlarni oʻzgartiradi va bu Gemini 3.6 Flash uchun nomutanosib ravishda yuqori (10,8%). Ustun segmentlari har bir oʻzgargan bashorat boshqa yorliqdan «kumush» yorliqqa (yashil), «kumush» yorliqdan boshqa yorliqqa (qizil) yoki «kumush» yorliqdan farqli ikkita yorliq oʻrtasida (apelsin rang) oʻzgarganligini koʻrsatadi; har bir ustun ustidagi foizlar oʻzgargan bashoratlarning umumiy ulushini bildiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ma'lumotlar&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;bazasida metam&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;a'lumotlar&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;yo'qligi&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x= =\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;uchun&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ma'lumotlarni&lt;/text&gt;&lt;text x=\"626\" y=\"162\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tayyorlash&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Preprint hali taqriz qilinmagan. Xulosalar dastlabki.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"manba\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#manba\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manba&lt;/span&gt;&lt;/a&gt;Manba&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Manba&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Kategoriya&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Preprint litsenziyasi&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;other&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mualliflar: Laura van Weesep, Riccardo Tedoldi, Jens Sjölund, Hossein Azizpour, Susanne Winiwarter, Ola Engkvist, Jon Paul Janet, Samuel Genheden, Juan Viguera Diez&lt;/p&gt;\n&lt;h3 id=\"manbalar\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Manba&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Havola&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница препринта&lt;/td&gt;\n&lt;td
