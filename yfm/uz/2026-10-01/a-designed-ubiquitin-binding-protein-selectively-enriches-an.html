        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"90\" cy=\"158\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"530\" cy=\"210\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · BIOENGINEERING   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Erkin ubiquitin: olimlar&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;hujayradagi «ko‘rinmas»&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;regulyatorni kuzatishni&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;o‘rgandi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Ubiquitin — oqsillar faoliyatini boshqaruvchi kichik molekula, ammo uning «erkin» shakli uzoq vaqt sir bo‘lib qolgan. Aniq vositalarning yo‘qligi sababli olimlar uning viruslarga qarshi kurash va neyrodegenerativ kasalliklardagi o‘rnini to‘liq anglay olishmagan. Endilikda tadqiqotchilar erkin ubiquitin bilan tanlanuvchi UBiP10 sun’iy oqsilini yaratdilar. Bu kashfiyot hujayra regulyatsiyasi mexanizmlarini tushunishda muhim qadamdir.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-01/a-designed-ubiquitin-binding-protein-selectively-enriches-an.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Erkin ubiquitinni aniqlash uchun yuqori affinlikka ega UBiP10 zondi yaratildi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/histone-deacetylase-6.html\"&gt;HDAC6&lt;/a&gt; ZnF domenidagi V1091L mutatsiyasi bog‘lanish qobiliyatini sezilarli oshirdi.&lt;/li&gt;\n&lt;li&gt;UBiP10 aggresomalar atrofida erkin ubiquitin qoplamini aniqlashga yordam berdi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-01/a-designed-ubiquitin-binding-protein-selectively-enriches-an.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Ubiquitin (Ub) — 76 aminokislotadan iborat konservativ oqsil bo‘lib, odatda substratlarga birikib, ularni proteasomalarda parchalanishga yo‘naltiradi. Biroq, ubiquitinning katta qismi hujayrada erkin holatda mavjud. Uni aniqlashning an’anaviy usullari, masalan, izopeptidaza T (USP5) fermentining BUZ domeni, past affinlik (dissotsiatsiya konstantasi Kd ≈ 2,8 mkm) tufayli cheklangan edi.&lt;/p&gt;\n&lt;p&gt;Ushbu ishda tadqiqotchilar yo‘naltirilgan evolyutsiya va oqsillarni hisoblash dizayni usullaridan foydalanishdi. Dastlab, HDAC6 oqsilining ruxli barmoq (ZnF) domeni V1091L mutatsiyasi orqali optimallashtirildi, bu esa ubiquitin bilan bog‘lanish kuchini oshirdi. Keyin &lt;a href=\"concepts/rfdiffusion.html\"&gt;RFdiffusion&lt;/a&gt; algoritmi yordamida 11 ta yangi bog‘lovchi oqsil (UBiP) loyihalashtirildi. Ular orasida UBiP10 varianti yuqori selektivlik ko‘rsatib, proteasomalar ishlamay qolganda hosil bo‘ladigan aggresomalar atrofidagi erkin ubiquitin qatlamini vizuallashtirishga imkon berdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot hujayra modellari va lizatlarda o‘tkazilgan; zondning murakkab to‘qimalardagi o‘ziga xosligini in vivo sharoitda tekshirish talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-01/a-designed-ubiquitin-binding-protein-selectively-enriches-an.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Ubikvitin (Ub) — bu ko'plab biologik jarayonlarni post-translatsion modifikator sifatida tartibga soluvchi 76 ta qoldiqdan (8,6 kDa) iborat keng tarqalgan oqsildir. Ub-ning C-terminal Gly qoldig'ini substrat oqsillaridagi Lys qoldiqlariga biriktirishning fermentativ jarayoni oqsillarni ubikvitinlash deb ataladi [1]. Ub boshqa Ub molekulasiga ulanganda, u Ub zanjirini hosil qiladi, uni akseptor Lys joylashuviga qarab, masalan, K48-bog'langan yoki K63-bog'langan zanjirlar va boshqalar sifatida tasniflash mumkin. Bundan tashqari, Ub hujayrada oqsillarga biriktirilmagan monomer yoki polimer zanjirlar sifatida ham mavjud bo'lib, ular bog'lanmagan Ub deb ataladi [2, 3]. Oqsillarni ubikvitinlash, asosan, Ub proteasoma tizimi (UPS) orqali oqsillarning degradatsiyasi uchun javobgar bo'lib, juda batafsil o'rganilgan bo'lsa-da, bog'lanmagan Ub ancha kam o'rganilgan. Bu tushunishning yetishmasligi asosan bog'lanmagan Ub-ni uning kovalent bog'langan shakllaridan ajratish uchun mavjud vositalarning cheklanganligi bilan bog'liq. Paydo bo'layotgan dalillar shuni ko'rsatadiki, bog'lanmagan Ub turli xil biologik yo'llarda, masalan, mezbon-patogen o'zaro ta'sirlarida va oqsil agregatlari hayotiy tsiklida juda muhimdir.&lt;/p&gt;\n&lt;p&gt;Masalan, gripp A virusi (IAV) infeksiyasi paytida virus zarrachasi ichidagi bog'lanmagan Ub gistondeasetilaza 6 (HDAC6) ni jalb qiladi va virionning qobig'ini yechishni osonlashtiradigan motor oqsillari dinein va miozin bilan kompleks hosil bo'lishiga yordam beradi [4]. Virusli RNK sitozolga chiqarilgach, K63-bog'langan bog'lanmagan Ub zanjirlari virusli RNK sensori — melanoma differensiatsiyasi bilan bog'liq 5-oqsil (MDA5) bilan bog'lanib, hujayraning tug'ma immunitet javobini faollashtiradi, natijada interferon regulyator omili 3 faollashuvini qo'zg'atadi va interferon ekspressiyasini rag'batlantiradi [5]. Bundan tashqari, bog'lanmagan Ub zanjirlari agregasomalarning proteasoma vositachiligidagi parchalanishida ishtirok etadi [6], ular UPS buzilganda hosil bo'ladigan ubikvitinlangan, noto'g'ri buklangan oqsillarning perinuklear agregatlari hisoblanadi [7] va Altsgeymer hamda Parkinson kasalligi kabi neyrodegenerativ kasalliklar bilan bog'liq [8]. Biroq, agregasomalarda bog'lanmagan Ub mavjudligini ko'rsatadigan to'g'ridan-to'g'ri dalillar yo'q.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Bog'lanmagan ubikvitin immun javob va agregasomalar dinamikasida muhim rol o'ynaydi, ammo uni o'rganish vositalari cheklangan, bu esa yangi yuqori affinlikka ega oqsillarni ishlab chiqishni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Hozirgi vaqtda bog'lanmagan Ub-ni o'rganish uchun asosiy vosita izopeptidaza T (IsoT; yoki USP5) deubikvitinlovchi fermentining sink barmoq (ZnF) Ub-bog'lovchi domeniga (BUZ domeni) asoslangan bo'lib, u bog'lanmagan Ub bilan 2,8 mkM &lt;a href=\"concepts/k-d.html\"&gt;K_d&lt;/a&gt; dissotsiatsiya konstantasi bilan bog'lanadi [9]. Hujayralardagi bog'lanmagan Ub-ni miqdoriy aniqlash uchun IsoT_BUZ asosidagi ikkita usul ishlab chiqilgan: massa-spektrometriya (MS) yordamida oqsil standartlarini mutlaq miqdoriy aniqlash [10] va IsoT_BUZ dan olingan tUI oqsilini ftoroforlar bilan birlashtirib, bog'lanmagan Ub fluktuatsiyalarini vizualizatsiya qilish [11]. Biroq, har ikkala usul ham o'z cheklovlariga ega. IsoT_BUZ domenining antitanachalarga nisbatan past affinligi bog'lanmagan Ub-ni affin tozalashni kamroq samarali qiladi, bu esa noaniq miqdoriy baholashga olib keladi, tUI-ning hujayralardagi bog'lanmagan Ub-ni vizualizatsiya qilish va hujayra lizatlaridan boyitish uchun o'ziga xosligi esa tasdiqlanmagan holda qolmoqda. Shunday qilib, bog'lanmagan Ub-ni ushlash va aniqlash uchun yanada samarali vositalarga aniq ehtiyoj bor.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;K_d (dissotsiatsiya konstantasi) — bog'lanish kuchining ko'rsatkichi: raqam qanchalik kichik bo'lsa, bog'lanish shunchalik mustahkam bo'ladi. RFdiffusion — belgilangan tuzilishga ega oqsillarni loyihalash uchun chuqur o'rganish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Oqsil dizaynidagi so'nggi yutuqlar, ayniqsa RFdiffusion [12] kabi chuqur o'rganish algoritmlari bilan, yaxshilangan o'ziga xoslik va affinlikka ega oqsillarni muhandislik qilish uchun yangi yo'llarni ochdi. Ushbu tadqiqotda biz bog'lanmagan Ub-ni nishonga olish uchun yuqori affinlik va o'ziga xoslikka ega vositani ishlab chiqishni maqsad qildik, buning uchun bog'lanmagan Ub-ni bog'laydigan tabiiy oqsil bo'lgan HDAC6-ning ZnF_UBP (keyingi o'rinlarda ZnF) domenidan boshladik. Biz ushbu ZnF domenining ko'p o'lchovli mutagenezi va affinlik yetilishidan foydalanib, bog'lanish affinligi sezilarli darajada yaxshilangan mutantni ishlab chiqdik. Biz ushbu mutantni RFdiffusion yordamida de novo loyihalashtirilgan tuzilmalar va boshqa ma'lum Ub-bog'lovchi domenlar bilan birlashtirish uchun qo'shimcha ravishda modifikatsiya qildik. AlphaFold2 [13] yordamida in silico baholashdan so'ng, biz 11 ta yangi Ub-bog'lovchi oqsilni (UBiPs) loyihalashtirdik, bunda UBiP10 bog'lanmagan Ub-ga nisbatan eng selektiv bo'lib chiqdi. Affin tozalash vositasi sifatida UBiP10 bog'lanmagan Ub-ni ham hujayra, ham IAV lizatlaridan, hatto ko'p miqdordagi ubikvitinlangan oqsillar mavjud bo'lganda ham boyitdi. Biz UBiP10-dan immunoflyuressent mikroskopiya bilan birgalikda proteasoma inhibitori bortezomib yoki E1 Ub-faollashtiruvchi ferment inhibitori TAK-243 bilan ishlov berilgandan so'ng hujayralardagi bog'lanmagan Ub darajasidagi fluktuatsiyalarni aniqlash va vizualizatsiya qilish uchun foydalandik. Bundan tashqari, UBiP10 bizga proteasoma ingibitsiyasi natijasida yuzaga kelgan agregasomalar shakllanishi paytida bog'lanmagan Ub lokalizatsiyasini o'rganishga imkon berdi: biz bog'lanmagan Ub agregasomalar shakllanishi paytida hujayra yadrosi atrofida to'planishini va yetuk agregasoma atrofida qobiq hosil qilishini aniqladik. Shunday qilib, UBiP10 hujayra regulyatsiyasida bog'lanmagan Ub-ni o'rganish uchun yangi va kuchli vositadir.&lt;/p&gt;\n&lt;p&gt;Bog'lanmagan Ub bog'lanmagan C-terminal (-LRLRGG) (1A-rasm) mavjudligi bilan tavsiflanadi, bu antitanachalarni ishlab chiqarish yoki de novo oqsil bog'lovchi agentlarni loyihalash uchun zarur epitoplarga ega bo'lmagan qisqa, tuzilmagan motifdir. HDAC6 ZnF domeni bog'lanmagan Ub-ni bog'laydigan tabiiy motifdir. Kristal tuzilishi shuni ko'rsatadiki, R1155/Y1156 va W1182 darvozabon qoldiqlari mos ravishda bog'lanmagan Ub-ga nisbatan o'ziga xoslik va affinlikni belgilaydi [14] (SN-rasm). Bog'lanmagan Ub-ning tarkibiy soddaligi va epitop cheklovlari uni o'ziga xos antitanachalarni ishlab chiqish uchun juda qiyin nishonga aylantiradi; shuning uchun biz yangi vositani ishlab chiqish uchun HDAC6 ZnF-ni ratsional va samarali boshlang'ich nuqta sifatida tanladik. Biz HDAC6 ZnF domenining (1A-rasm) Ub-ga nisbatan affinligini yetishtirishdan boshlashga va keyinchalik bog'lanmagan Ub-ni o'rganish uchun ixtisoslashgan vositani ishlab chiqish uchun qo'shimcha Ub-bog'lovchi motiflarni qo'shishga qaror qildik. Dastlabki ishlar shuni ko'rsatdiki, sichqon (m) HDAC6, mHDAC6_(1007–1149) ning C-terminal oqsil fragmenti, uning ZnF domeni va ba'zi yuqori ketma-ketliklarni o'z ichiga olgan holda, ~60 nM K_d bilan bog'lanmagan Ub-ga nisbatan favqulodda yuqori affinlikka ega [15].&lt;/p&gt;\n&lt;p&gt;Optimizatsiyalarimizni boshlash uchun qaysi konstruksiya eng yaxshisi ekanligini hal qilish uchun biz birinchi navbatda ushbu sichqon oqsil fragmentini inson (h) oqsili, hHDAC6_(1073–1215) ning ekvivalent fragmenti, shuningdek, Ub bilan kompleksda kristallangan qisqaroq ZnF domeni fragmenti, hHDAC6_(1108–1215) — keyingi o'rinlarda ZnF domeni [14] — va to'liq uzunlikdagi oqsil, hHDAC6_(1–1215) (1B-rasm) bilan solishtirdik. Biz tozalangan oqsillarning Ub-ga nisbatan bog'lanish affinligini izotermik titrlash kalorimetriyasi (ITC) yordamida o'lchadik va avvalgi natijalar bilan yaxshi moslikda, sichqon va insonning kengaytirilgan ZnF fragmentlari (69,9 ± 4,6) nM (1C-rasm) va (73,5 ± 3,3) nM (SN-rasm) K_d bilan Ub-ga nisbatan solishtirma affinlikka ega ekanligini aniqladik. Kutilmaganda, to'liq uzunlikdagi oqsil va ZnF domeni ikkalasi ham (1,04 ± 0,20) mkM (SN-rasm) va (5,16 ± 0,47) mkM (1D-rasm) K_d bilan ancha past affinlikka ega edi. Bu ZnF domenining N-terminalidagi ~30 ta qoldiqdan iborat egiluvchan ilmoq Ub bog'lanishini sezilarli darajada kuchaytirganligini ko'rsatadi. Buni yanada o'rganish uchun biz Ub bilan bog'langan kengaytirilgan mHDAC6_ZnF_(1007–1149) tuzilishini bashorat qilish uchun mahalliy o'rnatilgan AlphaFold2-dan foydalandik. Model birinchi α-spiralidan oldingi N-terminal egiluvchan hudud Ub atrofida o'ralganligini ko'rsatdi (1E-rasm), bu kengaytirilgan ZnF domenining yuqori bog'lanish affinligini tushuntiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kengaytirilgan ZnF domeni (1007–1149) egiluvchan N-terminal ilmoq tufayli yadroli domenga qaraganda ~70 barobar yuqori ubikvitin affinligiga ega.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot in vitro va in silico o'tkazildi; tirik tizimlarga ekstrapolyatsiya qilish hujayra muhitining murakkabligi tufayli ehtiyotkorlikni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-01/a-designed-ubiquitin-binding-protein-selectively-enriches-an.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Ub tahlili&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;uchun&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;vositalar&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;yetishmasligi&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;RFdiffusion&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;orqali
