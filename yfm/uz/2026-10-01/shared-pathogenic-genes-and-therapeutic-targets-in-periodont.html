sa mos keladigan to‘qimalar bo‘yicha kasalliklararo taqqoslashni osonlashtirish uchun zarur edi. Bu cheklov tadqiqotda milk (PD) va periferik qon (sJIA) ma’lumotlaridan foydalanilganligi sababli yuzaga keldi. Uchinchidan, aniqlangan genlar, immun infiltratsiya naqshlari va dori-nishon o‘zaro ta’sirlari uchun in vitro yoki in vivo eksperimental tasdiqlash mavjud emas edi, chunki barcha natijalar hisoblash bashoratlari hisoblanadi. To‘rtinchidan, bizda bog‘langan birikmalarning bog‘lanishi va faolligini tasdiqlash uchun to‘g‘ridan-to‘g‘ri funksional tahlillar yetishmadi. Beshinchi muammo immun hujayra fraksiyalarini aniqlashda qo‘llaniladigan metodologiyaga tegishli. Eksperimental o‘lchovlarga tayanish o‘rniga, bu fraksiyalar algoritm qo‘llash orqali chiqarilgan. Nihoyat, muayyan tahlillar uchun namunalar hajmi ochiq ma’lumotlarning mavjudligi bilan cheklangan edi.&lt;/p&gt;\n&lt;h4 id=\"qoshimcha-malumotlar\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#qoshimcha-malumotlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qo‘shimcha ma’lumotlar&lt;/span&gt;&lt;/a&gt;Qo‘shimcha ma’lumotlar&lt;/h4&gt;\n&lt;p&gt;S1 Rasm. Ushbu rasmda PD (chapda) va sJIA (o‘ngda) ma’lumotlar to‘plamlari uchun turli genlarni filtrlash chegaralarida WGCNA modul sonlarining &lt;a href=\"concepts/analiz-chuvstvitelnosti.html\"&gt;sezgirlik tahlili&lt;/a&gt; keltirilgan. (TIF)&lt;/p&gt;\n&lt;p&gt;S2 Rasm. Ushbu rasm WGCNA tahlilida modulga mansublik (MM) va gen ahamiyati (GS) o‘rtasidagi sochilish diagrammasi hisoblanadi.&lt;/p&gt;\n&lt;p&gt;S1 Jadval. Ushbu jadvalda mos ravishda PD va sJIA ma’lumotlar to‘plamlarida SHAP asosidagi talqin tahlillaridan olingan Ridge va AdaBoost modellarining o‘rganilgan parametr qiymatlari keltirilgan. (XLSX)&lt;/p&gt;\n&lt;p&gt;S1 Kod. sJIA ma’lumotlar to‘plamini paketli birlashtirish uchun R skripti. (R)&lt;/p&gt;\n&lt;p&gt;S2 Kod. Genlarning birgalikda ifodalanish tarmoqlari tahlili (WGCNA) uchun R skripti. (R)&lt;/p&gt;\n&lt;p&gt;S3 Kod. 175 ta mashinali o‘qitish modellarini o‘qitish va tasdiqlash uchun R skripti. (R)&lt;/p&gt;\n&lt;p&gt;S4 Kod. SHAP asosidagi talqin tahlili uchun R skripti. (R)&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont-f1.jpg\" alt=\"1-rasm. Tadqiqotning blok-sxemasi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. Tadqiqotning blok-sxemasi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont-f2.jpg\" alt=\"2-rasm. Differensial ifodalangan genlarni (DEGs) aniqlash.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm. Differensial ifodalangan genlarni (DEGs) aniqlash.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm. Differensial ifodalangan genlarni (DEGs) aniqlash. (A, B) PCA nuqtali diagrammasi GSE7753 va GSE80060 ma'lumotlar to'plamlari o'rtasida partiya effektini tuzatishdan oldin va keyin aniq ajralishni ko'rsatadi, bu partiya effektlarining kamayganligini bildiradi. (C, D) PD (GSE16134) va sJIA (GSE7753, GSE80060) ma'lumotlar to'plamlari uchun DEGsni tasvirlovchi vulqon grafiklari. Sezilarli darajada yuqori ifodalangan genlar qizil rangda, sezilarli darajada past ifodalangan genlar ko'k rangda va ahamiyatsiz genlar kulrang rangda ko'rsatilgan. (E, F) PD (GSE16134) va sJIA (GSE7753, GSE80060) ma'lumotlar to'plamlarida aniqlangan 25 ta sezilarli darajada yuqori va past ifodalangan DEGsning ifodalanish namunalarini ko'rsatuvchi issiqlik xaritalari.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont-f3.jpg\" alt=\"Rasm 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont-f4.jpg\" alt=\"Rasm 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont-f5.jpg\" alt=\"5-rasm. Mashinali o'qitish asosida asosiy diagnostik genlarni skrining qilish va validatsiya qilish.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm. Mashinali o'qitish asosida asosiy diagnostik genlarni skrining qilish va validatsiya qilish.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-rasm. Mashinali o'qitish asosida asosiy diagnostik genlarni skrining qilish va validatsiya qilish. (A) Modellarning samaradorligini taqqoslash issiqlik xaritasi bilan tasvirlangan, u turli kohortalardagi turli modellar uchun AUC qiymatlarini ko'rsatadi. Rasmning chap ustuni modellarga mos keladi, o'ng ustun esa AUCni ko'rsatadi, bunda yuqoriroq qiymatlar yaxshiroq samaradorlikni bildiradi. Ranglardan foydalanish har bir kohortaning kelib chiqishini belgilashga xizmat qiladi. (B, C) PD o'quv ma'lumotlar to'plami va sJIA o'quv ma'lumotlar to'plamidagi 6 ta asosiy diagnostik genning ROC egri chizig'i. (D, E) 6 ta asosiy diagnostik genning ifodalanishi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont-f6.jpg\" alt=\"Rasm 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 6&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont-f7.jpg\" alt=\"Rasm 7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 7&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont-f8.jpg\" alt=\"Rasm 8\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 8&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont-f9.jpg\" alt=\"9-rasm. Uchta ligand-oqsil kompleksining (Kempferol-IL1B, Kempferol-ITGAM va Dezoksixol kislotasi-MMP1) 100 ns davomida \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;9-rasm. Uchta ligand-oqsil kompleksining (Kempferol-IL1B, Kempferol-ITGAM va Dezoksixol kislotasi-MMP1) 100 ns davomida molekulyar dinamika (MD) tahlili.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;9-rasm. Uchta ligand-oqsil kompleksining (Kempferol-IL1B, Kempferol-ITGAM va Dezoksixol kislotasi-MMP1) 100 ns davomida molekulyar dinamika (MD) tahlili. (A) Oqsil skeletining o'rtacha kvadratik chetlanishi (RMSD). (B) Giratsiya radiusi (Rg). (C) Har bir qoldiq uchun o'rtacha kvadratik fluktuatsiya (RMSF). (D) 0,35 nm masofadagi vodorod bog'lari. (E) Gibbs erkin energiya landshaftlari (3D sirt va 2D kontur).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Parodontit va&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;sJIA&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;bog‘liqligi&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\
