            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"220\" cy=\"68\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"520\" cy=\"280\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Miya nima uchun sodda&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;tushuntirishlarni tanlaydi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Noaniqlik sharoitida qaror qabul qilganda, bizning miyamiz murakkab emas, balki sodda izohlarni tanlaydi. Yangi tadqiqot shuni ko'rsatdiki, bu shunchaki odat emas, balki statistik modellarni tanlashning aniq matematik qonuniyatidir. Insonlarning tanlovi ortiqcha moslashishning oldini oluvchi Bayes nazariyasiga mos keladi. Sun'iy neyrotarmoqlar esa bu xususiyatni har doim ham takrorlay olmaydi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Odamlar noaniq ma'lumotlarda sodda tushuntirishlarni tanlaydi&lt;/li&gt;\n&lt;li&gt;Tanlovlar Bayes modeli tanlash nazariyasiga mos keladi&lt;/li&gt;\n&lt;li&gt;Neyrotarmoqlar har doim ham bu xususiyatni ko'rsatmaydi&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqotchilar shovqinli va yetarli bo'lmagan ma'lumotlar asosida insonlar qanday qaror qabul qilishini o'rganib chiqdi. Tajribada ishtirokchilar tekislikdagi o'nta nuqta muayyan shakl tomonidan yaratilgani ehtimolini baholashdi. Mualliflar murakkablik jarimalarini o'lchash uchun Fisher haqida axborot yaqinlashishidan foydalandilar. Ma'lum bo'lishicha, insonlarning tanlovi ehtimollik nazariyasining yashirin sabablarni integratsiya qilish qoidasiga aniq mos keladi.&lt;/p&gt;\n&lt;p&gt;Bunday integratsiya har qanday tasodifiy ma'lumotga moslasha oladigan o'ta moslashuvchan tushuntirishlarni jazolaydi. Odamlar noqulay bo'lgan holatlarda ham soddalikka intilishsa-da, ba'zi sun'iy neyrotarmoqlarda bu xususiyat yo'q. Bu shuni ko'rsatadiki, statistik modellashtirish prinsiplari inson tafakkurining markaziy qismidir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot boshqariladigan sharoitdagi xulq-atvor eksperimentlariga asoslangan va neyron mexanizmlarni o'rganmagan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Okkam ustarasi — bu barcha shartlar teng boʻlganda, murakkabroq tushuntirishlarga qaraganda soddaroq tushuntirishlarga ustunlik berish kerak degan tamoyildir. Ushbu tamoyil insonning qaror qabul qilish jarayoniga yoʻnaltiradi deb hisoblanadi, ammo bu taʼsirning tabiati nomaʼlum. Biz ushbu ishda oldindan roʻyxatdan oʻtkazilgan xulq-atvor eksperimentlaridan foydalanib, odamlar noaniq maʼlumotlar uchun ikkita muqobil tushuntirishdan soddaroq boʻlganini afzal koʻrishga moyil ekanligini koʻrsatdik.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Odamlar tizimli ravishda soddaroq tushuntirishlarni tanlaydilar, bu esa ortiqcha moslashuvchanlikni jazolaydigan rasmiy model tanlash nazariyalari bilan miqdoriy jihatdan mos keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu afzalliklar ortiqcha moslashuvchanlikni jazolaydigan rasmiy model tanlash nazariyalarining bashoratlari bilan miqdoriy jihatdan mos keladi. Bunday jazo choralari nafaqat eng yaxshi tushuntirishni, balki barcha mumkin boʻlgan tegishli tushuntirishlar boʻyicha integralni hisobga olganda yuzaga keladi. Biz, shuningdek, soddalikka boʻlgan bu afzalliklar odamlarda saqlanib qolishini, ammo baʼzi sunʼiy neyron tarmoqlarda, hatto ular noadekvat xatti-harakatlarga olib kelganda ham, kuzatilmasligini koʻrsatamiz.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Model tanlash (model selection) — bu maʼlumotlarga moslashish aniqligi va modelning murakkabligi oʻrtasidagi muvozanatni hisobga olgan holda, nomzodlar toʻplamidan eng mos modelni tanlashning statistik usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Natijalarimiz shuni koʻrsatadiki, shovqinli maʼlumotlarga ortiqcha moslashib qolishning (overfitting) oldini olish uchun mumkin boʻlgan yashirin sabablar boʻyicha integratsiyani oʻz ichiga olgan statistik model tanlashning prinsipial yondashuvlari inson qaror qabul qilishida markaziy rol oʻynashi mumkin.&lt;/p&gt;\n&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"qaror-qabul-qilishda-soddalik-tamoyillari\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#qaror-qabul-qilishda-soddalik-tamoyillari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qaror qabul qilishda soddalik tamoyillari&lt;/span&gt;&lt;/a&gt;Qaror qabul qilishda soddalik tamoyillari&lt;/h4&gt;\n&lt;p&gt;Real sharoitlarda qaror qabul qilish uchun biz ko'pincha shovqinli va siyrak ma'lumotlar uchun bir nechta maqbul tushuntirishlar o'rtasida tanlov qilishimiz kerak. Raqobatchi tushuntirishlarni baholashda Okkam ustarasi (Occam’s razor) shuni ko'rsatadiki, biz nafaqat kuzatilgan ma'lumotlarni qanchalik yaxshi tushuntirishini, balki kuzatilmagan muqobil va potentsial ahamiyatsiz ma'lumotlarni tavsiflashdagi potentsial ortiqcha moslashuvchanligini ham hisobga olishimiz kerak (masalan, «buni arvoh qildi!»; Rasm 1a, b). Bunday soddalik afzalligi uzoq vaqtdan beri ruhiy funktsiyani tashkil etuvchi tamoyil sifatida taklif qilingan, masalan, Gestalt psixologiyasidagi Prägnanz tushunchasi, ko'rish uchun bir qator «minimal tamoyillar» va kognitiv jarayonlarda ma'lumotlarni siqishning markaziy rolini belgilovchi nazariyalar. Soddalik, shuningdek, tushuntirish qiymatining kengroq nazariyalari doirasida tushuntirishning afzalliklarini baholashga yordam beradigan asosiy xususiyatlardan biri sifatida taklif qilingan.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kognitiv fanlardagi Okkam ustarasi inson miyasi shovqinli ma'lumotlarga haddan tashqari moslashib qolmaslik uchun oddiyroq tushuntirishlarga ustunlik berishini ta'kidlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ko'plab xulq-atvor tadqiqotlari shuni ko'rsatdiki, odamlar turli vazifalarni, jumladan, idrok etishni baholash, manbani rekonstruktsiya qilish va sababiy tushuntirishlarni bajarishda soddalik afzalligini namoyon etadilar. Ushbu tadqiqotlarda ushbu sharoitlarda aynan nima «soddalik» (yoki ekvivalent ravishda, yoqtirilmaydigan «murakkablik») deb hisoblanishi mumkinligi uchun bir nechta rasmiy ta'riflar taklif qilingan, jumladan, tushuntirishda keltirilgan kuzatilmagan yoki tushuntirilmagan sabablar soni, tavsif uzunligi va Kolmogorov murakkabligi yoki Bayes xulosasida marjinal ehtimolliklarni hisoblashdan kelib chiqadigan statistik murakkablik. Bayes tushuntirishiga muvofiq, ba'zi hollarda bunday soddalik afzalliklari ko'proq ehtimoliy dalillar taqdim etilganda kamayadi, bu esa oddiyroq tushuntirishlarga ko'proq og'irlik beradigan Bayes apriorini aks ettiradi deb taxmin qilinadi. Boshqa insoniy mulohazalar moslashuvchan tushuntirishlarni jazolaydigan Bayes ramkasiga mos kelishi ko'rsatilgan, bunda bu moslashuvchanlik uning o'lchovliligi emas, balki parametrlar fazosining o'lchami bilan boshqariladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Bayes xulosasi — bu yangi ma'lumotlar kelib tushishi bilan ehtimolliklar yangilanadigan statistik xulosa usuli bo'lib, u gipotezalarning ishonchliligini baholashga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biroq, bu turdagi soddalik afzalliklari murakkablikning nazariy tushunchalari tomonidan belgilangan soddalik va tushuntirishning moslashuv sifati o'rtasidagi o'ziga xos kelishuvlar bilan miqdoriy jihatdan qanday bog'liqligi noma'lumligicha qolmoqda. Ushbu tadqiqotning maqsadi insonning idrok etish qarorlarini qabul qilishda soddalik moyilliklarining nazariy asoslangan, miqdoriy hisobini yaratish edi. Buning uchun biz ushbu qarorlarni statistik model tanlash muammosi sifatida rasmiylashtiradigan vazifalar to'plamini ishlab chiqdik. Ushbu yondashuv bizga bir modelni (ya'ni, kuzatilgan ma'lumotlarning potentsial manbasini) boshqasidan ko'ra ko'proq (yoki kamroq) murakkab qiladigan va shuning uchun ortiqcha moslashuvchanlik tufayli moslashuv sifatiga ta'sirini neytrallash uchun maxsus jarimalarni talab qiladigan o'ziga xos xususiyatlarni aniqlashga imkon berdi. Muhimi, bu jarimalar ma'lumotlarga bog'liq bo'lishi mumkin va shuning uchun soddalikning umumiy afzalligi bilan to'liq takrorlanishi mumkin emas. Quyida batafsil bayon etganimizdek, ushbu yondashuv bizga Okkam ustarasi shunchaki afzallik emas, balki shovqinli ma'lumotlarga moslashuvchan tushuntirishlarni moslashtirishga urinishda yuzaga keladigan muammolarga qarshi turish uchun mumkin bo'lgan yashirin sabablarni birlashtiradigan asosiy qaror qabul qilish jarayonlarining namoyon bo'lishi ekanligi haqidagi g'oyani qo'llab-quvvatlaydigan soddalik moyilliklarining o'ziga xos shakllarini aniqlashga imkon berdi.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"model-tanlash-orqali-okkam-ustarasining-rasmiylashtirilishi\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#model-tanlash-orqali-okkam-ustarasining-rasmiylashtirilishi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Model tanlash orqali Okkam ustarasining rasmiylashtirilishi&lt;/span&gt;&lt;/a&gt;Model tanlash orqali Okkam ustarasining rasmiylashtirilishi&lt;/h4&gt;\n&lt;p&gt;N ta kuzatuvdan iborat X toʻplami va mumkin boʻlgan parametrik statistik modellar toʻplami &lt;span class=\"yfm-latex\" data-content=\"%5C%7BM_1%2C%20M_2%2C%20.%20.%20.%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; berilgan boʻlsa, biz maʼlum maʼnoda X maʼlumotlarini eng yaxshi tavsiflovchi M modelini izlaymiz. Ushbu kontekstda Okkam ustarasini modelning moslashuvchanligi yoki murakkabligi oʻlchovi orqali modelning maʼlumotlarga qanchalik mos kelishini jarimalash deb talqin qilish mumkin, bu boshqa modellar bilan solishtirganda moslik sifatini asossiz ravishda oshirib yuborishi mumkin. Bayes statistikasi murakkablikning bunday oʻlchovini taqdim etadi va qaror qabul qilish aniqligini maksimal darajada oshirish uchun u moslik sifati bilan qanday muvozanatlanishi kerakligini belgilaydi. Ushbu muvozanat shuning uchun yuzaga keladiki, model murakkabligining oshishi maʼlumotlardagi turli xil signallarga yaxshiroq mos kelishni taʼminlasa-da, u shovqinga oʻta moslashib ketish (overfitting) tufayli xatolarga ham olib keladi (Rasm 1c).&lt;/p&gt;\n&lt;p&gt;Bayes yondashuviga koʻra, modellar ularning asoslanganligi (evidence) yoki marginal haqiqatga oʻxshashligi &lt;span class=\"yfm-latex\" data-content=\"p(X%2FM)%20%3D%20%5Cint%20d%5Cvartheta%20w(%5Cvartheta)p(X%2FM%2C%20%5Cvartheta)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; asosida solishtirilishi kerak, bu yerda &lt;span class=\"yfm-latex\" data-content=\"%5Cvartheta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; model parametrlarini, &lt;span class=\"yfm-latex\" data-content=\"w(%5Cvartheta)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; esa ular bilan bogʻliq aprior taqsimotni ifodalaydi. Parametrlarni oʻzgartirish orqali biz model variantlarini tadqiq qilishimiz va maʼlumotlarning mumkin boʻlgan tavsiflari koʻpligini aniqlashimiz mumkin. Shunday koʻpliklardan ikkitasi kuzatilgan maʼlumotlarga eng yuqori ehtimollikni beruvchi maksimal haqiqatga oʻxshashlik parametrlari bilan birga Rasm 1c da tasvirlangan. Yumshoq muntazamlik farazlari va yetarli maʼlumotlar mavjud boʻlganda, asoslanganlikning (logorifmi) M modelining maksimal logorifmik haqiqatga oʻxshashligi va bir nechta jarima omillarining yigʻindisi sifatida yozilishi mumkin (Rasm 1d). Koʻrib chiqilayotgan modellarning aprior (maʼlumotlarga bogʻliq boʻlmagan) ehtimolliklari teng boʻlgan taqdirda ham aniqlanadigan ushbu jarima omillarini ular oʻzida mujassam etgan murakkablikning muayyan shakllariga koʻra maʼlum modellarga qarshi miqdoriy belgilangan afzalliklar sifatida talqin qilish mumkin; yaʼni Okkam ustarasining miqdoriy shakli.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Fisher axborot yaqinlashuvi (&lt;a href=\"concepts/fisher-information-approximation.html\"&gt;FIA&lt;/a&gt;) metodi&lt;br /&gt;\nStatistik model murakkabligini baholashning matematik usuli boʻlib, u nafaqat parametrlar sonini, balki parametrlar fazosining geometrik shaklini ham hisobga oladi. Bu oʻrgatuvchi maʼlumotlarga biroz yomonroq mos keladigan, lekin yangi kuzatuvlarni ancha yaxshi umumlashtiradigan modellarni topishga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz Fisher axborot yaqinlashuvi (Fisher Information Approximation, FIA) deb ataydigan ushbu yondashuv jismoniy oʻzgaruvchilar (masalan, yorugʻlik intensivligi) va ularning psixologik analoglari (masalan, yorqinlik) oʻrtasidagi munosabatni tavsiflovchi, yomonroq mos keladigan, lekin yaxshiroq umumlashtiradigan psixofizik modellarni aniqlash uchun ishlatilgan. U statistik model murakkabligining shunga oʻxshash miqdoriy taʼriflari, masalan, minimal tavsif uzunligi (Minimum Description Length), minimal xabar uzunligi (Minimum Message Length) va prognoz qiluvchi axborot (Predictive Information) konsepsiyalari bilan bogʻliq. FIA ning asosiy xususiyati shundaki, agar parametrlar boʻyicha aprior taqsimot &lt;span class=\"yfm-latex\" data-content=\"w(%5Cvartheta)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; noinformativ deb qabul qilinsa, har bir jarima omili modelning alohida geometrik xususiyatini aks ettirishini koʻrsatish mumkin. Ushbu geometrik xususiyatlarning har biri modelning tushuntirish kuchi maʼlumotlarga yaqin (yoki undan uzoq) joylashganlik darajasini turlicha xarakterlaydi.&lt;/p&gt;\n&lt;p&gt;Bu yerda biz ushbu Bayes formulasining (haqiqatga oʻxshashlikdan keyingi) toʻrtta asosiy hadiga eʼtibor qaratamiz, ular modelning toʻrtta alohida geometrik xususiyatini ifodalaydi (Rasm 1c, d). Birinchi had — modelning oʻlchamliligi (parametrlar soni) boʻlib, u model tanlash uchun keng tarqalgan Bayes axborot mezonidir (BIC). Ikkinchi had (ushbu ishning yangi hissasi; «Metodlar» boʻlimining A.2 kichik boʻlimiga qarang) — bu chegaraviy jarima boʻlib, model yaxshi tushuntira oladigan mumkin boʻlgan kuzatuvlar toʻplami model ifodalashi mumkin boʻlgan narsalarning keskin cheklanishi tufayli maʼlumotlardan qanchalik uzoqlashganini oʻlchaydi; bu model oʻzining tushuntirish qobiliyatini mumkin boʻlgan kuzatuvlar fazosining ahamiyatsiz sohalarida jamlashini anglatadi. Uchinchi had — model hajmi boʻlib, u oʻz ichiga olgan farqlanuvchi ehtimollik taqsimotlari sonini ifodalaydi va shu tariqa oldingi tadqiqotlarda koʻrib chiqilgan «parametrlar fazosi hajmi» gʻoyasini rasmiylashtiradi. Toʻrtinchi had modelning geometrik shakli bilan bogʻliq boʻlib, u modelning maksimal haqiqatga oʻxshashlik nuqtasi atrofida maʼlumotlardan «ogʻish» tendensiyasiga ega yoki yoʻqligiga sezgirdir. Ushbu oxirgi uchta had (chegara, hajm va shakl) model oilasi tomonidan tavsiflangan barcha taqsimotlar orasida faqat maʼlumotlarga eng yaqin boʻlganlarigina foydali tushuntirishlarni ifodalashi, qolganlari esa «isrof qilingan» tushuntirish kuchini tashkil qilishi haqidagi intuitiv tushunchani miqdoriy jihatdan aks ettiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Modellarning geometrik murakkabligi&lt;br /&gt;\nOddiy parametrlar sonidan (BIC mezoni) tashqari, Bayes tahlili uchta geometrik jarimani aniqlaydi: chegaraviy, hajm va shakl jarimalari. Ular modelning real maʼlumotlardan uzoq boʻlgan konfiguratsiyalarga «isrof qilingan» tushuntirish kuchini miqdoriy baholaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu murakkablik jarimalari Bayes yondashuvi model parametrlarini marginalizatsiya qilgani sababli yuzaga keladi. Ushbu yondashuvni inson qaror qabul qilish jarayoniga tatbiq etishda biz ushbu marginalizatsiyani yashirin sabablar boʻyicha integrallash deb talqin qilamiz: berilgan kuzatilgan maʼlumotlar toʻplami uchun muayyan tushuntirishni (yoki «modelni») baholash uchun, ushbu tushuntirishning barcha mumkin boʻlgan konfiguratsiyalari boʻyicha oʻrtacha hisobda maʼlumotlarning ushbu tushuntirish ostida qanchalik ehtimolli ekanligi koʻrib chiqiladi. Intuitiv ravishda, moslashuvchan tushuntirishlar oʻrtacha hisoblashda jarimalanadi, chunki ularning koʻplab konfiguratsiyalari dunyoning kuzatilgan holati X bilan hech qanday aloqaga ega emas va shuning uchun juda kichik &lt;span class=\"yfm-latex\" data-content=\"p(X%2FM%2C%20%5Cvartheta)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ehtimolligiga ega boʻladi.&lt;/p&gt;\n&lt;p&gt;Maʼlumotlar tekislikdagi nuqta X = (x, y) bilan ifodalangan quyidagi misolni koʻrib chiqaylik (Rasm 2, yuqorida chapda). Vazifa maʼlumotlar uchun ikkita muqobil tushuntirish (model) oʻrtasida tanlov qilishdan iborat: 1) M₁ — birlik, izotropik dispersiyaga ega va markazi (0, 0) nuqtada boʻlgan Gauss taqsimoti; va 2) M₂ — parametrik Gausslar oilasi, shuningdek birlik dispersiyaga ega, ammo markazlari (-1/2, 1) va (1/2, 1) nuqtalarini birlashtiruvchi toʻgʻri chiziq boʻylab istalgan joyda joylashgan. Shubhasiz, M₂ Rasm 1a dagi arvoh kabi kengroq maʼlumotlar koʻlamini tushuntira oladi va shuning uchun murakkabroqdir. Ikki modeldan teng uzoqlikda joylashgan maʼlumotlar uchun, X = (0, 1/2), Okkam ustarasi bizga M₁ ni tanlashni buyuradi. Boshqacha aytganda, u yoki bu model afzal koʻrilishi kerak boʻlgan sohalarni ajratib turuvchi qaror chegarasi M₁ (oddiyroq model) ga qaraganda M₂ (murakkabroq model) ga yaqinroq joylashgan. Rasm 2 dagi simulyatsiyalar koʻrsatganidek, soddalikka boʻlgan ushbu moyillik aynan yashirin sabablar (model konfiguratsiyalari) boʻyicha integrallashuvchi qaror qabul qiluvchiga xosdir va boshqa, kamroq tizimli vositalar orqali, masalan, sensorli va/yoki tanlov shovqinini qoʻshish orqali koʻplab mumkin boʻlgan tushuntirishlarni tanlab olish natijasi emas (shuningdek, Rasm SB.9 ga qarang).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-f2.jpg\" alt=\"Rasm 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 2&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"odamlar-nazariy-jihatdan-asoslangan-soddalik-afzalliklarini-namoyish-etadilar\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#odamlar-nazariy-jihatdan-asoslangan-soddalik-afzalliklarini-namoyish-etadilar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Odamlar nazariy jihatdan asoslangan soddalik afzalliklarini namoyish etadilar&lt;/span&gt;&lt;/a&gt;Odamlar nazariy jihatdan asoslangan soddalik afzalliklarini namoyish etadilar&lt;/h4&gt;\n&lt;p&gt;FIA murakkablik atamalarini ham inson, ham sunʼiy qaror qabul qiluvchilar tomonidan namoyon boʻladigan potentsial afzalliklar bilan bogʻlash uchun biz oddiy qaror qabul qilish vazifasini ishlab chiqdik. Har bir sinov uchun N=10 ta bir vaqtning oʻzida taqdim etilgan shovqinli kuzatuvlar (1e-rasmdagi qizil nuqtalar) ikkita mumkin boʻlgan shakldan (1e-rasmdagi qora shakllar) birining ichida joylashgan 2D normal («generativ») taqsimotdan tanlab olindi. Maʼlumotlarni yaratuvchi shaklning identifikatori (yuqori yoki pastki) tasodifiy ravishda teng ehtimollik bilan tanlandi. Xuddi shunday, tanlangan shakl ichidagi normal taqsimot markazining joylashuvi Jeffreys prior (Jaynes, 2003) yordamida model parametrlariga bogʻliq boʻlmagan tarzda tasodifiy ravishda tanlandi. Kuzatuvlarga asoslanib, qaror qabul qiluvchi generativ taqsimot markazini oʻz ichiga olishi ehtimoli koʻproq boʻlgan shaklni (modelni) tanladi. Biz toʻrtta vazifa variantidan foydalandik, ularning har biri bayescha model tanlashda jazolanadigan alohida geometrik xususiyatlardan birini oʻrganish uchun moʻljallangan. Boshqacha qilib aytganda, har bir variant uchun bayescha kuzatuvchi har bir juftlikdagi murakkabroq muqobilga nisbatan maʼlum bir miqdoriy afzallikka ega boʻlishi kutiladi (1c va d-rasmlar). Ushbu vazifa uchun FIA aniq bayescha posterior taqsimotning yaxshi yaqinlashuvini taʼminladi (Qoʻshimcha maʼlumot, B.1-boʻlim). Shunga koʻra, bayescha kuzatuvchi kabi yashirin sabablarni tobora koʻproq integratsiya qiluvchi simulyatsiya qilingan kuzatuvchilar FIA-ga oʻxshash ortib borayotgan moyilliklarni namoyon etdilar. Ushbu moyilliklar sensorli shovqin va/yoki tanlov shovqinining kuchayishi effektlaridan ajralib turardi (va ular tomonidan susaytirildi) (Qoʻshimcha maʼlumot B.7.1 va SN-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ishtirokchilar model murakkabligining barcha toʻrt shakliga nisbatan sezgirlikni namoyon etdilar, bu ularning qaror qabul qilishda soddalikni (Okkam ustarasi) afzal koʻrishga moyilligini tasdiqlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Insonlar ishtirokidagi tadqiqotlarimiz uchun biz vazifani amalga oshirish uchun Pavlovia onlayn tadqiqot platformasidan va ishtirokchilarni jalb qilish va sinovdan oʻtkazish uchun Prolific-dan foydalandik. Bizning oldindan roʻyxatdan oʻtgan yondashuvlarimizga (Piasini va boshq., 2020, 2021) amal qilgan holda, biz 1e-rasmda tasvirlangan vazifaning toʻrtta alohida versiyasidan birini bajargan toʻrtta guruhga boʻlingan 202 nafar ishtirokchidan maʼlumotlar toʻpladik (har bir guruhda ~50 nafar ishtirokchi bor edi). Biz ikkita model oilasidan birining parametrik modelining maʼlum bir namunasi tomonidan yaratilgan shovqinli maʼlumotlarning asosiy tushunchalarini intuitiv tarzda tushuntirish uchun ikkita gulzorning birida joylashgan gul urugʻlari analogiyasidan foydalangan koʻrsatmalarni taqdim etdik. Ishtirokchilarning har bir sessiya davomida gulzorlarni yanada optimal (yaʼni soddalikni afzal koʻradigan) tanlash uchun yashirin yoki oshkora fikr-mulohazalardan shunchaki oʻrganish ehtimolini minimallashtirish uchun biz: 1) FIA boʻyicha model murakkabligini jazolaydigan ideal kuzatuvchilar va faqat model ehtimolligidan foydalanadigan simulyatsiya qilingan kuzatuvchilar oʻrtasidagi samaradorlik farqi ~1% boʻlgan shartlardan foydalandik (vazifa turiga qarab; 1e-rasm, qoʻshimchalar), bu butun tajriba davomida ~5 ta qoʻshimcha toʻgʻri sinovga toʻgʻri keladi; va 2) har bir sinovdan keyin emas, balki har bir 100 ta sinovdan iborat blok oxirida fikr-mulohaza taqdim etdik.&lt;/p&gt;\n&lt;p&gt;Oddiy xulq-atvor xulosalari shuni koʻrsatadiki, har qanday modelning ehtimolligi oʻxshash boʻlgan noaniq sinovlar uchun (yaʼni, maʼlumotlar ikkala modeldan ham teng masofada boʻlgan, Okkam ustarasining klassik bayonotining \"boshqa barcha narsalar teng boʻlganda\" shartiga mos keladigan), ishtirokchilar koʻpincha eng oddiy muqobilni tanladilar (3a-rasmdagi koʻk egri chiziqlar ustida choʻzilgan pushti maydon). Barcha ragʻbatlantiruvchi sharoitlarda, shu jumladan bir model boshqasiga qaraganda yuqori ehtimollikka ega boʻlgan holatlarda ham ushbu moyillikni tekshirish va har bir ishtirokchining tanloviga model ehtimolligi va har bir FIA xususiyati qanchalik taʼsir qilganini miqdoriy baholash uchun biz maʼlumotlarimizni ierarxik (bayescha) logistik regressiya yondashuvi yordamida tahlil qildik (A.6-boʻlimdagi usullarga qarang). Biz har bir ishtirokchining har bir FIA atamasiga nisbatan sezgirligini ularning ehtimollik sezgirligiga nisbatan normallashtirilgan miqdor sifatida aniqladik (yaʼni, maʼlum bir FIA atamasi bilan bogʻliq logistik koeffitsientni ehtimollik bilan bogʻliq logistik koeffitsientga boʻlish orqali). Ushbu tahlil shuni koʻrsatdiki, ishtirokchilar model murakkabligining barcha toʻrtta shakliga nisbatan sezgir edilar (3-rasm). Xususan, populyatsiya darajasidagi hisoblangan normallashtirilgan sezgirlik (posterior oʻrtacha ± st. ogʻish, bu yerda nol sezgirlik yoʻqligini, bir esa Bayes-optimal sezgirlikni anglatadi) oʻlchov uchun 4,66 ± 0,96, chegara uchun 1,12 ± 0,10, hajm uchun 0,23 ± 0,12 va mustahkamlik uchun 2,21 ± 0,12 ni tashkil etdi (shuni taʼkidlash kerakki, bizning oldindan roʻyxatdan oʻtgan rejamizga amal qilgan holda, biz bu yerda va butun asosiy matn davomida bayescha yondashuvlardan foydalangan holda parametrlarni baholashga urgʻu beramiz va biz nol gipotezani tekshirishni Qoʻshimcha maʼlumot B.6-boʻlimida va SN-jadvalda taqdim etamiz).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;FIA (Fisher Information Approximation) — model murakkabligini baholash usuli boʻlib, u modelning ortiqcha moslashuvchanligi uchun qanchalik «jazolanishini» miqdoriy aniqlashga imkon beradi va nima uchun odamlar oddiyroq tushuntirishlarni afzal koʻrishini tushunishga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz ushbu tahlillarni rasmiy model taqqoslovlari (WAIC; Qoʻshimcha maʼlumot B.6.1-boʻlim va SN-jadvallarga qarang) bilan toʻldirdik, bu ularning xulq-atvori faqat model va maʼlumotlar oʻrtasidagi minimal masofaga (yaʼni, maksimal ehtimollik yechimiga) tayanmasdan, bayescha model tanlash nazariyasi tomonidan belgilangan geometrik jarimalarni hisobga olgan holda yaxshiroq tasvirlanganligini tasdiqladi. Ularning qarorlari ham yashirin sabablarni integratsiya qilishga moyil boʻlgan jarayonlarga mos keldi (va oʻrtacha sensorli shovqin va past tanlov shovqini darajasini namoyon etdi; Qoʻshimcha maʼlumot B.7 va SN-rasmlar). Umuman olganda, tahlillarimiz shuni koʻrsatadiki, odamlar yashirin sabablarni Okkam ustarasini keltirib chiqaradigan tarzda integratsiya qilishga moyildirlar, bu model murakkabligini tavsiflovchi bayescha model tanlashdagi geometrik xususiyatlarga sezgirlik sifatida namoyon boʻladi.&lt;/p&gt;\n&lt;p&gt;Ishtirokchilar, shuningdek, har bir FIA atamasiga nisbatan optimal va sub-optimal qiymatlarni qamrab oluvchi sezgirlik diapazonlarini oʻz ichiga olgan samaradorlikda sezilarli individual oʻzgaruvchanlikni namoyon etdilar. Ushbu oʻzgaruvchanlik ishtirokchi darajasidagi sezgirlik baholari bilan bogʻliq noaniqlikka nisbatan katta edi (Qoʻshimcha maʼlumot B.4) va samaradorlikka taʼsir qildi, bu mos ravishda sozlangan (yaʼni, Bayes optimaliga yaqin) soddalik afzalliklarining foydaliligini taʼkidladi: aniqlik FIA sezgirligi nazariy bashoratlardan uzoqroq boʻlgan ishtirokchilar uchun pasayish tendentsiyasiga ega edi (2c-rasm; aniqlik va /β - 1/ oʻrtasidagi Spearman rho-ning posterior oʻrtacha ± st. ogʻishi, bu yerda β — sezgirlik: oʻlchov, -0,69 ± 0,05; chegara, -0,21 ± 0,11; hajm, -0,10 ± 0,10; mustahkamlik, -0,54 ± 0,10). Koʻpgina ishtirokchilar tomonidan namoyon etilgan sub-optimal sezgirlik shunchaki vazifaga qiziqishning yoʻqligidan kelib chiqqan deb koʻrinmadi, chunki FIA sezgirligi oson sinovlardagi xatolar bilan korrelyatsiya qilmadi (A.6.1-boʻlimdagi usullarda batafsil tavsiflangan kengaytirilgan regressiya modeli bilan baholangan oʻtkazib yuborish darajasi va optimal sezgirlikdan mutlaq farq oʻrtasidagi Spearman rho-ning posterior oʻrtacha ± st. ogʻishi: oʻlchov, 0,08 ± 0,12; chegara, 0,15 ± 0,12; hajm, -0,04 ± 0,13; mustahkamlik, 0,15 ± 0,14; Qoʻshimcha maʼlumot B.5-boʻlimiga qarang). Xuddi shunday, sub-optimal FIA sezgirligi chegara (rho = -0,13 ± 0,11) va hajm (-0,06 ± 0,11) atamalari uchun zaifroq ehtimollik sezgirligi bilan korrelyatsiya qilmadi, garchi oʻlchov (-0,35 ± 0,07) va mustahkamlik (-0,56 ± 0,10) atamalari bilan kuchliroq, salbiy munosabatlar ushbu sharoitlarda yanada ekstremal va oʻzgaruvchan soddalik afzalliklari (va oʻrtacha hisobda pastroq samaradorlik; 2c-rasmga qarang) vazifaning ushbu versiyalarini bajarishdagi umumiy qiyinchilikni aks ettirganligini koʻrsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot nazorat ostidagi sharoitlarda odamlarning xulq-atvor maʼlumotlariga asoslangan; model murakkabligiga sezgirlikdagi individual farqlar ushbu modelda hisobga olinmagan kognitiv omillarga bogʻliq boʻlishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"suniy-neyron-tarmoqlar-optimal-soddalik-afzalliklarini-organadi\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#suniy-neyron-tarmoqlar-optimal-soddalik-afzalliklarini-organadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sunʼiy neyron tarmoqlar optimal soddalik afzalliklarini oʻrganadi&lt;/span&gt;&lt;/a&gt;Sunʼiy neyron tarmoqlar optimal soddalik afzalliklarini oʻrganadi&lt;/h4&gt;\n&lt;p&gt;Ishtirokchilarimiz tomonidan namoyon etilgan soddalik afzalliklarining optimalligi, oʻzgaruvchanligi va umumiy xususiyatlarini yaxshiroq tushunish uchun biz ularning natijalarini ushbu vazifani bajarishda optimallashtirilgan sunʼiy neyron tarmoqlar (&lt;a href=\"concepts/ins.html\"&gt;SNT&lt;/a&gt;) koʻrsatkichlari bilan taqqosladik. Biz yuqorida tavsiflangan vazifaga tatbiq etiladigan statistik &lt;a href=\"concepts/vybor-modeley.html\"&gt;modelni tanlash&lt;/a&gt; uchun maxsus ishlab chiqilgan yangi SNT arxitekturasidan foydalandik (4a, b-rasm). Har bir urinishda tarmoq kirish maʼlumoti sifatida taqqoslanayotgan modellarni ifodalovchi ikkita tasvirni va ushbu urinishdagi kuzatuvlarni ifodalovchi koordinatalar toʻplamini qabul qildi. Tarmoqning chiqishi softmax vektori sifatida kodlangan ikkita model oʻrtasidagi qaror edi. Biz SNTning 50 ta namunasini tahlil qildik, ular faqat vaznlarning tasodifiy boshlangʻich qiymatlari va oʻqitish jarayonida koʻrilgan misollar bilan farqlanardi, bunda inson ishtirokchilari uchun qoʻllangan logistik regressiya yondashuvi ishlatildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SNT (sunʼiy neyron tarmoq) — bu tasvirlarni aniqlash uchun miya neyronlari ishini taqlid qiluvchi matematik model, softmax esa chiqish maʼlumotlarini modellardan birini tanlash ehtimoliga aylantiruvchi funksiyadir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;SNT quyidagicha loyihalashtirilgan (batafsil maʼlumot uchun «Metodlar» boʻlimiga qarang). Kirish bosqichi ikkita oldindan oʻqitilgan VGG16 konvolyutsion neyron tarmoqlaridan (CNN) iborat boʻlib, ularning har biri koʻrib chiqilayotgan ikkita modeldan birining tasviriy ifodasini qabul qilgan. VGG inson koʻrish tizimi bilan taqqoslash uchun koʻpincha etalon sifatida qabul qilinadigan mashhur arxitektura sifatida tanlangan. CNNlar vaznlari oldindan oʻqitilgan qiymatlarda muzlatilgan konvolyutsion qatlamlar stekidan va ulardan keyin oʻqitish jarayonida oʻzgarishi mumkin boʻlgan uchta toʻliq bogʻlangan qatlamdan iborat edi. CNN chiqishlari chiziqli, rektifikatsiyalangan chiziqli (ReLU) va batch-normallashtirish qatlamlaridan iborat koʻp qatlamli perseptronga (MLP) uzatildi. MLP chiqishlari keyinchalik birlashtirildi va ekvivariant MLPga uzatildi, u maxsus parametr almashish sxemasi orqali ikkita modelning pozitsiyalari almashilganda tarmoq chiqishining ekvivariantligini taʼminlaydi. Tarmoq, shuningdek, har bir modelga bogʻliq holda maʼlumotlar hosil qilish jarayonini takrorlashga intilgan va shu orqali yuqoridagi toʻliq bogʻlangan qatlamlarni vazifaga tegishli xususiyatlarni qamrab oluvchi model tasvirlarini oʻrganishga undagan ikkita shartli variatsion avtokodlovchi (C-&lt;a href=\"concepts/vae.html\"&gt;VAE&lt;/a&gt;) tuzilmasini oʻz ichiga olgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ushbu tadqiqot hisoblash modeli sifatida SNTdan foydalanadi; neyron tarmoqlarda olingan natijalar inson qaror qabul qilishining biologik mexanizmlariga toʻgʻridan-toʻgʻri ekstrapolyatsiya qilinishi mumkin emas.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Oʻqitilgandan soʻng, SNTlar vazifani inson ishtirokchilariga qaraganda sezilarli darajada yaxshiroq bajardi, bunda yuqori umumiy aniqlik, shu jumladan yuqori ehtimollik sezgirligi (Qoʻshimcha maʼlumotlar, B.3-boʻlim) va nazariy jihatdan optimal qiymatlarga yaqinroq boʻlgan soddalik afzalliklari kuzatildi (4c, d-rasm). Ushbu soddalik afzalliklari FIA-yaqinlashuvi oʻrniga aniq bayes modelining posterioridan foydalanadigan simulyatsiya qilingan kuzatuvchilardan kutilganlarga yaqinroq edi, bu FIA aniq bayes posterioriga nomukammal yaqinlashuvni taʼminlashi bilan izohlanadi. Ushbu soddalik afzalliklari turli tarmoqlar boʻylab kattaligi boʻyicha biroz farq qildi, ammo inson ishtirokchilaridan farqli oʻlaroq, bu oʻzgaruvchanlik nisbatan kichik edi (3c va 4d-rasmlardagi qiymatlar diapazonlarini solishtiring, ular turli x-oʻqi shkalalarida chizilgan) va bu tarmoqning suboptimalligi belgisi emas edi, chunki u har bir shart uchun umuman yuqori aniqlik darajalaridagi farqlar bilan tizimli ravishda bogʻliq emas edi (4d-rasm; aniqlik va /β − 1/ oʻrtasidagi Spearman rho koeffitsientining oʻrtacha posterior ± st. chetlanishi, bu yerda β — sezgirlik: oʻlchovlilik, -0.14 ± 0.10; chegara, 0.08 ± 0.11; hajm, -0.12 ± 0.11; mustahkamlik, -0.08 ± 0.11).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SNTlar aniqlik va optimal modellarni tanlashda odamlardan ustun keldi, tarmoqlardagi stoxastik oʻzgaruvchanlik esa odamlarnikiga qaraganda ancha past boʻlib, bu ularning xatolari tabiati boshqacha ekanligini koʻrsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu natijalar shuni anglatadiki, vazifaning stoxastik tabiati bajarilish aniqligini optimallashtirish uchun keng qamrovli oʻqitishdan keyin ham soddalik moyilliklarida maʼlum bir oʻzgaruvchanlikni keltirib chiqaradi, ammo oʻzgaruvchanlikning bu manbai inson ishtirokchilari tomonidan namoyon etilgan sezgirlik (va suboptimallik) diapazonini oʻz-oʻzidan tushuntirib bera olmaydi.&lt;/p&gt;\n&lt;h4 id=\"odamlar,-annlardan-farqli-olaroq,-suboptimal-soddalik-afzalliklarini-saqlab-qoladilar\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#odamlar,-annlardan-farqli-olaroq,-suboptimal-soddalik-afzalliklarini-saqlab-qoladilar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Odamlar, ANNlardan farqli oʻlaroq, suboptimal soddalik afzalliklarini saqlab qoladilar&lt;/span&gt;&lt;/a&gt;Odamlar, ANNlardan farqli oʻlaroq, suboptimal soddalik afzalliklarini saqlab qoladilar&lt;/h4&gt;\n&lt;p&gt;Bizning natijalarimiz, shuningdek, topshiriqni bajarish jarayonida ishtirokchilarga har bir urinish boʻyicha fikr-mulohaza (feedback) bermaganimiz bilan birgalikda, odamlarda oʻlchangan soddalik afzalliklari shunchaki ushbu topshiriq sharoitlari uchun oʻrganilgan optimallashtirishlar emas, balki noaniqlik sharoitida qaror qabul qilishimizning yanada xos (va oʻzgaruvchan) qismi ekanligini koʻrsatadi. Biroq, biz har bir ishtirokchiga Bayesian-like mulohaza yuritishni aks ettiruvchi koʻrsatmalar (Methods boʻlimiga qarang) va test sessiyasidan oldin fikr-mulohaza bilan qisqacha mashgʻulot berganimiz sababli, biz faqat 3-rasmdagi maʼlumotlarga asoslanib, odam ishtirokchilardan oʻlchangan soddalik afzalliklarining kamida baʼzi jihatlari aynan oʻsha koʻrsatmalar va oʻqitish sharoitlariga bogʻliq boʻlganligini istisno qila olmaymiz. Shu sababli, biz ushbu ehtimolni istisno qilish uchun ikkinchi tajribani oʻtkazdik.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Odamlar koʻrsatmalardan qatʼi nazar, soddalikka barqaror moyillikni namoyon etadilar, ANNlar esa oʻqitish sharoitlariga moslashadilar.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu tajriba uchun biz yuqoridagi kabi topshiriq variantlaridan foydalandik, ammo ishtirokchilarni maksimal ehtimollik (maximum likelihood) modelini tanlashga undash uchun moʻljallangan boshqa koʻrsatmalar va oʻqitish toʻplamidan foydalandik (yaʼni, yashirin sabablar boʻyicha integratsiya qilmasdan, balki kuzatilgan maʼlumotlarga eng mos keladigan yagona sababni hisobga olish), shu bilan model murakkabligini eʼtiborsiz qoldirdik. Xususan, vizual belgilar asl tajribadagi kabi edi, ammo ishtirokchilardan ekrandagi ikkita shakldan qaysi biri nuqtalar bulutining massa markaziga yaqinroq ekanligini xabar qilish soʻraldi. Biz ushbu «maksimal ehtimollik» topshirigʻi uchun yollangan ishtirokchilar asl «generativ» topshiriqda qatnashmaganligiga ishonch hosil qildik. Biz yana tajriba va tahlil uchun oldindan roʻyxatdan oʻtgan rejaga amal qildik va har biri ~50 ishtirokchidan iborat toʻrtta guruhga boʻlingan 201 ishtirokchidan maʼlumotlarni toʻpladik. Shuningdek, biz ANNlarni ushbu topshiriq versiyasida toʻgʻri javob sifatida maksimal ehtimollik yechimidan foydalanib oʻqitdik va sinovdan oʻtkazdik.&lt;/p&gt;\n&lt;p&gt;Koʻrsatmalar va oʻqitishdagi ushbu katta farqga qaramay, odam ishtirokchilar generativ va maksimal ehtimollik topshiriqlarida oʻxshash soddalik afzalliklarini namoyon etdilar, bu odamlarda tegishli koʻrsatmalar yoki ragʻbatlantirishlarsiz ham soddalikka umumiy moyillik borligini koʻrsatadi (5-rasm, chapda). Xususan, baʼzi miqdoriy farqlarga qaramay, nisbiy sezgirlik taqsimotlari har ikkala topshiriq uchun bir xil asosiy naqshlarni koʻrsatdi, bunda nisbiy sezgirlik hajm (maksimal ehtimollik topshirigʻi uchun 0,19±0,08; yuqoridagi qiymatlar bilan solishtiring), chegara (0,89±0,10), mustahkamlik (2,27±0,15) va oʻlchovlilik (2,29±0,41) boʻyicha umumiy oʻsish kuzatildi. Odamlar maʼlumotlari va haqiqiy generativ topshiriqda oʻqitilgan ANNlardan farqli oʻlaroq, maksimal ehtimollik topshirigʻida model murakkabligiga nisbatan ANN sezgirligi barcha toʻrtta parametr uchun nolga yaqin edi (5-rasm, oʻngda).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot odamlar ustidagi xulq-atvor tajribalari va kompyuter modellashtirishga (ANN) asoslangan; xulosalarni umumlashtirishda ehtiyotkorlik talab etiladi, chunki tanlama hajmi 201 ishtirokchi bilan cheklangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Odamlar va ANNlar ushbu topshiriqlar uchun qaror qabul qilish xulq-atvorini boshqarishda soddalik moyilliklaridan qanday foydalanganligi va ularning samaradorlikka taʼsiri oʻrtasidagi oʻxshashlik va farqlarni sarhisob qilish uchun 6-rasmda biz sinovdan oʻtkazgan har bir shartlar toʻplami uchun umumiy aniqlik koʻrsatilgan. Xususan, har bir ishtirokchi yoki ANN, topshiriq konfiguratsiyasi va koʻrsatmalar toʻplami uchun biz generativ topshiriq (yaʼni, nazariy jihatdan optimal samaradorlik soddalik moyilliklariga bogʻliq boʻlgan) va maksimal ehtimollik topshirigʻi (yaʼni, nazariy jihatdan optimal samaradorlik soddalik moyilliklariga bogʻliq boʻlmagan) boʻyicha toʻgʻri javoblar foizini hisobladik. Maksimal ehtimollik yechimlari deterministik boʻlganligi (ular faqat maʼlumotlar markazi qaysi modelga yaqinroq ekanligiga bogʻliq va shuning uchun mukammal samaradorlikka olib keladigan optimal, keskin qaror chegarasi mavjud) va generativ yechimlar bunday emasligi (ular ehtimollik va moyillik shartlariga ehtimoliy bogʻliq, shuning uchun mukammal samaradorlikka erishish odatda imkonsiz) sababli, birinchisida samaradorlik ikkinchisiga qaraganda yuqori boʻlishi kutiladi. Shunga koʻra, ham ANNlar, ham (kamroq darajada) odamlar maksimal ehtimollik yechimlariga nisbatan baholanganda yaxshiroq ishlashga moyil edilar.&lt;/p&gt;\n&lt;p&gt;Bundan tashqari, ANNlar berilgan topshiriq sharoitlariga optimallashtirishga mos keladigan xulq-atvorni namoyon etishga moyil edilar: maksimal ehtimollik yechimlarini topishga oʻqitilgan tarmoqlar maksimal ehtimollik topshirigʻi uchun generativ yechimlarni topishga oʻqitilgan tarmoqlardan yaxshiroq ishladi va generativ yechimlarni topishga oʻqitilgan tarmoqlar generativ topshiriq uchun maksimal ehtimollik yechimlarini topishga oʻqitilgan tarmoqlardan yaxshiroq ishladi. Aksincha, odamlar topshiriq sharoitlaridan qatʼi nazar, barcha hollarda Bayesian-like soddalik moyilliklaridan foydalanib, oʻxshash strategiyalarni qabul qilishga moyil edilar. Qisqacha aytganda, ANNlar faqat oʻqitilganda soddalik afzalliklarini namoyon etdi, odam ishtirokchilar esa ularni koʻrsatmalari va oʻqitishidan qatʼi nazar namoyon etdilar.&lt;/p&gt;\n&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;h4 id=\"malumotlar-ochiqligi\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#malumotlar-ochiqligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Maʼlumotlar ochiqligi&lt;/span&gt;&lt;/a&gt;Maʼlumotlar ochiqligi&lt;/h4&gt;\n&lt;p&gt;Ushbu ishda toʻplangan barcha eksperimental maʼlumotlar doi:10.17605/OSF.IO/R6D8N manzilida mavjud.&lt;/p&gt;\n&lt;h4 id=\"kod-ochiqligi\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#kod-ochiqligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kod ochiqligi&lt;/span&gt;&lt;/a&gt;Kod ochiqligi&lt;/h4&gt;\n&lt;p&gt;Eksperimentlarni takrorlash (shu jumladan onlayn psixofizik vazifalarni bajarish, neyron tarmoqlarni oʻqitish va sinovdan oʻtkazish), shuningdek, maʼlumotlarni tahlil qilish va barcha rasmlarni yaratish uchun zarur boʻlgan barcha maʼlumotlar va kodlar doi:10.17605/OSF.IO/R6D8N manzilida mavjud.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 1.&lt;/strong&gt; Odamlar va sunʼiy neyron tarmoqlar (SNT) uchun generativ va maksimal ehtimollik vazifalari parametrlarini taqqoslash&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Parametr&lt;/th&gt;\n&lt;th&gt;Odamlar (Generativ)&lt;/th&gt;\n&lt;th&gt;SNT (Generativ)&lt;/th&gt;\n&lt;th&gt;Odamlar (Maks. ehtimollik)&lt;/th&gt;\n&lt;th&gt;SNT (Maks. ehtimollik)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;µα (yuqori/past siljish)&lt;/td&gt;\n&lt;td&gt;0.107 ± 0.023&lt;/td&gt;\n&lt;td&gt;−0.242 ± 0.151&lt;/td&gt;\n&lt;td&gt;0.056 ± 0.024&lt;/td&gt;\n&lt;td&gt;0.010 ± 0.07&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;µL (ehtimollik)&lt;/td&gt;\n&lt;td&gt;0.461 ± 0.012&lt;/td&gt;\n&lt;td&gt;6.529 ± 0.188&lt;/td&gt;\n&lt;td&gt;0.561 ± 0.018&lt;/td&gt;\n&lt;td&gt;7.966 ± 0.401&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;µD (oʻlcham)&lt;/td&gt;\n&lt;td&gt;2.150 ± 0.445&lt;/td&gt;\n&lt;td&gt;8.484 ± 0.653&lt;/td&gt;\n&lt;td&gt;1.285 ± 0.231&lt;/td&gt;\n&lt;td&gt;−0.030 ± 0.486&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;µB (chegara)&lt;/td&gt;\n&lt;td&gt;0.518 ± 0.045&lt;/td&gt;\n&lt;td&gt;6.286 ± 0.186&lt;/td&gt;\n&lt;td&gt;0.499 ± 0.058&lt;/td&gt;\n&lt;td&gt;0.883 ± 0.121&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;µV (hajm)&lt;/td&gt;\n&lt;td&gt;0.108 ± 0.057&lt;/td&gt;\n&lt;td&gt;6.089 ± 0.204&lt;/td&gt;\n&lt;td&gt;0.105 ± 0.044&lt;/td&gt;\n&lt;td&gt;0.128 ± 0.196&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;µR (mustahkamlik)&lt;/td&gt;\n&lt;td&gt;1.018 ± 0.056&lt;/td&gt;\n&lt;td&gt;4.882 ± 0.417&lt;/td&gt;\n&lt;td&gt;1.276 ± 0.085&lt;/td&gt;\n&lt;td&gt;0.356 ± 0.281&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 2.&lt;/strong&gt; Parametrlar uchun statistik koʻrsatkichlar (ROPE, 95% HDI va PD)&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Parametr&lt;/th&gt;\n&lt;th&gt;ROPE&lt;/th&gt;\n&lt;th&gt;95% HDI (generativ)&lt;/th&gt;\n&lt;th&gt;PD (generativ)&lt;/th&gt;\n&lt;th&gt;95% HDI (maks. ehtimollik)&lt;/th&gt;\n&lt;th&gt;PD (maks. ehtimollik)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Ehtimollik&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;βL&lt;/td&gt;\n&lt;td&gt;&amp;lt; 0.0076&lt;/td&gt;\n&lt;td&gt;[0.012, 0.437]&lt;/td&gt;\n&lt;td&gt;1.00 [0.526, 0.597] 1.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Oʻlcham&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;βD&lt;/td&gt;\n&lt;td&gt;&amp;lt; 0.43&lt;/td&gt;\n&lt;td&gt;[1.299, 3.048]&lt;/td&gt;\n&lt;td&gt;1.00 [0.835, 1.745] 1.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Chegara&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;βB&lt;/td&gt;\n&lt;td&gt;&amp;lt; 0.06&lt;/td&gt;\n&lt;td&gt;[0.43, 0.604]&lt;/td&gt;\n&lt;td&gt;1.00 [0.386, 0.612] 1.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Hajm&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;βV&lt;/td&gt;\n&lt;td&gt;&amp;lt; 0.091&lt;/td&gt;\n&lt;td&gt;[−0.005, 0.218]&lt;/td&gt;\n&lt;td&gt;0.97 [0.019, 0.193] 0.99&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Mustahkamlik&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;βR&lt;/td&gt;\n&lt;td&gt;&amp;lt; 0.11&lt;/td&gt;\n&lt;td&gt;[0.908, 1.126]&lt;/td&gt;\n&lt;td&gt;1.00 [1.11, 1.446] 1.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;ROPE — amaliy ekvivalentlik sohasi, HDI — eng yuqori zichlik oraligʻi, PD — yoʻnalish ehtimolligi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-f3.jpg\" alt=\"Rasm 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-f4.jpg\" alt=\"Rasm 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-f5.jpg\" alt=\"Rasm 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 5&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-f6.jpg\" alt=\"Rasm 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 6&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-fS1.jpg\" alt=\"Rasm S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-fS2.jpg\" alt=\"Rasm S2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-fS2-2.jpg\" alt=\"Rasm S2 (davomi 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S2 (davomi 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-fS3.jpg\" alt=\"Rasm S3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-fS4.jpg\" alt=\"Rasm S4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-fS4-2.jpg\" alt=\"Rasm S4 (davomi 2)\" /&gt
