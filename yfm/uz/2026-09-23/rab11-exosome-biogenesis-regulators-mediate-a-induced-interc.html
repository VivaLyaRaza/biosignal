ica Thunder teskari keng maydonli mikroskopi (Leica) 100x kattalashtirishda (Leica HCX PL FLUOTAR NA 1.3, moyli ob'ektiv) K8 sCMOS kamerasi bilan ishlatildi. Har bir MAG uchun to'rtta SC (har bir bo'lak uchun ikkitadan) ≥10 ta alohida bokira erkaklar uchun tahlil qilindi. Olingan tasvirlar odatda 0,2 mкм z-masofasi bilan 8–12 mкм chuqurlikdagi z-steklar edi.&lt;/p&gt;\n&lt;p&gt;Thunder texnologiyasi (Leica) kontrastni kuchaytirish va fokusdan tashqari xiralikni yo'qotish uchun kichik hajmli hisoblash tozalash (SVCC) bilan qo'llanildi. SC morfologiyasi FLURO-Bright Field tasvirlash yordamida vizuallashtirildi. LED sozlamalari quyidagicha edi: GFP, 40% lazer intensivligida 475 nm qo'zg'alish; YFP, 42% lazer intensivligida 510 nm qo'zg'alish; va RFP, 30% lazer intensivligida 550 nm qo'zg'alish. MAG larning markaziy qismidagi tirik MC lar xuddi shunday tarzda, epitelial qatlamdagi MC yadrolarini aniqlash uchun yorug'lik maydoni kanalidan foydalangan holda tasvirga olindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SVCC (Small Volume Computational Clearing) — bu tasvirni qayta ishlash algoritmi bo'lib, u fokusdan tashqaridagi fon yorug'ligini (tumanlikni) olib tashlaydi va to'qimalarning chuqur qatlamlarini aniq tasvirga olish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gfp-mfas-saqlovchi-asosiy-hujayralarni-fiksatsiyalangan-toqimada-tahlil-qilish\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#gfp-mfas-saqlovchi-asosiy-hujayralarni-fiksatsiyalangan-toqimada-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GFP-MFAS saqlovchi asosiy hujayralarni fiksatsiyalangan to‘qimada tahlil qilish&lt;/span&gt;&lt;/a&gt;GFP-MFAS saqlovchi asosiy hujayralarni fiksatsiyalangan to‘qimada tahlil qilish&lt;/h4&gt;\n&lt;p&gt;ImageJ dasturidagi to‘r (grid) vositasidan foydalanib, GFP-MFAS kanali uchun asosiy hujayralar (MC) tasviri ustiga 25 ta kvadratdan iborat to‘r qo‘yildi. Ko‘p hollarda, quyida ko‘rsatilganidek, markaziy 7, 8, 9-kvadratlar tahlil qilindi va o‘rtacha qiymat hisoblandi. Bez ushbu hududlarda tekis bo‘lmagan hollarda, ularning o‘rniga 12, 13, 14, 17, 18 yoki 19-kvadratlar (to‘qqizta kvadratdan iborat markaziy blokdan) tanlab olindi va tahlil qilindi. Bu jarayon har bir erkak qo‘shimcha bezining (MAG) ikkala bo‘lagi uchun takrorlandi va o‘rtacha qiymat hisoblab chiqildi; har bir eksperimental shart uchun 10 ta alohida bez baholandi. Har bir kvadrat 100 x 100 piksel o‘lchamida edi. Tahlil zarrachalarni aniqlash vositasi yordamida amalga oshirildi, bunda kvadratlar uchun piksel chegarasi qiymati doimiy ekspozitsiyada ≥ 25 (maksimal 255) qilib belgilandi va har bir kvadrat ichida quyidagi qiymatlar hisoblandi: GFP-MFAS punktatlari soni, har bir punktatning o‘rtacha hajmi, GFP floresansiyasining umumiy maydoni, GFP floresansiyasi bilan qoplangan maydon foizi, GFP-musbat piksellarning o‘rtacha intensivligi, integral zichlik (% floresansiya maydoni × o‘rtacha floresansiya signali intensivligi). Shuningdek, biz har bir g‘ayritabiiy agregatsiyalangan materialni o‘z ichiga olgan strukturaning hajmini aniqlash uchun % GFP-musbat maydonning punktatlar soniga nisbatini (% GFP-musbat maydon/punktat) hisobladik.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Asosiy hujayralardagi GFP-MFAS tahlili har bir shart uchun 10 ta bezni 100x100 piksel o‘lchamli standart to‘r yordamida intensivlik va agregatlar morfologiyasini o‘lchash orqali amalga oshirildi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"fiksatsiyalangan-toqimadan-foydalangan-holda-mag-lumenidagi-gfp-mfas-tahlili\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#fiksatsiyalangan-toqimadan-foydalangan-holda-mag-lumenidagi-gfp-mfas-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fiksatsiyalangan to‘qimadan foydalangan holda MAG lumenidagi GFP-MFAS tahlili&lt;/span&gt;&lt;/a&gt;Fiksatsiyalangan to‘qimadan foydalangan holda MAG lumenidagi GFP-MFAS tahlili&lt;/h4&gt;\n&lt;p&gt;ImageJ dasturidagi to‘rtburchak vositasidan foydalanib, har bir bo‘lakning o‘rtasidagi markaziy lumen hududida bitta kvadrat (200 x 200 piksel) belgilandi va ImageJ ning o‘rtacha intensivlik funksiyasi yordamida har bir bo‘lak uchun o‘rtacha GFP-MFAS intensivligi hisoblandi. Keyin bu jarayon ikkinchi bo‘lak uchun takrorlandi. Har bir bokira erkak pashsha uchun ushbu ikki qiymatning o‘rtachasi hisoblandi.&lt;/p&gt;\n&lt;h4 id=\"tasvirlarni-qayta-ishlash-va-rasmlar-uchun-tayyorlash\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#tasvirlarni-qayta-ishlash-va-rasmlar-uchun-tayyorlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tasvirlarni qayta ishlash va rasmlar uchun tayyorlash&lt;/span&gt;&lt;/a&gt;Tasvirlarni qayta ishlash va rasmlar uchun tayyorlash&lt;/h4&gt;\n&lt;p&gt;Ushbu tadqiqot uchun tirik hujayra tasvirlari Leica Thunder mikroskopida to‘plangan dekonvolyutsiyalangan steklar yordamida tayyorlandi. Barcha keltirilgan rasmlarda tasvirlar sekretor hujayralar (SC) morfologiyasini optimal aks ettirish uchun tanlangan bir qatlamli kompozitlardir. Qiziqish uyg‘otadigan fenotiplarni eng yaxshi ifodalovchi floresansiya intensivligi tanlab olindi va barcha tirik hujayra ma’lumotlari bo‘yicha tasvirni qayta ishlash uchun ishlatildi. Rasmlarda ko‘rsatilgan har bir genotip uchun tahlil tasvirlarini yaratishda kesimlarning izchil proyeksiyasi va sozlamalari qo‘llanildi. Barcha tasvirlar SC detallariga qaratilgan holda bir xil o‘lchamlarga qirqildi.&lt;/p&gt;\n&lt;p&gt;Fiksatsiyalangan bezlarning MC tasvirlari uchun LSM980 konfokal mikroskopi yordamida MC yadrolarining markazidan o‘tuvchi bitta z-tekislik olindi. Floresansiya intensivligini miqdoriy baholashda izchillikni ta’minlash uchun GFP kuchaytirgich sozlamalari barcha genotiplar uchun doimiy saqlandi.&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"miqdoriy-baholash-va-statistik-tahlil\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#miqdoriy-baholash-va-statistik-tahlil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Miqdoriy baholash va statistik tahlil&lt;/span&gt;&lt;/a&gt;Miqdoriy baholash va statistik tahlil&lt;/h4&gt;\n&lt;p&gt;Bir nechta eksperimental genotiplarni nazorat guruhi bilan solishtirish uchun biz Kruskal–Wallis nometrik kriteriysidan va undan keyin Dunnning ko‘p sonli taqqoslashlar uchun post-hoc testidan foydalandik. Ikki guruhni solishtirganda, Mann–Whitney nometrik testi qo‘llanildi.&lt;/p&gt;\n&lt;p&gt;Ushbu statistik tahlillar GraphPad Prism dasturida bajarildi. Rasmlarda ko‘rsatilgan barcha grafiklar har bir genotip uchun o‘rtacha qiymatni aks ettiradi va standart og‘ishni (SD) ifodalovchi xatolik chiziqlarini o‘z ichiga oladi.&lt;/p&gt;\n&lt;h4 id=\"tasvirlarni-qayta-ishlash\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#tasvirlarni-qayta-ishlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tasvirlarni qayta ishlash&lt;/span&gt;&lt;/a&gt;Tasvirlarni qayta ishlash&lt;/h4&gt;\n&lt;p&gt;Zerene Stacker yordamida steklashdan so‘ng, har bir ko‘zning kompozit tasvirlari FIJI yordamida turli makroslardan foydalanadigan avtomatlashtirilgan sozlamalar orqali qayta ishlandi (makroslar uchun 1-ilovani ko‘ring). Butun jarayon Rasm S5 da tasvirlangan. Ko‘z markazida 576 x 624 piksel o‘lchamdagi elliptik maydon tanlandi. ImageJ uchun Trainable Weka Segmentation plagini pashsha ko‘zining bir qator etalon tasvirlari asosida alohida ommatidiylarni aniqlash va «normal» hamda nuqsonli ko‘zlardagi ular orasidagi chegaralarni belgilash uchun o‘qitildi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-fS5.jpg\" alt=\"5-rasm. Ommatidial muntazamlikni hisoblash tahlili (7-rasm bilan bog'liq)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm. Ommatidial muntazamlikni hisoblash tahlili (7-rasm bilan bog'liq)&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Watershed (suvayirgich) — bu tasvir segmentatsiyasi algoritmi bo‘lib, u piksel yorqinligini topografik relyef sifatida ko‘rib, bir-biriga tegib turgan ob’ektlarni ajratadi, bunda ob’ekt chegaralari «suvayirgichlar»ga to‘g‘ri keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Olingan segmentlangan ehtimollik xaritasi 8-bitli formatga o‘tkazilib, binar ko‘rinishga keltirildi va alohida ommatidiylarni identifikatsiya qilish uchun watershed transformatsiyasi qo‘llanildi. Qayta ishlashdan so‘ng, FIJI’ning o‘rnatilgan «Analyse Particles» funksiyasi ommatidiylarning XY koordinatalarini generatsiya qildi va ular Excel’ga eksport qilindi.&lt;/p&gt;\n&lt;h4 id=\"malumotlar-tahlili\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#malumotlar-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ma’lumotlar tahlili&lt;/span&gt;&lt;/a&gt;Ma’lumotlar tahlili&lt;/h4&gt;\n&lt;p&gt;Regulyarlikni hisoblash uchun ishlatilgan ma’lumotlar tahlili usuli Rasm S5 da keltirilgan. Tanlangan maydondagi har bir ommatidiy uchun eng yaqin oltita ommatidiygacha bo‘lgan burchak hisoblandi. Ushbu burchaklar ma’lum bir genotipning har bir ko‘zi uchun jamlandi (har bir ko‘z uchun taxminan 250 ta ommatidiy). Etalon egri chiziq uchun nazorat genotipidagi taxminan 15 ta urg‘ochi pashshaning burchaklari, har bir ko‘z uchun eng ko‘p uchraydigan burchak qiymatini nolga tenglashtirish orqali egri chiziq standartlashtirilgandan so‘ng jamlandi.&lt;/p&gt;\n&lt;p&gt;Boshqa barcha genotiplarning alohida ko‘zlari uchun egri chiziqlar, yana eng ko‘p uchraydigan burchak qiymatini nolga tenglashtirgandan so‘ng, ushbu etalon egri chiziq bilan solishtirildi va Pearson korrelyatsiya koeffitsienti hisoblandi. Aniq farqlar Pearson korrelyatsiya koeffitsientini etalon egri chiziqqa nisbatan o‘zgartirdi, u keyinchalik Fisher transformatsiyasi yordamida normallashtirildi. Fisher transformatsiyasi har bir ko‘z uchun Pearson korrelyatsiyalariga qo‘llanilib, statistik tahlil uchun normal taqsimlangan ma’lumotlarni hosil qildi. Transformatsiya qilingan Z-qiymatlari GraphPad Prism’ga eksport qilindi, u yerda taqqoslashlar Brown–Forsythe va Welch ANOVA testlari, so‘ngra ko‘p sonli taqqoslashlar uchun Welch tuzatishi bilan juft bo‘lmagan t-testlar yordamida amalga oshirildi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f1.jpg\" alt=\"1-rasm. SK tomonidan ekspressiya qilinadigan odam Aβ MAG markazidagi epiteliya hujayralarida endolizosomal nuqsonlarni k\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. SK tomonidan ekspressiya qilinadigan odam Aβ MAG markazidagi epiteliya hujayralarida endolizosomal nuqsonlarni keltirib chiqaradi. A. Eksperimental strategiyani ko'rsatuvchi sxema. SKlar faqat MAG ning distal uchida joylashgan, ammo GFP-MFAS va DCG kompartmentlarining boshqa tarkibiy qismlarini bezi lumeniga sekretsiya qiladi, u yerdan ular MC lar tomonidan endositoz qilinishi mumkin. B-D. GFP-mfas gen qopqonini ekspressiya qiluvchi va SK larda maxsus ravishda boshqa transgensiz (B) yoki UAS bilan tartibga solinadigan Aβ-wt (C) yoki Aβ-Iowa (D) ni saqlovchi 6 kunlik erkaklarning MAG laridagi MAG o'rtasidagi MC epiteliya qatlami va MAG lumeni orqali ko'ndalang kesimlarning konfokal tasvirlari (o'ng chetdagi panellar). Kattalashtirilgan panellar 3 barobar kattalashtirishni ko'rsatadi. E-H. MAG ning markaziy qismidagi MC qatlamida GFP-MFAS floresansining umumiy % maydonini (E), integratsiyalashgan intensivlikni (maydon MC lardagi o'rtacha GFP floresans intensivligiga ko'paytirilgan) (F), GFP-MFAS bilan belgilangan alohida MC kompartmentlari/punktalarining o'rtacha % maydonini (G) va MAG lumenida GFP-MFAS floresansining o'rtacha intensivligini (H) ko'rsatuvchi ustunli diagrammalar. E'tibor bering, SK ga xos Aβ-wt va Aβ-Iowa ekspressiyasi MC lar ichida kattaroq GFP-MFASni o'z ichiga olgan tuzilmalarni keltirib chiqaradi, bunda Aβ-Iowa shuningdek MC lar ichidagi GFP-MFASni o'z ichiga olgan umumiy maydonni va integratsiyalashgan intensivlikni sezilarli darajada oshiradi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f2.jpg\" alt=\"2-rasm. Aβ-Iowa tomonidan induktsiya qilingan MC lar tomonidan GFP-MFAS ni qamrab olishi SK lardagi sekretsiyani qo'zg'a\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm. Aβ-Iowa tomonidan induktsiya qilingan MC lar tomonidan GFP-MFAS ni qamrab olishi SK lardagi sekretsiyani qo'zg'atuvchi BMP signalizatsiyasiga bog'liq. A, B. Dad ortiqcha ekspressiyasi mavjud bo'lgan (B) yoki bo'lmagan (A) sharoitda SK lar Aβ-Iowa ni ekspressiya qiladigan bezlarning MC qatlamida va MAG lumenida GFP-MFAS to'planishini ko'rsatuvchi konfokal tasvirlar. Dad ekspressiya qilinganda sekretsiya va MC GFP-MFAS ning sezilarli darajada kamayishiga e'tibor bering. C-F. MAG ning markaziy qismidagi MC qatlamida GFP-MFAS floresansining umumiy % maydonini (C), MC floresansining integratsiyalashgan intensivligini (D), GFP-MFAS bilan belgilangan alohida MC kompartmentlarining o'rtacha % maydonini (E) va MAG lumenida GFP-MFAS floresansining o'rtacha intensivligini (F) ko'rsatuvchi ustunli diagrammalar.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f3.jpg\" alt=\"3-rasm. SK tomonidan ekspressiya qilingan Aβ-wt va Aβ-Iowa DCGlarga lokalizatsiyalanadi. A-C. Yovvoyi turdagi MAG larnin\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm. SK tomonidan ekspressiya qilingan Aβ-wt va Aβ-Iowa DCGlarga lokalizatsiyalanadi. A-C. Yovvoyi turdagi MAG larning distal qismlarining (A) hamda GFP-mfas gen qopqonini olib yuruvchi va SK larda Aβ-wt (B) yoki Aβ-Iowa (C) ni ekspressiya qiluvchi MAG larning konfokal tasvirlari, ular inson Aβ epitopi bilan kesishib reaksiyaga kirishadigan antitel bilan immunoboyalangan. E'tibor bering, odatda Aβ bo'yalishi deyarli barcha SK DCG kompartmentlarida kuzatiladi va GFP-MFAS bilan belgilangan DCG lar bilan ustma-ust tushadi (oq o'qlar), garchi floresans darajasi GFP ga qaraganda o'zgaruvchanroq bo'lsa ham. Anti-Aβ antitelasi shuningdek, Aβ ekspressiya qilmaydigan MAG larda ham periferik mushak qatlamidagi tuzilmalar bilan asossiz ravishda kesishib reaksiyaga kirishadi (qizil o'q). Misol uchun SKlar oq punktirli doira bilan belgilangan. Oq kvadratlar kattalashtirilgan hududlarning o'rnini belgilaydi. Masshtab chiziqlari: yuqori kattalashtirish ko'rinishlari uchun 30 µm, 10 µm va 5 µm (mos ravishda 3 marta va 6 marta kattalashtirish).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f4.jpg\" alt=\"4-rasm. SK Rab11-ekzosomalari ham MC lar tomonidan endositoz qilinadi. A, B. GFP-mfas gen qopqonini olib yuruvchi va SK \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm. SK Rab11-ekzosomalari ham MC lar tomonidan endositoz qilinadi. A, B. GFP-mfas gen qopqonini olib yuruvchi va SK larda CD63-mCherry ni boshqa transgensiz (A) yoki Aβ-wt bilan birga (B) ekspressiya qiluvchi erkaklarning MAG lari markaziy hududlarining konfokal tasvirlari. E'tibor bering, CD63-mCherry ikkala sharoitda ham MC lar tomonidan endositoz qilinadi va uning katta qismi GFP-MFAS bilan birga lokalizatsiyalanadi (o'qlar) yoki yaqin atrofda joylashgan. GFP-MFAS signali SKlar Aβ-wt ni ekspressiya qilganda ko'proq tarqoq bo'ladi (shuningdek, 1 va S1D-F rasmlarga qarang) va bu CD63-mCherry taqsimotida aks etadi, bu kattaroq endolizosomalarda lokalizatsiya bilan mos keladi. Oq kvadratlar kattalashtirilgan hududlarning o'rnini belgilaydi. Masshtab chiziqlari: yuqori kattalashtirish (kattalashtirilgan) ko'rinishlari uchun 30 µm va 10 µm.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f5.jpg\" alt=\"5-rasm. SK ga xos Chmp5 nokdauni Aβ tufayli kelib chiqqan GFP-MFASning MC larga kirishini kuchli ravishda bostiradi. A, \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm. SK ga xos Chmp5 nokdauni Aβ tufayli kelib chiqqan GFP-MFASning MC larga kirishini kuchli ravishda bostiradi. A, B, G, H, M, N. GFP-mfas gen qopqonini olib yuruvchi va SK larda turli xil nokdaun konstruksiyalarini, shuningdek Aβ-wt (G, H) va Aβ-Iowa (M, N) konstruksiyalarini ekspressiya qiluvchi erkaklarning MAG lari markaziy hududlarining konfokal tasvirlari. Aβ ekspressiyasi bo'lmaganda, SK ga xos Chmp5 nokdauni mCherry nokdaun nazoratiga (A) nisbatan MC lardagi GFP-MFAS darajasini pasaytiradi (B). MC lardagi GFP-MFAS darajalari, shuningdek, SK lar Aβ-wt (G, H) yoki Aβ-Iowa (M, N) ni ekspressiya qiladigan MAG larda mCherry nokdaun nazoratiga nisbatan Chmp5 nokdauni tomonidan kamaytiriladi. C-F, I-L, O-R. SK lar Aβ (C-F), Aβ-wt (I-L) yoki Aβ-Iowa (O-R) ni ekspressiya qilmaydigan genotiplarda Chmp5 nokdauni keltirib chiqaradigan GFP-MFAS ning MC larga o'tishini bostirishini miqdoriy jihatdan ko'rsatuvchi ustunli diagrammalar. Chmp5 nokdaunidan so'ng MAG ning markaziy qismidagi MC qatlamida GFP-MFAS floresansining umumiy % maydonini (C, I, O), integratsiyalashgan zichlikni (maydon MC lardagi o'rtacha GFP floresans intensivligiga ko'paytirilgan) (D, J, P) va GFP-MFAS bilan belgilangan alohida MC kompartmentlarining o'rtacha % maydonini (E, K, Q) o'lchaydigan tahlillar yordamida barcha genotiplar uchun sezilarli darajada kamayish kuzatiladi. Chmp5 nokdauni, shuningdek, SK lar Aβ ekspressiya qilmaydigan MAG larda GFP-MFAS sekretsiyasini (MAG lumenida GFP-MFAS floresansining o'rtacha intensivligini) kamaytiradi (F), lekin Aβ-wt ekspressiya qilinganda hech qanday ta'sir ko'rsatmaydi va Aβ-Iowa mavjud bo'lganda sekretsiyani oshiradiganga o'xshaydi. Oq kvadratlar kattalashtirilgan hududlarning o'rnini belgilaydi. Masshtab chiziqlari: yuqori kattalashtirish (kattalashtirilgan) ko'rinishlari uchun 30 µm va 10 µm.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f6.jpg\" alt=\"6-rasm. SC-ga xos Chmp5 nokdauni DCG kompartmentlari biologiyasi va sifat nazoratiga faqat mo'tadil ta'sir ko'rsatadi A-\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm. SC-ga xos Chmp5 nokdauni DCG kompartmentlari biologiyasi va sifat nazoratiga faqat mo'tadil ta'sir ko'rsatadi A-F. Yagona SC ning ex vivo keng maydonli flüoresan tasvirlari (shtrixli doira bilan belgilangan).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f7.jpg\" alt=\"7-rasm. Inson Aβ-wt va Aβ-Iowa ekspressiyasi Drosophila ko'zida omatidial muntazamlikning miqdoriy baholanishi mumkin bo\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-rasm. Inson Aβ-wt va Aβ-Iowa ekspressiyasi Drosophila ko'zida omatidial muntazamlikning miqdoriy baholanishi mumkin bo'lgan buzilishini keltirib chiqaradi A-D. Boshqa transgen bo'lmagan (A), UAS-lacZ (B), UAS-Aβ-wt (C) va UAS-Aβ-Iowa (D) mavjudligida uchinchi xromosomal GMR-GAL4 (III) insertiga ega bo'lgan 2-4 kunlik urg'ochi ko'zlarining stereomikroskopik tasvirlari. E. Nazorat GMR-GAL4 (III) mos yozuvlar egri chizig'iga nisbatan ushbu genotiplardagi ko'zlar uchun muntazamlik ballini (Fisher Z o'zgarishi sifatida) aks ettiruvchi gistogramma. F-I. Boshqa transgen bo'lmagan (F), UAS-lacZ (G), UAS-Aβ-wt (H) va UAS-Aβ-Iowa (I) mavjudligida ikkinchi xromosomal GMR-GAL4 (II) insertiga ega bo'lgan 2-4 kunlik urg'ochi ko'zlarining stereomikroskopik tasvirlari. J. Nazorat GMR-GAL4 (II) mos yozuvlar egri chizig'iga nisbatan ushbu genotiplardagi ko'zlar uchun muntazamlik ballini (Fisher Z o'zgarishi sifatida) aks ettiruvchi gistogramma. Masshtab paneli: 100 µm, barcha tasvirlarga taalluqli.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f8.jpg\" alt=\"8-rasm. Chmp5 nokdauni ko'zda Aβ-wt keltirib chiqaradigan tartibsizlikni bostiradi A-C. UAS-Aβ-wt mavjudligida va boshqa\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-rasm. Chmp5 nokdauni ko'zda Aβ-wt keltirib chiqaradigan tartibsizlikni bostiradi A-C. UAS-Aβ-wt mavjudligida va boshqa transgen (A), UAS-mCherry-RNAi (B) yoki UAS-Chmp5-RNAi (C) ni ko-ekspressiya qilmaydigan uchinchi xromosomal GMR-GAL4 (III) insertiga ega bo'lgan 2-4 kunlik urg'ochi ko'zlarining stereomikroskopik tasvirlari. D. Nazorat GMR-GAL4 (III) mos yozuvlar egri chizig'iga nisbatan ushbu genotiplardagi ko'zlar uchun muntazamlik ballini (Fisher Z o'zgarishi sifatida) aks ettiruvchi gistogramma. Chmp5 nokdauni orqali tartibsizlikning ikkala nazoratga nisbatan qisman tiklanishiga e'tibor bering. E-G.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f9.jpg\" alt=\"9-rasm. Boshqa yordamchi ESCRT-III genlarining nokdauni ko'zda Aβ-wt va Aβ-Iowa keltirib chiqaradigan tartibsizlikni bos\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;9-rasm. Boshqa yordamchi ESCRT-III genlarining nokdauni ko'zda Aβ-wt va Aβ-Iowa keltirib chiqaradigan tartibsizlikni bostiradi A-C. UAS-Aβ-wt mavjudligida va UAS-mCherry-RNAi (A), yoki UAS-Chmp1-RNAi (B), yoki UAS-Ist1-RNAi (C) ni ko-ekspressiya qiluvchi uchinchi xromosomal GMR-GAL4 (III) insertiga ega bo'lgan 2-4 kunlik urg'ochi ko'zlarining stereomikroskopik tasvirlari. D. Nazorat GMR-GAL4 (III) mos yozuvlar egri chizig'iga nisbatan ushbu genotiplardagi ko'zlar uchun muntazamlik ballini (Fisher Z o'zgarishi sifatida) aks ettiruvchi gistogramma. Chmp1 va Ist1 nokdauni orqali nazoratga nisbatan tartibsizlikning qisman tiklanishiga e'tibor bering. E-G. UAS-Aβ-Iowa mavjudligida va UAS-mCherry-RNAi (E), yoki UAS-Chmp1-RNAi (F), yoki UAS-Ist1-RNAi ni ko-ekspressiya qiluvchi ikkinchi xromosomal GMR-GAL4 (II) insertiga ega bo'lgan 2-4 kunlik urg'ochi ko'zlarining stereomikroskopik tasvirlari. H. Nazorat GMR-GAL4 (II) mos yozuvlar egri chizig'iga nisbatan ushbu genotiplardagi ko'zlar uchun muntazamlik ballini (Fisher Z o'zgarishi sifatida) aks ettiruvchi gistogramma. Chmp1 va Ist1 nokdauni orqali RNK ekspressiya qiluvchi nazoratga nisbatan tartibsizlikning qisman tiklanishiga e'tibor bering. Masshtab paneli: 100 µm.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f10.jpg\" alt=\"10-rasm. Aβ keltirib chiqaradigan endolizosomal trafig nuqsonlarining hujayralararo tarqalishida Rab11-ekzosomalarining \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;10-rasm. Aβ keltirib chiqaradigan endolizosomal trafig nuqsonlarining hujayralararo tarqalishida Rab11-ekzosomalarining rolini tushuntirish uchun taklif etilgan model. Sxemada sog'lom hujayralardagi (A) va Aβ ekspressiya qiluvchi, normal (B) yoki kamaygan (C) darajadagi Rab11-ekzosomalarini hosil qiluvchi hujayralardagi tartibga solinadigan sekretor jarayon ko'rsatilgan. Tartibga solinadigan sekretsiya DCG biogenezini (① va ②), Rab11-musbat retsirkulyatsiyalovchi endosomalar identligiga va APP protsessingiga kompartmental o'tishni talab qiluvchi jarayonni, undan so'ng sifat nazorati (③) va sekretsiyani o'z ichiga oladi. Sog'lom hujayralarda (A) DCG kompartmentlarining faqat kichik qismi lizosomal degradatsiyaga yo'naltiriladi, bu esa Aβ ning minimal to'planishiga olib keladi. Agar Aβ to'plana boshlasa (B), bu DCG biogenezini buzadi, membrana:agregat o'zaro ta'sirlari dissotsiatsiyasining kamayishiga (masalan, APP orqali; qizil ②) va ushbu kompartmentlarning lizosomalarga o'sgan, ammo aberrant yo'naltirilishiga (qizil ③) olib keladi. Ushbu kompartmentlarning aksariyati hali ham sekretsiya qilinadiganga o'xshaydi (qizil ④). Nuqsonli sekretor material boshqa hujayralar (shuningdek, sekretsiya qiluvchi hujayralarning o'zlari (ko'rsatilmagan)) tomonidan g'ayritabiiy ravishda endotsitoz qilinadi va kattalashgan endolizosomalarda to'planib, trafig nuqsonini tarqatadi (qizil ⑤). Bu va sekretsiya qiluvchi hujayralardagi endolizosomal trafig nuqsonlari oxir-oqibat SC-larda (Singh et al., 2025) va keng xabar qilinganidek (Kimura and Yanagisawa, 2018), neyronlarda degeneratsiyani keltirib chiqaradi. Biz inson va Drosophila hujayralarida Rab11-ekzosomalari biogenezini tanlab inhibe qiluvchi SC-lardagi Chmp5 nokdauni (Marie et al., 2023) Aβ ekspressiya qiluvchi hujayralarga sezilarli ta'sir ko'rsatmasligini aniqladik. Biroq, u endolizosomal nuqsonlarning fenotipik tarqalishini, ehtimol, sekretor hujayralardagi agregatlarning umumiy tarkibiga va/yoki ularning vazikulalar bilan o'zaro ta'siriga ta'sir qilish orqali, yoki sekretsiyadan keyin (bu yerda ko'rsatilgandek), yoki sekretor material boshqa hujayralar tomonidan endotsitoz qilinganda bostiradi. Ushbu genetik manipulyatsiya, shuningdek, pashsha ko'zida Aβ keltirib chiqaradigan neyrodegeneratsiyani kamaytirish uchun yetarli bo'lib, bu Aβ bilan bog'liq BA patologiyasida Rab11-ekzosomalarining rolini ko'rsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-fS1.jpg\" alt=\"1-rasm. SC larda Aβ ekspressiyasi MC endolizosomalarida nuqsonlarni keltirib chiqaradi (1-rasm bilan bog'liq)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. SC larda Aβ ekspressiyasi MC endolizosomalarida nuqsonlarni keltirib chiqaradi (1-rasm bilan bog'liq)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-fS2.jpg\" alt=\"2-rasm. SC da ifodalangan odam Aβ izoformalari MAG epiteliy hujayralarida endolizosomal nuqsonlarni keltirib chiqaradi (\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm. SC da ifodalangan odam Aβ izoformalari MAG epiteliy hujayralarida endolizosomal nuqsonlarni keltirib chiqaradi (1-rasm bilan bog'liq)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-fS3.jpg\" alt=\"3-rasm. SC ga xos Chmp5 nokdauni MC lardagi GFP-MFAS saqlovchi endolizosomal kompartmentlarda ko'plab o'zgarishlarni kel\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm. SC ga xos Chmp5 nokdauni MC lardagi GFP-MFAS saqlovchi endolizosomal kompartmentlarda ko'plab o'zgarishlarni keltirib chiqarishi mumkin (5-rasm bilan bog'liq)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-fS6.jpg\" alt=\"S6-rasm. Koʻzda yordamchi ESCRT-III genlarining nokdauni odatda ommatidiyalar tartibliligiga ta'sir qilmaydi (8 va 9-ras\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S6-rasm. Koʻzda yordamchi ESCRT-III genlarining nokdauni odatda ommatidiyalar tartibliligiga ta'sir qilmaydi (8 va 9-rasmlarga tegishli)&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"jadvallar\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#jadvallar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Jadvallar&lt;/span&gt;&lt;/a&gt;Jadvallar&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 1.&lt;/strong&gt; Reagentlar va resurslar&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Reagent/Resurs&lt;/th&gt;\n&lt;th&gt;Manba yoki Havola&lt;/th&gt;\n&lt;th&gt;Identifikator yoki Katalog raqami&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Eksperimental model&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Drosophila&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;w1118&lt;/td&gt;\n&lt;td&gt;Partridge Lab: UCL&lt;/td&gt;\n&lt;td&gt;N/A&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;w1118;; GFP-mfasMI11275-GFSTF.2&lt;/td&gt;\n&lt;td&gt;BDSC&lt;/td&gt;\n&lt;td&gt;63204&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;w1118; if/CyO; dsx- GAL4/TM6B&lt;/td&gt;\n&lt;td&gt;Goodwin Lab, Oxford; Rideout et al., 2013&lt;/td&gt;\n&lt;td&gt;N/A&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;w1118; tub-GAL80ts; TM2/TM6B,Tb&lt;/td&gt;\n&lt;td&gt;BDSC&lt;/td&gt;\n&lt;td&gt;7108&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;w1118; tub-GAL80ts/CyO; dsx- GAL4/TM6B&lt;/td&gt;\n&lt;td&gt;Wilson Lab; Corrigan et al., 2014&lt;/td&gt;\n&lt;td&gt;N/A&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;y, w1118;; YFP-Rab11&lt;/td&gt;\n&lt;td&gt;Eaton Lab, Max Plank, Dresden (and BDSC); Dunst et al., 2015&lt;/td&gt;\n&lt;td&gt;62549&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;w1118; tub-GAL80ts/CyO; YFP- Rab11, dsx-GAL4&lt;/td&gt;\n&lt;td&gt;Wilson Lab; Redhai et al., 2016&lt;/td&gt;\n&lt;td&gt;N/A&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;td-GFP-mfas: w1118; tub-GAL80ts/CyO; dsx- GAL4, GFP-mfas/TM6B&lt;/td&gt;\n&lt;td&gt;Singh et al 2025&lt;/td&gt;\n&lt;td&gt;N/A&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Dtmfas-Aβ-wt w1118; tub-GAL80ts, UAS-Aβ- wt/CyO; dsx-GAL4, GFP- mfas/TM6B&lt;/td&gt;\n&lt;td&gt;This study&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;w; UAS-CD63-mCherry (15- 1M)&lt;/td&gt;\n&lt;td&gt;Fan et al., 2020&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;UAS-Chmp1-RNAi&lt;/td&gt;\n&lt;td&gt;VDRC; Dietzl et al., 2007; Marie et al., 2023&lt;/td&gt;\n&lt;td&gt;GD 21788&lt;/
