            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"243\" cy=\"117\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"577\" cy=\"166\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Altsgeymer kasalligida&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;hujayralararo zanjirli&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;shikastlanish mexanizmi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f1.jpg\" alt=\"1-rasm. SK tomonidan ekspressiya qilinadigan odam Aβ MAG markazidagi epiteliya hujayralarida endolizosomal nuqsonlarni k\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. SK tomonidan ekspressiya qilinadigan odam Aβ MAG markazidagi epiteliya hujayralarida endolizosomal nuqsonlarni keltirib chiqaradi. A. Eksperimental strategiyani ko'rsatuvchi sxema. SKlar faqat MAG ning distal uchida joylashgan, ammo GFP-MFAS va DCG kompartmentlarining boshqa tarkibiy qismlarini bezi lumeniga sekretsiya qiladi, u yerdan ular MC lar tomonidan endositoz qilinishi mumkin. B-D. GFP-mfas gen qopqonini ekspressiya qiluvchi va SK larda maxsus ravishda boshqa transgensiz (B) yoki UAS bilan tartibga solinadigan Aβ-wt (C) yoki Aβ-Iowa (D) ni saqlovchi 6 kunlik erkaklarning MAG laridagi MAG o'rtasidagi MC epiteliya qatlami va MAG lumeni orqali ko'ndalang kesimlarning konfokal tasvirlari (o'ng chetdagi panellar). Kattalashtirilgan panellar 3 barobar kattalashtirishni ko'rsatadi. E-H. MAG ning markaziy qismidagi MC qatlamida GFP-MFAS floresansining umumiy % maydonini (E), integratsiyalashgan intensivlikni (maydon MC lardagi o'rtacha GFP floresans intensivligiga ko'paytirilgan) (F), GFP-MFAS bilan belgilangan alohida MC kompartmentlari/punktalarining o'rtacha % maydonini (G) va MAG lumenida GFP-MFAS floresansining o'rtacha intensivligini (H) ko'rsatuvchi ustunli diagrammalar. E'tibor bering, SK ga xos Aβ-wt va Aβ-Iowa ekspressiyasi MC lar ichida kattaroq GFP-MFASni o'z ichiga olgan tuzilmalarni keltirib chiqaradi, bunda Aβ-Iowa shuningdek MC lar ichidagi GFP-MFASni o'z ichiga olgan umumiy maydonni va integratsiyalashgan intensivlikni sezilarli darajada oshiradi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Altsgeymer kasalligida miyada amiloid plitalari yig'ilsa-da, dastlabki buzilishlar hujayra ichida boshlanadi. Tadqiqotchilar toksik signallar maxsus ekzosomalar orqali qo'shni hujayralarga o'tishini aniqladi. Ushbu jarayonda ishtirok etuvchi oqsil faolligi bloklanganda, vayronagarchilik zanjiri to'xtadi. Bu kasallikning tarqalish yo'llarini boshqacha tushunish imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Beta-amiloid hujayra transportini buzadi va qo'shni hujayralarga uzatiladi.&lt;/li&gt;\n&lt;li&gt;Chmp5 oqsili va ESCRT-III kompleksi toksik pufakchalar chiqishini boshqaradi.&lt;/li&gt;\n&lt;li&gt;Rab11-ekzosomalar yo'lini to'xtatish neyrodegeneratsiyaning oldini oladi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Altsgeymer kasalligi asosan beta-amiloid plastinkalari va neyrofibrillyar tutamlar bilan tavsiflanadi. Biroq neyronlar o'lishidan oldin molekulyar transport uchun mas'ul bo'lgan endolizosomal tizim shikastlanadi. Drosophila pashshalarining ikkilamchi hujayralarida o'tkazilgan avvalgi tajribalar beta-amiloid oqsil agregatsiyasini buzib, qo'shni hujayralarga o'tuvchi nuqsonlarni keltirib chiqarishini ko'rsatgan edi.&lt;/p&gt;\n&lt;p&gt;Yangi ishda mualliflar ESCRT kompleksining oqsillari ushbu jarayonda qanday rol o'ynashini tekshirdi. Ma'lum bo'lishicha, ESCRT-III yordamchi oqsili bo'lgan Chmp5 genining faolligi pasaytirilganda, endolizosomal nuqsonlarning tarqalishi to'xtaydi. Bu oqsil Rab11-ekzosomalar orqali tashiladigan pufakchalar hosil bo'lishini boshqaradi.&lt;/p&gt;\n&lt;p&gt;Bundan tashqari, Chmp5 yoki boshqa ESCRT-III genlarining faolligini pasaytirish drosophila ko'zidagi neyrodegenerativ o'zgarishlarni ham oldini oladi. Natijalar Rab11-ekzosoma biogenezi yo'li amiloid patologiyasini hujayra o'limi bilan bog'lashini ko'rsatib, kelgusida davolash usullarini yaratish uchun yangi nishonni taklif qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot faqat drosophila modeli asosida bajarilgan bo'lib, natijalarni sutemizuvchilarda tekshirish lozim.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Altsgeymer kasalligi (AK) ikkita gistopatologik belgi bilan tavsiflanadi: hujayra ichidagi tau oqsili bo'lgan neyrofibrilyar yumhoqlar va hujayradan tashqari amiloid plitalari, ular tarkibida Amyloid Precursor Protein (APP) ning o'ziga xos parchalanish mahsuloti bo'lgan β-amiloid (Aβ) mavjud. Biroq, Aβ keltirib chiqaradigan neyronal patologiyaning boshlanishi hujayralararo tarqalishi mumkin bo'lgan endolizosomal trafigiga ta'sir qiluvchi hujayra ichidagi jarayonlarni o'z ichiga olishi taxmin qilinadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Endolizosomal trafig — bu molekulalarni endosomalar va lizosomalar orasida tashuvchi hamda qayta ishlovchi hujayra ichidagi transport tizimi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Neyron bo'lmagan Drosophila ikkilamchi hujayralarida (SC) o'tkazilgan so'nggi tadqiqotlar shuni ko'rsatdiki, Aβ APP tomonidan tartibga solinadigan oqsil agregatsiyasi jarayonlariga aralashadi; bu jarayonlar normal tartibga solinadigan sekresiya paytida signal molekulalarini erimaydigan zich yadroviy granulalarga (DCG) qadoqlaydi va boshqa hujayralarga o'tadigan endolizosomal nuqsonlarni keltirib chiqaradi.&lt;/p&gt;\n&lt;p&gt;Bu yerda SC dan foydalangan holda, biz yordamchi ESCRT-III oqsili Chmp5 ni kodlovchi turni o'chirish (nokaut qilish) SC DCG компартментлари ichida keyinchalik Rab11-ekzosomalar sifatida chiqariladigan intraluminal pufakchalar (ILV) hosil bo'lishini tanlab tartibga solishini va Aβ keltirib chiqaradigan endolizosomal trafig nuqsonlarining tarqalishini inhib qilishini ko'rsatamiz.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ushbu tadqiqot model organizmlarda (Drosophila) amalga oshirilganligi sababli, insonlarda bu mexanizmlarning rolini tasdiqlash uchun qo'shimcha klinik tadqiqotlar talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bundan tashqari, Chmp5 yoki boshqa yordamchi ESCRT-III genlarini nokaut qilish Drosophila ko'zida Aβ keltirib chiqaradigan, neyrodegeneratsiyaga bog'liq bo'lgan morfologik nuqsonlarni ham bostiradi.&lt;/p&gt;\n&lt;p&gt;Biz shunday xulosaga keldikki, Rab11-ekzosoma biogenezi yo'lini boshqaruvchi genlar Aβ keltirib chiqaradigan va noto'g'ri tartibga solinadigan sekresiya bilan bog'liq endolizosomal trafig nuqsonlarida ham, neyrodegeneratsiyaga olib keladigan hujayra jarayonlarida ham asosiy rol o'ynaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Chmp5 genining faolligini pasaytirish Aβ keltirib chiqaradigan endolizosomal nuqsonlarning tarqalishini to'xtatadi va neyrodegenerativ o'zgarishlarni kamaytiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bizning natijalarimiz shuni ko'rsatadiki, bu jarayonlar o'zaro bog'langan bo'lib, kelajakda AK terapiyasini ishlab chiqish uchun yangi nishon yo'llarni taklif qilishi mumkin.&lt;/p&gt;\n&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Altsgeymer kasalligi (AK) butun dunyo bo'ylab demensiyaning asosiy sababi bo'lib, 2050 yilga borib 100 milliondan ortiq odamga ta'sir qilishi taxmin qilinmoqda. Giperfosforillangan tau-oqsilini o'z ichiga olgan hujayra ichidagi neyrofibrillyar tutamlar va Aβ-peptidlardan, Amiloid O'tmishdosh Oqsilining (APP) o'ziga xos parchalanish mahsulotlaridan iborat hujayra tashqi amiloid plitalari AK ning asosiy gistopatologik belgilaridir. Shunga qaramay, degeneratsiyani qo'zg'atuvchi hujayraviy-biologik omillar bo'yicha hali ham sezilarli munozaralar mavjud.&lt;/p&gt;\n&lt;p&gt;Jozibali modellardan biri, «yo'l tirbandligi gipotezasi», endosomal va lizosomal tizim bo'ylab transportdagi nuqsonlar parchalanmaydigan Aβ ni o'z ichiga olgan hujayra ichidagi bo'linmalarning to'planishiga olib kelishini taxmin qiladi. Ushbu endolizosomal fenotip boshqa hujayralarga tarqalishi mumkin va sinaptik transport, tuzilish va yaxlitlikni buzishda boshlang'ich qadamdir.&lt;/p&gt;\n&lt;p&gt;Neyrofibrillyar tutamlar bilan bog'langan giperfosforillangan tau-oqsil endolizosoma vositachiligidagi mexanizmlar orqali Aβ va patologik Aβ-oligomerlari bilan o'zaro ta'sir qiladi, bu tau va Aβ kasallikda qanday funksional bog'langanligini tushuntirish uchun bitta potentsial izoh beradi. Biroq, yaqingacha AK bilan bog'liq endolizosomal nuqsonlar normal APP jarayoniga jalb qilingan maxsus transport jarayonining buzilishini aks ettirishi mumkinmi degan savol hal etilmagan edi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Drosophila ikkilamchi hujayralaridagi APP funksiyalarini o'rganish tartibga solinadigan sekretsiyadagi yetilish va sifat nazorati jarayonlarini birinchi marta vizualizatsiya qilishga yordam berdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tartibga solinadigan sekretsiya — bu hujayralar sekretsiya qilinadigan moddalarni maxsus granumalarda to'plab, muayyan signallarga javoban chiqarib yuboradigan jarayon.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz yaqinda erkak qo'shimcha bezining (MAG) prostata-o'xshash hujayralari bo'lgan Drosophila ikkilamchi hujayralarida (IH) APP funksiyalarini o'rganib chiqdik, ular juda kattalashgan sekretor va lizosomal bo'linmalarni o'z ichiga oladi. Ushbu hujayralarda tartibga solinadigan sekretsiyada yetilish va sifat nazorati bosqichlari bilan birga keladigan bo'linmalar ichidagi dinamik hodisalar birinchi marta vizualizatsiya qilindi. Oliy organizmlarning hujayralarida sekretsiyaga mo'ljallangan oqsillar tartibga solinadigan sekretor bo'linmalar ichida zich yadroli granulalarga (DCG) yig'iladi. Bular faqat bo'linmalar plazmatik membrana bilan qo'shilganda yoki nuqsonli bo'linmalar krinofagiya deb ataladigan jarayonlarda lizosomal parchalanishga yo'naltirilganda tarqaladi. IH larda Drosophila ning transmembran APP ortologi bo'lgan APPL normal DCG oqsillarining agregatsiyasini rag'batlantirish uchun talab qilinadi. Keyinchalik u DCG agregatlarini bo'linmaning chegaralovchi membranasidan ajratish uchun Aβ hosil bo'lishi uchun zarur bo'lgan birinchi parchalanishni amalga oshiradigan β-sekretaza tomonidan parchalanishi kerak. APPL ning tartibga solinadigan sekretsiyadagi funksiyalari inson APP bilan almashtirilishi mumkin, bu jarayonda evolyutsion saqlanib qolgan rolni ko'rsatadi.&lt;/p&gt;\n&lt;p&gt;IH larning sekretor yo'lida yovvoyi turdagi Aβ yoki erta boshlanadigan oilaviy AK bilan bog'liq Aβ ning amilogen mutant shakllari iflanganda, APP jarayoni buziladi, DCG lar odatdagidek shakllanmaydi va ko'proq bo'linmalar lizosomal parchalanishga yo'naltiriladi. Biroq, bu nishonga olish abberant bo'lib, qisman parchalangan bo'linmalar IH larda to'planadi va endolizosomal transport nuqsonini keltirib chiqaradi. Qolaversa, ushbu g'ayritabiiy bo'linmalarning tarkibi sekretsiya qilinib, ularni endotsitoz qiluvchi boshqa Aβ ni ifodalamaydigan qo'shni hujayralarning endolizosomalari ichida to'planadi va endolizosomal fenotipni tarqatadi. Ushbu topilmalar AK da Aβ-indutsirlangan endolizosomal patologiyalar abberant tartibga solinadigan sekretsiyadan kelib chiqishi mumkinligini ko'rsatadi, bu insonning AK bilan bog'liq genlarini in silico tahlili bilan tasdiqlanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Endolizosomal nuqsonlarning tarqalishi haqidagi ko'rsatkichlarning aksariyati Drosophila modellaridan olingan bo'lib, bu inson Altsgeymer kasalligi patogeneziga to'g'ridan-to'g'ri ekstrapolyatsiya qilishda ehtiyotkorlikni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tartibga solinadigan sekretor bo'linmalarning yetilishi trans-Golji tarmog'idan (TGN) paydo bo'ladigan bo'linmalarning qayta ishlovchi endosomal o'ziga xosligiga o'tishini talab qiladi, buni qayta ishlovchi endosomal marker Rab11 ning bosqichma-bosqich egallanishi orqali kuzatish mumkin. IH lardagi tartibga solinadigan sekretor bo'linmalar intraluminal pufakchalarni (ILV) hosil qiladi, bu jarayon inson DCG bo'linmalarida ham saqlanib qolganga o'xshaydi, va bu pufakchalar ixtisoslashgan Rab11-ekzosomalar sifatida sekretsiya qilinadi.&lt;/p&gt;\n&lt;p&gt;Oldingi tadqiqotlar APPL ning ushbu ILV larga tashilishini va ILV biogenezini tartibga soluvchi to'rtta Transport uchun zarur bo'lgan endosomal saralash majmuasi (ESCRT) komplekslarining o'ziga xos komponentlarini kodlovchi genlarni nokdoun qilish IH larda DCG shakllanishini buzishini ko'rsatgan.&lt;/p&gt;\n&lt;p&gt;Qolaversa, Aβ va uning oligomerlarining neyronlardan boshqa hujayralarga, shu jumladan boshqa neyronlarga o'tishi ekzosomalarni o'z ichiga olganga o'xshaydi.&lt;/p&gt;\n&lt;p&gt;Shuning uchun biz Rab11-ekzosomalar hujayralar orasida Aβ-indutsirlangan endolizosomal transport nuqsonlarini tarqatishda ishtirok etishi mumkinligini taxmin qildik.&lt;/p&gt;\n&lt;p&gt;Bu yerda biz Aβ ni ifodalovchi IH lar tomonidan indutsirlangan endolizosomal nuqsonlar MAG ning epitelial hujayralari bo'ylab tarqalishini ko'rsatamiz. Rab11-ekzosoma hosil bo'lishini tanlab tartibga soluvchi yordamchi ESCRT-III oqsilini kodlovchi Chmp5 ning nokdouni bu tarqalishni kuchli bostiradi. Chmp5 va boshqa yordamchi ESCRT-III genlarining nokdouni pashsha ko'zida Aβ ekspresiyasi tufayli kelib chiqqan neyrodegeneratsiya bilan bog'liq morfologik nuqsonlarni ham bostiradi. Shuning uchun bizning topilmalarimiz Aβ-indutsirlangan tartibga solinadigan sekretsiyaning buzilishi tufayli yuzaga kelgan endolizosomal transportdagi nuqsonlar AK bilan bog'liq degeneratsiyada muhim rol o'ynashi mumkinligini va ularni Rab11-ekzosoma biogenez apparatini inhib qilish orqali yumshatish mumkinligini ko'rsatadi.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"sekretor-hujayralar-tomonidan-ekspressiya-qilinadigan-odam-ab-oqsili-mag-boylab-epiteliy-hujayralarida-endolizosomal-nuqsonlarni-keltirib-chiqaradi\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#sekretor-hujayralar-tomonidan-ekspressiya-qilinadigan-odam-ab-oqsili-mag-boylab-epiteliy-hujayralarida-endolizosomal-nuqsonlarni-keltirib-chiqaradi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sekretor hujayralar tomonidan ekspressiya qilinadigan odam Aβ oqsili MAG bo'ylab epiteliy hujayralarida endolizosomal nuqsonlarni keltirib chiqaradi&lt;/span&gt;&lt;/a&gt;Sekretor hujayralar tomonidan ekspressiya qilinadigan odam Aβ oqsili MAG bo'ylab epiteliy hujayralarida endolizosomal nuqsonlarni keltirib chiqaradi&lt;/h4&gt;\n&lt;p&gt;Avvalroq biz sutemizuvchilarning hujayradan tashqari matritsa oqsili TGF-\beta-induced (TGFBI) ning pashsha ortologi bo'lgan MFAS DCG oqsilining GFP bilan nishonlangan shakli, endogen gen lokusidan ekspressiya qilinganda, SC larda selektiv ravishda yuqori darajada ishlab chiqarilishi va SC DCG lariga o'ralishini ko'rsatgan edik (Singh et al., 2025). Ikki bo'lakli MAG ning har bir bo'lagining distal uchidagi taxminan 40 ta SC da Aβ ekspressiya qilinganda, ajratilgan GFP-MFAS ning qo'shni asosiy hujayralarga (MC) so'rilishi kuchayadi va GFP LysoTracker Red bilan bo'yaladigan kattalashgan endolizosomal kompartmentlarda to'planadi (Singh et al., 2025). Bu shuni ko'rsatadiki, ushbu kompartmentlar endotsitoz qilingan DCG oqsillarini odatdagidek parchalay olmaydi va GFP floresansini to'liq so'ndira olmaydigan yuqoriroq lyuminal pH ga ega.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;LysoTracker Red lizosomal bo'yog'i va GFP oqsil metkalari organellalar molekulalarni parchalash qobiliyatini yo'qotganda hujayra ichidagi kislotali muhit nuqsonlarini kuzatishga yordam beradi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Aβ keltirib chiqaradigan MC endolizosomal nuqsonlarining dastlabki tahlili bevosita SC larga yondosh hujayralar bilan cheklangan edi. Ushbu MC lar uchun SC lar tomonidan chiqarilgan endotsitoz qilingan GFP-MFAS MAG lümeniga sekretsiya qilingan yoki lateral membranalar bo'ylab hujayralar orasida o'tkazilgan bo'lishi mumkin edi. Lyuminal GFP-MFAS tarqalish fenotipiga mas'ul ekanligini tasdiqlash uchun biz MAG bo'ylab epiteliy hujayralari tomonidan GFP-MFAS ning o'zlashtirilishini o'rgandik. Yetuk erkak pashshalar yaratildiki, ularda kattalar SC lari yovvoyi turdagi Aβ (Aβ-wt) yoki amiloidogen Aβ-Iowa mutantini (Grabowski et al., 2001) sekresiya yo'liga yo'naltirish uchun tozalanadigan N-uchidagi ER signal ketma-ketligi bilan birlashtirilgan holda ekspressiya qilgan (Chouhan et al., 2016; Metsla et al., 2022; Singh et al., 2025). MAG ning SC lari ichida faqat kattalarda ekspressiyaga haroratga sezgir GAL4 ingibitorining (GAL80ts) mavjudligida UAS tomonidan tartibga solinadigan transgenlarni dsx-GAL4 orqali faollashtirish va pashsha chiqqanda 25oC dan 29oC ga o'tkazish orqali erishildi, bu GAL80ts ni beqarorlashtiradi (Fan et al., 2020).&lt;/p&gt;\n&lt;p&gt;Avval xabar qilinganidek (Singh et al., 2025), Aβ ekspressiyasi SC lardagi DCG biogenezi va endolizosomal trafigiga ta'sir qilib, qisman kislotalashgan kompartmentlar va lizosomalarning ko'p to'planishiga, Aβ-Iowa holatida эsa oqsillarning katta DCG ga tez-tez to'liq bo'lmagan agregatsiyasiga olib keldi (S1A-C-rasm). Ekstraviv preparat qilingan MAG larning markaziy qismidagi MC epiteliy qatlamini tahlil qilish (1A-rasm) SC larda Aβ izoformalarining ekspressiyasi MC kislotali kompartmentlarining hajmini oshirganini va ayniqsa Aβ-Iowa uchun ushbu kattalashgan kompartmentlar ichida ko'proq GFP-MFAS to'planishiga olib kelganini ko'rsatdi (S1D-F-rasm). Bu bizning MAG ning distal qismi uchun oldingi topilmalarimizni aks ettirdi va endolizosomal nuqsonlar butun bez bo'ylab tarqalishini ko'rsatdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Sekretor hujayralarda Aβ ekspressiyasi qo'shimcha jinsiy bezning butun uzunligi bo'ylab asosiy hujayralarda endolizosomal kompartmentlarning kengayishiga va GFP-MFAS ning to'planishiga olib keladi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu o'zgarishlarni odatiy miqdoriy baholashga ruxsat berish uchun biz GFP-MFAS ifodalovchi erkaklardan MAG larni ajratib oldik, yupqa yassi MC epiteliy qatlamini aniqlash uchun ularni DAPI bilan bo'yadik va konfokal mikroskopiya yordamida GFP taqsimotini tasvirga oldik (1A-rasm). Bu distal SC lar Aβ-wt va Aβ-Iowa ifodalaganda, ifodalamaydigan nazoratlarga nisbatan 6 kunlik erkaklarning MAG lari markaziy va proksimal hududlaridagi MC lar tomonidan GFP-MFAS ni ko'proq o'zlashtirganini ko'rsatdi (1B-D-rasm; S2A-C-rasm).&lt;/p&gt;\n&lt;p&gt;MAG ning o'rtasida joylashgan endotsitoz qilingan GFP-MFAS yadrolari bo'yicha aniqlangan epiteliy MC larining ko'ndalang kesimidagi GFP floresansini o'z ichiga olgan umumiy maydon foizi, integratsiyalashgan zichlik (% maydon x o'rtacha floresans signali intensivligi) va har bir hujayra ichidagi GFP-MFAS ni o'z ichiga olgan hudud uchun o'rtacha % maydonni o'lchash orqali miqdoriy baholandi. SC lar Aβ-Iowa ifodalaganda bularning uchtasi ham nazoratlarga nisbatan sezilarli darajada oshdi (1E-G-rasm). SC larda Aβ-wt ifodalangan MAG lar uchun ham har bir GFP-MFAS ni o'z ichiga olgan hududning o'rtacha % maydonida aniq o'sish kuzatildi (1G-rasm); ko'pchilik, ammo barcha bezlar uchun emas, floresansning umumiy % maydoni va integratsiyalashgan intensivligi ham o'rtacha nazorat qiymatlariga nisbatan oshgandek tuyuldi (1E va 1F-rasm), garchi katta o'zgaruvchanlik tufayli bu o'zgarishlarning hech biri ahamiyatlilikka erishmadi. Ikkala Aβ genotipi uchun ham, nazorat bilan solishtirganda, GFP ni o'z ichiga olgan MC tuzilmalari soni va o'rtacha floresan signali intensivligi o'zgarmagan yoki Aβ-Iowa holatida floresans intensivligi uchun biroz oshgan (S2D va S2E-rasm). Umuman olganda, ushbu topilmalar SC larda Aβ ekspressiyasi SC ning belgilangan DCG yuki GFP-MFAS ni to'playdigan MC endolizosomal kompartmentlarining kengayishini qo'zg'atishini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Natijalar model organizmlarda (Drosophila melanogaster) olingan bo'lib, mexanizmlarni odam patologiyasiga bevosita ko'chirish darajasi qo'shimcha tadqiqotlarni talab qiladi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;MAG lümenining markaziy qismi ham ushbu turli xil genetik fonlarda tasvirga olindi va sekretsiya qilingan GFP-MFAS floresans darajalari Singh va boshq. (2025) dan o'zgartirilgan protokol yordamida o'lchandi (1A-D va 1H-rasm). Aβ-wt va Aβ-Iowa uchun nazoratlarga qaraganda ko'proq o'zgaruvchan floresans darajalari kuzatildi; ba'zi bezlar biz avval xabar qilganimizdek (Singh va boshq., 2025) yuqori darajada GFP-MFAS saqlagan; biroq umumiy olganda, ushbu tahlil yordamida o'lchangandek sekretsiyaning sezilarli o'sishi kuzatilmadi (1H-rasm), bu MC lardagi endolizosomal o'zgarishlarning tushuntirishi sifatida yuqori sekretsiyani istisno qiladi.&lt;/p&gt;\n&lt;p&gt;GFP-MFAS ning SC sekretsiyasi Aβ tomonidan keltirib chiqarilgan MC larga o'tishi uchun zarur ekanligini tasdiqlash uchun biz SC larda BMP signalizatsiyasining salbiy transkripsiya regulyatori bo'lgan Dad ni Aβ-wt yoki Aβ-Iowa mutanti bilan birgalikda ekspressiya qildik (2-rasm). Avtokrin BMP signalizatsiyasi SC lümen sekretsiyasini rag'batlantiradi va bu Dad tomonidan bostiriladi (Corrigan va boshq., 2014; Redhai va boshq., 2016). Aβ-wt va Dad ni bir vaqtning o'zida ifodalovchi birorta ham yetuk erkak pashsha chiqmadi, ehtimol dsx-GAL4/GAL80ts tizimi nazorati ostida rivojlanish davridagi sust ekspressiya sintetik letallikka olib kelishi sababli. Shunga qaramay, Aβ-Iowa ni ifodalovchi SC larda Dad ning ekspressiyasi MAG lümenidagi GFP-MFAS darajasini pasaytirdi va ushbu fizion oqsilning MC larga so'rilishini keskin kamaytirdi (2-rasm).&lt;/p&gt;\n&lt;p&gt;Xulosa qilib aytganda, bizning ma'lumotlarimiz MC lar SC lar tomonidan sekretsiya qilinadigan DCG oqsillarini endositoz qilishini va bu qamrab olish jarayoni kuchayishi va/yoki degradatsiyasi bostirilishini, agar SC lar wild type yoki amiloidogen mutant Aβ ni ekspres qilganda, qat'iy qo'llab-quvvatlaydi. Bu MC endolizosomal kompartmentlarining kattalashishiga olib keladi, ular buzilmagan kislotali bo'lmagan sharoitda so'nmaydigan degradatsiyaga uchramagan flüoresan GFP-MFAS ning yuqori darajalarini o'z ichiga oladi, ehtimol bu nuqsonli kompartmentlarning pH qiymati ko'tarilgani sabablidir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SC larda Aβ ekspressiyasi MC lar tomonidan o'zgargan DCG oqsillarining endositoziga va ularning pH qiymati oshgan endolizosomal kompartmentlarining kattalashishiga olib keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ab-izoformalari-yetuk-dcg-kompartmentlarida-dcg-larga-integratsiyalanadi\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#ab-izoformalari-yetuk-dcg-kompartmentlarida-dcg-larga-integratsiyalanadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Aβ izoformalari yetuk DCG kompartmentlarida DCG larga integratsiyalanadi&lt;/span&gt;&lt;/a&gt;Aβ izoformalari yetuk DCG kompartmentlarida DCG larga integratsiyalanadi&lt;/h4&gt;\n&lt;p&gt;SC larda Aβ ekspressiyasining GFP-MFAS tashilishiga va endolizosomal nuqsonlarning MC larga tarqalishiga ta'siri bizning oldingi kuzatuvlarimizga mos keladi: Aβ GFP-MFAS agregatsiyasiga va ehtimol SC lardagi boshqa sekretsiya qilinadigan DCG oqsillariga, ehtimol aberrant membrana-agregat o'zaro ta'sirlari orqali ta'sir qiladi va bu sekretsiyadan keyin MC lar tomonidan ushbu oqsillarning qamrab olinishini oshiradi.&lt;/p&gt;\n&lt;p&gt;たちが Aβ-peptidlar to'g'ridan-to'g'ri DCG ga qo'shilishini tekshirish uchun biz ushbu peptidlar uchun oldindan tasdiqlangan 6E10 antikoridan foydalandik. Ushbu antikor inson Aβ-peptidlari va APP bilan o'zaro ta'sir qiladi, lekin Drosophila APPL bilan emas.&lt;/p&gt;\n&lt;p&gt;Antikor MAG ning mushak kapsulasi atrofida yuqori darajada fon bo'yashini keltirib chiqardi (3A-rasm), bu yupqa MC qatlamida Aβ lokalizatsiyasini baholashni qiyinlashtirdi. Shunga qaramay, ham Aβ-wt, ham Aβ-Iowa SC ichidagi ko'pchilik GFP-MFAS-musbat DCG lar bilan kuchli kolokalizatsiya qildi, garchi antikor bo'yash intensivligi turli DCG lar orasida sezilarli darajada farq qilsa ham (3-rasm).&lt;/p&gt;\n&lt;p&gt;Biz shunday xulosaga keldikki, SC larda ifodalangan Aβ DCG larga qo'shiladi va DCG kompartmentining yetilishini o'zgartiradi. Ushbu hujayralar tomonidan sekretsiya qilinganda, Aβ ning MFAS DCG oqsiliga ta'siri MAG lumenida saqlanib qoladi yoki qayta tiklanadi, shuning uchun MFAS MC lar tomonidan g'ayritabiiy ravishda endositoz qilinadi va ularning endolizosomal trafigini buzadi.&lt;/p&gt;\n&lt;h4 id=\"sc-ekzosomalari-dcg-oqsillari-bilan-birga-mc-lar-tomonidan-endositoz-qilinadi\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#sc-ekzosomalari-dcg-oqsillari-bilan-birga-mc-lar-tomonidan-endositoz-qilinadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SC ekzosomalari DCG oqsillari bilan birga MC lar tomonidan endositoz qilinadi&lt;/span&gt;&lt;/a&gt;SC ekzosomalari DCG oqsillari bilan birga MC lar tomonidan endositoz qilinadi&lt;/h4&gt;\n&lt;p&gt;SC DCG kompartmentlari shuningdek MAG lumeniga Rab11-ekzosomalar sifatida sekretsiya qilinadigan ILV larni hosil qiladi. Biz ushbu ekzosomalar MC lar tomonidan endositoz qilinishini va bu jarayonga SC Aβ ekspressiyasi ta'sir qilishini tekshirdik. Biz inson ekzosomali markerining mCherry bilan belgilangan shaklini, ya'ni Rab11-ekzosomalarni belgilovchi CD63 ni, GFP-MFAS ifodalovchi SC larda birgalikda ekspressiya qildik, shunda biz GFP-MFAS ni o'z ichiga olgan kompartmentlarni, shuningdek MC lardagi endositoz qilingan ekzosomalarni osongina aniqlashimiz mumkin edi. Biz GFP-MFAS, CD63-mCherry va Aβ-Iowa transgenlari, ularning barchasi dsx-GAL4 bilan bir xil xromosomada joylashgan, birgalikda ekspressiya qilingan erkaklarni ola olmadik. Shunga qaramay, CD63-mCherry nazorat MAG larida ham, Aβ-wt ni ekspres qiluvchi SC larni o'z ichiga olgan MAG larida ham MC ichida lokalizatsiya qilindi va ko'pincha GFP-MFAS bilan kolokalizatsiya qildi (4-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ekzosomalar — hujayralararo muloqot uchun ajratiladigan mikro pufakchalar bo'lib, ularning CD63 markeri organizmdagi yo'lini kuzatishga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bundan tashqari, GFP-MFAS signali uchun bo'lgani kabi (1B-D va S1D-F-rasmlar), Aβ-wt ekspressiyasi MC larda CD63-mCherry ning keng tarqalgan taqsimlanishiga olib keldi, bu ushbu hujayralardagi endolizosomal kompartmentlarning kattalashishiga mos keladi. Shuning uchun, SC dan kelib chiqqan ekzosomalarning MC larga endositozi GFP-MFAS bilan birga sodir bo'ladi. Bu wild type MAG larda, shuningdek MC endolizosomalari SC ga xos Aβ ekspressiyasi bilan buzilgan MAG larda ham sodir bo'ladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kuzatilgan endolizosomal transport buzilishlari drosofila modellarida olingan bo'lib, inson patologiyasiga to'g'ridan-to'g'ri ko'chirishda ehtiyotkorlikni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;SCdagi Rab11-ekzosoma biogenezi regulyatori Chmp5 ekspressiyasini ingibitsiya qilish Aβ keltirib chiqargan endolizosomal nuqsonlarning MCga tarqalishini bostiradi&lt;/p&gt;\n&lt;p&gt;Bizning oldingi tahlilimiz shuni ko'rsatdiki, SCda Aβ ekspressiyasi agregatlangan DCG oqsillarining membranadan dissotsiatsiyasini bostiradi — bu normal DCG yetilishining muhim bosqichi bo'lib, natijada nuqsonli DCG kompartmentlari lizosomalarga normal tashilmaydi va g'ayritabiiy ravishda sekretsiya qilinadi. DCG kompartmentlaridagi ILVlar kompartment yetilish jarayonida ham, undan keyin ham DCG bilan assotsiatsiyalangan bo'ladi. Darhaqiqat, bu ILVlar DCG biogenezida rol o'ynaydi. Biz Rab11-ekzosomalar MCdagi Aβ keltirib chiqargan endolizosomal transport nuqsonlarini kuchaytirishi mumkin deb taxmin qildik, chunki Aβni ifodalovchi SCdagi membranalar va GFP-MFAS o'z ichiga olgan oqsil agregatlari o'rtasidagi barqarorlashgan o'zaro ta'sirlar ushbu hujayralardan tashqarida saqlanib qolishi mumkin.&lt;/p&gt;\n&lt;p&gt;Buni tekshirish uchun biz Aβ-peptidlar mavjudligida va yo'qligida SCda Rab11-ekzosoma biogenezini ingibitsiya qildik. DCG kompartmentlaridagi ILV biogenezi to'rtta ESCRT kompleksining asosiy komponentlari tomonidan boshqariladi, ular kechki endosomal ekzosomalarni ham hosil qilishi mumkin; ammo, biz ilgari pashsha va inson hujayralarida ESCRT-III qo'shimcha oqsillari kechki endosomalardagi ekzosoma biogeneziga nisbatan Rab11-ekzosoma shakllanishida tanlab ishtirok etishini ko'rsatgan edik.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SCda Chmp5 nokdauni Aβ ekspressiyasidan qat'i nazar, MC tomonidan GFP-MFAS so'rilishini keskin kamaytiradi, bu Rab11-ekzosomalarning DCG komponentlarini hujayralararo tashishdagi muhim rolini ko'rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu oqsillarni kodlovchi genlarning nokdauni DCG kompartmentlarida ILV hosil bo'lishini bostiradi, ammo asosiy ESCRT nokdaunlaridan farqli o'laroq, kechki endosomalar va lizosomalardagi ubikvitinlangan oqsillarning ILVga bog'liq degradatsiyasiga sezilarli ta'sir ko'rsatmaydi.&lt;/p&gt;\n&lt;p&gt;Shu sababli, biz SCda qo'shimcha ESCRT-III komponenti bo'lgan Chmp5 geni nokdaunidan so'ng GFP-MFASning MCga o'tishini baholadik. Ilgari biz SCda ksantin degidrogenaza fermentini kodlovchi rosy ko'z pigmentatsiyasi geniga qaratilgan nazorat RNAi ni ifodalaganimizda, bu MCdagi GFP-MFAS darajasini oshirganini aniqladik. Shuning uchun biz Drosophila geniga kirmaydigan mCherry ga qaratilgan muqobil RNAi dan foydalandik; Aβ yo'qligida u ham ekspressiya qilmaydigan nazorat guruhlariga nisbatan MCning GFP-MFAS so'rilishini kuchaytirgandek tuyuldi (5A, 5C-E rasmlarini 1-rasm bilan solishtiring), ammo rosy-RNAi ga qaraganda kamroq darajada. Ushbu natija va boshqa tadqiqotlar shuni ko'rsatadiki, SCdagi RNAi protsessing apparatini faollashtirish GFP-MFASning hujayralararo o'tishini kuchaytirishi mumkin. Ushbu kuchayishga qaramay, Chmp5 nokdauni biz qo'llagan barcha uchta tahlil bo'yicha o'lchanganidek, nafaqat SCda yovvoyi turdagi Aβ yoki Aβ-Iowa ifodalangan MAGlarda, balki Aβ ifodalamaydigan hujayralarda ham ichki GFP-MFAS darajasini kuchli bostirdi (5-rasm). Ushbu manipulyatsiya MC endolizosomal kompartmentlaridagi GFP floresansiyasining o'rtacha intensivligini ham pasaytirdi va SCda Aβ ifodalanmagan yoki Aβ-wt ifodalangan MAGlar uchun MCda aniqlangan katta endolizosomal tuzilmalar soni ham kamaydi (SN-rasm). Ushbu topilmalar shuni ko'rsatadiki, SCdagi Chmp5 nokdauni GFP-MFAS endotsitozini kuchli pasaytiradi va/yoki uning MCdagi degradatsiyasini kuchaytiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RNAi (RNK interferensiyasi) — gen funksiyasini o'rganish uchun ma'lum bir gen ekspressiyasini «o'chirish» yoki kamaytirish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;MAG lumenidagi GFP-MFAS darajasini baholash shuni ko'rsatdiki, Chmp5 nokdauni Aβ-wt ifodalovchi SC tomonidan GFP-MFAS sekretsiyasini kamaytirmadi (5H va 5L-rasmlar) va aslida Aβ-Iowa uchun uni oshirgandek tuyuldi (5N, 5R-rasmlar), bu MC so'rilishining o'zgarishi lumenal GFP-MFASning kamayishi bilan izohlanmasligini ko'rsatadi. Nazorat bezlarida Chmp5 nokdauni GFP-MFAS sekretsiyasining pasayishiga olib keldi (5F-rasm), garchi MC so'rilishiga inhibitiv ta'sir kuchliroq ko'rinsa ham (5C-E rasmlar). Umuman olganda, ushbu ma'lumotlar Rab11-ekzosomalar va/yoki ularning ILV prekursorlari DCG komponentlarining hujayradan hujayraga o'tishida va Aβ keltirib chiqargan endolizosomal nuqsonlarning tarqalishida muhim rol o'ynashini ko'rsatadi.&lt;/p&gt;\n&lt;p&gt;Ba'zi, ammo hammasi emas, ESCRT nokdaunlari SCda katta DCG ishlab chiqarishni ingibitsiya qiladi, bu esa ushbu kompartmentlarning lizosomalarga yo'naltirilishini oshirishi va shuning uchun Aβ ifodalovchi hujayralarda keltirib chiqadigan endolizosomal nuqsonlarda o'zgarishlar keltirib chiqarishi mumkin. Shuning uchun biz Chmp5 nokdauni fenotipik tarqalishga ta'siridan tashqari, sekretsiya uchun SC sifat nazorati yo'lida endolizosomal transportni o'zgartirganmi yoki Aβ-wt yoki Aβ-Iowa ifodalovchi SCda kuzatilgan endolizosomal transport nuqsonlarini modifikatsiya qilganmi, shuni tekshirdik (6-rasm).&lt;/p&gt;\n&lt;p&gt;SCda Aβ yo'qligida ifodalanganda, Chmp5-RNAi ushbu hujayralardagi kislotalangan kompartmentlar sonini va lizosomal maydonni oshirdi (6A, 6B, 6I, 6J-rasmlar), ehtimol hujayralar g'ayritabiiy DCGlarning yuqori ulushini o'z ichiga olgani uchun (6H-rasm). Shuningdek, nazorat guruhlariga nisbatan MC tomonidan GFP-MFAS so'rilishining pasayishi tendentsiyasi kuzatildi (6K-rasm), garchi bu tahlil MAG o'rtasidagi so'rilish tahlilidan farqli o'laroq, sezilarli o'zgarishni aniqlash uchun yetarlicha sezgir bo'lmasa ham (5F-rasm).&lt;/p&gt;\n&lt;p&gt;Aβ-wt yoki Aβ-Iowa bilan birgalikda ifodalanganda (6C-F rasmlar), MC GFP-MFAS so'rilishining pasayishi kuzatildi (6K-rasm, 5H-K va 5N-Q rasmlariga qarang). Biroq, g'ayritabiiy DCGlar, kislotalangan kompartmentlar yoki lizosomal maydonning aniq kamayishi kuzatilmadi, garchi Aβ-Iowa ifodalovchi hujayralarda DCG kompartmentlari soni oshgan bo'lsa ham (6G-J rasmlar). Shuning uchun, SCda Chmp5 nokdauni orqali Aβ keltirib chiqargan DCG nuqsonlarini hujayra-avtonom fenotipik bostirish bizning standart tahlillarimiz bilan aniqlanmadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot mevali pashsha modelida o'tkazilgan; oqsillarning hujayralararo o'tishi bo'yicha natijalarni sutemizuvchilarga ekstrapolyatsiya qilishda ehtiyotkorlik talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Aslida, SCdagi DCG o'z ichiga olgan barcha kompartmentlar Rab11-musbatdir va bu na Chmp5 nokdauni, na Aβ izoformalarining ortiqcha ekspressiyasi bilan ta'sir qilmaydi. Rab11 geni lokusida N-terminal YFP oqsil fuziyasini olib yuruvchi pashshalardan foydalanib, biz DCG kompartmentlari sonida ba'zi kichik tebranishlar bo'lsa-da (SN-rasm), barcha tekshirilgan genotiplar uchun ularning DCG kompartmentlari Rab11 bilan belgilanganligini tasdiqladik (SN-rasm). Bu shuni ko'rsatadiki, DCG yetilish jarayonining Rab11-musbat resirkulyatsiya qiluvchi endosoma identifikatoriga o'tishini o'z ichiga olgan bosqichi normal kechadi (SN-rasm).&lt;/p&gt;\n&lt;p&gt;YFP-Rab11 shuningdek, ushbu kompartmentlar ichidagi ichki lyumenal vezikulalarning (ILV) kichik bir qismini belgilaydi. Biz ilgari ILV biogenezi o‘lchovi sifatida lyuminestsent punktalarni o‘z ichiga olgan Rab11-musbat kompartmentlar ulushini baholagan edik.&lt;/p&gt;\n&lt;h4 id=\"chmp5-nokdaunining-ilv-biogeneziga-tasiri\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#chmp5-nokdaunining-ilv-biogeneziga-tasiri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Chmp5 nokdaunining ILV biogeneziga ta'siri&lt;/span&gt;&lt;/a&gt;Chmp5 nokdaunining ILV biogeneziga ta'siri&lt;/h4&gt;\n&lt;p&gt;Ushbu tahlil shuni tasdiqladiki, Chmp5 nokdauni Aβ-wt mavjudligida ham, yo‘qligida ham nazorat guruhiga nisbatan ILV saqlovchi kompartmentlar ulushini kamaytiradi (Rasm S4A-D va S4H). Aβ-Iowa ifodalovchi SC uchun ILV saqlovchi barcha Rab11-musbat kompartmentlarni sanash qiyin edi, chunki bu ILVlarning aksariyati chegaralovchi membrana yonida joylashgan va YFP to‘planishi ko‘rinishida namoyon bo‘ladi (Rasm S4E va S4H). Chmp5 nokdauni markaziyroq joylashgan ILVlar sonini oshirdi (Rasm S4I), bu nima uchun ushbu genetik fonda ILV saqlovchi DCG kompartmentlari sonini biroz oshirganini tushuntiradi (Rasm S4F va S4H).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-fS4.jpg\" alt=\"4-rasm. SC ga xos Chmp5 nokdauni Aβ eksprimeriguchi hujayralarda DCG kompartmenti o'ziga xosligini o'zgartirmaydi (6-ras\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm. SC ga xos Chmp5 nokdauni Aβ eksprimeriguchi hujayralarda DCG kompartmenti o'ziga xosligini o'zgartirmaydi (6-rasm bilan bog'liq)&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Chmp5 nokdauni DCG kompartmentlarida ILV hosil bo‘lishini kamaytiradi, shu bilan birga Aβ-Iowa ifodalanganda ILVlarning kompartment markaziga o‘tishi kuzatiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Shunday qilib, SCda Chmp5 nokdauni DCG kompartmentlarida ILV hosil bo‘lishini selektiv ravishda kamaytiradi, ammo Aβ izoformalari ortiqcha ifodalanganda ushbu kompartmentlarning yetilishi va sifat nazoratiga bo‘lgan har qanday keyingi ta'sirlar biz foydalanadigan standart tahlillar yordamida aniqlanmadi. Shunga qaramay, ushbu nokdaun GFP-MFASning boshqa epiteliya hujayralariga o‘tishini va Aβ keltirib chiqaradigan endolizosomal nuqsonlarning ushbu hujayralarga tarqalishini kuchli darajada bostiradi. Qizig‘i shundaki, Chmp5 nokdauni hatto Aβ ifodalamaydigan SCdan ham o‘tishni ingibitsiya qilishi sababli, ushbu ekzosomaga bog‘liq jarayon fiziologik jihatdan ishlashi mumkin, ammo u Aβ izoformalari mavjudligida kuchli darajada kuchayadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Nokdaun — bu gen ekspressiyasini pasaytirish orqali oqsil funksiyasini o‘rganishga imkon beradigan genetik usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"yordamchi-escrt-iii-genlarining-nokdauni-ab-keltirib-chiqargan-kozdagi-neyrodegeneratsiyani-bostiradi\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#yordamchi-escrt-iii-genlarining-nokdauni-ab-keltirib-chiqargan-kozdagi-neyrodegeneratsiyani-bostiradi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yordamchi ESCRT-III genlarining nokdauni Aβ keltirib chiqargan ko'zdagi neyrodegeneratsiyani bostiradi&lt;/span&gt;&lt;/a&gt;Yordamchi ESCRT-III genlarining nokdauni Aβ keltirib chiqargan ko'zdagi neyrodegeneratsiyani bostiradi&lt;/h4&gt;\n&lt;p&gt;Bizning tadqiqotlarimiz shuni ko'rsatadiki, SCda yovvoyi turdagi yoki mutant Aβ shakllarining ekspressiyasi AD boshlanishiga aloqador bo'lishi mumkin bo'lgan kamida uchta fenotipni keltirib chiqaradi: DCG kompartmentlaridagi membranalaridan agregatsiyalangan oqsillarning dissotsiatsiyasining buzilishi, endolizosomal trafikdagi nuqsonlar va bu nuqsonlarning SC sekretsiyasi hamda MC tomonidan endotsitoz orqali boshqa hujayralarga tarqalishi. DCG kompartmentlarida ILV shakllanishini va shuning uchun Rab11-ekzosomalar sekretsiyasini ingibitsiya qiluvchi Chmp5 nokdauni tarqalish fenotipini kuchli bostiradi, ammo Aβ keltirib chiqargan SC DCG va endolizosomal nuqsonlarga juda oz ta'sir qiladi (agar umuman ta'sir qilsa).&lt;/p&gt;\n&lt;p&gt;Biz Aβ keltirib chiqargan tartibga solinadigan sekretsiya nuqsonlari ADda kuzatiladigan neyrodegenerativ fenotiplarni boshlashi mumkinligini taxmin qildik. Shuning uchun, SCdagi ushbu nuqsonlarning har qandayini bostiradigan genetik manipulyatsiyalar neyronlarda Aβ ekspressiyasi tomonidan qo'zg'atilgan degeneratsiyani ham ingibitsiya qilishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Yordamchi ESCRT-III genlarining (Chmp5, Ist1, Chmp1) nokdauni Aβ keltirib chiqargan neyrodegeneratsiyani bostiradi, bu Rab11-ekzosomalar biogenezi yo'lining AD patogenezidagi asosiy rolini ko'rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu gipotezani tekshirish uchun biz AD bilan bog'liq neyrodegeneratsiyani o'rganish uchun keng qo'llaniladigan pashsha ko'zidagi neyrodegeneratsiya modelidan foydalandik. Rivojlanayotgan Drosophila ko'zida ko'zga xos GMR-GAL4 drayveri yordamida yovvoyi turdagi Aβ yoki Aβ-Iowa ekspressiyasi kattalar ko'zi morfologiyasi shakllanayotgan davrda hujayralar degeneratsiyasi tufayli ommatidiylarning normal geksagonal tuzilishini buzadi (7-rasm).&lt;/p&gt;\n&lt;p&gt;AD bilan bog'liq neyrodegeneratsiyaning bir nechta genetik va farmakologik supressorlari, shuningdek, sekretsiya modifikatorlari bu fenotiplarni qisman qutqaradi. Bundan tashqari, Rab11 Drosophila fotoretseptorlarida apikal trafik va sekretsiyada muhim rol o'ynashi ma'lum, bu ushbu hujayralar, ko'plab boshqa hujayra turlari kabi, SCda mavjud bo'lgan asosiy tartibga solinadigan sekretor biogenez apparatiga ega ekanligi haqidagi g'oya bilan mos keladi.&lt;/p&gt;\n&lt;p&gt;Biz ikki xil GMR-GAL4 insersiyasi nazorati ostida Aβ-wt va Aβ-Iowa ekspressiyasi tartibsiz ko'z fenotipiga olib kelishini tasdiqladik (7-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GMR-GAL4 — bu Drosophila ko'zida genlarning maqsadli ekspressiyasi uchun ishlatiladigan genetik tizim bo'lib, u muayyan oqsillarning to'qima tuzilishiga ta'sirini o'rganishga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ilgari «qo'pol ko'z» fenotiplarini o'rganish uchun analitik vositalar ishlab chiqilgan, ammo biz ular bizning stereomikroskopik tasvirlarimiz bilan yaxshi ishlamasligini aniqladik. Shuning uchun biz ushbu usullarning elementlarini moslashtirdik va taxminan 250 ta markaziy ommatidiy uchun ko'zning geksagonal tuzilishi muntazamligini o'lchash uchun avtomatlashtirilgan ommatidiyalarni tahlil qilish quvurini ishlab chiqdik. Bu ko'z ichidagi markaziy elliptik mintaqada nazorat ko'zlari va Aβ ekspressiya qiluvchi ko'zlardagi har bir elementar ko'z uchun eng yaqin oltita ommatidiyga nisbatan burchakni aniqlashga imkon berdi. Biz UAS-transgen insersiyasini o'z ichiga olmaydigan pashshalar bilan chatishtirilganda har bir GMR-GAL4 liniyasi uchun mos yozuvlar egri chizig'ini o'rnatdik; u har biri 60 graduslik burchak bilan ajratilgan oltita aniq cho'qqini o'z ichiga olgan (SN-rasm). Ushbu mos yozuvlar egri chizig'i bilan solishtirganda, biz Aβ ekspressiya qiluvchi ko'zlardagi ommatidiylarning tartibsiz joylashuvini nazorat lacZ transgenini ekspressiya qiluvchi pashshalarning ko'zlaridan aniq ajratib olish mumkinligini aniqladik (SN-rasm).&lt;/p&gt;\n&lt;p&gt;Nazorat RNK-interferensiyasi (mCherry-RNAi) ekspressiyasi na nazorat ko'zlaridagi ommatidiylar muntazamligiga, na yovvoyi turdagi Aβ va Aβ-Iowa keltirib chiqargan tartibsizlikka ta'sir qilmadi (SN-rasm, 8A, 8B, 8D, 8E, 8F va 8H). Aksincha, Chmp5-RNAi yovvoyi turdagi Aβ keltirib chiqargan tartibsizlikni bostirdi, ammo Aβ-Iowa ekspressiya qiluvchi ko'zlarda emas (8C, 8D, 8G va 8H-rasmlar). Yolg'iz ekspressiya qilinganda, u uchinchi xromosoma GMR-GAL4 (III) drayveri bilan foydalanilganda ommatidiylarning biroz tartibsizligini keltirib chiqardi (SN-rasm), bu yordamchi ESCRT-III funksiyasi rivojlanish jarayonida ko'zning normal morfologiyasini tartibga solishda fiziologik rol o'ynashi mumkinligini taxmin qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot Drosophila modelida o'tkazildi; natijalar odam AD patogenezining murakkabligini to'liq aks ettirmasligi mumkin va kuzatilgan ta'sirlar sutemizuvchilarning neyron tizimlarida qo'shimcha tekshiruvni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Oldingi tadqiqotda asosiy ESCRT komponentlarini (Stam, Vps25 va Vps4) RNK-interferensiya yordamida kamaytirish pashsha ko'zida GMR-GAL4 nazorati ostida inson APP ortiqcha ekspressiyasi tufayli kelib chiqqan degeneratsiya fenotipini bostirishi haqida xabar berilgan edi, bu APP/Aβ bilan bog'liq AD degeneratsiya modellarida ESCRT funksiyasi degeneratsiya uchun zarur degan taxminni tasdiqlaydi. Yordamchi ESCRT-III oqsillari va Rab11-ekzosomalar tomonidan vositachilik qilingan biogenez yo'li Aβ keltirib chiqargan degeneratsiyada muhim ishtirokchi ekanligini tasdiqlash uchun biz GMR-GAL4 modelida boshqa ikkita yordamchi ESCRT-III geni, Ist1 va Chmp1 nokdaunining ta'sirini sinab ko'rdik. Ilgari har ikkala nokdaun ham SC DCG kompartmentlarida ILV shakllanishini selektiv ravishda ingibitsiya qilishi ko'rsatilgan. Ular ham Aβ-wt, ham Aβ-Iowa keltirib chiqargan degeneratsiyani bostirdi (9-rasm), ammo ko'zda yolg'iz ekspressiya qilinganda ta'sir ko'rsatmadi (SN-rasm).&lt;/p&gt;\n&lt;p&gt;Xulosa qilib aytganda, bizning ma'lumotlarimiz shuni ko'rsatadiki, Rab11-ekzosomalar biogenezida selektiv ishtirok etishi ma'lum bo'lgan yordamchi ESCRT-III yo'lini bloklash turli Aβ shakllari keltirib chiqargan degeneratsiya bilan bog'liq morfologik fenotipni bostiradi.&lt;/p&gt;\n&lt;p&gt;Bu degeneratsiya mexanizmi Rab11-ekzosomalar biogenezi va ehtimol uning sekretor DCG komponentlarini normal endotsitar qabul qilishni buzadigan tartibga solinadigan sekretor yo'liga keyingi ta'sirini o'z ichiga olgan jarayonni o'z ichiga olishini taxmin qiladi.&lt;/p&gt;\n&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;p&gt;Aβ ning APP dan hosil bo'lishi orqali neyrodegeneratsiyani boshlab beradigan va degenerativ fenotiplarning boshqa hujayralarga o'tishiga yordam beradigan hujayraviy biologik hodisalar hali ham noaniq bo'lib qolmoqda. Biroq, endolizosomal transportdagi nuqsonlar va bu fenotipning keyingi hujayralararo tarqalishi muhim rol o'ynaydi. Drosophila prostata kabi SC hujayralaridan foydalangan holda olib borgan so'nggi tadqiqotlarimiz shuni ko'rsatadiki, bu nuqsonlar tartibga solinadigan sekretsiyani nazorat qiluvchi evolyutsion saqlanib qolgan APP-ga bog'liq jarayonlarning tartibsizligidan kelib chiqishi mumkin. Bu jarayonlar Aβ ni normal darajada hosil qilishi mumkin, ammo bu darajalar hujayraning sifat nazorati tizimlari tomonidan adekvat tarzda boshqariladi.&lt;/p&gt;\n&lt;p&gt;Bu yerda biz SC hujayralarida Aβ-wt va erta boshlanadigan oilaviy AD bilan bog'liq bo'lgan Aβ ning mutant shakli Aβ-Iowa ifodalanishi Drosophila MAG bo'ylab epitelial hujayralarga endolizosomal nuqsonlarning tarqalishini keltirib chiqarishini ko'rsatamiz. Hosil bo'lgan aberrant endolizosomalar DCG komponenti MFAS ning ortiqcha darajalarini, shuningdek, ehtimol SC DCG bo'limlarida hosil bo'lgan ekzosomalarni o'z ichiga oladi, garchi biz CD63-mCherry bilan belgilangan ba'zi vezikulalar boshqa mexanizmlar orqali hosil bo'lgan bo'lishi mumkinligini istisno qila olmaymiz. SC hujayralarini Rab11-ekzosoma biogenezini ingibitsiya qilish uchun genetik manipulyatsiya qilish Aβ ifodalovchi hujayralardagi DCG biogenez yo'liga cheklangan ta'sir ko'rsatadi, ammo tarqalishni kuchli bostiradi.&lt;/p&gt;\n&lt;p&gt;Bundan tashqari, Rab11-ekzosoma biogenez yo'lini pastga tartibga solish (downregulating) pashsha ko'zida Aβ keltirib chiqargan degenerativ ta'sirlarni ham bostiradi, bu tartibga solinadigan sekretsiya bilan bog'liq jarayonlarning buzilishi neyrodegeneratsiyada ishtirok etishini va kelajakdagi terapevtik strategiyalar uchun nishon bo'lishi mumkinligini ko'rsatadi.&lt;/p&gt;\n&lt;h4 id=\"ab-keltirib-chiqargan-endolizosomal-transport-nuqsonlarining-tarqalishi-tartibga-solinadigan-sekretor-yol-bilan-bogliq\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#ab-keltirib-chiqargan-endolizosomal-transport-nuqsonlarining-tarqalishi-tartibga-solinadigan-sekretor-yol-bilan-bogliq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Aβ keltirib chiqargan endolizosomal transport nuqsonlarining tarqalishi tartibga solinadigan sekretor yo'l bilan bog'liq&lt;/span&gt;&lt;/a&gt;Aβ keltirib chiqargan endolizosomal transport nuqsonlarining tarqalishi tartibga solinadigan sekretor yo'l bilan bog'liq&lt;/h4&gt;\n&lt;p&gt;SC hujayralaridagi juda kengaygan DCG bo'limlaridan foydalanib, biz ilgari Aβ ifodalanishi tartibga solinadigan sekretor yo'lni va uning sifat nazoratini buzishini hamda qo'shni hujayralarga tarqaladigan endolizosomal nuqsonlarga olib kelishini ko'rsatgan edik. Ushbu tadqiqot uchun LysoTracker Red bo'yashidan foydalanib, MC hujayralaridagi endolizosomal bo'limlar juda kengayganligini va ular GFP bilan belgilangan SC DCG oqsili MFAS dan olingan kuchaytirilgan GFP floresansiyasini namoyon etishini ko'rsatish mumkin edi. MAG o'zining ikkita bo'lagining distal uchida taxminan 40 ta SC hujayrasini o'z ichiga oladi, ular ham taxminan 1000 ta MC hujayrasini o'z ichiga oladi. Bu yerda biz MAG ning qolgan qismidagi kengaygan MC endolizosomal bo'limlari ichida GFP to'planishini aniqladik; Aβ-Iowa uchun kutilganidek, g'ayritabiiy qabul qilish SC hujayralaridagi BMP signallashiga bog'liqligini ko'rsatish mumkin edi, bu hujayralardagi tartibga solinadigan sekretsiyani nazorat qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Aβ ta'sirida DCG biogenezi va Rab11-ga bog'liq ekzosoma yo'lining buzilishi oqsillarning qo'shni hujayralarga patologik o'tishiga olib keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Inson Aβ-ga xos antitanacha bilan immunobo'yash Aβ-peptidlarining SC DCGlariga kiritilishini namoyish etdi. Ushbu antitanacha tomonidan hosil qilingan fon bo'yash tufayli bu peptidlar MC hujayralariga ham o'tishini tasdiqlashning iloji bo'lmadi. Biroq, bizning topilmalarimiz Aβ to'g'ridan-to'g'ri DCG biogenezi va bo'limlarning yetilishiga aralashishi haqidagi g'oyani kuchli qo'llab-quvvatlaydi va sekretsiyadan keyin DCG komponentlari bilan o'zaro ta'sirlar saqlanib qolishi ehtimolini oshiradi, bu esa sekretsiya qilingan MFAS ning MC hujayralari tomonidan aberrant qabul qilinishini tushuntiradi.&lt;/p&gt;\n&lt;h4 id=\"rab11-ekzosomalar-ab-induktsiyalangan-endolizosomal-nuqsonlarning-hujayralararo-tarqalishiga-yordam-beradi\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#rab11-ekzosomalar-ab-induktsiyalangan-endolizosomal-nuqsonlarning-hujayralararo-tarqalishiga-yordam-beradi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rab11-ekzosomalar Aβ-induktsiyalangan endolizosomal nuqsonlarning hujayralararo tarqalishiga yordam beradi&lt;/span&gt;&lt;/a&gt;Rab11-ekzosomalar Aβ-induktsiyalangan endolizosomal nuqsonlarning hujayralararo tarqalishiga yordam beradi&lt;/h4&gt;\n&lt;p&gt;Kemiruvchilar va odam hujayralarida o'tkazilgan oldingi tadqiqotlar shuni ko'rsatdiki, Aβ va Aβ-oligomerlar ekzosomalar bilan bog'langan holda sekretsiya qilinadi hamda amiloid plitalari ularning shakllanishiga yordam beruvchi ekzosomalar va/yoki boshqa hujayradan tashqari pufakchalarni (HTP) o'z ichiga oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Ekzosomalar hujayralararo muloqotda qatnashadigan va patogen oqsillarni hujayralar o'rtasida tashiydigan kichik hujayradan tashqari pufakchalardir.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bundan tashqari, Altsgeymer kasalligi (AK) bilan og'rigan bemorlarning qon plazmasi va miya-orqa suyuqligidan (MOS), AK bemorlarining neyron hujayralaridan, shuningdek AK kemiruvchi modellarining plazmasidan olingan Aβ bilan bog'langan HTP patologik fenotiplarni boshqa neyronlarga o'tkazadi. Shuningdek, neyrotoksik Aβ-oligomerlar ekzosomalarni o'z ichiga olgan mexanizm orqali odam neyronlari va gliyasi o'rtasida o'tishi haqida xabar berilgan. Bu jarayon HTPni sekretsiya qiluvchi hujayralardagi endolizosomal nuqsonlar bilan rag'batlantiriladi.&lt;/p&gt;\n&lt;p&gt;Biz DCG kompartmentlari ichidagi pufakchalar (IPVP) endolizosomal nuqsonlarning tarqalishida qatnashadigan Aβ bilan bog'langan HTPning kamida bir qismini ifodalashi mumkin degan xayolga keldik. Darhaqiqat, SC lardagi Chmp5 nokauti MC lar tomonidan GFP-MFAS ning g'ayritabiiy so'rilishini keskin ravishda bostirdi, bu esa ushbu g'oyani qo'llab-quvvatlaydi. Biz oldinroq ESCRT-III yordamchi genlari pashsha va odam hujayralarida Rab11-ekzosoma biogenezida tanlab olinadigan rol o'ynashini ko'rsatgan edik. Garchi Aβ-induktsiyalangan tarqalishning kuchli bostirilishi Chmp5 nokoutining boshqa hujayraviy ta'sirlari bilan bog'liqligini istisno qila olmasak-da, bu dargumon ko'rinadi, chunki ushbu genetik fonda GFP-MFAS hali ham sekretsiya qilinadi va bu sekretsiyani ta'minlovchi SC DCG hamda endolizosomal kompartmentlarida katta o'zgarishlar kuzatilmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;ESCRT-III oqsillari va ekzosomalarning roli bo'lmagan xulosalar model organizmlar va hujayra kulturalariga asoslangan, shuning uchun ularning odamdagi Altsgeymer patogeneziga bevosita qo'shgan hissasi qo'shimcha klinik tasdiqlashni talab qiladi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bir nechta tadqiqotlar normal va patologik neyronlararo muloqotda Rab11-musbat kompartmentlarning muhim vazifalarini ta'kidlab o'tdi. Masalan, pashshalarda Rab11 nerv-mushak birikmasidagi presinaptik sekretsiyada ishtirok etadi, bu ekzosomaga o'xshash pufakchalarning chiqarilishini o'z ichiga oladi. Sutemizuvchilar neyronlaridagi tadqiqotlar ham AK va uning modellarida Aβ bilan bog'langan ekzosomalarni sekretsiya qilishda Rab11 ning markaziy rolini ta'kidlaydi.&lt;/p&gt;\n&lt;p&gt;Darhaqiqat, umumiy odam Rab11-ekzosoma signaturalari va AK bemorlarining miya-orqa suyuqligida ko'tarilgan oqsillar o'rtasida o'xshashlik mavjud.&lt;/p&gt;\n&lt;p&gt;Bizning topilmalarimiz shuni ko'rsatadiki, DCG komponentlarining g'ayritabiiy hujayralararo o'tishi Aβ-induktsiyalangan ekzosoma bilan bog'liq patologiyalarning tarqalishi bilan bog'liq bo'lishi ehtimoldan xoli emas. Ushbu komponentlarning kuchaytirilgan o'tishi shunchaki Aβ tomonidan qo'zg'atilgan MC larning oshgan endotsitar faolligini yoki pasaygan degradatsiya vazifalarini aks ettirishi mumkin. Biroq, MFAS, membranalar va IPVP Aβni ekspressiya qiluvchi SC larning DCG kompartmentlarida g'ayritabiiy tarzda o'zaro ta'sir qilish kuzatuvi ekzosoma komplekslari, DCG oqsillari bilan bog'langan holda, shuningdek ekzosomaning «biomolekulyar korxonasi» ichidagi Aβ sekretsiya qilinganda saqlanib qolishi va MC larda endolizosomal nuqsonlarni keltirib chiqarishi mumkinligini taxmin qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Chmp5 nokauti GFP-MFAS ning hujayralararo o'tishini bostiradi, DCG oqsillari va Aβ bo'lgan ekzosoma komplekslari esa saqlanib qolib, nishon hujayralarda endolizosomal nuqsonlarni keltirib chiqarishi mumkin.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Darhaqiqat, yuqori Aβ bo'lmagan sharoitda bunday mexanizm fiziologik tarzda ishlayaptimi yoki yo'qmi, noma'lumligicha qolmoqda. Garchi Chmp5 nokauti Aβ ni ortiqcha ekspressiya qilmaydigan SC larda GFP-MFAS ning hujayralararo o'tishini bostirsa-da, boshqa RNKiga ortiqcha ekspressiya qiluvchi nazoratlar ekspressiya qilmaydigan nazoratlarga nisbatan GFP-MFAS ning hujayralararo o'tishining oshganini ko'rsatadi. Shuning uchun RNKi mashinasini giperaktivlashtirish hujayralararo tarqalish faolligini oshirishi va Chmp5 nokauti bu o'sishni bostirishi mumkin. Shunga qaramay, Aβ fiziologik hujayralararo signallar uzatilishida qatnashishi aniqlangan, shuning uchun bu jarayon Rab11-ekzosoma:agregat komplekslarini o'z ichiga olishi mumkin, bu g'oyani endi tekshirib ko'rish mumkin. SC ga xos Chmp5 nokauti juftlashishga nisbatan o'ziga xos urg'ochi javobini — boshqa erkaklarni rad etishni inhibe qiladi va DCG oqsil agregatsiyasining asosiy regulyatori bo'lgan mfas, APP yoki boshqa DCG komponentlari ushbu ekzosoma orqali vositachilik qiladigan jarayonda qatnashishini o'rganish qiziqarli bo'ladi.&lt;/p&gt;\n&lt;h4 id=\"rab11-ekzosoma-regulyatorlarining-nokdauni-ab-keltirib-chikhargan-nejrodegeneraciyani-am-supressiya-khiladi\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#rab11-ekzosoma-regulyatorlarining-nokdauni-ab-keltirib-chikhargan-nejrodegeneraciyani-am-supressiya-khiladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rab11-экзосома регуляторларининг нокдауни Aβ келтириб чиқарган нейродегенерацияни ҳам супрессия қилади&lt;/span&gt;&lt;/a&gt;Rab11-экзосома регуляторларининг нокдауни Aβ келтириб чиқарган нейродегенерацияни ҳам супрессия қилади&lt;/h4&gt;\n&lt;p&gt;GMR-GAL4 орқали бошқариладиган Aβ экспрессияси нейродегенерация билан боғлиқ морфологик нуқсонни келтириб chiqarishi яхши маълум ва бу жараён супрессорларини аниқлаш учун қулай тест тизимини taqdim etgan.&lt;/p&gt;\n&lt;p&gt;Zhuang ва б., 2023 йилги тадқиқоти асосий ESCRT оқсиллари нокдауни GMR-GAL4 томонидан бошқариладиган инсон APP келтириб чиқарган кўз дегенерациясини супрессия қилишини хабар қилди. Улар бу манипуляция APPнинг кечки эндосомаларга ташинишини камайтиришини, бу ерда одатда Aβ ҳосил бўлишини таъкидлашди. Биз сўлак безлари (SCs) ва инсон колоректаль саратон ҳужайраларида кўрсатганимиздек, ёрдамчи ESCRT-III нокдауни кечки эндосомаль экзосомаларга нисбатан Rab11-экзосомаларга нисбатан селектив таъсир кўрсатиши (Marie et al., 2023) ва олдиндан парчаланган ёввойи тур ҳамда мутант Aβ келтириб чиқарган дегенерацияни ингибиция қилиши мумкинлиги ҳақидаги топилмамиз нейродегенерациянинг ESCRT томонидан воситаланган супрессиясида бошқа жараёнлар ҳам иштирок этишини кўрсатади. MAGs таҳлилимиздан келиб чиқадиган оддий тушунтиришлардан biri shuki, Rab11-экзосома биогенезини ингибиция қилиш орқали эндолизосомаль нуқсонларнинг тарқалишини блоклаш Aβ таъсирларининг айримларини енгиллаштиради (10-расмдаги моделга қаранг). Бироқ, GMR-GAL4 драйвери Aβни барча фоторецепторларда экспрессия қилади, шунинг учун нуқсонли фоторецепторлардан нормал фоторецепторларга фенотипик тарқалиш бунда асосий рол ўйнаши даргумон.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ёрдамчи ESCRT-III компонентларининг нокдауни Rab11-экзосома биогенезини ингибиция қилиш орқали Aβ келтириб чиқарган нейродегенерацияни бостиради.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Муқобил имтиёз шундан иборатки, нотўғри йиғилган зич секретор гранула (DCG) компартментларидан секреция қилинган материалнинг қабул қилиниши бошқа Aβ экспрессия қилувчи ҳужайраларда ва потенциал равишда секреция қилувчи ҳужайранинг ўзида эндолизосомаль трафик нуқсонларини кучайтиради. Биз Chmp5 нокдаун қилинган Aβ экспрессия қилувчи SC'ларнинг DCG ёки эндолизосомаль компартментларида ҳеч қандай катта ўзгаришларни кузатмаган бўлсак ҳам, бу ҳужайралар GMR-GAL4 тестидаги фоторецепторлар каби эндоцитоз бўлмаганда ҳам кўпроқ Aβ синтез қилишни давом эттиради. Шунинг учун улар нотўғри Aβ синтезини бошлаш учун ушбу механизмларни талаб қиладиган ҳужайраларга қараганда фенотипик тарқалиш механизмларини ингибиция қилишдан камроқ таъсирланиши мумкин. Бу ҳам кузатилган нейродегенерациянинг тўлиқ супрессия қилинмаганини тушунтириши мумкин.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Натижалар асосан Drosophila ва ҳужайра линияларида олинган бўлиб, нейродегенерациянинг тўлиқ бартараф этилмагани патологик жараёнларнинг кўп қиррали эканлигини билдиради.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"regulyatsiyalanuvchi-sekretiyaning-buzilishi-va-ba-patologiyasining-boshlanishining-integratsiyalashgan-modeli\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#regulyatsiyalanuvchi-sekretiyaning-buzilishi-va-ba-patologiyasining-boshlanishining-integratsiyalashgan-modeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Regulyatsiyalanuvchi sekretiyaning buzilishi va BA patologiyasining boshlanishining integratsiyalashgan modeli&lt;/span&gt;&lt;/a&gt;Regulyatsiyalanuvchi sekretiyaning buzilishi va BA patologiyasining boshlanishining integratsiyalashgan modeli&lt;/h4&gt;\n&lt;p&gt;Agar nuqsonli regulyatsiyalanuvchi sekretsiya Aβ qo'zg'atadigan BA patologiyasini boshlashda va уни tarqatishda muhim rol o'ynasa, BA ning boshqa asosiy o'yinchilari, xususan tau-oqsil qayerga mos keladi? Aβ bilan bog'liq endolizosomal nuqsonlar kemiruvchilar neyronlarida tau patologiyalarini keltirib chiqarishi ko'rsatilgan (Gao va boshq., 2025; Schützmann va boshq., 2021), shu bilan birga Aβ inson neyronlari orasida patologik tau urug'larining ekzosomal o'tkazilishida ishtirok etadi (Miyoshi va boshq., 2021), bu jarayonlar abberant sekretor trafigi bilan bog'liq bo'lishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sekretsiya nuqsonlari va Arc oqsili Aβ ni tau patologiyasining tarqalishi bilan bog'lab, Rab11a ekzosomalari orqali erta tashxis qo'yish imkoniyatlarini ochadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Faollik bilan boshqariladigan sisket bilan bog'langan oqsil, ya'ni ARC, yaqinda tau urug'lanishi bilan ham bevosita bog'landi (Tyagi va boshq., 2026). Ko'plab tadqiqotlar Arc ni BA bilan bog'laydi (Wu va boshq., 2011; Landgren va boshq., 2012; Bi va boshq., 2018) va Drosophilada Arc ortologi, Arc1 ning nokauti bir nechta BA modellarida tau keltirib chiqaradigan patologiyani bostiradi (Schulz va boshq., 2023). Arc presinaptik uchlarda ILV larni ishlab chiqarishda yaqindan qatnashishi (Ashley va boshq., 2018) va APP ning sitoplazmatik domeniga bog'lana olishi (Lee va boshq., 2023) sababli, u tau modulyatsiyalangan sitoskelet va regulyatsiyalanuvchi sekretor kompartmentlar o'rtasida endolizosomal tarqalish fenotipiga tegishli bo'lgan muhim bog'liqlikni ta'minlashi mumkin. Shu munosabat bilan, Arc1 SC larda ayniqsa yuqori darajada transkripsiya qilinishi va shuning uchun bu tizimda ham rol o'ynashi qiziqarlidir (Immarigeon va boshq., 2021).&lt;/p&gt;\n&lt;p&gt;Bizning tadqiqotimiz BA dagi eng erta patologik nuqsonlar kasallikka xos sirt yuklarini tashiydigan g'ayritabiiy Rab11 ekzosomalarining sekretsiyasi bilan bog'liqligi haqidagi qiziqarli ehtimolni keltirib chiqaradi (10-Rasm). Bu ekzosomalar kechki endosomal ekzosomalarga qaraganda turli xil oqsil yuklarini o'z ichiga olishi ma'lum (Marie va boshq., 2023; Singh va boshq., 2025), shuning uchun biologik suyuqliklardagi boshqa EVs dan neyronal Rab11 ekzosomalarini (insonlarda Rab11a-ekzosomalar deb ataladi) ajratish uchun testlarni ishlab chiqish erta bosqichdagi yoki hatto prodromal diagnostika testlarini ishlab chiqishning yangi yo'lini ta'minlashi mumkin. Demansiyali BA bemorlarida va kasallikka chidamli shaxslarda neyronal subkletrar proteomning so'nggi tahlili endolizosomal oqsillarning, ayniqsa erta va retsikl qiluvchi endosomalar bilan bog'liq bo'lganlarning muvofiqlashtirilgan qayta tashkil etilishini ko'rsatadi, bu kognitiv pasayish bemorlarida kuchliroq namoyon bo'ladi. Rab11a-ekzosomalar prognozga taalluqli bo'lgan ushbu farqlarning ko'rsatkichini ta'minlashi mumkin degan fikr xayolga keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ekzosomalar — bu hujayralararo aloqa uchun ajratiladigan kichik hujayratashqi pufakchalar, endosomalar esa oqsillar va lipidlarni saralovchi ichki hujayrali pufakchalardir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Regulyatsiyalanuvchi sekretsiya va uning sifat nazoratidagi nuqsonlar Aβ hosil qiluvchi endolizosomal kompartmentlarning to'planishiga olib kelishi, oqsil agregatsiyasini va hujayralar orasida endolizosomal fenotiplarning tarqalishini rag'batlantirishi haqidagi gipotezani endi inson va sutemizuvchilar neyronlarida batafsilroq sinovdan o'tkazish kerak (Verma va boshq., 2026). Shunga qaramay, SC lardagi keyingi tadqiqotlar DCG agregatsiyasini buzadigan va nuqsonli agregatsiyalangan materialning hujayralararo tarqalishini rag'batlantiradigan qo'shimcha o'yinchilarni, shuningdek, bu fenotiplarning genetik suppressorlarini aniqlashga yordam berishi kerak.&lt;/p&gt;\n&lt;p&gt;Muhimi shundaki, sporadik BA bemorlarida patologiya butun hayot davomida asta-sekin to'planib boradigan va tarqaladigan DCG biogenezidagi kichik nuqsonlarni o'z ichiga olsa, bu suppressorlarning nisbatan nozik modulyatsiyasi keyingi hayotda demensiyaga o'tishning oldini oladigan erta bosqichlarda terapevtik yo'lni ta'minlashi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalarni model organizmlardan (Drosophila) insonning sporadik Altsgeymer kasalligiga ekstrapolyatsiya qilish qo'shimcha klinik tekshiruvlarni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu qo'lyozmada ishlatilgan Drosophila shtamlari Reaktivlar jadvalida keltirilgan. Transgen pashsha liniyalarining aksariyati Bloomington Drosophila Stock Centre (BDSC) va Vienna Drosophila Resource Centre (VDRC) dan olingan. Istisnolar quyidagilar edi; dsx-GAL4 (S. Goodwin, Oksford, Buyuk Britaniya tomonidan taqdim etilgan) (Rideout va boshq., 2010), endogen Rab lokusidagi YFP-Rab11 fizion geni (S. Eaton, Max Plank, Germaniya tomonidan taqdim etilgan) (Dunst va boshq., 2015), UAS-Dad (D. Bennett, Liverpul universiteti tomonidan taqdim etilgan). Liniyalar oldingi tadqiqotlarda yaratilgan va/yoki ishlatilgan bo'lsa, bu quyidagi ro'yxatdagi stoklar yonida qayd etilgan: w1118 (L.Partridge, UCL, Buyuk Britaniya tomonidan taqdim etilgan)&lt;/p&gt;\n&lt;p&gt;(masalan, Singh va boshq., 2025): GFP-mfas gen qopqoni (MI11275 GFSTF.2; BDSC 63204)&lt;/p&gt;\n&lt;p&gt;(Nagarkar-Jaiswal va boshq., 2015; Singh va boshq., 2025): UAS-CD63-mCherry (Fan va boshq., 2020): w; GAL80ts; dsx-GAL4 (Fan va boshq., 2020): w; tub-GAL80ts; dsx-GAL4, GFPmfas (Singh va boshq., 2025): w; tub-GAL80ts; YFP-Rab11, dsx-GAL4 (Fan va boshq., 2020):&lt;/p&gt;\n&lt;p&gt;UAS-Aβ-wt (BDSC 33769) (Wu va boshq., 2017) va UAS-Aβ-Iowa (BDSC 33779; Vitruvean) (Chouhan va boshq., 2016) konstruksiyalari ularni sekretor tizimga yo'naltirish uchun ajralib chiqadigan ER signal ketma-ketligini o'z ichiga oladi (Singh va boshq., 2025 da ishlatilgan): UAS-Aβ-wt w; UAS-Aβ-wt, tub-GAL80ts; dsx-GAL4 va w; UAS-Aβ-wt, tub-GAL80ts; dsx-GAL4, GFP-mfas larni yaratish uchun boshqa transgenlar bilan birlashtirilgan: UAS-Chmp5-RNAi (P{KK109120}VIE-260B; VDRC 101422; to'xtatilgan stok) (Dietzl va boshq., 2007; Marie va boshq., 2023): UAS-mCherry-RNAi (VALIUM20-mCherry; BDSC 35785)&lt;/p&gt;\n&lt;p&gt;(Duan va boshq., 2023): UAS-Chmp1-RNAi (P{GD11219}v21788; VDRC 21788) (Dietzl va boshq., 2007; Marie va boshq., 2023): UAS-Ist1-RNAi (P{GD11948}:VDRC 22497) (Dietzl va boshq., 2007; Marie va boshq., 2023): w; GMR-GAL4 (II) (Hafen laboratoriyasi tomonidan taqdim etilgan: ETH Tsyurix) (Freeman, 1996), GMR-GAL4 (III) (Wilson laboratoriyasida yaratilgan): GMR-GAL4 (III) w; UAS-Aβ-wt; GMR GAL4 (III) yaratish uchun birlashtirilgan va GMR-GAL4 (II) w; GMR GAL4 (II); UAS-Aβ-Iowa ni yaratish uchun ishlatilgan.&lt;/p&gt;\n&lt;p&gt;Pashshalar 25°C da 12 soatlik yorug'lik/qorong'ulik siklida standart makkajo'xori-agar muhitida saqlangan [har bir litr uchun 12.5 g agar (F.Gutlind &amp;amp; Co. Ltd), 75 g makkajo'xori uni (B. T. P. Drewitt), 93 g glyukoza (Sigma-Aldrich, #G7021), 31.5 g inaktivatsiyalangan achitqi (Fermipan Red, Lallemand Baking), 8.6 g kaliy natriy tartrat tetragidrat (Sigma Aldrich, #S2377), 0.7 g kalsiy xlorid digidrat (Sigma-Aldrich, #21907) va 12 ml etanolda erigan 2.5 g nipagin (Sigma-Aldrich, #H5501)]. Ular har 3-4 kunda yangi ozuqaga o'tkazib turilgan.&lt;/p&gt;\n&lt;p&gt;MAG bilan bog'liq tajribalar uchun tub-GAL80ts; dsx-GAL4 drayver liniyasini o'z ichiga olgan urg'ochi pashshalar, alohida yoki GFP-mfas, YFP-Rab11 yoki UAS CD63-mCherry bilan birgalikda (ba'zi hollarda UAS-boshqariladigan Aβ-wt yoki Aβ-Iowa shakllari bilan birga), UAS-transgenlari yoki w1118 (nazorat) ni tashuvchi erkak pashshalar bilan chatishtirildi, bu SC-spetsifik maqsadli gen ekspressiyasini harorat bilan boshqariladigan induksiyasiga imkon berdi.&lt;/p&gt;\n&lt;p&gt;Oldingi tadqiqotlardagi kabi (Singh et al., 2025), MAG va tirik to'qimalarni tasvirlash tajribalari uchun, bokira erkak nasllar tuxumdan chiqqandan so'ng yig'ildi va rivojlanishdan keyingi SC-spetsifik transgen ekspressiyasini faollashtirish uchun 6 kun davomida 29°C ga o'tkazildi.&lt;/p&gt;\n&lt;p&gt;Asosiy hujayralardagi (MC) GFP-MFAS miqdorini aniqlash tajribalari uchun, bu fiksatsiyalangan to'qimalarni tasvirlashni o'z ichiga olgan, bokira erkaklar RNAi to'planishi uchun vaqt berish maqsadida tuxumdan chiqishdan 24 soat oldin 29°C ga o'tkazildi, toki SC larda DCG bo'limlari shakllana boshlaydi, so'ngra tuxumdan chiqqandan keyin 6 kun davomida 29°C da saqlandi.&lt;/p&gt;\n&lt;p&gt;Drosophila ko'zlarini tahlil qilish tajribalari uchun, UAS-RNAi transgenlari yoki w1118 nazoratini tashuvchi urg'ochi pashshalar, maqsadli genlarning ko'zga xos ekspressiyasini qo'zg'atish uchun, alohida yoki UAS-Aβ-wt yoki UAS-Aβ-Iowa bilan birgalikda GMR-GAL4 tashuvchi erkak pashshalar bilan chatishtirildi. Ushbu chatishtirishlar butun tajriba davomida 25°C da saqlandi. Tuxumdan chiqqandan so'ng, urg'ochi pashshalar erkaklaridan ajratildi va muzlatish va tasvirlashdan oldin 25°C da 2-4 kun davomida yoshartirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SC va MC da transgen ekspressiyasini faollashtirish uchun 29°C harorat nazorati ishlatildi, bu RNAi va Aβ ning to'qima morfologiyasiga ta'sirini o'rganishga imkon berdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tasvirlash-uchun-mag-larni-tayyorlash\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#tasvirlash-uchun-mag-larni-tayyorlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tasvirlash uchun MAG larni tayyorlash&lt;/span&gt;&lt;/a&gt;Tasvirlash uchun MAG larni tayyorlash&lt;/h4&gt;\n&lt;p&gt;Biz tirik hujayralarni tasvirlash uchun Fan et al., 2020 tomonidan tavsiflangan metodologiyaning moslashuvidan foydalandik. Olti kunlik voyaga yetgan bokira erkak pashshalar CO2 yordamida behush qilindi, so'ngra muzdek 1X PBS (Thermo Fisher Scientific) ga botirildi. Erkak reproduktiv tizimi mikropinset yordamida qorin bo'shlig'ining oxirgi segmenti orqali ehtiyotkorlik bilan tanadan chiqarib olindi. Urug'donlar, urug' pufakchalari va eyakulyator pufakchasi shikastlanmagan va bezga biriktirilgan holda qoldirildi, ammo to'qimalarning buklanishi va MAG tasvirlash paytida xalaqit bermasligi uchun yog' to'qimalari va ichaklar ehtiyotkorlik bilan olib tashlandi. Keyin bezlar muz ustida 2-5 daqiqa davomida PBS da 500 nM Lysotracker Red (Thermo Fisher Scientific) bilan inkubatsiya qilindi, so'ngra muzdek PBS bilan yuvildi. To'qima keyinchalik ikkita qopqoq shisha (to'rtburchak: qopqoq shisha №1, 22 mm × 50 mm, Fisher, #1237-3128 va yumaloq: qopqoq shisha №1, 13 mm, #49492, VWR) o'rtasida 1x PBS tomchisida barqaror o'rnatildi, qurilma maxsus tayyorlangan metall ushlagich bilan birga ushlab turildi. Bezlar tasvirlashga tayyor bo'lganda, namunalarni biroz tekislash uchun filtr qog'ozi yordamida ortiqcha PBS olib tashlandi.&lt;/p&gt;\n&lt;p&gt;Konfokal tahlil uchun mikropreparatsiya xona haroratida PBS da amalga oshirildi va keyin namunalar 20 daqiqa davomida PBS dagi 4% paraformaldegidda (Sigma-Aldrich) fiksatsiya qilindi. Keyin bezlar SuperFrost mikroskop slaydlari (VWR) ustiga DAPI (Vector Laboratories) bilan Vectashield tomchisiga o'rnatilishidan oldin taxminan 5 daqiqa davomida 1x PBS da yuvildi. Namunalar qopqoq shisha (22 mm × 22 mm, 0,13–0,17 mm; Fisher) bilan joyida ushlab turildi.&lt;/p&gt;\n&lt;h4 id=\"fiksatsiyalangan-toqimalarni-antitanachalar-bilan-boyash\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#fiksatsiyalangan-toqimalarni-antitanachalar-bilan-boyash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fiksatsiyalangan to'qimalarni antitanachalar bilan bo'yash&lt;/span&gt;&lt;/a&gt;Fiksatsiyalangan to'qimalarni antitanachalar bilan bo'yash&lt;/h4&gt;\n&lt;p&gt;Antitanachalar bilan bo'yash uchun MAG lar ajratib olindi va (yuqorida tavsiflanganidek) 4% paraformaldegidda fiksatsiya qilindi. Fiksatsiyalangan bezlar keyinchalik PBST da (1× PBS, 0,3% Triton X-100 [Sigma-Aldrich]) 6 × 10 daqiqa davomida o'tkazuvchan qilindi, PBSTG da (PBST, 10% echki zardobi [Sigma-Aldrich]) 30 daqiqa davomida bloklandi va PBSTG da 1:500 nisbatda suyultirilgan sichqon anti-Aβ 6E10 (BioLegend, 39320) antitanachalari bilan 4°C da tun bo'yi inkubatsiya qilindi. Bezlar keyin PBST da 6 × 10 daqiqa davomida yuvildi, so'ngra xona haroratida 2 soat davomida PBSTG da 1:500 nisbatda suyultirilgan Cy3-konjugatsiyalangan eshak anti-sichqon ikkilamchi antitanachalari (The Jackson Laboratory) bilan 1:400 nisbatda inkubatsiya qilindi. Bezlar DAPI bo'lmagan Vectashield ga o'rnatilishidan oldin PBST da yana 6 × 10 daqiqa davomida yuvildi.&lt;/p&gt;\n&lt;h4 id=\"kozni-tasvirlash-uchun-pashshalarni-tayyorlash\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#kozni-tasvirlash-uchun-pashshalarni-tayyorlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ko'zni tasvirlash uchun pashshalarni tayyorlash&lt;/span&gt;&lt;/a&gt;Ko'zni tasvirlash uchun pashshalarni tayyorlash&lt;/h4&gt;\n&lt;p&gt;Voyaga yetgan ko'zlarni yorug'lik stereomikroskopi bilan tasvirlash uchun, chatishtirishlardan olingan urg'ochi pashshalar yig'ildi va 25°C da 2-4 kun davomida yoshartirildi, so'ngra karbonat angidrid orqali behush qilindi va 0,6 ml Eppendorf naychalariga (SLS) o'tkazilib, kamida 24 soat davomida -20°C da muzlatildi; pashshalarning aksariyati muzlatilgandan keyin bir hafta ichida tasvirga olindi. Ko'zlarni tasvirlash uchun pashshalar chapdan o'ngga qaragan holda joylashtirildi, ko'zning markaziy qismi ob'ektiv linzaga imkon qadar gorizontal holatda bo'ldi.&lt;/p&gt;\n&lt;h4 id=\"tirik-hujayralarni-tasvirlash\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#tirik-hujayralarni-tasvirlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tirik hujayralarni tasvirlash&lt;/span&gt;&lt;/a&gt;Tirik hujayralarni tasvirlash&lt;/h4&gt;\n&lt;p&gt;Tirik hujayralarni tasvirlash xona haroratida amalga oshirildi va asosan Singh et al., 2025 da ishlatilgan metodologiyaga amal qilindi. Le
