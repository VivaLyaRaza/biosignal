            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"204\" cy=\"117\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"616\" cy=\"166\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · IMMUNOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Rak terapiyasida immun&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;tizimini qanday tiklash&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;mumkin&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons-f1.jpg\" alt=\"1-rasm / TCE monoterapiyasi paytida bemor T-hujayralarining funksional buzilishi va transkripsion qayta dasturlashtirili\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm / TCE monoterapiyasi paytida bemor T-hujayralarining funksional buzilishi va transkripsion qayta dasturlashtirilishi (A) mCRPC bilan og'rigan bemorlardan birinchi davolash siklidan oldin va keyin (mos ravishda 1- va 8-kunlarda) PBMC (n=5) yig'ib olindi va har qanday vaqt nuqtasining 100 000 hujayrasi CC-1 yoki izotip nazorat antikorlari (CC-iso) (har biri 1 nM) mavjudligida LNCaP hujayralari bilan (E:T nisbati 1:1) 72 soat davomida inkubatsiya qilindi, shundan so'ng funksional tahlil o'tkazildi. (B-C) T-hujayralar proliferatsiyasi, CD4+ va CD8+ T-hujayralar faollashuvi hamda IFN-γ ajralishi mos ravishda 3H-timidinni o'zlashtirish, oqimli sitometriya va LEGENDplex multipleks tahlillari yordamida aniqlandi (B); LNCaP hujayralarining kamayishi oqimli sitometriya yordamida aniqlandi (C). Alohida bemorlardagi ma'lumotlar uchun 1A-qo'shimcha rasmga qarang. (D) Davolashdan oldin (1, 22, 43, 64-kunlar) va keyin (7, 29, 50, 71-kunlar) ko'rsatilgan vaqt nuqtalarida olingan uch nafar bemorning PBMC'lari nurlantirilgan LNCaP hujayralari va CC-1 (1 nM) bilan inkubatsiya qilindi. 72 soatdan keyin T-hujayralar proliferatsiyasi 3H-timidinni o'zlashtirish yordamida baholandi. Alohida bemorlardagi ma'lumotlar uchun 1C-qo'shimcha rasmga qarang. (E) Bir nechta davolash sikllari davomida ko'rsatilgan vaqt nuqtalarida CC-1 va eruvchan interleykin-2 retseptori (sIL-2R) plazma konsentratsiyalari o'lchandi va zardob darajalari ELISA yordamida aniqlandi. Bir nafar vakil bemorning namunali natijalari ko'rsatilgan. Ikki qo'shimcha bemorning ma'lumotlari uchun 1D-qo'shimcha rasmga qarang. (F) UMAP yordamida vizualizatsiya qilingan scRNA-sekvenirlash ma'lumotlarining Leiden asosidagi klasterlanishi, bazal holatda (1-kun) va terapiyadan keyin (8-kun) yig'ilgan bemor PBMC'laridagi asosiy immun hujayra populyatsiyalarini tasvirlaydi, ular kanonik nasl markerlariga ko'ra izohlandi. UA, belgilanmagan. (G) T-hujayralar tinch holati/aneriyasi, erta faollashuvi va metabolik regulyatorlarida qatnashadigan tanlangan genlarning ekspresiya o'zgarishlarini umumlashtiruvchi nuqtali grafiklar; nuqta hajmi tegishli genlarni ekspresiya qiluvchi hujayralar ulushini ko'rsatadi; rang intensivligi o'rtacha ekspresiyani aks ettiradi. (H) Davolashdan oldingi namunalarga (1-kun) nisbatan kanonik aneriya va giporeaktivlik bilan bog'liq transkripsion dasturlarning sezilarli darajada boyiganini ko'rsatadigan genlar to'plamini boyitish tahlili (GSEA). SAFFORD_T_LYMPHOCYTE_ANERGY yo'li (MSigDB) 8-kungi CD4+ va CD8+ T-hujayralarida sezilarli darajada boyigan. NES, normallashtirilgan boyitish balli; FDR, soxta kashfiyot darajasi. (I) T-hujayralar subklasterlanishi UMAP yordamida vizualizatsiya qilindi, bu terapiyadan keyin paydo bo'ladigan proliferativ, effektorga o'xshash va giporeaktiv populyatsiyalarni o'z ichiga olgan aniq funksional holatlarni aniqladi. (J) Terapiyadan oldingi (1-kun) va terapiyadan keyingi (8-kun) T-hujayralar holatlarining taqsimlanishini illyustratsiya qiluvchi joylashtirish zichligi grafiklari, giporeaktiv va noproliferativ fenotiplarga o'tishni hujjatlashtiradi. Ustunli grafiklar har bir shartdagi klaster taqsimotini ifodalaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Maxsus bispesifik antitelolar saraton hujayralariga qarshi kurashishga yordam beradi, ammo vaqt o'tishi bilan t-hujayralar faoliyatini pasaytiradi. Olimlar bu holatning sababini aniqlab, ikkilamchi signallar yordamida hujayralar faolligini tiklash usulini topdilar. Tajribalar ushbu usul o'smaga qarshi immunitetni to'liq tiklashini ko'rsatdi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Tce monoterapiyasi t-hujayralarda anergiyani keltirib chiqaradi.&lt;/li&gt;\n&lt;li&gt;Bivalent cd28 bog'lanishiga ega bicos yaratildi.&lt;/li&gt;\n&lt;li&gt;Bicos va tce kombinatsiyasi limfotsitlar faoliyatini tiklaydi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;CD3 retseptorini rag'batlantiruvchi TCE preparatlari onkologiyada keng qo'llanilsa-da, ularning yakkagollikdagi ta'siri t-hujayralar faoliyatsizlanishiga olib keladi. Yakkalik hujayra rnk sekvenirashi tahlili birinchi faollashuv signalining izolyatsiyasi cblb va bach2 kabi genlar faolligini oshirib, tinch holatni keltirib chiqarishini ko'rsatdi.&lt;/p&gt;\n&lt;p&gt;Ushbu muammoni hal qilish uchun tadqiqotchilar cd28 bilan bivalent bog'lanish orqali ikkinchi signalni yetkazib beruvchi bispesifik kostimulyatorlarni (bicos) yaratdilar. Tuzilma o'sma antigenlari va hujayradan tashqari matrisaga nisbatan qat'iy selektivlikni saqlab qoladi.&lt;/p&gt;\n&lt;p&gt;Insonlashtirilgan sichqonlardagi sinovlar bicos va tce birikmasi o'smalarni yo'q qilishini ko'rsatdi. Molekulyar tahlil t-hujayralarining proliferativ qobiliyati to'liq tiklanganini tasdiqladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar hujayra modellari, insonlashtirilgan sichqonlar va erta bosqich klinik sinov namunalariga asoslangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;CD3 ni rag'batlantiruvchi bispetsifik T-hujayra kleplari (TCE) onkologik Terapiyada jadal sur'atlar bilan o'sib bormoqda. Biz onkologik bemorlarda TCE bilan monoterapiya o'tkazish T-hujayralarining giporeaktivligini, shu jumladan ularning proliferativ va litik qobiliyatining yo'qolishiga olib kelishini aniqladik. Yakkahujayrali RNK sekvenirashi (single-cell RNA-sequencing) orqali anergiya va tinch holatning transkriptsion xususiyatlari, jumladan CBLB va BACH2 genlari faollashuvi hamda AP-1 ga bog'liq faollashuv dasturlarining bostirilishi aniqlandi, bu holat \"T-hujayra 1-signali\" ning yakkam-chakqam berilishi bilan bog'liq.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Yakkahujayrali RNK sekvenirashi — bu har bir alohida hujayradagi genlar faolligini o'rganishga yordam beradigan va yashirin farqlarni ko'rsatadigan ilg'or usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;T-hujayralar funksiyasini tiklash uchun biz \"signal-2\" ni yuqori samarali bivalent CD28 bog'lanishi orqali yetkazib beruvchi bispetsifik kostimulyatorlarni (BiCos) yaratdik, ular o'sma hujayralari va hujayradan tashqari matris tomonidan ifodalanadigan antigenlarga nisbatan qat'iy cheklangan faollikni saqlab qoladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ishlab chiqilgan BiCos kostimulyatorlari CD28 bilan bog'lanish orqali muhim 2-signalli yetkazib beradi va TCE keltirib chiqaradigan limfotsitlar giporeaktivligini bartaraf etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Doklinik tahlillar BiCos TCE monoterapiyasining samaradorligini oshirishini ko'rsatdi, ularning faolligi univalent Knob-into-Hole CD28-kostimulyatorlaridan yuqori bo'lib, T-hujayralar giporeaktivligini qaytaradi. Gumanizatsiyalashgan sichqonlarda BiCos juda past dozadagi TCE bilan birgalikda o'rnatilgan o'smalarni yo'q qilishga yordam berdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar gumanizatsiyalashgan sichqonlardagi doklinik modellarda olingan bo'lib, odamlarda sinovdan o'tkazishni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Nihoyat, BiCos TCE bilan davolangan bemorlarning T-hujayralarida BACH2 va KLF2 ning yuqori ekspresiyasi kabi tinch holatning molekulyar belgilarini yo'q qildi, bu hujayra funksiyasining to'liq tiklanishiga va uzoq muddatli o'smaga qarshi immunitetning shakllanishiga olib keldi.&lt;/p&gt;\n&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;1980-yillarda orttirilgan immunitetning asosiy ijrochi hujayralari bo‘lgan T-hujayralar faoliyatini boshqaruvchi markaziy retseptorlar aniqlanib, tavsiflangan edi. Ularning birinchisi T-hujayra retseptorlari (TCR)/CD3 kompleksi bo‘lib, u T-hujayralarini faollashtiruvchi antigen-spetsifik «1-signal»ni ta'minlaydi. Ko‘p o‘tmay, CD28 hal qiluvchi «2-signal»ni yetkazib beruvchi prototip kostimulyator retseptor sifatida aniqlandi. Keyinchalik 4-1BB (CD137) va OX40 (CD134) kabi qo‘shimcha kostimulyator retseptorlar topildi. Kostimulyatsiya nafaqat «1-signal»ni kuchaytirishi, balki yakkaxolda TCR/CD3 stimulyatsiyasidan keyin yuzaga keladigan T-hujayra giporeaktivligining oldini olishi tasdiqlandi. Shuningdek, CTLA-4 va PD-1 kabi immun nazorat nuqtalari T-hujayralar faollashuvini cheklovchi koinhibitor signallarni uz pyautoguiishi aniqlandi. Bu kashfiyotlar T-hujayra immunitetini terapevtik modulyatsiya qilish uchun yo‘l ochdi.&lt;/p&gt;\n&lt;p&gt;CD3 ni rag‘batlantiruvchi bispesifik T-hujayra biriktiruvchilari (TCE) va funksional jihatdan ularga yaqin bo‘lgan CAR-T hujayralaridan tashqari, immunitet nazorat nuqtalari ingibitorlari ham T-hujayralarni jalb qilish strategiyalarining qatorini to‘ldirdi va hozirda onkologik davolashning asosiga aylandi. TCE va CAR-T o‘rtasidagi muhim farq shundaki, ikkinchisi terapevtik samaradorlikka erishish uchun nafaqat CD3, balki CD28 yoki 4-1BB kabi kostimulyator molekulalardan ham signallarni talab qiladi. Biz 1980-yillardayoq TAAxCD3 va TAAxCD28 spetsifikligiga ega bsAb (TAA — o‘smasi bog‘liq antigen) birikmasi o‘smalarga qarshi ustun T-hujayra reaktivligini ta'minlashini ko‘rsatib, bispesifik antitelolar (bsAb) sohasiga kostimulyator signallarni kiritgan edik va keyinchalik bunday kombinatsiyani baholovchi klinik sinov o‘tkazgan edik.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Bispesifik antitelolar va CAR-T hujayralari — bu sun'iy oqsillar yoki o‘zgartirilgan T-hujayralari rakni yo‘q qilish uchun o‘sma antijeni va immun retseptorlariga bir vaqtning o‘zida ta'sir qiluvchi zamonaviy immunoterapiya usullaridir.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Shundan so‘ng, o‘smaga qarshi qaratilgan kostimulyatsiyaning klinik rivojlanishi 2006-yilda TGN1412 (Tegenero) voqeasi tufayli jiddiy to‘xtatib qo‘yildi, o‘shanda CD28 ga qarshi superagonistik monoklonal antitelо sog‘lom ko‘ngillilarda hayot uchun xavfli bo‘lgan sitokin bo‘roni sindromini keltirib chiqargan edi.&lt;/p&gt;\n&lt;h4 id=\"bispesifik-kostimulyatorlarni-ishlab-chiqish\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#bispesifik-kostimulyatorlarni-ishlab-chiqish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bispesifik kostimulyatorlarni ishlab chiqish&lt;/span&gt;&lt;/a&gt;Bispesifik kostimulyatorlarni ishlab chiqish&lt;/h4&gt;\n&lt;p&gt;Optirlashtirilgan bispesifik kostimulyatorlarni (BiCo) yaratish bo‘yicha sa'y-harakatlarimiz PSMA ga yo‘naltirilgan TCE ishtirokidagi klinik tadqiqot davomidagi so‘nggi kuzatishlar bilan yanada kuchaytirildi. Biz bu yerda, bizning ma'lumotimiz bo‘yicha birinchi marta, TCE monoterapiyasini uzoq vaqt qo‘llash faollashuv dasturlarining bostirilishi hamda kanonik anergiya va tinchlik genlarining qo‘zg‘alishi tufayli bemor T-hujayralarining funksional giporeaktivligini keltirib chiqarishi mumkinligini xabar qilamiz.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;TCE monoterapiyasining uzoq muddat qo‘llanilishi bemorning T-hujayralarida faollashuv dasturlarini o‘chirib, ularning giporeaktivligi va quyi holatini keltirib chiqaradi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;T-hujayralar funksiyasini kuchaytirish uchun va bivalentlik CD28 antitelolarining agonistik faolligini keskin oshirishini hisobga olib, biz ilgari mavjud bo‘lgan konstruksiyalardan farqli o‘laroq, faqatgina o‘smaga cheklangan faollikni saqlagan holda, bivalent TAA va CD28 bog‘lovchi qismlarini o‘z ichiga olgan BiCo larni ishlab chiqdik. Nishon sifatida biz nafaqat o‘sma hujayralarida, balki o‘smalarning hujayradan tashqari matritsasida (shu jumladan yangi hosil bo‘lgan qon tomirlarida) ham ifodalanadigan endoglin va B7-H3 ni tanladik. Shuningdek, biz sog‘lom to‘qimalarda kesishmaydigan «o‘smadan tashqari ekspresiyaga» ega ikkita turli TAA dan foydalanish TCE va BiCo larni ratsional birlashtirish uchun qo‘shimcha xavfsizlik qatlamini ta'minlaydi deb hisobladik, chunki oxirgilari o‘zlarining kostimulyator funksiyasini bajarish uchun TCE tomonidan «1-signal» va faollashuvni talab qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Ushbu tadqiqotdagi ma'lumotlar hujayra modellari va bemor namunalariga asoslangan bo‘lib, kelgusida ularning onkologiyadagi xavfsizligi va samaradorligi keng ko‘lamli klinik sinovlarda tasdiqlanishi lozim.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu ishda biz bivalent BiCo lar yordamida CD28 orqali signallarni yetkazib berish TCE yakkaxon terapiyasi paytida yuzaga keladigan T-hujayra giporeaktivligining oldini olishi va uni ortga qaytarishi mumkinligini ko‘rsatamiz. Bu proliferativ hujayra sikli dasturlarini tiklash, effektor imzolar va faollashuv bilan bog‘liq yo‘llarni kuchaytirish hamda T-hujayra anergiyasi va tinchlik xususiyatlarini bartaraf etish orqali T-hujayralarining o‘smaga qarshi terapevtik immunitetini keskin oshirishga olib keladi.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"treatment-with-single-agent-tce-induces-t-cell-hyporesponsiveness\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#treatment-with-single-agent-tce-induces-t-cell-hyporesponsiveness\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Treatment with single agent TCE induces T cell hyporesponsiveness&lt;/span&gt;&lt;/a&gt;Treatment with single agent TCE induces T cell hyporesponsiveness&lt;/h4&gt;\n&lt;p&gt;1a-faza klinik sinovining borishida metastatik kastratsiyaga chidamli prostata bezi saratoni (mCRPC) bilan og'rigan bemorlarda bizning PSMA-ga yo'naltirilgan TCE CC-1 preparati yagona vosita sifatida (NCT04104607) qo'llanilganda PSA darajasining tez, ammo qisqa muddatli pasayishi kuzatildi. Davolanishdan oldin va keyin olingan ushbu bemorlarning periferik qon mononuklear hujayralari (PBMC) yordamida ex vivo tahlili (1A-rasm) CD4⁺ va CD8⁺ T-hujayralar soni o'xshash bo'lishiga qaramay, CD3-stimulyatsiyasiga javoban T-hujayralar faollashuvi, proliferatsiyasi, sitokinlar sekretsiyasi va sitolitik faolligining keskin yo'qolganini ko'rsatdi (1-rasm, B va C; S1-qo'shimcha rasm, A va B). Longitudinal ex vivo tahlillari shuni ko'rsatdiki, bemorlarning T-hujayralari davolash ikki haftaga to'xtatilgandan so'ng ushbu giporesponsiv holatdan qisman tiklanadi (1D-rasm, masalan, 7-kun va 22-kunni solishtiring; S1C-qo'shimcha rasm), biroq TCE bilan davolashga zaif javoblar (1D-rasm, 1-kun hamda 22 va 64-kunlarni solishtiring; S1C-qo'shimcha rasm) va davolash sikllari sonining ortishi bilan eruvchan IL-2 retseptorining (sIL-2R) zardobdagi cho'qqi darajasining pasayishi bilan namoyon bo'ladigan chuqur buzilish holatida qoldi (1E-rasm va S1D-qo'shimcha rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Yagona TCE CC-1 bilan davolash T-hujayralarining klassik toliquv belgilarisiz chuqur, ammo qisman tiklanadigan giporesponsivligiga olib keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Giporesponsiv T-hujayralar toliquv markerlarining (masalan, PD-1: CD4⁺ T-hujayralarida P = 0.7 va CD8⁺ T-hujayralarida P = 0.5) sezilarli darajada oshishini ham, qarish yoki terminal differensiatsiya bilan bog'liq fenotipni ham ko'rsatmadi (PD-1, CD57, KLRG1, CD27/CD28 yo'qolishi) (S1-qo'shimcha rasm, E va F). TCE bilan davolashdan oldin va keyin olingan bemorlarning PBMC namunalarini yakka tartibdagi hujayra RNK sekvensiyasi (scRNA-seq) yetti ta alohida immun hujayra klasterini, jumladan CD4+ T-hujayralari, CD8+ T-hujayralari, NK-hujayralari, B-hujayralari, CD16+ monotsitlari, CD14+ monotsitlari va dendritik hujayralarini aniqladi (1F-rasm). 1-kun va 8-kungi juftlashgan namunalarning qiyosiy scRNA-seq tahlili shuni ko'rsatdiki, TCE bilan davolash T-hujayralari anergiyasi/tinch holati uchun xarakterli bo'lgan muvofiqlashtirilgan transkripsiya dasturini qo'zg'atadi: regulyator metabolik omillar va anergiya/tinchlik bilan bog'liq genlar (CBLB, BACH2, FOXP1, PTPN22, LAG3, LDHA va UCP2) yuqori regulyatsiyasi hamda erta faollashuv genlarining (FOS, FOSB, JUN, JUNB, DUSP1, CD69) past regulyatsiyasi yuzaga keladi (1G-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;scRNA-seq va GSEA tahlillari hujayralarning ichki holatini va genlar guruhining faolligini o'rganishga yordam berib, ularning anergiya holatiga o'tishini ko'rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu gen ekspresiyasi profili AP-1 faollashuv dasturlari bostirilgan va anergiya-simptomli xususiyatlarga, jumladan CBLB ekspresiyasining oshishiga ega bo'lgan BACH2 tomonidan boshqariladigan tinch holatga mos keladi. Shunga mos ravishda, genlar to'plamini boyitish tahlili (GSEA) TCE ta'siriga uchragan T-hujayralarida anergiya bilan bog'liq genlar to'plamining sezilarli boyiganini aniqladi (CD4⁺ T-hujayralarida NES = 1.633, p &amp;lt; 0.0001 va FDR &amp;lt; 0.0001; CD8⁺ T-hujayralarida NES = 1.420, p &amp;lt; 0.0001 va FDR &amp;lt; 0.0001) (1H-rasm va S2-qo'shimcha rasm). Subklasterlash va zichlik tahlili (1-rasm, I va J) CD8⁺ T-hujayralari effektor-xotira holatidan disfunksional terminal effektor-simptomli holatga o'tganini, CD4⁺ T-hujayralari esa erta faollashgan/markaziy xotira fenotipidan tinch/dam olish holatiga o'tganini tasdiqladi. Kuzatilgan subklaster taqsimoti surunkali, muvozanatsiz stimulyatsiya ostida o'zgargan differensiatsiya naqshlariga mos keladi.&lt;/p&gt;\n&lt;h4 id=\"format-and-binder-selection-for-optimized-bispecific-cd28-costimulation\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#format-and-binder-selection-for-optimized-bispecific-cd28-costimulation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Format and binder selection for optimized bispecific CD28 costimulation&lt;/span&gt;&lt;/a&gt;Format and binder selection for optimized bispecific CD28 costimulation&lt;/h4&gt;\n&lt;p&gt;Monospesifik CD28 antikorlari kostimulyator faolligini ko'rsatish uchun monovalent emas, balki bivalent bog'lanishni talab qiladi. Shunga ko'ra, bivalent CD28 bog'lanishi kostimulyator bsAb funksiyalarini yaxshilashi mumkin, biroq nishonga cheklangan faollikni yo'qotish xavfini tug'dirib, nojo'ya ta'sirlarga olib keladi. Ushbu muammoni hal qilish uchun biz ahamiyatsiz nishon o'ziga xosligiga ega bo'lgan to'rtta bivalent BiCo formatini yaratdik va tavsifladik (2A-rasm va S3-qo'shimcha rasm, A va B). Ikkitasi (bs-CD28-1 va bs-CD28-2) Fab-qismlari orqali T-hujayralaridagi CD28 ga yuqori affinitet bilan bog'langan bo'lsa, qolgan ikkitasi (bs-CD28-3 va bs-CD28-4) og'ir yoki yengil zanjirlarga biriktirilgan bir zanjirli anti-CD28 domenlarini o'z ichiga olgan (S3C-qo'shimcha rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;To'rtta BiCo formatidan faqat bs-CD28-4 formati o'sma antigeni bo'lmaganda T-hujayralarini rag'batlantirmasdan, qat'iy ravishda nishonga yo'naltirilgan faollikni ko'rsatdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;\"1-signal\"ni ta'minlovchi submitogen dozadagi TCE (CC-1) bilan birgalikda faqat bs-CD28-4 formati TAA bog'lanishi bo'lmaganda T-hujayralari stimulyatsiyasining yo'qligi bilan tavsiflanadigan qat'iy nishonga yo'naltirilgan faollikni ko'rsatdi (2B-rasm). Shunga ko'ra, bs-CD28-4 formati endoglin va B7-H3 ga yo'naltirilgan BiCo'larni yaratish uchun tanlab olindi. Ushbu TAA'lar qattiq o'smalarda va shuningdek, yangi qon tomirlarini o'z ichiga olgan o'sma bilan bog'liq hujayradan tashqari matritsada (ECM) keng miqyosda ekspreslanadi (16, 17) va shuning uchun CC-1 qo'zg'atgan immun javoblarini kuchaytirish uchun maqbul darajada mos keladi (S3D-qo'shimcha rasm). Yangi yaratilgan va ilgari tavsiflangan (18) mAb'lar panelidan maqbul affinitet asosida mos ravishda ikkita endoglin va ikkita B7-H3 bog'lovchilari tanlandi (S3-qo'shimcha rasm, E va F). Tegishli to'rtta konstrukt klonlangandan va tavsiflangandan so'ng, T-hujayralari proliferatsiyasini qo'zg'atishni qiyosiy tahlil qilish asosida BiCo-1 (endoglin-Kro22xCD28) va BiCo-2 (B7-H3-8H8xCD28) deb nomlangan ikkita BiCo asosiy nomzodlar sifatida tanlandi (S3-qo'shimcha rasm, G-I).&lt;/p&gt;\n&lt;h4 id=\"bico-molekulalarining-funksional-tavsifi\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#bico-molekulalarining-funksional-tavsifi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;BiCo-molekulalarining funksional tavsifi&lt;/span&gt;&lt;/a&gt;BiCo-molekulalarining funksional tavsifi&lt;/h4&gt;\n&lt;p&gt;O'sma hujayralaridan xoli bo'lgan insonlashtirilgan sichqonlarda o'tkazilgan in vivo xavfsizlik sinovlarida aniqlanishicha, nazorat sifatida olingan UCHT1 antitelasidan farqli o'laroq, BiCo-1 va BiCo-2 nomzodlari alohida holda ham, CC-1 bilan birgalikda ham hech qanday sitokinlar ajralishini keltirib chiqarmagan (2D-rasm). Bu BiCo qo'llanilganda nishondan tashqari T-hujayralar faollashuvi yo'qligini va kombinatsiyalangan usulning nishonga qat'iy bog'liqligini tasdiqlaydi.&lt;/p&gt;\n&lt;p&gt;Nishon-antigenga ega bo'lgan va ega bo'lmagan hujayralar ishtirokidagi tahlillar, shuningdek doza-samaradorlik tahlillari faollikning o'simlik antigeniga qat'iy bog'liqligini ko'rsatdi. T-hujayralar proliferatsiyasining maksimal darajasi 25 pM CC-1 va 0.5 nM BiCo konsentratsiyalarida kuzatildi (2E-rasm hamda 4 va 5-qo'shimcha rasmlar, A va B). Ushbu konsentratsiyalar keyingi tajribalar uchun tanlab olindi. Ikkala BiCo molekulasi ham TCE tomonidan boshqariladigan CD4⁺ va CD8⁺ T-hujayralar faollashuvini, IFN-γ sekretsiyasini hamda nishon hujayralarni yo'q qilishni kuchli darajada rag'batlantirdi (2-rasm, F va G; 5-qo'shimcha rasm, C-E). Ayniqsa, uzoq muddatli tahlillarda BiCo va past dozali TCE kombinatsiyasi yolg'iz holda ishlatilgan yuqori dozali (1000 pM) TCE bilan solishtirganda ham sezilarli darajada kuchaytirilgan (masalan, CD8⁺ T-hujayralar uchun BiCo-1 bo'yicha P = 0.03 va BiCo-2 bo'yicha P = 0.004) T-hujayra proliferatsiyasini hamda effektor va markaziy xotira hujayralarining yaqqol o'sishini ta'minladi (5-qo'shimcha rasm, F va G).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ikki valentli BiCo molekulalari past dozali TCE bilan birga CD4+ va CD8+ T-hujayralarining nishonga bog'liq proliferatsiyasini kuchaytiradi (P = 0.03 va P = 0.004) hamda o'smalarni samarali yo'q qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bivalent BiCo formatimizni klinik sinovlardan o'tayotgan univalent Knob-into-Hole CD28 costimulatorlari (KiH) (NCT06826768, NCT04626635, NCT04590326) bilan taqqoslash uchun biz BiCo'larda ishlatiladigan TAA va CD28 bog'lovchilarini o'z ichiga olgan KiH-1 va KiH-2 konstruksiyalarini yaratdik (2H-rasm va 6-qo'shimcha rasm, A va B). Ajablanarlisi shundaki, affinlik nuqtai nazaridan KiH konstruksiyalari bizning BiCo molekulalarimizga o'xshash bo'lib chiqdi (3I-qo'shimcha rasm va 6-qo'shimcha rasm, C-E). Keyinchalik, biz bivalent BiCo formatining costimulyatorlik salohiyatini TCE bilan birgalikda monovalent KiH konstruksiyalari bilan taqqosladik. Keng konsentratsiyalar oralig'ida BiCo molekulalarining costimulyatorlik faolligi KiH analoglariga nisbatan aniq ustunlik qildi (2I-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Knob-into-Hole (KiH) texnologiyasi — og'ir zanjirlarni modifikatsiya qilish yo'li bilan bispetsifik antitelolarni olish uchun ishlatiladigan geterodimerizatsiya usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Keyingi tahlillarda BiCo va KiH molekulalari uchun to'yingan konsentratsiya sifatida nM darajasidan foydalandik va bivalent BiCo formati CD4+ va CD8+ T-hujayralarining proliferatsiyasini (CD4+ T-hujayralar uchun BiCo va KiH o'rtasida P &amp;lt; 0.0001; CD8+ T-hujayralar uchun BiCo-1 va KiH-1 o'rtasida P &amp;lt; 0.0001, BiCo-2 va KiH-2 o'rtasida P = 0.0014), xotira shakllanishini va o'sma hujayralarini yo'q qilishni (BiCo-1 va KiH-1 uchun P &amp;lt; 0.0001, BiCo-2 va KiH-2 uchun P = 0.0002) sezilarli darajada ustun darajada rag'batlantirishini aniqladik (2-rasm, J-M va 7-qo'shimcha rasm, A-E). Samaradorlikdagi bu farq bivalent BiCo molekulalarining CD28 bog'lovchi qismining dissotsiatsiya tezligi (off-rate) 5 barobar kamayganligi bilan bog'liq bo'lishi mumkin (6D-qo'shimcha rasm).&lt;/p&gt;\n&lt;p&gt;C57BL/6 sichqonlarida o'tkazilgan farmakokinetik tahlillar shuni ko'rsatdiki, BiCo formatining zardobdagi yarimparchalanish davri klassik monoklonal antitelolarnikiga o'xshash (2N-rasm). Inson PBMC'lari ko'chirib o'tkazilgan NSG sichqonlarida CC-1 va BiCo bilan bir vaqtda olib borilgan kombinatsiyalangan davolash (lekin yolg'iz TCE emas) LNCaP-E yon o'smalarini butunlay yo'q qildi va hayvonlarning yashovchanligini statistik jihatdan sezilarli darajada yaxshiladi (P &amp;lt; 0.0001, 2O-rasm, 7F-qo'shimcha rasm). Dastlabki CC-1 monoterapiyasidan keyin BiCo'ni kechiktirib qo'llash unchalik kuchli bo'lmagan, ammo baribir yolg'iz CC-1 ga qaraganda ancha samarali natija berdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot hayvonlar modellarida o'tkazilgan bo'lib, natijalarni bevosita insonlarga tatbiq etishda ehtiyotkorlik talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"bicos-revert-and-prevent-t-cell-hyporesponsiveness\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#bicos-revert-and-prevent-t-cell-hyporesponsiveness\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;BiCos revert and prevent T cell hyporesponsiveness&lt;/span&gt;&lt;/a&gt;BiCos revert and prevent T cell hyporesponsiveness&lt;/h4&gt;\n&lt;p&gt;Бемоrlarning TCE terapiyasidan oldin (1-sikl, 1-kun) va keyin (8-kun) olingan periferik qon mononuklear hujayralari (PBMC) yordamida T-hujayralar proliferatsiyasi va o'simta hujayralarini yo'q qilish qobiliyatini tahlil qilish BiCos qo'llanilishi giporeaktivlikni to'liq bartaraf etishini ko'rsatdi. Shuni ta'kidlash kerakki, TCE ga javob bergan hamda javob bermagan bemorlarning T-hujayralarida ham BiCos faollik darajasini faqat TCE ning yuqori konsentratsiyasi bilan (javob beruvchi hujayralarda) erishilgan ko'rsatkichlardan sezilarli darajada yuqori ko'tardi (3-Rasm, A va B, P &amp;lt; 0.0001). Bu holat keyingi davolash sikllarida olingan hujayralarni tahlil qilishda ham o'z tasdigini topdi (3C-Rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BiCos ni qo'llash T-hujayralarining giporeaktivligini to'liq ortga qaytarib, ularning faolligini monoterapiya darajasidan yuqoriga ko'taradi (P &amp;lt; 0.0001) va effektor xotira populyatsiyalarini tiklaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bitta hujayra darajasidagi transkriptomik tahlil BiCo bilan davolash MCM oilasi a'zolari va CDC genlarining ekspresiyasini kuchaytirish hamda effektor dasturlar va faollashuv bilan bog'liq yo'llarni (GZMB, NKG7, TNF, IL2RA, IRF4) faollashtirgan holda hujayra siklining proliferativ dasturini qayta tiklaganini ko'rsatdi. Shu bilan birga, T-hujayralar anergiya va tinch holatining asosiy belgilari bo'lgan KLF2, PNRC1, TXNIP, CD52, SARAF va BACH2 genlari pasayishi bartaraf etildi (3-Rasm, D va E). Qo'shimcha zichlik tahlili (3-Rasm, F va G) BiCo terapiyasi CD8⁺ T-hujayralarining disfunksional terminal effektor-o'xshash holatlardan effektor xotira populyatsiyalariga qayta siljishi bilan bog'liqligini ko'rsatdi. Parallel ravishda, CD4⁺ T-hujayralari tinch holatdagi fenotiplardan dastlabki faollashgan markaziy xotira holatlariga o'tdi, bu faollashuv va funksional tiklanish muvozanatiga mos keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GSEA — hujayralardagi butun gen guruhlarining faolligi muayyan ta'sir ostida qanday o'zgarishini aniqlashga imkon beruvchi statistik tahlil usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;TCE terapiyasi vaqtida giporeaktivlik induksiyasi in vitro sharoitida PBMC va nishon hujayralarni 7 kun davomida TCE bilan ta'sirlashtirish, so'ngra TCE bilan qayta rag'batlantirish orqali modellashtirildi. Bemorlardagi kabi, CC-1 ning uzoq muddatli ta'siri T-hujayralarining nishon bilan bog'lanishiga bog'liq bo'lgan giporeaktivligiga olib keldi, chunki o'simta nishonlari bo'lmaganda CC-1 ta'siri T-hujayralar reaktivligiga ta'sir qilmadi. Bemor T-hujayralaridan olingan ma'lumotlarga mos ravishda, giporeaktivlikni madaniyatning dastlabki 7 kunida TCE ta'siri ostida va funksional tahlil bosqichida BiCos mavjudligi orqali to'liq oldini olish va ortga qaytarish mumkin edi (3-Rasm, H va I; S7G-Qo'shimcha rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Olingan natijalar in vitro tajribalari va cheklangan miqdordagi bemorlar namunalari (n=5) asosida tahlil qilingan bo'lib, klinik tasdiqni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Shunga o'xshash natijalar tarlatamab yordamida ham olindi (3J-Rasm), bu bizning TCE qo'zg'atgan T-hujayralar giporeaktivligi haqidagi xulosalarimizni boshqa klinik preparatlarga ham tatbiq etish imkonini beradi. Tarlatamab yaqinda mayda hujayrali o'pka saratonini (SCLC) davolash uchun ma'qullangan bo'lib, o'simta hujayralaridagi DLL3 va T-hujayralardagi CD3 ga bog'lanadigan ikkita bir zanjirli o'zgaruvchan fragmentdan (scFv) iborat yarimparchalanish davri uzaytirilgan maxsus bispesifik T-hujayra biriktiruvchisidir (BiTE).&lt;/p&gt;\n&lt;p&gt;Umuman olganda, natijalarimiz TCE monoterapiyasi terminal charchashdan ko'ra funksional anergiya va tinch holat bilan bog'liq bo'lgan ichki yo'llarning o'zgarishi bilan tavsiflanadigan T-hujayra giporeaktivligini keltirib chiqarishini ko'rsatadi. BiCos yordamida CD28 signallarini ta'minlash orqali T-hujayralar funksionalligini tiklash va giporeaktivlikning oldini olish mumkin, bu esa T-hujayralarning o'smaga qarshi immunitetini misli ko'rilmagan darajada kuchaytiradi.&lt;/p&gt;\n&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;h4 id=\"t-hujayralarning-giporeaktivligi-mexanizmlari-va-bispesifik-antitelalarni-muhokama-qilish\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#t-hujayralarning-giporeaktivligi-mexanizmlari-va-bispesifik-antitelalarni-muhokama-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;T-hujayralarning giporeaktivligi mexanizmlari va bispesifik antitelalarni muhokama qilish&lt;/span&gt;&lt;/a&gt;T-hujayralarning giporeaktivligi mexanizmlari va bispesifik antitelalarni muhokama qilish&lt;/h4&gt;\n&lt;p&gt;O'sma antigenlari va CD28/CD3 retseptorlariga yo'naltirilgan an'anaviy bispesifik antitelalar (TCE) B-hujayrali o'smalarni davolashda yaxshi natija ko'rsatib, boshqa onkologik kasalliklarda ham tez sur'atlar bilan joriy etilmoqda, masalan, tarlatamab preparatining mayda hujayrali o'pka rakini davolash uchun tasdiqlanishi va 35% umumiy javob tezligi bunga misoldir. Shunga qaramay, bemorlarning sezilarli qismi, ayniqsa qattiq o'smalarda, bu davolashga javob bermaydi, bu esa muvaffaqiyatsizlik sabablarini chuqur o'rganishni talab qiladi. PSMAxCD3 TCE CC-1 bilan davolanayotgan prostata bezi raki bilan og'rigan bemorlarning T-hujayralarini tahlil qilganda (NCT04104607), mualliflar uzoq muddatli TCE terapiyasi T-hujayralarning yaqqol funksional giporeaktivligiga olib kelishini aniqladilar. Davolashsiz ikki haftalik tanaffuslardan keyin ham bu holat to'liq bartaraf etilmadi, bu davolash sikllari soni ortishi bilan sIL-2R zardobdagi eng yuqori darajalarining pasayishida namoyon bo'ldi. Ushbu ma'lumotlar TCE terapiyasi bemorlarda T-hujayralar rezistentligini keltirib chiqarishi mumkinligini birinchi bo'lib ko'rsatadi. O'xshash susayish PBMC'larni in vitro tarlatamab bilan stimulyatsiya qilganda ham kuzatildi. Kelgusidagi tadqiqotlar optimal dozalashni aniqlash uchun TCE sxemasi va T-hujayralar giporeaktivligi o'rtasidagi bog'liqlikni ochib berishi kerak.&lt;/p&gt;\n&lt;p&gt;TCR/CD3 kompleksining alohida stimulyatsiyasi T-hujayralar giporeaktivligiga olib kelishi hujjatlashtirilgan. Ushbu holat interleukin-2 ishlab chiqarishning buzilishi, proliferatsiyaning to'xtashi va regulyator dasturlarning faollashishi bilan tavsiflanadi. Ushbu ishda birinchi marta bemorlarning T-hujayralarini bevosita tahlil qilish orqali TCE monoterapiyasi FOS va JUN oilasiga mansub AP-1 transkripsiya omillarining bostirilishiga, faollashuv va metabolik dasturlarning yo'qolishiga hamda BACH2, FOXP1, CBLB, PNRC1, PTPN22 kabi giporeaktivlik regulyatorlari va TXNIP hamda UCP2 metabolik repressirlarining induksiyasiga olib kelishi ko'rsatildi. PD-1 yoki terminal differensatsiya markerlarining barqaror oshishi kuzatilmadi, bu qaytarib bo'lmaydigan charchash yoki qarish ehtimolini inkor etadi. Buning o'rniga, transkriptsion xususiyatlar surunkali o'sma antigeni ta'sirida tavsiflangan erta \"falajlik\" holatiga mos keladi. Bir hujayrali tahlil CD8⁺ va CD4⁺ T-hujayralari differensatsiya yo'llarida to'xtab qolishini ko'rsatdi. Bu BACH2 ning AP-1 faolligini antagonizatsiya qilish orqali tolerantlik dasturlarini kuchaytirishi haqidagi kuzatishlarga to'la mos keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Uzluksiz TCE monoterapiyasi AP-1 bostirilishi va BACH2 induksiyasi orqali T-hujayralarning funksional giporeaktivligini keltirib chiqaradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Giporeaktivlik — bu T-hujayralarning stimulyatsiyaga nisbatan funksional sezgirligini yo'qotishi bo'lib, ular o'smani nishonga ola olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Oldingi tadqiqotlar CD28 molekulasi orqali ikkilamchi stimulyatsiya TCR/CD3 qo'zg'alishi keltirib chiqaradigan giporeaktivlikka qarshi tura olishini ko'rsatgan edi. Shu ma'lumotlarga tayanib, mualliflar bispesifik kostimulyator molekulalar (BiCos) antitelalar salohiyatini to'liq ochib berish uchun zarur degan xulosaga keldilar. CD28 ga qarshi eruvchan bivalent antitelalar kuchli faollikka ega bo'lsa-da, ular nishonga xoslik talabiga javob bermaydi. Ushbu ishda CD28 uchun bivalentlikni saqlab qolgan holda, to'liq nishonga yo'naltirilgan tarzda ishlaydigan tetravalent BiCo formati taqdim etiladi. CD28 ga bog'langan ikkita scFv qismining fazoviy konformatsiyasi faqat nishon hujayraga birikkandan keyingina agonist faollikni ta'minlaydi. O'sma va uning hujayradan tashqari matrisasida yaxshi ifodalanganligi sababli Endoglin (BiCo-1) va B7-H3 (BiCo-2) asosiy konstruksiyalar uchun TAA sifatida tanlandi.&lt;/p&gt;\n&lt;h4 id=\"bispesifik-kostimulyatsiyaning-samaradorligini-eksperimental-baholash\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#bispesifik-kostimulyatsiyaning-samaradorligini-eksperimental-baholash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bispesifik kostimulyatsiyaning samaradorligini eksperimental baholash&lt;/span&gt;&lt;/a&gt;Bispesifik kostimulyatsiyaning samaradorligini eksperimental baholash&lt;/h4&gt;\n&lt;p&gt;Turli in vitro modellarida BiCo-1 va BiNo-2 juda past konsentratsiyalarda ham T-hujayralarning o'smaga qarshi reaktivligini kuchli rag'batlantirdi, bu esa klinik qo'llashda nojo'ya ta'sirlarni kamaytirish imkonini beradi. Kombinatsiyalangan davolash TCE monoterapiyasidan, hatto yuqori konsentratsiyalarda ham, sezilarli darajada ustun keldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Olingan ma'lumotlar in vitro modellari va cheklangan klinik tanlanmalarga asoslangan bo'lib, keng ko'lamli klinik sinovlarda tasdiqlanishi kerak.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tce-va-bico-kombinatsiyasining-ustunligi\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#tce-va-bico-kombinatsiyasining-ustunligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TCE va BiCo kombinatsiyasining ustunligi&lt;/span&gt;&lt;/a&gt;TCE va BiCo kombinatsiyasining ustunligi&lt;/h4&gt;\n&lt;p&gt;TCE va BiCo kombinatsiyalangan terapiyasining samaradorligi sichqonlardagi ksenotransplantat modellarida tasdiqlandi, bunda faqat birgalikda qo‘llash o‘simtani to‘liq yo‘q qilishga olib keldi. Bizning bivalent BiCo konstruksiyalarimizni KiH texnologiyasi yordamida yaratilgan mavjud monovalent analoglar bilan solishtirish shuni ko‘rsatdiki, tetravalent BiCo formati sezilarli darajada yuqori kostimulyatorlik qobiliyatiga ega. Ajablanarlisi shundaki, farq CD28 bilan bog‘lanish affinligida emas, balki dissotsiatsiya tezligida (off-rates) bo‘lib, u monovalent konstruksiyalarda taxminan 5 baravar tezroq edi. Bu BiCo’ning CD28 molekulasi bilan yanada barqaror kompleks hosil qilishidan dalolat beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BiCo’ning bivalent tuzilishi CD28 bilan yanada barqaror bog‘lanishni ta’minlaydi va o‘simtalarni yo‘q qilishda monovalent analoglardan ustun turadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biroq, kinetik barqarorlashuv va retseptorlarning strukturaviy klasterlanishi hissasini ajratib ko‘rsatish qiyin, chunki bivalent arxitektura ikkala parametrga ham ta’sir qiladi. Shuning uchun BiCo formatining afzalligini faqat bitta mexanizm bilan izohlab bo‘lmaydi.&lt;/p&gt;\n&lt;h4 id=\"t-hujayralar-funksionalligini-tiklash\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#t-hujayralar-funksionalligini-tiklash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;T-hujayralar funksionalligini tiklash&lt;/span&gt;&lt;/a&gt;T-hujayralar funksionalligini tiklash&lt;/h4&gt;\n&lt;p&gt;Bizning ma’lumotlarimiz shuni ko‘rsatadiki, BiCo nafaqat T-hujayralarning effektor qobiliyatini kuchaytirishi, balki TCE monoterapiyasini olgan bemorlarda yuzaga kelgan giporeaktivlik holatini bartaraf etib, uni tiklashi mumkin. Bu TCE tomonidan qo‘zg‘atilgan anergiya va tinchlik holati bilan bog‘liq genlar ekspressiyasining pasayishi hamda aktivatsiya, sitotoksiklik, proliferatsiya va sitokin javobi bilan bog‘liq genlar ekspressiyasining tiklanishi bilan birga kechadi. Bu hujayralarga G0/G1 fazasidagi to‘xtalishni yengib o‘tish va proliferatsiyaga kirishish imkonini beradi. Ushbu natijalar CD28 signallari IL-2 ishlab chiqarishni kuchaytirish va BACH2 vositachiligidagi repressiyani bartaraf etish orqali anergiya holatini neytrallashini ko‘rsatuvchi so‘nggi tadqiqotlar bilan mos keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Anergiya — bu T-hujayralarning immunologik tolerantlik yoki «uyqu» holati bo‘lib, ular stimulga javob bermaydi, bu terminal toliqishdan farqli o‘laroq, qaytarilishi mumkin bo‘lgan jarayondir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Xulosa qilib aytganda, TCE monoterapiyasi T-hujayralar giporeaktivligiga olib kelishi mumkin, bu esa davolash samaradorligini pasaytiradi. DLL3xCD3 (tarlatamab) bispesifik antitanasi yordamida olingan klinik oldi modellarimiz TCE terapiyasining sinfga xos ta’sirini ko‘rsatadi. BiCo qo‘llanilishi proliferativ salohiyat va sitotoksik faollikni saqlab qoladi, shuningdek, TCE keltirib chiqargan molekulyar belgini yo‘q qiladi. Biz shartli CD28-kostimulyatsiyani immunoterapiya samaradorligini oshirish strategiyasi sifatida ko‘rib chiqamiz. TCE va BiCo kombinatsiyasini o‘rganuvchi klinik sinov 2026-yilda boshlanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Xulosalar klinik oldi modellar va bemorlar namunalarini tahlil qilishga asoslangan; kombinatsiyaning klinik samaradorligi hali bo‘lajak sinovlarda tasdiqlanishi kerak.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"jins-biologik-ozgaruvchi-sifatida\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#jins-biologik-ozgaruvchi-sifatida\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Jins biologik o'zgaruvchi sifatida&lt;/span&gt;&lt;/a&gt;Jins biologik o'zgaruvchi sifatida&lt;/h4&gt;\n&lt;p&gt;Ushbu tadqiqotda faqat metastatik kastratsiyaga chidamli prostata saratoni bilan og'rigan erkak bemorlar ishtirok etdi. In vivo tajribalar urg'ochi sichqonlarda o'tkazildi, chunki bu o'smalarning bir xil o'rnashishini ta'minlaydi va tajriba guruhlari o'rtasidagi o'zgaruvchanlikni kamaytiradi.&lt;/p&gt;\n&lt;h4 id=\"bemor-namunalari-va-hujayra-liniyalari\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#bemor-namunalari-va-hujayra-liniyalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bemor namunalari va hujayra liniyalari&lt;/span&gt;&lt;/a&gt;Bemor namunalari va hujayra liniyalari&lt;/h4&gt;\n&lt;p&gt;PBMC namunalari CC-1 (PSMAxCD3 bispesifik antitanasi) preparatini baholovchi I faza klinik sinovi (NCT04104607) doirasida besh nafar bemordan olindi. Qon CC-1 terapiyasi boshlanishidan oldin va 7 kunlik uzluksiz qo'llashdan keyin olindi: 1-kuni 78 mkg, 2-kuni 215 mkg va 3-7 kunlari kuniga 826 mkg. Hujayralar Biocoll eritmasi yordamida zichlik gradienti sentrifugasiyasi orqali ajratib olindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PBMC (periferik qon mononuklear hujayralari) — bu limfotsitlar va monotsitlarni o'z ichiga olgan qon fraksiyasi bo'lib, immunologik tadqiqotlarda terapiyaga javobni baholash uchun keng qo'llaniladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;LNCaP va SHP-77 hujayra liniyalari DSMZ va ATCC biobanklaridan olindi. LNCaP-E (endoglin ifodalovchi) va LNCaPKO (B7-H3 nokautli) liniyalarini yaratish uchun lentiviral transduksiya qo'llanildi. Kultivatsiya 10 mkg/ml puromitsin bilan, LNCaPKO uchun esa qo'shimcha ravishda 1 mkg/ml geneticin bilan amalga oshirildi. Barcha liniyalar mikoplazma mavjudligi uchun muntazam tekshirildi.&lt;/p&gt;\n&lt;h4 id=\"endoglinga-qarshi-monoklonal-antitanalarni-olish\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#endoglinga-qarshi-monoklonal-antitanalarni-olish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Endoglinga qarshi monoklonal antitanalarni olish&lt;/span&gt;&lt;/a&gt;Endoglinga qarshi monoklonal antitanalarni olish&lt;/h4&gt;\n&lt;p&gt;8 haftalik BALB/c sichqonlari endoglin bilan transfeksiya qilingan Sp2/0-Ag14 hujayralari bilan intraperitoneal immunizatsiya qilindi. Ikki haftalik interval bilan to'rt martagacha immunizatsiya o'tkazildi, hujayralar qo'shilishidan to'rt kun oldin yakuniy buster qilindi. Splenotsitlar PEG 1500 yordamida Sp2/0-Ag14 mieloma hujayralari bilan birlashtirildi. Gibridomalar HAT muhitida tanlab olindi, klonlar oqim sitometriyasi orqali tekshirildi, subklonlandi va kriokonservatsiya qilindi.&lt;/p&gt;\n&lt;h4 id=\"bispesifik-antitanalarni-yaratish-va-tozalash\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#bispesifik-antitanalarni-yaratish-va-tozalash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bispesifik antitanalarni yaratish va tozalash&lt;/span&gt;&lt;/a&gt;Bispesifik antitanalarni yaratish va tozalash&lt;/h4&gt;\n&lt;p&gt;Endoglin, B7-H3 va nazorat MOPC-21 uchun o'zgaruvchan domenlar CHO hujayralarida ekspressiya uchun kodon-optimallashtirildi. Fc-funksiyalarini bostirish uchun LALA (L234A/L235A) va yarim yemirilish davrini uzaytirish uchun YTE (M252Y/S254T/T256E) mutatsiyalariga ega IgG1κ karkasi ishlatildi. CD28 scFv fragmenti glitsin-serin bog'lovchisi orqali biriktirildi. «Knob-into-hole» (KiH) tuzilmasi uchun CH3 domeniga mutatsiyalar kiritildi (knob: T366W; hole: T366S/L368A/Y407V). Tozalash oqsil A affin xromatografiyasi bilan amalga oshirildi, tozalik SDS-PAGE va gel-filtratsiya bilan tekshirildi. Endotoksin darajasi &amp;lt;0,5 U/ml ni tashkil etdi.&lt;/p&gt;\n&lt;h4 id=\"boglanish-kinetikasi-va-affinlik\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#boglanish-kinetikasi-va-affinlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'lanish kinetikasi va affinlik&lt;/span&gt;&lt;/a&gt;Bog'lanish kinetikasi va affinlik&lt;/h4&gt;\n&lt;p&gt;Kinetika va affinlik sirt plazmon rezonansi (SPR) va biosloy interferometriyasi (BLI) usullari bilan o'lchandi. Bog'lanish parametrlari (kon, koff) va dissotsiatsiya konstantalari (K_D) BIAevaluation v4.1 va Octet Data Analysis v11.1 dasturlari yordamida hisoblandi. LNCaP-E va T-hujayralaridagi antigenlar bilan bog'lanish oqim sitometriyasi (BD FACSCanto II, BD FACSCalibur) orqali tahlil qilindi, ma'lumotlar FlowJo'da qayta ishlandi, EC₅₀ qiymatlari esa GraphPad Prism 9 da hisoblandi.&lt;/p&gt;\n&lt;h4 id=\"yagona-hujayrali-transkriptomik-profilash-va-hisoblash-tahlili\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#yagona-hujayrali-transkriptomik-profilash-va-hisoblash-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yagona hujayrali transkriptomik profilash va hisoblash tahlili&lt;/span&gt;&lt;/a&gt;Yagona hujayrali transkriptomik profilash va hisoblash tahlili&lt;/h4&gt;\n&lt;p&gt;Prostata saratoni bilan og‘rigan bemorlarning PBMC namunalarini tayyorlash 10× Genomics Feature Barcode protokoli bo‘yicha amalga oshirildi. Namunalarni multiplekslash va partiya effektlarini cheklash uchun donor hujayralari TotalSeq-C antitanachalari bilan belgilandi (SN 1-jadval). Hujayralar Chromium X tizimi yordamida GEMs ichiga kapsulalandi. 5′ GEX, TCR (VDJ) va SP kutubxonalari Chromium Next GEM Single Cell 5′ HT v2 to‘plamlari yordamida tayyorlandi. Sekvenirlash Illumina NovaSeq 6000 tizimida bajarildi. Ma’lumotlarni qayta ishlash, tekislash (GRCh38-202-A) va hisoblash Cell Ranger 7.1.0 dasturida, vizualizatsiya esa Scanpy 1.11.1 va Seurat yordamida amalga oshirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Multiplekslash usuli turli donorlardan olingan hujayralarni bitta tajribada birlashtirishga imkon beradi, bu esa texnik farqlarni kamaytiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;3 ta hujayradan kamroq ifodalangan genlar, shuningdek mitoxondrial, ribosomal genlar, lncRNA va pseudogenlar tahlildan chiqarib tashlandi. Klasterlash Leiden algoritmi yordamida amalga oshirildi. Ex vivo va in vitro namunalar uchun klasterlash parametrlari: n_pcs 13–25, n_neighbors 25–30, min_dist 0.3–0.5, resolution 0.21–0.63. CD3+ hujayralar subklasterlash uchun n_pcs 5–31, n_neighbors 5–15, min_dist 0.45–0.7 va resolution 0.1–0.4 parametrlari ishlatildi. DEGlar Wilcoxon testi va Benjamini-Hochberg tuzatishi bilan hisoblandi.&lt;/p&gt;\n&lt;p&gt;GSEA tahlili GSEApy prerank funksiyasi (2000 permutatsiya) yordamida CD4+ va CD8+ T-hujayralarida 0 va 8-kunlar o‘rtasidagi funksional o‘zgarishlarni baholash uchun o‘tkazildi. Safford_T_Lymphocyte_Anergie va GSE46242_TH1_VS_ANERGIC_TH1_CD4_TCELL_UP yo‘llari ishlatildi. FDR &amp;lt; 0.05 statistik ahamiyatli deb belgilandi. 8-kuni yuqori ifodalangan genlar SN 1-jadvalda keltirilgan.&lt;/p&gt;\n&lt;h4 id=\"t-hujayralar-proliferatsiyasi\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#t-hujayralar-proliferatsiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;T-hujayralar proliferatsiyasi&lt;/span&gt;&lt;/a&gt;T-hujayralar proliferatsiyasi&lt;/h4&gt;\n&lt;p&gt;Monotsitlardan xoli PBMC bsAbs bilan yoki usiz nishon hujayralar bilan kultivatsiya qilindi. 48 soatdan keyin 3H-metil-timidin (0.5 mCyu/quduq) qo‘shildi va 20 soatdan so‘ng radioaktivlik o‘lchandi. Shu bilan birga, CellTrace Violet (2 mkM) ishlatildi. 3-kuni o‘sma hujayralari va bsAbs yangilandi, proliferatsiya 4 yoki 6-kuni oqim sitometriyasi (CD4, CD8, CD45RO, CD62L) bilan aniqlandi.&lt;/p&gt;\n&lt;h4 id=\"tsitotoksiklik-tahlillari\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#tsitotoksiklik-tahlillari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tsitotoksiklik tahlillari&lt;/span&gt;&lt;/a&gt;Tsitotoksiklik tahlillari&lt;/h4&gt;\n&lt;p&gt;Nishon hujayralar lizisini aniqlash uchun 24 yoki 72 soatlik kultivatsiyadan so‘ng oqim sitometriyasi o‘tkazildi. T-hujayralar (CD4, CD8), aktivlanish (CD69, CD25) va o‘sma hujayralari (EpCAM) 7-AAD yordamida tahlil qilindi. Kalibrlash sharchalari hajm nazorati uchun ishlatildi. Real vaqt rejimida o‘ldirish xCELLigence RTCA tizimi bilan 120 soat davomida kuzatildi.&lt;/p&gt;\n&lt;h4 id=\"tsitokin-sekretsiyasi\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#tsitokin-sekretsiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tsitokin sekretsiyasi&lt;/span&gt;&lt;/a&gt;Tsitokin sekretsiyasi&lt;/h4&gt;\n&lt;p&gt;PBMC va o‘sma hujayralari 24 soatlik inkubatsiyadan so‘ng, IL-2 va IFN-γ darajalari Legendplex to‘plamlari bilan o‘lchandi. Bemor qon plazmasidagi sIL-2R konsentratsiyasi ELISA to‘plami yordamida aniqlandi.&lt;/p&gt;\n&lt;h4 id=\"t-hujayralar-giporeaktivligini-in-vitro-tahlil-qilish\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#t-hujayralar-giporeaktivligini-in-vitro-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;T-hujayralar giporeaktivligini in vitro tahlil qilish&lt;/span&gt;&lt;/a&gt;T-hujayralar giporeaktivligini in vitro tahlil qilish&lt;/h4&gt;\n&lt;p&gt;T-hujayralar giporeaktivligini baholash uchun sog'lom donorlarning periferik qon mononuklear hujayralari (PBMC) o'sma hujayralari bilan 2:1 nisbatda (E:T) kultivatsiya qilindi. Muhitga TCE (1 nM) alohida yoki BiCos (0,5 nM) bilan birgalikda qo'shildi. 4-kuni muhit, o'sma hujayralari va antitanalar almashtirildi. 7-kuni PBMC yana o'sma nishon hujayralari (E:T = 1:1) va TCE bilan (BiCos bilan yoki usiz) stimulyatsiya qilindi. 10-kuni T-hujayralar proliferatsiyasi ³H-timidin qo'shilishi usuli bilan, CD8⁺ T-hujayralar faollashuvi va o'sma hujayralarini yo'q qilish esa oqimli sitometriya yordamida baholandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Oqimli sitometriya — lazerlar va floresan belgilar yordamida minglab alohida hujayralarning fizik va kimyoviy xususiyatlarini tezda aniqlash imkonini beruvchi tahlil usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bemorlarning PBMC sirt markerlari ifodasi (SN 1-rasm, C va D) in vitro stimulyatsiyasiz oqimli sitometriya orqali aniqlandi. Antitanalar SN 2-jadvalda keltirilgan, namunalar avtomatik kompensatsiya hisobiga ega Cytek Aurora spektral sitometrida tahlil qilindi.&lt;/p&gt;\n&lt;h4 id=\"in-vivo-tadqiqotlar\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#in-vivo-tadqiqotlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;In vivo tadqiqotlar&lt;/span&gt;&lt;/a&gt;In vivo tadqiqotlar&lt;/h4&gt;\n&lt;p&gt;Barcha hayvonlar tajribalari SPF (spetsifik patogenlardan xoli) sharoitida o'tkazildi. Yosh va jins bo'yicha moslashtirilgan sichqonlar ishlatildi, ularning sog'lig'i har kuni nazorat qilindi. Belgilangan gumanitar yakuniy nuqtalarga erishilganda sichqonlar evtanaziya qilindi. Tadqiqotda ko'r-ko'rona usuli qo'llanilmagan.&lt;/p&gt;\n&lt;p&gt;Farmakokinetikani baholash uchun 20 mkg konstruksiyalar C57BL/6 sichqonlariga vena ichiga yuborildi va zardobdagi konsentratsiyalar bioluminesan T-hujayra tahlillari (Promega) yordamida aniqlandi. O'smaga qarshi faollikni baholash uchun NSG sichqonlarining o'ng yon tomoniga taxminan 5 mm diametrli o'smalar hosil qilish uchun firefly lutsiferazasi bilan transduksiya qilingan LNCaP-E hujayralari teri ostiga yuborildi. 1, 8 va 15-kunlari sichqonlarga 1×10⁷ inson PBMC, CC-1 (0,8 mkg) bilan yoki BiCo-1, BiCo-2 yoki izotip nazorati (20 mkg) bilan birgalikda vena ichiga yuborildi. Kechiktirilgan BiCo guruhlarida sichqonlar 1-kuni faqat CC-1, 4-kuni BiCo-1 yoki BiCo-2, 8 va 15-kunlari esa CC-1/BiCo kombinatsiyasini oldi. Kechiktirilgan kombinatsiyalangan guruhlarda CC-1 1-kuni, kombinatsiyalangan terapiya esa 8-kuni boshlandi. O'sma o'sishi haftasiga ikki marta nazorat qilindi, diametri 15 mm ga yetganda evtanaziya qilindi. Bioluminesan tasvirlar IVIS Lumina II tizimida (PerkinElmer) olindi va Living Image dasturi yordamida miqdoriy baholandi.&lt;/p&gt;\n&lt;p&gt;Toksiklikni baholash uchun NSG sichqonlariga 20×10⁶ inson PBMC, 20 mkg antitanalar bilan yoki usiz vena ichiga yuborildi. Zardobdagi sitokinlar darajasi 24 soatdan keyin LEGENDplex™ Human Th1 Cytokine Panel (BioLegend) yordamida o'lchandi.&lt;/p&gt;\n&lt;h4 id=\"statistik-tahlil\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#statistik-tahlil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Statistik tahlil&lt;/span&gt;&lt;/a&gt;Statistik tahlil&lt;/h4&gt;\n&lt;p&gt;Ma'lumotlar GraphPad Prism dasturida tahlil qilindi. Natijalar o'rtacha ± standart og'ish (SD) yoki individual qiymatlar sifatida taqdim etilgan. Guruhlararo taqqoslash two-way ANOVA, one-way ANOVA, Styuudent t-testi, Uilkoxon testi yoki Mann-Uitni testi yordamida amalga oshirildi. Normallik Shapiro-Uilk testi, dispersiya gomogenligi esa Braun-Forsayt testi bilan tekshirildi.&lt;/p&gt;\n&lt;h4 id=\"tadqiqotni-tasdiqlash\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#tadqiqotni-tasdiqlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqotni tasdiqlash&lt;/span&gt;&lt;/a&gt;Tadqiqotni tasdiqlash&lt;/h4&gt;\n&lt;p&gt;Metastatik kastratsiyaga chidamli prostata saratoni bilan og'rigan bemorlarning (NCT04104607) va sog'lom donorlarning PBMC namunalari yozma rozilik asosida olindi. Hayvonlar tajribalari «3R» tamoyillariga va 2010/63/EU direktivasiga muvofiq o'tkazildi. Protokollar Tyubingen universiteti (M02/22 G) axloq qo'mitasi tomonidan tasdiqlangan.&lt;/p&gt;\n&lt;h4 id=\"malumotlarning-mavjudligi\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#malumotlarning-mavjudligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ma'lumotlarning mavjudligi&lt;/span&gt;&lt;/a&gt;Ma'lumotlarning mavjudligi&lt;/h4&gt;\n&lt;p&gt;Barcha xom ma'lumotlar Supporting Data Values fayllarida keltirilgan. Yagona hujayra transkriptomik ma'lumotlari GEO (GSE333581) bazasida mavjud.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons-f1.jpg\" alt=\"1-rasm / TCE monoterapiyasi paytida bemor T-hujayralarining funksional buzilishi va transkripsion qayta dasturlashtirili\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm / TCE monoterapiyasi paytida bemor T-hujayralarining funksional buzilishi va transkripsion qayta dasturlashtirilishi (A) mCRPC bilan og'rigan bemorlardan birinchi davolash siklidan oldin va keyin (mos ravishda 1- va 8-kunlarda) PBMC (n=5) yig'ib olindi va har qanday vaqt nuqtasining 100 000 hujayrasi CC-1 yoki izotip nazorat antikorlari (CC-iso) (har biri 1 nM) mavjudligida LNCaP hujayralari bilan (E:T nisbati 1:1) 72 soat davomida inkubatsiya qilindi, shundan so'ng funksional tahlil o'tkazildi. (B-C) T-hujayralar proliferatsiyasi, CD4+ va CD8+ T-hujayralar faollashuvi hamda IFN-γ ajralishi mos ravishda 3H-timidinni o'zlashtirish, oqimli sitometriya va LEGENDplex multipleks tahlillari yordamida aniqlandi (B); LNCaP hujayralarining kamayishi oqimli sitometriya yordamida aniqlandi (C). Alohida bemorlardagi ma'lumotlar uchun 1A-qo'shimcha rasmga qarang. (D) Davolashdan oldin (1, 22, 43, 64-kunlar) va keyin (7, 29, 50, 71-kunlar) ko'rsatilgan vaqt nuqtalarida olingan uch nafar bemorning PBMC'lari nurlantirilgan LNCaP hujayralari va CC-1 (1 nM) bilan inkubatsiya qilindi. 72 soatdan keyin T-hujayralar proliferatsiyasi 3H-timidinni o'zlashtirish yordamida baholandi. Alohida bemorlardagi ma'lumotlar uchun 1C-qo'shimcha rasmga qarang. (E) Bir nechta davolash sikllari davomida ko'rsatilgan vaqt nuqtalarida CC-1 va eruvchan interleykin-2 retseptori (sIL-2R) plazma konsentratsiyalari o'lchandi va zardob darajalari ELISA yordamida aniqlandi. Bir nafar vakil bemorning namunali natijalari ko'rsatilgan. Ikki qo'shimcha bemorning ma'lumotlari uchun 1D-qo'shimcha rasmga qarang. (F) UMAP yordamida vizualizatsiya qilingan scRNA-sekvenirlash ma'lumotlarining Leiden asosidagi klasterlanishi, bazal holatda (1-kun) va terapiyadan keyin (8-kun) yig'ilgan bemor PBMC'laridagi asosiy immun hujayra populyatsiyalarini tasvirlaydi, ular kanonik nasl markerlariga ko'ra izohlandi. UA, belgilanmagan. (G) T-hujayralar tinch holati/aneriyasi, erta faollashuvi va metabolik regulyatorlarida qatnashadigan tanlangan genlarning ekspresiya o'zgarishlarini umumlashtiruvchi nuqtali grafiklar; nuqta hajmi tegishli genlarni ekspresiya qiluvchi hujayralar ulushini ko'rsatadi; rang intensivligi o'rtacha ekspresiyani aks ettiradi. (H) Davolashdan oldingi namunalarga (1-kun) nisbatan kanonik aneriya va giporeaktivlik bilan bog'liq transkripsion dasturlarning sezilarli darajada boyiganini ko'rsatadigan genlar to'plamini boyitish tahlili (GSEA). SAFFORD_T_LYMPHOCYTE_ANERGY yo'li (MSigDB) 8-kungi CD4+ va CD8+ T-hujayralarida sezilarli darajada boyigan. NES, normallashtirilgan boyitish balli; FDR, soxta kashfiyot darajasi. (I) T-hujayralar subklasterlanishi UMAP yordamida vizualizatsiya qilindi, bu terapiyadan keyin paydo bo'ladigan proliferativ, effektorga o'xshash va giporeaktiv populyatsiyalarni o'z ichiga olgan aniq funksional holatlarni aniqladi. (J) Terapiyadan oldingi (1-kun) va terapiyadan keyingi (8-kun) T-hujayralar holatlarining taqsimlanishini illyustratsiya qiluvchi joylashtirish zichligi grafiklari, giporeaktiv va noproliferativ fenotiplarga o'tishni hujjatlashtiradi. Ustunli grafiklar har bir shartdagi klaster taqsimotini ifodalaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons-f2.jpg\" alt=\"2-rasm / BiCO'larni formatni tanlash va funksional tavsifi (A) MOPC-21 nishonsiz antigeniga qaratilgan turli xil bispesi\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm / BiCO'larni formatni tanlash va funksional tavsifi (A) MOPC-21 nishonsiz antigeniga qaratilgan turli xil bispesifik CD28 antikor (bs-CD28) formatlarining sxematik ko'rinishi. Turli xil tetravalent formatlarning umumiy tuzilishi ikkita bivalent bog'lovchi qismni o'z ichiga oladi, ulardan birinchisi IgG magistralining tabiiy N-boshi bilan hosil bo'ladi, ikkinchisi esa ikkita C-uglerod uchida biriktirilgan bitta zanjirli Fv fragmentlaridan (scFvs) iborat. CD28 bog'lovchi qismi tabiiy N-terminal bog'lovchi qismni (1 va 2-variantlar) yoki C-terminal scFv qismini (3 va 4-variantlar) tashkil qiladi. C-terminal scFv qismlari CH3- (1 va 3-variantlar) yoki CL-domenlariga (2 va 4-variantlar) biriktirilgan. Magistral nospetsifik Fc-gamma retseptorlari ta'sirining oldini olish uchun Fc funksiyasi o'chirilgan IgG1k hisoblanadi. (B) Nurlantirilgan LNCaP hujayralari CC-1 (25 pM) va ko'rsatilgan bs-CD28 konstruktlari (10 nM) mavjudligida 4:1 E:T nisbatida PBMC (n=8) bilan kultivatsiya qilindi. Proliferatsiya uch kundan keyin 3H-timidinni o'zlashtirish orqali o'lchandi. Ma'lumotlar o'rtacha ± SD sifatida ko'rsatilgan. (C) Nurlantirilgan LNCaP-E hujayralari CC-1 (25 pM) va bs-CD28-4 konstruktlarining ko'rsatilgan konsentratsiyalari (endoglinga qaratilgan Kro22 va Kro23; B7-H3 ga qaratilgan 8H8 va 7C4) mavjudligida PBMC (n=2 donor) bilan inkubatsiya qilindi. Uch kundan so'ng proliferatsiya 3H-timidinni o'zlashtirish tahlili yordamida baholandi. (D) NSG sichqonlariga (har bir guruh uchun n=4) intraperitoneal ravishda 2×10^7 inson PBMC va tomir ichiga 20 µg BiCo-1 yoki BiCo-2 yolg'iz yoki 0,8 µg CC-1 bilan birgalikda yuborildi. UCHT1 antikori (anti-CD3) ijobiy nazorat sifatida ishlatildi. Zirobdagi sitokin darajalari LEGENDplex yordamida 24 soatdan keyin olingan qon namunalarida o'lchandi. (E) PBMC (n=6) nurlantirilgan LNCaP-E hujayralari va ko'rsatilgan konstruktlar bilan kultivatsiya qilindi, shundan so'ng 3H-timidinni o'zlashtirish orqali proliferatsiya tahlili o'tkazildi. Chapda: BiCo-iso, BiCo-1 yoki BiCo-2 (barchasi 0,5 nM da) mavjudligida CC-1 dozasini titrlash. O'ngda: CC-1 yoki CC-iso (ikkitasi ham 25 pM) mavjudligida BiCo-1 va BiCo-2 dozasini titrlash. O'qlar keyingi tajribalar uchun tanlangan konsentratsiyalarni ko'rsatadi. Ma'lumotlar o'rtacha ± SD sifatida ko'rsatildi. (F) PBMC (n=5 donor) LNCaP-E hujayralari bilan CC-1 (25 pM, CC-1low) va ko'rsatilgan BiCo molekulalari (0,5 nM) mavjudligida 1:1 E:T nisbatida kultivatsiya qilindi. Nishon hujayralarining kamayishi 72 soatdan keyin oqimli sitometriya yordamida miqdoriy aniqlandi. (G) Monotsitlardan tozalanmagan PBMC, CC-1 (25 pM, CC-1low) va BiCo (0,5 nM) mavjudligida xCELLigence tizimidan foydalangan holda LNCaP-E o'sma hujayralari o'sishini real vaqt rejimida monitoring qilish. (H) BiCo formati endoglinga (BiCo-1) yoki B7-H3 ga (Bico-2) qaratilgan bivalent nishonlash qismi va bivalent CD28 bog'lovchi qismiga (αCD28) ega A rasmida tasvirlangan 4-variantdan iborat. KiH formati nishonlash qismlarini (endoglin yoki B7-H3) va CD28 ni monovalent tarzda bog'lovchi ikkita tabiiy IgG zanjiridan iborat. Ikkala formatda ishlatiladigan endoglin, B7-H3 va CD28 bog'lovchilari bir xil. (I) PBMC (n=4 donor) CC-1 yoki izotip nazorati (CC-iso) (ikkitasi ham 25 pM) mavjudligida ko'rsatilgan BiCo-1, BiCo-2, KiH-1 yoki KiH-2 konsentratsiyalari bilan nurlantirilgan LNCaP-E hujayralari bilan kultivatsiya qilindi, shundan so'ng 3H-timidinni o'zlashtirish orqali proliferatsiya tahlili o'tkazildi. Ma'lumotlar o'rtacha ± SD sifatida ko'rsatilgan. O'qlar keyingi tajribalar uchun tanlangan konsentratsiyani ko'rsatadi. (J-M) CellTrace Violet bilan belgilangan monotsitlardan tozalangan PBMC ko'rsatilgandek CC-1 (25 pM, CC-1low) va BiCo/KiH (ikkitasi ham 5 nM) bilan LNCaP-E hujayralari bilan 1:1 E:T nisbatida kultivatsiya qilindi. Muhit, nishon hujayralari va konstruktlar 4-kuni to'ldirildi, shundan so'ng oqimli sitometrik tahlil o'tkazildi. (J) 4 kundan keyin olingan vakil proliferatsiya profillari (chap panellar). Proliferatsiyalanuvchi CD4+ T-hujayralari va CD8+ T-hujayralarining bo'linish indeksi (n=6 donor) FlowJo yordamida hisoblandi (o'ng panellar). (K-L) 7-kuni aniqlangan CD4+ T-hujayralari (K) va CD8+ T-hujayralari (L) uchun vakil tSNE grafikalari (chapda) va T-hujayralari kichik populyatsiyalari soni (o'ngda) (n=6 donor). (M) O'sma hujayralarini yo'q qilish 7-kuni baholandi (n=5 donor). (N) C57Bl/6 sichqonlariga (har bir guruh uchun n=4 sichqoncha) 20 µg BiCo-1 va BiCo-2 yuborildi, shundan so'ng Promega tahlili yordamida ko'rsatilgan vaqt nuqtalarida zardob konsentratsiyalari aniqlandi. (O-P) Yon tomonida o'rnatilgan LNCaP-E o'smalari bo'lgan NSG sichqonlariga (~4 mm diametrli) inson PBMC'lari ko'chirib o'tkazildi va CC-1 (0,8 µg), BiCo-1, BiCo-2 yoki BiCo-iso (20 µg) tomir ichiga yuborildi; o'sma o'sishi haftasiga ikki marta nazorat qilindi. (O) TCE va BiCo bilan kombinatsiyalangan davolash 1, 8 va 15-kunlarda qo'llanildi. Kunning vakil bioluminestsensiya tasvirlari (chap panel), shtangensirkul yordamida aniqlangan o'sma hajmi (o'ng panel) ko'rsatilgan. Ma'lumotlar har bir guruh uchun n=5 sichqonchani ifodalaydi. (P) BiCo bilan davolashni kechiktirish ta'sirini o'rganish uchun hayvonlarga 1-kuni CC-1, so'ngra 4-kuni BiCo qo'llanildi va 8-kundan boshlab birlashtirilgan davolash boshlandi (kechiktirilgan BiCo kohortlari); muqobil ravishda, sichqonlarga 1-kuni CC-1, so'ngra 8-kundan boshlab birlashtirilgan davolash qo'llanildi (kechiktirilgan CC-1 + BiCo kohortlari). O'sma hajmi shtangensirkul o'lchovi yordamida aniqlandi. Ma'lumotlar har bir guruh uchun n=5 sichqonchani ifodalaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons-f3.jpg\" alt=\"3-rasm / BiCo tomonidan TCE-induktsiyalangan T-hujayralari giporeaktivligini qaytarish va oldini olish (A) PBMC'lar bemo\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm / BiCo tomonidan TCE-induktsiyalangan T-hujayralari giporeaktivligini qaytarish va oldini olish (A) PBMC'lar bemorlardan TCE bilan davolashdan oldin va keyin (mos ravishda 1- va 8-kunlarda) yig'ib olindi, ex vivo ravishda yolg'iz CC-1 yoki BiCo bilan birgalikda inkubatsiya qilindi va keyinchalik funksional tahlilga duchor qilindi. (B) Bemorlardan olingan PBMC (n=5) 1 nM CC-1 mavjudligida yoki yo'qligida 0,5 nM BiCo-1, BiCo-2 yoki izotip nazorati (BiCo-iso) bilan 1:1 E:T nisbatida LNCaP-E o'sma hujayralari bilan kultivatsiya qilindi. 72 soatdan keyin T-hujayralar proliferatsiyasi 3H-timidinni o'zlashtirish orqali miqdoriy aniqlandi, o'sma hujayralarini yo'q qilish oqimli sitometriya yordamida aniqlandi. (C) Davolashdan oldin va keyin olingan uch nafar bemorning PBMC'lari (keyingi sikllarning 1- va 8-kunlari; 1D-rasmdagi sxemaga qarang) yolg'iz CC-1 (5 nM) yoki BiCo-1 (5 nM) bilan birga inkubatsiya qilindi. 72 soatdan keyin T-hujayralar proliferatsiyasi 3H-timidinni o'zlashtirish yordamida baholandi. (D) Terapiyadan keyin (8-kun) yig'ilgan va LNCaP-E va 1 nM CC-1 bilan 0,5 nM BiCo bilan yoki BiCo'siz in vitro sharoitida 3 kun davomida inkubatsiya qilingan bemor PBMC namunalari ichidagi T-hujayra populyatsiyalarini aks ettiruvchi, UMAP yordamida vizualizatsiya qilingan scRNA-seq ma'lumotlarining Leiden asosidagi subklasterlanishi, kanonik nasl markerlari yordamida izohlandi. T-hujayralar subklasterlanishining UMAP vizualizatsiyasi, aniq funksional T-hujayra holatlarini ajratib ko'rsatdi. (E) T-hujayra faollashuvi, sitotoksiklik, proliferatsiya va tinch holatda qatnashadigan tanlangan genlarning vaqtinchalik ekspresiya o'zgarishlarini umumlashtiruvchi nuqtali grafiklar. Nuqta hajmi tegishli genni ekspresiya qiluvchi hujayralar ulushini ko'rsatadi; va rang intensivligi o'rtacha ekspresiyani aks ettiradi. (F-G) Faqat CC-1 yoki CC-1+BiCo bilan in vitro ishlov berilgan bemor T-hujayralarining (8-kun) holat taqsimotidagi siljishlarni tasvirlovchi zichlik grafiklari (F), proliferativ fenotiplarga aniq o'tishni namoyish etadi. (G) Eksperimental sharoitlarda klaster taqsimotini tasvirlovchi ustunli grafiklar. (H) PBMC (n=4) CC-1 (1 nM) mavjudligida 1:2 E:T nisbatida LNCaP-E hujayralari bilan kultivatsiya qilindi; surunkali ta'sirni taqlid qilish uchun muhit, nishon hujayralari va konstruktlar 4-kuni to'ldirildi. 7-kuni PBMC'lar yolg'iz CC-1 (1 nM) yoki ko'rsatilgan BiCo konstruktlari (0,5 nM) bilan birgalikda 1:1 E:T nisbatida LNCaP-E hujayralari bilan qayta rag'batlantirildi. 10-kuni T-hujayralar proliferatsiyasi 3H-timidinni o'zlashtirish orqali baholandi va o'sma hujayralarini yo'q qilish oqimli sitometriya yordamida baholandi. (I) PBMC (n=4) CC-1 (1 nM) mavjudligida yoki yo'qligida yolg'iz yoki BiCo konstruktlari (0,5 nM) bilan birgalikda 1:2 E:T nisbatida LNCaP-E hujayralari bilan kultivatsiya qilindi. Muhit, nishon hujayralari va konstruktlar 4- va 7-kunlarda to'ldirildi (7-kuni LNCaP-E hujayralari E:T nisbati 1:1). 10-kuni T-hujayralar proliferatsiyasi 3H-timidinni o'zlashtirish orqali baholandi va o'sma hujayralarini yo'q qilish oqimli sitometriya yordamida baholandi. (J) PBMC (n=3) tarlatamab (1 nM) mavjudligida 1:2 E:T nisbatida SHP-77 hujayralari bilan kultivatsiya qilindi. Muhit va nishon hujayralari 4-kuni to'ldirildi. Giporeaktivlik induksiyasiga taqlid qiluvchi 7-kungacha bo'lgan ta'sirdan so'ng, PBMC'lar tarlatamab (1 nM) mavjudligida yoki BiCo-2 (0,5 nM) bilan birgalikda 1:1 E:T nisbatida SHP hujayralari bilan qayta rag'batlantirildi. Proliferatsiya 10-kuni 3H-timidinni o'zlashtirish orqali o'lchandi va o'sma hujayralarini yo'q qilish oqimli sitometriya yordamida baholandi.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tce&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;terapiyasida&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;t-hujayralar&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;charchashi&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=
