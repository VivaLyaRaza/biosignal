            {"data":{"leading":false,"html":"&lt;p&gt;Sonlardagi maqolalardan tushunchalar: har biriga alohida maqola — bu nima, tadqiqotchilar u haqida qanday yozadi, nima bilan bog'liq va qayerda uchraydi.&lt;/p&gt;\n&lt;p&gt;446 ta tushuncha.&lt;/p&gt;\n&lt;h2 id=\"mutaxassislik\"&gt;&lt;a href=\"concepts/index.html#mutaxassislik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mutaxassislik&lt;/span&gt;&lt;/a&gt;Mutaxassislik&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-brain.html\"&gt;Miya va asab tizimi&lt;/a&gt; — неврология; нейронаука; поведение и познание животных&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-mind.html\"&gt;Ruhiyat va xulq-atvor&lt;/a&gt; — медицина зависимостей; психиатрия и клиническая психология&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-cancer.html\"&gt;Saraton va onkologiya&lt;/a&gt; — биология рака; гематология; клиническая онкология&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-health.html\"&gt;Infeksiyalar va epidemiologiya&lt;/a&gt; — вич и спид; гигиена труда и среды; инфекционные болезни; общественное и глобальное здоровье…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-medicine.html\"&gt;Tibbiyot va salomatlik&lt;/a&gt; — акушерство и гинекология; гастроэнтерология; гериатрия; дерматология…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-immunity.html\"&gt;Mikroblar va immunitet&lt;/a&gt; — аллергология; иммунология; микробиология&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-genes.html\"&gt;Genlar va genomlar&lt;/a&gt; — генетика; геномика; геномная медицина&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-compute.html\"&gt;Biologiyada hisoblash va SI&lt;/a&gt; — биоинформатика; медицинская информатика; системная биология&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-cells.html\"&gt;Hujayralar va molekulalar&lt;/a&gt; — биология развития; биофизика; биохимия; клеточная биология…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-biotech.html\"&gt;Biotexnologiyalar&lt;/a&gt; — биоинженерия; синтетическая биология&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-nature.html\"&gt;Tabiat, evolyutsiya va ekologiya&lt;/a&gt; — биология растений; зоология; палеонтология; эволюционная биология…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"jarayon\"&gt;&lt;a href=\"concepts/index.html#jarayon\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Jarayon&lt;/span&gt;&lt;/a&gt;Jarayon&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-neurology.html\"&gt;Неврология&lt;/a&gt; — болезни нервной системы: инсульт, эпилепсия, нейродегенерация&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-neuroscience.html\"&gt;Нейронаука&lt;/a&gt; — как устроены нейроны, сети мозга и память&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-animal_behavior_and_cognition.html\"&gt;Поведение и познание животных&lt;/a&gt; — обучение, решения и общение у животных&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-addiction_medicine.html\"&gt;Медицина зависимостей&lt;/a&gt; — алкоголь, никотин, опиоиды: механизмы и помощь&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-psychiatry_and_clinical_psychology.html\"&gt;Психиатрия и клиническая психология&lt;/a&gt; — депрессия, тревога, шизофрения, аутизм и их лечение&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cancer_biology.html\"&gt;Биология рака&lt;/a&gt; — как клетка становится опухолью и как опухоль уходит от защиты&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-hematology.html\"&gt;Гематология&lt;/a&gt; — кровь и кроветворение, лейкозы и анемии&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-oncology.html\"&gt;Клиническая онкология&lt;/a&gt; — диагностика и лечение рака у пациентов&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-hiv_aids.html\"&gt;ВИЧ и СПИД&lt;/a&gt; — профилактика, терапия и поиск излечения&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-occupational_and_environmental_health.html\"&gt;Гигиена труда и среды&lt;/a&gt; — воздух, вода, химия и работа как факторы здоровья&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-infectious_diseases.html\"&gt;Инфекционные болезни&lt;/a&gt; — вирусы, бактерии и паразиты у людей: течение и лечение&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-public_and_global_health.html\"&gt;Общественное и глобальное здоровье&lt;/a&gt; — здоровье популяций, системы здравоохранения&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-nutrition.html\"&gt;Питание&lt;/a&gt; — еда, диеты и обмен веществ&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-sexual_and_reproductive_health.html\"&gt;Сексуальное и репродуктивное здоровье&lt;/a&gt; — фертильность, контрацепция, беременность&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-epidemiology.html\"&gt;Эпидемиология&lt;/a&gt; — кто и почему болеет: когорты, риски, распространение&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-obstetrics_and_gynecology.html\"&gt;Акушерство и гинекология&lt;/a&gt; — беременность, роды, женское здоровье&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-gastroenterology.html\"&gt;Гастроэнтерология&lt;/a&gt; — пищеварение, печень, кишечник&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-geriatric_medicine.html\"&gt;Гериатрия&lt;/a&gt; — старение и болезни пожилых&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-dermatology.html\"&gt;Дерматология&lt;/a&gt; — кожа&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-intensive_care_and_critical_care_medicine.html\"&gt;Интенсивная терапия&lt;/a&gt; — реанимация, сепсис, ИВЛ&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cardiovascular_medicine.html\"&gt;Кардиология&lt;/a&gt; — сердце и сосуды&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-clinical_trials.html\"&gt;Клинические испытания&lt;/a&gt; — проверка лечения на людях: дизайн и результаты&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-radiology_and_imaging.html\"&gt;Лучевая диагностика&lt;/a&gt; — КТ, МРТ, УЗИ и ИИ для снимков&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pain_medicine.html\"&gt;Медицина боли&lt;/a&gt; — механизмы и лечение боли&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-nephrology.html\"&gt;Нефрология&lt;/a&gt; — почки&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-ophthalmology.html\"&gt;Офтальмология&lt;/a&gt; — глаза и зрение&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pathology.html\"&gt;Патология&lt;/a&gt; — что меняется в тканях при болезни&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pediatrics.html\"&gt;Педиатрия&lt;/a&gt; — здоровье детей&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-respiratory_medicine.html\"&gt;Пульмонология&lt;/a&gt; — лёгкие и дыхание&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-rheumatology.html\"&gt;Ревматология&lt;/a&gt; — суставы и аутоиммунные болезни&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-toxicology.html\"&gt;Токсикология&lt;/a&gt; — вредные вещества и их действие&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-transplantation.html\"&gt;Трансплантология&lt;/a&gt; — пересадка органов и тканей&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-urology.html\"&gt;Урология&lt;/a&gt; — мочевая система&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pharmacology_and_toxicology.html\"&gt;Фармакология и токсикология&lt;/a&gt; — как действуют лекарства и яды&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pharmacology_and_therapeutics.html\"&gt;Фармакотерапия&lt;/a&gt; — лекарства в клинике&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-physiology.html\"&gt;Физиология&lt;/a&gt; — как работают органы и системы тела&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-surgery.html\"&gt;Хирургия&lt;/a&gt; — операции и их исходы&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-endocrinology.html\"&gt;Эндокринология&lt;/a&gt; — гормоны, диабет, щитовидная железа&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-allergy_and_immunology.html\"&gt;Аллергология&lt;/a&gt; — аллергии и иммунодефициты в клинике&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-immunology.html\"&gt;Иммунология&lt;/a&gt; — как иммунитет распознаёт и уничтожает угрозы&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-microbiology.html\"&gt;Микробиология&lt;/a&gt; — бактерии, вирусы, грибы и микробиомы&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-genetics.html\"&gt;Генетика&lt;/a&gt; — наследственность и мутации&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-genomics.html\"&gt;Геномика&lt;/a&gt; — геномы целиком: секвенирование, регуляция, вариации&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-genetic_and_genomic_medicine.html\"&gt;Геномная медицина&lt;/a&gt; — генетика в диагностике и лечении&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bioinformatics.html\"&gt;Биоинформатика&lt;/a&gt; — алгоритмы и программы для биологических данных&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-health_informatics.html\"&gt;Медицинская информатика&lt;/a&gt; — данные пациентов, ИИ в клинике&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-systems_biology.html\"&gt;Системная биология&lt;/a&gt; — клетка и организм как сеть взаимодействий&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-developmental_biology.html\"&gt;Биология развития&lt;/a&gt; — как из клетки вырастает организм&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-biophysics.html\"&gt;Биофизика&lt;/a&gt; — физика молекул и клеток, структуры белков&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-biochemistry.html\"&gt;Биохимия&lt;/a&gt; — ферменты и реакции живого&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cell_biology.html\"&gt;Клеточная биология&lt;/a&gt; — устройство и жизнь клетки&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-molecular_biology.html\"&gt;Молекулярная биология&lt;/a&gt; — ДНК, РНК и белки в работе&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bioengineering.html\"&gt;Биоинженерия&lt;/a&gt; — устройства, материалы и ткани из живого&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-synthetic_biology.html\"&gt;Синтетическая биология&lt;/a&gt; — проектирование генетических схем и организмов&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-plant_biology.html\"&gt;Биология растений&lt;/a&gt; — рост, защита и урожай растений&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-zoology.html\"&gt;Зоология&lt;/a&gt; — животные: строение и образ жизни&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-paleontology.html\"&gt;Палеонтология&lt;/a&gt; — древняя жизнь по окаменелостям и ДНК&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-evolutionary_biology.html\"&gt;Эволюционная биология&lt;/a&gt; — как возникают и меняются виды&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-ecology.html\"&gt;Экология&lt;/a&gt; — виды, сообщества и экосистемы&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"atama\"&gt;&lt;a href=\"concepts/index.html#atama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Atama&lt;/span&gt;&lt;/a&gt;Atama&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/17-estradiol.html\"&gt;17β-эстрадиол&lt;/a&gt; — Gen ekspressiyasini modulyatsiya qilish va mutatsiyalar natijasida yuzaga keladigan neyron giperqo'zg'aluvchanligi fenotiplarini tuzatish…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/18s-rrna.html\"&gt;18S рРНК&lt;/a&gt; — B. mandrillaris amebasini LAMP usuli bilan aniqlash uchun marker sifatida ishlatiladigan genetik nishon.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aav.html\"&gt;AAV&lt;/a&gt; — Ishda terapiya maqsadida sog'lom SIL1 genini markaziy asab tizimiga yetkazish uchun ishlatiladigan virusli vektor.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vektor-aav-php-eb.html\"&gt;AAV-PHP.eB vektori&lt;/a&gt; — Terapevtik genetik materialni markaziy asab tizimiga samarali yetkazib berishga qodir bo'lgan sun'iy ravishda yaratilgan virusli tashuvchi…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ab-initio-rekonstruktsiya.html\"&gt;Ab initio rekonstruksiya&lt;/a&gt; — Zarrachalarning yo'nalishi haqida oldindan ma'lumot bo'lmaganda 3D-strukturani tiklash usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/metod-ab-initio.html\"&gt;Ab initio usuli&lt;/a&gt; — Ma’lum shablonlar yoki zarralar yo‘nalishlarisiz, «noldan» struktura qurish usuli bo‘lib, u katta hisoblash resurslarini talab qiladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ablyatsiya.html\"&gt;Ablyatsiya&lt;/a&gt; — Modelning har bir komponenti yakuniy natijaga qanday hissa qo'shishini tushunish uchun ularni ketma-ket o'chirib tashlash yoki o'zgartirish…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/adam.html\"&gt;Adam&lt;/a&gt; — Har bir parametr uchun o‘rganish tezligini avtomatik moslashtiruvchi optimallashtirish algoritmi bo‘lib, u neyron tarmoqlarning tezroq…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/agaroznye-fantomy.html\"&gt;Agaroz fantomlar&lt;/a&gt; — Miya to‘qimalarining fizik xususiyatlarini taqlid qiluvchi gel modellari bo‘lib, ular dori yetkazib berish aniqligini tekshirish uchun…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aha-rating.html\"&gt;Aha-effekt»&lt;/a&gt; — Kognitiv noaniqlik hal qilinganda to‘satdan yuzaga keladigan tushunish yoki kashfiyot hissi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aha-experience.html\"&gt;Aha hissiyoti&lt;/a&gt; — Noaniqlik bartaraf etilganda yoki yashirin ma'no tushunilganda yuzaga keladigan to'satdan tushunish yoki intssayt holatidir.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/akap11.html\"&gt;AKAP11&lt;/a&gt; — PKA oqsil kinazasini bog'lovchi va hujayra ichidagi signallarni muvofiqlashtiruvchi ankraj oqsilini kodlovchi gen.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aktinomitsin-d.html\"&gt;Aktinomitsin D&lt;/a&gt; — RNK sintezini to'xtatuvchi modda bo'lib, RNKning yarim yemirilish davrini aniqlash uchun qo'llaniladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ap-1.html\"&gt;AP-1&lt;/a&gt; — Transkripsion omillar kompleksi boʻlib, u BTCE taʼsirida Treglarni sitotoksik dasturga oʻtkazishda asosiy rol oʻynaydi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/apfc.html\"&gt;aPFC&lt;/a&gt; — Rejalashtirish, o‘z-o‘zini anglash va diqqatni boshqarish kabi yuqori kognitiv funksiyalar uchun javobgar bo‘lgan miya sohasi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/artr-seq.html\"&gt;ARTR-seq&lt;/a&gt; — Teskari transkripsiya jarayonida biotin bilan belgilangan nukleotidlarni to‘g‘ridan-to‘g‘ri kiritish orqali ma’lum bir oqsil bilan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/amr.html\"&gt;Ashwell-Morell retseptori&lt;/a&gt; — Desialatsiyalangan trombotsitlarni bog'laydigan va JAK2-STAT3 signal yo'lini faollashtiradigan jigar retseptori.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aso.html\"&gt;ASO&lt;/a&gt; — ASO (antisens oligonukleotidlari) — bu RNK bilan bog‘lanib, uning translyatsiyasini bloklashi yoki splicing jarayonini o‘zgartirishi mumkin…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/atac-seq.html\"&gt;ATAC-seq&lt;/a&gt; — Xromatinning ochiqligini tahlil qilish usuli bo'lib, hujayrada qaysi genlar faol ekanligini aniqlashga yordam beradi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/advanced-therapy-medicinal-products.html\"&gt;ATMP&lt;/a&gt; — Biologik preparatlar, shu jumladan hujayra va gen terapiyasi agentlari, miya to'qimalariga yuqori aniqlik bilan yetkazib berishni talab…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/area-under-the-curve.html\"&gt;AUC&lt;/a&gt; — Klassifikator sifatini o'lchovchi metrika bo'lib, modelning tasodifiy ijobiy obyektni tasodifiy salbiy obyektga nisbatan to'g'ri tartiblash…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rolling-circle-replication.html\"&gt;Aylanma halqa mexanizmi&lt;/a&gt; — Halqasimon RNKlarning ko'payish mexanizmi, bunda uzun multimer zanjirlar sintezi sodir bo'ladi va keyinchalik ular ribozimlar tomonidan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/metod-basescope.html\"&gt;BaseScope usuli&lt;/a&gt; — In situ gibridizatsiyaning yuqori sezgir turi bo'lib, u qisqa zondlar yordamida alohida RNK molekulalarini, shu jumladan halqali RNK…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bayesovskiy-vyvod.html\"&gt;Bayescha yondashuv&lt;/a&gt; — Haddan tashqari moslashuvchan modellarni jazolaydigan va barcha yashirin sabablar bo'yicha ehtimolliklarni integratsiya qiladigan statistik…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bindcraft.html\"&gt;BindCraft&lt;/a&gt; — Yuqori resurs talab qiladigan oqsil dizayni usuli bo'lib, u uchun to'plangan hisoblash xarajatlari va o'tgan iteratsiyalarning…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/biological-replicate.html\"&gt;Biologik takroriylik&lt;/a&gt; — Mustaqil biologik manbalardan (masalan, turli hujayra kulturalari yoki hayvonlar) olingan namunalar bo'lib, ular natijalarning…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/blastn.html\"&gt;BLASTn&lt;/a&gt; — Nukleotid ketma-ketliklarini ma’lumotlar bazasidagi boshqa ketma-ketliklar bilan solishtirish uchun ishlatiladigan algoritmdir.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ld.html\"&gt;Bog‘liqlik&lt;/a&gt; — Turli lokuslardagi allellarning tasodifiy bo‘lmagan assotsiatsiyasi; agar variantlar kuchli LD holatida bo‘lsa, qaysi biri kasallikning…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/blood-oxygen-level-dependent.html\"&gt;BOLD-signal&lt;/a&gt; — Qon kislorod darajasining o‘zgarishiga asoslangan miya faolligi ko‘rsatkichi. Idrok naqshlari o‘xshashligi miya inson «ko‘rayotgan» narsani…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/brier-score.html\"&gt;Brier bali&lt;/a&gt; — Ehtimollik prognozlarining aniqligini baholovchi metrika bo'lib, nolga yaqin qiymatlar mukammal kalibrlashni bildiradi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/btce.html\"&gt;BTCE&lt;/a&gt; — Saraton hujayralari va T-limfotsitlarni bogʻlab, immunitet tizimini oʻsimtaga qarshi kurashishga majbur qiluvchi sunʼiy oqsillar.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/combined-annotation-dependent-depletion.html\"&gt;CADD&lt;/a&gt; — Genetik variantlarning patogenligini baholovchi metrika; ≥20 qiymati variant eng zararli 1% ga kirishini bildiradi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/causalforestdml.html\"&gt;CausalForestDML&lt;/ ck-splicing (teskari splaysing) — bu ekzonning 3'-uchini o'sha yoki undan yuqorida joylashgan ekzonning 5'-uchi bilan birlashtirib…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thm.html\"&gt;THM&lt;/a&gt; — Qalqonsimon bez gormonlarining metabolik yo'llarida hosil bo'ladigan moddalar, ularning qondagi darajasi saraton tashxisida qo'llaniladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tm-score.html\"&gt;TM-score&lt;/a&gt; — Global strukturaviy o'xshashlik metriki, RMSD ga qaraganda mahalliy og'ishlarga kamroq sezgir, 0 dan 1 gacha qiymatlarni qabul qiladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/transgennye-myshi.html\"&gt;Transgen sichqonlar&lt;/a&gt; — Genetik muhandislik yordamida ma’lum bir gen kiritilgan yoki o‘zgartirilgan hayvonlar.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tregs.html\"&gt;Tregs&lt;/a&gt; — FOXP3 markerini ifodalovchi T-hujayralar subpopulyatsiyasi bo'lib, odatda immunitetni bostiradi, ammo BTCE terapiyasi vaqtida sitotoksik…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ied.html\"&gt;Tutqanoqlararo epileptiform razryadlar&lt;/a&gt; — Tutqanoq xurujlari orasida miyada paydo bo'ladigan patologik elektr impulslari, ularning chastotasi uyqu beqarorligi bilan ortadi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/structured-output.html\"&gt;Tuzilgan chiqish&lt;/a&gt; — Sun'iy intellekt modelining javoblarini qat'iy oldindan belgilangan qolipda (masalan, JSON formatida) shakllantirishni ta'minlaydigan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/umi.html\"&gt;UMI&lt;/a&gt; — RNK yoki DNK molekulalarini amplifikatsiyadan oldin belgilash uchun ishlatiladigan qisqa nukleotidlar ketma-ketligi bo‘lib, u haqiqiy…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/unc13a.html\"&gt;UNC13A&lt;/a&gt; — BAS rivojlanishida ishtirok etadigan gen, undan terapiya samaradorligining biomarkeri sifatida ishlatiladigan o'ziga xos halqali RNK hosil…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vae.html\"&gt;VAE&lt;/a&gt; — Murakkab ma'lumotlarni ixcham «latent» fazoga siqib t;a href=\"concepts/basolateral-amygdala.html\"&gt;Базолатеральная миндалина&lt;/a&gt; — Limbik tizimga kiruvchi miya sohasi, uning faoliyati tahdidlardan qochish reaksiyalari bilan bog'liq.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/de-novo-proteins.html\"&gt;Белки de novo&lt;/a&gt; — Hisoblash usullari yordamida noldan yaratilgan, belgilangan tuzilma va funksiyalarga ega oqsil molekulalari.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/betaviroid-like-rnas.html\"&gt;бетавироидоподобные РНК&lt;/a&gt; — Har bir qutb zanjirida ribozim va ochiq o'qish ramkasi mavjudligi bilan ajralib turadigan kodlovchi halqasimon RNKlar sinfi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bispecific-t-cell-engagers.html\"&gt;Биспецифические Т-клеточные рекрутеры&lt;/a&gt; — T-hujayralar retseptorlarini (CD3) stimullash orqali ularni o'sma hujayralariga qarshi yo'naltiruvchi preparatlar.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/globus-pallidus-internus.html\"&gt;Бледный шар внутренний&lt;/a&gt; — Qora moddaga tutashgan miya yadrosi, uning faoliyati ushbu ishda nazorat sohasi sifatida ishlatilgan.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gaucher-disease.html\"&gt;Болезнь Гоше&lt;/a&gt; — GBA1 genidagi mutatsiyalar tufayli glyukotserebrozidaza fermentining yetishmovchiligidan kelib chiqadigan, lipidlarning to'planishiga olib…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/occam-s-razor.html\"&gt;Бритва Оккама&lt;/a&gt; — Boshqa teng sharoitlarda murakkabroq tushuntirishlarga qaraganda oddiyroq tushuntirishlarga ustunlik berish kerak degan tamoyil.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/superior-temporal-cortex.html\"&gt;верхняя височная кора&lt;/a&gt; — Miyaning multisensor sohasi bo'lib, birlamchi vizual korteks uchun pastga yo'naltirilgan teskari aloqa manbai bo'lib xizmat qiladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/viroid-like-rnas.html\"&gt;вироидоподобные РНК&lt;/a&gt; — Bir zanjirli halqasimon RNK genomiga ega infeksion agentlar, ular ko'pincha aylanma halqa mexanizmi я дуга&lt;/a&gt; — Motivatsiyalangan o'rganishning fundamental yo'li bo'lib, u ichki holatlarning ketma-ketligini anglatadi: qiziquvchanlikdan tushuncha va…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/effector-cd8-t-lymphocytes.html\"&gt;Эффекторные CD8+ Т-лимфоциты&lt;/a&gt; — T-hujayralarning subpopulyatsiyasi bo'lib, ularda KRAS geni anormal tarzda ifodalanadi, bu ularning sitotoksikligini oshiradi, charchashiga…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"usul\"&gt;&lt;a href=\"concepts/index.html#usul\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usul&lt;/span&gt;&lt;/a&gt;Usul&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/1d-cnn.html\"&gt;1D-CNN&lt;/a&gt; — Ma'lumotlardan mahalliy spektral xususiyatlar va global qonuniyatlarni ajratib olish uchun ishlatiladigan neyron tarmoq arxitekturasi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/crispr-screening.html\"&gt;CRISPR-скрининг&lt;/a&gt; — CRISPR-skrining — bu CRISPR/Cas9 tizimi yordamida hujayralardagi minglab genlarni ketma-ket o‘chirish (nokaut) yoki faollashtirish orqali…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fold-em.html\"&gt;Fold'EM&lt;/a&gt; — Oqsil atom tuzilmalarini tiklash uchun freymvork, generativ modellardan olingan apriori bilimlarni bevosita zarrachalar tasvirlari bilan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vis-nir.html\"&gt;Vis-NIR&lt;/a&gt; — Modelni o'qitishda pomidor barglarining spektral profillarini olish uchun ishlatiladigan to'lqin uzunliklari diapazoni.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rolling-circle-amplification.html\"&gt;Амплификация с круговой петлей&lt;/a&gt; — Markaziy asab tizimi to'qimalarida patologik halqali RNKni aniqlash uchun ishlatiladigan yuqori sezgir aniqlash usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fisher-information-approximation.html\"&gt;Аппроксимация фишеровской информации&lt;/a&gt; — Model murakkabligi uchun jarimalarni geometrik tarkibiy qismlarga: o'lcham, parametrlar  EKG va ko'z harakatlarini bir vaqtda qayd etishni o'z ichiga olgan ma'lumotlarni…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/optogenetic-inhibition.html\"&gt;Оптогенетическое подавление&lt;/a&gt; — Ishda stress oqibatlarini bartaraf etish uchun ishlatiladigan, yorug'lik yordamida neyronlar faoliyatini boshqarish usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/whole-genome-sequencing.html\"&gt;Полногеномное секвенирование&lt;/a&gt; — Organizmning to'liq DNK ketma-ketligini aniqlash usuli, noyob genetik variantlarni izlash uchun ishlatiladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/causal-forest.html\"&gt;Причинный лес&lt;/a&gt; — Xavf omillarining geterogen ta'sirini baholash va sabab-oqibat bog'liqliklarini tahlil qilish uchun vosita.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/oxford-nanopore-sequencing.html\"&gt;Секвенирование Oxford Nanopore&lt;/a&gt; — ITR barqarorligini baholash uchun ishlatiladigan DNK nukleotid ketma-ketligini tahlil qilish usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/random-forest.html\"&gt;Случайный лес&lt;/a&gt; — Tavakkalchiliklarni tasniflash va yetishmayotgan ma'lumotlarni gibrid imputatsiya qilish uchun ishlatiladigan mashinali o'qitish algoritmi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stereotactic-injection.html\"&gt;Стереотаксическая инъекция&lt;/a&gt; — Jarrohlik usuli bo'lib, asboblarni miyaning belgilangan nuqtasiga aniq yo'naltirish uchun ignalardan foydalangan holda dori vositalarini…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/functional-magnetic-resonance-imaging.html\"&gt;Функциональная магнитно-резонансная томография&lt;/a&gt; — Avtobiografik syujetlarni aqliy kechirish paytida miya yarim sharlari faoliyati naqshlarini xaritalash uchun ishlatiladigan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/four-armed-bandit-task.html\"&gt;Четырехрукий бандит&lt;/a&gt; — Hayvonlar turli mukofotlar va jazolarga ega to'rtta variant o'rtasida tanlov qiladigan eksperimental xulq-atvor testi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"modda\"&gt;&lt;a href=\"concepts/index.html#modda\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Modda&lt;/span&gt;&lt;/a&gt;Modda&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/chmp5.html\"&gt;Chmp5&lt;/a&gt; — Vezikulalar va ekzosomalar shakllanishini tartibga soluvchi ESCRT-III majmuasining yordamchi oqsili; uning bostirilishi nuqsonlarning…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cnbp.html\"&gt;CNBP&lt;/a&gt; — CNBP — bu mRNK tarkibidagi guanin va adeninga boy elementlar bilan bog‘lanuvchi oqsil bo‘lib, u hujayra jarayonlarida asosiy o‘yinchilardan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kras.html\"&gt;KRAS&lt;/a&gt; — Hujayralar proliferatsiyasi va omon qolishini tartibga soluvchi kichik GTPaza, uning T-limfotsitlardagi ortiqcha faollashuvi ularning…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/net1.html\"&gt;NET1&lt;/a&gt; — Maqsadli transkript, uning CNBP oqsili bilan o'zaro ta'siri bloklanganda transporti buziladi, bu esa saraton hujayralarining…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tdp-43.html\"&gt;TDP-43&lt;/a&gt; — Odatda splaysingni tartibga soluvchi va neyrodegeneratsiya paytida funksiyasini yo'qotib, kriptik halqali RNKlarning patologik sintezini…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ube2l3.html\"&gt;UBE2L3&lt;/a&gt; — Mutatsiyalari yallig'lanish reaksiyasini nazorat qilishni buzadigan va bakterial infeksiyalarning og'ir kechish xavfini oshiradigan gen.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vp2-capsid-protein.html\"&gt;VP2&lt;/a&gt; — Endotsitoz membranalarida teshiklar hosil qilish uchun javobgar bo'lgan virusli oqsil; undagi mutatsiyalar virusning Plscr1 ta'siriga…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zfx.html\"&gt;ZFX&lt;/a&gt; — X-xromosoma bilan bog'liq transkripsiya faktori bo'lib, ayollarda uning yuqori ekspressiya darajasi RAK bilan bog'liq genetik…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/beta-amyloid.html\"&gt;бета-амилоид&lt;/a&gt; — Amiloid oqsil kashshofining parchalanish mahsuloti bo'lgan peptid, uning Altsgeymer kasalligida to'planishi endolizosomal nuqsonlar va…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/glucosylsphingosine.html\"&gt;Глюкозилсфингозин&lt;/a&gt; — Glyukozilseramidning deasetillanishidan hosil bo'lgan potensial neyrotoksik mahsulot, uning darajasi Gaucher kasalligida sezilarli darajada…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sulfur-dioxide.html\"&gt;Диоксид серы&lt;/a&gt; — Ko'mir elektr stansiyalari tomonidan chiqariladigan gazsimon prekursor, u atmosferada ikkilamchi mayda zarrachalarning shakllanishiga…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/isoniazid.html\"&gt;Изониазид&lt;/a&gt; — Sil kasalligini davolash uchun ishlatiladigan antibiotik, unga chidamlilik inhA va katG genlaridagi mutatsiyalarni aniqlash orqali…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/il-1beta.html\"&gt;Интерлейкин-1 бета&lt;/a&gt; — Uning utilizatsiyasi UBE2L3 geni nuqsonlari tufayli buziladigan yallig'lanishga qarshi sitokin, bu nazoratsiz yallig'lanishga olib keladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/corticotropin-releasing-hormone.html\"&gt;Кортикотропин-рилизинг-гормон&lt;/a&gt; — Miya neyronlarida ifodalangan gormon, stressga javoban neyroplastiklikni ishga tushiruvchi effektor vazifasini bajaradi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/protein-kinase-a.html\"&gt;Протеинкиназа A&lt;/a&gt; — Hujayra ichidagi signallarda ishtirok etadigan ferment, uning faolligi AKAP11 ankraj oqsili tomonidan boshqariladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tau-protein.html\"&gt;Тау-белок&lt;/a&gt; — Neyrodegeneratsiyada ishtirok etadigan oqsil; ishda virusli infeksiyadan keyin miyadagi patologik o'zgarishlarning belgisi sifatida…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thrombopoietin.html\"&gt;Тромбопоэтин&lt;/a&gt; — Trombotsitlar ishlab chiqarilishi va yetilishini rag'batlantiruvchi asosiy gormon-regulyator.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ubiquitin.html\"&gt;Убиквитин&lt;/a&gt; — 76 aminokislotadan iborat konservativ oqsil bo'lib, substratlar bilan kovalent bog'lanish yoki erkin shaklda mavjud bo'lish orqali hujayra…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/phenol-red.html\"&gt;Феноловый красный&lt;/a&gt; — Reaksiya aralashmasining rangi o'zgarishi orqali amplifikatsiya natijalarini vizual aniqlash uchun ishlatiladigan kimyoviy indikator.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/human-neutrophil-peptides.html\"&gt;Человеческие нейтрофильные пептиды&lt;/a&gt; — Neytrofillar tomonidan chiqariladigan kation peptidlari, ular metabolik yuklanish sharoitida patogen effektlar sifatida ta'sir qilib…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"material\"&gt;&lt;a href=\"concepts/index.html#material\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Material&lt;/span&gt;&lt;/a&gt;Material&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/induced-pluripotent-stem-cells.html\"&gt;Индуцированные плюрипотентные стволовые клетки&lt;/a&gt; — Induksiyalangan pluripotent o'zak hujayralari (iPSH) — bu kattalar organizmining hujayralari bo'lib, ular embrional o'zak hujayralariga…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/plasmid.html\"&gt;Плазмида&lt;/a&gt; — Bakteriyalarda genetik konstruksiyalarni ko'paytirish va saqlash uchun vektor sifatida ishlatiladigan halqali DNK molekulasi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"asbob\"&gt;&lt;a href=\"concepts/index.html#asbob\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asbob&lt;/span&gt;&lt;/a&gt;Asbob&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/agrillama.html\"&gt;AgriLLaMA&lt;/a&gt; — Texnik tahlil ma'lumotlarini tushunarli agronomik tavsiyalarga aylantiruvchi yirik til modeli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/casrx.html\"&gt;CasRx&lt;/a&gt; — Neyral progenitor hujayralar madaniyatida maxsus genlar faolligini bostirish (nokdaun) uchun ishlatiladigan RNK-boshqariladigan ferment.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dcas13.html\"&gt;dCas13&lt;/a&gt; — RNKning o'ziga xos qismlarini sterik bloklash uchun ishlatiladigan Cas13 oqsilining katalitik nofaol versiyasi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/drought-spec-net.html\"&gt;Drought-Spec-Net&lt;/a&gt; — Pomidorlarda suv tanqisligini spektral tahlil asosida erta aniqlash uchun neyron tarmoq.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dsrbd.html\"&gt;dsRBD&lt;/a&gt; — dCas13/gRNK kompleksining maqsadli mRNKga yaqinligini oshirish uchun dCas13 ga qo'shiladigan domen.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/eia-860m.html\"&gt;EIA-860M&lt;/a&gt; — Ko'mir elektr stansiyalarini ekspluatatsiyadan chiqarish jadvallarini kuzatish uchun ishlatiladigan energiya quvvatlarini inventarizatsiya…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fastglioma.html\"&gt;FastGlioma&lt;/a&gt; — O'sma hujayralarining infiltratsiya darajasini baholash va qaytalanish zonalarini bashorat qilish uchun ishlatiladigan ochiq kodli sun'iy…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/htm-carmen.html\"&gt;HTM CARMEN&lt;/a&gt; — OIV, sil va bezgakni bir vaqtning o'zida aniqlash, shuningdek dori vositalariga chidamlilikni tahlil qilish uchun CRISPR-Cas13a asosidagi…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ilastik.html\"&gt;ilastik&lt;/a&gt; — Qurg'oqchilik og'irligi indeksini baholash uchun RGB tasvirlarini segmentatsiyalashda qo'llaniladigan vosita.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/psychad.html\"&gt;PsychAD&lt;/a&gt; — Neyrodegenerativ va psixiatrik kasalliklarda transkriptomlar atlasini yaratish uchun ishlatiladigan 1494 ta noyob miya donorlari kogortasi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rfdiffusion.html\"&gt;RFdiffusion&lt;/a&gt; — Belgilangan bog'lanish xususiyatlariga ega oqsillarni hisoblash dizayni uchun ishlatiladigan chuqur o'rganish algoritmi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rnase-r.html\"&gt;RNase R&lt;/a&gt; — Chiziqli RNK molekulalarini tanlab parchalaydigan ferment, bu namunalardagi halqali RNKlarni konsentratsiyalash va tahlil qilish imkonini…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spiramed.html\"&gt;SpiraMed&lt;/a&gt; — Miya chuqur tuzilmalariga dori vositalarini yagona kirish nuqtasi orqali moslashuvchan spiral kateter yordamida yetkazib beruvchi…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/target-adaptive-rescue-explore-exploit.html\"&gt;T-REX&lt;/a&gt; — Oqsillarni avtomatlashtirilgan loyihalash uchun agent asosidagi tizim bo'lib, u generativ modellarni muvofiqlashtiradi va hisoblash…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/agarose-phantom.html\"&gt;Агарозный фантом&lt;/a&gt; — Klinikagacha bo'lgan sinovlarda miya to'qimalarining fizik xususiyatlarini taqlid qilish uchun ishlatiladigan agarozaga asoslangan gel…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bicos.html\"&gt;Биспецифические костимуляторы&lt;/a&gt; — T-hujayralarni faollashtirish uchun ikkinchi signalni CD28 retseptori bilan bivalent bog'lanish orqali ta'minlovchi molekulalar.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hyperscale-data-centers.html\"&gt;Гипермасштабируемые дата-центры&lt;/a&gt; — Bulutli hisoblash va sun'iy intellekt infratuzilmasini ta'minlaydigan yirik hisoblash markazlari, ularning yuqori energiya talabi ko'mir…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/deterministic-controller.html\"&gt;Детерминированный контроллер&lt;/a&gt; — LLM-agentlarining takliflarini tekshiradigan, resurs chegaralarini boshqaradigan va vazifalarni grafik protsessorlarga taqsimlaydigan tizim…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stable-diffusion.html\"&gt;Диффузионная нейросеть&lt;/a&gt; — Ishtirokchilarning og'zaki tavsiflari asosida shaxsiylashtirilgan vizual tasvirlarni sintez qilish uchun ishlatiladigan \"matndan tasvirga\"…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/brain-organoids.html\"&gt;Мозговые органоиды&lt;/a&gt; — Induksiya qilingan pluripotent o'zak hujayralaridan olingan laboratoriya modeli bo'lib, miyaning erta rivojlanishining asosiy…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/forebrain-organoids.html\"&gt;Органоиды переднего мозга&lt;/a&gt; — Kasallik rivojlanishini taqlid qilish va neyron tarmoqlarini o'rganish uchun iPSC'dan o'stirilgan miya to'qimalarining uch o'lchovli…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vgg-16.html\"&gt;Сверточная нейросеть VGG-16&lt;/a&gt; — Sahna vizual modelini yaratish uchun sintezlangan tasvirlardan 1000 o'lchovli aktivatsiya vektorlarini olish uchun ishlatiladigan kompyuter…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/7t-fmri.html\"&gt;сверхвысокопольное 7Т МРТ&lt;/a&gt; — Vokselning yuqori aniqligiga ega neyrovizualizatsiya vositasi, bu korteksning alohida qatlamlari faoliyatini ajratib ko'rsatish imkonini…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"standart\"&gt;&lt;a href=\"concepts/index.html#standart\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Standart&lt;/span&gt;&lt;/a&gt;Standart&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/bioassay-ontology.html\"&gt;BioAssay Ontology&lt;/a&gt; — Biologik tajriba protokollarini standartlashtirilgan tavsiflash va tasniflash uchun ishlatiladigan ontologiya.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bethesda-system.html\"&gt;Система Bethesda&lt;/a&gt; — Qalqonsimon bez tugunlarining xavflilik darajasini baholash uchun ishlatiladigan ingichka ignali aspiratsion biopsiya sitologik…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"organizm-/-model\"&gt;&lt;a href=\"concepts/index.html#organizm-/-model\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Organizm / model&lt;/span&gt;&lt;/a&gt;Organizm / model&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/balamuthia-mandrillaris.html\"&gt;Balamuthia mandrillaris&lt;/a&gt; — O'ta xavfli balamutiya amebali ensefalitini qo'zg'atuvchi erkin yashovchi ameba.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/eggerthella-lenta.html\"&gt;Eggerthella lenta&lt;/a&gt; — Ichak bakteriyasi, u qon tomir endotelial hujayralariga birikib, ichak qon tomir to'sig'ini shikastlaydi va saraton metastazini…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/influenza-a-virus-h1n1.html\"&gt;Вирус гриппа А серотипа H1N1&lt;/a&gt; — Nafas yo'llari infeksiyasini qo'zg'atish va uning miya proteomiga ta'sirini o'rganish uchun ishlatiladigan pnevmotrop RNK virusi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/danio-rerio.html\"&gt;Данио-рерио&lt;/a&gt; — Lichinkalari sensor-motor xulq-atvorini tahlil qilish va terapiya paytida xulq-atvor buzilishlarini kompensatsiya qilish uchun…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/purkinje-cells.html\"&gt;Клетки Пуркинье&lt;/a&gt; — SIL1 oqsili yetishmovchiligida degeneratsiyaga uchraydigan va ataksiya rivojlanishiga olib keladigan miyacha neyronlari turi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/megakaryocytes.html\"&gt;Мегакариоциты&lt;/a&gt; — Trombotsitlar yetishmovchiligini qoplash uchun taloqda soni ortib boradigan trombotsitlar o'tmishdosh hujayralari.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/microglia.html\"&gt;Микроглия&lt;/a&gt; — Miyaning immun hujayralari, tozalovchi vazifasini bajaradi, Altsgeymer kasalligida nerv to'qimasini toksik oqsillardan tozalashga harakat…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/woozy-mice.html\"&gt;Мыши линии woozy&lt;/a&gt; — Marinesco-Sjogren sindromi belgilarini takrorlash uchun model sifatida ishlatiladigan Sil1 genida mutatsiyaga ega sichqonlar liniyasi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/murine-norovirus.html\"&gt;Мышиный норовирус&lt;/a&gt; — Sichqonlarda gastroenteritni keltirib chiqaradigan qobiqsiz virus, uning replikatsiyasi Plscr1 oqsili tomonidan cheklanadi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"hodisa\"&gt;&lt;a href=\"concepts/index.html#hodisa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hodisa&lt;/span&gt;&lt;/a&gt;Hodisa&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/aggresomes.html\"&gt;Агресомы&lt;/a&gt; — Ubikvitin-proteasoma tizimi ishdan chiqqanda hosil bo'ladigan, noto'g'ri buklangan ubikvitinlangan oqsillardan iborat perinuklear…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/anabolic-program.html\"&gt;Анаболическая программа&lt;/a&gt; — Mikrogliyadagi metabolik jarayon, fagotsitar faollikni saqlab qolish uchun yangi oqsillar sintezini mitoxondriyalar biogenezi bilan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/haploinsufficiency.html\"&gt;Гаплонедостаточность&lt;/a&gt; — Genning bitta funksional nusxasi organizmning normal ishlashi uchun yetarli darajada oqsil ta'minlay olmaydigan holat.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ischemia-and-reperfusion.html\"&gt;Ишемия и реперфузия&lt;/a&gt; — Infrarktdan keyingi trombotsitlar dinamikasini o'rganish uchun ishlatiladigan miokard shikastlanishining eksperimental modeli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/collateral-activity.html\"&gt;Коллатеральная активность&lt;/a&gt; — Cas13a fermentining maqsadli RNK bilan bog'langandan so'ng atrof-muhitdagi RNK molekulalarini nospetsifik parchalash qobiliyati, bu…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mevalonate-pathway.html\"&gt;Мевалонатный путь&lt;/a&gt; — Xolesterin sintezining metabolik yo'li, uning fermentlari (DHCR24, EBP) o'smaning terapiyaga sezgirligini oshirish uchun asosiy nishon…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/microarousals.html\"&gt;Микропробуждения&lt;/a&gt; — Uyqu holatidagi qisqa muddatli o'tishlar, miyaning g'ayritabiiy elektr faolligining mahalliy ko'payishiga olib keladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/neural-tracking.html\"&gt;Нейронный трекинг&lt;/a&gt; — Miyaning o'z elektr faoliyatini nutqning bo'g'in ritmi bilan sinxronlashtirish qobiliyati.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/feedback.html\"&gt;обратная связь&lt;/a&gt; — Yuqori darajadagi multisensor zonalardan birlamchi sensor korteksga signallarni uzatish mexanizmi, bu erta signallarni modulyatsiya qilish…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/shared-transcriptomic-vulnerability.html\"&gt;общая транскриптомная уязвимость&lt;/a&gt; — Turli kasalliklarda gen ekspresiyasining o'zgarishidagi bir-birining ustiga tushadigan naqshlar, bu umumiy patogen mexanizmlarni ko'rsatadi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/overfitting.html\"&gt;Переобучение&lt;/a&gt; — Modelning ma'lumotlardagi tasodifiy shovqinga haddan tashqari moslashishi va haqiqiy qonuniyatlarni aks ettirish qobiliyatini yo'qotishi…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/chromatin-remodeling.html\"&gt;Ремоделирование хроматина&lt;/a&gt; — AP-1 va BATF transkripsiya omillari tomonidan boshqariladigan jarayon bo'lib, regulyator T-hujayralarida sitotoksik genlarning…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/reflux.html\"&gt;Рефлюкс&lt;/a&gt; — Dori vositasining igna kanali bo'ylab tashqariga qarab nojo'ya harakati, bu yetkazib berish hajmi va samaradorligini cheklaydi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/familial-alzheimer-s-disease.html\"&gt;Семейная форма болезни Альцгеймера&lt;/a&gt; — APP, PSEN1 yoki PSEN2 genlaridagi autosom-dominant mutatsiyalar tufayli yuzaga keladigan Altsgeymer kasalligining erta shakli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/endoplasmic-reticulum-stress.html\"&gt;Стресс эндоплазматического ретикулума&lt;/a&gt; — SIL1 tanqisligi tufayli noto'g'ri buklangan oqsillarning to'planishi natijasida yuzaga keladigan, UPR kaskadi va neyronlar apoptozini…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/transcriptional-convergence.html\"&gt;Транскрипционная конвергенция&lt;/a&gt; — Turli xil birlamchi nishon genlarning buzilishi yagona regulyator tarmoqdagi muvofiqlashtirilgan nosozlik va ekspressiyadagi o'xshash…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/black-swans.html\"&gt;Черные лебеди&lt;/a&gt; — Kam uchraydigan, ehtimoli past, ammo halokatli hodisalar, ulardan hayvonlar mayda yo'qotishlar evaziga qochishga harakat qiladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gene-expression.html\"&gt;Экспрессия генов&lt;/a&gt; — Mutatsiyalar va gormonal terapiyaning molekulyar darajadagi ta'sirini baholash uchun profili tahlil qilinadigan jarayon.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aha-effect.html\"&gt;Эффект «ага»&lt;/a&gt; — To'satdan tushunish yoki insayt lahzasiga hamroh bo'ladigan fenomenal tuyg'u bo'lib, u metakognitiv teskari aloqa signali sifatida xizmat…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/female-protective-effect.html\"&gt;Эффект защиты женского пола&lt;/a&gt; — Ayol organizmining autizm rivojlanishiga nisbatan chidamliroq bo'lishi va kasallik namoyon bo'lishi uchun ko'proq genetik yuk talab…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/title-effect.html\"&gt;Эффект названия&lt;/a&gt; — Matn ko'rinishidagi qo'shimcha semantik ma'lumot san'at asarlarini idrok etish, talqin qilish va baholashni o'zgartiradigan hodisa.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"metrika\"&gt;&lt;a href=\"concepts/index.html#metrika\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Metrika&lt;/span&gt;&lt;/a&gt;Metrika&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/ai-infiltration.html\"&gt;AI-infiltration&lt;/a&gt; — FastGlioma modeli tomonidan to'qimalarning biokimyoviy kontrastini tahlil qilish asosida hisoblanadigan o'sma hujayralari infiltratsiyasi…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/recall.html\"&gt;Recall&lt;/a&gt; — Tahlil formatini va aniqlash usulini belgilashda til modellarining aniqligini baholash uchun ishlatiladigan metrika.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/root-mean-square-deviation.html\"&gt;RMSD&lt;/a&gt; — Eksperimental va bashorat qilingan modellarning Cα-atomlari o'rtasidagi o'rtacha kvadratik og'ishni hisoblaydigan tuzilmalar aniqligini…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/roc-auc.html\"&gt;ROC-AUC&lt;/a&gt; — ROC-AUC — bu klassifikatsiya sifati ko'rsatkichi bo'lib, 0,5 qiymati tasodifiy taxminni, 1,0 esa sinflarning mukammal ajratilishini…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/plasmalemma-vesicle-associated-protein-1.html\"&gt;Белок-1, ассоциированный с плазмалеммальными везикулами&lt;/a&gt; — Ichak qon tomir to'sig'i shikastlanishining belgisi, uning yuqori ekspressiyasi qon tomirlari yaxlitligining buzilishini va metastaz…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/evoked-potentials.html\"&gt;Вызванные потенциалы&lt;/a&gt; — Chaqirilgan potensiallar (ChP) — bu EEG yordamida o'lchanadigan, stimullarga javoban miyaning elektr faolligidir. Ularning amplitudasi…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/peripheral-distribution-index.html\"&gt;Индекс периферического распределения&lt;/a&gt; — Hujayradagi mRNK taqsimotini miqdoriy baholash uchun ishlatiladigan ko'rsatkich, bunda yuqori qiymatlar periferik taqsimotni, past…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pattern-perceptual-similarity.html\"&gt;перцептивное сходство паттернов&lt;/a&gt; — Illyuziya natijasida yuzaga kelgan faoliyat ob'ektni idrok etishga yoki to'r pardadagi jismoniy signalga ko'proq o'xshashligini miqdoriy…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/limit-of-detection.html\"&gt;Предел обнаружения&lt;/a&gt; — Test namunada ishonchli aniqlay oladigan DNKning minimal konsentratsiyasi yoki trofozoitlar soni.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/major-adverse-cardiovascular-events.html\"&gt;Серьезные нежелательные сердечно-сосудистые события&lt;/a&gt; — O'tkir miokard infarkti, insult yoki yurak-qon tomir sabablari bilan bog'liq o'limni o'z ichiga olgan kombinatsiyalangan ko'rsatkich.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/structurally-unique-hits.html\"&gt;Структурно уникальные хиты&lt;/a&gt; — Dizayn samaradorligi ko'rsatkichi bo'lib, sifat filtrlaridan o'tgan va o'z tuzilishi bilan ajralib turadigan muvaffaqiyatli oqsil…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sequential-organ-failure-assessment.html\"&gt;Шкала SOFA&lt;/a&gt; — Sepsisni tashxislash uchun ishlatiladigan organlar disfunksiyasi darajasini baholash uchun klinik shkala.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Sonlardagi maqolalardan tushunchalar: har biriga alohida maqola — bu nima, tadqiqotchilar u haqida qanday yozadi, nima bilan bog'liq va qayerda uchraydi."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Tushunchalar","description":"Sonlardagi maqolalardan tushunchalar: har biriga alohida maqola — bu nima, tadqiqotchilar u haqida qanday yozadi, nima bilan bog'liq va qayerda uchraydi.","vcsPath":"concepts/index.md"},"headings":[{"title":"Mutaxassislik","href":"concepts/index.html#mutaxassislik","level":2},{"title":"Jarayon","href":"concepts/index.html#jarayon","level":2},{"title":"Atama","href":"concepts/index.html#atama","level":2},{"title":"Usul","href":"concepts/index.html#usul","level":2},{"title":"Modda","href":"concepts/index.html#modda","level":2},{"title":"Material","href":"concepts/index.html#material","level":2},{"title":"Asbob","href":"concepts/index.html#asbob","level":2},{"title":"Standart","href":"concepts/index.html#standart","level":2},{"title":"Organizm / model","href":"concepts/index.html#organizm-/-model","level":2},{"title":"Hodisa","href":"concepts/index.html#hodisa","level":2},{"title":"Metrika","href":"concepts/index.html#metrika","level":2}],"title":"Tushunchalar"},"router":{"pathname":"concepts/index","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
