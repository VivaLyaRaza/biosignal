        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"105\" cy=\"63\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"495\" cy=\"292\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · GENETICS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Ayol organizmi miyani&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;autizmdan qanday himoya&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qiladi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-f1.jpg\" alt=\"1-rasm./ Autizm genlarining kamayishi keng tarqalgan transkriptomik konvergensiyani yuzaga chiqaradi. a, Eksperimental d\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm./ Autizm genlarining kamayishi keng tarqalgan transkriptomik konvergensiyani yuzaga chiqaradi. a, Eksperimental dizayn sxemasi. iPSC: induksiyalangan Pluripotent o'zak hujayralari. b, O'xshash natijalarga ega uchta mustaqil tahlilni aks ettiruvchi iPSC'dan hosil qilingan NPC madaniyatlarining immunositokimyosi. c, Maqsadli genning o'zini istisno qilgan holda, har bir nokdaun (KD) shartining differensial ekspreslangan genlari (DEG) ichida SFARI genlari yoki faqat aqliy zaiflik (ID-only) genlarining boyitilishini ko'rsatuvchi ustunli diagramma. Ustunlar bir tomonlama Fisherning aniq testi asosida ehtimollar nisbatini (OR) ko'rsatadi; xatolik chiziqlari OR uchun 95% ishonch oralig'ining quyi chegarasini ko'rsatadi (bir tomonlama test uchun yuqori chegara aniqlanmagan). P-qiymatlar ko'p gipotezalarni tekshirish uchun Benjamini-Xoxberg tuzatishi yordamida tuzatilgan. d, Turli xil KD shartlari o'rtasida taqsimlangan yuqori ishonchli SFARI DEG'larini tasvirlovchi sirkos diagrammasi (shuningdek, 3a-kengaytirilgan ma'lumotlar rasmiga qarang). e, Kamida 10 ta KD shartida DEG bo'lgan yuqori ishonchli SFARI genlarining nisbiy ekspresiyasini ko'rsatuvchi issiqlik xaritasi (shuningdek, 3b-c kengaytirilgan ma'lumotlar rasmiga qarang). Statistik jihatdan sezilarli DEG'lar ko'p gipotezalarni tekshirish uchun Benjamini-Xoxberg tuzatishi bilan DESeq2 (Vold testi) yordamida aniqlangan va * bilan belgilangan. 1-rasmdagi eng yaxshi autizm xavfi genlari qalin harflar bilan yozilgan. f, Vaqt o'tishi bilan CytoTrack bo'yoqining nisbiy intensivligi (-log2). Faqat vaqt o'tishi bilan barqaror bo'lgan statistik jihatdan sezilarli ta'sirlarni ko'rsatgan KD shartlari ko'rsatilgan. Grafik o'rtacha qiymat +/- o'rtachaning standart xatosini (SEM) ko'rsatadi. Statistik ahamlilik Dannetning ko'p taqqoslash testi bilan odatiy ikki tomonlama ANOVA yordamida aniqlandi. Har bir vaqt nuqtasi uchun har bir shart bo'yicha kamida uchta biologik jihatdan mustaqil namuna tahlil qilindi. To'liq statistik natijalar uchun 10-qo'shimcha jadvalga qarang.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Autizm spektrining buzilishi o'g'il bolalarda qizlarga qaraganda uch-to'rt baravar ko'p uchraydi. Yangi tadqiqot shuni ko'rsatdiki, jinsiy xromosomalar va maxsus oqsillar genetik nosozliklarni kompensatsiya qila oladi. Bu molekulyar darajadagi himoya mexanizmini tushuntirishga yordam beradi. Natijalar neyrorivojlanish jarayonlarini chuqurroq o'rganishga yo'l ochadi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;18 ta autizm genining bostirilishi hujayralarda bir xil nosozlik beradi.&lt;/li&gt;\n&lt;li&gt;ZFX omili ayollarda ikkala X xromosomadan ham faol ishlab chiqariladi.&lt;/li&gt;\n&lt;li&gt;ZFX oqsilining yuqori darajasi miyani genetik mutatsiyalardan himoya qiladi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Autizm yuzlab genlardagi mutatsiyalar bilan bog'liq, ammo turli DNK uchastkalarining zararlanishi qanday qilib o'xshash belgiltarga olib kelishi sir bo'lib qolayotgan edi. Tadqiqotchilar inson neyral o'zak hujayralari madaniyatida autizm bilan bog'liq 18 ta asosiy gen faolligini pasaytirib ko'rishdi. Ma'lum bo'lishicha, ushbu genlardan birining o'chirilishi boshqa autizm genlari faoliyatining ommaviy pasayishiga olib keladi. Bu holat turli birlamchi buzilishlar yagona regulyator tarmoqda umumiy nosozlikni keltirib chiqarishini ko'rsatadi.&lt;/p&gt;\n&lt;p&gt;Gen tarmoqlarini tahlil qilish X xromosomasida joylashgan va ayollarda ikkala xromosomada ham faol bo'lgan ZFX transkripsiya omilini aniqladi. Ayollar ushbu omilning ikki marta ko'p dozasini olgani sababli, u zararlangan genlar ishini samaraliroq qo'llab-quvvatlaydi. Mualliflarning fikricha, ayol miyasida ZFX oqsilining yuqori darajada bo'lishi genetik mutatsiyalarni bartaraf etishda asosiy rol o'ynaydi. Aynan shuning uchun qizlarda autizm belgilari namoyon bo'lishi uchun ko'proq genetik xavf talab etiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot in vitro sharoitidagi hujayra madaniyatida o'tkazilgan bo'lib, tirik organizmlarda sinovlarni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Autizm spektrining buzilishi (ASD) yuqori darajada nasliy bo'lib, yuzlab genlardagi mutatsiyalar ASDning alohida noyob sabablari sifatida ko'rsatilgan. Ushbu funksional jihatdan xilma-xil genlardagi buzilishlar ASDning asosiy belgilariga qanday olib kelishini tushunish hali ham muhim muammo bo'lib qolmoqda. Qolaversa, ASD erkaklarda ayollarga qaraganda uch-to'rt barobar ko'proq uchraydi va autizmga chalingan qizlar autizmga chalingan o'g'il bolalarga nisbatan ko'proq autosomik ASD xavf allellarini tushida tashiydi, biroq bu «ayollarni himoya qiluvchi effekt»ning (female protective effect, FPE) biologik asosi noma'lum. Bu yerda biz inson neyral o'tmishdosh hujayralarida 18 ta ASD genining alohida buzilishlari gen ekspresiyasiga umumiy ta'sir ko'rsatishini, jumladan, boshqa ASD genlarining keng ko'lamli pasayishini (downregulation) ko'rsatamiz. Gen regulyator tarmog'ining (GRN) de novo rekonstruksiyasi markaziy transkripsiya regulyatorlarini, jumladan, taniqli ASD geni CHD8 va bu transkripsion konvergensiyani boshqaruvchi REST kabi yangi nomzodlarni aniqlash imkonini berdi. Qolaversa, ayollarda faol va nofaol X-xromosomalarning ikkalasidan ham eksprimatsiya qilinadigan X-bog'langan transkripsiya omili ZFX ko'plab ASD genlarining asosiy faollashtiruvchisi sifatida namoyon bo'ldi: biz ayollar miyasida kuzatilgan yuqori ZFX ekspresiya darajasi turli xil ASD genlaridagi zararli mutatsiyalarni buferlashga qodir deb taxmin qilamiz, bu esa FPEga hissa qo'shadi. Umuman olganda, ushbu natijalar asosiy GRNlar alohida ASD genlari buzilganda qanday qilib keng va o'xshash tarzda disregulyatsiyaga uchrashini ochib beradi va ASDdagi ayollarni himoya qiluvchi effekt bo'yicha molekulyar tushunchani taqdim etadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Neyral hujayralarida 18 ta ASD genining buzilishi umumiy transkripsiya javobiga olib keladi, ikkala X-xromosomadan eksprimatsiya qilinadigan ZFX omili esa asosiy himoya faollashtiruvchisi vazifasini bajaradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Keng ko'lamli genetik tadqiqotlar yuzlab genlarni autizm spektrining buzilishi (ASD) bilan bog'ladi, ularning aksariyati bitta allel funksiyasining yo'qolishiga olib keladigan noyob mutatsiyalar orqali aniqlangan. Bu gen dozasining ASDda muhim rol o'ynashini ko'rsatadi, shuning uchun ASD genlarining tegishli ekspresiya darajalari qanday saqlanishini aniqlash juda muhimdir. Gen regulyator tarmoqlarini (GRN) tavsiflash ushbu ASD genlarining to'g'ri transkripsion dozasini ta'minlovchi mexanizmlar haqida muhim ma'lumotlarni berishi mumkin. Bundan tashqari, ASD tarqalishida sezilarli darajada erkaklar ustunligi mavjud va ba'zi ASD genlari X-xromosomada aniqlangan bo'lsa-da, faqat X-bog'langan mutatsiyalarning o'zi bu jinsiy tafovutni to'liq tushuntira olmaydi. Qolaversa, erkaklarga nisbatan ASD namoyon bo'lishi uchun ayollar ko'proq autosomik genetik xavfga muhtojligi doimiy ravishda ko'rsatib kelingan, ammo bu ayollarni himoya qiluvchi effektning (FPE) genetik mexanizmlari noma'lum. Bu yerda GRN rekonstruksiyasi CHD8 va RESTni o'z ichiga olgan ASD genlari ekspresiyasining asosiy harakatlantiruvchilarini aniqlaydi. Ushbu tahlillar, shuningdek, ayollarda faol va nofaol X-xromosomadan eksprimatsiya qilinadigan, ayollarga xos og'ishga ega ZFX transkripsiya omilini ASD genlarining asosiy regulyatori sifatida yuzaga chiqaradi, bu FPEga hissa qo'shishi mumkin bo'lgan to'g'ridan-to'g'ri transkripsion mexanizmdan dalolat beradi. Ushbu tadqiqot turli xil genlardagi variantlar oxir-oqibat ASDga olib keladigan konvergent molekulyar effektlarni qanday keltirib chiqarishini aniqlash uchun muhim asos yaratadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gen regulyator tarmog'i (GRN) — bu hujayrada genlarning yoqilishi va o'chirilishini boshqaradigan DNK, RNK va oqsillar orasidagi o'zaro ta'sirlarning murakkab tizimidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"asd-genlarining-kambagallashishi-keng-tarqalgan-transkriptomik-konvergentsiyani-yuzaga-chiqaradi\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#asd-genlarining-kambagallashishi-keng-tarqalgan-transkriptomik-konvergentsiyani-yuzaga-chiqaradi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ASD Genlarining Kambag'allashishi Keng Tarqalgan Transkriptomik Konvergentsiyani Yuzaga Chiqaradi&lt;/span&gt;&lt;/a&gt;ASD Genlarining Kambag'allashishi Keng Tarqalgan Transkriptomik Konvergentsiyani Yuzaga Chiqaradi&lt;/h4&gt;\n&lt;p&gt;ASD genlarining funksional tahlili inson neyral o'tmishdosh hujayralarida (NPC) quyi nishonlarga kuchli darajada kesishuvchi ta'sir ko'rsatishini aniqladi. Nokdaun (KD) tadqiqotlari 20 ta ASD geni, shu jumladan Simons Foundation Autism Research Initiative (SFARI) Gene ma'lumotlar bazasidan 18 ta gen va ilgari ASD bilan bog'liqligi ko'rsatilgan ikkita uzun nokodlanuvchi RНК (lncRNA) (NR2F1-AS1 va SOX2-OT) uchun amalga oshirildi. Har bir nishon genining individual KD indüksiyasi uchun sog'lom erkak (XY) induced pluripotent stem cell (iPSC) liniyasidan olingan NPC kulturalarida nishonsiz nazoratlarga (NTC) nisbatan RНКni parchalovchi CRISPR fermenti CasRx va har bir nishon uchun uchtadan gid RНК (gRNA) to'plami (S1-jadval) ishlatildi (1a-b-rasm va S1-1-rasm). KDdan keyin 24 soat o'tgach o'tkazilgan RНК sekvenirlash (RNA-seq) tahlili shuni ko'rsatdiki, deyarli barcha ta'sirlar sezilarli darajada differensial ekspressiyalangan genlarning (DEG; tuzatilgan p &amp;lt; 0,05) salmoqli soniga olib keldi, har bir ta'sir uchun mediana 920 ta DEGni tashkil etdi (25-persentil: 644, 75-persentil: 1485) (S2-rasm va S2-jadval).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;20 ta ASD genining neyral o'tmishdoshlardagi nokdauni ekspressiyaning keng ko'lamli o'zgarishlariga olib keldi (har bir gen uchun mediana 920 ta DEG).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu DEGlarning quyi oqim tahlillari uchun yetarli statistik quvvatni ta'minlash uchun biz 20 tadan 20 tadan 18 tasini (90%) tashkil etuvchi, 20 tadan ortiq DEG keltirib chiqargan 18 ta ta'sirga e'tibor qaratdik hamda ARHGAP5 va ARID2 nokdaun namunalarini keyingi tahlildan chiqarib tashladik. Qolgan ta'sirlarning har biri kamida 287 ta DEGni keltirib chiqardi, bu esa ushbu namunalarni ishonchli tavsiflash imkonini berdi. Transkriptom miqyosidagi tahlillar shuni ko'rsatdiki, ASD genlarining KD lari boshqa ASD genlarining hayratlanarli darajada keng tarqalgan buzilishiga olib keladi. Ko'pchilik DEG to'plamlari SFARI genlar bazasidagi ma'lum ASD genlarining sezilarli darajada boyishini namoyish etdi (15/18, 83.3%) (1c-rasm va S3-jadval). Aksincha, intellektual nogironlik (ID) bilan bog'liq bo'lgan, ammo ASD bilan bog'liq bo'lmagan genlar uchun sezilarli boyish kuzatilmadi (faqat ID genlari) (1c-rasm va S3-jadval) (Metodlar), garchi ularning NPCdagi taqqoslanadigan ekspressiyasi mavjud bo'lsa ham (faqat ID genlari: 1062/1242, 85.5% ekspressiyalangan; SFARI genlari: 797/1230, 64.8% ekspressiyalangan). Bu shuni ko'rsatadiki, ASD genlarining buzilishi keng ma'nodagi neyrorivojlanish genlariga qaraganda, ayniqsa boshqa ASD genlariga ta'sir qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Nokdaun (KD) — bu gen funksiyalarini baholash uchun RНК-interferensiya yoki CRISPR tizimlari yordamida muayyan gen ekspressiyasini kamaytirish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Xususan, biz ta'sirlar bo'ylab transkriptomik konvergentsiyaning hayratlanarli naqshini kuzatdik, buni biz bir xil DEGlarning statistik jihatdan sezilarli darajada kesishishi sifatida aniqlaymiz (S3-rasm). Bu yuqori ishonchli SFARI (HC-SFARI) genlari, ya'ni ASD bilan bog'liqlik bo'yicha eng yuqori dalil darajasidagi SFARI genlari uchun ayniqsa aniq edi (1d-rasm). Qolaversa, HC-SFARI genlari muayyan KD namunasida ahamiyatli DEG bo'lmasa ham, turli ta'sirlar natijasida kelishilgan yo'nalishda siljishga moyil edi (S3c-rasm). Bu ko'pchilik (11/18, 61.1%) KDlar tomonidan sezilarli darajada pastga regulyatsiya qilingan muhim ASD xavf geni CHD8 ni o'z ichiga olgan. E'tiborlisi, jami 27 ta HC-SFARI geni kamida 10 ta KDsida DEG bo'lgan (27/183, 14.8%, p = 4.1e-9) va ularning barchasi izchil ravishda pastga regulyatsiya qilingan (1e-rasm), bu ASD uchun eng kuchli xavf genlarining ko'pchiligining konvergent disregulyatsiyasini namoyish etadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ushbu tadqiqot in vitro sharoitida yetishtirilgan inson hujayralarida bajarilgan, shuning uchun sabab-oqibat bog'liqligini tasdiqlash uchun jonli organizm modellari zarur.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;CasRx ning yuqori darajalari KD nishonining ekspressiya darajasiga korrelyatsiya qiluvchi miqyosdagi nospetsifik RНК degradatsiyasini keltirib chiqarishi xabar qilingan, pastroq CasRx darajalari esa bu muammoning oldini oladi. Bizning NPC transkriptomik tadqiqotlarimizda CasRx faqat bitta xavfsiz lokusdan (AAVS1) ekspres qilindi, bu uning ekspressiyasini chekladi. Biz, shuningdek, nospetsifik RНК degradatsiyasi natijalarimizga ta'sir qilmaganini tasdiqlash uchun bir nechta qo'shimcha tajribalar o'tkazdik. Birinchidan, biz butun transkriptomni (p = 0.990, R2 = 8e-6, chiziqli regressiya) yoki maxsus SFARI genlarini (p = 0.784, R2 = 0.0043, chiziqli regressiya) ko'rib chiqishda KD nishonlarining ekspressiya darajalari va natijadagi DEGlar soni o'rtasida hech qanday bog'liqlikni topmadik (S4a-rasm). Keyinchalik biz mKO2, mScarlet va iRFP670 fluoroforlarini ekspres qiluvchi NPC larni yaratdik va ularning har birini CasRx bilan alohida nishonga oldik (S4-jadval); oqim cytometriyasi nishonsiz fluoroforlarning flüoresans intensivligiga qo'shimcha ta'sirlarni ko'rsatmadi (S4b-rasm va S5-jadval). Nihoyat, biz NPC larda qisqa shpindel RНК lari (shRNAs) yordamida maqsadli genlarimizning kichik to'plami bo'yicha qo'shimcha KD tadqiqotlarini o'tkazgandan so'ng, umumiy pastga regulyatsiya qilingan DEGlarda kuchli transkriptomik konvergentsiyani tasdiqladik (S4c-d-rasm, S5-rasm va S6-jadval).&lt;/p&gt;\n&lt;p&gt;iPSC larda va iPSCsiz olingan qo'zg'atuvchi neyronlarda (ExNs) ASD genlarini nokaut qilish uchun Cas9 dan foydalangan tadqiqot ma'lumotlarini qayta tahlil qilish ham hujayra turi ichida, ham hujayra turlari o'rtasida umumiy pastga regulyatsiya qilingan DEGlarda kuchli transkriptomik konvergentsiyani namoyish etdi (S5-rasm va S6-jadval). Bizning ishimiz taqdim etilgandan beri paydo bo'lgan so'nggi tadqiqotlar turli xil ASD modellarida ham konvergentsiyani qayd etgan. Birlashtirilgan holda, ushbu ma'lumotlar ASD genlarining buzilishi turli xil hujayra turlari va eksperimental kontekstlarda transkriptomik konvergentsiyaga olib kelishini tasdiqlaydi.&lt;/p&gt;\n&lt;h4 id=\"transcriptomik-konvergensiya-asd-uchun-nomzod-xavf-genlarini-aniqlaydi\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#transcriptomik-konvergensiya-asd-uchun-nomzod-xavf-genlarini-aniqlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Transcriptomik konvergensiya ASD uchun nomzod xavf genlarini aniqlaydi.&lt;/span&gt;&lt;/a&gt;Transcriptomik konvergensiya ASD uchun nomzod xavf genlarini aniqlaydi.&lt;/h4&gt;\n&lt;p&gt;Bizning KD tadqiqotlarimizda kuzatilgan yaqqol transcriptomik konvergensiya ASD uchun nomzod xavf genlarini quyidagi belgilar asosida aniqlash mumkinligini ko'rsatdi: 1) ASD genlari KD qilinganidan keyin ularning ifodalanishi barqaror ravishda pasayishi va 2) yuqori gen cheklash ballari bilan ko'rsatilganidek, dozaga sezgirlik (7-Qo'shimcha jadval, Metodlar). Ushbu yondashuv 397 ta genni (8-Qo'shimcha jadval), jumladan 113 ta SFARI genini (OR = 5.87, tuzatilgan p = 1.85e-39) va 49 ta HC-SFARI genini (OR = 11.17, tuzatilgan p = 1.11e-29) aniqlash imkonini berdi, bu esa ushbu mezonlar ma'lum ASD genlarini ustuvorlashtirishda samarali ekanligini ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Transcriptomik konvergensiya va gen cheklovlarining integratsiyasi faqat aqliy zaiflik genlari bilan boyitilmagan holda 397 ta ASD nomzod genlarini, shu jumladan 162 ta SFARI genini ajratib ko'rsatdi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Shuni ta'kidlash kerakki, ushbu genlar to'plami faqat aqliy zaiflik bilan bog'liq bo'lgan genlarning boyishini ko'rsatmadi (OR = 1.01, tuzatilgan p = 0.509). Qolgan 284 ta SFARI bo'lmagan genlarning ASD bilan ahamiyatliligini yana bir bor tasdiqlab, ularning barchasi SFARI genlari bilan sezilarli darajada birgalikda ifodalanishini ko'rsatadi (barcha tuzatilgan p &amp;lt; 0.05), bu esa ilgari ASDning yangi xavf genlarini aniqlashga yordam berishi ko'rsatilgan edi. Qolaversa, ushbu genlarning kamida qirq tasi bitta yoki bir nechta yirik sekvenirlash tadqiqotlarida ASD bilan qandaydir bog'liqligini ko'rsatadi (9-Qo'shimcha jadval). Masalan, AKT3 dagi mutatsiyalar klassik tarzda megensefaliya kabi miyaning haddan tashqari o'sishi kasalliklari bilan bog'liq bo'lsa-da, yaqinda ASD bilan bog'landi; KIF11, KIF2A va SOS1 kabi boshqa genlar ham bir nechta tadqiqotlarda ASD bilan bog'langan (9-Qo'shimcha jadvaldagi havolalarga qarang). Shuning uchun qolgan genlar ASD uchun nomzod xavf genlari sifatida ko'rib chiqilishiga loyiqdir.&lt;/p&gt;\n&lt;h4 id=\"asd-genlari-npc-proliferatsiyasini-boshqaradi\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#asd-genlari-npc-proliferatsiyasini-boshqaradi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ASD genlari NPC proliferatsiyasini boshqaradi.&lt;/span&gt;&lt;/a&gt;ASD genlari NPC proliferatsiyasini boshqaradi.&lt;/h4&gt;\n&lt;p&gt;Ko'pgina ASD genlarining buzilishi NPC larda ham shunga o'xshash fenotipik ta'sir ko'rsatdi. Nasldan-naslga o'tadigan bo'yoq (CytoTrack) yordamida proliferatsiyani tahlil qilish shuni ko'rsatdiki, KD larning 9/18 qismi (50%) proliferatsiyaning statistik jihatdan sezilarli darajada pasayishiga olib kelgan (1f-rasm, Extended Data 6-rasm va 10-Qo'shimcha jadval), shu jumladan mikrotsefaliyaga aloqador bir nechta genlar (SETD1B, SETD2, SETD5, KMT2E va WAC). Aksincha, KD larning atigi 1/18 qismi (5.6%) NPC proliferatsiya tezligining sezilarli darajada oshishiga olib keldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Proliferatsiya — bu hujayralarning faol bo'linish va ko'payish jarayoni bo'lib, bu holda nerv o'tmishdoshlarining salomatligi va o'sishini baholash uchun maxsus maxsus metka yordamida o'lchandi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bu shuni ko'rsatadiki, kamaygan NPC proliferatsiyasi turli ASD genlarining buzilishi natijasida yuzaga keladigan umumiy fenotip bo'lib, bu avvalgi topilmalarga mos keladi. Ushbu molekulyar fenotiplar va ASDdagi boshning g'ayritabiiy hajmi o'rtasidagi o'ziga xos munosabatlarni hal qilish murakkab, chunki tadqiqotlar autizmga chalingan shaxslarda ham mikrotsefaliya, ham makrotsefaliya darajasining oshishini ko'rsatmoqda. Darhaqiqat, biz NPC larda proliferatsiyani kamaytiradigan ikkita KD nishoni — SETD2 va KMT2E — ushbu genlarda o'rganilgan o'ziga xos variantlarga qarab mikrotsefaliya yoki makrotsefaliya bilan bog'langan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Kuzatilgan proliferatsiya o'zgarishlari in vitro hujayra modellaridan olingan bo'lib, ularning inson boshining hajmiga o'tish mexanizmi hali to'liq aniqlanishi kerak.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Shunday qilib, NPC proliferatsiyasining buzilishi ko'plab bizning buzilishlarimizda kuzatilgan konvergent fenotip bo'lsa-da, bu bosh hajmining keyingi o'zgarishlari bilan qanday bog'liqligi hali aniqlanishi kerak.&lt;/p&gt;\n&lt;h4 id=\"asd-genlarining-buzilishi-bosh-miya-organoidlari-rivojlanishini-ozgartiradi\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#asd-genlarining-buzilishi-bosh-miya-organoidlari-rivojlanishini-ozgartiradi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ASD genlarining buzilishi bosh miya organoidlari rivojlanishini o'zgartiradi&lt;/span&gt;&lt;/a&gt;ASD genlarining buzilishi bosh miya organoidlari rivojlanishini o'zgartiradi&lt;/h4&gt;\n&lt;p&gt;Bosh miya organoidlarida induksiyalanadigan nokaut (KD) umumiy neyrorivojlanish fenotiplarini yanada ochib berdi. Ushbu organoid tadqiqotlarini amalga oshirish uchun biz FLEx asosidagi induksiyalanadigan CRISPR nokaut (FLICK) konstruksiyasini yaratdik. FLICK tizimi CasRx va EGFP erta reporterining konstitutiv ekspresiyasiga olib keladigan doksitsiklin yordamida induksiyalanadigan genetik rekombinatsiya orqali KD vaqtini nazorat qilish imkonini beradi (2a-rasm) va ishonchli KDni ta'minlaydi (7a-Qo'shimcha ma'lumot rasmi). FLICK konstruksiyalari, shuningdek, yagona hujayrali RNK sekvensiyasi (scRNA-seq) paytida ushlab qolinishi va ma'lum bir hujayradagi KD nishonini aniqlash uchun ishlatilishi mumkin bo'lgan marker ketma-ketliklarni o'z ichiga oladi, bu mozaik bosh miya organoidlarini tahlil qilish imkonini beradi. Uzoq muddatli tadqiqotlar uchun biz CytoTrack tajribalarimizda NPC proliferatsiyasini buzmagani aniqlangan ASD genlarini nishonga oldik (10-Qo'shimcha jadval). Ushbu genlarga qaratilgan yoki NTC gRNKni ekspresse qiluvchi FLICK konstruksiyalari alohida ravishda iPSC'larga o'tkazildi. Keyin biz TagBFP floresan reporterining ekspresiyasiga asoslanib, FLICK konstruksiyalarini integratsiya qilgan hujayralarni ajratib olish uchun floresan yordamida hujayralarni saralashdan (FACS) foydalandik. FACS'dan so'ng biz har bir KD nishoni uchun teng miqdordagi FLICK+ iPSC'larni, shuningdek, shuncha miqdordagi NTC iPSC'larni birlashtirdik va mozaik organoidlarni yaratishdan oldin tiklanishi uchun bu aralash iPSC populyatsiyasini to'rt kun davomida kultivatsiya qildik (0-kun). CasRx va EGFP reporterining konstitutiv ekspresiyasiga olib keladigan FLICK konstruksiyasining rekombinatsiyasi organoidlar asosan PAX6+ NPC'lardan iborat bo'lgan 14-15-kunlardan boshlab doksitsiklin bilan ishlov berish orqali hujayralarning bir qismida (~10%) induksiyalandi (7b-Qo'shimcha ma'lumot rasmi). Keyinchalik bu organoidlar bir yoki ikki oylik rivojlanish davrimgacha o'stirildi (2b-rasm) va radial glial progenitorlar (RGs), oraliq progenitor hujayralar (IPCs), tormozlovchi neyronlar (INs) va qo'zg'atuvchi neyronlarni (ExNs) o'z ichiga olgan barcha kutilgan hujayra turlarini aniqlagan scRNA-seq yordamida tahlil qilindi (2c-d-rasmlar va 7c-d-Qo'shimcha ma'lumot rasmi). Qo'shimcha scRNA-seq tahlili shuni tasdiqladiki, FLICK konstruksiyasi samarali KD hosil qilishi mumkin (7e-Qo'shimcha ma'lumot rasmi).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BAZ2B, CLASP1 va EHMT1 genlarining nokauti organoidlardagi hujayralar sonining kamayishiga va radial glia hisobiga qo'zg'atuvchi neyronlar yo'nalishida tafovutga olib keldi (p = 0.021, 0.018 va 0.012).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Uzoq muddatli organoid KD'lari bir nechta buzilishlar bo'ylab umumiy fenotiplarni aniqladi. Bir nechta KD'lar, ayniqsa BAZ2B, CLASP1 va EHMT1'ga qaratilganlar, NTC'larga nisbatan organoidlarda kamaydi (2e-rasm), garchi bu KD'lar NPC kulturalarida proliferatsiyani buzmagan bo'lsa ham (6a-Qo'shimcha ma'lumot rasmi va 10-Qo'shimcha jadval). Bizning NPC kulturalarimiz va organoidlarimiz orasidagi bu tafovut shuni ko'rsatadiki, progenitorlar proliferatsiyasi hamda differensatsiyasini qo'llab-quvvatlaydigan uzoq muddatli organoidlar qisqa muddatli NPC kulturalarida sezilmaydigan neyrorivojlanish fenotiplarini ochib berishi mumkin. Qizig'i shundaki, mikrosefaliya ushbu genlardagi patogen variantlar bilan bog'liq bo'lib, organoid fenotiplariga mos keladi. Qolaversa, ushbu KD'lar organoidlardagi hujayra turlari nisbatini o'zgartirib, nisbatan ko'proq ExN va kamroq RG'larni hosil qildi (BAZ2B uchun adj. p = 0.021, CLASP1 uchun 0.018 va EHMT1 uchun 0.012, Dunnettning ko'p sonli taqqoslash testi bilan bir omilli ANOVA) (2f-rasm va 7f-Qo'shimcha ma'lumot rasmi). Bular birgalikda ushbu genlarning buzilishi RG o'z-o'zini tiklanishi evaziga ExN differensatsiyasining oshishiga olib kelishi mumkinligini ko'rsatadi. Boshqa KD'larning aksariyati ham 2 oylik muddatga kelib ExN ulushining oshishiga moyil bo'lib, bu oldingi kuzatishlarga muvofiq konvergent neyrorivojlanish fenotipi ekanligini ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Yagona hujayrali RNK sekvensiyasi (scRNA-seq) minglab alohida hujayralarning gen ekspresiyasi profilini o'rganishga imkon beradi, organoidlar esa laboratoriyada o'stirilgan kichik miya modellaridir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ASD genlarining kamayishi, shuningdek, bosh miya organoidlarida yaqqol transkripsion konvergensiyaga olib keldi (3a-rasm va 7g-Qo'shimcha ma'lumot rasmi). Har xil KD'larga ega RG'lar yuqori darajada bir-birining ustiga tushadigan DEGlarni namoyish etdi, bu esa NPC kulturalaridan olgan topilmalarimizni yanada qo'llab-quvvatlaydi. Darhaqiqat, organoid RG'larida aniqlangan DEGlar NPC kulturalarida aynan shu nishonning KD'idan aniqlangan DEGlar bilan kuchli darajada kesishdi (7h-Qo'shimcha ma'lumot rasmi), bu esa gen ekspresiyasiga bo'lgan bu ta'sirlar ma'lum bir eksperimental kontekstga xos emasligini ko'rsatadi. Transkripsion konvergensiya, shuningdek, IPC'lar va ExN'larni o'z ichiga olgan qo'shimcha hujayra turlarida ham kuzatildi (3a-rasm va 7g-Qo'shimcha ma'lumot rasmi), bu ASD genlarining umumiy quyi oqim ta'sirlarida konvergensiyasi faqat neyron progenitorlariga xos emasligini isbotlaydi. Bu ASD'ning turli sabablariga ega bo'lgan shaxslarning o'limdan keyingi miya to'qimalarida umumiy ASD DEG'larini aniqlagan tadqiqotlarga, shuningdek, turli ASD genlari buzilganda sinaptik tuzilish yoki faollikning buzilishi kabi ExN konvergent fenotiplarining keng tarqalgan kuzatishlariga mos keladi, bu konvergensiya shunchaki hujayra turi yoki progenitor hujayralar taqdirining umumiy o'zgarishini aks ettirmasligini bildiradi. Qolaversa, biz scRNA-seq yordamida bir-birining ustiga tushuvchi DEGlarni aniqlash har bir buzilish uchun sekvensiya qilingan hujayralar soniga jiddiy bog'liqligini aniqladik, buni quyi tanlanma tahlili ko'rsatib turibdi (3b-rasm). Tanlanma hajmiga bo'lgan bu bog'liqlik kichikroq tanlanma hajmiga ega bo'lgan ba'zi oldingi tadqiqotlarda alohida gen darajasida kuzatilgan ishonchli transkripsion konvergensiyaning yo'qligini qisman tushuntirishi mumkin. Bizning izogen fondan foydalanishimiz ham transkripsion konvergensiyani aniqlashimizga hissa qo'shgan bo'lishi mumkin, chunki turli xil genetik fonlar organoidlarda ASD genlarining buzilishidan kelib chiqadigan neyrorivojlanish fenotiplariga sezilarli darajada ta'sir qilishi aniqlangan. Nihoyat, ba'zi konvergent tarzda buzilgan genlar hujayra turiga xos bo'lsa-da, ko'plab genlar SFARI DEG'larini o'z ichiga olgan holda bir nechta hujayra turlarida izchil ravishda buzildi (3c-rasm). Bu shuni ko'rsatadiki, hujayra turiga xos xususiyatlar ASD genlari buzilishining transkripsion oqibatlariga ta'sir qilishiga qaramay, ma'lum ta'sirlar turli xil hujayra turlari tomonidan keng tarqalgan bo'lishi mumkin.&lt;/p&gt;\n&lt;h4 id=\"miya-organoidlaridagi-otkir-buzilishlardan-keyingi-transkriptomik-konvergensiya\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#miya-organoidlaridagi-otkir-buzilishlardan-keyingi-transkriptomik-konvergensiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Miya organoidlaridagi o'tkir buzilishlardan keyingi transkriptomik konvergensiya&lt;/span&gt;&lt;/a&gt;Miya organoidlaridagi o'tkir buzilishlardan keyingi transkriptomik konvergensiya&lt;/h4&gt;\n&lt;p&gt;2 oylik organoidlarda autizm (ASD) genlarining o'tkir buzilishi umumiy differensial ekspressiyalangan genlar (DEG) bo'yicha yanada katta konvergensiyani aniqladi. O'zgarishlar normal rivojlangan organoidlar ichida ushbu genlarni buzishning o'tkir ta'sirini aniqlashga imkon berish uchun, 61–62-kunlardan boshlab doksikratsin bilan ishlov berish orqali KD (nokdaun) induksiya qilinishidan oldin qo'shimcha mozaik FLICK organoidlar to'plami ikki oy davomida o'stirildi va ikki kundan keyin scRNA-seq amalga oshirildi. Ushbu yondashuv har bir KD uchun o'xshash hujayralar sonini ta'minladi (Rasm 3d va Rasm SN 7i), bu uzoq muddatli KD bilan organoidlardan kamayib ketgan KD larni chuqurroq tahlil qilish imkonini berdi (Rasm 2e). Kutilganidek, bu organoidlar turli hujayra turlarining aralashmasini o'z ichiga olgan (Rasm 3e va Rasm SN 7j), bunda qo'zg'atuvchi neyronlar (ExN) ushbu rivojlanish bosqichida eng ko'p tarqalgan hujayra turi bo'lgan (Rasm SN 7k). Qizig'i shundaki, ko'prik KD lar NPC (nerv hujayralari o'tmishdoshlari) kulturalaridan aniqlangan DEG lar bilan boyitilgan ExN DEG lariga olib keldi (Rasm SN 7l), bu yana ASD genlari KD qilinganda hujayra turlari bo'ylab genlar ekspressiyasidagi umumiy o'zgarishlardan dalolat beradi. Qolaversa, uzoq muddatli KD davomida organoidlardan kamaygan maqsadli genlarning o'tkir KD qilinishi (Rasm 2e) ushbu ta'sirlar uchun ancha ko'p hujayralar sonini olish imkonini berdi va bu KD lar ham kuchli transkriptomik konvergensiyaga olib kelishini ko'rsatdi (Rasm 3f).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-f3.jpg\" alt=\"3-rasm./ Bosh miya organoidlarida autizm genlari pertürbatsiyasidan keyingi transkriptomik konvergensiya. a, Uzoq muddat\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm./ Bosh miya organoidlarida autizm genlari pertürbatsiyasidan keyingi transkriptomik konvergensiya. a, Uzoq muddatli organoidlarda radial glia va qo'zg'atuvchi neyronlar uchun DEG'larning o'zaro boyitilishi issiqlik xaritasi. b, Sezilarli o'zaro boyitishni (transkriptomik konvergensiya) ko'rsatadigan juftlikdagi DEG'lar to'plami nisbatlarini bildiruvchi doiraviy diagrammalar. Har bir doiraviy diagramma ustida ko'rsatilgan raqamgacha bo'lgan har bir shart uchun hujayralar sonini kamaytirish kuzatilgan transkriptomik konvergensiyani kamaytiradi. c, Turli xil KD shartlari va hujayra turlari orasida taqsimlangan DEG'larning tarmoq vizualizatsiyasi. Qirralarning qalinligi taqsimlangan DEG'lar sonini bildiradi. Tugunlar Fruchterman-Reyngold algoritmi (igraph) yordamida klasterlash asosida chizilgan. Bir-biriga yaqinroq bo'lgan tugunlar o'rtacha hisobda ko'proq taqsimlangan DEG'larga ega. d, O'tkir KD ga ega mozaik organoidlarning scRNA-seq'idan har bir KD nishoniga ega hujayralar ulushi. e, scRNA-seq'dan o'tkir KD mozaik organoidlarining UMAP'i. f, O'tkir KD organoidlarida turli xil KD namunalari o'rtasidagi o'zaro boyitish issiqlik xaritasi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-f2.jpg\" alt=\"2-rasm./ Autizm genlarining buzilishi bosh miya organoidlari rivojlanishini o'zgartiradi. a, Doksitsiklin yordamida indu\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm./ Autizm genlarining buzilishi bosh miya organoidlari rivojlanishini o'zgartiradi. a, Doksitsiklin yordamida induksiyalanadigan CasRx KD uchun FLICK konstruksiyalarining dizayni. FLICK konstruksiyalari shuningdek gRNKlarni ham ifodalaydi (ko'rsatilmagan). b, O'xshash natijalarga ega uchta mustaqil tahlilni aks ettiruvchi 2 oylik rivojlanishdan keyingi FLICK organoidi. Quyidagi markerlarning ekspresiyasini vizualizatsiya qilish uchun immunohimoya bajarildi: EGFP = FLICK konstruksiyasi; DAPI = yadro, PAX6 = NPC; TBR2 = oraliq o'zak hujayralari; CTIP2 = qo'zg'atuvchi neyronlar. c, scRNA-seq yordamida hujayra turlarini aniqlash uchun ishlatiladigan kanonik miya markeri genlarining ekspresiyasi. d, Bir oy va ikki oyda yig'ilgan uzoq muddatli organoid scRNA-seq integratsiyalashgan ma'lumotlarining UMAP'i. e, Bir yoki ikki oylik mozaik organoidlardan har bir KD nishoni uchun hujayralarning nisbiy miqdori. Natijalar 0-kundagi har bir namuna uchun boshlang'ich nisbatga normallashtirilgan va bir xil vaqt nuqtasidagi NTC'larga nisbatan ko'rsatilgan. Grafik o'rtacha +/- SEM'ni ko'rsatadi. FLICK konstruksiyalari d14-d15 kunlarda doksitsiklin bilan davolash orqali induksiyalangan edi. Statistik ahamlilik takroriy o'lchovlar bir tomonlama ANOVA va Dannetning ko'p taqqoslash testi yordamida baholandi. n = har bir shart uchun uchta biologik jihatdan mustaqil namuna. f, Bir oylik organoidlarda har bir KD nishoni bo'yicha hujayra turi tarkibi. Nuqtali chiziqlar asosiy hujayralar turlarining (radial glia, oraliq o'zak hujayralari va neyronlar) NTC nisbatlarini ko'rsatadi. ExN/RG nisbati NTC'dan sezilarli darajada farq qiladigan namunalar * bilan belgilangan (tuzatilgan p &amp;lt; 0.05). Statistik tahlil bir oylik (bu yerda ko'rsatilgan) va ikki oylik (7f-kengaytirilgan ma'lumotlar rasmiga qarang) barcha uzoq muddatli namunalarni hisobga olgan holda Dannetning ko'p taqqoslash testi bilan odatiy bir tomonlama ANOVA yordamida amalga oshirildi.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Organoidlardagi ASD genlarining o'tkir nokdauni kuchli transkriptomik konvergensiyani tasdiqlaydi va qo'zg'atuvchi neyronlar kabi asosiy hujayra turlariga ta'sir qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rest-ni-oz-ichiga-olgan-asosiy-transkripsiya-omillari-takroriy-disregulyatsiyaga-uchragan-genlarga-qaratilgan-transkriptsion\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#rest-ni-oz-ichiga-olgan-asosiy-transkripsiya-omillari-takroriy-disregulyatsiyaga-uchragan-genlarga-qaratilgan-transkriptsion\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;REST ni o'z ichiga olgan asosiy transkripsiya omillari takroriy disregulyatsiyaga uchragan genlarga qaratilgan. Transkriptsion&lt;/span&gt;&lt;/a&gt;REST ni o'z ichiga olgan asosiy transkripsiya omillari takroriy disregulyatsiyaga uchragan genlarga qaratilgan. Transkriptsion&lt;/h4&gt;\n&lt;p&gt;regulatorlar, ASD da transkripsiya konvergensiyasini vositalashi mumkin bo'lganlar, ENCODE ma'lumotlar bazasidagi xromatin immunopresipitatsiyasi sekvenirlash (ChIP-seq) ma'lumotlaridan foydalanadigan MAGIC tahlili (Metodlar) yordamida aniqlandi, bu qiziqish uyg'otadigan genlar to'plami ichida bog'lanish nishonlari boyitilgan transkripsiya omillari va kofaktorlarni aniqlaydi. Bu NPC lardagi ko'plab ASD genlarining KD lari bo'ylab nishon genlari takroriy ravishda differensial ekspressiyalangan transkripsiya regulyatorlarini aniqladi (Rasm SN 8a va Jadval SN 11), shu jumladan CHD2 va SIN3A kabi yuqori darajada ishonchli SFARI (HC-SFARI) genlari. Ilgari ASD bilan bog'lmagan takroriy MAGIC regulyatorlari orasida bir nechta genlar ham yuqori darajada saqlanib qolgan (Jadval SN 7) hamda ma'lum ASD genlari bilan birga ekspresiyalangan (Rasm SN 8a), bu xususiyatlar yangi ASD xavf genlarini bashorat qilishini ko'rsatgan4. MAGIC tahlili organoidlarda konvergensiyaning barqaror drayverlarini ham aniqladi (Rasm SN 8a va Jadval SN 11). NPC larda aniqlangan eng yaxshi takroriy transkripsiya regulyatorlarining yarmi (13/26, 50%) organoid RG larida ham aniqlandi (Rasm SN 8b). MAGIC shuningdek, rivojlanish bosqichlari bo'ylab va uzoq muddatli va o'tkir KD vaqt shkalalari bo'ylab taqsimlangan takroriy ExN regulyatorlarini, shu jumladan ko'plab SFARI genlarini aniqladi. Qizig'i shundaki, ushbu genlarning to'qqiztasi neyron o'tmishdoshlarida ham eng yuqori transkripsiya regulyatorlari sifatida aniqlangan bo'lib, bu ularning ko'plab hujayra kontekstlarida konvergensiyaning asosiy drayverlari ekanligini ko'rsatadi. Alohida qiziqish uyg'otadigan narsa shundaki, RE1 bostiruvchi transkripsiya omili (REST) NPC buzilishlarining 17/18 qismida (94.4%) MAGIC bo'yicha sezilarli bo'lgan (Rasm SN 8a) va barcha sinovdan o'tgan sharoitlarda eng yaxshi MAGIC regulyatori sifatida doimiy ravishda namoyon bo'lgan (Rasm SN 8b). REST ning to'g'ridan-to'g'ri mutatsiyalari ilgari ASD bilan bog'lanmagan bo'lsa-da, REST neyrorivojlanishda muhim rollarga ega va neyrogenezning asosiy salbiy regulyatori sifatida ishlaydi40,41. REST disregulyatsiyasi CHD842 va Rett sindromi geni MECP243,44 kabi ASD genlarining buzilishidan keyin ham xabar qilingan. Inson va sichqoncha REST ChIP-seq bog'lanish saytlarini qayta tahlil qilish (Metodlar) REST nishonlari orasida SFARI genlarining kuchli boyishini aniqladi (mos ravishda adj. p = 3.6e-67 va 7.7e-50), jumladan HC-SFARI genlari (mos ravishda adj. p = 2.2e-13 va 3.7e-8), bu ASD bilan bog'liq genlar ekspressiyasini tartibga solishda REST ning asosiy rolini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ChIP-seq usuli genom bo'ylab oqsillarning DNK bilan bog'lanish joylarini xaritalash imkonini beradi, MAGIC tahlili esa genlar to'plamlari uchun umumiy regulyator tarmoqlarni aniqlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gen-regulyator-tarmogining-rekonstruksiyasi-yuqori-darajada-ozaro-boglangan-asd-genlarini-ochib-beradi\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#gen-regulyator-tarmogining-rekonstruksiyasi-yuqori-darajada-ozaro-boglangan-asd-genlarini-ochib-beradi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gen regulyator tarmog'ining rekonstruksiyasi yuqori darajada o'zaro bog'langan ASD genlarini ochib beradi&lt;/span&gt;&lt;/a&gt;Gen regulyator tarmog'ining rekonstruksiyasi yuqori darajada o'zaro bog'langan ASD genlarini ochib beradi&lt;/h4&gt;\n&lt;p&gt;ARACNe yordamida NPC RNA-seq ma'lumotlarimizdan foydalangan holda de novo GRN rekonstruksiyasi qo'shimcha transkripsiya omillari va xromatin modifikatorlarini — birgalikda «regulatorlar» deb ataladi — ularning quyi oqimdagi nishonlari (regulonlar) bilan bog'lash imkonini berdi (Metodlar). Biz ushbu yondashuvni alohida ravishda «saqlab qolingan» (held-out) GRN larni qurish orqali tasdiqladik, bu esa regulonlarni aniqlashda aylanma xatolikning oldini olish uchun KD nishonining o'zi potentsial regulyator bo'lgan namunalardagi ma'lumotlarni istisno qildi. Ushbu saqlab qolingan GRN lardan bashorat qilingan regulonlar NPC dagi tegishli maqsadli genlarning KD qilinishidan keyin kuzatilgan DEG lar bilan kuchli darajada kesishdi (har biri uchun adj. p &amp;lt; 3.98e-116, birlashtirilgan p = 4.08e-937) (Rasm 4a va Rasm SN 9a). Shunday qilib, ARACNe haqiqiy regulyator munosabatlarini samarali qamrab oladi. To'liq NPC GRN ASD genlari va ularning yuqori oqimdagi regulyatorlari o'rtasida yuqori darajada o'zaro bog'liqlikni ochib berdi (Rasm 4b). Darhaqiqat, ASD genlari NPC GRN ning markaziy genlari orasida kuchli boyitilgan edi (SFARI genlari uchun adj. p = 9.81e-6, HC-SFARI genlari uchun 1.99e-4, markaziylik PageRank algoritmi yordamida baholandi, Metodlar) (Rasm 4c). Aksincha, faqat aqli zaiflik (ID-only) genlari GRN markaziy genlari orasida boyishni ko'rsatmadi (adj. p = 0.19), bu ASD genlari KD lari natijasida hosil bo'lgan DEG lar orasida kuzatilgan boyish yo'qligiga mos keladi (Rasm 1c). Bundan tashqari, markaziy GRN genlari G2M nazorat punkti (adj. p = 6.0e-4) va mitotik o'q (adj. p = 3.6e-5) bilan bog'liq yo'llar uchun boyitilgan bo'lib, bu biz kuzatgan NPC proliferatsiya fenotiplariga mos keladi (Rasm 1f va Jadval SN 10).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-f4.jpg\" alt=\"4-rasm./ Genoregulator tarmoq tahlili CHD8'ni autizmda konvergensiyaning asosiy drayveri sifatida aniqlaydi. a, KMT2E KD\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm./ Genoregulator tarmoq tahlili CHD8'ni autizmda konvergensiyaning asosiy drayveri sifatida aniqlaydi. a, KMT2E KD bo'yicha differensial ekspresiyani ko'rsatuvchi vulqon diagrammasi. GRN tahlili bilan KMT2E tomonidan ijobiy tartibga solinishi taxmin qilingan genlar ajratib ko'rsatilgan, bunda statistik jihatdan sezilarli darajada kamaygan DEG'lar ko'k rangda, ko'paygan DEG'lar qizil rangda (yo'q) va sezilarli o'zgarishsiz nishonlar sariq rangda ko'rsatilgan. Statistik jihatdan sezilarli DEG'lar ko'p gipotezalarni tekshirish uchun Benjamini-Xoxberg tuzatishi bilan DESeq2 (Vold testi) yordamida aniqlangan. Pastga tartibga solingan DEG'lar ichida 2-darajali regulon genlarining statistik jihatdan sezilarli boyitilishi tuzatilgan p-qiymat bilan ko'rsatilgan (ko'p gipotezalarni tekshirish uchun Benjamini-Xoxberg tuzatishi bilan bir tomonlama Fisherning aniq testlari). b, ARACNE yordamida qurilgan NPC GRN kichik to'plamining tasviri. Barcha regulyatorlar SFARI genlari bo'lgan birinchi darajali nishon genlari bilan birga ko'rsatilgan. c, Ko'rsatilgan genlar to'plamlari ichida yuqori PageRank ballariga ega genlarning boyitilishini ko'rsatuvchi genlar to'plamini boyitish tahlili (GSEA) (Vaznli Kolmogorov-Smirnov ishlaydigan yigindi statistikasi, o'rnini almashtirish testi, ko'p gipotezalarni tekshirish uchun Benjamini-Xoxberg tuzatishi bilan). d, Turli xil genlar to'plamlaridagi regulyatorlar bo'ylab o'zaro bog'liqlik o'lchovi bo'lgan o'rtacha normallashtirilgan darajani ko'rsatuvchi ustunli diagramma. e, Iterativ walktrap klasterlash orqali aniqlangan eng yaxshi regulyatorlar modullarining tasviri. Shtrixli chiziqlar ushbu chiziqlar masshtabda emasligini ko'rsatadi. Alohida qiziqish uyg'otadigan genlar katta o'qlar bilan ta'kidlangan. E panelida batafsil tahlil qilingan KD nishonlari qizil shrift bilan ajratib ko'rsatilgan. f, Bir nechta genlar to'plamida CHD8 nishonlarining boyitilishini ko'rsatuvchi ustunli diagramma. Sugathan va boshq. (2014)45 ishidan NPC'lardagi CHD8 ChIP-seq ma'lumotlari. Ustunlar bir tomonlama Fisherning aniq testi asosida ehtimollar nisbatini (OR) ko'rsatadi; xatolik chiziqlari OR uchun 95% ishonch oralig'ining quyi chegarasini ko'rsatadi (bir tomonlama test uchun yuqori chegara aniqlanmagan). P-qiymatlar ko'p gipotezalarni tekshirish uchun Benjamini-Xoxberg tuzatishi yordamida tuzatilgan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-f1.jpg\" alt=\"1-rasm./ Autizm genlarining kamayishi keng tarqalgan transkriptomik konvergensiyani yuzaga chiqaradi. a, Eksperimental d\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm./ Autizm genlarining kamayishi keng tarqalgan transkriptomik konvergensiyani yuzaga chiqaradi. a, Eksperimental dizayn sxemasi. iPSC: induksiyalangan Pluripotent o'zak hujayralari. b, O'xshash natijalarga ega uchta mustaqil tahlilni aks ettiruvchi iPSC'dan hosil qilingan NPC madaniyatlarining immunositokimyosi. c, Maqsadli genning o'zini istisno qilgan holda, har bir nokdaun (KD) shartining differensial ekspreslangan genlari (DEG) ichida SFARI genlari yoki faqat aqliy zaiflik (ID-only) genlarining boyitilishini ko'rsatuvchi ustunli diagramma. Ustunlar bir tomonlama Fisherning aniq testi asosida ehtimollar nisbatini (OR) ko'rsatadi; xatolik chiziqlari OR uchun 95% ishonch oralig'ining quyi chegarasini ko'rsatadi (bir tomonlama test uchun yuqori chegara aniqlanmagan). P-qiymatlar ko'p gipotezalarni tekshirish uchun Benjamini-Xoxberg tuzatishi yordamida tuzatilgan. d, Turli xil KD shartlari o'rtasida taqsimlangan yuqori ishonchli SFARI DEG'larini tasvirlovchi sirkos diagrammasi (shuningdek, 3a-kengaytirilgan ma'lumotlar rasmiga qarang). e, Kamida 10 ta KD shartida DEG bo'lgan yuqori ishonchli SFARI genlarining nisbiy ekspresiyasini ko'rsatuvchi issiqlik xaritasi (shuningdek, 3b-c kengaytirilgan ma'lumotlar rasmiga qarang). Statistik jihatdan sezilarli DEG'lar ko'p gipotezalarni tekshirish uchun Benjamini-Xoxberg tuzatishi bilan DESeq2 (Vold testi) yordamida aniqlangan va * bilan belgilangan. 1-rasmdagi eng yaxshi autizm xavfi genlari qalin harflar bilan yozilgan. f, Vaqt o'tishi bilan CytoTrack bo'yoqining nisbiy intensivligi (-log2). Faqat vaqt o'tishi bilan barqaror bo'lgan statistik jihatdan sezilarli ta'sirlarni ko'rsatgan KD shartlari ko'rsatilgan. Grafik o'rtacha qiymat +/- o'rtachaning standart xatosini (SEM) ko'rsatadi. Statistik ahamlilik Dannetning ko'p taqqoslash testi bilan odatiy ikki tomonlama ANOVA yordamida aniqlandi. Har bir vaqt nuqtasi uchun har bir shart bo'yicha kamida uchta biologik jihatdan mustaqil namuna tahlil qilindi. To'liq statistik natijalar uchun 10-qo'shimcha jadvalga qarang.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"grn-tahlili-chd8-ni-assdagi-konvergensiyaning-asosiy-drayveri-sifatida-aniqlaydi\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#grn-tahlili-chd8-ni-assdagi-konvergensiyaning-asosiy-drayveri-sifatida-aniqlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GRN tahlili CHD8 ni АSСdagi konvergensiyaning asosiy drayveri sifatida aniqlaydi&lt;/span&gt;&lt;/a&gt;GRN tahlili CHD8 ni АSСdagi konvergensiyaning asosiy drayveri sifatida aniqlaydi&lt;/h4&gt;\n&lt;p&gt;Biz keyinchalik АSС bilan bog'langan transkriptomik konvergensiyaning asosiy drayverlari sifatida harakat qiluvchi GRN regulyatorlarini aniqladik. Ushbu tahlil АSС geni KD tomonidan faolligi barqaror ravishda o'zgargan va nishonlari ham SFARI genlari bilan boyitilgan, ham GRN markazida joylashgan 70 ta asosiy konvergensiya drayverini ochib berdi (S12-jadval). Ushbu asosiy konvergensiya drayverlarining deyarli yarmi SFARI genlaridir (31/70, ОШ = 6,35, tuzatilgan p = 3,9e-11) va deyarli uchdan bir qismi yuqori darajada ishongan HC-SFARI genlaridir (22/70, ОШ = 10,61, tuzatilgan p = 6,7e-12). Aksincha, ushbu asosiy konvergensiya drayverlarining faqat yettitasi faqat aqli zaiflik (ID-only) genlaridir (7/70, ОШ = 2,06, tuzatilgan p = 0,078). Qolaversa, ushbu asosiy konvergensiya drayverlari deyarli barcha АSС geni KD larida barqaror ravishda pastga regulyatsiya qilingan (S9b-rasm). Ular shuningdek GRN da (p &amp;lt; 1e-6) (4d-rasm) va oqsil-oqsil o'zaro ta'sirlari STRING ma'lumotlar bazasida (p = 2,0e-9) yuqori darajada o'zaro bog'langan (Metodlar).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GRN tahlili АSСda transkriptomik konvergensiyaning 70 ta asosiy drayverini aniqladi, ular orasida SFARI genlari ustunlik qilib, kuchli o'zaro bog'liqlik va gen KD da muvofiqlashtirilgan pasayishni namoyon etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bularni jamlagan holda, bu genlar nafaqat ko'plab АSС genlarining markaziy regulyatorlari sifatida harakat qilishini, balki bir-birini o'zaro tartibga solib, АSСda transkriptomik konvergensiyani keltirib chiqarishini ko'rsatadi. Iterativ walktrap klasterlash 70 ta asosiy konvergensiya drayverlari orasida to'rtta gen modulini aniqladi (4e-rasm), ulardan biri (ko'k) ayniqsa kuchli o'zaro bog'langan edi. Ushbu modul STRING tahlili orqali juda yuqori o'zaro ta'sirni ko'rsatdi (p &amp;lt; 1e-16) va o'z ichiga REST (S8-rasm) hamda АSС uchun eng kuchli ma'lum xavf genlaridan biri bo'lgan CHD8 ni oldi. Muhimi, GRN dan taxmin qilingan CHD8 reguloni ChIP-seq orqali ilgari aniqlangan to'g'ridan-to'g'ri CHD8 nishon genlari uchun kuchli boyitilgan edi (1-darajali regulon tuzatilgan p = 4,6e-7, 2-darajali regulon tuzatilgan p = 3,9e-20) (4f-rasm), bu ARACNe tomonidan bashorat qilingan regulyator munosabatlarning haqiqiyligini yanada tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ChIP-seq (xromatin immunopresipitatsiyasi va ketma-ketlikni aniqlash) metodi transkriptomik omillar kabi oqsillar genomning qaysi qismlariga birikishini aniqlash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Qolaversa, oldingi hisobotlarga mos ravishda, CHD8 ChIP-seq nishonlari ham NPC da ekspressiya qilinadigan SFARI genlari (tuzatilgan p = 2,6e-8) va HC-SFARI genlari (tuzatilgan p = 8,5e-8) uchun yuqori darajada boyitilgan edi. CHD8 ni o'z ichiga olgan modul biz bevosita ta'sir ko'rsatgan uchta transkripsion regulyatorni (SETD2, SETD5 va KMT2E) o'z ichiga oldi va ushbu KD lardan kelib chiqqan DEG lar CHD8 ChIP-seq nishonlari uchun sezilarli boyitishni ko'rsatdi (mos ravishda tuzatilgan p = 1,2e-5, 7,8e-8 va 2,6e-4) (4f-rasm), bu muhim АSС genlari tomonidan umumiy nishonlarning konvergent regulyatsiyasini yana bir bor namoyon etadi. Ushbu tahlil yuqori darajadagi ishonchli АSС xavf geni bo'lgan CHD8 ni АSСdagi transkriptomik konvergensiyaning asosiy drayveri sifatida ta'kidlaydi.&lt;/p&gt;\n&lt;h4 id=\"x-boglangan-transkripsion-omil-zfx-ass-genlarining-ayollar-jinsiga-qarab-ogishgan-regulyatoridir\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#x-boglangan-transkripsion-omil-zfx-ass-genlarining-ayollar-jinsiga-qarab-ogishgan-regulyatoridir\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;X-bog'langan transkripsion omil ZFX АSС genlarining ayollar jinsiga qarab og'ishgan regulyatoridir&lt;/span&gt;&lt;/a&gt;X-bog'langan transkripsion omil ZFX АSС genlarining ayollar jinsiga qarab og'ishgan regulyatoridir&lt;/h4&gt;\n&lt;p&gt;Oldingi tadqiqotlar shuni ko'rsatdiki, АSСda pastga regulyatsiya qilingan genlar neyrotipik ayollar miyasida erkaklarga qaraganda yuqoriroq darajada ekspressiya qilinishiga moyil bo'lib, bu bazal ayol jinsiga moyil ekspressiya FPE ga hissa qo'shishi mumkin bo'lgan ehtimolni oshiradi. Biz АSС geni KD tomonidan doimiy ravishda pastga regulyatsiya qilingan va miyada ayol jinsiga moyil ekspressiyani ko'rsatgan 82 ta genni aniqladik (Metodlar), ulardan 28 tasi yuqori darajada cheklangan bo'lib (S10a-rasm), shu jumladan 12 ta yuqori darajada cheklangan SFARI genlari mavjud (ОШ = 2,79, p = 8,65e-3) (5a-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;АSС geni KD da pastga regulyatsiya qilingan va miyada ayolga xos ekspressiyaga ega 82 ta genning aniqlanishi ularning autizmdagi jinsiy farqlarga qo'shadigan hissasini ko'rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Neyrotipik erkak nazoratchilar va autistik erkaklarning peshona qobig'idan olingan yagona yadroli RNKni ketma-ketlikka kiritish ma'lumotlarini qayta tahlil qilish (Metodlar) — shu jumladan 15q duplikatsiya sindromi va genetik idiopatik АSС bo'lgan shaxslar — ushbu yuqori darajada cheklangan genlarning ko'pchiligi autistik erkaklarning qo'zg'atuvchi neyronlarida sezilarli darajada pastga regulyatsiya qilinganligini aniqladi, bu ularning АSС bilan bog'liqligini yanada tasdiqlaydi (5a-rasm va S10a-rasm).&lt;/p&gt;\n&lt;p&gt;Bular orasida ZFX alohida qiziqish uyg'otadi, chunki u ayollarda faol va nofaol X-xromosomalarning ikkalasidan ham ekspressiya qilinadi, bu uni rivojlanayotgan bosh miya po'stlog'i (S10b-c-rasm) jumladan turli to'qimalar bo'ylab eng yuqori va eng barqaror ayol jinsiga moyil genlardan biriga aylantiradi. Qolaversa, yaqinda e'lon qilingan hisobot patogen ZFX variantlarini АSС bilan bog'ladi va ZFX genidagi qo'shimcha kodlovchi variantlar ham АSС probandlarida aniqlandi. ZFX umumgektomik nishonlarning kuchli transkripsion aktivatorini kodlaydi va biz GRN da ZFX va АSС bilan bog'liq gen to'plamlari o'rtasida ko'plab regulyator munosabatlarni aniqladik (5b-rasm), jumladan biz ilgari aniqlagan АSСdagi transkriptomik konvergensiyaning asosiy drayverlari (ОШ = 9,8, tuzatilgan p = 2,2e-6).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ushbu kuzatilgan regulyator aloqalar in vitro/ex vivo modellardan olingan bo'lib, aniq sabab-oqibat mexanizmlarini tasdiqlash uchun qo'shimcha in vivo funksional tadqiqotlar talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz shuningdek ZFX ushbu asosiy drayverlarning ko'pchiligining quyi oqimdagi nishoni ekanligini, bir nechta o'zaro regulyator munosabatlarga ega ekanligini aniqladik (5c-rasm). ZFX nishonlarining АSС bilan bog'liq genlar uchun kuchli boyitilishi ZFX ChIP-seq ma'lumotlarini qayta tahlil qilish orqali yana bir bor tasdiqlandi (5d-rasm). ZFX АSС genlari buzilganda takroriy ravishda pastga regulyatsiya qilinganligi sababli, uning ayol jinsiga moyil ekspressiyasi АSС bilan bog'liq genlarning regulyatori sifatidagi roli bilan birgalikda АSС genlari ekspressiyasiga kaskadli va keng jinsiy-differensial ta'sirlarga olib kelishi mumkin, bu esa АSСdagi FPE ga potentsial ravishda hissa qo'shishi mumkin (5e-rasm).&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"casrx-yordamida-nokdaun\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#casrx-yordamida-nokdaun\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CasRx yordamida nokdaun&lt;/span&gt;&lt;/a&gt;CasRx yordamida nokdaun&lt;/h4&gt;\n&lt;p&gt;Target transkriptlarni nokdaun (KD) qilish uchun CasRx17, jumladan NLS-RfxCas13d-NLS (Addgene #109049) nishonga xos yo‘naltiruvchi RNKlar (gRNA) bilan birgalikda ishlatildi. Qiziqish uyg‘otadigan genlarga yo‘naltirilgan gRNA spayser ketma-ketliklarini loyihalash uchun chuqur o‘rganishga asoslangan vositadan foydalanildi. Ushbu spayser ketma-ketliklari gomopolimerlarni (4 tadan ortiq A, 3 tadan ortiq C, G yoki T) istisno qilish uchun filtrlindi. Potentsial nishondan tashqari (off-target) ta’sir ko‘rsatish ehtimoli bo‘lgan spayser ketma-ketliklari BLAST yordamida aniqlandi va chiqarib tashlandi. Har bir maqsadli gen uchun 3 ta alohida spayser ketma-ketligi tanlandi va tandem pre-gRNA massiviga birlashtirildi, bunda har bir spayser ketma-ketligidan oldin CasRx to‘g‘ridan-to‘g‘ri takrorlanish (DR36) ketma-ketligi joylashtirildi: CAAGTAAACCCCTACCAACTGGTCGGGGTTTGAAAC. Tandem pre-gRNA massivlari KD uchun CasRx tomonidan alohida gRNA larga ishlov beriladi. To‘liq ketma-ketliklar Qo‘shimcha jadvalda keltirilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Nokdaun (KD) va gRNA — bu maxsus RNK-gidlar (gRNA) yordamida muayyan genlar ekspressiyasini pasaytirish bo‘lib, ular fermentlarni parchalanishi kerak bo‘lgan kerakli matritsali RNKga yo‘naltiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"molekulyar-klonlash\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#molekulyar-klonlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Molekulyar klonlash&lt;/span&gt;&lt;/a&gt;Molekulyar klonlash&lt;/h4&gt;\n&lt;p&gt;Birlamchi NPC KD eksperimentlari uchun konstruksiyalar yaratish maqsadida asos (backbone) sifatida pSicoR lentiviral plazmidasi (Addgene #11579) ishlatildi. Sichqoncha U6 promoteri CasRx gRNA massivlari ekspressiyasini boshqarish uchun foydalanilgan odam U6 promoteri bilan almashtirildi. Ushbu konstruksiyalar CasRx klonlangan (knock-in) hujayra liniyasi bilan birgalikda ishlatildi (pastda tasvirlangan). Avto-vestern-blot orqali CasRx KD ni tasdiqlash uchun yetarli miqdordagi NPC larni olish maqsadida (pastda tasvirlangan), CAG promotor elementidan CasRx va EGFP ni, hamda odam U6 promoteridan gRNA massivlarini eksprimatsiya qiluvchi barchasi birda (all-in-one) konstruksiyasi yaratildi. Shuningdek, asos tarkibida invertirlangan terminal takrorlanishlar (ITR) mavjud bo‘lib, bu piggyBac transposazasi yordamida konstruksiyaning genomga integratsiyalashuviga imkon berdi. Ushbu konstruksiyalar LiOn dizayniga asoslangan (Addgene #154019), shuning uchun CasRx va EGFP ekspressiyasi piggyBac transposazasi orqali konstruksiyaning rekombinatsiyasiga bog‘liq bo‘lib, episomal plazmidadan ekspressiyaning oldini oldi. Ushbu barchasi birda konstruksiyasi ftorofor KD tahlillari va NPC proliferatsiya tahlillari uchun ham ishlatildi. NPC larda ftoroforlarni eksprimatsiya qilish uchun CAG promotor elementi boshqaradigan mKO2, mScarlet yoki iRFP670 o‘z ichiga olgan iOn asosidagi konstruksiyalar yaratildi. shRNA asosidagi KD uchun shRNA dizayni Horizon siDesign Center vositasi (https://horizondiscovery.com/en/ordering-and-calculation-tools/sidesign-center) yordamida amalga oshirildi. G bilan boshlanadigan bashorat qilingan shRNA lar tanlandi va potentsial nishondan tashqari o‘zaro ta’sirlarga ega bo‘lganlari BLAST yordamida aniqlanib, chiqarib tashlandi. Tanlangan shRNA lar (Qo‘shimcha jadval 13) pSicoR plazmidasiga (Addgene #11579) klonlandi. Organoid eksperimentlari uchun biz FLEx dizaynini o‘z ichiga olgan asosga bir nechta xususiyatlarni muhandislik usulida kiritish orqali FLEx asosidagi Indutsiya qilinadigan CRISPR nokdaun (FLICK) konstruksiyasini yaratdik. Xususan, biz intronni o‘z ichiga olgan va klonlash paytida plazmidaning rekombinatsiyasini oldini oladigan o‘zgartirilgan Cre rekombinazasini qo‘shdik. Shuningdek, doksikilin ta’sirida induksiyalanadigan rekombinatsiyani ta’minlash uchun CasRx17 hamda Tet-On 3G tizimining barcha kerakli komponentlarini kiritdik. Bundan tashqari, flüoresan reportyorlar uchun polyA saytlaridan biroz yuqoriroqda identifikatsiya qiluvchi shtrix-kod ketma-ketliklarini kiritdik, bu esa yagona hujayra RNK sekvensiyasi (scRNA-seq) orqali har bir hujayraga qaysi KD konstruksiyasi kiritilganligini aniqlash imkonini berdi. Nihoyat, piggyBac transposazasi yordamida konstruksiyaning genomga integratsiyalashuviga imkon beruvchi ITR larni qo‘shdik. Barcha konstruksiyalarning ketma-ketliklari to‘liq plazmida sekvensiyasi (Plasmidsaurus) yordamida tekshirildi.&lt;/p&gt;\n&lt;h4 id=\"hujayra-madaniyati\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#hujayra-madaniyati\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hujayra madaniyati&lt;/span&gt;&lt;/a&gt;Hujayra madaniyati&lt;/h4&gt;\n&lt;p&gt;Barcha odam hujayralari madaniyati ishlari Boston Bolalar kasalxonasining IRB #S07-02-0087 tomonidan tasdiqlangan bayonnomalar ostida amalga oshirildi. Nazorat erkak odam iPSC liniyasi “280” ilgari hosil qilingan va to‘liq tavsiflangan. Odam iPSC lari va iPSC dan kelib chiqqan NPC lar Matrigel (Corning #354277) yoki Geltrex (ThermoFisher #A1413302) bilan oldindan qoplangan to‘qima madaniyati plitalarida o‘stirildi. Hujayralar Accutase (Millipore Sigma #SCR005) yoki ReleSR (StemCell Technologies #100-0483) yordamida kerak bo‘lganda pasajlandi. Odam iPSC lari mTeSR™ Plus muhitida (StemCell Technologies #100-0276) kultivatsiya qilindi. Odam NPC lari iPSC lardan STEMdiff™ SMADi Neural Induction Kit (StemCell Technologies #08582) yordamida Monolayer Culture Protocol ga amal qilgan holda kamida uch hafta davomida hosil qilindi. NPC lar Neural Induction Medium + SMADi muhitida uzluksiz o‘stirildi va Neural Progenitor Medium ga o‘tkazilmadi. Muhitga iPSC yoki NPC lar pasajlanganidan keyin taxminan 1 kun davomida 10 mkM Y-27632 (StemCell Technologies #72304) qo‘shildi. Miya organoidlari Giandomenico va boshq. (2021) tavsiyalari hamda qo‘shimcha modifikatsiyalar bilan 280-iPSC lardan STEMdiff™ Cerebral Organoid Kit (StemCell Technologies #08570) yordamida hosil qilindi. Xususan, organoidlar 7-kuni Matrigelga (Corning #354277) ko‘milgan va 14-kunga qadar Expansion Medium da o‘stirilgan, shundan so‘ng ular Matrigeldan chiqarilib, orbital chayqatgichda Maturation Medium ga o‘tkazilgan. Protokollar bo‘yicha to‘liq tafsilotlarni quyidagi manzilda ko‘rishingiz mumkin: https://dx.doi.org/10.17504/protocols.io.x54v95p5ql3e/v1. Hujayra liniyalarining hech biri autentifikatsiya qilinmagan. Barcha hujayra liniyalari mikoplazma bilan zararlanmagani muntazam ravishda tekshirilib turildi.&lt;/p&gt;\n&lt;h4 id=\"casrx-knock-in-ipsc-larni-olish\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#casrx-knock-in-ipsc-larni-olish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CasRx Knock-in iPSC larni olish&lt;/span&gt;&lt;/a&gt;CasRx Knock-in iPSC larni olish&lt;/h4&gt;\n&lt;p&gt;CasRx17 ilgari tasvirlangan nishonga olish konstruksiyalari yordamida 280-iPSC larning AAVS1 xavfsiz harbor lokusiga kiritildi. Alohida iPSC koloniyalari tanlab olindi va ko‘paytirildi. AAVS1 lokusining to‘g‘ri nishonga olinganini tasdiqlash uchun Celplor tomonidan Southern blot tahlili bajarildi. Kariootip tahlili KaryoStat (ThermoFisher) yordamida amalga oshirildi, u 1-xromosomada mikromatrix nomenklaturasida arr[GRCh37] 1q32.1(204108163_206539638)x3 sifatida tasvirlangan 2,4 Mb ortishni aniqladi. Bu hududda maqsadli genlarning hech biri mavjud emas edi.&lt;/p&gt;\n&lt;h4 id=\"lentivirus\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#lentivirus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Lentivirus&lt;/span&gt;&lt;/a&gt;Lentivirus&lt;/h4&gt;\n&lt;p&gt;Lentivirus ilgari tasvirlangan standart protokollar yordamida hosil qilindi. Lentiviruslar 4,0 infeksiya ko‘pligi (MOI) darajasida qo‘llanildi, chunki bunday MOI &amp;gt;98% transformatsiyalangan hujayralarni beradi. RNK 24 soatdan keyin ajratib olindi.&lt;/p&gt;\n&lt;h4 id=\"rnk-sekvenirlash-rna-seq-uchun-kutubxonani-tayyorlash\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#rnk-sekvenirlash-rna-seq-uchun-kutubxonani-tayyorlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RNK Sekvenirlash (RNA-Seq) uchun Kutubxonani Tayyorlash&lt;/span&gt;&lt;/a&gt;RNK Sekvenirlash (RNA-Seq) uchun Kutubxonani Tayyorlash&lt;/h4&gt;\n&lt;p&gt;Umumiy RNK Direct-zol RNA Microprep Kit (Zymo Research, #R2062) yordamida ajratib olindi va 3’ RNK-seq kutubxonalari CheapSeq bayonnomasidan tavsiyalar va guruhlash strategiyalarini o'z ichiga olgan holda TagSeq bayonnomasining o'zgartirilgan versiyasiga muvofiq tayyorlandi. Qisqacha aytganda, har bir namunadan 200 ng umumiy RNK CheapSeq uchun ta'riflanganidek, indekslangan oligo(dT) praymeri va bufer (NEB, #M0466L) bilan birlashtirildi. RNK qopqoqsiz, oldindan qizdirilgan termotsiklerda 94 °C da 2,5 minut davomida fragmentlarga bo'lindi, shundan so'ng namunalar darhol muzga o'tkazildi. Keyin har bir namuna CheapSeq uchun ta'riflanganidek, tesk riptaza uchun zarur bo'lgan qo'shimcha reagentlar bilan birga indeks va noyob molekulyar identifikatorni (UMI) o'z ichiga olgan matritsani almashtiruvchi oligo (TSO) bilan aralashtirildi. Teskari transkripsiya reaksiyasi issiqlik bilan inaktivatsiyasisiz 42 °C da 90 minut davomida amalga oshirildi. Qolgan bir zanjirli RNK va oligolar keyinchalik 0,5 mkl EB buferi (Qiagen, #19086), 0,5 mkl termolabil ExoI (NEB, #M0568S) va 0,25 mkl RNase A (ThermoFisher, #EN0531) qo'shish va namunalarni 37 °C da 30 minut davomida inkubatsiya qilish, so'ngra 85 °C da 5 minut davomida issiqlik bilan inaktivatsiya qilish va 4 °C da ushlab turish bosqichi orqali parchalandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;SPRI-seleksiya — bu magnit zarrachalar yordamida DNKni tozalash usuli bo'lib, kerakli o'lchamdagi fragmentlarni ajratib olish imkonini beradi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Turli xil indeks ketma-ketliklariga ega bo'lgan 8 tagacha namuna birlashtirildi va 1,4x chap tomonlama SPRI-seleksiya (Beckman Coulter, #B23317) yordamida kDNT tozalandi. Keyin C1000 Touch Thermal Cycler (Bio-Rad, #1851197) yordamida pastda tavsiflangan “CheapSeq PCR” parametrlariga amal qilgan holda kDNT ni 7 sikl davomida amplifikatsiya qilish uchun qisman Read1 va qisman Read2 praymerlari bilan birga Q5 UltraII Mastermix (NEB, #M0544L) ishlatildi. Amplifikatsiyalangan kDNT 0,7x chap tomonlama SPRI-seleksiya (Beckman Coulter, #B23317) orqali tozalandi. Yakuniy kutubxona qurilishi Q5 UltraII Mastermix (NEB, #M0544L) hamda standart TruSeq indekslash praymerlari (NEB, #E6440S) yordamida va pastda tavsiflangan “CheapSeq PCR” parametrlariga amal qilgan holda 8 sikl davomida amplifikatsiya qilish orqali amalga oshirildi. Kutubxonalar 0,4x-0,65x ikki tomonlama SPRI-seleksiya (Beckman Coulter, #B23317) yordamida tozalandi. Tozalangan kutubxonalar Tapestation HSD1000 (Agilent, #5067-5584 va #5067-5585) yordamida baholandi. Oligo ketma-ketliklari uchun Qo'shimcha 14-jadvalga qarang. CheapSeq ПЦР: 1. 98 °C da 30 s; 2. 98 °C da 10 s, 65 °C da 75 s bo'lgan X sikl; 3. 65 °C da 5 min; 4. 4 °C abadiy.&lt;/p&gt;\n&lt;h4 id=\"casrx-kd-npc-larning-hajmli-rnk-seq-tahlilidan-differensial-ekspressiya-qilingan-gen-deg-tahlili\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#casrx-kd-npc-larning-hajmli-rnk-seq-tahlilidan-differensial-ekspressiya-qilingan-gen-deg-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CasRx-KD NPC larning hajmli RNK-seq tahlilidan Differensial Ekspressiya qilingan Gen (DEG) tahlili&lt;/span&gt;&lt;/a&gt;CasRx-KD NPC larning hajmli RNK-seq tahlilidan Differensial Ekspressiya qilingan Gen (DEG) tahlili&lt;/h4&gt;\n&lt;p&gt;Har bir shart uchun uchta alohida NPC namunasi tahlil qilindi. Individual KD shartlari birgalikda 9 ta nazorat namunasi to'plami sifatida ko'rib chiqilgan uchta nishonsiz nazorat (NTC) shartlari bilan taqqoslandi. Gen ekspresiyasi UMI dedublikatsiyasi bilan alevin-fry yordamida miqdoriy aniqlandi (salmon-v1.9). Salmon indeksi va transkriptdan gengacha bo'lgan xarita Gencode v45 yordamida tuzildi. Bir xil gengacha xaritalangan alohida transkriptlarning soni jamlandi. Keyingi tahlillar uchun faqat NTC namunalarida baseMean ekspresiyasi &amp;gt;10 bo'lgan genlar ko'rib chiqildi. Differensial ekspresiya tahlili ~Batch + sgRNA modeli yordamida DESeq2 (v1.42.0) yordamida amalga oshirildi. KD ni tasdiqlash uchun p-qiymatlar bevosita nishonga olingan 20 ta genlar to'plami uchun ko'p gipotezalarni sinovdan o'tkazish uchun Benjamini-Hochberg tuzatishi yordamida tuzatildi. SRCAP uchun xom p-qiymat Tomchi Raqamli PtsR (quyida qarang) dan olingan, chunki SRCAP past ekspresiya tufayli RNK-seq tahlilidan filtrlangandi. Qarang&lt;/p&gt;\n&lt;h4 id=\"tomchi-raqamli-ptsr-ddpcr\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#tomchi-raqamli-ptsr-ddpcr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tomchi Raqamli PtsR (ddPCR)&lt;/span&gt;&lt;/a&gt;Tomchi Raqamli PtsR (ddPCR)&lt;/h4&gt;\n&lt;p&gt;Past ekspresiya tufayli RNK-seq tahlilidan filtrlanganning SRCAP KD ni tasdiqlash uchun, RNK-seq uchun ishlatilgan bir xil RNK namunalari (yuqorida) ddPCR yordamida baholandi. RNK birinchi navbatda SuperScript™ IV VILO™ Master Mix (ThermoFisher Scientific, #11756050) yordamida kDNT ga aylantirildi. Keyinchalik, ddPCR 0,25 ng/mkl RNKga ekvivalent konsentratsiyadagi kDNT (20 mkl reaksiya uchun 5 ng), yakuniy konsentratsiyasi 0,1 mkm bo'lgan praymerlar va QX200™ ddPCR™ EvaGreen Supermix (Bio-Rad, #1864033) ni birlashtirish orqali amalga oshirildi. ddPCR reaksiyalari QX200 AutoDG Droplet Digital PCR System (Bio-Rad) yordamida amalga oshirildi. Ekspresiya darajalari uy xo'jaligi geni HPRT1 ekspresiyasi yordamida normallashtirildi. Natijalar Expr ~ Batch + type modeli yordamida tahlil qilindi, bu yerda type yo NTC yoki nishon gen (SRCAP) edi. Olingan xom p-qiymat bevosita nishonga olingan 20 ta genlar to'plami uchun ko'p gipotezalarni sinovdan o'tkazish uchun Benjamini-Hochberg tuzatishi yordamida boshqa KD nishonlari (yuqoridagi RNK-seq dan) bilan birga tuzatildi. Qarang&lt;/p&gt;\n&lt;h4 id=\"praymer-dizayni\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#praymer-dizayni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Praymer Dizayni&lt;/span&gt;&lt;/a&gt;Praymer Dizayni&lt;/h4&gt;\n&lt;p&gt;Praymerlar (Qo'shimcha 15-jadval) BLAST71 yordamida potentsial nishondan tashqari o'zaro ta'sirlarni baholaydigan Primer-BLAST84 yordamida ishlab chiqilgan. Oligolar Azenta yoki IDT orqali buyurtma qilingan. Praymer spetsifikligi PtsR mahsulotlarini Sanger sekvenirlash orqali tasdiqlandi (Azenta).&lt;/p&gt;\n&lt;h4 id=\"avtomatik-vestern-blot\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#avtomatik-vestern-blot\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Avtomatik Vestern Blot&lt;/span&gt;&lt;/a&gt;Avtomatik Vestern Blot&lt;/h4&gt;\n&lt;p&gt;CasRx KD dan keyin oqsil ekspresiyasi darajasini tahlil qilish uchun LiOn asosidagi KD konstruktsiyalari (“Molekulyar Klonlash” ga qarang) piggyBac-transpazani eksprimatsiya qiluvchi plazmid bilan birga 280-NPC larga nukleofektsiya qilindi (tafsilotlar uchun “Nukleofektsiya” ga qarang). To'rt kun o'tgach, KD konstruktsiyalarini eksprimatsiya qiluvchi EGFP+ hujayralar FACS (BD FACSymphony™ S6) yordamida yig'ildi. Hujayralar pelet qilindi va suyuq azotda tez muzlatildi. Oqsil ekstraksiyasi va avtomatik vestern blot RayBiotech tomonidan quyidagi antitelolar yordamida amalga oshirildi: Vinculin (R&amp;amp;D systems, MAB6896, klon 728526) 1:25 suyultirilgan va WAC (Abcam, AB109486) 1:50 suyultirilgan.&lt;/p&gt;\n&lt;h4 id=\"gen-toplamlari\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#gen-toplamlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gen To'plamlari&lt;/span&gt;&lt;/a&gt;Gen To'plamlari&lt;/h4&gt;\n&lt;ol&gt;\n&lt;li&gt;SFARI genlari: SFARI gen ma'lumotlar bazasiga kiritilgan barcha genlar14 (2025-yil 3-aprel nashri).&lt;/li&gt;\n&lt;li&gt;Yuqori ishonchli SFARI (HC-SFARI) genlari: 1 ballga ega bo'lgan SFARI genlari.&lt;/li&gt;\n&lt;li&gt;Aqliy zaiflik (ID) genlari: SysNDD ma'lumotlar bazasidan85 (2025-yil 23-avgustda kirilgan) quyidagi genlar:&lt;br /&gt;\na. ID atamasi bilan bog'langan (HP:0001249, HP:0001256, HP:0002342, HP:0010864, HP:0002187);&lt;br /&gt;\nb. “aniq” (definitive) toifasida bo'lgan;&lt;br /&gt;\nc. SFARI genlari bo'lmagan.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"boyitish-tahlillari\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#boyitish-tahlillari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Boyitish tahlillari&lt;/span&gt;&lt;/a&gt;Boyitish tahlillari&lt;/h4&gt;\n&lt;p&gt;Boyitish tahlillari bir tomonlama Fisherning aniq testlari (fisher.test, base R v4.3.1) yordamida amalga oshirildi va p-qiymatlar ko'pikli gipotezalarni tekshirish uchun Benjamini-Hochberg tuzatishi yordamida tuzatildi (p.adjust, method = “BH”, base R v4.3.1). Ustunli diagrammalar sifatida ko'rsatilganda, asosiy ustunlar bir tomonlama Fisherning aniq testidagi imkoniyatlar nisbatini (OR) bildiradi; xatolik chiziqlari OR bo'yicha 95% ishonch oralig'ining quyi chegarasini ko'rsatadi (bir tomonlama test uchun yuqori chegara aniqlanmagan).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Fisherning aniq testi va Benjamini-Hochberg tuzatishi bir nechta taqqoslashlar paytida soxta musbat natijalardan himoyalangan holda, qaysi biologik funksiyalar yoki yo'llar bizning ma'lumotlarimizda ortiqcha taqdim etilganligini statistik baholash uchun qo'llaniladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"fluoroforlarni-nokdaun-qilish\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#fluoroforlarni-nokdaun-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fluoroforlarni nokdaun qilish&lt;/span&gt;&lt;/a&gt;Fluoroforlarni nokdaun qilish&lt;/h4&gt;\n&lt;p&gt;Fluoroforlarni ekspressiya qiluvchi konstruktlar (qarang: “Molekulyar klonlash”) piggyBac-transpozazani ekspressiya qiluvchi plazmida bilan birga 280-iPSC hujayralariga nukleofeksiya qilindi (batafsil ma'lumot uchun “Nukleofeksiya” bo'limiga qarang). iPSC hujayralari ko'paytirildi, so'ngra barcha uchta fluoroforni ekspressiya qiluvchi hujayralar Cytek Aurora CS spektral hujayra saralagichi yordamida FACS orqali ajratib olindi. Saralangan iPSC hujayralari yana ko'paytirildi va keyin NPC larga induksiya qilindi (qarang: “Hujayra madaniyati”). Keyinchalik LiOn asosidagi CasRx KD konstruktlari piggyBac-transpozazani ekspressiya qiluvchi plazmida bilan birga ushbu NPC larga nukleofeksiya qilindi. To'rt kun o'tgach, barcha to'rtta fluoroforni ekspressiya qiluvchi hujayralar (EGFP KD konstruktlarining ekspressiyasini ko'rsatgan holda) Cytek Aurora CS spektral hujayra saralagichi yordamida reporterlarning flüoresans intensivligi uchun tahlil qilindi. Namunalar va reporterlar bo'yicha geometrik o'rtacha f
