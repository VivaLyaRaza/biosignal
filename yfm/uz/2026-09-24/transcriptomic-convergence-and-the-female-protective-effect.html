lüoresans intensivligidagi (log2) sezilarli farqlarni sinab ko'rish uchun Bonferronining ko'p sonli taqqoslash testi bilan oddiy ikki tomonlama ANOVA ishlatildi.&lt;/p&gt;\n&lt;h4 id=\"shrna-yordamida-nokdaun-qilish\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#shrna-yordamida-nokdaun-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;shRNA yordamida nokdaun qilish&lt;/span&gt;&lt;/a&gt;shRNA yordamida nokdaun qilish&lt;/h4&gt;\n&lt;p&gt;Har bir nishon uchun uch xil shRNA ga ega pSicoR asosidagi konstruktlar hovuzga jamlandi va keyin 280-NPC larga nukleofeksiya qilindi (batafsil ma'lumot uchun “Nukleofeksiya” qarang, bu yerda tasvirlangan o'zgarishlar bilan). Ushbu konstruktlar transpozitsiyaga qodir bo'lmagani sababli, piggyBac transposase73 ni ekspressiya qiluvchi plazmida chiqarib tashlandi va buning o'rniga pSicoR asosidagi plazmida miqdori jami 15 mkg gacha oshirildi. Nukleofeksiyadan keyingi kuni konstruktlarni ekspressiya qiluvchi EGFP+ hujayralar FACS (BD FACSymphony™ S6) yordamida ajratib olindi va bir kecha davomida tiklanishi uchun qayta ekildi. Keyingi kuni Zymo DNA/RNA Shield yordamida RNK yig'ildi. 3’ RNA-seq Plasmidsaurus tomonidan amalga oshirildi (DGE RNA-Seq xizmati).&lt;/p&gt;\n&lt;h4 id=\"shrna-kd-npc-larning-bulk-rna-seq-malumotlarini-deg-tahlili\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#shrna-kd-npc-larning-bulk-rna-seq-malumotlarini-deg-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;shRNA-KD NPC larning bulk RNA-seq ma'lumotlarini DEG tahlili&lt;/span&gt;&lt;/a&gt;shRNA-KD NPC larning bulk RNA-seq ma'lumotlarini DEG tahlili&lt;/h4&gt;\n&lt;p&gt;Differensial ekspressiya tahlili bizning CasRx-KD tajribalarimiz bilan bir xil tahliliy quvur liniyasi yordamida amalga oshirildi: ~targetGene modeli bilan differensial ekspressiya tahlilini o'tkazish uchun DESeq2 (v1.42.0) ishlatildi, bunda differensial ekspressiya NTC shRNA larga nisbatan hisoblandi (ekspressiya qilinmaydigan transkriptlar lusiferaza va lacZ ga mo'ljallangan). Transkriptomik miqyosdagi tahlillar uchun p-qiymatlar NTC hujayralarida baseMean &amp;gt;10 bo'lgan 14 601 ta gen to'plami uchun ko'pikli gipotezalarni tekshirish uchun Benjamini-Hochberg tuzatishi yordamida tuzatildi. Differensial ekspressiya qilingan genlar (DEG) tuzatilgan p-qiymati &amp;lt; 0.05 bo'lgan differensial ekspressiya qilingan genlar sifatida aniqlandi.&lt;/p&gt;\n&lt;h4 id=\"deneault-va-boshq-2018-gen-ekspressiyasi-malumotlarini-tahlil-qilish\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#deneault-va-boshq-2018-gen-ekspressiyasi-malumotlarini-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Deneault va boshq. (2018) gen ekspressiyasi ma'lumotlarini tahlil qilish&lt;/span&gt;&lt;/a&gt;Deneault va boshq. (2018) gen ekspressiyasi ma'lumotlarini tahlil qilish&lt;/h4&gt;\n&lt;p&gt;Deneault va boshq. (2018)20 dan olingan gen ekspressiyasi sonlari GEO dan yuklab olindi (GSE107878). Differensial ekspressiya tahlili bizning CasRx-KD tajribalarimiz bilan bir xil tahliliy quvur liniyasi yordamida amalga oshirildi: expression ~ targeted gene modeli bilan differensial ekspressiya tahlilini bajarish uchun DESeq2 (v1.42.0) ishlatildi. Differensial ekspressiya qilingan genlar (DEG) ham neyronlar, ham induksiyalangan Pluripotent o'zak hujayralari uchun nazorat hujayralariga nisbatan aniqlandi. Nazorat namunalarida o'rtacha gen ekspressiyasi 10 dan yuqori bo'lgan genlargina potensial DEG sifatida ko'rib chiqildi va p-qiymatlar Benjamini-Hochberg tuzatishi yordamida tegishli ravishda tuzatildi. DEG tuzatilgan p-qiymati &amp;lt; 0.05 bo'lgan differensial ekspressiya qilingan genlar sifatida aniqlandi.&lt;/p&gt;\n&lt;h4 id=\"ozaro-boyitish-tahlili\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#ozaro-boyitish-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;O'zaro boyitish tahlili&lt;/span&gt;&lt;/a&gt;O'zaro boyitish tahlili&lt;/h4&gt;\n&lt;p&gt;Biz quyidagilar orasidagi DEG overlapini miqdoriy baholadik: (1) NPC larda bizning CasRx-KD tajribalarimiz, (2) NPC larda bizning shRNA-KD tajribalarimiz, (3) Deneault va boshq. (2018)20 dan KO iPSC va (4) Deneault va boshq. (2018)20 dan KO ExN. DEG larning har bir juftlik taqqoslashi uchun boyitish tahlillari ko'rib chiqilayotgan ikkala namuna turi tomonidan ekspressiya qilingan genlar koinoti bilan bir tomonlama Fisherning aniq testlari yordamida amalga oshirildi. P-qiymatlar ko'pikli gipotezalarni tekshirish uchun Benjamini-Hochberg tuzatishi yordamida tuzatildi.&lt;/p&gt;\n&lt;h4 id=\"sfari-genlari-bilan-ekspressiya-korrelyatsiyasini-tahlil-qilish\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#sfari-genlari-bilan-ekspressiya-korrelyatsiyasini-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SFARI genlari bilan ekspressiya korrelyatsiyasini tahlil qilish&lt;/span&gt;&lt;/a&gt;SFARI genlari bilan ekspressiya korrelyatsiyasini tahlil qilish&lt;/h4&gt;\n&lt;p&gt;Qiziqish uyg'otadigan gen bizning NPC RNA-seq ma'lumotlarimizda SFARI genlari bilan sezilarli darajada birgalikda ekspressiya qilinganligini aniqlash uchun biz qiziqish uyg'otadigan gen va har bir SFARI geni o'rtasidagi median Pirson korrelyatsiyasini hisobladik. Ushbu korrelyatsiya darajasi sezilarli ekanligini baholash uchun biz NPC da ekspressiya qilingan genlar koinotidan foydalangan holda (NTC larda baseMean &amp;gt; 10), qiziqish uyg'otadigan gen va SFARI genlari to'plami bilan bir xil o'lchamdagi 1000 ta tasodifiy tanlangan genlar to'plami o'rtasidagi median korrelyatsiyani hisoblash orqali empirik nol taqsimotni yaratdik. Shundan so'ng, bir tomonlama empirik p-qiymat kuzatilgan median korrelyatsiyadan katta yoki unga teng bo'lgan nol qiymatlarning ulushi sifatida hisoblandi. P-qiymatlari &amp;lt; 0.05 bo'lgan regulyatorlar SFARI genlari bilan sezilarli darajada korrelyatsiya qilingan deb hisoblandi.&lt;/p&gt;\n&lt;h4 id=\"barqaror-ravishda-pasaygan-deg-larni-aniqlash\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#barqaror-ravishda-pasaygan-deg-larni-aniqlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Barqaror ravishda pasaygan DEG larni aniqlash&lt;/span&gt;&lt;/a&gt;Barqaror ravishda pasaygan DEG larni aniqlash&lt;/h4&gt;\n&lt;p&gt;Barqaror ravishda pasaygan DEG lar quyidagilarni ko'rsatgan genlar sifatida aniqlandi: 1) kamida uchta KD tomonidan statistik jihatdan sezilarli darajada pasayish va 2) barcha KD larda sezilarli differensial ekspressiya yo'nalishida kamida 80% muvofiqlik.&lt;/p&gt;\n&lt;h4 id=\"cheklov-tahlili\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#cheklov-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklov tahlili&lt;/span&gt;&lt;/a&gt;Cheklov tahlili&lt;/h4&gt;\n&lt;p&gt;Genetik cheklovni baholash uchun gnomad v286 dan LOEUF ballari (oe_lof_upper) olindi. Har bir gen uchun biz har bir gen bilan bog'liq transkriptlarning LOEUF qiymatlarining medianasini hisoblash orqali gen uchun bittadan LOEUF ballini hisobladik. LOEUF uzluksiz metrika bo'lsa-da, yuqori darajada cheklangan genlarni aniqlash uchun tavsiya etilganidek, LOEUF &amp;lt; 0.35 dan foydalandik.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LOEUF metrikasi odamlarda inaktivatsiya qiluvchi mutatsiyalarning maqbulligini baholaydi: pastroq qiymatlar mutatsiyalarga qarshi kuchli evolyutsion bosimni (yuqori gen konserativligini) ko'rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"asd-xavfining-nomzod-genlari-uchun-qoshimcha-malumotlar\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#asd-xavfining-nomzod-genlari-uchun-qoshimcha-malumotlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ASD xavfining nomzod genlari uchun qo'shimcha ma'lumotlar&lt;/span&gt;&lt;/a&gt;ASD xavfining nomzod genlari uchun qo'shimcha ma'lumotlar&lt;/h4&gt;\n&lt;p&gt;Quyidagi yirik sekvenirlash tadqiqotlarining istalgan birida aniqlangan ASD xavfining nomzod genlari (8-qo'shimcha jadval) 9-qo'shimcha jadvalga kiritildi: 1. Trost va boshq. (2022); 2. Zhou va boshq. (2022); 3. Wang va boshq. (2022); 4. Doan va boshq. (2019); 5. Rodin va boshq. (2021); 6. Wilfert va boshq. (2021). Qo'shimcha adabiyotlar: 1. Alcantara va boshq. (2017); 2. Marcelis va boshq. (2024); 3. Ruiz-Reig va boshq. (2024); 4. McGhee va boshq. (2025).&lt;/p&gt;\n&lt;h4 id=\"nukleofeksiya\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#nukleofeksiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nukleofeksiya&lt;/span&gt;&lt;/a&gt;Nukleofeksiya&lt;/h4&gt;\n&lt;p&gt;Nukleofeksiyalar Neon Transfection System (ThermoFisher Scientific) yordamida amalga oshirildi. NPC'lar uchun 2 million hujayra 100 mkl uchi (tips) yordamida 10 mkg tashuvchan plazmida va piggyBac transposazasini ifodalovchi 2 mkg plazmida bilan nukleofeksiya qilindi. iPSC'lar uchun 1 million hujayra 100 mkl uchi (tips) yordamida 5 mkg tashuvchan plazmida va piggyBac transposazasini ifodalovchi 1 mkg plazmida bilan nukleofeksiya qilindi. Kichik miqyosdagi nukleofeksiyalar uchun 10 mkl uchi ishlatildi va hujayra soni hamda plazmida miqdori proporsional ravishda kamaytirildi. NPC'larni nukleofeksiya qilish quyidagi parametrlar yordamida bajarildi: kuchlanish = 1600 V, kenglik = 10, impuls soni = 3. iPSC'larni nukleofeksiya qilish quyidagi parametrlar yordamida bajarildi: kuchlanish = 950 V, kenglik = 30, impuls soni = 2.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Nukleofeksiya — bu hujayra yadrosiga DNKni elektr impulslari yordamida to'g'ridan-to'g'ri kiritish usuli bo'lib, u qiyin transfeksiya qilinadigan hujayra turlarida yuqori samaradorlik ko'rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"npc-proliferatsiyasi-tahlillari\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#npc-proliferatsiyasi-tahlillari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;NPC proliferatsiyasi tahlillari&lt;/span&gt;&lt;/a&gt;NPC proliferatsiyasi tahlillari&lt;/h4&gt;\n&lt;p&gt;LiOn asosidagi KD konstruktlari («Molekulyar klonlash» bo'limiga qarang) piggyBac transposazasini ifodalovchi plazmida bilan birgalikda 280-NPC'larga nukleofeksiya qilindi (batafsil ma'lumot uchun «Nukleofeksiya» bo'limiga qarang). To'rt kun o'tgach, hujayralar muhitda 1:500 nisbatda suyultirilgan CYTOTRACK™ Red 628/643 Cell Proliferation Assay Kit (Bio-Rad #1351205) to'plamidagi bo'yoq bilan 20 daqiqa davomida ishlov berildi. So'ngra hujayralar PBS (ThermoFisher Scientific #10010031) bilan yuvildi va passaj qilindi; har bir namunaning 1/5 qismi keyingi 4 vaqt nuqtasi uchun foydalaniladigan 4 ta alohida planshetning bitta qudug'iga ekildi. Qolgan hujayralar 0-kunda (d0) boshlang'ich CytoTrack intensivligini baholash uchun oqim sitometriyasi (BD FACSDiva dasturiy ta'minoti v8.0.3) yordamida tahlil qilindi. Keyingi 4 kun davomida har kuni har bir namunaning 1 ta qudug'i dissotsiatsiya qilindi va oqim sitometriyasi yordamida tahlil qilindi. KD konstruktini ifodalovchi EGFP+ hujayralardagi CytoTrack intensivligi qiymatlari (manfiy log2) proliferatsiya tezligidagi quduqlararo o'zgaruvchanlikni nazorat qilish uchun o'sha quduqdagi EGFP- hujayralarga nisbatan normallashtirildi. Ular, shuningdek, bo'yoqning o'zlashtirilishidagi o'zgaruvchanlikni nazorat qilish uchun d0 dagi boshlang'ich CytoTrack intensivligiga nisbatan ham normallashtirildi. Har bir KD uchun natijalar NTC namunalarining o'rtacha qiymatiga nisbatan ko'rsatildi va o'rtacha +/- o'rtachaning standart xatosi (SEM) sifatida grafikda aks ettirildi. Statistik tahlil Dunnettning ko'p sonli taqqoslash testi (GraphPad Prism) bilan oddiy ikki omilli dispersiya tahlili (ordinary two-way ANOVA) yordamida bajarildi. Namunalar soni va statistik natijalar bo'yicha to'liq ma'lumotlar 10-qo'shimcha jadvalda keltirilgan.&lt;/p&gt;\n&lt;h4 id=\"flick-rekombinatsiyasini-induksiya-qilish\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#flick-rekombinatsiyasini-induksiya-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;FLICK rekombinatsiyasini induksiya qilish&lt;/span&gt;&lt;/a&gt;FLICK rekombinatsiyasini induksiya qilish&lt;/h4&gt;\n&lt;p&gt;Cre ifodalanishini induksiya qilish va FLICK konstruktining rekombinatsiyasini boshlash uchun hujayralar/organoidlar 24 soat davomida 2 mkg/ml doksitsiklin (Sigma D9891-1G) bilan ishlov berildi.&lt;/p&gt;\n&lt;h4 id=\"flick-kd-samaradorligini-baholash\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#flick-kd-samaradorligini-baholash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;FLICK KD samaradorligini baholash&lt;/span&gt;&lt;/a&gt;FLICK KD samaradorligini baholash&lt;/h4&gt;\n&lt;p&gt;FLICK konstruktlari yordamida KD samaradorligini aniqlash uchun har bir shart bo'yicha uchta alohida namuna tahlil qilindi. Nazorat 280 iPSC'lari NTC1 nazorat gRNA massivini yoki ENSG00000261840 geniga yo'naltirilgan gRNA massivini kodlovchi konstruktlar, shuningdek, FLICK konstruktlarini genomga integratsiya qilish uchun piggyBac transposazasini ifodalovchi plazmida bilan nukleofeksiya qilindi. KD ni induksiya qilish uchun hujayralar 24 soat davomida 2 mkg/ml doksitsiklin (Sigma D9891-1G) bilan ishlov berildi. FLICK konstruktini rekombinatsiya qilgan hujayralar EGFP+ hujayralar uchun floresan yordamida saralangan hujayralar oqimi (FACS) (BD FACSymphony™ S6) orqali ajratib olindi, ular uch nusxada qayta ekildi va qo'shimcha ikki kun davomida o'stirildi. Keyinchalik Direct-zol RNA Microprep Kit (Zymo Research #R2062) yordamida RNK ajratib olindi. KDNK hosil qilish uchun 500 ng RNK SuperScript™ IV VILO™ Master Mix (ThermoFisher Scientific #11756050) yordamida teskari transkripsiya qilindi. Miqdoriy PZR (qPCR) kDNK ni RNKga ekvivalent konsentratsiyada 1 ng/mkl (10 mkl reaksiya uchun 10 ng), yakuniy konsentratsiyasi 0,5 mkm bo'lganpraymerlarni va qPCR uchun PowerUp™ SYBR™ Green Master Mix (ThermoFisher Scientific #A25742) aralashtirish orqali bajarildi. qPCR reaksiyalari Master Mix protokolida tasvirlangan «fast cycling mode» shartlaridan foydalangan holda CFX384 Touch Real-Time PCR Detection System (Bio-Rad #1855484) qurilmasida har bir sample (namuna) uchun texnik uch nusxada o'tkazildi. KD maqsadli genining (ENSG00000261840) ifodalanishi delta-delta Ct usuli yordamida baholandi, bunda ifodalanish avval har bir sample uchun uy xo'jaligi geniga (housekeeping gene) HPRT1 ga nisbatan normallashtirildi, so'ngra o'rtacha +/- SEM sifatida grafikda ko'rsatilgan NTC nazorat namunalarining o'rtachasiga nisbatan ko'rsatildi. Statistik ahamlilik ikki tomonlama t-test (GraphPad Prism) yordamida baholandi.&lt;/p&gt;\n&lt;h4 id=\"gistologik-tahlil-uchun-bosh-miya-organoidlarini-qayta-ishlash\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#gistologik-tahlil-uchun-bosh-miya-organoidlarini-qayta-ishlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gistologik tahlil uchun bosh miya organoidlarini qayta ishlash&lt;/span&gt;&lt;/a&gt;Gistologik tahlil uchun bosh miya organoidlarini qayta ishlash&lt;/h4&gt;\n&lt;p&gt;Bosh miya organoidlari 16% li PFA dan PBS da suyultirilgan 4% li paraformaldegid (PFA) da (Electron Microscopy Sciences # 15710) 4°C da bir kecha davomida fiksatsiya qilindi. Fiksatsiyadan so'ng bosh miya organoidlari PBS bilan yuvildi va keyinchalik 4°C da kamida bir kecha davomida 30% li saxaroza eritmasida (PBS dagi m/v) muvozanatlandi. Katta organoidlar uchun to'liq krioproteksiyani ta'minlash maqsadida 30% li saxaroza eritmasi bir kecha davomida inkubatsiya qilingandan keyin kamida bir marta almashtirildi.&lt;/p&gt;\n&lt;p&gt;Krioseksiya qilish uchun bosh miya organoidlari quruq muz ustida Tissue-Tek® O.C.T. Compound (Sakura #4583) muhitida muzlatildi. Qalinligi 30 mkm bo'lgan kesmalarni olish uchun Leica CM3050 S kriostatidan foydalanildi, kesmalar Fisherbrand™ Superfrost™ Plus Microscope Slides (Fisher Scientific #12-550-15) buyum oynachalariga yig'ildi va -80°C da saqlandi. Imunohigistokimyoviy tahlil uchun bloklovchi bufer 0.3 M glisin (Sigma G7403-1KG), 1% qoramol zardobi albumin (Sigma A4503-50G), 0.3% Triton X-100 (Sigma T8787-50ML), 10% normal echki zardobi (Fisher Scientific # NC9660079) va PBS ni aralashtirish yo'shidan tayyorlandi.&lt;/p&gt;\n&lt;p&gt;Oynachalar O.C.T. ni ketkazish uchun PBS da yuvildi va xona haroratida (RT) 1 soat davomida bloklovchi buferda inkubatsiya qilindi. Bloklovchi bufer olib tashlandi va uning o'rniga qiziqish uyg'otuvchi birlamchi antitelolarni o'z ichiga olgan yangi bloklovchi bufer (pastga qarang) qo'shildi, so'ngra oynachalar nam kamera idishida (Avantor # 76278-848) 4°C da bir kecha davomida inkubatsiya qilindi. Oynachalar har safar besh daqiqadan PBS bilan uch marta yuvildi.&lt;/p&gt;\n&lt;p&gt;Ikkilamchi antitelolar (pastga qarang) va yadro bo'yog'i DAPI (ThermoFisher Scientific #62248) bloklovchi buferda (mos ravishda 1:500 va 1:1000 nisbatda) suyultirilib, xona haroratida 30 daqiqa davomida oynachalarga qo'shildi va shu paytdan boshlab oynachalar yorug'likdan himoya qilindi. Shundan so'ng oynachalar har safar besh daqiqadan uch marta PBS da yuvildi. Yopuvchi oynachalar (Epredia #152455) Fluoromount-G® (Fisher Scientific #OB100-01) yordamida o'rnatildi va xona haroratida kamida bir kecha davomida quritildi. Quriganidan keyin oynachalar 4°C da saqlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Imunohigistokemiya uch o'lchamli to'qimalardagi oqsillarning joylashishini floresan antitelolar orqali aniqlashga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"imunohigistokemiya-va-imunotsitokemiya-uchun-antitelolar\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#imunohigistokemiya-va-imunotsitokemiya-uchun-antitelolar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Imunohigistokemiya va imunotsitokemiya uchun antitelolar&lt;/span&gt;&lt;/a&gt;Imunohigistokemiya va imunotsitokemiya uchun antitelolar&lt;/h4&gt;\n&lt;p&gt;• PAX6 (BD Pharmingen 561462, klon O18-1330): 1:300 suyultirilgan • Nestin (Millipore Sigma HPA026111-25UL): 1:500 suyultirilgan • TBR2 (Millipore Sigma HPA028896-100UL): 1:300 suyultirilgan • CTIP2 (Abcam ab18465, klon 25B6): 1:300 suyultirilgan • EGFP (Aves GFP-1010): 1:1000 suyultirilgan • Echkaning tovuq IgY ga qarshi antitelolari, Alexa Fluor 488 (ThermoFisher A-11039): 1:500 suyultirilgan • Echkaning quyon IgG ga qarshi antitelolari, Alexa Fluor 488 (ThermoFisher A-11008): 1:500 suyultirilgan • Echkaning kalamush IgG ga qarshi antitelolari, Alexa Fluor 488 (ThermoFisher A-11006): 1:500 suyultirilgan • Echkaning sichqon IgG ga qarshi antitelolari, Alexa Fluor 555 (ThermoFisher A-21424): 1:500 suyultirilgan • Echkaning kalamush IgG ga qarshi antitelolari, Alexa Fluor 647 (ThermoFisher A-21247): 1:500 suyultirilgan • Echkaning quyon IgG ga qarshi antitelolari, Alexa Fluor 647 (ThermoFisher A-21245): 1:500 suyultirilgan • Echkaning quyon IgG ga qarshi antitelolari, Alexa Fluor 750 (ThermoFisher A-21039): 1:500 suyultirilgan&lt;/p&gt;\n&lt;h4 id=\"konfokal-vizualizatsiya-va-qayta-ishlash\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#konfokal-vizualizatsiya-va-qayta-ishlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Konfokal vizualizatsiya va qayta ishlash&lt;/span&gt;&lt;/a&gt;Konfokal vizualizatsiya va qayta ishlash&lt;/h4&gt;\n&lt;p&gt;Bosh miya organoidlari kesmalari Zeiss LSM 980 konfokal mikroskopi yordamida tasvirga olindi. Standard tasvirni qayta ishlash Adobe Photoshop yordamida amalga oshirildi.&lt;/p&gt;\n&lt;h4 id=\"bosh-miya-organoidlarining-scrna-seq\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#bosh-miya-organoidlarining-scrna-seq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bosh miya organoidlarining scRNA-seq&lt;/span&gt;&lt;/a&gt;Bosh miya organoidlarining scRNA-seq&lt;/h4&gt;\n&lt;p&gt;zcRNA-seq uchun hujayralar quyidagilardan yig'ildi: • oy: 10 ta organoid, birgalikda birlashtirilib bitta turkum sifatida yig'ildi • oylar: ikkita turkumga yig'ilgan 14 ta organoid, bunda 7 ta organoid 60-kuni birgalikda va qo'shimcha 7 ta organoid 61-kuni birgalikda yig'ildi • o'tkir nokaut (KD): 8 ta organoid, birgalikda birlashtirilib bitta turkum sifatida yig'ildi. Hujayralarni yig'ish uchun mozaik bosh miya organoidlari qaychi yordamida bo'laklarga kesildi, qoldiqlarni tozalash uchun PBS da ikki marta yuvildi va miya to'qimalari uchun tasvirlangan ferment aralashmalari yordamida Neural Tissue Dissociation Kit – Postnatal Neurons (Miltenyi Biotec # 130-094-802) yordamida dissotsiatsiya qilindi.&lt;/p&gt;\n&lt;p&gt;Yumshoq dissotsiatsiya keng teshikli uchi bo'lgan pipetkalardan (Rainin # 30389218) boshlab standart uchlargacha bo'lgan kichrayib boruvchi diametrli uchi bo'lgan pipetkalar yordamida amalga oshirildi. Rekombinatsiyalangan FLICK konstruktlariga ega hujayralar EGFP+ hujayralar uchun FACS (BD FACSymphony™ S6) orqali ajratib olindi. Butun transkriptom bo'ylab scRNA-seq kutubxonalari 10X Genomics kompaniyasining Chromium Next GEM Single Cell 3ʹ Reagent Kits v3.1 (Dual Index) to'plamlari yordamida CG000316 Rev A foydalanuvchi qo'llanmasiga amal qilgan holda tayyorlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;scRNA-seq (yakka hujayrali RNK sekvensiyasi) har bir alohida hujayradagi minglab genlarning ekspresiyasini o'lchaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"flick-shtrix-kod-sekvensiya-kutubxonalarini-yaratish\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#flick-shtrix-kod-sekvensiya-kutubxonalarini-yaratish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;FLICK shtrix-kod sekvensiya kutubxonalarini yaratish&lt;/span&gt;&lt;/a&gt;FLICK shtrix-kod sekvensiya kutubxonalarini yaratish&lt;/h4&gt;\n&lt;p&gt;Protokollar bo'yicha to'liq ma'lumotni quyidagi manzildan topishingiz mumkin: https://dx.doi.org/10.17504/protocols.io.5qpvoj5pzg4o/v1. Qisqacha: mozaik organoidlarni hosil qilish uchun ishlatilgan dastlabki iPSC hovuzidan FLICK konstruktlarini miqdoriy baholash uchun (d0) Direct-zol RNA Microprep Kit (Zymo Research #R2062) yordamida 42 ming hujayrali uch nusxali namunalardan RNK ajratib olindi.&lt;/p&gt;\n&lt;p&gt;kDNK hosil qilish uchun 50-250 ng RNK UMI larni o'z ichiga olgan oligo(dT)VNpraymer bilan birgalikda SuperScript™ IV First-Strand Synthesis System (Invitrogen 18091050) yordamida teskargi transkripsiya qilindi. Keyinchalik sekvensiya kutubxonalari Q5® Hot Start High-Fidelity 2X Master Mix (NEB #M0494L) va maxsus praymerlar yordamida yaratildi. scRNA-seq kutubxonalaridan FLICK shtrix-kod kutubxonalarini yaratish uchun 5 mkl amplifikatsiya qilingan va tozalangan kDNK (10X User Guide CG000316 Rev A ko'rsatmalariga amal qilgan holda 2-bosqich oxirigacha ishlab chiqarilgan) ishlatildi.&lt;/p&gt;\n&lt;p&gt;Shtrix-kodni o'z ichiga olgan kDNK Q5® Hot Start High-Fidelity 2X Master Mix (NEB #M0494L) va maxsus praymerlar yordamida sekvensiya uchun amplifikatsiya qilindi. Kutubxonalar SPRIselect DNA Size Selection Reagent (Beckman Coulter # B23317) yordamida tozalandi va TapeStation High Sensitivity D1000 reaktivlari (Agilent #5067-5603 va #5067-5584) yordamida baholandi.&lt;/p&gt;\n&lt;h4 id=\"organoid-scrna-seq-malumotlarini-moslashtirish-va-miqdorini-aniqlash\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#organoid-scrna-seq-malumotlarini-moslashtirish-va-miqdorini-aniqlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Organoid scRNA-seq ma'lumotlarini moslashtirish va miqdorini aniqlash&lt;/span&gt;&lt;/a&gt;Organoid scRNA-seq ma'lumotlarini moslashtirish va miqdorini aniqlash&lt;/h4&gt;\n&lt;p&gt;scRNA-seq ma'lumotlari CRISPR-CasRx tomonidan nishonga olingan qisman parchalangan transkriptlarni miqdoriy baholashdan qochish uchun gen ekspressiyasini hisoblashga intronlar kiritilmagan holda (--include-introns=false) feature-barcode rejimida cellranger-count yordamida oldindan tuzilgan CellRanger (v.9.0.0) hg38 referensiga moslashtirildi. CRISPR gidlari ketma-ketligini aniqlash kutubxonasi FASTQ fayllari bir oylik namunalar uchun CRISPR kutubxonasi sekvenirlash chuqurligiga mos kelishi hamda cellranger-CRISPR gidlarini miqdoriy aniqlash quvuri yordamida gidni tayinlash uchun fonni minimallashtirish maqsadida seqtk (v1.4) yordamida 2 oylik namunalar uchun o'qishlarning 1.25% gacha kamaytirildi. Barcha boshqa standart parametrlar ishlatildi. CellRanger gid tayinlashlari faqat aniq bitta tayinlangan gidga ega bo'lgan hujayralarni saralash uchun ishlatildi.&lt;/p&gt;\n&lt;h4 id=\"organoid-scrna-seq-malumotlarini-oldindan-qayta-ishlash-va-sifat-nazorati\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#organoid-scrna-seq-malumotlarini-oldindan-qayta-ishlash-va-sifat-nazorati\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Organoid scRNA-seq ma'lumotlarini oldindan qayta ishlash va sifat nazorati&lt;/span&gt;&lt;/a&gt;Organoid scRNA-seq ma'lumotlarini oldindan qayta ishlash va sifat nazorati&lt;/h4&gt;\n&lt;p&gt;Uzoq muddatli va o'tkir KD namunalari alohida, ammo bir xil tarzda qayta ishlandi. CellBender (v0.3.2) muhitdagi RNK ifloslanishini aniqlash va filtrlash uchun ishlatildi, scrublet (v0.2.3) esa avtomatik juftlashuvni aniqlash va filtrlashni amalga oshirish uchun ishlatildi. Barcha boshqa quyi oqim tahlillari Seurat (v5.0.0) yordamida bajarildi. Yuqori sifatli hujayralar quyidagi sifat nazorati metrikalariga muvofiq saqlab qolindi: 1) mitoxondriyal (percent.mt) gen ekspressiyasi foizi &amp;lt; 20% va 2) 500 &amp;lt; ifodalangan genlar soni (nFeature_RNA) &amp;lt; 6000.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Bir hujayrali RNK sekvenirlash ma'lumotlarini sifat nazorati mitoxondriyal transkriptlar darajasi bo'yicha shikastlangan hujayralarni ajratib tashlash va natijalar buzilishining oldini olish uchun juftlashgan hujayralarni olib tashlashni o'z ichiga oladi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"organoid-scrna-seq-malumotlarining-hujayra-turini-annotatsiya-qilish\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#organoid-scrna-seq-malumotlarining-hujayra-turini-annotatsiya-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Organoid scRNA-seq ma'lumotlarining hujayra turini annotatsiya qilish&lt;/span&gt;&lt;/a&gt;Organoid scRNA-seq ma'lumotlarining hujayra turini annotatsiya qilish&lt;/h4&gt;\n&lt;p&gt;Hujayra turini annotatsiya qilish dastlab faqat maqsadli bo'lmagan nazorat (NTC) hujayralarida amalga oshirildi. NTC hujayralari faqat nazoratdan iborat Seurat obyektini yaratish uchun ajratib olindi. Ushbu obyekt keyinchalik normallashtirildi (NormalizeData), o'zgaruvchan belgilarni aniqlash (FindVariableFeatures), masshtablash (ScaleData; percent.mt, percent_ribo, nCount_RNA va nFeature_RNA regressiya qilingan kovariatalari) va o'lchamlarni kamaytirish (RunPCA va RunUMAP) bosqichlaridan o'tdi. Integratsiya organoid partiyalari bo'ylab harmony (v1.2.0) yordamida amalga oshirildi va ushbu integratsiyalangan obyekt nazoratsiz klasterlash uchun ishlatildi (FindNeighbors va FindClusters, piksellar soni = 0.6 va 1.2). Kam sonli nazoratsiz klasterlar (&amp;lt;1000 hujayra) klaster bo'ylab past sifat nazorati metrikalari (ya'ni, o'ta yuqori yoki past nCount_RNA, yuqori percent.mt) tufayli filtrlandi. Ushbu faqat nazoratdan iborat Seurat obyektining barcha keyingi 2 o'lchamli vizualizatsiyasi integratsiyalangan ma'lumotlarning UMAP ko'rinishi yordamida amalga oshirildi. Hujayra turini annotatsiya qilish kanonik miya marker genlari yordamida bajarildi. Keyinchalik yuqorida tavsiflangan kabi bir xil qayta ishlash quvuriga (masalan, normallashtirish, masshtablash, o'lchamlarni kamaytirish va integratsiya) amal qilgan holda barcha hujayralar uchun Seurat obyekti tuzildi. Hujayra turini annotatsiya qilishni amalga oshirish uchun yorliqlarni o'tkazish faqat nazoratdan iborat Seurat obyektidan (TransferData) to'liq Seurat obyektiga bajarildi. Kanonik miya marker genlarining ekspressiya naqshlari keyinchalik ushbu hujayra turi annotatsiyalarini aniqlashtirish va yakunlash uchun ishlatildi.&lt;/p&gt;\n&lt;h4 id=\"miya-organoidlarida-har-bir-kd-boyicha-nisbiy-miqdorni-tahlil-qilish\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#miya-organoidlarida-har-bir-kd-boyicha-nisbiy-miqdorni-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Miya organoidlarida har bir KD bo'yicha nisbiy miqdorni tahlil qilish&lt;/span&gt;&lt;/a&gt;Miya organoidlarida har bir KD bo'yicha nisbiy miqdorni tahlil qilish&lt;/h4&gt;\n&lt;p&gt;Har bir KD nishoni uchun hujayralarning nisbiy miqdori har bir vaqt nuqtasi uchun (d0, d30, d60 yoki d61) aniqlandi. d0 uchun nisbiy miqdor maxsus quvur yordamida (qarang: «Kod mavjudligi») bulk RNA-seq kutubxonalaridan (qarang: «FLICK shtrix-kod sekvenirlash kutubxonalarini qurish») aniqlandi. d30, d60 va d61 uchun nisbiy miqdor CellRanger tomonidan generatsiya qilingan CRISPR gid tayinlashlari yordamida scRNA-seq dan aniqlandi (qarang: «Organoid scRNA-seq ma'lumotlarini moslashtirish va miqdorini aniqlash»). Har bir namuna uchun natijalar d0 dagi boshlang'ich nisbatga normallashtirildi va bir xil vaqt nuqtasidagi NTC larga nisbatan ko'rsatildi. Natijalar o'rtacha +/- standart xato (SEM) sifatida chizildi. Statistik tahlil barcha uzoq muddatli namunalarni (d30, d60 va d61) hisobga olgan holda Dunnettning ko'p martali taqqoslash testi (GraphPad Prism) bilan takroriy o'lchovli bir tomonlama dispersiya tahlili (repeated measures one-way ANOVA) yordamida amalga oshirildi.&lt;/p&gt;\n&lt;h4 id=\"miya-organoidlarida-nisbiy-hujayra-turi-proporsiyalarini-tahlil-qilish\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#miya-organoidlarida-nisbiy-hujayra-turi-proporsiyalarini-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Miya organoidlarida nisbiy hujayra turi proporsiyalarini tahlil qilish&lt;/span&gt;&lt;/a&gt;Miya organoidlarida nisbiy hujayra turi proporsiyalarini tahlil qilish&lt;/h4&gt;\n&lt;p&gt;Nisbiy ExN/RG proporsiyasi d30, d60 va d61 da har bir KD nishoni uchun aniqlandi. Natijalar bir xil vaqt nuqtasidagi NTC namunasiga normallashtirildi. Statistik tahlil barcha uzoq muddatli namunalarni (d30, d60 va d61) hisobga olgan holda Dunnettning ko'p martali taqqoslash testi (GraphPad Prism) bilan oddiy bir tomonlama dispersiya tahlili (ordinary one-way ANOVA) yordamida amalga oshirildi.&lt;/p&gt;\n&lt;h4 id=\"miya-organoidining-scrna-seq-malumotlarining-differensial-ekspressiya-tahlili\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#miya-organoidining-scrna-seq-malumotlarining-differensial-ekspressiya-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Miya organoidining scRNA-seq ma'lumotlarining differensial ekspressiya tahlili&lt;/span&gt;&lt;/a&gt;Miya organoidining scRNA-seq ma'lumotlarining differensial ekspressiya tahlili&lt;/h4&gt;\n&lt;p&gt;Differensial ekspressiya tahlili har bir gid bo'yicha o'zgartirilgan hujayralar va NTC olgan hujayralar o'rtasida asosiy hujayra turlari (radial glia, oraliq o'tmishdosh hujayralar, qo'zg'atuvchi neyronlar yoki tormozlovchi neyronlar) bo'yicha tabaqalashtirilgan holda amalga oshirildi. Seurat FindMarkers logfc.threshold = 0, min.pct = 0.10, min.cells.group = 3 va qolgan barcha standart parametrlar bilan differensial ekspressiyani bajarish uchun ishlatildi. Differensial ekspressiyalangan genlarning (DEG) boyitish tahlillari bir tomonlama Fisherning aniq testlari yordamida amalga oshirildi va p-qiymatlar bir nechta gipotezalarni sinovdan o'tkazish uchun Benjamini-Hochberg tuzatishi yordamida tuzatildi. Olam qiziqish uyg'otadigan ikkala taqqoslashda ham ifodalangan barcha genlar sifatida aniqlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Differensial ekspressiya tahlili nazoratga nisbatan ma'lum bir nishon nokdaun qilinganda faolligi statistik jihatdan sezilarli darajada o'zgaradigan genlarni aniqlashga yordam beradi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"organoid-hujayra-turlari-ortasidagi-umumiy-deg-larni-vizualizatsiya-qilish\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#organoid-hujayra-turlari-ortasidagi-umumiy-deg-larni-vizualizatsiya-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Organoid hujayra turlari o'rtasidagi umumiy DEG larni vizualizatsiya qilish&lt;/span&gt;&lt;/a&gt;Organoid hujayra turlari o'rtasidagi umumiy DEG larni vizualizatsiya qilish&lt;/h4&gt;\n&lt;p&gt;Umumiy DEG lar organoid hujayra turlari o'rtasida R paketi igraph (v2.1.4) yordamida vizualizatsiya qilindi (3c-rasm). Tugunlarning yakuniy joylashuvini aniqlash uchun Fruchterman-Reingold joylashuv algoritmi (layout_with_fr) ishlatildi.&lt;/p&gt;\n&lt;h4 id=\"magic-tahlillari\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#magic-tahlillari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MAGIC tahlillari&lt;/span&gt;&lt;/a&gt;MAGIC tahlillari&lt;/h4&gt;\n&lt;p&gt;MAGIC95 (v1.1) individual buzilishlardagi DEG larda nishonlari boyitilgan transkripsiya omillari va kofaktorlarni aniqlash uchun ishlatildi. «Gen tanasi (promoterdan oxirgi ekzonning oxirigacha) hamda gen tanasining har ikki tomonida 1kb yonma-yon ketma-ketlik» strategiyasi ishlatildi. NPC tahlillari uchun olam NTC namunalarida baseMean &amp;gt; 10 bo'lgan barcha genlar sifatida belgilandi. Organoid tahlillari uchun olam ushbu hujayra turidagi hujayralarning kamida 10% ida ifodalangan barcha genlar sifatida belgilandi (Seurat min.pct = 0.10; log2 fold-change chegarasi yo'q), chunki bular differensial ekspressiya uchun baholangan genlar edi.&lt;/p&gt;\n&lt;h4 id=\"ayollarda-ustunlik-qiluvchi-genlarni-aniqlash\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#ayollarda-ustunlik-qiluvchi-genlarni-aniqlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ayollarda ustunlik qiluvchi genlarni aniqlash&lt;/span&gt;&lt;/a&gt;Ayollarda ustunlik qiluvchi genlarni aniqlash&lt;/h4&gt;\n&lt;p&gt;Neyro‘tipik bosh miyada ayollar uchun xos ifodalanishni ko‘rsatuvchi genlarni aniqlash uchun biz quyidagi ishlardagi differensial ifodalangan genlar (DEG) to‘plamlarini birlashtirdik: (1) Kissel va b. (2024) ishining S4-jadvali: UCLA kogortasi, BrainVar kogortasi yoki metatahlil orqali ayollar tomoniga sezilarli darajada og‘gan sifatida aniqlangan. (2) Oliva va b. (2020) (https://storage.cloud.google.com/adult-gtex/bulk-qtl/v8/sbeqtl/GTEx_Analysis_v8_sbgenes.tar.gz): BRNCTXA yoki BRNCTXB da ayollar tomoniga sezilarli darajada og‘gan sifatida aniqlangan. (3) Naqvi va b. (2019) ishining S4-jadvali: baholangan barcha turlarning (odam, sichqonlar, kalamushlar, итlar va makakalar) miyasida ayollar tomoniga sezilarli darajada og‘gan sifatida aniqlangan. (4) DeCasien va b. (2026) ishining S13-jadvali: hamma joyda ayollar tomoniga og‘gan deb aniqlangan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Metatahlil jinsiy farqlarga ega genlarni ishonchliroq topish maqsadida turli mustaqil tadqiqotlar natijalarini birlashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"autizmga-chalingan-erkaklarning-yadrocha-rnk-sekvensiyasi-snrna-seq-malumotlarini-tahlil-qilish\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#autizmga-chalingan-erkaklarning-yadrocha-rnk-sekvensiyasi-snrna-seq-malumotlarini-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Autizmga chalingan erkaklarning yadrocha RNK sekvensiyasi (snRNA-seq) ma'lumotlarini tahlil qilish&lt;/span&gt;&lt;/a&gt;Autizmga chalingan erkaklarning yadrocha RNK sekvensiyasi (snRNA-seq) ma'lumotlarini tahlil qilish&lt;/h4&gt;\n&lt;p&gt;Inson frontal qobig‘ining qayta ishlangan snRNA-seq ma'lumotlari Dias va b. (2024) dan olindi. Alohida namunalarning jinsi XIST va Y-bog‘langan genlarning ifodalanishi asosida tekshirildi. Autizmning erkaklarda ko‘proq uchrashi ma'lum bo‘lgani sababli, ushbu kogortaga faqat oz sonli ayol namunalari (bitta ayol nazorati, idiopatik autizmli ayoldan bitta namuna va 15q-duplikatsiyasi bilan bog‘langan autizmli ayoldan bitta namuna) kiritilgan. Shuning uchun biz barcha keyingi tahlillarni ushbu kogortaga kiritilgan 17 ta erkak namunasiga qaratdik. Differensial ifodalanish tahlili Seurat’ning FindMarkers funksiyasi yordamida har bir hujayra turi kesimida quyidagilar o‘rtasida amalga oshirildi: (a) erkak nazoratlari va faqat idiopatik autizmli erkaklar namunalari; (b) erkak nazoratlari va faqat 15q-duplikatsiyasi bilan bog‘langan autizmli erkaklar namunalari; va (c) erkak nazoratlari va idiopatik yoki 15q-duplikatsiyasi bilan bog‘langan autizmli erkaklarning barcha namunalari. Donor ta'sirini nazorat qilish uchun FindMarkers MAST106 yordamida bajarildi. Ahamiyatli genlar sifatida log-2 fold-change ning absolyut qiymati &amp;gt; 0.1 va butun transkriptom bo‘ylab tuzatilgan p-qiymati &amp;lt; 0.05 bo‘lganlar belgilandi.&lt;/p&gt;\n&lt;h4 id=\"zfx-jinsiy-differensial-ifodalanishining-grafiklari\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#zfx-jinsiy-differensial-ifodalanishining-grafiklari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ZFX jinsiy differensial ifodalanishining grafiklari&lt;/span&gt;&lt;/a&gt;ZFX jinsiy differensial ifodalanishining grafiklari&lt;/h4&gt;\n&lt;p&gt;Quyidagi manbalardagi ma'lumotlardan foydalanildi: (1) Benoit-Pilven va b. (2025) (2) Kissel va b. (2024) (3) Fass va b. (2024) (4) DeCasien va b. (2026).&lt;/p&gt;\n&lt;h4 id=\"rhie-va-b-2018-hamda-san-roman-va-b-2024-ishlaridagi-zfx-nishonlarini-qayta-tahlil-qilish\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#rhie-va-b-2018-hamda-san-roman-va-b-2024-ishlaridagi-zfx-nishonlarini-qayta-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rhie va b. (2018) hamda San Roman va b. (2024) ishlaridagi ZFX nishonlarini qayta tahlil qilish&lt;/span&gt;&lt;/a&gt;Rhie va b. (2018) hamda San Roman va b. (2024) ishlaridagi ZFX nishonlarini qayta tahlil qilish&lt;/h4&gt;\n&lt;p&gt;ZFX ChIP-seq nishonlari Rhie va b. (2018) ishining S3E-jadvalidan olindi. Shuningdek, ZFX nishonlari San Roman va b. (2024) ishining S10-jadvalidan olindi, unda oldin ZFX ChIP-seq ma'lumotlari (ENCODE) va Rhie va b. (2018) ishidan ZFX KD RNA-seq ma'lumotlarining integrativ tahlili bajarilgan edi. Boyitish bir tomonlama Fisherning aniq testi yordamida tahlil qilindi va p-qiymatlar ko‘p sonli gipotezalarni tekshirish uchun Benjamini-Hochberg tuzatishi yordamida tuzatildi. Rhie va b. (2018) ishidan umumiy ZFX nishonlarini tahlil qilish uchun umumiy majmua (universe) ChIP-seq uchun ishlatilgan va RNA-seq ham mavjud bo‘lgan ikkala hujayra liniyasida (C4-2B va MCF-7) ifodalangan genlar sifatida belgilandi. San Roman va b. (2024) ishidan ZFX nishonlarini tahlil qilish uchun umumiy majmua Rhie va b. (2018) ishining mos keluvchi hujayra turida ifodalangan genlar sifatida belgilandi. Natijalar ustunli diagramma ko‘rinishida ko‘rsatildi, bunda asosiy ustunlar bir tomonlama Fisherning aniq testidan olingan imkoniyatlar nisbatini (OR) va xatolik chiziqlari OR uchun 95% li ishonch oralig‘ining quyi chegarasini bildiradi (bir tomonlama test uchun yuqori chegara aniqlanmagan).&lt;/p&gt;\n&lt;h4 id=\"dasturiy-taminot-xulosasi\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#dasturiy-taminot-xulosasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dasturiy ta'minot xulosasi&lt;/span&gt;&lt;/a&gt;Dasturiy ta'minot xulosasi&lt;/h4&gt;\n&lt;p&gt;Ushbu qo‘lyozmada ishlatilgan dasturiy ta'minot R (v4.3.1) va R paketlari DESeq2 (v1.42.0), Seurat (v5.0.0), igraph (v2.1.4), scrublet (v0.2.3), harmony (v1.2.0), Orthology.eg.db (v3.20.0), org.Mm.eg.db (v3.20.0), org.Hs.eg.db (v3.20.0), VIPER (v1.36.0) va fgsea (v1.32.4), shuningdek CellRanger (v9.0.0), CellBender (v0.3.2), MAGIC (v1.1), salmon (v1.9), seqtk (v1.4) va BD FACSDiva v8.0.3 dasturiy ta'minotini o‘z ichiga olgan.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS1.jpg\" alt=\"Kengaytirilgan ma'lumotlar, 1-rasm./ NPC'larda autizm genlarining CasRx asosidagi nokdauni. a, NTC namunalari bilan soli\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Kengaytirilgan ma'lumotlar, 1-rasm./ NPC'larda autizm genlarining CasRx asosidagi nokdauni. a, NTC namunalari bilan solishtirganda har bir KD namunasida maqsadli genning nisbiy ekspresiyasi. Xatolik chiziqlari: o'rtacha +/- 95% ishonch oralig'i. n = har bir shart uchun uchta biologik jihatdan mustaqil namuna. Statistik jihatdan sezilarli DEG'lar ko'p gipotezalarni tekshirish uchun Benjamini-Xoxberg tuzatishi bilan DESeq2 (Vold testi) yordamida aniqlangan. b, Har bir shart uchun uchta biologik jihatdan mustaqil namunadan NTC va WAC-KD NPC'laridan avtomatik vestern-blot yordamida oqsil darajasini tahlil qilish.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS2.jpg\" alt=\"Kengaytirilgan ma'lumotlar 2-rasm./ NPC'larda ASD genlarining CasRx asosidagi KD paytida genlar ekspressiyasining differ\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Kengaytirilgan ma'lumotlar 2-rasm./ NPC'larda ASD genlarining CasRx asosidagi KD paytida genlar ekspressiyasining differensial o'zgarishi. CasRx asosidagi ASD genlari KD dan keyingi genlar ekspressiyasiga butun transkriptom darajasidagi ta'sirlarni ko'rsatuvchi vulqon grafiklari (volcano plots). Statistik jihatdan ahamiyatli DEG'lar Benjamini-Hochberg tuzatishi bilan DESeq2 (Wald testi) yordamida aniqlandi. Statistik jihatdan sezilarli darajada pasaygan (downregulated) DEG'lar ko'k rangda, sezilarli darajada oshgan (upregulated) DEG'lar esa qizil rangda ko'rsatilgan. KD ga nishon bo'lgan gen (har bir grafik ustida ko'rsatilgan) yashil rangda belgilangan. SFARI DEG'lari qalin hoshiya bilan belgilangan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS3.jpg\" alt=\"Kengaytirilgan ma'lumotlar 3-rasm./ Umumiy differensial ekspressiyalangan genlar bo'yicha transkriptomik konvergensiya. \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Kengaytirilgan ma'lumotlar 3-rasm./ Umumiy differensial ekspressiyalangan genlar bo'yicha transkriptomik konvergensiya. a, Turli KD sharoitlari o'rtasida taqsimlangan DEG'larni ko'rsatuvchi Circos diagrammalari (Circos plots). To'g'ridan-to'g'ri taqqoslash uchun yuqori darajada ishonchli SFARI genlari uchun Circos diagrammasi (1d-rasmda ko'rsatilgan) bu yerda ham keltirilgan. b, Kamida 5 ta KD sharoitida DEG bo'lgan no-SFARI genlarining nisbiy ekspressiyasini ko'rsatuvchi issiqlik xaritasi (heatmap). c, Kamida 5 ta KD sharoitida DEG bo'lgan yuqori ishonchli SFARI genlarining nisbiy ekspressiyasini ko'rsatuvchi issiqlik xaritasi. Statistik jihatdan ahamiyatli DEG'lar Benjamini-Hochberg tuzatishi bilan DESeq2 (Wald testi) yordamida aniqlandi va * bilan belgilandi. Satterstrom va boshq. (2020)1 ishidagi 26 ta eng kuchli ASD xavf genlari qatoriga kiritilgan genlar qalin harflar bilan yozilgan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS4.jpg\" alt=\"Kengaytirilgan ma'lumotlar 4-rasm./ Umumiy DEG'lar CasRx asosidagi KD ga bog'liq emas. a, y o'qida jami DEG'lar soni (ch\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Kengaytirilgan ma'lumotlar 4-rasm./ Umumiy DEG'lar CasRx asosidagi KD ga bog'liq emas. a, y o'qida jami DEG'lar soni (chap grafik) yoki SFARI DEG'lari (o'ng grafik) va x o'qida KD maqsadli genining ekspressiyasini ko'rsatuvchi nuqtali grafiklar (scatter plots). Chiziqli regressiya qizil rangda ko'rsatilgan. b, mKO2, mScarlet va iRFP670 lyuminoforlarini ekspressiya qiluvchi NPC'lardagi floresans intensivligining oqim sitometriyasi tahlili. CasRx lyuminoforlarning har birini alohida KD qilish uchun ishlatilgan. Natijalar NTC nazorat o'rtacha qiymatiga nisbatan ko'rsatilgan. mKO2 uchun **** tuzatilgan p = 1.44e-25, mScarlet uchun 5.74e-24 va iRFP670 uchun 1.45e-24 (Bonferroni ko'p martalik taqqoslash testi bilan odatiy ikki tomonlama ANOVA). Shart bo'yicha n = uchta biologik jihatdan mustaqil namuna. c, shRNA asosidagi ASD genlari KD dan keyingi genlar ekspressiyasiga butun transkriptom darajasidagi ta'sirlarni ko'rsatuvchi vulqon grafiklari. Statistik jihatdan ahamiyatli DEG'lar Benjamini-Hochberg tuzatishi bilan DESeq2 (Wald testi) yordamida aniqlandi. Statistik jihatdan pasaygan DEG'lar ko'k rangda, oshgan DEG'lar esa qizil rangda ko'rsatilgan. KD ga nishon bo'lgan gen yashil rangda belgilangan. SFARI DEG'lari qalin hoshiya bilan belgilangan. d, CasRx va shRNA orqali bir xil maqsadli gen KD qilinganidan keyin bir xil pasaygan DEG'larning boyishini ko'rsatuvchi ustunli diagramma. Ustunlar bir tomonlama Fisherning aniq testidan olingan imkoniyatlar nisbatini (OR) ko'rsatadi; xatolik chiziqlari OR bo'yicha 95% ishonch oralig'ining pastki chegarasini ko'rsatadi (bir tomonlama test uchun yuqori chegara aniqlanmagan). p-qiymatlar Benjamini-Hochberg tuzatishi yordamida tuzatildi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS5.jpg\" alt=\"Kengaytirilgan ma'lumotlar 5-rasm./ Transkriptomik konvergensiya hujayra turlari va eksperimental kontekstlar bo'ylab so\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Kengaytirilgan ma'lumotlar 5-rasm./ Transkriptomik konvergensiya hujayra turlari va eksperimental kontekstlar bo'ylab sodir bo'ladi. Bir nechta hujayra turlari va eksperimental kontekstlar bo'ylab transkriptomik konvergensiyani tahlil qilish. Pasaygan DEG'larning statistik jihatdan ahamiyatli kesishgan boyishi yashil rangda ko'rsatilgan (Benjamini-Hochberg tuzatishi bilan bir tomonlama Fisherning aniq testlari). iPSC va ExN ma'lumotlari Deneault va boshq. (2018)20 dan qayta tahlil qilindi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS6.jpg\" alt=\"Kengaytirilgan ma'lumotlar 6-rasm./ ASD geni KD dan keyin proliferatsiya va hujayralar soniga ta'siri. a, Vaqt o'tishi b\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Kengaytirilgan ma'lumotlar 6-rasm./ ASD geni KD dan keyin proliferatsiya va hujayralar soniga ta'siri. a, Vaqt o'tishi bilan nisbiy CytoTrack bo'yoq intensivligi (-log2). Faqat ahamiyatsiz yoki ziddiy ta'sir ko'rsatgan KD shartlari ko'rsatilgan. Grafikda o'rtacha qiymat +/- o'rtachaning standart xatosi (SEM) tasvirlangan. Statistik ahamlilik Dunnettning ko'p martalik taqqoslash testi bilan odatiy ikki tomonlama ANOVA yordamida aniqlandi. Har bir vaqt nuqtasi uchun har bir shart bo'yicha kamida to'rtta biologik jihatdan mustaqil namuna tahlil qilindi. Shuningdek, 1f-rasmga qarang va to'liq statistik natijalar uchun Supplementary Table 10 ga qarang. b, y o'qida KD hujayralarining nisbiy sonini va x o'qida KD maqsadli genining ekspressiyasini ko'rsatuvchi nuqtali grafik. Chiziqli regressiya qizil rangda ko'rsatilgan. Mikrosefaliya bilan bog'liq bo'lgan va KD qilinishi proliferatsiyaning pasayishiga olib kelgan genlar ta'kidlab o'tilgan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS7.jpg\" alt=\"Kengaytirilgan ma'lumotlar 7-rasm. / Mozayik serebral organoidlarda ASD genlarining KD qilinishi transkriptomik konverge\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Kengaytirilgan ma'lumotlar 7-rasm. / Mozayik serebral organoidlarda ASD genlarining KD qilinishi transkriptomik konvergentsiyani yuzaga chiqaradi. a, iPSC'larda FLICK konstruktining KD samaradorligi. KD nishon geni ENSG00000261840 ning normallashtirilgan ekspressiyasi NTC namunalariga nisbatan o'rtacha +/- SEM sifatida ko'rsatilgan. **** p = 3.87e-5, ikki tomonlama t-test. n = har bir holat uchun uchta biologik jihatdan mustaqil namuna. b, 15-kunda FLICK organoidining immunohistokimyosi, shunga o'xshash natijalarga ega uchta mustaqil tahlilni aks ettiradi. c, Vaqt nuqtasi bo'yicha rang berilgan organoid scRNA-seq UMAP'i. d, Maqsadli gen bo'yicha rang berilgan organoid scRNA-seq ma'lumotlari UMAP'i. e, Bir oylik organoidlardan olingan scRNA-seq yordamida aniqlangan RG'lardagi FLICK samaradorligi. Statistik jihatdan ahamiyatli DEG'lar Seurat (parametrik bo'lmagan Uilkokson rangli testi) yordamida bir nechta gipotezalarni tekshirish uchun Bonferroni tuzatishi bilan aniqlandi. Shuni ta'kidlab o'tamizki, BAZ2B miqdorini aniqlashga kam hujayra soni ta'sir qilishi mumkin va scRNA-seq'da WDFY3 ning ushlanishi transkript uzunligiga (&amp;gt;14 kb) bog'liq bo'lishi mumkin. f, Ikki oylik organoidlardagi har bir KD nishoni bo'yicha hujayra turi tarkibi. Nuqtali chiziqlar asosiy hujayra turlarining NTC nisbatlarini ko'rsatadi. ExN/RG nisbati NTC'dan sezilarli darajada farq qiladigan namunalar * bilan belgilangan (BAZ2B uchun adj. p = 0.021, CLASP1 uchun 0.018 va EHMT1 uchun 0.012), bir oylik (2f-rasmga qarang) va ikki oylik (bu yerda ko'rsatilgan) barcha uzoq muddatli namunalarni hisobga olgan holda Dannetning bir nechta taqqoslash testi bilan oddiy bir tomonlama ANOVA. g, IPC'lardan olingan DEG'larning o'zaro boyishi (bir nechta gipotezalarni tekshirish uchun Benjamini-Hochberg tuzatishi bilan bir tomonlama Fisherning aniq testlari). h, Bir oylik organoidlardagi RG'lardan olingan DEG'larni bir xil nishon genining KD qilinishi natijasida oldingi NPC kulturalaridan olingan DEG'lar bilan taqqoslaganda o'zaro boyishini aks ettiruvchi ustunli diagramma. O'zaro boyish uchun faqat kamida 20 ta DEG'ga ega bo'lgan perturbatsiyalar sinovdan o'tkazildi. Ustunlar bir tomonlama Fisherning aniq testidan olingan imkoniyatlar nisbatini (OR) ko'rsatadi; xatolik chiziqlari OR bo'yicha 95% ishonch oralig'ining quyi chegarasini ko'rsatadi (bir tomonlama test uchun yuqori chegara aniqlanmagan). p-qiymatlar bir nechta gipotezalarni tekshirish uchun Benjamini-Hochberg tuzatishi yordamida tuzatildi. i, d panelidagidek KD nishon geni bo'yicha rang berilgan o'tkir KD organoidlaridan olingan scRNA-seq ma'lumotlari UMAP'i. j, Hujayra turlarini aniqlash uchun ishlatiladigan marker genlarning ekspressiyasi. k, O'tkir KD organoidlaridagi turli perturbatsiyalar bo'yicha hujayra turi tarkibi. l, O'tkir KD mozayik organoidlaridan olingan qo'zg'atuvchi neyronlardan (ExN) olingan DEG'larni bir xil nishon genining KD qilinishi natijasida oldingi NPC kulturalaridan olingan DEG'lar bilan taqqoslaganda o'zaro boyishini aks ettiruvchi ustunli diagramma. Ustunlar bir tomonlama Fisherning aniq testidan olingan imkoniyatlar nisbatini (OR) ko'rsatadi; xatolik chiziqlari OR bo'yicha 95% ishonch oralig'ining quyi chegarasini ko'rsatadi (bir tomonlama test uchun yuqori chegara aniqlanmagan). p-qiymatlar bir nechta gipotezalarni tekshirish uchun Benjamini-Hochberg tuzatishi yordamida tuzatildi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS8.jpg\" alt=\"Kengaytirilgan ma'lumotlar 8-rasm. / REST'ni o'z ichiga olgan asosiy transkripsiya omillari qayta-qayta disregulyatsiya \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Kengaytirilgan ma'lumotlar 8-rasm. / REST'ni o'z ichiga olgan asosiy transkripsiya omillari qayta-qayta disregulyatsiya qilingan genlarga qaratilgan. a, ASD genlari KD qilinganidan keyin turli hujayra turlaridan olingan DEG'lar ichida nishonlari boyitilgan transkripsiya regulyatorlarini aniqlovchi MAGIC tahlili (bir nechta gipotezalarni tekshirish uchun Benjamini-Hochberg tuzatishi bilan Kolmogorov-Smirnov testi). Har bir populyatsiya uchun MAGIC regulyatorlari regulyatorni o'z ichiga olgan ASD genlari KD soni bo'yicha baholandi. Eng yuqori ball to'plagan regulyatorlar bu yerga teng ball olgan har qanday qo'shimcha regulyatorlar bilan birga kiritilgan. b, Turli sharoitlarda aniqlangan bir-birining ustiga chiqadigan MAGIC transkripsiya regulyatorlarini aks ettiruvchi miqdoriy Eyler diagrammalari. c, Odam va sichqon embrional ildiz hujayralaridan olingan REST nishonlari ichida SFARI, HC-SFARI yoki faqat ID genlarining boyishini aks ettiruvchi ustunli diagramma. Rockowitz &amp;amp; Zheng (2015)66 dan olingan REST nishoni ma'lumotlari. Ustunlar bir tomonlama Fisherning aniq testidan olingan imkoniyatlar nisbatini (OR) ko'rsatadi; xatolik chiziqlari OR bo'yicha 95% ishonch oralig'ining quyi chegarasini ko'rsatadi (bir tomonlama test uchun yuqori chegara aniqlanmagan). p-qiymatlar bir nechta gipotezalarni tekshirish uchun Benjamini-Hochberg tuzatishi yordamida tuzatildi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS9.jpg\" alt=\"Kengaytirilgan ma'lumotlar 9-rasm. / NPC gen regulyator tarmog'ini rekonstruksiya qilish орqali aniqlangan konvergentsiy\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Kengaytirilgan ma'lumotlar 9-rasm. / NPC gen regulyator tarmog'ini rekonstruksiya qilish орqali aniqlangan konvergentsiyaning asosiy drayverlari. a, Diagramma ustida ko'rsatilgan regulyatorning KD qilinishi natijasida yuzaga kelgan differentsial ekspressiyani aks ettiruvchi vulqon diagrammalari. GRN tahlili orqali ko'rsatilgan regulyator tomonidan ijobiy boshqarilishi bashorat qilingan genlar ajratib ko'rsatilgan, bunda statistik jihatdan sezilarli darajada kamaygan DEG'lar ko'k rangda, oshgan DEG'lar qizil rangda va sezilarli o'zgarishsiz nishonlar sariq rangda ko'rsatilgan. Statistik jihatdan ahamiyatli DEG'lar bir nechta gipotezalarni tekshirish uchun Benjamini-Hochberg tuzatishi bilan DESeq2 (Vold testi) yordamida aniqlandi. Pastga tartiblangan DEG'lar orasida 2-darajali regulon genlarining statistik jihatdan sezilarli darajada boyishi tuzatilgan p-qiymat bilan ko'rsatilgan (bir nechta gipotezalarni tekshirish uchun Benjamini-Hochberg tuzatishi bilan bir tomonlama Fisherning aniq testlari). b, Turli ASD genlari KD namunalarida GRN konvergentsiyasining eng yaxshi drayverlarining nisbiy ekspressiyasini ko'rsatuvchi issiqlik xaritasi. Statistik jihatdan ahamiyatli DEG'lar bir nechta gipotezalarni tekshirish uchun Benjamini-Hochberg tuzatishi bilan DESeq2 (Vold testi) yordamida aniqlangan va * bilan belgilangan. Satterstrom va boshq. (2020)1 ishida 26 ta eng kuchli ASD xavf genlari orasida aniqlangan genlar qalin harflar bilan yozilgan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS10.jpg\" alt=\"Kengaytirilgan ma'lumotlar 10-rasm. / ZFX miqyosida miyada urg'ochi jinsiga moyil ekspressiya namoyon etadi va ASD geni \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Kengaytirilgan ma'lumotlar 10-rasm. / ZFX miqyosida miyada urg'ochi jinsiga moyil ekspressiya namoyon etadi va ASD geni KD qilinganda qayta-qayta kamayadi. a, ASD'dagi FPE ning potentsial ishtirokchilarining nisbiy ekspressiyasini ko'rsatuvchi issiqlik xaritalari. Chapda: bir nechta gipotezalarni tekshirish uchun Benjamini-Hochberg tuzatishi bilan DESeq2 (Vold testi) yordamida aniqlangan statistik jihatdan sezilarli DEG'lar (&lt;/em&gt; bilan belgilangan) bilan NTC'larga nisbatan KD sharoitida NPC'lardagi ekspressiya. O'ngda: bir nechta gipotezalarni tekshirish uchun Bonferroni tuzatishi bilan MAST (ehtimollik nisbati testi) yordamida aniqlangan statistik jihatdan sezilarli DEG'lar (* bilan belgilangan) bilan Dias va boshq. (2024)47 ishidan qayta tahlil qilingan erkak idiopatik nazoratlarga nisbatan ASD bilan kasallangan erkaklardagi ExN'lardagi ekspressiya. Aniqlanmagani X bilan ko'rsatilgan. b, Prenatal va kattalar po'stlog'ini o'z ichiga olgan odam markaziy nerv tizimining (MNT) bir nechta to'qimalarida ZFX ning sezilarli darajada urg'ochi jinsiga moyil ekspressiyasini aks ettiruvchi ustunli diagramma. Turli xil ranglar bilan ajratib ko'rsatilgan alohida hududlar. Ko'rsatilgan ekspressiya darajalari va statistik natijalar to'g'ridan-to'g'ri quyidagi manbalardan olingan: (1) Benoit-Pilven va boshq. (2025)67, (2) Kissel va boshq. (2024)68 va (3) Fass va boshq. (2024)69. Statistik tahlillarga oid tafsilotlar uchun tegishli manbaga qarang. c, Erkaklardagi ekspressiyaga nisbatan po'stloq maydonlari va hujayra turlari bo'ylab ZFX ekspressiyasini aks ettiruvchi issiqlik xaritasi. Hujayra turlari va maydonlar manbadagidek qisqartirilgan: DeCasien va boshq. (2026)62.*&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS10-2.jpg\" alt=\"Rasm S10 (davomi 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S10 (davomi 2)&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Mutatsiyalar&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;va jinsiy&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tafovut&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Hujayralarda&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;18 ta genni&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;bostirish&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;NATIJA&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Transkriptomik&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;konvergensiya&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt
