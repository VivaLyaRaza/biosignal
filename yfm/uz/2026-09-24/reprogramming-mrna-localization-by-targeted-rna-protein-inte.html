htirilgan sferoidlar PBS bilan ehtiyotkorlik bilan yuvildi, shundan so‘ng past zardobli muhit (0.1% FBS) qo‘shildi va bir kecha davomida inkubat qilindi. Tasvirga olish uchun sferoidlar 37 °C da 20 daqiqa davomida PBS da 5 mkM kalsein bo‘yog‘i (Thermo Fischer Scientific, cat# C3100MP) va 5 mkM DRAQ5 (Novus Biologicals, cat# NBP2-81125) bilan bo‘yaldi. Sferoidlar keyinchalik PBS da 4% PFA bilan 15 daqiqa davomida fiksatsiya qilindi va 10x quruq obyektiv yordamida Leica SP8 inversiyalangan konfokal mikroskopida tasvirga olindi. Z-stak tasvirlari sferoid hajmi bo‘ylab olindi. DRAQ5 bo‘yashiga asoslangan har bir sferoid uchun umumiy yadro hajmi Imaris (Oxford Instruments) yordamida o‘lchandi. Sferoidlarning invazivligini baholash uchun Z-staklarning maksimal intensivlik proyeksiyalari ishlatildi va Murakkablik = Perimeter² / (4π × Maydon) sifatida aniqlangan murakkablik qiymati hisoblandi.&lt;/p&gt;\n&lt;h4 id=\"opka-kolonizatsiyasi-modeli\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#opka-kolonizatsiyasi-modeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;O‘pka kolonizatsiyasi modeli&lt;/span&gt;&lt;/a&gt;O‘pka kolonizatsiyasi modeli&lt;/h4&gt;\n&lt;p&gt;Mishlardagi tadqiqotlar Milliy saraton institutining NIH Intramural hayvonlarni parvarish qilish va ulardan foydalanish qo‘mitasining tasdiqlangan protokollariga amal qilgan holda bajarildi. NOD scid gamma sichqonlari Jackson Laboratory (Shtamm №:005557) dan sotib olindi. Ishlatilgan MDA-MB-231 ko‘krak bezi saratoni hujayralarining jinsiga mos kelishi uchun faqat urg‘ochi sichqonchalar ishlatildi. 12.7 haftalik sichqonchalar dumi venasiga har bir sichqonchaga 100 mkl PBS da 5 × 10⁵ hujayra bo‘lgan tegishli hujayra liniyasi tomir ichiga yuborildi. In'ektsiyadan 5 hafta o‘tgach, o‘pka olib tashlandi, perfuziya qilindi va Z-Fix bilan fiksatsiya qilindi. Gistologik tahlil uchun to‘qimalar paraffin ichiga joylashtirildi, so‘ngra immunoflyuoresans yoki H&amp;amp;E bilan bo‘yash uchun kesildi (3 mkm). Qisqacha aytganda, paraffin kesmalari 60 °C da 30 daqiqa davomida qizdirildi, so‘ngra SafeClear II (Fisher Scientific) va etanollardan foydalangan holda deparafinizatsiya qilindi. Qayta gidratlangan kesmalar RNAscope Target Retrieval buferi (ACD; 322001) yordamida 60 °C da bir kecha davomida antigenlarni tiklash uchun ishlatildi. PBST da 3 marta 2 daqiqadan yuvilgandan so‘ng, kesmalar PBS da 3% BSA da suyultirilgan quyon anti-GFP (1:400; Invitrogen; A-11122) bilan 4 °C da bir kecha davomida inkubat qilindi. PBST da 3 marta 2 daqiqadan yuvilgandan so‘ng, namunalar eshak anti-quyon Alexa fluor (1:500; Invitrogen; A-31573), Bug‘doy murtagi agglyutinini Alexa fluor 488 (Invitrogen; W11261; 10 mkg/ml) va DAPI bilan xona haroratida 2 soat davomida inkubat qilindi. Namunalar yuvilgandan so‘ng vizualizatsiyadan oldin Prolong gold ga o‘rnatildi. GFP-musbat hududlarning o‘pka o‘sma to‘qimasiga mos kelishi qo‘shni kesmalarning H&amp;amp;E bo‘yashi bilan tasdiqlandi.&lt;/p&gt;\n&lt;p&gt;Gistologik kesmalar NanoZoomer Digital Slide Scanner (Hamamatsu) yoki Axioscan.Z1 (Carl Zeiss) raqamli slayd skaneri yordamida tasvirga olindi. Qo'shni kesmalar Plan-Apochromat 20x (NA = 0.8; Carl Zeiss) obyektivi yordamida to'liq skanerdan o'tkazildi va HALO (Indica Labs) raqamli patologiya platformasiga import qilindi. MiniNet klassifikatori bir nechta slaydlardagi GFP+ o'choqlarini normal to'qimadan ajratib olish uchun qo'lda belgilangan hududlarda o'qitildi. O'simta yuki har bir hayvon uchun GFP+ maydonining normal to'qima maydoniga nisbati sifatida hisoblandi. Kesish yoki bo'yashdagi o'zgaruvchanlikni qoplash uchun har bir hayvon uchun o'simta yuki va GFP intensivligi qo'shni to'qima kesmalari o'rtasida o'rtachalashtirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MiniNet klassifikatori — bu floresan belgisi bo'yicha o'simta o'choqlarini avtomatik ravishda qidirish va segmentatsiya qilish uchun mo'ljallangan konvolyutsion neyron tarmoqqa asoslangan kompyuter ko'rish algoritmi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"statistika-va-takrorlanuvchanlik\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#statistika-va-takrorlanuvchanlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Statistika va takrorlanuvchanlik&lt;/span&gt;&lt;/a&gt;Statistika va takrorlanuvchanlik&lt;/h4&gt;\n&lt;p&gt;Ma'lumotlar o'rtachaning standart xatosi ± ko'rinishida taqdim etilgan (SEM). 4E- va 5B-rasmlarda natural logarifm qilingan ma'lumotlar ko'rsatilgan. Statistik taqqoslashlar uchun normal taqsimlangan, gomoskedastik ma'lumotlar to'plamidagi sezilarli farqlarni baholash uchun parametric testlar ishlatildi. Agar ushbu taxminlarning birortasi bajarilmasa, buning o'rniga ma'lumotlar taqsimotiga mos keladigan noparametrik testlar bajarildi. Har bir tajriba uchun maxsus statistik testlar rasm osti yozuvlarida tavsiflangan va p-qiymatlari Prism dasturiy ta'minot paketi yordamida hisoblangan (GraphPad; Versiya 10.6.1).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte-f1.jpg\" alt=\"1-rasm. dCas13-dsRBD sintezlari nishon mRNK bilan kuchaytirilgan bog'lanish orqali mRNKning hujayra o'simtalariga lokali\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. dCas13-dsRBD sintezlari nishon mRNK bilan kuchaytirilgan bog'lanish orqali mRNKning hujayra o'simtalariga lokalizatsiyasini o'zgartiradi. (A) Tekshirilayotgan induksiyalanuvchi dCas13-dsRBD konstruksiyalarini ko'rsatuvchi sxema. MDA-MB-231 hujayralarida dCas13-dsRBD ekspressiyasi doksitsiklin yordamida nishon yoki nishonsiz nazorat (NTC) sintetik gRNKlarini transfeksiyasi bilan bir vaqtda induksiya qilindi. (B) GA ga boy mRNK elementlarida yig'ilgan CNBP, KIF1C va taxminiy qo'shimcha omillardan iborat RNKni tashish majmuasini aks ettiruvchi sxema. dCas13-dsRBD/gRNK majmuasining GA ga boy hududlarga bog'lanishi RBP bog'lanishiga xalaqit berishi va tashish majmuasining parchalanishiga olib kelishi taxmin qilinadi. BioRender’da yaratilgan. Mason, D. (2026) https://BioRender.com/kdmxt2k (C) Ko'rsatilgan gRNKlar bilan transfeksiya qilingan dCas13-B2 ekspresse qiluvchi (+dox) va ekspresse qilmaydigan (-dox) hujayralardagi NET1 va GFP mRNKlarining vakillik FISH tasvirlari. Qo'shimcha shartlar tasvirlari S1B qo'shimcha rasmida keltirilgan. Uchli ko'rsatgichlar NET1 mRNK to'plangan hududlarga ishora qiladi. (D) Normallashtirilgan PDI qiymatlari oralig'ini (nishon/NTC gRNK) va GA saqlovchi mRNKlar uchun mos mRNK taqsimotlarini tasvirlovchi sxema. (E) dCas13-dsRBD ekspresse qiluvchi hujayralardagi normallashtirilgan NET1 mRNK PDI qiymatlari. 4-6 ta mustaqil tajribadan har bir shart uchun n = 128-181 ta hujayra. ** P &amp;lt; 0.002, **** P &amp;lt; 0.0001, ns: Dannetning ko'p sonli taqqoslash testi bilan Kraskel-Uollis ANOVA bo'yicha ahamiyatsiz. Xom PDI qiymatlari S1D qo'shimcha rasmida keltirilgan. (F) Anti-FLAG munchoqlari yordamida dCas13-dsRBD immunopresipitatsiyasining (IP) vakillik vestern-blot tasvirlari. (G) dCas13-dsRBD IP da nishon (NET1) va nishonsiz (GUSB va RAB13) mRNKlarning boyishi. RNKlar ddPCR yordamida aniqlandi va NET11067 gRNK mavjudligidagi miqdorlar mos keladigan NTC gRNKga normallashtirildi. Har bir shart uchun n = 4 ta mustaqil tajriba. Dannetning ko'p sonli taqqoslash testi bilan ikki omilli ANOVA bo'yicha *** P &amp;lt; 0.001 va **** P &amp;lt; 0.0001. (E) va (G) panellaridagi ustunli grafiklar o'rtacha ± standart xatolikni (SEM) alohida ma'lumot nuqtalari ustiga qo'yilgan holda ko'rsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte-f2.jpg\" alt=\"Rasm 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte-f4.jpg\" alt=\"4-rasm. Multimerli qatorlardan ishlov berilgan gRNKlarning sitozol boyishi uchun dCas13-B2 ning uzoq muddatli ekspressiy\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm. Multimerli qatorlardan ishlov berilgan gRNKlarning sitozol boyishi uchun dCas13-B2 ning uzoq muddatli ekspressiyasi talab qilinadi. (A) dCas13-B2 tomonidan gRNK qatoriga ishlov berish sxemasi. (B) U6-NET11067 gRNK qatori va ko'rsatilgan oqsillarni ekspresse qiluvchi HEK293 hujayralarining umumiy RNKsidan NET11067 gRNKni vakillik Northern blot yordamida aniqlash. Sintetik gRNK bilan o'lchami taqqoslanadigan fragment dCas13-B2 konstruksiyalarini ekspresse qiluvchi hujayralarda aniqlandi, bu qatorga ishlov berilganidan dalolat beradi. U6 snRNK yuklanish nazorati bo'lib xizmat qildi. (C) Sitozolda gRNK to'planishi uchun dCas13-B2 ekspressiyasi vaqtining ta'sirini sinash uchun eksperimental o'rnatish sxemasi. Ishlatilgan MDA-MB-231 hujayralari Dox-induksiyalanuvchi dCas13-B2 bilan turg'un integratsiya qilingan. (D) (C) da tasvirlangan shartlarda RNAscope yordamida aniqlangan NET11067 gRNK va GFP mRNKning vakillik FISH tasvirlari. Ham GFP mRNK, ham gRNK ekspresse qiluvchi hujayralar sohasi ko'k rangda ko'rsatilgan. Yadro konturlari qizil rangda ko'rsatilgan. (E) Yadroga nisbatan (chapda) yoki butun hujayra miqdoriga nisbatan (o'ngda) sitoplazmatik NET11067 gRNK miqdori. (C) da tasvirlanganidek, har bir shart uchun n = 16-31 ta hujayra; Holm-Sidakning ko'p sonli taqqoslash testi bilan bir omilli ANOVA bo'yicha * P &amp;lt; 0.05. (F)-(G) dCas13-B2 ekspressiyasi induksiyadan 24 soat o'tgach cho'qqiga chiqishini ko'rsatuvchi vakillik vestern-blot va miqdoriy tahlil. n = 3 ta mustaqil tajriba. (H) NCS1 sintezi asosan yadroda ekanligini ko'rsatuvchi dCas13-B2 va dCas13-B2-NCS1 ekspresse qiluvchi hujayralarning vakillik GFP flüoresans va faza tasvirlari. (I) MDA-MB hujayralari ko'rsatilgan dCas13-B2 konstruksiyalari va U6-NET11067 gRNK qatori bilan vaqtincha transfeksiya qilindi. Vakillik FISH tasvirlari sitoplazmatik va yadroviy gRNK miqdorini miqdoriy tahlil qilish bilan NET11067 gRNK va GFP mRNKni ko'rsatadi. Har bir shart uchun n = 30-32 ta hujayra; Kraskel-Uollisning ko'p sonli taqqoslash testi bilan bir omilli ANOVA bo'yicha ahamiyatsiz (ns). (G), (E) va (I) panellaridagi ustunli grafiklar o'rtacha ± SEM ni alohida ma'lumot nuqtalari ustiga qo'yilgan holda ko'rsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte-f5.jpg\" alt=\"5-rasm. Barqaror integratsiyalashgan dCas13-B2/gRNK qatori tizimi endogen NET1 mRNK taqsimotini o'zgartiradi. (A) Uy xo'\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm. Barqaror integratsiyalashgan dCas13-B2/gRNK qatori tizimi endogen NET1 mRNK taqsimotini o'zgartiradi. (A) Uy xo'jaligi geniga (GusB) normallashtirilgan NET11067 gRNK ning ddPCR miqdoriy tahlili. U6-gRNA qatori hujayra liniyalari yuqori umumiy gRNK miqdorini namoyish etadi. n = 3-4 ta mustaqil tajriba; Holm-Sidakning ko'p sonli taqqoslash testi bilan bir omilli ANOVA bo'yicha ** P &amp;lt; 0.01. (B) Induksiyalanuvchi (pIND20) yoki konstitutiv (CMV) dCas13-B2 ekspressiyasiga ega barqaror hujayra liniyalarida sitoplazmatik NET11067 gRNK tabiiy logarifm (ln) intensivliklari ((C) dagi kabi FISH tasvirlaridan). Dox induksiyasi kunlari ko'rsatilgan. 2 ta mustaqil tajribadan har bir shart uchun n = 65-115 ta hujayra; Sidakning ko'p sonli taqqoslash testi bilan bir omilli ANOVA bo'yicha *** P &amp;lt; 0.001 va **** P &amp;lt; 0.0001. (C) (B) bilan bog'langan NET11067 gRNK va GFP mRNK ning vakillik FISH tasvirlari. Hujayra maydoni ko'k rangda ko'rsatilgan. Yadro konturlari qizil rangda ko'rsatilgan. (D) dCas13-B2 va ko'rsatilgan gRNK qatorlarini konstitutiv ravishda ekspresse qiluvchi barqaror hujayra liniyalarining vakillik tasvirlari. NET1 va GFP mRNK lari FISH yordamida, dCas13-B2 oqsili esa GFP flüoresansi yordamida aniqlanadi. NET1 mRNK to'plangan hududlar oq ko'rsatgichlar bilan ko'rsatilgan. (E) Ko'rsatilgan barqaror hujayra liniyalari bo'ylab NET1 mRNK ning PDI qiymati. 3-4 ta mustaqil tajribadan har bir shart uchun n = 86-99 ta hujayra; Sidakning ko'p sonli taqqoslash testi bilan bir omilli ANOVA bo'yicha P &amp;lt; 0.0001. (F) Taqqoslash uchun ASO larning NET1 mRNK PDI ga ta'sirini ko'rsatuvchi Gasparski va boshq. (2023) ma'lumotlari. 3 ta mustaqil tajribadan har bir shart uchun n = 84-118 ta hujayra; Sidakning ko'p sonli taqqoslash testi bilan bir omilli ANOVA bo'yicha P &amp;lt; 0.0001. (A), (B), (E) va (F) panellaridagi ustunli grafiklar o'rtacha ± SEM ni alohida ma'lumot nuqtalari ustiga qo'yilgan holda ko'rsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte-fS1.jpg\" alt=\"S1-qo'shimcha rasm. dsRBD birikishi dCas13/gRNK ning NET1 mRNK ning hujayra o'simtalariga lokalizatsiyasiga ta'sirini o'\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S1-qo'shimcha rasm. dsRBD birikishi dCas13/gRNK ning NET1 mRNK ning hujayra o'simtalariga lokalizatsiyasiga ta'sirini o'zgartiradi. (A) Dox-induksiyalanuvchi hujayra liniyalarida dCas13-dsRBD ekspressiyasining (FLAG nishoni orqali aniqlangan) vakillik vestern-bloti. (B) Sintetik NTC1 yoki NET11067 gRNK lari bilan transfeksiya qilingan ko'rsatilgan dCas13-dsRBD hujayra liniyalarida NET1 va GFP mRNK larning vakillik FISH tasvirlari. (C) (B) dagi kabi hujayralardan normallashtirilgan GFP mRNK intensivligi. Har bir shart uchun n = 88-117 ta hujayra. (D) dCas13-dsRBD ekspresse qiluvchi hujayra liniyalarida NET1 mRNK ning PDI qiymati ((B) dagi kabi). E'tibor bering, PDI=1 diffuz taqsimotni aks ettiradi. 4-6 ta mustaqil tajribadan har bir shart uchun n = 113-181 ta hujayra; Dannning ko'p sonli taqqoslash testi bilan Kraskel-Uollis bir omilli ANOVA bo'yicha ** P &amp;lt; 0.01 va **** P &amp;lt; 0.0001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte-fS3.jpg\" alt=\"Rasm S3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte-fS6.jpg\" alt=\"S6-qo'shimcha rasm. mRNK lokalizatsiyasini o'zgartirish uchun dCas13-B2 ning uzoq muddatli induksiyasi talab qilinadi. (\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S6-qo'shimcha rasm. mRNK lokalizatsiyasini o'zgartirish uchun dCas13-B2 ning uzoq muddatli induksiyasi talab qilinadi. (A) Dox-induksiyalanuvchi yoki konstitutiv promotor ostida barqaror ravishda ekspresse qilingan dCas13-B2 oqsilining (FLAG nishoni orqali aniqlangan) vakillik vestern-bloti. Yulduzcha qisqartirilgan C-terminal fragmentini ko'rsatadi. (B) Barqaror hujayra liniyalarida GFP mRNK ning vakillik FISH tasvirlari. CMV_dCas13-B2 hujayra liniyalari 5B-rasmga tegishli ravishda dCas13-B2 konstruksiyalarini bir xilda ekspresse qiladi. (C) GFP immunoflüoresansi yordamida o'lchangan dCas13-B2 oqsil miqdori. n = 39 ta hujayra. n.s.: ikki tomonlama juftlanmagan Student t-testi bo'yicha ahamiyatsiz. (D) Induksiyalanuvchi (pIND20) yoki konstitutiv (CMV) dCas13-B2 ekspressiyasiga ega barqaror hujayra liniyalarida sitoplazmatik/umumiy NET11067 gRNK miqdori (5C-rasmda ko'rsatilgan FISH tasvirlaridan). Dox induksiyasi kunlari ko'rsatilgan. Har bir shart uchun n = 65-115 ta hujayra; Sidakning ko'p sonli taqqoslash testi bilan bir omilli ANOVA bo'yicha * P &amp;lt; 0.05 va *** P &amp;lt; 0.001. (E) dCas13-B2 2 yoki 7 kun davomida induksiya qilingandan keyin GFP va NET1 mRNK larning vakillik FISH tasvirlari. Uchli ko'rsatgichlar NET1 mRNK to'plangan hududlarni ko'rsatadi. (F, G) dCas13-B2 2 yoki 7 kun davomida induksiya qilingandan keyin NET1 mRNK PDI (F) va GFP mRNK miqdori (G). Har bir shart uchun n = 46-48 ta hujayra; ahamiyatsiz (ns); Dannetning ko'p sonli taqqoslash testi bilan bir omilli ANOVA bo'yicha * P &amp;lt; 0.05 va **** P &amp;lt; 0.0001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;
