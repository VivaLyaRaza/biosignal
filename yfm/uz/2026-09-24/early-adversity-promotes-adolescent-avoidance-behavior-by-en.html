            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"271\" cy=\"93\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"549\" cy=\"223\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Bolalikdagi stress miyani&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qanday o'zgartiradi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en-f1.jpg\" alt=\"1-rasm. ELA o‘smirlarda xavfdan qochish xatti-harakatini va uning asosiy BLA faolligini kuchaytiradi. (a) LBN protokoli.\" /&gt;&lt;/p&gt;\n&lt;p&gt;*1-rasm. ELA o‘smirlarda xavfdan qochish xatti-harakatini va uning asosiy BLA faolligini kuchaytiradi. (a) LBN protokoli. (b) LBN va standart parvarishlash (SR) davrida ona xatti-harakatlarining taqsimoti (SR, n=4; LBN, n=6 ona) (Xi-kvadrat testi ꭓ2(4,27), p&amp;lt;0.0001). (c) Onalar uyada o‘tkazadigan vaqtning foizi (juftlanmagan t-test F3,5=6.51, p=0.028). (d) Tug‘ilgandan keyingi (P)12, P21, P35 kunlardagi bolalarning vazni (SR, n=16 bola/4 nasl, LBN, n=15 bola/6 nasl; Bonferroni post-hoc testi bilan takroriy o‘lchovli ikki omilli ANOVA: yosh effekti F1.51,43.92 = 736.4, P&amp;lt;0.0001; parvarish effekti F1,29 = 3.53, P=0.071; o‘zaro ta’sir F1.51,43.92 = 0.1949, P = 0.762, skripka diagrammalari mediana va kvartillarni ko‘rsatadi). (e) Platforma yordamida qochish (PMA) protokoli. (f) 3 ta tovush binlari bo‘yicha o‘rtacha hisoblangan muvaffaqiyatli urinishlar ulushi (SR, n=18; LBN, n=19 sichqon; Sidak post-hoc testi bilan takroriy o‘lchovli ikki omilli ANOVA: urinish effekti F2.29,80.10 = 40.84, P&amp;lt;0.0001; parvarish effekti F1,35 = 0.22, P=0.645; o‘zaro ta’sir F2.29,80.10 = 0.55, P = 0.605). (g) PMA tiklash paytida issiqlik xaritalari sifatida ko‘rsatilgan sichqonlar joylashuvining vakillik namunalari. (h) Tiklash paytida tovush vaqtida platformadagi o‘rtacha vaqt ulushi (juftlanmagan t-test F17,18=1.71, P=0.006). (i) Tiklash paytida tovush vaqtida qotib qolgan o‘rtacha vaqt ulushi (juftlanmagan t-test F17,18=2.32, p=0.888). (j-t) PMA o‘qitish va tiklash davrida BLAda tola fotometriyasi yozuvlari (SR, n=8; LBN, n=5 sichqon). (j) GCaMP6s ekspressiyasining sxematik va namuna tasvirlari va BLAda optik tola implantati. (k) Tola fotometriyasi hayvonlarini PMA o‘qitish paytida muvaffaqiyatli urinishlar ulushi (SR, n=8; LBN, n=5 sichqon) (2-faktorli ANOVA: urinish effekti F1,11=30.09, P=0.0002; parvarish effekti F1,12=0.09, P=0.77; o‘zaro ta’sir effekti F1,11=1.45, P=0.254). (l) Fotometriya hayvonlarini PMA tiklash paytida platformadagi vaqt ulushi (juftlanmagan t-test F7,4=8.10, P=0.016). (m) Sichqoncha PMA o‘qitish paytida zarba olgan tovush davrlarida BLA faolligidagi floresansning o‘rtacha o‘zgarishi (z-ball). (n) Zarba va undan keyingi 13 soniya davomida egri chiziq ostidagi maydonni (AUC) miqdoriy baholash (juftlanmagan t-test F4,7=1.07, P=0.024). (o) Zarba paytida cho‘qqi floresansini miqdoriy baholash (juftlanmagan t-test F7,4=5.10, P=0.829). (p) Zarbadan keyin boshlang‘ich darajaga qaytishga moslashtirilgan eksponensial egri chiziqning pasayish tezligini (soniyalarda) miqdoriy baholash (juftlanmagan t-test F4,7=33.56, P=0.0026). (q) Sichqoncha platformadan tashqarida bo‘lganida tovush boshlanishiga javoban BLA faolligidagi floresansning o‘rtacha o‘zgarishi (z-ball). (r) Tovush boshlanganidan keyingi 3 soniya ichida AUCni miqdoriy baholash (juftlanmagan t-test F4,7=4.36, P=0.037). (s) Tovush boshlanganidan keyingi 3 soniya ichida cho‘qqi javobini miqdoriy baholash (juftlanmagan t-test F4,7=5.06, P=0.092). (t) AUC va tovush paytida platformadagi vaqt ulushi o‘rtasidagi korrelyatsiya (chiziqli regressiya SR: F1,6=1.44, P=0.276, LBN: F1,3=66.41, P=0.004). Barcha ma'lumotlar nuqtalari biologik takroriyliklarni bildiradi. Ma'lumotlar o‘rtacha ± standart xato sifatida ko‘rsatilgan va soyalanish subyektlar orasidagi standart xatoni aks ettiradi; *P&amp;lt;0.05, *&lt;em&gt;P&amp;lt;0.01. Uchburchaklar urg‘ochilarni, doiralar erkaklarni bildiradi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Bolalikdagi noqulay sharoitlar o'smirlik davrida xavf-xatarlarga nisbatan o'ta keskin munosabatni keltirib chiqarishi mumkin. Olimlar sichqonlar modelida bu o'zgarishlarga qaysi neyron yo'llari mas'ul ekanini aniqlashdi. Ma'lum bo'lishicha, gap prefrontal qobiq va amygdalani bog'lovchi hujayralarning faollashuvi haqida bormoqda. Qizig'i shundaki, voyaga yetgan yoshda bu konturlar bunday xulq-atvorni keltirib chiqarmaydi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Erta stress o'smirlarda xavfdan qochish xulqini kuchaytiradi&lt;/li&gt;\n&lt;li&gt;Qobiq va amygdala orasidagi qo'zg'atuvchi yo'l faolligi o'zgaradi&lt;/li&gt;\n&lt;li&gt;Neyronlarni optogenetik bostirish stress oqibatlarini yo'q qiladi&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Erta hayotiy stress (Early life adversity, ELA) butun dunyo bo'ylab insonlarning deyarli yarmidan ko'piga ta'sir qilib, xavotir buzilishlari xavfini oshiradi. Ushbu jarayonni o'rganish uchun tadqiqotchilar cheklangan to'shak materiallari modelidan (limited bedding and nesting, LBN) foydalanishdi. O'smirlik davrida hayvonlar platforma yordamida tahdidlardan qochish (Platform Mediated Avoidance, PMA) testidan o'tkazildi. Tolali fotometriya yordamida bazolateral amygdalada (BLA) kalsiy faolligi qayd etildi.&lt;/p&gt;\n&lt;p&gt;Bolaligida ELA boshdan kechirgan sichqonlar tovush signali ostida xavfdan qochish darajasini sezilarli darajada oshirgani aniqlandi. Miya xaritasi va RNAscope usuli bu jarayonda ventromedial prefrontal qobiqdagi (vmPFC) kortikotropin-relizing-gormonni (CRH) ifodalovchi glutamatergik neyronlar muhimligini ko'rsatdi. Stressga uchragan sichqonlarda bu yo'l kuchaygan bo'lib, optogenetik bostirish orqali xulq-atvorni me'yorga qaytarish mumkin bo'ldi.&lt;/p&gt;\n&lt;p&gt;Olimlarning ta'kidlashicha, topilgan ta'sir faqat yosh davriga xosdir. Xuddi shu manipulyatsiyalar yetuk yoshdagi sichqonlarda xulq-atvor o'zgarishiga olib kelmadi. Bu prefrontal qobig'dagi CRH-pozitiv neyronlar o'smirlik davrida psixik buzilishlarga moyillikni belgilovchi asosiy omil ekanini ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot laboratoriya sichqonlarida o'tkazilgan bo'lib, natijalarni odamlarga to'g'ridan-to'g'ri ko'chirish qo'shimcha tekshiruvlarni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Hayotning erta davridagi noqulayliklar (ELA) emotsional qonuniyatlar faoliyatiga uzoq muddatli ta'sir ko'rsatadi. Erta yoshdagi zo'ravonlik, e'tiborsizlik yoki oiladagi beqarorlik tahdidni baholash va unga javob qaytarishda doimiy o'zgarishlar bilan bog'liq bo'lib, ular kayfiyat va xavotir buzilishlarining asosiy belgilari hisoblanadi. Bu o'zgarishlar ko'pincha o'smirlik davrida namoyon bo'ladi va mukofotlovchi tajribalarga qatnashishni cheklovchi haddan tashqari qochish xulq-atvori bilan tavsiflanadi.&lt;/p&gt;\n&lt;p&gt;Biroq, ELA ni kuchaytirilgan tahdid reaksiyalari bilan bog'laydigan neyrorivojlanish mexanizmlari hali ham aniq emas. Biz stressga sezgir bo'lgan medial prefrontal qobiq (mPFC)-bazolateral amygdala yo'lini aniqladik, u kortikotropin-rilizing gormon (CRH) va glutamatni birgalikda ekspressiya qiladi. Bizning aniqlashimizcha, ELA bu yo'lni mustahkamlaydi va o'smirlik davrida tahdeiddan qochish xulq-atvorini kuchaytiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Erta noqulayliklar CRH va glutamatni ifodalovchi mPFC-bazolateral amygdala yo'lini kuchaytiradi va o'smirlarda tahdiddan qochishni oshiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Optogenetik tormozlanish va ushbu yo'ldagi rivojlanish jarayonidagi CRH ning faoliyatini pasaytirish ELA keltirib chiqargan o'smirlardagi qochishning oshishini bartaraf etadi, shu bilan birga odatiy parvarish qilingan sichqonlarda mPFC CRH ekspressiyasini umumiy kamaytirish ELA fenotiplarini takrorlaydi. Xuddi shunday manipulyatsiyalar yetuk yoshdagi individlarda hech qanday xulq-atvor ta'sirini ko'rsatmadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Optogenetika — bu miyadagi aniq hujayralarni yorug'lik yordamida yoqish yoki o'chirish imkonini beruvchi usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Umuman olganda, bizning natijalarimiz shuni ko'rsatadiki, hujayra turi uchun spesifik bo'lgan CRH signallari rivojlanayotgan zanjir plastikasini boshqaradi, emotsional zanjir funksiyasini o'zgartiradi va psixiatrik zaiflikka hissa qo'shishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot natijalari kemiruvchilar modeli asosida olingan bo'lib, ularni insonga ko'chirishda ehtiyotkorlik talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Erta hayotdagi noqulay omillar (ELA), jumladan e'tiborsizlik, suiiste'mol qilish, yomon munosabatda bo'lish yoki beqaror uy muhiti butun dunyo bo'ylab deyarli 60% odamlarga ta'sir qiladi. ELA o'tkinchi bo'lishi mumkin bo'lsa-da, u miyaning hissiyot tizimlari rivojlanishi va faoliyatida, shu jumladan shaxslarning ekologik tahdidlarni qanday baholashi va ularga qanday javob berishida uzoq muddatli o'zgarishlarni keltirib chiqaradi. Shunday qilib, ELA tashvish va depressiyani o'z ichiga olgan psixiatrik kasalliklar uchun asosiy xavf omili hisoblanadi. Ushbu buzilishlar ko'pincha o'smirlik davrida yuzaga keladi, bu miya rivojlanishining muhim bosqichi bo'lib, bunda tadqiqot va tajriba faoliyatga bog'liq plastiklik orqali kech rivojlanadigan kognitiv va hissiyot tizimlarini shakllantiradi. Kayfiyat va xavotir buzilishlari neyron tarmoqlarining yetilishini izdan chiqarishi va maqsadga yo'naltirilgan xulq-atvorni to'sqinlik qilishi mumkin bo'lgan tahdidlardan kuchaytirilgan qochish bilan tavsiflanadi. Shunga qaramay, ELA bo'yicha ko'pchilik mexanistik tadqiqotlar kattalardagi natijalarga qaratilgan bo'lib, ELA ni keyingi xulq-atvor o'zgarishlari bilan bog'laydigan rivojlanish jarayonlari kam o'rganilganligicha qolmoqda. Ushbu ma'lumotlar oxir-oqibat xavf ostidagi aholida psixiatrik alomatlarni aniqlash, oldini olish va davolashga yordam beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Hayotning boshlang'ich davridagi noqulayliklar (ELA) 60%igacha odamlarga ta'sir qiladi va o'smirlik davrida neyron tarmoqlarining yetilishi buzilishi natijasida yuzaga keladigan xavotir hamda depressiya uchun asosiy xavf omilidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Emotsional stimullarni qayta ishlaydigan hamda o'rganish va qaror qabul qilishni tartibga soluvchi limbik tizim stress gormoni retseptorlarining yuqori ekspressiyasi tufayli noqulay omillarga nisbatan o'ta sezgir hisoblanadi. Shuningdek, u psixiatrik kasalliklarda disregulyatsiyaga uchraydi. Inson neyrovizualizatsiya tadqiqotlari shuni ko'rsatadiki, ELA limbik tizim faoliyati va funksional bog'liqligini, ayniqsa medial prefrontal qobiq (mPFC) va bazolateral amigdala (BLA) o'rtasida o'zgartiradi. Ushbu o'zgarishlarning ba'zilari tahdidga qarshi maladaptiv javoblar bilan korrelyatsiya qilsa-da, sabab-oqibat dalillarining yo'qligi ELA tegishli miya tarmoqlari rivojlanishini qanday buzib, bo'rttirilgan tahdid qochishiga olib kelishini tushunishda asosiy bo'shliqlarni qoldiradi. Xulq-atvor miyadagi maxsus neyron tarmoqlarining muvofiqlashtirilgan faoliyatidan kelib chiqqanligi sababli, ELA dan keyingi hujayra turi va tarmoqqa xos o'zgarishlarni ochib berish oxir-oqibat ELA kognitiv va emotsional xulq-atvorga ta'sir qiluvchi mexanizmlarni ochib beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Bazolateral amigdala (BLA) va medial prefrontal qobiq (mPFC) – hissiyotlarni qayta ishlash, qo'rquvni baholash va xulq-atvorni nazorat qilish uchun mas'ul bo'lgan asosiy miya tuzilmalari bo'lib, ularning bog'liqligi stress ostida buziladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kortikotropin-relizing gormoni (CRH) kabi stressga sezgir molekulalar maxsus limbik hujayra populyatsiyalarida to'plangan bo'lib, ELA ni doimiy xulq-atvor o'zgarishlari bilan bog'lashi mumkin. Ko'pgina tadqiqotlar gipotalamusdagi CRH ga qaratilgan bo'lib, u yerda organizmning stressga javobini tartibga soladi. Biroq, CRH shuningdek mPFC, gipokamp, amigdalaning markaziy yadrosi (CeA) va tasmali tanachaning yotoq yadrosi (BNST) shu jumladan asosiy emotsiyani tartibga soluvchi markazlarda ham yuqori darajada ekspressiya qilinadi. ELA ushbu hududlardagi CRH ekspressiyasini ham, CRH eksprssiya qiluvchi neyronlar funksiyasini ham o'zgartiradi. CRH asosan gamma-aminomoy kislotali (GABAergik) hujayralarda ekspressiya qilinadi va nishon neyronlarda plastiklikni rag'batlantirish uchun o'zining mos keluvchi retseptorlari – kortikotropin-relizing faktor retseptorlari 1 va 2 orqali signallarni uzatadi. Gen nokdauni yoki farmakologik retseptorlarni ingib qilish orqali CeA, BNST va gipokampdagi CRH faolligini kamaytirish mos ravishda ELA keltirib chiqaradigan angedoniya, xavotirga o'xshash xulq-atvor va xotira tanqisligini bartaraf etadi. Qo'shimcha ravishda, CRH ekspressiya qiluvchi CeA hujayralarini ingib qilish kattalarda ELA keltirib chiqaradigan cho'chib ketish reaksiyalarining oshishini va maladaptiv mukofot xulq-atvorini oldini oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Olingan ma'lumotlar asosan hayvonlar modellariga asoslangan; natijalarni insonga to'g'ridan-to'g'ri ko'chirish inson psixikasining murakkabligi sababli ehtiyotkorlikni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Umuman olganda, ushbu topilmalar CRH ni stress keltirib chiqaradigan neyroplastiklikni boshqaruvchi effektor va ELA ning uzoq muddatli oqibatlariga hissa qo'shadigan stressga sezgir yo'llarning markeri sifatida ta'kidlaydi. Shunga qaramay, bizda ELA keltirib chiqaradigan CRH tizimidagi o'zgarishlar miya rivojlanishiga qanday ta'sir qilishi haqida cheklangan tushuncha mavjud — ayniqsa xavotir buzilishlari uchun markaziy bo'lgan qochish xulq-atvorini qo'llab-quvvatlaydigan tarmoqlar doirasida. ELA ning CRH tizimiga ta'siri bo'yicha ko'pgina tadqiqotlar faqat kattalarga qaratilgan edi. Bundan tashqari, CRH yoki retseptor ekspressiyasini keng miqyosda boshqargan ko'plab bunday tadqiqotlar ziddiyatli natijalarni berdi, bu esa CRH tarmoqlari funksiyasini hudud va hujayra turi darajasida o'rganish zarurligini ta'kidlaydi. ELA rivojlanayotgan miyadagi maxsus CRH tarmoqlariga qanday o'ziga xos ta'sir qilishini aniqlash yoshga xos biologiyaga asoslangan psixiatrik kasalliklar uchun yanada samarali aralashuvlarni ishlab chiqish uchun asos yaratishi mumkin.&lt;/p&gt;\n&lt;p&gt;ELA ning sichqon modeli yordamida biz o'smirlik davrida BLA ning yuqori faolligi bilan korrelyatsiya qilingan kuchaytirilgan tahdid qochish xulq-atvorini kuzatdik. CRH ning miya bo'ylab xaritalanishi ELA o'smirlarda ventromedial (vm) PFCdagi CRH+ neyronlar sonining tanazzul bilan kamayishini keltirib chiqarishini ko'rsatdi. Bunga mos ravishda, rivojlanishning dastlabki bosqichlarida vmPFC bo'ylab CRH nokdauni odatiy tarbiyalangan o'smir sichqonlarda ELA fenomenotiplarini takrorlaydi. Virusli tarmoq xaritalash va patch-clamp yozuvlaridan foydalanib, biz vmPFC dan BLA ga proyeksiya qiluvchi va ELA dan keyin kuchaytiriladigan glutamatergik, CRH ekspressiya qiluvchi neyron populyatsiyasini aniqladik. RNAscope shuni ko'rsatdiki, ELA glutamatergik bo'lmagan vmPFC CRH+ hujayralari sonini kamaytirsa-da, u glutamatergik CRH+ populyatsiyasida yuqori CRH ekspressiyasini boshqaradi. Bunga mos ravishda, glutamatergik vmPFCCRH+→BLA yo'lining optogenetik ingib qilinishi o'smirlarda ELA keltirib chiqaradigan tahdid qochishining oshishini bartaraf etadi. Xuddi shunday, vmPFC qo'zg'atuvchi hujayralarida selektiv ravishda CRH nokdauni ELA bo'lgan o'smir sichqonlarda qochish va BLA faolligining pasayishiga olib keladi. Kattalarda bu manipulyatsiyalar hech qanday ta'sir ko'rsatmadi, bu esa noqulaylikdan keyin kuchaytirilgan qochishni qo'zg'atishda ushbu yo'lning rivojlanish jihatidan cheklangan rolini ta'kidlaydi. Jamlangan holda, ushbu topilmalar vmPFC CRH ELA dan keyin erta postnatal effektor sifatida ishlashini, hujayra turiga xos tarzda harakat qilishini va qo'zg'atuvchi, CRH ekspressiya qiluvchi vmPFC–BLA yo'lida plastiklikni keltirib chiqarishini ko'rsatadi. ELA ilgari tasvirlanmagan CRH ekspressiya qiluvchi qo'zg'atuvchi yo'ldagi faoliyatni qanday o'zgartirishini ochib berish orqali, ushbu ish ELA o'smirlar xulq-atvorini qanday o'zgartirishi haqida mexanistik tushuncha beradi va ruhiy kasalliklar xavfini kamaytirish strategiyalaridan xabardor qilishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sichqonlarda o'tkazilgan tadqiqot ELA ventromedial prefrontal qobiqda CRH-neyronlarning maxsus yo'qolishi va qayta qurilishiga olib kelishini, vmPFC–BLA yo'lining optogenetik tormozlanishi esa o'smirlikdagi qochish xulq-atvorini bartaraf etishini ko'rsatdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"erta-hayotdagi-stress-ela-osmirlik-davridagi-xavfdan-qochish-xatti-harakatini-va-uning-asosidagi-bla-faolligini-kuchaytiradi\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#erta-hayotdagi-stress-ela-osmirlik-davridagi-xavfdan-qochish-xatti-harakatini-va-uning-asosidagi-bla-faolligini-kuchaytiradi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Erta hayotdagi stress (ELA) o'smirlik davridagi xavfdan qochish xatti-harakatini va uning asosidagi BLA faolligini kuchaytiradi&lt;/span&gt;&lt;/a&gt;Erta hayotdagi stress (ELA) o'smirlik davridagi xavfdan qochish xatti-harakatini va uning asosidagi BLA faolligini kuchaytiradi&lt;/h4&gt;\n&lt;p&gt;Limbik соҳалар, jumladan mPFC va BLA, kattalarda xavfdan qochish xatti-harakatlarini tartibga soladi. Ushbu zanjirlar o'smirlik davrida sezilarli o'zgarishlarga uchraydi va bu xavfdan qochish xatti-harakatining yoshga bog'liq o'zgarishlariga hissa qo'shadi. Kattalarga qaraganda, o'smir sichqonlar odatda xavfdan qochish xatti-harakatlarining pastroq darajasini ko'rsatib, buning o'rniga tadqiq qilishni afzal ko'radilar. ELA kemiruvchilar va odamlarda xavfga javob qaytarishni kuchaytiradi, bu ta'sir BLA faolligining oshishi bilan korrelyatsiya qiladi. Biroq, ELA oldini olish mumkin bo'lgan xavflarga o'rganilgan javoblarni qanday o'zgartirishi hamda bu o'zgarishlarning qanday hujayrali va molekulyar mexanizmlarga asoslanishi noma'lumligicha qolmoqda. Biz limbik zanjirlardagi ELA keltirib chiqaradigan o'zgarishlar o'smirlik davrida yaqqol namoyon bo'lib, xavotir va depressiyaning psixiatrik alomatlari, jumladan kuchaytirilgan xavf reaksiyalari odatda yuzaga keladigan ushbu rivojlanish davrida xatti-harakatlar o'zgarishiga turtki bo'ladi deb faraz qildik.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ELA o'smirlik davrida xavfdan qochish reaksiyalari va BLA faolligini tanlab kuchaytiradi hamda xavotir buzilishlarining erta paydo bo'lishini tushunishga asos yaratadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu gipotezani sinab ko'rish uchun biz ELA ning cheklangan to'shak va uy qurish (LBN) modelidan foydalandik. LBN modeli onaning uy qurish materialini kamaytirish va simli to'r pol yordamida sichqonlarni to'shak materialidan ajratish orqali past resursli muhitga taqlid qiladi (1a-rasm). Bu rivojlanishning muhim davrida (tug'ilgandan keyingi (P)4 dan P11 kunigacha) parvarishning parchalangan va oldindan aytib bo'lmaydigan bo'lishiga sabab bo'ladi. Ushbu davrda LBN guruhi onalari emizishga kamroq vaqt sarflab, yolg'iz o'zi ko'proq vaqt o'tkazdilar (1b-rasm), natijada uyadagi umumiy vaqt kamaydi (1c-rasm). LBN bolalari P12 da standart parvarish qilingan (SR) nazorat guruhidagilarga qaraganda kamroq vaznga ega edi, biroq bu farq sutdan ajratish vaqtida sezilmadi (1d-rasm).&lt;/p&gt;\n&lt;p&gt;O'smirlik davrida (P33–37) xavfdan qochish xatti-harakatidagi o'zgarishlarni baholash uchun biz platforma vositasida qochish (PMA) testidan foydalandik, bunda sichqonlar tovush signali bilan ogohlantiriladigan elektr toki urishidan qochish uchun platformaga o'tishni o'rganadilar (1e-rasm). Tok panjaralari ostida yetib bo'lmaydigan joyga qo'yilgan hid idishlari kamerani tadqiq qilishga undadi. Garchi LBN sichqonlari tok urishiga nisbatan biroz pasaygan sezuvchanlikni ko'rsatgan bo'lsa-da (SN 1a-rasm), bu ularning PMA ni o'rganish qobiliyatiga ta'sir qilmadi. Muvaffaqiyatli urinishlar ulushi va tovush signali vaqtida platformadagi vaqt bilan o'lchangan holda, ikkala guruh ham mashg'ulot oxiriga kelib o'xshash natija darajalariga erishdi (1f-rasm, SN 1b-rasm). Aksincha, ertasi kuni xavf xotirasini tiklash seansida LBN sichqonlari tovush signali vaqtida platformada sezilarli darajada ko'proq vaqt o'tkazdilar (1g,h-rasm) va tovush boshlanganidan keyin platformaga kirish uchun kamroq vaqt sarflashga moyil bo'ldilar (SN 1c-rasm). Muhimi shundaki, qotib qolish (freezing) darajalari guruhlar o'rtasida farq qilmadi (1i-rasm), bu platformadagi vaqtning ko'payishi ushbu joydagi qotib qolishning kuchayishi yoki kuchliroq tovush-tok assotsiatsiyasi bilan emas, balki xavf bilan boshqariladigan qochish xatti-harakatidagi farqlar bilan bog'liqligini ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PMA testi (Platform Mediated Avoidance) — kemiruvchilar elektr toki urishidan oldin keladigan tovush signalidan maxsus platformaga qochib qutulishni o'rganadigan xulq-atvor usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;PA ning kuchayishi LBN sichqonlarida xavotirga o'xshash xatti-harakatlarning ortishi bilan bog'liqligini aniqlash uchun biz ochiq maydon va baland krestsimon labirintdan foydalandik (SN 1d,e-rasm). Ushbu testlar sichqonlar yirtqichlarga ko'proq zaif bo'lgan joylarga taqlid qilib, qurilmaning ochiq qismlarida qancha vaqt o'tkazishini o'lchaydi. Biz ushbu testlarda parvarish bilan bog'liq xatti-harakatlar o'zgarishlarini kuzatmadik, bu esa ELA xavotirga o'xshash xatti-harakatlarning umumiy o'sishidan ko'ra, xavfga javob qaytarishda o'qishga xos o'zgarishlarni keltirib chiqarishini ko'rsatadi. Yangi hid testida ham hech qanday farq kuzatilmadi, bu ELA tadqiq qilish istagiga ta'sir qilmasligini, lekin tadqiqot potensial xavf yoki xarajat keltirib chiqarganda qochishni aniq kuchaytirishini ko'rsatadi (SN 1f-rasm).&lt;/p&gt;\n&lt;p&gt;ELA o'smir sichqonlarda xavfdan qochishga asos bo'lgan BLA faolligini qanday o'zgartirishi mumkinligini baholash uchun biz PMA mashg'ulotlari va xotirani tiklash davrida neyron faolligining ko'rsatkichi bo'lgan umumiy kaltsiy floresansiyasini o'lchash uchun tola fotometriyasidan foydalandik (1j-rasm). PMA yozuvlaridan so'ng, barcha hayvonlarda to'g'ri virus ekspressiyasi va tola joylashuvi tasdiqlandi (SN 2a-rasm). Ikkala guruhda ham o'xshash o'qish darajalari kuzatildi, LBN sichqonlari esa xotirani tiklash davrida sezilarli darajada kuchaygan qochishni namoyish etdi (1k,l-rasm). Tok urishi paytida SR va LBN guruhlari o'xshash amplitadali tok reaksiyalarini ko'rsatdi (1m-rasm). Biroq, LBN sichqonlarida bu reaksiyalar boshlang'ich darajaga sekinroq qaytdi, natijada SR nazoratiga nisbatan tok keltirib chiqargan Ca2+ faolligining umumiy o'sishi kuzatildi (1n-p-rasm). Xotirani tiklash davrida LBN guruhlarida tovush boshlanishiga javob nazorat guruhidagilardan sezilarli darajada katta bo'ldi, ayniqsa hayvonlar platformadan tashqarida bo'lganida va xavf muqarrar bo'lgan paytda (1q-s-rasm). LBN sichqonlarida, ammo nazoratdagilarda emas, qochish darajalari ushbu tovush boshlanishi reaksiyasi bilan kuchli korrelyatsiya qildi (1t-rasm), bu tovush bilan bog'liq BLA faolligi LBN sichqonlarida ishora qilingan xavfdan qochishni kuchli kodlashini, ammo nazoratchilarda bunday emasligini ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kuzatilgan hujayrali va xulq-atvorga oid o'zgarishlar sichqon modellari asosida olingan, shuning uchun ularni bevosita inson patologiyasiga ko'chirish ehtiyotkorlikni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Sichqonlarning alohida guruhlarida biz LBN sichqonlarida kuchaygan BLA faolligining asosi bo'lishi mumkin bo'lgan hujayrali va sinaptik o'zgarishlarni keyingi bosqichda o'rgandik. Avval biz neyron qo'zg'aluvchanligi bilan bog'liq bo'lgan transkripsiya omili bo'lgan fosforillangan cAMP javob elementini bog'lovchi oqsil (pCREB) ekspressiya darajasini o'lchadik (48). LBN sichqonlarida BLA hujayralari sonining o'zgarmaganiga va PMA o'rganishida farqlar yo'qligiga qaramay, pCREB ekspressiya darajalari sezilarli darajada yuqori edi (SN 2b-e-rasm). Keyinchalik biz o'tkir miya kesmalarida BLA neyronlaridan o'z-o'zidan qo'zg'atuvchi va tormozlovchi postsynaptik toklarni (mos ravishda sEPSCs va sIPSCs) yozib oldik (SN 2f-h-rasm). LBN sichqonlari sEPSC chastotasining yuqori bo'lishiga nisbatan umumiy tendensiyani ko'rsatdi va yuqori amplitadali sEPSC larning sezilarli darajada yuqori ulushini namoyish etdi (SN 2i-rasm), bu LBN ning BLA neyronlariga qo'zg'atuvchi sinaptik kirishning kuchayishiga olib kelishini ko'rsatadi. Aksincha, biz IPSClarda hech qanday o'zgarishlarni kuzatmadik (SN 2j-rasm), bu LBN ta'siri ayniqsa qo'zg'atuvchi sinapslarga xos ekanligini bildiradi. Umuman olganda, ushbu natijalar ELA o'smirlik davrida xavfdan qochish vaqtida neyron qo'zg'aluvchanligi va qo'zg'atuvchi sinaptik kirishni oshirish orqali BLA faolligini kuchaytirishi mumkinligini ko'rsatadi.&lt;/p&gt;\n&lt;h4 id=\"vmpfc-dagi-kamaygan-crh-osmirlik-davrida-tahdidlardan-kuchaytirilgan-qochish-bilan-bogliq\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#vmpfc-dagi-kamaygan-crh-osmirlik-davrida-tahdidlardan-kuchaytirilgan-qochish-bilan-bogliq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;vmPFC dagi kamaygan CRH o'смирлик davrida tahdidlardan kuchaytirilgan qochish bilan bog'liq&lt;/span&gt;&lt;/a&gt;vmPFC dagi kamaygan CRH o'смирлик davrida tahdidlardan kuchaytirilgan qochish bilan bog'liq&lt;/h4&gt;\n&lt;p&gt;CRH stress va tahdidni qayta ishlashning markaziy mediatoridir. CRH ning BLA ga infuziyasi qo'zg'atuvchi populyatsiyalar faollashuvini oshiradi va qo'rquv xotirasini kuchaytiradi hamda stress BLA dagi CRH retseptorlari faoliyatiga ta'sir qiladi. Shunga qaramay, BLA ning o'zi juda oz miqdorda CRH ekspressiya qiladi, bu o'zgargan CRH ajralib chiqishi tashqi manbadan kelib chiqishini ko'rsatadi, biroq ELA o'smirlik davrida BLA ga proyeksiya qiluvchi hududlarda CRH ekspressiyasiga qanday ta'sir qilishi noma'lum.&lt;/p&gt;\n&lt;p&gt;ELA ning o'smir miyasi bo'ylab CRH populyatsiyalariga qanday ta'sir qilishini tizimli ravishda o'rganish uchun biz CRH-Cre sichqonlarini Ai14 rapportyor liniyasi bilan chatishtirdik, shunda barcha CRH neyronlari qizil florofor (tdTomato) bilan belgilanadi. LBN yoki SR ta'siridan so'ng biz har bir tarbiyalash guruhi uchun miyaning barcha hududlarida CRH ekspressiya qiluvchi (CRH+) hujayralar sonini miqdoriy baholash uchun butun miya to'qimalarini tiniqlashtirish, immunomarkalash va yorug'lik varaqli mikroskopiyasidan foydalandik (Rasm 2a). Oldingi adabiyotlarga mos ravishda, biz CeA, piriform qobiq (PIR), BNST va gipotalamusda zich CRH+ hujayralar klasterlarini kuzatdik (Rasm 2b). Biz BLA ga eng kuchli proyeksiyalarni yuborishi ma'lum bo'lgan hududlarda CRH+ hujayralar zichligi o'zgarishini aniqladik va vmPFC da CRH+ hujayralar zichligining tanlab kamayganini kuzatdik (Rasm 2c, Jadval SN 1).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en-f2.jpg\" alt=\"2-rasm. O'smirlik davrida vmPFC'da CRH ning kamayishi tahdidni keltirib chiqaruvchi qochish xulq-atvorining kuchayishi b\" /&gt;&lt;/p&gt;\n&lt;p&gt;*2-rasm. O'smirlik davrida vmPFC'da CRH ning kamayishi tahdidni keltirib chiqaruvchi qochish xulq-atvorining kuchayishi bilan bog'liq (a-c), O'smir SR va LBN sichqonlarida CRH+ hujayra populyatsiyalarining o'zgarishini tahlil qilish. (a) Butun miya bo'ylab CRH+ hujayralar zichligini miqdoriy baholash uchun DeepCOUNT tahlil quvur liniyasi (SR, n=6; LBN, n=7 sichqon). (b) SR (kulrang) va LBN (qizil) o'smir sichqonlarida CRH+ neyronlarining voksel bo'yicha zichligini aks ettiruvchi nuqtali diagrammalar. (c) Retrograd belg qo'yilgan CRH+ hujayralari mavjud bo'lgan 6 ta BLA kirish regionlarida, shu jumladan dmPFC, vmPFC, PIR, dorsal talamusning o'rta chiziq guruhi (MTN), TEa va ECT da CRH+ hujayralar zichligini taqqoslash (Sidak ning post hoc testi bilan ikki omilli takroriy o'lchovlar ANOVA: region effekti F2.18,23.93 = 41.53, P&amp;lt;0.0001; parvarish effekti F1,11 = 2.15, P=0.171; o'zaro ta'sir F2.18,23.93 = 2.00, P=0.1544). (d) vmPFC'da Crh ekspresiyasining AAV-shRNA nokdaunining eksperimental vaqt jadvali va tasviri (SR: skrembl, n=10; shRNA, n=14; LBN: skrembl, n=10, shRNA, n=12 sichqon). (e) Shokdan oldingi boshlang'ich daraja va seansning so'nggi to'rtta tonlari uchun o'rtacha hisoblangan PMA mashg'uloti davomidagi muvaffaqiyatli urinishlar ulushi (uch omilli ANOVA: urinish effekti F1,42=20.58, P&amp;lt;0.0001; parvarish effekti F1,42=10.16, P=0.0027; nokdaun effekti F1,42=0.098, P=0.756; urinish × parvarish effekti F1,42=0.013, P=0.909; urinish × nokdaun effekti F1,42=0.47, P=0.50; parvarish × nokdaun effekti F1,42=0.803, P=0.375; urinish × parvarish × nokdaun effekti F1,42=0.417, P=0.522). (f-h), PMA ni tiklash davridagi xulq-atvor ko'rsatkichlari. (f) Seans davomida o'rtacha platformadagi vaqt ulushi (Tuki ning post hoc testi bilan ikki omilli ANOVA: nokdaun effekti F1,42=3.37, P=0.074; parvarish effekti F1,42=22.81, P&amp;lt;0.0001; o'zaro ta'sir effekti F1,42=7.88, P=0.0075). (g) Tovush boshlanganidan keyin platformaga kirish uchun latentsiya (Tuki ning post hoc testi bilan ikki omilli ANOVA: nokdaun effekti F1,42=9.03, P=0.0045; parvarish effekti F1,42=4.98, P=0.031; o'zaro ta'sir effekti F1,42=6.46, P=0.015). (h) Seans davomida o'rtacha qotib qolish vaqti ulushi (Tuki ning post hoc testi bilan ikki omilli ANOVA: nokdaun effekti F1,42=0.029, P=0.867; parvarish effekti F1,42=3.60, P=0.0646; o'zaro ta'sir effekti F1,42=6.06, P=0.018). Barcha ma'lumotlar nuqtalari biologik takroriyliklarni bildiradi. Ma'lumotlar o'rtacha ± standart xatolik (s.e.m.) sifatida ko'rsatilgan va soyalanish subyektlar orasidagi s.e.m. ni aks ettiradi; *P&amp;lt;0.05, **P&amp;lt;0.01, ***P&amp;lt;0.001, ***&lt;em&gt;P&amp;lt;0.0001. Uchburchaklar urg'ochi, doiralar erkak jinsidagilarni bildiradi.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Erta hayot tajribasi (ELA) ventromedial prefrontal korteksda (vmPFC) CRH ekspressiya qiluvchi hujayralar zichligining tanlab kamayishiga olib keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;vmPFC dagi CRH signallari tahdidlardan qochish xulq-atvorida qatnashishini aniqlash uchun biz Crh ekspressiyasini mahalliy tarzda pasaytirish (nokdaun qilish) maqsadida kalta shpindel shaklidagi RNK (shRNA) dan foydalandik (Rasm 2d). vmPFC dagi CRH+ neyronlar zichligi P7 va P21 oralig'ida, ayniqsa BLA ga proyeksiya qiluvchi neyronlarning asosiy manbai bo'lgan 2/3-qatlamlarda keskin oshadi. Shuning uchun biz shRNA ni ushbu rivojlanish avj olishiga mos kelishi uchun taxminan P19 da infuziya qildik. Biz Crh mRNK ekspressiyasini miqdoriy baholash uchun in situ gibridizatsiyadan foydalanib nokdaunni tasdiqladik. Anti-Crh shRNA va mCherry ni birga ekspressiya qiluvchi vmPFC CRH+ hujayralari skremlibl nazoratni ekspressiya qiluvchi mCherry+ hujayralarga nisbatan Crh belgisi intensivligining sezilarli darajada pasayishini ko'rsatdi (Rasm SN 3a). Biz har bir sichqonda gistologiya yordamida virusli hududiy nishonga olishni tasdiqladik (Rasm SN 3b).&lt;/p&gt;\n&lt;p&gt;Yoshlik davridan boshlab vmPFC da Crh ekspressiyasini kamaytirish o'smir sichqonlarning PMA ni o'rganish qobiliyatiga ta'sir qilmadi (Rasm 2e). Biroq, SR nazoratlarida vmPFC ga xos Crh nokdauni muzlashga ta'sir qilmasdan, platformada o'tkazilgan vaqtning sezilarli darajada oshishiga va tovush paytida platformaga kirish latent davrining kamayishiga olib keldi (Rasm 2f-h). Ushbu natijalar vmPFC dagi CRH darajasining ontogenetik kamayishi o'smirlik davrida ELA ga o'xshash xulq-atvorni fenokopiya qilishini ko'rsatadi. Biz LBN guruhida eslab qolish paytida qochishning o'zgarishini kuzatmadik (Rasm 2f-h), bu LBN bir xil mexanizmni ishga tushirish orqali Crh nokdaunining ta'sirini to'sib qo'yishi mumkinligini bildiradi. LBN sichqonlari nazoratga qaraganda ko'proq muzlashga moyil edi, lekin bu Crh nokdaunidan sezilarli darajada ta'sir qilmadi (Rasm 1h). Muhimi shundaki, rivojlanishdagi Crh nokdauni ko'tarilgan xochsimon labirintda yoki ochiq maydon testlarida xavotirsimon xulq-atvorga ta'sir qilmadi (Rasm SN 3c-j), bu CRH ning tug'ma emas, balki o'rganilgan tahdidlardan qochishni tartibga solishdagi rolini ta'kidlaydi. CRH populyatsiyalarining miya bo'ylab tahlili bilan birgalikda (Rasm 2), bu natijalar ELA tufayli kelib chiqqan vmPFC dagi CRH ekspressiyasining rivojlanishdagi pasayishi o'smirlik davrida tahdidlardan kuchaytirilgan qochishga yordam berishini ko'rsatadi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en-f1.jpg\" alt=\"1-rasm. ELA o‘smirlarda xavfdan qochish xatti-harakatini va uning asosiy BLA faolligini kuchaytiradi. (a) LBN protokoli.\" /&gt;&lt;/p&gt;\n&lt;p&gt;*1-rasm. ELA o‘smirlarda xavfdan qochish xatti-harakatini va uning asosiy BLA faolligini kuchaytiradi. (a) LBN protokoli. (b) LBN va standart parvarishlash (SR) davrida ona xatti-harakatlarining taqsimoti (SR, n=4; LBN, n=6 ona) (Xi-kvadrat testi ꭓ2(4,27), p&amp;lt;0.0001). (c) Onalar uyada o‘tkazadigan vaqtning foizi (juftlanmagan t-test F3,5=6.51, p=0.028). (d) Tug‘ilgandan keyingi (P)12, P21, P35 kunlardagi bolalarning vazni (SR, n=16 bola/4 nasl, LBN, n=15 bola/6 nasl; Bonferroni post-hoc testi bilan takroriy o‘lchovli ikki omilli ANOVA: yosh effekti F1.51,43.92 = 736.4, P&amp;lt;0.0001; parvarish effekti F1,29 = 3.53, P=0.071; o‘zaro ta’sir F1.51,43.92 = 0.1949, P = 0.762, skripka diagrammalari mediana va kvartillarni ko‘rsatadi). (e) Platforma yordamida qochish (PMA) protokoli. (f) 3 ta tovush binlari bo‘yicha o‘rtacha hisoblangan muvaffaqiyatli urinishlar ulushi (SR, n=18; LBN, n=19 sichqon; Sidak post-hoc testi bilan takroriy o‘lchovli ikki omilli ANOVA: urinish effekti F2.29,80.10 = 40.84, P&amp;lt;0.0001; parvarish effekti F1,35 = 0.22, P=0.645; o‘zaro ta’sir F2.29,80.10 = 0.55, P = 0.605). (g) PMA tiklash paytida issiqlik xaritalari sifatida ko‘rsatilgan sichqonlar joylashuvining vakillik namunalari. (h) Tiklash paytida tovush vaqtida platformadagi o‘rtacha vaqt ulushi (juftlanmagan t-test F17,18=1.71, P=0.006). (i) Tiklash paytida tovush vaqtida qotib qolgan o‘rtacha vaqt ulushi (juftlanmagan t-test F17,18=2.32, p=0.888). (j-t) PMA o‘qitish va tiklash davrida BLAda tola fotometriyasi yozuvlari (SR, n=8; LBN, n=5 sichqon). (j) GCaMP6s ekspressiyasining sxematik va namuna tasvirlari va BLAda optik tola implantati. (k) Tola fotometriyasi hayvonlarini PMA o‘qitish paytida muvaffaqiyatli urinishlar ulushi (SR, n=8; LBN, n=5 sichqon) (2-faktorli ANOVA: urinish effekti F1,11=30.09, P=0.0002; parvarish effekti F1,12=0.09, P=0.77; o‘zaro ta’sir effekti F1,11=1.45, P=0.254). (l) Fotometriya hayvonlarini PMA tiklash paytida platformadagi vaqt ulushi (juftlanmagan t-test F7,4=8.10, P=0.016). (m) Sichqoncha PMA o‘qitish paytida zarba olgan tovush davrlarida BLA faolligidagi floresansning o‘rtacha o‘zgarishi (z-ball). (n) Zarba va undan keyingi 13 soniya davomida egri chiziq ostidagi maydonni (AUC) miqdoriy baholash (juftlanmagan t-test F4,7=1.07, P=0.024). (o) Zarba paytida cho‘qqi floresansini miqdoriy baholash (juftlanmagan t-test F7,4=5.10, P=0.829). (p) Zarbadan keyin boshlang‘ich darajaga qaytishga moslashtirilgan eksponensial egri chiziqning pasayish tezligini (soniyalarda) miqdoriy baholash (juftlanmagan t-test F4,7=33.56, P=0.0026). (q) Sichqoncha platformadan tashqarida bo‘lganida tovush boshlanishiga javoban BLA faolligidagi floresansning o‘rtacha o‘zgarishi (z-ball). (r) Tovush boshlanganidan keyingi 3 soniya ichida AUCni miqdoriy baholash (juftlanmagan t-test F4,7=4.36, P=0.037). (s) Tovush boshlanganidan keyingi 3 soniya ichida cho‘qqi javobini miqdoriy baholash (juftlanmagan t-test F4,7=5.06, P=0.092). (t) AUC va tovush paytida platformadagi vaqt ulushi o‘rtasidagi korrelyatsiya (chiziqli regressiya SR: F1,6=1.44, P=0.276, LBN: F1,3=66.41, P=0.004). Barcha ma'lumotlar nuqtalari biologik takroriyliklarni bildiradi. Ma'lumotlar o‘rtacha ± standart xato sifatida ko‘rsatilgan va soyalanish subyektlar orasidagi standart xatoni aks ettiradi; *P&amp;lt;0.05, *&lt;em&gt;P&amp;lt;0.01. Uchburchaklar urg‘ochilarni, doiralar erkaklarni bildiradi.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"ela-qochish-paytida-uzoq-masofali-vmpfc-crh-bla-yolining-faollashuvini-kuchaytiradi\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#ela-qochish-paytida-uzoq-masofali-vmpfc-crh-bla-yolining-faollashuvini-kuchaytiradi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ELA qochish paytida uzoq masofali vmPFC CRH+ → BLA yo'lining faollashuvini kuchaytiradi&lt;/span&gt;&lt;/a&gt;ELA qochish paytida uzoq masofali vmPFC CRH+ → BLA yo'lining faollashuvini kuchaytiradi&lt;/h4&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Nokdaun — bu ma'lum bir gen (bu holda Crh) ekspressiyasini interferentsiya qiluvchi RNKlar yordamida pasaytirish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;vmPFC dagi ko'plab CRH ekspressiya qiluvchi hujayralar uzoq masofali proyeksiya nishonlaridagi faoliyatni bevosita modulyatsiya qilmaydigan mahalliy interneyronlar hisoblanadi. Shunday qilib, BLA ga proyeksiya qiluvchi uzoq masofali CRH+ neyronlari mavjudligini aniqlash uchun biz CRH-Cre sichqonlarining BLA ga Cre-bog'liq GFP ni ekspressiya qiluvchi retrograd AAV yubordik, bu BLA ni innervatsiya qiluvchi CRH+ hujayralarning flüoresan markalanishiga olib keldi (Rasm 3a-c, Rasm SN 4a). Biz CRH+ BLA ga proyeksiya qiluvchi hujayralarni dorsomedial PFC (dmPFC), piriform qobiq (PIR), ectorhinal qobiq (ECT) va vaqtinchalik assotsiatsiya hududlarida (TEa), ayniqsa talamusning paraventrikulyar yadroida (PVT) va vmPFC da kuzatdik (Rasm 3d).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en-f3.jpg\" alt=\"3-rasm. ELA vmPFCCRH+→BLA yo'lini kuchaytiradi. (a) O'smir yoshdagi sichqonlarda PMA treningi davomida BLA ga proyeksiya\" /&gt;&lt;/p&gt;\n&lt;p&gt;*3-rasm. ELA vmPFCCRH+→BLA yo'lini kuchaytiradi. (a) O'smir yoshdagi sichqonlarda PMA treningi davomida BLA ga proyeksiya qiluvchi faollashgan CRH+ hujayralar sonini aniqlash uchun eksperimental vaqt jadvali. (b) BLA ga proyeksiya qiluvchi CRH+ hujayralarini belgilash va cFos ekspresiyasini baholash uchun virusli strategiya sxemasi. (c) PMA treningi davomida muvaffaqiyatli urinishlar ulushi (SR, n= 6, LBN, n=7 sichqon) (ikki tomonlama ANOVA: urinish effekti F1,11=30.09, P=0.0002; parvarish effekti F1,12=0.09, P=0.77; o'zaro ta'sir effekti F1,11=1.45, P=0.254). (d) Dorsomedial prefrontal qobiqda (dmPFC), vmPFC, piriform qobiqda (PIR), talamusning paraventrikulyar yadrosida (PVT), ectorhinal qobiqda (ECT) va vaqtinchalik assotsiatsiya sohasida (TEa) BLA ga proyeksiya qiluvchi retrograd tarzda belgilangan CRH+ ning namuna tasvirlari va miqdoriy bahosi (ikki tomonlama ANOVA: hudud effekti F2.46,22.2=48.19, p&amp;lt;0.0001; parvarish effekti F1,9=0.092, p=0.769; o'zaro ta'sir effekti F2.46,22.2=2.18, p=0.128). (e) vmPFC da retrograd tarzda belgilangan CRH+ hujayralari (yashil), Fos+ hujayralari (to'q qizil) va birlashtirilgan tasvirlar hamda GFP+ hujayralar sonini (juftlanmagan t-test F6,5=1.47, P=0.175), Fos+ hujayralar sonini (juftlanmagan t-test F6,5=1.91, P=0.177) va GFP+/Fos+ hujayralar foizini miqdoriy baholash (juftlanmagan t-test F6,5=2.39, P=0.016). (f) SR va LBN sichqonlarida Vgat+ (sariq), Vglut+ (to'q qizil), vmPFCCRH+→BLA hujayralari (yashil) va birlashtirilgan tasvir namunalari hamda SR va LBN sichqonlari bo'yicha umumlashtirilgan faqat Vglut+ bo'lgan vmPFCCRH+→BLA hujayralari foizini miqdoriy baholash (SR, n=34 hujayra/5 sichqon; LBN, n=62 hujayra/7 sichqon). (g,h) vmPFCCRH+→BLA yo'lining sinaptik bog'liqligini fiziologik tekshirish (SR, n=6 hujayra/4 sichqon; LBN, n=8 hujayra/5 sichqon). (g) CRH+ vmPFC hujayralariga AAV-DIO-ChR2 infeksiyalash sxemasi va BLA da patch-clamp qayd etish konfiguratsiyasi. (h) SR va LBN sichqonlarining BLA asosiy hujayralarida qayd etilgan reprezentativ vmPFCCRH+-evokatsiya qilingan EPSC (Vm = -70 mV) va IPSC (Vm = 0 mV) hamda optogenetik tarzda evokatsiya qilingan qo'zg'atuvchi postsynaptik oqim (oEPSC) amplitudasini miqdoriy baholash (Uelch t-testi F7,5=5.38, P=0.0220). (i) SR va LBN sichqonlarining vmPFC da Crh (yashil) va Vglut1 (to'q qizil) ekspresiyasi namunalari (SR, n= 5, LBN, n=7 sichqon) va Vglut1+ ni ham ekspresiya qiluvchi CRH+ hujayralar sonini miqdoriy baholash (juftlanmagan t-test F5,7=2.41, P=0.800) hamda Vglut1+ hujayralarida Crh ekspresiyasi intensivligi (juftlanmagan t-test F6,4=1.77, P=0.049). (j) SR va LBN sichqonlarining vmPFC da Crh (yashil) va Vglut1 (to'q qizil) ekspresiyasi namunalari va Vglut1 ni ekspresiya qilmaydigan CRH+ hujayralar sonini miqdoriy baholash (juftlanmagan t-test F5,7=2.14, P=0.029) hamda Vglut1 hujayralarida Crh ekspresiyasi intensivligi (juftlanmagan t-test F5,7=3.67, P=0.836). Barcha ma'lumotlar nuqtalari biologik takrorlarni bildiradi. Ma'lumotlar o'rtacha ± standart xato sifatida ko'rsatilgan; &lt;em&gt;P&amp;lt;0.05. Uchburchaklar urg‘ochi, doiralar erkak jinsidagilarni bildiradi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Keyinchalik biz ELA PMA paytida BLA ga proyeksiya qiluvchi vmPFC CRH+ neyronlarining faollashuviga ta'sir qilishini o'rgandik. Biz PMA mashg'ulotidan keyin retrograd markalangan vmPFC CRH+ → BLA neyronlarida yaqinda faollashgan neyronlar markeri bo'lgan darhol erta Fos genining ekspressiyasini o'lchadik (Rasm 3e). Retrograd markalangan vmPFC CRH+ hujayralarining aksariyati 2/3-qatlamlarda joylashgan bo'lib (Rasm SN 4b,c), bu BLA ga proyeksiya qiluvchi vmPFC hujayralarining umumiy populyatsiyasining qatlam taqsimotiga mos keladi. Biz retrograd markalangan GFP+ hujayralar sonida yoki vmPFC ichidagi umumiy Fos ekspressiyasida farq kuzatmadik (Rasm 3e). Biroq, LBN sichqonlarida GFP+ vmPFC CRH+ → BLA neyronlarining sezilarli darajada katta qismi Fos ekspressiyasini ko'rsatdi, bu ularning SR nazoratlariga nisbatan PMA mashg'uloti davomida ko'proq faollashganini ko'rsatadi (Rasm 3e). Biz aniqlagan boshqa BLA ga proyeksiya qiluvchi CRH+ populyatsiyalarida stress keltirib chiqaradigan PMA ga bog'liq Fos ekspressiyasi farqlarini kuzatmadik (Rasm SN 5a-d). Umumiy holda, ushbu topilmalar vmPFC CRH+ → BLA zanjiridagi yuqori faollik ELA ni boshdan kechirgan o'smir sichqonlarda tahdidlardan qochishning kuchayishiga yordam berishi mumkinligini ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tajribalar kemiruvchilar (sichqonlar) modellarida o'tkazilgan, shuning uchun odamlarga bevosita ekstrapolyatsiya qilish ehtiyotkorlikni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ela-glutamaterjik-vmpfc-crhbla-yolini-kuchaytiradi\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#ela-glutamaterjik-vmpfc-crhbla-yolini-kuchaytiradi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ELA glutamaterjik vmPFC CRH+→BLA yo'lini kuchaytiradi&lt;/span&gt;&lt;/a&gt;ELA glutamaterjik vmPFC CRH+→BLA yo'lini kuchaytiradi&lt;/h4&gt;\n&lt;p&gt;Uzoq masofaga proyeksiya qiluvchi CRH+ hujayralar populyatsiyalari haqidagi ma'lumotlar cheklangan bo'lib, deyarli barcha tadqiqotlarda ularning tormozlovchi neyromediator gamma-aminomoy kislotasi (GAMK) bilan birgalikda ekspressiya qilinishi haqida xabar berilgan. vmPFC CRH+→BLA hujayralari asosan glutamaterjik yoki GAMK-ergik ekanligini aniqlash uchun biz vezikulyar glutamat transporter 1 (Vglut1) va vezikulyar GAMK transporter (Vgat) mRNKlarining ekspressiyasini o'rganish maqsadida retrograd virusli markerlashni in situ gibridizatsiyasi bilan birlashtirdik (Rasm 3f). Guruhlar bo'ylab barcha virus bilan belgilangan neyronlar Vglut1 ni ekspressiya qildi, bu esa vmPFC CRH+→BLA proyeksiya neyronlari glutamaterjik ekanligini ko'rsatadi (Rasm 3f).&lt;/p&gt;\n&lt;p&gt;Shundan so'ng biz vmPFC CRH+→BLA yo'li glutamaterjik ekanligini tasdiqlash hamda erta hayotdagi noqulay sharoitlar (LBN) sinaptik uzatish kuchiga ta'sir qilishini aniqlash uchun kanalrodopsin (ChR2) yordamida zanjirlarni xaritalash usulidan foydalandik. Biz LBN yoki SR CRH-Cre sichqonlarining vmPFC qismiga cre-bog'liq AAV-ChR2 yubordik. Virus ekspressiyasi uchun ikki hafta vaqt berilgandan so'ng, o'smirlik davrida (P33-36) har ikki guruhdan o'tkir miya kesmalarini tayyorladik. Bazolateral amygdala (BLA) asosiy neyronlarida butun hujayra patch-klamp yozuvlaridan foydalanib (Rasm 3g), neyronlarni mos ravishda -70 mV yoki 0 mV da ushlab turgan holda, BLA ichidagi vmPFC CRH+ akson terminallarini optogenetik stimulyatsiya qilish orqali qo'zg'atuvchi va tormozlovchi postsynaptik oqimlarni (EPSCs va IPSCs) o'lchadik (Rasm 3h). Hech bir guruhda IPSCs kuzatilmadi, ammo optogenetik tarzda qo'zg'atilgan EPSCs amplitudasi SR nazorat guruhiga nisbatan LBN sichqonlarida sezilarli darajada yuqori edi (Rasm 3h). Gistologiya virusning aniq nishonga olinganligini tasdiqladi (Rasm SN 6a). Ushbu topilmalar ELA vmPFC CRH+ afferentlaridan BLA asosiy neyronlariga keladigan qo'zg'atuvchi signallarni kuchaytirishini ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ELA vmPFC CRH+→BLA yo'lida glutamaterjik signal uzatilishini kuchaytiradi va Crh ekspressiyasini oshiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ELA ning o'smirlik davrida vmPFC Crh ekspressiyasiga qanday ta'sir qilishini kengroq baholash uchun biz CRH+ Vglut1+ va Vglut1- hujayralari sonini, shuningdek, ushbu hujayralar ichidagi Crh ekspressiya darajasini aniqladik. LBN Crh ekspreressiya qiluvchi Vglut1⁺ neyronlar soniga ta'sir qilmadi, ammo SR nazoratiga nisbatan Crh ekspressiyasining oshishiga olib keldi (Rasm 3i). Aksincha, asosan GAMK-ergik interneyronlarni o'z ichiga olgan Vglut1⁻ neyronlar Crh ekspreressiya qiluvchi hujayralar sonining sezilarli darajada kamayganini ko'rsatdi, ammo Crh ekspressiya darajasida o'zgarish kuzatilmadi (Rasm 3j). Butun miya tahlilida kuzatilgan vmPFC CRH⁺ hujayralarining umumiy sonining kamayishi bilan birgalikda, bu topilmalar LBN keltirib chiqaradigan CRH+ hujayralarining kamayishi faqat GAMK-ergik neyronlarga xos bo'lishi mumkinligini ko'rsatadi. Bundan farqli o'laroq, ELA dan keyin glutamaterjik neyronlarda Crh ekspressiyasining oshishi BLA da quyi oqim faolligining kuchayishiga yordam berishi va oxir-oqibat o'smirlik davrida yuqori darajadagi qochish xulq-atvorini rag'batlantirishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Olingan natijalar asosan hayvonlar modeli asosida olingan bo'lib, ularni insonlarga to'g'ridan-to'g'ri ko'chirishda ehtiyotkorlik talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vmpfccrh-bla-osmir-lbn-hayvonlarida-tahdidlardan-qochishning-kuchayishini-taminlaydi\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#vmpfccrh-bla-osmir-lbn-hayvonlarida-tahdidlardan-qochishning-kuchayishini-taminlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;vmPFCCRH+ →BLA o'smir LBN hayvonlarida tahdidlardan qochishning kuchayishini ta'minlaydi&lt;/span&gt;&lt;/a&gt;vmPFCCRH+ →BLA o'smir LBN hayvonlarida tahdidlardan qochishning kuchayishini ta'minlaydi&lt;/h4&gt;\n&lt;p&gt;Avvalgi tadqiqotlar shuni ko'rsatdiki, hayotning erta davridagi stressdan (ELA) so'ng markaziy amygdala CRH hujayralarining yuqori faolligi ELA tarixi bo'lgan sichqonlarda tahdidga nisbatan kuchaygan reaktivlik va anhedoniyani keltirib chiqaradi, bu CRH hissiy xatti-harakatlardagi doimiy o'zgarishlarni keltirib chiqaradigan asosiy stressga sezgir yo'llarni belgilashini ko'rsatadi. vmPFCCRH+→BLA hujayralari LBN sichqonlarida PMA mashg'ulotlari paytida kuchaygan Fos ekspressiyasini, glutamatergik neyrotransmissiyaning kuchayishini va Crh ekspressiyasining ortishini ko'rsatishini hisobga olib, biz ushbu yo'l o'smir LBN sichqonlarida tahdidlardan qochishning kuchayishi uchun zarur ekanligini va agar shunday bo'lsa, uning roli yetuk yoshga ham tarqalishini tekshirdik. Buning uchun biz CRH-cre sichqonlarining vmPFC qismiga kre-bog'liq inhibe qiluvchi opsin yoki nazorat ftoroforini kiritdik va BLA ustiga ikki tomonlama tola o'rnatdik (Rasm 4a). Ikki hafta o'tgach, biz o'smirlar yoki kattalarda PMA mashg'ulotlari davomida, xususan, tok urishi davrida va u tugaganidan keyin 13 soniya davomida vmPFCCRH+→BLA yo'lini optogenetik tarzda inhibe qilish uchun ko'k lazer (473 nm, uzluksiz) qo'lladik (Rasm 4b). Ushbu vaqt oralig'i BLA faolligi shu davrda yuqori bo'lishi haqidagi topilmalarimiz asosida tanlandi (Rasm 1m,n). Barcha hayvonlarda virusning to'g'ri ekspressiyasi va tolaning joylashuvi tasdiqlandi (Rasm 4c; Rasm SN 6b,c).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en-f4.jpg\" alt=\"4-rasm. vmPFC-CRH+ → BLA yo‘lining tormozlanishi o‘smirlarda ELA keltirib chiqaradigan qochish xulq-atvorini kamaytiradi\" /&gt;&lt;/p&gt;\n&lt;p&gt;*4-rasm. vmPFC-CRH+ → BLA yo‘lining tormozlanishi o‘smirlarda ELA keltirib chiqaradigan qochish xulq-atvorini kamaytiradi, ammo kattalarda emas. (a) O‘smirlar va kattalar guruhlari uchun eksperimental vaqt jadvali. (b) O‘qitish davomida tok urishi davrida va tok urishidan keyin 13 soniya davomida doimiy lazer stimulyatsiyasi bilan PMA ning sxematik tasviri (Adol. SR cont., n=12; SR PdCO n=12; LBN cont., n=15, LBN PdCO, n=17; Adult SR cont., n=5; SR PdCO n=7; LBN cont., n=8, LBN PdCO, n=7 sichqonlar). (c) CRH-Cre sichqonlarining BLA qismida AAV-DIO-PdCO ekspressiyasi va ikki tomonlama tola-optik implantlarining sxemasi va namuna tasvirlari. (d) Tok urishigacha bo‘lgan boshlang‘ich daraja va seansning so‘nggi to‘rtta toni uchun o‘rtacha hisoblangan PMA mashg‘uloti davomida o‘smirlardagi muvaffaqiyatli urinishlar ulushi (uch omilli dispersiya tahlili: urinish effekti F1,52=91,51, P&amp;lt;0,0001; parvarish effekti F1,52=1,74, P=0,193; opsin effekti F1,52=0,86, P=0,360; urinish x parvarish effekti F1,52=0,062, P=0,804; urinish x opsin effekti F1,52=0,028, P=0,869; parvarish x opsin effekti F1,52=0,0031, P=0,956; urinish x parvarish x opsin F1,52=0,25, P=0,620). (e-g) PMA ni eslab qolish davridagi xulq-atvor ko‘rsatkichlari. (e) Seans davomida o‘rtacha hisoblangan platformadagi vaqt ulushi (Tuky post-hoc testi bilan ikki omilli dispersiya tahlili: parvarish effekti F1,52=2,88, P=0,10; opsin effekti F1,52=4,98, P=0,03; o‘zaro ta’sir effekti F1,52=8,95, P=0,004). (f) Ton boshlanganidan keyin platformaga kirish kechikishi (Tuky post-hoc testi bilan ikki omilli dispersiya tahlili: parvarish effekti F1,52=0,029, P=0,867; opsin effekti F1,52=3,56, P=0,065; o‘zaro ta’sir effekti F1,52=10,20, p=0,0024). (g) Ton davomida qotib qolish vaqti ulushi (Tuky post-hoc testi bilan ikki omilli dispersiya tahlili: parvarish effekti F1,52=9,47, P=0,0033; opsin effekti F1,52=2,33, P=0,133; o‘zaro ta’sir effekti F1,52=0,0026, P=0,960). (h) Tok urishigacha bo‘lgan boshlang‘ich daraja va seansning so‘nggi to‘rtta toni uchun o‘rtacha hisoblangan PMA mashg‘uloti davomida kattalardagi muvaffaqiyatli urinishlar ulushi (uch omilli dispersiya tahlili: urinish effekti F1,46=52,40, P&amp;lt;0,0001; parvarish effekti F1,46=0,21, P=0,652; opsin effekti F1,46=0,49, P=0,489; urinish x parvarish effekti F1,46=0,09, P=0,765; urinish x opsin effekti F1,46=1,93, P=0,171; parvarish x opsin effekti F1,46=1,28, P=0,264; urinish x parvarish x opsin F1,46=0,14, P=0,709). (i-k) PMA ni eslab qolish davridagi xulq-atvor ko‘rsatkichlari. (i) Seans davomida o‘rtacha hisoblangan platformadagi vaqt ulushi (ikki omilli dispersiya tahlili: parvarish effekti F1,23=0,56, P=0,460; opsin effekti F1,23=0,07, P=0,788; o‘zaro ta’sir effekti F1,23=0,01, P=0,921). (j) Ton boshlanganidan keyin platformaga kirish kechikishi (ikki omilli dispersiya tahlili: parvarish effekti F1,23=0,052, P=0,822; opsin effekti F1,23=1,16, P=0,293; o‘zaro ta’sir effekti F1,23=0,125, P=0,27). (k) Ton davomida qotib qolish vaqti ulushi (ikki omilli dispersiya tahlili: parvarish effekti F1,23=2,72, P=0,113; opsin effekti F1,23=0,356, P=0,557; o‘zaro ta’sir effekti F1,23=2,16, P=0,156). Barcha ma'lumotlar nuqtalari biologik takrorlarni bildiradi. Ma'lumotlar o‘rtacha ± o‘rtachaning standart xatosi sifatida ko‘rsatilgan; *P&amp;lt;0,05, **P&amp;lt;0,01, **&lt;em&gt;P&amp;lt;0,001. Uchburchaklar urg‘ochi, doiralar erkak jinsini bildiradi.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LBN o'smirlarida vmPFCCRH+→BLA yo'lini inhibe qilish o'qitish yoki qotib qolishga ta'sir qilmasdan PMA ni eslab qolish paytida tahdidlardan qochishni kamaytiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;pmPFCCRH+→BLA ning inhibe qilinishi o'smir sichqonlarning PMA ni o'rganish qobiliyatiga ta'sir qilmadi (Rasm 4d). Biroq, PMA ni eslab qolish vaqtida, optogenetik manipulyatsiyasiz, LBN ni boshdan kechirganlar tokni bashorat qiluvchi ovoz davrida tahdidlardan qochishning sezilarli darajada kamayishini ko'rsatdi (Rasm 4e). Ushbu farq ovoz boshlanganda xavfsizlik platformasiga kirish uchun latent davrning uzayishi bilan bog'liq edi (Rasm 4f), shu bilan birga qotib qolish xatti-harakatiga hech qanday ta'sir ko'rsatmadi (Rasm 4g). Kattalardagi xuddi shuda manipulyatsiya na PMA o'rganishiga (Rasm 4h), na keyingi kundagi eslab qolishga ta'sir qilmadi (Rasm 4i-k). Shunday qilib, vmPFCCRH+→BLA yo'lining kuchaygan faolligi o'smirlik davrida, lekin keyinchalik hayotda emas, kuchaytirilgan tahdid qochishini ta'minlaydi. vmPFC→BLA yo'lining keng inhibatsiyasi ham o'smir LBN sichqonlarida qochish xatti-harakatining sezilarli darajada kamayishiga olib keldi (Rasm SN 7a-g). Bu shuni ko'rsatadiki, keng vmPFC→BLA yo'li o'smir LBN sichqonlarida tahdidlardan qochishning kuchayishiga hissa qo'shsa-da, faqat CRH+ kichik to'plamini nishonga olishning o'zi bu ta'sirni keltirib chiqarish uchun yetarli.&lt;/p&gt;\n&lt;p&gt;Keyinchalik biz SR nazorat guruhlarida vmPFCCRH+→BLA yo'lini rag'batlantirish o'smirlik davrida tahdidlardan qochish xatti-harakatiga LBN ga o'xshash ta'sirlarni keltirib chiqarishi mumkinligini tekshirdik. Biz vmPFC ga kre-bog'liq qo'zg'atuvchi opsin kiritdik va BLA ustiga ikki tomonlama tolalar o'rnatdik (Rasm SN 8a,b). PMA mashg'ulotlari davomida, yana tok urishi davrida va undan keyin ushbu yo'lni optogenetik tarzda rag'batlantirish uchun ko'k lazer impulslarini (473 nm, 50 ms, 15 Hz) berdik (Rasm SN 8c). Biz PMA ni o'rganish qobiliyatida (Rasm SN 8d) yoki keyingi kundagi eslab qolish paytida qochish darajasida (Rasm SN 8e-g) guruhlar o'rtasida farqlarni kuzatmadik. Ushbu yo'l SR sichqonlarida BLA da kichik EPSClarni keltirib chiqarishi haqidagi topilmamiz bilan birgalikda, bu vmPFCCRH+→BLA yo'li SR sichqonlarida quyi oqimdagi BLA faolligiga va tahdidlardan qochishga minimal ta'sir ko'rsatishini ko'rsatadi. Qolaversa, ushbu topilmalar shuni ko'rsatadiki, o'smirlik davrida yo'l faolligining o'tkir o'sishidan farqli o'laroq, erta yuzaga keladigan rivojlanish zanjiri plastikligi LBN dan keyin tahdidlardan qochishning kuchayishiga yordam berishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RTPP testi — hayvonlarning yorug'lik yoki boshqa stimullar ta'sir qiladigan kamera qismlarini afzal ko'rishini yoki ulardan qochishini o'lchaydigan usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;pmPFCCRH+→BLA yo'lini rag'batlantirish yoki inhibe qilish tug'ma ravishda mukofotlovchi yoki aversiv ekanligini aniqlash uchun biz real vaqtda joy afzalligi (RTPP) tushunchasini sinovdan o'tkazdik, bunda kameraning bir tomoni ushbu yo'lni optogenetik manipulyatsiya qilish bilan birlashtirildi. vmPFCCRH+→BLA yo'lini faollashtirish lazer bilan bog'langan kameradan sezilarli darajada qochishni keltirib chiqarmadi (Rasm SN 8h,i). Xuddi shu manipulyatsiya 30 soniyali lazer stimulyatsiyasini navbatga qo'yganimizda 10 daqiqalik ochiq maydon sinovi davomida tashvishga o'xshash xatti-harakatga ham ta'sir qilmadi (Rasm SN 8j-l). Xuddi shunday, vmPFCCRH+→BLA yo'lini inhibe qilish ham o'smirlarda RTPP yoki ochiq maydon sinovlari paytida ta'sir ko'rsatmadi (Rasm SN 9a-e). Biz kattalarda ham asosan o'xshash natijalarni kuzatdik (Rasm SN 9f-i), faqat ochiq maydon sinovida inhibisyondan keyin harakatlanish kamayganligi bundan mustasno (Rasm SN 9j). Umuman olganda, ushbu topilmalar vmPFCCRH+→BLA yo'li o'rganilgan tahdidlardan qochish xatti-harakatida o'ziga xos rol o'ynashini va tug'ma nafratni keltirib chiqarmasligini ko'rsatadi.&lt;/p&gt;\n&lt;h4 id=\"vmpfcvglut1-neyronlarida-crh-ekspressiyasi-lbn-keltirib-chiqaradigan-kuchaygan-qochish-xulq-atvori-uchun-zarur\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#vmpfcvglut1-neyronlarida-crh-ekspressiyasi-lbn-keltirib-chiqaradigan-kuchaygan-qochish-xulq-atvori-uchun-zarur\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;vmPFCVGLUT1 neyronlarida Crh ekspressiyasi LBN keltirib chiqaradigan kuchaygan qochish xulq-atvori uchun zarur&lt;/span&gt;&lt;/a&gt;vmPFCVGLUT1 neyronlarida Crh ekspressiyasi LBN keltirib chiqaradigan kuchaygan qochish xulq-atvori uchun zarur&lt;/h4&gt;\n&lt;p&gt;Bizning optogenetik tajribalarimiz shuni ko'rsatadiki, vmPFC^CRH→BLA yo'lidagi faollik LBN ta'siriga uchragan o'smir sichqonlarda kuchaygan qochish uchun zarurdir. Biroq, bu manipulyatsiya ham glutamat, ham CRH ajralishiga ta'sir qilishi mumkin. LBN keltirib chiqaradigan o'smirlik davridagi qochishning ortishi va BLA faolligining tegishli o'zgarishlari uchun CRH signallari kerakmi va qachon kerakligini aniqlash maqsadida biz VGLUT1-Cre sichqonlarining vmPFC qismiga CRH ga qarshi qaratilgan Cre-ga bog'liq shRNA yubordik. Ushbu strategiya vmPFC^CRH→BLA yo'lini tashkil etuvchi qo'zg'atuvchi vmPFC neyronlarida CRH ni tanlab kamaytiradi. O'smir sichqonlarga P19–P21 yoshida, kattalarga esa P45–47 yoshida jarrohlik amaliyoti bajarildi. Ikki hafta o'tgach, sichqonlar PMA o'qitish va eslab qolish jarayonidan o'tdi, shundan so'ng BLA da Fos ekspressiyasini baholash uchun perfuziya qilindi (Rasm 5a). Barcha hayvonlarda virusning to'g'ri ekspressiyasi tasdiqlandi (Rasm SN 10a,b).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en-f5.jpg\" alt=\"5-rasm. vmPFC→BLA yo'lida Crh ekspresiyasining pasayishi o'smirlarda ELA keltirib chiqaradigan kuchaygan qochish va BLA \" /&gt;&lt;/p&gt;\n&lt;p&gt;*5-rasm. vmPFC→BLA yo'lida Crh ekspresiyasining pasayishi o'smirlarda ELA keltirib chiqaradigan kuchaygan qochish va BLA faolligini zaiflashtiradi, lekin kattalarda emas. (a) O'smirlarda vmPFCVGLUT1+ hujayralarida Crh ekspresiyasining AAV-shRNA nokdauni bo'yicha eksperimental vaqt jadvali va tasviri (SR: scramble, n=4; shRNA, n=6; LBN: scramble, n=8, shRNA, n=7 sichqon). (b) Shokgacha bo'lgan baza darajasi va seansning so'nggi to'rtta toni uchun o'rtacha hisoblangan PMA mashg'uloti davomidagi muvaffaqiyatli urinishlar ulushi (uch omilli ANOVA: urinish effekti F1,23=21,25, P=0,0001; parvarish effekti F1,23=0,093, P=0,764; nokdaun effekti F1,23=2,99, P=0,097; urinish x parvarish effekti F1,23=1,41, P=0,247; urinish x nokdaun effekti F1,23=0,067, P=0,800; parvarish x nokdaun effekti F1,23=0,68, P=0,417; urinish x parvarish x nokdaun effekti F1,23=0,32, p=0,576). (c-e) PMA ni tiklash davridagi xulq-atvor ko'rsatkichlari. (c) Seans davomida o'rtacha hisoblangan platformadagi vaqt ulushi (Tukey post-hoc testi bilan ikki omilli ANOVA: nokdaun effekti F1,23=1,42, P=0,246; parvarish effekti F1,23=7,16, P=0,014; o'zaro ta'sir effekti F1,23=4,68, P=0,041). (d) Ton boshlanishidan keyin platformaga kirish latentligi (Tukey post-hoc testi bilan ikki omilli ANOVA: nokdaun effekti F1,23=0,02, P=0,889; parvarish effekti F1,23=6,53, P=0,018; o'zaro ta'sir effekti F1,23=2,06, P=0,164). (e) Seans davomida o'rtacha hisoblangan qotib qolish vaqti ulushi (ikki omilli ANOVA: nokdaun effekti F1,23=1,48, P=0,237; parvarish effekti F1,23=1,31, P=0,264; o'zaro ta'sir effekti F1,23=4,95, P=0,036). (f) vmPFCVGLUT1+ hujayralarida Crh nokdaunidan keyin BLA dagi Fos ekspresiyasining namuna tasvirlari. (g) mm2 uchun Fos+ hujayralarini miqdoriy baholash (Tukey post-hoc testi bilan ikki omilli ANOVA: nokdaun effekti F1,23=2,69, P=0,115; parvarish effekti F1,23=16,33, P=0,0005; o'zaro ta'sir effekti F1,23=4,31, P=0,049). (h) Kattalarda vmPFCVGLUT1+ hujayralarida Crh ekspresiyasining AAV-shRNA nokdauni bo'yicha eksperimental vaqt jadvali va tasviri (SR: scramble, n=4; shRNA, n=5; LBN: scramble, n=7, shRNA, n=10 sichqon). (i) Shokgacha bo'lgan baza darajasi va seansning so'nggi to'rtta toni uchun o'rtacha hisoblangan PMA mashg'uloti davomidagi muvaffaqiyatli urinishlar ulushi (uch omilli ANOVA: urinish effekti F1,40=30,87, P&amp;lt;0,0001; parvarish effekti F1,40=3,22, P=0,0803; nokdaun effekti F1,40=0,033, P=0,856; urinish x parvarish effekti F1,40=3,50, P=0,067; urinish x nokdaun effekti F1,40=0,615, P=0,437; parvarish x nokdaun effekti F1,40=0,40, P=0,530; urinish x parvarish x nokdaun effekti F1,40=0,097, P=0,757). (j-l) PMA ni tiklash davridagi xulq-atvor ko'rsatkichlari. (j) Seans davomida o'rtacha hisoblangan platformadagi vaqt ulushi (ikki omilli ANOVA: nokdaun effekti F1,22=1,61, P=0,293; parvarish effekti F1,22=0,059, P=0,810; o'zaro ta'sir effekti F1,22=0,82, P=0,376). (k) Ton boshlanishidan keyin platformaga kirish latentligi (ikki omilli ANOVA: nokdaun effekti F1,22=3,55, P=0,073; parvarish effekti F1,22=0,092, P=0,765; o'zaro ta'sir effekti F1,22=0,099, P=0,330). (l) Seans davomida o'rtacha hisoblangan qotib qolish vaqti ulushi (ikki omilli ANOVA: nokdaun effekti F1,22=0,15, P=0,707; parvarish effekti F1,22=1,31, P=0,264; o'zaro ta'sir effekti F1,22=1,13, P=0,300). (m) vmPFCVGLUT1+ hujayralarida Crh nokdaunidan keyin BLA dagi Fos ekspresiyasining namuna tasvirlari. (n) mm2 uchun Fos+ hujayralarini miqdoriy baholash (ikki omilli ANOVA: nokdaun effekti F1,22=0,312, P=0,582; parvarish effekti F1,22=0,056, P=0,815; o'zaro ta'sir effekti F1,22=0,186, P=0,670). Barcha ma'lumotlar nuqtalari biologik takroriylikni bildiradi. Ma'lumotlar o'rtacha ± standart xato sifatida ko'rsatilgan; *P&amp;lt;0,05, **P&amp;lt;0,01, **&lt;em&gt;P&amp;lt;0,001. Uchburchaklar urg‘ochi, doiralar erkak jinsini bildiradi.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Rivojlanish davridagi Crh nokdauni LBN guruhidagi sichqonlarda tahdidlardan qochish va BLA faolligining ortishini tanlab kamaytiradi, kattalarga ta'sir qilmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ontogenezdagi Crh nokdauni SR yoki LBN o'smir sichqonlarining shartli qochishni o'zlashtirishiga putur yetkazmadi (Rasm 5b). Eslab qolish davrida Crh nokdauni SR nazorat guruhiga ta'sir qilmadi, lekin LBN sichqonlarida qochishni sezilarli darajada kamaytirdi, bu platformada o'tkazilgan vaqtning qisqarishi bilan o'lchandi (Rasm 5c), bunda kirish latent davri yoki harakatsiz qotib qolish (freezing) o'zgarmadi (Rasm 5d,e). Ushbu xulq-atvor effektlariga mos ravishda, Crh nokdauni BLA da Fos ekspresiyasini kamaytirdi (Rasm 5f,g). Ertangi hayotiy stress (ELA) keltirib chiqaradigan Crh ekspressiyasi o'zgarishlari ayniqsa rivojlanish davrida muhimligini aniqlash uchun kattalar taqqoslash guruhi ham xuddi shunday protseduralardan o'tkazildi (Rasm 5h). Biz SR va LBN kattalar sichqonlari o'rtasida xulq-atvor bo'yicha farqlarni kuzatmadik va Crh nokdauni PMA xulq-atvoriga (Rasm 5i–l) yoki har qanday tarbiyalash guruhidagi BLA Fos ekspressiyasiga ta'sir qilmadi (Rasm 5m,n).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Nokdaun — bu muayyan gen funksiyasini o'rganish uchun interferensiya qiluvchi RNK (shRNA) yordamida ma'lum gen ekspressiyasini sun'iy ravishda kamaytirish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu o'zgarishlarning faqat shartli qochishga xosligini tasdiqlash uchun biz ochiq maydon va ko'tarilgan nol-labirint yordamida xavotirsimon xulq-atvor va harakatchanlikni ham o'lchadik. Ular PMA o'qitilishidan oldin baholandi va biz har qanday tarbiyalash guruhida Crh nokdaunining ta'sirini kuzatmadik (Rasm 5c–h). Umuman olganda, ushbu ma'lumotlar yuvenil va o'smirlik davrlari vmPFC dagi CRH signallari o'zgarishi tahdidlardan qochish zanjiri faoliyatiga ta'sir qilishi mumkin bo'lgan muhim rivojlanish davri \"oynasi\" ekanligini ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tajribalar miyaning ma'lum bir sohasida ekspressiyani bostirish uchun virusli vektorlardan foydalangan holda sichqonlarda o'tkazilgan, shuning uchun inson mexanizmlariga to'g'ridan-to'g'ri ko'chirish ehtiyotkorlikni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;p&gt;Hayotning erta davridagi stress ruhiy kasalliklar, jumladan, yuqori darajadagi qochish xulq-atvori bilan tavsiflanadigan hamda ko'pincha o'smirlik davrida namoyon bo'ladigan xavotir va depressiyaning rivojlanishida asosiy xavf omili hisoblanadi. Shunga qaramay, hayotning erta davridagi stress ushbu muhim rivojlanish davrida xavfdan qochish zanjirlarining yetilishini qanday shakllantirishi haqida kam narsa ma'lum. Hayotning erta davridagi stress ko'p shakllarda bo'lishi mumkin va noqulay omillarning tabiati ham, yuzaga kelish vaqti ham xulq-atvor natijalariga ta'sir qiladi. Kemiruvchilar modellarida hayotning dastlabki o'n kunligidagi surunkali stress uzoq muddatli oqibatlarga olib kelishi keng e'tirof etilgan, garchi turli modellar o'ziga xos afzalliklarni taqdim etsa ham. Bu yerda biz yotoq materiallari va uyali resurslarga kirish cheklangan modelini tanladik, chunki u eksperimentatorning minimal aralashuvini talab qiladi va ona mavjud bo'lgan, ammo parchalangan va oldindan aytib bo'lmaydigan parvarishni ta'minlaydigan keng tarqalgan insoniy tajribani aks ettiradi. Ushbu modeldan foydalangan holda biz uzoq masofali, glutamatergik vmPFC^CRH+→BLA yo'lini aniqladik, u hayotning erta davridagi stressdan so'ng xavfdan qochish vaqtida kuchaygan faollashuvni, sinaptik kuchayishni va o'smirlik davrida Crh ekspressiyasining oshishini namoyish etadi. Xulq-atvor davrida vmPFC^CRH+→BLA yo'lini tormozlash yoki rivojlanishning dastlabki bosqichlarida faqat qo'zg'atuvchi hujayralarda vmPFC dagi Crh ekspresiyasini kamaytirish hayotning erta davridagi stress keltirib chiqaradigan BLA faolligining oshishini va o'smirlik davrida xavfdan qochishni bartaraf etadi, ammo xuddi shu manipulyatsiyalar yetuk yoshda xavfdan qochishga ta'sir qilmadi. Qizig'i shundaki, hayotning erta davridagi stress, shuningdek, vmPFC dagi CRH⁺ hujayralarining umumiy zichligini kamaytiradi. Bunga muvofiq, biz nazorat guruhidagi sichqonlarda rivojlanish davrida butun vmPFC bo'ylab Crh nokdauni hayotning erta davridagi stress keltirib chiqaradigan yuqori darajadagi qochish fenotipini takrorlashini aniqladik. Birgalikda bu natijalar hayotning erta davridagi stressni boshdan kechirgan hayvonlarda CRH hujayra turiga xos tarzda ta'sir qilib, xavfga javob berish uchun muhim bo'lgan vmPFC zanjirlarida rivojlanish plastisitetini keltirib chiqarishini taxmin qiladi. Hayotning erta davridagi stressga sezgir bo'lgan va o'smirlik davrida xavfdan qochishning kuchayishini keltirib chiqarishga qodir bo'lgan ilgari e'tirof etilmagan, molekulyar jihatdan aniqlangan prefrontal zanjirni ochib berish orqali bizning natijalarimiz hayotning erta davridagi stress ruhiy kasalliklarga moyillikka qanday hissa qo'shishi mumkin bo'lgan potentsial zanjir mexanizmini ochib beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Hayotning erta davridagi stress vmPFC^CRH+→BLA yo'lini faollashtirib, o'smirlarda xavfdan qochishni kuchaytiradi, Crh ni bostirish esa bu ta'sirni takrorlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Oldingi ishlar shuni ko'rsatdiki, hayotning erta davridagi stressga duchor bo'lgan individlar qo'rqinchli stimullar ta'siridan keyin BLA faollashuvining kuchayishini namoyish etadi, bu odamlarda funksional magnit-rezonans tomografiya va kemiruvchilarda Fos markirovchisi yordamida o'lchanadi. Bunga mos ravishda, biz hayotning erta davridagi stressga duchor bo'lgan o'smir sichqonlarda BLA faolligi oshganini aniqladik (1-rasm). Assosiativ qo'rquvni mashq qilish davrida BLA faolligi yotoq materiallari va uyali resurslarga kirish cheklangan sharoitdagi hayvonlarda nazorat guruhiga nisbatan shok va shartli ohang taqdim etilganda yuqori bo'ladi. Assosiativ qo'rquvni mashq qilish klassik qo'rquvni hosil qilish bilan solishtirganda pastroq shok intensivligidan foydalanadi, bu esa nima uchun nazorat sichqonlarida ohang chaqirgan faollik darajasi nisbatan past ekanligini tushuntirishi mumkin. Birgalikda bu topilmalar hayotning erta davridagi stress o'qish jarayonida hatto kuchsiz ta'sir qiluvchi stimullarga ham BLA ni sezgirlashtirib, xavfni bashorat qiluvchi signallarga yuqori javoblarni rag'batlantirishini taxmin qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Nokdaun — bu hosil bo'ladigan oqsil funksiyalarini o'rganish maqsadida ma'lum bir gen (bu holda Crh) ekspressiyasini sun'iy ravishda kamaytirishning genetik usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kortikoliberin stressga javob beradigan neyropeptid bo'lib, u qo'rquvni o'rganishga yordam beradi va neyronlarning qo'zg'aluvchanligini oshiradi, bu esa uning mPFC-BLA zanjirlaridagi hayotning erta davridagi stress keltirib chiqaradigan o'zgarishlarga vositachilik qilishi mumkinligini ko'rsatadi. Garchi o'zgargan kortikoliberin ekspressiyasi gipotalamus, amygdala va gippokampda yaqqol sezilsa ham, oldingi ishlar voyaga yetgan shaxslarga qaratilgan edi. Biz vmPFC da Vglut⁻CRH⁺ hujayralar sonining rivojlanish davriga xos kamayishini kuzatdik, Vglut⁺CRH hujayralar sonida, jumladan vmPFC^CRH+→BLA proyektsion neyronlarida o'zgarishlar kuzatilmadi (3-rasm). vmPFC dagi ko'pchilik CRH⁺ neyronlari vasoaktiv ichak peptidini birgalikda ekspressiya qiluvchi GABAergik interneyronlar bo'lib, garchi tadqiqotlar yadro accumbens va lateral to'siq kabi hududlarga kam uchraydigan uzoq masofali GABAergik CRH⁺ proyektsiyalarini qayd etgan bo'lsa ham. Shunday qilib, bizning miya miqyosidagi tahlilimizda va in situ ma'lumotlarida kuzatilgan CRH⁺ hujayralarining kamayishi vmPFC GABAergik neyronlarida Crh ekspressiyasining yo'qolishini aks ettiradi. Qolaversa, bizning butun vmPFC bo'ylab CRH nokdauni bo'yicha tajribamiz, bu nazorat sichqonlarida hayotning erta davridagi stress ta'sirini takrorladi (2-rasm), ehtimol eng ko'p aynan shu hujayralarga ta'sir qilgan. Vasoaktiv ichak peptidini eksprimatsiya qiluvchi interneyronlar somatostatin interneyronlarini afzal ko'radi, shu bilan piramidal neyronlarning somatostatin vositachiligidagi dendritik tormozlanishini pasaytiradi va qo'zg'atuvchi chiqishni oshiradi. Ushbu sinaptik o'zaro ta'sirga qo'shimcha ravishda, somatostatin interneyronlarining kichik guruhi kortikoliberin 2 retseptorini ekspressiya qiladi. Ushbu topilmalar vasoaktiv ichak peptidi interneyronlaridan kortikoliberinning chiqarilishi prefrontal mikrotsirkulyatsiyaning yetilishini modulyatsiya qilishi mumkinligi ehtimolini keltirib chiqaradi. Ushbu kamayishning funksional oqibatlari noaniqligicha qolsa-da, bunday o'zgarishlar oxir-oqibat prefrontal chiqishga, shu jumladan basolateral amygdalaga ta'sir qilishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Xulosalar kemiruvchilar modellarida qilingan bo'lib, miyadagi o'zgarishlarni xulq-atvor bilan korrelyatsiyasi insonga ekstrapolyatsiya qilishda ehtiyotkorlikni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Shuningdek, biz erta hayotiy noqulay sharoitlar (ELA) taʼsirida yuzaga kelgan vmPFCCRH+→BLA zanjiridagi plastislik o‘smirlik davrida tahdidlardan qochishning kuchayishiga yordam berishini, ammo voyaga yetgan yoshda hech qanday taʼsir ko‘rsatmasligini aniqladik. Odatiy rivojlanish jarayonida ushbu davrda tahdidga nisbatan javob reaksiyasining pasayishi atrof-muhitni o‘rganish va moslashuvchan xulq-atvor strategiyalarini shakllantirish uchun muhim bo‘lgan tavakkalli izlanishlarni osonlashtirishi mumkin. Shuning uchun ELA keltirib chiqaradigan vmPFCCRH+→BLA faolligining kuchayishi doimiy qochish moyilligini keltirib chiqarib, xulq-atvor repertuarini cheklashi va atrof-muhitga javob berishning moslashuvchan strategiyalarini o‘zlashtirishni cheklashi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;vmPFCCRH+→BLA zanjiridagi plastislik o‘smirlik davrida tahdidlardan qochishni kuchaytiradi, ammo voyaga yetgan davrda bu taʼsir yo‘qoladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bizning oldingi tadqiqotlarimiz shuni ko‘rsatdiki, odatiy sharoitlarda o‘stirilgan sichqonlarda voyaga yetgan yoshda kuzatiladigan tahdidlardan qochishning yuqori darajalari dmPFC dan BLA gacha bo‘lgan yo‘l ichidagi yuqori faollik, sinaptik kuch va bog‘liqlik bilan bog‘liq [40]. Bu yerda biz yetuk yoshdagi hayvonlarda ham, ularni o‘stirish sharoitidan qat'i nazar, yuqori darajadagi qochishni kuzatdik. Qolaversa, vmPFCCRH+→BLA faoliyatining tormozlanishi yoki vmPFC qo‘zg‘atuvchi neyronlarida Crh ekspresiyasining nokdauni ushbu yoshda qochish xulqiga sezilarli taʼsir ko‘rsatmadi, bu esa mazkur yo‘l o‘smirlik davrida kuchliroq rol o‘ynashini bildiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Nokdaun — molekulyar biologiya usuli bo‘lib, ma'lum bir gen faoliyatini sun'iy ravishda kamaytirish yoki to‘xtatib turishni anglatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Voyaga yetgan davrga kelib boshqa zanjirlar PMA xulq-atvorini modulyatsiya qilishda kattaroq rol o‘z zimmasiga olishi va vmPFCCRH+→BLA ning hissasini kamaytirishi yoki niqoblab qo‘yishi mumkin. Umuman olganda, vmPFC-BLA tormozlanishining va yo‘lga xos CRH nokdaunining o‘smirlik davridagi tanlab taʼsir ko‘rsatishi ushbu zanjirni erta aralashuv uchun potensial nishon sifatida ko‘rsatadi. Xulosa qilib aytganda, mPFC zanjirlari rivojlanishini ELA ning uzoq muddatli taʼsiri bilan bog‘lash orqali biz erta hayotiy tajribalar neyrotaraqqiyot t
