raektoriyalarini qanday shakllantirishi va oxir-oqibat psixiatrik kasalliklarga moyillikka qanday taʼsir qilishini tushunish uchun mexanik asosni taqdim etamiz.&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"subjects\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#subjects\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Subjects&lt;/span&gt;&lt;/a&gt;Subjects&lt;/h4&gt;\n&lt;p&gt;C57Bl6/J (JAX Stock No. 000664), CRH-Cre (JAX Stock No. 012704), VGLUT1-Cre (JAX Stock No. 023527) va Ai14 tdTomato Cre-reporter (JAX Stock No. 007914) transген сичqonlarining urg'ochi va erkak nasllari laboratoriya vivariysida ko'paytirildi. Sutdan ajratilgandan so'ng, sichqonlar guruhlarga bo'lib (qafasiga 2–4 tadan) boqildi. Eksperimental yakuniy nuqtalar o'smirlik davrining o'rtalarida — postnatal kunlarda (P) 33–37 sodir bo'ldi. Sichqonlar 12 soatlik yorug'lik siklida (yorug'lik soat 7:00 dan 19:00 gacha yoqilgan) harorati va namligi nazorat qilinadigan xonada saqlandi. Oziq-ovqat va suv ad libitum tarzda taqdim etildi. Barcha protseduralar Los-Anjelesdagi Kaliforniya universiteti Kanslerining hayvonlarni tadqiq qilish qo'mitasi tomonidan tasdiqlangan hayvonlarni parvarish qilish qoidalariga amal qildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tajriba yakunlari o'smirlik davrida (P33–37) amalga oshirildi, hayvonlar esa ozuqa va suvga cheklovsiz ega bo'lgan nazorat ostidagi sharoitlarda saqlandi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"limited-bedding-and-nesting-protocol\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#limited-bedding-and-nesting-protocol\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Limited Bedding and Nesting Protocol&lt;/span&gt;&lt;/a&gt;Limited Bedding and Nesting Protocol&lt;/h4&gt;\n&lt;p&gt;Onalar resurslar tanqisligi modeli bo'lgan cheklangan to'shama va uy qurish materiali protokoli (LBN) yordamida erta hayotiy stressga (ELA) duchor qilindi, bunda ona va bolalar 7 kun davomida (P4-P11) cheklangan miqdordagi uy qurish materiali va kam to'shama sharoitida saqlandi. Ushbu model ona parvarishini buzishi avval tasdiqlangan. P4 da ona va bolalar ikkita 1x1 dyuymli paxtali uy qurish materiali va bitta yog'och-sellyulozali bir martalik boshpanani o'z ichiga olgan standart uy qafasidan simli to'r poldan va bitta 1x1 dyuymli paxtali materialdan iborat LBN qafasiga o'tkazildi. Standart parvarish qilingan nazorat onasi va bolalari yangi standart uy qafasiga ko'chirildi. Barcha sichqonlar oziq-ovqat va suvdan doimiy foydalanish imkoniyatiga ega bo'ldi. Bir haftadan so'ng (P11) bolalar va onalar to'liq to'shama va uy qurish materiali bo'lgan standart sharoitlariga qaytarildi. Ona xulq-atvori bir hafta davomida har kuni soat 8:00 dan 9:00 gacha va 16:00 dan 17:00 gacha 1 soat davomida yozib olindi. Ona xulq-atvori P6 dagi ertalabki yozib olish vaqtida onaning uyada bo'lgan vaqt ulushini qo'lda o'lchash orqali baholandi. Barcha bolalar P21 da sutdan ajratildi.&lt;/p&gt;\n&lt;h4 id=\"surgery\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#surgery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Surgery&lt;/span&gt;&lt;/a&gt;Surgery&lt;/h4&gt;\n&lt;p&gt;P19-21 da sichqonlar to'g'rilash refleksi yo'qolguncha 3% izofluran yordamida kislorodda behush qilindi va stereotaksik apparatga o'tkazildi. Stereotaksik qurilma o'sib borayotgan sichqonlar uchun kichik tish barchasi va rivojlanish quloq barchalari bo'lgan moslama bilan jihozlangan edi. Og'riq va noqulaylikni minimallashtirish uchun operatsiyadan oldin va keyin nosteroid yallig'lanishga qarshi vosita yuborildi. Sichqonchaning boshi qirqilib, betadin va undan keyin 70% li etanolsizlanish bilan navbatma-navbat uch marta tozalandi. Bosh terisi ostiga mahalliy og'riqsizlantiruvchi sifatida 2% li lidokain yuborildi. Bosh terisida kichik kesma qilindi. Virusli inyeksiyalar uchun mo'ljallangan nishon ustida kichik teshik parmalandi va virus bilan to'ldirilgan Gamilton shprisi to'g'ri stereotaksik koordinataga tushirildi. Virus 100 nL/min tezlikda bosim ostida kiritildi va inyeksiya tugagandan so'ng shprits joyida 5 daqiqa davomida qoldirilib, so'ngra bosh suyagidan sekin chiqarib olindi. Barcha tajribalar uchun hayvonlarga tiklanishiga ruxsat berildi va keyin P21 gacha onasi va tug'ishdoshlari bilan birga toza uy qafasiga qaytarildi, shundan so'ng ular sutdan ajratildi. Agar virus ekspressiyasi yoki tola joylashuvi noto'g'ri bo'lsa, hayvonlar tahlildan chiqarib tashlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Stereotaksik jarrohlik miyaning aniq qismlariga virusli vektorlarni yetkazib berish uchun ishlatiladi va og'riqsizlantirish hamda postoperativ parvarish bilan birga bajariladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Fiber photometry, optogenetics and CRH knockdown Fotometriya tajribalari uchun sichqonlarga bazolateral amigdalaga (BLA) (old-orqa (AP): -1.6, medial-dorsal (ML): -3.20, dorsal-ventral (DV): -4.8) genetik ravishda kodlangan kalsiy indikatori GCaMP6s ni ekspresiya qiluvchi AAV (AAV9-CAG-GCaMP6s-WPRE-SV40, Addgene № 100844, 300 nl) bir tomonlama yuborildi. Optogenetik tajribalar uchun sichqonlarga vmPFC ga (AP 1.8, ML ±0.25, DV -2.9) ikki tomonlama ravishda AAV (tormozlovchi: AAV5-Ef1a-DIO-PdCO-mScarlet, Addgene № 198516 yoki qo'zg'atuvchi: AAV8-nEF-Con/Foff 1.0-ChR2-EYFP, Addgene № 137163, 200 nl) yoki nazorat AAV lari (tormozlovchi: AAV5-Ef1a-DIO-EYFP, Addgene 27056, qo'zg'atuvchi: AAV8-Ef1a-DIO-mCherry, Addgene № 114471, 200 nl) yuborildi. Keng vmPFC→BLA tormozlanishi uchun AAV5-hysn-PdCO-EGFP (Addgene № 198513, 200 nl) va AAV5-hysn-mCherry (Addgene № 114472, 200 nl) ishlatildi. Bosh suyagining o'sishini qoplash uchun bir tomonlama (fotometriya, 400 µm, 0.50 NA; Thor Labs) yoki ikki tomonlama (optogenetika, 200 µm, Newdoon) optik tolalar PMA mashg'ulotidan 5 kun oldin alohida operatsiyada implantatsiya qilindi va Metabond (Parkell) yordamida mahkamlandi. Nokdaun tajribalari uchun sichqonlarga anti-CRH shRNA ni ekspresiya qiluvchi cre ga bog'liq AAV (AAV2/9-CMV-DIO-(mCherry-U6)-shRNA(CRH)-WPRE-hGHpA, BrainVTA, PT-12461, 200 nl) yoki skramble nazorat (AAV2/9-CMV-DIO-(mCherry-U6)-shRNA(scramble)-WPRE-hGHpA, BrainVTA, PT-2788, 200 nl) ikki tomonlama yuborildi.&lt;/p&gt;\n&lt;p&gt;Viral tracing Sichqonlarga BLA ga (AP -1.6, ML -3.20, DV -4.8) 3:1 nisbatdagi cre ga bog'liq AAV (AAVrg-CAG-FLEX-GFP, Addgene № 51502) va cre ga bog'liq bo'lmagan AAV (AAV5-CAG-tdTomato, Addgene № 58462) aralashmasidan 150 nl bir tomonlama yuborildi. Oxirgisi retrograd virusning maqsadga muvaffaqiyatli yetib borganini tekshirish uchun ishlatildi; agar ekspresiya BLA da bo'lmasa, hayvonlar chiqarib tashlandi.&lt;/p&gt;\n&lt;h4 id=\"xulq-atvor-testlari\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#xulq-atvor-testlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulq-atvor testlari&lt;/span&gt;&lt;/a&gt;Xulq-atvor testlari&lt;/h4&gt;\n&lt;p&gt;Platforma yordamida qochish Sichqonlar xulq-atvorini sinovdan o'tkazish tartibidan oldin 3 kun davomida qo'lga o'rgatildi. Shartli refleksni hosil qilish kamerasi tasodifiy tok urishi generatoriga (Lafayette Instruments) ulangan panjarali polga ega 18 x 30 sm o'lchamdagi qafasdan iborat edi. Kamera maxsus yasalgan akustik kamera bilan o'ralgan va 50% Windex eritmasi bilan xushbo'ylashtirilgan. Yupqa akril plataforma (qalinligi 1,3 sm) polning 25% qismini qoplagan. Sichqonlarning kamerani tadqiq qilishini rag'batlantirish uchun pol ostiga vanil yoki bodom ekstrakti bilan to'ldirilgan ikkita kichik o'lchov idishi joylashtirildi. O'smirlik davrining o'rtalarida (P33-36) mashg'ulot o'tkazildi va sichqonlarga uchtadan boshlang'ich 30 soniyali 4 kHz chastotali tovushlar (shartli signal, ShS), keyin esa 2 soniyali panja tok urishi (0,13 mA) bilan bir vaqtda yakunlanadigan to'qqizta ShS taqdim etildi. Sichqonlar mashg'ulotdan keyin 10 daqiqa (pCREB ekspressiyasi) yoki 1 soat (Fos ekspressiyasi) o'tgach perfuziya qilindi va ularning miyasi yig'ilib, Fos immunobo'yash uchun ishlov berildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Platforma yordamida qochish — bu hayvon yoqimsiz tok urishidan qochish uchun tovushli signalga javoban xavfsiz platformaga o'tishni o'rganadigan xulq-atvor testidir.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Boshqa barcha tajribalar uchun sichqonlarga qochish xotirasini tiklash va namoyon qilish qobiliyatini tekshirish maqsadida keyingi kuni tok urishisiz oltita ShS taqdim etildi. Tovushlar 80 dan 150 soniyagacha bo'lgan tasodifiy interval uzunliklari bilan ajratildi. vmPFCVGLUT1+ hujayralarida CRH nokdauni uchun sichqonlar Fos ekspressiyasi uchun mashg'ulotdan 1 soat o'tgach perfuziya qilindi.&lt;/p&gt;\n&lt;p&gt;Tokka nisbatan sezgirlik Xulq-atvor reaksiyasini (vokalizatsiya, qochish yoki otilish) qo'zg'atish uchun zarur bo'lgan minimal panja tok urishi intensivligini baholash uchun, nativ o'smir sichqonlar PMA dagi kabi, lekin platformasiz operant shartli kamera ichiga joylashtirildi. Sichqonlar 0,02 mA dan boshlanib, 0,20 mA gacha 0,02 qadam bilan oshiriladigan bir qator panja tok urishlariga duchor qilindi. Muayyan sichqon birinchi marta vokalizatsiya qilgan, qochgan yoki otilgan tok urishining amplitudasi qayd etildi. Vokalizatsiya eshitiladigan tovush chiqarish sifatida aniqlandi. Qochish sakrashlarsiz tez qadam tashlash sifatida aniqlandi. Otilish yuqori tezlikdagi, gorizontal sakrash sifatida aniqlandi.&lt;/p&gt;\n&lt;p&gt;Ochiq maydon testi Sichqonlar sinov xonasiga 10 daqiqa davomida moslashtirildi, so'ngra plastik arenasiga (50 x 50 x 40 sm) joylashtirildi. Lokomotor faollik va arena markazida o'tkazilgan vaqt veb-kamera yordamida 5 (nativ sichqonlar) yoki 10 (optogenetik va nokdaun manipulyatsiyalari) daqiqalik test davomida qayd etildi. Ma'lumotlarni tahlil qilish uchun BioViewer video-kuzatuv tizimidan (nativlar uchun) foydalanildi, qolgan ma'lumotlar to'plamlari esa EZTrack75 yordamida tahlil qilindi. Arena ikkita zonaga bo'lindi: markaz (umumiy maydonning 25%) va periferiya (umumiy maydonning 75%), har bir zonadagi vaqt va kirishlar soni, shuningdek, bosib o'tilgan umumiy masofa qayd etildi. Optogenetik tajribalar uchun yozuvlar 60 soniyali bazaviy davr bilan boshlandi, undan keyin 30 soniya lazer yoniq va 30 soniya lazer o'chiq bo'lgan to'rtta sikl keldi. Ushbu davrlarda har bir zonada o'tkazilgan vaqt, zonaga kirishlar soni va bosib o'tilgan umumiy masofa miqdoriy jihatdan baholandi va lazer yoniq hamda o'chiq davrlar orasida taqqoslandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Ochiq maydon testi bo'sh ochiq arena markazida o'tkazilgan vaqt bo'yicha kemiruvchilarning umumiy harakat faolligi va xavotirlanish darajasini o'lchaydi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ko'tarilgan xochsimon labirint Sichqonlar sinov xonasiga 10 daqiqa davomida moslashtirildi. Sichqonlar xoch shaklidagi labirintning markaziga burni ochiq yeng tomonga qaratilgan holda joylashtirildi. Lokomotor faollik va ochiq hamda yopiq yenglar va arena markazida o'tkazilgan vaqt veb-kamera yordamida 5 daqiqa davomida qayd etildi. Arenani ikkita ochiq yenglar to'plami, ikkita yopiq va markazga bo'lish orqali ma'lumotlarni tahlil qilish uchun Bioviewer ishlatildi. Har bir zonadagi vaqt va kirishlar soni, shuningdek, bosib o'tilgan umumiy masofa qayd etildi.&lt;/p&gt;\n&lt;p&gt;Ko'tarilgan dumaloq labirint Sichqonlar sinov xonasiga 10 daqiqa davomida moslashtirildi. Sichqonlar nol shaklidagi ko'tarilgan labirintning ochiq yengiga burni qaratilgan holda yopiq yengga joylashtirildi. Lokomotor faollik va ochiq hamda yopiq yenglar va arena markazida o'tkazilgan vaqt veb-kamera yordamida 10 daqiqa davomida qayd etildi. Ma'lumotlarni tahlil qilish uchun EZTrack ishlatildi. Har bir zonadagi vaqt va kirishlar soni, shuningdek, bosib o'tilgan umumiy masofa qayd etildi.&lt;/p&gt;\n&lt;p&gt;Yangi hid testi 1-kuni sichqonlar odat qilish uchun 10 daqiqa davomida bo'sh plastik arenaga (50 x 50 x 40 sm) joylashtirildi. 2-kuni sichqonlar ikkita bir xil xushbo'ylashtirilgan plastik sfera (har biri uchun bir xil hid: bodom yoki vanil, sichqonlar bo'ylab muvozanatlashtirilgan) bilan arenaga qaytadan joylashtirildi. Sichqonlar sferalar bilan jami 20 s davomida o'zaro ta'sirlashguncha kamerada qoldirildi. Agar sichqonlar 10 daqiqa ichida ushbu mezonlarga erishmasa, ular chiqarib yuborildi. O'zaro ta'sir burun bilan unga qaratilgan holda sferadan 2 sm masofada bo'lish sifatida aniqlandi. 3-kuni sichqonlar arena ichiga 10 daqiqaga joylashtirildi va bitta sfera dastlabki hid bilan, ikkinchisi esa yangi hid bilan xushbo'ylashtirildi (tomonlar hayvonlar o'rtasida muvozanatlashtirildi). O'zaro ta'sir vaqti videoyozuvlardan aniqlandi. Guruhlar bir nechta, mustaqil ravishda o'tkazilgan xulq-atvor kogortalarining birlashtirilgan natijalarini ifodalaydi.&lt;/p&gt;\n&lt;h4 id=\"miyani-tiniqlashtirish-va-butun-miyani-tasvirga-olish\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#miyani-tiniqlashtirish-va-butun-miyani-tasvirga-olish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Miyani tiniqlashtirish va butun miyani tasvirga olish&lt;/span&gt;&lt;/a&gt;Miyani tiniqlashtirish va butun miyani tasvirga olish&lt;/h4&gt;\n&lt;p&gt;Sichqon miya to'qimasi Adipo-Clear protokolining modifikatsiyalangan versiyasiga muvofiq tayyorlandi. Qisqacha aytganda, sichqonlarga muz ustida yurak ichiga 20 ml fosfat-buterli tuz eritmasi (PBS, Invitrogen), so'ngra 4% paraformaldegid (PFA; Electron Microscopy Sciences) yordamida perfuziya qilindi. Keyin miya yarim sharlari o'rta chiziqdan taxminan 1 mm lateral ravishda kesilib, 4℃ da bir kecha davomida 4% PFA da post-fiksatsiya qilindi. Ertasi kuni namunalar B1n buteri (1:1000 Triton X-100, 2% m/v glisin, 1:10,000 NaOH 10N, 0.02% natriy azid) bilan aralashtirilgan metanol (MeOH, Fisher Scientific) yordamida ketma-ket suvsizlantirildi. Har bir metanol gradyenti (20%, 40%, 60% va 80%) tebrata olgich (VWR) yordamida 1 soat davomida qo'llanildi. Keyin namunalar 100% MeOH da har biri 1 soatdan ikki marta yuvildi va so'ngra bir kecha davomida 2:1 nisbatdagi dixlormetan (DCM) eritmasida inkubatsiya qilindi. Ertasi kuni namunalar 100% DCM da har biri 1 soatdan ikki marta, shundan so'ng 100% MeOH da asta-sekin ortib boruvchi davomiylikda (30 daqiqa, 45 daqiqa, 1 soat) uch marta yuvildi. Keyin to'qima namunalari 5:1 nisbatdagi H₂O₂ eritmasida 4 soat davomida oqartirildi. Regidratatsiya kamayib boruvchi metanol konsentratsiyali (80%, 60%, 40% va 20%) MeOH/B1n buteri seriyali yuvishlari orqali har biri 30 daqiqadan, so'ngra B1n buterida yakuniy 1 soatlik yuvish orqali amalga oshirildi. Permeabilizatsiya PTxWH buterida 5% DMSO / 0.3 M glisin yordamida 1 soat davomida bajarildi, so'ngra yangi permeabilizatsiya eritmasida qo'shimcha 2 soatlik inkubatsiya qilindi. Shundan so'ng namunalar PTxWH da 30 daqiqa davomida chayqaldi va yangi PTxWH buterida bir kechaga qoldirildi. Ertasi kuni yana ikkita PTxWH yuvishi (1 soat va soatlar davomida) amalga oshirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;To'qimalarni tiniqlashtirish usuli (tissue clearing) xujayra tuzilmalari va flüoresan nishonlarni saqlab qolgan holda, noaniq biologik organlarni uch o'lchamli mikroskopiya uchun kimyoviy eritmalar yordamida yorug'lik o'tkazuvchan qilish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Namunalar PTxWH da 1:300 suyultirishdagi birlamchi anti-RFP antitanasi (Rockland Immunochemicals) bilan 37℃ da uzluksiz siltash ostida 11 kun davomida inkubatsiya qilindi. Shundan so'ng PTxWH da ketma-ket yuvishlar bajarildi: har biri 1 soatdan ikki marta va har biri 2 soatdan ikki marta, 37℃ da 2 kun davomida qo'shimcha PTxWH almashinuvlari bilan. Birlamchi antitana bilan inkubatsiyadan so'ng, namunalar 37℃ da 8 kun davomida 1:300 nisbatdagi ikkilamchi antitana (AlexaFluor 647, ThermoFisher Scientific) bilan, ikki kun davomida muntazam PTxWH yuvishlari bilan inkubatsiya qilindi. Antitana bilan bo'yashdan so'ng namunalar PBS da ikki marta (har biri 1 soatdan), keyin ikki marta 2 soatdan yuvildi va bir kechaga qoldirildi. Suvsizlantirish har biri 30 daqiqadan MeOH yuvishlarining bosqichma-bosqich seriyasini (20%, 40%, 60% va 80%), so'ngra uchta 100% MeOH yuvishini (30 daqiqa, 1 soat va 1.5 soat) o'z ichiga oldi. Namunalar tebrata olgichda 2:1 nisbatdagi DCM eritmasida bir kecha davomida inkubatsiya qilindi. Ertasi kuni namunalar 100% DCM da har biri 1 soatdan ikki marta yuvildi, so'ngra 100% dibenzil efirda (DBE) tiniqlashtirildi, bunda DBE 4 soatdan keyin yangilandi. Tiniqlashtirilgan namunalar DBE da xona haroratida qorong'i joyda saqlandi va tasvirga olish kamida 24 soat o'tgach amalga oshirildi.&lt;/p&gt;\n&lt;p&gt;Butun miyani tasvirga olish. Miya namunalari sCMOS kamerasi (Andor Neo) va 6 mm ish masofasiga ega botirish qopqoqli 2x/0.5 NA ob'ektivi (MVAPLAPO 2x) bilan jihozlangan yorug'lik-qatlamli mikroskop (Ultramicroscope II, LaVision Biotec) yordamida tasvirga olindi. Tasvir steklari 0.8x optik masshtabda olingan va Imspector Microscope v28 dasturi orqali boshqarilgan. Xujayralarni tasvirga olish uchun 488 nm va 640 nm lazerlar (20% lazer quvvati) ishlatildi. Skanerlash 3 µm qadam o'lchamida bajarildi, 640 nm kanal uchun aralashtirish algoritmi bo'lgan uzluksiz yorug'lik-qatlamli skanerlash usuli (tekislik uchun 20 ta yig'ish) va 488 nm kanal uchun gorizontal skanerlarsiz amalga oshirildi.&lt;/p&gt;\n&lt;h4 id=\"ex-vivo-elektrofiziologiyasi\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#ex-vivo-elektrofiziologiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ex vivo elektrofiziologiyasi&lt;/span&gt;&lt;/a&gt;Ex vivo elektrofiziologiyasi&lt;/h4&gt;\n&lt;p&gt;Jarrohlik BLA dagi vmPFCCRH+ aksonlarini optogenetik usulda stimulyatsiya qilish uchun yuqorida tavsiflangan usullardan foydalangan holda chap vmPFC ga 300 nl AAV8-Ef1a-double floxed-hChR2(H134R)-mCherry)WPRE-HGHpA (Addgene, 20297) yubordik. Jarrohlik amaliyotlari yozib olishdan 16–18 kun oldin bajarildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Optogenetika yorug'likka sezgir oqsillarni virusli vektorlar yordamida miyaning ma'lum hududlariga yetkazib berish orqali neyronlar faoliyatini yorug'lik yordamida boshqarish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;O'tkir miya kesmalarini tayyorlash O'tkir miya kesmalarini tayyorlash uchun sichqonlarni izofluran yordamida anesteziya qildik va tarkibida 2,5 mM KCl, 1 mM NaH2PO4, 26,2 mM NaHCO3, 4 mM MgCl2, 11 mM glyukoza, 210,3 mM saxaroza, 0,5 mM CaCl2 va 0,5 mM natriy askorbat bo'lgan muzdek sovuq kesish sun'iy miya-paxsa suyuqligi (ACSF) eritmasi bilan transkardial perfuziya qildik (95% O2/5% CO2 bilan puflangan).&lt;br /&gt;\nMiya tezda ajratib olindi va Leica VT1200S vibrotomidan foydalangan holda, in’ektsiya qilingan tomonga ipsilateral bo'lgan yarim shardan 300 µm qalinlikdagi BLA kesmalari olindi.&lt;/p&gt;\n&lt;p&gt;Kesmalar tarkibida 125 mM NaCl, 2,5 mM KCl, 26.2 mM NaHCO3, 2 mM MgCl2, 11 mM glyukoza va 2 mM CaCl2 bo'lgan normal ACSF ga o'tkazildi (95% O2/5% CO2 bilan puflangan) va 34 ℃ da 34–40 daqiqa davomida saqlandi. Keyin kesmalarning xona haroratigacha sovishiga ruxsat berildi. In’ektsiya joyini tasdiqlash uchun vmPFC ni o'z ichiga olgan kesmalar ham yig'ib olindi.&lt;/p&gt;\n&lt;p&gt;Kesmalar elektrofiziologiyasi Yozib olish ishlari xona haroratida normal ACSF da amalga oshirildi. BLA oq modda yo'llari va vmPFCCRH+ akson fluoressensiyasi yordamida aniqlandi. Hujjatlar infraqizil-differensial interferentsion kontrast ostida ×40 obyektiv yordamida vizualizatsiya qilindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Patch-clamp usuli hujjat membrana yopishgan mikroelektrod yordamida alohida neyronlarning elektr faolligini o'lchash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Potentsialni fiksatsiya qilish rejimidagi tajribalar tarkibida 117 mM seziy metansulfonat, 20 mM HEPES, 0,4 mM EGTA, 2,8 mM NaCl, 5 mM TEA-Cl, 4 mM Na2-ATP va 0,4 mM Na-GTP bo'lgan ichki eritma bilan to'ldirilgan borosilikat pirpetkalar (5–7 MΩ) yordamida amalga oshirildi, pH seziy gidroksidi yordamida 7,3 gacha sozlangan (280–290 mOsm).&lt;/p&gt;\n&lt;p&gt;Spontan qo'zg'atuvchi va tormozlovchi oqimlar uzilishlarsiz 3 daqiqalik yozuvlar orqali qayd etildi, bunda neyronlar mos ravishda -70 mV yoki 0 mV potentsialda ushlab turildi. vmPFCCRH+ terminallarini stimulyatsiyadan kelib chiqadigan qo'zg'atuvchi oqimlar neyronlarni –70 mV da ushlab turish va ×40 obyektiv orqali CoolLED pE-300Ultra yorug'lik manbaidan foydalangan holda 50-mW ko'k (~470-nm) yorug'likning 0,5 ms impulsini berish yo'li bilan olindi.&lt;/p&gt;\n&lt;p&gt;Juft-impulsli yozuvlar 100 ms masofada joylashgan bir xil yorug'lik stimullarini berish orqali amalga oshirildi. Faqat optik stimulyatsiyaga barqaror sinaptik javob beradigan neyronlar chaqirilgan oqimlar ma'lumotlar to'plamiga kiritildi. Tormozlovchi oqimlar xuddi shunday tarzda, lekin neyronlarni 0 mV da ushlab turgan holda qayd etildi.&lt;/p&gt;\n&lt;p&gt;Ma'lumotlar Multiclamp 700B kuchaytirgichi va Digidata 1440A raqamlashtirgichi (Axon Instruments) yordamida pClamp 10 (Molecular Devices) yordamida yig'ildi. Yozuvlar 10 kHz chastotada orqaga olindi va chaqirilgan yozuvlar uchun 3 kHz, spontan yozuvlar uchun 1 kHz chastotada filtrlandi.&lt;/p&gt;\n&lt;p&gt;Ketma-ket qarshilik va kirish qarshiligi tajriba davomida 5 mV test impulsiga javoban sig'imli o'tish jarayoni va statsionar og'ishni o'lchash yo'li bilan nazorat qilindi. Ketma-ket qarshilik &amp;lt;25 MΩ ni tashkil etdi, seans davomida 20% dan ko'p o'zgarmadi va kompensatsiya qilmadi.&lt;/p&gt;\n&lt;p&gt;Ma'lumotlar Python v3.7 da tahlil qilindi. Tahlil o'nta skanerlashning o'rtacha qiymatiga asoslandi. Oqimlar asosiy ushlab turish oqimiga nisbatan tahlil qilindi. EPSC va IPSC hujjatlar –70 mV va 0 mV da potentsial fiksatsiya qilinganda cho'qqi javobini o'lchash orqali miqdoriy baholandi.&lt;/p&gt;\n&lt;h4 id=\"in-situ-gibridizatsiya\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#in-situ-gibridizatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;In situ gibridizatsiya&lt;/span&gt;&lt;/a&gt;In situ gibridizatsiya&lt;/h4&gt;\n&lt;p&gt;Sichqonlarning yurak ichiga 20 ml fosfat-buterli fiziologik eritma (PBS, Invitrogen), so'ngra 4% paraformaldegid (PFA; Electron Microscopy Sciences) yuborildi. Keyin miya olib tashlandi va PFA ga 24 soatga qo'yildi, shundan so'ng Optimal kesish harorati (OCT) qolipiga solib qotirishdan va -80℃ da saqlashdan oldin 3 kun davomida 30% saxaroza eritmasida saqlandi. 20 mkm qalinlikdagi kesmalar kriostat (Leica Microsystems) yordamida tayyorlandi va Superfrost Plus buyum oynaçalariga (Fisher Scientific) o'rnatildi. Vglut1 va Vgat ni belgilash uchun biz kesmalarni RNAscope Multiplex Fluorescent Detection kit v2 (ACD Bio #323110) yordamida, C3 dagi Vglut1 zondlari (ACD Bio #501101-C3) va C2 dagi Vgat zondlari (ACD Bio # 319191-C2) hamda mos ravishda TSA Vivid Dye 570 va 620 bilan qayta ishladik. Retraddan belgilangan vmPFCCRH+→BLA hujayralari RNAscope protokoliga amal qilgan holda immunogistoximiya yordamida bo'yaldi. Miya kesmalari atrofida to'siq yaratish uchun gidrofob qalamdan foydalanildi, so'ngra PBS da 3 marta 10 daqiqadan yuvildi, 0.5% Triton-X100 qo'shilgan PBS da 2 soat davomida o'tkazuvchanlashtirildi va tovuqning GFP ga qarshi birlamchi antitelalari (1:2000; Aves Lab) yordamida 4℃ da bir kecha davomida inkubatsiya qilindi. Keyingi kuni kesmalar PBS da yuvildi va xona haroratida 2 soat davomida eshakning tovuqga qarshi Alexafluor 488 (1:1000; JacksonImmunoResearch) antitelalarida inkubatsiya qilindi. DAPI da 30 soniya davomida inkubatsiyadan so'ng, oynaçalar yopqich oynaça bilan yopildi va Leica STELLARIS konfokal mikroskopida (Leica Microsystems) 20x kattalashtirishda tasvirga olindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Ushbu bosqichda to'qimalardagi gen ekspresiyasini aniq aniqlash uchun RNK nishonlarini floresan zondlar yordamida vizualizatsiya qilish usulidan foydalanilgan.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Crh-shRNA va skrembl nazorat guruhi o'rtasida muvaffaqiyatli nokdaunni tasdiqlash uchun biz kesmalarni RNAscope Multiplex Fluorescent Detection kit v2 (ACD Bio #323110) yordamida, C2 dagi Crh zondi (ACD Bio #316091-C2) va TSA Vivid Dye 620 bilan qayta ishladik. mCherry ni belgilash RNAscope protokoliga amal qilgan holda immunogistoximiya yordamida bajarildi. PBS da uch marta yuvilgandan so'ng, kesmalar 0.5% Triton-X100 (PBST) qo'shilgan PBS da 2 soat davomida o'tkazuvchanlashtirildi va PBST da suyultirilgan quyonning RFP ga qarshi birlamchi antitelalari (1:2000; Rockland Immunochemicals) bilan 4℃ da bir kecha davomida inkubatsiya qilindi. Keyingi kuni kesmalar PBS da 3 marta 10 daqiqadan yuvildi va xona haroratida 2 soat davomida Cy3 ulangan eshakning quyonre qarshi ikkilamchi antitelalarida (1:1000; JacksonImmuno Research) inkubatsiya qilindi. Ftoromunt yordamida o'rnatishdan oldin 30 soniya davomida DAPI qo'llandi. Tasvirlar Leica STELLARIS konfokal mikroskopi yordamida 20x kattalashtirishda olindi. Barcha tahlillar ImageJ dasturida bajarildi, shuningdek Vglut1 va Vgat ning AAVrg CRH+ hujayralari bilan kesishishi va mCherry musbat hujayralar ichidagi Crh ekspresiya darajalari ImageJ 1.54f versiyasi yordamida miqdoriy jihatdan baholandi.&lt;/p&gt;\n&lt;p&gt;vmPFC dagi Vglut1+ va Vglut1- hujayralarida Crh ekspresiyasini miqdoriy baholash uchun biz kesmalarni RNAscope to‘plami yordamida, C2 dagi Crh zondi (ACD Bio #316091-C2) va C1 dagi Vglut1 zondi (ACD Bio #501101) hamda mos ravishda TSA Vivid Dye 620 va 650 bilan qayta ishladik. Tasvirlar Leica STELLARIS konfokal mikroskopi yordamida 20x kattalashtirishda olindi. Barcha tahlillar ImageJ dasturida bajarildi, xususan, Crh eksprimatsiya qiluvchi hujayralar soni, shuningdek ularning ekspresiya darajalari — Vglut1+ va Vglut1- hujayralariga nisbatan hisoblangan holda miqdoriy baholandi. Miqdoriy baholash 20x da olingan tasvirlarda amalga oshirildi. Namuna tasvirlar 63x da olindi.&lt;/p&gt;\n&lt;h4 id=\"gistologiya\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#gistologiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gistologiya&lt;/span&gt;&lt;/a&gt;Gistologiya&lt;/h4&gt;\n&lt;p&gt;Sichqonlarning yurak ichiga 20 ml fosfat-buterli fiziologik eritma (PBS, Invitrogen), so'ngra 4% paraformaldegid (PFA; Electron Microscopy Sciences) yuborildi. Keyin miya olib tashlandi va PFA ga 24 soatga qo'yildi, shundan so'ng Optimal kesish harorati (OCT) qolipiga solib qotirishdan va -80℃ da saqlashdan oldin 3 kun davomida 30% saxaroza eritmasida saqlandi. 60 mkm qalinlikdagi kesmalar kriostat yordamida tayyorlandi. Barcha tajribalar uchun kesmalar PBST da 2 soat davomida o'tkazuvchanlashtirildi va PBST da suyultirilgan birlamchi antitelalar bilan 4°C da bir kecha davomida inkubatsiya qilindi. Keyingi kuni kesmalar PBS da 5 daqiqadan 3 marta yuvildi, xona haroratida PBST da suyultirilgan ikkilamchi antitelalar bilan 2 soat davomida inkubatsiya qilindi, PBS da 1:4000 nisbatda suyultirilgan DAPI da inkubatsiya qilindi hamda ftoromunt yordamida buyum oynaçalariga o'rnatilib yopqich oynaça bilan yopildi. Tasvirlar Leica DM6 skanerlovchi mikroskopi yoki Leica STELLARIS konfokal mikroskopi yordamida olindi.&lt;/p&gt;\n&lt;p&gt;Fig 2A, Fig 3D, S 3A, Fig S4A,B, D, Fig S5A-D, Fig S7B,C uchun tovuqning GFP ga qarshi birlamchi (1:2000; Aves Lab) va eshakning tovuqga qarshi Alexafluor 488 (1:1000; Jackson Immunoresearch) antitelalari ishlatildi. Fig S 3C uchun quyonning pCREB ga qarshi (1:500; Cell Signaling Technology) birlamchi antitelasi va Cy3 ulangan eshakning quyonre qarshi ikkilamchi antitelasi (1:100; JacksonImmuno Research, #711-165-152) ishlatildi. Fig 3D, Fig S5A-D, Fig 5F,M uchun quyonning Fos ga qarshi (1:1000; Synaptic Systems) birlamchi antitelasi va eshakning quyonre qarshi Alexa-Fluor 647 ikkilamchi antitelasi (1:1000; JacksonImmuno Research, #711-605-152) ishlatildi. Fig 1M, 4C, 5A,H, S2A, B, Fig S6A-C, Fig S8A,L, Fig S10A,B uchun quyonning RFP ga qarshi (1:2000; Rockland Immunochemicals) va Cy3 ulangan eshakning quyonre qarshi ikkilamchi antitelasi (1:1000, JacksonImmuno Research) ishlatildi.&lt;/p&gt;\n&lt;h4 id=\"miqdoriy-va-statistik-tahlil\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#miqdoriy-va-statistik-tahlil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MIQDORIY VA STATISTIK TAHLIL&lt;/span&gt;&lt;/a&gt;MIQDORIY VA STATISTIK TAHLIL&lt;/h4&gt;\n&lt;p&gt;Erkak va urg'ochi sichqonlar tajriba guruhlariga tasodifiy tartibda taqsimlandi, bu esa har bir guruhda ikkala jins vakillari bo'lishini ta'minladi. Manipulyatsiya uchun tajriba sharoitlari (masalan, nazorat va opsin) yosh va tug'ish bo'yicha mos keladigan nazorat guruhlarini yaratish uchun bir ona qornidan chiqqan jonivorlar o'rtasida taqsimlandi. Ma'lumotlarni yig'ish, shuningdek xulq-atvor bo'yicha video va tasvirlarni tahlil qilish tajriba guruhlaridan bexabar bo'lgan tadqiqotchilar tomonidan amalga oshirildi. Xulq-atvor ma'lumotlari avtomatlashtirilgan tahlil quvurlari yordamida tajriba sharoitlaridan bexabar holda tahlil qilindi. Tasvirlarni qo'lda tahlil qilish uchun tadqiqotchilar eksperimental ta'sirdan bexabar edilar.&lt;/p&gt;\n&lt;p&gt;Barcha statistik sinovlar GraphPad Prism (v10.3.1) yoki MATLAB (vR2022a, Mathworks) yordamida bajarildi. Bizning tanlama hajmimiz oldingi nashrlarda keltirilganlarga o'xshash; ammo ular statistik usullar bilan oldindan belgilanmagan. Umumlashtirilgan grafiklar o'rtacha qiymat ± o'rtachaning standart xatoligini ko'rsatadi. Normallikni aniqlash uchun Shapiro-Wilk testlari ishlatildi va agar normal emas deb topilsa, noparametrik testlar qo'llanildi. Statistik testlar va qiymatlar har bir rasm sarlavhasida keltirilgan. Juftlashtirilgan t-testlar ikki tomonlama bo'lgan va farqlar ahamiyatli deb topilgan.&lt;/p&gt;\n&lt;h4 id=\"xulq-atvor-tahlili\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#xulq-atvor-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulq-atvor tahlili&lt;/span&gt;&lt;/a&gt;Xulq-atvor tahlili&lt;/h4&gt;\n&lt;p&gt;PTA (PMA) ning yuqori aniqlikdagi videolari Chameleon3 USB kameralari (Teledyne FLIR) yordamida 50 Gts chastotada yozib olindi, videolardagi nuqtalarni kuzatish (treking) DeepLabCut v2.077 da amalga oshirildi va xulq-atvor BehaviorDEPOT v1.3b78 yordamida tahlil qilindi. Platformadagi vaqtni, platformaga kirish uchun latent davrni, harakatsizlanishni (freezing) va harakat tezligini aniqlash uchun maxsus MATLAB kodi ishlatildi. Ochiq maydon, baland krestsimon labirint, yangi hid testlari va RTPA veb-kamera yordamida tasvirga olindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;DeepLabCut va BehaviorDEPOT — bu hayvonlarning xulq-atvorini videolardan avtomatik kuzatish va miqdoriy tahlil qilish uchun kompyuter ko‘rish texnologiyalariga asoslangan zamonaviy dasturiy vositalar.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Yangi hid tajribasi eksperimentator tomonidan real vaqt rejimida yozib olindi. Ochiq maydon, baland krestsimon labirint va RTPA avtomatlashtirilgan video-kuzatuv dasturi BioViewer yordamida kuzatildi.&lt;/p&gt;\n&lt;h4 id=\"pma-paytida-tola-optik-fotometriya-yozuvlari\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#pma-paytida-tola-optik-fotometriya-yozuvlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PMA paytida tola-optik fotometriya yozuvlari&lt;/span&gt;&lt;/a&gt;PMA paytida tola-optik fotometriya yozuvlari&lt;/h4&gt;\n&lt;p&gt;Hayvonlar yozuvdan 1 kun oldin optik kabelga o‘rganishtirildi. PMA mashg‘uloti va uni esga tushirish jarayonida biz tijorat tola-optik fotometriya tizimi va RZ10x qulflash kuchaytirgichini (Tucker David Technologies) boshqaruvchi unga mos Synapse dasturiy ta'minoti yordamida BLA dagi GCaMP6s va nazorat flüoresansini bir vaqtning o‘zida tasvirga oldik. Ikki qo‘zg‘alish to‘lqin uzunligi (465 va 405 nm) 211 va 566 Gts chastotada modulyatsiya qilindi, filtrlandi va flüoresan minikub (Doric Lenses) yordamida birlashtirildi. Birlashtirilgan qo‘zg‘alish nuri 405 nm yadroli, 0,37 NA past flüoresanli orqali yetkazildi, past flüoresanli signal minikub orqali yig‘ildi va femtovatt fotoforqabul qilgichga (Newport, Model 2151, kuchaytirish DC LOW ga sozlangan) fokuslandi. LED quvvati shunday ediki, tizim mos ravishda 465 nm va 405 nm kanallari uchun 8- va yorug‘lik birliklarini qabul qildi. Flüoresans 1017 Gts chastotada oraliqqa bo‘lindi (diskretlashtirildi) va protsessor tomonidan demodulyatsiya qilindi. Eksperimentning boshlanishi va tugashi hamda har bir tonning boshlanish vaqti belgilari maxsus MATLAB eksperiment dizayneri (MathWorks) tomonidan yuborilgan tranzistor-tranzistor mantiqiy (TTL) impulslari yordamida yig‘ildi. Signallar Synapse dasturiy ta'minoti yordamida saqlandi va tahlil qilish uchun MATLAB ga eksport qilindi.&lt;/p&gt;\n&lt;h4 id=\"tola-optik-fotometriya-tahlili\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#tola-optik-fotometriya-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tola-optik fotometriya tahlili&lt;/span&gt;&lt;/a&gt;Tola-optik fotometriya tahlili&lt;/h4&gt;\n&lt;p&gt;Ma'lumotlar MATLAB da maxsus yozilgan quvur (pipeline) yordamida dastlabki qayta ishlandi. Tahlildan oldin signal 10 marta past chastotaga tushirildi (downsampled). polyfit funksiyasidan foydalangan holda izosbestik signal 405 nm signalga moslashtirildi va bu egri chiziq 465 nm kanalidan ayirib tashlandi. Tola-optik fotometriya va xulq-atvor ma'lumotlarini moslashtirish uchun har bir xulq-atvor kadrining qaysi fotometriya kadriga to‘g‘ri kelishini aniqlash uchun har bir TTL impulsi orasida chiziqli interpolyatsiyadan foydalangan holda moslashtirish jadvali tuzildi. Z-ballar ton boshlanishiga nisbatan -5 dan 0 s gacha bo‘lgan boshlang‘ich davr yordamida hisoblandi. Alohida hayvon uchun barcha izlarning o‘rtachasi hisoblandi va tahlil uchun ishlatildi. Grafiklar yaratish uchun har bir o‘rtacha iz har 0,5 s dagi qiymatlarni o‘rtachalashtirish orqali tekislandi va hayvonlar bo‘yicha tekislangan izlarning o‘rtacha ± standard xatoligi ko‘rsatildi. Shokga javob uchun egri chiziq ostidagi maydon (AUC) va cho‘qqi z-bali mos ravishda boshlanishidan keyin 0-15 s va 0-3 s davomida miqdoriy baholandi. So‘nish tezligi shokning cho‘qqi javobidan eksponensial egri chiziqni moslashtirish orqali o‘lchandi, so‘nish 1/τ sifatida miqdoriy ifodalanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Z-ball signal darajasini dastlabki fonga nisbatan standartlashtiradi, AUC esa vaqt davomida umumiy javob intensivligini jamlaydi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"pma-davrida-optogenetik-manipulyatsiya\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#pma-davrida-optogenetik-manipulyatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PMA davrida optogenetik manipulyatsiya&lt;/span&gt;&lt;/a&gt;PMA davrida optogenetik manipulyatsiya&lt;/h4&gt;\n&lt;p&gt;Barcha eksperimentlardan oldin sichqonlar optik kabelga (200 mkm yadro, 0.22 NA, Doric Lenses) o‘rganishtirildi. PMA ni esga tushirish paytida yoki mashg‘ulotning dastlabki uchta bazaviy toni davomida hech qanday optogenetik manipulyatsiya bajarilmadi. Inhibitorlik eksperimentlari uchun vmPFCCRH+ ning BLA ga proyektsiyalari shok davri va shok tugagandan keyin 13 s davomida (jami 15 s) BehaviorDEPOT qo‘rquv shartli reflekslari eksperimentatori MATLAB ilovasi tomonidan boshqariladigan ko‘k lazer (473 nm, doimiy; SLOC Lasers) bilan foto-tormozlandi (fotoinhibitsiya qilindi). Bu LBN sichqonlari ushbu davrda shokga javoban BLA da yuqori faollashuvni ko‘rsatganligini bildiruvchi umumiy fotometriya natijalari asosida tanlangan. Implantatsiyadan oldingi optik tola orqali o‘lchangan uzatilgan yorug‘lik quvvati 10 mVt yorug‘lik chiqishiga sozlangan. Rag‘batlantirish eksperimentlari uchun vmPFCCRH+ ning BLA ga proyektsiyalari xuddi shunday yorug‘lik quvvatiga ega ko‘k lazer (473 nm, 15 Gts, 50 ms impuls kengligi; SLOC Lasers) bilan foto-qo‘zg‘atildi.&lt;/p&gt;\n&lt;h4 id=\"ochiq-maydonda-optogenetik-manipulyatsiya\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#ochiq-maydonda-optogenetik-manipulyatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ochiq maydonda optogenetik manipulyatsiya&lt;/span&gt;&lt;/a&gt;Ochiq maydonda optogenetik manipulyatsiya&lt;/h4&gt;\n&lt;p&gt;PTA ni esga tushirishdan keyingi kuni hayvonlar alohida xonada 10 daqiqa davomida moslashtirildi. Ko‘k lazerga ulangandan so‘ng (inhibitsiya: 473 nm, doimiy; stimulyatsiya: 473 nm, 15 Gts), sichqonlar ochiq maydon arenasiga joylashtirildi. Optogenetik manipulyatsiya 1 daqiqalik bazaviy davrdan keyin boshlandi, undan so‘ng sakkizta navbatma-navbat 30 s li lazer yoqish/o‘chirish davrlari bajarildi va stimulyatsiyasiz 60 s li davr bilan yakunlandi, seansning umumiy davomiyligi 10 daqiqani tashkil etdi.&lt;/p&gt;\n&lt;h4 id=\"butun-miyani-tahlil-qilish\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#butun-miyani-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Butun miyani tahlil qilish&lt;/span&gt;&lt;/a&gt;Butun miyani tahlil qilish&lt;/h4&gt;\n&lt;p&gt;Butun miya bo'ylab hujayralar zichligini tekislash va miqdorini aniqlash uchun DeepCOUNT79 tahlil quvuri (pipeline) ishlatildi. Qisqacha aytganda, har bir miyaning 640 nm kanalidan olingan butun miya tasvirlari to'plami Ai14 yordamida o'qitilgan model yordamida TrailMap'da segmentatsiya qilindi. Tasvirlar 488 nm autoflyutressensiya kanali yordamida elastix va transformix yordamida standart miyaga ro'yxatga olindi. O'zgartirilgan ehtimollik xaritasining 3D maksimumlarini aniqlash uchun MATLAB (Mathworks) ishlatildi. Bir nechta pikseldan iborat bo'lgan har qanday maksimumlarni har bir hujayra uchun bitta pikselsgacha qisqartirish uchun ulangan komponentlar tahlili qo'llanildi.&lt;/p&gt;\n&lt;h4 id=\"hujayralarni-miqdoriy-aniqlash\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#hujayralarni-miqdoriy-aniqlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hujayralarni miqdoriy aniqlash&lt;/span&gt;&lt;/a&gt;Hujayralarni miqdoriy aniqlash&lt;/h4&gt;\n&lt;p&gt;Regiondagi CRH+ hujayralar zichligi MATLAB'da har bir miya sohasidagi belgilangan piksellar (ya'ni hujayralar) sonini hisoblash, so'ngra bu piksel sonini sohadagi piksellarning umumiy soniga bo'lish yo'li bilan miqdoriy baholandi. Hududlar LSFM atlasining qisqartirilgan versiyasi yordamida aniqlandi, bunda maksimal granulyarlik kichik miya sohalarini noto'g'ri miqdoriy baholashga olib keladigan ro'yxatga olishdagi kichik farqlarni hisobga olish zarurati bilan muvozanatlandi. Ushbu atlas bizning ma'lumotlarimizda ko'rinadigan to'qimalar miqdoriga mos kelishi uchun oldingi va orqa uchlaridan qirqib tashlandi. Oq modda traktlari, qorincha tizimi, miyachka va hidoyat piyozchasi tahlildan chiqarib tashlandi. Statistik tahlil uchun biz BLA ga proyeksiya qilishi va CRH+ hujayra populyatsiyalarini o'z ichiga olishi ma'lum bo'lgan hududlarga e'tibor qaratdik. Miya sohalari orasidagi sezilarli farqlarni aniqlash uchun post-hoc ko'prik taqqoslash tuzatishi bilan ikki omilli takroriy o'lchovlar ANOVA bajarildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ikki omilli takroriy o'lchovlar ANOVA — bu bir xil obyektga ikki omilning ta'sirini turli vaqtlarda yoki sharoitlarda baholash uchun statistik usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"real-vaqtda-joyni-afzal-korish-paytidagi-optogenetik-manipulyatsiya\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#real-vaqtda-joyni-afzal-korish-paytidagi-optogenetik-manipulyatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Real vaqtda joyni afzal ko'rish paytidagi optogenetik manipulyatsiya&lt;/span&gt;&lt;/a&gt;Real vaqtda joyni afzal ko'rish paytidagi optogenetik manipulyatsiya&lt;/h4&gt;\n&lt;p&gt;vmPFCCRH+ proyeksiya optogenetik manipulyatsiyasi PMA'dan tashqari xulq-atvorga ta'sir qilishini aniqlash uchun barcha optogenetik tajribalar uchun PMA olingandan keyingi kuni RTPP testlari o'tkazildi. Moviy nurga ulangandan so'ng (tormozlanish: 473 nm; doimiy; stimulyatsiya: 473 nm; 15 Gts), sichqonlar joyni afzal ko'rish kamerasiga (68 sm × 23 sm) 20 min davomida joylashtirildi. Birinchi 10 daqiqalik bazaviy davrda sichqonlarga qurilmani erkin o'rganishga ruxsat berildi va harakatni kuzatish hamda kameraning qaysi yarmini afzal ko'rishini aniqlash uchun BioViewer dasturidan foydalanildi. Bu kameraning qaysi yarmi lazer stimulyatsiyasi yoki tormozlanishini olishini aniqlash uchun ishlatildi. Keyingi 10 daqiqa davomida lazer nuri kamerasining afzal ko'rilgan tomoniga (stimulyatsiya) yoki afzal ko'rilmagan tomoniga (tormozlanish) berildi. Natijalar boshlang'ich darajadan foiz o'zgarishi sifatida hisoblandi (test - baza / baza × 100). Kod va ma'lumotlarning mavjudligi. Ushbu maqolada keltirilgan barcha ma'lumotlar so'rov bo'yicha mas'ul shaxs tomonidan taqdim etiladi. Xulq-atvor ma'lumotlarini tahlil qilish uchun ishlatiladigan BehaviorDEPOT https://github.com/DeNardoLab/BehaviorDEPOT manzilida mavjud. Butun miya hujayralari zichligini tahlil qilish uchun ishlatiladigan DeepCOUNT https://github.com/DeNardoLab/DeepTraCE manzilida mavjud. Qolgan barcha asl kod Github'da joylashtirilgan va chop etilgan sanadan boshlab ochiq foydalanish mumkin. Ushbu maqolada keltirilgan ma'lumotlarni qayta tahlil qilish uchun zarur bo'lgan har qanday qo'shimcha ma'lumot so'rov bo'yicha mas'ul shaxs tomonidan taqdim etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;erta stress va&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;o'smirlik&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qo'rquvi&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opac
