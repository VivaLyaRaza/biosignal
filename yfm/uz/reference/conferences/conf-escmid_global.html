        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Konferensiyalar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;европейский конгресс клинической микробиологии и инфекций&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;европейский конгресс клинической микробиологии и инфекций&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima olamiz&lt;/td&gt;\n&lt;td&gt;устойчивость к антибиотикам, новые инфекции&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-immunity.html\"&gt;Mikroblar va immunitet&lt;/a&gt;, &lt;a href=\"concepts/spec-health.html\"&gt;Infeksiyalar va epidemiologiya&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-konferensiya\"&gt;&lt;a href=\"reference/conferences/conf-escmid_global.html#bu-qanday-konferensiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday konferensiya&lt;/span&gt;&lt;/a&gt;Bu qanday konferensiya&lt;/h2&gt;\n&lt;p&gt;ESCMID Global — klinik mikrobiologiya va infeksion kasalliklarga bag‘ishlangan eng yirik yillik xalqaro kongressdir. Tadbir butun dunyo olimlari, shifokorlar, epidemiologlar va tibbiy texnologiyalar ishlab chiquvchilarini birlashtiradi. Konferensiyaning asosiy maqsadi — infeksiyalarni tashxislash, davolash va oldini olish bo‘yicha ilg‘or tajriba almashish, shuningdek, antibiotiklarga chidamlilik kabi global tahdidlarga qarshi yechimlar izlashdir.&lt;/p&gt;\n&lt;h2 id=\"tashkilotchilar-va-tarix\"&gt;&lt;a href=\"reference/conferences/conf-escmid_global.html#tashkilotchilar-va-tarix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashkilotchilar va tarix&lt;/span&gt;&lt;/a&gt;Tashkilotchilar va tarix&lt;/h2&gt;\n&lt;p&gt;Kongress Yevropa klinik mikrobiologiya va infeksion kasalliklar jamiyati (ESCMID) tomonidan o‘tkaziladi. Bu Yevropada ilmiy tadqiqotlar va klinik standartlarni muvofiqlashtiruvchi nufuzli professional tashkilotdir. Tadbir tarixi o‘nlab yillarni o‘z ichiga oladi, bu davr mobaynida u mintaqaviy uchrashuvdan infeksionologiyaning kelgusi yillardagi rivojlanish vektorlarini belgilovchi global platformaga aylandi.&lt;/p&gt;\n&lt;h2 id=\"mavzular-va-seksiyalar\"&gt;&lt;a href=\"reference/conferences/conf-escmid_global.html#mavzular-va-seksiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavzular va seksiyalar&lt;/span&gt;&lt;/a&gt;Mavzular va seksiyalar&lt;/h2&gt;\n&lt;p&gt;ESCMID Global dasturi mikroorganizmlar va organizmning immun javobi bilan bog‘liq keng ko‘lamli fanlarni qamrab oladi. Asosiy yo‘nalishlarga quyidagilar kiradi:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Antimikrob rezistentlik: Acinetobacter baumannii kabi chidamli bakteriyalarga qarshi kurashishning yangi strategiyalarini izlash.&lt;/li&gt;\n&lt;li&gt;Immuniteti susaygan bemorlardagi infeksiyalar: a’zolar transplantatsiyasi qilingan bemorlarda qon oqimi infeksiyalarini davolash xususiyatlari.&lt;/li&gt;\n&lt;li&gt;Yangi diagnostika texnologiyalari: antibiotiklarga sezgirlikni aniqlashning tezkor fenotipik usullarini joriy etish.&lt;/li&gt;\n&lt;li&gt;Epidemiologiya va jamoat salomatligi: Balamuthia mandrillaris kabi kamyob va xavfli patogenlarni monitoring qilish hamda ekspress-diagnostika tizimlarini ishlab chiqish.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u-yerda-nimalar-paydo-boladi\"&gt;&lt;a href=\"reference/conferences/conf-escmid_global.html#u-yerda-nimalar-paydo-boladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;U yerda nimalar paydo bo‘ladi&lt;/span&gt;&lt;/a&gt;U yerda nimalar paydo bo‘ladi&lt;/h2&gt;\n&lt;p&gt;Konferensiyada fundamental va amaliy tadqiqotlar natijalari taqdim etiladi. Bu yerda OIV, sil va bezgakni bir vaqtning o‘zida tashxislash uchun CRISPR bazasidagi test-tizimlarini yaratish kabi yutuqlar muhokama qilinadi. Shuningdek, onkologiyani davolashda T-hujayralarini faollashtirish uchun bispesifik antitanachalardan foydalanish kabi yangi davolash yondashuvlari ko‘rib chiqiladi. Konferensiya mikrobiom va artrit yoki steatohepatit kabi tizimli kasalliklar o‘rtasidagi bog‘liqlikni muhokama qilish uchun maydoncha bo‘lib xizmat qiladi.&lt;/p&gt;\n&lt;h2 id=\"qanday-kuzatish-va-ishtirok-etish\"&gt;&lt;a href=\"reference/conferences/conf-escmid_global.html#qanday-kuzatish-va-ishtirok-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday kuzatish va ishtirok etish&lt;/span&gt;&lt;/a&gt;Qanday kuzatish va ishtirok etish&lt;/h2&gt;\n&lt;p&gt;ESCMID Global’da ishtirok etish ham kunduzgi, ham masofaviy formatda mumkin. Kongress materiallari, shu jumladan ma’ruzalar tezislari va asosiy sessiyalar yozuvlari ixtisoslashgan ilmiy nashrlarda va jamiyatning rasmiy portalida e’lon qilinadi. Mutaxassislar uchun bu kelajakda klinik amaliyot standartiga aylanadigan yangi davolash protokollari va texnologik innovatsiyalar haqidagi asosiy axborot manbaidir.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/conferences/conf-escmid_global.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D1%82%D0%BE%D0%BC%D0%B0%2C_%D0%98%D0%B3%D0%BE%D1%80%D1%8C_%D0%9E%D0%BB%D0%B5%D0%B3%D0%BE%D0%B2%D0%B8%D1%87\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Стома, Игорь Олегович — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1007/s40265-024-02104-6\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Treatment Approaches for Carbapenem-Resistant Acinetobacter baumannii Infections&lt;/a&gt; — sharh, Drugs 2025&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/jacamr/dlae152\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Multidrug-resistant organism bloodstream infections in solid organ transplant recipients and impact on mortality: a systematic review&lt;/a&gt; — sharh, JAC Antimicrob Resist 2024&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1128/jcm.00674-25\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Emerging technologies for rapid phenotypic antimicrobial susceptibility testing of clinical isolates of bacteria&lt;/a&gt; — sharh, J Clin Microbiol 2025&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Konferensiyalar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"европейский конгресс клинической микробиологии и инфекций"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"ESCMID Global","description":"европейский конгресс клинической микробиологии и инфекций","vcsPath":"reference/conferences/conf-escmid_global.md"},"headings":[{"title":"Bu qanday konferensiya","href":"reference/conferences/conf-escmid_global.html#bu-qanday-konferensiya","level":2},{"title":"Tashkilotchilar va tarix","href":"reference/conferences/conf-escmid_global.html#tashkilotchilar-va-tarix","level":2},{"title":"Mavzular va seksiyalar","href":"reference/conferences/conf-escmid_global.html#mavzular-va-seksiyalar","level":2},{"title":"U yerda nimalar paydo bo‘ladi","href":"reference/conferences/conf-escmid_global.html#u-yerda-nimalar-paydo-boladi","level":2},{"title":"Qanday kuzatish va ishtirok etish","href":"reference/conferences/conf-escmid_global.html#qanday-kuzatish-va-ishtirok-etish","level":2},{"title":"Manbalar","href":"reference/conferences/conf-escmid_global.html#manbalar","level":2}],"title":"ESCMID Global"},"router":{"pathname":"reference/conferences/conf-escmid_global","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-
