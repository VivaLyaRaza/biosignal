        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Konferensiyalar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;стволовые клетки и регенеративная медицина&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;стволовые клетки и регенеративная медицина&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima olamiz&lt;/td&gt;\n&lt;td&gt;органоиды, клеточная терапия&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-cells.html\"&gt;Hujayralar va molekulalar&lt;/a&gt;, &lt;a href=\"concepts/spec-biotech.html\"&gt;Biotexnologiyalar&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"umumiy-korinish\"&gt;&lt;a href=\"reference/conferences/conf-isscr_annual_meeting.html#umumiy-korinish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy ko'rinish&lt;/span&gt;&lt;/a&gt;Umumiy ko'rinish&lt;/h2&gt;\n&lt;p&gt;ISSCR Annual Meeting — bu Xalqaro o'zak hujayralarni tadqiq qilish jamiyati (International Society for Stem Cell Research) tomonidan o'tkaziladigan yillik xalqaro konferensiya. Bu biologiya olamidagi muhim voqea bo'lib, unda olimlar, shifokorlar va biotexnologlar regenerativ tibbiyot sohasidagi yutuqlarni muhokama qilishadi.&lt;/p&gt;\n&lt;h2 id=\"qanday-tuzilgan\"&gt;&lt;a href=\"reference/conferences/conf-isscr_annual_meeting.html#qanday-tuzilgan\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday tuzilgan&lt;/span&gt;&lt;/a&gt;Qanday tuzilgan&lt;/h2&gt;\n&lt;p&gt;Konferensiya hujayra hayotining fundamental mexanizmlari atrofida qurilgan. Ishtirokchilar o'zak hujayralarning differensiatsiyasi, ularning o'zini yangilash qobiliyati va mikro-muhit bilan o'zaro ta'siri bo'yicha tadqiqot natijalarini taqdim etadilar. Asosiy e'tibor nazariy bilimlarni amaliy tibbiy yechimlarga o'tkazishga qaratilgan.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"reference/conferences/conf-isscr_annual_meeting.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;ISSCRda hujayra materialini boshqarishning ilg'or usullari muhokama qilinadi. Bularga genomni tahrirlash texnologiyalari, hujayra ichidagi jarayonlarni vizualizatsiya qilish va terapevtik agentlarni yetkazib berish usullari kiradi. Olimlar oqsillarni kuzatish uchun molekulyar zondlar va murakkab biologik tuzilmalarni modellashtirish algoritmlaridan foydalanish bo'yicha tajriba almashadilar.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"reference/conferences/conf-isscr_annual_meeting.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;Konferensiyada taqdim etilgan tadqiqot natijalari biotibbiyotning turli sohalarida qo'llaniladi. Masalan, \"SpiraMed spiral kateteri: dori vositalarini to'g'ridan-to'g'ri miyaga yetkazib berishning yangi usuli\" maqolasida tasvirlangan hujayra terapiyasini miyaga yetkazib berish bo'yicha ishlanmalar regenerativ tibbiyot tamoyillariga asoslanadi. Shuningdek, \"DNK-konstruktoridagi bitta detal gen terapiyasi uchun dori ishlab chiqarishni qanday buzadi\" materialida muhokama qilingan genetik konstruksiyalarni nozik sozlash usullari virusli vektorlarni yaratishda juda muhimdir. Bundan tashqari, \"CRISPR mRNKni metastazlar yo'lini unutishga qanday majbur qiladi\" maqolasida keltirilgan hujayralar migratsiyasi mexanizmlarini tushunish onkologik kasalliklarga qarshi kurashish usullarini ishlab chiqish uchun poydevor hisoblanadi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar\"&gt;&lt;a href=\"reference/conferences/conf-isscr_annual_meeting.html#cheklovlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar&lt;/span&gt;&lt;/a&gt;Cheklovlar&lt;/h2&gt;\n&lt;p&gt;Jadal rivojlanishga qaramay, soha bir qator to'siqlarga duch kelmoqda. Asosiy qiyinchiliklar embrional hujayralardan foydalanishning axloqiy masalalari, hujayrali mahsulotlar ishlab chiqarish protokollarini standartlashtirish zarurati va klinik sinovlar paytida bemorlar xavfsizligini ta'minlash bilan bog'liq.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Konferensiyalar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"стволовые клетки и регенеративная медицина"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"ISSCR Annual Meeting","description":"стволовые клетки и регенеративная медицина","vcsPath":"reference/conferences/conf-isscr_annual_meeting.md"},"headings":[{"title":"Umumiy ko'rinish","href":"reference/conferences/conf-isscr_annual_meeting.html#umumiy-korinish","level":2},{"title":"Qanday tuzilgan","href":"reference/conferences/conf-isscr_annual_meeting.html#qanday-tuzilgan","level":2},{"title":"Usullar va vositalar","href":"reference/conferences/conf-isscr_annual_meeting.html#usullar-va-vositalar","level":2},{"title":"Qayerda qo'llaniladi","href":"reference/conferences/conf-isscr_annual_meeting.html#qayerda-qollaniladi","level":2},{"title":"Cheklovlar","href":"reference/conferences/conf-isscr_annual_meeting.html#cheklovlar","level":2}],"title":"ISSCR Annual Meeting"},"router":{"pathname":"reference/conferences/conf-isscr_annual_meeting","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
