        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Konferensiyalar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;крупнейший съезд нейробиологов (Society for Neuroscience)&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;крупнейший съезд нейробиологов (Society for Neuroscience)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima olamiz&lt;/td&gt;\n&lt;td&gt;тренды нейронауки, свежие тезисы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-brain.html\"&gt;Miya va asab tizimi&lt;/a&gt;, &lt;a href=\"concepts/spec-mind.html\"&gt;Ruhiyat va xulq-atvor&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"konferensiya-nima\"&gt;&lt;a href=\"reference/conferences/conf-sfn_neuroscience.html#konferensiya-nima\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Konferensiya nima&lt;/span&gt;&lt;/a&gt;Konferensiya nima&lt;/h2&gt;\n&lt;p&gt;SfN Neuroscience — bu Neyrofanlar jamiyati (Society for Neuroscience) tomonidan tashkil etiladigan yillik xalqaro konferensiya. Bu miya va asab tizimini o‘rganish sohasida ishlaydigan o‘n minglab tadqiqotchilar, shifokorlar va ishlab chiquvchilarni birlashtiruvchi dunyodagi eng yirik ilmiy tadbirdir. Konferensiya ma’lumotlar almashinuvi, ilg‘or metodikalarni muhokama qilish va neyrobiologiyaning kelgusi yillardagi yo‘nalishlarini belgilash uchun asosiy maydon hisoblanadi.&lt;/p&gt;\n&lt;h2 id=\"tashkilotchilar-va-tarix\"&gt;&lt;a href=\"reference/conferences/conf-sfn_neuroscience.html#tashkilotchilar-va-tarix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashkilotchilar va tarix&lt;/span&gt;&lt;/a&gt;Tashkilotchilar va tarix&lt;/h2&gt;\n&lt;p&gt;Tashkilotchi — 1969-yilda tashkil etilgan notijorat tashkilot bo‘lgan Neyrofanlar jamiyati. Uning maqsadi miya va asab tizimi bo‘yicha fundamental tadqiqotlarni rivojlantirish hamda ilmiy ta’limni qo‘llab-quvvatlashdan iborat. Konferensiya har yili Shimoliy Amerikaning turli shaharlarida o‘tkaziladi va organizmning barcha tizimlarini boshqaruvchi asab tizimining yaxlit tabiatini muhokama qilish uchun ekspertlarni to‘playdi.&lt;/p&gt;\n&lt;h2 id=\"mavzular-va-seksiyalar\"&gt;&lt;a href=\"reference/conferences/conf-sfn_neuroscience.html#mavzular-va-seksiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavzular va seksiyalar&lt;/span&gt;&lt;/a&gt;Mavzular va seksiyalar&lt;/h2&gt;\n&lt;p&gt;Konferensiya dasturi neyrofanlarning barcha spektrini qamrab oladi: molekulyar biologiyadan kognitiv psixologiyagacha. Asosiy yo‘nalishlar:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Molekulyar va hujayraviy mexanizmlar: genetik mutatsiyalar (masalan, AKAP11) va ularning neyronlar faoliyatiga ta’siri, shuningdek, Goshe kasalligi kabi kam uchraydigan kasalliklarni o‘rganish.&lt;/li&gt;\n&lt;li&gt;Miya rivojlanishi: neyron aloqalarining shakllanishini tahlil qilish, shu jumladan o‘zak hujayralardan «mini-miya»lar yaratish.&lt;/li&gt;\n&lt;li&gt;Kognitiv jarayonlar: xotira mexanizmlari, xotiralarning vizual detallarini qayta tiklash va chaqaloqlarning nutqni idrok etishi.&lt;/li&gt;\n&lt;li&gt;Klinik neyrobiologiya: ruhiy buzilishlar (DEHB, depressiya, autizm) va diabet kabi somatik kasalliklar o‘rtasidagi bog‘liqlik, gen terapiyasi usullarini ishlab chiqish.&lt;/li&gt;\n&lt;li&gt;Neyrotexnologiyalar: Altsgeymer va Parkinson kabi neyrodegenerativ kasalliklarning umumiy biologik belgilarini aniqlash uchun miya atlaslarini yaratish.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u-yerda-nimalar-paydo-boladi\"&gt;&lt;a href=\"reference/conferences/conf-sfn_neuroscience.html#u-yerda-nimalar-paydo-boladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;U yerda nimalar paydo bo‘ladi&lt;/span&gt;&lt;/a&gt;U yerda nimalar paydo bo‘ladi&lt;/h2&gt;\n&lt;p&gt;SfN Neuroscience — bu keng ko‘lamli tadqiqotlar natijalari birinchi marta e’lon qilinadigan joy. Aynan shu yerda ilmiy hamjamiyat kasalliklarning yangi modellari, klinik sinovlar natijalari va miyani vizualizatsiya qilishning innovatsion usullari bilan tanishadi. Konferensiya ochiq ma’lumotlar (Open Data) madaniyatini rivojlantirishga yordam beradi, bu esa olimlarga miya zaifligini xaritalash yoki erta stressning prefrontal korteks va amigdalaga ta’sirini o‘rganish kabi murakkab vazifalarni hal qilishda kuchlarni birlashtirish imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"qanday-kuzatish-va-ishtirok-etish\"&gt;&lt;a href=\"reference/conferences/conf-sfn_neuroscience.html#qanday-kuzatish-va-ishtirok-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday kuzatish va ishtirok etish&lt;/span&gt;&lt;/a&gt;Qanday kuzatish va ishtirok etish&lt;/h2&gt;\n&lt;p&gt;Konferensiyada ishtirok etish kunduzgi va masofaviy formatlarda mumkin. Natijalarni kuzatishning asosiy usullari:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Tezislarni (Abstracts) o‘rganish: har yili joriy tadqiqotlar bo‘yicha qisqacha hisobotlarning ulkan massivi nashr etiladi.&lt;/li&gt;\n&lt;li&gt;Profil nashrlari: SfNda taqdim etilgan ko‘plab ma’ruzalar keyinchalik yetakchi ilmiy jurnallardagi maqolalar uchun asos bo‘lib xizmat qiladi.&lt;/li&gt;\n&lt;li&gt;Hamjamiyat resurslari: Neyrofanlar jamiyatining rasmiy sayti konferensiya arxivlari, ta’lim materiallari va neyrobiologiyadagi asosiy tendensiyalar haqidagi yangiliklarga kirish imkonini beradi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/conferences/conf-sfn_neuroscience.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9D%D0%B5%D1%80%D0%B2%D0%BD%D0%B0%D1%8F_%D1%81%D0%B8%D1%81%D1%82%D0%B5%D0%BC%D0%B0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Нервная система — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1007/s12021-021-09533-8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Promoting FAIR Data Through Community-driven Agile Design: the Open Data Commons for Spinal Cord Injury (odc-sci.org)&lt;/a&gt; — sharh, Neuroinformatics 2022&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1007/s12021-008-9019-9\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Domain-specific data sharing in neuroscience: what do we have to learn from each other?&lt;/a&gt; — sharh, Neuroinformatics 2008&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Konferensiyalar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"крупнейший съезд нейробиологов (Society for Neuroscience)"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"SfN Neuroscience","description":"крупнейший съезд нейробиологов (Society for Neuroscience)","vcsPath":"reference/conferences/conf-sfn_neuroscience.md"},"headings":[{"title":"Konferensiya nima","href":"reference/conferences/conf-sfn_neuroscience.html#konferensiya-nima","level":2},{"title":"Tashkilotchilar va tarix","href":"reference/conferences/conf-sfn_neuroscience.html#tashkilotchilar-va-tarix","level":2},{"title":"Mavzular va seksiyalar","href":"reference/conferences/conf-sfn_neuroscience.html#mavzular-va-seksiyalar","level":2},{"title":"U yerda nimalar paydo bo‘ladi","href":"reference/conferences/conf-sfn_neuroscience.html#u-yerda-nimalar-paydo-boladi","level":2},{"title":"Qanday kuzatish va ishtirok etish","href":"reference/conferences/conf-sfn_neuroscience.html#qanday-kuzatish-va-ishtirok-etish","level":2},{"title":"Manbalar","href":"reference/conferences/conf-sfn_neuroscience.html#manbalar","level":2}],"title":"SfN Neuroscience"},"router":{"pathname":"reference/conferences/conf-sfn_neuroscience","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
