        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Konferensiyalar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;узкие симпозиумы по молекулярной биологии и иммунологии&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;узкие симпозиумы по молекулярной биологии и иммунологии&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima olamiz&lt;/td&gt;\n&lt;td&gt;передний край фундаментальной науки&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-cells.html\"&gt;Hujayralar va molekulalar&lt;/a&gt;, &lt;a href=\"concepts/spec-immunity.html\"&gt;Mikroblar va immunitet&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"konferensiya-nima\"&gt;&lt;a href=\"reference/conferences/conf-keystone_symposia.html#konferensiya-nima\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Konferensiya nima&lt;/span&gt;&lt;/a&gt;Konferensiya nima&lt;/h2&gt;\n&lt;p&gt;Keystone Symposia — bu molekulyar biologiya, immunologiya va biotibbiyotning fundamental masalalariga bag'ishlangan tor doiradagi ilmiy konferensiyalar seriyasidir. Butun sohalarni qamrab oluvchi yirik kongresslardan farqli o'laroq, bu simpoziumlar aniq molekulyar mexanizmlar va hujayra jarayonlariga e'tibor qaratadi. Bu olimlar fan «oldingi chizig'i»ni — hali darsliklarga kirmagan, ammo hayotni molekulyar darajada tushunishimizni o'zgartirayotgan tadqiqotlarni muhokama qiladigan maydondir.&lt;/p&gt;\n&lt;h2 id=\"tashkilotchilar-va-tarix\"&gt;&lt;a href=\"reference/conferences/conf-keystone_symposia.html#tashkilotchilar-va-tarix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashkilotchilar va tarix&lt;/span&gt;&lt;/a&gt;Tashkilotchilar va tarix&lt;/h2&gt;\n&lt;p&gt;Keystone Symposia tashkiloti tadqiqotchilarga samimiy muhitda chuqur bilim almashish imkoniyatini berish uchun yaratilgan. Asosiy maqsad — biologlar, kimyogarlar va shifokorlar o'rtasida fanlararo hamkorlikni rivojlantirish. Konferensiyalar shunchaki rasmiy hisobotlar emas, balki munozaralarni rag'batlantiradigan formatlarda o'tkaziladi.&lt;/p&gt;\n&lt;h2 id=\"mavzular-va-seksiyalar\"&gt;&lt;a href=\"reference/conferences/conf-keystone_symposia.html#mavzular-va-seksiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavzular va seksiyalar&lt;/span&gt;&lt;/a&gt;Mavzular va seksiyalar&lt;/h2&gt;\n&lt;p&gt;Simpoziumlar dasturi strukturaviy biologiya va genetikadan tortib, organizmning immun javoblarigacha bo'lgan keng qamrovli mavzularni o'z ichiga oladi. Asosiy yo'nalishlar:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Kasalliklarning molekulyar mexanizmlari (masalan, steatogepatit).&lt;/li&gt;\n&lt;li&gt;Gen terapiyasi va virusli vektorlarni yaratish.&lt;/li&gt;\n&lt;li&gt;Immunologiya: neytrofillar, T-hujayralar va onkologiyaga qarshi kurash mexanizmlari.&lt;/li&gt;\n&lt;li&gt;Bioinformatika va ma'lumotlarni tahlil qilish algoritmlari.&lt;/li&gt;\n&lt;li&gt;Mikrobiologiya va patogenlarni o'rganish.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u-yerda-nimalar-paydo-boladi\"&gt;&lt;a href=\"reference/conferences/conf-keystone_symposia.html#u-yerda-nimalar-paydo-boladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;U yerda nimalar paydo bo'ladi&lt;/span&gt;&lt;/a&gt;U yerda nimalar paydo bo'ladi&lt;/h2&gt;\n&lt;p&gt;Keystone Symposia'da keyinchalik ilg'or texnologiyalarning asosiga aylanadigan natijalar birinchi marta e'lon qilinadi. Bu yerda quyidagilar muhokama qilinadi:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fold'EM kabi yangi algoritmlar.&lt;/li&gt;\n&lt;li&gt;Saraton terapiyasida T-hujayralarining «uyqu» holati va ularni faollashtirish usullari.&lt;/li&gt;\n&lt;li&gt;RNK biologiyasidagi kashfiyotlar, jumladan DNKsiz oqsil kodlay oladigan RNKlar.&lt;/li&gt;\n&lt;li&gt;Gen terapiyasi uchun genetik nuqsonlarni tuzatish usullari.&lt;/li&gt;\n&lt;li&gt;Noyob amebalar uchun ekspress-testlar kabi yangi diagnostika yondashuvlari.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qanday-kuzatish-va-ishtirok-etish\"&gt;&lt;a href=\"reference/conferences/conf-keystone_symposia.html#qanday-kuzatish-va-ishtirok-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday kuzatish va ishtirok etish&lt;/span&gt;&lt;/a&gt;Qanday kuzatish va ishtirok etish&lt;/h2&gt;\n&lt;p&gt;Simpoziumlarda ishtirok etish muhokama qilinayotgan sohada chuqur ekspertizani talab qiladi. Tadqiqotchilar uchun bu o'z ma'lumotlarini jahon darajasidagi hamkasblariga taqdim etish imkoniyatidir. Ilm-fanni kuzatib boruvchilar uchun konferensiya materiallari kelgusi yillarda qaysi yo'nalishlar ustunlik qilishini ko'rsatuvchi indikator hisoblanadi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/conferences/conf-keystone_symposia.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D1%82%D0%B5%D1%84%D0%B0%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%2C_%D0%93%D1%80%D0%B5%D0%B3%D0%BE%D1%80%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Стефанопулос, Грегори — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1002/pro.5560040502\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The metzincins--topological and sequential relations between the astacins, adamalysins, serralysins, and matrixins (collagenases) define a superfamily of zinc-peptidases&lt;/a&gt; — sharh, Protein Sci 1995&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nrendo.2017.42\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Endocrine-disrupting chemicals and fatty liver disease&lt;/a&gt; — sharh, Nat Rev Endocrinol 2017&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1084/jem.20091903\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Regulation of pathogenesis and immunity in helminth infections&lt;/a&gt; — sharh, J Exp Med 2009&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Konferensiyalar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"узкие симпозиумы по молекулярной биологии и иммунологии"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Keystone Symposia","description":"узкие симпозиумы по молекулярной биологии и иммунологии","vcsPath":"reference/conferences/conf-keystone_symposia.md"},"headings":[{"title":"Konferensiya nima","href":"reference/conferences/conf-keystone_symposia.html#konferensiya-nima","level":2},{"title":"Tashkilotchilar va tarix","href":"reference/conferences/conf-keystone_symposia.html#tashkilotchilar-va-tarix","level":2},{"title":"Mavzular va seksiyalar","href":"reference/conferences/conf-keystone_symposia.html#mavzular-va-seksiyalar","level":2},{"title":"U yerda nimalar paydo bo'ladi","href":"reference/conferences/conf-keystone_symposia.html#u-yerda-nimalar-paydo-boladi","level":2},{"title":"Qanday kuzatish va ishtirok etish","href":"reference/conferences/conf-keystone_symposia.html#qanday-kuzatish-va-ishtirok-etish","level":2},{"title":"Manbalar","href":"reference/conferences/conf-keystone_symposia.html#manbalar","level":2}],"title":"Keystone Symposia"},"router":{"pathname":"reference/conferences/conf-keystone_symposia","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
