        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Kasblar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;изучает бактерии, вирусы и микробиомы, ищет новые антибиотики&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima bilan shug'ullanadi&lt;/td&gt;\n&lt;td&gt;изучает бактерии, вирусы и микробиомы, ищет новые антибиотики&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nimani bilish kerak&lt;/td&gt;\n&lt;td&gt;культивирование, секвенирование, биобезопасность&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-immunity.html\"&gt;Mikroblar va immunitet&lt;/a&gt;, &lt;a href=\"concepts/spec-health.html\"&gt;Infeksiyalar va epidemiologiya&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"umumiy-korinish\"&gt;&lt;a href=\"reference/professions/prof-microbiologist.html#umumiy-korinish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy ko'rinish&lt;/span&gt;&lt;/a&gt;Umumiy ko'rinish&lt;/h2&gt;\n&lt;p&gt;Mikrobiolog — bu bakteriyalar, viruslar, zamburug'lar va sodda organizmlar kabi mikroskopik hayot shakllarini o'rganadigan mutaxassis. Zamonaviy fanda mikrobiologning diqqat markazi turlarni oddiy tasvirlashdan mikroorganizmlarning inson va atrof-muhit bilan o'zaro ta'sirini chuqur tahlil qilishga o'tdi.&lt;/p&gt;\n&lt;h2 id=\"qanday-tuzilgan\"&gt;&lt;a href=\"reference/professions/prof-microbiologist.html#qanday-tuzilgan\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday tuzilgan&lt;/span&gt;&lt;/a&gt;Qanday tuzilgan&lt;/h2&gt;\n&lt;p&gt;Mikrobiologning ishi mikroorganizmlarning hayotiy sikllarini o'rganishga asoslanadi. Mutaxassis mikroblarning qanday ko'payishi, genetik axborot almashinuvi va agressiv muhitga moslashishini tadqiq qiladi. Mikrobiomni — inson organizmida yashovchi barcha mikroorganizmlar majmuasini o'rganish muhim qism hisoblanadi.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"reference/professions/prof-microbiologist.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Zamonaviy mikrobiologiya yuqori texnologik usullarga tayanadi:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Kultivatsiya: mikroorganizmlarning xususiyatlarini o'rganish uchun laboratoriya sharoitida o'stirish.&lt;/li&gt;\n&lt;li&gt;Sekvenirlash: mikroblarning evolyutsiyasi va dorilarga chidamlilik mexanizmlarini tushunish uchun genetik kodni dekodlash.&lt;/li&gt;\n&lt;li&gt;Molekulyar diagnostika: patogenlarni tez aniqlash uchun CRISPR asosidagi tizimlardan foydalanish.&lt;/li&gt;\n&lt;li&gt;Bioinformatika: mikrob genetik markerlari va inson salomatligi o'rtasidagi bog'liqlikni topish uchun katta ma'lumotlar bazasini tahlil qilish.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"reference/professions/prof-microbiologist.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;Mikrobiologlar yangi diagnostika va terapiya usullarini yaratishda muhim rol o'ynaydi. Masalan, CRISPR asosidagi test tizimlarini ishlab chiqish OIV, sil va bezgak diagnostikasini bitta tahlilda birlashtirish imkonini beradi. Shuningdek, mikrobiologlar Balamuthia mandrillaris amebasi kabi kam uchraydigan patogenlarni aniqlash uchun ekspress-testlar yaratishda ishtirok etishadi. Bundan tashqari, ularning tadqiqotlari parodontit va tizimli artrit o'rtasidagi bog'liqlik kabi kasalliklar mexanizmini tushunishga yordam beradi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar\"&gt;&lt;a href=\"reference/professions/prof-microbiologist.html#cheklovlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar&lt;/span&gt;&lt;/a&gt;Cheklovlar&lt;/h2&gt;\n&lt;p&gt;Asosiy qiyinchilik mikrodunyoning ulkan xilma-xilligidadir. Ko'pgina mikroorganizmlarni laboratoriyada o'stirishning iloji yo'q, chunki ular qayta tiklanishi qiyin bo'lgan o'ziga xos sharoitlarni talab qiladi. Bundan tashqari, mikroblar tez evolyutsiya qilib, antibiotiklarga chidamlilikni rivojlantiradi. Shuningdek, ma'lumotlarni talqin qilish muammosi ham mavjud: organizmda mikrobning mavjudligi har doim ham kasallikni anglatmaydi.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"reference/professions.html\"&gt;Kasblar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"изучает бактерии, вирусы и микробиомы, ищет новые антибиотики"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Микробиолог","description":"изучает бактерии, вирусы и микробиомы, ищет новые антибиотики","vcsPath":"reference/professions/prof-microbiologist.md"},"headings":[{"title":"Umumiy ko'rinish","href":"reference/professions/prof-microbiologist.html#umumiy-korinish","level":2},{"title":"Qanday tuzilgan","href":"reference/professions/prof-microbiologist.html#qanday-tuzilgan","level":2},{"title":"Usullar va vositalar","href":"reference/professions/prof-microbiologist.html#usullar-va-vositalar","level":2},{"title":"Qayerda qo'llaniladi","href":"reference/professions/prof-microbiologist.html#qayerda-qollaniladi","level":2},{"title":"Cheklovlar","href":"reference/professions/prof-microbiologist.html#cheklovlar","level":2}],"title":"Микробиолог"},"router":{"pathname":"reference/professions/prof-microbiologist","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
