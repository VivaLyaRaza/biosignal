        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Kasblar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;изучает, как нейроны и сети мозга создают поведение и память&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/professions/prof-neuroscientist.jpg\" alt=\"Нейробиолог\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima bilan shug'ullanadi&lt;/td&gt;\n&lt;td&gt;изучает, как нейроны и сети мозга создают поведение и память&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nimani bilish kerak&lt;/td&gt;\n&lt;td&gt;электрофизиология, визуализация, анализ данных&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-brain.html\"&gt;Miya va asab tizimi&lt;/a&gt;, &lt;a href=\"concepts/spec-mind.html\"&gt;Ruhiyat va xulq-atvor&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"nima-bilan-shugullanadi\"&gt;&lt;a href=\"reference/professions/prof-neuroscientist.html#nima-bilan-shugullanadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nima bilan shug'ullanadi&lt;/span&gt;&lt;/a&gt;Nima bilan shug'ullanadi&lt;/h2&gt;\n&lt;p&gt;Neyrobiolog — asab tizimining tuzilishi, rivojlanishi va ishlashini o'rganadigan olim. Uning vazifasi — neyronlar va ularning tarmoqlaridagi fizik jarayonlar qanday qilib xulq-atvor, xotira, his-tuyg'ular va kognitiv qobiliyatlarga aylanishini tushunishdir. Neyrobiologiya miya organizmni me'yorda va patologik holatlarda qanday boshqarishini tushuntirish uchun genetika, biokimyo, fiziologiya va psixologiyani birlashtiradi.&lt;/p&gt;\n&lt;h2 id=\"tipik-vazifalar\"&gt;&lt;a href=\"reference/professions/prof-neuroscientist.html#tipik-vazifalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tipik vazifalar&lt;/span&gt;&lt;/a&gt;Tipik vazifalar&lt;/h2&gt;\n&lt;p&gt;Neyrobiologning ishi miya faoliyatining asosida yotgan mexanizmlarni izlashga qaratilgan. Asosiy yo'nalishlar:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Kasalliklarning hujayraviy mexanizmlarini o'rganish: Goshye kasalligi kabi kam uchraydigan genetik buzilishlarni tahlil qilish uchun bemorlarning o'zak hujayralaridan «mini-miya»lar yetishtirish.&lt;/li&gt;\n&lt;li&gt;Miyani xaritalash: neyrodegenerativ (Altsgeymer, Parkinson) va ruhiy kasalliklarda (shizofreniya) hujayralarning zaiflik atlaslarini yaratish.&lt;/li&gt;\n&lt;li&gt;Neyron tarmoqlarini tahlil qilish: miyaning medial temporal tarmog'i xotiralarning vizual detallarini qanday kodlashini tadqiq qilish.&lt;/li&gt;\n&lt;li&gt;Patologiyalarni modellashtirish: sichqonlar modellari yordamida mutatsiyalarning (masalan, AKAP11 geni) depressiya va xavotir holatlariga ta'sirini o'rganish.&lt;/li&gt;\n&lt;li&gt;Rivojlanishni o'rganish: erta stressning prefrontal korteks va amigdala ishini qanday o'zgartirishini yoki chaqaloqlar miyasi nutqni qabul qilishga qanday moslashishini tahlil qilish.&lt;/li&gt;\n&lt;li&gt;Terapiyani ishlab chiqish: og'ir sindromlarda neyronlar nobud bo'lishining oldini olish uchun gen muhandisligi usullarini sinovdan o'tkazish.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"konikmalar-va-vositalar\"&gt;&lt;a href=\"reference/professions/prof-neuroscientist.html#konikmalar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ko'nikmalar va vositalar&lt;/span&gt;&lt;/a&gt;Ko'nikmalar va vositalar&lt;/h2&gt;\n&lt;p&gt;Neyrobiologlar vazifalarni hal qilish uchun keng ko'lamli usullardan foydalanadilar:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Elektrofiziologiya: signallarni uzatishni tushunish uchun neyronlarning elektr faolligini qayd etish.&lt;/li&gt;\n&lt;li&gt;Vizualizatsiya (Imaging): miya tuzilishi va hujayralar faolligini real vaqt rejimida kuzatish uchun zamonaviy mikroskoplar va MRT usullari.&lt;/li&gt;\n&lt;li&gt;Ma'lumotlar tahlili va neyrotarmoqlar: neyron tarmoqlaridagi qonuniyatlarni aniqlash uchun katta hajmdagi ma'lumotlarni matematik qayta ishlash.&lt;/li&gt;\n&lt;li&gt;Genetik modellashtirish: transgen hayvonlar liniyalarini yaratish va genlar ishini tuzatish uchun virusli vektorlardan foydalanish.&lt;/li&gt;\n&lt;li&gt;To'qimalarni yetishtirish: rivojlanish jarayonlarini organizmdan tashqarida o'rganish uchun miya organoidlarini yetishtirish.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-oqish-kerak\"&gt;&lt;a href=\"reference/professions/prof-neuroscientist.html#qayerda-oqish-kerak\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda o'qish kerak&lt;/span&gt;&lt;/a&gt;Qayerda o'qish kerak&lt;/h2&gt;\n&lt;p&gt;Neyrobiologning bazaviy ta'limi odatda universitetlarning biologiya, tibbiyot yoki biofizika fakultetlaridan boshlanadi. Ixtisoslashuv magistratura va aspiranturada amalga oshiriladi, u yerda e'tibor neyrofanlarga qaratiladi. Matematik tahlil, dasturlash (Python, R) va statistika sohasida tayyorgarlik muhim ahamiyatga ega, chunki zamonaviy neyrobiologiya ma'lumotlar tahliliga tayanadi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-ishlash-va-qanday-osish-kerak\"&gt;&lt;a href=\"reference/professions/prof-neuroscientist.html#qayerda-ishlash-va-qanday-osish-kerak\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda ishlash va qanday o'sish kerak&lt;/span&gt;&lt;/a&gt;Qayerda ishlash va qanday o'sish kerak&lt;/h2&gt;\n&lt;p&gt;Neyrobiologlar akademik institutlar, universitet laboratoriyalari va farmatsevtika kompaniyalarining R&amp;amp;D bo'limlarida ishlaydilar. Karyera o'sishi odatda tadqiqotchi-laborantdan o'z laboratoriyasi rahbari (Principal Investigator) lavozimigacha bo'lgan yo'lni nazarda tutadi. Olimlar natijalarni ilmiy jurnallarda nashr etadilar, grant tanlovlarida qatnashadilar va fundamental kashfiyotlarni kasalliklarni davolash amaliyotiga joriy etish uchun klinisistlar bilan hamkorlik qiladilar.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/professions/prof-neuroscientist.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9D%D0%B5%D0%B9%D1%80%D0%BE%D0%B1%D0%B8%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Нейробиология — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Santiago_Ram%C3%B3n_y_Cajal_(1852-1934)_portrait_(restored).jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Original photo is anonymous although published by Clark University in 1899. Restoration by Garrondo, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1289/ehp.00108s3511\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Critical periods of vulnerability for the developing nervous system: evidence from humans and animal models&lt;/a&gt; — sharh, Environ Health Perspect 2000&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nn.4502\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Network neuroscience&lt;/a&gt; — sharh, Nat Neurosci 2017&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1177/1073858406293182\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Small-world brain networks&lt;/a&gt; — sharh, Neuroscientist 2006&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/professions.html\"&gt;Kasblar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"изучает, как нейроны и сети мозга создают поведение и память"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Нейробиолог","description":"изучает, как нейроны и сети мозга создают поведение и память","vcsPath":"reference/professions/prof-neuroscientist.md"},"headings":[{"title":"Nima bilan shug'ullanadi","href":"reference/professions/prof-neuroscientist.html#nima-bilan-shugullanadi","level":2},{"title":"Tipik vazifalar","href":"reference/professions/prof-neuroscientist.html#tipik-vazifalar","level":2},{"title":"Ko'nikmalar va vositalar","href":"reference/professions/prof-neuroscientist.html#konikmalar-va-vositalar","level":2},{"title":"Qayerda o'qish kerak","href":"reference/professions/prof-neuroscientist.html#qayerda-oqish-kerak","level":2},{"title":"Qayerda ishlash va qanday o'sish kerak","href":"reference/professions/prof-neuroscientist.html#qayerda-ishlash-va-qanday-osish-kerak","level":2},{"title":"Manbalar","href":"reference/professions/prof-neuroscientist.html#manbalar","level":2}],"title":"Нейробиолог"},"router":{"pathname":"reference/professions/prof-neuroscientist","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
