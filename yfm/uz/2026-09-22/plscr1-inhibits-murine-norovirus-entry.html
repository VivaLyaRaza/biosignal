        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"273\" cy=\"121\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"667\" cy=\"296\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · MICROBIOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Plscr1 oqsili sichqon&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;norovirusining kirishini&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;to'xtatadi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-f1.jpg\" alt=\"1-rasm: MNV infeksiyasini optimal nazorat qilish uchun Plscr1 talab qilinadi. (A) Uchta turli xil skrining bo'yicha saql\" /&gt;&lt;/p&gt;\n&lt;p&gt;*1-rasm: MNV infeksiyasini optimal nazorat qilish uchun Plscr1 talab qilinadi. (A) Uchta turli xil skrining bo'yicha saqlanib qolgan xitlarni ko'rsatuvchi Venn diagrammasi. (B) Bo'sh vektor yoki Plscr1 ni ekspressiya qiluvchi HeLa-CD300lf hujayralari 0,05 infeksiya ko'pligi (MOI) bilan MNVCW3 (chapda) yoki MNVCR6 (o'ngda) bilan infektsiyalandi. Virus mahsuloti teshikch hosil qiluvchi birliklar (PFU) yordamida aniqlandi. (C) Sichqoncha yoki inson Plscr1 ni ekspressiya qiluvchi HeLa-CD300lf hujayralari 48 soat davomida 0,05 MOI da MNVCW3-HiBiT bilan zararkurandaga uchratildi. Infeksiya Nano-Glo HiBiT Lytic Detection System (RLU; nisbiy lyuminestsent birliklar) yordamida miqdoriy aniqlandi. (D) Ko'rsatilgan antikorlar bilan tekshirilgan FLAG-tagli sichqoncha (ms) yoki inson (hu) Plscr1 ni ekspressiya qiluvchi HeLa-CD300lf hujayralarining vakili vestern-bloti. (E) Vektor nazorati yoki Plscr1 ni ekspressiya qiluvchi, 5,0 MOI da MNVCW3 bilan infektsiyalangan va infeksiyadan keyingi ko'rsatilgan soatlarda (hpi) liziz qilingan HeLa-CD300lf hujayralarining vakili vestern-bloti. (F) Interferonsiz, 1000 birlik/ml interferon α yoki 0,1 mkg/ml interferon γ bilan ishlov berilgan HeLa-CD300lf yoki HeLaΔPlscr1-CD300lf hujayralarining ko'rsatilgan antikorlar bilan tekshirilgan vakili vestern-bloti. (G) HeLa-CD300lf yoki HeLaΔPlscr1-CD300lf hujayralari 0,5 MOI da MNVCW3-HiBiT bilan zararkurandaga uchratildi. 48 soatdan keyin infeksiya Nano-Glo HiBiT Lytic Detection System yordamida miqdoriy aniqlandi. (H) HeLa-CD300lf yoki HeLaΔPlscr1-CD300lf hujayralari interferon α ning ko'rsatilgan dozalari (Birlik/ml) bilan ishlov berildi, so'ngra 48 soat davomida 0,5 MOI da MNVCW3-HiBiT bilan zararkurandaga uchratildi. Infeksiya Nano-Glo HiBiT Lytic Detection System yordamida miqdoriy aniqlandi. Ko'rsatilgan hujayra turlari uchun interferon α ning samarali kontsentratsiyasi 50 (EC50) hisoblab chiqildi. (I) Ko'rsatilgan to'qimalarda Plscr1+/+ (WT) yoki Plscr1-/- (KO) birga tug'ilgan hayvonlardan Plscr1 ekspressiyasi. Shtrixli chiziq aniqlash chegarasini ko'rsatadi. (J) Plscr1+/+ (WT) yoki Plscr1-/- (KO) birga tug'ilgan hayvonlar 1 × 10^6 PFU MNVCW3 bilan infektsiyalandi va infeksiyadan 3 kun o'tgach evtanaziya qilindi. Yo'g'on ichak, yondosh ichak, tutqich limfa tugunlari (MLN), taloq va jigar MNV genomi nusxalari uchun qPCR orqali tahlil qilindi va aktin uchun normallashtirildi. Har bir to'qima uchun skripka diagrammasi bilan birga individual ma'lumotlar nuqtalari ko'rsatilgan. Mann-Whitney testi bo'yicha P-qiymatlari ko'rsatilgan. Shtrixli chiziq aniqlash chegarasini ko'rsatadi. Barcha ma'lumotlar uchta mustaqil tajribadan olingan o'rtacha ± standart og'ish bo'lib, Tukey ning ko'p qirrali taqqoslash testi (B va C), T-test (G) yoki Mann-Whitney (J) bilan bir tomonlama ANOVA yordamida tahlil qilindi. *P &amp;lt; 0,05, **P &amp;lt; 0,01, ***P &amp;lt; 0,001, ***&lt;em&gt;P &amp;lt; 0,0001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Noroviruslar gastroenteritning asosiy sababidir, ammo organizmning himoya mexanizmlari yetarli o'rganilmagan. Olimlar interferon ta'sirida ishga tushadigan Plscr1 geni norovirus ko'payishini cheklashini aniqladilar. Ma'lum bo'lishicha, Plscr1 virusning hujayralarga biriktirilgandan keyingi bosqichda kirishiga to'sqinlik qiladi. VP2 oqsilidagi yagona o'zgarish virusga bu himoyaga qarshi turg'unlik beradi. Bu kashfiyot himoya mexanizmining yangi qirralarini ochib beradi.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Noroviruslar бутун дунё бўйлаб гастроэнтеритнинг асосий сабабчиларидан бири ҳисобланади, бироқ вирус репликациясини чекловчи хўжайин омиллари ҳалигача етарлича ўрганилмаган. CRISPR-активация ва CRISPR-нокаут тизимлари ёрдамида ўтказилган бутун геномли скрининг натижаларини таҳлил қилиш жараёнида тадқиқотчилар интерферон билан стимулланадиган &lt;em&gt;Plscr1&lt;/em&gt; генини сичқон норовируси (MNV) учун чекловчи омил сифатида аниқладилар. Одатда Plscr1 оқсили қобиқли вирусларнинг эндоцитоз мембраналари билан қўшилишини (fusion) ингибирлайди, шу сабабли ушбу оқсилнинг қобиқсиз MNV вирусига қарши фаоллик кўрсатиши кутилмаган янгилик бўлди. Ушбу ишда Plscr1 оқсили &lt;em&gt;in vitro&lt;/em&gt; шароитида MNV инфекциясини чеклаш учун ҳам зарур, ҳам етарли эканлиги, шунингдек, сичқонларда йўғон ичак инфекциясини назорат қилишда иштирок этиши кўрсатилган. Механистик жиҳатдан олиб қараганда, Plscr1 норовируснинг ҳужайрага киришини вирионнинг ҳужайра юзасига бирикишидан кейинги босқичда блоклаши аниқланди.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Илгари фақат қобиқли вирусларга қарши ишлайди деб ҳисобланган Plscr1 оқсили қобиқсиз сичқон норовируси (MNV) ҳужайрага киришининг бирикишдан кейинги босқичини блоклаб, инфекцияни ҳам &lt;em&gt;in vitro&lt;/em&gt;, ҳам &lt;em&gt;in vivo&lt;/em&gt; шароитда самарали чеклайди.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR-скрининг — бу CRISPR/Cas9 тизими ёрдамида ҳужайрадаги минглаб генларни кетма-кет ўчириш (нокаут) ёки фаоллаштириш (активация) орқали уларнинг маълум бир жараёнга (масалан, вирусга чидамлиликка) таъсирини аниқловчи юқори технологияли усулдир.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кичик капсид оқсили VP2 таркибидаги атиги битта аминокислотанинг алмасиниши вирусни Plscr1 таъсирига чидамли (резистент) қилиб қўйиши аниқланди. Калицивирусларнинг ҳужайрага кириши пайтида VP2 оқсили эндоцитоз мембраналарини тешиш орқали вирус РНКсини ҳужайра ичига етказиб беришини ҳисобга олсак, бу кашфиёт Plscr1 айнан мана шу кечки кириш босқичини нишонга олишини кўрсатади. Олинган натижалар PLSCR1 оқсилининг вирусга қарши фаоллик доирасини қобиқсиз вирусларгача кенгайтиради ва қобиқли ҳамда қобиқсиз вирусларнинг ҳужайрага кириш йўлларида кутилмаган умумий нуқта мавжудлигини кўрсатади.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тадқиқот сичқон норовируси моделида ўтказилган бўлиб, инсон норовируслари ва инсон PLSCR1 оқсили ўртасидаги ўзаро таъсирни тўлиқ тасдиқлаш учун қўшимча клиник ва ҳужайравий тадқиқотлар талаб этилади.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"plscr1-mnv-replikatsiyasini-cheklash-uchun-yetarli\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plscr1-mnv-replikatsiyasini-cheklash-uchun-yetarli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PLSCR1 MNV реплиkatsiyasini cheklash uchun yetarli&lt;/span&gt;&lt;/a&gt;PLSCR1 MNV реплиkatsiyasini cheklash uchun yetarli&lt;/h4&gt;\n&lt;p&gt;Mualliflar potentsial virusga qarshi genlarni tizimli aniqlash uchun avval o‘tkazilgan uchta genom miqyosidagi CRISPR skrining ma’lumotlarini tahlil qilishdi. Ushbu skrininglarning barchasi sichqon noroviruqi (MNV) bilan infksiyadan keyin hujayra omon qolishini selektiv bosim sifatida qo‘llagan hovuzli skrininglar bo‘lib, hujayra turlari va perturbatsiya strategiyalari bo‘yicha farqlangan. Birinchi skrining BV2 hujayralarida (MNV ga tabiiy moyil bo‘lgan sichqon mikrogliya hujayralari liniyasi) amalga oshirilgan yuqori zichlikdagi CRISPR-nokaut skriningi bo‘lib, unda salbiy seleksiya strategiyasi orqali MNV infektsiyasiga sezuvchanlikni oshiruvchi genlar aniqlangan. Ikkinchi skrining BV2 hujayralarida CRISPR faollashtirish (CRISPRa) yondashuvidan foydalangan bo‘lib, unda potentsial virusga qarshi genlarning gipersekspresiyasi MNV bilan zarlanganda hujayralarga o‘sish afzalligini bergan. Tahlilga kiritilgan oxirgi skrining ham HeLa hujayralarida MNV retseptori — CD300lf ni ekspres qiluvchi CRISPRa skriningi bo‘ldi. Ushbu uchta skrining tahlili barqaror ravishda MNV ga nisbatan virusga qarshi faollikka ega bo‘lgan ikki genni aniqladi: IFITM2 va PLSCR1 (1A-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;CRISPR skrininglari — bu butun genom miqyosida genlar faoliyatini o‘chirish yoki kuchaytirish orqali virus infektsiyasida hujayra omon qolishiga ta’sir etuvchi omillarni topish uchun qo‘llaniladigan yuqori unumdor genetik usullar.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;IFITM2 va PLSCR1 — ikkalasi ham interferon bilan stimul qilingan genlar (ISG) bo‘lib, qobiqli viruslarning kirishini bloklashda ma’lum virusga qarshi rollarga ega. IFITM2 endomembran kompartmentlaridan viruslarning kirishini to‘sadigan IFITM oqsil oilasiga kiradi, PLSCR1 esa barcha uch turdagi IFN tomonidan induksiya qilinib, OIV va SARS-CoV-2 ning endotsitik membranalar bilan qo‘shilishini bloklaydi. Hozirgi kunga qadar PLSCR1 biron bir qobiqsiz virusni inhibe qilishi ko‘rsatilmagan. Shuning uchun mualliflar PLSCR1 ning MNV reплиkatsiyasini qanday cheklashini o‘rganishga e’tibor qaratdilar. PLSCR1 MNV reплиkatsiyasini inhibe qilish uchun yetarli ekanligini sinash uchun ular HeLa-CD300lf hujayralarida PLSCR1 ortiqcha ekspressiya qilinganda MNV ning ko‘payish qobiliyatini baholadilar (1B-rasm). MNV ning ikki shtammi (MNVCW3 va MNVCR6) nazorat hujayralarida faol ko‘paygan bo‘lsa-da, sichqon Plscr1 ekspressiyasi virus o‘sishini sezilarli darajada pasaytirdi (1B-rasm). Sichqon va odam PLSCR1 oqsillari atigi 75% ketma-ketlik o‘xshashligiga qaramay, ularning har qandayining ortiqcha ekspressiyasi MNV ning lyutsiferaza muhbir tizimi yordamida o‘lchangan holda HeLa-CD300lf da replikatsiyasini inhibe qildi (1C va 1D-rasmlar). Virus mahsulotining kamayishiga mos ravishda, Plscr1 ni ekspres qiluvchi hujayralar MNV bilan zarlangandan so‘ng nazorat hujayralariga nisbatan juda kam miqdorda virus oqsilini ishlab chiqardi (1E-rasm). Xulosa qilib aytganda, bu ma’lumotlar PLSCR1 MNV replikatsiyasini inhibe qilish uchun yetarli ekanligini ko‘rsatadi.&lt;/p&gt;\n&lt;h4 id=\"plscr1-in-vitro-sharoitida-mnv-ni-cheklash-uchun-zarur\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plscr1-in-vitro-sharoitida-mnv-ni-cheklash-uchun-zarur\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Plscr1 in vitro sharoitida MNV ni cheklash uchun zarur&lt;/span&gt;&lt;/a&gt;Plscr1 in vitro sharoitida MNV ni cheklash uchun zarur&lt;/h4&gt;\n&lt;p&gt;PLSCR1 ning MNV ni optimal cheklash uchun zarurligini aniqlash uchun tadqiqotchilar CD300lf ni ekspres qiluvchi HeLaΔPLSCR1 hujayralarini (HeLaΔPLSCR1-CD300lf) yaratdilar. PLSCR1 nokaut qilinganligi IFN-α yoki IFN-γ bilan stimulyatsiya qilingandan so‘ng HeLa-CD300lf va HeLaΔPLSCR1-CD300lf lizatlarida vestern-blot orqali tasdiqlandi (1F-rasm). Skrining ma’lumotlariga mos ravishda, MNV-HiBiT bilan zarlanganda HeLa-CD300lf ga nisbatan HeLaΔPLSCR1-CD300lf hujayralarida virus replikatsiyasining oshishi kuzatildi (1G-rasm). PLSCR1 I turdagi IFN javobini kuchaytirishi yoki to‘g‘ridan-to‘g‘ri ta’sir qiluvchi virusga qarshi vosita bo‘lishi mumkinligini tekshirish uchun mualliflar endogen PLSCR1 mavjud yoki yo‘qligida MNV ning I turdagi IFN ga sezuvchanligini solishtirdilar. IFN-α bilan davolash PLSCR1 ekspressiyasidan qat'i nazar, doza asosida MNV replikatsiyasini sezilarli darajada kamaytirdi (1H-rasm). Ushbu hujayra liniyalari orasidagi EC₅₀ qiymatlarida sezilarli farqlar kuzatilmadi, bu PLSCR1 tanqisligi MNV ni cheklash uchun I turdagi IFN javobini o‘zgartirmasligini ko‘rsatadi (1H-rasm). Shunday qilib, ma’lumotlar PLSCR1 MNV ni optimal nazorat qilish uchun zarur bo‘lgan to‘g‘ridan-to‘g‘ri virusga qarshi molekula sifatida ishlashiga mos keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;PLSCR1 nokauti MNV replikatsiyasining oshishiga olib keladi, ammo I turdagi interferonga sezuvchanlikni (EC₅₀) o‘zgartirmaydi, bu PLSCR1 ning bevosita virusga qarshi ta’sirini tasdiqlaydi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"plscr1-tanqis-sichqonlarda-yogon-ichak-mnv-replikatsiyasining-ortacha-osishi-kuzatiladi\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plscr1-tanqis-sichqonlarda-yogon-ichak-mnv-replikatsiyasining-ortacha-osishi-kuzatiladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Plscr1 tanqis sichqonlarda yo‘g‘on ichak MNV replikatsiyasining o‘rtacha o‘sishi kuzatiladi&lt;/span&gt;&lt;/a&gt;Plscr1 tanqis sichqonlarda yo‘g‘on ichak MNV replikatsiyasining o‘rtacha o‘sishi kuzatiladi&lt;/h4&gt;\n&lt;p&gt;Interferon signallari in vivo sharoitida MNV infektsiyasi dinamikasini shakllantiradi. Mualliflar ilgari tasvirlangan Plscr1⁻/- sichqonlarni olishdi va MNV infektsiyasiga tegishli to‘qimalarda Plscr1 transkriptlari darajasini baholadilar. Plscr1 transkriptlari yovvoyi turdagi sichqonlarning barcha sinovdan o‘tgan to‘qimalarida aniqlandi, eng yuqori ekspressiya yo‘g‘on va yonbosh ichakda kuzatildi, nokaut sichqonlarda эsa transkriptlar aniqlanmadi (1I-rasm). Plscr1 yetarli va tanqis bo‘lgan sichqonlarni og‘iz orqali MNVCW3 bilan zararladilar va infektsiyadan 3 kun o‘tgach to‘qimalarni yig‘ib olishdi (1J-rasm). Oldingi hisobotlarga muvofiq, yovvoyi turdagi sichqonlarning taloq, jigar va mezenterial limfa tugunlarida (MLN) MNVCW3 genomlari aniqlandi.&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;p&gt;Hujayra liniyalari va hujayra kulturasi&lt;/p&gt;\n&lt;p&gt;Tajribalar uchun 293T, HeLa va BV2 hujayra liniyalari ishlatilib, ular tarkibida 5% homila qon zardobi bo'lgan Dulbecco’s Modified Eagle Medium muhitida o'stirildi. Barqaror yuqori ekspressiyali hujayra liniyalari lentiviral transduksiya yordamida olindi. Buning uchun lentiviral plazmidalar qadoqlovchi psPax2 vektori va pCMV-VSV-G psevdotiplash vektori bilan birga Polysciences PEI yordamida 293T hujayralariga ko'transfeksiya qilindi. Transduksiyadan 48 soat o'tgach, lentivirus yig'ilib, 0.45 mkm filtrdan o'tkazildi va hujayralarga qo'shildi. Yana 48 soatdan keyin muhit tegishli antibiotik saqlovchi muhitga (350 mkg/ml gigromisin, 5 mkg/ml blastitsidin va/yoki 1 mkg/ml puromisin) almashtirildi. Barcha liniyalar mikoplasما bilan ifloslanmagani muntazam tekshirib turildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Lentiviral transduksiya hujayra genomiga genetik materialni barqaror kiritishga va zaharli moddalarga chidamli barqaror shtamlarni ajratib olishga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;HeLaΔPlscr1 nokaut hujayralarini hosil qilish uchun boshlang'ich HeLa hujayralari pSpCas9(BB)-2A-Blast va pSpCas9(BB)-2A-Puro plazmidalari bilan ko'transfeksiya qilindi (puro: 5’ GGGTCAAGAAGTCATAACTC 3’, blast: 5’ TCAGGAGGTCTGTGATCAAT 3’). Transfeksiyadan 48 soat o'tgach, ikki kun davomida 5 mkg/ml blastitsidin va 1 mkg/ml puromisin bilan seleksiya o'tkazildi, shundan so'ng hujayralar yuvilib, antibiotiksiz muhitga qaytarildi. Yakkaxujayrali klonlar cheklangan suyultirish usuli yordamida ajratilib, Zymo (D3025) to'plami yordamida genomik DNK ajratib olindi. DNK quyidagi praymerlar yordamida amplifikatsiya qilindi (to'g'ri: 5’ ggggtatcatcaaaaactgg 3’; teskari: 5’ gcacacaacacatggaccac 3’). Har bir klon uchun indel mutatsiyalari Sanger sekvenirlash orqali tekshirildi. Olingan HeLaΔPlscr1 kloni stop kodonlarga ega bo'lgan allel o'zgarishlarini namoyish etadi.&lt;/p&gt;\n&lt;h4 id=\"viral-tahlillar\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#viral-tahlillar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Viral tahlillar&lt;/span&gt;&lt;/a&gt;Viral tahlillar&lt;/h4&gt;\n&lt;p&gt;MNVCW3, MNVCR6 va ularning mutant shakllari molekulyar klonlarni 293T hujayralariga transfeksiya qilish hamda BV2 hujayralarida ko'paytirish orqali olindi. Virusli infektsiyalar uchun 96-chuqurchali planshetlarga ko'rsatilgan HeLa-CD300lf hujayralari ekilib, keyingi kuni MOI 0.05 ko'rsatkichida 25 mkl MNV shtamlari bilan inokulyatsiya qilindi. Planshetlar xona haroratida 1 soat davomida chayqatilib, qo'shimcha 75 mkl muhit qo'shildi. Namunalar 37 °C da 5% \textCO₂ bilan inkubatsiya qilindi va belgilangan muddatlarda −80 °C da muzlatildi. Virus titrlari plakat usuli bilan aniqlandi. MNV-HiBiT tahlillari 10⁴ ta H1 HeLa-CD300lf hujayralarini 96-chuqurchali planshetlarga ekish va ularni MOI 0.5 yoki 5 da 25 mkl MNV shtamlari bilan inokulyatsiya qilish orqali o'tkazildi. Xona haroratida 1 soatlik chayqatish va 75 mkl muhit qo'shilgach, namunalar 37 °C va 5% \textCO₂ sharoitida inkubatsiya qilinib, −80 °C da muzlatildi. Eritilgandan so'ng lyuminestsent faollik Nano-Glo HiBiT Lytic Detection System tizimidan foydalangan holda Synergy LX multi-mode reader asbobida o'lchandi.&lt;/p&gt;\n&lt;h4 id=\"plazmid-konstruksiyalari\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plazmid-konstruksiyalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Plazmid konstruksiyalari&lt;/span&gt;&lt;/a&gt;Plazmid konstruksiyalari&lt;/h4&gt;\n&lt;p&gt;Sichqoncha va inson Plscr1 kDNT si hamda ularning mutatsiyalari N-oxiridagi 3xFLAG belgisi bilan pCDH-EF1-MCS-IRES-Puro lentiviral vektoriga klonlandi. MNVCW3 (GenBank EF014462.1) va MNVCR6 (GenBank JQ237823) uchun molekulyar klonlar ilgari tavsiflangan. Barcha plazmid ketma-ketliklari ishlatilishidan oldin to'liq plazmidli sekvenirlash yordamida tasdiqlandi.&lt;/p&gt;\n&lt;h4 id=\"immunoblotting\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#immunoblotting\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Immunoblotting&lt;/span&gt;&lt;/a&gt;Immunoblotting&lt;/h4&gt;\n&lt;p&gt;Laemmli buferida lizis qilingan namunalar SDS-PAGE yordamida ajratilib, PVDF membranalariga o'tkazildi. Membranalar antitanachalar bilan ishlov berishdan oldin 5% quruq yog'siz sut qo'shilgan TBS-T da bloklandi. Ishlatilgan antitanachalar: sichqonchaning α-Plscr1 (1:1,000; Sigma MABS482), α-GAPDH-HRP (1:10,000; Sigma G9295), α-FLAG M2-HRP (1:2,500; Sigma A8592), quyonning α-STAT1 phospho Y701 (1:1,000; Cell Signaling 9167S), α-STAT1 (1:1,000; Cell Signaling 9172S), ikkilamchi α-rabbit-HRP (1:10,000; Thermo Fisher 34102) va α-mouse-HRP (1:10,000; Cell Signaling 7076S). MNV nostruktur oqsillari uchun antitanachalar (sichqoncha α-NS1 va quyon α-NS6/7) avvalgi ishlarga muvofiq qo'shildi. Klonlar ketma-ketligi yovvoyi tur N M G Q E V I T L E R P L R C S va 17, 25 hamda 5 juft asosli deletsiya variantlarini o'z ichiga oladi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-f1.jpg\" alt=\"1-rasm: MNV infeksiyasini optimal nazorat qilish uchun Plscr1 talab qilinadi. (A) Uchta turli xil skrining bo'yicha saql\" /&gt;&lt;/p&gt;\n&lt;p&gt;*1-rasm: MNV infeksiyasini optimal nazorat qilish uchun Plscr1 talab qilinadi. (A) Uchta turli xil skrining bo'yicha saqlanib qolgan xitlarni ko'rsatuvchi Venn diagrammasi. (B) Bo'sh vektor yoki Plscr1 ni ekspressiya qiluvchi HeLa-CD300lf hujayralari 0,05 infeksiya ko'pligi (MOI) bilan MNVCW3 (chapda) yoki MNVCR6 (o'ngda) bilan infektsiyalandi. Virus mahsuloti teshikch hosil qiluvchi birliklar (PFU) yordamida aniqlandi. (C) Sichqoncha yoki inson Plscr1 ni ekspressiya qiluvchi HeLa-CD300lf hujayralari 48 soat davomida 0,05 MOI da MNVCW3-HiBiT bilan zararkurandaga uchratildi. Infeksiya Nano-Glo HiBiT Lytic Detection System (RLU; nisbiy lyuminestsent birliklar) yordamida miqdoriy aniqlandi. (D) Ko'rsatilgan antikorlar bilan tekshirilgan FLAG-tagli sichqoncha (ms) yoki inson (hu) Plscr1 ni ekspressiya qiluvchi HeLa-CD300lf hujayralarining vakili vestern-bloti. (E) Vektor nazorati yoki Plscr1 ni ekspressiya qiluvchi, 5,0 MOI da MNVCW3 bilan infektsiyalangan va infeksiyadan keyingi ko'rsatilgan soatlarda (hpi) liziz qilingan HeLa-CD300lf hujayralarining vakili vestern-bloti. (F) Interferonsiz, 1000 birlik/ml interferon α yoki 0,1 mkg/ml interferon γ bilan ishlov berilgan HeLa-CD300lf yoki HeLaΔPlscr1-CD300lf hujayralarining ko'rsatilgan antikorlar bilan tekshirilgan vakili vestern-bloti. (G) HeLa-CD300lf yoki HeLaΔPlscr1-CD300lf hujayralari 0,5 MOI da MNVCW3-HiBiT bilan zararkurandaga uchratildi. 48 soatdan keyin infeksiya Nano-Glo HiBiT Lytic Detection System yordamida miqdoriy aniqlandi. (H) HeLa-CD300lf yoki HeLaΔPlscr1-CD300lf hujayralari interferon α ning ko'rsatilgan dozalari (Birlik/ml) bilan ishlov berildi, so'ngra 48 soat davomida 0,5 MOI da MNVCW3-HiBiT bilan zararkurandaga uchratildi. Infeksiya Nano-Glo HiBiT Lytic Detection System yordamida miqdoriy aniqlandi. Ko'rsatilgan hujayra turlari uchun interferon α ning samarali kontsentratsiyasi 50 (EC50) hisoblab chiqildi. (I) Ko'rsatilgan to'qimalarda Plscr1+/+ (WT) yoki Plscr1-/- (KO) birga tug'ilgan hayvonlardan Plscr1 ekspressiyasi. Shtrixli chiziq aniqlash chegarasini ko'rsatadi. (J) Plscr1+/+ (WT) yoki Plscr1-/- (KO) birga tug'ilgan hayvonlar 1 × 10^6 PFU MNVCW3 bilan infektsiyalandi va infeksiyadan 3 kun o'tgach evtanaziya qilindi. Yo'g'on ichak, yondosh ichak, tutqich limfa tugunlari (MLN), taloq va jigar MNV genomi nusxalari uchun qPCR orqali tahlil qilindi va aktin uchun normallashtirildi. Har bir to'qima uchun skripka diagrammasi bilan birga individual ma'lumotlar nuqtalari ko'rsatilgan. Mann-Whitney testi bo'yicha P-qiymatlari ko'rsatilgan. Shtrixli chiziq aniqlash chegarasini ko'rsatadi. Barcha ma'lumotlar uchta mustaqil tajribadan olingan o'rtacha ± standart og'ish bo'lib, Tukey ning ko'p qirrali taqqoslash testi (B va C), T-test (G) yoki Mann-Whitney (J) bilan bir tomonlama ANOVA yordamida tahlil qilindi. *P &amp;lt; 0,05, **P &amp;lt; 0,01, ***P &amp;lt; 0,001, ***&lt;em&gt;P &amp;lt; 0,0001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-f2.jpg\" alt=\"Rasm 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-fS1.jpg\" alt=\"Rasm S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-fS2.jpg\" alt=\"Qo'shimcha rasm 2: Qo'lyozmada ishlatilgan asl vestern-blotlar. 3-rasmda tasvirlangan blotlarga mos keladigan o'zgartiri\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Qo'shimcha rasm 2: Qo'lyozmada ishlatilgan asl vestern-blotlar. 3-rasmda tasvirlangan blotlarga mos keladigan o'zgartirilmagan immunoblot xemilüminestsent tasvirlari.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Norovirusga&lt;/text&gt;&lt;text x=\"2
