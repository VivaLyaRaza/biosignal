"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;N2 uyqusi paytida sun'iy ravishda qo'zg'atilgan mikro-uyg'onishlar farmakorezistent epilepsiyada fazoviy tarqalishni o'zgartirmasdan, neokorteksdagi lokal interiktal faollikni tanlab kuchaytiradi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"bemorlarni-tanlab-olish\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#bemorlarni-tanlab-olish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bemorlarni tanlab olish&lt;/span&gt;&lt;/a&gt;Bemorlarni tanlab olish&lt;/h4&gt;\n&lt;p&gt;Jarrohlik amaliyotidan oldingi klinik tekshiruv doirasida SEEG dan o‘tayotgan dori vositalariga chidamli fokal tutqanoqli kattalar yoshidagi bemorlar jalb qilindi. Ishtirokchilar 2025-yilning mayidan yanvarigacha Monreal nevrologiya instituti va kasalxonasi (MNI) ҳамda Dyuk kompleks tutqanoq markazi (DCEC) kabi ikkita markazdan jami 20 nafar bemor tanlab olindi. Tahlildan uch nafar bemor chiqarib yuborildi: ikkitasida eshitish stimulyatsiyasi bayonnomasi bo‘yicha texnik muammolar yuzaga kelgan bo‘lsa, bittasida uyquni baholashni ishonchsiz qilgan g‘ayritabiiy uyqu naqshlari kuzatilgan. Yakuniy guruhga 17 nafar bemor kiritildi (8 ayol, 14 o‘ng qo‘y, o‘rtacha yoshi 37.2 ± 8.1; SN-jadval), ulardan 10 nafari MNI va 7 nafari DCEC markazidan edi. Tadqiqot MNI Tadqiqot etika kengashi (2021-7516) hamda Dyuk universiteti sog‘liqni saqlash tizimi institutsional etika kengashi (Pro00113635) tomonidan ma’qullandi va har bir bemordan yozma ravishda xabardor qilingan rozilik olindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SEEG va PSG ma’lumotlarini yig‘ish hamda bemorlarni tanlash jarayoni kateter va intrakranial elektrodlar yordamida miya faoliyatini va uyqu bosqichlarini aniq qayd etish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"seeg-psg-yozuvlari\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#seeg-psg-yozuvlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SEEG-PSG yozuvlari&lt;/span&gt;&lt;/a&gt;SEEG-PSG yozuvlari&lt;/h4&gt;\n&lt;p&gt;Barcha ishtirokchilar oldingi tadqiqotlarda ta’riflanganidek, birlashtirilgan SEEG va PSG yozuvlaridan o‘tdilar. Epileptogen zonani aniqlash uchun miya ichiga SEEG chuqur elektrodlari o‘rnatildi, elektrodlarni joylashtirish MNI va DCEC klinik guruhlari tomonidan belgilandi. SEEG signallari MNI da Neuroworkbench tizimi (Nihon Kohden, Tokio, Yaponiya) yoki DCEC da Natus Quantum LTM kuchaytirgichi (Natus Medical Inc., Middlton, Viskonsin, AQSh) yordamida, taxmin qilingan epileptogen zonaga qarama-qarshi tomonlashgan tepa bo‘lagi ustiga qo‘yilgan elektrodga nisbatan 2048 Gts chastotada orqaga qayd etildi. MNI da SEEG signallari 0.08 Gts chastotali yuqori chastotali va 600 Gts chastotali past chastotali filtrdan o‘tkazildi, DCEC da esa signallar mos ravishda 0.01 Gts va 1000 Gts chastotalarda filtrlangan. PSG yozuvlari va tovush stimulyatsiyasi bayonnomasi jarrohlik oldi tekshiruvining erta bosqichida, SEEG elektrodlari o‘rnatilgandan keyin kamida 48 soat o‘tgach va bemorlar o‘zlarining to‘liq tutqanoqqa qarshi dori rejimini davom ettirayotgan yoki odatiy parvarish doirasida faqat cheklangan, klinik ko‘rsatmalarga ko‘ra dozani kamaytirgan paytda bajarildi. PSG yozuvlari implantatsiya paytida o‘rnatilgan teri osti yupqa simli elektrodlar yordamida olingan standart 10-20 tizimi joylaridan (F3, F4, C3, C4, O1, O2, M1, M2) olingan bosh terisi EEG ni, shuningdek uyquni baholashni osonlashtirish uchun iyak va boldirning oldingi mushaklarining sirtqi elektrookulografiyasi (EOG) va elektromiyografiyasini (EMG) o‘z ichiga oldi. Tahlil qilingan stimulyatsiya seanslari davomida hech qanday tutqanoq holatlari kuzatilmadi.&lt;/p&gt;\n&lt;h4 id=\"tovush-stimulyatsiyasi-bayonnomasi\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#tovush-stimulyatsiyasi-bayonnomasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tovush stimulyatsiyasi bayonnomasi&lt;/span&gt;&lt;/a&gt;Tovush stimulyatsiyasi bayonnomasi&lt;/h4&gt;\n&lt;p&gt;Tovush stimulyatsiyasi bayonnomasining maqsadi Amerika uyqu buzilishlari assotsiatsiyasi ko‘rsatmalariga muvofiq uyg‘onishlarni qo‘zg‘atish edi. Tovush stimullari 1 kGs chastotali, davomiyligi 5 soniya bo‘lgan va ovoz balandligi 40 dan 100 dB gacha bo‘lgan sof tonlardan iborat edi. Stimullar ishtirokchining odatiy uxlash vaqtidan boshlanadigan 4 soat sifatida belgilangan tunning birinchi yarmida yuqori sifatli quloq ichi naychali eshitish vositalari (ER3C, Etyomic, Illinoys, AQSh) orqali qo‘lda yetkazib berildi, bu esa tovushni aniq yetkazish va EEG yozuvlaridagi tashqi shovqin aralashuvini minimallashtirish imkonini berdi. Uyquni baholash bo‘yicha tayyorgarlikdan o‘tgan tadqiqotchi (SH, AH) uyqu bosqichini real vaqt rejimida baholash va stimulyatsiyani yo‘naltirish, shu jumladan uyg‘onish muvaffaqiyatli qo‘zg‘atilganini tasdiqlash uchun uzluksiz onlayn PSG monitoringini amalga oshirdi. Ushbu real vaqtda baholash Amerika uyqu tibbiyoti akademiyasining standart uyquni baholash mezonlariga muvofiq joriy EEG, EOG va EMG faoliyatini vizual tekshirishga asoslangan edi. Stimulyatsiya uyqu vretenosi yoki K-kompleksining paydoishi bilan tavsiflangan barqaror NREM uyquining 5 daqiqasidan keyin boshlandi va tovush balandligi uyg‘onish sodir bo‘lguncha asta-sekin oshirildi. Stimulyatsiya bayonnomasi real vaqtda uyquni baholash davomida uyqudan uyg‘onishni maksimal darajada oshirish uchun NREM va REM uyqu paytida qo‘llandi; shunga qaramay, tahlillar epilepsiya faolligini kuchaytirishdagi yaxshi ma’lum roli tufayli va ko‘p bemorlar stimulyatsiya tufayli kelib chiqqan uyqu parchalanishi sababli REM uyquiga erisha olmagani uchun NREM uyquiga qaratildi. Agar stimulyatsiya uyg‘onishga olib kelsa, bayonnoma to‘xtatildi va PSG yozuvlarida uyqu vretenosi, K-kompleks yoki tez ko‘z harakatlarining qayta paydoishi bilan belgilanadigan 2 daqiqalik barqaror uyqudan keyin pastroq ovoz balandligida (-10 dB) qayta boshlandi. Stimulyatsiya uyg‘onishni keltirib chiqargan hollarda, keyingi stimul 2 daqiqalik barqaror uyqudan keyin bir xil ovoz balandligida berildi. Agar uyg‘onish sodir bo‘lmasa, keyingi stimul 10 soniyadan so‘ng yuqoriroq ovoz balandligida (+10 dB) berildi. Ushbu bayonnoma umumiy uyqu vaqtiga ta’sir qilmasdan uyg‘onish indeksini soatiga 20 ta hodisagacha oshirishi ko‘rsatilgan.&lt;/p&gt;\n&lt;h4 id=\"sleep-scoring-and-arousal-detection\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#sleep-scoring-and-arousal-detection\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sleep scoring and arousal detection&lt;/span&gt;&lt;/a&gt;Sleep scoring and arousal detection&lt;/h4&gt;\n&lt;p&gt;Uyqu bosqichlari va mikro uyg‘onishlar (arousals) Amerika uyqu tibbiyoti akademiyasining (AASM) standart mezonlariga muvofiq qo‘lda baholandi. Tahlil bosh terisi EEG, EOG va EMG ni o‘z ichiga olgan polisomnografiya (PSG) yozuvlariga asoslandi. Belgilash ishlari SEEG ma'lumotlaridan xabardor bo'lmagan malakali mutaxassislar (SH, LP-D) tomonidan amalga oshirildi. Uyqu 30 soniyali davrlarga bo'lindi; har bir davr EEG, EOG va EMG naqshlari asosida N1, N2, N3, REM yoki uyg'oqlik kabi standart uyqu bosqichlaridan biriga tasniflandi. Uyg'onish — bu alfa, teta ritmlari va/yoki 16 Gts dan yuqori chastonalarni o'z ichiga olgan, 3-15 soniya davom etadigan va o'zgarishdan oldin kamida 10 soniya barqaror uyqu bo'lgan keskin EEG chastotasi o'zgarishi sifatida aniqlandi. Uyg'onishlar ular sodir bo'lgan uyqu bosqichiga qarab tasniflandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Polisomnografiya (PSG) — bu uyqu paytida fiziologik parametrlarni (EEG, EOG, EMG va boshqalar) qayd etuvchi majmuali usul bo'lib, uyqu arxitekturasi va mikro uyg'onish epizodlarini aniq baholash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ovozli ogohlantirish boshlanganidan 6.5 soniya ichida sodir bo'lgan uyg'onishlar qo'zg'atilgan (evoked) deb hisoblandi. Ushbu vaqt oynasi ogohlantirishni taqdim etishning 5 soniyali davomiyligini va stimulyatsiya hamda uyg'onish namoyon bo'lishi orasidagi kechikish uchun qo'shimcha 1.5 soniyani o'z ichiga oldi. Ushbu oynadan tashqariga chiqqan uyg'onishlar o'z-o'zidan (spontaneous) uyg'onishlar deb tasniflandi va natijalar faqat tovush tufayli yuzaga kelganiga yoki umumiy ekanligiga tekshirildi. Barcha uyqu bosqichlari va uyg'onishlarni baholash uyqu tibbiyoti bo'yicha mutaxassis bo'lgan nevrolog (BF, LP-D) tomonidan tasdiqlandi.&lt;/p&gt;\n&lt;h4 id=\"epoch-selection\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#epoch-selection\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Epoch selection&lt;/span&gt;&lt;/a&gt;Epoch selection&lt;/h4&gt;\n&lt;p&gt;Uyg'onishlarning tutqanoqlararo epileptiform razryadlarga (IED) ta'sirini baholash uchun mualliflar barcha patsiyentlarda har bir tovush stimulyatsiyasi hodisasiga vaqt bo'yicha bog'langan SEEG dagi to'rtta alohida 3 soniyali davrni tahlil qildilar (1c-rasm). Ushbu vaqt oynalari tovush stimulyatsiyasi va uyg'onish boshlanishidan oldin va keyin sodir bo'ladigan o'tkinchi o'zgarishlarni qayd etish uchun tanlangan. 3 soniyali davomiylik IEDdagi tez o'zgarishlarni aniqlash uchun yetarli vaqt ruxsatini ta'minladi. Ushbu interval uzoq muddatli uyqu dinamikasini emas, balki har bir stimulgacha bo'lgan mahalliy mikrodolzarb holatni ushlash uchun tanlangan.&lt;/p&gt;\n&lt;p&gt;Muvaffaqiyatli uyg'onish keltirib chiqargan stimullar uchun stimulgacha bo'lgan baza (stimul boshlanishidan oldingi 3 soniyali davr) va uyg'onish oynasi (uyg'onish boshlanishidan boshlanadigan 3 soniyali davr) ajratib olindi. Uyg'onishsiz tovush stimulyatsiyasi ta'sirini nazorat qilish uchun yana ikkita nazorat davri aniqlandi: nazorat bazasi (stimuldan oldingi 3 soniya) va stimul boshlanganidan 1.08 soniya o'tgach boshlanadigan 3 soniyali nazorat davri (barcha chaqirilgan uyg'onishlar bo'yicha median kechikishga mos keladi, IQR = 0.46–2.10 s). Ushbu dizayn tovushning notibbiy ta'sirini nazorat qilgan holda uyg'onishlarning o'ziga xos ta'sirini ajratib olishga imkon berdi. O'z-o'zidan uyg'onishlarni tahlil qilish uchun uyg'onish boshlanishidan 3 soniyali davr va unga mos keladigan boshlang'ich baza tanlandi.&lt;/p&gt;\n&lt;h4 id=\"analysis-of-interictal-epileptiform-discharges\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#analysis-of-interictal-epileptiform-discharges\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Analysis of interictal epileptiform discharges&lt;/span&gt;&lt;/a&gt;Analysis of interictal epileptiform discharges&lt;/h4&gt;\n&lt;p&gt;Interiktal epileptiform razryadlar (IED) oldindan tasdiqlangan detektor yordamida tanlangan davrlardagi bipolyar SEEG kanallarida avtomatik ravishda aniqlandi. Elektrodlarni joylashtirish zichligidagi farqlarni hisobga olish uchun tahlillar faol kanallar bilan cheklandi — bu kanallarda IED chastotasi 4.4 hodisa/min dan oshdi. Faol SEEG kanallaridagi IED soni umumlashtirilgan chiziqli aralash model (GLMM) yordamida modellashtirildi.&lt;/p&gt;\n&lt;p&gt;IED larning fazoviy tarqalishini o'rganish uchun tadqiqotchilar har bir mustaqil IED paytida yollangan SEEG kanallari sonini hisobladilar. Agar razryadlar har qanday kanalda oldingi IED dan kamida 120 ms masofada sodir bo'lsa, ular mustaqil deb hisoblandi. Berilgan davrda aniqlangan birinchi IED manba IED (source IED) deb hisoblandi va manba IED dan 120 ms ichida barcha SEEG kanallaridagi qo'shimcha turtki spayklar tarqaluvchi IED lar (propagating IEDs) deb hisoblandi. Har bir kanal uchun IED soni va tarqaluvchi kanallar soni to'rtta oldindan belgilangan davr uchun alohida hisoblandi. Yuqori chastotali tebranishlar (HFO, &amp;gt;80 Gts) ham tanlangan davrlarda SEEG da avtomatik ravishda aniqlandi va ularning soni GLMM yordamida modellashtirildi.&lt;/p&gt;\n&lt;h4 id=\"modulyatsiya-qiluvchi-omillarni-tahlil-qilish\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#modulyatsiya-qiluvchi-omillarni-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Modulyatsiya qiluvchi omillarni tahlil qilish&lt;/span&gt;&lt;/a&gt;Modulyatsiya qiluvchi omillarni tahlil qilish&lt;/h4&gt;\n&lt;p&gt;Uyg‘onish bilan bog‘liq bo‘lgan interiktal faollikdagi o‘zgarishlarni modulyatsiya qiluvchi omillarni o‘rganish uchun tadqiqotchilar miyaning anatomik sohasi, tutqanoq boshlanish zonasining ishtiroki va uyqu bosqichining ta'sirini baholadilar. Uyg‘onishning interiktal razryadlarning tarqalishiga sezilarli ta'siri kuzatilmagani sababli, modulyatsiya qiluvchi omillarning keyingi tahlili faqat razryadlar soni bo‘yicha amalga oshirildi. Elektrodlar lokalizatsiyasi avvalgi ishlarda qo‘llanilgan standart protseduralar asosida bajarildi. Implantatsiyadan keyingi KT yoki MRT tasvirlari har bir bemorning operatsiyadan oldingi MRT tasvirlari bilan birlashtirildi, ular o‘z navbatida ICBM152 nosimmetrik miya modeliga nostandart tarzda moslashtirildi. Bu elektrodlar o‘rnini umumiy stereotaksik fazoda aniq belgilash imkonini berdi. Elektrod kanallari har bir kontakt koordinatalari markazida joylashgan 5 mm radiusli sfera yordamida MICCAI atlasi asosida anatomik sohalarga ajratildi. Kanallar uyquning asosiy regulyatori bo‘lgan talamus bilan funksional bog‘liqlikdagi farqlarni aks ettirish uchun meziotemporal (amigdala, gippokamp va entorinal po‘stloqni o‘z ichiga olgan) yoki neokortikal guruhlarga bo‘lindi. Neokortikal sohalar keng talamokortikal proyeksiyalarni olsa, meziotemporal sohalar talamus bilan kamroq bog‘langan. Bu anatomik tasniflash uyqu va tutqanoq o‘zaro ta'sirini o‘rgangan oldingi chuqur EEG tadqiqotlariga mos keldi. Interiktal razryadlar soni neokortikal va meziotemporal sohalardan kelib chiqqan razryadlar uchun alohida hisoblandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Meziotemporal va neokortikal miya zonalari talamus bilan bog‘lanish zichligi bo‘yicha farqlanadi, bu ularning uyqu paytidagi epileptik faolligidagi tafovutlarni tushuntiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tutqanoq boshlanish zonasining uyg‘onish bilan bog‘liq interiktal dinamikaga ta'siri razryadlarning ushbu zona ichida yoki tashqarisida hosil bo‘lganiga qarab tasniflanishi orqali baholandi. Har bir bemor uchun tutqanoq boshlanish zonasi klinik chuqur EEG yozuvlari asosida neyrofiziologiya va epileptologiya bo‘yicha sertifikatlangan nevrolog tomonidan aniqlandi. Tutqanoqning boshlanishi fon faolligidan vizual tarzda farqlanadigan dastlabki barqaror ritmik EEG o‘zgarishi sifatida belgilanib, tutqanoq boshlanish zonasi shu faollikni ko‘rsatuvchi kontaktlarni o‘z ichiga oldi. Agar bir nechta tutqanoq qayd etilgan bo‘lsa, barcha holatlarda kontaktlarning barqaror ishtiroki e'tiborga olindi. Har bir chuqur EEG kanali «tutqanoq boshlanish zonasi» yoki «zona tashqarisida» deb belgilandi, bu esa chaqirilgan uyg‘onish va nazorat sharoitlari bilan bog‘liq to‘rtta 3 soniyali oraliqda razryadlar sonini alohida aniqlash imkonini berdi. Har qanday kanal quyi guruhida uchtadan kam kanali bo‘lgan bemorlar tahlildan chiqarib yuborildi.&lt;/p&gt;\n&lt;p&gt;Uyqu bosqichiga bog‘liqligini baholash uchun hodisalar ular sodir bo‘lgan NREM uyqu bosqichiga qarab ajratildi. Auditor stimullar standart uyqu mezonlaridan foydalangan holda N2 yoki N3 bosqichlarida yuzaga kelganiga qarab guruhlandi. Bosqichlar o‘tish davriga to‘g‘ri keladigan uyg‘onishlar tasnif barqarorligini ta'minlash uchun chiqarib tashlandi. Barcha kanallar bo‘yicha razryadlar soni chaqirilgan uyg‘onish va nazorat sharoitida har bir uyqu bosqichi uchun alohida hisoblandi. N2 yoki N3 bosqichlarida chaqirilgan uyg‘onishlari bo‘lmagan bemorlar tahlildan chiqarildi.&lt;/p&gt;\n&lt;p&gt;Sekin to‘lqinli faollikning ta'sirini baholash uchun sekin to‘lqinlar bipolar chuqur EEG kanallarida ilgari ishlab chiqilgan algoritm yordamida avtomatik ravishda aniqlandi. Stimulga javoblar 3 soniyali uyg‘onish oralig‘ida yoki nazorat oralig‘ida biron bir kanalda sekin to‘lqin aniqlanganiga qarab, sekin to‘lqinli uyg‘onishlar yoki alohida sekin to‘lqinli javoblar sifatida tasniflandi.&lt;/p&gt;\n&lt;h4 id=\"statistical-analyses\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#statistical-analyses\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Statistical analyses&lt;/span&gt;&lt;/a&gt;Statistical analyses&lt;/h4&gt;\n&lt;p&gt;Barcha IED metrikalari, jumladan IED soni va tarqalish kanallari miqdori, oldindan belgilangan to‘tta uch sekundlik vaqt oralig‘i bo‘yicha taqqoslandi: eshitish stimullaridan oldingi baza ( uyg‘onishni keltirib chiqargan stimullar uchun), uyg‘onish oynasi, uyg‘onish keltirmagan stimullar uchun bazaviy qism va neytral stimullar uchun mos keluvchi nazorat oynasi. Ushbu 3 soniyali epoxalar uyqu paytida IED ni baholagan oldingi SEEG tadqiqotiga mos ravishda, tovush stimolidan darhol oldin va uyg‘onish vaqtida lokal uyqu mikrostatlarini qayd etish imkonini berdi. 3 soniyali pre-stimul epoxalaridagi IED miqdori patsiyentning umumiy bazaviy holatini to‘g‘ri aks ettirishini tasdiqlash uchun, mualliflar ushbu oraliqlardagi normallashtirilgan IED ko‘rsatkichlarini tungi yozuv davomida tasodifiy tanlab olingan va uyg‘onishdan xoli bo‘lgan teng davomiylikdagi epoxalar bilan solishtirdilar. Bunda Tweedie taqsimoti va logarifmik bog‘lanish funksiyasiga ega bo‘lgan GLMM qo‘llanib, epoxa turi o‘rnatilgan omil (fixed effect), patsiyent ID si esa tasodifiy omil (random effect) sifatida kiritildi.&lt;/p&gt;\n&lt;p&gt;IED soni manfiy binomial taqsimot va logarifmik funksiyali GLMM yordamida modellashtirildi, chunki bu usul IED kabi me'yoridan ortiq tarqalgan sanoqli ma'lumotlarni tahlil qilish uchun juda mos keladi. Asosiy o‘rganiladigan omil sifatida shart-sharoit (uyg‘onish vs nazorat) olindi, pre-stimul IED soni va stimul intensivligi o‘rnatilgan kovariatalar sifatida kiritildi, shuningdek, bazaviy darajadagi farqlarni hisobga olish uchun SEEG kontaktlari va patsiyent ID si tasodifiy kesishmalar sifatida belgilandi. IED tarqalish kanallarining o‘rtacha soni musbat siljigan uzluksiz o‘zgaruvchilar uchun mos keluvchi Gamma GLMM orqali modellashtirildi. Asosiy uyg‘onish tahlili uchun to‘rtta IED modeli tuzildi: biri barcha faol kanallar uchun, qolgan uchtasi esa shart-sharoit hamda modulyator omillar (anatomik miya sohasi, SOZ ishtiroki va uyqu bosqichi) o‘rtasidagi o‘zaro ta'sirni baholashga mo‘ljallandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GLMM (umumlashtirilgan chiziqli aralash modellar) — butun guruh bo‘yicha umumiy qonuniyatlarni ham, har bir alohida patsiyent yoki elektrodning o‘ziga xos xususiyatlarini bir vaqtning o‘zida hisobga olish imkonini beruvchi statistik usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tarqalish kanallari modeli shart-sharoit bo‘yicha sezilarli ta'sir ko‘rsatmagani sababli, tarqalishga oid qo‘shimcha modulyator omillar tahlili bajarilmadi. Ushbu natijalar o‘z-özidan uyg‘onishlarga ham tegishli ekanligini baholash uchun, xuddi shunday manfiy binomial va Gamma GLMM arxitekturasi qo‘llanilib, boshlang‘ich darajaga tuzatish kiritilgan holda o‘z-özidan uyg‘onishlar vaqtidagi IED miqdori hamda tarqalishi baholandi. Qo‘shimcha ravishda, uyg‘onishlar vaqtida qayd etilgan yuqori chastotali osilatsiyalar (HFO) miqdori ham manfiy binomial GLMM yordamida o‘rganildi.&lt;/p&gt;\n&lt;p&gt;Uyg‘onishlar paytida kuzatilgan IED o‘sishiga miya holatidagi dastlabki farqlar sabab bo‘lgan-bo‘lmaganini aniqlash uchun, pre-stimul IED soni alohida manfiy binomial GLMM orqali tekshirildi. Shuningdek, uyg‘onishlarning o‘tkir ta'siri kattaroq vaqt oralig‘iga ham tarqalishini tekshirish maqsadida, NREM uyqusi davomida uyquni parchalash uchun stimul berilgan birinchi yarmidagi global IED chastotasi tiklanish uyqusi ta'minlangan ikkinchi yarmidagi ko‘rsatkichlar bilan taqqoslandi. Birinchi va ikkinchi yarm qiyoslash dizayni dori vositalari darajasini bir xilda saqlagan holda uyqu parchalanishining yuqori va past davrlarini solishtirish imkonini berdi. Global IED ko‘rsatkichlari ikki tomonlama Uilkoxon testidan foydalangan holda taqqoslandi.&lt;/p&gt;\n&lt;h4 id=\"ragbatlantirishga-javob-berishda-miyaning-boshlangich-holatining-roli\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#ragbatlantirishga-javob-berishda-miyaning-boshlangich-holatining-roli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ragʻbatlantirishga javob berishda miyaning boshlangʻich holatining roli&lt;/span&gt;&lt;/a&gt;Ragʻbatlantirishga javob berishda miyaning boshlangʻich holatining roli&lt;/h4&gt;\n&lt;p&gt;Miyaning ragʻbatlantirishgacha boʻlgan holati elektrofitsiologik javobga ta'sir qilishini bevosita sinash uchun yana ikkita model toʻplami tuzildi. Ragʻbatlantirishgacha boʻlgan spektral quvvat nisbati skalp EEG (Fz-Cz yoki Fz-Cz mavjud boʻlmagan ikki bemorda F3-C3) ma'lumotlariga koʻra δ/(θ+α+β) ([0.5-4 Hz]/[4.5-30 Hz]) koʻrinishida aniqlandi. Ushbu nisbat tovush signalidan oldingi 3 soniyali davr mobaynida hisoblandi, soʻngra &lt;span class=\"yfm-latex\" data-content=\"%5C_%5Ctext%7Blog%7D_%7B10%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; transformatsiyasidan va z-skalerdan oʻtkazildi. Quvvat qiymatlari standart chastota diapazonlari uchun olindi: δ (0.5–4 Gts), θ (4.5–8 Gts), α (8–12 Gts) va β (12–30 Gts). Birinchi navbatda, uygʻonyot (arousal) javobining sekin toʻlqinli izolyatsiya qilingan javobga nisbatan ehtimolligi logit bogʻlanish funksiyasiga ega binomial GLMM yordamida modellashtirildi. Bunda ragʻbatlantirishgacha boʻlgan spektral quvvat nisbati, stimulyatsiya intensivligi va boshlangʻich IED (epileptiform razryadlar) soni qat'iy (fixed) ta'sir sifatida, bemor ID raqamiga biriktirilgan SEEG kontaktlari esa tasodifiy kesishmalar (random intercepts) sifatida kiritildi. Ushbu model boshlangʻich δ-faolligi uygʻonyot ehtimolligini bashorat qilishini tekshirdi. Ikkinchidan, δ-holatining ragʻbatlantirishga javob turi va epileptiform faollik orasidagi bogʻliqlikni modulyatsiya qilishini aniqlash uchun IED soni manfiy binomial GLMM yordamida log bogʻlanish funksiyasi orqali baholandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Manfiy binomial GLMM — hodisalar chastotasi dispersiyasi o'rtacha qiymatdan yuqori bo'lgan ma'lumotlarni tahlil qilish uchun qo'llaniladigan statistik usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;\"Javob turi × spektral quvvat nisbati\" o'zaro ta'siri ahamiyatlilik darajasiga etgani sababli, har bir javob turi uchun alohida post-hoc simple slopes tahlili bajarildi. Bu aloqaning yo'nalishi va ahamiyatliligini aniqlash hamda δ-faolligining \"ruxsat beruvchi\" yoki \"himoya qiluvchi\" rolini ochib berishga yordam berdi. δ-holati javob turi bilan IED soni o'rtasida to'g'ridan-to'g'ri chalg'ituvchi omil bo'lishi ehtimolini istisno qilish uchun o'zgarish sezgirligi tahlili (change-in-estimate sensitivity analysis) o'tkazildi: javob turining IED soniga ta'siri spektral quvvat nisbatini hisobga olmagan va kiritilgan tuzatilgan modellar solishtirildi.&lt;/p&gt;\n&lt;h4 id=\"stimulyatsiya-intensivligi-nazorati-va-talamus-tahlili\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#stimulyatsiya-intensivligi-nazorati-va-talamus-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Stimulyatsiya intensivligi nazorati va talamus tahlili&lt;/span&gt;&lt;/a&gt;Stimulyatsiya intensivligi nazorati va talamus tahlili&lt;/h4&gt;\n&lt;p&gt;Stimulyatsiya intensivligining o'zi IED sonini boshqarayotganini tekshirish uchun nazorat davrlaridagi IED soni manfiy binomial GLMM orqali modellashtirildi. Bunda qiziqish uyg'otuvchi qat'iy ta'sir sifatida stimulyatsiya intensivligi olindi, boshlang'ich IED soni kovariata sifatida kiritildi va bemorlarga biriktirilgan SEEG kontaktlari tasodifiy kesishmalar sifatida qo'shildi. Ushbu model sezilarli uyg'onyot kuzatilmaganda stimulyatsiya intensivligi IED soni bilan bog'liqligini tekshirdi. Keyinchalik, uyg'ongan uyg'onyotlar va nazorat davrlari orasidagi IED sonidagi farq stimulyatsiya intensivligiga bog'liqligini aniqlash uchun barcha davrlardagi IED soni hodisa turi, stimulyatsiya intensivligi va ularning o'zaro ta'sirini o'z ichiga olgan manfiy binomial GLMM yordamida modellashtirildi. Talamus ichiga SEEG elektrodlari o'rnatilgan to'rt nafar bemorda talamik spektral quvvat nisbati δ/(θ+α+β) bipolar mos yozuvli talamik kontaktlardan hisoblandi. Nazorat va rag'batlantirishgacha bo'lgan davrlar orasidagi farq sifatida hisoblangan talamik spektral quvvat nisbatining o'zgarishi Gaussian oilasidagi GLMM yordamida baholandi.&lt;/p&gt;\n&lt;h4 id=\"kop-sonli-taqqoslashlar-uchun-statistik-tuzatishlar\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#kop-sonli-taqqoslashlar-uchun-statistik-tuzatishlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ko'p sonli taqqoslashlar uchun statistik tuzatishlar&lt;/span&gt;&lt;/a&gt;Ko'p sonli taqqoslashlar uchun statistik tuzatishlar&lt;/h4&gt;\n&lt;p&gt;Ko'p sonli taqqoslashlarni nazorat qilish uchun modellar natija o'zgaruvchisi (IED soni, HFO soni va tarqalish kanallari soni) va tahlil kontekstiga ko'ra oldindan belgilangan oilalarga guruhlandi. Ikki bosqichli tuzatish yondashuvi qo'llandi. Birinchidan, asosiy qiziqish uyg'otuvchi qat'iy ta'sir (yoki o'zaro ta'sir) uchun p-qiymatlar har bir oiladagi modellar soni bo'yicha Bonferroni tuzatishidan o'tkazildi. Xususan, asosiy uyg'onyot IED tahlili to'rtta modeldan iborat oilani tashkil etdi (p × 4). Xuddi shunday, spuntan uyg'onyot IED va uyg'ongan HFO tahlillari alohida to'rttalik oilalarni tashkil etdi (p × 4); sekin to'lqinli tahlil oilasi ikkita modeldan iborat bo'ldi (p × 2); tarqalish kanallari modellari esa alohida yakka modellar oilasi sifatida qaraldi. Ikkinchidan, o'zaro ta'sir ahamiyatliligiga erishgan har qanday model uchun juftlik post-hoc taqqoslashlarining p-qiymatlari model ichida qo'shimcha Bonferroni tuzatishiga uchradi (p × 2). Ta'sir o'lchamlari insidensiya tezligi nisbatan (IRR) ko'rsatildi, bashorat qilingan o'rtacha qiymatlar esa 95% ishonch intervallari bilan taqdim etildi.&lt;/p&gt;\n&lt;h4 id=\"vaqt-boyicha-tahlil-va-statistik-qayta-ishlash\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#vaqt-boyicha-tahlil-va-statistik-qayta-ishlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Vaqt bo'yicha tahlil va statistik qayta ishlash&lt;/span&gt;&lt;/a&gt;Vaqt bo'yicha tahlil va statistik qayta ishlash&lt;/h4&gt;\n&lt;p&gt;Uyg'onish va stimulyatsiya boshlanishi atrofidagi tutilishlararo epileptiform razryadlar (IED) dinamikasini o'rganish uchun har bir bemorning ko'rsatkichlari uning maksimal qiymatiga normallashtirildi. So'ngra ma'lumotlar 500 ms li oraliqlarga birlashtirilib, barcha bemorlar bo'yicha o'rtacha qiymat chiqarildi va natijalar o'rtacha ± standart xatolik sifatida ko'rsatildi. IED qayd etilgan barcha SEEG kanallari hisobga olindi. Hodisa boshlanganidan keyingi har bir vaqt oralig'i uchun guruh bo'yicha normallashtirilgan ko'rsatkichlar bir tomonlama Mann-Uitni testlari yordamida boshlang'ich bazaviy qiymatlar bilan taqqoslandi, bunda p &amp;lt; 0.05 bo'lgan statistik ahamiyatli oraliqlar grafiklarda yulduzchalar bilan belgilandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Mann-Uitni testi — bu ma'lumotlarning normal taqsimlanishini talab qilmasdan, ikkita guruhni o'zaro solishtirish uchun ishlatiladigan no parametric statistik usul.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Uyg'onish davomiyligi va IED chastotasi o'rtasidagi bog'liqlikni baholash uchun gamma-taqsimot va logarifmik bog'lovchi funksiyaga ega umumlashtirilgan chiziqli aralash model (GLMM) qo'llanildi. Bu usul musbat siljigan uzluksiz o'zgaruvchilarni modellashtirish uchun mos keladi. Mustaqil o'zgaruvchi sifatida uyg'onish davomiyligi soniyalarda, bog'liq o'zgaruvchi sifatida esa har bir kanal uchun to'liq uyg'onish davridagi IED ning normallashtirilgan soni yoki soniyasiga IED chastotasi olindi. Baza qiymati nol bo'lgani sababli aniqlanmagan IED qiymatlariga ega uyg'onishlar GLMM tahlilidan chiqarib tashlandi. Bemorlar orasidagi o'zgaruvchanlikni hisobga olish uchun modelga tasodifiy kesishish sifatida bemor ID raqami kiritildi.&lt;/p&gt;\n&lt;h4 id=\"talamokortikal-ozaro-aloqalarni-tahlil-qilish\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#talamokortikal-ozaro-aloqalarni-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Talamokortikal o'zaro aloqalarni tahlil qilish&lt;/span&gt;&lt;/a&gt;Talamokortikal o'zaro aloqalarni tahlil qilish&lt;/h4&gt;\n&lt;p&gt;Tadqiqotchilar talamus spektral faolligi uyg'onish bilan bog'liq IED o'zgarishlari bilan bog'liqligini ham tekshirdilar, buning uchun talamus ichiga SEEG elektrodlari o'rnatilgan to'rt nafar bemorda kichik guruh tahlili o'tkazildi. Ushbu bemorlarda N2 uyqu bosqichida yuzaga kelgan jami 56 ta qo'zg'atilgan uyg'onish holatlari kiritildi. Har bir uyg'onish uchun talamusning spektral quvvat nisbati δ/(θ+α+β) ([0.5-4 Gs]/[4.5-30 Gs]) 3 soniyali uyg'onish davri mobaynida bipolar ulangan talamik kontaktlar asosida hisoblandi. Sekin va tez talamik faollik nisbatini ko'rsatuvchi bu ko'rsatkich stimulgacha bo'lgan 3 soniyali bazaviy davrga normallashtirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Spektral quvvat va dessa-ritmlar chuqur uyqu bosqichlariga xos bo'lgan neyronlarning sinxronlashgan faolligini ko'rsatadi, tez ritmlar esa uyg'onish va kognitiv faollik bilan bog'liq.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;IED soni barcha SEEG kanallaridan o'sha 3 soniyali uyg'onish davrida ajratib olindi va ham kanal soniga, ham stimulgacha bo'lgan bazaviy darajaga nisbatan normallashtirildi. Shundan so'ng talamik spektral quvvat nisbati normallashtirilgan IED sonini bashorat qilishini tekshirish uchun gamma-taqsimot va logarifmik bog'lanishga ega GLMM qo'llanildi. Model talamik spektral quvvat nisbatini qat'iy ta'sir (fixed effect) va takroriy o'lchovlarni hisobga olish uchun bemor ID sini tasodifiy kesishish sifatida o'z ichiga oldi. Model baholari β ±  SE ko'rinishida berildi, statistik ahamiyatlilik Wald testlari yordamida (P &amp;lt; 0.05) baholandi va 95% ishonch intervallari ko'rsatildi. Stimulyatsiya tufayli yuzaga kelgan uyqu parchalanishi va tiklanish uyqusi o'rtasidagi umumiy IED chastotasi hamda uyg'onish chastotasini taqqoslash uchun Cliff delta (Cliff's d) yordamida ta'sir o'lchamlari hisoblandi. Barcha statistik tahlillar α = 0.05 ahamiyatlilik chegarasida o'tkazildi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-f1.jpg\" alt=\"1-rasm. Tungi SEEG-PSG yozuvlari davomida uyquni fragmentatsiya qilish protokolining umumiy ko'rinishi. (a) Dori vosital\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. Tungi SEEG-PSG yozuvlari davomida uyquni fragmentatsiya qilish protokolining umumiy ko'rinishi. (a) Dori vositalariga chidamli fokalli tutqanoqdan aziyat chekadigan va jarrohlik oldidan tekshiruvdan o'tayotgan bemorlarda tungi uyqu davomida sinxron SEEG va uyqu (PSG) yozuvlari olindi. SEEG elektrodlari har bir bemorning klinik talablariga muvofiq diagnostik tekshiruvning bir qismi sifatida o'rnatildi. PSG standart xalqaro 10-20 tizimiga muvofiq joylashtirilgan bosh terisi ostidagi EEG yozuvlarini, shuningdek, iyak va oldingi katta boldir mushaklarining (LFlex/RFlex) yuzaki elektrookulografiyasi (EOG) va elektromiyografiyasini (EMG) o'z ichiga oldi. (b) Uyquni fragmentatsiya qilish uyquning birinchi yarmida, bemorning odatiy uxlash vaqtidan boshlab, barqaror NREM uyqusi davomida 40 dan 100 dB gacha bo'lgan intensivlikdagi 5 soniyali, 1 kHz chastotali tovush signallarini berish orqali induksiya qilindi. Tovush stimulyatsiyasi to'liq uyg'otmasdan uyg'onishlarni keltirib chiqarish uchun real vaqt rejimidagi PSG uyqu ballariga asoslanib quloqchinlar orqali qo'lda berildi. (c) Uyg'onishlar PSG yozuvlari yordamida oflayn tarzda belgiyalandi; agar hodisa stimulyator boshlanganidan keyin 6.5 s ichida boshlansa, u 'chaqirilgan uyg'onish' sifatida tasniflandi. Hujumlararo epileptiform razryadlar (IED) soni va tarqalishi 3 soniyali davrlar bo'yicha taqqislandi: stimulyatorgacha bo'lgan boshlang'ich daraja va stimulyator boshlanganidan keyingi oyna. Uyg'onishni keltirib chiqargan stimullar uchun stimulyator boshlanganidan keyingi oyna uyg'onish boshlanishi bilan boshlandi. Uyg'onish keltirib chiqarmagan stimullar uchun u stimulyator boshlanganidan 1.08 s o'tgach boshlandi, bu stimulyatordan uyg'onish boshlanishigacha bo'lgan median latentligiga mos keladi (latentsiyasi moslashtirilgan nazorat oynasi).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-f2.jpg\" alt=\"2-rasm. Tovush stimulyatsiyasi tutqanoqli bemorlarda chaqirilgan uyg'onishlar va uyqu fragmentatsiyasini ishonchli tarzd\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm. Tovush stimulyatsiyasi tutqanoqli bemorlarda chaqirilgan uyg'onishlar va uyqu fragmentatsiyasini ishonchli tarzda keltirib chiqaradi. (a) Barcha bemorlarda tungi SEEG-PSG yozuvlari davomida umumiy uyqu vaqti (TST). (b) Har bir ishtirokchida tovush stimulyatsiyasi protokoli tomonidan keltirib chiqarilgan chaqirilgan uyg'onishlarning umumiy soni. (c) Har bir ishtirokchida chaqirilgan uyg'onishlarga olib kelgan stimullarning foizi. (a-c) panellaridagi qizil uzuq-uzuq chiziq guruh o'rtacha qiymatini ko'rsatadi. (d) Barcha bemorlar bo'yicha jamlangan, uyg'onishlarni keltirib chiqarish uchun ishlatilgan tovush stimulyatsiyasi ovoz balandligining taqsimoti. 90 dB chaqirilgan uyg'onishlarni keltirib chiqarish uchun eng ko'p ishlatiladigan ovoz balandligi bo'ldi. (e) NREM 2-bosqichi (N2) va 3-bosqichi (N3) uyqusi sifatida baholangan davrlarda har bir ishtirokchidagi chaqirilgan uyg'onishlar soni. Barqaror uyqu holatini tasniflashni ta'minlash uchun bosqichlararo o'tishlarni qamrab oluvchi uyg'onishlar bosqichga xos hisoblardan chiqarib tashlandi. (f) Uyqu oqshomining birinchi va ikkinchi yarmida, ham tovush ta'sirida chaqirilgan uyg'onishlarni, ham tovush stimulyatsiyasidan qat'i nazar o'z-o'zidan sodir bo'ladigan uyg'onishlarni o'z ichiga olgan umumiy uyg'onish chastotasi. Oqshomning birinchi yarmida, tovush stimulyatsiyasi protokoli qo'llanilganda, sezilarli darajada ko'proq uyg'onishlar sodir bo'ldi (Vilkokson belgili-rangli testi, p = 0.00118, Kliff d = 0.46). Ma'lumotlar alohida bemor qiymatlari sifatida taqdim etilgan. Vizual taqqoslash uchun chakka bo'lagi tutqanog'i (TLE; sariq doiralar) va ekstratemporal bo'lak tutqanog'i (ETLE; to'q ko'k doiralar) bo'lgan bemorlar ajratib ko'rsatilgan. Oqshomning birinchi va ikkinchi yarmida TLE va ETLE kenja guruhlari orasida uyg'onish chastotalarida barqaror farqlar kuzatilmadi. Bu natijalar tutqanoqli bemorlarda tovush stimulyatsiyasi protokolining samaradorligini tasdiqladi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-f3.jpg\" alt=\"3-rasm. Chaqirilgan uyqu uyg'onishlari hujumlararo epileptiform razryadlar (IED) sonini oshiradi, lekin ularning tarqali\" /&gt;&lt;/p&gt;\n&lt;p&gt;*3-rasm. Chaqirilgan uyqu uyg'onishlari hujumlararo epileptiform razryadlar (IED) sonini oshiradi, lekin ularning tarqalishini oshirmaydi. (a) Bosh terisi EEG, elektrookulografiya (EOG) va iyak hamda oldingi katta boldir (LFlex) kanallarining elektromiyografiyasini (EMG) ko'rsatuvchi bir bemorning polisomnografiya (PSG) izlarining vakillik namunasi. Sariq soyali hudud qizil chiziq bilan ko'rsatilgan tovush stimulyatsiyasi tufayli keltirib chiqarilgan chaqirilgan uyg'onishni bildiradi. (b) Chap chakka bo'lagiga qaratilgan chuqur elektroddan (bipolyar kanallar LTP1-LTP10) bir xil vaqt oynasidan mos keladigan SEEG izlari. Tovush stimulyatsiyasidan so'ng, uyg'onish davrida (sariq soyali hudud) IED larning sezilarli darajada o'sishi kuzatiladi. (c) Standart miya shabloniga proyeksiyalangan barcha bemorlar bo'yicha (n = 17 bemor) SEEG kontaktlarining fazoviy taqsimoti. (d) Stimulyatorgacha bo'lgan IED soni va stimulyator intensivligiga moslashtirilgan, nazorat va chaqirilgan uyg'onish sharoitlarida kanal-davr uchun model tomonidan bashorat qilingan o'rtacha IED soni. Bashorat qilingan IED soni chaqirilgan uyg'onishlar paytida nazoratdagiga qaraganda sezilarli darajada yuqori edi (umumlashtirilgan chiziqli aralash effektlar modeli (GLMM), β-baholash ± standart xato (SE): 0.537 ± 0.012, hodisalar chastotasi nisbati (IRR) = 1.71, p &amp;lt; 0.0001), bu nazoratga nisbatan 71% ga oshishiga mos keladi. (e) Stimulyatorgacha bo'lgan tarqalish kanallari soni va stimulyator intensivligiga moslashtirilgan, nazorat va chaqirilgan uyg'onish sharoitlarida har bir davr uchun model tomonidan bashorat qilingan IED tarqalish kanallari soni. Tarqalish kanallari soni chaqirilgan uyg'onishlar va nazorat o'rtasida sezilarli darajada farq qilmadi (GLMM, β-baholash ± SE: 0.212 ± 0.408, IRR = 1.24, P = 0.604). Xato chiziqlari 95% ishonch oralig'ini bildiradi. **&lt;em&gt;p &amp;lt; 0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-f4.jpg\" alt=\"4-rasm. Hujumlararo epileptiform razryadlar (IED) ning uyg'onish bilan bog'liq o'sishi neokortikal hududlarda sodir bo'l\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm. Hujumlararo epileptiform razryadlar (IED) ning uyg'onish bilan bog'liq o'sishi neokortikal hududlarda sodir bo'ladi, lekin meziotemporal hududlarda sodir bo'lmaydi. (a) Hududiy tahlil uchun ishlatiladigan ikki anatomik kategoriyani ta'kidlaydigan sxema: meziotemporal (yashil) va neokortikal (to'q sariq) hududlar solishtirildi. (b) Meziotemporal (yashil) va neokortikal (to'q sariq) kontakt joylarini ko'rsatuvchi, standart miya shabloniga proyeksiyalangan barcha bemorlar bo'yicha (n = 17 bemor) SEEG kontaktlarining fazoviy taqsimoti. (c) Stimulyatorgacha bo'lgan IED soni va stimulyator intensivligiga moslashtirilgan, nazorat va chaqirilgan uyg'onish sharoitlarida anatomik hudud bo'yicha (meziotemporal va neokortikal) kanal-davr uchun model tomonidan bashorat qilingan o'rtacha IED soni. Shart va anatomik hudud o'rtasidagi o'zaro ta'sir ahamiyatli edi (umumlashtirilgan chiziqli aralash effektlar modeli (GLMM), β-baholash ± standart xato (SE): 0.737 ± 0.041, hodisalar chastotasi nisbati (IRR) = 2.09, p &amp;lt; 0.0001), bu chaqirilgan uyg'onishlarning IED soniga ta'siri meziotemporal va neokortikal hududlar o'rtasida farq qilishini ko'rsatadi. Meziotemporal hududlarda (n = 14 bemor) bashorat qilingan IED soni chaqirilgan uyg'onishlar va nazorat o'rtasida sezilarli darajada farq qilmadi (GLMM, β-baholash ± SE: -0.087 ± 0.039, IRR = 0.92, P = 0.054). Neokortikal hududlarda (n = 17 bemor) bashorat qilingan IED soni chaqirilgan uyg'onishlar paytida nazoratdagiga qaraganda sezilarli darajada yuqori edi (GLMM, β-baholash ± SE: 0.650 ± 0.013, IRR = 1.92, p &amp;lt; 0.0001), bu 92% ga oshishiga mos keladi. Xato chiziqlari 95% ishonch oralig'ini bildiradi. *** p &amp;lt; 0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-f5.jpg\" alt=\"5-rasm. Hujumlararo epileptiform razryadlar (IED) ning uyg'onish bilan bog'liq o'sishi tutqanoq boshlanish zonasi (SOZ) \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm. Hujumlararo epileptiform razryadlar (IED) ning uyg'onish bilan bog'liq o'sishi tutqanoq boshlanish zonasi (SOZ) tomonidan modulyatsiya qilinmaydi. (a) SEEG kontaktlarining anatomik tasnifini ko'rsatuvchi sxema: SOZ hududlarida (qizil) va SOZ bo'lmagan hududlarda (ko'k) kelib chiqadigan IED lar solishtirildi. (b) SOZ (qizil) va SOZ bo'lmagan (ko'k) kontakt joylarini ko'rsatuvchi, aniqlangan SOZ ga ega barcha bemorlar bo'yicha (n = 12) standart miya shabloniga proyeksiyalangan SEEG kontaktlarining fazoviy taqsimoti. (c) Stimulyatorgacha bo'lgan IED soni va stimulyator intensivligiga moslashtirilgan, nazorat va chaqirilgan uyg'onish sharoitlarida SOZ holati bo'yicha (SOZ tashqarisida va ichida) kanal-davr uchun model tomonidan bashorat qilingan o'rtacha IED soni. Shart va SOZ holati o'rtasidagi o'zaro ta'sir ahamiyatli emas edi (umumlashtirilgan chiziqli aralash effektlar modeli (GLMM), β-baholash ± standart xato (SE): 0.005 ± 0.026, hodisalar chastotasi nisbati (IRR) = 1.00, P = 1.00), bu chaqirilgan uyg'onishlarning IED soniga ta'siri SOZ ichidagi va tashqarisidagi kontaktlar o'rtasida farq qilmasligini ko'rsatadi. Xato chiziqlari 95% ishonch oralig'ini bildiradi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-f6.jpg\" alt=\"6-rasm. Uyg'onish (aruzol) bilan bog'liq interiktal epileptiform razryadlarning (IER) ko'payishi uyqu bosqichiga bog'liq\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm. Uyg'onish (aruzol) bilan bog'liq interiktal epileptiform razryadlarning (IER) ko'payishi uyqu bosqichiga bog'liq. (a) Eshitish stimulyatsiyasi protokoli bajarilgan, har bir bemorning odatiy uxlash vaqtidan keyingi dastlabki 4 soat sifatida aniqlangan tunning birinchi yarmida NREM 2-bosqichi (N2) va 3-bosqichi (N3) ajratib ko'rsatilgan, sxematik gipnogrammalar. N2 va N3 uyqu paytida yuzaga keladigan qo'zg'atilgan uyg'onishlar uyqu bosqichining aruzol keltirib chiqaradigan interiktal epileptiform razryadlariga (IER) ta'sirini baholash uchun taqqoslandi. (b) Stimuldan oldingi IER soni va stimul intensivligiga tuzatish kiritilgan holda, nazorat va qo'zg'atilgan uyg'onish sharoitida uyqu bosqichi (N2 va N3 uyqu) bo'yicha kanal-epox uchun model bashorat qilgan o'rtacha IER soni. Shart va uyqu bosqichi o'rtasidagi o'zaro ta'sir ahamiyatli bo'ldi (umumlashtirilgan chiziqli aralash effektlar modeli (GLMM), β-baholash ± standart xato (SE): -0.271 ± 0.031, hodisalar chastotasi nisbati (IRR) = 0.76, p &amp;lt; 0.0001), bu qo'zg'atilgan uyg'onishning IER soniga ta'siri N2 va N3 uyquda farq qilishini ko'rsatadi, bu N2 ga nisbatan N3 da 24% kamroq o'sishga mos keladi. N2 uyquda (n = 16 bemor) bashorat qilingan IER soni qo'zg'atilgan uyg'onish paytida nazoratdagiga qaraganda sezilarli darajada yuqori edi (GLMM, β-baholash ± SE: 0.718 ± 0.017, IRR = 2.05, p &amp;lt; 0.0001). N3 uyquda (n = 13 bemor) bashorat qilingan IER soni ham qo'zg'atilgan uyg'onish paytida nazoratdagiga qaraganda sezilarli darajada yuqori edi, garchi N2 dagiga qaraganda kichikroq hajmda bo'lsa ham (GLMM, β-baholash ± SE: 0.447 ± 0.026, IRR = 1.56, p &amp;lt; 0.0001). Xato chiziqlari 95% ishonch oralig'ini ko'rsatadi. *** p &amp;lt; 0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-f7.jpg\" alt=\"7-rasm. Interiktal epileptiform razryadlar (IER) izolyatsiya qilingan sekin to'lqinlardan ko'ra asosan uyg'onish reaksiy\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-rasm. Interiktal epileptiform razryadlar (IER) izolyatsiya qilingan sekin to'lqinlardan ko'ra asosan uyg'onish reaksiyalari (aruzollar) tomonidan boshqariladi, stimuldan oldingi delta faolligi shartga xos modulyator ta'sir ko'rsatadi. (a) Izolyatsiya qilingan sekin to'lqinlar va sekin to'lqinli aruzollarga olib kelgan eshitish stimullaridan oldingi spektral quvvat nisbatining taqsimlanishini ko'rsatuvchi gistogrammalar (δ/(θ+α+β) ((0.5–4 Gts)/(4.5–30 Gts), log10 o'zgartirilgan). (b) Stimul intensivligi va stimuldan oldingi boshlang'ich IER soniga tuzatish kiritilgan holda, stimulga uyg'onish reaksiyasi ehtimolligining stimuldan oldingi spektral quvvat nisbatiga bog'liqligi bo'yicha model bashorat qilgan ehtimollik. Stimuldan oldingi spektral quvvat nisbati izolyatsiya qilingan sekin to'lqin reaksiyasiga nisbatan uyg'onish reaksiyasi ehtimolligi bilan bog'liq emas edi (umumlashtirilgan chiziqli aralash effektlar modeli (GLMM), β-baholash ± standart xato (SE): 0.032 ± 0.014, P = 0.052). (c) Izolyatsiya qilingan sekin to'lqinlar va sekin to'lqinli aruzollar uchun model bashorat qilgan o'rtacha IER soni. Sekin to'lqinli aruzollar izolyatsiya qilingan sekin to'lqinlarga nisbatan sezilarli darajada yuqori IER soni bilan bog'liq edi (GLMM, β-baholash ± SE: 0.542 ± 0.012, hodisalar chastotasi nisbati (IRR) = 1.72, p &amp;lt; 0.0001), bu IER sonining 72% ga oshishiga mos keladi. (d) Javob turi va stimuldan oldingi spektral quvvat nisbati o'rtasidagi o'zaro ta'sir ham ahamiyatli edi (GLMM, β-baholash ± SE: -0.073 ± 0.013, IRR = 0.93, p &amp;lt; 0.0001). Post-xok oddiy qiyaliklar tahlili shuni ko'rsatdiki, yuqoriroq stimuldan oldingi spektral quvvat nisbati izolyatsiya qilingan sekin to'lqinlar paytida IER sonini sezilarli darajada oshirdi (GLMM, β-baholash ± SE = 0.066 ± 0.009, IRR = 1.07, p &amp;lt; 0.0001), bu stimuldan oldingi spektral quvvat nisbatining har 1.0 ga oshishiga IER sonining 7% ga oshishiga mos keladi. Aksincha, stimuldan oldingi spektral quvvat nisbati aruzol qo'zg'atilgandan keyin IER soniga ta'sir qilmadi (GLMM, β-baholash ± SE = -0.007 ± 0.012, IRR = 0.99, P = 1). Xato chiziqlari va soyali hududlar 95% ishonch oralig'ini ko'rsatadi. *** p &amp;lt; 0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt
