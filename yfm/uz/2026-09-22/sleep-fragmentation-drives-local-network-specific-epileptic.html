        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"272\" cy=\"70\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"548\" cy=\"276\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Uzluqli uyqu miyadagi&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;tutqanoq faolligini qanday&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qo'zg'atadi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-f1.jpg\" alt=\"1-rasm. Tungi SEEG-PSG yozuvlari davomida uyquni fragmentatsiya qilish protokolining umumiy ko'rinishi. (a) Dori vosital\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. Tungi SEEG-PSG yozuvlari davomida uyquni fragmentatsiya qilish protokolining umumiy ko'rinishi. (a) Dori vositalariga chidamli fokalli tutqanoqdan aziyat chekadigan va jarrohlik oldidan tekshiruvdan o'tayotgan bemorlarda tungi uyqu davomida sinxron SEEG va uyqu (PSG) yozuvlari olindi. SEEG elektrodlari har bir bemorning klinik talablariga muvofiq diagnostik tekshiruvning bir qismi sifatida o'rnatildi. PSG standart xalqaro 10-20 tizimiga muvofiq joylashtirilgan bosh terisi ostidagi EEG yozuvlarini, shuningdek, iyak va oldingi katta boldir mushaklarining (LFlex/RFlex) yuzaki elektrookulografiyasi (EOG) va elektromiyografiyasini (EMG) o'z ichiga oldi. (b) Uyquni fragmentatsiya qilish uyquning birinchi yarmida, bemorning odatiy uxlash vaqtidan boshlab, barqaror NREM uyqusi davomida 40 dan 100 dB gacha bo'lgan intensivlikdagi 5 soniyali, 1 kHz chastotali tovush signallarini berish orqali induksiya qilindi. Tovush stimulyatsiyasi to'liq uyg'otmasdan uyg'onishlarni keltirib chiqarish uchun real vaqt rejimidagi PSG uyqu ballariga asoslanib quloqchinlar orqali qo'lda berildi. (c) Uyg'onishlar PSG yozuvlari yordamida oflayn tarzda belgiyalandi; agar hodisa stimulyator boshlanganidan keyin 6.5 s ichida boshlansa, u 'chaqirilgan uyg'onish' sifatida tasniflandi. Hujumlararo epileptiform razryadlar (IED) soni va tarqalishi 3 soniyali davrlar bo'yicha taqqislandi: stimulyatorgacha bo'lgan boshlang'ich daraja va stimulyator boshlanganidan keyingi oyna. Uyg'onishni keltirib chiqargan stimullar uchun stimulyator boshlanganidan keyingi oyna uyg'onish boshlanishi bilan boshlandi. Uyg'onish keltirib chiqarmagan stimullar uchun u stimulyator boshlanganidan 1.08 s o'tgach boshlandi, bu stimulyatordan uyg'onish boshlanishigacha bo'lgan median latentligiga mos keladi (latentsiyasi moslashtirilgan nazorat oynasi).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Tunda yaxshi dam olmaslik epilpsiya bilan og'rigan odamlarda miya ishining barqarorligiga putur etkazadi. Tovush stimulyatsiyasi yordamida o'tkazilgan tajribalar har bir qisqa uyg'onish patologik razryadlarni keltirib chiqarishini ko'rsatdi. Bunda xuruj o'chog'i kengaymaydi, ammo yomon uyqu kognitiv funksiyalarga salbiy ta'sir qiladi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Qisqa uyg'onishlar epileptik razryadlar sonini tezda oshiradi.&lt;/li&gt;\n&lt;li&gt;Ushbu ta'sir neokorteksda va ikkinchi uyqu bosqichida kuchliroq namoyon bo'ladi.&lt;/li&gt;\n&lt;li&gt;Mahalliy qo'zg'alish kuchayadi, lekin razryadlar keng tarqalmaydi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqotchilar uyqu beqarorligi va qisqa tutqanoqlar oralig'idagi razryadlar (IED) o'rtasidagi bog'liqlikni o'rganishdi. Buning uchun stereoelektroensefalografiya (SEEG, miya ichki faolligini elektrodlar yordamida qayd etish usuli) va poligrafiya ma'lumotlari birlashtirildi. Dori vositalariga chidamli fokal epilepsiyasi bo'lgan 17 nafar bemor ishtirok etgan tajribada tungi uyquning dastlabki soatlarida 3 dan 15 sekundgacha davom etadigan mikro uyg'onishlar chaqirildi.&lt;/p&gt;\n&lt;p&gt;Natijalar shuni ko'rsatdiki, sun'iy uyg'onishlar epileptiform razryadlar sonining keskin oshishiga olib keladi. Bu o'zgarishlar faqat neokorteksda va sekin uyquning ikkinchi hamda uchinchi bosqichlarida kuzatildi. Razryadlar tarqalish doirasi kengaymagan bo'lsa-da, mahalliy qo'zg'aluvchanlik sezilarli darajada oshdi. Bu uyqu barqarorligi miya faoliyatini himoya qilishda muhimligini bildiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot og'ir dori-darmonga chidamli epilepsiya bilan og'rigan statsionar bemorlarda o'tkazilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Uyqu va tutqanoq faoliyati o'rtasida murakkab bog'liqliklar mavjud, ammo inson miyasida patologik разрядларни keltirib chiqarish va modulyatsiya qilishda uyqu beqarorligining sababiy roli hali to'liq o'rganilmagan. Mualliflar buni bevosita o'rganib chiqib, epilepsiya bilan og'rigan bemorlarda stereoelektroensefalografiya va poligrafiya yozuvlarini birlashtirgan holda, eksperimental tarzda qo'zg'atilgan uyqu uyg'onishlari (mikroaktivatsiyalar) va xurujlararo epileptiform разрядлар (IED) o'rtasidagi nozik vaqtinchalik bog'liqlikni tavsifladilar.&lt;/p&gt;\n&lt;p&gt;Tadqiqot epilepsiya bilan og'rigan bemorlardan olingan stereoelektroensefalografiya va polisomnografiya yozuvlarini birgalikda tahlil qilishga asoslangan. Dinamirani baholash uchun eksperimental tarzda qo'zg'atilgan uyqu mikroaktivatsiyalarining miya anatomik zonalari va uyqu bosqichlari bo'yicha xurujlararo epileptiform разрядлар chastotasiga yuqori aniqlikdagi vaqtinchalik bog'liqligini aniqlash usullaridan foydalanildi.&lt;/p&gt;\n&lt;blockquote&gt;\n&lt;p&gt;[!tip] Stereoelektroensefalografiya (sEEG) — miya to'qimalarining chuqur qatlamlariga kiritilgan elektrodlar yordamida elektr faolligini qayd etish usuli bo'lib, polisomnografiya esa uyqu vaqtida miya to'lqinlari, ko'z harakatlari va mushak tonusini o'lchaydigan kompleks tekshiruvdir.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;p&gt;Uyqudagi mikroaktivatsiyalar xurujlararo epileptiform разрядлар chastotasining tez oshishini keltirib chiqardi va bu ta'sir miyaning anatomik sohasi hamda uyqu bosqichi tomonidan qат'ий boshqarildi. Ko'rsatkichlarning oshishi faqat neokortikal hududlar bilan cheklangan bo'lib, u N2 sekin to'lqinli uyqu bosqichida ham, N3 bosqichida ham kuzatildi, bunda N2 bosqichida kattaroq ta'sir qayd etildi. E'tiborlisi, IED sonining ortishi xuruj boshlanish zonasi va uning atrofidagi hududlar o'rtasida farq qilmadi. Разрядлар umumiy sonining oshishiga qaramay, mikroaktivatsiyalar ularning fazoviy tarqalishini o'zgartirmadi, bu kengroq epileptik tarmoqlarni jalb qilmasdan, mahalliy qobiq qo'zg'aluvchanligining holatga bog'liq kuchayishidan dalolat beradi.&lt;/p&gt;\n&lt;blockquote&gt;\n&lt;p&gt;[!important] Uyqudagi mikroaktivatsiyalar neokorteksda xurujlararo epileptiform разрядларning tez va mahalliy ko'payishiga olib keladi (ayniqsa N2 bosqichida), biroq ularning fazoviy tarqalish zonasini kengaytirmaydi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;p&gt;Ushbu topilmalar uyqu beqarorligining mayda fazoviy-vaqtinchalik miqyosda patologik faollikni faol ravishda keltirib chiqarishdagi sababiy rolini tasdiqlaydi va uyquni barqarorlashtirishni epileptik yukni kamaytirish hamda miya po'stlog'i tarmoqlari faoliyatini saqlab qolish uchun istiqbolli terapevtik strategiya sifatida ta'kidlaydi.&lt;/p&gt;\n&lt;blockquote&gt;\n&lt;p&gt;[!warning] Tadqiqot farmakorezistent epilepsiya bilan og'rigan bemorlarning invaziv ma'lumotlariga asoslangan bo'lib, natijalarni boshqa guruhlarga umumlashtirishda ehtiyotkorlikni talab qiladi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Epilepsiya bilan og'rigan bemorlarning yarmidan ko'progida uyqu sifati yomonligi, uyqusizlik va kunduzgi haddan tashqari uyquchanlik kabi uyqu muammolari kuzatiladi. Bu buzilishlar hayot sifatini pasaytiribgina qolmay, tutqanoqlarni keltirib chiqaradi va epileptik holatni kuchaytiruvchi yopiq doirani hosil qiladi, tungi tutqanoqlar эsa epileptik o'limning asosiy sababi bo'lgan to'satdan kutilmagan o'lim (SUDEP) xavfini oshiradi. Avvalgi tadqiqotlar uyqu beqarorligi va epileptik faollik o'rtasidagi yaqin bog'liqlikni aniqlagan bo'lib, xususan, epileptik faollik tez bo'lmagan ko'z harakati (NREM) uyqusi beqarorligi paytida va 3-15 soniya davom etadigan uyqudan cho'chib uyg'onishlar davrida afzalroq yuzaga keladi. Uyqu beqarorligining markerlari bo'lgan siklik almashinuvchi naqsh (CAP) va uyqu vaqtidagi nafas olish buzilishlari tutqanoqlar sonining ortishi bilan bog'langan. Stereo-elektroatsefalografiya (SEEG) yordamida o'tkazilgan ichki tadqiqotlar epileptik faollik mikrouyg'onishlar bilan vaqtinchalik bog'langanligini, xususan, miyokortikal hududlarda mikrouyg'onishlar boshlanishidan oldin va uyg'onish paytida interiktal epileptiform razryadlar (IED) chastotasi oshishini ko'rsatdi. Shuningdek, bu faollik chuqur va barqaror N3 fazasiga qaraganda yengilroq N2 uyqu bosqichida tez-tez sodir bo'ladi. Biroq, mavjud adabiyotlarning aksariyati kuzatuv xarakteriga ega bo'lib, sabab-oqibat bog'liqligini aniqlashni qiyinlashtiradi, bosh miya yuzasi elektroatsefalografiyasi (EEG) esa o'choqli yoki chuqur joylashgan epileptik faollikni aniqlay olmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Epilepsiya bilan og'rigan bemorlarning yarmidan ko'pi uyqu buzilishidan aziyat chekadi, bu esa tutqanoqlar va SUDEP xavfini oshiradi, biroq uyqu beqarorligi va epileptik faollik o'rtasidagi sababiy bog'liqlikni o'rganish uchun eksperimental tadqiqotlar zarur edi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"uyqu-barqarorligi-va-epilepsiyani-organishda-eksperimental-yondashuv\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#uyqu-barqarorligi-va-epilepsiyani-organishda-eksperimental-yondashuv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Uyqu barqarorligi va epilepsiyani o'rganishda eksperimental yondashuv&lt;/span&gt;&lt;/a&gt;Uyqu barqarorligi va epilepsiyani o'rganishda eksperimental yondashuv&lt;/h4&gt;\n&lt;p&gt;Jarrohlik oldidan tekshiruvdan o'tayotgan dori-darmonlarga chidamli epilepsiyali bemorlarda bajariladigan stereo-elektroatsefalografiya (SEEG) yuqori fazoviy-vaqtinchalik aniqlik bilan miyaning chuqur tuzilmalariga noyob kirish imkoniyatini beradi. Bosh miya EEG, elektromiografiya (EMG) va elektrookulografiyani (EOG) o'z ichiga olgan polisomnografiya (PSG) bilan birlashtirilganda, SEEG uyqu barqarorligi va epileptik faollik o'rtasidagi vaqtinchalik dinamikani batafsil tavsiflash imkonini beradi. Ushbu ishda mualliflar jarrohlik oldidan tekshiruvdagi dori-darmonga chidamli o'choqli epilepsiyali bemorlarning birlashtirilgan SEEG-PSG yozuvlaridan foydalangan holda, epileptik faollikka bevosita ta'sirini baholash uchun uyqu barqarorligini eksperimental tarzda o'zgartirdilar. Uyqudan cho'chib uyg'onishlarni keltirib chiqarish va uyqu beqarorligining boshqariladigan vaqtinchalik buzilishlarini yaratish uchun eshitish stimulyatsiyasidan foydalanildi hamda bu voqealardan oldin va davomida IED soni va tarqalishi solishtirildi. Ushbu yondashuv inson miyasida IED paydo bo'lishiga uyg'onish bilan bog'liq uyqu beqarorligining bevosita ta'sirini to'g'ridan-to'g'ri sinab ko'rish imkonini berdi. Interiktal tarmoqqa e'tibor qaratish tarmoq qo'zg'aluvchanligidagi darhol o'zgarishlarni aniqlash uchun yuqori vaqtinchalik sezgirlikni ta'minladi, chunki IED tashqi voqealarga aniq vaqt bo'yicha bog'lanishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Stereo-elektroatsefalografiya (SEEG) — miyaning chuqur tuzilmalariga to'g'ridan-to'g'ri kiritilgan elektrodlar yordamida miyaning elektr faolligini qayd etuvchi invaziv usuldir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"uygonishlarning-epileptik-faollikka-tasiri\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#uygonishlarning-epileptik-faollikka-tasiri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Uyg'onishlarning epileptik faollikka ta'siri&lt;/span&gt;&lt;/a&gt;Uyg'onishlarning epileptik faollikka ta'siri&lt;/h4&gt;\n&lt;p&gt;Tadqiqotchilar uyg'onishlar epileptik tutqanoq uchlarini (spayklarni) kuchaytirishi va tarmoq qo'zg'aluvchanligining oshishini aks ettirgan holda ularning kengroq tarqalishiga yordam berishi haqida faraz qilishdi. Ushbu farazni tasdiqlagan holda, uyg'onish boshlanganidan keyin darhol to'qnashuvgacha bo'lgan davrlarga nisbatan tutqanoqlararo epileptiform razryadlar (IED) sonining sezilarli darajada oshishi kuzatildi, bu uyg'onishlarning epileptik dinamikaga to'g'ridan-to'g'ri ta'sir qilishidan dalolat beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Uyg'onishlar neokorteksda hamda N2 va N3 uyqu bosqichlarida IED sonining sezilarli darajada oshishiga olib keladi, eng kuchli ta'sir N2 bosqichida kuzatiladi, biroq razryadlarning fazoviy tarqalishi o'zgarmay qoladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mualliflar shuningdek, bu ta'sir miya sohasiga, tutqanoq boshlanish zonasining (SOZ) ishtirokiga va uyqu bosqichiga bog'liqligini tahlil qilishdi. Neokorteks va uyquni boshqarishda markaziy rol o'ynaydigan talamus o'rtasidagi kuchli funktsional bog'liqliklar tufayli mediotemporal sohalarga qaraganda neokorteksda spayklar ko'proq bo'lishi taxmin qilingan edi. Shuningdek, uyg'onishlar va epileptik faollik o'rtasidagi bog'liqlik eng kuchli bo'lgan N2 uyqu bosqichida katta effekt kutilgan edi. Olingan natijalar ushbu farazlarni to'liq tasdiqladi: neokorteksda, shuningdek N2 va N3 uyqu bosqichlarida IED sonining o'sishi qayd etildi, N2 da effekt ustunlik qildi, bu talamokortikal konturlar va uyqu bosqichlari dinamikasining muhim rolini ta'kidlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tutqanoqlararo epileptiform razryadlar (IED) — bu epileptik bemorlarda xurujlar oralig'ida kuzatiladigan miya faolligining elektroensefalogrammada qayd etiladigan naqshlari.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Qizig'i shundaki, uyg'onishlar bilan bog'liq IED sonining ko'payishi tutqanoq boshlanish zonasi (SOZ) va uning atrofdagi to'qimalar o'rtasida farq qilmadi, bu SOZ ning uyg'onish keltirib chiqaradigan qisqa muddatli qo'zg'alish o'zgarishlariga tanlab jalb qilinmasligidan dalolat beradi. IED chastotasiga ta'siridan farqli o'laroq, uyg'onishlar bunday razryadlarning fazoviy tarqalishiga ta'sir ko'rsatmadi. Olingan ma'lumotlarning yig'indisi shuni ko'rsatadiki, uyqudagi qisqa muddatli uyg'onishlar IED tarqalishi uchun zarur bo'lgan kengroq tarmoq mexanizmlarini ishga solmagan holda mahalliy kortikal qo'zg'aluvchanlikni tanlab kuchaytiradi, bu bog'liqlik esa miyaning anatomik sohasi va uyqu bosqichlariga bog'liq.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kuzatishlar statsionar monitoring sharoitida dori-darmonlarga chidamli epilepsiyasi bo'lgan bemorlarning qisqa muddatli mikro-uyg'onishlariga tegishli bo'lib, xulosalarni barcha turdagi epilepsiyalarga nisbatan qo'llashda ehtiyotkorlikni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Shunday qilib, ushbu ish uyquda chaqirilgan uyg'onishlar va epileptik faollikning lokal modulyatsiyasi o'rtasidagi bog'liqlik bo'yicha to'g'ridan-to'g'ri dalillarni taqdim etadi. Bu miya holatining qisqa muddatli tebranishlari epileptik dinamikaga qanday ta'sir qilishining mavjud modellarini aniqlashtirishga yordam beradi va uyqu barqarorligini inson miyasidagi patologik faollikni belgilovchi asosiy omil sifatida ta'kidlaydi.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"esitish-stimulyatsiyasi-tutqanoq-bilan-ogrigan-bemorlarda-uyquning-parchalanishi-va-uygonishlarni-keltirib-chiqaradi\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#esitish-stimulyatsiyasi-tutqanoq-bilan-ogrigan-bemorlarda-uyquning-parchalanishi-va-uygonishlarni-keltirib-chiqaradi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Esitish stimulyatsiyasi tutqanoq bilan og'rigan bemorlarda uyquning parchalanishi va uyg'onishlarni keltirib chiqaradi&lt;/span&gt;&lt;/a&gt;Esitish stimulyatsiyasi tutqanoq bilan og'rigan bemorlarda uyquning parchalanishi va uyg'onishlarni keltirib chiqaradi&lt;/h4&gt;\n&lt;p&gt;Uyqu paytida sun'iy ravishda qo'zg'atilgan uyg'onishlarning xurujlararo faollikka ta'sirini baholash uchun tadqiqotchilar avvalo o'zlari ishlab chiqqan tovush stimulyatsiyasi protokoli bemorlarda uyg'onish va uyqu parchalanishini ishonchli tarzda qo'zg'atishini tekshirdilar. Tadqiqotda dori vositalariga chidamli fokal tutqanoqi bor n = 17 nafar bemor ishtirok etdi, ularga tunda stereosefalografiya va poligrafiya (SEEG-PSG) tekshiruvi o'tkazildi. Tuning dastlabki to'rt soati mobaynida barqaror NREM uyqu fazasida turli balandlikdagi tovush signallari berildi. Ushbu usul bemorni to'liq uyg'otmagan holda mikro uyg'onishlar chastotasini oshirishga qaratilgan bo'lib, PSG ma'lumotlari asosida real vaqt rejimida nazorat qilindi (1-rasm).&lt;/p&gt;\n&lt;p&gt;Ishtirokchilarning umumiy uyqu vaqti (TST) o'rtacha 400.9 ± 89.9 min ni tashkil etdi (oraliq 214.5–542.0 min) (2a-rasm, klinik ma'lumotlar S1-jadvalda keltirilgan). Tovush ta'siri jami 440 ta sun'iy uyg'onishni keltirib chiqardi, bu har bir ishtirokchiga o'rtacha 25.9 ± 9.8 ta hodisaga to'g'ri keladi (oraliq 9–48) (2b-rasm). Berilgan tovush signallarining o'rtacha 31.6 ± 17.2% qismi (oraliq 10.7–86.2%) muvaffaqiyatli ravishda uyg'onishlarni keltirib chiqardi (2c-rasm). Bunda 90 dB balandlikdagi tovush eng ko'p qo'llanildi (2d-rasm), garchi tovush intensivligiga reaksiya bemorlarda turlicha bo'lsa ham (S1-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Polisonmografiya (PSG) va stereo-EEG (SEEG) — miyaning elektr faolligi va uyqu ko'rsatkichlarini qayd etishning murakkab usullari bo'lib, uyqu tuzilishi hamda uyg'onish lahzalarini aniq kuzatish imkonini beradi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Qo'zg'atilgan mikro uyg'onishlarning davomiyligi o'rtacha 7.8 ± 3.3 s ni tashkil etdi (oraliq 3–15 s) (S2a-rasm). Ular N2 bosqichida (14.7 ± 7.0, oraliq 1–32) N3 chuqur uyqu bosqichiga (5.2 ± 6.4, oraliq 0–29) qaraganda tez-tez kuzatildi (2e-rasm). Shuni ta'kidlash kerakki, umumiy uyg'onish chastotasi — ham tovush ta'sirida yuzaga kelgan, ham unga bog'liq bo'lmagan spontan hodisalar — stimulyatsiya bajarilgan tunning birinchi yarmida (27.0 ± 9.5 hodisa/soat [median va kvartil oralig'i], oraliq 11.5–74.3 hodisa/soat) ikkinchi yarmiga (18.0 ± 10.2 hodisa/soat, oraliq 5.8–52.4 hodisa/soat) nisbatan sezilarli darajada yuqori bo'ldi (Uilkoxon nishonli ranglar testi, p = 0.00118, Kliff d = 0.46, n = 17, 2f-rasm). Olingan natijalar tanlangan tovush stimulyatsiyasi usuli ushbu guruhda uyqu parchalanishini samarali kuchaytirishini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;17 nafar tutqanoqli bemorda uyqu paytida o'tkazilgan esitish stimulyatsiyasi har bir kishi uchun o'rtacha 25.9 ± 9.8 ta mikro uyg'onishni keltirib chiqardi (stimullarning 31.6%) va tunning birinchi yarmida uyqu parchalanishini sezilarli darajada oshirdi (27.0 ga nisbatan 18.0 hodisa/soat, p = 0.00118).&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"evoked-arousals-acutely-increase-interictal-epileptiform-discharge-counts-but-not-their-spatial-propagation\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#evoked-arousals-acutely-increase-interictal-epileptiform-discharge-counts-but-not-their-spatial-propagation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Evoked arousals acutely increase interictal epileptiform discharge counts but not their spatial propagation&lt;/span&gt;&lt;/a&gt;Evoked arousals acutely increase interictal epileptiform discharge counts but not their spatial propagation&lt;/h4&gt;\n&lt;p&gt;Tadqiqotda eshitish orqali qo'zg'atilgan qisqa muddatli uyqu uyg'onishlari epileptik faollikka qanday ta'sir qilishi baholandi. Interiktal epileptiform razryadlar (IED) tasdiqlangan detektor yordamida bipolar SEEG kanallarida qayd etildi. Tahlilda qatnashgan IED bo'yicha median SEEG kanallari soni 2 tani tashkil etdi (interkvartil oralig'i, IQR 5; diapazon 1–135) (S2b-rasm); bemorlar bo'yicha tun davomidagi umumiy IED chastotasi S2-jadvalda keltirilgan. IED lar to'rtta shart: ogohlantiruvchi stimuluslar uchun stimulusgacha va uyg'onish boshlanganidan keyingi oyna, hamda uyg'onish keltirib chiqarmagan tovushli stimuluslar uchun nazorat oynalari bo'yicha 3 soniyali davrlarda hisoblandi (1c-rasm). Uyqudan uyg'onish va nazorat shartlarini taqqoslash tovush ta'siridan qat'i nazar, uyg'onishning lokal razryadlarga ta'sirini alohida ajratib olish imkonini berdi. Stimulusgacha bo'lgan davrlar bazis darajani aks ettirishini tasdiqlash uchun ular tun davomidagi tasodifiy tanlangan uyg'onishsiz davrlar bilan umumlashtirilgan chiziqli aralash modellar (GLMM) yordamida taqqoslandi. Farqlar aniqlanmadi (GLMM, β-baholash ± standart xato (SE): -0.052 ± 0.027, P = 0.053, S3-rasm).&lt;/p&gt;\n&lt;p&gt;Shartlar o'rtasidagi interiktal faollik o'zgarishini aniqlash uchun GLMM qo'llanildi (n = 17 bemor, 3-rasm). Asosiy shart (uyg'onish va nazorat) asosiy ta'sir sifatida baholanib, boshlang'ich IED va stimulus intensivligiga tuzatish kiritildi. Tahlil shartning sezilarli ta'sirini ko'rsatdi: uyg'onish vaqtida bashorat qilingan IED soni nazoratdagiga nisbatan sezilarli darajada yuqori bo'ldi (GLMM, β-baholash ± SE: 0.537 ± 0.012, hodisalar nisbati (IRR) = 1.71, p &amp;lt; 0.0001), bu nazoratga nisbatan IED sonining 71% ga oshishiga mos keladi (3d-rasm). Epilepsiya turi va MRT holati bo'yicha o'tkazilgan qo'shimcha tahlillar barcha guruhlarda o'xshash tendentsiyani ko'rsatdi (S4-rasm). Stimulus intensivligini hisobga olgan holda uyg'onishdan oldingi davrlardagi IED soni taqqoslanganda sezilarli farq topilmadi (GLMM, β-baholash ± SE: 0.019 ± 0.014, IRR = 1.02, P = 0.182, S5-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Qo'zg'atilgan uyg'onishlar interiktal epileptiform razryadlar sonini 71% ga (IRR = 1.71, p &amp;lt; 0.0001) va yuqori chastotali tebranishlarni 70% ga oshiradi, biroq ularning fazoviy tarqalishiga ta'sir ko'rsatmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SEEG (stereoensefalografiya) — miyaning chuqur tuzilmalariga elektrodlar kiritish orqali uning elektr faolligini qayd etuvchi invaziv usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Spontan uyg'onishlar ham IED sonining mo'tadil, ammo sezilarli darajada oshishi bilan birga keldi (GLMM, β-baholash ± SE: 0.046 ± 0.010 SE, IRR = 1.05, p &amp;lt; 0.0001, S6a-rasm). Yuqori chastotali tebranishlar (HFO) ham o'rganilib, ularning bashorat qilingan soni uyg'onish davrida sezilarli darajada yuqori ekanligi aniqlandi (GLMM, β-baholash ± SE: 0.530 ± 0.014, IRR = 1.70, p &amp;lt; 0.0001, S7-rasm), bu IED naqshini takrorlagan holda 70% o'sishni ko'rsatdi. Bu natijalar uyg'onishlar epileptik faollikni keskin kuchaytirishini isbotlaydi.&lt;/p&gt;\n&lt;p&gt;Shundan so'ng tadqiqotchilar qo'zg'atilgan uyg'onishlar IED sonigagina emas, balki ularning fazoviy tarqalishiga ham ta'sir qilishini o'rganishdi (n = 17). Tarqalish kanali deganda asosiy IED dan 120 ms ichida qayd etilgan har qanday SEEG kanali tushunildi. Tarqalish kanallari soni GLMM yordamida modellashtirildi. IED soniga ta'siridan farqli o'laroq, tarqalish kanallari soni uyg'onishlar va nazorat o'rtasida sezilarli farq qilmadi (GLMM, β-baholash ± SE: 0.212 ± 0.408 SE, IRR = 1.24, P = 0.604, 3e-rasm). Spontan uyg'onishlarda ham tarqalish kanallari soni bo'yicha sezilarli farq kuzatilmadi (GLMM, β-baholash ± SE: 0.109 ± 0.317 SE, IRR = 1.12, P = 0.733, S6b-rasm). Demak, uyg'onishlar lokal qo'zg'aluvchanlikni oshirib interiktal faollikni kuchaytirsa-da, keng tarmoqlarni qamrab olib IED ning keng tarqalishini ta'minlay olmaydi.&lt;/p&gt;\n&lt;h4 id=\"global-interictal-spiking-is-elevated-during-stimulation-induced-sleep-fragmentation\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#global-interictal-spiking-is-elevated-during-stimulation-induced-sleep-fragmentation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Global interictal spiking is elevated during stimulation-induced sleep fragmentation&lt;/span&gt;&lt;/a&gt;Global interictal spiking is elevated during stimulation-induced sleep fragmentation&lt;/h4&gt;\n&lt;p&gt;Shundan so'ng tadqiqotchilar uyg'onishlarning o'tkir ta'siri epileptik diskarakteristikalarga (IED) qanday uzoq muddatli ta'sir qilishini baholadilar. Buning uchun ular NREM uyqu davrida bemor darajasidagi global IED chastotasini solishtirdilar: birinchi yarmida tovush stimulyatsiyasi uyquni parchalash uchun qo'llanilgan bo'lsa, ikkinchi yarmida tiklanuvchi uyquga imkon berish uchun stimulyatsiya to'xtatilgan edi. Normallashtirilgan IED chastotasi stimulyatsiya tufayli yuzaga kelgan uyqu parchalanishi paytida sezilarli darajada yuqori bo'ldi (0.80 ± 0.56 hodisa/min, mediana va interkvartil diapazon, diapazon 0.32–1.50 hodisa/min), stimulyatsiyasiz davrlarga nisbatan (0.72 ± 0.48 hodisa/min, diapazon 0.25–1.44 hodisa/min) (Wilcoxon ning nishonli rank testi, p = 0.017, Cliff ning d = 0.15, n = 17, 8a-Rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tovush stimulyatsiyasi bilan qo'zg'atilgan uyqu parchalanishi tun davomida interiktal razryadlar chastotasining umumiy oshishiga olib keladi (0.80 ga qarshi 0.72 hodisa/min, p = 0.017).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bu qonuniyat tun bo'yi tasodifiy tanlab olingan uyg'onishlarsiz 3 soniyali bazaviy davrlar yordamida ham tasdiqlandi: stimulyatsiya paytida normallashtirilgan IED soni stimulyatsiyasiz davrlarga qaraganda sezilarli darajada yuqori bo'ldi (GLMM, β-baholash ± SE: -0.112 ± 0.003, chastota nisbati = 0.89, p &amp;lt; 0.0001, 8b-Rasm). Bu tovush stimulyatsiyasi to'xtatilganda IED sonining 10.6% ga kamayishiga mos keladi. Ushbu natijalar shuni ko'rsatadiki, tovush stimulyatsiyasi protokoli tufayli yuzaga kelgan uyqu makrotuzilmasining buzilishi bevosita uyg'onish oynasidan tashqarida ham uzoqroq vaqt oralig'ida global IED faolligining kuchayishi bilan bog'liq.&lt;/p&gt;\n&lt;h4 id=\"arousal-driven-interictal-spiking-is-dependent-on-anatomical-region\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#arousal-driven-interictal-spiking-is-dependent-on-anatomical-region\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Arousal-driven interictal spiking is dependent on anatomical region&lt;/span&gt;&lt;/a&gt;Arousal-driven interictal spiking is dependent on anatomical region&lt;/h4&gt;\n&lt;p&gt;Keyinchalik olimlar uyg'onishlar ta'sirida IED ning oshishi ma'lum bir anatomik sohaga bog'liqligini o'rganishdi. Buning uchun ular meziotemporal SEEG kontaktlarida (jumladan, gippokamp, paragippokamp gilvasi, entorinal korteks va amigdala) hosil bo'ladigan IED ni neokorteksdagi razryadlar bilan taqqosladilar (4a, b-Rasm). Bu taqqoslash uyquni boshqarishda muhim tuzilma bo'lgan talamus bilan turli mexanizmlar orqali bog'langan meziotemporal va neokortikal hududlar o'rtasida IED o'sishi turlicha ekanligini tekshirish imkonini berdi.&lt;/p&gt;\n&lt;p&gt;Tahlil uchun tadqiqotchilar GLMM yordamida har bir kanal-epoxa uchun IED sonini modellashtirdilar. Shart (chaqirilgan uyg'onish va nazorat), anatomik soha (meziotemporal va neokortikal) hamda ularning o'zaro ta'siri sobit ta'sirlar sifatida qaraldi, stimulyatsiyagacha bo'lgan boshlang'ich IED soni va stimul intensivligi hisobga olindi. Tahlil holat va anatomik soha o'rtasida sezilarli o'zaro ta'sirni ko'rsatdi (GLMM, β-baholash ± SE: 0.737 ± 0.041, IRR = 2.09, p &amp;lt; 0.0001, 4c-Rasm), bu uyg'onish ta'siri hududlar bo'yicha farq qilishini bildiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Chaqirilgan uyg'onishlar neokortekstda IED ning keskin oshishiga olib keladi (+92%, p &amp;lt; 0.0001), holbuki meziotemporal zonalarda sezilarli o'zgarishlar kuzatilmaydi (p = 0.054).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;≥ 3 meziotemporali kanallari bo'lgan bemorlarda (n = 14) post-hoc taqqoslashlar meziotemporal hududlarda bashorat qilingan IED soni chaqirilgan uyg'onishlar va nazorat o'rtasida sezilarli farq qilmasligini ko'rsatdi (β-baholash = -0.087 ± 0.039, IRR = 0.92, P = 0.054, 4c-Rasm). Aksincha, neokortikal IED lar (n = 17 bemor) nazoratga nisbatan chaqirilgan uyg'onishlar paytida bashorat qilingan IED sonining 92% ga sezilarli oshishini ko'rsatdi (β-baholash = 0.650 ± 0.013, IRR = 1.92, p &amp;lt; 0.0001, 4c-Rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HFO (yuqori chastotali osilatsiyalar) — epilepsiya o'choqlarini aniqlashda muhim ahamiyatga ega bo'lgan miyaning yuqori chastotali elektr tebranishlari.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu hududiy tanlanganlik faqat chaqirilgan uyg'onishlar bilan cheklanib qolmasligini baholash uchun mualliflar spontan uyg'onishlarga ham shunday GLMM tuzilmasini qo'lladilar va sezilarli o'zaro ta'sirni aniqladilar (GLMM, β-baholash = 0.455 ± 0.030, IRR = 1.58, p &amp;lt; 0.0001, 9-Rasm). Biroq, chaqirilgan uyg'onishlardan farqli o'laroq, spontan uyg'onishlar nazoratga nisbatan meziotemporal hududlarda bashorat qilingan IED sonining 27% ga sezilarli kamayishiga (β-baholash = -0.320 ± 0.028, IRR = 0.73, p &amp;lt; 0.0001) va neokorteksda 14% ga kichikroq, ammo sezilarli o'sishga olib keldi (β-baholash = 0.135 ± 0.011, IRR = 1.14, p &amp;lt; 0.0001).&lt;/p&gt;\n&lt;p&gt;Xuddi shunday, yuqori chastotali osilatsiyalar (HFO) uchun ham chaqirilgan uyg'onishlarda sezilarli o'zaro ta'sir topildi (GLMM, β-baholash = 0.664 ± 0.050, IRR = 1.94, p &amp;lt; 0.0001, 10-Rasm), meziotemporal HFO sonida sezilarli farq yo'q edi (β-baholash = -0.054 ± 0.048, IRR = 0.95, P = 0.511), ammo neokortikal HFO sonida 84% ga sezilarli o'sish kuzatildi (β-baholash = 0.610 ± 0.015, IRR = 1.84, p &amp;lt; 0.0001). Xulosa qilib aytganda, uyg'onish bilan bog'liq interiktal faollikning oshishi chaqirilgan uyg'onishlardan keyin asosan neokorteksta namoyon bo'ladi, meziotemporal hududlar esa o'zgarishsiz qoladi.&lt;/p&gt;\n&lt;h4 id=\"uygonish-bilan-bogliq-interiktal-tolqinlar-tutqanoq-boshlanish-zonasi-tomonidan-boshqarilmaydi\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#uygonish-bilan-bogliq-interiktal-tolqinlar-tutqanoq-boshlanish-zonasi-tomonidan-boshqarilmaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Uygʻonish bilan bogʻliq interiktal toʻlqinlar tutqanoq boshlanish zonasi tomonidan boshqarilmaydi&lt;/span&gt;&lt;/a&gt;Uygʻonish bilan bogʻliq interiktal toʻlqinlar tutqanoq boshlanish zonasi tomonidan boshqarilmaydi&lt;/h4&gt;\n&lt;p&gt;Shundan so'ng tadqiqotchilar uyg'onish keltirib chiqaradigan interiktal epileptiform faollik (IED) kuchayishi stereoelektroensefalografiya (SEEG) kontaktlari orasida tutqanoq boshlanish zonasi (SOZ) ichida va tashqarisida farq qilishini tekshirdilar (5a, b-rasm). SOZning o'zi tutqanoq boshidagi eng dastlabki elektrografik o'zgarishlar asosida klinik jihatdan aniqlangan. Ushbu taqqoslash SOZ funksional elektrografik tuzilma sifatida atrofdagi hududlarga qaraganda uyg'onishlarga boshqacha javob berishini yoki bu o'zgarishlarga nisbatan turg'un bo'lib qolishini aniqlash imkonini berdi. Kamida n = 3 ta SEEG kanallarida aniq klinik SOZga ega bo'lgan bemorlar uchun (n = 12) kanal-epoxa uchun IED soni GLMM yordamida modellashtirildi. Bunda shart (qo'zg'atilgan uyg'onish va nazorat), SOZ holati (SOZ tashqarisida va ichida) hamda ularning o'zaro ta'siri qat'iy ta'sir sifatida olindi, stimulyatsiyagacha bo'lgan boshlang'ich IED soni va stimul intensivligi hisobga olindi, shuningdek bemor ichiga joylashtirilgan SEEG kontaktlari uchun tasodifiy kesishishlar kiritildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;GLMM (umumlashtirilgan chiziqli aralash model) va IRR (chastotalar nisbati) — bemorlarning individual xususiyatlarini inobatga oluvchi murakkab tibbiy ma'lumotlarni tahlil qilish usullari.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tahlil shart va SOZ holati o'rtasida sezilarli o'zaro ta'sir yo'qligini ko'rsatdi (GLMM, β bahosi ± SE: 0.005 ± 0.026, IRR = 1.00, P = 1.00, 5-rasm). Bu shuni anglatadiki, qo'zg'atilgan uyg'onishlarning IED soniga ta'siri SOZ va SOZ bo'lmagan hududlar orasida sezilarli farq qilmadi. O'zaro ta'sir yo'qligi sababli, keyingi qiyosiy tahlillar alohida o'tkazilmadi.&lt;/p&gt;\n&lt;p&gt;Spontan uyg'onishlar ham shart va SOZ holati o'rtasida sezilarli o'zaro ta'sirni ko'rsatmadi (GLMM, β bahosi = -0.025 ± 0.021, IRR = 0.98, P = 0.940, SN 11-rasm). Shuningdek, yuqori chastotali tebranishlar (HFO) uchun ham shunday qonuniyat kuzatildi: qo'zg'atilgan uyg'onishlarda shart va SOZ holati o'rtasida sezilarli o'zaro ta'sir aniqlanmadi (GLMM, β bahosi = -0.056 ± 0.030, IRR = 0.95, P = 0.239, SN 12-rasm). Ushbu natijalar shuni ko'rsatadiki, uyg'onish bilan bog'liq interiktal faollikning, jumladan IED va HFO ortishi SOZ ichida ham, tashqarisida ham bir xilda sodir bo'ladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Tutqanoq boshlanish zonasi (SOZ) uyg'onish paytida epileptik chaqnashlarning (IED va HFO) oshishini boshqarmaydi — bu o'sish miya bo'ylab bir xilda kuzatiladi (P = 1.00).&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"uygonish-tufayli-yuzaga-keladigan-interiktal-faollik-uyqu-bosqichiga-bogliq\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#uygonish-tufayli-yuzaga-keladigan-interiktal-faollik-uyqu-bosqichiga-bogliq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Uyg'onish tufayli yuzaga keladigan interiktal faollik uyqu bosqichiga bog'liq&lt;/span&gt;&lt;/a&gt;Uyg'onish tufayli yuzaga keladigan interiktal faollik uyqu bosqichiga bog'liq&lt;/h4&gt;\n&lt;p&gt;Keyinchalik olimlar uyg'onishlarning IEDga ta'siri ular sodir bo'ladigan uyqu bosqichiga bog'liqligini o'rganishdi. Ular neyronlar sinxronligi va kortikal qo'zg'aluvchanlikning turlicha darajalarini aks ettiruvchi 2-bosqich (N2) va 3-bosqich (N3) sekin to'lqinli uyqu paytidagi uyg'onishlarni taqqoslashdi (6a-rasm). N2 uyqu hushtaklari va K-komplekslari bilan tavsiflangan engilroq bosqich bo'lsa, N3 yuqori amplitudali, past chastotali (0.5-2 Gts) delta faolligi va pasaygan kortikal javob bilan ajralib turadi. Xuddi shunday GLMM modeli yordamida shart, uyqu bosqichi va ularning o'zaro ta'siri baholanib, qo'zg'atilgan uyg'onishlar va uyqu bosqichi o'rtasida sezilarli o'zaro ta'sir borligi aniqlandi (GLMM, β bahosi ± SE: -0.271 ± 0.031, IRR = 0.76, p &amp;lt; 0.0001, 6b-rasm).&lt;/p&gt;\n&lt;p&gt;Aniqrog'i, qo'zg'atilgan uyg'onish bilan bog'liq IED sonining o'sishi N3 bosqichida N2 bosqichidagiga qaraganda taxminan 24% kichikroq bo'ldi. Keyingi taqqoslashlar shuni ko'rsatdiki, prognoz qilingan IED soni nazoratga nisbatan ham N2 da (n = 16 bemor; β = 0.718 ± 0.017, IRR = 2.05, p &amp;lt; 0.0001, 6b-rasm), ham N3 da (n = 13 bemor; β = 0.447 ± 0.026, IRR = 1.56, p &amp;lt; 0.0001, 6b-rasm) qo'zg'atilgan uyg'onishlar paytida sezilarli darajada yuqori bo'lgan, garchi bu o'sish N2 da kattaroq edi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Sun'iy qo'zg'atilgan va tabiiy spontan uyg'onishlar uyqu bosqichlariga nisbatan qarama-qarshi ta'sir ko'rsatishini yodda tutish lozim.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Spontan uyg'onishlar uchun ham shart va uyqu bosqichi o'rtasida sezilarli o'zaro ta'sir topildi (GLMM, β bahosi = 0.089 ± 0.029, IRR = 1.09, P = 0.0075, SN 13-rasm). N2 da ham (β = 0.143 ± 0.015, IRR = 1.15, p &amp;lt; 0.0001), N3 da ham (β = 0.232 ± 0.025, IRR = 1.26, p &amp;lt; 0.0001) prognoz qilingan IED soni nazoratga nisbatan yuqori edi. E'tiborlisi, spontan uyg'onishlarda IED sonining o'sishi N3 da N2 dagiga qaraganda 10% katta bo'ldi, bu qo'zg'atilgan uyg'onishlarga teskari edi.&lt;/p&gt;\n&lt;p&gt;HFO uchun ham qo'zg'atilgan uyg'onishlardagi IED natijalariga o'xshash holat kuzatildi: shart va uyqu bosqichi o'rtasida sezilarli o'zaro ta'sir mavjud (GLMM, β bahosi = -0.275 ± 0.036, IRR = 0.76, p &amp;lt; 0.0001, SN 14-rasm). Bashorat qilingan HFO soni N2 (n = 16, β = 0.758 ± 0.020, IRR = 2.13, p &amp;lt; 0.0001) va N3 da (n = 13, β = 0.483 ± 0.030, IRR = 1.62, p &amp;lt; 0.0001) nazoratga nisbatan yuqori bo'lib, N3 da o'sish N2 dagiga qaraganda 24% kichikroq bo'ldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Uyqudan uyg'onish epileptik faollikni N2 va N3 bosqichlarida kuchaytiradi, ammo qo'zg'atilgan uyg'onishlarda bu o'sish N3 da 24% kichik bo'lsa, spontan uyg'onishlarda aksincha, N3 da 10% katta bo'ladi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu natijalar shuni ko'rsatadiki, uyg'onishlar N2 va N3 uyqu bosqichlarida epileptik faollikni oshiradi, lekin bu ta'sirning nisbiy kattaligi uyqu bosqichiga bog'liq. Qo'zg'atilgan uyg'onishlar paytida bu ta'sir N3 ga qaraganda N2 da sezilarli darajada katta bo'ldi, bu N2 ning yuqori kortikal qo'zg'aluvchanlik holatini aks ettiradi. Qizig'i shundaki, spontan uyg'onishlar uchun bu qonuniyat teskari bo'lib chiqdi.&lt;/p&gt;\n&lt;h4 id=\"stimulga-javob-turi-va-stimuldan-oldingi-delta-faollikning-interiktal-spikelarga-tasiri\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#stimulga-javob-turi-va-stimuldan-oldingi-delta-faollikning-interiktal-spikelarga-tasiri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Stimulga javob turi va stimuldan oldingi delta-faollikning interiktal spike'larga ta'siri&lt;/span&gt;&lt;/a&gt;Stimulga javob turi va stimuldan oldingi delta-faollikning interiktal spike'larga ta'siri&lt;/h4&gt;\n&lt;p&gt;Mualliflar uyg‘onish davridagi IED (interiktal epileptiform razryadlar) sonining ortishi bevosita uyg‘onishning o‘ziga yoki unga hamroh bo‘luvchi sekin to‘lqinli javobga bog‘liqligini, shuningdek, stimuldan oldingi delta-faollik elektrofiologik javobga qanday ta'sir qilishini tekshirdilar. Tadqiqot IED o'sishi faqat an'anaviy tez uyg'onishlarga xosmi yoki sekin tebranishlarning umumiy beqarorligini aks ettiradimi, degan savolga javob berdi. Buning uchun umumlashtirilgan chiziqli aralash modellar (GLMM) qo'llanildi. Tahlilga 17 nafar bemor kiritildi, chunki aniqlanib bo'lmaydigan EEG javobiga ega stimul faqat 4 nafar bemorda kuzatilgan va ular chiqarib yuborilgan. Stimuldan oldingi spektral quvvat nisbati (δ / [θ + α + β], diapazonlar 0.5--4 Hz va 4.5--30 Hz) asosiy qiziqish effekti sifatida baholandi, bunda stimul intensivligi va boshlang'ich IED soni inobatga olindi, bemor ichidagi SEEG kontaktlari uchun tasodifiy kesishmalar kiritildi. Ushbu quvvat ko'rsatkichining taqsimoti ikkala javob turi uchun ham o'xshash bo'lib (7a-rasm), bu statistik jihatdan tasdiqlandi: stimuldan oldingi spektral quvvat nisbati uyg'onish ehtimoliga ta'sir ko'rsatmadi (GLMM, baho ± SE: 0.032 ± 0.014, P = 0.052, 7b-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GLMM (umumlashtirilgan chiziqli aralash model) — bemorlar va kontaktlarning individual xususiyatlarini hamda umumiy qonuniyatlarni bir vaqtning o'zida hisobga oluvchi statistik tahlil usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Keyinchalik GLMM yordamida stimulga javob turining IED soniga ta'siri va stimuldan oldingi delta-faollik bu munosabatni modulyatsiya qilishi baholandi. Modelga javob turi (alohida sekin to'lqin va sekin to'lqinli uyg'onish), delta-quvvat ko'rsatkichi va ularning o'zaro ta'siri kiritildi. Sekin to'lqinli uyg'onishlar alohida sekin to'lqinlarga qaraganda sezilarli darajada ko'p IED sonini ko'rsatdi (GLMM, baho ± SE: 0.542 ± 0.012, IRR = 1.72, p &amp;lt; 0.0001, 7c-rasm), bu IED sonining 72% ga oshishiga mos keladi. Javob turi va delta-quvvat nisbati o'rtasidagi o'zaro ta'sir ham ahamiyatli chiqdi (GLMM, baho ± SE: -0.073 ± 0.013, IRR = 0.93, p &amp;lt; 0.0001, 7d-rasm), ya'ni delta-faollik va IED soni orasidagi bog'liqlik javob turiga bog'liq bo'lgan. Qiyosiy tahlil shuni ko'rsatdiki, alohida sekin to'lqindan keyin yuqori delta-quvvat ko'rsatkichi ko'proq IED soni bilan bog'liq bo'lgan (baho = 0.066 ± 0.009, IRR = 1.07, p &amp;lt; 0.0001, 7d-rasm), bu delta-ko'rsatkichning har bir birlik o'sishiga IED ning 7% ga oshishini bildiradi. Aksincha, uyg'onishdan keyin delta-faollik va IED soni o'rtasida sezilarli bog'liqlik topilmadi (baho = -0.007 ± 0.012, IRR = 0.99, P = 1, 7d-rasm). Demak, delta-faollik shartga bog'liq modulyator sifatida ishlaydi: u alohida sekin to'lqinlardan keyin IED ni kuchaytiradi, lekin uyg'onish yuzaga kelganda qo'shimcha ta'sir ko'rsatmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Uyg'onishlar alohida sekin to'lqinlarga nisbatan IED sonining 72% ga oshishiga olib keladi (IRR = 1.72, p &amp;lt; 0.0001), boshlang'ich delta-faollik esa faqat uyg'onish bo'lmagan holatda spikelarni kuchaytiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Delta-faollik natijalarni buzuvchi asosiy omil (konfounder) emasligini tekshirish uchun sezuvchanlik tahlili o'tkazildi. Delta-quvvat ko'rsatkichi qo'shilgan model (GLMM, baho ± SE: 0.537 ± 0.012, IRR = 1.71, p &amp;lt; 0.0001) tuzatilmagan modelga (GLMM, baho ± SE: 0.538 ± 0.012, IRR = 1.71, p &amp;lt; 0.0001) nisbatan javob turining ta'sirini o'zgartirmadi. Qolaversa, delta-quvvat nisbati tuzatilgan modelda IED sonining mustaqil bashoratchisi bo'lmadi (baho = 0.009 ± 0.005, IRR = 1.01, P = 0.081). Bu shuni ko'rsatadiki, stimuldan oldingi delta-faollik asosiy chalg'ituvchi omil emas va stimuldan keyingi epileptiform faollikning asosiy harakatlantiruvchi kuchi miyaning fon holati emas, balki javob turining o'zidir.&lt;/p&gt;\n&lt;h4 id=\"stimul-intensivligining-xurujlararo-razryadlar-chastotasiga-tasiri\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#stimul-intensivligining-xurujlararo-razryadlar-chastotasiga-tasiri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Stimul intensivligining xurujlararo razryadlar chastotasiga ta'siri&lt;/span&gt;&lt;/a&gt;Stimul intensivligining xurujlararo razryadlar chastotasiga ta'siri&lt;/h4&gt;\n&lt;p&gt;Stimul intensivligining o'zi xurujlararo razryadlar (IED) sonini belgilab berish ehtimolini istisno qilish uchun, mualliflar tovush stimullari seziladigan uyg'onish reaksiyasini keltirib chiqarmagan nazorat davrlarini tahlil qilishdi. Bunday nazorat davrlarida stimul intensivligi IED sonining kichik, ammo statistik ahamiyatli o'sishi bilan bog'liq bo'ldi (umumlashtirilgan chiziqli aralash model yoki GLMM, β-koeffitsiyent ± SE: 0.0056 ± 0.0005, chastotalar nisbati IRR = 1.006, p &amp;lt; 0.0001, Rasm 15a): stimul intensivligining har 1 dB oshishiga IED soni 0.6% ga ko'payishi to'g'ri keldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Nazoratdagi har 1 dB uchun 0.6% lik kichik o'sish uyg'onish paytidagi katta o'zgarishlarni tushuntira olmaydi, chunki ularning o'zaro ta'siri statistik jihatdan ahamiyatsiz.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Shunga qaramay, hodisa turi (chaqirilgan uyg'onish va nazorat) hamda stimul intensivligi o'rtasidagi o'zaro ta'sir ahamiyatsiz bo'lib chiqdi (GLMM, β-koeffitsiyent ± SE: -0.0004 ± 0.0006, IRR = 1.00, P = 0.514, Rasm 15b). Bu chaqirilgan uyg'onishlar paytida kuzatiladigan yirik IED o'sishi ovoz balandligidan qat'i nazar yuzaga keladigan alohida holat o'zgarishini bildirishini isbotlaydi. Qolaversa, talamusiga SEEG elektrodlari o'rnatilgan patsiyentlarda (n = 4 nafar) nazorat davrlarida stimul intensivligi talamus spektral quvvati nisbatining o'zgarishi bilan bog'liq emas edi (GLMM, β-koeffitsiyent ± SE: -0.008 ± 0.009, P = 0.382, Rasm 15c).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GLMM (umumlashtirilgan chiziqli aralash model) — guruh tendensiyalari bilan birga har bir bemorning shaxsiy xususiyatlarini ham hisobga oladigan murakkab statistik tahlil usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Umuman olganda, ushbu natijalar shuni ko'rsatadiki, nazorat davrlarida kichik, intensivlikka bog'liq IED o'sishi kuzatilsa-da (polisonogrammada ko'rinmaydigan quyi chegaradagi uyg'onishlar tufayli), bu effekt haqiqiy uyg'onishlar paytida qayd etilgan kuchli epileptiform faollik o'sishini keltirib chiqarmaydi yoki unga sabab bo'lmaydi.&lt;/p&gt;\n&lt;h4 id=\"uygonish-jarayonida-interiktal-faollikning-vaqtinchalik-dinamikasi\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#uygonish-jarayonida-interiktal-faollikning-vaqtinchalik-dinamikasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Uyg‘onish jarayonida interiktal faollikning vaqtinchalik dinamikasi&lt;/span&gt;&lt;/a&gt;Uyg‘onish jarayonida interiktal faollikning vaqtinchalik dinamikasi&lt;/h4&gt;\n&lt;p&gt;Qisqa muddatli uyg‘onishlar vaqtida interiktal epileptiform razryadlar (IED) qanday ko‘payishini aniqlagandan so‘ng, olimlar ushbu hodisaning vaqtinchalik dinamikasini o‘rganishdi. Tadqiqotchilarni IED soni va vaqti uyg‘onish davomiyligiga bog‘liqligi hamda bu o‘sishlar uyg‘onish boshlanishiga qat’iy bog‘langanmi yoki butun uyg‘onish davri bo‘ylab taqsimlanganmi degan savollar qiziqtirdi. Buning uchun 17 nafar bemorda IED ning uyg‘onish va ogohlantiruvchi stimulus boshlanishiga nisbatan vaqtinchalik taqsimoti tahlil qilindi; ko‘rsatkichlar har bir bemorning maksimal qiymatiga normallashtirilib, 500 millisekundlik oraliqlarga (binlarga) bo‘lib chiqildi (Rasm 8a-c). Uyg‘onish boshlangach, boshlang‘ich darajaga nisbatan IED chastotasi darhol keskin oshdi va uyg‘onishdan keyingi 4.5 soniya davomida yuqori darajada saqlanib qoldi (bir tomonlama Mann-Uitni testlari, p &amp;lt; 0.05, Rasm 8a), uyg‘onish boshlanganidan 0.5–1 soniya o‘tgach cho‘qqiga chiqdi. Bemorlar bo‘yicha normallashtirilgan IED taqsimoti razryadlar uyg‘onishning boshlang‘ich davrida to‘planishga moyilligini ko‘rsatdi, bu esa kortikal qozg‘aluvchanlik uyg‘onish boshlanishi bilanoq keskin oshib, keyinchalik barqarorlashishidan dalolat beradi (Rasm 16). Tovush stimuluslariga nisbatan hisoblanganda ham, uyg‘onish paytida IED soni sezilarli darajada oshib, stimulusdan keyin taxminan 2–2.5 soniyada eng yuqori cho‘qqiga yetdi (bir tomonlama Mann-Uitni testlari, p &amp;lt; 0.05, Rasm 8b). Vaqt o‘tishi bilan faol uyg‘onishlar ulushi bu naqshni aynan takrorladi va uyg‘onish hamda IED o‘sishi o‘rtasida qattiq vaqtinchalik bog‘liqlik borligini ko‘rsatdi. Aksincha, uyg‘onish keltirib chiqarmaydigan nazorat tovush stimuluslari paytida IED faolligida hech qanday sezilarli o‘zgarish kuzatilmadi (bir tomonlama Mann-Uitni testlari, p &amp;gt; 0.05, Rasm 8c), bu esa kuzatilgan o‘sish oddiy tovushga emas, ayniqsa uyg‘onish bilan bog‘liq kortikal faollashuvga xos ekanligini tasdiqladi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-f8.jpg\" alt=\"8-rasm. Qo'zg'atilgan uyg'onishlar paytida interiktal epileptiform razryadlarning (IER) vaqtinchalik dinamikasi. (a-c) H\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-rasm. Qo'zg'atilgan uyg'onishlar paytida interiktal epileptiform razryadlarning (IER) vaqtinchalik dinamikasi. (a-c) Har bir bemorning maksimal qiymatiga normallashtirilgan (bin kengligi: 500 ms) va barcha bemorlar bo'yicha o'rtacha hisoblangan, guruh ma'lumotlari o'rtacha ± standart xato sifatida taqdim etilgan, aruzol va eshitish stimuli boshlanishiga nisbatan IER ning vaqtinchalik taqsimlanishini ko'rsatuvchi guruh darajasidagi gistogrammalar. Boshlanishidan oldingi bazaviy davrdagi IER soni bir tomonlama Mann-Uitni testlari yordamida har bir boshlanishdan keyingi bin bilan taqqoslandi (n = 17 bemor, sezilarli binlar (p &amp;lt; 0.05) yulduzchalar bilan ko'rsatilgan). (a) Qo'zg'atilgan uyg'onishlar boshlanganidan keyin IER soni sezilarli darajada oshdi (qizil strelkali chiziq), uyg'onish boshlanganidan keyin 0.5-1 s da cho'qqiga chiqdi. (b) Eshitish stimullarining boshlanishiga moslashtirilganda, qo'zg'atilgan uyg'onishlar paytida IER soni yana sezilarli darajada oshdi, stimul boshlanganidan keyin 2-2.5 s da cho'qqiga chiqdi. Ustiga qo'yilgan qora egri chiziq (o'ng o'q) vaqt o'tishi bilan faol uyg'onishlar foizini ko'rsatadi. (c) Nazorat (uyg'otmaydigan) eshitish stimullari paytida stimul boshlanganidan keyin IER sonining sezilarli modulyatsiyasi kuzatilmadi, bu (b) da kuzatilgan IER ning oshishi qo'zg'atilgan uyg'onishlarga xos ekanligini ko'rsatadi. (d) Har bir bemordagi SEEG kontaktlari soni bo'yicha normallashtirilgan IER soni uyg'onish davomiyligi bilan sezilarli darajada oshdi (umumlashtirilgan chiziqli aralash effektlar modeli (GLMM), β-baholash ± standart xato (SE): sekundiga 0.078 ± 0.006, p &amp;lt; 0.0001), bu uzoqroq uyg'onishlar ko'proq IER soni bilan bog'liqligini tasdiqlaydi. (e) Aksincha, IER chastotasi uyg'onish davomiyligi bilan sezilarli darajada kamaydi (GLMM, β-baholash ± SE: –0.051 ± 0.006 sekundiga, p &amp;lt; 0.0001), bu uzoqroq uyg'onishlar ko'proq IER larni o'z ichiga olsa-da, ular uyg'onish jarayonida asta-sekin sekinlashuvchi chastotada sodir bo'lishini ko'rsatadi. (f) Talamik spektral faollik uyg'onish bilan bog'liq IER soni bilan bog'liq. Talamik SEEG elektrodlari bo'lgan to'rtta bemorda kichik guruh tahlili (N2 uyqu paytida n = 56 uyg'onish) yuqoriroq talamik spektral quvvat nisbati (δ/(θ+α+β) ((0.5–4 Gts)/(4.5–30 Gts))) pastroq normallashtirilgan IER soni bilan bog'liqligini ko'rsatdi (GLMM, β-baholash ± SE: spektral quvvat nisbatining har 1.0 ga oshishiga –0.081 ± 0.035, P = 0.022), bu uyg'onish paytida tezroq talamik ritmlarga o'tish kuchaygan interiktal spayklarga bog'liqligini ko'rsatadi. (d-f) panellaridagi har bir nuqta bemorlar bo'yicha birlashtirilgan bitta uyg'onish hodisasini bildiradi va soyali hududlar model moslamasi atrofidagi 95% ishonch oralig'ini bildiradi.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Binlar — bu tadqiqotchilar ma'lumotlarni hisoblash va grafiklar tuzish uchun uzluksiz oqimni bo‘laklarga (masalan, 500 millisekundlik oraliqlarga) bo‘ladigan vaqt kesimlari.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Uyg‘onish davomiyligi va interiktal faollik o‘rtasidagi bog‘liqlikni baholash uchun mualliflar 17 nafar bemorning barcha uyg‘onishlari va ular bilan bog‘liq IED larni umumlashtirib, umumlashgan chiziqli aralash modellarini (GLMM) qo‘llashdi. Bunda uyg‘onish davomiyligi mustaqil o‘zgaruvchi, normallashtirilgan IED soni yoki chastotasi esa tobe o‘zgaruvchi sifatida olindi. Ma'lum bo‘lishicha, uyg‘onish davomiyligi oshishi bilan umumiy IED soni sezilarli darajada ko‘paygan (GLMM, beta koeffitsiyenti bahosi ± standart xato: uyg‘onishning har bir 1 soniyalik uzayishi bilan IED soni 0.078 ± 0.006 ga oshgan, p &amp;lt; 0.0001, Rasm 8b). Bu shuni ko‘rsatadiki, uzunroq uyg‘onishlar umuman olganda ko‘proq interiktal faollikni o‘z ichiga oladi. Qizig‘i shundaki, butun uyg‘onish davomiyligi bo‘ylab IED chastotasi aksincha sezilarli darajada kamaygan (GLMM, beta koeffitsiyenti bahosi ± standart xato: uyg‘onishning har bir 1 soniyalik uzayishi bilan IED chastotasi 0.051 ± 0.006 s⁻¹ ga kamaygan, p &amp;lt; 0.0001, Rasm 8c). Demak, uzoqroq uyg‘onishlar davomida ko‘proq razryadlar sodir bo‘lsa-da, uyg‘onish davom etgani sari ular asta-sekin sekinlashgan tezlikda yuzaga keladi. Umuman olganda, bu natijalar uyg‘onish boshlanishi epileptik faollikning qisqa muddatli chaqnashini keltirib chiqarishini, uyg‘onish barqarorlashgani sari bu faollik pasayishini va bu jarayon kortikal qozg‘aluvchanlikning dinamik tebranishlari bilan boshqarilishini ko‘rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Uyg‘onish boshlanishi dastlabki 0.5–1 soniyada epileptiform razryadlarning oniy cho‘qqisini keltirib chiqaradi, IED ning umumiy soni esa uyg‘onish davomiyligiga qarab o‘sadi (har bir soniyada 0.078 taga, p &amp;lt; 0.0001), garchi ularning soniya chastotasi asta-sekin kamaysa ham.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Nihoyat, mualliflar uyg‘onish ta'sirida interiktal faollikning o‘sishini talamokortikal faollashuv bilan tushuntirish mumkinligini tekshirishdi. Buning uchun talamus ichiga stereoelektroensefalografiya (SEEG) elektrodlari o‘rnatilgan 4 nafar bemor ishtirokida kichik guruh tahlili bajarildi. N2 bosqichidagi uyg‘onishlar vaqtida (n = 56) talamik spektral quvvat IED soni bilan bog‘liqligini tekshirish uchun GLMM qo‘llandi, bu bosqichda razryadlarning eng katta o‘sishi kuzatilgan edi. Barcha SEEG kanallari bo‘yicha normallashtirilgan IED soni talamik spektral quvvat nisbatining funksiyasi sifatida modellashtirildi: stimulusdan oldingi boshlang‘ich darajaga nisbatan 3 soniyali uyg‘onish davrida hisoblangan δ/(θ+α+β) ([0.5–4 Gs]/[4.5–30 Gs]) nisbati. Talamik spektral quvvat nisbati bilan IED soni o‘rtasida sezilarli salbiy bog‘liqlik aniqlandi (GLMM, beta koeffitsiyenti bahosi ± standart xato: talamik quvvat nisbati 1.0 ga oshganda IED soni 0.081 ± 0.035 ga kamaygan, P = 0.022, Rasm 8f). Shunga ko‘ra, nisbiy dessa delta-faolligi pastroq bo‘lgan (tezroq talamik ritmlarga siljishni aks ettiruvchi) uyg‘onishlar yuqoriroq IED soni bilan bog‘liq bo‘lgan. Bu natijalar uyg‘onish bilan bog‘liq interiktal faollik talamik tebranishlarning tezlashishi orqali kortikal qozg‘aluvchanlikni va IED hosil bo‘lishini oson N2 bosqichidagi talamokortikal mexanizmlar bilan bog‘liqligini ko‘rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Talamusning roli bo‘yicha xulosalar atigi 4 nafar bemordan iborat kichik guruh tahliliga asoslangan (N2 bosqichidagi 56 ta uyg‘onish), shuning uchun bu natijalarni epilepsiyasi bor barcha bemorlarga nisbatan ehtiyotkorlik bilan qo‘llash lozim.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;h4 id=\"uyqu-mikrostrukturasining-epileptik-faollikni-modulyatsiya-qilishdagi-roli\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#uyqu-mikrostrukturasining-epileptik-faollikni-modulyatsiya-qilishdagi-roli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Uyqu mikrostrukturasining epileptik faollikni modulyatsiya qilishdagi roli&lt;/span&gt;&lt;/a&gt;Uyqu mikrostrukturasining epileptik faollikni modulyatsiya qilishdagi roli&lt;/h4&gt;\n&lt;p&gt;Olingan natijalar uyqu mikrostrukturasi hamda spontan yoki chaqirilgan mikro uyg‘onishlar interiktal epileptik faoliyatning quvvatli dinamik modulyatorlari ekanligini ishonchli tasdiqlaydi. Uyqu barqarorligini maqsadli o‘zgartirish uchun nazorat qilinadigan eshitish stimulyatsiyasi bilan birgalikda intrakranial elektroensefalografiya va polisomnografiyani qo‘llagan holda, mualliflar uyg‘onishlar patologik razryadlarni tarmoqqa xos tarzda keskin oshirishini ko‘rsatib berdilar. Epilepsiya va uyqu o‘rtasidagi murakkab ikki tomonlama bog‘liqlik qadimdan ma’lum bo‘lsa-da, aynan uyg‘onishlarni eksperimental tarzda qo‘zg‘atish orqali uyqu beqarorligi interiktal epileptiform razryadlarning darhol oshishiga sabab bo‘lishining to‘g‘ridan-to‘g‘ri sabab-oqibat dalillari ilk bor olindi. Ushbu qonuniy ta’sir yuqori chastotali tebranishlarga ham, eshitish stimulyatsiyasi bilan bog‘liq bo‘lmagan tabiiy spontan uyg‘onishlarga ham taalluqlidir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Uyqu paytida yuzaga keladigan tranzitor mikro uyg‘onishlar interiktal razryadlar va yuqori chastotali tebranishlar chastotasining darhol sakrashiga olib keladi, bu esa uyqu beqarorligining patologik tarmoq dinamikasini faollashtirishdagi sababiy rolini tasdiqlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Qizig‘i shundaki, interiktal razryadlar sonining keskin ko‘payishiga qaramay, ularning fazoviy tarqalish xarakteri o‘zgarmas bo‘lib qoldi. Bu shuni ko‘rsatadiki, uyquning parchalanishi razryadlarning hosil bo‘lishiga mahalliy ta’sir ko‘rsatib, keng miqyosdagi miya tuzilmalarini o‘z ichiga olmaydi. Bunday hodisa po‘stloq qo‘zg‘aluvchanligining qisqa muddatli mahalliy o‘sishi bilan izohlanadi, buni epileptiform faollikning kuchayishi faqat neokortikal zonalarda kuzatilishi va peshona yoki chakka do‘mbog‘ining mezenximal qismlarida butunlay yo‘qligi tasdiqlaydi. Shu bilan birga, razryadlar sonining o‘sishi ham xuruj boshlanish zonasida, ham uni o‘rab turgan to‘qimalarda bir xil darajada namoyon bo‘ladi, bu esa epileptogen zonaning uyqu beqarorligi bilan bog‘liq bo‘lgan qo‘zg‘aluvchanlik tebranishlariga ustuvor darajada jalb etilmaganligidan dalolat beradi.&lt;/p&gt;\n&lt;h4 id=\"uyqu-bosqichlari-va-talamokortikal-mexanizmlarning-tasiri\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#uyqu-bosqichlari-va-talamokortikal-mexanizmlarning-tasiri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Uyqu bosqichlari va talamokortikal mexanizmlarning ta’siri&lt;/span&gt;&lt;/a&gt;Uyqu bosqichlari va talamokortikal mexanizmlarning ta’siri&lt;/h4&gt;\n&lt;p&gt;Uyg‘onishlar orqali interiktal razryadlarni rag‘batlantirish effekti tunda dam olish bosqichlariga yaqqol bog‘liqligini ko‘rsatadi: bunday dinamika N2 va N3 sekin uyqu bosqichlarining ikkalasida ham qayd etiladi, biroq N2 bosqichida ta’sir ancha kuchliroq bo‘ladi. Bu ushbu bosqichda epileptik naqshlarni rag‘batlantirishi mumkin bo‘lgan kuchliroq talamokortikal sinxronizatsiya bilan bevosita mos keladi. Talamus yadrolarida elektrodlari bo‘lgan bemorlar guruhi natijalari N2 uyg‘onishlari davomida talamokortikal faollikning tezroq bo‘lishi interiktal razryadlarning yuqori soni bilan bog‘liqligini ko‘rsatdi. Fon delta faolligining o‘zi alohida sekin to‘lqinli javoblarda razryadlarga yordam bersa-da, uyg‘onish yuzaga kelishi bilan bu modulyator ta’sir butunlay yo‘qoladi va mikro uyg‘onishlar parchalangan uyqu paytida interiktal razryadlanishning asosiy drayveriga aylanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Talamokortikal sinxronizatsiya — talamus va bosh miya po‘stlog‘i o‘rtasidagi muvofiqlashtirilgan ritmik faollik bo‘lib, u N2 bosqichida ayniqsa kuchli bo‘ladi va uyg‘onish paytida epileptik razryadlarning kuchayishiga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"postloq-qozgaluvchanligi-dinamikasi-va-razryadlarni-mahalliy-hosil-qilish-mexanizmlari\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#postloq-qozgaluvchanligi-dinamikasi-va-razryadlarni-mahalliy-hosil-qilish-mexanizmlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Po‘stloq qo‘zg‘aluvchanligi dinamikasi va razryadlarni mahalliy hosil qilish mexanizmlari&lt;/span&gt;&lt;/a&gt;Po‘stloq qo‘zg‘aluvchanligi dinamikasi va razryadlarni mahalliy hosil qilish mexanizmlari&lt;/h4&gt;\n&lt;p&gt;Chaqirilgan uyg‘onishlar paytida razryadlar sonining zudlik bilan o‘sishi uyqu va hushyorlik holatlari o‘rtasidagi keskin o‘tish davriga xos bo‘lgan po‘stloq qo‘zg‘aluvchanligining o‘zgarishini aks ettiradi. Bunday o‘tishlar kortikal tarmoqlardagi qo‘zg‘alish va tormozlanish o‘rtasidagi nozik muvozanatni vaqtincha buzishi va razryadlar paydo bo‘lishi uchun qulay bo‘lgan o‘ta qo‘zg‘aluvchan muhitni yaratishi mumkin. Uyg‘onishlarning qisqa davomiyligini hisobga olsak, ular bilan bog‘liq qo‘zg‘aluvchanlikning oshishi xurujlarni keltirib chiqarish uchun juda qisqa muddatli bo‘lishi mumkin, bu esa razryadlarning ko‘payishiga sabab bo‘lishiga qaramay, uyg‘onish paytida xurujlarning yo‘qligini tushuntiradi. Razryadlar chastotasi uyg‘onish boshlangan zahoti cho‘qqiga chiqishi va uning rivojlanishi bilan kamayishi interiktal razryadlanishning uyg‘onish holatiga dastlabki beqaror o‘tish davriga vaqtinchalik bog‘liqligini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kuzatilgan natijalar intrakranial monitoring paytida farmakorezistent epilepsiyasi bo‘lgan maxsus bemorlar guruhidan olingan, shuning uchun ularni sog‘lom odamlar yoki boshqa patologiya shakllari bo‘lgan umumiy aholiga avtomatik ravishda tatbiq etib bo‘lmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mualliflar faraziga zid ravishda, chaqirilgan uyg‘onishlar razryadlarning umumiy sonini doimiy ravishda oshirganiga qaramay, ularning fazoviy tarqalishiga ta’sir ko‘rsatmadi. Ushbu turlicha ta’sirlar uyg‘onishlar uning tarqalishiga yordam beradigan kengroq epileptik tarmoqlarni o‘z ichiga olmagan holda, faqat interiktal faoliyatning mahalliy hosil bo‘lishini modulyatsiya qilishini ko‘rsatadi. Shu sababli, uyg‘onish paytida po‘stloq qo‘zg‘aluvchanligining o‘tkinchi o‘zgarishlari mahalliy tarmoqlarda razryadlarni boshlash uchun boshlang‘ich omil bo‘lib xizmat qilishi mumkin, biroq keng miqyosdagi tarmoq faollashuvi uchun zarur bo‘lgan chegaraga yetmaydi.&lt;/p&gt;\n&lt;h4 id=\"mintaqaviy-farqlar-va-tush-paytidagi-epiletiform-faollikka-uyqu-bosqichlarining-tasiri\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#mintaqaviy-farqlar-va-tush-paytidagi-epiletiform-faollikka-uyqu-bosqichlarining-tasiri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mintaqaviy farqlar va tush paytidagi epiletiform faollikka uyqu bosqichlarining ta'siri&lt;/span&gt;&lt;/a&gt;Mintaqaviy farqlar va tush paytidagi epiletiform faollikka uyqu bosqichlarining ta'siri&lt;/h4&gt;\n&lt;p&gt;Uyqudan uyg'onish vaqtida tarqaladigan miya ichidagi epileptiform razryadlar (IED) chastotasining oshishidagi mintaqaviy farqlar talamokortikal bog'liqlikning turlicha bo'lishi bilan izohlanadi. Zich talamik proyeksiyalarni oluvchi neokorteks uyg'onish paytida IED ko'payishini ko'rsatdi, mesiotemporal hududlarda esa talamus bilan aloqasi cheklanganligi sababli sezilarli ta'sir kuzatilmadi. Spontan uyg'onishlar ham neokortikal IED oshishi bilan birga keldi, biroq mesiotemporal hududlarda IED kamayishi qayd etildi. Spontan uyg'onishlar paytida mesiotemporal IEDlarning bostirilishi uyg'onish turlari orasidagi markaziy va periferik komponentlarning farqlarini aks ettirishi mumkin. Auditorli uyg'onishlar tarmoq desinxronizatsiyasiga qarshi chiquvchi sensorli yo'llarni faollashtiradi.&lt;/p&gt;\n&lt;p&gt;Talamik SEEG elektrodlariga ega bemorlar kichik guruhidagi tahlillar bu mintaqaviy o'ziga xoslikni tasdiqladi: tezroq talamik faollik bilan kechgan uyg'onishlar yuqori IED soni bilan bog'liq bo'ldi. Bu vaqtinchalik talamokortikal faollashuv neokorteksda epileptik uchlarni keltirib chiqarishini ko'rsatadi. Gippokamp Papez doirasi orqali talamusning oldingi yadrolari bilan bog'langan bo'lsa, neokortikal faollashuv qobiq holatini tartibga soluvchi talamik tizimlar tomonidan qo'llab-quvvatlanadi. Kelgusida talamik yadrolarning anatomik lokalizatsiyasini o'rganish mexanik talqinlarni aniqlashtirishga yordam beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Uyg'onish paytida IEDning oshishi mintaqaviy xususiyatga ega: kuchli talamokortikal aloqalar tufayli neokorteks faollashadi, mesiotemporal zonalar esa boshqacha javob beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Epileptogen zona (SOZ) ichi va tashqarisidagi IED o'sishi taqqoslanganda o'xshash natijalar olindi, bu qutblanishning o'choq ichida kuchayishidan ko'ra global tarmoq hodisasi ekanligini ko'rsatadi. IED reaktsiyasi uyqu bosqichiga bog'liq bo'lib, N2 da N3 ga qaraganda sezilarli darajada kuchliroq ta'sir ko'rsatdi. N2 bosqich tez-tez uyg'onishlar va tsiklik o'zgaruvchan naqshlar (CAP) bilan tavsiflanadi, N3 esa talamusning kamroq jalb etilgan barqaror uyquni aks ettiradi. Qizig'i shundaki, spontan uyg'onishlar N3 da N2 ga qaraganda ancha katta IED o'sishini ko'rsatdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;N2 uyqu bosqichi delta faolligining beqarorligi va tez-tez uchraydigan CAP mikro-uyg'onishlari bilan ajralib turadigan, epileptik razryadlarni osonlashtiradigan yengilroq NREM uyqu bosqichidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"uygonish,-delta-faolligi-va-stimullar-intensivligining-ozaro-tasiri\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#uygonish,-delta-faolligi-va-stimullar-intensivligining-ozaro-tasiri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Uyg'onish, delta faolligi va stimullar intensivligining o'zaro ta'siri&lt;/span&gt;&lt;/a&gt;Uyg'onish, delta faolligi va stimullar intensivligining o'zaro ta'siri&lt;/h4&gt;\n&lt;p&gt;Mualliflar IED kuchayishi uyg'onish reaksiyasining o'ziga yoki foniy sekin to'lqin faolligiga bog'liqligini o'rganishdi. To'liq kortikal uyg'onishlar izolyatsiya qilingan sekin to'lqinli javoblovlarga qaraganda ancha yuqori IED sonini keltirib chiqardi. Stimuldan oldingi delta holati izolyatsiya qilingan sekin to'lqinlar uchun ko'proq IED sonini bashorat qildi. Biroq uyg'onish sodir bo'lgandan so'ng, delta holati IED soni bilan bog'liq bo'lmay qoldi, chunki uyg'onish kortikal qo'zg'aluvchanlikka yetarlicha kuchli ta'sir ko'rsatib, fon tebranishlarini bosib ketdi.&lt;/p&gt;\n&lt;p&gt;Stimul intensivligi nazorat davrlarida IED soniga kichik dozaga bog'liq ta'sir ko'rsatdi, biroq uyg'onish paytidagi katta IED o'sishi stimul intensivligidan qat'i nazar yuzaga keldi. Talamik spektrda o'zgarishlarning yo'qligi stimul intensivligi talamokortikal modulyatsiya orqali emas, balki sensorli ishlov berish orqali ta'sir qilishini ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Olingan natijalar farmakorezistent epilepsiya bilan og'rigan bemorlarning klinik monitoringi asosida olingan bo'lib, uyqu parametrlari va stimulyatsiya o'zgaruvchanligini kattaroq tanlanmalarda tekshirish talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"klinik-oqibatlar-va-korreksiya-istiqbollari\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#klinik-oqibatlar-va-korreksiya-istiqbollari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Klinik oqibatlar va korreksiya istiqbollari&lt;/span&gt;&lt;/a&gt;Klinik oqibatlar va korreksiya istiqbollari&lt;/h4&gt;\n&lt;p&gt;Olingan ma'lumotlar uyg'onishlar kortikal tarmoq qo'zg'aluvchanligini beqarorlashtiruvchi o'tkir dinamik omillar ekanligini ko'rsatish orqali uyqu va epilepsiya o'zaro ta'sirini tushunishni kengaytiradi. Uyqudagi tez-tez IED xotirani mustahkamlashni buzadi, kognitiv ko'rsatishni pasaytiradi va tutilishlar chegarasini pasaytiruvchi omil bo'lishi mumkin. Tungi tutqanoqlar SUDEP xavfi bilan bog'liq. Uyg'onishlarni o'zgartirilishi mumkin bo'lgan trigger sifatida aniqlash davolashning yangi yo'llarini ochadi: apnoeni davolash, uyqu arxitekturasini buzmaydigan dorilarni qo'llash va yopiq pastadirli (closed-loop) neyromodulyatsiya texnologiyalari. N3 sekin to'lqinli uyqu bilan bir qatorda N2 uyquni barqarorlashtirish ham muhim ahamiyatga ega.&lt;/p&gt;\n&lt;h4 id=\"tadqiqot-cheklovlari-va-istiqbollar\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#tadqiqot-cheklovlari-va-istiqbollar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot cheklovlari va istiqbollar&lt;/span&gt;&lt;/a&gt;Tadqiqot cheklovlari va istiqbollar&lt;/h4&gt;\n&lt;p&gt;Bizning tadqiqotimiz uyqu barqarorligining epileptik faollikka ta'sirini aniqlash hamda natijalarning umumqiymatliligini oshirish uchun turli xil klinik ko'rinishga ega bo'lgan bemorlarni qamrab olishga mo'ljallangan edi. Shu sababli, guruhga turli tuzilmaviy nuqsonlar va MRI-negativ holatlar kiritildi, barcha ishtirokchilar uchun gistopatologik tasdiq mavjud emas edi. Kelib chiqqan xilma-xillik va alohida patologik toifalardagi kichik sonlar mintaqaviy ta'sirlarning lezyonga qarab o'zgarishini aniqlash uchun mazmunli statistik tahlil qilishga imkon bermadi, shuningdek, epilesiya kenja turlari bo'yicha yakuniy xulosalar chiqarish ish doirasidan tashqarida edi. Shunga qaramay, topilmalarimiz kattaroq guruhlarda kelgusidagi ko'p markazli tadqiqotlar uchun qimmatli poydevor yaratadi. Tutqashuv boshlanish zonasi (SOZ) eng birinchi aniqlangan iktal o'zgarishlarga asoslangan klinik elektrogetik mezonlar yordamida aniqlandi va haqiqiy epileptogen zonaga mos kelmasligi mumkin, shuning uchun u tutqashuvni boshlashda qatnashadigan hududlarni o'z ichiga olgan funksional konstrukt deb qaralishi kerak. Yana bir cheklov — bu tadqiqot faqat dori vositalariga chidamli epilepsiya bilan og'rigan bemorlarda o'tkazilgani bo'lib, ular inson miyasiga intrakranial elektrodlar kiritilishi mumkin bo'lgan yagona guruhdir, natijada topilmalar boshqariladigan epilepsiyali shaxslarga taalluqli bo'lmasligi mumkin. Implantatsiya zichligining ta'siri asosiy tahlillarni faol kanallar bilan cheklash va kanal darajasidagi GLMM yondashuvini qo'llash orqali kamaytirildi, ammo implantatsiya strategiyasi klinik maqsadlarga asoslanib qolmoqda. Kelgusida kanal darajasidagi faollik o'lchovlarini to'qima darajasidagi patologik korrelyatsiyalar bilan birlashtirgan tadqiqotlar bu farqni yanada hal qilishga yordam beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Tadqiqot faqat intrakranial elektrodlar o'rnatilgan farmakorezistent epilepsiya bemorlarida bajarilgan bo'lib, natijalarni yengilroq shakldagilarga avtomatik ravishda tatbiq etib bo'lmaydi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Nihoyat, bizning dizaynimiz uyg'onishning IEDga ta'sirini oldingi kuzatuv ishlariga qaraganda to'g'ridan-to'g'ri o'rganishga imkon bergan bo'lsa-da, biz IED ham uyg'onishni keltirib chiqarishi mumkinligini va ikki tomonlama munosabat mavjudligini tan olamiz. Kelgusi tadqiqotlar xotira va kognitiv funksiyalarga uyg'onish tufayli IED oshishining oqibatlarini aniqlashtirish uchun xulq-atvor testlarini bir vaqtning o'zida uyqu va EEG yozuvlari bilan birlashtirishi kerak.&lt;/p&gt;\n&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;Xulosa qilib aytganda, bizning tadqiqotimiz vaqtinchalik uyqu beqarorligi, xususan NREM uyqusi paytida qo'zg'atilgan mikro-uyg'onishlar farmakorezistent epilepsiyada interiktal faollikni keskin kuchaytirishi mumkinligi haqida yangi dalillarni taqdim etadi. Uyqu barqarorligini aniq vaqt nazorati bilan eksperimental boshqarish orqali biz uyg'onish ta'siridagi interiktal spike'lar neokorteksda sodir bo'lishini va N2 uyqusi paytida kattaroq ta'sir ko'rsatishini ko'rsatamiz. Bundan tashqari, biz uyg'onishlar interiktal spike yukini oshirsa-da, ularning fazoviy tarqalishiga ta'sir qilmasligini ko'rsatamiz. Bu uyg'onish bilan bog'liq spike'lar keng miqyosli epileptik tarmoqlarni yetarli darajada jalb qilmagan holda yuqori mahalliy kortikal qo'zg'aluvchanlikni aks ettirishini ko'rsatadi. Birgalikda ushbu topilmalar uyquga asoslangan paradigmalarning epilepsiya tarmoqlari dinamikasini o'rganishdagi salohiyatini mustahkamlaydi hamda uyquni neyromodulyatsion yondashuvlar uchun o'zgaruvchan terapevtik nishon sifatida ta'kidlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\
