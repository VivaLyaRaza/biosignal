 41 seans davomida baholangan tanlangan Q-o'rganish modelining parametrlari — chap panel: yutuqlar va yo'qotishlarning o'rtachalari hamda REE uchun qaror vaznlari; o'ng panel: yutuqlar va yo'qotishlar uchun o'rganish va unutish tezliklari; pushti va qizil síchonlarning individual parametrlari nuqtalar sifatida ko'rsatilgan bo'lsa, ko'k va yashil síchonlarning parametrlari 10- va 90-persentillar, interkvartil oralig'i va medianaga ega quti diagrammalari sifatida ko'rsatilgan; fenotiplar orasidagi taqqoslashlar Wilcoxon Rank Sum testlari yordamida amalga oshirilgan (⋆ p &amp;lt; 0.05 degan ma'noni anglatadi) — batafsil ma'lumot uchun «Materiallar va usullar»ning «Kengaytirilgan Q-o'rganish modelini baholash va simulyatsiya qilish» kichik bo'limiga qarang. Har bir síchon uchun baholangan parametrlar 6-rasmda ko'rsatilgan. Fenotiplar orasidagi yaqqol farq REE ga xos qaror vaznlariga e'tibor qaratganda namoyon bo'ladi: ko'k síchonlar sezilarli darajada salbiy γl qiymatlari (p = 0.0102) sifatida ifodalangan «Qora oqqush»ga nisbatan kuchli tanlab sezuvchanlikni ko'rsatadi. Bu hayvonni «Qora oqqush» ta'siriga duchor qiladigan variantlarga (F va V variantlari) tayinlangan ishonchli hisoblash jarimasini ko'rsatadi, bu ularning ushbu natijalardan xulq-atvor bo'yicha qochishiga mos keladi. Aksincha, yashil síchonlar bu tanlab yoqtirmaslik vaznini ko'rsatmaydi va odatda F va A variantlarini birlashtiradi, bu REEga nisbatan kamroq tanlab munosabatda bo'lishni taklif qiladi. 4-rasmda tasvirlangan oldingi/keyingi tahlil shuni ko'rsatadiki, «Qora oqqushlar»ga xulq-atvor javobi umumiy va bir tomonlama sezuvchanlik nuqtai nazaridan mahalliy darajada kichikdir. Bu bunday effektlar ko'pchilik síchonlar uchun ushbu model klassi tomonidan qamrab olinishi uchun juda nozik bo'lishi ehtimolini ko'rsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-fS1.jpg\" alt=\"S1-rasm: 20 ta ratning har biri uchun qavariqlik mukofotlari (qator) — tafsilotlar uchun Ilovaga qarang. Har bir qator r\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S1-rasm: 20 ta ratning har biri uchun qavariqlik mukofotlari (qator) — tafsilotlar uchun Ilovaga qarang. Har bir qator ratni bildiradi va rang kodi 2-rasmdagidek hayvonning profilini ko'rsatadi. O'ng tomonga qarab, nuqta har bir sinovda qavariq menyu tanlanganda olinadigan miqdorga nisbatan qancha pelet olinganligini ko'rsatadi. Chap tomonga qarab, rangli nuqta har bir sinovda botiq menyu tanlanganda olinadigan miqdorga nisbatan olingan jami jarima soniyalarini ko'rsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-fS2.jpg\" alt=\"Rasm S2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-fS2-2.jpg\" alt=\"Rasm S2 (davomi 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S2 (davomi 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-fS3.jpg\" alt=\"Rasm S3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-fS3-2.jpg\" alt=\"Rasm S3 (davomi 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S3 (davomi 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-fS3-3.jpg\" alt=\"Rasm S3 (davomi 3)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S3 (davomi 3)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-fS4.jpg\" alt=\"Rasm S4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S4&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"jadvallar\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#jadvallar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Jadvallar&lt;/span&gt;&lt;/a&gt;Jadvallar&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 2.&lt;/strong&gt; Qavariq va botiq ekspozitsiyalar uchun Jensen bo'shliqlarining statistik momentlari va parchalanishi&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Ko'rsatkich&lt;/th&gt;\n&lt;th&gt;Qavariq ekspozitsiya&lt;/th&gt;\n&lt;th&gt;Botiq ekspozitsiya&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;O'rtacha&lt;/td&gt;\n&lt;td&gt;3.89&lt;/td&gt;\n&lt;td&gt;3.11&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 3.&lt;/strong&gt; REE ga nisbatan umumiy sezgirlik va REE ga nisbatan bir tomonlama sezgirlik uchun oldin/keyin farqlari&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Sichqon&lt;/th&gt;\n&lt;th&gt;REE ga umumiy sezgirlik / jekpot&lt;/th&gt;\n&lt;th&gt;REE ga umumiy sezgirlik / qora oqqush&lt;/th&gt;\n&lt;th&gt;REE ga bir tomonlama sezgirlik / jekpot&lt;/th&gt;\n&lt;th&gt;REE ga bir tomonlama sezgirlik / qora oqqush&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;• 1&lt;/td&gt;\n&lt;td&gt;-0.062&lt;/td&gt;\n&lt;td&gt;-0.133&lt;/td&gt;\n&lt;td&gt;-0.046&lt;/td&gt;\n&lt;td&gt;-0.467&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Biz 20 ta kalamushning har biri uchun 41 ta seans bo'yicha o'rtacha hisobladik. Salbiy o'rtacha farqlar qizil rangda, ijobiy o'rtacha farqlar sariq rangda ta'kidlangan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval S1.&lt;/strong&gt; Ketma-ketlikdagi REE o'rni&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;#&lt;/th&gt;\n&lt;th&gt;Jekpot&lt;/th&gt;\n&lt;th&gt;Qora oqqush&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Jadval S2.&lt;/strong&gt; Xulq-atvor ketma-ketligi turlari&lt;/p&gt
