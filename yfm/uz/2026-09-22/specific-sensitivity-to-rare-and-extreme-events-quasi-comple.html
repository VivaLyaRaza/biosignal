            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"277\" cy=\"156\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"503\" cy=\"215\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · ANIMAL BEHAVIOR AND COGNITION   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Kalamushлар қоқу қуshlarini&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qanday chetlab o‘tadi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f1.jpg\" alt=\"Figure 1: Experimental Design. (a) Schematic of the operant conditioning chamber. Rats\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 1: Experimental Design. (a) Schematic of the operant conditioning chamber. Rats&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Ko‘p tajribalar qarorlarni odatiy sharoitda o‘rganadi, ammo haqiqiy hayotda ehtimoli kam, lekin ulkan oqibatli holatlar ko‘p. Neyrobiologlar kemiruvchilar bunday nodir hodisalarga qanday moslashishini tekshirdi. Ma'lum bo‘lishicha, miya odatiy holatlar va cheksizliklarni bir-biridan ajratib turadi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Kalamushlar nodir jazolardan qochish uchun mayda yo‘qotishlarga rozi bo‘ladi.&lt;/li&gt;\n&lt;li&gt;Alohida vaznli model hayvonlar tanlovini yaxshiroq tushuntiradi.&lt;/li&gt;\n&lt;li&gt;Miya taqsimot chetlarini odatiy holatlardan alohida qayta ishlaydi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Klassik xulq-atvor testlarida ehtimolliklar ko‘pincha o‘n foizdan yuqori bo‘ladi. Mualliflar ehtimoli bir foizdan kam va o‘rtacha qiymatdan o‘nta standart og‘ishdan yuqori bo‘lgan nodir hodisalarni (REE) baholash uchun maxsus muhit yaratdi. To‘rt qadamli tanlov testida hayvonlar shakar pelletlari va vaqtni yo‘qotish jazolari o‘rtasida tanlov qildi.&lt;/p&gt;\n&lt;p&gt;Kemiruvchilarning xulq-atvori aniq assimetriyani ko‘rsatdi. Kalamushlar o‘ta og‘ir jazolarni butunlay chetlab o‘tdi, ammo yirik yutuqlarga qisman intildi. Buning evaziga hayvonlar kichik yo‘qotishlarga chidashga rozi bo‘ldi. Oddiy o‘rganish modellari bunday strategiyani tushuntira olmadi.&lt;/p&gt;\n&lt;p&gt;Tadqiqotchilar nodir voqealarga alohida vazn beruvchi kengaytirilgan modelni qo‘lladi. Bu kalamush miyasi odatiy taqsimot va uning chetki qismlarini mustaqil baholashini ko‘rsatdi. Bunday bo‘linish hayvonlarga halokatli oqibatlardan qochish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot laboratoriya kalamushlarida o‘tkazilgan bo‘lib, natijalarni darhol inson qarorlariga tatbiq etib bo‘lmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"specific-sensitivity-to-rare-and-extreme-events\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#specific-sensitivity-to-rare-and-extreme-events\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Specific Sensitivity to Rare and Extreme Events&lt;/span&gt;&lt;/a&gt;Specific Sensitivity to Rare and Extreme Events&lt;/h3&gt;\n&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Mualliflarning ta'kidlashicha, hayvonlarda o'tkazilgan ko'pchilik xulq-atvor tadqiqotlari 10% dan yuqori ehtimolliklarni o'rganadi, ammo real hayotdagi qarorlar ko'pincha juda kam ehtimolli, lekin katta oqibatga ega voqealarni baholashni talab qiladi. Ushbu bo'shliqni to'ldirish uchun tadqiqotchilar kalamushlarning kamyob (ehtimolligi &amp;lt; 1%) va o'ta og'ishgan (o'rtachadan 10 standart og'ishdan ortiq) hodisalarga (REE) qanday moslashishini o'lchash uchun tajriba va hisoblash usulini ishlab chiqdilar.&lt;/p&gt;\n&lt;p&gt;To'rt dəstakli bandit vazifasidan foydalanib, hayvonlar ehtimoliy mukofotlar (shakar granutalari) yoki jazolar (kutish vaqtlari) orasidan tanlov qilishdi. Bu oddiy va og'ishgan taqsimotlar bo'yicha ma'nolarni qanday birlashtirishini kuzatish imkonini berdi.&lt;/p&gt;\n&lt;p&gt;Hayvonlarning xulq-atvori cheklangan diversifikatsiyani (odatda 4 tadan 2 ta variantni tanlash) va REE ga nisbatan aniq sezgirlikni ko'rsatdi. Kalamushlar kamyob va ekstremal jazolardan (\"qora oqqushlar\") tizimli ravishda qochdilar, lekin kamyob va ekstremal yutuqlarga (\"jekpotlar\") qisman yo'l qo'ydilar. Bunday assimetriya tez-tez uchraydigan yirik yutuqlardan voz kechish va tez-tez yo'qotishlarni qabul qilish evaziga erishildi.&lt;/p&gt;\n&lt;p&gt;Natijalarni tushuntirish uchun tadqiqotchilar REE ni odatiy voqealardan alohida baholaydigan kuchaytirilgan o'rganish modelini qo'lladilar. Standart Q-o'rganish modeli assimetriyani takrorlay olmadi, yangi model esa kalamush miyasi markaziy taqsimot va uning chekka qismlaridagi ma'lumotlarni alohida ajratishini muvaffaqiyatli ko'rsatdi.&lt;/p&gt;\n&lt;h4 id=\"nodir-va-ekstremal-hodisalar-boyicha-tadqiqotga-kirish\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#nodir-va-ekstremal-hodisalar-boyicha-tadqiqotga-kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nodir va ekstremal hodisalar bo'yicha tadqiqotga kirish&lt;/span&gt;&lt;/a&gt;Nodir va ekstremal hodisalar bo'yicha tadqiqotga kirish&lt;/h4&gt;\n&lt;p&gt;Mualliflarning ta'kidlashicha, noaniqlik sharoitida odamlar va hayvonlarning moslashuvchan xulq-atvorida muhitni o'rganish (exploration) hamda mavjud tajribadan foydalanish (exploitation) asosiy tarkibiy qismlar hisoblanadi. Shunga qaramay, bunday xulq-atvor jarayonlari juda kam uchraydigan va ulkan oqibatlarga olib keladigan natijalar — Nodir va ekstremal hodisalar (REE) ta'sirida qanday boshqarilishi haqida ma'lumotlar kam. Laboratoriya sharoitidagi ko'plab qaror qabul qilish vazifalari ehtimolligi 10% dan yuqori bo'lgan taqsimotlarga tayanadi, bu esa tabiatdagi haqiqiy sharoitlarni to'liq aks ettirmaydi. Bunday hodisalar turlarning yo'qolib ketishiga olib kelishi yoki texnologik yutuqlarni rag'batlantirishi mumkin. Tajriba asosida bunday voqealarning ehtimoli va ko'lamini aniq baholab bo'lmagani uchun, ular o'rganish mexanizmlariga jiddiy muammolar tug'diradi. Ushbu bo'shliqni to'ldirish uchun tadqiqotchilar xulq-atvor neyrofiziologiyasida keng qo'llaniladigan kalamushlarni o'rganishga qaror qilishdi va ular uchun ehtimolligi 1% dan kam hamda o'rtacha natijadan 10 standart og'ishdan oshadigan REE bilan to'qnash keladigan yangi to'rt qo'l bandit vazifasini ishlab chiqishdi.&lt;/p&gt;\n&lt;h4 id=\"xulq-atvor-strategiyalari-va-antifragillik-konsepsiyasi\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#xulq-atvor-strategiyalari-va-antifragillik-konsepsiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulq-atvor strategiyalari va antifragillik konsepsiyasi&lt;/span&gt;&lt;/a&gt;Xulq-atvor strategiyalari va antifragillik konsepsiyasi&lt;/h4&gt;\n&lt;p&gt;Eksperiment doirasida mualliflar kalamushlar ekstremal yo'qotishlar (\"Qora oqqushlar\") ta'sirini kamaytiradigan, shu bilan birga ekstremal yutuqlarga erishish imkoniyatini saqlab qoladigan (\"Jekpotlar\") strategiyalarni qo'llashini tekshirishni maqsad qilishdi, bu \"antifragil\" strategiyalarga o'xshashdir. Jekpotlarni yo'q qilib, qora oqqushlar ta'sirini saqlab qoladigan strategiyalar \"fragil\" deb nomlandi. Shuningdek, barcha REE ni istisno qiluvchi \"mustahkam\" (Robust) va hayvonlarni ijobiy hamda salbiy REE larga duchor qiluvchi \"zaif\" (Vulnerable) variantlar aniqlandi. Vazifa uchta ehtimollik domeniga bo'lingan: normal voqealar (taxminan 90%), nodir voqealar (taxminan 10%) va REE (1% dan kam). Mukofotlar va jazolar noliney skala asosida ishlatildi: qavariq variantlar ehtimollik kamaygan sari ulkan yutuqlarni keltirib chiqardi (jekpotlar), botiq variantlar esa yo'qotishlarni oshirdi (qora oqqushlar). Nazariy tahlillar shuni ko'rsatadiki, REE muhitida antifragil strategiyalar optimal bo'ladi, chunki qora oqqushlardan qochish ular ichki reprezentatsiya qilinmaganda juda qimmatga tushadi.&lt;/p&gt;\n&lt;h4 id=\"xulq-atvor-metriklari-va-ree-ga-sezgirlikni-baholash\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#xulq-atvor-metriklari-va-ree-ga-sezgirlikni-baholash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulq-atvor metriklari va REE ga sezgirlikni baholash&lt;/span&gt;&lt;/a&gt;Xulq-atvor metriklari va REE ga sezgirlikni baholash&lt;/h4&gt;\n&lt;p&gt;Hayvonlarning har xil turdagi rag'batlarga (shu jumladan mukofot sifatida shakar pechlari va jazo sifatida taym-аут) qanday munosabatda bo'lishini baholash uchun olimlar ikkita asosiy xulq-atvor ko'rsatkichini ishlab chiqdilar. Birinchisi — REE ga umumiy sezgirlik bo'lib, u yutuq va yo'qotish domenlarida qavariq tanlovlarning umumiy chastotasi sifatida aniqlanadi va kalamushlar REE ni o'z strategiyasiga kiritishini ko'rsatadi. Ikkinchisi — REE ga bir tomonlama sezgirlik bo'lib, u qavariq yutuq tanlovlari va qavariq yo'qotish tanlovlari orasidagi farq sifatida hisoblanadi. Bu metrika jekpotlarni qidirish va qora oqqushlardan qochish o'rtasidagi assimetriyani miqdoriy baholaydi. Ishlab chiqilgan yondashuv noaniqlik sharoitida xarajatlar va foydalarni baholashning neyron mexanizmlarini o'rganish uchun yangi imkoniyatlar ochadi.&lt;/p&gt;\n&lt;h4 id=\"measures-of-sensitivity-to-rare-and-extreme-events-in-a-four-armed-bandit-task\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#measures-of-sensitivity-to-rare-and-extreme-events-in-a-four-armed-bandit-task\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Measures of sensitivity to Rare and Extreme Events in a four-armed bandit task&lt;/span&gt;&lt;/a&gt;Measures of sensitivity to Rare and Extreme Events in a four-armed bandit task&lt;/h4&gt;\n&lt;p&gt;Ushbu bo‘limda to‘rt tanlovli vazifada kalamushlarning kam uchraydigan va ekstremal hodisalarga nisbatan reaksiyasini baholash uchun eksperimental moslama va metodologiya tasvirlangan. Tadqiqotda 20 ta kalamush ishtirok etib, ularning har biri maxsus operant kamerada 41 ta sessiyani boshdan kechirdi. Har bir teshik shakar peletlari ko'rinishidagi mukofotlar va vaqtinchalik blokirovkalar (taym-autlar) shaklidagi jazolarning muayyan taqsimotiga mos keldi (Rasm 1a–b). Natijalarning ehtimolligi va hajmi qavariq yoki botiq qonuniyatlar asosida o'zgarib turdi, bu esa odatiy hodisalar (taxminan 90%), kam uchraydigan hodisalar (taxminan 10%) va kam uchraydigan ekstremal hodisalarni (taxminan 1%) o'z ichiga oldi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f1.jpg\" alt=\"Figure 1: Experimental Design. (a) Schematic of the operant conditioning chamber. Rats\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 1: Experimental Design. (a) Schematic of the operant conditioning chamber. Rats&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Qavariq va botiq funksiyalarni birlashtirish orqali tadqiqotchilar to'rt xil xatti-harakat variantini shakllantirdilar: antimo‘rt, mo‘rt, turg‘un va zaif (Rasm 1c). Antimo‘rt strategiya yirik mukofotlardan foydalanishga imkon berib, halokatli zararlardan qochishga yordam berdi. Afzalliklarni o'lchash uchun mualliflar ikkita asosiy ko'rsatkichni hisoblab chiqdilar (Rasm 1d): ekstremal hodisalarga umumiy sezgirlik va foyda hamda zararlar o'rtasidagi assimetriyani aks ettiruvchi bir tomonlama sezgirlik.&lt;/p&gt;\n&lt;h4 id=\"anti-fragile\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#anti-fragile\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Anti-fragile&lt;/span&gt;&lt;/a&gt;Anti-fragile&lt;/h4&gt;\n&lt;p&gt;Ushbu kichik bo'lim mukofot olish va zararlardan qochish uchun qavariq funksiyalarni birlashtirgan antimo‘rt tanlov variantiga bag'ishlangan. Bunday konfiguratsiya hayvonlarga yirik mukofotlar bilan qisman aloqada bo'lishga imkon beradi va ularni uzoq muddatli taym-autlardan himoya qiladi.&lt;/p&gt;\n&lt;p&gt;Bu bo'limda p3 deb belgilangan oraliq modellashtirish parametrlari va xatti-harakat tendentsiyalari muhokama qilinadi. Ular mukofotlar tarixi hamda ekstremal hodisalarning ta'sir darajasiga qarab muayyan variantlarni tanlash ehtimolini tavsiflaydi.&lt;/p&gt;\n&lt;h4 id=\"robust\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#robust\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Robust&lt;/span&gt;&lt;/a&gt;Robust&lt;/h4&gt;\n&lt;p&gt;Turg‘un (Robust) variant hayvonlar vayronkor zararlardan butunlay qochadigan, ammo yirik yutuqlardan voz kechadigan strategiyani bildiradi. Natijalarga ko'ra, kalamushlarning muhim qismi ushbu strategiyaga moyillik ko'rsatadi.&lt;/p&gt;\n&lt;h4 id=\"fragile\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#fragile\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fragile&lt;/span&gt;&lt;/a&gt;Fragile&lt;/h4&gt;\n&lt;p&gt;Mo'rt (Fragile) strategiya kichik barqaror mukofotlarni keltirib chiqaradi, lekin kemiruvchilarni ekstremal yo'qotishlar xavfiga duchor qiladi. Eksperimental ma'lumotlar shuni ko'rsatadiki, kalamushlarning aksariyati mutlaqo mo'rt xatti-harakatlardan qochadi.&lt;/p&gt;\n&lt;h4 id=\"vulnerable\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#vulnerable\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Vulnerable&lt;/span&gt;&lt;/a&gt;Vulnerable&lt;/h4&gt;\n&lt;p&gt;Zaif (Vulnerable) variant ham yirik yutuqlar, ham ekstremal yo'qotishlar ta'sirini birlashtirib, sinovdan o'tuvchilar uchun noaniqlik darajasini oshiradi. Hayvonlar kam uchraydigan salbiy hodisalardan himoya qilish uchun turg'un va antimo'rt strategiyalarni afzal ko'radilar.&lt;/p&gt;\n&lt;h4 id=\"main-phenotype-strong-avoidance-of-extremepunishments-with-partial-sampling-of-extremerewards\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#main-phenotype-strong-avoidance-of-extremepunishments-with-partial-sampling-of-extremerewards\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Main phenotype: strong avoidance of extremepunishments with partial sampling of extremerewards&lt;/span&gt;&lt;/a&gt;Main phenotype: strong avoidance of extremepunishments with partial sampling of extremerewards&lt;/h4&gt;\n&lt;p&gt;Ushbu bo‘limda mualliflar qaror qabul qilish strategiyalarini aniqlash maqsadida 20 ta kalamushning 41 kunlik seanslari davomidagi xulq-atvor ma’lumotlarini tahlil qilishdi. Nodir ekstremal hodisalarga (REE) nisbatan umumiy sezgirlik va bir tomonlama sezgirlikdan iborat ikki o‘lchovli fazoda Rasm 2 yordamida hayvonlarning tanlovlari ko‘rsatildi. Natijalar shuni ko‘rsatdiki, birorta ham kalamush faqat bitta ekstremal strategiya bilan cheklanmagan; barcha hayvonlar turli variantlarni birgalikda qo‘llagan.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f2.jpg\" alt=\"Figure 2: Total sensitivity to Rare and Extreme Events (REE) (y-axis) plotted against one-sided\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 2: Total sensitivity to Rare and Extreme Events (REE) (y-axis) plotted against one-sided&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"population-levelpatterns\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#population-levelpatterns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Population-levelpatterns&lt;/span&gt;&lt;/a&gt;Population-levelpatterns&lt;/h4&gt;\n&lt;p&gt;Panel 2a da (taxminan 800 ta seansni o‘z ichiga olgan) asosiy ma’lumotlar keltirilgan bo‘lib, seanslarning aksariyati xulq-atvor fazosining chap yarmida joylashgan. Bu REE dan qochish strategiyalarini bildiradi. Nuqtalarning ko‘pchiligi yuqori kvadrantga to‘g‘ri kelib, o‘rtachadan yuqorigacha bo‘lgan umumiy sezgirlikni ko‘rsatadi — kalamushlar halokatli yo‘qotishlardan qochish uchun o‘z tanlovlarini tizimli ravishda moslashtirgan.&lt;/p&gt;\n&lt;h4 id=\"individualbehavioralprofiles\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#individualbehavioralprofiles\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Individualbehavioralprofiles&lt;/span&gt;&lt;/a&gt;Individualbehavioralprofiles&lt;/h4&gt;\n&lt;p&gt;Panel 2b da har bir kalamushning 41 seans davomidagi individual profillari aks ettirilgan. 17-kalamushdan (qizil) tashqari barcha hayvonlar o‘rtacha yoki yuqori umumiy sezgirlikni namoyon etdi. 19-kalamush (binafshana) eng yuqori sezgirlik va yirik mukofotlarni qidirish xususiyatini ko‘rsatgan yagona jonivor bo‘ldi. Qolgan 18 ta kalamush ikkita barqaror guruhga bo‘lindi: ko‘k guruh (13 ta kalamush) yo‘qotishlardan qochish va ishonchli variantlarni afzal ko‘rgan bo‘lsa, yashil guruh (5 ta kalamush) mo‘tadil va nosimmetrik xulq-atvorni ko‘rsatdi.&lt;/p&gt;\n&lt;h4 id=\"ree-kam-uchraydigan-va-ekstremal-hodisalar-ga-sezgirlik-tahlili\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#ree-kam-uchraydigan-va-ekstremal-hodisalar-ga-sezgirlik-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;REE (kam uchraydigan va ekstremal hodisalar) ga sezgirlik tahlili&lt;/span&gt;&lt;/a&gt;REE (kam uchraydigan va ekstremal hodisalar) ga sezgirlik tahlili&lt;/h4&gt;\n&lt;p&gt;Mualliflar umumiy sezgirlik va bir tomonlama sezgirlik (yo'qotishlardan qochish moyilligi) o'rtasidagi bog'liqlikni o'rgandilar. Eng sezgir 16 ta kalamushda ijobiy korrelyatsiya aniqlandi: REE ga kuchliroq javob beradigan hayvonlar «qora oqqushlar»dan (o'ta salbiy hodisalar) kamroq qochishga moyil bo'lib, bu ularning tavakkalchilik strategiyasini o'zgartirayotganini ko'rsatadi. Bu bog'liqlik vaqt o'tishi bilan kuchayadi, bu esa o'qitish jarayonida korrelyatsiya koeffitsiyentining 0,17 dan 0,64 gacha o'sishi bilan tasdiqlanadi.&lt;/p&gt;\n&lt;h4 id=\"mukofot-izlash-va-jazodan-qochishning-xulq-atvor-korsatkichlari\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#mukofot-izlash-va-jazodan-qochishning-xulq-atvor-korsatkichlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mukofot izlash va jazodan qochishning xulq-atvor ko'rsatkichlari&lt;/span&gt;&lt;/a&gt;Mukofot izlash va jazodan qochishning xulq-atvor ko'rsatkichlari&lt;/h4&gt;\n&lt;p&gt;Rasm 2 da mualliflar kalamushlarning ikki fenotipini solishtiradilar: «ko'k» (REE ga yuqori sezgirlik va «qora oqqushlar»dan qochish) va «yashil» (neytral xulq-atvor). Chap panel «ko'k» fenotipning salbiy oqibatlardan tez-tez qochishini ko'rsatsa, o'ng panel ularning «jekpot» (kam uchraydigan mukofotlar) olishga bo'lgan yuqori motivatsiyasini namoyish etadi. Guruhlar o'rtasidagi farqlar Uilkoxon testi bo'yicha statistik jihatdan ahamiyatli (p &amp;lt; 0,01).&lt;/p&gt;\n&lt;h4 id=\"qora-oqqush-oqibatlari-ree-ga-sezgirlikni-kuchaytiradi,-jekpotlar-esa-yoq\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#qora-oqqush-oqibatlari-ree-ga-sezgirlikni-kuchaytiradi,-jekpotlar-esa-yoq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;«Qora oqqush» oqibatlari REE ga sezgirlikni kuchaytiradi, «jekpot»lar esa yo'q&lt;/span&gt;&lt;/a&gt;«Qora oqqush» oqibatlari REE ga sezgirlikni kuchaytiradi, «jekpot»lar esa yo'q&lt;/h4&gt;\n&lt;p&gt;Rasm 4 da mualliflar kam uchraydigan hodisaga duch kelgunga qadar va undan keyin kalamushlar xulq-atvoridagi o'zgarishlarni tahlil qiladilar. «Jekpot» olish tanlov strategiyasini deyarli o'zgartirmasligi aniqlandi. Aksincha, «qora oqqush» bilan to'qnashuv REE ga umumiy sezgirlikni tizimli ravishda kuchaytiradi va yo'qotishlardan qochish istagini oshiradi. Bu shuni ko'rsatadiki, salbiy kam uchraydigan hodisalar qaror qabul qilish jarayoniga ijobiy hodisalarga qaraganda ancha kuchliroq ta'sir qiladi va hayvonlarda o'ta ehtiyotkorlik strategiyasini mustahkamlaydi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f4.jpg\" alt=\"Figure 4 summarizes these within-session dynamics. For each rat (color-coded as in Fig-\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 4 summarizes these within-session dynamics. For each rat (color-coded as in Fig-&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"q-learning-models-require-specific-ree-decision-weights-to-mimic-rats-behavior\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#q-learning-models-require-specific-ree-decision-weights-to-mimic-rats-behavior\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q-Learning models require specific REE decision weights to mimic rats’ behavior&lt;/span&gt;&lt;/a&gt;Q-Learning models require specific REE decision weights to mimic rats’ behavior&lt;/h4&gt;\n&lt;p&gt;Mualliflar kalamushlarning xatti-harakatlarini taqlid qilish uchun noyob va o‘ta ekstremal hodisalarga (REE) — “Qora oqqushlar” va yirik yutuqlarga (“jekpotlar”) sezgirlikni o‘z ichiga olgan yangi turdagi kengaytirilgan kuchaytirilgan o‘qitish (Reinforcement Learning) modellarini taklif qilishdi. Asosiy maqsad ushbu o‘zgartirilgan algoritmlar eksperimental hayvonlarning tanlovlarini qanchalik aniq aks ettirishini baholashdan iborat edi. Har bir kalamush uchun kuzatilgan tanlov va natijalar asosida model parametrlari hisoblab chiqildi.&lt;/p&gt;\n&lt;p&gt;Tanlangan modelning asosiy o‘ziga xos xususiyati shundaki, u qaror qabul qilish jarayonida maxsus vaznlar orqali odatiy natijalarni kam uchraydigan va ekstremal natijalardan ajratib turadi. Olingan natijalarga ko‘ra, REE ga bunday sezgirlikni qo‘shish modelning eksperimental kuzatuvlarga juda mos kelishini ta’minladi, holbuki REE ni hisobga olmaydigan standart Q-learning modeli deyarli barcha kalamushlar uchun rad etildi. To‘rtta mavjud variantning har biri uchun mualliflar yutuq va yo‘qotish quyi qiymatlarini kiritib, ular maxsus formulalar yordamida yangilab borilishini ko‘rsatib berishdi.&lt;/p&gt;\n&lt;h4 id=\"variantlar-qiymati-va-kam-uchraydigan-ota-ogir-hodisalar-ree-vaznlarini-modellashtirish\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#variantlar-qiymati-va-kam-uchraydigan-ota-ogir-hodisalar-ree-vaznlarini-modellashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Variantlar qiymati va kam uchraydigan o'ta og'ir hodisalar (REE) vaznlarini modellashtirish&lt;/span&gt;&lt;/a&gt;Variantlar qiymati va kam uchraydigan o'ta og'ir hodisalar (REE) vaznlarini modellashtirish&lt;/h4&gt;\n&lt;p&gt;Mualliflar standart Q-o'rganish algoritmini kengaytirgan holda, har bir mavjud tanlovning qiymatini baholash uchun rasmiy modelni ishlab chiqdilar. (2)-tenglama ikkita asosiy komponentni jamlaydi: yutuq va mag'lubiyatning vaznli quyi qiymatlari (λ_g va λ_l parametrlari bilan) hamda indikator funksiyalari 1JP(o) va 1BS(o) hamda γ_g va γ_l koeffitsiyentlari yordamida \"jekpotlar\" va \"qora oqqushlar\"ga bo'lingan kam uchraydigan o'ta og'ir hodisalar (REE) uchun maxsus vaznlar. Har bir harakatni tanlash ehtimolligi Softmax funksiyasi (multinomial Logit modeli) orqali hisoblandi. Asosiy model γ_g va γ_l uchun nol qiymatlarni nazarda tutgan bo'lsa, kengaytirilgan modellar hayvonlar kam uchraydigan hodisalarga alohida e'tibor qaratib, ularni odatiy mukofotlardan alohida qayta ishlashi haqidagi gipotezani sinovdan o'tkazdi.&lt;/p&gt;\n&lt;h4 id=\"1-jadval-boyicha-modellarni-taqqoslash-va-fenotiplarning-taqsimlanishi\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#1-jadval-boyicha-modellarni-taqqoslash-va-fenotiplarning-taqsimlanishi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1-jadval bo'yicha modellarni taqqoslash va fenotiplarning taqsimlanishi&lt;/span&gt;&lt;/a&gt;1-jadval bo'yicha modellarni taqqoslash va fenotiplarning taqsimlanishi&lt;/h4&gt;\n&lt;p&gt;Modellarni moslashtirish jarayonida tadqiqotchilar sakkiztagacha erkin parametrni, jumladan, yutuq va mag'lubiyat uchun o'rganish va unutish tezligini, shuningdek REE vaznlarini baholadilar. 1-jadvalda keltirilgan axborot mezonlari asosida taqqoslash 20 ta hayvondan 17 tasida tanlov maxsus γ_g va γ_l vaznlari bilan belgilanishini ko'rsatdi. Ko'pchilik kalamushlar o'z qarorlarini shakllantirish uchun ushbu koeffitsiyentlarga tayanadi. Faqatgina kamchilik kalamushlar REE ni ham quyi qiymatlarga, ham qaror vaznlariga kiritadi, uchta kalamush esa maxsus REE vaznidan foydalanmaydi. Mualliflar buni hayvonlar kam uchraydigan o'ta og'ir hodisalarni odatiy mukofotlarga qaraganda sifat jihatidan farqli ravishda qabul qilishining isboti sifatida talqin qiladilar.&lt;/p&gt;\n&lt;h4 id=\"kam-uchraydigan-ota-ogir-yoqotishlar-va-yutuqlarga-nisbatan-asimmetrik-xulq-atvor-reaksiyalari\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#kam-uchraydigan-ota-ogir-yoqotishlar-va-yutuqlarga-nisbatan-asimmetrik-xulq-atvor-reaksiyalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kam uchraydigan o'ta og'ir yo'qotishlar va yutuqlarga nisbatan asimmetrik xulq-atvor reaksiyalari&lt;/span&gt;&lt;/a&gt;Kam uchraydigan o'ta og'ir yo'qotishlar va yutuqlarga nisbatan asimmetrik xulq-atvor reaksiyalari&lt;/h4&gt;\n&lt;p&gt;Bo'lakning yakuniy qismida har bir kalamush uchun 41 sessiya davomida o'rtacha hisoblangan o'ta og'ir stimullarga reaksiyalar asimmetriyasining xulq-atvor namoyon bo'lishi muhokama qilinadi. Haqiqiy kuzatilgan sezgirliklarni (Rasm 2 ning mantiqini davom ettiruvchi yuqori panel), tanlangan modellardan olingan bashorat qilingan qiymatlarni (pastki chap panel) va sun'iy sessiyalar bo'yicha simulyatsiyalarni (pastki o'ng panel) solishtirish modelning yuqori aniqligini ko'rsatadi. Olingan natijalar hayvonlarning kam uchraydigan yirik yutuqlar va yo'qotishlarga duch kelganda xulq-atvorda yaqqol namoyon bo'ladigan asimmetriyani ko'rsatishini tasdiqlaydi va bu taklif etilgan yondashuv doirasida γ_g va γ_l parametrlari yordamida muvaffaqiyatli qamrab olinadi.&lt;/p&gt;\n&lt;h4 id=\"natijalar-va-talqin\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#natijalar-va-talqin\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar va talqin&lt;/span&gt;&lt;/a&gt;Natijalar va talqin&lt;/h4&gt;\n&lt;p&gt;Mualliflar avvalo tajribadagi barcha kalamushlar kamdan-kam uchraydigan hodisalarga (REE) nisbatan qandaydir darajada sezgirlik ko‘rsatishini, aksariyat hayvonlarda bu ko‘rsatkich o‘rta yoki yuqori ekanligini aniqladilar. Ikkinchidan, tadqiqotchilar ustun xulq-atvor fenomenotipini aniqladilar: kemiruvchilar \"qora oqqushlar\"dan (salbiy nodir hodisalar) deyarli to‘liq qochishdi va \"djekpotlar\"ga (ijobiy nodir hodisalar) qisman intilishdi. Bu natijalar salbiy va ijobiy nodir stimullarga nisbatan javob qaytarishdagi fundamental assimetriya sifatida talqin qilinadi.&lt;/p&gt;\n&lt;p&gt;Mumkin bo‘lgan cheklovlarni muhokama qilar ekan, mualliflar to‘laqonli djekpotga intilmaslikda to‘yish effekti ta'sirini butunlay inkor etib bo‘lmasligini, biroq tadqiqotchilar hayvonlarning uni qidirishni butunlay to‘xtatgan holatlarini kuzatmaganliklarini ta'kidlaydilar. Nodir natijalar har bir seansdagi 10- yoki 60-faollashuvga to‘g‘ri kelishi rejalashtirilgani sababli (Qo‘shimcha materiallardagi S1-jadvalga qarang), hayvonlar bu qonuniyatni o‘rganib chiqqanmi yoki yo‘qmi degan savol tug‘iladi. Agar kemiruvchilar ushbu intervalni haqiqatan ham o‘zlashtirgan bo‘lsa, ularning tanlov strategiyasi ancha maqbul bo‘lar edi.&lt;/p&gt;\n&lt;p&gt;Xususan, djekpotni taqdim etuvchi variantlar tez-tez uchraydigan foydani maksimal darajada oshirish nuqtai nazaridan optimal emas, shuning uchun hayvonlar ularni faqat 10- va 60-urinishlar atrofida tanlagan bo‘lar edi. Ularning qolgan ko‘pchilik tanlovlari tez-tez uchraydigan sohada ko‘proq foyda keltiradigan variantlarga qaratilishi kerak edi. Biroq amalda kuzatilgan xulq-atvor bundan farq qiladi.&lt;/p&gt;\n&lt;h4 id=\"nodir-hodisalarning-asimmetriyasi-va-xulq-atvor-strategiyalari\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#nodir-hodisalarning-asimmetriyasi-va-xulq-atvor-strategiyalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nodir hodisalarning asimmetriyasi va xulq-atvor strategiyalari&lt;/span&gt;&lt;/a&gt;Nodir hodisalarning asimmetriyasi va xulq-atvor strategiyalari&lt;/h4&gt;\n&lt;p&gt;Mualliflar salbiy ekstremal hodisalardan (qora oqqushlardan) qochish hamda ixtiyoriy yirik yutuqlarni (jekpotlarni) qo‘lga kiritishga intilish o‘rtasidagi fundamental tafovutni tahlil qiladilar. Tajriba sharoitida kalamushlar ma'lum qavariq yo‘qotish jadvallarini tanlash orqali ulkan zararlardan butunlay qochishi mumkin edi, biroq nodir voqealarning estohastik tabiati tufayli jekpot kafolatlanmasdi (masalan, 150 ta urinishda ehtimolligi 1% bo‘lgan kamyob hodisaning yuzaga kelish ehtimolligi taxminan 78% ni tashkil etib, nolinchi natija ehtimolini ham qoldiradi). Bu asimmetriya hayvonlarni tavakkallarni turlicha baholashga majbur qiladi: tez-tez uchraydigan kichik yutuqlar «mo‘rt» variantni jozibali qiladi, ammo qora oqqushlardan qochish strategiyasi umumiy stoxastik ustunlikni ta'minlaydi. Aksincha, faqat jekpot ketidan quvish o‘zini o‘sh oqlamaydi, chunki doimiy kichik yo‘qotishlar o‘ta mukofot bilan qoplanmaydi, shuning uchun qisman yondashuv maqbul bo‘lib chiqadi.&lt;/p&gt;\n&lt;h4 id=\"kalamushlarning-organishi-va-fazoviy-hamda-vaqtinchalik-effektlarning-yoqligi\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#kalamushlarning-organishi-va-fazoviy-hamda-vaqtinchalik-effektlarning-yoqligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kalamushlarning o‘rganishi va fazoviy hamda vaqtinchalik effektlarning yo‘qligi&lt;/span&gt;&lt;/a&gt;Kalamushlarning o‘rganishi va fazoviy hamda vaqtinchalik effektlarning yo‘qligi&lt;/h4&gt;\n&lt;p&gt;Empirik natijalar shuni ko‘rsatadiki, «ko‘k» kalamushlar qora oqqushlardan qochish va jekpotlarga erishish uchun mustahkam hamda antifragil variantlarni birlashtirib, bu mantiqni o‘zlashtirgan, «yashil» kalamushlar esa tavakkal qilishda davom etgan. Hayvonlar xulq-atvorida moslashuvchanlikni ko‘rsatgani sababli, tadqiqotchilar fazoviy xayrixohlik ta'sirini istisno qilishdi. Garchi dastlabki mashg‘ulot teshigi antifragil variantga moslashtirilgan va nodir voqealar 10- va 60-urinishlarga belgilangan bo‘lsa-da, kalamushlar muayyan vaqtga bog‘lanib qolishmadi, bu ularning barcha variantlarni mustaqil ravishda o‘rganib chiqqanini isbotlaydi.&lt;/p&gt;\n&lt;h4 id=\"stoxastik-ustunlikni-ozlashtirish-tezligi\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#stoxastik-ustunlikni-ozlashtirish-tezligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Stoxastik ustunlikni o‘zlashtirish tezligi&lt;/span&gt;&lt;/a&gt;Stoxastik ustunlikni o‘zlashtirish tezligi&lt;/h4&gt;\n&lt;p&gt;Nazariy jihatdan hayvonlar tez-tez sodir bo‘ladigan natijalar sohasida stoxastik ustunlikni tezda aniqlashi kerak, ammo amalda bu ko‘p sessiyalarni talab qiladi. Mualliflar buni taqsimotni to‘g‘ri baholash uchun hayvonlar nodir hodisalar hali yuz bermaganligiga ishonch hosil qilishlari va ularni ehtimollik modelidan chiqarib tashlashlari uchun ulkan tajriba kerakligi bilan izohlaydilar.&lt;/p&gt;\n&lt;h4 id=\"the-augmented-q-learning-models-suggest-a-specific-neural-pathway-for-ree-encoding\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#the-augmented-q-learning-models-suggest-a-specific-neural-pathway-for-ree-encoding\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;The augmented Q-learning models suggest a specific neural pathway for REE encoding&lt;/span&gt;&lt;/a&gt;The augmented Q-learning models suggest a specific neural pathway for REE encoding&lt;/h4&gt;\n&lt;p&gt;Mualliflar olingan natijalarni istiqbollar nazariyasi, yo'qotishdan qochish va noaniqlik nuqtai nazaridan tahlil qiladilar. Tajriba shuni ko'rsatdiki, kalamushlar kam uchraydigan ekstremal hodisalarga (REE) nisbatan noaniqlikni kamaytirish strategiyasini qo'llaydi: ular \"Qora oqqushlar\"dan qochib, \"Jekpot\"larga qisman qiziqish bildirishda davom etadilar. Klassik Q-modellari bu xulq-atvorni tushuntira olmadi, ammo REE ga nisbatan sezgirlikni o'z ichiga olgan o'zgartirilgan Q-modellari γl parametri yordamida natijalarni aniq tikladi.&lt;/p&gt;\n&lt;p&gt;Kengaytirilgan Q-modellarning yuqori aniqligiga asoslanib, tadqiqotchilar yangi neyrobiologik gipotezani ilgari suradilar. Tahlillar shuni ko'rsatdiki, \"ko'k\" guruhdagi 13 ta kalamush odatiy REE ni Q-qiymatlarini yangilashdan istisno qiladi, lekin salbiy γl parametri orqali ayniqsa \"Qora oqqushlar\"ga nisbatan maxsus sezgirlikni ko'rsatadi. Bu shuni anglatadiki, hayvonlar variantlarni baholashda bunday ekstremal zararlarni o'rtacha qiymatga kiritmaydi, balki xavfli yo'llarning subyektiv qiymatini pasaytiradigan alohida og'irlik koeffitsientidan foydalanadi.&lt;/p&gt;\n&lt;h4 id=\"insonlar-uchun-ahamiyati\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#insonlar-uchun-ahamiyati\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Insonlar uchun ahamiyati&lt;/span&gt;&lt;/a&gt;Insonlar uchun ahamiyati&lt;/h4&gt;\n&lt;p&gt;Mualliflar kalamushlarda olingan natijalarni odamlardagi idrok va xotira xususiyatlari bilan qiyoslaydilar, bu yerda kam uchraydigan va ekstremal ta'sirlar ham yuqori ahamiyat kasb etadi. Bunday nodir voqealarni (REE) qayta ishlash odatiy mukofotlar uchun javob beradigan klassik dopaminergik yo'llardan farq qiluvchi maxsus neyron tarmoqlariga tayanishi mumkinligi muhokama qilinadi.&lt;/p&gt;\n&lt;p&gt;Tadqiqotda ta'kidlanishicha, oldingi orolcha va murtaksimon tana kabi miya tuzilmalari emotsional ahamiyat va oldindan aytib bo'lmaydigan natijalarni qayta ishlashdagi roli tufayli ekstremal yo'qotishlar va yutuqlarni hisobga olish uchun javobgar bo'lishi mumkin. Hisoblash nuqtai nazaridan, ekstremal chetlanishlarni umumiy ma'lumotlardan ajratish baholashdagi xatoliklarning oldini oladi, bu esa o'zgaruvchan muhitda ustunlik beradi va kelgusidagi neyroilmiy tadqiqotlar uchun yangi yo'nalishlarni ochadi.&lt;/p&gt;\n&lt;h4 id=\"animalsubjects\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#animalsubjects\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AnimalSubjects&lt;/span&gt;&lt;/a&gt;AnimalSubjects&lt;/h4&gt;\n&lt;p&gt;Ushbu bo'limda tadqiqotda qo'llanilgan biologik modellar tasvirlangan. Tajriba uchun umumiy hisobda 20 ta voyaga yetgan Lister Hooded zotiga mansub erkak kalamushlar olindi. Ularning kelish vaqtidagi vazni taxminan 200 grammni tashkil etdi. Hayvonlar maxsus qafaslarda juft-juftidan saqlanib, qat'iy nazorat qilinadigan mikroklimat va teskari yorug'lik siklida boqildi.&lt;/p&gt;\n&lt;p&gt;Sinovlar davomida motivatsiyani ushlab turish maqsadida kemiruvchilarning ozuqa ratsioni kundalik me'yorining 80 foizigacha cheklandi, suv esa cheklanmagan miqdorda berildi. Hayvonlarni saqlash va ular bilan ishlash bo'yicha barcha muolajalar Fransiya qonunchiligiga qat'iy amal qilgan holda bajarildi va mahalliy etika qo'mitasi tomonidan ma'qullandi.&lt;/p&gt;\n&lt;h4 id=\"apparatus\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#apparatus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Apparatus&lt;/span&gt;&lt;/a&gt;Apparatus&lt;/h4&gt;\n&lt;p&gt;Ushbu qism tajriba uchun zarur bo'lgan texnik jihozlarga bag'ishlangan, garchi keltirilgan parchada matn uning sarlavhasida tugagan bo'lsa ham. Uskunalar hayvonlarda kam uchraydigan ekstremal hodisalardan qochish va yirik mukofotlarni qidirish strategiyalarini baholash vazifalarini bajarish uchun maxsus loyihalashtirilgan.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f3.jpg\" alt=\"Figure 3 reports more intuitive behavioral metrics: the proportion of choices that (i)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 3 reports more intuitive behavioral metrics: the proportion of choices that (i)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f5.jpg\" alt=\"Figure 5: Total Sensitivity to REE (y-axis) against One-sided Sensitivity to REE (x-\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 5: Total Sensitivity to REE (y-axis) against One-sided Sensitivity to REE (x-&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;nodir&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ekstremal&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;hodisalarni&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;o‘rganish&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;to‘rt qadamli&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tanlov testi&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;va model&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;NATIJA&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qora qushlarni&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;chetlab o‘tib&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;yutuqni&lt;/text&gt;&lt;text x=\"4
