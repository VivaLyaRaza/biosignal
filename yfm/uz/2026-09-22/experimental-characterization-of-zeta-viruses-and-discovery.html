        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"274\" cy=\"127\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"526\" cy=\"282\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · MICROBIOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Olimlar kodlovchi halqasimon&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;RNK larning mavjudligini&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;birinchi marta isbotladilar&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-f1.jpg\" alt=\"1-rasm. Zeta-viruslarning struktur xususiyatlari. (A) ZV1, ZV2 va ZV3 RNKlarning minimal erkin energiya ikkilamchi struk\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. Zeta-viruslarning struktur xususiyatlari. (A) ZV1, ZV2 va ZV3 RNKlarning minimal erkin energiya ikkilamchi strukturasining doiraviy grafigi. RNK genomi ichidagi bashorat qilingan juftlashish o'zaro ta'sirlari yoylar bilan ko'rsatilgan bo'lib, ularning ranglari (oqdan to'q qizil ranggacha) mahalliy erkin energiya hissasi (kkal/mol) sifatida ifodalangan asosiy juftlik barqarorligini aks ettiradi. (+) va (-) bolgachasimon ribozimlarning (HHRz) nisbiy o'rinlari mos ravishda binafsha va to'q sariq ranglarda ko'rsatilgan. ORF A ((+) zanjir) va ORF B ((-) zanjir) mos ravishda ko'k va yashil ranglarda ko'rsatilgan, uchburchaklar esa mos keluvchi boshlang'ich kodonlarni bildiradi. (B) ZV1, ZV2 va ZV3 ning (+) (chapda) va (-) (o'ngda) HHRz larning ikkilamchi strukturasi. Uzilish joyi strelka bilan belgilangan va katalitik yadro ichidagi konservativ nukleotidlar qora fon bilan ajratib ko'rsatilgan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Olimlar ilk bor zeta-viruslar mavjudligini tajribada tasdiqladilar va yangi turdagi betaviroidsimon RNK larni kashf etdilar. Bu halqasimon molekulalar oqsil kodlash qobiliyatiga ega bo'lib, DNK ishtirokisiz ko'payadi va simmetrik replikatsiyadan foydalanadi. Metatranskriptomik tahlillar ularning tuproq va botqoqliklarda keng tarqalganini ko'rsatdi. Bu kashfiyot halqasimon RNK replikonlarining xilma-xilligini sezilarli darajada kengaytiradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Zeta-viruslarning mavjudligi tuproq namunalarida isbotlandi.&lt;/li&gt;\n&lt;li&gt;Yangi betaviroidsimon kodlovchi RNK lar guruhi kashf etildi.&lt;/li&gt;\n&lt;li&gt;DNK ishtirokisiz simmetrik replikatsiya jarayoni tasdiqlandi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Viroidsimon RNK lar o'z-o'zini kesuvchi ribozimga ega bo'lgan halqasimon genomli infeksion agentlardir. Yangi tadqiqot zeta-viruslarning mavjudligini tajribada isbotlagan birinchi ish bo'ldi va yangi betaviroidsimon RNK sinfini ochdi. Olimlar tuproqdan uchta yangi zeta-virusni aniqlab, ulardan birini laboratoriyada to'liq o'rgandilar.&lt;/p&gt;\n&lt;p&gt;Tadqiqotchilar har ikki polyar ipning mavjudligini, DNK shakllari yo'qligini va ribozimlar faolligini tasdiqladilar. Shuningdek, 16 ta zeta-virus turli ribozimlarga egaligi aniqlandi. Bu natijalar ularning tabiatda keng tarqalganini va simmetrik halqasimon replikatsiyadan foydalanishini ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot preprint bo'lib, ularning aniq xo'jayin organizmlari va biologik ta'siri hali to'liq o'rganilmagan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Ushbu tadqiqot oqsil kodlash qobiliyatiga ega bo'lgan viroidsimon RNKlarning ikkita yangi guruhi mavjudligini isbotlab, ushbu yuqumli agentlarning xilmaxilligi va murakkabligini sezilarli darajada kengaytiradi. Viroidsimon RNKlarning halqali RNK genomlari, ixcham ikkilamchi tuzilmalar va ikkala qutblanish zanjirida faol ishlaydigan o'z-o'zini parchalovchi ribozimlar kabi xarakterli xususiyatlariga ega bo'lish bilan bir қаtorda, bu molekulalar ikkala zanjirda ham oqsil kodlash salohiyatiga ega bo'lib, bu salohiyat hatto genom RNK uzunligidan ham oshib ketadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot birinchi marta zeta-viruslar va betaviroidsimon RNKlaming mavjudligini eksperimental tasdiqladi, ularda replikatsiya va oqsil kodlovchi ketma-ketliklar bir xil genom hududlarida birlashgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Replikatsiya bilan bog'liq RNK motivlari va oqsil kodlovchi ketma-ketliklarning bir xil genom hududlarida birgalikda mavjudligi genetik ma'lumotlarning g'ayrioddiy darajada zich siqilganligini ko'rsatadi va genom tashkil etilishining ilgari noma'lum bo'lgan strategiyasini ochib beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;O'z-o'zini parchalovchi ribozimlar — bu oqsil-fermentlar yordamisiz o'z zanjirini o'zi qirqib bera oladigan RNK bo'laklari bo'lib, ular agentlarning ko'payishida hal qiluvchi rol o'ynaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Shu bilan birga, ushbu topilmalar ushbu RNKlarning kelib chiqishi, evolyutsiyasi, ekspressiyasi va biologik rollari, shuningdek, shunday o'ta ixcham genom me'morchiligini shakllantirgan selektiv bosimlar haqida muhim savollarni o'rtaga tashlaydi.&lt;/p&gt;\n&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Viroidsimon RNKlar (vdlRNAs) bir zanjirli halqasimon RNK genomiga ega bo‘lib, zich asos juftlashgan ikkilamchi tuzilmani hosil qiluvchi yuqumli agentlar guruhidir. Ularning ko‘payishi odatda halqasimon replikatsiya mexanizmi orqali RNK oraliq mahsulotlari vositasida va xo‘jayin hujayra fermentlari yordamida amalga oshiradi. Ayrim hollarda ularda replikatsiya oraliqlarini aniq kesishni katalizlovchi o‘z-o‘zidan parchalanuvchi ribozimlar mavjud. Guruhiga qarab, vdlRNKlar kodlamaydigan bo‘lishi yoki replikatsiya yoki hayot siklining boshqa jihatlarida rol o‘ynaydigan taxminiy oqsillarni kodlovchi bir nechta ochiq o‘qish рамкалариni (ORF) o‘z ichiga olishi mumkin. Ushbu keng toifa genom hajmi, xo‘jayin doirasi va replikatsiya strategiyasi bilan farqlanuvchi ko‘plab agentlarni o‘z ichiga oladi. Viroidsimon RNKlar orasida viroidlar eng kichik yuqumli agentlar bo‘lib, taxminan 200–450 nukleotidni (nt) tashkil etadi, halqasimon kodlamaydigan RNKlardan iborat bo‘lib, avtonom tarzda ko‘payadi va o‘simliklarni tizimli ravishda zararlaydi. Viroidsimon yo‘ldosh RNKlar tuzilishi jihatidan viroidlarga o‘xshaydi va o‘simliklarni zararlaydi, biroq yuqumliligi uchun yordamchi virusga muhtoj.&lt;/p&gt;\n&lt;p&gt;Gepatit delta virusi (HDV) va deltavirusga o‘xshash RNKlar viroidlar hamda yo‘ldosh RNKlarga nisbatan kattaroq halqasimon genomlarga (taxminan 1200–2000 nt) ega bo‘lib, delta antigen yoki delta-o‘xshash oqsillarni kodlaydi va odamlar hamda boshqa hayvonlarni zararlaydi. Viroidsimon elementlarning yana bir guruhi retrozimlar va retroviroidlardir, biroq ular yuqumli emas va hayvon yoki o‘simlik xo‘jayin genomiga integratsiyalashgan DNK ekvivalentiga ega. Yaqinda o‘tkazilgan metatranskriptomik tahlillar vdlRNKlar avval o‘ylanganidan ko‘ra kengroq tarqalganini va zamburug‘lar hamda bakteriyalarda ham uchrashini ko‘rsatdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Metatranskriptomika — bu tabiatdan bevosita olingan barcha RNK molekulalarini keng miqyosda tahlil qilish usuli bo‘lib, u laboratoriyada oldindan o‘stirmasdan turib yangi virus genomlarini topishga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"yangi-viroidsimon-agentlar-va-ularning-xossalari\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#yangi-viroidsimon-agentlar-va-ularning-xossalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yangi viroidsimon agentlar va ularning xossalari&lt;/span&gt;&lt;/a&gt;Yangi viroidsimon agentlar va ularning xossalari&lt;/h4&gt;\n&lt;p&gt;Yaqinda tavsiflangan vdlRNKlar guruhiga faqat in silico aniqlangan zeta viruslari kiradi. Hozirgi kungacha atrof-muhit va umurtqasizlarga oid namunalar bo‘yicha metatranskriptomik ma'lumotlar bazalaridan taxminan 311 ta zeta virus ketma-ketligi aniqlangan, garchi ularning haqiqiy xo‘jayinlari noma'lum bo‘lsa-da va ularning mavjudligiga doir eksperimental dalillar taqdim etilmagan. Zeta viruslari halqasimon RNKlar (324–789 nt) bo‘lib, tayoqchasimon ikkilamchi tuzilmalarni hosil qilishi taxmin qilinadi. Ushbu guruhning muhim xususiyati shundaki, ularning genomik RNKsi uchga karrali nukleotidlar sonidan iborat bo‘lib, har bir qutbiy zanjirda butun genomni qamrab oluvchi va to‘xtash kodonlariga ega bo‘lmagan bittadan ORFni kodlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqotda zeta virusining ilk eksperimental identifikatsiyasi va molekulyar tavsifi taqdim etilib, har bir zanjirda ribozim va ORFga ega betaviroidsimon RNKlar ochildi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu ishda zeta virusining ilk eksperimental identifikatsiyasi va molekulyar tavsifini taqdim etuvchi ma'lumotlar keltirilgan. Qolaversa, har bir qutb zanjirida ham ribozim, ham ORF mavjudligi bilan ajralib turadigan, betaviroidsimon RNKlar deb nomlangan yangi kodlovchi vdlRNKlar guruhi tavsiflangan. E'tiborlisi, ORF monomerik RNK molekulasi ichida ramka ichidagi tugatish kodoniga ega emas. Buning o‘rniga, translatsiyani to‘xtatish faqat taxminiy multimerik RNK replikatsiya oraliq mahsulotidagi ramka siljishi hodisasidan keyin yoki halqasimon RNKning takroriy translatsiyasi orqali yuzaga keladi. Ikkala ssenariyda ham hosil bo‘luvchi kodlovchi ketma-ketlik monomerik vdlRNK genomining uzunligidan oshib ketadi. Tabiatda betaviroidsimon RNKrlarning mavjudligini qo‘llab-quvvatlovchi ma'lumotlar ham ko‘rsatilgan va muhokama qilingan.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"yangi-zeta-viruslarni-aniqlash-va-tavsiflash\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#yangi-zeta-viruslarni-aniqlash-va-tavsiflash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yangi zeta-viruslarni aniqlash va tavsiflash&lt;/span&gt;&lt;/a&gt;Yangi zeta-viruslarni aniqlash va tavsiflash&lt;/h4&gt;\n&lt;p&gt;Ribozim saqlovchi RNKlarni aniqlash uchun INFERNAL algoritmi (16) yordamida tuproqdan olingan oltita RNAseq kutubxonasidan uchtasida (C30, C105 va C110) mos ravishda 109, 32 va 17 ta contiglar (taxminiy vdlRNKlarga mos keluvchi) aniqlandi. Ushbu contiglar orasidan keyingi tavsiflash uchun zeta-viruslarning xarakterli belgilariga ega bo'lgan uchtasi tanlab olindi. C105 va C110 kutubxonalaridan olingan NODE_21658 (647 nt uzunlik; 3.67 qamrov) va NODE_1090 (721 nt uzunlik; 11.18 qamrov) contiglari ZV1 deb nomlangan 600 nt li bir xil taxminiy halqasimon RNKga mos keladi (1A-rasm). C30 kutubxonasidan olingan NODE_198789 (591 nt uzunlik; 22.62 qamrov) va NODE_416260 (447 nt uzunlik; 0.52 qamrov) contiglari mos ravishda ZV2 va ZV3 deb nomlangan 405 va 399 nt li ikkita taxminiy halqasimon RNKga mos keladi (1A-rasm). Ushbu RNKlarning o'zaro nukleotidlar ketma-ketligi o'xshashligi 52% dan 58.5% gacha bo'lib, BLAST qidiruvlariga ko'ra, ilgari xabar qilingan boshqa ketma-ketliklar bilan sezilarli o'xshashlik ko'rsatmadi. Har bir RNKning har bir qutbiy zanjirida III turdagi bolgachali ribozim (HHRz) mavjud bo'lib (1B-rasm), HHRz ketma-ketliklari bashorat qilingan tayoqsimon ikkilamchi tuzilishda juftlangan (1A-rasm). Keyingi ma'lumotlarga ko'ra (-) zanjirda joylashgan ZV1 ning bitta HHRz qismi saqlanib qolgan katalitik markazida mutatsiyaga ega (odatiy CUGA motivi CCGA bilan almashtirilgan).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;INFERNAL — bu strukturaviy RNKlarni qidirish uchun bioinformatik usul, III turdagi bolgachali ribozimlar (HHRz) esa o'zini o'zi kesish qobiliyatiga ega katalitik RNK qismlaridir.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Barcha bu vdlRNKlar har bir qutbiy zanjirda bitta ochiq o'qish рамкасини (ORF) saqlaydi, bunda har bir ORF ramka ichidagi stop-kodonlarsiz butun (halqasimon) genomni qamrab oladi. Natijada, ZV1, ZV2 va ZV3 ning har bir zanjiri taxminan mos ravishda 200, 135 va 133 aminokislotali (aa) ketma-ketlik birligining cheksiz tandem takroridan iborat oqsilni kodlaydi. Eukariotikdan boshqa genetik kodlardan foydalanilganda qo'shimcha ORF lar aniqlanmadi. Zaxiralangan halqasimon, tayoqsimon RNK ikkilamchi tuzilishi, juftlangan HHRzlarning mavjudligi va uchga karrali genom uzunligi (405, 399 va 600 nt) halqasimon RNKning taxminiy cheksiz tandem-takroriy oqsillarga uzluksiz tarjima qilinishini ta'minlab, zeta-viruslarning belgilovchi xususiyatlarini tashkil etadi.&lt;/p&gt;\n&lt;p&gt;Oltita taxminiy monomerik zeta-virus oqsillari bir-biri bilan 11.3% dan 24.8% gacha bo'lgan past aa ketma-ketlik o'xshashligini ko'rsatdi. AlphaFold 3 tomonidan bashorat qilingan monomerik zeta-virus oqsillarining uchinchi darajali tuzilmalari asosan α-spiral motiflarni ko'rsatdi (S1-rasm). Biroq, mos keladigan shablonli modellashtirish (pTM) ballari past bo'lib, 0.16 dan 0.24 gacha o'zgardi, bu strukturaviy modellarga ishonchning cheklanganligini ko'rsatadi (pTM &amp;lt; 0.5). Halqasimon yoki multimerik zeta-virus RNKlarining takroriy tarjimasi natijasida hosil bo'lishi mumkin bo'lgan dimer va trimer oqsillarning bashorat qilingan tuzilmalari ham asosan α-spiral motiflarni ko'rsatdi, ammo bu modellar ham past pTM ballariga ega edi (S1-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Zeta-viruslar 399, 405 va 600 nt uzunlikdagi genomlarga ega bo'lib, juftlangan HHRz ribozimlari va 3 ga karrali o'qish ramkalari orqali tandem takroriy oqsillarni kodlaydi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Zeta-virus genomlaridagi ketma-ketlik o'zgaruvchanligini baholash uchun HTS sekvenirlash ma'lumotlari tahlil qilindi. Ketma-ketlik o'zgaruvchanligi yuqori darajada cheklangan bo'lishi kutilgan edi, chunki genom bir vaqtning o'zida saqlanib qolgan RNK struktura xususiyatlarini, jumladan ixcham ikkilamchi tuzilish va o'zini kesuvchi ribozimlarni saqlashi hamda har ikki qutbiy zanjirda kodlash qobiliyatini qo'llab-quvvatlashi kerak. Qolaversa, tandem-takroriy oqsillarni kodlash potentsial qobiliyati genom uzunligi uchta nukleotidlarga karrali bo'lib qolishini talab qiladi.&lt;/p&gt;\n&lt;p&gt;C105 va C110 kutubxonalaridan mos ravishda jami 150 va 627 ta o'qishlar (reads) ZV1 ketma-ketligida xaritalandi. Moslashtirilgan o'qishlar tahlili C110 kutubxonasida 57.1% chastota bilan yagona polimorf saytni (137-pozitsiyadagi G&lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;C almashtirish) aniqladi (variant p-qiymati = 6.3 × 10⁻⁵). Ushbu nukleotid almashinuvi ikkita ORF tomonidan kodlangan taxminiy oqsillarning hech birida muddatidan oldin stop-kodonlarni keltirib chiqarmadi. Biroq, bu ORF A tomonidan kodlangan potentsial oqsilda konservativ bo'lmagan aminokislota almashtirilishiga (Triptofan &lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; Serin) va ORF B tomonidan kodlangan oqsilda konservativ almashtirilishiga (Glutamin &lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; Glutamin kislota) olib keldi. C30 kutubxonasida jami 508 ta o'qish ZV2 ketma-ketligida xaritalanib, ikkita polimorf saytni (mos ravishda va 16-pozitsiyalardagi G&lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;A va T&lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;A almashtirishlar) aniqlashga imkon berdi. Ushbu variantlar mos ravishda 69.1% (p-qiymati = 6.8 × 10⁻¹³⁰) va 35.6% (p-qiymati = 4.7 × 10⁻⁹²) chastotalarda sodir bo'ldi. G&lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;A mutatsiyasi ikkala bashorat qilingan oqsilda ham noconSERVATIVE aminokislota almashinishlariga sabab bo'lib, ORF A va ORF B mahsulotlarida Glinin &lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; Glutamin kislota va Prolin &lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; Serin o'zgarishlarini keltirib chiqardi. Xuddi shuningdek, T&lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;A almashinuvi ikkala taxminiy oqsilda ham turlicha aminokislota almashinishlariga, xususan ORF A da Triptofan &lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; Arginin va ORF B da Glutamin &lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; Leysingacha olib keldi. C30 kutubxonasidan faqat sakkizta o'qish ZV3 ketma-ketligiga xaritalandi va hech qanday polimorf saytlar aniqlnmadi, bu katta ehtimol bilan juda past sekvenirlash chuqurligi bilan bog'liq. Muhimi shundaki, tahlil qilingan vdlRNK larning hech birida nukleotidlar qo'shilishi yoki o'chirilishi aniqlanmadi, bu genom uzunligi va o'qish ramkasi yaxlitligining kuchli saqlanishini ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Ba'zi namunalar uchun past sekvenirlash chuqurligi (masalan, ZV3 uchun atigi 8 ta o'qish) o'zgaruvchanlik tahlilining aniqligini cheklaydi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Qo'shimcha tavsiflash uchun biz ZV1 ni model sifatida ishlatdik. ZV1 ni aniqlash uchun tuproq namunalaridan olingan RNK preparatlari tasodifiy praymerlar yordamida teskari transkripsiya qilindi, so'ngra halqasimon monomer va/yoki multimer shakllarni amplifikatsiya qilishga qodir bo'lgan qarama-qarshi qutbdagi ikkita qo'shni o'ziga xos praymerlar (ZetaV_1 va ZetaV_2, S1-jadval) bilan ПЦР-amplifikatsiya amalga oshirildi. ZV1 ning to'liq uzunlikdagi genomiga mos keladigan o'lchamdagi amplikon C105 va C110 tuproq namunalarining ikkalasidan ham olindi (2A-rasm). Amplifikatsiya qilingan kDNKlarni klonlash va Sanger usulida sekvenirlash ularning ketma-ketligi in silico aniqlangan ZV1 genomik RNKga mos kelishini tasdiqladi va uning mavjudligining eksperimental dalillarini taqdim etdi (ZV1 GenBank kirish raqami:&lt;/p&gt;\n&lt;h4 id=\"zv1-ning-dnk-ajdodiga-egaligi,-zanjir-polarligi-va-ribozim-faolligi\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#zv1-ning-dnk-ajdodiga-egaligi,-zanjir-polarligi-va-ribozim-faolligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ZV1 ning DNK-ajдоdiga эgaligi, zanjir polarligi va ribozim faolligi&lt;/span&gt;&lt;/a&gt;ZV1 ning DNK-ajдоdiga эgaligi, zanjir polarligi va ribozim faolligi&lt;/h4&gt;\n&lt;p&gt;ZV1 RNK DNK analogiga эga ekanligini aniqlash uchun C105 va C110 tuproq namunalaridan olingan кДНК va DNK preparatlari yordamida ZV1 ga xos bo'lgan ZetaV_184_3 va ZetaV_184_4 praymerlari yordamida (184 nt qismni ko'paytirishga mo'ljallangan) ПЦР-amplifikatsiya bajarildi. Avvalgi nashr etilgan ma'lumotlarga ko'ra ushbu namunalarda zamburug' DNKsi bo'lishi kutilganligi sababli, ijobiy nazorat sifatida universal ITS4/ITS5 zamburug' ITS praymerlari ishlatildi. Matritsa sifatida DNK olinganda ZV1 ga xos praymerlar bilan hech qanday amplifikatsiya mahsuloti aniqlanmadi, holbuki o'sha matritsada zamburug' praymerlari va кДНК preparatlarida ZV1 ga xos praymerlar yordamida kutilgan o'lchamdagi amplikonlar olindi (Rasm 2B). Bu natijalar ZV1 da DNK-ekvivalenti yo'qligini ko'rsatdi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-f2.jpg\" alt=\"2-rasm. Zeta-virus 1 ning (ZV1) molekulyar tavsifi. (A) C105 va C110 tuproq namunalaridan qarama-qarshi qutbdagi tutash \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm. Zeta-virus 1 ning (ZV1) molekulyar tavsifi. (A) C105 va C110 tuproq namunalaridan qarama-qarshi qutbdagi tutash primerlar yordamida genomik to'liq uzunlikdagi ZV1 ning RT-PCR amplifikatsiyasi. (B) DNK ekvivalenti yo'qligini tasdiqlash uchun maxsus primerlar (ZetaV_184_3 va ZetaV_184_4) hamda matritsa sifatida kDNK yoki DNK preparatlari yordamida ZV1 fragmentining (184 nt) ПЦР (PZR) amplifikatsiyasi (chapda). Zamburug'larning universal primerlari ITS4/ITS5 yordamida DNK preparatlarini PZR amplifikatsiyasi ijobiy nazorat sifatida ishlatilgan (o'ngda). (C) Shartli ravishda (+) qutblilik deb ataladigan eng ko'p tarqalgan ZV1 qutblilik zanjirini aniqlash uchun zanjirga xos RT va undan keyin yarim miqdoriy PZR. n.d., suyultirilmagan. M, Gene ruler DNA ladder mix DNK uzunligi markeri (Thermo Scientific). (D) In vitro transkripsiya natijasida hosil bo'lgan DNK matritsalari va monomerik RNK mahsulotlarining sxematik ko'rinishi. SpeI bilan kesilgan va T7 RNK-polimeraza bilan transkripsiya qilingan monomerik ZV1 ketma-ketligini o'z ichiga olgan plazmida ijobiy qutblilikdagi monomerik transkriptlarni (To'liq uzunlikdagi, FL) hosil qiladi; HHRz o'z-o'zidan uzilish faolligidan kelib chiqadigan kutilayotgan 5' va 3' fragmentlarning (5'F va 3'F) o'lchamlari ko'rsatilgan (chap tomon). NcoI bilan chiziqlashtirish va xuddi shu plazmidening SP6 RNK-polimeraza bilan transkripsiyasi salbiy qutblilikdagi monomerik transkriptlarni (FL) va ularning mos keladigan o'z-o'zidan uzilish 5'F va 3'F fragmentlarini hosil qiladi (o'ngda). Yashil rangda plazmida ketma-ketliklari; sariq rangda polimeraza promotri; ko'k rangda yo'nalishni ko'rsatuvchi strelkalar bilan ZV1 ketma-ketligi; strelka uchlari va qaychi o'z-o'zidan uzilish joylarining o'rnini belgilaydi. RNK fragmentlarining kutilayotgan o'lchamlari chap tomonda ko'rsatilgan. O'rta panelda musbat va manfiy ZV1 monomerlarining in vitro transkripsiya reaksiyasining PAGE tahlili ko'rsatilgan. M, RNK markeri (Low range ssRNA ladder, New England Biolabs), o'lchamlari (nt) chap tomonda ko'rsatilgan. (E) HHRz vositachiligidagi faollik natijasida hosil bo'lgan 3'F fragmentining 5' RACE yordamida o'z-o'zidan uzilish joyini (qizil strelka) aniqlash. (+) va (-) 3'F o'z-o'zidan uzilish fragmentlarining 5' RACE mahsulotlarining sekvenirlash elektroferogrammalari mos ravishda chapda, yuqori va pastki panellarda ko'rsatilgan. (+) va (-) HHRz ning o'z-o'zidan uzilish joylari (qizil strelka) (o'ngda) o'z-o'zidan uzilish 3'F fragmentlarining 5'RACE yordamida aniqlangan. Ribozimlarning ikkilamchi strukturalari o'ng tomonda ko'rsatilgan.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RT-PCR (teskari transkripsiya va zanjir reaksiya) — RNK molekulasini dastlab komplementar DNKga o'girib, so'ngra uning kerakli qismini ko'paytirib tahlil qilish imkonini beruvchi usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ikki xil RNK polarligi mavjudligini baholash hamda yuqori darajada to'planadigan zanjirga (+) polarlikni biriktirish uchun yarim miqdoriy RT-PCR bajarildi. Har bir polar zanjir ZetaV_1 yoki ZetaV_2 zanjirga xos praymerlar yordamida alohida teskari transkripsiya qilindi. Olingan кДНК ning bir nechta suyuqlantirishlari (suyuqlantirilmagan, 1:2, 1:10, 1:20) ZetaV_184_3 va ZetaV_184_4 praymerlari yordamida ПЦР orqali amplifikatsiya qilindi. Har ikki RNK polarligi amplifikatsiya qilindi va ZetaV_2 yordamida transkripsiya qilingan ZV1 RNK polarligining turg'un holatdagi darajasi sezilarli darajada yuqori ekanligi kuzatildi (Rasm 2C), shuning uchun u (+) polarlik zanjiri deb belgilandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Yarim miqdoriy RT-PCR natijalariga ko'ra, ZetaV_2 praymeri yordamida sintez qilingan zanjir ustunlik qilishi aniqlanib, u (+) polarlik deb e'lon qilindi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ZV1 bolgacha shaklidagi ribozimlarining o'z-o'zini parchalash faolligi har ikki polar zanjirning monomer genomik RNKsini in vitro transkripsiya qilish orqali baholandi. Ikkala holatda ham to'liq uzunlikdagi transkript va bolgacha shaklidagi ribozim vositasida o'z-o'zini parchalash natijasida hosil bo'lishi kutilgan ikkita mahsulot aniqlandi (Rasm 2D). Qolaversa, (+) va (-) HHRz ning aniq o'z-o'zini parchalash saytlari 5'-RACE tahlili yordamida tasdiqlandi, bu esa transkripsiya jarayonida ribozim faolligi bilan hosil qilingan 3'-parchalar kutilgan 5'-uchlarga egaligini ko'rsatdi (Rasm 2E). Umuman olganda, ushbu ma'lumotlar ZV1 ning bolgacha shaklidagi ribozimlari in vitro faol ekanligini tasdiqladi va simmetrik dumaloq halqa mexanizmi orqali репликация bo'lishini ko'rsatdi.&lt;/p&gt;\n&lt;h4 id=\"uchinchi-turdagi-bolgasimon-ribozimlardan-farq-qiluvchi-oz-ozini-qirquvchi-ribozimlarni-saqlovchi-zeta-viruslarning-rnklarini-aniqlash\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#uchinchi-turdagi-bolgasimon-ribozimlardan-farq-qiluvchi-oz-ozini-qirquvchi-ribozimlarni-saqlovchi-zeta-viruslarning-rnklarini-aniqlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Uchinchi turdagi bolg‘asimon ribozimlardan farq qiluvchi o‘z-o‘zini qirquvchi ribozimlarni saqlovchi zeta-viruslarning RNKlarini aniqlash&lt;/span&gt;&lt;/a&gt;Uchinchi turdagi bolg‘asimon ribozimlardan farq qiluvchi o‘z-o‘zini qirquvchi ribozimlarni saqlovchi zeta-viruslarning RNKlarini aniqlash&lt;/h4&gt;\n&lt;p&gt;Bolg‘asimon ribozimlar RNK molekulasining uchlari qaysi spiralda joylashganiga ko‘ra uchta topologik sinfga (I, II va III) bo‘linadi [18]. Bugungi kunga qadar adabiyotlarda tasvirlangan zeta-viruslar ikkala genomik qutblanishda ham III turdagi HHRz mavjudligi bilan tavsiflanadi [15]. Boshqa turdagi o‘z-o‘zini qirquvchi ribozimlarni saqlovchi zeta-viruslar mavjudligini o‘rganish maqsadida, avvalroq Forji va boshqalar [10] tomonidan &lt;i&gt;in silico&lt;/i&gt; usulida aniqlangan viroidsimon RNKlar to‘plami bo‘yicha qidiruv o‘tkazildi. Qizig‘i shundaki, ushbu qidiruv turli xil birikmalardagi III turdagi HHRz dan farq qiluvchi o‘z-o‘zini qirquvchi ribozimlarni saqlovchi 16 ta zeta-virusni (3-rasm) aniqladi (1-jadval va 4-rasm). Yangi aniqlangan zeta-viruslar tayoqchasimon yoki kvazitayoqchasimon bashorat qilingan ikkilamchi tuzilishni namoyish etdi. Yagona sezilarli istisno ancha tarvaqaylagan tuzilishga ega bo‘lgan ZV130856 zeta-viri bo‘ldi (3-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;O‘z-o‘zini qirquvchi ribozimlar — bu oqsillarning yordamisiz o‘zining fosfodiester bog‘ining uzilishini katalizlash qobiliyatiga ega bo‘lgan funksional RNK molekulalari bo‘lib, ularning sinflari fazoviy arxitekturasi bilan farqlanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu obyektlar qatoriga quyidagi aniq metagenomik identifikatorlar va qoplash parametrlarga ega variantlar kirdi: ZV28323 (SRR11829260; NODE_28323_length_742_cov_26.500747; DVRz 5.7e-05 va 5.7e-05), ZV42858 (SRR10482243; NODE_42858_length_739_cov_170.015015; DVRz 8.4e-05 va 8.6e-03), ZV12952 (SRR7428111; NODE_12952_length_715_cov_3.442943; DVRz 1.4e-03 va 1.2e-04), ZV31793 (SRR11450578; NODE_31793_length_535_cov_103.549784; DVRz 8.0e-05 va 1.5e-04), ZV39444 (SRR5864101; NODE_39444_length_535_cov_1.967532_1; DVRz 7.6e-04 va 8.0e-05), ZV36159 (SRR11614418; NODE_36159_length_751_cov_5.014749; DVRz 1.1e-04 va 9.0e-03), ZV18610 (SRR8512518; NODE_18610_length_676_cov_17.376396; DVRz 1.5e-04 va 8.1e-02), ZV52073 (SRR7286070; NODE_52073_length_484_cov_65.367397; DVRz 2.8e-02 va 1.9e-04), ZV110734 (SRR8857868; NODE_110734_length_484_cov_15.513382; DVRz 2.8e-02 va 9.4e-03), ZV130856 (SRR11565845; NODE_130856_length_499_cov_8.208920; HPRz 3.1e-08 va TWRz 1.2e-06), ZV98882 (SRR11828805; NODE_98882_length_550_cov_4.985325; HHRz II 3.2e-09 va HHRz III 2.2e-01), ZV138865 (SRR11011818; NODE_138865_length_412_cov_3.073746; HHRz II 6.7e-04 va 3.2e-07), ZV39584 (SRR5839026; NODE_39584_length_481_cov_9.259804; HHRz II 9.3e-04 va HHRz III 3.9e-08), ZV63649 (SRR12264489; NODE_63649_length_541_cov_16.369658; HHRz III 1.8e-04 va HHRz II 1.0e-03), ZV45724 (SRR6323866; NODE_45724_length_541_cov_3.835470; HHRz III 9.4e-07 va HHRz II 1.8e-02) hamda ZV5877 (SRR5864110; NODE_5877_length_1072_cov_3.852853; ikkala pozitsiyada ham TWRz 9.7e-12).&lt;/p&gt;\n&lt;p&gt;Ushbu zeta-viruslarning to‘qqiztasida ikkala qutblanish zanjirida ham delta-ribozimlar (DVRz) mavjud (4-rasm). Bitta zeta-virus (ZV138865) ikkala qutblanishda ham II turdagi HHRzlarni o‘z ichiga oladi, to‘rttasi (ZV98882, ZV39584, ZV63649 va ZV45724) esa bir qutblanishda II turdagi HHRz va boshqasida III turdagi HHRzni saqlaydi (4-rasm). Bundan tashqari, bitta zeta-virus (ZV130856) bir qutblanish zanjirida tvister ribozimini (TWRz) va qarama-qarshi qutblanishda soch qadag‘ich ribozimini (HPRz) o‘z ichiga oladi, boshqasi (ZV5877) esa ikkala qutblanishda ham tvister ribozimlarini saqlaydi (4-rasm). Qizig‘i shundaki, ZV130856 ning bir qutblanishida aniqlangan TWRz kanonik TWRz tuzilishida mavjud bo‘lmagan qo‘shimcha spiral-ilmak elementiga ega bo‘lib, tegishli nukleotidlar 4-rasmda qizil rangda belgilangan. Qolaversa, ikkita TWRzni saqlovchi ZV5877 999 nt uzunlikdagi genomga ega bo‘lib, bu uni hozirgi kunga qadar xabar qilingan barcha boshqa zeta-viruslardan uzunroq qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Izlanish natijasida muqobil ribozimlarga ega 16 ta yangi zeta-virus aniqlandi, shu jumladan delta-ribozimlar, II turdagi bolg‘asimonlar, tvisterlar va soch qadag‘ich ribozimlar, ZV5877 shtammi esa 999 nukleotidlik rekord uzunlikka erishdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;AlphaFold 3 yordamida ushbu yangi aniqlangan zeta-viruslarning ikkala qutblanishida kodlangan taxminiy halqasimon oqsillarning uchlamchi tuzilmalarini bashorat qilish 0.5 dan past pTM qiymatlarini berdi (ma'lumotlar ko‘rsatilmagan), bu esa olingan tuzilmaviy modellarning past darajada ishonchli ekanligini ko‘rsatadi.&lt;/p&gt;\n&lt;p&gt;Ketma-ketliklarning juftlikdagi o‘xshashligi ushbu tadqiqotda aniqlangan zeta-viruslar orasida ham nukleotid darajasida (S2A-rasm), ham ORF A va ORF B tomonidan potentsial kodlanadigan oqsillar orasida (S2B-rasm) juda o‘zgaruvchan va umumiy holda past bo‘ldi. Nukleotid ketma-ketliklarining o‘xshashligi 28% dan 58% gacha bo‘lgan diapazonni tashkil etdi, faqat ikkita delta-ribozimni saqlovchi va 90% ketma-ketlik o‘xshashligiga ega bo‘lgan ZV52073 va ZV110734 bundan mustasno. Aminokislota ketma-ketliklarining o‘xshashligi maksimal 45% ga yetdi, biroq delta-ribozimlovchi zeta-viruslarning ikkala oqsilini o‘z ichiga olgan oltita juftlik taqqoslashi (ZV31793 va ZV39444, ZV12952 va ZV42858, shuningdek ZV52073 va ZV110734) bundan mustasno bo‘lib, ular 82% dan 95% gacha bo‘lgan aminokislota o‘xshashligini ko‘rsatdi.&lt;/p&gt;\n&lt;p&gt;Yangi aniqlangan zeta-viruslar asosan cho‘kindilar, mikroblar qatlamlari, suv-botqoq yerlar, tuproqlar, chuchuk suv muhitlari va kompostni o‘z ichiga olgan ekologik metatranskriptomik ma'lumotlar to‘plamlari bilan bog‘liq edi. Yagona istisno ikkala qutblanishda ham DVRzlarni saqlovchi ZV36159 bo‘lib, u umurtqasizlar namunalari, xususan &lt;i&gt;Frankliniella intonsa&lt;/i&gt; bilan bog‘liq virusli genomlar to‘plamidan aniqlangan.&lt;/p&gt;\n&lt;h4 id=\"yangi-xususiyatlarga-ega-viroidga-oxshash-rnklarni-aniqlash-va-tavsiflash\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#yangi-xususiyatlarga-ega-viroidga-oxshash-rnklarni-aniqlash-va-tavsiflash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yangi xususiyatlarga ega viroidga o'xshash RNKlarni aniqlash va tavsiflash&lt;/span&gt;&lt;/a&gt;Yangi xususiyatlarga ega viroidga o'xshash RNKlarni aniqlash va tavsiflash&lt;/h4&gt;\n&lt;p&gt;C30, CD95 va CD99 kutubxonalarida tadqiqotchilar taxminiy viroidga o'xshash RNKlarga (vdlRNAs) mos keladigan to'rtta qo'shimcha kontigni tanlab olishdi (mos ravishda 109, 17 va 31 ta kontig). Ushbu elementlar o'zlarining qiziqarli kodlash xususiyatlari tufayli e'tiborni tortdi. CD95 kutubxonasida qamrov ko'rsatkichi 1.76 bo'lgan 784 nt uzunlikdagi NODE_786, CD99 kutubxonasida qamrov ko'rsatkichi 2.12 bo'lgan 721 nt uzunlikdagi NODE_1793, C30 kutubxonasida esa qamrov ko'rsatkichi 2.29 bo'lgan 525 nt uzunlikdagi NODE_270217 va qamrov ko'rsatkichi 9.71 bo'lgan 608 nt uzunlikdagi NODE_184674 aniqlandi. Ular mos ravishda 664, 685, 514 va 481 nt uzunlikdagi taxminiy halqasimon RNKlarga mos keladi. BLASTn tahlili ushbu kontiglar va ma'lumotlar bazasidagi ilgari xabar qilingan RNK ketma-ketliklari o'rtasida sezilarli o'xshashlikni ko'rsatmadi. Barcha bu RNK elementlari tayoqchasimon yoki kvazi-tayoqchasimon ikkilamchi tuzilmalarga o'raladi (5A-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BLASTn va INFERNAL — bu bioinformatika vositalari bo'lib, birinchisi ma'lumotlar bazasidan o'xshash DNK/RNK ketma-ketliklarini qidirsa, ikkinchisi maxsus stoxastik grammatikalar yordamida RNK ning tuzilmaviy motiflarini aniqlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;INFERNAL tahlili ushbu taxminiy viroidga o'xshash RNKlarning har bir polarlik zanjirida III turdagi HHRz ribozimini aniqladi (5B-rasm). CD95 va CD99 kutubxonalaridagi vdlRNK larda ikkita ribozimdan biri konservalashgan katalitik markazida mutatsiyaga ega bo'lib, unda kanonik CUGA o'rnini CCGA egallagan (5B-rasm). Ushbu mutatsiya ushbu tadqiqotda aniqlangan ba'zi zeta viruslarida ham kuzatilgan edi. To'rtta viroidga o'xshash RNK o'zaro 47.95% dan 56.97% gacha bo'lgan nukleotidlar ketma-ketligi o'xshashligiga ega va o'xshash tuzilmaviy hamda kodlash xususiyatlarini namoyish etadi. Har ikkala polarlik zanjirida har bir RNK genomik RNK uzunligidan oshib ketadigan yagona ochiq o'qish рамкасини (ORF) o'z ichiga oladi, bunda stop-kodon multimerik RNKning ikkinchi monomeriga to'g'ri keladi (5C-rasm). Bu ushbu vdlRNKlarning genomi uchga karrali emasligi (664, 685, 514 va 481 nt) tufayli sodir bo'ladi, zeta viruslaridan farqli o'laroq. Bu ssenariy translatsiya uchun matritsa sifatida replikatsiya paytida hosil bo'ladigan tsiklik RNKlar yoki muqobil ravishda multimerik chiziqli RNKlarning ishtirokini nazarda tutadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mualliflar uzunligi 481 dan 685 nt gacha bo'lgan, III turdagi HHRz ribozimlari va genom uzunligidan oshuvchi noyob ORF larga ega to'rtta yangi viroidga o'xshash RNKni aniqlab, ularni betaviroidga o'xshash RNKlar (\\beta vdl786, \\beta vdl1793, \\beta vdl270217 va \\beta vdl184674) deb nomlashni taklif qilishdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Genomik RNKdan uzunroq ORF lar mavjudligini hisobga olib, zeta viruslaridan farqlash maqsadida betaviroidga o'xshash RNKlar (betaviroid-like RNAs) nomi taklif qilindi. CD95, CD99 va C30 tuproq kutubxonalaridan topilgan yangi vdlRNKlar betaviroidga o'xshash RNK 786 (βvdl786), betaviroidga o'xshash RNK 1793 (βvdl1793), betaviroidga o'xshash RNK 270217 (βvdl270217) va betaviroidga o'xshash RNK 184674 (βvdl184674) deb nomlandi. BLASTp qidiruvlari ushbu RNKlar tomonidan kodlanadigan taxminiy oqsillar va ilgari ma'lum bo'lgan oqsillar o'rtasida sezilarli o'xshashlik yo'qligini ko'rsatdi. Juftlik taqqoslashlari sakkizta betaviroidga o'xshash oqsillar orasida amino kislotalar ketma-ketligi bo'yicha 9.77% dan 33.33% gacha bo'lgan past o'xshashlikni ko'rsatdi. AlphaFold 3 yordamida uchinchi darajali tuzilmalarni bashorat qilish past pTM ballarini berdi (0.16–0.23; S3-rasm), bu olingan modellar uchun ishonch pastligini bildiradi. O'qilgan ketma-ketliklarni βvdl786, βvdl1793, βvdl270217 va βvdl184674 genomik RNKlariga moslashtirish orqali hech qanday polimorf pozitsiyalar aniqlanmadi, bu genomik ketma-ketliklarning qat'iy saqlanganligini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AlphaFold 3 yordamida oqsillarning uchinchi darajali tuzilmalarini bashorat qilish juda past pTM baholarini (0.16–0.23) ko'rsatdi, bu esa ushbu faraziy oqsillarning haqiqiy uch o'lchamli tuzilishiga nisbatan yuqori noaniqlik darajasidan dalolat beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Aniqlangan to'rtta betaviroidga o'xshash RNKdan βvdl786 va βvdl1793 qo'shimcha tekshiruvlar uchun tanlandi. Tanlangan RNKlar mavjudligini, DNK nusxasining yo'qligini va ribozimning o'z-o'zini parchalash faolligini tasdiqlash uchun zeta virusi bilan bir xil eksperimental yondashuv qo'llanildi. Teskari transkripsiya va qo'shni hamda komplementar maxsus primerlar yordamida ПЦР (S1-jadval) CD95 va CD99 tuproq namunalaridan mos ravishda βvdl786 va βvdl1793 uchun kutilgan o'lchamdagi amplikonlarni hosil qildi (6A-rasm). Ushbu amplikonlarni klonlash va Sanger usulida ketma-ketligini aniqlash RNA-seq tahlil natijalarini tasdiqladi (GenBank raqamlari: βvdl786 uchun PZ584208, βvdl1793 uchun PZ584209). Aniqlangan RNK ketma-ketliklari DNK shaklida ham mavjudligini tekshirish uchun CD95 va CD99 tuproq namunalarining DNK preparatlari βvdl786 va βvdl1793 uchun mos ravishda 248 va 256 nt fragmentlarni amplifikatsiya qiluvchi primerlar yordamida tahlil qilindi (S1-jadval). Bir xil tuproq namunalaridan olingan кДНК va universal zamburug' primerlari ITS4/ITS5 musbat nazorat sifatida ishlatildi (6B-rasm). DNK preparatlaridan βvdl786 va βvdl1793 ПЦР amplikonlari olinmadi, bu sinovdan o'tgan tuproqlarda DNK ekvivalentlari yo'qligini qo'llab-quvvatlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ПЦР va DNK namunalari bilan o'tkazilgan tajribalar CD95 va CD99 tuproqlarida betaviroidga o'xshash RNKlar faqat RNK shaklida mavjudligini, ularning DNK oraliq shakllari yo'qligini tasdiqladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ikki polarlik zanjirining mavjudligini baholash va ularning nisbiy miqdoriga ko'ra (+) va (-) zanjirlarini farqlash uchun βvdl786 va βvdl1793 ga xos bo'lgan zanjirga yo'naltirilgan primerlar yordamida yarim miqdoriy ОТ-ПЦР bajarildi (S1-jadval). (+) va (-) polarliklar uchun maxsus primerlar alohida ishlatilib, hosil bo'lgan кДНК ning bir nechta suyultirishlari (suyultirilmagan, 1:2, 1:10, 1:20, 1:200) maxsus primerlar yordamida ПЦР orqali amplifikatsiya qilindi. Har ikkala betaviroidga o'xshash RNK uchun ikkala polarlik zanjiri ham aniqlandi. βvdl786 va βvdl1793 ning bitta RNK polarligi sezilarli darajada yuqori darajada to'plandi. Ushbu dalillarga asoslanib, ushbu RNK polarligi (+) deb hisoblandi (6C-rasm).&lt;/p&gt;\n&lt;p&gt;Hammerhead ribozimlarining (HHRz) o‘z-o‘zini kesish faoliyati βvdl786 ning to‘liq uzunlikdagi cDNA monomerini o‘z ichiga olgan plazmidlar yordamida in vitro transkripsiya orqali baholandi. Ikkala qutb zanjiri uchun to‘liq uzunlikdagi transkript va kutilgan ikkita kesilish mahsulotiga mos keluvchi uchta chiziq aniqlandi (6D-rasm), bu HHRz ning in vitro faol ekanligini ko‘rsatadi. Yakuniy o‘z-o‘zini kesish joylari 5’ RACE tahlili bilan tasdiqlandi, bu ribozim faoliyati natijasida hosil bo‘lgan 3’ fragmentlar kutilgan 5’ uchlariga ega ekanligini ko‘rsatdi (6E-rasm). Bu ma’lumotlar betaviroidga o‘xshash RNKlarning replikatsiyasida simmetrik aylanma halqa mexanizmi ishtirok etishini kuchli qo‘llab-quvvatlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;In vitro tajribalar HHRz ribozimlarining faolligini va βvdl786 RNK uchun simmetrik replikatsiya mexanizmi mavjudligini tasdiqladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ommabop-malumotlar-bazalarida-on-bitta-yangi-betaviroidga-oxshash-rnkni-aniqlash\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#ommabop-malumotlar-bazalarida-on-bitta-yangi-betaviroidga-oxshash-rnkni-aniqlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ommabop ma’lumotlar bazalarida o‘n bitta yangi betaviroidga o‘xshash RNKni aniqlash&lt;/span&gt;&lt;/a&gt;Ommabop ma’lumotlar bazalarida o‘n bitta yangi betaviroidga o‘xshash RNKni aniqlash&lt;/h4&gt;\n&lt;p&gt;Ushbu RNKlarning global tarqalishini o‘rganish uchun ochiq ma’lumotlar bazalari skanerdan o‘tkazildi. Uzunligi 286 dan 685 nt gacha bo‘lgan va betaviroidlarga o‘xshash strukturaviy hamda kodlovchi xususiyatlarga ega 11 ta qo‘shimcha vdlRNK aniqlandi (2-jadval). Barcha ketma-ketliklar atrof-muhit namunalaridan: botqoqliklar, turg‘un suvlar, o‘simlik qoldiqlari va boreal o‘rmon tuproqlaridan olingan. Ikkinchi monomerda stop-kodonning joylashuvi turlicha: ba’zilarida u ikkinchi monomer boshida, boshqalarida esa 260 nt gacha masofada joylashgan (2-jadval).&lt;/p&gt;\n&lt;p&gt;BLASTn tahlili yangi siklik vdlRNKlarning ma’lum ketma-ketliklar bilan sezilarli o‘xshashligini aniqlamadi. Aniqlangan RNKlar o‘rtasidagi nukleotidlar o‘xshashligi 33,33% dan 77,09% gacha (SN4A-rasm), bashorat qilingan oqsillarning aminokislotalar o‘xshashligi esa 59,55% gacha yetdi (SN4B-rasm). RNAfold bashoratiga ko‘ra, barcha yangi RNKlar tayoqchasimon ikkilamchi tuzilmalarni hosil qiladi (7-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BLASTn — bu nukleotid ketma-ketliklarini ma’lumotlar bazasidagi boshqa ketma-ketliklar bilan solishtirish uchun ishlatiladigan algoritmdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;INFERNAL tahlili barcha vdlRNKlarda ambisens HHRz III tipidagi motivlarni aniqladi (8-rasm). Ulardan uchtasi (βvdl34831, βvdl37279 va βvdl725174) βvdl786 va βvdl1793 HHRzlarida bo‘lgani kabi katalitik yadroda bir xil mutatsiyaga (CUGA o‘rniga CCGA) ega. Ba’zi hollarda ORF start va stop kodonlari ribozim motivlari bilan ustma-ust tushadi. Uchta vdlRNK (βvdl34283, βvdl40399, βvdl590361) taxminan 42-55 nt uzunlikdagi I novdasi bilan boshqalaridan farq qiluvchi HHRzga ega. AlphaFold 3 ma’lumotlariga ko‘ra, bashorat qilingan oqsillar past aniqlikdagi (pTM &amp;lt; 0,5) buklanishni namoyon qiladi.&lt;/p&gt;\n&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;h4 id=\"umumiy-tavsiflar-va-yangi-viroidsimon-rnklarning-kashf-etilishi\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#umumiy-tavsiflar-va-yangi-viroidsimon-rnklarning-kashf-etilishi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy tavsiflar va yangi viroidsimon RNKlarning kashf etilishi&lt;/span&gt;&lt;/a&gt;Umumiy tavsiflar va yangi viroidsimon RNKlarning kashf etilishi&lt;/h4&gt;\n&lt;p&gt;Ushbu tadqiqotda tuproq namunalaridan topilgan zeta-virus birinchi marta molekulyar darajada tavsiflandi va uning mavjudligi eksperimental tarzda tasdiqlandi. Tadqiqot musbat (+) va manfiy (-) qutblilikdagi sirkulyar RNK shakllari mavjudligini, DNK o'tmishdoshi yo'qligini, shuningdek, har ikki qutblilik zanjirida bolgachasimon ribozimlar (hammerhead ribozymes) yordamida o'z-o'zini qirqish faolligini ko'rsatdi, bu esa simmetrik aylanma halqa mexanizmi orqali replikatsiyadan dalolat beradi. Shuningdek, mualliflar tarkibida bolgachasimon ribozimlar va to'liq uzunlikdagi sirkulyar genomdan biroz uzunroq o'qish ramkalariga (ORF) ega bo'lgan vdlRNKlarning yangi guruhi — betaviroidsimon RNKlarni aniqladilar va tavsifladilar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqotda tuproq zeta-viruslarining mavjudligi eksperimental isbotlandi va aylanma halqa mexanizmi orqali ko'payuvchi yangi betaviroidsimon RNKlar guruhi ochildi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;«Betaviroidsimon RNKlar» atamasi ushbu RNK elementlarining viroidga o'xshash tabiatini ta'kidlash hamda ularni klassik viruslardan farqlash uchun qabul qilindi, chunki bu RNKlarda RNKga bog'liq RNK-polimeraza aniqlanmagan. Ulardan ikkitasi uchun sirkulyarlik, DNK shaklining yo'qligi va bolgachasimon ribozimlarning katalitik faolligi ham tasdiqlandi. Zeta-viruslar bilan umumiy xususiyatlarga ega bo'lishiga qaramay, betaviroidsimon RNKlar o'ziga xos genom arxitekturasiga ega. Xususan, ularning genomi uzunligi hech qachon uchga karrali bo'lmagan nukleotidlar soni bilan tavsiflanadi. Bu xususiyat monomerli (chiziqli yoki sirkulyar) genom to'liq tarjima qilingandan so'ng yuzaga keladigan o'qish ramkasi siljishi (frameshift) bilan mos keladi, bu esa oxir-oqibat to'xtash kodonining paydo bo'lishiga olib keladi. Bu holat genomidagi nukleotidlar soni uchga karrali bo'lgan va potensial cheksiz oqsillarni tarjima qilishga imkon beradigan zeta-viruslardan keskin farq qiladi.&lt;/p&gt;\n&lt;h4 id=\"tarqalishi,-xilma-xilligi-va-mumtoz-tarjima-mexanizmlari\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#tarqalishi,-xilma-xilligi-va-mumtoz-tarjima-mexanizmlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tarqalishi, xilma-xilligi va mumtoz tarjima mexanizmlari&lt;/span&gt;&lt;/a&gt;Tarqalishi, xilma-xilligi va mumtoz tarjima mexanizmlari&lt;/h4&gt;\n&lt;p&gt;Zeta-viruslar ham, betaviroidsimon RNKlar ham ekologik namunalardan aniqlangan. Shu sababli ularning xo'jayin organizmlari hozircha noma'lumligicha qolmoqda. Shunga qaramay, ommaga ochiq metatranskriptomik ma'lumotlar bazalaridan o'n ikkita qo'shimcha potensial betaviroidsimon RNKning topilishi vdlRNK elementlarining ushbu sinfi yanada keng tarqalganligini tasdiqlaydi. Bundan tashqari, III turdagi HHRzlardan farq qiluvchi ribozim tutgan zeta-viruslarning (shu jumladan DVRz, TWRz, HPrP va II turdagi HHRz) aniqlanishi ushbu RNK elementlari bilan bog'liq ribozimlarning ma'lum xilma-xilligini yanada kengaytiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Aylanma halqa mexanizmi (rolling-circle replication) — halqali nuklein kislotalarining uzluksiz nusxalanish usuli bo'lib, bunda fermentlar doira bo'ylab harakatlanib, takrorlanuvchi bo'laklardan iborat uzun o'tmishdosh zanjirlarni hosil qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Zeta-viruslar va betaviroidsimon RNKlar bo'ylab ushbu vdlRNKlar tomonidan kodlangan ORF'larning g'ayrioddiy xususiyatlari ularning tarjima strategiyalari bo'yicha muhim savollarni tug'diradi. Ehtimoliy yo'nalishlardan biri sirkulyar RNKdan to'g'ridan-to'g'ri qaytariluvchi tarjima sikli, ya'ni aylanma halqa tarjimasi (rolling-circle translation) orqali amalga oshishidir. Bunday mexanizm bakterial [19] va eukariotik hujayralarda [20] in vitro sintez qilingan sirkulyar RNK tarkibida namoyish etilgan. Aylanma halqa tarjimasi mexanizmi, shuningdek, insonning sirkulyar-EGFR kabi endogen sirkulyar RNKlarida ham namoyon bo'lishi ko'rsatilgan bo'lib, uning aylanma halqa va -1 ribosomal ramka siljishi orqali tarjima qilinishi polimer oqsil kompleksini hosil qilgan [21]. Sirkulyar RNKlar uchun tarjimaning boshlanishining ichki ribosoma kirish sayti (IRES), N⁶-metiladenozin (m⁶A) elementlari, A-to-I RNK tahrirlash, ekson tutashish kompleksi (EJC) vositasidagi boshlanish, shuningdek ribosomal shuntlash va RAN tarjimasi kabi turli strategiyalari taklif qilingan [22].&lt;/p&gt;\n&lt;p&gt;Shunga qaramay, kuchli saqlanib qolgan kanonik tarjima boshlanish signallarining yo'qligi sirkulyar matritsalardan tarjimani istisno qilmaydi, chunki sirkulyar RNKlar IRES, 5'-qopqoq yoki poli(A) dumi bo'lmagan taqdirda ham oqsil sintezini qo'llab-quvvatlashi ko'rsatilgan [20]. Shu bilan bir qatorda, tarjima vdlRNKlarning replikatsiya oraliq mahsulotlariga mos kelishi mumkin bo'lgan chiziqli multimer RNKlardan davom etishi mumkin. Sirkulyar RNK matritsasida tarjima ribosomalarni jalb qilish kabi qiyinchiliklarni keltirib chiqarsa-da, chiziqli matritsa modelida ribozimlar ba'zi viruslar uchun yaqinda taklif qilinganidek, tarjimani boshlashda rol o'ynashi mumkin [23].&lt;/p&gt;\n&lt;h4 id=\"zeta-viruslar-va-betaviroidga-oxshash-rnklar-kodlash-salohiyati-va-oziga-xos-genoh-tuzilishi\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#zeta-viruslar-va-betaviroidga-oxshash-rnklar-kodlash-salohiyati-va-oziga-xos-genoh-tuzilishi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Zeta viruslar va betaviroidga o'xshash RНКlar kodlash salohiyati va o'ziga xos genoh tuzilishi&lt;/span&gt;&lt;/a&gt;Zeta viruslar va betaviroidga o'xshash RНКlar kodlash salohiyati va o'ziga xos genoh tuzilishi&lt;/h4&gt;\n&lt;p&gt;Zeta viruslar va betaviroidga o'xshash RНКlarda ochiq o'qish рамкалариning aniqlanishi ma'lum bo'lgan viroidga o'xshash agentlarning xilma-xilligini sezilarli darajada kengaytiradi. Ushbu agentlar gepatit Delta virusi va Kolmioviridae oilasiga mansub agentlar, ambiviruslar hamda obelisklar kabi boshqa halqasimon RНКlarga o'xshab, oqsil kodlash qobiliyatini viroidlarning asosiy belgilari, jumladan halqasimon genomlar, o'z-o'zidan parchalanadigan ribozimlar va aylanma halqa mexanizmi orqali репликация bilan birlashtiradi. Tarjima qilish qobiliyati ilgari guruch sariq dog'lanish virusi bilan bog'langan virusoid uchun ham ko'rsatilgan bo'lib, u kodlash qobiliyatiga ega bo'lgan yagona viroid va yo'ldosh RНК hisoblanar edi. Kolmioviridae oilasi vakillari, obelisklar va ushbu virusoid oqsillarni bitta zanjirda kodlasa, ambiviruslar har ikkala zanjirda ham kodlash qobiliyatini namoyon etadi.&lt;/p&gt;\n&lt;p&gt;Qizig'i shundaki, zeta viruslar va betaviroidga o'xshash RНКlar ham shunday ambisens kodlash qobiliyatiga ega, ammo kodlovchi ketma-ketliklarning joylashuvi sezilarli darajada farq qiladi. Ambiviruslarda ikkita saqlanib qolgan ochiq o'qish ramkasi qarama-qarshi zanjirlarning alohida, bir-biriga mos kelmaydigan hududlarida joylashgan. Bundan farqli o'laroq, zeta viruslar va betaviroidga o'xshash RНКlarning ramkalari butun genomni har ikkala qutbda ham qamrab oladi, bu esa replikatsiyalanuvchi RНК yoki virusda ilgari tavsiflanmagan o'ta murakkab genomik qoplash shaklini ifodalaydi. Bundan tashqari, bunday tashkilot genetik ma'lumotni o'ta darajada siqishni anglatadi, bunda bir xil nukleotidlar ketma-ketligi bir vaqtning o'zida har ikkala zanjirda oqsil kodlashga hissa qo'shadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Genomni o'ta siqish — bir xil nukleotidlar ketma-ketligi bir vaqtning o'zida ikkala zanjirda ham oqsillarni kodlab, ham RНК tuzilishi va replikatsiyasi funksiyalarini bajaradigan noyob holat.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;RНК viruslarida bir-birining ustiga chiqadigan kodlovchi ketma-ketliklar mutatsiyalarga nisbatan sezuvchanlikni oshiradi, chunki bitta nukleotidning o'zgarishi birdan ortiq hududga ta'sir qilishi mumkin. Ushbu genomik tashkilot yuqori mutatsiya darajasiga qarshi turlish uchun katta mutatsion turg'unlik bilan bog'liq. Shu munosabat bilan, zeta viruslar va betaviroidga o'xshash RНКlarning tashkil topishi ushbu replikatsiyalanuvchi agentlar uchun o'ta yuqori mutatsion turg'unlik zarurligini ko'rsatadi. Ushbu tadqiqotda zeta viruslar va betaviroidga o'xshash RНКlar uchun kuzatilgan juda past genetik o'zgaruvchanlik ham shuni tasdiqlaydi. Zeta viruslar va betaviroidga o'xshash RНКlarning hayratlanarli genomik tuzilishi ularning kelib chiqishi va evolyutsion strategiyalari haqida qiziqarli savollarni tug'diradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Zeta viruslar va betaviroidga o'xshash RНКlar minimal genetik o'zgaruvchanlik bilan bir qatorda misli ko'rilmagan genom siqilishi va ambisens ochiq o'qish ramkalari kesishishini namoyon etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Umuman olganda, ushbu topilmalar oqsil kodlovchi viroidga o'xshash RНКlarning ma'lum xilma-xilligini kengaytiradi va zeta viruslar hamda betaviroidga o'xshash RНКlarning ajoyib genetik axborot siqilishini ta'kidlab, ularning evolyutsiyasi va biologik rollari bo'yicha yangi istiqbollarni ochib beradi.&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"rnk-va-dnk-ekstraktsiyasi-hamda-bioinformatik-tahlil\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#rnk-va-dnk-ekstraktsiyasi-hamda-bioinformatik-tahlil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RNK va DNK ekstraktsiyasi hamda bioinformatik tahlil&lt;/span&gt;&lt;/a&gt;RNK va DNK ekstraktsiyasi hamda bioinformatik tahlil&lt;/h4&gt;\n&lt;p&gt;Ushbu tadqiqotda 2019-yilda Toskana (Italiya) hududidagi kashtan (Castanea sativa) bog‘idan olingan tuproq namunalari tahlil qilindi. Har bir namuna kamida ikki metr masofada joylashgan 200 sm³ hajmdagi beshta tuproq kernining aralashmasidan iborat edi. Umumiy RNK RNeasy PowerSoil Total RNA (QIAGEN) to‘plami yordamida oltita namunadan ajratib olindi. Tayyorlangan kutubxonalar (C30, CD50, CD95, CD99, C105 va C110) Novogene kompaniyasida Illumina NovaSeq 6000 (2x150 bp) platformasida Illumina TruSeq Stranded Total RNA protokoli va RiboZero Plant yordamida ribosomali RNKni yo‘qotish bilan ketma-ketlashtirildi. DNK FastDNA™ SPIN Kit for Soil (MP Biomedicals) yordamida ajratib olindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RNA-seq texnologiyasi namunadagi barcha transkriptlarni aniqlash imkonini beradi, bu esa yangi virusli ketma-ketliklarni topishda muhim ahamiyatga ega.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Birlamchi ma’lumotlar FASTX-Toolkit yordamida sifat nazoratidan o‘tkazildi va cutadapt orqali qayta ishlandi: adapterlar, sifatsiz (Phred Q&amp;lt;20) va qisqa (L&amp;lt;50 bp) o‘qishlar, shuningdek, aniqlanmagan nukleotidlar olib tashlandi. Yig‘ish (assembly) SPAdes (v3.13.0) dasturida multi k-mer strategiyasi (51 dan 121 bp gacha, 10 qadam bilan) yordamida amalga oshirildi. Kontiglarning funksional annotatsiyasi DIAMOND (v2.1.7) yordamida NCBI ma’lumotlar bazasiga (2023-yil 4-avgust holatiga) qarshi BLASTx qidiruvi orqali bajarildi.&lt;/p&gt;\n&lt;p&gt;Ribozimlarni aniqlash uchun INFERNAL (v1.1.2) algoritmi va RFAM (v14) bazasidagi kovariatsiya modellari ishlatildi. Juft ribozimli, halqali topologiyaga ega va BLAST annotatsiyasiga ega bo‘lmagan ketma-ketliklar tanlab olindi. Ketma-ketlik o‘zgaruvchanligini baholash uchun Geneious Prime (v2026.0) dasturida referens kontiglarga xaritalash amalga oshirildi. Variantlarni qidirish (variant calling) kamida 50 o‘qish qoplamasi, 0,3% minimal variant chastotasi, 1 × 10⁻⁴ variant p-qiymati va 0,01 zanjir siljishi p-qiymati shartlari asosida bajarildi.&lt;/p&gt;\n&lt;p&gt;Nukleotid va aminokislota ketma-ketliklari o‘xshashligi Clustal Omega (EMBL-EBI) orqali tahlil qilindi, issiqlik xaritalari (heatmaps) RStudio (ggplot2) yordamida yaratildi. 2000 nt dan qisqa halqali monomerlar kompyuter yordamida dimerlashtirildi va ORF tahlili o‘tkazildi. RNK ikkilamchi tuzilmalari RNAfold (ViennaRNA 2.6.3) yordamida bashorat qilindi, vizualizatsiya esa Jupyter Notebook (Python 3) muhitida amalga oshirildi. Oqsil tuzilmalari AlphaFold 3 orqali bashorat qilindi; «cheksiz» ORF uchun boshlang‘ich kodon eng yuqori pTM (predicted template modelling) balli asosida tanlandi.&lt;/p&gt;\n&lt;h4 id=\"rt-pcr-va-klonlash\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#rt-pcr-va-klonlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RT-PCR va klonlash&lt;/span&gt;&lt;/a&gt;RT-PCR va klonlash&lt;/h4&gt;\n&lt;p&gt;Umumiy nuklein kislotalar tasodifiy geksamerlar va Superscript IV teskari transkriptazasi yordamida teskari transkripsiyaga (RT) uchratildi. Olingan kDNK reaksiyasining ikki mikrotriti 0.25 birlik GoTaq DNK polimerazasi bilan birgalikda PCR amplifikatsiyasi uchun matritsa sifatida ishlatildi. Reaksiya 25 mkl hajmda amalga oshirilib, tarkibida 1X Green GoTaq reaksiya buferi, 0.2 mM dNTP va 0.2 mkM har bir maxsus praymer bo'ldi (S1-jadval). Termosikllash shartlari quyidagicha edi: 94 °C da 3 daqiqa boshlang'ich denaturatsiya, keyin 94 °C da 30 soniyadan 32 sikl, 57 °C da 30 soniya, 72 °C da soniyalar (manbada vaqt ko'rsatilmagan) va 72 °C da 5 daqiqa davomida yakuniy cho'zilish bosqichi. Kerakli o'lchamdagi mahsulotlar agaroza gelidan kesib olindi, tozalandi, pGEM-T Easy vektoriga klonlandi va Sanger usuli bo'yicha ketma-ketligi aniqlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sanger usulida sekvenirlash — DNK zanjiridagi nukleotidlarning aniq tartibini o'qish imkonini beruvchi standart va yuqori aniqlikdagi molekulyar biologiya usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;vdlRNA larning har bir qutbiy zanjirining miqdoriy tahlili zanjirga xos RT va undan keyingi yarim miqdoriy PCR yordamida baholandi. Har bir zanjir uchun teskari transkripsiya zanjirga xos praymer yordamida bajarildi, so'ngra kDNK ning ketma-ket suyultish namunalari (suyultirilmagan, 1:2, 1:10, 1:20, 1:200) S1-jadvalda ko'rsatilgan praymerlar yordamida yuqorida tavsiflanganidek PCR uchun matritsa sifatida xizmat qildi.&lt;/p&gt;\n&lt;h4 id=\"rnk-oz-ozidan-parchalanishini-tahlil-qilish\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#rnk-oz-ozidan-parchalanishini-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RNK o'z-o'zidan parchalanishini tahlil qilish&lt;/span&gt;&lt;/a&gt;RNK o'z-o'zidan parchalanishini tahlil qilish&lt;/h4&gt;\n&lt;p&gt;Ikkala qutbiy zanjirning monomerik transkriptlari vdlRNA larning to'liq uzunlikdagi kDNK ketma-ketligini o'z ichiga olgan pGEM-T Easy plazmidalarining in vitro transkripsiyasi orqali olindi. Rekombinant plazmidalar tegishli retstriksiya fermenti bilan chiziqli holatga keltirildi, fenol-xloroform yordamida ekstraksiya va etanolda cho'ktirish orqali tozalandi hamda T7 yoki SP6 RNK polimerazalari yordamida in vitro transkripsiya uchun matritsa sifatida ishlatildi. Transkripsiya reaksiyalari denaturatsiyalovchi 5% li PAAG (8 M mochevina, 1 X TBE: 89 mM Tris, 89 mM bor kislotasi, 2.5 mM EDTA, pH 8.3) yordamida tahlil qilindi, etidiy bromid bilan bo'yaldi va ultrabinafsha nurlari ostida ko'rindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Denaturatsiyalovchi PAAG elektroforezi RNK molekulalarini ularning uzunligi bo'yicha ikkilamchi tuzilmalarni buzgan holda aniq ajratib beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;In vitro transkripsiya jarayonida hosil bo'lgan 3' uchi o'z-o'zidan parchalanadigan mahsulotlar akrilamid gellaridan ajratib olindi va ularning 5' uchi ketma-ketligi 5'-RACE usuli orqali aniqlandi. Qisqacha aytganda, parchalanmagan 3' RNK fragmentlari gelidan kesib olindi, fenol-xloroform ekstraksiyasi va etanolda cho'ktirish bilan tozalandi hamda maxsus praymerlar yordamida teskari transkripsiyalandi (S1-jadval). Terminal deoksinukleotidil transferaza yordamida poly(G) uchi qo'shilgandan so'ng, dumlangan kDNK lar GoTaq DNK polimerazasi, polyC RACE praymeri va kDNK sintezi uchun ishlatilgan praymerga nisbatan ichki (nested) maxsus praymer yordamida PCR orqali ko'paytirildi (S1-jadval). PCR mahsulotlari geldan tozalandi, klonlandi va Sanger bo'yicha sekvenir qilindi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-f1.jpg\" alt=\"1-rasm. Zeta-viruslarning struktur xususiyatlari. (A) ZV1, ZV2 va ZV3 RNKlarning minimal erkin energiya ikkilamchi struk\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. Zeta-viruslarning struktur xususiyatlari. (A) ZV1, ZV2 va ZV3 RNKlarning minimal erkin energiya ikkilamchi strukturasining doiraviy grafigi. RNK genomi ichidagi bashorat qilingan juftlashish o'zaro ta'sirlari yoylar bilan ko'rsatilgan bo'lib, ularning ranglari (oqdan to'q qizil ranggacha) mahalliy erkin energiya hissasi (kkal/mol) sifatida ifodalangan asosiy juftlik barqarorligini aks ettiradi. (+) va (-) bolgachasimon ribozimlarning (HHRz) nisbiy o'rinlari mos ravishda binafsha va to'q sariq ranglarda ko'rsatilgan. ORF A ((+) zanjir) va ORF B ((-) zanjir) mos ravishda ko'k va yashil ranglarda ko'rsatilgan, uchburchaklar esa mos keluvchi boshlang'ich kodonlarni bildiradi. (B) ZV1, ZV2 va ZV3 ning (+) (chapda) va (-) (o'ngda) HHRz larning ikkilamchi strukturasi. Uzilish joyi strelka bilan belgilangan va katalitik yadro ichidagi konservativ nukleotidlar qora fon bilan ajratib ko'rsatilgan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-f3.jpg\" alt=\"3-rasm. Metatranskriptomik ma'lumotlar bazalarida aniqlangan III turdagi HHRz dan farqli ribozimlarga ega bo'lgan zeta-v\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm. Metatranskriptomik ma'lumotlar bazalarida aniqlangan III turdagi HHRz dan farqli ribozimlarga ega bo'lgan zeta-viruslarning minimal erkin energiya ikkilamchi strukturasining doiraviy grafigi. (+) va (-) ribozimlarning nisbiy o'rinlari mos ravishda binafsha va to'q sariq ranglarda ko'rsatilgan. (+) va (-) zanjirlarda kodlangan ORF lar mos ravishda ko'k va yashil ranglarda ko'rsatilgan, uchburchaklar esa mos keluvchi boshlang'ich kodonlarni bildiradi (tafsilotlar uchun 1-rasm izohiga qarang).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-f4.jpg\" alt=\"4-rasm. Metatranskriptomik ma'lumotlar bazalaridan topilgan va juftlashgan III turdagi HHRz ni o'z ichiga olmaydigan zet\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm. Metatranskriptomik ma'lumotlar bazalaridan topilgan va juftlashgan III turdagi HHRz ni o'z ichiga olmaydigan zeta-viruslardagi (+) va (-) ribozimlarning ikkilamchi strukturasi. DVRz: delta-ribozim; HHRz II: II turdagi bolgachasimon ribozimlar; HHRz III: III turdagi bolgachasimon ribozimlar; HPRz: soch qadagich ribozim; TWRz: twister ribozimi. Uzilish joyi qizil strelka bilan belgilangan va katalitik yadro ichidagi konservativ nukleotidlar qora fon bilan ajratib ko'rsatilgan. ZV130856 ning bitta qutbliligidagi twister ribozimida aniqlangan qo'shimcha spiral-halqa elementini hosil qiluvchi nukleotidlar qizil rangda belgilangan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-f5.jpg\" alt=\"5-rasm. Betaviroidga o'xshash RNKlarning struktur xususiyatlari (βvdl786, βvdl1793, βvdl270217 va βvdl184674). (A) Minim\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm. Betaviroidga o'xshash RNKlarning struktur xususiyatlari (βvdl786, βvdl1793, βvdl270217 va βvdl184674). (A) Minimal erkin energiyaga ega betaviroidga o'xshash RNK ikkilamchi strukturalarining doiraviy grafigi (batafsil ma'lumot uchun 1-rasm izohiga qarang). (+) va (-) qutblilik bilan kodlangan ORF A va B (mos ravishda ko'k va yashil rangda) genomik RNKdan uzunroq bo'lib, boshlanish va to'xtash kodonlari mos ravishda uchburchak va kvadrat (qizil) bilan ko'rsatilgan. (+) va (-) qutblilik zanjirlaridagi bolgachasimon ribozimning nisbiy o'rinlari mos ravishda binafsha va to'q sariq ranglarda belgilangan. (B) (+) (chapda) va (-) (o'ngda) qutblilik zanjirlaridagi bolgachasimon ribozimlarning bashorat qilingan ikkilamchi strukturasi. (C) Boshdan dumgacha bo'lgan multimerik betaviroidga o'xshash RNK fragmentining sxematik ko'rinishi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-f6.jpg\" alt=\"6-rasm. βvdl786 va βvdl1793 molekulyar tavsifi. (A) Tutash qarama-qarshi qutbli maxsus praymerlardan foydalangan holda C\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm. βvdl786 va βvdl1793 molekulyar tavsifi. (A) Tutash qarama-qarshi qutbli maxsus praymerlardan foydalangan holda CD95 va CD99 tuproq RNK namunalaridan mos ravishda to'liq uzunlikdagi βvdl786 (664 nt, yuqori panel) va βvdl1793 (685 nt, pastki panel) RT-PCR amplifikatsiyasi. (B) DNK ekvivalenti mavjud emasligini tasdiqlash uchun matritsa sifatida yoki kDНК, yoki DNK preparatlarini qo'llagan holda βvdl786 (248 nt, chap yuqori panel) va βvdl1793 (256 nt, chap pastki panel) qisman fragmentining ПЦР amplifikatsiyasi. O'ng panelda musbat nazorat sifatida zamburug'larning universal praymerlari ITS4/ITS5 yordamida CD95 va CD99 DNK ning ПЦР amplifikatsiyasi ko'rsatilgan. (C) Kelishuvga ko'ra (+) qutblilik deb ataladigan, eng ko'p miqdordagi βvdl786 (yuqori panel) va βvdl1793 (pastki panel) qutblilik zanjirini aniqlash uchun zanjirga xos yarim miqdoriy RT-ПЦР amplifikatsiyasi. n.d., suyultirilmagan. M, Gene ruler DNK narvon aralashmasi (Thermo Scientific). (D) βvdl786 o'z-o'zini parchalash faolligini tahlil qilish. In vitro transkripsiya orqali hosil bo'lgan musbat va manfiy qutblilikdagi plazmida va βvdl786 RNK mahsulotlarining sxematik tasvirlari mos ravishda o'ng va chap panellarda ko'rsatilgan. βvdl786 ning monomerik kDНК ketma-ketligini o'z ichiga olgan plazmida linearizatsiya qilindi va (+) (o'ngda) va (−) (chapda) qutblilik zanjirlarining to'liq uzunlikdagi monomerik transkriptlarini (FL) hamda HHRz o'z-o'zini parchalash faolligidan hosil bo'lgan 5′ (5′F) va 3′ (3′F) fragmentlarini ishlab chiqarish uchun transkripsiya qilindi. Plazmida vektor ketma-ketliklari yashil rangda, polimeraza promotri va βvdl786 ketma-ketliklari mos ravishda sariq va ko'k rangda ko'rsatilgan. Qaychi o'z-o'zini parchalash saytlarining o'rnini bildiradi. Har bir RNK fragmentining kutilayotgan hajmi o'ng tomonda keltirilgan. O'rta panelda (+) va (-) βvdl786 monomerlarining in vitro transkripsiyasining 5% PAGE tahlili ko'rsatilgan. M, RNK markeri (past diapazonli ssRNK narvoni, New England Biolabs), o'lchamlari (nt) chap tomonda ko'rsatilgan. (E) (+) va (-) HHRz ning (o'ngda) o'z-o'zini parchalash saytlari (qizil o'q) βvdl786 monomerik transkriptlarining HHRz vositasida parchalanishidan kelib chiqqan 3’F fragmentlarining 5’ RACE yordamida aniqlandi. 5’ RACE mahsulotlarining ketma-ketlik elektroferogrammalari tegishli ribozimning chap tomonida ko'rsatilgan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-f7.jpg\" alt=\"7-rasm. Metatranskriptomik ma'lumotlar to'plamida aniqlangan betaviroidsimon RNKlarning bashorat qilingan ikkilamchi tuz\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-rasm. Metatranskriptomik ma'lumotlar to'plamida aniqlangan betaviroidsimon RNKlarning bashorat qilingan ikkilamchi tuzilmalarining doiraviy grafigi. Ikkala qutblilik zanjiridagi ORF A va B (ko'k va yashil) nisbiy o'rinlari, boshlanish (uchburchaklar) va to'xtash (qizil kvadratlar) kodonlari hamda bashorat qilingan bolgachali ribozimlar (binafsha va to'q sariq) ko'rsatilgan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-f8.jpg\" alt=\"8-rasm. Metatranskriptomik ma'lumotlar to'plamida aniqlangan betaviroidsimon RNKlarning (+) va (-) bolgachali ribozimlar\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-rasm. Metatranskriptomik ma'lumotlar to'plamida aniqlangan betaviroidsimon RNKlarning (+) va (-) bolgachali ribozimlarining ikkilamchi tuzilishi. Parchalanish sayti o'q bilan belgilangan va katalitik yadro ichidagi saqlanib qolgan nukleotidlar qora fon bilan ajratib ko'rsatilgan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-fS1.jpg\" alt=\"S1-rasm. AlphaFold 3 asosida ishlaydigan AlphaFold Server yordamida bashorat qilingan zeta virusining ZV1, ZV2 va ZV3 ta\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S1-rasm. AlphaFold 3 asosida ishlaydigan AlphaFold Server yordamida bashorat qilingan zeta virusining ZV1, ZV2 va ZV3 taxminiy oqsillarining uchlamchi tuzilmalari (A va B).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-fS2.jpg\" alt=\"S2-rasm. Zeta viruslarining nukleotid va aminokislota ketma-ketligi o'xshashliklari. (A) Turli xil turdagi ribozimlarga \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S2-rasm. Zeta viruslarining nukleotid va aminokislota ketma-ketligi o'xshashliklari. (A) Turli xil turdagi ribozimlarga ega bo'lgan barcha aniqlangan zeta viruslarining nukleotid ketma-ketligining foiz o'xshashlik matrizasini aks ettiruvchi issiqlik xaritasi (H: III turdagi bolgachali; H2: II turdagi bolgachali; D: delta; T: tvister; HP: soch qadag'ich ribozimlar). (B) Zeta viruslarining taxminiy oqsillari (ORF A va ORF B) aminokislota ketma-ketligining foiz o'xshashlik matrizasini aks ettiruvchi issiqlik xaritasi. DVRz: delta ribozim; II HHRz: II turdagi bolgachali ribozimlar; III HHRz: III turdagi bolgachali ribozimlar; HPRz: soch qadag'ich ribozim; TWRz: tvister ribozim.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-fS3.jpg\" alt=\"1-rasm. S3. AlphaFold 3 asosida ishlaydigan AlphaFold Server yordamida bashorat qilingan betaviroidsimon RNKlar (βvdl786\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. S3. AlphaFold 3 asosida ishlaydigan AlphaFold Server yordamida bashorat qilingan betaviroidsimon RNKlar (βvdl786, βvdl1793, βvdl270217 va βvdl184674) tomonidan kodlanadigan taxminiy oqsillarning uchinchi darajali tuzilmalari.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-fS4.jpg\" alt=\"2-rasm. S4. Betaviroidsimon RNKlarning nukleotid va aminokislota ketma-ketligining o'xshashligi. (A) Barcha aniqlangan b\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm. S4. Betaviroidsimon RNKlarning nukleotid va aminokislota ketma-ketligining o'xshashligi. (A) Barcha aniqlangan betaviroidsimon RNK nukleotid ketma-ketliklarining o'xshashlik foizi matritsasini aks ettiruvchi issiqlik xaritasi (Heatmap). (B) O'n beshta betaviroidsimon RNK tomonidan kodlangan taxminiy oqsillarning (ORF A va ORF B) aminokislota ketma-ketliklarining o'xshashlik foizi matritsasini aks ettiruvchi issiqlik xaritasi (Heatmap).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-fS5.jpg\" alt=\"Rasm S5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S5&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-fS6.jpg\" alt=\"Rasm S6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S6&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"jadvallar\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#jadvallar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Jadvallar&lt;/span&gt;&lt;/a&gt;Jadvallar&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 1.&lt;/strong&gt; III tip HHRz lardan boshqa ribozimlarni o'z ichiga olgan taxminiy zeta-viruslar ro'yxati.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;ID&lt;/th&gt;\n&lt;th&gt;Contig&lt;/th&gt;\n&lt;th&gt;Genom h
