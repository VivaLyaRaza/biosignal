        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"241\" cy=\"128\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"639\" cy=\"280\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Inson gipokampusining&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;rivojlanish xaritasi va&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Altsgeymer kasalligi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f1.jpg\" alt=\"Figure 1. Human Developing Hippocampus Atlas (HuDeHA) captures the temporal dynamics of hippocampal development from ear\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 1. Human Developing Hippocampus Atlas (HuDeHA) captures the temporal dynamics of hippocampal development from early embryonic to postnatal stages.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Olimlar embrion davridan o‘smirlik yoshigacha bo‘lgan davrni qamrab oluvchi inson gipokampusining yagona hujayrali xaritasini yaratishdi. Uning yordamida oilaviy Altsgeymer kasalligini keltirib chiqaruvchi mutatsiyaga ega miya organoidlari o‘rganildi. Tahlillar hujayra tarkibining o‘zgargani va neyronlarning muddatidan oldin yetilganini ko‘rsatdi. Ushbu yangi ma'lumotlar bazasi laboratoriyada nevrologik kasalliklarni aniqroq modellashtirishga yordam beradi.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"a-lifespan-single-cell-atlas-of-the-human-developing-hippocampus-benchmarks-familial-alzheimers-disease-brain-organoids\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#a-lifespan-single-cell-atlas-of-the-human-developing-hippocampus-benchmarks-familial-alzheimers-disease-brain-organoids\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;A lifespan single-cell atlas of the human developing hippocampus benchmarks familial Alzheimer's disease brain organoids&lt;/span&gt;&lt;/a&gt;A lifespan single-cell atlas of the human developing hippocampus benchmarks familial Alzheimer's disease brain organoids&lt;/h3&gt;\n&lt;p&gt;Ushbu kirish bo'limida AQShning nufuzli ilmiy markazlari, jumladan Pitsburg universiteti va Garvard tibbiyot maktabi tadqiqotchilari Petr Baranov rahbarligida ishning mavzusi va mualliflarini taqdim etadilar.&lt;/p&gt;\n&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Mualliflar APP, PSEN1 va PSEN2 genlaridagi mutatsiyalar sabab bo'ladigan oilaviy Altsgeymer kasalligini o'rganadilar, bunda gippokamp birinchilardan bo'lib zararlanadi. Tadqiqotchilar 3 haftadan 15.3 yoshgacha bo'lgan davrni qamrab oluvchi 658 059 ta hujayradan iborat Inson rivojlanayotgan gippokamp atlasini (HuDeHA) yaratdilar. Ushbu ma'lumotlar bazasi Kolumbiya aholisida uchraydigan PSEN1E280A mutatsiyasiga ega miya organoidlarini baholash uchun ishlatildi. Xaritalash jarayonida radial gliyaning kamaygani, nerv crest'dan kelib chiqqan neyronlarning ko'paygani hamda MEIS2 va TTR oqsili darajasining o'zgargani aniqlandi. Natijalar HuDeHA organoidlarni o'rganishda muhim standart ekanini ko'rsatdi.&lt;/p&gt;\n&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Bu bo'lim tadqiqotning dolzarbligiga kirish bo'lib, Altsgeymer kasalligining ilk bosqichlarini tushunish uchun yagona transkriptom atlas yaratish zaruriyatini asoslaydi.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"human-developing-hippocampus-atlas-hudeha-resolves-major-cell-classes-across-pre-and-postnatal-timeline\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#human-developing-hippocampus-atlas-hudeha-resolves-major-cell-classes-across-pre-and-postnatal-timeline\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Human Developing Hippocampus Atlas (HuDeHA) resolves major cell classes across pre- and postnatal timeline&lt;/span&gt;&lt;/a&gt;Human Developing Hippocampus Atlas (HuDeHA) resolves major cell classes across pre- and postnatal timeline&lt;/h4&gt;\n&lt;p&gt;Mualliflar miya organoidlarini tahlil qilish uchun ishonchli etalon yaratish maqsadida 658 059 ta hujayrani o'z ichiga olgan inson rivojlanayotgan gipokampusi atlasini (HuDeHA) tuzdilar. Ushbu keng qamrovli ma'lumotlar bazasi homilaning 3-haftasidan 16-haftasigacha (PCW3–PCW16) bo'lgan barcha davrlarni, shuningdek, keyingi homila, tug'ilgandan keyingi bosqichlarni va o'smirlik davrini o'z ichiga oladi. Neyron va noreyron liniyalarning kiritilishi hujayra turlari va yetilish traektoriyalarini normal holatda batafsil tavsiflash imkonini berdi.&lt;/p&gt;\n&lt;p&gt;Bunday atlasning yaratilishi organoidlarni talqin qilishdagi qiyinchiliklarni bartaraf etish uchun zarur edi, chunki organoid hujayralari ko'pincha geterogen va yetilmagan bo'ladi. HuDeHA ni mos yozuvlar xaritasi sifatida ishlatib, tadqiqotchilar PSEN1(E280A) mutatsiyasiga ega organoidlardagi hujayra populyatsiyalarini aniq aniqlashdi va haqiqiy patologik o'zgarishlarni yetishtirish artefaktlaridan ajratib olishdi. Taqqoslash natijalari shuni ko'rsatdiki, mutant organoidlar radial gliyaning kamayishi, nerv crestidan kelib chiqqan neyronlarning ko'payishi va yetilish dasturlaridagi o'ziga xos siljishlar bilan ajralib turadi.&lt;/p&gt;\n&lt;h4 id=\"hudeha-fad-organoidlari-malumotlarini-etalon-asosida-xaritalash-imkonini-beradi\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#hudeha-fad-organoidlari-malumotlarini-etalon-asosida-xaritalash-imkonini-beradi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HuDeHA fAD organoidlari ma'lumotlarini etalon asosida xaritalash imkonini beradi&lt;/span&gt;&lt;/a&gt;HuDeHA fAD organoidlari ma'lumotlarini etalon asosida xaritalash imkonini beradi&lt;/h4&gt;\n&lt;p&gt;Mualliflar dastlab 107 ta to'plamdagi jami 658 059 ta hujayrani o'z ichiga olgan inson rivojlanayotgan hippokampusi atlasini (HuDeHA) tuzdilar (Rasm 1A; Rasm S1A, B; Jadval S1). Ma'lumotlar homiladorlikning 3-haftasidan boshlab to postnatal o'smirlik davrigacha (15.3 yoshgacha) bo'lgan bosqichlarni qamrab oldi. Ma'lum marker genlar yordamida tadqiqotchilar HuDeHA atlasida 20 ta asosiy hujayra sinfini aniqladilar (Rasm 1D). Neyroektodermal yo'nalishlarga radial gliya, oraliq o'tmishdosh hujayralar, yosh va yetuk neyronlar, shuningdek Kahal-Retsius hujayralari kirdi. Gliya qatoriga gliya o'tmishdoshlari, oligodendrotsit o'tmishdoshlari, yetuk oligodendrotsitlar va astrositlar kiritildi. Shuningdek, ependim hujayralari, xoroid plexus, nerv taroxi populyatsiyalari hamda mezensxima, endoteliy va mikrogliya kabi noektodermal hujayralar aniqlandi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f1.jpg\" alt=\"Figure 1. Human Developing Hippocampus Atlas (HuDeHA) captures the temporal dynamics of hippocampal development from ear\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 1. Human Developing Hippocampus Atlas (HuDeHA) captures the temporal dynamics of hippocampal development from early embryonic to postnatal stages.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Homilaning 3-haftasidan boshlab 15.3 yoshgacha bo'lgan davrda hujayralar tarkibining o'zgarishi dinamikasi tahlil qilindi (Rasm 1B, C; Rasm S1D). Erta embrional namunalarda radial gliya va nerv taroxi hujayralari ko'p bo'lsa, keyingi bosqichlarda erta neyronlar ko'payib, gliya o'tmishdoshlari paydo bo'ldi. Postnatal namunalar yetuk neyronlar va differensiallashgan gliyalarga boy edi. CytoTRACE2 algoritmi yordamida rivojlanish salohiyati bahòlanganda, hujayralar yetilishiga qarab salohiyat pasayib borishi aniqlandi (Rasm 1G; Rasm S1C): proliferatsiyalanuvchi o'tmishdoshlarda yuqori bo'lgan ballar yetuk neyronlar va astrositlarda minimal ko'rsatkichlargacha kamaydi.&lt;/p&gt;\n&lt;h4 id=\"stem-cell-malumotlarini-tahlil-qilish-va-hujayralarni-annotatsiya-qilish\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#stem-cell-malumotlarini-tahlil-qilish-va-hujayralarni-annotatsiya-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Stem cell ma'lumotlarini tahlil qilish va hujayralarni annotatsiya qilish&lt;/span&gt;&lt;/a&gt;Stem cell ma'lumotlarini tahlil qilish va hujayralarni annotatsiya qilish&lt;/h4&gt;\n&lt;p&gt;Mualliflar PSEN1 va APOE genlari bo'yicha har xil genotiplarga ega bo'lgan induksiyalangan pluripotent o'zak hujayralaridan (iPSC) olingan miya organoidlari bo'yicha scRNA-seq ma'lumotlar to'plamidan foydalandilar (jami sakkizta hujayra liniyasi). Ma'lumotlarni integratsiya qilish va belgilash uchun tadqiqotchilar HuDeHA ma'lumotlariga asoslangan yarim nazorat ostidagi scPoli neyron tarmoq modelini qo'lladilar (Rasm 2A). Bu yondashuv o'tmishdoshlar, neyronlar, epitelial/ventrikulyar, mezenximal va nerv qirrasi (NC) liniyalarini muvaffaqiyatli aniqlash imkonini berdi (Rasm 2B). Shu bilan birga, differensatsiyalashgan glial, immun yoki qon tomir hujayralari aniqlanmadi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f2.jpg\" alt=\"Figure 2. Reference mapping to HuDeHA enables comparison of iPSC-derived brain organoids with in vivo hippocampal cell s\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 2. Reference mapping to HuDeHA enables comparison of iPSC-derived brain organoids with in vivo hippocampal cell states and developmental time. (A) Schematic of the analysis workflow. HuDeHA (PCW 3 to 15.3 years; 20 annotated cell classes) served as reference for scPoli-based transfer of cell-class and developmental-age labels to iPSC- derived PSEN1WT and PSEN1E280A human brain organoids. scPoli was trained on the intersection gene set between reference and query (22,467 genes), and organoid cells were projected into the learned latent space for label prediction. (B) UMAP of iPSC-derived human brain organoids colored by 12 predicted cell classes inferred from HuDeHA, followed by limite&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Neyronlar liniyasida progenitor hujayralar (IPC), shuningdek erta va yetuk neyronlar ajratildi, bunda erta neyronlar (19 131 ta hujayra) va radial gliya (18 384 ta hujayra) ustunlik qildi, IPC (1 308 ta) va yetuk neyronlar (877 ta) esa juda kam uchradi. IPC hujayralari ASCL1 va HES6 markerlarini namoyon etdi, erta neyronlar TUBB3, STMN2 va DCX ni kuchli ekspressiya qildi, yetuk neyronlar esa GRIN2B va GRIA2 ni ifodaladi (Rasm 2C, D). Bundan tashqari, asosan NC kompartmentida kuchli S100B signali kuzatildi (Rasm 2B, C), bu hududda MPZ, FOXD3 va SOX10 markerlari ham aniqlandi (Rasm 2D). Olingan natijalar organoidlarning hujayra tarkibini batafsil tavsiflaydi.&lt;/p&gt;\n&lt;h4 id=\"huayunlash-noaniqligini-tahlil-qilish-va-maxsus-populyatsiyalarni-aniqlash\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#huayunlash-noaniqligini-tahlil-qilish-va-maxsus-populyatsiyalarni-aniqlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Huayunlash noaniqligini tahlil qilish va maxsus populyatsiyalarni aniqlash&lt;/span&gt;&lt;/a&gt;Huayunlash noaniqligini tahlil qilish va maxsus populyatsiyalarni aniqlash&lt;/h4&gt;\n&lt;p&gt;Mualliflar hujayralarni tasniflash modelining ishonchliligini baholadilar; u umumiy jihatdan yuqori natija ko'rsatgan bo'lsa-da, ependima, glial progenitorlar va xorioid chigal uchun yuqoriroq noaniqlikni qayd etdi (Rasm S2A). Muqobil joylashtirish va kanonik markerlardan foydalangan holda, tadqiqotchilar HuDeHA nazorat atlasida to'g'ridan-to'g'ri o'xshashiga ega bo'lmagan, CFAP genlariga (CFAP126, CFAP144, CFAP276, CFAP141, CFAP90) boy bo'lgan alohida hujayra guruhini aniqladilar (Rasm S2B). Ushbu populyatsiya erta ependimal hujayralar sifatida tasniflandi va FOXJ1 ekspressiyasi hamda tsiliogenez dasturining qisman ishga tushishi bilan ajralib turdi, biroq ularda kipriklar yig'ilishining asosiy genlari yetishmas edi [6, 20, 21]. Bu hujayralar shuningdek xorioid chigal markerlari bilan qisman mos keldi, bu organoidlardagi qorinchalar epiteliyasining differentsiatsiyasi to'liq emasligidan dalolat beradi.&lt;/p&gt;\n&lt;h4 id=\"glial-progenitorlar-va-radial-gliyaning-xarakteristikasi\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#glial-progenitorlar-va-radial-gliyaning-xarakteristikasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Glial progenitorlar va radial gliyaning xarakteristikasi&lt;/span&gt;&lt;/a&gt;Glial progenitorlar va radial gliyaning xarakteristikasi&lt;/h4&gt;\n&lt;p&gt;Glial progenitorlar dorsal o'rta chiziq va tom plitasi markerlari, jumladan LMX1A/B, MSX1 va GDF7 bilan boyiganligini ko'rsatdi (Rasm S2C), shuningdek WNT oilasi genlarining tanlangan ekspressiyasini namoyon etdi (Rasm 2C, Rasm S2C). Shu bilan birga, in vivo glial progenitorlarning klassik markerlari (TNC, BCAN, NFIB) organoidlarda zaif ekspressiya qilindi yoki umuman yo'q edi (Rasm S2D). Radial glia ham bashorat qilish ishonchliligining pasayishini ko'rsatdi (Rasm S2A), bu organoidlardagi holatlarning turlicha ekanligi bilan izohlanadi: SOX2 va NES kabi asosiy markerlar bilan bir qatorda, bu hujayralar glial progenitorlarga xos genlarni ham qisman namoyon etdi.&lt;/p&gt;\n&lt;h4 id=\"organoidlarning-etalon-atlas-bilan-transkripsion-oxshashligini-baholash\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#organoidlarning-etalon-atlas-bilan-transkripsion-oxshashligini-baholash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Organoidlarning etalon atlas bilan transkripsion o'xshashligini baholash&lt;/span&gt;&lt;/a&gt;Organoidlarning etalon atlas bilan transkripsion o'xshashligini baholash&lt;/h4&gt;\n&lt;p&gt;In vivo va organoid hujayralari o'rtasidagi o'xshashlik darajasini mustaqil baholash uchun mualliflar eng ko'p farqlanuvchi 1500 ta gen bo'yicha Jakkard o'xshashligi va Pirson korrelyatsiyasini hisobladilar (Rasm 2E, Rasm S3A-C). Etalon atlas bilan eng yuqori muvofiqlik mezenximal hujayralar (Jakkard indeksi 0.38) va erta neyronlarda (0.32) kuzatildi, bu organoid modelida asosiy neyronal va mezenximal xususiyatlarning saqlanib qolishini tasdiqlaydi. Ko'payuvchi progenitorlar radial glia va ko'payuvchi hujayralar bilan mos keldi (0.32 va 0.29). Erta ependimal populyatsiya barcha referent sinflar bilan bir xilda past o'xshashlikni ko'rsatdi va bu uning organoidga xos ekanligini tasdiqladi. Nazorat populyatsiyalari organoidlar bilan sezilarli o'xshashlik ko'rsatmadi, qo'shimcha tahlillar esa bu qonuniyatlarni to'liq tasdiqladi (Rasm S3D-F).&lt;/p&gt;\n&lt;h4 id=\"scpoli-yordamida-organoidlarning-rivojlanish-bosqichlarini-bashorat-qilish\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#scpoli-yordamida-organoidlarning-rivojlanish-bosqichlarini-bashorat-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;scPoli yordamida organoidlarning rivojlanish bosqichlarini bashorat qilish&lt;/span&gt;&lt;/a&gt;scPoli yordamida organoidlarning rivojlanish bosqichlarini bashorat qilish&lt;/h4&gt;\n&lt;p&gt;Tadqiqotchilar fAD organoidlari ma'lumotlar to'plamidagi rivojlanish bosqichlari o'xshashligini baholash uchun HuDeHA yosh annotatsiyalariga tayanib scPoli vositasidan foydalandilar. Rasm 2F da ko'rsatilishicha, bashorat qilingan organoid holatlari erta prenatal davrdan tortib postnatal davrgacha bo'lgan oraliqni qamrab olib, yoshga bog'liq mo'tadil tashkil etilishini ko'rsatdi.&lt;/p&gt;\n&lt;p&gt;Rasm 2G da keltirilgan miqdoriy tahlil natijalariga ko'ra, organoid hujayralarining mutlaq ko'pchiligi erta prenatal muddatlarga (asosan PCW4–PCW9 haftalariga) to'g'ri keldi. Shu bilan birga, atigi 1% ga yaqin hujayralar PCW11 va undan keyingi bosqichlarga, jumladan postnatal yoshga mos kelishi aniqlandi.&lt;/p&gt;\n&lt;p&gt;Mualliflar har bir hujayra turi uchun yosh guruhlariga to'g'ri keluvchi hujayralar ulushini hisoblab, issiqlik xaritasi shaklida tasvirladilar (Rasm 2H). Olingan taqsimot biologik rivojlanish qonuniyatlariga to'liq mos keldi: o'zak hujayralar va neyron bo'lmagan populyatsiyalar (proliferatsiyalanuvchi O'zak hujayralar, mezenximal va neyron qatlam hujayralari) erta yoshlarga xos bo'lsa, yetuk neyronlar va ependima-simon hujayralar kabi yetukroq turlar kechki va postnatal bosqichlarga mos kelishi bashorat qilindi.&lt;/p&gt;\n&lt;h4 id=\"psen1e280a-organoids-display-differences-in-cell-class-composition-and-transcriptional-profiles\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#psen1e280a-organoids-display-differences-in-cell-class-composition-and-transcriptional-profiles\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PSEN1E280A organoids display differences in cell-class composition and transcriptional profiles&lt;/span&gt;&lt;/a&gt;PSEN1E280A organoids display differences in cell-class composition and transcriptional profiles&lt;/h4&gt;\n&lt;p&gt;Ushbu bo‘limda mualliflar PSEN1E280A mutatsiyasi nazorat (PSEN1WT) organoidlariga nisbatan hujayra tarkibi va genlar ekspressiyasiga qanday ta'sir qilishini tekshirdilar. Hujayra turlarining nisbatlarini aniqlash uchun bayes yondashuviga asoslangan scCODA usuli qo‘llanildi (Rasm 3A-B). Tahlil natijasida mutant organoidlarda asab tizimi crest hujayralaridan kelib chiqqan neyronlar (NC-derived neurons) soni ishonchli oshgani, radial gliya hujayralari esa kamaygani aniqlandi. Bu hujayra holatining o‘zgarganidan dalolat beradi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f3.jpg\" alt=\"Figure 3. PSEN1E280A is associated with altered lineage balance and cell-class-specific dysregulation of neuronal specif\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 3. PSEN1E280A is associated with altered lineage balance and cell-class-specific dysregulation of neuronal specification, progenitor, and ventricular programs.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Shuningdek, tadqiqotchilar har bir hujayra sinfi uchun taxminiy biologik yoshni baholadilar (Rasm 3C). Cliff’s delta ko‘rsatkichi yordamida o‘tkazilgan tahlil shuni ko‘rsatdiki, mutant organoidlardagi ko‘payuvchi o‘tmishdoshlar va NC-neyronlar nazoratga qaraganda «yoshroq» xususiyatga ega (mos ravishda 5.5 va 6.7 hafta). Differensial ekspressiya tahlili eng ko‘p o‘zgarishlar NC hujayralari, neyronlar va xoroid chig‘anog‘ida kuzatilganini ko‘rsatdi (Rasm 3D). Xususan, yetuk va erta neyronlarda MEIS2, MEIS1, NR2F1 va TAC1 genlari oshgani, shuningdek HES6, NEUROD1 va NFIA kabi neyrogenez regulyatorlari faollashgani aniqlandi. Ko‘payuvchi hujayralarda S100B va APOE darajasi oshib, WNT yo‘li bilan bog‘liq genlar kamaydi. Xoroid chig‘anog‘ida TTR va mitoxondrial transkriptlar pasayib, FOLR1 va MSX1 ortgani qayd etildi (S2-jadval).&lt;/p&gt;\n&lt;p&gt;Nihoyat, mualliflar signal yo‘llarining boyishini mutant va nazorat organoidlari o‘rtasida, shuningdek HuDeHA mos yozuvlar hujayralari bilan taqqosladilar (Rasm S4A-B). Eng yaqqol farqlar ko‘payuvchi o‘tmishdoshlarda kuzatildi, bunda mutantlarda WNT yo‘liga oid ko‘rsatkichlar pastroq bo‘lib chiqdi.&lt;/p&gt;\n&lt;h4 id=\"neuronal-trajectory-analysis-reveals-altered-maturation-dynamics\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#neuronal-trajectory-analysis-reveals-altered-maturation-dynamics\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Neuronal trajectory analysis reveals altered maturation dynamics&lt;/span&gt;&lt;/a&gt;Neuronal trajectory analysis reveals altered maturation dynamics&lt;/h4&gt;\n&lt;p&gt;Ushbu kichik bo‘lim sarlavhasi keyingi tadqiqot bosqichiga kirish bo‘lib xizmat qiladi, unda mualliflar mutatsiya sharoitida yetilish dinamikasini batafsil o‘rganish uchun neyronlarning rivojlanish traektoriyalarini tahlil qiladilar.&lt;/p&gt;\n&lt;h4 id=\"neuronal-lineage-and-pseudotime-analysis\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#neuronal-lineage-and-pseudotime-analysis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Neuronal lineage and pseudotime analysis&lt;/span&gt;&lt;/a&gt;Neuronal lineage and pseudotime analysis&lt;/h4&gt;\n&lt;p&gt;Tadqiqotchilar in vivo mos yozuv sifatida HuDeHA ma'lumotlaridan foydalangan holda oraliq ajdod hujayralari (IPC), erta va yetuk neyronlar bo'ylab soxta vaqt (pseudotime) traektoriyasini tuzdilar va uni kuchga asoslangan embeding yordamida vizualizatsiya qildilar (Rasm 4A, B). Tahlil natijalariga ko'ra, soxta vaqtning boshlang'ich bosqichlarida neyrogen taqdirni belgilovchi transkripsiya omillari (NEUROG1, ASCL1, NEUROD1, NEUROD4) ustunlik qilgan bo'lsa, keyingi bosqichlarda neyron tuzilishi va sinaptik funksiyalarga mas'ul genlar (MAPT, SNAP25, SYT1, VAMP2, NLGN1) faollashgan (Rasm 4E, Rasm S5). Traektoriya oltita qismga bo'linganda, hujayra dasturlarining almashinuvi aniqlandi: boshida biosintez va metabolizm ustun kelsa, oxirida neyronlar differensiallanishi va sinaps tashkil topishi kuchaygan (Rasm 4D). Apoptoz bilan bog'liq genlar oxirida emas, balki boshida to'plangani kuzatildi. Genotiplarni taqqoslash shuni ko'rsatdiki, PSEN1WT hujayralari erta-o'rta bosqichlarda to'plangan bo'lsa, PSEN1E280A mutant hujayralari kechroq soxta vaqt bosqichlarida ko'proq namoyon bo'lib, yetukroq holatlarga siljiganligini ko'rsatdi (Rasm 4B′, C).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f4.jpg\" alt=\"Figure 4. PSEN1E280A alters neuronal differentiation toward more mature developmental states.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 4. PSEN1E280A alters neuronal differentiation toward more mature developmental states.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"in-vivo-comparison-and-discussion\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#in-vivo-comparison-and-discussion\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;In vivo comparison and Discussion&lt;/span&gt;&lt;/a&gt;In vivo comparison and Discussion&lt;/h4&gt;\n&lt;p&gt;Mualliflar HuDeHA ma'lumotlari asosida in vivo traektoriyasini qayta tikladilar va u organoidlardagidek oxirgi bosqichda hujayralarning haddan tashqari ko'payishini ko'rsatmadi (Rasm S6A–D). Pearson korrelyatsiyasi yordamida olib borilgan taqqoslash barcha organoid genotiplari in vivo traektoriyasiga nisbatan asosan erta bosqichlarga (t1–t2) yaqin ekanligini ko'rsatdi (Rasm S6E). Shunga qaramay, PSEN1E280A organoidlari kechroq soxta vaqtda HuDeHA'ning o'rta t3 bosqichiga biroz yuqoriroq o'xshashlikni ko'rsatdi. \"Muhokama\" (Discussion) bo'limida mualliflar ushbu natijalarni umumlashtirib, PSEN1E280A mutatsiyasining neyronlar differensiallanishiga ta'sirini tahlil qiladilar.&lt;/p&gt;\n&lt;h4 id=\"reference-mapping-identifies-divergent-and-organoid-specific-populations\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#reference-mapping-identifies-divergent-and-organoid-specific-populations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reference mapping identifies divergent and organoid-specific populations&lt;/span&gt;&lt;/a&gt;Reference mapping identifies divergent and organoid-specific populations&lt;/h4&gt;\n&lt;p&gt;Mualliflar HuDeHA atlasidan foydalangan holda PSEN1E280A mutatsiyasiga ega miya organoidlari hujayralarini xaritalashdi. Tahlillar shuni ko'rsatdiki, bu organoidlar asosan erta embrional rivojlanish bosqichini (taxminan 5-9 homila xaftasi, PCW) takrorlaydi, bu ushbu differensiatsiya bosqichidagi maqsadli bo'lmagan miya organoidlarining o'zak hujayra tarkibiga mos keladi. Organoidlarda yaqqol neyron liniyasi, shuningdek, neyron tizma o'xshash va mezenximal qismlar aniqlandi, ammo yetuk glial populyatsiyalar topilmadi. Neyron tizma hujayralarining mavjudligi mutatsiya natijasi emas, balki protokoldagi noneyron holatlarning xarakterli kengayishi bilan izohlanadi.&lt;/p&gt;\n&lt;p&gt;Neyron liniyasida radial glia va erta neyronlar ustunlik qildi, oraliq o'zak hujayralar va yetuk neyronlar esa kamchilikni tashkil etdi. HuDeHA etaloniga qiyoslaganda, xoroid pleksus va ependimal o'xshash populyatsiyalar in vivo holatiga cheklangan darajada o'xshashligi aniqlandi, bu organoidlardagi ventrikulyar hujayralarning yetilmaganligini bildiradi. Shuningdek, HuDeHAda to'g'ridan-to'g'ri o'xshashiga ega bo'lmagan,tsiliogenez dasturi qisman faollashgan yetuk bo'lmagan qorincha epiteliy populyatsiyasi topildi. Glial o'zak hujayralarga o'xshash populyatsiya tom qismi (roof plate) va kortikal gem markerlarini namoyon etib, bu haqiqiy glia emas, balki kortikal gemga yaqin signal holatini anglatishini ko'rsatdi.&lt;/p&gt;\n&lt;h4 id=\"tarkibiy-tahlil-va-hujayra-muvozanati\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#tarkibiy-tahlil-va-hujayra-muvozanati\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tarkibiy tahlil va hujayra muvozanati&lt;/span&gt;&lt;/a&gt;Tarkibiy tahlil va hujayra muvozanati&lt;/h4&gt;\n&lt;p&gt;Mualliflar PSEN1E280A mutatsiyasi organoidlardagi hujayra liniyalari taqsimotiga qanday ta'sir qilishini aniqlash uchun tarkibiy tahlil o'tkazdilar. Tahlil natijasida radial gliya hujayralari kamaygani va nerv nishoni populyatsiyasi oshgani aniqlanib, hujayra muvozanati buzilganligi ko'rsatildi.&lt;/p&gt;\n&lt;p&gt;Bunday o'zgarishlar o'tmishdosh hujayralar xatti-harakati o'zgarganidan dalolat beradi: ular radial gliyani saqlab qolishga qiynaladi va neyronlarga tezroq differentsiatsiyalanadi. Nerv nishoni hujayralari soni differentsiatsiya usuliga ham bog'liq bo'lishi mumkinligi sababli, tadqiqotchilar bu o'sishni mutatsiyaning bevosita oqibatidan ko'ra, u bilan bog'liqlik sifatida talqin qilishadi. Umuman olganda, ushbu natijalar ilk rivojlanish signallari buzilganda hujayra liniyalarini tanlash jarayoni o'zgarishi haqidagi g'oyani tasdiqlaydi [28].&lt;/p&gt;\n&lt;h4 id=\"neuronal-trajectory-analysis-uncoversaltered-developmental-progression\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#neuronal-trajectory-analysis-uncoversaltered-developmental-progression\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Neuronal trajectory analysis uncoversaltered developmental progression&lt;/span&gt;&lt;/a&gt;Neuronal trajectory analysis uncoversaltered developmental progression&lt;/h4&gt;\n&lt;p&gt;Ushbu bo'limda mualliflar PSEN1E280A mutatsiyasi hujayra differentsiatsiyasiga qanday ta'sir qilishini tushunish uchun neyronlarning rivojlanish traektoriyalarini o'rganishdi. Tahlillar shuni ko'rsatdiki, mutant organoidlar hujayra taqdirini belgilash, progenitor dasturlar va qorincha epiteliyasi tuzilmalariga ta'sir qiluvchi transkripsiya faolligidagi jiddiy o'zgarishlarni boshdan kechiradi. Xususan, MEIS2, MEIS1, NR2F1 va TAC1 omillari ekspressiyasining turg'un o'sishi kuzatildi, bu hududiy naqshlar o'zgarganidan dalolat beradi. Radial gliya hujayralari S100B va APOE darajasining oshishini ko'rsatdi, bu yetuk populyatsiyalar paydo bo'lishidan oldin ham glialarning patologik jarayonlarga erta qo'shilishini aks ettiradi.&lt;/p&gt;\n&lt;p&gt;Olimlar HES6 va NEUROD1 ekspressiyasining kuchayishi orqali erta neyrogen dasturlarning faollashishini qayd etdilar, ammo bu yetuk yetilishdan ko'ra yetuk bo'lmagan differentsiatsiyalangan holatning cho'zilib ketishidan dalolat beradi. Xoroid chigaliga bog'liq populyatsiyalarda beta-amiloidni bog'lash uchun muhim oqsil bo'lgan transtiretin (TTR) darajasining sezilarli darajada pasayishi aniqlandi. Bu Altsgeymer kasalligi patogeneziga xos bo'lgan sekretor funksiyaning buzilishi va Aβ klirensining erta nuqsonlarini ko'rsatishi mumkin.&lt;/p&gt;\n&lt;p&gt;Signal yo'llarini taqqoslash progenitorlarda Notch faolligining o'rtacha pasayishini ko'rsatdi, WNT yo'llarining bostirilishi esa radial gliya hujayralarining yo'qolishi va neyronlarning yetilishidagi siljishning ehtimoliy sababi sifatida ko'rildi. Xaritalash yordamida hujayralarning biologik yoshini baholash organoidlarning homiladorlikning 5-9 haftalariga (birinchi trimestr) mos kelishini ko'rsatdi. Shu bilan birga, mutant namunalar yovvoyi tipga nisbatan progenitorlar va neyronlar uchun yoshroq yoshga qarab biroz siljishni ko'rsatdi.&lt;/p&gt;\n&lt;h4 id=\"cheklovlar\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#cheklovlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar&lt;/span&gt;&lt;/a&gt;Cheklovlar&lt;/h4&gt;\n&lt;p&gt;Ushbu tadqiqotda bir qator cheklovlar mavjud. Organoidlarning ma'lumotlar to'plamida faqat ikkita PSEN1WT va oltita PSEN1E280A organoidlari mavjud bo'lib, ular bitta nashr etilgan tadqiqotdan olingan. Bu statistik quvvatni pasaytiradi va mutatsiya ta'sirini organoidlar orasidagi o'zgaruvchanlikdan farqlashni qiyinlashtiradi. Shuningdek, asab crestiga o'xshash hujayralar populyatsiyasining ortishi to'g'ridan-to'g'ri PSEN1E280A oqibatidan ko'ra, qisman protokolga bog'liq ketma-ketlik xususiyatlarini aks ettirishi mumkin.&lt;/p&gt;\n&lt;h4 id=\"metodlar\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#metodlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Metodlar&lt;/span&gt;&lt;/a&gt;Metodlar&lt;/h4&gt;\n&lt;p&gt;HuDeHA yig'ish uchun ma'lumotlarni yig'ish va oldindan qayta ishlash&lt;/p&gt;\n&lt;h4 id=\"malumotlarni-yigish\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#malumotlarni-yigish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ma'lumotlarni yig'ish&lt;/span&gt;&lt;/a&gt;Ma'lumotlarni yig'ish&lt;/h4&gt;\n&lt;p&gt;Mualliflar miya organoidlari hujayra holatlarini solishtirish hamda ularni in vivo rivojlanish jarayonlari bilan qiyoslash uchun asos bo'ladigan HuDeHA ma'lumotlar bazasini shakllantirish uchun zarur bo'lgan boshlang'ich ma'lumotlarni yig'ish bosqichini bayon qilishdi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f5.jpg\" alt=\"Figure 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 5&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Organoidlar&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tuzilishini&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;baholash&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qiyinligi&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\
