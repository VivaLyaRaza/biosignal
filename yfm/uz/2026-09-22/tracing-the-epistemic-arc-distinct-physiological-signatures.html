            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"136\" cy=\"85\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"544\" cy=\"242\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Miya san'at asarini&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;tushunishdan qanday zavq&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;oladi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-f1.jpg\" alt=\"1-rasm: Haqiqiy sarlavhali san'at asarlari «nomsiz» san'atga qaraganda yuqoriroq tushunish tuyg'usini uyg'otadi (oldingi\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Haqiqiy sarlavhali san'at asarlari «nomsiz» san'atga qaraganda yuqoriroq tushunish tuyg'usini uyg'otadi (oldingi topilmalarni takrorlash). a) Eksperimental ketma-ketlik: Ishtirokchilar vizual san'at tasvirlarini ko'rdilar va uning sarlavhasiga bo'lgan qiziqishini baholashni so'rashdi. Keyin san'at asari sarlavhasi keldi - asl sarlavha yoki ma'lumotsiz soxta («nomsiz»). Keyin ular asl tasvirni yana ko'rdilar va ularning aha hissi, estetik yoqtirishi va asarni tushunganliklarini baholashni so'rashdi. Vizual san'at asarlaridan tashqari, Mooney tasvirlari seriyasi (Mooney &amp;amp; Ferguson, 1951) taqdim etildi (tasodifiy aralashtirilgan). Haqiqiy yoki soxta sarlavha o'rniga Mooney tasvirini yaratish uchun ishlatilgan asosiy fotosurat ko'rsatildi. b) Tushunishga sarlavha effektini takrorlash, ammo estetik yoqtirishga emas: skripka diagrammalari barcha baholarning taqsimlanishini ko'rsatadi (56 ishtirokchi bo'ylab n=3090) har bir ogohlantiruvchi kategoriya uchun alohida (3 darajadagi figurativlikdagi vizual san'at va Mooney tasvirlari), sarlavha sharti bo'yicha bo'lingan (haqiqiy yoki nomsiz; barcha Mooney tasvirlari o'zlarining haqiqiy asosiy fotografiyasi bilan birga kelgan, bu yerda sarlavhali deb tasniflangan). Biz san'atning barcha 3 toifasida mavjud bo'lgan sezilgan tushunishga sarlavha manipulyatsiyasining kuchli ta'sirini takrorladik, ammo estetik yoqtirish uchun sezilarli farqlar yo'q.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Murakkab kartinaga qarab uning ma'nosini to'satdan anglab yetganimizda, miyada o'ziga xos reaksiyalar zanjiri ishga tushadi. Tadqiqotchilar bu bilish jarayonini dastlabki qiziquvchanlikdan estetik zavqgacha kuzatib borishdi. Ma'lum bo'lishicha, ushbu bosqichlarning har biri organizmda o'ziga xos fiziologik iz qoldiradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Qiziquvchanlik va anglash yagona bilish zanjirini hosil qiladi&lt;/li&gt;\n&lt;li&gt;Qorachiq hajmi kartinani tushunish momentini fosh etadi&lt;/li&gt;\n&lt;li&gt;Estetik zavq miyaning tezkor reaksiyasi bilan bog'liq&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Insonning bilish jarayoni ko'pincha noaniqlik holatidan to'satdan tushunishga o'tish bilan bog'liq bo'lib, bu aha-samare deb ataladigan o'zarish tuyg'usi bilan kechadi. Mualliflar rangtasvirni qabul qilish jarayonida ushbu dinamikani qayd etish uchun psixologik so'rovlarni elektroensefalografiya (EEG), elektrokardiogramma (EKG) va ko'z harakatlarini kuzatish bilan birlashtirdilar.&lt;/p&gt;\n&lt;p&gt;Eksperimentda ikki guruh ishtirok etdi: xulq-atvor qismida 55 kishi va fiziologik tadqiqotda 49 kishi qatnashdi. Ishtirokchilarga kanvaslar ko'rsatilib, asarning nomiga nisbatan qiziquvchanligi baholandi, so'ngra asl yoki soxta sarlavha taqdim etilib, tushunish va zavqlanish darajasi o'lchandi.&lt;/p&gt;\n&lt;p&gt;Tahlillar shuni ko'rsatdiki, anglash tuyg'usi estetik zavq bilan chiziqli, tushunish bilan esa nochiziqli bog'langan. Fiziologik ko'rsatkichlar tushunish uzoq davom etuvchi faollikda, aha-samare qorachiq hajmida, estetik yoqtirish esa EEGning dastlabki tezkor javoblarida namoyon bo'lishini ko'rsatdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot subyektiv baholarga tayanadi va natijalarni mustaqil tekshirish talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Qiziquvchanlikdan (motivatsion holat) ichki tushunishga (noaniqlikni kamaytirish) va zavqqa (mukofot va rag'batlantirish) qadar davom etadigan ichki holatlar ketma-ketligi motivatsiyalangan o'rganish uchun fundamental yo'lni ifodalashi mumkin. Ushbu ishda biz ushbu epistemik yoyning konturini chizish va uning neyron korrelatsiyalarini kuzatish uchun qiziquvchanlik, ichki tushunish (aha effekti), tushunish va yoqtirish o'lchovlarini birlashtiruvchi yondashuvni taqdim etamiz.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot qiziquvchanlikdan zavqgacha bo'lgan epistemik yoyni tasvirlaydi va uning xulq-atvor hamda neyrofiziologik korrelatsiyalarini ochib beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ikki ta oldindan ro'yxatdan o'tkazilgan tajribada biz «sarlavha effekti»dan foydalandik — qo'shimcha semantik ma'lumot san'at asarini qanday tushunish va zavqlanishni o'zgartirishi mumkin bo'lgan hodisa. Ishtirokchilar rasmlarni tomosha qilishdi va sarlavhani ko'rish istagi bo'yicha o'zlarining qiziquvchanliklarini baholadilar. Shundan so'ng ularga asl sarlavha yoki qo'shimcha ma'lumotga ega bo'lmagan soxta sarlavha ko'rsatildi, so'ngra tasvir qayta namoyish etildi va ishtirokchilar aha effektining kuchi, estetik zavq va san'at asarini tushunish tuyg'usini baholadilar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Preregistratsiya — tadqiqot boshlanishidan oldin uning gipotezalari va metodologiyasini rasman qayd etish jarayoni bo'lib, natijalarni soxtalashtirishning oldini oladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;O'tkazilgan xulq-atvor tadqiqotida (n = 55 ishtirokchi) biz sarlavhali tasviriy san'at kuchli aha tuyg'usini keltirib chiqarishini empirik tarzda aniqladik. Baholashlar orasidagi bog'liqlik murakkab bo'lib, stimullardagi ma'lumotlarning turi va miqdori bilan belgilanadi; masalan, aha effekti yoqtirish bilan chiziqli, tushunish bilan esa chiziqli bo'lmagan tarzda bog'langan. EKG, EEG va ko'zni kuzatish (eyetracking) qurilmalari yordamida o'tkazilgan tadqiqotda (n = 49 ishtirokchi) biz ishlov berish ketma-ketligini kuzatish uchun vaqt bo'yicha hal qilingan dekodlashdan foydalandik. Tushunish jarayonini uzoq vaqt davomida turli (neyro)fiziologik korrelatsiyalar asosida dekodlash mumkin.&lt;/p&gt;\n&lt;p&gt;Sarlavhalardan oldin ham, keyin ham qiziquvchanlikni ishonchli dekodlash uning epistemik yoydagi ahamiyatini tasdiqlaydi. Aha effektini qorachiq hajmidan dekodlash mumkin edi, ammo EEG ma'lumotlaridan emas. Nihoyat, tez boshlang'ich EEG javobi estetik zavq bilan bog'liq edi. Ko'p narsalarni o'rganish hali oldinda bo'lsa-da, bizning tadqiqotimiz motivatsiyalashgan ma'lumotlarni izlashning asosiy xulq-atvor va fiziologik xususiyatlariga yangi oyna ochadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot nisbatan kichik hajmumdagi ishtirokchilar guruhi (n = 55 va n = 49) asosida o'tkazilgan bo'lib, xulosalarni umumlashtirishda ehtiyotkorlikni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kalit so'zlar: MVPA dekodlash · kognitsiya · axborotni qayta ishlash · ichki tushunish · vizual estetika · EEG · multimodal ma'lumotlar&lt;/p&gt;\n&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Biz doimo yangi, ehtimol noaniq stimullarga duch kelamiz va bu kirish ma'lumotlarini tushunishga harakat qilish (ya'ni izchil, ma'noli tasvirlarni shakllantirish) inson kognizatsiyasining poydevori hisoblanadi. Ko'pincha ma'no topish insaytni o'z ichiga oladi — tushunishdagi to'satdan sakrash, masalan, ilgari yechilmagan muammoning yechimi aniq bo'lib qolganda yoki yangi ma'lumot yaxshiroq tushunishga imkon berganda (Sternberg &amp;amp; Davidson, 1995). Yorqin misollarni vizual sohada topish mumkin, bu yerda noaniq stimulni idrok etishimiz birdan o'zgarib, strukturani ko'rish imkonini beradi (masalan, degradatsiyaga uchragan ikki rangli \"Muni\" tasvirlari bilan; Mooney &amp;amp; Ferguson, 1951). Insaytni noaniqlikning tez pasayishi yoki ma'lumotning ortishi sifatida tavsiflash mumkin. Yaqinda olib borilgan ishlar insaytni oldingi qiziquvchanlik holati bilan bog'ladi (Van de Cruys va b., 2021): qiziquvchanlik qanchalik katta bo'lsa, \"aha\" effekti shunchalik kuchli bo'ladi — bu insaytga hamroh bo'ladigan fenomenal tuyg'uning o'lchovidir. Ushbu topilma insaytni motivatsion doiraga joylashtirish uchun ishlatilishi mumkin: qiziquvchanlik noaniqlikni kamaytirish uchun harakatlantiruvchi holat, yaxshilangan tushunish kutilgan natija bo'lib, insayt (yoki aha) ayniqsa samarali noaniqlikni kamaytirish momentlarini belgilaydi. O'zlarining topilmalariga asoslanib, Van de Cruys va b. (2021) \"aha\" o'rganish samaradorligini optimallashtirishga va cheklangan kognitiv resurslarni hal qilinadigan vazifalarga taqsimlashga yordam beradigan metakognitiv teskari aloqa signali sifatida harakat qilishi mumkin degan gipotezani ilgari suradilar (shuningdek qarang: Laukkonen va b., 2023). Agar insayt motivatsion kaskadni qo'zg'atsa, u mukofot jarayonlarini yana-da faollashtirishi va zavq bilan bog'liq bo'lishi kerak — \"tushunishdan zavqlanish\" (Vessel, n.d.). Darhaqiqat, ba'zi tadqiqotlar \"aha\" yoqimli tuyulishi mumkinligi (Skaar &amp;amp; Reber, 2020; Shen va b., 2016) va mukofot tizimi bilan bog'liqligi haqida empirik dalillarni taqdim etadi (Cristofori va b., 2018; Oh va b., 2020). Biz ushbu jarayonlar ketma-ketligi, qiziquvchanlikdan boshlab insayt, zavq va mukofotgacha, motivatsiyalangan o'rganish uchun fundamental yo'lni — \"epistemik yoy\" deb ataladigan tushunchani anglatishi mumkinligini taxmin qilamiz (Van de Cruys va b., 2024).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Insayt metakognitiv teskari aloqa signali vazifasini bajarib, qiziquvchanlikni tushunish zavqiga aylantiradi va motivatsiyalangan o'rganishning fundamental \"epistemik yoyini\" shakllantiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bu yerda biz murakkab naturalistik stimullardan ma'no yaratishni o'rganish uchun paradigmaga taqdim etamiz. Biz yangi ma'lumotlarni boshqariladigan yetkazib berishni (bizning stimullarimiz orqali) qiziquvchanlik, insayt (aha), tushunish va yoqtirish o'lchovlari bilan birlashtiramiz, bu epistemik yoyning konturlarini belgilash hamda ularning vaqtinchalik ketma-ketligi va neyron mexanizmlarini o'rganish uchun. Van de Cruys va b. (2021) vizual sohadagi perseptiv tushunishning nisbatan past darajadagi vazifasi — ya'ni Muni tasvirlari (Mooney &amp;amp; Ferguson, 1951) yordamida insayt va ma'lumotlarni qayta ishlashni o'rganib chiqdilar, bu dastlab talqin qilish qiyin bo'lgan, lekin asl fotografiyani ko'rgandan keyin osonlikcha talqin qilinadigan fotosuratlardan olingan qora va oq ikki rangli tasvirlardir. Garchi bu usul juda samarali bo'lsa-da, shunga o'xshash mexanizmlar kognitiv ierarxiyaning yuqori qismida ham harakat qilishi aniq. Masalan, insayt turli sensorli modal ma'lumotlarni birlashtirish (masalan, yangiliklarni tomosha qilishda vizual kirish va til imo-ishoralarini birlashtirish) yoki yangi stimullarni oldingi bilimlar yoki shaxsiy xotiralar bilan kontekstga kiritish orqali erishilishi mumkin. Ushbu tadqiqotda biz vizual san'atdan foydalanamiz va \"sarlavha effekti\" deb nomlangan fanni qo'llaymiz — bu san'at asarini to'ldiradigan matnga asoslangan, semantik ma'lumotlar (masalan, lekin faqat sarlavhalar emas) kuzatuvchining vizual san'at asarini qanday tushunishi, talqin qilishiga ta'sir qilishi mumkinligi. Muni tasvirlari uchun ma'lum bir tasvir bilan aha kuchi keyingi estetik yoqtirish reytinglarini ham bashorat qilishi ko'rsatilgan (Muth &amp;amp; Carbon, 2013). Biz bu ta'sir vizual san'atga ham tarqalishini kutamiz. Aslida, insayt hatto ko'p odamlar san'atdan zavqlanishdan olishlari mumkin bo'lgan quvonch yoki ta'sirlanish hissiyotlariga hissa qo'shadigan asosiy omil bo'lishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Epistemik yoy — bu insonning qiziquvchanlik va noaniqlik holatidan o'tkir tushunish orqali muvaffaqiyatli bilish zavqiga erishish yo'lini tasvirlovchi nazariy tushunchadir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sarlavha-effekti-estetik-anglash-holatchami\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#sarlavha-effekti-estetik-anglash-holatchami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;\"Sarlavha effekti\" – estetik anglash holatchami?&lt;/span&gt;&lt;/a&gt;\"Sarlavha effekti\" – estetik anglash holatchami?&lt;/h4&gt;\n&lt;p&gt;Bir nechta psixologik tadqiqotlar sarlavhalarning tasviriy san'atni baholashga ta'sirini o'rganib chiqdi. Biz topgan barcha tadqiqotlar qo'llanilgan sarlavha manipulyatsiyasining bir yoki bir nechta qaram o'zgaruvchilarga sezilarli ta'sir ko'rsatganini xabar qilgan bo'lsa-da, natijalar to'liq bir xil emas. San'at asarini tushunish yoki uning mazmunini his qilish baholari bo'yicha eng aniq manzara namoyon bo'ladi: 6 ta tadqiqotdagi jami 10 ta tajriba sarlavha manipulyatsiyasining sezilarli ta'sirini aniqladi, holbuki 2 ta tadqiqotdagi atigi 2 ta tajribada bu kuzatilmadi. Shunga qaramay, umumiy ahamiyatsiz natijalarni e'lon qilgan tadqiqotlarda ham sarlavhali va sarlavhasiz shartlar o'rtasida farqlar mavjud edi (Russell, 2003, Exp. 1; Bubić et al., 2017). Umuman olganda, ushbu tadqiqotlar matn shaklida berilgan qo'shimcha semantik ma'lumot kuzatuvchining suratlarni subyektiv tushunishini o'zgartirishiga ishonchli dalillar taqdim etadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Oltita tadqiqotdagi o'nta tajriba sarlavhalar rasmlarni tushunishni o'zgartirishini tasdiqlaydi, estetik afzalliklarga ta'siri esa sarlavha turi va san'at janriga bog'liq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Estetik afzalliklar baholarini (masalan, yoqtirish, ta'sirlanish va hokazo) ko'rib chiqqanda, natijalar unchalik aniq emas: bir nechta tadqiqotlar sarlavhali taqdim etilgan san'at asarlari uchun sarlavhasizlarga qaraganda sezilarli darajada yuqori baholarni xabar qildi. Biroq, ko'p hollarda bu ta'sirlar faqat muayyan turdagi sarlavhalar uchun yuzaga keldi: tavsiflovchi yoki tasodifiy emas, balki tushuntiruvchi sarlavhalar uchun; semantik bog'langan, lekin bog'lanmagan sarlavhalar uchun; yoki asarning o'ziga xos mavzusini ta'kidlaydigan to'qima sarlavhalar uchun, asl sarlavhalar yoki bu tushunchani pasaytiradigan sarlavhalar uchun emas. Qolaversa, san'at asari kategoriyasi ham muhim bo'lishi mumkin: bitta tadqiqotda mos keladigan va mos kelmaydigan sarlavhalar orasidagi farq faqat mavhum san'at uchun aniq kuzatilgan, yarim mavhum yoki figurativ san'at uchun emas, holbuki ko'pchilik boshqa tadqiqotlar juda bir xil stimullar to'plamlari bilan cheklangan va shuning uchun bu masalani aniqlashtirishga yordam bera olmagan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Estetik o'z-o'zidan anglash (aesthetic aha) — bu san'at asarining mazmunini ilmiy kashfiyotga o'xshab bir zumda tushunib yetish va ravshanlik hissi bo'lib, uning hissiy bahosini oshiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Shunga qaramay, boshqa bir nechta tadqiqotlar juda o'xshash sharoitlarda nol natijalarni xabar qildi: sarlavhani sarlavhasiz bilan, tavsiflovchi sarlavhalarni batafsilroq sarlavhalar bilan, mos keladigan sarlavhalarni mos kelmaydiganlar bilan yoki faqat sarlavhalarni uzunroq matnli tavsiflar bilan taqqoslaganda. Ushbu tadqiqotlarning hech biri anglash yoki tushunish (aha) baholarini to'plamagan bo'lsa-da — bu ta'sir joriy tadqiqotda aniqlanishi kerak — oldingi ishlar past darajadagi perseptual ochilishlar uchun tushunish va estetik yoqtirish o'rtasidagi bog'liqlikni taklif qilgan: Muni tasvirlari bilan olingan anglash kuchi estetik afzallik baholarini ijobiy bashorat qilgan, buni Mut va Karbon (Muth and Carbon, 2013) \"estetik anglash effekti\" deb atagan.&lt;/p&gt;\n&lt;h4 id=\"epistemik-yoyni-tushuncha-insayt-va-estetik-afzal-korishning-fiziologik-korrelyatlari-bilan-boglash\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#epistemik-yoyni-tushuncha-insayt-va-estetik-afzal-korishning-fiziologik-korrelyatlari-bilan-boglash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Epistemik yoyni tushuncha (insayt) va estetik afzal ko'rishning fiziologik korrelyatlari bilan bog'lash&lt;/span&gt;&lt;/a&gt;Epistemik yoyni tushuncha (insayt) va estetik afzal ko'rishning fiziologik korrelyatlari bilan bog'lash&lt;/h4&gt;\n&lt;p&gt;Taxmin qilinayotgan epistemik yoy ketma-ketligiga rioya qilish uchun biz uning tarkibiy qismlari va ularning vaqtinchalik profilini kuzatishga intilamiz. Buning uchun biz ishtirokchilarning javoblari bilan birgalikda multimodal (neyro)fiziologik ma'lumotlarni yozib olamiz va tahlil qilamiz. Bir nechta tadqiqotlar mos ravishda insayt yoki estetik afzal ko'rishning neyrofiziologik korrelyatlarini aniqlashga harakat qilgan. Insayt neyrofiziologiyasiga oid oldingi tadqiqotlar ko'pincha yarimsharlararo farqlarga e'tibor qaratgan, bu gipoteza potentsial tegishli miya sohalaridagi neyroanatomik va tsitoarxitektonik assimetriyalar to'plamiga mos keladi (ayniqsa tilni qayta ishlash kontekstida; sharh uchun qarang: Kounios &amp;amp; Beeman, 2014). Biroq, insayt bo'yicha EEG adabiyotlari kamchilikni tashkil etib, nisbatan barqaror topilmalarni ko'rsatadi — xususan, masofaviy assotsiatsiya vazifalari (Jung-Beeman va boshq., 2004; Sandkühler &amp;amp; Bhattacharya, 2008), og'zaki boshqotirmalar (Sheth va boshq., 2009) yoki anagrammani yechish vazifalari (Oh va boshq., 2020) kabi turli matnga asoslangan vazifalarda ishtirokchilar o'zlari xabar bergan insayt lahzalaridan oldin sodir bo'ladigan gamma-diapazondagi faollik chaqnashlarini.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Insayt va estetika bo'yicha EEG tadqiqotlari tushunish lahzasi yoki baholashdan oldin gamma va alfa diapazonlarida barqaror o'zgarishlarni qayd etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Gamma-diapazondagi faollikdan tashqari, ushbu tadqiqotlar unchalik barqaror bo'lmagan holda alfa-quvvatning oshishi (Jung-Beeman va boshq., 2004; Sandkühler &amp;amp; Bhattacharya, 2008, ikkalasi ham masofaviy assotsiatsiya vazifalaridan foydalangan) va yechimdan oldin beta-faollikning oshishi (Oh va boshq., 2020) yoki kamayishi (Sheth va boshq., 2009) haqida xabar bergan. Ushbu faollik naqshlari estetik afzal ko'rish bo'yicha kichik chastota domenidagi M/EEG adabiyotlarida xabar qilinganlarga umumiy jihatdan o'xshaydi. Tadqiqotlar deyarli barcha kanonik chastota diapazonlarida, ammo eng barqaror ravishda gamma (Lopez-Persem va boshq., 2020; Cela-Conde va boshq., 2004; Munar, Nadal, Rosselló va boshq., 2012; Munar, Nadal, Castellanos va boshq., 2012; Strijbosch va boshq., 2021) va alfa diapazonlarida sezilarli ta'sirlarni qayd etgan (Munar, Nadal, Castellanos va boshq., 2012; Kang va boshq., 2015; Strijbosch va boshq., 2021).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Hodisaga bog'liq potensiallar (ERP) — bu ma'lum bir qo'zg'atuvchiga javoban EEG yordamida qayd etilgan miya elektr faolligining o'zgarishi bo'lib, axborotni qayta ishlash bosqichlarini aks ettiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bundan tashqari, alfa quvvatidagi yarimsharlararo farqlar (frontal alfa assimetriyasi) neyroestetik tadqiqotlarning alohida maqsadi bo'lgan (Babiloni va boshq., 2013; Moon va boshq., 2013; Cheung va boshq., 2019), va ba'zi tadqiqotlar hatto xulq-atvor baholari orqali qo'shimcha tekshiruvsiz estetik afzal ko'rishning proksi ko'rsatkichi sifatida EEG assimetriya indeksidan foydalangan (Babiloni va boshq., 2015; Lee va boshq., 2017). Hodisaga bog'liq potensiallar (ERP) ham estetik afzal ko'rish kontekstida o'rganilgan. Turli xil yaxshi o'rnatilgan ERP komponentlariga ta'sirlar, jumladan posterior P2 (Righi va boshq., 2017; Noguchi &amp;amp; Murota, 2013), anterior P2 (Righi va boshq., 2017; Ma va boshq., 2015; Jiang &amp;amp; Cai, 2013; Wang va boshq., 2012), N2 (Bölte va boshq., 2017; Righi va boshq., 2017; Ma va boshq., 2015; de Tommaso va boshq., 2008; Oliver-Rodríguez va boshq., 1999; Carbon va boshq., 2018; Augustin va boshq., 2011), P3 (Bölte va boshq., 2017; Righi va boshq., 2017; Ma va boshq., 2015; de Tommaso va boshq., 2008; Oliver-Rodríguez va boshq., 1999) va unchalik barqaror bo'lmagan holda P1 (Righi va boshq., 2017; Bölte va boshq., 2017) hamda LPP (Marzi &amp;amp; Viggiano, 2010; Werheid va boshq., 2007; Schacht va boshq., 2008) bo'yicha xabar qilingan.&lt;/p&gt;\n&lt;p&gt;Oldingi tadqiqotda biz juda kech latent potensiallardagi farqlar haqida xabar bergan edik (stimul paydo bo'lganidan keyin 3-5 soniya o'tgach; Strijbosch va boshq., 2021), garchi biz ilgari sanab o'tilgan ERP topilmalarining birortasini ham takrorlay olmagan bo'lsak ham. Taqdim etilgan EEG topilmalari to'liq yakuniy xulosaga olib kelmasa-da, ular shunga qaramamay afzal ko'rish bilan bog'liq ma'lumotlarni noinvaziv bosh terisi EEG'sidan tiklash mumkinligini ko'rsatadi. Ko'z harakatini kuzatish va elektrokardiografiya (EKG) kabi qo'shimcha fiziologik ma'lumotlar modaliklari ham qiziqarli nomzodlardir: yurak urish tezligi estetik baholash bilan bog'langan (Tschacher va boshq., 2012), qorachiq hajmi \"aha\" tajribalarining potentsial ko'rsatkichi (Salvi va boshq., 2020) va musiqani tinglash paytida ajablanish sifatida o'rganilgan (Liao va boshq., 2018), va ko'z harakati naqshlari empirik estetikada qiziqarli xulq-atvor sifatida o'rganilgan (ko'z naqshlari/tadqiq qilish xulq-atvoriga potentsial sarlavha ta'sirlari bilan; Bubić va boshq., 2017; Kapoula va boshq., 2009; Temme, 1992; Hristova va boshq., 2011). Ushbu fiziologik ma'lumotlarning barcha turlari ushbu tadqiqotda qo'llanilgan ko'p o'lchovli dekodlash yondashuviga mos keladi.&lt;/p&gt;\n&lt;h4 id=\"hozirgi-tadqiqot\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#hozirgi-tadqiqot\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hozirgi tadqiqot&lt;/span&gt;&lt;/a&gt;Hozirgi tadqiqot&lt;/h4&gt;\n&lt;p&gt;Biz Van de Kruys va boshqalar (2021) paradigm قرآنining kengaytirilgan versiyasini ishlab chiqdik va uni ikkita oldindan ro'yxatdan o'tkazilgan (preregistered) eksperimentda qo'lladik: birinchi sof xulq-atvor vazifasida ishtirokchilarga vizual san'at asari ko'rsatildi va uning nomi qanchalik qiziqish uyg'otganini baholash so'raldi. Shundan so'ng asarning asl nomi yoki asar «nomsiz» ekanligi haqidagi bayonot taqdim etildi (haqiqiy yoki soxta nom sharti tasodifiy ravishda tayinlandi va ishtirokchilar o'rtasida to'liq muvozanatlandi). Keyin ishtirokchilar san'at asarini yana ko'rib chiqdilar va o'zlarining aha hissiyotlarini, estetik zavqni hamda asarni qanchalik tushunganliklarini baholadilar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Aha hissiyoti (aha experience) — noaniqlik bartaraf etilganda yoki yashirin ma'no tushunilganda yuzaga keladigan to'satdan tushunish yoki intssayt holatidir.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bu bizga aha va ma'no yaratish bo'yicha oldingi topilmalar yangi stimullar kategoriyasida (san'at) takrorlanishini sinab ko'rish hamda odatda alohida o'rganilgan turli baholash jarayonlarini funksional tarzda bog'lash imkonini berdi. Biz mos nomlarga ega turli xil san'at asarlari stimullarini to'pladik: stimullar asarning vizual abstraksiya darajasiga (san'at uslubi: figurativ, yarim abstrakt yoki abstrakt) va nomlarning axborot mazmuniga (nom uslubi: yangi ma'lumot qo'shmaydigan sof tasviriy nomlar, tasvirlangan mazmunni tushunishga yordam beradigan tushuntiruvchi nomlar yoki yangi, uzoq tushunchalar bilan bog'liqlik yaratuvchi evokativ nomlar) ko'ra farq qildi. Bu ma'no yaratish va afzalliklarga ushbu omillarning ta'siri va o'zaro ta'sirini yanada nozikroq o'rganish imkonini berdi. Biz shuningdek, vizual san'at va ularning nomlari keltirib chiqaradigan aha hissi kuchini perseptiv siljishlar keltirib chiqaradigan aha hissiyoti bilan taqqoslash uchun Muni (Mooney) tasvirlarini kiritdik.&lt;/p&gt;\n&lt;p&gt;Xususan, biz quyidagi gipotezalarni oldindan ro'yxatdan o'tkazdik: qo'shimcha ma'lumot shartida (haqiqiy nomli san'at asari yoki Muni tasviri) qo'shimcha ma'lumot bo'lmagan shartga («nomsiz» san'at) qaraganda kuchliroq aha tajribasi bo'ladi; qiziqish reytinglari aha tajribasining kuchini bashorat qiladi; aha reytinglari estetik afzallik reytinglarini bashorat qiladi; haqiqiy nomlarga ega san'at asarlari Nomsiz san'at stimullariga qaraganda yuqoriroq estetik baholarga ega bo'ladi; haqiqiy nomlarga ega san'at asarlari Nomsiz san'at stimullariga qaraganda yuqoriroq tushunish baholariga ega bo'ladi; hech bo'lmaganda tushunish reytingi uchun abstraksiya darajasi bilan o'zaro ta'sir mavjud bo'ladi.&lt;/p&gt;\n&lt;p&gt;Ikkinchi eksperimentda biz mukofotni qayta ishlashning fiziologik korrelyatlari va vaqtinchalik ketma-ketligini o'rganishni maqsad qildik, shuning uchun xulq-atvor reytinglaridan tashqari ishtirokchilarning EEG, pupillometriya va EKG ko'rsatkichlarini yozib oldik. EEG (vaqt va chastota sohalarida), qorachig'ning kengayishi va bir zumdagi yurak urish tezligi reyting bilan bog'liq ma'lumotlar tegishli yozuvlarda aks etganligi va qachon aks etganini ko'rsatish uchun mo'ljallangan vaqt bo'yicha hal qilingan dekodlash yondashuvi yordamida tahlil qilindi (Gviliams va King (Gwilliams &amp;amp; King, 2020) asosida, metodlarga qarang).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Xulq-atvor baholari, EEG, pupillometriya va EKG yordamida ikkita oldindan ro'yxatdan o'tkazilgan eksperimentda mualliflar nomlar va abstraksiya darajasining intssayt, tushunish va estetik afzalliklarga ta'sirini baholaydilar.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Eksperimentning ushbu qismi ko'proq qidiruv xarakteriga ega edi va biz oldingi ishlarga asoslanib faqat bir nechta qo'pol gipotezalarni oldindan ro'yxatdan o'tkazdik: gamma diapazonida intssayt bilan bog'liq faollikni topamiz; estetik afzallik va gamma diapazoni quvvati o'rtasida ijobiy chiziqli munosabat bo'ladi; alfa quvvati va estetik afzallik o'rtasida nochiziqli munosabat bo'ladi.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"1-tajriba-qiziquvchanlik,-tushuncha,-estetik-did-va-anglash-boyicha-xulq-atvor-reytinglari\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#1-tajriba-qiziquvchanlik,-tushuncha,-estetik-did-va-anglash-boyicha-xulq-atvor-reytinglari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1-tajriba – Qiziquvchanlik, tushuncha, estetik did va anglash bo‘yicha xulq-atvor reytinglari&lt;/span&gt;&lt;/a&gt;1-tajriba – Qiziquvchanlik, tushuncha, estetik did va anglash bo‘yicha xulq-atvor reytinglari&lt;/h4&gt;\n&lt;p&gt;Stimullar to‘plami turli san’at uslublari (mavhum, yarim mavhum yoki figurativ san’at) va sarlavha uslublari (tavsiflovchi, tushuntiruvchi, taassurotli sarlavhalar) bo‘yicha teng miqdordagi sinovlarni o‘z ichiga oladigan qilib ishlab chiqilgan. Sarlavha shartini (haqiqiy yoki ma’lumotsiz soxta sarlavha) va Muni tasvirlarining qarama-qarshi toifasini o‘zgartirish bilan bir qatorda, bu ishtirokchiga taqdim etilgan ma’lumot turi va miqdori bo‘yicha turli reytinglarni solishtiradigan ko‘plab tahlillarni o‘tkazishga imkon beradi. Quyida tekshirilgan gipotezalarning aksariyati oldindan ro‘yxatdan o‘tkazilgan (https://doi.org/10.17605/OSF.IO/PAGVH) va qo‘shimcha izlanish tahlillari shunday deb aniq belgilangan. Barcha hisobot qilingan chiziqli aralash modellarning (LMM) to‘liq tafsilotlarini Rasm SN da topish mumkin.&lt;/p&gt;\n&lt;h4 id=\"informatsion-sarlavhalar-aha-effekt-va-his-etilgan-tushunchani-oshiradi,-lekin-estetik-jozibadorlikni-emas\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#informatsion-sarlavhalar-aha-effekt-va-his-etilgan-tushunchani-oshiradi,-lekin-estetik-jozibadorlikni-emas\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Informatsion sarlavhalar «aha-effekt» va his etilgan tushunchani oshiradi, lekin estetik jozibadorlikni emas&lt;/span&gt;&lt;/a&gt;Informatsion sarlavhalar «aha-effekt» va his etilgan tushunchani oshiradi, lekin estetik jozibadorlikni emas&lt;/h4&gt;\n&lt;p&gt;Biz birinchi navbatda turli xulq-atvor reytinglarida «sarlavha effekti» mavjudligini (ya’ni, mazmunli sarlavhalar bilan sinovlar va «sarlavhasiz» sinovlar o‘rtasidagi reyting farqlari) tekshirdik. Buning uchun biz uchta oldindan ro‘yxatdan o‘tgan LMMni (1–3-tenglamalar) qo‘lladik. Ushbu tahlilda faqat san’at stimullari bo‘lgan sinovlar ishlatilgan, Muni tasvirlari e’tiborga olinmagan. Biroq, solishtirish uchun rasmlarda Muni tasvirlari bo‘yicha ham ma’lumotlar kiritilgan. Biz o‘z gipotezamizni tasdiqlashga va idrok etilgan tushunchaga sarlavhaning ijobiy ta’siri haqidagi oldingi topilmalarni takrorlashga muvaffaq bo‘ldik, ammo estetik reytinglarga emas (Rasm 1b; stimullarni san’at uslubi, ya’ni mavhumlik darajasi bo‘yicha ajratish). His etilgan tushunchaga sarlavha effekti sezilarli edi (nishab = 11,06, CI = [8,11; 14,02], p &amp;lt; 0,001; bu nishab shuni ko‘rsatadiki, sarlavhalar bilan o‘rtacha tushunish reytingi 0–100 balli shkala bo‘yicha sarlavhalarsizga qaraganda 11,06 ballga yuqori). Ehtimollik nisbati testi sezilarli edi (χ2[5] = 173,88, p &amp;lt; 0,001). Estetik reytingga sarlavha effekti esa faqat chegaraviy edi (nishab = 1,69, CI = [−0,16; 3,53], p = 0,073) va ehtimollik nisbati testi sezilarli emas edi (χ2[5] = 6,53, p = 0,258), shu bilan bizning oldindan ro‘yxatdan o‘tgan gipotezamiz rad etildi. Biz buning san’at yoki sarlavha uslublarining birortasida farq qilishi haqida hech qanday belgi ko‘rmadik (masalan, Rasm 1b ga qarang). Ilgari o‘rganilgan ushbu sarlavha effektlarini qayta ko‘rib chiqishdan tashqari, biz mazmunli sarlavhalar «aha-effekt» reytinglarini ham oshirishi haqidagi oldindan ro‘yxatdan o‘tgan yangi gipotezamizni tasdiqladik (Rasm 2a ga qarang). Sarlavhalarning «aha»ga ta’siri tushunish reytinglariga qaraganda kuchliroq edi (nishab = 17,89, CI = [13,80; 21,97], p &amp;lt; 0,001) va ehtimollik nisbati testi sezilarli edi (χ2[5] = 564,95, p &amp;lt; 0,001). Muhimi, sarlavha manipulyatsiyasining «aha-effekt» reytinglariga ta’siri stimullar bo‘yicha keskin farq qildi, ularning ba’zilari hatto haqiqiy sarlavha bilan soxta sarlavhalarga qaraganda pastroq «aha» reytinglarini oldi (Rasm SN ga qarang).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-f1.jpg\" alt=\"1-rasm: Haqiqiy sarlavhali san'at asarlari «nomsiz» san'atga qaraganda yuqoriroq tushunish tuyg'usini uyg'otadi (oldingi\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Haqiqiy sarlavhali san'at asarlari «nomsiz» san'atga qaraganda yuqoriroq tushunish tuyg'usini uyg'otadi (oldingi topilmalarni takrorlash). a) Eksperimental ketma-ketlik: Ishtirokchilar vizual san'at tasvirlarini ko'rdilar va uning sarlavhasiga bo'lgan qiziqishini baholashni so'rashdi. Keyin san'at asari sarlavhasi keldi - asl sarlavha yoki ma'lumotsiz soxta («nomsiz»). Keyin ular asl tasvirni yana ko'rdilar va ularning aha hissi, estetik yoqtirishi va asarni tushunganliklarini baholashni so'rashdi. Vizual san'at asarlaridan tashqari, Mooney tasvirlari seriyasi (Mooney &amp;amp; Ferguson, 1951) taqdim etildi (tasodifiy aralashtirilgan). Haqiqiy yoki soxta sarlavha o'rniga Mooney tasvirini yaratish uchun ishlatilgan asosiy fotosurat ko'rsatildi. b) Tushunishga sarlavha effektini takrorlash, ammo estetik yoqtirishga emas: skripka diagrammalari barcha baholarning taqsimlanishini ko'rsatadi (56 ishtirokchi bo'ylab n=3090) har bir ogohlantiruvchi kategoriya uchun alohida (3 darajadagi figurativlikdagi vizual san'at va Mooney tasvirlari), sarlavha sharti bo'yicha bo'lingan (haqiqiy yoki nomsiz; barcha Mooney tasvirlari o'zlarining haqiqiy asosiy fotografiyasi bilan birga kelgan, bu yerda sarlavhali deb tasniflangan). Biz san'atning barcha 3 toifasida mavjud bo'lgan sezilgan tushunishga sarlavha manipulyatsiyasining kuchli ta'sirini takrorladik, ammo estetik yoqtirish uchun sezilarli farqlar yo'q.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-f2.jpg\" alt=\"2-rasm: Vizual san'at bilan tushunishni uyg'otish uchun sarlavha effektidan foydalanish. a) Sezilgan ahaga sarlavha effe\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: Vizual san'at bilan tushunishni uyg'otish uchun sarlavha effektidan foydalanish. a) Sezilgan ahaga sarlavha effektini o'rnatish: sarlavha manipulyatsiyasi ishtirokchilarning aha tuyg'usiga kuchli ta'sir ko'rsatdi (san'atning barcha 3 toifasida mavjud); ta'sir hatto sezilgan tushunishga qaraganda kattaroq edi. b) Qiziqish va tushunish o'rtasidagi munosabat yechim maslahatlarining ma'lumot tarkibi bilan o'zaro ta'sir qiladi: biz Mooney tasvirlari uchun qiziqish va aha o'rtasidagi kuchli chiziqli munosabatni takrorladik (to'q sariq LOWESS egri chizig'i; ilgari Van de Cruys va boshq., 2021 tomonidan xabar qilingan) va tushuntirish sarlavhalari bo'lgan san'at asarlari uchun o'xshash, biroz zaifroq munosabatni ko'rdik (ya'ni, san'at asarida nima tasvirlanganligi haqida noaniqlik qoldirmaydigan sarlavhalar; eng qorong'i LOWESS egri chizig'i). Shu bilan birga, kamroq yoki aniq qo'shimcha ma'lumot bermaydigan sarlavhalar uchun assosiasiya zaiflashdi (masalan, rasmatda nima tasvirlanganligini so'zlar bilan tasvirlovchi tasviriy sarlavhalar va umuman semantik ma'lumot qo'shmaydigan «nomsiz» soxta sarlavhalar; och kulrang LOWESS egri chizig'i). Vizualli tasvirda osonlikcha tasvirlanmagan yangi kiritilgan tushunchaga bog'langan evokativ sarlavhalar (to'q kulrang LOWESS egri chizig'i) boshqa sarlavha shartlariga nisbatan past qiziqish sinovlarida yuqori aha reytinglari bilan zaifroq chiziqli munosabatni ko'rsatdi. LOWESS egri chiziqlari rag'batlantiruvchi kategoriya bilan qisman chiziqli bo'lmagan o'zaro ta'sirlarni taklif qilsa-da, chiziqli shartlarga ega LMM ning qo'shilgan kvadratik shartlarga ega LMM bilan ehtimollik nisbati testi bu kuzatishni statistik jihatdan qo'llab-quvvatlamadi. v) Aha va estetik yoqtirish o'rtasidagi ijobiy munosabat: ijobiy chiziqli assosiasiya barcha rag'batlantiruvchi kategoriyalarda mavjud edi. Avval xabar qilinganidek, o'rtacha estetik yoqtirish figurativ san'at uchun eng yuqori bo'ldi (ko'k LOWESS egri chizig'i). Mooney tasvirlari (to'q sariq LOWESS egri chizig'i) eng past o'rtacha estetik reytinglarga ega edi. g) Aha va tushunish o'rtasidagi munosabat rag'batlantiruvchi kategoriya bilan chiziqli bo'lmagan holda o'zaro ta'sir qiladi: Mavhum san'at uchun (yashil LOWESS egri chizig'i) aha va tushunish reytinglari o'rtasida chiziqli munosabat mavjud edi. Figurativ san'at (ko'k LOWESS egri chizig'i) esa juda past va juda yuqori aha sinovlari uchun yuqori tushunish bilan sezilarli darajada chiziqli bo'lmagan U shaklidagi munosabatni ko'rsatdi. Yarim mavhum san'at (sariq LOWESS egri chizig'i) o'rta naqshni ko'rsatdi. Mooney tasvirlari (to'q sariq LOWESS egri chizig'i) ham U shaklidagi munosabatni ko'rsatdi, lekin o'rtacha figurativ san'atga qaraganda pastroq tushunish reytinglari. Chiziqli shartlarga ega LMM ning qo'shilgan kvadratik shartlarga ega LMM bilan ehtimollik nisbati testi ushbu LOWESS egri chiziqlari tomonidan taklif qilingan chiziqli bo'lmagan o'zaro ta'sir effektlari barcha san'at uslubi x sarlavha uslubi birikmalari uchun muhim ekanligini tasdiqlaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sarlavhalar subyektiv tushunishni (nishab 11,06) va «aha-effekt»ni (nishab 17,89) sezilarli darajada oshiradi, lekin estetik baholarga ta’sir qilmaydi.&lt;br /&gt;\n[!tip] «Aha-effekt» (aha rating) — bu kognitiv noaniqlik hal qilinganda to‘satdan yuzaga keladigan tushunish yoki kashfiyot hissi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kopgina-sanat-asarlari-uchun-yuqori-yoqtirish,-lekin-muni-tasvirlariga-qaraganda-pastroq-aha-effekt\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#kopgina-sanat-asarlari-uchun-yuqori-yoqtirish,-lekin-muni-tasvirlariga-qaraganda-pastroq-aha-effekt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ko‘pgina san’at asarlari uchun yuqori yoqtirish, lekin Muni tasvirlariga qaraganda pastroq «aha-effekt»&lt;/span&gt;&lt;/a&gt;Ko‘pgina san’at asarlari uchun yuqori yoqtirish, lekin Muni tasvirlariga qaraganda pastroq «aha-effekt»&lt;/h4&gt;\n&lt;p&gt;Biz vizual san’at Muni tasvirlariga qaraganda yuqoriroq yoqtirish reytinglarini olishi haqidagi oldindan ro‘yxatdan o‘tgan gipotezamizni qisman tasdiqladik (Rasm 1b ga ham qarang). Bizning LMM tasvir toifasining umumiy ta’sirini (mavhum, yarim mavhum yoki figurativ san’at, sarlavhali va sarlavhasiz, yoki Muni tasvirlari; 4-tenglama) Muni tasvirlari bazaviy chiziq sifatida (intercept = 50,87, CI = [46,19; 55,56], p &amp;lt; 0,001) sinab ko‘rdi. Figurativ san’at (nishab = 10,62, CI = [5,65; 15,59], p &amp;lt; 0,001) va yarim mavhum san’at (nishab = 5,58, CI = [0,61; 10,55], p = 0,028) Muni tasvirlariga qaraganda sezilarli darajada yuqoriroq yoqtirish reytinglarini oldi, lekin mavhum san’at emas (nishab = 1,68, CI = [−3,29; 6,65], p = 0,507). Model uchun ehtimollik nisbati testi sezilarli edi (χ2[3] = 24,26, p &amp;lt; 0,001).&lt;/p&gt;\n&lt;p&gt;Biz Muni tasvirlari o‘rtacha hisobda vizual san’atga qaraganda yuqoriroq «aha-effekt» keltirib chiqarishi haqidagi gipotezani oldindan ro‘yxatdan o‘tkazgan edik. Ushbu mezon uchun biz Muni tasvirlari sinovlari va barcha sarlavhali san’at sinovlaridan (sarlavhasiz holatdagi san’at stimullari bo‘lgan sinovlarni hisobga olmaganda) «aha» reytinglari bo‘yicha LMM (5-tenglama)ni moslashtirdik. Muni tasvirlari yana bazaviy chiziq sifatida belgilandi (intercept = 71,27, CI = [66,20; 76,33], p &amp;lt; 0,001). Kutilganidek, biz barcha boshqa toifalar uchun pastroq «aha» reytinglarini kuzatdik va farq...&lt;/p&gt;\n&lt;h4 id=\"sarlavha-turi-reytinglarni-notrivial-usullar-bilan-shakllantirdi\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#sarlavha-turi-reytinglarni-notrivial-usullar-bilan-shakllantirdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sarlavha turi reytinglarni notrivial usullar bilan shakllantirdi&lt;/span&gt;&lt;/a&gt;Sarlavha turi reytinglarni notrivial usullar bilan shakllantirdi&lt;/h4&gt;\n&lt;p&gt;Biz mahalliy regressiya (LOWESS, Rasm 2b ga qarang) yordamida qiziquvchanlik va «aha-effekt» o‘rtasidagi bog‘liqlikni yanada o‘rgandik. Sifat jihatidan, bu sarlavha belgisi turi bilan notrivial o‘zaro ta’sir bo‘lishi mumkinligini ko‘rsatdi: Muni tasvirlari va tushuntiruvchi sarlavhalar (ya’ni, nima tasvirlangani haqida kam noaniqlik qoldiradigan sarlavhalar) qiziquvchanlik va «aha» o‘rtasida nisbatan chiziqli bog‘liqlikni namoyon etsa-da, bu assotsiatsiya noaniqlikni kamroq darajada yoki umuman kamaytirmaydigan sarlavhalar uchun zaifroq va sezilarli darajada chiziqli emas edi (masalan, tasvirda nima tasvirlanganini so‘z bilan tasvirlaydigan tavsiflovchi sarlavhalar va umuman yangi ma’lumot qo‘shmaydigan «sarlavhasiz» soxta sarlavhalar). Bu yerda pastdan o‘rtacha yuqori qiziquvchanlik sinovlari uchun «aha» reytinglarining LOWESS egri chizig‘i monoton ravishda o‘sdi, lekin keyin yuqori qiziquvchanlik sinovlari uchun tekislandi va hatto tushib ketdi. Bu yuqori qiziquvchanlikka ega, ammo keyinchalik yengillik yoki yakun topmagan (ya’ni, sarlavhadan haqiqiy ma’lumot olmagan) sinovlar uchun umidsizlik effekti bilan mos keladi. Vizual tasvirda osongina tasvirlanmagan yangi tushunchani kiritadigan va u bilan bog‘laydigan taassurotli sarlavhalar yana chiziqli bog‘liqlikni namoyon etdi, umumiy nishabi tushuntiruvchi sarlavhalar yoki Muni tasvirlariga qaraganda pastroq, lekin past qiziquvchanlik sinovlarida boshqa barcha sarlavha shartlariga qaraganda yuqoriroq «aha» reytinglariga ega edi. Garchi bu tendensiyalar juda qiziqarli ko‘rinsa-da, ehtimollik nisbati testi shuni ko‘rsatdiki, kvadratik hadlar qo‘shilgan LMM (9-tenglama) ma’lumotlarga faqat chiziqli hadlar bo‘lgan modeldan (8-tenglama; χ2[6] = 0, p = 1) sezilarli darajada yaxshiroq mos kelmaydi, bu esa kuzatilgan naqsh noto‘g‘ri bo‘lishi mumkinligini ko‘rsatadi. Modelning to‘liq tafsilotlari uchun Jadval SN ga qarang.&lt;/p&gt;\n&lt;h4 id=\"aha-effekti-yoqish-reytingi-bilan-chiziqli,-tushunish-bilan-esa-nochiziqli-boglangan\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#aha-effekti-yoqish-reytingi-bilan-chiziqli,-tushunish-bilan-esa-nochiziqli-boglangan\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Aha effekti yoqish reytingi bilan chiziqli, tushunish bilan esa nochiziqli bog'langan&lt;/span&gt;&lt;/a&gt;Aha effekti yoqish reytingi bilan chiziqli, tushunish bilan esa nochiziqli bog'langan&lt;/h4&gt;\n&lt;p&gt;Biz aha va yoqish reytinglari o'rtasida sezilarli chiziqli bog'liqlikni aniqladik, bu esa oldindan ro'yxatdan o'tkazilgan yana bir gipotezani tasdiqladi. Model (10-tenglama) shuni ko'rsatadiki, bu ta'sir barcha tasvir kategoriyalari uchun ahamiyatli bo'lgan ( Muni tasvirlari: qiyalik = 0.15, IS = [0.10; 0.20], p &amp;lt; 0.001; yarim mavhum san'at: qiyalik = 0.24, IS = [0.19; 0.29], p &amp;lt; 0.001; mavhum san'at: qiyalik = 0.26, IS = [0.21; 0.31], p &amp;lt; 0.001; figura san'ati: qiyalik = 0.32, IS = [0.27; 0.37], p &amp;lt; 0.001 — sarlavhali va sarlavhasizlar birlashtirilgan holda).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Aha effekti barcha vizual stimullar kategoriyalarida yoqish reytingi bilan barqaror chiziqli bog'liqlikni namoyon etadi (qiyaliklar 0.15 dan 0.32 gacha, p &amp;lt; 0.001).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tushuntirish sarlavhalariga ega yarim mavhum san'at kategoriyasi yanada yuqori salohiyatga ega ko'rinadi: biz tadqiqot dizayniga qat'iyroq mos keladigan modelni ham tanladik (ya'ni tushuntirish sarlavhalari bo'lgan stimullarning ortiqcha tanlanishini inobatga olgan holda, qarang: Metodlar, ularni Wikiarts Emotion ma'lumotlar bazasidagi «hayrat» reytingi bo'yicha tartiblangan ikkita alohida sarlavha guruhiga — «tushuntiruvchi (yuqori)» va «tushuntiruvchi (past)» guruhlarga bo'lish orqali). Bu yerda yarim mavhum x tushuntiruvchi (yuqori) guruhi Muni tasvirlariga qaraganda biroz pastroq aha reytinglariga ega edi (qiyalik = −7.36, IS = [−15.11; −0.38], p = 0.062; sarlavhasiz sinovlar uchun Qo'shimcha A.11-jadvalga qarang).&lt;/p&gt;\n&lt;p&gt;Keyingi lokal regressiya shuni ko'rsatdiki, bu bog'liqlik haqiqatan ham chiziqli bo'lib, rasm turiga unchalik bog'liq emas (2c-rasmdagi LOWESS egri chizig'iga qarang). Ehtimollik nisbati testi qo'shilgan kvadratik hadlarga ega model (11-tenglama) ma'lumotlarni chiziqli hadlarga ega modelga qaraganda sezilarli darajada yaxshiroq tavsiflamasligini tasdiqladi (10-tenglama; χ²[4] = 0, p = 1). Shunday qilib, bizning ma'lumotlarimiz shuni ko'rsatadiki, Muni tasvirlari bo'yicha oldingi kuzatishlar (Muth &amp;amp; Carbon, 2013) boshqa stimul domenlariga, jumladan, vizual san'atga ham tatbiq etilishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LOWESS (lokal vaznli regressiya) — egri chiziq shakli bo'yicha qat'iy oldindan matematik farazlarsiz nochiziqli trendlarni topish uchun ma'lumotlarni tekislash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Aha va tushunish o'rtasidagi bog'liqlikka kelsak, lokal regressiya stimul kategoriyasi bilan nochiziqli o'zaro ta'sirni ko'rsatdi. Darhaqiqat, biz tushunish reytinglari stimul abstraktsiyasi darajasi bilan o'zaro ta'sir qilishini taxmin qilgan edik (oldindan ro'yxatdan o'tkazilgan, garchi o'zaro ta'sir qanday ko'rinishda bo'lishi haqida aniq gipoteza bo'lmagan bo'lsa ham). Mavhum san'at uchun bog'liqlik chiziqli bo'lsa, yarim mavhum va figura san'ati uchun u ko'proq kvadratik (U-simon) ko'rinishga ega edi. Muni tasvirlari ham U-simon bog'liqlikni namoyon etdi (2d-rasmdagi LOWESS egri chiziqlariga qarang).&lt;/p&gt;\n&lt;p&gt;Bu yerda ehtimollik nisbati testi kvadratik hadlarga ega model (13-tenglama) ma'lumotlarni chiziqli hadlarga ega modelga (12-tenglama) qaraganda sezilarli darajada yaxshiroq tavsiflashini tasdiqladi (χ²[4] = 115.03, p &amp;lt; 0.001). Kvadratik hadlar figura san'ati (baholash = 216.92, IS = [118.04; 315.44], p &amp;lt; 0.001), Muni tasvirlari (baholash = 141.51, IS = [12.73; 270.30], p = 0.031) va yarim mavhum san'at (baholash = 96.42, IS = [3.87; 188.98], p = 0.041) uchun ahamiyatli bo'ldi, biroq mavhum san'at uchun ahamiyatli emas edi (baholash = −19.48, IS = [−116.45; 77.48], p = 0.694; to'liq model tafsilotlari uchun A.17 va A.18-qo'shimcha jadvallarga qarang).&lt;/p&gt;\n&lt;p&gt;Kuzatilgan naqsh, agar past aha va yuqori tushunish bilan tavsiflangan sinovlar tasvirlarni boshlang'ich tushunish darajasining yuqoriligi bilan bog'liq bo'lsa (sarlavhalar yoki Muni yechimisiz ham), mantiqan to'g'ri bo'lar edi, chunki bu qo'shimcha ma'lumotlar yordamida kamaytirilishi mumkin bo'lgan noaniqlikni kam qoldiradi (shuningdek, qarang: A.3-qo'shimcha rasm).&lt;/p&gt;\n&lt;h4 id=\"2-eksperiment-neyron-korrelyatsiyalar-va-axborotni-qayta-ishlashning-vaqtinchalik-ketma-ketligi\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#2-eksperiment-neyron-korrelyatsiyalar-va-axborotni-qayta-ishlashning-vaqtinchalik-ketma-ketligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2-eksperiment – Neyron korrelyatsiyalar va axborotni qayta ishlashning vaqtinchalik ketma-ketligi&lt;/span&gt;&lt;/a&gt;2-eksperiment – Neyron korrelyatsiyalar va axborotni qayta ishlashning vaqtinchalik ketma-ketligi&lt;/h4&gt;\n&lt;p&gt;Epistemik yoyning vaqtinchalik profilini o'rganish uchun biz kuzatuvchilarning EEG, yurak urish tezligi va qorachiq hajmini yozib olgan holda eksperimentni takrorladik. Eksperiment dizayni oldindan ro'yxatdan o'tkazilgan (https://doi.org/10.17605/OSF.IO/6KW9N), biroq tadqiqotning ushbu qismi asosan izlanish xarakteriga ega bo'lgani sababli, biz biron-bir maxsus tahlilga bog'lanib qolmagan edik.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;2-eksperiment asosan izlanish xarakteriga ega (exploratory) bo'lgani sababli, uning natijalari kelgusi tadqiqotlarda mustaqil ravishda tasdiqlanishini talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Fiziologik signallar tegishli ma'lumotlar fiziologik ma'lumotlarda namoyon bo'lganmi yoki yo'qmi va qachon namoyon bo'lganini ko'rsatish uchun vaqt bo'yicha hal qilingan dekodlash yondashuvi yordamida tahlil qilindi. Biz eksperimental shartlarni ham, sinovlar davomida yig'ilgan turli xulq-atvor reytinglarini ham dekodlashni maqsad qildik.&lt;/p&gt;\n&lt;p&gt;Muhimi shundaki, biz sarlavha taqdim etilishining potentsial ta'sirlarini aniqlash uchun ushbu dekodlash quvurlarini sarlavhadan oldingi sinovlar va sarlavhadan keyingi sinovlar ma'lumotlari uchun alohida ishga tushirdik (faqat sinovlar sarlavhadan oldingi yoki sarlavhadan keyingi shartga tegishli ekanligini maxsus dekodlaydigan bitta quvur bundan mustasno).&lt;/p&gt;\n&lt;p&gt;Biz shuningdek quvurlarni farq signali (sarlavhadan keyingi minus sarlavhadan oldingi sinovlar) bo'yicha ham ishga tushirdik; bu natijalar A.2.4-bo'limda keltirilgan. Topilmalar quyida tavsiflangan va sezilarli dekodlash natijalari 3 va 4-rasmlarda ko'rsatilgan. Barcha ma'lumotlar modaliklari va barcha shartlar uchun dekodlash grafiklari A.2.5-bo'limda jamlangan.&lt;/p&gt;\n&lt;h4 id=\"taqdimot,-tasvir-kategoriyasi-va-sarlavha-shartini-mustahkam-dekodlash\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#taqdimot,-tasvir-kategoriyasi-va-sarlavha-shartini-mustahkam-dekodlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Taqdimot, tasvir kategoriyasi va sarlavha shartini mustahkam dekodlash&lt;/span&gt;&lt;/a&gt;Taqdimot, tasvir kategoriyasi va sarlavha shartini mustahkam dekodlash&lt;/h4&gt;\n&lt;p&gt;Biz qo'llagan kategorik eksperimental ta'sirlarni yetarlicha ishonchli aniqlash mumkin edi. Har qanday berilgan tasvir stimulandining 1- va 2-taqdimoti orasidagi kontrastni dekodlash (3a-rasmga qarang) deyarli barcha ma'lumotlar modaliklari bo'yicha ishonchli tarzda amalga oshirildi. Bu stimullar takroriy taqdimot paytida bir xil darajada qayta ishlanmasligidan dalolat beradi; aksincha, kognitiv jarayon aniqlanishi mumkin bo'lgan tarzda farq qiladi. Bunga oddiy takroriy bostirish sabab bo'lganmi (qarang: Kim, 2017) yoki qo'shimcha ma'lumotlar bilan oraliq kontekstuallashtirish kabi tadqiqotga xos bo'lgan boshqa omillarmi (ya'ni mos ravishda real yoki soxta sarlavha yoki Muni tasviri yechimi) yoki farq qiluvchi yashirin yoki oshkora vazifalar (masalan, baholash) sabab bo'lganmi, hozircha aniq aytib bo'lmaydi. Taqdim etilgan tasvir kategoriyasi (Muni tasviri yoki rasm) ham tasvir boshlangan zahoti EEG va o'quv ma'lumotlari asosida ishonchli dekodlandi (3b-rasmga qarang).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Dekodlash natijalari birinchi va ikkinchi taqdimotlar o'rtasidagi farqlarni hamda sarlavha shartlarini aniqlash мумкинligini ko'rsatdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Shuni ta'kidlash kerakki, o'quv ma'lumotlaridan tashqari (muhokamaga qarang), tasniflash birinchi taqdimotga qaraganda ikkinchi taqdimot paytida ishonchliroq ishladi (ya'ni yuqori dekodlash ko'rsatkichlari va barqaror ahamiyatlilik); bu ushbu tadqiqotdagi ko'pchilik o'rganilgan dekodlash vazifalari uchun xos edi. Natijalarning to'liqroq tavsifi A.2.6-ilovada keltirilgan.&lt;/p&gt;\n&lt;p&gt;Ushbu tadqiqot uchun muhimroq bo'lgan savollarga o'tsak, san'at asarlaridagi sarlavha sharti (real sarlavha yoki soxta sarlavha) vaqt sohasidagi signallardan ham sezilarli darajada dekodlanishi mumkin edi (4a-rasmga qarang). Biroq, hech qanday EEG chastota diapazonlari sarlavha shartini ishonchli dekodlash uchun ishlatilmadi. Ikkinchi ko'rish paytida (sarlavhadan keyin) ERP lar asosida dekodlash tasvir boshlanganidan keyin barqaror, ammo nisbatan erta oynada eng yuqori aniqlikni ko'rsatdi (0.3 soniyadan boshlab 2 ta qisqa tanaffus bilan ahamiyatli). O'quv hajmi bo'yicha dekodlash sarlavhadan keyingi shartda 1.47–2.37 soniya oralig'idagi vaqt oynasida ahamiyatli edi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ERP (Chaqirilgan potensiallar) — bu stimullarga javoban miyaning elektr faolligi bo'lib, EEG yordamida o'lchanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ikkinchi ko'rish paytida yurak urish tezligi shartni mos ravishda -0.50–0.64 s va 3.31–5.00 s bo'lgan ikki vaqt oynasida sezilarli darajada bashorat qildi. Kutilganidek, sarlavha sharti birinchi ko'rish paytida (sarlavha yoki soxta sarlavha hali taqdim etilmagan paytda) qayd etilgan ma'lumotlarning birorta modaligi bo'yicha sezilarli darajada dekodlanmadi.&lt;/p&gt;\n&lt;h4 id=\"subyektiv-qayta-ishlashning-fiziologik-belgilari-tushunishga-asoslangan-edi\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#subyektiv-qayta-ishlashning-fiziologik-belgilari-tushunishga-asoslangan-edi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Subyektiv qayta ishlashning fiziologik belgilari tushunishga asoslangan edi&lt;/span&gt;&lt;/a&gt;Subyektiv qayta ishlashning fiziologik belgilari tushunishga asoslangan edi&lt;/h4&gt;\n&lt;p&gt;Ishtirokchilarning qiziqish, yoqtirish va tushunish bo'yicha baholari 5 soniyalik tasvirni taqdim etish davomida ma'lum vaqtlarda ERP ma'lumotlaridan sezilarli darajada dekodlanishi mumkin edi, shu bilan birga tushuncha o'quv hajmidan ishonchli dekodlanishi mumkin edi, va tushunish&lt;/p&gt;\n&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;p&gt;Biz motivatsiyalangan ma'lumotlarni qidirishning yaxlit doirasida ushbu konstruktlarni birlashtirishga harakat qilgan holda qiziquvchanlik, inoyat (insight), his etilgan tushunish va estetik yoqtirish o'rtasidagi munosabatlarni o'rganib chiqdik. Biz ushbu yondashuvni ma'no yaratishning «epistemik yoyi» deb ataymiz. Biz ham a) ushbu jarayonlarning o'zaro ta'sirini yaxshiroq tushunish uchun xulq-atvor baholari sohasini, ham b) hodisalarning vaqtinchalik ketma-ketligi haqida tushunchaga ega bo'lish uchun ularning (neyro)fiziologik korrelyatsiyalarini o'rganib chiqdik. Biz ma'no yaratish va inoyatni qo'zg'ata oladigan boshqariladigan, ammo tabiiy stimullar sinfi sifatida tasviriy san'atni inoyatni o'rganishdagi o'rnashgan stimul kategoriyasi bo'lgan Muni tasvirlari bilan taqqoslagan holda o'rgandik.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Biz tasviriy san'at va Muni tasvirlaridan foydalangan holda qiziquvchanlik, inoyat va estetik baholashni birlashtirish uchun «epistemik yoy» konsepsiyasini taklif qildik.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bunda biz inoyat va estetik baholash bo'yicha xulq-atvor adabiyotlaridagi bir qator oldingi natijalarni takrorlashga muvaffaq bo'ldik. Eng muhimi, biz stimul materiali orqali taqdim etilgan ma'lumotlarning turi va miqdori bilan shakllangan baholar o'rtasidagi murakkab va qisman chiziqli bo'lmagan munosabatlarni aniqladik. Vaqt bo'yicha hal qilinadigan dekodlash yondashuvi va ko'p modal fiziologik ma'lumotlardan (EEG, pupillometriya, yurak urish tezligi) foydalangan holda, biz tezkor javoblar va vaqt o'tishi bilan rivojlanadigan sekinroq jarayonlarning dalillarini topdik, garchi natijalarimizni yagona vaqtinchalik ketma-ketlik modeliga birlashtirish qiyin kechdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;EEG miyaning elektr faolligini vaqt bo'yicha yuqori aniqlikda o'lchaydi, pupillometriya va yurak urish tezligi esa e'tibor va hissiy qo'zg'alish bilan bog'liq avtonom nerv tizimining o'zgarishlarini aks ettiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"qiziquvchanlik,-yngayt-insayt,-his-qilingan-tushunish-va-estetik-baholash-reytinglari-ortasidagi-bogliqlik\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#qiziquvchanlik,-yngayt-insayt,-his-qilingan-tushunish-va-estetik-baholash-reytinglari-ortasidagi-bogliqlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qiziquvchanlik, yngayt (insayt), his qilingan tushunish va estetik baholash reytinglari o'rtasidagi bog'liqlik&lt;/span&gt;&lt;/a&gt;Qiziquvchanlik, yngayt (insayt), his qilingan tushunish va estetik baholash reytinglari o'rtasidagi bog'liqlik&lt;/h4&gt;\n&lt;p&gt;Xulq-atvor tadqiqoti (1-tajriba) oldindan ro'yxatdan o'tkazilgan gipotezalarimizning ko'pchiligini qo'llab-quvvatladi: biz vizual san'atda sarlavha manipulyatsiyasining tushunish reytinglariga ta'sirini kuchli takrorlashga muvaffaq bo'ldik, shuningdek, sarlavhalarning \"aha\" (topilma) reytinglariga xuddi shunday (hatto kuchliroq) ta'sirini o'rnatdik. Biroq, biz sarlavhaning estetik afzallik reytinglariga sezilarli ta'sirini takrorlay olmadik, bu esa mavjud bo'lgan va allaqachon bir xil ma'noga ega bo'lmagan adabiyotlarga o'z hissasini qo'shdi. Avvalari ko'p marta xabar qilinganidek (masalan, [12], [12]), biz turli xil rag'batlantiruvchi toifalar bo'ylab estetik afzallik reytinglarida farqlarni ko'rdik, bunda umuman olganda mavhum san'atga qaraganda figurativ san'at uchun yuqoriroq reytinglar kuzatildi, yarim mavhum san'at esa o'rtada joylashdi. Bu farq tushunilgan tushuncha uchun yanada kattaroq edi. Biroq, \"aha\" reytinglarida yarim mavhum san'at uchun figurativ yoki mavhum san'atga qaraganda biroz yuqoriroq \"aha\" tomon biroz tendentsiya kuzatildi. Vizual san'atdan tashqari biz Mooney tasvirlari to'plamini va mos keladigan echimlarni kiritdik. Ular kuchli \"aha\" tuyg'ularini uyg'otadigan perseptiv o'zgarishlarga sabab bo'lishi mumkin va shuning uchun mezon bo'lib xizmat qilishi mumkin. Bir nechta oldingi tadqiqotlar Mooney tasvirlaridan foydalangan holda, lekin vizual san'atsiz biznikiga o'xshash savolarni o'rgangan ([12], [12]). Kutilganidek, \"aha\" reytinglari barcha san'at quyi toifalariga qaraganda Mooney tasvirlari uchun yuqoriroq bo'ldi, faqat tushuntiruvchi sarlavhali ba'zi yarim mavhum san'at turlari bundan mustasno — bu toifa Mooney tasvirlariga biroz o'xshaydi, chunki ularning ikkalasi ham berilgan tushuntirishdan keyin (masalan, ba'zi kubistik rasmlarda) perseptiv o'zgarishlarga olib kelishi mumkin. Boshqa tomondan, estetik afzallik reytinglari Mooney tasvirlari uchun san'atga qaraganda o'rtacha biroz pastroq edi. His qilingan tushunishga kelsak, Mooney tasvirlari figurativ va sarlavhali mavhum san'at o'rtasida, yarim mavhum stimullar bilan bir darajada joylashgan. Sarlavha yoki yechimga bo'lgan qiziquvchanlik keyingi \"aha\" ni bashorat qildi (ilgari Mooney tasvirlari uchun xabar qilinganidek, [12]), garchi bizning ma'lumotlarimiz assotsiatsiya kuchi sarlavha maslahatlarining axborot mazmuniga bog'liqligini ko'rsatsa ham.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Qiziquvchanlik va tushunish reytinglari insaytni bashorat qiladi, bunda bog'liqlik kuchi sarlavhalarning axborot mazmuni va rag'batlantiruvchi toifaga bog'liq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Garchi tavsifiy LOWESS egri chiziqlari bu o'zaro ta'sir qisman chiziqli bo'lmagan assotsiatsiyalarga olib kelishi mumkinligini ko'rsatgan bo'lsa-da, biz buning uchun statistik jihatdan ahamiyatli dalillarni topmadik. \"Aha\" yoqtirish bilan ijobiy bog'langan (juda chiziqli tarzda, ilgari Mooney tasvirlari uchun xabar qilinganidek, [12]), shuningdek his qilingan tushunish bilan ham. \"Aha\" va tushunish o'rtasidagi bu assotsiatsiya stimullarning mavhumlik darajasi bilan chiziqli bo'lmagan tarzda o'zaro ta'sir qiladi — mavhum san'atdagi chiziqli assotsiatsiyadan boshqa usullardagi U shaklidagi munosabatlargacha (figurativ san'atda eng kuchli). Insayt bo'yicha boshqa so'nggi tadqiqotlar ham chiziqli bo'lmagan assotsiatsiyalarni kuzatdi va shu bilan odatda faqat chiziqli munosabatlarni tekshirgan oldingi topilmalarni kengaytirdi. Masalan, [12] matnga asoslangan o'xshashlikni hal qilish vazifasida vazifaning qiyinligi va yechimga bo'lgan ishonchning ikkalasi ham \"aha\" reytinglari bilan U shaklidagi assotsiatsiyasini topdi (juda oson va juda qiyin sinovlar o'rtacha sinovlarga qaraganda pastroq \"aha\" ni keltirib chiqardi). Bu topilma past \"aha\" va yuqori tushunish sinovlarini (ayniqsa figurativ san'atda) dastlabki noaniqligi past bo'lgan \"oson\" stimullarni belgilash haqidagi talqinimizga mos keladi. Boshqa tomondan, [12] 3 xil matnga asoslangan vazifalar bo'yicha javoblarning tashqi baholangan ijodkorligi prompt-javob juftliklarining semantik masofasi bilan chiziqli bo'lmagan tarzda bog'langanligini aniqladi (ma'lum bir ostonagacha ijobiy chiziqli, shundan so'ng semantik masofaning oshishi \"aha\" ni oshirishni to'xtatdi). Bizning holatimizda bu tasvirlangan vizual konturga yuqori kontseptual masofaga ega bo'lishi uchun aniq tanlangan evokativ sarlavhalar va kichikroq darajada mavhum san'at natijalarini talqin qilish uchun ayniqsa muhim bo'lishi mumkin. Subyektiv \"aha\" reytinglari ijodkorlikni baholashga teng bo'lmasa-da, biz ijobiy korrelyatsiyani kutardik. Bizning ma'lumotlarimizda biz sof tasviriy sarlavhali san'at (ya'ni juda past kontseptual masofa) eng past o'rtacha \"aha\" reytinglarini olganini haqiqatan ham ko'ramiz. Boshqa tomondan, evokativ sarlavhalar tushuntiruvchi sarlavhalar bilan bir xil darajadagi \"aha\" reytinglarini oldi va eng yuqori umumiy \"aha\" tushuntiruvchi sarlavhali yarim mavhum san'at uchun bo'ldi. Bu naqsh [12] topilmalariga juda mos keladi. Garchi biz ularning tahlilini aniq takrorlay olmagan bo'lsak ham, chunki biz san'at va sarlavha o'rtasidagi kontseptual masofaning aniqroq stimullarga xos o'lchovini tayinlamagan bo'lsak ham, ma'lumotlarimizni yo'naltirilgan qayta tahlil qilish bu chiziqli bo'lmagan assotsiatsiya haqiqatan ham modaliklarda umumlashtirilishi va vizual san'at uchun chegaralar qayerda joylashganligi haqida yanada kuchliroq dalillarni berishi mumkin edi. Qo'shimcha eslatma sifatida shuni yodda tutishimiz kerakki, eng yuqori umumiy \"aha\" reytinglari hali ham semantik yoki kontseptual masofa o'lchovlari (ijodkorlikni aytmasa ham) osongina qo'llanilmaydigan Mooney tasvirlari uchun berilgan. Shunga qaramay, yuqori \"aha\" bilan ko'rsatilgan sinovlarda sodir bo'ladigan perseptiv o'zgarishlar kuzatuvchilarning ichki vakillik fazosidagi masofani kamaytiradi (masalan, mushukning qiyin talqin qilinadigan Mooney tasviri va ishtirokchining ichki \"mushuk\" tushunchasi o'rtasida). Xuddi shunday holat vakillik fazosida yuqoridan past masofaga o'tish holatini ham qo'zg'atishi mumkin bo'lgan tushuntiruvchi sarlavhalar uchun ham amalga oshirilishi mumkin. Xuddi shunday, ushbu toifa uchun kontseptual masofa o'lchovini tayinlash ham qiyin bo'lishi mumkin, chunki u ishtirokchining oldingi holatiga bog'liq — agar tushuntirish noma'lum bo'lsa, masofa yuqori, lekin allaqachon tanish bo'lsa, past bo'ladi. Cerdit qilingan ishlar bizning topilmalarimizga mos ravishda insayt va ijodkorlikni o'rganishdagi chiziqli bo'lmagan tendentsiyalar haqida xabar bersa-da, biz bir xil vazifa doirasida assotsiatsiya shaklining rag'batlantiruvchi toifaga bog'liqligini topadigan boshqa ishdan xabardor emasmiz (ya'ni mavhum san'atda \"aha\" va tushunishning chiziqli assotsiatsiyasi, lekin boshqa tasvir toifalarida asta-sekin chiziqli bo'lmagan assotsiatsiyalar haqidagi dalillarimiz).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;U shaklidagi egri chiziq shuni anglatadiki, haddan tashqari oson yoki haddan tashqari qiyin holatlar o'rtacha darajaga qaraganda kamroq topilma hissini uyg'otadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Umuman olganda, kuzatilgan reyting naqshlari ma'no yaratish va estetik afzalliklarni shakllantirishda insaytning roli haqidagi tushunchamizni oshiradi. Qiziquvchanlik va tushunishning \"aha\" bilan bog'liqligi (ayniqsa yuqori \"aha\" diapazonida) \"aha\" axborot olish yoki noaniqlikni kamaytirishning yaroqli ko'rsatkichi bo'lishi mumkin degan fikrni qo'llab-quvvatlaydi ([12] xulosalariga muvofiq). Sinov bo'yicha qiziquvchanlik reytinglari, bu mantiqqa ko'ra, axborot olish uchun kutilgan potentsialni aks ettirishi mumkin — ammo uning amalga oshirilishi qo'shimcha semantik ma'lumotlarga bog'liq, sarlavha uslubining ta'siri bilan ko'rsatilganidek (ya'ni yangi taqdim etilgan semantik ma'lumotlar miqdori) sarlavhani ko'rgandan keyin qiziquvchanlik va \"aha\" o'rtasidagi munosabatga (qarang: 2b-rasm): noaniqlikni kamaytirish qanchalik ko'p mumkin yoki kutilgan bo'lsa (yuqori qiziquvchanlik reytinglari bilan ko'rsatilgan), berilgan signalning ta'siri shunchalik kuchli bo'ladi va shuning uchun qiziquvchanlik va \"aha\" o'rtasidagi assotsiatsiya shunchalik kuchli bo'ladi (eng kuchli bog'liqlik Mooney tasvirlarida, eng zaifi esa sarlavhasiz san'atda kuzatilgan). Boshqa tomondan, past his qilingan tushunish qolgan yoki qoldiq noaniqlik ko'rsatkichi sifatida talqin qilinishi mumkin. EEG dekodlash natijalari bu talqinni qo'llab-quvvatlaydi, chunki tushunish 2-sinovning oxiriga kelib eng yaxshi dekodlanadigan bo'ldi (ham vaqt domenidagi EEGdan, ham teta quvvatidan), barcha ma'lumotlar birlashtirilganda. \"Aha\" ning yuqori reytinglari (katta axborot o'sishi) doimiy ravishda yuqori tushunish bilan bog'liq edi, lekin stimullarga qarab (san'at toifasi va sarlavha uslubi) yuqori tushunish reytinglari past \"aha\" sinovlarida ham paydo bo'ldi. Bu ayniqsa figurativ san'at va Mooney tasvirlari uchun sodir bo'ldi (qarang: 2b-rasm), bu yerda past \"aha\" ayniqsa past qiziquvchanlik reytinglaridan keyin kelgan (shuningdek qarang: A.3-qo'shimcha rasm). Mumkinki, ushbu stimullarning yaxshi qismi uchun ishtirokchilar sarlavha/yechimga nisbatan kamroq qiziquvchan bo'lishgan, chunki birinchi navbatda noaniqlik kam edi va shuning uchun \"aha\" uchun potentsial ham kamroq edi — yam-yashil o'tloqning figurativ rasmi yoki birinchi ko'rishda allaqachon tan olingan Mooney tasviri sarlavha yoki asosiy tasvirni shunchalik xohlamasligi mumkin, holbuki mavhum va yarim mavhum san'at asarlari tomoshabin uchun mutlaqo bir ma'noli bo'lish ehtimoli nisbatan past. Boshqa tomondan, yoqtirish reytinglari boshqa barcha reytinglar — qiziquvchanlik, \"aha\" va tushunish tomonidan ijobiy va ancha chiziqli tarzda bashorat qilindi. Bu assotsiatsiyalar san'at uslubi yoki sarlavha uslubi kabi boshqa omillardan katta darajada ta'sirlanmagan (qarang: 2d-rasm va A.2.1-qo'shimcha). Bir qarashda bu estetik baholashning roli (yoki hech bo'lmaganda ushbu tadqiqotdagi bizning reyting operatsionizatsiyamiz) haqiqatan ham juda oddiy ekanligini ko'rsatishi mumkin: estetik yoqtirish shunchaki boshqa ijobiy baholarga ergashadi, bu boshqa reytinglar esa murakkabroq kelib chiqishga ega bo'lishi mumkin. Shunga qaramay, bizning ma'lumotlarimiz bunday soddalashtirilgan sababiy talqinga qarshi dalillarni ham o'z ichiga oladi: garchi biz (bizdan oldingi ko'plab guruhlar kabi) figurativ san'at yarim mavhum va mavhum san'atga qaraganda o'rtacha yuqoriroq estetik reytinglarni olganini aniqlagan bo'lsak-da, bu \"aha\" va qiziquvchanlik uchun bunday bo'lmadi — san'at asari toifasi \"aha\" reytinglari uchun katta ahamiyatga ega emas edi (faqat yarim mavhum san'at boshqalarga qaraganda yuqori ball oldi) va qiziquvchanlik hatto figurativ san'at uchun ko'proq mavhum toifalarga qaraganda sezilarli darajada past edi. Qolaversa, sarlavha manipulyatsiyamizning estetik yoqtirishga sezilarli ta'siri yo'q edi, holbuki u his qilingan tushunish va \"aha\" ikkalasiga ham sezilarli ta'sir ko'rsatdi (qiziquvchanlik uchun bu taqqoslash mantiqiy emas, chunki sarlavhalar ushbu reyting yig'ilgandan keyin taqdim etilgan). Garchi barcha uchta reyting sinov darajasida yoqtirishni chiziqli ravishda bashorat qilgan bo'lsa-da, yoqtirish boshqa reytinglarga shunchaki ergashganga o'xshamaydi, aks holda umumiy o'rtacha naqshlar o'xshashroq bo'lar edi. Qolaversa, dekodlash vaqt o'tishi bilan yoqtirish sinovlarning boshida, boshqa reytinglardan ancha oldin dekodlanish cho'qqisini ko'rsatdi (quyida batafsil muhokama qilingan). Topilmalarimizga asoslanib, kelajakdagi tadqiqotlar ushbu o'zaro munosabatlarni yaqinroq, ideal holda ko'proq sababiy ko'rib chiqish uchun aralashuv tadqiqotlarini loyihalashi mumkin. Yuqorida biz axborot mazmunining ta'siri va ma'no yaratish bo'yicha turli xil boshqa rag'batlantiruvchi xususiyatlar haqida ko'plab qiziqarli topilmalarni muhokama qildiz, ammo biz boshqa muhim omillar ham o'z hissasini qo'shishini ta'kidlashni istaymiz. Xususan, ishtirokchilar orasidagi individual farqlar faqat boshlang'ich farqlardan ko'ra murakkabroq o'zaro ta'sirlarda namoyon bo'lishi mumkin. Masalan, [12] tadqiqoti shuni ko'rsatdiki, turli xil vizual qidiruv strategiyalari (san'at bo'yicha tajriba yoki oddiygina mashg'ulot bilan bog'liq) kubistik rasmlarda ob'ektni tezroq va aniqroq tanib olishga olib kelishi mumkin (ya'ni ma'lumotni yanada samarali chiqarish). Shuningdek, ijobiy kayfiyat \"aha\" tuyg'ularini kuchaytirishi aniqlandi ([12]), va bu barcha sharoitlarda bir xil darajada qo'llanilishi yoki murakkabroq o'zaro ta'sirlarni ko'rsatishi noma'lumligicha qolmoqda.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Olingan natijalar laboratoriya sharoitida aniqlangan bo'lib, ishtirokchilarning shaxsiy xususiyatlari va kayfiyati natijalarga ta'sir ko'rsatishi mumkinligini yodda tutish lozim.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"fiziologik-korrelatlar-va-axborotni-qayta-ishlashning-vaqtinchalik-ketma-ketligi\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#fiziologik-korrelatlar-va-axborotni-qayta-ishlashning-vaqtinchalik-ketma-ketligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fiziologik korrelatlar va axborotni qayta ishlashning vaqtinchalik ketma-ketligi&lt;/span&gt;&lt;/a&gt;Fiziologik korrelatlar va axborotni qayta ishlashning vaqtinchalik ketma-ketligi&lt;/h4&gt;\n&lt;p&gt;Ikkinchi tajribada biz tezkor (neiro)fiziologik korrelatlarni kuzatish orqali epistemik yoyning vaqtinchalik profilini tavsiflashni maqsad qildik. Tadqiqotning ushbu qismi ko'proq izlanish xususiyatiga ega bo'lib, bizda oldingi ishlarga asoslangan holda oldindan ro'yxatdan o'tkazilgan ikkita umumiy gipoteza, jumladan, EEGning alfa va gamma diapazonidagi faolligi bilan \"aha\" (kashfiyot) baholari va yoqtirish baholari o'rtasidagi bog'liqlik mavjud edi. Biz ushbu gipotezani qo'llab-quvvatlovchi dalillarni topmadik. Garchi bizning ko'p o'lchovli dekodlash yondashuvimiz vaqt sohasidagi EEG, chastota sohasidagi EEG (gamma diapazonidan tashqari), yurak urish tezligi va qorachiq ma'lumotlari asosida asosiy eksperimental manipulyatsiyalarni ishonchli aniqlay olgan bo'lsa-da, bosqichma-bosqich baholarni tiklash qiyinroq kechdi va dekodlash chastota sohasidagi EEGga qaraganda turli vaqt sohasidagi signallarda yaxshiroq ishladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ogohlantirish: tahlilning izlanish xarakteriga egaligi va baholash shkalalari uchun ahamiyatli natijalar topilmagani tezkor fiziologik korrelatlar haqidagi ma'lumotlar hozircha dastlabki ekanini bildiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"pupillometriya-va-yurak-urish-tezligi-asosida-dekodlash\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#pupillometriya-va-yurak-urish-tezligi-asosida-dekodlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Pupillometriya va yurak urish tezligi asosida dekodlash&lt;/span&gt;&lt;/a&gt;Pupillometriya va yurak urish tezligi asosida dekodlash&lt;/h4&gt;\n&lt;p&gt;Kutilganidek, pupillometriya juda istiqbolli ma'lumotlar modal bo'lib chiqdi: undan kategorik omillarni (1- yoki 2-taqdimot, Muni tasvirlari yoki san'at asarlari) ishonchli dekodlash uchun foydalanish mumkin edi, u sarlavha effekti, qiziquvchanlik va yorqin tushuncha (aha) baholari uchun ahamiyatli vaqt oynaarini ko'rsatdi, shuningdek, yoqtirish va tushunish uchun qiziqarli vaqt profillari bilan tasodifiy darajadan yuqori, ammo ahamiyatsiz bo'lgan dekodlashni namoyish etdi (3- va 4-rasmlarga qarang).&lt;/p&gt;\n&lt;p&gt;Garchi estetik yoqish bo'yicha topilmalar sezilarli ta'sirlarni ko'rsatmagan bo'lsa-da, biz sinovning ko'p qismida tasodifiy darajadan yuqori dekodlashni va sarlavhadan oldingi sinovlarning birinchi soniyasida dekodlanishning yaqqol cho'qqisini ko'rdik (sarlavhadan keyingi sinovlarda mavjud emas). Agar bu to'g'ri bo'lsa, bu imtiyozlarni shakllantirishda birinchi va tezkor komponent uchun qo'shimcha dalil bo'lib xizmat qiladi (sarlavhadan keyingi ERP ma'lumotlariga qarang). Muhimi shundaki, qorachiq hajmi ham biz yorqin tushuncha (aha) baholarini ishonchli tarzda bashorat qila oladigan yagona yozib olingan ma'lumotlar modal bo'lib qoldi (differentsial signalning teta-chastota diapazonidagi qisqa klasterdan tashqari; A.2.4-ilovaga qarang).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Pupillometriya — bu qorachiq diametrining o'zgarishini o'lchaydigan usul bo'lib, u yorug'likdan tashqari kognitiv yuklama, hissiy qo'zg'alish va kashfiyot lahzalariga ham javob beradi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ehtimol, qorachiq nisbatan sekin yoki inert signal sifatida (garchi yurak urish tezligichalik sekin bo'lmasa ham) tushuncha lahzalari o'rtasidagi sinxronizatsiyaning yo'qligidan kamroq ta'sir qiladi. Bu sinov davomida sekin monoton o'sishni ko'rsatgan differentsial signalning dekodlash vaqt Grafigi bilan mos kelishi mumkin (A.2.4-ilova va A.8-ilovaga qarang). Sarlavhadan keyingi sinovlarda tasvir paydo bo'lgandan keyin yarim soniya o'tgach ahamiyatli bo'ladigan, tushuncha uchun dekodlashning ahamiyatli oynasi mavjud edi. Buni sarlavhadan oldingi sinovlarning oxirida, tasvir yo'qolishidan oldingi oxirgi soniyada sezilarli ahamiyatli ta'sirlarni ko'rsatgan qiziquvchanlik baholarini dekodlash bilan taqqoslash qiziqarli. Ushbu naqsh qorachiqni ma'lumotlarni qayta ishlashda qiziquvchanlik, tushuncha va tushunishning o'zaro ta'sirini kelgusida tadqiq qilish uchun juda istiqbolli nomzodga aylantiradi (va ehtimol imtiyozlarni shakllantirish bo'yicha ishlar uchun ham).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Pupillometriya yordamida kategorik omillar va tushuncha baholarini muvaffaqiyatli dekodlash mumkin, garchi qorachiqning dastlabki reaksiyalari yorug'likka bog'liq bo'lsa-da.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Afsuski, sinov boshidagi qorachiq hajmi (tasvir paydo bo'lgandan keyin taxminan birinchi soniya) yuqori darajadagi kognitiv jarayonlar uchun ishonchli signal bo'lmasligi mumkin. Bizning ma'lumotlarimizda ko'rinib turibdiki, sinovlarning dastlabki qismida na biron bir baho, na sarlavha sharti dekodlanishi mumkin emas edi. Bu vaqtda qorachiq ekrandagi yorug'lik o'zgarishlariga ixtiyorsiz ravishda moslashadi (A.4-ilovadagi o'rtacha qorachiq izlariga qarang). Shuni yodda tutingki, sarlavhadan oldingi yoqtirish baholaridagi qiziqarli ahamiyatsiz naqsh aynan shu vaqt profiliga to'g'ri keladi va sarlavhadan keyingi sinovlarda tushunchaning ahamiyatli dekodlanishi darhol undan keyin boshlanadi, bu esa qorachiq tushunchaga qarab turli xil kengayish darajasiga qayta moslashishini ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Sinovning dastlabki soniyalaridagi qorachiq o'zgarishlari murakkab kognitiv jarayonlardan ko'ra ekrandagi jismoniy yorug'lik o'zgarishi bilan bog'liq.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Muni tasvirlari va san'at asarlari orasidagi farq esa bu vaqt oynasida ayniqsa yaxshi dekodlanishi mumkin edi; Muni tasvirlari sof oq piksellarning katta ulushiga ega bo'lgan yuqori kontrastli qora/oq tasvirlar ekanligini hisobga olsak, bu ajablanarli emas — shuning uchun qorachiq o'r
