tacha yorug'ligi kamroq bo'lgan san'at asarlariga nisbatan bunday tasvirlarga kuchliroq moslashishi kerak. Ushbu talqinni yanada qo'llab-quvvatlagan holda, Muni tasvirlari ichidagi 1- va 2-taqdimot dastlabki qorachiq ma'lumotlaridan ahamiyatli ravishda dekodlanmadi (faqat sinov oxirida), vaholanki san'at asari stimullari va EEG kabi boshqa ma'lumotlar modalari uchun bu ishonchli ishlaydi (3-rasm va A.2.5-ilovaga qarang). Ushbu naqshlar past darajadagi stimul xususiyatlari sinovlarning ushbu qismida qorachiqning javobini boshqarganligi haqidagi tushuntirishga mos keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Yurak urish tezligi vegetativ nerv tizimi orqali boshqarilib, fiziologik reaksiyalar va kognitiv faoliyatni aks ettiradi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Simpatik/parasimpatik yo'llar orqali avtonom nerv tizimi bilan chambarchas bog'langan signal bo'lgan yurak urish tezligi estetik ishlov berish ta'sir qilishi mumkin bo'lgan yana bir nomzod ma'lumotlar modal bo'lishi mumkin edi. Avvalgi ishlardagidek, biz vizual stimullar paydo bo'lganidan keyin yurak urish tezligining sezilarli darajada sekinlashishini kuzatdik (Palomba et al., 1997; Welke &amp;amp; Vessel, 2022). Bu sekinlashuv ikkinchi taqdimotga qaraganda birinchi (sarlavhadan oldingi) taqdimot uchun kuchliroq edi, chunki ikkinchi taqdimotda yurak urish tezligi allaqachon pastroq darajadan boshlangan edi (A.2.3-ilovaga qarang). Sarlavhadan oldingi sinovlarda biz yurak urish tezligidan hech qanday kategoriya yoki bahoni dekodlay olmadik, ammo sarlavhadan keyingi sinovlarda bu mumkin edi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Yurak urish tezligi tahlili stimullardan so'ng sekinlashishni ko'rsatdi va bazaviy chiziq tuzatishining yo'qligi sababli poststimul sinovlarida hodisalarni dekodlash imkonini berdi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Signalning sustligi tufayli, oldingi sarlavhadan oldingi sinov davomidagi voqealar yoki sarlavhaning ochilishi sarlavhadan keyingi sinovlar yozuvlariga o'tib ketishi ehtimoli bor (muhimi, boshqa barcha ma'lumotlar modallaridan farqli o'laroq, biz yurak urish tezligi ma'lumotlarini bazaviy chiziq bo'yicha tuzatmadik). Bu biz nima uchun tasvir kategoriyasi yoki sarlavha sharti kabi voqealarni ikkinchi tasvir taqdimotining stimuldan oldingi davridayoq ishonchli dekodlashimiz mumkinligini tushuntirishi mumkin — barcha kerakli ma'lumotlar allaqachon u yerda edi. Sarlavhadan keyingi sinovlarning stimuldan oldingi davrida bosqichma-bosqich tushunish baholarining dekodlanishi yanada qiziqarli topilmadir. ERP ma'lumotlarida sarlavhadan oldingi sinovlarning boshida sezilarli tushunish signali bor edi va tushunish tuyg'usi yurak urish tezligiga ta'sir qilishi mumkinligi ehtimoldan xoli emas; bu talqinda dekodlanishning birinchi ahamiyatli cho'qqisi (stimul paydo bo'lishi atrofida) faqat sarlavhadan oldingi tasvirdan olingan tushunishni (plus uzoq vaqt kechikishini) aks ettirishi mumkin, ikkinchi cho'qqisi esa sarlavhalardan olingan qo'shimcha tushunishni aks ettirishi mumkin. Cho'qqilar orasidagi dekodlanishning pasayishi yangi stimul paydo bo'lishidan kelib chiqadigan buzilishlarni aks ettirishi mumkin. Shunga qaramay, bu natijalarni haddan tashqari talqin qilish ehtimoli ham mavjud.&lt;/p&gt;\n&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;Tasviriy san'at va sarlavhalar yoki kurator eslatmalari kabi qo'shimcha matnga asoslangan ma'lumotlar bilan shug'ullanish \"tushunishdan zavqlanish\" ning paradigmali holati bo'lib, bunda ma'lumotlar bo'shlig'i qiziquvchanlikni, ma'no tushunish urinishlarini va potentsial ravishda olingan tushunchadan kelib chiqadigan zavqni keltirib chiqaradi. Qiziquvchanlik, tushuncha, his etilgan tushunish va estetik jozibadorlik hodisalarini yagona paradigmada o'rganish orqali biz ushbu epistemik yoyni tashkil etuvchi tabiat va subjarayonlarga yangi nuqtai nazarni taqdim etamiz.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;San'at va matn bilan o'zaro ta'sirni yagona paradigma орqali o'rganish ma'lumot hajmiga bog'liq bo'lgan qiziquvchanlik, tushuncha va estetik zavq o'rtasidagi nolinear aloqalarni ochib beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;1-tajribada biz vizual san'at yordamida tushunchani ishonchli tarzda uyg'otish uchun paradigmada asos soldik va qiziquvchanlik, tushuncha, his etilgan tushunish va estetik yoqish tuyg'ulari o'rtasidagi murakkab o'zaro ta'sirni chuqurroq tushunib yetdik, bu ma'lum bir stimul taqdim etadigan ma'lumot turi va miqdori bilan shakllanadigan qisman nolinear munosabatlarni ochib berdi. 2-tajribada ko'p modalli fiziologik korrelatlar tahlilimiz, barcha a Priori gipotezalarimizni tasdiqlamagan bo'lsa-da, kelajakda mavzuni yanada chuqurroq o'rganish uchun yangi qirralarni ochib berdi, bu esa ma'no yaratishni va uning estetik baholash jarayonidagi rolini mexanik jihatdan tushunishga olib keldi. O'rganish kerak bo'lgan narsalar hali ko'p bo'lsa-da, bizning tadqiqotimiz motivatsiyalangan ma'lumotlarni qidirishning asosiy xulq-atvor va fiziologik xususiyatlariga yangi oyna ochadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Paradigma — muayyan ilmiy gipotezani sinovdan o'tkazish shartlarini belgilab beruvchi standartlashtirilgan tajriba sxemasi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;p&gt;Ikki tajribada biz ishtirokchilarga vizual san'at asarlarini (suratlarni) taqdim etdik, ulardan keyin ularning asl sarlavhasi (semantik ma'no qo'shuvchi) yoki tasvirlarni talqin qilishga yordam beradigan soxta sarlavha («nomziz»; yangi ma'nosiz) ko'rsatildi. Paradigma Van de Cruys va boshq. (2021) tomonidan Muni tasvirlari bilan o'tkazilgan tadqiqotga yaqindan ergashdi. Qo'llanilgan eksperimental paradigma asosan bir xil bo'lsa-da, ikki tajriba muhim jihatlari bilan farq qildi (1-tajriba: faqat xulq-atvor ma'lumotlari, onlayn tadqiqot, kattaroq stimullar to'plami; 2-tajriba: xulq-atvor va fiziologik ma'lumotlar, laboratoriyaga asoslangan tadqiqot, 1-tajribadagi baholashlarga asoslangan cheklangan stimul kichik to'plami). Eksperimental dizayn va bizning gipotezalarimiz oldindan ro'yxatdan o'tkazilgan (1-tajriba uchun https://doi.org/10.17605/OSF.IO/PAGVH va 2-tajriba uchun https://doi.org/10.17605/OSF.IO/6KW9N ga qarang). Oldindan ro'yxatdan o'tgan rejadan farq qiladigan yakuniy usullarning har qanday tafsilotlari aniq tasvirlangan va shunday muhokama qilingan. Ishtirokchilar va yozib olish qurilmalari haqidagi tafsilotlar Inson miyasini xaritalash tashkiloti tomonidan M/EEG tadqiqotlari uchun taklif qilingan standartlarga muvofiq xabar qilingan (COBIDAS Pernet et al., 2018, 2020).&lt;/p&gt;\n&lt;h4 id=\"namuna-hajmini-baholash\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#namuna-hajmini-baholash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Namuna hajmini baholash&lt;/span&gt;&lt;/a&gt;Namuna hajmini baholash&lt;/h4&gt;\n&lt;p&gt;Maqsadli namuna hajmi G*Power dasturiy ta'minotidan foydalangan holda apriori quvvat tahlili yordamida baholandi (Faul et al., 2007, 3.1-versiya). Ko'p darajali chiziqli modellar uchun quvvat tahlili (Statistik tahlilga qarang) oddiy bo'lmagani sababli, biz tadqiqotimiz quvvatini «ANOVA: Repeated measures within factors» parametrlari, alfa = 0.05, quvvat = 0.8, ta'sir hajmi f = 0.1758631 (&lt;span class=\"yfm-latex\" data-content=\"%5Ceta%5E2_p%20%3D%200.03\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ga teng, kichik ta'sir hajmi), 1 guruh, 26 o'lchov (3x4x2 + 2 dizayn, quyida qarang) va takroriy o'lchovlar orasidagi 0 korrelyatsiyaning konservativ kutilishi bilan shunga o'xshash takroriy o'lchovlar ANOVA uchun hisobladik. Bu 30 kishidan iborat maqsadli namuna hajmiga olib keldi. Tadqiqot onlayn tarzda o'tkazилгани va ma'lumotlarni yig'ish muhitini nazorat qila olmaganimiz sababli, biz N = 50 ishtirokchidan iborat sezilarli darajada kattaroq namunani maqsad qildik. Shunga qaramay, ishtirokchilar havzasi bizning institutimizdagi tadqiqotlarning motivatsiyalangan, ko'pincha doimiy ishtirokchilaridan iborat bo'lgani sababli, boshqa onlayn tadqiqotlarga nisbatan yuqoriroq sifatli ma'lumotlarni kutdik. Tanlab olish — Ishtirokchilar Germaniyadagi Reyn-Main metropoliten regionidagi keng jamoatchilikdan qulaylik asosida tanlab olindi (convenience-sampled), bu institutga qarashli ishtirokchilar ma'lumotlar bazasi a'zolariga to'g'ridan-to'g'ri xabarlar yuborish orqali amalga oshirildi (&amp;gt; 2000 a'zo yig'ish vaqtida, hamma uchun obuna bo'lish mumkin). Slotlar birinchi kelgan, birinchi xizmat ko'rsatilgan tamoyil asosida tayinlandi. Ushbu tadqiqotda ishtirok etish uchun maxsus kiritish mezonlari yo'q edi.&lt;/p&gt;\n&lt;h4 id=\"yakuniy-namuna\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#yakuniy-namuna\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yakuniy namuna&lt;/span&gt;&lt;/a&gt;Yakuniy namuna&lt;/h4&gt;\n&lt;p&gt;N = 56 ishtirokchi tadqiqotga yozildi va N = 54 ma'lumotlarni yig'ishni yakunladi. 2 ta to'liq bo'lmagan ma'lumotlar to'plami (13/56 sinov va 53/56 sinov) baribir tahlilga kiritildi. Ushbu 56 kishidan 2 ishtirokchi faol tibbiy davolanish ostida o'tgan yoki hozirgi nevrologik muammolar (insult, MS) haqida xabar berdi. Yana 5 ishtirokchi ruhiy yoki psixologik buzilishlarning hozirgi yoki o'tgan epizodlari haqida xabar berdi. Ushbu 5 nafardan 2 nafari hozirgi tibbiy davolanishni ko'rsatdi. Ishtirokchilarning yoshi 20–82 yosh oralig'ida edi (o'rtacha = 40.0 yosh, standart og'ish = 17.0 yosh; 1 ishtirokchi o'z yoshini ko'rsatmagan). 37 nafari ayol, 19 nafari erkak va 0 nafari «boshqa» deb ko'rsatgan. 3 nafari chap qo'yli, 49 nafari o'ng qo'yli va 3 nafari ambidekstr edi (o'z-o'zidan hisobotga asoslanib, 1 ta javob yo'qolgan). Ishtirokchilar 7–26 yil ta'lim olishgan (o'rtacha = 17.4 yil, standart og'ish = 3.9 yil; 3 ishtirokchi bu ma'lumotlarni taqdim etmagan). Namuna yuqori ma'lumotli odamlarga nisbatan kuchli og'ishni ko'rsatdi: 56 kishidan faqat 1 ishtirokchi bu ma'lumotlarni taqdim etmagan holda, qolganlarining eng yuqori malakasi sifatida nemis Abitur yoki universitet darajasi bor edi. Ishtirokchilarning demografik ko'rsatkichlari bo'yicha to'liq ma'lumot olish uchun A.1 va A.2-ilovalar jadvallariga qarang. Ishtirokchilar onlayn ma'lumotlarni yig'ishni yakunlash uchun o'rtacha 50:12 daqiqa sarfladilar (standart og'ish = 23:35, min: 31:23, 25%: 36:56, 50%: 42:24, 75%: 50:27, maks: 2:22:35). 5 ishtirokchi uchun vaqt belgilari yo'qligi sababli bu hisob-kitob amalga oshirilmadi. Barcha ishtirokchilar tajribani yakunlagani uchun 10C miqdorida pul kompensatsiyasini olishdi va ishtirok etishdan oldin o'zlarining xabardor qilingan roziligini berishdi. Tadqiqot Xelsinki deklaratsiyasining etika standartlariga rioya qildi va mahalliy etika qo'mitasi (Maks Plank jamiyatining Etika kengashi) tomonidan standart laboratoriya tadqiqotlari uchun tadqiqot etikasi doirasidagi ariza asosida tasdiqlandi. Ma'lumotlar 2021-yil dekabridan 2022-yil yanvarigacha yig'ilgan.&lt;/p&gt;\n&lt;h4 id=\"stimullar\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#stimullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Stimullar&lt;/span&gt;&lt;/a&gt;Stimullar&lt;/h4&gt;\n&lt;p&gt;Har bir ishtirokchi 120 ta san'at stimuli va 20 ta Muni tasviridan iborat stimul to'plamidan 56 ta san'at stimuli va 8 ta Muni tasvirining kichik to'plamini ko'rdi. San'at stimullari — Barcha san'at stimullari jamoat mulki bo'lgan minglab tasvirlarni o'z ichiga olgan WikiArt.org ma'lumotlar bazasidan olingan. Ushbu tadqiqotda ishlatilgan 120 ta tasvir to'plami WikiArt metadanslari va WikiArt Emotions ma'lumotlar bazasiga (Mohammad &amp;amp; Kiritchenko, 2018) asoslangan holda quyidagi tartibda tuzilgan: 1) biz dastlab oxirgi 2 asrning 8 g'arbiy san'at uslubidagi barcha rasmlarni tanladik (ya'ni romantizm, realizm, impressionizm, ekspressionizm, kubizm, surrealizm, mavhum ekspressionizm, lirik abstraktsiya — WikiArt metadanslariga ko'ra), 2) keyin biz yuzlarni o'z ichiga olgan barchasini istisno qildik (WikiArt Emotions baholashlariga ko'ra), 3) qolgan san'at asarlari «mavhum» («abstract»), «yarim mavhum» («semi-abstract») yoki «figurativ» («figurative») deb turkumlarga bo'lindi, 4) ularning sarlavhalari bo'yicha «faqat tasviriy» sarlavha, «tushuntiruvchi» sarlavha va «taassurot qoldiruvchi» sarlavhalarga bo'lindi (ikkalasi ham eksperimentator tomonidan), 5) nihoyat biz a) ko'plab mumkin bo'lgan san'at uslublaridagi stimullarni o'z ichiga olishni va b) WikiArt emotions ma'lumotlar bazasidan yuqori «san'at:kutilmagan hodisa» («art:surprise») bahosini olishni maqsad qilib, 9 ta omil kombinatsiyasining har biri uchun 10 tadan stimul tanladik. 3 ta «tushuntiruvchi sarlavha» kenja guruhlarida biz har bir qutiga 10 ta o'rniga 20 ta stimulni oldik, bu texnik jihatdan tushuntiruvchi sarlavhali 3 ta qo'shimcha guruhga olib keldi (biroz pastroq oldindan baholangan «art:surprise» bilan). Ushbu protsedura jami 120 ta san'at stimulini berdi, ularning har biri o'zining asl sarlavhasi (WikiArt ma'lumotlar bazasida saqlanganidek, nemis tiliga tarjima qilingan) bilan birga keldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Qulaylik asosida tanlab olish (convenience sampling) — bu tadqiqotchi uchun oson kirish mumkin bo'lgan va qatnashishga tayyor bo'lgan shaxslarni tanlash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"mooney-images\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#mooney-images\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mooney images&lt;/span&gt;&lt;/a&gt;Mooney images&lt;/h4&gt;\n&lt;p&gt;Mooni tasvirlari Van de Cruys va boshq. 2021 ishidan olingan bo'lib, onlayn tarzda erkin foydalanish mumkin edi. Tadqiqotimizda ishlatilgan stimullar ikki mezon asosida tanlab olindi: 1) odamlar tasvirlanmagani va 2) Van de Cruys va boshq. 2021 ishidagi o'rtacha aha reytingi. Biz ushbu tadqiqotdan eng yuqori aha reytingiga ega 10 tastimulni va eng past aha reytingiga ega 10 ta stimulni oldik. Har bir Mooni tasviriga u olingan mos keluvchi oq-qora rasm hamrohlik qildi (san'at stimullari uchun haqiqiy nomlarga o'xshash «yechim» sifatida taqdim etilgan).&lt;/p&gt;\n&lt;h4 id=\"experimental-design\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#experimental-design\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Experimental design&lt;/span&gt;&lt;/a&gt;Experimental design&lt;/h4&gt;\n&lt;p&gt;Biz takroriy o'lchovlarga ega bo'lgan sub'ekt ichidagi faktorli dizayndan va 5 xil ishtirokchilar guruhidan (stimul kichik to'plamlariga asoslangan, quyida qarang) foydalandik. Dizaynni 3 × 4 × 2 + 2 sifatida rasmiylashtirish mumkin: ishtirokchilar vizual san'at stimullarini 3 ta abstraksiya darajasida (figurativ, yarim abstrakt, abstrakt) va 4 ta nom turida (tavsifiy nom, evokativ nom, tushuntirish nomi 1-guruh, tushuntirish nomi 2-guruh), 2 ta nomni ochish shartidan birida (haqiqiy nom yoki «nomziz» soxta nom) ko'rdilar. Ushbu faktorlar to'liq kesishgan bo'lib, 24 ta faktor kombinatsiyasining har biri uchun 2 tadan sinov o'tkazilgan (48 ta san'at stimuli). Qo'shimcha ravishda Mooni sinovlarining 2 guruhi taqdim etildi (Van de Cruys va boshq., 2021 bo'yicha yuqori aha reytingi yoki past aha reytingi), har bir ishtirokchi uchun har birida 4 tadan sinov (8 ta Mooni stimuli). Bu har bir ishtirokchi uchun jami 56 ta sinovni tashkil etdi (stimullar haqida batafsil ma'lumot quyida).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Sub'ekt ichidagi faktorli dizayn har bir ishtirokchi barcha tajriba shartlaridan o'tishini anglatadi, bu esa tahlilning statistik quvvatini oshiradi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"task-procedure\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#task-procedure\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Task procedure&lt;/span&gt;&lt;/a&gt;Task procedure&lt;/h4&gt;\n&lt;p&gt;Ishtirokchilar shaxsiy havola orqali Labvanced (Scicovery GmbH, Germaniya) platformasida amalga oshirilgan onlayn eksperimentga kirdilar. Xabardor qilingan rozilik olingandan so'ng, ular yordamchi so'rovnomalar to'plamiga javob berdilar (quyida qarang). Asosiy eksperiment uchun ko'rsatmalar ko'rsatildi, undan keyin 5 ta amaliy sinov (2 ta Mooni tasviri va 3 ta san'at stimuli ularning haqiqiy nomlari bilan birga; bu stimullar asosiy eksperimentda qayta taqdim etilmadi). Keyin asosiy eksperiment boshlandi, undan so'ng qisqa yakuniy so'rovnoma o'tkazildi. Tugatgandan so'ng, ishtirokchilar pul kompensatsiyasi uchun o'z ma'lumotlarini taqdim etish uchun GDPR talablariga javob beradigan alohida Limesurvey serveriga (LimeSurvey GmbH, Germaniya) yo'naltirildi. Asosiy eksperiment uchun biz ishtirokchilarga vizual san'at asarlarini (kartinalarni), ularning asl nomlari yoki qo'shimcha ma'lumotlarsiz soxta nomlar («nomziz») bilan birga taqdim etdik. Har bir sinov uchun ishtirokchilar quyidagi ketma-ketlikdan o'tdilar: 1) 5 s davomida vizual stimul (san'at yoki Mooni tasviri), 2) nom yoki Mooni yechimi uchun qanchalik qiziquvchan ekanliklarini baholadilar (uzluksiz shkala bo'yicha slaider yordamida o'z sur'atidagi javob), 3) qo'shimcha semantik ishora (3 s taqdimot vaqti); san'at stimullari bo'lsa, bu asl nom yoki soxta «nomziz» edi (shart tasodifiy tanlangan, ishtirokchilar o'rtasida to'liq muvozanatlangan), Mooni tasvirlari bo'lsa, bu tasvir olingan oq-qora fotosurat edi va 4) dastlabki tasvir yana taqdim etildi (5 s taqdimot vaqti). Shundan so'ng ular baholadilar: 5) qaysi darajada aha tajribasini boshdan kechirganliklarini, 6) tasvirning estetik jozibadorligini va 7) tasvirni tushunganliklarini (barcha javoblar o'z sur'atida, uzluksiz shkala bo'yicha slaider yordamida). Ketma-ketlik 1a-rasmda vizual tarzda ko'rsatilgan. Ushbu 1-tajribada oxirgi ikkita baholash slaideri (estetik afzallik va sezilgan tushunish) bir sahifada bir-birining ustiga qo'yilgan. Randomizatsiya: har bir san'at stimulini nomli yoki nomziz shartga tayinlash tasodifiylashtirilgan va ishtirokchilar o'rtasida to'liq muvozanatlangan. Har bir ishtirokchi uchun stimul tartibi to'liq aralashtirilgan sinovlar bilan tasodifiylashtirilgan (ketma-ket bir xil faktor kombinatsiyasining 1 tadan ortiq stimuli yo'q). Ishtirokchilar tasodifiy ravishda 5 ta guruhdan biriga tayinlandi — bu 5 ta guruhdagi stimul kichik to'plamlari farq qildi, lekin bir-biri bilan to'liq ustma-ust tushdi: har bir alohida stimul 5 ta guruhdan 2 tasida taqdim etildi.&lt;/p&gt;\n&lt;h4 id=\"behavioural-measures-and-questionnaires\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#behavioural-measures-and-questionnaires\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Behavioural measures and questionnaires&lt;/span&gt;&lt;/a&gt;Behavioural measures and questionnaires&lt;/h4&gt;\n&lt;p&gt;Birinchidan, ishtirokchilar bir qator so'rovnomalarga javob berdilar: shaxsiyatning katta beshligi so'rovnomasi (BFI-2-XS: Rammstedt va boshq., 2020; Soto &amp;amp; John, 2017), qisqa zerikish moyilligi shkalasi (sBPS: Struk va boshq., 2017), ijobiy salbiy affekt jadvalining qisqa shakli (PANAS-SF: Thompson, 2007) va estetik sezuvchanlik bahosi (AReA: Schlotz va boshq., 2020) ularning nemis tilidagi versiyalarida, shuningdek asosiy demografik ma'lumotlar (shu jumladan yosh, jins, ma'lumot va kayfiyat yoki nevrologik kasalliklar haqidagi ma'lumotlar) bo'yicha fon so'rovnomasi.&lt;/p&gt;\n&lt;h4 id=\"data-analysis\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#data-analysis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data analysis&lt;/span&gt;&lt;/a&gt;Data analysis&lt;/h4&gt;\n&lt;p&gt;Statistik tahlil va ma'lumotlarni vizualizatsiya qilish Macintosh kompyuterida (Apple Inc.) virtual muhitda Python (3.7.11-versiya) va R (4.1.3-versiya) yordamida amalga oshirildi. Rasmlar va natijalarni takrorlaydigan Jupyter bloknotlari onlayn tarzda ochiq foydalanishda mavjud (ma'lumotlardan foydalanish imkoniyatiga qarang).&lt;/p&gt;\n&lt;h4 id=\"chiziqli-aralash-modellar\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#chiziqli-aralash-modellar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Chiziqli aralash modellar&lt;/span&gt;&lt;/a&gt;Chiziqli aralash modellar&lt;/h4&gt;\n&lt;p&gt;Asosiy gipotezalar R ning lme4 paketi (1.1-30-versiya) yordamidagi lmer funksiyasi asosida chiziqli aralash effektli regressiyalar yordamida sinovdan o'tkazildi. Alohida effekt koeffitsiyentlari uchun ahamiyatlilik qiymatlari R ning lmertest paketi (3.1-3-versiya) doirasida amalga oshirilgan Satterthwaitening erkinlik darajalari usuli yordamida baholandi. Supp.A.2.2 uchun to'liq LMM jadvallari R ning sjPlot paketi yordamida tab_model funksiyasi orqali yaratildi. Keltirilgan chiziqli modellarning umumiy ahamiyatliligini baholash uchun Likserlik nisbati testlari (Likelihood Ratio Tests) bajarildi: LMM koeffitsiyentlari R ning anova funksiyasidan foydalangan holda kamaytirilgan faqat kesishish modeliga (qat'iy effekt yo'q, lekin ishtirokchi va stimullarning tasodifiy effektlari mavjud) solishtirildi. Sarlavhaning turli baholarga ta'sirini baholash uchun quyidagi oldindan ro'yxatdan o'tkazilgan LMM formulalari qo'llanildi:&lt;/p&gt;\n&lt;p&gt;understanding ~ titlecondition + (titlecondition/participant) + (titlecondition/picture) (1)&lt;/p&gt;\n&lt;p&gt;liking ~ titlecondition + (titlecondition/participant) + (titlecondition/picture) (2)&lt;/p&gt;\n&lt;p&gt;aha ~ titlecondition + (titlecondition/participant) + (titlecondition/picture) (3)&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Chiziqli aralash modellar (LMM) — ishtirokchilar va tasvirlarning individual xususiyatlarini hisobga olishga imkon beruvchi statistik tahlil usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bu yerda faqat san'at asarlari sinovlaridan olingan ma'lumotlar ishlatildi (Muni sinovlari chiqarib tashlandi). Sarlavhali («titled») kategoriya va sarlavhasiz («untitled», boshlang'ich daraja) kategoriyadagi o'rtacha bahoni solishtirish uchun biz soxta kodlashdan (dummy coding) foydalandik. Ishtirokchi × sarlavha sharti uchun tasodifiy qiyalik effekti (random slope effect) oldindan ro'yxatdan o'tkazilgan edi, chunki biz ishtirokchilarning sarlavha ta'siriga nisbatan sezgirligida farq qilishini kutgandik. Shuningdek, biz tasvir × sarlavha sharti uchun tasodifiy qiyalik effektini ham oldindan ro'yxatdan o'tkazgan edik, chunki sarlavha ta'siri tasvirga qarab farq qilishini taxmin qilgandik. Biroq, har bir ishtirokchi har bir tasvirni faqat bir marta bitta sarlavha shartida ko'rgani bu solishtirishni zaiflashtirishi mumkin edi — shuning uchun Supp.A.2.2 da biz har bir tasvir uchun tasodifiy kesishishlarga ega muqobil modellarni keltiramiz; bu natijalarni keskin o'zgartirmadi. Tasviriy san'at asarlari Muni tasvirlariga qaraganda yuqoriroq yoqtirish baholarini olishi haqidagi gipotezamizni tekshirish uchun biz quyidagi formuladan foydalandik:&lt;/p&gt;\n&lt;p&gt;liking ~ artstyle + (1/participant) + (1/picture) (4)&lt;/p&gt;\n&lt;p&gt;Bu yerda barcha sinovlar ishlatildi. Barcha katakchalardagi o'rtacha yoqtirish bahosini Muni tasvirlari (boshlang'ich daraja) bilan solishtirish uchun biz soxta kodlashni qo'lladik. Tasviriy san'at va ularning sarlavhalari keltirib chiqaradigan anglash («aha») kuchini Muni tasvirlari keltirib chiqaradigan anglash hissiyoti bilan qiyoslash uchun biz quyidagi formulani moslashtirdik:&lt;/p&gt;\n&lt;p&gt;aha ~ artstyle : titlestyle + (1/participant) + (1/picture) (5)&lt;/p&gt;\n&lt;p&gt;Bu yerda faqat Muni tasvirlari va o'zlarining haqiqiy sarlavhalari bilan ko'rsatilgan san'at asarlari ma'lumotlari ishlatildi («untitled» deb belgilangan sinovlar chiqarib tashlandi). Barcha o'zaro ta'sir katakchalaridagi o'rtacha anglash bahosini Muni tasvirlari (boshlang'ich daraja) bilan solishtirish uchun biz soxta kodlashni qo'lladik. Turli sarlavha sharoitlarida qiziquvchanlik va anglash o'rtasidagi chiziqli bog'liqlikni tekshirish uchun biz quyidagi LMM formulasini qo'lladik:&lt;/p&gt;\n&lt;p&gt;aha ~ curiosity : titlecondition + (1/participant) + (1/picture) (6)&lt;/p&gt;\n&lt;p&gt;Bu yerda barcha sinovlar ma'lumotlari ishlatildi (sarlavha sharti «untitled art», «titled art» yoki «mooney» sifatida kodlangan). Yuqoridagi barcha modellar uchun likserlik nisbati testlari mos keladigan faqat kesishish modellarga nisbatan bajarildi:&lt;/p&gt;\n&lt;p&gt;ratingofinterest ~ 1 + (1/participant) + (1/picture) (7)&lt;/p&gt;\n&lt;h4 id=\"kvadratik-hadlarga-ega-chiziqli-aralash-modellar\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#kvadratik-hadlarga-ega-chiziqli-aralash-modellar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kvadratik hadlarga ega chiziqli aralash modellar&lt;/span&gt;&lt;/a&gt;Kvadratik hadlarga ega chiziqli aralash modellar&lt;/h4&gt;\n&lt;p&gt;Mahalliy regressiya yordamida ma'lumotlarni vizualizatsiya qilish (quyida qarang) qo'shimcha tahlil sifatida ma'lumotlarni chiziqli bo'lmagan kvadratik effektlar yordamida modellashtirishga undadi. Kvadratik ko'phadli hadlarga ega modelning chiziqli hadlarga ega mos model bilan solishtirilgandagi likserlik nisbati testlari ushbu protsedura modelning moslashish sifatini sezilarli darajada yaxshilaganligini baholash uchun ishlatildi. Biz qiziquvchanlikning anglashga ta'siri sarlavha uslubi tomonidan kvadratik tarzda modulyatsiya qilinishini (8, 9-tenglamalar), anglashning yoqishga ta'siri san'at uslubi tomonidan kvadratik tarzda modulyatsiya qilinishini (10, 11-tenglamalar) va anglashning tushunishga ta'siri san'at uslubi tomonidan kvadratik tarzda modulyatsiya qilinishini (12, 13-tenglamalar) sinab ko'rdik.&lt;/p&gt;\n&lt;p&gt;aha ~ curiosity : titlestyle + (1/participant) + (1/picture) (8)&lt;/p&gt;\n&lt;p&gt;aha ~ quadratic(curiosity) : titlestyle + (1/participant) + (1/picture) (9)&lt;/p&gt;\n&lt;p&gt;liking ~ aha : artstyle + (1/participant) + (1/picture) (10)&lt;/p&gt;\n&lt;p&gt;liking ~ quadratic(aha) : artstyle + (1/participant) + (1/picture) (11)&lt;/p&gt;\n&lt;p&gt;understanding ~ aha : artstyle + (1/participant) + (1/picture) (12)&lt;/p&gt;\n&lt;p&gt;understanding ~ quadratic(aha) : artstyle + (1/participant) + (1/picture) (13)&lt;/p&gt;\n&lt;h4 id=\"mahalliy-regressiya\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#mahalliy-regressiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mahalliy regressiya&lt;/span&gt;&lt;/a&gt;Mahalliy regressiya&lt;/h4&gt;\n&lt;p&gt;Mahalliy regressiya grafiklari Python uchun seaborn modulida amalga oshirilgan mahalliy vaznli sochilish grafigini silliqlash (LOWESS) yordamida yaratildi (Waskom, 2021, 0.11.2-versiya).&lt;/p&gt;\n&lt;h4 id=\"malumotlarni-vizualizatsiya-qilish\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#malumotlarni-vizualizatsiya-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ma'lumotlarni vizualizatsiya qilish&lt;/span&gt;&lt;/a&gt;Ma'lumotlarni vizualizatsiya qilish&lt;/h4&gt;\n&lt;p&gt;Ma'lumotlarni vizualizatsiya qilish Python seaborn modulidan foydalanadigan maxsus kod yordamida yaratildi (Waskom, 2021, 0.11.2-versiya).&lt;/p&gt;\n&lt;h4 id=\"tan-hajmuni-baholash\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#tan-hajmuni-baholash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tan hajmuni baholash&lt;/span&gt;&lt;/a&gt;Tan hajmuni baholash&lt;/h4&gt;\n&lt;p&gt;Sarlavha effektining yoki san'atni tushunishdagi insaytning EEG bo'yicha oldingi tadqiqotlari yo'qligini hisobga olib, biz tadqiqot quvvatini kuzatishni maqsad qilgan xulq-atvor effektiga asoslanib aniqlashga qaror qildik: rag'batlantiruvchi TOpishmoq toifasining aha reytinglariga asosiy effekti. Biz G*Power (Faul va boshq., 2007, 3.1-versiya) yordamida maqsadli tan hajmuni oldindan baholadik. Biz yana tajribamiz quvvatini 1-tajribada qo'llanilgan LMM larga o'xshash takroriy o'lchovli ANOVA dizayni uchun hisoblab chiqdik. Biz α = 0,05, quvvat = 0,8, effekt hajmi f = 0,1758631 (&lt;span class=\"yfm-latex\" data-content=\"%5Ceta%5E2_p%20%3D%200%7B%2C%7D03\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ga teng, kichik effekt hajmi), 1 guruh, 7 o'lchov (3 × 2 + 1 dizayn, pastga qarang) va takroriy o'lchovlar orasidagi korrelyatsiya r = 0,42 bo'lgan «ANOVA: Fatorlar ichida takroriy o'lchovlar» parametrlaridan foydalandik. Takroriy o'lchovlar orasidagi korrelyatsiya onlayn tadqiqot ma'lumotlari asosida, joriy tadqiqotda qo'llanilgan 7 ta rag'batlantiruvchi omil kombinatsiyasi bo'yicha ishtirokchilarning o'rtacha insayt reytinglarining o'rtacha korrelyatsiya koeffitsiyenti sifatida baholandi. Ushbu quvvat tahlili N = 38 maqsadli tan hajmiga olib keldi. Ishtirokchilarning chiqib ketishini hisobga olish uchun biz kamida N = 45 nafar ishtirokchidan ma'lumot yig'ishga qaror qildik.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Quvvat tahlili (power analysis) — tajriba haqiqiy ilmiy effektni aniqlay olishi uchun zarur bo'lgan ishtirokchilarning minimal sonini hisoblab chiqish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tanlov jarayoni — Ishtirokchilar Germaniyaning Reyn-Mayn metropoliten regionidagi keng aholi orasidan qulay tanlov usuli bilan tanlab olindi. Tanlash tartibi 1-tajribadagidek edi. Tanlash uchun kiritish mezonlari quyidagilar edi: yoshi 18–55 yoshda bo'lishi, nemis tilini yaxshi bilishi, ko'rish qobiliyati yaxshi bo'lishi va tadqiqot davomida ko'zoynak taqishga ehtiyoj yo'qligi (chunki bu ko'zni kuzatish sifatini pasaytiradi), ma'lum bo'lgan nevrologik kasalliklarning yo'qligi va oldingi onlayn tadqiqotda qatnashmaganligi.&lt;/p&gt;\n&lt;p&gt;Yakuniy tanlama — 50 nafar ishtirokchi ro'yxatdan o'tdi va ma'lumot yig'ishni yakunladi. Nevrologik muammolari bo'lgan (essentsial tremor) 1 nafar ishtirokchi kiritish mezonlariga zid ravishda ro'yxatdan o'tdi va shuning uchun tahlildan keyinchalik chiqarib yuborildi, natijada tahlil uchun 49 ta ma'lumotlar to'plami qoldi. Ba'zi ishtirokchilarda kichik nosozliklar yoki past sifatli yozuvlar tufayli ma'lumotlari yo'qolgan davrlar (EEG, EKG, ko'zni kuzatish va/yoki reytinglar) bo'lgan, ammo ular tahlildan chiqarib yuborilmagan. Ishtirokchilarning yoshi 18–52 yoshda edi (o'rtacha = 28,0 yosh, standart og'ish = 7,2 yosh). 28 nafari ayol, 19 nafari erkak va «boshqa» deb belgilagan. 8 nafari chap qo'l, 41 nafari o'ng qo'l va 0 nafari har ikki qo'ldan foydalanadigan edi (Flinders qo'llilik so'rovnomasi; Nicholls va boshq., 2013). 17 nafar ishtirokchida chap ko'z, 28 nafarida o'ng ko'z va 4 nafarida ko'z ustunligi aniqlanmagan (eksperimentator tomonidan baholangan; pastga qarang). Ishtirokchilar 8–27 yil ta'lim olganini ko'rsatgan (o'rtacha = 17,3 yil, standart og'ish = 3,9 yil; bunda 1 nafar ishtirokchi bu ma'lumotni taqdim etmagan).&lt;/p&gt;\n&lt;p&gt;Tanlanma yuqori ma'lumotli shaxslarga nisbatan o'ta og'ishni ko'rsatdi: barcha 49 nafar ishtirokchi o'zlarining eng yuqori malakasi sifatida nemis Abitur (maktabni tugatganlik haqidagi guvohnoma) yoki universitet darajasini ko'rsatgan. 49 nafar ishtirokchidan 11 nafari ruhiy yoki psixologik buzilishlarning joriy yoki o'tgan epizodlari haqida xabar berdi, ulardan 7 nafari hozirda dori-darmon qabul qilishini ko'rsatdi. Garchi bu chiqarib yuborish mezoni bo'lmasa-da, biz tajriba kunida ishtirokchilarning kofein истеъмол qilishini ham baholadik: u tana vaznining 0–3,61 mg/kg oralig'ida edi (o'rtacha = 1,06 mg/kg, standart og'ish = 0,923 mg/kg). Ishtirokchilar orasidan 8 nafari ishtirok etishdan oldin kofein iste'moli nolga teng ekanligini ko'rsatdi. Ishtirokchilarning demografik ko'rsatkichlari bo'yicha to'liq ma'lumot olish uchun SN A.1 va A.2-jadvalga qarang. Barcha ishtirokchilar har 30 minut uchun 7 yevro miqdorida pul kompensatsiyasini olishdi va ishtirok etishdan oldin o'zlarining xabardor qilingan yozma roziligini berishdi. Tadqiqot Xelsinki deklaratsiyasining etika standartlariga rioya qildi va mahalliy etika qo'mitasi (Maks Plank jamiyatining Etika kengashi) tomonidan Standart laboratoriya tadqiqotlari uchun tadqiqot etikasi doirasidagi ariza asosida tasdiqlangan. Ma'lumotlar 2022-yil martidan 2022-yil iyuligacha yig'ilgan.&lt;/p&gt;\n&lt;h4 id=\"ragbatlantiruvchi-vositalar-stimullar\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#ragbatlantiruvchi-vositalar-stimullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rag'batlantiruvchi vositalar (Stimullar)&lt;/span&gt;&lt;/a&gt;Rag'batlantiruvchi vositalar (Stimullar)&lt;/h4&gt;\n&lt;p&gt;Har bir ishtirokchi kalibrlangan LCD monitorida 48 ta san'at stimullarini va 16 ta Muni tasvirlarini ko'rdi. Ushbu stimullar 1-tajribadagi 120 ta san'at stimuli va 20 ta Muni tasviridan iborat kattaroq stimullar to'plamidan 1-tajribaning baholash ma'lumotlaridan foydalangan holda oldindan tanlab olingan edi.&lt;/p&gt;\n&lt;h4 id=\"tasvirni-tanlash\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#tasvirni-tanlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tasvirni tanlash&lt;/span&gt;&lt;/a&gt;Tasvirni tanlash&lt;/h4&gt;\n&lt;p&gt;Yuqorida 1-tajriba uchun tasvirlangan 140 ta stimullardan biz quyidagi formulaga ega chiziqli aralash model asosida 64 tasini tanladik:&lt;/p&gt;\n&lt;p&gt;&lt;span class=\"yfm-latex\" data-content=\"%5Ctext%7Baha%7D%20%5Csim%20%5Ctext%7Bko'rsatilgan%20sarlavha%7D%20%2B%20(%5Ctext%7Bko'rsatilgan%20sarlavha%7D%20%5Cmid%20%5Ctext%7Bishtirokchi%7D)%20%2B%20(%5Ctext%7Bko'rsatilgan%20sarlavha%7D%20%5Cmid%20%5Cnima%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (14)&lt;/p&gt;\n&lt;p&gt;yani insayt reytingini sarlavha shartidan (haqiqiy sarlavha yoki sarlavhasiz) bashorat qiladigan model, har bir ishtirokchi va har bir stimuls uchun tasodifiy qiyaliklar va kesishishlar bilan (bu sarlavha effektining kuchi har bir ishtirokchi va har bir stimuls uchun farq qilishi mumkinligini anglatadi). Barcha stimullar uchun tasodifiy qiyalik koeffitsientlari tartiblandi va biz har bir rasm toifasi (mavhum san'at, yarim mavhum san'at, figura san'ati, Muni tasvirlari) ichida eng yuqori qiyalikka ega 16 ta stimulsni tanladik — bular 1-tajribada aha reytinglariga eng kuchli sarlavha effektiga ega bo'lgan tasvirlar edi. 1-tajribadagi uchinchi to'liq kesishgan shart (sarlavha turi: tasviriy, tushuntiruvchi, evokativ) bu yerda chiqarib tashlandi, chunki bu tanlash jarayonidagi erkinlikni keskin kamaytirgan bo'lar edi. Tartiblangan qiyalik koeffitsientlari va tanlov SN A.1-rasmda keltirilgan. Barcha stimullar (tasvirlar va sarlavhalar) SN A.1.4-bo'limida tasvirlangan.&lt;/p&gt;\n&lt;h4 id=\"eksperimental-dizayn\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#eksperimental-dizayn\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Eksperimental dizayn&lt;/span&gt;&lt;/a&gt;Eksperimental dizayn&lt;/h4&gt;\n&lt;p&gt;Biz takroriy o'lchovlarga ega sub'ekt ichidagi faktorli dizayndan foydalandik. Uni 3 × 2 + 1 dizayn sifatida rasmiylashtirish mumkin: ishtirokchilar vizual san'at stimullarini 3 ta abstraksiya darajasida (figura, yarim mavhum, mavhum), 2 ta sarlavhani ochish shartlaridan birida (haqiqiy sarlavha yoki «sarlavhasiz» soxta sarlavha) ko'rishdi. Ushbu omillar to'liq kesishgan bo'lib, 6 ta omil kombinatsiyasining har biri uchun 8 tadan sinov mavjud edi (48 ta san'at stimuli). Qo'shimcha ravishda, har bir ishtirokchiga Muni tasvirlari bilan 16 ta sinov taqdim etildi. Bu har bir ishtirokchi uchun jami 64 ta sinovga olib keldi. 1-tajribadan farqli o'laroq, barcha ishtirokchilar bir xil stimullarni ko'rishdi, garchi tasodifiy ravishda tayinlangan sarlavhalar bilan bo'lsa ham.&lt;/p&gt;\n&lt;h4 id=\"vazifani-bajarish-tartibi\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#vazifani-bajarish-tartibi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Vazifani bajarish tartibi&lt;/span&gt;&lt;/a&gt;Vazifani bajarish tartibi&lt;/h4&gt;\n&lt;p&gt;Avval ishtirokchi Labvanced (Scicovery GmbH, Germaniya) dasturida tuzilgan yordamchi so'rovnomalar to'plamini (pastga qarang) to'ldirdi. Ishtirokchi kabinaga kirdi va unga EEG bosh kiyimi hamda periferik elektrodlar (EKG) taqildi. EEG elektrodlari elektrolit gel yordamida impedans 10 kOm dan past yoki unga yaqin bo'lgunga qadar ishlov berildi. Tayyorgarlik tugagandan so'ng, ishtirokchiga chaynash, ko'prik qisish va bo'yin mushaklarini taranglashtirishning EEG signaliga ta'siri ko'rsatilib, bu artefakt manbalari haqida xabardorlik oshirildi, shuningdek, ko'zlar yumilgan qisqa davr mobaynida individual alfa tebranishlari namoyish etildi. Asosiy tajriba bo'yicha ko'rsatmalar ekranda ko'rsatildi, uning ortidan 3 ta mashq sinovi bajarildi (1 ta Muni tasviri va 2 ta badiiy rag'batlantiruvchi omil ularning haqiqiy nomlari bilan birga; bu rag'batlantiruvchi omillar asosiy tajribada qayta ko'rsatilmadi).&lt;/p&gt;\n&lt;p&gt;Trening blokidan so'ng eksperimentator ishtirokchilarning o'tirish holatini, bosh suyanchig'ini moslashtirdi va ko'z harakatini kuzatuvchi moslamani (eytrekerni) o'rnatdi. Shundan so'ng ishtirokchidan bosh suyanchig'idagi holatini saqlab qolish ҳамda sinov davrlarida chaynash, yutinish yoki boshni qimirlatmaslik so'raldi. Rag'batlantiruvchi omillar 10 tadan iborat bloklar ko'rinishida taqdim etildi va har bir blokdan so'ng ishtirokchilar dam olish uchun o'z tezligida qisqa tanaffus qilishlari mumkin edi. Paradigma 1-tajribaga deyarli o'xshash edi (shuningdek, 1a-rasmga qarang). Biroq onlayn tadqiqotdan farqli o'laroq, barcha rasmlar va nomlardan oldin 2–2,5 s davomida (tebranish bilan) ko'rsatiladigan fiksatsiya xochi qo'yilgan edi, rag'batlantiruvchi omillar orasidagi interval 1–1,5 s ni tashkil etdi (tebranish bilan) va barcha baholash slayderlari (jumladan, estetik afzal ko'rish va tushunish hissi) alohida sahifalarda taqdim etildi. Jarayon PsychoPy yordamida maxsus kodda amalga oshirildi (Peirce, 2007).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Slayder — sichqoncha yoki ekran orqali qiymatlarni uzluksiz o'zgartirish va baholash uchun ishlatiladigan interaktiv boshqaruv elementi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Eksperiment tugagandan so'ng ishtirokchilar qisqa yakuniy so'rovnomani to'ldirdilar (Labvanced, Scicovery GmbH, Germaniya da amalga oshirilgan). Randomizatsiya — badiiy rag'batlantiruvchi omilning nomlangan yoki nomlanmagan shartga tayinlanishi ishtirokchilar o'rtasida to'liq tasodifiy amalga oshirildi. Biroq randomizatsiya har bir san'at uslubi (mavhum, yarim mavhum, figurativ) doirasida nom va nomsiz sinovlarning yakuniy soni muvozanatlashgan bo'lishi uchun nazorat qilindi. Butun ma'lumotlar to'plami uchun tayinlash taqsimotini muvozanatli saqlash maqsadida psevdotasodifiy tayinlash faqat har ikkinchi ishtirokchi uchun (1, 3, 5 va hokazo) bajarildi, keyingi ishtirokchilar (2, 4, 6 va hokazo) esa oldingi ishtirokchining teskari tayinlanishlarini ko'rdilar. Har bir ishtirokchi uchun rag'batlantiruvchi omillar tartibi to'liq aralashgan sinovlar bilan tasodifiy tanlandi (ketma-ket bir xil turdagi 2 tadan ortiq rag'batlantiruvchi omil bo'lmadi).&lt;/p&gt;\n&lt;h4 id=\"xulq-atvor-korsatkichlari-va-sorovnomalar\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#xulq-atvor-korsatkichlari-va-sorovnomalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulq-atvor ko'rsatkichlari va so'rovnomalar&lt;/span&gt;&lt;/a&gt;Xulq-atvor ko'rsatkichlari va so'rovnomalar&lt;/h4&gt;\n&lt;p&gt;1-tajribada foydalanilgan skrining vositalaridan tashqari, tashrif buyurishdan oldin kofein iste'moli (Bühler va boshq., 2014) va qo'l ustunligi (FLANDERS; Nicholls va boshq., 2013) tizimli so'rovnomalar yordamida baholandi. Ko'z ustunligi eksperimentator tomonidan Porta testining o'zgarishidan foydalangan holda aniqlandi (Roth, 2002 da tasvirlanganidek).&lt;/p&gt;\n&lt;p&gt;Barcha sinov bo'yicha baholashlar (qiziquvchanlik, aha-tajriba, estetik yoqish, tushunish) sichqonchani harakatga keltirish orqali boshqariladigan slayderli uzluksiz shkala yordamida yig'ildi. Ham baholar, ham reaksiya vaqtlari qayd etildi. Dangasalik bilan javob bermaslikning oldini olish uchun ishtirokchilar avval sichqonchani siljitmasdan turib javobni qayd eta olmas edilar. Shkallarning uchlari «+» va «–» bilan belgilandi va har bir shkaltaga tegishli savollar ilova qilindi: qiziquvchanlik bahosi uchun «Wie neugierig sind Sie auf den Titel / die Auflösung?» («Siz sarlavha / yechimni qanchalik qiziqtirasiz?»), aha-baho uchun «Hatten Sie ein Aha!Erlebnis?» («Sizda Aha!tajribasi bo'ldimi?»), estetik baho uchun «Wie ästhetisch ansprechend fanden Sie das Bild?» («Rasmni qanchalik estetik jihatdan jozibali deb topdingiz?»), yoki tushunish bahosi uchun «Denken Sie, dass Sie das Bild verstanden haben?» («Rasmni tushunganingizni o'ylaysizmi?»). Ushbu baholarning tartibi qat'iy edi. Tadqiqot oldidan berilgan batafsil vazifa tavsifida barcha baholar tushuntirildi — to'liq tavsiflarni Supp.A.1.2 da topish mumkin.&lt;/p&gt;\n&lt;h4 id=\"malumotlarni-yigish-va-jihozlar-tadqiqot-muhiti\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#malumotlarni-yigish-va-jihozlar-tadqiqot-muhiti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ma'lumotlarni yig'ish va jihozlar. Tadqiqot muhiti&lt;/span&gt;&lt;/a&gt;Ma'lumotlarni yig'ish va jihozlar. Tadqiqot muhiti&lt;/h4&gt;\n&lt;p&gt;EEG yozuvi akustik tarzda himoyalangan kabinada (model: IAC 120a, IAC GmbH, Germaniya; ichki o'lchamlari: 2,74 × 2,54 × 2,3 m) amalga oshirildi. Ishtirokchilar iyaklarini peshona tayanchi bo'lgan iyak tagligiga (SR Research Head Support, SR Research Ltd., Kanada) qo'ydilar; iyak tagligi va ekran orasidagi masofa 72 sm edi. Stol balandligi ishtirokchilar tadqiqot davomida saqlab turishi mumkin bo'lgan qulay tik holatda o'tiradigan qilib sozlangan. Barcha ma'lumotlar EEG jellarini tayyorlashda yordam bergan bir xil eksperimentator tomonidan yig'ildi. Ishtirokchi kabinada o'rnatilgan xona mikrofoni orqali istalgan vaqtda eksperimentator bilan bog'lanishi mumkin edi.&lt;/p&gt;\n&lt;p&gt;Eksperiment 64-bitli Microsoft Windows 7.1.7601 service pack 1 (Microsoft Corporation, AQSh) operatsion tizimida ishlaydigan kompyuterda PsychoPy3 mustaqil dasturidan (Peirce, 2007, 3.0.7-versiya) foydalangan holda ishga tushirildi. Vizual rag'batlar 24 dyuymli BenQ XL2420Z ekranida (BenQ Corporation, Tayvan) 144 Gts nominal kadr chastotasi va 1920 × 1080 piksellar aniqligida taqdim etildi (eksperimentator uchun aks ettirilgan). Yorqinlik va rang kalibrlashi ekran sozlamalaridan foydalangan holda bajarildi va PsychoPy monitor markazidagi zinapoya tartibidan (staircase routine) foydalanib xromametr (Konica Minolta CS-150) yordamida tekshirildi; o'lchangan gamma egri chizig'ini OSF omborida onlayn topish mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Monitorning kalibrlanishi va PsychoPy kabi maxsus dasturlardan foydalanish kognitiv EEG paradigmalari uchun muhim bo'lgan vizual rag'batlarni kechikishlarsiz, vaqt va makon bo'yicha aniq taqdim etilishini ta'minlaydi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;EEG va periferik fiziologiya ma'lumotlarini yig'ish: biosignallar 24-bitli raqamlashtirish va doimiy tokdan (DC) 280 Gts gacha bo'lgan analog polosali filtrga ega BIP2Aux adapterli BrainVision actiCHamp kuchaytirgichi (Brain Products GmbH, Germaniya) yordamida kuchaytirildi. Kuchaytirgich 2 ta ActiPower PowerPacks (Brain Products GmbH, Germaniya) orqali doimiy tok batareyasi bilan quvvatlandi. Ma'lumotlar Microsoft Windows 7 da ishlaydigan mustaqil yozib olish kompyuteridan BrainVision Recorder (versiya 1.21.0303; Brain Products GmbH, Germaniya) yordamida 1 kGs namuna olish chastotasida yozib olindi. Eksperimentator kompyuteridan kelgan TTL triggerlar parallel port orqali kuchaytirgichga yuborildi.&lt;/p&gt;\n&lt;p&gt;EEG ma'lumotlari kengaytirilgan xalqaro 10-20 lokalizatsiya tizimiga muvofiq joylashtirilgan (Commitee, 1958; Oostenveld &amp;amp; Praamstra, 2001), faol ekranlashsiz faol Ag/AgCl elektrodlariga ega 64-kanal actiCAP tizimidan (Brain Products GmbH, Germaniya) foydalangan holda yig'ildi, bunda FCz onlayn yozuv referansi va AFz yerlashish nuqtasi sifatida ishlatildi. Empedanceni yaxshilash uchun peshona va quloq ortidagi teri spirt bilan artib tashlandi. Qopqoq Cz elektrodini nasion-inion va chap quloq-o'ng quloq o'qlariga markazlashtirish orqali joylashtirildi. Ma'lumotlar yig'ish tugagandan so'ng, elektrod pozitsiyalari Polhemus FastTrak tizimi (Polhemus, AQSh) va Curry dasturiy ta'minoti (8-versiya; Compumedics Neuroscan) yordamida raqamlashtirildi.&lt;/p&gt;\n&lt;p&gt;EKG ma'lumotlari EEG kuchaytirgichi tomonidan bipolyar yordamchi kanal sifatida yozib olindi: bir martalik elektrodlardan (Covidien, AQSh) foydalangan holda Einthovenning II o'tkazmasiga muvofiq elektrodlar o'ng o'rta o'mrov suyagiga va pastki chap qafasga joylashtirildi. EEG ma'lumotlari sifatini yaxshilash uchun ishtirokchilardan taklifnoma xatida soch turmaklash vositalaridan foydalanmaslik so'ralgan.&lt;/p&gt;\n&lt;h4 id=\"kozni-kuzatish-malumotlarini-yigish\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#kozni-kuzatish-malumotlarini-yigish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ko'zni kuzatish ma'lumotlarini yig'ish&lt;/span&gt;&lt;/a&gt;Ko'zni kuzatish ma'lumotlarini yig'ish&lt;/h4&gt;\n&lt;p&gt;Binokulyar nigoh holati (ekrandagi koordinatalar) va qorachiq hajmi stol ustiga o'rnatiladigan EyeLink 1000 Plus ko'zni kuzatish tizimi (SR Research Ltd.) va mustaqil yozib olish kompyuterida ishlaydigan EyeLink 1000 Plus Host dasturiy ta'minoti yordamida yozib olindi. Eksperimentator kompyuteri va EyeLink yozib olish tizimi Ethernet orqali ulangan va treker tizimi PyLink Python moduli (SR Research Ltd., 1.11.0.0-versiya) yordamida boshqarilgan. Ma'lumotlar har bir blok orasidagi yozib olish tanaffuslari bilan 500 Gts namuna olish chastotasida yozib olindi. Ko'z trekeri har bir sinov blokidan oldin 13 nuqtali grizontal va vertikal kalibrlash tartibi yordamida (qayta) kalibrlandi. Ma'lumotlar sifatini yaxshilash uchun ishtirokchilardan taklifnoma xatida makiyaj, ayniqsa, ko'z qalamchasi va tush surtmaslik so'ralgan.&lt;/p&gt;\n&lt;h4 id=\"malumotlarni-tahlil-qilish\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#malumotlarni-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ma'lumotlarni tahlil qilish&lt;/span&gt;&lt;/a&gt;Ma'lumotlarni tahlil qilish&lt;/h4&gt;\n&lt;p&gt;Ma'lumotlarni oldindan qayta ishlash, qayta ishlash va statistik tahlil qilish institutning yuqori unumdor kompyuterida (HPC) Python (3.10.4-versiya), conda virtual muhitidagi R (3.6.1-versiya) va Matlab (The MathWorks Inc., R2019b-versiya) yordamida amalga oshirildi. Rasmlar va natijalarni takrorlash uchun Jupyter bloknotlari OSF da onlayn tarzda ochiq foydalanish uchun mavjud.&lt;/p&gt;\n&lt;h4 id=\"eeg-malumotlarini-dastlabki-oldindan-qayta-ishlash\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#eeg-malumotlarini-dastlabki-oldindan-qayta-ishlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;EEG ma'lumotlarini dastlabki oldindan qayta ishlash&lt;/span&gt;&lt;/a&gt;EEG ma'lumotlarini dastlabki oldindan qayta ishlash&lt;/h4&gt;\n&lt;p&gt;EEG ma'lumotlari MNE-BIDS Python moduli (Appelhoff va boshq., 2019, 0.10-versiya) yordamida BIDS formatiga (Pernet va boshq., 2019, 1.6.0-versiya) o'tkazildi. Oldindan ro'yxatdan o'tkazilgan tahlil rejasidan chetga chiqqan holda, biz ICA ni o'z ichiga olgan oldindan qayta ishlash va tozalash quvuridan foydalanmadik. Buning o'rniga biz PREP quvuridan (0.56.0-versiya, MATLAB-dagi EEGLAB plagini, standart parametrlar to'plamidan foydalangan holda; Bigdely-Shamlo va boshq., 2015) foydalandik; bu faqat tarmoq shovqinini olib tashlash, (mustahkam) o'rtacha referatga qayta murojaat qilish hamda shovqinli kanallarni aniqlash va interpolyatsiya qilishdan iborat bo'lgan kamroq tajovuzkor, to'liq avtomatlashtirilgan dastlabki bosqichdagi oldindan qayta ishlash quvuri hisoblanadi. Ushbu qaror 1) jadal oldindan qayta ishlash va/yoki ma'lumotlarni rad etish ba'zida o'ylanganidan kamroq foydali bo'lishi mumkinligini ko'rsatadigan so'nggi ishlar (Delorme, 2023), chunki signal-shovqin nisbatidagi har qanday yutuq ma'lumotlarni rad etish tufayli yuzaga keladigan statistik quvvatning pasayishidan ustun turishi kerakligi va 2) ICA asosida ma'lumotlarni tozalash ma'lumotlarda qoldiq qoldirishi mumkinligini (Dimigen, 2020; Robbins va boshq., 2020) hamda ushbu qoldiqlar ushbu tadqiqotda rejalashtirilganidek, sezgir mashinali o'rganish algoritmlari uchun muammoli bo'lib qolishi mumkinligini ko'rsatgan ishlar (Quax va boshq., 2019; Thielen va boshq., 2019) asosida qabul qilindi.&lt;/p&gt;\n&lt;h4 id=\"time-resolved-decoding-from-eeg,-pupil-size,-and-instantaneous-heart-rate\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#time-resolved-decoding-from-eeg,-pupil-size,-and-instantaneous-heart-rate\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Time resolved decoding from EEG, pupil size, and instantaneous heart rate&lt;/span&gt;&lt;/a&gt;Time resolved decoding from EEG, pupil size, and instantaneous heart rate&lt;/h4&gt;\n&lt;p&gt;Biz ko'p o'lchovli fiziologik ma'lumotlardan (EEG, qorachiq hajmi, yurak urish tezligi) turli maqsadli ko'rsatkichlarni (stimul kategoriyalari va baholashlar) dekodlashga harakat qildik. Vaqt bo'yicha hal qilingan dekodlash siljish oynasi yondashuvi yordamida amalga oshirildi: 64 ta EEG datchiklari (yoki 2 ta qorachiq izi, yoki yagona yurak urish tezligi kanali) bo'ylab har bir vaqt namunasida the mustaqil dekodlash modellari moslashtirildi. Ushbu tahlil fiziologik signallardan baholash yoki shartni chiziqli tarzda dekodlash mumkinmi va qachon mumkinligini ko'rsatadigan dekodlash vaqt qatorini berdi. Dekodlash vaqt qatorlari keyinchalik ishtirokchilar bo'ylab ikkinchi darajali klaster-korreksiyadan o'tkazildi (pastga qarang). Dekodlash quvurlari: biz takroriy taqdimot (tasvirning 1-/2-taqdimoti), stimul sharti (Mooney/san'at) va sarlavha sharti (haqiqiy yoki soxta sarlavha) uchun 3 xil kategorik tasniflash quvurini va turli baholashlar (qiziquvchanlik, aha, yoqish, tushunish; barchasi ishtirokchi bo'yicha z-ballarga aylantirilgan) uchun 4 xil suzuvchi qiymatni bashorat qilish quvurini qurdik. Dekoder dizayni Gwilliams and King (2020) ishiga yaqindan ergashadi va MNE Python'da amalga oshirilgan: biz kategorik tasniflash uchun logistik regressiyani (scikit-learn; Pedregosa et al., 2011, standart parametrlar: C = 1) va uzluksiz bashorat qilish uchun qirrali regressiyani (standart parametrlar: alpha = 1) qo'lladik. Dekodlash unumdorligi stratifikatsiyalangan 10 karrali kross-validatsiyada baholandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Stratifikatsiyalangan 10 karrali kross-validatsiya ma'lumotlarni 10 qismga bo'lib, har bir qismdagi sinf nisbatlarini saqlagan holda model sifatini tekshirish usulidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Dekodlash aniqligi logistik regressiya uchun AUC metrikasi va qirrali regressiya uchun Spearman R yordamida baholandi. Barcha dekoderlar o'quv to'plamining o'rtacha qiymati va standart og'ishishi bo'yicha normallashtirilgan ma'lumotlardan foydalandi.&lt;/p&gt;\n&lt;h4 id=\"data-features\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#data-features\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data features&lt;/span&gt;&lt;/a&gt;Data features&lt;/h4&gt;\n&lt;p&gt;Ushbu dekodlash quvurlari turli ma'lumotlarga qo'llandi: birinchidan, barcha oltmish to'rtta kanaldagi vaqt sohasidagi EEG'ga (bitta sinovli ERP'lar) – uzluksiz PREP oldindan ishlov berilgan EEG ma'lumotlari polosali filtrdan o'tkazildi (0.1–40 Gts, FIR, MNE standart parametri) va epochalarga bo'lindi (stimul boshlanishi atrofida -0.5–5 s); asosiy chiziq tuzatishi (baseline correction) asosiy chiziq davrining o'rtacha qiymatini (-0.5–0 s) butun epochadan ayirish yo'li bilan amalga oshirildi (har bir sinov va kanal uchun alohida). Ma'lumotlar cheksiz mos yozuvga (REST; Yao, 2001, MNE'da amalga oshirilgan) qayta moslashtirildi. Nihoyat, to'liq avtomatik sinovni rad etish tartibi qo'llanildi (har bir ishtirokchi doirasidagi sinov ma'lumotlarining min-max amplitudasiga asoslanib): tegishli dekodlash kichik to'plamida ishlatilgan barcha sinovlarning min-max amplitudalarining empirik taqsimotiga gamma taqsimoti moslashtirildi va moslashtirilgan taqsimotning 90-persentilidan tashqarida bo'lgan epochalar chiqarib tashlandi. Ushbu qadam sinovlar sonini kamaytirgan bo'lsa-da (pastdagi raqamlar), biz buni zarur deb topdik, chunki masshtablash bosqichi dekodlash quvurini chiqarib tashlashlarga zaif qiladi. Dekodlash uchun ikkinchi ma'lumotlar to'plami barcha oltmish to'rtta kanaldagi kanonik EEG chastota diapazonlaridagi chastota diapazoni quvvati edi – PREP oldindan ishlov berilgan uzluksiz EEG ma'lumotlari tegishli chastota diapazoniga polosali filtrdan o'tkazildi (delta: 0.1–4 Gts; teta: 4–8 Gts; alfa: 8–23 Gts; beta: 13–30 Gts; gamma: 30–80 Gts – FIR, MNE standart parametri) va tahlil qilinadigan ma'lumotlarda chekka artefaktlarni oldini olish uchun dastlab kerak bo'lganidan uzunroq epochalarga bo'lindi (delta uchun -2–6.5 s va qolgan diapazonlar uchun -1–5.5 s); bu bosqichda asosiy chiziq tuzatishi qo'llanilmadi. Ma'lumotlar cheksiz mos yozuvga qayta moslashtirildi. Tebranish faolligini ochib berish uchun chaqirilgan javob har bir alohida sinovdan ayirildi va Hilbert o'zgartirilgan EEG konvelusiya vaqt-chastota javobi (TFR) sifatida hisoblandi. Nihoyat, epochalar dekodlash uchun mo'ljallangan vaqt oynasiga qisqartirildi (-0.5–5 s) va butun epochadan asosiy chiziq davrining o'rtacha qiymatini (-0.5–0 s) ayirish orqali asosiy chiziq tuzatishi qo'llanildi (har bir sinov va kanal uchun alohida).&lt;/p&gt;\n&lt;p&gt;ERP ma'lumotlari uchun bajarilgan sinovni rad etish jarayoni takrorlandi. Uchinchi ma'lumotlar to'plami binokulyar qorachiq izi edi. Xom uzluksiz ma'lumotlar past chastotali filtrdan o'tkazildi (kesish chastotasi 10 Gts, FIR, MNE standart parametrlari). Ko'z yumilishi tufayli yo'qolgan ma'lumotlar chiziqli ravishda interpolyatsiya qilindi (MNE'ning interpolate_blinks funksiyasidan foydalangan holda) va min-max amplitudasi o'rtacha qiymatdan ikki standart og'ishdan katta bo'lgan sinovlar chetga chiqishlar sifatida rad etildi. To'rtinchi ma'lumotlar to'plami bir zumda yurak urish tezligi edi. EKG yozuvlari neurokit2 python moduli yordamida oldindan ishlov berildi (0.2.7 versiyasi; Makowski et al., 2021): yozuvlar neurokit2'ning ecg_invert funksiyasi yordamida teskari signalga tekshirildi va kerak bo'lsa teskari qilindi, dastlab kerak bo'lganidan uzunroq epochalarga bo'lindi (-3.5–8 s; asosiy chiziq tuzatishisiz), so'ngra ma'lumotlarni tozalash (neurokit'ning ecg_clean funksiyasi), R-pikni aniqlash (neurokit'ning ecg_peak funksiyasi) va bir zumdagi yurak urish tezligiga aylantirish (neurokit'ning ecg_rate funksiyasi, barchasi standart parametrlar bilan) bajarildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tasvir chastotasini pasaytirish (down-sampling) ma'lumotlar hajmini kichraytirish va hisoblashni tezlashtirish uchun signal nuqtalari sonini kamaytirish jarayonidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Nihoyat, epochalar dekodlash uchun mo'ljallangan vaqt oynasiga qisqartirildi (-0.5–5 s). Har bir sinovdagi yozuv sifati neurokit'ning ecg_quality funksiyasi yordamida (Zhao &amp;amp; Zhang, 2018 bo'yicha baholash usulidan foydalangan holda) baholandi va «a'lo» deb baholanmagan barcha sinovlar tahlildan chiqarib tashlandi. ERP, TFR, qorachiq va yurak urish tezligi ma'lumotlari dekodlashdan oldin 50 Gts chastotagacha pastga orqaga namuna olindi (MNE'ning standart parametrli resample funksiyasidan foydalangan holda).&lt;/p&gt;\n&lt;h4 id=\"sinovlarni-rad-etish\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#sinovlarni-rad-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sinovlarni rad etish&lt;/span&gt;&lt;/a&gt;Sinovlarni rad etish&lt;/h4&gt;\n&lt;p&gt;Quyida biz berilgan ma'lumotlar modaligidagi barcha turli xil dekodlash quvurlari bo'yicha sinovlarni rad etish haqida xabar beramiz. Takroriy ta'sir qilishni (1- yoki 2-taqdimot) va rag'batlantiruvchi kategoriyani (Muni yoki tasviriy san'at) dekodlash uchun barcha 64 ta sinov ishlatilgan (san'at va Muni tasvirlari), qolgan barcha tahlillarda faqat san'at sinovlari ishlatilgan (har bir ishtirokchiga 48 ta sinov). Chekka (outlier) sinovlarni rad etish mezonlari yuqorida har bir ma'lumotlar modaligiga ko'ra tavsiflangan.&lt;/p&gt;\n&lt;p&gt;Bundan tashqari, berilgan dekodlash quvuri doirasida ishtirokchi butunlay chetlashtirildi, agar 1) kross-validatsiya uchun talab qilinganidan kamroq sinovlar qolgan bo'lsa, yoki 2) ishtirokchining baholashlaridagi dispersiya dekodlash modeli yaqinlashishi uchun juda past bo'lsa. Yuqorida tavsiflangan tozalash va sinovlarni rad etish protseduralari past foizli diapazonda o'rtacha sinovlar rad etilishiga olib keldi. Shuni yodda tutingki, maksimal sinovlar soni quvurga qarab farq qilgan.&lt;/p&gt;\n&lt;p&gt;ERP – 46–49 ishtirokchidan olingan ma'lumotlar (o'rtacha = 49 tadan 48,2 ta yoki 98,45%) va ular orasida mumkin bo'lgan maksimal sinovlarning 91,3–95,6% (o'rtacha = 93,51%) ishlatilgan. EEG delta – 47–49 ishtirokchidan olingan ma'lumotlar (o'rtacha = 49 tadan 48,3 ta yoki 98,64%) va ular orasida mumkin bo'lgan maksimal sinovlarning 91,0–95,3% (o'rtacha = 92,85%) ishlatilgan. EEG teta – 41–49 ishtirokchidan olingan ma'lumotlar (o'rtacha = 49 tadan 47,9 ta yoki 97,71%) va ular orasida mumkin bo'lgan maksimal sinovlarning 87,8–93,3% (o'rtacha = 91,06%) ishlatilgan. EEG alfa – 45–49 ishtirokchidan olingan ma'lumotlar (o'rtacha = 49 tadan 48,3 ta yoki 98,64%) va ular orasida mumkin bo'lgan maksimal sinovlarning 88,7–94,5% (o'rtacha = 91,46%) ishlatilgan. EEG beta – 47–49 ishtirokchidan olingan ma'lumotlar (o'rtacha = 49 tadan 48,5 ta yoki 98,89%) va ular orasida mumkin bo'lgan maksimal sinovlarning 93,3–96,6% (o'rtacha = 95,01%) ishlatilgan. EEG gamma – 47–49 ishtirokchidan olingan ma'lumotlar (o'rtacha = 49 tadan 48,4 ta yoki 98,70%) va ular orasida mumkin bo'lgan maksimal sinovlarning 91,8–96,6% (o'rtacha = 94,29%) ishlatilgan. Ko'z qorachig'ining kengayishi – 47–49 ishtirokchidan olingan ma'lumotlar (o'rtacha = 49 tadan 48,3 ta yoki 98,64%) va ular orasida mumkin bo'lgan maksimal sinovlarning 98,9–99,4% (o'rtacha = 99,07%) ishlatilgan. Yurak urish tezligi – 45–49 ishtirokchidan olingan ma'lumotlar (o'rtacha = 49 tadan 47,0 ta yoki 95,98%) va ular orasida mumkin bo'lgan maksimal sinovlarning 95,8–98,3% (o'rtacha = 97,12%) ishlatilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kross-validatsiya — bu mashinaviy o'qitish modelining yangi ma'lumotlarda qanchalik yaxshi ishlashini baholash uchun ma'lumotlar to'plamini o'quv va sinov qismlariga bo'ladigan usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"dekodlash-aniqliklarining-ikkinchi-darajali-statistik-tahlili\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#dekodlash-aniqliklarining-ikkinchi-darajali-statistik-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dekodlash aniqliklarining ikkinchi darajali statistik tahlili&lt;/span&gt;&lt;/a&gt;Dekodlash aniqliklarining ikkinchi darajali statistik tahlili&lt;/h4&gt;\n&lt;p&gt;Bir o'lchovli va ko'p o'lchovli dekodlash natijalarining ahamyliligi MIning permutation_cluster_1samp_test funksiyasida amalga oshirilgan bir tanlanmali permutatsion klaster testi (Maris &amp;amp; Oostenveld, 2007) yordamida sinovdan o'tkazildi. Shaxsiy dekodlash traektoriyalaridagi shovqinni hisobga olish uchun har bir ishtirokchi uchun dekodlash vaqt qatorlari permutatsiya testidan oldin biroz tekislandi (scipy's gaussian_filter funksiyasi yordamida, sigma=1.0 bilan).&lt;/p&gt;\n&lt;p&gt;Ma'lumotlar tegishli metrika uchun nazariy tasodifiy daraja atrofida markazlashtirildi (AUC uchun 0.5, Spirme R uchun 0). Keyin permutatsion klaster testi bajarildi: birinchidan, bir tomonlama bir tanlanmali t-testlar asl ma'lumotlarning har bir vaqt nuqtasida amalga oshirildi. Fazoviy-vaqtinchalik qo'shni ma'lumotlar nuqtalari p &amp;lt; 0.05 ga teng bo'lgan klaster hosil qiluvchi chegara asosida klasterlarga biriktirildi va har bir klaster uchun test statistikasi vaqt bo'yicha t-qiymatlar yig'indisi sifatida topildi.&lt;/p&gt;\n&lt;p&gt;Keyin permutatsion nol taqsimot yaratildi (10000 ta permutatsiya qadami): tasodifiy belgi o'zgarishlari bilan asl ma'lumotlardan tasodifiylashtirilgan ma'lumotlar yaratildi va yangi klasterlar va test statistikasi to'plami hosil qilindi. Asl test statistikasi keyinchalik statistik ahamylilikni baholash uchun permutatsion nol taqsimot bilan taqqoslandi.&lt;/p&gt;\n&lt;h4 id=\"malumotlarni-vizualizatsiya-qilish1\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#malumotlarni-vizualizatsiya-qilish1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ma'lumotlarni vizualizatsiya qilish&lt;/span&gt;&lt;/a&gt;Ma'lumotlarni vizualizatsiya qilish&lt;/h4&gt;\n&lt;p&gt;Vaqt bo'yicha hal qilingan dekodlash tahlili uchun ma'lumotlarni vizualizatsiya qilish matplotlib Python moduli (Hunter, 2007, 3.8.0-versiya) yordamida maxsus kod yordamida yaratildi va .svg formatida eksport qilindi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-f3.jpg\" alt=\"3-rasm: Takroriy taqdimot va tasvir turini deshifrlash (san'at asari va Mooney sinovlari) – a) Tasvirning 1- yoki 2-taqd\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm: Takroriy taqdimot va tasvir turini deshifrlash (san'at asari va Mooney sinovlari) – a) Tasvirning 1- yoki 2-taqdimoti: deshifrlash deyarli barcha ma'lumotlar modaliklaridan ishonchli tarzda mumkin edi, ammo vaqt domenidagi EEG dan eng yaxshisi (butun sinov davomida tasodifdan sezilarli darajada yuqori, tasvir boshlanganidan keyin taxminan 0,5–1 s atrofida aniq cho'qqi bilan). O'quv izlarini deshifrlashda Mooney tasvirlariga qaraganda san'at bilan yaxshiroq ishladi, bu yerda deshifrlash faqat sinov oxirida muhim bo'ldi. Bu qisman ushbu kategoriyadagi kichikroq sinov sonlari bilan bog'liq bo'lishi mumkin (har bir ishtirokchi uchun 48 ta san'at va 16 ta Mooney sinovlari). Bir zumda yurak urish tezligi sinovlarning boshida kategoriya oldindan aytib berishga o'xshaydi. Buni birgalikda qabul qilsak, bu takroriy taqdimot paytida ogohlantiruvchilar bir xil tarzda qayta ishlanmaganligini qat'iy ko'rsatadi. b) Rag'batlantiruvchi domen (Mooney tasviri yoki san'at asari): tasvir kategoriyasi EEG, o'quv ma'lumotlari va yurak urish tezligi uchun tasvir taqdimotining boshidan boshlab ishonchli tarzda deshifrlanishi mumkin edi, yana vaqt domenidagi EEG dan eng yaxshisi. Shuni ta'kidlash kerakki, tasniflash dastlabki taqdimotga qaraganda ikkinchi tasvir taqdimoti paytida ishonchliroq ishladi (farq kam bo'lgan o'quv ma'lumotlaridan tashqari). Chastota domenidagi EEG (gemma diapazonidan tashqari) ikkala kategoriya uchun ham shovqinli, ammo muhim deshifrlash natijalarini berdi; barcha sinovlar va shartlar grafiklari uchun Supp.A.2.5 ga qarang. Deshifrlash vaqt kurslari qatlamli 10 martalik o'zaro tekshiruvda har bir individual ishtirokchi uchun hisoblangan; ahamiyatlilik ikkinchi darajali statistik sinov (klasterga asoslangan permutatsiya t-testi, ahamiyatlilik darajasi p &amp;lt; 0,05) bilan aniqlandi. X o'qi tasodif darajasini aks ettiradi (ishlatilgan AUC metrikasi uchun 0,5).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-f4.jpg\" alt=\"4-rasm: Ma'no yaratishning fiziologik korrelatsiyalarini deshifrlash (faqat san'at asari sinovlari) – a) «Sarlavha effek\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm: Ma'no yaratishning fiziologik korrelatsiyalarini deshifrlash (faqat san'at asari sinovlari) – a) «Sarlavha effekti»ni deshifrlash: biz rasm rag'batlantiruvchisi o'zining haqiqiy sarlavhasi bilan yoki ma'lumotsiz soxta yorliq («nomsiz») bilan birlashtirilganligini sezilarli darajada deshifrlashga muvaffaq bo'ldik. Bu ikkinchi ko'rish paytida (sarlavhadan keyin) ham vaqt domenidagi EEG dan, shuningdek o'quv hajmi va yurak urish tezligidan eng yaxshi ishlaydi (2-taqdimot paytida yurak urish tezligi oldingi ishlov berishdan ta'sirlangan ko'rinadi, masalan, sarlavha taqdimoti paytida va deshifrlash natijalari tasvir boshlanishidan oldin va qisqa vaqt o'tgach eng yaxshidir). Kutilganidek, sarlavha shartini tasvirlarning birinchi taqdimotidan (sarlavha taqdim etilishidan oldin) deshifrlab bo'lmadi. b) Sarlavha uchun qiziqishning sinov bo'yicha reytinglarini deshifrlash, aha, estetik yoqtirish va tushunish tuyg'usi: biz yozib olingan fiziologik signallarning bir yoki bir nechtasidan har bir reyting turini deshifrlashimiz mumkin edi. Sezilgan tushunish vaqt domenidagi EEG dan (ham sarlavhadan oldingi, ham keyingi sinovlarda), kechki delta diapazoni quvvatidan (sarlavhadan keyingi sinovlarda) va yurak urish tezligidan (sarlavhadan keyingi sinovlarda, ozgina oldinroq bo'lsa-da, sarlavha shartini deshifrlash uchun vaqt kurslariga o'xshash vaqt kursi bilan) eng yaxshi deshifrlanishi mumkin edi. O'quvchining kengayishi sarlavhadan keyingi sinovlarda ham tasodifdan yuqori deshifrlashni ko'rsatdi (ERP larga o'xshash vaqt kursi bilan), lekin ahamiyatli bo'lmadi. Sarlavhaga bo'lgan qiziqish kechki sarlavhadan oldingi o'quv signali va erta sarlavhadan keyingi vaqt domenidagi EEG dan sezilarli darajada deshifrlanishi mumkin edi. Tushuncha (aha) reytinglari sarlavhadan keyingi sinovlarning boshida o'quvchining hajmidan sezilarli darajada deshifrlanishi mumkin edi. Estetik yoqtirish reytinglari sarlavhadan keyingi vaqt domenidagi EEG da muhim deshifrlashning qisqa cho'qqisini ko'rsatdi. Ahamiyatli bo'lmasa-da, o'quvchi hajmi signali erta sarlavhadan oldingi sinovlarda sezilarli cho'qqi bilan odatda tasodifdan yuqori deshifrlashni ta'minladi. Boshqa ma'lumotlar modaliklari sarlavhadan oldingi yoki keyingi sinovlarda muhim natijalarni ko'rsatmadi; barcha sinovlar va shartlar grafiklari uchun Supp.A.2.5 ga qarang. Deshifrlash vaqt kurslari qatlamli 10 martalik o'zaro tekshiruvda har bir individual ishtirokchi uchun hisoblangan; ahamiyatlilik ikkinchi darajali statistik sinov (klasterga asoslangan permutatsiya t-testi, ahamiyatlilik darajasi p &amp;lt; 0,05) bilan aniqlandi. X o'qi tasodif darajasini aks ettiradi (ikkilik deshifrlashda AUC metrikasi uchun 0,5 va uzluksiz reytinglarda sperman R metrikasi uchun 0).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1.jpg\" alt=\"5-rasm: EEG tadqiqoti uchun rag'batlantiruvchini kichik tanlash. Kulrang qutilar tanlangan rag'batlantiruvchilarni ko'rs\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm: EEG tadqiqoti uchun rag'batlantiruvchini kichik tanlash. Kulrang qutilar tanlangan rag'batlantiruvchilarni ko'rsatadi (har bir kategoriya uchun 16 tadan)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1-2.jpg\" alt=\"Rasm S1 (davomi 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1 (davomi 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1-3.jpg\" alt=\"Rasm S1 (davomi 3)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1 (davomi 3)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1-4.jpg\" alt=\"Rasm S1 (davomi 4)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1 (davomi 4)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1-5.jpg\" alt=\"Rasm S1 (davomi 5)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1 (davomi 5)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1-6.jpg\" alt=\"Rasm S1 (davomi 6)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1 (davomi 6)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1-7.jpg\" alt=\"Rasm S1 (davomi 7)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1 (davomi 7)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1-8.jpg\" alt=\"Rasm S1 (davomi 8)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1 (davomi 8)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1-9.jpg\" alt=\"Rasm S1 (davomi 9)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1 (davomi 9)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1-10.jpg\" alt=\"Rasm S1 (davomi 10)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1 (davomi 10)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS2.jpg\" alt=\"A.2-rasm: Baholarning korrelyatsiyasi. Takroriy o'lchovlar korrelyatsiyasi; qiymatlar R ni ko'rsatadi; barcha p &amp;lt; 0.05 (\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A.2-rasm: Baholarning korrelyatsiyasi. Takroriy o'lchovlar korrelyatsiyasi; qiymatlar R ni ko'rsatadi; barcha p &amp;lt; 0.05 (1-tajriba ma'lumotlari).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS3.jpg\" alt=\"A.3-rasm: Baholarning (no)chiziqli aloqasi. Stimul kategoriyalari bo'yicha guruhlangan lokal regressiya (LOWESS) egri ch\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A.3-rasm: Baholarning (no)chiziqli aloqasi. Stimul kategoriyalari bo'yicha guruhlangan lokal regressiya (LOWESS) egri chiziqli sochilish diagrammalari (1-tajriba ma'lumotlari).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS4.jpg\" alt=\"A.4-rasm: Vaqt sohasidagi signallardagi umumiy o'rtacha fiziologik javoblar – 1-chi va 2-chi taqdimot. Barcha san'at asa\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A.4-rasm: Vaqt sohasidagi signallardagi umumiy o'rtacha fiziologik javoblar – 1-chi va 2-chi taqdimot. Barcha san'at asari sinovlari bo'yicha umumiy o'rtacha javoblar ko'rsatilgan bo'lib, sinov shartlari bo'yicha bo'lingan (pretitle – nomigacha bo'lgan 1-chi taqdimot, posttitle – nomidan keyingi 2-chi taqdimot, diff – 2-taqdimot paytidagi iz minus 1-taqdimot paytidagi iz). EEG dagi rangli chiziqlar alohida kanallarni, qora chiziq umumiy o'rtachani tasvirlaydi, pastki qismida esa global maydon quvvati (GFP) joylashgan. Vaqt o'tishi ustida 6 ta vakillik vaqt nuqtalarida topografik grafiklar joylashgan (tanlov ma'lumotlarga asoslanmagan). Qorachiq hajmi va yurak urish tezligi mos ravishda faqat 2 va 1 ta ma'lumot kanaliga ega, shuning uchun grafik toza.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS5.jpg\" alt=\"A.5-rasm: Tasvirlarning 1-chi va 2-chi taqdimoti uchun to'liq dekodlash natijalari. Vaqt o'tishi bilan dekodlash tezligi\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A.5-rasm: Tasvirlarning 1-chi va 2-chi taqdimoti uchun to'liq dekodlash natijalari. Vaqt o'tishi bilan dekodlash tezligi, ahamiyatli vaqt oynalari rangli taglik bilan belgilangan (ikkinchi darajali klaster permutatsiyasi T-testiga asoslangan ahamiyatlilik darajasi p &amp;lt; 0.05).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS6.jpg\" alt=\"A.6-rasm: Sarlavha oldidagi signalga asoslangan to'liq dekodlash natijalari (tasvirlarning 1-chi taqdimoti). Vaqt o'tish\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A.6-rasm: Sarlavha oldidagi signalga asoslangan to'liq dekodlash natijalari (tasvirlarning 1-chi taqdimoti). Vaqt o'tishi bilan dekodlash tezligi, ahamiyatli vaqt oynalari rangli taglik bilan belgilangan (ikkinchi darajali klaster permutatsiyasi T-testiga asoslangan ahamiyatlilik darajasi p &amp;lt; 0.05).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS7.jpg\" alt=\"Rasm A.7: Tasvirlarni 2-marta taqdim etishdan keyingi signal asosida to'liq dekodlash natijalari: vaqt bo'yicha dekodlas\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm A.7: Tasvirlarni 2-marta taqdim etishdan keyingi signal asosida to'liq dekodlash natijalari: vaqt bo'yicha dekodlash tezligi, muhim vaqt oynaari rangli fon bilan belgilangan (ikkinchi darajali klaster permutsion t-testi asosida ahamlilik darajasi p &amp;lt; 0.05).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS8.jpg\" alt=\"Rasm A.8: Differensial signal asosida to'liq dekodlash natijalari (2-taqdimot – 1-taqdimot): vaqt bo'yicha dekodlash tez\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm A.8: Differensial signal asosida to'liq dekodlash natijalari (2-taqdimot – 1-taqdimot): vaqt bo'yicha dekodlash tezligi, muhim vaqt oynalari rangli fon bilan belgilangan (ikkinchi darajali klaster permutsion t-testi asosida ahamlilik darajasi p &amp;lt; 0.05).&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" let
