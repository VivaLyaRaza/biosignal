            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"256\" cy=\"119\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"684\" cy=\"162\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Miya tanishni yangidan&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qanday farqlaydi: xotira&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;hujayra kodi topildi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h-f1.jpg\" alt=\"1-rasm. Vazifa, xulq-atvor va qayd etilgan hujayralarning qisqacha mazmuni. a, Tanishish sinovining misoli. b, Miya atla\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. Vazifa, xulq-atvor va qayd etilgan hujayralarning qisqacha mazmuni. a, Tanishish sinovining misoli. b, Miya atlasida ko'rsatilgan elektrod joylashuvi. Har bir nuqta yozib olish sohasi bo'yicha rang berilgan mikroprovoklar tutamini bildiradi. Oq modda yoki nishondan tashqari koordinatalar shablon miyaga birlashtirilgani sababli yuzaga keladi. c, Mumkin bo'lgan sinov turlari: Soxta ijobiy natijalar (qizil rangda belgilangan FP) subyekt «yangi» tasvirni «eski» sifatida tasniflaganda (Ha javobi) hosil bo'ladi. d, Chapda: o'rganilgan misol maqsadli tasvir (eski). O'ngda: o'rganilmagan (yangi), lekin yuqori ehtimollik bilan eski (FP) deb tasniflangan vizual o'xshash tuzoq tasviri (FP chastotasi = 54%). e, Izolyatsiya qilingan yagona birliklar soni (kulrang, barcha miya sohalari bo'yicha umumiy n = 3506) va xulq-atvorga asoslanib chiqarib tashlangan birliklar soni (qizil, n = 660). (f-j) Xulq-atvor. f, Xotirani tanib olish aniqligi. Har bir nuqta bitta sessiya (97 bemor bo'yicha n = 133), qizil rang o'rtacha ± standart og'ish. (g-f), Individual sessiyalar (kulrang) va o'rtacha (qizil) uchun ishonch funksiyasi sifatida aniqlik. Har bir ma'lumot nuqtasi har xil ishonch darajasini bildiradi, eski sinovlar uchun eng yuqori ishonch darajasi 6 ga teng. h, (g) da ko'rsatilgan ROC egri chizig'i ostidagi AUC. Uzuq-uzuq qizil chiziq kiritish mezonlaridan biridir (AUC&amp;gt;=0.6, kiritilgan n = 112, 84 bemor). i, Aniqlik yuqori va past ishonchdagi sinovlarda sezilarli darajada yuqori edi (p=1.24x10-31, t(110)=16.55, juftlashgan t-test). Har bir chiziq alohida sessiya. j, Noto'g'ri javoblar («ha» yoki «yo'q») to'g'ri javoblarga nisbatan sezilarli darajada past ishonch reytingiga ega edi (TP ga qarshi FP: t(110)=13.41, p= 7.05x10-25, juftlashgan t-test; TN ga qarshi FN: t(111)=-8.72, p= 3.11x10-14, juftlashgan t-test. E'tibor bering, manfiy t statistikasi «yo'q» javobi uchun pastroq ishonchga mos keladigan yuqori ishonch reytingi bilan bog'liq, a paneliga qarang). *** p&amp;lt;0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;O'xshashlik tufayli notanish narsani eski deb o'ylaganimizda, miyada obrazlarni ajratish mexanizmi ishdan chiqadi. Insonning alohida nerv hujayralari bu vazifani qanday bajarishi uzoq vaqt davomida noma'lum edi. Neyrobiologlar xotira testlari paytida yuzlab bemorlarning minglab neyronlari faolligini yozib olishdi. Ma'lum bo'lishicha, gippokampda haqiqiy tanish obrazlar va ularga o'xshash soxta stimullarni farqlovchi maxsus hujayralar mavjud. Bu kashfiyot insonlarda xotirani ajratishning hujayra mexanizmi borligini ilk bor tasdiqlaydi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;97 bemorda xotira testlari paytida 3506 ta neyron faolligi yozib olindi.&lt;/li&gt;\n&lt;li&gt;Haqiqiy xotira va soxta obrazlarni farqlovchi neyronlar topildi.&lt;/li&gt;\n&lt;li&gt;Bu hujayralarning o'chirilishi gippokampdagi xotira kuchini buzadi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqotchilar miya yangi ma'lumotlar bilan mavjud xotiralar orasidagi chegarani qanday belgilashini o'rganishdi. Obrazlarni ajratish deb nomlanuvchi bu jarayon hayvonlarda yaxshi o'rganilgan bo'lsa-da, insonlarda alohida neyronlar darajasida isbot topmagan edi. Ish davomida olimlar vizual obrazlarni tanib olish testi paytida 97 nafar bemorning 3506 ta yakka neyronining faolligini qayd etdilar. Ishtirokchilarga rasmlar ko'rsatilib, ularni oldin ko'rgan-ko'rmaganligini va javobga qanchalik ishonishlarini baholash so'raldi.&lt;/p&gt;\n&lt;p&gt;Tahlillar shuni ko'rsatdiki, to'g'ri tanilgan tanish ob'ektlar va eski deb xato qilingan yangi rasmlarga turlicha javob beruvchi maxsus neyronlar mavjud. Bunday hujayralar gippokamp va miyaning boshqa qismlarida aniqlandi. Ushbu elementlar tahlil modelidan olib tashlanganda, xotira kuchi gradienti yo'qoldi, bu ularning o'xshash xotira izlarini farqlashdagi rolini tasdiqlaydi. Neyron populyatsiyalari darajasida bu signallar gippokampdagi xotira haqiqatini va motor zonasidagi yakuniy qarorni bashorat qildi.&lt;/p&gt;\n&lt;p&gt;Olingan natijalar odamlar epizodik xotirani kodlash uchun obrazlarni ajratishdan foydalanishi haqidagi uzoq yillik bahsga nuqta qo'yadi. Ilgari aksariyat ma'lumotlar fMRT orqali yoki o'xshash ob'ektlar farqini ko'rsatmaydigan konseptual neyronlar asosida olingan edi. Yangi tadqiqot yakka neyronlar faolligini xotira xatolari bilan bog'lab, miyaning qaror qabul qilish jarayonini ko'rsatib beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot dori vositalariga chidamli tutqanoq bilan og'rigan bemorlarda o'tkazilgan, bu esa vaqtinchalik bo'laklar ishiga ta'sir qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Nazariy modellar shuni ko'rsatadiki, patternlarni ajratish — gippokamp tomonidan amalga oshirilishi taxmin qilinadigan hisoblash jarayoni — bizga tanish va yangi narsalarni farqlash imkonini beradi. Biroq, patternlarni ajratish inson gippokampida ishlaydimi yoki yo'qmi, degan masala bahsli bo'lib qolmoqda, chunki alohida neyronlar darajasida hech qanday korrelyat aniqlanmagan. Biz 97 nafar bemor xotirani tanib olish vazifasini bajarayotganda inson miyasidagi 3506 ta alohida neyronning faoliyatini qayd etdik, bunda ilgari ko'rilgan tasvirlarga o'xshash yangi tasvirlar noto'g'ri xotiralarga va ular bilan bog'liq xulq-atvor xatolariga olib keldi.&lt;/p&gt;\n&lt;p&gt;Biz miya bo'ylab tarqalgan xotiraga selektiv bo'lgan ikki turdagi neyronni aniqladik: noto'g'ri tan olingan yangi va to'g'ri tan olingan tanish tasvirlarga patternlarni ajratish bilan mos keladigan tarzda turlicha javob beradigan neyronlar va sub'ektning tanlovini bildiruvchi neyronlar. Populyatsiya darajasida bu hujayralar gippokampdagi mnemonik haqiqatni va pre-supplementar motor sohasidagi qarorni bashorat qildi, bu mnemonik signallardan qaror qabul qilishgacha bo'lgan jarayonni ko'rsatadi. Patternlarni ajratish signallarini beruvchi hujayralarni olib tashlash gippokampda mavjud bo'lgan uzluksiz xotira kuchi gradientini yo'q qildi, bu esa ushbu hujayralarning turli kuchdagi xotiralarni ajratishdagi rolini ko'rsatadi. Ushbu natijalar inson gippokampida mnemonik patternlarni ajratish uchun alohida hujayra korrelyatini belgilaydi va uning epizodik xotiradagi xulq-atvor ahamiyatini ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Inson gippokampida patternlarni ajratishni ta'minlovchi neyronlar aniqlandi: ular o'xshash yangi va tanish stimullarni farqlaydi, bu aniq epizodik xotiralarni shakllantirish uchun juda muhimdir.&lt;br /&gt;\n[!tip] Patternlarni ajratish — bu miya o'xshash kiruvchi signallarni aniq, bir-biriga o'xshamaydigan neyron tasvirlarga aylantiradigan neyrobiologik jarayon bo'lib, o'xshash voqealar o'rtasidagi chalkashliklarning oldini oladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Odamlar individual tajribalarning katta miqdordagi batafsil xotiralarini shakllantira oladilar, bu qobiliyat bizga rejalashtirish, o‘rganish va qaror qabul qilish imkonini beradi. Tajribalarimizning ko‘p qismi juda o‘xshash muhitlarda (masalan, uyda yoki ofisda) sodir bo‘lishiga qaramay, ularning ko‘pchiligi alohida xotiralar sifatida kodlanadi. Asosiy ochiq savollardan biri miya bu vazifani qanday bajarishidir. Ushbu muammoni hal qilish ikki xil, ko‘rinishidan mos kelmaydigan maqsadlar o‘rtasidagi kelishuvni hal qilishni talab qiladi. Bir tomondan, tanish narsa ko‘plab turli kontekstlarda tan olinishi kerak, bu umumlashtirish va invariantlikni talab qiladi. Boshqa tomondan, yangi narsalar, hatto juda o‘xshash bo‘lsa ham, saqlangan xotiralardan farqlanishi kerak, bu esa nozik mnemonik farqlashni talab qiladi. Muhimi, bu farqlash ko‘pincha bir marta ta’sir etgandan so‘ng (masalan, epizodik xotiradagi kabi) sodir bo‘lishi kerak. Ushbu bir-birini to‘ldiruvchi jarayonlar mos ravishda patternni yakunlash (pattern completion) va patternni ajratish (pattern separation) deb ataladi. Shunga ko‘ra, sohadagi asosiy e’tibor xotira shakllanishi uchun muhim bo‘lgan gipokampda (HPC) ushbu ikki jarayonning belgilarini aniqlashga qaratilgan. Biroq, keng qamrovli adabiyotlarga qaramay, patternni ajratish inson epizodik xotirasida umuman rol o‘ynaydimi yoki yo‘qmi, noma’lumligicha qolmoqda. Bilimning ushbu katta bo‘shlig‘ining asosiy sababi shundaki, odamlarda patternni ajratishning yagona neyron korrelyati aniqlanmagan. Bu yerda biz xotira kuchi signallari uchun bunday korrelyatni aniqlaymiz.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ushbu ishda inson gipokampida patternni ajratishning neyron korrelyati birinchi marta aniqlandi, bu uning epizodik xotiradagi roli haqidagi uzoq davom etgan bahsni hal qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Inson xotirasida patternni ajratish roli uchun neyrobiologik dalillar asosan fMRI yordamida invaziv bo‘lmagan neyroimagingdan olingan. BOLD-fMRI darajasida gipokampdagi faollik ilgari ko‘rilgan narsalarga o‘xshash yangi stimullar bo‘lgan “jalb qiluvchi” (lure) stimullarga nisbatan takrorlanishning bostirilishi yo‘qligini ko‘rsatadi. Bu pattern juda o‘xshash kirish ma’lumotlari o‘rtasida muvaffaqiyatli farqlashning dalili sifatida va shuning uchun patternni ajratish jarayonining aksi sifatida keng qabul qilingan. Biroq, bir nechta turli nazariy mexanizmlar — jumladan, konyunktiv kodlash va moslik-nomoslik yoki yangilik signallari — BOLD-fMRI signallarining aynan shu patternini keltirib chiqarishi mumkin, bu esa ushbu yondashuvni turli nazariyalar o‘rtasida vositachilik qilish uchun yaroqsiz qiladi. Bundan tashqari, ushbu tadqiqotlarda patternni ajratishning ushbu belgisi mnemonik jarayonlar bilan bog‘liqligi ko‘rsatilmagan, chunki ishtirokchilarning taqdim etilgan stimullarga bo‘lgan xotirasi sinovdan o‘tkazilmagan.&lt;/p&gt;\n&lt;p&gt;Neyronlar darajasida, aksincha, bugungi kunga qadar ko‘pgina ishlar inson miyasida patternni ajratish mavjud emasligini ko‘rsatadi. Masalan, inson HPC hujayralaridan olingan yozuvlar shuni ko‘rsatadiki, kontseptual neyronlar stimul identifikatsiyasini mavhum tarzda kodlaydi, agar stimul bir xil kontseptsiya yoki vizual kategoriyadan bo‘lsa, hatto nisbatan katta farqlarga ham sezgirlik yo‘q. Bu javob patterni, agar bu hujayralarning faolligi patternni ajratish natijasi bo‘lsa, kutilgan narsaning aksidir. Buning sababi shundaki, yuqori invariant faollik o‘xshash, ammo farqli kirishlar uchun bir-birining ustiga chiqadigan tasvirlarga olib keladi va ularni ajratib bo‘lmaydigan qiladi. Ushbu topilmalar patternni ajratish inson epizodik xotirasida hech qanday rol o‘ynamaydi degan xulosani qo‘llab-quvvatlaydi. Buning o‘rniga, epizodik xotiralar kontseptual hujayralarning qisman ustma-ust tushadigan ansambllari tomonidan kodlanishi taklif qilingan, bu tizimda patternni ajratish hech qanday rol o‘ynamaydi. Ushbu taklif hal qilinmagan keng ko‘lamli bahslarni keltirib chiqardi. Bu yerda, yagona neyron korrelyatini aniqlash orqali, biz inson gipokampida patternni ajratish dalillarini ko‘rsatib, ushbu bahsni hal qilamiz.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Patternni ajratish — bu miyaga o‘xshash voqealarni noyob xotiralar sifatida kodlash imkonini beruvchi neyron mexanizmi bo‘lib, ularning aralashib ketishining oldini oladi, patternni yakunlash esa qisman signal asosida to‘liq xotirani tiklash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Boshqa tomondan, kemiruvchilarda patternni ajratish uchun dalillar fazoviy kodlash sohasida kuchli. Asosiy topilma shundaki, gipokampdagi joy neyronlari (place cells) atrof-muhitdagi nozik o‘zgarishlarga javoban o‘z faoliyatini o‘zgartiradi («remap»), bu esa patternni ajratishdan kutilganidek, ikki o‘xshash, ammo farqli muhitlar uchun korrelyatsiyalanmagan kodga olib keladi. Nazariy jihatdan, bu topilmaning izohi konyunktiv kodlash natijasi bo‘lib, bu ko‘pincha yuqori fan-out nisbati natijasida yuzaga keladigan kodlash turidir. Masalan, gipokampda entorinal korteksdan tishli girusga (DG) bo‘lgan siyrak proyeksiyalar shunga olib keladiki, alohida DG neyronlari faqat kirish belgilarining noyob kombinatsiyalari (konyunksiyalari) tomonidan faollashadi. Ushbu kodlash sxemasida ikki o‘xshash stimul (bu yerda ikki xil joy) uchun DG neyronlarining turli populyatsiyalari jalb qilinadi, chunki kirish ma’lumotlaridagi kichik o‘zgarishlar ham mavjud belgilar kombinatsiyasini o‘zgartiradi.&lt;/p&gt;\n&lt;p&gt;Patternni ajratishning dastlabki taklifchilari uning asosiy roli organizmga tanish va ularga o‘xshash yangi stimullarni farqlash imkonini berish ekanligini ta’kidladilar. Xulq-atvor jihatidan bu qobiliyat medial temporal lobning qismlaridagi zararlanishlar tufayli buziladi, ular kemiruvchilar tadqiqotlariga asoslanib, neyron patternni ajratish uchun muhim deb hisoblanadi. Xususan, DG shikastlangan bemorlar ilgari ko‘rilgan va juda o‘xshash tasvirlarni farqlashda buzilishlarni ko‘rsatadilar — shuning uchun ularda patternni ajratishning xulq-atvor belgisi yo‘q. Biroq, patternni ajratishning bu jihati na kemiruvchilar tadqiqotlarida, na odamlardagi kontseptual hujayralar tadqiqotlarida tekshirilmagan, ular o‘rniga tajriba mazmuni (mos ravishda fazoviy va kontseptual) tasvirlari o‘rtasidagi patternni ajratishni sinab ko‘rgan. Natijada, ushbu tadqiqotlar xotira uchun eng muhim bo‘lgan patternni ajratish jihatini: yangi va tanish stimullar o‘rtasidagi farqni ko‘rib chiqmadi. Aksincha, bu aynan patternni ajratish bilan mos keladigan dalillarni xabar qiluvchi tegishli fMRI tadqiqotlarida tekshirilgan taqqoslashdir.&lt;/p&gt;\n&lt;p&gt;Ushbu bo‘shliqni to‘ldirish uchun biz inson temporal lobidagi xotira kuchi signallari patternni ajratish belgilarini namoyon etishini tekshirdik. Biz buni epilepsiya bilan og‘rigan bemorlarda bir-biriga o‘xshashlik darajasi turlicha bo‘lgan tasvirlar bilan xotirani tanib olish vazifasini bajarayotganda alohida neyron faoliyatini yozib olish orqali amalga oshirdik.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"yozib-olishlar\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#yozib-olishlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yozib olishlar&lt;/span&gt;&lt;/a&gt;Yozib olishlar&lt;/h4&gt;\n&lt;p&gt;Bemorlar topshiriqni bajarayotganda, biz HPC (n=1093), amigdala (AMY, n=1359), dorsal oldingi singulyar korteks (ACC, n=826) va pre-supplementar motor sohasidan (preSMA, n=888; 1b,e-rasm) ikki tomonlama alohida neyron faoliyatini yozib oldik. Yozib olingan barcha sessiyalardan biz faqat yetarli xulq-atvor aniqligiga ega bo'lgan (bemor darajasidagi AUC &amp;gt; 0.6, 1h-rasmdagi qizil chiziq) va ham yuqori, ham past ishonch reytinglarini qamrab olgan sessiyalarni kiritdik (n=112 sessiya ushbu mezonlarga javob berdi, usullarga qarang). Kiritilgan barcha sessiyalar davomida biz mos ravishda HPC, AMY, ACC, preSMA da 950, 1187, 684 va 685 ta hujayrani yozib oldik (jami 3506, 1e-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tahlil aniqlik (AUC &amp;gt; 0.6) va javoblar ishonchliligi bo'yicha saralangan 112 sessiyadan 3506 ta neyronni qamrab oldi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"xotira-uchun-selektiv-hujayralar-xulq-atvor-notogri-bolganda-ham-haqiqiy-xotira-signalini-tashiydi\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#xotira-uchun-selektiv-hujayralar-xulq-atvor-notogri-bolganda-ham-haqiqiy-xotira-signalini-tashiydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xotira uchun selektiv hujayralar xulq-atvor noto'g'ri bo'lganda ham haqiqiy xotira signalini tashiydi&lt;/span&gt;&lt;/a&gt;Xotira uchun selektiv hujayralar xulq-atvor noto'g'ri bo'lganda ham haqiqiy xotira signalini tashiydi&lt;/h4&gt;\n&lt;p&gt;Keyin biz FP (yolg'on ijobiy) bilan bog'liq neyron javoblarining xususiyatlarini tekshiramiz. Biz buni xotira kuchi darajasiga qarab yangi va tanish stimullarga turlicha javob beradigan xotira uchun selektiv (MS) hujayralarni o'rganish orqali amalga oshirdik. Biz MS hujayralarini to'g'ri yangi va eski sinovlar o'rtasidagi stimul taqdimoti paytida otilish tezligini solishtirish orqali aniqladik (3a,b-rasmda misollar keltirilgan; usullarga qarang; bu yerda to'g'rilik bemorning o'sha sinovdagi javobining aniqligini anglatadi). Stimul toifasi bilan bog'liq chalkashliklarning oldini olish uchun biz har bir toifadagi stimullarni o'z ichiga olgan sinovlar bo'ylab otilish tezligi bo'yicha bir tomonlama ANOVA (1 × 5) yordamida toifalarni farqlaydigan hujayralarni ham tanladik. Hujayralarning sezilarli qismi barcha to'rtta yozib olish joyida MS hujayralari sifatida malakaga ega bo'ldi (3c-rasm). Barcha hujayralardan 10% (94/950) HPCda, 9% (102/1187) AMYda, 9% ACCda (60/684) va 16% (113/685) preSMAda (tasodifiy daraja 5%; mutlaq raqamlar uchun SN 3a-e-rasmga qarang) MS hujayralari sifatida malakaga ega bo'ldi. Boshqa tomondan, vizual toifalar uchun ham selektiv bo'lgan MS hujayralari (vizual-selektiv, VS hujayralari) kam uchraydi (barcha miya sohalarida &amp;lt;2%, 3c-rasm). MS hujayralarining javoblari ACCdan tashqari barcha miya sohalarida xotira kuchi bilan modulyatsiya qilingan: ularning signali past ishonchli sinovlarga nisbatan yuqori ishonchli sinovlarda kuchliroq bo'lgan (3d-rasm, HPC AUC 0.65±0.01 ga nisbatan 0.6±0.02, p=0.006, AMY 0.66±0.01 ga nisbatan 0.61±0.01, p=0.0009, ACC 0.66±0.01 ga nisbatan 0.62±0.03, p=0.1, preSMA 0.68±0.01 ga nisbatan 0.64±0.01, p=0.03, juft t-test; barcha sohalarda yangilik va tanishlikni afzal ko'radigan hujayralar uchun AUC taqqoslashi uchun 3e-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MS hujayralari (memory-selective) — stimulning yangi yoki tanishligiga qarab faolligi o'zgaradigan neyronlar bo'lib, ular xotira izining kuchini kodlashga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;MS hujayralari FP sinovlari paytida qanday javob berdi? Biz agar MS hujayralarining javobi naqsh ajratilishini (pattern separation) aks ettirsa, ularning javoblari xulq-atvor javobi ikkala holatda ham bir xil ('eski') bo'lishiga qaramay, haqiqiy eski (TP) va FP sinovlarini farqlashi kerak deb taxmin qildik (3f-rasm, ko'k). Gippokamp uchun naqsh ajratish nazariyasining ahamiyatini hisobga olgan holda, biz bu farq ayniqsa gippokampda kuchli bo'lishini bashorat qildik. Aksincha, agar FP sinovlari paytida MS hujayralarining javobi TP sinovlari paytidagidek bo'lsa (3f-rasm, magenta), hujayralar xotira haqida qaror qabul qilishni bildiradi va shuning uchun naqsh to'ldirilishini (pattern completion) aks ettiradi. Bir vaqtning o'zida vizual toifani sozlash tufayli yuzaga keladigan chalkashliklarning oldini olish uchun biz keyingi barcha tahlillar uchun vizual tarzda sozlangan MS hujayralarining oz sonini istisno qildik (usullarga qarang; buni qilish natijalarni o'zgartirmadi).&lt;/p&gt;\n&lt;p&gt;FP sinovlari paytida MS hujayralarining javobini baholash uchun biz to'g'ri sinovlar paytida taqdim etilgan stimullarni yangi yoki eski deb tasniflash uchun ikkilik yagona hujayrali dekoderni o'rgatdik. Agar o'quv to'plamida qoldirilgan sinovlar uchun yangi va eski dekodlash aniqligi tasodifdan yuqori bo'lsa, hujayra MS hujayrasi deb tasniflandi. Keyin biz MS hujayralarini tanlashda ko'rilmagan qoldirilgan sinovlarda TP va TN (to'g'ri eski va to'g'ri yangi) yoki TP va FP (to'g'ri eski va noto'g'ri yangi) diskriminatsiyalari uchun dekodlash samaradorligini baholadik. Ushbu yondashuv bizga miya sohalari bo'ylab ham to'g'ri, ham noto'g'ri signal sinovlari uchun dekodlash samaradorligini solishtirishga imkon berdi (biz faqat o'qitish/test bo'linishlarining kamida 75% da MS hujayralari deb tasniflangan hujayralardan foydalandik). Yagona hujayrali dekoderlar miya sohalari bo'ylab ajratilgan to'g'ri sinovlardan xotirani ishonchli dekodladi (3g-h-rasm, y o'qi; HPC dekodlash samaradorligi 0.61±0.07, AMY 0.60±0.06, ACC 0.64±0.06, preSMA 0.63±0.07, p=0.001; Tasodif 0.5). Xato sinovlariga o'tadigan bo'lsak, TP va FP sinovlarini dekodlash barcha MS hujayralari bo'yicha o'rtacha hisobda HPCda (0.54±0.11, p=0.001), shuningdek ACC va preSMAda (mos ravishda 0.54±0.11 va 0.55±0.12; ikkalasi uchun p=0.001) tasodifdan yuqori bo'ldi. FP sinovlarining haqiqiy holati dekodlanishi mumkin bo'lgan barcha uchta joyda, TP va TN dekodlash TP va FPga nisbatan sezilarli darajada aniqroq bo'ldi (3h-rasm; HPC p=7.5x10-5, ACC p=7.6x10-5, preSMA p=7.4x10-6, signrank test), bu xulq-atvorning dolzarbligini ta'kidlaydi. Ushbu topilma HPC, ACC va preSMA dagi MS hujayralarida guruh sifatida naqsh ajratish bilan bog'liq signalning mavjudligi bilan mos keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Dekodlash shuni ko'rsatdiki, HPC, ACC va preSMA dagi MS hujayralari haqiqiy eski stimullar va yolg'on ijobiy javoblarni farqlashga qodir, bu esa noto'g'ri tanib olishda ham naqsh ajratish mexanizmlari ishlayotganini ko'rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"pattern-ajratishning-alohida-neyron-imzosi-mtl-va-mfc-boylab-ms-hujayralarining-ikki-turi\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#pattern-ajratishning-alohida-neyron-imzosi-mtl-va-mfc-boylab-ms-hujayralarining-ikki-turi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Pattern ajratishning alohida neyron imzosi: MTL va MFC bo‘ylab MS hujayralarining ikki turi&lt;/span&gt;&lt;/a&gt;Pattern ajratishning alohida neyron imzosi: MTL va MFC bo‘ylab MS hujayralarining ikki turi&lt;/h4&gt;\n&lt;p&gt;Faraz qilinganidek (3f-rasm), patternni yakunlashni aks ettiruvchi va patternni ajratishni aks ettiruvchi turli xil MS hujayralari mavjudmi? Ushbu savolga javob berish uchun biz alohida MS hujayralarining turli xil haqiqiy holatga ega, ammo bir xil xulq-atvor tanloviga ega bo‘lgan (TP va FP) yoki bir xil haqiqiy holatga ega, ammo turli xil tanlovga ega bo‘lgan (TN va FP) urinishlarni farqlash qobiliyatini sinab ko‘rdik.&lt;/p&gt;\n&lt;p&gt;Ushbu farazni tekshirish uchun biz yuqorida tavsiflangan xuddi shu o‘zaro tekshirish (cross-validation) tartibidan foydalandik. Har bir test/trening bo‘linishida trening urinishlari ikki maqsadda ishlatildi: TPni FPdan yoki TNni FPdan farqlash uchun yagona hujayrali dekoderni o‘rgatish va xuddi shu kontrast uchun yagona neyron ROC-AUCni hisoblash (Metodlarga qarang). Har bir MS hujayrasi, agar uning TN va FP uchun AUC qiymati TP va FP uchun AUC qiymatidan yuqori bo‘lsa, ‘xotira tanlovi’ (MC) deb, yoki agar uning TP va FP uchun AUC qiymati TN va FP uchun AUC qiymatidan yuqori bo‘lsa, ‘pattern ajratish’ (PS) deb tasniflandi (4a-rasm). Ikkala kontrast uchun dekodlash aniqligi keyinchalik ajratib qo‘yilgan test urinishlari asosida baholandi. Har bir MS hujayrasi uchun ushbu tartib ikkita dekodlash samaradorligi o‘lchovini va uning MC yoki PS hujayrasi sifatida tasniflangan yugurishlar ulushini berdi (4b, S4a-c-rasmlar).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MS hujayralarining aksariyati (72,1%) MC yoki PS turi sifatida tasniflanadi, bu ikki xil funksional neyron populyatsiyasi mavjudligini ko‘rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;MS hujayralarining aksariyati MC yoki PS turi sifatida tasniflandi (to‘rtta miya hududida 72,1%, 4b, S4a-c-rasmlar), bu MS hujayralarining ikki xil turi mavjudligini ko‘rsatadi. Keyin biz qo‘shimcha tahlil o‘tkazdik.&lt;/p&gt;\n&lt;p&gt;Xatolik urinishlarini tahlil qilish. a, Faraz: Pattern ajratishni aks ettiruvchi MS neyronlarining faoliyati, xuddi shu xulq-atvor tanlovi qilinganiga qaramay, haqiqiy eski (TP) va noto‘g‘ri eski (FP) stimullarni farqlay oladi, shu bilan birga ular haqiqiy yangi (TN) va FP urinishlarini farqlay olmaydi, chunki ular bir xil haqiqiy holatga ega (ko‘k rang). Aksincha, tanlov haqida signal beruvchi neyronlar turli qarorlarga ega stimullarni (TN va FP) farqlaydi, lekin bir xil qarorlarni keltirib chiqaradigan, ammo turli haqiqiy holatga ega bo‘lgan stimullarni (TP va FP, pushti rang) farqlamaydi. b, HPCdagi MS hujayralarining aksariyati (68,3%) izchil ravishda ‘xotira tanlovi’ yoki ‘pattern ajratish’ turi sifatida aniqlanadi, bu MS hujayralarining ikki turi mavjudligini ko‘rsatadi. Berilgan MS hujayrasi yugurishlar davomida bir yoki boshqa tur sifatida tasniflanish ehtimoli ko‘rsatilgan. Qizil chiziq hujayrani bir yoki boshqa kichik turga tasniflash uchun mezonni (75%) ko‘rsatadi. (c-e) MS hujayralari TN va FP yoki TP va FP urinishlarini farqlaydi, lekin ikkalasini ham emas. c, TN va FP (turli tanlov, bir xil haqiqiy holat) va TP va FP (bir xil tanlov, turli haqiqiy holat) urinishlarining o‘zaro tekshirilgan yagona hujayrali dekodlashining sochilish diagrammasi. Har bir nuqta — bu hujayra. To‘qroq rang har bir dekodlash kontrasti uchun o‘rtacha ± standart og‘ish (s.d.) hisoblanadi. d, c bilan bir xil, lekin o‘rtacha ± s.d. sifatida chizilgan. TP va TN dekodlash tasodifiy darajadan yuqori, chunki hujayralar to‘g‘ri yangi va eski urinishlarni farqlash uchun oldindan tanlangan (ya'ni MS hujayralari). PS hujayralari TP va FPni tasodifiy darajadan yuqori dekodlashga imkon berdi (p=0,001, stimulning haqiqiy holati), TN va FP dekodlash esa sezilarli darajada tasodifiy darajadan past edi (p=0,001). MC hujayralari TN va FPni tasodifiy darajadan yuqori dekodlashga imkon berdi (p=0,001, xulq-atvor tanlovi), TP va FP dekodlash esa sezilarli darajada tasodifiy darajadan past edi (p=0,001). e, Miya hududlari bo‘ylab MS hujayralarining PS va MC kichik turlarining ulushi. Proportsiyalarda sezilarli farq aniqlanmadi. (f-i), PS yoki MC kichik turi sifatida tasniflangan MS hujayralari namunalari. HPC (f) va preSMA (g)dagi ‘pattern ajratish’ (PS) hujayralari namunalari. HPC (h) va preSMA (i)dagi ‘xotira tanlovi’ (MC) hujayralari namunalari. Shuni ta'kidlash kerakki, PS hujayralari yangi stimullarni afzal ko‘rganda (to‘q ko‘k rang), ular yangi bo‘lgan, ammo noto‘g‘ri ‘eski’ deb tan olingan xatolik urinishlariga ham javob beradi (FP, bej rang). Aksincha, MC hujayralari bir xil xulq-atvor tanloviga ega urinishlarga javob beradi: qizil rangdagi ‘eski’ to‘g‘ri va bej rangdagi ‘eski’ noto‘g‘ri urinishlar (kamida 75% yugurishlarda tasniflangan barcha MS hujayralari uchun, 4f-i-rasmlarda misollar keltirilgan).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ROC-AUC — klassifikatsiya sifatini o‘lchash metrika: 0,5 qiymati tasodifiy taxminni, 1,0 esa mukammal ajratishni anglatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Faqat PS sifatida tasniflangan hujayralar ajratib qo‘yilgan test urinishlarida TP va FPni sezilarli darajada dekodlashga imkon berdi (4c, d-rasm, ko‘k rang, x o‘qi; rasmda HPC ko‘rsatilgan: 0,62±0,08 (o‘rtacha±s.d), p=0,001; boshqa miya hududlari uchun S4d-i-rasmga qarang). PS hujayralari uchun tanlovni dekodlash aniqligi tasodifiy darajadan sezilarli darajada past edi (4c, d-rasm, ko‘k rang, y o‘qi; 0,45±0,08, p=0,001). Bu tasodifiy darajadan past samaradorlik ushbu hujayralar guruhining faoliyati pattern ajratishni aks ettiradi degan talqinni yanada qo‘llab-quvvatlaydi, chunki bu PS hujayralari FP urinishlarini sub'ektning tanloviga ko‘ra emas, balki ularning haqiqiy holatiga ko‘ra izchil kodlashini anglatadi, bu esa tanlovni dekodlash paytida yorliqlarning tizimli ravishda almashinishiga olib keladi. Ushbu natija shuni ko‘rsatadiki, MS hujayralarining ushbu turi bemorlar xato qilgan taqdirda ham xotira aniqligini saqlaydi, ya'ni ularning javobi neyronal pattern ajratishni aks ettiradi.&lt;/p&gt;\n&lt;p&gt;Aksincha, MC hujayralari xulq-atvor tanlovini tasodifiy darajadan yuqori dekodlashga imkon berdi (4c, d-rasm, TN va FP: 0,61±0,07, p=0,001), TP va FP dekodlash esa sezilarli darajada tasodifiy darajadan past edi (4d-rasm, 0,47±0,05, p=0,001). Biz barcha boshqa qayd etish joylarida ham xuddi shunday naqshni kuzatdik: faqat PS hujayralari FP xatolaridan xotira haqiqiy holatini sezilarli darajada dekodlashga imkon berdi, faqat MC hujayralari esa bemor tanlovini sezilarli darajada dekodlashga imkon berdi (S4d-i-rasm). Miya hududlari bo‘ylab PS/MC turi sifatida tasniflangan MS hujayralari ulushida sezilarli farq yo‘q edi (4e-rasm).&lt;/p&gt;\n&lt;h4 id=\"xotiraning-haqiqiy-holati-va-xulq-atvor-tanlovining-populyatsiya-darajasidagi-korinishlari\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#xotiraning-haqiqiy-holati-va-xulq-atvor-tanlovining-populyatsiya-darajasidagi-korinishlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xotiraning haqiqiy holati va xulq-atvor tanlovining populyatsiya darajasidagi ko'rinishlari&lt;/span&gt;&lt;/a&gt;Xotiraning haqiqiy holati va xulq-atvor tanlovining populyatsiya darajasidagi ko'rinishlari&lt;/h4&gt;\n&lt;p&gt;Yuqoridagi tahlil bitta neyron darajasida naqshlarni ajratish (pattern separation) belgilarini aniqlaydi. Naqshlarni ajratish uzoq vaqtdan beri taxmin qilinganidek, uning kelib chiqish markazi bo'lgan gipokampda (HPC) ayniqsa yaqqol namoyon bo'ladimi6,7 yoki u boshqa miya hududlarida ham xuddi shunchalik kuchli darajada mavjudmi39? Yagona neyron tahlili bu savolga javob bera olmadi, chunki naqshlarni ajratish tekshirilgan barcha miya sohalarida kuzatildi. Biz buni xotira va tanlov signallarining yuqori darajada korrelyatsiyalashgani bilan izohladik, ular faqat xato sinovlarida farqlanadi. Shuning uchun keyinchalik biz demiksirlangan asosiy komponentlar tahlili yordamida ikkala signalni statistik jihatdan ajratish usulidan foydalandik (dPCA; Metodlarga qarang)40. Biz xotiraning haqiqiy holati va xulq-atvor tanlovi signallari tufayli yuzaga keladigan neyron dispersiyasini alohida qamrab oluvchi populyatsiya darajasidagi kodlash o'lchamlarini aniqladik (5a-e va 5f-j-rasmlarda HPC va preSMA misollari ko'rsatilgan). Ushbu ikki kodlash o'lchami va ularning o'zaro ta'siri populyatsiya faolligidagi sezilarli miqdordagi dispersiyani tushuntiradi (mos ravishda HPC da 19%, 19% va 18%, 5b-rasm; preSMA da 10%, 13%, 12%, 5g-rasm; AMY da 18%, 19%, 20%, ko'rsatilmagan; ACC da 18%, 20%, 20%, ko'rsatilmagan).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;dPCA yordamida o'tkazilgan populyatsiya tahlili shuni ko'rsatdiki, xotiraning haqiqiy holati faqat gipokampda (HPC) alohida sinovlar darajasida ishonchli tarzda dekodlanadi (o'rtacha aniqlik 0.67, p=0.003), presumotor sohada (preSMA) esa faqat xulq-atvor tanlovi dekodlanadi (0.83, p=1.7x10-8).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Nafis dPCA yordamida aniqlangan o'lchamlar bitta sinovga oid xotira va tanlov ma'lumotlarini quyi oqimdagi o'qish populyatsiyasiga ishonchli tarzda yetkaza oladimi? Ushbu savolni sinab ko'rish uchun biz keyinchalik stimulyatsiya paydo bo'lganidan keyin 200 ms o'tgach boshlanadigan yagona 1.5 s uzunlikdagi vaqt oynasida o'rtacha hisoblangan dPCA o'qlariga proyeksiyalangan javoblarning bitta sinovli dekodlashini amalga oshirdik. Statistik ahamlilikni baholash uchun biz har bir folddagi har bir turdagi (ham «yangi», ham «eski» stimullar uchun to'g'ri va xato sinovlar) bitta qoldirilgan sinovda yagona sinovli dekodlashdan foydalandik (Metodlarga qarang). Faqatgina HPC da dekodlash aniqligi xotiraning haqiqiy holati va tanlov uchun kutilgan tasodifiy qiymatdan sezilarli darajada katta bo'ldi (5k-rasm, chap va o'ng; o'rtacha aniqlik mos ravishda 0.67, p=0.003 va 0.65, p=0.009; tasodifiy daraja 0.5). Biz faqatgina qoldirilgan soxta musbat (FP) sinovlar uchun dekodlash aniqligini tahlil qilganimizda (yuqorida keltirilgan aniqlik barcha sinov turlari bo'yicha o'rtacha aniqlikdir: TP, TN, FP, FN), ularni HPC da yuqori aniqlik bilan tasniflash mumkinligini aniqladik, ammo faqat haqiqiy holat dPCA o'qi bo'ylab (5k-rasm, chap, bej rangli nuqtalar, aniqlik=0.72 ga nisbatan 5k-rasm, o'ng, bej rangli nuqtalar, aniqlik=0.45). Aksincha, preSMA da faqat xulq-atvor tanlovi dekodlanadigan bo'ldi (5l-rasm, o'ng, 0.83, p=1.7x10-8, haqiqiy holat 0.56, p=0.17). Ikki miya sohasi o'rtasidagi dekodlash aniqligini to'g'ridan-to'g'ri taqqoslash (Metodlarga qarang) shuni ko'rsatadiki, HPC da xotiraning haqiqiy holati preSMA ga qaraganda sezilarli darajada yaxshiroq dekodlanishi mumkin (Δ(HPC, preSMA)=0.1, p=0.004, S6d-rasm). Biz amigdala (AMY; S6a-rasm, 0.49, p=0.4 va 0.59, p=0.08) va oldingi belbog'li qobiqda (ACC; S6b-rasm, 0.4, p=0.06 va 0.57, p=0.13) hech qaysi o'lcham bo'yicha tasodifiy kutilgandan yaxshiroq dekodlay olmadik. Umuman olganda, ushbu tahlil shuni ko'rsatadiki, yagona sinov darajasidagi xotiraning haqiqiy holati haqidagi ma'lumotlar faqat HPC da populyatsiya darajasida ishonchli tarzda dekodlangan. Aksincha, preSMA da populyatsiya darajasida faqat subyektning xulq-atvor tanlovi ishonchli tarzda dekodlangan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;dPCA (demiksirlangan asosiy komponentlar tahlili) — bu neyron faolligini vazifaning turli o'zgaruvchilari (masalan, sezgi stimuli yoki tanlov) bo'yicha mustaqil qismlarga ajratish uchun ishlatiladigan usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Nihoyat, biz oldindan aniqlangan naqshlarni ajratuvchi hujayralar (PS hujayralari) populyatsiya darajasidagi dekodlashga o'z hissasini qo'shishini tekshirdik. Buning uchun biz PS, yoki no-MS hujayralar sifatida tasniflangan hujayralar uchun dPCA tomonidan har bir kodlash o'lchami uchun belgilangan vaznlarni taqqosladik. Birinchidan, MC va PS hujayralari ham haqiqiy holat (5m,o-rasm; MS p=5.9x10-9, PS p=1.6x10-36, ikki tanlanmali t-test), ham qaror qabul qilish (5n,o-rasm; MC p=2.2x10-20, PS p=9.2x10-21, ikki tanlanmali t-test) o'qlari uchun no-MS hujayralarga qaraganda yuqori dPCA vaznlariga ega edi. Ikkinchidan, PS hujayralariga haqiqiy holat o'qi bo'ylab MC hujayralarga qaraganda sezilarli darajada yuqori vaznlar berildi (5m-rasm, p=0.005; qaror o'qi: 5n-rasm, MC va PS p=0.2). Ushbu topilmalar birgalikda gipokampdagi PS hujayralari asosan...&lt;/p&gt;\n&lt;h4 id=\"naqshlarni-ajratuvchi-hujayralar-xotiraning-uzluksiz-kuchi-signalini-boshqaradi\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#naqshlarni-ajratuvchi-hujayralar-xotiraning-uzluksiz-kuchi-signalini-boshqaradi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Naqshlarni ajratuvchi hujayralar xotiraning uzluksiz kuchi signalini boshqaradi&lt;/span&gt;&lt;/a&gt;Naqshlarni ajratuvchi hujayralar xotiraning uzluksiz kuchi signalini boshqaradi&lt;/h4&gt;\n&lt;p&gt;Naqshlarni ajratish va xotira kuchi bir-biri bilan qanday bog'langan? Biz ushbu savolga javob berish uchun PS hujayralari faolligi xotira kuchi bilan qanday bog'liqligini o'rgandik. Biz birinchi navbatda PS hujayralarini chiqarib tashlagandan so'ng dPCA ga asoslangan populyatsiya tahlilini takrorladik. Bu tanlovni dekodlashga ta'sir qilmasdan, HPC dan haqiqiy holatni dekodlash qobiliyatini yo'q qildi (6a-rasm, haqiqiy holat uchun o'rtacha dekodlash aniqligi 0.5, p=0.5 edi; tanlovni dekodlash aniqligi mos ravishda 0.61, p=0.03 edi). Bu dPCA barcha qayd etilgan hujayralarga (hozirgi kungacha tahlil) yoki faqat MS hujayralariga (haqiqiy holat va tanlovni o'rtacha dekodlash aniqligi mos ravishda 0.56, p=0.17 va 0.63, p=0.01) kirish imkoniyatiga ega bo'lishidan qat'i nazar sodir bo'ldi. Shu sababli, keyinchalik biz ularning xususiyatlarini yanada o'rganish uchun guruh sifatida faqat MS hujayralaridan foydalandik. dPCA tomonidan qamrab olingan dispersiya HPC va preSMA dagi MS hujayralari orasida sezilarli darajada farq qildi. HPC da MS hujayralari impulsatsiya chastotasining tushuntirilgan dispersiyasining asosiy qismi stimulning haqiqiy holatiga tegishli edi (53%, 6b-rasm, yuqori). Aksincha, preSMA da haqiqiy holat dispersiyaning faqat 21% ni tashkil etdi. Buning o'rniga, tanlov komponenti MS hujayralari neyron dispersiyasining eng katta qismini tashkil etdi (58%, 6b-rasm, pastki). Bu shuni ko'rsatadiki, HPC tashqarisidagi alohida neyronlar hali ham haqiqiy holat haqidagi ma'lumotlarni o'z ichida saqlasa-da, HPC dan tashqaridagi hududlarda (bu yerda preSMA) sinovdan sinovga o'zgaruvchanlikning eng katta manbai xulq-atvor tanlovi bo'lib, HPC da эса bu haqiqiy holatdir. Ushbu natijalar sohaga xos farqlarni ta'kidlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PS hujayralarining chiqarib tashlanishi gipokampusning xotiraning haqiqiy holatini dekodlash qobiliyatini butunlay yo'q qiladi, bu ularning ushbu jarayondagi hal qiluvchi sababiy rolini isbotlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Nima uchun patsiyentlar HPC'dagi neyronlar javobi FP (soxta ijobiy) va TP (haqiqiy ijobiy) sinovlari orasida farq qilishiga qaramay, hali ham xatoga yo'l qo'yishadi? Ushbu savolga javob berish uchun biz alohida sinovlar uchun haqiqiy dPCA o'qidagi proyeksiyalar qiymatlarining taqsimotini o'rganib chiqdik. Biz shunday gipotezani ilgari surdikki, «yangi» deb belgilanganiga qaramay, FP sinovlari to'g'ri yangi (TN) sinovlar bilan bir xil emas, balki TP sinovlariga ko'proq siljigan bo'lib, bu quyi zanjirlar o'qib chiqishi uchun zaifroq signallarga olib kelishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Soxta ijobiy xatolar (FP) paytidagi neyron javoblar dPCA o'qi bo'ylab haqiqiy ijobiy javoblarga (TP) nisbatan haqiqiy salbiy javobarga (TN) qaraganda yaqinroq siljigan bo'lib, o'rtacha ajralish indeksi d'₁ = 0.76 (p = 0.001) tashkil etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu gipotezani sinab ko'rish uchun biz har bir turdagi bitta sinovni tasodifan chiqarib tashlab, uni qolgan sinovlardan baholangan haqiqiy dPCA o'qiga proyeksiyalash orqali alohida sinov proyeksiyalari taqsimotini tuzdik (1000 iteratsiya). Biz avval FP va TN proyeksiya qiymatlari orasidagi d' ni hisobladik (6c-rasm, d'₁) va bu taqsimotlar ajralib turishini tasdiqladik (6d-rasm, d'₁ = 0.76, p = 0.001 aralash yorliqli nol taqsimotiga nisbatan). Bu natija FP sinovlari davomidagi neyron javobi TN sinovlari davomidagiga o'xshash bo'lmaganini ko'rsatadi. Keyin biz FP–TN va TP–FP proyeksiya qiymatlarining ajralishini solishtirdik (6c-rasm, d'₂) va TP–FP ajralishi FP–TN ajralishidan kattaroq ekanligini aniqladik (6d-rasm, d'₂ = 1.68, Δ(d'₂, d'₁) = 0.92, p = 0.001 farqlarning nol taqsimotiga nisbatan). Ushbu javob naqshlari FP sinovlari TP sinovlariga nisbatan TN sinovlariga yaqinroq qolishini, lekin shunga qaramay dPCA haqiqiy o'qi bo'ylab TP tomon siljiganini ko'rsatadi. Ushbu natija bizning gipotezamizni qo'llab-quvvatlaydi, unga ko'ra FP sinovlari «yangi» deb dekodlanishiga qaramay, TN sinovlariga nisbatan xotiraning haqiqiy o'qi bo'ylab TP sinovlaridan kamroq ajralib turadi.&lt;/p&gt;\n&lt;p&gt;FP sinovlarining TP va TN sinovlari orasida xotira kuchi o'qida joylashishi HPC'dagi haqiqiy signal signalni aniqlash nazariyasi bashorat qilgan xotira kuchi signaliga mos kelishini ko'rsatadi. Ushbu yondashuv doirasida yuqori ishonch bilan qilingan to'g'ri tan olish qarorlari xotira kuchi o'qi bo'ylab past ishonchdagi qarorlarga qaraganda jalb qiluvchilardan (lures) uzoqroqda yotadi deb hisoblanadi [41, 42]. Naqshni ajratish hujayralari (PS) xotiraning haqiqiy holatini dekodlash imkonini berganligi sababli, biz PS hujayralari faolligi HPC'da uzluksiz xotira kuchi signalini o'rnatishga hissa qo'shadi deb taxmin qildik (6e-rasm, yuqorida). Agar bu to'g'ri bo'lsa, PS hujayralari populyatsiyadan olib tashlanganda, turli xil xotira kuchiga ega bo'lgan turli xil «eski» sinov turlari (FP, yuqori va past ishonchli TP) bir-biridan farqlanmaydigan bo'lib qolishi, lekin baribir «yangi» sinovlardan farq qilishi kerak (6e-rasm, pastda).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;dPCA (taqsimlangan asosiy komponentlar tahlili) — bu vazifa parametrlariga bog'liq neyron naqshlarini umumiy shovqindan ajratib ko'rsatadigan ma'lumotlar o'lchamini kamaytirish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu gipotezani sinab ko'rish uchun biz yuqorida tavsiflangan bir xil yagona sinov proyeksiyasi tahlilidan foydalandik, lekin endi yuqori va past ishonchli TP sinovlari uchun alohida taqsimotlar tuzdik. Barcha MS hujayralari kiritilganda, yuqori ishonchli TP taqsimoti TN sinovlaridan eng ko'p ajratilgan bo'lib, past ishonchli TP uchun kamroq va FP sinovlari uchun undan ham kamroq ajralish kuzatildi (6f-rasm). Aksincha, preSMA'da haqiqiy o'q ustidagi barcha sinov proyeksiyalari bir-birining ustiga chiqdi (S7a-rasm), bu HPC xususiyatini ta'kidlaydi. HPC'da PS hujayralari olib tashlangandan so'ng, «yangi» va «eski» qaror sinovlarini hali ham farqlash mumkin edi, ammo yuqori va past ishonchli TP hamda FP sinovlari bir-biridan farqlanmaydigan bo'lib qoldi (6g-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Olingan natijalar hayvonlar modellariga asoslangan bo'lib, xotira kuchi bo'yicha xulosalarni inson miyasiga tatbiq etishda prefrontal po'stloq tarmoqlari arxitekturasidagi farqlarni hisobga olish kerak.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Qo'shimcha nazorat sifatida biz xuddi shunday tahlilni takrorladik, lekin tanlovni bildiruvchi MS hujayralari turi bo'lgan MC hujayralarini istisno qildik. MC hujayralarisiz proyeksiyaning joylashuvi barcha MS hujayralari birgalikdagi holatiga o'xshash edi (S7b-rasm), bu PS hujayralari ayniqsa uzluksiz xotira kuchi signalini o'rnatishda muhim rol o'ynashini ko'rsatadi. Ushbu tushunchaga faqat MS hujayralarini naqshni ajratishni (PS) va tanlovni (MC) aks ettiruvchi turlarga ajratganimiz tufayli erishish mumkin edi. Ushbu natija PS hujayralari gippokampdagi bosqichma-bosqich xotira kuchi signaliga hissa qo'shishini ko'rsatadi.&lt;/p&gt;\n&lt;h4 id=\"tutqanoq-boshlanish-zonasida-va-chap-gipokampda-xotiraning-asosiy-signalining-susayishi\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#tutqanoq-boshlanish-zonasida-va-chap-gipokampda-xotiraning-asosiy-signalining-susayishi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tutqanoq boshlanish zonasida va chap gipokampda xotiraning asosiy signalining susayishi&lt;/span&gt;&lt;/a&gt;Tutqanoq boshlanish zonasida va chap gipokampda xotiraning asosiy signalining susayishi&lt;/h4&gt;\n&lt;p&gt;Tutqanoq boshlanish zonasi (SOZ) ichida joylashgan neyronlar SOZ tashqarisidagilarga qaraganda xotira bilan bog'liq zaifroq signallarni tashi-lishi ma'lum. Shuning uchun biz keyinchalik xotira etalonini dekodlash qobiliyati SOZ ichida yoki tashqarisida qayd etilgan gipokampal neyronlar orasida farq qilishini o'rganib chiqdik. Barcha miya sohalarida qayd etilgan 3506 ta hujayradan 27% i SOZ ga lokalizatsiya qilingan elektrodlardan qayd etilgan (n=1016; HPC va AMY uchun chakka bo'lagi, ACC va preSMA uchun peshona bo'lagi; Rasm S8a). SOZ ichida joylashgan hujayralar ulushi MFC ga nisbatan MTL da yuqori bo'lgan (HPC va AMY da 43% va 40% ga qarab ACC va preSMA da 3% va 8%, Rasm S8b), bu bemorlarimizda medial chakka bo'lagi semiologiyasining ustunligini hisobga olgan holda kutilgan edi. Bu barcha hujayralar uchun ham (Rasm S8b), tahlil faqat MS hujayralari bilan cheklanganda ham (Rasm S8c) o'rinli edi. Biz qo'shimcha ravishda chakka epilepsiyasi SOZ larini gipokampal elektrodlarni o'z ichiga olgan yoki olmaydigan SOZ larga tasnifladik va barcha gipokampal hujayralarni shunga mos ravishda lokalizatsiya qildik (barcha hujayralar uchun Rasm S8d va MS hujayralari uchun Rasm S8e, MS hujayralarining PS-turi quyuqroq tuslarda ko'rsatilgan).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Xotira etalonini dekodlash faqat tutqanoq boshlanish zonasidan tashqaridagi hujayralar (aniqlik 0.64, p=0.019) va o'ng gipokamp uchun (aniqlik 0.66, p=0.01) muvaffaqiyatli bo'ldi, bu epileptogen o'choqda ushbu signallarning buzilishini ko'rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bitta sinovli dekodlash tahlili shuni ko'rsatdiki, faqat SOZ tashqarisida qayd etilgan hujayralar xotira etalonini sezilarli darajada dekodlash imkonini beradi (Rasm S8f, dekodlash aniqligi = 0.64, p=0.019), SOZ ichidagi dekodlash esa tasodifiy taxmindan yaxshiroq emas (Rasm S8f, dekodlash aniqligi = 0.52, p=0.39). Hujayralar soni moslashtirilgan SOZ tashqarisidagi va ichidagi populyatsiyalar o'rtasida dekodlash aniqligini bevosita taqqoslash (Metodlarga qarang) xotira etaloni SOZ ichiga qaraganda SOZ tashqarisida sezilarli darajada yaxshiroq dekodlanishini ko'rsatadi (Δ(outSOZ, inSOZ)=0.12, p=0.004, Rasm S8g). Ushbu natija HPC ning xotira etaloni signallarini boshqarishdagi o'ziga xosligini ta'kidlaydi va topilmalarimizning klinik ahamiyatini yoritadi.&lt;/p&gt;\n&lt;p&gt;Keyinchalik biz lateralizatsiya xotira etalon signaliga hissa qo'shishini ko'rib chiqdik. 950 ta HPC hujayrasidan 413 tasi chap HPC dan va 537 tasi o'ngdan qayd etilgan (Rasm S8h). MS hujayralarining ulushlari chap va o'ng HPC o'rtasida o'xshash edi (mos ravishda 36 va 40 ta MS hujayralari, Rasm S8i). PS hujayralari o'ng HPC da ko'p uchradi (56% (19/34) ga qaraganda 27% (7/26), proporsiyalarning χ² testi p=0.025, Rasm S8i), bu o'ng HPC ning vizual ma'lumotlarni naqshga ajratishga (pattern separation) kattaroq hissa qo'shishini taxmin qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kuzatilgan farqlar farmakorezistent epilepsiya bilan og'rigan bemorlardan olingan bo'lib, bu ma'lumotlarni sog'lom holatga ekstrapolyatsiya qilishda ehtiyotkorlikni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Shunga ko'ra, biz xotira etalonini faqat o'ng HPC dan sezilarli darajada dekodlashimiz mumkin edi (Rasm S8j, dekodlash aniqligi = 0.66, p=0.01; chap aniqlik = 0.52, p=0.43). Hujayralar soni moslashtirilgan o'ng va chap HPC populyatsiyalari o'rtasida dekodlash aniqligini bevosita taqqoslash (Metodlarga qarang) xotira etaloni chapga qaraganda o'ng HPC dan sezilarli darajada yaxshiroq dekodlanishini ko'rsatadi (Δ(right, left)=0.14, p=0.004, Rasm S8k). Ushbu natija vizual stimullar uchun xotira etalonini namoyish etishda o'ng HPC ning afzal qilingan rolini yana bir bor qo'llab-quvvatlaydi.&lt;/p&gt;\n&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;p&gt;Biz yolg'on musbat (FP) va to'g'ri musbat (TP) sinovlari orasidagi neyron javoblarini taqqoslash orqali gippokampda mnemonik naqshni ajratish (pattern separation) imzolarini aniqladik. Bizning asosiy hissםmiz gippokampda FP va TP sinovlari o'rtasida javobi farq qiluvchi PS hujayralarini aniqlashdan iborat. Biz ushbu PS hujayralarining javobi muvaffaqiyatli naqsh ajratilishining aksidir deb taxmin qilamiz. PS hujayralari tashiydigan signalning muhimligini tasdiqlagan holda, PS hujayralarini populyatsiyadan olib tashlash gippokamp hujayralari populyatsiyasi tomonidan tashiydigan xotira kuchi gradientining qulashiga olib keldi. Bizning ma'lumotlarimiz xotira mashinasining asosiy tarkibiy qismi ekanligi uzoq vaqtdan beri taxmin qilingan hisob-kitob bo'lgan naqshni ajratish uchun hujayrali substratni aniqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gippokampda PS hujayralarining aniqlanishi naqshni ajratishning hujayrali substratini ochib beradi: ularni olib tashlash populyatsiya xotirasi gradientini butunlay buzadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;To'g'ri sinovlar nuqtai nazaridan, PS hujayralari ilgari tavsiflangan kanonik MS hujayralariga aynan o'xshash javob beradi. Ammo bemorlar ushbu vazifada bajarishi mumkin bo'lgan ikki turdagi xatolarni o'rganganda, bunday hujayralarning ikki turi mavjudligi aniq bo'ladi: qabul qilingan qarordan qat'i nazar, haqiqiy holatni signal qiluvchi hujayralar va asosiy xotira signalidan qat'i nazar, qabul qilingan qarorni signal qiluvchi hujayralar. Aynan xato sinovlari davomidagi javob bizga bitta neyron, shuningdek populyatsiya darajasida ushbu ikki xil jarayonni farqlash imkonini berdi. Xato sinovlarini o'rganish, shuningdek, miyaning turli qismlarining o'ziga xos hissalarini aniqlashga imkon berdi. MS hujayralari biz o'rgangan miyaning barcha to'rt sohasida tasodifiy kutilganidan yuqori miqdorda mavjud edi. Ammo xato sinovlari nuqtai nazaridan, faqat gippokampdagi MS hujayralari populyatsiyasi haqiqiy holatni ishonchli dekodlash imkonini berdi.&lt;/p&gt;\n&lt;p&gt;Bizning natijalarimiz faqat 97 bemor bo'yicha ushbu vazifa uchun to'plagan juda katta ma'lumotlar to'plami (n = 3506 hujayra) tufayli mumkin bo'ldi. MS hujayralari dastlab nisbatan kam uchraydi, odatda gippokamp hujayralarining ~ 10% qismi mos keladi. Ulardan faqat 60% i PS hujayralari sifatida tavsiflanadi, bu esa umumiy tarqalishning &amp;lt;6% bo'lishiga olib keladi. FP sinovlari o'z navbatida kam uchraydi (ta'rifga ko'ra), ularni o'rganish uchun ko'p sonli bemorlar talab qilinadi. PS hujayralari shu miqyosda ko'rib chiqilganda aniqlanishi mumkin degan topilmimiz muayyan miya sohasi va vazifa uchun ko'p sonli hujayralar mavjud bo'lgandagina tushunarli bo'ladigan neyron jarayonining namunasidir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Naqshni ajratish (pattern separation) — bu miyaning tafsilotlarni chalkashtirib yubormaslik uchun bir-biriga o'xshash xotiralarni bir-biridan farq qiluvchi alohida obrazlarga aylantirish qobiliyatidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Subyektlar buyumni ko'rganini unutganda (yolg'on salbiy natija), gippokampdagi xotira signallari ko'pincha hali ham mavjudligi uzoq vaqtdan beri e'tirof etilgan. Bunday holda xotira signalining mavjudligi, hatto xulq-atvor darajasida subyektlar ushbu ma'lumotlarga kirisha olmagan taqdirda ham, muvaffaqiyatli naqshni yakunlash bilan mos keladi. Aksincha, gippokampning FP larga qo'shgan hissasi haqida kamroq ma'lumot mavjud bo'lib, bizning fikrimizcha, ular naqshni ajratish imzolarini aniqlash uchun kalit hisoblanadi. Bizning vazifamizda FP hukmining ehtimolligi sinov tasvirining ilgari ko'rilgan barcha tasvirlar bilan o'xshashligiga asoslanib yuqori ishonchlilik bilan bashorat qilinishi mumkin. Bu shuni ko'rsatadiki, FP shovqin yoki taxmin qilish tufayli emas, balki mavjud xotira mazmuni bilan bog'liq bo'lib, ularni o'rganishga qulay qiladi. Shunga qaramay, fMRI tadqiqotlari odatda gippokampdagi neyron signallari TP va FP sinovlari o'rtasida farq qilmasligini aniqladi va buning natijasida FP sinovlari hozirgacha naqshni ajratishni o'rganish uchun vosita sifatida ishlatilmagan. Endi biz shuni ko'rsatamizki, gippokampdagi neyronlarning o'ziga xos kichik guruhi FP va TP sinovlariga turlicha javob beradi, bu farq fMRI makroskopik darajasida ko'rinmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Olingan natijalar bemorlarning katta ma'lumotlar bazasiga va korrelatsiyalarga asoslangan bo'lib, fMRI kabi makroskopik usullar FP va TP o'rtasidagi mikrofarqlarni to'g'ridan-to'g'ri ushlay olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Naqshni ajratish signaturasi faqat FPga olib kelgan yangi sinovlar kichik guruhini o'rganishdagina aniq ko'rinishi haqidagi topilmimiz, shuningdek, naqshni ajratish imzolari haqida xabar beruvchi avvalgi ishlar kontekstini ochib beradi. Naqshni ajratish birinchi marta xabar qilingan klassik fMRI paradigmada ishtirokchilar aniq takrorlanishlar, o'xshash, ammo aynan o'xshash bo'lmagan soxta narsalar (lures) va yangi obyektlar ketma-ketligini ko'rishadi. Ushbu tajribada naqshni ajratish o'xshash (soxta) tasvirlarga nisbatan aniq takrorlanishlarga nisbatan differentsial javob sifatida operatsiyalashtirildi, bu javob naqshi CA3/DG da kuzatildi. Biroq, vazifa xotiraga talab qo'ymadi, shuning uchun yangi tasvirlarga nisbatan lure lar paytida FP darajasi yuqoriroq bo'lishi noma'lum qoldi. Bizning ma'lumotlarimiz shuni ko'rsatadiki, ushbu taqqoslash juda muhimdir, chunki u yangilik signallarini (gippokampda mavjudligi yaxshi ma'lum) va naqshni ajratish imzolarini ajratishning yagona mumkin bo'lgan usuli hisoblanadi (Rasm S5a-d). Qolaversa, biz xotira va tanlov signallari aralashib ketganini aniqladik, bu esa ikkala turdagi jarayonlarni bir-biridan ajratish uchun yagona neyron aniqligiga tayanishni zarur qiladi.&lt;/p&gt;\n&lt;p&gt;Oldingi ishlar shuni ko'rsatadiki, chuqur ko'rish tarmoqlaridagi xususiyatlar insonning o'xshashlik haqidagi hukmlarini yaxshi bashorat qiladi va rag'batlantiruvchi aloqadorlikning kuchayishi — rasmlarning perseptual o'xshashligi yoki so'zlarning semantik yaqinligi bo'ladimi — sog'lom subyektlarda soxta tan olishni keltirib chiqaradi. Inson o'xshashligi haqidagi mulohazalarni to'plash (Rasm S2j) va oldindan o'qitilgan DNN lardan foydalanish orqali biz berilgan yangi (lure) sinov tasvirining ilgari ko'rilgan barcha tasvirlar bilan o'xshashligi FP darajasi bilan ijobiy korrelatsiyaga ega ekanligini tasdiqladik (Rasm 2). Stimul to'plamimiz uchun ushbu munosabatni namoyish qilish muhim edi, chunki u bizning paradigmamiz o'xshashlikka asoslangan xotira xatolarini (masalan, naqshni ajratishdagi nosozliklar) ishonchli tarzda keltirib chiqarishini tasdiqladi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h-f2.jpg\" alt=\"2-rasm. Soxta xavf ehtimoli tasvir juftliklari orasidagi perseptual o'xshashlik bilan bashorat qilinadi. a, DNN «CLIP» a\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm. Soxta xavf ehtimoli tasvir juftliklari orasidagi perseptual o'xshashlik bilan bashorat qilinadi. a, DNN «CLIP» asosidagi o'xshashlik (eksperimentning tanib olish qismida taqdim etilgan har bir «yangi» tasvir (1a-rasm) va barcha o'rganish tasvirlari orasidagi maksimal o'xshashlik) va vazifa variantlari bo'yicha ranglar bilan kodlangan barcha bemorlar bo'yicha hisoblangan soxta ijobiy (FP) darajasi o'rtasidagi korrelyatsiya. Barcha 3 vazifa varianti uchun tasvir o'xshashligi FP darajasi bilan sezilarli darajada korrelyatsiya qildi (1, 2 va 3-variantlar uchun mos ravishda r=0.4, p=0.009; r=0.7, p=4.9x10-10; r=0.5, p=0.0006, Spirman korrelyatsiyasi). b, Inson perseptual o'xshashligi (har bir «yangi» tasvir va bir xil semantik kategoriyadagi barcha o'rganish tasvirlari orasidagi maksimal o'xshashlik) va soxta ijobiy daraja o'rtasidagi korrelyatsiya (r=0.3, p=0.02, Spirman korrelyatsiyasi); baholar faqat 3-vazifa varianti uchun yig'ilgan. a va b dagi har bir nuqta «yangi» tasvirdir. c, Turli modellar uchun (a,b) panellarida ko'rsatilgan takroriy tahlilning statistik taqqoslanishi. Turli xususiyatlar (ResNet50, CLIP, DINOv2, inson baholari) yordamida hisoblangan vizual o'xshashlik soxta ijobiy darajalardagi dispersiyaning sezilarli qismini tushuntirdi, tasvirlarning eslab qolinishi (ResMem) esa tushuntirmadi. Chap y o'qi R-kvadratga (kulrang ustunlar) mos keladi, o'ng y o'qi esa regressiya p-qiymatiga mos keladi, alohida qiymatlar grafikda qora nuqtalar sifatida tasvirlangan. Qizil uzuq chiziq statistik ahamiyatni ko'rsatish uchun ishlatiladigan 0.05 alfa darajasini belgilaydi. * p&amp;lt;0.05, ** p&amp;lt;0.01, *** p&amp;lt;0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;PS hujayralarning faolligi gipokampda xotira kuchi uzluksiz gradientini shakllantirishda hal qiluvchi rol o'ynagan [41, 42, 55]. Ushbu gradient bo'ylab xotiraning eng zaif kuchi yangi elementlar bilan, eng kuchlisi esa yuqori ishonch bilan to'g'ri qabul qilingan eski elementlar (TP high) bilan bog'langan edi. Ular orasida ushbu tartibda FP'lar va past ishonch bilan to'g'ri qabul qilingan elementlar (TP low) joylashgan edi. Shu tarzda, xotira kuchi e'lon qilingan ishonchni oldindan bashorat qiladi, bu epizodik xotiraning asosiy jihatidir [23]. Gipokampda atigi ~6% ni tashkil etuvchi PS-hujayralarning olib tashlanishi FP, TP high va TP low sinovlarining qulashiga olib keladi va shu bilan bu muhim farqlarni yo'q qiladi. Boshqa tomondan, tanlovni bashorat qilgan hujayralarning olib tashlanishi gradientni o'zgarmas holda qoldirdi. Ushbu natijaga asoslanib, biz aynan PS-hujayralar va shuning uchun naqshlarni ajratish uzluksiz xotira kuchi gradientini o'rnatishini ta'kidlaymiz. Ushbu talqin, shuningdek, nima uchun yuqori darajada o'xshash sinovlarda gipokampdagi signallar alohida bo'lishiga qaramay, bemorlar FP xatolariga yo'l qo'yganini tushuntiradi: bu topilmaning bir talqini shundan iboratki, elementni 'eski' deb e'lon qilish chegarasi FP sinovlarining o'rtacha faolligidan pastroq edi (6e-Rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gipokamp neyronlarining taxminan 6% ni tashkil etuvchi PS-hujayralarning olib tashlanishi xotira kuchi gradientini to'liq buzadi va ularning naqshlarni ajratishdagi asosiy rolini isbotlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Epilepsiya, ayniqsa SOZ o'ng gipokampda joylashgan bo'lsa, xotiraning buzilishi haqidagi oldingi xabarlarga mos ravishda [43, 56], naqshlarni ajratish signali SOZ gipokampni qamrab olgan bemorlardan yozib olingan hujayralarda buzilgan edi (S8f, g-Rasm). Kasallik bilan bog'liq bo'lgan bunday buzilish ushbu hisob-kitob yuqori sohalardan meros bo'lib qolishidan ko'ra, gipokamp neyronlari tomonidan amalga oshirilishi g'oyasini qo'llab-quvvatlaydi. Qolaversa, ushbu topilmalar mnezik naqshlarni ajratishni gipokampni qamrab olgan epilepsiya tufayli buzilishga ayniqsa sezgir bo'lishi mumkin bo'lgan kognitiv funksiya sifatida ta'kidlaydi va ushbu buzilishning potentsial neyron korrelyatini o'rnatadi. Ushbu kоpilsa kengroq klinik ahamiyatga ega bo'lishi mumkin, chunki naqshlarni ajratish signallari potentsial ravishda epilepsiyada, shu jumladan o'ng gipokampning o'ziga xos hissasi bilan gipokampning ishtirok etishining biomarkeri bo'lib xizmat qilishi mumkin. Nihoyat, naqshlarni ajratish o'ng gipokampda eng kuchli ekanligi haqidagi topilmamiz bizning vazifamiz vizual ogohlantirishlarni o'z ichiga olganligiga mos keladi, bu naqshlarni ajratish kuchini o'lchash yarimsharga xos jarayonlarni aniqlash uchun yetarlicha sezgir metrika ekanligini ko'rsatadi [57–62]. Bizning tajribamizni og'zaki ogohlantirishlar bilan takrorlash chap gipokampning afzal ko'rilgan ishtirokini ochib berish-ochmasligi kelajakdagi muhim savol bo'lib qolmoqda [63].&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;O'ng gipokamp ishtirokidagi epilepsiya bilan og'rigan bemorlarda naqshlarni ajratish signallarining kuzatilgan buzilishlari korrelyatsion xarakterga ega va qo'shimcha sabab-oqibat tadqiqotlarini talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kelajakdagi ishlar uchun muhim ochiq savol - bu qaysi hisoblash jarayoni PS-hujayralarning javobini keltirib chiqarishi. Bu yerda biz PS-hujayralar faolligi joriy sensorli kirish va xotirada saqlanadigan ilgari ko'rilgan tasvirlar o'rtasidagi naqshni ajratishning aksidir deb ta'kidlaymiz. Ammo PS-hujayralar faolligi jarayonning o'zi emas, balki faqatgina ushbu jarayonning natijasidir, chunki ular xotira yoki sensorli kirish mazmunini o'zicha bildirmaydi. Bitta nomzod hisoblash mexanizmi HebbFF modeli tomonidan taklif etiladi [64], bunda stimulus reprezentatsiyalari o'zgarmas bo'lib qoladi, xotira esa yangi stimuluslarga duch kelganda plastisizmi qo'zg'atiladigan sinapslarda saqlanadi va tanishish signallarini yaratish uchun biologik jihatdan asosli mexanizmni ta'minlaydi. Bu tanib olish xotirasi va naqshlarni ajratishning klassik qarashlari bilan zid keladi, shu jumladan Marurning xotirani hisoblash nazariyasi va gipokampdagi konyuktiv kodlashning keyingi modellari [5–7, 65]. Ushbu nazariyalar xotiralarni saqlash va olishni osonlashtirish uchun sensorli reprezentatsiyalarning o'zlari qanday o'zgartirilishi (masalan, dekorellatsiya qilinishi) bilan shug'ullanadi, lekin joriy reprezentatsiya va ilgari saqlangan reprezentatsiyalar o'rtasidagi taqqoslash qanday hisoblanishi bilan emas. Shuning uchun bizning topilmalarimiz xotirani ikkita alohida reprezentatsiya: stimulus mazmuni uchun biri va tanishish uchun biri orqali amalga oshiradigan hisoblash modellarini rag'batlantiradi [64]. Bunday doirada PS-hujayralar oxirgisi uchun neyron substratni tashkil qilishi mumkin va sensorli reprezentatsiyalarning o'zidan ajratib olinadigan haqiqiy xotira signali uchun eksperimental dalillarni taqdim etadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HebbFF modeli yangilikka duch kelganda sinaptik plastisizlik orqali tanishish signallarining shakllanishini tushuntiradi, bu konyuktiv kodlashning klassik nazariyalaridan farq qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kelajakdagi ishlar uchun qolgan yana bir savol - boshqalar taklif qilganidek [66, 67], mnezik naqshlarni ajratish xususiyatlari gipokampning uzun o'qi bo'ylab farq qilishini o'rganishdir. Bizning yozuvlarimiz asosan oldingi gipokampdan olingan bo'lib, bu savolni ochiq qoldiradi.&lt;/p&gt;\n&lt;p&gt;Nihoyat, bizning tahlillarimiz medial vaqtki po'stloqda stimulus mazmuniga tanlab olingan reprezentatsiyalarda naqshlarni ajratish, shu jumladan qayta xaritalash mavjudligini o'rganmadi [20, 68–72]. Mavjud adabiyotlar tushuncha hujayralari reprezentatsiyalari yuqori darajada o'zgarmasligini, ya'ni ular hujayraning afzal ko'rilgan tushunchasining o'xshash stimuluslariga javoban o'z faolligini o'zgartirmasligini ko'rsatadi [24]. Bizning tajribamiz ushbu savolga javob bermaydi, chunki u tushuncha hujayralarini aniqlash uchun mo'ljallanmagan edi. Keyingi tadqiqotlar tushuncha va PS-hujayralarni bir vaqtning o'zida yozib olish bilan xotira vazifalari davomida tanishish signallari o'zgarmas stimulus reprezentatsiyalari bilan qanday o'zaro ta'sir qilishini o'rganishi kerak.&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"ishtirokchilar-bemorlar\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#ishtirokchilar-bemorlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ishtirokchilar: bemorlar&lt;/span&gt;&lt;/a&gt;Ishtirokchilar: bemorlar&lt;/h4&gt;\n&lt;p&gt;Ushbu tadqiqotda davolash qiyin bo'lgan tutqanoq (epilepsiya) bilan og'rigan jami 97 nafar bemor (133 ta seans) ishtirok etdi; ulardan 87 tasi avval nashr etilgan ma'lumotlarning takroriy tahlili bo'lib, 38 tasi esa yangi yozib olingan ma'lumotlardir. MFCdagi barcha bemorlarning yozuvlari ilgari nashr etilmagan. Biz faqat bemorlar vazifani yetarli darajada yaxshi bajargan hamda yangi va eski javoblar uchun ham yuqori, ham past darajadagi ishonch reytinglaridan foydalangan seanslarni kiritdik (xulq-atvor AUC ≥ 0.6). Ushbu xulq-atvor mezonlariga asoslanib, biz 13 bemorni (21 seans) chiqarib tashladik va tahlil uchun 84 bemorni (112 seans) qoldirdik (S1-jadval).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AUC (ROC-egri chizig'i ostidagi maydon) bemorning yangi va eski tasvirlarni qanchalik yaxshi ajratganini ko'rsatadi, bunda 0.5 qiymati tasodifiy taxmin qilishga, 1.0 esa mukammal tanib olishga to'g'ri keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tanlama hajmi statistik usullar yordamida oldindan belgilanmagan, ammo kiritilgan bemorlar soni shunga o'xshash tadqiqotlar bilan solishtirganda katta. Barcha ishtirokchilar xabardor qilingan rozilik berishdi va tadqiqotda ixtiyoriy ravishda qatnashishdi. Tadqiqot protokollari Sedars-Sinay tibbiyot markazi, Toronto g'arbiy gospitali va Jons Xopkins kasalxonasining institutsional tekshiruv qo'mitalari tomonidan ma'qullandi.&lt;/p&gt;\n&lt;h4 id=\"onlayn-ishtirokchilar\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#onlayn-ishtirokchilar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Onlayn ishtirokchilar&lt;/span&gt;&lt;/a&gt;Onlayn ishtirokchilar&lt;/h4&gt;\n&lt;p&gt;Bir nechta mustaqil ishtirokchilar guruhlari ko'p joylashtirish vazifasini bajarishdi. Birinchidan, inson idroki o'xshashligini tushuntirishda model samaradorligini baholash uchun keyinchalik foydalaniladigan tasodifiy tanlangan 25 ta tasvir o'rtasidagi o'xshashlikni baholash uchun Prolific (www.prolific.com) orqali shaxslar yollandi. Ishtirokchilarning boshqa guruhi bir xil semantik kategoriyadan olingan tasvirlar uchun o'xshashlikni baholadi. Ushbu versiyada har bir kategoriya kichik to'plami kategoriya ichidagi 30 ta tasvirni va boshqa kategoriyalardan 4 ta tayanch (scaffold) tasvirlarini o'z ichiga oldi, ular keyinchalik butun ma'lumotlar to'plami bo'ylab masofalarni moslashtirish uchun ishlatildi. Buning uchun vazifalar variantidan (quyida vazifa tavsifiga qarang) har bir kategoriya uchun 16-20 nafar ishtirokchi yollandi: hayvonlar uchun n = 20, ovqat uchun n = 20, mashinalar uchun n = 20, odamlar uchun n = 20, landshaftlar uchun n = 16.&lt;/p&gt;\n&lt;h4 id=\"psixofizika\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#psixofizika\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Psixofizika&lt;/span&gt;&lt;/a&gt;Psixofizika&lt;/h4&gt;\n&lt;p&gt;Xotirani tanib olish vazifasi (epilepsiyali bemorlar). Vazifa avval nashr etilgan ishlar bilan bir xil edi. U 10-30 daqiqalik tanaffus bilan ajratilgan ikkita blokdan — o'rganish va esga tushirishdan iborat. O'rganish davomida bemorlar 100 ta noyob yangi tasvirni ko'rishdi. Esga tushirish davomida ushbu tasvirlardan 50 tasi (eski/tanish) 50 ta yangi tasvir (yangilik) bilan aralashtirib yuborildi. Bemorlar 1 dan 6 gacha bo'lgan ishonch shkalasidan foydalangan holda har bir tasvirni yangi yoki tanish deb baholadilar (1a-rasm). Bu yerda faqat esga tushirish bloki ma'lumotlari keltirilgan. Asosiy tajribadan oldin ishtirokchilar alohida stimullar to'plami bilan qisqa mashq versiyasini bajarishdi. Dizayni bir xil, ammo turli xil stimullardan foydalanadigan uchta vazifa varianti qo'llanildi. Bir nechta seanslarni yakunlagan bemorlar uchun yozuvlar turli xil vazifa variantlaridan foydalangan holda turli kunlarda amalga oshirildi. Barcha tasvirlar 9^° × 9^° o'lchamga ega edi. Har bir sinov tasvirni namoyish etishdan iborat bo'lib, uning ketidan 0.5 soniyali bo'sh ekran va keyin javob berilgunga qadar qoladigan javob ekrani keldi (1a-rasm). Bizda bir xil tuzilishga ega bo'lgan va faqat stimullari bilan farq qiladigan ushbu vazifaning 3 ta varianti mavjud edi. Stimullar beshta kategoriyani o'z ichiga olgan tabiiy sahna fotosuratlari bo'lib (S1a-c-rasm), har biridan teng miqdorda olingan. Vazifa MATLABda Psychophysics Toolbox yordamida amalga oshirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tanib olish xotirasi vazifasi miyaning avval ko'rilgan stimullarni mutlaqo yangilaridan farqlash qobiliyatini sinovchining o'ziga bo'lgan ishonch darajasini baholash orqali tekshiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;O'xshashlikni baholash vazifasi (onlayn ishtirokchilar). Inson idrokining o'xshashligi bo'yicha haqiqiy baholarni olish uchun biz Prolific (www.prolific.com) orqali o'zi baholagan normal yoki normallashtirilgan ko'rish qobiliyatiga ega ishtirokchilarni yolladik. Ishtirokchilar veb-asoslangan Meadows platformasida (http://meadows-research.com) amalga oshirilgan ko'p joylashtirish vazifasini bajarishdi. Vazifa dizayni dastlab taklif qilinganidek edi. Ishtirokchilardan tasvirlarni vizual o'xshashlik asosida doiraviy arena ichida joylashtirish orqali ularning o'xshashligini baholash so'raldi (S2c-rasm). Ishtirokchilarga o'xshash tasvirlarni bir-biriga yaqinroq, o'xshash bo'lmaganlarini esa bir-biridan uzoqroq joylashtirish uchun har bir tasvirni sudrab tashlash buyurildi. Ishtirokchi joylashuvdan qoniqmaguncha tasvirlarni qayta-qayta ko'chirish mumkin edi. Bir xil semantik kategoriyadagi tasvirlar klasterlari ko'pincha tabiiy ravishda paydo bo'lar edi va ishtirokchilar kategoriyalar ichidagi nozikroq farqlarni qamrab olish uchun pozitsiyalarni sozlash orqali joylashuvni yaxshilashga undaldi.&lt;/p&gt;\n&lt;p&gt;Birlamchi joylashuvdan qoniqilganda, ishtirokchilar «Bajarildi» tugmasini bosishdi va bu bitta joylashtirish sinovini tashkil etdi. Birinchi joylashuv sinovi har doim to'plamdagi barcha tasvirlarni o'z ichiga olgan. Birlamchi RDM ni baholash uchun har bir joylashtirilgan tasvirlar juftligi uchun kvadrat Yevklid masofasi hisoblandi. Keyingi urinishlarda ishtirokchilarga ko'p joylashtirish vazifasi uchun dastlab taklif qilinganidek, elementlarning kichik to'plamlarini moslashuvchan loyihalash uchun eng zaifni ko'tarish algoritmi (lift-the-weakest) bo'lgan joriy RDM bahosiga qarab tasvirlar kichik to'plami taqdim etildi. Har bir ishtirokchi uchun yakuniy RDM tasvir juftligi paydo bo'lgan barcha joylashuvlardagi masofalarning vaznli o'rtacha qiymati sifatida olindi (S2i-rasm — barcha ishtirokchilar bo'yicha o'rtacha RDM).&lt;/p&gt;\n&lt;h4 id=\"xotira-xulq-atvorini-tahlil-qilish\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#xotira-xulq-atvorini-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xotira xulq-atvorini tahlil qilish&lt;/span&gt;&lt;/a&gt;Xotira xulq-atvorini tahlil qilish&lt;/h4&gt;\n&lt;p&gt;Xulq-atvor tanloviga asoslanib, barcha tanib olish sinovlari TP (to'g'ri eski), true TN (to'g'ri yangi), FN (noto'g'ri eski) va FP (noto'g'ri yangi, shuningdek qo'lyozma davomida «soxta signallar» deb yuritiladi) toifalarga bo'lindi. Eslash unumdorligi ROC tahlili yordamida miqdoriy bahòlandi. Har bir ROC nuqtasi (1g-rasm) berilgan ishonch darajasidagi topish chastotasiga (y-o'qi) va soxta signal chastotasiga (x-o'qi) mos keladi, bunda pastki chap nuqta eng yuqori ishonchni («eski, ishonchli») aks ettiradi. Xulq-atvor AUC qiymati (1h-rasm) ROC egri chizig'i ostidagi maydonni integratsiyalash orqali hisoblandi. Qo'lyozma davomida biz faqat bemor darajasidagi AUC &amp;gt; 0.6 bo'lgan va «yangi» hamda «eski» baholashlar uchun ham yuqori, ham past ishonch darajalarini qamrab oluvchi javoblarga ega seanslarni kiritdik. 3d-rasm tahlili uchun biz bemorlar yuqori va past ishonchli xotiralarni aniq farqlagan seanslarni tanladik (yuqori uchun minimal aniqlik 70% va past uchun 55%).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;ROC tahlili va AUC metrikasi model yoki sinov qatnashchisining turli darajadagi ishonch bilan to'g'ri va noto'g'ri javoblarni qanchalik yaxshi farqlashini baholash uchun ishlatiladi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Modellar. Perseptiv o'xshashlikning xotira ko'rsatkichlariga qo'shgan hissasini tahlil qilish uchun biz oldindan o'qitilgan bir nechta chuqur neyron tarmoqlarini (DNN) ishlatdik (S2b-rasm). DINOv2 — bu o'quv yorliqlarisiz umumiy maqsadli vizual belgilarni ajratib oladigan o'z-o'zidan o'qitiladigan vizual transformator (ViT) modeli. CLIP — bu matn va tasvirlarni moslashtirish uchun o'qitilgan tabiiy tilga asoslangan ViT modelidir. AlexNet va ResNet50 — tasvirlarni turkumlash uchun o'qitilgan chuqur konvolyutsion neyron tarmoqlari (CNN). «Piksel darajasidagi» model — bu tasvirlar juftligi uchun piksellar orasidagi korrelyatsiya masofasi. «Kategoriyalar» modeli bir xil semantik kategoriyadagi tasvirlar juftligiga 0 va turli kategoriyadagi juftliklarga 1 nomutanosiblik qiymatini berish orqali ikkilik qiymatlarga ega RDM sifatida tuzildi.&lt;/p&gt;\n&lt;h4 id=\"oxshashlik-boyicha-mulohazalarni-tushuntirishda-modellarning-unumdorligi\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#oxshashlik-boyicha-mulohazalarni-tushuntirishda-modellarning-unumdorligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;O'xshashlik bo'yicha mulohazalarni tushuntirishda modellarning unumdorligi&lt;/span&gt;&lt;/a&gt;O'xshashlik bo'yicha mulohazalarni tushuntirishda modellarning unumdorligi&lt;/h4&gt;\n&lt;p&gt;Insonning perseptiv o'xshashligini tushuntirishda modellar samaradorligini tizimli baholash uchun biz tasvirlar to'plami (har bir beshta kategoriyadan beshtadan tasvir) uchun o'xshashlik bo'yicha mulohazalarni to'pladik (S2j-rasm). Stimullar to'plami model RDM'larini olish uchun modellar yordamida qayta ishlandi (S2k-rasm). CNN va ViT uchun nomutanosiblik oxirgi model qatlamidan olingan belgi vektorlari orasidagi kosinus o'xshashligidan birni ayirish sifatida aniqlandi (CNN uchun tasniflash boshiga o'tuvchi qatlam). Piksel darajasidagi nomutanosiblik har bir tasvir juftligining piksel qiymatlari orasidagi Pirson korrelyatsiya koeffitsientidan birni ayirish sifatida hisoblandi. Model RDM'lari aniqlangandan so'ng, biz har bir model RDM'ini tasodifiy tenglikni hal qiluvchi Spirmerning &lt;span class=\"yfm-latex\" data-content=\"%5Crho_a\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; koeffitsienti yordamida har bir inson subyektining o'xshashlik RDM'i bilan taqqosladik.&lt;/p&gt;\n&lt;h4 id=\"regressiya-tahlili\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#regressiya-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Regressiya tahlili&lt;/span&gt;&lt;/a&gt;Regressiya tahlili&lt;/h4&gt;\n&lt;p&gt;Xotiradagi soxta signallar hech bo'lmaganda qisman yangi tasvirlarning oldindan o'rganilgan tasvirlarga o'xshashligi haqidagi soxta interferensiyadan kelib chiqishi ehtimolini sinab ko'rish uchun, epilepsiya bilan og'rigan bemorlarga eslash paytida ko'rsatilgan har bir yangi tasvir uchun barcha bemorlar orasida bu tasvirni xatosh ravishda «eski» deb tan olish ehtimolini hisobladik. Keyin biz ushbu ehtimolliklarni ushbu tasvir va o'qitish davomida taqdim etilgan barcha tasvirlar uchun modelning chuqur belgi vektorlari orasidagi minimal kosinus masofasiga nisbatan regressiya qildik. Tasvirga xos bo'lgan tanishlik tuyg'usining soxta signallarga qo'shishi mumkin bo'lgan hissasini hi
