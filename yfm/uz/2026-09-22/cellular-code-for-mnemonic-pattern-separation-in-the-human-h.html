sobga olish uchun regressorlardan biri sifatida tasvirlarni eslab qolish qobiliyatini bashorat qilish uchun o'qitilgan CNN bo'lgan ResMem ishlatildi. Soxta signallar chastotasini inson mulohazalari bilan bevosita taqqoslash uchun biz turli kategoriyalarni baholovchi mustaqil ishtirokchilar bilan 3-vazifa variantining butun tasvirlar to'plami uchun qo'shimcha o'xshashlik mulohazalarini to'pladik (shuningdek, «Ishtirokchilar»ga qarang; S2m-rasm). Bunday holda regressor sifatida yangi tasvir va o'qitish davomida taqdim etilgan bir xil kategoriyadagi barcha tasvirlar orasidagi minimal Evklid masofasidan foydalandik.&lt;/p&gt;\n&lt;h4 id=\"elektrofiziologiya\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#elektrofiziologiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Elektrofiziologiya&lt;/span&gt;&lt;/a&gt;Elektrofiziologiya&lt;/h4&gt;\n&lt;p&gt;Registratsiya mikroprosimkonlar o'rnatilgan gibrid (makro-mikro) chuqurlik elektrodlari yordamida amalga oshirildi (AdTech Medical). Implantatsiya joylari faqat klinik talablar asosida aniqlandi va HPC, AMY, ACC va preSMA ning turli kombinatsiyalarini o'z ichiga oldi. Ko'pchilik bemorlarga ikki tomonlama implantlar qo'yildi. Uzluksiz keng polosali signal (0.1 Gts – 9 kggts) muassasaga qarab ATLAS tizimi (Neuralynx) yoki 30 kggts (Blackrock Neurotech tizimi) yordamida 32 kggts orçlanish chastotasida har bir mikroprosimkondan yozib olindi. Ushbu tadqiqotga kiritilgan barcha bemorlar maqsadli miya sohalarining bir yoki bir nechtasida kamida bitta yaxshi ajratilgan yagona neyronga ega edi.&lt;/p&gt;\n&lt;h4 id=\"spikelarni-aniqlash-va-saralash\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#spikelarni-aniqlash-va-saralash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Spike'larni aniqlash va saralash&lt;/span&gt;&lt;/a&gt;Spike'larni aniqlash va saralash&lt;/h4&gt;\n&lt;p&gt;Xom elektr signallari 300 Gts – 3 kggts diapazonida polosali filtrdan o'tkazildi. Spike'larni aniqlash va saralash shablonni moslashtiruvchi yarim avtomatik OSort v4.1 algoritmi yordamida amalga oshirildi. Barcha saralash natijalari qo'lda tekshirildi va taxmin qilinayotgan yagona birliklar aniqlanib, keyingi tahlillar uchun saqlab qolindi. Ajratilgan birliklarning sifati o'rnatilgan metrikalar, jumladan, spike'lar orasidagi interval buzilishlari ulushi (&amp;lt;3 ms), to'lqin shaklining signal-shovqin nisbati, klaster juftliklari orasidagi proyeksiya masofasi va har bir klasterning aniqlangan boshqa barcha spike'larga nisbatan izolyatsiya masofasi yordamida miqdoriy baholandi. Faqat ushbu mezonlarga javob beradigan neyronlar keyingi tahlillarga kiritildi. Bundan tashqari, biz impuls chastotasi 0.2 Gts dan kam bo'lgan neyronlarni, shuningdek, maqsadli hududdan tashqarida joylashgan elektrodlardan yozib olingan neyronlarni chiqarib tashladik (pastga qarang). Umuman olganda, biz barcha miya sohalari bo'ylab 4166 ta yaxshi ajratilgan birlikni yozib oldik (HPC n=1093, AMY n=1359, ACC n=826 va preSMA n=888). Xulq-atvor unumdorligiga asoslanib, biz 660 ta birlikni chiqarib tashladik (istisno mezonlari/seanslar soni uchun «Ishtirokchilar»ga qarang), bu keyingi tahlil uchun jami 3506 ta birlikni qoldirdi (HPC, AMY, ACC, preSMA da mos ravishda 950, 1187, 684 va 685 ta hujayra).&lt;/p&gt;\n&lt;h4 id=\"elektrodalarni-lokalizatsiya-qilish\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#elektrodalarni-lokalizatsiya-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Elektrodalarni lokalizatsiya qilish&lt;/span&gt;&lt;/a&gt;Elektrodalarni lokalizatsiya qilish&lt;/h4&gt;\n&lt;p&gt;Elektrodlarni lokalizatsiya qilish operatsiyadan keyingi kompyuter tomografiyasi (KT) skanerlarini operatsiyadan oldingi magnit-rezonans tomografiya (MRT) bilan FreeSurfer v5.3.0 va v7.4.1 yordamida, avval tavsiflanganidek, o'zaro ro'yxatdan o'tkazish orqali bajarildi. Elektrod koordinatalari keyinchalik MNI152 fazosiga moslashtirildi va Advanced Normalization Tools v2.1 yordamida standartlashtirilgan hisobot va vizualizatsiya uchun CIT168 ehtimollik atlasiga xaritalandi. Elektrodlarning kulrang moddada joylashganligining yakuniy tasdig'i atlasga asoslangan vizualizatsiyaga emas, balki sub'ektga xos MRT-KT qo'shma ro'yxatdan o'tishlarini vizual tekshirishga asoslangan edi.&lt;/p&gt;\n&lt;h4 id=\"tutqanoq-boshlanish-zonasini-soz-lokalizatsiya-qilish\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#tutqanoq-boshlanish-zonasini-soz-lokalizatsiya-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tutqanoq boshlanish zonasini (SOZ) lokalizatsiya qilish&lt;/span&gt;&lt;/a&gt;Tutqanoq boshlanish zonasini (SOZ) lokalizatsiya qilish&lt;/h4&gt;\n&lt;p&gt;SOZ joylashuvi har bir bemor uchun kasalxonada bo'lishining oxirida mavjud bo'lgan ichki miya monitoringi natijalari asosida aniqlandi (S1-jadval). Biz qayd etilgan har bir neyronni HPC va AMY uchun medial chakka tuzilishi (MTL) yoki ACC va preSMA uchun medial frontal qobiqning (MFC) o'sha yarim sharida SOZ mavjudligiga qarab SOZ ichida yoki tashqarisida lokalizatsiya qildik. Ikki tomonlama SOZga ega bo'lgan sub'ektlarda qayd etilgan barcha neyronlar SOZ ichida ekanligi aniqlandi. Buning natijasida HPC va AMYda mos ravishda 406/950 va 476/1187 ta, ACC va preSMAda эsa 18/684 va 55/685 ta neyron SOZ ichida lokalizatsiya qilindi. SOZ ichidagi va tashqarisidagi HPC uchun haqiqiy ma'lumotlarni dekodlashni taqqoslash uchun (pastga qarang) biz barcha HPC hujayralarini muayyan bemorda HPC elektrodlarini o'z ichiga olgan SOZ mavjudligiga qarab SOZ ichida yoki tashqarisida lokalizatsiya qildik. Buning natijasida 396 ta hujayra SOZ tashqarisida, 398 tasi ichida va 156 tasining aniq joylashuvi noma'lum deb topildi (S8d-rasm). Xuddi shunday, 36 ta xotiraga tanlab ta'sir qiluvchi (MS) neyronlar SOZ tashqarisida, 26 tasi ichida va 14 tasining joylashuvi noma'lum holda qayd etildi (S8e-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SOZ (tutqanoq boshlanish zonasi) miyada epilepsiya xurujlari kelib chiqadigan o'choq bo'lib, gipokamp va amigdala xotira va hissiyotlarni qayta ishlashda markaziy o'rin tutadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"neyronlarni-tanlash\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#neyronlarni-tanlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Neyronlarni tanlash&lt;/span&gt;&lt;/a&gt;Neyronlarni tanlash&lt;/h4&gt;\n&lt;p&gt;Spayklar stimullanish boshlanganidan keyin 200 ms o'tgach boshlanadigan 1,5 s oynada sanaldi. Xotiraga tanlab ta'sir qiluvchi (MS) neyronlar ushbu oyna doirasida to'g'ri aniqlangan yangi va tanish stimullar o'rtasida sezilarli farq ko'rsatadiganlar sifatida aniqlandi (p-value &amp;lt; 0.05, o'rtacha qiymatlarning ikki tomonlama bu(t)strap taqqoslashi, 1000 iteratsiya). Agar eski sinovlar uchun o'rtacha impuls chastotasi yangi sinovnikidan oshib ketgan bo'lsa, MS neyroni tanishlikka tanlab ta'sir qiluvchi (FS) deb tasniflandi. Agar neyronning yangi sinovlar uchun impuls chastotasi eski sinovnikidan oshib ketsa, MS hujayrasi yangilikka tanlab ta'sir qiluvchi deb tasniflandi (NS, 3d, e-rasmlar uchun tegishli). Vizual tanlab ta'sir qiluvchi (VS) neyronlar bir xil spayk sonlari bo'yicha bir omilli ANOVA yordamida aniqlandi (omil: vizual kategoriya, 5 daraja) (p-value &amp;lt; 0.05).&lt;/p&gt;\n&lt;h4 id=\"neyronlarni-kiritish-mezonlari\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#neyronlarni-kiritish-mezonlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Neyronlarni kiritish mezonlari&lt;/span&gt;&lt;/a&gt;Neyronlarni kiritish mezonlari&lt;/h4&gt;\n&lt;p&gt;Tahlilga kiritilish uchun hujayra barcha sinovlar davomida stimulyatsiya davrida &amp;gt;0,2 Hz o'rtacha impuls chastotasiga ega bo'lishi talab qilindi. Bundan tashqari, har bir maxsus tahlil uchun biz faqat har bir mumkin bo'lganturning ma'lum bir minimal sinovlar soniga ega bo'lgan hujayralarni kiritdik (odatda ROC tahlili uchun 2 va dekodlash tahlillari uchun 5 ta). Kerakli minimal sinovlar soni har bir usulni tavsiflovchi keyingi bo'limlarda ko'rsatilgan.&lt;/p&gt;\n&lt;p&gt;Soxta ijobiy (FP) chastotalari stimul turiga bog'liq bo'lib, ba'zi toifalarga tegishli rasmlar (masalan, «hayvonlar») boshqa toifalarga qaraganda tez-tez FP sifatida xabar qilinadi (1–3-vazifa variantlari uchun S1a-c-rasm). Shu sababli, vizual kategoriyani ham kodlaydigan MS hujayralari bizning tahlilimiz uchun aralashuvchi omil bo'lishi mumkin. Kategoriyaga moslashtirilgan MS hujayralari kam uchrasa ham (mos ravishda HPC, AMY, ACC, preSMAda 1,9% (18/950), 1,85% (22/1187), 1,5% (10/684), 1,6% (11/685)), biz ehtiyot choralari sifatida 3g-rasmdan keyingi barcha tahlillar uchun ularni istisno qildik (3c-rasmda bunday hujayraning misoli ko'rsatilgan).&lt;/p&gt;\n&lt;h4 id=\"hujayralarni-tanlash-uchun-tasodifiy-daraja\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#hujayralarni-tanlash-uchun-tasodifiy-daraja\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hujayralarni tanlash uchun tasodifiy daraja&lt;/span&gt;&lt;/a&gt;Hujayralarni tanlash uchun tasodifiy daraja&lt;/h4&gt;\n&lt;p&gt;Hujayralarni tanlash uchun tasodifiy darajalarni baholash uchun xotiraga tanlab ta'sir qiluvchi hujayralarni aniqlash tartibi sinov yorliqlarini (to'g'ri yangi/eski) 500 marta tasodifiy almashtirgandan so'ng takrorlandi.&lt;/p&gt;\n&lt;h4 id=\"yakkalik-neyron-tahlili\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#yakkalik-neyron-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yakkalik neyron tahlili&lt;/span&gt;&lt;/a&gt;Yakkalik neyron tahlili&lt;/h4&gt;\n&lt;p&gt;Peristimul vaqt gistogrammalarini (PSTH, 3a, b-rasm; 4f-i-rasm) tuzish uchun biz 16 ms qadamli 200 ms sirpanuvchi oynada spayklarni sanaymiz.&lt;/p&gt;\n&lt;h4 id=\"alohida-neyronlar-roc-tahlili\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#alohida-neyronlar-roc-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Alohida neyronlar ROC-tahlili&lt;/span&gt;&lt;/a&gt;Alohida neyronlar ROC-tahlili&lt;/h4&gt;\n&lt;p&gt;Neyron ROC-egrilari stimul boshlanganidan 200 ms o‘tgach boshlanadigan 1,5 soniyali oynadagi impulslar (spike) soni asosida hisoblandi. Aniqlash chegarasi kuzatilgan minimal va maksimal impulslar soni o‘rtasida o‘zgarib turdi va 20 ta qadamga chiziqli ravishda taqsimlandi. AUC qiymati ROC-egrisi ostidagi maydonni integratsiyalash orqali olindi. Biz alohida MS-neyronlar qiziqish uyg‘otadigan turli sinovlarni qanchalik yaxshi ajrata olishini miqdoriy baholash uchun ROC-tahlilini o‘tkazdik.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ROC-tahlili (Receiver Operating Characteristic) — bu binar klassifikatsiyaning sifatini baholashning statistik usuli bo‘lib, unda AUC (egri chiziq ostidagi maydon) neyronning ikki holatni ajrata olish qobiliyatini ko‘rsatadi: AUC 1 ga qanchalik yaqin bo‘lsa, neyron signallarni shunchalik yaxshi ajratadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Yuqori va past ishonch darajasini solishtirish (3d, e-rasm). MS-neyronlar yangi va tanish sinovlarni turli ishonch darajalarida qanday farqlashini baholash uchun faqat to‘rtta ishonch darajasining har birida kamida ikkita sinovga ega bo‘lgan neyronlar tahlil qilindi. Adolatli solishtirish uchun ROC-tahlilidagi bir guruh ishonch darajasi bo‘yicha tabaqalashtirildi, ikkinchisi esa o‘zgarmas holda qoldirildi. FS-neyronlar uchun barcha TN-sinovlari (ishonch darajasidan qat’i nazar) o‘zgarmas guruh vazifasini bajardi va yuqori hamda past ishonchdagi TP-sinovlari bilan solishtirildi. NS-neyronlar uchun barcha TP-sinovlari o‘zgarmas deb olindi va yuqori hamda past ishonchdagi TN-sinovlari bilan solishtirildi.&lt;/p&gt;\n&lt;p&gt;Xatolik sinovlari tahlili (S5b-rasm, shuningdek, 4a-e-rasmlarga tegishli). MS-hujayralarining xulq-atvor namunalarini ajratish muvaffaqiyatsiz bo‘lgan sinovlarga (FP) javob berish naqshini baholash uchun biz bir xil xulq-atvor tanloviga ega, ammo haqiqiy holati har xil (TP va FP) yoki tanlovi har xil, ammo haqiqiy holati bir xil (TN va FP) bo‘lgan sinovlar juftligi uchun AUC ni hisobladik. Ushbu tahlilga faqat kamida 5 ta noto‘g‘ri sinovga ega bo‘lgan neyronlar kiritildi.&lt;/p&gt;\n&lt;p&gt;Alohida hujayralarni dekodlash (3, 4-rasmlar). Alohida hujayralarni dekodlash Poisson sodda Bayes klassifikatori yordamida amalga oshirildi. Har bir neyron uchun biz impulslar sonidan belgilar (features) sifatida foydalandik. Kutilayotgan impulslar soni (λ) har bir sinf uchun alohida o‘quv sinovlari bo‘yicha o‘rtacha qiymat sifatida baholandi. Keyin, har bir test kuzatuvi uchun log-ehtimollik tegishli λ qiymatlari bilan parametrlangan Poisson taqsimotlari yordamida hisoblandi va sinfga mansublik ushbu ehtimollik asosida belgilandi. Har bir dekodlash jarayonida (n=100) biz sinov uchun har bir sinfdan tasodifiy ravishda bitta sinovni (jami 2 ta sinov) chiqarib tashladik. Ko‘rsatilgan samaradorlik ushbu 2x100 sinovlarning klassifikatsiyalari bo‘yicha o‘rtacha qiymatdir. Dekodlash samaradorligi uchun nol taqsimotni baholash uchun biz xuddi shu dekodlash jarayonini takrorladik, lekin sinf yorliqlarini 1000 marta aralashtirgandan so‘ng. Guruh darajasidagi ahamiyatlilikni tekshirish uchun biz har bir hujayra uchun nol taqsimotni hisobladik, so‘ngra har bir permutatsiya uchun hujayralar bo‘yicha tasodifiy samaradorliklarni o‘rtachalashtirdik, natijada 1x1000 nol taqsimot hosil bo‘ldi. P-qiymati hujayralar bo‘yicha o‘rtacha dekodlash samaradorligidan oshib ketadigan nol qiymatlar soniga tenglashtirildi. Agar hech qanday nol qiymat kuzatilgan samaradorlikdan oshmasa, p-qiymati permutatsiyalar soniga (1/1000) bo‘lingan birga tenglashtirildi.&lt;/p&gt;\n&lt;p&gt;Xatolik sinovlari tahlili (3g, h-rasmlar). MS-hujayralari FP-sinovlarini TP-sinovlaridan ajrata olishini tekshirish va bu ajrata olish qobiliyatini to‘g‘ri sinovlar (TP va TN) bilan adolatli solishtirish uchun biz barcha qayd etilgan hujayralarni tahlil qildik. Kiritilishi uchun hujayra kamida 5 ta FP-sinoviga ega bo‘lishi kerak edi. Biz stimul boshlanganidan keyin ms o‘tgach boshlanadigan 1,5 soniyali oynadagi impulslarni sanadik. Biz yuqorida tavsiflangan xuddi shu o‘zaro tekshirish (cross-validation) jarayonidan foydalandik. O‘quv sinovlari dekoderni TP ni TN dan yoki TP ni FP dan farqlashga o‘rgatish va yuqorida tavsiflanganidek MS-hujayralarini tanlash uchun ishlatildi. Har bir neyron uchun bu ikkita dekodlash samaradorligi o‘lchovini va u MS-hujayrasi sifatida tasniflangan yugurishlar ulushini berdi. Keyin biz kamida 75% yugurishlarda MS sifatida tasniflangan hujayralar uchun dekodlash samaradorliklarini solishtirdik. MS-hujayralarini tasniflash chegarasini 85 yoki 95% ga o‘zgartirish asosiy matnda keltirilgan natijalarni o‘zgartirmadi (S3f, g-rasm).&lt;/p&gt;\n&lt;p&gt;MS-hujayralarini tasniflash (4a-e-rasmlar). MS-hujayrasi xotira tanlovi yoki xotira haqiqati signalini olib yurishini baholash uchun biz kamida 5 ta FP-sinoviga ega MS-hujayralarini tahlil qildik. Biz stimul boshlanganidan 200 ms o‘tgach boshlanadigan 1,5 soniyali oynadagi impulslarni sanadik. Biz yuqorida tavsiflangan xuddi shu o‘zaro tekshirish jarayonidan foydalandik. O‘quv sinovlari dekoderni TP ni FP dan (bir xil tanlov, har xil haqiqiy holat) yoki TN ni FP dan (har xil tanlov, bir xil haqiqiy holat) farqlashga o‘rgatish va xuddi shu juftliklar uchun AUC ni hisoblash uchun ishlatildi (shuningdek, «Alohida neyronlar ROC-tahlili. Xatolik sinovlari tahlili» qismiga qarang).&lt;/p&gt;\n&lt;p&gt;Har bir MS-hujayrasi, agar uning TN va FP uchun AUC qiymati TP va FP uchun AUC qiymatidan yuqori bo‘lsa, MC sifatida, yoki agar uning TP va FP uchun AUC qiymati TN va FP uchun AUC qiymatidan yuqori bo‘lsa, PS sifatida tasniflandi. Har bir MS-neyroni uchun bu ikkita dekodlash samaradorligi o‘lchovini va u MC yoki PS hujayrasi sifatida tasniflangan yugurishlar ulushini berdi. Keyin biz kamida 75% yugurishlarda har qanday tur sifatida tasniflangan hujayralar uchun dekodlash samaradorliklarini solishtirdik.&lt;/p&gt;\n&lt;h4 id=\"populyatsion-tahlil-demiksirlangan-asosiy-komponentlar-tahlili-dpca\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#populyatsion-tahlil-demiksirlangan-asosiy-komponentlar-tahlili-dpca\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Populyatsion tahlil: Demiksirlangan asosiy komponentlar tahlili (dPCA)&lt;/span&gt;&lt;/a&gt;Populyatsion tahlil: Demiksirlangan asosiy komponentlar tahlili (dPCA)&lt;/h4&gt;\n&lt;p&gt;Biz ilgari tavsiflanganidek dPCA dan foydalandik. Avvalo, har bir neyron uchun 500 ms lik siljish oynasida 16 ms qadam bilan spayk chastotasi traektoriyasini hisobladik va uni boshlang'ich qiymatga nisbatan (stimul boshlanishidan 1 s oldingi vaqt oynasi) o'rtacha qiymat va standart og'ish yordamida z-skol qildik. dPCA algoritmi populyatsiya faolligini qiziqish uyg'otadigan o'zgaruvchilarga mos keladigan marginalizatsiya qilingan ma'lumotlar matritsalariga ajratishdan boshlanadi. Biz stimulning haqiqiy qiymati va xulq-atvor tanloviga nisbatan marginalizatsiya qilingan ma'lumotlar matritsalarini tuzdik. Shuni yodda tutingki, to'g'ri sinovlar (TP va TN) ikkala marginalizatsiyada ham har doim bir xil yliqlarga ega, noto'g'ri sinovlar (FP va FN) esa haqiqiy qiymat va tanlovga nisbatan qarama-qarshi yliqlarga ega. Har bir marginalizatsiya qilingan o'rtacha qiymat uchun algoritm keyinchalik regulyarizatsiyalangan kamaytirilgan rangli regressiyadan foydalangan holda alohida kodlash va dekodlash matritsalarini hisoblaydi. Dekodlash matritsasining ustunlari demiksirlangan asosiy komponentlar (dPCs) sifatida ishlatildi, ularga N-o'lchamli ma'lumotlar (sinovdan o'tkazish uchun yagona sinov ma'lumotlari va o'qitish uchun sinovlar bo'yicha o'rtacha olingan ma'lumotlar) proyeksiya qilindi. Ushbu matritsaning qiymatlari har bir neyronning marginalizatsiya qilingan taqdimotga qo'shgan hissasini miqdoriy baholaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;dPCA (demiksirlangan asosiy komponentlar tahlili) — bu neyronlarning umumiy faolligini stimulni idrok etish yoki qaror qabul qilish kabi turli vazifa o'zgaruvchilarini aks ettiruvchi alohida komponentlarga ajratadigan matematik usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Dekodlash tahlili uchun (5k–o-rasm) biz bitta vaqt oynasidan (stimul boshlanganidan 200 ms o'tgach boshlanadigan 1,5 s) olingan ma'lumotlardan foydalandik va shu bilan vaqt bilan bog'liq dispersiyani olib tashladik. dPCA dekodlash tahliliga faqat o'rtacha spayk chastotasi kamida 0,2 Hz bo'lgan va har bir shart uchun kamida beshta sinovdan iborat bo'lgan neyronlar kiritildi. Kodlash o'lchamlarining statistik ahamiyatini baholash uchun biz yagona sinovli dekodlash protsedurasidan foydalandik. Har bir iteratsiya uchun har bir sinov turidan (ham «yangi», ham «eski» stimullar uchun to'g'ri va noto'g'ri sinovlar) bitta sinov tasodifiy tanlanib, yagona sinov faolligi matritsasi hosil qilindi. Qolgan sinovlar dPCA kodlash o'lchamlarini hisoblash uchun ishlatiladigan o'qitish ma'lumotlar matritsasini tuzish uchun o'rtacha olindi. Keyinchalik ajratib qo'yilgan yagona sinov ma'lumotlari birinchi kodlash o'lchamiga (o'qitish ma'lumotlarida eng katta dispersiyani qamrab oluvchi) proyeksiya qilindi va eng yaqin sinf o'rtacha qiymatiga muvofiq tasniflandi. Bu protsedura 1000 marta takrorlandi va dekodlash aniqligi takrorlashlar davomida to'g'ri tasniflashlar ulushi sifatida aniqlandi. Nol taqsimot sinov yliqlarini aralashtirish va dekodlash protsedurasini 500 marta takrorlash orqali yaratildi. P-qiymat kuzatilgan dekodlash unumdorligidan oshib ketadigan nol qiymatlar soniga tenglashtirildi.&lt;/p&gt;\n&lt;p&gt;Gippokampdagi (HPC) dekodlash mavjud neyronlarning ko'p sonidan ta'sirlanmaganligini ta'minlash uchun nazorat sifatida (512 ga nisbatan 422; shuni yodda tutingki, bu raqamlar ushbu tahlil uchun har bir turdagi 5 tadan kam sinovga ega bo'lgan neyronlar chiqarib tashlangani sababli 1e-rasmda keltirilganlardan pastroq), biz HPC populyatsiyasining 75% ini tasodifiy tanladik (n = 384) va dekodlashni 250 marta takrorladik. Natijalar sifat jihatidan o'xshash bo'lib qoldi, HPC da xotiraning haqiqiy qiymati va tanlovining sezilarli darajada dekodlanishi kuzatildi (S6c-rasm; mos ravishda p = 0,009 va p = 0,018). Ikki dekodni to'g'ridan-to'g'ri taqqoslash uchun (S6d-rasmdagi HPC va preSMA kabi, SOZ ichida va tashqarisida hamda S8-rasmdagi chap va o'ng HPC) biz neyronlar soni moslashtirilgandan so'ng ular orasidagi dekodlash aniqligidagi farqni hisobladik va bu farqni sinov yliqlari aralashtirilgandan keyin hisoblangan dekodlash farqlarining nol taqsimoti bilan taqqosladik (n = 500 aralashtirish). Buning uchun har bir dekod perestanovkasida (n = 250) biz ikkala populyatsiyadan eng kichik populyatsiyaning 80–85% ini (preSMA, n = 340; SOZ da, n = 170; chap HPC, n = 190) tasodifiy tanladik va yuqoridagi kabi bir xil dekodlash protsedurasini takrorladik. Shu bilan birga, biz sinov yliqlarini 500 marta aralashtirdik va dekodlash unumdorligi farqlarining nol taqsimotini hisobladik. P-qiymat kuzatilgan farqdan oshib ketadigan nol qiymatlar soniga teng qilib belgilandi, agar hech qanday nol qiymat kuzatilgan qiymatdan oshmasa, quyi chegara 1/250 qilib olindi.&lt;/p&gt;\n&lt;h4 id=\"yakkalik-sinov-proektsiyasi\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#yakkalik-sinov-proektsiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yakkalik sinov proektsiyasi&lt;/span&gt;&lt;/a&gt;Yakkalik sinov proektsiyasi&lt;/h4&gt;\n&lt;p&gt;Хотира кодирования йўналиши бўylab yakkalik sinov proektsiyalari taqsimotini baholash uchun biz dPC larni faqat bitta vaqt oynasida (stimul paydo bo'lgandan keyin 200 ms boshlanadigan 1.5 s) oldindan tanlangan MS hujayralarida hisobladik. Yuqorida tavsiflanganidek, biz tasodifiy ravishda har bir turdagi bitta sinovni chetda qoldirdik. Qolgan sinovlarni o'rtachalashtirdik va ular ustida dPCA kodlash o'lchamlarini hisobladik. Har bir o'lcham uchun dekoder matrifikasi (haqiqiy xotira holati yoki tanlov uchun eng katta dispersiya komponenti) kodlash vektorini baholash uchun birlik kattalikkacha normallashtirildi. Chetda qoldirilgan sinovlar skalyar ko'paytma yordamida ushbu kodlash vektoriga proektsiya qilindi. Bu tartib 1000 marta takrorlanib, har bir kodlash yo'nalishi bo'ylab yakkalik sinov proektsiyalari taqsimotini hosil qildi. Turli sinov turlari taqsimotlari orasidagi farq d-prime yordamida miqdoriy baholandi: &lt;span class=\"yfm-latex\" data-content=\"d'%20%3D%20%5Cfrac%7B%2F%5Cmu_1%20-%20%5Cmu_2%2F%7D%7B%5Csqrt%7B%5Cfrac%7B%5Csigma_1%5E2%20%2B%20%5Csigma_2%5E2%7D%7B2%7D%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, bu yerda µ₁ va µ₂ — 1 va 2 taqsimotlarning o'rtacha qiymatlari, σ₁² va σ₂² эса — 1 va 2 taqsimotlarning dispersiyalari.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;d-prime (d') ko'rsatkichi o'rtacha qiymatlar va tarqoqlikdagi farqni hisobga olgan holda ikkita ma'lumotlar taqsimotini qanchalik yaxshi ajratish mumkinligini o'lchaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz dastlab FP va TN taqsimotlari ajralib turishini tekshirdik (d'&amp;gt;0). Buning uchun biz FP va TN orasidagi d' ni hisobladik (6c-rasm, d'₁) va uni sinov yorliqlarini aralashtirgandan keyin xuddi shu protsedura yordamida hosil qilingan d-prime nol taqsimoti bilan taqqosladik. Har bir bitta sinovni qoldirish iteratsiyasida (n=1000, yuqoriga qarang) biz har bir sinov turi uchun 1×500 yakkalik sinov proektsiyasi taqsimotini hosil qilib, sinov yorliqlarini 500 marta aralashtirdik va aralashtirilgan d-prime ni hisobladik. Bu kuzatilgan d'₁ bilan solishtiriladigan 1000 ta nol FP-TN d-prime qiymatlarini berdi. Nol qiymatlarning hech biri kuzatilgan d-prime dan oshmagani sababli, p-qiymat 1/1000 (nol taqsimot o'lchami) qilib belgilandi.&lt;/p&gt;\n&lt;p&gt;Keyin biz mos keladigan d-prime farqlaridan foydalangan holda FP–TN va TP–FP taqsimotlarining ajralishini taqqosladik (6c-rasm, d'₂). d'₂ va d'₁ orasidagi musbat farq FP sinovlari TP ga qaraganda TN ga yaqinroq bo'lib qolishini, lekin shunga qaramamay dPCA haqiqiy holat o'qi bo'ylab TP tomon siljishini ko'rsatadi. Buni statistik jihatdan sinash uchun biz yuqorida tavsiflangan tarzda olingan aralashtirilgan yorliq taqsimotlaridan foydalandik va TP-FP taqsimotlari FP-TN taqsimotlariga qaraganda ko'proq ajralib turmasligi haqidagi gipoteza ostida nol taqsimotni hosil qilish uchun d-prime farqini hisobladik. Bu 1000 ta nol d-prime farqini keltirib chiqardi. Keyin biz TP-FP d-prime va FP-TN d-prime ning kuzatilgan farqini ushbu nol taqsimot bilan taqqosladik. Nol farqlarning hech biri d-prime ning kuzatilgan farqidan oshmagani uchun, p-qiymat 1/1000 (nol taqsimot o'lchami) etib belgilandi. 6f-rasm uchun yakkalik sinov proektsiya taqsimotlari shunga o'xshash tarzda hosil qilindi, ammo sinov (proektsiya) uchun TP sinovlari ularning ishonchiga (yuqori yoki past) qarab tanlandi. 6g-rasm uchun PS hujayralari ('MS hujayralarini tasniflash' bo'limida tavsiflanganidek aniqlangan) MS hujayralari populyatsiyasidan chiqarib tashlandi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h-f1.jpg\" alt=\"1-rasm. Vazifa, xulq-atvor va qayd etilgan hujayralarning qisqacha mazmuni. a, Tanishish sinovining misoli. b, Miya atla\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. Vazifa, xulq-atvor va qayd etilgan hujayralarning qisqacha mazmuni. a, Tanishish sinovining misoli. b, Miya atlasida ko'rsatilgan elektrod joylashuvi. Har bir nuqta yozib olish sohasi bo'yicha rang berilgan mikroprovoklar tutamini bildiradi. Oq modda yoki nishondan tashqari koordinatalar shablon miyaga birlashtirilgani sababli yuzaga keladi. c, Mumkin bo'lgan sinov turlari: Soxta ijobiy natijalar (qizil rangda belgilangan FP) subyekt «yangi» tasvirni «eski» sifatida tasniflaganda (Ha javobi) hosil bo'ladi. d, Chapda: o'rganilgan misol maqsadli tasvir (eski). O'ngda: o'rganilmagan (yangi), lekin yuqori ehtimollik bilan eski (FP) deb tasniflangan vizual o'xshash tuzoq tasviri (FP chastotasi = 54%). e, Izolyatsiya qilingan yagona birliklar soni (kulrang, barcha miya sohalari bo'yicha umumiy n = 3506) va xulq-atvorga asoslanib chiqarib tashlangan birliklar soni (qizil, n = 660). (f-j) Xulq-atvor. f, Xotirani tanib olish aniqligi. Har bir nuqta bitta sessiya (97 bemor bo'yicha n = 133), qizil rang o'rtacha ± standart og'ish. (g-f), Individual sessiyalar (kulrang) va o'rtacha (qizil) uchun ishonch funksiyasi sifatida aniqlik. Har bir ma'lumot nuqtasi har xil ishonch darajasini bildiradi, eski sinovlar uchun eng yuqori ishonch darajasi 6 ga teng. h, (g) da ko'rsatilgan ROC egri chizig'i ostidagi AUC. Uzuq-uzuq qizil chiziq kiritish mezonlaridan biridir (AUC&amp;gt;=0.6, kiritilgan n = 112, 84 bemor). i, Aniqlik yuqori va past ishonchdagi sinovlarda sezilarli darajada yuqori edi (p=1.24x10-31, t(110)=16.55, juftlashgan t-test). Har bir chiziq alohida sessiya. j, Noto'g'ri javoblar («ha» yoki «yo'q») to'g'ri javoblarga nisbatan sezilarli darajada past ishonch reytingiga ega edi (TP ga qarshi FP: t(110)=13.41, p= 7.05x10-25, juftlashgan t-test; TN ga qarshi FN: t(111)=-8.72, p= 3.11x10-14, juftlashgan t-test. E'tibor bering, manfiy t statistikasi «yo'q» javobi uchun pastroq ishonchga mos keladigan yuqori ishonch reytingi bilan bog'liq, a paneliga qarang). *** p&amp;lt;0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h-f3.jpg\" alt=\"3-rasm. Xotirani tanib olishning yagona neyron imzolari: Xotirani tanlab oluvchi hujayralar. (a-b) Xotirani tanlab oluvc\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm. Xotirani tanib olishning yagona neyron imzolari: Xotirani tanlab oluvchi hujayralar. (a-b) Xotirani tanlab oluvchi hujayralar misollari. Stimulning boshlanishi t=1 da. a, To'g'ri tan olingan eski va yangi stimullar uchun o'z otish tezligini eng ko'p oshirgan gippokamp neyroni misoli. b, To'g'ri tan olingan yangi va eski stimullar uchun otish tezligini oshiradigan boshqa misol hujayra. c, Xotirani tanlab oluvchi (MS) hujayralar sifatida malakaga ega bo'lgan barcha qayd etilgan hujayralarning ulushi. To'q kulrang rang qo'shimcha ravishda VS hujayralari sifatida ham malakaga ega bo'lgan MS hujayralarini ko'rsatadi. MS hujayralarining ulushi barcha sohalarda tasodifiy kutilganidan kattaroqdir (qizil chiziq) (HPC, p=0.001, AMY, p=0.001, ACC, p=0.002, preSMA, p=0.001). d, e, MS hujayra signali past ishonchli sinovlarga qaraganda yuqori ishonchli sinovlarda kuchliroq. d, Miya sohalari bo'yicha yuqori va past ishonch uchun MS hujayralari AUC qiymatlarining juftlik bo'yicha taqqoslanishi (p-qiymatlar juftlashgan t-test). ACC dan tashqari barcha miya sohalaridagi MS hujayralari (p=0.1) past ishonchga qaraganda yuqori ishonchli sinovlar uchun sezilarli darajada yuqori AUC ga ega edi (HPC p=0.006, AMY p=0.0009, preSMA p=0.03). d va e tahliliga faqat bemorlar yuqori va past ishonchni farqlay oladigan xulq-atvor sessiyalari kiritilgan (53 bemor bo'yicha 69 sessiya). e, d bilan bir xil, lekin barcha 4 miya sohasida yangilikni afzal ko'radigan (ko'k nuqtalar) va tanishlikni afzal ko'radigan (qizil nuqtalar) hujayralar uchun alohida tarqoq grafik sifatida chizilgan. E'tibor bering, MS hujayralarining ikkala turi uchun ham yuqori ishonchli sinovlar uchun AUC past ishonchdagiga qaraganda yuqori. f, Gipotezaning illustratsiyasi: naqshni ajratishdan foydalanadigan neyronlarning faolligi (ko'k nuqtalar) javob har qanday holatda ham «eski» bo'lishiga qaramay, haqiqiy eski (TP) va soxta eski (FP) stimullarni ishonchli tarzda farqlaydi. Aksincha, naqshni to'ldirishga o'xshash faollikni namoyish etuvchi neyronlar (pushti nuqtalar) FP sinovlariga TP sinovlariga o'xshash yoki o'xshash tarzda javob beradi. Nuqtalar faraziy simulyatsiya qilingan ma'lumotlarni ko'rsatadi. (g-h) (f) da ko'rsatilgan gipotezani sinash uchun ma'lumotlar. Barcha qayd etilgan MS hujayralarida faollik qaror signalidan ko'ra xotira mavjudligini ko'rsatib, TP va FP sinovlari orasida sezilarli darajada farq qildi. g, Tasodifiy tanlangan sinovlarning kamida 75% da xotirani tanlab oluvchi bo'lgan neyronlar uchun o'zaro tekshirilgan yagona hujayrali dekodlash unumdorligi, miya sohasi bo'yicha ranglar bilan kodlangan. Qizil rang o'rtacha ± standart og'ish. Ko'p MS hujayralari uchun TP va FP ni dekodlash unumdorligi tasodifiy darajadan oshib ketdi. h, g dagi hujayralar uchun TP va TN hamda TP va FP dekodlash unumdorliklarining juftlik bo'yicha taqqoslanishi. HPC, ACC va preSMA da TP va TN hamda TP va FP ikkalasi ham tasodifdan sezilarli darajada yuqori darajada dekodlanishi mumkin edi (p=0.001), TP va TN dekodlashi TP va FP ga qaraganda sezilarli darajada yuqori bo'ldi (HPC p=7.5x10-5, ACC p=7.6x10-5, preSMA p=7.4x10-6, signrank testi). AMY da faqat TP va TN sezilarli darajada dekodlanishi mumkin edi (p=0.001, TP va FP p=0.4). * p&amp;lt;0.05, ** p&amp;lt;0.01, *** p&amp;lt;0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h-f4.jpg\" alt=\"4-rasm. MS hujayralarining naqshni ajratish kenja turining faolligi xulq-atvor xatolariga qaramay, haqiqiy eski va soxta\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm. MS hujayralarining naqshni ajratish kenja turining faolligi xulq-atvor xatolariga qaramay, haqiqiy eski va soxta eski stimullarni farqlaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h-f5.jpg\" alt=\"5-rasm. Xotiraning asosiy haqiqati ham, xulq-atvor tanlovi ham populyatsiya darajasida namoyon bo'ladi. a-e, HPC da xoti\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm. Xotiraning asosiy haqiqati ham, xulq-atvor tanlovi ham populyatsiya darajasida namoyon bo'ladi. a-e, HPC da xotira va tanlov ifodalarining aralashmagan asosiy komponentlar tahlili (dPCA). a, Ajratilgan HPC (yashil rang) bilan Brainnetome atlasidan foydalangan holda 3D miya modeli. b, Asosiy haqiqat, qaror va ikkalasi o'rtasidagi o'zaro ta'sir dispersiyaning sezilarli qismini tushuntiradi (mos ravishda 19%, 19% va 18%). c-e, Har bir o'zgaruvchi uchun eng ko'p dispersiyani tushuntiruvchi asosiy haqiqat (c), qaror (d) va o'zaro ta'sir (e) dPC larga proyeksiyalangan neyron faolligi. c da xotira asosiy haqiqatining (qizil va ko'k ranglar), d da xulq-atvor tanlovlarining (tutash va uzuq chiziqlar) va e da to'g'ri va noto'g'ri sinovlarning ajralib turishiga e'tibor bering. f-j, a-e bilan bir xil, lekin preSMA uchun. k, Chapdagi ustun faqat bitta vaqt oynasi (stimul boshlanganidan keyin 1.5 s) ko'rib chiqilganda dPCA parametrlari bilan tushuntiriladigan dispersiyani ko'rsatadi. HPC da xotiraning asosiy haqiqati ham, qaror ham tegishli dPCA o'qlaridan bitta sinov darajasida dekodlanishi mumkin (stimul boshlanganidan keyin 1.5 s davomidagi o'rtacha). Har bir shartda kamida 5 ta sinovga ega bo'lgan hujayralargina ko'rib chiqildi (n=512). HPC da ham asosiy haqiqatni (p=0.003), ham qarorni (p=0.009) dekodlash sezilarli edi. Bej rangli nuqta FP sinovlarini tasniflash aniqligini belgilaydi. i, k bilan bir xil, lekin preSMA uchun. preSMA da faqat qaror sezilarli darajada dekodlanishi mumkin edi (p=1.7x10-8, asosiy haqiqat p=0.17). m-o, HPC da populyatsiya (dPCA natijasi) va yagona hujayrali sozlash o'rtasidagi munosabat. MC va PS hujayralari ham asosiy haqiqat (MS p=5.9x10-9, PS p=1.6x1-36), ham qaror (MC p=2.2x10-20, PS p=9.2x10-21) o'qlari uchun MS bo'lmagan hujayralarga qaraganda yuqori dPCA vaznlariga ega edi. PS hujayralari, shuningdek, MC hujayralariga qaraganda asosiy haqiqat dekoder o'qi uchun sezilarli darajada yuqori vaznlarga ega edi (p=0.005, qaror o'qi MC va PS p=0.2). Barcha m va n p-qiymatlari ikki namunali t-testdir. o, m va n bilan bir xil, lekin bir-biriga qarshi chizilgan. Yuqori o'ng burchakdagi qo'shimcha - asosiy haqiqat (ochiq ko'k) va qaror (pushti) o'qlari uchun dPCA vaznlarining taqsimoti. 0 ga markazlashganiga e'tibor bering. * p&amp;lt;0.05, ** p&amp;lt;0.01, *** p&amp;lt;0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h-f6.jpg\" alt=\"6-rasm. Namunalarni ajratish bilan bog'liq neyron faolligi xotira kuchi uzluksiz signaliga hissa qo'shadi. a, HPC populy\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm. Namunalarni ajratish bilan bog'liq neyron faolligi xotira kuchi uzluksiz signaliga hissa qo'shadi. a, HPC populyatsiyasidan PS turidagi MS hujayralarini (n=20) olib tashlash haqiqiy holatni (ground truth) dekodlash qobiliyatini yo'q qiladi (p=0.5), lekin qarorni emas (p=0.03). b, Yozib olingan barcha MS hujayralari populyatsiyasidagi dispersiyaning katta qismi mos ravishda HPC va preSMA'da haqiqiy holat (53%) va qaror (58%) bilan tushuntiriladi. Barcha MS hujayralarining dPCA asosida. c, TP, TN va FP sinovlari uchun dPC haqiqiy holat dekoder o'qiga yagona sinov proyeksiyalarining taqsimoti (qizil, ko'k va bej ranglar). TP va FP taqsimotlari FP va TN ga qaraganda ko'proq ajralib turardi (mos ravishda d-prime = 1.68 (d’2) va 0.76 (d’1)). d, Kuzatilgan FP-TN d-prime (d’1) va TP-FP (d’2) hamda FP-TN d-primes farqining sinov yorliqlarini aralashtirib yuborilgandan keyin d-primes va farqni hisoblash yo'li bilan hosil qilingan nol taqsimotlar bilan taqqoslanishi. O'rin almashtirilgan qiyatlarning hech biri d’1 va d’2 - d’1 uchun kuzatilgan qiyatlardan oshmadi (ikkalasi ham p=0.001, o'rin almashtirishlar soniga bo'lingan deb belgilangan). e, Signalni aniqlash nazorati (SDT) bashoratlarining sxemalari. Yuqori: xotira kuchi bu signal qaror chegarasidan oshib ketishiga asoslangan tanib olish qarorlari bilan uzluksiz signal sifatida ifodalanadi. Ushbu o'qda yuqoriroq ishonch qarorlari kuchliroq xotira kuchi bilan bog'liq va o'rta mezonidan uzoqroqda joylashgan bo'ladi. Pastki: PS hujayralarisiz, turli xotira kuchiga ega bo'lgan «eski» qarorlar o'rtasida hech qanday ajratishga erishilmaydi (yuqori, past ishonchli TP, FP). f, c bilan bir xil, lekin yuqori va past ishonchli qarorlar uchun alohida tuzilgan TP sinovlari bilan. HPC'da yuqori ishonchli TP (qizil rang) taqsimoti TN sinovlaridan eng ko'p ajralib turdi, past ishonchli TP uchun kamroq ajralish va FP sinovlari uchun undan ham kamroq, SDT bashorat qilganidek. PS hujayralari olib tashlanganda (g), turli qarorlarga ega sinovlar proyeksiyalari hali ham ajralib turadi, shu bilan birga yuqori ishonchli, past ishonchli TP va FP sinov proyeksiyalari (bir xil qaror) haqiqiy holat o'qida qulab tushadi. *** p&amp;lt;0.001&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separa
