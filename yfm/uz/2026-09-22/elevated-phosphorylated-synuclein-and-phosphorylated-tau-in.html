        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"210\" cy=\"141\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"670\" cy=\"250\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Gripp miyada iz qoldiradi:&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;LRRK2 mutatsiyasi oqsil&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;o‘zgarishlarini qanday&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qo‘zg‘atadi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in-f1.jpg\" alt=\"1-rasm. Lrrk2G2019S allellari A gripp virusi (H1N1) burniga yuborilgan sichqonlarning omon qolish darajasini, vazn o'zga\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. Lrrk2G2019S allellari A gripp virusi (H1N1) burniga yuborilgan sichqonlarning omon qolish darajasini, vazn o'zgarishini yoki o'pka virusli titrlarini o'zgartirmaydi. Ushbu tadqiqotda qo'llanilgan eksperimental vaqt jadvali (A). Yetuk sichqonlarga (urg'ochi va erkak; yoshi 5-7 hafta) A gripp virusining (H1N1 serotipi) 2 x teshik hosil qiluvchi birliklari (PFU) burun orqali yuborildi. Omon qolish darajasi emlashdan keyingi kunlarga nisbatan omon qolish foizi sifatida grafik tarzda ko'rsatilgan (B, E), vazn esa emlashdan keyingi kunlarga nisbatan dastlabki tana vaznining foizi sifatida ko'rsatilgan (C, F). Ma'lumotlar urg'ochi (B-D) va erkak (E-G) sichqonlar uchun alohida ko'rsatilgan. Virusli titrlar emlashdan keyingi 3-kuni o'pkada o'lchandi (D, G). Har bir belgi bitta hayvonni bildiradi. Xato chiziqlari o'rtacha ± SEM ni bildiradi. WT = yovvoyi tip; GS = Lrrk2G2019S mutant alleli. Qo'llanilgan statistik testlar: omon qolish egri chiziqlari uchun log-rank (Mantel-Cox) testi; virusli titr tahlillari uchun bir tomonlama ANOVA.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Parkinson kasalligiga genetik moyilligi bor odamlarning ba'zilarida alomatlar namoyon bo‘lib, boshqalarda bilinmasligining sababi nimada? Tadqiqotchilar bunga infeksiyalar kabi tashqi omillar turtki bo‘lishini taxmin qilishdi. Sichqonlar ustida o‘tkazilgan tajriba gripp infeksiyasi LRRK2 genidagi mutatsiya fonida miya to‘qimalarida oqsillar to‘planishiga olib kelishini ko‘rsatdi. Bu topilma neyrodegenerativ kasalliklarning rivojlanish mexanizmini tushunishga yordam beradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;LRRK2 mutatsiyalari sichqonlarda o‘tkir gripp og‘irligini o‘zgartirmaydi&lt;/li&gt;\n&lt;li&gt;Grippdan olti hafta o‘tgach miyada pSer129 alfa-sinuklein miqdori ortadi&lt;/li&gt;\n&lt;li&gt;Infeksiya miyada oksidlovchi stress va oqsil modifikatsiyasini kuchaytiradi&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;LRRK2 genidagi mutatsiyalar Parkinson kasalligi xavfini oshiradi, biroq kasallik barcha tashuvchilarda ham rivojlanavermaydi. Avvalroq olimlar patologiya yuzaga kelishi uchun virusli infeksiya kabi qo‘shimcha tashqi ta'sir kerakligini taxmin qilishgan edi. Tadqiqotchilar guruhi LRRK2 mutatsiyasiga ega (shu jumladan kinaza faolligi oshgan p.G2019S varianti) sichqonlarni H1N1 gripp virusi bilan zararlab, ushbu gipotezani tekshirib ko‘rdi.&lt;/p&gt;\n&lt;p&gt;Infeksiyaning o‘tkir fazasi va hayvonlarning omon qolish darajasi o‘rtasida farq bo‘lmagan bo‘lsa-da, olti hafta o‘tgach o‘tkazilgan tahlil xavotirli o‘zgarishlarni aniqladi. Gomozigotli LRRK2 p.G2019S mutatsiyasiga ega tirik qolgan sichqonlarning miyasida fosforillangan alfa-sinuklein (pSer129) va tau-oqsil (pSer199) miqdori oshgani aniqlandi. Shuningdek, miya proteomida oksidlovchi stress belgilari ortgani qayd etildi.&lt;/p&gt;\n&lt;p&gt;Olingan natijalar nafas yo‘llari virusli infeksiyasi genetik zaif organizmlarda miya proteomini o‘zgartirishga qodirligini ko‘rsatadi. Bu periferik infeksiyalarning neyrodegenerativ jarayonlarni boshlashdagi rolini tushuntirishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot faqat hayvonlar modeli va bitta virus shtammi asosida bajarilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Gripp virusi ta'siri parkinsonizm chastotasini oshiradi. Oldinroq biz va boshqa tadqiqotchilar Parkinsonga bog'langan LRRK2 lokusidagi allel variantlar xo'jayinning virulent mikroblarga qarshi javoblarini modulyatsiya qilishini aniqlagan edik.&lt;/p&gt;\n&lt;p&gt;Biz Lrrk2 mutatsiyalari burun orqali yuqtirilgan o'pka infeksiyasidan keyin yetuk hayvonlarda kasallik natijalarini o'zgartirishini o'rganib chiqdik.&lt;/p&gt;\n&lt;p&gt;Biz mutant knock-in Lrrk2 genotiplariga ega C57BL/6J sichqonlarini H1N1 serotipli gripp virusi bilan (1 × LD₅₀ = 2000 ta pletka hosil qiluvchi birlik) emladik.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Knock-in — bu tabiiy sharoitda ularning ta'sirini o'rganish uchun ma'lum bir gendan uning mutant analogi (bu holda Lrrk2 variantlari) foydalanib almashtiriladigan genetik muhandislik usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;H1N1 keltirib chiqargan pnevmoniya davrida na kinaz faolligini oshiruvchi Lrrk2G2019S, na kinazi o'lik Lrrk2D1994S mutatsiyalarining gomoziygot, na geteroziygot shakllari yovvoyi turdagi nasl bilan solishtirganda sichqonlardagi kasallik kechishini o'zgartirmadi; bu ikkala jinsdagi omon qolish darajasi, virus titrlari va tana vaznining o'zgarishi asosida aniqlandi. Biroq, emlashdan olti hafta o'tgach, H1N1 ta'siriga uchragan gomoziygot Lrrk2 p.G2019S hayvonlarining miyasida soxta davolangan mutant sichqonlarga nisbatan yuqoriroq pSer129 α-sinuklein va pSer199 tau darajalari kuzatildi (P &amp;lt; 0.01). Fosforillangan tau va umumiy tau hamda fosforillangan α-sinuklein va umumiy α-sinuklein nisbatlari ham H1N1 ta'siriga uchragan Lrrk2 p.G2019S sichqonlarida oshdi (P &amp;lt; 0.05). Qolaversa, biz Lrrk2G2019S omon qolganlarida miya proteomining nitrotirozinlanishi soxta ta'sirga uchragan qardoshlarga nisbatan sezilarli darajada oshganini aniqladik (P &amp;lt; 0.05). Miya H₂O₂ konsentratsiyalari H1N1 bilan emlangan erkak yovvoyi turdagi hayvonlarda yuqori bo'lgan (urg'ochilar va Lrrk2G2019S sichqonlarida ham shunday tendensiya kuzatilgan), bu effekt kinazi o'lik Lrrk2D1994S sichqonlarida bartaraf etilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Hayot uchun xavfli pnevmotrop RNK virusi infeksiyasini boshdan kechirgan gomoziygot Lrrk2G2019S sichqonlarida olti haftadan so'ng pSer129 α-sinuklein, pSer199 tau va oksidlovchi stress darajalari oshgani aniqlandi (P &amp;lt; 0.05 – P &amp;lt; 0.01).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Hayot uchun xavfli pnevmotrop RNK virusi infeksiyasidan omon qolgan gomoziygot Lrrk2G2019S-mutant sichqonlar miyadagi oksidlovchi stress, pSer199 tau va pSer129 α-sinuklein darajalarida o'zgarishlarni ko'rsatadi. Ushbu natijalar odamlarda neyrodegeneratsiyaga bog'liq o'zgarishlarning boshlanishiga aloqador bo'lishi mumkin va LRRK2 mutantlarining penetratsiya darajasi hamda ekspressivligidagi farqlarni tushuntirishga yordam berishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot sichqon modellarida o'tkazilgan bo'lib, kuzatilgan biokimyoviy o'zgarishlar ularning inson Parkinson kasalligi patogeneziga taalluqliligini baholash uchun qo'shimcha klinik tasdiqlashni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Parkinson kasalligi (PK) murakkab neyrodegenerativ kasallik bo'lib, uning tarqalishi ortib bormoqda, ammo kasallik etiologiyasi hozircha noma'lumligicha qolmoqda. Taxmin qilinishicha, PK genetik xavf, tashqi muhit omillari va qarishning o'zaro murakkab ta'siri natijasida yuzaga keladi. Atrof-muhitning bir nechta xavf omillari aniqlangan, jumladan neyrotrop bo'lmagan virusli infektsiyalar. Masalan, gripp A serotipi H1N1 varianti keltirib chiqargan gripp pandemiyasi fon Economo ensefalitining, shu jumladan infektsiyadan keyingi parkinsonizm bilan bog'liq shaklining keyingi paydo bo'lishi bilan bog'liq edi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Virusli infektsiyalar va parkinsonizm o'rtasidagi kuzatilgan klinik bog'liqliklar asosan epidemiologik xarakterga ega bo'lib, odamlarda to'g'ridan-to'g'ri sabab-oqibat bog'liqligini isbotlamaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Yaqinda o'tkazilgan tadqiqotlarda gripp bilan kasallanganlik anamnezi ijobiy bo'lishi (o'n besh yilgacha bo'lgan davrda) PK kasalligining o'sishi bilan bog'liqligi aniqlandi. Sichqonlarda yuqori patogenli qush grippi H1N1 serotipi (neyrotrop virus) bilan burun bo'shlig'i orqali infektsiyalash yovvoyi turdagi sichqonlarning miyasida α-sinukleinning fosforillanishi va agregatsiyasiga, shuningdek, dofaminergik hujayralarning yo'qolishiga olib keldi. Qolaversa, H1N1 ex vivo sharoitida α-sinuklein darajasini oshirishi ko'rsatildi, bu holat grippga qarshi preparat bilan oldindan ishlov berish orqali bartaraf etildi.&lt;/p&gt;\n&lt;p&gt;Tashqi muhit xavf omillaridan tashqari, PK xavfining o'zgarishi bilan bog'liq 90 dan ortiq lokuslar aniqlangan, jumladan LRRK2 genidagi mutatsiyalar, ular ixtisoslashgan klinikalarda qayd etilgan parkinsonizm holatlarining taxminan 2% ini tashkil qiladi. Ushbu gendagi mutatsiyalar oilaviy va sporadik PK shakllari uchun xavf tug'diradi, garchi mexanizmlari hali ham noma'lum. Shuni ta'kidlash kerakki, LRRK2 mutatsiyalari, jumladan eng keng tarqalgan p.G2019S varianti uchun to'liq bo'lmagan penetrantlik xosdir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Penetrantlik — mutant genning fenotipda namoyon bo'lish chastotasi bo'lib, to'liq bo'lmagan penetrantlik mutatsiyaning mavjudligi har doim ham kasallik rivojlanishiga olib kelmasligini bildiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bu bizga LRRK2 mutatsiyasini tashiydiganlarda kasallikning namoyon bo'lishi ikkinchi qo'zg'atuvchini — genetik yoki ekologik omilni talab qilishi mumkinligini ko'rsatdi; biz va boshqa tadqiqotchilar oxirgi omil mikrobial tabiatga ega bo'lishi mumkinligini taxmin qildik. Muhimi, LRRK2 lokusidagi mutatsiyalar Kron kasalligi, moxov va tizimli qizil yuguruk bilan ham bog'langan. Ushbu kasalliklarning har biri surunkali buzilgan yallig'lanish jarayonlari bilan tavsiflanadi. To'rt xil kasallik uchun umumiy xavf lokusining mavjudligi LRRK2 ning evolutsion saqlanib qolgan funktsiyasiga immun javoblarini regulyatsiya qilish kirish yoki kirmasligi masalasini ko'taradi.&lt;/p&gt;\n&lt;p&gt;LRRK2 geni bosh miyaga qaraganda periferiyada (masalan, ilik, o'pka) yuqoriroq darajada ekspressiya qilinadi va neyronlarga qaraganda immun tizimi hujayralarida (neytrofillar, monotsitlar va makrofaglarda) ko'proq uchraydi. Bundan tashqari, mazkur oqsil yuqumli patogenlar va yallig'lanish mediatorlari (masalan, IFN-γ va NF-κB) ta'sirida kuchayishi mumkin, bu esa LRRK2 ning patogenlardan himoya qilish va immun tizimi javoblarida qatnashishidan dalolat beradi. Bir nechta tadqiqotlar LRRK2 ning bakterial patogenlikka ta'sirini mikroblarga bog'liq holda namoyish etdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ushbu tadqiqot C57BL/6J liniyasidagi yetuk sichqonlarda LRRK2 variantlarining o'pka infektsiyasiga va gripp virusi keltirib chiqaradigan miya patologiyasiga ta'sirini baholadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz ilgari virusli infektsiyalarga javoban LRRK2 ning rolini ham o'rgangan edik; o'shanda biz reovirus [isotip type-3 Dearing (T3D)] bilan burun bo'shlig'i orqali infektsiyalangan yosh sichqonlarda kasallik natijalari LRRK2 ning allel variantlariga jinsga bog'liq holda ta'sir qilishini ko'rsatgan edik. Ushbu ishda biz LRRK2 allel variantlari yetuk C57BL/6J sichqonlarida potentsial o'limga olib keladigan o'pka infektsiyasining borishini o'zgartira olishini va pnevmotrop RNK virusi ta'siridan keyin har qanday miya patologiyasini yuzaga chiqarishini tekshirdik. Biz LRRK2 ning kinaz-giperfaol varianti o'pkada virus replikatsiyasini kamaytirishi va yetuk hayvonlarda omon qolish ko'rsatkichlarini o'zgartirishi mumkin degan gipotezani ilgari surdik. Qolaversa, ushbu infektsiya tirik qolgan hayvonlarda neyrokimyoviy markerlarning o'zgarishiga olib kelishi mumkinligini taxmin qildik. Buni tekshirish uchun biz yovvoyi turdagi va LRRK2 nok-in mutant sichqonlarda pnevmonitni keltirib chiqarish uchun sichqonlarga moslashtirilgan gripp A virusi, H1N1 serotipi (A/Fort Monmouth/1/1947) dan foydalandik. Biz LRRK2 p.G2019S ham, p.D1994S ham o'tkir kasallik natijalarini o'zgartirmaganini aniqladik. Shunga qaramay, H1N1 gripp infektsiyasini boshdan kechirib omon qolgan gomozigotli LRRK2 p.G2019S hayvonlarning miyasida o'zlarining bir uyadagi nazorat guruhidagi hayvonlarga nisbatan oksidlovchi stress darajasining oshishi hamda α-sinuklein va tau metabolizmida o'zgarishlar kuzatildi.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"lrrk2-pg2019s-sichqonlari-h1n1-pnevmoniti-davrida-wild-type-sichqonlari-bilan-bir-xil-kasallik-kechishini-korsatadi\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#lrrk2-pg2019s-sichqonlari-h1n1-pnevmoniti-davrida-wild-type-sichqonlari-bilan-bir-xil-kasallik-kechishini-korsatadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Lrrk2 p.G2019S sichqonlari H1N1 pnevmoniti davrida wild-type sichqonlari bilan bir xil kasallik kechishini ko'rsatadi&lt;/span&gt;&lt;/a&gt;Lrrk2 p.G2019S sichqonlari H1N1 pnevmoniti davrida wild-type sichqonlari bilan bir xil kasallik kechishini ko'rsatadi&lt;/h4&gt;\n&lt;p&gt;Biz birinchi navbatda Lrrk2G2019S va wild-type nasldosh sichqonlarida neyrotrop bo'lmagan virus yordamida xo'jayin javoblarida kuchaytirilgan Lrrk2 kinaza faolligining rolini o'rgandik (1-rasm). Gripp A virusi, H1N1 serotipi (FM-MA shtammi) o'pka tropizmiga ega bo'lib, sichqonlarda ma'lum dozalarda o'limga olib keladigan pnevmoniyani keltirib chiqarishi mumkin. Shuni ta'kidlash kerakki, Lrrk2 o'pkada yuqori darajada ekspressiya qilinadi. Yosh 5–7 haftalik kattalar sichqonlariga oldindan belgilangan LD50 doza (2× 10³ PFU) burun orqali kiritildi; hayvonlar o'pka virus titrini tahlil qilish uchun 3dpi da o'ldirildi yoki omon qolish uchun baholandi, keyinchalik omon qolganlar katta yoshga yetkazildi (1a-rasm). Omon qolish darajasi va vazni urg'ochi (1b, c-rasm) va erkak (1e, f-rasm) hayvonlarda 14dpi gacha o'lchandi. Urg'ochi sichqonlar odatda erkaklarnikiga qaraganda yuqori o'lim darajasini ko'rsatdi, bu C57BL/6J sichqonlarida H1N1 ning turli shtammlaridan foydalangan oldingi hisobotlarga mos keladi. Biroq, biz wild-type nasldoshlariga nisbatan Lrrk2 p.G2019S knock-in sichqonlarining omon qolishida hech qanday farqni aniqlamadik. Xuddi shunday, kasallik va tiklanishning surrogate belgilari bo'lib xizmat qilgan dastlabki vazn yo'qotish yoki keyingi vazn ortishida genotiplar (va mutant allel soni) o'rtasida sezilarli farqlar yo'q edi. H1N1 infeksiyasining uchinchi natijasi sifatida biz alohida guruhda infeksiyaning cho'qqisida, ya'ni 3dpi da o'pkadagi virus titrini o'lchadik. Garchi biz gomozigota Lrrk2G2019S urg'ochi sichqonlarida pastroq titrlarga nisbatan tendentsiyani kuzatgan bo'lsak ham (buni chaqaloqlardagi reovirus T3D natijalaridan kutgan edik), mos keladigan erkaklarda titrlarning katta o'zgaruvchanligi kuzatildi. Umuman olganda, 3dpi da virus titrlari uchun genotiplar o'rtasida sezilarli farqlar hisoblanmadi (1d, g-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Lrrk2 p.G2019S mutatsiyasi H1N1 infeksiyasi paytida omon qolish, tana vazni dinamikasi va 3dpi da o'pka virus titrlariga ta'sir ko'rsatmaydi.&lt;br /&gt;\n[!tip] PFU (blyashka hosil qiluvchi birliklar) tirik virus miqdorini aniqlash uchun ishlatiladigan birlikdir, LD50 esa 50% hayvonlarning o'limiga olib keladigan dozadir.&lt;br /&gt;\n[!warning] Tadqiqot C57BL/6J sichqonlarida olib borildi va urg'ochilarning o'lim darajasi yuqori bo'lgani sababli jinsiy farqlarni hisobga olish kerak.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"h1n1-infeksiyasiga-qarshi-otkir-xojayin-himoyasi-uchun-lrrk2-kinaza-faolligi-talab-qilinmaydi\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#h1n1-infeksiyasiga-qarshi-otkir-xojayin-himoyasi-uchun-lrrk2-kinaza-faolligi-talab-qilinmaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;H1N1 infeksiyasiga qarshi o'tkir xo'jayin himoyasi uchun Lrrk2 kinaza faolligi talab qilinmaydi&lt;/span&gt;&lt;/a&gt;H1N1 infeksiyasiga qarshi o'tkir xo'jayin himoyasi uchun Lrrk2 kinaza faolligi talab qilinmaydi&lt;/h4&gt;\n&lt;p&gt;Biz giperaktiv kinaza p.G2019S mutatsiyasi tomonidan ta'minlangan omon qolishning hech qanday modulyatsiyasini aniqlamaganimiz sababli, yangi tug'ilgan chaqaloqlarda reovirus-T3D ga javoban ko'rganimizdek, Lrrk2 faolligining yo'qolishi H1N1 infeksiyasining kasallik natijalariga ta'sir qilishini o'rgandik. Yuqoridagi kabi yondashuvdan foydalanib, biz Lrrk2 kinaza-faol bo'lmagan p.D1994S knock-in mutatsiyasini tashiydigan sichqonlarga inokulyatsiya qildik. Biz H1N1 infeksiyasidan keyin ham erkak, ham urg'ochi Lrrk2D1994S gomozigota va heterozigota sichqonlari wild-type sichqonlari kabi bir xil omon qolish darajasi va vazn o'zgarishlarini ko'rsatishini aniqladik (S1a, b, d, e-rasmlar). Qo'shimcha tekshirish uchun biz ushbu sichqonlarning o'pkasida 3dpi da H1N1 virus titrlarini o'lchadik va yana wild-type, heterozigota va gomozigota Lrrk2 p.D1994S hayvonlari o'rtasida guruh farqlarini aniqlamadik (S1c, f-rasmlar). Ushbu umumiy natijalar bizga Lrrk2 kinaza faolligining o'zi H1N1 pnevmonitining o'tkir fazasida kattalar sichqonlarining javobida sezilarli ta'sir ko'rsatmaganligini ko'rsatdi.&lt;/p&gt;\n&lt;h4 id=\"h1n1-dan-omon-qolganlarda-miyada-virus-oqsili-ekspresiyasining-dalillari-yoq\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#h1n1-dan-omon-qolganlarda-miyada-virus-oqsili-ekspresiyasining-dalillari-yoq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;H1N1 dan omon qolganlarda miyada virus oqsili ekspresiyasining dalillari yo'q&lt;/span&gt;&lt;/a&gt;H1N1 dan omon qolganlarda miyada virus oqsili ekspresiyasining dalillari yo'q&lt;/h4&gt;\n&lt;p&gt;Keyinchalik biz omon qolgan sichqonlarda H1N1 virusi ta'sirining miyaga keyingi ta'sirini va Lrrk2G2019S knock-in mutatsiyasiga bog'liq bo'lishi mumkin bo'lgan har qanday ta'sirni tekshirdik. H1N1 infeksiyasidan omon qolgan gomozigota sichqonlar avvaliga qo'shimcha to'rt hafta davomida jami 6wpi gacha saqlansin (1a-rasm). Keyin biz H1N1 va soxta inokulyatsiya qilingan (mock) hayvonlarning gogenatlarini quyonlarning anti-H1N1 immun zardobi yordamida Western blotting orqali tekshirdik. 3dpi da infeksiyalangan o'pkadan ijobiy nazorat sifatida foydalanib, biz omon qolgan sichqonlar kohortasining miyasida hech qanday virusli H1N1 oqsillarini, ya'ni nukleoprotein NP va matritsa oqsili M1 ni aniqlamadik (ma'lumotlar ko'rsatilmagan), bu kutilganidek, ushbu sharoitda miyada H1N1 aniqlanmaganligini ko'rsatadi.&lt;/p&gt;\n&lt;h4 id=\"h1n1-infeksiyasidan-keyin-lrrk2-pg2019s-mutant-miyasida-fosforillangan-tau-oqsili-ortadi\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#h1n1-infeksiyasidan-keyin-lrrk2-pg2019s-mutant-miyasida-fosforillangan-tau-oqsili-ortadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;H1N1 infeksiyasidan keyin Lrrk2 p.G2019S mutant miyasida fosforillangan tau oqsili ortadi&lt;/span&gt;&lt;/a&gt;H1N1 infeksiyasidan keyin Lrrk2 p.G2019S mutant miyasida fosforillangan tau oqsili ortadi&lt;/h4&gt;\n&lt;p&gt;Gripp A (H1N1) virusi pandemiyasi qurbonlarida parkinsonizmning post-ensefalitik holatlarida oldin bajarilgan miya otopsiyalari tauopatiya belgilarini aniqladi. Shuni ta'kidlash kerakki, LRRK2 bilan bog'liq PD holatlarida kuzatilgan miya patologiyasi o'zgaruvchan bo'lib, o'z ichiga alfa-sinuklein agregatlari, fosforillangan tau bilan bog'liq patologiya, qo'shilmasiz neyronlarning yo'qolishi yoki aralash patologiyalarni oladi. Shuning uchun biz avval jami tau miqdorini, so'ngra H1N1 bilan kasallanganlar va mock bilan davolangan hayvonlar o'rtasida 6wpi da ELISA yordamida jami miya homogenatlarining erkin fraksiyasida fosforillangan tau (pSer199 tau) darajasini o'lchadik (2a-c-rasmlar). Ushbu lizatlarda jami tau ni o'lchaganda, biz infeksiya yoki mutatsiyaga bog'liq ravishda (2a-rasm) yoki jinsga bog'liq holda (S2a, 3a-rasmlar) farqni kuzatmadik. PSer199 tau miqdorini aniqlashda ikki omilli dispersiya tahlili (ANOVA) sezilarli infeksiya x genotip o'zaro ta'sirini aniqladi (F(1, 23)=5.418, P=0.0291; 2b-rasm). Bu yerda pSer199 tau mock bilan davolinlangan mutant sichqonlarga nisbatan infeksiyalangan Lrrk2 p.G2019S sichqonlarida sezilarli darajada oshgan (P=0.0099), bu ta'sir wild-type sichqonlarida yo'q edi. Keyinchalik biz ushbu namunalarda fosforillangan tau va jami tau oqsilining nisbatini hisobladik (2c-rasm), bu yerda mock bilan davolangan mutant sichqonlarga nisbatan infeksiyalangan, Lrrk2 p.G2019S-mutant hayvonlarda sezilarli o'sishni aniqladik. H1N1 bilan kasallangan mutant sichqonlar ham infeksiyalangan wild-type sichqonlariga nisbatan sezilarli darajada yuqori nisbatni ko'rsatdi (P&amp;lt;0.05; 2c-rasm). Ikki omilli ANOVA oxirgi nisbat uchun ahamiyatga ega tendentsiyani aniqladi (P=0.0521). Ushbu topilmalar erkin pSer199 tau konsentratsiyasi H1N1 infeksiyasidan keyin miyada ko'tarilganligini ko'rsatdi, bu gomozigota Lrrk2G2019S knock-in mutatsiyasining ekspressiyasiga bog'liq edi. PSer199 tau uchun mos keladigan kinaza bo'lgan GSK3β uchun bir xil homogenatlarni tekshirganda (faol va faol bo'lmagan shakllari Western blotting orqali tekshirildi), natijalar hech qanday infeksiya, jins yoki mutatsiyaga bog'liq ta'sirni ko'rsatmadi (ma'lumotlar ko'rsatilmagan). Hozirgacha biz boshqa tau kinazlarini tekshirmadik.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;H1N1 infeksiyasi Lrrk2 p.G2019S knock-in sichqonlari miyasida 6wpi da pSer199 tau darajasining sezilarli oshishiga olib keladi (P=0.0291).&lt;br /&gt;\n[!tip] ELISA — bu antikorlar yordamida oqsillarni miqdoriy aniqlash usuli, ikki omilli ANOVA esa ikkita mustaqil o'zgaruvchining ta'sirini baholaydi.&lt;br /&gt;\n[!warning] PSer199 tau darajasining oshishi faqat sichqoncha modelida kuzatildi va miyada virus oqsillari aniqlanmadi, shuning uchun uni inson patologiyasiga to'g'ridan-to'g'ri ko'chirishda ehtiyot bo'lish kerak.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"h1n1-infeksiyasidan-keyin-lrrk2-pg2019s-mutant-miyasida-fosforillangan-a-sinuklein-ortadi\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#h1n1-infeksiyasidan-keyin-lrrk2-pg2019s-mutant-miyasida-fosforillangan-a-sinuklein-ortadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;H1N1 infeksiyasidan keyin Lrrk2 p.G2019S mutant miyasida fosforillangan α-sinuklein ortadi&lt;/span&gt;&lt;/a&gt;H1N1 infeksiyasidan keyin Lrrk2 p.G2019S mutant miyasida fosforillangan α-sinuklein ortadi&lt;/h4&gt;\n&lt;p&gt;Keyinchalik biz xuddi shu hayvonlarda α-sinuklein metabolizmini o'rgandik (Rasm 2d-f). Biz avvalroq reovirus (T3D) bilan kasallangan yangi tug'ilgan sichqonlarning miyasida Lrrk2G2019S-ga bog'liq ravishda umumiy α-sinuklein ko'payishini kuzatgan edik. Shuning uchun biz omon qolgan urg'ochi va erkak hayvonlarning butun miya gomogenatlarining vestern-blotting va ELISA tahlillarini o'tkazdik, umumiy sinuklein va pSer129 α-sinuklein darajasini aniqladik. Ikki omilli dispersiya tahlili mutant urg'ochilarning miyasida oldingi H1N1 infeksiyasining umumiy α-sinukleinga ta'sirini ko'rsatdi (F(1, 8)=7.32, P=0.0268, Rasm SN 3d), lekin erkaklarda yo'q (Rasm SN 2d); shunga qaramay, jinslar birlashtirilganda infeksiya ta'siri ahamiyatli bo'lib qoldi (P=0.0474) (Rasm 2d).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in-f2.jpg\" alt=\"2-rasm. Lrrk2 p.G2019S ekspresiyasi H1N1 gripp pnevmoniyasidan keyin sichqonlarning miyasida tau va alfa-sinuklein metab\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm. Lrrk2 p.G2019S ekspresiyasi H1N1 gripp pnevmoniyasidan keyin sichqonlarning miyasida tau va alfa-sinuklein metabolizmini, shuningdek oksidlovchi stressni o'zgartiradi. Soxta (H1N1 -) va H1N1 bilan kasallangan (H1N1 +) yetuk sichqonlar (erkak va urg'ochilari ko'rsatilgan; yoshi 5-7 hafta) emlashdan keyingi 14 kundan ortiq yashab qolgan va qo'shimcha 4 hafta davomida saqlanib, miyasi yig'ib olingan. Ustunli diagrammalar umumiy tau oqsili (A), fosforillangan tau (pSer199) (B), fosforillangan tau ning umumiy tau darajasiga nisbati (C); umumiy alfa-sinuklein (ELISA yordamida bajarilgan; D), fosforillangan alfa-sinuklein (pSer129) (E) va fosforillangan alfa-sinukleinning umumiy alfa-sinuklinga nisbatini (ikkalasi ham Western blotting yordamida bajarilgan; F) ko'rsatadi. Ikki alohida sichqonlar guruhida H2O2 darajalari (G, H). Miyaning oqsil nitrotirozinlanish miqdori (I) (H2O2 va nitrotirozinlanish o'lchovlari miya vazniga nisbatan ko'rsatilgan). Har bir belgi bitta hayvonni bildiradi. Xato chiziqlari o'rtacha ± SEM ni bildiradi. WT = yovvoyi tip; GS = Lrrk2 p.G2019S mutant sichqonlari; DS = Lrrk2 p.D1994S mutant sichqonlari. Statistik tahlil: tuzatilmagan Fisher LSD post-hoc testi bilan ikki tomonlama ANOVA. P-qiymat &amp;lt;0.05 (&lt;/em&gt;), P-qiymat &amp;lt;0.01 (&lt;strong&gt;), P-qiymat &amp;lt;0.001 (&lt;/strong&gt;&lt;em&gt;), P-qiymat &amp;lt;0.0001 (&lt;/em&gt;**&lt;em&gt;).&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kasallikni boshdan kechirgan mutant sichqonlarda pSer129 α-sinuklein darajasining oshishi kuzatildi (P=0.0037), bunda urg'ochilarda yuqori ko'rsatkichlar hatto boshlang'ich holatda ham qayd etilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bundan tashqari, biz omon qolgan hayvonlarda pSer129 α-sinuklein darajasining oshishini aniqladik (Rasm 2e). Ikki omilli dispersiya tahlili sezilarli genotip effektini (F(1, 20)=54.73, P&amp;lt;0.0001), sezilarli infeksiya effektini (F(1, 20)=10.76, P=0.0037) va sezilarli genotip × infeksiya o'zaro ta'sirini (F(1, 20)=6.186, P=0.0218) ko'rsatdi, bu asosan urg'ochi hayvonlar hisobiga yuzaga kelgan (Rasm SN 3e). Qizig'i shundaki, Lrrk2 p.G2019S urg'ochi sichqonlari boshlang'ich darajada miyada yuqori pSer129 α-sinukleinni ko'rsatdi (Rasm SN 3e).&lt;/p&gt;\n&lt;p&gt;Fosforillangan va umumiy α-sinuklein darajalarining nisbatini hisoblaganimizda, juft solishtirishlar bo'yicha infksiyalangan yovvoyi turdagi hayvonlarga nisbatan infksiyalangan mutant sichqonlarda yuqori nisbatni aniqladik (P&amp;lt;0.05) (Rasm 2f), bu birinchi navbatda erkaklarda kuzatildi (Rasm SN 2f); ikki omilli dispersiya tahlili bu o'zaro ta'sirning ahamiyatliligini ko'rsatdi (P=0.0381). Ushbu natijalar bizga H1N1 pnevmoniyasi omon qolgan gomozigotali Lrrk2 p.G2019S hayvonlarning miyasida eruvchan, fosforillangan α-sinukleinning disregulyatsiyasiga olib kelishi mumkinligini taxmin qildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Vestern-blotting va ELISA biologik namunalardagi oqsil miqdori va ularning o'zgarishlarini aniq o'lchashga imkon beruvchi laboratoriya usullaridir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Polosimon kinaza-2 (Plk2) bir nechta guruhlar, jumladan bizning guruhimiz tomonidan ham α-sinukleinni Ser129 da fosforillash uchun mos ferment sifatida aniqlanganligini hisobga olib, biz uni vestern-blotting yordamida miya lizatlarida ham tekshirdik. Biz boshlang'ich darajada mutant urg'ochilarning miyasida Plk2 oqsilining sezilarli darajada oshishini kuzatdik (P&amp;lt;0.05) (Rasm SN 3g), bu yovvoyi turdagi hayvonlarda oldingi H1N1 infeksiyasi tufayli yanada og'irlashdi; bu ta'sir jinslar birlashtirilganda kuzatilmadi (ma'lumotlar keltirilmagan). Kelgusidagi ishlar H1N1 pnevmoniyasini boshdan kechirgan hayvonlarning miyasida Plk2 fermentining faolligi (yoki pSer129 α-sinukleinning defosforillanishi) o'zgarganligini aniqlaydi.&lt;/p&gt;\n&lt;h4 id=\"h1n1-pnevmoniti-lrrk2-pg2019s-sichqonlarining-bosh-miyasida-oksidlovchi-stressning-kuchayishiga-olib-keladi\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#h1n1-pnevmoniti-lrrk2-pg2019s-sichqonlarining-bosh-miyasida-oksidlovchi-stressning-kuchayishiga-olib-keladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;H1N1 pnevmoniti Lrrk2 p.G2019S sichqonlarining bosh miyasida oksidlovchi stressning kuchayishiga olib keladi&lt;/span&gt;&lt;/a&gt;H1N1 pnevmoniti Lrrk2 p.G2019S sichqonlarining bosh miyasida oksidlovchi stressning kuchayishiga olib keladi&lt;/h4&gt;\n&lt;p&gt;Biz keyinchalik uch xil gomozigotali genotipga ega omon qolgan hayvonlarning bosh miyasidagi oksidlovchi stress darajasini ikki kogorta taqqosida o'lchadik (Rasm 2g, h). H1N1 bilan kasallangan va omon qolgan sichqonlarning gomogenatlaridagi H₂O₂ konsentratsiyasi Amplex® Red tahlili yordamida aniqlandi. U yerda biz ikki omilli dispersiya tahlili (ANOVA) yordamida yovvoyi turdagi va Lrrk2 p.G2019S hayvonlar kogortasida pnevmonitning H₂O₂ darajasiga ta'sirini aniqladik, xususan, kasallangan erkak yovvoyi turdagi sichqonlar va soxta davolangan sichqonlar o'rtasida (F(1, 12)=10,20, P=0,0077) (Rasm Qoshimcha 2h); biroq ushbu kogortadagi boshqa taqqoslashlar uchun sezilarli farq topilmadi (Rasm 2g).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;H1N1 infektsiyasi miyada vodorod peroksid va oqsil nitroksilanishini oshiradi, Lrrk2 p.G2019S mutatsiyasiga ega erkaklarda esa bu o'zgarishlar virusning to'g'ridan-to'g'ri neyrotropizmi bo'lmasa ham yaqqol namoyon bo'ladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;H₂O₂ konsentratsiyalarini alohida kogortada o'lchaganimizda, bunda yovvoyi turdagi sichqonlarni Lrrk2 p.D1994S kinaz-faol bo'lmagan mutant sichqonlari bilan taqqoslagan edik, biz yana erkak yovvoyi turdagi sichqonlarda sezilarli farqni kuzatdik (F(1, 18)=7,869, P=0,0117) (Rasm 2h; Rasm Qoshimcha 1g, h). Post-hoc tahlilida, oldingi H1N1 infektsiyasi soxta davolangan hayvonlarga nisbatan yovvoyi turdagi hayvonlarda sezilarli darajada yuqori H₂O₂ darajasiga olib keldi (P=0,0087); miyadagi H₂O₂ miqdorining oshish tendentsiyasi infektsiyaga bog'liq ravishda ham urg'ochi, ham erkak Lrrk2 p.G2019S-mutant sichqonlarida kuzatildi (Rasm 2g; Rasm Qoshimcha 2h, 3h). Qizig'i shundaki, H1N1 ta'sir qilgan, kinaz-faol bo'lmagan Lrrk2 p.D1994S hayvonlarining miyasida H₂O₂ konsentratsiyasining oshishi aniqlanmadi (Rasm 2h; Rasm Qoshimcha 1g, h).&lt;/p&gt;\n&lt;p&gt;Oksidlovchi stressning ikkilamchi o'lchovi sifatida biz H1N1 bilan kasallangan sichqonlarning miyasidan olingan oqsil ekstraktlarida 6wpi da qaytarib bo'lmaydigan oqsil nitrotirozinlanishini tekshirdik (Rasm 2i). Vestern-blotting va densitometriya yordamida biz barcha urg'ochilarda H1N1 ta'sirining oqsil nitrotirozinlanishiga sezilarli ta'sirini aniqladik (F(1, 8)=13,34, P=0,0065) (Rasm Qoshimcha 3i). Erkaklardagi tegishli darajalarni tahlil qilganda, ikki omilli ANOVA infektsiya (F(1, 8)=8,484, P=0,0195) va genotip (F(1, 8)=13,62, P=0,0061) uchun sezilarli ta'sirlarni ko'rsatdi (Rasm Qoshimcha 2i).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Vestern-blotting — oqsillarni o'lchami bo'yicha ajratish va maxsus antikorlar yordamida aniqlash usuli, densitometriya esa miqdoriy baholash uchun bantlar intensivligini o'lchaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Post-hoc tahlillari tasdiqladiki, H1N1 ta'sir qilgan erkak Lrrk2 p.G2019S sichqonlari soxta davolangan mutant hayvonlarga va emlangan yovvoyi turdagi sichqonlarga qaraganda yuqori nitrotirozinlanish darajasini o'z ichiga olgan. Yaqinda ikkita guruh, jumladan bizning guruhimiz, NADPH oksidaza-2 (NOX2) faolligini oshirishda Lrrk2 p.G2019S ning rolini aniqladi, bu maxsus immun hujayralari tomonidan ROS ishlab chiqarishning portlashiga olib keladi; shuning uchun biz shuningdek uning faol kompleksi tarkibidagi NOX2 kichik birligi p47phox ni o'rgandik, uni oldin neytrofillarda Lrrk2 p.G2019S tomonidan giper-fosforillanganligini aniqlagan edik.&lt;/p&gt;\n&lt;p&gt;Hozirgi kungacha, yuqorida tekshirilganidek, H1N1 infektsiyasidan omon qolganlar va soxta emlangan hayvonlarning bir xil miya lizatlarini anti-p47phox yordamida Vestern-blotting orqali tahlil qilish aniq natija bermadi (ma'lumotlar ko'rsatilmagan). Xulosa qilib aytganda, biz quyi nafas yo'llarining virusli infektsiyasi tufayli hayot uchun xavfli pnevmonitni boshdan kechirgan va omon qolgan kattalar C57BL/6J sichqonlari miyasida neyrokimyoviy o'zgarishlarga ega ekanligini ko'rsatdik. Pnevmotrop H1N1 infektsiyasi inokulyatsiyadan keyin 6 hafta o'tgach, ya'ni omon qolganlar o'tkir kasalligidan tuzalib ketgan paytda, kattalar Lrrk2 p.G2019S-mutant sichqonlarida oksidlovchi stressning sezilarli darajada oshishiga hamda fosforillangan α-sinuklein va fosforillangan tau ning ko'tarilishiga olib keldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar 5–7 haftalik yosh genetik modifikatsiyalangan sichqonlarga asoslangan bo'lib, ular insonlardagi qarish va surunkali jarayonlarni to'liq aks ettirmasligi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bizning natijalarimiz shuni ko'rsatadiki, na Lrrk2 p.G2019S, na Lrrk2 p.D1994S mutanti o'tkir virusli H1N1 o'pka infektsiyasi davrida o'xshash omon qolish darajalari, virus titrlari va vazn o'zgarishlari bilan yaqqol ko'rinib turganidek, hech qanday foyda keltirmagan yoki xavfni oshirmagan (Rasm 1). Oldingi tadqiqotlarimizda Lrrk2 p.G2019S Salmonella typhimurium bakterial sepsis modelida va Listeria monocytogenes infektsiyasi modelida himoya ta'sirini ko'rsatgan edi, ammo reovirus (T3D) qo'zg'atgan atrof-muhit ensefaliti paytida urg'ochi jinsiy ta'siri bilan omon qolishni yomonlashtirgan edi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in-f1.jpg\" alt=\"1-rasm. Lrrk2G2019S allellari A gripp virusi (H1N1) burniga yuborilgan sichqonlarning omon qolish darajasini, vazn o'zga\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. Lrrk2G2019S allellari A gripp virusi (H1N1) burniga yuborilgan sichqonlarning omon qolish darajasini, vazn o'zgarishini yoki o'pka virusli titrlarini o'zgartirmaydi. Ushbu tadqiqotda qo'llanilgan eksperimental vaqt jadvali (A). Yetuk sichqonlarga (urg'ochi va erkak; yoshi 5-7 hafta) A gripp virusining (H1N1 serotipi) 2 x teshik hosil qiluvchi birliklari (PFU) burun orqali yuborildi. Omon qolish darajasi emlashdan keyingi kunlarga nisbatan omon qolish foizi sifatida grafik tarzda ko'rsatilgan (B, E), vazn esa emlashdan keyingi kunlarga nisbatan dastlabki tana vaznining foizi sifatida ko'rsatilgan (C, F). Ma'lumotlar urg'ochi (B-D) va erkak (E-G) sichqonlar uchun alohida ko'rsatilgan. Virusli titrlar emlashdan keyingi 3-kuni o'pkada o'lchandi (D, G). Har bir belgi bitta hayvonni bildiradi. Xato chiziqlari o'rtacha ± SEM ni bildiradi. WT = yovvoyi tip; GS = Lrrk2G2019S mutant alleli. Qo'llanilgan statistik testlar: omon qolish egri chiziqlari uchun log-rank (Mantel-Cox) testi; virusli titr tahlillari uchun bir tomonlama ANOVA.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Ushbu natijalar Lrrk2 p.G2019S mutanti miyadan tashqaridagi ayrim mikrobial infektsiyalarga qarshi xo'jayinning himoyasini kuchaytirishi mumkin bo'lgan, ammo infektsiya asab tizimiga etib borganda (yovvoyi turdagi hayvonlar va Lrrk2 p.D1994S sichqonlari bilan solishtirganda) neyronlar yo'qolishi xavfini oshirishi mumkin bo'lgan gipotezani keltirib chiqargan edi. Oldingi tadqiqotlarimizga asoslanib, yomon miya salomatligiga hissa qo'shadigan omillarga ROS ishlab chiqarishning ortiqchaligi (masalan, yuqori NOX2 faolligi orqali), mikrogliya reaktivligining kuchayishi va miyaga miyeloid hujayralarning kuchaytirilgan xemotaksisi kirgan.&lt;/p&gt;\n&lt;p&gt;Chunki H1N1 miyaga to'g'ridan-to'g'ri tropizmga ega emas, biz periferiyada boshlangan yallig'lanishga qarshi javoblar miyaga etib borgan va bu yerda tasvirlangan pnevmonit modelimizda uning neyron va/yoki glial metabolizmiga ta'sir qilgan deb faraz qilamiz, bu tushuncha yuz yil oldingi H1N1 pandemiyasidan keyingi postensefalitik parkinsonizm uchun Cadar va boshqalar tomonidan qilingan xulosaga mos keladi. α-sinukleinning kuchayishi turli yallig'lanish qo'zg'atuvchilariga javoban in vivo xabar qilingan.&lt;/p&gt;\n&lt;p&gt;Bu yerda biz H1N1 infektsiyasidan keyin urg'ochi va erkak sichqonlarda pSer129 α-sinuklein turg'un holatiga Lrrk2 p.G2019S ga asoslangan ta'sirni aniqladik. Shuning uchun bizning topilmalarimiz gripp A virusi infektsiyasining keyingi kech boshlanadigan BP (Parkinson kasalligi) chastotasi bilan xavf assotsiatsiyasiga, ayniqsa sinukleopatiya rivojlanadigan mutant LRRK2 genotipiga ega tashuvchilarda dolzarb bo'lishi mumkin. LRRK2 bilan bog'liq BP pleiotrop miya patologiyasini namoyon qiladi va undagi mutatsiyalar shuningdek progressiv supranuklear falajning (PSP) tauopatiyasi bilan bog'langan.&lt;/p&gt;\n&lt;p&gt;Shu nuqtai nazardan, biz oldingi H1N1 infektsiyasining tau metabolizmiga ta'sirini baholadik. Biz pSer129 tau ning barqaror holatiga nisbatan sezilarli infektsiya va genotip o'zaro ta'sirini aniqladik; bu yerda darajalar H1N1 infektsiyasidan keyin Lrrk2 p.G2019S-mutant (lekin yovvoyi turdagi emas) urg'ochi sichqonlarda sezilarli darajada oshgan edi. Insonlarda erimaydigan neyrofibrillar chigallarni o'z ichiga olgan tauopatiya nafaqat post-infektsion parkinsonizm holatlarida, balki qizamiq virusi keltirib chiqaradigan o'tkir sklerozlovchi panensefalitda ham tasvirlangan.&lt;/p&gt;\n&lt;p&gt;Kelgusidagi ishlarda periferik immun vositachilari, masalan, sirkulyatsiya qiluvchi tsitokinlar, xemokinlar va infiltratsiyalovchi immun hujayralari pnevmonit modelimizda kuzatilgan neyrokimyoviy o'zgarishlarga mexanik hissasi uchun baholanishi kerak. Bizning tadqiqotimiz cheklovlarga ega. Birinchidan, tahlillar inokulyatsiyadan keyin 6 hafta bilan cheklangan, bu kasallikning bartaraf etilishining to'liq traektoriyasini qamrab olmasligi mumkin. Ikkinchidan, biz yoshga bog'liq sezgirlikni baholamadik, chunki barcha sichqonlar nisbatan yosh (5-7 haftalik) edi va immun javoblar hamda qon-miya to'sig'ining yaxlitligi hayot davomida o'zgarib turishi ma'lum.&lt;/p&gt;\n&lt;p&gt;Uchinchidan, bir nechta tadqiqotlar tau fosforillanishi gipotermiya, isitma, anesteziya va uyqu-uyg'onish tsikli kabi muhit omillari va stress sharoitlariga yuqori darajada sezgir ekanligini ko'rsatdi. Bizning tadqiqotlarimizda biz ushbu potentsial o'zgartiruvchilarga e'tibor qaratdik, ammo boshqalari (hali aniqlanmagan) modulyator rol o'ynagan bo'lishi mumkin. To'rtinchidan, biz H1N1 pnevmonitidan omon qolgan Lrrk2 p.G2019S sichqonlarida α-sinuklein va tau ning giperfosforillanishi ortidagi mexanizmlarni hali ochib bermadik (eslatma, Lrrk2 ning o'zi tau yoki α-sinuklein uchun neyron kinaza deb hisoblanmaydi).&lt;/p&gt;\n&lt;p&gt;Beshinchidan, eruvchan miya lizatlaridagi ikkita oqsilning giperfosforillanishi hayotning keyingi davrida neyronlar ichida chigal hosil bo'lishi va Levi-tipli qo'shilmalar bilan bog'liq erimaydigan, amiloidogen agregatlarning paydo bo'lishiga teng kelmaydi; biroq u o'tmishdagi voqea bo'lib xizmat qilishi mumkin. Nihoyat, har bir eksperimental tarmoqqa ko'proq hayvonlarning qo'shilishi bizning neyrokimyoviy o'qishlarimizdagi jinsiy ta'sirlarga yanada ko'proq oydinlik kiritishi mumkin edi. Shunga qaramay, bizning natijalarimiz shuni ko'rsatadiki, pnevmotrop RNK virusi bilan infektsiya H1N1 ning to'g'ridan-to'g'ri neyrotropizmi yo'qligiga qaramay (va o'sha paytda miyada aniqlanadigan virusli oqsillar yo'q bo'lsa ham) burun orqali inokulyatsiyadan olti hafta o'tgach C57BL/6J yovvoyi turdagi sichqonlarning miyasida oksidlovchi stressni kuchaytirishi va Lrrk2 p.G2019S nok-in hayvonlarida fosforillangan α-sinuklein va fosforillangan tau ni ko'tarishi mumkin. Nazorat qilinadigan sharoitlarda saqlanadigan kattalar sichqonlaridagi topilmalarimiz tanlangan virulent mikroblar, shu jumladan periferik organlarni nishonga oladiganlar va xo'jayinning genomi o'rtasidagi o'zaro ta'sirlar kattalar inson miyasida neyrodegeneratsiya bilan bog'liq o'zgarishlarning boshlovchisi bo'lib xizmat qilishi mumkin degan tushunchani to'ldiradi.&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"sichqonlar-koloniyalari\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#sichqonlar-koloniyalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sichqonlar koloniyalari&lt;/span&gt;&lt;/a&gt;Sichqonlar koloniyalari&lt;/h4&gt;\n&lt;p&gt;Barcha sichqonlar koloniyalari geterozigotali naslchilik juftlaridan foydalangan holda C57BL/6J genetik fonida saqlangan. Hayvonlar ustida o'tkazilgan tajribalar Kanada Hayvonlarni parvarish qilish kengashi ko'rsatmalariga muvofiq bajarilgan va Ottava universitetining Hayvonlarni parvarish qilish qo'mitasining Etika kengashi tomonidan tasdiqlangan. Virusli infeksiyalar bilan bog'liq tajribalar 2-darajali biologik xavfsizlikka ega hayvonlar uchun mo'ljallangan muassasada amalga oshirildi. Lrrk2 p.G2019S (MGI:5295368) va Lrrk2 p.D1994S (MGI:5295371) nok-in sichqonlari doktor Derya Shimshek tomonidan iltifot ko'rsatilib taqdim etilgan, tavsiflanganidek (32). Ushbu tadqiqotda ko'rsatilganidek, urg'ochi hamda erkak sichqonlardan foydalanildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Nok-in (knock-in) — bu hayvon genomiga ma'lum bir mutatsiya (bu holda Lrrk2 geniga) kiritiladigan genetik modifikatsiya bo'lib, uning patologiyalar rivojlanishiga ta'sirini o'rganish uchun qo'llaniladi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sichqonlarga-moslashtirilgan-gripp-a-h1n1-virusi-bilan-burun-ichiga-infeksiyalash\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#sichqonlarga-moslashtirilgan-gripp-a-h1n1-virusi-bilan-burun-ichiga-infeksiyalash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sichqonlarga moslashtirilgan gripp A H1N1 virusi bilan burun ichiga infeksiyalash&lt;/span&gt;&lt;/a&gt;Sichqonlarga moslashtirilgan gripp A H1N1 virusi bilan burun ichiga infeksiyalash&lt;/h4&gt;\n&lt;p&gt;Gripp A H1N1 virusining sichqonlarga moslashtirilgan varianti [A/Fort Monmouth/1/1947 ('FM-MA')] avval tavsiflangan edi (33). Yoshi 5–7 haftalik bo'lgan yetuk sichqonlar 1 daqiqa davomida 1 l/min tezlikda O₂dagi 3% izofluran yordamida narkoz qilindi. 50 mкл PBSda tayyorlangan FM-MA H1N1 ning 2× 10³ ta blyachka hosil qiluvchi birlik (PFU) dozasi burun bo'shlig'iga yuborildi, bu esa taxminan 50% o'lim darajasiga ega og'ir pnevmonitni keltirib chiqardi (1  LD₅₀). Sichqonlar emlashdan keyin 14 kun davomida (dpi) kuzatildi va 4–14 dpi kunlarda kuniga ikki marta tortildi. Evtanaziyani talab qiluvchi yakuniy mezonlarga og'ir ahvol, nafas olishning qiyinlashishi yoki tana vaznining ≥ 30% yo'qolishi kiradi. O'tkir virusli infeksiyadan omon qolgan (14 dpi da tirik qolganligi bilan bilinadigan) sichqonlar emlashdan keyin jami 6 haftagacha (wpi) bo'lgan qo'shimcha 4 hafta davomida saqlandi (1a-rasm). H1N1 ta'sir qilgan sichqonlarga parallel ravishda, soxta emlangan (mock) hayvonlarga virusiz 50 mкл PBS berildi.&lt;/p&gt;\n&lt;h4 id=\"gripp-a-virusi-h1n1-serotipi-uchun-blyachka-tahlili\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#gripp-a-virusi-h1n1-serotipi-uchun-blyachka-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gripp A virusi H1N1 serotipi uchun blyachka tahlili&lt;/span&gt;&lt;/a&gt;Gripp A virusi H1N1 serotipi uchun blyachka tahlili&lt;/h4&gt;\n&lt;p&gt;2× 10³ PFU H1N1 burun ichiga yuborilgan sichqonlar 3 dpi da jonsizlantirildi. O'pka tezda muzlatildi, so'ngra Magna Lyser (Roche) qurilmasida metall burmalar yordamida maksimal tezlikda 10 soniya davomida PBS da (3:1, v:w) gomogenizatsiya qilindi va bir marta muzlatib-eritildi. MDCK hujayralari 6 o'qli reaktorlarda 90% konfluentlikka qadar o'stirildi. O'pka gomogenatlari markazdan qochirma kuchda aylantirildi (5000 RPM) va supernatantlar zardobsiz DMEM da ketma-ket (10 marta) suyultirildi. MDCK monolyamlari ikki marta PBS bilan yuvildi, har bir suyultirishdan 100 mкл solindi va 37 °C, 5% CO₂ da 15 daqiqalik tebranish bilan 30 daqiqa davomida inkubatsiya qilindi. Bir soatdan keyin hujayralar ustiga 0,1 µg/ml TPCK-tripsinga ega 1:1 nisbatdagi 1,2% agaroza va 2xDMEM aralashmasidan 3 ml quyildi va 3 kun davomida inkubatsiya qilindi. Hujayralar bir soat davomida metanol:sirka kislotasi (3:1) aralashmasida fiksatsiya qilindi. Qoplamalar kran suvi ostida olib tashlandi va 30 daqiqa davomida Kumas ko'k rangi bilan bo'yaldi. Blyachkalar vizual tarzda sanaldi. Virus titrlari to'qima grammiga nisbatan PFU sifatida ko'rsatiladi.&lt;/p&gt;\n&lt;h4 id=\"oqsilni-ajratib-olish\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#oqsilni-ajratib-olish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Oqsilni ajratib olish&lt;/span&gt;&lt;/a&gt;Oqsilni ajratib olish&lt;/h4&gt;\n&lt;p&gt;Oqsil yuqorida virus titri tahlillari uchun tavsiflanganidek to'qimalarni gomogenizatsiya qilish yo'li bilan ajratib olindi. Alikvotlar 1% Triton-X 100 va 2x fosfataza ingibitorlariga ega proteaza ingibitorlarida (Thermo Scientific) tayyorlandi va 4 °C da 30 daqiqa davomida 14 800 RPM da markazdan qochirma kuchda aylantirildi. Oqsil konsentratsiyalari mikroteyner protsedurasiga muvofiq bitsinxonin kislotasi (BCA) tahlil to'plami (Thermo Fisher Scientific, 23227) yordamida aniqlandi.&lt;/p&gt;\n&lt;h4 id=\"a-sinuklein-va-tau-oqsilini-elisa-yordamida-miqdoriy-aniqlash\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#a-sinuklein-va-tau-oqsilini-elisa-yordamida-miqdoriy-aniqlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;α-sinuklein va Tau oqsilini ELISA yordamida miqdoriy aniqlash&lt;/span&gt;&lt;/a&gt;α-sinuklein va Tau oqsilini ELISA yordamida miqdoriy aniqlash&lt;/h4&gt;\n&lt;p&gt;Lizatlarda jami α-sinuklein miqdori avval tavsiflanganidek sendvich-ELISA yordamida o'lchandi (34, 35). α-sinuklein oqsili konsentratsiyalari har bir namunadagi umumiy oqsil konsentratsiyasiga normallashtirildi. Jami sichqon tau oqsili Tau (Total) Mouse ELISA Kit (KMB7011, Invitrogen) yordamida o'lchandi. Sichqoncha fosfo-tau (fosfo-serin 199) miqdori Mouse Tau (Phospho) [Ser199] ELISA Kit (KMB7041, Invitrogen) yordamida o'lchandi.&lt;/p&gt;\n&lt;h4 id=\"western-blotlash\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#western-blotlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Western blotlash&lt;/span&gt;&lt;/a&gt;Western blotlash&lt;/h4&gt;\n&lt;p&gt;Oqsil namunalari (har bir o'ra uchun 40 µg; anti-nitrotirozin uchun 75 µg) 1xNuPAGE™ LDS buferi bilan aralashtirildi, 95 °C da 5 daqiqa davomida qaynashga qo'yildi va qaytaruvchi sharoitda (anti-nitrotirozin uchun qaytarmaydigan sharoitda) 4–12% gradusli SDS-MES gellarida yugurtirildi. Oqsillar tris-glisin-metanol buferida yarim quruq o'tkazish usuli orqali PVDF mga membranalariga o'tkazildi. Anti-nitrotirozin antikoriga (Cell Signalling, 9691S) ega blotlar plyonkada tasvirga olindi, ImageJ yordamida miqdoriy baholandi va Ponceau S bo'yalishiga normallashtirildi. Fosfo-α-sinuklein (Ser129) (Abcam, ab51253), hSA4 (tavsiflanganidek (Mollenhauer va b. 2008) rekombinant, to'liq uzunlikdagi, inson α-sinukleiniga qarshi ishlab chiqarilgan va affin tozalangan notijoriy, poliklonal antikor) va Plk2 (Novus Biologicals, NBP3-04961) antikor blotlari BioRad ChemiDoc yordamida tasvirga olindi va ImageLab yordamida miqdoriy baholandi. Fosforillangan α-sinuklein va umumiy α-sinuklein signallari yuklama nazorati sifatida aktinga (Santa Cruz, sc-47778) normallashtirildi (Plk2 Ponceau S bo'yalishiga normallashtirildi) va blotlararo miqdoriy baholash uchun ichki blot nazoratlariga qo'shimcha ravishda normallashtirildi.&lt;/p&gt;\n&lt;h4 id=\"reaktiv-kislorod-turlarini-miqdoriy-aniqlash\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#reaktiv-kislorod-turlarini-miqdoriy-aniqlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reaktiv kislorod turlarini miqdoriy aniqlash&lt;/span&gt;&lt;/a&gt;Reaktiv kislorod turlarini miqdoriy aniqlash&lt;/h4&gt;\n&lt;p&gt;To'qimalardagi H₂O₂ miqdorini aniqlash uchun H₂O₂ ning endogen darajalarini kuzatish maqsadida Amplex® Red vodorod peroksid/peroksidaza tahlil to'plamidan (Invitrogen, A22188) foydalanildi. Sagittal kesilgan yarim miya bo'laklari yuqorida tavsiflanganidek PBSda lizis qilindi. Gomogenatlardagi H₂O₂ darajalari ishlab chiqaruvchining ko'rsatmalariga muvofiq o'lchandi. Olingan H₂O₂ qiymatlari (µ M) to'qima vazniga (g) normallashtirildi.&lt;/p&gt;\n&lt;h4 id=\"statistik-tahlillar\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#statistik-tahlillar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Statistik tahlillar&lt;/span&gt;&lt;/a&gt;Statistik tahlillar&lt;/h4&gt;\n&lt;p&gt;Barcha statistik tahlillar GraphPad Prism dasturining 11-versiyasi (GraphPad Software, San-Diego, CA, USA) yordamida bajarildi. Omon qolish tahlillaridagi guruhlar orasidagi farqlar log-rank (Mantel-Cox) testi yordamida baholandi. Gurihlar orasidagi farqlar tuzatilmagan Fisherning LSD post-hoc testi bilan ikki tomonlama ANOVA yordamida baholandi. Ma'lumotlar qo'llaniladigan joylarda va rasm tavsiflarida ko'rsatilganidek o'rtacha ± SEM ko'rinishida ko'rsatilgan. Ma'lumotlar *P&amp;lt;0.05, **P&amp;lt;0.01, ***P&amp;lt;0.001, ****P&amp;lt;0.0001 sifatida ifodalangan P qiymatlari bilan ko'rsatilgan.&lt;/p&gt;\n&lt;h4 id=\"malumotlar,-bayonnomalar-va-materiallarning-mavjudligi\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#malumotlar,-bayonnomalar-va-materiallarning-mavjudligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ma'lumotlar, bayonnomalar va materiallarning mavjudligi&lt;/span&gt;&lt;/a&gt;Ma'lumotlar, bayonnomalar va materiallarning mavjudligi&lt;/h4&gt;\n&lt;p&gt;Ushbu tadqiqotda foydalanilgan va/yoki tahlil qilingan ma'lumotlar to'plamlari va tasvirlar, shuningdek, batafsil bayonnomalar va asosiy laboratoriya materiallarini ularning doimiy identifikatorlari bilan o'z ichiga olgan Kalit resurslar jadvali (KRT) Zenodo platformasida mavjud: https://doi.org/10.5281/zenodo.16576378.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\
