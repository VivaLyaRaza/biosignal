lt;span class=\"yfm-latex\" data-content=\"%5Cmu_%7Bi%2B1%7D%20%3D%20%5Cmu_i%20%2B%20%5Cfrac%7B1%7D%7Bk_%7Bi%2B1%7D%7D(s_i%20-%20%5Cmu_i)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"%5Cnu_%7Bi%2B1%7D%5Csigma_%7Bi%2B1%7D%5E2%20%3D%20%5Cnu_i%5Csigma_i%5E2%20%2B%20%5Cfrac%7Bk_i%7D%7Bk_%7Bi%2B1%7D%7D(s_i%20-%20%5Cmu_i)%5E2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Nihoyat, i + 1 urinishda yangilangan ichki norma quyidagicha aniqlanadi: &lt;span class=\"yfm-latex\" data-content=\"E_i%5BX%5D%20%3D%20%5Cint%20x%20p(x%20%2F%20%5Cmu%2C%20%5Csigma%5E2)p_1(%5Cmu%20%2F%20%5Csigma%5E2%2C%20%5Cmu_i%2C%20k_i)p_2(%5Csigma%5E2%20%2F%20%5Cnu_i)%20%3D%20%5Cmu_i\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;p&gt;Har bir model sinfi ichida individual modellar dastlabki ichki norma haqidagi taxminlari bilan farq qildi; modellar yoki 10 ga teng bo'lgan qat'iy dastlabki norma kutuvini ($20 ning teng bo'linishiga mos keladi; «fixed f0» deb belgilangan) yoki har bir sub'ektning xulq-atvoriga individual ravishda moslashtirilgan o'zgaruvchan dastlabki norma kutuvini («variable f0» deb belgilangan) nazarda tutdi. O'zgaruvchan dastlabki norma modellari, shuningdek, alfa har bir sub'ektning xulq-atvoriga individual ravishda moslashtirilganmi yoki bemorlar namunasi bo'ylab guruhning o'rtacha alfasi darajasida qat'iy belgilanganmi («fixed alpha» deb belgilangan) degan jihatlari bilan ham farq qildi.&lt;/p&gt;\n&lt;p&gt;Barcha modellar har bir sub'ektning xulq-atvor sessiyalariga (inson va kompyuter bloklari alohida ko'rib chiqilgan holda) moslashtirildi va guruh bo'ylab minimal umumiy Bayes axborot mezoni (BIC) balli bilan aniqlangan eng yaxshi moslik uchun solishtirildi. Umumiy BIC — bu har bir model uchun har bir sub'ektning BIC ballarining guruh darajasidagi yig'indisidir. FS: fixed alpha modeli g'olib chiqdi, undan keyin RW: fixed alpha modeli keldi (2D-rasm).&lt;/p&gt;\n&lt;p&gt;Keyinchalik, xulq-atvor klassik RPE tomonidan boshqariladimi yoki yo'qligini baholash uchun biz barcha 9 ta modelni Q-o'rganish yondashuvi bilan solishtirdik. Q-o'rganish algoritmi ushbu muhit dinamikasining hech qanday oldingi modeli bo'lmagan muhitda optimal harakat-qiymat funksiyasini o'rganadi. Bu olingan mukofot va keyingi holatning baholangan qiymati asosida ma'lum bir holatda harakat qilish qiymatining baholari bo'lgan Q-qiymatlarni yangilash orqali amalga oshiriladi. Ushbu usul Q-qiymatlarni RPE tomonidan boshqariladigan tarzda bosqichma-bosqich sozlaydi. RPE-yo'naltirilgan yangilanishlar mukofot olingandan so'ng va keyingi taklif taklif qilinishidan oldin 0 va 1 orasidagi o'rganish tezligida amalga oshiriladi. Dastlabki Q-qiymatlar quyidagicha: &lt;span class=\"yfm-latex\" data-content=\"Q(s_i%2C%20%5Ctext%7Baccept%7D)%20%3D%20s_i%20%5Ccdot%201%20-%20%5Ceta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"Q(s_i%2C%20%5Ctext%7Breject%7D)%20%3D%20s_i%20%5Ccdot%201%20-%20%5Ceta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Ushbu Q-qiymatlar taklif s_i qabul qilingan yoki rad etilgan holat-harakat juftligining dastlabki qiymatini beradi. Eta (&lt;span class=\"yfm-latex\" data-content=\"%5Ceta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;) vaqtinchalik chegirma faktorini ifodalaydi, bu kelajakdagi mukofotlar joriy qiymatga qanchalik ta'sir qilishini belgilaydi; bu yerda &lt;span class=\"yfm-latex\" data-content=\"%5Ceta%20%3D%200.8\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Keyinchalik, i &amp;gt; 1 urinish uchun, i-1 urinishdagi oldingi tanlovga (ya'ni qabul qilish yoki rad etish) asoslanib, taklif qabul qilingan taqdirda Q-o'rganishni yangilash qoidasi quyidagicha: &lt;span class=\"yfm-latex\" data-content=\"Q(s_%7Bi-1%7D%2C%20%5Ctext%7Baccept%7D)%20%3D%20Q(s_%7Bi-1%7D%2C%20%5Ctext%7Baccept%7D)%20%2B%20%5Calpha(U_i(s_i)%20%2B%20%5Ceta%20%5Ccdot%20%5Cmax%20Q(s_i%2C%20a)%20-%20Q(s_%7Bi-1%7D%2C%20%5Ctext%7Baccept%7D))\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Bu yerda alfa (α) — bu xato bashorati eski Q-qiymatni qanchalik yangilashini belgilaydigan o'rganish tezligi. α 0 va 1 orasida; 0 yangilanish yo'qligini (ya'ni o'rganish yo'qligini), 1 esa to'liq yangilanishni (ya'ni to'liq o'rganishni) aks ettiradi.&lt;/p&gt;\n&lt;p&gt;Muqobil ravishda, taklif rad etilganda Q-learning yangilash qoidasi quyidagicha: &lt;span class=\"yfm-latex\" data-content=\"Q(s_%7Bi-1%7D%2C%20reject)%20%3D%20Q(s_%7Bi-1%7D%2C%20reject)%20%2B%20%5Calpha(0%20%2B%20%5Ceta%20%5Ccdot%20%5Cmax%20Q(s_i%2C%20a)%20-%20Q(s_%7Bi-1%7D%2C%20reject))\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;p&gt;Qiymatlar farqi quyidagicha: V_i = Q(s_i, accept) - Q(s_i, reject).&lt;/p&gt;\n&lt;p&gt;Nihoyat, taklifni qabul qilish ehtimoli quyidagicha modellashtiriladi: &lt;span class=\"yfm-latex\" data-content=\"p_i(s_i)%20%3D%20%5Cfrac%7Be%5E%7B%5Cbeta%20V_i%7D%7D%7B1%20%2B%20e%5E%7B%5Cbeta%20V_i%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Shunday qilib, nPE shaxsning modelga asoslangan adolat normasidan qanchalik yuqori yoki pastligini tasvirlasa, RPE, aksincha, olingan natija bilan oldingi voqealarga asoslangan kutish o'rtasidagi farqni ifodalaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Q-learning — bu agent kutilayotgan mukofotni maksimallashtirish uchun harakatlarni tanlashni o'rganadigan mustahkamlovchi o'rganish usuli bo'lib, u bashorat qilingan va haqiqiy natija o'rtasidagi farq asosida Q-qiymatlarini yangilaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz barcha 9 ta modelning BIC ballarini Q-learning yondashuvining BIC balli bilan solishtirdik va FS: fixed α modeli yana eng yaxshi moslikni ko'rsatganini, undan keyin RW: fixed α modeli kelishini aniqladik, bunda Q-learning yondashuvi qolgan 9 ta modeldan yomonroq natija berdi (Rasm S2A). Bu natijalar inson va kompyuter sharoitlarida izchil bo'lib (Rasm S2B-C), bu bizning vazifamizdagi xatti-harakatlar klassik Q-learning emas, balki FS: fixed α modelidagi kabi statik ijtimoiy imtiyozlar yoki RW: fixed α modelidagi kabi nPElar orqali vaqt o'tishi bilan me'yoriy kutishlarga yangi ma'lumotlarni modelga asoslangan holda kiritish bilan bog'liq ekanligini ko'rsatadi.&lt;/p&gt;\n&lt;p&gt;Keyinchalik, eng yaxshi mos keladigan ikkita modelning har biri uchun dalillarning kuchini baholashni osonlashtirish uchun biz ΔBIC, kutilayotgan model chastotasi va himoyalangan oshib ketish ehtimollarini baholadik (Jadval S3). Ushbu tahlillar FS: fixed α modeli 0,435 kutilayotgan model chastotasi va 0,932 himoyalangan oshib ketish ehtimoli bilan eng past BICga ega ekanligini ko'rsatdi. RW: fixed α modeli 13,707 ΔBIC, 0,174 kutilayotgan model chastotasi va 0,043 himoyalangan oshib ketish ehtimoliga ega edi. Bu shuni anglatadiki, aholining 43,5 foizi FS: fixed alpha modeli bilan, 17,4 foizi esa RW: fixed alpha modeli bilan eng yaxshi ifodalanishi kutilmoqda. Shunday qilib, FS: fixed α modelini qo'llab-quvvatlovchi dalillar ko'proq bo'lsa-da, ikkita nomzod model o'rtasidagi eng yaxshi moslikda ham ma'lum bir geterogenlik mavjudligi haqida dalillar mavjud, bu FS: fixed α va RW: fixed α modellari uchun o'rtacha BIC ballari mos ravishda 10,45 va 10,93 bo'lganligi bilan mos keladi.&lt;/p&gt;\n&lt;p&gt;Keyin biz har bir modelning modelni tiklash orqali qanchalik aniqlanishi mumkinligini o'rganish orqali ushbu ikki modelni baholashni davom ettirdik (Rasm S3; Jadval S4). Birinchidan, biz 10 ta modelning har bir parametri uchun empirik o'rtacha va standart og'ishni hisobladik, har bir model ichidagi har bir parametr uchun ushbu baholarga markazlashtirilgan normal taqsimotlarni qurdik va parametrni tiklashda foydalanilgan parametr tanlash jarayoni orqali ushbu taqsimotlardan yangi parametr qiymatlarini oldik. Har bir generatsiya qiluvchi model uchun biz ushbu tanlangan parametrlardan foydalangan holda 29 ta sintetik sub'ekt uchun xulq-atvor ma'lumotlar to'plamini simulyatsiya qildik, bu bizning tadqiqotimizda modelni moslashtirishdan o'tgan 29 ta empirik xulq-atvor ma'lumotlar to'plamiga mos keladi. Keyin biz barcha 10 ta modelni ushbu simulyatsiya qilingan ma'lumotlar to'plamiga qayta moslashtirdik. Bu jarayon 200 ta mustaqil takrorlash uchun amalga oshirildi, har bir takrorlashda barcha 29 ta sintetik sub'ekt uchun yangi tanlangan parametr qiymatlari va simulyatsiya qilingan ma'lumotlar to'plami yaratildi. Shundan so'ng, biz ushbu model sinflari farqlanadigan hisoblash jarayonlarini ifodalaydimi yoki yo'qmi degan savolga javob berish uchun 10x10 tiklash matritsasini va 4x4 sinf darajasidagi tiklash matritsasini (RW modellari, Bayes modellari, FS modellari va Q-learning modeli) qurdik.&lt;/p&gt;\n&lt;p&gt;Individual model darajasida eng yuqori tiklash ehtimollari Q-learning (50,79%), Bayes: fixed alpha (45,88%), FS: fixed f0 (45,83%) va RW: fixed alpha (45,47%) modellari tomonidan namoyish etildi (qo'lyozmaga qo'shilgan va quyida ko'chirilgan yangi Jadval S4 va Rasm S3 ga qarang). FS: fixed alpha modeli 37,62% tiklash ehtimoli bilan zaifroq tiklanishni ko'rsatdi. Nihoyat, RW: variable f0, RW: fixed f0, Bayes: variable f0, Bayes: fixed f0 va FS: variable f0 modellari asosan tiklanmaydigan bo'lib chiqdi (tiklash ehtimollari mos ravishda 1,28%, 9,72%, 0,41%, 9,33% va 0,71%). Ushbu natijalar shuni ko'rsatadiki, o'zgaruvchan f0 modellari kamroq aniqlanadigan, o'zgarmas α modellari esa ko'proq aniqlanadigan bo'ladi.&lt;/p&gt;\n&lt;p&gt;Tiklash matritsasini keyingi tekshirish shuni ko'rsatdiki, chalkashlik ko'pincha bir xil model sinfidagi tegishli modellar o'rtasida sodir bo'lgan.&lt;/p&gt;\n&lt;p&gt;Modellar sinf darajasida ko'proq farqlanadimi yoki yo'qligini baholash uchun biz har bir sinf ichidagi modellar bo'yicha tiklash ehtimollarini o'rtacha hisoblash orqali sinf darajasidagi tiklash matritsasini qurdik. Sinf darajasida RW modellari, Bayes modellari, FS modellari va Q-learning modeli uchun tiklash ehtimollari mos ravishda 40,57%, 47,67%, 81,82% va 50,79% ni tashkil etdi (qo'lyozmaga qo'shilgan va quyida ko'chirilgan yangi Jadval S5 va Rasm S4 ga qarang). Eng ko'p chalkashlik RW va Bayes oilalari o'rtasida yuz berdi, bu ikkala sinf ham modelga asoslangan me'yoriy moslashuv mexanizmlarini amalga oshirishi bilan mos keladi. Umuman olganda, ushbu tahlillar shuni ko'rsatadiki, tegishli individual modellar ba'zida umumiy model sinflari ichida bir-biri bilan chalkashib ketgan bo'lsa-da, bu yuqori darajadagi model sinflari ishonchliroq tiklanadi, bu esa ushbu hisoblash model sinflari tomonidan yaratilgan xulq-atvor bashoratlari ancha farqlanadigan ekanligini ko'rsatadi.&lt;/p&gt;\n&lt;p&gt;Bundan tashqari, eng yaxshi mos keladigan ikkita modeldan RW: fixed α modeli modelni tiklashda eng yaxshi identifikatsiyani ko'rsatdi.&lt;/p&gt;\n&lt;h4 id=\"parametrlarni-tiklash\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#parametrlarni-tiklash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Parametrlarni tiklash&lt;/span&gt;&lt;/a&gt;Parametrlarni tiklash&lt;/h4&gt;\n&lt;p&gt;Keyinchalik, RW: fixed α modeli tomonidan generatsiya qilingan parametrlarning tiklanishini sinash uchun 29 ta empirik xulq-atvor seanslaridan olingan parametr baholarining normal taqsimotlariga asoslanib, 29 ta xulq-atvor seansi sun'iy ravishda modellashtirildi. So'ngra simulyatsiya qilingan xulq-atvor asl empirik xulq-atvor bilan bir xil modellashtirish jarayonidan o'tkazildi. Simulyatsiya qilingan moslashtirishlardan olingan natijaviy model parametrlari korrelyatsiya yordamida asl empirik parametr baholari bilan taqqoslandi. Yuqori Pearson korrelyatsiya koeffitsientlari parametrlarning yaxshiroq tiklanganini ko'rsatdi. Barcha model parametrlari sezilarli darajada tiklandi (S5-rasm; temperatura: r = 0.51, p = 0.0049; normaning moslashish tezligi: r = 0.86, p = 1.8e-09; boshlang'ich norma: r = 0.94, p = 6.9e-14). Shuning uchun biz ushbu norma moslashuvi modelini yetarli takrorlanuvchanlik bilan qo'llash mumkin degan xulosaga keldik.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Parametrlarni tiklash — bu modellash algoritmi dastlabki qiymatlarni qaytara olishini tekshirish uchun ma'lum parametrlarga ega ma'lumotlarni sun'iy ravishda yaratish orqali bajariladigan validatsiya testi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"aposterior-bashorat-tekshiruvlari\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#aposterior-bashorat-tekshiruvlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Aposterior bashorat tekshiruvlari&lt;/span&gt;&lt;/a&gt;Aposterior bashorat tekshiruvlari&lt;/h4&gt;\n&lt;p&gt;Biz keyinchalik RW: fixed α modeli tadqiqotimizda kuzatilgan tanlov naqshlarini takrorlay olishini o'rganib chiqdik. Buning uchun har bir seansda taqdim etilgan aniq taklif vektorlaridan foydalangan holda, RW: fixed α modeli yordamida empirik modelni moslashtirishdan olingan parametr baholari asosida 29 ta xulq-atvor ma'lumotlar to'plamini simulyatsiya qildik.&lt;/p&gt;\n&lt;p&gt;RW: fixed α modeli inson (o'rtacha ± SEM: kuzatilgan: 0.662 ± 0.042; simulyatsiya qilingan: 0.652 ± 0.045) va kompyuter (kuzatilgan: 0.542 ± 0.050; simulyatsiya qilingan: 0.500 ± 0.065) avatarlar sherik shartlarining ikkalasida ham umumiy rad etish ko'rsatkichlarini takrorladi (S6A-rasm). RW: fixed α modeli, shuningdek, taklif hajmining rad etish chastotasiga salbiy ta'sirini ham tikladi (S6B-rasm). Nihoyat, RW: fixed α modeli xulq-atvorni alohida subyektlar darajasida takrorlashini baholash uchun kuzatilgan va simulyatsiya qilingan seanslar uchun individual rad etish ko'rsatkichlari ham taqqoslanib, kuchli chiziqli korrelyatsiyani yuzaga chiqardi (S6C-rasm; Pearson ko'paytma-moment korrelyatsiyasi, p = 4.55e-12, r = 0.914, 95% CI 0.823 - 0.959).&lt;/p&gt;\n&lt;h4 id=\"shartlar-boyicha-parametrlarni-taqqoslash\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#shartlar-boyicha-parametrlarni-taqqoslash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Shartlar bo'yicha parametrlarni taqqoslash&lt;/span&gt;&lt;/a&gt;Shartlar bo'yicha parametrlarni taqqoslash&lt;/h4&gt;\n&lt;p&gt;RW: fixed alpha modeli uchun teskari temperatura, norma moslashish tezligi va boshlang'ich norma bo'yicha parametr baholari ishtirokchi uchun va ishtirokchi ichidagi seans uchun tasodifiy effektlarga ega bo'lgan holda har bir parametrni shart (inson yoki kompyuter avatari) bo'yicha bashorat qiluvchi aralash effektli modellar yordamida taqqoslandi (1-jadval). Ishtirokchi uchun va ishtirokchi ichidagi seans uchun tasodifiy effektlar bilan haroratni shart bo'yicha bashorat qiluvchi aralash effektli model shartning sezilarli ta'sirini aniqlamadi (shart, p = 0.34, β ± SEM = 0.80 ± 0.83; OR = 2.24, 95% CI [0.41, 12.17]). Ishtirokchi uchun va ishtirokchi ichidagi seans uchun tasodifiy effektlar bilan dastlabki ichki normani shart bo'yicha bashorat qiluvchi aralash effektli model shart uchun sezilarli ta'sirni aniqladiki, bunda inson avatari sheriklar bilan o'yin davomida boshlang'ich norma kompyuter avatarlariga qaraganda yuqoriroq bo'lgan (shart, p = 0.025, β ± SEM = -4.76 ± 2.00; OR = 0.0085, 95% CI [0.00014, 0.52]). Nihoyat, ishtirokchi uchun va ishtirokchi ichidagi seans uchun tasodifiy effektlar bilan norma moslashish tezligini shart bo'yicha bashorat qiluvchi aralash effektli model shartning sezilarli ta'sirini aniqlamadi (shart, p = 0.083, β ± SEM = 0.053 ± 0.030; OR = 1.05, 95% CI [0.99, 1.12]). Shunday qilib, temperatura va norma moslashish tezligi shartlar bo'yicha farq qilmagan bo'lsa-da, boshlang'ich normachalar haqiqatan ham shartlar bo'yicha farq qildi, ya'ni adolatlilik me'yorlari inson avatari sheriklar bilan o'yin davomida yuqoriroq edi.&lt;/p&gt;\n&lt;h4 id=\"single-unit-elektrofiziologik-malumotlarini-tahlil-qilish\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#single-unit-elektrofiziologik-malumotlarini-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Single-unit elektrofiziologik ma'lumotlarini tahlil qilish&lt;/span&gt;&lt;/a&gt;Single-unit elektrofiziologik ma'lumotlarini tahlil qilish&lt;/h4&gt;\n&lt;p&gt;Neyron ma'lumotlari 44 000 Gts chastotada raqamlashtirildi va faqat yuqori chastotali faollikni ajratib olish uchun 300–9000 Gts oralig'ida filtrlandi. Filtrlangan single-unit yozuvlaridan klasterlar Rutixauzer va boshqalar tomonidan ishlab chiqilgan OSORT oflayn spayklarni saralash (spike sorting) algoritmi yordamida MATLAB muhitida aniqlandi. Spayklar faqat neyron signali o'rtacha signal amplitudasining standart og'ishish chegarasidan besh baravar oshib ketganda aniqlandi. Har bir yangi spayk aniqlanganda, u ko'p o'lchovli masofa bo'yicha oldindan aniqlangan shunga o'xshash spayklar klasterlari bilan taqqoslandi. Agar masofa klasterlash chegarasidan (suriluvchi oyna bo'ylab filtrlangan signalning o'rtacha standart og'ishining kvadrati to'lqin shaklidagi ma'lumotlar nuqtalari soniga ko'paytirilgan) kichik bo'lsa, u holda u ushbu klasterga qo'shildi; agar masofa klasterlash chegarasidan katta bo'lsa, u holda u yangi klaster sifatida tasniflandi.&lt;/p&gt;\n&lt;p&gt;Keyinchalik biz saralash algoritmi tomonidan qaytarilgan har bir klasterni qo'lda ko'rib chiqdik, artefaktlarni yo'q qildik va noto'g'ri bo'lingan klasterlarni birlashtirdik. Agar ushbu klaserdan kelib chiqqan barcha spayklarning &amp;gt;5% qismi 3 ms dan kam bo'lgan spayklararo intervalga (ISI) ega bo'lsa, bu klaster refrakter davr uzunligiga mos kelib, artefakt deb hisoblandi. Noto'g'ri bo'linishlar har bir klaster uchun OSORT tomonidan yaratilgan proyeksion testlarni o'rganish orqali aniqlandi. Ushbu proyeksion testlar har bir mumkin bo'lgan klaster juftligi o'rtasidagi ko'p o'lchovli masofaning vizualizatsiyasini ta'minlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Spayklarni saralash (spike sorting) — bitta mikroelektrod yozib olgan turli neyronlarning elektr signallarini ularning o'ziga xos to'lqin shakliga qarab ajratish uchun ishlatiladigan kompyuter usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz ISI &amp;lt;5% bilan tavsiflangan klasterlarni taxminiy yagona birliklar (putative single units) deb tasnifladik. Biz UG topshirig'ida taklif taqdim etiladigan nuqta bo'lgan taqsimotni ochish (split reveal) vaqtida har bir taxminiy birlik uchun raster grafiklari va peristimulyar vaqt gistogrammalarini yaratdik. Keyinchalik biz har bir vaqt nuqtasida markazlashtirilgan suriluvchi, simmetrik Gauss yadrosi (kengligi = 300 ms) yordamida taxminiy birliklar uchun spayk ketma-ketliklarini uzluksiz to'lqin shakllariga tekisladik (bitta birlik misoli uchun S8-rasmga qarang). Tekislash nol fazali bo'lib, neyron javoblarining vaqtiga vaqtinchalik siljishlar kiritmadi. Biz har bir taxminiy birlik uchun o'rtacha impulsatsiya chastotasini hisobladik va o'rtacha to'lqin shakllarini cho'qqilar soni, to'lqin kengligi, qutbliligi hamda cho'qqilar va pastqamliklar orasidagi masofa bo'yicha tavsifladik. SNr da biz 27 ta SNr mikroelektrod yozuvidan 69 ta taxminiy neyron klasterini aniqladik (har bir yozuv uchun o'rtacha ± SEM klasterlar: 2,6 ± 0,11). Impulsatsiya chastotasi 15 Gts ga teng yoki undan kam bo'lgan hamda ikki fazali shakldagi to'lqin kengligi 0,8 ms dan katta bo'lgan birliklarni taxminiy dofaminergik (DA) birliklar deb belgiladik. Agar birlikning bipolyar to'lqin shakli salbiy og'ishga va undan keyin ijobiy og'ishga ega bo'lsa (teskari qutblilik o'rniga), bu birlik elektrod holatiga nisbatan yo'nalishi ehtimol teskari bo'lgan taxminiy DA birligi deb hisoblandi. Jami 69 ta taxminiy birlikdan 40 tasi taxminiy DA birliklari sifatida belgilandi (har bir yozuv uchun o'rtacha ± SEM taxminiy DA birliklari: 1,5 ± 0,18) (3A-rasm). Barcha 40 ta taxminiy DA birliklari uchun to'lqin shakllari va bu birliklar uchun o'rtacha to'lqin shakli 3B-rasmda tasvirlangan. Faqat 3B-rasmdagi vizualizatsiya maqsadida, teskari qutblilikka ega taxminiy DA birliklarining to'lqin shakllari elektrod uchiga nisbatan teskari yo'nalishni to'g'rilash uchun x o'qi bo'yicha aks ettirildi (ya'ni mikrovoltlar har bir vaqt nuqtasida –1 ga ko'paytirildi). Har bir birlik uchun uzluksiz impulsatsiya chastotalari butun sessiya davomida birlik faolligining o'rtacha qiymati va standart og'ishidan foydalangan holda butun yozuv bo'ylab z-skaledan o'tkazildi. Keyinchalik bu z-skaladagi uzluksiz impulsatsiya chastotalari keyingi populyatsiyaga asoslangan tahlillar uchun qiziqish uyg'otadigan voqealar (ya'ni taqsimotni ochish, kayfiyat reytingi va boshqalar) atrofida ajratib olindi.&lt;/p&gt;\n&lt;p&gt;Ushbu taxminiy DA neyronlarining faolligi nPE xususiyatlarini kodlashi mumkinligini tekshirish uchun biz birinchi navbatda nPE ijobiy bo'lgan sinovlardagi taqsimotni ochishdan keyingi 1000 ms davomida bu birliklarning impulsatsiya chastotalarini nPE salbiy bo'lgan sinovlar bilan taqqosladik. Guruh darajasidagi taxminiy DA birligi faolligi odam sharoitida salbiy nPE sinovlariga nisbatan ijobiy nPE sinovlari paytida yuqoriroq ko'rindi (ehtimollik zichligi funksiyalari uchun 3E-rasmga qarang); bu naqsh kompyuter sharoitida zaiflashdi (ehtimollik zichligi funksiyalari uchun 3F-rasmga qarang). Ushbu kuzatishning statistik ahamiyatini tekshirish hamda ushbu birliklar nPE kattaligini kodlashini tekshirish uchun biz har bir sharoitda birlik uchun tasodifiy effekt bilan nPE valentligi (1 = salbiy, 2 = ijobiy), kattaligi va ularning o'zaro ta'sirlari bo'yicha taqsimotni ochishdan keyingi 1000 ms davomida ushbu birliklarning faolligini bashorat qilish uchun aralash effektli modelni joriy qildik. Valentlik omil sifatida ko'rib chiqildi. Barcha aralash effektli modellar RStudio-dagi “lme4” va “lmerTest” paketlari yordamida amalga oshirildi. Odam sharoiti uchun aralash model valentlik uchun sezilarli ta'sir ko'rsatdi (nPE valentligi, p = 0,008, β ± SEM = 0,19 ± 7,3e-02, 95% CI [0,05, 0,34]; 3G-rasm; boshqa baholashlar uchun 2-jadvalga qarang). Valentlik kompyuter sharoitida impulsatsiya chastotasining sezilarli bashoratchisi bo'lmadi (PE valentligi, p = 0,79, β ± SEM = -0,02 ± 7,7e-02, 95% CI [-0,17, 0,13]; 3H-rasm; boshqa baholashlar uchun 2-jadvalga qarang).&lt;/p&gt;\n&lt;p&gt;nPE valentlik effekti sharoitlar bo'yicha qanday farqlanishini rasmiy ravishda tekshirish uchun biz aralash effektli modelni tuzdik. Bunda nPE kattaligi, nPE valentligi, sharoit (inson yoki kompyuter) va ularning tegishli o'zaro ta'sir termlari qat'iy effektlar sifatida, neyron esa SNr taxmin qilinadigan dopaminergik neyronlarining bo'linish oshkor bo'lishidan (split reveal) keyingi 1000 ms davomidagi guruh faolligini bashorat qiluvchi tasodifiy effekt sifatida kiritildi (S9-jadval). Ushbu model SNr taxmin qilinadigan dopaminergik neyronlarining o'rtacha impulsatsiya chastotasi nafaqat nPE valentligi (nPE valentligi, p = 0.0057, β ± SEM = 0.20 ± 7.3e-02, 95% CI [0.06, 0.34]), balki nPE valentligi va sharoit o'rtasidagi o'zaro ta'sir (nPE valentligi × sharoit, p = 0.036, β ± SEM = -0.22 ± 0.11, 95% CI [-0.43, -0.01]) bilan ham sezilarli darajada bashorat qilinishini ko'rsatdi, bunda nPE valentligining impulsatsiya chastotasi bo'yicha kodlanishi kompyuter sharoitiga qaraganda inson sharoitida sezilarli darajada kuchliroq bo'lgan. Umuman olganda, bu natijalar SNr taxmin qilinadigan dopaminergik neyronlari nPE valentligiga, ayniqsa ijtimoiy kontekstlarda, sezgir bo'lishi mumkinligini ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Aralash modellar guruh darajasidagi umumiy qonuniyatlarni ham, individual neyronlarning o'ziga xos xususiyatlarini ham bir vaqtning o'zida hisobga olish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Taklif hajmining nPE valentligiga nisbatan kuzatilgan neyron javobidagi potentsial rolini hisobga olish uchun biz inson sharoitida bo'linish oshkor bo'lishida SNr taxmin qilinadigan dopaminergik neyronlarining faolligini bashorat qiluvchi chiziqli aralash effektli modelni tuzdik, bunda taklif hajmi va nPE valentligi qat'iy effektlar sifatida, neyron uchun esa tasodifiy effekt ishlatildi. Ushbu tahlil shuni ko'rsatdiki, nPE valentligi taklif hajmi nazorat qilingandan keyin ham bo'linish oshkor bo'lishida impulsatsiya chastotasining ahamiyatli bashorat qiluvchisi bo'lib qoldi (nPE valentligi, p = 0.022, β ± SEM = 0.12 ± 5.1e-02, 95% CI [0.02, 0.21]), shu bilan birga taklif hajmi ahamiyatli bashorat qiluvchi emas edi (taklif, p = 0.45, β ± SEM = -3.6e-03 ± 4.7e-03, 95% CI [-0.01, 0.01]). Biz taklifni kategorik o'zgaruvchi sifatida qabul qilgan holda ushbu tahlilni takrorladik. Yana bir bor nPE valentligi impulsatsiya chastotasining yagona ahamiyatli bashorat qiluvchisi bo'ldi (nPE valentligi, p = 0.030, β ± SEM = 0.11 ± 5.1e-02, 95% CI [0.01, 0.21]), taklifning sezilarli ta'siri kuzatilmadi. Bu topilmalar ushbu taxmin qilinadigan dopaminergik neyronlarning kuzatilgan impulsatsiya faolligi taklif hajmining o'zidan ko'ra, taklif ishtirokchining ichki me'yoriy kutilmasidan yaxshiroq yoki yomonroq ekanligini kodlashga ko'proq mos kelishini ko'rsatadi.&lt;/p&gt;\n&lt;p&gt;Nihoyat, biz ushbu taxmin qilinadigan dopaminergik neyronlarning faolligi lahzali kayfiyat baholariga qanday bog'liqligini o'rganib chiqdik. Biz dastlab z-standartlashtirilgan kayfiyat baholari va kayfiyat bahosini tanlashdan oldingi 1000 ms davomidagi taxmin qilinadigan dopaminergik neyronlarining impulsatsiya chastotasi o'rtasida Pirson ko'paytma-moment korrelyatsiya testini o'tkazdik va impulsatsiya chastotalari hamda z-standartlashtirilgan kayfiyat baholari sezilarli darajada korrelyatsiya qilmasligini aniqladik (p = 0.16, r = -0.09, 95% CI -0.21, -0.03) (S10-rasm). Keyinchalik biz neyron uchun tasodifiy effekt bilan z-standartlashtirilgan kayfiyat bahosi bo'yicha ushbu davrdagi taxmin qilinadigan dopaminergik neyronlari guruh faolligini bashorat qilish uchun aralash effektli modelni joriy qildik, bu kayfiyat bahosining neyron faolligiga sezilarli ta'siri yo'qligini tasdiqladi (kayfiyat bahosi, p = 0.16, β ± SEM = -0.027 ± 0.019). Bu natijalar ushbu taxmin qilinadigan dopaminergik neyronlarning faolligi kayfiyat baholariga emas, balki faqat nPE valentligiga javob berishini ko'rsatadi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l-f1.jpg\" alt=\"1-rasm. Eksperimental tuzilma. (A) Substantia nigra pars reticulata (SNr) da mikroelektrodni intraoperativ nishonga olis\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. Eksperimental tuzilma. (A) Substantia nigra pars reticulata (SNr) da mikroelektrodni intraoperativ nishonga olish. Mikroelektrodlar yozib olish nishoni SNr ga joylashtirish uchun klinik nishon — subthalamic nucleus (STN) dan ventral ravishda joylashtirildi. Mikroelektrodning holati va uning trayektoriyasi bo'ylab miya sohalarining nisbiy anatomik joylashuvi jarrohlik xaritalash, neyron spayklarini vizualizatsiya qilish va Alpha Omega elektroofiziologik yozib olish tizimi yordamida neyron impulslarini tinglash orqali real vaqt rejimida aniqlandi, shunda har bir hudud o'zining neyron faolligining noyob imzosi orqali aniqlanishi mumkin edi. (B) Ultimatim o'yini. Ishtirokchilar ultimatim o'yinining ikkita versiyasidan birini o'ynashdi. Bir versiyada inson avatari bo'lgan sheriklar ishtirokchilarga $20 ni taqsimlash bo'yicha takliflarni qayta-qayta taqdim etishdi, ularni ishtirokchilar qabul qilishdi yoki rad etishdi. Agar ishtirokchi qabul qilsa, har bir tomon taklif qilingan ulushni oladi. Agar ishtirokchi rad etsa, har bir tomon hech narsa olmaydi. Har bir taklif yangi sherik tomonidan taqdim etiladi. Barcha takliflar $9 dan kam. Ultimatim o'yinining ikkinchi versiyasi nafaqat inson blokini, balki “kompyuter” sheriklar bilan sinovlar blokini hamda tanlov sinovlarining tasodifiy 33% dan keyin kayfiyat reytingini o'z ichiga oladi. Miya kesmasi va kompyuter belgisi BioRender da yaratilgan. Neal, A. (2027) https://BioRender.com/bpwujj1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l-f2.jpg\" alt=\"2-rasm. Ultimatim o'yini xulq-atvori. (A) Taklif hajmiga qarab rad etish darajasi va (B) kompyuter (ko'k) va inson (to'q\" /&gt;&lt;/p&gt;\n&lt;p&gt;*2-rasm. Ultimatim o'yini xulq-atvori. (A) Taklif hajmiga qarab rad etish darajasi va (B) kompyuter (ko'k) va inson (to'q sariq) sharoitlarida umumiy rad etish darajasi. (C) Inson va kompyuter sharoitlarida tanlovga (qabul qilish/rad etish) nisbatan kayfiyat reytingi (z-skalalashtirilgan). (D) Barcha sessiyalar va ishtirokchilar uchun umumiy Bayes axborot mezoni (BIC) ballari bo'yicha norma moslashuvi modellarini taqqoslash. Eng past umumiy BIC balliga ega model eng yaxshi mos keladi (yashil). (E) Kompyuter va inson sharoitlarida sinov bo'yicha ichki norma. Ichki normativlar eng yaxshi ishlaydigan norma moslashuvi modeli yordamida hisoblangan. (F) Barcha sessiyalar va ishtirokchilar uchun kayfiyat reytingiga (z-skalalashtirilgan) nisbatan norma bashorati xatosi (z-skalalashtirilgan). Ustunlar, nuqtalar va chiziqlar o'rtacha qiymatni bildiradi. Xato ustunlari o'rtachaning standart xatosini bildiradi. **p &amp;lt; 0.01; **&lt;em&gt;p &amp;lt; 0.001 ikki tomonlama Uilkokson rangli yig'indi testlari (C), umumiy chiziqli regressiya (E) va Pirsonning moment-moment korrelyatsiya testi (F) bo'yicha. n = (A), (B), (D) va (E) uchun inson avatarlari bilan 21 ta o'yin bloki va kompyuter avatari bilan 8 ta o'yin bloki. n = (C) va (F) uchun inson avatarlari bilan 6 ta o'yin bloki va kompyuter avatari bilan 5 ta o'yin bloki.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l-f3.jpg\" alt=\"3-rasm. Faraz qilingan DA birligi faolligi ijtimoiy bashorat xatosi valentligini kodlaydi. (A) Oflayn saralash algoritmi\" /&gt;&lt;/p&gt;\n&lt;p&gt;*3-rasm. Faraz qilingan DA birligi faolligi ijtimoiy bashorat xatosi valentligini kodlaydi. (A) Oflayn saralash algoritmi yordamida aniqlangan uchta faraz qilingan birlik namunasi va o'rtacha to'lqin shakli kengligi &amp;gt;0.8 ms, ikki fazali morfologiya va otish tezligi ≤15 Hz bo'lgan bitta faraz qilingan DA birligi (och binafsha). (B) SNr faraz qilingan DA birliklari (kulrang) uchun o'rtacha to'lqin shakli (qora). (C) inson va (D) kompyuter sharoitlarida ijobiy (yashil, yaxlit) va salbiy (magenta, shtrixli) nPE larni keltirib chiqaradigan sinovlar uchun bo'linish ochilgandan keyingi 1000 ms davomida SNr faraz qilingan DA birliklarining o'rtacha xom otish tezligi. Bo'linishning ochilishi 0 ms vaqtda sodir bo'ladi. (E) inson va (F) kompyuter sharoitlarida ijobiy (yashil) va salbiy (magenta) norma bashorati xatolarini (nPE) keltirib chiqaradigan sinovlar uchun bo'linish ochilgandan keyingi 1000 ms davomida SNr faraz qilingan DA birliklarining o'rtacha otish tezligining ehtimollik zichligi funksiyalari. (G) inson va (H) kompyuter sharoitlarida bo'linish ochilgandan keyingi 1000 ms davomida SNr faraz qilingan DA birliklarining o'rtacha otish tezligini nPE valentligi, nPE kattaligi va birlik uchun tasodifiy effektga ega bo'lgan ushbu regressorlar uchun o'zaro ta'sir shartlari bo'yicha bashorat qiluvchi aralash effektli modellar
