            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"272\" cy=\"81\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"528\" cy=\"250\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Inson miyasi ijtimoiy&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qoidalarni qanday qayta&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ishlaydi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l-f1.jpg\" alt=\"1-rasm. Eksperimental tuzilma. (A) Substantia nigra pars reticulata (SNr) da mikroelektrodni intraoperativ nishonga olis\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. Eksperimental tuzilma. (A) Substantia nigra pars reticulata (SNr) da mikroelektrodni intraoperativ nishonga olish. Mikroelektrodlar yozib olish nishoni SNr ga joylashtirish uchun klinik nishon — subthalamic nucleus (STN) dan ventral ravishda joylashtirildi. Mikroelektrodning holati va uning trayektoriyasi bo'ylab miya sohalarining nisbiy anatomik joylashuvi jarrohlik xaritalash, neyron spayklarini vizualizatsiya qilish va Alpha Omega elektroofiziologik yozib olish tizimi yordamida neyron impulslarini tinglash orqali real vaqt rejimida aniqlandi, shunda har bir hudud o'zining neyron faolligining noyob imzosi orqali aniqlanishi mumkin edi. (B) Ultimatim o'yini. Ishtirokchilar ultimatim o'yinining ikkita versiyasidan birini o'ynashdi. Bir versiyada inson avatari bo'lgan sheriklar ishtirokchilarga $20 ni taqsimlash bo'yicha takliflarni qayta-qayta taqdim etishdi, ularni ishtirokchilar qabul qilishdi yoki rad etishdi. Agar ishtirokchi qabul qilsa, har bir tomon taklif qilingan ulushni oladi. Agar ishtirokchi rad etsa, har bir tomon hech narsa olmaydi. Har bir taklif yangi sherik tomonidan taqdim etiladi. Barcha takliflar $9 dan kam. Ultimatim o'yinining ikkinchi versiyasi nafaqat inson blokini, balki “kompyuter” sheriklar bilan sinovlar blokini hamda tanlov sinovlarining tasodifiy 33% dan keyin kayfiyat reytingini o'z ichiga oladi. Miya kesmasi va kompyuter belgisi BioRender da yaratilgan. Neal, A. (2027) https://BioRender.com/bpwujj1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Odamlar jamiyatdagi yashirin qoidalarga oson moslashadi, ammo bu jarayon hujayra darajasida qanday sodir bo'lishi noma'lum edi. Tadqiqotchilar neyroxirurgik operatsiya paytida bemorlarning miya chuqur tuzilmalari faoliyatini yozib olishdi. Ma'lum bo'lishicha, qora modda neyronlari ijtimoiy bashorat xatolarini kuzatib boradi. Bunda hujayralarning javobi tirik odamlar bilan muloqot paytida sezilarli darajada kuchliroq bo'lgan.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Qora modda neyronlari ijtimoiy bashorat xatolarini qayd etadi.&lt;/li&gt;\n&lt;li&gt;Hujayralar faolligi real odamlar bilan o'yinda oshadi.&lt;/li&gt;\n&lt;li&gt;Nazorat hududi bo'lgan globus pallidusda bunday ta'sir yo'q.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tajribada Parkinson kasalligiga chalingan 19 nafar bemor (16 erkak, 3 ayol, o'rtacha yoshi 65 yosh) ishtirok etdi. Ularga chuqur miya stimulyatsiyasi uchun elektrodlar o'rnatish operatsiyasi bajarilayotganda, mikroelektrodlar yordamida qora moddaning to'rsimon qismi (SNr) va ichki globus pallidus (GPi) neyronlari faoliyati qayd etildi. Ishtirokchilar kompyuter yoki inson qiyofasidagi raqiblar bilan ultimatum o'yinini o'ynashdi.&lt;/p&gt;\n&lt;p&gt;Hisoblash modellashtirishi yordamida har bir qadamdagi me'yor bashorati xatolari (nPEs) hisoblab chiqildi. Tahlillar shuni ko'rsatdiki, SNr'dagi ehtimoliy dofaminergik neyronlar ijtimoiy xatolarning yo'nalishini kodlaydi. Agar raqib tirik odam bo'lsa, bu signal ancha kuchli chiqqan, GPi nazorat hududida esa bunday ta'sir topilmagan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot faqat Parkinson kasalligi bilan og'rigan va operatsiya qilingan bemorlar ishtirokida o'tkazilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Odamlar o'zgarib turadigan me'yorlarga moslashishda ajoyib qobiliyatga ega, ammo biz inson miyasi ushbu ijtimoiy signallarni alohida neyronlar darajasida qanday kodlashi haqida kam narsani bilamiz. Ushbu tadqiqotda biz neyroxirurgik ishtirokchilar inson va kompyuter avatarlariga qarshi iterativ ultimatum o'yinini o'ynayotgan paytda qora modda va palladiv sharsimon tanachasidagi alohida neyronlar faolligini qayd etdik. Xulq-atvordan hisoblash modellashtirishidan foydalangan holda, biz qora moddadagi taxminiy dofaminergik birliklar ijtimoiy me'yorlar bashorati xatolarining valentligini kuzatishini aniqladik, bunda kodlash inson avatarlari bilan o'yin davomida kompyuter avatarlariga qaraganda kuchliroq bo'lgan. Qora moddaga yondosh yadro bo'lgan palladiv sharsimon tanachasidagi shunga o'xshash tahlillar sezilarli ta'sirni aniqlamadi. Bizning natijalarimiz ijtimoiy o'rganish signallarini kodlashda qora moddaning yangi rolini aniqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Qora modda neyronlari odamlar bilan o'zaro ta'sirda ijtimoiy me'yorlar bashorati xatolarini kodlaydi, lekin kompyuter bilan emas.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ijtimoiy faoliyat doirasidagi muhim ko'nikma o'zgarib turadigan ijtimoiy me'yorlarga yoki ijtimoiy guruhlar orasidagi xulq-atvor qoidalariga o'rganish va moslashish qobiliyatidir. Xulq-atvordan hisoblash modellashtirishi odamlarning ijtimoiy me'yorlarni qanday o'rganishini tushunishimizni rivojlantirgan bo'lsa-da, bu jarayonni qaysi neyron mexanizmlari qo'llab-quvvatlashi haqida oz narsa ma'lum. Bu yerda biz inson miyasi me'yorlarni o'rganish signallarini alohida neyronlar darajasida qanday kodlashini tadqiq qilish uchun xulq-atvordan hisoblash modellashtirishini inson miya ichki qayd etishi bilan birgalikda qo'llaymiz. Biz neyroxirurgik ishtirokchilar inson va kompyuter avatarlari bilan ijtimoiy ayirboshlash o'yinini o'ynayotganda inson qora moddasining to'rsimon qismi (SNr) va palladiv sharsimon tanachasining ichki qismidagi (GPi) alohida neyronlar faolligini qayd etdik. Biz har bir sinovdagi me'yorlar bashorati xatolarini (nPEs) yoki ijtimoiy bashoratda aqliy ravishda hisoblangan xatolarni baholadik va taxminiy dofaminergik SNr neyronlari nPEs valentligini kodlashini ko'rsatdik, bunda kuchliroq kodlash kompyuter avatar hamkorlariga nisbatan inson avatar hamkorlari bilan o'yin davomida kuzatildi. Bu topilma GPi da kuzatilmadi. Umuman olganda, bizning natijalarimiz SNr neyronlarining ijtimoiy me'yorlarni o'rganishdagi yangi rolini aniqlash orqali SNr haqidagi mavjud bilimlarni kengaytiradi.&lt;/p&gt;\n&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Odamlar tabiatan ijtimoiy mavjudotlardir. Inson xatti-harakatining ijtimoiy tabiatini o'rganish bo'yicha asosiy izlanishlardan biri ijtimoiy guruhlar o'rtasida madaniy jihatdan qabul qilingan qoidalar yoki xatti-harakatlar namunalari sifatida ta'riflanadigan ijtimoiy normalarni idrok etish va ularga munosabat bildirishga qaratilgan. Oldingi ishlar normalarni nisbatan barqaror ijtimoiy idrok sifatida kontseptualizatsiya qilgan. Biroq, yaqinda xatti-harakatlarni hisoblash modeli (kompyuter modellashtirish) odamlarning normalarni idrok etishidagi dinamik va moslashuvchan tabiatini yoritib bera boshladi, bu esa odamlar ijtimoiy signal yoki taklif bilan ichki kutilma o'rtasidagi farq sifatida aniqlanadigan norma bashorati xatolari (nPE) asosida o'zgaruvchan ijtimoiy muhitga moslasha olishini ko'rsatdi. Neyrovizualizatsiya va shikastlanish dalillari nPE'larni kuzatishda oldingi orolcha (anterior insula) va qoriniga xos striatumning rolini ko'rsatdi. Shunga qaramay, ushbu usullarning ayrim cheklovlari (masalan, past fazoviy-vaqtli piksellar soni) tufayli mezolimbik tizimdagi qora modda (SN) kabi chuqur yadro tuzilmalari norma moslashuvida qanday qatnashishi sirligicha qolmoqda.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mezolimbik tizimdagi chuqur yadrolarning ijtimoiy normalarga moslashishdagi roli an'anaviy usullarning cheklovlari tufayli noma'lum bo'lib qolayotgan edi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Norma bashorati xatolari (nPE) — kutilgan ijtimoiy xatti-harakat va real sodir bo'lgan holat o'rtasidagi farq bo'lib, u miyaga o'zgaruvchan qoidalarga moslashishga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Qora moddaning xatti-harakatsdagi roli bo'yicha ko'plab ma'lumotlar hayvonlardagi modellarga yoki neyrodegenerativ kasalliklarga chalingan bemorlardagi invaziv usullarga tayanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;SN funksiyasi haqida biladigan narsalarimizning ko'p qismi hayvonlarda olib borilgan ishlar orqali aniqlangan. Masalan, SN'dan chiquvchi dofaminergik (DA) proyektsiyalar mukofotni o'rganishda asosiy rol o'ynashi yaxshi hujjatlashtirilgan. BOLD fMRT kabi standart noinvaziv usullar yordamida inson SN va kengroq DA tizimini bevosita o'rganish qiyinroq bo'lsa-da, so'nggi tadqiqotlar SN'ning reinforsement (kuchaytirilgan) o'rganishdagi rolini tavsiflash uchun invaziv yozib olish usullaridan (ya'ni yagona neyron yozuvidan) foydalangan. E'tibor bering, SN asosan kamroq GABAergik neyronlarga ega DA neyronlarini o'z ichiga olgan qora moddaning kompakta qismidan (SNc) va asosan nisbatan kamroq DA neyronlarga ega GABAergik neyronlarni o'z ichiga olgan retikulyar qismidan (SNr) iborat. SN'dagi DA va GABAergik neyron populyatsiyalari anatomik belgilarga ko'ra mukammal ajralmaganligini hisobga olsak, inson yagona neyron tadqiqotlari ko'pincha mikrodatchiklar tomonidan yozib olingan DA to'lqin shakllarining xarakterli xususiyatlariga ko'ra taxminiy DA neyron faolligini ajratib oladi, bunda yozib olish joylari SNr yoki SNc sifatida aniqlanmaydi. Shunday qilib, bunday ishlar inson SN'idagi taxminiy DA neyronlari (ehtimol SNr va/yoki SNc) kutilmagan moliyaviy yo'qotishlarga qaraganda kutilmagan moliyaviy yutuqlardan keyin yuqori chastotali impulsatsiyani ko'rsatishini namoyish etdi. Aksincha, ushbu hujayralarning fazali mikrostimulyatsiyasi o'rganishni inhibe qiladi. Ushbu topilmalar SN'ni mukofotni o'rganish bilan bog'laydigan va DA birliklarini mukofot bashorati xatosini kodlash bilan bog'laydigan adabiyotlarga mos keladi. Mukofotni o'rganishdagi ushbu markaziy roldan tashqari, DA faolligi ham odamlarda, ham kemiruvchilarda ijtimoiy xatti-harakatlar uchun muhim ekanligi ko'rsatilgan. Inson farmakologik tadqiqotlari DA faolligi altruizm va egalitar xatti-harakatlarni modulyatsiya qilishini ko'rsatdi. Kemiruvchilar ustida o'tkazilgan tadqiqotlar DA faolligi ijtimoiy bashorat xatosiga o'xshash tarzda notanish turdoshlar haqidagi ma'lumotlarni kodlashini ko'rsatdi. Aksincha, DA disfunksiyasi xatti-harakatlarning moslashuvchan emasligiga, yuqori reaktivlikka va tajovuzkorlikka olib keladi. So'nggi tadqiqotlardan biri ultimatum o'yinini o'ynayotgan paytda odamlarda tez skanerlanuvchi siklik voltametriyadan foydalanib, DA ning ijtimoiy xatti-harakatlardagi rolini, xususan, SNr'da bevosita o'rgandi. Ushbu tadqiqot shuni ko'rsatdiki, SNr'dagi hujayradan tashqari dofamin konsentratsiyasi oldingi va joriy takliflar orasidagi farqlarni kuzatib boradi, bunda sub'ektlar kompyuter avatarlari bilan emas, balki odamlar bilan o'ynaganda yuqori umumiy dofamin konsentratsiyasi kuzatiladi. Shunga qaramay, inson ijtimoiy xatti-harakatida alohida SN neyronlarining roli noma'lumligicha qolmoqda. Umuman olganda, DA tizimining mukofotni o'rganishdagi rolini ko'rsatadigan ishlar korpusini va uning yagona neyron darajasida ijtimoiy xatti-harakatsdagi rolini ko'rsatadigan ishlarni rasman bog'lash qimmatli bo'lar edi.&lt;/p&gt;\n&lt;p&gt;Bu yerda biz SNr neyronlarining ijtimoiy norma xatti-harakatidagi hisoblash rolini aniqlash uchun xatti-harakatlarni hisoblash modeli va inson yagona neyron yozuvlaridan foydalanamiz. Parkinson kasalligi (PD) uchun chuqur miya stimulyatsiyasi (DBS) qurilmasini implantatsiya qilish operatsiyasini o'tkazayotgan ishtirokchilar adolatga munosabatni, shuningdek norma moslashuvini o'rganish uchun ilgari ishlatilgan xatti-harakatlar paradigmasi bo'lgan takroriy ultimatum o'yinini (UG) o'ynayotganda SNr yoki pallidumning ichki segmentidan (GPi) yagona neyron yozuvidan o'tdilar. Umuman olganda, ishtirokchilar odam yoki kompyuter sheriklarining o'zgaruvchan takliflarini qabul qilish yoki rad etishni tanladilar. Avval tavsiflanganidek, ishtirokchilar ko'pincha noqulay takliflarni rad etishdi, lekin vaqt o'tishi bilan hamkorlarning takliflariga (ya'ni ijtimoiy normaga) moslasha olishdi. Xatti-harakatlarni hisoblash modeli shuni ko'rsatdiki, ishtirokchilar kompyuter sheriklariga qaraganda odamlar bilan o'ynaganda yuqoriroq takliflarni kutishgan, bu esa adolat kutilmalari ijtimoiy sherikning shaxsiga bog'liqligini ko'rsatadi. Muhimi shundaki, kutilgan va olingan takliflar orasidagi og'ishlar yo'nalishini bildiruvchi nPE'larning valentligi SNr'dagi taxminiy DA neyronlarining faolligida kodlangan bo'lib, kompyuter avatarlariga qaraganda odam avatarlari bilan o'yin davomida yuqori kodlanish kuzatildi. GPi'dagi shunga o'xshash nazorat tajribasi impulsatsiya chastotasiga nPE valentligining sezilarli ta'sirini aniqlamadi. Ushbu natijalar norma bo'yicha o'rganish signallari ijtimoiy o'zaro ta'sirlar paytida SNr faolligini boshqarishini ko'rsatadi va ushbu faollikning neyrokompüter tavsifini yagona neyron darajasida ta'minlaydi.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"eksperimental-tuzilma\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#eksperimental-tuzilma\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Eksperimental tuzilma&lt;/span&gt;&lt;/a&gt;Eksperimental tuzilma&lt;/h4&gt;\n&lt;p&gt;Biz Parkinson kasalligiga chalingan 19 nafar ishtirokchidan (16 erkak, 3 ayol, yoshi 65 ± 1.93 yil [o'rtacha ± o'rtachaning standart xatosi, SEM], S1-jadval) subtalamik yadroga (STN) chuqur miya stimulyatsiyasi (DBS) implantatsiyasi operatsiyasini o'tkazgan, SNr'dan 27 ta yagona neyron faolligini qayd etish seansini to'pladik (1A-rasm). Yagona neyron faolligini qayd etish davomida ishtirokchilar takliflar vaqt o'tishi bilan dinamik ravishda o'zgarib turadigan ultimatum o'yinining (UG) takroriy versiyasini o'ynadilar. Har bir sinovda ishtirokchilarga xayoliy \"inson\" yoki \"kompyuter\" hamkori tomonidan $20 miqdoridagi summani bo'lish bo'yicha taklif taqdim etildi, buni ular qabul qilishlari yoki rad etishlari mumkin edi (1B-rasm). Agar ishtirokchi taklifni qabul qilsa, har bir tomon taklif qilingan ulushni oldi. Agar ishtirokchi taklifni rad etsa, hech qaysi tomon mukofot olmadi. Takliflar psevdorasmlashtirilgan va normal taqsimlangan bo'lib, 1 dan 9 gacha, o'rtacha taklif hajmi $5 ni tashkil etdi. Ushbu o'yin shuningdek, har bir blokdagi sinovlarning tasodiy 33% qismidan keyin o'zi baholagan kayfiyat reytinglarini o'z ichiga oldi. Xulq-atvor tahlilidan oldin, ma'lumotlar sifatini e'tiborsizlik, uyquchanlik yoki yomon tushunishdan himoya qilish maqsadida bir xil (tekis) xulq-atvorga ega seanslar chiqarib tashlandi. Tekis seanslar deb inson yoki kompyuter blokining umumiy hajmida 2 tadan kam taklif qabul qilingan yoki rad etilgan hamda tanlovning taklif hajmiga nisbatan logistik approksimatsiyasi musbat bo'lmagan qiyalikiga ega bo'lgan seanslar aytildi. SNr kogortasida 3 ta inson avatari bloki va 3 ta kompyuter avatari seansi chiqarib tashlandi. Qo'shimcha ma'lumot olish uchun Materiallar va usullar bo'limiga qarang.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Chuqur miya stimulyatsiyasi (DBS) — miyaning ma'lum tuzilmalariga elektr impulslarini beruvchi elektrodlarni implantatsiya qilish orqali nevrologik kasalliklarni davolash jarrohlik usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ultimatum-oyini-xulq-atvori\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#ultimatum-oyini-xulq-atvori\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ultimatum o'yini xulq-atvori&lt;/span&gt;&lt;/a&gt;Ultimatum o'yini xulq-atvori&lt;/h4&gt;\n&lt;p&gt;Oldingi ishlar sog'lom odamlar adolatsiz takliflarni, ayniqsa inson avatari hamkorlaridan kelgan takliflarni rad etishga ko'proq moyilligini aniqlagan. Shuning uchun biz avvalo aralash effektlar modelini qo'llash orqali ishtirokchilarimizning tanlovlari takliflarning adolatliligi va qaror qabul qilish kontekstiga (inson va kompyuter sharti) qarab qanday farq qilishini o'rganishga harakat qildik. Ushbu modelda ikkilik tanlovlar (rad etish = 0, qabul qilish = 1) taklif hajmi (ya'ni 1, 2 va hokazo), shart (inson = 1, kompyuter = 2) va ushbu omillar orasidagi o'zaro ta'sir orqali, ishtirokchi va ishtirokchi ichidagi seans uchun tasodiy effektlar bilan bashorat qilindi. Faqat taklif hajmining ta'siri tanlovlarga sezilarli darajada ta'sir qildi (taklif, ***p = 8.2e-31, β ± SE = -0.85 ± 0.071; imkoniyatlar nisbati [OR] = 0.43, 95% ishonch oralig'i [CI] [0.37, 0.49]; shart, p = 0.15, β ± SE = -0.93 ± 0.65, OR = 0.40, 95% CI [0.11, 1.41]; taklif × shart, p = 0.21, β ± SE = 0.14 ± 0.12, OR = 1.15, 95% CI [0.92, 1.45]), bu shartlardan qat'i nazar, taklif hajmi oshishi bilan ishtirokchilarning rad etish darajasi pasayganini ko'rsatadi (2A-rasm). Xuddi shu tasodiy effektlarga ega bo'lgan holda shartlar bo'yicha umumiy rad etish darajasini bashorat qiluvchi aralash effektlar modeli shartlar o'rtasidagi umumiy rad etish darajasining farqi ahamiyatli emasligini ko'rsatdi (shart, p = 0.46, β ± SEM = -0.14 ± 0.18; OR = 0.87, 95% CI [0.61, 1.25]) (2B-rasm).&lt;/p&gt;\n&lt;p&gt;O'xshash aralash effektlar modellari umumiy reaksiya vaqtlari (shart, p = 0.29, β ± SEM = 0.43 ± 0.41; OR = 1.53, 95% CI [0.69, 3.41]; S1A-rasm) va kayfiyat reytinglari (shart, p = 0.68, β ± SEM = 1.00 ± 2.41; OR = 2.72, 95% CI [0.023, 320.83]; S1B-rasm) shartlar o'rtasida sezilarli darajada farq qilmaganini ko'rsatdi. Shunga qaramay, darhol oldingi tanlov, shart va ishtirokchi hamda seansning tasodiy effektlari bilan ushbu atamalar o'zaro ta'siri bo'yicha z-skalalashtirilgan kayfiyat reytingini bashorat qiluvchi aralash effektlar modeli z-skalalashtirilgan kayfiyat reytinglari ham inson, ham kompyuter sharoitlarida rad etilgan sinovlarga qaraganda qabul qilingan sinovlardan keyin yuqoriroq bo'lganini ko'rsatdi (tanlov, *p = 0.024, β ± SEM = 0.50 ± 0.22; OR = 1.64, 95% CI [1.07, 2.53]; shart, p = 0.81, β ± SEM = -0.049 ± 0.20; OR = 0.95, 95% CI [0.64, 1.41]; shart × tanlov, p = 0.63, β ± SEM = 0.15 ± 0.31; OR = 1.16, 95% CI [0.62, 2.17]) (2C-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Takliflar hajmi oshishi bilan ishtirokchilarning rad etish ko'rsatkichlari kamaydi (p = 8.2e-31), kayfiyati esa takliflar qabul qilingandan keyin sezilarli darajada yuqori bo'ldi (p = 0.024).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Umuman olganda, ushbu natijalar ishtirokchilar past takliflarga qarshi ekanliklarini va takliflarni rad etgandan so'ng vaqtinchalik salbiy kayfiyat holatlarini boshdan kechirganliklarini ko'rsatadi. Ushbu topilmalar shuni ko'rsatadiki, Parkinson kasalligiga chalinganligiga qaramay va hattoki pul mukofotining rag'batlantiruvchi ta'sirisiz ham, bizning ishtirokchilarimiz sog'lom, yoshroq kattalardagi ultimatum o'yini bo'yicha oldingi topilmalarga asosan o'xshash tarzda harakat qilishdi.&lt;/p&gt;\n&lt;h4 id=\"norma-moslashuvini-modellashtirish\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#norma-moslashuvini-modellashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Norma moslashuvini modellashtirish&lt;/span&gt;&lt;/a&gt;Norma moslashuvini modellashtirish&lt;/h4&gt;\n&lt;p&gt;Keyinchalik, biz rad etish xulq-atvorini va subyektiv norma yangilanishining hisoblash dinamikasini tavsiflash uchun xulq-atvorni hisoblash modellashtirishini amalga oshirdik. Barcha modellashtirish tafsilotlari «Materiallar va usullar» bo‘limida keltirilgan. Qisqacha aytganda, oldingi ishimizga o‘xshab, biz har bir urinishda subyektiv foydalilikni U(t) sifatida olingan taklif va shaxsning norma buzilishiga nisbatan sezgirligi o‘rtasidagi farq sifatida qurdik. Modelda f shaxsning ichki normasini, alfa (α ∈ [0,1]) esa ishtirokchining norma buzilishiga nisbatan sezgirligini (ya’ni, ichki norma va olingan taklif o‘rtasidagi idrok etilgan farqni) ifodalaydi, bunda yuqoriroq α qiymatlari adolatsizlikka nisbatan ko‘proq nafratni anglatadi. Subyektiv foydalilik U(t) softmax funksiyasi orqali tanlov ehtimoli bilan bog‘liq. Biz ichki normalar qanday yangilanishi haqidagi taxminlari bilan farq qiluvchi uchta model sinfini taqqosladik: Rescorla-Wagner (RW) modellari, bunda normalar vaqtinchalik farqlarni o‘rganish yordamida yangilanadi; Bayes modellari, bunda normalar Bayes qoidasiga muvofiq yangilanadi; va Fehr-Schmidt (FS) tengsizlikka nafrat modellari, bunda normalar yangilanmaydi. Har bir sinf ichida individual modellar dastlabki ichki norma (f0) haqidagi taxminlari bilan farq qilar edi, u $10 (teng bo‘linishga mos keladigan qat’iy f0) yoki har bir ishtirokchining xulq-atvoriga moslashtirilgan o‘zgaruvchan dastlabki norma kutuvi (o‘zgaruvchan f0) sifatida belgilanishi mumkin edi. Boshqacha qilib aytganda, agar bir o‘yinchi sessiyani 9 miqdoridagi dastlabki taklif uchun adolat kutuvi bilan boshlasa va boshqa o‘yinchi 11 miqdoridagi dastlabki taklif kutuvi bilan boshlasa, u holda o‘zgaruvchan f0 modeli modelni moslashtirish jarayonida ushbu dastlabki kutuvlarning har birini qamrab olishi kerak. Shunday qilib, o‘zgaruvchan f0 modellarida f0 erkin parametr edi. Bundan tashqari, biz o‘zgaruvchan f0 modellarini ham ko‘rib chiqdik, bunda adolatsizlikka nisbatan sezgirlik α guruhning o‘rtacha α qiymatiga (qat’iy α) tenglashtirilgan; guruhning o‘rtacha α qiymati dastlab erkin parametr sifatida moslashtirilgan α baholarini o‘rtacha hisoblash orqali olingan. Shuning uchun biz jami 9 ta modelni (3 ta model × 3 ta dastlabki ichki norma/alfa spetsifikatsiyasi) ko‘rib chiqdik. O‘zgaruvchan f0 modellari uchun f0 va α ikkalasi ham erkin parametrlar edi. Qat’iy f0 modellari uchun α erkin parametr, f0 esa qat’iy edi. Nihoyat, qat’iy α modellari uchun f0 erkin parametr, α esa qat’iy edi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Modellashtirish shuni ko‘rsatdiki, ishtirokchilarning xulq-atvori eng yaxshi Fehr-Schmidt (FS) tengsizlikka nafrat modeli bilan qat’iy sezgirlik (α) orqali tavsiflanadi, undan keyin qat’iy α bilan Rescorla-Wagner (RW) modeli keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Modellarni har bir ishtirokchining xulq-atvor ma’lumotlariga moslashtirgandan so‘ng, biz individual darajada (SN jadvali, SN ma’lumotlar to‘plami) va guruh darajasida (2D-rasm) olingan minimal Bayes axborot mezoni (BIC) ballini tekshirish orqali moslash sifatini taqqosladik. FS: qat’iy α modeli eng yaxshi moslashuvni ko‘rsatdi, undan keyin RW: qat’iy α modeli keldi (2D-rasm).&lt;/p&gt;\n&lt;p&gt;Bundan tashqari, xulq-atvor klassik RPE (mukofotni bashorat qilish xatosi) tomonidan boshqarilishi mumkinligini o‘rganish uchun biz barcha 9 ta modelni oldingi ishlarga o‘xshash Q-o‘rganish yondashuvi bilan taqqosladik. Klassik Q-o‘rganish algoritmi ushbu muhit dinamikasining hech qanday oldindan modelisiz muhit ichidagi optimal harakat-qiymat funksiyasini o‘rganadi. U buni olingan mukofot va keyingi holatning baholangan qiymati asosida berilgan holatda harakat qilish qiymatini (ya’ni, Q-qiymati) yangilash orqali amalga oshiradi. Bu usul Q-qiymatlarini RPE tomonidan boshqariladigan tarzda bosqichma-bosqich tuzatadi. RPE tomonidan boshqariladigan yangilanishlar mukofot olingandan keyin va keyingi taklif taklif qilinishidan oldin 0 dan 1 gacha bo‘lgan o‘rganish tezligida amalga oshiriladi. Shunday qilib, nPE taklif shaxsning adolat bo‘yicha modelga asoslangan normasidan qanchalik yuqori yoki pastligini tasvirlasa, RPE esa natija oldingi voqealarga asoslangan kutuvga nisbatan qanchalik yuqori yoki pastligini ifodalaydi. Biz barcha 9 ta modelning moslash sifatini Q-o‘rganish yondashuvi bilan minimal umumiy BIC balli bo‘yicha taqqosladik. (Barcha parametr baholari, shuningdek, har bir ishtirokchi va har bir model uchun hasad parametri taqsimotlari uchun SN ma’lumotlar to‘plami va SN jadvaliga qarang). Modellarni taqqoslash shuni ko‘rsatdiki, Q-o‘rganish yondashuvi barcha 9 ta modeldan yomonroq ishladi, bunda FS: qat’iy α va RW: qat’iy α modellari yana eng yaxshi moslashuvni ko‘rsatdi (SN-rasm; individual BIC ballari uchun SN ma’lumotlar to‘plamiga qarang). Bundan tashqari, ushbu natijalar ham inson, ham kompyuter sharoitlari o‘rtasida izchil (SN-rasm). Ushbu natijalar shuni ko‘rsatadiki, bizning vazifamizdagi xulq-atvor klassik Q-o‘rganish bilan emas, balki FS: qat’iy α modelidagi kabi ijtimoiy o‘zgaruvchilarga asoslangan statik afzalliklar yoki RW: qat’iy α modelidagi kabi ijtimoiy ma’lumotlarni vaqt o‘tishi bilan norma kutuvlariga modelga asoslangan kiritish bilan motivatsiya qilinadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Q-o‘rganish — bu agent ijtimoiy normalarga emas, balki bashorat xatolariga (RPE) asoslanib, kelajakdagi mukofotni maksimal darajada oshiradigan harakatlarni tanlashni o‘rganadigan mustahkamlash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Keyinchalik, eng yaxshi mos keladigan ikkita modelning har biri uchun dalillarning kuchini yaxshiroq baholashni osonlashtirish uchun biz ΔBIC, kutilayotgan model chastotasi va himoyalangan oshib ketish ehtimollarini baholadik (SN jadvali). Ushbu tahlillar shuni ko‘rsatdiki, FS: qat’iy α modeli 0,435 kutilayotgan model chastotasi va 0,932 himoyalangan oshib ketish ehtimoli bilan eng past BICga ega edi. RW: qat’iy α modeli 13,707 ΔBIC, 0,174 kutilayotgan model chastotasi va 0,043 himoyalangan oshib ketish ehtimoliga ega edi. Shunday qilib, FS: qat’iy α modelini qo‘llab-quvvatlash uchun umuman olganda ko‘proq dalillar mavjud bo‘lsa-da, ikkita nomzod model o‘rtasidagi eng yaxshi moslashuvda ma’lum bir geterogenlik mavjudligi haqida ham dalillar mavjud, bu o‘rtacha BIC ballari FS: qat’iy α va RW: qat’iy α modellari uchun mos ravishda 10,45 va 10,93 bo‘lganligi bilan izchil.&lt;/p&gt;\n&lt;p&gt;Shundan so'ng biz har bir modelning modelni tiklash (S3-rasm; S4-jadval) orqali qanchalik aniqlanishi mumkinligini o'rganishni davom ettirdik. Modelni tiklash tahlili RW: fixed alpha modeli uchun 45.47% va FS: fixed alpha modeli uchun 37.62% tiklanish ehtimolini ko'rsatdi, bu esa ushbu modellar eng yaxshi mos kelish bo'yicha taqqoslanadigan darajada yaxshi natija ko'rsatgan bo'lsa-da, RW: fixed alpha modeli yuqoriroq aniqlanish darajasini namoyon etganini bildiradi. Har bir sinf ichidagi modellar bo'yicha tiklanish ehtimollarini o'rtacha hisoblash yo'qdan bajarilgan qo'shimcha sinf darajasidagi tiklanish (FS modellari, RW modellari, Bayes modellari, Q-learning) ushbu hisoblash modeli sinflari tomonidan hosil qilingan xulq-atvor bashoratlari bir-biridan farq qilishini yanada tasdiqladi (S5-jadval; S4-rasm). Demak, eng yaxshi mos keladigan ikkita modeldan RW: fixed α modeli modelni tiklashda eng yaxshi aniqlanishni ko'rsatdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RW: fixed α modeli tiklashda eng yaxshi aniqlanishni ko'rsatdi va guruh hamda individual darajada ishtirokchilarning xulq-atvor naqshlarini muvaffaqiyatli takrorladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Keyinchalik biz RW: fixed α modeli parametrlarni tiklash va a posteriori bashoratli tekshiruvlarni o'tkazish orqali tadqiqotimizda kuzatilgan tanlov naqshlarini takrorlashini tekshirdik. Haqiqiy (1-jadval) va simulyatsiya qilingan parametr qiymatlari ushbu modelda sezilarli darajada korrelyatsiya qildi (S5-rasm), bu parametrlarning yaxshi tiklanishidan dalolat beradi. Qolaversa, RW: fixed α modeli ham inson (o'rtacha ± SEM: kuzatilgan: 0.662 ± 0.042; simulyatsiya qilingan: 0.652 ± 0.045), ham kompyuter (kuzatilgan: 0.542 ± 0.050; simulyatsiya qilingan: 0.500 ± 0.065) avatari sharoitlarida umumiy rad etish ko'rsatkichlarini takrorladi (S6A-rasm). RW: fixed α modeli, shuningdek, taklif hajmining rad etish chastotasiga salbiy ta'sirini ham qayta namoyish etdi (S6B-rasm). Nihoyat, RW: fixed α modeli alohida subyekt darajasida xulq-atvorni takrorlashini baholash uchun kuzatilgan va simulyatsiya qilingan sessiyalar uchun individual rad etish ko'rsatkichlari ham solishtirildi va kuchli chiziqli korrelyatsiya aniqlandi (S6C-rasm; Pirsonning momentli-ko'paytma korrelyatsiyasi, ***p = 4.55e-12, r = 0.914, 95% CI 0.823 - 0.959).&lt;/p&gt;\n&lt;p&gt;Modelni muvaffaqiyatli tiklash, parametrlarni tiklash va RW: fixed α modelining tadqiqotimizda guruh va individual darajada kuzatilgan xulq-atvor naqshlarini takrorlash qobiliyati birgalikda ushbu model vazifamizdagi xulq-atvorni boshqaruvchi aqliy modellarni talqin qilish uchun mos kelishiga dalolat beradi.&lt;/p&gt;\n&lt;p&gt;Bundan tashqari, ushbu natijalar adolatsizlikka nisbatan qat'iy sezgirlikka ega vaqtinchalik tafovutli o'rganish ishtirokchilarning vaqt o'tishi bilan yangi ma'lumotlarni o'zlarining norma kutishlariga kiritishini eng yaxshi tushuntirishini ko'rsatadi.&lt;/p&gt;\n&lt;p&gt;RW fixed alpha normani moslashtirish modelini har bir subyektning Ultimatum O'yini (UG) xulq-atvoriga moslashtirish orqali olingan harorat, dastlabki norma va normani moslashtirish tezligi uchun parametr baholari. Inson va kompyuter bloklari alohida moslashtirildi. Inson va kompyuter bloki parametr baholari bir tomonlama U-meyzonlari (Wilcoxon rank sum testlari) yordamida taqqoslandi. Ko'rsatilgan statistika o'rtacha ± o'rtachaning standart xatoligi hisoblanadi. *p &amp;lt; 0.05 va n.s. = bir tomonlama Wilcoxon rank sum testlari bo'yicha ahamiyatsiz. n = inson avatarlari bilan o'yin jarayonining 21 bloki va kompyuter avatari bilan o'yin jarayoni bloklari.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Normani taxmin qilish xatosi (nPE) — bu joriy taklif va insonning kutilmalari orasidagi farq bo'lib, moliyaviy mukofotlar kabi uning kayfiyatiga bevosita ta'sir qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Keyinchalik biz g'olib bo'lgan RW: fixed α modelining parametr qiymatlarini ko'rib chiqdik. Biz ham dastlabki, ham sessiya davomidagi ichki normuslar (f) inson sharoitida kompyuter sharoitidagiga qaraganda yuqoriroq ekanligini aniqladik (2E-rasm; 1-jadval). Xususan, ichki normani sholit, sinov va ushbu shartlarning o'zaro ta'siri bo'yicha bashorat qiluvchi umumiy chiziqli regressiya faqat shart uchun sezilarli ta'sirni ko'rsatdi, bunda ichki normuslar inson sharoitida yuqoriroq bo'ladi (shart, ***p = 8.9e-05, β ± SEM = 2.5 ± 0.64; sinov, p = 0.38, β ± SEM = -0.027 ± 0.030; sinov × shart, p = 0.79, β ± SEM = 0.0097 ± 0.036). Sharoitlar o'rtasida umumiy rad etish farqi yo'qligiga qaramay, ushbu modelga asoslangan tahlil ishtirokchilar kompyuter avatarlariga nisbatan inson avatarlaridan keladigan takliflarga yuqoriroq kutilmalarga ega bo'lganligini ko'rsatadi.&lt;/p&gt;\n&lt;p&gt;Pul mukofotidagi xatolar (PE) oniy hissiyotlarga ta'sir qilishi ko'rsatilganligi sababli, biz buni nPE uchun ham amal qilishini tekshirdik. Biz nPE ni joriy taklif hajmi va oldingi ichki norma o'rtasidagi farqni olish orqali hisobladik. (Tanlov xulq-atvoriga asoslangan nPE baholash misoli uchun S7-rasmga qarang.) Ijobiy/salbiy nPE mos ravishda ichki normadan yuqori/past bo'lgan takliflarni bildiradi. Biz nPE va ulardan darhol keyingi kayfiyat reytinglari o'rtasida sezilarli ijobiy korrelyatsiyani kuzatdik (Pirsonning momentli-ko'paytma korrelyatsiyasi, **p = 0.0012, r = 0.31, 95% CI 0.13 - 0.47) (2F-rasm). Kayfiyat reytinglarini nPE va shart bo'yicha bashorat qiluvchi, sessiya uchun tasodifiy ta'sirga ega aralash effektlar modeli faqat nPE uchun sezilarli qat'iy ta'sirni keltirib chiqardi (nPE, **p = 0.0013, β ± SEM = 0.31 ± 0.09; shart, p = 0.96, β ± SEM = -0.0089 ± 0.18; OR = 1.36, 95% CI [1.13, 1.63]). Qo'shimcha ravishda, nPE-kayfiyat munosabati tanlov hisobga olingandan keyin ham saqlanib qolishini aniqlash uchun biz z-skorlangan kayfiyatni z-skorlangan nPE va tanlov bo'yicha bashorat qiluvchi, sessiya uchun tasodifiy ta'sirga ega aralash effektlar modelini tuzdik. nPE va kayfiyat o'rtasidagi munosabat tanlovni qat'iy ta'sir sifatida kiritilgandan keyin ham sezilarli bo'lib qoldi (nPE, *p = 0.035, β ± SEM = 0.24 ± 0.11; OR = 1.27, 95% CI [1.02, 1.59]), holbuki tanlov kayfiyatga sezilarli ta'sir ko'rsatmadi (tanlov, p = 0.32, β ± SEM = 0.23 ± 0.22; OR = 1.25, 95% CI [0.81, 1.95]). Shunday qilib, shart kayfiyat reytinglariga ta'sir qilmagan bo'lsa-da, nPE kayfiyatga shunday ta'sir qildiki, salbiy nPE kayfiyat reytinglarini pasaytirdi, bu avvalgi ishlar bilan mos keladi.&lt;/p&gt;\n&lt;h4 id=\"snrdagi-taxminiy-da-neyronlari-ijtimoiy-bashorat-xatosi-valentligini-kodlaydi\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#snrdagi-taxminiy-da-neyronlari-ijtimoiy-bashorat-xatosi-valentligini-kodlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SNr'dagi taxminiy DA neyronlari ijtimoiy bashorat xatosi valentligini kodlaydi&lt;/span&gt;&lt;/a&gt;SNr'dagi taxminiy DA neyronlari ijtimoiy bashorat xatosi valentligini kodlaydi&lt;/h4&gt;\n&lt;p&gt;Bizning asosiy maqsadimiz SNr neyronlarining norma moslashuvidagi hisoblash rolini tekshirish edi.&lt;/p&gt;\n&lt;p&gt;Shu sababli, biz keyingi qadamda SNr mikroelektrod yozuvlaridan yagona birlikdagi impulslar (spayklar) faoliyatini ajratib oldik va tahlil qildik.&lt;/p&gt;\n&lt;p&gt;Biz OSORT oflayn saralash algoritmidan foydalangan holda 27 ta SNr mikroelektrod yozuvidan 69 ta taxminiy neyron klasterini aniqladik (har bir yozuv uchun oʻrtacha ± SEM klasterlar: 2,6 ± 0,11). Klasterlar oflayn saralash algoritmi tomonidan yagona manbadan (yaʼni taxminiy neyrondan) kelib chiqadi deb belgilangan spayklar guruhlarini anglatadi. Ushbu 69 ta klasterdan biz 40 ta birlikni oʻtmishdagi ishlarda SN inson yagona birlik yozuvlarida oʻrnatilgan bazaviy oʻrtacha impuls chastotasi (≤15 Gts) va toʻlqin shakli morfologiyasi (davomiyligi &amp;gt;0,8 ms, ikki fazali) mezonlari asosida taxminiy DA neyronlari sifatida tasnifladik (har bir yozuv uchun oʻrtacha ± SEM taxminiy DA birliklari: 1,5 ± 0,18) (3A-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Biz 40 ta taxminiy dofaminergik neyronni aniqladik, ularning faoliyati ijtimoiy bashorat xatolari (nPE) kontekstida tahlil qilindi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Har bir qayd etilgan taxminiy DA neyroni uchun bemorga xos stereotaktik koordinatalar S6-jadvalda keltirilgan.&lt;/p&gt;\n&lt;p&gt;Barcha taxminiy DA neyronlari uchun toʻlqin kengliklari va oʻrtacha impuls chastotalari S7-jadvalda keltirilgan. Har bir ishtirokchi uchun qayd etilgan taxminiy DA neyronlari soni S8-jadvalda keltirilgan. Barcha 40 ta taxminiy DA birligi uchun toʻlqin shakllari va ushbu birliklar uchun oʻrtacha toʻlqin shakli 3B-rasmda tasvirlangan. Har bir birlik uchun biz spayk ketma-ketliklarini uzluksiz impuls chastotalariga tekisladik va populyatsiya tahlillarida birliklar boʻylab impuls chastotalaridagi oʻzgaruvchanlikni hisobga olish uchun ushbu chastotalarni z-ball (z-score) bilan normallashtirdik (S9-rasm). Keyin biz topshiriqdagi xulq-atvor nuqtai nazaridan muhim boʻlgan vaqt nuqtasida, yaʼni takliflar taqdim etiladigan (split reveal) paytda taxminiy DA birliklarining z-normallashtirilgan impuls chastotalarini tekshirdik.&lt;/p&gt;\n&lt;p&gt;Biz taxminiy DA neyronlarining faoliyati nPE ning maʼlum atributlarini, ularning ijtimoiy boʻlmagan oʻrganish signallarini ifodalashdagi maʼlum roliga oʻxshash tarzda kodlashi mumkin deb taxmin qildik. Buni sinab koʻrish uchun biz birinchi navbatda inson va kompyuter sharoitlarida ijobiy va salbiy nPE (mos ravishda ichki normadan yuqori va past) keltirib chiqaradigan urinishlar uchun split reveal dan keyingi 1000 ms davomida taxminiy DA birliklarining oʻrtacha impuls chastotalarini solishtirdik. Mutlaq xom uzluksiz impuls chastotalarini (z-normallashtirishdan oldin) 3C-D rasmlarida koʻring. Split reveal dan keyingi 1000 ms davomida oʻrtacha z-normallashtirilgan impuls chastotalarining ehtimollik zichligi grafiklarini 3E-F rasmlarida koʻring. Biz inson sharoitida taxminiy DA birliklari ijobiy nPE urinishlarida salbiy nPE urinishlariga qaraganda vaqtinchalik spayk faoliyatini koʻproq oshirganini kuzatdik (3C-rasm; 3E-rasm). Bu oʻsish kompyuter sharoitida susaygan (3D-rasm; 3F-rasm). nPE valentligining impuls chastotasiga taʼsirining ahamiyatini tekshirish va ushbu birliklar nPE kattaligini ham kodlashi mumkinligini tekshirish uchun biz har bir sharoitda birlik uchun tasodifiy effekt bilan nPE valentligi (1 = salbiy, 2 = ijobiy), nPE kattaligi va ushbu atamalar oʻrtasidagi oʻzaro taʼsirlar boʻyicha split reveal dan keyingi 1000 ms davomida DA birligi faoliyatini bashorat qiluvchi aralash effektli modelni qurdik (3G-H rasmlari; 2-jadval). Inson sharoitida nPE valentligi uchun qatʼiy effekt impuls chastotasining yagona muhim bashoratchisi edi (nPE valentligi, **p = 0,008, β ± SEM = 0,19 ± 7,3e-02, 95% CI [0,05, 0,34]; 3G-rasm; boshqa baholar uchun 2-jadvalga qarang).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;nPE (norm prediction error) — norma bashorati xatosi; natijaning ishtirokchi kutganidan qanchalik farq qilishini koʻrsatadi. Aralash effektli modellar umumiy qonuniyatlarni (qatʼiy effektlar) va individual farqlarni (tasodifiy effektlar) hisobga olishga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot invaziv mikroelektrodlar yordamida odamlarda oʻtkazilgan; neyron faoliyati va nPE valentligi oʻrtasidagi korrelyatsiya ushbu tajriba doirasida toʻgʻridan-toʻgʻri sabab-oqibat bogʻliqligini isbotlamaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Umuman olganda, ushbu topilmalar shuni koʻrsatadiki, SNr taxminiy DA birliklari nPE valentligini kodlaydi, bunda inson sharoitida koʻproq kodlash kuzatiladi, bu SNr neyronlarining ijtimoiy maʼlumotlarni kuzatishining noyob neyron mexanizmini taʼminlaydi.&lt;/p&gt;\n&lt;p&gt;Inson yoki kompyuter sharoitida split reveal dan keyingi ms davomida SNr taxminiy DA birliklarining guruh faoliyatini norma bashorati xatosi (nPE) kattaligi, nPE valentligi va ularning tegishli oʻzaro taʼsir atamalari bashorat qiladigan aralash effektli modellarning qisqacha mazmuni. **p &amp;lt; 0,01 aralash effektli model boʻyicha. Std. Error = standart xatolik. n = inson sharoitida 31 ta taxminiy DA neyroni va kompyuter sharoitida 16 ta taxminiy DA neyroni.&lt;/p&gt;\n&lt;h4 id=\"gpidagi-taxminiy-neyronlar-ijtimoiy-bashorat-xatosi-valentligini-kodlamaydi\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#gpidagi-taxminiy-neyronlar-ijtimoiy-bashorat-xatosi-valentligini-kodlamaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GPi'dagi taxminiy neyronlar ijtimoiy bashorat xatosi valentligini kodlamaydi&lt;/span&gt;&lt;/a&gt;GPi'dagi taxminiy neyronlar ijtimoiy bashorat xatosi valentligini kodlamaydi&lt;/h4&gt;\n&lt;p&gt;SNr taxminiy birlik faoliyatida kuzatilgan nPE kodlash effekti bazal gangliya (BG) yadrolari bo'ylab keng tarqalgan faollashuvni aks ettirishi mumkin. Ushbu effektning anatomik o'ziga xosligini o'rganish uchun biz boshqa BG yadrosi — GPi'da DBS operatsiyasini o'tkazgan neyroxirurgiya ishtirokchilarining yana bir kohortasida shunga o'xshash tajriba o'tkazdik (5 erkak, n = 3 PD va n = 2 distoniya bemorlari, yoshi 53 ± 8,5 yil; Rasm SN9A). Ushbu 5 ishtirokchidan biz faqat inson bloki bilan UG ning 5 ta sessiyasini va ham inson, ham kompyuter bloklari hamda kayfiyat reytinglari bilan UG sessiyalarini to'pladik. Ushbu guruhda rad etish darajasi taklif hajmi oshishi bilan kamaydi, shartlar o'rtasida sezilarli farqlar kuzatilmadi (Rasm SN9B). Taklif hajmi bo'yicha binar tanlovlarni bashorat qiluvchi logistik regressiya modeli sezilarli effektni aniqladi (taklif, ***p = 1,9e-14, β ± SEM = 1,3 ± 0,17), bu pastroq takliflarga qaraganda yuqoriroq takliflarni qabul qilish ehtimoli yuqoriligini ko'rsatadi. SNr yozib olish guruhi bilan taqqoslashni osonlashtirish uchun biz ushbu sessiyalar uchun nPE'larni SNr kohortasidan olingan g'olib model, ya'ni belgilangan alfa bilan RW o'zgaruvchan boshlang'ich norma modeli yordamida baholadik.&lt;/p&gt;\n&lt;p&gt;Biz 7 ta yozib olish sessiyasidan 19 ta taxminiy birlikni aniqladik (yozib olish bo'yicha o'rtacha ± SEM klasterlari: 2,7 ± 0,29). Barcha 19 ta taxminiy GPi neyronlari uchun to'lqin shakli kengligi va o'rtacha o't olish tezligi Jadval SN10'da keltirilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;16 ta GPi neyronini tahlil qilish faoliyatning nPE valentligi yoki kattaligi bilan bog'liqligini aniqlamadi, bu ushbu sohada bashorat xatosini kodlash yo'qligini ko'rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Barcha 19 ta taxminiy GPi birliklari uchun to'lqin shakllari va ushbu birliklar uchun o'rtacha to'lqin shakli Rasm SN9C'da tasvirlangan. Biz SNr birlik tahlillarida amalga oshirilgan protokolga muvofiq spike ketma-ketliklarini uzluksiz o't olish tezligiga tekisladik. Keyin biz GPi taxminiy birlik faoliyatini split reveal'dan keyingi 1000 ms davomida nPE valentligi, nPE kattaligi va ularning o'zaro ta'siri bilan aralash effektli regressiya yordamida bog'ladik, bu inson holatida split reveal'da SNr taxminiy DA birlik faoliyatini bashorat qilish uchun ishlatilgan regressiya bilan bir xil. Ushbu model kompyuter holati uchun tuzilmadi, chunki faqat ikkita o'yinchi kompyuter bloki bilan UG'ni yakunladi. Shuni ham ta'kidlash kerakki, 19 ta taxminiy birlikdan 16 tasi barcha takliflar qabul qilingan xulq-atvor sessiyasida yozib olingan; shuning uchun ushbu sessiyada xulq-atvor modellashtirilmagan, natijada nPE valentligi, kattaligi va ularning o'zaro ta'siri bilan bog'liq tahlil uchun jami 16 ta taxminiy GPi birligi qoldi. Ushbu regressiya ushbu o'zgaruvchilar yoki ularning o'zaro ta'siri uchun hech qanday sezilarli effektlarni aniqlamadi (Jadval 3).&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 3.&lt;/strong&gt; Ochilish vaqtida barcha ichki pallidum (GPi) taxminiy neyronlari faolligini bashorat qiluvchi aralash effektli model xulosasi.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Fixed effect&lt;/th&gt;\n&lt;th&gt;Estimate&lt;/th&gt;\n&lt;th&gt;Std. error&lt;/th&gt;\n&lt;th&gt;t-value&lt;/th&gt;\n&lt;th&gt;p-value&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Inson&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Intercept&lt;/td&gt;\n&lt;td&gt;0.09446&lt;/td&gt;\n&lt;td&gt;0.04858&lt;/td&gt;\n&lt;td&gt;1.944&lt;/td&gt;\n&lt;td&gt;0.0545&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;nPE magnitude&lt;/td&gt;\n&lt;td&gt;-0.01331&lt;/td&gt;\n&lt;td&gt;0.01224&lt;/td&gt;\n&lt;td&gt;-1.087&lt;/td&gt;\n&lt;td&gt;0.2775&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;nPE valence&lt;/td&gt;\n&lt;td&gt;0.17970&lt;/td&gt;\n&lt;td&gt;0.15304&lt;/td&gt;\n&lt;td&gt;1.174&lt;/td&gt;\n&lt;td&gt;0.2409&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;nPE magnitude x nPE valence&lt;/td&gt;\n&lt;td&gt;-0.18235&lt;/td&gt;\n&lt;td&gt;0.09359&lt;/td&gt;\n&lt;td&gt;-1.948&lt;/td&gt;\n&lt;td&gt;0.0519&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Inson holatida split reveal'dan keyingi 1000 ms davomida barcha GPi birliklarining guruh faoliyatini bashorat qiluvchi normativ bashorat xatosi (nPE) kattaligi, nPE valentligi va ularning tegishli o'zaro ta'sir shartlari bo'yicha aralash effektli modelning qisqacha mazmuni. Std. Error = standart xato. n = 16 ta taxminiy neyron inson holatida.&lt;/p&gt;\n&lt;p&gt;GPi neyronlari va SNr neyronlari natijalari o'rtasidagi taqqoslashni osonlashtirish uchun, populyatsiyalar o'rtasidagi to'lqin shakli va o't olish tezligi farqlari kamroq ta'sir qilishi uchun, ushbu 16 ta GPi taxminiy birligidan 8 tasi qayta tahlil uchun tanlab olindi, bunda o't olish tezligi va to'lqin shakli uzunligi mezonlari SNr taxminiy DA birliklarinikiga moslashtirildi. Biz yana GPi taxminiy birlik faoliyatini split reveal'dan keyingi 1000 ms davomida nPE valentligi, nPE kattaligi va ularning o'zaro ta'sir shartlari bilan faqat inson holatida aralash effektli regressiya orqali bog'ladik. Ushbu regressiya ushbu o'zgaruvchilar yoki ularning o'zaro ta'siri uchun hech qanday sezilarli effektlarni aniqlamadi (Jadval 4). (Inson holatida nPE valentligi bo'yicha split reveal'dagi o'rtacha o't olish tezligini vizualizatsiya qilish uchun Rasm SN6D'ga qarang.) Ushbu populyatsiyada statistik jihatdan sezilarli effektning yo'qligi, albatta, ushbu hududda yozib olingan birliklarning cheklangan namuna hajmi bilan bog'liq bo'lishi mumkin. Shunday qilib, ushbu cheklovni hisobga olgan holda, natijalarimiz shuni ko'rsatadiki, SNr'dagi taxminiy DA neyronlari namunamiz nPE valentligini kodlashni ko'rsatsa-da, bu naqsh GPi'dan olingan taxminiy birliklar namunamizda, hatto to'lqin shakli va o't olish tezligi mezonlari bo'yicha moslashtirilganda ham sezilarli darajada kuzatilmadi.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 4.&lt;/strong&gt; Ochilish vaqtida to'lqin shakli va impuls chastotasi moslashtirilgan ichki pallidum (GPi) taxminiy neyronlari faolligini bashorat qiluvchi aralash effektli model xulosasi.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Fixed effect&lt;/th&gt;\n&lt;th&gt;Estimate&lt;/th&gt;\n&lt;th&gt;Std. error&lt;/th&gt;\n&lt;th&gt;t-value&lt;/th&gt;\n&lt;th&gt;p-value&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Inson&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Intercept&lt;/td&gt;\n&lt;td&gt;0.088536&lt;/td&gt;\n&lt;td&gt;0.080590&lt;/td&gt;\n&lt;td&gt;1.099&lt;/td&gt;\n&lt;td&gt;0.2771&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;nPE magnitude&lt;/td&gt;\n&lt;td&gt;-0.004832&lt;/td&gt;\n&lt;td&gt;0.020630&lt;/td&gt;\n&lt;td&gt;-0.234&lt;/td&gt;\n&lt;td&gt;0.8150&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;nPE valence&lt;/td&gt;\n&lt;td&gt;0.478699&lt;/td&gt;\n&lt;td&gt;0.268627&lt;/td&gt;\n&lt;td&gt;1.782&lt;/td&gt;\n&lt;td&gt;0.0761&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;nPE magnitude x nPE valence&lt;/td&gt;\n&lt;td&gt;-0.276125&lt;/td&gt;\n&lt;td&gt;0.164248&lt;/td&gt;\n&lt;td&gt;-1.681&lt;/td&gt;\n&lt;td&gt;0.0941&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Aralash effektli modelning qisqacha mazmuni, bunda nPE kattaligi, nPE valentligi va ularning tegishli o'zaro ta'sir shartlari inson holatida split reveal'dan keyingi 1000 ms davomida GPi birliklarining (to'lqin shakli va o't olish tezligi mezonlari bo'yicha SNr taxminiy DA birlik guruhiga moslashtirilgan) guruh faoliyatini bashorat qildi. Std. Error = standart xato. n = 8 ta taxminiy neyron inson holatida.&lt;/p&gt;\n&lt;h4 id=\"snrdagi-taxminiy-da-neyronlari-kayfiyat-signallarini-kodlamaydi\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#snrdagi-taxminiy-da-neyronlari-kayfiyat-signallarini-kodlamaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SNr'dagi taxminiy DA neyronlari kayfiyat signallarini kodlamaydi&lt;/span&gt;&lt;/a&gt;SNr'dagi taxminiy DA neyronlari kayfiyat signallarini kodlamaydi&lt;/h4&gt;\n&lt;p&gt;Nihoyat, PE'lar ilgari lahzali kayfiyatga ta'sir qilishi ko'rsatilganligini hisobga olgan holda, biz SNr taxminiy DA neyronlarining faoliyati subyektiv kayfiyatni kuzatib borishini tekshirdik. Biz kayfiyat reytinglaridan oldingi 1000 ms davomida taxminiy DA birliklarining o't olish tezligi z-ballangan kayfiyat reytinglari bilan sezilarli darajada korrelyatsiya qilinmaganligini kuzatdik (Pearson mahsulot-moment korrelyatsiyasi, p = 0,16, r = -0,09, 95% CI -0,21 – 0,03) (Rasm SN10). Ushbu davrda DA birligi guruh faoliyatini kayfiyat reytingi bo'yicha bashorat qiluvchi aralash effektli model, birlik uchun tasodifiy effekt bilan, kayfiyat reytingi uchun sezilarli effektni aniqlamadi (kayfiyat reytingi, p = 0,16, β ± SEM = -0,027 ± 0,019), bu korrelyatsiya testi natijalariga mos keladi. Ushbu topilmalar shuni ko'rsatadiki, SNr taxminiy DA neyronlari nPE valentligiga javob bersa-da, ular kayfiyat reytinglarini kodlamaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot klinik sharoitda odamlarda (PD va distoniya bemorlari) o'tkazildi, bu natijalarni sog'lom odamlarga umumlashtirishni cheklaydi; neyronlarning kichik namuna hajmi effektlarning yo'qligini talqin qilishda ehtiyotkorlikni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;p&gt;Joriy tadqiqot inson SNr qismidagi alohida neyronlar ijtimoiy o'rganish va kayfiyat signallarini qanday kodlashini o'rgandi. Xulq-atvor nuqtai nazaridan, biz ishtirokchilar ko'pincha noldan farqli takliflarni rad etishganini aniqladik, bu UGdagi rad etish xulq-atvori ob'ektiv foydalilik bilan emas, balki sub'ektiv foydalilik bilan boshqarilishini ko'rsatadigan oldingi ishlar bilan mos keladi; bu sub'ektiv foydalilik taklifning ma'lum bir shaxs uchun uning norma kutishlari va adolatsiz tengsizlikka nisbatan shaxsiy sezgirligini hisobga olgan holda qanchalik qadrli ekanligini aks ettiradi. Ushbu xulq-atvor hatto kompyuter avatarlari bilan o'yin davomida ham saqlanib qoldi, bu kamroq ijtimoiy kontekstlarda ijtimoiy fikrlashning ma'lum darajada mavjudligini ko'rsatadi, bu ishtirokchilar tanlovini tushuntirishda ijtimoiy norma modellarining ijtimoiy bo'lmagan mukofotni o'rganishga nisbatan ustunligi bilan tasdiqlanadi. Ijtimoiy norma modellashtirish shuni ko'rsatdiki, ishtirokchilar kompyuterlarga qaraganda odamlardan adolat kutishlari yuqoriroq bo'lgan va nPE ularning lahzali kayfiyatiga ta'sir qilgan. Neyron darajasida, substantia nigra neyronlari tajriba qilingan nPE valentligini kuzatib borgan, inson avatari sharoitida kuchliroq kodlash kuzatilgan; bu neyronlar lahzali kayfiyatni kodlamagan. Umuman olganda, ushbu topilmalar substantia nigraning ijtimoiy o'rganish signallarini kodlashdagi asosiy rolini belgilaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot shuni tasdiqlaydiki, substantia nigra ijtimoiy o'rganish signallarini kodlashda markaziy rol o'ynaydi, ijtimoiy o'zaro ta'sirda esa xulq-atvorni ob'ektiv emas, balki sub'ektiv foydalilik belgilaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Birinchidan, natijalarimiz hisoblash modellashtirishning kuzatilgan o'xshash xulq-atvorlar qanday qilib turli xil yashirin ruhiy jarayonlardan kelib chiqishi mumkinligini ochib berishdagi foydasini namoyish etadi. Garchi rad etish darajalari inson va kompyuter avatari sharoitlarida o'xshash bo'lsa-da, bizning modelimiz ushbu tanlovlar dastlabki norma kutishlari, adolatsizlikka sezgirlik, tanlov o'zgaruvchanligi va normaga moslashish kabi yashirin o'zgaruvchilar tomonidan xabardor qilinganligini ko'rsatadi. Xususan, kompyuter avatarlari bilan solishtirganda inson avatarlari bilan o'yin davomida yuqoriroq dastlabki va sessiya davomidagi ichki normalar kuzatildi, bu esa tanlov xulq-atvoriga ta'sir qiluvchi adolat kutishlari haqiqatan ham hamkorning shaxsiga bog'liqligini ko'rsatadi. Natijada, kuchli parametr tiklanishi va posterior bashoratli tekshiruvlar bilan mustahkamlangan ushbu modellashtirish yondashuvi, faqat xom rad etish darajalari asosida aniq bo'lmaydigan tanlov xulq-atvoriga ta'sir qiluvchi mazmunli yashirin jarayonlarni yoritib beradi.&lt;/p&gt;\n&lt;p&gt;Bundan tashqari, natijalarimiz SNr neyronlarining ijtimoiy va ijtimoiy bo'lmagan o'rganish sohalarida valentlikni kodlashdagi muhim rolini ta'kidlaydi. Oldingi ishlar SNning mukofotni qayta ishlash va mustahkamlash orqali o'rganishdagi rollarini aniqladi, bunda DA faoliyati ijtimoiy bo'lmagan kontekstlarda xatolikni bashorat qilishni kodlash bilan bog'liq. Neyroxirurgik bemorlarda o'tkazilgan shunday tadqiqotlardan biri shuni ko'rsatdiki, SN taxminiy dopaminergiya neyronlari populyatsiyasi kutilmagan yutuqlarga nisbatan yo'qotishlarga qaraganda yuqoriroq otilish tezligini namoyish etadi, bu bizning tadqiqotimizda kuzatilgan ijtimoiy kontekstlarda nPE valentligini kodlashga o'xshab, otilish tezligi va kattalik o'rtasida statistik jihatdan sezilarli bog'liqlik dalillarisiz. Bundan tashqari, odam bo'lmagan primatlarda o'rta miya DA neyronlari ijtimoiy bo'lmagan kontekstlarda ijobiy xatolik signallariga maxsus javob berishi kuzatilgan. Natijalarimiz ushbu ishni kengaytirib, uyg'oq odamlarda ushbu mukofot bilan bog'liq alohida SNr neyronlari inson avatarlari bilan o'yin davomida ijobiy va salbiy nPElarga javoban kuchaygan faollikni ko'rsatishini tasdiqlaydi, bu esa ushbu taxminiy DA birliklari aynan ijtimoiy sohada bashorat xatosi valentligini kodlashini ko'rsatadi. Taxminiy DA SNr neyronlarining otilish tezligida kuzatilgan valentlik kodlashi, ehtimol, ko'tariluvchi aksonal proyeksiyalar orqali striatumdagi DA konsentratsiyasiga ta'sir qiladi. Ushbu faoliyat, shuningdek, inson voltammetriyasi yordamida inson va kompyuter avatarlari bilan o'zaro ta'sirlar davomida SNrda yuqori DA konsentratsiyasini aniqlagan yaqinda o'tkazilgan oldingi ishlar bilan mos ravishda, DAning mahalliy dendritik ajralishi orqali nigral faoliyatga ta'sir qilishi mumkin. Bundan tashqari, bizning tadqiqotimizda qayd etilgan taxminiy dopaminergiya SNr neyronlari aynan nPE valentligiga javob bersa-da, bizning topilmalarimiz boshqa neyronlar kattalikni kodlashi mumkinligini inkor etmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;nPE (norm prediction error) — bu kutilgan va haqiqiy ijtimoiy normalarga rioya qilish o'rtasidagi nomuvofiqlik signali bo'lib, miya uni kutishlarni tuzatish uchun ishlatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bashorat xatolarini kayfiyat bilan bog'laydigan oldingi ishlar bilan mos ravishda, bizning topilmalarimiz shuni ko'rsatadiki, nPE lahzali kayfiyat holatlariga ta'sir qilsa va ushbu nPElarning valentligi SNr neyron faoliyatida kodlangan bo'lsa-da, kayfiyatdagi o'zgarishlar, ehtimol, inson miyasining boshqa joylaridagi neyron faoliyatida aks etadi. Natijalarimiz SNning tarkibiy va funktsional anomaliyalarini hissiy buzilishlar va simptomlar bilan, shuningdek, intrakranial signallarni ijtimoiy baholash signallari bilan bog'laydigan yaqinda o'tkazilgan inson tadqiqotlarini kengaytirib, hissiy jihatdan bezovta qiluvchi ijtimoiy o'zaro ta'sirlar davomida uyg'oq odamlarda to'g'ridan-to'g'ri qayd etilgan alohida SNr neyronlaridan olingan dalillarni taqdim etadi. Shunday qilib, biz ushbu neyronlarning ijtimoiy kontekstlarda o'rganish signallarini kayfiyat bilan bog'lashdagi rolini belgilab, SN adabiyotiga hissa qo'shamiz.&lt;/p&gt;\n&lt;p&gt;Ayniqsa, tahlillarimiz GPi, ya'ni bazal gangliyalarning qo'shni yadrosi tomonidan nPE signallarini sezilarli neyron kuzatuvini aniqlamadi. Ushbu topilma ushbu hududda mukofotga nisbatan alohida birliklarning juda kam javob berishini ko'rsatadigan ishlar bilan mos keladi.&lt;/p&gt;\n&lt;p&gt;Olgan natijalarimizni quyidagi cheklovlarni hisobga olgan holda talqin qilish lozim. Tadqiqot qatnashchilari asosan erkaklar va keks yoshdagi shaxslar bo‘lib, bu Parkinson kasalligi (PK) bo‘yicha chuqur miya stimulyatsiyasi (DBS) operatsiyasiga uchrash ehtimoli yuqori bo‘lgan bemorlarga xosdir. Shu sababli, bizning tadqiqotimiz ijtimoiy me’yorlarni qayta ishlashdagi jins yoki yoshga bog‘liq farqlarni hisobga olmasligi mumkin. Bu qatnashchilarning barchasida ham PK mavjud bo‘lib, u xulq-atvor qat’iyligi, ruhiy egiluvchanlikning yo‘qligi va strategiyalar endi foydali bo‘lmay qolganda kognitiv strategiyalarni o‘zgartirish qobiliyatining pasayishi bilan tavsiflanadi. PK patologiyasi, shuningdek, biz nishonga olgan miya hududlariga ta’sir ko‘rsatib, kamaygan dopaminergik kirish tufayli SNr va GPi neyronlarida giperaktivlikni keltirib chiqaradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Cheklovlar: tadqiqot faqat dori qabul qilmagan keksa yoshdagi Parkinson kasalligiga chalingan erkaklarda o‘tkazilgani sababli, natijalarni sog‘lom odamlarga tatbiq etib bo‘lmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bu bemorlar bizning tadqiqotimizda dopaminergik dorilarni qabul qilmagan holda («off» holatida) qatnashadilar, bu esa o‘qish va qaror qabul qilishni o‘zgartirishi mumkin bo‘lgan dorilar ta’sirisiz, saqlanib qolgan taxminiy dopaminergik SN neyronlarining ijtimoiy me’yorlarni o‘rganishdagi rolini tekshirishni osonlashtiradi; biroq, bu bemorlarda dopaminergik signal uzatishi dastlab dopamin kamaygan holatda yuzaga keladi, ya’ni ushbu tadqiqot natijalari yangi bo‘lsa-da, sog‘lom shaxslarning dopaminergik zanjirlariga nisbatan umumlashtirilmasligi mumkin. PK patologiyasi keltirib chiqargan xulq-atvor va neyronal o‘zgarishlar bizning natijalarimizga qanday ta’sir qilishini aniqlash uchun PKga chalingan va chalinmagan shaxslardan olingan ma’lumotlarni solishtirish maqsadga muvofiq bo‘lar edi. Xulq-atvor natijalarini UG o‘yinidan foydalangan boshqa tadqiqot qatnashchilarining ma’lumotlari bilan solishtirish mumkin bo‘lsa-da, yagona birlik neyronal ma’lumotlari bunday yozuvlarning yuqori darajada invaziv tabiati tufayli solishtirish uchun unchalik oson topilmaydi. Shunga o‘xshash sabablarga ko‘ra, bu tadqiqot ishtirokchilarining tanlanma hajmi bo‘yicha cheklangan. Qo‘shimcha ravishda, ishtirokchilarning ushbu cheklangan tanlanmasidan barcha mavjud tegishli ma’lumotlardan foydalanish maqsadida, ushbu tadqiqot ham inson, ham kompyuter sharoitida o‘ynaganlar hamda faqat inson sharoitida o‘ynaganlarning ma’lumotlarini o‘z ichiga oladi, bu esa sharoit ta’sirida nomutanosiblikni keltirib chiqaradi. Shuningdek, ushbu tadqiqot SNda qayd etilgan yollg‘iz neyron faolligi striatumdagi dopamin darajasiga qanday tarjima qilinishini aniq belgilash qobiliyatida cheklangan; bunday ajratish SN yagona birligini yozib olish va striatumda bir vaqtning o‘zida voltamperometrik yozib olish orqali amalga oshirilishi mumkin edi. Nihoyat, ushbu tadqiqot ijtimoiy me’yorlarni qayta ishlashda bu neyronlarning sababiy rolini ko‘rsatmaydi; stimulyatsiya yoki boshqa pertubatsiya usullaridan foydalangan kelgusi ishlar sababiylikni to‘g‘ridan-to‘g‘ri hal qilishi mumkin.&lt;/p&gt;\n&lt;p&gt;Umuman olganda, bizning ishimiz odamning ijtimoiy bashorat qilishdagi xatolarni tan olish qobiliyati uchun neyron asosni taklif qiladi, bu esa SNning klassik tarzda o‘rganilgan mukofotni o‘rganishdagina emas, balki me’yoriy ijtimoiy xulq-atvorni o‘rganishdagi rolini ham qo‘llab-quvvatlaydi.&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"etika-va-ishtirokchilar\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#etika-va-ishtirokchilar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Etika va ishtirokchilar&lt;/span&gt;&lt;/a&gt;Etika va ishtirokchilar&lt;/h4&gt;\n&lt;p&gt;Ushbu tadqiqot Mount Sinai shahridagi Icahn tibbiyot maktabining Institutsional tekshiruv kengashi tomonidan ma'qullangan. Tadqiqot natijasida hech qanday nojo'ya hodisalar yuz bermadi. Ushbu tadqiqotda 24 nafar neyroxirurgiya bemori (21 erkak, 3 ayol, o'rtacha yosh ± SEM = 62 ± 2,4 yil; S1 jadvali) ishtirok etdi. Chuqur miya stimulyatsiyasi (DBS) operatsiyasiga rozilik bergandan so'ng, yetakchi neyroxirurgimiz tomonidan tadqiqotda ishtirok etish uchun mos deb topilgan bemorlarga ushbu tadqiqotda ishtirok etish haqida ma'lumot olish imkoniyati berildi. Agar qiziqish bildirilsa, bemorlarga tadqiqot, uning muolajaga ta'siri va har qanday potentsial xavflar haqida ma'lumot berildi.&lt;/p&gt;\n&lt;p&gt;Ularga, shuningdek, xulq-atvor vazifasi haqida qisqacha kirish, jumladan ko'rsatmalar va ikkita sinov namunasi taqdim etildi. Bemorlarga ishtirok etganliklari uchun pul mukofoti olmasliklari ma'lum qilindi. Buning o'rniga, ularga $20 ni inson yoki kompyuter avatari hamkorlari bilan takroriy ravishda bo'lishishni tasavvur qilish topshirildi. Barcha ma'lumotlar yozma rozilik olinishidan oldin savollar va tushuntirishlar uchun yetarli vaqt bilan og'zaki va yozma shaklda taqdim etildi.&lt;/p&gt;\n&lt;h4 id=\"dbs-operatsiyasi-va-yagona-birlikdagi-yozuv\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#dbs-operatsiyasi-va-yagona-birlikdagi-yozuv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;DBS operatsiyasi va yagona birlikdagi yozuv&lt;/span&gt;&lt;/a&gt;DBS operatsiyasi va yagona birlikdagi yozuv&lt;/h4&gt;\n&lt;p&gt;DBS qurilmasini implantatsiya qilish uchta operatsiya davomida amalga oshirildi, jumladan chap yarim shar elektrodini implantatsiya qilish, o'ng yarim shar elektrodini implantatsiya qilish va batareyani implantatsiya qilish. Ushbu operatsiyalar taxminan 2-4 hafta oralig'ida o'tkazildi. Ishtirokchilarga elektrod implantatsiyasi operatsiyalaridan birida yoki ikkalasida ham tadqiqotda qatnashish imkoniyati berildi. Operatsiya vaqtida ishtirokchilar standart klinik protokolga muvofiq kamida 9 soat davomida dori-darmonlarni qabul qilmagan edilar.&lt;/p&gt;\n&lt;p&gt;DBS operatsiyasida bemorlar klinik elektrodni nishonga olish va sinovdan o'tkazish uchun uyg'otilganda (bu odatda elektrod implantatsiyasidan taxminan 10 daqiqa o'tgach sodir bo'lgan), klinik muolaja yagona birlikdagi yozuv va vazifani bajarish uchun qisqa muddatga to'xtatildi. Bizning yetakchi neyroxirurgimiz volfram mikroelektrodini quvvat bilan ishlaydigan mikrodrayv va traktografiya yordamida yozib olish nishoniga joylashtirdi. Mikroelektrodni neyron otilishining o'ziga xos belgilari bilan aniqlangan yozib olish nishon hududlariga joylashtirgandan so'ng, neyroxirurg barqaror spike faoliyati mavjudligini tasdiqlaguncha elektrod holatini o'zgartirdi. Neyron ma'lumotlari Alpha Omega elektrofiziologik yozib olish tizimi yordamida yozib olindi. Subtalamik yadroda DBS operatsiyasini o'tkazayotgan bemorlar uchun yagona birlikdagi yozuvlar substantia nigra pars reticulata (SNr; 1A-rasm) dan to'plandi. Globus pallidus internus (GPi) da DBS operatsiyasini o'tkazayotgan bemorlar uchun yagona birlikdagi yozuvlar ham GPi dan to'plandi (S9A-rasm). Yozuvlar to'plangandan so'ng, klinik stimulyator sinov va yakuniy implantatsiya uchun klinik nishon hududiga qayta joylashtirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Yagona birlikdagi yozuv (single-unit recording) — bu alohida neyronlarning elektr faoliyatini mikroelektrodlar yordamida qayd etish usuli bo'lib, miya hujayralarining ishlashini tushunishga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;SNr kohortasi Parkinson kasalligi bilan og'rigan 19 nafar ishtirokchini (16 erkak, 3 ayol, yoshi 65 ± 1,93 yil) o'z ichiga oladi. GPi kohortasi Parkinson kasalligi yoki distoniya bilan og'rigan 5 nafar ishtirokchini (5 erkak, 0 ayol, yoshi 53 ± 8,5 yil) o'z ichiga oladi. Yagona birlikdagi yozuv davomida ishtirokchilar ko'rish doirasida joylashgan kompyuter monitorida vizualizatsiya qilingan xulq-atvor vazifasini bajardilar. Ishtirokchilar o'z javoblarini o'yin kontrolleri qutisi bilan yubordilar. Jami biz SNr kohortasidan 27 ta va GPi kohortasidan 7 ta sessiyani to'pladik.&lt;/p&gt;\n&lt;h4 id=\"ultimatum-oyini\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#ultimatum-oyini\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ultimatum o'yini&lt;/span&gt;&lt;/a&gt;Ultimatum o'yini&lt;/h4&gt;\n&lt;p&gt;Har bir yagona birlikdagi yozib olish sessiyasida ishtirokchilar ijtimoiy adolat normalari va norma moslashuvini baholash uchun ishlatiladigan Ultimatum o'yinini (UG) o'ynadilar (1B-rasm). Ishtirokchilar UG ning ikkita versiyasidan birini o'ynadilar: faqat inson (n = 15 sessiya, SNr kohortasidan 10 bemor; n = 5 sessiya, GPi kohortasidan 3 bemor) va inson va kompyuter shartlari bilan to'liq versiya (n = 12 sessiya, SNr kohortasidan 9 bemor; n = 2 sessiya, GPi kohortasidan 2 bemor).&lt;/p&gt;\n&lt;p&gt;Faqat inson versiyasida ishtirokchilarga \"inson\" avatar hamkorlari tomonidan $20 ni bo'lishish bo'yicha takliflar qayta-qayta taqdim etiladi, ular buni qabul qilishlari yoki rad etishlari mumkin edi. Agar ishtirokchi qabul qilsa, har bir tomon taklif qilingan summani oladi. Agar ishtirokchi rad etsa, har bir tomon 0 oladi. Har bir sinov boshida ishtirokchilarga avval avatar ko'rsatiladi (1,5-2,5 s). Keyin ishtirokchilarga 20 ni bo'lishish taklifi taqdim etiladi (\"bo'lishishni ochish\"; 1 s). Tanlov tugmalari (qabul qilish/rad etish) taklif qilingan bo'lishish ostida paydo bo'ladi va ishtirokchilarni tanlov qilishga undaydi (o'z sur'atida). Tanlov qilingandan so'ng, tanlangan variant ekran har bir tomon olgan dollar miqdorini ko'rsatish uchun o'zgarmaguncha 1 soniya davomida ajratilgan holda qoladi (\"bo'lishish natijasi\"; 1,5 s). Barcha takliflar 9 yoki undan kam edi va takliflar 1 dan $9 gacha normal taqsimot bilan psevdo-tasodifiy tarzda amalga oshirildi. Tanlovlar kelajakdagi takliflarga ta'sir qilmadi. O'yinchilar taklif tuzilmasidan oldindan xabardor emas edilar. Har bir sinovda yangi inson avatari tomonidan yangi taklif kiritildi. Inson avatarlari irqiy va madaniy xilma-xillikni aks ettirish uchun ism, jins va jismoniy xususiyatlari bilan farq qilardi. Bemorlar 30 ta sinovni yakunladilar, bu taxminan 5 daqiqa davom etdi.&lt;/p&gt;\n&lt;p&gt;Inson va kompyuter shartlari bilan to'liq versiyada ishtirokchilar inson avatar hamkorlari bilan 30 ta UG sinovini, shuningdek, \"kompyuter\" hamkorlari bilan qo'shimcha 30 ta sinov blokini o'ynadilar. Blok tartibi muvozanatli edi, shuning uchun 5 nafar ishtirokchi inson blokini kompyuter blokidan oldin, 7 nafar ishtirokchi esa kompyuter blokini inson blokidan oldin o'ynadi. Bundan tashqari, ishtirokchilar tanlov sinovlarining tasodifiy 33% dan keyin o'z-o'zini baholash kayfiyatini (o'z sur'atida) to'ldirdilar. Ushbu kayfiyatni baholashni yakunlash uchun ishtirokchilar o'zlarining hozirgi kayfiyatini baxtsiz yuzdan (0 deb kodlangan) baxtli yuzgacha (100 deb kodlangan) shkalada tanladilar. Ekranda taqdim etishning ikkita kichik detali UGdagidan biroz farq qildi: bo'lishishni ochish tanlov tugmalari bilan bir vaqtda paydo bo'ldi va bo'lishish natijasi 1,5 s o'rniga 1 s davom etdi. Umuman olganda, UG ning ushbu versiyasi taxminan 10 daqiqa davom etdi.&lt;/p&gt;\n&lt;h4 id=\"chiqarib-tashlash-mezonlari\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#chiqarib-tashlash-mezonlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Chiqarib tashlash mezonlari&lt;/span&gt;&lt;/a&gt;Chiqarib tashlash mezonlari&lt;/h4&gt;\n&lt;p&gt;Ma'lumotlar sifatini diqqatsizlik yoki uyquchanlik tufayli yuzaga kelishi mumkin bo'lgan xatolardan himoya qilish uchun topshiriq ko'rsatmalariga amal qilinmagan barcha sessiyalar xulq-atvor tahlilidan chiqarib tashlandi. Bularga «yassi» xulq-atvorli sessiyalar kiradi, ya'ni inson yoki kompyuter bloki davomida 2 tadan kam taklif qabul qilingan yoki rad etilgan sessiyalar. Ushbu chora ishtirokchilar barcha takliflarni qabul qilgan sessiyalarni samarali ravishda chiqarib tashladi, bu esa modelni moslashtirish uchun zarur bo'lgan tanlov o'zgaruvchanligini ta'minlaydi. Shuningdek, binar tanlovning taklif hajmiga bog'liqligi bo'yicha logistik moslashuv musbat bo'lmagan qiyalik koeffitsientiga ega bo'lgan sessiyalar ham chiqarib tashlandi, bu taklif hajmi oshishi bilan uni qabul qilish ehtimoli oshmasligini anglatadi. Agar kayfiyat reytinglari «yassi» bo'lsa, ular tahlildan chiqarib tashlandi, ammo xulq-atvor tanlovi bo'yicha ma'lumotlar tahlilda qoldirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Yassi» xulq-atvor yoki reytinglar ishtirokchi javoblarida o'zgaruvchanlik yo'qligini anglatadi, bu esa qaror qabul qilish jarayonini matematik modellashtirishni imkonsiz qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;«Yassi» kayfiyat reytinglariga ega xulq-atvor sessiyalari — bu minimal va maksimal reytinglar o'rtasidagi farq 10 balldan kam bo'lgan sessiyalardir. SNr kogortasida 3 ta UG va 3 ta UG-bot sessiyalari «yassi» tanlov tufayli xulq-atvor tahlilidan chiqarib tashlandi. Qo'shimcha ravishda, 2 ta UG-bot sessiyasi «yassi» reytinglar tufayli kayfiyat reytinglari tahlilidan chiqarib tashlandi.&lt;/p&gt;\n&lt;p&gt;GPi kogortasida 1 ta UG sessiyasi «yassi» tanlov tufayli xulq-atvor tahlilidan, 1 ta UG-bot sessiyasi esa kayfiyat reytinglari tahlilidan chiqarib tashlandi.&lt;/p&gt;\n&lt;h4 id=\"xulq-atvorni-hisoblash-modellashtirish\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#xulq-atvorni-hisoblash-modellashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulq-atvorni hisoblash modellashtirish&lt;/span&gt;&lt;/a&gt;Xulq-atvorni hisoblash modellashtirish&lt;/h4&gt;\n&lt;p&gt;Barcha ma'lumotlarni tozalash, xulq-atvor tahlillari va hisoblash modellari MATLAB va RStudio dasturlarida amalga oshirildi. Modelga bog'liq bo'lmagan tahlillar quyidagilarni o'z ichiga oldi: blok turi (inson/kompyuter) bo'yicha umumiy rad etish darajasi, taklif hajmiga nisbatan rad etish darajasi, blok turi bo'yicha umumiy reaksiya vaqti, blok turi bo'yicha umumiy kayfiyat reytingi va tanlovga nisbatan kayfiyat reytingi (qabul qilish/rad etish).&lt;/p&gt;\n&lt;p&gt;Keyinchalik, foydalilik, qaror qabul qilish ehtimolligi va normalar adaptatsiyasini modellashtirish uchun ilgari qo'llanilgan modellar tanlov ma'lumotlariga moslashtirildi. Birinchidan, biz har bir urinishdagi almashinuv foydaliligini tengsizlikka qarshilik ko'rsatish foydaliligi uchun Fehr-Schmidt (FS) tenglamasidan foydalangan holda ifodaladik: &lt;span class=\"yfm-latex\" data-content=\"U_i(s_i)%20%3D%20s_i%20-%20%5Calpha%20%5Ccdot%20%5Cmax%5C%7Bf_i%20-%20s_i%2C%200%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Bu yerda taklifning (s_i) foydaliligi (U_i) s_i va ishtirokchining ichki normasi (f_i) bilan s_i o'rtasidagi farq hamda ishtirokchining noqulay tengsizlikka sezgirligi (&lt;span class=\"yfm-latex\" data-content=\"%5Calpha%20%5Cin%20%5B0%2C1%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, «alfa») ko'paytmasi o'rtasidagi farqga teng. Alfa ishtirokchining o'sha urinishda ichki normadan pastroq taklifni qabul qilishni istamasligini aks ettiradi. α ning yuqori qiymatlari adolatsizlikka nisbatan ko'proq nafratni anglatadi. Qulay tengsizlikka sezgirlik («aybdorlik») bu paradigmada kerak emas, chunki barcha takliflar $9 yoki undan kam.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Fehr-Schmidt (FS) modeli — bu xulq-atvor iqtisodiyotida insonning adolatsiz taqsimotdan qochish uchun shaxsiy foydasidan voz kechishga tayyorligini miqdoriy baholaydigan matematik yondashuv.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;So'ngra biz softmax funksiyasidan foydalangan holda har bir taklifni qabul qilish ehtimolini modellashtirdik: &lt;span class=\"yfm-latex\" data-content=\"p_i(s_i)%20%3D%20%5Cfrac%7Be%5E%7B%5Cbeta%20U_i(s_i)%7D%7D%7B1%20%2B%20e%5E%7B%5Cbeta%20U_i(s_i)%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Ushbu funksiya har bir taklifning foydaliligini va ishtirokchining tanlovlari o'zgaruvchanligini aks ettiruvchi teskari harorat (&lt;span class=\"yfm-latex\" data-content=\"%5Cbeta%20%5Cin%20%5B0%2C1%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;) parametrini hisobga oladi. β ning past qiymatlari ko'proq o'zgaruvchan tanlovlarni anglatadi.&lt;/p&gt;\n&lt;p&gt;FS modellarida norma statik, o'zgarmas metrika hisoblanadi. Ichki norma adaptatsiyasini modellashtirish uchun biz ushbu kogorta xulq-atvoriga eng yaxshi mos keladigan ikki sinf norma adaptatsiyasi modellarini solishtirdik: vaqt farqi asosida o'rganishdan kelib chiqadigan Rescorla-Wagner (RW) modellari va Bayes kuzatuvchi modellari. Ikkala norma adaptatsiyasi modeli sinfi ham ichki norma vaqt o'tishi bilan rivojlanib borishini nazarda tutadi; biroq ular normani yangilash qoidalarida farqlanadi.&lt;/p&gt;\n&lt;p&gt;RW modellari — bu agent noaniq muhitda mukofotni maksimallashtiradigan harakatlarni amalga oshirishni o'rganadigan mustahkamlash asosidagi yondashuvdir. RW modellarida norma quyidagicha yangilanadi: &lt;span class=\"yfm-latex\" data-content=\"f_i%20%3D%20f_%7Bi-1%7D%20%2B%20%5Cvarepsilon(s_i%20-%20f_%7Bi-1%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Bu yerda i urinishdagi ichki norma (f_i) oldingi urinishdagi normaga (fi-1) va norma adaptatsiyasi tezligi (&lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon%20%5Cin%20%5B0%2C1%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;) hamda taklif (s_i) va oldingi urinishdagi ichki norma (fi-1) o'rtasidagi farq (yoki nPE) ko'paytmasining yig'indisiga teng. &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; taklifning (s_i) rivojlanayotgan ichki normaga (f_i) ta'sir qilish darajasini aks ettiradi.&lt;/p&gt;\n&lt;p&gt;Boshqa tomondan, Bayes modellari kuzatilgan ma'lumotlar asosida model parametrlari bo'yicha ehtimollik taqsimotini baholaydigan statistik yondashuvdan kelib chiqadi. Biz har bir ishtirokchi takliflarni noma'lum o'rtacha va dispersiya bilan tavsiflangan normal taqsimotdan kelib chiqadi deb modellashtiradi deb faraz qilamiz. Ishtirokchida o'rtacha (µ) va dispersiya (σ²) bo'yicha dastlabki apriori taqsimot mavjud va bu apriori taqsimot har bir yangi taklif bilan yangilanadi. µ va σ² ni hisobga olgan holda, takliflar (X) quyidagicha aniqlanadi: X / µ, σ² ~ N(µ, σ²). Birinchi taklifni (s_i) olgandan so'ng va p(µ, σ²) apriori taqsimotni nazarda tutgan holda, aposteriori taqsimot quyidagicha aniqlanadi: p(µ, σ² / s_i) = p(s_i / µ, σ²)p(µ, σ²).&lt;/p&gt;\n&lt;p&gt;Kon'yugatsiyalangan apriori taqsimot quyidagicha aniqlanadi: p(µ, σ²) = P₁(µ / σ²)P₂(σ²), p₁(µ / σ²) = NormalDensity(µ / µ₀, σ² k₀), p₂ = Inv-X²(σ² v₀). Keyinchalik, barcha keyingi takliflardan so'ng, aposteriori taqsimotlar iterativ ravishda quyidagicha aniqlanadi: &lt;span class=\"yfm-latex\" data-content=\"k_%7Bi%2B1%7D%20%3D%20k_i%20%2B%201%2C%20%5Cnu_%7Bi%2B1%7D%20%3D%20%5Cnu_i%20%2B%201\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &
