        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"97\" cy=\"159\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"663\" cy=\"208\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · GENOMICS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Gormonlar autizm va miya&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;rivojlanishi genlariga&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qanday ta'sir qiladi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-f1.jpg\" alt=\"1-rasm: 17𝜷-estradiol-x-neyrorivojlanish buzilishi xavf genlarining ta'sirini baholovchi ikki tizimli, yirik miqyosli, k\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: 17𝜷-estradiol-x-neyrorivojlanish buzilishi xavf genlarining ta'sirini baholovchi ikki tizimli, yirik miqyosli, ko'p modalli skrining quvurining eksperimental umumiy ko'rinishi. Estradiol bilan davolash va neyrorivojlanish buzilishi (NDD) xavf genlaridagi funksiyani yo'qotuvchi mutatsiyalarning ta'siri uchta modalities orqali o'lchanadi: (1) hiPSC-dan olingan NGN2-induktsiyalangan glutamatergik neyronlarda (iGLUTs) bir hujayrali RNAseq, (2) iGLUTs da neyron kalsiy tasvirlash va (3) lichinka zebrafishda sensorimotor va uyg'onish xulq-atvori. Modalliklar bir-biriga mos keladigan, ammo mustaqil gen to'plamlarini o'z ichiga oladi. ASD/NDD maqsadli genlari ko'plab funksiyalarni, jumladan gen ekspresiyasini regulyatsiya qilish (pushti), neyron funksiyasi va aloqasi (yashil), hujayra signallari va oqsil modifikatsiyasi (kulrang) va sitoskeletni (ko'k) o'z ichiga oladi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Jinsiy gormonlar miya faoliyatidagi farqlarning asosiy omillaridan biri hisoblanadi, biroq ularning genetik buzilishlardagi roli kam o'rganilgan. Tadqiqotchilar estradiolning autizm va rivojlanish buzilishlari bilan bog'liq 36 ta gen mutatsiyasiga ega neyronlarga ta'sirini tekshirdilar. Ma'lum bo'lishicha, gormon genlar ekspressiyasi darajasidagi buzilishlarni qisman tekislaydi, ammo faqat ayrim mutatsiyalar uchun neyronlarning ortiqcha faolligini pasaytiradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Estradiol autizm xavfining 36 ta geni bo'yicha sinovdan o'tkazildi&lt;/li&gt;\n&lt;li&gt;ASH1L va SCN2A genlari gormonga nisbatan maksimal sezuvchanlikni ko'rsatdi&lt;/li&gt;\n&lt;li&gt;Gormon gen ekspresiyasini to'g'rilaydi, lekin tanlab qo'zg'aluvchanlikni pasaytiradi&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Jinsiy gormonlarning asab tizimi patologiyalariga ta'sirini tushunish uchun tadqiqotchilar insonning induksiyalangan pluripotent o'zak hujayralaridan olingan neyronlar va danio-rerio baliqlari lichinkalaridan foydalandilar. Tajribada CRISPR tizimi yordamida autizm xavfi yuqori bo'lgan 36 ta yirik gen o'chirib qo'yildi. Bu genlar transkripsiyani boshqarish, sinaptik uzatish va sitoskelet tuzilishi uchun javobgardir. 100 nanomol konsentratsiyadagi estradiol bilan bir sutkalik ishlov berish molekulyar javob turli mutatsiyalar uchun ham umumiy, ham o'ziga xos mexanizmlarni o'z ichiga olishini ko'rsatdi.&lt;/p&gt;\n&lt;p&gt;Tahlil umumiy effektni aniqladi: estradiol barcha o'rganilgan liniyalarda buzilgan gen ekspressiyasi profilini qisman tiklaydi. Biroq, tarmoqlarning elektr faolligini normallashtirish tanlab amalga oshirildi. ASH1L va SCN2A genlaridagi mutatsiyalar terapiyaga nisbatan eng yuqori sezuvchanlikni ko'rsatib, inson neyronlarida molekulyar va hujayrali xususiyatlarning, shuningdek baliqlardagi xulq-atvor reaksiyalarining to'liq tiklanishini ta'minladi. Gormonga eng ko'p javob beradigan yettita gen oqsil o'zaro ta'sirining zich tarmog'ini hosil qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ish in vitro hujayra madaniyatlari va danio-rerio baliqlari modellarida bajarilgan bo'lib, mustaqil ekspertiza ko'rilmagan preprint hisoblanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Neyrotaraqqiyot jarayonida jinsiy gormonlar signallari autizm spektridagi buzilishlarni o'z ichiga olgan neyrotaraqqiyot kasalliklari uchun xavf modulyatori vazifasini bajarishi mumkin. Ushbu ta'sirlarni har tomonlama o'rganish maqsadida mualliflar inson induksiyalangan pluripotent o'zak hujayralaridan olingan neyronlar va zebrafish lichinkalari yordamida funksional jihatdan xilma-xil bo'lgan 36 ta yirik autizm spektridagi buzilishlar va neyrotaraqqiyot genlarining funksiyasini yo'qotish mutatsiyalariga estradiolning ta'sirini tizimli va ko'p bosqichli baholadilar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Inson induksiyalangan pluripotent o'zak hujayralari oddiy teri yoki qon hujayralarini ma'lum genetik nuqsonlarga ega bo'lgan neyronlarga aylantirish va ularni laboratoriyada o'rganish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ish davomida transkriptomik, tarmoq va xulq-atvor darajasida genlar va estradiol o'rtasidagi umumiy hamda turlicha o'zaro ta'sirlar aniqlandi. Ma'lum bo'lishicha, estradiol barcha o'rganilgan genlar nokauti tufayli yuzaga kelgan buzilgan ekspressiya imzo naqshlarini qisman yumshatishga qodir. Biroq u tarmoqning haddan tashqari qo'zg'aluvchanligi fenotiplarini faqatgina ayrim gen nokautlari guruhidagina tanlab va tezda bostiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Estradiol barcha 36 ta o'rganilgan xavf genlari uchun transkriptom buzilishlarini umumiy tarzda tuzatadi, lekin neyron tarmoqlarining haddan tashqari qo'zg'aluvchanligini faqat ayrimlarida tanlab normallashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;p&gt;Ayniqsa ASH1L va SCN2A genlari estradiol bilan davolashga eng yuqori sezgirlikni ko'rsatdi. Ular uchun inson nokaut neyronlarida molekulyar va hujayrali ko'rsatkichlarning sezilarli darajada tiklanishi, shuningdek, zebrafish mutant lichinkalarida xulq-atvor fenotiplarining muvaffaqiyatli kompensatsiyasi qayd etildi. Estradiolga eng ko'p javob beradigan yettita gen oqsil-oqsil o'zaro ta'siri tarmog'ining kuchaygan bog'liqligini, tug'ilgandan keyingi ma'lum davrlarda kuchli ko-ekspressiyani va yuqori qatlamdagi yetuk qo'zg'atuvchi neyronlarda boyitilganligini ko'rsatdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot inson hujayra modellari va zebrafish baliqlarida o'tkazilgan bo'lib, olingan natijalarning klinik ahamiyatini tasdiqlash uchun sutemizuvchilar va klinik namunalar yordamida qo'shimcha tadqiqotlar talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Umuman olganda, ushbu ish tanlangan xavf genlarining funksiyasini yo'qotish sharoitida umumiy transkriptomik ta'sirlarni, shuningdek, gen-spetsifik hujayra va xulq-atvor qutqarilishini yoritib beruvchi turli modaliklardagi estradiol ta'sirini tavsiflaydi.&lt;/p&gt;\n&lt;h3 id=\"kirish1\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#kirish1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"estradiolning-neyron-funksiyalarini-boshqarishdagi-roli\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#estradiolning-neyron-funksiyalarini-boshqarishdagi-roli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Estradiolning neyron funksiyalarini boshqarishdagi roli&lt;/span&gt;&lt;/a&gt;Estradiolning neyron funksiyalarini boshqarishdagi roli&lt;/h4&gt;\n&lt;p&gt;Estradiol miya faoliyatida muhim o‘rin tutib, neyrogenez, neyronlar qo‘zg‘aluvchanligi, sinaptik plastika va xulq-atvorni ham qo‘zg‘atuvchi, ham tormozlovchi zanjirlarda tartibga soladi. Bu ta’sirlar ikki mexanizm orqali amalga oshiriladi. Genom mexanizmi estradiolning yadroviy retseptorlar (ERα va ERβ) bilan bog‘lanishini o‘z ichiga oladi, ular transkripsiya omillari sifatida ishlaydi va genlar ifodasini soatlar yoki kunlar davomida o‘zgartiradi. Muhimi, miyadagi ERα nishonlari autizm spektrining buzilishlari (ASB) va neyrorivojlanish buzilishlari (NVB) bilan bog‘liq genlarga boy. Tezkor no-genom mexanizmi esa GPER1 kabi membrana retseptorlarini ishga solib, ikkilamchi messenjerlar va ion oqimlarini (masalan, kalsiy) daqiqalar ichida faollashtiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Estradiol miya faoliyatini sekin genomik va tezkor no-genomik yo‘llar orqali modulyatsiya qiladi, uning nishonlari ko‘pincha ASB/NVB bilan bog‘liq genlar bilan kesishadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ASB/NVB — miya rivojlanishiga ta’sir qiluvchi genetik va muhit omillari bilan bog‘liq bo‘lgan holatlar guruhi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tadqiqotlar shuni ko‘rsatadiki, estradiol ASB/NVB xavf genlaridagi mutatsiyalar keltirib chiqargan nuqsonlarni tuzatishi mumkin. Masalan, u CNTNAP2 mutatsiyasiga ega zebrafish baliqlarida giperaktivlikni bostiradi, NRXN1 mutatsiyali inson neyronlarida (hiPSC) signal yo‘llarini tiklaydi va DYRK1A yetishmovchiligi bo‘lgan boshoyoqlilarda hujayra proliferatsiyasini normallashtiradi. Biz ushbu ishda 17β-estradiolning 36 ta yuqori xavfli gen (jumladan, ANK2, CHD8, PTEN, SHANK3 va b.) bilan bog‘liq fenotiplarga ta’sirini multimodal skrining yordamida baholaymiz (1-rasm).&lt;/p&gt;\n&lt;h4 id=\"tadqiqot-usullari\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#tadqiqot-usullari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot usullari&lt;/span&gt;&lt;/a&gt;Tadqiqot usullari&lt;/h4&gt;\n&lt;p&gt;Mutatsiyalar va estradiol o‘rtasidagi o‘zaro ta’sirni o‘rganish uchun biz CRISPR texnologiyalaridan foydalandik. Biz genlar ifodasini (1-SN rasm: 36 ta gen) va inson induksiyalangan glutamatergik neyronlaridagi (iGLUTs) neyron faolligini (2-SN rasm: 15 ta gen) tahlil qildik. In vivo sensorimotor xulq-atvor va qo‘zg‘aluvchanlik zebrafish lichinkalarida tekshirildi (3-SN rasm: 31 ta gen bazaviy darajada, 4 ta gen estradiol bilan davolanganda). scn1lab geni uchun RNA-seq, miya faolligini xaritalash va tutqanoq testlari o‘tkazildi. Tahlillar shuni ko‘rsatdiki, ASH1L va SCN2A mutatsiyalari estradiol bilan tuzatishga eng moyil bo‘lgan genlardir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;iGLUTs — bemorning o‘zak hujayralaridan olingan va glutamat orqali qo‘zg‘atuvchi signallarni uzatishga ixtisoslashgan neyronlar. Nokaut — gen funksiyasini o‘rganish uchun uni «o‘chirish» usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"natijalar1\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#natijalar1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"estradiol-rescues-transcriptional-effects-of-asd/ndd-risk-genes\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#estradiol-rescues-transcriptional-effects-of-asd/ndd-risk-genes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Estradiol rescues transcriptional effects of ASD/NDD risk genes&lt;/span&gt;&lt;/a&gt;Estradiol rescues transcriptional effects of ASD/NDD risk genes&lt;/h4&gt;\n&lt;p&gt;Autizm va neyrorivojlanish xavf genlari (ASD/NDD) doirasida estradiolning umumiy va o'ziga xos transkriptomik ta'sirlarini o'rganish uchun mualliflar funksiyani yo'qotish (LOF) ta'siri tasdiqlangan 36 ta shunday genni tanlab oldilar (1-1-rasm, SI 1-jadval). Diqqat markaziga 22 ta gen ekspressiyasi regulyatorlari, jumladan epigenetik modifikatorlar, xromatin regulyatorlari va transkripsiya omillari kiritildi: ARID1B, ASH1L, ASXL3, BCL11A, CHD2, CHD8, CREBBP, FOXP2, KDM5B, KDM6B, KMT2C, KMT5B (SUV420H1), MBD5, MED13L, PHF12, PHF21A, POGZ, SETD5, SIN3A, SKI, SMARCC2, WAC. Shuningdek, 7 ta neyron aloqa geni (sinaptik genlar va ion kanallari: CACNA1G, GRIA3, GRIN2A, NRXN1, SCN2A, SHANK3, SLC6A1), 3 ta hujayra signallash geni (CUL3, PPP2R5D, PTEN) va 4 ta sitoskelet geni (ANK2, ANK3, DPYSL2, DYRK1A) kiritildi. Genlarni tanlash jinsiy farqlarga asoslanmagan; ularning ko'pchiligi erkaklar va ayollarda o'xshash penetrantlikka ega (SI 1-jadval).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR-KO usuli va yagona hujayra sekvenirashi (ECCITE-seq) yordamida ko'plab maqsadli genlarni bir vaqtning o'zida o'chirish va har bir alohida hujayraning transkriptomik javobini aniq baholash mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Lentiviral CRISPR-KO kutubxonasi oldindan tasdiqlangan yo'naltiruvchi RNKlar (gRNA) asosida yaratilgan bo'lib, har bir gen uchun uchtadan to'rttagacha gRNA ni o'z ichiga olgan (SI 2 va SI 3-jadvallar). Ulardan 29 tasi tadqiqotchilarning avvalgi ishida kiritilgan va tasdiqlangan edi. Biz inson induced pluripotent o'zak hujayralaridan (hiPSC) olingan neyral o'zak hujayralarida (NPC) ikkita nazorat donoridan (bitta erkak, bitta ayol, SI 1A-rasm) va funksional yetuk iGLUT neyronlarida bitta erkak donordan olingan (2-rasm, SI 1A-rasm) CRISPR gen nokauti yondashuvini (2Ai-rasm) qo'lladik. Hujayralar estradiol (100 nM, 24 soat davomida, retseptorlar ekspressiyasi SI 2-rasmda, doza bo'yicha tahlillar SI 3A-rasmda) yoki nazorat eritmasi (DMSO) bilan ishlov berildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tajribalar inson hujayra modellari (hiPSC dan olingan NPC va iGLUT) yordamida o'tkazilgan bo'lib, ular neyrorivojlanishning faqat ayrim jihatlarini in vitro takrorlaydi va butun organizmga nisbatan ehtiyotkorlik bilan talqin qilinishi kerak.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;gRNA larni to'g'ridan-to'g'ri aniqlash yagona hujayra RNK sekvenirashi (ECCITE-seq) bilan birlashtirilib, turli hujayra turlari va estradiol sharoitlaridagi ta'sirlar taqqoslandi (gRNA lar SI 4-rasmda tasdiqlangan). Filtrlash va sifat nazoratidan so'ng jami 16 ta ASD/NDD nokautlari va nazorat namunalari bo'yicha 39 278 ta hujayra tahlil qilindi: 7067 ta nazorat NPC, 5553 ta E2 NPC, 14 471 ta nazorat iGLUT va 12 187 ta E2 iGLUT (SI 1B, C-rasmlar, SI 4-jadval). Maqsadli genni kamaytirish filtratsiyasini vaznli eng yaqin tarmoqlar tahlili (WNN) bilan birlashtirib, muvaffaqiyatli o'zgarishlarga uchragan hujayralar aniqlandi va gRNA hamda gen ekspressiyasi profillarining boyishiga ko'ra klasterlarga ajratildi. Ushbu strategiya har bir gRNA uchun iGLUT da o'rtacha 234 ta va NPC da 198 ta, iGLUT da esa 39 ta hujayrani taqdim etdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Keng ko'lamli CRISPR-KO va ECCITE-seq skriningi orqali qariyb 40 mingta hujayrada estradiol (100 nM) ta'sirida 16 ta ASD/NDD gen nokautlari uchun hujayra klasterlari muvaffaqiyatli aniqlandi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"nokaut-va-estradiolning-transkriptom-profillariga-tasiri\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#nokaut-va-estradiolning-transkriptom-profillariga-tasiri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nokaut va estradiolning transkriptom profillariga ta'siri&lt;/span&gt;&lt;/a&gt;Nokaut va estradiolning transkriptom profillariga ta'siri&lt;/h4&gt;\n&lt;p&gt;CRSPR-KO usuli yordamida 75 tadan ortiq hujayralarda aniqlangan 28 ta neyroprotektor va 28 ta neyro-o'tmashchi (NPC) gRNA aniqlandi. O'rtacha hisobda genlar nokauti iGLUT neyronlarida nishon genlarning 22% ga, NPC hujayralarida esa 26% ga kamayishiga olib keldi, bu hujayra populyatsiyalaridagi nonsense vositachiligidagi parchalanishning gogenogenligi tufayli haqiqiy effektni past baholashi mumkin. Transkriptomik signaturalar nokaut, estradiol va ularning o'zaro ta'sir effektlarini ajratish uchun nishonga olmaydigan nazorat (NT) klasterlari bilan taqqoslandi (2Ai-rasm). Boshlang'ich bosqichda har bir ASD/NDD xavf geni har bir nishon genining buzilish darajasidan qat'i nazar, umumiy va o'ziga xos tabaqalashtirilgan ekspressiyalangan genlarni (DEG, FDR &amp;lt; 0.05) keltirib chiqardi (2B-rasm, S1D-rasm). Ikki yoki undan ortiq gRNA muvaffaqiyatli nishonga olgan o'nta ASD/NDD geni uchun DEG larning kuchli korrelyatsiyasi kuzatildi (Pirson korrelyatsiyasi 0.66–0.87, S4B-rasm).&lt;/p&gt;\n&lt;p&gt;Nokaut va nazorat o'rtasidagi barcha sezilarli farqlar uchun (p &amp;lt; 0.05) mualliflar quyidagi tasnifni kiritdilar: kuchaygan (exacerbated) — yuqori ahamiyatga ega bo'lgan bir xil yo'nalishdagi pertürbatsiya; o'zgarmagan (unchanged) — yo'nalish yoki ahamiyatda o'zgarish yo'qligi; qisman tiklanish (partial rescue) — original yo'nalishda zaifroq pertürbatsiya; tiklangan (rescued) — mutant va nazorat o'rtasidagi sezilarli farqlarning yo'qolishi; va o'ta to'g'rilangan (over-corrected) — original fenotipga teskari yo'nalishdagi farq. Estradiolning DEG (FDR &amp;lt; 0.05) va biologik yo'llarga (FDR &amp;lt; 0.05) ta'siri barcha nokautlar bo'yicha baholandi. Estradiol 13 ta o'rganilgan nokautda DEG larni tikladi, garchi tiklanish darajasida geterogenlik mavjud bo'lsa ham (iGLUT FDR &amp;lt; 0.05, tiklangan DEG foizi bo'yicha tartiblangan, 2D-rasm; NPC nominal p &amp;lt; 0.05, S1E-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Estradiol 13 ta tekshirilgan nokautda transkriptomik profillarni samarali tiklaydi, bunda ASH1L va SCN2A genlari eng yuqori barqarorlikni ko'rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu tahlilda estradiolning multimodal tiklash ta'siriga ega bo'lgan ikkita asosiy gen ajratib ko'rsatildi: ASH1L va SCN2A. Asosiy nokaut effektlarini estradiol bilan davolangan nokaut effektlari bilan taqqoslash shuni ko'rsatdiki, estradiol mutatsiyalarning salbiy ta'sirini yumshatadi; nokaut effektlari va estradiol effektlari salbiy korrelyatsiyaga ega (S5-rasm, yuqori va pastki panellar). Oldingi tahlillarda NDD/ASD xavf genlari o'rtasidagi downstream ta'sirlar yetuk iGLUT larda eng ko'p ekanligi ko'rsatilgan edi. Kutilmaganda, tiklangan DEG lar tiklanmaganlarga qaraganda estrogen retseptorlari nishonlari bilan boyitilmagan, bu esa qisman bo'lsa ham, noegenomik signal yo'llari orqali amalga oshishini bildiradi (2C-rasm, S6A, S6C-G-rasmlar).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Noegenomik signal yo'llari — bu hujayra yadrosidagi transkripsiyani to'g'ridan-to'g'ri faollashtirmasdan, tezkor oqsil o'zaro ta'sirlari va kinaz kaskadlari orqali amalga oshiriladigan hujayra ichidagi signal uzatish mexanizmlari.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Barcha 16 ta nokautda sezilarli meta-tahlil FDR (FDR &amp;lt; 0.05), Koxran geterogenlik testi bo'yicha ahamiyatsiz p (p &amp;gt; 0.05) va umumiy yo'nalishga ega bo'lgan konvergent DEG lar estradiol yordamida tiklanishiga 7 ta gen nishonida ko'proq moyil edi (Fisherning aniq testi, ***FDR &amp;lt; 0.001, **FDR &amp;lt; 0.01, *FDR &amp;lt; 0.05) (2F-rasm, S6B-rasm). Nokautning asosiy effektida ahamiyatli bo'lgan barcha Gene Ontology (GO) yo'llari (p &amp;lt; 0.05) nokaut ichidagi estradiol effekti bilan taqqoslandi. iGLUT larda estradiol sinaptik uzatish, neyronlar rivojlanishi, sitoskelet tashkil etilishi, hujayra birikmalari, hujayra sikli, gormonga javob va ion kanallari faoliyati bilan bog'liq buzilgan yo'llarni tikladi (2E-rasm, S5-jadval). ASH1L va SCN2A uchun estradiol interinlar, strukturaviy gomeostaz va transkripsion faollik bilan bog'liq yo'llarni tikladi (2G-rasm). NPC lardagi 8 ta nokaut uchun estradiol transkripsiya, tarjima, membrana transporti faoliyati, mitoxondrial energiya ishlab chiqarish va hujayra birikmalari bilan bog'liq yo'llarni tikladi (S1F-G, S1G-rasmlar, S6-jadval).&lt;/p&gt;\n&lt;h4 id=\"estradiol-tasirida-asd/ndd-neyron-tarmoqlari-giper-sinxronligining-tezkor-qaytarilishi\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#estradiol-tasirida-asd/ndd-neyron-tarmoqlari-giper-sinxronligining-tezkor-qaytarilishi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Estradiol ta'sirida ASD/NDD neyron tarmoqlari giper-sinxronligining tezkor qaytarilishi&lt;/span&gt;&lt;/a&gt;Estradiol ta'sirida ASD/NDD neyron tarmoqlari giper-sinxronligining tezkor qaytarilishi&lt;/h4&gt;\n&lt;p&gt;Estradiolning iGLUT-neyronlaridagi genomik bo'lmagan ta'sirini o'rganish uchun biz CRISPR-nokaut (KO) usulini kalsiy imijingi (Fluo4) bilan birlashtirdik. Tadqiqot 15 ta gen, jumladan ekspressiya regulyatorlari (ARID1B, ASH1L, CHD8, KMT5B, POGZ), neyron kommunikatsiyasi (CACNA1G, GRIA3, GRIN2A, NRXN1, SCN2A, SHANK3) hamda sitoskelet (ANK2, DYRK1A) va signal uzatish (CUL3, PTEN) genlarini qamrab oldi (1-2-rasm). Neyron faolligi 30-kuni (30DIV, yetilmagan tarmoqlar — alohida hujayralar spayklari) va 60-kuni (60DIV, yetuk tarmoqlar — sinxronlashgan ossillyatsiyalar) baholandi (3A-rasm; SN 7, 8A-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR-KO — bu gen funksiyasini tekshirish uchun ma'lum bir genni «o'chirish» usuli, Fluo4 kalsiy imijingi esa kalsiy ionlari konsentratsiyasi o'zgarishi orqali neyron faolligini real vaqtda kuzatish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;30DIV bosqichida estradiol (100 nM, zudlik bilan ta'sir) 5 ta KO liniyasida (SHANK3, DYRK1A, POGZ, GRIA3, GRIN2A) spayk chastotasini va 6 ta liniyada (DYRK1A, POGZ, GRIA3, GRIN2A, CACNA1G, SHANK3) amplitudani yaxshiladi (SN 7-rasm). Yetuk tarmoqlarda (60DIV) dastlab 4 ta faollik klasteri aniqlandi: 1 — nazorat; 2 — uzoq muddatli giper-sinxronlik (ASH1L, SCN2A, SHANK3, ANK2, CACNA1G); 3 — gipoaktivlik (ARID1B, CUL3, CHD8, PTEN); 4 — oraliq tur (NRXN1, GRIA3, POGZ, GRIN2A, DYRK1A) (3B, 3C-rasm; SN 8B-E-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Estradiol 2-klasterdagi (ASH1L, SCN2A, SHANK3, ANK2, CACNA1G) giper-sinxronlikni eng samarali bartaraf etib, preparat kiritilgandan so'ng darhol normal ossillyatsiya namunalarini tikladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Estradiol bilan ishlov berilgandan so'ng, KO-neyronlarning faollik profillari nazorat guruhiga yaqinlashdi (3D-rasm). Eng kuchli ta'sir 2-klasterda kuzatildi: giper-sinxronlik tezda normal ossillyatsiyalar bilan almashdi (3C-rasm). Tiklanish darajasi sinxronlashgan hujayralar foizi bo'yicha baholandi (3E-rasm). Olingan natijalar estradiolning ASD/NDD xavf genlaridagi mutatsiyalar keltirib chiqargan g'ayritabiiy faollikni genomik bo'lmagan mexanizmlar orqali zudlik bilan tuzatish qobiliyatini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot iGLUT-neyronlarida (in vitro) o'tkazilgan, shuning uchun kuzatilgan effektlarning klinik ahamiyatini baholash uchun tirik organizmlarda tekshirish talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"in-vivo-sharoitida-estradiol-yordamida-neyrorivojlanish-va-uyqu-buzilishlarini-korreksiya-qilish\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#in-vivo-sharoitida-estradiol-yordamida-neyrorivojlanish-va-uyqu-buzilishlarini-korreksiya-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;In vivo sharoitida estradiol yordamida neyrorivojlanish va uyqu buzilishlarini korreksiya qilish&lt;/span&gt;&lt;/a&gt;In vivo sharoitida estradiol yordamida neyrorivojlanish va uyqu buzilishlarini korreksiya qilish&lt;/h4&gt;\n&lt;p&gt;Tadqiqotchilar Danio rerio modellarida autizm spektri va neyrorivojlanish buzilishlari (ASD/NDD) bilan bog'liq 31 ta ortolog genlar bo'yicha bazaviy sensomotor xulq-atvor va uyg'oq holat ko'rsatkichlarini baholadilar. Tadqiqotga mozaik F0-nokautlar (CRISPants) va barqaror mutant liniyalari kiritildi (Rasm 1–3; S8–S11 jadval). O'rganilgan genlar orasida 19 tasi ekspressiya regulyatorlari (ARID1B, ASH1L, BCL11A, CHD2, CHD8, CREBBP, KDM5B, KDM6B, KMT2C, KMT5B, MBD5, PHF12, PHF21A, POGZ, SETD5, SIN3A, SKI, SMARCC2, WAC), 7 tasi neyronlararo aloqa genlari (CACNA1G, GRIA3, GRIN2A, NRXN1, SCN2A, SHANK3, SLC6A1; Danio rerioda scn1lab geni insondagi SCN1A va SCN2A genlarining ortologi hisoblanadi), 3 tasi hujayra signalizatsiyasi va oqsillar modifikatsiyasi genlari (CUL3, PPP2R5D, PTEN) hamda 2 tasi sitoskelet genlari (ANK2, DYRK1A) edi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-f1.jpg\" alt=\"1-rasm: 17𝜷-estradiol-x-neyrorivojlanish buzilishi xavf genlarining ta'sirini baholovchi ikki tizimli, yirik miqyosli, k\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: 17𝜷-estradiol-x-neyrorivojlanish buzilishi xavf genlarining ta'sirini baholovchi ikki tizimli, yirik miqyosli, ko'p modalli skrining quvurining eksperimental umumiy ko'rinishi. Estradiol bilan davolash va neyrorivojlanish buzilishi (NDD) xavf genlaridagi funksiyani yo'qotuvchi mutatsiyalarning ta'siri uchta modalities orqali o'lchanadi: (1) hiPSC-dan olingan NGN2-induktsiyalangan glutamatergik neyronlarda (iGLUTs) bir hujayrali RNAseq, (2) iGLUTs da neyron kalsiy tasvirlash va (3) lichinka zebrafishda sensorimotor va uyg'onish xulq-atvori. Modalliklar bir-biriga mos keladigan, ammo mustaqil gen to'plamlarini o'z ichiga oladi. ASD/NDD maqsadli genlari ko'plab funksiyalarni, jumladan gen ekspresiyasini regulyatsiya qilish (pushti), neyron funksiyasi va aloqasi (yashil), hujayra signallari va oqsil modifikatsiyasi (kulrang) va sitoskeletni (ko'k) o'z ichiga oladi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-f2.jpg\" alt=\"2-rasm: Estradiol iGLUTs da disregulyatsiya qilingan DEG'larni va sinaptik yo'llarni tiklaydi. A. Eksperimental dizayn v\" /&gt;&lt;/p&gt;\n&lt;p&gt;*2-rasm: Estradiol iGLUTs da disregulyatsiya qilingan DEG'larni va sinaptik yo'llarni tiklaydi. A. Eksperimental dizayn va turli effekt taqqoslashlarining sxemasi. O'ttiz oltita NDD xavf geni hiPSC-dan olingan NGN2-glutamatergik neyronlarda (iGLUTs) 100nM estradiol bilan 24 soat davomida ta'sir qilgan va ta'sir qilmagan holda birlashtirilgan bir hujayrali CRISPR-knockout skriningi yordamida nishonga olingan. Har bir gen 3-4 gRNA bilan nishonga olingan (i). Davolangan va davolanmagan guruhlar o'rtasida turli xil effekt taqqoslashlari amalga oshirildi (ii). Asosiy KO effekti KO+DMSO va Nout-targeting control (NT)+DMSO ni solishtiradi. Asosiy E2 effekti NT+E2 va NT+DMSO ni solishtiradi. E2 doirasidagi KO effekti KO+E2 va NT+E2 ni solishtiradi. KO doirasidagi E2 effekti KO+E2 va KO+DMSO ni solishtiradi. E2 va KO qo'shma effekti KO+E2 va NT+DMSO ni solishtiradi. B. Maqsadli NDD genining har biri bo'yicha pertürbatsiya darajasi (chapda, nuqtali diagramma). Doira hajmi manfiy log10(p-qiymat) ni bildiradi. Poyasi knockout +DMSO va nontargeting control + DMSO ning log fold o'zgarishini bildiradi. KO'lar maqsadli NDD genlari uchun gRNA boyitilishi va maqsadli KO gen ekspresiyasining pasayishi asosida aniqlangan. Asosiy KO effektida differentsial ekspressiya qilingan genlar soni ustunli diagrammada ko'rsatilgan (FDR &amp;lt;0.05). C. Estradiol tiklangan genlar (ko'k) yoki tiklanmagan genlar (kulrang) ichidagi ER maqsadli genlarining foizi. D. iGLUTs da NDD xavf genlari bo'ylab DEG'larga estradiol tiklanishining ta'siri. Estradiolning asosiy KO DEG'lari soniga ta'siri o'zgarmas, qisman tiklanish, tiklanish va ortiqcha tuzatilgan toifalarga bo'linadi. Tiklanish chegaralari darajasining batafsil tavsifi uchun Metodlar va SI 16-rasmga qarang. Maqsadli genlar tiklangan deb tasniflangan DEG'larning eng yuqori foizidan eng past foizigacha tartiblangan (FDR &amp;lt;0.05). E. Eng yaxshi 5 ta maqsadli KO bo'ylab estradiol tomonidan tiklangan Gene Ontology (GO) biologik yo'llari. Nuqta hajmi KO ichidagi E2 effektining genlar to'plami boyitilishi ahamiyatining –log10(p-qiymatini) bildiradi. F. NDD KO bo'ylab sinovdan o'tgan konvergent genlarning E2 tomonidan tiklanish ehtimoli no-konvergent genlarga nisbatan. Fisherning aniq testi, ***FDR&amp;lt;0.001, **FDR&amp;lt;0.01, &lt;em&gt;FDR&amp;lt;0.05. G. iGLUTs da ASH1L va SCN2A KO orasida estradiol tiklanishini ko'rsatuvchi tanlangan GO atamalari.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-f3.jpg\" alt=\"3-rasm: Estradiol beshta NDD mutanti bo'ylab giper-sinkron otishma naqshini tiklaydi. A. Neyron faolligini baholash uchu\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm: Estradiol beshta NDD mutanti bo'ylab giper-sinkron otishma naqshini tiklaydi. A. Neyron faolligini baholash uchun eksperimental ish jarayoni. 100nM estradiolni o'tkir darhol kiritilgandan keyin neyron faolligi konfokal mikroskopiya bilan Fluo4 kalsiy tasvirlash yordamida iGLUTs da 15 ta NDD xavf geni knockoutlarida o'lchanadi. Shaxsiy hujayralar moslashtirilgan piksel darajasidagi hujayra segmentatsiyasi tahlili yordamida aniqlanadi. Kalsiy transientlarining davomiyligi va amplitudasi, shuningdek tarmoq sinxronizatsiyasi hodisalari o'lchanadi. B. Spontan tarmoq sinxronizatsiyasi bo'ylab korrelyatsiya tahlili o'xshash fenotiplarga ega NDD xavf genlarining 4 ta subklasterini aniqlaydi. Klaster 1: KMT5B va nontargeting control (NT). Klaster 2: CACNA1G, SHANK3, ANK2, ASH1L, SCN2A. Klaster 3: CHD8, PTEN, ARID1B, CUL3. Klaster 4: POGZ, NRXN1, GRIA3, GRIN2A, DYRK1A. Sariq quti aniq giper-sinkron otishma fenotipiga ega 2-klasterni ko'rsatadi. C. Nontargeting control, ASH1L, SCN2A, SHANK3, ANK2 va CACNA1G da spontan bazal neyron faolligi (yuqorida) va estradiol bilan davolangan (pastda) raster plotlari. Raster plotining har bir qatori hujayra, har bir ustun esa kadrdir. Hujayralar 1 daqiqa davomida tasvirga olingan (750 kadr). D. Spontan va estradiol bilan davolangan tarmoq sinxronizatsiyasi bo'ylab korrelyatsiya tahlili. Ikki xil klaster hosil bo'ladi. Klaster 1: Spontan ANK2, ASH1L, CACNA1G, SCN2A va SHANK3. Klaster 2: Spontan nontargeting control, Estradiol bilan davolangan nontargeting control, Estradiol bilan davolangan ANK2, ASH1L, CACNA1G, SCN2A, SHANK3. E. Estradiol bilan davolash orqali teskari o'zgartirilgan sinxronizatsiya naqshiga hissa qo'shadigan faol neyronlarning foizi bo'yicha xavf geni knockoutlarini tartiblash.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Xulq-atvorni miqdoriy tahlil qilish yuqori unumdorlikka ega avtomatlashtirilgan videotreking orqali ko'rish qo'rqitish reaksiyasi (VSR) va «uyqu — uyg'oqlik» siklining 24 ta parametri bo'yicha amalga oshirildi (Rasm 4A, S7 jadval). Ierarxik klasterlash baseline holatida yettita xulq-atvor guruhini aniqladi (Rasm 4C; Rasm S9A):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;1-guruh: wacab, crebbpab, arid1b, phf21aab;&lt;/li&gt;\n&lt;li&gt;2-guruh: cacna1g, ptenab, nrxn1ab, scn1lab, ash1l, chd8;&lt;/li&gt;\n&lt;li&gt;3-guruh: grin2aab, chd2, skiab, phf12ab;&lt;/li&gt;\n&lt;li&gt;4-guruh: kdm5ab, ppp2r5d, bcl11ab, mbd5;&lt;/li&gt;\n&lt;li&gt;5-guruh: ank2ab, kmt2cab, kmt5b;&lt;/li&gt;\n&lt;li&gt;6-guruh: slc6a1ab, kdm6bab, dyrk1aab, sin3ab;&lt;/li&gt;\n&lt;li&gt;7-guruh: smarcc2, setd5, gria3ab, pogzab, shank3ab, cul3ab.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-f4.jpg\" alt=\"4-rasm: Estradiol retseptorlari mexanizmlari ash1l va scn1lab mutantlarida uyg'onish va sensorimotor fenotiplarining est\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm: Estradiol retseptorlari mexanizmlari ash1l va scn1lab mutantlarida uyg'onish va sensorimotor fenotiplarining estradiol bilan tiklanishini bashorat qiladi. A. Lichinka zebrafish xulq-atvori tahlillarining eksperimental sozlanishi. Lichinka xulq-atvori avtomatlashtirilgan videokuzatuv orqali o'lchanadi. Vizual-startl (VSR): Lichinkalar aklimatizatsiya qilinadi va urug'lanishdan keyingi 5-kuni (dpf) 29 soniya oralig'ida besh marta 1 soniyali chiroq o'chishi (Startle-OFF) yoki yonishi (Startle-ON) stimullariga duchor qilinadi. Uyqu-uyg'onish: Lichinkalar 5-7 dpf davomida 14s:10s yorug'lik:qorong'ulik sikliga duchor qilinadi. Vizual-startl va uyqu-uyg'onish parametrlari tasvirlangan. B. Mutant xulq-atvor fenotiplari bilan korrelyatsiya qilmaydigan (qarama-qarshi) yoki korrelyatsiya qiladigan (taqlid qiladigan) dori vositalari va mexanizmlarni bashorat qilish uchun wild-type zebrafishda FDA tomonidan tasdiqlangan 376 ta birikmaning farmakobexavior profilini tuzish sxemasi. C. 24 ta vizual-startl va uyqu-uyg'onish xulq-atvor parametrlari bo'ylab korrelyatsiya tahlili o'xshash fenotiplarga ega NDD xavf geni mutantlarining 7 ta subklasterini aniqlaydi. Klaster 1: wacab, crebbpab, arid1b, phf21aab. Klaster 2: cacna1g, ptenab, nrxn1ab, scn1lab, ash1l, chd8. Klaster 3: grin2aab, chd2, skiab, phf12ab. Klaster 4: kdm5bab, ppp2rd5, bcl11aab, mbd5. Klaster 5: ank2ab, kmt2cab, kmt5b. Klaster 6: slc6a1ab, kdm6bab, dyrk1aab, sin3ab. Klaster 7: smarcc2, setd5, gria3ab, pogzab, shank3ab, cul3ab. F0 va barqaror liniya mutatsiya ketma-ketliklari SI 8-9 jadvallarida topilgan. Sariq quti turli xil funksional tasniflardagi genlarni o'z ichiga olgan 2-klasterni ajratib ko'rsatadi. D. Estrogen retseptorlari (ER) alfa, beta va G-oqsil molekulyar nishonlari NDD geni mutantlari bo'ylab qarama-qarshi ta'sir qiluvchi (ko'k, korrelyatsiya &amp;lt;-0.5, p&amp;lt;0.05, t-statistik) va korrelyatsiya qiluvchi dori vositalari (to'q sariq, korrelyatsiya &amp;gt;0.5, p&amp;lt;0.05, t-statistik) orasida sezilarli darajada boyitilgan. ER boyitilishi bo'lmagan mutantlar ko'rsatilmagan. Doira hajmi Fisherning aniq testi yordamida hisoblangan -log10(p-qiymat) ni bildiradi. Poyaning uzunligi har bir mutant uchun imkoniyatlar nisbatini ko'rsatadi. NDD genlari doira hajmi va poya uzunligi bo'yicha tartiblangan. Estrogen retseptorlari alfa, beta va G-oqsilining boyitilishi va har bir gen uchun p-qiymatlar SI 13-jadvalida ko'rsatilgan. E. STRING ma'lumotlar bazasiga asoslangan ash1l mutanti uchun qarama-qarshi ta'sir qiluvchi dori vositalarining (kulrang romblar) nishonlari (siyohrang doiralar) orasidagi Oqsil-Oqsil O'zaro ta'siri (PPI) tarmog'i (korrelyatsiya &amp;lt;-0.5, p&amp;lt;0.05, t-statistik) (i). Oqsillarning tugun hajmi har bir oqsilni nishonga oladigan dorilar sonini bildiradi. Dori nishonlari orasida boyitilgan GO yo'llari ko'rsatilgan (ii). F. scn1lab va ash1l mutantlari uchun har bir xulq-atvor parametri uchun empirik beta qiymatlarining issiqlik xaritasi, faqat mutantning ta'siri (yuqori qator, HOM DMSO va WT DMSO) va mutant estradiol bilan davolash o'zaro ta'sirining ta'siri (24 soat, 20 µM) WT transport vositasiga nisbatan (HOM E2 va WT DMSO) o'rtasida, xulq-atvor belgilarining nisbiy bostirilishini ko'rsatadi. Yulduzchalar (&lt;/em&gt;) ko'rsatilgan taqqoslash guruhida sezilarli darajada farq qiladigan xulq-atvor belgilarini ko'rsatadi (p * &amp;lt;0.05, ** &amp;lt;0.01, ***&amp;lt;0.001, ***&lt;em&gt;&amp;lt;0.0001, LMM). Sariq qutilar tiklangan (HOM DMSO va WT DMSO da sezilarli darajada farq qiladigan va HOM E2 va WT DMSO da endi muhim bo'lmagan) yoki qisman tiklangan (HOM DMSO va WT DMSO da sezilarli darajada farq qiladigan va HOM E2 va WT DMSO da kamaygan) parametrlarni ko'rsatadi. Funt belgisi (#) belgining qisman tiklanganligini ko'rsatadi (i). HOM DMSO va WT DMSO da p-qiymati ≤ 0.05 bo'lgan sezilarli darajada farq qiladigan xulq-atvor belgilari uchun biz har bir belgi uchun HOM-x-E2 ta'sirini kuchaytirilgan, o'zgarmas, qisman tiklanish, tiklanish va ortiqcha tuzatilgan sifatida tavsifladik (ii). Har bir tasnif uchun chegaralarning batafsil tavsifi uchun Metodlar va SI 16-rasmga qarang. Mutantlar tiklangan yoki qisman tiklangan belgilar soni bo'yicha tartiblangan. G. scn1lab va ash1l mutantlari uchun skripka diagrammalari HOM DMSO va WT DMSO (chapda) va HOM E2 va WT DMSO (o'ngda) o'rtasida uyqu-uyg'onish xulq-atvor parametrlariga ta'sir kattaligini (masshtablangan beta ballarining taqsimoti) taqqoslashni ko'rsatadi. Quti va mo'ylov diagrammalari har bir mutant uchun tiklangan vakillik parametrlarini ko'rsatadi. Kechasi uyg'onish faolligining oshishi va uyqu davrlari sonining oshishi scn1lab va ash1l mutantlarida mos ravishda estradiol tomonidan tiklandi (Welch tuzatishi bilan juftlanmagan t-test, **** p &amp;lt; 0.0001, *** p = 0.0010. scn1lab n = 48/guruh; ash1l WT DMSO n=21, WT E2 n=21, HOM DMSO n=23, HOM E2 n=18).&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Avtomatlashtirilgan videotreking va ierarxik klaster tahlili genetik modellarni cho'chish reaksiyasi (VSR) hamda uyqu va uyg'otlik parametrlarining o'xshash o'zgarishlariga qarab guruhlarga birlektirish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Farmako-xulq-atvor ma'lumotlar bazasiga tayanib, mutant fenotipini taqlid qiluvchi (ijobiy korrelyatsiya) yoki uni bartaraf etuvchi (antikorrelyatsiya) birikmalar qidirildi (Rasm 4B). Mualliflar genomik (ERα va ERβ) yoki nodigenomik (GPER1) estrogen signalizatsiyasi mexanizmlariga ta'sir etuvchi preparatlarning genlar (Rasm 4D, S13 jadval) va klasterlar darajasida (Rasm S9B) boyitilganligini tekshirdilar (estradiol bilan boyitilmagan cacna1g, pten va nrxn1 genlari grafiklarda ko'rsatilmadi).&lt;/p&gt;\n&lt;p&gt;2-klasterdagi mutantlar fenotiplari, ayniqsa ash1l va scn1lab, estrogen birikmalari bilan eng kuchli antikorrelyatsiyani ko'rsatdi (antikorrelyatsiya koeffitsienti &amp;lt; -0.5, p &amp;lt; 0.05, t-statistikasi) (S14 jadval). Aksincha, boshqa klasterlardagi mutantlar (smarcc2, setd5, gria3ab, shank3ab, kmt5b) yovvoyi turdagi baliqlarda estradiol ta'siriga yuqori korrelyatsiyani namoyon etdi (r &amp;gt; 0.5, p &amp;lt; 0.05, t-statistikasi).&lt;/p&gt;\n&lt;p&gt;Asosiy maqsadli genlar (Rasm 4Ei va Rasm S9Cdagi ash1l hamda scn1lab) uchun oqsil-oqsil o'zaro ta'sir tarmoqlari (STRING) ERα, ERβ va GPER retseptorlarini qarama-qarshi ta'sir qiluvchi maqsadlar sifatida tasdiqladi. Genlar ontologiyasi (GO) tahlili yadro transkripsiyasi, gormonal signalizatsiya va estrogen javob yo'llarining boyiganini ko'rsatdi (Rasm 4Eii).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ash1l va scn1lab genlari bo'yicha mutantlar estradiolga nisbatan yuqori sezgirlik va fenotipning teskari korrelyatsiyasini (r &amp;lt; -0.5, p &amp;lt; 0.05) ko'rsatdi, bu esa xulq-atvor buzilishlarini estradiol yordamida korreksiya qilish uchun biologik asos bo'ldi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Fenotipning estradiol bilan qaytarilishini tajribada tekshirish otlanishdan keyingi 5–7 kunlik (dpf) ash1l va scn1lab (korreksiya bashorat qilingan), kmt5b (taqlid bashorat qilingan) hamda nrxn1ab (samara bashorat qilinmagan) gomozigot mutant lichinkalarida o'tkazildi (Rasm 4F). Lichinkalar 20 µM estradiol yoki nazorat (DMSO) bilan 24 soat davomida ishlov berildi (dozaga bog'liqlik Rasm S3B–S3C da).&lt;/p&gt;\n&lt;p&gt;Kisman yoki to'liq tiklangan ko'rsatkichlar soni bo'yicha darajalash shuni ko'rsatdiki, eng yuqori korreksiya scn1lab va ash1l mutantlarida kuzatildi, undan keyin kmt5b va eng kam samara nrxn1ab da qayd etildi (Rasm 4Fii). Estradiol bilan darhol ishlov berish (genomik bo'lmagan mexanizmlar orqali) ham spetsifik fenotipik tiklanishga olib keldi (Rasm S10, S12 jadval), ammo 24 soatlik dastlabki ishlov berish kuchliroq samara berdi. scn1lab va ash1l mutantlarida estradiol uyqu va uyg'oqlikning maxsus parametrlarini tikladi, tegishlicha tungi giperfaollikni va uyqu bo'linishini kamaytirdi (Rasm 4G).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Xulq-atvor fenotiplarining tiklanish samarasi Danio rerio lichinkalarida (5–7 dpf) 20 µM estradiol bilan ishlov berishda olindi; bu natijalarni insonga ko'chirish imkoniyatini baholash uchun sutemizuvchilarda qo'shimcha tadqiqotlar talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"estradiol-scn2a-va-scn1lab-mutatsiyalarida-transkripsion-va-tarmoq-faoliyatini-tiklaydi\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#estradiol-scn2a-va-scn1lab-mutatsiyalarida-transkripsion-va-tarmoq-faoliyatini-tiklaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Estradiol SCN2A va scn1lab mutatsiyalarida transkripsion va tarmoq faoliyatini tiklaydi&lt;/span&gt;&lt;/a&gt;Estradiol SCN2A va scn1lab mutatsiyalarida transkripsion va tarmoq faoliyatini tiklaydi&lt;/h4&gt;\n&lt;p&gt;Estradiolning neyron faoliyatiga ta'sirini o'rganish uchun scn1lab mutatsiyasiga ega gomozigotali zebra baliqlari lichinkalari (6 kunlik) va yovvoyi turdagi baliqlar ishlatildi. Baliqlar 24 soat davomida estradiol (20 mkM) yoki erituvchi (DMSO) bilan ishlov berildi, so'ngra RNK sekveniroviyasi o'tkazildi (5A-rasm). Tahlillar shuni ko'rsatdiki, estradiol sinaptik uzatilish, neyronlar rivojlanishi, hujayra sikli, mitoxondriyal energiya almashinuvi va ion kanallari faoliyati bilan bog'liq genlar ekspressiyasini tuzatadi (5B-C rasmlar, SN 11-rasm, SN 15-16 jadvallar). Estrogenga bog'liq yo'llarning boyishi ta'sir genomik signalizatsiya orqali amalga oshishi mumkinligini ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Estradiol scn1lab mutantlarida buzilgan sinaptik funksiya va energiya almashinuvi bilan bog'liq genlar ekspressiyasini normallashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Miya faoliyatini baholash uchun pERK/tERK xaritalash usuli qo'llanildi (5D-rasm). scn1lab mutantlarida miyaning turli qismlarida (telensefalon, rombensefalon va diensefalon) faoliyat buzilishlari kuzatildi, ular estradiol ta'sirida qisman yoki to'liq tiklandi (5E-F rasmlar, SN 13-rasm). 149 ta hududdan iborat atlas ikki tomonlama ta'sirni aniqladi: rombensefalon va gipotalamusdagi giperfaollikning pasayishi hamda telensefalondagi faollikning oshishi (5G-rasm, SN 18-jadval). Bu hududlar lichinkalardagi esr2b va gper1 retseptorlari ekspressiyasi bilan mos keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;pERK/tERK — neyronlar faoliyatini vizualizatsiya qilish usuli bo'lib, unda fosforillangan ERK (pERK) kalsiy oqimining belgisi sifatida hujayra qo'zg'alishini aks ettiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Pentilentetrazol (PTZ, 10 mM) bilan tirishishlar chaqirilganda, scn1lab mutantlari faoliyatning keskin o'sishini ko'rsatdi. Estradiol (20 mkM) bu tirishishlarning chastotasi va davomiyligini sezilarli darajada kamaytirdi (5H-J rasmlar, 5K-rasm, SN 19-jadval). ERα (PPT), ERβ (DPN) va GPER1 (G1) selektiv agonistlaridan foydalanish retseptorlarning barcha uch turi tirishishlarni bostirishda ishtirok etishini ko'rsatdi (SN 14-rasm). Xuddi shunday ta'sir SCN2A+/- inson neyronlarida ham tasdiqlandi, bunda estradiol (100 nM) ko'p elektrodli matritsa (MEA) yordamida o'lchangan tarmoq faoliyatini pasaytirdi (5L-rasm, SN 20-jadval).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot zebra baliqlari va inson hujayra madaniyatlarida o'tkazilgan; estradiolning ta'sir mexanizmlari sutemizuvchilar organizmida farq qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"estradiolga-yuqori-sezgir-bolgan-asosiy-genlarning-tarmoq-bogliqligi-va-rivojlanayotgan-bosh-miya-postlogidagi-oziga-xos-ekspressiya-profillari\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#estradiolga-yuqori-sezgir-bolgan-asosiy-genlarning-tarmoq-bogliqligi-va-rivojlanayotgan-bosh-miya-postlogidagi-oziga-xos-ekspressiya-profillari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Estradiolga yuqori sezgir bo'lgan asosiy genlarning tarmoq bog'liqligi va rivojlanayotgan bosh miya po'stlog'idagi o'ziga xos ekspressiya profillari&lt;/span&gt;&lt;/a&gt;Estradiolga yuqori sezgir bo'lgan asosiy genlarning tarmoq bog'liqligi va rivojlanayotgan bosh miya po'stlog'idagi o'ziga xos ekspressiya profillari&lt;/h4&gt;\n&lt;p&gt;Autizm va neyrorivojlanish buzilishlari (ASD/NDD) genlari orasida estradiol ta'siriga eng ko'p beriluvchan bo'lganlarini aniqlash maqsadida ko'p modalli transkriptomik, hujjatli va xulq-atvor ma'lumotlar bazalari birlashtirildi (6A-rasm, S21-jadval). Har bir modalik uchun Wasserstein baritsentrlarini latent fazoga o'tkazish (6B-rasm) uchta alohida klasterni (gen nazorati, estradiol bilan davolangan va transport vositasi bilan davolangan guruhlar) yuzaga chiqardi (6C-rasm). Davolash sharoitlari orasidagi modaliklararo masofani o'rganish iGLUT kaltsiy tasvirlash (neyron faolligi) va zebrafish xulq-atvori modalliklari davolash sharoitlari doirasida o'xshashroq ekanini, yakka hujayrali transkriptomika esa sharoit ichida ham, ular o'rtasida ham eng farq qiluvchi ekanini ko'rsatdi (6D-rasm). ASD/NDD genlari nokautlarini barcha modalliklar bo'yicha estradiol ta'sirini tiklash darajasiga qarab tartiblaganda, ASH1L va SCN2A eng sezgir bo'lib chiqdi, ulardan keyin SHANK3 keldi (6E-rasm). ASXL3, MED13L, CACNA1G va ANK2 uchun esa ancha kam va modallikka xos tiklanish jarayonlari kuzatildi (6E-rasm; S22-jadval). Umuman olganda, biz estradiol bilan davolashga eng yuqori sezgirlik ko'rsatgan 7 ta ASD/NDD genidan iborat kichik guruhni (ASH1L, SCN2A, SHANK3, ASXL3, MED13L, CACNA1G, ANK2) aniqladik.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Nokaut (KO) — bu tadqiqotchilar muayyan genning vazifasini o'rganish maqsadida uni laboratoriya sharoitida sun'iy ravishda o'chirib qo'yadigan yoki olib tashlaydigan genetik usul.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Estradiolga sezgirlik ASD ichida jinsiy jihatdan farqlanuvchi klinik ta'sirlarni oldindan bashorat qila olishini baholash uchun mualliflar eng ko'p (n = 7) va eng kam (n = 29) estradiolga sezgir bo'lgan ASD/NDD genlarida de novo oqsilni qisqartiruvchi variantlar (PTV) tashuvchilarining jinsiy taqsimotini alohida tahlil qildilar va ular o'rtasida farq yo'qligini aniqladilar (Fisherning aniq testi, OR = 0.93, 95% CI = 0.70–1.25, P = 0.669, S15A-B-rasmlar, S23-24-jadvallar). Shunga o'xshash tarzda, SPARK ko'rgazmasidagi erkak va ayol qatnashchilarda 7 ta eng sezgir va 29 ta eng kam sezgir genlar variantlarini olib yuruvchi oltita standart ASD/NDD fenotiplari bo'yicha klinik ko'rinishlar PTV sezgirlik tahliliga ko'ra sezilarli jinsiy o'zaro ta'sirni ko'rsatmadi (S25-jadval; S15C-rasm). Umuman olganda, estradiol sezgirligi jinsga bog'liq klinik ta'sirlarni keltirib chiqarmasligi haqida xulosa qilamiz.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Estradiolga eng sezgir bo'lgan yettita gen ASD klinikikasidagi jinsiy farqlarni keltirib chiqarmaydi, biroq ular postnatal rivojlanish davrida kuchaytirilgan ko-ekspressiya va mustahkam funksional tarmoq bog'liqligini namoyon etadi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Keyingi qadamda biz eng ko'p (n = 7) va eng kam (n = 29) estradiolga sezgir bo'lgan genlarning bosh miyadagi ekspressiyasini ko'rib chiqdik. Birinchidan, biz post-mortem ikkita ma'lumotlar bazasidan foydalangan holda bazal jinsiy ta'sir ko'rsatadigan miya po'stlog'i ekspressiyasini (erkak va ayol o'rtasidagi mutlaq log2 fold change) solishtirdik va ikkala holatda ham sezilarli farq topmadik (UCLA, P = 0.333; BrainVar, P = 0.375; meta-tahlil, P = 0.757) (7A-rasm, S30-jadval). Garchi biz miya po'stlog'ining rivojlanish ekspressiyasi traektoriyalarida ham sezilarli farqlarni aniqlamagan bo'lsak-da (eng sezgirlari uchun Spearman ρ = 0.29, P = 0.535; eng kam sezgirlari uchun Spearman ρ = −0.75, P = 0.052) (7B-rasm), qo'zg'atuvchi neyronlarning bitta kenja turi (yuqori qatlamda boyigan yetilayotgan qo'zg'atuvchi neyronlar, ExM-U) estradiolga eng sezgir genlar bilan bog'liq bo'lgan diqqatga sazovor tanlanma hujjat turi rivojlanish ekspressiya imzosini ko'rsatdi (median z-ball 1.59 ga qarshi −0.11; IQR, 0.956–1.87 ga qarshi −0.520–0.276; Wilcoxon rank-sum testi, W = 189, P = 5.06 × 10−4, FDR = 0.0081) (7C-rasm, S28-29-jadvallar).&lt;/p&gt;\n&lt;p&gt;Estradiolga eng yuqori sezgir bo'lgan genlar postnatal miya po'stlog'i rivojlanishi davomida, ayniqsa go'daklik (median bog'liqlik, 0.660 ga qarshi 0.224; P = 2.36 × 10−4, FDR = 0.00165), bolalik (0.611 ga qarshi 0.424; P = 0.0118, FDR = 0.0275) va o'smirlik davrlarida (0.723 ga qarshi 0.484; P = 0.00159, FDR = 0.00557) kuchaytirilgan ko-ekspressiya bog'liqligini ko'rsatdi (7D-rasm, S26-27-jadvallar). Shuningdek, estradiolga eng sezgir genlar eng kam sezgir genlarga nisbatan guruh ichidagi normallashtirilgan PPI bog'liqligini sezilarli darajada yuqori ko'rsatdi (o'rtacha normallashtirilgan daraja, 0.381 ga qarshi 0.160; Wilcoxon rank-sum testi, W = 172.5, P = 0.0046, 7E-rasm), bu eng sezgir genlar orasida kuchliroq funksional bog'liqlik borligidan dalolat beradi. Bularning barchasi shuni ko'rsatadiki, jinsga bog'liq po'stloq ekspressiyasidan ko'ra, estradiolga eng sezgir bo'lgan yettita ASD/NDD geni postnatal rivojlanish davrlarida kuchaytirilgan ko-ekspressiya va mustahkamroq funksional tarmoq bog'liqligiga ega.&lt;/p&gt;\n&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;h4 id=\"natijalarni-muhokama-qilish\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#natijalarni-muhokama-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalarni muhokama qilish&lt;/span&gt;&lt;/a&gt;Natijalarni muhokama qilish&lt;/h4&gt;\n&lt;p&gt;In vitro inson hujayralari va in vivo zebrafish mutantlaridagi tajribalarni birlashtirgan multimodal yondashuv estradiolning autizm spektrining buzilishlari va neyrorivojlanish xavfi genlaridagi (ASD/NDD) funksiyani yo'qotish (LoF) mutatsiyalari bilan o'zaro ta'sirini chuqur o'rganish imkonini berdi. Olingan ma'lumotlar estradiolning ASD/NDD genlariga ham o'xshash (konvergent), ham farqli (divergent) ta'sir ko'rsatishini, bu genomik va non-genomik mexanizmlar orqali amalga oshishini ko'rsatadi. Estradiol ASD/NDD genlari bilan bog'liq fenotiplarni bostirishi haqidagi avvalgi hisobotlarga tayangan holda, ushbu ish ma'lum genlar uchun LoF oqibatlarini yumshatishini ko'rsatadi va ASH1L hamda SCN2A genlarini estradiolga eng sezgir deb aniqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Estradiol transkripsion buzilishlarni tuzatadi va beshta gen bo'yicha tarmoq giperqo'zg'aluvchanligini pasaytiradi (&lt;em&gt;ASH1L&lt;/em&gt;, &lt;em&gt;SCN2A&lt;/em&gt;, &lt;em&gt;ANK2&lt;/em&gt;, &lt;em&gt;CACNA1G&lt;/em&gt;, &lt;em&gt;SHANK3&lt;/em&gt;).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Non-genomik mexanizmlar — bu gormonning DNK bilan to'g'ridan-to'g'ri ta'sirisiz, membranadagi retseptorlar orqali soniyalar yoki daqiqalar ichida sodir bo'ladigan tezkor hujayraviy javoblaridir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Transcriptom darajasida estradiol barcha o'rganilgan nokautlar natijasida buzilgan genlar ekspressiyasini keng miqyosda tikladi (2-rasm). Gormon neyron genlari va yo'llarining ekspressiya naqshlarini genotipdan qat'iy nazar muvofiqlashtirdi, neyrotransmissiya, neyrorivojlanish va tsitoskelet regulyatsiyasini tikladi. Zebrafish scn1lab mutantlarida estradiol neyrogenez, sinaptik faollik, hujayra sikli, metabolizm va estrogen yo'llarini ham tikladi. Gomeostatik mexanizmlar qisman o'xshash genlarni faollashtirishi mumkin bo'lsa-da, estrogen retseptorlari (ER) nishonlarining boyishi kuzatilmadi, bu non-genomik mexanizmlarning muhimligini ko'rsatadi. Eng kuchli tiklanish effekti ASH1L va SCN2A uchun qayd etildi.&lt;/p&gt;\n&lt;p&gt;Tarmoq va xulq-atvor darajasidagi tahlillar genotipga xos bo'lgan va tez sodir bo'ladigan teskari ta'sirlarni aniqladi, bu esa non-genomik signallarni ko'rsatadi. Estradiol iGLUT neyronlarida beshta gen (&lt;em&gt;ASH1L&lt;/em&gt;, &lt;em&gt;SCN2A&lt;/em&gt;, &lt;em&gt;ANK2&lt;/em&gt;, &lt;em&gt;CACNA1G&lt;/em&gt;, &lt;em&gt;SHANK3&lt;/em&gt;) bo'yicha tarmoq giperqo'zg'aluvchanligini tanlab bostirdi (3-rasm). Ularning barchasi insonlarda tutqanoq kasalliklari bilan bog'langan. Zebrafish tadqiqotlari ash1l va scn1lab mutantlarida uyqu-uyg'onish sikli buzilishlarini bostirishini (4-rasm) va scn1lab mutantlarining preoptik zonasidagi neyronal faollikni normallashtirishini ko'rsatdi (5-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Estradiol ta'siri kontekstga bog'liq: u ayrim modellarda tirishishga qarshi xususiyatlarni ko'rsatsa-da, boshqa sharoitlarda tutqanoq faolligini rag'batlantirishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Estradiolga eng sezgir bo'lgan yettita gen ASDda erkaklarning ustunligini (4:1 nisbat) tushuntirmaydi. Qon va miyadagi estrogen konsentratsiyalari jinslararo o'xshash bo'lib, klinik dalillar prenatal steroidogenezning ortishini ASD bilan bog'laydi. Ayollarni himoya qilish modeli ayollarga ASD chegarasiga yetish uchun ko'proq genetik yuk kerakligini taxmin qiladi, ammo kech tashxis qo'yilishini hisobga olganda jinsiy tafovut kamayadi. Miya ichida sintez qilinadigan estradiol konsentratsiyasi qondagidan oshib ketishi va mGluR retseptorlarini faollashtirishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Estradiolga sezgir ASD/NDD genlarining kuchaygan ko-ekspressiyasi va tarmoq bog'liqligi ularning maqsadli terapiya uchun umumiy nuqtalar ekanligini ko'rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Presizion psixiatriya bemorning genotipi va hujayraviy javobini hisobga olgan holda davolash usullarini tanlashga intiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu ish ASD/NDD xavf genlaridagi LoF variantlari ta'sirini estradiol qanday bartaraf etishini tushunish uchun model bo'lib xizmat qiladi. Estradiol ta'siri hamma gen uchun bir xil emasligi aniqlandi: konvergent tiklanish ham, divergent kuchayish ham kuzatildi. Qizig'i shundaki, tiklanish effekti funksional tasnif bilan belgilanmagan (eng yaxshi ikki gen ASH1L va SCN2A turlicha vazifalarni bajaradi), balki umumiy molekulyar va tarmoq nuqsonlarini tuzatish bilan bog'liq bo'lgan. Estradiolga sezgir genlar yetilayotgan yuqori qatlam qo'zg'atuvchi neyronlarida boyiganligi sababli, bu terapevtik aralashuvlar uchun muhim imkoniyat oynasini ochadi.&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"inson-ozak-hujayra-modellari-va-crispr-nokaut-kutubxonasi-dizayni\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#inson-ozak-hujayra-modellari-va-crispr-nokaut-kutubxonasi-dizayni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Inson o'zak hujayra modellari va CRISPR-nokaut kutubxonasi dizayni&lt;/span&gt;&lt;/a&gt;Inson o'zak hujayra modellari va CRISPR-nokaut kutubxonasi dizayni&lt;/h4&gt;\n&lt;p&gt;NDD (asab-ruhiy rivojlanish buzilishlari) xavfi yuqori bo'lgan genlar SFARI Gene (sindromal yoki 1-2 balli genlar) va Gene2Phenotype (G2P) ma'lumotlar bazalari asosida tanlab olindi. Tanlashda inson kortikal rivojlanishining dastlabki bosqichlarida yuqori ekspressiyaga ega lokuslar ustunlik qildi. Matritsali CRISPR-skrining (kalsiy vizualizatsiyasi) uchun xromatinni qayta qurish, sinaptik funksiya va hujayra signalizatsiyasi bilan bog'liq 15 ta gen tanlandi. Pullangan skrining (estradiol bilan ishlov berish va scRNA-seq) uchun ro'yxat 36 ta gengacha kengaytirildi. Tanlov jinsiy moyillikka bog'liq emas edi, garchi ba'zi genlar (masalan, MBD5, ASH1L, CUL3) erkaklarda ko'proq namoyon bo'lsa ham. Har bir gen 3-4 ta gRNA bilan nishonga olindi. Matritsali skrining uchun hESC-iCas9 hujayralari MOI &amp;gt;1, pullangan skrining uchun esa yagona integratsiyani ta'minlash maqsadida MOI &amp;lt;0,2 bilan transduksiya qilindi. Puromitsin (1 mkg/ml, 48 soat) bilan seleksiyadan so'ng hujayralar ko'paytirildi va kriokonservatsiya qilindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR-skrining — bu genlarning funksiyasini o'chirish (nokaut) orqali ularning hujayra jarayonlariga ta'sirini o'rganish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"neyral-otmishdosh-hujayralar-npc-kultivatsiyasi\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#neyral-otmishdosh-hujayralar-npc-kultivatsiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Neyral o'tmishdosh hujayralar (NPC) kultivatsiyasi&lt;/span&gt;&lt;/a&gt;Neyral o'tmishdosh hujayralar (NPC) kultivatsiyasi&lt;/h4&gt;\n&lt;p&gt;Shizofreniya (COS) bilan kasallangan bemorlardan olingan tasdiqlangan hiPSC-NPC liniyalari (NSB2607-2-1 va NSB3182-3-1) ishlatildi. Hujayralar ikki tomonlama SMAD ingibitsiyasi (0,1 mkm LDN193189 va 10 mkm SB542431) orqali hosil qilindi va MACS yordamida tozalandi. Kultivatsiya Matrigel qoplamali hNPC muhitida olib borildi. Pullangan skrininglar uchun hujayralar Cas9v2 va LV-gRNA lentiviruslari bilan transduksiya qilindi, so'ngra puromitsin (1 mg/ml) va gigromitsin (1 mg/ml) bilan seleksiya qilindi. Yig'ib olishdan 72 soat oldin LV-gRNA, 24 soat oldin esa estradiol bilan ishlov berildi.&lt;/p&gt;\n&lt;h4 id=\"iglut-neyronlar-induksiyasi\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#iglut-neyronlar-induksiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;iGLUT neyronlar induksiyasi&lt;/span&gt;&lt;/a&gt;iGLUT neyronlar induksiyasi&lt;/h4&gt;\n&lt;p&gt;NGN2-induksiyalangan iGLUT neyronlarini hosil qilish uchun H1 (XY) iCas9 liniyasi ishlatildi. gRNA differensiatsiyadan oldin yetkazildi, Cas9 aktivatsiyasi va nokaut NGN2-bog'liq konversiya jarayonida doksitsiklin qo'shilishi bilan amalga oshirildi. Hujayralar mTeSR Plus muhitida saqlandi. 85-90% zichlikda hujayralar Accutase yoki EDTA yordamida passaj qilindi. Hujayralar doksitsiklin-induksiyalanuvchi NGN2 lentivirusi bilan transduksiya qilindi va 10 mkg/ml blastitsidin bilan seleksiya qilindi. NGN2 induksiyasi 2 mkg/ml doksitsiklin bilan 72 soat davomida o'tkazildi. 4-kuni hujayralar Geltrex qoplamali planshetlarga o'tkazildi va ROCK ingibitori (10 mkm Y-27632) qo'shilgan neyron yetilish muhitida yetishtirildi.&lt;/p&gt;\n&lt;h4 id=\"17b-estradiol-bilan-ishlov-berish\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#17b-estradiol-bilan-ishlov-berish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;17β-estradiol bilan ishlov berish&lt;/span&gt;&lt;/a&gt;17β-estradiol bilan ishlov berish&lt;/h4&gt;\n&lt;p&gt;Homila kortikogenezi davrida ona qonidagi estradiol darajasi 1561 pg/mL (5,7 nM) dan 30 000 pg/mL (110 nM) dan yuqorigacha o‘zgarib turadi, uning taxminan uchdan bir qismi bioaktiv hisoblanadi. Tadqiqotda 100 nM kontsentratsiyadagi 17β-estradiol (E2) tanlab olindi. Adabiyotlardagi ma’lumotlarga ko‘ra, 100 pM dan 100 nM gacha bo‘lgan estradiol ta’siri neyronlarning sinaptik plastikligi va aktin polimerizatsiyasini modulyatsiya qiladi. NPC va iGLUT hujayralari 100 nM E2 yoki nazorat eritmasi (0,01% DMSO) bilan kalsiy imijingi uchun o‘tkir yoki hujayralarni yig‘ishdan 24 soat oldin inkubatsiya qilindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;17β-estradiol — neyronlarning rivojlanishi va sinaptik bog‘lanishlariga ta’sir ko‘rsatuvchi asosiy steroid gormon.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Davolash samaradorligini baholash uchun (qutqarish, qisman qutqarish, o‘zgarishsiz, kuchayish yoki ortiqcha tuzatish) KO+DMSO (KO-WT) va KO+E2 (KO-E2) guruhlari o‘rtasidagi p-qiymatlari va beta-koeffitsientlari solishtirildi. Agar KO-E2 p-qiymati &amp;gt;0,05 bo‘lsa, ta’sir «qutqarish» deb baholandi. Aks holda, beta-koeffitsientlarning yo‘nalishi va kattaligi tahlil qilindi. Tasniflash mantiqi SN 16-rasmda keltirilgan.&lt;/p&gt;\n&lt;h4 id=\"yagona-hujayra-rnk-sekvenlash-kutubxonalarini-tayyorlash\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#yagona-hujayra-rnk-sekvenlash-kutubxonalarini-tayyorlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yagona hujayra RNK sekvenlash kutubxonalarini tayyorlash&lt;/span&gt;&lt;/a&gt;Yagona hujayra RNK sekvenlash kutubxonalarini tayyorlash&lt;/h4&gt;\n&lt;p&gt;24 soatlik inkubatsiyadan so‘ng, NPC yoki iGLUT (22-kun) kulturalari Accumax yordamida dissotsiatsiya qilindi. Hujayra suspenziyasi 37 mkm li elakdan o‘tkazildi, 500 × g tezlikda 5 daqiqa davomida sentrifugalandi va kontsentratsiyasi 2,2 × 10⁶ hujayra/ml ga yetkazildi (tiriklik &amp;gt;80%). Har bir yo‘lak uchun ~52 000 hujayra (83 000 yuklangan) maqsad qilindi. Hujayralarni ushlash va kutubxona tayyorlash Chromium Single Cell 5' v3 protokoli va CRISPR deteksiyasi uchun Feature Barcode texnologiyasi asosida amalga oshirildi. cDNA 10 ta PCR siklida kuchaytirildi.&lt;/p&gt;\n&lt;h4 id=\"sekvenlash-va-malumotlarni-qayta-ishlash\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#sekvenlash-va-malumotlarni-qayta-ishlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sekvenlash va ma’lumotlarni qayta ishlash&lt;/span&gt;&lt;/a&gt;Sekvenlash va ma’lumotlarni qayta ishlash&lt;/h4&gt;\n&lt;p&gt;Kutubxona sifati Fragment Analyzer yordamida tekshirildi. Sekvenlash NovaSeq 6000 platformasida bajarildi. GEX kutubxonalari uchun har bir hujayraga ~30 000 o‘qish (reads), CRISPR kutubxonalari uchun esa ~5 000 o‘qish chuqurligi ta’minlandi.&lt;/p&gt;\n&lt;h4 id=\"yagona-hujayrali-crispr-skrining-natijalarini-tahlil-qilish\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#yagona-hujayrali-crispr-skrining-natijalarini-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yagona hujayrali CRISPR-skrining natijalarini tahlil qilish&lt;/span&gt;&lt;/a&gt;Yagona hujayrali CRISPR-skrining natijalarini tahlil qilish&lt;/h4&gt;\n&lt;p&gt;Yagona hujayrali transkriptomika ma'lumotlari Seurat V5 paketi yordamida qayta ishlandi. Sifat nazorati (QC) har bir hujayra turi va dozasi uchun alohida o'tkazildi. Dastlabki bosqichda mitoxondrial, ribosomal va gemoglobin genlari foizi hisoblanib, hujayra turiga xos chegaralar asosida filtrlandi. Shuningdek, RNK soni, aniqlangan belgilar va gRNA bo'yicha qo'shimcha filtrlar qo'llanildi. Yo'naltiruvchi RNKlarni (gRNA) belgilash uchun NormalizeData funksiyasi va MULTIseqDemux usuli ishlatildi. Tahlil uchun faqat bitta gRNAga ega bo'lgan singletlar saqlab qolindi. NPC hujayralari uchun dubletlarni qayta belgilash bosqichi qo'shildi: no-target va KO gRNA saqlagan dubletlar KO gRNAga ega deb belgilandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Singlet — bu bitta gRNA saqlaydigan alohida hujayra bo'lib, u CRISPR-skriningda aniqlikni ta'minlash uchun zarurdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Singletlar aniqlangandan so'ng, UMI soni, genlar soni va log10GenesPerUMI ko'rsatkichlari bo'yicha qo'shimcha filtrlar o'tkazildi; MALAT1, ribosomal, mitoxondrial va gemoglobin genlari olib tashlandi. Biologik kovariatalar (hujayra sikli fazasi, donor, iGLUT subtiplari, astrosit va neyral tizma markerlari) SCTransform yordamida normallashtirildi. Differensial ifodalanish (DE) scrambled gRNA saqlagan hujayralarga nisbatan hisoblandi; faqat maqsadli genni sezilarli darajada kamaytirgan (p &amp;lt; 0,1 va logFC &amp;lt; 0) gidlar saqlandi. Klasterlar dominant (agar bitta gRNA &amp;gt;75% hujayrani tashkil qilsa) yoki aralash deb tasniflandi. Agar scrambled gRNA &amp;gt;50% bo'lsa, klaster aralash deb belgilandi. Yakuniy tahlilga barcha sharoitlarda 75 dan ortiq hujayrada mavjud bo'lgan genlar kiritildi. Integratsiya IntegrateData, ontologiyalarni boyitish esa clusterProfiler::gseGO orqali amalga oshirildi.&lt;/p&gt;\n&lt;h4 id=\"gen-ifodalanishiga-tasirni-meta-tahlil-qilish\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#gen-ifodalanishiga-tasirni-meta-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gen ifodalanishiga ta'sirni meta-tahlil qilish&lt;/span&gt;&lt;/a&gt;Gen ifodalanishiga ta'sirni meta-tahlil qilish&lt;/h4&gt;\n&lt;p&gt;16 ta KO va no-target hujayralar o'rtasidagi differensial ifodalanish statistikasi METAL vositasiga kiritildi. «Konvergent» genlar deb quyidagi mezonlarga javob beradiganlari belgilandi: FDR &amp;lt; 0,05, Cochran Q-testi bo'yicha ahamiyatsiz geterogenlik (p &amp;gt; 0,05) va barcha 16 KOda bir xil yo'nalishdagi o'zgarishlar. Qolganlari «konvergent bo'lmagan» deb tasniflandi.&lt;/p&gt;\n&lt;h4 id=\"er-nishonlari-va-e2-tasirini-boyitish-testi\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#er-nishonlari-va-e2-tasirini-boyitish-testi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ER nishonlari va E2 ta'sirini boyitish testi&lt;/span&gt;&lt;/a&gt;ER nishonlari va E2 ta'sirini boyitish testi&lt;/h4&gt;\n&lt;p&gt;Konvergent genlarning ER nishonlari yoki E2 tomonidan qutqarilgan genlar bilan boyitilganligini tekshirish uchun Fisherning aniq testi ishlatildi. ER nishonlari ro'yxati IPA, ENCODE, ChEA va LINKS L1000 ma'lumotlar bazalaridan olindi.&lt;/p&gt;\n&lt;h4 id=\"calcium-imaging\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#calcium-imaging\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Calcium Imaging&lt;/span&gt;&lt;/a&gt;Calcium Imaging&lt;/h4&gt;\n&lt;p&gt;Neyron tarmoqlarining faolligini baholash uchun TD30 muddatida 2μM konsentratsiyadagi fluo4-AM kaltsiy indikatoridan foydalanildi. Namunalar indikator bilan 1 soat davomida inkubatsiya qilindi va darhol tasvirga olish jarayoni boshlandi. Kaltsiy chaqnashlarini qayd etish Dragonfly aylanuvchi disk mikroskopi yordamida, x20 suvga cho'mdiruvchi obyektiv (Leica) yordamida amalga oshirildi. Tasvirga olish parametrlari: 488nm qo'zg'alish to'lqin uzunligi, 1024 x 1024 piksel fazoviy o'lcham va 0.6 x 0.6 mm ko'rish maydoni, kadr tezligi sekundiga 80ms. Tajriba sun'iy miya-parda suyuqligida (aCSF) bajarildi, uning tarkibi: 130mM NaCl, 3mM KCl, 1.25mM NaH2PO4, 26mM NaHCO3, 1mM MgCl2, 1mM CaCl2 va qo'shimcha ravishda 5mM D-(+)-glyukoza. Barcha namunalar 100nM estradiol (Sigma-Aldrich, #E2758) bilan inkubatsiya qilindi va E2 ta'siridan so'ng aynan o'sha kuzatuv maydonlari qayta tasvirga olindi. Kaltsiy tasvirlari videosidagi barcha aniqlangan hujayralar va qiziqish sohalari uchun rastr diagrammalari tuzildi. Ulardagi to'q sariq nuqtalar ma'lum vaqt oralig'ida aniq hujayradagi kaltsiy faolligi yoki spayklarni bildiradi; bunda y o'qi hujayralarni, x o'qi эса kadrlar vaqtini tavsiflaydi. Barcha rastrlar MATLAB muhitida yaratildi, so'ngra R dasturidagi hclust funksiyasi orqali UPGMA usuli yordamida ierarxik klasterizatsiyadan o'tkazildi. Issiqlik xaritalari (heatmaps) R dagi 'pheatmap' paketi yordamida olindi.&lt;/p&gt;\n&lt;p&gt;Kaltsiy tasvirlarini tahlil qilish barcha vaqt kadrlari bo'ylab har bir pikselning xom kaltsiy floresans intensivligini qayta ishlashga asoslandi. Ushbu bosqichdan so'ng, asosiy komponentlar tahlili (PCA) orqali o'lchamlarni qisqartirish yondashuvi qo'llanilib, vaqt bo'yicha eng ko'p o'zgarish ko'rsatgan dominant piksellar tanlab olindi. Shundan so'ng, aniq cho'qqilarni olish uchun barqaror va kechikuvchi kaltsiy signallarini dekonvolyutsiya qilish orqali vaqtinchalik shovqin olib tashlandi. Shovqindan xoli bo'lgach, dominant piksellar eng yuqori o'zgarishlarni ko'rsatadigan qismlarni saqlab qolish uchun har bir kadr kesimida fazoviy tarzda filtrlandi. Keyinchalik, tanlangan piksellarning fazoviy atrofidagi intensivlik naqshlarini o'rganish orqali faol spayk chiqaruvchi hujayralar aniqlandi. Aniqlangan hujayralar fazoviy dekonvolyutsiya yordamida bir-biriga o'xshash kaltsiy signallari mavjudligiga tekshirilib, noyob hujayralar ajratib olindi. Hujayralar aniqlangandan so'ng, vaqt o'tishi bilan bazal kaltsiy signalini o'rgatish uchun mashinali o'qitish algoritmi (Markov zanjiri Monte-Karlo) ishlatildi. Keyinchalik bu bazal signallar bazal darajadan sezilarli darajada farq qiluvchi signallarni (spayklar deb ataladi) aniqlash uchun qo'llanildi. Ushbu kaltsiy spayklari har bir vaqt nuqtasi uchun aniqlanib, keyinchalik vaqt bo'yicha uzluksiz spayklarni aniqlash uchun birlashtirildi. Barcha aniqlangan hujayralar uchun kaltsiy spayklari tavsiflandi, jumladan spayk amplitudasi, chastotasi, davomiyligi va umumiy soni hisobga olindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kaltsiy vizualizatsiyasi (Calcium Imaging) — bu hujayra qo'zg'ilganda kaltsiy ionlariga javoban yorug'lik chiqaruvchi flüoresan indikatorlar yordamida neyronlar faoliyatini real vaqt rejimida kuzatish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"multielectrode-array\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#multielectrode-array\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Multielectrode Array&lt;/span&gt;&lt;/a&gt;Multielectrode Array&lt;/h4&gt;\n&lt;p&gt;Ko'p elektrodispatchli matritsa (MEA) yordamida neyronlarning hujayradan tashqari elektr faolligini qayd etish Axion Maestro tizimi (Axion Biosystems) yordamida 12.5 kHz chastotada bajarildi. Signallar Neural Spikes rejimida olinib, median tuzatishdan o'tkazildi hamda 200-Hz yuqori chastotali IIR filtri va 3-kHz Kaiser oynali past chastotali filtri yordamida tozalandi. Spayklar AxIS Adaptive Threshold Crossing algoritmi yordamida, elektrodga xos shovqin darajasidan 5.5 standart og'ish yuqori qilib o'rnatilgan o'zgaruvchan chegara yordamida aniqlandi. Minutiga kamida 5 ta spayk chastotasiga ega elektrodlar faol deb hisoblandi. Burtlar (bursts) spayklar orasidagi interval (ISI) chegarasi algoritmi yordamida aniqlanib, ular maksimal 100ms ISI va kamida 5 ta spayk sifatida belgilandi. Tarmoq burtlari kamida 35% elektrodlar qatnashgan holda, maksimal 100ms ISI bilan kamida 50 ta spaykni o'z ichiga olishi shart edi. Sinxronlik 20ms oyna yordamida baholandi. MEA o'lchovlari Axion tahlil dasturi yordamida miqdoriy jihatdan baholandi. Poli-D-lizin va Geltrex bilan ikki qavat qoplangan MEA naychasiga har biri 150 000 tadan induksiyalangan glutamatergik (iGLUT) D21 neyronlari ekildi. Oziqa muhitining yarmi har 2–3 kunda yangilab turildi. MEA o'lchovlari DMSO (nazorat) yoki 100nM estradiol bilan 24 soatlik davolashdan so'ng amalga oshirildi.&lt;/p&gt;\n&lt;h4 id=\"zebrafish\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#zebrafish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Zebrafish&lt;/span&gt;&lt;/a&gt;Zebrafish&lt;/h4&gt;\n&lt;p&gt;Zebrafish (zebrafish) bilan bog'liq barcha protseduralar Yел universiteti Institutdagi hayvonlarni parvarish qilish va ulardan foydalanish qo'mitasi (IACUC; bayonnoma #2024-20054) standartlariga muvofiq bajarildi. Zebrafish lichinkalari 28°C haroratda 14:10 soat yorug'lik/qorong'ulik siklida boqildi. Lichinkalar diametri 150 mm bo'lgan Petri idishlarida ko'k suvda (0.3g/L Instant Ocean, 1 mg/L metilen ko'ki, pH 7.0) har bir idishga 60-80 tadan zichlikda o'stirildi. Xulq-atvor tahlillari 5-7 dpf yoshdagi zebrafish lichinkalarida o'tkazildi. Rivojlanishning ushbu bosqichida jins hali aniqlanmagan.&lt;/p&gt;\n&lt;h4 id=\"zeb
