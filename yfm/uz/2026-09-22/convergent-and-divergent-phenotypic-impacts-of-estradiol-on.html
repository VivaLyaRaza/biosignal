rafish-mutant-generation\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#zebrafish-mutant-generation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Zebrafish mutant generation&lt;/span&gt;&lt;/a&gt;Zebrafish mutant generation&lt;/h4&gt;\n&lt;p&gt;Barqaror zebrafish liniyalari bizning laboratoriyamizda yaratilgan (shu jumladan &lt;span class=\"yfm-latex\" data-content=\"arid1b%5E%7B%5CDelta7%2F%5C7%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"chd8%5E%7B%5CDelta7%2F%5C7%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"kdm5ba%5E%7B%5CDelta17%2F%5C17b%5CDelta14%2F%5C14%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"pogza%5E%7B%5CDelta23%2F%5C23b%5CDelta20%2F%5C20%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"cul3a%5E%7B%5CDelta7%2F%5C7b%5CDelta32%2F%5C32%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"dyrk1aa%5E%7B%5CDelta77%2F%5C77b%5CDelta8%2F%5C8%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"scn1lab%5E%7B%5CDelta44%2F%5C44%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, nrxn1a⁵i/5ib¹0i/10i, &lt;span class=\"yfm-latex\" data-content=\"ptena%5E%7B%5CDelta10%2F%5C10%7Db%5E%7B%5CDelta2%2F%5C2%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;) yoki Thyme laboratoriyasi (ash1l¹i,Δ60,19i/1i,Δ60,19i, &lt;span class=\"yfm-latex\" data-content=\"kmt5b%5E%7B%5CDelta208%2C1i%2C%5CDelta5%2F%5C208%2C1i%2C%5CDelta5%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"kmt2ca%5E%7B%5CDelta82%2C17i%2F%5C82%2C17i%7Db%5E%7B%5CDelta6%2C%5CDelta29%2F%5C6%2C%5CDelta29%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"grin2aa%5E%7B%5CDelta175%2F%5C175%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"grin2ab%5E%7B%5CDelta42%5CDelta5%5C38%2F%5C42%5CDelta5%5C38%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"cacna1g%5E%7B%5CDelta52%2F%5C52%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;) va Dallman laboratoriyasi (shank3a⁴ishank3b¹i) tomonidan tuhfa qilingan. F0 avlod mozaik mutantlari (crispants: ank2ab, bcl11aab, chd2, crebbpab, gria3ab, kdm6bab, mbd5, phf12ab, phf21aab, ppp2r5d, setd5, sin3aab, skiab, slc6a1ab, smarcc2, wacab) CRISPR-Cas9 usuli orqali yaratildi. Har bir allel uchun ikkitadan CRISPR crRNA ishlab chiqilib, asosan erta ekzonlarga qaratildi. CRISPR RNP komplekslari alohida yig'ilib, bir hujayrali bosqichda in'eksiya qilishdan oldin birlashtirildi. Nazorat guruhiga eksperimental guruh uchun ishlatilgan gidlar soniga teng miqdordagi aralash gidlar kiritildi.&lt;/p&gt;\n&lt;p&gt;In'eksiya qilingan embrionlar urug'lanishdan keyingi 5-kungacha (dpf) o'stirildi, shundan so'ng رفتار testlari bajarildi. Neyrorivojlanish buzilishlari (NDD) genlari mutantlari uchun har biriga xos bo'lmagan xulq-atvor izlari aniqlanib, mutantlar bo'ylab o'xshash va farq qiluvchi fenotiplar namoyon bo'ldi (SI 5A-rasm). Tarmoq darajasidagi funksiyalarni bo'lishishi mumkin bo'lgan konvergent xulq-atvor guruhlarini tasniflash uchun ierarxik klasterlash bilan korrelyatsiya tahlili bajarildi. NDD genlarining yuqori darajada korrelatsiyalangan xulq-atvor belgilariga ega yettita alohida kenja guruhi aniqlandi (4C-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;CRISPR crispants usuli barqaror liniyalarni uzoq muddatda yaratmasdan turib, embrionlarda genlarni vaqtincha faolsizlantirish imkonini beradi, xulq-atvor profillari esa turli genetik buzilishlarni umumiy belgilar asosida guruhlashga yordam beradi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"behavioral-assays\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#behavioral-assays\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Behavioral assays&lt;/span&gt;&lt;/a&gt;Behavioral assays&lt;/h4&gt;\n&lt;p&gt;Genetik o'zgarishlar natijasida yuzaga keladigan tarmoq darajasidagi nuqsonlarni baholash uchun zebrafish lichinkalarining qo'zg'alishi va sensorimotor ishlov berishini o'lchash maqsadida avtomatlashtirilgan, yuqori unumdorlikdagi miqdoriy xulq-atvor skriningi bajarildi. 15 ta barqaror gomozigotali mutant yoki 16 ta NDD geni uchun F0 mozaik crispant liniyalarida 24 ta vizual-startle (VSR) va uyqu- uyg'onish parametrlari o'lchandi (SI 8-9-jadvallar). Lichinkalar 96-chuqurchali planshetning (7701-1651; Whatman, Clifton, NJ) har bir chuqurchasiga 650 mkl standart embrion suvi (0.3 g/l Instant Ocean, 1 mg/l metilen ko'ki, pH 7.0) bilan Zebrabox (Viewpoint LifeSciences, Monreal, Kanada) ichiga joylashtirildi. Harakatlanish avtomatlashtirilgan video-kuzatuv tizimi (Zebrabox va ZebraLab dasturi) yordamida miqdoriy baholandi.&lt;/p&gt;\n&lt;p&gt;Vizual-startle javobi (VSR) testi 5 dpf da bajarildi. Chiroq o'chishi stimullariga javoblarni (VSR-OFF) baholash uchun lichinkalar 1 soat davomida oq nurga moslashtirildi, 30 daqiqa davomida baza faolligi kuzatildi, so'ngra 29 soniyali oq nur oralig'i bilan 1 soniyali beshta qorong'u chaqnash berildi. Chiroq yoniq stimullariga javoblarni (VSR-ON) baholash uchun tartib teskari qilindi: 1 soat qorong'ulikda moslashish, 30 daqiqa baza faolligi, so'ngra 29 soniyali qorong'ulik oralig'i bilan 1 soniyali beshta oq nur chaqnashi. VSR-OFF va VSR-ON uchun maxsus MATLAB kodi yordamida oltita parametr aniqlandi: (i) barcha cho'chish javoblarining o'rtacha jadalligi; (ii) stimuldan keyingi o'rtacha faollik; (iii) birinchi stimuldan keyingi o'rtacha faollik; (iv) stimul va stimuldan keyingi faollik nisbati; (v) birinchi stimulga javoblar jadalligi; (vi) yakuniy stimulga javoblar jadalligi.&lt;/p&gt;\n&lt;p&gt;Uyqu-uyg'onish paradigmasi VSR testlaridan so'ng 5-7 dpf oralig'ida bajarildi. 14 soat oq nur / 10 soat qorong'ulik siklida lichinkalarning faolligi va uyqu naqshlari Zebrabox ichida kuzatilib, maxsus MATLAB kodi bilan tahlil qilindi. Kunduzgi va tungi vaqtlar uchun oltita parametr o'lchandi: (i) umumiy faollik; (ii) umumiy uyqu; (iii) uyg'onish faolligi; (iv) dam olish epizodlari; (v) uyqu davomiyligi; (vi) uyqu latentligi. VSR-OFF, VSR-ON va uyqu-uyg'onish testlari davomida jami 24 ta parametr tahlil qilindi.&lt;/p&gt;\n&lt;h4 id=\"behavioral-analysis\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#behavioral-analysis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Behavioral analysis&lt;/span&gt;&lt;/a&gt;Behavioral analysis&lt;/h4&gt;\n&lt;p&gt;Har bir gen bo'yicha gomozigotali mutant va yovvoyi tip yoki crispant va nazorat baliqlarining xulq-atvor parametrlarini solishtirish uchun chiziqli aralash modellar (LMM) ishlatildi. Eksperimentlar orasidagi fenotipik o'zgaruvchanlik LMMga eksperiment sanasini tasodifiy omil sifatida kiritish orqali hisobga olindi. Ierarxik klasterlash tahlili LMM dan olingan imzolangan &lt;span class=\"yfm-latex\" data-content=\"-%5Clog_%7B10%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;-transformatsiya qilingan p-qiymatlar asosida mutantlar va xulq-atvor parametrlarini guruhlash uchun bajarildi, bu yerda ishora mutantning yovvoyi tipga yoki crispantning nazoratga nisbatan fenotipik o'zgarish yo'nalishini ko'rsatadi. 24 ta parametr bo'yicha farqlarga asoslanib mutantlar orasidagi korrelyatsiyalarni baholash uchun Pearson korrelyatsiya tahlili ishlatildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Chiziqli aralash modellar (LMM) tajriba kuni kabi tasodifiy ta'sirlarni hisobga olishga yordam beradi, ishorali p-qiymatlar esa xulq-atvorning qaysi tomonga o'zgarganini aniq ko'rsatadi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"drug-prioritization-based-on-zebrafish-pharmaco-behavioral-profiles\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#drug-prioritization-based-on-zebrafish-pharmaco-behavioral-profiles\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Drug prioritization based on zebrafish pharmaco-behavioral profiles&lt;/span&gt;&lt;/a&gt;Drug prioritization based on zebrafish pharmaco-behavioral profiles&lt;/h4&gt;\n&lt;p&gt;NDD genlari bilan bog'liq mutant va crispant xulq-atvor fenotiplari yuqorida tavsiflangan vizual-startle va uyqu-uyg'onish testlari yordamida zebrafish lichinkalarida sinovdan o'tkazilgan AQSh FDA tomonidan tasdiqlangan 376 ta dori vositalari ma'lumotlar bazasi bilan solishtirildi. Ushbu dorilar kamida ikkita xulq-atvor parametriga sezilarli ta'sir ko'rsatadi (LMM, p &amp;lt; 0.05 / 3, uchta test uchun tuzatilgan). Pearson korrelyatsiya tahlili mutant xulq-atvor signaturalari bilan sezilarli darajada korrelyatsiyalanuvchi (korrelyatsiya &amp;gt; 0.5, p &amp;lt; 0.05, t-statistika) yoki antikorrelyatsiyalanuvchi (korrelyatsiya &amp;lt; -0.5, p &amp;lt; 0.05, t-statistika) dorilarni aniqlash uchun ishlatildi (SI 14-jadval).&lt;/p&gt;\n&lt;h4 id=\"estradiol-treatment-in-zebrafish\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#estradiol-treatment-in-zebrafish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Estradiol treatment in zebrafish&lt;/span&gt;&lt;/a&gt;Estradiol treatment in zebrafish&lt;/h4&gt;\n&lt;p&gt;Mutant va estradiol bo'yicha tajribalar uchun lichinkalar faolligi 5–7 dpf yoshida kuzatildi. O'tkir estradiol tajribalarida 96 o'rali planshetning har bir o'rasiga standart embrion suvidan 650 mkl solinib, unga bittadan yovvoyi turdagi zebrafish lichinkalari joylashtirildi. DMSO da erigan β-Estradiol 17-cypionate ning 10 mM zaxira eritmasi yoki faqat DMSO nazorati bevosita har bir o'raga 20 µkM yakuniy konsentratsiyada (0.2% yakuniy DMSO) 12–24 ta bir xil genetik fondagi gomozigota yoki yovvoyi turdagi lichinkalarga qo'shildi, shundan so'ng vizual cho'chitish va uyqu- uyg'onish testlari bajarildi. Xronik estradiol tajribalarida lichinkalar 150 mm li Petri idishlarida ko'k suvda 20 µkM estradiol yoki DMSO bilan 24 soat davomida ishlov berildi, so'ngra yangi 20 µkM estradiol yoki DMSO suvi solingan 96 o'rali planshetga o'tkazilib, xulq-atvor testlari o'tkazildi. Barqaror mutant liniyalarining genotiplarini tasdiqlash uchun har bir tajribadan keyin genotipni aniqlash bajarildi. Kuchayish, o'zgarmaslik, qisman tiklanish, tiklanish va haddan tashqari to'g'rilanish ta'riflari SN-rasmda keltirilgan; dori vositasi yordamida tiklanishning statistik ahamiyatliligini baholash uchun Z-test qo'llanildi. Mutant p-qiymati ≤ 0.05 bo'lgan xulq-atvor belgilari uchun (Mutant-WT, HOM DMSO va WT DMSO) dori yordamida tiklanish p-qiymati &amp;gt;0.05 bo'lgan belgilar (Mutant-E2, HOM E2 va WT DMSO) tiklangan deb hisoblandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Z-test — ikkita guruh o'rtasidagi o'rtacha qiymatlar statistik jihatdan sezilarli farq qilishini aniqlashga yordam beradigan statistik tahlil usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Qolgan belgilar orasida dori p-qiymati &amp;gt;0.05 bo'lganlar (E2 Effect, HOM E2 va HOM DMSO) o'zgarmagan deb topildi. Agar dori p-qiymati &amp;lt;0.05 bo'lsa, dori yordamida mutlaq tiklanish effekti (Mutant-E2) mutant effektining mutlaq yo'nalishiga (Mutant-WT) qarama-qarshi yo'nalishda bo'lgan belgilar haddan tashqari to'g'rilinlangan deb hisoblandi. Agar dori p-qiymati &amp;lt;0.05 bo'lsa, mutlaq tiklanish effekti mutant effekt bilan bir xil yo'nalishda va undan kichik bo'lgan belgilar qisman tiklangan, aks holda kuchaygan deb baholandi.&lt;/p&gt;\n&lt;h4 id=\"immunohistochemistry\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#immunohistochemistry\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Immunohistochemistry&lt;/span&gt;&lt;/a&gt;Immunohistochemistry&lt;/h4&gt;\n&lt;p&gt;Ajratib olingan embrionlarni antitelolar bilan butunlay bo'yash usuli tavsiflangan tartibda bajarildi. Birikmalarning bosh miya bazal faolligiga ta'sirini sinash uchun scn1lab^Δ44/Δ44 va foniga mos scn1lab⁺/+ lichinkalari 5 dpf dan boshlab 24 soat davomida DMSO da eritilgan 20 µkM yakuniy konsentratsiyadagi estradiolga yoki faqat DMSO ta'siriga duchor qilindi. Namuna hajmlari: scn1lab⁺/+ + DMSO (n=34), scn1lab^Δ44/Δ44 + DMSO (n=35), scn1lab^Δ44/Δ44 + estradiol (n=37) 3 ta mustaqil ma'lumotlar to'plami asosida. Lichinkalar to'rsimon elakka quyish orqali yig'ilib, zudlik bilan 4% PFA / 4% saxaroza PBS + 0.25% Triton (PBST) eritmasiga botirildi. Lichinkalar 4°C da bir kecha davomida fiksatsiya qilinib, PBST da yuvildi. Imuno-bo'yashdan oldin miya to'qimalari ajratib olindi. Ajratilgan miyalar 150 mM Tris-HCl da 70°C da 15 daqiqa davomida inkubatsiya qilindi, PBST da yuvildi, 0.05% Trypsin-EDTA da muz ustida 45 daqiqa davomida o'tkazuvchan qilindi va PBST da yuvildi. Miyalar PBST, 10% BSA, 2% normal echki zardobi (NGS) va 1% DMSO aralashmasida bir soat davomida bloklandi va 4°C da bir kecha davomida NGS siz bloklovchi eritmada suyultirilgan birlamchi antitelolar bilan inkubatsiya qilindi. Quyidagi antitelolar va suyultirishlar ishlatildi: pERK va tERK, 1:500. Shundan so'ng namunalar PBST da yuvilib, xona haroratida 3 soat davomida NGS siz eritmada 1:200 suyultirishda Alexa ftoroforlari bilan bog'langan ikkilamchi antitelolar bilan inkubatsiya qilindi. Bo'yalgan miyalar past erish nuqtali agarozada (1-2%) dorsal holatda o'rnatildi va 25X (0.95W) kattalashtirishda z-stack yordamida (~200-300 mkm, qadam 1.5 mkm) konfokal mikroskopda tasvirga olindi.&lt;/p&gt;\n&lt;h4 id=\"whole-brain-activity-mapping-analysis\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#whole-brain-activity-mapping-analysis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Whole brain activity mapping analysis&lt;/span&gt;&lt;/a&gt;Whole brain activity mapping analysis&lt;/h4&gt;\n&lt;p&gt;Bosh miya faolligini butunlay xaritalash tahlili hududiy farqlarni aniqlash uchun maxsus quvur liniyasi yordamida bajarildi (dasturiy ta'minot GitHub da mavjud, DOI: 10.5281/zenodo.7996403). Qisqacha aytganda, tERK bilan bo'yalgan miyalarning konfokal z-stack tasvirlari transformatsiyaga asoslangan deformatsiya yordamida standart mos yozuvlar miyasiga nochiziqli tarzda ro'yxatga olindi. Geometrik transformatsiya pERK konfokal z-stack tasvirlariga qo'llanildi. pERK tasviri intensivliklari voxel bo'yicha bo'lish (pERK/tERK) orqali tERK intensivliklari bilan normallashtirildi. O'rtacha pERK/tERK intensivliklari Z-brain atlasida ajratilgan alohida hududlar ichida hisoblab chiqildi. 4, 8 va 149 hududli atlaslar Z-brain atlas versiyalaridan qo'lda hosil qilindi. E2 ta'siridan keyin mutant miya faolligi fenotiplari tiklangan hududlarni aniqlash uchun xom pERK/tERK qiymatlariga chiziqli aralash modellashtirish qo'llanildi.&lt;/p&gt;\n&lt;h4 id=\"visualization-of-brain-activity-phenotypes\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#visualization-of-brain-activity-phenotypes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Visualization of brain activity phenotypes&lt;/span&gt;&lt;/a&gt;Visualization of brain activity phenotypes&lt;/h4&gt;\n&lt;p&gt;Estradiol yoki tashuvchi bilan ishlov berilgan gomozigotali mutantlardagi bosh miya faolligining farqlarini yovvoyi turdagi nazorat baliqlari bilan solishtirib vizualizatsiya qilish uchun BioImage Suite Web ishlatildi. Faollik tasvirlari qayta namuna olingan standart mos yozuvlar baliq ustiga qo'yildi. pERK/tERK qiymatlarining o'rtacha qiymati va standart og'ishidan foydalangan holda mutantning foniga mos yovvoyi turdagi lichinkalarga nisbatan voxel bo'yicha Z-ball normallashtirilgan qiymati hisoblandi. Tasvirlar aksial va sagittal tekisliklardagi o'sish hamda kamayishlarni qamrab olish uchun BioImage Suite Web da yaratildi. Dori va DMSO bilan ishlov berilgan namunalar orasidagi faollik farqlari normallashtirilgan o'rtacha qiymatlarning ayirmasi sifatida vizualizatsiya qilindi. Faollik farqlari scn1lab uchun 1 dan 3 gacha bo'lgan Z-ball qiymatlarini xaritalash orqali ko'rsatildi. Barcha aksial mozaikalar Z darajasi 80 dan boshlanib, har bir tasvir uchun kesimlar bo'yicha kamayib borish tartibida ko'rsatilgan. Sagittal mozaikalar X darajasi 80 dan boshlanib, har bir tasvir uchun 10 ta kesimga kamayib borish tartibida namoyish etiladi.&lt;/p&gt;\n&lt;h4 id=\"miya-faoliyatini-tahlil-qilish\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#miya-faoliyatini-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Miya faoliyatini tahlil qilish&lt;/span&gt;&lt;/a&gt;Miya faoliyatini tahlil qilish&lt;/h4&gt;\n&lt;p&gt;Estradiol (E2) va mutant omillarining miyaning har bir sohasidagi faoliyatiga ta'sirini baholash uchun E2 va mutantning asosiy ta'sir koeffitsientlari kiritilgan chiziqli aralash modellar (LMM) ishlatildi. Tadqiqotda uch guruh baliqlar qo'llanildi: DMSO bilan ishlov berilgan yovvoyi turdagi (scn1lab⁺/+, DMSO bilan ishlangan), гомозиготные мутантlar (scn1lab^Δ 44/Δ 44) va E2 bilan ishlangan гомозиготные мутантlar. Eksperimentlar orasidagi o'zgaruvchanlikni hisobga olish uchun tajriba sanasi LMM ga tasodifiy omil sifatida kiritildi. Dori vositasining qutqarish effekti E2 bilan ishlangan mutant baliqlarni DMSO bilan ishlangan yovvoyi turdagi baliqlar bilan taqqoslash uchun E2 va mutantning miya sohalaridagi qo'shma ta'siri sifatida aniqlandi. Statistik ahamlilikni baholash uchun E2 qutqarish Z-testi ishlatildi. Mutant p-qiymati &amp;lt;0.05 bo'lgan sohalar uchun, E2 qutqarish p-qiymati &amp;gt;0.05 bo'lganlar to'liq qutqarilgan deb hisoblandi. Qolgan sohalar orasida E2 p-qiymati &amp;gt;0.05 bo'lganlar o'zgarishsiz qolgan deb topildi. Agar E2 p-qiymati &amp;lt;0.05 bo'lsa, E2 ning mutlaq qutqarish effekti mutantning mutlaq ta'siridan kichik bo'lgan sohalar qisman qutqarilgan, aks holda esa kuchaygan (exacerbated) deb baholandi. Qutqarilish darajasi chegaralarini aniqlash qarorlar daraxti SI 16-rasmda keltirilgan.&lt;/p&gt;\n&lt;p&gt;Biz har bir ma'lumotlar to'plami uchun mustaqil LMM tahlilini o'tkazdik, so'ngra meta-tahlil hosil qilish uchun 3 ta tajriba bo'yicha baholarni birlashtirdik. Birlashtirilgan baholash eksperimentga xos baholarning teskari dispersiyali vaznli o'rtachasi sifatida hisoblandi. Tajribalar bo'yicha statistik ahamlilik umumiy p-qiymatini olish uchun Fisherning birlashtirilgan ehtimollik testi yordamida baholandi. Birlashtirilgan baholarga asoslanib, miya sohalari qutqarilish darajalariga ko'ra tasniflandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Chiziqli aralash model (LMM) — bu ierarxiyaga ega yoki o'zaro bog'liq ma'lumotlarni tahlil qilish uchun ishlatiladigan statistik usul bo'lib, u umumiy qonuniyatlarni (qat'iy ta'sirlar) ham, tasodifiy chetlanishlarni ham birdek hisobga olish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tutqanoqlar\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#tutqanoqlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tutqanoqlar&lt;/span&gt;&lt;/a&gt;Tutqanoqlar&lt;/h4&gt;\n&lt;p&gt;PTZ ta'sirida keltirib chiqarilgan tutqanoq tahlillari Hoffman va boshq. (2016) ishiga asoslanib, ba'zi o'zgartirishlar bilan bajarildi. Estradiolni qutqarish tajribalari uchun lichinkalar 4 dpf dan 5 dpf gacha bo'lgan davrda, kechasi davomida Petri idishlarida 20 µ M estradiol yoki DMSO nazorati ostida saqlandi (har bir guruh uchun genotip bo'yicha n=24). 5 dpf da lichinkalar pipetka yordamida estradiol yoki nazorat suvi (650 µ L standart metilen ko'ki embrion suvi: 0.3 g/L Instant Ocean, 1 mg/L metilen ko'ki, pH  7.0) bo'lgan 96 quduqli planshetning o'ralariga o'tkazildi. Planshet maxsus o'zgartirilgan Zebrabox qurilmasiga joylashtirildi. Lichinkalarning harakati PTZ yoki suv qo'shilishidan oldin va keyin 30 daqiqa davomida Videotrack miqdoriy rejimida yozib olindi. Videotrack aniqlash parametrlari shovqinni minimal darajada ushlab, lichinkalar harakatini aniq qayd etish uchun empirik tarzda tanlandi. PTZ sterillangan distillangan suvda suyultirildi va to'g'ridan-to'g'ri har bir o'raga qo'shilib, yakuniy konsentratsiyasi 10 mM bo'lgan holda tahlil davom ettirildi. PTZ qo'shilishidan oldingi va keyingi faollik ma'lumotlari chiziqli grafiklar shaklida vizualizatsiya qilindi. Ma'lumotlar har bir baliqning PTZ qo'shilishidan keyingi faolligini uning PTZ gacha bo'lgan qiymatlariga normallashtirish orqali tahlil qilindi. Gen, estradiol va PTZ javoblarini o'zaro ajratib olish uchun uch tomonlama LMM ishlatildi. Zebralab dasturiy ta'minoti faollik darajasini tavsiflash uchun quyidagi parametrlarni generatsiya qiladi: frect (muzlash soni), fredur (muzlash davomiyligi), midct (o'rta harakatlar soni), middur (o'rta harakatlar davomiyligi), burct (chaqnashlar soni), burdur (chaqnashlar davomiyligi), zerct (nol soni), zerdur (nol davomiyligi) va actinteg (harakat integratsiyasi).&lt;/p&gt;\n&lt;h4 id=\"ommaviy-rnkni-ajratib-olish-va-sekvenirlash\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#ommaviy-rnkni-ajratib-olish-va-sekvenirlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ommaviy RNKni ajratib olish va sekvenirlash&lt;/span&gt;&lt;/a&gt;Ommaviy RNKni ajratib olish va sekvenirlash&lt;/h4&gt;\n&lt;p&gt;Jami RNK ko'zlari olib tashlangan ajratilgan lichinka boshlaridan (har bir genotip/shart uchun n=3 ta bosh, har bir namuna uchun 1 ta bosh) 38-manbada tasvirlanganidek ajratib olindi. Genetik fonni nazorat qilish uchun RNK 5–6 dpf davomida 24 soat davomida DMSO da eritilgan 20 µ M estradiol yoki faqat DMSO ta'siriga uchragan scn1lab^Δ 44/+ geterozigotali baliqlarning opa-singil yoki amakivachcha juftliklaridan olingan lichinkalardan ajratildi. Lichinkalarning genotipi 3 dpf da avval ta'riflanganidek Zebrafish Embryo Genotyper (ZEG) tizimi (wFluidx, Solt-Leyk-Siti, Yuta, AQSh) yordamida aniqlandi. 6 dpf da lichinkalar muz ustida 15 daqiqa davomida evtanaziya qilindi, shundan so'ng nozik pinset yordamida boshlar ajratib olinib, ko'zlari olib tashlandi. RNK darhol RNeasy Micro Kit (Qiagen) yordamida ajratib olindi. RNK kutubxonasini tayyorlash NEBNext Single Cell Low Input RNA Library Prep Kit (Cat# E6420L) yordamida bajarildi va Yale Genomik tahlil markazida (Illumina kompaniyasining NovaSeq X Plus qurilmasida) har bir namuna uchun 25 million o'qish (reads) hajmida sekvenir qilindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Jami RNK sekvenirashi (RNA-seq) namunadagi barcha faol genlarning ifodalanish darajasini o'lchashga imkon beradi, kam miqdordagi boshlang'ich material uchun mo'ljallangan to'plamlar esa zebrafish lichinkalarining kichik bosh qismlari kabi mikroskopik namunalar bilan ishlashga yo'l ochadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ommaviy-rna-seq-malumotlaridan-differensial-ekspressiyalanuvchi-genlarni-aniqlash\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#ommaviy-rna-seq-malumotlaridan-differensial-ekspressiyalanuvchi-genlarni-aniqlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ommaviy RNA-seq ma'lumotlaridan differensial ekspressiyalanuvchi genlarni aniqlash&lt;/span&gt;&lt;/a&gt;Ommaviy RNA-seq ma'lumotlaridan differensial ekspressiyalanuvchi genlarni aniqlash&lt;/h4&gt;\n&lt;p&gt;Differensial ekspressiyalanuvchi genlarni (DEG) aniqlash uchun past sifatli o'qishlar qirqilib, adapter ifloslanishlari Trim Galore (v0.5.0) yordamida olib tashlandi. Tozalangan o'qishlar HISAT2 (v2.1.0) yordamida &lt;em&gt;Danio rerio&lt;/em&gt; mos yuvish genomiga (GRCz11) kartalashtirildi. Genlarning ekspressiya darajalari Ensembl bazasining gen modellari (103-reliz) asosida StringTie (v1.3.3b) yordamida miqdoriy baholandi. Differensial ekspressiya tahlili DESeq2 (v1.22.1) yordamida amalga oshirildi.&lt;/p&gt;\n&lt;h4 id=\"ommaviy-rna-seq-yollarini-tahlil-qilish\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#ommaviy-rna-seq-yollarini-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ommaviy RNA-seq yo'llarini tahlil qilish&lt;/span&gt;&lt;/a&gt;Ommaviy RNA-seq yo'llarini tahlil qilish&lt;/h4&gt;\n&lt;p&gt;Qutqarilgan DEG larning biologik funktsiyalarini tushunish uchun PANTHER yordamida funktsional yo'l tahlili bajarildi. Avvalroq ta'riflanganidek, zebrafish genlari EnsemblBioMart (versiya GRCz10/danRer10) orqali inson ortologlariga moslashtirildi. Estradiol ta'siridan so'ng tiklangan yo'llarni aniqlash uchun dastlab mutant + E2 yo'q guruh va yovvoyi tur o'rtasidagi (p &amp;lt; 0.1 nominal qiymat bilan), shuningdek mutant + estradiol va yovvoyi tur o'rtasidagi (p &amp;lt; 0.1 nominal qiymat bilan) DEG lar aniqlandi. Keyin ikkala taqqoslashdagi DEG lar yuqori (o'zgarish koeffitsienti &amp;gt;1) va past (o'zgarish koeffitsienti &amp;lt;1) ekspressiyalangan guruhlarga bo'lindi va Gene Ontology (GO) biologik jarayonlari, hujayra komponentlari hamda molekulyar funktsiyalaridan muhim biologik yo'llarni aniqlash (FDR &amp;lt; 0.05) uchun PANTHER ishga tushirildi. [mutant + DMSO pastga regulyatsiya qilingan va mutant + estradiol yuqoriga regulyatsiya qilingan] hamda [mutant + DMSO yuqoriga regulyatsiya qilingan va mutant + estradiol pastga regulyatsiya qilingan] yo'llarining kesishishlarini o'rganish va estradiol teskari ta'sir ko'rsatgan yo'llarni aniqlash uchun InteractiVenn ishlatildi.&lt;/p&gt;\n&lt;h4 id=\"kop-modalli-transkriptomik,-hujayraviy-va-xulq-atvor-malumotlarini-integratsiyalash\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#kop-modalli-transkriptomik,-hujayraviy-va-xulq-atvor-malumotlarini-integratsiyalash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ko'p modalli transkriptomik, hujayraviy va xulq-atvor ma'lumotlarini integratsiyalash&lt;/span&gt;&lt;/a&gt;Ko'p modalli transkriptomik, hujayraviy va xulq-atvor ma'lumotlarini integratsiyalash&lt;/h4&gt;\n&lt;p&gt;scRNA (n hujayra, m gen), kalsiy imijingi (n hujayra, m fenotip) va zebrafish (n hujayra, m fenotip) ma'lumotlarini birlashtirish uchun metrik o'lchovli fazolar (MMS) yondashuvi qo'llanildi. Har bir modallik &lt;span class=\"yfm-latex\" data-content=\"k%20%5Cin%20%5C%7B1%2C2%2C3%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; c(k) = (X(k), C(k), p(k)) sifatida ifodalanadi, bu yerda C(k) — ichki modallik masofalar matritsasi, p(k) esa bir xil ehtimollik taqsimotidir. Modalliklarni moslashtirish uchun Gromov-Wasserstein (GW) masofasi ishlatiladi, u hujayralararo munosabatlar geometriyasini π transport matritsasi orqali minimallashtiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gromov-Wasserstein (GW) masofasi — bu turli xil ma'lumotlar tuzilmalarini (masalan, genlar va fenotiplar) ular o'z guruhlari ichida qanday bog'langanligini taqqoslash orqali solishtirish imkonini beruvchi matematik usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Umumiy latent fazoni topish uchun barycenterlar (sintetik massalar markazlari) B = (Y, C, p) aniqlanadi. Optimallashtirish iterativ tarzda amalga oshiriladi: avval π(k) bog'lanishlarni yangilash uchun barycenter o'rnatiladi, so'ngra kvadratik yo'qotish funksiyasi yordamida barycenter masofalar matritsasi C yangilanadi. Umumiy fazo olingandan so'ng, MDS (ko'p o'lchovli masshtablash) yordamida past o'lchovli evklid embeddinglari yaratiladi.&lt;/p&gt;\n&lt;h4 id=\"estradiolga-eng-kop-va-eng-kam-sezgir-bolgan-genlarni-taqqoslash\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#estradiolga-eng-kop-va-eng-kam-sezgir-bolgan-genlarni-taqqoslash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Estradiolga eng ko'p va eng kam sezgir bo'lgan genlarni taqqoslash&lt;/span&gt;&lt;/a&gt;Estradiolga eng ko'p va eng kam sezgir bo'lgan genlarni taqqoslash&lt;/h4&gt;\n&lt;p&gt;Biz 34 471 nafar RAA (SPARK, ASC, SSC, MSSNG) va 31 052 nafar rivojlanish buzilishlari bo'lgan (DDD13K, GeneDx, RUMC76) shaxslardagi de novo PTV variantlarini tahlil qildik. Genlar ikki guruhga ajratildi: estradiolga eng sezgir (n = 7: ASH1L, SCN2A, SHANK3, ASXL3, MED13L, CACNA1G, ANK2) va eng kam sezgir (n = 29, jumladan ANK3, ARID1B, CHD8 va b.). Klinik fenotiplar (FSIQ, SCQ, DCDQ, RBSR, SRS, VABS) SPARK kohortasida jinslar bo'yicha solishtirildi. Ekspressiya assotsiatsiyalari UCLA va BrainVar ma'lumotlari asosida log2 fold change orqali baholandi. Rivojlanish bosqichlaridagi ko-ekspressiya BrainSpan bazasi yordamida Spearman korrelyatsiyasi va STRING tarmog'i orqali o'rganildi. Guruhlararo bog'liqlik Wilcoxon testi bilan tekshirildi.&lt;/p&gt;\n&lt;h4 id=\"etika-bayonnomasi\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#etika-bayonnomasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Etika bayonnomasi&lt;/span&gt;&lt;/a&gt;Etika bayonnomasi&lt;/h4&gt;\n&lt;p&gt;Yel universiteti institutsional kengashi ushbu ish uchun etika ruxsatini talab qilmadi, chunki hiPSC liniyalari va miya ma'lumotlari shaxsni aniqlash imkonini bermaydi va inson ishtirokidagi tadqiqot hisoblanmaydi. Zebrafish bilan bog'liq barcha protseduralar IACUC (protokol № 2024-20054) standartlariga muvofiq o'tkazildi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-f5.jpg\" alt=\"5-rasm: Estradiol scn1lab/SCN2A mutantlarida transkriptsion va neyron tarmoq faolligi disregulyatsiyasini tiklaydi. A. s\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm: Estradiol scn1lab/SCN2A mutantlarida transkriptsion va neyron tarmoq faolligi disregulyatsiyasini tiklaydi. A. scn1lab-/- lichinkalarida estradiolning bazal gen ekspresiyasiga ta'sirini baholash uchun eksperimental ish jarayonining sxemasi. B-C. scn1lab-/- + DMSO da yuqori tartibga solingan (B) yoki pastga tartibga solingan (C) DEG'larning (p &amp;lt;0.1) va scn1lab-/- + estradiol (E2) da no-DEG'larning (p &amp;gt;0.1) kesishishini ko'rsatuvchi Venn diagrammalari, tiklangan DEG'larni ifodalaydi. Venn diagrammalari InteractiVenn155 da qilingan. Yuqori tartibga solingan (qizil) va pastga tartibga solingan (ko'k) tiklangan DEG'lar orasida boyitilgan Gene Ontology (GO)50 yo'llari Venn diagrammalari ostida ko'rsatilgan. Shtrixli chiziq FDR &amp;lt;0.05 ni bildiradi. Tiklangan yo'llarning to'liq ro'yxati uchun SI 16-jadvaliga qarang. D. pERK/tERK faolligini 149 va 4 hududli z-brain atlasiga xaritalash usulining sxemasi. (E) 4 hududli atlas bo'yicha estradiol tiklangan hududlar. (F) scn1labΔ44/Δ44 + DMSO yoki E2 da miya faolligi farqlarini bildiruvchi voxel bo'yicha Z balli normallashtirilgan pERK/tERK qiymatlari DMSO bilan davolangan scn1lab+/+ lichinkalariga nisbatan, vakillik eksperimentidan ikkita shart orasidagi farq va uch eksperiment meta-tahlilidagi 149 hududli atlasdan tiklangan hududlar. Barcha uchta takroriy eksperimentlarni vizualizatsiya qilish uchun SI 13-rasmga qarang. (G) scn1labΔ44/Δ44 + DMSO va scn1lab+/+ + DMSO miyalarida faollikdagi (pERK/tERK) sezilarli farqlarga ega 149 hududli atlasdan hududlarni ko'rsatadigan issiqlik xaritasi (p &amp;lt;0.05, LMM meta-tahlil) scn1labΔ44/Δ44 + E2 da tiklangan (p &amp;gt;0.05, LMM meta-tahlil) yoki qisman tiklangan (tiklanish chegarasi mezonlari uchun Metodlar va SI 16-rasmga qarang). Har bir to'rtburchak scn1labΔ44/Δ44 + E2 yoki DMSO da miya faolligini scn1lab+/+ + DMSO bilan solishtiruvchi LMM dan masshtablangan betani bildiradi (pushti, scn1lab+/+ + DMSO dan yuqori; tsian, scn1lab+/+ + DMSO dan past). Hudud nomlari yonida ko'rsatilgan ranglar F panelidagi \"Tiklangan hududlar\" tasviriga tegishli. Yulduzchalar (&lt;/em&gt;) DMSO shartida muhim bo'lgan hududlarni ko'rsatadi. Funt belgisi (#) E2 shartida qisman tiklangan hududlarni ko'rsatadi. E2 shartidagi bo'sh quti to'liq tiklanishni bildiradi. H. Chapda: scn1lab-/- lichinkalarida estradiolning qo'zg'atilgan tutqanoq faolligiga ta'sirini baholash uchun eksperimental ish jarayonining sxemasi. I. Pentilentetrazol (PTZ) ta'sirida qo'zg'atilgan tutqanoq faolligi, 20 µM estradiol bilan 24 soatlik ta'sir qilgan va qilmagan holda, videokuzatuv yordamida scn1lab-/- lichinka zebrafish mutantlarida o'lchanadi. DMSO transport vositasi yoki 20 µM estradiol va 10 mM PTZ yoki suv ta'siridan oldin va keyin 5 dpf da nazorat va scn1lab-/- lichinkalarining vakillik faollik izlari. Lenta +/- SEM ni ko'rsatadi. J. 10 mM PTZ yoki suv qo'shilishidan 30 daqiqa oldin (pre) va keyin (post) nazorat va scn1lab-/- lichinkalariga DMSO transport vositasi yoki 20 µM estradiol ta'siridan oldin va keyin o'rtacha faollik. scn1lab-/- + E2 + PTZ lichinkalari scn1lab-/- + transport vositasi + PTZ lichinkalariga nisbatan sezilarli darajada pasaygan faollikni ko'rsatadi (post qiymatlari bo'yicha Welch tuzatishi bilan juftlanmagan t-test, ****p&amp;lt;0.0001; n=24/guruh). K. Post va pre-PTZ o'lchovlarini solishtirib, genotip-x-estradiol-x-PTZ ta'sirini baholovchi o'zaro ta'sir modellari. Mutant effekti (HOM va nazorat), estradiol effekti (Estradiol va DMSO) va PTZ effekti (PTZ va suv) tahlili (i). Genotip-x-estradiol lichinkalar guruhlari orasida PTZ ta'sirini baholash uchun uch tomonlama o'zaro ta'sir modeli (ii). L. Chapda: CRISPR tomonidan ishlab chiqilgan SCN2A+/- iGLUTs da estradiolning neyron portlash faolligiga ta'sirini baholash uchun eksperimental ish jarayonining sxemasi. O'ngda: O'tkir 100nM estradiol ta'sirida va ta'sirisiz hujayrali va tarmoq portlash faolligi ko'p elektrodli matritsa yordamida SCN2A+/- NGN2-iGLUTs da o'lchanadi. Ustunli diagrammalar nazorat va SCN2A+/- iGLUTs da hujayrali portlashlar va tarmoq portlashlarining o'rtacha sonini ko'rsatadi. Juftlanmagan t-test, hujayrali portlashlar *p=0.0415, tarmoq portlashlari SCN2A+/- spontan va SCN2A+/- E2 *p=0.0127, SCN2A+/- spontan va WT spontan &lt;em&gt;p=0.0450.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-f6.jpg\" alt=\"6-rasm: Multimodal meta-tahlil ASH1L va SCN2A mutantlarida estradiolning eng yuqori teskari ta'sir effektini aniqlaydi. \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm: Multimodal meta-tahlil ASH1L va SCN2A mutantlarida estradiolning eng yuqori teskari ta'sir effektini aniqlaydi. A. Uchta modalik bo'ylab nishonga olingan 36 ta NDD xavf genlari jadvali: iGLUT yagona hujayra transkriptomikasi (yashil), iGLUT kaltsiy vizualizatsiyasi (ko'k) va zebrafish xulq-atvori (binafsharang). Har bir maqsadli gen uchun qutining yuqori yarmining rangi qaysi modalik sinovdan o'tkazilganligini, pastki yarmining rangi esa estradiol qaysi modalikni qutqarganligini ko'rsatadi. Oq qutilar mutantda estradiolning qutqarish effekti kuzatilmaganligini bildiradi. B. Har bir modalikning geometrik o'rtacha qiymatini aniqlash va estradiol effektini nazorat effektidan ajratish uchun Vasserseyn Baritsentr usulining sxematik tasviri. T&lt;/em&gt; bir taqsimotni boshqasiga moslashtirish rejasini, Z* esa taqsimotlar birgalikda uchrashadigan baritsentr latent fazosini ko'rsatadi. C. Nazorat effektini (yashil), estradiol effektini (to'q sariq) va estradiolga oid bo'lmagan effektni (kulrang) ko'rsatuvchi baritsentr grafigi. Modalliklar turli shakllar bilan ifodalanadi. Doira (•) har bir mutant uchun differensial ekspressiya qilingan genlarni bildiradi. Plyus belgisi (+) har bir mutant uchun sinxronizatsiya naqshini ko'rsatadi. Yulduzcha (&lt;em&gt;) alohida lichinkalarning xulq-atvor javoblarini bildiradi. Baritsentrlar uchburchaklar (∆) bilan ko'rsatilgan. D. Proyeksiyalangan latent fazoda modalliklar orasidagi masofaning issiqlik xaritasi. Issiq ranglar qisqaroq masofani, sovuq ranglar esa uzunroq masofani bildiradi. Masshtab paneli har bir modalikning proyeksiyalangan fazodagi masofasiga normallashtirilgan. E. Modalliklar bo'ylab estradiolning teskari ta'sir kattaligi asosida genlarni reytingga qo'yish.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-f7.jpg\" alt=\"7-rasm: Estradiolga javob beruvchi genlarning tarmoq bog'liqligi, ontogenetik ekspressiyasi va jinsga bog'liq ekspressiy\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-rasm: Estradiolga javob beruvchi genlarning tarmoq bog'liqligi, ontogenetik ekspressiyasi va jinsga bog'liq ekspressiyasi. A. UCLA va BrainVar kortikal transkriptomik ma'lumotlar bazalarida hamda ularning meta-tahlilida jinsga bog'liq gen ekspressiyasining kattaligi. Erkak va ayol namunalari orasidagi mutlaq logarifmik o'zgarish kattaligi (/log2FC/) jinsga bog'liq ekspressiya kattaligini miqdoriy baholash uchun ishlatildi. Qutilar mediana va interkvartal diapazonni (IQR) ko'rsatadi, alohida nuqtalar esa genlarni bildiradi. Ikki gen guruhi orasidagi farqlar ikki tomonlama Uilkoxon rang-summa testlari yordamida baholandi. B. BrainSpan bosh miya po'stlog'ida ikki gen guruhining ontogenetik ekspressiya traektoriyalari. Ekspressiya qiymatlari genlar ichida z-ballarga standartlashtirildi va egri chiziqlar har bir gen uchun median gen bo'yicha ekspressiya z-ballining ontogenetik traektoriyalarini ko'rsatadi. Spirmenning rang-korrelyatsiya koeffitsienti (rho) va mos keladigan P qiymatlari har bir gen guruhi uchun rivojlanish bosqichi va ekspressiya o'rtasidagi monoton bog'liqlikni miqdoriy aniqlaydi. C. Rivojlanib borayotgan inson po'stlog'ida ikki gen guruhining hujayra turiga xos ekspressiyasi. Gen bo'yicha ekspressiya qiymatlari hujayra turlari bo'ylab standartlashtirildi va ustunlar hujayra turining interkvartal diapazonli (IQR) mediana ekspressiya z-ballini bildiradi. Ikki gen guruhi orasidagi farqlar hujayra turlari bo'ylab Benjamini–Hochberg FDR tuzatishi bilan birga ikki tomonlama Uilkoxon rang-summa testlari yordamida baholandi. Hujayra turi qisqartmalari quyidagilardan iborat: vRG, qorincha radial gliyasi; oRG, tashqi radial glia; PgS, S-fazali tsiklik ota-ona hujayralari; PgG2M, G2/M-fazali tsiklik ota-ona hujayralari; IP, oraliq ota-ona hujayralari; ExN, yangi tug'ilgan/migratsiya qiluvchi qo'zg'atuvchi neyronlar; ExM, yetilayotgan qo'zg'atuvchi neyronlar; ExM-U, yuqori qatlamga boyitilgan yetilayotgan qo'zg'atuvchi neyronlar; ExDp1 va ExDp2, chuqur qatlam qo'zg'atuvchi neyron turlari 1 va 2; InMGE, medial ganglial bo'rtmadan kelib chiqqan interneyronlar; InCGE, kaudal ganglial bo'rtmadan kelib chiqqan interneyronlar; OPC, oligodendrotsit o'tmishdosh hujayralari; Mic, mikroglia; End, endotelial hujayralar; va Per, perisitlar. D. BrainSpan bosh miya po'stlog'i namunalarida ikki gen guruhining rivojlanish bosqichiga xos qo'shma ekspressiya bog'liqligi. Har bir rivojlanish bosqichi uchun juftlikdagi gen-gen Spirmen korrelyatsiyalari kortikal namunalar bo'ylab hisoblab chiqildi va har bir gen uchun guruh ichidagi o'rtacha Spirmen korrelyatsiyasi hisoblandi. Nuqtalar gen darajasidagi median bog'liqlikni, xato chiziqlari esa interkvartal diapazonni (IQR) bildiradi. Har bir rivojlanish bosqichidagi guruh farqlari bosqichlar bo'ylab Benjamini–Hochberg yolg'on kashfiyot darajasi (FDR) tuzatishi bilan ikki tomonlama Uilkoxon rang-summa testlari yordamida baholandi. E. STRING funksional o'zaro ta'sir tarmog'i yordamida estradiolga eng sezgir bo'lgan yettita gen va eng kam sezgir bo'lgan 29 ta gen orasidagi normallashtirilgan guruh ichidagi oqsil-oqsil o'zaro ta'siri (PPI) darajasining taqqoslanishi. Normallashtirilgan daraja har bir gen uchun guruh ichidagi o'zaro ta'sirlar sonini uning gen guruhi ichidagi mumkin bo'lgan maksimal o'zaro ta'sirlar soniga bo'lish yo'li bilan hisoblandi. Guruhlar orasidagi farqlar ikki tomonlama Uilkoxon rang-summa testi yordamida baholandi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-fS1.jpg\" alt=\"Rasm S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" a
