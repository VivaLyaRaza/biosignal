        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"111\" cy=\"75\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"569\" cy=\"263\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · MICROBIOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Balamuthia mandrillaris&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;xavfli amebasi uchun yangi&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;tezkor test&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio-f1.jpg\" alt=\"1-rasm. B. mandrillaris 18S rRNA ni nishonga olgan LAMP praymerlarining joylashuvi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. B. mandrillaris 18S rRNA ni nishonga olgan LAMP praymerlarining joylashuvi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Olimlar o'ta xavfli Balamuthia mandrillaris amebasini aniqlash uchun halqali izotermik amplifikatsiya (LAMP) usuliga asoslangan tezkor va sezgir test ishlab chiqdilar. Yangi usul murakkab laboratoriya jihozlarisiz qo'zg'atuvchini qisqa vaqt ichida aniqlash imkonini beradi. Test qon, siydik va miya-parda suyuqligi namunalarida parazit DNKsini muvaffaqiyatli aniqlaydi. Endilikda to'g'ri tashxisni hatto resurslari cheklangan kichik tibbiyot markazlarida ham qo'yish mumkin.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Balamuthia mandrillaris infeksiyasini aniqlash uchun ilk LAMP testi yaratildi.&lt;/li&gt;\n&lt;li&gt;Usulning sezgirligi odatiy ПЦР ga qaraganda 10-100 marta yuqori.&lt;/li&gt;\n&lt;li&gt;Test qon, siydik va miya suyuqligida o'z samaradorligini to'liq saqlab qoladi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Balamuthia mandrillaris amebasi o'lim darajasi 92% gacha bo'lgan kam uchraydigan, ammo juda xavfli miya yallig'lanishini keltirib chiqaradi. Amaldagi tashxis usullari ko'p vaqt talab qiladi, sezgirligi past va faqat ixtisoslashgan markazlardagina mavjud, holbuki bemorni qutqarish uchun tashxis qo'yish tezligi juda muhimdir.&lt;/p&gt;\n&lt;p&gt;Tadqiqotchilar amebaning 18S rRNA geni uchun LAMP testini ishlab chiqdilar va optimallashtirdilar, uning natijasini fenol qizili yordamida oddiy ko'z bilan ko'rish mumkin. Yangi usul o'nta turli B. mandrillaris shtammida sinovdan o'tkazildi: test boshqa mikroorganizmlar bilan reaksiyaga kirishmadi va odatiy ПЦР ga nisbatan 10-100 marta yuqori sezgirlik ko'rsatdi.&lt;/p&gt;\n&lt;p&gt;Usul miya-parda suyuqligi, siydik va qon kabi murakkab biologik muhitda ham yuqori samaradorlikni saqlab qoldi. Aniqlash chegarasi 10 fg/mkl DNK ni tashkil etdi, yangi usul oddiy klinik sharoitlarda tezkor tashxis qo'yish uchun juda qulay.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot yangi usulning laboratoriya ishlanmasi va validatsiyasini tavsiflaydi, biroq real sharoitlarda keng ko'lamli klinik sinovlar hali o'tkazilishi kerak.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;Erkin yashovchi Balamuthia mandrillaris ameby teri shikastlanishlari, tizimli kasalliklar va markaziy asab tizimining og'ir, hayot uchun xavfli bo'lgan Balamuthia amebik enpsefalit (BAE) infeksiyasini keltirib chiqarishi mumkin, bunda o'lim darajasi taxminan 92% ni tashkil qiladi. B. mandrillaris uchun hozirgi tashxis qo'shish usullari ko'plab cheklovlarga ega, jumladan uzoq vaqt talab etilishi, past sezgirlik va maxsus testlarning faqat yuqori ixtisoslashgan markazlardagina mavjudligi. Infeksiya juda tez rivojlanganligi sababli, erta tashxis qo'yish davolanish uchun muhim ahamiyat kasb etadi. Shu munosabat bilan, olimlar B. mandrillaris ning 18S rRNA geniga qaratilgan, fenol qizili yordamida oddiy ko'z bilan kuzatish mumkin bo'lgan yangi halqali izotermik amplifikatsiya (LAMP) usulini ishlab chiqdilar, optimallashtirdilar va baholadilar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LAMP usuli DNKni maxsus qimmatbaho jihozlarsiz, bir xil haroratda tez nusxalash imkonini beradi, fenol qizili esa natijani ko'z bilan ko'rishni ta'minlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu yangi diagnostik tahlil sinovdan o'tgan boshqa erkin yashovchi amebalar, protozoylar, zamburug'lar yoki bakteriyalarning DNKsi bilan hech qanday o'zaro reaksiyaga kirishmagan holda, o'nta turli B. mandrillaris izolatlarini aniqlay oladi. An'anaviy PZR bilan solishtirganda, bizning LAMP tahlilimiz ajratilgan DNK, issiqlik bilan ishlov berilgan namunalar va ishlov berilmagan namunalar uchun taxminan 10–100 marta yuqori sezgirlikni ko'rsatdi. Aniqlash chegarasi (LOD) mos ravishda 10 fg/mkl DNK, ishlov berilmagan hujayralar uchun 10 trofozoit/100 mkl va issiqlik bilan ishlov berilgan hujayralar uchun 1 trofozoit/100 mkl ni tashkil etdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Yangi LAMP usuli 10 ta izolatni o'zaro reaksiyalarsiz aniqlaydi, oddiy PZRdan 10–100 marta sezgir bo'lib, 10 fg/mkl DNK va 1 trofozoit/100 mkl gacha aniqlash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Qo'shimcha ravishda, ushbu metod murakkab biologik muhitlarga chidamli bo'lib, miya-parda suyuqligi, siydik va qon namunalarida ham o'z samaradorligini saqlab qoldi. Ishlab chiqilgan LAMP usulining soddaligi, mustahkamligi va yuqori sezgirligi tufayli u tezkor klinik aniqlash va tashxis qo'yish uchun, ayniqsa ixtisoslashmagan markazlarda va resurslari cheklangan hududlarda foydali bo'ladi. Mualliflar B. mandrillaris uchun ilk LAMP diagnostika usulini taqdim etdilar; bu ish 2025-yil 4-noyabr, seshanba kuni Meksikaning Puerto-Morelos shahrida bo'lib o'tgan Erkin yashovchi amebalarning biologiyasi va patogenligi bo'yicha 20-Xalqaro yig'ilishida (FLAM 2025) e'lon qilindi.&lt;/p&gt;\n&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"klinik-tashxis-qiyinchiliklari-va-infeksiyaning-kechish-xususiyatlari\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#klinik-tashxis-qiyinchiliklari-va-infeksiyaning-kechish-xususiyatlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Klinik tashxis qiyinchiliklari va infeksiyaning kechish xususiyatlari&lt;/span&gt;&lt;/a&gt;Klinik tashxis qiyinchiliklari va infeksiyaning kechish xususiyatlari&lt;/h4&gt;\n&lt;p&gt;Erkin yashovchi &lt;em&gt;B. mandrillaris&lt;/em&gt; amyobasi odamlar va hayvonlarda markaziy asab tizimining kam uchraydigan, ammo deyarli har doim o‘lim bilan yakunlanadigan Balamutiya amyobali ensefaliti (BAE) kasalligini keltirib chiqaradi. BAE kasalligini klinik jihatdan aniqlash juda murakkab vazifa bo‘lib qolmoqda, chunki dastlabki alomatlar ko‘pincha noaniq yoki sezilarsiz bo‘ladi, shuning uchun kasallikni ko‘pincha o‘smalar, abssesslar, boshqa yallig‘lanishli nevrologik patologiyalar yoki ko‘proq tarqalgan meningit qo‘zg‘atuvchilari deb adashib o‘ylashadi. Dastlabki klinik bosqichda an'anaviy tashxis usullariga KT va MRT kabi neyrovizualizatsiya usullari hamda gistologik tekshiruv kiradi. BAE uchun o‘ziga xos belgilarning yo‘qligi ko‘pincha noto‘g‘ri tashxis qo‘yilishiga olib keladi va ko‘plab holatlar faqat vafot etgandan keyingina aniqlanadi. immunohistokimyoviy bo‘yash va immunoflyoressensiya tahlillari tashxis qo‘yish uchun zarur, biroq bu sinovlar maxsus antitelolarni talab qiladi va faqat sanoqli laboratoriya hamda tadqiqot markazlarida mavjud xolos. Xitoy va Peru kabi ayrim geografik hududlarda BAE bilan og‘rigan ko‘plab bemorlarda markaziy asab tizimi zararlanishidan oldin teri leziyalari kuzatiladi, bu esa kasallikni erta aniqlash va o‘z vaqtida chora ko‘rish evaziga yuqoriroq yashovchanlik ko‘rsatkichlarini ta'minlaydi hamda bu kabi bemorlarda erta tashxis qo‘yish muhimligini ko‘rsatadi. AQShda esa biz odatda bemorlarning teri leziyalarisiz, faqatgina BAE kasalligi bilan murojaat qilishini ko‘ramiz. Mualliflar turli hududiy genotiplar yoki shtammlar turli Leishmania turlariga o‘xshash o‘ziga xos patobiologik mexanizmlarga ega ekanligini taxmin qilishmoqda.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;em&gt;B. mandrillaris&lt;/em&gt; keltirib chiqaradigan Balamutiya amyobali ensefalitini (BAE) erta bosqichda tashxislash alomatlarning noaniqligi tufayli qiyin, biroq ba'zi hududlarda teri zararlanishining mavjudligi davolashni o‘z vaqtida boshlashga va yashovchanlikni oshirishga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"molekulyar-yondashuvlar-va-mavjud-usullarning-cheklovlari\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#molekulyar-yondashuvlar-va-mavjud-usullarning-cheklovlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Molekulyar yondashuvlar va mavjud usullarning cheklovlari&lt;/span&gt;&lt;/a&gt;Molekulyar yondashuvlar va mavjud usullarning cheklovlari&lt;/h4&gt;\n&lt;p&gt;Molekulyar diagnostika usullari o‘ziga xosligi bo‘yicha yuqoriroq turadi, xususan, ПKРga asoslangan ayrim tahlillar ishlab chiqilgan. Ushbu molekulyar yondashuvlar yuqori o‘ziga xoslik va sezuvchanlik bilan klinik hamda atrof-muhit namunalarida o‘z samaradorligini ko‘rsatdi. Biroq, bu testlar gipotezaga asoslangan bo‘lib, odatda klinik alomatlarga ko‘ra &lt;em&gt;B. mandrillaris&lt;/em&gt; infeksiyasi allaqachon taxmin qilingan holatlarda qo‘llaniladi. Keyingi avlod sekvenirlash (NGS) texnologiyasi noma'lum patogenlarni aniqlash uchun ajoyib usul hisoblanadi. Ushbu yuqori unumdorlikdagi, xolis diagnostika usuli minglab mikroorganizmlarni aniqlay oladi, bu esa uni &lt;em&gt;B. mandrillaris&lt;/em&gt; yoki boshqa erkin yashovchi amyobalar kabi kam uchraydigan yoxud kutilmagan patogenlarni aniqlashda ayniqsa foydali qiladi. NGS texnikasiga har doim past patogen yuki va xo‘jayinning nuklein kislotalari foni ta'sir qiladi, ayniqsa &lt;em&gt;B. mandrillaris&lt;/em&gt; holatlarida, chunki ko‘pincha orqa miya suyuqligi tekshirilsa-da, unda patogen miqdori oz yoki umuman yo‘q bo‘ladi, shuning uchun tasdiqlash uchun takroriy namunalar olish va sekvenirlash talab etiladi. Garchi NGSga asoslangan diagnostika boshlang‘ich tashxis muvaffaqiyatsiz chiqqanda qo‘llanilsa ham, dastlabki natijalarni olish uchun odatda bir necha kun ketadi; shuningdek, uning qimmatligi va asbob-uskunalarni boshqarishning texnik murakkabligi uning birinchi darajali diagnostika usuli sifatida keng qo‘llanilishini cheklaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Keyingi avlod sekvenirlash (NGS) — bu namunadagi har qanday mikroblar ketma-ketligini oldindan qaysi patogen ekanligini bilmasdan turib parallel ravishda aniqlash imkonini beruvchi yuqori unumdor genetik tahlil usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"halqasimon-izotermik-amplifikatsiya\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#halqasimon-izotermik-amplifikatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Halqasimon izotermik amplifikatsiya&lt;/span&gt;&lt;/a&gt;Halqasimon izotermik amplifikatsiya&lt;/h4&gt;\n&lt;p&gt;Halqasimon izotermik amplifikatsiya (LAMP) birinchi marta 2000 yilda tavsiflangan bo‘lib, u tezkor, sezgir va yuqori o‘ziga xoslikka ega bo‘lgan nuklein kislotalarini amplifikatsiya qilish texnikasidir. LAMP tahlili odatda oltita prayerdan iborat to‘plamni o‘z ichiga oladi, ularga ikkita tashqi, ikkita ichki va ikkita halqa prayeri kiradi. Amplifikatsiya izotermik sharoitda davom etadi, shuning uchun uni suv hammomi yoki qizdirgich blok kabi oddiy uskunalar yordamida bajarish mumkin, natijalarni esa elektroforez yoki murakkab vizualizatsiya vositalarisiz, yalang‘och ko‘z bilan rang o‘zgarishlari orqali bevosita ko‘rish mumkin. An'anaviy ПKР bilan solishtirganda, LAMP 10 dan 100 martagacha yuqori bo‘lgan analitik sezuvchanlikni namoyish etadi. Uskunalarga bo‘lgan talablarning kamligi va soddalashtirilgan ish jarayoni operatsion xarajatlarni pasaytiradi hamda LAMPni birlamchi tibbiy yordam muassasalari, olis hududlar va dala epidemiologik tadqiqotlarida qo‘llash uchun qulay qiladi. LAMP allaqachon boshqa erkin yashovchi amyobalarni aniqlash uchun qo‘llanilgan; masalan, tadqiqotchilar &lt;em&gt;N. fowleri&lt;/em&gt;ning patogenlik bilan bog‘liq geniga qaratilgan LAMP tahlilini hamda &lt;em&gt;Acanthamoeba&lt;/em&gt;ning 18S rRNA geniga qaratilgan ikkita LAMP tahlilini ishlab chiqqan. Biroq, &lt;em&gt;B. mandrillaris&lt;/em&gt; uchun maxsus ishlab chiqilgan yoki nashr etilgan biron-bir LAMP tahlili ilgari mavjud bo‘lmagan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LAMP usuli murakkab jihozlarsiz tezkor, yuqori sezgir va o‘ziga xos izotermik amplifikatsiyani ta'minlaydi, biroq hozirgi kunga qadar &lt;em&gt;B. mandrillaris&lt;/em&gt;ni aniqlashga mo‘ljallangan maxsus LAMP testlari ishlab chiqilmagan edi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"joriy-tadqiqotning-maqsadlari-va-dizayni\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#joriy-tadqiqotning-maqsadlari-va-dizayni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Joriy tadqiqotning maqsadlari va dizayni&lt;/span&gt;&lt;/a&gt;Joriy tadqiqotning maqsadlari va dizayni&lt;/h4&gt;\n&lt;p&gt;Shu munosabat bilan, &lt;em&gt;B. mandrillaris&lt;/em&gt; uchun mustahkam va ishonchli LAMP diagnostika tahlilini ishlab chiqish erta aniqlashni yaxshilashi va o‘lim darajasini potentsial ravishda kamaytirishi mumkin. Qolaversa, ushbu tahlil geografik tarqalishni tushunish, ta'sir etish xavfi yuqori bo‘lgan aholi yoki hududlarni aniqlash hamda insonlarni bemorga aylanishidan himoya qilish bo‘yicha kelajakdagi davlat siyosatini qo‘llab-quvvatlash uchun atrof-muhitni o‘rganish va monitoring qilishda ishlatilishi mumkin. Ushbu tadqiqotda biz &lt;em&gt;B. mandrillaris&lt;/em&gt; uchun 18S rRNA geniga qaratilgan tezkor, o‘ziga xos va sezgir LAMP diagnostika tahlilini ishlab chiqish hamda tasdiqlashni, shuningdek uning o‘ziga xosligi, sezuvchanligi va ham laboratoriya, ham klinik jihatdan muhim namunalardagi samaradorligini tizimli ravishda baholashni maqsad qildik.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mualliflar dala sharoitida monitoring qilish usullarini ishlab chiqish zarurligini ta'kidlashadi, biroq laboratoriya testlarini haqiqiy klinik amaliyotga joriy etish har doim bemorlarning vakillik tanlanmalari asosida keng qamrovli klinik tasdiqlashni talab etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"primerlarni-loyihalash\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#primerlarni-loyihalash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Primerlarni loyihalash&lt;/span&gt;&lt;/a&gt;Primerlarni loyihalash&lt;/h4&gt;\n&lt;p&gt;&lt;em&gt;B. mandrillaris&lt;/em&gt; ning 18S rRNA genini nishonga olish va ko'paytirish uchun (GenBank AF477019-AF477022, AF019071, JX524850) maxsus LAMP primerlari ishlab chiqildi. Dastlabki bosqichda tadqiqotchilar tanlangan ketma-ketliklardagi saqlanib qolgan hududlarni aniqlash maqsadida Multalin dasturida qiyosiy tahlil o'tkazdilar. Olingan natijalar asosida PrimerExplorer V5 dasturidan foydalangan holda ikkita ichki (FIP va BIP) hamda ikkita tashqi (F3 va B3) primerlardan iborat to'plamlar yaratildi. Dastlabki saralashdan so'ng tanlangan ichki va tashqi primerlarga tayanib, ikkita halqali primer (LF va LB) qo'shildi. Barcha nomzod primerlarning ketma-ketlik o'ziga xosligi NCBI bazasi orqali BLAST tahlili yordamida tekshirildi, ularning turg'unligi, ikkilamchi tuzilmalar hosil qilish ehtimoli va dimerizatsiyasi OligoAnalyzer vositasi yordamida baholandi. Primerlarning ketma-ketligi va joylashuvi Jadval 1 va Rasm 1 da keltirilgan.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio-f1.jpg\" alt=\"1-rasm. B. mandrillaris 18S rRNA ni nishonga olgan LAMP praymerlarining joylashuvi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. B. mandrillaris 18S rRNA ni nishonga olgan LAMP praymerlarining joylashuvi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 1.&lt;/strong&gt; LAMP diagnostika tahlili uchun праймерлар ketma-ketligi&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Nomi&lt;/th&gt;\n&lt;th&gt;Ketma-ketlik (5’ dan 3’ gacha)&lt;/th&gt;\n&lt;th&gt;Uzunligi (bp)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;F3&lt;/td&gt;\n&lt;td&gt;TGGTGGAGTGATTTGTCTGG&lt;/td&gt;\n&lt;td&gt;20&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;B3&lt;/td&gt;\n&lt;td&gt;TCGGCTAATCACCGATTGTC&lt;/td&gt;\n&lt;td&gt;20&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;FIP&lt;/td&gt;\n&lt;td&gt;CGCTCACCCCCTGGTTTTGAATCGAACGAGACCTTAACCTGC&lt;/td&gt;\n&lt;td&gt;42&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;BIP&lt;/td&gt;\n&lt;td&gt;CGGTCGGCTCCAATCTTCGGACTTCTACCAATCCAACCGC&lt;/td&gt;\n&lt;td&gt;40&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;LF&lt;/td&gt;\n&lt;td&gt;AGCAGGATTGGCATGACT&lt;/td&gt;\n&lt;td&gt;18&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;LB&lt;/td&gt;\n&lt;td&gt;GTGCCCCTTGCCTTCTG&lt;/td&gt;\n&lt;td&gt;17&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LAMP (halqali izotermik amplifikatsiya) usuli murakkab termotsikler qurilmalarisiz, o'zgarmas haroratda DNKni tez va yuqori aniqlikda ko'paytirish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"lamp-tahlilini-optimallashtirish\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#lamp-tahlilini-optimallashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LAMP tahlilini optimallashtirish&lt;/span&gt;&lt;/a&gt;LAMP tahlilini optimallashtirish&lt;/h4&gt;\n&lt;p&gt;Amplifikatsiya sharoitlarini maqbullashtirish uchun primerlarning konsentratsiyasi 0.75× dan 1.75× gacha bo'lgan diapazonda va harorat градиенти 57–67 °C oralig'ida sinovdan o'tkazildi. Reaksiya samaradorligi rang o'zgarishi hamda agaroza geli elektroforezi yordamida baholandi (Rasm 2). Umuman olganda, reaksiya samaradorligi harorat ko'tarilishi bilan oshdi. 57 °C da gel yordamida mahsulotlarni ko'rish mumkin bo'lsa-da, musbat namunalar aniq sariq rang o'rniga apelsin rangida qoldi va salbiy nazoratdan farqlash qiyinlashdi. Primer konsentratsiyasi ham natijaga sezilarli ta'sir ko'rsatdi: yuqori haroratlarda yuqori konsentratsiyali (1.5× va 1.75×) namunalarda soxta musbat natijalar kuzatildi, 0.75× konsentratsiya esa noaniq rang o'zgarishi bilan zaif amplifikatsiyani ko'rsatdi. Ushbu kuzatuvlarga asoslanib, 1.28 µM FIP va BIP, 0.16 µM F3 va B3, hamda 0.32 µM LF va LB dan iborat 1× konsentratsiya optimal deb topildi. Ushbu sharoitda 59–67 °C oralig'ida musbat namunalar aniq sariq rangga kirdi, salbiy namunalar esa pushti rangligicha qoldi va soxta musbat tarmoqlanish kuzatilmadi. 65 °C harorat optimal reaksiya harorati sifatida tanlandi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio-f2.jpg\" alt=\"2-rasm. Muayyan haroratlarda (57-67 °C) praymer konsentratsiyalarini optimallashtirish.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm. Muayyan haroratlarda (57-67 °C) praymer konsentratsiyalarini optimallashtirish.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Optimal harorat va primer konsentratsiyasi aniqlangandan so'ng, amplifikatsiya vaqti o'rganildi. Reaksiyalar turli vaqt oralig'ida to'xtatib borildi. Rasm 3 da ko'rsatilganidek, amplifikatsiya ilk bor 20-daqiqada zaif apelsin rangi va gel elektroforezidagi chiziqlar orqali qayd etildi. 30-daqiqada esa kuchli amplifikatsiya kuzatildi. Aksincha, vaqt 40 va 50 daqiqagacha uzaytirilganda nospetsifik ko'payish sodir bo'ldi: 40-daqiqada rang biroz o'zgarib, salbiy nazoratda chiziq paydo bo'ldi, 50-daqiqada esa rang apelsin tusiga kirib, salbiy nazoratlarda soxta musbat tarmoqlar aniqlandi. Shunga ko'ra, 30 daqiqalik qat'iy vaqt optimal davomiylik sifatida belgilandi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio-f3.jpg\" alt=\"3-rasm. Amplifikatsiya vaqtini 10 dan 50 daqiqagacha optimallashtirish.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm. Amplifikatsiya vaqtini 10 dan 50 daqiqagacha optimallashtirish.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;18S rRNA geni uchun LAMP tahlilining optimal sharoitlari sifatida 65 °C harorat, 1× primer konsentratsiyasi va 30 daqiqalik vaqt aniqlanib, ular yuqori aniqlikdagi natijani ta'minladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"lamp-tahlilining-oziga-xosligi\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#lamp-tahlilining-oziga-xosligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LAMP tahlilining o'ziga xosligi&lt;/span&gt;&lt;/a&gt;LAMP tahlilining o'ziga xosligi&lt;/h4&gt;\n&lt;p&gt;Amplifikatsiya jarayoni faqatgina &lt;em&gt;B. mandrillaris&lt;/em&gt; izolyatlarida (1-10 reaksiyalar) aniq rang o'zgarishi va gel elektroforezidagi zinapoyasimon chiziqlar bilan kechdi. Aksincha, &lt;em&gt;B. mandrillaris&lt;/em&gt; ga kirmaydigan organizmlarda yoki molekulyar darajadagi dH2O suv namunalarida rang o'zgarishi ham, chiziqlar ham kuzatilmadi (Rasm 4). Ushbu natijalar yangi ishlab chiqilgan 18S rRNA LAMP tahlili boshqa erkin yashovchi amöbalar, protozoylar, zamburug'lar va bakteriyalarga nisbatan kesishgan reaksiyaga kirishmasligini va yuqori o'ziga xoslikka ega ekanligini ko'rsatadi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio-f4.jpg\" alt=\"4-rasm. 18S rRNA LAMP tahlilining o'ziga xosligi. Tahlilning o'ziga xosligini baholash uchun kolorimetrik LAMP amplifika\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm. 18S rRNA LAMP tahlilining o'ziga xosligi. Tahlilning o'ziga xosligini baholash uchun kolorimetrik LAMP amplifikatsiyasi va agaroza gel elektroforezi bajarildi. 1-10-yo'lakchalar B. mandrillaris ning turli izolyatlarini ifodalaydi: V039, SAM, RP5, OK1, ITSON, V433, V188, V194, V426 va V619; 11-yo'lakcha: Acanthamoeba castellanii; 12-yo'lakcha: Naegleria fowleri; 13-yo'lakcha: Sarcocystis neurona; 14-yo'lakcha: Toxoplasma gondii; 15-yo'lakcha: Escherichia coli; 16-yo'lakcha: Serratia marcescens; 17-yo'lakcha: Pseudomonas aeruginosa; 18: Candida auris; 19-yo'lakcha: Candida albicans; 20-yo'lakcha: musbat nazorat (B. mandrillaris V039, 1 ng); 21-yo'lakcha: manfiy nazorat – molekulyar darajadagi dH2O suvi.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"lamp-tahlilining-sezgirligi\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#lamp-tahlilining-sezgirligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LAMP tahlilining sezgirligi&lt;/span&gt;&lt;/a&gt;LAMP tahlilining sezgirligi&lt;/h4&gt;\n&lt;p&gt;Optimizatsiya qilingan LAMP tahlilining sezgirligi baholanib, turli xil &lt;em&gt;B. mandrillaris&lt;/em&gt; gDNK matrizalari yordamida an'anaviy ПЦР bilan to'g'ridan-to'g'ri taqqoslandi (Rasm 5). DNKga asoslangan tahlilda LAMP usuli &lt;em&gt;B. mandrillaris&lt;/em&gt; DNKsini 100 pg/μL dan 10 fg/μL gacha bo'lgan diapazonda muvaffaqiyatli aniqladi. An'anaviy ПЦР esa torroq diapazonda — 100 pg/μL dan 100 fg/μL gacha bo'lgan qiymatlarni qayd etdi. Butun hujayrali andozalar yordamida olib borilgan sinovlarda LAMP kamida 0.1 trofozoit/μL konsentratsiyani aniqlagan bo'lsa, an'anaviy ПЦР kamida 1 trofozoit/μL ni talab qildi. Termik ishlov berilgan hujayralardan foydalanilganda, LAMP sezgirligi 10 barobarga oshib, 0.01 trofozoit/μL chegarasiga yetdi, an'anaviy ПЦР esa 1 trofozoit/μL konsentratsiyani ko'rsatdi (100 barobar farq). Umuman olganda, barcha matritsa turlari bo'yicha LAMP usuli an'anaviy ПЦРga nisbatan 10 dan 100 barobargacha yuqori sezgirlik ko'rsatdi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio-f5.jpg\" alt=\"5-rasm. LAMP va an'anaviy ПЦР sezgirligini taqqoslash. (A) Tozalangan B. mandrillaris DNKsi. (B) Asl, ishlov berilmagan \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm. LAMP va an'anaviy ПЦР sezgirligini taqqoslash. (A) Tozalangan B. mandrillaris DNKsi. (B) Asl, ishlov berilmagan B. mandrillaris hujayralari. (C) Issiqlik bilan ishlov berilgan B. mandrillaris hujayralari. Barcha shartlar bajarildi va keyin sinovdan o'tgan har bir shartdan gDNK ajratib olindi hamda ushbu tajribalar uchun matritsa sifatida ishlatildi.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sezgirlik laboratoriya sharoitida sun'iy namunalar yordamida baholangan bo'lib, usulni real klinik materiallarda qo'llash uchun qo'shimcha tekshiruvlar talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"lamp-diagnostika-usulining-nusxalar-sonini-aniqlash-boyicha-validatsiyasi\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#lamp-diagnostika-usulining-nusxalar-sonini-aniqlash-boyicha-validatsiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LAMP diagnostika usulining nusxalar sonini aniqlash bo'yicha validatsiyasi&lt;/span&gt;&lt;/a&gt;LAMP diagnostika usulining nusxalar sonini aniqlash bo'yicha validatsiyasi&lt;/h4&gt;\n&lt;p&gt;LAMP tushunchasining ishonchliligini tekshirish va aniqlashning aniq chegaralarini belgilash uchun tadqiqotchilar raqamli ПЦР (dPCR) va miqdoriy ПЦР (qPCR) usullaridan foyolandilar. dPCR natijalari 10 martali ketma-ket suyultirish seriyasida konsentratsiyaga bog'liq holda nusxalar sonining aniq kamayishini ko'rsatdi (Rasm 6). Har bir namunada musbat va manfiy qismlar aniq ajratildi, salbiy nazoratda esa kutilganidek amplifikatsiya kuzatilmadi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio-f6.jpg\" alt=\"6-rasm. Rekombinant 18S rRNA plazmid standartlari va dH2O nazoratini raqamli ПЦР (dPCR) yordamida miqdoriy aniqlash.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm. Rekombinant 18S rRNA plazmid standartlari va dH2O nazoratini raqamli ПЦР (dPCR) yordamida miqdoriy aniqlash.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;dPCR yoki raqamli ПЦР — bu namuna tomchilarga bo'linib, standart egri chiziqlarsiz DNK molekulalarini o'ta aniqlikda sanaydigan usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kalibrlash uchun ma'lum nusxalar soniga ega bo'lgan 18S rRNA rekombinant plazmid standartlari ishlatildi. Ma'lumotlar Ct qiymatlari va plazmid nusxalari sonining logarifmi o'rtasida kuchli chiziqli bog'liqlik borligini ko'rsatdi (Rasm 7). Standart egri chiziq tenglamasi Y = -3.233x + 33.91 va R2 = 0.9532 ni tashkil etdi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio-f7.jpg\" alt=\"7-rasm. qPCR uchun standart egri chiziq. A: B. mandrillaris plazmid standartlarining turli konsentratsiyalari va dH2O uc\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-rasm. qPCR uchun standart egri chiziq. A: B. mandrillaris plazmid standartlarining turli konsentratsiyalari va dH2O uchun qPCR amplifikatsiya egri chizig'i; B: qPCR natijalarining standart egri chizig'i.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LAMP tahlilining aniqlash chegarasi (LOD) taxminan 1 nusxa/mkl ni tashkil etdi, qPCR (1.07 × 10^5 nusxa/mkl) va dPCR (1.13 × 10^5 nusxa/mkl) natijalari esa o'ta yuqori aniqlikni tasdiqladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bundan tashqari, qPCR va dPCR o'rtasidagi muvofiqlikni baholash uchun gDNA ishlatildi. B. mandrillaris gDNA namunalari 1 ng/mkl konsentratsiyada ikkala tahlilda ham tekshirilib, qPCR da 1.07 × 10^5 nusxa/mkl va dPCR da 1.13 × 10^5 nusxa/mkl ni tashkil etdi. LAMP aniqlay oladigan eng past DNK konsentratsiyasidan foydalanib, metodning analitik LOD qiymati 1 nusxa/mkl ga teng deb belgilandi.&lt;/p&gt;\n&lt;h4 id=\"insonning-suniy-yuqtirilgan-biologik-suyuqlik-namunalarida-diagnostik-salohiyatni-validatsiya-qilish\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#insonning-suniy-yuqtirilgan-biologik-suyuqlik-namunalarida-diagnostik-salohiyatni-validatsiya-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Insonning sun'iy yuqtirilgan biologik suyuqlik namunalarida diagnostik salohiyatni validatsiya qilish&lt;/span&gt;&lt;/a&gt;Insonning sun'iy yuqtirilgan biologik suyuqlik namunalarida diagnostik salohiyatni validatsiya qilish&lt;/h4&gt;\n&lt;p&gt;Biologik suyuqliklar diagnostikaga xalaqit berishi mumkinligi sababli, mualliflar yangi usulni sinab ko'rishdi. Indiana universiteti tibbiyot maktabidan olingan inson liquor, siydik va qonining klinik namunalari ishlatildi. Har bir reaksiya uchun 1 dan 10^6 gacha B. mandrillaris trofozoitlari qo'shilib, standart ketma-ket suyultirish bajarildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tajribalar sun'iy ravishda patogen qo'shilgan klinik namunalar asosida o'tkazildi, shuning uchun real bemorlar bilan keng ko'lamli sinovlar zarur.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;LAMP diagnostika vositasi barcha sinovdan o'tgan biologik suyuqlik namunalarida atigi 1 ta trofozoitni muvaffaqiyatli aniqladi (manfiy nazoratdan tashqari barcha sharoitlarda sariq rang berdi). Shu bilan birga, oddiy ПЦР siydik namunalarida aniqlash uchun uch soat vaqt talab qilgan bo'lsa, bizning LAMP vositasi atigi 30 daqiqada natija berdi (Rasm 8).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio-f8.jpg\" alt=\"8-rasm. B. mandrillaris hujayralarining ketma-ket suyultirilgan namunalari qo'shilgan inson qoni, CSF va siydik namunala\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-rasm. B. mandrillaris hujayralarining ketma-ket suyultirilgan namunalari qo'shilgan inson qoni, CSF va siydik namunalari yordamida LAMP diagnostika vositasini validatsiya qilish va an'anaviy ПЦР usuli bilan taqqoslash. Matritsa sifatida 10^6 dan 1 tagacha trofozoitni o'z ichiga olgan o'n karrali ketma-ket suyultirishlar, salbiy nazorat sifatida esa dH2O suvi ishlatildi.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LAMP usuli liquor, siydik va qon muhitida faoliyat ko'rsatib, an'anaviy ПЦР dan tezlik (30 daqiqa va 3 soat) va vizual qulaylik bo'yicha ustun keldi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Olingan natijalar insonning asosiy biologik muhitlari LAMP amplifikatsiyasiga to'sqinlik qilmasligini ko'rsatadi. Test an'anaviy ПЦР ga nisbatan mustahkam va ustun samaradorlikni namoyon etdi.&lt;/p&gt;\n&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;h4 id=\"b-mandrillaris-diagnostikasi-uchun-lamp-usulini-ishlab-chiqish-va-optimallashtirish\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#b-mandrillaris-diagnostikasi-uchun-lamp-usulini-ishlab-chiqish-va-optimallashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;B. mandrillaris diagnostikasi uchun LAMP usulini ishlab chiqish va optimallashtirish&lt;/span&gt;&lt;/a&gt;B. mandrillaris diagnostikasi uchun LAMP usulini ishlab chiqish va optimallashtirish&lt;/h4&gt;\n&lt;p&gt;B. mandrillaris infeksiyasi markaziy asab tizimiga o‘tganda juda tez rivojlanadi va simptomlar boshlanganidan o‘limga qadar bo‘lgan vaqt bir necha haftadan oygacha davom etishi mumkin. Kasallikning kamyobligi va simptomlarning noaniqligi tashxisni kechiktiradi. An’anaviy PZR usullari (16S rRNA, 18S rRNA yoki RNase P genlariga mo‘ljallangan) turlicha aniqlikka ega, NGS esa qimmat va maxsus tayyorgarlikni talab qiladi. Biz ishlab chiqqan halqali izotermik amplifikatsiya (LAMP) usuli arzon, tez va yuqori sezgir diagnostika vositasidir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LAMP usuli 65 °C haroratda 30 daqiqa ichida tez amplifikatsiyani ta’minlaydi va boshqa amebalar, zamburug‘lar yoki bakteriyalar bilan kesishgan reaksiyaga kirishmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Primerlarni loyihalashda 18S rRNA geni tanlab olindi, chunki 16S rRNA ni nishonga olish noto‘g‘ri musbat natijalarni berdi. Optimallashtirish jarayonida harorat, reaksiya vaqti va primerlar konsentratsiyasi (FIP/BIP uchun 1,28 mkm, F3/B3 uchun 0,16 mkm, LF/LB uchun 0,32 mkm) aniqlandi. Nazorat namunalari yordamida noaniq signallar minimallashtirildi.&lt;/p&gt;\n&lt;h4 id=\"namunalarni-tayyorlash-va-tahliliy-samaradorlik\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#namunalarni-tayyorlash-va-tahliliy-samaradorlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Namunalarni tayyorlash va tahliliy samaradorlik&lt;/span&gt;&lt;/a&gt;Namunalarni tayyorlash va tahliliy samaradorlik&lt;/h4&gt;\n&lt;p&gt;LAMP ning asosiy afzalligi — uning xom namunalarga chidamliligidir. Biz tijorat to‘plamlari, qizdirish va to‘g‘ridan-to‘g‘ri namunalarni solishtirdik. Natijalar shuni ko‘rsatdiki, LAMP hatto ishlov berilmagan namunalarda ham patogenni aniqlay oladi. An’anaviy PZR bilan solishtirganda, bizning LAMP usulimiz 10–100 barobar yuqori samaradorlikka ega.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LAMP — bu doimiy haroratda DNKni ko‘paytirish usuli bo‘lib, u oddiy PZRga qaraganda tezroq va soddaroqdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz birinchi marta dPCR (raqamli PZR) yordamida 18S rRNA nusxalar sonini va aniqlash chegarasini (LOD) belgilab oldik.&lt;/p&gt;\n&lt;h4 id=\"cheklovlar-va-natijalarni-talqin-qilish\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#cheklovlar-va-natijalarni-talqin-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va natijalarni talqin qilish&lt;/span&gt;&lt;/a&gt;Cheklovlar va natijalarni talqin qilish&lt;/h4&gt;\n&lt;p&gt;LAMP usulida mahsulotning ko‘pligi sababli kontaminatsiya xavfi mavjud. Fenol qizili yordamida natijani ko‘z bilan ko‘rish mumkin, bu esa probirkalarni ochmaslikka imkon beradi. Biroq, noaniq rang o‘zgarishlarida (apelsin rang) elektroforez talab qilinishi mumkin. Shu sababli, LAMP dastlabki tezkor diagnostika vositasi hisoblanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Vizual talqin yorug‘lik sharoitiga bog‘liq bo‘lishi mumkin, shuning uchun shubhali natijalarni boshqa usullar bilan tasdiqlash zarur.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"xulosa1\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#xulosa1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;h4 id=\"diagnostika-usullarini-ishlab-chiqish-va-validatsiyadan-otkazish-yakunlari\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#diagnostika-usullarini-ishlab-chiqish-va-validatsiyadan-otkazish-yakunlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Diagnostika usullarini ishlab chiqish va validatsiyadan o‘tkazish yakunlari&lt;/span&gt;&lt;/a&gt;Diagnostika usullarini ishlab chiqish va validatsiyadan o‘tkazish yakunlari&lt;/h4&gt;\n&lt;p&gt;Ushbu tadqiqot doirasida B. mandrillarisni aniqlash uchun uchta yangi diagnostika usuli: LAMP (halqali izotermik amplifikatsiya), qPCR va dPCR ishlab chiqildi va validatsiya qilindi. Ish jarayonida praymerlar, ularning konsentratsiyasi va reaksiya sharoitlari optimallashtirildi. Mualliflar usullarning o‘ziga xosligi (spesifikligi) va sezgirligini aniqlash, shuningdek, DNK nusxalari sonini miqdoriy baholash bo‘yicha keng ko‘lamli ish olib bordilar. Metodlar insonning biologik suyuqliklari namunalarida (spiked samples) sinovdan o‘tkazildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LAMP usuli yuqori sezgirlik, spesifiklik va mustahkamlik ko‘rsatdi, bu uni klinik amaliyotda Balamuthia mandrillarisni erta tashxislash uchun istiqbolli vositaga aylantiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Olingan natijalar LAMP usulini birlamchi tibbiy yordam muassasalarida yoki resurslar cheklangan hududlarda qo‘llash uchun eng maqbul variant ekanligini ko‘rsatadi. Patogenni erta aniqlash davolashni o‘z vaqtida boshlashga imkon beradi, bu esa bemorlarning ahvolini yaxshilashga va Balamuthia keltirib chiqaradigan kasalliklar, xususan, BAE bilan bog‘liq o‘ta yuqori o‘lim ko‘rsatkichlarini kamaytirishga xizmat qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LAMP — bu DNKni doimiy haroratda tez ko‘paytirishga imkon beruvchi molekulyar diagnostika usuli bo‘lib, u murakkab laboratoriya jihozlarini talab qilmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"amobalarni-ostirish\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#amobalarni-ostirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Amöbalarni o‘stirish&lt;/span&gt;&lt;/a&gt;Amöbalarni o‘stirish&lt;/h4&gt;\n&lt;p&gt;Tadqiqotda B. mandrillaris izolyatlari qo‘shildi: V039, ITSON (Meksikaning ITSON universiteti doktori Luis Fernando Lares-Ximenes tomonidan taqdim etilgan), SAM, RP5, OK1 (AQSh Aholisi salomatligi departamenti doktori Telma X. Dannebake tomonidan taqdim etilgan), V433, V188, V194, V426 va V619 (AQSh NIH dasturi tomonidan qo‘llab-quvvatlanadigan BEI resources omboridan buyurtma qilingan). Shuningdek, Amerikaning standart madaniyatlar kolleksiyasidan (ATCC) boshqa erkin yashovchi amöbalar ishlatildi: Naegleria fowleri shtammi Nf69 (ATCC 30215) va Acanthamoeba castellanii T4 genotipi (ATCC 50370). B. mandrillaris madaniyatlari 37℃ haroratda va 5% CO₂ muhitida, 10% homila porsoni zardobi (FBS) hamda 125 mkg penitsillin-streptomitsin (125 mkg / 5000 Birlik/ml penitsillin va 5 mg/ml streptomitsin) qo‘shilgan Balamuthia mandrillaris ITSON muhitida (BMI) saqlandi. Ishlar havo almashinadigan 75 cm² lik to‘qima kulturalari uchun idishlarda olib borildi. N. fowleri shtammi havo kirmaydigan 75 cm² lik idishlarda, 34℃ haroratda, 10% FBS va pen-strep qo‘shilgan to‘liq Nelson muhitida (NCM) o‘stirildi; A. castellanii esa 27℃ haroratda, proteaza pepton-glyukoza muhitida (PG) pen-strep bilan birga shunga o‘xshash ventilyatsiyasiz 75 cm² lik idishlarda yetishtirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Hujayralarni passaj qilish — hujayralar haddan tashqari ko‘payib ketib o‘lib qolmasligi uchun ularni yangi ozuqa muhitiga ko‘chirib o‘tkazish jarayonidir.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Muntazam ravishda subkultura qilish har 3–4 kunda, hujayralar 80-90% qoplamaga yetganda amalga oshirildi. Hujayralarni ko‘chirish uchun B. mandrillaris solingan idishlarga 5 ml 0.25% li Tripsin-EDTA (1X) qo‘shilib, 37℃ da 5 minut davomida inkubatsiya qilindi. N. fowleri idishlari 15 minut davomida muz ustiga qo‘yildi, A. castellanii hujayralari esa mexanik ravishda yuzadan ko‘chirib olindi. Hujayralar 50 ml lik santrifuga naychalariga yig‘ilib, 4℃ haroratda 3,214 × g (3,900 aylanish/min) tezlikda santrifuga qilindi. Keyin hujayralar sanab chiqildi, kerakli konsentratsiyagacha suyultirildi va o‘sishni davom ettirish uchun qayta ekildi.&lt;/p&gt;\n&lt;h4 id=\"namunalar-tayyorlash\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#namunalar-tayyorlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Namunalar tayyorlash&lt;/span&gt;&lt;/a&gt;Namunalar tayyorlash&lt;/h4&gt;\n&lt;p&gt;Sarcocystis neurona – Purdue universitetidan doktor Sriveni Dangoudubiyam tomonidan; Toxoplasma gondii – Purdue universitetidan doktor Kristof Konradt tomonidan; Candida auris va C. albicans – Purdue universitetidan doktor Shankar Tangamani tomonidan taqdim etildi. Escherichia coli (ATCC 8739), Serratia marcescens (ATCC 13048) va Pseudomonas aeruginosa (ATCC 9027) bakteriyalari ATCC dan sotib olindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;gDNK (genom DNK) — organizmning barcha irsiy ma'lumotlarini o‘z ichiga olgan molekula bo‘lib, u genetik tadqiqotlar va tahlillar uchun hujayralardan ajratib olinadi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Barcha organizmlardan genom DNK ishlab chiqaruvchining ko‘rsatmalariga muvofiq tijorat maqsadidagi DNK ajratib olish to‘plami yordamida olindi. Har bir DNK namunasi 2× 10⁶ ta hujayradan ajratib olindi. V039 B. mandrillaris izolyati uchun tozalangan genom DNK molekulyar darajadagi nukleazasiz suvda (dH₂O) 0.1 fg/mkl dan 100 pg/mkl gacha bo‘lgan diapazonda ketma-ket suyultirildi. Shuningdek, keyingi tahlillar uchun termik ishlov berilgan va asl (ishlov berilmagan) B. mandrillaris trofozoitlari tayyorlandi. Hujayra cho‘kmasi sanab chiqilib, nukleazasiz suvda yakuniy miqdori 10 000 trofozoit/ml bo‘lguncha suyultirildi va 6 marta 10 martalik ketma-ket suyultirish bajarildi. B. mandrillaris 95℃ haroratda 1 soat davomida qizdirildi, asl hujayralar esa qo‘shimcha ishlov berishsiz to‘g‘ridan-to‘g‘ri gDNK ajratish uchun ishlatildi.&lt;/p&gt;\n&lt;h4 id=\"tahlilni-optimallashtirish\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#tahlilni-optimallashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tahlilni optimallashtirish&lt;/span&gt;&lt;/a&gt;Tahlilni optimallashtirish&lt;/h4&gt;\n&lt;p&gt;LAMP sharoitlarini optimallashtirish WarmStart® Colorimetric LAMP 2X Master Mix protokoliga muvofiq bajarildi. Barcha praymerlar Integrated DNA Technologies tomonidan sintez qilindi. Asosiy reaksiya tizimi 2X WarmStart Colorimetric LAMP Master Mix, praymerlar to‘plami (tashqi, ichki va halqali praymerlar nisbati 1:4:2 edi), gDNK yoki dH₂O matritsasi va dH₂O dan iborat bo‘ldi. Asosiy inkubatsiya vaqti 65℃ da 30 minut qilib belgilandi. Optimallashtirish jarayonida tanlangan praymerlar to‘plami ijobiy namunalar (B. mandrillaris gDNK) va salbiy nazorat (dH₂O) bilan turli sharoitlarda sinovdan o‘tkazildi: (i) 0.75X, 1X, 1.25X, 1.5X va 1.75X bo‘lgan turli xil praymer konsentratsiyalarida; (ii) 57℃, 59℃, 61℃, 63℃, 65℃ va 67℃ bo‘lgan har xil haroratlarda.&lt;/p&gt;\n&lt;p&gt;Amplifikatsiya natijalari rang o‘zgarishini vizual kuzatish hamda 1.5% li agaroza gel elektroforezi yordamida baholandi. Optimal sharoitlar deb ijobiy namunalarda aniq pushti-sariq (salbiy-ijobiy) rang o‘zgarishini va xarakterli zinapoya shaklidagi LAMP amplifikatsiya naqshlarini beradigan, salbiy nazoratda esa hech qanday amplifikatsiya kuzatilmagan sharoitlar e'tirof etildi. Praymer konsentratsiyasi va haroratni tanlab olgandan so‘ng, minimal va optimal reaksiya vaqtlarini aniqlash maqsadida turli vaqtlardagi (10, 20, 30, 40 va 50 minut) amplifikatsiya samaradorligi o‘zaro taqqoslandi.&lt;/p&gt;\n&lt;h4 id=\"lamp-oziga-xosligi-va-sezgirligini-aniqlash\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#lamp-oziga-xosligi-va-sezgirligini-aniqlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LAMP o‘ziga xosligi va sezgirligini aniqlash&lt;/span&gt;&lt;/a&gt;LAMP o‘ziga xosligi va sezgirligini aniqlash&lt;/h4&gt;\n&lt;p&gt;LAMP usulining o‘ziga xosligi B. mandrillaris’ning o‘nta turli izolyati (V039, SAM, RP5, OK1, ITSON, V433, V188, V194, V426 va V619) gDNK’sini sinash orqali baholandi. Shuningdek, boshqa erkin yashovchi amebalar (A. castellanii, N. fowleri), sodda hayvonlar (S. neurona, T. gondii), zamburug‘lar (C. auris, C. albicans) va bakteriyalar (E. coli, S. marcescens, P. aeruginosa) gDNK’si ham tekshirildi. Amplifikatsiya mahsulotlari rang o‘zgarishi va 1,5% agaroza gel elektroforezi orqali tahlil qilindi.&lt;/p&gt;\n&lt;p&gt;LAMP sezgirligini baholash uchun aniqlash chegarasi (LOD) an’anaviy PZR usuli bilan solishtirildi. B. mandrillaris gDNK’sining 10 karrali ketma-ket suyultirilgan namunalari (0,1 fg/mkl dan 100 pg/mkl gacha) va standart hujayralar (1000 dan 0,001 trofozoitgacha) tayyorlandi. Har bir namuna uchun (n=3) LAMP va PZR parallel ravishda o‘tkazildi. LOD sifatida ijobiy natija beruvchi eng past konsentratsiya belgilandi. An’anaviy PZR uchun Bal18SF3-Fwd va Bal18SB3-Rev praymerlari ishlatildi: 94°C da 5 daqiqa boshlang‘ich denaturatsiya, so‘ngra 40 sikl (94°C — 1 daqiqa, 54°C — 2 daqiqa, 72°C — 3 daqiqa) va 72°C da 10 daqiqalik yakuniy uzaytirish.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LAMP (Loop-mediated isothermal amplification) — bu DNKni doimiy haroratda tez ko‘paytirish usuli bo‘lib, LOD esa usul aniqlay oladigan eng kichik miqdordagi DNKni bildiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"maqsadli-genni-klonlash-va-transformatsiya\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#maqsadli-genni-klonlash-va-transformatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Maqsadli genni klonlash va transformatsiya&lt;/span&gt;&lt;/a&gt;Maqsadli genni klonlash va transformatsiya&lt;/h4&gt;\n&lt;p&gt;Maqsadli gen LAMP praymerlari yordamida B. mandrillaris gDNK’sidan amplifikatsiya qilindi. PZR mahsulotlari 1% agaroza gelidan tozalanib, pGEM®-T Easy vektoriga T4 ligaza yordamida ulandi. Konstruksiya J109 E. coli hujayralariga kiritildi. Transformantlar ampitsillin, IPTG va X-Gal qo‘shilgan LB agarda o‘stirildi va ko‘k-oq skrining orqali tanlab olindi. Ijobiy koloniyalar SOC muhitida ko‘paytirilib, plazmid DNK ajratib olindi. Insertning to‘g‘riligi sekvenirlash orqali tasdiqlandi, konsentratsiya NanoDrop spektrofotometri bilan o‘lchandi.&lt;/p&gt;\n&lt;h4 id=\"qpcr-va-dpcr-validatsiya-tahlilini-ishlab-chiqish\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#qpcr-va-dpcr-validatsiya-tahlilini-ishlab-chiqish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;qPCR va dPCR validatsiya tahlilini ishlab chiqish&lt;/span&gt;&lt;/a&gt;qPCR va dPCR validatsiya tahlilini ishlab chiqish&lt;/h4&gt;\n&lt;p&gt;qPCR uchun LAMP praymerlari va standart sifatida rekombinant plazmidalar ishlatildi. Reaksiya aralashmasi SYBR Green Master Mix, F3/B3 praymerlari (500 nM) va shablondan iborat bo‘ldi. Protokol: 95°C da 5 daqiqa denaturatsiya va 35 sikl (95°C — 15 s, 61°C — 1 daqiqa). Eritish egri chiziqlari tahlili o‘ziga xoslikni tasdiqladi. Standart egri chiziq Ct qiymatlari va plazmid nusxalari logarifmi asosida GraphPad Prism 10 dasturida qurildi.&lt;/p&gt;\n&lt;p&gt;Raqamli PZR (dPCR) uchun 6 ta konsentratsiya uchta takroriy sinovdan o‘tkazildi. 40 mkl hajmdagi reaksiya QIAcuity nanoplitalarida 3× EvaGreen Master Mix yordamida bajarildi. Amplifikatsiya 35 sikl (95°C — 15 s, 61°C — 1 daqiqa) davom etdi. Natijalar QIAcuity One tizimida (495 nm qo‘zg‘alish, 530 nm emissiya) o‘qildi. Standart egri chiziqlar chiziqli regressiya tahlili orqali Prism 10 dasturida hisoblandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;qPCR DNK miqdorini real vaqtda o‘lchasa, dPCR namunani minglab mikro-tomchilarga bo‘lib, DNK nusxalarini mutlaq aniqlik bilan sanash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio-fS1.jpg\" alt=\"S1-rasm. 16S rRNA ga yo'naltirilgan LAMP o'ziga xosligi. 1-yo'lak: B. mandrillaris (V039); 2-yo'lak: B. mandrillaris (IT\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S1-rasm. 16S rRNA ga yo'naltirilgan LAMP o'ziga xosligi. 1-yo'lak: B. mandrillaris (V039); 2-yo'lak: B. mandrillaris (ITSON); 3-yo'lak: N. fowleri; 4-yo'lak: A. castellanii; 5-yo'lak: S. neurona; 6-yo'lak: E. coli; 7-yo'lak: S. marcescens; 8-yo'lak: P. aeruginosa; 9-yo'lak: salbiy nazorat – molekulyar darajadagi dH2O suvi.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"jadvallar\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#jadvallar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Jadvallar&lt;/span&gt;&lt;/a&gt;Jadvallar&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Jadval S1.&lt;/strong&gt; Prayserlar ketma-ketligi&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Nomi&lt;/th&gt;\n&lt;th&gt;Ketma-ketlik (5’ dan 3’ gacha)&lt;/th&gt;\n&lt;th&gt;Uzunligi (bp)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;F3&lt;/td&gt;\n&lt;td&gt;CTCGTGTCTTAGGATGTGT&lt;/td&gt;\n&lt;td&gt;19&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;B3&lt;/td&gt;\n&lt;td&gt;TTAGAGATTTACTCCGCCT&lt;/td&gt;\n&lt;td&gt;19&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;FIP&lt;/td&gt;\n&lt;td&gt;CTCATCCTCAAAAGCAGTTTTCACGGTTAACTCCATGAACGG&lt;/td&gt;\n&lt;td&gt;42&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;BIP&lt;/td&gt;\n&lt;td&gt;ATGACCTTTATAGATTGGGCTACACCACGGCATTGTTTCTCAT&lt;/td&gt;\n&lt;td&gt;43&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Ameb&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ensefalitini&lt;/text&gt;&lt;text
