            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"98\" cy=\"79\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"682\" cy=\"254\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · PSYCHIATRY AND CLINICAL PSYCHOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Autizm xavfi bor go'daklar&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;nutqni qanday idrok etadi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Autizm spektridagi buzilishlar xavfi bor bolalarda nutq ko'pincha kechikib rivojlanadi. Yangi natijalar shuni ko'rsatadiki, bunday go'daklarning miyasi bo'g'inlar ritmiga o'zgacha moslashadi. Olimlar bu farqlarning sabablarini tushunish uchun bolalarning ikki yoshgacha bo'lgan miya faoliyatini kuzatishdi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-09-25/infants-at-high-and-low-likelihood-for-autism-show-different.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Autizm xavfi bor go'daklar miyasi bo'g'in ritmiga yomonroq moslashadi.&lt;/li&gt;\n&lt;li&gt;Tovushlar chastotasini statistik tahlil qilish qobiliyati ularda saqlanib qoladi.&lt;/li&gt;\n&lt;li&gt;Hayotning ilk oylaridagi nutq xususiyatlari keyingi rivojlanish bilan bog'liq.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-09-25/infants-at-high-and-low-likelihood-for-autism-show-different.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Mualliflar nutq rivojlanishini baholash uchun yuqori zichlikdagi elektroensefalografiya (EEG — bosh terisidagi elektroplar yordamida miya elektr faolligini qayd etish usuli) usulidan foydalandilar. Tadqiqotda 2,5 oylikdan 22,6 oylikkacha bo'lgan 44 nafar chaqaloq qatnashdi: ularning bir qismida irsiy omillar tufayli autizm xavfi yuqori (HL) edi, nazorat guruhi esa past xavfli (LL) bolalardan iborat bo'ldi. Chaqaloqlar uch bo'g'inli so'zlardan iborat sun'iy nutqni tinglayotganda jami 83 ta EEG sessiyasi yozib olindi.&lt;/p&gt;\n&lt;p&gt;Tahlillar shuni ko'rsatdiki, xavf guruhi yuqori bo'lgan go'daklar miya faoliyatini bo'g'in ritmiga moslashtirishda qiynaladilar va bu ko'rsatkich ularning 20 oylikdagi nutqiy natijalari bilan bog'liq. Shu bilan birga, tovushlar ketma-ketligini statistik tahlil qilish qobiliyati saqlanib qolgan. Biroq, so'zlarni tanib olish testlarida xavf guruhi bolalari yangilikka nisbatan sustroq reaksiya ko'rsatdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kichik guruhda o'tkazilgan bo'lib, yuqori xavf maqomi aniq tashxisni anglatmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-09-25/infants-at-high-and-low-likelihood-for-autism-show-different.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\
