            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"265\" cy=\"166\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"655\" cy=\"192\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · PSYCHIATRY AND CLINICAL PSYCHOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Diabet va DEG: diqqat&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;yetishmovchiligi yurak&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;xastaliklari xavfiga qanday&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ta'sir qiladi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a-f1.jpg\" alt=\"Turli mamlakatlarda 2-turdagi qandli diabet tashxisi qo'yilgandan so'ng DEHB va yuzaga kelgan MACE o'rtasidagi bog'liqli\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Turli mamlakatlarda 2-turdagi qandli diabet tashxisi qo'yilgandan so'ng DEHB va yuzaga kelgan MACE o'rtasidagi bog'liqlik.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Turli mamlakatlarda 2-turdagi qandli diabet tashxisi qo'yilgandan so'ng DEHB va yuzaga kelgan MACE o'rtasidagi bog'liqlik. Qisqartmalar: 2-TQD: 2-turdagi qandli diabet; DEHB: diqqat tanqisligi va giperaktivlik sindromi. Eslatma: 1-model jins, yosh va 2-TQD tashxisi qo'yilgan kalendar yil bo'yicha tuzatilgan; 2-model qo'shimcha ravishda ruhiy kasalliklar tarixi, psixotrop dorilar va kardiometabolik dorilarni qabul qilish bo'yicha tuzatilgan; 3-model qo'shimcha ravishda kuzatuv davrida diabetga qarshi dorilarni qabul qilish bo'yicha tuzatilgan. Birlashtirilgan tahlilda barcha mamlakatlardan olingan ta'sir o'lchamlarini birlashtirish uchun tasodifiy effektlar modeli ishlatilgan. aNo. tadqiqot oxiriga kelib DEHB tashxisi qo'yilgan (yoki qo'yilmagan) yoki DEHB dorilarini qabul qilgan (yoki qabul qilmagan) kattalar sonini anglatadi. bSoxta kashfiyot darajasiga tuzatish kiritilgandan so'ng statistik jihatdan ahamiyatli.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Diqqat yetishmovchiligi va giperaktivlik sindromi (&lt;a href=\"concepts/gene-expression.html\"&gt;DEG&lt;/a&gt;) ko‘pincha 2-turdagi diabet bilan birga kechadi va salomatlikni nazorat qilishda qo‘shimcha qiyinchiliklar tug‘diradi. Olimlar infarkt, insult va erta o‘lim xavfini tushunish uchun ikki millionga yaqin bemor ma'lumotlarini tahlil qilishdi. Ma'lum bo‘lishicha, DEG mavjudligi umumiy o‘lim ko‘rsatkichini sezilarli darajada oshiradi, yosh bemorlarda esa ushbu sindrom uchun dori vositalarini qabul qilish alohida e'tiborni talab qiladi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;2-turdagi diabetli bemorlarda DEG umumiy o‘lim xavfini oshiradi.&lt;/li&gt;\n&lt;li&gt;Yosh bemorlarda DEG dorilarini qabul qilish yurak-qon tomir hodisalari bilan bog‘liq.&lt;/li&gt;\n&lt;li&gt;Diabet va ruhiy kasalliklarni davolashda kompleks yondashuv muhim.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Xalqaro kohort tadqiqotida 2010-2020 yillar oralig‘ida yetti mamlakatda (Avstraliya, Daniya, Niderlandiya, Norvegiya, Shvetsiya, Buyuk Britaniya va AQSh) 2-turdagi diabet (QD2) tashxisi qo‘yilgan 1 929 027 nafar kattalar ishtirok etdi. Tadqiqotchilar jiddiy yurak-qon tomir hodisalari (MACE: miokard infarkti, insult yoki yurak-qon tomir kasalliklari tufayli o‘lim) va umumiy o‘lim darajasini baholash uchun Koks proporsional xavf modellaridan foydalandilar. DEG holati tashxis yoki dori vositalarini qabul qilish faktiga asoslanib aniqlandi.&lt;/p&gt;\n&lt;p&gt;Natijalar shuni ko‘rsatdiki, QD2 va DEG bo‘lgan bemorlarda umumiy o‘lim xavfi yuqoriroq (xavf nisbati HR 2,42; 95% CI 1,72–3,41), ammo umumiy guruhda MACE bilan to‘g‘ridan-to‘g‘ri &lt;a href=\"concepts/ld.html\"&gt;bog‘liqlik&lt;/a&gt; aniqlanmadi. Muhim klinik kuzatuv shundan iboratki, diabet erta boshlangan (45 yoshgacha) bemorlarda DEG preparatlarini qabul qilish MACE chastotasining oshishi bilan bog‘liq bo‘lgan (HR 1,58; 95% CI 1,18–2,10). Ushbu ma'lumotlar metabolik buzilishlari bo‘lgan bemorlar uchun somatik va psixiatrik yordamni integratsiya qilish zarurligini ta'kidlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kuzatuv xarakteriga ega, shuning uchun turmush tarzi omillarining yurak-qon tomir xavfiga ta'sirini istisno qilib bo‘lmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Dolzarbligi. Diqqat tanqisligi va giperaktivlik buzilishi (DTGB) 2-toifa qandli diabet (2-TQD) xavfining ortishi bilan bog'liq. Biroq, DTGB va DTGB uchun dori vositalaridan foydalanishning 2-TQD prognozi va sog'liq natijalariga ta'siri noaniq bo'lib qolmoqda. Ushbu tadqiqot (1) DTGB va (2) DTGB dori vositalaridan foydalanishning 2-TQD tashxisidan keyin yirik noxush yurak-qon tomir hodisalari (MACE) va umumiy o'lim darajasi bilan bog'liqligini o'rganadi.&lt;/p&gt;\n&lt;p&gt;Metodlar. Ushbu ko'p millatli kogorta tadqiqotida Avstraliya, Daniya, Niderlandiya, Norvegiya, Shvetsiya, Buyuk Britaniya va AQShdan olingan aholi ma'lumotlaridan foydalanildi. Standartlashtirilgan tahliliy protokoldan foydalangan holda, biz 2010-2020 yillarda birinchi marta 2-TQD tashxisi qo'yilgan kattalarni aniqladik. Ta'sir etuvchi omillar (1) DTGB (tashxis yoki dori vositalarini qabul qilish orqali aniqlangan) va (2) DTGB bo'lgan kattalar orasida DTGB dori vositalaridan foydalanish bo'lib, ikkalasi ham vaqt o'zgaruvchan omillar sifatida tahlil qilindi. Asosiy natijalar 2-TQD tashxisidan keyin MACE (o'tkir miokard infarkti, insult yoki yurak-qon tomir kasalliklari bilan bog'liq o'lim) va umumiy o'lim edi. Sababga xos Koks modellari 95% ishonch intervallari (CI) bilan xavf nisbatlarini (HR) baholadi; natijalar tasodifiy effektlar meta-tahlili yordamida birlashtirildi va yosh hamda jins bo'yicha stratifikatsiya qilindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;2-TQD va DTGB bo'lgan kattalarda umumiy o'lim xavfi yuqori (HR 2,42), DTGB dori vositalaridan foydalanish esa 2-TQD erta boshlangan (45 yoshgacha, HR 1,58) bemorlarda MACE xavfining ortishi bilan bog'liq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Natijalar. Kogortaga 2-TQD bilan og'rigan 1 929 027 nafar kattalar kiritildi (909 176 [47,1%] erkaklar). Birlashtirilgan tahlillarda, 2-TQD va DTGB bo'lgan kattalarda 2-TQD tashxisidan keyin umumiy o'lim darajasi yuqoriroq (HR 2,42; 95% CI 1,72–3,41), ammo MACE darajasi yuqori emasligi (HR 1,04; 95% CI 0,81–1,35) aniqlandi. 2-TQD va DTGB bo'lgan kattalar orasida DTGB dori vositalaridan foydalanish 45 yoshgacha 2-TQD tashxisi qo'yilganlarda MACE darajasining yuqoriligi bilan bog'liq edi (HR 1,58; 95% CI 1,18–2,10). Ushbu bog'liqliklar jins, yosh, 2-TQD tashxisi qo'yilgan kalendar yil, psixiatrik anamnez, boshqa psixotrop dori vositalari va kardiometabolik dori vositalaridan foydalanishga tuzatish kiritilgandan keyin ham barqaror bo'lib qoldi.&lt;/p&gt;\n&lt;p&gt;Xulosa. 2-TQD va birga keladigan DTGB bo'lgan kattalarda 2-TQD tashxisidan keyin umumiy o'lim xavfi ortishi aniqlandi, DTGB esa barcha mamlakatlarda MACE bilan izchil bog'liq emas edi. DTGB dori vositalaridan foydalanish erta boshlangan 2-TQD bo'lgan kattalarda MACE darajasining yuqoriligi bilan bog'liq edi. Ushbu topilmalar integratsiyalashgan somatik-psixiatrik yordamga bo'lgan potentsial ehtiyojni va MACE hamda o'limni kamaytirishga yordam beradigan DTGB dori vositalaridan foydalanishni diqqat bilan ko'rib chiqish zarurligini ko'rsatadi, ayniqsa yoshroq yoshda boshlangan 2-TQD holatlarida.&lt;/p&gt;\n&lt;p&gt;Diqqat tanqisligi va giperaktivlik buzilishi (DTGB) — bu kundalik faoliyatni buzadigan doimiy diqqat tanqisligi, giperaktivlik va impulsivlik bilan tavsiflanadigan neyrorivojlanish holatidir. DTGB maktab yoshidagi bolalarning taxminan 5 foizida tashxis qilinadi va kamida uchdan ikki qismida kattalik davrida ham faoliyatni buzuvchi simptomlar saqlanib qoladi [1]. DTGB dori vositalaridan, ham stimulyatorlar, ham nostimulyatorlardan foydalanish so'nggi o'n yilliklarda sezilarli darajada oshdi [2] va ko'p millatli tadqiqot shuni ko'rsatdiki, DTGB bo'lgan shaxslarning 30-60 foizi besh yilgacha davolanishda qoladi [3]. Katta kuzatuv tadqiqotlaridan olingan dalillar shuni ko'rsatadiki, DTGB insulin qarshiligi va doimiy giperglikemiya bilan tavsiflanadigan umumiy metabolik kasallik — 2-toifa qandli diabet (2-TQD) xavfining ikki baravar ortishi bilan bog'liq [4–7].&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;2-TQD organizmning insulindan samarali foydalana olmasligi bilan tavsiflanadi, bu qondagi qand miqdorining surunkali yuqori bo'lishiga olib keladi, MACE esa eng xavfli yurak-qon tomir asoratlari uchun umumiy atamadir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;2-TQD ham yurak-qon tomir kasalliklari (YQTK) [8], ham o'lim [9], ayniqsa miokard infarkti, insult va yurak-qon tomir o'limini o'z ichiga olgan yirik noxush yurak-qon tomir hodisalari (MACE) uchun yaxshi o'rnatilgan xavf omilidir [10]. 2-TQDdagi bu natijalar ko'pincha semizlik, dislipidemiya va gipertenziya kabi kardiometabolik xavf omillari bilan bog'liq [8]. Katta aholi asosidagi tadqiqotlar ham DTGB YQTK [11] va umumiy o'lim [12] bilan bog'liqligini aniqladi. Boshqa tomondan, DTGB dori vositalarining uzoq muddatli sog'liqqa ta'siri noaniq bo'lib qolmoqda. Qizig'i shundaki, tadqiqotlar shuni ko'rsatdiki, uzoq muddatli foydalanish YQTK xavfini oshirishi mumkin [13,14], lekin dori-darmonlarni boshlash tasodifiy jarohatlar, o'z joniga qasd qilish va tasodifiy zaharlanishlar bilan bog'liq bo'lmagan tabiiy bo'lmagan o'limni kamaytirishi mumkin [15].&lt;/p&gt;\n&lt;p&gt;2-TQDni samarali boshqarish dori vositalariga rioya qilishni, turmush tarzini o'zgartirishni, muntazam qon glyukozasini nazorat qilishni va muntazam tibbiy ko'riklarni talab qiladi [16]. Ushbu talablar tashkilotchilik, rejalashtirish va barqaror diqqatni talab qiladi [17], bu DTGB bo'lgan shaxslar uchun ayniqsa qiyin. Shunga qaramay, DTGBning 2-TQD natijalariga ta'siri bo'yicha dalillar cheklangan va nomutanosib bo'lib qolmoqda. Bitta kichik tadqiqot (n = 315) 2-TQD bo'lgan shaxslarda DTGBga o'xshash simptomlar va gemoglobin A1c (HbA1c), lipid profili yoki hisoblangan glomerulyar filtratsiya tezligi (eGFR) o'rtasida hech qanday bog'liqlik yo'qligini xabar qildi [18], boshqa bir yirikroq tadqiqot (n = 3164) esa 2-TQD va DTGB birga keladigan shaxslarda glikemik nazorat yomonroq ekanligini aniqladi [19].&lt;/p&gt;\n&lt;p&gt;2-TQD bo'lgan shaxslarda YQTK va umumiy o'lim xavfi yuqoriligini va DTGB mustaqil ravishda shunga o'xshash noxush natijalar bilan bog'liqligini va diabetni o'z-o'zini boshqarishga xalaqit berishi mumkinligini hisobga olsak, DTGB 2-TQD bo'lgan shaxslarda bu xavflarni qanchalik kuchaytirishini aniqlash muhimdir. Ushbu munosabatni tushunish ushbu populyatsiyada natijalarni yaxshilash uchun integratsiyalashgan va maqsadli parvarish strategiyalarini ma'lum qilishi mumkin. Ushbu tadqiqotda biz yetti mamlakatdan olingan milliy ma'muriy yoki reyestr ma'lumotlaridan foydalangan holda, 2-TQD tashxisi qo'yilgan, DTGB bo'lgan va bo'lmagan kattalar MACE va umumiy o'lim darajasida qanchalik farq qilishini o'rgandik. Shuningdek, biz DTGB dori vositalaridan foydalanish 2-TQD va DTGB birga keladigan odamlarda MACE va umumiy o'lim darajasi bilan qanchalik bog'liqligini tekshirdik.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"kohorta-xarakteristikalari\"&gt;&lt;a href=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a.html#kohorta-xarakteristikalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kohorta xarakteristikalari&lt;/span&gt;&lt;/a&gt;Kohorta xarakteristikalari&lt;/h4&gt;\n&lt;p&gt;Istisno mezonlari qo'llanilgandan so'ng, asosiy ma'lumotlar 2010-2020 yillar oralig'ida yetti mamlakatdan 2-turi qandli diabet (QD2) bilan og'rigan 1 929 027 nafar kattalarni (909 176 [47,1%] erkak) o'z ichiga oldi (Qo'shimcha fayl 1: Jadval S7), ulardan 44 748 nafarida (2,3%) kuzatuv oxirida DEHB (diqqat tanqisligi va giperaktivlik buzilishi) aniqlangan. DEHB bo'lgan shaxslar orasida 33 301 (74,4%) holat boshlang'ich davrda yoki undan oldin aniqlangan (Qo'shimcha fayl 1: Jadval S8). Boshlang'ich davrdan keyin aniqlanganlar orasida, kuzatuv boshidan birinchi qayd etilgan DEHB tashxisigacha bo'lgan o'rtacha vaqt mamlakatlar bo'yicha 2,0 yildan 5,7 yilgacha o'zgargan (Qo'shimcha fayl 1: Jadval S9). Erkaklar ulushi DEHB guruhida DEHB bo'lmagan guruhga qaraganda pastroq bo'lgan (40,2% ga nisbatan 47,3%). DEHB bo'lgan kattalar QD2 tashxisi qo'yilgan vaqtda (median diapazon: 34-50 yosh) DEHB bo'lmaganlarga (39-62 yosh) qaraganda yoshroq bo'lgan. Barcha mamlakatlarda DEHB bo'lgan kattalarda DEHB bo'lmaganlarga qaraganda psixiatrik komorbidliklar va psixotrop dori vositalaridan foydalanish ko'proq kuzatilgan (Jadval 1). Kuzatuv davomiyligining medianasi DEHB guruhida 2,2 yildan 3,9 yilgacha, DEHB bo'lmagan guruhda esa 2,8 yildan 5,5 yilgacha o'zgargan. Kuzatuv davrida 120 439 nafar kattada (6,2%) MACE (yirik yurak-qon tomir asoratlari) yuz bergan va 115 945 nafari (6,0%) vafot etgan. Yurak-qon tomir kasalliklari (YQTK) tufayli o'lim MACE holatlarining 7,6%-28,5% ini va barcha o'lim holatlarining 2,0%-29,2% ini tashkil etgan, AQShdan tashqari, u yerda YQTK o'limlari barcha o'limlarning sezilarli darajada yuqori ulushini (95,8%) tashkil qilgan (Qo'shimcha fayl 1: Jadval S10). DEHB dori vositalarini tahlil qilish uchun boshlang'ich xarakteristikalar (Qo'shimcha fayl 1: Jadval S11) va kohortaga kirish vaqtida DEHB holati bo'yicha tabaqalashtirilgan ma'lumotlar (Qo'shimcha fayl 1: Jadval S12) qo'shimcha materiallarda keltirilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;QD2 bilan og'rigan 1,9 million kattalar kohortasida DEHB tarqalishi 2,3% ni tashkil etdi; DEHB bo'lgan bemorlar yoshroq, psixiatrik hamroh kasalliklari ko'proq va psixotrop dori vositalarini tez-tez qabul qilishgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"dehbning-mace-va-barcha-sabablarga-kora-olim-bilan-assotsiatsiyasi\"&gt;&lt;a href=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a.html#dehbning-mace-va-barcha-sabablarga-kora-olim-bilan-assotsiatsiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;DEHBning MACE va barcha sabablarga ko'ra o'lim bilan assotsiatsiyasi&lt;/span&gt;&lt;/a&gt;DEHBning MACE va barcha sabablarga ko'ra o'lim bilan assotsiatsiyasi&lt;/h4&gt;\n&lt;p&gt;Birlashtirilgan ma'lumotlar uchun DEHB MACE bilan assotsiatsiyani ko'rsatmadi (Model 1: HR, 1,04; 95% CI, 0,81-1,35; Rasm 1); mamlakatlararo geterogenlik sezilarli va yuqori bo'lgan (MACE: p &amp;lt; 0,0001, I² = 94,4% [95% CI, 90,9%-96,6%]). Shvetsiyada DEHB MACE darajasining oshishi bilan statistik jihatdan sezilarli darajada bog'liq bo'lgan (HR, 1,44; 95% CI, 1,26-1,65; p &amp;lt; 0,002), AQShda esa DEHB MACE darajasining pasayishi bilan bog'liq bo'lgan (HR, 0,73; 95% CI, 0,69-0,78; p &amp;lt; 0,002). Boshqa mamlakatlarda statistik jihatdan sezilarli assotsiatsiyalar kuzatilmagan (HR diapazoni, 0,36-1,56; Rasm 1). Model 2 va 3 da psixiatrik komorbidliklar, psixotrop va kardiometabolik dori vositalaridan foydalanishga qo'shimcha tuzatishlar kiritilgandan so'ng, assotsiatsiyalar susaygan (Rasm 1). Birlashtirilgan tahlil shuni ko'rsatdiki, jins, yosh va QD2 tashxisi qo'yilgan kalendar yiliga tuzatish kiritilgandan so'ng (Model 1), DEHB bo'lgan kattalarda DEHB bo'lmaganlarga nisbatan barcha sabablarga ko'ra o'lim darajasi ikki baravardan ko'proq oshgan (HR, 2,42; 95% CI, 1,72-3,41; p &amp;lt; 0,002; Rasm 2). Barcha sabablarga ko'ra o'lim bilan bog'liqlik psixiatrik buzilishlar, psixotrop va kardiometabolik dori vositalaridan foydalanish (Model 2: HR, 1,76; 95% CI, 1,23-2,52; p &amp;lt; 0,002) va diabetga qarshi dori vositalaridan foydalanish (Model 3: HR, 1,71; 95% CI, 1,21-2,43; p &amp;lt; 0,002; Rasm 2) uchun qo'shimcha tuzatish kiritilganda susaygan, ammo sezilarli bo'lib qolgan. Mamlakatlararo geterogenlik sezilarli va yuqori bo'lgan (p &amp;lt; 0,0001, I² = 95,8% [95% CI, 93,3-97,3%]). Mamlakat bo'yicha tahlilda DEHB Shvetsiya, Niderlandiya, Daniya va AQShda barcha uchta model bo'yicha barcha sabablarga ko'ra o'lim darajasining oshishi bilan statistik jihatdan sezilarli darajada bog'liq bo'lgan (Model 3: HR diapazoni, 1,53-3,81; Rasm 2).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a-f1.jpg\" alt=\"Turli mamlakatlarda 2-turdagi qandli diabet tashxisi qo'yilgandan so'ng DEHB va yuzaga kelgan MACE o'rtasidagi bog'liqli\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Turli mamlakatlarda 2-turdagi qandli diabet tashxisi qo'yilgandan so'ng DEHB va yuzaga kelgan MACE o'rtasidagi bog'liqlik.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Turli mamlakatlarda 2-turdagi qandli diabet tashxisi qo'yilgandan so'ng DEHB va yuzaga kelgan MACE o'rtasidagi bog'liqlik. Qisqartmalar: 2-TQD: 2-turdagi qandli diabet; DEHB: diqqat tanqisligi va giperaktivlik sindromi. Eslatma: 1-model jins, yosh va 2-TQD tashxisi qo'yilgan kalendar yil bo'yicha tuzatilgan; 2-model qo'shimcha ravishda ruhiy kasalliklar tarixi, psixotrop dorilar va kardiometabolik dorilarni qabul qilish bo'yicha tuzatilgan; 3-model qo'shimcha ravishda kuzatuv davrida diabetga qarshi dorilarni qabul qilish bo'yicha tuzatilgan. Birlashtirilgan tahlilda barcha mamlakatlardan olingan ta'sir o'lchamlarini birlashtirish uchun tasodifiy effektlar modeli ishlatilgan. aNo. tadqiqot oxiriga kelib DEHB tashxisi qo'yilgan (yoki qo'yilmagan) yoki DEHB dorilarini qabul qilgan (yoki qabul qilmagan) kattalar sonini anglatadi. bSoxta kashfiyot darajasiga tuzatish kiritilgandan so'ng statistik jihatdan ahamiyatli.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a-f2.jpg\" alt=\"Turli mamlakatlarda 2-turdagi qandli diabet tashxisi qo'yilgandan so'ng DEHB va barcha sabablarga ko'ra o'lim o'rtasidag\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Turli mamlakatlarda 2-turdagi qandli diabet tashxisi qo'yilgandan so'ng DEHB va barcha sabablarga ko'ra o'lim o'rtasidagi bog'liqlik.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Turli mamlakatlarda 2-turdagi qandli diabet tashxisi qo'yilgandan so'ng DEHB va barcha sabablarga ko'ra o'lim o'rtasidagi bog'liqlik. Qisqartmalar: 2-TQD: 2-turdagi qandli diabet; DEHB: diqqat tanqisligi va giperaktivlik sindromi. Eslatma: 1-model jins, yosh va 2-TQD tashxisi qo'yilgan kalendar yil bo'yicha tuzatilgan; 2-model qo'shimcha ravishda ruhiy kasalliklar tarixi, psixotrop dorilar va kardiometabolik dorilarni qabul qilish bo'yicha tuzatilgan; 3-model qo'shimcha ravishda kuzatuv davrida diabetga qarshi dorilarni qabul qilish bo'yicha tuzatilgan. Birlashtirilgan tahlilda barcha mamlakatlardan olingan ta'sir o'lchamlarini birlashtirish uchun tasodifiy effektlar modeli ishlatilgan. aNo. tadqiqot oxiriga kelib DEHB tashxisi qo'yilgan (yoki qo'yilmagan) yoki DEHB dorilarini qabul qilgan (yoki qabul qilmagan) kattalar sonini anglatadi. bSoxta kashfiyot darajasiga tuzatish kiritilgandan so'ng statistik jihatdan ahamiyatli.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HR (xavf nisbati) DEHB bo'lgan guruhda hodisa xavfi DEHB bo'lmagan guruhga nisbatan qanchalik yuqori yoki pastligini ko'rsatadi; 95% CI (ishonch oralig'i) baholashning aniqligini aks ettiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"dehb-dori-vositalarining-mace-va-barcha-sabablarga-kora-olim-bilan-assotsiatsiyasi\"&gt;&lt;a href=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a.html#dehb-dori-vositalarining-mace-va-barcha-sabablarga-kora-olim-bilan-assotsiatsiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;DEHB dori vositalarining MACE va barcha sabablarga ko'ra o'lim bilan assotsiatsiyasi&lt;/span&gt;&lt;/a&gt;DEHB dori vositalarining MACE va barcha sabablarga ko'ra o'lim bilan assotsiatsiyasi&lt;/h4&gt;\n&lt;p&gt;DEHB bo'lgan kattalar orasida (n = 33 301) birlashtirilgan tahlillar DEHB dori vositalaridan foydalanish va MACE yoki barcha sabablarga ko'ra o'lim o'rtasida sezilarli assotsiatsiyalarni ko'rsatmadi (Rasm 3 va 4). Mamlakatlararo geterogenlik sezilarli bo'lmagan (MACE: p = 0,34, I² = 12% [95% CI, 0-81,7%]; barcha sabablarga ko'ra o'lim: p = 0,18, I² = 33,1% [95% CI, 0-71,6%]). Mamlakat bo'yicha tahlillar ham MACE (HR diapazoni, 0,89-1,36) yoki barcha sabablarga ko'ra o'lim (HR diapazoni, 0,56-1,75) uchun sezilarli assotsiatsiyalarni ko'rsatmadi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a-f3.jpg\" alt=\"Turli mamlakatlarda 2-turdagi qandli diabet tashxisi qo'yilgandan so'ng DEHB dorilarini qabul qilish va yuzaga kelgan MA\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Turli mamlakatlarda 2-turdagi qandli diabet tashxisi qo'yilgandan so'ng DEHB dorilarini qabul qilish va yuzaga kelgan MACE o'rtasidagi bog'liqlik.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Turli mamlakatlarda 2-turdagi qandli diabet tashxisi qo'yilgandan so'ng DEHB dorilarini qabul qilish va yuzaga kelgan MACE o'rtasidagi bog'liqlik. Qisqartmalar: 2-TQD: 2-turdagi qandli diabet. Eslatma: 1-model jins, yosh va 2-TQD tashxisi qo'yilgan kalendar yil bo'yicha tuzatilgan; 2-model qo'shimcha ravishda ruhiy kasalliklar tarixi, psixotrop dorilar va kardiometabolik dorilarni qabul qilish bo'yicha tuzatilgan; 3-model qo'shimcha ravishda kuzatuv davrida diabetga qarshi dorilarni qabul qilish bo'yicha tuzatilgan. Birlashtirilgan tahlilda barcha mamlakatlardan olingan ta'sir o'lchamlarini birlashtirish uchun tasodifiy effektlar modeli ishlatilgan. aSoxta kashfiyot darajasiga tuzatish kiritilgandan so'ng statistik jihatdan ahamiyatli.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a-f4.jpg\" alt=\"Turli mamlakatlarda 2-turdagi qandli diabet tashxisi qo'yilgandan so'ng DEHB dorilarini qabul qilish va barcha sabablarg\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Turli mamlakatlarda 2-turdagi qandli diabet tashxisi qo'yilgandan so'ng DEHB dorilarini qabul qilish va barcha sabablarga ko'ra o'lim o'rtasidagi bog'liqlik.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Turli mamlakatlarda 2-turdagi qandli diabet tashxisi qo'yilgandan so'ng DEHB dorilarini qabul qilish va barcha sabablarga ko'ra o'lim o'rtasidagi bog'liqlik. Qisqartmalar: 2-TQD: 2-turdagi qandli diabet. Eslatma: 1-model jins, yosh va 2-TQD tashxisi qo'yilgan kalendar yil bo'yicha tuzatilgan; 2-model qo'shimcha ravishda ruhiy kasalliklar tarixi, psixotrop dorilar va kardiometabolik dorilarni qabul qilish bo'yicha tuzatilgan; 3-model qo'shimcha ravishda kuzatuv davrida diabetga qarshi dorilarni qabul qilish bo'yicha tuzatilgan. Birlashtirilgan tahlilda barcha mamlakatlardan olingan ta'sir o'lchamlarini birlashtirish uchun tasodifiy effektlar modeli ishlatilgan. aSoxta kashfiyot darajasiga tuzatish kiritilgandan so'ng statistik jihatdan ahamiyatli.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"subguruh-tahlillari\"&gt;&lt;a href=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a.html#subguruh-tahlillari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Subguruh tahlillari&lt;/span&gt;&lt;/a&gt;Subguruh tahlillari&lt;/h4&gt;\n&lt;p&gt;Birlashtirilgan tahlillar shuni ko'rsatdiki, DEHBning MACE va barcha sabablarga ko'ra o'lim bilan assotsiatsiyalari jins va yosh guruhlari bo'yicha izchil bo'lgan (Rasm 1 va 2). DEHB dori vositalari uchun natijalar jins bo'yicha ham taqqoslanadigan bo'lgan (Rasm 3 va 4). Yosh bo'yicha tabaqalashtirilganda, yoshroq guruhda (18-44 yosh) MACE darajasining yuqoriligi aniqlandi, bu Model 2 da ko'p marta tekshirish tuzatishidan so'ng statistik jihatdan sezilarli assotsiatsiyaga ega bo'ldi (HR, 1,58; 95% CI, 1,18-2,10; Rasm 3).&lt;/p&gt;\n&lt;h4 id=\"psixiatrik-komorbidlik,-n-percent\"&gt;&lt;a href=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a.html#psixiatrik-komorbidlik,-n-percent\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Psixiatrik komorbidlik, n (%)&lt;/span&gt;&lt;/a&gt;Psixiatrik komorbidlik, n (%)&lt;/h4&gt;\n&lt;p&gt;1 058 (29,9) 21 301 (6,3) 1 016 (33,0) 12 536 (6,7) 1 839 (42,9) 16 946 (7,3) 222 (32,8) 1 296 (6,8) 3 304 (60,9) 24 855 (7,5) (40,3) 24 744 (14,2) 12 133 (44,3) 106 163 (17,7)&lt;/p&gt;\n&lt;p&gt;Psixotrop dori vositalarini qo'llash, n (%)&lt;br /&gt;\n2 199 (62,2) 80 039 (23,6) 1 487 (48,2) 35 864 (19,2) (13,6) 10 592 (4,5) 393 (58,1) 5 467 (28,9) 3 280 (60,5) 65 883 (19,8) (47,7) 46 380 (26,7) 9 913 (36,2) 88 787 (14,8)&lt;/p&gt;\n&lt;h4 id=\"kardiometabolik-dori-vositalarini-qollash,-n-percent\"&gt;&lt;a href=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a.html#kardiometabolik-dori-vositalarini-qollash,-n-percent\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kardiometabolik dori vositalarini qo'llash, n (%)&lt;/span&gt;&lt;/a&gt;Kardiometabolik dori vositalarini qo'llash, n (%)&lt;/h4&gt;\n&lt;p&gt;3 348 (94,7) 317 190 (93,6) (29,6) 96 480 (51,7) 4 288 (100,0) 233 338 (100,0) (6,4) 3 424 (18,1) 1 101 (20,3) 135 379 (40,8) (79,6) 134 046 (77,2) 4 799 (17,5) 104 529 (17,4)&lt;/p&gt;\n&lt;p&gt;Qisqartmalar: T2D — 2-turdagi qandli diabet, ADHD — diqqat tanqisligi va giperaktivlik sindromi, MACE — yirik noxush yurak-qon tomir hodisalari, IQR — kvartillararo masofa. aKuzatuv davri oxirigacha ADHD bo'lgan va bo'lmagan kattalar (MACE natijasi uchun).&lt;/p&gt;\n&lt;p&gt;Sezgirlik tahlillari. Ma'lumotlarning cheklanganligi sababli, klinik tashxis qo'yilgan T2D bilan cheklangan sezgirlik tahlillari faqat Shvetsiya va Buyuk Britaniyada o'tkazildi. Ushbu tahlillarda biz ADHD va MACE o'rtasida statistik jihatdan sezilarli bog'liqlikni kuzatdik (1-model: HR, 1,48; 95% CI, 1,24–1,77; p &amp;lt; 0,002), garchi bu bog'liqlik komorbidlik va dori vositalarini qo'llash bo'yicha tuzatishlardan so'ng ahamiyatli bo'lmay qoldi (Jadval SN 13). Barcha sabablarga ko'ra o'lim ko'rsatkichlari uchun effekt baholari asosan o'zgarmadi, bu bir-birining ustiga tushadigan ishonch intervallari bilan tasdiqlanadi (Jadval SN 14). ADHD faqat klinik tashxis bilan belgilangan sezgirlik tahlillarida MACE va barcha sabablarga ko'ra o'limning effekt baholari asosiy tahlilda kuzatilganlarga mos keldi (Jadval SN 13–16). Baholar 65 yoshdan keyin T2D tashxisi qo'yilgan kattalarni chiqarib tashlagandan so'ng (Jadval SN 13–16) va ijtimoiy-iqtisodiy holat (SES) bo'yicha tuzatishlardan so'ng (Jadval SN 13–16) barqaror bo'lib qoldi. ADHD boshlang'ich darajadan oldin belgilangan sezgirlik tahlillarida MACE va barcha sabablarga ko'ra o'limning effekt baholari asosiy tahlilda kuzatilganlarga mos keldi (Jadval SN 13–14).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sezgirlik tahlillari asosiy natijalarning mustahkamligini tasdiqladi, bu ADHD va MACE o'rtasidagi bog'liqlik turli diagnostika mezonlari va ijtimoiy-iqtisodiy omillar bo'yicha tuzatishlar kiritilganda ham saqlanib qolishini ko'rsatdi.&lt;br /&gt;\n[!tip] Sezgirlik tahlili — bu tadqiqot xulosalarining dastlabki taxminlar yoki ma'lumotlarni tanlash mezonlari o'zgarganda qanchalik o'zgarishini tekshirish usuli bo'lib, u natijalarning ishonchliligini baholashga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;p&gt;Ushbu yirik ko‘p millatli kogorta tadqiqotida T2D (2-turdagi qandli diabet) va birga kechuvchi ADHD (diqqat tanqisligi va giperaktivlik buzilishi) bo‘lgan kattalarda ADHD bo‘lmaganlarga nisbatan barcha sabablarga ko‘ra o‘lim darajasi ikki baravardan ko‘proq yuqori bo‘lgan. Garchi T2D o‘lim uchun yaxshi o‘rnatilgan xavf omili bo‘lsa-da, bizning topilmalarimiz ADHD qo‘shimcha xavf bilan bog‘liqligini ko‘rsatadi. Aksincha, biz ADHD va MACE (yirik noxush yurak-qon tomir hodisalari) o‘rtasida barqaror bog‘liqlikni kuzatmadik. Biroq, ADHD dorilarini qo‘llash erta boshlangan T2D bilan og‘rigan kattalarda MACE darajasining 51% ga yuqori bo‘lishi bilan bog‘liq edi. Umuman olganda, ushbu topilmalar ADHD, yurak-qon tomir komorbidligi va T2D bilan og‘rigan kattalardagi o‘lim o‘rtasidagi murakkab o‘zaro ta’sirni ta’kidlaydi hamda diabetni davolashda ADHD haqida xabardorlikni oshirish va ushbu populyatsiyada sog‘liqni saqlash natijalarini yaxshilash uchun klinik yordamni kuchaytirish zarurligini ko‘rsatadi. Takroriy tadqiqotlar zarur bo‘lsa-da, bizning topilmalarimiz ADHD dorilari T2D va ADHD bilan og‘rigan kattalarda ehtiyotkorlik bilan buyurilishi va diqqat bilan nazorat qilinishi kerakligini ko‘rsatadi. Yoshroq shaxslar ADHD dorilarini qo‘llash bilan bog‘liq yurak-qon tomir kasalliklariga (YQTK) nima uchun ko‘proq moyil bo‘lishini chuqurroq o‘rganish kerak, bu esa maqsadli profilaktika strategiyalarini ishlab chiqishga yordam berishi mumkin.&lt;/p&gt;\n&lt;h4 id=\"adhdning-mace-va-barcha-sabablarga-kora-olim-bilan-bogliqligi\"&gt;&lt;a href=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a.html#adhdning-mace-va-barcha-sabablarga-kora-olim-bilan-bogliqligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ADHDning MACE va barcha sabablarga ko‘ra o‘lim bilan bog‘liqligi&lt;/span&gt;&lt;/a&gt;ADHDning MACE va barcha sabablarga ko‘ra o‘lim bilan bog‘liqligi&lt;/h4&gt;\n&lt;p&gt;ADHD T2D bilan og‘rigan kattalarda barcha sabablarga ko‘ra yuqori o‘lim bilan bog‘liq bo‘lib, bu yosh guruhlari va jinsidan, psixiatrik komorbidliklardan, psixotrop dorilarni qo‘llashdan va kardiometabolik davolash usullaridan qat’i nazar, izchil kuzatilgan. Garchi T2D o‘lim uchun yaxshi o‘rnatilgan xavf omili bo‘lsa-da, bizning topilmalarimiz birga kechuvchi ADHD qo‘shimcha hissa qo‘shishini ko‘rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;T2D bilan og‘rigan kattalarda ADHD mavjudligi o‘lim xavfini ikki baravardan ko‘proqqa oshiradi, erta boshlangan T2D holatida esa ADHD dorilarini qabul qilish MACE xavfini 51% ga oshiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"adhd-dorilarining-mace-va-barcha-sabablarga-kora-olim-bilan-bogliqligi\"&gt;&lt;a href=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a.html#adhd-dorilarining-mace-va-barcha-sabablarga-kora-olim-bilan-bogliqligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ADHD dorilarining MACE va barcha sabablarga ko‘ra o‘lim bilan bog‘liqligi&lt;/span&gt;&lt;/a&gt;ADHD dorilarining MACE va barcha sabablarga ko‘ra o‘lim bilan bog‘liqligi&lt;/h4&gt;\n&lt;p&gt;T2D tashxisi qo‘yilgan yosh bo‘yicha tabaqalashtirilganda, ADHD dorilarini qo‘llash yosh kattalarda MACE xavfining oshishi bilan bog‘liq bo‘lgan, ammo keksa yoshdagilarda emas. Bu yosh kattalarda YQTKning dastlabki tarqalish darajasi pastligini aks ettirishi mumkin, bu esa yuzaga keladigan hodisalar va dorilarning potentsial ta’sirini aniqlashni osonlashtiradi, shuningdek, metabolik yomonlashuv va semirish kabi qo‘shma xavf omillari tufayli erta boshlangan T2D bilan bog‘liq YQTKga nisbatan yuqori zaiflikni keltirib chiqaradi. Keksa yoshdagilarda yuqori xavfning yo‘qligi qisman ehtiyotkorroq buyurish amaliyotini, shu jumladan pastroq boshlang‘ich dozalarni va bosqichma-bosqich titrlashni aks ettirishi mumkin. Umumiy populyatsiyada yosh guruhlari bo‘ylab o‘xshash yurak-qon tomir xavflari haqida xabar beruvchi tadqiqotlardan farqli o‘laroq, bizning topilmalarimiz T2D bo‘lgan populyatsiyalarda yoshga bog‘liq farqlar kuzatilishi mumkinligini ko‘rsatadi. Bizning ma’lumotlarimizga ko‘ra, bu T2D bilan og‘rigan shaxslarda ADHD dorilarini MACE va o‘lim bilan bog‘liq holda o‘rganuvchi birinchi tadqiqotdir. Garchi statistik jihatdan sezilarli umumiy yurak-qon tomir zarari kuzatilmagan bo‘lsa-da, tabaqalashtirilgan tahlillar erta boshlangan T2D bilan og‘riganlarda potentsial yuqori xavfni ko‘rsatadi. Oldingi tadqiqotlar ADHD dorilarini uzoq muddatli qo‘llashni yurak-qon tomir xavfining oshishi bilan, atomoksetin uchun esa T2D xavfining yuqoriligi bilan bog‘lagan, boshqalari esa dori-darmonlarni boshlashdan keyin tabiiy bo‘lmagan sabablarga ko‘ra o‘limning kamayganini xabar qilgan. ADHD bilan bog‘liq bo‘lgan semirish va nosog‘lom ovqatlanish xulq-atvori, shuningdek, ADHD dorilarini qo‘llash bilan bog‘liq ishtahaning pasayishi, YQTK va o‘lim bilan o‘rnatilgan aloqalarni hisobga olgan holda, kuzatilgan bog‘liqliklarga qisman hissa qo‘shishi mumkin. Kelgusi tadqiqotlar ADHD, uni davolash va yurak-qon tomir natijalari o‘rtasidagi munosabatda semirishning vositachilik rolini o‘rganishi kerak. Bundan tashqari, kelgusi tadqiqotlar ADHD va metabolik kasalliklarning yurak-qon tomir xavfi va tabiiy sabablarga ko‘ra o‘limga qo‘shgan mustaqil va birgalikdagi hissalarini yaxshiroq ajratish uchun T2D bo‘lmagan populyatsiyalarni o‘z ichiga olgan holda ADHD bilan og‘rigan shaxslar o‘rtasida YQTK va o‘limni bevosita solishtirishi kerak. Yosh va dori sinfiga xos bo‘lgan yurak-qon tomir xavflarini aniqlashtirish uchun uzoqroq kuzatuv davriga ega bo‘lgan yirikroq lonjityud tadqiqotlar zarur.&lt;/p&gt;\n&lt;h4 id=\"kuchli-va-zaif-tomonlar\"&gt;&lt;a href=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a.html#kuchli-va-zaif-tomonlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kuchli va zaif tomonlar&lt;/span&gt;&lt;/a&gt;Kuchli va zaif tomonlar&lt;/h4&gt;\n&lt;p&gt;Uch qitʼa boʻylab aholi maʼlumotlaridan foydalangan holda, bizning topilmalarimiz T2D va ADHD bilan ogʻrigan, turli sogʻliqni saqlash muassasalarida klinik yordam olayotgan kattalar uchun umumlashtirilishi mumkin. Bir nechta cheklovlarni hisobga olish kerak. Birinchidan, aniqlashdagi tarafkashlik (detection bias) ehtimoli mavjud, chunki ADHD bilan ogʻrigan shaxslar tibbiy yordamga tez-tez murojaat qilishlari mumkin, bu esa yurak-qon tomir kasalliklarini erta boshqarish va MACE rivojlanishini kechiktirish imkonini beradi. Ikkinchidan, ADHD keksa yoshdagi odamlarda kam tashxis qoʻyilgan boʻlishi mumkin, yosh kattalarda esa ortiqcha tashxis qoʻyilishi baholarni nolga yaqinlashtirgan boʻlishi mumkin. Uchinchidan, T2D ni aniqlash usullari mamlakatlar boʻylab turlicha boʻlgan, ayniqsa birlamchi tibbiy yordam maʼlumotlari mavjud boʻlmagan joylarda, garchi T2D ni diabetga qarshi dorilar yordamida aniqlash koʻp hollarni qamrab olgan boʻlsa ham. Muhimi, T2D klinik tashxisi qoʻyilgan kattalar bilan cheklangan sezgirlik tahlillari izchil natijalarni berdi. MACE taʼriflari mamlakatlar boʻylab izchilroq boʻlishi mumkin, chunki bu hodisalar odatda ixtisoslashgan yordamda boshqariladi, garchi sogʻliqni saqlash tizimlari va diagnostika amaliyotidagi farqlar ham MACE aniqlangan shaxslar oʻrtasidagi oʻzgarishlarga hissa qoʻshgan boʻlishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot uch qitʼani qamrab olganligi sababli yuqori umumlashtirish qobiliyatiga ega, ammo natijalar aniqlashdagi tarafkashlik va ADHD hamda T2D diagnostikasidagi farqlar bilan cheklangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Toʻrtinchidan, ADHD dori-darmonlari tahlili kichik namunalar hajmi bilan cheklangan, bu esa kattaroq kogortalarda takrorlashni talab qiladi. Bundan tashqari, 75-persentil toʻldirish intervallariga asoslangan taʼsir taʼriflari dori vositalaridan haqiqiy foydalanishni toʻliq qamrab olmasligi mumkin, ayniqsa bir-birining ustiga tushadigan yoki tartibsiz toʻldirish naqshlari mavjud boʻlganda. Psixotrop/kardiometabolik dori vositalaridan foydalanishni aniqlash uchun bazaviy chiziqdan oldingi 3 oylik oynadan foydalanish yaqinda toʻldirilmagan surunkali foydalanuvchilarni toʻliq qamrab olmasligi mumkin, bu esa notoʻgʻri tasniflashga olib keladi. Beshinchidan, topilmalar qisman koʻrsatma boʻyicha aralashuvni (confounding by indication) aks ettirishi mumkin, chunki davolangan shaxslar ADHD simptomlarining ogʻirroq koʻrinishlariga ega boʻlishi mumkin [39] yoki aksincha, ogʻir ADHD simptomatologiyasi davolanishga rioya qilishda qiyinchiliklarga olib keladi. Bundan tashqari, baʼzi mamlakatlarda (masalan, Daniya va Avstraliya) ADHD ni aniqlash asosan dori-darmon yozuvlariga tayangan, chunki ixtisoslashgan/xususiy yordam maʼlumotlari cheklangan [40,41], bu esa dori qabul qilgan va qabul qilmagan ADHD guruhlari oʻrtasidagi taqqoslashni imkonsiz qiladi. Oʻlchanmagan yurak-qon tomir xavf omillari (masalan, chekish, BMI, qon bosimi, glikemik nazorat, buyrak funksiyasi va moddalarni isteʼmol qilish) tomonidan qoldiq aralashuv yoki vositachilikni istisno qilib boʻlmaydi va bu kuzatilgan assotsiatsiyalarni qisman tushuntirishi mumkin. ADHD, dori vositalaridan foydalanish hamda yurak-qon tomir va oʻlim natijalari oʻrtasidagi bogʻliqlikni yaxshiroq tushunish uchun batafsilroq kardiometabolik va turmush tarzi oʻlchovlarini oʻz ichiga olgan kelajakdagi tadqiqotlar zarur.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Koʻrsatma boʻyicha aralashuv (confounding by indication) — dori vositasi buyurilishiga sabab boʻlgan kasallikning oʻzi natijaga taʼsir qilishi holati.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Oltinchidan, vaqt oʻtishi bilan oʻzgarib turadigan diabetga qarshi dori vositalaridan foydalanishga tuzatish kiritish kollayder tarafkashligini (collider bias) keltirib chiqargan boʻlishi mumkin, chunki dori vositalaridan foydalanish ham ADHD holatiga, ham T2D ogʻirligiga bogʻliq. Garchi diabetga qarshi dori vositalari faqat mustahkamlikni baholash uchun kiritilgan boʻlsa-da, kelajakdagi tadqiqotlar asosiy mexanizmlarni oʻrganishda oʻzlarining sababiy taxminlarini aniq belgilashlari kerak. Yettinchidan, mamlakatlar oʻrtasidagi sezilarli geterogenlik shuni koʻrsatadiki, birlashtirilgan baholarni mamlakatlar boʻylab umumiy taʼsir sifatida emas, balki turli xil sharoitlardagi oʻrtacha taʼsir sifatida talqin qilish kerak. Ishonch intervallari bir-biriga mos kelishiga qaramay, baholash yoʻnalishidagi oʻzgarishlar potentsial statistik noaniqlikni, shuningdek, sogʻliqni saqlash tizimlari, maʼlumotlar manbalari, ADHD ni aniqlash va mamlakatlar boʻylab yosh tarkibidagi farqlarni taʼkidlaydi, shuning uchun bu topilmalarni mahalliy sharoitda qoʻllashda ehtiyotkorlik talab etiladi. Nihoyat, past va oʻrta daromadli mamlakatlarga umumlashtirish cheklangan boʻlishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kuzatilgan assotsiatsiyalar turmush tarzi va hamroh kasalliklar kabi hisobga olinmagan omillar tufayli buzilgan boʻlishi mumkin, shuning uchun sabab-oqibat bogʻliqliklarini talqin qilishda ehtiyot boʻlish kerak.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;Ushbu ko‘p millatli kogorta tadqiqoti shuni ko‘rsatadiki, 2-turdagi qandli diabet (QD2) bilan og‘rigan kattalar orasida DEHB barcha sabablarga ko‘ra o‘lim xavfining ortishi bilan bog‘liq, ammo yirik noxush yurak-qon tomir hodisalari (MACE) bilan emas. Tadqiqot natijalari, shuningdek, QD2 bilan og‘rigan kattalarda DEHB uchun dori vositalaridan foydalanish yoshroq yoshdagi kattalarda MACE xavfining ortishi bilan bog‘liqligini ko‘rsatadi. Ushbu topilmalar QD2 va DEHB bilan bir vaqtda kasallangan kattalar uchun qo‘shimcha yordam zarurligini ta’kidlaydi hamda psixiatriya va somatik soha mutaxassislarini o‘z ichiga olgan integratsiyalashgan, fanlararo yordamning ahamiyatini ko‘rsatadi, bu esa MACE va o‘lim xavfini kamaytirishga yordam berishi mumkin. Ushbu natijalarni takrorlash hamda QD2 bilan og‘rigan kattalarda DEHBni MACE va o‘lim bilan bog‘laydigan asosiy mexanizmlarni o‘rganish uchun qo‘shimcha tadqiqotlar talab etiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;QD2 bilan og‘rigan kattalarda DEHB o‘lim xavfini oshiradi, DEHB dori vositalari esa yosh bemorlarda MACE xavfi bilan bog‘liq, bu esa kompleks yondashuvni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kuzatuv xarakteriga ega, shuning uchun aniqlangan bog‘liqliklar sabab-oqibat munosabatlarini isbotlamaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"malumotlar-manbalari\"&gt;&lt;a href=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a.html#malumotlar-manbalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ma'lumotlar manbalari&lt;/span&gt;&lt;/a&gt;Ma'lumotlar manbalari&lt;/h4&gt;\n&lt;p&gt;Biz yetti mamlakatdan (Avstraliya, Daniya, Niderlandiya, Norvegiya, Shvetsiya, Buyuk Britaniya [UK] va AQSh [US]) olingan, sog'liqni saqlash yozuvlari va dori vositalarini berish ma'lumotlari bilan bog'langan real dunyo individual darajadagi ma'lumotlaridan foydalandik (batafsil ma'lumot 1-qo'shimcha fayl: S1-jadval). Aksariyat mamlakatlar uchun tashxis va dori vositalarini buyurish yoki berish (bundan buyon matnda “berish” deb yuritiladi) bo'yicha ma'lumotlar 2009-yil 1-yanvardan 2020-yil 31-dekabrgacha mavjud edi (istisnolar uchun 1-qo'shimcha fayl: S1-jadvalga qarang). Har bir ma'lumot manbasidan foydalanish uchun axloqiy ruxsat olindi. Tadqiqot reyestr va ma'muriy ma'lumotlarga tayanganligi sababli xabardor qilingan rozilik talab qilinmadi (1-qo'shimcha fayl: sMethods). Biz kohort tadqiqotlari uchun Epidemiologiyada kuzatuv tadqiqotlarini hisobot qilishni kuchaytirish (STROBE) ko'rsatmalariga amal qildik.&lt;/p&gt;\n&lt;h4 id=\"tadqiqot-populyatsiyasi-va-dizayni\"&gt;&lt;a href=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a.html#tadqiqot-populyatsiyasi-va-dizayni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot populyatsiyasi va dizayni&lt;/span&gt;&lt;/a&gt;Tadqiqot populyatsiyasi va dizayni&lt;/h4&gt;\n&lt;p&gt;Tanlovga 18 yoshdan oshgan, 2010 va 2020-yillar oralig'ida 2-turdagi qandli diabet (T2D) tashxisi (Kasalliklarning xalqaro statistik tasnifi, o'ninchi qayta ko'rib chiqish [ICD-10] — E11 kodi) yoki insulinlardan tashqari qon glyukozasini pasaytiruvchi dori vositalari (Anatomik-terapevtik-kimyoviy [ATC] — A10B kodi) buyurilgan kattalar kiritildi. Biz yangi tashxis qo'yilgan T2D bilan og'rigan kattalarni T2D tashxisi yoki qon glyukozasini pasaytiruvchi dori vositalarini berish bo'yicha hech qanday yozuvlarsiz ≥12 oylik «yuvish» davridan (washout period) foydalangan holda aniqladik. Biz jinsi yoki tug'ilgan sanasi bo'yicha ma'lumotlari yetishmaydigan, ko'chib ketgan, vafot etgan, ilgari MACE (1-qo'shimcha fayl: S2-jadval) yozuvlari bo'lgan yoki T2D tashxisi qo'yilgunga qadar yoki o'sha vaqtda 1-turdagi diabet (T1D) (ICD-10 kodi E10; 2010-yilgacha ICD-8/9 kodi 250 yoki faqat insulin buyurilgan: ATC kodi A10A) bilan og'rigan kattalarni istisno qildik. Istisnolar har bir mamlakatdagi mavjud ma'lumotlarga bog'liq edi (1-qo'shimcha fayl: S3-jadval). ADHD dori vositalarining ikkilamchi tahlili uchun biz faqat T2D tashxisi qo'yilgunga qadar yoki o'sha vaqtda ADHD tashxisi yoki dori vositalarini berish bo'yicha yozuvlari bo'lgan kattalarni kiritdik. Tadqiqot populyatsiyasi T2D tashxisi qo'yilgan sanadan (kuzatuv boshlanishi) qiziqish uyg'otadigan natijalar, o'lim, ko'chib ketish yoki tadqiqot davri tugaguniga qadar (2020-yil 31-dekabr, agar boshqacha ko'rsatilmagan bo'lsa) kuzatildi (1-qo'shimcha fayl: S1-rasm).&lt;/p&gt;\n&lt;h4 id=\"olchovlar-tasir\"&gt;&lt;a href=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a.html#olchovlar-tasir\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;O'lchovlar: ta'sir&lt;/span&gt;&lt;/a&gt;O'lchovlar: ta'sir&lt;/h4&gt;\n&lt;p&gt;Asosiy tahlilda ta'sir ADHD deb belgilandi, u ADHD tashxisi (ICD-10 kodi F90) yoki ADHD dori vositalarini berish (ATC kodlari: metilfenidat [N06BA04], amfetamin [N06BA01], deksamfetamin [N06BA02], lisdeksamfetamin [N06BA12], atomoksetin [N06BA09], guanfatsin [C02AC02]) yozuvlariga ega bo'lish deb belgilandi. ADHD kuzatuv davrida vaqtga bog'liq ta'sir sifatida qaraldi (1-qo'shimcha fayl: S2-rasm), ammo bir marta qayd etilgach, ADHD holati tadqiqot oxirigacha o'zgarmasdan qoldi. Ikkilamchi tahlilda ADHD dori vositalari vaqtga bog'liq ta'sir sifatida ko'rib chiqildi, bu kuzatuv davrida dori qabul qilish va qabul qilmaslikning bir nechta davrlariga imkon berdi (1-qo'shimcha fayl: S3-rasm). Dori qabul qilish davrlari dori berilgan sana va ADHD dori vositalarini berish oralig'ining (ya'ni, ketma-ket ikki marta berish o'rtasidagi vaqt) bir xil jins va yosh guruhidagi (yosh kattalar [18-34 yosh], o'rta yoshli kattalar [35-64 yosh], qariyalar [≥65 yosh]) kattalar orasidagi mamlakatga xos 75-persentili yig'indisi sifatida belgilandi (1-qo'shimcha fayl: S4-jadval). Bir-birining ustiga tushadigan dori qabul qilish davrlari hisobga olinmadi (ya'ni, agar ikki dori qabul qilish davri ustma-ust tushsa, keyingi berish sanasi oldinga surilmadi). Bir dori qabul qilish davrining oxiri va keyingisining boshlanishi o'rtasidagi intervallar dori qabul qilinmagan davrlar deb hisoblandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Yuvish» davri (washout period) — bu bemorda kasallik belgilari yoki dori qabul qilish holatlari bo'lmagan vaqt oralig'i bo'lib, u tadqiqotchilarga kasallik holati haqiqatan ham yangi ekanligiga ishonch hosil qilish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"natijalar1\"&gt;&lt;a href=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a.html#natijalar1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;p&gt;Natijalar MACE va barcha sabablarga ko'ra o'lim edi. MACE o'tkir miokard infarkti (ICD-10 kodlari I21-I23), insult (I60-I64) yoki yurak-qon tomir kasalliklari bilan bog'liq o'lim (I00-I99 o'lim sababi sifatida qayd etilgan) yozuvlari bilan belgilangan kompozit o'lchov edi.&lt;/p&gt;\n&lt;h4 id=\"kovariatlar\"&gt;&lt;a href=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a.html#kovariatlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kovariatlar&lt;/span&gt;&lt;/a&gt;Kovariatlar&lt;/h4&gt;\n&lt;p&gt;Kovariatlar vaqtinchalik va yoshga bog'liq ta'sirlarni tuzatish uchun bazaviy darajadagi (kuzatuv boshlanishi) kalendar yil va yoshni, shuningdek jinsni o'z ichiga oladi. Psixiatrik komorbidlik bazaviy darajadan besh yil oldin har qanday psixiatrik tashxis asosida binar o'zgaruvchi sifatida modellashtirildi (kodlar 1-qo'shimcha fayl: S2-jadvalda). Psixotrop (ADHD dori vositalaridan tashqari) va kardiometabolik dori vositalaridan foydalanish bazaviy darajadagi joriy davolanishni aniqlash uchun bazaviy darajadan uch oy oldin berilgan dori vositalari asosida binar o'zgaruvchi sifatida qaraldi, bu o'tmishdagi yoki faol bo'lmagan foydalanishni davom etayotgan ta'sir sifatida noto'g'ri tasniflashni kamaytiradi. Antidiabetik dori vositalaridan foydalanish (insulin va qon glyukozasini pasaytiruvchi dorilar) vaqtga bog'liq o'zgaruvchi sifatida modellashtirildi, bunda dori qabul qilish davrlari dori buyurilgan sana va mamlakatga xos 75-persentil berish oralig'i yig'indisi sifatida belgilandi (kodlar 1-qo'shimcha fayl: S5-jadvalda). Ijtimoiy-iqtisodiy maqom (SES) imkon qadar mamlakatga xos daromad yoki ta'lim ko'rsatkichlaridan foydalangan holda to'rt darajaga ajratildi (1-qo'shimcha fayl: S6-jadval).&lt;/p&gt;\n&lt;h4 id=\"statistik-tahlil\"&gt;&lt;a href=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a.html#statistik-tahlil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Statistik tahlil&lt;/span&gt;&lt;/a&gt;Statistik tahlil&lt;/h4&gt;\n&lt;p&gt;Ushbu tadqiqotda ishtirokchi markazlar bo'ylab ma'lumotlar va tahlillarni uyg'unlashtirish uchun umumiy ma'lumotlar modeli va standartlashtirilgan tahliliy protokol yordamida taqsimlangan tarmoq yondashuvi qo'llanildi. Protokol va tahlil rejasi oldindan ro'yxatdan o'tkazilgan (https://doi.org/10.17605/OSF.IO/FZA9B). Biz har bir tadqiqot populyatsiyasining 2-turdagi qandli diabet (T2D) tashxisi qo'yilgan vaqtdagi boshlang'ich xususiyatlarini kuzatuv davri oxiridagi DEHB holati bo'yicha tabaqalashtirgan holda to'pladik. DEHB va DEHB dori vositalaridan foydalanishning MACE va barcha sabablarga ko'ra o'lim bilan bog'liqligini baholash uchun biz har bir ta'sirni mamlakatlar ichida alohida baholash uchun Koks regressiyasini o'tkazdik, bunda vaqt shkalasi sifatida T2D tashxisi qo'yilgan vaqtdan boshlab o'tgan vaqt olindi. Modellar ketma-ket T2D tashxisi qo'yilgan vaqtdagi jins, yosh va kalendar yil (1-model); qo'shimcha ravishda psixiatrik anamnez, psixotrop va kardiometabolik dori vositalaridan foydalanish (2-model); va qo'shimcha ravishda kuzatuv davrida diabetga qarshi dori vositalaridan foydalanish (3-model) bo'yicha tuzatildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Koks regressiyasi — bu voqea sodir bo'lgunga qadar bo'lgan vaqtni tahlil qilish uchun ishlatiladigan statistik usul bo'lib, u turli xil xavf omillarining ushbu vaqtga ta'sirini baholashga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Statistik ahamiyatlilikni aniqlash uchun Benjamini-Xoxberg protsedurasi yordamida olingan, noto'g'ri kashfiyotlar darajasi (FDR) bo'yicha tuzatilgan 0,002 p-qiymat chegarasi ishlatildi. Tahlillar jins va boshlang'ich yosh guruhlari (18-44; ≥45 yosh) bo'yicha tabaqalashtirildi. Mamlakatlar bo'yicha HR 95% ishonch intervallari (CI) bilan tasodifiy effektlar meta-tahlili yordamida birlashtirildi. Mamlakatlararo geterogenlik Kokran Q-testi va I² statistikasi yordamida baholandi, bunda p &amp;lt; 0,05 yoki I² &amp;gt; 75% sezilarli geterogenlikni ko'rsatadi.&lt;/p&gt;\n&lt;p&gt;Sezgirlik tahlillarida biz topilmalarimizning mustahkamligini tekshirish uchun bir nechta muqobil spetsifikatsiyalarni o'tkazdik. Birinchidan, biz T2D klinik tashxisi yordamida tadqiqot populyatsiyasini qayta aniqladik va faqat dori-darmon yozuvlari orqali aniqlangan shaxslarni istisno qildik. Ikkinchidan, biz DEHB holatini faqat klinik DEHB tashxisi asosida qayta aniqladik. Uchinchidan, tahlillar yoshga bog'liq potentsial farqlarni baholash uchun boshlang'ich davrda ma'lum yoshdan kichik bo'lgan kattalar bilan cheklandi. To'rtinchidan, biz barcha modellarni ijtimoiy-iqtisodiy maqom (SES) uchun qo'shimcha ravishda tuzatdik. Beshinchidan, biz DEHB holatini boshlang'ich davrgacha bo'lgan vaqt bo'yicha qat'iy o'zgaruvchi sifatida qayta aniqladik. Ma'lumotlarni boshqarish va tahlillar R (4.2.3-versiya) dasturi yordamida amalga oshirildi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;DEGning diabet&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;oqibatlariga&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ta'siri&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;1,9 mln bemor&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ma'lumotlarini&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tahlil qilish&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;NATIJA
