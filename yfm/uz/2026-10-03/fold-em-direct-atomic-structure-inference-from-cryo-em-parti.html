vaffaqiyat dastlabki bashoratning aniqligiga bog‘liq. AlphaFold3 9GXR ni bashorat qiladi (3.54 Å, TM-score 0.886), lekin 9GXQ ni emas (11.69 Å, TM-score 0.734). Ma’lum pozalar bilan Fold’EM 3.09 va 2.95 Å ga erishadi (A15-jadval), cryoDRGN — 4.34 va 4.41 Å, RELION — 6.89 va 10.75 Å. Ab initio rejimida Fold’EM 9GXR ni 3.58 Å (500 zarracha) va 3.02 Å (5000 zarracha) gacha tiklaydi. 9GXQ 10 000 zarracha bilan 4.63 Å gacha tiklanadi (TM-score 0.836; 6-rasm; A17, A18-jadvallar). RELION va cryoDRGN-AI 8 Å dan yomonroq natija beradi. Zarrachalar sonidagi farq 9GXQ holati AlphaFold3 bashoratida yo‘qligi bilan izohlanadi.&lt;/p&gt;\n&lt;p&gt;Tiklangan strukturalar funksional jihatdan ahamiyatli: Fold’EM DNK dupleksiga xanjar (Y62, Q65, F66) kiritilishini va unga bog‘liq deformatsiyani to‘g‘ri aniqlaydi, AlphaFold3 esa kanonik strukturani bashorat qiladi (6G-rasm).&lt;/p&gt;\n&lt;h4 id=\"b-recovar-yordamida-belgisiz-klassifikatsiya\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#b-recovar-yordamida-belgisiz-klassifikatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;B-RECOVAR yordamida belgisiz klassifikatsiya&lt;/span&gt;&lt;/a&gt;B-RECOVAR yordamida belgisiz klassifikatsiya&lt;/h4&gt;\n&lt;p&gt;Eksperimental sozlama. Geterogen tajribalar dastlabki klass belgilariga bog'liq. Biz mavjud embedding usullari ishonchsiz bo'lgan kam sonli zarrachalar holatida tayanch tuzilmalarsiz zarrachalarni tasniflash imkoniyatini o'rgandik. Baholash uchun biz EMPIAR-13396 UvrA ma'lumotlar to'plamidan foydalandik va har bir holat uchun 250 dan 5000 tagacha zarrachani (jami zarrachalarning 0,13% dan 2,6% gacha) tahlil qildik. Har bir namuna hajmi uchun konsensus aniqlashdan olingan pozalar bilan o'nta tasodifiy iteratsiya o'tkazildi va natijalar dastlabki belgilar bilan solishtirildi. Biz B-RECOVAR usulini RECOVAR va cryoDRGN (o'nta ishga tushirish bo'yicha mediana) bilan taqqosladik. B-RECOVAR ablyatsiyasi har bir holat uchun 1000 ta zarracha darajasida amalga oshirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ablyatsiya — bu modelning har bir komponenti yakuniy natijaga qanday hissa qo'shishini tushunish uchun ularni ketma-ket o'chirib tashlash yoki o'zgartirish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Natijalar. 500 ta zarrachadan boshlab, B-RECOVAR analoglarga qaraganda yuqori aniqlik va barqarorlikni ko'rsatadi (7A-rasm). RECOVAR usulida bunday ma'lumotlar hajmida kovariatsiya yo'nalishi tasodifiy tanlovga bog'liq bo'lib, aniqlik tasodifiy darajadan deyarli mukammalgacha o'zgarib turadi. B-RECOVAR 250 ta zarrachada kamroq aniqlik ko'rsatsa-da, 5000 ta zarrachada 92,5% aniqlikka erishadi (farq 1 foiz punktidan kam); cryoDRGN barcha holatlarda pastroq natija beradi. Ansamblning normallashtirilgan marjini κ ishonchlilik ko'rsatkichi bo'lib xizmat qiladi: aniqlik uning o'sishi bilan monoton ravishda oshib boradi va eng yuqori binda (zarrachalarning 44%) 80% ga yetadi (7B-rasm). Fold’EM usuli ushbu ko'rsatkichdan filtr sifatida foydalanadi: eng kam ishonchli zarrachalarning yarmini olib tashlash konformatsiyalar o'rtasidagi ajralishni (Cα RMSD orqali o'lchanadi) oshiradi va TM-score qiymatini yaxshilaydi (A26-jadval).&lt;/p&gt;\n&lt;p&gt;Komponentlar tahlili (7C, D-rasmlar) shuni ko'rsatdiki, bazaviy baholovchi (shovqinni tuzatish va erituvchi niqobisiz bir o'lchovli RECOVAR analogi) 63,8% aniqlikka erishadi (d'=0,54). Tanlash sohasini erituvchi niqobi bilan cheklash aniqlikni 69,1% gacha, belgilarni sinflar bo'yicha rekonstruktsiyalar bilan o'zaro tekshirish orqali aniqlashtirish esa 72,1% gacha oshiradi. Eng katta o'sish zarrachalar to'plamlari, chastota diapazonlari va initsializatsiyalar bo'yicha ansambllash orqali erishiladi, bu aniqlikni 80,6% ga yetkazadi va holatlar o'rtasidagi ajralishni d'=1,13 dan d'=2,33 gacha ikki barobar oshiradi.&lt;/p&gt;\n&lt;h4 id=\"uzluksiz-geterogenlik-sharoitida-boshqaruv\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#uzluksiz-geterogenlik-sharoitida-boshqaruv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Uzluksiz geterogenlik sharoitida boshqaruv&lt;/span&gt;&lt;/a&gt;Uzluksiz geterogenlik sharoitida boshqaruv&lt;/h4&gt;\n&lt;p&gt;Eksperimental sozlama. Biz uzluksiz konformatsion trayektoriyani optimallashtirilgan Pairformer holatlari va ularning interpolyatsiyasi orqali ifodalash mumkinligini tekshirdik. Buning uchun 1HZH PDB yozuvidan Fab-domenni 360° burish orqali olingan 100 ta atom modeli va 25 000 ta sintetik zarrachani (SNR 0,01, har bir holat uchun 250 ta) o'z ichiga olgan CryoBench IgG-1D ma'lumotlar to'plamidan foydalandik. Har bir zarracha uchta koordinata tizimiga joylashtirildi: cryoDRGN VAE latent fazosi, RECOVAR bosh komponentlari va B-RECOVAR qoldiq ostfazosi. Har bir usul uchun trayektoriya bo'ylab sakkizta tayanch konformatsiya tanlandi va ularning har biri uchun 250 ta eng yaqin zarracha asosida Pairformer tuzilmasi optimallashtirildi. Bu &lt;span class=\"yfm-latex\" data-content=\"H_1%2C%20%5Cdots%2C%20H_8\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; holatlarini berdi. Interpolyatsiya qilingan H(α) holati qo'shni tayanch nuqtalarining qavariq kombinatsiyasi sifatida hisoblandi. Har bir model uchun teskari diffuziya va koordinatalar fazosida aniqlashtirish amalga oshirildi (8-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VAE (variatsion avtokodlovchi) — bu murakkab ma'lumotlarni ixcham «latent» fazoga siqib, oqsil shaklining uzluksiz o'zgarishlari kabi yashirin qonuniyatlarni aniqlashga yordam beradigan neyron tarmoq turi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Natijalar. Sakkizta tayanch nuqtasi trayektoriyani tavsiflash uchun yetarli bo'ldi. B-RECOVAR usulida median NCC ko'rsatkichi etalonning 92% ini, TM-score esa 0,93 ni tashkil etdi (tayanch nuqtalari uchun mos ravishda 89% va 0,91). CryoDRGN uchun bu ko'rsatkichlar 85% va 0,89, RECOVAR uchun esa 90% va 0,92 ga teng bo'ldi (8-rasm). Pairformer holatlarining bosh komponentlari barcha uchta koordinata uchun ilmoq burchagi tartibini saqlab qoladi (9-rasm). Stereokimyoviy sifat A25-jadvalda keltirilgan. Demak, zarrachalarning konformatsion tashkil etilishi AlphaFold tasvirida aks etadi va uzluksiz trayektoriyani oz sonli optimallashtirilgan holatlar bilan ifodalash mumkin.&lt;/p&gt;\n&lt;h4 id=\"aloqador-ishlar\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#aloqador-ishlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Aloqador ishlar&lt;/span&gt;&lt;/a&gt;Aloqador ishlar&lt;/h4&gt;\n&lt;p&gt;Karta rekonstruksiyasi. Atom modelini qurish uchun odatda o'n minglab zarrachalar talab qilinadi. RELION va cryoSPARC zarrachalar orientatsiyasi va xaritasini Bayes yondashuvi orqali birgalikda baholaydi. Geterogen ma'lumotlar uchun ular zarrachalarni K ta diskret sinfga ajratadi. CryoDRGN VAE yordamida uzluksiz latent fazoni o'rganadi, RECOVAR esa hajm kovariatsiyasini baholaydi. CryoDRGN-AI buni ab initio darajasiga kengaytiradi. Zamonaviy yondashuvlar AlphaFold kabi tuzilma bashorati modellaridan foydalanib, ularni eksperimental zichlik bilan yo'naltiradi. Rentgen kristallografiyasida Maddipatla va boshqalar diffuziya modellarini qo'llab, muqobil konformatsiyalarni aniqlaydilar. Krio-EMda CryoBoltz va Maddipatla yondashuvlari AlphaFold3 ni ESP xaritalariga mos tuzilmalarga yo'naltiradi. Embed-Opt va IT-Opt AlphaFold ning latent tasvirlarini optimallashtiradi. Eng yaqin ish — bu CoCoFold bo'lib, u Evoformer ni muzlatgan holda, FRC yo'qotish funksiyasi orqali AlphaFold ni bevosita zarrachalar tasvirlari bilan cheklaydi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f1.jpg\" alt=\"1-rasm: Fold’EM atom tuzilmalarini to‘g‘ridan-to‘g‘ri siyrak krio-EM zarrachalari tasvirlaridan chiqaradi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Fold’EM atom tuzilmalarini to‘g‘ridan-to‘g‘ri siyrak krio-EM zarrachalari tasvirlaridan chiqaradi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: Fold’EM atom tuzilmalarini to‘g‘ridan-to‘g‘ri siyrak krio-EM zarrachalari tasvirlaridan chiqaradi. (A) Fold’EM strukturaviy xulosani poza va sinfni aniqlashtirish bilan navbatma-navbat bajaradi. (B) Zarrachalar dalillari oraliq Pairformer H holatlariga qayta tarqaladi va AlphaFold3 diffuziyasidan oldin qolgan Pairformer bloklari orqali eksperimental yangilanishlarni filtrlaydi. (C) Integrin–BIIG2 Fab kompleksi (PDB 9B9J) uchun AlphaFold3 alohida komponentlarni bashorat qiladi, lekin Fabni noto‘g‘ri bog‘lanish joyiga joylashtiradi. (D) Ab initio Fold’EM bog‘langan kompleks va epitopni atigi 1000 ta zarrachadan — depozit qilingan rekonstruksiya uchun ishlatilganlarning 0,26% — 2,49 Å RMSD, 0,956 TM-ball va 3,52 Å FSC ruxsati bilan tiklaydi (depozit qilingan xarita: 2,6 Å).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f2.jpg\" alt=\"2-rasm: Zarrachalar bilan yo‘naltirish strukturani tiklaydi, ularning rekonstruksiya qilingan ESP bilan yo‘naltirish esa\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: Zarrachalar bilan yo‘naltirish strukturani tiklaydi, ularning rekonstruksiya qilingan ESP bilan yo‘naltirish esa muvaffaqiyatsizlikka uchraydi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm: Zarrachalar bilan yo‘naltirish strukturani tiklaydi, ularning rekonstruksiya qilingan ESP bilan yo‘naltirish esa muvaffaqiyatsizlikka uchraydi. SNR 0,005 da 500 ta zarrachadan sintetik 8U4E (3304 qoldiq) bo‘yicha ab initio xulosa. Kulrang sirt — bu taxminiy pozalarda ushbu zarrachalardan rekonstruksiya qilingan konsensus zichligi, raqamlar esa depozit qilingan modelga nisbatan Cα RMSD. (A) Depozit qilingan model. (B) AlphaFold3 yig‘ilish domenlarini noto‘g‘ri joylashtiradi. (C) ESP yo‘nalishi xuddi shu Pairformer holatini xuddi shu zarrachalar, pozalar va optimizator bilan optimallashtiradi, lekin zarrachalar ehtimolligini konsensus zichligiga nisbatan yo‘qotish funksiyasi bilan almashtiradi va joylashuvni tiklamasdan bashoratni yaxshilaydi. (D) Zarrachalar ehtimolligi bilan yo‘naltirilgan Fold’EM uni AlphaFold3 uchun 0,48 ga nisbatan 0,81 TM-ball bilan tiklaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f3.jpg\" alt=\"3-rasm: Oraliq Pairformer holatini optimallashtirish zarrachalar darajasidagi yo‘nalishni yaxshilaydi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm: Oraliq Pairformer holatini optimallashtirish zarrachalar darajasidagi yo‘nalishni yaxshilaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-rasm: Oraliq Pairformer holatini optimallashtirish zarrachalar darajasidagi yo‘nalishni yaxshilaydi. Biz AlphaFold3 ni xuddi shu zarrachalar ehtimolligi, pozalar va zarrachalar to‘plamlari bilan boshqarishning uchta usulini solishtiramiz: Fold’EM, oraliq Pairformer H holatini optimallashtiradi va yangilanishlarni yakuniy Pairformer bloklari orqali o‘tkazadi; IT-Opt (Maddipatla va boshq., 2026a), izotropik aprior taqsimot ostida terminal Z joylashtirishni (embedding) optimallashtiradi; va teskari diffuziya jarayonining koordinata fazosida yo‘naltirish (Maddipatla va boshq., 2026b). Qatorlar: SNR 0,005 da ma’lum pozalar bilan A2 jadvalidan sintetik 8U4B va 9UGB, 250 va 1000 ta zarrachadan foydalangan holda. Ustunlar: depozit qilingan PDB modeliga nisbatan Cα-RMSD (↓, logarifmik shkala) va TM-ball (↑); uzuq chiziq AlphaFold3 bashoratini belgilaydi. Ikkala nishonda ham Fold’EM ikkala alternativadan sezilarli darajada ustun turadi va depozit qilingan model bilan deyarli atom darajasidagi moslikka erishadi; H ni optimallashtirish orqali induksiya qilingan o‘rganilgan geometriya shu tariqa past SNR da va katta yig‘ilishlarda zarrachalar darajasidagi yo‘nalishni barqaror saqlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f5.jpg\" alt=\"5-rasm: Fold’EM 9UGB/9UGC sintetik aralashmasining ikkala holatini ham ma’lum pozalar bilan har bir holat uchun 250 ta z\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm: Fold’EM 9UGB/9UGC sintetik aralashmasining ikkala holatini ham ma’lum pozalar bilan har bir holat uchun 250 ta zarrachadan va ab initio 500 ta zarrachadan hal qiladi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-rasm: Fold’EM 9UGB/9UGC sintetik aralashmasining ikkala holatini ham ma’lum pozalar bilan har bir holat uchun 250 ta zarrachadan va ab initio 500 ta zarrachadan hal qiladi. Pma1 — xamirturushning plazmatik proton nasosi, P-turdagi ATPaza, uning sitozolik A-, N- va P-domenlari katalitik sikl davomida qayta joylashadi; 9UGB faollashtirilgan (E2P) holat, 9UGC esa avtoingibirlangan holatdir. Zarrachalar Cα RMSD bo‘yicha taxminan 9 Å farq qiladigan ikkita depozit qilingan konformatsiyadan renderlangan va SNR 0,005 da teng nisbatda aralashtirilgan. Har bir panelda 9UGB chapda, 9UGC esa o‘ngda. (A) AlphaFold3 (ko‘k) depozit qilingan modellar (kulrang) ustida hech qaysi holatni tiklamaydi (TM-ball 0,70 va 0,66): transmembran domeni to‘g‘ri bashorat qilingan va xatolik sitozolik domenlar bilan cheklangan, ularning joylashuvi sikl holatiga bog‘liq. (B) Ma’lum pozalar bilan Fold’EM (qizil) 1000 ta zarrachadan iborat aralash stekdan (har bir holat uchun 500 ta) ikkalasini ham hal qiladi. (C) Fold’EM ab initio 2000 ta zarrachadan (har bir holat uchun 1000 ta) ikkalasini ham hal qiladi. (D) Har bir holatning vakillik zarrachalari. (E, F) 9UGB (E) va 9UGC (F) uchun har bir holatdagi zarrachalar soniga qarab FSC ruxsati (yuqorida) va depozit qilingan modelga nisbatan TM-ball (pastda); to‘ldirilgan markerlar ma’lum pozalarni, bo‘sh markerlar ab initio ni bildiradi, uzuq kulrang chiziq depozit qilingan modelning ruxsati, nuqtali ko‘k chiziq esa AlphaFold3 bashoratidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f6.jpg\" alt=\"6-rasm: Fold’EM 0,5% ma’lum pozitsiyali va 5% ab initio zarralardan UvrA–DNK konformatsiyalarini aniqlaydi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm: Fold’EM 0,5% ma’lum pozitsiyali va 5% ab initio zarralardan UvrA–DNK konformatsiyalarini aniqlaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;6-rasm: Fold’EM 0,5% ma’lum pozitsiyali va 5% ab initio zarralardan UvrA–DNK konformatsiyalarini aniqlaydi. EMPIAR-13396 tarkibida abazit saytiga ega DNK bilan bog‘langan UvrA ning ikki holati mavjud (PDB 9GXQ/9GXR); shikastlanishni aniqlash Y62/Q65/F66 xanjarini dupleksga kiritishni o‘z ichiga oladi. (A) AlphaFold3 9GXR ni tiklaydi, lekin 9GXQ ni emas (TM-ball 0,734). (B, C) Fold’EM har bir holat uchun 1000 ta ma’lum pozitsiyali va 10 000 ta ab initio zarralardan ikkala holatni ham aniqlaydi (chapda: 9GXQ, o‘ngda: 9GXR). (D) Vakillik zarralari. (E) FSC ning har bir holat uchun zarralar soniga nisbati (to‘ldirilgan: ma’lum pozitsiyalar; ochiq: ab initio). Ma’lum pozitsiyalar bilan Fold’EM har bir holat uchun 1000 ta zarradan 3,1/3,0 Å aniqlikka erishadi; ab initio usulida 9GXR uchun 3,0 Å va 9GXQ uchun 4,6 Å aniqlikka erishadi, RELION va cryoDRGN-AI esa 8 Å dan yuqori qoladi. (F) Deponiyalangan modellarga nisbatan TM-ball. (G) AlphaFold3 to‘liq juftlashgan dupleksni saqlaydi, Fold’EM esa xanjar kiritilishi va buzilgan DNKni tiklaydi, lekin tashqariga burilgan nukleotidni emas, chunki shikastlanish har ikkala modelga yaxlit DNK sifatida taqdim etilgan. Ruxsat (Å; FSC = 0,143).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f7.jpg\" alt=\"7-rasm: B-RECOVAR zarralarni konformatsion holatlarga RECOVAR va cryoDRGN ga qaraganda kamroq zarrachalar sonida aniqroq\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-rasm: B-RECOVAR zarralarni konformatsion holatlarga RECOVAR va cryoDRGN ga qaraganda kamroq zarrachalar sonida aniqroq va ishonchliroq taqsimlaydi, uning ishonchlilik ko‘rsatkichi esa taqsimotlarni ishonchliligiga qarab tartiblaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;7-rasm: B-RECOVAR zarralarni konformatsion holatlarga RECOVAR va cryoDRGN ga qaraganda kamroq zarrachalar sonida aniqroq va ishonchliroq taqsimlaydi, uning ishonchlilik ko‘rsatkichi esa taqsimotlarni ishonchliligiga qarab tartiblaydi. UvrA oqsil-DNK kompleksi (EMPIAR-13396, 9GXQ va 9GXR) bo‘yicha yorliqsiz sinf tayinlash, deponiyalangan yorliqlarga nisbatan baholangan. (A) Har bir holat uchun zarralar soniga qarab aniqlik, 250 dan 5000 gacha, ya’ni har bir holat uchun deponiyalangan zarralarning 0,13–2,6%. Qutilar B-RECOVAR va RECOVAR uchun umumiy bo‘lgan har bir o‘lcham uchun o‘nta tasodifiy tanlovni jamlaydi; uchburchaklar cryoDRGN ni belgilaydi. RECOVAR baholovchisi bunday namuna o‘lchamlarida yomon ishlaydi va uning aniqligi bir xil o‘lchamdagi tanlovlar orasida tasodifiydan deyarli mukammalgacha o‘zgaradi; B-RECOVAR zarralar soni bo‘yicha undan ortda qoladi, lekin 500 ta zarradan boshlab aniqroq va barqarorroq, cryoDRGN esa butun jarayon davomida B-RECOVAR dan past qoladi. (B) B-RECOVAR ning ishonchlilik ko‘rsatkichi κk bo‘yicha tabaqalashtirilgan aniqligi, ansambl ovoz berishning normallashtirilgan chegarasi (D.4-ilova). Har bir ustundagi foiz – bu qutidagi zarralar ulushi; uzluksiz chiziq barcha zarralar bo‘yicha aniqlik, uzuq chiziq esa tasodifiy aniqlikdir. Aniqlik ishonchlilik bilan birga monoton ortadi, shuning uchun ko‘rsatkich zarralarni yorliq ishonchliligiga qarab tartiblaydi; Fold’EM ushbu tartibdan har bir ansambl a’zosini o‘z zarralarining ishonchli yarmi bilan boshqarish uchun foydalanadi (A26-jadval). (C, D) Har bir holat uchun 1000 ta zarrada baholovchini ablatsiya qilish. Asosiy baholovchi – bu konsensusdan ayirilgan qoldiqlarga bir darajali moslashuv, shovqin tuzatishsiz bir o‘lchovli RECOVAR moslashuvi bo‘lib, u modani erituvchi niqobi bilan cheklash, yorliqlarni o‘zaro tekshirilgan aniqlashtirish va zarralar kichik namunalari, chastota diapazonlari va initsializatsiyalar bo‘yicha replikalarni ansambllash orqali yaxshilanadi. (C) Har bir bosqichning aniqligi, takroriy tanlovlar bo‘yicha xatolik chiziqlari bilan. (D) Har bir bosqichda har bir zarraning sinf bahosi taqsimoti, ularning d′ ajralishi bilan, ya’ni birlashtirilgan standart og‘ish birliklarida ikki o‘rtacha qiymatning farqi. Har bir qadam holatlar o‘rtasidagi ajralishni kengaytiradi va ansambl eng katta yutuqni ta’minlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f8.jpg\" alt=\"8-rasm: Fold’EM IgG antitanasi kompleksining uzluksiz geterogenligini aniqlaydi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-rasm: Fold’EM IgG antitanasi kompleksining uzluksiz geterogenligini aniqlaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;8-rasm: Fold’EM IgG antitanasi kompleksining uzluksiz geterogenligini aniqlaydi. (A) Ansambllar sifatida 100 ta CryoBench IgG-1D sintetik modeli ko‘rsatilgan, ular ilgak burchagi bo‘yicha ranglangan; va (B) B-RECOVAR zarrachalar klassifikatsiyasi bilan Fold’EM tomonidan tiklangan mos tuzilmalar. Kichik rasmda optimallashtirilgan Pairformer holatlarining ikkita asosiy komponenti tasvirlangan, ular B-RECOVAR zarrachalar joylashuvi ustiga qo‘yilgan. (C) TM-ball va (D) Fourier NCC uchta konformatsion koordinata uchun ilgak burchagi funksiyasi sifatida chizilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f9.jpg\" alt=\"9-rasm: Optimallashtirilgan Pairformer holatlari barcha uchta konformatsion koordinata uchun ilgak burchagi tartibini sa\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;9-rasm: Optimallashtirilgan Pairformer holatlari barcha uchta konformatsion koordinata uchun ilgak burchagi tartibini saqlaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;9-rasm: Optimallashtirilgan Pairformer holatlari barcha uchta konformatsion koordinata uchun ilgak burchagi tartibini saqlaydi. Biz uchta zarracha klassifikatorining har biri uchun geometriya va yaratilgan tuzilmalarni ko‘rsatamiz: cryoDRGN, RECOVAR va B-RECOVAR. Har bir panelning chap tomonida: optimallashtirilgan Pairformer holatlarining ikkita asosiy komponenti, sakkizta langar katta nuqtalar sifatida va interpolyatsiya qilingan holatlar kichik nuqtalar sifatida, bir xil tekislikka o‘tkazilgan tegishli usulning har bir zarracha koordinatalari ustiga qo‘yilgan; barchasi ranglar g‘ildiragida ko‘rsatilganidek, ular ifodalovchi holatning ilgak burchagi bo‘yicha ranglangan. Har bir panelning o‘ng tomonida: interpolyatsiya qilingan holatlardan dekodlangan 10 ta tuzilmaning kichik to‘plami, antitananing qat’iy tanasi ustiga qo‘yilgan va ilgak burchagi bo‘yicha ranglangan (yuqorida), va Fab ning ilgak atrofida harakatlanishini ko‘rsatish uchun oq rangda (pastda). Barcha uchta holatda ilgak burchagi bo‘yicha tartiblangan langarlar tasvirda oddiy yopiq halqani hosil qiladi va dekodlangan tuzilmalar Fab ning to‘liq aylanishini kuzatib boradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-fS1.jpg\" alt=\"Rasm S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"jadvallar\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#jadvallar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Jadvallar&lt;/span&gt;&lt;/a&gt;Jadvallar&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 3.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-tT3.jpg\" alt=\"Jadval 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 4.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-tT4.jpg\" alt=\"Jadval 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 6.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-tT6.jpg\" alt=\"Jadval 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 7.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-tT7.jpg\" alt=\"Jadval 7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 10.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-part
