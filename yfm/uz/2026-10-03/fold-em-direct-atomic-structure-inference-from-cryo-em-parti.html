        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"262\" cy=\"137\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"518\" cy=\"260\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · BIOPHYSICS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Oqsil tuzilishini yuzlab&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;marta kamroq ma'lumot bilan&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;aniqlash&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f1.jpg\" alt=\"1-rasm: Fold’EM atom tuzilmalarini to‘g‘ridan-to‘g‘ri siyrak krio-EM zarrachalari tasvirlaridan chiqaradi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Fold’EM atom tuzilmalarini to‘g‘ridan-to‘g‘ri siyrak krio-EM zarrachalari tasvirlaridan chiqaradi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: Fold’EM atom tuzilmalarini to‘g‘ridan-to‘g‘ri siyrak krio-EM zarrachalari tasvirlaridan chiqaradi. (A) Fold’EM strukturaviy xulosani poza va sinfni aniqlashtirish bilan navbatma-navbat bajaradi. (B) Zarrachalar dalillari oraliq Pairformer H holatlariga qayta tarqaladi va AlphaFold3 diffuziyasidan oldin qolgan Pairformer bloklari orqali eksperimental yangilanishlarni filtrlaydi. (C) Integrin–BIIG2 Fab kompleksi (PDB 9B9J) uchun AlphaFold3 alohida komponentlarni bashorat qiladi, lekin Fabni noto‘g‘ri bog‘lanish joyiga joylashtiradi. (D) Ab initio Fold’EM bog‘langan kompleks va epitopni atigi 1000 ta zarrachadan — depozit qilingan rekonstruksiya uchun ishlatilganlarning 0,26% — 2,49 Å RMSD, 0,956 TM-ball va 3,52 Å FSC ruxsati bilan tiklaydi (depozit qilingan xarita: 2,6 Å).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;An'anaviy krioelektron mikroskopiya sifatli 3D xarita yaratish uchun minglab molekula tasvirlarini talab qiladi. Yangi Fold'EM usuli mikroskopiya ma'lumotlarini oqsil tuzilishini bashorat qiluvchi modellar bilan to'g'ridan-to'g'ri bog'laydi. Bu yondashuv odatdagidan ancha kam ma'lumot bilan molekulyar tuzilishni aniqlashga imkon beradi. Texnologiya ayniqsa oqsillarning kam uchraydigan va beqaror holatlarini o'rganishda juda samarali.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Fold'EM krioelektron mikroskopiyada 3D zichlikni rekonstruksiya qilish bosqichini olib tashlaydi.&lt;/li&gt;\n&lt;li&gt;Usul shovqinli tasvirlarni talqin qilish uchun AlphaFold3 modellaridan foydalanadi.&lt;/li&gt;\n&lt;li&gt;Strukturani aniqlash uchun odatdagidan 20–1000 barobar kamroq zarracha yetarli.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;An'anaviy krioelektron mikroskopiya (cryo-EM) jarayoni minglab shovqinli tasvirlardan elektrostatik potensial (ESP) xaritasini rekonstruksiya qilishni va unga atom modelini moslashtirishni nazarda tutadi. Fold'EM usuli oraliq zichlikni rekonstruksiya qilish bosqichini chetlab o'tib, AlphaFold3 kabi generativ modellardan olingan strukturaviy bilimlarni to'g'ridan-to'g'ri zarrachalar tasvirini qayta ishlash jarayoniga integratsiya qiladi. Mualliflar AlphaFold3 tarkibidagi Pairformer blokini qismlarga ajratib, oraliq H holatini optimallashtirish orqali eksperimental ma'lumotlarni neyron tarmoq qatlamlaridan o'tkazishga muvaffaq bo'lishdi.&lt;/p&gt;\n&lt;p&gt;Tadqiqotchilar ushbu usulni sintetik va eksperimental ma'lumotlar to'plamlarida sinab ko'rishdi. Zarrachalarning yo'nalishi ma'lum bo'lganda, algoritmi standart ma'lumotlarning atigi 0,1% qismi bilan yetarli aniqlikka erishadi. Zarrachalarning yo'nalishi va konformatsiyasi noma'lum bo'lgan ab initio rejimida esa, usul klassik rekonstruksiya uchun zarur bo'lgan zarrachalarning atigi 3–5% qismidan foydalanib, aniq natijalar beradi. Bu heterogen namunalardagi turli konformatsion holatlarni alohida xaritalar qurmasdan ajratib olish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ish preprint shaklida taqdim etilgan va turli biologik namunalar bilan mustaqil tekshiruvni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Krio-elektron mikroskopiya (cryo-EM) biomolekulalar tuzilishini aniqlashda keng qo‘llaniladigan usulga aylandi. An'anaviy hisoblash jarayoni ko‘plab zarracha tasvirlarini birlashtirib, elektrostatik potensial (ESP) xaritasini qayta tiklaydi va keyin unga atom modelini moslashtiradi. Bu jarayon yuqori namunaviy murakkablikka ega bo‘lib, ko‘p sonli zarracha tasvirlarini talab qiladi, bu esa ayniqsa strukturaviy jihatdan geterogen namunalar uchun tuzilmani aniqlashni qimmat va past samarali qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Krio-elektron mikroskopiya (cryo-EM) — muzlatilgan biologik namunalarni elektron nurlar yordamida atom darajasida tasvirlash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mualliflar Fold’EM tizimini taqdim etadilar. Bu usul oqsil tuzilishini bashorat qiluvchi generativ modellardan olingan ma’lumotlarni to‘g‘ridan-to‘g‘ri cryo-EM zarracha tasvirlari bilan birlashtiradi. Fold’EM oraliq zichlik xaritasini qayta tiklash va unga qarshi model qurish bosqichlarini chetlab o‘tib, oz sonli zarracha tasvirlaridan atom modellarini aniqlash imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Fold’EM zichlik xaritasini qayta tiklash bosqichini o‘tkazib yuborib, kam sonli tasvirlar asosida aniq atom tuzilmalarini tiklaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Sintetik benchmarklar va eksperimental cryo-EM ma’lumotlarida Fold’EM ham ma’lum zarracha yo‘nalishlarida, ham yo‘nalishlar tuzilma bilan birgalikda aniqlanadigan ab initio rejimida aniq atom tuzilmalarini tiklaydi. Geterogen ma’lumotlar to‘plamida Fold’EM har bir holat uchun alohida xarita qurmasdan, aralash populyatsiyalardan turli konformatsion holatlarni ajratib ko‘rsatadi. Bu natijalar kam namunali rejimda tuzilmani aniqlash va kam uchraydigan konformatsion holatlarni bevosita zarrachalardan tavsiflash uchun yangi yo‘llarni ochadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Usulning samaradorligi turli xil biologik tizimlarda kengroq tekshirilishi kerak.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"yagona-zarracha-krioelektron-mikroskopiyasi-imkoniyatlar-va-cheklovlar\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#yagona-zarracha-krioelektron-mikroskopiyasi-imkoniyatlar-va-cheklovlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yagona zarracha krioelektron mikroskopiyasi: imkoniyatlar va cheklovlar&lt;/span&gt;&lt;/a&gt;Yagona zarracha krioelektron mikroskopiyasi: imkoniyatlar va cheklovlar&lt;/h4&gt;\n&lt;p&gt;Yagona zarracha krioelektron mikroskopiyasi (cryo-EM) kristallanishsiz yirik makromolekulyar majmualarning yuqori aniqlikdagi tuzilishini aniqlash imkonini berib, strukturaviy biologiyani tubdan o'zgartirdi. Alohida molekulalarni turli konformatsiyalarda tasvirlash qobiliyati biologik funksiyalarni boshqaruvchi strukturaviy o'zgarishlarni tushunishga yo'l ochadi. Biroq, birlamchi o'lchovlar juda shovqinli: radiatsion shikastlanish har bir zarrachaga qo'llaniladigan elektron dozasini cheklaydi, bu esa alohida tasvirlarni to'g'ridan-to'g'ri talqin qilish uchun yaroqsiz qiladi. Elektrostatik potensial (ESP) xaritasini olish uchun ko'p sonli kuzatuvlarni tekislash va birlashtirish talab etiladi, shundan so'ng atom modelini qurish bosqichi keladi, bu esa mahalliy aniqlik past bo'lganda qiyin bo'lib qoladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Cryo-EM usuli o'rtacha qiymatlarni hisoblash uchun juda katta ma'lumotlar to'plamini talab qiladi, bu esa kam uchraydigan yoki beqaror oqsil konformatsiyalarini o'rganishni cheklaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"heterogenlik-muammosi-va-malumotlar-tanqisligi\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#heterogenlik-muammosi-va-malumotlar-tanqisligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Heterogenlik muammosi va ma'lumotlar tanqisligi&lt;/span&gt;&lt;/a&gt;Heterogenlik muammosi va ma'lumotlar tanqisligi&lt;/h4&gt;\n&lt;p&gt;Kogerent o'rtacha qiymatlarni olish zarurati fazoviy aniqlik va biologik to'liqlik o'rtasida ziddiyatni keltirib chiqaradi. Turli konformatsiyalardagi zarrachalarni birlashtirish strukturaviy xususiyatlarni xiralashtiradi, ularni bir jinsli guruhlarga ajratish esa har bir holat uchun kuzatuvlar sonini kamaytiradi. Kam uchraydigan va o'tkinchi holatlarni qayta tiklash qiyin, chunki ular ko'proq uchraydigan konformatsiyalar bilan aralashib ketishi yoki tanlash jarayonida chiqarib tashlanishi mumkin. Mavjud heterogenlikni modellashtirish usullari konformatsion o'zgaruvchanlikni aniqlashga imkon beradi, ammo ular zarrachalarni dastlabki tanlash va tekislash sifatiga bog'liq. Shunday qilib, katta miqdordagi zarrachalarga bo'lgan fundamental ehtiyoj hal qilinmaganicha qolmoqda.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Cryo-EM rekonstruksiyasi — bu minglab shovqinli 2D-proyeksiyalarni 3D-modelga aylantirish jarayoni bo'lib, «o'rtacha qiymat» shovqinni bostirishga yordam beradi, lekin zarrachalarning yuqori bir jinsliligini talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"strukturaviy-aprior-bilimlarni-integratsiyalash\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#strukturaviy-aprior-bilimlarni-integratsiyalash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Strukturaviy aprior bilimlarni integratsiyalash&lt;/span&gt;&lt;/a&gt;Strukturaviy aprior bilimlarni integratsiyalash&lt;/h4&gt;\n&lt;p&gt;An'anaviy rekonstruksiya usullari oqsillar tuzilishi haqidagi umumiy bilimlardan kam foydalanadi. RELION'dagi Blush kabi neyron tarmoqlar yoki AlphaFold kabi bashorat modellari strukturaviy bilimlarni kiritish signal kuchsiz bo'lganda rekonstruksiya sifatini yaxshilashini ko'rsatadi. Biroq, zamonaviy yondashuvlar bu bilimlarni rekonstruksiyadan keyin qo'llaydi, bu esa katta miqdordagi zarrachalarga bog'liqlikni saqlab qoladi. Ushbu ishda biz quyidagi savolni o'rtaga tashlaymiz: strukturaviy aprior bilimlarni to'g'ridan-to'g'ri zarracha darajasida kiritib, oraliq yuqori aniqlikdagi rekonstruksiyasiz siyrak ma'lumotlardan atom darajasida xulosa chiqarish mumkinmi?&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Taklif etilayotgan yondashuv zarrachalar soni bo'yicha cheklovlarni yengishga qaratilgan, ammo usulning samaradorligi signal-shovqin nisbati juda past bo'lgan real eksperimental ma'lumotlarda tekshirilishi kerak.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;Biz Fold’EM tizimini taqdim etdik — bu kriyo-EM zarrachalar tasvirlaridan atom tuzilmalarini bevosita aniqlash uchun mo‘ljallangan tizim. U zichlikni rekonstruksiya qilish va model qurish bosqichlarini chetlab o‘tib, AlphaFold3 ishini zarrachalar darajasidagi dalillar bilan boshqaradi. Biz zichlikni moslashtirish faqat eksperimental metrikalar ostida zarrachalar ehtimolligini takrorlashini va noaniq pozitsiya yoki sinf holatida konsensus zichligi yetarli statistika bo‘lmasligini ko‘rsatdik. Pairformer’ning yakuniy emas, balki oraliq holatlarini optimallashtirish boshqaruvni kuchaytiruvchi geometriyani shakllantiradi. Fold’EM an’anaviy rekonstruksiya usullariga nisbatan 1% dan kamroq zarrachalar bilan aniq tuzilmalarni tiklaydi (ab initio uchun 3%, geterogen namunalar uchun 5%). Bu usul Integrin α5β1–BIIG2 bog‘lanish joyi yoki UvrA’dagi buzilgan DNK kabi odatiy bashoratlarda ko‘rinmaydigan detallarni tiklashga imkon beradi. Zarrachalar fazosidagi konformatsion tashkilot AlphaFold tasvirida aks etadi, bu esa uzluksiz harakatlarni bir nechta tayanch holatlar orqali ifodalash imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Fold’EM AlphaFold3’ning oldindan mavjud bilimlari va eksperimental ma’lumotlarni birlashtirib, an’anaviy usullarga qaraganda 20–100 barobar kamroq zarrachalar bilan tuzilmani aniqlashga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Cheklovlar: Fold’EM hali kriyo-EM jarayonini to‘liq almashtira olmaydi: kiruvchi ma’lumotlar CTF parametrlari ma’lum bo‘lgan saralangan zarrachalardir, ab initio xulosa esa boshlang‘ich pozitsiyalarning aniqligiga tayanadi. Glikanlar, ligandlar yoki moslashuvchan hududlar kabi modelda yo‘q komponentlar tushuntirib bo‘lmaydigan signal sifatida qabul qilinadi. Kelgusida tozalanmagan zarrachalar bilan ishlash va lokal detallarni aniqlashtirish ustida ishlanadi.&lt;/p&gt;\n&lt;h4 id=\"ai-foydalanish-bayonoti\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#ai-foydalanish-bayonoti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AI foydalanish bayonoti&lt;/span&gt;&lt;/a&gt;AI foydalanish bayonoti&lt;/h4&gt;\n&lt;p&gt;Qo‘lyozmani tayyorlashda ChatGPT va Claude kabi generativ AI vositalaridan tilni tahrirlash, tuzilmani yaxshilash, matematik hisob-kitoblarni tekshirish va kod yozishda foydalanildi. Barcha ilmiy xulosalar va natijalar mualliflar tomonidan tekshirilgan va ular maqola mazmuni uchun to‘liq javobgardirlar.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval S3.&lt;/strong&gt; Eksperimental krio-EM ma'lumotlar to'plamlari uchun Furye qobig'i korrelyatsiyasi (FSC) = 0.143 (↓, Å) bo'yicha aniqlik&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Usul&lt;/th&gt;\n&lt;th&gt;1/500&lt;/th&gt;\n&lt;th&gt;1/250&lt;/th&gt;\n&lt;th&gt;1/100&lt;/th&gt;\n&lt;th&gt;1/50&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Fold’EM&lt;/td&gt;\n&lt;td&gt;3.73&lt;/td&gt;\n&lt;td&gt;3.35&lt;/td&gt;\n&lt;td&gt;3.50&lt;/td&gt;\n&lt;td&gt;3.46&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;cryoDRGN&lt;/td&gt;\n&lt;td&gt;2.85&lt;/td&gt;\n&lt;td&gt;2.73&lt;/td&gt;\n&lt;td&gt;2.73&lt;/td&gt;\n&lt;td&gt;2.75&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;RELION&lt;/td&gt;\n&lt;td&gt;6.63&lt;/td&gt;\n&lt;td&gt;6.63&lt;/td&gt;\n&lt;td&gt;7.06&lt;/td&gt;\n&lt;td&gt;6.13&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;AlphaFold3&lt;/td&gt;\n&lt;td&gt;3.02&lt;/td&gt;\n&lt;td&gt;3.95&lt;/td&gt;\n&lt;td&gt;3.09&lt;/td&gt;\n&lt;td&gt;3.36&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;PDB&lt;/td&gt;\n&lt;td&gt;3.20&lt;/td&gt;\n&lt;td&gt;3.09&lt;/td&gt;\n&lt;td&gt;3.26&lt;/td&gt;\n&lt;td&gt;3.45&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Fold’EM, AlphaFold3 va PDB tuzilmalari uchun FSC phenix.model_map yordamida hisoblanadi. Asl ma'lumotlar to'plamining turli ulushlaridagi (ma'lum pozitsiyalarga ega 500 ta zarracha) barcha bazaviy ko'rsatkichlar depozit qilingan EMD xaritasiga nisbatan baholanadi. Qalin shrift bilan eng yaxshi natijalar belgilangan (PDB bundan mustasno).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 1.&lt;/strong&gt; Turli suyultirish koeffitsientlarida sifatni baholash natijalari&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Parametr&lt;/th&gt;\n&lt;th&gt;1/1000&lt;/th&gt;\n&lt;th&gt;1/500&lt;/th&gt;\n&lt;th&gt;1/250&lt;/th&gt;\n&lt;th&gt;1/100&lt;/th&gt;\n&lt;th&gt;1/50&lt;/th&gt;\n&lt;th&gt;AlphaFold3&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Qiymat 1&lt;/td&gt;\n&lt;td&gt;1.96&lt;/td&gt;\n&lt;td&gt;1.97&lt;/td&gt;\n&lt;td&gt;1.88&lt;/td&gt;\n&lt;td&gt;1.92&lt;/td&gt;\n&lt;td&gt;1.88&lt;/td&gt;\n&lt;td&gt;21.90&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Qiymat 2&lt;/td&gt;\n&lt;td&gt;1.90&lt;/td&gt;\n&lt;td&gt;1.77&lt;/td&gt;\n&lt;td&gt;1.71&lt;/td&gt;\n&lt;td&gt;1.74&lt;/td&gt;\n&lt;td&gt;1.71&lt;/td&gt;\n&lt;td&gt;3.87&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Qiymat 3&lt;/td&gt;\n&lt;td&gt;4.340&lt;/td&gt;\n&lt;td&gt;4.989&lt;/td&gt;\n&lt;td&gt;4.597&lt;/td&gt;\n&lt;td&gt;5.349&lt;/td&gt;\n&lt;td&gt;4.174&lt;/td&gt;\n&lt;td&gt;33.16&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Qiymat 4&lt;/td&gt;\n&lt;td&gt;2.20&lt;/td&gt;\n&lt;td&gt;1.99&lt;/td&gt;\n&lt;td&gt;2.48&lt;/td&gt;\n&lt;td&gt;2.02&lt;/td&gt;\n&lt;td&gt;2.09&lt;/td&gt;\n&lt;td&gt;5.96&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Qiymat 5&lt;/td&gt;\n&lt;td&gt;1.87&lt;/td&gt;\n&lt;td&gt;1.39&lt;/td&gt;\n&lt;td&gt;1.23&lt;/td&gt;\n&lt;td&gt;1.35&lt;/td&gt;\n&lt;td&gt;1.47&lt;/td&gt;\n&lt;td&gt;2.01&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Qiymat 6&lt;/td&gt;\n&lt;td&gt;0.969&lt;/td&gt;\n&lt;td&gt;0.970&lt;/td&gt;\n&lt;td&gt;0.972&lt;/td&gt;\n&lt;td&gt;0.971&lt;/td&gt;\n&lt;td&gt;0.972&lt;/td&gt;\n&lt;td&gt;0.776&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Qiymat 7&lt;/td&gt;\n&lt;td&gt;0.972&lt;/td&gt;\n&lt;td&gt;0.979&lt;/td&gt;\n&lt;td&gt;0 &gt;0.962&lt;/td&gt;\n&lt;td&gt;0.985&lt;/td&gt;\n&lt;td&gt;0.984&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Qator 6&lt;/td&gt;\n&lt;td&gt;0.9906&lt;/td&gt;\n&lt;td&gt;0.9908&lt;/td&gt;\n&lt;td&gt;0.9862&lt;/td&gt;\n&lt;td&gt;0.9866&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Qator 7&lt;/td&gt;\n&lt;td&gt;0.967&lt;/td&gt;\n&lt;td&gt;0.967&lt;/td&gt;\n&lt;td&gt;0.987&lt;/td&gt;\n&lt;td&gt;0.983&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Qator 8&lt;/td&gt;\n&lt;td&gt;0.9923&lt;/td&gt;\n&lt;td&gt;0.9909&lt;/td&gt;\n&lt;td&gt;0.9828&lt;/td&gt;\n&lt;td&gt;0.9822&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h4 id=\"algoritmlar\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#algoritmlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Algoritmlar&lt;/span&gt;&lt;/a&gt;Algoritmlar&lt;/h4&gt;\n&lt;p&gt;1-algoritm Fold’EM jarayonini tasvirlaydi: bu boshqariladigan teskari diffuziya orqali tuzilmani aniqlash va noaniq parametrlarni (nuisance variables) takomillashtirishni navbatma-navbat bajaradigan koordinatali ko‘tarilish usulidir. 2-algoritm B-RECOVAR qoldiq quyi fazo baholovchisini tasvirlaydi, u ab initio geterogen vazifalar uchun dastlabki sinflarni taqsimlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Teskari diffuziya — tasodifiy shovqindan yuqori sifatli tasvir yoki tuzilmani olish uchun shovqinni bosqichma-bosqich olib tashlash jarayoni.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"oldindan-ishlov-berish\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#oldindan-ishlov-berish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Oldindan ishlov berish&lt;/span&gt;&lt;/a&gt;Oldindan ishlov berish&lt;/h4&gt;\n&lt;p&gt;Sintetik ma'lumotlar to'plami PDB tuzilmalari asosida tayyorlandi. Shovqinsiz zarrachalar Xexpt strukturasini tasvir hosil qilish modeli orqali proyeksiyalash yo'li bilan olindi. Furye sohasida oq Gauss shovqini qo'shildi, bunda &lt;span class=\"yfm-latex\" data-content=\"%5Csigma_%7Bnoise%7D%20%3D%20%20ext%7Bstd%7D(%5Chat%7By%7D)%20%2F%20%5Csqrt%7B%5BSNR%5D(..%2Fconcepts%2Fsubstantia-nigra-pars-reticulata.md)%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; formulasi ishlatildi. Tajribalarda SNR qiymati 0,01 yoki 0,005 qilib belgilandi.&lt;/p&gt;\n&lt;p&gt;Eksperimental ma'lumotlar EMPIAR bazasidan olindi. Jarayon yakuniy STAR fayllaridagi zarrachalarni saralash, yaroqsizlarini chiqarib tashlash, markazlashtirish, 128 × 128 pikselgacha Furye-kesish, fazani to'g'rilash va 0,4 radiusli yumshoq doiraviy niqobni qo'llashni o'z ichiga oldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sintetik ma'lumotlar 0,01–0,005 SNR darajasida tayyorlandi, real ma'lumotlar esa EMPIAR'dan olinib, qat'iy filtrlash va standartlashtirishdan o'tkazildi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"boshlangich-usullar-baselines\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#boshlangich-usullar-baselines\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Boshlang'ich usullar (Baselines)&lt;/span&gt;&lt;/a&gt;Boshlang'ich usullar (Baselines)&lt;/h4&gt;\n&lt;p&gt;Ma'lum pozitsiyalar (poses) bilan ishlashda RELION va CryoDRGN solishtirildi. CryoDRGN treningi zdim=8 va n=50 parametrlari bilan o'tkazildi. RELION'da 60 Å past chastotali tayanch niqob ishlatildi. Ab initio (pozitsiyalarsiz) vazifalarda CryoDRGN-AI (zdim=8, 50 davr) va RELION solishtirildi. RELION ikki bosqichda ishladi: VDAM orqali boshlang'ich model (200 iteratsiya, K=1) va tasodifiy yarimga bo'lish bilan 3D-avtorefaynment. Fold’EM usulida keyingi aniqlashtirish uchun birinchi bosqichdagi pozitsiyalar va xarita ishlatildi. Geterogen to'plamlar avval klasterlandi, so'ngra har bir guruh uchun alohida rekonstruksiya bajarildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ab initio rekonstruksiya — bu zarrachalarning yo'nalishi haqida oldindan ma'lumot bo'lmaganda 3D-strukturani tiklash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Jadval 9.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-tT9.jpg\" alt=\"Jadval 9\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"alphafold3-va-apparat-resurslari\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#alphafold3-va-apparat-resurslari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AlphaFold3 va apparat resurslari&lt;/span&gt;&lt;/a&gt;AlphaFold3 va apparat resurslari&lt;/h4&gt;\n&lt;p&gt;Protenix v1.0.4 (AlphaFold3 implementatsiyasi), xaritalar va pozitsiyalarni baholash uchun RELION 5.0.0 hamda validatsiya uchun Phenix v1.21.2-5419 ishlatildi. Tajribalar NVIDIA H100 va L40S GPU'larida, Debian GNU/Linux 12 tizimida bajarildi.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 11.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-tT11.jpg\" alt=\"Jadval 11\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"toqnashuv-va-boglanish-uzunligi-uchun-jarimalar\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#toqnashuv-va-boglanish-uzunligi-uchun-jarimalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;To'qnashuv va bog'lanish uzunligi uchun jarimalar&lt;/span&gt;&lt;/a&gt;To'qnashuv va bog'lanish uzunligi uchun jarimalar&lt;/h4&gt;\n&lt;p&gt;Strukturalarning fizik jihatdan to'g'riligini ta'minlash uchun regulyarizatorlar qo'llanadi. Bog'lanish uzunligi jarimasi Lbond m atom uchun δbond = 0,2 Å bardoshlik bilan hisoblanadi. To'qnashuv jarimasi Lcollision bog'lanmagan atomlarning bir-biriga kirib ketishini pcollision = 0,4 Å bufer masofasi bilan minimallashtiradi. Ansamblning umumiy ehtimolligi λbond va λcollision jarimalarining yig'indisi orqali aniqlanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Modellarning fizik ishonchliligi bog'lanish uzunligi (0,2 Å bardoshlik) va sterik to'qnashuvlar (0,4 Å bufer) uchun jarimalarni minimallashtirish orqali ta'minlanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Jadval S24.&lt;/strong&gt; EMPIAR-13396 ma'lumotlar to'plamida Fold’EM tuzilmalarini MolProbity baholash&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Kategoriya&lt;/th&gt;\n&lt;th&gt;Ko'rsatkich&lt;/th&gt;\n&lt;th&gt;Qiymat 1&lt;/th&gt;\n&lt;th&gt;Qiymat 2&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Known&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;MolProbity score&lt;/td&gt;\n&lt;td&gt;1.16&lt;/td&gt;\n&lt;td&gt;1.20&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Clashscore&lt;/td&gt;\n&lt;td&gt;1.48&lt;/td&gt;\n&lt;td&gt;1.66&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Ramachandran outliers&lt;/td&gt;\n&lt;td&gt;0.16&lt;/td&gt;\n&lt;td&gt;0.16&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Median MolProbity score (↓), clash score (↓) va Ramachandran outlier (↓) qiymatlari, phenix.molprobity (Williams et al., 2018) yordamida hisoblangan.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"relaksatsiya\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#relaksatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Relaksatsiya&lt;/span&gt;&lt;/a&gt;Relaksatsiya&lt;/h4&gt;\n&lt;p&gt;Qolgan kichik to'qnashuvlarni bartaraf etish uchun strukturalar vakuumda AMBER14 kuch maydoni yordamida relaksatsiyadan o'tkaziladi. Energiya 2,39 kkal/mol chegarasi va 10,0 kkal/mol/Å qattiqlik bilan minimallashtiriladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AMBER14 kuch maydonidan foydalanish geometriyani to'g'rilash uchun zarur, chunki optimizatsiya jarayonida ba'zi kichik sterik ziddiyatlar saqlanib qolishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"metrikalar\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#metrikalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Metrikalar&lt;/span&gt;&lt;/a&gt;Metrikalar&lt;/h4&gt;\n&lt;p&gt;Fold’EM tomonidan yaratilgan strukturalarning aniqligini baholash uchun Cα-atomlari bo‘yicha o‘rtacha kvadratik chetlanish (RMSD) ishlatiladi. Dastlab X struktura Kabsh algoritmi yordamida (Rkabsch va tkabsch) eksperimental Xexpt struktura bilan moslashtiriladi. Keyin RMSDCα = √ (1/NCα) * Σ /Rkabschxi + tkabsch - xexpt i/^2 formulasi hisoblanadi, bu yerda NCα — moslashtirilgan atomlar soni.&lt;/p&gt;\n&lt;p&gt;Global strukturaviy o‘xshashlikni baholash uchun TM-score ishlatiladi, u RMSDga qaraganda lokal chetlanishlarga kamroq sezgir. U TMScore = max(R,t) (1/Lref) * Σ [1 / (1 + (di(R,t)/d0(Lref))^2)] formulasi bilan aniqlanadi, bu yerda Lref — qoldiqlar soni, d0(Lref) = 1.24(Lref-15)^(1/3) - 1.8 Å. TM-score qiymatlari (0, 1] oralig‘ida bo‘lib, katta qiymatlar yuqori o‘xshashlikni bildiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RMSD va TM-score metrikalari modellar aniqligini miqdoriy baholash imkonini beradi: RMSD lokal chetlanishni, TM-score esa global o‘xshashlikni o‘lchaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TM-score — bu oqsil o‘lchamidan qat’i nazar, atomlararo masofani normallashtiruvchi sifat ko‘rsatkichi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Stereokimyoviy sifat phenix.molprobity to‘plami yordamida baholanadi. Biz uchta ko‘rsatkichni keltiramiz: clashscore (1000 atomga to‘g‘ri keladigan sterik to‘qnashuvlar soni), Ramachandran chetlanishlari foizi (ϕ va ψ burchaklari ruxsat etilgan hududdan tashqarida bo‘lgan qoldiqlar) va umumiy MolProbity balli. MolProbity balli qancha past bo‘lsa, model sifati shunchalik yuqori bo‘ladi. Ruxsatni baholash uchun FSC=0.143 mezoni ishlatiladi, u phenix.map_box orqali modelni EMD eksperimental zichlik xaritasi bilan solishtirish uchun hisoblanadi.&lt;/p&gt;\n&lt;h4 id=\"krio-em-tasvir-hosil-qilish-modeli-va-ehtimollik-funksiyasi\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#krio-em-tasvir-hosil-qilish-modeli-va-ehtimollik-funksiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Krio-EM tasvir hosil qilish modeli va ehtimollik funksiyasi&lt;/span&gt;&lt;/a&gt;Krio-EM tasvir hosil qilish modeli va ehtimollik funksiyasi&lt;/h4&gt;\n&lt;p&gt;Zarracha tasviri y uchun X konformatsiyasi va ϕ pozitsiyasi berilganda, logarifmik ehtimollik log p(y / X, ϕ) = log p(y / yc(X, ϕ)) ko‘rinishida yoziladi, bu yerda yc — shovqinsiz simulyatsiya qilingan tasvir.&lt;/p&gt;\n&lt;h4 id=\"tasvir-hosil-qilish-modeli\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#tasvir-hosil-qilish-modeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tasvir hosil qilish modeli&lt;/span&gt;&lt;/a&gt;Tasvir hosil qilish modeli&lt;/h4&gt;\n&lt;p&gt;Atom strukturasi X atom potensiallarining superpozitsiyasi sifatida ifodalanadi: ρX(r) = Σ ρei(r - xi). Furye sohasida molekula potensiali bρX(ξ) elektron sochilish faktorlari fei(∥ξ∥) va fazaviy siljish orqali ifodalanadi. Pϕ proyeksiyalash operatori 3D-potensialni ϕ pozitsiyasiga (R burilish va t siljish) mos tekislikka o‘tkazadi. Markaziy kesim teoremasiga ko‘ra, proyeksiyalash 3D Furye obrazining kesimiga mos keladi. Shovqinsiz tasvir yc Furye sohasida kontrast uzatish funksiyasi (CTF) G(ω) ni qo‘llash orqali hosil bo‘ladi: yc(X, ϕ) = F^-1[G * SϕbρX].&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CTF (Contrast Transfer Function) — elektron mikroskop tomonidan kiritilgan buzilishlarni tavsiflovchi matematik funksiya.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"shovqin-modeli-va-ehtimollik-funksiyasi\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#shovqin-modeli-va-ehtimollik-funksiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Shovqin modeli va ehtimollik funksiyasi&lt;/span&gt;&lt;/a&gt;Shovqin modeli va ehtimollik funksiyasi&lt;/h4&gt;\n&lt;p&gt;Detektor shovqini Puasson taqsimotiga bo'ysunsa-da, qayta ishlangan krio-EM tasvirlari uchun oddiy Puasson modeli mos kelmaydi. Biz shovqinni Furye sohasida qo'shiluvchi Gauss shovqini sifatida modellashtiramiz, bunda har bir koeffitsiyent chastotaga bog'liq σ²(ω) dispersiyaga ega nol o'rtali kompleks Gauss qiymati hisoblanadi. Logarifmik ehtimollik (13)-tenglama bilan ifodalanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;To'g'ridan-to'g'ri optimallashtirish o'rniga, biz masshtabga invariant bo'lgan normallangan o'zaro korrelyatsiyadan foydalanamiz, bu esa kontrast o'zgarishlariga chidamlilikni ta'minlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Amalda biz Lcorr(y, y_c) funksiyasidan foydalanamiz. Bu yondashuv global kontrast farqlarini chetlab o'tib, tasvirning fazaviy tuzilishi va chastotaviy tarkibiga e'tibor qaratishga imkon beradi. &lt;span class=\"yfm-latex\" data-content=\"%5COmega\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; chastota diapazoni fon shovqinlari va ishonchsiz yuqori chastotalarni chiqarib tashlaydi.&lt;/p&gt;\n&lt;h4 id=\"atom-tuzilmasidan-zarracha-tasvirini-renderlash\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#atom-tuzilmasidan-zarracha-tasvirini-renderlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Atom tuzilmasidan zarracha tasvirini renderlash&lt;/span&gt;&lt;/a&gt;Atom tuzilmasidan zarracha tasvirini renderlash&lt;/h4&gt;\n&lt;p&gt;Tasvir shakllanish modeli &lt;span class=\"yfm-latex\" data-content=\"X%20%3D%20%5C%7B(x_i%2C%20e_i)%5C%7D_%7Bi%3D1%7D%5Em\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; atom tuzilmasiga asoslanadi. Har bir atom potensiali Z_i amplitudali va σpx ≈ 0.45 piksel kenglikdagi izotrop Gauss bilan yaqinlashtiriladi. Proyeksiyani hisoblash uchun 3D-setka qurish shart emas: &lt;span class=\"yfm-latex\" data-content=\"%5Cphi%20%3D%20(R%2C%20t)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; poza uchun atomlar 2D-ga proyeksiyalanadi va piksel maydoni bo'yicha integral erf(x) xatolik funksiyasi yordamida analitik ravishda topiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Analitik renderlash 2D-Gauss funksiyalarining ajraluvchanlik xossasidan foydalanib, hisoblash jarayonini sezilarli darajada tezlashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kontrast-uzatish-funksiyasi-ctf\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#kontrast-uzatish-funksiyasi-ctf\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kontrast uzatish funksiyasi (CTF)&lt;/span&gt;&lt;/a&gt;Kontrast uzatish funksiyasi (CTF)&lt;/h4&gt;\n&lt;p&gt;Biz zaif faza yaqinlashuvi doirasida CTF parametrlarini modellashtiramiz. Defokus d_u, d_v va astigmatizm hisobga olingan holda, df(θ) samarali defokus aniqlanadi. CTF fazasi γ(ω) elektron to'lqin uzunligi λ, sferik aberratsiya koeffitsiyenti C_s va faza siljishi &lt;span class=\"yfm-latex\" data-content=\"%5Cphi\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ga bog'liq. G(ω) funksiyasi proyeksiyaning Furye-obraziga qo'llaniladi, faza tuzatilgan ma'lumotlar uchun esa /G(ω)/ moduli ishlatiladi.&lt;/p&gt;\n&lt;h4 id=\"b-recovar-bootstrap-agregatlangan-sinflarni-tayinlash\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#b-recovar-bootstrap-agregatlangan-sinflarni-tayinlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;B-RECOVAR: bootstrap-agregatlangan sinflarni tayinlash&lt;/span&gt;&lt;/a&gt;B-RECOVAR: bootstrap-agregatlangan sinflarni tayinlash&lt;/h4&gt;\n&lt;p&gt;Ab-initio geterogen sharoitlarda algoritm zarralarni sinflarga dastlabki taqsimlashni talab qiladi. CryoDRGN latent koordinatalari yoki RECOVAR kovariatsiyasining asosiy komponentlari kabi standart usullar, har bir sinf uchun zarralar soni kam bo'lganda, shovqin (harakat, defokus, namuna tayyorlash) ta'sirida ishonchsiz bo'lishi mumkin. B-RECOVAR usuli bootstrap-subsamplardan foydalanadigan ansambl yondashuvidir. Har bir iteratsiya regulyarizatsiyalangan teskari proyeksiya orqali past o'lchamli qoldiq fazoni baholaydi, zarracha koeffitsientlarini klasterlaydi va belgilarni o'zaro tekshirish (cross-validation) orqali aniqlaydi. Yakuniy belgilar spektral ovoz berish orqali birlashtiriladi, bunda normallashtirilgan ovoz berish chegarasi zarracha darajasidagi ishonch balli sifatida xizmat qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;B-RECOVAR shovqinni filtrlash va sinfga tegishlilik bo'yicha ishonchni baholash uchun ansambl yondashuvidan foydalanib, zarrachalarni tasniflash ishonchliligini oshiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"model-va-belgilar\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#model-va-belgilar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Model va belgilar&lt;/span&gt;&lt;/a&gt;Model va belgilar&lt;/h4&gt;\n&lt;p&gt;K ta zarracha tasvirlari to'plami ko'rib chiqiladi, ular &lt;span class=\"yfm-latex\" data-content=\"%5Crho_1%2C%20%5Cdots%2C%20%5Crho_n\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; zichliklari va π_j ulushlariga ega n ta konformatsiyalar aralashmasini ifodalaydi. Pozalar &lt;span class=\"yfm-latex\" data-content=\"%5Cphi_k\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; va kontrast uzatish funksiyalari (CTF) G_k konsensus aniqlashdan olingan. Ma'lumotlar &lt;span class=\"yfm-latex\" data-content=\"%5COmega_a\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; Furye qobiqlari bilan cheklangan, bu yerda past chastotalar kontrast uchun, yuqori chastotalar esa shovqin uchun javobgardir. Zarracha k uchun tasvirlash operatori &lt;span class=\"yfm-latex\" data-content=\"A_k%20%3D%20G_k%20S_%7B%5Cphi_k%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; sifatida yoziladi, bunda &lt;span class=\"yfm-latex\" data-content=\"y_k%20%3D%20%5Calpha_k%5E*%20A_k%20%5Crho_%7Bc_k%7D%20%2B%20%5Cepsilon_k\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;h4 id=\"qoldiq-fazo\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#qoldiq-fazo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qoldiq fazo&lt;/span&gt;&lt;/a&gt;Qoldiq fazo&lt;/h4&gt;\n&lt;p&gt;Sinf og'ishlari &lt;span class=\"yfm-latex\" data-content=\"%5Cdelta_j%20%3D%20%5Crho_j%20-%20%5Cbar%7B%5Crho%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; o'lchami q ≤ n-1 bo'lgan fazoni hosil qiladi. Zarracha qoldig'i &lt;span class=\"yfm-latex\" data-content=\"r_k%20%5Capprox%20%5Csum_%7Bm%3D1%7D%5Eq%20b_%7Bcm%7D%20A_k%20U_m%20%2B%20%5Cepsilon'_k\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (14-tenglama) sifatida ifodalanadi. n=2 bo'lganda, fazo &lt;span class=\"yfm-latex\" data-content=\"%5CDelta%5Crho%20%3D%20%5Crho_1%20-%20%5Crho_2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; vektori bilan aniqlanadi. Asos W_m va koeffitsientlar  ildeb_k ni baholash uchun deflyatsiyali niqoblangan eng kichik kvadratlar usuli qo'llaniladi. M niqobi erituvchi hissasini bostiradi va baholash aniqligini oshiradi. Barcha modalar tanlangandan so'ng, koeffitsientlar har bir zarracha uchun birgalikda aniqlanadi va k-means klasterlash qo'llaniladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Deflyatsiyali eng kichik kvadratlar usuli tuzilmaning eng muhim komponentlarini (modalarni) ketma-ket topadi va qolgan signallarni ajratib olish uchun ularni ma'lumotlardan \"ayirib tashlaydi\".&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ozaro-tekshirish-orqali-aniqlashtirish\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#ozaro-tekshirish-orqali-aniqlashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;O'zaro tekshirish orqali aniqlashtirish&lt;/span&gt;&lt;/a&gt;O'zaro tekshirish orqali aniqlashtirish&lt;/h4&gt;\n&lt;p&gt;Har bir iteratsiyada zarralar J va J' ikkita guruhga (fold) bo'linadi. Har bir sinf uchun bitta fold bo'yicha $ ilde{\\rho}_j^F$ rekonstruksiyasi quriladi, so'ngra boshqa folddagi zarralar &lt;span class=\"yfm-latex\" data-content=\"s_%7Bkj%7D%20%3D%20L_%7Bcorr%7D(%5Ccheck%7By%7D_k%2C%20A_k%20%20ilde%7B%5Crho%7D_j%5E%7BF%5Ec%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; korrelyatsiyasi orqali baholanadi (15-tenglama). Fold ichidagi baholarni markazlashtirish rekonstruksiya aniqligidagi farqlarni kompensatsiya qiladi. Bu yondashuv o'z-o'zini korrelyatsiyani istisno qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Usul har bir sinf uchun ikkala foldda yetarli miqdordagi zarralarni talab qiladi, aks holda o'zaro tekshirish beqaror natijalarga olib kelishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ansamblli-ovoz-berish\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#ansamblli-ovoz-berish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ansamblli ovoz berish&lt;/span&gt;&lt;/a&gt;Ansamblli ovoz berish&lt;/h4&gt;\n&lt;p&gt;Konformatsiya uchun zarrachalar soni kam bo'lganda, qoldiq pastki fazoda moslashtirish beqaror bo'lishi mumkin (hatto n=2 bo'lganda ham), chunki tasodifiy initsializatsiyalar shovqin yo'nalishini strukturaviy signal deb qabul qilishi mumkin. Buni bartaraf etish uchun 2-algoritmning B ta randomizatsiyalangan replikasi qo'llaniladi, ularning har biri zarrachalar to'plami I_b, tanlangan chastota diapazoni va mustaqil initsializatsiyadan foydalanadi.  ildec^(b)_k sinf belgilari Vengriya algoritmi yordamida moslashtiriladi.&lt;/p&gt;\n&lt;p&gt;n=2 uchun muvozanatlangan aniqlik &lt;span class=\"yfm-latex\" data-content=\"%5Cpsi_b\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; va ovozlar kovariatsiyasi (16)-tenglamaga muvofiq hisoblanadi, bu yerda β = π₁ - π₂. Spektral meta-o'rganuvchi yordamida &lt;span class=\"yfm-latex\" data-content=\"u%20%5Cin%20%5Cmathbb%7BR%7D%5EB\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; og'irliklari olinadi, ular  ildev_k vaznli ovoz berish va &lt;span class=\"yfm-latex\" data-content=\"%5Ckappa_k%20%3D%20%2F%20ilde%7Bv%7D_k%2F%20%2F%20%5Csum_%7Bb%3D1%7D%5EB%20%2Fu_b%2F\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ishonchlilik ko'rsatkichini aniqlashga imkon beradi. n &amp;gt; 2 bo'lganda, usul «biriga qarshi barchasi» ko'rsatkichlariga qo'llaniladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ansamblli ovoz berish B=24 replika natijalarini spektral meta-tahlil orqali birlashtirib, κ_k ishonchlilik ko'rsatkichi yordamida kichik tanlamalarda klassifikatsiya barqarorligini oshiradi.&lt;br /&gt;\n[!tip] Vengriya algoritmi — turli algoritmlar ishga tushirilganda sinf belgilarini bir-biriga moslashtirish uchun ishlatiladigan optimallashtirish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"recovar-bilan-taqqoslash\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#recovar-bilan-taqqoslash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RECOVAR bilan taqqoslash&lt;/span&gt;&lt;/a&gt;RECOVAR bilan taqqoslash&lt;/h4&gt;\n&lt;p&gt;RECOVAR va B-RECOVAR konsensus pozitsiyalar va CTF'lardan foydalanadi va neyron tarmoqlarni o'qitishni talab qilmaydi. RECOVAR'dan farqli o'laroq, B-RECOVAR faqat n-1 sinf og'ish modalarini baholaydi, bu esa zarrachalar soni kam bo'lganda shovqin ta'sirini kamaytiradi. B-RECOVAR (15)-tenglamadagi o'zaro tekshirilgan aniqlash jarayonini qo'llaydi, bu zarracha va u solishtirilayotgan hajm o'rtasidagi o'z-o'zidan korrelyatsiyani istisno qiladi.&lt;/p&gt;\n&lt;h4 id=\"amalga-oshirish-tafsilotlari\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#amalga-oshirish-tafsilotlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Amalga oshirish tafsilotlari&lt;/span&gt;&lt;/a&gt;Amalga oshirish tafsilotlari&lt;/h4&gt;\n&lt;p&gt;kmin=3 va &lt;span class=\"yfm-latex\" data-content=\"k_%7Bmax%7D%20%5Cin%20%5C%7B24%2C%2032%2C%2040%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; Furye piksellari ishlatiladi. Regulyarizatsiya λ_w = 0,1 ga teng. Erituvchi niqobi eng katta zichlikka ega 8% vokselni qamrab oladi va 2 voksel standart og'ish bilan Gauss tekislanadi. Parametrlarga T=8 yangilash iteratsiyasi, B=24 replika va 80% zarrachalar kichik tanlamasi kiradi. Har bir konformatsiya uchun 5000 dan kam zarracha bo'lganda, ansamblli agregatsiya juda muhimdir. 10⁴ zarracha uchun D=128 panjarada hisoblash taxminan 10 daqiqa protsessor vaqtini oladi.&lt;/p&gt;\n&lt;h4 id=\"giperparametrlar-va-amalga-oshirish-tafsilotlari\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#giperparametrlar-va-amalga-oshirish-tafsilotlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Giperparametrlar va amalga oshirish tafsilotlari&lt;/span&gt;&lt;/a&gt;Giperparametrlar va amalga oshirish tafsilotlari&lt;/h4&gt;\n&lt;p&gt;Barcha tajribalar uchun yagona giperparametrlar to‘plami qo‘llanildi. Xotira cheklovlarini hisobga olgan holda, har bir optimallashtirish bosqichida &lt;span class=\"yfm-latex\" data-content=\"%5Cmin(%2FY%2F%2C%20128)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; miqdoridagi zarralardan foydalaniladi. Optimallashtiruvchi sifatida Adam algoritmi tanlangan bo‘lib, o‘rganish tezligi (learning rate) 0,06 va maksimal gradient normasi 0,6 qilib belgilangan. Bog‘lanishlar va to‘qnashuvlar uchun regulyarizatsiya koeffitsiyentlari mos ravishda λbond = 10⁻³ va λcollision = 0,09 ga teng. Tashqi iteratsiyalar soni R real ma’lumotlar uchun 3 tani, sintetik ma’lumotlar uchun esa 5 tani tashkil etadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Adam — bu har bir parametr uchun o‘rganish tezligini avtomatik moslashtiruvchi optimallashtirish algoritmi bo‘lib, u neyron tarmoqlarning tezroq yaqinlashishiga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Oldingi tadqiqotlardagi a-priori shartga kelsak, &lt;span class=\"yfm-latex\" data-content=\"%5Clog%20p(Z%2Fa)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ehtimolligi juda muhim edi, chunki u optimallashtirish jarayonini Pairformer modeli uchun xos bo‘lmagan sohalarga o‘tib ketishidan saqlardi. Hozirgi parametrlashda bu vazifa qisman qayta parametrlash (reparameterization) jarayoni orqali bajariladi. H dagi siljishlar shartli o‘zgaruvchiga faqat g funksiyasi orqali ta’sir qilganligi sababli, ular model arxitekturasi tomonidan qo‘llab-quvvatlanadigan yo‘nalishlar bazisida ifodalanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Qayta parametrlash usuli optimallashtirish jarayonini barqarorlashtiradi va qo‘shimcha a-priori cheklovlarsiz modelning to‘g‘ri ishlashini ta’minlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Jadval 5.&lt;/strong&gt; Fold’EM va AlphaFold3 taqqoslanishi&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Metrika&lt;/th&gt;\n&lt;th&gt;Usul&lt;/th&gt;\n&lt;th&gt;Qiymat 1&lt;/th&gt;\n&lt;th&gt;Qiymat 2&lt;/th&gt;\n&lt;th&gt;Qiymat 3&lt;/th&gt;\n&lt;th&gt;Qiymat 4&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Cα RMSD (↓, Å)&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Fold’EM&lt;/td&gt;\n&lt;td&gt;1.78&lt;/td&gt;\n&lt;td&gt;1.57&lt;/td&gt;\n&lt;td&gt;2.35&lt;/td&gt;\n&lt;td&gt;3.07&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Fold’EM&lt;/td&gt;\n&lt;td&gt;3.948&lt;/td&gt;\n&lt;td&gt;3.941&lt;/td&gt;\n&lt;td&gt;7.684&lt;/td&gt;\n&lt;td&gt;6.885&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;AlphaFold3&lt;/td&gt;\n&lt;td&gt;8.96&lt;/td&gt;\n&lt;td&gt;11.22&lt;/td&gt;\n&lt;td&gt;7.780&lt;/td&gt;\n&lt;td&gt;26.670&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;TM-score (↑)&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Fold’EM&lt;/td&gt;\n&lt;td&gt;0.969&lt;/td&gt;\n&lt;td&gt;0.976&lt;/td&gt;\n&lt;td&gt;0.948&lt;/td&gt;\n&lt;td&gt;0.917&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Fold’EM&lt;/td&gt;\n&lt;td&gt;0.9174&lt;/td&gt;\n&lt;td&gt;0.9182&lt;/td&gt;\n&lt;td&gt;0.810&lt;/td&gt;\n&lt;td&gt;0.809&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;AlphaFold3&lt;/td&gt;\n&lt;td&gt;0.699&lt;/td&gt;\n&lt;td&gt;0.661&lt;/td&gt;\n&lt;td&gt;0.7981&lt;/td&gt;\n&lt;td&gt;0.4772&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 8.&lt;/strong&gt; MolProbity strukturaviy sifat ko'rsatkichlari&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Ko'rsatkich&lt;/th&gt;\n&lt;th&gt;Qiymat 1&lt;/th&gt;\n&lt;th&gt;Qiymat 2&lt;/th&gt;\n&lt;th&gt;Qiymat 3&lt;/th&gt;\n&lt;th&gt;Qiymat 4&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;MolProbity score&lt;/td&gt;\n&lt;td&gt;1.18&lt;/td&gt;\n&lt;td&gt;1.15&lt;/td&gt;\n&lt;td&gt;1.25&lt;/td&gt;\n&lt;td&gt;1.15&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;1.50&lt;/td&gt;\n&lt;td&gt;1.53&lt;/td&gt;\n&lt;td&gt;1.58&lt;/td&gt;\n&lt;td&gt;1.79&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Clashscore&lt;/td&gt;\n&lt;td&gt;3.72&lt;/td&gt;\n&lt;td&gt;3.64&lt;/td&gt;\n&lt;td&gt;4.83&lt;/td&gt;\n&lt;td&gt;3.56&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;1.21&lt;/td&gt;\n&lt;td&gt;2.35&lt;/td&gt;\n&lt;td&gt;1.56&lt;/td&gt;\n&lt;td&gt;2.21&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ramachandran outliers&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;0.25&lt;/td&gt;\n&lt;td&gt;0.12&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;1.26&lt;/td&gt;\n&lt;td&gt;0.71&lt;/td&gt;\n&lt;td&gt;0.98&lt;/td&gt;\n&lt;td&gt;0.66&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 13.&lt;/strong&gt; Modellashtirish usullarini taqqoslash&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Usul&lt;/th&gt;\n&lt;th&gt;Qiymat 1&lt;/th&gt;\n&lt;th&gt;Qiymat 2&lt;/th&gt;\n&lt;th&gt;Qiymat 3&lt;/th&gt;\n&lt;th&gt;Qiymat 4&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Fold’EM&lt;/td&gt;\n&lt;td&gt;3.22&lt;/td&gt;\n&lt;td&gt;7.61&lt;/td&gt;\n&lt;td&gt;3.63&lt;/td&gt;\n&lt;td&gt;4.81&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;RELION (ab initio)&lt;/td&gt;\n&lt;td&gt;8.32&lt;/td&gt;\n&lt;td&gt;8.32&lt;/td&gt;\n&lt;td&gt;23.77&lt;/td&gt;\n&lt;td&gt;8.76&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;cryoDRGN-AI&lt;/td&gt;\n&lt;td&gt;33.28&lt;/td&gt;\n&lt;td&gt;33.28&lt;/td&gt;\n&lt;td&gt;41.60&lt;/td&gt;\n&lt;td&gt;18.49&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Fold’EM&lt;/td&gt;\n&lt;td&gt;3.25&lt;/td&gt;\n&lt;td&gt;3.35&lt;/td&gt;\n&lt;td&gt;3.51&lt;/td&gt;\n&lt;td&gt;3.55&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;RELION (ab initio)&lt;/td&gt;\n&lt;td&gt;6.93&lt;/td&gt;\n&lt;td&gt;7.92&lt;/td&gt;\n&lt;td&gt;7.23&lt;/td&gt;\n&lt;td&gt;8.32&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;cryoDRGN-AI&lt;/td&gt;\n&lt;td&gt;27.73&lt;/td&gt;\n&lt;td&gt;20.80&lt;/td&gt;\n&lt;td&gt;33.28&lt;/td&gt;\n&lt;td&gt;27.73&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Fold’EM&lt;/td&gt;\n&lt;td&gt;3.22&lt;/td&gt;\n&lt;td&gt;3.25&lt;/td&gt;\n&lt;td&gt;3.51&lt;/td&gt;\n&lt;td&gt;3.51&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;RELION (ab initio)&lt;/td&gt;\n&lt;td&gt;6.93&lt;/td&gt;\n&lt;td&gt;7.92&lt;/td&gt;\n&lt;td&gt;7.23&lt;/td&gt;\n&lt;td&gt;7.92&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;cryoDRGN-AI&lt;/td&gt;\n&lt;td&gt;28.81&lt;/td&gt;\n&lt;td&gt;16.64&lt;/td&gt;\n&lt;td&gt;27.73&lt;/td&gt;\n&lt;td&gt;27.73&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;AlphaFold3&lt;/td&gt;\n&lt;td&gt;8.21&lt;/td&gt;\n&lt;td&gt;19.29&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;PDB&lt;/td&gt;\n&lt;td&gt;3.39&lt;/td&gt;\n&lt;td&gt;3.47&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 15.&lt;/strong&gt; Ma'lum va ab initio tuzilmalar uchun MolProbity baholashi&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Kategoriya&lt;/th&gt;\n&lt;th&gt;Ko'rsatkich&lt;/th&gt;\n&lt;th&gt;Qiymat 1&lt;/th&gt;\n&lt;th&gt;Qiymat 2&lt;/th&gt;\n&lt;th&gt;Qiymat 3&lt;/th&gt;\n&lt;th&gt;Qiymat 4&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Known&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;MolProbity score&lt;/td&gt;\n&lt;td&gt;1.16&lt;/td&gt;\n&lt;td&gt;1.13&lt;/td&gt;\n&lt;td&gt;1.09&lt;/td&gt;\n&lt;td&gt;1.11&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Clashscore&lt;/td&gt;\n&lt;td&gt;3.72&lt;/td&gt;\n&lt;td&gt;3.40&lt;/td&gt;\n&lt;td&gt;3.01&lt;/td&gt;\n&lt;td&gt;3.16&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Ramachandran outliers&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;0.12&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Ab initio&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;MolProbity score&lt;/td&gt;\n&lt;td&gt;1.39&lt;/td&gt;\n&lt;td&gt;1.48&lt;/td&gt;\n&lt;td&gt;1.44&lt;/td&gt;\n&lt;td&gt;1.46&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Clashscore&lt;/td&gt;\n&lt;td&gt;5.85&lt;/td&gt;\n&lt;td&gt;7.28&lt;/td&gt;\n&lt;td&gt;6.65&lt;/td&gt;\n&lt;td&gt;6.72&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Ramachandran outliers&lt;/td&gt;\n&lt;td&gt;0.12&lt;/td&gt;\n&lt;td&gt;0.12&lt;/td&gt;\n&lt;td&gt;0.12&lt;/td&gt;\n&lt;td&gt;0.25&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;p&gt;Fold’EM — bu to‘g‘ridan-to‘g‘ri xom krio-EM tasvirlaridan atom tuzilmalari ansambli va zarrachalarga xos bo‘lgan nojo‘ya o‘zgaruvchilarni (nuisance variables) birgalikda aniqlaydigan usuldir. Ansamblning har bir a’zosi AlphaFold3 diffuziya modelini shartlaydigan oraliq Pairformer holati bilan ifodalanadi, zarrachaning nojo‘ya o‘zgaruvchilari esa uning fazodagi holati (pose) va geterogen namunalarda uning diskret klassidir. Jarayon zarrachalarni umumiy koordinatalar tizimiga keltirishdan boshlanadi, so‘ngra algoritm strukturaviy holatlarni yangilash va nojo‘ya o‘zgaruvchilarni aniqlashtirish o‘rtasida almashinib turadi. Rekonstruksiya qilingan hajmlar faqat initsializatsiya va kadrlarni tekislash uchun xizmat qiladi (1-rasm, 1-algoritm).&lt;/p&gt;\n&lt;h4 id=\"kirish-malumotlari,-initsializatsiya-va-koordinatalar-tizimi\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#kirish-malumotlari,-initsializatsiya-va-koordinatalar-tizimi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish ma’lumotlari, initsializatsiya va koordinatalar tizimi&lt;/span&gt;&lt;/a&gt;Kirish ma’lumotlari, initsializatsiya va koordinatalar tizimi&lt;/h4&gt;\n&lt;p&gt;Fold’EM uchun kirish ma’lumotlari zarracha tasvirlari to‘plami va molekulyar ketma-ketlikdir. Piksel/boks o‘lchami va CTF parametrlari oldindan ma’lum deb qabul qilinadi, zarrachalar markazlashtirilgan bo‘lishi shart. Ketma-ketlik yagona strukturaviy kirish hisoblanadi; AlphaFold3 MSA va bashoratni hech qanday tashqi atom modelisiz amalga oshiradi. Geterogen ma’lumotlar uchun klasslar soni n ko‘rsatiladi, gomogen ma’lumotlar uchun n=1.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Krio-EM (krio-elektron mikroskopiya) — biomolekulalarni muzlatilgan holatda tasvirga olish usuli bo‘lib, u molekulalarning tabiiy tuzilishini saqlab qolishga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ab initio rejimida fazoviy holatni baholash uch bosqichda amalga oshiriladi: (i) VDAM (moslashuvchan momentlarga ega gradient tushish algoritmi) tasodifiy initsializatsiyadan qo‘pol hajmni va zarracha holatlarini baholaydi; (ii) Viner teskari proyeksiyasi yordamida konsensus zichlik rekonstruksiya qilinadi; (iii) AlphaFold3 bashorati strukturaviy koordinatalar tizimini belgilash uchun ushbu zichlikka joylashtiriladi. Krio-EM ehtimolligi global qattiq transformatsiyalarga nisbatan invariant bo‘lgani uchun, yechim SE(3) global transformatsiyasigacha aniqlanadi va u barcha zarracha holatlarini moslashtirilgan strukturaga nisbatan ifodalash orqali belgilanadi.&lt;/p&gt;\n&lt;h4 id=\"zarrachalarni-joylashtirish-va-klassifikatsiya-qilish\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#zarrachalarni-joylashtirish-va-klassifikatsiya-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Zarrachalarni joylashtirish va klassifikatsiya qilish&lt;/span&gt;&lt;/a&gt;Zarrachalarni joylashtirish va klassifikatsiya qilish&lt;/h4&gt;\n&lt;p&gt;Klass yorliqlari noma’lum bo‘lganda, biz B-RECOVAR (bootstrapped residual-subspace estimator) usulidan foydalanamiz. Zarrachalar soni kam bo‘lganda cryoDRGN yoki RECOVAR usullari klasslarni har doim ham ishonchli ajrata olmaydi, shuning uchun B-RECOVAR ikki holat uchun: (i) klass og‘ish hajmlarini konsensus rekonstruksiyadan qolgan qoldiqlarga moslashtiradi; (ii) klasslar bo‘yicha rekonstruksiyalar bilan o‘zaro tekshirish orqali tayinlovlarni aniqlashtiradi; (iii) spektral meta-o‘rganish yordamida randomizatsiyalangan kichik namunalar natijalarini birlashtiradi. Ikkitadan ortiq holatlar uchun deflyatsiya qo‘llanadi. Klassifikatsiyadan so‘ng, har bir klass uchun yordamchi hajm quriladi (2-algoritm, D.4-ilova).&lt;/p&gt;\n&lt;h4 id=\"ansamblli-xulosa\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#ansamblli-xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ansamblli xulosa&lt;/span&gt;&lt;/a&gt;Ansamblli xulosa&lt;/h4&gt;\n&lt;p&gt;Strukturani aniqlash jarayoni zarrachalar, mos yozuvlar strukturasi va ularning o‘zaro pozitsiyalariga asoslanadi. Geterogen namunalar uchun ma’lumotlar klassifikatsiyalanadi va pozitsiyalar mos sinflar bilan sinxronlashtiriladi. 2-tenglama strukturaviy holatlarni H va xalaqit beruvchi o‘zgaruvchilarni &lt;span class=\"yfm-latex\" data-content=\"%5Ceta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (zarrachalar pozitsiyasi va sinflari) bog‘laydi; ularni optimallashtirish koordinatali ko‘tarilish usuli orqali amalga oshiriladi. Har bir r iteratsiyada algoritm avval &lt;span class=\"yfm-latex\" data-content=\"%5Ceta%5E%7B(r)%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ni qotirib, H^(r+1) strukturani yangilaydi, so‘ngra X^(r+1) strukturani qotirib, &lt;span class=\"yfm-latex\" data-content=\"%5Ceta%5E%7B(r%2B1)%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; o‘zgaruvchilarni aniqlashtiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Koordinatali ko‘tarilish usuli — bu murakkab optimallashtirish masalalarini yechish uchun bir guruh parametrlarni qotirib, boshqalarini navbatma-navbat yaxshilashga asoslangan iterativ yondashuv.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Birinchi bosqichda (strukturani aniqlash) H^(r+1) yangilanishi logarifmik ehtimollikni maksimallashtirish orqali amalga oshiriladi (3-tenglama). Biz IT-Opt ga o‘xshash yondashuvdan foydalanamiz, bunda ehtimollik gradientlari AlphaFold3 latent holatlariga o‘tkaziladi. Generativ model sifatida diffuziya jarayoni (4-tenglama) qo‘llaniladi, bunda X_T ~ N(0, σ²_T I) dan t=0 gacha bo‘lgan teskari diffuziya g(H) ga asoslangan strukturani shakllantiradi. Har bir iteratsiya uchun Q ta mustaqil diffuziya yugurishi bajariladi va H yugurishlar o‘rtasida «xotira» sifatida saqlanadi. Har bir t qadamda latent holatlar γ_h qadam hajmi bilan gradient ko‘tarilishi orqali yangilanadi (5-tenglama), bu esa AlphaFold generatorini eksperimental ma’lumotlar bilan tasdiqlangan konfiguratsiyalarga yo‘naltiradi.&lt;/p&gt;\n&lt;p&gt;Ikkinchi bosqichda (xalaqit beruvchi o‘zgaruvchilarni aniqlash) X^(r+1) struktura qotiriladi va har bir k zarracha uchun ehtimollik maksimallashtiriladi (6-tenglama). Bu pozitsiyani &lt;span class=\"yfm-latex\" data-content=\"%5Cphi_k\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (zarrachani joriy strukturalarga nisbatan tekislash) va sinfni c_k (zarrachani ansamblning eng mos a’zosiga biriktirish) aniqlashtirishni o‘z ichiga oladi. Pozitsiyalar etalon koordinatalar tizimida ifodalanadi, bu global SE(3) kalibrlash noaniqligini yo‘qotadi. Ushbu ikki bosqichning almashinuvi past signal-shovqin nisbatida juda muhim, chunki pozitsiya yoki klassifikatsiyadagi xatolar strukturaviy gradientlarni buzishi mumkin. Diffuziyaning stoxastik tabiati va mini-batchlardan foydalanish sababli maqsadli funksiyaning monoton yaxshilanishi kafolatlanmasa-da, bu yondashuv struktura va zarracha parametrlarini birgalikda aniqlash uchun ishonchli asos bo‘lib xizmat qiladi.&lt;/p&gt;\n&lt;h4 id=\"tajribalar\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#tajribalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tajribalar&lt;/span&gt;&lt;/a&gt;Tajribalar&lt;/h4&gt;\n&lt;p&gt;Biz Fold’EM ishini ma’lum tuzilmalardan olingan sintetik zarrachalar va EMPIAR’dagi eksperimental to‘plamlar yordamida baholaymiz (A2 va A1 jadvallari). 4.1 va 4.2-bo‘limlarda biz ikkita asosiy yechimni sinovdan o‘tkazamiz: rekonstruksiya qilingan zichlik o‘rniga zarrachalarning o‘zi orqali boshqaruv va terminal embedding yoki atom koordinatalari o‘rniga oraliq Pairformer holatini optimallashtirish. 4.3 va 4.4-bo‘limlar gomogen namunalar va ikki holatli aralashmalar uchun tuzilmani aniqlashni baholaydi. Bunda avval ma’lum yo‘nalishlar (orientatsiyalar) bilan, so‘ngra ab initio (zarrachalardan aniqlangan yo‘nalishlar bilan) sinovlar o‘tkaziladi. Ma’lum yo‘nalishlar rejimida sintetik zarrachalarni renderlash uchun ishlatilgan yoki eksperimental ma’lumotlarni aniqlashdan olingan parametrlar qo‘llaniladi. 4.5-bo‘lim B-RECOVAR yordamida yorliqsiz klassifikatsiyani, 4.6-bo‘lim esa uzluksiz geterogenlikni baholaydi. Agar boshqacha ko‘rsatilmagan bo‘lsa, biz Cα RMSD va TM-score ko‘rsatkichlarini, shuningdek, Fourier qobig‘i korrelyatsiyasi (FSC) 0.143 chegarasini kesib o‘tadigan aniqlik darajasini keltiramiz (D.2.4 ilovasi). Zichlikka asoslangan bazaviy usullar sifatida RELION va cryoDRGN (ma’lum yo‘nalishlar bilan), shuningdek, RELION ab initio va cryoDRGN-AI (ularsiz) ishlatiladi. Nazorat sifatida AlphaFold3’ning eksperimental boshqaruvsiz natijalari ham keltiriladi.&lt;/p&gt;\n&lt;h4 id=\"zarrachalar-boyicha-boshqaruv-vs-zichlik-boyicha-boshqaruv\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#zarrachalar-boyicha-boshqaruv-vs-zichlik-boyicha-boshqaruv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Zarrachalar bo‘yicha boshqaruv vs. zichlik bo‘yicha boshqaruv&lt;/span&gt;&lt;/a&gt;Zarrachalar bo‘yicha boshqaruv vs. zichlik bo‘yicha boshqaruv&lt;/h4&gt;\n&lt;p&gt;Eksperimental qurilma. Biz zarrachalarning o‘zi orqali boshqaruv, teng miqdordagi zarrachalar bilan rekonstruksiya qilingan zichlik orqali boshqaruvga qaraganda aniqroq tuzilmani tiklaydimi yoki yo‘qligini tekshiramiz. Buning uchun biz 8U4E sintetik yig‘indisini (3 304 qoldiq) olamiz va SNR 0.005 da 500 ta zarracha bo‘yicha ab initio xulosa chiqaramiz. Konsensus zichlik baholangan yo‘nalishlar bo‘yicha rekonstruksiya qilinadi. Bazaviy usul (zichlik bo‘yicha boshqaruv) xuddi shu Pairformer holatini optimallashtiradi, lekin zarrachalar ehtimolligini konsensus zichlikka nisbatan yo‘qotish (loss) bilan almashtiradi.&lt;/p&gt;\n&lt;p&gt;Natijalar. Teng miqdordagi zarrachalarda zarrachalar bo‘yicha boshqaruv yig‘indini tiklaydi, zichlik bo‘yicha boshqaruv esa yo‘q. AlphaFold3’ning boshqaruvsiz prognozi Cα RMSD 22.99 Å ni beradi. Zichlik bo‘yicha boshqaruv buni 17.95 Å gacha kamaytiradi, Fold’EM esa 6.88 Å va TM-score 0.809 ga erishadi (A12 jadvali), zichlik qobig‘ini aniq kuzatib boradi (2-rasm). 500 ta zarrachada zichlik qo‘pol bo‘lib, u zarrachalar ehtimolligi funksiyasini almashtira olmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SNR (signal-shovqin nisbati) — ma’lumotlar sifatini ko‘rsatuvchi ko‘rsatkich; qiymat qanchalik past bo‘lsa, foydali signalni ajratib olish shunchalik qiyinlashadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"h-ni-optimallashtirish-vs-z-va-koordinata-fazosi\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#h-ni-optimallashtirish-vs-z-va-koordinata-fazosi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;H ni optimallashtirish vs. Z va koordinata fazosi&lt;/span&gt;&lt;/a&gt;H ni optimallashtirish vs. Z va koordinata fazosi&lt;/h4&gt;\n&lt;p&gt;Eksperimental qurilma. Biz oraliq Pairformer holatini (H) optimallashtirishning samaradorligini terminal embedding (Z) yoki atom koordinatalariga bevosita ta’sir qilish bilan solishtiramiz. Sinovlar 9UGB va 8U4B sintetik yig‘indilarida (SNR 0.005, 250 yoki 1 000 zarracha, ma’lum yo‘nalishlar) o‘tkazildi. Biz Fold’EMni IT-Opt va teskari diffuziya jarayonining koordinatali boshqaruvi bilan solishtiramiz.&lt;/p&gt;\n&lt;p&gt;Natijalar. H ni optimallashtirish eng kuchli boshqaruvni ta’minlaydi. Uchala usul ham 9UGB uchun AlphaFold3 prognozini yaxshilaydi, lekin Fold’EM eng yaxshi Cα RMSD, TM-score va FSC aniqligini ko‘rsatadi. Kattaroq 8U4B yig‘indisida faqat Fold’EM tuzilmani tiklaydi, boshqa usullar esa dastlabki prognozni yomonlashtiradi (3-rasm). Farq yirik yig‘indilarda yaqqol namoyon bo‘ladi, chunki Z yoki koordinatalarning filtrlanmagan yangilanishlari modelni etalondan uzoqlashtiradi.&lt;/p&gt;\n&lt;h4 id=\"bir-xil-namunalar-boyicha-qollanma\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#bir-xil-namunalar-boyicha-qollanma\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bir xil namunalar bo‘yicha qo‘llanma&lt;/span&gt;&lt;/a&gt;Bir xil namunalar bo‘yicha qo‘llanma&lt;/h4&gt;\n&lt;p&gt;Eksperimental sozlama. Tadqiqotchilar bitta konformatsion holat strukturasini aniqlash uchun zarur bo‘lgan minimal zarralar sonini, ham ma’lum yo‘nalishlar (poses), ham ab initio usuli yordamida baholadilar. Sintetik nishonlar sifatida (Jadval A2) 9UGB, 9UGB, 8U4B va 8U4E tuzilmalari 0.01 va 0.005 signal-shovqin nisbatida (SNR) ishlatildi. Ma’lum yo‘nalishlar uchun 100 dan 1000 tagacha, ab initio uchun esa 500 ta zarracha qo‘llanildi. Shuningdek, beshta eksperimental ma’lumotlar to‘plami (Jadval A1) sinovdan o‘tkazildi: BIIG2 Fab bilan bog‘langan integrin α 5β 1 (9B9J), 9B77, 8PWH va ikkita UvrA holati (9GXQ, 9GXR). Ma’lum yo‘nalishlarda depozit qilingan zarralarning 1/1000 dan 1/50 qismigacha, ab initio uchun esa 9B9J va 9B77 uchun 1000 ta, qolganlari uchun 5000 ta zarracha ishlatildi. Natijalar bazaviy usullar bilan solishtirildi, bunda FSC rekonstruksiya qilingan zichlik bo‘yicha, Fold’EM uchun esa atom modelidan renderlangan xarita bo‘yicha hisoblandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ab initio usuli (lotincha «boshidan») — bu ma’lum shablonlar yoki zarralar yo‘nalishlarisiz, «noldan» struktura qurish usuli bo‘lib, u katta hisoblash resurslarini talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Natijalar. Sintetik ma’lumotlarda 100 ta zarracha ma’lum yo‘nalishlar bilan yetarli bo‘ldi. AlphaFold3 Pma1 konformatsiyasini (9UGB) noto‘g‘ri bashorat qildi (TM-score 0.699, Cα RMSD 8.96 Å; Rasm 4A). Fold’EM 100 ta zarracha va 0.005 SNR bilan 3.25 Å FSC aniqligiga, 0.965 TM-score va 1.01 Å Cα RMSD ga erishdi, bu depozit qilingan modelga yaqin (3.39 Å; Jadval A5, A6). 9UGC, 8U4B va 8U4E uchun 3.45, 3.80 va 4.18 Å aniqlik hamda 0.983, 0.979 va 0.973 TM-score olindi. cryoDRGN va RELION usullari pastroq natija ko‘rsatdi (aniqlik &amp;gt; 5 Å). Zarrachalar sonini 1000 tagacha oshirish Fold’EM natijalarini sezilarli o‘zgartirmadi. Ab initio rejimida 500 ta zarracha 9UGB uchun 3.25 Å aniqlikni (SNR 0.005, TM-score 0.976, Cα RMSD 1.57 Å) ta’minladi, RELION va cryoDRGN-AI esa 8.93 va 27.70 Å ko‘rsatdi (Jadval A11, A12).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti-f4.jpg\" alt=\"4-rasm: Fold’EM atom tuzilmalarini ma’lum pozalar bilan depozit qilingan zarrachalarning 0,03% dan va ab initio 0,27% da\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm: Fold’EM atom tuzilmalarini ma’lum pozalar bilan depozit qilingan zarrachalarning 0,03% dan va ab initio 0,27% dan tiklaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-rasm: Fold’EM atom tuzilmalarini ma’lum pozalar bilan depozit qilingan zarrachalarning 0,03% dan va ab initio 0,27% dan tiklaydi. Har bir ustun bitta nishon: chapda sintetik ma’lumotlar to‘plami (A, C, E, G) va o‘ngda eksperimental (B, D, F, H). Qatorlar tuzilmalarni (A, B; AlphaFold3 ko‘k rangda, Fold’EM qizil rangda, depozit qilingan model kulrangda), vakillik zarrachalarini (C, D), FSC ruxsatini (E, F) va zarrachalar soniga qarab depozit qilingan modelga nisbatan TM-ballni (G, H) ko‘rsatadi; to‘ldirilgan markerlar ma’lum pozalarni, bo‘sh markerlar ab initio ni, nuqtali chiziq esa AlphaFold3 bashoratini bildiradi. Chapda: Pma1, xamirturush plazmatik H+-ATPaza, faollashtirilgan (E2P) holatida (9UGB); SNR 0,005 da sintetik zarrachalar. AlphaFold3 transmembran domenini bashorat qiladi, lekin sitozolik A-, N- va P-domenlarini noto‘g‘ri joylashtiradi, ularning joylashuvi katalitik sikl davomida o‘zgaradi (TM-ball 0,70). Fold’EM depozit qilingan holatni tiklaydi, ma’lum pozalar bilan 100 ta zarrachadan 3,3 Å va 0,97 TM-ballga, ab initio esa 500 ta zarrachadan 3,3 Å ga erishadi. O‘ngda: Integrin α5β1–BIIG2 (9B9J, EMPIAR-12552), bu yerda AlphaFold3 ikkala komponent foldini bashorat qiladi, lekin Fabni noto‘g‘ri joyga qo‘yadi (TM-ball 0,78); antikor–antigen juftliklari kam juftlashgan ko-evolyutsion ma’lumot beradi. Fold’EM bog‘langan kompleks va epitopni tiklaydi, garchi interfeys o‘zgaruvchan ilmoqlari bo‘lmasa ham, ma’lum pozalar bilan 100 ta zarrachadan 3,5 Å va 0,97 TM-ballga, ab initio esa 1000 ta zarrachadan 3,5 Å ga erishadi; hech qanday bazaviy usul 6 Å ga yetmaydi va Fold’EM hatto eng kam zarrachalar sonida ham AlphaFold3 dan ustun turadi. Siyrak zarrachalar dalillari shu tariqa strukturaviy aprior bilim tomonidan ta’minlangan global joylashuvni tuzatadi. Ruxsat (Å; FSC = 0,143).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Eksperimental ma’lumotlarda Fold’EM bazaviy bashoratlar mavjud bo‘lganda struktura aniqligini oshiradi. 9B9J holatida AlphaFold3 Fab-fragmentni noto‘g‘ri joylashtirdi (Rasm 4B), ammo Fold’EM 400 ta zarracha (ab initio) bilan to‘g‘ri epitopni aniqladi, 3.5 Å dan yuqori aniqlik va 0.9 dan ortiq TM-score ga erishdi (Rasm 4F, 4H), bazaviy usullar esa 6 Å chegarasidan o‘ta olmadi. 9B77, 9GXQ va 9GXR uchun depozit qilingan zarralarning 1/1000 qismi bilan Fold’EM 2.88, 3.08 va 3.18 Å aniqlikka erishdi (Jadval A3). 8PWH istisno bo‘ldi: Fold’EM TM-score ni 0.397 dan 0.900 ga ko‘targan bo‘lsa-da (Jadval A4), 1/100 dan ortiq zarralar bilan cryoDRGN va RELION yuqoriroq aniqlik ko‘rsatdi (5.16–5.01 Å ga qarshi 7.06–6.13 Å).&lt;/p&gt;\n&lt;h4 id=\"ikki-holatli-geterogenlik-sharoitida-boshqaruv\"&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html#ikki-holatli-geterogenlik-sharoitida-boshqaruv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ikki holatli geterogenlik sharoitida boshqaruv&lt;/span&gt;&lt;/a&gt;Ikki holatli geterogenlik sharoitida boshqaruv&lt;/h4&gt;\n&lt;p&gt;Eksperimental dizayn. Mualliflar aralash zarrachalar to‘plamidan ikkita konformatsion holatni ajratib olish imkoniyatini o‘rgandilar. Sintez qilingan ma’lumotlar (Pma1 holatlari: 9UGB va 9UGC, Cα RMSD bo‘yicha 9 Å farq, SNR 0.01 va 0.005, 250–1000 zarracha) va eksperimental ma’lumotlar (EMPIAR-13396, abazik saytli DNK bilan bog‘langan UvrA: 9GXQ va 9GXR, 500–10 000 zarracha) ishlatildi. Ab initio rejimida B-RECOVAR sinf belgilarini initsializatsiya qiladi, Fold’EM esa struktura, poza va sinflarni iterativ tarzda aniqlashtiradi. Bazaviy usullar (RELION, cryoDRGN) avval zarrachalarni klasterlaydi, so‘ngra har bir to‘plam uchun zichlikni rekonstruksiya qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SNR (Signal-to-Noise Ratio) — signal va shovqin nisbati; bu ko‘rsatkich qanchalik past bo‘lsa, shovqin darajasi yuqori bo‘lgani uchun strukturani tiklash shunchalik qiyinlashadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Natijalar. Sintez qilingan ma’lumotlarda holatlarni ajratish uchun bir necha yuz zarracha kifoya qiladi. AlphaFold3 ularning hech birini tiklay olmadi (TM-score 0.699 va 0.661; 5-rasm). Ma’lum pozalar bilan Fold’EM SNR 0.005 va 250 zarracha bilan 3.3 va 3.5 Å aniqlikka erishadi (TM-score 0.96 va 0.98; A19, A20-jadvallar). Shu sharoitda RELION 7.9 Å dan yomonroq natija beradi, cryoDRGN esa 3.6 va 4.8 Å ga erishish uchun 1000 zarracha talab qiladi. Ab initio rejimida Fold’EM SNR 0.005 va 500 zarracha bilan 3.4 va 3.6 Å aniqlikni ko‘rsatadi (TM-score 0.95 va 0.94; A21, A22-jadvallar). RELION ab initio va cryoDRGN-AI mos ravishda 6.9 va 16.6 Å dan yomonroq natija beradi. 250 zarracha va SNR 0.005 holatida 9UGB 7.6 Å gacha degradatsiyaga uchraydi, bu parametrlarni birgalikda aniqlash uchun chegaraviy qiymatdir.&lt;/p&gt;\n&lt;p&gt;UvrA uchun mu
