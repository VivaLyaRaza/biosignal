            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"169\" cy=\"147\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"691\" cy=\"237\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · ECOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Dengiz o‘tlari uglerodni&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;okean tubida ming yillar&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;davomida saqlaydi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may-f1.jpg\" alt=\"Dengiz oʻtlariga (kelp) bogʻliq erigan organik uglerod (EOU) molekulyar izlarini global okean boʻylab kuzatish uchun eks\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Dengiz oʻtlariga (kelp) bogʻliq erigan organik uglerod (EOU) molekulyar izlarini global okean boʻylab kuzatish uchun eksperimental ish jarayoni.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Dengiz oʻtlariga (kelp) bogʻliq erigan organik uglerod (EOU) molekulyar izlarini global okean boʻylab kuzatish uchun eksperimental ish jarayoni. (A) In situ mezokosmlar va mikrobial degradatsiya. Xaltali mezokosmlar Sanggou koʻrfazidagi (Sariq dengiz) dengiz oʻtlari fermasida jadal oʻsish (yanvar) va toʻliq yetilish (iyun) bosqichlarida joylashtirildi, har birida uchta dengiz oʻti (Saccharina japonica) sporofiti va faqat dengiz suvi boʻlgan uchta nazorat namunasi mavjud. Har bir xaltadan 10 litr EOU bilan boyitilgan dengiz suvi filtrlandi va qorongʻu joyda tabiiy mikrobial inokulyat bilan 180 kun davomida alohida inkubatsiya qilindi (n = 3 har bir shart uchun, 0 va 180-kunlarda namunalar olindi). Dengiz oʻtlari detritining parallel degradatsiyasi 210 kun davomida oʻtkazildi (5 va 210-kunlarda namunalar olindi; uch nusxada). (B) EOU boʻyicha qiyosiy tajribalar: qoʻshimcha inkubatsiyalar tarkibiga Gracilaria detriti (10 va 90 kun) va aksenik diatom madaniyatlari (Phaeodactylum tricornutum va Chaetoceros sp. DS1; 0 va 90 kun) kiritildi, har biri uch nusxada. Bir xil sharoitdagi takroriy idishlardan olingan EOU ekstraktlari qattiq fazali ekstraksiyadan oʻtkazildi, birlashtirildi va keyin FT-ICR MS yordamida tahlil qilindi. (C) Konservativ filtrlash quvuri dengiz suvi nazorat namunalari va turli fitoplankton va makroalgal molekulyar formulalar (MF) (ham nashr etilgan maʼlumotlar toʻplamidan, ham ushbu tadqiqotdan) oʻz ichiga olgan birlamchi ishlab chiqaruvchilarning maʼlumotlar bazasi bilan umumiy boʻlgan MFni olib tashladi, natijada dengiz oʻtlariga bogʻliq 1753 ta noyob MF olindi. (D) Global okeanda aniqlash. Tinch okeanining gʻarbiy qismidan olingan EOU namunalari tahlil qilindi va global okean EOU FT-ICR MS (GODOC-MS) maʼlumotlar toʻplamini yaratish uchun global okean FT-ICR MS maʼlumotlar toʻplamlari bilan birlashtirildi. Keyin dengiz oʻtlariga bogʻliq EOU MFlari GODOC-MSga nisbatan soʻrov qilindi; xaritadagi koʻk rangli doiralar dengiz oʻtlariga bogʻliq EOU signallari aniqlangan stansiyalarni koʻrsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Laminariya kabi qirg‘oqbo‘yi suvo‘tlari katta miqdorda karbonat angidridni yutadi. Yangi tadqiqot shuni ko‘rsatadiki, bu uglerodning bir qismi barqaror birikmalarga aylanib, oqimlar orqali minglab kilometr uzoqlikdagi okean tubiga yetib boradi. Bu okeanda uglerodni uzoq muddatli saqlashning yangi va muhim yo‘lini ochib beradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Laminariya birlamchi mahsulotining 62% gacha qismini erigan uglerod sifatida chiqaradi.&lt;/li&gt;\n&lt;li&gt;Suvo‘tlariga xos barqaror molekulalar 5500 metr chuqurlikda topildi.&lt;/li&gt;\n&lt;li&gt;Qirg‘oq ekotizimlari yiliga 481 teragrammgacha uglerodni bog‘lashi mumkin.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Olimlar Saccharina japonica laminariyasidan ajralib chiquvchi erigan organik uglerodni (DOC) tahlil qilish uchun o‘ta yuqori aniqlikdagi mass-spektrometriyadan (FT-ICR MS) foydalandilar. 180 kunlik mikrobial parchalanish tajribalari davomida uglerod labil (tez parchalanadigan) va rekaltsitrant (parchalanishga chidamli) fraksiyalarga ajratildi. Birikmalarning barqarorligini baholash uchun molekulyar rekaltsitrantlik indeksi (MRS) ishlab chiqildi.&lt;/p&gt;\n&lt;p&gt;Tahlillar shuni ko‘rsatdiki, laminariyaga xos molekulyar signallar qirg‘oqdan 10 000 kilometrgacha masofada va 5500 metr chuqurlikda aniqlangan. Ushbu birikmalar yuqori MRS indeksiga ega, bu ularning mikroorganizmlar tomonidan parchalanishga chidamliligini tasdiqlaydi. Qirg‘oqbo‘yi suvo‘tlari ekotizimlarining global uglerod saqlashdagi hissasi yiliga 320,7–481,1 teragramm uglerod deb baholanmoqda.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot laboratoriya modellariga asoslangan bo‘lib, ular okeandagi murakkab tabiiy jarayonlarni to‘liq aks ettirmasligi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Atmosfera karbonat angidridining dengiz birlamchi produtsentlari tomonidan erigan organik uglerod (EOU) va zarrachali organik uglerodga (ZOU) aylanishi uglerodning noorganik holatdan organik holatga oʻtishining muhim oqimini ifodalaydi va global iqlimni tartibga solishda asosiy rol oʻynaydi. Dengiz EOU havzasi taxminan 660 milliard metrik tonna uglerodga baholanadi, bunda chidamli EOU (ChEOU) umumiy EOU havzasining 95% dan ortigʻini tashkil qiladi. Ushbu keng havza molekulyar xilma-xillikni oʻz ichiga oladi: dengiz oziq-ovqat zanjirlari orqali tez aylanadigan labil EOU (LEOU) molekulalaridan tortib, ming yillar davomida saqlanib qoladigan ChEOU molekulalarigacha. ChEOU asosan mikrobial uglerod nasosi orqali LEOU birikmalarining mikrobial qayta ishlanishi natijasida hosil boʻladi, bu okeanda uglerodni uzoq muddatli sekvestrlashning asosiy yoʻlidir.&lt;/p&gt;\n&lt;p&gt;Ushbu molekulyar xilma-xillik va uglerodni saqlashdagi ahamiyatiga qaramay, okean EOU shakllanishi haqidagi hozirgi tushuncha deyarli faqat fitoplanktondan olingan EOUga qaratilgan boʻlib, boshqa birlamchi produtsentlarning hissasini katta darajada eʼtiborsiz qoldiradi. Dengiz makro-suv oʻtlari global qirgʻoq okeanidagi eng keng va samarali oʻsimlik yashash joylarini tashkil etadi, ular uglerodni qirgʻoq suvlaridagi fitoplanktondan bir barobar yuqori tezlikda fiksatsiya qiladi va chiqaradi. Bu yuqori mahsuldorlik makro-suv oʻtlaridan olingan EOU dengiz EOU havzasiga sezilarli hissa qoʻshishi mumkinligini koʻrsatadi. Biroq, makro-suv oʻtlarining dengiz EOU oqimlariga qoʻshgan hissasi molekulyar murakkablik va uslubiy cheklovlar tufayli asosan oʻrganilmagan holda qolmoqda.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Makro-suv oʻtlari uglerodning yuqori samarali manbalari hisoblanadi, biroq ularning global EOU havzasiga qoʻshgan hissasi tahlil murakkabligi tufayli shu paytgacha yetarlicha baholanmagan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;EOU (DOC) — erigan organik uglerod; ChEOU (RDOC) — mikrobial parchalanishga chidamli fraksiya; LEOU (LDOC) — mikroorganizmlar tomonidan tez isteʼmol qilinadigan labil fraksiya.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kuzatuv tadqiqoti: mavjud maʼlumotlar potensial bogʻliqlikni koʻrsatadi, ammo qoʻshimcha tasdiqlarsiz global miqyosda sabab-oqibat bogʻliqligini isbotlamaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Laminariya (Saccharina japonica) tomonidan hosil boʻlgan EOU dinamikasini yetishtirish sharoitida tavsiflash uchun biz EOU ajralib chiqish tezligini va keyingi mikrobial parchalanish namunalarini laminariya yetishtirishning ikki xil fenologik bosqichida: tez oʻsish bosqichi va toʻliq yetilgan bosqichda miqdoriy aniqladik (Rasm 2). Biz EOUning yangi ajralib chiqishida bosqichga bogʻliq sezilarli oʻzgarishlarni kuzatdik, bunda toʻliq yetilgan bosqich tez oʻsish bosqichiga (43,6 ± 19,3 mkmol g⁻¹ yangi vazn (YV) kuniga) qaraganda sezilarli darajada yuqori EOU ajralib chiqish tezligini [64,7 ± 3,6 mkmol g⁻¹ YV kuniga] koʻrsatdi (P &amp;lt; 0,05) (Rasm 2, A va B). Dengiz suvi fonini ayirgandan keyin sof EOU konsentratsiyalari tez oʻsish bosqichida 47 ± 21 mkm va toʻliq yetilgan bosqichda 334 ± 18 mkm ni tashkil etdi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may-f2.jpg\" alt=\"Dengiz oʻtlaridan olingan EOU ishlab chiqarishning vaqtinchalik dinamikasi va turli oʻsish bosqichlarida mikrobial degra\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Dengiz oʻtlaridan olingan EOU ishlab chiqarishning vaqtinchalik dinamikasi va turli oʻsish bosqichlarida mikrobial degradatsiya.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Dengiz oʻtlaridan olingan EOU ishlab chiqarishning vaqtinchalik dinamikasi va turli oʻsish bosqichlarida mikrobial degradatsiya. EOU konsentratsiyasidagi oʻzgarishlar (A va B) dengiz oʻtlarini yetishtirishning jadal oʻsish va toʻliq yetilish bosqichlarida va (C va D) bir xil oʻsish bosqichlaridan olingan EOUning uzoq muddatli qorongʻu mikrobial degradatsiyasi davomida. Nazorat tajribalari dengiz oʻtlarisiz inkubatsiya qilingan atrof-muhit dengiz suvidan iborat edi. Dengiz oʻtlaridan olingan sof EOU har bir vaqt nuqtasida nazorat qiymatlarini tajriba qiymatlaridan ayirish orqali hisoblab chiqildi. Qiymatlar uchta oʻlchovning oʻrtacha ± SD koʻrsatkichlarini ifodalaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Laminariyadan olingan EOUning keyingi uzoq muddatli mikrobial parchalanish eksperimentlari (180 kun) ikki fazali EOU dinamikasini aniqladi (Rasm 2, C va D). Dastlabki tez isteʼmol birinchi 90 kun ichida sodir boʻldi, shundan soʻng 90-kundan 180-kungacha EOU konsentratsiyalari va mikrobial koʻpayish barqarorlashdi (Rasm SN, A va B), bu qoldiq EOUning mikrobial parchalanishga asosan chidamli (ChEOU) ekanligini koʻrsatadi. Nazorat guruhlari uchun tuzatishdan soʻng, qoldiq EOU (operativ ravishda ChEOU deb belgilangan) tez oʻsish va toʻliq yetilgan bosqichlar uchun dastlabki EOUning mos ravishda 20,1% (9 ± 10 mkm) va 30,5% (102 ± 13 mkm) qismini tashkil etdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;EOUning ajralib chiqish tezligi oʻsish bosqichiga bogʻliq boʻlib, ajralib chiqqan uglerodning 30,5% gacha qismi chidamli shaklga (ChEOU) oʻtadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;FT-ICR MS (Furye transformatsiyasi ion siklotron rezonansi mass-spektrometriyasi) — bir namunadagi minglab individual molekulyar formulalarni aniqlash imkonini beruvchi oʻta yuqori aniqlikdagi usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Laboratoriya parchalanish eksperimentlari murakkab tabiiy sharoitlarni toʻliq takrorlamaydi, shuning uchun labillik baholari okeandagi haqiqiy koʻrsatkichlardan farq qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may-f1.jpg\" alt=\"Dengiz oʻtlariga (kelp) bogʻliq erigan organik uglerod (EOU) molekulyar izlarini global okean boʻylab kuzatish uchun eks\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Dengiz oʻtlariga (kelp) bogʻliq erigan organik uglerod (EOU) molekulyar izlarini global okean boʻylab kuzatish uchun eksperimental ish jarayoni.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Dengiz oʻtlariga (kelp) bogʻliq erigan organik uglerod (EOU) molekulyar izlarini global okean boʻylab kuzatish uchun eksperimental ish jarayoni. (A) In situ mezokosmlar va mikrobial degradatsiya. Xaltali mezokosmlar Sanggou koʻrfazidagi (Sariq dengiz) dengiz oʻtlari fermasida jadal oʻsish (yanvar) va toʻliq yetilish (iyun) bosqichlarida joylashtirildi, har birida uchta dengiz oʻti (Saccharina japonica) sporofiti va faqat dengiz suvi boʻlgan uchta nazorat namunasi mavjud. Har bir xaltadan 10 litr EOU bilan boyitilgan dengiz suvi filtrlandi va qorongʻu joyda tabiiy mikrobial inokulyat bilan 180 kun davomida alohida inkubatsiya qilindi (n = 3 har bir shart uchun, 0 va 180-kunlarda namunalar olindi). Dengiz oʻtlari detritining parallel degradatsiyasi 210 kun davomida oʻtkazildi (5 va 210-kunlarda namunalar olindi; uch nusxada). (B) EOU boʻyicha qiyosiy tajribalar: qoʻshimcha inkubatsiyalar tarkibiga Gracilaria detriti (10 va 90 kun) va aksenik diatom madaniyatlari (Phaeodactylum tricornutum va Chaetoceros sp. DS1; 0 va 90 kun) kiritildi, har biri uch nusxada. Bir xil sharoitdagi takroriy idishlardan olingan EOU ekstraktlari qattiq fazali ekstraksiyadan oʻtkazildi, birlashtirildi va keyin FT-ICR MS yordamida tahlil qilindi. (C) Konservativ filtrlash quvuri dengiz suvi nazorat namunalari va turli fitoplankton va makroalgal molekulyar formulalar (MF) (ham nashr etilgan maʼlumotlar toʻplamidan, ham ushbu tadqiqotdan) oʻz ichiga olgan birlamchi ishlab chiqaruvchilarning maʼlumotlar bazasi bilan umumiy boʻlgan MFni olib tashladi, natijada dengiz oʻtlariga bogʻliq 1753 ta noyob MF olindi. (D) Global okeanda aniqlash. Tinch okeanining gʻarbiy qismidan olingan EOU namunalari tahlil qilindi va global okean EOU FT-ICR MS (GODOC-MS) maʼlumotlar toʻplamini yaratish uchun global okean FT-ICR MS maʼlumotlar toʻplamlari bilan birlashtirildi. Keyin dengiz oʻtlariga bogʻliq EOU MFlari GODOC-MSga nisbatan soʻrov qilindi; xaritadagi koʻk rangli doiralar dengiz oʻtlariga bogʻliq EOU signallari aniqlangan stansiyalarni koʻrsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may-f3.jpg\" alt=\"Dengiz oʻtlaridan olingan EOUning taksonomik oʻziga xosligi va molekulyar tavsifi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Dengiz oʻtlaridan olingan EOUning taksonomik oʻziga xosligi va molekulyar tavsifi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Dengiz oʻtlaridan olingan EOUning taksonomik oʻziga xosligi va molekulyar tavsifi. (A) Makroalglar va fitoplankton oʻrtasidagi noyob va umumiy MFni koʻrsatadigan UpSet grafigi. (B) Makroalglar va fitoplankton oʻrtasidagi Jaccard oʻxshashlik indekslarining ierarxik klasterlash issiqlik xaritasi. (C) Dengiz oʻtlariga bogʻliq LDOC va RDOC fraksiyalarining molekulyar tarkibini solishtiruvchi Van Krevelen diagrammalari. (D) Dengiz oʻtlariga bogʻliq LDOC va RDOCdagi birikmalar sinflari boʻyicha MF soni. Cond., kondensatsiyalangan; HC, uglevodorod; Unsat., toʻyinmagan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may-f4.jpg\" alt=\"Dengiz oʻtlariga bogʻliq labil (Kelp-LDOC) va rekaltsitrant (Kelp-RDOC) EOU fraksiyalarida MRS taqsimoti.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Dengiz oʻtlariga bogʻliq labil (Kelp-LDOC) va rekaltsitrant (Kelp-RDOC) EOU fraksiyalarida MRS taqsimoti.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Dengiz oʻtlariga bogʻliq labil (Kelp-LDOC) va rekaltsitrant (Kelp-RDOC) EOU fraksiyalarida MRS taqsimoti. (A) Kelp-RDOCni Kelp-LDOCdan ajratib turuvchi RF tomonidan aniqlangan dominant molekulyar indekslarning (AImod, DBE, GFE, H/C va NOSC) z-balli masshtablangan qiymatlarini koʻrsatuvchi issiqlik xaritasi. (B) Kelp-LDOC va Kelp-RDOC fraksiyalarida MRS qiymatlarining taqsimotini tasvirlovchi skripka diagrammasi. Qizil nuqtali chiziq bashorat qilingan MRS chegarasini bildiradi. Guruh farqining taʼsir hajmi Koen d (d = 0,87) bilan miqdoriy aniqlanadi, bu molekulyar rekaltsitrantlikdagi sezilarli oʻzgarishni aks ettiradi. (C) Molekulyar darajadagi indekslarning (MRS, AImod, DBE, NOSC, H/C, O/C va GFE) Bray-Kertis farqlariga asoslangan Kelp-LDOC va Kelp-RDOC fraksiyalarining PCoA tahlili. Nuqtalar fraksiyalar boʻyicha ranglangan alohida MF profillarini ifodalaydi; toʻldirilgan olmoslar guruh sentroidlarini (koʻp oʻlchovli oʻrtacha) bildiradi. Ellipsalar 95% ishonch mintaqalarini koʻrsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may-f5.jpg\" alt=\"Dengiz oʻtlariga bogʻliq EOU MFlarining tarmoq sharhi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Dengiz oʻtlariga bogʻliq EOU MFlarining tarmoq sharhi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Dengiz oʻtlariga bogʻliq EOU MFlarining tarmoq sharhi. (A) Molekulyar indekslar oʻrtasidagi korrelyatsiyalarga asoslangan dengiz oʻtlariga bogʻliq EOUning molekulyar oʻxshashlik tarmogʻi. Vizualizatsiya uchun faqat korrelyatsiya koeffitsiyenti 0,9 dan yuqori boʻlgan aloqalar koʻrsatilgan. (B) Dengiz oʻtlari, fitoplankton va boshqa makroalglar bilan bogʻliq molekulyar tarmoqlar uchun global tarmoq xususiyatlarini (oʻrtacha yoʻl uzunligi, global tranzitivlik, modullik va tarmoq zichligi) umumlashtiruvchi ustunli diagrammalar. (C) Uch guruh oʻrtasidagi alohida MFlarning mahalliy klasterlash koeffitsiyentlarini solishtiruvchi skripka diagrammalari. (D) Har bir tarmoq ichidagi molekulalarning nisbiy koʻprik rolini ifodalovchi oraliq markazlikni (betweenness centrality) uch guruh boʻylab solishtiruvchi skripka diagrammalari. Ustiga qoʻyilgan nuqtalar alohida MFlarni ifodalaydi (aniqlik uchun siljitilgan). Oq olmoslar guruh oʻrtachalarini bildiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may-f6.jpg\" alt=\"Dunyodagi okeanlarda laminariya bilan bogʻliq erigan organik uglerod (DOC) molekulyar formulalarining (MF) tarqalishi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Dunyodagi okeanlarda laminariya bilan bogʻliq erigan organik uglerod (DOC) molekulyar formulalarining (MF) tarqalishi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Dunyodagi okeanlarda laminariya bilan bogʻliq erigan organik uglerod (DOC) molekulyar formulalarining (MF) tarqalishi. (A) Laminariya, boshqa makro-suvoʻtlar va fitoplankton bilan bogʻliq DOC molekulyar formulalari aniqlangan okean stansiyalari xaritasi. Okean MF maʼlumotlar toʻplami Bercovici va boshqalar (106, 107) hamda Stubbins va Dittmar (71) ishlari asosida tuzilgan. Och koʻk rang bilan laminariya (Saccharina sp.) yashaydigan qirgʻoq hududlari koʻrsatilgan (yashash muhiti taqsimoti Eger va boshqalar (108) boʻyicha). (B) GODOC-MS maʼlumotlar toʻplamida aniqlangan fitoplankton, laminariya va boshqa makro-suvoʻtlar bilan bogʻliq DOC molekulyar formulalarining foiz nisbatini koʻrsatuvchi ustunli diagramma. (C) Har bir chuqurlik zonasida laminariya bilan bogʻliq labil (LDOC), rekaltsitrant (RDOC) erigan organik uglerod va boshqa okean MFlarining nisbiy tarkibini koʻrsatuvchi yigʻma ustunli diagramma. Foizlar ustunlar ichida koʻrsatilgan; oʻq uzilishi 93% dan yuqori boʻlgan kichik komponentlarni taʼkidlaydi. (D) Chuqurlik zonalari boʻylab laminariya bilan bogʻliq labil va rekaltsitrant DOC uchun MRS taqsimotini koʻrsatuvchi skripka diagrammalari. Alohida MFlar nuqtalar koʻrinishida tasvirlangan; ustiga qoʻyilgan quti diagrammalari kvartillararo masofa va medianalarni koʻrsatadi, yulduzchalar statistik ahamiyatlilik darajasini bildiradi (*P &amp;lt; 0,05 va ****P &amp;lt; 0,0001).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Suvo‘tlari&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;uglerodining&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;taqdiri&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;noma'lum&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Mass-&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;spektrometriya&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;va tahlil&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;NATIJA&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Uglerod okean&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tubiga yetib&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;boradi&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;AHAMIYATI&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Uglerod&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;yutishning&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;yangi&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;mexanizmi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Maqola taqriz qilinadigan Science advances jurnalida nashr etilgan. Ammo bu ham bitta tadqiqo
