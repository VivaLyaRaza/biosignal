        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;em&gt;Tahlil&lt;/em&gt; · 2026-10-03&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Asab tizimiga oid tadqiqotlarni tushunish ko‘ringanidan osonroq. Ushbu qo‘llanma sizga miya haqidagi yangi ilmiy ishlarni mustaqil o‘rganishga yordam beradi.&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"nega-buni-oqish-kerak\"&gt;&lt;a href=\"tutorials/tut-brain.html#nega-buni-oqish-kerak\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nega buni o‘qish kerak&lt;/span&gt;&lt;/a&gt;Nega buni o‘qish kerak&lt;/h2&gt;\n&lt;p&gt;Miya — tanamizning xotira, harakatlar, hissiyotlar va qaror qabul qilishni boshqaradigan eng murakkab a’zosidir. Neyrofan, nevrologiya va hayvonlar xulq-atvoriga doir birlamchi manbalarni o‘qish orqali siz shov-shuvli sarlavhalar va afsonalarga bog‘lanib qolmaysiz. Siz biomeditsinaning haqiqiy rivojini — og‘riqli xotiralar qanday shakllanishidan tortib ilgari davosiz bo‘lgan kasalliklarga qarshi gen terapiyasi yaratilishigacha ko‘ra olasiz.&lt;/p&gt;\n&lt;h2 id=\"asosiy-savollar\"&gt;&lt;a href=\"tutorials/tut-brain.html#asosiy-savollar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiy savollar&lt;/span&gt;&lt;/a&gt;Asosiy savollar&lt;/h2&gt;\n&lt;p&gt;Neyrobiologlar va shifokorlar diqqat markazida turgan asosiy mavzular:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Hujayra tuzilishi va genetika butun neyron tarmoqlarining ishini qanday belgilaydi?&lt;/li&gt;\n&lt;li&gt;Neyrodegenerativ kasalliklar (demensiya, Alsgeymer kasalligi) va irsiy sindromlar nega rivojlanadi?&lt;/li&gt;\n&lt;li&gt;O‘tmishdagi tajriba va muhit — masalan, erta yoshdagi stress — prefrontal po‘stloq va bodomsimon tana orasidagi aloqalarni qanday o‘zgartiradi?&lt;/li&gt;\n&lt;li&gt;Miya subyektiv tajribani, tasvirlar va xotiralarni qanday saqlaydi va qayta tiklaydi?&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"uchraydigan-usullar\"&gt;&lt;a href=\"tutorials/tut-brain.html#uchraydigan-usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Uchraydigan usullar&lt;/span&gt;&lt;/a&gt;Uchraydigan usullar&lt;/h2&gt;\n&lt;p&gt;Maqolalarni tushunish uchun ushbu vositalarni bilish foydali:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Organoidlarda modellashtirish («mini-miyalar»): bemor hujayralaridan o‘stirilgan uch o‘lchamli hujayra tuzilmalari orqali neyronlarning erta rivojlanish bosqichlarini kuzatish.&lt;/li&gt;\n&lt;li&gt;Hayvon modellari: sichqonlarda xulq-atvorni, harakat funksiyalarini baholash va gen terapiyasini in vivo sinash.&lt;/li&gt;\n&lt;li&gt;Hisoblash usullari va neyrotarmoqlar: miya faolligi namunalarini (masalan, medial chakka tarmog‘ida) vizual qo‘zg‘atuvchilar bilan solishtiruvchi algoritmlar.&lt;/li&gt;\n&lt;li&gt;Molekulyar va genetik tahlil: oqsillar (masalan, TDP-43), halqasimon RNK va immunitet hujayralari (mikrogliya) faolligini o‘rganish.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"maqolani-bosqichma-bosqich-oqish\"&gt;&lt;a href=\"tutorials/tut-brain.html#maqolani-bosqichma-bosqich-oqish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Maqolani bosqichma-bosqich o‘qish&lt;/span&gt;&lt;/a&gt;Maqolani bosqichma-bosqich o‘qish&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;Annotatsiya (Abstract): tadqiqotning asosiy xulosasi va maqsadini bilib oling.&lt;/li&gt;\n&lt;li&gt;Kirish (Introduction): muammoning mohiyati va bilimdagi bo‘shliqni tushuning.&lt;/li&gt;\n&lt;li&gt;Model va obyekt: kashfiyot kimda yoki nimada qilingan — inson hujayra madaniyatidami, kemiruvchilardami yoki insonlardami?&lt;/li&gt;\n&lt;li&gt;Natijalar (Results): grafiklar va nazorat guruhi bilan tajriba guruhi orasidagi asosiy farqlarga e’tibor bering.&lt;/li&gt;\n&lt;li&gt;Muhokama va cheklovlar (Discussion): mualliflarning o‘zlari natijalarning chegaralarini ochiq tahlil qiladilar.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"kuchli-yoki-zaif-natija\"&gt;&lt;a href=\"tutorials/tut-brain.html#kuchli-yoki-zaif-natija\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kuchli yoki zaif natija&lt;/span&gt;&lt;/a&gt;Kuchli yoki zaif natija&lt;/h2&gt;\n&lt;p&gt;Natija shunchaki korrelyatsiyani emas, balki sabab-oqibat bog‘liqligini ko‘rsatsa ancha ishonchli hisoblanadi: masalan, ma’lum bir gen faoliyatining to‘xtashi patologiyaga olib kelsa, vektor kiritilishi uni qaytarsa. Tanlanma hajmi, takrorlanuvchanlik va funksional testlar muhimdir. Zaif natijalar ko‘pincha faqat in vitro kuzatuvlar bilan cheklanadi yoki nazorat guruhlari yetarli bo‘lmaydi.&lt;/p&gt;\n&lt;h2 id=\"chiqarilish-maqolalarida-sinab-koring\"&gt;&lt;a href=\"tutorials/tut-brain.html#chiqarilish-maqolalarida-sinab-koring\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Chiqarilish maqolalarida sinab ko‘ring&lt;/span&gt;&lt;/a&gt;Chiqarilish maqolalarida sinab ko‘ring&lt;/h2&gt;\n&lt;p&gt;Ushbu yondashuvni so‘nggi mavzularda sinab ko‘ring:&lt;br /&gt;\n«Почему при болезни Гоше возникают судороги: ответ скрыт в развитии мозга» maqolasida organoidlar usuli neyronlar nuqsonini o‘rganishda qanday yordam berganiga baho bering. «Как детские стрессы перестраивают мозг и усиливают страх» materialida miya zonalari va qo‘rquv reaksiyasi o‘rtasidagi bog‘liqlikni kuzating. «Генная терапия остановила развитие редкого синдрома у мышей» maqolasida esa erta bosqichdagi bir martalik muolajaning ta’sirini tahlil qiling.&lt;/p&gt;\n&lt;h2 id=\"asos-bolgan-maqolalar\"&gt;&lt;a href=\"tutorials/tut-brain.html#asos-bolgan-maqolalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asos bo'lgan maqolalar&lt;/span&gt;&lt;/a&gt;Asos bo'lgan maqolalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html\"&gt;Goshe kasalligida miya nega tutqanoqqa moyil bo'ladi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut.html\"&gt;Miyaning xotira tasvirlarini qanday tiklashi aniqlandi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html\"&gt;Bolalikdagi stress miyani qanday o'zgartiradi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html\"&gt;Gen terapiyasi kam uchraydigan sindromning oldini oldi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html\"&gt;Alzgeymer kasalligida miya hujayralari nima uchun charchaydi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html\"&gt;Miya kasalliklarida oqsil yetishmovchiligi noodatiy halqasimon RNKlarni hosil qiladi&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Tushunchalar: &lt;a href=\"concepts/spec-brain.html\"&gt;Miya va asab tizimi&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Asab tizimiga oid tadqiqotlarni tushunish ko‘ringanidan osonroq. Ushbu qo‘llanma sizga miya haqidagi yangi ilmiy ishlarni mustaqil o‘rganishga yordam beradi."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Miyaga oid maqolalarni qanday o‘qish kerak: neyrobiolog qo‘llanmasi","description":"Asab tizimiga oid tadqiqotlarni tushunish ko‘ringanidan osonroq. Ushbu qo‘llanma sizga miya haqidagi yangi ilmiy ishlarni mustaqil o‘rganishga yordam beradi.","vcsPath":"tutorials/tut-brain.md"},"headings":[{"title":"Nega buni o‘qish kerak","href":"tutorials/tut-brain.html#nega-buni-oqish-kerak","level":2},{"title":"Asosiy savollar","href":"tutorials/tut-brain.html#asosiy-savollar","level":2},{"title":"Uchraydigan usullar","href":"tutorials/tut-brain.ht
