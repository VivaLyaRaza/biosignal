            {"data":{"leading":false,"html":"&lt;p&gt;21 ta maqola&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/optical-microscopy-predictions-of-focal-recurrence-in-gliobl.html\"&gt;OOptik mikroskopiya va sun'iy intellekt glioblastoma retsidivini oldindan aytib beradi&lt;/a&gt; — Yangi algoritm jarrohlik chetlaridagi to'qimalarni tahlil qilib, o'simtaning qayta o'sish xavfi yuqori bo'lgan hududlarini ko'rsatadi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html\"&gt;ОИВ, туберкулез ва малярияни бир вақтда аниқлайдиган CRISPR-тест яратилди&lt;/a&gt; — Олимлар ОИВ, туберкулез, малярия ва дорига чидамлиликни битта тизимда аниқлаш усулини ишлаб чиқдилар.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html\"&gt;Goshe kasalligida miya nega tutqanoqqa moyil bo'ladi&lt;/a&gt; — Olimlar bemor hujayralaridan «mini-miya» o'stirish orqali genetik kasallikning neyronlarga ta'sirini aniqlashdi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/eggerthella-lenta-disrupts-the-gut-vascular-barrier-to-drive.html\"&gt;Ichakdagi bakteriya yo‘g‘on ichak saratonining jigarga tarqalishiga yordam beradi&lt;/a&gt; — Mikroblar ichak qon tomir to‘sig‘ini buzib, o‘sma hujayralarining qon oqimiga o‘tishiga yo‘l ochadi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html\"&gt;SpiraMed: miyaga dori yetkazib berishning yangi spiral usuli&lt;/a&gt; — Muhandislar miyaga hujayra va gen terapiyasini bitta teshik orqali kiritish imkonini beruvchi moslashuvchan kateterni ishlab chiqishdi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/single-cell-atlas-of-transcriptomic-vulnerability-across-bra.html\"&gt;Miya zaifligi xaritasi: kasalliklar hujayralarni qanday o'zgartiradi&lt;/a&gt; — Olimlar miya kasalliklarining hujayraviy darajadagi umumiy belgilarini aniqlash uchun 6 milliondan ortiq hujayradan iborat ulkan atlas y ab chiqishdi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html\"&gt;Immun tizimining erta qarishi: KRAS oqsili yurak kasalliklariga qanday ta'sir qiladi&lt;/a&gt; — Olimlar immun hujayralarining erta qarishi va erta ateroskleroz o'rtasidagi molekulyar bog'liqlikni aniqladilar.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html\"&gt;Oqsil tuzilishini yuzlab marta kamroq ma'lumot bilan aniqlash&lt;/a&gt; — Fold'EM algoritmi oqsil modellarini yagona tasvirlar asosida qayta tiklash imkonini beradi, bu esa murakkab 3D xaritalarni talab qilmaydi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html\"&gt;Nima uchun ba'zi odamlar sepsis qarshisida ojiz: javob kam sonli xalqlar genida yashiringan&lt;/a&gt; — Genetiklar Qatar aholisida o'limga olib keluvchi yallig'lanishni o'z vaqtida to'xtatishga xalaqit beradigan noyob mutatsiyani aniqlashdi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/a-designed-ubiquitin-binding-protein-selectively-enriches-an.html\"&gt;Erkin ubiquitin: olimlar hujayradagi «ko‘rinmas» regulyatorni kuzatishni o‘rgandi&lt;/a&gt; — Yangi UBiP10 oqsilli zondi erkin ubiquitinni aniqlash va uning hujayra hayotidagi rolini o‘rganish imkonini beradi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html\"&gt;Yurakdagi umumiy arterial o‘zak: qon oqimi qanday kechadi?&lt;/a&gt; — Olimlar ilk bor yurakning kam uchraydigan nuqsoni uchun raqamli model yaratib, qon aralashuvi va klapanlar ishini tahlil qilishdi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html\"&gt;LLM biologik ma'lumotlar bazasidagi tartibsizlikni bartaraf eta oladimi&lt;/a&gt; — Millionlab laboratoriya tajribalari noto'g'ri tasniflangan. Tadqiqotchilar sun'iy intellekt bu muammoni hal qila olishini tekshirib ko'rishdi.
