            {"data":{"leading":false,"html":"&lt;p&gt;30 ta maqola&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html\"&gt;Bolalikdagi stress miyani qanday o'zgartiradi&lt;/a&gt; — Erta yoshdagi stress prefrontal qobiq va amygdala neyronlari ishini o'zgartirib, o'smirlarda qo'rquv reaktsiyasini kuchaytiradi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun.html\"&gt;AKAP11 genidagi noyob mutatsiya xavotir va depressiyani qanday keltirib chiqaradi&lt;/a&gt; — Olimlar inson mutatsiyasiga ega sichqon modelini yaratib, genetik nosozlik neyronlar ishini qanday buzishini ko'rsatdi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html\"&gt;Ayol organizmi miyani autizmdan qanday himoya qiladi&lt;/a&gt; — Olimlar qizlarda autizm nima uchun kamroq uchrashini aniqlashdi: buning sababi jinsiy xromosomalardir.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html\"&gt;Gen terapiyasi kam uchraydigan sindromning oldini oldi&lt;/a&gt; — Hayotning ilk kunlarida virusli vektorning kiritilishi og'ir kasallikda harakat va neyronlar yemirilishining oldini oldi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html\"&gt;Miya tanishni yangidan qanday farqlaydi: xotira hujayra kodi topildi&lt;/a&gt; — Olimlar ilk bor inson miyasidagi alohida neyronlar o'xshash xotiralarni qanday ajratishini qayd etishdi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html\"&gt;Inson miyasi ijtimoiy qoidalarni qanday qayta ishlaydi&lt;/a&gt; — Olimlar ijtimoiy me'yorlarni baholash vaqtida miyaning alohida neyronlari qanday ishlashini aniqladilar.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html\"&gt;Alzgeymer kasalligida miya hujayralari nima uchun charchaydi&lt;/a&gt; — Miyaning himoya hujayralari oqsil yig'indilari bilan kurashda ichki zaxiralarini yo'qotadi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html\"&gt;Яширин ҳалқасимон РНК молекулалари хавфли нейродегенератив касалликни фош этади&lt;/a&gt; — Миядаги муҳим оқсилнинг ишдан чиқиши ғайritabiiy ҳалқасимон РНКлар ҳосил бўлишига олиб келади ва янги ташхис усулларини очади.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html\"&gt;Miya san'at asarini tushunishdan qanday zavq oladi&lt;/a&gt; — Olimlar oddiy qiziquvchanlikdan to to'satdan anglash va zavqlanishgacha bo'lgan yo'lni kuzatishdi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html\"&gt;CRISPR yordamida mRNK migratsiyasini to'xtatish&lt;/a&gt; — Olimlar hujayralardagi molekulyar yo'llarni o'zgartirib, o'simta hujayralarining tarqalishini cheklashdi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html\"&gt;Miya kasalliklarida oqsil yetishmovchiligi noodatiy halqasimon RNKlarni hosil qiladi&lt;/a&gt; — TDP-43 oqsili yo'qolganda neyronlarda qanday qilib barqaror va yashirin halqasimon RNKlar paydo bo'lishi aniqlandi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html\"&gt;Infarktdan keyin yurak jigar yordamida qonni qanday boshqaradi&lt;/a&gt; — Olimlar yurak va jigar o'rtasida infarktdan keyin trombotsitlar miqdorini tiklovchi to'g'ridan-to'g'ri aloqani aniqladilar.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html\"&gt;Oqsillarni loyihalashni tezlashtiruvchi sun'iy intellekt tizimi&lt;/a&gt; — Sun'iy intellekt yangi molekulalarni yaratishda hisoblash resurslarini oqilona taqsimlashni o'rgandi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html\"&gt;Rak terapiyasida immun tizimini qanday tiklash mumkin&lt;/a&gt; — Yangi yondashuv onkologiyada t-hujayralarning charchab qolishining oldini oladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html\"&gt;Gormonlar autizm va miya rivojlanishi genlariga qanday ta'sir qiladi&lt;/a&gt; — Olimlar estradiolning autizm va miya rivojlanishi buzilishlari bilan bog'liq 36 ta gengae ta'sirini o'rganib chiqdi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html\"&gt;Balamuthia mandrillaris xavfli amebasi uchun yangi tezkor test&lt;/a&gt; — Kam uchraydigan va o'limga olib keluvchi ameba uchun ilk ekspress-test yaratildi, u oddiy klinikalarda ham tezkor tashxis qo'yish imkonini beradi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html\"&gt;Olimlar kodlovchi halqasimon RNK larning mavjudligini birinchi marta isbotladilar&lt;/a&gt; — Olimlar laboratoriyada DNK siz yashovchi va oqsil kodlaydigan sirli halqasimon RNK larning mavjudligini isbotladilar.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html\"&gt;Altsgeymer kasalligida hujayralararo zanjirli shikastlanish mexanizmi&lt;/a&gt; — Toksik oqsillar hujayralar orasida pufakchalar orqali uzrilib, qo'shni neyronlarni nobud qiladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html\"&gt;Afaziya va ong: nima uchun ba'zilar tasavvur qila olmaydi?&lt;/a&gt; — Olimlar tug'ma afantaziyaga ega odamlarning miyasida nima o'zgarganini aniqlashdi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html\"&gt;Uzluqli uyqu miyadagi tutqanoq faolligini qanday qo'zg'atadi&lt;/a&gt; — Mikro uyg'onishlar nima uchun tutqanoq tarmoqlarini kengaytirmasdan neyronlar faolligini oshirishi aniqlandi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html\"&gt;Kompilyator va xotirani birlashtiruvchi yangi memristor chipi&lt;/a&gt; — Memristorlar asosidagi yangi arxitektura ma'lumotlarni qayta ishlash tezligini keskin oshiradi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html\"&gt;Plscr1 oqsili sichqon norovirusining kirishini to'xtatadi&lt;/a&gt; — Olimlar norovirusning hujayraga kirishini to'xtatuvchi muhim hujayra oqsilini aniqladilar.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html\"&gt;Kalamushлар қоқу қуshlarini qanday chetlab o‘tadi&lt;/a&gt; — Nodir va halokatli voqealar hayvonlarning tanlovini kundalik rutindan ko‘ra ko‘proq boshqaradi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html\"&gt;Gripp miyada iz qoldiradi: LRRK2 mutatsiyasi oqsil o‘zgarishlarini qanday qo‘zg‘atadi&lt;/a&gt; — Boshdan kechirilgan gripp LRRK2 mutatsiyasiga ega organizmda neyrodegeneratsiyaning dastlabki bosqichlarini eslatuvchi o‘zgarishlarni boshlaydi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-25/infants-at-high-and-low-likelihood-for-autism-show-different.html\"&gt;Autizm xavfi bor go'daklar nutqni qanday idrok etadi&lt;/a&gt; — Tadqiqotchilar autizmga moyilligi turlicha bo'lgan chaqaloqlarning nutq oqimini qanday tushunishini aniqlashdi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-25/combination-of-alk2-and-cholesterol-targeting-agents-exploit.html\"&gt;Мия ўсмасини даволашнинг янги усули холестерин алмашинувидан топилди&lt;/a&gt; — Олимлар холестерин алмашинувини бостириш мия глиомасини мақсадли терапияга сезувчан қилишини аниқлади.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html\"&gt;Miyamiz
