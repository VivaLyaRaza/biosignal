значимых взаимодействий связывания.&lt;/p&gt;\n&lt;h4 id=\"411-molekulyarno-dinamicheskoe-modelirovanie\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#411-molekulyarno-dinamicheskoe-modelirovanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.11. Молекулярно-динамическое моделирование&lt;/span&gt;&lt;/a&gt;4.11. Молекулярно-динамическое моделирование&lt;/h4&gt;\n&lt;p&gt;Молекулярно-динамическое (МД) моделирование проводилось с использованием GROMACS 2022.3 в течение 100 нс, при этом начальная конформация была получена из оптимальной позы связывания низкомолекулярного лиганда с целевым белком, определенной с помощью AutoDock Vina. Для белков использовалось силовое поле AMBER14SB и модель воды TIP3P, в то время как для малых молекул применялось силовое поле GAFF. Впоследствии белок и низкомолекулярные лиганды были объединены для построения системы моделирования комплексов. Моделирование выполнялось в условиях постоянной температуры и давления в сочетании с периодическими граничными условиями. Во время МД-моделирования все ограничения, связанные с водородными связями, выполнялись с использованием алгоритма LINCS с шагом интегрирования 2 фс. Пороговое значение для невалентных взаимодействий было установлено на уровне 10 Å и обновлялось с интервалом в 10 шагов. Метод температурной связи V-rescale использовался для регулирования температуры моделирования до 298 К, а метод Берендсена применялся для контроля давления на уровне 1 бар. С этой целью были проведены равновесные симуляции NVT и NPT при 298 К в течение 100 пс, а МД-моделирование для системы комплекса выполнялось в течение 100 нс с сохранением конформации каждые 10 пс. После завершения моделирования траектории симуляции были подвергнуты анализу с использованием VMD и PyMOL. Кроме того, анализ свободной энергии связывания методом молекулярной механики с использованием площади поверхности Пуассона-Больцмана (MMPBSA) между белком и низкомолекулярным лигандом был выполнен с помощью программы g_mmpbsa. Полученные траектории были проанализированы, а соответствующие графики данных были построены с использованием QtGrace (версия 0.2.7) и пользовательских скриптов Python для визуализации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Молекулярная динамика (МД) — это компьютерный метод моделирования физических движений атомов и молекул, позволяющий изучать стабильность и поведение белково-лигандных комплексов во времени.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"412-ogranicheniya\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#412-ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.12. Ограничения&lt;/span&gt;&lt;/a&gt;4.12. Ограничения&lt;/h4&gt;\n&lt;p&gt;Настоящее исследование не лишено ограничений. Во-первых, отсутствовали проспективные когорты пациентов для независимой валидации наших результатов. Во-вторых, исследование было затруднено отсутствием наборов данных по одному и тому же типу ткани, в частности, крови при пародонтите (PD) или синовиальной оболочки при системном ювенильном идиопатическом артрите (sJIA), которые были необходимы для облегчения сравнения заболеваний при использовании сопоставимых тканей. Это ограничение возникло из-за использования в исследовании данных, полученных из десны (PD) и периферической крови (sJIA). В-третьих, отсутствовала экспериментальная валидация in vitro или in vivo для выявленных генов, паттернов иммунной инфильтрации и взаимодействий «лекарство-мишень», поскольку все результаты являются вычислительными предсказаниями. В-четвертых, нам не хватало прямых функциональных анализов для подтверждения связывания и активности состыкованных соединений. Пятая проблема касается методологии, используемой при определении фракций иммунных клеток. Вместо того чтобы полагаться на экспериментальные измерения, эти фракции были выведены путем применения алгоритма. Наконец, размер выборки для конкретных анализов был ограничен доступностью общедоступных данных.&lt;/p&gt;\n&lt;h4 id=\"vspomogatelnaya-informaciya\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#vspomogatelnaya-informaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вспомогательная информация&lt;/span&gt;&lt;/a&gt;Вспомогательная информация&lt;/h4&gt;\n&lt;p&gt;Рис. S1. На этом рисунке представлен анализ чувствительности количества модулей WGCNA при различных порогах фильтрации генов для наборов данных PD (слева) и sJIA (справа). (TIF)&lt;/p&gt;\n&lt;p&gt;Рис. S2. Этот рисунок представляет собой диаграмму рассеяния принадлежности модуля (MM) к значимости гена (GS) в анализе WGCNA.&lt;/p&gt;\n&lt;p&gt;Таблица S1. В этой таблице представлены значения параметров моделей Ridge и AdaBoost, полученные в результате интерпретационного анализа на основе SHAP для наборов данных PD и sJIA соответственно. (XLSX)&lt;/p&gt;\n&lt;p&gt;Код S1. R-скрипт для пакетного объединения набора данных sJIA. (R)&lt;/p&gt;\n&lt;p&gt;Код S2. R-скрипт для анализа сетей коэкспрессии генов (WGCNA). (R)&lt;/p&gt;\n&lt;p&gt;Код S3. R-скрипт для обучения и валидации 175 моделей машинного обучения. (R)&lt;/p&gt;\n&lt;p&gt;Код S4. R-скрипт для интерпретационного анализа на основе SHAP. (R)&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Связь&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;пародонтита и&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сЮИА&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Биоинформатика&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;и машинное&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;обучение&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Идентификация&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;37 общих генов&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Новые цели для&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;терапии&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале PLoS computational biology. Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;PLoS computational biology (Europe PMC)&lt;/td&gt;\n&lt;td&gt;infectious diseases&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Deng Q, Wang J, Wang X, Qi L.&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-
