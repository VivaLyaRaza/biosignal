        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"209\" cy=\"84\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"571\" cy=\"244\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · INFECTIOUS DISEASES   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Скрытая связь: что общего у&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;болезней десен и системного&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;артрита&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont-f1.jpg\" alt=\"Рис. 1. Блок-схема исследования.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1. Блок-схема исследования.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"concepts/periodontitis.html\"&gt;Пародонтит&lt;/a&gt; и &lt;a href=\"concepts/systemic-juvenile-idiopathic-arthritis.html\"&gt;системный ювенильный идиопатический артрит&lt;/a&gt; (сЮИА) часто встречаются вместе, но причины этой связи оставались загадкой. Исследователи проанализировали генетические данные пациентов и выявили 37 общих генов, участвующих в воспалительных процессах. Среди них выделили ген SELP, который может стать ключевым маркером для диагностики обоих состояний.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Выявлено 37 общих генов, связанных с воспалительными путями IL-17 и NF-κB.&lt;/li&gt;\n&lt;li&gt;Ген SELP определен как наиболее стабильный диагностический биомаркер для обоих заболеваний.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/molekulyarnyy-doking.html\"&gt;Молекулярный докинг&lt;/a&gt; подтвердил потенциал кемпферола в воздействии на белки IL1B и ITGAM.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Авторы использовали методы биоинформатики и машинного обучения для анализа данных из базы GEO. В исследование включили 175 прогностических моделей, среди которых комбинация Ridge и AdaBoost показала наилучшую точность. Ключевые гены, такие как SELP, CXCL1, FAM46C, LGALSL, ELOVL4 и VCAN, оказались вовлечены в пути передачи сигналов IL-17 и NF-κB, характерные для хронического воспаления.&lt;/p&gt;\n&lt;p&gt;Для проверки терапевтического потенциала ученые применили молекулярный докинг и 100-наносекундное молекулярно-динамическое моделирование. Было установлено, что дезоксихолевая кислота и кемпферол демонстрируют высокую аффинность связывания с белками-мишенями MMP1, IL1B и ITGAM. Эти результаты указывают на общие иммунологические механизмы, включая повышенную активность нейтрофилов и снижение числа CD8+ Т-лимфоцитов, что открывает новые пути для разработки таргетной терапии.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа основана на биоинформатическом анализе существующих баз данных и требует экспериментального подтверждения in vivo.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Пародонтит (PD) и системный ювенильный идиопатический артрит (sJIA) — это хронические воспалительные заболевания с потенциальными клиническими связями, однако их общие молекулярные механизмы остаются неясными: пациенты с JIA сталкиваются с повышенным риском заболеваний пародонта, височно-нижнечелюстной сустав, поражаемый при JIA, имеет общие пути воспаления с PD, клетки Th17 способствуют развитию обоих состояний, а терапия глюкокортикоидами может усугублять уязвимость пародонта. Целью данного исследования было изучение общих механизмов и потенциальных терапевтических мишеней PD и sJIA с использованием данных экспрессии генов из базы данных GEO и проведение комплексного биоинформатического анализа, включая анализ дифференциально экспрессируемых генов, взвешенный анализ сетей коэкспрессии генов (&lt;a href=\"concepts/wgcna.html\"&gt;WGCNA&lt;/a&gt;), функциональный анализ обогащения, построение сети белок-белковых взаимодействий и &lt;a href=\"concepts/mashinnoe-obuchenie.html\"&gt;машинное обучение&lt;/a&gt; по 175 прогностическим моделям, где комбинация Ridge + AdaBoost показала наилучшую эффективность. Далее были использованы методы SHapley Additive exPlanations (SHAP) для интерпретируемости модели, CIBERSORT для оценки иммунной инфильтрации, а также молекулярный докинг со 100-нс молекулярно-динамическим моделированием для валидации терапевтических мишеней. Мы выявили 37 общих генов-кандидатов для PD и sJIA, которые были значительно обогащены в путях IL-17, NF-κB, ревматоидного артрита и липидного атеросклероза. Скрининг с помощью машинного обучения позволил отобрать шесть ключевых диагностических генов (FAM46C, CXCL1, SELP, LGALSL, ELOVL4, VCAN), при этом SELP продемонстрировал наиболее устойчивую диагностическую ценность в разных моделях и наборах данных (&lt;a href=\"concepts/area-under-the-curve.html\"&gt;AUC&lt;/a&gt; &amp;gt; 0,8); анализ SHAP подтвердил SELP как стабильный предиктор риска во всех моделях, тогда как CXCL1 неизменно проявлял защитные эффекты. Иммунная инфильтрация выявила общее повышение уровня нейтрофилов и снижение CD8⁺ T-клеток, а также консервативные корреляции CXCL1 и SELP с нейтрофилами и покоящимися тучными клетками, а FAM46C — с плазматическими клетками. Анализ сети «лекарство-мишень» определил IL1B, MMP1 и ITGAM как основные мишени, а молекулярный докинг показал высокую аффинность связывания для дезоксихолевой кислоты с MMP1 (-7,6 ккал/моль), кемпферола с IL1B (-7,2 ккал/моль), кемпферола с ITGAM (-6,9 ккал/моль), при этом молекулярно-динамическое моделирование подтвердило стабильное и специфическое связывание. В совокупности данное исследование изучает общие генетические и иммунологические характеристики PD и sJIA, предполагает, что SELP может служить критическим диагностическим биомаркером для обоих заболеваний, и предлагает новые подходы к пониманию их патогенеза и потенциальных терапевтических мишеней, требующих дальнейшей экспериментальной проверки.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование выявило 37 общих генов для PD и sJIA, при этом SELP (&lt;a href=\"concepts/roc-auc.html\"&gt;AUC&lt;/a&gt; &amp;gt; 0,8) признан наиболее надежным диагностическим маркером, а IL1B, MMP1 и ITGAM — перспективными терапевтическими мишенями.&lt;br /&gt;\n[!tip] WGCNA — метод группировки генов с похожими паттернами экспрессии, а SHAP — инструмент для объяснения решений моделей машинного обучения, показывающий вклад каждого фактора в итоговый прогноз.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Пародонтит, распространенное заболевание полости рта, и системный ювенильный идиопатический артрит, редкое аутоиммунное состояние у детей, клинически связаны, однако их общая молекулярная основа остается неясной. Анализируя данные экспрессии генов у пациентов с каждым из заболеваний с помощью сетевых подходов и машинного обучения, мы выявили 37 генов, которые обычно изменяются при обоих состояниях. Среди них мы определили SELP как наиболее сильного кандидата на роль общего диагностического маркера. Мы также обнаружили, что оба заболевания связаны с повышенным уровнем нейтрофилов и снижением количества CD8⁺ T-клеток, и определили несколько природных соединений, которые могут связываться с ключевыми белками, провоцирующими эти заболевания. Наши результаты создают основу для понимания того, как эти два, казалось бы, различных состояния могут быть связаны на молекулярном уровне, и выделяют SELP и другие гены в качестве потенциальных мишеней для будущей диагностики или терапии. Однако это вычислительные прогнозы, которые требуют экспериментальной и клинической проверки, прежде чем они смогут быть использованы в лечении пациентов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Все результаты получены методами биоинформатического моделирования и требуют обязательного подтверждения в лабораторных экспериментах и клинических исследованиях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Пародонтит (ПД) — распространенное заболевание, встречающееся у населения по всему миру. Его распространенность оценивается в 11%. Клинические проявления ПД в основном выражаются в деградации десны, пародонтальных тканей, альвеолярной кости и дентина вследствие бактериальной инфекции. Этиология заболевания является результатом взаимодействия между оральными бактериями и иммунной системой хозяина, что приводит к воспалению и иммунным ответам, опосредованным собственным иммунным ответом организма. Существующие данные указывают на связь между ПД и рядом системных заболеваний, включая аутоиммунные расстройства. Системный ювенильный идиопатический артрит (сЮИА) — редкая форма ювенильного идиопатического артрита (ЮИА), характеризующаяся лихорадкой, кожными высыпаниями и системным воспалением, распространенность которой оценивается в диапазоне от 10% до 20% от всех случаев ЮИА. Пародонтит, распространенное хроническое инфекционно-воспалительное заболевание полости рта, привлек значительное внимание в междисциплинарных исследованиях из-за своей связи с аутоиммунными заболеваниями. По сравнению с другими типами ЮИА, системный воспалительный шторм при сЮИА делает его более уникальным в плане взаимодействия с другими типами ЮИА.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Пародонтит поражает 11% населения и связан с аутоиммунными патологиями, при этом сЮИА составляет 10–20% случаев ЮИА, демонстрируя уникальный профиль системного воспаления.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Исследования показали, что пациенты с ЮИА более склонны к развитию тяжелых заболеваний десен и пародонтита. В случаях ЮИА часто поражается височно-нижнечелюстной сустав (ВНЧС), и существует связь между ЮИА и пародонтитом, основанная на сходстве клинических воспалительных процессов этих двух состояний. Th17-клетки играют решающую роль во многих аутоиммунных заболеваниях, и их высвобождение способствует развитию ПД, в то время как клетки, связанные с осью Th1/Th17/Th22, участвуют в остеоартрите височно-нижнечелюстного сустава. Кроме того, лечение сЮИА может влиять на здоровье полости рта путем регуляции иммунной системы или изменения оральной микросреды. Например, глюкокортикоиды (такие как преднизолон) обычно используются для лечения ЮИА, но их длительное применение может привести к разрастанию десен и нарушению баланса оральных бактерий, повышая риск пародонтита. Исследования показали, что у пациентов, длительно принимающих глюкокортикоиды, вероятность развития заболеваний десен выше на 20%–30%. Однако на сегодняшний день недостаточно доказательств, связывающих ПД и сЮИА. В данном исследовании использовались методы биоинформатики для анализа данных из базы данных GEO с целью выявления общих генетических факторов ПД и сЮИА. Целью было определение генов, вызывающих эти два заболевания, их иммунных характеристик и механизмов, лежащих в их основе. Кроме того, мы стремились выявить потенциальные терапевтические мишени для обоих заболеваний. Общий рабочий процесс представлен на Рис. 1.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont-f1.jpg\" alt=\"Рис. 1. Блок-схема исследования.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1. Блок-схема исследования.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"2-rezultaty-21-identifikaciya-differencialno-ekspressiruyushihsya-genov-mezhdu-pd-i-syuia\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#2-rezultaty-21-identifikaciya-differencialno-ekspressiruyushihsya-genov-mezhdu-pd-i-syuia\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Результаты 2.1. Идентификация дифференциально экспрессирующихся генов между ПД и сЮИА&lt;/span&gt;&lt;/a&gt;2. Результаты 2.1. Идентификация дифференциально экспрессирующихся генов между ПД и сЮИА&lt;/h4&gt;\n&lt;p&gt;Чтобы уменьшить влияние эффектов партии, мы объединили наборы данных GSE80060 и GSE7753, а также стандартизировали матрицу экспрессии генов, полученную в результате объединения. &lt;a href=\"concepts/pca.html\"&gt;PCA&lt;/a&gt;-анализ составляющих элементов показывает, что данные с гомогенностью демонстрируют большую степень агрегации (Рис. 2A и 2B). Как показал анализ различий в экспрессии генов, было идентифицировано 734 дифференциально экспрессирующихся гена (&lt;a href=\"concepts/gene-expression.html\"&gt;DEG&lt;/a&gt;), связанных с ПД, из которых 491 ген был с повышенной экспрессией и 243 гена — с пониженной, что продемонстрировано на вулканической диаграмме (Рис. 2C). Тепловая карта выделяет 25 наиболее значимых DEG, демонстрируя как повышенную, так и пониженную экспрессию (Рис. 2E). Кроме того, комплексный скрининг для сЮИА выявил 1231 DEG. Тепловая карта демонстрирует наличие 685 генов с повышенной экспрессией и 546 генов с пониженной экспрессией (Рис. 2D). Более того, тепловая карта выделяет 25 наиболее значимых DEG, демонстрируя как повышенную, так и пониженную экспрессию (Рис. 2F).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont-f2.jpg\" alt=\"Рис. 2. Идентификация дифференциально экспрессирующихся генов (DEGs).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 2. Идентификация дифференциально экспрессирующихся генов (DEGs).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 2. Идентификация дифференциально экспрессирующихся генов (DEGs). (A, B) Точечная диаграмма PCA показывает четкое разделение между наборами данных GSE7753 и GSE80060 до и после коррекции пакетного эффекта, что указывает на снижение влияния пакетных эффектов. (C, D) Вулканические графики, отображающие DEGs для наборов данных PD (GSE16134) и sJIA (GSE7753, GSE80060) соответственно. Значительно повышенные гены показаны красным цветом, значительно пониженные гены — синим, а незначимые гены — серым. (E, F) Тепловые карты, иллюстрирующие паттерны экспрессии репрезентативных 25 значительно повышенных и пониженных DEGs, идентифицированных в наборах данных PD (GSE16134) и sJIA (GSE7753, GSE80060).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PCA (метод главных компонент) — статистический метод для снижения размерности данных, позволяющий визуализировать сходство между группами образцов, а DEG — гены, уровень активности которых значимо различается между состояниями болезни и нормы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"22-vzveshennyj-analiz-koekspressionnyh-setej-genov-pri-bp-i-syuia\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#22-vzveshennyj-analiz-koekspressionnyh-setej-genov-pri-bp-i-syuia\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.2. Взвешенный анализ коэкспрессионных сетей генов при БП и сЮИА&lt;/span&gt;&lt;/a&gt;2.2. Взвешенный анализ коэкспрессионных сетей генов при БП и сЮИА&lt;/h4&gt;\n&lt;p&gt;Анализ WGCNA был выполнен для интегрированного набора данных, включающего как БП, так и сЮИА. Для обеспечения надежного выявления модулей мы провели систематический &lt;a href=\"concepts/analiz-chuvstvitelnosti.html\"&gt;анализ чувствительности&lt;/a&gt; на независимых наборах данных, чтобы определить оптимальный критерий фильтрации генов. На основе этого анализа для построения сети были отобраны гены со стандартным отклонением (SD) &amp;gt; 0,5 по образцам, так как этот порог обеспечил наилучший баланс между сохранением достаточного количества генов и поддержанием стабильной структуры модулей, тогда как более низкие пороги (SD = 0,3) привносили избыточный шум, а более высокие (SD ≥ 0,7) приводили к существенной потере биологической информации (чувствительность количества модулей показана на Рис. S1A для БП и Рис. S1B для сЮИА; соответствующие тепловые карты сходства Жаккара показаны на Рис. S1C для БП и Рис. S1D для сЮИА). Далее были определены оптимальные степени мягкого порогового значения (soft-thresholding powers): 6 для БП и 12 для сЮИА (Рис. 3A и 3B). Впоследствии высокоподобные модули были объединены на основе сходства сетей собственных генов (eigengene network similarity), а неназначенный серый модуль (представляющий гены без четких паттернов коэкспрессии) был исключен из дальнейшего анализа (Рис. 3C и 3D). Этот процесс позволил получить 6 эффективных коэкспрессионных модулей для набора данных БП и 9 для набора данных сЮИА соответственно. Наконец, была определена корреляция между модулями и признаками. В рамках БП бирюзовые модули демонстрируют наиболее сильную корреляцию с признаками БП (r = 0,67) (Рис. 3E). В случае сЮИА розовый, зеленый и коричневый модули показали наиболее высокие положительные корреляции с признаком сЮИА (r &amp;gt; 0,6) (Рис. 3F). Значимость генов (GS) и принадлежность к модулю (MM) показали сильные положительные корреляции с коэффициентами корреляции r = 0,986 для бирюзового модуля (БП) (Рис. S2A), r = 0,607 для розового модуля (Рис. S2B), r = 0,86 для зеленого модуля (Рис. S2C) и r = 0,965 для коричневого модуля (сЮИА) (Рис. S2D).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont-f3.jpg\" alt=\"Рис. 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 3&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анализ WGCNA выявил 6 модулей для БП и 9 для сЮИА, при этом бирюзовый модуль (БП, r=0,67) и розовый, зеленый и коричневый модули (сЮИА, r&amp;gt;0,6) показали наиболее значимые корреляции с фенотипами заболеваний.&lt;br /&gt;\n[!tip] WGCNA — метод статистического анализа, позволяющий сгруппировать гены в модули на основе схожести их экспрессии, что помогает выявить функционально связанные группы генов, вовлеченные в патологические процессы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"23-analiz-obogasheniya-obshih-genov-bp-i-syuia\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#23-analiz-obogasheniya-obshih-genov-bp-i-syuia\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.3. Анализ обогащения общих генов БП и сЮИА&lt;/span&gt;&lt;/a&gt;2.3. Анализ обогащения общих генов БП и сЮИА&lt;/h4&gt;\n&lt;p&gt;Путем пересечения дифференциально экспрессирующихся генов (DEG) при БП и сЮИА с генами, имеющими высокую степень связности внутри модулей WGCNA каждого заболевания, мы идентифицировали 37 перекрывающихся генов в качестве начальных кандидатов (Рис. 4A). Консенсусная валидация WGCNA (Consensus TOM = min(TOM_PD, TOM_sJIA)) дополнительно продемонстрировала, что эти кандидаты обладают значительно повышенной консенсусной связностью по сравнению со случайными фоновыми генами (перестановочный тест, n = 1000, p = 0,008), что подтверждает их статус консервативных (Рис. S3). Эти гены, вероятно, играют ключевую роль в молекулярных механизмах БП и сЮИА. В связи с этим мы провели анализ обогащения GO и KEGG для данных генов. Результаты исследования показывают, что значительная часть генов сосредоточена в путях, связанных с сигнальным путем IL-17, ревматоидным артритом, сигнальным путем NF-kappa B, а также липидами и атеросклерозом (Рис. 4B и 4C). Впоследствии, чтобы идентифицировать дополнительные гены со схожими функциями, 37 перекрывающихся генов были введены в базу данных String (Рис. 4D). После удаления независимых генов был использован алгоритм CytoHubba MCC (программное обеспечение Cytoscape) для идентификации 10 главных хабовых генов (Рис. 4E).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont-f4.jpg\" alt=\"Рис. 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 4&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"24-skrining-i-validaciya-klyuchevyh-diagnosticheskih-genov-na-osnove-mashinnogo-obucheniya\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#24-skrining-i-validaciya-klyuchevyh-diagnosticheskih-genov-na-osnove-mashinnogo-obucheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.4. Скрининг и валидация ключевых диагностических генов на основе машинного обучения&lt;/span&gt;&lt;/a&gt;2.4. Скрининг и валидация ключевых диагностических генов на основе машинного обучения&lt;/h4&gt;\n&lt;p&gt;Благодаря комплексному анализу машинного обучения 37 генов-кандидатов мы построили 175 прогностических моделей для идентификации общих ключевых генов, вовлеченных в БП и сЮИА. Ансамблевая модель Ridge + AdaBoost продемонстрировала превосходную производительность с наивысшей точностью как на этапах обучения, так и на этапах валидации (Рис. 5A), что привело к идентификации шести ключевых генов (FAM46C, CXCL1, SELP, LGALSL, ELOVL4 и VCAN). Диагностический потенциал этих ключевых генов в обучающем наборе данных БП и обучающем наборе данных сЮИА был подтвержден анализом &lt;a href=\"concepts/roc-krivaya.html\"&gt;ROC&lt;/a&gt;-кривых (AUC &amp;gt; 0,8, Рис. 5B и 5C).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont-f5.jpg\" alt=\"Рис. 5. Скрининг и валидация основных диагностических генов на основе машинного обучения.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 5. Скрининг и валидация основных диагностических генов на основе машинного обучения.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 5. Скрининг и валидация основных диагностических генов на основе машинного обучения. (A) Сравнение эффективности моделей проиллюстрировано тепловой картой, которая отображает значения AUC для различных моделей в разных когортах. Левый столбец рисунка соответствует моделям, а правый столбец указывает AUC, причем более высокие значения указывают на лучшую производительность. Использование цветов служит для обозначения происхождения каждой когорты. (B, C) ROC-кривая 6 основных диагностических генов в обучающем наборе данных PD и обучающем наборе данных sJIA. (D, E) Экспрессия 6 основных диагностических генов.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование машинного обучения (модель Ridge + AdaBoost) позволило выделить 6 ключевых генов (FAM46C, CXCL1, SELP, LGALSL, ELOVL4, VCAN) с высокой диагностической точностью (AUC &amp;gt; 0,8).&lt;br /&gt;\n[!tip] AUC (Area Under the Curve) — метрика качества классификатора, показывающая вероятность того, что модель правильно ранжирует случайный положительный объект выше случайного отрицательного; значение 1,0 означает идеальную модель.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"25-effektivnost-modeli-i-interpretaciya-priznakov-na-osnove-shap\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#25-effektivnost-modeli-i-interpretaciya-priznakov-na-osnove-shap\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.5. Эффективность модели и интерпретация признаков на основе SHAP&lt;/span&gt;&lt;/a&gt;2.5. Эффективность модели и интерпретация признаков на основе SHAP&lt;/h4&gt;\n&lt;p&gt;Мы оценили прогностическую эффективность моделей Ridge и AdaBoost на наборах данных PD и sJIA с использованием пятикратной повторной перекрестной проверки с оптимизированными гиперпараметрами (см. Таблицу SN). Кривые ROC показывают, что обе модели продемонстрировали высокую дискриминационную способность как для набора данных PD, так и для sJIA (Рис. 6A и 6B). Для анализа логики принятия решений мы провели &lt;a href=\"concepts/shap-analiz.html\"&gt;SHAP-анализ&lt;/a&gt; для всех четырех комбинаций моделей и наборов данных, изучая глобальную важность признаков, направленную согласованность и локальную декомпозицию прогнозов. Столбчатые диаграммы средних абсолютных значений SHAP показали, что SELP занимает первое место во всех четырех анализах со значениями 0,0802 (PD AdaBoost), 0,0696 (PD Ridge), 0,162 (sJIA AdaBoost) и 0,0391 (sJIA Ridge) — это единственный ген, сохранивший стабильно высокую позицию во всех моделях и наборах данных (Рис. 6C). В модели PD AdaBoost показатели SELP (0,0802) и CXCL1 (0,0774) были почти равны (разница 0,0028), тогда как в sJIA AdaBoost SELP значительно превзошел второй по значимости ген ELOVL4 (0,112), что указывает на усиление значимости в зависимости от контекста заболевания. FAM46C занял второе место в PD Ridge (0,0642), ELOVL4 — второе место в обеих моделях sJIA, в то время как VCAN и LGALSL занимали промежуточные позиции во всех анализах. Графики beeswarm показали, что SELP и CXCL1 демонстрируют идеально согласованные и противоположные паттерны во всех четырех комбинациях: более высокая экспрессия SELP равномерно ассоциирована с положительными значениями SHAP (способствует риску), тогда как более высокая экспрессия CXCL1 последовательно связана с отрицательными значениями SHAP (защитный эффект) — такая воспроизводимость между алгоритмами и заболеваниями убедительно подтверждает их биологическую надежность (Рис. 6D). Напротив, FAM46C, ELOVL4, VCAN и LGALSL показали смешанные или зависящие от модели направления. Каскадные диаграммы (waterfall plots) проиллюстрировали локальную декомпозицию прогноза для репрезентативных образцов; в примере sJIA Ridge базовая вероятность E[f(x)] = 0,486 была повышена до f(x) = 0,64, при этом FAM46C внес наибольший положительный вклад (+0,0782), за ним следовали LGALSL (+0,0375), SELP (+0,0298) и ELOVL4 (+0,0265), в то время как CXCL1 оказал отрицательный эффект (−0,0277), демонстрируя, что глобально лидирующие гены не обязательно являются доминирующими драйверами для каждого отдельного пациента (Рис. 6F). Графики зависимости дополнительно визуализировали взаимосвязи между SHAP и экспрессией, предполагая потенциальные нелинейные эффекты взаимодействия, особенно усиленный вклад SELP в sJIA AdaBoost (Рис. 6E). В совокупности эти результаты определяют SELP как наиболее надежный кросс-модельный и кросс-датасетный предиктор со стабильным направлением влияния на риск, CXCL1 — как универсальный защитный фактор, а FAM46C, ELOVL4, VCAN и LGALSL — как контекстно-зависимые факторы, относительная важность которых меняется в зависимости от типа заболевания и моделирования.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont-f6.jpg\" alt=\"Рис. 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 6&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SELP идентифицирован как наиболее стабильный предиктор риска во всех моделях (значения SHAP до 0,162), в то время как CXCL1 выступает универсальным защитным фактором.&lt;br /&gt;\n[!tip] SHAP-анализ — это метод интерпретации моделей машинного обучения, который показывает вклад каждого признака (гена) в конкретный прогноз, позволяя понять, «почему» модель приняла такое решение.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"26-infiltraciya-immunnyh-kletok-i-ee-korrelyaciya-s-obshimi-klyuchevymi-genami\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#26-infiltraciya-immunnyh-kletok-i-ee-korrelyaciya-s-obshimi-klyuchevymi-genami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.6. Инфильтрация иммунных клеток и ее корреляция с общими ключевыми генами&lt;/span&gt;&lt;/a&gt;2.6. Инфильтрация иммунных клеток и ее корреляция с общими ключевыми генами&lt;/h4&gt;\n&lt;p&gt;Наш анализ CIBERSORT проводился независимо для каждого заболевания в сравнении с соответствующим контролем в тканях без прямого статистического сравнения между тканями. В десне при PD мы наблюдали значительное повышение уровня нейтрофилов и относительное снижение CD8⁺ T-клеток, в то время как в периферической крови при sJIA нейтрофилы также были повышены, а CD8⁺ T-клетки были аналогично снижены (Рис. 7A и 7B). Корреляционный анализ шести ключевых генов (FAM46C, CXCL1, SELP, LGALSL, ELOVL4, VCAN) с фракциями иммунных клеток показал, что CXCL1 и SELP последовательно положительно коррелируют с нейтрофилами и отрицательно с покоящимися тучными клетками в обоих наборах данных, тогда как FAM46C показал положительную связь с плазматическими клетками. Примечательно, что LGALSL демонстрировал противоположные корреляции с нейтрофилами в двух тканях (отрицательная при PD, положительная при sJIA), в то время как ELOVL4 положительно коррелировал с M2-макрофагами при обоих заболеваниях, причем корреляция была сильнее при sJIA. Кроме того, VCAN показал значительную положительную корреляцию с нейтрофилами только при sJIA, тогда как при PD такой связи не наблюдалось (Рис. 7C и 7D). Эти паттерны подчеркивают как общие иммунно-генные взаимодействия, так и тканеспецифические регуляторные различия при двух воспалительных заболеваниях.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont-f7.jpg\" alt=\"Рис. 7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 7&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Выявлены общие иммунные паттерны: CXCL1 и SELP положительно коррелируют с нейтрофилами, однако влияние других генов (например, LGALSL) на иммунные клетки зависит от типа ткани.&lt;br /&gt;\n[!warning] Данные выводы носят гипотетический характер, так как отсутствие наборов данных по одним и тем же типам тканей (например, кровь при PD или синовиальная оболочка при sJIA) ограничивает возможность прямой валидации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"27-identifikaciya-potencialnyh-lekarstvennyh-sredstv-na-osnove-hab-genov-i-analiza-molekulyarnogo-dokinga\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#27-identifikaciya-potencialnyh-lekarstvennyh-sredstv-na-osnove-hab-genov-i-analiza-molekulyarnogo-dokinga\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.7. Идентификация потенциальных лекарственных средств на основе хаб-генов и анализа молекулярного докинга&lt;/span&gt;&lt;/a&gt;2.7. Идентификация потенциальных лекарственных средств на основе хаб-генов и анализа молекулярного докинга&lt;/h4&gt;\n&lt;p&gt;Мы разработали сеть ключевых генов-мишеней для соединений традиционной китайской медицины (ТКМ), интегрировав базы данных CTD и TCMSP (Рис. 8A). Эта сеть подчеркивает центральную роль генов-мишеней IL1B, MMP1 и ITGAM в регуляции данной сети. Молекулярные взаимодействия между выбранными соединениями и соответствующими белками-мишенями (PDB ID: 1HIB для IL1B, 3SHI для MMP1 и 1NA5 для ITGAM) были определены методом молекулярного докинга с использованием AutoDock Vina. Энергии связывания составили −6,6 ккал/моль для байкалеин–IL1B, −7,6 ккал/моль для дезоксихолевая кислота–MMP1, −6,9 ккал/моль для кемпферол–ITGAM, −7,2 ккал/моль для кемпферол–IL1B и −8,2 ккал/моль для таксифолин–MMP1 (Рис. 8B-8F).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont-f8.jpg\" alt=\"Рис. 8\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 8&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Предыдущие исследования установили пороговые значения для интерпретации энергий связывания AutoDock: порог «значимости» связывания в −7,0 ккал/моль используется для выделения лигандов с сильным связыванием, а энергия ниже −6,0 ккал/моль предложена в качестве минимального порога для кандидатов в лекарственные препараты. Исходя из этих критериев, пары дезоксихолевая кислота–MMP1 (−7,6 ккал/моль), кемпферол–IL1B (−7,2 ккал/моль) и таксифолин–MMP1 (−8,2 ккал/моль) преодолевают порог значимости в −7,0 ккал/моль, что указывает на сильное предсказанное сродство к своим мишеням, в то время как байкалеин–IL1B (−6,6 ккал/моль) и кемпферол–ITGAM (−6,9 ккал/моль) опускаются ниже порога в −6,0 ккал/моль, что также свидетельствует о благоприятном потенциале связывания.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анализ докинга выявил три соединения (дезоксихолевая кислота, кемпферол, таксифолин) с высокой энергией связывания (ниже −7,0 ккал/моль) с ключевыми мишенями IL1B, MMP1 и ITGAM.&lt;br /&gt;\n[!tip] Молекулярный докинг — это метод компьютерного моделирования, позволяющий предсказать, как молекула лекарства (лиганд) «садится» в активный центр белка-мишени, а энергия связывания показывает прочность этого взаимодействия.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"28-molekulyarno-dinamicheskoe-modelirovanie-i-ocenka-stabilnosti-svyazyvaniya\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#28-molekulyarno-dinamicheskoe-modelirovanie-i-ocenka-stabilnosti-svyazyvaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.8. Молекулярно-динамическое моделирование и оценка стабильности связывания&lt;/span&gt;&lt;/a&gt;2.8. Молекулярно-динамическое моделирование и оценка стабильности связывания&lt;/h4&gt;\n&lt;p&gt;Хотя полугибкий докинг позволяет получить начальные позы связывания, он не учитывает гибкость белка, температуру, давление или эффекты растворителя. Для дальнейшего изучения динамической стабильности взаимодействий белок-лиганд мы провели 100-нс МД-симуляции для трех ключевых комплексов: кемпферол–IL1B (PDB: 1HIB), кемпферол–ITGAM (PDB: 1NA5) и дезоксихолевая кислота–MMP1 (PDB: 3SHI). Для оценки надежности каждого режима связывания были проанализированы несколько параметров. Среднеквадратичное отклонение (&lt;a href=\"concepts/root-mean-square-deviation.html\"&gt;RMSD&lt;/a&gt;) белкового остова отслеживалось для оценки достижения равновесия (Рис. 9A). Комплекс кемпферол–1HIB (красная линия) достиг равновесия и стабилизировался на уровне примерно 0,30–0,35 нм, что немного выше, чем у апо-белка (1HIB, черная линия). Комплекс кемпферол–1NA5 (красная линия) стабилизировался на уровне примерно 0,25–0,30 нм, также немного выше, чем у апо-белка (1NA5, черная линия). Комплекс дезоксихолевая кислота–3SHI (красная линия) стабилизировался на уровне примерно 0,25–0,30 нм, что опять же выше, чем у апо-белка (3SHI, черная линия).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont-f9.jpg\" alt=\"Рис. 9. Анализ молекулярной динамики (MD) трех комплексов лиганд-белок (кемпферол-IL1B, кемпферол-ITGAM и дезоксихолевая\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 9. Анализ молекулярной динамики (MD) трех комплексов лиганд-белок (кемпферол-IL1B, кемпферол-ITGAM и дезоксихолевая кислота-MMP1) в течение 100 нс.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 9. Анализ молекулярной динамики (MD) трех комплексов лиганд-белок (кемпферол-IL1B, кемпферол-ITGAM и дезоксихолевая кислота-MMP1) в течение 100 нс. (A) Среднеквадратичное отклонение (RMSD) белкового остова. (B) Радиус гирации (Rg). (C) Среднеквадратичная флуктуация (RMSF) на остаток. (D) Водородные связи в пределах 0,35 нм. (E) Ландшафты свободной энергии Гиббса (3D-поверхность и 2D-контур).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Хотя значения RMSD всех трех комплексов незначительно превышают общепринятый порог в 0,25 нм, они остаются стабильными без восходящего дрейфа на протяжении всей симуляции, что указывает на то, что связывание лиганда сохраняет общую структурную целостность, несмотря на небольшое увеличение RMSD остова по сравнению со свободными белками. Радиус гирации (Rg) отражает общую компактность комплекса (Рис. 9B). Кемпферол–1HIB поддерживал стабильный Rg на уровне около 1,48 нм; кемпферол–1NA5 — около 1,54 нм; а дезоксихолевая кислота–3SHI — около 1,48 нм, при этом во всех случаях наблюдались минимальные колебания в ходе симуляции. Отсутствие резких увеличений Rg подтверждает, что связывание лиганда не вызывало разворачивания белка или значительного расширения структуры.&lt;/p&gt;\n&lt;p&gt;Гибкость отдельных остатков оценивалась с помощью RMSF (Рис. 9C). Для кемпферол–1HIB большинство остатков колебались в пределах ниже 0,12 нм, и только остаток 150 (C-конец) демонстрировал более высокую гибкость (~0,62 нм). Для кемпферол–1NA5 подавляющее большинство остатков оставалось ниже 0,12 нм, при этом только остаток 1 (N-конец) показывал более высокую флуктуацию (~0,42 нм). Для дезоксихолевая кислота–3SHI большинство остатков колебались ниже 0,20 нм, при этом остатки 100, 190 и 210 демонстрировали несколько более высокие значения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;100-нс МД-симуляции подтвердили структурную стабильность комплексов: RMSD стабилизировалось в диапазоне 0,25–0,35 нм, а радиус гирации не показал признаков денатурации белков.&lt;br /&gt;\n[!tip] МД-симуляция (&lt;a href=\"concepts/md-simulyatsiya.html\"&gt;молекулярная динамика&lt;/a&gt;) — это «кино» о движении атомов белка в виртуальной среде, которое показывает, насколько прочно и стабильно лекарство удерживается в мишени в условиях, близких к физиологическим.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;p&gt;Точный механизм, лежащий в основе сЮИА, остается невыясненным; он не соответствует типичным характеристикам аутоиммунного заболевания и часто сопровождается системными воспалительными проявлениями. Пародонтит — это широко распространенное мультифакторное хроническое заболевание, и недавние отчеты указывают на его связь с рядом других аутоиммунных заболеваний. Скрытые механизмы, лежащие в основе этих патологий, требуют дальнейшего изучения. В последние годы биоинформатика стала новым методом анализа и раскрытия физиологических механизмов различных заболеваний. В данном исследовании биоинформатические подходы были использованы для выявления общих диагностических биомаркеров пародонтита (ПЗ) и сЮИА, что открывает новые подходы к профилактике и лечению этих заболеваний. Мы интегрировали наборы данных GEO для ПЗ и сЮИА, провели анализ дифференциальной экспрессии и WGCNA, выявив 734 дифференциально экспрессируемых гена (ДЭГ) при ПЗ (491 с повышенной экспрессией, 243 с пониженной) и 1231 при сЮИА (685 с повышенной, 546 с пониженной). Наиболее сильные корреляции с признаками показали бирюзовый модуль (ПЗ, r = 0,67), а также розовый, зеленый и коричневый модули (сЮИА, r &amp;gt; 0,6). Пересечение ДЭГ и хабовых генов WGCNA позволило выделить 37 общих кандидатов, валидированных с помощью консенсусного WGCNA (p = 0,008), которые были значительно обогащены в путях IL-17, NF-κB, ревматоидного артрита и липидного атеросклероза. Анализ сети белок-белковых взаимодействий (PPI) выявил десять ключевых хабовых генов, а последующий анализ 175 прогностических моделей машинного обучения определил комбинацию Ridge + AdaBoost как наиболее эффективную, позволившую отобрать шесть основных диагностических генов (FAM46C, CXCL1, SELP, LGALSL, ELOVL4 и VCAN). &lt;a href=\"concepts/receiver-operating-characteristic.html\"&gt;ROC-анализ&lt;/a&gt; подтвердил хорошую диагностическую точность (AUC &amp;gt; 0,8 в обучающей выборке, &amp;gt; 0,75 при валидации ПЗ). Интерпретация SHAP выделила SELP как наиболее надежный кросс-модельный и кросс-датасетный предиктор риска, в то время как CXCL1 стабильно демонстрировал защитные эффекты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование выявило 37 общих генов-кандидатов для ПЗ и сЮИА, среди которых SELP и CXCL1 стали ключевыми предикторами с AUC &amp;gt; 0,8.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Оба заболевания характеризуются повышением уровня нейтрофилов, снижением содержания CD8+ T-клеток и консервативными корреляциями: CXCL1 и SELP положительно коррелируют с нейтрофилами и отрицательно — с покоящимися тучными клетками, тогда как FAM46C положительно коррелирует с плазматическими клетками. При этом LGALSL демонстрирует противоположные ассоциации с нейтрофилами при этих двух состояниях. Анализ сети «лекарство-мишень» определил IL1B, MMP1 и ITGAM как основные мишени. Молекулярный докинг пяти пар «соединение-мишень» показал энергии связывания: -6,6 ккал/моль (байкалеин–IL1B), -7,6 ккал/моль (дезоксихолевая кислота–MMP1), -6,9 ккал/моль (кемпферол–ITGAM), -7,2 ккал/моль (кемпферол–IL1B) и -8,2 ккал/моль (таксифолин–MMP1). Из них комплексы кемпферол–IL1B, кемпферол–ITGAM и дезоксихолевая кислота–MMP1 были отобраны для 100-нс МД-симуляций, которые подтвердили стабильное и специфическое связывание на основе анализа RMSD, Rg, RMSF, водородных связей и ландшафта свободной энергии.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;WGCNA (взвешенный анализ корреляции сетей генов) — метод группировки генов с похожими паттернами экспрессии; МД-симуляции (молекулярная динамика) — компьютерное моделирование движения атомов для проверки стабильности связывания молекул.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Важно признать, что все данные в этом исследовании получены путем профилирования суммарной (bulk) транскриптомики. Такие наборы данных подвержены как техническим, так и биологическим искажениям. Во-первых, образцы суммарной ткани представляют собой смешанные транскрипционные сигналы от множества типов клеток (злокачественных, иммунных, стромальных и т.д.), что может маскировать активность генов, специфичную для конкретного типа клеток. Во-вторых, выявленные здесь ДЭГ отражают только транскрипционные корреляции; их нельзя интерпретировать как причинно-следственные или функционально определяющие события — высокоэкспрессируемый ген не обязательно является драйвером прогрессирования заболевания, и наоборот, умеренно или слабо экспрессируемые гены могут играть критическую роль. В-третьих, экспрессия мРНК не всегда коррелирует с содержанием белка; таким образом, наши выводы на уровне транскриптома требуют дальнейшей валидации на уровне белка и функциональных экспериментов. Следовательно, наши заключения следует рассматривать как результаты поискового скрининга кандидатов, а их трансляционный потенциал ожидает проверки в проспективных когортных исследованиях и экспериментальных анализах.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Все выводы основаны на биоинформатическом анализе общедоступных данных; корреляция не означает причинно-следственную связь, а отсутствие экспериментальной валидации (&lt;a href=\"concepts/qpcr.html\"&gt;qPCR&lt;/a&gt;, Western blot) ограничивает интерпретацию результатов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Все результаты, связанные с SELP — включая его высокий рейтинг важности SHAP во всех моделях и наборах данных, стабильное направление риска, хорошую диагностическую точность (AUC &amp;gt; 0,8), положительные корреляции с нейтрофилами и M0-макрофагами, а также обогащение в путях липидного атеросклероза — получены исключительно путем вычислительного переанализа общедоступных данных GEO и не имеют экспериментального подтверждения (qPCR, Western blot, генная модификация, модели на животных или клинические образцы). Хотя эти статистические ассоциации согласуются с известной ролью P-селектина в роллинге лейкоцитов и тромбовоспалении, а также с сообщениями, связывающими пародонтальные патогены с осью P-селектин/PSGL-1, наше исследование не предоставляет прямых доказательств участия вышестоящих регуляторов, нижестоящих эффекторов или причинно-следственной вовлеченности в специфические сигнальные каскады; обогащение путей указывает лишь на статистическую сверхпредставленность и не может установить механистическую иерархию. Установление причинно-следственной связи потребовало бы систематических функциональных экспериментов (например, &lt;a href=\"concepts/knock-out.html\"&gt;нокаут&lt;/a&gt;/сверхэкспрессия, ингибиторное спасение, модели на животных), как это показано в исследованиях, подтвердивших вовлечение пути NF-κB с помощью генной модификации и молекулярных анализов, а не только на основе выводов. Аналогичным образом, мы не утверждаем, что SELP является терапевтической мишенью, так как любые предположения об эффективности лечения были бы преждевременными без подтверждения взаимодействия с мишенью, клеточных и in vivo исследований.&lt;/p&gt;\n&lt;p&gt;CXCL1 (лиганд 1 хемокина с мотивом C-X-C), также известный как GRO-α, представляет собой CXC-хемокин, функционирующий как хемотаксический фактор для нейтрофилов через свой рецептор CXCR2. Наши вычислительные результаты — стабильное повышение экспрессии как при ПЗ, так и при сЮИА, хорошая диагностическая точность (AUC &amp;gt; 0,75) и высокая важность SHAP (второе место в модели AdaBoost для ПЗ с неизменно отрицательным/защитным направлением) — получены полностью на основе биоинформатического анализа и не имеют экспериментального подтверждения.&lt;/p&gt;\n&lt;p&gt;Наблюдаемое обогащение путей (IL-17, NF-κB, ревматоидный артрит, липидный атеросклероз) и положительные корреляции с M0-макрофагами и нейтрофилами согласуются с установленными ролями CXCL1 при воспалительных заболеваниях. При пародонтите CXCL1 является ключевым медиатором рекрутирования нейтрофилов и разрушения альвеолярной кости. Механистически пародонтальные патогены, такие как P. gingivalis, запускают интегрированный стрессовый ответ (ISR) в кератиноцитах десны, повышая экспрессию CXCL1 и способствуя инфильтрации нейтрофилов. Gli1+ мезенхимальные стволовые клетки, подвергшиеся воспалению, высвобождают внеклеточные везикулы, несущие CXCL1 на своей поверхности, что праймирует аберрантные нейтрофилы через ось CXCL1–CXCR2. Инсулин усиливает продукцию CXCL1, индуцированную липополисахаридом, в фибробластах десны через активацию Akt и NF-κB, а направленная сверхэкспрессия CXCL1 в десне нормализует рекрутирование нейтрофилов и предотвращает потерю костной ткани в моделях на мышах. При ревматоидном артрите — заболевании, иммунологически связанном с сЮИА, — CXCL1 повышен в крови и синовиальной жидкости пациентов. CXCL1 способствует экспрессии циклооксигеназы-2 (COX-II) в синовиальных фибробластах при ревматоидном артрите через CXCR2, PLC, PKC и сигнальный путь NF-κB, а также способствует экспрессии IL-6 через пути CXCR2, c-Raf, MAPK и &lt;a href=\"concepts/ap-1.html\"&gt;AP-1&lt;/a&gt;. Кроме того, тучные клетки и макрофаги продуцируют CXCL1/CXCL2 для контроля ранней стадии рекрутирования нейтрофилов при воспалении тканей. Однако эти ассоциации не устанавливают причинно-следственную связь и не определяют иерархическое положение CXCL1 в этих сигнальных каскадах; сверхпредставленность путей отражает лишь статистическую сопутствующую встречаемость и не может интерпретироваться как механистическое доказательство. Установление какой-либо функциональной роли CXCL1 в общей патологии ПЗ и сЮИА потребовало бы систематической генной модификации, анализов спасения и моделей in vivo. Мы не утверждаем, что CXCL1 является терапевтической мишенью, так как любые подобные спекуляции были бы преждевременными без валидации мишени и исследований эффективности.&lt;/p&gt;\n&lt;p&gt;В целом, наши вычислительные результаты выдвигают SELP и CXCL1 в качестве генов-кандидатов, которые могут совместно участвовать в общей воспалительно-сосудистой патологии при ПЗ и сЮИА. Однако все выводы носят чисто поисковый характер и не имеют экспериментального подтверждения; они не устанавливают механизм или терапевтический потенциал. Для проверки этих гипотез необходимы строгие функциональные исследования. Хотя наша вычислительная валидация на разных когортах демонстрирует обобщаемость на независимых транскрипционных наборах данных, будущие исследования должны подтвердить эту двухгенную сигнатуру с помощью ортогональных методов (например, qRT-PCR, анализы на уровне белка) и в проспективных клинических когортах.&lt;/p&gt;\n&lt;p&gt;Иммунное микроокружение слизистой оболочки десны глубоко отличается от такового в периферической крови. Ткань десны постоянно подвергается воздействию оральной микробиоты и физических барьеров, в то время как периферическая кровь отражает системный иммунный статус. Таким образом, наблюдаемое перекрытие ДЭГ между этими двумя наборами данных может смешивать истинные сигналы, значимые для заболевания, с тканеспецифичными транскрипционными программами. При текущем дизайне исследования мы не можем разделить эти два источника вариативности. Следовательно, наши выводы об «общих генах» являются гипотетическими и не должны интерпретироваться как подтверждающее доказательство единого молекулярного пути. Наши анализы иммунной инфильтрации выявляют конвергентный воспалительный ландшафт как в десне при ПЗ, так и в периферической крови при сЮИА, отмеченный повышенным содержанием нейтрофилов и снижением CD8+ T-клеток. Накопление нейтрофилов согласуется с установленной ролью нейтрофилов как эффекторов первой линии как при локальной инфекции слизистой (ПЗ), так и при системном аутовоспалении (сЮИА), в то время как одновременное снижение CD8+ T-клеток предполагает общий дефект адаптивного цитотоксического надзора, что может способствовать хронизации процесса за счет нарушения клиренса патогенных стимулов. Консервативные положительные корреляции CXCL1 и SELP с нейтрофилами, наряду с их отрицательными ассоциациями с покоящимися тучными клетками, указывают на скоординированную хемотаксически-адгезивную ось, которая не только рекрутирует нейтрофилы, но и модулирует гомеостаз тучных клеток, потенциально связывая врожденную активацию с путями аллергического типа. Одновременно, стабильная корреляция FAM46C с плазматическими клетками подразумевает вовлеченность гуморального иммунитета в оба заболевания, возможно, отражая общий B-клеточный компонент, который поддерживает локальное и системное воспаление через образование аутоантител или иммунных комплексов. Помимо этих общих черт, зависящее от заболевания расхождение корреляций LGALSL–нейтрофилы (отрицательные при ПЗ, положительные при сЮИА) подчеркивает, что даже один и тот же ген может оказывать противоположные эффекты на миграцию нейтрофилов в зависимости от тканевого контекста — явление, которое может объясняться дифференциальными посттрансляционными модификациями или конкурирующими взаимодействиями лиганд-рецептор в локальном микроокружении. Более сильная ассоциация ELOVL4–M2-макрофаги при сЮИА предполагает, что системные сигналы липидного метаболизма предпочтительно направляют альтернативную поляризацию макрофагов в периферической крови, тогда как в слизистой оболочке десны эта ось частично подавляется микробными продуктами и цитокинами, производными барьера, которые способствуют M1-доминирующим ответам. Корреляция VCAN–нейтрофилы, уникально наблюдаемая при сЮИА, дополнительно подтверждает системную сеть адгезии-миграции, которая может быть менее актуальна в тканях полости рта, где миграция нейтрофилов доминирует за счет интегринов, а не путей, опосредованных вертиканом. В совокупности эти паттерны согласуются с двухуровневой иммунологической структурой: базовый общий воспалительный каркас, включающий цепи «нейтрофил–тучная клетка–плазматическая клетка», наложенный на тканеспецифичные регуляторные модули, которые перестраивают взаимодействия «ген–иммунная клетка» в соответствии с локальной архитектурой (слизистая против сосудистой) и системным воспалительным тоном (острый против хронического).&lt;/p&gt;\n&lt;p&gt;Эта структура согласуется с концепцией «воспалительного континуума» при барьерных и системных заболеваниях, где общие эффекторные пути тонко настраиваются тканерезидентными стромальными и иммунными нишами. Однако эти вычислительные выводы остаются корреляционными и гипотетическими; они не устанавливают причинно-следственную иерархию. Функциональная валидация — через нокауты в специфических типах клеток, нейтрализующие антитела или тканеинженерные модели — остро необходима для того, чтобы разобраться, представляют ли наблюдаемые общности и различия истинные патогенные драйверы или являются лишь вторичными эпифеноменами воспаления. Из пяти пар для докинга мы выбрали Кемпферол–IL1B, Дезоксихолевую кислоту–MMP1 и Кемпферол–ITGAM для 100-нс МД-симуляций, исходя из четырех соображений: репрезентативные энергии связывания, охватывающие умеренный и сильный диапазоны; функциональное разнообразие мишеней — провоспалительный цитокин (IL1B), фермент, разрушающий матрикс (MMP1), и молекула иммунной адгезии (ITGAM), — охватывающие ключевые узлы воспалительного каскада; структурное разнообразие соединений (флавоноид против желчной кислоты) для оценки обобщаемости; и распределение вычислительных ресурсов для баланса между глубиной валидации и широтой охвата. Многопараметрические анализы МД (RMSD, Rg, RMSF, сети водородных связей и ландшафты свободной энергии) подтвердили хорошую конформационную стабильность и специфическое связывание для всех трех комплексов, обеспечивая надежную вычислительную поддержку, выходящую за рамки одной лишь энергии связывания.&lt;/p&gt;\n&lt;p&gt;Кемпферол — это природный флавоноид с хорошо документированными противовоспалительными свойствами, в то время как IL-1β является основным провоспалительным цитокином, центральным для патогенеза как пародонтита, так и сЮИА, способствующим рекрутированию нейтрофилов, остеокластогенезу и системному воспалению. МД подтвердила стабильное связывание, предполагая, что кемпферол может ингибировать передачу сигналов IL-1β, фиксируя белок в жесткой конформации — гипотеза, требующая экспериментальной валидации. Дезоксихолевая кислота, вторичная желчная кислота, была связана с воспалительными процессами, в то время как MMP1 разрушает интерстициальные коллагены и повышена как при пародонтите, так и при артрите, способствуя разрушению тканей. Этот комплекс продемонстрировал сильную энергию связывания, и МД подтвердила высокостабильное связывание, предполагая, что дезоксихолевая кислота может действовать как мощный ингибитор MMP1. Однако желчные кислоты также активируют воспалительную передачу сигналов через TGR5 и FXR, что усложняет терапевтическую интерпретацию. ITGAM кодирует αM-субъединицу интегрина Mac-1 (CD11b/CD18), необходимую для адгезии и миграции лейкоцитов и вовлеченную как в пародонтит, так и в артрит. Несмотря на умеренный балл докинга, мы включили этот комплекс, чтобы обеспечить охват ITGAM, так как кемпферол обладает известной активностью по модуляции интегринов. МД подтвердила специфическое и стабильное связывание. Учитывая, что Mac-1 опосредует прочную адгезию нейтрофилов к активированному эндотелию — в зависимости от предшествующего роллинга P-селектин/PSGL-1, — кемпферол может нарушать этот каскад адгезии. В соответствии с интегративными исследованиями &lt;a href=\"concepts/virtualnyy-nokaut.html\"&gt;in silico&lt;/a&gt; по скринингу лекарств, такими как работа Thankachan et al. по PTPN3 при раке молочной железы, которая объединила клинико-патологическую корреляцию, ROC-анализ, молекулярный докинг и МД-симуляции для выявления ингибиторов с высоким сродством, наш многоуровневый вычислительный конвейер укрепляет достоверность этих предсказаний. Тем не менее, мы должны подчеркнуть, что докинг и МД-симуляции имеют присущие им ограничения: методологии докинга являются генераторами гипотез, а не точными предикторами; одной энергии связывания недостаточно для вывода о биологической значимости, и не существует последовательной линейной корреляции между баллами докинга и экспериментальной активностью из-за таких факторов, как гибкость мишени, проницаемость соединения и ограничения функции оценки. Более того, вычислительные предсказания не могут заменить поверхностный плазмонный резонанс для измерения аффинности, анализы клеточной адгезии для функциональной оценки или модели на животных для фармакокинетической оценки. Поэтому мы не делаем терапевтических заявлений на основе этих результатов. Выявленные соединения представляют собой приоритетные кандидаты для будущих экспериментальных исследований, а не валидированные вмешательства. В целом, данное исследование идентифицирует SELP как надежный кросс-модельный предиктор и CXCL1 как защитный фактор, потенциально связывающий ПЗ и сЮИА через общие воспалительно-сосудистые пути. Однако все выводы носят чисто вычислительный характер и получены на основе кросс-тканевых данных (десна против крови) без экспериментальной валидации. Поэтому мы не делаем терапевтических заявлений; эти результаты являются поисковыми и гипотетическими, требующими будущей валидации в парных когортах тканей и функциональных исследованиях. Клиническая полезность этой сигнатуры — включая ее эффективность в проспективных когортах, экономическую эффективность и добавленную стоимость по сравнению с существующими клиническими параметрами — остается не установленной. Это исследование следует интерпретировать как фазу открытия, генерирующую гипотезы, а не как готовый к клиническому применению диагностический инструмент.&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"41-nabory-dannyh\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#41-nabory-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.1. Наборы данных&lt;/span&gt;&lt;/a&gt;4.1. Наборы данных&lt;/h4&gt;\n&lt;p&gt;Данные об экспрессии генов при пародонтите (PD) и системном ювенильном идиопатическом артрите (sJIA) были получены из базы данных Gene Expression Omnibus (GEO) (https://www.ncbi.nlm.nih.gov/geo/). Для PD наборы данных GSE16134 и GSE10334 были получены из тканей десны. GSE16134 служил обучающей выборкой и содержал 310 образцов тканей десны (241 пораженный и 69 здоровых) от 120 пациентов (65 с хроническим, 55 с агрессивным пародонтитом). Клинические данные для GSE16134 включают: средний возраст 39,9 лет (диапазон 13–76), 50,8% мужчин, все некурящие, без диабета, без использования системных антибиотиков/противовоспалительных средств в течение 6 месяцев; пародонтит определялся по глубине проксимального кармана (PD) &amp;gt;4 мм, потере клинического прикрепления (CAL) ≥3 мм и кровоточивости при зондировании (BoP(+)), тогда как здоровые контроли имели PD ≤ 4 мм, CAL ≤ 2 мм и BoP(-). GSE10334 использовался в качестве валидационного набора и включал данные экспрессии генов от 90 пациентов (63 хронических, 27 агрессивных) со 183 пораженными и 64 здоровыми образцами тканей. Для GSE10334 были подтверждены те же критерии заболевания (PD &amp;gt; 4 мм, CAL ≥ 3 мм, BoP(+) для случаев; PD ≤ 4 мм, CAL ≤ 2 мм, BoP(-) для контролей) и исключение курильщиков и пользователей системных препаратов, однако распределение по возрасту и полу не было общедоступным. Для sJIA использовались три набора данных, полученных из образцов крови. GSE80060 (33 пациента, 22 здоровых контроля) и GSE7753 (17 пациентов, 30 здоровых контролей) служили обучающими наборами, насчитывающими 50 пациентов с sJIA и 52 здоровых контроля. GSE8650 (27 пациентов, 9 здоровых контролей) использовался в качестве валидационного набора. Чтобы минимизировать эффекты партии (batch effects) в обучающих наборах, мы применили многоступенчатую нормализацию: сначала был использован анализ суррогатных переменных (SVA) для моделирования и корректировки потенциальных искажающих факторов в когорте открытия; затем был применен ComBat для дальнейшей коррекции остаточных вариаций партий в рамках параметрической эмпирической байесовской структуры (с par.prior = TRUE). Скорректированный анализ главных компонент (PCA) подтвердил успешную интеграцию данных, о чем свидетельствует кластеризация образцов партий в пространстве пониженной размерности. Полный код R для процедур нормализации и диагностики предоставлен (S1 Code). Исчерпывающая сводка характеристик всех наборов данных представлена в Таблице 1.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 1.&lt;/strong&gt; Подробная сводка наборов данных экспрессии генов GEO&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;GEO Accession&lt;/th&gt;\n&lt;th&gt;Platform&lt;/th&gt;\n&lt;th&gt;Case (Disease)&lt;/th&gt;\n&lt;th&gt;Control (Healthy)&lt;/th&gt;\n&lt;th&gt;Tissue Type&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;GSE16134&lt;/td&gt;\n&lt;td&gt;GPL570&lt;/td&gt;\n&lt;td&gt;241 PD&lt;/td&gt;\n&lt;td&gt;69&lt;/td&gt;\n&lt;td&gt;Gingival tissue&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;GSE10334&lt;/td&gt;\n&lt;td&gt;GPL570&lt;/td&gt;\n&lt;td&gt;183 PD&lt;/td&gt;\n&lt;td&gt;64&lt;/td&gt;\n&lt;td&gt;Gingival tissue&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;GSE80060&lt;/td&gt;\n&lt;td&gt;GPL570&lt;/td&gt;\n&lt;td&gt;33 sJIA&lt;/td&gt;\n&lt;td&gt;22&lt;/td&gt;\n&lt;td&gt;Blood tissue&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;GSE7753&lt;/td&gt;\n&lt;td&gt;GPL570&lt;/td&gt;\n&lt;td&gt;17 sJIA&lt;/td&gt;\n&lt;td&gt;30&lt;/td&gt;\n&lt;td&gt;Blood tissue&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;GSE8650&lt;/td&gt;\n&lt;td&gt;GPL96&lt;/td&gt;\n&lt;td&gt;27 sJIA&lt;/td&gt;\n&lt;td&gt;9&lt;/td&gt;\n&lt;td&gt;Blood tissue&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анализ суррогатных переменных (SVA) и ComBat — это статистические методы, позволяющие убрать «шум» и технические различия между экспериментами, проведенными в разное время или в разных лабораториях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"42-identifikaciya-differencialno-ekspressiruyushihsya-genov-deg\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#42-identifikaciya-differencialno-ekspressiruyushihsya-genov-deg\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2. Идентификация дифференциально экспрессирующихся генов (DEG)&lt;/span&gt;&lt;/a&gt;4.2. Идентификация дифференциально экспрессирующихся генов (DEG)&lt;/h4&gt;\n&lt;p&gt;Программа R (версия 4.4.3) используется для стандартизации и обработки исходной матрицы экспрессии генов. R-пакет «limma» был использован для идентификации дифференциально экспрессирующихся генов (DEG) из GSE16134 и объединенного по партиям набора данных sJIA (GSE80060, GSE7753). Критерием отбора было значение скорректированного p-value &amp;lt; 0,05 и /log fold change (FC)/ &amp;gt; 0,585. С помощью программного обеспечения R были созданы гистограммы кластеров дифференциальных генов и вулканические графики (volcano plots).&lt;/p&gt;\n&lt;h4 id=\"43-postroenie-seti-wgcna-i-identifikaciya-modulej\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#43-postroenie-seti-wgcna-i-identifikaciya-modulej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3. Построение сети WGCNA и идентификация модулей&lt;/span&gt;&lt;/a&gt;4.3. Построение сети WGCNA и идентификация модулей&lt;/h4&gt;\n&lt;p&gt;WGCNA — это популярный алгоритм, используемый для идентификации модулей, которые значимо связаны с генами, ответственными за развитие заболевания [51]. R-пакет WGCNA был использован для построения сети коэкспрессии. Функция «hclust» была сначала применена для кластеризации образцов с целью выявления потенциальных выбросов. Впоследствии функция «pickSoftThreshold» была использована для определения оптимальной степени мягкого порога β для безмасштабной топологии (R² ≥ 0,85). Затем для обнаружения модулей был использован алгоритм динамической обрезки дерева с минимальным размером модуля 50 и высотой слияния модулей 0,25. Наконец, были рассчитаны значимость гена (GS) и принадлежность к модулю (MM) для оценки взаимосвязи между генами и интересующими признаками. Код анализа для WGCNA доступен (S2 Code).&lt;/p&gt;\n&lt;h4 id=\"44-identifikaciya-obshih-genov-i-obogashenie-putej\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#44-identifikaciya-obshih-genov-i-obogashenie-putej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.4. Идентификация общих генов и обогащение путей&lt;/span&gt;&lt;/a&gt;4.4. Идентификация общих генов и обогащение путей&lt;/h4&gt;\n&lt;p&gt;Перекрывающиеся гены между DEG и модулями WGCNA обоих заболеваний были определены как предварительные кандидаты. Они были дополнительно валидированы с помощью консенсусного WGCNA, где Consensus TOM = min(TOM_PD, TOM_sJIA). Консенсусная связность была рассчитана и протестирована на случайном фоне с помощью перестановочных тестов. Если идентифицированные нами гены-кандидаты сохраняют высокую и стабильную степень связности в сетях коэкспрессии обоих заболеваний, они не являются дифференциально экспрессирующимися генами, совпавшими случайно, а представляют собой консервативные узлы-хабы сети, общие как для PD, так и для sJIA. Эти гены-кандидаты обозначаются как ключевые гены и будут использованы в последующих анализах функционального обогащения.&lt;/p&gt;\n&lt;p&gt;Следующая информация: инвентарный номер, платформа, распределение случаев и контролей, тип ткани и организм. https://doi.org/10.1371/journal.pcbi.1014669.t001 Использование R-пакетов «enrichplot» и «ggplot2» применяется для анализа ключевых геномных элементов, включая функцию GO и анализ обогащения путей KEGG. Статистический анализ дает p-value &amp;lt; 0,05, а результаты визуализируются.&lt;/p&gt;\n&lt;h4 id=\"45-postroenie-seti-ppi-i-vybor-genov-habov\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#45-postroenie-seti-ppi-i-vybor-genov-habov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.5. Построение сети PPI и выбор генов-хабов&lt;/span&gt;&lt;/a&gt;4.5. Построение сети PPI и выбор генов-хабов&lt;/h4&gt;\n&lt;p&gt;Было проведено комплексное исследование с использованием базы данных STRING (https://string-db.org/) для создания базовой сети PPI общих генов с интеграцией PPI в программное обеспечение Cytoscape (версия 3.8.2) для обеспечения визуального представления. Затем для оценки генетической взаимосвязи был использован алгоритм MCC плагина cytoHubba.&lt;/p&gt;\n&lt;h4 id=\"46-vychislitelnyj-skrining-i-prioritizaciya-genov-kandidatov-s-ispolzovaniem-mashinnogo-obucheniya-i-ocenka-diagnosticheskoj-tochnosti\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#46-vychislitelnyj-skrining-i-prioritizaciya-genov-kandidatov-s-ispolzovaniem-mashinnogo-obucheniya-i-ocenka-diagnosticheskoj-tochnosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.6. Вычислительный скрининг и приоритизация генов-кандидатов с использованием машинного обучения и оценка диагностической точности&lt;/span&gt;&lt;/a&gt;4.6. Вычислительный скрининг и приоритизация генов-кандидатов с использованием машинного обучения и оценка диагностической точности&lt;/h4&gt;\n&lt;p&gt;Целью данного вычислительного этапа было не столько биологическое открытие как таковое, сколько проведение беспристрастного систематического сокращения признаков для формирования шорт-листа высокодостоверных кандидатов для последующего биологического анализа. Чтобы систематически выявить общие ключевые диагностические маркеры для БП (болезни Паркинсона) и сЮИА (системного ювенильного идиопатического артрита), мы создали комплексную систему прогнозирования на основе машинного обучения, объединяющую несколько алгоритмов. Используя данные профилей экспрессии из обучающей выборки, мы применили пятнадцать классических алгоритмов машинного обучения (Lasso, SVM, RF, glmBoost, plsRglm, Stepglm, Ridge, Enet, GBM, LDA, QDA, XGBoost, AdaBoost, KNN и NaiveBayes) для разработки 175 прогностических моделей. Гиперпараметры были оптимизированы с помощью пятикратной перекрестной проверки. Набор данных GSE16134 для БП и объединенный набор данных (GSE80060, GSE7753) для сЮИА использовались в качестве обучающей выборки, тогда как GSE10334 и GSE8650 служили внешней валидационной выборкой. Эффективность моделей строго оценивалась на основе площади под ROC-кривой (AUC), точности и F1-меры.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Машинное обучение — это метод анализа данных, при котором алгоритмы «обучаются» на примерах, чтобы находить скрытые закономерности и делать прогнозы, а AUC (площадь под кривой) показывает, насколько хорошо модель отличает больных от здоровых: 1.0 — идеально, 0.5 — случайное угадывание.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Оптимальные прогнозы отдельных моделей впоследствии были объединены с использованием стратегии ансамблевого обучения (stacking). Были отобраны высокодостоверные модели (AUC &amp;gt; 0,9), а их гены-признаки были ранжированы по частоте для идентификации генов-кандидатов. Наконец, паттерны экспрессии генов были визуализированы с помощью пакета pheatmap. Код машинного обучения предоставлен (S3 Code). Для проверки уровней экспрессии и диагностической эффективности ключевых генов, отобранных моделью машинного обучения в обучающей и валидационной выборках, использовалось программное обеспечение «ggpubr», что способствовало созданию графиков «ящик с усами» и «скрипичных» диаграмм, позволяя визуализировать уровни экспрессии ключевых генов в контексте наборов данных как БП, так и сЮИА. Для оценки прогностических и дискриминационных способностей этих ключевых генов были построены ROC-кривые, а значения AUC были рассчитаны с использованием программного обеспечения «pROC».&lt;/p&gt;\n&lt;h4 id=\"47-interpretaciya-modeli\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#47-interpretaciya-modeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.7. Интерпретация модели&lt;/span&gt;&lt;/a&gt;4.7. Интерпретация модели&lt;/h4&gt;\n&lt;p&gt;В данном исследовании мы использовали алгоритм SHAP (SHapley Additive exPlanations) для количественной оценки вклада каждого признака в прогнозы модели. Этот подход повышает интерпретируемость внутреннего процесса принятия решений путем присвоения значений важности отдельным признакам, тем самым способствуя прозрачной оценке их прогностического влияния. Код интерпретации SHAP предоставлен (S4 Code).&lt;/p&gt;\n&lt;h4 id=\"48-analiz-immunnoj-infiltracii-i-svyaz-mezhdu-biomarkerami-i-immunnymi-kletkami\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#48-analiz-immunnoj-infiltracii-i-svyaz-mezhdu-biomarkerami-i-immunnymi-kletkami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.8. Анализ иммунной инфильтрации и связь между биомаркерами и иммунными клетками&lt;/span&gt;&lt;/a&gt;4.8. Анализ иммунной инфильтрации и связь между биомаркерами и иммунными клетками&lt;/h4&gt;\n&lt;p&gt;Алгоритм CIBERSORT — это вычислительный метод, используемый для расчета процентного содержания различных типов иммунных клеток. Мы применили метод анализа инфильтрации иммунных клеток с использованием генетического набора LM22. Для расчета корреляции между ключевыми биологическими маркерами и иммунными клетками мы использовали метод Спирмена. Мы также оценили процентное содержание клеток в тестовой и контрольной группах. Мы рассчитали связь между генами, выбранными компьютерной программой, и иммунной инфильтрацией. Для корректировки p-значения мы использовали процедуру Бенджамини-Хохберга.&lt;/p&gt;\n&lt;h4 id=\"49-identifikaciya-potencialnyh-lekarstvennyh-sredstv\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#49-identifikaciya-potencialnyh-lekarstvennyh-sredstv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.9. Идентификация потенциальных лекарственных средств&lt;/span&gt;&lt;/a&gt;4.9. Идентификация потенциальных лекарственных средств&lt;/h4&gt;\n&lt;p&gt;Мы получили файл, содержащий связь между соединениями и генами, из базы данных CTD (http://ctdbase.org/). Этот файл выявил основные узлы сетей PPI для БП и сЮИА, а также ключевые гены, связанные с отбором методами машинного обучения. TCMSP (https://www.tcmsp-e.com/) — это уникальная платформа системной фармакологии для традиционной китайской медицины, которая фиксирует взаимосвязи между лекарствами, мишенями и заболеваниями. Мы использовали базу данных TCMSP для сбора информации о целевых соединениях (S1 Data), одновременно используя R-пакет «clusterProfiler» для проведения исследования молекулярных комплексов на основе значимости. Наш критерий отбора включал скорректированное p-значение &amp;lt; 0,05 и последующую идентификацию соответствующих молекулярных комплексов и значимых мишеней (S2 Data). Одновременно взаимосвязь между генами, которые являются важными мишенями соединений, была импортирована в Cytoscape, что позволило визуализировать сеть генов, являющихся важными мишенями для данных соединений.&lt;/p&gt;\n&lt;h4 id=\"410-molekulyarnyj-doking\"&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html#410-molekulyarnyj-doking\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.10. Молекулярный докинг&lt;/span&gt;&lt;/a&gt;4.10. Молекулярный докинг&lt;/h4&gt;\n&lt;p&gt;Потенциальные соединения выбираются с использованием комбинации контроля генов на уровне сети и соответствующей литературы. Этот выбор затем сравнивается с соответствующими генами-мишенями для установления молекулярной связи. Трехмерная структура центрального белка была получена из базы данных PDB (http://www.rcsb.org/pdb/). Молекулярная структура интересующего фармацевтического соединения была получена из базы данных PubChem (http://pubchem.ncbi.nlm.nih.gov/) и преобразована в формат Mol2 с использованием программного обеспечения Open Babel. Белки подвергались процессу десикации, гидроксилирования и другим подготовительным этапам. Входные файлы для докинга были подготовлены с использованием AutoDock Tools (версия 1.5.7), а расчеты молекулярного докинга впоследствии были выполнены с помощью AutoDock Vina (версия 1.2.7). Полученные комплексы были сохранены как файлы PDBQT, которые затем были визуализированы с помощью PyMOL (версия 3.2) для демонстрации наиболее
