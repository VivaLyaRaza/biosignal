            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"90\" cy=\"158\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"530\" cy=\"210\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · BIOENGINEERING   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Свободный убиквитин: как&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ученые научились видеть&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;«невидимый» регулятор клеток&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"concepts/ubiquitin.html\"&gt;Убиквитин&lt;/a&gt; — это небольшая молекула, которая управляет работой белков, но ее «свободная» форма долго оставалась загадкой для науки. Из-за отсутствия точных инструментов исследователи не могли понять, как именно этот белок участвует в защите от вирусов и формировании агрегатов при болезнях Альцгеймера и Паркинсона. Теперь ученые создали искусственный белок UBiP10, способный избирательно связываться со свободным убиквитином. Это открытие дает ключ к изучению механизмов клеточной регуляции и борьбы с патологиями.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-01/a-designed-ubiquitin-binding-protein-selectively-enriches-an.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Разработан высокоаффинный белковый зонд UBiP10 для детекции свободного убиквитина.&lt;/li&gt;\n&lt;li&gt;Мутация V1091L в домене ZnF &lt;a href=\"concepts/histone-deacetylase-6.html\"&gt;HDAC6&lt;/a&gt; значительно усилила связывающую способность молекулы.&lt;/li&gt;\n&lt;li&gt;UBiP10 позволил обнаружить слой свободного убиквитина вокруг клеточных агресом.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-01/a-designed-ubiquitin-binding-protein-selectively-enriches-an.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Убиквитин (Ub) — это консервативный белок из 76 аминокислот, который обычно ковалентно связывается с субстратами, направляя их на деградацию в протеасомах. Однако значительная часть убиквитина существует в клетке в несвязанном (свободном) виде. Традиционные методы его детекции, основанные на домене BUZ из фермента изопептидазы T (USP5), ограничены низкой аффинностью (константа диссоциации Kd ≈ 2,8 мкМ), что затрудняет точную количественную оценку.&lt;/p&gt;\n&lt;p&gt;В данной работе исследователи использовали комбинацию направленной эволюции и вычислительного дизайна белков. Сначала они оптимизировали цинкопальцевый домен (ZnF) белка HDAC6, внедрив мутацию V1091L, что позволило повысить аффинность к убиквитину. Затем с помощью алгоритма &lt;a href=\"concepts/rfdiffusion.html\"&gt;RFdiffusion&lt;/a&gt; были спроектированы 11 новых белков-связывателей (UBiPs). Среди них вариант UBiP10 продемонстрировал высокую селективность и способность визуализировать скопления свободного убиквитина вокруг агресом — структур, возникающих при нарушении работы протеасом.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на клеточных моделях и лизатах; необходима дальнейшая проверка специфичности зонда в сложных тканевых средах in vivo.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-01/a-designed-ubiquitin-binding-protein-selectively-enriches-an.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Убиквитин (Ub) — это повсеместно распространенный белок из 76 аминокислотных остатков (8,6 кДа), который регулирует множество биологических процессов в качестве посттрансляционного модификатора. Ферментативный процесс присоединения C-концевого остатка Gly убиквитина к остаткам Lys на белках-субстратах называется убиквитинированием белков [1]. Когда Ub связывается с другой молекулой Ub, он образует цепь Ub, которую можно классифицировать на основе положения акцепторного остатка Lys, например, K48-связанные или K63-связанные цепи и другие. Кроме того, Ub существует в клетке в виде мономера или полимерных цепей, не присоединенных к белкам, которые называются несвязанным Ub [2, 3]. В то время как убиквитинирование белков, которое в основном отвечает за деградацию белков через убиквитин-протеасомную систему (UPS), изучено крайне подробно, несвязанный Ub изучен гораздо меньше. Отсутствие понимания в значительной степени связано с ограниченным набором инструментов для различения несвязанного Ub от его ковалентно связанных форм.&lt;/p&gt;\n&lt;p&gt;Появляющиеся данные свидетельствуют о том, что несвязанный Ub критически важен в различных биологических путях, таких как взаимодействия хозяин-патоген и жизненный цикл белковых агрегатов. Например, во время инфекции вирусом гриппа А (IAV) несвязанный Ub внутри вирусной частицы привлекает гистондеацетилазу 6 (HDAC6) и способствует формированию комплекса с моторными белками динеином и миозином, что облегчает раздевание вириона [4]. Как только вирусная РНК высвобождается в цитозоль, K63-связанные цепи несвязанного Ub активируют клеточный врожденный иммунный ответ путем связывания с сенсором вирусной РНК — белком 5, ассоциированным с дифференцировкой меланомы (MDA5), — что впоследствии запускает активацию интерферон-регуляторного фактора 3 и способствует экспрессии интерферона [5]. Более того, цепи несвязанного Ub участвуют в опосредованной протеасомами разборке агресом [6], которые представляют собой перинуклеарные агрегаты убиквитинированных, неправильно свернутых белков, образующиеся при нарушении работы UPS [7] и ассоциированные с нейродегенеративными заболеваниями, такими как болезнь Альцгеймера и болезнь Паркинсона [8]. Однако прямые доказательства наличия несвязанного Ub в агресомах отсутствуют.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Несвязанный убиквитин играет ключевую роль в иммунном ответе и динамике агресом, однако инструменты для его изучения ограничены, что требует разработки новых высокоаффинных белков.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В настоящее время основным инструментом для изучения несвязанного Ub является домен связывания Ub (BUZ-домен) цинкового пальца (ZnF) деубиквитинирующего фермента изопептидазы T (IsoT; или USP5), который связывается с несвязанным Ub с константой диссоциации (&lt;a href=\"concepts/k-d.html\"&gt;K_d&lt;/a&gt;) 2,8 мкМ [9]. Были разработаны два метода на основе IsoT_BUZ для количественного определения несвязанного Ub в клетках: абсолютная количественная оценка белковых стандартов с использованием масс-спектрометрии (MS) [10] и визуализация флуктуаций несвязанного Ub с использованием производного IsoT_BUZ белка tUI, слитого с флуорофорами [11]. Однако оба метода имеют свои ограничения. Низкое сродство домена IsoT_BUZ по сравнению с антителами делает аффинную очистку несвязанного Ub менее эффективной, что приводит к потенциально неточной количественной оценке, а специфичность tUI для визуализации несвязанного Ub в клетках и его обогащения из клеточных лизатов остается невалидированной. Таким образом, существует явная потребность в более эффективных инструментах для захвата и обнаружения несвязанного Ub.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;K_d (константа диссоциации) — показатель силы связывания: чем меньше число, тем прочнее связь. RFdiffusion — метод глубокого обучения для дизайна белков с заданной структурой.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Последние достижения в дизайне белков, особенно с использованием алгоритмов глубокого обучения, таких как RFdiffusion [12], открыли новые пути для инженерии белков с улучшенной специфичностью и аффинностью. В этом исследовании мы стремились разработать инструмент с повышенной аффинностью и специфичностью для таргетинга несвязанного Ub, начиная с домена ZnF_UBP (далее ZnF) белка HDAC6, который является природным белком, связывающим несвязанный Ub. Мы использовали многомерный мутагенез и созревание аффинности этого домена ZnF для получения мутанта с заметно улучшенной аффинностью связывания. Мы дополнительно модифицировали этот мутант с помощью RFdiffusion, чтобы объединить его с de novo спроектированными структурами и другими известными доменами, связывающими Ub. После оценки &lt;a href=\"concepts/virtualnyy-nokaut.html\"&gt;in silico&lt;/a&gt; с помощью AlphaFold2 [13] мы спроектировали 11 новых белков, связывающих Ub (UBiPs), причем UBiP10 оказался наиболее селективным в отношении несвязанного Ub. В качестве инструмента аффинной очистки UBiP10 специфически обогащал несвязанный Ub как из лизатов клеток, так и из лизатов IAV, даже в присутствии обильных убиквитинированных белков. Мы использовали UBiP10 в сочетании с иммунофлуоресцентной микроскопией для определения и визуализации флуктуаций уровня несвязанного Ub в клетках после обработки ингибитором протеасом бортезомибом или ингибитором E1 Ub-активирующего фермента TAK-243. Кроме того, UBiP10 позволил нам исследовать локализацию несвязанного Ub во время формирования агресом, вызванного ингибированием протеасом: мы обнаружили, что несвязанный Ub накапливается вокруг ядра клетки во время формирования агресом и образует оболочку вокруг зрелой &lt;a href=\"concepts/aggresomes.html\"&gt;агресомы&lt;/a&gt;. Таким образом, UBiP10 является новым и мощным инструментом для изучения несвязанного Ub в клеточной регуляции.&lt;/p&gt;\n&lt;p&gt;Несвязанный Ub характеризуется наличием несвязанного C-конца (-LRLRGG) (Рис. 1A), короткого, неструктурированного мотива, лишенного необходимых эпитопов для производства антител или дизайна de novo белковых связывающих агентов. Домен HDAC6 ZnF является природным мотивом, связывающим несвязанный Ub. Кристаллическая структура показывает, что остатки-гейткиперы R1155/Y1156 и W1182 определяют специфичность и аффинность к несвязанному Ub [14] соответственно (Рис. SN). Структурная простота и ограничения эпитопов несвязанного Ub делают его очень сложной мишенью для разработки специфических антител; поэтому мы выбрали HDAC6 ZnF в качестве рациональной и эффективной отправной точки для разработки нового инструмента. Мы решили начать с созревания аффинности домена HDAC6 ZnF (Рис. 1A) к Ub и впоследствии добавить дополнительные мотивы связывания Ub для разработки специализированного инструмента для изучения несвязанного Ub. Ранние работы показали, что C-концевой фрагмент белка мышиного (m) HDAC6, mHDAC6_(1007–1149), содержащий его домен ZnF и некоторые вышележащие последовательности, обладает исключительно высокой аффинностью к несвязанному Ub с K_d ~60 нМ [15].&lt;/p&gt;\n&lt;p&gt;Чтобы решить, какая конструкция лучше всего подходит для начала наших оптимизаций, мы сначала сравнили этот мышиный фрагмент белка с эквивалентным фрагментом человеческого (h) белка, hHDAC6_(1073–1215), а также с более коротким фрагментом корового домена ZnF, который был кристаллизован в комплексе с Ub, hHDAC6_(1108–1215) — далее, коровый домен ZnF [14] — и с полноразмерным белком, hHDAC6_(1–1215) (Рис. 1B). Мы измерили аффинность связывания очищенных белков к Ub с помощью изотермической титрационной калориметрии (ITC) и обнаружили, что, в хорошем согласии с более ранними результатами, мышиный и человеческий расширенные фрагменты ZnF имеют сопоставимую аффинность к Ub с K_d (69,9 ± 4,6) нМ (Рис. 1C) и (73,5 ± 3,3) нМ (Рис. SN) соответственно. Неожиданно, полноразмерный белок и коровый домен ZnF имели гораздо более низкую аффинность с K_d (1,04 ± 0,20) мкМ (Рис. SN) и (5,16 ± 0,47) мкМ (Рис. 1D) соответственно. Это указывает на то, что гибкая петля из ~30 остатков на N-конце корового домена ZnF существенно усиливает связывание Ub. Чтобы изучить это далее, мы использовали локально установленный AlphaFold2 для предсказания структуры расширенного mHDAC6_ZnF_(1007–1149), связанного с Ub. Модель показала, что N-концевая гибкая область, предшествующая первой α-спирали, охватывает Ub (Рис. 1E), объясняя более высокую аффинность связывания расширенного домена ZnF.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Расширенный домен ZnF (1007–1149) обладает в ~70 раз более высокой аффинностью к убиквитину, чем коровый домен, благодаря гибкой N-концевой петле.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось in vitro и in silico; экстраполяция на живые системы требует осторожности из-за сложности клеточной среды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-01/a-designed-ubiquitin-binding-protein-selectively-enriches-an.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;отсутствие&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;инструментов&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;для анализа Ub&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;дизайн белков&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;через&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;RFdiffusion&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;создан&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;селективный&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;зонд UBiP10&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;новый взгляд&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;на клеточную&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;регуляцию&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале Science advances. Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-01/a-designed-ubiquitin-binding-protein-selectively-enriches-an.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория
