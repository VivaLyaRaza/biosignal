            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"220\" cy=\"68\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"520\" cy=\"280\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как мозг выбирает простые&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;объяснения&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-f1.jpg\" alt=\"Рис. 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Когда мы сталкиваемся с неопределенностью, наш мозг отдает предпочтение более простым объяснениям. Новое исследование показало, что это не просто психологическая привычка, а точный математический расчет. Поведение человека совпадает с байесовским выбором моделей, который защищает от переобучения на случайных данных. Искусственные нейросети, в отличие от людей, эту особенность не всегда повторяют.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Люди систематически предпочитают простые объяснения зашумленным данным&lt;/li&gt;\n&lt;li&gt;Поведение участников совпадает с байесовской теорией выбора моделей&lt;/li&gt;\n&lt;li&gt;Нейросети не всегда воспроизводят эту склонность к простоте&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Исследователи изучили, как люди делают выбор на основе зашумленных и неполных данных, используя подходы статистического выбора моделей. В эксперименте участники оценивали вероятность того, что набор из десяти точек на плоскости был сгенерирован определенной фигурой. Авторы применили аппроксимацию фишеровской информации (&lt;a href=\"concepts/fisher-information-approximation.html\"&gt;Fisher Information Approximation&lt;/a&gt;), чтобы разложить штрафы за сложность моделей на четыре геометрические составляющие: размерность, объем пространства параметров, граничные эффекты и форму. Оказалось, что человеческий выбор количественно точно предсказывается интеграцией по всем возможным скрытым причинам, а не просто случайным шумом в ответах.&lt;/p&gt;\n&lt;p&gt;Интеграция по скрытым параметрам наказывает избыточно гибкие объяснения, которые могут подойти к любому шуму, но не отражают реальность. В то время как люди стабильно демонстрируют это смещение в сторону простоты даже в тех случаях, когда оно оказывается невыгодным, некоторые &lt;a href=\"concepts/ins.html\"&gt;искусственные нейронные сети&lt;/a&gt; лишены такого свойства. Это говорит о том, что принципы оптимального статистического вывода заложены в фундаментальные механизмы человеческого познания.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа основана на поведенческих экспериментах в контролируемых задачах и не исследует прямую нейронную активность мозга.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"concepts/occam-s-razor.html\"&gt;Бритва Оккама&lt;/a&gt; — это принцип, согласно которому при прочих равных условиях следует отдавать предпочтение более простым объяснениям, а не более сложным. Считается, что этот принцип лежит в основе принятия решений человеком, однако природа этого влияния остается неизвестной. В данной работе мы использовали пререгистрированные поведенческие эксперименты, чтобы показать, что люди склонны отдавать предпочтение более простому из двух альтернативных объяснений для неопределенных данных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Люди систематически выбирают более простые объяснения данных, что количественно согласуется с формальными теориями выбора моделей, штрафующими за избыточную гибкость.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эти предпочтения количественно согласуются с предсказаниями формальных теорий выбора моделей, которые накладывают штрафы за избыточную гибкость. Данные штрафы возникают при рассмотрении не только наилучшего объяснения, но и интеграла по всем возможным релевантным объяснениям. Мы также показываем, что эти предпочтения в пользу простоты сохраняются у людей, но не у некоторых искусственных нейронных сетей, даже когда они приводят к неадаптивному поведению.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Выбор модели (model selection) — это статистический метод выбора наиболее подходящей модели из набора кандидатов, который учитывает баланс между точностью подгонки данных и сложностью самой модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Наши результаты позволяют предположить, что принципиальные подходы к статистическому выбору моделей, включая интегрирование по возможным скрытым причинам для предотвращения переобучения на зашумленных данных, могут играть центральную роль в принятии решений человеком.&lt;/p&gt;\n&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"principy-prostoty-v-prinyatii-reshenij\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#principy-prostoty-v-prinyatii-reshenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Принципы простоты в принятии решений&lt;/span&gt;&lt;/a&gt;Принципы простоты в принятии решений&lt;/h4&gt;\n&lt;p&gt;Для принятия решений в реальных условиях нам часто приходится выбирать между несколькими правдоподобными объяснениями зашумленных и разреженных данных. При оценке конкурирующих объяснений бритва Оккама гласит, что следует учитывать не только то, насколько хорошо они описывают наблюдаемые данные, но и их потенциально избыточную гибкость в описании альтернативных и потенциально нерелевантных данных, которые не наблюдались (например, «это сделал призрак!»; Рис. 1a, b). Подобное предпочтение простоты давно предлагается в качестве организующего принципа психической функции, например, в ранней концепции Prägnanz в гештальт-психологии, ряде «принципов минимума» для зрения и теориях, постулирующих центральную роль сжатия данных в когнитивных процессах. Простота также была предложена в качестве одной из ключевых характеристик, помогающих оценивать достоинства объяснения в рамках более широких теорий объяснительной ценности.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-f1.jpg\" alt=\"Рис. 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бритва Оккама в когнитивистике постулирует, что человеческий мозг отдает предпочтение более простым объяснениям, чтобы избежать переобучения на зашумленных данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Многочисленные поведенческие исследования показали, что люди демонстрируют предпочтение простоты при выполнении различных задач, включая перцептивную оценку, реконструкцию источника и причинно-следственное объяснение. В этих исследованиях был предложен ряд формальных определений того, что именно может составлять «простоту», которой отдается предпочтение (или, эквивалентно, «сложность», которая не приветствуется) в данных условиях, включая количество ненаблюдаемых или необъясненных причин, на которые ссылается объяснение, длину описания и колмогоровскую сложность, или статистическую сложность, возникающую при вычислении маргинальных правдоподобий в байесовском выводе. В соответствии с байесовским объяснением, в некоторых случаях предпочтения простоты ослабевают при предоставлении большего объема вероятностных доказательств, что, как предполагается, отражает байесовский априорный вес, отдающий предпочтение более простым объяснениям. Было показано, что другие суждения человека совместимы с байесовской структурой, которая штрафует гибкие объяснения, где эта гибкость контролируется размером пространства параметров, а не его размерностью.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/bayesovskiy-vyvod.html\"&gt;Байесовский вывод&lt;/a&gt; — это метод статистического вывода, при котором вероятности обновляются по мере поступления новых данных, что позволяет оценивать правдоподобность гипотез.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Однако остается неизвестным, связаны ли и как именно эти виды предпочтений простоты количественно с конкретными компромиссами между простотой и качеством подгонки объяснения, которые предписаны теоретическими представлениями о сложности. Целью настоящего исследования было создание теоретически обоснованного количественного описания смещений в сторону простоты при принятии человеком перцептивных решений. Для этого мы разработали набор задач, которые формализовали эти решения как проблему выбора статистической модели. Этот подход позволил нам идентифицировать конкретные характеристики, которые делают одну модель (т. е. потенциальный источник наблюдаемых данных) более или менее сложной, чем другая, и, следовательно, требуют введения штрафов для нейтрализации их предсказанного влияния на качество подгонки из-за избыточной гибкости. Важно отметить, что эти штрафы могут зависеть от данных и, следовательно, не могут быть полностью воспроизведены более общим предпочтением простоты. Как мы подробно опишем ниже, этот подход позволил нам выявить специфические формы смещений в сторону простоты, которые подтверждают идею о том, что бритва Оккама — это не просто предпочтение, а проявление фундаментальных процессов принятия решений, которые интегрируют возможные скрытые причины для противодействия проблемам, возникающим при попытке сопоставить гибкие объяснения с зашумленными данными.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"formalizaciya-britvy-okkama-cherez-vybor-modelej\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#formalizaciya-britvy-okkama-cherez-vybor-modelej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Формализация бритвы Оккама через выбор моделей&lt;/span&gt;&lt;/a&gt;Формализация бритвы Оккама через выбор моделей&lt;/h4&gt;\n&lt;p&gt;Для заданного набора X из N наблюдений и набора возможных параметрических статистических моделей &lt;span class=\"yfm-latex\" data-content=\"%5C%7BM_1%2C%20M_2%2C%20.%20.%20.%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; мы ищем модель M, которая в некотором смысле наилучшим образом описывает данные X. В этом контексте бритву Оккама можно интерпретировать как штраф за то, насколько хорошо модель соответствует данным, измеряемый степенью гибкости или сложности модели, которая может необоснованно завышать качество подгонки при сравнении с другими моделями. Байесовская статистика предоставляет такую меру сложности и определяет, как её следует соотносить с качеством подгонки для максимизации точности принятия решений. Этот компромисс возникает потому, что хотя повышенная сложность модели может обеспечить лучшее соответствие более разнообразным сигналам в данных, она также имеет тенденцию приводить к ошибкам из-за переобучения под шум (Рис. 1c).&lt;/p&gt;\n&lt;p&gt;Согласно байесовскому подходу, модели следует сравнивать на основе их обоснованности (evidence) или маргинального правдоподобия &lt;span class=\"yfm-latex\" data-content=\"p(X%2FM)%20%3D%20%5Cint%20d%5Cvartheta%20w(%5Cvartheta)p(X%2FM%2C%20%5Cvartheta)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, где &lt;span class=\"yfm-latex\" data-content=\"%5Cvartheta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; представляет параметры модели, а &lt;span class=\"yfm-latex\" data-content=\"w(%5Cvartheta)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — связанное с ними априорное распределение. Изменяя параметры, мы можем исследовать варианты модели и очертить многообразие возможных описаний данных. Два таких многообразия визуализированы на Рис. 1c вместе с параметрами максимального правдоподобия, которые присваивают наибольшую вероятность наблюдаемым данным. При мягких предположениях о регулярности и достаточном количестве данных (логарифм) обоснованности может быть записан как сумма максимального логарифма правдоподобия модели M и нескольких штрафных факторов (Рис. 1d). Эти штрафные факторы, которые обнаруживаются даже тогда, когда априорные (не зависящие от данных) вероятности рассматриваемых моделей равны, можно интерпретировать как количественно определенные предпочтения против определенных моделей в соответствии с конкретными формами сложности, которые они воплощают; то есть как количественную форму бритвы Оккама.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод приближения информации Фишера (FIA)&lt;br /&gt;\nМатематический метод оценки сложности статистической модели, который учитывает не только количество параметров, но и геометрическую форму пространства параметров. Это позволяет находить модели, которые чуть хуже подгоняются под обучающие данные, но гораздо лучше обобщают новые наблюдения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Этот подход, который мы называем приближением информации Фишера (Fisher Information Approximation, FIA), использовался для идентификации хуже подогнанных, но лучше обобщающих психофизических моделей, описывающих связь между физическими переменными (например, интенсивностью света) и их психологическими аналогами (например, яркостью). Он связан с аналогичными количественными определениями сложности статистических моделей, такими как концепции минимальной длины описания (Minimum Description Length), минимальной длины сообщения (Minimum Message Length) и прогностической информации (Predictive Information). Ключевой особенностью FIA является то, что если априорное распределение параметров &lt;span class=\"yfm-latex\" data-content=\"w(%5Cvartheta)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; принять за неинформативное, то можно показать, что каждый штрафной фактор отражает отдельное геометрическое свойство модели. Каждое из этих геометрических свойств по-разному характеризует степень, в которой объяснительная сила модели сконцентрирована вблизи (или вдали от) данных.&lt;/p&gt;\n&lt;p&gt;Здесь мы сосредоточимся на четырех ведущих членах (после правдоподобия) этой байесовской формулировки, представляющих четыре различных геометрических свойства модели (Рис. 1c, d). Первый член — это размерность модели (количество параметров), которая представляет собой хорошо известный байесовский информационный критерий (BIC) для выбора моделей. Второй член (новый вклад этой работы; см. раздел «Методы», подраздел A.2) — это граничный штраф, который измеряет степень, в которой набор возможных наблюдений, хорошо объясняемых моделью, ограничен вдали от данных из-за резкого обрыва в том, что модель может представлять; это означает, что модель концентрирует свою объяснительную способность в нерелевантных областях пространства возможных наблюдений. Третий член — это объем модели, который представляет собой количество различимых распределений вероятностей, которые она содержит, и, таким образом, формализует идею «размера пространства параметров», рассматривавшуюся в предыдущих исследованиях. Четвертый член связан с геометрической формой модели, которая чувствительна к тому, имеет ли модель тенденцию «отклоняться» от данных вокруг точки максимального правдоподобия. Эти последние три члена (граница, объем и форма) количественно отражают интуитивное представление о том, что среди всех распределений, описываемых семейством моделей, только те, которые ближе всего к данным, представляют собой полезные объяснения, тогда как остальные составляют «потраченную впустую» объяснительную силу.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Геометрическая сложность моделей&lt;br /&gt;\nПомимо простого числа параметров (критерий BIC), байесовский анализ выявляет три геометрических штрафа: границу, объем и форму модели. Они количественно оценивают «потраченную впустую» объяснительную силу модели на конфигурации, далекие от реальных данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эти штрафы за сложность возникают потому, что байесовский подход маргинализирует параметры модели. Применяя этот подход к принятию решений человеком, мы интерпретируем эту маргинализацию как интегрирование по латентным (скрытым) причинам: чтобы оценить конкретное объяснение (или «модель») для заданного набора наблюдаемых данных, рассматривается, насколько вероятны данные при этом объяснении в среднем по всем возможным конфигурациям этого объяснения. Интуитивно понятно, что гибкие объяснения штрафуются при усреднении в той мере, в какой многие из их конфигураций не имеют ничего общего с наблюдаемым состоянием мира X и, следовательно, обладают исчезающе малой вероятностью &lt;span class=\"yfm-latex\" data-content=\"p(X%2FM%2C%20%5Cvartheta)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;p&gt;Рассмотрим следующий пример, в котором данные представлены точкой на плоскости X = (x, y) (Рис. 2, вверху слева). Задача состоит в том, чтобы сделать выбор между двумя альтернативными объяснениями (моделями) данных: 1) M₁ — распределение Гаусса с центром в точке (0, 0) и единичной изотропной дисперсией; и 2) M₂ — параметрическое семейство гауссиан, также с единичной дисперсией, но с центрами, расположенными в любом месте вдоль прямой линии, соединяющей (-1/2, 1) и (1/2, 1). Очевидно, что M₂ может объяснить более широкий диапазон данных, прямо как призрак на Рис. 1a, и поэтому является более сложной. Для данных, которые равноудалены от двух моделей, X = (0, 1/2), бритва Оккама предписывает нам выбирать M₁. Другими словами, граница принятия решения, разделяющая области, где следует предпочесть ту или иную модель, находится ближе к M₂ (более сложной модели), чем к M₁ (более простой). Как показывают симуляции на Рис. 2, это смещение в пользу простоты характерно именно для лица, принимающего решения, которое интегрирует по латентным причинам (конфигурациям модели), и не является результатом выборки множества возможных объяснений с помощью других, менее систематических средств, например, путем добавления сенсорного шума и/или шума выбора (см. также Рис. SB.9).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-f2.jpg\" alt=\"Рис. 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 2&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"lyudi-demonstriruyut-teoreticheski-obosnovannye-predpochteniya-prostoty\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#lyudi-demonstriruyut-teoreticheski-obosnovannye-predpochteniya-prostoty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Люди демонстрируют теоретически обоснованные предпочтения простоты&lt;/span&gt;&lt;/a&gt;Люди демонстрируют теоретически обоснованные предпочтения простоты&lt;/h4&gt;\n&lt;p&gt;Чтобы соотнести члены сложности FIA с потенциальными предпочтениями, проявляемыми как людьми, так и искусственными лицами, принимающими решения, мы разработали простую задачу на принятие решений. Для каждого испытания N=10 одновременно представленных зашумленных наблюдений (красные точки на Рис. 1e) выбирались из 2D нормального («генеративного») распределения, центрированного где-то внутри одной из двух возможных фигур (черные фигуры на Рис. 1e). Идентификатор фигуры, генерирующей данные (верхняя или нижняя), выбирался случайным образом с равной вероятностью. Аналогично, положение центра нормального распределения внутри выбранной фигуры выбиралось равномерно случайным образом, способом, который не зависел от параметризации модели, с использованием априорного распределения Джеффриса. На основе наблюдений лицо, принимающее решение, выбирало фигуру (модель), которая с большей вероятностью содержала центр генеративного распределения. Мы использовали четыре варианта задачи, каждый из которых был разработан для исследования преимущественно одной из различных геометрических характеристик, штрафуемых при байесовском выборе модели. Иными словами, для каждого варианта ожидается, что байесовский наблюдатель будет иметь специфическое количественное предпочтение в пользу менее сложной альтернативы в каждой паре (Рис. 1c и d). Для этой задачи FIA обеспечивала хорошую аппроксимацию точного байесовского апостериорного распределения (Дополнительная информация, раздел B.1). Соответственно, симулированные наблюдатели, которые все больше интегрировали скрытые причины, подобно байесовскому наблюдателю, демонстрировали возрастающие смещения, подобные FIA. Эти смещения были отличимы от эффектов возрастающего сенсорного шума и/или шума выбора (и ослаблялись ими) (Дополнительная информация B.7.1 и Рис. SN).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Участники исследования продемонстрировали чувствительность ко всем четырем формам сложности модели, что подтверждает их склонность к предпочтению простоты (бритва Оккама) при принятии решений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для наших исследований с участием людей мы использовали онлайн-платформу Pavlovia для реализации задачи и Prolific для набора и тестирования участников. Следуя нашим пререгистрированным подходам, мы собрали данные от 202 участников, разделенных на четыре группы, каждая из которых выполняла одну из четырех отдельных версий задачи, изображенных на Рис. 1e (в каждой группе было ~50 участников). Мы предоставили инструкции, в которых использовали аналогию семян цветка, расположенных на одной из двух клумб, чтобы обеспечить интуитивное представление ключевых концепций зашумленных данных, генерируемых конкретным экземпляром параметрической модели из одного из двух семейств моделей. Чтобы минимизировать возможность того, что участники будут просто учиться на неявной или явной обратной связи в ходе каждой сессии, чтобы делать более оптимальные (т.е. предпочитающие простоту) выборы клумб, мы: 1) использовали условия, при которых разница в производительности между идеальными наблюдателями, штрафующими сложность модели согласно FIA, и симулированными наблюдателями, использующими только правдоподобие модели, составляла ~1% (в зависимости от типа задачи; Рис. 1e, врезки), что соответствует ~5 дополнительным правильным испытаниям в ходе всего эксперимента; и 2) предоставляли обратную связь только в конце каждого блока из 100 испытаний, а не после каждого испытания.&lt;/p&gt;\n&lt;p&gt;Простые поведенческие сводки показывают, что для неоднозначных испытаний, в которых правдоподобие обеих моделей было схожим (а именно, когда данные были равноудалены от обеих моделей, что соответствует условию «при прочих равных» классической формулировки бритвы Оккама), участники чаще выбирали более простую альтернативу (розовая область, простирающаяся над голубыми кривыми на Рис. 3a). Чтобы проверить эту тенденцию во всех условиях стимулов, включая случаи, когда одна модель имела более высокое правдоподобие, чем другая, и количественно оценить степень, в которой на выбор каждого участника влияли правдоподобие модели и каждый из признаков FIA, мы проанализировали наши данные с использованием иерархического (байесовского) подхода логистической регрессии (см. Методы, раздел A.6). Мы определили чувствительность каждого участника к каждому члену FIA как нормализованную величину относительно их чувствительности к правдоподобию (т.е. путем деления логистического коэффициента, связанного с данным членом FIA, на логистический коэффициент, связанный с правдоподобием). Этот анализ показал, что участники были чувствительны ко всем четырем формам сложности модели (Рис. 3). В частности, оцененная нормализованная чувствительность на уровне популяции (апостериорное среднее ± ст. откл., где ноль означает отсутствие чувствительности, а единица — байесовскую оптимальную чувствительность) составила 4,66 ± 0,96 для размерности, 1,12 ± 0,10 для границы, 0,23 ± 0,12 для объема и 2,21 ± 0,12 для устойчивости (отметим, что, следуя нашему пререгистрированному плану, мы подчеркиваем оценку параметров с использованием байесовских подходов здесь и далее в основном тексте, а дополнительную проверку значимости нулевой гипотезы мы приводим в Дополнительной информации, раздел B.6 и Таблица SN).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-f3.jpg\" alt=\"Рис. 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 3&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;FIA (Fisher Information Approximation) — метод оценки сложности модели, который позволяет количественно определить, насколько модель «штрафуется» за избыточную гибкость, помогая понять, почему люди предпочитают более простые объяснения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы дополнили эти анализы формальными сравнениями моделей (WAIC; см. Дополнительную информацию, раздел B.6.1 и Таблицы SN), которые подтвердили, что их поведение лучше описывается с учетом геометрических штрафов, определенных теорией байесовского выбора модели, а не только на основе минимального расстояния между моделью и данными (т.е. решения максимального правдоподобия). Их решения также соответствовали процессам, которые имели тенденцию интегрировать скрытые причины (и имели тенденцию демонстрировать умеренные уровни сенсорного шума и низкий шум выбора; Дополнительная информация B.7 и Рис. SN). В целом, наши анализы показывают, что люди склонны интегрировать скрытые причины таким образом, который порождает бритву Оккама, проявляющуюся как чувствительность к геометрическим признакам при байесовском выборе модели, которые характеризуют сложность модели.&lt;/p&gt;\n&lt;p&gt;Участники также демонстрировали существенную индивидуальную вариативность в производительности, которая включала диапазоны чувствительности к каждому члену FIA, охватывающие оптимальные и субоптимальные значения. Эта вариативность была большой по сравнению с неопределенностью, связанной с оценками чувствительности на уровне участников (Дополнительная информация B.4), и влияла на производительность таким образом, который подчеркивал полезность надлежащим образом настроенных (т.е. близких к байесовски оптимальным) предпочтений простоты: точность имела тенденцию снижаться у участников с чувствительностью FIA, более далекой от теоретических предсказаний (Рис. 2c; апостериорное среднее ± ст. откл. коэффициента Спирмена между точностью и /β - 1/, где β — чувствительность: размерность, -0,69 ± 0,05; граница, -0,21 ± 0,11; объем, -0,10 ± 0,10; устойчивость, -0,54 ± 0,10). Субоптимальная чувствительность, продемонстрированная многими участниками, по-видимому, не была результатом просто отсутствия вовлеченности в задачу, поскольку чувствительность FIA не коррелировала с ошибками в легких испытаниях (апостериорное среднее ± ст. откл. коэффициента Спирмена между частотой пропусков, оцененной с помощью расширенной регрессионной модели, подробно описанной в Методах, раздел A.6.1, и абсолютной разницей от оптимальной чувствительности для: размерности, 0,08 ± 0,12; границы, 0,15 ± 0,12; объема, -0,04 ± 0,13; устойчивости, 0,15 ± 0,14; см. Дополнительную информацию, раздел B.5). Аналогично, субоптимальная чувствительность FIA не коррелировала с более слабой чувствительностью к правдоподобию для членов границы (rho = -0,13 ± 0,11) и объема (-0,06 ± 0,11), хотя более сильные отрицательные связи с членами размерности (-0,35 ± 0,07) и устойчивости (-0,56 ± 0,10) предполагают, что более экстремальные и вариативные предпочтения простоты в этих условиях (и более низкая производительность в среднем; см. Рис. 2c) отражали более общую трудность при выполнении этих версий задачи.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на поведенческих данных людей в контролируемых условиях; индивидуальные различия в чувствительности к сложности модели могут зависеть от когнитивных факторов, не учтенных в данной модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"iskusstvennye-nejronnye-seti-obuchayutsya-optimalnym-predpochteniyam-prostoty\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#iskusstvennye-nejronnye-seti-obuchayutsya-optimalnym-predpochteniyam-prostoty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Искусственные нейронные сети обучаются оптимальным предпочтениям простоты&lt;/span&gt;&lt;/a&gt;Искусственные нейронные сети обучаются оптимальным предпочтениям простоты&lt;/h4&gt;\n&lt;p&gt;Чтобы лучше понять оптимальность, вариативность и общность предпочтений простоты, продемонстрированных нашими участниками-людьми, мы сравнили их результаты с показателями искусственных нейронных сетей (ИНС), обученных оптимизировать выполнение этой задачи. Мы использовали новую архитектуру ИНС, разработанную нами для выбора статистической модели в форме, применимой к описанной выше задаче (Рис. 4a, b). В каждой попытке сеть получала на вход два изображения, представляющих сравниваемые модели, и набор координат, представляющих наблюдения в данной попытке. Выходом сети было решение между двумя моделями, закодированное как вектор softmax. Мы проанализировали 50 экземпляров ИНС, которые различались только случайной инициализацией весов и примерами, увиденными во время обучения, используя тот же подход логистической регрессии, который мы применяли для участников-людьми.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-f4.jpg\" alt=\"Рис. 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 4&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ИНС (искусственная нейронная сеть) — это математическая модель, имитирующая работу нейронов мозга для распознавания образов, а softmax — функция, преобразующая выходные данные в вероятности выбора одной из моделей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ИНС была спроектирована следующим образом (подробности см. в разделе «Методы»). Входной каскад состоял из двух предобученных сверточных нейронных сетей (CNN) VGG16, каждая из которых принимала графическое представление одной из двух рассматриваемых моделей. VGG была выбрана как популярная архитектура, часто используемая в качестве эталона для сравнения с человеческой зрительной системой. CNN состояли из стека сверточных слоев, веса которых оставались замороженными на предобученных значениях, за которыми следовали три полносвязных слоя, веса которых могли изменяться в процессе обучения. Выходы CNN подавались в многослойный перцептрон (MLP), состоящий из линейных слоев, слоев выпрямления (ReLU) и слоев пакетной нормализации. Выходы MLP затем объединялись и подавались в эквивариантный MLP, который обеспечивает эквивариантность выхода сети при перестановке позиций двух моделей с помощью специальной схемы разделения параметров. Сеть также содержала две структуры условного вариационного автокодировщика (C-&lt;a href=\"concepts/vae.html\"&gt;VAE&lt;/a&gt;), которые стремились воспроизвести процесс генерации данных, обусловленный каждой моделью, и тем самым побуждали вышестоящие полносвязные слои изучать представления моделей, фиксирующие значимые для задачи признаки.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Данное исследование использует ИНС как вычислительную модель; результаты, полученные на нейронных сетях, не могут напрямую экстраполироваться на биологические механизмы принятия решений человеком.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;После обучения ИНС выполняли задачу значительно лучше, чем участники-люди, демонстрируя более высокую общую точность, включая более высокую чувствительность к правдоподобию (Дополнительная информация, раздел B.3) и предпочтения простоты, которые более точно соответствовали теоретически оптимальным значениям (Рис. 4c, d). Эти предпочтения простоты были ближе к тем, что ожидались от симулированных наблюдателей, использующих точное апостериорное распределение байесовской модели, а не аппроксимацию FIA, что согласуется с тем фактом, что FIA обеспечивает несовершенную аппроксимацию точного байесовского апостериорного распределения. Эти предпочтения простоты незначительно варьировались по величине между различными сетями, но, в отличие от участников-людей, эта вариативность была относительно небольшой (сравните диапазоны значений на Рис. 3c и 4d, построенных в разных масштабах осей x) и не была признаком субоптимального поведения сети, поскольку она не была систематически связана с какими-либо различиями в целом высоких показателях точности для каждого условия (Рис. 4d; среднее апостериорное ± ст. откл. коэффициента Спирмена rho между точностью и /β − 1/, где β — чувствительность: размерность, -0.14 ± 0.10; граница, 0.08 ± 0.11; объем, -0.12 ± 0.11; устойчивость, -0.08 ± 0.11).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ИНС превзошли людей в точности и предпочтении оптимальных моделей, а стохастическая вариативность в сетях была значительно ниже, чем у людей, что указывает на иную природу их ошибок.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эти результаты подразумевают, что стохастическая природа задачи порождает некоторую вариативность в смещениях простоты даже после интенсивного обучения для оптимизации точности выполнения, но этот источник вариативности сам по себе не может объяснить диапазон чувствительности (и субоптимальности), продемонстрированный участниками-людьми.&lt;/p&gt;\n&lt;h4 id=\"lyudi,-v-otlichie-ot-ins,-sohranyayut-predpochtenie-suboptimalnoj-prostoty\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#lyudi,-v-otlichie-ot-ins,-sohranyayut-predpochtenie-suboptimalnoj-prostoty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Люди, в отличие от ИНС, сохраняют предпочтение субоптимальной простоты&lt;/span&gt;&lt;/a&gt;Люди, в отличие от ИНС, сохраняют предпочтение субоптимальной простоты&lt;/h4&gt;\n&lt;p&gt;Наши результаты в сочетании с тем фактом, что мы не предоставляли участникам обратную связь по каждой попытке во время выполнения задачи, позволяют предположить, что измеренные нами предпочтения простоты у людей не являются просто выученными оптимизациями для данных условий задачи, а скорее представляют собой более внутреннюю (и вариативную) часть того, как мы принимаем решения в условиях неопределенности. Однако, поскольку мы предоставили каждому участнику инструкции, отражающие байесовское мышление (см. Методы), и провели краткую тренировочную сессию с обратной связью перед тестированием, мы не можем исключить на основе данных, представленных только на Рис. 3, что по крайней мере некоторые аспекты предпочтений простоты, измеренные у участников, зависели от этих конкретных инструкций и условий обучения. Поэтому мы провели второй эксперимент, чтобы исключить эту возможность.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Люди демонстрируют устойчивое предпочтение простоты независимо от инструкций, в то время как ИНС адаптируют свои стратегии под конкретные условия обучения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для этого эксперимента мы использовали те же варианты задачи, что и выше, но с другим набором инструкций и обучения, разработанным для того, чтобы побудить участников выбирать модель с максимальным правдоподобием (т.е. не интегрировать по скрытым причинам, а рассматривать только ту единственную причину, которая лучше всего соответствует наблюдаемым данным), тем самым игнорируя сложность модели. В частности, визуальные подсказки были такими же, как в исходном эксперименте, но участников просили сообщить, какая из двух фигур на экране ближе к центру масс облака точек. Мы убедились, что участники, набранные для этой задачи «максимального правдоподобия», не участвовали в исходной «генеративной» задаче. Мы снова следовали заранее зарегистрированному плану эксперимента и анализа и собрали данные от 201 участника, разделенных на четыре группы по ~50 человек в каждой. Мы также обучили и протестировали ИНС на этой версии задачи, используя решение с максимальным правдоподобием в качестве правильного ответа.&lt;/p&gt;\n&lt;p&gt;Несмотря на это существенное различие в инструкциях и обучении, участники-люди продемонстрировали схожие предпочтения простоты как в генеративной задаче, так и в задаче с максимальным правдоподобием, что позволяет предположить, что люди имеют общую склонность к простоте даже без соответствующих инструкций или стимулов (Рис. 5, слева). В частности, несмотря на некоторые количественные различия, распределения относительной чувствительности показали одинаковые базовые закономерности для обеих задач, с общим увеличением относительной чувствительности от объема (0,19±0,08 для задачи с максимальным правдоподобием; сравните со значениями выше), к границе (0,89±0,10), к робастности (2,27±0,15) и к размерности (2,29±0,41). В резком контрасте с данными людей и ИНС, обученными на истинной генеративной задаче, чувствительность ИНС к сложности модели в задаче с максимальным правдоподобием была близка к нулю для всех четырех параметров (Рис. 5, справа).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-f5.jpg\" alt=\"Рис. 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 5&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на поведенческих экспериментах с людьми и компьютерном моделировании (ИНС); перенос выводов о «врожденности» предпочтений требует осторожности, так как выборка ограничена 201 участником.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтобы суммировать сходства и различия между тем, как люди и ИНС использовали смещения простоты для управления своим поведением при принятии решений в этих задачах, и их последствия для производительности, на Рис. 6 показана общая точность для каждого набора протестированных нами условий. В частности, для каждого участника или ИНС, конфигурации задачи и набора инструкций мы вычислили процент правильных ответов как по отношению к генеративной задаче (т.е. для которой теоретически оптимальная производительность зависит от смещений простоты), так и по отношению к задаче с максимальным правдоподобием (т.е. для которой теоретически оптимальная производительность не зависит от смещений простоты). Поскольку решения с максимальным правдоподобием детерминированы (они зависят только от того, к какой модели ближе центроид данных, и, следовательно, существует оптимальная, четкая граница принятия решений, которая ведет к идеальной производительности), а генеративные решения — нет (они зависят вероятностно от членов правдоподобия и смещения, поэтому, как правило, невозможно достичь идеальной производительности), ожидается, что производительность в первом случае будет выше, чем во втором. Соответственно, как ИНС, так и (в меньшей степени) люди, как правило, работали лучше, когда их оценивали относительно решений с максимальным правдоподобием.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-f6.jpg\" alt=\"Рис. 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 6&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Более того, ИНС, как правило, демонстрировали поведение, которое соответствовало оптимизации под заданные условия задачи: сети, обученные находить решения с максимальным правдоподобием, справлялись лучше, чем сети, обученные находить генеративные решения для задачи с максимальным правдоподобием, и сети, обученные находить генеративные решения, справлялись лучше, чем сети, обученные находить решения с максимальным правдоподобием для генеративной задачи. Напротив, люди, как правило, принимали схожие стратегии независимо от условий задачи, во всех случаях используя байесовские смещения простоты. Короче говоря, ИНС демонстрировали предпочтения простоты только тогда, когда их этому обучали, в то время как участники-люди демонстрировали их независимо от своих инструкций и обучения.&lt;/p&gt;\n&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;h4 id=\"teoreticheskie-osnovy-predpochteniya-prostoty\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#teoreticheskie-osnovy-predpochteniya-prostoty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теоретические основы предпочтения простоты&lt;/span&gt;&lt;/a&gt;Теоретические основы предпочтения простоты&lt;/h4&gt;\n&lt;p&gt;Простота долгое время считалась ключевым элементом эффективного мышления и рационального принятия решений. Она была предложена в качестве фундаментального принципа в философии, психологии, статистическом выводе и, в последнее время, в машинном обучении. Соответственно, в человеческом познании были выявлены различные формы предпочтения простоты, такие как тенденция отдавать предпочтение более гладким (простым) кривым как предполагаемому скрытому источнику зашумленных наблюдаемых данных, а также в зрительном восприятии, связанном с группировкой, обнаружением контуров и идентификацией форм. Однако, несмотря на прочную теоретическую базу этих исследований, ни одно из них не пыталось определить количественное понятие «предвзятости в пользу простоты» (simplicity bias), величину которой можно было бы измерить (а не просто обнаружить) в поведении человека. В данной работе мы показали, что предпочтения простоты тесно связаны с конкретной математической формулировкой бритвы Оккама, находящейся на стыке байесовского выбора моделей и теории информации. Эта формулировка позволила нам выйти за рамки простого обнаружения предпочтения простых объяснений данных и точно измерить силу этого предпочтения у искусственных и человеческих участников в различных теоретически обоснованных условиях.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мы разработали количественный метод измерения предвзятости в пользу простоты, основанный на байесовском выборе моделей, что позволяет измерять силу этого предпочтения, а не просто констатировать его наличие.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"teoreticheskij-vklad-approksimaciya-informacii-fishera\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#teoreticheskij-vklad-approksimaciya-informacii-fishera\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теоретический вклад: аппроксимация информации Фишера&lt;/span&gt;&lt;/a&gt;Теоретический вклад: аппроксимация информации Фишера&lt;/h4&gt;\n&lt;p&gt;Наше исследование вносит несколько новых вкладов. Первый — теоретический: мы вывели новый член аппроксимации информации Фишера (FIA) в байесовском выборе моделей, который учитывает возможность того, что лучшая модель находится на границе семейства моделей (см. подробности в разделе «Методы» A.2). Этот граничный член важен, поскольку он может объяснить ситуацию, когда из-за шума в данных лучшее значение одного параметра (или комбинации параметров) принимает экстремальное значение. Это условие связано с феноменом «испарения параметров», который часто встречается в реальных моделях данных. Более того, границы параметров особенно важны для исследований перцептивного принятия решений, в которых сенсорные стимулы ограничены физическими рамками экспериментальной установки, и поэтому рассуждения о неограниченных параметрах были бы проблематичными для наблюдателей. Например, представьте эксперимент, требующий от участников сообщить местоположение визуального стимула. В этом случае неограниченный набор возможных мест (например, вдоль линии, уходящей бесконечно далеко влево и вправо) явно неприемлем. Наш «граничный» член формализует влияние рассмотрения набора возможностей как имеющего границы, что имеет тенденцию увеличивать локальную сложность за счет уменьшения количества локальных гипотез, близких к данным (см. Рис. 1b).&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 1.&lt;/strong&gt; Сравнение параметров генеративных задач и задач максимального правдоподобия для людей и ИНС&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Параметр&lt;/th&gt;\n&lt;th&gt;Люди (Генеративная)&lt;/th&gt;\n&lt;th&gt;ИНС (Генеративная)&lt;/th&gt;\n&lt;th&gt;Люди (Макс. правдоподобие)&lt;/th&gt;\n&lt;th&gt;ИНС (Макс. правдоподобие)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;µα (смещение вверх/вниз)&lt;/td&gt;\n&lt;td&gt;0.107 ± 0.023&lt;/td&gt;\n&lt;td&gt;−0.242 ± 0.151&lt;/td&gt;\n&lt;td&gt;0.056 ± 0.024&lt;/td&gt;\n&lt;td&gt;0.010 ± 0.07&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;µL (правдоподобие)&lt;/td&gt;\n&lt;td&gt;0.461 ± 0.012&lt;/td&gt;\n&lt;td&gt;6.529 ± 0.188&lt;/td&gt;\n&lt;td&gt;0.561 ± 0.018&lt;/td&gt;\n&lt;td&gt;7.966 ± 0.401&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;µD (размерность)&lt;/td&gt;\n&lt;td&gt;2.150 ± 0.445&lt;/td&gt;\n&lt;td&gt;8.484 ± 0.653&lt;/td&gt;\n&lt;td&gt;1.285 ± 0.231&lt;/td&gt;\n&lt;td&gt;−0.030 ± 0.486&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;µB (граница)&lt;/td&gt;\n&lt;td&gt;0.518 ± 0.045&lt;/td&gt;\n&lt;td&gt;6.286 ± 0.186&lt;/td&gt;\n&lt;td&gt;0.499 ± 0.058&lt;/td&gt;\n&lt;td&gt;0.883 ± 0.121&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;µV (объем)&lt;/td&gt;\n&lt;td&gt;0.108 ± 0.057&lt;/td&gt;\n&lt;td&gt;6.089 ± 0.204&lt;/td&gt;\n&lt;td&gt;0.105 ± 0.044&lt;/td&gt;\n&lt;td&gt;0.128 ± 0.196&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;µR (робастность)&lt;/td&gt;\n&lt;td&gt;1.018 ± 0.056&lt;/td&gt;\n&lt;td&gt;4.882 ± 0.417&lt;/td&gt;\n&lt;td&gt;1.276 ± 0.085&lt;/td&gt;\n&lt;td&gt;0.356 ± 0.281&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 2.&lt;/strong&gt; Статистические показатели параметров (ROPE, 95% HDI и PD)&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Параметр&lt;/th&gt;\n&lt;th&gt;ROPE&lt;/th&gt;\n&lt;th&gt;95% HDI (генеративная)&lt;/th&gt;\n&lt;th&gt;PD (генеративная)&lt;/th&gt;\n&lt;th&gt;95% HDI (макс. правдоподобие)&lt;/th&gt;\n&lt;th&gt;PD (макс. правдоподобие)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Правдоподобие&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;βL&lt;/td&gt;\n&lt;td&gt;&amp;lt; 0.0076&lt;/td&gt;\n&lt;td&gt;[0.012, 0.437]&lt;/td&gt;\n&lt;td&gt;1.00 [0.526, 0.597] 1.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Размерность&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;βD&lt;/td&gt;\n&lt;td&gt;&amp;lt; 0.43&lt;/td&gt;\n&lt;td&gt;[1.299, 3.048]&lt;/td&gt;\n&lt;td&gt;1.00 [0.835, 1.745] 1.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Граница&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;βB&lt;/td&gt;\n&lt;td&gt;&amp;lt; 0.06&lt;/td&gt;\n&lt;td&gt;[0.43, 0.604]&lt;/td&gt;\n&lt;td&gt;1.00 [0.386, 0.612] 1.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Объем&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;βV&lt;/td&gt;\n&lt;td&gt;&amp;lt; 0.091&lt;/td&gt;\n&lt;td&gt;[−0.005, 0.218]&lt;/td&gt;\n&lt;td&gt;0.97 [0.019, 0.193] 0.99&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Робастность&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;βR&lt;/td&gt;\n&lt;td&gt;&amp;lt; 0.11&lt;/td&gt;\n&lt;td&gt;[0.908, 1.126]&lt;/td&gt;\n&lt;td&gt;1.00 [1.11, 1.446] 1.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;ROPE — область практической эквивалентности, HDI — интервал наивысшей плотности, PD — вероятность направления.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"iskusstvennye-nejronnye-seti-i-obuchenie\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#iskusstvennye-nejronnye-seti-i-obuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Искусственные нейронные сети и обучение&lt;/span&gt;&lt;/a&gt;Искусственные нейронные сети и обучение&lt;/h4&gt;\n&lt;p&gt;Второй вклад этой работы относится к искусственным нейронным сетям (ИНС): мы показали, что эти сети могут научиться использовать или игнорировать предпочтения простоты оптимальным образом (т.е. в соответствии с величинами, предписанными теорией), в зависимости от того, как они обучены. Эти результаты отличаются от недавних работ, сосредоточенных на идее о том, что реализация простых функций может быть ключом к обобщению в глубоких нейронных сетях, и дополняют их. Здесь мы показали, что эффективное обучение может учитывать сложность пространства гипотез, а не решающей функции, при формировании нормативных предпочтений простоты. С одной стороны, эти результаты не кажутся удивительными, поскольку ИНС, и глубокие сети в частности, являются мощными аппроксиматорами функций, которые хорошо работают на практике в широком спектре задач вывода. Соответственно, наши ИНС, обученные с учетом истинных генеративных решений, смогли принимать эффективные решения, включая предпочтения простоты, относительно генеративного источника заданного набора наблюдений. Аналогичным образом, наши ИНС, обученные с учетом решений максимального правдоподобия, смогли принимать эффективные решения без предпочтений простоты относительно соответствия максимальному правдоподобию для заданного набора наблюдений. С другой стороны, эти результаты также дают новое понимание того, как можно анализировать ИНС, чтобы лучше понять, какие решения они производят для конкретных проблем. В частности, оценка наличия или отсутствия видов предпочтений простоты, которые мы наблюдали, может помочь определить, избегает ли ИНС переобучения на обучающих данных и обеспечивает ли более обобщаемые решения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ИНС — это вычислительные модели, имитирующие работу нейронов мозга, способные обучаться на данных. &lt;a href=\"concepts/overfitting.html\"&gt;Переобучение&lt;/a&gt; (overfitting) — это ситуация, когда модель «зазубривает» шум в данных, теряя способность к обобщению.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"povedenie-cheloveka-i-bajesovskaya-integraciya\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#povedenie-cheloveka-i-bajesovskaya-integraciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поведение человека и байесовская интеграция&lt;/span&gt;&lt;/a&gt;Поведение человека и байесовская интеграция&lt;/h4&gt;\n&lt;p&gt;Третий и самый важный вклад этой работы относится к поведению человека: люди склонны использовать определенные формы предпочтений простоты при принятии решений, которые подразумевают конкретные базовые вычисления. С теоретической точки зрения, разница между байесовским решением (т.е. тем, которое включает предпочтения простоты) и решением максимального правдоподобия (т.е. тем, которое не включает предпочтения простоты) для этих задач заключается в том, что последнее учитывает только одну наилучшую модель из каждого семейства, тогда как первое интегрирует все возможные модели в каждом семействе. Этот процесс интеграции и порождает предвзятость в пользу простоты, которая, что критически важно, не может возникнуть из более простых механизмов, таких как выборка по различным возможным причинам стимула из-за ненадежного сенсорного представления или стохастического процесса выбора (см. Рис. 2). Наш вывод о том, что люди, в отличие от ИНС, склонны использовать байесовское решение даже тогда, когда им даны инструкции использовать максимальное правдоподобие, предполагает, что мы естественно принимаем решения не на основе единственного наилучшего или архетипического экземпляра из семейства возможностей, а скорее интегрируем по всему этому семейству. Говоря конкретнее применительно к нашей задаче: когда участников просили определить форму, наиболее близкую к точкам данных, они, вероятно, не были уверены, какое именно место на каждой форме является ближайшим. Поэтому они естественным образом интегрировали по всем возможностям, что вызывает предпочтения простоты, как предписано байесовским решением. Эти результаты помогут мотивировать и информировать будущие исследования, чтобы определить, где и как мозг реализует и хранит эти интегрированные решения для соответствующих проблем принятия решений.&lt;/p&gt;\n&lt;h4 id=\"istochniki-raznoobraziya-predpochtenij\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#istochniki-raznoobraziya-predpochtenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники разнообразия предпочтений&lt;/span&gt;&lt;/a&gt;Источники разнообразия предпочтений&lt;/h4&gt;\n&lt;p&gt;Еще одной ключевой особенностью наших результатов, заслуживающей дальнейшего изучения, является величина и изменчивость предпочтений, демонстрируемых участниками-людьми. В среднем чувствительность человека к каждой характеристике геометрической модели была: 1) больше нуля, 2) по крайней мере, немного отличалась от оптимального значения (например, больше для размерности и надежности, меньше для объема), 3) различалась для разных характеристик и разных участников и 4) была относительно нечувствительна к инструкциям и обучению. В чем источник этого разнообразия? Одна из гипотез заключается в том, что люди могут придавать больший вес тем характеристикам модели, которые легче или дешевле вычислить. В наших экспериментах наиболее весомой характеристикой была размерность модели. В нашей математической формулировке эта характеристика соответствует количеству степеней свободы возможного объяснения наблюдаемых данных и, следовательно, может быть относительно легко оценена. Напротив, наименее весомой характеристикой был объем модели. Эта характеристика подсчитывает количество различимых распределений вероятностей, содержащихся в модели, и, следовательно, включает интеграцию по всему семейству моделей. Другими словами, чтобы подсчитать, сколько различных состояний мира может быть объяснено определенной гипотезой, нужно их перечислить. Эта операция может быть вычислительно затратной (хотя для моделей, которые мы использовали в наших задачах, это число напрямую связано с длиной линий, нарисованных на экране, измеренной в единицах стандартного отклонения шума, и, следовательно, может быть довольно простым для оценки нашими участниками, см. раздел «Методы» A.4). Два других члена, граница и надежность, являются промежуточными с точки зрения человеческого веса и вычислительной сложности. Их труднее вычислить, чем размерность, поскольку они зависят от данных и от свойств модели в точке максимального правдоподобия. Однако они также проще, чем член объема, поскольку являются локальными величинами, не требующими интеграции по всему многообразию модели. Эта интуиция приводит к новым вопросам о взаимосвязи между сложностью сравниваемых объяснений и сложностью самого процесса принятия решений, ставя под сомнение понятия ограниченной рациональности и убывающей отдачи при оптимальном выводе. Ответы на такие вопросы выходят за рамки настоящей работы, но заслуживают дальнейшего изучения.&lt;/p&gt;\n&lt;h4 id=\"budushie-napravleniya-i-ogranicheniya\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#budushie-napravleniya-i-ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Будущие направления и ограничения&lt;/span&gt;&lt;/a&gt;Будущие направления и ограничения&lt;/h4&gt;\n&lt;p&gt;Другим интригующим будущим направлением является сравнение с другими формальными подходами к возникновению простоты, которые могут привести к иным предсказаниям. Недавние исследования утверждают, что априорное распределение Джеффри (на котором основан наш геометрический подход) может дать неполную картину сложности класса моделей, часто встречающихся в естественных науках, которые содержат много комбинаций параметров, не влияющих на поведение модели, и вместо этого предложили использование априорных распределений, зависящих от данных. Эти два метода приводят к разным результатам, особенно в режиме ограниченных данных. Было бы полезно понять значимость этих различий для принятия решений человеком и машиной. Дизайн нашей задачи и анализы имели несколько ограничений, которые могут быть решены в будущих исследованиях. Мы использовали только четыре варианта задачи, что ограничивает обобщаемость наших результатов (хотя отметим, что, поскольку штрафы за границу и надежность зависят от модели и данных, они оба предполагали континуум значений в задачах, и штраф за границу был актуален для всех типов задач). Мы также рассматривали только фиксированный размер выборки N, условия для которых FIA для вовлеченных моделей могла быть вычислена аналитически, и независимые испытания, которые игнорируют последовательные аспекты повторяющихся решений. Расширение нашего подхода для ослабления этих допущений или включение условий, в которых объем или размерность моделей могут варьироваться более свободно, дало бы дальнейшее понимание того, когда и как люди проявляют предпочтения простоты при принятии решений. В целом, наша работа демонстрирует прямую количественную значимость формальных понятий сложности модели для поведения человека. Опираясь на комбинацию теоретических достижений, вычислительного моделирования и поведенческих экспериментов, мы установили новый набор нормативных ориентиров для принятия решений в условиях неопределенности. Эти результаты открывают новую область, в которой человеческое познание может быть измерено относительно оптимальных процессов вывода, что потенциально приведет к новым знаниям об ограничениях, влияющих на обработку информации в мозге.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на сочетании математического моделирования и поведенческих экспериментов; результаты ограничены использованными типами задач и фиксированным размером выборки, что требует осторожности при экстраполяции на более сложные реальные сценарии.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-fS1.jpg\" alt=\"Рис. S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-fS2.jpg\" alt=\"Рис. S2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-fS2-2.jpg\" alt=\"Рис. S2 (продолжение 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S2 (продолжение 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-fS3.jpg\" alt=\"Рис. S3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-fS4.jpg\" alt=\"Рис. S4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-fS4-2.jpg\" alt=\"Рис. S4 (продолжение 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S4 (продолжение 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-fS4-3.jpg\" alt=\"Рис. S4 (продолжение 3)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S4 (продолжение 3)&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;природа&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;человеческих&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;предпочтений&lt;/text&gt;&lt;text x=\"26\" y=\
