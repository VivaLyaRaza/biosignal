        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"219\" cy=\"159\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"681\" cy=\"207\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Почему мозг людей с&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;афантазией видит иначе?&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-f1.jpg\" alt=\"Рисунок 1. Трактометрия выявляет избирательные различия микроструктуры белого вещества при афантазии. (A) Тракт с пониже\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Трактометрия выявляет избирательные различия микроструктуры белого вещества при афантазии. (A) Тракт с пониженной фракционной анизотропией (FA) у лиц с афантазией по сравнению с визуализаторами (Vis. &amp;gt; Aph.): левый крючковидный пучок (UF), правый UF и задний мозолисто-мозговой пучок межтеменной области. На верхних панелях показаны профили трактов (среднее ± SEM); на нижних — реконструкции трактов типичного участника с цветовой кодировкой по положению сегмента (узлы 1–100). Красные линии обозначают лиц с афантазией, синие — визуализаторов. Затененные серые области отмечают сегменты со значимыми различиями между группами (p &amp;lt; 0.05, с поправкой FWE). (B) Тракти с повышенной FA у лиц с афантазией по сравнению с визуализаторами (Aph. &amp;gt; Vis.): левый и правый дорсальный поясной пучок. На верхних панелях показаны профили трактов (среднее ± SEM); на нижних — типичные реконструкции трактов с цветовой кодировкой по положению сегмента. Красные линии обозначают лиц с афантазией, синие — визуализаторов. Затененные серые области и черные полосы на оси x отмечают значимые сегменты (p &amp;lt; 0.05, с поправкой FWE). Тонкие линии показывают индивидуальные профили участников, толстые — групповые средние.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Когда большинство людей закрывает глаза и пытается представить яблоко, они действительно видят его образ. Однако при врожденной афантазии эта способность отсутствует с рождения, хотя память и зрительное восприятие работают нормально. Раньше считалось, что дело в поломке зрительных зон, но свежие данные МРТ указывают на сети контроля и ассоциативные зоны.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;У людей с афантазией изменены лобно-височные и поясные пути белого вещества&lt;/li&gt;\n&lt;li&gt;Первичная зрительная кора и основные зрительные пути остаются неизменными&lt;/li&gt;\n&lt;li&gt;Причиной отсутствия образов могут быть сбои в сетях высшего контроля&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Врожденная афантазия проявляется как неспособность создавать произвольные зрительные образы при сохранных базовых функциях зрения. Долгое время исследователи спорили, кроется ли причина в дефектах самих зрительных путей или в нарушении работы систем контроля высшего порядка. Чтобы разобраться в этом, ученые применили диффузионную и структурную МРТ для оценки состояния мозга.&lt;/p&gt;\n&lt;p&gt;В исследовании участвовали 18 человек с врожденной афантазией и 18 добровольцев из контрольной группы с нормальной визуализацией. Мультимодальный анализ включал оценку микроструктуры белого вещества, трактографию областей интереса, сетевую топографию и кортикометрию. Участники с афантазией продемонстрировали структурные отличия в лобно-височных и поясных путях белого вещества, включая крючковидный пучок и дорсальный циглум, а также в зонах коры вроде передней инсулы и префронтальной области.&lt;/p&gt;\n&lt;p&gt;При этом исследователи не обнаружили значимых различий в первичной зрительной коре, основных зрительных трактах или прямых связях базовой сети воображения. Полученные данные подтверждают гипотезу о том, что за отсутствие осознанных образов отвечает не деградация восприятия, а особенности интеграции в ассоциативных сетях.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа выполнена на малой выборке из 18 участников с афантазией и носит предварительный характер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Врожденная афантазия проявляется в пожизненном отсутствии произвольных зрительных образов при сохранных зрительных знаниях, что предоставляет уникальную модель для изучения разделения сенсорных представлений и осознанного воображения. Предыдущие функциональные исследования указывают на возможное изменение нисходящих взаимодействий между системами высшего контроля и зонами высокой зрительной коры, однако особенности анатомического строения при этом состоянии оставались неизученными.&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;p&gt;Для проверки двух конкурирующих гипотез — о наличии структурных различий либо в зрительных проводящих путях, либо в ассоциативных сетях высшего порядка — авторы применили диффузионную и структурную МРТ. В исследовании приняли участие 18 человек с врожденной афантазией и 18 сопоставимых по характеристикам контрольных испытуемых с нормальной способностью к визуализации. Был проведен комплексный мультимодальный анализ микроструктуры белого вещества, трактография на основе функциональных зон интереса, оценка графо-теоретической организации сетей и морфометрия коры головного мозга.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Трактография — это метод нейровизуализации на основе МРТ, который позволяет реконструировать и изучать проводящие пути белого вещества (тракты) в живом мозге.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;p&gt;У людей с афантазией были обнаружены структурные отличия в лобно-височных и цингулярных путях белого вещества, включая крючковидный пучок (uncinate fasciculus), задние межполушарные волокна мозолистого тела в области межтеменной борозды и дорсальный пояс (cingulum). Кроме того, зафиксированы изменения в фронтотемпоральных корковых зонах, таких как передняя инсула, передняя префренотальная кора и медиальная височная кора. Вместе эти изменения формируют кандидатный нейроанатомический профиль для широкого когнитивно-аффективного спектра при афантазии.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ученые не выявили значимых различий в первичной зрительной коре, основных зрительных трактах и прямых структурных связях базовой сети воображения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;p&gt;Полученные данные показывают, что врожденная афантазия сопровождается структурными изменениями преимущественно в лобно-височных и поясных системах, тогда как основные зрительные пути остаются неизменными.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Из-за относительно небольшой выборки (по 18 человек в каждой группе) результаты носят исследовательский и гипотезообразующий характер и требуют обязательного воспроизведения на более крупных выборках.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тем не менее, эти результаты позволяют предполагать, что за отсутствие осознанных образов при афантазии отвечают системы высшего порядка, обеспечивающие интеграцию и сознательный доступ к информации, а не сами первичные зрительные представления.&lt;/p&gt;\n&lt;h3 id=\"vvedenie1\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#vvedenie1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Врожденная афантазия, которая проявляется как пожизненное отсутствие произвольных зрительных образов в воображении, затрагивает примерно 2–4% населения. Это феномен порождает удивительный парадокс: люди с афантазией способны точно извлекать зрительные свойства объектов из памяти и успешно справляются со многими задачами на зрительное воображение, но при этом сообщают об отсутствии или сильном снижении субъективного опыта визуализации. Подобная диссоциация показывает, что доступ к зрительным знаниям сохраняется даже при выпадении феноменологического переживания образов. Благодаря этому врожденная афантазия служит ценной моделью для изучения того, какие именно высшие механизмы необходимы для превращения внутренних представлений в осознанные зрительные образы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Врожденная афантазия затрагивает 2–4% людей и демонстрирует парадокс: при сохранном извлечении знаний из памяти у них полностью отсутствует субъективный опыт визуализации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Помимо отсутствия зрительного воображения, афантазия сопровождается разнообразными пожизненными когнитивными и поведенческими особенностями. Функциональные исследования показывают, что при автобиографических воспоминаниях такие люди извлекают меньше феноменологических деталей, что связано со снижением функциональной связи между гиппокампом и затылочной корой. Наблюдаются трудности в распознавании лиц и осознании эмоций, а непроизвольные навязчивые воспоминания значительно реже принимают зрительную форму. Все это указывает на то, что афантазия затрагивает распределенные сети высшего порядка, выходящие далеко за рамки первичного зрительного анализа.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Афантазия — нейропсихологический феномен, при котором человек не может мысленно «видеть» образы, хотя его способность мыслить логически и помнить факты остается полноценной.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Современные концепции связывают афантазию с общими нейроразвивающими механизмами, для которых характерно ослабление структурных и функциональных связей в мозге, что перекликается с сопутствующими чертами других состояний. Тем не менее, до сих пор остается неясным, опирается ли этот широкий когнитивно-аффективный профиль на единую анатомическую основу. При таких состояниях, как врожденная прозопагнозия, СДВГ и расстройства аутистического спектра, похожие разнообразные проявления обусловлены микроструктурными вариациями белого вещества при отсутствии приобретенных травм мозга. Структурная нейровизуализация помогает проверить, имеют ли функциональные изменения при афантазии схожую анатомическую базу, указывая на возможные структурные различия в зрительных, лобно-височных и цингулярных сетях.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдаемые когнитивные особенности при афантазии указывают на возможные изменения в различных сетях мозга, однако вопрос о едином анатомическом субстрате пока остается открытым.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нейровизуализационные исследования афантазии предлагают три конкурирующие гипотезы, объясняющие отсутствие у людей зрительных образов. Первая — гипотеза сенсорной силы — предполагает, что причина кроется в изменениях ранних зрительных зон и путей, что снижает сенсорную интенсивность внутренних представлений. В пользу этой версии говорят отсутствие эффекта прайминга во время бинокулярного соперничества и уменьшение физиологических сигналов, таких как диаметр зрачка, при попытке воображения. Кроме того, измененное кросс-декодирование в первичной зрительной коре V1 указывает на то, что ментальные образы не достигают привычного перцептивного формата.&lt;/p&gt;\n&lt;p&gt;Вторая гипотеза, связанная с сознательным доступом, делает акцент на нарушениях нисходящей регуляции из вышестоящих отделов мозга. У людей с афантазией сохраняется активность в высоких зрительных зонах, но падает функциональная связь между узлом воображения в веретеновидной извилине (FIN) и левыми префронтальными областями, включая переднюю префронтальную кору (aPFC) и лобное поле глаз (FEF). Зоны внимания, включая FEF и переднюю инсулу, важны для усиления внутренних сигналов и их отделения от внешней стимуляции, а передняя инсула регулирует переключение между дорсальной сетью внимания и сетью пассивного режима работы мозга. Данная теория подтверждается снижением перекрытия представлений восприятия и воображения в высокоуровневых зрительных зонах и глазнично-лобной коре, а также изменением фронтопариетально-темпоральных связей.&lt;/p&gt;\n&lt;h4 id=\"gipotezy-formirovaniya-afantazii-i-celi-issledovaniya\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#gipotezy-formirovaniya-afantazii-i-celi-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гипотезы формирования афантазии и цели исследования&lt;/span&gt;&lt;/a&gt;Гипотезы формирования афантазии и цели исследования&lt;/h4&gt;\n&lt;p&gt;Третья гипотеза — концепция произвольной генерации — объясняет афантазию специфическим дефицитом именно волевого запуска образов, опираясь на тот факт, что многие афантастики видят зрительные сны при бодрствовании без образов. Эта идея схожа с гипотезой сознательного доступа в части вовлечения высших структур, но расходится в деталях: дефицит волевого запуска предполагает полный отказ сенсорных представлений, тогда как теория сознательного доступа допускает их генерацию без последующего усиления до уровня осознания.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследования выделяют три главных взгляда на афантазию: дефект ранних зрительных путей, сбой нисходящего сознательного доступа из лобных зон и нарушение механизма произвольной генерации образов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Указанные подходы имеют различные анатомические предсказания: гипотеза локальных зрительных путей ожидает различий в задних трактах, таких как вертикальный затылочный пучок (VOF), нижний продольный пучок (ILF) и нижний лобно-затылочный пучок (IFOF). В то же время гипотезы высшего порядка предполагают изменения фронто-темпоральных и цингulate трактов, а также крупных сетей мозга.&lt;/p&gt;\n&lt;p&gt;Целью данной работы стало выявление общих нейроанатомических маркеров когнитивно-аффективного профиля афантазии и проверка конкурирующих гипотез о природе отсутствия осознанных образов. Для этого авторы применили мультимодальную диффузионно-взвешенную и T1-взвешенную МРТ. Были объединены четыре метода: трактография на основе функциональных зон интереса (fROI), трактометрия, сетевой анализ на базе теории графов и кортикальная морфометрия на основе поверхности коры для оценки возможных различий на уровне путей, сетей и коры (см. схему анализа на рис. S1).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Трактометрия — это метод анализа микроструктурных свойств белого вещества вдоль всей протяженности проводящих путей мозга, позволяющий точечно выявлять патологии или особенности проводки сигналов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"rezultaty1\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#rezultaty1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"traktometriya-na-osnove-atlasa-vyyavlyaet-izbiratelnye-mikrostrukturnye-razlichiya\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#traktometriya-na-osnove-atlasa-vyyavlyaet-izbiratelnye-mikrostrukturnye-razlichiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Трактометрия на основе атласа выявляет избирательные микроструктурные различия&lt;/span&gt;&lt;/a&gt;Трактометрия на основе атласа выявляет избирательные микроструктурные различия&lt;/h4&gt;\n&lt;p&gt;Мы провели количественную оценку фракционной анизотропии вдоль основных трактов белого вещества, определенных по атласу, что позволило получить профильные показатели микроструктуры белого вещества. Оценивались основные пути, задействованные в зрительной обработке (VOF, IFOF, ILF), а также тракты, обеспечивающие высшие функции: лобно-теменные пути внимания (верхний продольный пучок: SLF, дугообразный пучок: AF), медиальные лобно-височные пути (крючковидный пучок: UF, вентральная цингулюм) и пути когнитивного контроля (дорсальный цингулюм).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Фракционная анизотропия (FA) — это показатель того, насколько направленно вода диффундирует по волокнам белого вещества, что отражает целостность и миелинизацию проводящих путей.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для детализации этих результатов мы проанализировали аксиальную диффузию (AD), радиальную диффузию (RD) и показатели модели NODDI в затронутых сегментах (Рис. S2 и Таблица S1). Эти дополнительные анализы согласовывались именно с микроструктурными вариациями, а не с артефактами геометрии волокон или пересекающимися путями.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-fS2.jpg\" alt=\"Дополнительный рисунок S2. Микроструктурные профили NODDI в трактах белого вещества, демонстрирующие значительные различ\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Дополнительный рисунок S2. Микроструктурные профили NODDI в трактах белого вещества, демонстрирующие значительные различия FA. (A) Профили трактов индекса плотности невритов (NDI). (B) Профили трактов индекса дисперсии ориентации (ODI). Профили показаны для билатерального крючковидного пучка, заднего мозолисто-мозгового пучка межтеменной области и билатерального дорсального поясного пучка — трактов, выявленных в основном анализе трактометрии. Красные линии обозначают лиц с афантазией, синие — визуализаторов. Тонкие линии показывают индивидуальные профили участников, толстые — групповые средние ± SEM. Затененные серые области и черные полосы указывают на значимые межгрупповые различия (p &amp;lt; 0.05, с поправкой FWE).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;В правом пучке SLF-II и правом вентральном цингулюме наблюдалось небольшое снижение FA (Рис. S3); однако эти эффекты могли быть искажены сложной геометрией волокон, поэтому дальнейшей интерпретации они не подвергались.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-fS3.jpg\" alt=\"Дополнительный рисунок S3. Незначительное снижение фракционной анизотропии (FA) в правом SLF-II и правом вентральном цин\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Дополнительный рисунок S3. Незначительное снижение фракционной анизотропии (FA) в правом SLF-II и правом вентральном цингулуме сопровождается увеличением дисперсии ориентации. (A) Профили трактов фракционной анизотропии (FA) для правого SLF-II (p = 0.082, с поправкой FWE) и правого вентрального цингулума (p = 0.079, с поправкой FWE), с репрезентативными реконструкциями трактов, показанными ниже. Затененные серые области и черные полосы указывают сегменты, демонстрирующие незначительные различия между группами. Красные линии обозначают афантазичных индивидов, а синие линии — визуализаторов; тонкие линии показывают профили отдельных участников, а толстые линии показывают средние значения по группе ± SEM. (B) Профили индекса дисперсии ориентации (ODI) для тех же трактов. В обоих трактах незначительное снижение FA перекрывалось с увеличением ODI у афантазичных индивидов, что предполагает, что на эти эффекты может влиять локальная геометрия волокон, а не надежные микроструктурные различия. Следовательно, эти результаты не интерпретировались далее.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"grafovo-teoreticheskij-setevoj-analiz-vyyavlyaet-narushenie-segregacii-i-mezhsetevoj-centralnosti\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#grafovo-teoreticheskij-setevoj-analiz-vyyavlyaet-narushenie-segregacii-i-mezhsetevoj-centralnosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Графово-теоретический сетевой анализ выявляет нарушение сегрегации и межсетевой центральности&lt;/span&gt;&lt;/a&gt;Графово-теоретический сетевой анализ выявляет нарушение сегрегации и межсетевой центральности&lt;/h4&gt;\n&lt;p&gt;Затем мы применили графово-теоретический анализ, чтобы проверить, распространяются ли различия на уровне трактов на структурную организацию крупномасштабных сетей мозга. Мы построили матрицу структурной связности всего мозга размером 400 × 400 на основе парцелляции Schaefer из 17 сетей (пайплайн анализа представлен на Рис. 2A). На основе этого взвешенного неориентированного графа мы вычислили метрики узлов для характеристики организации сети. Исходя из гипотезы исследования, фокус внимания был направлен на узлы зрительной сети, сети внимания, сети салиентности и сети пассивного режима работы мозга.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-f2.jpg\" alt=\"Рисунок 2. Анализ структурных сетей выявляет сниженную локальную сегрегацию и повышенную межсетевую центральность при вр\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Рисунок 2. Анализ структурных сетей выявляет сниженную локальную сегрегацию и повышенную межсетевую центральность при врожденной афантазии. (A) Пайплайн анализа. Линии токсографии всего мозга взвешивались с использованием фильтрации трактограмм на основе сферической деконволюции (SIFT2) и нормализовались по объему ROI для генерации матрицы структурной связности 400 × 400 на основе парцелляции Schaefer по 17 сетям. Метрики теории графов на уровне узлов вычислялись на основе взвешенного неориентированного графа. (B) Сила узла была снижена в левом лобном поле зрения (FEF; дорсальная сеть внимания B, DAN B) у лиц с афантазией по сравнению с визуализаторами, что указывает на более слабую общую структурную связность в этом узле. (C) Коэффициент кластеризации был снижен в левой передней инсуле (сальнгентная/вентральная сеть внимания A, Sal/VAN A) и левой дорсолатеральной префронтальной коре (dlPFC; Default B), что указывает на снижение локальной сегрегации сети в регионах сальнгентности и ассоциативных сетей. (D) Коэффициент участия был повышен в правой дорсомедиальной префронтальной коре (dmPFC; Default A) при афантазии, что указывает на большую межсетевую центральность в этом узле. Синий цвет указывает на Vis. &amp;gt; Aph.; темно-красный — на Aph. &amp;gt; Vis. На коробчатых диаграммах показаны медиана и межквартильный размах; *p &amp;lt; 0.05, **p &amp;lt; 0.01, **&lt;em&gt;p &amp;lt; 0.001, с поправкой FWE.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Межгрупповые различия были зафиксированы для трех метрик высших сетей (Рис. 2B–D; Таблица S2). У лиц с афантазией в левом полевом фронтальном поле (FEF), выступающем ключевым узлом дорсальной сети внимания (DAN B на Рис. 2A), зафиксировано снижение силы узла, что указывает на более слабую общую структурную связность в этой зоне. Левая передняя инсула (часть сети салиентности и вентрального внимания, VAN A) и левая дорсолатеральная префронтальная кора (dlPFC) из сети пассивного режима (Default B) продемонстрировали уменьшенный коэффициент кластеризации, что свидетельствует об ослаблении локальной сегрегации сетей в регионах салиентности и когнитивного контроля.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Сетевой анализ выявил снижение силы узла в левом FEF, уменьшение коэффициента кластеризации в левой инсуле и dlPFC, а также рост коэффициента участия в правом dmPFC при афантазии.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Напротив, правая дорсомедиальная префронтальная кора (dmPFC) из сети пассивного режима (Default A) показала повышенный коэффициент участия, что говорит об усилении межсетевой интеграции (центральности) у участников с афантазией. Кроме того, в правой соматомоторной сети наблюдалось уменьшение коэффициента участия. Контрольные анализы с использованием альтернативных вариантов парцелляции подтвердили устойчивость этих результатов (Рис. S5A–B).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-fS5.jpg\" alt=\"Дополнительный рисунок S5. Контрольные анализы подтверждают надежность сетевых результатов для различных схем парцелляци\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Дополнительный рисунок S5. Контрольные анализы подтверждают надежность сетевых результатов для различных схем парцелляции. (A) Атлас Gordon на 333 региона. Сходные межгрупповые различия наблюдались по графо-теоретическим метрикам: афантазичные индивиды показали сниженный коэффициент кластеризации в левой передней инсуле (Vis. &amp;gt; Aph., синий цвет) и повышенный коэффициент участия в правой дорсомедиальной префронтальной коре (dmPFC; Aph. &amp;gt; Vis., темно-красный цвет). (B) Атлас Schaefer-Yeo на 100 регионов. Афантазичные индивиды показали повышенный коэффициент участия в билатеральной dmPFC (Aph. &amp;gt; Vis.) и сниженный коэффициент участия в правой латеральной префронтальной коре (Vis. &amp;gt; Aph.). (C) Тракты белого вещества, соединенные с левым узлом передней инсулы в атласе Schaefer-Yeo на 400 регионов. Нижний лобно-затылочный пучок (IFOF) и дугообразный пучок (AF) сходятся в левой передней инсуле — узле, демонстрирующем сниженный коэффициент кластеризации в основном анализе. Левая передняя префронтальная кора (aPFC) и веретенообразный узел образов (FIN) связаны отдельными путями белого вещества, в основном IFOF и AF соответственно. Темно-красный цвет указывает на Aph. &amp;gt; Vis., а синий — на Vis. &amp;gt; Aph. Все межгрупповые различия, показанные на панелях A и B, были значимыми при p &amp;lt; 0.05 с поправкой FDR. Левое лобное глазодвигательное поле (FEF) не определялось стабильно во всех атласах, что согласуется с неопределенностью границ его парцелляции.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Коэффициент участия (participation coefficient) отражает то, насколько равномерно связи узла распределены между различными сетями мозга, характеризуя межсетевое взаимодействие.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чувствительный анализ коэффициентов кластеризации не выявил значимых групповых различий (левая инсула: статистика B-M = -0.06; левая dlPFC: статистика B-M = 1.30; все pFDR &amp;gt; 0.86), показав, что различия кластеризации в инсуле и dlPFC не специфичны для топологии сети. Они могут отражать особенности взвешенного коннектома, такие как плотность соединений, сила или распределение весов, а не перестройку локальной кластеризации.&lt;/p&gt;\n&lt;p&gt;Трассировка прямых структурных связей показала, что левая передняя инсула соединяется главным образом через пучки AF и IFOF (Рис. S5C), в то время как связность dmPFC задействует пути дорсального цингулюма. Напротив, в исследованных узлах зрительной коры значимых отличий обнаружено не было, что согласуется с отсутствием трактометрических различий в основных зрительных путях.&lt;/p&gt;\n&lt;h4 id=\"otsutstvie-izmenenij-v-belom-veshestve-bazovoj-seti-vizualizacii\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#otsutstvie-izmenenij-v-belom-veshestve-bazovoj-seti-vizualizacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Отсутствие изменений в белом веществе базовой сети визуализации&lt;/span&gt;&lt;/a&gt;Отсутствие изменений в белом веществе базовой сети визуализации&lt;/h4&gt;\n&lt;p&gt;Далее мы охарактеризовали соединения белого вещества базовой сети визуализации, функциональные свойства которой изменены при афантазии. Мы определили функциональные зоны интереса (fROI) на базе результатов 7T фМРТ (Liu, Zhan, et al., 2025): FIN, левая aPFC, левая OFC и правый передний интрапариетальный зазор (aIPS). Для каждого из четырех ROI (Рис. S4A) в каждой группе мы выделили линии тока, пересекающие их проекцию на границу серого и белого вещества, и оценили структуру трактов с помощью двух индексов: нормализованного по объему количества линий тока (Рис. S4B) и доли линий тока (Рис. S4C) в анатомически определенных пучках.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-fS4.jpg\" alt=\"Дополнительный рисунок S4. Связи белого вещества основного узлового сетевого комплекса зрительных образов. (A) Срезы бел\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Дополнительный рисунок S4. Связи белого вещества основного узлового сетевого комплекса зрительных образов. (A) Срезы белого вещества, ассоциированные с каждым функциональным ROI основного сетевого комплекса зрительных образов, показанные на сагиттальных срезах МРТ: левый веретенообразный узел образов (FIN), левая орбитофронтальная кора (OFC), левая передняя префронтальная кора (aPFC) и правая передняя внутритеменная бородавка/борозда (aIPS). (B) Количество линий тока (стримлайнов), нормированное по объему ROI для каждого функционального ROI. FIN соединялся в основном длинным сегментом дугообразного пучка (AF), задним дугообразным пучком (pAF) и вертикальным затылочным пучком (VOF). Левая OFC соединялась как нижним лобно-затылочным пучком (IFOF), так и крючковидным пучком (UF), в то время как левая aPFC соединялась в основном IFOF. В данном анализе не было выявлено прямой структурной связи между FIN и левой aPFC. Правая aIPS соединялась преимущественно третьей ветвью верхнего продольного пучка (SLF-III). Номинальное увеличение нормализованного количества стримлайнов наблюдалось у афантазичных индивидов для левого AF, связанного с FIN (без поправки p = 0.039, U = 229, d Клиффа = -0.41), однако этот эффект не сохранился после поправки на множественные сравнения. Анализ коэффициента Байеса предоставил умеренные доказательства отсутствия межгрупповых различий в количестве стримлайнов VOF, связанных с FIN (BF = 0.32). (C) Пропорция стримлайнов, отнесенных к каждому интересующему тракту для каждого ROI. Светлые полосы обозначают визуализаторов, а темные полосы — афантазичных индивидов. Пластинки погрешностей показывают SEM, а точки обозначают отдельных участников. IFOF — нижний лобно-затылочный пучок; ILF — нижний продольный пучок; AF — длинный сегмент дугообразного пучка; pAF — задний дугообразный пучок; VOF — вертикальный затылочный пучок; UF — крючковидный пучок; SLF-I/II/III — ветви I, II и III верхнего продольного пучка.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Выводы основаны на сравнении групп с использованием нормализованного количества линий тока и байесовского анализа, однако отсутствие изменений в ряде путей требует проверки на более крупных выборках.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;После поправки на множественные сравнения значимых межгрупповых различий ни по одному индексу выявлено не было. Анализ с помощью коэффициента Байеса (BF) предоставил умеренные доказательства в пользу отсутствия групповых различий для нормализованного по объему количества линий тока в пучке VOF, соединяющем FIN (BF = 0.32), что подтверждает эквивалентность путей. В совокупности эти данные указывают на отсутствие надежных изменений в прямых структурных связях внутри базовой сети визуализации.&lt;/p&gt;\n&lt;h4 id=\"korkovaya-tolshina-umenshenie-v-levoj-apfc-i-uvelichenie-v-limbicheskih-oblastyah\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#korkovaya-tolshina-umenshenie-v-levoj-apfc-i-uvelichenie-v-limbicheskih-oblastyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Корковая толщина: уменьшение в левой aPFC и увеличение в лимбических областях&lt;/span&gt;&lt;/a&gt;Корковая толщина: уменьшение в левой aPFC и увеличение в лимбических областях&lt;/h4&gt;\n&lt;p&gt;Наконец, мы исследовали толщину коры во всем головном мозге. Предыдущие работы связывали толщину префронтальной и ранней зрительной коры с индивидуальными различиями в яркости образного мышления, включая связь меньшего объема зоны V1 с более сильным воображением (Bergmann et al., 2016b). Поэтому мы проверили, связана ли афантазия с утолщением или увеличением площади V1.&lt;/p&gt;\n&lt;h4 id=\"morfometriya-kory-i-mikrostruktura-belogo-veshestva\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#morfometriya-kory-i-mikrostruktura-belogo-veshestva\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Морфометрия коры и микроструктура белого вещества&lt;/span&gt;&lt;/a&gt;Морфометрия коры и микроструктура белого вещества&lt;/h4&gt;\n&lt;p&gt;Анализ ранних зрительных зон не выявил значимых различий между группами по толщине и объему коры. Байесовские факторы (BF) подтвердили умеренные доказательства равенства групп как для шпорной борозды (Таблица S3), так и для первичной зрительной коры V1 (Таблица S4). Напротив, полномозговой анализ показал наличие единственного значимого префронтального кластера со сниженной толщиной коры в левой передней префронтальной коре (aPFC) у участников с афантазией (Рис. 3A). Статистические параметры этого кластера приведены в Таблице S5.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-f3.jpg\" alt=\"Рисунок 3. Региональные различия толщины коры между лицами с афантазией и визуализаторами. (A) Полномозговая карта межгр\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Рисунок 3. Региональные различия толщины коры между лицами с афантазией и визуализаторами. (A) Полномозговая карта межгруппового сравнения. Синий цвет указывает на области со сниженной толщиной коры, а красный — на области с повышенной толщиной коры при афантазии с поправкой FDR для всей коры. Коробчатые диаграммы показывают индивидуальные значения участников (точки), медиану и межквартильный размах. *p &amp;lt; 0.05, **p &amp;lt; 0.01, **&lt;em&gt;p &amp;lt; 0.001. Vis., визуализаторы; Aph., афантазия. aPFC: передняя префронтальная кора; PoCG: постцентральная извилина; PHG: парагиппокампальная извилина; EC: энторинальная кора; ITG: нижняя височная извилина; RSC: ретроспленальная кора; PCC: задняя поясная кора. (B) Функциональные ассоциации терминов, полученные из метааналитического декодирования t-карты с использованием Neurosynth. Синие термины связаны с областями со сниженной толщиной коры при афантазии, а красные — с областями с повышенной толщиной коры. Размер термина отражает силу корреляции Пирсона с соответствующей метааналитической картой активации.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица S5.&lt;/strong&gt; Различия толщины коры между лицами с афантазией и визуализаторами&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Область&lt;/th&gt;\n&lt;th&gt;Размер кластера&lt;/th&gt;\n&lt;th&gt;Пиковое значение t&lt;/th&gt;\n&lt;th&gt;Пиковое значение p (FDR)&lt;/th&gt;\n&lt;th&gt;Координаты MNI (x, y, z)&lt;/th&gt;\n&lt;th&gt;g Хеджеса [Bootstrap 95% ДИ]&lt;/th&gt;\n&lt;th&gt;BF10&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Vis. &amp;gt; Aph.&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Left aPFC&lt;/td&gt;\n&lt;td&gt;52&lt;/td&gt;\n&lt;td&gt;4.68&lt;/td&gt;\n&lt;td&gt;0.000&lt;/td&gt;\n&lt;td&gt;-36, 54, 4&lt;/td&gt;\n&lt;td&gt;1.53 [0.87, 2.53]&lt;/td&gt;\n&lt;td&gt;433.22&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Left PoCG&lt;/td&gt;\n&lt;td&gt;49&lt;/td&gt;\n&lt;td&gt;3.73&lt;/td&gt;\n&lt;td&gt;0.005&lt;/td&gt;\n&lt;td&gt;-64, -14, 22&lt;/td&gt;\n&lt;td&gt;1.21 [0.55, 2.22]&lt;/td&gt;\n&lt;td&gt;41.42&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Aph. &amp;gt; Vis.&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Left PHG/EC&lt;/td&gt;\n&lt;td&gt;6.83&lt;/td&gt;\n&lt;td&gt;0.000&lt;/td&gt;\n&lt;td&gt;-25, -19, -23&lt;/td&gt;\n&lt;td&gt;-2.23 [-3.27, -1.60]&lt;/td&gt;\n&lt;td&gt;132680.97&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Left ACC&lt;/td&gt;\n&lt;td&gt;3.61&lt;/td&gt;\n&lt;td&gt;0.005&lt;/td&gt;\n&lt;td&gt;-4, 18, 23&lt;/td&gt;\n&lt;td&gt;-1.18 [-2.03, -0.57]&lt;/td&gt;\n&lt;td&gt;31.67&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Right RSC&lt;/td&gt;\n&lt;td&gt;3.52&lt;/td&gt;\n&lt;td&gt;0.007&lt;/td&gt;\n&lt;td&gt;17, -53, 6&lt;/td&gt;\n&lt;td&gt;-1.15 [-1.88, -0.57]&lt;/td&gt;\n&lt;td&gt;26.20&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Right EC/IFG&lt;/td&gt;\n&lt;td&gt;4.49&lt;/td&gt;\n&lt;td&gt;0.000&lt;/td&gt;\n&lt;td&gt;32, -6, -38&lt;/td&gt;\n&lt;td&gt;-1.46 [-2.30, -0.86]&lt;/td&gt;\n&lt;td&gt;266.52&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Right PCC&lt;/td&gt;\n&lt;td&gt;110&lt;/td&gt;\n&lt;td&gt;4.41&lt;/td&gt;\n&lt;td&gt;0.001&lt;/td&gt;\n&lt;td&gt;5, -18, 29&lt;/td&gt;\n&lt;td&gt;-1.44 [-2.17, -0.90]&lt;/td&gt;\n&lt;td&gt;214.95&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Significant group differences in cortical thickness are reported for clusters comprising more than 30 vertices. Group comparisons were performed using a linear model with FDR correction. aPFC: anterior prefrontal cortex; PoCG: Post central gyrus; PHG: parahippocampal gyrus; EC: Entorhinal cortex; ACC: Anterior cingulate cortex; RSC: retrosplenial cortex; PCC: Posterior cingulate cortex.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;У людей с афантазией обнаружено уменьшение толщины левой aPFC и увеличение толщины в медиальных височных и лимбических зонах, а также локальные изменения микроструктуры белого вещества по данным NODDI.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В то же время, при афантазии наблюдалась повышенная толщина коры в ряде медиальных височно-лимбических областей. К ним относятся левая передняя парагиппокампальная извирина, энторинальная кора слева, а также правая энторинальная кора, ретроспленальная кора и задняя поясная кора. Дополнительный анализ методом NODDI выявил более высокие значения индекса плотности нейритов (NDI) в двусторонних медиальных височных областях и левом предклинье при афантазии (Рис. S6), что согласуется с микроструктурными перестройками в этих медиальных височных зонах.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-fS6.jpg\" alt=\"Дополнительный рисунок S6. Кортикальные микроструктурные различия NODDI между афантазичными индивидами и визуализаторами\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Дополнительный рисунок S6. Кортикальные микроструктурные различия NODDI между афантазичными индивидами и визуализаторами. Метрики NODDI коры сравнивались между группами с использованием теории случайных полей, реализованной в BrainStat, с поправкой FWE на уровне кластеров (p &amp;lt; 0.05). Афантазичные индивиды показали повышенный индекс плотности невритных отростков (NDI) в билатеральных медиотемпоральных областях, включая парагиппокампальную извилину и энторинальную кору, а также в левом предклинье, и сниженный NDI в левой дорсомедиальной префронтальной коре. Индекс дисперсии ориентации (ODI), изотропная объемная фракция (ISOVF) и средняя диффузивность (MD) также показали значимые межгрупповые различия. Регионы с пониженной MD пространственно перекрывались с областями повышенного NDI в медиотемпоральной коре, что согласуется с более плотной упаковкой невритров и более низкой общей диффузивностью в этих регионах.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"funkcionalnyj-kontekst-i-metaanaliticheskoe-dekodirovanie\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#funkcionalnyj-kontekst-i-metaanaliticheskoe-dekodirovanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Функциональный контекст и метааналитическое декодирование&lt;/span&gt;&lt;/a&gt;Функциональный контекст и метааналитическое декодирование&lt;/h4&gt;\n&lt;p&gt;Для интерпретации обнаруженных морфологических отличий авторы провели метааналитический декомпозиционный анализ t-карт с помощью платформы Neurosynth (Рис. 3B). Левосторонний кластер aPFC продемонстрировал тесную связь с такими когнитивными терминами, как «намерения» (r = 0.26), «действия» (r = 0.25) и «близкое пространство» (r = 0.25). В свою очередь, области с утолщенной корой при афантазии коррелировали с анатомическими понятиями, включая гиппокамп, парагиппокамп и амигдалу (для всех коэффициентов r &amp;gt; 0.14), что обеспечивает надежную функциональную аннотацию выявленных зон.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метааналитический декодинг по карте Neurosynth сопоставляет полученные координаты мозга с тысячами ранее опубликованных нейровизуализационных исследований для выявления вероятных психологических функций.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"mnogomernyj-logisticheskij-regressionnyj-analiz\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#mnogomernyj-logisticheskij-regressionnyj-analiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Многомерный логистический регрессионный анализ&lt;/span&gt;&lt;/a&gt;Многомерный логистический регрессионный анализ&lt;/h4&gt;\n&lt;p&gt;В рамках поискового исследования применялась многомерная логистическая регрессия с регуляризацией для определения минимального набора структурных признаков, надежно разделяющих группы. Отдельные модели строились для фракционной анизотропии (FA), толщины коры и показателей теории графов, используя только те параметры, которые ранее показали межлинейные различия в одномерном анализе. Исследовательские модели продемонстрировали высокую внутреннюю дискриминационную способность: площади под ROC-кривой (AUC) превышали 0.92 для всех моделей.&lt;/p&gt;\n&lt;p&gt;Наиболее сильными независимыми предикторами афантазии в совокупности моделей оказались: сниженная FA в правом крючковидном пучке (uncinate fasciculus) и задней части мозолистого тела (interparietal corpus callosum), повышенная FA в левом дорсальном пучке поясной извирки (cingulum), сниженный коэффициент кластеризации в левой передней инсуле, уменьшенная сила узла в левом поле глаз лобной доли (FEF), уменьшенная толщина левой aPFC, а также увеличенная толщина передней парагиппокампальной и ретроспленальной коры. Полная статистика моделей представлена в дополнительном материале.&lt;/p&gt;\n&lt;h4 id=\"analiz-geterogennosti-vyborki\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#analiz-geterogennosti-vyborki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ гетерогенности выборки&lt;/span&gt;&lt;/a&gt;Анализ гетерогенности выборки&lt;/h4&gt;\n&lt;p&gt;Учитывая потенциальную вариабельность феномена афантазии, исследователи проверили однородность дисперсии каждой переменной между группами с помощью теста Левене, несмотря на то что все участники с афантазией заявляли об пожизненном отсутствии произвольных зрительных образов. Статистически значимых различий в дисперсии между группами не обнаружено (Таблица S6), хотя при размере выборки 18 человек на группу статистическая мощность теста ограничена. Поскольку большинство испытуемых (13/18) сообщили о наличии ядерной формы афантазии, описываемый нейроанатомический профиль наиболее точно отражает именно эту подгруппу.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Относительно небольшая выборка (по 18 участников в каждой группе) ограничивает статистическую мощность при оценке индивидуальной гетерогенности фенотипа.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"obsuzhdenie1\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#obsuzhdenie1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;h4 id=\"anatomicheskie-osnovy-vrozhdennoj-afantazii\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#anatomicheskie-osnovy-vrozhdennoj-afantazii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анатомические основы врожденной афантазии&lt;/span&gt;&lt;/a&gt;Анатомические основы врожденной афантазии&lt;/h4&gt;\n&lt;p&gt;В настоящей работе представлены структурные данные, которые выступают в качестве первых прямых анатомических свидетельств в пользу гипотезы о том, что врожденная афантазия связана со снижением функционального сопряжения между префронтальными системами высшего порядка и высокоуровневой зрительной корой, а не с изолированным дефицитом сенсорного представления. Комплексный анализ, включивший трактометрию, сетевой анализ и корковую морфометрию, выявил у лиц с афантазией избирательные структурные отличия, сосредоточенные во фронто-темпоральных и цингулярных системах. При этом надежных межгрупповых различий в первичной зрительной коре или в основных исследованных зрительных трактах обнаружено не было. Полученные результаты свидетельствуют о том, что врожденная афантазия затрагивает нейроанатомические изменения в распределенных, но взаимосвязанных сетках мозга высшего уровня, а не в отдельной фокальной зоне, что может объяснять ее широкий когнитивно-аффективный профиль.&lt;/p&gt;\n&lt;p&gt;Данный структурный фенотип характеризуется четырьмя ключевыми наблюдениями. Во-первых, у участников с афантазией зафиксировано снижение фракционной анизотропии (FA) в крючковидном пучке (UF) и задней части интерпариетального мозолистого тела, что указывает на изменения во фронто-темпоральных и межполушарных ассоциативных путях. Этот паттерн согласуется с ранее выявленным снижением функциональной связи между орбитофронтальной корой (OFC) и передними височными областями, которые соединяются UF, и может отражать нарушение интеграции височного мнестического контента с аффективной и перцептивной обработкой в OFC. Подобные особенности также могут быть связаны с поведенческими проявлениями афантазии, такими как измененная автобиографическая память, затрудненное распознавание лиц и сниженная эмоциональная осознанность, хотя прямые связи между структурой и функцией еще предстоит проверить в будущих исследованиях с использованием объективных метрик эпизодической памяти.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Врожденная афантазия характеризуется избирательными структурными изменениями во фронто-темпоральных и цингулярных системах, включая снижение FA в крючковидном пучке и мозолистом теле, при отсутствии изменений в первичной зрительной коре.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Во-вторых, повышение FA и плотности невриттов в дорсальной части поясной извилины (cingulum) указывает на перестройку путей когнитивного контроля. Подобное изменение может отражать влияние измененной нисходящей (top-down) регуляции на осознанный доступ к внутренним образам, что аналогично моделям при психических расстройствах, либо свидетельствовать о компенсаторном переходе на семантически управляемые незрительные процессы контроля. В-третьих, на уровне сетей афантазия сопровождалась снижением локальной сегрегации в левой передней инсуле, измененными метриками связности в лобных ассоциативных зонах и повышенной межсетевой центральностью узлов (hubness) в правой дорсомедиальной префронтальной коре (dmPFC). Указанные изменения затрагивают системы внимания, салиентности и сети пассивного режима работы мозга (default-mode), влияя на процессы внутренней переориентации внимания, связывания признаков и фильтрации сознательного доступа.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Фракционная анизотропия (FA) — это показатель диффузии воды в тканях мозга, который отражает степень целостности и миелинизации белого вещества.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В-четвертых, обнаружено избирательное уменьшение толщины коры в левой переднелатеральной префронтальной коре (aPFC) — области, которая ранее демонстрировала функциональную разобщенность при афантазии, что подчеркивает ее роль в высшем контроле и сознательном доступе к внутренним представлениям. Напротив, толщина коры оказалась увеличенной в медиальных височных лимбических областях, включая энторинальную кору и ретросплениальную кору, которые критически важны для пространственной ориентации, эпизодической памяти и построения воображаемых сцен. В совокупности данные трактографии и сетевого анализа локализуют обнаруженные структурные отличия преимущественно во фронто-темпоральных и цингулярных системах, связывая их с широким спектром когнитивных особенностей афантазии.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Настоящие данные носят корреляционный характер и получены для врожденной афантазии; для доказательства причинно-следственных связей необходимы продольные и экспериментальные исследования.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"trehetapnaya-model-soznatelnogo-voobrazheniya-i-afantaziya\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#trehetapnaya-model-soznatelnogo-voobrazheniya-i-afantaziya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Трехэтапная модель сознательного воображения и афантазия&lt;/span&gt;&lt;/a&gt;Трехэтапная модель сознательного воображения и афантазия&lt;/h4&gt;\n&lt;p&gt;Полученные результаты структурной диссоциации согласуются с многостадийной моделью сознательного воображения (Liu, 2026). Согласно этой концепции, воображение опирается на три процесса: генерацию внутренних визуальных репрезентаций, их интеграцию в целостные объекты или сцены и усиление этого контента для осознанного доступа. Функциональная нейровизуализация подтверждает, что первый этап — генерация — у лиц с афантазией сохранен: зрительная кора активируется при попытках воображения, что, вероятно, связано с извлечением семантической и эпизодической информации. Наш анализ ROI подтверждает отсутствие различий в структурной связности внутри основной сети воображения между группами. Поведенческие данные также показывают, что люди с афантазией совершают целенаправленные движения глаз при мысленном исследовании карт, аналогично визуализаторам, несмотря на отсутствие ярких образов (Takamura et al., 2026).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Генерация визуальных образов при афантазии сохранена, однако последующая интеграция и осознанный доступ нарушены, что опровергает гипотезу о неспособности афантазиков к произвольному созданию сенсорных репрезентаций.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"integraciya,-usilenie-i-rol-prefrontalnoj-kory\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#integraciya,-usilenie-i-rol-prefrontalnoj-kory\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интеграция, усиление и роль префронтальной коры&lt;/span&gt;&lt;/a&gt;Интеграция, усиление и роль префронтальной коры&lt;/h4&gt;\n&lt;p&gt;В рамках данной модели снижение яркости образов при афантазии объясняется нарушением интеграции, а ограничение сознательного доступа — дефицитом аттенционального усиления. Передняя префронтальная кора (aPFC) является ключевым кандидатом на роль регулятора этого процесса. Мы выявили уменьшение толщины коры в этой области, что согласуется с данными о снижении функциональной связи между левой aPFC и высшими отделами зрительной коры (Liu &amp;amp; Bartolomeo, 2025). Роль aPFC заключается не в самой генерации образов, а в волевом контроле и селекции контента. Аналогия с осознанными сновидениями, где активность aPFC коррелирует с контролем над яркостью и ясностью сна, подтверждает, что при афантазии страдает именно механизм контроля, а не способность к непроизвольной генерации образов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;aPFC (передняя префронтальная кора) — область мозга, отвечающая за высшие когнитивные функции, такие как планирование, саморефлексия и управление вниманием.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"nejroanatomicheskie-svyazi-mezhdu-voobrazheniem-i-pamyatyu\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#nejroanatomicheskie-svyazi-mezhdu-voobrazheniem-i-pamyatyu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нейроанатомические связи между воображением и памятью&lt;/span&gt;&lt;/a&gt;Нейроанатомические связи между воображением и памятью&lt;/h4&gt;\n&lt;p&gt;Трехэтапная модель позволяет объяснить связь афантазии с нарушениями эпизодической памяти. Наши данные о структурных изменениях в крючковидном пучке (uncinate fasciculus), а также в энторинальной и ретроспленальной коре, указывают на вовлечение мнемонических систем в патофизиологию афантазии. Это позволяет предположить, что общие нейроанатомические изменения в лобно-височных сетях контроля и системах памяти лежат в основе обоих фенотипов. Тем не менее, поскольку наши данные носят структурный характер, они не позволяют однозначно определить, какой именно этап обработки информации является первичным звеном нарушения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Данное исследование основано на структурных данных (МРТ), которые демонстрируют корреляции, но не доказывают причинно-следственную связь между конкретными анатомическими изменениями и нарушением этапов воображения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rol-pervichnoj-zritelnoj-kory-i-strukturnye-izmeneniya\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#rol-pervichnoj-zritelnoj-kory-i-strukturnye-izmeneniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Роль первичной зрительной коры и структурные изменения&lt;/span&gt;&lt;/a&gt;Роль первичной зрительной коры и структурные изменения&lt;/h4&gt;\n&lt;p&gt;Отсутствие значимых различий в структуре области V1 согласуется с данными о том, что первичная зрительная кора не является критически необходимой для формирования ментальных образов. Исследования пациентов с корковой слепотой показывают двойную диссоциацию: зрительное воображение может быть нарушено при сохранности V1, тогда как повреждение V1 не всегда ведет к утрате способности к визуализации. Согласно современным теоретическим моделям, активность V1 регулируется тормозными сигналами, которые подавляют спонтанную активность, не связанную с воображаемым контентом. В рамках этой гипотезы, изменения активности V1 при афантазии могут быть следствием нарушения модуляции со стороны вышестоящих сетей, а не первичным структурным дефектом. Наши данные, подтвержденные байесовскими факторами, указывают на эквивалентность большинства ранних зрительных зон, хотя вопрос о роли поверхностных U-образных волокон требует дальнейшего изучения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Отсутствие структурных различий в V1 подтверждает гипотезу о том, что афантазия связана с дисфункцией высших когнитивных сетей, а не с дефектами первичной сенсорной обработки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"patterny-nejroanatomicheskih-izmenenij\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#patterny-nejroanatomicheskih-izmenenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Паттерны нейроанатомических изменений&lt;/span&gt;&lt;/a&gt;Паттерны нейроанатомических изменений&lt;/h4&gt;\n&lt;p&gt;Выявленные изменения не образуют единого паттерна дефицита. Увеличение объема определенных структур при афантазии локализовано преимущественно в медиальных отделах коры и поясной извилине (дорсальный цингулюм, поясная кора, медиальная префронтальная кора). Это может указывать на перестройку систем когнитивного контроля и памяти. Подобные изменения могут носить компенсаторный характер, что подтверждается данными о том, что люди с афантазией используют альтернативные стратегии при выполнении задач на воображение и демонстрируют повышенную функциональную связность между передней поясной корой и гиппокампом.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Байесовский фактор — статистический показатель, позволяющий оценить вероятность того, что данные подтверждают гипотезу об отсутствии различий (эквивалентность), а не просто отсутствие доказательств обратного.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"interpretaciya-i-ogranicheniya\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#interpretaciya-i-ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интерпретация и ограничения&lt;/span&gt;&lt;/a&gt;Интерпретация и ограничения&lt;/h4&gt;\n&lt;p&gt;Когнитивная интерпретация результатов остается косвенной, так как функции сетей контроля и мониторинга не оценивались независимо у тех же участников. Важным ограничением является фенотипическая гетерогенность афантазии, требующая в будущем работы с более крупными выборками. Также стоит учитывать, что диффузионная МРТ предоставляет модельные оценки, а не прямые биологические показатели. Тем не менее, использование независимых данных Т1-взвешенной МРТ для оценки толщины коры повышает надежность выводов. В целом, исследование указывает на то, что структурная основа сознательного воображения сосредоточена в интегративных системах высшего порядка, а не в сенсорных репрезентациях.&lt;/p&gt;\n&lt;h3 id=\"metody1\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#metody1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"uchastniki\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#uchastniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Участники&lt;/span&gt;&lt;/a&gt;Участники&lt;/h4&gt;\n&lt;p&gt;В исследовании приняли участие 18 человек с врожденной афантазией, сообщивших о ней самостоятельно (средний возраст с отклонением составлял 31.79 ± 12.11 лет; 11 женщин), а также 18 типичных визуализаторов (32.29 ± 9.53 лет; 15 женщин). Из них 10 участников с афантазией и 5 визуализаторов ранее участвовали в другом исследовании фМРТ на 7 Тесла, посвященном мысленным образам. Размер выборки в 18 человек на группу обусловлен трудностями набора участников с врожденной афантазией, которая встречается примерно у 2–4% людей, что сопоставимо с ключевыми структурными МРТ-работами для аналогичных врожденных состояний. Все испытуемые заполнили опросник яркости зрительных образов (VVIQ), состоящий из 1 пунктa с оценкой от 1 («нет образа вообще») до 5 («совершенно четкий и яркий, как нормальное зрение»), с общей суммой баллов от 16 до 80.&lt;/p&gt;\n&lt;p&gt;У всех участников с афантазией баллы VVIQ были ниже 22 (в среднем 17.06 ± 2.10, а у 13 из 18 отмечалась ядерная афантазия), а пожизненное отсутствие произвольных зрительных образов подтверждалось в ходе структурированного интервью, проведенного Дж.Л., так как объективных маркеров диагностики в настоящее время нет. У всех визуализаторов баллы VVIQ превышали 50 (63.67 ± 9.54). Все добровольцы были правшами, имели нормальное или скорректированное до нормы зрение и слух, а также не сообщали о неврологических или психических заболеваниях в анамнезе. Группы были сбалансированы по возрасту, полу и количеству лет образования. Исследование было одобрено институциональным ревизионным комитетом INSERM по протоколу C13-41, а каждый участник подписал информированное согласие согласно Хельсинкской декларации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VVIQ (опросник яркости зрительных образов) — это стандартизированная шкала субъективной оценки, где низкие баллы отражают неспособность формировать ментальные картинки (афантазию), а высокие — нормальную или яркую визуализацию.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"poluchenie-izobrazhenij\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#poluchenie-izobrazhenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Получение изображений&lt;/span&gt;&lt;/a&gt;Получение изображений&lt;/h4&gt;\n&lt;p&gt;Все МРТ-данные были получены в Центре нейровизуализационных исследований (CENIR) Парижского института мозга на сканере Siemens 3T MAGNETOM Prisma с 64-канальной головной катушкой. Данные диффузионно-взвешенной томографии (DWI) собирались в четырех последовательностях (всего 398 объемов) с двумя направлениями кодирования фазы (передне-заднее, AP; задне-переднее, PA), каждое из которых включало 98–99 равномерно распределенных направлений диффузии при двух значениях b (b = 1500 и 3000 с/мм²). Дополнительно было записано 28 объемов без диффузионного взвешивания (b = 0). Высокоразрешенные анатомические T1-взвешенные изображения записывались в рамках той же сессии при параметрах TR = 2400 мс, TE = 2.22 мс и угле наклона 9°.&lt;/p&gt;\n&lt;h4 id=\"obrabotka-dannyh-dvi-i-t1-vzveshennyh-dannyh-segmentaciya-serogo/belogo-veshestva\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#obrabotka-dannyh-dvi-i-t1-vzveshennyh-dannyh-segmentaciya-serogo/belogo-veshestva\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обработка данных ДВИ и T1-взвешенных данных Сегментация серого/белого вещества&lt;/span&gt;&lt;/a&gt;Обработка данных ДВИ и T1-взвешенных данных Сегментация серого/белого вещества&lt;/h4&gt;\n&lt;p&gt;Анатомические T1-изображения прошли предварительную обработку с использованием конвейера DeepPrep 25.1.0, объединяющего нейросетевые и стандартные инструменты нейровизуализации для надежного сегментирования тканей. Обработка включала коррекцию движений с помощью FreeSurfer версии 7.2.0 (RRID: SCR_001847), коррекцию поля смещения через SimpleITK (v2.3.0), удаление черепа и выделение тканей с помощью FastSurferCNN из состава FastSurfer (v1.1.0), а также реконструкцию поверхности коры посредством FastCSR (v1.0.0). Подготовленное T1-изображение использовалось в качестве анатомического ориентира для дальнейшего диффузионного анализа.&lt;/p&gt;\n&lt;h4 id=\"predobrabotka-diffuzionno-vzveshennyh-izobrazhenij\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#predobrabotka-diffuzionno-vzveshennyh-izobrazhenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Предобработка диффузионно-взвешенных изображений&lt;/span&gt;&lt;/a&gt;Предобработка диффузионно-взвешенных изображений&lt;/h4&gt;\n&lt;p&gt;Диффузионно-взвешенные изображения обрабатывались с помощью QSIPrep v1.0.2 с параметрами по умолчанию. Последовательности с одинаковой полярностью кодирования фазы объединялись перед обработкой. Конвейер включал MP-PCA подавление шума, удаление артефактов Гиббса, нормализацию интенсивности по изображениям b = 0, N4-коррекцию поля смещения, а также исправление движений головы, вихревых токов и искажений магнитной восприимчивости с использованием инструментов FSL eddy и TOPUP при включенной замене выбросов. Финальная интерполяция выполнялась с применением якобиановой модуляции, а данные ресэмплировались в пространство AC-PC каждого участника с изотропным разрешением 1.25 мм.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Конвейер QSIPrep выполняет комплексную техническую очистку диффузионных МРТ-данных от различных артефактов сканирования, подготавливая их для точного построения нервных волокон мозга.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rekonstrukciya-volokon\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#rekonstrukciya-volokon\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Реконструкция волокон&lt;/span&gt;&lt;/a&gt;Реконструкция волокон&lt;/h4&gt;\n&lt;p&gt;Предобработанные DWI-данные реконструировались через QSIRecon v1.0.1 с использованием рабочего процесса mrtrix_multishell_msmt_ACT-hsvs. На протяжении всей реконструкции применялись маски мозга из antsBrainExtraction. Многотканевые функции отклика оценивались алгоритмом Дхолландерса, а функции ориентации волокон белого вещества (FOD) рассчитывались методом многотканевой конгениальной сферической деконволюции и нормализовались по интенсивности через mtnormalize. Полученные FOD использовались для трактографии, тогда как анатомические ограничения выводились из гибридной поверхностно-объемной сегментации T1 (hsvs) для построения карт пяти типов тканей. Полномозговая трактография выполнялась методом анатомически ограниченной трактографии (ACT), где линии тока начинались и заканчивались на границе серого и белого вещества. Метод SIFT2 применялся для оценки весов отдельных линий тока, которые сохранялись для последующего выделения пучков и анализа связности.&lt;/p&gt;\n&lt;h4 id=\"segmentaciya-puchkov\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#segmentaciya-puchkov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сегментация пучков&lt;/span&gt;&lt;/a&gt;Сегментация пучков&lt;/h4&gt;\n&lt;p&gt;Интересующие нас пучки белого вещества выделялись с помощью pyAFQ внутри QSIRecon в рамках рабочего процесса трактометрии mrtrix_multishell_msmt_pyafq_tractometry с применением ACT. Помимо стандартных крупных волоконных пучков из pyAFQ, для гипотетико-ориентированного анализа были заданы кастомные тракты на основе областей интереса (ROI) из прошлых работ. Сюда вошли подразделения верхнего продольного пучка (SLF I, II, III) и пути вентрального цинкулюма, включающие проекции задней поясной извилины и медиальных отделов височной доли. Все области интереса были трансформированы в собственное AC-PC пространство каждого участника. Ассоциативные волокна ограничивались пределами одного полушария, а уточнение пучков проводилось через итеративное удаление выбросов и кластеризацию линий тока.&lt;/p&gt;\n&lt;h4 id=\"traktometriya\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#traktometriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Трактометрия&lt;/span&gt;&lt;/a&gt;Трактометрия&lt;/h4&gt;\n&lt;p&gt;Для каждого сегментированного пучка волокон профили трактов были извлечены путем передискретизации линий тока (streamlines) до 100 равноудаленных узлов с помощью рабочего процесса pyAFQ. Метрики диффузии и микроструктуры рассчитывались как средневзвешенные значения по линиям тока, включая фракционную анизотропию (FA), среднюю диффузию (MD), радиальную диффузию (RD), аксиальную диффузию (AD), а также параметры визуализации дисперсии ориентации и плотности нейритов (NODDI). Поскольку FA чувствительна к общей организации волокон, но не позволяет отличить микроструктурные различия от геометрических эффектов (пересечение, веерообразное расхождение или изгиб волокон), дополнительно были рассчитаны индекс плотности нейритов (NDI) и индекс дисперсии ориентации (ODI).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;NODDI — это модель, позволяющая разделить вклад плотности нейритов и их ориентационной упорядоченности в сигнал диффузии, что дает более точное представление о микроструктуре ткани, чем стандартные показатели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модель NODDI настраивалась с использованием реализации AMICO в QSIRecon при фиксированной параллельной диффузии 1.7 × 10⁻³ мм²/с и изотропной диффузии 3.0 × 10⁻³ мм²/с. Перед статистическим анализом профили трактов сглаживались с использованием ядра с полной шириной на полувысоте (FWHM) в 3 узла.&lt;/p&gt;\n&lt;h4 id=\"treking-volokon-na-osnove-funkcionalnyh-oblastej-interesa-froi\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#treking-volokon-na-osnove-funkcionalnyh-oblastej-interesa-froi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Трекинг волокон на основе функциональных областей интереса (fROI)&lt;/span&gt;&lt;/a&gt;Трекинг волокон на основе функциональных областей интереса (fROI)&lt;/h4&gt;\n&lt;p&gt;Четыре области интереса (ROI), связанные с сетью ментальных образов, были выделены на основе предыдущего исследования афантазии методом фМРТ при 7 Тесла: узел зрительных образов веретенообразной извилины (FIN), левая передняя префронтальная кора (aPFC), левая орбитофронтальная кора (OFC) и правая передняя внутритеменная борозда (aIPS). Эти области проецировались на поверхность коры с помощью FreeSurfer (RRID:SCR_001847) и сопоставлялись с границей серого и белого вещества. Поиск линий тока проводился в MRtrix3 с радиусом поиска 2 мм. Для каждой ROI извлекались и количественно оценивались линии тока в нативном пространстве: учитывалась доля линий, относящихся к анатомически определенным пучкам, и количество линий, нормализованное по объему ROI. Для FIN анализировались длинный сегмент дугообразного пучка (AF), задний дугообразный пучок (pAF), нижний лобно-затылочный пучок (IFOF), нижний продольный пучок (ILF) и вертикальный затылочный пучок (VOF). Для aPFC и OFC — IFOF и крючковидный пучок (UF); для aIPS — pAF и SLF I, II, III.&lt;/p&gt;\n&lt;h4 id=\"teoretiko-grafovyj-setevoj-analiz\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#teoretiko-grafovyj-setevoj-analiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теоретико-графовый сетевой анализ&lt;/span&gt;&lt;/a&gt;Теоретико-графовый сетевой анализ&lt;/h4&gt;\n&lt;p&gt;Кортикальная парцелляция выполнялась с использованием атласа Schaefer (400 участков, 17 сетей). Структурная связность оценивалась путем пересечения конечных точек линий тока, взвешенных по алгоритму SIFT2, с ROI участков. Соединение считалось существующим, если обе конечные точки попадали в сферу радиусом 2 мм вокруг центроида участка. Сила связи определялась как сумма весов SIFT2, нормализованная по объему участка. Матрицы смежности порогово обрабатывались так, чтобы связи, отсутствующие у 50% участников в любой группе, обнулялись. Метрики (сила узла, коэффициент кластеризации, глобальная эффективность, центральность посредничества, коэффициент участия) рассчитывались в Brain Connectivity Toolbox (MATLAB R2024b). Для проверки устойчивости анализ повторялся с атласами Schaefer (100 участков) и Gordon (333 участка).&lt;/p&gt;\n&lt;h4 id=\"izvlechenie-poverhnosti-i-morfometriya-na-osnove-poverhnosti\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#izvlechenie-poverhnosti-i-morfometriya-na-osnove-poverhnosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Извлечение поверхности и морфометрия на основе поверхности&lt;/span&gt;&lt;/a&gt;Извлечение поверхности и морфометрия на основе поверхности&lt;/h4&gt;\n&lt;p&gt;Морфометрия проводилась с помощью Computational Anatomy Toolbox (CAT12) в SPM12. Толщина коры определялась как расстояние между внутренней (граница серого/белого вещества) и внешней (граница серого вещества/ликвора) поверхностями. Карты толщины сглаживались гауссовым ядром 12 мм FWHM и передискретизировались до 32k. Статистические t-карты использовались в Neurosynth (BrainStat) для вычисления корреляций Пирсона с мета-аналитическими картами активации. Для анализа зрительной коры объем серого вещества извлекался из затылочных областей (атлас Neuromorphometrics), а толщина коры — из ранних зрительных областей (атлас HCP-MMP Glasser). Объем серого вещества нормализовался по общему внутричерепному объему.&lt;/p&gt;\n&lt;h4 id=\"kolichestvennaya-ocenka-noddi-v-serom-veshestve-i-belom-veshestve\"&gt;&lt;a
