 href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#kolichestvennaya-ocenka-noddi-v-serom-veshestve-i-belom-veshestve\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Количественная оценка NODDI в сером веществе и белом веществе&lt;/span&gt;&lt;/a&gt;Количественная оценка NODDI в сером веществе и белом веществе&lt;/h4&gt;\n&lt;p&gt;Для дополнения анализа толщины коры микроструктурными показателями авторы измерили параметры NODDI в сером веществе коры головного мозга. Модель NODDI рассчитывалась через инструмент AMICO, а полученные объемные карты NDI и ODI переносились на корковую поверхность равномерно между границами пиальной оболочки и белого вещества с помощью функции vol_to_surf в библиотеке Nilearn с последующей рессемплировкой на поверхностную сетку fsLR-32k. Этот метод подтвержден гистологическими исследованиями как для серого, так и для белого вещества, а индекс ODI эффективно улавливает микроструктурные изменения, включая демиелинизацию в посмертных образцах.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;NODDI и индексы NDI и ODI — это метод нейровизуализации на основе диффузионной МРТ, который позволяет оценить плотность невритной сети и степень дисперсии ориентации отростков нейронов как в проводящих путях, так и в коре.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"logisticheskaya-regressiya\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#logisticheskaya-regressiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Логистическая регрессия&lt;/span&gt;&lt;/a&gt;Логистическая регрессия&lt;/h4&gt;\n&lt;p&gt;Чтобы выделить компактные наборы структурных признаков, связанных с групповой принадлежностью и учитывающих общую дисперсию, исследователи применили двухуровневую модель. На первом этапе регрессия с LASSO-штрафом из пакета glmnet в R запускалась отдельно для каждого домена метрик: трактометрии FA, толщины коры и графовых показателей. Предикторами выступали средняя FA в значимых узлах трактов, толщина коры и параметры графов из предыдущих этапов. Раздельные доменные модели использовались из-за небольшой выборки (N = 36), чтобы избежать перенасыщения переменных. Отбор строился на 5-кратной перекрестной проверке с балансировкой классов, а коэффициент регуляризации выбирался по правилу одной стандартной ошибки (λ₁se). На втором этапе переменные, отобранные методом LASSO, переносились в пенализированную логистическую регрессию Фита для получения несмещенных оценок и отношений шансов, что снижает погрешности малых выборок. Переменные, вызывавшие несходимость, удалялись пошаговым методом на основе p-значений. Для оценки качества прогноза вне выборки и защиты от переобучения каждая модель проходила 1000 повторов стратифицированной 5-кратной перекрестной проверки с пересчетом параметров на тренировочных подвыборках.&lt;/p&gt;\n&lt;h4 id=\"statisticheskij-analiz-faktory-bajesa\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#statisticheskij-analiz-faktory-bajesa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистический анализ: факторы Байеса&lt;/span&gt;&lt;/a&gt;Статистический анализ: факторы Байеса&lt;/h4&gt;\n&lt;p&gt;Для оценки степени доказательств в пользу различий между группами или их отсутствия вычислялись факторы Байеса в программе JASP с использованием байесовских t-тестов и тестов Манна-Уитни со стандартными априорными распределениями размеров эффекта. Значение BF₁₀ &amp;gt; 3 трактовалось как умеренное свидетельство в пользу межгрупповых различий, а BF₀₁ &amp;gt; 3 (что эквивалентно BF₁₀ &amp;lt; 1/3) принималось как умеренное подтверждение отсутствия различий.&lt;/p&gt;\n&lt;h4 id=\"razmer-effekta\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#razmer-effekta\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Размер эффекта&lt;/span&gt;&lt;/a&gt;Размер эффекта&lt;/h4&gt;\n&lt;p&gt;Для значимых результатов размеры эффектов рассчитывались по средним значениям в каждой области. g Хеджеса применялся для FA, толщины коры и метрик NODDI в качестве стандартизированного показателя с поправкой на малый объем выборки. Дельта Клиффа использовалась для графовых метрик как непараметрическая мера. Доверительные интервалы 95% для всех эффектов оценивались методом бутстрэпа с 10 000 повторных выборок.&lt;/p&gt;\n&lt;h4 id=\"traktometriya1\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#traktometriya1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Трактометрия&lt;/span&gt;&lt;/a&gt;Трактометрия&lt;/h4&gt;\n&lt;p&gt;Межгрупповые различия профилей трактов изучались с помощью одномерного метода улучшения кластеров без порога (TFCE при E = 0.5, H = 2) вдоль узлов трактов через пакет PALM с 10 000 пермутаций. TFCE выявляет пространственно протяженные эффекты без жестких порогов кластеризации и присваивает каждому узлу p-значение с поправкой на семейную ошибку. Во избежание ложных срабатываний учитывались только кластеры, содержащие не менее 3 подряд идущих значимых узлов при пороге p &amp;lt; 0.05 с коррекцией FWE.&lt;/p&gt;\n&lt;h4 id=\"setevoj-analiz-na-osnove-teorii-grafov\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#setevoj-analiz-na-osnove-teorii-grafov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сетевой анализ на основе теории графов&lt;/span&gt;&lt;/a&gt;Сетевой анализ на основе теории графов&lt;/h4&gt;\n&lt;p&gt;Различия в узловых графовых метриках между группами проверялись непараметрическим тестом Бруннера-Мунцеля с поправкой Бенджамини-Хохберга на ложные обнаружения для всех узлов каждого показателя. Дополнительно, чтобы понять, отражают ли узловые сети топологические особенности или общие свойства взвешенного коннектома, провели анализ чувствительности нулевых сетей с помощью Toolbox подключения головного мозга. Анализ сосредоточился на взвешенном коэффициенте кластеризации, чувствительном к локальной плотности и распределению степеней. Для каждого участника создавалось 100 нулевых сетей из исходной матрицы связности функцией \\texttt{null_model_und_sign}, сохраняющей распределения степеней, весов и силы. Число перестановок бинарных ребер задавалось равным 5, а частота сортировки весов — 0.1. Эмпирический коэффициент кластеризации нормировался делением на среднее значение из нулевого распределения, после чего полученные показатели сравнивались аналогично основному анализу.&lt;/p&gt;\n&lt;h4 id=\"treking-volokon-froi\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#treking-volokon-froi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Трекинг волокон fROI&lt;/span&gt;&lt;/a&gt;Трекинг волокон fROI&lt;/h4&gt;\n&lt;p&gt;Межгрупповые различия в отфильтрованных трактах внутри каждой функциональной зоны интереса оценивались тестом Манна-Уитни, так как данные содержали много нулевых значений и не соответствовали критериям параметрической статистики.&lt;/p&gt;\n&lt;h4 id=\"morfometriya-na-osnove-poverhnosti\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#morfometriya-na-osnove-poverhnosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Морфометрия на основе поверхности&lt;/span&gt;&lt;/a&gt;Морфометрия на основе поверхности&lt;/h4&gt;\n&lt;p&gt;Статистическая оценка толщины коры головного мозга проводилась с помощью пакета BrainStat с применением линейной модели, одностороннего теста и поправки на ложнообнаруживароющие результаты (FDR). Чтобы выделить пространственно организованные кластеры значимых вершин, использовался метод иерархической плотностной кластеризации с учетом шума (HDBSCAN). Алгоритм группировал соседние точки на основе их трехмерных координат (x, y и z). В дальнейший анализ включались лишь те кластерные образования, которые насчитывали не менее 30 вершин. Для анатомической привязки выявленных зон применялся атлас Дезикана — Киллиани.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод HDBSCAN позволяет находить группы тесно расположенных точек на поверхности мозга без жесткого задавания их количества, эффективно отсеивая случайный шум.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"noddi-serogo-veshestva\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#noddi-serogo-veshestva\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;NODDI серого вещества&lt;/span&gt;&lt;/a&gt;NODDI серого вещества&lt;/h4&gt;\n&lt;p&gt;Показатели микроструктуры серого вещества коры, полученные методом визуализации плотности и ориентации нейритов (NODDI), сопоставлялись между группами посредством теории случайных полей в программной среде BrainStat. На уровне кластеров применялся порог формирования кластера p &amp;lt; 0.05 при пороге значимости самого кластера p &amp;lt; 0.05 с поправкой на семейную ошибку (FWE).&lt;/p&gt;\n&lt;h4 id=\"test-levenya-dlya-ocenki-ravenstva-dispersij\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#test-levenya-dlya-ocenki-ravenstva-dispersij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тест Левеня для оценки равенства дисперсий&lt;/span&gt;&lt;/a&gt;Тест Левеня для оценки равенства дисперсий&lt;/h4&gt;\n&lt;p&gt;Для проверки степени неоднородности проявлений афантазии в исследуемых выборках использовался модифицированный тест Брауна — Форсайта, заменяющий классический тест Левеня. Данная процедура выполнялась независимо для каждого отдельного метрического показателя.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-f1.jpg\" alt=\"Рисунок 1. Трактометрия выявляет избирательные различия микроструктуры белого вещества при афантазии. (A) Тракт с пониже\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Трактометрия выявляет избирательные различия микроструктуры белого вещества при афантазии. (A) Тракт с пониженной фракционной анизотропией (FA) у лиц с афантазией по сравнению с визуализаторами (Vis. &amp;gt; Aph.): левый крючковидный пучок (UF), правый UF и задний мозолисто-мозговой пучок межтеменной области. На верхних панелях показаны профили трактов (среднее ± SEM); на нижних — реконструкции трактов типичного участника с цветовой кодировкой по положению сегмента (узлы 1–100). Красные линии обозначают лиц с афантазией, синие — визуализаторов. Затененные серые области отмечают сегменты со значимыми различиями между группами (p &amp;lt; 0.05, с поправкой FWE). (B) Тракти с повышенной FA у лиц с афантазией по сравнению с визуализаторами (Aph. &amp;gt; Vis.): левый и правый дорсальный поясной пучок. На верхних панелях показаны профили трактов (среднее ± SEM); на нижних — типичные реконструкции трактов с цветовой кодировкой по положению сегмента. Красные линии обозначают лиц с афантазией, синие — визуализаторов. Затененные серые области и черные полосы на оси x отмечают значимые сегменты (p &amp;lt; 0.05, с поправкой FWE). Тонкие линии показывают индивидуальные профили участников, толстые — групповые средние.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-fS1.jpg\" alt=\"Дополнительный рисунок S1. Обзор пайплайна анализа. Три потока данных обрабатывались параллельно. Данные диффузионной МР\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Дополнительный рисунок S1. Обзор пайплайна анализа. Три потока данных обрабатывались параллельно. Данные диффузионной МРТ прошли предобработку и реконструкцию волокон для генерации трактографии всего мозга. Анатомические изображения T1-взвешенные обрабатывались для сегментации серого/белого вещества (GM/WM) и извлечения поверхности коры. Функциональные ROI из предыдущего исследования 7T фМРТ ментального воображения (Liu, Zhan, et al., 2025) были зарегистрированы в нативное пространство каждого участника. Эти входные данные затем использовались для четырех взаимодополняющих анализов: (1) трактометрии, в которой пучки белого вещества сегментировались и микроструктурные свойства, включая фракционную анизотропию (FA), количественно оценивались вдоль профилей трактов; (2) трактографии на основе fROI, в которой функциональные ROI проецировались на границу GM/WM для выявления линий тока, соединяющих области базовой сети воображения; (3) сетевого анализа на основе теории графов, в котором парцелляция коры и количество линий тока, взвешенные по SIFT2, использовались для построения матриц структурной связности и вывода сетевых метрик на уровне узлов; и (4) поверхностной морфометрии, в которой толщина коры оценивалась по извлеченным поверхностям коры и сравнивалась между группами по всему мозгу.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"tablicy\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#tablicy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Таблицы&lt;/span&gt;&lt;/a&gt;Таблицы&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 1.&lt;/strong&gt; Сравнение путей белого вещества между афантазией и визуализаторами&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тракт&lt;/th&gt;\n&lt;th&gt;Дробная анизотропия (FA)&lt;/th&gt;\n&lt;th&gt;Аксиальная диффузия (AD)&lt;/th&gt;\n&lt;th&gt;Радиальная диффузия (RD)&lt;/th&gt;\n&lt;th&gt;Индекс плотности невритов (NDI)&lt;/th&gt;\n&lt;th&gt;Индекс дисперсии ориентации (ODI)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Vis &amp;gt; Aph&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;right UF&lt;/td&gt;\n&lt;td&gt;77-84 (0.018; 3.43; 1.09 [0.53, 1.82], 17.13)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;78-83 (0.061; 2.50; -0.90 [-1.64, -0.32]; 5.45)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;left UF&lt;/td&gt;\n&lt;td&gt;75-77 (0.048; 2.89; 0.94 [0.38, 1.65], 6.93)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;74-78 (0.085; 2.54; -0.82 [-1.57, -0.21]; 3.41)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;interparietal corpus callosum&lt;/td&gt;\n&lt;td&gt;47-50 (0.039; 3.01; 0.97 [0.34, 1.83], 8.18)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;47-52 (0.071; 2.71; -0.86 [-1.79, -0.21]; 4.17)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Aph &amp;gt; Vis&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Aph &amp;gt; Vis&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Vis &amp;gt; Aph&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Aph &amp;gt; Vis&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Vis &amp;gt; Aph&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;right dorsal cingulum&lt;/td&gt;\n&lt;td&gt;46-69 (0.019; 2.85; -0.90 [-1.63, -0.30], 5.44)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;40-76 (0.016; 2.96; 0.89 [0.30, 1.62]; 5.17)&lt;/td&gt;\n&lt;td&gt;44-63 (0.046; 2.17; -0.72 [- 1.40, -0.11] 2.06)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&
