        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"204\" cy=\"117\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"616\" cy=\"166\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · IMMUNOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как вернуть иммунитету силу&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;при терапии рака&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons-f1.jpg\" alt=\"Рисунок 1 / Функциональные нарушения и транскрипционное перепрограммирование T-клеток пациентов при монотерапии TCE (A) \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1 / Функциональные нарушения и транскрипционное перепрограммирование T-клеток пациентов при монотерапии TCE (A) PBMC (n=5) были выделены у пациентов с мКРПЖ до и после первого цикла лечения (дни 1 и 8 соответственно), и 100 000 клеток каждого временной точки инкубировали с клетками LNCaP (соотношение E:T 1:1) в течение 72 ч в присутствии CC-1 или изотипического контрольного антитела (CC-iso) (по 1 нМ каждое) с последующим функциональным анализом. (B-C) Пролиферация T-клеток, активация CD4+ и CD8+ T-клеток и высвобождение IFN-γ определялись с использованием включения 3H-тимидина, проточной цитометрии и мультиплексных анализов LEGENDplex соответственно (B); истощение клеток LNCaP определялось методом проточной цитометрии (C). Данные для отдельных пациентов см. на дополнительном рисунке 1A. (D) PBMC трех пациентов, полученные в указанные временные точки до (дни 1, 22, 43, 64) и после (дни 7, 29, 50, 71) лечения, инкубировали с облученными клетками LNCaP и CC-1 (1 нМ). Через 72 ч пролиферация T-клеток оценивалась путем включения 3H-тимидина. Данные для отдельных пациентов см. на дополнительном рисунке 1C. (E) Концентрации CC-1 и растворимого рецептора интерлейкина-2 (sIL-2R) в плазме измеряли в указанные временные точки в течение нескольких циклов лечения, а уровни в сыворотке количественно определяли с помощью ИФА. Показаны результаты для одного репрезентативного пациента. Данные для двух дополнительных пациентов см. на дополнительном рисунке 1D. (F) Кластеризация на основе алгоритма Лейдена для данных секвенирования scRNA, визуализированная с помощью UMAP, с отображением основных популяций иммунных клеток в PBMC пациентов, собранных исходно (день 1) и после терапии (день 8), аннотированных в соответствии с каноническими маркерами линий. UA, не назначено. (G) Точечные графики, суммирующие изменения экспрессии выбранных генов, вовлеченных в состояние покоя/анэргию T-клеток, раннюю активацию и метаболические регуляторы по временным точкам; размер точек указывает долю клеток, экспрессирующих соответствующие гены; интенсивность цвета отражает среднюю экспрессию. (H) Анализ обогащения наборов генов (GSEA), показывающий значительное обогащение канонических транскрипционных программ, связанных с анэргией и гипореактивностью, по сравнению с образцами до лечения (день 1). Путь SAFFORD_T_LYMPHOCYTE_ANERGY (MSigDB) был значительно обогащен в CD4+ и CD8+ T-клетках на 8-й день. NES, нормализованная оценка обогащения; FDR, частота ложных открытий. (I) Субкластеризация T-клеток была визуализирована с помощью UMAP, выявив отчетливые функциональные состояния, включая пролиферативные, эффекторно-подобные и гипореактивные популяции, возникающие после терапии. (J) Графики плотности встраивания, иллюстрирующие распределение состояний T-клеток до лечения (день 1) и после терапии (день 8), документирующие сдвиг в сторону гипореактивных и непролиферативных фенотипов. Столбчатые диаграммы представляют распределение кластеров в каждом состоянии.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Современные противоопухолевые препараты заставляют иммунные клетки атаковать рак, но со временем истощают их. Ученые выяснили, почему это происходит, и создали способ вернуть Т-клеткам работоспособность с помощью дополнительных молекулярных сигналов. Эксперименты показали, что такой подход полностью восстанавливает противоопухолевый иммунитет.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Монотерапия TCE вызывает у Т-клеток состояние анергии и покоя.&lt;/li&gt;\n&lt;li&gt;Разработаны биспецифические костимуляторы BiCos с двухвалентным CD28.&lt;/li&gt;\n&lt;li&gt;Комбинация BiCos и TCE восстанавливает функции лимфоцитов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Препараты класса bispecific T-cell engagers (TCE), стимулирующие рецептор CD3, активно применяются в онкологии, однако их монотерапия приводит к потере функциональности Т-клеток. Анализ методом single-cell RNA-sequencing (одноклеточное секвенирование РНК) показал, что изоляция первого сигнала активации запускает программы анергии и покоя с повышением экспрессии генов CBLB, BACH2 и KLF2.&lt;/p&gt;\n&lt;p&gt;Для преодоления этого эффекта исследователи разработали биспецифические костимуляторы (BiCos), доставляющие второй сигнал через bivalent (двухвалентное) связывание CD28. Конструкция сохраняет строгую селективность к опухолевым антигенам эндоглину и B7-H3, которые также экспрессируются внеклеточным матриксом.&lt;/p&gt;\n&lt;p&gt;Доклинические тесты на гуманизированных мышах продемонстрировали, что сочетание BiCos с низкими дозами TCE приводит к элиминации опухолей. Молекулярный анализ подтвердил отмену признаков покоя и полное восстановление пролиферативной способности Т-клеток.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты получены на моделях с клеточными линиями и гуманизированных мышах, а также на образцах пациентов в рамках ранней фазы клинических испытаний.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Биспецифичные Т-клеточные рекрутеры, стимулирующие CD3 (TCE), стремительно развиваются в современной онкотерапии. Однако монотерапия с помощью TCE у онкологических больных приводит к развитию гипореактивности Т-клеток, которая выражается в полном подавлении их пролиферативной и литической активности. С помощью одномолекулярного секвенирования РНК (single-cell RNA-sequencing) были выявлены транскрипционные признаки анэргального состояния или покоя, включая активацию экспрессии генов CBLB и BACH2, а также угнетение программ активации, зависящих от транскрипционного фактора AP-1, что обусловлено изолированной подачей только первого сигнала для Т-клеток (сигнала-1).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Одномолекулярное секвенирование РНК (single-cell RNA-sequencing) — это передовой метод анализа активности генов в каждой отдельной клетке, позволяющий увидеть скрытые различия между ними.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для восстановления функциональной активности Т-клеток исследователи разработали биспецифичные костимуляторы (BiCos), которые обеспечивают подачу второго сигнала (сигнала-2) посредством высокоэффективного бивалентного связывания с рецептором CD28. При этом BiCos сохраняют строго избирательную активность, направленную только на те антигены, которые экспрессируются не только опухолевыми клетками, но и компонентами внеклеточного матрикса.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Разработанные биспецифичные костимуляторы BiCos доставляют ключевой сигнал-2 через связывание с CD28, преодолевая вызванную TCE гипореактивность лимфоцитов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Доклинические исследования на моделях показали, что BiCos значительно усиливают терапевтический эффект монотерапии TCE, превосходя по своей активности моновалентные костимуляторы формата Knob-into-Hole с CD28, и успешно возвращают Т-клеткам их утраченные функции. В экспериментах на гуманизированных мышах применение BiCos в комбинации с минимальными дозами TCE приводило к полному уничтожению сформировавшихся опухолей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Данные получены на доклинических моделях с использованием гуманизированных мышей, поэтому для подтверждения безопасности и эффективности у людей требуются клинические испытания.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В завершение авторы продемонстрировали, что BiCos способны обращать вспять ключевые молекулярные признаки клеточного покоя, такие как повышенная экспрессия BACH2 и KLF2 в Т-клетках пациентов, получавших TCE. Это приводит к полному восстановлению клеточных функций и формированию устойчивого противоопухолевого иммунного ответа.&lt;/p&gt;\n&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;В 1980-х годах исследователи описали ключевые центральные рецепторы, управляющие работой T-лимфоцитов — главных исполнительных клеток приобретенного иммунитета. Первым стал комплекс T-клеточного рецептора (TCR)/CD3, который отвечает за антигенспецифический «сигнал 1», запускающий активацию. Вскоре ученые открыли рецептор CD28, ставший классическим примером костимулирующего рецептора, который передает критически важный «сигнал 2». Позднее были найдены и другие костимулирующие структуры, включая 4-1BB (CD137) и OX40 (CD134). Подтвердилось, что костимуляция не просто усиливает «сигнал 1», но и защищает T-клетки от гипореактивности — состояния несговорчивости, которое возникает, если стимулировать один лишь комплекс TCR/CD3. Одновременно выяснилось, что иммунные контрольные точки вроде CTLA-4 и PD-1 передают коингибиторные сигналы, сдерживающие избыточную активацию T-клеток. Эти открытия открыли дорогу для терапевтической регуляции клеточного иммунитета.&lt;/p&gt;\n&lt;p&gt;Помимо биспецифических молекул, вовлекающих T-клетки через стимуляцию CD3 (TCE), и функционально близких к ним CAR-T-клеток, арсенал онкотерапии пополнился ингибиторами контрольных точек, которые сегодня прочно закрепились в клинической практике. Важное различие между TCE и CAR-T заключается в том, что последние для достижения лечебного эффекта нуждаются не только в сигналах от CD3, но и в сигналах от костимулирующих молекул, таких как CD28 или 4-1BB. Сама идея добавлять костимулирующие сигналы в формат биспецифических антител (bsAb) была предложена еще в 1980-х годах: тогда авторы показали, что сочетание bsAb с мишенями TAAxCD3 и TAAxCD28 (где TAA — опухолево-ассоциированный антиген) дает мощный ответ T-клеток против опухоли, после чего провели клинические испытания такой комбинации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Биспецифические антитела и CAR-T-клетки — это современные иммунотерапевтические подходы, где искусственные белки или генетически измененные T-клетки нацеливаются одновременно на опухолевый антиген и на рецепторы самого иммунитета для уничтожения рака.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Однако дальнейшее клиническое развитие таргетной костимуляции опухолей было почти полностью остановлено в 2006 году после инцидента с препаратом TGN1412 компании Tegenero. Тогда супер-агонистическое моноклональное антитело против CD28 вызвало жизнеугрожающий цитокиновый шторм у здоровых добровольцев, участвовавших в испытании.&lt;/p&gt;\n&lt;h4 id=\"razrabotka-bispecificheskih-kostimulyatorov\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#razrabotka-bispecificheskih-kostimulyatorov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Разработка биспецифических костимуляторов&lt;/span&gt;&lt;/a&gt;Разработка биспецифических костимуляторов&lt;/h4&gt;\n&lt;p&gt;Наши усилия по созданию оптимизированных биспецифических костимуляторов (BiCo) получили новый толчок после недавних наблюдений в клиническом исследовании с использованием TCE, направленного против PSMA. В данной работе мы, судя по всему, впервые демонстрируем, что длительное монотерапевтическое лечение с помощью TCE способно вызывать функциональную гипореактивность T-клеток у пациентов. Это происходит из-за подавления программ активации, а также из-за включения канонических генов клеточного покоя (квиесценции) и анергии.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Длительное применение только лишь TCE-терапии приводит к истощению и гипореактивности T-клеток пациента, отключая их защитные активационные программы.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Стремясь поддержать работоспособность T-клеток и учитывая, что бивалентность многократно усиливает агонистическую активность антител к CD28, мы разработали BiCo принципиально нового типа. В отличие от существовавших ранее конструкций, они содержат бивалентные фрагменты для связывания опухолевого антигена (TAA) и CD28, сохраняя при этом строго ограниченную опухолью активность. В качестве мишеней были выбраны эндоглин и B7-H3, которые экспрессируются не только на самих раковых клетках, но и во внеклеточном матриксе опухолей, включая их новообразованные сосуды. Мы также исходили из того, что применение двух разных TAA с непересекающейся экспрессией на здоровых тканях обеспечит дополнительный уровень безопасности при комбинации TCE и BiCo. Последним для проявления костимулирующего эффекта обязательно требуется «сигнал 1», то есть предварительная активация со стороны TCE.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Описанные эксперименты и механизмы действия BiCo исследуются на клеточных моделях и материалах пациентов; хотя они открывают огромные перспективы для онкологии, любые доклинические выводы требуют строгой проверки в клинических условиях.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В настоящей работе мы показываем, что доставка сигналов через CD28 с помощью наших бивалентных BiCo способна как предотвращать, так и обращать вспять гипореактивность T-клеток, возникающую при монотерапии TCE. Это достигается за счет перезапуска пролиферативных клеточных циклов, усиления эффекторных профилей и путей активации, а также одновременного подавления характерных признаков анергии и покоя. В результате достигается мощное усиление противоопухолевого иммунного ответа T-клеток.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"lechenie-monoterapiej-tce-induciruet-giporeaktivnost-t-kletok\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#lechenie-monoterapiej-tce-induciruet-giporeaktivnost-t-kletok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Лечение монотерапией TCE индуцирует гипореактивность Т-клеток&lt;/span&gt;&lt;/a&gt;Лечение монотерапией TCE индуцирует гипореактивность Т-клеток&lt;/h4&gt;\n&lt;p&gt;В текущем клиническом исследовании фазы 1a у пациентов с метастатическим кастрационно-резистентным раком предстательной железы (mCRPC) наблюдалось быстрое, но кратковременное снижение уровня простатспецифического антигена (PSA) при применении монотерапии нашим PSMA-направленным Т-клеточным энгаджером (TCE) CC-1 в рамках протокола NCT04104607. Ex vivo анализ периферических мононуклеарных клеток крови (PBMC), полученных до и вскоре после начала лечения (Рис. 1A), выявил резкое падение способности Т-клеток отвечать на стимуляцию CD3. Это касалось активации, пролиферации, секреции цитокинов и цитолитической активности, несмотря на то, что общее количество CD4⁺ и CD8⁺ Т-клеток оставалось на сопоставимом уровне (Рис. 1, B и C; Рис. S1, A и B). Лонгитюдный ex vivo анализ показал, что Т-клетки пациентов частично восстанавливаются после двухнелетнего перерыва в лечении (Рис. 1D, сравните, например, день 7 и день 22; Рис. S1C). Тем не менее, общая реактивность оставалась глубоко подавленной со значительной вариабельностью между пациентами, о чем свидетельствовали слабые ответы на повторное введение TCE (Рис. 1D, день 1 против дней 22 и 64; Рис. S1C), а также снижение пиковых сывороточных уровней растворимого рецептора IL-2 (sIL-2R) по мере увеличения числа курсов терапии (Рис. 1E и Рис. S1D).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons-f1.jpg\" alt=\"Рисунок 1 / Функциональные нарушения и транскрипционное перепрограммирование T-клеток пациентов при монотерапии TCE (A) \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1 / Функциональные нарушения и транскрипционное перепрограммирование T-клеток пациентов при монотерапии TCE (A) PBMC (n=5) были выделены у пациентов с мКРПЖ до и после первого цикла лечения (дни 1 и 8 соответственно), и 100 000 клеток каждого временной точки инкубировали с клетками LNCaP (соотношение E:T 1:1) в течение 72 ч в присутствии CC-1 или изотипического контрольного антитела (CC-iso) (по 1 нМ каждое) с последующим функциональным анализом. (B-C) Пролиферация T-клеток, активация CD4+ и CD8+ T-клеток и высвобождение IFN-γ определялись с использованием включения 3H-тимидина, проточной цитометрии и мультиплексных анализов LEGENDplex соответственно (B); истощение клеток LNCaP определялось методом проточной цитометрии (C). Данные для отдельных пациентов см. на дополнительном рисунке 1A. (D) PBMC трех пациентов, полученные в указанные временные точки до (дни 1, 22, 43, 64) и после (дни 7, 29, 50, 71) лечения, инкубировали с облученными клетками LNCaP и CC-1 (1 нМ). Через 72 ч пролиферация T-клеток оценивалась путем включения 3H-тимидина. Данные для отдельных пациентов см. на дополнительном рисунке 1C. (E) Концентрации CC-1 и растворимого рецептора интерлейкина-2 (sIL-2R) в плазме измеряли в указанные временные точки в течение нескольких циклов лечения, а уровни в сыворотке количественно определяли с помощью ИФА. Показаны результаты для одного репрезентативного пациента. Данные для двух дополнительных пациентов см. на дополнительном рисунке 1D. (F) Кластеризация на основе алгоритма Лейдена для данных секвенирования scRNA, визуализированная с помощью UMAP, с отображением основных популяций иммунных клеток в PBMC пациентов, собранных исходно (день 1) и после терапии (день 8), аннотированных в соответствии с каноническими маркерами линий. UA, не назначено. (G) Точечные графики, суммирующие изменения экспрессии выбранных генов, вовлеченных в состояние покоя/анэргию T-клеток, раннюю активацию и метаболические регуляторы по временным точкам; размер точек указывает долю клеток, экспрессирующих соответствующие гены; интенсивность цвета отражает среднюю экспрессию. (H) Анализ обогащения наборов генов (GSEA), показывающий значительное обогащение канонических транскрипционных программ, связанных с анэргией и гипореактивностью, по сравнению с образцами до лечения (день 1). Путь SAFFORD_T_LYMPHOCYTE_ANERGY (MSigDB) был значительно обогащен в CD4+ и CD8+ T-клетках на 8-й день. NES, нормализованная оценка обогащения; FDR, частота ложных открытий. (I) Субкластеризация T-клеток была визуализирована с помощью UMAP, выявив отчетливые функциональные состояния, включая пролиферативные, эффекторно-подобные и гипореактивные популяции, возникающие после терапии. (J) Графики плотности встраивания, иллюстрирующие распределение состояний T-клеток до лечения (день 1) и после терапии (день 8), документирующие сдвиг в сторону гипореактивных и непролиферативных фенотипов. Столбчатые диаграммы представляют распределение кластеров в каждом состоянии.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Монотерапия TCE CC-1 вызывает глубокую, хотя и частично обратимую гипореактивность Т-клеток без классического истощения, со снижением ответов при повторных введениях и падением уровня sIL-2R.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Гипореактивные Т-клетки не демонстрировали значимого повышения уровня маркеров истощения (например, PD-1: P = 0.7 для CD4⁺ Т-клеток и P = 0.5 для CD8⁺ Т-клеток) или фенотипа, характерного для старения или терминальной дифференцировки (PD-1, CD57, KLRG1, потеря CD27/CD28) (Рис. S1, E и F). Одноклеточное секвенирование РНК (scRNA-seq) образцов PBMC до и после терапии позволило выделить семь отдельных кластеров иммунных клеток: CD4+ Т-клетки, CD8+ Т-клетки, NK-клетки, В-клетки, CD16+ моноциты, CD14+ моноциты и дендритные клетки (Рис. 1F). Сравнительный scRNA-seq анализ парных образцов первого и восьмого дней показал, что лечение TCE запускает скоординированную транскрипционную программу, типичную для анаэргии и покоя Т-клеток. Происходило усиление экспрессии регуляторных метаболических факторов и генов, связанных с анаэргией/покоем (CBLB, BACH2, FOXP1, PTPN22, LAG3, LDHA, UCP2), и подавление генов ранней активации (FOS, FOSB, JUN, JUNB, DUSP1, CD69) (Рис. 1G).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анализ scRNA-seq и GSEA помогают заглянуть внутрь отдельных клеток и увидеть работу целых групп генов, показывая, переходит ли клетка в режим анаэргии (нечувствительности) или старения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Такой профиль экспрессии согласуется с индуцированным BACH2 состоянием покоя, для которого характерно подавление активации AP-1 и черты анаэргии, включая повышенный уровень CBLB. В подтверждение этого анализ набора генных путей (GSEA) выявил значимое обогащение наборов генов, связанных с анаэргией (NES = 1.633, p &amp;lt; 0.0001 и FDR &amp;lt; 0.0001 в CD4⁺ Т-клетках; NES = 1.420, p &amp;lt; 0.0001 и FDR &amp;lt; 0.0001 в CD8⁺ Т-клетках) в Т-клетках после воздействия TCE (Рис. 1H и Рис. S2). Субкластеризация и анализ плотности распределения (Рис. 1, I и J) подтвердили, что CD8⁺ Т-клетки смещаются из эффекторно-памятного состояния в дисфункциональное терминальное эффекторно-подобное состояние, тогда как CD4⁺ Т-клетки переходят из фенотипа ранней активации/центральной памяти в состояние покоя. Наблюдаемое распределение подкластеров согласуется с измененными паттернами дифференцировки при хронической несбалансированной стимуляции.&lt;/p&gt;\n&lt;h4 id=\"format-i-vybor-svyazyvayushego-domena-dlya-optimizirovannoj-bispecificheskoj-kostimulyacii-cd28\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#format-i-vybor-svyazyvayushego-domena-dlya-optimizirovannoj-bispecificheskoj-kostimulyacii-cd28\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Формат и выбор связывающего домена для оптимизированной биспецифической костимуляции CD28&lt;/span&gt;&lt;/a&gt;Формат и выбор связывающего домена для оптимизированной биспецифической костимуляции CD28&lt;/h4&gt;\n&lt;p&gt;Моноспецифичные антитела к CD28 требуют бивалентного, а не моновалентного связывания для проявления костимулирующей активности. Соответственно, бивалентное связывание CD28 может обеспечить превосходную функцию костимулирующих биспецифических антител (bsAb), но сопряжено с риском потери активности, ограниченной опухолевым антигеном, что ведет к побочным эффектам. Чтобы решить эту дилемму, исследователи создали и охарактеризовали четыре бивалентных формата BiCo с нерелевантной специфичностью мишени (Рис. 2A и Рис. S3, A и B). Два из них (bs-CD28-1 и bs-CD28-2) связывали CD28 через Fab-фрагменты с более высоким сродством к CD28 на Т-клетках, в то время как два других (bs-CD28-3 и bs-CD28-4) содержали одноцепочечные anti-CD28 домены, слитные с тяжелыми или легкими цепями (Рис. S3C).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons-f2.jpg\" alt=\"Рисунок 2 / Выбор формата и функциональная характеристика BiCO (A) Схематическое представление различных биспецифических\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2 / Выбор формата и функциональная характеристика BiCO (A) Схематическое представление различных биспецифических форматов антител к CD28 (bs-CD28), направленных на нерелевантный антиген MOPC-21. Общая структура различных тетравалентных форматов содержит две бивалентные части связывания: первая образована естественным N-концом остова IgG, а вторая состоит из двух слитных на C-конце одноцепочечных фрагментов Fv (scFv). Часть связывания CD28 представляет собой либо естественную N-концевую часть связывания (варианты 1 и 2), либо C-концевую часть scFv (варианты 3 и 4). C-концевые части scFv слиты с доменами CH3- (варианты 1 и 3) или CL-доменами (варианты 2 и 4). Остов представляет собой IgG1k с подавленной функцией Fc для предотвращения неспецифического взаимодействия с Fc-гамма-рецепторами. (B) Облученные клетки LNCaP культивировали с PBMC (n=8) при соотношении E:T 4:1 в присутствии CC-1 (25 пМ) и указанных конструтов bs-CD28 (10 нМ). Пролиферация измерялась через три дня путем включения 3H-тимидина. Данные представлены как среднее ± SD. (C) Облученные клетки LNCaP-E инкубировали с PBMC (n=2 донора) при соотношении E:T 4:1 в присутствии CC-1 (25 пМ) и указанных концентраций конструктов bs-CD28-4 (Kro22 и Kro23, направленных на эндоглин; 8H8 и 7C4, направленных на B7-H3). Через три дня пролиферацию оценивали с помощью анализа включения 3H-тимидина. (D) Мышам NSG (n=4 на группу) вводили внутрибрюшинно 2×10^7 человеческих PBMC и внутривенно 20 мкг BiCo-1 или BiCo-2 отдельно или в комбинации с 0,8 мкг CC-1. Антитело UCHT1 (анти-CD3) использовалось в качестве положительного контроля. Уровни цитокинов в сыворотке измеряли в образцах крови, полученных через 24 ч, с помощью метода LEGENDplex. (E) PBMC (n=6) культивировали с облученными клетками LNCaP-E и указанными конструтами с последующим анализом пролиферации путем включения 3H-тимидина. Слева: титрование дозы CC-1 в присутствии BiCo-iso, BiCo-1 или BiCo-2 (все в концентрации 0,5 нМ). Справа: титрование дозы BiCo-1 и BiCo-2 в присутствии CC-1 или CC-iso (оба по 25 пМ). Стрелками указаны концентрации, выбранные для последующих экспериментов. Данные представлены как среднее ± SD. (F) PBMC (n=5 доноров) культивировали с клетками LNCaP-E при соотношении E:T 1:1 в присутствии CC-1 (25 пМ, CC-1low) и указанных молекул BiCo (0,5 нМ). Уменьшение количества клеток-мишеней количественно оценивали с помощью проточной цитометрии через 72 ч. (G) Мониторинг роста опухолевых клеток LNCaP-E в реальном времени в присутствии PBMC, истощенных по моноцитам, CC-1 (25 пМ, CC-1low) и BiCo (0,5 нМ) с использованием системы xCELLigence. (H) Формат BiCo состоит из варианта 4, изображенного на A, с бивалентной частью нацеливания, направленной на эндоглин (BiCo-1) или B7-H3 (Bico-2), и бивалентной частью связывания CD28 (αCD28). Формат KiH состоит из двух естественных цепей IgG, связывающих части нацеливания (эндоглин или B7-H3) и CD28 моновалентно. Связующие элементы эндоглина, B7-H3 и CD28, используемые в обоих форматах, идентичны. (I) PBMC (n=4 донора) культивировали с облученными клетками LNCaP-E в присутствии CC-1 или изотипического контроля (CC-iso) (оба по 25 пМ) с указанными концентрациями BiCo-1, BiCo-2, KiH-1 или KiH-2 с последующим анализом пролиферации путем включения 3H-тимидина. Данные представлены как среднее ± SD. Стрелками указаны концентрации, выбранные для последующих экспериментов. (J-M) Истощенные по моноцитам PBMC, меченные CellTrace Violet, культивировали с клетками LNCaP-E при соотношении E:T 1:1 с CC-1 (25 пМ, CC-1low) и BiCo/KiH (оба по 5 нМ), как указано. Среду, клетки-мишени и конструты восполняли на 4-й день с последующим проточным цитометрическим анализом. (J) Репрезентативные профили пролиферации (левые панели), полученные через 4 дня. Индекс деления (n=6 доноров) пролиферирующих CD4+ и CD8+ T-клеток рассчитывали с использованием FlowJo (правые панели). (K-L) Репрезентативные tSNE-графики (слева) и количество субпопуляций T-клеток (справа) для CD4+ T-клеток (K) и CD8+ T-клеток (L), определенные на 7-й день (n=6 доноров). (M) Уничтожение опухолевых клеток оценивали на 7-й день (n=5 доноров). (N) Мышам C57Bl/6 (n=4 мыши на группу) вводили 20 мкг BiCo-1 и BiCo-2 с последующим определением концентраций в сыворотке в указанные временные точки с помощью анализа Promega. (O-P) Мышам NSG с сформировавшимися опухолями LNCaP-E на боку (диаметр ~4 мм) пересаживали человеческие PBMC и лечили внутривенно CC-1 (0,8 мкг), BiCo-1, BiCo-2 или BiCo-iso (20 мкг); рост опухоли контролировали дважды в неделю. (O) Комбинированное лечение с помощью TCE и BiCo применяли на 1-й, 8-й и 15-й дни. Показаны репрезентативные изображения биолюминесценции на день (левая панель) и размер опухоли, определенный с помощью штангенциркуля (правая панель). Данные представляют n=5 мышей на группу. (P) Для изучения эффектов отсрочки лечения BiCo животные получали CC-1 на 1-й день с последующим введением BiCo на 4-й день и комбинированным лечением, начинающимся на 8-й день (когорты с отсроченным BiCo); альтернативно, мыши получали CC-1 на 1-й день с последующим комбинированным лечением, начинающимся на 8-й день (когорты с отсроченными CC-1 + BiCo). Размер опухоли определялся измерением штангенциркулем. Данные представляют n=5 мышей на группу.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Из четырех созданных форматов BiCo только кандидат bs-CD28-4 продемонстрировал строго ограниченную мишенью активность без нежелательной стимуляции Т-клеток в отсутствие опухолевого антигена.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В сочетании с субмитогенными дозами TCE (CC-1), обеспечивающими «сигнал 1», только формат bs-CD28-4 продемонстрировал строго ограниченную активность, исключая стимуляцию Т-клеток в отсутствие связывания с опухолевым ассоциированным антигеном (TAA) (Рис. 2B). Исходя из этого, формат bs-CD28-4 был выбран для создания BiCo, направленных на эндоглин и B7-H3. Эти TAA широко экспрессируются на солидных опухолях, а также во внеклеточном матриксе опухолей (ECM), включая новообразованные сосуды, и потому оптимально подходят для усиления иммунного ответа, индуцированного CC-1 (Рис. S3D). Из панелей новых и ранее описанных моноклональных антител (mAbs) было отобрано по два связывающих агента для эндоглина и B7-H3 на основе оптимального сродства (Рис. S3, E и F). После клонирования и характеристики четырех конструкций два BiCo, получившие названия BiCo-1 (endoglin-Kro22×CD28) и BiCo-2 (B7-H3-8H8×CD28) (Рис. S3, G–I), были отобраны в качестве ведущих кандидатов по результатам сравнительного анализа индукции пролиферации Т-клеток (Рис. 2C).&lt;/p&gt;\n&lt;h4 id=\"funkcionalnaya-harakteristika-bico-molekul\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#funkcionalnaya-harakteristika-bico-molekul\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Функциональная характеристика BiCo-молекул&lt;/span&gt;&lt;/a&gt;Функциональная характеристика BiCo-молекул&lt;/h4&gt;\n&lt;p&gt;В ходе проверки безопасности in vivo у гуманизированных мышей без опухолей было показано, что ведущие кандидаты BiCo-1 и BiCo-2, в отличие от контрольного антитела UCHT1, не вызывают высвобождения цитокинов как при раздельном применении, так и в комбинации с CC-1 (Рис. 2D). Это подтверждает отсутствие нецелевой активации T-клеток и строгую зависимость комбинированной схемы от наличия мишени.&lt;/p&gt;\n&lt;p&gt;Анализы с использованием целевых клеток, несущих или не несущих антиген-мишень, наряду с оценкой зависимости эффекта от дозы, продемонстрировали активность, строго зависящую от опухолевого антигена. Максимальная пролиферация T-клеток достигалась при минимальных концентрациях CC-1 в 25 pM и BiCo в 0.5 nM (Рис. 2E, Рис. 4 и 5, A и B); именно эти уровни были выбраны для дальнейшей работы. Оба соединения BiCo мощно стимулировали активируемые TCE ответы CD4⁺ и CD8⁺ T-клеток, секрецию IFN-γ и уничтожение опухолевых мишеней (Рис. 2, F и G; Рис. 5, C-E). Особенно в долгосрочных экспериментах сочетание BiCo с низкими дозами TCE вызывало значительно усиленную (например, для CD8⁺ T-клеток P = 0.03 для BiCo-1 и P = 0.004 для BiCo-2) и полностью условную пролиферацию T-линий, а также заметное накопление эффекторных клеток памяти и клеток центральной памяти по сравнению даже с высокими дозами (1000 pM) одиночного TCE (Рис. 5, F и G).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бивалентные BiCo-молекулы в сочетании с низкими дозами TCE вызывают строго зависимую от мишени пролиферацию CD4+ и CD8+ T-клеток (P = 0.03 и P = 0.004), эффективное уничтожение опухоли и превосходят стандартные моновалентные аналоги.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для сравнения нашего бивалентного формата BiCo с моновалентными костимулирующими молекулами CD28 типа Knob-into-Hole (KiH), проходящими клинические испытания (NCT06826768, NCT04626635, NCT04590326), мы создали конструкции KiH-1 и KiH-2 на основе тех же доменов связывания TAA и CD28 (Рис. 2H, Рис. 6, A и B). Неожиданно оказалось, что по аффинности конструкции KiH сопоставимы с нашими BiCo (Рис. 3I, Рис. 6, C-E). Однако при сопоставлении костимулирующего потенциала в комбинации с TCE наши BiCo-молекулы показали явно превосходящую активность в широком диапазоне концентраций (Рис. 2I).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons-f3.jpg\" alt=\"Рисунок 3 / Обращение и предотвращение гипореактивности T-клеток, индуцированной TCE, с помощью BiCo (A) PBMC были собра\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3 / Обращение и предотвращение гипореактивности T-клеток, индуцированной TCE, с помощью BiCo (A) PBMC были собраны у пациентов до и после лечения TCE с помощью CC-1 (дни 1 и 8 соответственно), инкубированы ex vivo с CC-1 отдельно или в комбинации с BiCo и впоследствии подвергнуты функциональному анализу. (B) PBMC пациентов (n=5) культивировали с опухолевыми клетками LNCaP-E при соотношении E:T 1:1 в присутствии 1 нМ CC-1 с или без 0,5 нМ BiCo-1, BiCo-2 или изотипического контроля (BiCo-iso). Через 72 ч пролиферация T-клеток количественно определялась путем включения 3H-тимидина, уничтожение опухолевых клеток определялось методом проточной цитометрии. (C) PBMC трех пациентов, полученные до и после лечения (дни 1 и 8 последующих циклов; см. схему на рисунке 1D), инкубировали с CC-1 (5 нМ) отдельно или вместе с BiCo-1 (5 нМ). Через 72 ч пролиферация T-клеток оценивалась путем включения 3H-тимидина. (D) Субкластеризация данных scRNA-seq на основе алгоритма Лейдена, визуализированная с помощью UMAP, с отображением популяций T-клеток в образцах PBMC пациентов, собранных после терапии (день 8) и инкубированных в течение 3 дней in vitro с LNCaP-E и 1 нМ CC-1 с или без 0,5 нМ BiCo, аннотированных с использованием канонических маркеров линий. Визуализация субкластеризации T-клеток с помощью UMAP, выявляющая различные функциональные состояния T-клеток. (E) Точечные графики, суммирующие временные изменения экспрессии выбранных генов, вовлеченных в активацию T-клеток, цитотоксичность, пролиферацию и состояние покоя. Размер точек указывает долю клеток, экспрессирующих соответствующий ген; интенсивность цвета отражает среднюю экспрессию. (F-G) Графики плотности, иллюстрирующие сдвиги в распределении состояний T-клеток пациентов (день 8), обработанных in vitro только CC-1 или CC-1+BiCo (F), демонстрирующие выраженный переход к пролиферативным фенотипам. (G) Столбчатые диаграммы, отображающие распределение кластеров по экспериментальным условиям. (H) PBMC (n=4) культивировали с клетками LNCaP-E при соотношении E:T 1:2 в присутствии CC-1 (1 нМ); среду, клетки-мишени и конструты восполняли на 4-й день для имитации хронического воздействия. На 7-й день PBMC были рестимулированы клетками LNCaP-E при соотношении E:T 1:1 в присутствии CC-1 (1 нМ) отдельно или в комбинации с указанными конструтами BiCo (0,5 нМ). На 10-й день пролиферация T-клеток оценивалась путем включения 3H-тимидина, а уничтожение опухолевых клеток оценивалось с помощью проточной цитометрии. (I) PBMC (n=4) культивировали с клетками LNCaP-E при соотношении E:T 1:2 в присутствии или в отсутствие CC-1 (1 нМ) отдельно или в комбинации с конструтами BiCo (0,5 нМ). Среду, клетки-мишени и конструты восполняли на 4-й и 7-й дни (с клетками LNCaP-E при соотношении E:T 1:1 на 7-й день). На 10-й день пролиферация T-клеток оценивалась путем включения 3H-тимидина, а уничтожение опухолевых клеток оценивалось с помощью проточной цитометрии. (J) PBMC (n=3) культивировали с клетками SHP-77 при соотношении E:T 1:2 в присутствии тарталамаба (1 нМ). Среду и клетки-мишени восполняли на 4-й день. После воздействия до 7-го дня, имитирующего индукцию гипореактивности, PBMC были рестимулированы клетками SHP при соотношении E:T 1:1 в присутствии тарталамаба (1 нМ) или в комбинации с BiCo-2 (0,5 нМ). Пролиферация измерялась на 10-й день путем включения 3H-тимидина, а уничтожение опухолевых клеток оценивалось с помощью проточной цитометрии.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Формат Knob-into-Hole (KiH) — это метод создания гетеродимерных антител с помощью модификации тяжелых цепей («выступ в ямку»), используемый для разработки биспецифических молекул.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Используя насыщающие концентрации в nM для всех молекул в последующих тестах, мы установили, что бивалентный формат BiCo индуцирует значительно превосходящую пролиферацию CD4+ и CD8+ T-клеток (для CD4+: P &amp;lt; 0.0001 для BiCo против KiH; для CD8+: P &amp;lt; 0.0001 для BiCo-1 против KiH-1 и P = 0.0014 для BiCo-2 против KiH-2), а также улучшает формирование памяти и лизис опухолевых клеток (P &amp;lt; 0.0001 для BiCo-1 против KiH-1 и P = 0.0002 для BiCo-2 против KiH-2), особенно в долгосрочных тестах (Рис. 2, J-M и Рис. 7, A-E). Такая разница в эффективности может объясняться пятикратно сниженной скоростью диссоциации (off-rate) сайта связывания CD28 у бивалентных BiCo (Рис. 6D), хотя нельзя исключать и влияние особой пространственной конформации рецепторов.&lt;/p&gt;\n&lt;p&gt;Фармакокинетический анализ на мышах C57BL/6 показал, что период полувыведения BiCo из сыворотки крови сравним с классическими моноклональными антителами (Рис. 2N). У мышей NSG с ксенографтами человеческих PBMC одновременное лечение CC-1 и BiCo (но не одним TCE) полностью элиминировало крупные солидные опухоли LNCaP-E и статистически значимо улучшило выживаемость животных (P &amp;lt; 0.0001, по данным измерений штангенциркулем, биолюминесценции и анализа Каплана-Мейера; Рис. 2O, Рис. 7F). Отложенное введение BiCo после первоначального применения монотерапии CC-1 давало менее выраженный противоопухолевый эффект, но всё же значительно превосходило одиночный CC-1, подтверждая перспективность костимуляции CD28 для усиления действия TCE.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Данные получены на мышиных моделях ксенографтов с человеческими клетками, что требует осторожности при экстраполяции результатов на клиническую практику пациентов с опухолями.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"bicos-obrashayut-vspyat-i-predotvrashayut-giporeaktivnost-t-kletok\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#bicos-obrashayut-vspyat-i-predotvrashayut-giporeaktivnost-t-kletok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;BiCos обращают вспять и предотвращают гипореактивность Т-клеток&lt;/span&gt;&lt;/a&gt;BiCos обращают вспять и предотвращают гипореактивность Т-клеток&lt;/h4&gt;\n&lt;p&gt;Анализ пролиферации Т-клеток и их способности уничтожать опухолевые клетки с использованием мононуклеарных клеток периферической крови (PBMC) пяти пациентов, полученных до (день 1 цикла 1) и после (день 8) терапии TCE, показал, что применение BiCos полностью устраняет гипореактивность. Примечательно, что как у Т-клеток пациентов, ответивших на TCE, так и у не ответивших, добавление BiCos повышало уровень активности значительно выше значений, достигаемых (у отвечающих клеток) при использовании высокой концентрации одного лишь TCE (Рис. 3, A и B, P &amp;lt; 0.0001). Этот эффект сохранялся и при анализе клеток, полученных на более поздних циклах лечения (Рис. 3C).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Применение BiCos полностью обращает вспять гипореактивность Т-клеток, поднимая их активность выше уровня монотерапии TCE (P &amp;lt; 0.0001) и восстанавливая популяции эффекторной памяти.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ транскриптома на уровне отдельных клеток продемонстрировал, что лечение BiCo возобновляет активную программу клеточного цикла, включая усиление экспрессии генов семейства MCM и CDC, а также активирует эффекторные программы и пути, связанные с активацией (GZMB, NKG7, TNF, IL2RA, IRF4). Одновременно с этим обращаются вспять ключевые признаки анаэргии и покоя Т-клеток, такие как снижение экспрессии KLF2, PNRC1, TXNIP, CD52, SARAF и BACH2 (Рис. 3, D и E). Дополнительный анализ плотности распределения клеток (Рис. 3, F и G) показал, что терапия BiCo связана со смещением CD8⁺ Т-клеток из дисфункциональных терминальных эффекторно-подобных состояний обратно в популяции эффекторной памяти. Параллельно CD4⁺ Т-клетки переходили из покоящихся фенотипов в состояния ранней активации центральной памяти, что согласуется с восстановлением баланса активации и функциональности.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GSEA — метод статистического анализа, позволяющий определить, согласованно ли меняется активность целых групп генов (например, отвечающих за пролиферацию или воспаление) в ответ на воздействие.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Индукция гипореактивности при лечении TCE была смоделирована in vitro путем инкубации PBMC и клеток-мишеней с TCE в течение 7 дней с последующей оценкой реактивности при повторной стимуляции TCE. Как и у пациентов, длительное воздействие CC-1 приводило к гипореактивности Т-клеток, которая зависела от взаимодействия с мишенью, поскольку присутствие CC-1 в отсутствие опухолевых клеток не влияло на реактивность Т-клеток. Подобно данным, полученным на клетках пациентов, гипореактивность можно было полностью предотвратить и обратить вспять присутствием BiCos во время 7-дневной инкубации с TCE и на этапе функционального анализа соответственно (Рис. 3, H и I; Рис. S7G).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдаемые эффекты получены в экспериментах in vitro и на ограниченной выборке клеток пациентов (n=5), что требует дальнейшей клинической проверки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Аналогичные результаты были получены с тарлатамабом (Рис. 3J), что подтверждает применимость наших выводов о вызванной TCE гипореактивности Т-клеток к другим клиническим препаратам. Тарлатамаб недавно был одобрен для лечения мелкоклеточного рака легкого (SCLC) и представляет собой биспецифичный активатор Т-клеток с продленным периодом полувыведения (BiTE), состоящий из двух одноцепочаточных вариабельных фрагментов (scFv), связывающих DLL3 на опухолевых клетках и CD3 на Т-клетки, и объединенных с измененным Fc-доменом.&lt;/p&gt;\n&lt;p&gt;В совокупности наши результаты демонстрируют, что монотерапия TCE вызывает гипореактивность Т-клеток, характеризующуюся изменениями внутриклеточных путей, связанных с функциональной анаэргией или покоем, а не терминальным истощением. Функциональность Т-клеток может быть восстановлена, а гипореактивность предотвращена путем обеспечения CD28-сигнализации с помощью BiCos, что усиливает противоопухолевый иммунитет Т-клеток до беспрецедентного уровня.&lt;/p&gt;\n&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;h4 id=\"obsuzhdenie-rezultatov-primeneniya-bispecificheskih-antitel-i-mehanizmov-giporeaktivnosti-t-kletok\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#obsuzhdenie-rezultatov-primeneniya-bispecificheskih-antitel-i-mehanizmov-giporeaktivnosti-t-kletok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение результатов применения биспецифических антител и механизмов гипореактивности T-клеток&lt;/span&gt;&lt;/a&gt;Обсуждение результатов применения биспецифических антител и механизмов гипореактивности T-клеток&lt;/h4&gt;\n&lt;p&gt;Традиционные биспецифические антитела, нацеленные на опухолевые антигены и рецептор CD3 T-клеток (TCE), успешно применяются при злокачественных новообразованиях B-клеток и активно внедряются при других опухолях, что подтверждается одобрением тарлатамаба для лечения мелкоклеточного рака легкого с общей частотой ответа 35%. Однако значительная часть пациентов, особенно с солидными опухолями, не отвечает на такую терапию, что требует глубокого изучения причин неудач. Анализируя T-клетки пациентов с раком предстательной железы в клиническом исследовании NCT04104607, получавших PSMAxCD3 TCE CC-1, авторы обнаружили, что длительное лечение приводит к выраженной функциональной гипореактивности T-клеток. Это состояние лишь частично устранялось даже после двухнедельных перерывов в терапии, о чем свидетельствует снижение пиковых сывороточных уровней sIL-2R при увеличении числа циклов лечения. Такие данные впервые демонстрируют, что монотерапия TCE вызывает у пациентов резистентность T-клеток, способную снижать эффективность борьбы с солидными опухолями. Аналогичное подавление функции наблюдалось при стимуляции PBMC тарлатамабом in vitro, подтверждая универсальность феномена. В дальнейшем необходимо изучить связь между схемой введения TCE и степенью гипореактивности для оптимизации дозирования.&lt;/p&gt;\n&lt;p&gt;Изолированная стимуляция TCR/CD3 комплекса известна как фактор развития T-клеточной гипореактивности, для которой характерны дефицит продукции интерлейкина-2, остановка пролиферации и включение регуляторных путей подавления. В настоящей работе впервые на клинических образцах показано, что монотерапия TCE подавляет транскрипционные факторы AP-1 семейств FOS и JUN, снижает метаболическую и активирующую активность, а также индуцирует регуляторы гипореактивности, включая BACH2, FOXP1, CBLB, PNRC1, PTPN22 и метаболические репрессоры TXNIP и UCP2. Устойчивого повышения уровня PD-1 или маркеров терминальной дифференцировки (CD57, KLRG1) не наблюдалось, что исключает необратимое истощение или старение клеток. Вместо этого транскрипционный профиль соответствует раннему параличу или дефициту костимуляции, описываемым при хроническом воздействии опухолевых антигенов. Одноклеточный анализ показал, что как CD8⁺, так и CD4⁺ T-клетки фиксируются на промежуточных стадиях дифференцировки, переходя в дисфункциональные эффекторно-подобные или покоящиеся состояния. Это согласуется с ролью BACH2, который подавляет эффекторную дифференцировку, управляемую AP-1, и поддерживает толерантность в условиях нехватки костимулирующих сигналов. В условиях опухолей и хронических инфекций повышенный уровень BACH2 ограничивает индукцию MYC и сохраняет T-клетки в пластичном, но функционально заблокированном состоянии покоя. Таким образом, монотерапия TCE способна индуцировать устойчивую анергию, ограничивающую противоопухолевый иммунитет.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Длительная монотерапия TCE приводит к функциональной гипореактивности T-клеток, характеризующейся подавлением AP-1, индукцией факторов вроде BACH2 и блокировкой эффекторных программ без признаков классического истощения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Гипореактивность и анергия — это состояние функциональной нечувствительности T-клеток к стимуляции, когда они сохраняют жизнеспособность, но не могут полноценно атаковать опухоль из-за отсутствия вторых сигналов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ранее было известно, что костимулирующие сигналы через молекулу CD28 способны противодействовать гипореактивности T-клеток, вызванной избыточной стимуляцией TCR/CD3. Исходя из этих данных и наблюдений у пациентов, авторы предположили необходимость применения биспецифических костимулирующих молекул (BiCos) для раскрытия полного потенциала антител. Хотя растворимые бивалентные антитела к CD28 обладают мощной активностью, они не обладают целевой специфичностью, что опасно в клинической практике, как показал инцидент с препаратом Tegenero. Для достижения целевой специфичности CD28-биспецифические молекулы обычно делают моновалентными по отношению к CD28, что ограничивает их аффинность. В данной работе представлен новый тетравалентный формат BiCo, сохраняющий бивалентность к CD28 и обеспечивающий строгую целевую специфичность. Пространственная конформация двух scFv-доменов связывания CD28 позволяет проявлять агонистическую активность только после иммобилизации на клетке-мишени. В качестве опухолево-ассоциированных антигенов (TAA) для ведущих конструкций были выбраны эндоглин (BiCo-1) и B7-H3 (BiCo-2) благодаря их экспрессии не только на опухолевых клетках, но и внеклеточном матриксе опухоли, что улучшает доступ иммунных клеток в очаг.&lt;/p&gt;\n&lt;h4 id=\"eksperimentalnaya-ocenka-effektivnosti-bispecificheskoj-kostimulyacii\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#eksperimentalnaya-ocenka-effektivnosti-bispecificheskoj-kostimulyacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Экспериментальная оценка эффективности биспецифической костимуляции&lt;/span&gt;&lt;/a&gt;Экспериментальная оценка эффективности биспецифической костимуляции&lt;/h4&gt;\n&lt;p&gt;В различных моделях in vitro BiCo-1 и BiCo-2 мощно стимулировали противоопухолевую активность T-клеток даже при очень низких концентрациях TCE, что открывает перспективы для снижения клинических побочных эффектов. Комбинированная терапия значительно превосходила по эффективности применение TCE в виде монотерапии, даже в высоких концентрациях.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Данные получены на экспериментальных моделях in vitro и ограниченных клинических выборках пациентов, поэтому требуют дальнейшего подтверждения в широких клинических исследованиях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"prevoshodstvo-kombinacii-tce-i-bico\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#prevoshodstvo-kombinacii-tce-i-bico\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Превосходство комбинации TCE и BiCo&lt;/span&gt;&lt;/a&gt;Превосходство комбинации TCE и BiCo&lt;/h4&gt;\n&lt;p&gt;Эффективность комбинированной терапии TCE и BiCo была подтверждена на моделях ксенотрансплантатов у мышей, где только совместное применение привело к полной элиминации опухоли. Сравнение наших бивалентных BiCo с доступными моновалентными аналогами, созданными по технологии KiH, показало, что тетравалентный формат BiCo обладает значительно более высокой костимулирующей способностью. Примечательно, что разница заключалась не в аффинности связывания с CD28, а в скоростях диссоциации (off-rates), которые у моновалентных конструкций были примерно в 5 раз выше. Это указывает на более стабильное формирование комплекса BiCo с молекулой CD28.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бивалентная структура BiCo обеспечивает более стабильное связывание с CD28 и превосходит моновалентные аналоги в элиминации опухолей in vivo.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Однако сложно однозначно разделить вклад кинетической стабилизации и структурного кластеризации рецепторов, так как бивалентная архитектура влияет на оба параметра. Таким образом, преимущество формата BiCo нельзя приписать исключительно одному из этих механизмов.&lt;/p&gt;\n&lt;h4 id=\"vosstanovlenie-funkcionalnosti-t-kletok\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#vosstanovlenie-funkcionalnosti-t-kletok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Восстановление функциональности Т-клеток&lt;/span&gt;&lt;/a&gt;Восстановление функциональности Т-клеток&lt;/h4&gt;\n&lt;p&gt;Наши данные демонстрируют, что BiCo способны не только усиливать, но и восстанавливать эффекторную компетентность Т-клеток, преодолевая состояние гипореактивности у пациентов, получавших монотерапию TCE. Это сопровождается снижением экспрессии генов, связанных с анергией и состоянием покоя, и одновременным восстановлением экспрессии генов, отвечающих за активацию, цитотоксичность, пролиферацию и цитокиновый ответ. Это позволяет клеткам преодолеть остановку в фазе G0/G1 и перейти к пролиферации. Эти результаты согласуются с недавними исследованиями, показывающими, что передача сигналов через CD28 нейтрализует анергию за счет усиления продукции IL-2 и подавления репрессии, опосредованной BACH2.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анергия — это состояние иммунологической толерантности или «спячки» Т-клеток, при котором они не отвечают на стимулы, в отличие от терминального истощения, которое является необратимым.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В целом, монотерапия TCE может приводить к гипореактивности Т-клеток, что снижает эффективность лечения. Наши наблюдения, подтвержденные доклиническими моделями с использованием биспецифического антитела DLL3xCD3 (тарлатамаб), указывают на классовый эффект TCE. Применение BiCo сохраняет пролиферативный потенциал и цитотоксическую активность, а также обращает вспять молекулярную сигнатуру TCE-индуцированной анергии. Мы рассматриваем условную CD28-костимуляцию как стратегию для повышения эффективности иммунотерапии. Клиническое исследование комбинации TCE и BiCo запланировано на 2026 год.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Выводы основаны на доклинических моделях и анализе образцов пациентов; клиническая эффективность комбинации еще должна быть подтверждена в ходе предстоящих испытаний.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"pol-kak-biologicheskaya-peremennaya\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#pol-kak-biologicheskaya-peremennaya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пол как биологическая переменная&lt;/span&gt;&lt;/a&gt;Пол как биологическая переменная&lt;/h4&gt;\n&lt;p&gt;В исследовании участвовали только пациенты мужского пола с метастатическим кастрационно-резистентным раком предстательной железы. Эксперименты in vivo проводились на самках мышей для обеспечения более однородного приживления опухолей и снижения вариативности между группами.&lt;/p&gt;\n&lt;h4 id=\"obrazcy-pacientov-i-kletochnye-linii\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#obrazcy-pacientov-i-kletochnye-linii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Образцы пациентов и клеточные линии&lt;/span&gt;&lt;/a&gt;Образцы пациентов и клеточные линии&lt;/h4&gt;\n&lt;p&gt;Образцы мононуклеаров периферической крови (PBMC) были получены от пяти пациентов в рамках фазы I клинического испытания (NCT04104607) препарата CC-1 (биспецифическое антитело PSMAxCD3). Забор крови проводился до и через 7 дней после начала терапии: 78 мкг в 1-й день, 215 мкг во 2-й день и по 826 мкг ежедневно с 3-го по 7-й день. Клетки выделяли методом центрифугирования в градиенте плотности с использованием раствора Biocoll.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PBMC (мононуклеары периферической крови) — это фракция крови, включающая лимфоциты и моноциты, которая часто используется в иммунологических исследованиях для оценки ответа организма на терапию.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Клеточные линии LNCaP и SHP-77 были получены из специализированных биобанков (DSMZ и ATCC). Для создания модифицированных линий LNCaP-E (экспрессирующие эндоглин) и LNCaPKO (с нокаутом B7-H3) использовали лентивирусную трансдукцию. Культивирование проводили с добавлением пуромицина (10 мкг/мл), а для LNCaPKO дополнительно использовали генетицин (1 мкг/мл). Все линии регулярно проверялись на отсутствие микоплазмы.&lt;/p&gt;\n&lt;h4 id=\"poluchenie-monoklonalnyh-antitel-k-endoglinu\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#poluchenie-monoklonalnyh-antitel-k-endoglinu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Получение моноклональных антител к эндоглину&lt;/span&gt;&lt;/a&gt;Получение моноклональных антител к эндоглину&lt;/h4&gt;\n&lt;p&gt;Мышей линии BALB/c в возрасте 8 недель иммунизировали внутрибрюшинно клетками Sp2/0-Ag14, трансфицированными эндоглином. Проводили до четырех иммунизаций с интервалом в две недели, за четыре дня до слияния клеток выполняли финальный бустер. Спленоциты сливали с миеломными клетками Sp2/0-Ag14 с помощью полиэтиленгликоля (PEG 1500). Гибридомы отбирали на среде HAT, клоны проверяли методом проточной цитометрии, субклонировали и криоконсервировали.&lt;/p&gt;\n&lt;h4 id=\"sozdanie-i-ochistka-bispecificheskih-antitel\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#sozdanie-i-ochistka-bispecificheskih-antitel\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Создание и очистка биспецифических антител&lt;/span&gt;&lt;/a&gt;Создание и очистка биспецифических антител&lt;/h4&gt;\n&lt;p&gt;Вариабельные домены для эндоглина, B7-H3 и контрольного MOPC-21 были оптимизированы по кодонам для экспрессии в клетках CHO. Использовался каркас IgG1κ с мутациями LALA (L234A/L235A) для подавления Fc-функций и YTE (M252Y/S254T/T256E) для увеличения периода полувыведения. scFv-фрагмент CD28 присоединяли через гибкий глицин-сериновый линкер. Для структуры «knob-into-hole» (KiH) вводили мутации в CH3-домен (knob: T366W; hole: T366S/L368A/Y407V). Очистку проводили аффинной хроматографией на белке А, чистоту проверяли SDS-PAGE и гель-фильтрацией. Уровень эндотоксинов составлял &amp;lt;0,5 Ед/мл.&lt;/p&gt;\n&lt;h4 id=\"kinetika-svyazyvaniya-i-affinnost\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#kinetika-svyazyvaniya-i-affinnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кинетика связывания и аффинность&lt;/span&gt;&lt;/a&gt;Кинетика связывания и аффинность&lt;/h4&gt;\n&lt;p&gt;Кинетику и аффинность измеряли методами поверхностного плазмонного резонанса (SPR) на приборе Biacore X и биослойной интерферометрии (BLI) на системе Octet RED96. Параметры связывания (kon, koff) и константы диссоциации (K_D) рассчитывали с помощью программного обеспечения BIAevaluation v4.1 и Octet Data Analysis v11.1. Связывание с антигенами на клетках LNCaP-E и CD28 на Т-клетках анализировали методом проточной цитометрии (BD FACSCanto II, BD FACSCalibur), данные обрабатывали в FlowJo, а значения EC₅₀ рассчитывали в GraphPad Prism 9.&lt;/p&gt;\n&lt;h4 id=\"profilirovanie-transkriptoma-odinochnyh-kletok-i-vychislitelnyj-analiz\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#profilirovanie-transkriptoma-odinochnyh-kletok-i-vychislitelnyj-analiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Профилирование транскриптома одиночных клеток и вычислительный анализ&lt;/span&gt;&lt;/a&gt;Профилирование транскриптома одиночных клеток и вычислительный анализ&lt;/h4&gt;\n&lt;p&gt;Подготовка образцов мононуклеарных клеток периферической крови (PBMC) пациентов с раком простаты проводилась согласно протоколу 10× Genomics Feature Barcode для мечения белков клеточной поверхности. Для мультиплексирования и снижения эффекта партии клетки доноров метили олигонуклеотидными антителами TotalSeq-C (Таблица SN 1). Одиночные клетки инкапсулировали в эмульсионные гелевые капли (GEMs) с использованием системы Chromium X. Библиотеки для анализа экспрессии генов (5′ GEX), Т-клеточных рецепторов (VDJ) и белков поверхности (SP) создавались с помощью наборов Chromium Next GEM Single Cell 5′ HT v2 и соответствующих реагентов. Секвенирование проводилось на платформе Illumina NovaSeq 6000. Обработка данных, включая выравнивание на геном GRCh38-202-A и подсчет экспрессии, выполнялась в Cell Ranger 7.1.0, а последующая визуализация и анализ — в Scanpy 1.11.1 и Seurat.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод мультиплексирования позволяет объединять клетки от разных доноров в один эксперимент, используя уникальные «штрих-коды» (хештеги) для каждой группы, что минимизирует технические различия между образцами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Из анализа исключали гены, экспрессирующиеся менее чем в 3 клетках, а также митохондриальные, рибосомальные гены, lncRNA и псевдогены. Кластеризация проводилась алгоритмом Leiden на основе графов соседства и UMAP-проекций. Для ex vivo и in vitro образцов параметры кластеризации варьировались: n_pcs от 13 до 25, n_neighbors от 25 до 30, min_dist от 0.3 до 0.5, resolution от 0.21 до 0.63. Субкластеризация CD3+ клеток проводилась с параметрами n_pcs 5–31, n_neighbors 5–15, min_dist 0.45–0.7 и resolution 0.1–0.4. Дифференциально экспрессирующиеся гены (DEG) определялись тестом Вилкоксона с поправкой Бенджамини-Хохберга.&lt;/p&gt;\n&lt;p&gt;Анализ обогащения наборов генов (GSEA) выполнялся через функцию GSEApy prerank (2000 перестановок) для оценки функциональных сдвигов между 0 и 8 сутками в CD4+ и CD8+ Т-клетках. Использовались пути Safford_T_Lymphocyte_Anergie и GSE46242_TH1_VS_ANERGIC_TH1_CD4_TCELL_UP. Статистически значимыми считались результаты с FDR &amp;lt; 0.05. Ведущие гены, обеспечивающие сигнал и повышенную экспрессию на 8-е сутки, представлены в Таблице SN 1.&lt;/p&gt;\n&lt;h4 id=\"proliferaciya-t-kletok\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#proliferaciya-t-kletok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пролиферация Т-клеток&lt;/span&gt;&lt;/a&gt;Пролиферация Т-клеток&lt;/h4&gt;\n&lt;p&gt;PBMC без моноцитов культивировали с клетками-мишенями в присутствии или отсутствии биспецифических антител (bsAbs). Через 48 ч клетки метили 3H-метил-тимидином (0.5 мкКи/лунка) на 20 ч с последующим сцинтилляционным подсчетом. Альтернативно использовали мечение CellTrace Violet (2 мкМ). На 3-и сутки добавляли свежие опухолевые клетки и bsAbs, а пролиферацию оценивали на 4-е или 6-е сутки методом проточной цитометрии, используя маркеры CD4, CD8, CD45RO и CD62L.&lt;/p&gt;\n&lt;h4 id=\"analizy-citotoksichnosti\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#analizy-citotoksichnosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализы цитотоксичности&lt;/span&gt;&lt;/a&gt;Анализы цитотоксичности&lt;/h4&gt;\n&lt;p&gt;Лизис клеток-мишеней оценивали методом проточной цитометрии через 24 или 72 ч. Т-клетки идентифицировали по маркерам CD4 и CD8, активацию — по CD69 и CD25, опухолевые клетки — по EpCAM, исключая мертвые клетки красителем 7-AAD. Для контроля объема использовали калибровочные шарики. Кинетику гибели клеток отслеживали в реальном времени системой xCELLigence RTCA каждые 30 минут в течение 120 часов.&lt;/p&gt;\n&lt;h4 id=\"sekreciya-citokinov\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#sekreciya-citokinov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Секреция цитокинов&lt;/span&gt;&lt;/a&gt;Секреция цитокинов&lt;/h4&gt;\n&lt;p&gt;Уровни IL-2 и IFN-γ в супернатантах после 24-часовой инкубации PBMC с опухолевыми клетками и bsAbs измеряли наборами Legendplex. Концентрацию растворимого рецептора IL-2 (sIL-2R) в плазме крови пациентов определяли методом ELISA согласно инструкциям производителя.&lt;/p&gt;\n&lt;h4 id=\"analiz-giporeaktivnosti-t-kletok-in-vitro\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#analiz-giporeaktivnosti-t-kletok-in-vitro\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ гипореактивности Т-клеток in vitro&lt;/span&gt;&lt;/a&gt;Анализ гипореактивности Т-клеток in vitro&lt;/h4&gt;\n&lt;p&gt;Для оценки гипореактивности Т-клеток мононуклеары периферической крови (PBMC) здоровых доноров культивировали с опухолевыми клетками в соотношении эффектор:мишень (E:T) 2:1. В среду добавляли TCE (1 нМ) отдельно или в комбинации с BiCos (0,5 нМ). На 4-й день проводили замену среды, опухолевых клеток и антител. На 7-й день PBMC повторно стимулировали опухолевыми клетками (E:T = 1:1) и TCE с добавлением BiCos или без них. На 10-й день пролиферацию Т-клеток измеряли методом включения ³H-тимидина, а активацию CD8⁺ Т-клеток и цитотоксичность в отношении опухоли оценивали методом проточной цитометрии.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Проточная цитометрия — метод анализа клеток в потоке жидкости, позволяющий быстро определять физические и химические характеристики тысяч отдельных клеток с помощью лазеров и флуоресцентных меток.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Экспрессию поверхностных маркеров на PBMC пациентов (Рис. SN 1, C и D) определяли методом проточной цитометрии без предварительной стимуляции in vitro. Использованные антитела перечислены в Таблице SN 2, анализ проводили на спектральном цитометре Cytek Aurora с автоматической компенсацией.&lt;/p&gt;\n&lt;h4 id=\"issledovaniya-in-vivo\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#issledovaniya-in-vivo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Исследования in vivo&lt;/span&gt;&lt;/a&gt;Исследования in vivo&lt;/h4&gt;\n&lt;p&gt;Все эксперименты на животных проводились в условиях SPF (отсутствие специфических патогенов). Использовались мыши, подобранные по возрасту и полу; состояние здоровья животных контролировалось ежедневно. При достижении заранее определенных гуманных конечных точек мышей подвергали эвтаназии. Ослепление в данном исследовании не применялось.&lt;/p&gt;\n&lt;p&gt;Для фармакокинетического анализа 20 мкг конструкций вводили внутривенно мышам C57BL/6, концентрацию в сыворотке определяли с помощью биолюминесцентных Т-клеточных тестов (Promega). Противоопухолевую активность оценивали на самках мышей NSG, которым подкожно вводили клетки LNCaP-E, трансдуцированные люциферазой, до формирования опухолей диаметром около 5 мм. На 1, 8 и 15-й дни мышам вводили внутривенно 1×10⁷ человеческих PBMC с CC-1 (0,8 мкг) в комбинации с BiCo-1, BiCo-2 или изотипическим контролем (20 мкг). В группах с отсроченным введением BiCo мыши получали только CC-1 на 1-й день, затем BiCo-1 или BiCo-2 на 4-й день, и далее комбинацию CC-1/BiCo на 8-й и 15-й дни. В группах с отсроченной комбинацией CC-1 вводили на 1-й день, а комбинированную терапию начинали с 8-го дня. Рост опухоли отслеживали дважды в неделю, эвтаназию проводили при достижении диаметра 15 мм. Биолюминесцентную визуализацию выполняли на системе IVIS Lumina II (PerkinElmer) с анализом в программе Living Image.&lt;/p&gt;\n&lt;p&gt;Для оценки токсичности мышам NSG вводили внутривенно 20×10⁶ человеческих PBMC с 20 мкг антител или без них. Уровни цитокинов в сыворотке измеряли через 24 часа с помощью панели LEGENDplex™ Human Th1 Cytokine Panel (BioLegend).&lt;/p&gt;\n&lt;h4 id=\"statisticheskij-analiz\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#statisticheskij-analiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистический анализ&lt;/span&gt;&lt;/a&gt;Статистический анализ&lt;/h4&gt;\n&lt;p&gt;Анализ данных выполнялся в программе GraphPad Prism. Результаты представлены как среднее ± стандартное отклонение (SD) или индивидуальные значения. Сравнение групп проводилось с использованием двухфакторного (two-way) и однофакторного (one-way) ANOVA, t-критерия Стьюдента, критерия Уилкоксона или непараметрического критерия Манна-Уитни. Нормальность распределения проверялась тестом Шапиро-Уилка, гомогенность дисперсии — тестом Брауна-Форсайта.&lt;/p&gt;\n&lt;h4 id=\"odobrenie-issledovaniya\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#odobrenie-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Одобрение исследования&lt;/span&gt;&lt;/a&gt;Одобрение исследования&lt;/h4&gt;\n&lt;p&gt;Образцы PBMC пациентов с метастатическим кастрационно-резистентным раком простаты (исследование NCT04104607) и здоровых доноров были получены с информированного согласия. Эксперименты на животных соответствовали принципам «3R» (замена, сокращение, усовершенствование) и директиве 2010/63/EU. Протоколы одобрены комитетом по этике Тюбингенского университета (M02/22 G).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;истощение&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;т-клеток при&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;терапии tce&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;секвенирование&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;рнк и bicos&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;возврат&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;функции&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;т-клеток&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;повышение&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;эффективности&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;лечения рака&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не прошёл рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th
