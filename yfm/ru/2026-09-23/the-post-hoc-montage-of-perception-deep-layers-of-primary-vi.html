        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"273\" cy=\"167\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"527\" cy=\"189\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Мозг дописывает реальность&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;задним числом в первичной&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;зрительной коре&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi-f1.jpg\" alt=\"Рисунок 1. Экспериментальная парадигма и поведенческие результаты. A) Вверху: предъявление двух пар аудиовизуальных стим\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Экспериментальная парадигма и поведенческие результаты. A) Вверху: предъявление двух пар аудиовизуальных стимулов с дополнительным звуком между ними приводит к восприятию дополнительного визуального стимула; внизу: предъявление двух пар аудиовизуальных стимулов с дополнительной вспышкой между ними приводит к подавлению этой дополнительной вспышки (адаптировано из Stiles et al. (5)). B) Доля проб, в которых участники сообщали, что видели три вспышки вместо двух, раздельно для различных условий. Визуальное отображение условий см. на рис. S1. Черные полосы обозначают стандартную ошибку среднего (SEM). *** p &amp;lt; 0,001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Обычное восприятие кажется прямой трансляцией окружающего мира, однако мозг часто собирает картинку задним числом. Ученые выяснили, что зрительные иллюзии, создаваемые звуковыми сигналами, меняют активность глубоких слоев первичной зрительной зоны коры. Это доказывает существование механизма постдикции, когда мозг пересчитывает прошлые сигналы на основе более поздней информации. В этом процессе задействована обратная связь из ассоциативных зон височной коры.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Восприятие корректируется задним числом благодаря обратной связи из височной коры&lt;/li&gt;\n&lt;li&gt;Сверхвысокопольное 7Т МРТ позволило зафиксировать сигналы в глубоких слоях коры V1&lt;/li&gt;\n&lt;li&gt;Иллюзорные вспышки вызывают в V1 те же паттерны активности, что и реальные стимулы&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Долгое время нейробиология фокусировалась преимущественно на предикции — способности мозга прогнозировать будущее на основе накопленного опыта. Однако существует и обратный феномен — постдикция, при которой информация, поступающая с задержкой в несколько сотен миллисекунд, способна изменить восприятие уже случившегося стимула. До сих пор оставалось неясным, на каком этапе обработки информации происходит эта корректировка. Исследователи предположили, что за нее отвечает обратная связь из мультисенсорных областей в первичную зрительную кору (V1).&lt;/p&gt;\n&lt;p&gt;Для проверки этой гипотезы ученые использовали две кросс-модальные иллюзии, в которых звуковой сигнал либо создавал иллюзию несуществующей вспышки света, либо подавлял восприятие реально поданной вспышки. Во время эксперимента 23 участника проходили сканирование на сверхвысокопольном 7-тесла томографе с высоким разрешением вокселей (0.8 мм), что позволило изолировать активность отдельных слоев коры. Дополнительное картирование рецептивных полей помогло точно выделить область V1, настроенную на обработку иллюзорного стимула.&lt;/p&gt;\n&lt;p&gt;Результаты показали, что паттерны активности в глубоких слоях первичной зрительной коры при иллюзиях соответствуют реальному восприятию стимула, а не простому физическому сигналу на сетчатке. Информационный анализ связности указал на верхнюю височную кору как на источник нисходящей обратной связи. Таким образом, V1 участвует не только в первичном анализе настоящего и прогнозировании будущего, но и в ретроспективной переработке зрительного опыта.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа проводилась на небольшой выборке из 23 участников с использованием искусственных аудиовизуальных иллюзий, что ограничивает перенос выводов на естественные условия восприятия.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Одним из самых загадочных аспектов восприятия является постдикция: более поздняя информация может изменять восприятие предыдущего стимула. Это указывает на то, что восприятие представляет собой не прямую трансляцию внешнего мира, а скорее ретроспективную реконструкцию. Каким образом мозг пересматривает восприятие? Было высказано предположение, что возвратная обработка в сенсорной иерархии может удерживать более раннюю информацию достаточно долго, чтобы последующая информация могла на нее повлиять. Мы выдвинули гипотезу, что это позволяет обратной связи от вышестоящих мультисенсорных областей изменять представление более ранних визуальных стимулов в первичной зрительной коре (V1).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Постдиктивные иллюзии вызывают активность в глубоких слоях V1, аналогичную реальным перцептам, что указывает на ретроспективную обратную связь из вышестоящих отделов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В данном исследовании мы проверили эту гипотезу с помощью двух постдиктивных иллюзий, в которых присутствие или отсутствие тона определяет, соответственно, восприятие иллюзорной вспышки или перцептивное подавление реально предъявленной вспышки. Это позволило нам изолировать нейронные сигналы, отражающие иллюзорные перцепты, от сенсорных входов в ретинотопическом пространстве. Мы собрали данные 7T фМРТ с высоким разрешением по слоям у участников (N = 23), испытывавших эти иллюзии.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;фМРТ высокого разрешения на томографе 7 Тл (7T) позволяет различать активность в отдельных слоях коры головного мозга (глубоких и поверхностных), что дает возможность определять направление потоков информации — поступает ли сигнал извне или приходит по обратной связи из других областей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы обнаружили, что постдиктивные иллюзии индуцируют такие же паттерны активности, как и реальные перцепты, в частности в глубоких слоях V1, что свидетельствует о постдиктивной обратной связи. Анализ информационной связности показал, что источником этой обратной связи является верхняя височная кора (Superior Temporal Cortex, STC). Мы заключаем, что постдиктивный монтаж восприятия отражается в V1 и реализуется посредством петли задержанной обратной связи с вышестоящей сенсорной корой. Это расширяет роль V1 в перцептивных вычислениях: помимо получения сенсорных входов, отражающих настоящее, и предсказаний будущего, она участвует в ретроспективном пересмотре восприятия.&lt;/p&gt;\n&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Восприятие — это процесс, посредством которого мозг пытается сделать вывод о текущем неизвестном состоянии мира на основе комбинации сенсорной информации и предположений, извлеченных из прошлого опыта. Однако мало что известно о том, как мозг интегрирует эти два источника информации во времени. Научный диалог до сих пор был сосредоточен главным образом на том, как мозг интегрирует предыдущую информацию в восприятие, то есть на предсказании. Постдикция, однако, представляет собой взаимодополняющее явление, при котором информация, поступающая позже стимула — в пределах временного окна в несколько сотен миллисекунд — влияет на то, как он воспринимается. Постдикция показывает нам, что — вопреки интуиции — наше восприятие не является прямой трансляцией внешнего мира, а скорее конструируется в мозге постфактум. Изучая нейронные механизмы постдикции, мы можем пролить свет на то, как мозг порождает наш осознанный опыт.&lt;/p&gt;\n&lt;p&gt;Как возможно, чтобы восприятие могло изменяться под действием позже поступающей информации? На каком-то этапе сенсорной обработки должна существовать задержка, которая позволяет более поздней информации догнать более ранние сигналы, создавая временное окно, в котором оба источника могут быть интегрированы. Для объяснения этой задержки были предложены две правдоподобные, но еще не проверенные теории. Теория прямой связи (feedforward) основана на том факте, что временное окно интеграции нейронов увеличивается вдоль корковой иерархии, позволяя более поздней информации догонять более ранние сигналы в зонах сенсорной обработки высшего порядка (например, в височной доле). Теория обратной связи, с другой стороны, предполагает, что возвратная обратная связь вниз по корковой иерархии предоставляет возможность более ранним сигналам подвергнуться влиянию более поздней информации в первичной сенсорной коре. То есть, после первоначального прямого потока сенсорные сигналы передаются обратно в первичную сенсорную кору с задержкой за счет взаимных связей из высших сенсорных зон, позволяя более поздней информации модулировать их. Различение этих теорий позволило бы понять, как наш перцептивный опыт конструируется в корковой иерархии.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Теория прямой связи предполагает интеграцию в высших зонах коры, тогда как теория обратной связи отводит ключевую роль первичной сенсорной коре, что проверяется в данном исследовании.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Одно из ключевых различий между двумя теориями заключается в роли первичной сенсорной коры в постдиктивном восприятии. А именно, теория обратной связи предсказывает, что первичная сенсорная кора должна отражать постдиктивно пересмотренное восприятие, в то время как теория прямой связи предсказывает, что этого не будет, поскольку интеграция происходила бы только в сенсорных областях высшего порядка с расширенными временными рецептивными полями. Вне контекста постдикции предполагалось, что обратная связь с сенсорной корой играет важную роль в конструировании восприятия. Например, было показано, что ретинотопически специфичная обратная связь с первичной зрительной корой (V1) лежит в основе иллюзии Каниццы. Мы выдвинули гипотезу, что эта ключевая роль обратной связи с сенсорной корой распространяется и на постдиктивное восприятие.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ретинотопическая специфичность означает сохранение топографической карты сетчатки на уровнях зрительных зон мозга, где соседние нейроны отвечают за соседние точки поля зрения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для проверки этой гипотезы мы использовали две надежные кросс-модальные постдиктивные иллюзии. В одной иллюзии перцепт зрительной вспышки индуцируется слуховым стимулом в ретинотопическом месте, которое в остальном не стимуллируется, а во второй иллюзии предъявленная вспышка перцептивно подавляется отсутствием слухового стимула (Рис. 1А). Вместе эти иллюзии представляют собой идеальную тестовую среду для исследования потенциальных постдиктивных сигналов в V1, поскольку они позволяют полностью разделить иллюзорные перцепты и ретинальные входы (Рис. S1). Мы выдвинули гипотезу, что иллюзия будет отражаться в глубоких слоях V1 в результате обратной связи из мультисенсорных корковых областей (то есть верхней височной коры). Мы проверили эту гипотезу, измеряя BOLD-сигналы с разрешением по слоям с помощью ультравысокопольной фМРТ 7Т (воксели 0.8 мм) в сочетании с картированием рецептивных полей популяции (pRF) для выделения области V1, которая была настроена на положение иллюзорной вспышки.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi-f1.jpg\" alt=\"Рисунок 1. Экспериментальная парадигма и поведенческие результаты. A) Вверху: предъявление двух пар аудиовизуальных стим\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Экспериментальная парадигма и поведенческие результаты. A) Вверху: предъявление двух пар аудиовизуальных стимулов с дополнительным звуком между ними приводит к восприятию дополнительного визуального стимула; внизу: предъявление двух пар аудиовизуальных стимулов с дополнительной вспышкой между ними приводит к подавлению этой дополнительной вспышки (адаптировано из Stiles et al. (5)). B) Доля проб, в которых участники сообщали, что видели три вспышки вместо двух, раздельно для различных условий. Визуальное отображение условий см. на рис. S1. Черные полосы обозначают стандартную ошибку среднего (SEM). *** p &amp;lt; 0,001.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на двух конкретных кросс-модальных иллюзиях и методе фМРТ высокого разрешения, что требует осторожности при экстраполяции выводов на все виды восприятия.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Предваряя наши результаты, мы обнаружили свидетельства того, что постфактум сконструированный перцептивный контент отражается в глубоких слоях V1, что подтверждает модель постдикции, основанную на обратной связи. Эти результаты согласуются с тем, что перцептивная информация в первичной зрительной коре постфактум корректируется перцептивным выводом.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"rezultaty-povedencheskih-eksperimentov-i-nejrovizualizacii\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#rezultaty-povedencheskih-eksperimentov-i-nejrovizualizacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты поведенческих экспериментов и нейровизуализации&lt;/span&gt;&lt;/a&gt;Результаты поведенческих экспериментов и нейровизуализации&lt;/h4&gt;\n&lt;p&gt;Мы успешно вызвали две аудиовизуальные постдиктивные иллюзии во время фМРТ-сканирования и валидировали контрольные условия (Рис. 1B). В условии «Иллюзорная вспышка» средний звуковой сигнал вызывал иллюзорную вспышку: испытуемые сообщали о трех вспышках в 0,83 ± 0,04 (среднее ± стандартная ошибка среднего) случаев, несмотря на предъявление только двух. Эта доля была значимо выше, чем в попытках без дополнительного звука (т.е. в условии «Без вспышки», 0,08 ± 0,02; W(22) = 3,615, p &amp;lt; 0,001). Во втором иллюзорном условии, «Подавленная вспышка», отсутствие звука подавляло восприятие реальной вспышки: о трех вспышках сообщалось лишь в 0,25 ± 0,07 случаев, что значимо меньше, чем в попытках с тремя вспышками и тремя звуками (т.е. в условии «Реальная вспышка», 0,92 ± 0,03; W(22) = 3,601, p &amp;lt; 0,001). Участники были крайне уверены в своих как верных, так и иллюзорных перцептах (Рис. S2).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Поведенческие тесты подтвердили эффективность индукции иллюзий: в условии «Иллюзорная вспышка» участники видели три вспышки вместо двух в 83% случаев, а в условии «Подавленная вспышка» восприятие реальных вспышек подавлялось до 25%.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы задались вопросом, отражаются ли эти постдиктивные иллюзии в паттернах BOLD-активности в слоях V1. Для каждой постдиктивной иллюзии мы вычислили «перцептивное сходство паттернов», определяемое как корреляция между паттерном BOLD-активности, вызванным иллюзией, и паттерном активности, вызванным соответствующим верным перцептом (т.е. «Иллюзорная вспышка» × «Реальная вспышка» и «Подавленная вспышка» × «Без вспышки»), за вычетом корреляции с паттерном, вызванным соответствующим ретинальным входом (т.е. «Иллюзорная вспышка» × «Без вспышки» и «Подавленная вспышка» × «Реальная вспышка»; визуализацию см. на Рис. 1A). Эта метрика количественно оценивала, была ли активность, вызванная иллюзией, более схожей с восприятием того же объекта (перцептивное сходство паттернов &amp;gt; 0) или с получением того же входного сигнала на сетчатку (перцептивное сходство паттернов &amp;lt; 0). Мы рассчитали этот показатель для обеих иллюзий, ограничив анализ вокселями V1, имеющими рецептивное поле в иллюзорной локации (т.е. в месте расположения средней вспышки).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BOLD-сигнал (Blood-Oxygen-Level-Dependent) — показатель активности мозга, основанный на изменении уровня оксигенации крови. Перцептивное сходство паттернов позволяет понять, кодирует ли мозг то, что человек «видит» (иллюзию), или то, что физически попадает на сетчатку.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Этот анализ показал, что постдиктивные иллюзии по-разному влияют на различные слои V1 (двухфакторный дисперсионный анализ с повторными измерениями с факторами «Слой» и «Тип иллюзии», основной эффект слоя: F(1,21) = 4,588, p = 0,016; Рис. 2A). В частности, перцептивное сходство паттернов было сильнее в глубоких слоях, чем в средних (t(21) = 2,735, p = 0,012). Другие сравнения слоев не были значимыми (глубокие против поверхностных: t(21) = 1,755, p = 0,093; средние против поверхностных: t(21) = 1,489, p = 0,151). В сумме, только глубокие слои показали значимый положительный эффект перцептивного сходства паттернов (односторонний t-критерий, t(21) = 2,027, p = 0,028; Рис. 2), тогда как в других слоях этот перцептивный эффект отсутствовал (средние: t(21) = -1,516, p = 0,144; поверхностные: t(21) = 0,414, p = 0,683), что доказывает, что восприятие постдиктивной иллюзии влияет на активность глубоких слоев. Этот эффект отсутствовал в вокселях V1, настроенных на контрольную ретинотопическую локацию (все слои p &amp;gt; 0,05; Рис. 2B). Этот поразительный эффект демонстрирует, что глубокие слои V1 репрезентируют постдиктивно выведенные перцепты, а не просто отражают ретинальные входы.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi-f2.jpg\" alt=\"Рисунок 2. Сходство перцептивных паттернов в паттернах активности BOLD для вокселей, настроенных на местоположение средн\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2. Сходство перцептивных паттернов в паттернах активности BOLD для вокселей, настроенных на местоположение средней вспышки (A) и контрольное местоположение (B), в разрезе слоев V1, усредненное по обеим постдиктивным иллюзиям. Положительные значения указывают на то, что паттерны активности, вызванные иллюзиями, были более похожи на паттерны активности, вызванные стимулами, индуцирующими тот же перцепт (например, Иллюзорная вспышка × Реальная вспышка), в то время как отрицательные значения указывают на большее сходство с условиями с идентичным ретинальным стимулом, но другим перцептом (например, Иллюзорная вспышка × Нет вспышки). Планки погрешностей обозначают стандартную ошибку среднего (SEM) по участникам. * p &amp;lt; 0,05.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Глубокие слои V1 демонстрируют значимое перцептивное сходство паттернов (p=0,028), что указывает на кодирование иллюзорного восприятия, а не физического стимула.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Две иллюзии значимо не различались по своему влиянию на активность V1 (ANOVA, основной эффект «Тип иллюзии»: F(1,21) = 2,457, p = 0,132; взаимодействие «Слой» и «Тип иллюзии»: F(1, 21) = 1,999, p = 0,148), что предполагает, что постдиктивное создание и подавление вспышек модулировали активность V1 в схожей степени. То есть в обоих случаях активность глубоких слоев V1 была ближе к воспринимаемому стимулу, чем к стимулу, предъявленному на сетчатку. Для проверки этого мы проанализировали результаты для двух иллюзий отдельно. Как и ожидалось, активность в глубоких слоях V1 во время условия «Иллюзорная вспышка» была более похожа на активность, вызванную «Реальной вспышкой», чем на активность, вызванную «Без вспышки» (односторонний t-критерий: t(22) = 1,814, p = 0,042; Рис. 3A). Этот эффект был сильнее в глубоких слоях, чем в средних (t(22) = 3,644, p = 0,001). В средних слоях наблюдалась тенденция в противоположном направлении (двусторонний t-критерий: t(22) = -2,045, p = 0,053), что согласуется с тем фактом, что средние слои получают прямые сенсорные сигналы (feedforward), но не сигналы обратной связи (feedback). Паттерны активности в поверхностных слоях не позволяли четко различить перцептивное и ретинальное сходство (t(22) = 0,108, p = 0,457), возможно, из-за того, что они содержат смесь сигналов прямого и обратного потока (см. Обсуждение). Важно отметить, что эти эффекты были специфичны для вокселей с рецептивным полем в локации иллюзорной вспышки и отсутствовали для вокселей с рецептивным полем в контрольной области над точкой фиксации (все слои p &amp;gt; 0,05; Рис. 3B).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi-f3.jpg\" alt=\"Рисунок 3. Сходство перцептивных паттернов в паттернах активности BOLD для вокселей, настроенных на вторую вспышку и кон\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3. Сходство перцептивных паттернов в паттернах активности BOLD для вокселей, настроенных на вторую вспышку и контрольное местоположение, в разрезе слоев V1 для иллюзии «Иллюзорная вспышка». A) Сходство перцептивных паттернов вокселей, настроенных на местоположение иллюзорной вспышки. Положительные значения указывают на то, что паттерны активности были более похожи на паттерны активности, вызванные стимулами, индуцирующими тот же перцепт (Реальная вспышка), в то время как отрицательные значения указывают на большее сходство с условиями с идентичным ретинальным стимулом, но другим перцептом («Нет вспышки»). B) Тот же анализ для вокселей, настроенных на контрольное ретотопическое местоположение. Планки погрешностей обозначают стандартную ошибку среднего (SEM) по участникам. * p &amp;lt; 0,05; ** p &amp;lt; 0,01.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Мы провели тот же анализ на испытаниях с «подавленной вспышкой» (Рис. 4). Следует отметить, что это условие обеспечивает менее строгую проверку наших гипотез по двум причинам. Во-первых, иллюзорное отсутствие перцепта происходит при наличии ретинального входа, то есть сильного восходящего (bottom-up) потока, и нейронные сигналы в V1 представляют собой смесь ретинальных входов и перцептивного отсутствия, а не «чистый» инференциальный сигнал, как в условии с иллюзорной вспышкой. Во-вторых, эта иллюзия была менее сильной и была успешной в 77% испытаний (по сравнению с 83% для испытаний с иллюзорной вспышкой; χ²(2391) = 24.83, p &amp;lt; .001). Фактически, один участник был исключен из этого анализа из-за недостаточного количества иллюзий подавленной вспышки (см. Методы). Несмотря на это, мы обнаружили, что паттерны активности в глубоких слоях V1 были более похожи на таковые в испытаниях, в которых средняя вспышка не предъявлялась (т. е. две вспышки и два звуковых сигнала, аналогичный перцептивный результат), чем на таковые, в которых средняя вспышка предъявлялась (т. е. три вспышки и три звуковых сигнала, тот же ретинальный вход; односторонний t-тест: t(21) = 1.926, p = .034; Рис. 4A). Этот эффект, опять же, отсутствовал в вокселях глубоких слоев, настроенных на контрольное местоположение (все слои p &amp;gt; .05; Рис. 4B). Средний и поверхностный слои не показали такого же эффекта (средний: t(21) = .516, p = .695; поверхностный: t(21) = -0.568, p = .288), а средние слои также существенно не отличались от поверхностных или глубоких слоев (глубокие против средних: t(21) = -1.682, p = .107; поверхностные против средних: t(21) = -0.945, p = .356).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi-f4.jpg\" alt=\"Рисунок 4. Сходство перцептивных паттернов в паттернах активности BOLD для вокселей, настроенных на вторую вспышку и кон\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4. Сходство перцептивных паттернов в паттернах активности BOLD для вокселей, настроенных на вторую вспышку и контрольное местоположение, в разрезе слоев V1 для иллюзии «Подавленная вспышка» (слева); ROI указана на экране относительно воспринимаемых стимулов (справа). A) Сходство перцептивных паттернов вокселей, настроенных на местоположение иллюзорной вспышки. Положительные значения указывают на то, что паттерны активности были более похожи на паттерны активности, вызванные стимулами, индуцирующими тот же перцепт («Нет вспышки»), в то время как отрицательные значения указывают на большее сходство с условиями с идентичным ретинальным стимулом, но другим перцептом («Реальная вспышка»). B) Тот же анализ для вокселей, настроенных на контрольное ретотопическое местоположение. Планки погрешностей обозначают стандартную ошибку среднего (SEM) по участникам. * p &amp;lt; 0,05.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В глубоких слоях V1 паттерны активности при подавленной вспышке напоминали таковые при физическом отсутствии вспышки (t(21) = 1.926, p = .034), несмотря на наличие ретинального стимула.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Вызываются ли эти эффекты сходства паттернов иллюзорными перцептами, активирующими ту же область коры, что и веридикальные перцепты? Чтобы проверить это, мы исследовали, затронута ли общая амплитуда BOLD (а не паттерны активности) иллюзорными перцептами (Рис. S3). Во-первых, мы проверили, повышает ли условие «Иллюзорная вспышка» активность BOLD по сравнению с контрольным условием «Без вспышки» — опять же, только для вокселей, рецептивное поле которых охватывает местоположение средней вспышки. Мы не обнаружили подтверждения этому («Иллюзорная вспышка» &amp;gt; «Без вспышки»: t(22) = -.316, p = .623; Рис. S3A), в то время как реальная вспышка действительно увеличивала BOLD-активность («Реальная вспышка» &amp;gt; «Без вспышки»; t(22) = 2.184, p = .02), что подтверждает валидность нашего подхода. И наоборот, если восприятие отражается в общей амплитуде BOLD, условие «Подавленная вспышка» должно вызывать более низкую амплитуду BOLD, чем «Реальная вспышка», точно так же, как и условие «Без вспышки». Мы также не обнаружили здесь подтверждений изменения амплитуды, управляемого восприятием («Подавленная вспышка» &amp;lt; «Реальная вспышка»: t(21) = -1.306, p = .897). Не было также доказательств повышения или понижения BOLD-сигнала именно в глубоких слоях, где присутствовали эффекты сходства паттернов (Рис. S3B; «Иллюзорная вспышка» &amp;gt; «Без вспышки»: t(22) = -1.076, p = .853; «Подавленная вспышка» &amp;lt; «Реальная вспышка»: t(21) = -.907, p = .187; Рис. S3). В совокупности эти результаты показывают, что субъективное восприятие отражается в паттернах активности, но не в общей амплитуде сигнала.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BOLD-амплитуда (Blood-Oxygen-Level Dependent) — показатель изменения уровня оксигенации крови в мозге, отражающий общую активность нейронов в зоне, в то время как анализ паттернов (MVPA) оценивает тонкиe пространственные распределения сигналов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Как мы можем согласовать эти эффекты сходства паттернов в глубоких слоях с отсутствием эффекта общей BOLD-амплитуды (Рис. 3D и 4D)? Сосредоточившись на условии «Иллюзорная вспышка», одним из потенциальных объяснений может быть то, что иллюзорная вспышка приводит к усилению нейронного сигнала в вокселях, настроенных на точное местоположение иллюзорной вспышки, окруженных подавлением с обеих сторон (например, из-за латерального торможения). Это может привести к нулевому результирующему сигналу в области между двумя реальными вспышками при сохранении ретотопически точной активности, индуцированной иллюзией. Если бы это было верно, следовало бы ожидать отрицательной корреляции между индуцированной иллюзией BOLD-амплитудой и расстоянием центра рецептивного поля вокселя от местоположения иллюзорной вспышки в глубоких слоях V1. Мы проверили эту постфактум гипотезу, рассчитав корреляцию между BOLD-амплитудой и абсолютным горизонтальным расстоянием между центром местоположения средней вспышки и центром pRF вокселей. Действительно, мы обнаружили отрицательную корреляцию для условия «Иллюзорная вспышка» (r = -.11), но не для условия «Без вспышки» (r = -.01) в глубоких слоях V1 («Иллюзорная вспышка» против «Без вспышки»; t(22) = 1.840, p = .039). Несмотря на то, что анализ проводился постфактум, эти результаты согласуются с тем, что иллюзия индуцирует высоко ретотопически специфичную нейронную активность, окруженную торможением [15, 23].&lt;/p&gt;\n&lt;p&gt;Какая область мозга может быть источником этой индуцированной обратной связью активности в V1? Верхняя височная кора (STC) представляет собой главный кандидат, учитывая ее роль в мультисенсорной интеграции и предполагаемую роль в поствдикции. Мы дополнительно исследовали гиппокамп в качестве поисковой мишени, учитывая его роль в представлении предсказательных последовательностей. Мы рассчитали информационную связность, чтобы установить, разделяется ли перцептивная информация между областями в ходе испытаний.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Информационная связность — это метод анализа фМРТ-данных, который позволяет оценить, насколько паттерны активности в разных областях мозга статистически связаны между собой на уровне конкретных стимулов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Поразительно, но мы обнаружили, что для условия «Иллюзорная вспышка» сходство перцептивных паттернов в верхней височной коре коварировало сильнее с вокселями глубоких слоев V1, чем со средними слоями, настроенными на положение последовательности вспышек, то есть на три позиции вспышек (двусторонний t-тест; t(22) = 2,562, p = 0,018; Рис. 5A). Это не относилось к контрольному ретинотопическому положению (двусторонний t-тест; t(22) = -1,251, p = 0,225; Рис. 5B). Этот эффект существенно не проявлялся для поверхностных слоев («вспышка 123», поверхностные и средние слои: t(22) = 1,659, p = 0,112; контроль: t(22) = -0,654, p = 0,519).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi-f5.jpg\" alt=\"Рисунок 5. Информационная связность (IC) между STC и слоями V1 для иллюзии «Иллюзорная вспышка». A) IC между STC и воксе\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5. Информационная связность (IC) между STC и слоями V1 для иллюзии «Иллюзорная вспышка». A) IC между STC и вокселями V1, настроенными на последовательность вспышек (объединение левого, среднего и правого мест вспышек) слева. Более высокие значения обозначают большее разделяемое сходство перцептивных паттернов между пробами. Планки погрешностей обозначают стандартную ошибку среднего (SEM) по участникам. * p &amp;lt; 0,05. B) Тот же анализ для вокселей, настроенных на контрольное местоположение. C) Схематический рисунок того, как V1 сначала обрабатывает предъявленные визуальные стимулы, но позже может получить обновленный перцепт от STC.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Верхняя височная кора передает информацию об иллюзорных вспышках именно в глубокие слои V1 (t(22) = 2,562, p = 0,018), подтверждая гипотезу обратной связи.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Данный результат согласуется с гипотезой о том, что STC передает информацию об апостериорно умозаключенных иллюзорных вспышках обратно в V1. Заметим, что этот эффект отсутствовал для иллюзии «Подавленная вспышка» («вспышка 123»: p &amp;gt; 0,05 для сравнения глубоких со средними и поверхностных со средними; контроль: p &amp;gt; 0,05 для глубоких со средними и поверхностных со средними), что возможно связано с комбинацией более низкой подверженности иллюзии и тем фактом, что нисходящие и восходящие сигналы в этом условии разделены менее четко (см. выше). Также не наблюдалось специфичной для слоев информационной связности между V1 и гиппокампом во время иллюзии («вспышка 123» глубокие против средних: t(21) = 0,566, p = 0,578; «вспышка 123» поверхностные против средних: t(21) = 1,265, p = 0,220).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффект не был обнаружен для другой разновидности иллюзии («Подавленная вспышка»), что указывает на зависимость результатов от параметров эксперимента и силы проявления самой иллюзии.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;p&gt;В данном исследовании мы изучили нейронные механизмы постдикции — явления, при котором восприятие стимула формируется под воздействием последующей информации. Мы обнаружили, что иллюзии постдиктивного характера индуцируют в глубоких слоях V1 паттерны активности, которые напоминают паттерны, вызываемые истинным восприятием (в отличие от эквивалентного ретинального ввода). Примечательно, что это справедливо для двух противоположных постдиктивных эффектов: индуцирования и подавления вспышек, что подтверждает универсальность данного нейронного механизма. Постдиктивные эффекты отражались только в вокселях, настроенных на локацию иллюзорной вспышки, демонстрируя ретинотопически специфичный нейронный коррелят иллюзорных перцептов. Данный эффект отсутствовал в средних слоях V1, что согласуется с тем фактом, что средние слои преимущественно получают восходящий ретинальный ввод и лишены нисходящей обратной связи.&lt;/p&gt;\n&lt;p&gt;Эффект также существенно не проявлялся в поверхностных слоях, которые получают сигналы обратной связи. Помимо того, что сигнал может размываться за счет входящих прямых стимулов, как обсуждалось выше, возможно, что тип исследуемой здесь обратной связи целенаправленно воздействует на глубокие кортикальные слои, поскольку он поступает из относительно удаленных источников, как сообщалось для других сигналов обратной связи, таких как предсказание, заполнение поверхности и ментальные образы. В качестве альтернативы предполагается, что нейроны глубоких слоев представляют перцептивные гипотезы (в данном случае — предполагаемые визуальные вспышки), в то время как нейроны поверхностных слоев реагируют на несоответствия между этими гипотезами и входящими данными (в данном случае — разницу между предполагаемыми и предъявленными вспышками), то есть на ошибки прогнозирования.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Постдиктивные эффекты отражаются в глубоких слоях первичной зрительной коры (V1) и зависят от ретинотопического расположения, что указывает на нисходящую обработку информации, а не на изменение общей амплитуды сигнала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Предъявление визуальных стимулов обычно вызывает пик нейронной активности в сенсорной коре, что подтвердилось и для реальных вспышек, предъявленных в текущем исследовании. Однако для изучаемых здесь иллюзорных перцептов наблюдалась тесная связь между восприятием и паттерном нейронной активности, но не ее общей амплитудой. Этот результат согласуется с исследованиями внутричерепной ЭЭГ, показывающими, что устойчивое восприятие отражается в паттернах нейронной активности, а не в амплитуде ответа. Следует отметить, что апостериорный анализ показал, что индуцированный иллюзорной вспышкой паттерн активности в V1 может фактически отражать локальное увеличение амплитуды с высокой пространственной специфичностью, но закодированное более разреженно, чем ретинотопически предъявленная вспышка, и, возможно, окруженное торможением. В совокупности данные по иллюзиям, слоям и ретинотопическим локациям убедительно свидетельствуют в пользу модели обратной связи временной интеграции восприятия, в которой глубокие слои первичной сенсорной коры получают постдиктивно выводимую перцептивную информацию через соединения обратной связи.&lt;/p&gt;\n&lt;p&gt;Эти результаты резко расходятся с традиционным представлением о V1 как о пассивном экстракторе признаков, который обрабатывает сенсорную информацию, поступающую через сетчатку, и передает ее дальше в вышестоящие зрительные зоны. Многочисленные данные последних десятилетий продемонстрировали, что активность в V1 может модулироваться процессами нисходящей регуляции, такими как внимание и ожидание. Однако эти работы были сосредоточены почти исключительно на том, как подготовительные процессы обратной связи модулируют ранние нейронные ответы. Наши результаты, демонстрирующие роль постдиктивной обратной связи для V1, предполагают, что эта зона по-прежнему вовлечена в перцептивный вывод на поздней стадии сенсорной обработки, далеко за пределами первоначального прямого потока. Эта роль предполагает, что ранняя зрительная кора тесно отслеживает визуальный перцептивный опыт даже в отсутствие ретинальной стимуляции.&lt;/p&gt;\n&lt;p&gt;Одним из открытых вопросов является то, отражает ли V1 также временной порядок восприятия. Хотя иллюзорная вспышка выводится только после того, как все реальные вспышки (и тоны) были обработаны, она воспринимается как происходящая одновременно со вторым тоном и предшествующая третьей паре тон-вспышка. Это приводит к различению между временем обработки и временем восприятия. Учитывая отсутствие временного разрешения у фМРТ, мы в настоящее время не можем сказать, какая из этих временных шкаляр отражается в V1. Будущие исследования с использованием методов с высоким временным разрешением, таких как ЭЭГ/МЭГ, должны проверить, отражает ли активность в V1 время восприятия или время обработки, либо оба параметра.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;фМРТ измеряет уровень кислорода в крови с высоким пространственным разрешением, но медленно реагирует во времени (секунды), тогда как методы вроде ЭЭГ регистрируют электрическую активность мозга с миллисекундной точностью.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы выдвинули гипотезу, что мультисенсорные области, расположенные выше в иерархии коры, интегрируют аудиовизуальные сигналы и передают информацию, полученную в результате апостериорного перцептивного вывода, обратно в V1, аналогично прогностическому кодированию. В соответствии с этим мы обнаружили, что сходство перцептивных паттернов в STC и глубоких слоях V1 кофлуктуирует, подразумевая, что STC действительно может передавать постдиктивно выводимую информацию в V1, пересматривая ранние сенсорные представления. Область STC имеет благоприятное расположение для выполнения этой функции, учитывая ее роль в мультисенсорной интеграции. Наряду с участием в аудиовизуальных предсказаниях, это указывает на ее роль в оценке и обновлении сенсорного ввода. Что важно для постдикции, STC обладает не только большими пространственными рецептивными полями, но и большими временными рецептивными полями. Вместе эти свойства позволяют STC отслеживать богатую пространственно-временную информацию, необходимую для постдиктивного вывода, что согласуется с предыдущими предположениями. Недавние работы показывают, что иллюзии, использованные в данном исследовании, лучше всего объясняются моделью постдиктивного причинного вывода. Учитывая обсужденные выше нейронные свойства, STC может выполнять эту функцию. Этот вопрос, однако, остается открытым для будущих исследований.&lt;/p&gt;\n&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;p&gt;Постдиктивные эффекты демонстрируют, что восприятие не является прямой трансляцией реальности, а представляет собой апостериорный монтаж. Здесь мы показываем, что этот монтаж влияет на нейронные представления в первичной зрительной коре в результате обратной связи от вышестоящей мультисенсорной коры. Таким образом, данное исследование проливает свет на то, как наш субъективный опыт окружающего мира конструируется посредством перцептивного вывода в пространстве и времени.&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"uchastniki\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#uchastniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Участники&lt;/span&gt;&lt;/a&gt;Участники&lt;/h4&gt;\n&lt;p&gt;Семьдесят пять добровольцев обоих полов с нормальным зрением и слухом дали письменное информированное согласие и приняли участие в исследовании. Участники исключались после поведенческого скрининга, если они давали менее 85% правильных ответов в контрольных пробах или если их восприимчивость к индуцированной иллюзии составляла менее 40%. Двадцать четыре участника прошли сессию нейровизуализации. После нейровизуализации участники также исключались, если они не соответствовали строгим критериям движения головы: максимум 10 движений на 1 мм или более между последовательными функциональными объемами. Если у участников было менее десяти успешных иллюзий в ходе сканирования для конкретной иллюзии, участник исключался из анализа этой иллюзии. Двадцать три участника (четверо мужчин, средний возраст 23,6 ± 4,0 года) были включены в анализ иллюзии «Иллюзорная вспышка» (Illusory Flash) с учетом этих критериев, при этом один участник был исключен из-за движения головы. Двадцать два участника были включены в анализ иллюзии «Подавленная вспышка» (Suppressed Flash), так как один дополнительный участник не достиг порога восприимчивости к иллюзии в сканере. Участники получали денежную компенсацию в размере 12 фунтов стерлингов в час за свое время. Исследование было одобрено Комитетом по этике исследований UCL.&lt;/p&gt;\n&lt;h4 id=\"stimuly\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#stimuly\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Стимулы&lt;/span&gt;&lt;/a&gt;Стимулы&lt;/h4&gt;\n&lt;p&gt;Стимулы были созданы с использованием MATLAB 2019a (MathWorks, Натик, Массачусетс, США) и Psychophysics Toolbox версии 3.&lt;/p&gt;\n&lt;p&gt;Во время поведенческого скрининга участники сидели перед компьютером, где стимулы отображались на мониторе Dell Optiplex 3070. Операционная система: Windows 10 64-бит. Монитор: Dell UltraSharp U2415 с разрешением 1920 × 1200 и частотой обновления 60 Гц. Звук воспроизводился через две колонки, расположенные по обе стороны от компьютера.&lt;/p&gt;\n&lt;p&gt;В МРТ-сканере визуальные стимулы отображались на экране обратной проекции с использованием проектора Epson EB-L1100U (разрешение 1920 × 1200, 355 x 220 мм, частота обновления 60 Гц) на сером фоне. Участники наблюдали за визуальным дисплеем через зеркало, установленное на головной катушке, с расстояния 113 см, что обеспечивало поле зрения 17,9° по горизонтали и 11,1° по вертикали. Системы Etymotic Ear-Tone ER3A были адаптированы для представления слуховых стимулов в условиях МРТ. Мы отрегулировали громкость слуховых стимулов так, чтобы участники могли четко слышать их на фоне шума сканера, не испытывая дискомфорта от громкости. Мы проверили синхронизацию представления аудиовизуальных стимулов с помощью осциллографа.&lt;/p&gt;\n&lt;p&gt;Стимулы были адаптированы из [5]. Визуальные стимулы представляли собой белые прямоугольники (или «вспышки») на темно-сером фоне, представленные на 4,3° ниже точки фиксации в форме мишени. Вспышки имели угловой размер 0,28° × 1,2° (ширина × длина) каждая. Горизонтальное расстояние между центрами вспышек составляло 2,13°, вспышки демонстрировались поочередно слева направо в течение 16,6 мс каждая с интервалом 52 мс между ними. Слуховые стимулы представляли собой тональные сигналы частотой 800 Гц длительностью 10 мс каждый, модулированные прямоугольной волной. Слуховые тона предъявлялись синхронно с визуальными вспышками с учетом задержки представления проектора, используемого в МРТ-сканере. Перед представлением стимула 100-мс окно оповещало участника, меняя цвет центральной точки мишени фиксации со светло-серого на темно-серый. После представления стимула у участников было 2000 мс на каждой пробе, чтобы сообщить, видели ли они две или три вспышки, и насколько они уверены в своем ответе (4: очень уверен, 3: довольно уверен, 2: не очень уверен, 1: совсем не уверен). Визуальные подсказки для ответа не предоставлялись, вместо этого участников заранее проинструктировали и обучили отвечать таким образом. Если один из ответов отсутствовал, центральная точка мишени кратковременно мигала красным. Наконец, центральная точка становилась светло-серой, указывая на завершение пробы. Перед следующей пробой следовал джиттерный межстимульный интервал (ITI) длительностью 1600 мс, 3100 мс или 4600 мс (вероятность 50%, 30% и 20% соответственно).&lt;/p&gt;\n&lt;h4 id=\"eksperimentalnyj-dizajn\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#eksperimentalnyj-dizajn\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Экспериментальный дизайн&lt;/span&gt;&lt;/a&gt;Экспериментальный дизайн&lt;/h4&gt;\n&lt;p&gt;Мы использовали парадигму «Аудиовизуальный кролик» (Audiovisual Rabbit) [5] для индукции двух взаимодополняющих аудиовизуальных иллюзий путем сочетания вспышек со звуками (Рис. 1). Общим для этих иллюзий является то, что при успешном выполнении наличие или отсутствие второго звукового сигнала определяет то, что воспринимается. В работе [5] продемонстрирована постдиктивная природа этих иллюзий; например, иллюзия возникает только в том случае, если представлен третий звуковой сигнал, в то время как иллюзорная вспышка воспринимается одновременно со вторым звуковым сигналом, а местоположение третьей вспышки определяет местоположение иллюзорной второй вспышки. Эти иллюзии дают возможность изолировать нейронную активность, вызванную иллюзией, от любой ретинальной информации, особенно иллюзорную вспышку, которая воспринималась при отсутствии какого-либо соответствующего ретинального входа.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Постдикция — это феномен, при котором восприятие события меняется под влиянием последующего стимула.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы добавили два контрольных условия для ортогонализации сенсорного входа и восприятия в дизайне 2x2 (Рис. SN). В одном условии средняя вспышка и средний тон были опущены, при этом предъявлялись только две пары вспышка-звук («Без вспышки» / No Flash), тогда как в другом контрольном условии предъявлялись три пары вспышка-звук («Реальная вспышка» / Real Flash).&lt;/p&gt;\n&lt;h4 id=\"procedura\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#procedura\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Процедура&lt;/span&gt;&lt;/a&gt;Процедура&lt;/h4&gt;\n&lt;p&gt;Участники сначала прошли поведенческую практику и скрининг в первый день. Здесь участники читали инструкции с экрана компьютера, которые объясняли цель эксперимента, не раскрывая сути иллюзий: фокусироваться на вспышках, фиксируя взгляд на центре экрана. Все четыре условия предъявлялись одинаково часто, чередуясь в псевдослучайном порядке. Участники выполнили два блока по 32 тренировочные пробы, получая вербальную обратную связь после каждого блока в редких случаях, когда они часто не давали ответов или отвечали слишком поздно. Затем они выполнили четыре серии по 52 пробы, всего 26 на каждое условие. Те, кто был восприимчив к иллюзии (см. критерии в разделе «Участники»), были приглашены на сессию нейровизуализации.&lt;/p&gt;\n&lt;p&gt;Во время сессии фМРТ тот же эксперимент был представлен в виде четырех прогонов по 104 испытания в каждом. Дополнительно мы провели четыре прогона картирования pRF. В этом случае участники фиксировали взгляд на центральной точке фиксации, в то время как полосы черно-белого шахматного стимула перемещались по экрану в радиусе 5,5 градусов от точки фиксации. В частности, мы использовали набор стимулов «8 полос» в MrVista, которые предъявлялись в четырех прогонах по 5,5 минут каждый.&lt;/p&gt;\n&lt;h4 id=\"analiz-povedeniya\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#analiz-povedeniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ поведения&lt;/span&gt;&lt;/a&gt;Анализ поведения&lt;/h4&gt;\n&lt;p&gt;Мы проверяли успешность визуальных иллюзий, сравнивая их с условием с той же ретинальной стимуляцией, но отличающимся по звуку, что вызывает разницу в восприятии. Для условия «Иллюзорная вспышка» мы сравнивали, было ли зарегистрировано больше вспышек, чем в условии «Без вспышки», а для иллюзии «Подавленная вспышка» мы оценивали, было ли зарегистрировано меньше вспышек, чем в условии «Реальная вспышка». Оба анализа проводились с помощью двустороннего критерия суммы рангов Уилкоксона для данных с распределением, отличным от нормального. Мы также количественно оценили уровень уверенности участников в своих перцептах, как реальных, так и иллюзорных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;pRF (population receptive field) — метод картирования зрительной коры, позволяющий определить, какая область поля зрения активирует конкретный воксель мозга.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"protokol-skanera-i-posledovatelnosti\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#protokol-skanera-i-posledovatelnosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Протокол сканера и последовательности&lt;/span&gt;&lt;/a&gt;Протокол сканера и последовательности&lt;/h4&gt;\n&lt;p&gt;МРТ-изображения были получены на сканере 7T MAGNETOM Terra (Siemens Healthcare, Эрланген, Германия) с головной катушкой, оснащенной 8 каналами передачи и 32 каналами приема (Nova Medical, Уилмингтон, США), в Лаборатории функциональной визуализации (Университетский колледж Лондона). Функциональные изображения части мозга были собраны с помощью протокола 3D EPI (взвешенные по T2*, время сбора объема = 3,264 секунды, TR = 68,00 мс, TE = 26,08, пространственное разрешение: 0,8 мм изотропно. Поле обзора: с наклоном для оптимизации охвата зрительной коры, височной доли и гиппокампа. Угол настраивался индивидуально для каждого участника). Было собрано четыре прогона EPI с переменным количеством объемов из-за джиттера между испытаниями (~190–210 объемов), а также объемы на прогон для картирования pRF. Четыре фиктивных объема с противоположным направлением PE были получены в начале прогона, они не были включены в конвейер предобработки.&lt;/p&gt;\n&lt;p&gt;Мы собрали структурные данные с помощью метода MP2RAGE с TR 68 мс и TE 2,54 мс, с измененным размером среза 288 вместо 240 для учета больших размеров головы — под углом 15,0 градусов. Для предотвращения артефактов применялось подавление сигнала жира.&lt;/p&gt;\n&lt;h4 id=\"predobrabotka-nejrovizualizacii\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#predobrabotka-nejrovizualizacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Предобработка нейровизуализации&lt;/span&gt;&lt;/a&gt;Предобработка нейровизуализации&lt;/h4&gt;\n&lt;p&gt;Структурные сканы мозга MP2RAGE были предобработаны с помощью FreeSurfer версии 7.3.2. Изображение мозга было очищено от черепа, а твердая мозговая оболочка была автоматически удалена с помощью «synth strip», алгоритма на основе глубокого обучения. Удаление оставшейся твердой оболочки проводилось вручную перед аппроксимацией слоев мягкой мозговой оболочки и белого вещества для облегчения процесса. Используя автоматическую парцелляцию, предоставленную Freesurfer, мы извлекли анатомические метки для первичной зрительной коры, гиппокампа и верхней височной коры, которые использовались для извлечения вокселей для нашего анализа.&lt;/p&gt;\n&lt;h4 id=\"opredelenie-kortikalnyh-sloev\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#opredelenie-kortikalnyh-sloev\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение кортикальных слоев&lt;/span&gt;&lt;/a&gt;Определение кортикальных слоев&lt;/h4&gt;\n&lt;p&gt;Мы разделили кору на три равнообъемных слоя, используя метод множеств уровней, основанный на идее о том, что кортикальные слои сохраняют объем по всей площади извилин и борозд. Кортикальный объем использовался для вычисления расстояния между белым веществом и мягкой оболочкой с учетом локальной кривизны. Для каждого вокселя мы затем вычислили, в какой степени он расположен внутри каждого из пяти компартментов (глубокий, средний и поверхностный слои серого вещества, белое вещество и спинномозговая жидкость). Каждый воксель был отнесен к одному из трех слоев серого вещества, если &amp;gt;50% его объема находилось внутри этого слоя.&lt;/p&gt;\n&lt;h4 id=\"predobrabotka-fmrt\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#predobrabotka-fmrt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Предобработка фМРТ&lt;/span&gt;&lt;/a&gt;Предобработка фМРТ&lt;/h4&gt;\n&lt;p&gt;Данные 3D EPI были предобработаны с использованием Statistical Parametric Mapping версии 12 (SPM12). NORDIC применялся для удаления теплового шума и улучшения отношения сигнал/шум (SnR). Перевыравнивание выполнялось для оценки и коррекции движения. Мы не применяли пространственное сглаживание, чтобы сохранить высокое пространственное разрешение. Структурные данные были корегистрированы со средним объемом EPI с использованием двухэтапного процесса. Сначала применялась объемная корегистрация в SPM12, а затем рекурсивная регистрация на основе границ (RBR) для коррекции искажений в направлении кодирования фазы. RBR сначала применяет аффинную регистрацию на основе границ (BBR) рекурсивно к все более мелким разделам коры с семью степенями свободы, вращением и трансляцией в трех измерениях, масштабируя только вдоль направления кодирования фазы, чтобы обеспечить коррекцию искажений. В каждой из шести рекурсий текущая выбранная сетка коры разделялась на две части, и оптимальная регистрация применялась к обеим частям, после чего каждая часть снова подразделялась на две и регистрировалась; это повышало специфичность и соответствие между структурным и функциональным объемом (которые искажены неоднородностью магнитного поля) на каждом этапе. Разделения производились вдоль главных осей для получения равного количества вершин для каждой части.&lt;/p&gt;\n&lt;p&gt;Из данных фМРТ pRF мы использовали mrVista для оценки для каждого вокселя популяционного рецептивного поля в форме двумерного гауссова распределения с центром (координаты x и y) и стандартным отклонением (сигма). Мы исключили воксели, которые имели низкую объясненную дисперсию (r2 &amp;lt; 10%) во время задачи pRF, имели нереалистично маленькое рецептивное поле (сигма &amp;lt; 0,2 градуса визуального угла) или слишком большое рецептивное поле, чтобы обладать пространственной специфичностью, требуемой нашим анализом (сигма ≥ 1,3 градуса визуального угла).&lt;/p&gt;\n&lt;p&gt;После оценки pRF мы визуально проверили, соответствуют ли оцененные карты ожидаемой ретинотопической организации зрительной коры, изучив карты x-координат, y-координат и размеров рецептивных полей. Оценки pRF использовались для выбора вокселей, настроенных на определенные местоположения в поле зрения.&lt;/p&gt;\n&lt;h4 id=\"retinotopicheskie-lokalizacii-i-vybor-roi\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#retinotopicheskie-lokalizacii-i-vybor-roi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ретинотопические локализации и выбор ROI&lt;/span&gt;&lt;/a&gt;Ретинотопические локализации и выбор ROI&lt;/h4&gt;\n&lt;p&gt;Мы отобрали воксели V1, чьи рецептивные поля попадали в специфические области интереса (ROI) в поле зрения (Рис. S2). Первичной ретинотопической областью интереса было положение средней вспышки, т.е. место, где воспринималась иллюзорная вспышка (в пробах «Illusory Flash»). В качестве контрольной локализации мы использовали зеркальное отображение относительно оси y, чтобы выбранные воксели для каждой локации имели схожие нейронные свойства из-за равного расстояния от точки фиксации. Для каждой локации мы выбирали воксели, центр рецептивного поля (x,y) которых находился в пределах окружности сигма от места вспышки. Опрос после фМРТ-сессии (в частности, ответ на вопрос: «видели ли вы вторую вспышку точно посередине?») выявил индивидуальную вариативность в сообщаемом положении иллюзорной вспышки. В частности, из 23 включенных участников трое сообщили, что видели среднюю вспышку точно посередине во всех случаях, тогда как остальные двадцать участников сообщили, что видели ее хотя бы иногда также слева и/или справа от центра. Поэтому область интереса «flash 2» была расширена в четыре раза по горизонтали, чтобы включить как можно больше вокселей, чьи рецептивные поля покрывали иллюзорное восприятие, избегая при этом любого перекрытия с двумя другими вспышками. Наконец, этот ретинотопический ROI был разделен на три кортикальных слоя — глубокий, средний, поверхностный (см. выше) — с соответствующим количеством вокселей (среднее ± SEM): 89,30 ± 14,25, 77,61 ± 12,70, 87,22 ± 17,65.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ROI (Region of Interest) — это заранее определенная область мозга, активность которой анализируется отдельно, а ретинотопия — это соответствие между точками на сетчатке глаза и участками зрительной коры.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"analiz-pervogo-urovnya\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#analiz-pervogo-urovnya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ первого уровня&lt;/span&gt;&lt;/a&gt;Анализ первого уровня&lt;/h4&gt;\n&lt;p&gt;Для данных фМРТ задачи мы применили общую линейную модель (GLM) с использованием SPM12 для моделирования BOLD-ответов, специфичных для условий каждого прогона. В эту GLM мы включили только контрольные пробы («No Flash» и «Real Flash»), в которых участники ответили правильно, и пробы с иллюзией («Illusory Flash» и «Suppressed Flash»), в которых участники испытали иллюзию. Неправильные и пропущенные ответы моделировались отдельным регрессором, оценки параметров которого не анализировались. Параметры движения головы, их производные и квадрат производных были включены в качестве мешающих регрессоров. Впоследствии данные и матрица дизайна были подвергнуты фильтрации верхних частот (отсечка = 128 с) для удаления низкочастотных дрейфов сигнала. Для каждого участника и каждого условия полученные оценочные бета-параметры на воксель усреднялись по прогонам, что давало четыре набора оценок параметров на индивида. Описанные выше ретинотопические ROI использовались для извлечения паттернов активности вокселей для каждого условия и каждого ROI, которые были разделены на три кортикальных слоя.&lt;/p&gt;\n&lt;h4 id=\"mnogomernyj-analiz\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#mnogomernyj-analiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Многомерный анализ&lt;/span&gt;&lt;/a&gt;Многомерный анализ&lt;/h4&gt;\n&lt;p&gt;Чтобы проанализировать, изменяют ли иллюзии нейронную активность в первичной зрительной коре, мы реализовали как многомерный, так и одномерный анализ. В многомерном анализе мы вычислили метрику «сходства перцептивных паттернов»: сходство паттернов между активностью во время иллюзорных проб и контрольным условием с перцептивным эквивалентом минус сходство с таковым для ретинального эквивалента (Рис. S1).&lt;/p&gt;\n&lt;p&gt;Это включало расчет корреляции Пирсона между оцененными паттернами BOLD-активности для различных условий для вокселей V1, настроенных на положение средней вспышки, т.е. место, где иногда возникали иллюзии. Мы использовали z-преобразование Фишера для создания нормально распределенных оценок корреляции. Например, для иллюзии «Illusory Flash» мы рассчитывали для каждого участника, был ли паттерн мозговой активности при восприятии иллюзии более похожим на таковой при просмотре реальной вспышки, чем на таковой, когда вспышка не предъявляется. То есть мы вычитали корреляцию между «Illusory Flash» и «No Flash» из корреляции между «Illusory Flash» и «Real Flash». Для анализа (дифференциального) влияния постдиктивного восприятия на слои V1 мы выполнили двухфакторный дисперсионный анализ с повторными измерениями (ANOVA) с обоими внутрисубъектными факторами: «Слой» (уровни: глубокий, средний, поверхностный) и «Тип иллюзии» (уровни: «Illusory Flash», «Suppressed Flash»). Мы провели последующие двусторонние t-критерии, чтобы проанализировать, как перцептивная информация, усредненная по иллюзиям, различалась между слоями. Наконец, мы оценили нашу гипотезу о том, что глубокие слои кодируют эту постдиктивную перцептивную информацию, проверив, является ли она значимо выше нуля, используя односторонний t-критерий Стьюдента. Мы применили тот же анализ к ретинотопической контрольной локализации для валидации и оценили ту же гипотезу для каждой иллюзии в отдельности.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Постдиктивное восприятие — это процесс, при котором мозг интерпретирует сенсорный стимул, основываясь на информации, полученной &lt;em&gt;после&lt;/em&gt; самого стимула, а z-преобразование Фишера используется для нормализации коэффициентов корреляции для статистических тестов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"odnomernyj-analiz\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#odnomernyj-analiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Одномерный анализ&lt;/span&gt;&lt;/a&gt;Одномерный анализ&lt;/h4&gt;\n&lt;p&gt;В одномерном анализе мы сравнивали амплитуду BOLD-ответов вокселей, настроенных на положение средней вспышки, между условиями «Illusory Flash» и «No Flash», усредняя их по участнику и применяя односторонний t-критерий Стьюдента по участникам. Для валидации мы сравнивали положение средней вспышки с его зеркальным отображением над точкой фиксации во время условия «Real Flash».&lt;/p&gt;\n&lt;h4 id=\"informacionnaya-konnektivnost\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#informacionnaya-konnektivnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Информационная коннективность&lt;/span&gt;&lt;/a&gt;Информационная коннективность&lt;/h4&gt;\n&lt;p&gt;Для исследования источника иллюзорных сигналов мы применили анализ информационной коннективности для оценки ковариации от испытания к испытанию в сходстве паттернов (корреляция с условием «реальная вспышка» минус корреляция с условием «без вспышки») между двумя областями. Чтобы оптимизировать надежность анализа, мы расширили ретинотопическую область интереса так, чтобы она включала все три вспышки, и тем самым повысили отношение сигнал/шум, увеличив количество вокселей на слой (среднее ± стандартная ошибка среднего): глубокий — 179.04 ± 20.22; средний — 160.22 ± 19.49; поверхностный — 192.00 ± 26.31.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Информационная коннективность — это метод анализа фМРТ, который позволяет оценить, как информация и паттерны активности передаются и согласованно изменяются между различными областями мозга от испытания к испытанию.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для получения метрики перцептивной информации для каждого испытания мы рассчитывали средний паттерн для контрольных условий «без вспышки» и «реальная вспышка» отдельно для каждого участника, а затем на основе каждого испытания вычисляли, насколько нейронные ответы во время иллюзорных условий были похожи на одно контрольное условие по сравнению с другим, чтобы измерить перцептивную информацию. Мы извлекали этот паттерн для каждой области интереса (ROI) и коррелировали паттерны между парами ROI для всех испытаний. В результате были получены показатели коннективности между зонами мозга для каждого участника, которые нормализовались с использованием z-преобразования Фишера.&lt;/p&gt;\n&lt;p&gt;Чтобы проанализировать, какая область может передавать перцептивную информацию обратно в первичную зрительную кору, мы проанализировали информационную коннективность для каждого слоя V1. Мы сравнили перцептивную информацию, разделяемую между каждой из кандидатных областей — верхней височной корой (воксели: 28,787 ± 645.60) и гиппокампом (воксели: 12,638 ± 179.86) — и каждым слоем V1, используя одновыборочные t-критерии Стьюдента. Для валидации мы выполнили тот же анализ для ретинотопической контрольной точки — зеркального отражения трех вспышек.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" f
