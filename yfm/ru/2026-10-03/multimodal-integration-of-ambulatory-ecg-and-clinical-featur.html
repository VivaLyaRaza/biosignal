(a) и смерти от сердечной недостаточности (b).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-f5.jpg\" alt=\"Рис. 5. Сравнение кривых PR-AUC для унимодальных (только ЭКГ, только текст LLM, только табличные данные) и мультимодальн\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 5. Сравнение кривых PR-AUC для унимодальных (только ЭКГ, только текст LLM, только табличные данные) и мультимодальных (ЭКГ + табличные данные, ЭКГ + текст LLM) моделей для прогнозирования внезапной сердечной смерти (a) и смерти от сердечной недостаточности (b).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-f6.jpg\" alt=\"Рисунок 6: Сравнение кривых DCA для унимодальных (только ЭКГ, только текст LLM, только табличные данные) и мультимодальн\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 6: Сравнение кривых DCA для унимодальных (только ЭКГ, только текст LLM, только табличные данные) и мультимодальных (ЭКГ + табличные данные, ЭКГ + текст LLM) моделей для прогнозирования внезапной сердечной смерти (a) и смерти от сердечной недостаточности (b).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-f7.jpg\" alt=\"Рисунок 7: Карта внимания для амбулаторной ЭКГ (a), градиентная карта значимости токенов для клинического текста, сгенер\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 7: Карта внимания для амбулаторной ЭКГ (a), градиентная карта значимости токенов для клинического текста, сгенерированного LLM (b), а также карты значимости для выбранного сегмента ЭКГ и показателей вариабельности сердечного ритма (c). Эти карты относятся к мультимодальной модели ЭКГ + LLM, в которой у пациента прогнозируется внезапная сердечная смерть в течение следующих четырех лет.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-f8.jpg\" alt=\"Рисунок 8: Карта внимания для амбулаторной ЭКГ (a), градиентная карта значимости токенов для клинического текста, сгенер\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 8: Карта внимания для амбулаторной ЭКГ (a), градиентная карта значимости токенов для клинического текста, сгенерированного LLM (b), а также карты значимости для выбранного сегмента ЭКГ и показателей вариабельности сердечного ритма (c). Эти карты относятся к мультимодальной модели ЭКГ + LLM, в которой у пациента прогнозируется смерть от сердечной недостаточности в течение следующих четырех лет.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Атрибуция — это метод интерпретации ИИ, который показывает, какие именно части входных данных (например, фрагменты ЭКГ или слова в тексте) внесли наибольший вклад в итоговое предсказание модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"431-effektivnost-unimodalnoj-modeli\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#431-effektivnost-unimodalnoj-modeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3.1. Эффективность унимодальной модели&lt;/span&gt;&lt;/a&gt;4.3.1. Эффективность унимодальной модели&lt;/h4&gt;\n&lt;p&gt;Мы сначала оценили представление, полученное на основе ЭКГ, полный клинический отчет, сгенерированный LLM, и табличные клинические признаки как отдельные унимодальные входные данные. Детерминированное текстовое представление также оценивалось в качестве контроля для представления тех же клинических переменных в фиксированном формате. Для прогнозирования SCD табличная модель показала самые высокие точечные оценки AUROC и PR-AUC, за ней следовали модели на основе детерминированного текста, только ЭКГ и полного текста LLM. По сравнению с полным представлением LLM, табличное представление...&lt;/p&gt;\n&lt;p&gt;[Таблицы данных о прогнозировании SCD и PFD с 95% доверительными интервалами, включая AUROC, PR-AUC, оценку Брайера, точность, PPV, чувствительность, специфичность, NPV и F1-меру для моделей ECG, Full LLM text, Deterministic text и Tabular clinical features.]&lt;/p&gt;\n&lt;h4 id=\"multimodalnye-modeli\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#multimodalnye-modeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мультимодальные модели&lt;/span&gt;&lt;/a&gt;Мультимодальные модели&lt;/h4&gt;\n&lt;p&gt;ЭКГ+полный текст LLM: 0,603; 0,170; 0,109; 0,646; 0,184; 0,537; 0,662; 0,910; 0,274 (0,538–0,666; 0,130–0,240; 0,091–0,128; 0,610–0,681; 0,136–0,236; 0,431–0,643; 0,623–0,699; 0,882–0,936; 0,209–0,338). ЭКГ+детерминированный текст: 0,675; 0,240; 0,104; 0,677; 0,209; 0,573; 0,692; 0,919; 0,306 (0,612–0,735; 0,172–0,327; 0,086–0,122; 0,640–0,713; 0,156–0,264; 0,463–0,681; 0,653–0,728; 0,892–0,944; 0,236–0,373). ЭКГ+табличные клинические признаки: 0,756; 0,353; 0,097; 0,763; 0,292; 0,634; 0,782; 0,938; 0,400 (0,697–0,811; 0,261–0,461; 0,080–0,114; 0,730–0,794; 0,227–0,361; 0,529–0,741; 0,747–0,814; 0,915–0,958; 0,323–0,476).&lt;/p&gt;\n&lt;p&gt;Модель показала более высокий AUROC на 0,165 (95% ДИ, 0,073–0,255; скорректированное p=0,052) и более высокий PR-AUC на 0,112 (95% ДИ, 0,041–0,204; скорректированное p=0,032). Соответствующая разница AUROC не осталась статистически значимой после поправки на множественные сравнения, тогда как разница PR-AUC осталась. Никакие другие сравнения унимодальных моделей для SCD не были статистически значимыми после поправки Холма. Для прогнозирования PFD табличная модель показала наивысшие AUROC и PR-AUC, за ней следовало детерминированное текстовое представление. По сравнению с полным представлением LLM, табличная модель имела более высокий AUROC на 0,321 (95% ДИ, 0,236–0,404; скорректированное p=0,014) и более высокий PR-AUC на 0,229 (95% ДИ, 0,136–0,331; скорректированное p=0,014). Табличная модель также превзошла детерминированное текстовое представление по AUROC на 0,111 (95% ДИ, 0,057–0,169; скорректированное p=0,014), хотя их разница по PR-AUC не была статистически значимой. Детерминированный текст также превзошел полный текст LLM для PFD по AUROC, PR-AUC и показателю Брайера, со скорректированным p=0,014 для всех трех сравнений. Калиброванные показатели Брайера были в целом схожими для моделей SCD, тогда как для PFD детерминированное текстовое представление показало лучшую ошибку калибровки, чем полное представление LLM. В целом, прямые табличные и детерминированные представления сохранили больше прогностической информации, чем преобразование тех же клинических переменных в полную клиническую оценку, сгенерированную LLM.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AUROC и PR-AUC — метрики качества классификации: первая оценивает способность модели разделять классы, вторая — точность при дисбалансе данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"432-effektivnost-multimodalnogo-sliyaniya\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#432-effektivnost-multimodalnogo-sliyaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3.2. Эффективность мультимодального слияния&lt;/span&gt;&lt;/a&gt;4.3.2. Эффективность мультимодального слияния&lt;/h4&gt;\n&lt;p&gt;Далее мы оценили мультимодальное слияние представлений ЭКГ с текстовыми и табличными представлениями клинических данных. Для каждой пары модальностей и внешнего блока кросс-валидации LLaMA LLM, биомедицинский текстовый энкодер, нисходящий текстовый классификатор и архитектура слияния выбирались с использованием только соответствующих данных внутренней кросс-валидации. Соответственно, представленные показатели мультимодальной эффективности отражают объединенные прогнозы внешнего теста для конфигураций, выбранных для конкретного блока, а не единую архитектуру слияния, примененную ко всем внешним блокам. Здесь «LLMtext» относится к полному тексту оценки клинического риска, сгенерированному из структурированных переменных пациента выбранной LLaMA LLM и впоследствии закодированному выбранным биомедицинским текстовым энкодером.&lt;/p&gt;\n&lt;p&gt;Для прогнозирования SCD модель ECG+fullLLMtext достигла AUROC 0,591 и PR-AUC 0,158, с более высокими точечными оценками, чем унимодальная модель LLM-text, но более низкими точечными оценками, чем унимодальная модель ЭКГ. ECG+deterministictext достигла самой высокой точечной оценки AUROC для SCD в целом (0,711), в то время как ECG+tabularclinicalfeatures показала самую высокую точечную оценку PR-AUC (0,248). Ни одно из заранее определенных сравнений мультимодальных моделей с соответствующими унимодальными не оказалось статистически значимым. Для прогнозирования PFD модель ECG+fullLLMtext достигла AUROC 0,603 и PR-AUC 0,170. Ее AUROC превысил показатель унимодальной модели full LLM-text на 0,136 (95% ДИ, 0,059–0,215; скорректированное p=0,028), хотя соответствующие различия в PR-AUC и показателе Брайера не были статистически значимыми. ECG+tabularclinicalfeatures достигла AUROC 0,756 и PR-AUC 0,353. По сравнению с унимодальной моделью ЭКГ это соответствовало улучшению AUROC на 0,129 (95% ДИ, 0,072–0,186; скорректированное p=0,014) и улучшению PR-AUC на 0,171 (95% ДИ, 0,085–0,259; скорректированное p=0,041), вместе со снижением показателя Брайера на 0,010 (95% ДИ, 0,005–0,016; скорректированное p=0,041). Однако ECG+tabularclinicalfeatures не превзошла унимодальную табличную модель. ECG+deterministictext работала аналогично модели с детерминированным текстом. Порогово-зависимые метрики показали аналогичную картину. Для SCD унимодальная модель ЭКГ сохранила самые высокие показатели точности, прецизионности и специфичности, в то время как ECG+deterministictext достигла самого высокого F1-показателя среди оцененных моделей. Для PFD унимодальная табличная модель сохранила самую высокую чувствительность, NPV и F1-показатель, тогда как ECG+tabularclinicalfeatures достигла самых высоких показателей точности, прецизионности и специфичности. В целом, мультимодальное слияние обеспечило преимущества для отдельных исходов и клинических представлений, а не равномерно улучшило показатели для всех комбинаций модальностей.&lt;/p&gt;\n&lt;h4 id=\"433-issledovatelskij-analiz-krivyh-prinyatiya-reshenij\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#433-issledovatelskij-analiz-krivyh-prinyatiya-reshenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3.3. Исследовательский анализ кривых принятия решений&lt;/span&gt;&lt;/a&gt;4.3.3. Исследовательский анализ кривых принятия решений&lt;/h4&gt;\n&lt;p&gt;Исследовательский анализ кривых принятия решений оценивал унимодальные модели (ЭКГ, текст LLM и табличные данные), а также вложенные модели (ЭКГ + текст LLM и ЭКГ + табличные данные). Эти модели сравнивались со стратегиями «лечить всех» и «не лечить никого» в диапазоне порогов риска от 2% до 25%, с поточечными 95% доверительными интервалами для чистой выгоды, полученными на основе 5000 бутстреп-выборок на уровне пациентов. Для прогнозирования внезапной сердечной смерти (SCD) модель ЭКГ + текст LLM не превосходила обе эталонные стратегии на всем исследованном диапазоне порогов. Напротив, модель ЭКГ + табличные клинические признаки показала положительную чистую выгоду относительно обеих стратегий в диапазоне примерно 8,8%–21,8%. Унимодальная табличная модель показала благоприятную чистую выгоду в диапазоне примерно 8,3%–20,0%, тогда как унимодальная модель ЭКГ превосходила обе стратегии в более узком интервале примерно 10,8%–14,0%. Для прогнозирования прогрессирующей сердечной недостаточности (PFD) модель ЭКГ + текст LLM превосходила обе стратегии преимущественно в узком диапазоне порогов примерно 11,0%–13,0%. Унимодальная табличная модель обеспечивала положительную чистую выгоду относительно обеих стратегий почти во всем диапазоне порогов от 6,5% до 25,0%, в то время как модель ЭКГ + табличные клинические признаки — от 6,8% до 24,5%. Таким образом, наиболее широкие и устойчивые области положительной чистой выгоды наблюдались для моделей, включающих исходные табличные клинические признаки. Поскольку для данных четырехлетних исходов не было клинически валидировано специфическое пороговое значение риска, интервал 2%–25% был выбран как исследовательский диапазон, охватывающий наблюдаемую распространенность событий и возможные допуски риска. Кроме того, доверительные интервалы являются поточечными и не обеспечивают одновременного покрытия по всему диапазону порогов. Эти результаты описывают сравнительное поведение моделей при гипотетических порогах принятия решений и создают основу для будущих внешних и проспективных исследований с использованием порогов, связанных с конкретными клиническими действиями.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анализ кривых принятия решений (Decision Curve Analysis) — это метод оценки клинической полезности диагностических моделей, который учитывает баланс между пользой от выявления истинно положительных случаев и вредом от ложноположительных результатов при различных порогах вероятности риска.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"434-analiz-atribucii-i-ustojchivosti-modelej\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#434-analiz-atribucii-i-ustojchivosti-modelej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3.4. Анализ атрибуции и устойчивости моделей&lt;/span&gt;&lt;/a&gt;4.3.4. Анализ атрибуции и устойчивости моделей&lt;/h4&gt;\n&lt;p&gt;Для иллюстрации поведения мультимодальных моделей ЭКГ + текст LLM мы представляем визуализации внимания ЭКГ и значимости текста для репрезентативных пациентов с прогнозируемыми SCD и PFD на Рис. 7 и Рис. 8 соответственно. Вычисленные веса внимания по всей амбулаторной ЭКГ (Рис. 7a и Рис. 8a) были распределены по всей 24-часовой записи, а не сосредоточены в одном изолированном интервале. Эти паттерны указывают на то, что механизм временной агрегации включал информацию из нескольких частей записи. Для клинических оценок, сгенерированных LLM (Рис. 7b и Рис. 8b), значимость токенов, основанная на градиентах, была распределена по нескольким частям сгенерированного текста, включая клинически значимые дескрипторы, такие как фракция выброса левого желудочка (LVEF), класс по NYHA, Pro-BNP, метки риска и утверждения о тяжести сердечной недостаточности или функциональном статусе. Для изучения локального поведения ЭКГ репрезентативные 30-секундные сегменты показаны вместе с признаками вариабельности сердечного ритма (HRV) на уровне сегментов и соответствующими значениями значимости (Рис. 7c и Рис. 8c). Визуализации иллюстрируют, как внимание, назначенное при временной агрегации, может рассматриваться вместе с изменениями частоты сердечных сокращений, SDNN, RMSSD, pNN50, самой длинной RR-паузой и нагрузкой желудочковых экстрасистол (PVC) вокруг фокусного сегмента. В совокупности эти визуализации предоставляют дополнительный способ изучения того, на какие временные и клинические признаки опирается модель, что потенциально помогает соотнести прогнозы модели с распознаваемыми аспектами патофизиологии, связанной с SCD и PFD. Мы дополнительно оценили стабильность ранжирования атрибуции текста при нескольких контролируемых возмущениях (Рис. 9a,b). Ранги атрибуции были высокостабильными к изменениям количества шагов интеграции и оставались относительно стабильными при возмущениях входных данных, сохраняющих смысл, включая изменения пробелов, пунктуации, порядка строк и нейтральных префиксов. Стабильность была ниже при повторных переобучениях с разными случайными начальными числами, со средними корреляциями Спирмена 0,596 для SCD и 0,594 для PFD. Рандомизация классификационной головки привела к еще более низкому согласию атрибуции со средними корреляциями Спирмена 0,492 и 0,484 для SCD и PFD соответственно. В целом, для обоих исходов наблюдались схожие паттерны, что указывает на то, что ранги атрибуции были устойчивы к поверхностным изменениям входных данных, но более чувствительны к вариациям в параметрах обученной модели. Наконец, маскирование токенов использовалось для оценки того, имели ли токены, получающие более высокую значимость, большее влияние на предсказанные вероятности (Рис. 9c,d). Среди посещаемых неспециальных токенов токены с высокой и низкой значимостью определялись как ранжированные соответственно в топе и внизу по градиентной значимости токенов, в то время как случайное маскирование выбирало равное количество подходящих токенов равномерно без замены. Маскирование токенов с высокой атрибуцией в целом приводило к большим абсолютным изменениям предсказанной вероятности, чем случайное маскирование, хотя величина этого различия варьировалась в зависимости от доли маскирования. Для SCD средняя разница между высокой атрибуцией и случайным маскированием была положительной при долях маскирования 5%, 10% и 20% с 95% доверительными интервалами, исключающими ноль, но была меньше и статистически неотличима от нуля при 30%. Для PFD разница была положительной при 5% и 30%, тогда как доверительные интервалы включали ноль при 10% и 20%. В совокупности эти анализы предоставляют дополнительные доказательства того, что метод атрибуции идентифицирует текстовые области, связанные с выходом модели, одновременно показывая, что ранги атрибуции и эффекты маскирования не являются инвариантными к изменениям в обученной модели или настройках возмущения.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-f9.jpg\" alt=\"Рисунок 9: Анализ устойчивости атрибуции (a, b) и анализ маскирования токенов (c, d) для прогнозирования внезапной серде\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 9: Анализ устойчивости атрибуции (a, b) и анализ маскирования токенов (c, d) для прогнозирования внезапной сердечной смерти (SCD) и смерти от сердечной недостаточности (PFD).&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"435-ablyacii-predstavlenij-i-perekrytij\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#435-ablyacii-predstavlenij-i-perekrytij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3.5. Абляции представлений и перекрытий&lt;/span&gt;&lt;/a&gt;4.3.5. Абляции представлений и перекрытий&lt;/h4&gt;\n&lt;p&gt;Мы оценили несколько условий представления и абляции, чтобы определить, обусловлена ли прогностическая эффективность оценкой и рассуждениями, сгенерированными LLM, детерминированной вербализацией клинических переменных или прямым моделированием исходных клинических данных. Текстовые условия включали полную оценку риска, сгенерированную LLM, только метки риска, только обоснования, нейтральное клиническое резюме (резюме LLM предоставленной клинической информации без оценки риска SCD или PFD) и детерминированный шаблон без использования LLM. В качестве контроля прямых клинических данных исходные числовые и категориальные переменные моделировались с использованием логистической регрессии с штрафом, как без учета, так и с учетом пяти впечатлений ЭКГ, полученных по Холтеру. Результаты обобщены в Таблице 5. Для прогнозирования SCD полная оценка LLM достигла AUROC 0,531 и PR-AUC 0,130. Представления только с метками риска и только с обоснованиями не улучшили дискриминацию, в то время как нейтральное клиническое резюме дало умеренно более высокие точечные оценки с AUROC 0,574 и PR-AUC 0,141. Напротив, детерминированный шаблон достиг AUROC 0,681 и PR-AUC 0,204, приближаясь к эффективности моделей на основе прямых табличных клинических переменных. Самая низкая точечная оценка показателя Брайера для SCD наблюдалась при использовании логистической регрессии с штрафом с применением клинических переменных и впечатлений ЭКГ. Для прогнозирования PFD полная оценка LLM достигла AUROC 0,459 и PR-AUC 0,134. Представления только с метками риска и только с обоснованиями показали столь же ограниченную дискриминацию, тогда как нейтральное клиническое резюме показало лучшие результаты с AUROC 0,620 и PR-AUC 0,188. Детерминированный шаблон улучшил показатели еще больше, достигнув AUROC 0,680 и PR-AUC 0,300, хотя модели на основе прямых табличных клинических переменных в целом оставались наиболее сильными.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AUROC и PR-AUC — метрики качества классификации: первая оценивает способность модели разделять классы, вторая — точность при выявлении редких событий.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для оценки потенциального перекрытия с модальностью ЭКГ пять впечатлений ЭКГ по Холтеру были добавлены отдельно к промптам LLM и табличным предикторам. Для SCD добавление этих впечатлений к полной оценке LLM не улучшило дискриминацию: AUROC снизился с 0,531 до 0,516, а PR-AUC — с 0,130 до 0,117. Напротив, для PFD добавление впечатлений ЭКГ увеличило AUROC с 0,459 до 0,655, а PR-AUC — с 0,134 до 0,245. Соответствующие табличные значения AUROC увеличились лишь незначительно: с 0,696 до 0,710 для SCD и с 0,787 до 0,792 для PFD. В целом, поля впечатлений ЭКГ, по-видимому, вносят значительно больший вклад в представление LLM для PFD, чем для SCD.&lt;/p&gt;\n&lt;p&gt;Соответствие «пациент-текст» оценивалось путем случайной перестановки текстовых представлений между пациентами в каждом внешнем тестовом фолде, оставляя представления ЭКГ и исходы неизменными. Обученные модели слияния применялись без переобучения. Эта процедура сохраняла общее распределение текстовых эмбеддингов, нарушая при этом соответствие между каждым пациентом и его текстовым представлением. Как показано в Таблице 6, нарушение соответствия «пациент-текст» привело к незначительным изменениям в эффективности. Для SCD правильно сопоставленные представления имели немного более низкие AUROC и PR-AUC, чем перемешанные пары, с разницей в -0,011 и -0,008 соответственно, в то время как разница в показателе Брайера была минимальной. Для PFD соответствующие различия в AUROC, PR-AUC и показателе Брайера также были пренебрежимо малы. Ни один из перестановочных тестов не был статистически значимым. Эти результаты свидетельствуют о том, что модель слияния ЭКГ-LLM не получила измеримого выигрыша в эффективности от сохранения специфического для пациента соответствия в полном текстовом представлении LLM. Они также подтверждают более широкий вывод о том, что детерминированные и прямые табличные представления сохраняют больше полезной прогностической информации, чем оценка, сгенерированная LLM.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-f1.jpg\" alt=\"Рис. 1. Мультимодальный рабочий процесс для анализа амбулаторных записей ЭКГ совместно с клиническими данными.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1. Мультимодальный рабочий процесс для анализа амбулаторных записей ЭКГ совместно с клиническими данными.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 1. Мультимодальный рабочий процесс для анализа амбулаторных записей ЭКГ совместно с клиническими данными. Записи ЭКГ проходят предварительную обработку и сегментируются на короткие окна. Для каждого окна извлекаются показатели вариабельности сердечного ритма (ВСР), которые кодируются с помощью нейронной сети Multiple Instance Learning–Temporal Convolutional Network (MIL–TCN), формируя представление ЭКГ, 𝜀ECG. Параллельно клинические переменные представляются в виде текста, сгенерированного большой языковой моделью (LLM), детерминированного клинического текста или табличных признаков. Текст, сгенерированный LLM, и детерминированный текст кодируются с помощью биомедицинского текстового энкодера для получения текстовых представлений на уровне пациента, 𝜀TXT, в то время как предварительно обработанные табличные переменные формируют табличное представление, 𝜀TAB. Представления ЭКГ, текста и табличных данных оценивались как унимодальные модели, а текстовые и табличные представления также объединялись с представлением ЭКГ в мультимодальных моделях для прогнозирования внезапной сердечной смерти (SCD) и смерти от сердечной недостаточности (PFD). Пунктирные линии указывают на использование либо текстового (TXT), либо табличного (TAB) представления для мультимодального слияния.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur-fS1.jpg\" alt=\"Рис. S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Сложность&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;прогноза&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сердечных&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;рисков&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Мультимодальны&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;й анализ ЭКГ и&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;клиники&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Точность&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;зависит от&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;формата данных&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Оптимизация ИИ&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;для&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;кардиологии&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не прошёл рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия препринта&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;medRxiv&lt;/td&gt;\n&lt;td&gt;cardiovascular medicine&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Swee, S.; &lt;a href=\"concepts/adam.html\"&gt;Adam&lt;/a&gt;, I.; Zheng, E. Y.; Ji, E.; Wang, D.; Speier, W.; Hsu, J.; Chang, K.-W.; Shivkumar, K.; Ping, P.&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&
