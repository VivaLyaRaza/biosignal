        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"272\" cy=\"70\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"548\" cy=\"276\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как прерывистый сон&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;запускает вспышки эпилепсии&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;в мозге&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-f1.jpg\" alt=\"Рисунок 1. Обзор протокола фрагментации сна во время ночной регистрации SEEG-PSG. (a) Синхронизированные записи SEEG и с\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Обзор протокола фрагментации сна во время ночной регистрации SEEG-PSG. (a) Синхронизированные записи SEEG и сна (PSG) были получены во время ночного сна у пациентов с лекарственно-устойчивой фокальной эпилепсией, проходящих предоперационное обследование. Электроды SEEG имплантировались в соответствии с клиническими требованиями каждого пациента в рамках диагностического обследования. PSG включала субдермальные электроэнцефалографические записи с кожи головы, расположенные в соответствии со стандартной международной системой 10-20, наряду с поверхностной электроокулографией (EOG) и электромиографией (EMG) мышц подбородка и передней большеберцовой мышцы (LFlex/RFlex). (b) Фрагментация сна индуцировалась в первой половине ночи сна, начиная с привычного времени отхода ко сну пациента, путем подачи 5-секундных звуковых сигналов частотой 1 кГц громкостью от 40 до 100 дБ во время стабильного сна NREM. Аудиостимуляция вручную подавалась через наушники-вкладыши на основе оценки сна по PSG в реальном времени для вызова активаций (arousals) без полного пробуждения. (c) Активации аннотировались офлайн с использованием записей PSG; событие классифицировалось как «вызванная активация», если оно начиналось в течение 6,5 с после начала стимула. Подсчет межприступных эпилептиформных разрядов (IED) и их распространение сравнивались по 3-секундным эпохам: исходный уровень до стимула и окно после начала стимула. Для стимулов, вызвавших активацию, окно после начала стимула начиналось с момента начала активации. Для невызывающих стимулов оно начиналось через 1,08 с после начала стимула, что соответствует медианной латентности от стимула до начала активации (контрольное окно с согласованной латентностью).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Качество ночного отдыха напрямую влияет на стабильность работы мозга у людей с эпилепсией. Эксперименты с мягкой звуковой стимуляцией показали, что каждое короткое пробуждение вызывает локальный всплеск аномальных разрядов. При этом общая зона возникновения приступов не вовлекается в процесс шире обычного. Это объясняет, почему плохой сон ухудшает когнитивные функции без обязательного развития судорог.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Микропробуждения во время сна резко увеличивают число эпилептических разрядов.&lt;/li&gt;\n&lt;li&gt;Эффект проявляется в неокортексе на второй и третьей стадиях медленного сна.&lt;/li&gt;\n&lt;li&gt;Локальная возбудимость растет, но сами разряды не начинают распространяться шире.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Исследователи изучили, как именно нестабильность сна связана с межприступными эпилептиформными разрядами (IED). Для этого они использовали совмещенную стереоэлектроэнцефалографию (СЭЭГ, метод инвазивной регистрации электрической активности мозга через тонкие электроды) и полисомнографию (комплексное исследование сна с записью работы мышц и движения глаз). В эксперименте участвовали 17 пациентов с лекарственно-устойчивой фокальной эпилепсией, которым проводили предоперационное обследование. В первые четыре часа ночи ученые подавали звуковые сигналы разной громкости, чтобы вызвать контролируемые микропробуждения длительностью от 3 до 15 секунд без полного пробуждения человека.&lt;/p&gt;\n&lt;p&gt;Результаты показали, что такие искусственные пробуждения запускают быстрый рост числа эпилептиформных разрядов, причем этот эффект зависит от зоны мозга и стадии сна. Всплески наблюдались исключительно в неокортексе (новой коре головного мозга) во время второй и третьей стадий медленного сна, причем сильнее всего во второй стадии. Примечательно, что количество разрядов росло как в самой зоне начала приступов, так и в окружающих здоровых тканях, однако пространственное распространение разрядов не менялось. Это означает, что микропробуждения усиливают возбудимость локальных нейронных сетей, но не запускают масштабную эпилептическую активность.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа проводилась на выборке пациентов с тяжелой формой лекарственно-устойчивой эпилепсии, находящихся в стационаре, поэтому результаты сложно напрямую перенести на людей с мягкими формами заболевания.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Сон и эпилептическая активность тесно связаны друг с другом, однако причинная роль нестабильности сна в возникновении и модуляции патологических разрядов в головном мозге человека до сих пор изучена недостаточно. Авторы работы напрямую исследуют этот вопрос, характеризуя временную связь с высоким разрешением между экспериментально вызванными микропробуждениями во сне и межприступными эпилептиформными разрядами (IED).&lt;/p&gt;\n&lt;p&gt;Исследование основано на анализе совместных записей стереоэлектроэнцефалографии и полисомнографии, полученных у пациентов с эпилепсией. Для оценки динамики использовались методы высокоточной временной привязки экспериментально индуцированных микропробуждений сна к частоте межприступных эпилептиформных разрядов в различных анатомических зонах мозга и на разных стадиях сна.&lt;/p&gt;\n&lt;blockquote&gt;\n&lt;p&gt;[!tip] Стереоэлектроэнцефалография (сЭЭГ) — это метод регистрации электрической активности мозга с помощью электродов, введенных непосредственно вглубь мозговых тканей, а полисомнография — комплексное исследование сна, включающее запись электроэнцефалограммы, движения глаз и мышечного тонуса.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;p&gt;Микропробуждения во сне провоцировали быстрое нарастание частоты межприступных эпилептиформных разрядов, причем этот эффект строго регулировался анатомической областью мозга и конкретной стадией сна. Повышение показателей было ограничено исключительно неокортикальными областями и наблюдалось как на стадии медленноволнового сна N2, так и на стадии N3, причем на стадии N2 этот эффект оказался более выраженным. Примечательно, что прирост числа IED не различался между зоной начала приступов и окружающими ее здоровыми тканями. Несмотря на увеличение общего числа разрядов, микропробуждения не влияли на их пространственное распространение. Это указывает на то, что нестабильность сна вызывает зависимое от функционального состояния усиление локальной возбудимости коры головного мозга без вовлечения более широких эпилептических сетей.&lt;/p&gt;\n&lt;blockquote&gt;\n&lt;p&gt;[!important] Микропробуждения во сне вызывают быстрое локальное увеличение межприступных эпилептиформных разрядов в неокортексе (особенно на стадии N2), не расширяя при этом зону их пространственного распространения.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;p&gt;Полученные данные доказывают причинную роль нестабильности сна в активном запуске патологической активности на мелкомасштабных пространственно-временных уровнях. Они также подчеркивают стабилизацию сна как перспективную терапевтическую стратегию, направленную на снижение эпилептической нагрузки и сохранение нормального функционирования кортикальных сетей.&lt;/p&gt;\n&lt;blockquote&gt;\n&lt;p&gt;[!warning] Работа базируется на инвазивных данных пациентов с фармакорезистентной эпилепсией, что требует осторожности при экстраполяции выводов на более широкие популяции без учета индивидуальных особенностей клинической картины.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Эпилепсия часто сопровождается различными нарушениями сна, включая его низкое качество, бессонницу и дневную сонливость более чем у половины пациентов. Эти проблемы не только ухудшают жизнь больных, но и провоцируют приступы, замыкая патологический круг, а ночные приступы повышают риск внезапной неожиданной смерти при эпилепсии (SUDEP). Научные данные давно связывают нестабильность сна и эпилептическую активность, которая особенно часто возникает при переходах между сонливостью и бодрствованием, а также во время нестабильного сна без быстрых движений глаз (NREM), включая микропробуждения длительностью 3-15 с со сдвигами на ЭЭГ. Циклический чередующийся паттерн (CAP) и дыхательные нарушения сна также коррелируют с ростом числа приступов. Внутричерепные исследования с помощью стереоэлектроэнцефалографии (СЭЭГ) показали, что частота межприступных эпилептиформных разрядов (МЭР) возрастает перед началом микропробуждений и в самих пропробуждениях в неокортикальных областях. Эпилептическая активность чаще фиксируется во время поверхностной фазы N2 сна, чем в глубокой фазе N3. Тем не менее, остаются пробелы: большинство работ носят наблюдательный характер, не позволяя понять причинно-следственные связи, а поверхностная ЭЭГ пропускает фокальные и глубокие разряды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Более половины пациентов с эпилепсией страдают от нарушений сна, тесно связанных с учащением эпилептической активности и ростом риска SUDEP, однако до сих пор не хватало экспериментальных данных для доказательства причинно-следственной связи.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"eksperimentalnyj-podhod-k-izucheniyu-stabilnosti-sna-i-epilepsii\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#eksperimentalnyj-podhod-k-izucheniyu-stabilnosti-sna-i-epilepsii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Экспериментальный подход к изучению стабильности сна и эпилепсии&lt;/span&gt;&lt;/a&gt;Экспериментальный подход к изучению стабильности сна и эпилепсии&lt;/h4&gt;\n&lt;p&gt;Метод стереоэлектроэнцефалографии (СЭЭГ), применяемый при предоперационном обследовании фармакорезистентной эпилепсии, дает уникальный доступ к глубоким структурам мозга с высоким пространственно-временным разрешением. В сочетании с полисомнографией (ПСГ), включающей ЭЭГ кожи головы, электромиографию (ЭМГ) и электроокулографию (ЭОГ), СЭЭГ позволяет детально изучать временную динамику сна и патологической активности. В данной работе авторы использовали совмещенные записи СЭЭГ-ПСГ у пациентов с лекарственно-устойчивой фокальной эпилепсией, проходящих предоперационное обследование, и экспериментально манипулировали стабильностью сна. Для вызова микропробуждений и создания контролируемых кратковременных возмущений применялась слуховая стимуляция, после чего сравнивались количество и распространение МЭР до и во время этих событий. Такой подход позволил напрямую оценить влияние вызванной нестабильности сна на появление МЭР в человеческом мозге. Анализ межприступной сети обеспечил высокую чувствительность к изменениям возбудимости сети, так как МЭР можно точно привязать по времени к внешним стимулам. Понимание того, как микропробуждения влияют на экспрессию МЭР, также проливает свет на механизмы ухудшения когнитивных функций и памяти при фрагментации сна у больных эпилепсией.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стереоэлектроэнцефалография (СЭЭГ) — это инвазивный метод регистрации электрической активности мозга с помощью электродов, введенных непосредственно в глубокие структуры мозга, что дает непревзойденную точность локализации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"modulyaciya-epilepticheskoj-aktivnosti-probuzhdeniyami\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#modulyaciya-epilepticheskoj-aktivnosti-probuzhdeniyami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модуляция эпилептической активности пробуждениями&lt;/span&gt;&lt;/a&gt;Модуляция эпилептической активности пробуждениями&lt;/h4&gt;\n&lt;p&gt;Исследователи выдвинули предположение, что пробуждения усиливают эпилептические спайки и способствуют их более широкому распространению, отражая повышенную возбудимость нейронных сетей. Подтверждая эту гипотезу, было зафиксировано значительное увеличение количества межприступных эпилептиформных разрядов (IED) сразу после начала пробуждения по сравнению с периодами до пробуждения, что указывает на прямое влияние пробуждений на эпилептическую динамику.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Пробуждения вызывают значительный рост числа межприступных разрядов (IED) в неокортексе и во время стадий N2 и N3, причем максимальный эффект наблюдается на стадии N2, хотя пространственное распространение разрядов при этом не меняется.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторы также проанализировали, зависит ли этот эффект от конкретной области мозга, вовлечения зоны начала приступов (SOZ) и стадии сна. Предполагалось более выраженное увеличение числа спайков в неокортексе по сравнению с медиотемпоральными областями из-за более сильных функциональных связей между неокортексом и таламусом, играющим центральную роль в регуляции сна. Также ожидался более сильный эффект во время сна N2, где связь между пробуждениями и эпилептической активностью выражена сильнее всего. Полученные результаты полностью подтвердили эти гипотезы: зафиксирован рост числа IED в неокортексе, а также на стадиях сна N2 и N3 с преобладанием эффекта в N2, что подчеркивает ключевую роль таламокортикальных контуров и динамики стадий сна.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Межприступные эпилептиформные разряды (IED) — это паттерны активности головного мозга, регистрируемые на электроэнцефалограмме, которые характерны для людей с эпилепсией, но возникают в промежутках между приступами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Интересно, что увеличение числа IED, связанных с пробуждениями, не различалось между зоной начала приступов (SOZ) и окружающими тканями, что говорит об отсутствии избирательного вовлечения SOZ в кратковременные возбуждающие изменения, вызванные пробуждением. В отличие от влияния на частоту IED, пробуждения не оказали влияния на пространственное распространение таких разрядов. Совокупность полученных данных показывает, что кратковременные пробуждения во сне избирательно повышают локальную кортикальную возбудимость без задействования более широких сетевых механизмов, необходимых для распространения IED, а сама эта связь зависит от анатомической зоны мозга и стадий сна.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдения касаются кратковременных микропробуждений у пациентов с фармакорезистентной эпилепсией в условиях стационарного мониторинга, что требует осторожности при экстраполяции выводов на все формы эпилепсии в амбулаторных условиях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Таким образом, данная работа предоставляет прямые доказательства связи между вызванными пробуждениями во сне и локальной модуляцией эпилептической активности. Это помогает уточнить существующие модели того, как кратковременные колебания состояния мозга влияют на эпилептическую динамику, и подчеркивает стабильность сна как важнейший фактор, определяющий патологическую активность в человеческом мозге.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"sluhovaya-stimulyaciya-vyzyvaet-fragmentaciyu-sna-i-mikroprobuzhdeniya-u-pacientov-s-epilepsiej\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#sluhovaya-stimulyaciya-vyzyvaet-fragmentaciyu-sna-i-mikroprobuzhdeniya-u-pacientov-s-epilepsiej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Слуховая стимуляция вызывает фрагментацию сна и микропробуждения у пациентов с эпилепсией&lt;/span&gt;&lt;/a&gt;Слуховая стимуляция вызывает фрагментацию сна и микропробуждения у пациентов с эпилепсией&lt;/h4&gt;\n&lt;p&gt;Чтобы оценить влияние искусственно вызванных микропробуждений во сне на межприступную активность, исследователи сначала убедились, что разработанный ими протокол звуковой стимуляции надежно провоцирует пробуждения и фрагментирует сон. В исследовании участвовали n = 17 пациентов с фармакорезистентной фокальной эпилепсией, которым проводили ночную стерео-электроэнцефалографию в сочетании с полисомнографией (SEEG-PSG). На протяжении первых четырех часов ночи в фазе стабильного медленноволнового сна (NREM) подавались звуковые сигналы разной громкости. Этот проверенный метод направлен на увеличение частоты микропробуждений без полного пробуждения пациента, что контролировалось в режиме реального времени по данным полисомнографии (Рис. 1).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-f1.jpg\" alt=\"Рисунок 1. Обзор протокола фрагментации сна во время ночной регистрации SEEG-PSG. (a) Синхронизированные записи SEEG и с\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Обзор протокола фрагментации сна во время ночной регистрации SEEG-PSG. (a) Синхронизированные записи SEEG и сна (PSG) были получены во время ночного сна у пациентов с лекарственно-устойчивой фокальной эпилепсией, проходящих предоперационное обследование. Электроды SEEG имплантировались в соответствии с клиническими требованиями каждого пациента в рамках диагностического обследования. PSG включала субдермальные электроэнцефалографические записи с кожи головы, расположенные в соответствии со стандартной международной системой 10-20, наряду с поверхностной электроокулографией (EOG) и электромиографией (EMG) мышц подбородка и передней большеберцовой мышцы (LFlex/RFlex). (b) Фрагментация сна индуцировалась в первой половине ночи сна, начиная с привычного времени отхода ко сну пациента, путем подачи 5-секундных звуковых сигналов частотой 1 кГц громкостью от 40 до 100 дБ во время стабильного сна NREM. Аудиостимуляция вручную подавалась через наушники-вкладыши на основе оценки сна по PSG в реальном времени для вызова активаций (arousals) без полного пробуждения. (c) Активации аннотировались офлайн с использованием записей PSG; событие классифицировалось как «вызванная активация», если оно начиналось в течение 6,5 с после начала стимула. Подсчет межприступных эпилептиформных разрядов (IED) и их распространение сравнивались по 3-секундным эпохам: исходный уровень до стимула и окно после начала стимула. Для стимулов, вызвавших активацию, окно после начала стимула начиналось с момента начала активации. Для невызывающих стимулов оно начиналось через 1,08 с после начала стимула, что соответствует медианной латентности от стимула до начала активации (контрольное окно с согласованной латентностью).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Общее время сна (TST) у участников составило в среднем 400.9 ± 89.9 мин (диапазон 214.5–542.0 мин) (Рис. 2a, клинические данные приведены в Таблице S1). Звуковое воздействие суммарно спровоцировало 440 вызванных микропробуждений, что составило 25.9 ± 9.8 события на одного участника (диапазон 9–48) (Рис. 2b). В среднем 31.6 ± 17.2% поданных звуковых сигналов (диапазон 10.7–86.2%) успешно приводили к микропробуждениям (Рис. 2c). При этом громкость 90 дБ использовалась чаще всего (Рис. 2d), хотя чувствительность к интенсивности звука различалась у разных пациентов (Рис. S1).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-f2.jpg\" alt=\"Рисунок 2. Аудиостимуляция надежно вызывает вызванные активации и фрагментацию сна у пациентов с эпилепсией. (a) Общее в\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2. Аудиостимуляция надежно вызывает вызванные активации и фрагментацию сна у пациентов с эпилепсией. (a) Общее время сна (TST) во время ночных записей SEEG-PSG у всех пациентов. (b) Общее количество вызванных активаций, индуцированных протоколом аудиостимуляции у каждого участника. (c) Процент стимулов, приведших к вызванным активациям у каждого участника. Красная пунктирная линия на панелях (a–c) указывает среднее значение по группе. (d) Распределение громкости звуковых стимулов, использованных для вызова активаций, объединенное по всем пациентам. 90 дБ была наиболее часто используемой громкостью для вызова активаций. (e) Количество вызванных активаций у каждого участника во время эпох, оцененных как стадия 2 NREM (N2) и стадия 3 (N3) сна. Активации, перекрывающие переходы между стадиями, были исключены из подсчетов по конкретным стадиям для обеспечения стабильной классификации состояния сна. (f) Общая частота активаций, включая как вызванные звуком активации, так и спонтанные активации независимо от аудиостимуляции, в течение первой и второй половин ночи сна. Значительно большее число активаций происходило в течение первой половины ночи, когда применялся протокол аудиостимуляции (кривая знаковых рангов Уилкоксона, p = 000118, d Клиффа = 0,46). Данные представлены в виде индивидуальных значений пациентов. Пациенты с эпилепсией височной доли (TLE; желтые кружки) и экстратемпоральной эпилепсией (ETLE; темно-синие кружки) различаются для визуального сравнения. Никаких устойчивых различий в частоте активаций между подгруппами TLE и ETLE не наблюдалось в первую и вторую половины ночи. Эти результаты подтвердили эффективность протокола аудиостимуляции у пациентов с эпилепсией.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Полисомнография (PSG) и стерео-ЭЭГ (SEEG) — это комплексные методы регистрации электрической активности мозга и физиологических показателей сна, позволяющие точно отслеживать структуру сна и моменты пробуждений.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Длительность вызванных микропробуждений в среднем равнялась 7.8 ± 3.3 с (диапазон 3–15 с) (Рис. S2a). Чаще они возникали во время стадий N2 (14.7 ± 7.0, диапазон 1–3), чем в глубокой фазе N3 (5.2 ± 6.4, диапазон 0–29) (Рис. 2e). Важно отметить, что общая частота пробуждений — включая как вызванные звуком, так и спонтанные события — оказалась статистически значимо выше в первой половине ночи, когда проводилась стимуляция (27.0 ± 9.5 событий/час [медиана и межквартильный размах], диапазон 11.5–74.3 событий/час), по сравнению со второй половиной (18.0 ± 10.2 событий/час, диапазон 5.8–52.4 событий/час) (критерий знаковых рангов Уилкоксона, p = 0.00118, d Клиффа = 0.46, n = 17, Рис. 2f). Полученные данные подтверждают, что выбранный метод звуковой стимуляции успешно усиливает фрагментацию сна в исследованной группе.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Слуховая стимуляция во время сна у 17 пациентов с эпилепсией вызвала в среднем 25.9 ± 9.8 микропробуждений на человека (31.6% стимулов), что значительно увеличило фрагментацию сна в первой половине ночи (27.0 против 18.0 событий/час, p = 0.00118).&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vyzvannye-mikroprobuzhdeniya-ostro-uvelichivayut-kolichestvo-mezhpristupnyh-epileptiformnyh-razryadov,-no-ne-ih-prostranstvennoe-rasprostranenie\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#vyzvannye-mikroprobuzhdeniya-ostro-uvelichivayut-kolichestvo-mezhpristupnyh-epileptiformnyh-razryadov,-no-ne-ih-prostranstvennoe-rasprostranenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызванные микропробуждения остро увеличивают количество межприступных эпилептиформных разрядов, но не их пространственное распространение&lt;/span&gt;&lt;/a&gt;Вызванные микропробуждения остро увеличивают количество межприступных эпилептиформных разрядов, но не их пространственное распространение&lt;/h4&gt;\n&lt;p&gt;В исследовании оценивалось влияние кратковременных пробуждений во сне, вызванных звуковой стимуляцией, на эпилептическую активность. Межприступные эпилептиформные разряды (IED) регистрировались на биполярных каналах стерео-ЭЭГ (SEEG) с помощью валидированного детектора. Медианное число SEEG-каналов, задействованных в анализе IED, составило 2 (межквартильный размах, IQR 5; диапазон 1–135) (Рис. S2b); общие данные по частоте IED у пациентов за ночь приведены в Таблице S2. Подсчет IED производился по уникальным событиям в 3-секундных эпохах в четырех условиях: окна до стимуляции и после начала пробуждения для стимулов, вызвавших пробуждение, а также сопоставимые контрольные окна для звуковых стимулов, не вызвавших пробуждения (Рис. 1c). Сравнение вызванных пробуждений с контролем позволило изолировать специфический эффект пробуждений на локальные разряды независимо от звука. Чтобы убедиться, что 3-секундные эпохи до стимуляции отражают исходный уровень, их сравнили со случайно выбранными эпохами без пробуждений за всю ночь с использованием обобщенной линейной смешанной модели (GLMM). Различий выявлено не было (GLMM, β-оценка ± стандартная ошибка (SE): -0.052 ± 0.027, P = 0.053, Рис. S3), что подтвердило репрезентативность базового уровня IED.&lt;/p&gt;\n&lt;p&gt;Для оценки изменений межприступной спайковой активности между условиями (вызванное пробуждение против контроля) применялась GLMM с поправкой на исходный уровень IED и интенсивность стимула, а также со случайными интерсептами для SEEG-контактов, вложенных в пациентов (n = 17 пациентов, Рис. 3). Анализ выявил значимый эффект условия: прогнозируемое количество IED при вызванных пробуждениях оказалось существенно выше, чем в контроле (GLMM, β-оценка ± SE: 0.537 ± 0.012, отношение частот (IRR) = 1.71, p &amp;lt; 0.0001), что соответствует увеличению прогнозируемого числа IED на 71% (Рис. 3d). Разведочная стратификация по типу эпилепсии, статусу МРТ и категории МРТ-поражений показала аналогичный визуальный тренд во всех подгруппах (Рис. S4). Исключая вероятность того, что наблюдаемый рост IED обусловлен исходным состоянием мозга, более благоприятным для пробуждения, авторы сравнили эпохи до стимуляции в обоих условиях с учетом интенсивности стимула и не нашли значимых различий (GLMM, β-оценка ± SE: 0.019 ± 0.014, IRR = 1.02, P = 0.182, Рис. S5).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-f3.jpg\" alt=\"Рисунок 3. Вызванные пробуждения во сне увеличивают количество межприступных эпилептиформных разрядов (IED), но не их ра\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Рисунок 3. Вызванные пробуждения во сне увеличивают количество межприступных эпилептиформных разрядов (IED), но не их распространение. (a) Репрезентативный пример полисомнографических (PSG) треков одного пациента, показывающий каналы ЭЭГ скальпа, электроокулографии (EOG) и электромиографии (EMG) с подбородка и передней большеберцовой мышцы (LFlex). Желтая затененная область указывает на вызванную активацию, индуцированную звуковым стимулом, обозначенным красной полосой. (b) Соответствующие треки SEEG из того же временного окна от глубинного электрода, направленного на левую височную долю (биполярные каналы LTP1-LTP10). Заметное увеличение IED наблюдается в период активации (желтая затененная область) после аудиостимуляции. (c) Пространственное распределение контактов SEEG у всех пациентов (n = 17 пациентов), проецированное на стандартный шаблон мозга. (d) Предсказанное моделью среднее количество IED на канал-эпоху в условиях контроля и вызванной активации, скорректированное по количеству IED до стимула и интенсивности стимула. Предсказанное количество IED было значительно выше во время вызванных активаций, чем в контрольных условиях (обобщенная линейная смешанная модель (GLMM), оценка β ± стандартная ошибка (SE): 0,537 ± 0,012, отношение частоты возникновения (IRR) = 1,71, p &amp;lt; 0,0001), что соответствует увеличению на 71% по сравнению с контролем. (e) Предсказанное моделью количество каналов распространения IED на эпох в условиях контроля и вызванной активации, скорректированное по количеству каналов распространения до стимула и интенсивности стимула. Количество каналов распространения существенно не различалось между вызванными активациями и контролем (GLMM, оценка β ± SE: 0,212 ± 0,408, IRR = 1,24, P = 0,604). Пластины ошибок представляют 95% доверительные интервалы. **&lt;em&gt;p &amp;lt; 0,001.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Вызванные пробуждения увеличивают количество межприступных эпилептиформных разрядов на 71% (IRR = 1.71, p &amp;lt; 0.0001) и высокочастотных осцилляций на 70%, не влияя при этом на их пространственное распространение.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Спонтанные пробуждения также сопровождались умеренным, но значимым ростом прогнозируемого числа IED (GLMM, β-оценка ± SE: 0.046 ± 0.010 SE, IRR = 1.05, p &amp;lt; 0.0001, Рис. S6a). Аналогичным образом оценивались высокочастотные осцилляции (HFO): их прогнозируемое количество при вызванных пробуждениях было значительно выше контрольных значений (GLMM, β-оценка ± SE: 0.530 ± 0.014, IRR = 1.70, p &amp;lt; 0.0001, Рис. S7), демонстрируя прирост на 70%, зеркально повторяя паттерн IED. Эти данные доказывают, что пробуждения остро усиливают IED и HFO, что нельзя объяснить только звуковой стимуляцией.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SEEG (стереоэлектроэнцефалография) — метод инвазивного мониторинга биоэлектрической активности мозга с помощью электродных глубинных зондов, а GLMM — статистический метод анализа данных, учитывающий как общие закономерности, так и индивидуальные различия между пациентами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Затем исследователи изучили, влияют ли вызванные пробуждения на пространственное распространение IED, что позволило оценить вовлечение крупномасштабных эпилептических сетей (n = 17). Каналом распространения считался любой SEEG-канал, где IED фиксировался в пределах 120 мс от исходного IED. Количество каналов распространения моделировалось с помощью GLMM с поправкой на исходные показатели и интенсивность стимула, со случайным интерсептом для каждого пациента. В отличие от эффекта на частоту разрядов, число каналов распространения достоверно не отличалось между вызванными пробуждениями и контролем (GLMM, β-оценка ± SE: 0.212 ± 0.408 SE, IRR = 1.24, P = 0.604, Рис. 3e). Спонтанные пробуждения также не показали значимых различий по числу каналов распространения (GLMM, β-оценка ± SE: 0.109 ± 0.317 SE, IRR = 1.12, P = 0.733, Рис. S6b). Таким образом, пробуждения повышают локальную корковую возбудимость и частоту спайков, но не активируют более широкие сети, необходимые для генерализованного распространения IED.&lt;/p&gt;\n&lt;h4 id=\"globalnye-mezhpristupnye-spajki-usilivayutsya-vo-vremya-inducirovannoj-stimulyaciej-fragmentacii-sna\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#globalnye-mezhpristupnye-spajki-usilivayutsya-vo-vremya-inducirovannoj-stimulyaciej-fragmentacii-sna\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Глобальные межприступные спайки усиливаются во время индуцированной стимуляцией фрагментации сна&lt;/span&gt;&lt;/a&gt;Глобальные межприступные спайки усиливаются во время индуцированной стимуляцией фрагментации сна&lt;/h4&gt;\n&lt;p&gt;Далее исследователи проверили, распространяются ли острые эффекты вызванных пробуждений на более длительные временные интервалы. Для этого они сопоставили общие показатели межприступных эпилептиформных разрядов (IED) на уровне пациентов в течение фазы медленнного сна (NREM) между первой половиной ночи, когда звуковая стимуляция вызывала фрагментацию сна, и второй половиной, когда стимуляция прекращалась для обеспечения восстановительного сна. Нормализованная частота IED оказалась существенно выше в условиях фрагментации сна, вызванной стимуляцией (0.80 ± 0.56 событий/мин, медиана ± межквартильный размах, диапазон 0.32–1.50 событий/мин), по сравнению с периодами без стимуляции (0.72 ± 0.48 событий/мин, диапазон 0.25–1.44 событий/мин) (критерий знаковых рангов Уилкоксона, p = 0.017, d Клиффа = 0.15, n = 17, Рис. 8a).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-f8.jpg\" alt=\"Рисунок 8. Временная динамика межприступных эпилептиформных разрядов (МЭР) во время вызванных пробуждений. (a-c) Гистогр\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 8. Временная динамика межприступных эпилептиформных разрядов (МЭР) во время вызванных пробуждений. (a-c) Гистограммы на уровне группы, отображающие временное распределение МЭР относительно начала арузола и слухового стимула, нормализованные по максимальному значению каждого пациента (ширина бина: 500 мс) и усредненные по всем пациентам, причем групповые данные представлены как среднее ± стандартная ошибка. Количество МЭР в базовый период до начала сравнивалось с таковым в каждом бине после начала с помощью односторонних тестов Манна-Уитни (n = 17 пациентов, значимые бины (p &amp;lt; 0.05) отмечены звездочками). (a) Количество МЭР значительно увеличивалось после начала вызванных пробуждений (красная пунктирная линия), достигая пика через 0.5-1 с после начала пробуждения. (b) При выравнивании по началу слуховых стимулов количество МЭР также значительно увеличивалось во время вызванных пробуждений, достигая пика через 2-2.5 с после начала стимула. Наложенная черная кривая (правая ось) показывает процент активных пробуждений во времени. (c) Во время контрольных (не вызывающих пробуждения) слуховых стимулов никакой значимой модуляции количества МЭР после начала стимула не наблюдалось, что указывает на то, что увеличение МЭР, наблюдаемое в (b), было специфичным для вызванных пробуждений. (d) Количество МЭР, нормализованное по количеству контактов SEEG у каждого пациента, значительно увеличивалось с продолжительностью пробуждения (обобщенная линейная смешанная модель (GLMM), β-оценка ± стандартная ошибка (SE): 0.078 ± 0.006 в секунду, p &amp;lt; 0.0001), подтверждая, что более длительные пробуждения связаны с большим количеством МЭР. (e) Напротив, частота МЭР значительно снижалась с продолжительностью пробуждения (GLMM, β-оценка ± SE: –0.051 ± 0.006 в секунду, p &amp;lt; 0.0001), что предполагает, что, хотя более длительные пробуждения содержат больше МЭР, они происходят с постепенно уменьшающейся частотой по ходу пробуждения. (f) Таламическая спектральная активность связана с количеством МЭР, связанных с пробуждением. Анализ подгруппы из четырех пациентов с таламо-SEEG электродами (n = 56 пробуждений во время сна N2) показал, что более высокое отношение спектральной мощности таламуса (δ/(θ+α+β) ((0.5–4 Гц)/(4.5–30 Гц))) было связано с меньшим нормализованным количеством МЭР (GLMM, β-оценка ± SE: –0.081 ± 0.035 на 1.0 увеличение отношения спектральной мощности, P = 0.022), что указывает на то, что сдвиг в сторону более быстрых таламических ритмов во время пробуждений связан с большей межприступной спайковой активностью. Каждая точка на панелях (d-f) представляет одно событие пробуждения, объединенное по пациентам, а затененные области представляют 95% доверительные интервалы вокруг подгонки модели.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Фрагментация сна, вызванная звуковой стимуляцией, приводит к общему повышению частоты межприступных разрядов в течение всей ночи (0.80 против 0.72 событий/мин, p = 0.017).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Данная закономерность подтвердилась и при анализе случайно выбранных 3-секундных базовых эпох без пробуждений на протяжении всей ночи: нормализованное количество IED было значительно выше при искусственной фрагментации сна, чем в контрольные периоды (GLMM, β-оценка ± стандартная ошибка: -0.112 ± 0.003, отношение частот = 0.89, p &amp;lt; 0.0001, Рис. 8b). Это соответствует снижению числа IED на 10.6% при прекращении звуковой стимуляции. Полученные результаты свидетельствуют о том, что масштабное нарушение макроструктуры сна, провоцируемое звуковыми сигналами, связано с усилением глобальной активности IED на протяженных временных отрезках, выходящих за рамки непосредственного окна пробуждения.&lt;/p&gt;\n&lt;h4 id=\"mezhpristupnye-spajki,-inducirovannye-probuzhdeniem,-zavisyat-ot-anatomicheskoj-oblasti\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#mezhpristupnye-spajki,-inducirovannye-probuzhdeniem,-zavisyat-ot-anatomicheskoj-oblasti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Межприступные спайки, индуцированные пробуждением, зависят от анатомической области&lt;/span&gt;&lt;/a&gt;Межприступные спайки, индуцированные пробуждением, зависят от анатомической области&lt;/h4&gt;\n&lt;p&gt;Затем ученые задались вопросом, зависит ли стимулированное пробуждениями увеличение IED от конкретной анатомической области мозга. С этой целью они сопоставили IED, зарождающиеся в мезиотемпоральных контактах SEEG (включая гиппокамп, парагиппокампальную извилину, энторинальную кору и миндалевидное тело), с разрядами в неокортексе (Рис. 4a, b). Такое сравнение позволило выяснить, различается ли реакция между мезиотемпоральными и неокортикальными зонами, которые вовлечены в эпилептический процесс через различные механизмы и имеют разную функциональную связь с таламусом — ключевой структурой регуляции сна.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-f4.jpg\" alt=\"Рисунок 4. Увеличение межприступных эпилептиформных разрядов (IED), связанное с активацией, происходит в неокортикальных\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4. Увеличение межприступных эпилептиформных разрядов (IED), связанное с активацией, происходит в неокортикальных, но не в мезиотемпоральных областях. (a) Схема, выделяющая две анатомические категории, использованные для регионального анализа: сопоставлялись мезиотемпоральные (зеленый) и неокортикальные (оранжевый) области. (b) Пространственное распределение контактов SEEG у всех пациентов (n = 17 пациентов), проецированное на стандартный шаблон мозга, с указанием расположения мезиотемпоральных (зеленый) и неокортикальных (оранжевый) контактов. (c) Предсказанное моделью среднее количество IED на канал-эпоху по анатомической области (мезиотемпоральная против неокортикальной) в условиях контроля и вызванной активации, скорректированное по количеству IED до стимула и интенсивности стимула. Взаимодействие между условием и анатомической областью было значимым (обобщенная линейная смешанная модель (GLMM), оценка β ± стандартная ошибка (SE): 0,737 ± 0,041, отношение частоты возникновения (IRR) = 2,09, p &amp;lt; 0,0001), что указывает на то, что эффект вызванных активаций на количество IED различался между мезиотемпоральными и неокортикальными областями. В мезиотемпоральных областях (n = 14 пациентов) предсказанное количество IED существенно не различалось между вызванными активациями и контролем (GLMM, оценка β ± SE: -0,087 ± 0,039, IRR = 0,92, P = 0,054). В неокортикальных областях (n = 17 пациентов) предсказанное количество IED было значительно выше во время вызванных активаций, чем в контроле (GLMM, оценка β ± SE: 0,650 ± 0,013, IRR = 1,92, p &amp;lt; 0,0001), что соответствует увеличению на 92%. Пластины ошибок представляют 95% доверительные интервалы. *** p &amp;lt; 0,001.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SEEG (стереоэнцефалография) — метод инвазивного мониторинга мозговой активности с помощью электродов, введенных глубоко в ткани мозга для точного определения очага эпилепсии.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для анализа исследователи смоделировали количество IED на один канально-эпохальный интервал с помощью обобщенной линейной смешанной модели (GLMM). В качестве фиксированных эффектов учитывались состояние (вызванное пробуждение против контроля), анатомическая область (мезиотемпоральная против неокортикальной) и их взаимодействие, с поправкой на исходный уровень IED до стимуляции и интенсивность стимула, а также со случайными перехватываниями для контакта SEEG, вложенного в пациента. Анализ выявил значимое взаимодействие между состоянием и анатомической областью (GLMM, β-оценка ± SE: 0.737 ± 0.041, IRR = 2.09, p &amp;lt; 0.0001, Рис. 4c), что указывает на разный характер влияния пробуждений на частоту IED в этих зонах.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Вызванные пробуждения вызывают выраженный рост IED в неокортексе (+92%, p &amp;lt; 0.0001), тогда как в мезиотемпоральных областях значимых изменений не наблюдается (p = 0.054).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Постхок-контрасты показали, что у пациентов с ≥ 3 мезиотемпоральными каналами (n = 14) прогнозируемое количество IED в мезиотемпоральных областях достоверно не отличалось между вызванными пробуждениями и контролем (β-оценка = -0.087 ± 0.039, IRR = 0.92, P = 0.054, Рис. 4c). Напротив, в неокортексе (n = 17 пациентов) зарегистрировано значимое увеличение прогнозируемого числа IED на 92% во время вызванных пробуждений по сравнению с контролем (β-оценка = 0.650 ± 0.013, IRR = 1.92, p &amp;lt; 0.0001, Рис. 4c).&lt;/p&gt;\n&lt;p&gt;Чтобы проверить, распространяется ли эта региональная избирательность на спонтанные пробуждения, авторы применили аналогичную модель GLMM. Она также показала значимое взаимодействие между состоянием и анатомической областью (GLMM, β-оценка = 0.455 ± 0.030, IRR = 1.58, p &amp;lt; 0.0001, Рис. 9). Однако, в отличие от результатов с вызванными пробуждениями, спонтанные пробуждения сопровождались значимым снижением прогнозируемого числа IED в мезиотемпоральных областях на 27% относительно контроля (β-оценка = -0.320 ± 0.028, IRR = 0.73, p &amp;lt; 0.0001) наряду с небольшим, но значимым ростом на 14% в неокортексе (β-оценка = 0.135 ± 0.011, IRR = 1.14, p &amp;lt; 0.0001).&lt;/p&gt;\n&lt;p&gt;Аналогичный анализ для высокочастотных осцилляций (HFO) выявил значимое взаимодействие для вызванных пробуждений (GLMM, β-оценка = 0.664 ± 0.050, IRR = 1.94, p &amp;lt; 0.0001, Рис. 10). При этом в мезиотемпоральных зонах количество HFO не имело достоверных отличий от контроля (β-оценка = -0.054 ± 0.048, IRR = 0.95, P = 0.511), а в неокортексе наблюдался значимый рост на 84% (β-оценка = 0.610 ± 0.015, IRR = 1.84, p &amp;lt; 0.0001), что полностью повторяет картину для IED. Таким образом, межприступная активность (IED и HFO) при искусственных пробуждениях преимущественно усиливается в неокортексе, тогда как мезиотемпоральные структуры остаются интактными. При этом спонтанные пробуждения оказывают противоположный эффект на мезиотемпоральные зоны, снижая их активность, что подчеркивает различия в механизмах реагирования мозга в зависимости от типа пробуждения.&lt;/p&gt;\n&lt;h4 id=\"mezhpristupnaya-spajkovaya-aktivnost,-svyazannaya-s-probuzhdeniem,-ne-moduliruetsya-zonoj-nachala-pristupov\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#mezhpristupnaya-spajkovaya-aktivnost,-svyazannaya-s-probuzhdeniem,-ne-moduliruetsya-zonoj-nachala-pristupov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Межприступная спайковая активность, связанная с пробуждением, не модулируется зоной начала приступов&lt;/span&gt;&lt;/a&gt;Межприступная спайковая активность, связанная с пробуждением, не модулируется зоной начала приступов&lt;/h4&gt;\n&lt;p&gt;Далее исследователи проверили, отличаются ли вызванные пробуждениями всплески межприступной эпилептиформной активности (IED) на контактах стереоэлектроэнцефалографии (SEEG), расположенных внутри зоны начала приступов (SOZ), от контактов за ее пределами (Рис. 5a, b). Сама SOZ определялась клинически по самым ранним изменениям на электроэнцефалограмме в момент старта приступа. Этот подход позволил выяснить, реагирует ли SOZ как функциональный электрографический регион иначе на пробуждения, чем окружающие ткани, способна ли она модулировать эти всплески или остается невосприимчивой к временным изменениям состояния мозга. Для пациентов, у которых удалось четко выделить SOZ не менее чем в n = 3 каналах SEEG (n = 12 человек), применили обобщенную линейную смешанную модель (GLMM). В качестве фиксированных эффектов учитывали условие (вызванное пробуждение против контроля), статус SOZ (вне или внутри) и их взаимодействие, делая поправку на базовый уровень IED до стимуляции и интенсивность стимула, а также включая случайные пересечения для контактов SEEG, вложенных в пациента.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-f5.jpg\" alt=\"Рисунок 5. Увеличение межприступных эпилептиформных разрядов (IED), связанное с активацией, не модулируется зоной начала\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5. Увеличение межприступных эпилептиформных разрядов (IED), связанное с активацией, не модулируется зоной начала приступов (SOZ). (a) Схема, показывающая анатомическую классификацию контактов SEEG: сопоставлялись IED, возникающие в зонах SOZ (красный) и областях вне SOZ (синий). (b) Пространственное распределение контактов SEEG у всех пациентов с идентифицированной SOZ (n = 12), проецированное на стандартный шаблон мозга, с указанием расположения контактов SOZ (красный) и вне SOZ (синий). (c) Предсказанное моделью среднее количество IED на канал-эпоху по статусу SOZ (вне против внутри SOZ) в условиях контроля и вызванной активации, скорректированное по количеству IED до стимула и интенсивности стимула. Взаимодействие между условием и статусом SOZ не было значимым (обобщенная линейная смешанная модель (GLMM), оценка β ± стандартная ошибка (SE): 0,005 ± 0,026, отношение частоты возникновения (IRR) = 1,00, P = 1,00), что указывает на то, что эффект вызванных активаций на количество IED не различался между контактами внутри и вне SOZ. Пластины ошибок представляют 95% доверительные интервалы.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Анализ не выявил значимого взаимодействия между условием и статусом SOZ (GLMM, оценка коэффициента β ± SE: 0.005 ± 0.026, IRR = 1.00, P = 1.00, Рис. 5). Это говорит о том, что влияние искусственных пробуждений на число IED существенно не различалось внутри зоны начала приступов и за ее пределами, из-за чего апостериорные контрасты отдельно для этих областей не проводились.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;GLMM (обобщенная линейная смешанная модель) и IRR (отношение частот) — статистические методы для анализа сложных медицинских данных сгруппированного типа, учитывающие индивидуальные особенности каждого пациента.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для спонтанных пробуждений также не зафиксировали значимого взаимодействия между условием и статусом SOZ (GLMM, оценка коэффициента β = -0.025 ± 0.021, IRR = 0.98, P = 0.940, Рис. SN 11). Аналогичная картина наблюдалась для высокочастотных осцилляций (HFO): для вызванных пробуждений взаимодействия между условием и статусом SOZ тоже не было (GLMM, оценка коэффициента β = -0.056 ± 0.030, IRR = 0.95, P = 0.239, Рис. SN 12). Совокупность этих данных демонстрирует, что подъем межприступной активности, включая IED и HFO, при пробуждении происходит одинаково как в SOZ, так и за ее границами, то есть зона начала приступов не оказывает специфического влияния на сдвиги активности мозга, вызванные пробуждениями.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Зона начала приступов (SOZ) не контролирует и не модулирует подъем эпилептических всплесков (IED и HFO) при пробуждениях — этот прирост происходит равномерно по всему мозгу (P = 1.00 для вызванных и P = 0.940 для спонтанных пробуждений).&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"epileptiformnaya-aktivnost-pri-probuzhdeniyah-zavisit-ot-stadii-sna\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#epileptiformnaya-aktivnost-pri-probuzhdeniyah-zavisit-ot-stadii-sna\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эпилептиформная активность при пробуждениях зависит от стадии сна&lt;/span&gt;&lt;/a&gt;Эпилептиформная активность при пробуждениях зависит от стадии сна&lt;/h4&gt;\n&lt;p&gt;Затем ученые захотели узнать, зависит ли влияние пробуждений на частоту IED от конкретной стадии сна, в которой они происходят. Они сопоставили пробуждения, приходящиеся на 2-ю (N2) и 3-ю (N3) стадии медленноволнового сна (Рис. 6a), которые отражают разные уровни синхронности нейронов и возбудимости коры. Стадия N2 представляет собой более легкий сон с сонными веретенами и К-комплексами, тогда как N3 характеризуется высокоамплитудной низкочастотной (0.5-2 Гц) дельта-активностью и сниженной реакцией коры. Применив аналогичную модель GLMM с фиксированными эффектами для условия, стадий сна (N2 против N3) и их взаимодействия, а также с поправками на исходный уровень IED и силу стимула, исследователи обнаружили значимое взаимодействие между условием и стадией сна (GLMM, оценка коэффициента β ± SE: -0.271 ± 0.031, IRR = 0.76, p &amp;lt; 0.0001, Рис. 6b). Это доказало, что реакция IED на вызванные пробуждения различается между стадиями N2 и N3.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-f6.jpg\" alt=\"Рисунок 6. Увеличение частоты межприступных эпилептиформных разрядов (МЭР), связанных с активацией (арузолом), зависит о\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 6. Увеличение частоты межприступных эпилептиформных разрядов (МЭР), связанных с активацией (арузолом), зависит от стадии сна. (a) Схематические гипнограммы с выделенными стадиями медленноволнового сна NREM 2 (N2) и 3 (N3) в течение первой половины ночи, определяемой как первые 4 часа после привычного времени отхода ко сну каждого пациента, когда проводился протокол слуховой стимуляции. Вызванные пробуждения (арузолы), возникающие во время сна N2 и N3, сопоставлялись для оценки влияния стадий сна на вызванные арузолом межприступные эпилептиформные разряды (МЭР). (b) Предсказанное моделью среднее количество МЭР на эпох-канал в зависимости от стадии сна (сон N2 против N3) в условиях контроля и вызванного пробуждения, скорректированное с учетом количества МЭР до стимуляции и интенсивности стимула. Взаимодействие между условием и стадией сна было значимым (обобщенная линейная смешанная модель (GLMM), β-оценка ± стандартная ошибка (SE): -0.271 ± 0.031, отношение частот инцидентов (IRR) = 0.76, p &amp;lt; 0.0001), что указывает на то, что влияние вызванных пробуждений на количество МЭР различалось между сном N2 и N3, что соответствует на 24% меньшему увеличению в N3 по сравнению с N2. Во сне N2 (n = 16 пациентов) предсказанное количество МЭР было значительно выше во время вызванных пробуждений, чем в контрольных условиях (GLMM, β-оценка ± SE: 0.718 ± 0.017, IRR = 2.05, p &amp;lt; 0.0001). Во сне N3 (n = 13 пациентов) предсказанное количество МЭР также было значительно выше во время вызванных пробуждений, чем в контроле, хотя и с меньшей амплитудой, чем в N2 (GLMM, β-оценка ± SE: 0.447 ± 0.026, IRR = 1.56, p &amp;lt; 0.0001). Пластинки погрешностей представляют 95% доверительные интервалы. *** p &amp;lt; 0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Эффекты различаются в зависимости от типа пробуждения: вызванные и спонтанные пробуждения демонстрируют противоположные тенденции в стадиях N2 и N3.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В частности, прирост числа IED, связанный с вызванным пробуждением, в стадии N3 был примерно на 24% меньше, чем в стадии N2. Апостериорные сравнения показали, что прогнозируемое число IED оказалось значительно выше во время вызванных пробуждений по сравнению с контролем как в N2 (n = 16 пациентов; оценка коэффициента β = 0.718 ± 0.017, IRR = 2.05, p &amp;lt; 0.0001, Рис. 6b), так и в N3 (n = 13 пациентов; оценка коэффициента β = 0.447 ± 0.026, IRR = 1.56, p &amp;lt; 0.0001, Рис. 6b), хотя этот скачок был существенно мощнее на стадии N2.&lt;/p&gt;\n&lt;p&gt;Проверка для спонтанных пробуждений с помощью идентичной GLMM выявила значимое взаимодействие между условием и стадией сна (GLMM, оценка коэффициента β = 0.089 ± 0.029, IRR = 1.09, P = 0.0075, Рис. SN 13). Прогнозируемое число IED также было выше при спонтанных пробуждениях относительно контроля на стадии N2 (оценка коэффициента β = 0.143 ± 0.015, IRR = 1.15, p &amp;lt; 0.0001) и на стадии N3 (оценка коэффициента β = 0.232 ± 0.025, IRR = 1.26, p &amp;lt; 0.0001). Примечательно, что для спонтанных пробуждений прирост IED на стадии N3 оказался на 10% больше, чем на стадии N2, что прямо противоположно результатам для вызванных пробуждений.&lt;/p&gt;\n&lt;p&gt;Для высокочастотных осцилляций (HFO) картина оказалась схожей с вызванными IED: зафиксировано значимое взаимодействие условия и стадии сна (GLMM, оценка коэффициента β = -0.275 ± 0.036, IRR = 0.76, p &amp;lt; 0.0001, Рис. SN 14). Предсказанное число HFO при вызванных пробуждениях превосходило контроль в обеих стадиях — N2 (оценка коэффициента β = 0.758 ± 0.020, IRR = 2.13, p &amp;lt; 0.0001) и N3 (оценка коэффициента β = 0.483 ± 0.030, IRR = 1.62, p &amp;lt; 0.0001), причем рост в N3 был на 24% ниже, чем в N2, полностью повторяя закономерность для IED.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Пробуждения усиливают эпилептическую активность как в N2, так и в N3, но при искусственной стимуляции этот рост на 24% слабее в N3, тогда как для спонтанных пробуждений подъем в N3, наоборот, на 10% выше, чем в N2.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Обобщая результаты, авторы отмечают, что пробуждения подстегивают эпилептические проявления в обеих фазах сна (N2 и N3), однако относительный масштаб этого эффекта зависит от стадии. Для вызванных пробуждений подъем IED и HFO был выраженнее в N2, что согласуется с более высокой возбудимостью коры и уязвимостью сетей на этой стадии. С другой стороны, обратная картина для спонтанных пробуждений (больший рост в N3) намекает на то, что механизмы, стоящие за естественными и искусственными пробуждениями, обладают разной чувствительностью к структуре сна.&lt;/p&gt;\n&lt;h4 id=\"vliyanie-tipa-otveta-na-stimul-i-delta-aktivnosti-do-stimula-na-mezhpristupnye-spajki\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#vliyanie-tipa-otveta-na-stimul-i-delta-aktivnosti-do-stimula-na-mezhpristupnye-spajki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Влияние типа ответа на стимул и дельта-активности до стимула на межприступные спайки&lt;/span&gt;&lt;/a&gt;Влияние типа ответа на стимул и дельта-активности до стимула на межприступные спайки&lt;/h4&gt;\n&lt;p&gt;Авторы стремились выяснить, связано ли усиление межприступных эпилептиформных разрядов (IED) при пробуждениях непосредственно с самим пробуждением или с сопутствующим медленноволновым ответом, а также влияет ли фоновая дельта-активность до стимула на электрофизиологическую и эпилептиформную реакцию. Для этого оценивалось, является ли рост IED специфичным исключительно для классических быстрых пробуждений или отражает более широкую нестабильность медленных колебаний при стимуляции. Дополнительно проверялось, предсказывает ли уровень дельта-активности вероятность пробуждения и последующего скачка IED. Для анализа использовали обобщенные линейные смешанные модели (GLMM). В исследование вошли 17 пациентов, так как стимулы без видимой ЭЭГ-реакции наблюдались лишь у 4 человек и были исключены. В качестве фиксированного эффекта оценивали отношение спектральной мощности до стимула в диапазоне дельта к сумме мощности тета, альфа и бета волн (δ / [θ + α + β], частоты 0.5--4 Гц против 4.5--30 Гц), с поправкой на интенсивность стимуляции и исходное число IED, а также с учетом случайных перехватов для SEEG-контактов внутри пациентов. Распределение этого показателя мощности оказалось схожим для обоих типов ответа (Рис. 7a), что подтвердилось статистически: предобработанное соотношение спектральных мощностей не было связано с вероятностью возникновения именно пробуждения по сравнению с изолированной медленной волной (GLMM, оценка коэффициента ± SE: 0.032 ± 0.014, P = 0.052, Рис. 7b).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-f7.jpg\" alt=\"Рисунок 7. Межприступные эпилептиформные разряды (МЭР) в первую очередь обусловлены реакциями активации (арузолами), а н\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 7. Межприступные эпилептиформные разряды (МЭР) в первую очередь обусловлены реакциями активации (арузолами), а не изолированными медленными волнами, причем предстимульная дельта-активность оказывает специфическое для условий модулирующее воздействие. (a) Гистограммы, отображающие распределение предстимульного отношения спектральной мощности (δ/(θ+α+β) ((0.5–4 Гц)/(4.5–30 Гц), с логарифмическим преобразованием по основанию 10), предшествующего слуховым стимулам, которые приводили к изолированным медленным волнам и арузолам с медленными волнами. (b) Предсказанная моделью вероятность реакции пробуждения на стимуляцию в зависимости от предстимульного отношения спектральной мощности, скорректированная с учетом интенсивности стимула и исходного количества МЭР до стимуляции. Предстимульное отношение спектральной мощности не было связано с вероятностью реакции пробуждения по сравнению с реакцией в виде изолированной медленной волны (обобщенная линейная смешанная модель (GLMM), β-оценка ± стандартная ошибка (SE): 0.032 ± 0.014, P = 0.052). (c) Предсказанное моделью среднее количество МЭР для изолированных медленных волн и арузолов с медленными волнами. Арузолы с медленными волнами были связаны со значительно более высоким количеством МЭР по сравнению с изолированными медленными волнами (GLMM, β-оценка ± SE: 0.542 ± 0.012, отношение частот инцидентов (IRR) = 1.72, p &amp;lt; 0.0001), что соответствует увеличению количества МЭР на 72%. (d) Взаимодействие между типом ответа и предстимульным отношением спектральной мощности также было значимым (GLMM, β-оценка ± SE: -0.073 ± 0.013, IRR = 0.93, p &amp;lt; 0.0001). Постхок-анализ простых наклонов показал, что более высокое предстимульное отношение спектральной мощности значительно увеличивало количество МЭР во время изолированных медленных волн (GLMM, β-оценка ± SE = 0.066 ± 0.009, IRR = 1.07, p &amp;lt; 0.0001), что соответствует увеличению количества МЭР на 7% на каждые 1.0 пункта увеличения предстимульного отношения спектральной мощности. Напротив, предстимульное отношение спектральной мощности не влияло на количество МЭР после запуска арузола (GLMM, β-оценка ± SE = -0.007 ± 0.012, IRR = 0.99, P = 1). Пластинки погрешностей и затененные области представляют 95% доверительные интервалы. *** p &amp;lt; 0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GLMM (обобщенная линейная смешанная модель) — это статистический метод для анализа данных со сложной структурой, учитывающий как общие для всех тенденции, так и индивидуальные особенности каждого пациента или электрода.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Затем с помощью GLMM изучили влияние типа ответа на число IED и роль фонового соотношения спектральных мощностей как модулятора этой связи. Модель включала тип ответа (изолированная медленная волна против пробуждения с медленноволновой активностью), показатель дельта-мощности и их взаимодействие, с поправкой на исходные IED и интенсивность стимула. Пробуждения с медленноволновой активностью сопровождались значительно большим числом IED по сравнению с изолированными медленными волнами (GLMM, оценка ± SE: 0.542 ± 0.012, IRR = 1.72, p &amp;lt; 0.0001, Рис. 7c), что соответствует росту числа IED на 72%. Взаимодействие между типом ответа и спектральным соотношением также оказалось значимым (GLMM, оценка ± SE: -0.073 ± 0.013, IRR = 0.93, p &amp;lt; 0.0001, Рис. 7d). Это означает, что характер связи между дельта-активностью до стимула и количеством IED зависел от типа вызванного ответа. Дополнительный анализ простых наклонов показал, что после изолированной медленной волны более высокий уровень дельта-мощности был связан с большим числом IED (оценка = 0.066 ± 0.009, IRR = 1.07, p &amp;lt; 0.0001, Рис. 7d), давая прирост IED на 7% на каждую единицу увеличения дельта-показателя. Иными словами, доминирование дельта-ритма в отсутствие пробуждения усиливало эпилептиформную активность. Напротив, после пробуждения связи между исходной дельта-активностью и числом IED не наблюдалось (оценка = -0.007 ± 0.012, IRR = 0.99, P = 1, Рис. 7d), то есть при развитии пробуждения число IED не зависело от предшествующего состояния дельта-ритма. Следовательно, фоновая дельта-активность действует как специфический модулятор: она облегчает рост IED после изолированных медленных волн, но не влияет на них при возникновении пробуждения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Пробуждения вызывают увеличение числа IED на 72% по сравнению с изолированными медленными волнами (IRR = 1.72, p &amp;lt; 0.0001), а исходная дельта-активность модулирует этот эффект избирательно, усиливая спайки только в отсутствие пробуждения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Учитывая обнаруженную зависимость, авторы проверили, не выступает ли дельта-активность до стимула скрытым фактором-конфлаундером (искажающей переменной) между типом ответа и числом IED, применив анализ чувствительности с оценкой изменения коэффициентов. Включение дельта-активности практически не изменило оценку эффекта типа ответа на IED при сравнении не скорректированной модели (GLMM, оценка ± SE: 0.538 ± 0.012, IRR = 1.71, p &amp;lt; 0.0001) с моделью с поправкой на дельта-мощность (GLMM, оценка ± SE: 0.537 ± 0.012, IRR = 1.71, p &amp;lt; 0.0001). Более того, сам по себе показатель дельта-мощности не был значимым независимым предиктором числа IED в скорректированной модели (оценка = 0.009 ± 0.005, IRR = 1.01, P = 0.081). Эти данные демонстрируют, что дельта-активность до стимула не является главным искажающим фактором в данной связи, подтверждая, что именно тип ответной реакции мозга, а не исходное фоновое состояние, служит основным пусковым механизмом эпилептиформной активности в ответ на стимуляцию.&lt;/p&gt;\n&lt;h4 id=\"vliyanie-intensivnosti-stimula-na-chastotu-mezhpristupnyh-razryadov\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#vliyanie-intensivnosti-stimula-na-chastotu-mezhpristupnyh-razryadov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Влияние интенсивности стимула на частоту межприступных разрядов&lt;/span&gt;&lt;/a&gt;Влияние интенсивности стимула на частоту межприступных разрядов&lt;/h4&gt;\n&lt;p&gt;Чтобы исключить вероятность того, что сама интенсивность стимула определяет количество межприступных разрядов (IED), авторы проанализировали контрольные эпохи, когда звуковые стимулы не приводили к улавливаемой реакции активации (пробуждения). В таких контрольных периодах интенсивность стимула коррелировала с небольшим, но статистически значимым ростом числа IED (обобщенная линейная смешанная модель или GLMM, коэффициент β ± SE: 0.0056 ± 0.0005, отношение частот IRR = 1.006, p &amp;lt; 0.0001, Рис. 15a): прирост составлял 0.6% на каждый децибел увеличения громкости.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Небольшое увеличение числа IED на 0.6% на 1 дБ в контроле не объясняет масштабных изменений при пробуждениях, так как их взаимодействие статистически незначимо.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тем не менее, взаимодействие между типом события (вызванное пробуждение против контроля) и интенсивностью стимула оказалось незначимым (GLMM, коэффициент β ± SE: -0.0004 ± 0.0006, IRR = 1.00, P = 0.514, Рис. 15b). Это доказывает, что резкий скачок IED при вызванных пробуждениях представляет собой качественное изменение состояния мозга, не зависящее от громкости звука. Дополнительно у пациентов с электродами SEEG в таламусе (n = 4 человека) интенсивность стимула не влияла на сдвиги спектральной мощности таламуса в контрольных эпохах (GLMM, коэффициент β ± SE: -0.008 ± 0.009, P = 0.382, Рис. 15c), подтверждая отсутствие скрытых изменений без реакции пробуждения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GLMM (обобщенная линейная смешанная модель) — это статистический метод для анализа сложных медицинских данных, учитывающий как общие тенденции группы, так и индивидуальные особенности каждого пациента.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Полученные данные показывают: хотя в контроле фиксируется микроприрост IED (вероятно, из-за подпороговых реакций или прямой сенсорной стимуляции, не видимой на полисомнограмме), этот эффект никак не масштабируется и не объясняет тот мощный скачок эпилептиформной активности, который наблюдается при реальных пробуждениях.&lt;/p&gt;\n&lt;h4 id=\"vremennaya-dinamika-epileptiformnoj-aktivnosti-pod-vliyaniem-probuzhdenij\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#vremennaya-dinamika-epileptiformnoj-aktivnosti-pod-vliyaniem-probuzhdenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Временная динамика эпилептиформной активности под влиянием пробуждений&lt;/span&gt;&lt;/a&gt;Временная динамика эпилептиформной активности под влиянием пробуждений&lt;/h4&gt;\n&lt;p&gt;Разобравшись с тем, как межприступные эпилептиформные разряды (IED) нарастают в моменты кратковременных пробуждений, ученые перешли к анализу временной динамики этого феномена. Исследователей интересовало, зависят ли количество и тайминг IED от длительности пробуждения, а также привязаны ли эти всплески строго к моменту перехода в бодрствование или распределены по всей его длительности. Для этого у 17 пациентов проанализировали временное распределение IED относительно начала пробуждения и звукового стимула, нормировав показатели на максимальное значение для каждого участника и объединив данные в бины по 500 мс (Рис. 8a-c). По сравнению с исходным уровнем до пробуждения, частота IED резко возрастала сразу после его начала и держалась на повышенном уровне в течение 4.5 с постпробужденного периода (односторонние тесты Манна — Уитни, p &amp;lt; 0.05, Рис. 8a), достигая пика на отметке 0.5–1 с после старта пробуждения. Распределение IED по пациентам подтверждало склонность разрядов концентрироваться в самом начале пробуждения, что говорит о быстром скачке корковой возбудимости в первые секунды с ее последующей стабилизацией (Рис. Рис. 16). При привязке к звуковым стимулам IED также значительно учащались во время вызванных пробуждений, выдавая пик примерно через 2–2.5 с после подачи сигнала (односторонние тесты Манна — Уитни, p &amp;lt; 0.05, Рис. 8b). Доля активных пробуждений во времени в точности повторяла эту траекторию, доказывая жесткую временную сцепку между активацией при пробуждении и скачками IED. Напротив, контрольные звуковые стимулы, не вызывавшие пробуждения, никак не влияли на активность IED (односторонние тесты Манна — Уитни, p &amp;gt; 0.05, Рис. 8c), подтверждая, что наблюдаемый рост связан именно с корковой активацией при пробуждении, а не с самим звуком.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Бины — это отрезки или интервалы времени (в данном случае по 500 миллисекунд), на которые исследователи разбивают непрерывный поток данных для удобства подсчета и построения графиков.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для оценки связи между длительностью пробуждения и эпилептиформной активностью авторы объединили данные всех пробуждений и связанных с ними IED по 17 пациентам и применили обобщенные линейные смешанные модели (GLMM). В качестве независимой переменной выступала длительность пробуждения, а зависимой — нормированное количество IED или их частота. Выяснилось, что общее количество IED значимо росло с увеличением длительности пробуждения (GLMM, оценка коэффициента бета ± стандартная ошибка: число IED увеличивалось на 0.078 ± 0.006 с каждой секундой пробуждения, p &amp;lt; 0.0001, Рис. 8b). Это указывает на то, что более долгие пробуждения сопровождаются большим суммарным объемом межприступной активности. Любопытно, что общая частота IED в расчете на секунду на протяжении всего пробуждения, наоборот, снижалась (GLMM, оценка коэффициента бета ± стандартная ошибка: частота IED падала на 0.051 ± 0.006 с⁻¹ с каждой дополнительной секундой пробуждения, p &amp;lt; 0.0001, Рис. 8c). Иными словами, хотя в затяжных пробуждениях суммарно происходит больше разрядов, они идут с постепенно замедляющейся скоростью по мере развития состояния. В совокупности эти результаты показывают, что старт пробуждения запускает кратковременную вспышку эпилептической активности, которая затухает по мере стабилизации бодрствования под воздействием динамических колебаний возбудимости коры.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Начало пробуждения провоцирует мгновенный пик эпилептиформных разрядов в первые 0.5–1 с, а общее число IED растет с длительностью пробуждения (на 0.078 на каждую секунду, p &amp;lt; 0.0001), хотя их секундная частота постепенно падает.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Наконец, авторы проверили, можно ли объяснить рост межприступной активности процессами таламокортикальной активации. Для этого провели подгрупповой анализ среди 4 пациентов, которым в рамках стереоэлектроэнцефалографии (SEEG) имплантировали электроды непосредственно в таламус. С помощью GLMM проверили, связана ли спектральная мощность таламуса с количеством IED во время пробуждений на стадии N2 (n = 56), где ранее фиксировали максимальный прирост разрядов. Нормированное количество IED по всем каналам SEEG моделировали как функцию отношения спектральных мощностей таламуса: соотношение медленных дельта-волн к более быстрым ритмам тета, альфа и бета — δ/(θ+α+β) в диапазоне [0.5–4 Гц] / [4.5–30 Гц], рассчитанное за 3-секундную эпоху пробуждения относительно исходного уровня. Выявилась значимая отрицательная связь между этим спектральным отношением таламуса и количеством IED (GLMM, оценка коэффициента бета ± стандартная ошибка: число IED снижалось на 0.081 ± 0.035 с ростом отношения на 1.0, P = 0.022, Рис. 8f). Следовательно, те пробуждения, в которых относительная доля медленной дельта-активности была ниже (что указывает на сдвиг в сторону более быстрых таламических ритмов), сопровождались бóльшим числом разрядов IED. Эти данные демонстрируют механистическую связь между таламическими маркерами пробуждения и проявлением межприступной эпилептической активности через ускорение ритмов таламуса, облегчающее возбудимость коры.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Выводы о роли таламуса основаны на углубленном анализе подгруппы всего из 4 пациентов (56 пробуждений на стадии N2), что требует осторожности при экстраполяции на всю популяцию людей с эпилепсией.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;h4 id=\"rol-mikrostruktury-sna-v-modulyacii-epilepticheskoj-aktivnosti\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#rol-mikrostruktury-sna-v-modulyacii-epilepticheskoj-aktivnosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Роль микроструктуры сна в модуляции эпилептической активности&lt;/span&gt;&lt;/a&gt;Роль микроструктуры сна в модуляции эпилептической активности&lt;/h4&gt;\n&lt;p&gt;Полученные данные убедительно доказывают, что микроструктура сна и спонтанные либо вызванные микропробуждения выступают мощными динамическими модуляторами межприступной эпилептиформной активности. Применяя комбинированную регистрацию интракраниальной электроэнцефалографии и полисомнографии совместно с контролируемой звуковой стимуляцией для целенаправленного изменения стабильности сна, авторы продемонстрировали, что вызванные пробуждения остро стимулируют патологические разряды в специфических нейрональных сетях. Хотя тесная двунаправленная связь между эпилепсией и нарушениями сна известна давно, именно экспериментальная индукция микропробуждений позволила впервые получить прямые причинно-следственные доказательства того, что транзиторная нестабильность сна напрямую провоцирует немедленный рост частоты межприступных эпилептиформных разрядов. Данный закономерный эффект распространяется как на высокочастотные осцилляции, так и на естественные спонтанные пробуждения, не связанные со зв
