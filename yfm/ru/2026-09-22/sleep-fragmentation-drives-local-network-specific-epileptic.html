уковым воздействием.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Транзиторные микропробуждения во время сна вызывают немедленный скачок частоты межприступных разрядов и высокочастотных осцилляций, подтверждая причинную роль нестабильности сна в активизации патологической сетевой динамики.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Интересно, что при резком увеличении числа межприступных разрядов характер их пространственного распространения остается неизменным. Это указывает на то, что фрагментация сна влияет на генерацию разрядов локально, не вовлекая в процесс обширные мозговые структуры. Подобный феномен объясняется кратковременным локальным повышением корковой возбудимости, чему служит подтверждением тот факт, что усиление эпилептиформной активности наблюдается исключительно в неокортикальных зонах и полностью отсутствует в мезиальных отделах височной доли. При этом рост числа разрядов одинаково выражен как в зоне начала приступов, так и в окружающих интактных тканях, что свидетельствует об отсутствии преимущественного вовлечения эпилептогенной зоны в транзиторные колебания возбудимости.&lt;/p&gt;\n&lt;h4 id=\"vliyanie-stadij-sna-i-talamokortikalnyh-mehanizmov\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#vliyanie-stadij-sna-i-talamokortikalnyh-mehanizmov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Влияние стадий сна и таламокортикальных механизмов&lt;/span&gt;&lt;/a&gt;Влияние стадий сна и таламокортикальных механизмов&lt;/h4&gt;\n&lt;p&gt;Эффект стимуляции межприступных разрядов пробуждениями демонстрирует выраженную зависимость от стадии ночного отдыха: подобная динамика фиксируется и в медленном сне стадий N2, и в стадии N3, однако в стадии N2 эффект выражен гораздо сильнее. Это напрямую согласуется с более мощной таламокортикальной синхронизацией на данной стадии, которая благоприятствует генерации эпилептических паттернов. Анализ данных пациентов с электродами в ядрах таламуса показал, что более высокая скорость таламокортикальной активности во время микропробуждений в стадии N2 коррелирует с большим количеством межприступных разрядов. Хотя фоновая дельта-активность сама по себе способствует появлению разрядов в ответ на изолированные медлноволновые события, этот локальный модулирующий эффект полностью подавляется развивающимся пробуждением, что выдвигает микропробуждения на роль главного драйвера эпилептических проявлений при фрагментированном сне.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Таламокортикальная синхронизация — согласованная ритмическая активность между таламусом и корой головного мозга, которая особенно сильна в стадии N2 и способствует усилению эпилептических разрядов при пробуждениях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"dinamika-vozbudimosti-kory-i-lokalnye-mehanizmy-generacii-razryadov\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#dinamika-vozbudimosti-kory-i-lokalnye-mehanizmy-generacii-razryadov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Динамика возбудимости коры и локальные механизмы генерации разрядов&lt;/span&gt;&lt;/a&gt;Динамика возбудимости коры и локальные механизмы генерации разрядов&lt;/h4&gt;\n&lt;p&gt;Моментальное увеличение количества разрядов в ответ на пробуждение отражает резкий сдвиг корковой возбудимости, связанный с быстрым переходом между состояниями сна и бодрствования. Подобные переходы способны временно нарушать хрупкий баланс между возбуждением и торможением в кортикальных сетях, создавая гипервозбудимую среду, идеальную для формирования разрядов. Поскольку пробуждения длятся недолго, вызываемый ими подъем возбудимости оказывается недостаточным для запуска полноценного эпилептического приступа — чем и объясняется их отсутствие на фоне пробуждений при одновременном росте межприступной активности. Пиковые значения частоты разрядов фиксируются сразу после начала пробуждения и быстро снижаются по мере его развития, подтверждая жесткую временную привязку межприступной активности к начальной фазе дестабилизации сна.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдаемые эффекты получены в специализированной выборке пациентов с фармакорезистентной эпилепсией во время интракраниального мониторинга, поэтому их нельзя автоматически переносить на общую популяцию здоровых людей или пациентов с другими формами патологии.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Вопреки первоначальным гипотезам исследователей, вызванные и спонтанные пробуждения никак не влияли на пространственное распространение разрядов, несмотря на стабильное увеличение их общего числа. Такие разнонаправленные эффекты доказывают, что микропробуждения регулируют исключительно локальные процессы генерации межприступной активности, не преодолевая порог, необходимый для вовлечения более широких сетей. Данный результат подчеркивает принципиальное различие механизмов зарождения и трансляции эпилептиформных паттернов: если для старта разряда достаточно локальных сиюминутных колебаний возбудимости коры, то для его дальнейшего распространения требуется глобальная, скоординированная активность удаленных друг от друга областей мозга.&lt;/p&gt;\n&lt;h4 id=\"regionalnye-osobennosti-i-vliyanie-stadij-sna-na-epileptiformnuyu-aktivnost\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#regionalnye-osobennosti-i-vliyanie-stadij-sna-na-epileptiformnuyu-aktivnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Региональные особенности и влияние стадий сна на эпилептиформную активность&lt;/span&gt;&lt;/a&gt;Региональные особенности и влияние стадий сна на эпилептиформную активность&lt;/h4&gt;\n&lt;p&gt;Региональные различия в росте частоты межприступных эпилептиформных разрядов (IED) при пробуждениях объясняются вариациями таламокортикальной коннективности. Неокортекс, получающий плотные таламические проекции, демонстрировал увеличение IED во время вызванных пробуждений, тогда как в мезиотемпоральных областях значимого эффекта не наблюдалось из-за более слабой связи с таламусом. Спонтанные пробуждения также сопровождались ростом IED в неокортексе, но их снижением в мезиотемпоральных структурах. Подавление IED в мезиотемпоральной зоне при спонтанных пробуждениях может отражать различия в центральных и периферических компонентах между типами пробуждений: слуховые стимулы задействуют сенсорные пути, противодействующие десинхронизации сети.&lt;/p&gt;\n&lt;p&gt;Анализ подмножества пациентов с таламическими SEEG-электродами подтвердил эту региональную специфичность: пробуждения с более быстрой таламической активностью коррелировали с большим количеством IED. Это указывает на то, что преходящая таламокортикальная активация избирательно стимулирует пики в неокортексе. Если гиппокамп связан с передними ядрами таламуса через круг Пейпеца, участвующий в памяти, то неокортикальная активация поддерживается системами регуляции состояния коры (срединные и интраламинарные ядра). Подобные механизмы объясняют региональные различия, однако будущие работы требуют более детальной локализации таламических ядер и учета локальных паттернов, таких как медленноволновая активность.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Рост IED при пробуждениях носит регионально специфичный характер: неокортекс показывает увеличение разрядов благодаря сильным таламокортикальным связям, тогда как мезиотемпоральные зоны реагируют иначе.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сравнение зон внутри эпилептогенной зоны (SOZ) и вне ее показало сопоставимый рост IED, что говорит о глобальном сетевом феномене, а не о локальной селективной амплификации в очаге приступа. Реакция IED зависела от стадии сна: в фазе N2 эффект был значительно сильнее, чем в N3. Фаза N2 характеризуется большей нестабильностью, циклическими альтернирующими паттернами (CAP) и частыми пробуждениями, тогда как N3 отражает более стабильный синхронизированный сон с меньшим вовлечением таламуса. Интересно, что спонтанные пробуждения вызывали больший рост IED в N3 по сравнению с N2, указывая на разную чувствительность типов пробуждений к состоянию сна.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Фаза N2 сна — это легкая и менее стабильная стадия NREM-сна, характеризующаяся высокой нестабильностью дельта-активности и частыми микропробуждениями CAP, что облегчает возникновение эпилептических разрядов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vzaimodejstvie-probuzhdenij,-delta-aktivnosti-i-intensivnosti-stimulov\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#vzaimodejstvie-probuzhdenij,-delta-aktivnosti-i-intensivnosti-stimulov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Взаимодействие пробуждений, дельта-активности и интенсивности стимулов&lt;/span&gt;&lt;/a&gt;Взаимодействие пробуждений, дельта-активности и интенсивности стимулов&lt;/h4&gt;\n&lt;p&gt;Авторы исследовали, чем именно вызвано усиление IED — самим ответом на пробуждение или фоновой медленноволновой активностью. Полные пробуждения коры приводили к значительно большему числу IED, чем изолированные медленноволновые ответы, доказывая, что дополнительная кортикальная активация играет ключевую роль. Для изолированных медленных волн более выраженное доминирование дельта-состояния до стимула предсказывало рост IED. Однако после наступления пробуждения фоновое дельта-состояние переставало играть роль, так как пробуждение оказывало доминирующее влияние на возбудимость коры, перекрывая фоновые колебания.&lt;/p&gt;\n&lt;p&gt;Интенсивность слухового стимула оказывала лишь небольшое дозозависимое влияние на IED в контрольные периоды, но рост IED при пробуждениях происходил независимо от нее. Отсутствие изменений в спектре таламуса при этом говорит о том, что стимул модулирует активность через сенсорную обработку и подпороговую активацию ствола мозга, а не через таламокортикальную модуляцию пробуждения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдаемые эффекты на эпилептиформную активность получены в условиях клинического мониторинга пациентов с фармакорезистентной эпилепсией; вариабельность параметров сна и стимуляции требует дальнейшего изучения на более крупных выборках.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"klinicheskie-posledstviya-i-perspektivy-korrekcii\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#klinicheskie-posledstviya-i-perspektivy-korrekcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Клинические последствия и перспективы коррекции&lt;/span&gt;&lt;/a&gt;Клинические последствия и перспективы коррекции&lt;/h4&gt;\n&lt;p&gt;Полученные данные расширяют понимание связей сна и эпилепсии, показывая, что пробуждения действуют как острые динамические возмущения, дестабилизирующие возбудимость коры. Частые IED во сне нарушают консолидацию памяти, ухудшают когнитивные функции и могут ускорять забывание или служить проэпилептогенными событиями, снижающими порог для судорог. Ночные приступы связаны с риском SUDEP (внезапной неожиданной смерти при эпилепсии). Выявление пробуждений как модифицируемого триггера открывает новые пути терапии: скрининг и лечение апноэ во сне, применение препаратов, поддерживающих непрерывность сна без разрушения архитектуры NREM, а также технологии замкнутого цикла (closed-loop) для подавления нестабильности сети в реальном времени. Особое внимание следует уделять стабилизации фазы N2, а не только медленноволнового сна N3. Учитывая роль IED при болезни Альцгеймера, активное устранение фрагментации сна может снизить риск судорог и когнитивных нарушений.&lt;/p&gt;\n&lt;h4 id=\"ogranicheniya-issledovaniya-i-perspektivy\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#ogranicheniya-issledovaniya-i-perspektivy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения исследования и перспективы&lt;/span&gt;&lt;/a&gt;Ограничения исследования и перспективы&lt;/h4&gt;\n&lt;p&gt;Наша работа намеренно включала разнородную группу пациентов с различными клиническими проявлениями, чтобы выявить универсальные эффекты стабильности сна на эпилептическую активность и повысить применимость выводов. В когорту вошли пациенты как с разнообразными структурными нарушениями, так и с отрицательными результатами МРТ, при этом гистопатологическое подтверждение имелось не у всех. Из-за такой гетерогенности и небольшого числа участников в отдельных подгруппах статистический анализ для оценки вариации региональных эффектов в зависимости от конкретного поражения или субстрата не проводился, а формулировка окончательных выводов по подтипам эпилепсии выходила за рамки работы. Тем не менее, результаты служат надежной базой для будущих многоцентровых исследований с крупными выборками и достаточным представлением редких субстратов. Зона начала приступов (SOZ) определялась по стандартным клиническим электрографическим критериям по самым ранним иктальным изменениям, поэтому она может не совпадать с истинной эпилептогенной зоной и является функциональным конструктом областей, вовлеченных в запуск приступов. Другим ограничением стало то, что исследование выполнено на пациентах с фармакорезистентной эпилепсией — единственной группой, где внутричерепные электроды имплантируются по клиническим показаниям, из-за чего выводы могут не распространяться на пациентов с контролируемой формой болезни. Влияние плотности электродов сглаживалось ограничением основного анализа активными каналами с межприступными эпилептиформными разрядами (IED) и применением обобщенных линейных смешанных моделей (GLMM) на уровне каналов, однако стратегия имплантации определялась клиницистами и могла неравномерно охватывать эпилептическую сеть. В будущем сочетание канальных мер активности с тканевыми маркерами поможет точнее разграничить эти аспекты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Исследование проведено исключительно на пациентах с тяжелой фармакорезистентной эпилепсией с интракраниальными электродами, а выявленные паттерны могут не переноситься на более легкие формы заболевания.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Наконец, хотя наш план позволил изучить эффекты микропробуждений на IED прямее, чем прошлые обсервационные работы, мы признаем двунаправленность связи: IED также способны вызывать пробуждения, а фоновое состояние мозга влияет на это взаимодействие. Будущие работы должны объединить поведенческие тесты с одновременной регистрацией сна и ЭГГ для прояснения последствий роста IED на память и когнитивные функции, открывая путь к методам коррекции последствий нарушений сна при эпилепсии.&lt;/p&gt;\n&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;p&gt;В заключение, наша работа предоставляет новые доказательства того, что транзиторная нестабильность сна, в частности вызванные микропробуждениями состояния NREM-сна, способна остро усиливать межприступную активность при фармакорезистентной эпилепсии. Экспериментально управляя стабильностью сна с высокой временной точностью, мы показали, что стимуляция IED микропробуждениями избирательна анатомически и функционально — она наблюдается в неокортексе и сильнее выражена в фазе N2. Кроме того, мы продемонстрировали, что микропробуждения увеличивают нагрузку межприступными спайками, но не влияют на их пространственное распространение. Это указывает на то, что спайки, связанные с пробуждением, отражают повышенную локальную возбудимость коры без достаточного вовлечения крупномасштабных сетей, давая важные механистические подсказки о процессах генерации и распространения эпилептических феноменов. Полученные данные подчеркивают потенциал парадигм на основе сна как мощного инструмента для изучения динамики сетей при эпилепсии и иных патологических состояниях мозга. Наша работа также выделяет сон как перспективную терапевтическую мишень для нейромодуляции, способную снизить эпилептическую нагрузку и улучшить когнитивный статус пациентов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Вызванные микропробуждения в фазе N2 избирательно усиливают локальную межприступную активность в неокортексе при фармакорезистентной эпилепсии, не меняя при этом масштаб пространственного распространения разрядов.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"otbor-pacientov\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#otbor-pacientov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Отбор пациентов&lt;/span&gt;&lt;/a&gt;Отбор пациентов&lt;/h4&gt;\n&lt;p&gt;В исследование привлекли взрослых пациентов с лекарственно-устойчивой фокальной эпилепсией, которым перед операцией проводили стереоэлектроэнцефалографию (СЭЭГ). Набор участников вели с мая по январь 2025 года в двух центрах: Монреальском неврологическом институте и больнице (MNI) и Комплексном эпилептическом центре Дьюка (DCEC), всего отобрали 20 человек. Троих пациентов исключили из итогового анализа: у двоих возникли технические проблемы с протоколом звуковой стимуляции, а у одного зафиксировали аномальные паттерны сна, из-за чего стадирование сна оказалось ненадежным. В финальную выборку вошли 17 пациентов (8 женщин, 14 правшей, средний возраст 37.2 ± 8.1 года; Таблица SN), из них 10 человек представляли MNI, а 7 — DCEC. Проведение работы одобрили комитеты по этике MNI (2021-7516) и системы здравоохранения Университета Дьюка (Pro00113635), у каждого участника взяли письменное информированное согласие.&lt;/p&gt;\n&lt;h4 id=\"zapisi-seeg-i-polisomnografii\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#zapisi-seeg-i-polisomnografii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Записи СЭЭГ и полисомнографии&lt;/span&gt;&lt;/a&gt;Записи СЭЭГ и полисомнографии&lt;/h4&gt;\n&lt;p&gt;Все участники прошли совмещенную регистрацию СЭЭГ и полисомнографии (ПСГ). Внутричерепные глубинные электроды для СЭЭГ имплантировали с целью локализации эпилептогенной зоны, причем их расположение определяли клинические бригады в MNI и DCEC. Сигналы СЭЭГ оцифровывали с частотой 2048 Гц относительно референтного электрода над теменной долей контралатерально предполагаемой эпилептогенной зоне, используя систему Neuroworkbench (Nihon Kohden, Токио, Япония) в MNI или усилитель Natus Quantum LTM в DCEC (Natus Medical Inc., Миддлтон, Висконсин, США). В MNI сигналы СЭЭГ фильтровали высокочастотным фильтром на 0.08 Гц и низкочастотным на 600 Гц, а в DCEC — на 0.01 Гц и 1000 Гц соответственно. ПСГ и звуковую стимуляцию проводили на раннем этапе прехирургического обследования, спустя как минимум 48 часов после установки электродов СЭЭГ, когда пациенты продолжали принимать полный курс противоэпилептических препаратов или перенесли лишь незначительное, клинически обоснованное снижение дозировок в рамках обычной помощи. Полисомнография включала ЭЭГ кожи головы по стандартной системе 10-20 (F3, F4, C3, C4, O1, O2, M1, M2), записанную с помощью подкожных тонких проводковых электродов, установленных при операции, а также поверхностную электроокулографию (ЭОГ) и электромиографию (ЭМГ) подбородка и передней большеберцовой мышцы для облегчения стадирования сна. Во время анализируемых сеансов стимуляции эпилептических приступов не наблюдалось.&lt;/p&gt;\n&lt;h4 id=\"protokol-zvukovoj-stimulyacii\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#protokol-zvukovoj-stimulyacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Протокол звуковой стимуляции&lt;/span&gt;&lt;/a&gt;Протокол звуковой стимуляции&lt;/h4&gt;\n&lt;p&gt;Целью звуковой стимуляции было провоцирование микропробуждений согласно рекомендациям Американской ассоциации расстройств сна. Звуковые стимулы представляли собой чистые тоны частотой 1 кГц длительностью 5 секунд с громкостью от 40 до 100 дБ. Стимулы подавали вручную через высококачественные внутриушные наушники-трубки (ER3C, Etyomic, Иллинойс, США) в течение первой половины ночи, определяемой как 4 часа от привычного времени отхода коснуться сна участника, что позволяло точно доставлять звуки и минимизировать внешние шумовые помехи на ЭЭГ. Непрерывный мониторинг ПСГ в реальном времени вели исследователи, обученные стадированию сна (SH, AH), чтобы оценивать стадию сна и направлять подачу стимулов, в том числе подтверждая успешность вызова пробуждения. Такая оценка опиралась на визуальный осмотр текущей активности ЭЭГ, ЭОГ и ЭМГ по стандартным критериям Американской академии медицины сна. Стимуляцию начинали после 5 минут стабильного медленноволнового сна (NREM), отмеченного появлением сонного веретена или K-комплекса, причем громкость звука плавно повышали до наступления пробуждения. Протокол применяли как в NREM-, так и в REM-сон для максимизации пробуждений при оценке в реальном времени; тем не менее, основные анализы сосредоточили на NREM-сне из-за его доказанной роли в усилении эпилептической активности и потому, что многие пациенты не доходили до REM-сна из-за фрагментации сна, вызванной стимуляцией. Если стимуляция приводила к полному пробуждению, протокол останавливали и возобновляли с более низкой громкости (на -10 дБ) спустя 2 минуты стабильного сна по сонным веретенам, K-комплексам или быстрым движениям глаз на ПСГ. Если стимуляция вызывала пробуждение, следующий стимул давали на той же громкости после 2 минут стабильного сна, а если пробуждения не происходило — следующий стимул подавали через 10 секунд с увеличенной громкостью (+10 дБ). Доказано, что данный протокол увеличивает индекс пробуждений до 20 событий в час без влияния на общую продолжительность сна.&lt;/p&gt;\n&lt;h4 id=\"ocenka-sna-i-detekciya-mikroprobuzhdenij\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#ocenka-sna-i-detekciya-mikroprobuzhdenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оценка сна и детекция микропробуждений&lt;/span&gt;&lt;/a&gt;Оценка сна и детекция микропробуждений&lt;/h4&gt;\n&lt;p&gt;Стадии сна и микропробуждения (arousals) оценивались вручную в соответствии со стандартными критериями Американской академии медицины сна (AASM). Анализ основывался на данных полисомнографии (ПСГ), включая электроэнцефалограмму (ЭЭГ) кожи головы, электроокулограмму (ЭОГ) и электромиограмму (ЭМГ). Разметку выполняли квалифицированные специалисты, не имевшие доступа к данным внутримочевой стерео-ЭЭГ (SEEG) (SH, LP-D). Сон размечался на 30-секундные эпохи, каждая из которых классифицировалась как стадия N1, N2, N3, REM или бодрствование на основе характерных паттернов ЭЭГ, ЭОГ и ЭМГ. Микропробуждение определялось как резкий сдвиг частоты ЭЭГ, включающий альфа-, тета-ритмы и/или частоты выше 16 Гц (за исключением сонных веретен), длительностью от 3 до 15 с, которому предшествовало не менее 10 с стабильного сна. Пробуждения классифицировались в зависимости от стадии сна, в которой они возникали.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Полисомнография (ПСГ) — это комплексный метод регистрации физиологических параметров во время сна (ЭЭГ, ЭОГ, ЭМГ и др.), позволяющий точно определять архитектуру сна и эпизоды микропробуждений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Микропробуждения, появившиеся в пределах 6.5 с от начала звукового стимула, считались вызванными. Данное временное окно учитывало 5-секундную длительность подачи стимула и дополнительные 1.5 с на задержку между стимуляцией и проявлением пробуждения. Пробуждения вне этого окна классифицировались как спонтанные и анализировались отдельно для проверки того, являются ли эффекты специфичными именно для звуковых пробуждений или общими для спонтанных. Вся разметка стадий сна и пробуждений была верифицирована сертифицированным неврологом со специализацией в сомнологии (BF, LP-D).&lt;/p&gt;\n&lt;h4 id=\"vybor-epoh\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#vybor-epoh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Выбор эпох&lt;/span&gt;&lt;/a&gt;Выбор эпох&lt;/h4&gt;\n&lt;p&gt;Для оценки влияния микропробуждений на межприступные эпилептиформные разряды (IED) авторы проанализировали четыре различные 3-секундные эпохи на каналах SEEG, привязанные по времени к каждому событию звуковой стимуляции у всех пациентов (Рис. 1c). Эти временные окна были выбраны для регистрации кратковременных изменений эпилептической активности сразу до и после звукового стимула и начала пробуждения. Длительность в 3 секунды обеспечила временное разрешение, достаточное для улавливания быстрых изменений IED, минимизации наложения последовательных событий и сохранения временной специфичности. Такой интервал выбран для захвата локального микросостояния сна вокруг стимула и пробуждения, а не долгосрочной динамики сна, что согласуется с предыдущими работами по периараузальной нейродинамике.&lt;/p&gt;\n&lt;p&gt;Для стимулов, успешно вызвавших пробуждения, извлекались предстимульный базовый уровень (3-секундная эпоха перед началом стимула) и окно вызванного пробуждения (3-секундная эпоха с момента начала пробуждения). Для контроля эффектов звука без пробуждения были выделены еще две контрольные 3-секундные эпохи вокруг не вызвавших пробуждение стимулов: контрольная база (3 секунды перед стимулом) и контрольная эпоха длиной 3 с, начинающаяся через 1.08 с после начала стимула (соответствует медианной задержке от стимула до пробуждения по всем вызванным реакциям, IQR = 0.46–2.10 с, диапазон = 0.02–6.33 с). Такой дизайн позволил изолировать специфические эффекты пробуждений, контролируя неспецифическое влияние звука. Это дало возможность точно охарактеризовать эпилептическую динамику, связанную с пробуждениями. Для спонтанных пробуждений сопоставлялись 3-секундная эпоха от начала пробуждения и 3-секундная предпробужденческая база.&lt;/p&gt;\n&lt;h4 id=\"analiz-mezhpristupnyh-epileptiformnyh-razryadov\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#analiz-mezhpristupnyh-epileptiformnyh-razryadov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ межприступных эпилептиформных разрядов&lt;/span&gt;&lt;/a&gt;Анализ межприступных эпилептиформных разрядов&lt;/h4&gt;\n&lt;p&gt;Межприступные эпилептиформные разряды (IED) автоматически детектировались в выбранных эпохах на биполярных каналах SEEG с использованием ранее валидированного детектора с параметрами по умолчанию, который прошел независимую проверку нашей группой. Чтобы учесть различия между пациентами в плотности имплантации электродов, анализ ограничивался активными каналами — теми, где частота IED превышала 4.4 события/мин (уровень ложноположительных срабатываний детектора). Количество IED на канал в активных каналах SEEG моделировалось с помощью обобщенной линейной смешанной модели (GLMM).&lt;/p&gt;\n&lt;p&gt;Для оценки пространственного распространения IED исследователи подсчитывали число каналов распространения — количество каналов SEEG, вовлекаемых во время каждого независимого IED. Разряды считались независимыми, если они возникали на расстоянии не менее 120 мс друг от друга на любом канале. Первый обнаруженный IED в данной эпохе считался исходным (source IED), а любые дополнительные спайки на всех каналах SEEG в пределах 120 ms от него — распространяющимися (propagating IEDs). Подсчет IED на канал и числа распространяющихся каналов выполнялся отдельно для всех четырех предопределенных эпох (предостимульная база и окно пробуждения для стимулирующих пробуждение событий, а также предостимульная база и контрольное окно, согласованное по задержке, для не стимулировавших пробуждение). Высокочастотные осцилляции (HFO, &amp;gt;80 Гц) также автоматически детектировались на биполярных каналах SEEG в выбранных эпохах с помощью проверенного детектора, а их количество на канал моделировалось через GLMM.&lt;/p&gt;\n&lt;h4 id=\"analiz-moduliruyushih-faktorov\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#analiz-moduliruyushih-faktorov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ модулирующих факторов&lt;/span&gt;&lt;/a&gt;Анализ модулирующих факторов&lt;/h4&gt;\n&lt;p&gt;Чтобы изучить факторы, влияющие на связанные с пробуждением изменения межприступной активности, исследователи оценили влияние анатомической области мозга, вовлечения зоны начала приступов и стадии сна. Поскольку значимого эффекта пробуждений на распространение эпилептиформных разрядов не наблюдалось, дальнейший анализ модулирующих факторов проводился только для подсчета их количества. Локализация электродов выполнялась с помощью стандартных процедур совмещения изображений: КТ или МРТ после имплантации совмещались с дооперационными МРТ каждого пациента, которые затем нелинейно выравнивались по нелинейной симметричной модели мозга ICBM152. Это позволило точно определить положения электродов в едином стереотаксическом пространстве. Электродные каналы относили к анатомическим областям на основе атласа MICCAI, используя сферу радиусом 5 мм с центром в координатах каждого контакта. Каналы делились на мезиотемпоральные (включающие амигдалу, гиппокамп и энторинальную кору) и неокортикальные, чтобы отразить известные различия в функциональных связях с таламусом — ключевым регулятором сна. Неокортикальные области получают обширные таламокортикальные проекции, тогда как мезиотемпоральные связаны с таламусом менее плотно. Такое деление соответствовало предыдущим исследованиям глубинной ЭЭГ, изучавшим взаимодействия сна и эпилепсии. Количество межприступных разрядов рассчитывалось отдельно для разрядов, происходящих из неокортикальных и мезиотемпоральных зон.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мезиотемпоральные и неокортикальные зоны мозга различаются по плотности связей с таламусом, что объясняет разницу в их эпилептической активности во время сна.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Влияние зоны начала приступов на межприступную динамику при пробуждении оценивалось путем классификации разрядов в зависимости от того, возникали ли они внутри или вне этой зоны. Зону начала приступов для каждого пациента определял сертифицированный невролог-эпилептолог на основе клинических записей глубинной ЭЭГ. Начало приступа определялось как первое устойчивое ритмичное изменение на ЭЭГ, визуально отличимое от фоновой активности, а зона начала приступов включала контакты, демонстрирующие такую активность. Если фиксировалось несколько приступов, учитывалось стабильное вовлечение контактов во всех случаях. Каждый канал глубинной ЭЭГ маркировался как «зона начала приступов» или «вне зоны», что позволяло раздельно подсчитывать разряды в четырех 3-секундных интервалах, связанных с вызванным пробуждением и контрольными условиями. Пациенты с менее чем тремя каналами в любой из подгрупп (мезиотемпоральной, неокортикальной, в зоне или вне зоны) исключались из соответствующих видов анализа.&lt;/p&gt;\n&lt;p&gt;Для оценки зависимости изменений межприступной активности от стадии сна события разделяли в зависимости от стадии медленноволнового сна (NREM), во время которой они происходили. Аудиторные стимулы группировались по признаку их возникновения на стадии N2 или N3 в соответствии со стандартными критериями оценки сна. Пробуждения, приходящиеся на переходы между стадиями, исключались для обеспечения стабильности классификации. Количество разрядов по всем каналам рассчитывалось отдельно для каждой стадии сна в условиях вызванного пробуждения и контроля. Пациенты, у которых не было вызванных пробуждений или контрольных интервалов хотя бы на одной из стадий N2 или N3, исключались из этого анализа.&lt;/p&gt;\n&lt;p&gt;Для оценки влияния медленноволновой активности на модуляцию разрядов при пробуждении медленные волны автоматически определялись на биполярных каналах глубинной ЭЭГ с помощью ранее валидированного алгоритма. Ответы на стимулы классифицировались как пробуждения с медленноволновой активностью или изолированные ответы медленных волн в зависимости от того, была ли обнаружена медленная волна хотя бы на одном канале в течение 3-секундного интервала пробуждения или соответствующего по задержке контрольного интервала.&lt;/p&gt;\n&lt;h4 id=\"statisticheskij-analiz\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#statisticheskij-analiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистический анализ&lt;/span&gt;&lt;/a&gt;Статистический анализ&lt;/h4&gt;\n&lt;p&gt;Для оценки всех параметров межприступной эпилептиформной активности (IED), таких как общее количество IED и число каналов их распространения, исследователи сопоставили данные за четыре предопределенных трехсекундных интервала. В этот набор вошли: базовый отрезок перед звуковыми стимулами, вызвавшими пробуждения; окно вызванного пробуждения; базовый отрезок для контрольных стимулов, не приведших к пробуждению; а также контрольное окно с аналогичной латентностью для небудоражащих стимулов. Использование 3-секундных эпох дало возможность зафиксировать локальные микросостояния сна непосредственно перед подачей сигнала и в период пробуждения, опираясь на методологию прошлых SEEG-исследований. Чтобы убедиться, что показатели IED в трехсекундных престимульных интервалах точно отражают общую исходную активность пациентов, авторы провели сравнение нормализованных значений IED между такими интервалами и случайно отобранными эпохами той же длительности, лишенными пробуждений и распределенными по всей ночной записи. Для этого применялась обобщенная линейная смешанная модель (GLMM) с распределением Твиди и логарифмической функцией связи, где тип эпохи выступал в роли фиксированного фактора, а идентификатор пациента — случайного.&lt;/p&gt;\n&lt;p&gt;Количество IED моделировалось с помощью GLMM с отрицательным биномиальным распределением и логарифмической функцией связи, что оптимально подходит для анализа передисперсированных счетных данных. Основным фиксированным фактором интереса выступало условие (вызванное пробуждение по сравнению с контролем), а в качестве фиксированных ковариат учитывались исходное количество IED до стимула и интенсивность звука. Случайные пересечения задавались для контактов SEEG, вложенных в идентификаторы пациентов, для компенсации межличностной вариабельности и разброса между контактами. Среднее число каналов распространения IED анализировалось через гамма-GLMM с логарифмической связью, подходящую для непрерывных переменных с положительной асимметрией. Главным фиксированным фактором здесь также было условие эксперимента, ковариатами — исходные параметры распространения и интенсивность стимуляции, а случайным фактором — идентификатор пациента.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GLMM (обобщенные линейные смешанные модели) — это мощный статистический аппарат, который позволяет одновременно учитывать фиксированные закономерности для всей группы и индивидуальные особенности каждого пациента или отдельного электрода.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В рамках базового анализа вызванных пробуждений было построено четыре модели для подсчета IED: первая охватывала все активные каналы, а три последующие включали члены взаимодействия между условием и подгруппами модулирующих факторов. К таким факторам относились анатомическая зона мозга (мезиально-височная или неокортикальная кора), вовлеченность в зону начала приступов SOZ (внутри или вне SOZ) и стадия сна (N2 или N3), что позволило строго проверить зависимость эффекта пробуждения от этих параметров. Поскольку модель для каналов распространения не показала значимого влияния условий, дальнейший анализ факторов модуляции для распространения IED не проводился.&lt;/p&gt;\n&lt;p&gt;Для проверки того, распространяются ли выявленные закономерности на спонтанные пробуждения, были задействованы аналогичные архитектуры GLMM с отрицательным биномиальным распределением и гамма-распределением для оценки IED и путей их миграции с поправкой на исходный уровень. Дополнительно частоту высокочастотных осцилляций (HFO) во время вызванных пробуждений рассчитывали через отрицательную биномиальную GLMM с поправкой на базовые значения IED и интенсивность стимула, чтобы выяснить, затрагивает ли эффект пробуждений иные маркеры эпилептогенности. В анализ спонтанных пробуждений и HFO также включили те же самые факторы взаимодействия для поиска потенциальных модификаторов.&lt;/p&gt;\n&lt;p&gt;Чтобы исключить влияние исходных различий в состоянии мозга на рост IED при вызванных пробуждениях, исходный уровень IED промоделировали с помощью отдельной GLMM с отрицательным биномиальным распределением и логарифмической связью (условие как фиксированный фактор, интенсивность как ковариата, контакты и пациенты как случайные эффекты). Авторы также проверили, распространяется ли острый эффект пробуждений на более длительные временные интервалы. Для этого они сопоставили глобальные показатели IED у каждого пациента во время NREM-сна между первой половиной ночи (когда подавалась звуковая стимуляция для фрагментации сна) и второй половиной (когда стимуляция прекращалась для обеспечения восстановительного сна).&lt;/p&gt;\n&lt;p&gt;Подобный дизайн «первая половина / вторая половина» был выбран заранее, чтобы сопоставить отрезки с высокой и низкой фрагментацией сна при стабильном приеме противоэпилептических препаратов и неизменном состоянии пациента в течение одной ночи. Частоту глобальных IED в периоды фрагментации и восстановления сравнили с помощью двустороннего критерия знаковых рангов Уилкоксона. Данную динамику дополнительно проверили на случайных 3-секундных базовых эпохах без пробуждений из обеих половин ночи с помощью GLMM с распределением Твиди и логарифмической связью, где тип эпохи (включение или выключение стимуляции) задавался как фиксированный эффект, а ID пациента — как случайный.&lt;/p&gt;\n&lt;h4 id=\"vliyanie-fonovogo-sostoyaniya-mozga-na-otvet-na-stimulyaciyu\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#vliyanie-fonovogo-sostoyaniya-mozga-na-otvet-na-stimulyaciyu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Влияние фонового состояния мозга на ответ на стимуляцию&lt;/span&gt;&lt;/a&gt;Влияние фонового состояния мозга на ответ на стимуляцию&lt;/h4&gt;\n&lt;p&gt;Чтобы напрямую проверить, определяет ли фоновое состояние мозга до стимуляции электрофизиологический ответ, авторы построили две дополнительные серии моделей. Отношение спектральной мощности до стимуляции определялось как показатель δ/(θ+α+β) в диапазоне [0.5-4  Hz] / [4.5-30  Hz], рассчитанный по данным скальповой электроэнцефалографии (ЭЭГ) для отведений Fz-Cz или F3-C3 у двух пациентов, где Fz-Cz было недоступно. Этот показатель вычисляли за 3-секундную эпоху, непосредственно предшествующую звуковому стимулу, после чего подвергали логарифмическому преобразованию (&lt;span class=\"yfm-latex\" data-content=\"%5C_%5Ctext%7Blog%7D_%7B10%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;) и стандартизации (z-скорингу). Значения мощности получали для стандартных частотных диапазонов ЭЭГ: δ (0.5–4 Гц), θ (4.5–8 Гц), α (8–12 Гц) и β (12–30 Гц). В рамках первой модели вероятность возникновения реакции активации (arousal) по сравнению с изолированным ответом в виде медленных волн на стимуляцию оценивалась с помощью биномиальной обобщенной линейной смешанной модели (GLMM) с логит-функцией связи. В качестве фиксированных эффектов в модель вошли отношение спектральной мощности до стимуляции, интенсивность стимула и исходное количество межприступных эпилептиформных разрядов (IED) до стимуляции. Случайными эффектами выступали пересечения (intercepts) для контактов стерео-ЭЭГ (СЭЭГ), вложенных в идентификаторы пациентов, что позволило учесть вариабельность между контактами и пациентами. Эта модель проверяла, прогнозирует ли предварительная δ-активность вероятность активации. Во второй модели для проверки того, модулирует ли фоновое состояние δ-ритма связь между типом ответа на стимул и эпилептиформной активностью, количество IED моделировалось с помощью отрицательной биномиальной GLMM с логарифмической функцией связи. Фиксированными эффектами в ней были тип ответа (изолированный медленноволновый ответ против реакции активации), отношение спектральной мощности до стимуляции и их взаимодействие, а в качестве ковариат выступали исходное количество IED и интенсивность стимула со случайными пересечениями для контактов СЭЭГ, вложенных в пациентов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Отрицательная биномиальная GLMM — это статистический метод для анализа данных о частоте событий (например, количества разрядов), когда разброс значений превышает среднее.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Поскольку взаимодействие «тип ответа × отношение спектральной мощности до стимуляции» достигло уровня значимости, был проведен апостериорный анализ простых наклонов (post-hoc simple slopes analysis). Он позволил оценить наклон зависимости количества IED от спектральной мощности отдельно для каждого типа ответа, охарактеризовать направление и значимость этой связи, а также прояснить «разрешающую» или «защитную» роль фоновой δ-активности. Чтобы исключить вероятность того, что фоновое состояние δ-ритма выступает прямым промежуточным фактором (конфаундером) между типом ответа и количеством IED, провели анализ чувствительности с оценкой изменения коэффициентов (change-in-estimate sensitivity analysis). Эффект типа ответа на IED оценивали в нескомпенсированной отрицательной биномиальной GLMM без учета спектральной мощности и сравнивали с отрегулированной моделью, включающей этот ковариат.&lt;/p&gt;\n&lt;h4 id=\"kontrol-effekta-intensivnosti-stimula-i-analiz-talamusa\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#kontrol-effekta-intensivnosti-stimula-i-analiz-talamusa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Контроль эффекта интенсивности стимула и анализ таламуса&lt;/span&gt;&lt;/a&gt;Контроль эффекта интенсивности стимула и анализ таламуса&lt;/h4&gt;\n&lt;p&gt;Чтобы исключить сценарий, при котором сама интенсивность стимула определяла частоту IED, количество разрядов в контрольные эпохи моделировали с помощью отрицательной биномиальной GLMM с логарифмической функцией связи. Фиксированным эффектом интереса была интенсивность стимула с поправкой на исходное количество IED и со случайными пересечениями для контактов СЭЭГ, вложенных в пациентов. Данная модель проверяла, связана ли интенсивность стимула с количеством IED в отсутствие детектируемой реакции активации. Затем исследователи проверили, зависело ли отличие в количестве IED между вызванными активациями и контрольными эпохами от интенсивности стимула. Для этого смоделировали количество IED по всем вызванным и контрольным эпохам с использованием отрицательной биномиальной GLMM, включив в качестве фиксированных эффектов тип события (вызванная активация против контроля), интенсивность стимула и их взаимодействие с поправкой на исходное количество IED и случайными пересечениями для контактов СЭЭГ в разрезе пациентов. Чтобы проверить, связана ли интенсивность стимула с изменениями спектрального состава таламуса в контрольные эпохи, рассчитали таламическое отношение спектральной мощности δ/(θ+α+β) ([0.5-4 Hz]/[4.5-30 Hz]) по биполярно реферированным таламическим контактам у четырех пациентов, имевших электроды СЭЭГ в таламусе. Изменение этого отношения, вычисленное как разница между контрольной эпохой и эпохой до стимуляции, моделировалось с помощью GLMM с гауссовским семейством распределений, где фиксированным эффектом выступала интенсивность стимула, а случайными — контакты СЭЭГ, вложенные в пациентов.&lt;/p&gt;\n&lt;h4 id=\"statisticheskie-popravki-na-mnozhestvennye-sravneniya\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#statisticheskie-popravki-na-mnozhestvennye-sravneniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистические поправки на множественные сравнения&lt;/span&gt;&lt;/a&gt;Статистические поправки на множественные сравнения&lt;/h4&gt;\n&lt;p&gt;Для контроля множественных сравнений модели были сгруппированы в заранее определенные семейства на основе переменной исхода (количество IED, количество высокочастотных осцилляций [HFO] и число каналов распространения) и контекста анализа (вызванная активация, спонтанная активация и медленноволновая активность). Применялся двухуровневый подход коррекции. Во-первых, p-значения для фиксированного эффекта (или члена взаимодействия) первичного интереса корректировались по методу Бонферрони с учетом числа моделей в каждом семействе. В частности, основной анализ количества IED при вызванной активации составлял семейство из четырех моделей (p × 4). Аналогично, анализы количества IED при спонтанной активации и HFO при вызванной активации формировали отдельные семейства из четырех моделей (p × 4). Семейство медленноволнового анализа состояло из двух моделей (p × 2), а модели каналов распространения для вызванных и спонтанных активаций рассматривались как семейства, состоящие из одной модели. Во-вторых, для любой модели, где член взаимодействия достигал значимости, p-значения для парных апостериорных контрастов дополнительно корректировались по Бонферрони внутри модели (p × 2). Это касалось как сравнений активации с контролем для каждого уровня подгруппы в основных анализах вызванной/спонтанной активации и HFO, так и сравнения простых наклонов для изолированных медленных волн и активации в медленноволновом анализе. Размеры эффектов для фиксированных факторов приводятся в виде коэффициентов частоты возникновения (IRR), а предсказанные моделью средние значения представлены с 95%-ми доверительными интервалами.&lt;/p&gt;\n&lt;h4 id=\"vremennoj-analiz-i-statisticheskaya-obrabotka-spajkov\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#vremennoj-analiz-i-statisticheskaya-obrabotka-spajkov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Временной анализ и статистическая обработка спайков&lt;/span&gt;&lt;/a&gt;Временной анализ и статистическая обработка спайков&lt;/h4&gt;\n&lt;p&gt;Для изучения динамики межприступных эпилептиформных разрядов (IED) вблизи пробуждения и подачи стимулов показатели каждого пациента нормировались на его максимальное значение. Затем данные объединялись в интервалы по 500 мс и усреднялись по всем пациентам, результаты представлялись как среднее ± стандартная ошибка. Учитывались все SEEG-каналы, где фиксировались IED. Нормализованные показатели по группам для каждого временного интервала после начала события сравнивались с исходными базовыми значениями до начала события с помощью односторонних тестов Манна — Уитни, причем значимые интервалы при p &amp;lt; 0.05 отмечались звездочками на графиках.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Тест Манна — Уитни — это непараметрический статистический метод, используемый для сравнения двух независимых групп без требования о нормальности распределения данных.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для оценки связи между длительностью пробуждения и частотой IED применялась обобщенная линейная смешанная модель (GLMM) с гамма-распределением и логарифмической связывающей функцией, которая хорошо подходит для непрерывных переменных с положительной асимметрией. Независимой переменной выступала длительность пробуждения в секундах, а зависимой — нормализованное число IED за все пробуждение по каналу или частота IED в секунду. Пробуждения с неопределенными значениями из-за нулевой базы исключались из GLMM-анализа. Чтобы учесть различия между пациентами и повторные измерения, идентификатор пациента включался в качестве случайного интерсепта.&lt;/p&gt;\n&lt;h4 id=\"analiz-talamo-kortikalnyh-vzaimosvyazej\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#analiz-talamo-kortikalnyh-vzaimosvyazej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ таламо-кортикальных взаимосвязей&lt;/span&gt;&lt;/a&gt;Анализ таламо-кортикальных взаимосвязей&lt;/h4&gt;\n&lt;p&gt;Исследователи также проверяли, связана ли спектральная активность таламуса с изменениями IED при пробуждении, для чего провели подгрупповой анализ у четырех пациентов с электродами SEEG в таламусе. У них выделили 56 вызванных пробуждений во время медленноволнового сна стадии N2. Для каждого эпизода рассчитывалось отношение спектральной мощности таламуса δ/(θ+α+β) в диапазоне [0.5-4 Гц]/[4.5-30 Гц] по биполярным контактам за 3-секундное окно пробуждения. Полученный показатель, отражавший баланс медленной и быстрой активности, нормировался на 3-секундный базовый интервал до стимула.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Спектральная мощность и дельта-ритмы отражают синхронизированную активность нейронов, характерную для глубоких стадий сна, тогда как быстрые ритмы связаны с пробуждением и когнитивной активностью.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Частота IED извлекалась из всех SEEG-каналов за тот же 3-секундный интервал пробуждения и нормировалась как на число каналов, так и на исходный уровень. С помощью GLMM с гамма-распределением и логарифмической связью проверялось, предсказывает ли спектральное отношение таламуса нормализованное число IED. Модель включала спектральное отношение как фиксированный эффект и ID пациента как случайный интерсепт. Параметры оценивались как β ±  SE, значимость проверялась тестами Вальда при P &amp;lt; 0.05, а результаты дополнялись 95%-ными доверительными интервалами. Для сравнения общих частот IED и пробуждений между фрагментированным от стимуляции сном и восстановительным сном размер эффекта определялся через дельту Клиффа (Cliff's d). Уровень статистической значимости во всех тестах составлял α = 0.05.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;влияние сна на&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;вспышки&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;эпилепсии&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;СЭЭГ и&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;звуковые микро&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;пробуждения&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;рост разрядов&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;в коре при сне&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;N2 и N3&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" lette
