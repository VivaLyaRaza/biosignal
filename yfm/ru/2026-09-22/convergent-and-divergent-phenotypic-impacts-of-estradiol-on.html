a&gt;Секвенирование и обработка данных&lt;/h4&gt;\n&lt;p&gt;Качество библиотек проверяли на приборе Fragment Analyzer. Секвенирование выполнялось на платформе NovaSeq 6000. Глубина секвенирования библиотек экспрессии генов (GEX) составляла ~30 000 прочтений на клетку, а библиотек CRISPR-гидов — ~5 000 прочтений на клетку.&lt;/p&gt;\n&lt;h4 id=\"analiz-rezultatov-odnoyadernogo-crispr-skrininga\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#analiz-rezultatov-odnoyadernogo-crispr-skrininga\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ результатов одноядерного CRISPR-скрининга&lt;/span&gt;&lt;/a&gt;Анализ результатов одноядерного CRISPR-скрининга&lt;/h4&gt;\n&lt;p&gt;Обработка данных транскриптомики одиночных клеток проводилась в пакете Seurat V5. Контроль качества (QC) выполнялся индивидуально для каждого типа клеток и дозировки. На первом этапе отсеивались клетки с аномальным содержанием митохондриальных, рибосомальных и гемоглобиновых генов, а также фильтровались данные по количеству РНК, числу обнаруженных признаков и gRNA. Назначение направляющих РНК (gRNA) осуществлялось через функцию NormalizeData с последующей демультиплексией (MULTIseqDemux). В анализ включались только синглеты с одной gRNA. Для нейральных клеток-предшественников (NPC) была внедрена процедура переклассификации: дуплеты, содержащие нетаргетную и нокаутирующую (KO) gRNA, приравнивались к синглетам с KO-гидом.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Синглет — это отдельная клетка, содержащая одну направляющую РНК, что критически важно для точности CRISPR-скрининга, так как дуплеты могут искажать профиль экспрессии.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;После отбора синглетов проводилась повторная фильтрация по количеству UMI, числу генов и показателю log10GenesPerUMI, с удалением генов MALAT1, рибосомальных, митохондриальных и гемоглобиновых последовательностей. Нормализация и регрессия ковариат (фаза клеточного цикла, донор, оценки подтипов iGLUT, астроцитарные и нейрогребневые маркеры) выполнялись через SCTransform. Дифференциальная экспрессия рассчитывалась относительно клеток со «скрэмблированными» (контрольными) gRNA; учитывались только те гиды, которые вызывали значимое снижение экспрессии целевого гена (p &amp;lt; 0,1, logFC &amp;lt; 0). Кластеры определялись как доминантные, если одна gRNA составляла &amp;gt;75% клеток, в противном случае — как смешанные. Если в кластере было &amp;gt;50% контрольных клеток, он классифицировался как смешанный. В итоговый анализ включались только гены-мишени, представленные более чем в 75 клетках. Интеграция условий проводилась через IntegrateData, а обогащение онтологий — через clusterProfiler::gseGO.&lt;/p&gt;\n&lt;h4 id=\"metaanaliz-effektov-vozmusheniya-na-ekspressiyu-genov\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#metaanaliz-effektov-vozmusheniya-na-ekspressiyu-genov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Метаанализ эффектов возмущения на экспрессию генов&lt;/span&gt;&lt;/a&gt;Метаанализ эффектов возмущения на экспрессию генов&lt;/h4&gt;\n&lt;p&gt;Статистические показатели дифференциальной экспрессии для 16 нокаутов (KO) против нетаргетных клеток были объединены с помощью инструмента METAL. «Конвергентными» считались гены, соответствующие критериям: FDR &amp;lt; 0,05, отсутствие значимой гетерогенности по тесту Кокрена (Q-тест, p &amp;gt; 0,05) и одинаковое направление изменений во всех 16 нокаутах. Остальные гены классифицировались как «неконвергентные».&lt;/p&gt;\n&lt;h4 id=\"test-na-obogashenie-mishenyami-estrogenovyh-receptorov-er-i-effektami-e2\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#test-na-obogashenie-mishenyami-estrogenovyh-receptorov-er-i-effektami-e2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тест на обогащение мишенями эстрогеновых рецепторов (ER) и эффектами E2&lt;/span&gt;&lt;/a&gt;Тест на обогащение мишенями эстрогеновых рецепторов (ER) и эффектами E2&lt;/h4&gt;\n&lt;p&gt;Для оценки обогащения конвергентных генов мишенями ER или генами, «спасаемыми» эстрадиолом (E2), применялся точный тест Фишера. Списки мишеней ER были собраны из баз данных IPA (ESR1, ESR2), ENCODE (ESR1), ChEA (ESR2) и LINKS L1000 (GPER1).&lt;/p&gt;\n&lt;h4 id=\"kalcievyj-imidzhing\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#kalcievyj-imidzhing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кальциевый имиджинг&lt;/span&gt;&lt;/a&gt;Кальциевый имиджинг&lt;/h4&gt;\n&lt;p&gt;Для оценки активности нейронных сетей на сроке TD30 применялся кальциевый индикатор fluo4-AM в концентрации 2μM. Образцы инкубировали с индикатором в течение 1 часа, после чего сразу приступали к визуализации. Регистрация вспышек кальция осуществлялась на конфокальном микроскопе с вращающимся диском Dragonfly с использованием водно-иммерсионного объектива x20 (Leica). Параметры съемки включали длину волны возбуждения 488nm, пространственное разрешение 1024 x 1024 пикселей и поле зрения 0.6 x 0.6 mm при скорости сканирования 80ms на кадр. Эксперимент проводился в искусственной спинномозговой жидкости (aCSF), содержащей 130mM NaCl, 3mM KCl, 1.25mM NaH2PO4, 26mM NaH2PO4, 26mM NaHCO3, 1mM MgCl2, 1mM CaCl2 и дополнительно 5mM D-(+)-глюкозы. Все исследуемые образцы подвергались инкубации с 100nM эстрадиола (E2, Sigma-Aldrich, #E2758), после чего те же самые поля зрения сканировались повторно. На основе полученных видеозаписей кальциевой активности для каждой выявленной клетки и зоны интереса строились растровые диаграммы. Оранжевые точки на них отображают кальциевые события или спайки в конкретной клетке в определенный временной интервал, где ось y соответствует отдельным клеткам, а ось x — кадрам записи. Построение растров выполнялось в среде MATLAB, а их иерархическая кластеризация методом UPGMA — с помощью функции hclust в R; тепловые карты генерировались с использованием пакета «pheatmap» в R.&lt;/p&gt;\n&lt;p&gt;Анализ данных кальциевой визуализации строился на обработке исходных значений интенсивности флуоресценции каждого пикселя по всем временным кадрам. На первом этапе методом снижения размерности на базе анализа главных компонент (PCA) отбирались доминантные пиксели, демонстрирующие наибольшую временную вариабельность. Затем для устранения временного шума проводилась деконволюция устойчивых и запаздывающих сигналов кальция с целью выделения четких пиков. На следующем этапе доминантные пиксели дополнительно фильтровались в пространственном измерении для каждого кадра, оставляя наиболее вариабельные участки. Клеточные элементы со спайковой активностью идентифицировались по паттернам изменения интенсивности в пространственном окружении выбранных пикселей. С помощью пространственной деконволюции проверялось отсутствие перекрывания сигналов, что позволило выделить уникальные нейроны. Для моделирования базового кальциевого сигнала во времени использовался алгоритм машинного обучения — марковская цепь Монте-Карло. Сигналы, существенно превышавшие этот базовый уровень, классифицировались как спайки. Подобные кальциевые вспышки фиксировались для каждой временной точки, а затем объединялись во времени для определения непрерывных эпизодов активности. Для каждого идентифицированного нейрона рассчитывались параметры спайков: амплитуда (высота относительно базового уровня), частота, длительность и общее количество спайков за весь период съемки.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кальциевая визуализация (Calcium Imaging) позволяет в реальном времени отслеживать активность нейронов по изменению свечения флуоресцентных индикаторов, реагирующих на ионы кальция при возбуждении клетки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"mnogoelektrodnaya-matrica\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#mnogoelektrodnaya-matrica\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Многоэлектродная матрица&lt;/span&gt;&lt;/a&gt;Многоэлектродная матрица&lt;/h4&gt;\n&lt;p&gt;Регистрация внеклеточной электрической активности нейронов с помощью многоэлектродных матриц (MEA) выполнялась на платформе Axion Maestro (Axion Biosystems) с частотой дискретизации 12.5 kHz. Сигналы записывались в режиме Neural Spikes, подвергались медианной коррекции и фильтрации высокочастотным фильтром IIR на 200 Hz и низкочастотным фильтром с окном Кайзера на 3 kHz. Детекция спайков осуществлялась по алгоритму AxIS Adaptive Threshold Crossing с адаптивным порогом, установленным на уровне 5.5 стандартных отклонений выше шума конкретного электрода. Активными считались электроды с минимальной частотой 5 спайков/мин. Бёрсты (пачки спайков) определялись с помощью алгоритма межимпульсного интервала (ISI) как минимум из 5 спайков при максимальном ISI 100ms. Сетевые бёрсты требовали участия не менее 35% электродов, содержали от 50 спайков и более с ISI до 100ms. Синхронность оценивалась в окне 20ms, а количественная обработка данных проводилась в ПО Axion analysis. В каждую лунку MEA-планшета, предварительно покрытого двойным слоем поли-D-лизина и Geltrex, высевали по 150 000 индуцированных глутаматергических (iGLUT) нейронов возрастом D21. Смену половины объема питательной среды производили каждые 2–3 дня. Измерения на MEA проводились спустя 24 часа после внесения носителя (DMSO в качестве контроля) или эстрадиола в концентрации 100nM при равном объемном соотношении.&lt;/p&gt;\n&lt;h4 id=\"danio-rerio\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#danio-rerio\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Данио-рерио&lt;/span&gt;&lt;/a&gt;Данио-рерио&lt;/h4&gt;\n&lt;p&gt;Все манипуляции с рыбами данио-рерио (zebrafish) проводились в строгом соответствии с нормативными стандартами Комитета по уходу и использованию животных при институте (IACUC, протокол #2024-20054) Йельского университета. Личинки содержались при температуре 28°C в условиях 14-часового светового и 10-часового темнового циклов. Выращивание осуществлялось в чашках Петри диаметром 150 mm в «синей воде» (0.3g/L Instant Ocean, 1 mg/L метиленового синего, pH 7.0) при плотности посадки 60–80 личинок на чашку. Поведенческие тесты проводились на личинках в возрасте 5–7 дней после оплодотворения (dpf). На данной стадии развития половая принадлежность особей еще не дифференцирована.&lt;/p&gt;\n&lt;h4 id=\"poluchenie-mutantnyh-linij-danio-rerio\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#poluchenie-mutantnyh-linij-danio-rerio\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Получение мутантных линий данио-рерио&lt;/span&gt;&lt;/a&gt;Получение мутантных линий данио-рерио&lt;/h4&gt;\n&lt;p&gt;Стабильные линии данио-рерио были получены в нашей лаборатории (включая генотипы &lt;span class=\"yfm-latex\" data-content=\"arid1b%5E%7B%5CDelta7%2F%5C7%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"chd8%5E%7B%5CDelta7%2F%5C7%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"kdm5ba%5E%7B%5CDelta17%2F%5C17b%5CDelta14%2F%5C14%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"pogza%5E%7B%5CDelta23%2F%5C23b%5CDelta20%2F%5C20%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"cul3a%5E%7B%5CDelta7%2F%5C7b%5CDelta32%2F%5C32%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"dyrk1aa%5E%7B%5CDelta77%2F%5C77b%5CDelta8%2F%5C8%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"scn1lab%5E%7B%5CDelta44%2F%5C44%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, nrxn1a⁵i/5ib¹0i/10i, &lt;span class=\"yfm-latex\" data-content=\"ptena%5E%7B%5CDelta10%2F%5C10%7Db%5E%7B%5CDelta2%2F%5C2%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;) либо любезно предоставлены лабораторией Thyme (ash1l¹i,Δ60,19i/1i,Δ60,19i, &lt;span class=\"yfm-latex\" data-content=\"kmt5b%5E%7B%5CDelta208%2C1i%2C%5CDelta5%2F%5C208%2C1i%2C%5CDelta5%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"kmt2ca%5E%7B%5CDelta82%2C17i%2F%5C82%2C17i%7Db%5E%7B%5CDelta6%2C%5CDelta29%2F%5C6%2C%5CDelta29%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"grin2aa%5E%7B%5CDelta175%2F%5C175%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"grin2ab%5E%7B%5CDelta42%5CDelta5%5CDelta38%2F%5C42%5CDelta5%5CDelta38%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"cacna1g%5E%7B%5CDelta52%2F%5C52%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;) и лабораторией Dallman (shank3a⁴ishank3b¹i). Мозаичные мутанты поколения F0 (crispants для генов ank2ab, bcl11aab, chd2, crebbpab, gria3ab, kdm6bab, mbd5, phf12ab, phf21aab, ppp2r5d, setd5, sin3aab, skiab, slc6a1ab, smarcc2, wacab) были созданы методом CRISPR-Cas9. Для каждого аллеля проектировали по две CRISPR crRNA, нацеленные преимущественно на ранние экзоны. Комплексы CRISPR RNP собирали индивидуально и объединяли перед микроинъекцией на стадии одной клетки. Контрольным группам вводили эквивалентное количество скремблированных гидов (scrambled guides).&lt;/p&gt;\n&lt;p&gt;Инъецированные эмбрионы выращивали до 5 дней после оплодотворения (dpf), после чего проводили поведенческие тесты. У каждого мутанта по генам расстройств нейроразвития (NDD) были выявлены уникальные поведенческие профили («отпечатки»), демонстрирующие как сходные, так и различающиеся фенотипы (Рис. SI 5A). Для классификации таких конвергентных подгрупп, потенциально разделяющих функции на уровне нейронных сетей, провели корреляционный анализ с иерархической кластеризацией. В результате выделили семь отдельных подгрупп генов NDD с высокой степенью корреляции поведенческих признаков (Рис. 4C).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;CRISPR crispants — это методика временного нокаута у эмбрионов первого поколения без необходимости выведения стабильных линий, а поведенческие «отпечатки» позволяют объединить разные генетические поломки по схожим симптомам на уровне нейросетей.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"povedencheskie-testy\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#povedencheskie-testy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поведенческие тесты&lt;/span&gt;&lt;/a&gt;Поведенческие тесты&lt;/h4&gt;\n&lt;p&gt;Проводился автоматизированный высокопроизводительный количественный поведенческий скрининг личинок данио-рерио для оценки возбуждения и сенсомоторной интеграции как маркёров дефицита нейронных цепей при генных нарушениях. Количественно оценивали 24 параметра зрительно-оборонительной реакции (visual-startle response, VSR) и циклов сна-бодрствования у 15 стабильных гомозиготных мутантных линий или линий crispants F0 для 16 генов NDD (Таблицы SI 8–9). Личинок помещали в отдельные лунки 96-луночного планшета (7701-1651; Whatman, Clifton, NJ), содержащего по 650 мкл стандартной воды для эмбрионов (0.3 г/л Instant Ocean, 1 мг/л метиленового синего, pH 7.0), внутри установки Zebrabox (Viewpoint LifeSciences, Монреаль, Канада). Двигательную активность отслеживали с помощью видеосистемы (Zebrabox и ПО ZebraLab).&lt;/p&gt;\n&lt;p&gt;Тест зрительно-оборонительной реакции (VSR) выполняли в возрасте 5 dpf. Для оценки ответов на выключение света (VSR-OFF) личинок адаптировали к белого света в течение 1 часа, регистрируя базовую активность 30 минут, после чего давали пять темных вспышек длительностью по 1 секунде с интервалами белого света по 29 секунд. Для оценки реакций на включение света (VSR-ON) порядок меняли: адаптация в темноте 1 час, базовая активность 30 минут, затем пять вспышек белого света по 1 секунде с интервалами темноты по 29 секунд. С помощью пользовательского кода MATLAB обрабатывали шесть параметров для VSR-OFF и VSR-ON: (i) средняя интенсивность всех реакций испуга; (ii) средняя активность после стимула; (iii) средняя активность после первого стимула; (iv) соотношение стимульной и постстимульной активности; (v) интенсивность ответов на первый стимул; (vi) интенсивность ответов на финальный стимул.&lt;/p&gt;\n&lt;p&gt;Парадигму сна-бодрствования проводили на 5–7 dpf, сразу после тестов VSR. В условиях цикла 14 ч света / 10 ч темноты активность и сон личинок фиксировали в Zebrabox и анализировали скриптом MATLAB. Для дневного и ночного времени оценивали шесть параметров: (i) общая активность; (ii) общая продолжительность сна; (iii) активность во время бодрствования; (iv) эпизоды отдыха; (v) длительность сна; (vi) латентность сна. Всего в рамках тестов VSR-OFF, VSR-ON и сна-бодрствования анализировалось 24 параметра.&lt;/p&gt;\n&lt;h4 id=\"povedencheskij-analiz\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#povedencheskij-analiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поведенческий анализ&lt;/span&gt;&lt;/a&gt;Поведенческий анализ&lt;/h4&gt;\n&lt;p&gt;Для сравнения фенотипов каждого поведенческого параметра между гомозиготными мутантами и диким типом, либо между crispants и контролем со скремблированными гидами, использовали линейные смешанные модели (LMM). Межэкспериментальную вариабельность фенотипов учитывали путем включения даты эксперимента в качестве случайного фактора в LMM. Иерархический кластерный анализ применялся для группировки мутантов и параметров по подписанным значениям &lt;span class=\"yfm-latex\" data-content=\"-%5Clog_%7B10%7D(p)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, полученным из LMM, где знак указывает направление изменения фенотипа при сравнении мутанта с диким типом или crispants с контролем. Корреляционный анализ Пирсона использовали для оценки связи между мутантами по разницам в 24 параметрах.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Линейные смешанные модели (LMM) позволяют учитывать случайные факторы вроде дня проведения опыта, а преобразованные p-значения с учетом знака показывают не только силу различий, но и то, в какую сторону (увеличение или уменьшение) сдвинулось поведение мутантов.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"prioritizaciya-lekarstv-na-osnove-farmako-povedencheskih-profilej-danio-rerio\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#prioritizaciya-lekarstv-na-osnove-farmako-povedencheskih-profilej-danio-rerio\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Приоритизация лекарств на основе фармако-поведенческих профилей данио-рерио&lt;/span&gt;&lt;/a&gt;Приоритизация лекарств на основе фармако-поведенческих профилей данио-рерио&lt;/h4&gt;\n&lt;p&gt;Поведенческие фенотипы мутантов и crispants, ассоциированных с генами NDD, сопоставляли с базой данных из 376 препаратов, одобренных U.S. FDA, ранее протестированных на личинках данио-рерио с использованием тех же тестов зрительно-оборонительной реакции и сна-бодрствования. Эти лекарства оказывали достоверное влияние как минимум на два поведенческих параметра (LMM, p &amp;lt; 0.05 / 3, с поправкой на три теста). Корреляционный анализ Пирсона позволил выявить соединения, которые существенно коррелируют (коэффициент &amp;gt; 0.5, p &amp;lt; 0.05, t-критерий) или антикоррелируют (коэффициент &amp;lt; -0.5, p &amp;lt; 0.05, t-критерий) с поведенческими паттернами мутантов (Таблица SI 14).&lt;/p&gt;\n&lt;h4 id=\"obrabotka-estradiolom-u-danio-rerio\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#obrabotka-estradiolom-u-danio-rerio\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обработка эстрадиолом у данио-рерио&lt;/span&gt;&lt;/a&gt;Обработка эстрадиолом у данио-рерио&lt;/h4&gt;\n&lt;p&gt;Для экспериментов с мутантами и эстрадиолом личинок наблюдали в возрасте 5–7 dpf. В тестах с острым воздействием эстрадиола по одной дикой личинке zebrafish помещали в лунки 96-луночного планшета с 650 мкл стандартной эмбриональной воды. Исходный 10 мM раствор β-Estradiol 17-cypionate в DMSO или контрольный чистый DMSO добавляли прямо в лунки до финальной концентрации 20 мкM (конечный DMSO 0.2%) для 12–24 гомозиготных или диких личинок с аналогичным генетическим фоном, после чего проводили тесты на зрительный испуг и цикл сон-бодрствование. При хроническом воздействии личинок инкубировали с 20 мкM эстрадиола или DMSO в синей воде в чашках Петри диаметром 150 мм в течение 24 часов, затем переносили в 96-луночный планшет со свежим раствором 20 мкM эстрадиола или DMSO для поведенческих тестов. Генотипирование выполнялось после каждого эксперимента для подтверждения линий мутантов. Определение категорий эффектов (усугубление, без изменений, частичное спасение, спасение и гиперкоррекция) представлено на Рис. SN; статистическую значимость оценивали Z-тестом для лекарственного спасения. Для поведенческих признаков с p-значением мутанта ≤ 0.05 (Mutant-WT, HOM DMSO против WT DMSO) признаки с p-значением спасения &amp;gt;0.05 (Mutant-E2, HOM E2 против WT DMSO) считались спасенными. Среди остальных признаки с p-значением лекарства &amp;gt;0.05 (E2 Effect, HOM E2 против HOM DMSO) считались неизмененными. Если p-значение лекарства составляло &amp;lt;0.05, то при абсолютном эффекте спасения в противоположном направлении по сравнению с эффектом мутации фиксировалась гиперкоррекция.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Z-тест — это статистический метод для проверки гипотез, который позволяет определить, есть ли статистически значимая разница между средними значениями двух групп.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Если p-значение лекарства было &amp;lt;0.05, признаки, у которых абсолютный эффект спасения (Mutant-E2) был направлен в ту же сторону, но меньше абсолютного эффекта мутанта (Mutant-WT), классифицировались как частично спасенные, в противном случае — как усугубленные.&lt;/p&gt;\n&lt;h4 id=\"immunogistohimiya\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#immunogistohimiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Иммуногистохимия&lt;/span&gt;&lt;/a&gt;Иммуногистохимия&lt;/h4&gt;\n&lt;p&gt;Тотальное окрашивание антителами извлеченных эмбрионов проводилось по описанной методике. Для оценки влияния соединений на базовую активность мозга личинки линий scn1lab^Δ44/Δ44 и дикого типа scn1lab⁺/+ подвергались воздействию эстрадиола в финальной концентрации 20 мкM (растворенного в DMSO) или только DMSO в течение 24 часов, начиная с 5 dpf. Размер выборки составил: scn1lab⁺/+ + DMSO (n=34), scn1lab^Δ44/Δ44 + DMSO (n=35), scn1lab^Δ44/Δ44 + эстрадиол (n=37) по результатам 3 независимых наборов данных. Личинок собирали с помощью сетчатого сита, немедленно погружая его в раствор 4% PFA / 4% сахарозы в PBS с добавлением 0.25% Triton (PBST). Образцы фиксировали ночь при 4°C и отмывали в PBST. Мозг препарировали перед иммуноокрашиванием. Извлеченные мозги инкубировали в 150 мM Tris-HCl 15 минут при 70°C, отмывали в PBST, пермеабилизировали в 0.05% Trypsin-EDTA 45 минут на льду и снова отмывали в PBST. Блокировку проводили один час в PBST с 10% BSA, 2% нормальной сыворотки козы (NGS) и 1% DMSO, после чего инкубировали ночь при 4°C с первичными антителами в растворе без NGS. Использовались следующие антитела и разведения: pERK и tERK в разведении 1:500. Затем образцы отмывали в PBST и инкубировали 3 часа при комнатной температуре со вторичными антителами, конъюгированными с флуорофорами Alexa, в разведении 1:200 в растворе без NGS. Окрашенный мозг монтировали дорсально в агарозу низкой температуры плавления (1-2%) и сканировали конфокальным микроскопом на увеличении 25X (0.95W) с z-стеками глубиной ~200–300 мкм и шагом 1.5 мкм.&lt;/p&gt;\n&lt;h4 id=\"analiz-kartirovaniya-aktivnosti-vsego-mozga\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#analiz-kartirovaniya-aktivnosti-vsego-mozga\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ картирования активности всего мозга&lt;/span&gt;&lt;/a&gt;Анализ картирования активности всего мозга&lt;/h4&gt;\n&lt;p&gt;Картирование активности всего мозга выполнялось с использованием специализированного конвейера для количественной оценки региональных различий в активности мозга (код доступен на GitHub с DOI: 10.5281/zenodo.7996403). Кратко, конфокальные z-стек изображения мозгов, окрашенных на tERK, нелинейно регистрировались со стандартным эталонным мозгом с использованием деформации на основе трансформации. Геометрическая трансформация применялась к z-стек изображениям pERK. Интенсивности изображений pERK нормализовались по интенсивностям tERK путем воксельного деления (pERK/tERK). Средние значения интенсивностей pERK/tERK вычислялись внутри отдельных областей, выделенных в атласе Z-brain. Атласы на 4, 8 и 149 областей были получены вручную на основе версий атласа Z-brain. Для выявления областей, где фенотипы мутантной активности мозга восстанавливались после воздействия E2, применялось моделирование линейных смешанных эффектов к исходным значениям pERK/tERK.&lt;/p&gt;\n&lt;h4 id=\"vizualizaciya-fenotipov-aktivnosti-mozga\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#vizualizaciya-fenotipov-aktivnosti-mozga\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Визуализация фенотипов активности мозга&lt;/span&gt;&lt;/a&gt;Визуализация фенотипов активности мозга&lt;/h4&gt;\n&lt;p&gt;Для визуализации различий в активности мозга у гомозиготных мутантов, получавших эстрадиол или носитель, по сравнению с контрольными рыбами дикого типа использовалась программа BioImage Suite Web. Изображения активности накладывались на ресемплированный стандартный эталонный мозг. Вычислялись воксельные нормализованные Z-оценки для мутантных личинок относительно дикого типа с использованием среднего и стандартного отклонения значений pERK/tERK. Изображения генетически фиксировались для демонстрации поперечных увеличений и уменьшений в аксиальной и сагиттальной плоскостях. Различия в активности между образцами, обработанными препаратом и DMSO, визуализировались как вычитание нормализованных средних. Различия отображались путем картирования Z-оценок от 1 до 3 для scn1lab. Все аксиальные мозаики показаны начиная с уровня Z, равного 80, с уменьшением срезов для каждого изображения. Сагиттальные мозаики отображаются начиная с уровня X, равного 80, с уменьшением на 10 срезов для каждого изображения.&lt;/p&gt;\n&lt;h4 id=\"analiz-aktivnosti-mozga\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#analiz-aktivnosti-mozga\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ активности мозга&lt;/span&gt;&lt;/a&gt;Анализ активности мозга&lt;/h4&gt;\n&lt;p&gt;Для оценки влияния эстрадиола (E2) и мутации на активность в различных областях мозга использовали линейные смешанные модели (LMM) с фиксированными эффектами E2 и мутации. В анализ вошли три группы рыб: дикий тип с DMSO (scn1lab⁺/+, обработанные DMSO), гомозиготные мутанты (scn1lab^Δ 44/Δ 44) и гомозиготные мутанты, обработанные E2. Дата проведения эксперимента включалась в LMM как случайный эффект для учета вариабельности между сериями опытов. Эффект спасения препаратом определялся как совокупное влияние E2 и мутации на активность в каждой зоне мозга для сравнения мутантных рыб, получавших E2, с рыбами дикого типа, получавшими DMSO. Статистическая значимость оценивалась с помощью Z-теста для спасения E2. Для областей, где p-значение мутации составляло &amp;lt;0.05, зоны с p-значением спасения E2 &amp;gt;0.05 расценивались как полностью спасенные. Среди оставшихся областей те, где p-значение E2 превышало 0.05, классифицировались как не изменившиеся. Если p-значение E2 было &amp;lt;0.05, то области, где абсолютный эффект спасения E2 уступал по модулю абсолютному эффекту мутации, считались частично спасенными, в противном случае — усугубленными (exacerbated). Схема принятия решений по порогам степени спасения представлена на Рис. SI 16.&lt;/p&gt;\n&lt;p&gt;Независимый анализ LMM проводился для каждого датасета с последующим объединением оценок по трем экспериментам для метаанализа. Объединенная оценка рассчитывалась как среднее арифметическое взвешенное по обратной дисперсии оценок для каждого эксперимента. Статистическая значимость между экспериментами определялась с использованием объединенного теста вероятностей Фишера для получения общего p-значения. На основе объединенных оценок области мозга были классифицированы по степени восстановления.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Линейная смешанная модель (LMM) — это статистический метод для анализа данных с иерархической или зависимой структурой, позволяющий учитывать как общие закономерности (фиксированные эффекты), так и случайные отклонения (например, разницу между днями экспериментов).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sudorogi\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#sudorogi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Судороги&lt;/span&gt;&lt;/a&gt;Судороги&lt;/h4&gt;\n&lt;p&gt;Тесты на индуцированные пентилентетразолом (PTZ) судороги проводились на основе модифицированного протокола Hoffman et al. (2016). В экспериментах по спасению эстрадиолом личинки в возрасте от 4 до 5 дней (dpf) инкубировали в чашках Петри с эстрадиолом в концентрации 20 µ M или контрольным DMSO (n=24 на генотип в каждой группе). На 5 dpf личинок переносили пипеткой в лунки 96-луночного планшета, содержащего эстрадиол (20 µ M) или контрольную воду (650 µ L стандартной эмбриональной воды с метиленовым синим: 0.3 g/L Instant Ocean, 1 mg/L метиленового синего, pH  7.0). Планшет помещали в модифицированную систему Zebrabox. Движение личинок регистрировали в режиме квантования Videotrack в течение 30 минут до и после добавления PTZ или воды. Параметры детекции Videotrack подбирались эмпирически для четкого отслеживания движений с минимальным уровнем шума. PTZ разводили в стерильной дистиллированной воде и добавляли непосредственно в каждую лунку до конечной концентрации 10 mM. Данные активности до и после внесения PTZ визуализировали в виде линейных графиков. Анализ данных производился путем нормирования постсудорожной активности каждой рыбы на ее исходные значения до PTZ. Для разделения эффектов гена, эстрадиола и воздействия PTZ применялась трехфакторная LMM. Программное обеспечение Zebralab генерировало следующие параметры уровня активности: frect (частота замираний), fredur (длительность замираний), midct (средняя частота движений), middur (средняя длительность движений), burct (частота вспышек активности), burdur (длительность вспышек), zerct (нулевая частота), zerdur (нулевая длительность) и actinteg (интеграция действия).&lt;/p&gt;\n&lt;h4 id=\"vydelenie-massovoj-rna-i-sekvenirovanie\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#vydelenie-massovoj-rna-i-sekvenirovanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Выделение массовой RNA и секвенирование&lt;/span&gt;&lt;/a&gt;Выделение массовой RNA и секвенирование&lt;/h4&gt;\n&lt;p&gt;Тотальная RNA выделялась из изолированных голов личинок с удаленными глазами (n=3 головы на генотип/условие, по 1 голове на образец), как описано в работе 38. Для контроля генетического фона RNA экстрагировали из сибсов или кузенов, полученных от скрещивания гетерозиготных рыб scn1lab^Δ 44/+ и подвергнутых воздействию 20 µ M эстрадиола в DMSO или чистого DMSO в течение 24 часов на этапе 5–6 dpf. Генотипирование личинок проводилось на 3 dpf с использованием системы Zebrafish Embryo Genotyper (ZEG) (wFluidx, Солт-Лейк-Сити, штат Юта, США). На 6 dpf личинок эвтаназировали на льду в течение 15 минут, после чего препарировали головы и удаляли глаза с помощью микрохирургических пинцетов. RNA выделяли немедленно с использованием набора Rasy Micro Kit (Qiagen). Подготовка библиотек RNA выполнялась с помощью набора NEBNext Single Cell Low Input RNA Library Prep Kit (Cat# E6420L), а секвенирование проводилось на приборе NovaSeq X Plus (Illumina) в Центре геномного анализа Йельского университета из расчета 25 миллионов ридов на образец.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Секвенирование тотальной RNA (RNA-seq) позволяет измерить экспрессию всех активных генов в образце, а наборы для малого количества клеток (Low Input) дают возможность работать с крошечными биологическими образцами вроде голов отдельных личинок рыбок данио.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"identifikaciya-differencialno-ekspressiruyushihsya-genov-po-dannym-massovogo-rna-seq\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#identifikaciya-differencialno-ekspressiruyushihsya-genov-po-dannym-massovogo-rna-seq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Идентификация дифференциально экспрессирующихся генов по данным массового RNA-seq&lt;/span&gt;&lt;/a&gt;Идентификация дифференциально экспрессирующихся генов по данным массового RNA-seq&lt;/h4&gt;\n&lt;p&gt;Для поиска дифференциально экспрессирующихся генов (DEG) низкокачественные риды обрезали, а адаптерные последовательности удаляли с помощью программы Trim Galore (v0.5.0). Отфильтрованные риды картировали на референсный геном данио рерио (Danio rerio, GRCz11) с использованием HISAT2 (v2.1.0). Уровни экспрессии генов количественно оценивали с помощью StringTie (v1.3.3b) с использованием моделей генов (релиз 103) из базы Ensembl. Анализ дифференциальной экспрессии выполнялся в пакете DESeq2 (v1.22.1).&lt;/p&gt;\n&lt;h4 id=\"analiz-putej-po-dannym-massovogo-rna-seq\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#analiz-putej-po-dannym-massovogo-rna-seq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ путей по данным массового RNA-seq&lt;/span&gt;&lt;/a&gt;Анализ путей по данным массового RNA-seq&lt;/h4&gt;\n&lt;p&gt;Для понимания биологических функций спасенных DEG был проведен функциональный анализ путей с использованием PANTHER. Сначала генные ортологи рыбок данио сопоставлялись с человеческими ортологами через EnsemblBioMart (версия GRCz10/danRer10). Чтобы выявить пути, восстанавливающиеся после применения эстрадиола, сначала определяли DEG в группе мутант + без E2 по сравнению с диким типом (p &amp;lt; 0.1 номинальное), а также в группе мутант + эстрадиол по сравнению с диким типом (p &amp;lt; 0.1 номинальное). Затем DEG из обоих сравнений делили на группы с повышенной (кратность изменения &amp;gt; 1) и пониженной (кратность изменения &amp;lt; 1) экспрессией и запускали PANTHER для поиска значимых биологических путей (FDR &amp;lt; 0.05) из онтологий Gene Ontology (GO): биологические процессы, клеточные компоненты и молекулярные функции. Для исследования пересечений путей между [упавшими у мутант + DMSO и выросшими у мутант + эстрадиол] и [выросшими у мутант + DMSO и упавшими у мутант + эстрадиол] применялся инструмент InteractiVenn, что позволило выделить пути, возвращенные эстрадиолом к норме.&lt;/p&gt;\n&lt;h4 id=\"integraciya-multimodalnyh-transkriptomnyh,-kletochnyh-i-povedencheskih-dannyh\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#integraciya-multimodalnyh-transkriptomnyh,-kletochnyh-i-povedencheskih-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интеграция мультимодальных транскриптомных, клеточных и поведенческих данных&lt;/span&gt;&lt;/a&gt;Интеграция мультимодальных транскриптомных, клеточных и поведенческих данных&lt;/h4&gt;\n&lt;p&gt;Для объединения данных scRNA (n клеток, m генов), кальциевого имиджинга (n клеток, m фенотипов) и данных по рыбкам данио (n клеток, m фенотипов при различных условиях стимуляции) мы использовали подход метрических измеримых пространств (MMS). Каждая модальность &lt;span class=\"yfm-latex\" data-content=\"k%20%5Cin%20%5C%7B1%2C2%2C3%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; представляется как c(k) = (X(k), C(k), p(k)), где X(k) — набор клеток, C(k) — матрица попарных расстояний внутри модальности, а p(k) — равномерное распределение вероятностей для каждой клетки. Для сопоставления этих пространств применяется расстояние Громова-Вассерштейна (GW), которое минимизирует различия в геометрии отношений между клетками в разных модальностях через транспортную матрицу π.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Расстояние Громова-Вассерштейна (GW) — это математический метод, позволяющий сравнивать структуры данных, даже если они находятся в разных «пространствах» (например, гены против фенотипов), путем сопоставления того, как объекты связаны друг с другом внутри каждой группы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для поиска общего латентного пространства мы определяем барицентры (синтетические центры масс) B = (Y, C, p), минимизируя взвешенную сумму расстояний GW между барицентром и каждой модальностью. Оптимизация проводится итеративно: сначала фиксируется барицентр для обновления связей π(k), затем обновляется матрица расстояний барицентра C с использованием квадратичной функции потерь. После получения общего пространства применяется классическое многомерное шкалирование (MDS) для создания низкоразмерных евклидовых эмбеддингов.&lt;/p&gt;\n&lt;h4 id=\"sravnenie-naibolee-i-naimenee-estradiol-chuvstvitelnyh-genov\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#sravnenie-naibolee-i-naimenee-estradiol-chuvstvitelnyh-genov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сравнение наиболее и наименее эстрадиол-чувствительных генов&lt;/span&gt;&lt;/a&gt;Сравнение наиболее и наименее эстрадиол-чувствительных генов&lt;/h4&gt;\n&lt;p&gt;Мы проанализировали de novo варианты с преждевременной терминацией белка (PTV) у 34 471 пациента с РАС (из баз SPARK, ASC, SSC, MSSNG) и 31 052 лиц с нарушениями развития (из DDD13K, GeneDx, RUMC76). Гены были разделены на две группы: наиболее чувствительные к эстрадиолу (n = 7: ASH1L, SCN2A, SHANK3, ASXL3, MED13L, CACNA1G, ANK2) и наименее чувствительные (n = 29, включая ANK3, ARID1B, CHD8 и др.). Клинические фенотипы (FSIQ, SCQ, DCDQ, RBSR, SRS, VABS) сравнивались между полами в когорте SPARK. Ассоциации с экспрессией оценивались через логарифмические изменения (log2 fold change) в данных UCLA и BrainVar. Коэкспрессию на разных стадиях развития изучали по базе BrainSpan, используя корреляции Спирмена и анализ связности в сети STRING. Различия в связности между группами разного размера проверялись критерием Вилкоксона.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;роль гормонов&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;при мутациях&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;аутизма&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;CRISPR-&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;скрининг 36&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;генов в&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нейронах&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;эстрадиол&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;выборочно&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;гасит гиперакт&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ивность&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M58
