            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"97\" cy=\"159\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"663\" cy=\"208\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · GENOMICS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как гормоны влияют на гены&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;аутизма и расстройств&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;развития мозга&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-f1.jpg\" alt=\"Рисунок 1: Экспериментальный обзор двухуровневого, крупномасштабного мультимодального скринингового конвейера для оценки\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Экспериментальный обзор двухуровневого, крупномасштабного мультимодального скринингового конвейера для оценки влияния генов риска 17𝜷-эстрадиол-х-расстройства нейроразвития. Эффект лечения эстрадиолом и мутаций потери функции в генах риска расстройств нейроразвития (РНР) измеряется с помощью трех модальностей: (1) секвенирование РНК единичных клеток в глутаматергических нейронах человека, полученных из иПСК с индуцированной экспрессией NGN2 (iGLUT), (2) визуализация кальция в нейронах iGLUT и (3) сенсомоторное и поведенческое исследование возбуждения у личинок данио-рерио. Модальности включают пересекающиеся, но независимые наборы генов. Целевые геены ASD/NDD охватывают множество функций, включая регуляцию экспрессии генов (розовый), функцию и коммуникацию нейронов (зеленый), клеточную сигнализацию и модификацию белков (серый) и цитоскелет (синий).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Половые гормоны традиционно считаются ключевыми факторами различий в работе мозга, но их роль при генетических нарушениях изучена слабо. Исследователи проверили, как эстрадиол влияет на нейроны с мутациями в 36 генах, связанных с аутизмом и расстройствами развития. Оказалось, что гормон частично сглаживает генетические нарушения на уровне экспрессии генов, но точечно успокаивает избыточную активность нейронов лишь для некоторых мутаций.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Эстрадиол тестировали на 36 генах риска аутизма и расстройств развития&lt;/li&gt;\n&lt;li&gt;Гены ASH1L и SCN2A показали максимальную чувствительность к гормону&lt;/li&gt;\n&lt;li&gt;Гормон универсально правит экспрессию генов, но точечно гасит возбудимость&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Чтобы понять масштаб влияния половых гормонов на патологии развития нервной системы, исследователи использовали нейроны из индуцированных плюрипотентных стволовых клеток человека и личинок рыбок данио-рерио. В эксперименте с помощью системы CRISPR отключили 36 крупных генов с высоким риском аутизма и расстройств развития. Эти гены отвечают за регуляцию транскрипции, синаптическую передачу и структуру цитоскелета. Обработка эстрадиолом в концентрации 100 нанмолей в течение суток показала, что молекулярный ответ включает как универсальные, так и сугубо индивидуальные механизмы для разных мутаций.&lt;/p&gt;\n&lt;p&gt;Анализ выявил универсальный эффект: эстрадиол частично восстанавливает нарушенный профиль экспрессии генов во всех изученных линиях. Однако нормализация электрической активности сетей происходила выборочно. Мутации в генах ASH1L и SCN2A продемонстрировали наибольшую чувствительность к терапии, ответив полным восстановлением молекулярных и клеточных свойств в человеческих нейронах, а также поведенческих реакций у рыбок. Семь наиболее отзывчивых на гормон генов образуют плотную сеть белковых взаимодействий и активно экспрессируются в зрелых возбуждающих нейронах верхних слоев коры.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа выполнена на клеточных культурах in vitro и моделях рыбок данио-рерио, а также использует препринт без независимой экспертной оценки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Сигнализация половых гормонов в процессе развития нервной системы способна выступать в роли модулятора риска возникновения различных нейроразвивающихся расстройств, включая расстройства аутистического спектра. Чтобы детально исследовать эти эффекты, авторы провели систематическую многоуровневую оценку влияния эстрадиола на фоне мутаций потери функции в 36 функционально разнообразных крупных генах риска расстройств аутистического спектра и других нейроразвивающихся нарушений. Для этого использовались нейроны человека, полученные из индуцированных плюрипотентных стволовых клеток, а также личинки рыбок данио-рерио.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование индуцированных плюрипотентных стволовых клеток человека позволяет превратить клетки кожи или крови в нейроны с конкретными генетическими мутациями, что дает возможность изучать живую человеческую мозговую ткань в лабораторных условиях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В ходе работы были выявлены как общие, так и различающиеся взаимодействия между генами и эстрадиолом на транскриптомном, нейросетевом и поведенческом уровнях. Выяснилось, что эстрадиол способен частично сглаживать нарушения профилей экспрессии генов, вызванные нокаутом любого из исследованных генов риска расстройств аутистического спектра и связанных патологий. Однако его влияние на клеточном уровне носит избирательный характер: эстрадиол быстро и избирательно подавляет фенотипы нейронной гипервозбудимости только для определенной подгруппы нокаутированных генов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эстрадиол универсально корректирует нарушения транскриптома для всех 36 исследованных генов риска, но избирательно нормализует гипервозбудимость нейронных сетей лишь у некоторых из них.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;p&gt;Особое внимание привлекли два гена — ASH1L и SCN2A, которые продемонстрировали наибольшую чувствительность к терапии эстрадиолом. Для них было зафиксировано впечатляющее восстановление молекулярных и клеточных параметров в человеческих нокаутных нейронах, а также успешная компенсация поведенческих нарушений у мутантных личинок рыбок данио-рерио. Анализ показал, что семь генов, наиболее отзывчивых к эстрадиолу, обладают повышенной плотностью белок-белковых взаимодействий, сильной коэкспрессией в определенные постнатальные периоды развития и обогащены в зрелых возбуждающих нейронах верхних слоев коры.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа выполнена на клеточных моделях человека и на рыбках данио-рерио, поэтому для подтверждения клинической применимости полученных результатов требуются дальнейшие исследования на более сложных млекопитающих и клинических выборках.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В итоге исследование описывает многоуровневые эффекты эстрадиола при потере функций ключевых генов риска, демонстрируя как универсальные изменения транскриптома, так и специфичное для конкретных генов спасение клеточных и поведенческих аномалий.&lt;/p&gt;\n&lt;h3 id=\"vvedenie1\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#vvedenie1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"rol-estradiola-v-regulyacii-nejronnyh-funkcij\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#rol-estradiola-v-regulyacii-nejronnyh-funkcij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Роль эстрадиола в регуляции нейронных функций&lt;/span&gt;&lt;/a&gt;Роль эстрадиола в регуляции нейронных функций&lt;/h4&gt;\n&lt;p&gt;Эстрадиол играет ключевую роль в работе мозга, регулируя нейрогенез, возбудимость нейронов, синаптическую пластичность и поведение как в возбуждающих, так и в тормозных цепях. Эти эффекты реализуются через два механизма. Геномный механизм включает связывание эстрадиола с ядерными рецепторами (ERα и ERβ), которые действуют как факторы транскрипции, модулируя экспрессию генов в течение часов или дней. Важно, что мишени ERα в мозге обогащены генами, связанными с РАС и другими нарушениями нейроразвития (НН). Быстрый негеномный механизм задействует мембранные рецепторы, такие как GPER1, которые активируют вторичные мессенджеры и ионные потоки (например, кальциевые) за считанные минуты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эстрадиол модулирует функции мозга через медленные геномные и быстрые негеномные пути, при этом его мишени часто пересекаются с генами, ассоциированными с РАС.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;РАС/НН (расстройства аутистического спектра / нарушения нейроразвития) — группа состояний, вызванных генетическими и средовыми факторами, влияющими на развитие мозга.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Исследования показывают, что эстрадиол может корректировать дефициты, вызванные мутациями в генах риска РАС/НН. Например, он подавляет гиперактивность у мутантных рыбок данио (CNTNAP2), восстанавливает сигнальные пути в нейронах человека (hiPSC) с мутациями NRXN1 и нормализует пролиферацию клеток у головастиков с дефицитом DYRK1A. Однако масштаб влияния эстрадиола на широкий спектр генов РАС остается неизученным. В данной работе мы систематически оцениваем, как 17β-эстрадиол влияет на фенотипы, связанные с 36 функционально разнообразными генами высокого риска (включая ANK2, CHD8, PTEN, SHANK3 и др.), используя мультимодальный скрининг (Рис. 1).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-f1.jpg\" alt=\"Рисунок 1: Экспериментальный обзор двухуровневого, крупномасштабного мультимодального скринингового конвейера для оценки\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Экспериментальный обзор двухуровневого, крупномасштабного мультимодального скринингового конвейера для оценки влияния генов риска 17𝜷-эстрадиол-х-расстройства нейроразвития. Эффект лечения эстрадиолом и мутаций потери функции в генах риска расстройств нейроразвития (РНР) измеряется с помощью трех модальностей: (1) секвенирование РНК единичных клеток в глутаматергических нейронах человека, полученных из иПСК с индуцированной экспрессией NGN2 (iGLUT), (2) визуализация кальция в нейронах iGLUT и (3) сенсомоторное и поведенческое исследование возбуждения у личинок данио-рерио. Модальности включают пересекающиеся, но независимые наборы генов. Целевые геены ASD/NDD охватывают множество функций, включая регуляцию экспрессии генов (розовый), функцию и коммуникацию нейронов (зеленый), клеточную сигнализацию и модификацию белков (серый) и цитоскелет (синий).&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"metody-issledovaniya\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#metody-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы исследования&lt;/span&gt;&lt;/a&gt;Методы исследования&lt;/h4&gt;\n&lt;p&gt;Для изучения взаимодействия между мутациями и эстрадиолом мы применили CRISPR-технологии для нокаута генов в различных моделях. Мы исследовали экспрессию генов (Рис. SN-1: 36 генов) и активность нейронов в человеческих индуцированных глутаматергических нейронах (iGLUTs, Рис. SN-2: 15 генов). In vivo анализ сенсомоторного поведения и возбудимости проводился на личинках рыбок данио (Рис. SN-3: 31 ген на базовом уровне, 4 гена при терапии эстрадиолом). Для гена scn1lab мы провели глубокий анализ, включая RNA-seq, картирование активности мозга и тесты на судорожную активность. Статистическая обработка позволила выявить, что мутации ASH1L и SCN2A наиболее эффективно поддаются коррекции эстрадиолом.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;iGLUTs — нейроны, полученные из стволовых клеток пациента, которые специализируются на передаче возбуждающих сигналов через глутамат. Нокаут — метод «выключения» конкретного гена для изучения его функции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"rezultaty1\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#rezultaty1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"estradiol-vosstanavlivaet-transkripcionnye-effekty-genov-riska-ras/nrd\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#estradiol-vosstanavlivaet-transkripcionnye-effekty-genov-riska-ras/nrd\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эстрадиол восстанавливает транскрипционные эффекты генов риска РАС/НРД&lt;/span&gt;&lt;/a&gt;Эстрадиол восстанавливает транскрипционные эффекты генов риска РАС/НРД&lt;/h4&gt;\n&lt;p&gt;Для изучения общих и специфических эффектов эстрадиола на транскриптомном уровне в контексте генов риска аутизма и нейроразвития (ASD/NDD) авторы отобрали 36 таких генов с доказанными эффектами потери функции (LOF), как показано на Рис. 1-1 и в Таблице SI 1. В фокус внимания вошли 22 регулятора экспрессии генов, включая эпигенетические модификаторы, регуляторы хроматина и транскрипционные факторы: ARID1B, ASH1L, ASXL3, BCL11A, CHD2, CHD8, CREBBP, FOXP2, KDM5B, KDM6B, KMT2C, KMT5B (SUV420H1), MBD5, MED13L, PHF12, PHF21A, POGZ, SETD5, SIN3A, SKI, SMARCC2, WAC. Кроме того, были отобраны 7 генов нейронной коммуникации (синаптические гены и ионные каналы: CACNA1G, GRIA3, GRIN2A, NRXN1, SCN2A, SHANK3, SLC6A1), 3 гена клеточной сигнализации (CUL3, PPP2R5D, PTEN) и 4 гена цитоскелета (ANK2, ANK3, DPYSL2, DYRK1A). Отбор генов не был привязан к различиям в пенетрантности между полами; многие из них демонстрируют сходную пенетрантность как у мужчин, так и у женщин (Таблица SI 1).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод CRISPR-KO и одноклеточное секвенирование (ECCITE-seq) позволяют одновременно отключать множество целевых генов в пуле клеток и с высокой точностью определять индивидуальный транскриптомный ответ каждой отдельной клетки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Лентивирусная библиотека CRISPR-KO была создана на основе предварительно валидированных направляющих РНК (gRNA), содержащей по три-четыре gRNA на каждый ген (Таблицы SI 2 и SI 3). При этом 29 генов были отобраны и подтверждены в предыдущей работе исследователей. Был применен объединенный подход с нокаутом генов с помощью CRISPR (Рис. 2Ai) на стволовых клетках-предшественниках нервной системы (NPC), полученных из индуцированных плюрипотентных стволовых клеток человека (hiPSC) от двух доноров контроля (один мужчина, одна женщина, Рис. SI 1A), а также на функционально зрелых глутаматергических нейронах (iGLUT), полученных от одного донора-мужчины (Рис. 2 и Рис. SI 1A). Клетки обрабатывали эстрадиолом (E2 в концентрации 100 nM в течение 24 часов; экспрессия рецепторов представлена на Рис. SI 2, тесты на дозозависимость — на Рис. SI 3A) либо контрольным раствором носителя (DMSO).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-f2.jpg\" alt=\"Рисунок 2: Эстрадиол восстанавливает дисгулированные DEG и синаптические пути в iGLUT. A. Схема экспериментального дизай\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Рисунок 2: Эстрадиол восстанавливает дисгулированные DEG и синаптические пути в iGLUT. A. Схема экспериментального дизайна и сравнения различных эффектов. Тридцать шесть генов риска NDD нацелены с использованием объединенного скрининга CRISPR-нокаута единичных клеток в глутаматергических нейронах iGLUT, полученных из иПСК, с воздействием 100 нМ эстрадиола в течение 24 часов и без него. Каждый ген был нацелен с помощью 3-4 гРНК (i). Различные сравнения эффектов были выполнены среди обработанных и необработанных групп (ii). Основной эффект КО измеряет КО+ДМСО по сравнению с контролем без нацеливания (NT)+ДМСО. Основной эффект E2 измеряет NT+E2 по сравнению с NT+ДМСО. Эффект КО в рамках E2 измеряет КО+E2 по сравнению с NT+E2. Эффект E2 в рамках КО измеряет КО+E2 по сравнению с КО+ДМСО. Совместный эффект E2 и КО измеряет КО+E2 по сравнению с NT+ДМСО. B. Степень пертурбации для каждого целевого гена NDD (слева, точечная диаграмма). Размер круга указывает отрицательный логарифм 10 от p-значения. Штрих указывает логарифмическое изменение кратности нокаута +ДМСО по сравнению с контролем без нацеливания + ДМСО. Нокауты определялись на основе обогащения гРНК для целевых генов NDD и снижения экспрессии целевого гена КО. Количество дифференциально экспрессируемых генов при основном эффекте КО показано на гистограмме (FDR &amp;lt;0.05). C. Процент целевых генов ER среди генов, восстановленных эстрадиолом (синий), или не восстановленных генов (серый). D. Влияние восстановления эстрадиолом на DEG среди генов риска NDD в iGLUT. Влияние эстрадиола на количество основных DEG КО классифицируется по категориям: без изменений, частичное восстановление, восстановление и сверхкоррекция. Подробное описание порогов степени восстановления см. в Методах и на рис. 16 SI. Целевые гены ранжированы от наибольшего к наименьшему проценту DEG, классифицированных как восстановленные (FDR &amp;lt;0.05). E. Биологические пути генной онтологии (GO), восстановленные эстрадиолом среди 5 лучших целевых КО. Размер точки указывает –log10(p-значение) значимости обогащения набора генов эффекта E2 в пределах КО. F. Вероятность того, что конвейерные гены будут восстановлены E2 по сравнению с неконвергентными генами, проверенная на NDD KO. Точный тест Фишера, ***FDR&amp;lt;0.001, **FDR&amp;lt;0.01, &lt;em&gt;FDR&amp;lt;0.05. G. Выбранные термины GO, указывающие на восстановление эстрадиолом при нокауте ASH1L и SCN2A в iGLUT.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эксперименты проводились на клеточных моделях человека (hiPSC-производных NPC и iGLUT), что воспроизводит лишь отдельные аспекты нейроразвития in vitro и требует осторожности при экстраполяции на целостный организм.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Прямое детектирование gRNA объединили с секвенированием РНК единичных клеток (ECCITE-seq) для сопоставления эффектов в различных типах клеток и условиях присутствия эстрадиола (валидация gRNA приведена на Рис. SI 4). После фильтрации и контроля качества ученые проанализировали в общей сложности 39 278 клеток для 16 нокаутов ASD/NDD генов и контрольных образцов со скремблированными gRNA: 7067 клеток NPC с раствором носителя, 5553 клеток NPC с E2, 14 471 клетка iGLUT с раствором носителя и 12 187 клеток iGLUT с E2 (Рис. SI 1B, C, Таблица SI 4). Комбинируя фильтрацию истощения целевых генов с анализом сетей взвешенных ближайших соседей (WNN), исследователи выделили клетки с успешными генетическими нарушениями и распределили их по кластерам, соответствующим конкретным нокаутам, опираясь на обогащение gRNA и профили экспрессии. Данная стратегия обеспечила получение медианных значений в 234 клетки для iGLUT и 198 клеток для NPC на каждую gRNA, а также 39 клеток для iGLUT.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В ходе масштабного скрининга с использованием пула CRISPR-KO и ECCITE-seq на почти 40 тысячах клеток (NPC и iGLUT) удалось успешно идентифицировать клеточные кластеры для 16 нокаутов генов ASD/NDD при воздействии эстрадиола (100 nM) и контрольного вещества.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vliyanie-nokautov-i-estradiola-na-transkriptomnye-profili\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#vliyanie-nokautov-i-estradiola-na-transkriptomnye-profili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Влияние нокаутов и эстрадиола на транскриптомные профили&lt;/span&gt;&lt;/a&gt;Влияние нокаутов и эстрадиола на транскриптомные профили&lt;/h4&gt;\n&lt;p&gt;Применение CRISPR-KO позволило идентифицировать 28 гидовых РНК (gRNA) для нейропротекторов и 28 gRNA для нейропредшественников (NPC), успешных более чем в 75 клетках. В среднем нокаут генов приводил к истощению целевых мишеней на 22% в нейронах iGLUT и на 26% в клетках NPC, что из-за неоднородности нонсенс-опосредованного распада в популяциях клеток может быть заниженной оценкой реального эффекта возмущения. Транскриптомные сигнатуры сопоставлялись с контрольными кластерами со случайными последовательностями (NT) по множеству осей для разделения эффектов нокаута, эстрадиола и их взаимодействия (Рис. 2Ai). На исходном уровне каждый ген риска расстройств аутистического спектра и нейроразвития (ASD/NDD) приводил к общим и специфическим дифференциально экспрессируемым генам (DEG, FDR &amp;lt; 0.05), которые не определялись степенью пертурбации каждого целевого гена (Рис. 2B, Рис. S1D). Для десяти генов ASD/NDD, успешно атакованных двумя или более gRNA, наблюдались устойчивые корреляции DEG с коэффициентом Пирсона от 0.66 до 0.87 (Рис. S4B).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-fS1.jpg\" alt=\"Рис. S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Для всех достоверных различий между нокаутом и контролем (p &amp;lt; 0.05) авторы ввели классификацию: усугубление (exacerbated) — пертурбация в том же направлении с большей значимостью; без изменений (unchanged) — отсутствие изменений направления или значимости; частичное спасение (partial rescue) — более слабое и менее значимое возмущение в исходном направлении; спасение (rescued) — утрата значимых различий между мутантом и контролем; и гиперкоррекция (over-corrected) — различие в противоположном направлении относительно исходного фенотипа. Влияние эстрадиола на DEG (FDR &amp;lt; 0.05) и биологические пути (FDR &amp;lt; 0.05) оценивалось для всех нокаутов. Эстрадиол восстанавливал экспрессию DEG в 13 исследованных нокаутах, хотя и с разной степенью эффективности (iGLUT FDR &amp;lt; 0.05, ранжировано по проценту восстановленных DEG, Рис. 2D; номинальное значение p &amp;lt; 0.05 для NPC, Рис. S1E).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эстрадиол эффективно восстанавливает транскриптомные профили для 13 исследованных нокаутов, причем наибольшую устойчивость демонстрируют гены ASH1L и SCN2A.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В ходе анализа выделены два гена с устойчивыми мультимодальными эффектами восстановления под действием эстрадиола: ASH1L и SCN2A. Сравнение размеров эффектов основного нокаута и нокаута после обработки эстрадиолом показало, что эстрадиол сглаживает негативные эффекты мутаций, а эффекты нокаута и эстрадиола коррелируют отрицательно (Рис. 5, верхняя и нижняя панели). Ранее было показано, что точки конвергенции генов риска NDD/ASD наиболее выражены в зрелых нейронах iGLUT, где они затрагивают синаптические и эпигенетические сети. Неожиданно оказалось, что спасенные DEG не были обогащены мишенями рецепторов эстрогена сильнее, чем неспасенные, что указывает на участие негеномных сигнальных путей (Рис. 2C, Рис. S6A, S6C-G).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-f5.jpg\" alt=\"Рисунок 5: Эстрадиол восстанавливает нарушение регуляции транскрипционной активности и активности нейронной сети у мутан\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5: Эстрадиол восстанавливает нарушение регуляции транскрипционной активности и активности нейронной сети у мутантов scn1lab/SCN2A. A. Схема экспериментального рабочего процесса для оценки влияния эстрадиола на базовую экспрессию генов у личинок scn1lab-/-. B-C. Диаграммы Венна, показывающие перекрытие повышенных (B) или пониженных (C) DEG (p &amp;lt;0.1) в scn1lab-/- + DMSO и не-DEG (p &amp;gt;0.1) в scn1lab-/- + эстрадиол (E2), представляющих восстановленные DEG. Диаграммы Венна созданы в InteractiVenn155. Пути генной онтологии (GO)50, обогащенные среди повышенных (красный) и пониженных (синий) восстановленных DEG, показаны под диаграммами Венна. Пунктирная линия представляет FDR &amp;lt;0.05. Полный список восстановленных путей см. в Таблице SI 16. D. Схема метода сопоставления активности pERK/tERK с атласом мозга z-brain из 149 и 4 областей. (E) Области, восстановленные эстрадиолом, по атласу из 4 областей. (F) Нормализованные по Z-оценке воксельным методом значения pERK/tERK, представляющие различия в активности мозга в scn1labΔ44/Δ44 + DMSO или E2 по сравнению с личинками scn1lab+/+ , обработанными DMSO, разницу между двумя условиями из репрезентативного эксперимента и восстановленные области из атласа из 149 областей в метаанализе трех экспериментов. Для визуализации всех трех повторяющихся экспериментов см. Рис. 13 SI. (G) Тепловая карта, показывающая области из атласа из 149 областей со значительными различиями в активности (pERK/tERK) в мозге scn1labΔ44/Δ44 + DMSO по сравнению с scn1lab+/+ + DMSO (p &amp;lt;0.05, метаанализ LMM), которые восстановлены в scn1labΔ44/Δ44 + E2 (p &amp;gt;0.05, метаанализ LMM) или частично восстановлены (критерии порога степени восстановления см. в Методах и на Рис. 16 SI). Каждый прямоугольник представляет масштабированную бета-оценку из LMM, сравнивающую активность мозга в scn1labΔ44/Δ44 + E2 или DMSO с scn1lab+/+ + DMSO (пурпурный, выше, чем scn1lab+/+ + DMSO; циан, ниже, чем scn1lab+/+ + DMSO). Цвета, показанные рядом с названиями областей, относятся к изображению «Восстановленные области» на панели F. Звездочки (&lt;/em&gt;) указывают области, которые значимы в условиях DMSO. Знак фунта (#) указывает области, которые частично восстановлены в условиях E2. Пустой прямоугольник в условиях E2 указывает на полное восстановление. H. Слева: Схема экспериментального рабочего процесса для оценки влияния эстрадиола на индуцированную судорожную активность у личинок scn1lab-/-. I. Судорожная активность, индуцированная пентилентетразолом (PTZ), с воздействием 20 мкм эстрадиола в течение 24 ч и без него, измеряется у личинок-мутантов данио-рерио scn1lab-/- с использованием видеоотслеживания. Репрезентативные графики активности личинок контроля и scn1lab-/- на 5 dpf до и после воздействия носителя DMSO или 20 мкм эстрадиола и 10 мм PTZ или воды. Лента показывает +/- SEM. J. Средняя активность за 30 минут до (pre) и после (post) добавления 10 мм PTZ или воды к контрольным и scn1lab-/- личинкам до и после воздействия носителя DMSO или 20 мкм эстрадиола. Личинки scn1lab-/- + E2 + PTZ показывают значительно сниженную активность по сравнению с личинками scn1lab-/- + носитель + PTZ (непарный t-критерий Стьюдента с поправкой Уэлча для пост-значений, ****p&amp;lt;0.0001; n=24/группа). K. Модели взаимодействия, оценивающие эффект генотип-х-эстрадиол-х-PTZ, сравнивающие измерения после и до PTZ. Разбор эффекта мутанта (HOM против контроля), эффекта эстрадиола (эстрадиол против DMSO) и эффекта PTZ (PTZ против воды) (i). Трехфакторная модель взаимодействия для оценки эффекта PTZ среди групп личинок генотип-х-эстрадиол (ii). L. Слева: Схема экспериментального рабочего процесса для оценки влияния эстрадиола на активность нейронных пачек у SCN2A+/- iGLUT, созданных с помощью CRISPR. Справа: Клеточная активность и активность сетевых пачек, с воздействием острого 100 нМ эстрадиола и без него, измеряется в NGN2-iGLUT SCN2A+/- с использованием многоэлектродной матрицы. Столбчатые диаграммы показывают среднее количество клеточных пачек и сетевых пачек в контрольных и SCN2A+/- iGLUT. Непарный t-критерий, клеточные пачки *p=0.0415, сетевые пачки SCN2A+/- спонтанные против SCN2A+/- E2 *p=0.0127, SCN2A+/- спонтанные против WT спонтанные &lt;em&gt;p=0.0450.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Негеномные сигнальные пути — это механизмы передачи сигнала внутри клетки, которые реализуются через быстрые белковые взаимодействия и каскады киназ без прямой активации транскрипции в ядре.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Конвергентные DEG, определяемые по значимому метааналитическому FDR (FDR &amp;lt; 0.05), незначимому тесту гетерогенности Кокрана (p &amp;gt; 0.05) и общему направлению изменений у всех 16 нокаутов, чаще поддавались коррекции эстрадиолом по сравнению с неконевергентными в 7 генах-мишенях (точный тест Фишера, ***FDR &amp;lt; 0.001, **FDR &amp;lt; 0.01, *FDR &amp;lt; 0.05) (Рис. 2F, Рис. S6B). Все пути Gene Ontology (GO), значимые для основного эффекта нокаута (p &amp;lt; 0.05), сравнивались с действием эстрадиола внутри нокаутов. В нейронах iGLUT эстрадиол восстанавливал нарушенные пути синаптической передачи, развития нейронов, организации цитоскелета, клеточных контактов, клеточного цикла, ответа на гормоны и активности ионных каналов для топ-5 нокаутов (Рис. 2E, Таблица S5). Для ASH1L и SCN2A восстанавливались пути, связанные с интекринами, структурным гомеостазом и транскрипционной активностью (Рис. 2G). У клеток NPC для 8 нокаутов эстрадиол возвращал в норму пути транскрипции, трансляции, мембранного транспорта, митохондриальной энергетики и межклеточных контактов (Рис. S1F-G, Таблица S6).&lt;/p&gt;\n&lt;h4 id=\"bystraya-korrekciya-gipersinhronnosti-nejronnyh-setej-pri-ras/ndr-pod-dejstviem-estradiola\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#bystraya-korrekciya-gipersinhronnosti-nejronnyh-setej-pri-ras/ndr-pod-dejstviem-estradiola\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Быстрая коррекция гиперсинхронности нейронных сетей при РАС/НДР под действием эстрадиола&lt;/span&gt;&lt;/a&gt;Быстрая коррекция гиперсинхронности нейронных сетей при РАС/НДР под действием эстрадиола&lt;/h4&gt;\n&lt;p&gt;Для изучения негеномных эффектов эстрадиола в iGLUT-нейронах мы применили CRISPR-нокаут (KO) 15 генов в сочетании с кальциевым имиджингом (краситель Fluo4). Выборка включала регуляторы экспрессии (ARID1B, ASH1L, CHD8, KMT5B, POGZ), гены нейронной коммуникации (CACNA1G, GRIA3, GRIN2A, NRXN1, SCN2A, SHANK3), а также гены цитоскелета (ANK2, DYRK1A) и сигнальных путей (CUL3, PTEN) (Рис. 1-2). Активность нейронов оценивали на 30-й день (30DIV, незрелые сети — спайки отдельных клеток) и на 60-й день (60DIV, зрелые сети — синхронизированные осцилляции и сетевые вспышки) (Рис. 3A; Рис. SN 7, 8A).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-f3.jpg\" alt=\"Рисунок 3: Эстрадиол восстанавливает паттерн гиперсинхронного разряда у пяти мутантов NDD. A. Экспериментальный рабочий \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3: Эстрадиол восстанавливает паттерн гиперсинхронного разряда у пяти мутантов NDD. A. Экспериментальный рабочий процесс для оценки нейронной активности. Нейронная активность после острого немедленного введения 100 нМ эстрадиола измеряется у 15 нокаутов генов риска NDD в iGLUT с использованием кальциевой визуализации Fluo4 с конфокальной микроскопией. Отдельные клетки идентифицируются с помощью настроенного анализа пиксельной сегментации клеток. Измеряются продолжительность и амплитуда кальциевых транзиентов, а также события синхронизации сети. B. Корреляционный анализ спонтанной сетевой синхронизации выявляет 4 субкластера генов риска NDD со схожими фенотипами. Кластер 1: KMT5B и контроль без нацеливания (NT). Кластер 2: CACNA1G, SHANK3, ANK2, ASH1L, SCN2A. Кластер 3: CHD8, PTEN, ARID1B, CUL3. Кластер 4: POGZ, NRXN1, GRIA3, GRIN2A, DYRK1A. Желтая рамка указывает на кластер 2 с четким фенотипом гиперсинхронного разряда. C. Растровые диаграммы спонтанной исходной нейронной активности (вверху) и после обработки эстрадиолом (внизу) в контроле без нацеливания, ASH1L, SCN2A, SHANK3, ANK2 и CACNA1G. Каждая строка растровой диаграммы — это клетка, а каждый столбец — кадр. Клетки снимались в течение 1 минуты (750 кадров). D. Корреляционный анализ спонтанной и обработанной эстрадиолом сетевой синхронизации. Формируются два разных кластера. Кластер 1: Спонтанные ANK2, ASH1L, CACNA1G, SCN2A и SHANK3. Кластер 2: Спонтанный контроль без нацеливания, Контроль без нацеливания, обработанный эстрадиолом, ANK2, обработанный эстрадиолом, ASH1L, CACNA1G, SCN2A, SHANK3. E. Ранжирование нокаутов генов риска по проценту активных нейронов, которые вносят вклад в паттерн синхронизации, обращенный вспять лечением эстрадиолом.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR-KO — метод «выключения» конкретного гена для проверки его функции, а кальциевый имиджинг с Fluo4 позволяет визуализировать активность нейронов через изменение концентрации ионов кальция в реальном времени.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;На стадии 30DIV эстрадиол (100 нм, мгновенное воздействие) нормализовал частоту спайков у 5 линий (SHANK3, DYRK1A, POGZ, GRIA3, GRIN2A) и амплитуду у 6 линий (DYRK1A, POGZ, GRIA3, GRIN2A, CACNA1G, SHANK3) (Рис. SN 7). В зрелых сетях (60DIV) исходно выделили 4 кластера активности: 1 — контроль; 2 — длительная гиперсинхронизация (ASH1L, SCN2A, SHANK3, ANK2, CACNA1G); 3 — гипоактивность (ARID1B, CUL3, CHD8, PTEN); 4 — промежуточный тип (NRXN1, GRIA3, POGZ, GRIN2A, DYRK1A) (Рис. 3B, 3C; Рис. SN 8B-E).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эстрадиол наиболее эффективно устранил гиперсинхронность в кластере 2 (ASH1L, SCN2A, SHANK3, ANK2, CACNA1G), восстановив нормальные паттерны осцилляций сразу после введения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;После обработки эстрадиолом профили активности KO-нейронов стали ближе к контрольным (Рис. 3D). Наиболее выраженный эффект наблюдался в кластере 2: гиперсинхронность быстро сменялась нормальными осцилляциями (Рис. 3C). Степень восстановления оценивали по доле синхронизированных клеток (Рис. 3E). Полученные данные подтверждают, что эстрадиол способен мгновенно корректировать аномальную активность, вызванную мутациями в ряде генов риска РАС/НДР, через негеномные механизмы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проведено на iGLUT-нейронах (in vitro), поэтому наблюдаемые эффекты требуют подтверждения в живых организмах для оценки клинической значимости.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"spasenie-fenotipa-povedencheskih-narushenij-i-rasstrojstv-sna-s-pomoshyu-estradiola-in-vivo\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#spasenie-fenotipa-povedencheskih-narushenij-i-rasstrojstv-sna-s-pomoshyu-estradiola-in-vivo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Спасение фенотипа поведенческих нарушений и расстройств сна с помощью эстрадиола in vivo&lt;/span&gt;&lt;/a&gt;Спасение фенотипа поведенческих нарушений и расстройств сна с помощью эстрадиола in vivo&lt;/h4&gt;\n&lt;p&gt;Исследователи провели комплексную оценку базового сенсомоторного поведения и показателей бодрствования на моделях Danio rerio для 31 ортолога генов, ассоциированных с расстройствами аутистического спектра и нарушениями нейроразвития (ASD/NDD). В экспериментах использовались как мозаичные F0-нокауты (CRISPants), так и стабильные мутантные линии (Рис. 1–3; Таблицы S8–S11). Среди изученных генов 19 являлись регуляторами экспрессии генов (ARID1B, ASH1L, BCL11A, CHD2, CHD8, CREBBP, KDM5B, KDM6B, KMT2C, KMT5B, MBD5, PHF12, PHF21A, POGZ, SETD5, SIN3A, SKI, SMARCC2, WAC), 7 относились к генам межнейронной коммуникации (CACNA1G, GRIA3, GRIN2A, NRXN1, SCN2A, SHANK3, SLC6A1; при этом у рыбок Danio rerio ген scn1lab выступает ортологом человеческих SCN1A и SCN2A), 3 входили в группу сигналинга и модификации белков (CUL3, PPP2R5D, PTEN), и 2 являлись цитоскелетными генами (ANK2, DYRK1A).&lt;/p&gt;\n&lt;p&gt;Количественный анализ поведенческих профилей выполнялся с помощью высокопроизводительного автоматизированного видеотрекинга по 24 параметрам зрительной реакции испуга (VSR) и цикла «сон — бодрствование» (Рис. 4A, Таблица S7). Иерархическая кластеризация выявила семь базовых поведенческих кластеров (Рис. 4C; Рис. S9A):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Группа 1: wacab, crebbpab, arid1b, phf21aab;&lt;/li&gt;\n&lt;li&gt;Группа 2: cacna1g, ptenab, nrxn1ab, scn1lab, ash1l, chd8;&lt;/li&gt;\n&lt;li&gt;Группа 3: grin2aab, chd2, skiab, phf12ab;&lt;/li&gt;\n&lt;li&gt;Группа 4: kdm5ab, ppp2r5d, bcl11ab, mbd5;&lt;/li&gt;\n&lt;li&gt;Группа 5: ank2ab, kmt2cab, kmt5b;&lt;/li&gt;\n&lt;li&gt;Группа 6: slc6a1ab, kdm6bab, dyrk1aab, sin3ab;&lt;/li&gt;\n&lt;li&gt;Группа 7: smarcc2, setd5, gria3ab, pogzab, shank3ab, cul3ab.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-f4.jpg\" alt=\"Рисунок 4: Механизмы рецепторов эстрадиола предсказывают восстановление эстрадиолом фенотипов возбуждения и сенсомоторны\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4: Механизмы рецепторов эстрадиола предсказывают восстановление эстрадиолом фенотипов возбуждения и сенсомоторных функций у мутантов ash1l и scn1lab. A. Экспериментальная установка для анализа поведения личинок данио-рерио. Поведение личинок измеряется с помощью автоматического видеоотслеживания. Визуальный старт-рефлекс (VSR): личинки акклиматизируются и подвергаются воздействию пяти 1-секундных вспышек выключения света (Startle-OFF) или включения (Startle-ON) с интервалами в 29 секунд на 5-й день после оплодотворения (dpf). Сон-бодрствование: личинки подвергаются воздействию цикла свет:темнота 14ч:10ч с 5 по 7 dpf. Показаны параметры визуального старт-рефлекса и сна-бодрствования. B. Схема фармакоповеденческого профилирования 376 одобренных FDA соединений у дикого типа данио-рерио для предсказания лекарств и механизмов, которые антикоррелируют (противодействуют) или коррелируют (имитируют) с поведенческими фенотипами мутантов. C. Корреляционный анализ по 24 поведенческим параметрам визуального старт-рефлекса и сна-бодрствования выявляет 7 субкластеров мутантов генов риска NDD со схожими фенотипами. Кластер 1: wacab, crebbpab, arid1b, phf21aab. Кластер 2: cacna1g, ptenab, nrxn1ab, scn1lab, ash1l, chd8. Кластер 3: grin2aab, chd2, skiab, phf12ab. Кластер 4: kdm5bab, ppp2rd5, bcl11aab, mbd5. Кластер 5: ank2ab, kmt2cab, kmt5b. Кластер 6: slc6a1ab, kdm6bab, dyrk1aab, sin3ab. Кластер 7: smarcc2, setd5, gria3ab, pogzab, shank3ab, cul3ab. Последовательности мутаций F0 и стабильной линии можно найти в Таблицах SI 8-9. Желтая рамка выделяет кластер 2, который включает гены из различных функциональных классификаций. D. Молекулярные мишени альфа-, бета-рецепторов эстрогена (ER) и G-белка значительно обогащены среди антикоррелирующих (синий, корреляция &amp;lt;-0.5, p&amp;lt;0.05, t-статистика) и коррелирующих (оранжевый, корреляция &amp;gt;0.5, p&amp;lt;0.05, t-статистика) лекарств среди мутантов генов NDD. Мутанты, для которых нет обогащения ER, не показаны. Размер круга указывает -log10(p-значение), рассчитанный с использованием точного теста Фишера. Длина штриха указывает отношение шансов для каждого мутанта. Гены NDD ранжированы по размеру круга и длине штриха. Обогащение альфа-, бета-рецепторов эстрогена и G-белка, а также p-значения для каждого гена приведены в Таблице SI 13. E. Сеть белок-белковых взаимодействий (PPI) среди мишеней (пурпурные круги) антикоррелирующих лекарств (серые ромбы) (корреляция &amp;lt;-0.5, p&amp;lt;0.05, t-статистика) для мутанта ash1l на основе базы данных STRING (i). Размер узла белков представляет количество лекарств, нацеленных на каждый белок. Указаны пути GO, обогащенные среди лекарственных мишеней (ii). F. Тепловая карта эмпирических бета-значений для каждого поведенческого параметра для мутантов scn1lab и ash1l между эффектом самого мутанта (верхняя строка, HOM DMSO против WT DMSO) и эффектом взаимодействия мутанта и лечения эстрадиолом (24 ч, 20 мкм) по сравнению с носителем WT (HOM E2 против WT DMSO), показывающая относительное подавление поведенческих признаков. Звездочки (&lt;/em&gt;) указывают поведенческие признаки, которые существенно различаются в указанной группе сравнения (p * &amp;lt;0.05, ** &amp;lt;0.01, ***&amp;lt;0.001, ***&lt;em&gt;&amp;lt;0.0001, LMM). Желтые рамки указывают параметры, которые были восстановлены (существенно отличаются в HOM DMSO против WT DMSO и больше не значимы в HOM E2 против WT DMSO) или частично восстановлены (существенно отличаются в HOM DMSO против WT DMSO и уменьшены в HOM E2 против WT DMSO). Знак фунта (#) указывает на то, что признак частично восстановлен (i). Для поведенческих признаков, которые существенно различаются в HOM DMSO против WT DMSO с p-значением ≤ 0.05, мы охарактеризовали эффект HOM-x-E2 для каждого признака как усугубленный, без изменений, частичное восстановление, восстановление и сверхкоррекция (ii). Для подробного описания порогов для каждой классификации см. Методы и Рис. 16 SI. Мутанты ранжированы по количеству восстановленных или частично восстановленных признаков. G. Для мутантов scn1lab и ash1l скрипичные диаграммы показывают сравнение величины эффекта (распределение масштабированных бета-оценок) на параметры поведения сна-бодрствования между HOM DMSO против WT DMSO (слева) и HOM E2 против WT DMSO (справа). Графики «ящик с усами» показывают репрезентативные параметры, которые были восстановлены для каждого мутанта. Повышенная ночная активность бодрствования и увеличенное количество эпизодов сна были восстановлены эстрадиолом у мутантов scn1lab и ash1l соответственно (непарный t-критерий Стьюдента с поправкой Уэлча, **** p &amp;lt; 0.0001, *** p = 0.0010. scn1lab n = 48/группа; ash1l WT DMSO n=21, WT E2 n=21, HOM DMSO n=23, HOM E2 n=18).&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Автоматизированный видеотрекинг и иерархический кластерный анализ позволяют объединять генетические модели в группы со сходными изменениями реакции на испуг (VSR) и профилей сна и бодрствования.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Используя фармако-поведенческую базу данных, авторы нашли соединения, способные либо имитировать фенотип мутантов (положительная корреляция), либо инвертировать его (антикорреляция) (Рис. 4B). Была проверена гипотеза о том, обогащены ли мишени на уровне генов (Рис. 4D, Таблица S13) или кластеров (Рис. S9B) препаратами, воздействующими на геномные (ERα и ERβ) или внегеномные (GPER1) эстрогеновые рецепторы (гены cacna1g, pten и nrxn1 без обогащения эстрадиолом на графиках не отображались).&lt;/p&gt;\n&lt;p&gt;Поведенческие фенотипы мутантов из кластера 2, в особенности ash1l и scn1lab, продемонстрировали сильнейшую антикорреляцию с эстрогенными соединениями (коэффициент антикорреляции &amp;lt; -0.5, p &amp;lt; 0.05, t-критерий) (Таблица S14). В отличие от них, мутанты из других кластеров (smarcc2, setd5, gria3ab, shank3ab и kmt5b) проявляли фенотипы, высоко коррелирующие с эффектом эстрадиола у дикого типа (r &amp;gt; 0.5, p &amp;lt; 0.05, t-критерий).&lt;/p&gt;\n&lt;p&gt;Анализ белок-белковых взаимодействий (STRING) для ключевых генов ответа (ash1l на Рис. 4Ei, Рис. S9C; и scn1lab) подтвердил присутствие ERα, ERβ и GPER среди фармакологических мишеней с антикоррелирующим эффектом. Анализ онтологии генов (GO) выявил обогащение сигнальных путей ядерной транскрипции, гормонального сигналинга и эстрогенового ответа (Рис. 4Eii).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мутанты ash1l и scn1lab продемонстрировали высокую чувствительность к эстрадиолу с обратной корреляцией фенотипа (r &amp;lt; -0.5, p &amp;lt; 0.05), что стало биологическим обоснованием для использования эстрогенных препаратов в целях коррекции поведенческих нарушений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Экспериментальное подтверждение терапевтического эффекта эстрадиола проводилось на личинках 5–7 дней после оплодотворения (dpf) с гомозиготными мутациями ash1l и scn1lab (прогнозировалось спасение), kmt5b (прогнозировалась имитация фенотипа) и nrxn1ab (эффект не прогнозировался) (Рис. 4F). Личинок обрабатывали 20 мкМ эстрадиола в течение 24 часов или контролем (ДМСО) (анализ дозозависимости представлен на Рис. S3B–S3C).&lt;/p&gt;\n&lt;p&gt;Ранжирование эффекта по суммарному числу частично и полностью восстановленных параметров показало, что максимальное спасение фенотипа наблюдалось у scn1lab и ash1l, за ними следовал kmt5b, и наименьший эффект был у nrxn1ab (Рис. 4Fii). Острая экспозиция эстрадиолом (опосредуемая внегеномными механизмами) также вызывала специфическое восстановление фенотипа (Рис. S10, Таблица S12), однако 24-часовая инкубация обеспечивала более выраженный эффект. У мутантов scn1lab и ash1l эстрадиол нормализовал специфические параметры сна и бодрствования, устраняя ночную гиперактивность и прерывистость сна соответственно (Рис. 4G).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Описанные эффекты спасения поведенческих фенотипов получены на модели личинок Danio rerio (5–7 dpf) при инкубации с 20 мкМ эстрадиола; для оценки возможности трансляции этих результатов на человека требуются исследования на млекопитающих.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"estradiol-vosstanavlivaet-transkripcionnuyu-i-setevuyu-aktivnost-pri-mutaciyah-scn2a-i-scn1lab-u-rybok-danio\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#estradiol-vosstanavlivaet-transkripcionnuyu-i-setevuyu-aktivnost-pri-mutaciyah-scn2a-i-scn1lab-u-rybok-danio\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эстрадиол восстанавливает транскрипционную и сетевую активность при мутациях SCN2A и scn1lab у рыбок данио&lt;/span&gt;&lt;/a&gt;Эстрадиол восстанавливает транскрипционную и сетевую активность при мутациях SCN2A и scn1lab у рыбок данио&lt;/h4&gt;\n&lt;p&gt;Для изучения механизмов влияния эстрадиола на нейронную активность были использованы личинки рыбок данио (6 сут после оплодотворения, dpf), гомозиготные по мутации scn1lab, и их дикие сородичи. Рыб обрабатывали эстрадиолом (20 мкМ) или растворителем (ДМСО) в течение 24 часов, после чего проводили полногеномное секвенирование РНК (Рис. 5A). Анализ показал, что эстрадиол корректирует экспрессию генов (p &amp;lt; 0,1), связанных с синаптической передачей, развитием нейронов, клеточным циклом, энергетическим обменом митохондрий и активностью ионных каналов (Рис. 5B-C, Рис. SN 11, Таблицы SN 15-16). Обогащение эстроген-зависимых путей указывает на то, что эффект может реализовываться через геномную сигнализацию.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эстрадиол нормализует экспрессию генов, связанных с синаптической функцией и энергетическим обменом, нарушенную у мутантов scn1lab.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для оценки активности мозга использовали картирование pERK/tERK (Рис. 5D). У мутантов scn1lab наблюдались региональные нарушения активности, которые частично или полностью купировались эстрадиолом в теленцефалоне, ромбэнцефалоне и диэнцефалоне (Рис. 5E-F, Рис. SN 13). Детальный атлас из 149 областей выявил двунаправленный эффект: снижение гиперактивности в ромбэнцефалоне и гипоталамусе, а также повышение активности в теленцефалоне (Рис. 5G, Таблица SN 18). Эти области коррелируют с экспрессией рецепторов esr2b и gper1 у личинок.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;pERK/tERK — это метод визуализации активности нейронов, где фосфорилированная форма ERK (pERK) служит маркером недавнего притока кальция, отражая возбуждение клетки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;При индукции судорог пентилентетразолом (PTZ, 10 мМ) мутанты scn1lab демонстрировали резкие всплески активности. Эстрадиол (20 мкМ) достоверно снижал частоту и длительность этих судорожных вспышек (Рис. 5H-J, Рис. 5K, Таблица SN 19). Использование селективных агонистов ERα (PPT), ERβ (DPN) и GPER1 (G1) показало, что все три типа рецепторов участвуют в подавлении судорог (Рис. SN 14). Аналогичный эффект был подтвержден на человеческих нейронах SCN2A+/-, где эстрадиол (100 нМ) снижал сетевую активность, измеренную методом многоэлектродных матриц (Рис. 5L, Таблица SN 20).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проведено на моделях рыбок данио и клеточных культурах человека; механизмы действия эстрадиола могут отличаться в целостном организме млекопитающих.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"uluchshennaya-setevaya-svyaznost-i-osobye-profili-ekspressii-v-razvivayushejsya-kore-golovnogo-mozga-dlya-klyuchevyh-genov,-chuvstvitelnyh-k-estradiolu\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#uluchshennaya-setevaya-svyaznost-i-osobye-profili-ekspressii-v-razvivayushejsya-kore-golovnogo-mozga-dlya-klyuchevyh-genov,-chuvstvitelnyh-k-estradiolu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Улучшенная сетевая связность и особые профили экспрессии в развивающейся коре головного мозга для ключевых генов, чувствительных к эстрадиолу&lt;/span&gt;&lt;/a&gt;Улучшенная сетевая связность и особые профили экспрессии в развивающейся коре головного мозга для ключевых генов, чувствительных к эстрадиолу&lt;/h4&gt;\n&lt;p&gt;Для выявления генов расстройств аутистического спектра и нейроразвития (ASD/NDD), наиболее восприимчивых к терапевтическому действию эстрадиола, исследователи интегрировали мультимодальные транскриптомные, клеточные и поведенческие наборы данных (Рис. 6A, Таблица S21). Сопоставление барицентров Вассерсена для каждой модальности в латентном пространстве (Рис. 6B) позволило выделить три обособленных кластера: контрольная группа генов, группа после воздействия эстрадиола и группа носителей носителей транспортного средства (Рис. 6C). Анализ междистанционных расстояний между условиями показал, что данные кальциевого имиджинга iGLUT (отражающие нейрональную активность) и поведенческие тесты на данио-рерио наиболее близки внутри условий обработки, в то время как данные одноклеточной транскриптомики демонстрируют наибольшую обособленность как внутри, так и между условиями (Рис. 6D). Ранжирование нокаутов ASD/NDD генов по степени их восстановления эстрадиолом во всех модальностях выявило лидеров — ASH1L и SCN2A, за которыми следует SHANK3 (Рис. 6E). Более скромные и специфичные для конкретных модальностей эффекты восстановления отмечены для ASXL3, MED13L, CACNA1G и ANK2 (Рис. 6E; Таблица S22). В общей сложности была выделена подгруппа из 7 генов ASD/NDD (ASH1L, SCN2A, SHANK3, ASXL3, MED13L, CACNA1G, ANK2), проявивших максимальную чувствительность к эстрадиолу.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-f6.jpg\" alt=\"Рисунок 6: Мультимодальный метаанализ выявляет наибольший эффект обратного воздействия эстрадиола у мутантов ASH1L и SCN\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 6: Мультимодальный метаанализ выявляет наибольший эффект обратного воздействия эстрадиола у мутантов ASH1L и SCN2A. A. Таблица из 36 генов риска РАС, охваченных тремя модальностями: одиночная транскриптомика iGLUT (зеленый), кальциевый имиджинг iGLUT (синий) и поведение рыбок данио-рерио (фиолетовый). Для каждого целевого гена цвет(а) верхней половины квадрата указывает на протестированную модальность, а цвет(а) нижней половины — на модальность, в которой эстрадиол оказал спасающий эффект. Белые квадраты указывают на отсутствие спасающего эффекта эстрадиола у мутанта. B. Схематичное изображение метода барицентра Вассерсана для определения геометрического среднего каждой модальности и отделения эффекта эстрадиола от контрольного эффекта. T&lt;/em&gt; указывает план выравнивания для отображения одного распределения в другое, а Z* указывает латентное пространство барицентра, где распределения сходятся вместе. C. График барицентра, показывающий контрольный эффект (зеленый), эффект эстрадиола оранжевый) и неэстрадиольный эффект (серый). Модальности представлены разными формами. Круг (•) указывает на дифференциально экспрессируемые гены для каждого мутанта. Знак плюс (+) указывает на паттерн синхронизации для каждого мутанта. Звездочка (&lt;em&gt;) указывает на поведенческие реакции отдельных личинок. Барицентры обозначены треугольниками (∆). D. Тепловая карта расстояний между модальностями в проецируемом латентном пространстве. Теплые цвета указывают на меньшее расстояние, а холодные — на большее. Масштабная шкала нормализована по расстоянию каждой модальности в проецируемом пространстве. E. Ранжирование генов по величине эффекта обратного воздействия эстрадиола по модальностям.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Нокаут (KO) — это лабораторный метод генетики, при котором исследователи искусственно «выключают» или удаляют определенный ген у модельного организма, чтобы изучить его функции по возникающим нарушениям.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для проверки гипотезы о том, что чувствительность к эстрадиолу предсказывает клинические проявления с половым диморфизмом при аутизме, авторы проанализировали распределение по полу носителей de novo белок-усекающих вариантов (PTV) в подгруппе из 7 наиболее чувствительных и 29 наименее чувствительных генов ASD/NDD. Различий обнаружено не было (точный тест Фишера, OR = 0.93, 95% ДИ = 0.70–1.25, P = 0.669, Рис. S15A-B, Таблицы S23-24). Аналогичным образом, клинические фенотипы по шести стандартным шкалам ASD/NDD у участников мужского и женского пола из когорты SPARK с вариантами в 7 самых чувствительных и 29 наименее чувствительных генах не показали значимого полового взаимодействия при анализе чувствительности PTV (Таблица S25; Рис. S15C). Таким образом, получены данные об отсутствии связи между чувствительностью к эстрадиолу и половыми различиями в клинической картине.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Семь генов, наиболее чувствительных к эстрадиолу (ASH1L, SCN2A, SHANK3, ASXL3, MED13L, CACNA1G, ANK2), не объясняют половые различия в клинике аутизма, но демонстрируют повышенную коэкспрессию и сильные функциональные связи в развивающемся мозге.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;На следующем этапе ученые изучили экспрессию наиболее (n = 7) и наименее (n = 29) чувствительных к эстрадиолу генов в головном мозге. Сравнение базовой полоспецифичной экспрессии в коре головного мозга по постмортальным данным (абсолютное значение log2 fold change между мужчинами и женщинами) в двух независимых наборах данных не выявило значимых различий (UCLA, P = 0.333; BrainVar, P = 0.375; метаанализ, P = 0.757) (Рис. 7A, Таблица S30). Хотя траектории развития корковой экспрессии также не различались статистически (для наиболее чувствительных Spearman ρ = 0.29, P = 0.535; для наименее чувствительных Spearman ρ = −0.75, P = 0.052) (Рис. 7B), один подтип возбудимых нейронов (созревающие возбудимые нейроны верхних слоев коры, ExM-U) продемонстрировал выраженный специфический профиль развития, связанный с генами, чувствительными к эстрадиолу (медиана z-скора 1.59 против −0.11; IQR, 0.956–1.87 против −0.520–0.276; ранговый тест Вилкоксона, W = 189, P = 5.06 × 10−4, FDR = 0.0081) (Рис. 7C, Таблицы S28-29).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-f7.jpg\" alt=\"Рисунок 7: Сетевая связность, онтогенетическая экспрессия и экспрессия с половым диморфизмом для генов, реагирующих на э\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 7: Сетевая связность, онтогенетическая экспрессия и экспрессия с половым диморфизмом для генов, реагирующих на эстрадиол. A. Величина экспрессии генов с половым диморфизмом в корковых транскриптомических наборах данных UCLA и BrainVar, а также в их метаанализе. Абсолютное логарифмическое изменение кратности (/log2FC/) между мужскими и женскими образцами использовалось для количественной оценки величины экспрессии с половым диморфизмом. На коробчатых диаграммах показаны медиана и межквартильный размах (IQR), а отдельные точки представляют гены. Различия между двумя группами генов оценивались с помощью двусторонних тестов суммы рангов Уилкоксона. B. Траектории онтогенетической экспрессии двух групп генов в коре головного мозга по данным BrainSpan. Значения экспрессии были стандартизированы внутри генов до z-оценок, а кривые показывают траектории онтогенетической экспрессии медианной z-оценки экспрессии для каждого гена. Коэффициент ранговой корреляции Спирмена (rho) и соответствующие значения P количественно определяют монотонную связь между стадией развития и экспрессией для каждой группы генов. C. Экспрессия двух групп генов, специфичная для типов клеток, в развивающейся коре головного мозга человека. Значения экспрессии для конкретных генов были стандартизированы по типам клеток, а столбцы представляют медианную z-оценку экспрессии для типа клеток с межквартильным размахом (IQR). Различия между двумя группами генов оценивались с помощью двусторонних тестов суммы рангов Уилкоксона с последующей коррекцией FDR Бенджамини–Хохберга по типам клеток. Сокращения типов клеток следующие: vRG — вентрикулярная радиальная глия; oRG — внешняя радиальная глия; PgS — пролиферирующие клетки в S-фазе; PgG2M — пролиферирующие клетки в фазе G2/M; IP — промежуточные предшественники; ExN — новорожденные/мигрирующие возбуждающие нейроны; ExM — созревающие возбуждающие нейроны; ExM-U — созревающие возбуждающие нейроны с обогащением в верхних слоях; ExDp1 и ExDp2 — подтипы возбуждающих нейронов глубоких слоев 1 и 2; InMGE — интернейроны, происходящие из медиального ганглиозного возвышения; InCGE — интернейроны, происходящие из каудального ганглиозного возвышения; OPC — клетки-предшественники олигодендроцитов; Mic — микроглия; End — эндотелиальные клетки; Per — перициты. D. Коэкспрессионная связность двух групп генов, специфичная для стадий развития, в образцах коры головного мозга из базы данных BrainSpan. Для каждой стадии развития парные корреляции Спирмена между генами рассчитывались по образцам коры, а средняя внутригрупповая корреляция Спирмена рассчитывалась для каждого гена. Точки указывают медианную связность на уровне генов, а планки погрешностей указывают межквартильный размах (IQR). Групповые различия на каждой стадии развития оценивались с помощью двусторонних тестов суммы рангов Уилкоксона с коррекцией ложного обнаружения (FDR) Бенджамини–Хохберга по стадиям. E. Сравнение нормализованной внутригрупповой степени белок-белковых взаимодействий (PPI) между семью генами, наиболее чувствительными к эстрадиолу, и 29 наименее чувствительными генами с использованием сети функциональных взаимодействий STRING. Нормализованная степень рассчитывалась как количество внутригрупповых взаимодействий для каждого гена, деленное на максимально возможное количество взаимодействий внутри его группы генов. Различия между группами оценивались с помощью двустороннего теста суммы рангов Уилкоксона.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Наиболее чувствительные к эстрадиолу гены показали усиленную коэкспрессионную связь в период постнатального развития коры, в частности в младенчестве (медиана связности 0.660 против 0.224; P = 2.36 × 10−4, FDR = 0.00165), в детском возрасте (0.611 против 0.424; P = 0.0118, FDR = 0.0275) и в подростковом периоде (0.723 против 0.484; P = 0.00159, FDR = 0.00557) (Рис. 7D, Таблицы S26-27). Кроме того, эти гены обладали значительно более высокой нормированной белок-белковой сетевой связностью (PPI) внутри группы по сравнению с наименее чувствительными генами (средняя нормированная степень 0.381 против 0.160; ранговый тест Вилкоксона, W = 172.5, P = 0.0046, Рис. 7E), что свидетельствует о более прочных функциональных взаимосвязях между ними. В совокупности эти результаты показывают, что вместо полоспецифичной экспрессии в коре, ключевые геномные мишени эстрадиола выделяются усиленной коэкспрессией в постнатальном онтогенезе и более плотной сетевой организацией.&lt;/p&gt;\n&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;p&gt;Использование мультимодального подхода, сочетающего эксперименты на человеческих клетках &lt;em&gt;in vitro&lt;/em&gt; и мутантных рыбах данио-рерио &lt;em&gt;in vivo&lt;/em&gt;, позволило детально исследовать взаимодействие эстрадиола с мутациями потери функции (LoF) в генетически разнообразных и высокопенетрантных генах риска расстройств аутистического спектра и нейроразвития (РАС/НР). Полученные данные свидетельствуют о том, что эстрадиол оказывает как сходное (конвергентное), так и различающееся (дивергентное) действие на различные гены риска РАС/НР, реализующееся через геномные и негеномные механизмы. Подтверждая ранние наблюдения о способности эстрадиола подавлять фенотипы, связанные с патологией таких генов, настоящее исследование показывает смягчение дефектов при LoF-мутациях, причем наибольшую чувствительность к эстрадиолу продемонстрировали гены &lt;em&gt;ASH1L&lt;/em&gt; и &lt;em&gt;SCN2A&lt;/em&gt;. Результаты подчеркивают важность стратификации генов аутизма, так как степень их восприимчивости к терапевтическому эффекту гормона различается в разных контекстах.&lt;/p&gt;\n&lt;p&gt;На уровне транскриптома эстрадиол способствовал широкому восстановлению экспрессии генов, нарушенной при нокаутах всех исследованных генов (Рис. 2). Гормон приводил к конвергенции паттернов экспрессии нейрональных генов и путей независимо от генотипа, восстанавливая регуляцию нейротрансмиссии, нейроразвития и цитоскелета, что согласуется с известными данными. У мутантных особей данио-рерио &lt;em&gt;scn1lab&lt;/em&gt; эстрадиол также нормализовал нейрогенез, синаптическую активность, клеточный цикл, метаболизм и эстрогенные пути. Хотя геномные механизмы могут частично стимулировать гены, сходные с мишенями при РАС, обогащения по генам-мишеням рецепторов эстрогена (ER) не наблюдалось, что указывает на весомую роль негеномных механизмов. Наиболее выраженный терапевтический эффект отмечен для &lt;em&gt;ASH1L&lt;/em&gt; и &lt;em&gt;SCN2A&lt;/em&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эстрадиол корректирует транскрипционные нарушения и снижает сетевую гипеВозбудимость для пяти генов (&lt;em&gt;ASH1L&lt;/em&gt;, &lt;em&gt;SCN2A&lt;/em&gt;, &lt;em&gt;ANK2&lt;/em&gt;, &lt;em&gt;CACNA1G&lt;/em&gt;, &lt;em&gt;SHANK3&lt;/em&gt;), связанных с эпилепсией.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Негеномные механизмы — это быстрые клеточные ответы без прямого взаимодействия гормона с ДНК, часто через мембранные рецепторы и ионные каналы за считанные секунды или минуты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ на уровне нейронных сетей и поведения выявил специфичные для генотипа обратные эффекты, развивающиеся в быстрые сроки, что также указывает на негеномную сигнализацию. Эстрадиол избирательно подавлял сетевую гипеВозбудимость в глутаматергических нейронах (iGLUTs) для пяти генов: &lt;em&gt;ASH1L&lt;/em&gt;, &lt;em&gt;SCN2A&lt;/em&gt;, &lt;em&gt;ANK2&lt;/em&gt;, &lt;em&gt;CACNA1G&lt;/em&gt; и &lt;em&gt;SHANK3&lt;/em&gt; (Рис. 3). Все они ранее ассоциировались с судорожными расстройствами у людей, а мутации в трех из них приводили к гипеВозбудимости (&lt;em&gt;ASH1L&lt;/em&gt;, &lt;em&gt;SCN2A&lt;/em&gt;, &lt;em&gt;ANK2&lt;/em&gt;). Быстрота ответа подтверждает участие кальциевых и MAPK-сигнальных путей. Исследования на данио-рерио поддержали стратификацию генов: эстрадиол подавлял нарушения цикла сон-бодрствование у мутантов &lt;em&gt;ash1l&lt;/em&gt; и &lt;em&gt;scn1lab&lt;/em&gt; (Рис. 4), а также нормализовал базовую активность нейронов в преоптической области у мутантов &lt;em&gt;scn1lab&lt;/em&gt; (Рис. 5). Кроме того, эстрадиол подавлял индуцированные судороги у тех же мутантов (Рис. 5), хотя в других условиях он может обладать просудорожным действием.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффекты эстрадиола зависят от контекста: хотя на определенных моделях он проявляет противосудорожные и защитные свойства, в иных условиях он может стимулировать судорожную активность.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ семи наиболее чувствительных к эстрадиолу генов не выявил связи с выраженным преобладанием мужчин (соотношение 4:1 при РАС), опровергая гипотезу о том, что половые гормоны определяют эту гендерную разницу. Концентрации эстрогенов в крови и мозге в целом схожи у мужчин и женщин, а клинические данные скорее связывают с аутизмом повышенную пренатальную стероидогенезу. Модель женского защитного эффекта предполагает, что для достижения порога РАС женщинам требуется большая генетическая нагрузка, однако по мере уточнения данных с учетом поздней диагностики у женщин половой дисбаланс сглаживается, а большинство генов риска создают равную уязвимость для обоих полов (для тяжелых расстройств соотношение снижается до 1.4:1). Учитывая локализацию эстрадиола в пресинаптических терминалях и его синтез в мозге, его локальные концентрации могут превышать уровень в крови, активируя метаботропные глутаматные рецепторы (mGluRs) независимо от выброса глутамата и запуская фосфорилирование ERK и CREB.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Усиленная коэкспрессия и сетевая связность генов, чувствительных к эстрадиолу, указывают на общие точки сходимости, которые могут стать мишенями для таргетной терапии.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Персонализированная психиатрия стремится адаптировать лечение под конкретного пациента с учетом генотипа и клеточного ответа. Настоящая работа служит моделью для понимания механизмов, с помощью которых эстрадиол компенсирует эффекты вариантов с большими эффектами LoF. Авторы проверили, является ли такое спасение специфичным или универсальным, и выяснили, что не каждый генетический фактор одинаково восприимчив к гормону: наблюдаются как конвергентное спасение, так и дивергентное усиление фенотипов. Примечательно, что способность к восстановлению не определялась функциональной классификацией (лидирующие &lt;em&gt;ASH1L&lt;/em&gt; (гистоновая метилтрансфераза) и &lt;em&gt;SCN2A&lt;/em&gt; (натриевый канал) выполняют разные роли), а была связана с коррекцией общих молекулярных и сетевых дефектов. Поскольку наиболее чувствительные к эстрадиолу геномные мишени обогащены в созревающих возбудимых нейронах верхних слоев кортекса, это открывает окно для терапевтических вмешательств.&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"modeli-stvolovyh-kletok-cheloveka-i-dizajn-biblioteki-crispr-nokautov\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#modeli-stvolovyh-kletok-cheloveka-i-dizajn-biblioteki-crispr-nokautov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модели стволовых клеток человека и дизайн библиотеки CRISPR-нокаутов&lt;/span&gt;&lt;/a&gt;Модели стволовых клеток человека и дизайн библиотеки CRISPR-нокаутов&lt;/h4&gt;\n&lt;p&gt;Для исследования были отобраны гены высокого риска развития расстройств нервно-психического развития (NDD), включая РАС, на основе баз данных SFARI Gene (синдромальные формы или гены с баллами 1–2) и Gene2Phenotype (G2P, категория «definitive»). При отборе приоритет отдавался локусам с повышенной экспрессией в раннем кортикальном развитии человека согласно данным single-nucleus RNA-seq и BrainSpan. Для матричного CRISPR-скрининга (кальциевая визуализация) отобрали 15 генов, связанных с ремоделированием хроматина, синаптической функцией, передачей сигналов и цитоскелетом. Для пулированного скрининга (обработка эстрадиолом и scRNA-seq) список расширили до 36 генов. Выбор генов не зависел от половой предрасположенности, хотя часть из них (например, MBD5, ASH1L, CUL3) демонстрирует мужской уклон экспрессии. Каждый ген таргетировали 3–4 gRNA. Для матричного скрининга клетки hESC-iCas9 трансдуцировали с MOI &amp;gt;1, для пулированного — с MOI &amp;lt;0,2 для обеспечения единичной интеграции. После селекции пуромицином (1 мкг/мл, 48 часов) клетки размножали и криоконсервировали.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR-скрининг — это метод «выключения» (нокаута) множества генов одновременно (пулированный) или по отдельности (матричный) для оценки их влияния на функции клеток.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kultivirovanie-nejralnyh-kletok-predshestvennikov-npc\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#kultivirovanie-nejralnyh-kletok-predshestvennikov-npc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Культивирование нейральных клеток-предшественников (NPC)&lt;/span&gt;&lt;/a&gt;Культивирование нейральных клеток-предшественников (NPC)&lt;/h4&gt;\n&lt;p&gt;Использовались валидированные линии hiPSC-NPC, полученные от пациентов с шизофренией (COS): NSB2607-2-1 (XY) и NSB3182-3-1 (XX). Клетки генерировали через двойное ингибирование SMAD (0,1 мкМ LDN193189 и 10 мкМ SB542431) с последующей селекцией нейральных розеток и очисткой методом MACS. Культивирование проводили в среде hNPC на подложке Matrigel. Для пулированных скринингов клетки трансдуцировали лентивирусами Cas9v2 и LV-gRNA, после чего проводили селекцию пуромицином (1 мг/мл) и гигромицином (1 мг/мл). За 72 часа до сбора урожая клетки трансдуцировали LV-gRNA, а за 24 часа — обрабатывали эстрадиолом.&lt;/p&gt;\n&lt;h4 id=\"indukciya-iglut-nejronov\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#indukciya-iglut-nejronov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Индукция iGLUT-нейронов&lt;/span&gt;&lt;/a&gt;Индукция iGLUT-нейронов&lt;/h4&gt;\n&lt;p&gt;Для генерации NGN2-индуцированных iGLUT-нейронов использовали линию H1 (XY) с индуцибельной Cas9 (iCas9). gRNA доставляли до начала дифференцировки, а активация Cas9 и нокаут происходили одновременно с NGN2-зависимой конверсией в нейроны при добавлении доксициклина. Клетки поддерживали в среде mTeSR Plus. При достижении 85–90% конфлюэнтности их пассировали с помощью Accutase или EDTA. Контроль на микоплазму проводился регулярно. Клетки трансдуцировали лентивирусом с доксициклин-индуцибельным NGN2 и селектировали бластицидином (10 мкг/мл). Индукцию NGN2 проводили 2 мкг/мл доксициклина в течение 72 часов. На 4-й день клетки пересаживали на планшеты с Geltrex в среде для созревания нейронов с добавлением ингибитора ROCK (10 мкМ Y-27632).&lt;/p&gt;\n&lt;h4 id=\"obrabotka-17b-estradiolom\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#obrabotka-17b-estradiolom\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обработка 17β-эстрадиолом&lt;/span&gt;&lt;/a&gt;Обработка 17β-эстрадиолом&lt;/h4&gt;\n&lt;p&gt;Принимая во внимание, что физиологические уровни эстрадиола в крови матери во время кортикогенеза плода варьируются от 1561 пг/мл (5,7 нМ) до более чем 30 000 пг/мл (110 нМ), из которых около трети является биодоступной формой, авторы выбрали концентрацию 100 нМ для экспериментов. Уровни эстрадиола в коре головного мозга часто превышают системные показатели, а исследования на нейронах различных видов показывают, что диапазон 100 пМ – 100 нМ эффективно модулирует синаптическую пластичность, плотность шипиков и динамику актина. Нейральные стволовые клетки (NPC) и индуцированные глутаматергические нейроны (iGLUT) обрабатывали 17β-эстрадиолом (E2) в концентрации 100 нМ или контрольным раствором (0,01% ДМСО) либо остро (для кальциевого имиджинга), либо в течение 24 часов перед секвенированием.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;17β-эстрадиол — это основной женский половой гормон, который, помимо репродуктивной функции, активно влияет на развитие и пластичность нейронов через геномные и быстрые негеномные механизмы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для классификации эффектов терапии (спасение, частичное спасение, отсутствие изменений, обострение или гиперкоррекция) применялся алгоритм сравнения p-значений и масштабированных бета-коэффициентов между группами «нокаут + ДМСО» (KO-WT) и «нокаут + E2» (KO-E2). Если p-значение для KO-E2 превышало 0,05, эффект считался «спасением». В противном случае анализировалась направленность и величина бета-коэффициентов: при противоположных знаках фиксировалась «гиперкоррекция», при совпадении знаков — оценивалась степень изменения относительно исходного дефекта (обострение или частичное спасение). Логика классификации представлена на Рис. SN 16.&lt;/p&gt;\n&lt;h4 id=\"podgotovka-bibliotek-dlya-sekvenirovaniya-rnk-edinichnyh-kletok\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#podgotovka-bibliotek-dlya-sekvenirovaniya-rnk-edinichnyh-kletok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подготовка библиотек для секвенирования РНК единичных клеток&lt;/span&gt;&lt;/a&gt;Подготовка библиотек для секвенирования РНК единичных клеток&lt;/h4&gt;\n&lt;p&gt;После 24-часовой инкубации культуры NPC или iGLUT (на 22-й день дифференцировки) промывали DMEM и диссоциировали с помощью Accumax при 37°C. Суспензию фильтровали через сита 37 мкм, центрифугировали при 500 × g в течение 5 минут и доводили концентрацию до 2,2 × 10⁶ клеток/мл (жизнеспособность &amp;gt;80% по трипановому синему). Целевой выход составлял ~52 000 клеток на дорожку при загрузке 83 000 клеток. Захват клеток и подготовка библиотек проводились по протоколу Chromium Single Cell 5' v3 с использованием технологии Feature Barcode для детекции CRISPR. КДНК амплифицировали в течение 10 циклов ПЦР, дополнительно проводилось обогащение библиотек гидовых РНК.&lt;/p&gt;\n&lt;h4 id=\"sekvenirovanie-i-obrabotka-dannyh\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#sekvenirovanie-i-obrabotka-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Секвенирование и обработка данных&lt;/span&gt;&lt;/
