х коррелятах пока носят предварительный характер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"dekodirovanie-dannyh-eeg\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#dekodirovanie-dannyh-eeg\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Декодирование данных ЭЭГ&lt;/span&gt;&lt;/a&gt;Декодирование данных ЭЭГ&lt;/h4&gt;\n&lt;p&gt;Среди всех оценок субъективное понимание обладало наиболее выраженным паттерном в ЭЭГ. Насколько нам известно, ни одна из предыдущих работ не исследовала субъективное понимание с помощью ЭЭГ, поэтому у нас не было заранее сформулированных гипотез на этот счет. Интересно, что наблюдалась начальная фаза повышенной декодируемости как в испытаниях до предъявления названия, так и после него (примерно в первые 2 секунды демонстрации изображения, становясь значимой только в условии до предъявления названия и, следовательно, по-видимому, не зависящей от предоставленной текстовой информации). Однако в испытаниях после предъявления названия скорость декодирования не падала после этой начальной фазы (как в испытаниях до названия), а продолжала нарастать и становилась значимой позже в ходе испытания — это согласуется с накоплением доказательств, ведущих к устойчивому сигналу понимания, который может быть зафиксирован в данных. Эта интерпретация дополнительно подкрепляется относительно похожей (хотя и не значимой) временной динамикой декодирования в траектории зрачка и поздним значимым пиком скорости декодирования в мгновенной частоте сердечных сердечных сокращений (см. рис. 4b).&lt;/p&gt;\n&lt;p&gt;Мы предполагали, что понимание стимула является желаемым результатом процесса смыслообразования и, пожалуй, наиболее практически значимым. Тот факт, что субъективное понимание показало самый сильный нейрофизиологический сигнал, можно рассматривать как подтверждение его первичности в эпистемической дуге и в нейронных (или, по крайней мере, корковых) процессах. Временная динамика декодирования эстетической симпатии продемонстрировала заметный пик в первую секунду после появления изображения в ЭЭГ временной области в испытаниях после предъявления названия. Это дает дополнительные нейрофизиологические доказательства наличия очень быстрого компонента эстетической реакции, что согласуется с предыдущими наблюдениями о том, что некоторые компоненты вызванных потенциалов могут быть связаны с эстетической обработкой (Oliver-Rodríguez et al., 1999; Marzi &amp;amp; Viggiano, 2010; Werheid et al., 2007; de Tommaso et al., 2008; Augustin et al., 2011; Wang et al., 2012; Jiang &amp;amp; Cai, 2013; Noguchi &amp;amp; Murota, 2013; Ma et al., 2015; Bölte et al., 2017; Righi et al., 2017; Carbon et al., 2018). Ранний пик в данных зрачка в испытаниях до предъявления названия, хотя и не являющийся значимым, может дополнительно подтверждать это утверждение.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Субъективное понимание продемонстрировало самый сильный нейрофизиологический сигнал в ЭЭГ, отражая устойчивое накопление доказательств в ходе испытания.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Важно отметить, что оценки симпатии удавалось декодировать по ЭЭГ только при втором предъявлении изображений, после названия, но не при первом предъявлении. По-видимому, ранний корковый ответ на изображение различался между первым и вторым предъявлениями (см. также общую среднюю реакцию на рис. A.4, A.8 и обсуждение ниже), и это различие имело решающее значение для декодирования эстетической симпатии. Это может свидетельствовать против доминирующей роли низкоуровневых характеристик изображения в итоговых оценках симпатии. Возможно, ответ ЭЭГ присутствует и в испытании до предъявления названия (см. реакцию зрачка), но он затмевается шумом и гораздо большим временным расстоянием до момента выставления оценки.&lt;/p&gt;\n&lt;p&gt;Однако также возможно, что реакция симпатии, собранная после второго просмотра, отклонялась от гипотетической оценки симпатии, которая была бы дана после первоначального просмотра. Учитывая наши поведенческие результаты, можно ожидать, что интервенция с названием и связанные с ней процессы смыслообразования вызывают такое расхождение или эволюцию симпатии, а другие факторы, такие как повторное или более длительное предъявление (ср. Zajonc, 1968; Burgess &amp;amp; Sales, 1971), неизвестные факторы или просто шум в оценках, также могут способствовать отсутствию декодирования при первом предъявлении. К сожалению, наши данные не позволяют более детально исследовать этот эффект, поскольку у нас отсутствует мера изменения симпатии от момента до просмотра названия к моменту после — хотя сбор такой меры методологически сложен, будущие исследования могли бы продолжить это направление.&lt;/p&gt;\n&lt;p&gt;Мы считаем примечательным, что мы не обнаружили значимого декодирования симпатии на более поздних этапах испытаний — предыдущие данные ЭЭГ (Strijbosch et al., 2021) и поведенческие результаты (Brielmann &amp;amp; Pelli, 2017), а также наши собственные поведенческие наблюдения в этом исследовании заставляли нас ожидать также более поздних, устойчивых вкладов в итоговую реакцию симпатии. Дальнейшие исследования должны подтвердить или опровергнуть эти нулевые результаты. Ранний пик для симпатии не сразу отражался в моменте инсайда («ага»-эффекта); хотя «ага» можно было достоверно декодировать из испытаний после названия (в сигнале зрачка), оно становилось значимым после пика симпатии.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Декодирование на основе ЭЭГ — это метод машинного обучения, позволяющий предсказывать мысли или поведение испытуемого по паттернам электрической активности мозга.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Возможно, этот результат обманчив: реакция зрачка является относительно медленным сигналом (и может быть ненадежной сразу после появления изображения; см. обсуждение ниже), поэтому кажется возможным, что реальный инсайд, вызвавший реакцию зрачка, происходил немного раньше, примерно в том же временном диапазоне, что и реакция симпатии. Тем не менее, эти результаты не дают четких доказательств в пользу гипотезы о том, что моменты инсайда причинно ведут к усилению симпатии. Любопытство оказалось очень интересным сигналом: хотя значимый кластер в позднем сигнале зрачка в условиях до предъявления названия (непосредственно перед оценкой) может быть неудивительным, надежная декодируемость по ЭЭГ во временной области в испытаниях после названия таковой безусловно является. Участники регистрировали свою оценку за несколько секунд до этого временного интервала, поэтому здесь не может идти речи об обратной атрибуции.&lt;/p&gt;\n&lt;p&gt;Кроме того, в промежутке им приходилось обрабатывать совершенно другой стимул (подсказки в виде названий). Если на самом деле существует отчетливое состояние корковой активности, которое точно отражают оценки любопытства, наши результаты показывают, что эта активность поддерживается в течение нескольких секунд: от первоначального предъявления изображения, через просмотр и обработку подсказки-названия и вплоть до испытания после названия. Это было бы важным открытием, поскольку такие измененные состояния могли бы затем также влиять на более медленную корковую обработку и контекстуализацию новой информации названия с повторяющимся визуальным стимулом. Пик декодирования в испытании после названия может, возможно, знаменовать момент «завершения» вложенной эпистемической дуги, которая началась с предъявления первого стимула и закончилась внутренним совмещением названия во время второго просмотра изображения.&lt;/p&gt;\n&lt;p&gt;Тот факт, что оценку любопытства можно достоверно декодировать только после пика оценок симпатии (также в ЭЭГ временной области), тоже имеет значение, так как делает менее вероятным то, что симпатия является прямым следствием любопытства, несмотря на их положительную линейную связь в пространстве оценок (см. обсуждение выше). В целом, оценки симпатии, любопытства и инсайда оказалось трудно извлечь из данных ЭЭГ. Для этого существует несколько потенциальных причин. Многие из ранее предложенных биомаркеров ЭЭГ для инсайда и/или эстетической оценки представляют собой паттерны в частотной области ЭЭГ. В этом свете кажется удивительным, что в наших данных мощность диапазонов ЭЭГ оказалась столь слабым признаком для прогнозирования оценок.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Относительно слабая декодируемость некоторых сложных оценок по ЭЭГ может быть связана с отсутствием жесткой временной синхронизации ответов между испытаниями, что требует новых методов анализа.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Однако это не обязательно означает, что такие корреляты отсутствуют. Плохое декодирование также может быть вызвано слабой временной синхронностью физиологических ответов между испытаниями: при текущем конвейере декодирования короткие всплески активности, предполагаемые для инсайда (особенно активность в гамма-диапазоне; Oh et al., 2020), обнаруживаются наиболее надежно только при временном выравнивании (то есть при жесткой привязке к стимулу), в противном случае они легко теряются в шуме.&lt;/p&gt;\n&lt;p&gt;Предыдущие исследования ЭЭГ, посвященные инсайду, обычно решали эту проблему с помощью анализов с обратной временной привязкой к нажатию кнопки участником, указывающему на моменты инсайда — мы решили отказаться от этой процедуры для нашего исследования, поскольку: 1) она могла нарушить плавность парадигмы, 2) нас интересовала шкальная оценка, и 3) мы явно хотели связать эту непрерывную оценку инсайда с другими оценками, такими как любопытство и симпатия. Хотя мы заранее знали, что для этих внутренне инициируемых процессов может не быть четкого выравнивания (инсайд или эстетическая симпатия могут развиваться в любой момент или не развиваться вовсе), мы тем не менее ожидали, что выравнивание будет достаточно хорошим для обнаружения более устойчивых или частично перекрывающихся коррелятов.&lt;/p&gt;\n&lt;p&gt;Другие подходы к анализу могут лучше подходить для поиска асинхронных паттернов и могут быть опробованы в будущем. Интересными кандидатами для конвейеров могут быть методы на основе обучения без учителя (например, Schneider et al., 2023), временной деконволюции (например, Ehinger &amp;amp; Dimigen, 2019) или просто декодирование с гибкими временными задержками. Другим подходом могло бы стать дальнейшее повышение соотношения сигнала и шума в записанных данных. Наиболее эффективным вариантом было бы использование интракраниальных записей, как это сделали Lopez-Persem et al. (2020); однако это также потребовало бы перехода к меньшей и совершенно другой выборке участников (то есть к пациентам).&lt;/p&gt;\n&lt;p&gt;С другой стороны, более фазические частотные ответы должны обнаруживаться в нашем дизайне, и это, судя по всему, имеет место в альфа-, бета- и даже гамма-диапазонах для некоторых категориальных целей декодирования (1-е против 2-го предъявления и картины против изображений Муни; см. прил. A.2.5). Категориальные экспериментальные факторы поддавались декодированию легче. В частности, тот факт, что эффект названия можно было декодировать из сигналов временной области в испытаниях после названия (см. рис. 4a), является больше, чем просто проверкой на адекватность (sanity check), и весьма обнадеживает.&lt;/p&gt;\n&lt;p&gt;Этот контраст, в котором единственным различием была текстовая информация, показанная до появления изображения, напоминает работы по контекстуальному праймингу (например, Wirth et al., 2008; Horner &amp;amp; Henson, 2012), хотя различия в стимульном материале и процедурах прайминга препятствуют прямому сравнению. Считается, что различные прайминг-стимулы умеренно влияют на легкость обработки, достигаемую при повторном предъявлении (либо дополнительно облегчая ее, либо создавая помехи), что создает дополнительное концептуальное пересечение с работами по подавлению повторения (repetition suppression). Наши подсказки-названия, безусловно, можно рассматривать как праймы, и считается, что как беглость обработки (Reber et al., 1998), так и повторное предъявление (хотя и неоднозначно; см., например, Zajonc, 1968; Burgess &amp;amp; Sales, 1971, а также Park et al., 2010) играют роль в эстетических суждениях.&lt;/p&gt;\n&lt;p&gt;Но облегчали ли названия или усложняли обработку повторяющегося стимула визуального искусства? Наши поведенческие результаты предполагают, что это, скорее всего, зависит от конкретной комбинации изображения-стимула и названия. Чтобы еще больше расширить картину, мы снова отмечаем, что корковая активность, связанная с любопытством, переносилась во второе предъявление изображения независимо от того, какой тип подсказки-названия был представлен, что говорит против монопольного влияния прайминг-подсказок в виде названий.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффекты названий и контекста успешно декодировались из ЭЭГ, демонстрируя перенос связанной с любопытством активности на второе предъявление независимо от типа подсказки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Взаимодействие между эффектами повторного предъявления, легкостью обработки и дополнительной информацией при восприятии визуального искусства (и смыслообразования в целом) действительно очень интересно: возможно, мы приоткрыли окно в эти сложные процессы и их взаимосвязи, но для прогресса в нашем понимании необходимы дальнейшие исследования.&lt;/p&gt;\n&lt;p&gt;Интересно, что предъявление до и после названия лучше декодировалось в испытаниях с произведениями искусства, чем с изображениями Муни (судя по длине значимых временных окон; см. рис. 3). Как обсуждалось выше, одним из объяснений может быть то, что эффекты повторения особенно сильны в искусстве. Альтернативно, изображения Муни могут демонстрировать особенно слабое подавление повторения — либо видные низкоуровневые визуальные характеристики изображений Муни могут доминировать в физиологических ответах, допуская относительно меньшие эффекты повторного предъявления, либо перцептивный сдвиг, который может происходить после понимания решения, фактически превращает второе предъявление изображения Муни в другой стимул, приводя к меньшому подавлению повторения.&lt;/p&gt;\n&lt;p&gt;Предыдущие работы фактически связывали силу подавления повторения с неожиданностью и ожиданиями (Summerfield et al., 2008, 2011). Тем не менее, качественно временная динамика декодирования не так уж сильно различается, и также возможно, что мы просто наблюдали ложноотрицательные результаты, поскольку в условии только с изображениями Муни было меньше испытаний, чем в условии с искусством, что привело к более низкой статистической мощности (16 изображений Муни и 48 произведений искусства на участника).&lt;/p&gt;\n&lt;h4 id=\"dekodirovanie-po-dannym-pupillometrii-i-chastoty-serdechnyh-sokrashenij\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#dekodirovanie-po-dannym-pupillometrii-i-chastoty-serdechnyh-sokrashenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Декодирование по данным пупиллометрии и частоты сердечных сокращений&lt;/span&gt;&lt;/a&gt;Декодирование по данным пупиллометрии и частоты сердечных сокращений&lt;/h4&gt;\n&lt;p&gt;Как и ожидалось, пупиллометрия оказалась весьма перспективной модальностью данных: ее можно было использовать для надежного декодирования категориальных факторов (1-я или 2-я презентация, изображения Муни или произведения искусства), она показала значимые временные окна для эффекта названия, оценок любопытства и озарения (aha), а также ненормативное, но превышающее случайный уровень декодирование с интересными временными профилями для оценок нравится и понимание (см. рис. 3 и 4).&lt;/p&gt;\n&lt;p&gt;Хотя результаты для эстетического предпочтения не показали значимых эффектов, мы наблюдали декодирование выше случайного уровня на протяжении большей части пробы и выраженный пик декодируемости в первую секунду проб до предъявления названия (отсутствующий в пробах после предъявления названия). Если это верно, то это служит дополнительным свидетельством в пользу первого и быстрого компонента в формировании предпочтений (ср. данные вызванных потенциалов после предъявления названия). Важно отметить, что размер зрачка также был единственной зарегистрированной модальностью данных, по которой мы могли достоверно предсказать оценки озарения (помимо короткого кластера в тета-диапазоне ЭЭГ для дифференциального сигнала; см. прил. A.2.4).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Пупиллометрия — это метод измерения диаметра зрачка, который реагирует не только на свет, но и на когнитивную нагрузку, эмоциональное возбуждение и моменты озарения.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Возможно, зрачок, как сравнительно медленный или инертный сигнал (хотя и не такой медленный, как частота сердечных сокращений), меньше подвержен влиянию отсутствия синхронизации между моментами инсанта. Это может согласуться с временным ходом декодирования в дифференциальном сигнале (см. прил. A.2.4 и прил. рис. A.8), который демонстрировал медленный монотонный рост на протяжении всей пробы. В пробах после предъявления названия наблюдалось значимое окно декодирования для озарения в начале проб, становящееся значимым примерно через полсекунды после появления изображения. Интересно сравнить это с декодированием оценок любопытства, которые показали выраженные значимые эффекты в конце проб до предъявления названия, на последней секунде перед исчезновением изображения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Пупиллометрия успешно декодирует категориальные факторы и оценки озарения, хотя ранние реакции зрачка сильно зависят от яркости стимулов и требуют осторожности при интерпретации.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В совокупности этот паттерн делает зрачок весьма перспективным кандидатом для будущих исследований взаимосвязи любопытства, инсанта и понимания в обработке информации (и, возможно, также для работы по формированию предпочтений). К сожалению, размер зрачка в начале пробы (примерно в первую секунду после появления изображения) может не быть надежным сигналом для высших когнитивных процессов. В наших данных мы видим, что ни одна оценка, ни условие названия не могли быть декодированы в ранней части проб. В это время зрачок непроизвольно подстраивается под изменения яркости на экране (см. усредненные кривые зрачка на прил. рис. A.4).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Ранние изменения зрачка в первые секунды пробы обусловлены в первую очередь физической яркостью экрана, а не сложными когнитивными процессами.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Заметим однако, что интересный незначимый паттерн в оценках предпочтения до предъявления названия попал точно в этот временной профиль, а значимая декодируемость озарения в пробах после предъявления названия начинается сразу после этого, что указывает на перенастройку зрачка на другой уровень дилатации в зависимости от озарения. Контраст между изображениями Муни и произведениями искусства, с другой стороны, очень хорошо декодировался в это временное окно; это неучитывая того факта, что изображения Муни представляют собой черно-белые изображения с высокой контрастностью и большой долей чисто белых пикселей, поэтому зрачок должен сильнее адаптироваться к таким изображениям по сравнению с произведениями искусства, которые в среднем менее светлые. В подтверждение этой интерпретации, 1-я против 2-й презентации среди изображений Муни не могла быть достоверно декодирована по ранним данным зрачка (только позже в пробе), в то время как для стимулов в виде произведений искусства и других модальностей данных, таких как ЭЭГ, это работало надежно (см. рис. 3 и прил. A.2.5). Эти паттерны согласуются с объяснением, что низкоуровневые признаки стимула управляли реакцией зрачка в этой части проб.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Частота сердечных сокращений регулируется вегетативной нервной системой и отражает как физиологические реакции на стресс или новизну, так и когнитивную деятельность.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Частота сердечных сокращений, сигнал, тесно связанный с вегетативной нервной системой через симпатические/парасимпатические пути, была еще одной кандидатной модальностью данных, на которую мог повлиять эстетический процесс. Как и в предыдущих работах, мы наблюдали выраженное замедление частоты сердечных сокращений после появления визуальных стимулов (Palomba et al., 1997; Welke &amp;amp; Vessel, 2022). Это замедление было сильнее для первой (до предъявления названия) презентации, чем для второй презентации, главным образом потому, что во второй презентации частота сердечных сокращений начиналась с уже более низкого уровня (см. прил. A.2.3). В пробах до предъявления названия мы не смогли декодировать ни категорию, ни оценку по частоте сердечных сокращений, но в пробах после предъявления названия это оказалось возможным. Из-за инертности сигнала вполне вероятно, что события во время предшествующей пробы до предъявления названия или раскрытия названия переносятся на записи во время проб после предъявления названия (важно отметить, что, в отличие от всех других модальностей данных, мы не проводили базовую коррекцию данных частоты сердечных сокращений). Это может объяснить, почему мы могли надежно декодировать такие события, как категория изображения или условие названия, уже в предстимульный период второй презентации изображения — вся необходимая информация уже была там.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Анализ сердечного ритма показал выраженное замедление после стимулов и позволил декодировать события в постстимульных пробах, во многом из-за инертности и отсутствия коррекции по базовой линии.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Декодируемость оценок поэтапного понимания в предстимульном периоде проб после предъявления названия является более интересным наблюдением. В данных вызванных потенциалов наблюдался значимый сигнал понимания в начале проб до предъявления названия, и кажется возможным, что чувство понимания может влиять на частоту сердечных сокращений; при такой интерпретации первый значимый пик декодируемости (около появления стимула) может отражать понимание, полученное только из изображения до предъявления названия (плюс большая временная задержка), в то время как второй пик может отражать дополнительное понимание, полученное из названий (опять же плюс временная задержка). Снижение декодируемости между пиками может отражать нарушения от появления нового стимула. Тем не менее, также кажется возможным, что это чрезмерная интерпретация результатов. Важно отметить, что мы не наблюдали декодируемости озарения, что могло бы казаться столь же или более правдоподобным драйвером изменений сердечного ритма, чем одно лишь понимание, несмотря на то, что медленный сигнал сердечного ритма должен быть более устойчивым к отсутствию синхронизации событий, чем наши другие меры (см. обсуждение выше).&lt;/p&gt;\n&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;p&gt;Взаимодействие с изобразительным искусством и дополнительной текстовой информацией, такой как названия или кураторские заметки, представляет собой парадигматический случай «удовольствия от понимания», при котором информационный пробел запускает любопытство, попытки осмысления и, потенциально, удовольствие, возникающее от постигшего озарения. Изучая феномены любопытства, озарения, ощущаемого понимания и эстетической привлекательности в рамках единой парадигмы, мы предлагаем новый взгляд на природу и подпроцессы, составляющие эту эпистемическую дугу.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Изучение взаимодействия с искусством и текстом через единую парадигму раскрывает нелинейные связи между любопытством, озарением и эстетическим удовольствием, зависящие от объема информации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В эксп. 1 мы создали парадигму для надежного вызова озарения с помощью визуального искусства и получили новое понимание сложного взаимодействия между чувствами любопытства, озарения, ощущаемого понимания и эстетической симпатии, выявив отчасти нелинейные отношения, формируемые типом и количеством информации, предоставляемой конкретным стимулом. В эксп. 2 наш анализ мультимодальных физиологических коррелятов, несмотря на то что он не подтвердил все наши априорные гипотезы, открыл новые ракурсы для дальнейшего исследования этой темы в будущем, что ведет к более механистическому пониманию смыслообразования и его роли в процессе эстетической оценки. Хотя многое еще предстоит изучить, наше исследование открывает новое окно в ключевые поведенческие и физиологические свойства мотивированного поиска информации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Парадигма — это стандартизированная схема проведения эксперимента, задающая условия для проверки конкретной научной гипотезы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;p&gt;В двух экспериментах мы демонстрировали участникам визуальные произведения искусства (картины), за которыми следовал либо их оригинальный заголовок (добавляющий семантическую информацию), либо фиктивный заголовок («без названия»; без новой информации), который может способствовать интерпретации изображений. Парадигма тесно следовала исследованию Van de Cruys et al. (2021) с изображениями Муни. Хотя примененная экспериментальная парадигма была в основном идентичной, два эксперимента различались в важных аспектах (Эксперимент 1: чисто поведенческие данные, онлайн-исследование, больший набор стимулов; Эксперимент 2: поведенческие и физиологические данные, лабораторное исследование, ограниченная подвыборка стимулов на основе оценок из Эксперимента 1). Экспериментальный план и наши гипотезы были пререгистированы (см. https://doi.org/10.17605/OSF.IO/PAGVH для Эксперимента 1 и https://doi.org/10.17605/OSF.IO/6KW9N для Эксперимента 2). Любые детали окончательных методов, отличавшиеся от пререгистированного плана, четко описаны и обсуждены как таковые. Подробности об участниках и записывающих устройствах сообщаются в соответствии со стандартами, предложенными для М/ЭЭГ исследований Организацией картирования человеческого мозга (COBIDAS Pernet et al., 2018, 2020).&lt;/p&gt;\n&lt;h4 id=\"ocenka-razmera-vyborki\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#ocenka-razmera-vyborki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оценка размера выборки&lt;/span&gt;&lt;/a&gt;Оценка размера выборки&lt;/h4&gt;\n&lt;p&gt;Целевой размер выборки был оценен посредством априорного анализа мощности с использованием программного обеспечения G*Power (Faul et al., 2007, версия 3.1). Поскольку анализ мощности для многоуровневых линейных моделей (см. Статистический анализ) не является простым, мы рассчитали мощность нашего исследования для аналогичного дисперсионного анализа с повторяющимися измерениями (repeated measures ANOVA) со следующими параметрами: «ANOVA: Repeated measures within factors», альфа = 0,05, мощность = 0,8, размер эффекта f = 0,1758631 (эквивалентно &lt;span class=\"yfm-latex\" data-content=\"%5Ceta%5E2_p%20%3D%200%2C03\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, размер малого эффекта), 1 группа, 26 измерений (дизайн 3x4x2 + 2, см. ниже) и консервативное ожидание нулевой корреляции между повторяющимися измерениями. Это привело к целевому размеру выборки в 30 человек. Поскольку исследование проводилось онлайн, и мы не могли контролировать условия сбора данных, мы нацелились на существенно большую выборку из N = 50 участников. Тем не менее, мы ожидали более высокое качество данных по сравнению с другими онлайн-исследованиями, поскольку пул участников состоял из мотивированных, часто постоянных участников исследований в нашем институте. Набор участников — Участники были отобраны методом случайной выборки (convenience sampling) из широкой общественности Рейнско-Майнского столичного региона в Германии посредством прямой рассылки участникам базы данных нашего института (&amp;gt; 2000 участников на момент набора, подписка открыта для всех). Слоты назначались в порядке живой очереди. Никаких специфических критериев включения в данное исследование не было.&lt;/p&gt;\n&lt;h4 id=\"itogovaya-vyborka\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#itogovaya-vyborka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Итоговая выборка&lt;/span&gt;&lt;/a&gt;Итоговая выборка&lt;/h4&gt;\n&lt;p&gt;N = 56 участников были зачислены в исследование, и N = 54 завершили сбор данных. Два неполных набора данных (13/56 испытаний и 53/56 испытаний) все равно были включены в анализ. Из этих 56 участников 2 сообщили о прошлых или текущих неврологических проблемах (инсульт, рассеянный склероз) при активном медицинском лечении. Еще 5 участников сообщили о текущих или прошлых эпизодах психических или психологических расстройств. Двое из этих 5 указали на текущее медицинское лечение. Возраст участников составлял от 20 до 82 лет (среднее = 40,0 лет, стандартное отклонение = 17,0 лет; 1 участник не указал свой возраст). 37 были женщинами, 19 — мужчинами, и 0 указали «другое». Трое были левшами, 49 — правьями и 3 — амбидекстрами (на основе самоотчета, с 1 пропущенным ответом). Участники получили от 7 до 26 лет образования (среднее = 17,4 года, стандартное отклонение = 3,9 года; 3 участника не предоставили эти данные). Выборка продемонстрировала сильное смещение в сторону лиц с высоким уровнем образования: из 56 человек немецкий аттестат зрелости (Abitur) или университетскую степень в качестве наивысшей квалификации имели все, кроме 1 участника, который не предоставил эти данные. Полную информацию о демографических характеристиках участников см. в Табл. С.А.1 и А.2. Участники потратили в среднем 50:12 минут на завершение онлайн-сбора данных (стандартное отклонение = 23:35, мин: 31:23, 25%: 36:56, 50%: 42:24, 75%: 50:27, макс: 2:22:35). Для 5 участников этот расчет оказался невозможным из-за отсутствия временных меток. Все участники получили денежную компенсацию в размере 10 евро за завершение эксперимента и дали информированное согласие до начала участия. Исследование соответствовало этическим стандартам Хельсинкской декларации и было одобрено местным комитетом по этике (Этический совет Общества Макса Планка) в рамках Заявки на исследование по стандартам лабораторных исследований. Данные собирались с декабря 2021 года по январь 2022 года.&lt;/p&gt;\n&lt;h4 id=\"stimuly\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#stimuly\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Стимулы&lt;/span&gt;&lt;/a&gt;Стимулы&lt;/h4&gt;\n&lt;p&gt;Каждый участник видел подмножество из 56 художественных стимулов и 8 изображений Муни из общего набора стимулов, состоящего из 120 художественных стимулов и 20 изображений Муни. Художественные стимулы — Все художественные стимулы были взяты из базы данных WikiArt.org, содержащей тысячи изображений, находящихся в общественном достоянии. Набор из 120 изображений, использованных в данном исследовании, был сформирован на основе метаданных WikiArt и набора данных WikiArt Emotions (Mohammad &amp;amp; Kiritchenko, 2018) с помощью следующей процедуры: 1) сначала мы выбрали все картины из 8 западных художественных стилей последних 2 веков (а именно: романтизм, реализм, импрессионизм, экспрессионизм, кубизм, сюрреализм, абстрактный экспрессионизм, лирическая абстракция — согласно метаданным WikiArt); 2) затем мы исключили все картины, содержащие лица (согласно оценкам WikiArt Emotions); 3) оставшиеся произведения искусства были классифицированы на «абстрактные», «полуабстрактные» или «фигуративные»; 4) по их названиям — на «чисто описательные» названия, «пояснительные» названия и «эвокативные» (вызывающие ассоциации) названия (оба типа определены экспериментатором); 5) наконец, мы выбрали 10 стимулов для каждой из 9 комбинаций факторов, стремясь а) включить стимулы из множества возможных художественных стилей и б) обеспечить высокую оценку «искусство:сюрприз» (art:surprise) из набора данных WikiArt emotions. В 3 подгруппах с «пояснительными названиями» мы извлекли 20 стимулов вместо 10 на бин, что технически привело к 3 дополнительным группам с пояснительными названиями (с немного более низкими предварительно оцененными значениями «art:surprise»). Эта процедура дала в общей сложности 120 художественных стимулов, каждый из которых сопровождался оригинальным названием (как оно хранится в базе данных WikiArt, переведенным на немецкий язык).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анализ мощности (power analysis) — это статистический метод для определения минимального размера выборки, необходимого для обнаружения реального эффекта с заданной вероятностью.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"izobrazheniya-muni\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#izobrazheniya-muni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Изображения Муни&lt;/span&gt;&lt;/a&gt;Изображения Муни&lt;/h4&gt;\n&lt;p&gt;Изображения Муни были взяты из работы Van de Cruys et al. 2021 и находились в свободном доступе в сети. Стимулы, использованные в нашем исследовании, отбирались по двум критериям: 1) отсутствие изображения людей и 2) средняя оценка «аха» в работе Van de Cruys et al. 2021. Мы выбрали 10 стимулов с самыми высокими оценками «аха» и 10 стимулов с самыми низкими оценками «аха» из этого исследования. Каждое изображение Муни сопровождалось парным черно-белым снимком, послужившим основой для его создания (представленным в качестве подсказки-«решения», аналогично реальным названиям художественных стимулов).&lt;/p&gt;\n&lt;h4 id=\"eksperimentalnyj-dizajn\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#eksperimentalnyj-dizajn\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Экспериментальный дизайн&lt;/span&gt;&lt;/a&gt;Экспериментальный дизайн&lt;/h4&gt;\n&lt;p&gt;Мы использовали внутрисубъектный факторный дизайн с повторяющимися измерениями и 5 различными группами участников (на основе подмножеств стимулов, см. ниже). Дизайн можно формализовать как 3 × 4 × 2 + 2: участники видели стимулы изобразительного искусства с тремя степенями абстракции (фигуративные, полуабстрактные, абстрактные) и 4 типами названий (описательное название, эвокативное название, пояснительное название группы 1, пояснительное название группы 2) в любом из 2 условий предъявления названия (реальное название или фиктивное название «без названия»). Эти факторы были полностью скрещены, при этом для каждой из 24 комбинаций факторов было проведено по 2 пробы (48 художественных стимулов). Дополнительно предъявлялись 2 группы проб с изображениями Муни (с высокими или низкими оценками «аха» по данным Van de Cruys et al., 2021), по 4 пробы на каждого участника (8 стимулов Муни). Это составило в общей сложности 56 проб на участника (подробнее о стимулах см. ниже).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Внутрисубъектный факторный дизайн означает, что каждый участник проходит через все возможные комбинации экспериментальных условий, что повышает статистическую мощность анализа.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"procedura-vypolneniya-zadaniya\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#procedura-vypolneniya-zadaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Процедура выполнения задания&lt;/span&gt;&lt;/a&gt;Процедура выполнения задания&lt;/h4&gt;\n&lt;p&gt;Участники заходили в онлайн-эксперимент, реализованный на платформе Labvanced (Scicovery GmbH, Германия), по персональной ссылке. После получения информированного согласия они заполняли набор вспомогательных опросников (см. ниже). Отображались инструкции к основному эксперименту, за которыми следовало 5 тренировочных проб (2 изображения Муни и 3 художественных стимула вместе с их реальными названиями; эти стимулы больше не предъявлялись в основном эксперименте). Затем начинался основной эксперимент, после которого следовал короткий итоговый опросник (дебрифинг). После завершения участников перенаправляли на отдельный сервер Limesurvey, соответствующий требованиям GDPR (LimeSurvey GmbH, Германия), для указания данных с целью получения денежной компенсации. Для основного эксперимента мы предъявляли участникам произведения визуального искусства (картины), за которыми следовали либо их оригинальные названия, либо фиктивные названия без дополнительной информации («без названия»). Для каждой пробы участники проходили следующую последовательность: 1) визуальный стимул в течение 5 с (произведение искусства или изображение Муни); 2) оценка уровня любопытства по поводу названия или решения изображения Муни (ответ в собственном темпе с использованием ползунка на непрерывной шкале); 3) дополнительная семантическая подсказка (время предъявления 3 с): в случае художественных стимулов это было либо оригинальное название, либо фиктивное «без названия» (условие выбиралось случайным образом, полностью сбалансировано между участниками), а в случае изображений Муни — черно-белая фотография, из которой было получено изображение; 4) повторное предъявление исходного изображения (время предъявления 5 с). Затем они оценивали 5) степень переживания инсайта («аха»); 6) эстетическую привлекательность изображения и 7) субъективное понимание изображения (все ответы в собственном темпе с использованием ползунка на непрерывной шкале). Эта последовательность визуализирована на рис. 1a. В данном эксперименте 1 последние два ползунка оценки (эстетические предпочтения и ощущаемое понимание) располагались друг над другом на одной странице. Рандомизация: назначение каждого художественного стимула в условие с названием или без названия было рандомизировано и полностью сбалансировано между участниками. Порядок стимулов для каждого участника рандомизировался с полностью перемешанными пробами (не более 1 стимула одной и той же комбинации факторов подряд). Участники случайным образом распределялись в одну из 5 групп: подмножества стимулов в этих 5 группах различались, но полностью перекрывали друг друга: каждый отдельный стимул предъявлялся в 2 из 5 групп.&lt;/p&gt;\n&lt;h4 id=\"povedencheskie-pokazateli-i-oprosniki\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#povedencheskie-pokazateli-i-oprosniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поведенческие показатели и опросники&lt;/span&gt;&lt;/a&gt;Поведенческие показатели и опросники&lt;/h4&gt;\n&lt;p&gt;Сначала участники заполнили набор опросников: опросник больших пяти личностных черт (BFI-2-XS: Rammstedt et al., 2020; Soto &amp;amp; John, 2017), шкалу склонности к короткой скуке (sBPS: Struk et al., 2017), краткую форму шкалы положительного и отрицательного аффекта (PANAS-SF: Thompson, 2007) и оценку эстетической восприимчивости (AReA: Schlotz et al., 2020) в их немецких версиях, а также фоновый опросник по базовой демографической информации (включая возраст, пол, образование и информацию о настроении или неврологических расстройствах).&lt;/p&gt;\n&lt;h4 id=\"analiz-dannyh\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#analiz-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ данных&lt;/span&gt;&lt;/a&gt;Анализ данных&lt;/h4&gt;\n&lt;p&gt;Статистический анализ и визуализация данных выполнялись на языках Python (версия 3.7.11) и R (версия 4.1.3) в виртуальных средах на ПК Macintosh (Apple Inc.). Блокноты Jupyter, воспроизводющие рисунки и результаты, находятся в открытом доступе в сети (см. раздел доступности данных).&lt;/p&gt;\n&lt;h4 id=\"linejnye-smeshannye-modeli\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#linejnye-smeshannye-modeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Линейные смешанные модели&lt;/span&gt;&lt;/a&gt;Линейные смешанные модели&lt;/h4&gt;\n&lt;p&gt;Основные гипотезы проверялись с использованием линейных смешанных регрессий с помощью функции lmer из пакета lme4 в R (версия 1.1-30). Значения значимости для коэффициентов отдельных эффектов оценивались с использованием метода степеней свободы Саттертуэйта, реализованного в пакете lmertest в R (версия 3.1-3). Полные таблицы LMM для Рис. A.2.2 были созданы с использованием функции tab_model из пакета sjPlot в R. Для оценки общей значимости описанных линейных моделей проводились тесты отношения правдоподобия: коэффициенты LMM сравнивались с усеченными моделями, содержащими только случайный интерсепт (без фиксированного эффекта, но со случайными эффектами участника и стимулов), с использованием функции anova в R. Для оценки влияния названия на различные оценки применялись следующие зарегистрированные заранее формулы LMM:&lt;/p&gt;\n&lt;p&gt;понимание ~ условие_заголовка + (условие_заголовка/участник) + (условие_заголовка/изображение) (1)&lt;/p&gt;\n&lt;p&gt;симпатия ~ условие_заголовка + (условие_заголовка/участник) + (условие_заголовка/изображение) (2)&lt;/p&gt;\n&lt;p&gt;инсайт ~ условие_заголовка + (условие_заголовка/участник) + (условие_заголовка/изображение) (3)&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Линейные смешанные модели (LMM) — это статистический метод для анализа данных сгруппированного типа, позволяющий учитывать индивидуальные особенности участников и конкретных изображений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Здесь использовались только данные испытаний с произведениями искусства (испытания с изображениями Муни были исключены). Мы применили фиктивное кодирование (dummy coding) для сравнения средних оценок в категории с названием («titled») с категорией без названия («untitled», исходный уровень). Эффект случайного наклона для участника и условия с названием (participant × titlecondition) был зарегистрирован заранее, так как мы ожидали различий в чувствительности участников к эффекту названия. Мы также заранее зарегистрировали эффект случайного наклона для изображения и условия с названием (image × titlecondition), поскольку предполагалось, что эффект названия будет различаться в зависимости от изображения. Однако тот факт, что каждый участник видел каждое изображение только один раз в одном условии с названием, мог ослабить это сравнение — поэтому в Рис. A.2.2 мы приводим альтернативные модели со случайными интерсептами для каждого изображения; это существенно не изменило результаты. Чтобы проверить нашу гипотезу о том, что произведения изобразительного искусства получают более высокие оценки нравится, чем изображения Муни, мы использовали следующую формулу:&lt;/p&gt;\n&lt;p&gt;симпатия ~ художественный_стиль + (1/участник) + (1/изображение) (4)&lt;/p&gt;\n&lt;p&gt;Здесь использовались все испытания. Мы применили фиктивное кодирование для сравнения средних оценок нравится во всех ячейках с изображениями Муни (исходный уровень). Чтобы сопоставить силу озарения («aha»), вызываемого произведениями искусства и их названиями, с чувством озарения, вызванным изображениями Муни, мы подогнали следующую формулу:&lt;/p&gt;\n&lt;p&gt;инсайт ~ художественный_стиль : стиль_заголовка + (1/участник) + (1/изображение) (5)&lt;/p&gt;\n&lt;p&gt;Здесь использовались только данные по изображениям Муни и произведениям искусства, показанным с их реальными названиями (испытания, помеченные как «untitled», были исключены). Мы применили фиктивное кодирование для сравнения средних оценок озарения во всех ячейках взаимодействия с изображениями Муни (исходный уровень). Для проверки линейной связи между любопытством и озарением в различных условиях наличия названия мы применили следующую формулу LMM:&lt;/p&gt;\n&lt;p&gt;инсайт ~ любопытство : условие_заголовка + (1/участник) + (1/изображение) (6)&lt;/p&gt;\n&lt;p&gt;Здесь использовались данные всех испытаний (условие с названием кодировалось как «untitled art», «titled art» или «mooney»). Тесты отношения правдоподобия для всех вышеуказанных моделей проводились в сравнении с соответствующими моделями, содержащими только интерсепт:&lt;/p&gt;\n&lt;p&gt;оценка_интереса ~ 1 + (1/участник) + (1/изображение) (7)&lt;/p&gt;\n&lt;h4 id=\"linejnye-smeshannye-modeli-s-kvadratichnymi-chlenami\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#linejnye-smeshannye-modeli-s-kvadratichnymi-chlenami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Линейные смешанные модели с квадратичными членами&lt;/span&gt;&lt;/a&gt;Линейные смешанные модели с квадратичными членами&lt;/h4&gt;\n&lt;p&gt;Визуализация данных с использованием локальной регрессии (см. ниже) побудила нас дополнительно смоделировать данные с использованием нелинейных квадратичных эффектов в качестве поискового последующего анализа. Тесты отношения правдоподобия для модели с квадратичными полиномиальными членами по сравнению с соответствующей моделью с линейными членами использовались для оценки того, значительно ли эта процедура улучшает качество подгонки модели. Мы проверяли, модулируется ли эффект любопытства на озарение квадратичным образом в зависимости от стиля названия (ур. 8, 9), модулируется ли эффект озарения на оценки нравится квадратичным образом в зависимости от стиля искусства (ур. 10, 11) и модулируется ли эффект озарения на понимание квадратичным образом в зависимости от стиля искусства (ур. 12, 13).&lt;/p&gt;\n&lt;p&gt;инсайт ~ любопытство : стиль_заголовка + (1/участник) + (1/изображение) (8)&lt;/p&gt;\n&lt;p&gt;инсайт ~ квадратичная(любопытство) : стиль_заголовка + (1/участник) + (1/изображение) (9)&lt;/p&gt;\n&lt;p&gt;симпатия ~ инсайт : художественный_стиль + (1/участник) + (1/изображение) (10)&lt;/p&gt;\n&lt;p&gt;симпатия ~ квадратичная(инсайт) : художественный_стиль + (1/участник) + (1/изображение) (11)&lt;/p&gt;\n&lt;p&gt;понимание ~ инсайт : художественный_стиль + (1/участник) + (1/изображение) (12)&lt;/p&gt;\n&lt;p&gt;понимание ~ квадратичная(инсайт) : художественный_стиль + (1/участник) + (1/изображение) (13)&lt;/p&gt;\n&lt;h4 id=\"lokalnaya-regressiya\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#lokalnaya-regressiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Локальная регрессия&lt;/span&gt;&lt;/a&gt;Локальная регрессия&lt;/h4&gt;\n&lt;p&gt;Графики локальной регрессии были построены с использованием локально взвешенного сглаживания диаграмм рассеяния (LOWESS), реализованного в модуле seaborn для Python (версия 0.11.2).&lt;/p&gt;\n&lt;h4 id=\"vizualizaciya-dannyh\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#vizualizaciya-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Визуализация данных&lt;/span&gt;&lt;/a&gt;Визуализация данных&lt;/h4&gt;\n&lt;p&gt;Визуализация данных была создана с помощью пользовательского кода с использованием модуля seaborn для Python (версия 0.11.2).&lt;/p&gt;\n&lt;h4 id=\"ocenka-razmera-vyborki1\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#ocenka-razmera-vyborki1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оценка размера выборки&lt;/span&gt;&lt;/a&gt;Оценка размера выборки&lt;/h4&gt;\n&lt;p&gt;Учитывая отсутствие предыдущих ЭЭГ-исследований эффекта названия или инсайта при восприятии искусства, мы решили рассчитать мощность исследования на основе поведенческого эффекта, который стремились обнаружить: основного эффекта категории стимула на оценки «ага». Мы оценили целевой размер выборки априори с помощью G*Power (Faul et al., 2007, версия 3.1). Мы снова рассчитывали мощность нашего эксперимента для дизайна ANOVA с повторяющимися измерениями, аналогичного линейным смешанным моделям (LMM), использованным в Эксперименте 1. Мы использовали параметры «ANOVA: Повторяющиеся измерения внутри факторов» (ANOVA: Repeated measures within factors) со значимостью α = 0,05, мощностью мощность = 0,8, размером эффекта f = 0,1758631 (что эквивалентно &lt;span class=\"yfm-latex\" data-content=\"%5Ceta%5E2_p%20%3D%200%7B%2C%7D03\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, малому размеру эффекта), 1 группой, 7 измерениями (дизайн 3 × 2 + 1, см. ниже) и корреляцией между повторяющимися измерениями r = 0,42. Корреляция между повторяющимися измерениями оценивалась на основе данных онлайн-исследования как средний коэффициент корреляции средних по участникам оценок инсайта по 7 комбинациям факторов стимулов, использованных в текущем исследовании. Этот анализ мощности привел к целевому размеру выборки N = 38. Чтобы учесть отсев участников, мы решили собрать данные как минимум от N = 45 участников.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;G*Power и расчет мощности (power analysis) — это математические методы для определения минимального числа участников, при котором эксперимент гарантированно сможет обнаружить реальный научный эффект, если он существует.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Рекрутинг — Участники были набраны методом удобной выборки из широких слоев населения Рейнско-Майнского столичного региона в Германии. Процедура рекрутинга была такой же, как и для Эксперимента 1. Критериями включения при отборе были: возраст от 18 до 55 лет, хорошее владение немецким языком, хорошее зрение и отсутствие необходимости носить очки во время исследования (поскольку это снижает качество трекинга глаз), отсутствие известных неврологических расстройств и неучастие в предыдущем онлайн-исследовании.&lt;/p&gt;\n&lt;p&gt;Итоговая выборка — 50 участников записались и завершили сбор данных. 1 участник с продолжающимися неврологическими проблемами (эссенциальный тремор) записался вопреки критериям включения и поэтому был исключен из анализа постфактум, в результате чего для анализа осталось 49 наборов данных. У некоторых участников были периоды пропущенных данных (ЭЭГ, ЭКГ, трекинг глаз и/или оценки) из-за незначительных сбоев или записей плохого качества, но они не были исключены из анализа. Возраст участников составлял от 18 до 52 лет (среднее = 28,0 года, стандартное отклонение = 7,2 года). 28 были женщинами, 19 мужчинами и указали «другое». 8 были левшами, 41 правшой и 0 амбидекстрами (опросник латеральности Флиндерса; Nicholls et al., 2013). У 17 участников доминировал левый глаз, у 28 — правый, а у 4 доминирование глаз отсутствовало (оценивалось экспериментатором; см. ниже). Участники указали от 8 до 27 лет получения образования (среднее = 17,3 года, стандартное отклонение = 3,9 года; при этом 1 участник не предоставил эти данные).&lt;/p&gt;\n&lt;p&gt;Выборка продемонстрировала крайний уклон в сторону лиц с высоким уровнем образования: все 49 участников указали немецкий аттестат зрелости (Abitur) или университетскую степень в качестве своей высшей квалификации. 11 из 49 участников сообщили о текущих или прошлых эпизодах психических или психологических расстройств, причем 7 из этих 11 указали на текущий прием медикаментов. Хотя это не было критерием исключения, мы также оценивали потребление кофеина участниками в день эксперимента: оно варьировало от 0 до 3,61 мг/кг массы тела (среднее = 1,06 мг/кг, стандартное отклонение = 0,923 мг/кг). 8 из участников указали нулевое потребление кофеина перед участием. Полную информацию о демографических характеристиках участников см. в Дополнительных табл. А.1 и А.2. Все участники получили денежную компенсацию в размере 7 евро за 30 минут и дали информированное письменное согласие до участия. Исследование соответствовало этическим стандартам Хельсинкской декларации и было одобрено местным комитетом по этике (Этический совет Общества Макса Планка) в рамках Заявления по исследовательской этике для стандартных лабораторных исследований. Данные собирались с марта 2022 года по июль 2022 года.&lt;/p&gt;\n&lt;h4 id=\"stimuly1\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#stimuly1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Стимулы&lt;/span&gt;&lt;/a&gt;Стимулы&lt;/h4&gt;\n&lt;p&gt;Каждый участник видел 48 художественных стимулов и 16 изображений Муни на откалиброванном ЖК-мониторе. Эти стимулы были предварительно отобранны из более крупного набора стимулов, состоящего из 120 художественных стимулов и 20 изображений Муни из Эксперимента 1, с использованием данных оценивания из Эксперимента 1.&lt;/p&gt;\n&lt;h4 id=\"vybor-izobrazhenij\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#vybor-izobrazhenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Выбор изображений&lt;/span&gt;&lt;/a&gt;Выбор изображений&lt;/h4&gt;\n&lt;p&gt;Из 140 стимулов, описанных выше для Эксперимента 1, мы выбрали 64 на основе линейной смешанной модели со следующей формулой:&lt;/p&gt;\n&lt;p&gt;&lt;span class=\"yfm-latex\" data-content=\"%5Ctext%7B%D0%B0%D0%B3%D0%B0%7D%20%5Csim%20%5Ctext%7B%D0%BF%D0%BE%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%BD%D0%BE%D0%B5%20%D0%BD%D0%B0%D0%B7%D0%B2%D0%B0%D0%BD%D0%B8%D0%B5%7D%20%2B%20(%5Ctext%7B%D0%BF%D0%BE%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%BD%D0%BE%D0%B5%20%D0%BD%D0%B0%D0%B7%D0%B2%D0%B0%D0%BD%D0%B8%D0%B5%7D%20%5Cmid%20%5Ctext%7B%D1%83%D1%87%D0%B0%D1%81%D1%82%D0%BD%D0%B8%D0%BA%7D)%20%2B%20(%5Ctext%7B%D0%BF%D0%BE%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%BD%D0%BE%D0%B5%20%D0%BD%D0%B0%D0%B7%D0%B2%D0%B0%D0%BD%D0%B8%D0%B5%7D%20%5Cmid%20%5Ctext%7B%D0%BA%D0%B0%D1%80%D1%82%D0%B8%D0%BD%D0%B0%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (14)&lt;/p&gt;\n&lt;p&gt;то есть модели, которая предсказывает оценку инсайта по условию названия (реальное название или отсутствие названия), со случайными наклонами и пересечениями для каждого участника и каждого стимула (что означает, что сила эффекта названия может варьировать для каждого участника и каждого стимула). Коэффициенты случайных наклонов для всех стимулов были ранжированы, и мы выбрали 16 стимулов с наибольшим наклоном в каждой категории картин (абстрактное искусство, полуабстрактное искусство, фигуративное искусство, изображения Муни) — это были изображения с наиболее сильным эффектом названия на оценки «ага» в Эксперименте 1. Третье полностью скрещенное условие из Эксперимента 1 (тип названия: описательное, пояснительное, эвокативное) было опущено здесь, так как это резко снизило бы свободу в процессе отбора. Ранжированные коэффициенты наклонов и отбор представлены на Рис. SN А.1. Все стимулы (изображения и названия) представлены в Дополнительном разделе А.1.4.&lt;/p&gt;\n&lt;h4 id=\"eksperimentalnyj-dizajn1\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#eksperimentalnyj-dizajn1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Экспериментальный дизайн&lt;/span&gt;&lt;/a&gt;Экспериментальный дизайн&lt;/h4&gt;\n&lt;p&gt;Мы использовали факторный дизайн с внутрисубъектными переменными и повторяющимися измерениями. Его можно формализовать как дизайн 3 × 2 + 1: участники видели стимулы изобразительного искусства в 3 степенях абстракции (фигуративное, полуабстрактное, абстрактное) в одном из 2 условий раскрытия названия (реальное название или фиктивное название «без названия»). Эти факторы были полностью скрещены, по 8 проб для каждой из 6 комбинаций факторов (48 художественных стимулов). Дополнительно для каждого участника было предъявлено 16 проб с изображениями Муни. Это привело к в общей сложности 64 пробам на участника. В отличие от Эксперимента 1, все участники видели одни и те же стимулы, хотя и со случайно назначенными названиями.&lt;/p&gt;\n&lt;h4 id=\"procedura-vypolneniya-zadachi\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#procedura-vypolneniya-zadachi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Процедура выполнения задачи&lt;/span&gt;&lt;/a&gt;Процедура выполнения задачи&lt;/h4&gt;\n&lt;p&gt;Сначала участник заполнял набор вспомогательных опросников (см. ниже), реализованных в программе Labvanced (Scicovery GmbH, Германия). Участник заходил в кабинку, после чего ему надевали электроэнцефалографическую шапочку и периферические электроды для записи электрокардиограммы (ЭКГ). Электроды ЭЭГ обрабатывали электролитным гелем до тех пор, пока импеданс не опускался ниже или не приближался к значению 10 кОм. После завершения подготовки участнику демонстрировали влияние жевания, моргания и напряжения мышц шеи на сигнал ЭЭГ, чтобы повысить его осведомленность об этих источниках артефактов, а также показывали индивидуальные альфа-колебания во время короткого периода с закрытыми глазами. На экранах выводились инструкции к основному эксперименту, за которыми следовало 3 тренировочные пробы (1 изображение Муни и 2 художественных стимула вместе с их настоящими названиями; эти стимулы больше не предъявлялись в основном эксперименте).&lt;/p&gt;\n&lt;p&gt;После тренировочного блока экспериментатор корректировал положение сидя, подголовник для участников и настраивал айтрекер. С этого момента участника просили сохранять положение в подголовнике и воздерживаться от жевания, глотания или движений головой во время периодов проб. Стимулы предъявлялись блоками по 10 стимулов, и после каждого блока участники могли сделать короткий перерыв в своем темпе для отдыха. Парадигма была в значительной степени идентична эксперименту 1 (см. также Рис. 1a). Однако в отличие от онлайн-исследования, перед всеми изображениями и названиями появлялся фиксирующий крест, предъявляемый в течение 2–2,5 с (с джиттером), межстимульный интервал составлял 1–1,5 с (с джиттером), а все шкалы оценки (включая эстетические предпочтения и ощущение понимания) выводились на отдельных страницах. Процедура была реализована с использованием пользовательского кода на PsychoPy (Peirce, 2007).&lt;/p&gt;\n&lt;p&gt;После завершения эксперимента участники заполняли короткий опросник после завершения эксперимента (реализованный в Labvanced, Scicovery GmbH, Германия).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Айтрекер — это устройство для точного отслеживания движения глаз и направления взгляда человека в реальном времени.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Рандомизация — назначение художественного стимула в условие с названием или без названия было полностью рандомизировано между участниками. Однако рандомизация контролировалась таким образом, чтобы в рамках каждого художественного стиля (абстрактный, полуабстрактный, фигуративный) итоговое количество проб с названием и без названия было сбалансировано. Чтобы поддерживать сбалансированность распределения назначений для всего набора данных, псевдослучайное назначение выполнялось только для каждого второго участника (1, 3, 5 и т. д.), в то время как последующие участники (2, 4, 6 и т. д.) получали инвертированные назначения предыдущего участника. Порядок стимулов для каждого участника рандомизировался с полностью перемешанными пробами (не более 2 стимулов одного типа подряд).&lt;/p&gt;\n&lt;h4 id=\"povedencheskie-pokazateli-i-oprosniki1\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#povedencheskie-pokazateli-i-oprosniki1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поведенческие показатели и опросники&lt;/span&gt;&lt;/a&gt;Поведенческие показатели и опросники&lt;/h4&gt;\n&lt;p&gt;В дополнение к инструментам скрининга, использованным в эксперименте 1, потребление кофеина перед визитом (Bühler et al., 2014) и мануальная асимметрия (преобладающая рука) (FLANDERS; Nicholls et al., 2013) оценивались с помощью систематических опросников. Окулярная доминантность определялась экспериментатором с использованием модификации теста Порты (как описано в Roth, 2002).&lt;/p&gt;\n&lt;p&gt;Все оценки для каждой пробы (любопытство, озарение, эстетическая привлекательность, понимание) собирались с использованием непрерывной шкалы с ползунком, управляемым движением мыши. Регистрировались как оценки, так и время реакции. Чтобы предотвратить ленивые ответы без участия, участники не могли зафиксировать ответ, предварительно не сдвинув мышь. Концы шкал были отмечены знаками «+» и «–», и каждая шкала сопровождалась соответствующими вопросами: «Wie neugierig sind Sie auf den Titel / die Auflösung?» («Насколько вы любопытны по поводу названия / решения?») для оценки любопытства, «Hatten Sie ein Aha! Erlebnis?» («Было ли у вас озарение/инсайт?») для оценки озарения, «Wie ästhetisch ansprechend fanden Sie das Bild?» («Насколько эстетически привлекательным вы сочли это изображение?») для оценки эстетики или «Denken Sie, dass Sie das Bild verstanden haben?» («Думаете ли вы, что поняли изображение?») для оценки понимания соответственно. Порядок этих оценок был фиксированным. В подробном описании задач перед исследованием все оценки были объяснены — с полными описаниями можно ознакомиться в Доп. A.1.2 (Supp.A.1.2).&lt;/p&gt;\n&lt;h4 id=\"sbor-dannyh-i-apparatura-usloviya-issledovaniya\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#sbor-dannyh-i-apparatura-usloviya-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сбор данных и аппаратура. Условия исследования&lt;/span&gt;&lt;/a&gt;Сбор данных и аппаратура. Условия исследования&lt;/h4&gt;\n&lt;p&gt;Запись ЭЭГ производилась в звукоизолированной камере (модель: IAC 120a, IAC GmbH, Германия; внутренние размеры: 2,74 × 2,54 × 2,3 м). Участники располагали подбородок на подставке для подбородка с упором для лба (SR Research Head Support, SR Research Ltd., Канада); расстояние между подставкой и экраном составляло 72 см. Высота стола регулировалась так, чтобы участники сидели в удобном вертикальном положении, которое они могли поддерживать в течение всего исследования. Все данные собирались одним и тем же экспериментатором при содействии во время подготовки геля для ЭЭГ. Участник мог связаться с экспериментатором в любое время через комнатный микрофон, установленный в камере.&lt;/p&gt;\n&lt;p&gt;Эксперимент запускался на ПК под управлением 64-битной операционной системы Microsoft Windows 7.1.7601 service pack 1 (Microsoft Corporation, США) с использованием автономного программного обеспечения PsychoPy3 (Peirce, 2007, версия 3.0.7). Визуальные стимулы предъявлялись на 24-дюймовом экране BenQ XL2420Z (BenQ Corporation, Тайвань) с номинальной частотой кадров 144 Гц и разрешением 1920 × 1080 пикселей (дублировался для экспериментатора). Калибровка яркости и цвета выполнялась с использованием настроек экрана и проверялась с помощью фотометра (Konica Minolta CS-150) с процедурой лесенки из мониторного центра PsychoPy; измеренная гамма-кривая доступна онлайн в репозитории OSF.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Калибровка монитора и использование специализированных программ вроде PsychoPy обеспечивают точное по времени и пространству предъявление визуальных стимулов без задержек, критически важное для когнитивных ЭЭГ-парадигм.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сбор данных ЭЭГ и периферической физиологии: биосигналы усиливались с помощью усилителя BrainVision actiCHamp с адаптерами BIP2Aux (Brain Products GmbH, Германия) с 24-битной оцифровкой и аналоговым полосовым фильтром от постоянного тока (DC) до 280 Гц. Усилитель питался от батарей постоянного тока через 2 блока ActiPower PowerPacks (Brain Products GmbH, Германия). Данные записывались с частотой дискретизации 1 кГц с использованием программы BrainVision Recorder (версия 1.21.0303; Brain Products GmbH, Германия) с независимого записывающего ПК под управлением Microsoft Windows 7. TTL-триггеры с ПК экспериментатора отправлялись на усилитель через параллельный порт.&lt;/p&gt;\n&lt;p&gt;Данные ЭЭГ собирались с использованием 64-канальной системы actiCAP с активными электродами Ag/AgCl без активного экранирования (Brain Products GmbH, Германия), расположенных в соответствии с расширенной международной системой локализации 10-20 (Commitee, 1958; Oostenveld &amp;amp; Praamstra, 2001) с референтной записью онлайн в точке FCz и заземлением в AFz. Лоб и кожу за ушами протирали спиртом для улучшения импеданса. Шапка позиционировалась путем центрирования электрода Cz на осях назион-инион и левое ухо-правое ухо. После окончания сбора данных положения электродов оцифровывались с помощью системы Polhemus FastTrak (Polhemus, США) и программного обеспечения Curry (версия 8; Compumedics Neuroscan).&lt;/p&gt;\n&lt;p&gt;Данные ЭКГ записывались усилителем ЭЭГ в качестве биполярного вспомогательного канала: электроды размещались на правой средней ключице и нижней левой части грудной клетки в соответствии со II отведением по Эйнтховену с использованием одноразовых электродов (Covidien, США). Для повышения качества данных ЭЭГ участников просили в письме-приглашении не использовать средства для укладки волос.&lt;/p&gt;\n&lt;h4 id=\"sbor-dannyh-trekinga-glaz\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#sbor-dannyh-trekinga-glaz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сбор данных трекинга глаз&lt;/span&gt;&lt;/a&gt;Сбор данных трекинга глаз&lt;/h4&gt;\n&lt;p&gt;Бинокулярное положение взгляда (координаты на экране) и размер зрачка регистрировались с помощью настольной системы трекинга глаз EyeLink 1000 Plus (SR Research Ltd.) и программного обеспечения EyeLink 1000 Plus Host, запущенного на независимом записывающем ПК. ПК экспериментатора и система регистрации EyeLink были связаны через Ethernet, а управление трекером осуществлялось с помощью модуля PyLink для Python (SR Research Ltd., версия 1.11.0.0). Данные записывались с частотой дискретизации 500 Гц с перерывами на запись между каждым блоком. Айтрекер (пере-)калибровался перед каждым блоком испытаний с использованием 13-точечной процедуры горизонтальной и вертикальной калибровки. Для повышения качества данных участников просили в письме-приглашении не наносить макияж, особенно подводку для глаз и тушь.&lt;/p&gt;\n&lt;h4 id=\"analiz-dannyh1\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#analiz-dannyh1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ данных&lt;/span&gt;&lt;/a&gt;Анализ данных&lt;/h4&gt;\n&lt;p&gt;Предобработка, обработка и статистический анализ данных выполнялись на высокопроизводительном вычислительном компьютере (HPC) института с использованием Python (версия 3.10.4), R (версия 3.6.1) в виртуальных средах conda и Matlab (The MathWorks Inc., версия R2019b). Блокноты Jupyter для воспроизведения рисунков и результатов находятся в свободном доступе в интернете на OSF.&lt;/p&gt;\n&lt;h4 id=\"rannyaya-predobrabotka-dannyh-eeg\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#rannyaya-predobrabotka-dannyh-eeg\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ранняя предобработка данных ЭЭГ&lt;/span&gt;&lt;/a&gt;Ранняя предобработка данных ЭЭГ&lt;/h4&gt;\n&lt;p&gt;Данные ЭЭГ были переведены в формат BIDS (Pernet et al., 2019, версия 1.6.0) с использованием модуля MNE-BIDS для Python (Appelhoff et al., 2019, версия 0.10). Отклоняясь от плана предварительно зарегистрированного анализа, мы не применяли конвейер предобработки и очистки, включающий ICA. Вместо этого мы использовали конвейер PREP (версия 0.56.0, плагин EEGLAB в MATLAB, с использованием набора параметров по умолчанию; Bigdely-Shamlo et al., 2015) — менее агрессивный полностью автоматический конвейер ранней предобработки, состоящий только из удаления сетевой наводки, пересчета в (надежный) средний референт, а также обнаружения и интерполяции зашумленных каналов. Это решение было основано на 1) недавних работах, предполагающих, что тяжелая предобработка и/или отбраковка данных иногда могут быть менее полезными, чем предполагалось (Delorme, 2023), поскольку любой выигрыш в отношении сигнал/шум должен перевешивать снижение статистической мощности из-за отбраковки данных, и 2) работах, показавших, что очистка данных на основе ICA может оставлять остаточные артефакты в данных (Dimigen, 2020; Robbins et al., 2020) и что эти остаточные артефакты могут оставаться проблематичными для чувствительных алгоритмов машинного обучения (Quax et al., 2019; Thielen et al., 2019), как планировалось в данном исследовании.&lt;/p&gt;\n&lt;h4 id=\"vremenno-razreshennoe-dekodirovanie-na-osnove-eeg,-razmera-zrachka-i-mgnovennoj-chastoty-serdechnyh-sokrashenij\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#vremenno-razreshennoe-dekodirovanie-na-osnove-eeg,-razmera-zrachka-i-mgnovennoj-chastoty-serdechnyh-sokrashenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Временно-разрешенное декодирование на основе ЭЭГ, размера зрачка и мгновенной частоты сердечных сокращений&lt;/span&gt;&lt;/a&gt;Временно-разрешенное декодирование на основе ЭЭГ, размера зрачка и мгновенной частоты сердечных сокращений&lt;/h4&gt;\n&lt;p&gt;Мы стремились декодировать различные целевые переменные (категории стимулов и оценки) из многомерных физиологических данных (ЭЭГ, размер зрачка, частота сердечных сокращений). Декодирование с разрешением во времени было реализовано с использованием подхода скользящего окна: независимые модели декодирования подгонялись для каждого временного отсчета по всем 64 датчикам ЭЭГ (или 2 трекам зрачка, или единому каналу частоты сердечных сокращений). Этот анализ давал временной ряд декодирования, показывающий, можно ли и когда именно линейно декодировать оценку или условие на основе физиологических сигналов. Временные ряды декодирования затем подвергались кластерной коррекции второго уровня между участниками (см. ниже). Конвейеры декодирования: мы построили 3 различных конвейера категориальной классификации для повторного предъявления (1-е / 2-е предъявление изображения), условия стимула (Муни/искусство) и условия названия (реальное или фиктивное название), а также 4 различных конвейера прогнозирования непрерывных значений (флоат) для различных оценок (любопытство, озарение, симпатия, понимание; все они были преобразованы в z-оценки для каждого участника). Дизайн декодера тесно следует работе Gwilliams and King (2020) и реализован в MNE Python: мы применяли логистическую регрессию для категориальной классификации (scikit-learn; Pedregosa et al., 2011, параметры по умолчанию: C = 1) и гребневую регрессию для непрерывного прогнозирования (параметры по умолчанию: alpha = 1). Производительность декодирования оценивалась с помощью стратифицированной 10-кратной перекрестной проверки.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стратифицированная 10-кратная перекрестная проверка — это метод оценки качества модели машинного обучения, при котором данные делятся на 10 частей так, чтобы пропорции классов сохранялись, модель обучается на 9 частях, а тестируется на оставшейся.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Точность декодирования оценивалась с использованием метрики AUC для логистической регрессии и коэффициента корреляции Спирмена R для гребневой регрессии. Во всех декодерах использовались данные, нормализованные по среднему значению и стандартному отклонению обучающего набора.&lt;/p&gt;\n&lt;h4 id=\"priznaki-dannyh\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#priznaki-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Признаки данных&lt;/span&gt;&lt;/a&gt;Признаки данных&lt;/h4&gt;\n&lt;p&gt;Эти конвейеры декодирования применялись к различным данным: во-первых, к ЭЭГ во временной области (вызванные потенциалы для отдельных испытаний, single-trial ERP) по всем шестидесяти четырем каналам: непрерывные предварительно обработанные с помощью PREP данные ЭЭГ подвергались полосовой фильтрации (0.1–40 Гц, FIR, параметры по умолчанию MNE) и нарезались на эпохи (от -0.5 до 5 с вокруг предъявления стимула); коррекция базовой линии выполнялась путем вычитания среднего значения периода базовой линии (от -0.5 до 0 с) из всей эпохи (для каждого испытания и канала индивидуально). Данные были пересчитаны относительно бесконечной референсной точки (REST; Yao, 2001, реализовано в MNE). Наконец, применялась полностью автоматическая процедура отбраковки испытаний (на основе минимально-максимальной амплитуды данных испытания для каждого участника): гамма-распределение подгонялось к эмпирическому распределению амплитуд мин-макс всех испытаний, используемых в соответствующем подмножестве для декодирования, и эпохи со значением за пределами 90-го процентиля подогнанного распределения отклонялись как выбросы. Хотя этот шаг сократил количество наших испытаний (числовые значения приведены ниже), мы сочли его необходимым, так как этап масштабирования делает конвейер декодирования уязвимым к выбросам. Вторым набором данных для декодирования являлась мощность в частотных диапазонах в канонических частотных диапазонах ЭЭГ по всем шестидесяти четырем каналам: предварительно обработанные в PREP непрерывные данные ЭЭГ подвергались полосовой фильтрации в соответствующем частотном диапазоне (дельта: 0.1–4 Гц; тета: 4–8 Гц; альфа: 8–23 Гц; бета: 13–30 Гц; гамма: 30–80 Гц — FIR, параметры по умолчанию MNE) и нарезались на эпохи, изначально более длинные, чем необходимо (от -2 до 6.5 с для дельта- и от -1 до 5.5 с для остальных диапазонов, чтобы избежать краевых артефактов в анализируемых данных); коррекция базовой линии на этом этапе не применялась. Данные были пересчитаны относительно бесконечной референсной точки. Для выявления колебательной активности вызванный ответ вычитался из каждого отдельного испытания, и огибающая преобразованного по Гильберту сигнала ЭЭГ рассчитывалась как время-частотный отклик (TFR).&lt;/p&gt;\n&lt;p&gt;Наконец, эпохи обрезались до временного окна, предназначенного для декодирования (от -0.5 до 5 с), и выполнялась коррекция базовой линии путем вычитания среднего значения периода базовой линии (от -0.5 до 0 с) из всей эпохи (для каждого испытания и канала индивидуально). Проводилась та же отбраковка испытаний, что и для данных ERP. Третьим набором данных был бинокулярный трек зрачка. Необработанные непрерывные данные подвергались фильтрации нижних частот (частота среза 10 Гц, FIR, параметры по умолчанию MNE). Пропущенные данные из-за моргания глаз интерполировались линейным методом (с использованием функции MNE interpolate_blinks), а испытания с минимально-максимальной амплитудой, превышающей среднее значение на два стандартных отклонения, отбраковывались как выбросы. Четвертым набором данных была мгновенная частота сердечных сокращений. Записи ЭКГ предварительно обрабатывались с использованием питоновского модуля neurokit2 (версия 0.2.7; Makowski et al., 2021): записи проверялись на наличие инвертированного сигнала с помощью функции neurokit2 ecg_invert и при необходимости инвертировались, нарезались на эпохи, изначально более длинные, чем необходимо (от -3.5 до 8 с; без коррекции базовой линии), после чего выполнялась очистка данных (функция neurokit ecg_clean), обнаружение R-пиков (функция neurokit ecg_peak) и преобразование в мгновенную частоту сердечных сокращений (функция neurokit ecg_rate, все с параметрами по умолчанию).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Частота дискретизации (down-sampling) — это уменьшение частоты выборки цифрового сигнала для снижения объема данных и ускорения вычислений без потери ключевых частотных характеристик. Референсный метод REST переносит виртуальный ноль на бесконечность, устраняя искажения локальной привязки электродов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Наконец, эпохи обрезались до временного окна, предназначенного для декодирования (от -0.5 до 5 с). Качество записи в каждо
