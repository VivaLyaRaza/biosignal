м испытании оценивалось с использованием функции neurokit ecg_quality (с применением метода оценки по Zhao &amp;amp; Zhang, 2018), и все испытания, не получившие оценку «отлично», исключались из анализа. Данные ERP, TFR, зрачка и частоты сердечных сокращений затем подвергались понижению частоты дискретизации до 50 Гц перед декодированием (с использованием функции MNE resample с параметрами по умолчанию).&lt;/p&gt;\n&lt;h4 id=\"otbrakovka-ispytanij\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#otbrakovka-ispytanij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Отбраковка испытаний&lt;/span&gt;&lt;/a&gt;Отбраковка испытаний&lt;/h4&gt;\n&lt;p&gt;Ниже мы сообщаем об отбраковке испытаний по всем различным конвейерам декодирования в рамках конкретной модальности данных. Для декодирования повторного предъявления (1-е или 2-е предъявление) и категории стимула (Муни или визуальное искусство) использовались все 64 испытания (изображения искусства и Муни), во всех остальных анализах использовались только испытания с произведениями искусства (48 испытаний на участника). Критерии отбраковки испытаний-выбросов описаны выше для каждой модальности данных.&lt;/p&gt;\n&lt;p&gt;Кроме того, в рамках определенного конвейера декодирования участник исключался полностью, если 1) оставалось меньше испытаний, чем требуется для перекрестной проверки, или 2) если дисперсия оценок участника была слишком мала для сходимости модели декодирования. Описанные выше процедуры очистки и отбраковки испытаний привели к умеренной отбраковке испытаний в диапазоне низких процентов. Обратите внимание, что максимальное количество испытаний различалось в зависимости от конвейера.&lt;/p&gt;\n&lt;p&gt;ЭРП — данные от 46–49 участников (в среднем = 48,2 из 49, или 98,45%), и среди них использовалось 91,3–95,6% (в среднем = 93,51%) от максимально возможных испытаний. Дельта-ЭЭГ — данные от 47–49 участников (в среднем = 48,3 из 49, или 98,64%), и среди них использовалось 91,0–95,3% (в среднем = 92,85%) от максимально возможных испытаний. Тетта-ЭЭГ — данные от 41–49 участников (в среднем = 47,9 из 49, или 97,71%), и среди них использовалось 87,8–93,3% (в среднем = 91,06%) от максимально возможных испытаний. Альфа-ЭЭГ — данные от 45–49 участников (в среднем = 48,3 из 49, или 98,64%), и среди них использовалось 88,7–94,5% (в среднем = 91,46%) от максимально возможных испытаний. Бета-ЭЭГ — данные от 47–49 участников (в среднем = 48,5 из 49, или 98,89%), и среди них использовалось 93,3–96,6% (в среднем = 95,01%) от максимально возможных испытаний. Гамма-ЭЭГ — данные от 47–49 участников (в среднем = 48,4 из 49, или 98,70%), и среди них использовалось 91,8–96,6% (в среднем = 94,29%) от максимально возможных испытаний. Расширение зрачков — данные от 47–49 участников (в среднем = 48,3 из 49, или 98,64%), и среди них использовалось 98,9–99,4% (в среднем = 99,07%) от максимально возможных испытаний. Частота сердечных сокращений — данные от 45–49 участников (в среднем = 47,0 из 49, или 95,98%), и среди них использовалось 95,8–98,3% (в среднем = 97,12%) от максимально возможных испытаний.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Перекрестная проверка (кросс-валидация) — это метод оценки того, насколько хорошо модель машинного обучения будет работать на новых данных, разделяя выборку на обучающую и тестовую части.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vtoroj-uroven-statisticheskogo-analiza-tochnosti-dekodirovaniya\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#vtoroj-uroven-statisticheskogo-analiza-tochnosti-dekodirovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Второй уровень статистического анализа точности декодирования&lt;/span&gt;&lt;/a&gt;Второй уровень статистического анализа точности декодирования&lt;/h4&gt;\n&lt;p&gt;Значимость результатов одномерного и многомерного декодирования проверялась с помощью одновыборочного перестановочного кластерного теста (Maris &amp;amp; Oostenveld, 2007), реализованного в функции permutation_cluster_1samp_test библиотеки MNE. Чтобы учесть шум в индивидуальных траекториях декодирования, временные ряды декодирования для каждого участника слегка сглаживались перед перестановочным тестом (с использованием функции gaussian_filter из scipy с параметром sigma=1,0).&lt;/p&gt;\n&lt;p&gt;Данные центрировались вокруг теоретического уровня случайных угадываний для соответствующей метрики (0,5 для AUC, 0 для коэффициента Спирмена R). Затем выполнялся перестановочный кластерный тест: во-первых, односторонние одновыборочные t-тесты проводились в каждой временной точке исходных данных. Пространственно-временные соседние точки данных объединялись в кластеры на основе порогового значения формирования кластера, эквивалентного p &amp;lt; 0,05, а тестовая статистика для каждого кластера определялась как сумма t-значений во времени.&lt;/p&gt;\n&lt;p&gt;Затем генерировалось перестановочное нулевое распределение (10000 шагов перестановок): из исходных данных создавались рандомизированные данные со случайной сменой знаков, после чего формировался новый набор кластеров и статистик теста. Исходные статистики теста затем сравнивались с перестановочным нулевым распределением для оценки статистической значимости.&lt;/p&gt;\n&lt;h4 id=\"vizualizaciya-dannyh1\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#vizualizaciya-dannyh1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Визуализация данных&lt;/span&gt;&lt;/a&gt;Визуализация данных&lt;/h4&gt;\n&lt;p&gt;Визуализация данных для анализа декодирования с разрешением во времени была создана с помощью пользовательского кода с использованием модуля Python matplotlib (Hunter, 2007, версия 3.8.0) и экспортирована в формате .svg.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1.jpg\" alt=\"Рисунок А.1: Суботбор стимулов для исследования ЭЭГ. Серые квадраты указывают выбранные стимулы (по 16 на категорию).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок А.1: Суботбор стимулов для исследования ЭЭГ. Серые квадраты указывают выбранные стимулы (по 16 на категорию).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1-2.jpg\" alt=\"Рис. S1 (продолжение 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1 (продолжение 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1-3.jpg\" alt=\"Рис. S1 (продолжение 3)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1 (продолжение 3)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1-4.jpg\" alt=\"Рис. S1 (продолжение 4)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1 (продолжение 4)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1-5.jpg\" alt=\"Рис. S1 (продолжение 5)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1 (продолжение 5)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1-6.jpg\" alt=\"Рис. S1 (продолжение 6)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1 (продолжение 6)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1-7.jpg\" alt=\"Рис. S1 (продолжение 7)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1 (продолжение 7)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1-8.jpg\" alt=\"Рис. S1 (продолжение 8)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1 (продолжение 8)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1-9.jpg\" alt=\"Рис. S1 (продолжение 9)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1 (продолжение 9)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS1-10.jpg\" alt=\"Рис. S1 (продолжение 10)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1 (продолжение 10)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS2.jpg\" alt=\"Рисунок A.2: Корреляция оценок. Корреляция с повторными измерениями; значения указывают R; все p &amp;lt; 0.05 (данные эксперим\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок A.2: Корреляция оценок. Корреляция с повторными измерениями; значения указывают R; все p &amp;lt; 0.05 (данные эксперимента 1).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS3.jpg\" alt=\"Рисунок A.3: (Не)линейная связь оценок. Диаграммы рассеяния с кривыми локальной регрессии (LOWESS), сгруппированные по к\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок A.3: (Не)линейная связь оценок. Диаграммы рассеяния с кривыми локальной регрессии (LOWESS), сгруппированные по категориям стимулов (данные эксперимента 1).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS4.jpg\" alt=\"Рисунок A.4: Общие средние физиологические реакции в сигналах временной области — 1-е и 2-е предъявление. Показаны общие\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок A.4: Общие средние физиологические реакции в сигналах временной области — 1-е и 2-е предъявление. Показаны общие средние реакции по всем испытаниям с произведениями искусства, разделенные по условиям испытаний (pretitle — 1-е предъявление до названия, posttitle — 2-е предъявление после названия, diff — след во время 2-го минус след во время 1-го предъявления). Цветные линии на ЭЭГ изображают отдельные каналы, черная линия — общее среднее, а внизу находится глобальная полевая мощность (GFP). Над временной разверткой расположены топографические графики в 6 репрезентативных временных точках (выборка не основана на данных). Размер зрачка и частота сердечных сокращений имеют только 2 и 1 канал данных соответственно, поэтому график более чистый.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS5.jpg\" alt=\"Рисунок A.5: Полные результаты декодирования для 1-го и 2-го предъявления изображений. Скорость декодирования во времени\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок A.5: Полные результаты декодирования для 1-го и 2-го предъявления изображений. Скорость декодирования во времени, значимые временные окна отмечены цветной подложкой (уровень значимости p &amp;lt; 0.05 на основе кластерного перестановочного t-теста второго уровня).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS6.jpg\" alt=\"Рисунок A.6: Полные результаты декодирования на основе сигнала перед названием (1-е предъявление изображений). Скорость \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок A.6: Полные результаты декодирования на основе сигнала перед названием (1-е предъявление изображений). Скорость декодирования во времени, значимые временные окна отмечены цветной подложкой (уровень значимости p &amp;lt; 0.05 на основе кластерного перестановочного t-теста второго уровня).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS7.jpg\" alt=\"Рисунок A.7: Полные результаты декодирования на основе сигнала после предъявления (2-е предъявление изображений): скорос\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок A.7: Полные результаты декодирования на основе сигнала после предъявления (2-е предъявление изображений): скорость декодирования во времени, значимые временные окна отмечены цветной подсветкой (уровень значимости p &amp;lt; 0.05 на основе кластерного перестановочного t-теста второго уровня).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-fS8.jpg\" alt=\"Рисунок A.8: Полные результаты декодирования на основе разностного сигнала (2-е предъявление – 1-е предъявление): скорос\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок A.8: Полные результаты декодирования на основе разностного сигнала (2-е предъявление – 1-е предъявление): скорость декодирования во времени, значимые временные окна отмечены цветной подсветкой (уровень значимости p &amp;lt; 0.05 на основе кластерного перестановочного t-теста второго уровня).&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;неизвестна&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;динамика&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;познания&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;искусства&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ээг, экг и&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;трекинг глаз с&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;титрами&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;найдены разные&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;маркеры для&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;стадий&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;раскрыта&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нейробиология&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;обучения&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не прошёл рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия препринта&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;neuroscience&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Welke, D.; Vessel, E. A.&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ссылка&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница препринта&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://www.biorxiv.org/content/10.1101/2025.05.15.654230v3\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;biorxiv.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Полный текст (PDF)&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://www.biorxiv.org/content/10.1101/2025.05.15.654230v3.full.pdf\" target=\"_blank\" rel=\"noreferrer noope
