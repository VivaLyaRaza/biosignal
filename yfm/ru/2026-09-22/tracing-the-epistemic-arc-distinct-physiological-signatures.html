            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"136\" cy=\"85\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"544\" cy=\"242\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как наш мозг превращает&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;непонятное искусство в&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;удовольствие&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-f1.jpg\" alt=\"Рисунок 1: Произведения искусства с их подлинными названиями вызывают более сильное чувство понимания, чем «безымянное» \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Произведения искусства с их подлинными названиями вызывают более сильное чувство понимания, чем «безымянное» искусство (воспроизведение предыдущих результатов). а) Экспериментальная последовательность: участники просматривали изображения визуального искусства и должны были оценить свое любопытство к его названию. Затем следовали название произведения искусства — либо оригинальное название, либо неинформативная заглушка («без названия»). После этого они снова видели оригинальное изображение и должны были оценить свое чувство инсайда (озарения), эстетическую привлекательность и то, чувствуют ли они, что поняли произведение. Помимо визуальных произведений искусства, (случайно перемешиваясь) предъявлялась серия изображений Муни (Mooney &amp;amp; Ferguson, 1951). Вместо реального или поддельного названия показывалась базовая фотография, использованная для создания изображения Муни. б) Воспроизведение эффекта названия на понимание, но не на эстетическую привлекательность: скрипичные диаграммы показывают распределение всех оценок (n=3090 среди 56 участников) отдельно для каждой категории стимулов (визуальное искусство в 3 уровнях фигуративности плюс изображения Муни), разделенных по условию названия (реальное или без названия; все изображения Муни сопровождались их реальной базовой фотографией, здесь классифицируемой как озаглавленная). Мы воспроизвели сильный эффект манипуляции с названиями на ощущаемое понимание, присутствующий во всех 3 категориях произведений искусства, но никаких существенных различий для эстетической привлекательности.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Когда мы смотрим на абстрактную картину и внезапно понимаем ее смысл, в мозгу запускается целая цепочка реакций. Исследователи решили проследить этот путь познания от первой искры любопытства до эстетического удовольствия. Оказалось, что каждый этап этого процесса оставляет свой уникальный физиологический след в организме.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Любопытство и озарение образуют единую цепочку познания&lt;/li&gt;\n&lt;li&gt;Размер зрачка выдает момент внезапного понимания картины&lt;/li&gt;\n&lt;li&gt;Эстетическое удовольствие связано с быстрой реакцией мозга&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Познавательный процесс человека часто строится на переходе от состояния неопределенности к внезапному пониманию, которое сопровождается чувством озарения или так называемым эффектом аха. Авторы работы объединили психологические опросы с одновременной регистрацией электроэнцефалограммы (ЭЭГ), электрокардиограммы (ЭКГ) и движения глаз, чтобы зафиксировать динамику этого процесса при восприятии живописи.&lt;/p&gt;\n&lt;p&gt;В эксперименте приняли участие две группы: 55 человек в поведенческой части и 49 человек в мультимодальном физиологическом исследовании. Участникам показывали полотна, предлагали оценить степень любопытства к названию работы, а затем демонстрировали оригинал или случайный заголовок, фиксируя последующую силу озарения, понимания и симпатии.&lt;/p&gt;\n&lt;p&gt;Анализ показал, что чувство озарения линейно связано с эстетическим удовольствием и нелинейно с пониманием. При этом физиологические маркеры позволили успешно декодировать разные фазы: понимание отражалось в длительных паттернах мозговой активности, озарение считывалось по размеру зрачка, а эстетическая симпатия находила отражение в быстрых первичных откликах ЭЭГ.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа опирается на субъективные оценки участников и специфический набор произведений искусства, а причинно-следственные связи в мультимодальных данных требуют дальнейшей проверки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Серия внутренних состояний, переходящих от любопытства (мотивационного состояния) к озарению (снижению неопределенности) и удовольствию (награде и подкреплению), может представлять собой фундаментальный путь для мотивированного обучения. В работе представлен подход, объединяющий измерение любопытства, озарения (эффекта «ага»), понимания и симпатии для обрисовки контуров этой эпистемической дуги и прослеживания ее нейронных коррелятов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование описывает эпистемическую дугу от любопытства до удовольствия и раскрывает ее поведенческие и нейрофизиологические корреляты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В двух пререгистрированных экспериментах мы использовали «эффект названия» — явление, при котором дополнительная семантическая информация может изменять восприятие и оценку произведений искусства. Участники рассматривали картины и оценивали свое любопытство перед просмотром названия. Затем им демонстрировали либо оригинальное название, либо фиктивное, не содержащее дополнительной информации, после чего следовал повторный показ изображения. На этом этапе участники оценивали силу озарения, эстетическую привлекательность и степень понимания произведения.&lt;/p&gt;\n&lt;p&gt;В поведенческом исследовании (n = 55 участников) мы эмпирически доказали, что визуальное искусство в сочетании с названиями способно вызывать сильное чувство озарения. Связь между оценками сложна и определяется типом и количеством информации в стимулах; например, озарение линейно связано с симпатией и нелинейно — с пониманием. В исследовании с применении ЭЭГ, ЭКГ и айтрекинга с участием той же парадигмы (n = 49 участников) мы использовали временнóе декодирование для отслеживания последовательности обработки информации. Понимание может быть декодировано по различным (нейро)физиологическим коррелятам на протяжении длительных временных интервалов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Айтрекинг — это метод регистрации движения глаз, позволяющий оценивать зрительное внимание и физиологические реакции, такие как изменение диаметра зрачка.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Надежное декодирование любопытства как до, так и после предъявления названий подтверждает его значимость в рамках эпистемической дуги. Озарение удавалось декодировать по размеру зрачка, но не по данным ЭЭГ. Наконец, быстрая первоначальная ЭЭГ-реакция оказалась связана с эстетической привлекательностью. Несмотря на необходимость дальнейших исследований, наша работа открывает новые возможности для изучения ключевых поведенческих и физиологических свойств мотивированного поиска информации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты получены на основе выборки из относительно небольшого числа участников (n = 55 и n = 49), что требует осторожности при обобщении выводов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ключевые слова: MVPA декодирование · познание · обработка информации · озарение · визуальная эстетика · ЭЭГ · мультимодальные данные&lt;/p&gt;\n&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Мы постоянно сталкиваемся с новыми, потенциально неоднозначными стимулами, и попытка осмыслить эту поступающую информацию (то есть формирование согласованных, осмысленных представлений) лежит в основе человеческого познания. Часто осмысление включает в себя инсайт — внезапный скачок в понимании, например, когда становится ясным решение ранее неразрешимой проблемы или когда новая порция информации позволяет лучше во всем разобраться (Sternberg &amp;amp; Davidson, 1995). Яркие примеры можно найти в визуальной сфере, где наше восприятие неоднозначного стимула может внезапно измениться и позволить увидеть структуру (как в случае с деградированными двухцветными «картинками Муни»; Mooney &amp;amp; Ferguson, 1951). Инсайт можно охарактеризовать как быстрое снижение неопределенности или прирост информации. Недавние работы связали инсайт с предшествующим состоянием любопытства (Van de Cruys et al., 2021): чем больше любопытство, тем сильнее эффект «ага» — мера феноменального чувства, сопровождающего инсайт. Это наблюдение позволяет поместить инсайт в мотивационные рамки: любопытство представляет собой состояние побуждения к снижению неопределенности, улучшение понимания выступает желаемым результатом, а инсайт (или «ага») знаменует собой моменты особо эффективного сокращения неопределенности. Основываясь на своих результатах, Van de Cruys et al. (2021) выдвигают гипотезу о том, что эффект «ага» может служить метакогнитивным сигналом обратной связи, который помогает нам оптимизировать эффективность обучения и распределять ограниченные когнитивные ресурсы на разрешимые задачи (см. также Laukkonen et al., 2023). Если инсайт запускает мотивационный каскад, он должен дополнительно задействовать процессы вознаграждения и ассоциироваться с удовольствием — «удовольствием от понимания» (Vessel, n.d.). Действительно, некоторые исследования предоставляют эмпирические доказательства того, что «ага» может ощущаться как приятное (Skaar &amp;amp; Reber, 2020; Shen et al., 2016) и связано с системой вознаграждения (Cristofori et al., 2018; Oh et al., 2020). Мы выдвигаем гипотезу, что эта череда процессов — от любопытства к инсайту, удовольствию и вознаграждению — может представлять собой фундаментальный путь для мотивированного обучения, называемый «эпистемической дугой» (Van de Cruys et al., 2024).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Инсайт действует как сигнал метакогнитивной обратной связи, превращая любопытство в удовольствие от понимания и формируя фундаментальную «эпистемическую дугу» мотивированного обучения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Здесь мы представляем парадигму для изучения смыслообразования на основе сложных натуралистических стимулов. Мы объединяем контролируемую подачу новой информации (с помощью наших стимулов) с измерениями любопытства, инсайта («ага»), понимания и симпатии, чтобы обрисовать контуры этой эпистемической дуги и исследовать их временную последовательность и нейронные механизмы. Van de Cruys et al. (2021) исследовали инсайт и обработку информации с использованием относительно простой задачи перцептивного понимания в визуальной сфере — а именно картинок Муни (Mooney &amp;amp; Ferguson, 1951), черно-белых двухцветных изображений, полученных из фотографий, которые поначалу сложно интерпретировать, но которые становятся легко понятными после просмотра оригинальной фотографии. Хотя этот метод очень эффективен, очевидно, что аналогичные механизмы могут действовать и на более высоких уровнях когнитивной иерархии. Например, инсайт может быть достигнут путем объединения информации из разных сенсорных модальностей (например, слияния визуального входа и языковых подсказок при просмотрите новостей) или путем контекстуализации новых стимулов с помощью предварительных знаний или личных воспоминаний. В этом исследовании мы используем визуальное искусство и применяем феномен, называемый «эффектом названия» — тот факт, что текстовая, семантическая информация, дополняющая произведение искусства (например, но не только названия), может влиять на то, как наблюдатель понимает, интерпретирует или оценивает произведение визуального искусства. Для картинок Муни было показано, что сила эффекта «ага» для конкретного изображения также предсказывает последующие оценки эстетического удовольствия (Muth &amp;amp; Carbon, 2013). Мы ожидаем, что этот эффект распространится и на визуальное искусство. Фактически, инсайт может даже быть ключевым фактором, обусловливающим чувства восторга или умиления, которые многие люди испытывают при наслаждении искусством.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эпистемическая дуга — это теоретическая концепция, описывающая путь человека от состояния любопытства и неопределенности через озарение к удовольствию от успешного познания.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"effekt-nazvaniya-sluchaj-esteticheskogo-ozareniya\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#effekt-nazvaniya-sluchaj-esteticheskogo-ozareniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;«Эффект названия» — случай эстетического озарения?&lt;/span&gt;&lt;/a&gt;«Эффект названия» — случай эстетического озарения?&lt;/h4&gt;\n&lt;p&gt;Несколько психологических исследований изучали влияние названий на различные оценки визуального искусства. Хотя все обнаруженные нами исследования сообщали о значимых эффектах примененного манипулирования названиями на одну или более зависимых переменных, результаты не вполне однозначны. Наиболее четкая картина складывается в отношении оценок ощущаемого понимания или осмысленности произведения искусства: в общей сложности 10 экспериментов в 6 исследованиях выявили значимый эффект манипулирования названиями, в то время как лишь в 2 экспериментах в 2 исследованиях такого эффекта не наблюдалось. Тем не менее, даже в исследованиях, сообщавших об общих незначимых результатах, различия между условиями с названием и без названия присутствовали (Russell, 2003, Exp. 1; Bubić et al., 2017). В совокупности эти исследования предоставляют убедительные доказательства того, что дополнительная семантическая информация, представленная в текстовой форме, изменяет субъективное понимание картин наблюдателем.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Десять экспериментов в шести исследованиях подтверждают, что названия меняют понимание картин, тогда как влияние на эстетические предпочтения зависит от типа названия и жанра искусства.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;При рассмотрении оценок эстетических предпочтений (например, симпатии, трогательности и т. д.) результаты менее однозначны: в нескольких исследованиях сообщалось о значительно более высоких оценках для произведений искусства, представленных с названием, по сравнению с вариантами без названия. Однако во многих случаях эти эффекты возникали только для определенных типов названий: для поясняющих названий, но не описательных или случайных; для семантически связанных, но не связанных между собой названий; или для вымышленных названий, подчеркивающих конкретную тему произведения, а не оригинальных названий или названий, принижающих эту концепцию. Более того, категория произведения искусства также может иметь значение: в одном исследовании явно наблюдалась разница между подходящими и неподходящими названиями только для абстрактного искусства, но не для полуабстрактного или фигуративного искусства, в то время как большинство других исследований ограничивались очень однородными наборами стимулов и поэтому не могли помочь прояснить данный вопрос.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эстетическое озарение (aesthetic aha) — это мгновенное чувство ясности и понимания смысла произведения искусства, похожее на научное озарение, которое повышает его эмоциональную оценку.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тем не менее, в ряде других исследований сообщалось об нулевых результатах при, казалось бы, очень схожих условиях: при сравнении наличия названия с его отсутствием, описательных названий с более подробными, подходящих названий с неподходящими или только названий с более длинными текстовыми описаниями. Хотя ни одно из этих исследований не собирало оценки озарения или инсайта — эффект, который предстоит установить в текущем исследовании, — предыдущие работы предполагали связь между инсайтом и эстетической симпатией для более простых перцептивных открытий: сила озарения при использовании изображений Муни положительно предсказывала оценки эстетических предпочтений, что Мут и Карбон (Muth and Carbon, 2013) назвали «эстетическим эффектом озарения».&lt;/p&gt;\n&lt;h4 id=\"svyaz-epistemicheskoj-dugi-s-fiziologicheskimi-korrelyatami-insajta-i-esteticheskih-predpochtenij\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#svyaz-epistemicheskoj-dugi-s-fiziologicheskimi-korrelyatami-insajta-i-esteticheskih-predpochtenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связь эпистемической дуги с физиологическими коррелятами инсайта и эстетических предпочтений&lt;/span&gt;&lt;/a&gt;Связь эпистемической дуги с физиологическими коррелятами инсайта и эстетических предпочтений&lt;/h4&gt;\n&lt;p&gt;Чтобы проследить последовательность предполагаемой эпистемической дуги, мы стремимся отследить ее компоненты и их временной профиль. Для этого мы записываем и анализируем мультимодальные (нейро)физиологические данные вместе с ответами участников. В нескольких исследованиях предпринимались попытки выявить нейрофизиологические корреляты инсайта или эстетических предпочтений соответственно. Предыдущие исследования в области нейробиологии инсайта часто были сосредоточены на полушарных различиях — гипотезе, совместимой с набором нейроанатомических и цитоархитектонических асимметрий в потенциально релевантных областях мозга (особенно в контексте обработки речи; обзор см. в Kounios &amp;amp; Beeman, 2014). Однако существует небольшая литература по ЭЭГ, посвященная инсайту и демонстрирующая относительно стабильные результаты, а именно всплески активности в гамма-диапазоне, предшествующие моментам инсайта, о которых сообщают сами испытуемые, в различных текстовых задачах, таких как задачи на удаленные ассоциации (Jung-Beeman et al., 2004; Sandkühler &amp;amp; Bhattacharya, 2008), вербальные головоломки (Sheth et al., 2009) или задачи на решение анаграмм (Oh et al., 2020).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ЭЭГ-исследования инсайта и эстетики устойчиво фиксируют изменения в гамма- и альфа-диапазонах перед моментом озарения или оценкой.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В дополнение к активности в гамма-диапазоне, в этих исследованиях менее стабильно сообщалось об увеличении мощности в альфа-диапазоне (Jung-Beeman et al., 2004; Sandkühler &amp;amp; Bhattacharya, 2008, в обоих случаях использовались задачи на удаленные ассоциации) и об увеличении (Oh et al., 2020) или уменьшении (Sheth et al., 2009) бета-активности перед нахождением решения. Эти паттерны активности в общих чертах напоминают те, о которых сообщается в небольшой частотной литературе по М/ЭЭГ, посвященной эстетическим предпочтениям. В исследованиях сообщалось о значимых эффектах почти во всех канонических частотных диапазонах, но наиболее стабильно — в гамма- (Lopez-Persem et al., 2020; Cela-Conde et al., 2004; Munar, Nadal, Rosselló, et al., 2012; Munar, Nadal, Castellanos, et al., 2012; Strijbosch et al., 2021) и альфа-диапазонах (Munar, Nadal, Castellanos, et al., 2012; Kang et al., 2015; Strijbosch et al., 2021).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Событие-связанные потенциалы (ЭСП / ERP) — это изменения электрической активности мозга, зафиксированные с помощью ЭЭГ в ответ на конкретный стимул, отражающие этапы обработки информации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кроме того, полушарные различия в мощности альфа-ритма (фронтальная альфа-асимметрия) были особым объектом нейроэстетических исследований (Babiloni et al., 2013; Moon et al., 2013; Cheung et al., 2019), а в некоторых исследованиях индекс асимметрии ЭЭГ даже использовался в качестве прокси-показателя эстетических предпочтений без дополнительной верификации посредством поведенческих оценок (Babiloni et al., 2015; Lee et al., 2017). Событие-связанные потенциалы (ЭСП) также исследовались в контексте эстетических предпочтений. Сообщалось об эффектах на различные хорошо изученные компоненты ЭСП, включая задний P2 (Righi et al., 2017; Noguchi &amp;amp; Murota, 2013), передний P2 (Righi et al., 2017; Ma et al., 2015; Jiang &amp;amp; Cai, 2013; Wang et al., 2012), N2 (Bölte et al., 2017; Righi et al., 2017; Ma et al., 2015; de Tommaso et al., 2008; Oliver-Rodríguez et al., 1999; Carbon et al., 2018; Augustin et al., 2011), P3 (Bölte et al., 2017; Righi et al., 2017; Ma et al., 2015; de Tommaso et al., 2008; Oliver-Rodríguez et al., 1999) и менее стабильно — на P1 (Righi et al., 2017; Bölte et al., 2017) и LPP (Marzi &amp;amp; Viggiano, 2010; Werheid et al., 2007; Schacht et al., 2008).&lt;/p&gt;\n&lt;p&gt;В предыдущем исследовании мы сообщили о различиях в очень позднелатентных потенциалах (через 3–5 с после предъявления стимула; Strijbosch et al., 2021), хотя нам не удалось воспроизвести ни один из ранее перечисленных результатов по ЭСП. Хотя представленные данные ЭЭГ не являются полностью исчерпывающими, они тем не менее предполагают, что информацию, связанную с предпочтениями, можно извлечь из неинвазивной ЭЭГ кожи головы. Другие модальности физиологических данных, такие как трекинг глаз и электрокардиография (ЭКГ), также представляют собой интересные кандидаты: частота сердечных сокращений была связана с эстетической оценкой (Tschacher et al., 2012), размер зрачка исследовался как потенциальный индикатор переживаний «ага!» (Salvi et al., 2020) и удивления при прослушивании музыки (Liao et al., 2018), а паттерны движения глаз изучались как предмет интереса в эмпирической эстетике (с потенциальным влиянием названий на паттерны взгляда/поисковое поведение; Bubić et al., 2017; Kapoula et al., 2009; Temme, 1992; Hristova et al., 2011). Все эти типы физиологических данных подходят для многомерного подхода декодирования, примененного в данном исследовании.&lt;/p&gt;\n&lt;h4 id=\"nastoyashee-issledovanie\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#nastoyashee-issledovanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Настоящее исследование&lt;/span&gt;&lt;/a&gt;Настоящее исследование&lt;/h4&gt;\n&lt;p&gt;Мы разработали расширенную версию парадигмы Ван де Крюйса и др. (Vande Cruys et al., 2021) и использовали её в двух пререгистированных экспериментах: в первой, чисто поведенческой задаче участникам демонстрировали произведение визуального искусства и просили оценить уровень любопытства в отношении его названия. Затем следовало либо оригинальное название работы, либо утверждение о том, что произведение «безымянно» (условия реального или вымышленного названия назначались случайным образом и были полностью сбалансированы между участниками). После этого участники снова видели произведение искусства и оценивали чувство «ага», эстетическое удовольствие, а также степень понимания работы. Это позволило нам проверить, воспроизводятся ли предыдущие результаты о чувстве «ага» и смыслообразовании на новой категории стимулов (искусство), а также функционально связать различные процессы оценки, которые обычно изучаются по отдельности.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Чувство «ага» (aha experience) — это внезапное осознание или инсайт, возникающие при разрешении неоднозначности или понимании скрытого смысла.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы собрали разнообразный набор стимулов в виде произведений искусства с соответствующими названиями: стимулы различались по степени визуальной абстракции (художественный стиль: фигуративный, полуабстрактный или абстрактный) и информационному содержанию названий (стиль названия: чисто описательные названия, не добавляющие новой информации; пояснительные названия, помогающие понять изображенное содержание; или эвокативные названия, создающие связь с новыми, отдаленными концептами). Это дало возможность более детально исследовать эффекты и взаимодействия данных факторов в процессах смыслообразования и формирования предпочтений. Мы также включили изображения Муни, чтобы сравнить силу чувства «ага», вызываемого визуальным искусством и его названиями, с чувством «ага», обусловленным перцептивными сдвигами.&lt;/p&gt;\n&lt;p&gt;В частности, мы предварительно зарегистрировали следующие гипотезы: возникновение более сильного переживания «ага» в условиях дополнительной информации (произведение с реальным названием или изображение Муни) по сравнению с условиями отсутствия дополнительной информации (произведение «без названия»); оценки любопытства будут предсказывать силу переживания «ага»; оценки «ага» будут предсказывать оценки эстетических предпочтений; произведения искусства с реальными названиями получат более высокие эстетические оценки, чем безымянные стимулы; произведения искусства с реальными названиями получат более высокие оценки понимания, чем безымянные стимулы; будет наблюдаться взаимодействие со степенью абстракции, по крайней мере для оценки понимания.&lt;/p&gt;\n&lt;p&gt;Во втором эксперименте мы стремились исследовать физиологические корреляты и временную последовательность обработки вознаграждения, поэтому в дополнение к поведенческим оценкам регистрировали ЭЭГ, пупиллометрию и ЭКГ участников. ЭЭГ (как во временной, так и в частотной областях), расширение зрачков и мгновенная частота сердечных сокращений анализировались с использованием подходов декодирования с временным разрешением, предназначенных для определения того, представлена ли и когда именно информация, связанная с оценками, в соответствующих записях (вслед за Гвиллиамс и Кинг (Gwilliams &amp;amp; King, 2020), см. методы).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;В двух предварительно зарегистрированных экспериментах с использованием поведенческих задач, ЭЭГ, пупиллометрии и ЭКГ авторы оценивают влияние названий и степени абстракции на инсайт, понимание и эстетические предпочтения.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эта часть эксперимента носила более исследовательский характер, и мы предварительно зарегистрировали лишь несколько общих гипотез, основанных на предыдущих работах: что мы обнаружим связанную с инсайтом активность в гамма-диапазоне; что будет существовать положительная линейная связь между эстетическими предпочтениями и мощностью в гамма-диапазоне; и что будет существовать нелинейная связь между мощностью в альфа-диапазоне и эстетическими предпочтениями.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"eksperiment-1-povedencheskie-ocenki-lyubopytstva,-insajta,-esteticheskih-predpochtenij-i-ponimaniya\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#eksperiment-1-povedencheskie-ocenki-lyubopytstva,-insajta,-esteticheskih-predpochtenij-i-ponimaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эксперимент 1 – Поведенческие оценки любопытства, инсайта, эстетических предпочтений и понимания&lt;/span&gt;&lt;/a&gt;Эксперимент 1 – Поведенческие оценки любопытства, инсайта, эстетических предпочтений и понимания&lt;/h4&gt;\n&lt;p&gt;Набор стимулов был разработан таким образом, чтобы содержать равное количество проб для различных стилей искусства (абстрактное, полуабстрактное или фигуративное) и типов названий (описательные, пояснительные, вызывающие ассоциации). Наряду с варьированием условий названия (реальное или неинформативное фиктивное название) и контрастной категорией изображений Муни, это позволяет проводить большое количество различных анализов, сравнивающих оценки при разном типе и объеме информации, предоставляемой участнику. Большинство гипотез, проверенных ниже, были пререгистрированы (https://doi.org/10.17605/OSF.IO/PAGVH), а дополнительные поисковые последующие анализы четко обозначены как таковые. Полная информация обо всех представленных линейных смешанных моделях (LMM) приведена в Рис. SN.&lt;/p&gt;\n&lt;h4 id=\"informativnye-nazvaniya-povyshayut-aga-effekt-i-subuektivnoe-ponimanie,-no-ne-esteticheskuyu-privlekatelnost\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#informativnye-nazvaniya-povyshayut-aga-effekt-i-subuektivnoe-ponimanie,-no-ne-esteticheskuyu-privlekatelnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Информативные названия повышают «ага-эффект» и субъективное понимание, но не эстетическую привлекательность&lt;/span&gt;&lt;/a&gt;Информативные названия повышают «ага-эффект» и субъективное понимание, но не эстетическую привлекательность&lt;/h4&gt;\n&lt;p&gt;Мы сначала проверили наличие «эффекта названия» на различные поведенческие оценки (т.е. различия в оценках между пробами с осмысленными названиями по сравнению с пробами «без названия»). Для этого мы применили три пререгистрированные LMM (уравнения 1–3). В этом анализе использовались только пробы со стимулами искусства, без учета изображений Муни. Однако для сравнения на рисунках представлены данные и по изображениям Муни. Нам удалось подтвердить нашу гипотезу и воспроизвести предыдущие результаты о положительном влиянии названия на воспринимаемое понимание, но не на эстетические оценки (Рис. 1b; разделение стимулов по стилю искусства, т.е. степени абстракции). Эффект названия на субъективное понимание был существенным (наклон = 11,06, ДИ = [8,11; 14,02], p &amp;lt; 0,001; этот наклон указывает на то, что средняя оценка понимания с названиями на 11,06 пункта выше, чем без названий, по используемой шкале 0–100 баллов). Тест отношения правдоподобия был значимым (χ2[5] = 173,88, p &amp;lt; 0,001). Эффект названия на эстетическую оценку, однако, был лишь пограничным (наклон = 1,69, ДИ = [−0,16; 3,53], p = 0,073), а тест отношения правдоподобия был незначимым (χ2[5] = 6,53, p = 0,258), что опровергает нашу пререгистрированную гипотезу. Мы не увидели признаков того, что это различие проявляется в каком-либо из стилей искусства или названий (см., например, Рис. 1b). Помимо пересмотра этих ранее исследованных эффектов названия, мы подтвердили нашу пререгистрированную новую гипотезу о том, что осмысленные названия также повышают оценки «ага-эффекта» (см. Рис. 2a). Эффект названий на «ага-эффект» был даже сильнее, чем на оценки понимания (наклон = 17,89, ДИ = [13,80; 21,97], p &amp;lt; 0,001), и тест отношения правдоподобия был значимым (χ2[5] = 564,95, p &amp;lt; 0,001). Важно отметить, что влияние манипуляции с названием на оценки «ага-эффекта» сильно варьировалось в зависимости от стимула: некоторые из них даже получили более низкие оценки «ага-эффекта» с реальным названием, чем с фиктивными (см. Рис. SN).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-f1.jpg\" alt=\"Рисунок 1: Произведения искусства с их подлинными названиями вызывают более сильное чувство понимания, чем «безымянное» \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Произведения искусства с их подлинными названиями вызывают более сильное чувство понимания, чем «безымянное» искусство (воспроизведение предыдущих результатов). а) Экспериментальная последовательность: участники просматривали изображения визуального искусства и должны были оценить свое любопытство к его названию. Затем следовали название произведения искусства — либо оригинальное название, либо неинформативная заглушка («без названия»). После этого они снова видели оригинальное изображение и должны были оценить свое чувство инсайда (озарения), эстетическую привлекательность и то, чувствуют ли они, что поняли произведение. Помимо визуальных произведений искусства, (случайно перемешиваясь) предъявлялась серия изображений Муни (Mooney &amp;amp; Ferguson, 1951). Вместо реального или поддельного названия показывалась базовая фотография, использованная для создания изображения Муни. б) Воспроизведение эффекта названия на понимание, но не на эстетическую привлекательность: скрипичные диаграммы показывают распределение всех оценок (n=3090 среди 56 участников) отдельно для каждой категории стимулов (визуальное искусство в 3 уровнях фигуративности плюс изображения Муни), разделенных по условию названия (реальное или без названия; все изображения Муни сопровождались их реальной базовой фотографией, здесь классифицируемой как озаглавленная). Мы воспроизвели сильный эффект манипуляции с названиями на ощущаемое понимание, присутствующий во всех 3 категориях произведений искусства, но никаких существенных различий для эстетической привлекательности.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-f2.jpg\" alt=\"Рисунок 2: Использование эффекта названия для вызова инсайда с помощью визуального искусства. а) Установление эффекта на\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: Использование эффекта названия для вызова инсайда с помощью визуального искусства. а) Установление эффекта названия на чувственное озарение: манипуляция с названиями сильно повлияла на чувство озарения у участников (присутствует во всех 3 категориях произведений искусства); этот эффект был даже больше, чем на чувственное понимание. б) Связь между любопытством и инсайдом взаимодействует с информационным содержанием подсказок решения: мы воспроизвели сильную линейную связь между любопытством и озарением для изображений Муни (оранжевая кривая LOWESS; ранее описанная Van de Cruys et al., 2021) и увидели аналогичную, немного более слабую связь для произведений искусства с пояснительными названиями (т.е. названиями, не оставляющими неопределенности относительно того, что изображено на произведении искусства; самая темная кривая LOWESS). Однако для названий, которые несут меньше или не несут четкой дополнительной информации, связь становилась слабее (например, описательные названия, которые исключительно описывают словами то, что изображено на картинке, и фиктивные названия «без названия», которые вообще не добавляют семантической информации; светло-серая кривая LOWESS). Эвокативные названия, которые ссылались на недавно введенный концепт, не сразу изображенный на визуальном изображении (темно-серая кривая LOWESS), демонстрировали более слабую линейную связь с более высокими оценками озарения в испытаниях с низким любопытством по сравнению с другими условиями названий. В то время как кривые LOWESS предполагают частично нелинейные взаимодействия с категорией стимулов, тест отношения правдоподобия LMM с линейными членами против LMM с добавленными квадратичными членами статистически не поддержал это наблюдение. в) Положительная связь между озарением и эстетической привлекательностью: положительная линейная связь присутствовала во всех категориях стимулов. Как сообщалось ранее, средняя эстетическая привлекательность была наивысшей для фигуративного искусства (синяя кривая LOWESS). Изображения Муни (оранжевая кривая LOWESS) имели самые низкие средние эстетические оценки. г) Связь между озарением и пониманием нелинейно взаимодействует с категорией стимулов: для абстрактного искусства (зеленая кривая LOWESS) существовала линейная связь между оценками озарения и понимания. Фигуративное искусство (оранжевая кривая LOWESS), с другой стороны, демонстрировало заметно нелинейную U-образную связь с высоким пониманием как для очень низких, так и для очень высоких испытаний озарения. Полуабстрактное искусство (желтая кривая LOWESS) демонстрировало промежуточный паттерн. Изображения Муни (оранжевая кривая LOWESS) также показали U-образную связь, но в среднем более низкие оценки понимания, чем фигуративное искусство. Тест отношения правдоподобия LMM с линейными членами против LMM с добавленными квадратичными членами подтверждает, что эффекты нелинейного взаимодействия, предполагаемые этими кривыми LOWESS, были значимыми для всех комбинаций художественного стиля и стиля названия.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Названия значительно повышают субъективное понимание (наклон 11,06) и «ага-эффект» (наклон 17,89), но не влияют на эстетическую оценку.&lt;br /&gt;\n[!tip] «Ага-эффект» (aha rating) — это субъективное чувство внезапного озарения или инсайта при разрешении когнитивной неопределенности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"bolee-vysokaya-simpatiya,-no-bolee-nizkij-aga-effekt-dlya-bolshinstva-proizvedenij-iskusstva-po-sravneniyu-s-izobrazheniyami-muni\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#bolee-vysokaya-simpatiya,-no-bolee-nizkij-aga-effekt-dlya-bolshinstva-proizvedenij-iskusstva-po-sravneniyu-s-izobrazheniyami-muni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Более высокая симпатия, но более низкий «ага-эффект» для большинства произведений искусства по сравнению с изображениями Муни&lt;/span&gt;&lt;/a&gt;Более высокая симпатия, но более низкий «ага-эффект» для большинства произведений искусства по сравнению с изображениями Муни&lt;/h4&gt;\n&lt;p&gt;Мы лишь частично подтвердили нашу пререгистрированную гипотезу о том, что визуальное искусство получит более высокие оценки симпатии, чем изображения Муни (см. также Рис. 1b). Наша LMM проверяла общий эффект категории изображения (абстрактное, полуабстрактное или фигуративное искусство, как с названиями, так и без, или изображения Муни; уравнение 4) с изображениями Муни в качестве базовой линии (интерсепт = 50,87, ДИ = [46,19; 55,56], p &amp;lt; 0,001). Фигуративное искусство (наклон = 10,62, ДИ = [5,65; 15,59], p &amp;lt; 0,001) и полуабстрактное искусство (наклон = 5,58, ДИ = [0,61; 10,55], p = 0,028) получили значительно более высокие оценки симпатии, чем изображения Муни, но абстрактное искусство — нет (наклон = 1,68, ДИ = [−3,29; 6,65], p = 0,507). Тест отношения правдоподобия для модели был значимым (χ2[3] = 24,26, p &amp;lt; 0,001).&lt;/p&gt;\n&lt;p&gt;Мы также пререгистрировали гипотезу о том, что изображения Муни будут в среднем вызывать более высокий «ага-эффект», чем визуальное искусство. Для этого критерия мы подобрали LMM (уравнение 5) для оценок «ага-эффекта» по пробам с изображениями Муни и всем пробам с искусством, имеющим названия (исключая пробы без названий). Изображения Муни снова были установлены в качестве базовой линии (интерсепт = 71,27, ДИ = [66,20; 76,33], p &amp;lt; 0,001). Как и ожидалось, мы наблюдали более низкие оценки «ага-эффекта» для всех остальных категорий, и разница была...&lt;/p&gt;\n&lt;h4 id=\"tip-nazvaniya-formiroval-ocenki-netrivialnym-obrazom\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#tip-nazvaniya-formiroval-ocenki-netrivialnym-obrazom\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тип названия формировал оценки нетривиальным образом&lt;/span&gt;&lt;/a&gt;Тип названия формировал оценки нетривиальным образом&lt;/h4&gt;\n&lt;p&gt;Мы далее исследовали взаимосвязь между любопытством и «ага-эффектом» с использованием локальной регрессии (LOWESS, см. Рис. 2b). Качественно это предполагает наличие нелинейного взаимодействия с типом подсказки в названии: в то время как изображения Муни и искусство с пояснительными названиями (т.е. названиями, оставляющими мало неопределенности относительно того, что изображено) демонстрировали относительно линейную связь между любопытством и «ага-эффектом», эта ассоциация была слабее и заметно нелинейной для названий, которые должны снижать неопределенность в меньшей степени или вовсе не снижать её (например, описательные названия, которые лишь описывали словами то, что изображено на картинке, и фиктивные названия «без названия», которые вообще не добавляли новой информации). Здесь для проб с низким и средним уровнем любопытства кривая LOWESS оценок «ага-эффекта» монотонно возрастала, но затем выравнивалась и даже падала для проб с высоким уровнем любопытства. Это согласуется с эффектом разочарования для проб с высоким любопытством, но отсутствием последующего облегчения или завершенности (т.е. без реального получения информации из названия). Вызывающие ассоциации названия, которые вводили и связывали с новой концепцией, не сразу очевидной на визуальном изображении, снова демонстрировали линейную связь с общим более низким наклоном, чем пояснительные названия или изображения Муни, но более высокими оценками «ага-эффекта» в пробах с низким любопытством, чем во всех других условиях названий. Хотя эти тенденции казались очень интригующими, тест отношения правдоподобия показал, что LMM с добавленными квадратичными членами (уравнение 9) не описывает данные значительно лучше, чем модель только с линейными членами (уравнение 8; χ2[6] = 0, p = 1), что предполагает, что наблюдаемый паттерн может быть ложным. Полную информацию о модели см. в Таблицах SN.&lt;/p&gt;\n&lt;h4 id=\"effekt-ozareniya-linejno-svyazan-s-simpatiej-i-nelinejno-s-ponimaniem\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#effekt-ozareniya-linejno-svyazan-s-simpatiej-i-nelinejno-s-ponimaniem\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эффект озарения линейно связан с симпатией и нелинейно — с пониманием&lt;/span&gt;&lt;/a&gt;Эффект озарения линейно связан с симпатией и нелинейно — с пониманием&lt;/h4&gt;\n&lt;p&gt;Мы обнаружили значимую линейную связь между оценками озарения и симпатии, что подтвердило еще одну предварительно зарегистрированную гипотезу. Модель (ур. 10) показывает, что этот эффект был значимым для всех категорий изображений (изображения Муни: наклон = 0.15, ДИ = [0.10; 0.20], p &amp;lt; 0.001; полуабстрактное искусство: наклон = 0.24, ДИ = [0.19; 0.29], p &amp;lt; 0.001; абстрактное искусство: наклон = 0.26, ДИ = [0.21; 0.31], p &amp;lt; 0.001; фигуративное искусство: наклон = 0.32, ДИ = [0.27; 0.37], p &amp;lt; 0.001 — при объединении изображений с названиями и без).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффект озарения демонстрирует универсальную линейную связь с симпатией во всех категориях визуальных стимулов (наклоны от 0.15 до 0.32, p &amp;lt; 0.001).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Категория полуабстрактного искусства с пояснительными названиями, по-видимому, обладает еще большим потенциалом: мы также подобрали модель, которая более точно соответствует дизайну исследования (т.е. учитывает избыточную выборку стимулов с пояснительными названиями, см. Методы, путем их разделения на две отдельные группы названий: «пояснительные (высокие)» и «пояснительные (низкие)», упорядоченные по оценке «удивления» в наборе данных Wikiarts Emotion). Здесь группа полуабстрактных изображений с пояснительными названиями (высокими) имела лишь немного более низкие оценки озарения, чем изображения Муни (наклон = −7.36, ДИ = [−15.11; −0.38], p = 0.062; см. Табл. A.11 в Дополнительных материалах для испытаний без названий).&lt;/p&gt;\n&lt;p&gt;Последующая локальная регрессия предположила, что эта связь действительно является линейной и не сильно зависит от типа изображения (см. кривую LOWESS на Рис. 2c). Тест отношения правдоподобия подтвердил, что модель с добавленными квадратичными членами (ур. 11) описывает данные не существенно лучше, чем модель с линейными членами (ур. 10; χ²[4] = 0, p = 1). Таким образом, наши данные показывают, что предыдущие наблюдения с изображениями Муни (Muth &amp;amp; Carbon, 2013) могут быть перенесены на другие домены стимулов, в данном случае — на визуальное искусство.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LOWESS (локально взвешенная регрессия) — метод сглаживания данных для поиска нелинейных трендов без жестких предварительных математических допущений о форме кривой.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Что касается связи между озарением и пониманием, локальная регрессия указала на нелинейное взаимодействие с категорией стимула. Действительно, мы предполагали обнаружить, что оценки понимания взаимодействуют с уровнем абстракции стимула (предварительно зарегистрировано, хотя точной гипотезы о характере взаимодействия не выдвигалось). В то время как для абстрактного искусства связь была линейной, для полуабстрактного и фигуративного искусства она выглядела более квадратичной (U-образной). Изображения Муни также демонстрировали U-образную связь (см. кривые LOWESS на Рис. 2d).&lt;/p&gt;\n&lt;p&gt;Здесь тест отношения правдоподобия подтвердил, что модель с квадратичными членами (ур. 13) действительно описывает данные значительно лучше, чем модель с линейными членами (ур. 12; χ²[4] = 115.03, p &amp;lt; 0.001). Квадратичные члены оказались значимыми для фигуративного искусства (оценка = 216.92, ДИ = [118.04; 315.44], p &amp;lt; 0.001), изображений Муни (оценка = 141.51, ДИ = [12.73; 270.30], p = 0.031) и полуабстрактного искусства (оценка = 96.42, ДИ = [3.87; 188.98], p = 0.041), но не для абстрактного искусства (оценка = −19.48, ДИ = [−116.45; 77.48], p = 0.694; подробные сведения о полной модели см. в Табл. A.17 и A.18 в Дополнительных материалах).&lt;/p&gt;\n&lt;p&gt;Наблюдаемый паттерн был бы правдоподобен, если бы случаи с низким озарением и высоким пониманием объяснялись высокой исходной степенью понимания изображений (даже без названий или разгадки Муни), что оставляло бы мало неопределенности, которую можно было бы уменьшить с помощью дополнительной информации (см. также Рис. A.3 в Дополнительных материалах).&lt;/p&gt;\n&lt;h4 id=\"eksperiment-2-nejronnye-korrelyaty-i-vremennaya-posledovatelnost-obrabotki-informacii\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#eksperiment-2-nejronnye-korrelyaty-i-vremennaya-posledovatelnost-obrabotki-informacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эксперимент 2 — Нейронные корреляты и временная последовательность обработки информации&lt;/span&gt;&lt;/a&gt;Эксперимент 2 — Нейронные корреляты и временная последовательность обработки информации&lt;/h4&gt;\n&lt;p&gt;Чтобы изучить временной профиль эпистемической дуги, мы повторили эксперимент, регистрируя ЭЭГ, частоту сердечных сокращений и размер зрачков испытуемых. Дизайн эксперимента был предварительно зарегистрирован (https://doi.org/10.17605/OSF.IO/6KW9N), но поскольку эта часть исследования носила в основном поисковый характер, мы не формулировали жестких ожиданий в отношении конкретного анализа.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эксперимент 2 носил преимущественно поисковый характер (exploratory), поэтому его результаты требуют независимого подтверждения в дальнейших исследованиях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Физиологические сигналы анализировались с использованием подхода временного декодирования, чтобы показать, представлены ли соответствующие информация в физиологических данных и когда именно. Мы стремились декодировать как экспериментальные условия, так и различные поведенческие оценки, собранные во время испытаний.&lt;/p&gt;\n&lt;p&gt;Важно отметить, что мы запускали эти конвейеры декодирования отдельно для данных из испытаний до появления названия и после появления названия, чтобы выявить потенциальные эффекты промежуточно представленного названия или разгадки Муни (за исключением одного конвейера, который специально декодировал принадлежность испытаний к условию до или после названия).&lt;/p&gt;\n&lt;p&gt;Мы также применили конвейеры к разностному сигналу (испытания после названия минус до названия); эти результаты представлены в Дополнительных материалах в разд. A.2.4. Полученные результаты описаны ниже, а значимые результаты декодирования приведены на Рис. 3 и 4. Графики декодирования для всех модальностей данных и всех условий собраны в Дополнительных материалах в разд. A.2.5.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-f3.jpg\" alt=\"Рисунок 3: Декодирование повторного предъявления и категории изображения (произведения искусства и пробы с изображениями\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3: Декодирование повторного предъявления и категории изображения (произведения искусства и пробы с изображениями Муни) – а) 1-е или 2-е предъявление изображения: декодирование было надежно возможно почти из всех модальностей данных, но лучше всего из ЭЭГ во временной области (значительно выше случайного уровня на протяжении всей пробы, с заметным пиком примерно через 0,5–1 с после появления изображения). В декодировании следов зрачка результаты были лучше с произведениями искусства, чем с изображениями Муни, где декодирование становилось значимым только в конце пробы. Это может быть частично связано с меньшим количеством проб в этой категории (48 проб с искусством и 16 с изображениями Муни на участника). Мгновенная частота сердечных сокращений, по-видимому, предсказывала категорию немного лучше в начале проб. В совокупности это убедительно свидетельствует о том, что стимулы обрабатывались не одинаково при повторном предъявлении. б) домен стимулов (изображение Муни или произведение искусства): категорию изображения можно было надежно декодировать с начала предъявления изображения для ЭЭГ, данных зрачка и частоты сердечных сокращений, и снова лучше всего из ЭЭГ во временной области. Примечательно, что классификация работала более надежно во время второго предъявления изображения, чем во время первоначального предъявления (за исключением данных зрачка, где было мало различий). Частотная область ЭЭГ (за исключением гамма-диапазона) также давала зашумленные, но значимые результаты декодирования для обеих категорий; см. Прил. А.2.5 для графиков всех проб и условий. Временные ряды декодирования вычислялись для каждого отдельного участника в стратифицированной 10-кратной перекрестной проверке; значимость определялась статистическим тестированием второго уровня (кластерный перестановочный t-тест, уровень значимости p &amp;lt; 0,05). Ось X отражает уровень случайности (0,5 для используемой метрики AUC).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-f4.jpg\" alt=\"Рисунок 4: Декодирование физиологических коррелятов смыслообразования (только пробы с произведениями искусства) – а) Дек\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4: Декодирование физиологических коррелятов смыслообразования (только пробы с произведениями искусства) – а) Декодирование «эффекта названия»: мы смогли достоверно декодировать, сопряжен ли стимул картины с ее реальным названием или с неинформативной меткой-заглушкой («без названия»). Это лучше всего получалось на основе ЭЭГ во временной области как во время второго просмотра (после названия), так и по размеру зрачка и частоте сердечных сокращений (частота сердечных сокращений во время 2-го предъявления, по-видимому, подвержена влиянию более ранней обработки, например, во время предъявления названия, и результаты декодирования лучше до и вскоре после появления изображения). Как и ожидалось, условие названия не могло быть декодировано с первого предъявления изображений (до того, как название было представлено). б) Декодирование поштучных оценок любопытства к названию, озарения, эстетической привлекательности и чувства понимания: мы могли декодировать каждый тип оценки из одного или нескольких зарегистрированных физиологических сигналов. Чувство понимания декодировалось лучше всего по ЭЭГ во временной области (как в пробах до, так и после названия), по мощности позднего дельта-диапазона (в пробах после названия) и по частоте сердечных сокращений (в пробах после названия, с временным ряды, аналогичным таковому для декодирования условия названия, хотя и немного раньше). Расширение зрачка также показало декодирование выше случайного уровня во время проб после названия (с временным ряды, похожим на вызванные потенциалы), но не достигло уровня значимости. Любопытство к названию можно было достоверно декодировать по позднему предваряющему сигналу зрачка и ранней ЭЭГ во временной области после названия. Оценки инсайда (озарения) можно было достоверно декодировать по размеру зрачка в начале проб после названия. Оценки эстетической привлекательности показали короткий пик значимого декодирования в ЭЭГ во временной области после названия. Несмотря на то, что сигнал размера зрачка не достиг значимости, он в целом обеспечивал декодирование выше случайного уровня с заметным пиком в ранних пробах до названия. Никакие другие модальности данных не показали значимых результатов в пробах до или после названия; см. Прил. А.2.5 для графиков всех проб и условий. Временные ряды декодирования вычислялись для каждого отдельного участника в стратифицированной 10-кратной перекрестной проверке; значимость определялась статистическим тестированием второго уровня (кластерный перестановочный t-тест, уровень значимости p &amp;lt; 0,05). Ось X отражает уровень случайности (0,5 для метрики AUC при бинарном декодировании и 0 для метрики R Спирмена при непрерывных оценках).&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"ustojchivoe-dekodirovanie-preduyavleniya,-kategorii-izobrazheniya-i-uslovij-nazvaniya\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#ustojchivoe-dekodirovanie-preduyavleniya,-kategorii-izobrazheniya-i-uslovij-nazvaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Устойчивое декодирование предъявления, категории изображения и условий названия&lt;/span&gt;&lt;/a&gt;Устойчивое декодирование предъявления, категории изображения и условий названия&lt;/h4&gt;\n&lt;p&gt;Примененные нами категориальные экспериментальные воздействия удавалось выявлять весьма надежно. Декодирование контраста между 1-м и 2-м предъявлением любого заданного стимула-изображения (см. Рис. 3a) было надежно осуществимо практически по всем модальностям данных. Это убедительно свидетельствует о том, что стимулы не обрабатываются идентично при повторном предъявлении; напротив, когнитивная обработка различается детектируемым образом. Вызвано ли это простым подавлением вследствие повторения (см. Kim, 2017) или другими факторами, специфичными для исследования, такими как промежуточная контекстуализация с дополнительной информацией (т.е. реальным или фальшивым названием либо решением изображения Муни соответственно) или различающиеся неявные или явные задачи (например, выставление оценок), на данный момент однозначно определить нельзя. Представленную категорию изображения (изображение Муни или картина) также можно было надежно декодировать сразу после начала предъявления изображения как по данным ЭЭГ, так и по данным зрачковых реакций (см. Рис. 3b).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Декодирование показало различия между первым и вторым предъявлениями стимулов, а также успешное определение категории изображения и условий названия.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Примечательно, что, за исключением данных зрачка (см. обсуждение), классификация работала надежнее во время второго предъявления изображения, чем первого (т.е. наблюдались более высокие показатели декодирования и более устойчивая значимость); это было характерно для большинства исследованных задач декодирования в данной работе. Более полное описание результатов приведено в Прил. A.2.6.&lt;/p&gt;\n&lt;p&gt;Переходя к вопросам, более центральным для данного исследования, условие названия произведений искусства (реальное название или фиктивное название) также могло быть достоверно декодировано из сигналов во временной области (см. Рис. 4a). Однако ни один из частотных диапазонов ЭЭГ не мог быть использован для надежного декодирования условия названия. При декодировании по вызванным потенциалам во время второго просмотра (после предъявления названия) точность была наивысшей в устойчивом, но относительно раннем окне после начала предъявления изображения (значимо начиная с 0.3 с с двумя короткими перерывами).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Вызванные потенциалы (ВП) — это электрическая активность мозга в ответ на стимулы, измеряемая с помощью ЭЭГ.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Декодирование по размеру зрачка было значимым в временном окне между 1.47–2.37 с в условиях после предъявления названия. Частота сердечных сокращений во время второго просмотра прогнозировала условие значимым образом в двух временных окнах: от -0.50 до 0.64 с и от 3.31 до 5.00 с соответственно. Как и следовало ожидать, условие названия не удавалось достоверно декодировать во время первого просмотра (когда название или фиктивное название еще не были представлены) ни по одной из зарегистрированных модальностей данных.&lt;/p&gt;\n&lt;h4 id=\"fiziologicheskie-markery-subuektivnoj-obrabotki-opredelyalis-ponimaniem\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#fiziologicheskie-markery-subuektivnoj-obrabotki-opredelyalis-ponimaniem\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Физиологические маркеры субъективной обработки определялись пониманием&lt;/span&gt;&lt;/a&gt;Физиологические маркеры субъективной обработки определялись пониманием&lt;/h4&gt;\n&lt;p&gt;Оценки участников в отношении любопытства, симпатии и понимания можно было достоверно декодировать по данным ВП в определенные моменты времени в течение 5-секундного предъявления изображения, в то время как озарение можно было надежно декодировать по размеру зрачка, а понимание&lt;/p&gt;\n&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;p&gt;Мы исследовали взаимосвязь между любопытством, инсайтом, ощущением понимания и эстетической симпатией, пытаясь объединить эти конструкты в рамках единой концепции мотивированного поиска информации. Мы называем этот подход «эпистемической дугой» смыслообразования. Мы изучили как а) область поведенческих оценок для лучшего понимания взаимодействия этих процессов, так и б) их (нейро)физиологические корреляты для получения представления о временной последовательности событий. Мы исследовали изобразительное искусство как контролируемый, но естественный класс стимулов, способных вызывать смыслообразование и инсайт, в сопоставлении с изображениями Муни как устоявшейся категории стимулов в исследованиях инсайта.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мы предложили концепцию «эпистемической дуги» для объединения любопытства, инсайта и эстетической оценки, используя изобразительное искусство и изображения Муни.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;При этом нам удалось воспроизвести ряд более ранних результатов как из поведенческой литературы по инсайту, так и по эстетической оценке. Крайне важно, что мы выявили сложные и отчасти нелинейные связи между оценками, которые формировались под влиянием типа и объема информации, поступающей через стимульный материал. Используя подход с временнóм разрешением декодирования и мультимодальные физиологические данные (ЭЭГ, пупиллометрию, частоту сердечных сокращений), мы обнаружили свидетельства как быстрых реакций, так и более медленных процессов, развивающихся во времени, хотя объединение наших результатов в единую модель временной последовательности оказалось сложной задачей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ЭЭГ измеряет электрическую активность мозга с высокой точностью по времени, а пупиллометрия и частота сердечных сокращений отражают изменения вегетативной нервной системы, связанные с вниманием и эмоциональным возбуждением.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"svyaz-mezhdu-ocenkami-lyubopytstva,-insajd-ozareniya,-subuektivnogo-ponimaniya-i-esteticheskoj-ocenki\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#svyaz-mezhdu-ocenkami-lyubopytstva,-insajd-ozareniya,-subuektivnogo-ponimaniya-i-esteticheskoj-ocenki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связь между оценками любопытства, инсайд-озарения, субъективного понимания и эстетической оценки&lt;/span&gt;&lt;/a&gt;Связь между оценками любопытства, инсайд-озарения, субъективного понимания и эстетической оценки&lt;/h4&gt;\n&lt;p&gt;Поведенческое исследование (Эксперимент 1) подтвердило большинство наших предзарегистрированных гипотез: нам удалось как воспроизвести сильный эффект манипуляции с названиями на оценки воспринимаемого понимания произведений изобразительного искусства, так и установить аналогичный (даже более сильный) эффект названий на оценки «ага»-озарения. Однако мы не воспроизвели значимый эффект названий на оценки эстетических предпочтений, тем самым пополнив и без того неоднородную литературу по данному вопросу. Как отмечалось ранее во многих работах (например, [12], [12]), мы наблюдали различия в оценках эстетических предпочтений между различными категориями стимулов: в целом более высокие оценки наблюдались для фигуративного искусства по сравнению с абстрактным, а полуабстрактное искусство занимало промежуточное положение. Для воспринимаемого понимания это различие оказалось еще более выраженным. В оценках же «ага»-озарения наблюдалась тенденция к немного более высоким баллам для полуабстрактного искусства по сравнению с фигуративным или абстрактным. Помимо произведений искусства, мы использовали набор изображений Муни и соответствующие им разгадки. Они способны вызывать перцептивные сдвиги, порождающие сильные чувства озарения, и поэтому могут служить ориентиром-бенчмарком. В нескольких предыдущих исследованиях изучались вопросы, схожие с нашими, с использованием изображений Муни, но без произведений искусства ([12], [12]). Как и ожидалось, оценки «ага»-озарения для изображений Муни были выше, чем для всех подкатегорий произведений искусства, за исключением некоторой части полуабстрактного искусства с поясняющими названиями — категории, отчасти схожей с изображениями Муни, поскольку обе они могут приводить к перцептивным сдвигам после предоставления определенного объяснения (например, в некоторых кубистических картинах). С другой стороны, оценки эстетических предпочтений для изображений Муни в среднем оказались немного ниже, чем для произведений искусства. Что касается субъективного понимания, изображения Муни находились между фигуративным и абстрактным искусством с названиями, на одном уровне со стимулами полуабстрактного искусства. Любопытство по поводу названия или разгадки прогнозировало последующее «ага»-озарение (как ранее сообщалось для изображений Муни в работе [12]), хотя наши данные показывают, что сила этой связи зависит от информационного наполнения подсказок в названиях.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оценки любопытства и понимания предсказывают озарение, причем сила связи зависит от информативности названий и категории стимулов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Хотя описательные кривые LOWESS предполагали, что это взаимодействие может приводить к отчасти нелинейным связям, мы не обнаружили статистически значимых доказательств этого. «Ага»-озарение положительно связано с симпатией (вполне линейно, как ранее сообщалось для изображений Муни в работе [12]), а также с субъективным пониманием. Эта связь между озарением и пониманием нелинейно взаимодействует со степенью абстракции стимулов — от линейной связи в абстрактном искусстве до более U-образных отношений в других модальностях (наиболее выраженных в фигуративном искусстве). Другие недавние исследования инсайд-озарения также наблюдали нелинейные связи, тем самым развивая предыдущие выводы, в которых обычно проверялись только линейные отношения. Например, в работе [12] была обнаружена U-образная связь между воспринимаемой сложностью задачи, уверенностью в решении и оценками «ага»-озарения в текстовой задаче на решение аналогий (как очень простые, так и очень сложные испытания вызывали меньшее «ага»-озарение, чем испытания средней сложности). Этот результат согласуется с нашей интерпретацией испытаний с низким «ага»-озарением и высоким пониманием (особенно в фигуративном искусстве), которые значат «легкие» стимулы с низкой начальной неопределенностью. С другой стороны, в исследовании [12] было обнаружено, что оцениваемая внешними экспертами креативность ответов в трех различных текстовых задачах нелинейно связана с семантическим расстоянием пар «стимул — ответ» (положительная линейная связь до определенного порога, после которого увеличение семантического расстояния переставало увеличивать «ага»-озарение). В нашем случае это может быть особенно актуально для интерпретации результатов для эвокативных названий, которые специально выбирались по принципу высокой концептуальной дистанции по отношению к изображенному визуальному контенту, и, в меньшей степени, для абстрактного искусства. Хотя субъективные оценки «ага»-озарения не равны оценке креативности, мы ожидали бы положительной корреляции. В наших данных мы действительно видим, что искусство с чисто описательными названиями (т.е. с очень низкой концептуальной дистанцией) получило самые низкие средние оценки «ага»-озарения. Эвокативные названия, напротив, получили оценки «ага», в целом сопоставимые с поясняющими названиями, а самые высокие общие показатели «ага» зафиксированы для полуабстрактного искусства с поясняющими названиями. Этот паттерн очень сильно напоминает результаты работы [12]. Хотя мы не смогли явно воспроизвести их анализ, поскольку не назначали более точную меру концептуальной дистанции между искусством и названием для каждого стимула, целенаправленный повторный анализ наших данных мог бы предоставить еще более веские доказательства того, действительно ли эта нелинейная связь обобщается на разные модальности и где именно могут располагаться пороговые значения для визуального искусства. Между делом следует помнить, что самые высокие общие оценки «ага» все же давались для изображений Муни, к которым меры семантического или концептуального расстояния (не говоря уже о креативности) применяются с трудом. Тем не менее, перцептивные сдвиги, которые могут происходить в испытаниях, отмеченных высоким «ага», по-видимому, уменьшают расстояние в пространстве внутреннего представления наблюдателей (например, между трудным для интерпретации изображением кошки на картинке Муни и внутренним концептом «кошки» у участника). Аналогичный довод применим и к поясняющим названиям, которые также могут запускать фазовый переход из состояния большой дистанции в состояние малой дистанции в репрезентативном пространстве. Подобным образом назначение меры концептуальной дистанции для этой категории также может быть сложной задачей, поскольку она зависит от исходного состояния участника: дистанция высока, если объяснение неизвестно, но мала, если оно уже знакомо. Хотя цитируемые работы сообщают о нелинейных трендах в изучении инсайда и креативности, согласующихся с нашими результатами, нам не известны другие работы, в которых форма связи в рамках одной и той же задачи зависела бы от категории стимула (то есть наше свидетельство линейной связи озарения и понимания в абстрактном искусстве, но прогрессивно нелинейных связей в других категориях изображений).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;U-образная кривая означает, что крайние случаи (слишком просто или слишком сложно) вызывают меньше озарений, чем средний уровень.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В совокупности наблюдаемые паттерны оценок расширяют наше понимание роли инсайда в осмыслении и формировании эстетических предпочтений. Связь как любопытства, так и понимания с «ага»-озарением (особенно в диапазоне высоких оценок «ага») поддерживает мнение о том, что «ага» может служить надежным индикатором прироста информации или снижения неопределенности (в соответствии с выводами работы [12]). Оценки любопытства для каждого отдельного испытания в рамках этой логики могут отражать ожидаемый потенциал прироста информации; однако его реализация зависит от дополнительной семантической информации, как показывает влияние стиля названия (т.е. объема вновь предоставляемой семантической информации) на взаимосвязь между любопытством и «ага»-озарением после просмотра названия (см. Рис. 2b): чем больше было возможно или ожидаемо снижение неопределенности (о чем свидетельствуют высокие оценки любопытства), тем сильнее был эффект данной подсказки и, следовательно, связь между любопытством и озарением (при этом самая сильная связь между любопытством и озарением наблюдалась на изображениях Муни, а самая слабая — на искусстве без названий). Низкое субъективное понимание, с другой стороны, можно интерпретировать как индикатор остающейся или остаточной неопределенности. Результаты декодирования ЭЭГ поддерживают эту интерпретацию, поскольку понимание лучше всего поддавалось декодированию к концу 2-го испытания (как по данным ЭЭГ в временной области, так и по мощности в тета-диапазоне), когда вся информация была объединена. Высокие оценки «ага»-озарения (большой прирост информации) постоянно ассоциировались с высоким пониманием, но в зависимости от стимулов (категории искусства и стиля названия) высокие оценки понимания также появлялись в испытаниях с низким «ага». Это наблюдалось преимущественно для фигуративного искусства и изображений Муни (см. Рис. 2b), где за низким «ага» следовали особенно низкие оценки любопытства (см. также Рис. A.3). Возможно, для значительной части этих стимулов участники испытывали меньшее любопытство к названию или разгадке из-за того, что с самого начала было мало неопределенности и, следовательно, меньше потенциала для озарения — фигуративная картина с пышным лугом или изображение Муни, которое распознавалось с первого взгляда, могут не вызывать сильного стремления узнать название или исходную базу изображений, в то время как абстрактные и полуабстрактные произведения искусства имеют относительно малую вероятность быть абсолютно однозначными для зрителя. Оценки же симпатии положительно и довольно линейно предсказывались всеми остальными оценками — любопытством, «ага»-озарением и пониманием. Эти связи в значительной степени не зависели от других факторов, таких как художественный стиль или стиль названия (см. Рис. 2d и Рис. A.2.1). На первый взгляд это может указывать на то, что роль эстетической оценки (или по крайней мере наша операционализация оценок в данном исследовании) действительно довольно проста: эстетическая симпатия просто следует за другими суждениями с положительным знаком, в то время как эти другие оценки могут иметь более сложное происхождение. Тем не менее, наши данные также содержат аргументы против столь упрощенной причинной интерпретации: хотя мы (как и многие группы до нас) обнаружили, что фигуративное искусство в среднем получало более высокие эстетические оценки, чем полуабстрактное и абстрактное, этого не наблюдалось для «ага»-озарения и любопытства — категория произведения искусства не имела большого значения для оценок озарения (и только полуабстрактное искусство набирало больше баллов, чем остальные), а любопытство было даже заметно ниже для фигуративного искусства по сравнению с более абстрактными категориями. Более того, не было значимого эффекта нашей манипуляции с названиями на эстетическую симпатию, в то время как она существенно повлияла как на субъективное понимание, так и на «ага»-озарение (для любопытства такое сравнение не имеет смысла, так как названия предъявлялись после сбора этой оценки). Хотя все три оценки линейно предсказывали симпатию на уровне отдельных испытаний, симпатия не выглядит просто следующим за другими оценками компонентом, иначе паттерны общих средних значений были бы более похожими. Более того, во временных рядах декодирования симпатия демонстрировала пик декодируемости в начале испытаний, задолго до других оценок (подробное обсуждение приведено ниже). Опираясь на наши результаты, будущие исследования могли бы спланировать интервенционные исследования, чтобы более пристально, в идеале более причинно, взглянуть на эти взаимосвязи. Выше мы обсудили множество интересных результатов о влиянии информационного наполнения и различных других характеристик стимулов на осмысление, но мы хотим подчеркнуть, что существуют и другие важные факторы, которые также вносят свой вклад. В частности, индивидуальные различия между участниками могут проявляться в более сложных взаимодействиях, чем просто различия в исходном уровне. Например, исследование [12] показало, что различные стратегии визуального поиска (связанные с экспертным опытом в искусстве или просто с тренировкой) могут приводить к более быстрому и точному распознаванию объектов на кубистических картинах (т.е. к более эффективному извлечению информации). Но также было обнаружено, что позитивное настроение усиливает чувство «ага»-озарения ([12]), и остается неясным, будет ли это одинаково применимо ко всем условиям или же проявит более сложные взаимодействия.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдаемые корреляции и нелинейные эффекты получены в лабораторных условиях на специфической выборке; индивидуальные различия и настроение могут существенно модулировать результаты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"fiziologicheskie-korrelyaty-i-vremennaya-posledovatelnost-obrabotki-informacii\"&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html#fiziologicheskie-korrelyaty-i-vremennaya-posledovatelnost-obrabotki-informacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Физиологические корреляты и временная последовательность обработки информации&lt;/span&gt;&lt;/a&gt;Физиологические корреляты и временная последовательность обработки информации&lt;/h4&gt;\n&lt;p&gt;Во втором эксперименте нашей целью было охарактеризовать временной профиль эпистемической дуги путем отслеживания быстрых (нейро)физиологических коррелятов. Эта часть исследования носила более поисковый характер, и у нас было предварительно зарегистрировано лишь две общие гипотезы на основе предыдущих работ, а именно: связь активности в альфа- и гамма-диапазонах ЭЭГ с оценками инсайдного озарения и симпатии. Мы не обнаружили доказательств в поддержку этих гипотез. Хотя наш подход многомерного декодирования позволил надежно идентифицировать основные экспериментальные манипуляции на основе ЭЭГ во временной области, ЭЭГ в частотной области (за исключением гамма-диапазона), частоты сердечных сокращений и данных о размере зрачка, оценки по шкалам градации оказалось сложнее восстановить, и декодирование работало лучше для различных сигналов во временной области, чем для ЭЭГ в частотной области.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оговорка: поисковый характер анализа и отсутствие значимых результатов для шкал оценки означают, что данные о быстрых физиологически
