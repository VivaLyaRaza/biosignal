            {"data":{"leading":true,"data":{"blocks":[{"type":"header-block","title":"Выпуск 2026-09-22","theme":"dark","width":"m","description":"&lt;p&gt;Материалы выпуска: 12&lt;/p&gt;\n","background":{"color":"#2A9D8F","image":"2026-09-22/bg-issue.jpg"}},{"type":"media-block","animated":false,"title":"&lt;p&gt;Как мозг путает знакомое с новым: найден клеточный код памяти&lt;/p&gt;\n","description":"&lt;p&gt;Когда мы принимаем незнакомый предмет за старый из-за внешнего сходства, в мозге происходит сбой механизма разделения образов. Долгое время оставалось неясным, как именно отдельные нервные клетки человека справляются с этой задачей. Нейробиологи записали электрическую активность тысяч нейронов у пациентов во время тестов на память. Оказалось, что в гиппокампе существуют специализированные клетки, которые различают истинно знакомые образы и похожие на них ложные стимулы. Это открытие впервые подтверждает существование клеточного механизма разделения памяти у людей.&lt;/p&gt;\n","media":{"image":"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h-card.jpg"},"button":{"text":"Читать","url":"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html"}},{"type":"card-layout-block","animated":false,"title":"Материалы выпуска","colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h-card.jpg"},"content":{"title":"Как мозг путает знакомое с&amp;nbsp;новым: найден клеточный код памяти","text":"&lt;p&gt;Ученые впервые зафиксировали работу отдельных нейронов человеческого мозга, отвечающих за разделение похожих воспоминаний.&lt;/p&gt;\n","links":[{"url":"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l-card.jpg"},"content":{"title":"Как отдельные нейроны мозга реагируют на&amp;nbsp;правила общения","text":"&lt;p&gt;Ученые впервые заглянули в работу одиночных нейронов человеческого мозга при оценке социальных норм и справедливости.&lt;/p&gt;\n","links":[{"url":"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd-card.jpg"},"content":{"title":"Скрытые кольцевые молекулы РНК выдают опасное нейродегенеративное заболевание","text":"&lt;p&gt;Сбой важного белка в мозге запускает сборку аномальных кольцевых РНК, открывая новые пути для ранней диагностики.&lt;/p&gt;\n","links":[{"url":"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-card.jpg"},"content":{"title":"Как наш мозг превращает непонятное искусство в&amp;nbsp;удовольствие","text":"&lt;p&gt;Ученые проследили путь от простого любопытства до озарения и радости от понимания картин.&lt;/p&gt;\n","links":[{"url":"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-card.jpg"},"content":{"title":"Как гормоны влияют на&amp;nbsp;гены аутизма и&amp;nbsp;расстройств развития мозга","text":"&lt;p&gt;Ученые проверили, как эстрадиол влияет на работу 36 генов, связанных с аутизмом и расстройствами развития мозга.&lt;/p&gt;\n","links":[{"url":"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio-card.jpg"},"content":{"title":"Новый быстрый тест на&amp;nbsp;опасную амебу Balamuthia mandrillaris","text":"&lt;p&gt;Создан первый экспресс-тест на редкую и смертельную амебу, позволяющий быстро поставить диагноз даже в обычных клиниках.&lt;/p&gt;\n","links":[{"url":"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-card.jpg"},"content":{"title":"Ученые впервые экспериментально доказали существование вирусоподобных РНК с&amp;nbsp;генами","text":"&lt;p&gt;Ученые впервые в лаборатории доказали существование загадочных кольцевых РНК, которые кодируют белки и живут без ДНК.&lt;/p&gt;\n","links":[{"url":"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-card.jpg"},"content":{"title":"Как прерывистый сон запускает вспышки эпилепсии в&amp;nbsp;мозге","text":"&lt;p&gt;Ученые выяснили, почему микропробуждения во время сна провоцируют патологическую активность нейронов без расширения сети приступов.&lt;/p&gt;\n","links":[{"url":"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/plscr1-inhibits-murine-norovirus-entry-card.jpg"},"content":{"title":"Белок Plscr1 останавливает проникновение мышиного норовируса","text":"&lt;p&gt;Ученые открыли клеточный белок, который блокирует проникновение норовируса в клетки.&lt;/p&gt;\n","links":[{"url":"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-card.jpg"},"content":{"title":"Как крысы избегают черных лебедей и&amp;nbsp;ищут джекпоты","text":"&lt;p&gt;Редкие и катастрофические события управляют выбором животных сильнее, чем рутина.&lt;/p&gt;\n","links":[{"url":"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in-card.jpg"},"content":{"title":"Грипп оставляет след в&amp;nbsp;мозге: как мутация LRRK2 запускает белковые сдвиги","text":"&lt;p&gt;Перенесенный грипп запускает в мозге носителей мутации LRRK2 изменения, похожие на ранние этапы нейродегенерации.&lt;/p&gt;\n","links":[{"url":"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-card.jpg"},"content":{"title":"Карта развития гиппокампа человека для изучения ранней болезни Альцгеймера","text":"&lt;p&gt;Создана детальная карта развивающегося гиппокампа для проверки лабораторных моделей болезни Альцгеймера.&lt;/p&gt;\n","links":[{"url":"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html","text":"Читать","arrow":true,"theme":"normal"}]}}]}],"links":[]},"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Выпуск 2026-09-22","vcsPath":"2026-09-22/index.yaml"},"title":"Выпуск 2026-09-22"},"router":{"pathname":"2026-09-22/index","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
