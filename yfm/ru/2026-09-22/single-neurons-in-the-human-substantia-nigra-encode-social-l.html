. Участники вводили свои ответы с помощью игрового контроллера. Всего мы собрали 27 сессий от когорты SNr и 7 сессий от когорты GPi.&lt;/p&gt;\n&lt;h4 id=\"igra-ultimatum\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#igra-ultimatum\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Игра «Ультиматум»&lt;/span&gt;&lt;/a&gt;Игра «Ультиматум»&lt;/h4&gt;\n&lt;p&gt;Во время каждой сессии регистрации активности одиночных нейронов участники играли в игру «Ультиматум» (UG), которая используется для оценки норм социальной справедливости и адаптации к нормам (Рис. 1B). Участники играли в одну из двух версий UG: только с человеком (n = 15 сессий у 10 пациентов из когорты SNr; n = 5 сессий у 3 пациентов из когорты GPi) и полную версию с условиями «человек» и «компьютер» (n = 12 сессий у 9 пациентов из когорты SNr; n = 2 сессии у 2 пациентов из когорты GPi).&lt;/p&gt;\n&lt;p&gt;В версии только с человеком участникам неоднократно предлагались варианты раздела $20 «человеческими» аватарами-партнерами, которые они могли принять или отклонить. Если участник принимал предложение, каждая сторона получала предложенные суммы. Если участник отклонял, каждая сторона получала 0. В начале каждой пробы участникам сначала показывали аватар (1,5–2,5 с). Затем участникам демонстрировали предложенный раздел 20 («раскрытие раздела»; 1 с). Кнопки выбора (принять/отклонить) появлялись под предложенным разделом, побуждая участников сделать выбор (в удобном для них темпе). После выбора выбранный вариант оставался подсвеченным в течение 1 секунды, прежде чем экран менялся, показывая итоговые суммы в долларах, полученные каждой стороной («результат раздела»; 1,5 с). Все предложения составляли 9 или меньше, предложения были псевдослучайными с нормальным распределением от 1 до $9. Выбор не влиял на будущие предложения. Игроки не были заранее осведомлены о структуре предложений. В каждой пробе новое предложение предлагалось новым человеческим аватаром. Человеческие аватары различались по имени, полу и физическим особенностям, чтобы отразить расовое и культурное разнообразие. Пациенты выполняли 30 проб, что занимало примерно 5 минут.&lt;/p&gt;\n&lt;p&gt;В полной версии с условиями «человек» и «компьютер» участники выполняли 30 проб UG с человеческими аватарами-партнерами, а также дополнительный блок из 30 проб с «компьютерными» партнерами. Порядок блоков был уравновешен: 5 участников играли блок с человеком перед компьютерным блоком, а 7 участников играли компьютерный блок перед человеческим. Кроме того, участники заполняли самоотчет об оценке настроения (в удобном темпе) после случайных 33% проб выбора. Для заполнения этой оценки настроения участники выбирали свое текущее настроение по шкале от несчастного лица (кодируется как 0) до счастливого лица (кодируется как 100). Две незначительные детали представления на экране отличались от таковых в UG: раскрытие раздела появлялось одновременно с кнопками выбора, а результат раздела длился 1 с вместо 1,5 с. В общей сложности эта версия UG занимала примерно 10 минут.&lt;/p&gt;\n&lt;h4 id=\"kriterii-isklyucheniya\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#kriterii-isklyucheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Критерии исключения&lt;/span&gt;&lt;/a&gt;Критерии исключения&lt;/h4&gt;\n&lt;p&gt;Для обеспечения высокого качества данных и предотвращения искажений, вызванных невнимательностью или сонливостью, все сессии, в которых поведение участников указывало на невыполнение инструкций к заданию, исключались из поведенческого анализа. К ним относились сессии с «плоским» поведением, определяемым как сессии, в которых было принято или отклонено менее 2 предложений за весь блок с человеком или компьютером. Эта мера эффективно исключала сессии, в которых участники принимали все предложения, что препятствует вариативности выбора, необходимой для подгонки моделей. Также исключались сессии, в которых логистическая аппроксимация бинарного выбора в зависимости от размера предложения имела неположительный наклон, что означает, что вероятность принятия предложения не увеличивается с ростом его размера. Если оценки настроения были «плоскими», они исключались из анализа, однако данные о поведенческом выборе сохранялись.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Плоское» поведение или оценки означают отсутствие вариативности в ответах участника, что делает невозможным математическое моделирование процесса принятия решений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Поведенческие сессии с «плоскими» оценками настроения — это те, в которых разница между минимальной и максимальной оценками составляет менее 10 баллов. В когорте SNr 3 сессии UG и 3 сессии UG-bot были исключены из поведенческого анализа из-за «плоского» выбора. Дополнительно 2 сессии UG-bot были исключены из анализа оценок настроения из-за «плоских» оценок.&lt;/p&gt;\n&lt;p&gt;В когорте GPi 1 сессия UG была исключена из поведенческого анализа из-за «плоского» выбора, и 1 сессия UG-bot была исключена из анализа оценок настроения.&lt;/p&gt;\n&lt;h4 id=\"vychislitelnoe-modelirovanie-povedeniya\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#vychislitelnoe-modelirovanie-povedeniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вычислительное моделирование поведения&lt;/span&gt;&lt;/a&gt;Вычислительное моделирование поведения&lt;/h4&gt;\n&lt;p&gt;Вся очистка данных, поведенческий анализ и вычислительное моделирование были выполнены в MATLAB и RStudio. Анализ без использования моделей включал: общую частоту отклонений по типу блока (человек/компьютер), частоту отклонений в зависимости от размера предложения, общее время реакции по типу блока, общую оценку настроения по типу блока и оценку настроения в зависимости от выбора (принять/отклонить).&lt;/p&gt;\n&lt;p&gt;Далее, к данным о выборе были применены модели, ранее использованные для моделирования полезности, вероятностей принятия решений и адаптации норм. Сначала мы представили полезность обмена на каждой попытке, используя уравнение Фера-Шмидта (FS) для полезности неприятия неравенства: &lt;span class=\"yfm-latex\" data-content=\"U_i(s_i)%20%3D%20s_i%20-%20%5Calpha%20%5Ccdot%20%5Cmax%5C%7Bf_i%20-%20s_i%2C%200%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Здесь полезность (U_i) предложения (s_i) равна разности между s_i и произведением разности между внутренней нормой участника (f_i) и s_i на чувствительность участника к невыгодному неравенству (&lt;span class=\"yfm-latex\" data-content=\"%5Calpha%20%5Cin%20%5B0%2C1%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, «альфа»). Альфа отражает нежелание участника принимать предложение ниже внутренней нормы в данной попытке. Более высокие значения α представляют большую неприязнь к несправедливости. Чувствительность к выгодному неравенству («вина») в этой парадигме не требуется, так как все предложения составляют $9 или меньше.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель Фера-Шмидта (FS) — это математический подход в поведенческой экономике, который количественно оценивает, насколько человек готов пожертвовать личной выгодой, чтобы избежать несправедливого распределения ресурсов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Затем мы смоделировали вероятность принятия каждого предложения, используя функцию softmax: &lt;span class=\"yfm-latex\" data-content=\"p_i(s_i)%20%3D%20%5Cfrac%7Be%5E%7B%5Cbeta%20U_i(s_i)%7D%7D%7B1%20%2B%20e%5E%7B%5Cbeta%20U_i(s_i)%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Эта функция учитывает полезность каждого предложения и параметр обратной температуры (&lt;span class=\"yfm-latex\" data-content=\"%5Cbeta%20%5Cin%20%5B0%2C1%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;), который отражает вариативность выбора участника. Низкие значения β соответствуют более вариативному выбору.&lt;/p&gt;\n&lt;p&gt;В моделях FS норма считается статической, неизменной метрикой. Чтобы смоделировать адаптацию внутренней нормы, мы сравнили два класса моделей адаптации норм для определения наилучшего соответствия поведению этой когорты: модели Рескорлы-Вагнера (RW), производные от обучения с временными различиями, и байесовские модели наблюдателя. Оба класса моделей адаптации норм предполагают, что внутренняя норма меняется со временем; однако они различаются правилом обновления нормы.&lt;/p&gt;\n&lt;p&gt;Модели RW — это подход, основанный на обучении с подкреплением, в котором агент учится совершать действия, максимизирующие вознаграждение в неопределенной среде. В моделях RW норма обновляется следующим образом: &lt;span class=\"yfm-latex\" data-content=\"f_i%20%3D%20f_%7Bi-1%7D%20%2B%20%5Cvarepsilon(s_i%20-%20f_%7Bi-1%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Здесь внутренняя норма (f_i) в попытке i равна норме в предыдущей попытке (fi-1) плюс произведение скорости адаптации нормы (&lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon%20%5Cin%20%5B0%2C1%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;) и разности между предложением (s_i) и внутренней нормой в предыдущей попытке (fi-1), или nPE. &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; отражает величину влияния предложения (s_i) на развивающуюся внутреннюю норму (f_i).&lt;/p&gt;\n&lt;p&gt;Байесовские модели, напротив, основаны на статистическом подходе, который оценивает распределение вероятностей параметров модели на основе наблюдаемых данных. Мы предполагаем, что каждый участник моделирует предложения как исходящие из нормального распределения, характеризующегося неизвестным средним и дисперсией. У участника есть начальное априорное распределение среднего (µ) и дисперсии (σ²), и это априорное распределение обновляется с каждым новым предложением. Учитывая µ и σ², предложения (X) определяются как: X / µ, σ² ~ N(µ, σ²). После получения первого предложения (s_i) и при условии априорного распределения p(µ, σ²), апостериорное распределение определяется как: p(µ, σ² / s_i) = p(s_i / µ, σ²)p(µ, σ²).&lt;/p&gt;\n&lt;p&gt;Сопряженное априорное распределение определяется как: p(µ, σ²) = P₁(µ / σ²)P₂(σ²), p₁(µ / σ²) = NormalDensity(µ / µ₀, σ² k₀), p₂ = Inv-X²(σ² v₀). Далее, после всех последующих предложений, апостериорные распределения определяются итеративно: &lt;span class=\"yfm-latex\" data-content=\"k_%7Bi%2B1%7D%20%3D%20k_i%20%2B%201%2C%20%5Cnu_%7Bi%2B1%7D%20%3D%20%5Cnu_i%20%2B%201\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"%5Cmu_%7Bi%2B1%7D%20%3D%20%5Cmu_i%20%2B%20%5Cfrac%7B1%7D%7Bk_%7Bi%2B1%7D%7D(s_i%20-%20%5Cmu_i)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"%5Cnu_%7Bi%2B1%7D%5Csigma_%7Bi%2B1%7D%5E2%20%3D%20%5Cnu_i%5Csigma_i%5E2%20%2B%20%5Cfrac%7Bk_i%7D%7Bk_%7Bi%2B1%7D%7D(s_i%20-%20%5Cmu_i)%5E2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Наконец, в попытке i + 1 обновленная внутренняя норма определяется как: &lt;span class=\"yfm-latex\" data-content=\"E_i%5BX%5D%20%3D%20%5Cint%20x%20p(x%20%2F%20%5Cmu%2C%20%5Csigma%5E2)p_1(%5Cmu%20%2F%20%5Csigma%5E2%2C%20%5Cmu_i%2C%20k_i)p_2(%5Csigma%5E2%20%2F%20%5Cnu_i)%20%3D%20%5Cmu_i\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;p&gt;Внутри каждого класса моделей отдельные модели различались предположениями о начальной внутренней норме; модели либо предполагали фиксированное ожидание начальной нормы, равное 10 (соответствующее равному разделу $20; обозначено «fixed f0»), либо переменное ожидание начальной нормы, которое индивидуально подбиралось под поведение каждого субъекта (обозначено «variable f0»). Модели с переменной начальной нормой также различались тем, подбиралась ли альфа индивидуально для каждого субъекта или была фиксированной для всей выборки пациентов на уровне среднего значения группы (обозначено «fixed alpha»).&lt;/p&gt;\n&lt;p&gt;Все модели были подогнаны к поведенческим сессиям каждого субъекта (с раздельной обработкой блоков человека и компьютера) и сравнены на предмет наилучшего соответствия, определяемого по минимальному общему значению байесовского информационного критерия (BIC) по группе. Общий BIC — это сумма значений BIC для каждого субъекта по каждой модели на уровне группы. Модель FS: fixed alpha победила, за ней последовала модель RW: fixed alpha (Рис. 2D).&lt;/p&gt;\n&lt;p&gt;Далее, чтобы оценить, определяется ли поведение классической ошибкой предсказания вознаграждения (RPE), мы сравнили все 9 моделей с подходом Q-обучения. Алгоритм Q-обучения изучает оптимальную функцию «действие-ценность» в среде без какой-либо предварительной модели динамики этой среды. Это делается путем обновления Q-значений, которые являются оценками ценности совершения действия в данном состоянии на основе полученного вознаграждения и оценочной ценности следующего состояния. Этот метод корректирует Q-значения инкрементально, основываясь на RPE. Обновления, направляемые RPE, выполняются с коэффициентом обучения от 0 до 1 после получения вознаграждения и до того, как будет предложено следующее предложение. Начальные Q-значения следующие: &lt;span class=\"yfm-latex\" data-content=\"Q(s_i%2C%20%5Ctext%7Baccept%7D)%20%3D%20s_i%20%5Ccdot%201%20-%20%5Ceta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"Q(s_i%2C%20%5Ctext%7Breject%7D)%20%3D%20s_i%20%5Ccdot%201%20-%20%5Ceta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Эти Q-значения дают начальную ценность пары «состояние-действие», в которой предложение s_i принимается или отклоняется. Эта (&lt;span class=\"yfm-latex\" data-content=\"%5Ceta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;) представляет собой коэффициент временного дисконтирования, который определяет, насколько будущие вознаграждения влияют на текущую ценность; здесь &lt;span class=\"yfm-latex\" data-content=\"%5Ceta%20%3D%200.8\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Далее, для попытки i &amp;gt; 1, основываясь на предыдущем выборе (т.е. принять или отклонить) в попытке i-1, правило обновления Q-обучения при принятии предложения выглядит следующим образом: &lt;span class=\"yfm-latex\" data-content=\"Q(s_%7Bi-1%7D%2C%20%5Ctext%7Baccept%7D)%20%3D%20Q(s_%7Bi-1%7D%2C%20%5Ctext%7Baccept%7D)%20%2B%20%5Calpha(U_i(s_i)%20%2B%20%5Ceta%20%5Ccdot%20%5Cmax%20Q(s_i%2C%20a)%20-%20Q(s_%7Bi-1%7D%2C%20%5Ctext%7Baccept%7D))\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Здесь альфа (α) — это коэффициент обучения, который определяет, насколько ошибка предсказания обновляет старое Q-значение. α находится в диапазоне от 0 до 1; 0 отражает отсутствие обновления (т.е. отсутствие обучения), а 1 отражает полное обновление (т.е. полное обучение).&lt;/p&gt;\n&lt;p&gt;Альтернативно, правило обновления Q-learning в случае отклонения предложения выглядит следующим образом: &lt;span class=\"yfm-latex\" data-content=\"Q(s_%7Bi-1%7D%2C%20reject)%20%3D%20Q(s_%7Bi-1%7D%2C%20reject)%20%2B%20%5Calpha(0%20%2B%20%5Ceta%20%5Ccdot%20%5Cmax%20Q(s_i%2C%20a)%20-%20Q(s_%7Bi-1%7D%2C%20reject))\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;p&gt;Разница значений составляет: V_i = Q(s_i, accept) - Q(s_i, reject).&lt;/p&gt;\n&lt;p&gt;Наконец, вероятность принятия предложения моделируется как: &lt;span class=\"yfm-latex\" data-content=\"p_i(s_i)%20%3D%20%5Cfrac%7Be%5E%7B%5Cbeta%20V_i%7D%7D%7B1%20%2B%20e%5E%7B%5Cbeta%20V_i%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Таким образом, в то время как nPE описывает, насколько предложение выше или ниже индивидуальной нормы справедливости, основанной на модели, RPE, напротив, представляет собой разницу между полученным результатом и ожиданием, основанным на предыдущих событиях.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Q-learning — это метод обучения с подкреплением, где агент учится выбирать действия, максимизирующие ожидаемую суммарную награду, обновляя значения Q на основе разницы между предсказанным и фактическим результатом.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы сравнили значения BIC для всех 9 моделей со значением BIC для подхода Q-learning и обнаружили, что модель FS: fixed α снова обеспечила наилучшее соответствие, за ней следует модель RW: fixed α, при этом подход Q-learning показал худшие результаты, чем все остальные 9 моделей (Рис. S2A). Эти результаты были согласованы как в рамках условий с человеком, так и в условиях с компьютером (Рис. S2B-C), что позволяет предположить, что поведение в нашей задаче мотивировано не классическим Q-learning, а скорее статичными социальными предпочтениями, как в модели FS: fixed α, или основанным на модели включением новой информации в ожидания относительно норм с течением времени, как в модели RW: fixed α.&lt;/p&gt;\n&lt;p&gt;Затем, чтобы облегчить оценку доказательной силы для каждой из двух наиболее подходящих моделей, мы оценили ΔBIC, ожидаемую частоту моделей и защищенные вероятности превышения (Таблица S3). Эти анализы показали, что модель FS: fixed α имела наименьший BIC с ожидаемой частотой модели 0,435 и защищенной вероятностью превышения 0,932. Модель RW: fixed α имела ΔBIC 13,707, ожидаемую частоту модели 0,174 и защищенную вероятность превышения 0,043. Это означает, что 43,5% популяции, как ожидается, лучше всего описываются моделью FS: fixed alpha, в то время как 17,4% популяции лучше всего описываются моделью RW: fixed alpha. Таким образом, хотя в целом существует больше доказательств в поддержку модели FS: fixed α, также имеются свидетельства некоторой гетерогенности в наилучшем соответствии между двумя моделями-кандидатами, что согласуется с тем фактом, что средние значения BIC были сопоставимы и составили 10,45 и 10,93 для моделей FS: fixed α и RW: fixed α соответственно.&lt;/p&gt;\n&lt;p&gt;Затем мы продолжили оценку этих двух моделей, изучая степень идентифицируемости каждой из них с помощью восстановления модели (Рис. S3; Таблица S4). Сначала мы вычислили эмпирическое среднее и стандартное отклонение для каждого параметра каждой из 10 моделей, построили нормальные распределения, центрированные на этих оценках для каждого параметра внутри каждой модели, и извлекли новые значения параметров из этих распределений, используя ту же процедуру выборки параметров, что и при восстановлении параметров. Для каждой генерирующей модели мы симулировали поведенческие наборы данных для 29 синтетических субъектов, используя эти выбранные параметры, что соответствует 29 эмпирическим поведенческим наборам данных, прошедшим подгонку моделей в нашем исследовании. Затем мы повторно подогнали все 10 моделей к этим симулированным наборам данных. Этот процесс повторялся 200 независимых раз, при этом для каждого повторения генерировались новые значения параметров и симулированные наборы данных для всех 29 синтетических субъектов. После этого мы построили как матрицу восстановления 10x10, так и матрицу восстановления классового уровня 4x4 (модели RW, модели Bayes, модели FS и модель Q-learning), чтобы дополнительно ответить на вопрос о том, представляют ли эти классы моделей различимые вычислительные процессы.&lt;/p&gt;\n&lt;p&gt;На уровне отдельных моделей самые высокие вероятности восстановления были продемонстрированы моделями Q-learning (50,79%), Bayes: fixed alpha (45,88%), FS: fixed f0 (45,83%) и RW: fixed alpha (45,47%) (см. новую Таблицу S4 и Рис. S3, добавленные в рукопись и скопированные ниже). Модель FS: fixed alpha продемонстрировала более слабое восстановление с вероятностью 37,62%. Наконец, модели RW: variable f0, RW: fixed f0, Bayes: variable f0, Bayes: fixed f0 и FS: variable f0 были практически невосстановимы (вероятности восстановления 1,28%, 9,72%, 0,41%, 9,33% и 0,71% соответственно). Эти результаты показывают, что модели с переменным f0, как правило, менее идентифицируемы, в то время как модели с фиксированным α, как правило, более идентифицируемы.&lt;/p&gt;\n&lt;p&gt;Дальнейшее изучение матрицы восстановления показало, что путаница чаще всего возникала между родственными моделями внутри одного и того же класса моделей.&lt;/p&gt;\n&lt;p&gt;Чтобы оценить, были ли модели более различимы на уровне классов, мы построили матрицу восстановления на уровне классов, усреднив вероятности восстановления по моделям внутри каждого класса. На уровне классов вероятности восстановления для моделей RW, моделей Bayes, моделей FS и модели Q-learning составили 40,57%, 47,67%, 81,82% и 50,79% соответственно (см. новую Таблицу S5 и Рис. S4, добавленные в рукопись и скопированные ниже). Большая часть путаницы возникала между семействами RW и Bayes, что согласуется с тем фактом, что оба класса реализуют механизмы адаптации норм на основе моделей. В целом, эти анализы показывают, что, хотя родственные индивидуальные модели иногда путаются друг с другом внутри общих классов моделей, эти классы моделей более высокого уровня восстанавливаются более надежно, что указывает на то, что поведенческие прогнозы, генерируемые этими вычислительными классами моделей, являются довольно различимыми.&lt;/p&gt;\n&lt;p&gt;Более того, из двух моделей с наилучшим соответствием модель RW: fixed α продемонстрировала наилучшую идентифицируемость при восстановлении модели.&lt;/p&gt;\n&lt;h4 id=\"vosstanovlenie-parametrov\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#vosstanovlenie-parametrov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Восстановление параметров&lt;/span&gt;&lt;/a&gt;Восстановление параметров&lt;/h4&gt;\n&lt;p&gt;Затем для проверки возможности восстановления параметров, сгенерированных моделью RW: fixed α, было искусственно смоделировано 29 поведенческих сессий на основе нормальных распределений оценок параметров, полученных из 29 эмпирических поведенческих сессий. Смоделированное поведение затем подвергалось тому же процессу моделирования, что и исходное эмпирическое поведение. Полученные параметры модели из смоделированных подгонок затем сравнивались с помощью корреляции с исходными оценками эмпирических параметров. Более высокие коэффициенты корреляции Пирсона указывали на лучшую восстанавливаемость параметров. Все параметры модели были достоверно восстановлены (Рис. S5; температура: r = 0.51, p = 0.0049; скорость адаптации нормы: r = 0.86, p = 1.8e-09; начальная норма: r = 0.94, p = 6.9e-14). Следовательно, мы заключили, что данная модель адаптации норм может применяться с достаточной воспроизводимостью.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Восстановление параметров — это валидационный тест, в котором искусственно генерируют данные с известными параметрами, чтобы проверить, сможет ли алгоритм моделирования вернуть те же самые исходные значения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"aposteriornye-prognoznye-proverki\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#aposteriornye-prognoznye-proverki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Апостериорные прогнозные проверки&lt;/span&gt;&lt;/a&gt;Апостериорные прогнозные проверки&lt;/h4&gt;\n&lt;p&gt;Далее мы исследовали, воспроизводит ли модель RW: fixed α паттерны выбора, наблюдавшиеся в нашем исследовании. Для этого мы смоделировали 29 поведенческих наборов данных на основе оценок параметров, полученных при подгонке эмпирической модели с помощью модели RW: fixed α, используя точные векторы предложений, представленные в каждой сессии.&lt;/p&gt;\n&lt;p&gt;Модель RW: fixed α воспроизводила общие показатели отклонения как в условиях с человеческим (среднее ± SEM: наблюдаемое: 0.662 ± 0.042; смоделированное: 0.652 ± 0.045), так и с компьютерным (наблюдаемое: 0.542 ± 0.050; смоделированное: 0.500 ± 0.065) аватарами партнеров (Рис. S6A). Модель RW: fixed α также воспроизводила негативное влияние размера предложения на частоту отклонений (Рис. S6B). Наконец, чтобы оценить, воспроизводит ли модель RW: fixed α поведение на уровне отдельных испытуемых, индивидуальные показатели отклонения для наблюдаемых и смоделированных сессий также сравнивались, выявив сильную линейную корреляцию (Рис. S6C; моментно-производная корреляция Пирсона, p = 4.55e-12, r = 0.914, 95% ДИ 0.823 - 0.959).&lt;/p&gt;\n&lt;h4 id=\"sravnenie-parametrov-po-usloviyam\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#sravnenie-parametrov-po-usloviyam\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сравнение параметров по условиям&lt;/span&gt;&lt;/a&gt;Сравнение параметров по условиям&lt;/h4&gt;\n&lt;p&gt;Для модели RW: fixed alpha оценки параметров обратной температуры, скорости адаптации нормы и начальной нормы сравнивались с помощью моделей со смешанными эффектами, прогнозирующих каждый параметр по условию (человеческий или компьютерный аватар) со случайными эффектами для участника и для сессии внутри участника (Таблица 1). Модель со смешанными эффектами, прогнозирующая температуру по условию со случайными эффектами для участника и для сессии внутри участника, не выявила значимого эффекта условия (условие, p = 0.34, β ± SEM = 0.80 ± 0.83; OR = 2.24, 95% ДИ [0.41, 12.17]). Модель со смешанными эффектами, прогнозирующая начальную внутреннюю норму по условию со случайными эффектами для участника и для сессии внутри участника, обнаружила значимый эффект условия, заключающийся в том, что начальные нормы были выше во время игры с партнерами — человеческими аватарами по сравнению с компьютерными (условие, p = 0.025, β ± SEM = -4.76 ± 2.00; OR = 0.0085, 95% ДИ [0.00014, 0.52]). Наконец, модель со смешанными эффектами, прогнозирующая скорость адаптации нормы по условию со случайными эффектами для участника и для сессии внутри участника, не выявила значимого эффекта условия (условие, p = 0.083, β ± SEM = 0.053 ± 0.030; OR = 1.05, 95% ДИ [0.99, 1.12]). Таким образом, в то время как температура и скорость адаптации нормы не различались по условиям, начальные нормы действительно различались по условиям, так что нормы справедливости были выше во время игры с партнерами — человеческими аватарами.&lt;/p&gt;\n&lt;h4 id=\"analiz-elektrofiziologicheskih-dannyh-odinochnyh-nejronov\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#analiz-elektrofiziologicheskih-dannyh-odinochnyh-nejronov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ электрофизиологических данных одиночных нейронов&lt;/span&gt;&lt;/a&gt;Анализ электрофизиологических данных одиночных нейронов&lt;/h4&gt;\n&lt;p&gt;Нейронные данные оцифровывали с частотой 44 000 Гц и фильтровали в диапазоне 300–9000 Гц для выделения только высокочастотной активности. Кластеры из отфильтрованных записей одиночных нейронов определяли в среде MATLAB с использованием алгоритма автономной сортировки спайков OSORT, разработанного Рутихаузером и соавторами. Спайки детектировали только тогда, когда нейронный сигнал превышал порог стандартного отклонения средней амплитуды сигнала, умноженный на пять. При обнаружении каждого нового спайка он сравнивался по многомерному расстоянию с кластерами аналогичных ранее обнаруженных спайков. Если расстояние было меньше порогового значения кластеризации (среднеквадратичное стандартное отклонение отфильтрованного сигнала вдоль скользящего окна, умноженное на количество точек данных в форме волны), то он добавлялся к этому кластеру; если расстояние превышало пороговый уровень, он классифицировался как новый кластер.&lt;/p&gt;\n&lt;p&gt;Затем мы вручную изучали каждый кластер, возвращенный алгоритмом сортировки, устраняя артефакты и объединяя кластеры, которые были ошибочно разделены. Кластер считался артефактом, если более 5% всех спайков, происходящих из этого кластера, имели интервал между спайками (ISI) менее 3 мс, что соответствует длительности рефрактерного периода. Ошибочные разделения выявляли путем изучения проекционных тестов, сгенерированных OSORT для каждого кластера. Эти проекционные тесты обеспечивают визуализацию многомерного расстояния между каждой возможной парой кластеров.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сортировка спайков (spike sorting) — это компьютерный метод разделения электрических сигналов от разных нейронов, записанных одним микроэлектродом, по их уникальной форме волны.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы классифицировали кластеры с ISI &amp;lt;5% как предполагаемые одиночные нейроны (putative single units). Мы создали растровые графики и гистограммы времени перистимулусного откликов для каждой предполагаемой единицы в момент раскрытия разделения (split reveal) — момента в задании UG, при котором предъявляется предложение. Затем мы сглаживали серии спайков для предполагаемых единиц в непрерывные формы волны с помощью скользящего симметричного ядра Гаусса (ширина = 300 мс), центрированного в каждой временной точке (см. Рис. S8 для примера одной единицы). Сглаживание выполнялось с нулевой фазой и не вносило временных сдвигов в тайминг нейронных ответов. Мы вычисляли среднюю частоту импульсации для каждой предполагаемой единицы и характеризовали средние формы волны по количеству пиков, ширине волны, полярности и расстоянию между пиками и впадинами. В черной субстанции сетчатой (SNr) мы идентифицировали 69 предполагаемых нейрональных кластеров из 27 микроэлектродных записей SNr (среднее ± стандартная ошибка среднего (SEM) кластеров на запись: 2,6 ± 0,11). Единицы с частотой импульсации менее или равной 15 Гц и шириной волны более 0,8 мс с двухфазной формой мы маркировали как предполагаемые дофаминергические (DA) единицы. Если биполярная форма волны единицы имела отрицательное отклонение с последующим положительным отклонением (а не обратную полярность), то такая единица считалась предполагаемой DA-единицей с вероятным разворотом ориентации относительно положения электрода. В общей сложности 40 из 69 предполагаемых единиц были помечены как предполагаемые DA-единицы (среднее ± SEM предполагаемых DA-единиц на запись: 1,5 ± 0,18) (Рис. 3A). Формы волны для всех 40 предполагаемых DA-единиц и средняя форма волны для этих единиц представлены на Рис. 3B. Строго в целях визуализации на Рис. 3B формы волны предполагаемых DA-единиц с обратной полярностью отражались относительно оси x (то есть микровольты умножались на –1 в каждой временной точке) для коррекции перевернутой ориентации относительно кончика электрода. Непрерывные частоты импульсации для каждой единицы были нормированы (z-score) по всей записи для каждой единицы с использованием среднего значения и стандартного отклонения активности единицы за всю сессию. Эти z-нормированные непрерывные частоты импульсации затем извлекались вокруг интересующих событий (то есть раскрытие разделения, оценка настроения и т. д.) для последующих популяционных анализов.&lt;/p&gt;\n&lt;p&gt;Чтобы проверить, может ли активность этих предполагаемых DA-нейронов кодировать свойства ошибок нормализованного предсказания (nPE), мы сначала сравнили частоты импульсации этих единиц в течение 1000 мс после раскрытия разделения в испытаниях, в которых nPE были положительными, по сравнению с теми, в которых они были отрицательными. Активность предполагаемых DA-единиц на уровне группы казалась выше во время испытаний с положительными nPE по сравнению с испытаниями с отрицательными nPE в условиях человека (функции плотности вероятности см. на Рис. 3E); этот паттерн был сглажен в условиях компьютера (функции плотности вероятности см. на Рис. 3F). Чтобы проверить статистическую значимость этого наблюдения, а также проверить, кодируют ли эти единицы величину nPE, мы внедрили модель со смешанными эффектами для прогнозирования активности этих единиц в течение 1000 мс после раскрытия разделения по валентности nPE (1 = отрицательная, 2 = положительная), величине и их взаимодействиям со случайным эффектом для единицы в каждом условии. Валентность рассматривалась как фактор. Все модели со смешанными эффектами были реализованы с использованием пакетов «lme4» и «lmerTest» в RStudio. Модель со смешанными эффектами для условий с человеком показала значимый эффект для валентности (валентность nPE, p = 0,008, β ± SEM = 0,19 ± 7,3e-02, 95% ДИ [0,05, 0,34]; Рис. 3G; см. Таблицу 2 для других оценок). Валентность не была значимым предиктором частоты импульсации в условиях компьютера (валентность PE, p = 0,79, β ± SEM = -0,02 ± 7,7e-02, 95% ДИ [-0,17, 0,13]; Рис. 3H; см. Таблицу 2 для других оценок).&lt;/p&gt;\n&lt;p&gt;Чтобы формально проверить, как эффект валентности nPE различается в разных условиях, мы построили модель со смешанными эффектами, в которой фиксированными эффектами выступали величина nPE, валентность nPE, условие (человек или компьютер) и их соответствующие члены взаимодействия, а случайным эффектом — нейрон (unit), предсказывавшие групповую активность предполагаемых дофаминергических нейронов SNr в течение 1000 мс после раскрытия разделения (split reveal) для всех объединенных данных SNr (Таблица S9). Эта модель показала, что средняя частота импульсации предполагаемых дофаминергических нейронов SNr достоверно предсказывалась не только валентностью nPE (валентность nPE, p = 0.0057, β ± SEM = 0.20 ± 7.3e-02, 95% ДИ [0.06, 0.34]), но и взаимодействием между валентностью nPE и условием (валентность npe × условие, p = 0.036, β ± SEM = -0.22 ± 0.11, 95% ДИ [-0.43, -0.01]), причем кодирование валентности nPE частотой импульсации было значительно сильнее в условиях взаимодействия с человеком, чем в условиях с компьютером. В совокупности эти результаты демонстрируют, что предполагаемые дофаминергические нейроны SNr могут быть чувствительны к валентности nPE, особенно в более социальных контекстах.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Смешанные линейные модели позволяют одновременно учесть общие закономерности для всей группы и индивидуальные различия отдельных нейронов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтобы учесть потенциальную роль размера предложения в наблюдаемом нейронном ответе на валентность nPE, мы построили линейную модель со смешанными эффектами, предсказывающую активность предполагаемых дофаминергических нейронов SNr при раскрытии разделения в условиях с человеком на основе фиксированных эффектов размера предложения и валентности nPE со случайным эффектом для нейрона. Этот анализ показал, что валентность nPE оставалась значимым предиктором частоты импульсации при раскрытии разделения даже после контроля размера предложения (валентность nPE, p = 0.022, β ± SEM = 0.12 ± 5.1e-02, 95% ДИ [0.02, 0.21]), в то время как размер предложения не был значимым предиктором (предложение, p = 0.45, β ± SEM = -3.6e-03 ± 4.7e-03, 95% ДИ [-0.01, 0.01]). Мы повторили этот анализ, рассматривая предложение как категориальную переменную. Опять же, валентность nPE оказалась единственным значимым предиктором частоты импульсации (валентность nPE, p = 0.030, β ± SEM = 0.11 ± 5.1e-02, 95% ДИ [0.01, 0.21]) при отсутствии значимого эффекта предложения. Эти данные предполагают, что наблюдаемая импульсация этих предполагаемых дофаминергических нейронов больше соответствует кодированию того, является ли предложение лучше или хуже внутреннего нормативного ожидания участника, чем одному лишь размеру предложения.&lt;/p&gt;\n&lt;p&gt;Наконец, мы исследовали, как активность этих предполагаемых дофаминергических нейронов связана с оценками сиюминутного настроения. Сначала мы применили тест корреляции моментов произведения Пирсона между z-преобразованными оценками настроения и частотой импульсации предполагаемых дофаминергических нейронов за 1000 мс до выбора оценки настроения, обнаружив, что частота импульсации и z-преобразованные оценки настроения коррелировали незначимо (p = 0.16, r = -0.09, 95% ДИ -0.21, -0.03) (Рис. S10). Затем мы применили модель со смешанными эффектами для предсказания групповой активности предполагаемых дофаминергических нейронов в эту эпоху по z-преобразованной оценке настроения со случайным эффектом для нейрона, что подтвердило отсутствие значимого влияния оценки настроения на нейронную активность (оценка настроения, p = 0.16, β ± SEM = -0.027 ± 0.019). Эти результаты предполагают, что активность данных предполагаемых дофаминергических нейронов реагирует исключительно на валентность nPE, но не на оценки настроения.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" fon
