            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"272\" cy=\"81\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"528\" cy=\"250\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как отдельные нейроны мозга&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;реагируют на правила общения&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l-f1.jpg\" alt=\"Рисунок 1. Экспериментальная структура. (A) Интраоперационное нацеливание микроэлектрода на черную субстанцию, сетчатую \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Экспериментальная структура. (A) Интраоперационное нацеливание микроэлектрода на черную субстанцию, сетчатую часть (SNr). Микроэлектроды располагались вентральне клинической мишени — субталамического ядра (STN) — для установки в целевую область регистрации — SNr. Положение микроэлектрода и относительное анатомическое расположение областей мозга по ходу его траектории определялись в реальном времени с помощью хирургического картирования, визуализации нейронных спайков и прослушивания нейронной импульсации с использованием электрофизиологической записывающей системы Alpha Omega, так что каждую область можно было идентифицировать по ее уникальной сигнатуре нервной активности. (B) Игра «Ультиматум». Участники играли в одну из двух версий игры «Ультиматум». В одной версии партнеры-аватары людей неоднократно предъявляли участникам предлагаемые варианты раздела 20 долларов, которые участники принимали или отклоняли. Если участник принимал предложение, каждая сторона получала предложенную долю. Если участник отклонял предложение, каждая сторона ничего не получала. Каждое предложение представлялось новым партнером. Все предложения составляли менее 9 долларов. Вторая версия игры «Ультиматум» включает не только блок с людьми, но и блок испытаний с «компьютерными» партнерами, а также оценку настроения после случайных 33% испытаний с выбором. Срез мозга и иконка компьютера созданы в BioRender. Neal, A. (2027) https://BioRender.com/bpwujj1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Люди постоянно подстраиваются под негласные правила поведения в обществе, но долгое время оставалось загадкой, как мозг кодирует эти сигналы на уровне отдельных клеток. Исследователи записали электрическую активность глубоких структур мозга у пациентов во время игры в ультиматум. Выяснилось, что нейроны черной субстанции отслеживают ошибки социального прогнозирования. При этом реакция клеток оказалась значительно сильнее, когда участники общались с живыми людьми, а не с компьютерными алгоритмами.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Нейроны черной субстанции кодируют ошибки социальных прогнозов.&lt;/li&gt;\n&lt;li&gt;Реакция клеток усиливается при взаимодействии с реальными людьми.&lt;/li&gt;\n&lt;li&gt;В бледном шаре аналогичных изменений активности не обнаружено.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;В эксперименте приняли участие 19 пациентов с болезнью Паркинсона (16 мужчин и 3 женщины, средний возраст 65 лет), которым проводили нейрохирургическую операцию по установке электродов для глубокой стимуляции мозга (DBS). Во время процедуры исследователи записывали активность отдельных нейронов с помощью микроэлектродов, задействуя черную субстанцию ретикулярную (SNr) и бледный шар внутренний (GPi). Участники играли в итеративную версию игры в ультиматум, где нужно было принимать или отвергать денежные предложения от виртуальных партнеров — людей или компьютеров.&lt;/p&gt;\n&lt;p&gt;Поведение испытанных оценивалось с помощью вычислительного моделирования, которое позволило рассчитать ошибки предсказания норм (nPEs) на каждом шаге игры. Эти ошибки отражают разницу между ожидаемой справедливостью и реальным предложением партнера. Анализ показал, что предполагаемые дофаминергические нейроны SNr кодируют валентность ошибок предсказания норм. Сигнал был заметно ярче, если соперником выступал живой человек, в то время как аналогичный контроль в бледном шаре не выявил значимых эффектов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Выборка ограничена пациентами с болезнью Паркинсона, перенесшими нейрохирургическую операцию, что сужает применимость выводов на здоровых людей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Люди замечательно адаптируются к меняющимся нормам, однако нам мало известно о том, как человеческий мозг кодирует эти социальные сигналы на уровне отдельных нейронов. В настоящей работе мы регистрировали активность отдельных нейронов в черной субстанции и бледном шаре у нейрохирургических пациентов во время их участия в итеративной игре «ультиматум» против человеческого и компьютерного аватаров. Используя вычислительное моделирование поведения, мы обнаружили, что предполагаемые дофаминергические единицы в черной субстанции отслеживали валентность ошибок предсказания норм, причем кодирование было более выраженным во время игры с человеческими аватарами по сравнению с компьютерными. Аналогичный анализ в бледном шаре, ядре, прилегающем к черной субстанции, не выявил значимого эффекта. Наши результаты определяют новую роль черной субстанции в кодировании сигналов социального обучения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нейроны черной субстанции кодируют ошибки предсказания социальных норм при взаимодействии с людьми, но не с компьютером.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Важным навыком в рамках социального функционирования является способность учиться и адаптироваться к меняющимся социальным нормам или правилам поведения среди социальных групп. В то время как вычислительное моделирование поведения продвинуло наше понимание того, как люди усваивают социальные нормы, мало что известно о том, какие нейронные механизмы поддерживают этот процесс. Здесь мы используем вычислительное моделирование поведения в сочетании с внутричерепной регистрацией у людей для исследования того, как человеческий мозг кодирует сигналы обучения нормам на уровне отдельных нейронов. Мы регистрировали активность отдельных нейронов в черной субстанции сетчатой части (SNr) и внутреннем сегменте бледного шара (GPi) у нейрохирургических участников, когда они играли в игру с социальным обменом с человеческими и компьютерными аватарами. Мы оценивали ошибки предсказания норм (nPEs) от испытания к испытанию, или мысленно вычисляемые ошибки в социальном предсказании, и показали, что предполагаемые дофаминергические нейроны SNr кодировали валентность nPEs, причем более сильное кодирование наблюдалось во время игры с партнерами-человеческими аватарами по сравнению с компьютерными. Этот результат не наблюдался в GPi. В совокупности наши результаты расширяют существующие знания о SNr, выявляя новую роль нейронов SNr в обучении социальным нормам.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Внутричерепная регистрация — это метод прямой записи электрической активности мозга с помощью электродов, имплантированных в ткани мозга в медицинских целях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Люди по своей природе являются социальными существами. Одним из ключевых направлений исследований социальной природы человеческого поведения является изучение нашего восприятия социальных норм и реагирования на них, которые определяются как культурно принятые правила или паттерны поведения в социальных группах. В более ранних работах нормы концептуализировались как относительно стабильные социальные перцепции. Однако в последнее время вычислительное моделирование поведения начало прояснять динамический и гибкий характер восприятия норм человеком, демонстрируя, что люди способны адаптироваться к меняющейся социальной среде на основе ошибок предсказания норм (nPE), определяемых как разница между социальным сигналом или предложением и внутренним ожиданием человека. Данные нейровизуализации и исследований пациентов с поражениями мозга показали роль передней инсулы и вентрального стриатума в отслеживании nPE. Тем не менее, из-за определенных ограничений этих методов (например, низкого пространственно-временного разрешения), вопрос о том, как глубокие ядра мезолимбической системы, такие как черная субстанция (SN), могут быть вовлечены в адаптацию к нормам, остается до конца неизученным.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Участие глубоких ядер мезолимбической системы в адаптации к социальным нормам оставалось неясным из-за ограничений традиционных методов нейровизуализации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ошибки предсказания норм (nPE) — это разница между тем, какого социального поведения вы ожидали, и тем, что произошло на самом деле; они помогают нашему мозгу адаптироваться к меняющимся правилам общения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Данные о роли черной субстанции в поведении во многом опираются на модели на животных или инвазивные методы у пациентов с нейродегенеративными заболеваниями, что требует осторожности при экстраполяции на здоровых людей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Большая часть того, что нам известно о функции SN, была установлена в ходе исследований на животных. Например, хорошо за документировано, что дофаминергические (DA) проекции из SN играют ключевую роль в обучении с подкреплением на основе вознаграждения. В то время как прямое изучение SN человека и более широкой системы DA представляет большую сложность при использовании стандартных неинвазивных методов, таких как BOLD фМРТ, в недавних исследованиях применялись методы инвазивной регистрации (т.е. регистрация активности одиночных нейронов) для характеристики роли SN в обучении с подкреплением. Следует отметить, что SN состоит из компактной части черной субстанции (SNc), которая содержит преимущественно DA-нейроны с меньшим количеством гамкергических нейронов, и сетчатой части черной субстанции (SNr), содержащей преимущественно гамкергические нейроны со сравнительно меньшим количеством DA-нейронов. Учитывая, что популяции DA- и гамкергических нейронов не имеют четкого разделения по анатомическим ориентирам в SN, исследования одиночных нейронов человека часто изолируют предполагаемую активность DA-нейронов на основе характеристик форм волн DA, регистрируемых микроэлектродами, без точного указания участков регистрации как SNr или SNc. Поступая таким образом, такие работы продемонстрировали, что предполагаемые DA-нейроны в SN человека (возможно, в SNr и/или SNc) демонстрируют повышенную частоту импульсации в ответ на неожиданные финансовые выигрыши по сравнению с неожиданными проигрышами. И наоборот, фазовая микростимуляция этих клеток ингибирует обучение. Эти результаты согласуются с литературой, связывающей SN с обучением на основе вознаграждения, а DA-нейроны — с кодированием ошибки предсказания вознаграждения. Помимо этой центральной роли в обучении с вознаграждением, было также показано, что активность DA важна для социального поведения как в исследованиях на людях, так и на грызунах. Фармакологические исследования на людях показали, что активность DA модулирует альтруизм и эгалитарное поведение. Исследования на грызунах показали, что активность DA кодирует информацию о незнакомых сородичах, что сродни ошибке социального предсказания. И наоборот, дисфункция DA приводит к поведенческой негибкости, повышенной реактивности и агрессии. В одном недавнем исследовании использовалась вольтамперометрия с быстрой сканирующей цикличностью у людей во время игры в ультиматум с целью непосредственного изучения роли DA в социальном поведении, в частности в SNr. Это исследование показало, что внеклеточные концентрации дофамина в SNr отслеживают разницу между предыдущими и текущими предложениями, причем более высокие общие концентрации дофамина наблюдаются, когда испытуемые играют с человеческими, а не с компьютерными аватарами. Тем не менее, роль отдельных нейронов SN в социальном поведении человека остается неизвестной. В более общем плане было бы ценно официально сопоставить совокупность работ, демонстрирующих роль системы DA в обучении на основе вознаграждения, с работами, демонстрирующими ее роль в социальном поведении на уровне отдельного нейрона.&lt;/p&gt;\n&lt;p&gt;Здесь мы используем вычислительное моделирование поведения и регистрацию активности одиночных нейронов человека, чтобы определить вычислительную роль нейронов SNr в поведении, связанном с социальными нормами. Участники, перенесшие операцию по имплантации устройств глубокой стимуляции мозга (DBS) по поводу болезни Паркинсона (PD), прошли процедуру регистрации активности одиночных нейронов из SNr или внутреннего сегмента бледного шара (GPi) во время игры в итеративный ультиматум (UG) — поведенческую парадигму, которая ранее использовалась для изучения реакции на справедливость, а также адаптации к нормам. В целом участники принимали или отвергали вариативные предложения от людей или компьютерных партнеров. Как описывалось ранее, участники часто отвергали невыгодные предложения, но со временем могли адаптироваться к предложениям контрагентов (т.е. к социальной норме). Вычислительное моделирование поведения показало, что участники ожидали более щедрых предложений при игре с людьми по сравнению с компьютерными партнерами, что говорит о зависимости ожиданий справедливости от идентичности социального партнера. Важно отметить, что валентность nPE, которая сигнализирует о направлении отклонений между ожидаемыми и полученными предложениями, кодировалась в активности предполагаемых DA-нейронов SNr, причем кодирование было более выраженным во время игры с человеческими аватарами по сравнению с компьютерными. Аналогичный контрольный эксперимент в GPi не выявил значимого влияния валентности nPE на частоту импульсации. Эти результаты демонстрируют, что сигналы обучения нормам управляют активностью SNr во время социальных взаимодействий и обеспечивают нейровычислительную характеристику этой активности на уровне отдельного нейрона.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"eksperimentalnaya-shema\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#eksperimentalnaya-shema\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Экспериментальная схема&lt;/span&gt;&lt;/a&gt;Экспериментальная схема&lt;/h4&gt;\n&lt;p&gt;Мы собрали 27 сеансов регистрации активности одиночных нейронов из SNr у 19 участников с болезнью Паркинсона (16 мужчин, 3 женщины, возраст 65 ± 1.93 года [среднее ± стандартная ошибка среднего, SEM], Таблица S1), которым была проведена операция по имплантации электродов для глубокой стимуляции мозга (DBS) в субталамическое ядро (STN) (Рис. 1A). Во время регистрации активности одиночных нейронов участники играли в итеративную версию игрыльтиматум (UG), в которой предложения динамически изменялись со временем. На каждом испытании участникам предъявлялся предлагаемый вариант разделения суммы в $20 от вымышленного «человеческого» или «компьютерного» партнера, который они могли принять или отклонить (Рис. 1B). Если участник принимал предложение, каждая сторона получала предложенную долю. Если участник отклонял предложение, ни одна из сторон не получала вознаграждения. Предложения были псевдослучайными и распределенными нормально, варьируя от 1 до 9 со средним размером предложения $5. Эта игра также включала самооценку настроения после случайных 33% испытаний в каждом блоке. Перед поведенческим анализом сеансы с невыраженным, монотонным поведением были исключены в целях защиты качества данных от невнимательности, сонливости или слабого понимания инструкций. Монотонными сеансами считались те, в которых принималось или отклонялось менее 2 предложений за весь человеческий или компьютерный блок, а также те, в которых логистическая аппроксимация выбора в зависимости от размера предложения имела неположительный наклон. В когорте SNr было исключено 3 блока с человеческим аватаром и 3 сеанса с компьютерным аватаром. Более подробную информацию см. в разделе «Материалы и методы».&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l-f1.jpg\" alt=\"Рисунок 1. Экспериментальная структура. (A) Интраоперационное нацеливание микроэлектрода на черную субстанцию, сетчатую \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Экспериментальная структура. (A) Интраоперационное нацеливание микроэлектрода на черную субстанцию, сетчатую часть (SNr). Микроэлектроды располагались вентральне клинической мишени — субталамического ядра (STN) — для установки в целевую область регистрации — SNr. Положение микроэлектрода и относительное анатомическое расположение областей мозга по ходу его траектории определялись в реальном времени с помощью хирургического картирования, визуализации нейронных спайков и прослушивания нейронной импульсации с использованием электрофизиологической записывающей системы Alpha Omega, так что каждую область можно было идентифицировать по ее уникальной сигнатуре нервной активности. (B) Игра «Ультиматум». Участники играли в одну из двух версий игры «Ультиматум». В одной версии партнеры-аватары людей неоднократно предъявляли участникам предлагаемые варианты раздела 20 долларов, которые участники принимали или отклоняли. Если участник принимал предложение, каждая сторона получала предложенную долю. Если участник отклонял предложение, каждая сторона ничего не получала. Каждое предложение представлялось новым партнером. Все предложения составляли менее 9 долларов. Вторая версия игры «Ультиматум» включает не только блок с людьми, но и блок испытаний с «компьютерными» партнерами, а также оценку настроения после случайных 33% испытаний с выбором. Срез мозга и иконка компьютера созданы в BioRender. Neal, A. (2027) https://BioRender.com/bpwujj1&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Глубокая стимуляция мозга (DBS) — хирургический метод лечения неврологических расстройств, при котором в определенные структуры мозга имплантируются электроды, подающие электрические импульсы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"povedenie-v-igre-ultimatum\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#povedenie-v-igre-ultimatum\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поведение в игре ультиматум&lt;/span&gt;&lt;/a&gt;Поведение в игре ультиматум&lt;/h4&gt;\n&lt;p&gt;Предыдущие работы показали, что здоровые люди с большей вероятностью отвергают несправедливые предложения, особенно от партнеров-людей. Поэтому мы сначала попытались изучить, как выбор наших участников различается в зависимости от справедливости предложений и контекста принятия решений (условия взаимодействия с человеком против компьютера), запустив модель с со смешанными эффектами. В этой модели бинарные варианты выбора (отклонение = 0, принятие = 1) предсказывались размером предложения (то есть 1, 2 и т. д.), условием (человек = 1, компьютер = 2) и взаимодействием между этими факторами, со случайными эффектами для участника и для сеанса внутри участника. Только влияние размера предложения существенно сказывалось на выборе (предложение, ***p = 8.2e-31, β ± SE = -0.85 ± 0.071; отношение шансов [OR] = 0.43, 95% доверительный интервал [CI] [0.37, 0.49]; условие, p = 0.15, β ± SE = -0.93 ± 0.65, OR = 0.40, 95% CI [0.11, 1.41]; предложение × условие, p = 0.21, β ± SE = 0.14 ± 0.12, OR = 1.15, 95% CI [0.92, 1.45]), что указывает на уменьшение частоты отклонений участниками по мере увеличения размера предложения во всех условиях (Рис. 2A). Модель со смешанными эффектами, предсказывающая общую частоту отклонений по условиям с теми же случайными эффектами, продемонстрировала, что общая разница в частоте отклонений между условиями была незначимой (условие, p = 0.46, β ± SEM = -0.14 ± 0.18; OR = 0.87, 95% CI [0.61, 1.25]) (Рис. 2B).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l-f2.jpg\" alt=\"Рисунок 2. Поведение в игре «Ультиматум». (A) Частота отклонений в зависимости от размера предложения и (B) общая частот\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Рисунок 2. Поведение в игре «Ультиматум». (A) Частота отклонений в зависимости от размера предложения и (B) общая частота отклонений в условиях с компьютером (синий) и человеком (оранжевый). (C) Оценка настроения (z-стандартизированная) в зависимости от выбора (принять/отклонить) в условиях человека и компьютера. (D) Сравнение моделей адаптации норм по общему критерию Байеса (BIC) для всех сессий и участников. Модель с наименьшим общим значением BIC имеет наилучшее качество подгонки (зеленый). (E) Внутренняя норма по испытаниям в условиях компьютера и человека. Внутренние нормы рассчитывались с использованием модели адаптации норм, показавшей наилучшие результаты. (F) Ошибка предсказания нормы (z-стандартизированная) в зависимости от оценки настроения (z-стандартизированной) для всех сессий и участников. Столбцы, точки и линии представляют среднее значение. Погрешности представляют стандартную ошибку среднего. **p &amp;lt; 0.01; **&lt;em&gt;p &amp;lt; 0.001 по двусторонним тестам суммы рангов Уилкоксона (C), общей линейной регрессии (E) и тесту моментной корреляции Пирсона (F). n = 21 блок игрового процесса с человеческими аватарами и 8 блоков игрового процесса с компьютерным аватар для (A), (B), (D) и (E). n = 6 блоков игрового процесса с человеческими аватарами и 5 блоков игрового процесса с компьютерным аватаром для (C) и (F).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Аналогичные модели со смешанными эффектами показали, что общая скорость реакции (условие, p = 0.29, β ± SEM = 0.43 ± 0.41; OR = 1.53, 95% CI [0.69, 3.41]; Рис. S1A) и оценки настроения (условие, p = 0.68, β ± SEM = 1.00 ± 2.41; OR = 2.72, 95% CI [0.023, 320.83]; Рис. S1B) существенно не различались между условиями. Тем не менее, модель со смешанными эффектами, предсказывающая стандартизированные (z-преобразованные) оценки настроения по непосредственно предшествующему выбору, условию и взаимодействию этих факторов со случайными эффектами участника и сеанса, продемонстрировала, что z-оценки настроения были выше после принятых испытаний по сравнению с отклоненными как в условиях с человеком, так и с компьютером (выбор, *p = 0.024, β ± SEM = 0.50 ± 0.22; OR = 1.64, 95% CI [1.07, 2.53]; условие, p = 0.81, β ± SEM = -0.049 ± 0.20; OR = 0.95, 95% CI [0.64, 1.41]; условие × выбор, p = 0.63, β ± SEM = 0.15 ± 0.31; OR = 1.16, 95% CI [0.62, 2.17]) (Рис. 2C).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Частота отклонения предложений снижалась по мере роста их размера (p = 8.2e-31), а настроение участников было значительно выше после принятия предложений (p = 0.024), причем тип партнера (человек или компьютер) не оказывал существенного влияния на поведение.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В совокупности эти результаты показывают, что участники испытывали отвращение к низким предложениям и переживали негативные кратковременные состояния настроения после отклонения предложений. Эти данные свидетельствуют о том, что, несмотря на наличие болезни Паркинсона и даже при отсутствии реального денежного стимулирования, наши участники вели себя в основном так же, как описывается в предыдущих результатах исследований игры в ультиматум у здоровых людей более молодого возраста.&lt;/p&gt;\n&lt;h4 id=\"modelirovanie-adaptacii-norm\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#modelirovanie-adaptacii-norm\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Моделирование адаптации норм&lt;/span&gt;&lt;/a&gt;Моделирование адаптации норм&lt;/h4&gt;\n&lt;p&gt;Далее мы провели вычислительное моделирование поведения, чтобы охарактеризовать поведение при отклонении предложений и вычислительную динамику, лежащую в основе обновления субъективных норм. Все детали моделирования приведены в разделе «Материалы и методы». Кратко: подобно нашей предыдущей работе, мы сконструировали субъективную полезность U(t) на каждой попытке как разницу между полученным предложением и чувствительностью индивида к нарушению нормы. В модели f представляет внутреннюю норму индивида, а альфа (α ∈ [0,1]) представляет чувствительность участника к нарушению нормы (т.е. воспринимаемую разницу между внутренней нормой и полученным предложением), при этом более высокие значения α отражают большую неприязнь к несправедливости. Субъективная полезность U(t) связана с вероятностью выбора через функцию softmax. Мы сравнили три класса моделей, которые различались по своим предположениям о том, как обновляются внутренние нормы: модели Рескорлы-Вагнера (RW), в которых нормы обновляются с использованием обучения на основе временных различий; байесовские модели (Bayes), в которых нормы обновляются согласно правилу Байеса; и модели неприятия неравенства Фера-Шмидта (FS), в которых нормы не обновляются. Внутри каждого класса индивидуальные модели различались по предположениям о начальной внутренней норме (f0), которая могла быть зафиксирована на уровне $10 (фиксированная f0, соответствующая равному разделу) или быть переменной начальной нормой ожидания, индивидуально подобранной под поведение каждого участника (переменная f0). Иными словами, если один игрок начинает сессию с ожиданием справедливости для начального предложения в 9, а другой — с ожиданием в 11, то модель с переменной f0 должна уловить каждое из этих начальных ожиданий при подгонке модели. Таким образом, в моделях с переменной f0 параметр f0 был свободным. Дополнительно мы рассмотрели модели с переменной f0, в которых чувствительность к несправедливости α была зафиксирована на уровне средней групповой α (фиксированная α); средняя групповая α была получена путем усреднения оценок α, изначально подобранных как свободные параметры. Всего мы рассмотрели 9 моделей (3 модели × 3 спецификации начальной внутренней нормы/альфы). Для моделей с переменной f0 параметры f0 и α были свободными. Для моделей с фиксированной f0 параметр α был свободным, а f0 — фиксированным. Наконец, для моделей с фиксированной α параметр f0 был свободным, а α — фиксированным.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Моделирование показало, что поведение участников лучше всего описывается моделью неприятия неравенства Фера-Шмидта (FS) с фиксированной чувствительностью (α), за которой следует модель Рескорлы-Вагнера (RW) с фиксированной α.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;После подгонки моделей к поведенческим данным каждого участника мы сравнили качество подгонки, изучив результирующий минимальный байесовский информационный критерий (BIC) как на индивидуальном уровне (Таблица SN, Набор данных SN), так и на групповом уровне (Рис. 2D). Модель FS: фиксированная α показала наилучшее соответствие, за ней следовала модель RW: фиксированная α (Рис. 2D).&lt;/p&gt;\n&lt;p&gt;Кроме того, чтобы выяснить, может ли поведение определяться классической ошибкой предсказания вознаграждения (RPE), мы сравнили все 9 моделей с подходом Q-обучения, аналогично предыдущим работам. Классический алгоритм Q-обучения изучает оптимальную функцию ценности действия в среде без какой-либо априорной модели динамики этой среды. Он делает это путем обновления оценок ценности выполнения действия в данном состоянии (т.е. Q-значения) на основе полученного вознаграждения и оценочной ценности следующего состояния. Этот метод корректирует Q-значения инкрементально, движимый RPE. Обновления, направляемые RPE, производятся со скоростью обучения от 0 до 1 после получения вознаграждения и до того, как будет предложено следующее предложение. Таким образом, в то время как nPE описывает, насколько выше или ниже предложение относительно модельной нормы справедливости индивида, RPE представляет собой разницу между полученным результатом и ожиданием, основанным на предыдущих событиях. Мы сравнили качество подгонки всех 9 моделей с подходом Q-обучения по минимальному общему баллу BIC. (См. Набор данных SN и Таблицу SN для всех оценок параметров, а также распределений параметра зависти для каждого участника и каждой модели). Сравнение моделей показало, что подход Q-обучения работал хуже, чем все 9 моделей, при этом модели FS: фиксированная α и RW: фиксированная α снова показали наилучшее соответствие (Рис. SN; см. Набор данных SN для индивидуальных баллов BIC). Более того, эти результаты согласуются как внутри, так и между условиями с человеком и компьютером (Рис. SN). Эти результаты позволяют предположить, что поведение в нашей задаче мотивировано не классическим Q-обучением, а скорее статическими предпочтениями, основанными на социальных переменных, как в модели FS: фиксированная α, или основанным на модели включением социальной информации в ожидания норм с течением времени, как в модели RW: фиксированная α.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Q-обучение — метод обучения с подкреплением, где агент учится выбирать действия, максимизирующие будущую награду, основываясь на ошибках предсказания (RPE), а не на социальных нормах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Далее, чтобы облегчить оценку доказательной силы каждой из двух моделей с наилучшей подгонкой, мы оценили ΔBIC, ожидаемую частоту моделей и защищенные вероятности превышения (Таблица SN). Эти анализы продемонстрировали, что модель FS: фиксированная α имела самый низкий BIC с ожидаемой частотой модели 0,435 и защищенной вероятностью превышения 0,932. Модель RW: фиксированная α имела ΔBIC 13,707, ожидаемую частоту модели 0,174 и защищенную вероятность превышения 0,043. Таким образом, хотя в целом имеются более веские доказательства в поддержку модели FS: фиксированная α, также существуют свидетельства некоторой гетерогенности в наилучшем соответствии между двумя моделями-кандидатами, что согласуется с тем фактом, что средние баллы BIC были сопоставимы и составляли 10,45 и 10,93 для моделей FS: фиксированная α и RW: фиксированная α соответственно.&lt;/p&gt;\n&lt;p&gt;Затем мы продолжили оценку этих двух моделей, исследуя степень идентифицируемости каждой из них с помощью восстановления моделей (Рис. S3; Таблица S4). Анализ восстановления моделей продемонстрировал вероятность восстановления 45.47% для модели RW: fixed alpha и 37.62% для модели FS: fixed alpha, что указывает на то, что хотя эти модели показали сопоставимо хорошие результаты по наилучшему соответствию, модель RW: fixed alpha продемонстрировала более высокую идентифицируемость. Дополнительное восстановление на уровне классов (модели FS, модели RW, модели Байеса, Q-обучение), выполненное путем усреднения вероятностей восстановления по моделям внутри каждого класса, дополнительно подтвердило, что поведенческие прогнозы, генерируемые этими классами вычислительных моделей, различимы (Таблица S5; Рис. S4). Таким образом, из двух моделей с наилучшим соответствием модель RW: fixed α продемонстрировала наилучшую идентифицируемость при восстановлении моделей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель RW: fixed α показала наилучшую идентифицируемость при восстановлении и успешно воспроизвела паттерны поведения испытуемых как на уровне групп, так и на индивидуальном уровне.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Затем мы исследовали, воспроизводит ли модель RW: fixed α паттерны выбора, наблюдавшиеся в нашем исследовании, проведя как восстановление параметров, так и апостериорные прогнозные проверки. Истинные (Таблица 1) и смоделированные значения параметров были существенно коррелированы в этой модели (Рис. S5), что указывает на хорошую восстанавливаемость параметров. Более того, модель RW: fixed α воспроизвела общие показатели отклонения как в условиях с человеческим (среднее ± SEM: наблюдаемое: 0.662 ± 0.042; смоделированное: 0.652 ± 0.045), так и с компьютерным (наблюдаемое: 0.542 ± 0.050; смоделированное: 0.500 ± 0.065) аватаром (Рис. S6A). Модель RW: fixed α также воспроизвела негативное влияние размера предложения на частоту отклонений (Рис. S6B). Наконец, чтобы оценить, воспроизводит ли модель RW: fixed α поведение на уровне отдельных испытуемых, индивидуальные показатели отклонения для наблюдаемых и смоделированных сессий также были сопоставлены, выявив сильную линейную корреляцию (Рис. S6C; моментно-производная корреляция Пирсона, ***p = 4.55e-12, r = 0.914, 95% ДИ 0.823 - 0.959).&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 1.&lt;/strong&gt; Оценки эмпирических параметров.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Условие&lt;/th&gt;\n&lt;th&gt;Температура (n.s.)&lt;/th&gt;\n&lt;th&gt;Начальная норма (*)&lt;/th&gt;\n&lt;th&gt;Скорость адаптации нормы (n.s.)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Человек&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;4.31 ± 1.43&lt;/td&gt;\n&lt;td&gt;14.96 ± 0.86&lt;/td&gt;\n&lt;td&gt;0.02 ± 0.01&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Компьютер&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;5.19 ± 3.19&lt;/td&gt;\n&lt;td&gt;10.20 ± 2.54&lt;/td&gt;\n&lt;td&gt;0.08 ± 0.04&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;n.s. - недостоверно, * - p &amp;lt; 0.05&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Совокупность успешного восстановления моделей, восстановления параметров и способности модели RW: fixed α воспроизводить поведенческие паттерны, наблюдаемые в нашем исследовании на групповом и индивидуальном уровнях, предоставляет доказательства того, что эта модель подходит для интерпретации ментальных моделей, управляющих поведением в нашей задаче.&lt;/p&gt;\n&lt;p&gt;Более того, эти результаты показывают, что обучение с подкреплением на основе временных разностей с фиксированной чувствительностью к несправедливости лучше всего объясняет усвоение участниками новой информации в их ожидания нормы с течением времени.&lt;/p&gt;\n&lt;p&gt;Оценки параметров температуры, исходной нормы и скорости адаптации нормы, полученные путем подгонки модели адаптации нормы RW fixed alpha к поведению каждого испытуемого в игре «Ультиматум» (UG). Блоки с человеком и компьютером подгонялись отдельно. Оценки параметров блоков с человеком и компьютером сравнивались с помощью односторонних U-критериев Манна — Уитни (тестов сумм рангов Вилкоксона). Приведенные статистические данные представляют собой среднее значение ± стандартная ошибка среднего. *p &amp;lt; 0.05 и n.s. = незначимо по результатам односторонних тестов сумм рангов Вилкоксона. n = 21 блок игрового процесса с человеческими аватарами и блоки игрового процесса с компьютерным аватаром.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ошибкой предсказания нормы (nPE) называют разницу между реальным предложением и ожиданиями человека; она напрямую влияет на его настроение, подобно финансовым вознаграждениям.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Затем мы изучили значения параметров выигравшей модели RW: fixed α. Мы обнаружили, что как исходные, так и внутренние нормы для всей сессии (f) были выше в условиях с человеком, чем в условиях с компьютером (Рис. 2E; Таблица 1). В частности, общая линейная регрессия, прогнозирующая внутреннюю норму по условию, попытке и взаимодействию между этими членами, выявила значимое влияние только для условия, причем внутренние нормы выше в условиях с человеком (условие, ***p = 8.9e-05, β ± SEM = 2.5 ± 0.64; попытка, p = 0.38, β ± SEM = -0.027 ± 0.030; попытка × условие, p = 0.79, β ± SEM = 0.0097 ± 0.036). Несмотря на отсутствие общего различия в отклонениях между условиями, этот анализ на основе моделей предполагает, что участники имели более высокие ожидания относительно предложений от человеческих аватаров по сравнению с компьютерными.&lt;/p&gt;\n&lt;p&gt;Поскольку было показано, что денежные ошибки предсказания (PE) влияют на сиюминутные ощущения, мы также изучили, может ли это относиться к nPE. Мы рассчитали nPE, взяв разницу между текущим размером предложения и предшествующей внутренней нормой. (Пример оценки nPE на основе поведения при выборе см. на Рис. S7.) Положительные и отрицательные nPE указывают на предложения, которые находятся выше или ниже внутренних норм соответственно. Мы наблюдали значимую положительную корреляцию между nPE и непосредственно следующими за ними оценками настроения (моментно-производная корреляция Пирсона, **p = 0.0012, r = 0.31, 95% ДИ 0.13 - 0.47) (Рис. 2F). Модель со смешанными эффектами, прогнозирующая оценки настроения по nPE и условию со случайным эффектом для сессии, выявила значимый фиксированный эффект только для nPE (nPE, **p = 0.0013, β ± SEM = 0.31 ± 0.09; условие, p = 0.96, β ± SEM = -0.0089 ± 0.18; ОШ = 1.36, 95% ДИ [1.13, 1.63]). Кроме того, чтобы определить, сохраняется ли связь между nPE и настроением после учета выбора, мы построили модель со смешанными эффектами, прогнозирующую стандартизованное (z-score) настроение по стандартизованному nPE и выбору со случайным эффектом для сессии. Связь между nPE и настроением оставалась значимой после включения выбора в качестве фиксированного эффекта (nPE, *p = 0.035, β ± SEM = 0.24 ± 0.11; ОШ = 1.27, 95% ДИ [1.02, 1.59]), в то время как выбор не оказывал значимого влияния на настроение (выбор, p = 0.32, β ± SEM = 0.23 ± 0.22; ОШ = 1.25, 95% ДИ [0.81, 1.95]). Таким образом, хотя условие не влияло на оценки настроения, nPE влияла на настроение таким образом, что отрицательные nPE снижали оценки настроения, что согласуется с предыдущими работами.&lt;/p&gt;\n&lt;h4 id=\"predpolagaemye-dofaminergicheskie-nejrony-v-snr-kodiruyut-valentnost-oshibki-socialnogo-prognozirovaniya\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#predpolagaemye-dofaminergicheskie-nejrony-v-snr-kodiruyut-valentnost-oshibki-socialnogo-prognozirovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Предполагаемые дофаминергические нейроны в SNr кодируют валентность ошибки социального прогнозирования&lt;/span&gt;&lt;/a&gt;Предполагаемые дофаминергические нейроны в SNr кодируют валентность ошибки социального прогнозирования&lt;/h4&gt;\n&lt;p&gt;Нашей основной целью было изучение вычислительной роли нейронов SNr в адаптации к нормам.&lt;/p&gt;\n&lt;p&gt;В связи с этим мы извлекли и проанализировали активность одиночных импульсов (спайков) из записей микроэлектродов SNr.&lt;/p&gt;\n&lt;p&gt;Мы идентифицировали 69 предполагаемых нейронных кластеров из 27 записей микроэлектродов SNr (среднее ± стандартная ошибка среднего (SEM) кластеров на запись: 2,6 ± 0,11) с использованием алгоритма автономной сортировки OSORT. Кластеры представляют собой группы спайков, которые, согласно алгоритму сортировки, происходят из одного источника (т. е. предполагаемого нейрона). Из этих 69 кластеров мы классифицировали 40 единиц как предполагаемые дофаминергические (ДА) нейроны на основе критериев средней базовой частоты импульсации (≤15 Гц) и морфологии формы волны (длительность &amp;gt;0,8 мс, двухфазная), установленных в предыдущих работах по регистрации активности одиночных нейронов в SN человека (среднее ± SEM предполагаемых ДА-единиц на запись: 1,5 ± 0,18) (Рис. 3A).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l-f3.jpg\" alt=\"Рисунок 3. Предполагаемая активность дофаминергических (ДА) единиц кодирует валентность ошибки социального предсказания.\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Рисунок 3. Предполагаемая активность дофаминергических (ДА) единиц кодирует валентность ошибки социального предсказания. (A) Три примера предполагаемых единиц, выявленных с помощью алгоритма автономной сортировки, и одна предполагаемая ДА единица (светло-фиолетовая), охарактеризованная по средней ширине формы волны &amp;gt;0.8 мс, двухфазной морфологии и частоте импульсации ≤15 Гц. (B) Средняя форма волны (черная) для предполагаемых ДА единиц SNr (серая). Средние сырые частоты импульсации предполагаемых ДА единиц SNr в течение 1000 мс после раскрытия раздела показывают испытания, вызывающие положительные (зеленые, сплошные) и отрицательные (пурпурные, штриховые) ошибки предсказания нормы (nPE) в условиях (C) человека и (D) компьютера. Раскрытие раздела происходит в момент времени 0 мс. Функции плотности вероятности средних частот импульсации предполагаемых ДА единиц SNr в течение 1000 мс после раскрытия раздела для испытаний, вызывающих положительные (зеленые) и отрицательные (пурпурные) ошибки предсказания нормы (nPE) в условиях (C) человека и (F) компьютера. Коэффициенты β для моделей со смешанными эффектами, прогнозирующих среднюю частоту импульсации предполагаемых ДА единиц SNr в течение 1000 мс после раскрытия раздела в условиях (G) человека и (H) компьютера по валентности nPE, величине nPE и членам взаимодействия для этих регрессоров со случайным эффектом для единицы. Ошибки представляют стандартную ошибку среднего. *&lt;em&gt;p &amp;lt; 0.01 по модели со смешанными эффектами. n = 40 предполагаемых ДА нейронов всего для (B). n = 31 предполагаемый ДА нейрон в условиях человека для (C), (E) и (G). n = 16 предполагаемых ДА нейронов в условиях компьютера для (D), (F) и (H).&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мы идентифицировали 40 предполагаемых дофаминергических нейронов в SNr, активность которых анализировалась в контексте ошибок социального прогнозирования (nPE).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Стереотаксические координаты для каждого зарегистрированного предполагаемого ДА-нейрона, специфичные для пациента, приведены в Таблице S6.&lt;/p&gt;\n&lt;p&gt;Ширина форм волны и средняя частота импульсации для всех предполагаемых ДА-нейронов указаны в Таблице S7. Количество предполагаемых ДА-нейронов, зарегистрированных у каждого участника, приведено в Таблице S8. Формы волн для всех 40 предполагаемых ДА-единиц и средняя форма волны для этих единиц представлены на Рис. 3B. Для каждой единицы мы сгладили спайковые последовательности до непрерывных частот импульсации и нормализовали их (z-score), чтобы учесть вариабельность частот между единицами при популяционном анализе (Рис. S9). Затем мы исследовали z-нормализованные частоты импульсации предполагаемых ДА-единиц в поведенчески значимый момент выполнения задачи, а именно во время раскрытия предложения (момент, когда предъявляются варианты выбора).&lt;/p&gt;\n&lt;p&gt;Мы выдвинули гипотезу, что активность предполагаемых ДА-нейронов может кодировать определенные атрибуты nPE, подобно их известной роли в представлении сигналов несоциального обучения. Чтобы проверить это, мы сначала сравнили средние частоты импульсации предполагаемых ДА-единиц в течение 1000 мс после раскрытия предложения для попыток, приводящих к положительным и отрицательным nPE (выше и ниже внутренней нормы соответственно) в условиях взаимодействия с человеком и компьютером. Абсолютные необработанные непрерывные частоты импульсации (до z-нормализации) см. на Рис. 3C-D. Графики плотности вероятности средних z-нормализованных частот импульсации в течение 1000 мс после раскрытия предложения см. на Рис. 3E-F. Мы обнаружили, что в условиях взаимодействия с человеком предполагаемые ДА-единицы транзиторно увеличивали свою спайковую активность при положительных nPE-попытках сильнее, чем при отрицательных (Рис. 3C; Рис. 3E). Это увеличение было ослаблено в условиях взаимодействия с компьютером (Рис. 3D; Рис. 3F). Чтобы проверить значимость наблюдаемого влияния валентности nPE на частоту импульсации, а также изучить, могут ли эти единицы кодировать величину nPE, мы построили модель со смешанными эффектами, предсказывающую активность ДА-единиц в течение 1000 мс после раскрытия предложения на основе валентности nPE (1 = отрицательная, 2 = положительная), величины nPE и взаимодействия между этими членами со случайным эффектом для единицы в каждом условии (Рис. 3G-H; Таблица 2). Фиксированный эффект валентности nPE в условиях взаимодействия с человеком был единственным значимым предиктором частоты импульсации (валентность nPE, **p = 0,008, β ± SEM = 0,19 ± 7,3e-02, 95% ДИ [0,05, 0,34]; Рис. 3G; другие оценки см. в Таблице 2).&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 2.&lt;/strong&gt; Сводка моделей со смешанными эффектами, предсказывающих активность предполагаемых дофаминергических (DA) единиц черной субстанции сетчатой (SNr) при раскрытии.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Фиксированный эффект&lt;/th&gt;\n&lt;th&gt;Оценка&lt;/th&gt;\n&lt;th&gt;Стандартная ошибка&lt;/th&gt;\n&lt;th&gt;t-значение&lt;/th&gt;\n&lt;th&gt;p-значение&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Человек&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Intercept&lt;/td&gt;\n&lt;td&gt;-0.004703&lt;/td&gt;\n&lt;td&gt;0.027146&lt;/td&gt;\n&lt;td&gt;-0.173&lt;/td&gt;\n&lt;td&gt;0.86280&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;nPE magnitude&lt;/td&gt;\n&lt;td&gt;-0.001546&lt;/td&gt;\n&lt;td&gt;0.003287&lt;/td&gt;\n&lt;td&gt;-0.470&lt;/td&gt;\n&lt;td&gt;0.63876&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;nPE valence **&lt;/td&gt;\n&lt;td&gt;0.194946&lt;/td&gt;\n&lt;td&gt;0.073006&lt;/td&gt;\n&lt;td&gt;2.670&lt;/td&gt;\n&lt;td&gt;0.00771&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;nPE magnitude x nPE valence&lt;/td&gt;\n&lt;td&gt;-0.073754&lt;/td&gt;\n&lt;td&gt;0.038881&lt;/td&gt;\n&lt;td&gt;-1.897&lt;/td&gt;\n&lt;td&gt;0.05815&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Компьютер&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Intercept&lt;/td&gt;\n&lt;td&gt;-0.003115&lt;/td&gt;\n&lt;td&gt;0.031721&lt;/td&gt;\n&lt;td&gt;-0.098&lt;/td&gt;\n&lt;td&gt;0.922&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;nPE magnitude&lt;/td&gt;\n&lt;td&gt;-0.002899&lt;/td&gt;\n&lt;td&gt;0.004358&lt;/td&gt;\n&lt;td&gt;-0.665&lt;/td&gt;\n&lt;td&gt;0.508&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;nPE valence&lt;/td&gt;\n&lt;td&gt;-0.020615&lt;/td&gt;\n&lt;td&gt;0.077226&lt;/td&gt;\n&lt;td&gt;-0.267&lt;/td&gt;\n&lt;td&gt;0.790&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;nPE magnitude x nPE valence&lt;/td&gt;\n&lt;td&gt;0.008925&lt;/td&gt;\n&lt;td&gt;0.023744&lt;/td&gt;\n&lt;td&gt;0.376&lt;/td&gt;\n&lt;td&gt;0.707&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;*** p &amp;lt; 0.01*&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;nPE (norm prediction error) — ошибка прогнозирования нормы; показатель того, насколько результат отклоняется от ожиданий участника. Модели со смешанными эффектами позволяют учитывать как общие закономерности (фиксированные эффекты), так и индивидуальные различия (случайные эффекты).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтобы формально проверить, как эффект валентности nPE различается в зависимости от условий, мы построили модель со смешанными эффектами, в которой фиксированные эффекты (величина nPE, валентность nPE, условие (человек или компьютер) и их соответствующие члены взаимодействия) и случайный эффект для единицы предсказывали групповую активность предполагаемых ДА-единиц SNr в течение 1000 мс после раскрытия предложения для всех объединенных данных SNr (Таблица S9). Эта модель показала, что средние частоты импульсации предполагаемых ДА-единиц SNr значимо предсказывались не только валентностью nPE (валентность nPE, **p = 0,0057, β ± SEM = 0,20 ± 7,3e-02, 95% ДИ [0,06, 0,34]), но и взаимодействием между валентностью nPE и условием (валентность nPE x условие, *p = 0,036, β ± SEM = -0,22 ± 0,11, 95% ДИ [-0,43, -0,01]), таким образом, что кодирование валентности nPE частотой импульсации было значимо сильнее в условиях взаимодействия с человеком, чем с компьютером.&lt;/p&gt;\n&lt;p&gt;Наконец, чтобы учесть потенциальную роль размера предложения в наблюдаемом нейронном ответе на валентность nPE, мы построили линейную модель со смешанными эффектами, предсказывающую активность предполагаемых ДА-единиц SNr в момент раскрытия предложения в условиях взаимодействия с человеком на основе фиксированных эффектов размера предложения и валентности nPE со случайным эффектом для единицы. Этот анализ показал, что валентность nPE оставалась значимым предиктором частоты импульсации при раскрытии предложения даже после контроля размера предложения (валентность nPE, *p = 0,022, β ± SEM = 0,12 ± 5,1e-02, 95% ДИ [0,02, 0,21]), тогда как размер предложения не был значимым предиктором (предложение, p = 0,45, β ± SEM = -3,6e-03 ± 4,7e-03, 95% ДИ [-0,01, 0,01]). Мы повторили этот анализ, рассматривая размер предложения как категориальную переменную. И снова валентность nPE была единственным значимым предиктором частоты импульсации (валентность nPE, *p = 0,030, β ± SEM = 0,11 ± 5,1e-02, 95% ДИ [0,01, 0,21]), без значимого эффекта размера предложения. Эти данные свидетельствуют о том, что наблюдаемая активность этих предполагаемых ДА-нейронов более согласуется с кодированием того, является ли предложение лучше или хуже ожиданий участника относительно внутренней нормы, чем только с величиной предложения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на людях с использованием инвазивных микроэлектродов; корреляция между активностью нейронов и валентностью nPE не доказывает прямую причинно-следственную связь в рамках данного эксперимента.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В целом, эти результаты показывают, что предполагаемые ДА-единицы SNr кодируют валентность nPE, причем более выраженное кодирование наблюдается в условиях взаимодействия с человеком, что обеспечивает уникальный нейронный механизм, посредством которого нейроны SNr отслеживают социальную информацию.&lt;/p&gt;\n&lt;p&gt;Сводка моделей со смешанными эффектами, в которых фиксированные эффекты величины ошибки прогнозирования нормы (nPE), валентности nPE и их соответствующие члены взаимодействия предсказывали групповую активность предполагаемых ДА-единиц SNr в течение мс после раскрытия предложения в условиях взаимодействия с человеком или компьютером. **p &amp;lt; 0,01 согласно модели со смешанными эффектами. Std. Error = стандартная ошибка. n = 31 предполагаемый ДА-нейрон в условиях взаимодействия с человеком и 16 предполагаемых ДА-нейронов в условиях взаимодействия с компьютером.&lt;/p&gt;\n&lt;h4 id=\"predpolagaemye-nejrony-v-gpi-ne-kodiruyut-valentnost-oshibki-socialnogo-prognozirovaniya\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#predpolagaemye-nejrony-v-gpi-ne-kodiruyut-valentnost-oshibki-socialnogo-prognozirovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Предполагаемые нейроны в GPi не кодируют валентность ошибки социального прогнозирования&lt;/span&gt;&lt;/a&gt;Предполагаемые нейроны в GPi не кодируют валентность ошибки социального прогнозирования&lt;/h4&gt;\n&lt;p&gt;Возможно, эффект кодирования nPE, наблюдаемый в активности предполагаемых единичных нейронов SNr, отражает широко распространенную активацию в ядрах базальных ганглиев (BG). Чтобы изучить анатомическую специфичность этого эффекта, мы провели аналогичный эксперимент на другой когорте пациентов нейрохирургического профиля, которым проводилась операция DBS в другом ядре BG — GPi (5 мужчин, n = 3 пациента с БП и n = 2 с дистонией, возраст 53 ± 8,5 лет; Рис. SN9A). У этих 5 участников мы собрали 5 сессий UG только с человеческим блоком и сессии UG как с человеческим, так и с компьютерным блоками, а также рейтингами настроения. В этой группе частота отказов снижалась с увеличением размера предложения без значимых различий между условиями (Рис. SN9B). Логистическая регрессионная модель, предсказывающая бинарный выбор на основе размера предложения, выявила значимый эффект (предложение, ***p = 1,9e-14, β ± SEM = 1,3 ± 0,17), что указывает на более высокую вероятность принятия больших предложений по сравнению с меньшими. Для облегчения сравнения с группой регистрации SNr мы оценили nPE для этих сессий, используя выигрышную модель из когорты SNr, а именно модель RW с переменной начальной нормы и фиксированной альфой.&lt;/p&gt;\n&lt;p&gt;Мы идентифицировали 19 предполагаемых единиц из 7 сессий регистрации (среднее ± SEM кластеров на запись: 2,7 ± 0,29). Ширина формы волны и средняя частота импульсации для всех 19 предполагаемых нейронов GPi приведены в Таблице SN10.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анализ 16 нейронов GPi не выявил значимой связи активности с валентностью или величиной nPE, что указывает на отсутствие кодирования ошибки прогнозирования в этой области.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Формы волн для всех 19 предполагаемых единиц GPi и средняя форма волны для этих единиц представлены на Рис. SN9C. Мы сгладили спайковые последовательности в непрерывные частоты импульсации согласно протоколу, реализованному в анализе единиц SNr. Затем мы соотнесли активность предполагаемых единиц GPi в течение 1000 мс после раскрытия разделения (split reveal) с валентностью nPE, величиной nPE и их взаимодействием с помощью регрессии со смешанными эффектами, идентичной регрессии, использованной для предсказания активности предполагаемых DA-нейронов SNr при раскрытии разделения в человеческом условии. Эта модель не была построена для компьютерного условия, так как только два игрока завершили UG с компьютерным блоком. Заметим также, что 19 предполагаемых единиц были зарегистрированы во время поведенческой сессии, в которой все предложения были приняты; поэтому поведенческое моделирование для этой сессии не проводилось, в результате чего для анализа в отношении валентности, величины nPE и их взаимодействия осталось 16 предполагаемых единиц GPi. Эта регрессия не выявила значимых эффектов ни для одной из этих переменных или их взаимодействий (Таблица 3).&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 3.&lt;/strong&gt; Сводка модели со смешанными эффектами, предсказывающей активность всех предполагаемых нейронов бледного шара внутреннего (GPi) при раскрытии.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Фиксированный эффект&lt;/th&gt;\n&lt;th&gt;Оценка&lt;/th&gt;\n&lt;th&gt;Стандартная ошибка&lt;/th&gt;\n&lt;th&gt;t-значение&lt;/th&gt;\n&lt;th&gt;p-значение&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Человек&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Intercept&lt;/td&gt;\n&lt;td&gt;0.09446&lt;/td&gt;\n&lt;td&gt;0.04858&lt;/td&gt;\n&lt;td&gt;1.944&lt;/td&gt;\n&lt;td&gt;0.0545&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;nPE magnitude&lt;/td&gt;\n&lt;td&gt;-0.01331&lt;/td&gt;\n&lt;td&gt;0.01224&lt;/td&gt;\n&lt;td&gt;-1.087&lt;/td&gt;\n&lt;td&gt;0.2775&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;nPE valence&lt;/td&gt;\n&lt;td&gt;0.17970&lt;/td&gt;\n&lt;td&gt;0.15304&lt;/td&gt;\n&lt;td&gt;1.174&lt;/td&gt;\n&lt;td&gt;0.2409&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;nPE magnitude x nPE valence&lt;/td&gt;\n&lt;td&gt;-0.18235&lt;/td&gt;\n&lt;td&gt;0.09359&lt;/td&gt;\n&lt;td&gt;-1.948&lt;/td&gt;\n&lt;td&gt;0.0519&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Сводка модели со смешанными эффектами, в которой фиксированные эффекты величины ошибки нормативного прогнозирования (nPE), валентности nPE и их соответствующие члены взаимодействия предсказывали групповую активность всех единиц GPi в течение 1000 мс после раскрытия разделения в человеческом условии. Std. Error = стандартная ошибка. n = 16 предполагаемых нейронов в человеческом условии.&lt;/p&gt;\n&lt;p&gt;Чтобы облегчить сравнение между результатами нейронов GPi и нейронов SNr, которое было бы менее смещено различиями в форме волны и частоте импульсации между популяциями, 8 из этих 16 предполагаемых единиц GPi были отобраны для повторного анализа, в котором критерии частоты импульсации и длины формы волны были подобраны в соответствии с таковыми для предполагаемых DA-нейронов SNr. Мы снова соотнесли активность предполагаемых единиц GPi в течение 1000 мс после раскрытия разделения с валентностью nPE, величиной nPE и их членами взаимодействия с помощью регрессии со смешанными эффектами только в человеческом условии. Эта регрессия не выявила значимых эффектов ни для одной из этих переменных или их взаимодействий (Таблица 4). (Визуализацию средних частот импульсации при раскрытии разделения по валентности nPE в человеческом условии см. на Рис. SN6D). Отсутствие статистически значимого эффекта в этой популяции, безусловно, может быть связано с ограниченным размером выборки зарегистрированных единиц в этой области. Таким образом, с учетом этого ограничения, наши результаты предполагают, что, хотя наша выборка предполагаемых DA-нейронов в SNr демонстрирует кодирование валентности nPE, этот паттерн не наблюдался со значимостью в нашей выборке предполагаемых единиц из GPi, даже при подборе по критериям формы волны и частоты импульсации.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 4.&lt;/strong&gt; Сводка модели со смешанными эффектами, предсказывающей активность предполагаемых нейронов бледного шара внутреннего (GPi) с согласованной формой волны и частотой спайков при раскрытии.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Фиксированный эффект&lt;/th&gt;\n&lt;th&gt;Оценка&lt;/th&gt;\n&lt;th&gt;Стандартная ошибка&lt;/th&gt;\n&lt;th&gt;t-значение&lt;/th&gt;\n&lt;th&gt;p-значение&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Человек&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Intercept&lt;/td&gt;\n&lt;td&gt;0.088536&lt;/td&gt;\n&lt;td&gt;0.080590&lt;/td&gt;\n&lt;td&gt;1.099&lt;/td&gt;\n&lt;td&gt;0.2771&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;nPE magnitude&lt;/td&gt;\n&lt;td&gt;-0.004832&lt;/td&gt;\n&lt;td&gt;0.020630&lt;/td&gt;\n&lt;td&gt;-0.234&lt;/td&gt;\n&lt;td&gt;0.8150&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;nPE valence&lt;/td&gt;\n&lt;td&gt;0.478699&lt;/td&gt;\n&lt;td&gt;0.268627&lt;/td&gt;\n&lt;td&gt;1.782&lt;/td&gt;\n&lt;td&gt;0.0761&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;nPE magnitude x nPE valence&lt;/td&gt;\n&lt;td&gt;-0.276125&lt;/td&gt;\n&lt;td&gt;0.164248&lt;/td&gt;\n&lt;td&gt;-1.681&lt;/td&gt;\n&lt;td&gt;0.0941&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Сводка модели со смешанными эффектами, в которой фиксированные эффекты величины nPE, валентности nPE и их соответствующие члены взаимодействия предсказывали групповую активность единиц GPi (подобранных по критериям формы волны и частоты импульсации к группе предполагаемых DA-нейронов SNr) в течение 1000 мс после раскрытия разделения в человеческом условии. Std. Error = стандартная ошибка. n = 8 предполагаемых нейронов в человеческом условии.&lt;/p&gt;\n&lt;h4 id=\"predpolagaemye-da-nejrony-v-snr-ne-kodiruyut-signaly-nastroeniya\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#predpolagaemye-da-nejrony-v-snr-ne-kodiruyut-signaly-nastroeniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Предполагаемые DA-нейроны в SNr не кодируют сигналы настроения&lt;/span&gt;&lt;/a&gt;Предполагаемые DA-нейроны в SNr не кодируют сигналы настроения&lt;/h4&gt;\n&lt;p&gt;Наконец, учитывая, что PE ранее демонстрировали влияние на сиюминутное настроение, мы исследовали, отслеживает ли активность предполагаемых DA-нейронов SNr субъективное настроение. Мы наблюдали, что частота импульсации предполагаемых DA-единиц в течение 1000 мс до оценки настроения не коррелировала значимо с z-оцененными рейтингами настроения (корреляция Пирсона, p = 0,16, r = -0,09, 95% ДИ -0,21 – 0,03) (Рис. SN10). Модель со смешанными эффектами, предсказывающая групповую активность DA-единиц в этот период на основе рейтинга настроения со случайным эффектом для единицы, не выявила значимого эффекта для рейтинга настроения (рейтинг настроения, p = 0,16, β ± SEM = -0,027 ± 0,019), что согласуется с результатами корреляционного теста. Эти данные свидетельствуют о том, что, хотя предполагаемые DA-нейроны SNr реагируют на валентность nPE, они не кодируют рейтинги настроения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на людях в клинических условиях (пациенты с БП и дистонией), что ограничивает обобщаемость результатов на здоровых людей; малый размер выборки нейронов требует осторожности при интерпретации отсутствия эффектов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;p&gt;В текущем исследовании изучалось, как отдельные нейроны в SNr человека кодируют сигналы социального обучения и настроения. Поведенчески мы обнаружили, что участники часто отвергали ненулевые предложения, что согласуется с предыдущими работами, демонстрирующими, что поведение отказа в UG обусловлено не объективной, а субъективной полезностью, которая отражает ценность предложения для конкретного индивида с учетом его ожиданий относительно норм и личной чувствительности к несправедливому неравенству. Это поведение сохранялось даже во время игры с компьютерными аватарами, что указывает на определенную степень социального мышления в менее социальных контекстах, на что также указывает превосходство моделей социальных норм в объяснении выбора участников по сравнению с обучением на основе несоциального вознаграждения. Моделирование социальных норм показало, что участники имели более высокие ожидания справедливости от людей по сравнению с компьютерами, а nPE влияли на их сиюминутное настроение. Нейронно, нейроны черной субстанции отслеживали валентность переживаемых nPE, причем более выраженное кодирование наблюдалось в условии с аватаром человека; эти нейроны не кодировали сиюминутное настроение. В совокупности эти данные указывают на ключевую роль черной субстанции в кодировании сигналов социального обучения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование подтверждает, что черная субстанция играет центральную роль в кодировании сигналов социального обучения, а субъективная полезность, а не объективная, определяет поведение участников в условиях социального взаимодействия.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Во-первых, наши результаты демонстрируют полезность вычислительного моделирования в выявлении того, как схожие наблюдаемые формы поведения могут возникать из различных глубинных ментальных процессов. Хотя частота отказов была схожей в условиях с аватаром человека и компьютера, наша модель показывает, что этот выбор был продиктован латентными переменными, включая начальные ожидания норм, чувствительность к несправедливости, вариативность выбора и адаптацию к нормам. В частности, более высокие начальные и сессионные внутренние нормы наблюдались во время игры с аватарами людей по сравнению с аватарами компьютеров, что указывает на то, что ожидания справедливости, которые, в свою очередь, влияют на поведение при выборе, действительно зависели от личности партнера. В результате этот подход к моделированию, подкрепленный надежным восстановлением параметров и апостериорными предиктивными проверками, проясняет значимые латентные процессы, влияющие на поведение при выборе, которые не были бы очевидны исходя только из «сырых» показателей отказов.&lt;/p&gt;\n&lt;p&gt;Более того, наши результаты подчеркивают важную роль нейронов SNr в кодировании валентности в областях социального и несоциального обучения. Предыдущие работы выявили роль SN в обработке вознаграждения и обучении с подкреплением, при этом активность DA связывается с кодированием ошибки предсказания в несоциальных контекстах. Одно из таких исследований, проведенное на нейрохирургических пациентах, показало, что популяция предполагаемых дофаминергических нейронов SN демонстрирует более высокую частоту импульсации в ответ на неожиданные выигрыши по сравнению с проигрышами, без статистически значимой связи между частотой импульсации и величиной, что аналогично кодированию валентности nPE в социальных контекстах, наблюдаемому в нашем исследовании. Кроме того, было замечено, что дофаминовые нейроны среднего мозга у приматов реагируют специфически на сигналы положительной ошибки в несоциальных контекстах. Наши результаты расширяют эту работу, предоставляя доказательства на бодрствующих людях того, что эти связанные с вознаграждением отдельные нейроны SNr также показывают повышенную активность в ответ на положительные, а не отрицательные nPE во время игры с аватарами людей, демонстрируя, что эти предполагаемые DA-единицы кодируют валентность ошибки предсказания именно в социальной сфере. Наблюдаемое кодирование валентности в частоте спайков предполагаемых DA-нейронов SNr, вероятно, в первую очередь влияет на концентрацию DA в стриатуме через восходящие аксональные проекции. Эта активность также может влиять на активность черной субстанции через локальное дендритное высвобождение DA, что согласуется с недавними работами, выявившими повышенную концентрацию DA в SNr во время взаимодействия с аватарами людей по сравнению с компьютерными аватарами с использованием вольтамперометрии. Кроме того, хотя предполагаемые дофаминергические нейроны SNr, зарегистрированные в нашем исследовании, реагируют специфически на валентность nPE, наши результаты не отрицают, что другие нейроны могут кодировать величину.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;nPE (norm prediction error) — это сигнал рассогласования между ожидаемым и фактическим соблюдением социальных норм, который мозг использует для корректировки ожиданий.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В соответствии с предыдущими работами, связывающими ошибки предсказания с настроением, наши результаты показывают, что, хотя nPE влияют на сиюминутные состояния настроения, а валентность этих nPE кодируется в нейронной активности SNr, изменения в настроении, вероятно, отражаются в нейронной активности в других частях человеческого мозга. Наши результаты дополняют недавние исследования на людях, связывающие структурные и функциональные аномалии SN с эмоциональными расстройствами и симптомами, а также внутричерепные сигналы с сигналами социальной оценки, предоставляя доказательства, полученные путем прямой регистрации отдельных нейронов SNr у бодрствующих людей во время эмоционально неприятных социальных взаимодействий. Таким образом, мы вносим вклад в литературу по SN, очерчивая роль этих нейронов в связывании сигналов обучения с настроением в социальных контекстах.&lt;/p&gt;\n&lt;p&gt;Примечательно, что наши анализы не выявили значимого нейронного отслеживания сигналов nPE со стороны GPi, соседнего ядра базальных ганглиев. Этот результат согласуть этого вывода согласультата согласуется с работами, демонстрирующими очень редкие ответы отдельных единиц на вознаграждение в этой области.&lt;/p&gt;\n&lt;p&gt;Полученные нами результаты следует интерпретировать с учетом следующих ограничений. Участники исследования в основном мужского пола и пожилого возраста, что характерно для пациентов, наиболее вероятно подлежащих операции глубокой стимуляции мозга (DBS) по поводу болезни Паркинсона (ПД). Таким образом, наше исследование может не учитывать различия в обработке социальных норм, связанные с полом или возрастом. Все эти участники также страдают ПД, которая характеризуется поведенческой ригидностью, психической негибкостью и сниженной способностью переключать когнитивные стратегии, когда они перестают быть выгодными. Патология ПД дополнительно затрагивает целевые области мозга, вызывая гиперактивность нейронов SNr и GPi из-за сниженного дофаминергического входа. Эти пациенты участвуют в нашем исследовании в состоянии отмены дофаминергических препаратов («off»), что облегчает изучение роли сохранившихся предполагаемых дофаминергических нейронов SN в усвоении социальных норм без влияния препаратов, способных изменить обучение и принятие решений; однако дофаминергическая сигнализация у этих пациентов протекает в условиях изначально истощенного уровня дофамина, а это означает, что результаты данного исследования, несмотря на их новизну, могут не распространяться на дофаминергические цепи здоровых лиц.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ограничения выборки: исследование проводилось преимущественно на пожилых мужчинах с болезнью Паркинсона в состоянии отмены препаратов, что ограничивает перенос выводов на здоровых людей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтобы лучше выяснить, как поведенческие и нейрональные изменения, вызванные патологией ПД, могут влиять на результаты нашего исследования, оптимально было бы сравнить поведенческие и нейрональные данные, полученные от лиц с ПД и без нее. Хотя поведенческие результаты можно сопоставить с данными других участников исследований с использованием игры «Ультиматум» (UG), нейрональные данные единичных нейронов не столь доступны для сравнения ввиду крайне инвазивного характера таких регистраций. По схожим причинам данное исследование ограничено по размеру выборки участников. Кроме того, стремясь использовать все доступные релевантные данные из этой ограниченной выборки, исследование включает данные как тех, кто играл в условиях с человеком и компьютером, так и тех, кто играл только в условиях с человеком, что создает дисбаланс в воздействии условий. Исследование также ограничено в возможности точно определить, как зарегистрированная активность отдельного нейрона в SN транслируется в уровень дофамина в стриатуме; такое разграничение могло бы стать возможным при одновременной регистрации активности единичных нейронов SN и вольтамперометрической регистрации в стриатуме. Наконец, данное исследование не доказывает причинную роль этих нейронов в обработке социальных норм; будущие работы с использованием стимуляции или других методов пертурбации смогут напрямую исследовать причинно-следственные связи.&lt;/p&gt;\n&lt;p&gt;В совокупности наша работа предполагает нейронную основу способности человека распознавать ошибки в социальном прогнозировании, подтверждая роль SN не только в классически изучаемом обучении с подкреплением, но и в усвоении нормативного социального поведения.&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"etika-i-uchastniki\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#etika-i-uchastniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Этика и участники&lt;/span&gt;&lt;/a&gt;Этика и участники&lt;/h4&gt;\n&lt;p&gt;Данное исследование было одобрено Институциональным наблюдательным советом Медицинской школы Икана на горе Синай. В ходе исследования нежелательных явлений не зафиксировано. В исследовании приняли участие 24 пациента нейрохирургического профиля (21 мужчина, 3 женщины, средний возраст ± стандартная ошибка среднего (SEM) = 62 ± 2,4 года; Таблица S1). После согласия на операцию по глубокой стимуляции мозга (DBS) пациентам, признанным ведущим нейрохирургом подходящими для участия в исследовании, была предоставлена возможность узнать об участии в данной работе. При проявлении интереса пациентам предоставлялась информация об исследовании, его влиянии на процедуру и любых потенциальных рисках.&lt;/p&gt;\n&lt;p&gt;Им также было представлено краткое описание поведенческой задачи, включая инструкции и два примера проб. Пациентов уведомили, что они не получат денежного вознаграждения за участие. Вместо этого им было предложено представить, как они итеративно делят $20 с партнерами — людьми или компьютерными аватарами. Вся информация предоставлялась как устно, так и в письменном виде, с достаточным количеством времени для вопросов и разъяснений перед получением письменного согласия.&lt;/p&gt;\n&lt;h4 id=\"operaciya-dbs-i-registraciya-aktivnosti-odinochnyh-nejronov\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#operaciya-dbs-i-registraciya-aktivnosti-odinochnyh-nejronov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Операция DBS и регистрация активности одиночных нейронов&lt;/span&gt;&lt;/a&gt;Операция DBS и регистрация активности одиночных нейронов&lt;/h4&gt;\n&lt;p&gt;Имплантация устройства DBS проводилась в ходе трех операций: имплантация электрода в левое полушарие, имплантация электрода в правое полушарие и имплантация батареи. Эти операции проводились с интервалом примерно в 2–4 недели. Участникам предоставлялась возможность участвовать в исследовании во время любой из операций по имплантации электродов или обеих сразу. На момент операции участники не принимали лекарственные препараты в течение как минимум 9 часов, согласно стандартному клиническому протоколу.&lt;/p&gt;\n&lt;p&gt;В момент операции DBS, когда пациентов пробуждали для наведения и тестирования клинического электрода (что обычно происходило примерно через 10 минут после имплантации электрода), клиническая процедура ненадолго прерывалась для регистрации активности одиночных нейронов и выполнения задачи. Наш ведущий нейрохирург устанавливал вольфрамовый микроэлектрод в целевую область регистрации, используя микропривод с силовым усилением и трактографию. После позиционирования микроэлектрода в целевых областях регистрации, идентифицированных по их уникальным паттернам нейронной активности, нейрохирург корректировал положение электрода до подтверждения наличия стабильной активности спайков. Нейронные данные регистрировались с помощью электрофизиологической системы Alpha Omega. Для пациентов, которым проводилась операция DBS в субталамическом ядре, регистрация активности одиночных нейронов проводилась в черной субстанции сетчатой части (SNr; Рис. 1A). Для пациентов, которым проводилась операция DBS в бледном шаре (GPi), регистрация активности одиночных нейронов также проводилась в GPi (Рис. S9A). После завершения регистрации клинический стимулятор перемещался в целевую клиническую область для тестирования и окончательной имплантации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Регистрация активности одиночных нейронов (single-unit recording) — метод записи электрических импульсов (спайков) отдельных нервных клеток с помощью микроэлектродов, позволяющий изучать работу мозга на уровне отдельных нейронов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Когорта SNr включала 19 участников с болезнью Паркинсона (16 мужчин, 3 женщины, возраст 65 ± 1,93 года). Когорта GPi включала 5 участников с болезнью Паркинсона или дистонией (5 мужчин, 0 женщин, возраст 53 ± 8,5 лет). Во время регистрации активности одиночных нейронов участники выполняли поведенческую задачу, визуализированную на компьютерном мониторе, расположенном в поле зрения
