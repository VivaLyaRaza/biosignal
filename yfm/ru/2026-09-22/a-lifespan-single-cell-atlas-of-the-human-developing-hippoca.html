            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"241\" cy=\"128\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"639\" cy=\"280\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Карта развития гиппокампа&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;человека для изучения ранней&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;болезни Альцгеймера&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f1.jpg\" alt=\"Figure 1. Human Developing Hippocampus Atlas (HuDeHA) captures the temporal dynamics of hippocampal development from ear\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 1. Human Developing Hippocampus Atlas (HuDeHA) captures the temporal dynamics of hippocampal development from early embryonic to postnatal stages.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Ученые создали единую клеточную карту развивающегося гиппокампа человека, охватывающую период от эмбриона до подросткового возраста. С ее помощью они исследовали мозговые органоиды с мутацией, вызывающей раннюю форму болезни Альцгеймера. Анализ показал сбои в клеточном составе, преждевременное созревание нейронов и изменения активности ключевых генов. Новая база данных поможет точнее моделировать неврологические патологии в лабораторных условиях.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Атлас развивающегося гиппокампа человека с разрешением в одну клетку на протяжении всей жизни служит эталоном для органоидов мозга при семейной форме болезни Альцгеймера&lt;/p&gt;\n&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Авторы исследуют семейную форму болезни Альцгеймера (фБА), возникающую из-за мутаций в генах APP, PSEN1 и PSEN2, причем гиппокамп страдает в числе первых. Для изучения ранних нарушений используют органоиды мозга из индуцированных плюрипотентных стволовых клеток, однако их анализ затруднен из-за разнородности. Чтобы решить эту проблему, ученые создали Атлас развивающегося гиппокампа человека (HuDeHA), объединивший 658 059 клеток в диапазоне от 3 недель после зачатия до 15,3 лет. Этот эталон применили для оценки органоидов с мутацией PSEN1E280A, характерной для крупной популяции в Колумбии. Картирование показало дефицит радиальной глии, избыток нейронов из нервного гребня, активацию фактора MEIS2 и снижение уровня белка TTR. Полученные данные делают HuDeHA надежным стандартом для тестирования органоидов и раскрывают ранние клеточные сбои при фБА.&lt;/p&gt;\n&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Этот раздел служит введением в проблематику исследования, обосновывая необходимость создания единого транскриптомного атласа для глубокого понимания патогенеза ранних стадий болезни Альцгеймера.&lt;/p&gt;\n&lt;h4 id=\"rezultaty-atlas-razvivayushegosya-gippokampa-cheloveka-hudeha-pozvolyaet-vydelit-osnovnye-klassy-kletok-na-pre-i-postnatalnoj-vremennoj-shkale\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#rezultaty-atlas-razvivayushegosya-gippokampa-cheloveka-hudeha-pozvolyaet-vydelit-osnovnye-klassy-kletok-na-pre-i-postnatalnoj-vremennoj-shkale\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты: Атлас развивающегося гиппокампа человека (HuDeHA) позволяет выделить основные классы клеток на пре- и постнатальной временной шкале&lt;/span&gt;&lt;/a&gt;Результаты: Атлас развивающегося гиппокампа человека (HuDeHA) позволяет выделить основные классы клеток на пре- и постнатальной временной шкале&lt;/h4&gt;\n&lt;p&gt;Авторы создали масштабный атлас развивающегося гиппокампа человека (HuDeHA), объединяющий 658 059 клеток, чтобы получить надежный эталон для анализа мозговых органоидов. Этот массив данных охватывает все недели внутриутробного развития с 3-й по 16-ю (PCW3–PCW16), а также более поздние фетальные, постнатальные стадии и период вплоть до подросткового возраста. Включение как нейрональных, так и ненейрональных линий позволило детально охарактеризовать клеточный состав и траектории созревания в норме.&lt;/p&gt;\n&lt;p&gt;Создание такого атласа было необходимо для преодоления трудностей интерпретации органоидов, клетки которых часто бывают гетерогенными и незрелыми. Используя HuDeHA как референсную карту, исследователи смогли точно идентифицировать клеточные популяции в органоидах с мутацией PSEN1(E280A) и отделить истинные патологические изменения от артефактов культивирования. Бенчмаркинг показал, что мутантные органоиды отличаются дефицитом радиальной глии, избытком нейронов производных нервного гребня и специфическими сдвигами в программах созревания.&lt;/p&gt;\n&lt;h4 id=\"hudeha-pozvolyaet-vypolnyat-proecirovanie-dannyh-organoidov-pri-fad-na-osnove-referensa\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#hudeha-pozvolyaet-vypolnyat-proecirovanie-dannyh-organoidov-pri-fad-na-osnove-referensa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HuDeHA позволяет выполнять проецирование данных органоидов при fAD на основе референса&lt;/span&gt;&lt;/a&gt;HuDeHA позволяет выполнять проецирование данных органоидов при fAD на основе референса&lt;/h4&gt;\n&lt;p&gt;Авторы создали Атлас развивающегося гиппокампа человека (HuDeHA), объединив 107 массивов данных одноклеточной РНК-секвенирования, которые в общей сложности содержали 658 059 клеток (Рис. 1A; Рис. S1A, B; Таблица S1). Временной диапазон охватывал периоды от раннего эмбрионального этапа (начиная с 3-й недели после зачатия) до постнатального подросткового возраста (до 15,3 лет). Используя известные маркерные гены, исследователи идентифицировали 20 ключевых клеточных классов (Рис. 1D). Нейроэктодермальные линии включали радиальную глия, промежуточные клетки-предшественники, молодые и зрелые нейроны, а также клетки Кахаля — Ретциуса. Глиальная линия была представлена глиальными предшественниками, клетками-предшественниками олигодендроцитов, зрелыми олигодендроцитами и астроцитами. Помимо этого, были выявлены эпендимальные клетки, клетки сосудистого сплетения, популяции нервного гребня, а также неэктодермальные элементы — мезенхима, эндотелий, микроглия и другие иммунные клетки.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f1.jpg\" alt=\"Figure 1. Human Developing Hippocampus Atlas (HuDeHA) captures the temporal dynamics of hippocampal development from ear\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 1. Human Developing Hippocampus Atlas (HuDeHA) captures the temporal dynamics of hippocampal development from early embryonic to postnatal stages.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Анализ клеточного состава в динамике от 3-й недели эмбрионального развития до 15,3 лет показал закономерные смены клеточных популяций (Рис. 1B, C; Рис. S1D). Ранние эмбриональные образцы характеридовали обилие радиальной глии и клеток нервного гребня, в то время как во втором триместре преобладали ранние нейроны и появлялись глиальные предшественники. Постнатальные ткани содержали преимущественно зрелые нейроны и дифференцированную глию. Оценка потенциала развития с помощью алгоритма CytoTRACE2 продемонстрировала закономерное снижение баллов дифференцировочного потенциала по мере созревания клеток (Рис. 1G; Рис. S1C): от высоких значений у пролиферирующих предшественников и радиальной глии до минимальных показателей у зрелых нейронов, олигодендроцитов и астроцитов.&lt;/p&gt;\n&lt;h4 id=\"analiz-dannyh-stvolovyh-kletok-i-kletochnaya-annotaciya\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#analiz-dannyh-stvolovyh-kletok-i-kletochnaya-annotaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ данных стволовых клеток и клеточная аннотация&lt;/span&gt;&lt;/a&gt;Анализ данных стволовых клеток и клеточная аннотация&lt;/h4&gt;\n&lt;p&gt;Авторы использовали набор данных scRNA-seq для органоидов мозга, полученных из индуцированных плюрипотентных стволовых клеток (иПСК) с различными генотипами по генам PSEN1 и APOE (всего восемь клеточных линий). Для интеграции и аннотации данных исследователи применили полуконтролируемую нейросетевую модель scPoli, которая проецирует клетки на общие латентные пространства на основе эталонного набора данных HuDeHA (Рис. 2A). Такой подход позволил успешно классифицировать основные клеточные линии: предшественники, нейроны, эпителиальные/вентрикулярные, мезенхимальные и производные нервного гребня (НК) (Рис. 2B). При этом дифференцированные глиальные, иммунные или сосудистые клетки обнаружены не были.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f2.jpg\" alt=\"Figure 2. Reference mapping to HuDeHA enables comparison of iPSC-derived brain organoids with in vivo hippocampal cell s\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 2. Reference mapping to HuDeHA enables comparison of iPSC-derived brain organoids with in vivo hippocampal cell states and developmental time. (A) Schematic of the analysis workflow. HuDeHA (PCW 3 to 15.3 years; 20 annotated cell classes) served as reference for scPoli-based transfer of cell-class and developmental-age labels to iPSC- derived PSEN1WT and PSEN1E280A human brain organoids. scPoli was trained on the intersection gene set between reference and query (22,467 genes), and organoid cells were projected into the learned latent space for label prediction. (B) UMAP of iPSC-derived human brain organoids colored by 12 predicted cell classes inferred from HuDeHA, followed by limite&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Внутри нейрональной линии были выделены прогениторные клетки (IPC), а также ранние и зрелые нейроны с существенным преобладанием ранних нейронов (19 131 клетка) и радиальной глии (18 384 клетки), в то время как IPC (1 308 клеток) и зрелые нейроны (877 клеток) встречались значительно реже. Клетки IPC экспрессировали маркеры ASCL1 и HES6, а ранние нейроны характеризовались высокой экспрессией TUBB3, STMN2 и DCX, тогда как зрелые нейроны экспрессировали GRIN2B и GRIA2 (Рис. 2C, D). Кроме того, был зафиксирован выраженный сигнал S100B, локализованный главным образом в компартменте НК (Рис. 2B, C), который также экспрессировал характерные маркеры MPZ, FOXD3 и SOX10 (Рис. 2D). Полученные данные подробно описывают клеточный состав органоидов и подтверждают эффективность метода scPoli для картирования различных клеточных популяций.&lt;/p&gt;\n&lt;h4 id=\"analiz-neopredelennosti-annotacii-i-vyyavlenie-specifichnyh-populyacij\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#analiz-neopredelennosti-annotacii-i-vyyavlenie-specifichnyh-populyacij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ неопределенности аннотации и выявление специфичных популяций&lt;/span&gt;&lt;/a&gt;Анализ неопределенности аннотации и выявление специфичных популяций&lt;/h4&gt;\n&lt;p&gt;Авторы провели оценку уверенности модели классификации клеток, которая в целом показала высокие результаты, однако выявила повышенную неопределенность для эпендимы, глиальных прогениторов и сосудистого сплетения (Рис. S2A). Используя альтернативное встраивание и канонические маркеры, исследователи обнаружили обособленную группу клеток, богатую генами CFAP (CFAP126, CFAP144, CFAP276, CFAP141, CFAP90), которая не имела прямых аналогов в контрольном атласе HuDeHA (Рис. S2B). Эта популяция была классифицирована как ранние эпендимальные клетки (early ependymal) и характеризовалась экспрессией FOXJ1 и частичным запуском программы цилиогенеза, но при этом в них отсутствовали ключевые гены сборки ресничек и аксонемных динеинов [6, 20, 21]. Подобные клетки также частично перекрывались с маркерами сосудистого сплетения, что указывает на незавершенность дифференцировки желудочкового эпителия в органоидах.&lt;/p&gt;\n&lt;h4 id=\"harakteristika-glialnyh-progenitorov-i-radialnoj-glii\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#harakteristika-glialnyh-progenitorov-i-radialnoj-glii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Характеристика глиальных прогениторов и радиальной глии&lt;/span&gt;&lt;/a&gt;Характеристика глиальных прогениторов и радиальной глии&lt;/h4&gt;\n&lt;p&gt;Глиальные прогениторы продемонстрировали обогащение маркерами дорсальной средней линии и крышечной пластинки, такими как LMX1A/B, MSX1 и GDF7 (Рис. S2C), а также избирательную экспрессию генов семейств WNT (WNT1/3A) (Рис. 2C, Рис. S2C). В то же время классические ин виво маркеры глиальных прогениторов (TNC, BCAN, NFIB) экспрессировались слабо или отсутствовали вовсе (Рис. S2D). Радиальная глия также характеризовалась сниженной уверенностью предсказания (Рис. S2A), что объясняется неоднородностью их состояний в органоидах: наряду с базовыми маркерами SOX2 и NES, эти клетки частично экспрессировали гены, характерные для глиальных прогениторов.&lt;/p&gt;\n&lt;h4 id=\"ocenka-transkripcionnogo-shodstva-organoidov-s-etalonnym-atlasom\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#ocenka-transkripcionnogo-shodstva-organoidov-s-etalonnym-atlasom\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оценка транскрипционного сходства органоидов с эталонным атласом&lt;/span&gt;&lt;/a&gt;Оценка транскрипционного сходства органоидов с эталонным атласом&lt;/h4&gt;\n&lt;p&gt;Для независимой оценки степени схожести клеток in vivo и в органоидах авторы рассчитали коэффициент Жаккара и корреляцию Пирсона по топ-1500 дифференциально экспрессируемым генам (Рис. 2E, Рис. S3A-C). Наибольшее соответствие с эталонным атласом показали мезенхимальные клетки (индекс Жаккара составил 0.38) и ранние нейроны (0.32), что подтверждает сохранение ключевых нейрональных и мезенхимальных идентичностей в органоидной модели. Пролиферирующие прогениторы показали перекрытие с радиальной глией и пролиферирующими клетками (0.32 и 0.29). Ранние эпендимальные клетки имели стабильно низкое сходство со всеми референтными классами, подтверждая их статус органоид-специфичной популяции. Контрольные популяции (астроциты, олигодендроциты, микроглия) не показали значимого сходства ни с одной клеточной группой органоидов, а дополнительные анализы корреляции Пирсона, Спирмена и Кендалла полностью подтвердили эти закономерности (Рис. S3D-F).&lt;/p&gt;\n&lt;h4 id=\"predskazanie-stadij-razvitiya-organoidov-s-pomoshyu-scpoli\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#predskazanie-stadij-razvitiya-organoidov-s-pomoshyu-scpoli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Предсказание стадий развития органоидов с помощью scPoli&lt;/span&gt;&lt;/a&gt;Предсказание стадий развития органоидов с помощью scPoli&lt;/h4&gt;\n&lt;p&gt;Исследователи применили инструмент scPoli, опираясь на аннотации возрастов развития HuDeHA, чтобы оценить сходство стадий развития в наборе данных органоидов при болезни Альцгеймера (fAD). Согласно полученным результатам на Рис. 2F, предсказанные состояния органоидов охватывают широкий спектр этапов от раннего пренатального до постнатального периодов, демонстрируя умеренную организацию по возрасту в пространстве встраивания.&lt;/p&gt;\n&lt;p&gt;Количественный анализ, представленный на Рис. 2G, показал, что подавляющее большинство клеток органоидов соответствует ранним пренатальным срокам (преимущественно от 4 до 9 недель гестации — PCW4–PCW9). При этом лишь около 1% клеток соотнеслись с более поздними стадиями (от PCW11 и позже), включая постнатальный возраст.&lt;/p&gt;\n&lt;p&gt;Авторы проанализировали долю клеток разных возрастных групп для каждого клеточного типа, представив данные в виде тепловой карты (Рис. 2H). Полученное распределение полностью согласуется с закономерностями биологического развития: клетки-предшественники и невральные популяции (пролиферирующие предшественники, мезенхимальные и нервные гребные клетки) закономерно ассоциировались с ранними возрастами, тогда как более зрелые типы (зрелые нейроны и эпендимоподобные клетки) демонстрировали предсказания, характерные для поздних и постнатальных этапов.&lt;/p&gt;\n&lt;h4 id=\"organoidy-psen1e280a-demonstriruyut-razlichiya-v-kletochnom-sostave-i-transkripcionnyh-profilyah\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#organoidy-psen1e280a-demonstriruyut-razlichiya-v-kletochnom-sostave-i-transkripcionnyh-profilyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Органоиды PSEN1E280A демонстрируют различия в клеточном составе и транскрипционных профилях&lt;/span&gt;&lt;/a&gt;Органоиды PSEN1E280A демонстрируют различия в клеточном составе и транскрипционных профилях&lt;/h4&gt;\n&lt;p&gt;В данном разделе авторы изучили, как мутация PSEN1E280A влияет на клеточный состав и профили экспрессии генов в органоидах по сравнению с контрольной группой (PSEN1WT). Для количественной оценки пропорций клеток авторы применили байесовский метод scCODA (Рис. 3A-B), который выявил достоверное увеличение доли нейронов, происходящих из нервного гребня (NC-derived neurons), и сокращение числа радиальной глии в мутантных образцах. Это указывает на существенные сдвиги в дифференцировке клеток при наличии мутации.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f3.jpg\" alt=\"Figure 3. PSEN1E280A is associated with altered lineage balance and cell-class-specific dysregulation of neuronal specif\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 3. PSEN1E280A is associated with altered lineage balance and cell-class-specific dysregulation of neuronal specification, progenitor, and ventricular programs.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Затем исследователи оценили прогнозируемый биологический возраст клеток с помощью тепловой карты (Рис. 3C) и метрики Cliff’s delta. Анализ показал, что пролиферирующие предшественники и нейроны нервного гребня в мутантных органоидах выглядят более «молодыми» по сравнению с контролем (например, 5.5 против 6.7 недель постнатального возраста для предшественников), в то время как остальные типы клеток различались незначительно. Анализ дифференциально экспрессируемых генов (DEG) выявил наибольшие изменения в клетках нервного гребня, их производных и хориоидном сплетении (Рис. 3D). В частности, наблюдалось повышение уровня MEIS2, MEIS1, NR2F1 и TAC1 в нейрональных популяциях, а также активация регуляторных генов нейрогенеза HES6, NEUROD1 и NFIA. У пролиферирующих предшественников и радиальной глии возросла экспрессия S100B и APOE, тогда как маркеры пути WNT и некоторые гены адгезии снизились. В хориоидном сплетении и эпендимальных клетках зафиксировано снижение уровня TTR и митохондриальных транскриптов, но повышение FOLR1 и MSX1 (Таблица S2).&lt;/p&gt;\n&lt;p&gt;Наконец, авторы сравнили обогащение сигнальных путей между мутантными и контрольными органоидами, а также сопоставили их с референтными клетками HuDeHA (Рис. S4A-B). Наиболее выраженные различия вновь наблюдались у пролиферирующих предшественников, где у мутантных органоидов отмечалось снижение показателей, связанных с сигнальным путем WNT, что подчеркивает нарушения ранних этапов развития.&lt;/p&gt;\n&lt;h4 id=\"analiz-traektorij-nejronov-vyyavlyaet-izmenennuyu-dinamiku-sozrevaniya\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#analiz-traektorij-nejronov-vyyavlyaet-izmenennuyu-dinamiku-sozrevaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ траекторий нейронов выявляет измененную динамику созревания&lt;/span&gt;&lt;/a&gt;Анализ траекторий нейронов выявляет измененную динамику созревания&lt;/h4&gt;\n&lt;p&gt;Этот подраздел служит вводным заголовком для следующего этапа исследования, в котором авторы переходят к анализу траекторий развития нейронов с целью детального изучения динамики их созревания в условиях исследуемой мутации.&lt;/p&gt;\n&lt;h4 id=\"analiz-nejronalnoj-linii-i-psevdovremeni\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#analiz-nejronalnoj-linii-i-psevdovremeni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ нейрональной линии и псевдовремени&lt;/span&gt;&lt;/a&gt;Анализ нейрональной линии и псевдовремени&lt;/h4&gt;\n&lt;p&gt;Исследователи изучили дифференцировку нейронов, построив псевдовременную траекторию для промежуточных клеток-предшественников (IPC), ранних и зрелых нейронов, используя данные HuDeHA как ориентир in vivo (Рис. 4A, B). Анализ показал четкую последовательность созревания: на ранних этапах псевдовремени преобладали пронейральные факторы транскрипции (NEUROG1, ASCL1, NEUROD1, NEUROD4), отвечающие за выбор судьбы и переход к дифференцировке, тогда как на поздних этапах активировались гены структуры нейронов и синаптической функции (MAPT, SNAP25, SYT1, VAMP2, NLGN1). Это подтверждает переход от коммитированных клеток к функционально зрелым синаптическим состояниям (Рис. 4E, Рис. S5). Разделив траекторию на шесть интервалов (bins), авторы выявили смену клеточных программ: в начале доминировали биосинтез, метаболизм и окислительное фосфорилирование, а в конце — дифференцировка, развитие аксонов/дендритов и организация синапсов (Рис. 4D). Важно отметить, что гены апоптоза концентрировались в начале пути, исключая сценарий клеточной гибели на терминальной стадии. Сравнение генотипов показало, мутантные клетки PSEN1E280A несколько сильнее представлены на поздних интервалах псевдовремени по сравнению с клетками PSEN1WT, которые тяготели к ранним и средним этапам (Рис. 4B′, C). При этом общая структура траектории сохранялась, указывая на сдвиг мутантных органоидов в сторону более зрелых состояний.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f4.jpg\" alt=\"Figure 4. PSEN1E280A alters neuronal differentiation toward more mature developmental states.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 4. PSEN1E280A alters neuronal differentiation toward more mature developmental states.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"sravnenie-in-vivo-i-obsuzhdenie\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#sravnenie-in-vivo-i-obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сравнение in vivo и обсуждение&lt;/span&gt;&lt;/a&gt;Сравнение in vivo и обсуждение&lt;/h4&gt;\n&lt;p&gt;Для валидации результатов авторы реконструировали траекторию in vivo на основе данных HuDeHA, которая продемонстрировала ожидаемый порядок развития без избыточного накопления клеток на финальной стадии, наблюдавшегося в органоидах (Рис. S6A–D). Сравнение траекторий органоидов и HuDeHA с помощью корреляции Пирсона показало, что все органоидные состояния наиболее близки к ранним этапам in vivo (t1–t2), оставаясь преимущественно эмбриональными по сравнению с тканями человека (Рис. S6E). Тем не менее, органоиды PSEN1E280A демонстрировали чуть большую схожесть с промежуточным этапом t3 эталона HuDeHA на поздних стадиях псевдовремени по сравнению с диким типом. В разделе «Обсуждение» (Discussion) авторы обобщают эти данные, подчеркивая специфические особенности влияния мутации PSEN1E280A на темпы и профиль нейрональной дифференцировки в органоидных моделях.&lt;/p&gt;\n&lt;h4 id=\"kartirovanie-po-referensnomu-atlasu-vyyavlyaet-divergentnye-populyacii-i-populyacii,-specifichnye-dlya-organoidov\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#kartirovanie-po-referensnomu-atlasu-vyyavlyaet-divergentnye-populyacii-i-populyacii,-specifichnye-dlya-organoidov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Картирование по референсному атласу выявляет дивергентные популяции и популяции, специфичные для органоидов&lt;/span&gt;&lt;/a&gt;Картирование по референсному атласу выявляет дивергентные популяции и популяции, специфичные для органоидов&lt;/h4&gt;\n&lt;p&gt;Используя созданный атлас HuDeHA, авторы провели картирование клеток мозговых органоидов с мутацией PSEN1E280A (ранняя форма болезни Альцгеймера, fAD). Анализ показал, что такие органоиды в основном воспроизводят раннее эмбриональное развитие (примерно 5-9 недели постнатального возраста, PCW), что согласуется с прогениторным составом нецеленаправленных церебральных органоидов на этой стадии дифференцировки. В органоидах была обнаружена выраженная нейрональная линия, а также популяции клеток нервного гребня и мезенхимальные компартменты, в то время как дифференцированная глия не определялась. Наличие клеток нервного гребня и мезенхимы авторы объясняют неспецифическим расширением не нейрональных состояний в протоколе, а не прямым следствием мутации.&lt;/p&gt;\n&lt;p&gt;Внутри нейрональной линии преобладали радиальная глия и ранние нейроны, тогда как промежуточные клетки-предшественники (IPC) и зрелые нейроны были представлены слабо. Сравнение с эталоном HuDeHA выявило ограниченное сходство хориоидного сплетения и эпендимальных клеток in vivo, что указывает на их неполную зрелость в моделях. Также была найдена популяция незрелых желудочковых эпителиальных клеток с частичной активацией программы цилиогенеза, которая не имеет прямого аналога в атласе и представляет собой специфичное для органоидов раннее состояние. Клетки, похожие на глиальные прогениторы, экспрессировали маркеры крыши нервной трубки (roof plate) и кортикального гема, что предполагает их сигнальное состояние, близкое к кортикальному нему или хориоидному сплетению, а не истинную глиальную дифференцировку.&lt;/p&gt;\n&lt;h4 id=\"sostavnoj-analiz-i-kletochnyj-balans\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#sostavnoj-analiz-i-kletochnyj-balans\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Составной анализ и клеточный баланс&lt;/span&gt;&lt;/a&gt;Составной анализ и клеточный баланс&lt;/h4&gt;\n&lt;p&gt;Авторы провели исследование клеточного состава, чтобы выяснить, как мутация PSEN1E280A влияет на распределение клеточных линий в органоидах. Анализ выявил дисбаланс, выраженный в сокращении числа клеток радиальной глии и одновременном росте популяции нервного гребня.&lt;/p&gt;\n&lt;p&gt;Такие сдвиги указывают на изменение поведения клеток-предшественников: они хуже поддерживают пул радиальной глии и быстрее дифференцируются в нейроны. Поскольку количество клеток нервного гребня может зависеть от методики дифференцировки, исследователи рассматривают этот рост скорее как корреляцию с мутацией, а не как ее прямой результат. В целом, данные подтверждают гипотезу о том, что нарушение ранних сигнальных путей развития смещает выбор клеточных линий [28].&lt;/p&gt;\n&lt;h4 id=\"analiz-traektorij-nejronov-vyyavlyaet-izmenennoe-razvitie\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#analiz-traektorij-nejronov-vyyavlyaet-izmenennoe-razvitie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ траекторий нейронов выявляет измененное развитие&lt;/span&gt;&lt;/a&gt;Анализ траекторий нейронов выявляет измененное развитие&lt;/h4&gt;\n&lt;p&gt;В данном разделе авторы изучили траектории развития нейронов, чтобы понять, как мутация PSEN1E280A влияет на клеточную дифференцировку. Анализ показал, что мутантные органоиды претерпевают серьезные изменения в транскрипционной активности, затрагивающие спецификацию клеточных судеб, программы прогениторов и структуры желудочкового эпителия. В частности, наблюдалось стойкое повышение экспрессии факторов MEIS2, MEIS1, NR2F1 и TAC1, что указывает на сдвиги в региональном паттернинге. Радиальная глия демонстрировала повышенные уровни S100B и APOE, отражая раннее вовлечение глии в патологические процессы еще до появления зрелых популяций.&lt;/p&gt;\n&lt;p&gt;Ученые зафиксировали активацию ранних нейрогенных программ через усиление экспрессии HES6 и NEUROD1, однако это свидетельствует скорее о затягивании незрелого дифференцирующегося состояния, чем об ускоренном созревании. В популяциях, связанных с хориоидным сплетением, было выявлено значимое снижение уровня транстиретина (TTR), ключевого белка для связывания амилоида-бета. Это может указывать на нарушение секреторной функции и ранние дефекты клиренса Aβ, характерные для патогенеза болезни Альцгеймера.&lt;/p&gt;\n&lt;p&gt;Сопоставление сигнальных путей показало лишь умеренное снижение активности Notch у прогениторов, тогда как подавление путей WNT выглядит вероятной причиной потери клеток радиальной глии и сдвига в созревании нейронов. Оценка биологического возраста клеток с помощью картирования показала, что органоиды соответствуют эмбриональному периоду 5–9 недель беременности (первый триместр). При этом мутантные образцы демонстрировали небольшой сдвиг в сторону более молодого возраста для прогениторов и нейронов, происходящих из нервного гребня, по сравнению с диким типом.&lt;/p&gt;\n&lt;h4 id=\"ogranicheniya\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения&lt;/span&gt;&lt;/a&gt;Ограничения&lt;/h4&gt;\n&lt;p&gt;В данном исследовании анализ налагается определенными ограничениями. Использованный набор данных органоидов включал всего два органоида PSEN1WT и шесть PSEN1E280A из одной опубликованной работы, что снижает статистическую мощность и затрудняет разграничение эффектов самой мутации и вариабельности между органоидами. Кроме того, наблюдаемое увеличение популяции клеток нервного гребня может частично объясняться спецификой протокола дифференцировки, а не напрямую мутацией PSEN1E280A.&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;p&gt;Сбор и предобработка данных для сборки HuDeHA&lt;/p&gt;\n&lt;h4 id=\"sbor-dannyh\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#sbor-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сбор данных&lt;/span&gt;&lt;/a&gt;Сбор данных&lt;/h4&gt;\n&lt;p&gt;Авторы описали этап сбора исходных данных, необходимых для формирования и настройки справочной базы HuDeHA, которая служит основой для дальнейшего сравнительного анализа клеточных состояний мозговых органоидов и сопоставления их с процессами развития человека in vivo.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f5.jpg\" alt=\"Figure 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 5&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Сложность&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;оценки&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;качества&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мозговых&lt;/text&gt;&lt;text x=\"26\" y=\"162\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;органоидов&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Создан атлас&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;клеток&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;гиппокампа с&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;658 тыс.&lt;/text&gt;&lt;text x=\"226\" y=\"162\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;клеток&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Выявлены&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;дефекты&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;развития в&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;органоидах с&lt;/text&gt;&lt;text x=\"426\" y=\"162\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мутацие&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A
