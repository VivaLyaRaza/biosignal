        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"273\" cy=\"121\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"667\" cy=\"296\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · MICROBIOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Белок Plscr1 останавливает&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;проникновение мышиного&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;норовируса&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-f1.jpg\" alt=\"Рисунок 1: Plscr1 необходим для оптимального контроля инфекции MNV. (A) Диаграмма Венна, отображающая консервативные хит\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Рисунок 1: Plscr1 необходим для оптимального контроля инфекции MNV. (A) Диаграмма Венна, отображающая консервативные хиты по результатам трех различных скринингов. (B) Клетки HeLa-CD300lf, экспрессирующие либо пустой вектор, либо Plscr1, были инфицированы MNVCW3 (слева) или MNVCR6 (справа) с множественностью заражения (MOI), равной 0,05. Вирусная продукция подсчитывалась с помощью метода бляшкообразования (PFU; бляшкообразующие единицы). (C) Клетки HeLa-CD300lf, экспрессирующие мышиный или человеческий Plscr1, были заражены MNVCW3-HiBiT с MOI 0,5 в течение 48 часов. Инфекция количественно оценивалась с использованием системы литической детекции Nano-Glo HiBiT (RLU; относительные единицы люминесценции). (D) Представительный вестерн-блоттинг клеток HeLa-CD300lf, экспрессирующих мышиный (ms) или человеческий (hu) Plscr1 с FLAG-меткой, с использованием указанных антител. (E) Представительный вестерн-блоттинг клеток HeLa-CD300lf, экспрессирующих либо контрольный вектор, либо Plscr1, инфицированных MNVCW3 с MOI 5,0 и лизированных в указанные часы после заражения (hpi). (F) Представительный вестерн-блоттинг клеток HeLa-CD300lf или HeLaΔPlscr1-CD300lf, обработанных без интерферона, 1000 ед/мл интерферона α или 0,1 мкг/мл интерферона γ, с использованием указанных антител. (G) Клетки HeLa-CD300lf или HeLaΔPlscr1-CD300lf были заражены MNVCW3-HiBiT с MOI 0,5. Через 48 часов инфекция была количественно оцененена с использованием системы литической детекции Nano-Glo HiBiT. (H) Клетки HeLa-CD300lf или HeLaΔPlscr1-CD300lf обрабатывали указанными дозами интерферона α (Ед/мл), а затем заражали MNVCW3-HiBiT с MOI 0,5 в течение 48 часов. Инфекция была количественно оценена с использованием системы литической детекции Nano-Glo HiBiT. Эффективная концентрация 50 (EC50) для интерферона α была рассчитана для указанных типов клеток. (I) Экспрессия Plscr1 из тканей мышей из помета Plscr1+/+ (WT) или Plscr1-/- (KO). Штриховая линия указывает предел обнаружения. (J) Мыши из помета Plscr1+/+ (WT) или Plscr1-/- (KO) были заражены 1 × 10^6 PFU MNVCW3 и эвтаназированы через 3 дня после заражения. Толстая кишка, подвздошная кишка, брыжеечные лимфатические узлы (MLN), селезенка и печень были проанализированы с помощью ПЦР в реальном времени на наличие копий генома MNV с нормировкой на актин. Показаны индивидуальные точки данных вместе с виолонче-диаграммой для каждой ткани. Указаны P-значения по тесту Манна-Уитни. Штриховая линия указывает предел обнаружения. Все данные представлены в виде среднего значения ± стандартное отклонение по результатам трех независимых экспериментов и проанализированы с использованием однофакторного дисперсионного анализа (ANOVA) с тестом множественных сравнений Тьюки (B и C), t-теста (G) или теста Манна-Уитни (J). *P &amp;lt; 0,05, **P &amp;lt; 0,01, ***P &amp;lt; 0,001, ***&lt;em&gt;P &amp;lt; 0,0001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Норовирусы вызывают тяжелые гастроэнтериты, но защитные механизмы организма изучены плохо. Ученые выяснили, что ген Plscr1, стимулируемый интерфероном, эффективно ограничивает размножение мышиного норовируса. Оказалось, что Plscr1 блокирует проникновение вируса в клетки на этапе после прикрепления. Устойчивость к этому белку обеспечивает всего одна замена в вирусном белке VP2. Это открытие показывает, что белок борется не только с оболочечными, но и с без оболочечными вирусами.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Норовирусы представляют собой одну из главных причин развития острого гастроэнтерита во всем мире, однако защитные факторы хозяина, способные подавлять репликацию этих патогенов, до сих пор остаются малоизученными. В ходе систематического анализа результатов полногеномных скринингов с использованием систем CRISPR-активации и CRISPR-нокаута исследователи обнаружили, что интерферон-стимулируемый ген &lt;em&gt;Plscr1&lt;/em&gt; (кодирующий фосфолипидную скрамблазу 1) выступает в качестве ключевого фактора ограничения для мышиного норовируса (MNV). Ранее было известно, что белок Plscr1 препятствует слиянию оболочечных вирусов с мембранами эндосом, поэтому обнаружение его противовирусной активности в отношении MNV — вируса, не имеющего суперкапсида (оболочки) — оказалось весьма неожиданным открытием. В представленной работе авторы экспериментально доказывают, что присутствие Plscr1 является как необходимым, так и достаточным условием для подавления инфекции MNV в условиях &lt;em&gt;in vitro&lt;/em&gt;. Кроме того, этот белок вносит существенный вклад в контроль инфекционного процесса в толстой кишке лабораторных мышей &lt;em&gt;in vivo&lt;/em&gt;. С точки зрения молекулярного механизма было установлено, что Plscr1 блокирует проникновение норовируса в клетку-хозяина на этапе, следующем сразу за прикреплением вириона к клеточной поверхности (пост-адгезионная стадия).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Белок Plscr1, традиционно считавшийся защитником от оболочечных вирусов, эффективно подавляет размножение безоболочечного мышиного норовируса (MNV) &lt;em&gt;in vitro&lt;/em&gt; и &lt;em&gt;in vivo&lt;/em&gt;, блокируя его проникновение в клетку на этапе после прикрепления.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR-скрининг — это метод высокопроизводительного поиска генов, при котором с помощью системы CRISPR/Cas9 поочередно выключают (нокаут) или активируют (активация) тысячи генов в клетках, чтобы выяснить, какие из них влияют на исследуемый процесс (например, на выживаемость клеток при вирусной инфекции).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Генетический анализ показал, что всего одна аминокислотная замена в малом капсидном белке VP2 делает норовирус устойчивым к действию Plscr1. Поскольку у калицивирусов белок VP2 отвечает за доставку вирусной РНК внутрь цитоплазмы путем формирования пор (прокалывания) в эндоцитозных мембранах, полученные данные указывают на то, что мишенью для Plscr1 служит именно этот поздний этап проникновения вируса. Таким образом, результаты исследования расширяют спектр противовирусного действия PLSCR1 на безоболочечные вирусы и выявляют неожиданную точку пересечения в путях проникновения вирусов с оболочкой и без нее.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Хотя исследование выполнено на модели мышиного норовируса (MNV), механизмы проникновения калицивирусов высококонсервативны, однако для подтверждения аналогичной роли человеческого PLSCR1 в отношении норовирусов человека требуются дополнительные клинические и клеточные исследования.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"plscr1-dostatochen-dlya-ogranicheniya-replikacii-mnv\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plscr1-dostatochen-dlya-ogranicheniya-replikacii-mnv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PLSCR1 достаточен для ограничения репликации MNV&lt;/span&gt;&lt;/a&gt;PLSCR1 достаточен для ограничения репликации MNV&lt;/h4&gt;\n&lt;p&gt;Для систематического поиска кандидатных противовирусных генов авторы проанализировали данные трех ранее проведенных полногеномных скринингов методом CRISPR. Все скрининги представляли собой пулированные анализы с использованием клеточной выживаемости после инфекции вирусом мышиного норовируса (MNV) в качестве селективного давления, но различались по типам клеток и стратегиям пертурбации. Первый скрининг представлял собой нокаутную библиотеку CRISPR высокой плотности в клетках BV2 (мышиной линии микроглии, естественным образом восприимчивой к MNV), где отрицательная селекция выявляла гены, нокаут которых повышал чувствительность к инфекции. Второй скрининг использовал подход активации CRISPR (CRISPRa) в клетках BV2, при котором сверхэкспрессия предполагаемых противовирусных генов давала клеткам преимущество в росте при заражении MNV. Третий скрининг также представлял собой CRISPRa-скрининг, но был выполнен в клетках HeLa, экспрессирующих рецептор MNV — CD300lf. Анализ этих трех независимых подходов стабильно выявил два гена с противовирусной активностью против MNV: IFITM2 и PLSCR1 (Рис. 1А). Оба гена относятся к интерферон-стимулированным генам (ISG), чья роль связана с подавлением проникновения оболочечных вирусов. IFITM2 входит в семейство трансмембранных белков IFITM, блокирующих проникхождение вируса из эндомембранных компартментов, хотя IFITM3 также ингибирует безоболочечный реовирус. Фосфолипидскрамблаза 1 (PLSCR1) индуцируется всеми тремя типами интерферонов (IFN) и блокирует слияние ВИЧ и SARS-CoV-2 с эндоцитарными мембранами, а другие оболочечные вирусы ингибирует через иные механизмы; однако до сих пор способность PLSCR1 подавлять безоболочечные вирусы не была показана. Поэтому авторы сосредоточились на изучении того, как PLSCR1 ограничивает репликацию MNV.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-f1.jpg\" alt=\"Рисунок 1: Plscr1 необходим для оптимального контроля инфекции MNV. (A) Диаграмма Венна, отображающая консервативные хит\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Рисунок 1: Plscr1 необходим для оптимального контроля инфекции MNV. (A) Диаграмма Венна, отображающая консервативные хиты по результатам трех различных скринингов. (B) Клетки HeLa-CD300lf, экспрессирующие либо пустой вектор, либо Plscr1, были инфицированы MNVCW3 (слева) или MNVCR6 (справа) с множественностью заражения (MOI), равной 0,05. Вирусная продукция подсчитывалась с помощью метода бляшкообразования (PFU; бляшкообразующие единицы). (C) Клетки HeLa-CD300lf, экспрессирующие мышиный или человеческий Plscr1, были заражены MNVCW3-HiBiT с MOI 0,5 в течение 48 часов. Инфекция количественно оценивалась с использованием системы литической детекции Nano-Glo HiBiT (RLU; относительные единицы люминесценции). (D) Представительный вестерн-блоттинг клеток HeLa-CD300lf, экспрессирующих мышиный (ms) или человеческий (hu) Plscr1 с FLAG-меткой, с использованием указанных антител. (E) Представительный вестерн-блоттинг клеток HeLa-CD300lf, экспрессирующих либо контрольный вектор, либо Plscr1, инфицированных MNVCW3 с MOI 5,0 и лизированных в указанные часы после заражения (hpi). (F) Представительный вестерн-блоттинг клеток HeLa-CD300lf или HeLaΔPlscr1-CD300lf, обработанных без интерферона, 1000 ед/мл интерферона α или 0,1 мкг/мл интерферона γ, с использованием указанных антител. (G) Клетки HeLa-CD300lf или HeLaΔPlscr1-CD300lf были заражены MNVCW3-HiBiT с MOI 0,5. Через 48 часов инфекция была количественно оцененена с использованием системы литической детекции Nano-Glo HiBiT. (H) Клетки HeLa-CD300lf или HeLaΔPlscr1-CD300lf обрабатывали указанными дозами интерферона α (Ед/мл), а затем заражали MNVCW3-HiBiT с MOI 0,5 в течение 48 часов. Инфекция была количественно оценена с использованием системы литической детекции Nano-Glo HiBiT. Эффективная концентрация 50 (EC50) для интерферона α была рассчитана для указанных типов клеток. (I) Экспрессия Plscr1 из тканей мышей из помета Plscr1+/+ (WT) или Plscr1-/- (KO). Штриховая линия указывает предел обнаружения. (J) Мыши из помета Plscr1+/+ (WT) или Plscr1-/- (KO) были заражены 1 × 10^6 PFU MNVCW3 и эвтаназированы через 3 дня после заражения. Толстая кишка, подвздошная кишка, брыжеечные лимфатические узлы (MLN), селезенка и печень были проанализированы с помощью ПЦР в реальном времени на наличие копий генома MNV с нормировкой на актин. Показаны индивидуальные точки данных вместе с виолонче-диаграммой для каждой ткани. Указаны P-значения по тесту Манна-Уитни. Штриховая линия указывает предел обнаружения. Все данные представлены в виде среднего значения ± стандартное отклонение по результатам трех независимых экспериментов и проанализированы с использованием однофакторного дисперсионного анализа (ANOVA) с тестом множественных сравнений Тьюки (B и C), t-теста (G) или теста Манна-Уитни (J). *P &amp;lt; 0,05, **P &amp;lt; 0,01, ***P &amp;lt; 0,001, ***&lt;em&gt;P &amp;lt; 0,0001.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;CRISPR-скрининги (нокаут и активация) — это высокопроизводительные генетические методы массового отключения или усиления работы генов в масштабах всего генома для поиска факторов, влияющих на выживаемость клеток при вирусной инфекции.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтобы проверить, достаточна ли сверхэкспрессия PLSCR1 для ингибирования MNV, авторы использовали клетки HeLa-CD300lf, отличающиеся генетической пластичностью. Хотя два штамма MNV (MNVCW3 и MNVCR6) активно реплицировали в контрольных клетках с пустым вектором, экспрессия мышиного Plscr1 значительно снижала вирусный рост (Рис. 1B). Несмотря на то, что мышиный и человеческий белки PLSCR1 имеют лишь 75% идентичности последовательностей, сверхэкспрессия любого из них подавляла репликацию MNV в клетках HeLa-CD300lf, что измерялось с помощью репортерной системы на основе расщепляемой люциферазы (MNV-HiBiT) (Рис. 1C и 1D). Согласуясь со снижением вирусной продукции, клетки, экспрессирующие Plscr1, демонстрировали минимальные уровни синтеза вирусного белка после заражения MNV по сравнению с контролем (Рис. 1E). В совокупности эти данные показывают, что PLSCR1 достаточен для ингибирования репликации MNV.&lt;/p&gt;\n&lt;h4 id=\"plscr1-neobhodim-dlya-ogranicheniya-mnv-in-vitro\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plscr1-neobhodim-dlya-ogranicheniya-mnv-in-vitro\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Plscr1 необходим для ограничения MNV in vitro&lt;/span&gt;&lt;/a&gt;Plscr1 необходим для ограничения MNV in vitro&lt;/h4&gt;\n&lt;p&gt;Для определения того, необходим ли PLSCR1 для оптимального ограничения MNV, исследователи получили клетки HeLa с нокаутом PLSCR1, экспрессирующие CD300lf (HeLaΔPLSCR1-CD300lf). Отсутствие PLSCR1 было подтверждено вестерн-блоттингом лизатов клеток HeLa-CD300lf и HeLaΔPLSCR1-CD300lf после стимуляции IFN-α или IFN-γ (Рис. 1F). В полном соответствии с данными скрининга, при заражении MNV-HiBiT в клетках HeLaΔPLSCR1-CD300lf наблюдалось увеличение репликации вируса по сравнению с исходными клетками HeLa-CD300lf (Рис. 1G). Поскольку ранее предполагалось, что PLSCR1 может либо усиливать ответ интерферона I типа, либо действовать как прямой противовирусный агент, авторы проверили чувствительность MNV к IFN-α при наличии или отсутствии эндогенного PLSCR1. Обработка IFN-α значительно снижала репликацию MNV дозозависимым образом независимо от экспрессии PLSCR1 (Рис. 1H). Значимых различий в значениях полумаксимальной эффективной концентрации (EC₅₀) между этими линиями клеток обнаружено не было, что указывает на то, что дефицит PLSCR1 не нарушает интерфероновый ответ I типа, направленный на ограничение MNV (Рис. 1H). Таким образом, результаты подтверждают, что PLSCR1 функционирует как прямой противовирусный компонент, необходимый для оптимального контроля MNV.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Нокаут PLSCR1 приводит к росту репликации MNV, но не изменяет чувствительность к интерферону I типа (EC₅₀ не отличается), что доказывает прямую противовирусную роль PLSCR1.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"u-myshej-s-deficitom-plscr1-nablyudaetsya-umerennoe-uvelichenie-replikacii-mnv-v-tolstom-kishechnike\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#u-myshej-s-deficitom-plscr1-nablyudaetsya-umerennoe-uvelichenie-replikacii-mnv-v-tolstom-kishechnike\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;У мышей с дефицитом Plscr1 наблюдается умеренное увеличение репликации MNV в толстом кишечнике&lt;/span&gt;&lt;/a&gt;У мышей с дефицитом Plscr1 наблюдается умеренное увеличение репликации MNV в толстом кишечнике&lt;/h4&gt;\n&lt;p&gt;Интерфероновая сигнализация определяет динамику инфекции MNV in vivo, однако конкретные эффекторы в виде ISG-белков изучены недостаточно. Авторы использовали мышей с нокаутом гена Plscr1 (Plscr1⁻/-), описанных ранее, и оценили уровень транскриптов Plscr1 в тканях, значимых для инфекции MNV. Транскрипты Plscr1 детектировались во всех исследованных тканях диких мышей — с максимальной экспрессией в толстой и подвздошной кишках, тогда как у нокаутных мышей транскрипты отсутствовали (Рис. 1I). Мышей с достаточным уровнем Plscr1 и дефицитных по нему перорально заражали штаммом MNVCW3, после чего собирали ткани на 3-й день после инфекции (Рис. 1J). Согласуясь с предыдущими отчетами, геномы MNVCW3 были обнаружены в селезенке, печени и мезентериальных лимфатических узлах (MLN) мышей дикого типа.&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;p&gt;Клеточные линии и культивирование&lt;/p&gt;\n&lt;p&gt;Для экспериментов использовались линии клеток 293T, HeLa и BV2, которые культивировались в среде Dulbecco’s Modified Eagle Medium с добавлением 5% фетальной сыворотки крови крупного рогатого скота. Стабильные клеточные линии с повышенной экспрессией получали с помощью лентивирусной трансдукции. Для этого лентивирусные плазмиды ко-трансфицировали вместе с упаковывающим вектором psPax2 и псевдотипирующим вектором pCMV-VSV-G в клетки 293T с использованием реагента PEI от Polysciences. Спустя 48 часов после трансдукции лентивирус собирали, фильтровали через фильтр с размером пор 0.45 мкм и добавляли к клеткам. Еще через 48 часов среду заменяли на селективную, содержащую 350 мкг/мл гигромицина, 5 мкг/мл бластицидина и/или 1 мкг/мл пуромицина. Регулярная проверка всех линий подтвердила отсутствие контаминации микоплазмой.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Лентивирусная трансдукция и селекция антибиотиками позволяют внедрить нужный генетический материал в геном клеток и оторочить стабильные популяции, выживающие под воздействием токсичных агентов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для получения нокаутных клеток HeLaΔPlscr1 родительские клетки HeLa ко-трансфицировали плазмидами pSpCas9(BB)-2A-Blast и pSpCas9(BB)-2A-Puro, содержащими специфичные направляющие РНК для гена PLSCR1 с последовательностями puro: 5’ GGGTCAAGAAGTCATAACTC 3’ и blast: 5’ TCAGGAGGTCTGTGATCAAT 3’. Через 48 часов после трансфекции в течение двух дней проводили селекцию с 5 мкг/мл бластицидина и 1 мкг/мл пуромицина, после чего клетки отмывали и переводили в среду без антибиотиков. Одиночные клеточные клоны выделяли методом предельного разведения с последующим выделением геномной ДНК с использованием набора Zymo D3025. ДНК амплифицировали с праймерами (прямый: 5’ ggggtatcatcaaaaactgg 3’; обратный: 5’ gcacacaacacatggaccac 3’). Наличие инсерций и делеций (инделов) скринировали с помощью Сэнгер-секвенирования отдельных ПЦР-реакций, клонированных в pCR-Blunt II-Topo с применением набора Zero Blunt Topo Kit. Полученный клон HeLaΔPlscr1 содержит специфические аллели с инделовскими мутациями и стоп-кодонами.&lt;/p&gt;\n&lt;h4 id=\"virusnye-analizy\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#virusnye-analizy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вирусные анализы&lt;/span&gt;&lt;/a&gt;Вирусные анализы&lt;/h4&gt;\n&lt;p&gt;Штаммы MNVCW3, MNVCR6 и их мутантные варианты получали путем трансфекции молекулярных клонов в клетки 293T с последующей амплификацией на клетках BV2. Для заражения вирусом клетки HeLa-CD300lf высевали в 96-луночные планшеты и на следующий день инокулировали 25 мкл штаммов MNV при множественности заражения MOI 0.05. Планшеты инкубировали на качалке в течение 1 часа при комнатной температуре, после чего добавляли еще 75 мкл среды. Образцы инкубировали при 37 °C в атмосфере 5% \textCO₂ и замораживали при −80 °C в заданные временные точки. Вирусные титры определяли методом бляшкообразования. Анализы MNV-HiBiT проводили, высевая 10⁴ клеток H1 HeLa-CD300lf в 96-луночные планшеты и инокулируя их 25 мкл штаммов MNV при MOI 0.5 или 5. После инкубации на качалке в течение 1 часа при комнатной температуре и добавления 75 мкл среды образцы инкубировали при 37 °C и 5% \textCO₂ с последующим замораживанием при −80 °C. Люминесцентную активность после оттаивания измеряли на мультимодельном ридере Synergy LX с использованием системы Nano-Glo HiBiT Lytic Detection System.&lt;/p&gt;\n&lt;h4 id=\"plazmidnye-konstrukcii\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plazmidnye-konstrukcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Плазмидные конструкции&lt;/span&gt;&lt;/a&gt;Плазмидные конструкции&lt;/h4&gt;\n&lt;p&gt;КДНК мышиного и человеческого белков Plscr1 вместе с соответствующими мутациями были клонированы в лентивирусный вектор pCDH-EF1-MCS-IRES-Puro с N-концевой меткой 3xFLAG. Молекулярные клоны для MNVCW3 (GenBank EF014462.1) и MNVCR6 (GenBank JQ237823) описывались ранее. Перед использованием все плазмидные последовательности были проверены методом полноплазмидного секвенирования.&lt;/p&gt;\n&lt;h4 id=\"immunoblotting\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#immunoblotting\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Иммуноблоттинг&lt;/span&gt;&lt;/a&gt;Иммуноблоттинг&lt;/h4&gt;\n&lt;p&gt;Образцы, лизированные в буфере Лэммли, разделяли с помощью SDS-ПААГ и переносили на PVDF-мембраны. Мембраны блокировали раствором TBS-T с добавлением 5% сухого обезжиренного молока перед инкубацией с первичными антителами. В работе использовались мышиные антитела α-Plscr1 (1:1,000; Sigma MABS482), α-GAPDH-HRP (1:10,000; Sigma G9295), α-FLAG M2-HRP (1:2,500; Sigma A8592), а также кроличьи антитела α-STAT1 phospho Y701 (1:1,000; Cell Signaling 9167S), α-STAT1 (1:1,000; Cell Signaling 9172S), вторичные антитела α-rabbit-HRP (1:10,000; Thermo Fisher 34102) и α-mouse-HRP (1:10,000; Cell Signaling 7076S). Антитела против неструктурных белков MNV (мышиные α-NS1 и кроличьи α-NS6/7) также применялись стандартным образом. Ниже приведена последовательность клонов: дикий тип N M G Q E V I T L E R P L R C S (182 ААТ АТГ ГГТ КАА ГАА ГТК АТА АКТ КТГ ГАГ АГА ККА КТА АГА ТГТ АГК), а также варианты с делециями на 17 пар оснований (17 base pair deletion), 25 пар оснований (25 base pair deletion) и 5 пар оснований (5 base pair deletion).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-f2.jpg\" alt=\"Рис. 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-fS1.jpg\" alt=\"Рис. S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-fS2.jpg\" alt=\"Дополнительный рисунок 2: Оригинальные вестерн-блоты, использованные в рукописи. Неизмененные хемилюминесцентные изображ\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Дополнительный рисунок 2: Оригинальные вестерн-блоты, использованные в рукописи. Неизмененные хемилюминесцентные изображения иммуноблотов, соответствующие блотам, представленным на рисунке 3.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Неизвестны&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;факторы защиты&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;от норовируса&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Скрининг&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;генома CRISPR&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;и тесты на&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мышах&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Белок Plscr1&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;блокирует вход&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;вируса&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Новый взгляд&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;на защиту от&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;вирусов&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не прошёл рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th
