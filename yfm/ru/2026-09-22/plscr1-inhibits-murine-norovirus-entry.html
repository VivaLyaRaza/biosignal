        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"273\" cy=\"121\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"667\" cy=\"296\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · MICROBIOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Белок Plscr1 останавливает&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;проникновение мышиного&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;норовируса&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-f1.jpg\" alt=\"Рисунок 1: Plscr1 необходим для оптимального контроля инфекции MNV.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Plscr1 необходим для оптимального контроля инфекции &lt;a href=\"concepts/murine-norovirus.html\"&gt;MNV&lt;/a&gt;.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1: Plscr1 необходим для оптимального контроля инфекции MNV. (A) Диаграмма Венна, отображающая общие «хиты» (положительные результаты), выявленные в трех различных скринингах. (B) Клетки HeLa-CD300lf, экспрессирующие пустой вектор или Plscr1, были инфицированы MNVCW3 (слева) или MNVCR6 (справа) с множественностью инфекции (&lt;a href=\"concepts/moi.html\"&gt;MOI&lt;/a&gt;) 0,05. Вирусная продукция оценивалась с помощью метода бляшек (PFU; &lt;a href=\"concepts/pfe.html\"&gt;бляшкообразующие единицы&lt;/a&gt;). (C) Клетки HeLa-CD300lf, экспрессирующие мышиный или человеческий Plscr1, были заражены MNVCW3-HiBiT с MOI 0,5 в течение 48 часов. Инфекция количественно оценивалась с использованием системы Nano-Glo HiBiT Lytic Detection System (RLU; относительные единицы люминесценции). (D) Представительный вестерн-блот клеток HeLa-CD300lf, экспрессирующих мышиный (ms) или человеческий (hu) Plscr1 с FLAG-меткой, окрашенных указанными антителами. (E) Представительный вестерн-блот клеток HeLa-CD300lf, экспрессирующих вектор контроля или Plscr1, инфицированных MNVCW3 с MOI 5,0 и лизированных через указанное количество часов после инфекции (hpi). (F) Представительный вестерн-блот клеток HeLa-CD300lf или HeLaΔPlscr1-CD300lf, не получавших интерферон, обработанных 1000 ед./мл интерферона α или 0,1 мкг/мл интерферона γ, окрашенных указанными антителами. (G) Клетки HeLa-CD300lf или HeLaΔPlscr1-CD300lf были заражены MNVCW3-HiBiT с MOI 0,5. Через 48 часов инфекция была количественно оценена с использованием системы Nano-Glo HiBiT Lytic Detection System. (H) Клетки HeLa-CD300lf или HeLaΔPlscr1-CD300lf обрабатывали указанными дозами интерферона α (ед./мл), а затем заражали MNVCW3-HiBiT с MOI 0,5 в течение 48 часов. Инфекция была количественно оценена с использованием системы Nano-Glo HiBiT Lytic Detection System. Для интерферона α была рассчитана эффективная концентрация 50 (EC50) для указанных типов клеток. (I) Экспрессия Plscr1 у однопометников Plscr1+/+ (WT) или Plscr1-/- (KO) в указанных тканях. Пунктирная линия указывает &lt;a href=\"concepts/limit-of-detection.html\"&gt;предел обнаружения&lt;/a&gt;. (J) Однопометники Plscr1+/+ (WT) или Plscr1-/- (KO) были инфицированы 1 x 10^6 PFU MNVCW3 и эвтаназированы через 3 дня после инфекции. Толстая кишка, подвздошная кишка, брыжеечные лимфатические узлы (MLN), селезенка и печень были проанализированы с помощью кПЦР на наличие копий генома MNV с нормализацией по актину. Показаны отдельные точки данных вместе со скрипичной диаграммой для каждой ткани. Указаны P-значения теста Манна-Уитни. Пунктирная линия указывает предел обнаружения. Все данные представлены как среднее ± стандартное отклонение по результатам трех независимых экспериментов и проанализированы с помощью однофакторного дисперсионного анализа (ANOVA) с тестом множественных сравнений Тьюки (B и C), T-теста (G) или теста Манна-Уитни (J). *P &amp;lt; 0,05, **P &amp;lt; 0,01, ***P &amp;lt; 0,001, ****P &amp;lt; 0,0001.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Норовирусы вызывают кишечные инфекции, проникая внутрь клеток через сложные молекулярные механизмы. Исследователи выяснили, что белок Plscr1 играет роль «сторожа», блокируя вирус на этапе входа. Это открытие помогает понять, как именно иммунная система ограничивает распространение вируса в организме.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Plscr1 ограничивает проникновение мышиного норовируса в клетки&lt;/li&gt;\n&lt;li&gt;Дефицит Plscr1 приводит к росту вирусной репликации&lt;/li&gt;\n&lt;li&gt;Белок препятствует слиянию вируса с мембраной эндосомы&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Норовирусы (семейство Caliciviridae) используют специфические рецепторы на поверхности клеток для инициации инфекции. В данном исследовании изучалась роль белка Plscr1 (фосфолипид-скрамблаза 1), который участвует в перераспределении липидов в мембранах. Авторы использовали модель мышиного норовируса (MNV) для анализа взаимодействия вирусных частиц с клеточными структурами.&lt;/p&gt;\n&lt;p&gt;Эксперименты показали, что Plscr1 ограничивает способность вируса проникать в цитозоль. При нокауте гена Plscr1 в клетках наблюдалось значительное увеличение вирусной нагрузки, что указывает на защитную функцию этого белка. Механизм действия связан с изменением свойств мембраны, что препятствует слиянию вирусной оболочки с эндосомой.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проведено на мышиной модели, поэтому механизмы взаимодействия с человеческими норовирусами могут отличаться.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Норовирусы остаются одной из главных причин гастроэнтерита в мире, однако клеточные механизмы, ограничивающие их репликацию, изучены недостаточно. Используя полногеномный скрининг CRISPR-активации и CRISPR-нокаута, исследователи выявили ген Plscr1, стимулируемый интерфероном, как фактор, ограничивающий размножение мышиного норовируса (MNV). Ранее было известно, что Plscr1 препятствует слиянию оболочечных вирусов с эндоцитарными мембранами, поэтому его антивирусная активность против безоболочечного MNV стала неожиданным результатом.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/crispr-screening.html\"&gt;CRISPR-скрининг&lt;/a&gt; — это метод «генетического сита», позволяющий отключать (&lt;a href=\"concepts/knock-out.html\"&gt;нокаут&lt;/a&gt;) или активировать (активация) тысячи генов в клетках, чтобы увидеть, как это влияет на устойчивость к вирусу.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эксперименты показали, что Plscr1 необходим и достаточен для ограничения инфекции MNV in vitro, а также участвует в контроле вирусной нагрузки в толстой кишке у мышей. Механистический анализ установил, что Plscr1 блокирует проникновение MNV в клетку на этапе, следующем за прикреплением вируса к поверхности.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Plscr1 подавляет инфекцию MNV, блокируя проникновение вируса в клетку после его прикрепления.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проведено на клеточных культурах и мышиных моделях; результаты требуют проверки для понимания применимости к человеку.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Установлено, что единичная аминокислотная замена в минорном капсидном белке &lt;a href=\"concepts/vp2-capsid-protein.html\"&gt;VP2&lt;/a&gt; делает вирус устойчивым к действию Plscr1. Поскольку белок VP2 отвечает за доставку вирусной РНК путем прокола эндоцитарных мембран в процессе проникновения калицивирусов, эти данные указывают на то, что Plscr1 воздействует на поздние стадии процесса входа вируса в клетку. Полученные результаты расширяют спектр известной антивирусной активности PLSCR1, включая в него безоболочечные вирусы, и выявляют неожиданную точку пересечения путей проникновения оболочечных и безоболочечных вирусов.&lt;/p&gt;\n&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Норовирусы — это безоболочечные РНК-вирусы с положительной цепью, вызывающие вирусный гастроэнтерит. Экономический ущерб от них огромен: только в США ежегодные затраты составляют 10,6 млрд долларов. Изучение норовирусов человека (HNoV) долгое время было затруднено из-за невозможности их культивирования и отсутствия малых лабораторных моделей. Ситуация изменилась с появлением энтероидов кишечника человека (HIE), однако создание стабильных систем для изучения биологии HNoV остается сложной задачей, несмотря на появление инфекционных молекулярных клонов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Норовирусы вызывают значительный экономический ущерб, а их изучение стало возможным благодаря развитию систем культивирования HIE и использованию мышиных моделей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мышиный норовирус (MNV) служит удобной моделью, так как он активно размножается в клеточных линиях и позволяет изучать инфекцию in vivo. Хотя мыши не подвержены рвоте, а диарея у них встречается редко, MNV и HNoV имеют схожую организацию генома, механизмы репликации и пути передачи. Штаммы MNV различаются по чувствительности к интерферонам (IFN). Например, штамм MNVCW3 летален для мышей с дефицитом рецепторов IFN-α/βR−/−, а передача сигналов IFN I и III типов ограничивает инфекцию в туфтовых клетках кишечника.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Энтероиды (HIE) — это трехмерные клеточные структуры, полученные из стволовых клеток кишечника, которые имитируют его функции и позволяют выращивать вирусы, ранее не поддававшиеся культивированию.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Несмотря на роль IFN в патогенезе, конкретные интерферон-стимулированные гены (ISG), ограничивающие норовирусы, остаются неизвестными. Анализ данных CRISPR/Cas9-скринингов позволил авторам выделить фосфолипид-скрамблазу 1 (PLSCR1) как фактор рестрикции MNV. PLSCR1 индуцируется интерферонами всех трех типов и известен способностью блокировать слияние оболочек вирусов (например, ВИЧ или SARS-CoV-2) с мембранами. В данной работе исследуется, способен ли PLSCR1 ограничивать безоболочечные вирусы, такие как MNV.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на модели MNV у мышей; перенос результатов на человека требует осторожности, так как механизмы взаимодействия вируса и хозяина могут различаться.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"plscr1-dostatochno-dlya-ogranicheniya-replikacii-mnv\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plscr1-dostatochno-dlya-ogranicheniya-replikacii-mnv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PLSCR1 достаточно для ограничения репликации MNV&lt;/span&gt;&lt;/a&gt;PLSCR1 достаточно для ограничения репликации MNV&lt;/h4&gt;\n&lt;p&gt;Мы проанализировали данные трех полногеномных CRISPR-скринингов, чтобы выявить потенциальные антивирусные гены. В первом исследовании на клетках микроглии мышей BV2 применялся метод нокаута (CRISPR knockout), где отбирались гены, потеря которых повышала чувствительность к вирусу мышиного норовируса (MNV). Во втором скрининге на тех же клетках BV2 использовалась активация генов (CRISPRa), при которой сверхэкспрессия антивирусных факторов давала клеткам преимущество в выживании. Третий скрининг (CRISPRa) проводился на клетках HeLa, экспрессирующих рецептор MNV — CD300lf. Анализ показал, что гены IFITM2 и PLSCR1 стабильно проявляют антивирусную активность против MNV (Рис. 1A).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-f1.jpg\" alt=\"Рисунок 1: Plscr1 необходим для оптимального контроля инфекции MNV.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Plscr1 необходим для оптимального контроля инфекции MNV.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1: Plscr1 необходим для оптимального контроля инфекции MNV. (A) Диаграмма Венна, отображающая общие «хиты» (положительные результаты), выявленные в трех различных скринингах. (B) Клетки HeLa-CD300lf, экспрессирующие пустой вектор или Plscr1, были инфицированы MNVCW3 (слева) или MNVCR6 (справа) с множественностью инфекции (MOI) 0,05. Вирусная продукция оценивалась с помощью метода бляшек (PFU; бляшкообразующие единицы). (C) Клетки HeLa-CD300lf, экспрессирующие мышиный или человеческий Plscr1, были заражены MNVCW3-HiBiT с MOI 0,5 в течение 48 часов. Инфекция количественно оценивалась с использованием системы Nano-Glo HiBiT Lytic Detection System (RLU; относительные единицы люминесценции). (D) Представительный вестерн-блот клеток HeLa-CD300lf, экспрессирующих мышиный (ms) или человеческий (hu) Plscr1 с FLAG-меткой, окрашенных указанными антителами. (E) Представительный вестерн-блот клеток HeLa-CD300lf, экспрессирующих вектор контроля или Plscr1, инфицированных MNVCW3 с MOI 5,0 и лизированных через указанное количество часов после инфекции (hpi). (F) Представительный вестерн-блот клеток HeLa-CD300lf или HeLaΔPlscr1-CD300lf, не получавших интерферон, обработанных 1000 ед./мл интерферона α или 0,1 мкг/мл интерферона γ, окрашенных указанными антителами. (G) Клетки HeLa-CD300lf или HeLaΔPlscr1-CD300lf были заражены MNVCW3-HiBiT с MOI 0,5. Через 48 часов инфекция была количественно оценена с использованием системы Nano-Glo HiBiT Lytic Detection System. (H) Клетки HeLa-CD300lf или HeLaΔPlscr1-CD300lf обрабатывали указанными дозами интерферона α (ед./мл), а затем заражали MNVCW3-HiBiT с MOI 0,5 в течение 48 часов. Инфекция была количественно оценена с использованием системы Nano-Glo HiBiT Lytic Detection System. Для интерферона α была рассчитана эффективная концентрация 50 (EC50) для указанных типов клеток. (I) Экспрессия Plscr1 у однопометников Plscr1+/+ (WT) или Plscr1-/- (KO) в указанных тканях. Пунктирная линия указывает предел обнаружения. (J) Однопометники Plscr1+/+ (WT) или Plscr1-/- (KO) были инфицированы 1 x 10^6 PFU MNVCW3 и эвтаназированы через 3 дня после инфекции. Толстая кишка, подвздошная кишка, брыжеечные лимфатические узлы (MLN), селезенка и печень были проанализированы с помощью кПЦР на наличие копий генома MNV с нормализацией по актину. Показаны отдельные точки данных вместе со скрипичной диаграммой для каждой ткани. Указаны P-значения теста Манна-Уитни. Пунктирная линия указывает предел обнаружения. Все данные представлены как среднее ± стандартное отклонение по результатам трех независимых экспериментов и проанализированы с помощью однофакторного дисперсионного анализа (ANOVA) с тестом множественных сравнений Тьюки (B и C), T-теста (G) или теста Манна-Уитни (J). *P &amp;lt; 0,05, **P &amp;lt; 0,01, ***P &amp;lt; 0,001, ****P &amp;lt; 0,0001.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR-скрининг — метод систематического отключения (knockout) или активации (CRISPRa) всех генов в геноме для поиска тех, что влияют на выживаемость клеток при вирусной инфекции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;IFITM2 и PLSCR1 являются интерферон-стимулируемыми генами (ISG). Известно, что IFITM2 блокирует проникновение вирусов из эндомембранных компартментов, а PLSCR1 препятствует слиянию оболочечных вирусов (например, ВИЧ, SARS-CoV-2) с мембранами. Поскольку PLSCR1 ранее не рассматривался как ингибитор безоболочечных вирусов, мы сфокусировались на его роли в ограничении MNV. В экспериментах на клетках HeLa-CD300lf сверхэкспрессия мышиного Plscr1 значительно подавляла рост штаммов MNV (MNVCW3 и MNVCR6) по сравнению с контрольными клетками (Рис. 1B). Несмотря на то, что гомология последовательностей мышиного и человеческого PLSCR1 составляет 75%, оба белка эффективно подавляли репликацию MNV, что подтверждено с помощью репортерной системы MNV-HiBiT (Рис. 1C, 1D). В клетках с экспрессией Plscr1 уровень вирусных белков был крайне низким (Рис. 1E).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сверхэкспрессия PLSCR1 мыши или человека в клетках HeLa-CD300lf подавляет репликацию MNV, что подтверждается снижением вирусной нагрузки и уровня вирусных белков.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"plscr1-neobhodim-dlya-ogranicheniya-mnv-in-vitro\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plscr1-neobhodim-dlya-ogranicheniya-mnv-in-vitro\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Plscr1 необходим для ограничения MNV in vitro&lt;/span&gt;&lt;/a&gt;Plscr1 необходим для ограничения MNV in vitro&lt;/h4&gt;\n&lt;p&gt;Для проверки необходимости PLSCR1 мы создали линию клеток HeLaΔPLSCR1-CD300lf с нокаутом этого гена, что подтвердили методом вестерн-блоттинга после стимуляции интерфероном (Рис. 1F). В отсутствие PLSCR1 репликация MNV-HiBiT в клетках HeLaΔPLSCR1-CD300lf возрастала по сравнению с контролем (Рис. 1G). Чтобы выяснить, является ли PLSCR1 прямым антивирусным агентом или усилителем интерферонового ответа, мы сравнили чувствительность клеток к IFN-α. Обработка интерфероном снижала репликацию MNV независимо от наличия PLSCR1, при этом значения EC₅₀ не имели статистически значимых различий (Рис. 1H). Это указывает на то, что PLSCR1 действует как прямой антивирусный фактор, а не через модуляцию сигнального пути интерферона.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проведено на клеточных линиях in vitro; результаты могут не отражать сложность взаимодействия вируса и иммунной системы в целом организме.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"plscr1-deficitnye-myshi-demonstriruyut-umerennoe-uvelichenie-replikacii-mnv-v-tolstoj-kishke\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plscr1-deficitnye-myshi-demonstriruyut-umerennoe-uvelichenie-replikacii-mnv-v-tolstoj-kishke\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Plscr1-дефицитные мыши демонстрируют умеренное увеличение репликации MNV в толстой кишке&lt;/span&gt;&lt;/a&gt;Plscr1-дефицитные мыши демонстрируют умеренное увеличение репликации MNV в толстой кишке&lt;/h4&gt;\n&lt;p&gt;Сигнальные пути интерферона регулируют динамику инфекции вируса мышиного норовируса (MNV) in vivo. Однако конкретные эффекторы ISG (генов, стимулируемых интерфероном), ограничивающие инфекцию, изучены недостаточно. Исследователи использовали мышей линии Plscr1-/-, у которых уровень транскриптов Plscr1 был предварительно оценен в тканях, чувствительных к MNV. У мышей дикого типа экспрессия Plscr1 была наиболее высокой в толстой и подвздошной кишках, тогда как у нокаутных мышей транскрипты отсутствовали (Рис. 1I). При пероральном заражении MNVCW3 через 3 дня после инфекции (Рис. 1J) геномы вируса были обнаружены в селезенке, печени и мезентериальных лимфоузлах (MLN) у всех мышей. В подвздошной и толстой кишках у мышей дикого типа вирус практически не выявлялся. У Plscr1-дефицитных мышей динамика инфекции в селезенке, печени и MLN не отличалась от контроля, однако в толстой кишке наблюдалось статистически значимое, хотя и умеренное, увеличение количества MNVCW3 (Рис. 1J). В подвздошной кишке наблюдалась аналогичная тенденция, не достигшая статистической значимости. Эти данные указывают на то, что Plscr1 подавляет репликацию MNVCW3 в толстой кишке, но, вероятно, существуют и другие эффекторы ISG.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дефицит Plscr1 приводит к умеренному росту репликации MNV в толстой кишке, что указывает на частичную роль этого белка в противовирусной защите.&lt;br /&gt;\n[!warning] Исследование проведено на мышах; результаты не могут быть напрямую экстраполированы на человека без дополнительных данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"geneticheskij-skrining-vyyavil-zamenu-v-vp2,-obespechivayushuyu-ustojchivost-k-plscr1\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#geneticheskij-skrining-vyyavil-zamenu-v-vp2,-obespechivayushuyu-ustojchivost-k-plscr1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Генетический скрининг выявил замену в VP2, обеспечивающую устойчивость к Plscr1&lt;/span&gt;&lt;/a&gt;Генетический скрининг выявил замену в VP2, обеспечивающую устойчивость к Plscr1&lt;/h4&gt;\n&lt;p&gt;Для изучения механизма действия Plscr1 был проведен прямой генетический скрининг: вирус MNVCR6 адаптировали к росту в клетках HeLa-CD300lf, экспрессирующих Plscr1, в течение 11 пассажей (Рис. 2A). Вирус, прошедший 11 пассажей в присутствии Plscr1 (Plscr1 p11), показал преимущество в росте по сравнению с контролем (Рис. 2B). Секвенирование ампликонов (Рис. 2C, Таблица SN) выявило три генетических изменения с частотой более 30% в популяции Plscr1 p11 (Рис. 2D). Из них две мутации были миссенс-мутациями (NS2F304L и VP2Q32R; Рис. 2E). Введение этих замен в молекулярный клон MNVCR6 показало, что только мутация VP2Q32R позволяет вирусу расти в клетках, экспрессирующих Plscr1, подтверждая её роль как мутации «побега» (Рис. 2F). Капсид норовируса включает белки VP1 и VP2. Хотя роль VP2 изучена слабо, данные по калицивирусам (FCV) предполагают, что VP2 формирует портальную структуру для проникновения РНК в цитоплазму. Влияние замены Q32R на сборку этого портала или упаковку генома остается предметом дальнейших исследований.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-f2.jpg\" alt=\"Рис. 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 2&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мутация «побега» — это генетическое изменение в вирусе, которое позволяет ему преодолеть защитный барьер клетки, в данном случае — подавляющее действие белка Plscr1.&lt;br /&gt;\n[!tip] Секвенирование ампликонов — метод анализа специфических участков генома, позволяющий быстро выявить мутации, возникшие в ходе адаптации вируса.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"plscr1-trebuet-uchastkov-vzaimodejstviya-s-membranoj-dlya-blokirovaniya-proniknoveniya-mnv-posle-prikrepleniya\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plscr1-trebuet-uchastkov-vzaimodejstviya-s-membranoj-dlya-blokirovaniya-proniknoveniya-mnv-posle-prikrepleniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Plscr1 требует участков взаимодействия с мембраной для блокирования проникновения MNV после прикрепления&lt;/span&gt;&lt;/a&gt;Plscr1 требует участков взаимодействия с мембраной для блокирования проникновения MNV после прикрепления&lt;/h4&gt;\n&lt;p&gt;Поскольку белок VP2 участвует как в проникновении вируса, так и в его сборке, был проведен эксперимент по обходу этапа проникновения. Трансфекция вирусной РНК MNVCW3 в клетки HeLa, экспрессирующие Plscr1, привела к восстановлению титров вируса до уровня контрольных клеток (Рис. 3A). Это подтверждает, что Plscr1 подавляет именно стадию проникновения MNV. Анализ связывания вируса с клетками показал, что экспрессия CD300lf значительно увеличивает связывание MNV, однако наличие Plscr1 не влияет на этот процесс независимо от присутствия CD300lf (Рис. 3B). Это указывает на то, что Plscr1 блокирует этап проникновения, следующий за связыванием.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Plscr1 подавляет проникновение MNV на этапе после прикрепления вируса к клетке, при этом его антивирусная активность не зависит от способности связываться с рецептором CD300lf.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для изучения механизмов действия Plscr1 были протестированы мутантные формы белка. Мутация в сайте ядерной локализации (267AISAA271) привела к снижению экспрессии белка, поэтому она была исключена из анализа. Мутант Plscr1F290A, который, согласно литературе, теряет активность скрамблазы, сохранил способность блокировать репликацию MNV в клетках HeLa-CD300lf (Рис. 3D и 3E). Напротив, нарушение сайта пальмитоилирования (мутант Plscr1PalmA, 193AAFPAA198) существенно ослабляло способность Plscr1 ограничивать MNV (Рис. 3D и 3E).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Пальмитоилирование — это процесс присоединения жирных кислот к белку, который помогает ему прочно закрепиться в клеточной мембране.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на клеточных линиях HeLa; результаты показывают корреляцию между мембранной ассоциацией и антивирусным эффектом, но не доказывают причинно-следственную связь для всех типов клеток.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Исследователи также изучили влияние полиморфизмов PLSCR1, связанных с тяжестью COVID-19 у людей. Варианты человеческого PLSCR1 с гистидином, тирозином или глутамином в положении 262 одинаково эффективно ограничивали репликацию MNV (Рис. 3F и 3H). Введение «человеческого» полиморфизма (тирозин) в мышиный Plscr1 также не снизило его противовирусную активность (Рис. 3G и 3H). Таким образом, механизм ограничения MNV белком Plscr1 отличается от механизма действия против SARS-CoV-2, так как он не чувствителен к полиморфизмам в положении 262.&lt;/p&gt;\n&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;h4 id=\"mehanizm-ogranicheniya-virusa-mnv-belkom-plscr1\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#mehanizm-ogranicheniya-virusa-mnv-belkom-plscr1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Механизм ограничения вируса MNV белком PLSCR1&lt;/span&gt;&lt;/a&gt;Механизм ограничения вируса MNV белком PLSCR1&lt;/h4&gt;\n&lt;p&gt;В данном исследовании установлено, что белок PLSCR1 подавляет проникновение вируса мышиного норовируса (MNV), который не имеет липидной оболочки. Процесс ингибирования происходит на этапе после прикрепления вируса к клетке (Рис. 3A, 3B). Мутация в одной точке белка VP2 (VP2Q32R) позволяет вирусу преодолеть этот барьер (Рис. 2F). Учитывая, что VP2 формирует канал для доставки вирусной РНК из эндосом в цитоплазму через прокол мембраны, мы предполагаем, что PLSCR1 изменяет свойства эндоцитарных мембран, блокируя выход РНК. Точный механизм того, как мутация Q32R обходит это препятствие, остается неясным, однако данная замена служит инструментом для изучения этого процесса.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PLSCR1 ограничивает проникновение безоболочечного вируса MNV, воздействуя на механизмы прохождения через мембрану, что сближает его с защитой от оболочечных вирусов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ISG (интерферон-стимулированные гены) — гены, активность которых повышается в ответ на интерфероны для борьбы с инфекциями.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rol-plscr1-v-sisteme-vrozhdennogo-immuniteta\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#rol-plscr1-v-sisteme-vrozhdennogo-immuniteta\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Роль PLSCR1 в системе врожденного иммунитета&lt;/span&gt;&lt;/a&gt;Роль PLSCR1 в системе врожденного иммунитета&lt;/h4&gt;\n&lt;p&gt;Хотя PLSCR1 необходим для эффективного подавления MNV in vitro, его отсутствие не привело к значимым изменениям в общем ответе на интерферон I типа (Рис. 1H). Это указывает на наличие других ISG, ограничивающих MNV. У мышей с дефицитом Plscr1 наблюдалось лишь незначительное повышение вирусной нагрузки MNVCW3 в толстой кишке (Рис. 1J). Наши данные, включая выявление IFITM2, подтверждают, что PLSCR1, вероятно, является лишь частью широкого барьера, индуцируемого интерфероном, а не единственным ключевым эффектором.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на клеточных культурах и мышиных моделях; результаты на животных не всегда прямо экстраполируются на человека.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"funkcionalnye-domeny-plscr1-i-virusnaya-specifichnost\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#funkcionalnye-domeny-plscr1-i-virusnaya-specifichnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Функциональные домены PLSCR1 и вирусная специфичность&lt;/span&gt;&lt;/a&gt;Функциональные домены PLSCR1 и вирусная специфичность&lt;/h4&gt;\n&lt;p&gt;Мы установили, что для ограничения MNV не требуется активность фосфолипидной скрамблазы, но необходим интактный мотив пальмитоилирования (Рис. 3D). Аналогичная зависимость от пальмитоилирования, а не от скрамблазной активности, наблюдается при подавлении SARS-CoV-2. Однако варианты PLSCR1 H262 и Y262 ограничивают MNV одинаково, в отличие от их влияния на SARS-CoV-2, что указывает на различия в механизмах защиты от разных типов вирусов. Таким образом, PLSCR1 накладывает общие ограничения на принципиально разные классы вирусов, несмотря на их уникальные стратегии проникновения.&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"kletochnye-linii-i-kultivirovanie\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#kletochnye-linii-i-kultivirovanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Клеточные линии и культивирование&lt;/span&gt;&lt;/a&gt;Клеточные линии и культивирование&lt;/h4&gt;\n&lt;p&gt;Клетки 293T, HeLa и BV2 выращивали в среде DMEM с добавлением 5% фетальной бычьей сыворотки. Стабильные линии с гиперэкспрессией генов получали методом лентивирусной трансдукции. Для этого лентивирусные плазмиды совместно с упаковочным вектором (psPax2) и вектором псевдотипирования (pCMV-VSV-G) вносили в клетки 293T с использованием полиэтиленимина (PEI). Через 48 часов вирус собирали, фильтровали (0,45 мкм) и добавляли к целевым клеткам. Еще через 48 часов среду заменяли на селективную, содержащую гигромицин (350 мкг/мл), бластицидин (5 мкг/мл) и/или пуромицин (1 мкг/мл). Все линии регулярно проверяли на отсутствие микоплазмы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Лентивирусная трансдукция — это метод доставки генетического материала в клетки с помощью модифицированных вирусов, которые встраивают нужный ген в геном клетки-хозяина.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для создания линии HeLaΔPlscr1 клетки HeLa подвергали совместной трансфекции плазмидами pSpCas9(BB)-2A-Blast и pSpCas9(BB)-2A-Puro, несущими направляющие РНК (гиды) к гену PLSCR1. После 48-часовой инкубации клетки двое суток выдерживали в среде с 5 мкг/мл бластицидина и 1 мкг/мл пуромицина, после чего переводили в среду без антибиотиков. Клоны, полученные из одиночных клеток методом предельных разведений, анализировали путем выделения геномной ДНК и &lt;a href=\"concepts/ptsr.html\"&gt;ПЦР&lt;/a&gt;-амплификации с последующим секвенированием по Сэнгеру. В результате были получены аллели с делециями, приводящими к появлению стоп-кодонов.&lt;/p&gt;\n&lt;h4 id=\"virusnye-analizy\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#virusnye-analizy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вирусные анализы&lt;/span&gt;&lt;/a&gt;Вирусные анализы&lt;/h4&gt;\n&lt;p&gt;Штаммы MNVCW3, MNVCR6 и их мутантные формы получали путем трансфекции молекулярных клонов в клетки 293T с последующей амплификацией на клетках BV2. Для инфекции клетки HeLa-CD300lf высевали в 96-луночные планшеты и на следующий день заражали вирусом при множественности инфекции (MOI) 0,05. Планшеты покачивали в течение 1 часа при комнатной температуре, добавляли среду и инкубировали при 37°C и 5% CO2. Образцы замораживали при -80°C. Титры вируса определяли методом бляшек. В анализах MNV-HiBiT клетки заражали при MOI 0,5 или 5, а люминесцентную активность измеряли на ридере Synergy LX с использованием системы Nano-Glo HiBiT.&lt;/p&gt;\n&lt;h4 id=\"plazmidnye-konstrukcii\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#plazmidnye-konstrukcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Плазмидные конструкции&lt;/span&gt;&lt;/a&gt;Плазмидные конструкции&lt;/h4&gt;\n&lt;p&gt;КДНК мышиного и человеческого Plscr1 с N-концевой меткой 3xFLAG клонировали в лентивирусный вектор pCDH-EF1-MCS-IRES-Puro. Молекулярные клоны MNV соответствуют записям в GenBank EF014462.1 и JQ237823. Все плазмиды проходили полное секвенирование перед использованием.&lt;/p&gt;\n&lt;h4 id=\"immunoblotting\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#immunoblotting\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Иммуноблоттинг&lt;/span&gt;&lt;/a&gt;Иммуноблоттинг&lt;/h4&gt;\n&lt;p&gt;Белковые образцы, лизированные в буфере Лэммли, разделяли методом SDS-PAGE и переносили на PVDF-мембраны. После блокировки 5% обезжиренным молоком мембраны инкубировали с антителами к Plscr1 (1:1000), GAPDH (1:10000), FLAG (1:2500), фосфо-STAT1 Y701 (1:1000), STAT1 (1:1000) и вторичными антителами (1:10000). Также использовали антитела к неструктурным белкам MNV (NS1, NS6/7).&lt;/p&gt;\n&lt;h4 id=\"zarazhenie-myshej\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#zarazhenie-myshej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заражение мышей&lt;/span&gt;&lt;/a&gt;Заражение мышей&lt;/h4&gt;\n&lt;p&gt;Исследования на животных проводились с одобрения Комитета по уходу и использованию животных Юго-Западного медицинского центра Техасского университета (UT Southwestern). Использовались мыши линии Plscr1-/- и их однопометники в качестве контроля, содержащиеся в условиях SPF (отсутствие специфических патогенов). Животных заражали перорально дозой 1 × 10⁶ БОЕ вируса MNVCW3, после чего рассаживали по отдельным клеткам. Через 3 дня после заражения мышей эвтаназировали, ткани гомогенизировали в TRIzol с использованием силикатных шариков диаметром 1 мм. РНК выделяли и использовали для синтеза кДНК. Копии вирусного генома, гена актина и Plscr1 количественно оценивали методом ПЦР в реальном времени (&lt;a href=\"concepts/qpcr.html\"&gt;qPCR&lt;/a&gt;) с использованием специфических праймеров и зондов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ПЦР в реальном времени (qPCR) — метод молекулярной биологии, позволяющий измерять количество копий ДНК или РНК в образце в режиме реального времени по мере накопления продукта амплификации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"pryamoj-geneticheskij-skrining-ustojchivosti-k-plscr1\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#pryamoj-geneticheskij-skrining-ustojchivosti-k-plscr1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Прямой генетический скрининг устойчивости к Plscr1&lt;/span&gt;&lt;/a&gt;Прямой генетический скрининг устойчивости к Plscr1&lt;/h4&gt;\n&lt;p&gt;Эксперименты проводились в условиях BSL2. Клетки HeLa-CD300lf, экспрессирующие вектор или Plscr1 (2 × 10⁶ клеток), заражали вирусом MNVCR6 с множественностью заражения (MOI) 0,05. Каждые 48–72 часа проводили пассирование вируса (всего 11 циклов). После последнего пассажа из вирусного супернатанта выделяли РНК, синтезировали кДНК и проводили ПЦР-амплификацию фрагментов генома MNV (250–3000 п.н.) с последующим секвенированием. Данные выравнивали на клон MNVCR6 WT; для выявления мутаций, специфичных для Plscr1, из процента несовпадений в группе Plscr1 вычитали процент несовпадений в векторной группе. Результаты сопоставляли с показателем Phred Q, отражающим достоверность определения нуклеотидов.&lt;/p&gt;\n&lt;h4 id=\"analiz-obhoda-stadii-proniknoveniya\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#analiz-obhoda-stadii-proniknoveniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ обхода стадии проникновения&lt;/span&gt;&lt;/a&gt;Анализ обхода стадии проникновения&lt;/h4&gt;\n&lt;p&gt;Вирусную РНК (4 мкг), выделенную из MNVCW3, трансфицировали в клетки HeLa, экспрессирующие пустой вектор или Plscr1, с помощью Lipofectamine 3000. Важно, что данные клетки не экспрессировали рецептор CD300lf, что исключало возможность многоцикловой инфекции. Через 24 часа инкубации образцы замораживали при -80°C, а вирусные титры определяли методом бляшек.&lt;/p&gt;\n&lt;h4 id=\"analiz-svyazyvaniya-virusa\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#analiz-svyazyvaniya-virusa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ связывания вируса&lt;/span&gt;&lt;/a&gt;Анализ связывания вируса&lt;/h4&gt;\n&lt;p&gt;Клетки (2,5 × 10⁵) инкубировали с 1,6 × 10⁹ БОЕ вируса MNVCR6 в среде DMEM с 5% FBS при постоянном перемешивании на холоде (4°C) в течение 1 часа. После центрифугирования (500 g, 5 минут) клетки трижды промывали холодным PBS. Для количественного определения связавшегося вируса проводили выделение РНК из клеток и последующую qPCR.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-fS1.jpg\" alt=\"Рис. S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry-fS2.jpg\" alt=\"Дополнительный рисунок 2: Оригинальные вестерн-блоты, использованные в рукописи. Неизмененные хемилюминесцентные изображ\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Дополнительный рисунок 2: Оригинальные вестерн-блоты, использованные в рукописи. Неизмененные хемилюминесцентные изображения иммуноблотов, соответствующие блотам, представленным на рисунке 3.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Механизмы&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;входа&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;норовируса в&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;клетку&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Генетический&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нокаут Plscr1&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;у мышей&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Plscr1&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;блокирует&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;проникновение&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;вируса&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Новая мишень&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;для противовир&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;усной защиты&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не прошёл рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия препринта&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;bioRxiv&lt;/td&gt;\n&lt;td&gt;microbiology&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Baggett, N. S.; Pierce, L. R.; Orchard, R. C.&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ссылка&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;DOI&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://doi.org/10.64898/2026.09.17.752154\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;doi.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"dannye,-kod-i-prilozheniya\"&gt;&lt;a href=\"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html#dannye,-kod-i-prilozheniya\" class=\"yfm-anchor\" aria-hidden=\"true\
