к является отражением разделения паттернов между текущим сенсорным входом и ранее увиденными изображениями, хранящимися в памяти. Но активность PS-клеток является лишь результатом этого процесса, а не самим процессом, поскольку они не сигнализируют о содержимом памяти или сенсорного входа как такового. Один из кандидатных вычислительных механизмов предлагается моделью HebbFF [64], в которой представления стимулов остаются фиксированными, в то время как память хранится в синапсах, пластичность которых запускается при встрече с новыми стимулами, обеспечивая биологически правдоподобный механизм генерации сигналов знакомства. Это контрастирует с классическими представлениями о памяти на узнавание и разделении паттернов, включая теорию Марра о вычислениях памяти и последующие модели конъюнктивного кодирования в гиппокампе [5–7, 65]. Эти теории в первую очередь касаются того, как сами сенсорные представления преобразуются (например, декореллируются) для облегчения хранения и извлечения воспоминаний, а не того, как вычисляется сравнение между текущим представлением и ранее сохраненными представлениями. Наши выводы поэтому мотивируют создание вычислительных машин и моделей, которые операционализируют память через два раздельных представления: одно для содержимого стимула и одно для знакомства [64]. В рамках такого подхода PS-клетки могут представлять собой нейронный субстрат для последнего, предоставляя экспериментальные доказательства сигнала истинной памяти, который отделим от самих сенсорных представлений.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель HebbFF объясняет формирование сигналов знакомства через синаптическую пластичность при встрече с новизной, в отличие от классических теорий конъюнктивного кодирования.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Другим вопросом, который остается для будущих работ, является изучение того, различаются ли свойства мнемического разделения паттернов вдоль длинной оси гиппокампа, как предполагали другие [66, 67]. Наши регистрации преимущественно получены из переднего гиппокампа, оставляя этот вопрос открытым.&lt;/p&gt;\n&lt;p&gt;Наконец, наши анализы не исследовали, присутствует ли разделение паттернов, включая перемаппинг, в селективных к содержимому стимула представлениях в медиальной височной коре [20, 68–72]. Существующая литература предполагает, что представления концептуальных клеток являются высоко инвариантными, то есть они не меняют свою активность в ответ на схожие стимулы предпочтительной для клетки концепции [24]. Наш эксперимент не затрагивает этот вопрос, поскольку он не был разработан для выявления концептуальных клеток. Дальнейшие исследования должны изучить, как сигналы знакомства взаимодействуют с инвариантными представлениями стимулов во время задач на память при одновременной регистрации концептуальных и PS-клеток.&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"uchastniki-pacienty\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#uchastniki-pacienty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Участники: пациенты&lt;/span&gt;&lt;/a&gt;Участники: пациенты&lt;/h4&gt;\n&lt;p&gt;В данном исследовании приняли участие в общей сложности 97 пациентов с фармакорезистентной эпилепсией (133 сессии); из них 87 представляли собой повторный анализ ранее опубликованных данных, а 38 — новые записи. Записи всех пациентов в MFC ранее не публиковались. Мы включили только те сессии, в которых пациенты справлялись с заданием достаточно успешно и использовали как высокие, так и низкие оценки уверенности как для новых, так и для старых ответов ( поведенческая AUC ≥ 0.6). Основываясь на этих поведенческих критериях, мы исключили 13 пациентов (21 сессию), оставив для анализа 84 пациента (112 сессий) (Таблица S1).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AUC (площадь под ROC-кривой) в данном контексте показывает, насколько хорошо пациент различал новые и старые изображения, где значение 0.5 соответствует случайному угадыванию, а 1.0 — идеальному распознаванию.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Размер выборки не был заранее определен с помощью статистических методов, однако количество включенных пациентов велико по сравнению с аналогичными исследованиями. Все участники дали информированное согласие и добровольно приняли участие в исследовании. Протоколы исследования были одобрены институциональными ревизионными комиссиями Медицинского центра Сидарс-Синай, Торонтского западного госпиталя и Больницы Джонса Хопкинса.&lt;/p&gt;\n&lt;h4 id=\"onlajn-uchastniki\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#onlajn-uchastniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Онлайн-участники&lt;/span&gt;&lt;/a&gt;Онлайн-участники&lt;/h4&gt;\n&lt;p&gt;Несколько независимых групп участников выполняли задачу множественного размещения. Сначала через платформу Prolific (www.prolific.com) были набраны добровольцы для оценки сходства между 25 случайно выбранными изображениями, которые впоследствии использовались для оценки эффективности моделей в объяснении сходства человеческого восприятия. Другая группа участников оценивала сходство для изображений из одной и той же семантической категории. В этой версии каждая подкатегория содержала 30 изображений внутри категории плюс 4 опорных изображения из других категорий, которые позже использовались для выравнивания расстояний по всему набору данных. Для этого для каждой категории было набрано от 16 до 20 участников из варианта задачи 3 (описание задачи см. ниже): n = 20 для животных, n = 20 для еды, n = 20 для автомобилей, n = 20 для людей, n = 16 для ландшафтов.&lt;/p&gt;\n&lt;h4 id=\"psihofizika\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#psihofizika\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Психофизика&lt;/span&gt;&lt;/a&gt;Психофизика&lt;/h4&gt;\n&lt;p&gt;Задача на память на узнавание (пациенты с эпилепсией). Задача была такой же, как в ранее опубликованных работах. Она состоит из двух блоков — обучения и извлечения, разделенных задержкой продолжительностью 10–30 минут. Во время обучения пациенты просматривали 100 уникальных новых изображений. Во время извлечения 50 из этих изображений (старые/знакомые) перемешивались с 50 новыми изображениями (новыми). Пациенты оценивали каждое изображение как новое или знакомое, используя шкалу уверенности от 1 до 6 (Рис. 1а). Здесь приводятся данные только из блока извлечения. Перед основным экспериментом участники проходили короткую тренировочную версию с отдельным набором стимулов. Использовалось три варианта задачи, идентичных по дизайну, но использующих разные стимулы. Для тех пациентов, которые прошли несколько сессий, записи проводились в разные дни с использованием разных вариантов задачи. Все изображения имели размер 9^° × 9^°. Каждая проба состояла из предъявления изображения, за которым следовал пустой экран в течение 0.5 с, а затем экран ответа, который оставался до тех пор, пока не был дан ответ (Рис. 1а). У нас было 3 варианта этой задачи, которые имели одинаковую структуру и различались только стимулами. Стимулы представляли собой фотографии природных сцен, охватывающие пять категорий (Рис. S1a–c), в равном количестве из каждой. Задача была реализована в среде MATLAB с использованием пакета Psychophysics Toolbox.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Задача на память на узнавание проверяет способность мозга отличать ранее виденные стимулы от абсолютно новых с оценкой степени уверенности испытуемого.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Задача на оценку сходства (онлайн-участники). Для получения эталонных оценок человеческого перцептивного сходства мы привлекли через платформу Prolific (www.prolific.com) участников с самооценкой нормального или скорректированного до нормального зрения. Участники выполняли задачу множественного размещения, реализованную на веб-платформе Meadows (http://meadows-research.com). Дизайн задачи был предложен изначально. Участников просили оценить сходство изображений, располагая их на круговой арене на основе визуального сходства (Рис. S2c). Участникам было поручено перетаскивать каждое изображение, чтобы расположить похожие изображения ближе друг к другу, а непохожие — дальше друг от друга. Изображения можно было перемещать многократно, пока участник не был удовлетворен расположением. Кластеры изображений из одной и той же семантической категории часто возникали естественным образом, и участников поощряли уточнять размещение, корректируя позиции для отражения более тонких различий внутри категорий.&lt;/p&gt;\n&lt;p&gt;Когда участники были удовлетворены первичным расположением, они нажимали кнопку «Готово», что составляло одну пробу размещения. Первая проба размещения всегда включала все изображения из набора. Для оценки исходной матрицы репрезентативного сходства (RDM) для каждой пары размещенных изображений вычислялось квадратичное евклидово расстояние. В последующих попытках участникам предъявлялся поднабор изображений, определяемый текущей оценкой RDM с помощью алгоритма «поднять слабейшего» для адаптивного проектирования поднаборов элементов, как это было изначально предложено для задачи множественного размещения. Итоговая RDM для каждого участника выводилась как средневзвешенное расстояний по всем размещениям, в которых появлялась пара изображений (Рис. S2i — усредненная RDM по всем участникам).&lt;/p&gt;\n&lt;h4 id=\"analiz-pamyati-povedeniya\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#analiz-pamyati-povedeniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ памяти поведения&lt;/span&gt;&lt;/a&gt;Анализ памяти поведения&lt;/h4&gt;\n&lt;p&gt;На основе поведенческого выбора все испытания на распознавание были классифицированы на TP (верные старые), true TN (верные новые), FN (неверные старые) и FP (неверные новые, также упоминаемые далее в рукописи как «ложные тревоги»). Производительность извлечения данных количественно оценивалась с помощью анализа ROC. Каждая точка ROC (Рис. 1g) соответствует частоте попаданий (ось y) и частоте ложных тревог (ось x) при заданном уровне уверенности, причем нижняя левая точка отражает наибольшую уверенность («старое, с уверенностью»). Поведенческая AUC (Рис. 1h) рассчитывалась путем интегрирования площади под кривой ROC. На протяжении всей рукописи мы включали только сессии с AUC на уровне пациента &amp;gt; 0.6 и с ответами, охватывающими как высокий, так и низкий уровни уверенности для суждений о «новых» и «старых» объектах. Для анализа на Рис. 3d мы выбрали сессии, в которых пациенты точно различали воспоминания с высокой и низкой уверенностью (минимальная точность для высокой 70% и для низкой 55%).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;ROC-анализ и метрика AUC используются для оценки того, насколько хорошо модель или испытуемый может различить правильные и неправильные ответы при разной степени уверенности.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модели. Для анализа вклада перцептивного сходства в показатели памяти мы использовали несколько предварительно обученных глубоких нейронных сетей (DNN) (Рис. S2b). DINOv2 — это модель самообучающегося визуального трансформера (ViT), которая извлекает универсальные визуальные признаки без обучающих меток. CLIP — это модель на базе ViT с учителем и использованием естественного языка, обученная сопоставлять текст и изображения. AlexNet и ResNet50 — это глубокие сверточные нейронные сети (CNN), обученные категоризации изображений. «Попиксельная» модель представляет собой расстояние корреляционного типа между пикселями для пары изображений. Модель «категорий» была построена в виде матрицы репрезентативного сходства (RDM) с бинарными значениями путем присвоения меры различия 0 парам изображений из одной семантической категории и 1 парам из разных категорий.&lt;/p&gt;\n&lt;h4 id=\"proizvoditelnost-modelej-v-obuyasnenii-suzhdenij-o-shodstve\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#proizvoditelnost-modelej-v-obuyasnenii-suzhdenij-o-shodstve\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Производительность моделей в объяснении суждений о сходстве&lt;/span&gt;&lt;/a&gt;Производительность моделей в объяснении суждений о сходстве&lt;/h4&gt;\n&lt;p&gt;Для систематической оценки эффективности моделей в объяснении сходства восприятия человеком мы собрали суждения о сходстве для набора изображений (пять изображений для каждой из пяти категорий) (Рис. S2j). Набор стимулов был обработан с помощью моделей для получения RDM моделей (Рис. S2k). Для CNN и ViT различие определялось как единица минус косинусное сходство между векторами признаков из финального слоя модели (для CNN — слой, предшествующий классификатору). Попиксельное различие вычислялось как единица минус коэффициент корреляции Пирсона между значениями пикселей каждой пары изображений. После определения RDM моделей мы сравнили RDM каждой модели с RDM сходства каждого испытуемого человека с помощью рандомизированного теста Спирмена &lt;span class=\"yfm-latex\" data-content=\"%5Crho\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; с разрешением ничьих &lt;span class=\"yfm-latex\" data-content=\"%5Crho_a\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;h4 id=\"regressionnyj-analiz\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#regressionnyj-analiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Регрессионный анализ&lt;/span&gt;&lt;/a&gt;Регрессионный анализ&lt;/h4&gt;\n&lt;p&gt;Чтобы проверить гипотезу о том, что ложные тревоги памяти по крайней мере частично возникают из-за ложной интерференции, заключающейся в том, что новые изображения были похожи на ранее изученные изображения, для каждого нового изображения, показанного пациентам с эпилепсией во время извлечения, мы вычислили вероятность ошибочного распознавания этого изображения как «старого» среди всех пациентов. Затем мы провели регрессию этих вероятностей относительно минимального косинусного расстояния между векторами глубоких признаков модели для данного изображения и всеми изображениями, представленными во время обучения. Чтобы учесть возможный вклад присущего изображению чувства знакомства в ложные тревоги, в качестве одного из регрессоров мы использовали ResMem — CNN, обученную предсказывать запоминаемость изображений. Для прямого сравнения частоты ложных тревог с суждениями людей мы собрали дополнительные суждения о сходстве для всего набора изображений варианта задачи 3 с независимыми участниками, оценивавшими разные категории (см. также «Участники»; Рис. S2m). В качестве регрессора в этом случае мы использовали минимальное евклидово расстояние между новым изображением и всеми изображениями той же категории, представленными во время обучения.&lt;/p&gt;\n&lt;h4 id=\"elektrofiziologiya\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#elektrofiziologiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Электрофизиология&lt;/span&gt;&lt;/a&gt;Электрофизиология&lt;/h4&gt;\n&lt;p&gt;Регистрация проводилась с использованием гибридных (макро-микро) глубинных электродов со встроенными микропроводами (AdTech Medical). Места имплантации определялись исключительно на основе клинических показаний и включали различные комбинации гиппокампа, миндалевидного тела, передней поясной коры и пресупплементарной моторной зоны. Большинству пациентов были установлены билатеральные имплантаты. Непрерывный широкополосный сигнал (0.1 Гц – 9 кГц) регистрировался с каждого микропровода с частотой дискретизации 32 кГц с использованием системы ATLAS (Neuralynx) или 30 кГц (система Blackrock Neurotech) в зависимости от медицинского учреждения. Все пациенты, включенные в это исследование, имели по меньшей мере один хорошо изолированный одиночный нейрон в одной или нескольких целевых областях мозга.&lt;/p&gt;\n&lt;h4 id=\"vydelenie-i-sortirovka-spajkov\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#vydelenie-i-sortirovka-spajkov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Выделение и сортировка спайков&lt;/span&gt;&lt;/a&gt;Выделение и сортировка спайков&lt;/h4&gt;\n&lt;p&gt;Сырые электрические сигналы фильтровались полосовым фильтром в диапазоне 300 Гц – 3 кГц. Выделение и сортировка спайков выполнялись с помощью полуавтоматического алгоритма сопоставления с шаблоном OSort v4.1. Все результаты сортировки проверялись вручную, а предполагаемые одиночные единицы определялись и сохранялись для дальнейшего анализа. Качество изолированных единиц количественно оценивалось с использованием установленных метрик, включая долю нарушений интервала между спайками (&amp;lt;3 мс), отношение сигнал/шум формы волны, проекционное расстояние между парами кластеров и расстояние изоляции каждого кластера относительно всех других обнаруженных спайков. Только нейроны, отвечающие этим критериям, включались в последующие анализы. Кроме того, мы исключили нейроны с частотой генерации импульсов менее 0.2 Гц, а также те, которые регистрировались с электродов, локализованных вне целевой зоны (см. ниже). В общей сложности мы зарегистрировали 4166 хорошо изолированных единиц во всех областях мозга (гиппокамп n=1093, миндалевидное тело n=1359, передняя поясная кора n=826 и пресупплементарная моторная зона n=888). На основе поведенческих показателей мы исключили 660 единиц (см. «Участники» для критериев исключения / количества сессий), оставив в общей сложности 3506 единиц для дальнейшего анализа (950, 1187, 684 и 685 клеток в гиппокампе, миндалевидном теле, передней поясной коре и пресупплементарной моторной зоне соответственно).&lt;/p&gt;\n&lt;h4 id=\"lokalizaciya-elektrodov\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#lokalizaciya-elektrodov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Локализация электродов&lt;/span&gt;&lt;/a&gt;Локализация электродов&lt;/h4&gt;\n&lt;p&gt;Локализация электродов выполнялась путем совмещения послеоперационной компьютерной томографии (КТ) с предоперационной магнитно-резонансной томографией (МРТ) с использованием программ FreeSurfer v5.3.0 и v7.4.1, как описано ранее. Координаты электродов впоследствии совмещались с пространством MNI152 и сопоставлялись с вероятностным атласом CIT168 для стандартизированной отчетности и визуализации с помощью Advanced Normalization Tools v2.1. Окончательное подтверждение расположения электродов в сером веществе основывалось на визуальной оценке индивидуальных для каждого испытуемого совмещенных МРТ-КТ изображений, а не на визуализации на основе атласа.&lt;/p&gt;\n&lt;h4 id=\"lokalizaciya-zony-nachala-pristupov-soz\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#lokalizaciya-zony-nachala-pristupov-soz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Локализация зоны начала приступов (SOZ)&lt;/span&gt;&lt;/a&gt;Локализация зоны начала приступов (SOZ)&lt;/h4&gt;\n&lt;p&gt;Местоположение SOZ определялось на основании результатов внутричерепного мониторинга, доступных для каждого пациента в конце их пребывания в стационаре (Таблица S1). Мы локализовали каждый зарегистрированный нейрон внутри или вне SOZ в зависимости от того, была ли у конкретного пациента SOZ в этом полушарии медиальной височной структуры (MTL) для гиппокампа (HPC) и амигдалы (AMY) или медиальной лобной коры (MFC) для передней поясной коры (ACC) и пресуплементарной моторной зоны (preSMA). Все нейроны, зарегистрированные у испытуемых с двусторонними SOZ, были отнесены к находящимся внутри SOZ. В результате в HPC и AMY внутри SOZ оказалось 406/950 и 476/1187 нейронов, а в ACC и preSMA — 18/684 и 55/685 нейронов соответственно. Для сравнения декодирования эталонных данных (см. ниже) между HPC внутри и вне SOZ мы локализовали все клетки HPC внутри или вне SOZ в зависимости от того, включала ли SOZ у конкретного пациента электроды в HPC. В результате 396 клеток были локализованы вне SOZ, 398 — внутри и 156 — с неизвестным точным расположением (Рис. S8d). Аналогично, 36 клеток с избирательностью к памяти (MS) были зарегистрированы вне SOZ, 26 — внутри и 14 — с неизвестным расположением (Рис. S8e).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SOZ (зона начала приступов) — это область мозга, где генерируются эпилептические припадки, а гиппокамп и амигдала относятся к ключевым структурам височной доли.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"otbor-nejronov\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#otbor-nejronov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Отбор нейронов&lt;/span&gt;&lt;/a&gt;Отбор нейронов&lt;/h4&gt;\n&lt;p&gt;Спайки подсчитывались в окне длительностью 1,5 с, начинающемся через 200 ms после предъявления стимула. Нейроны, избирательные к памяти (MS), определялись как нейроны, демонстрирующие значительное различие между правильно опознанными новыми и знакомыми стимулами в пределах этого окна (p-value &amp;lt; 0.05, двустороннее бутстрэп-сравнение средних значений, 1000 итераций). Нейрон MS классифицировался как избирательный к знакомости (FS), если средняя частота импульсации в испытаниях со старыми стимулами превышала частоту в испытаниях с новыми. Если частота импульсации нейрона для новых стимулов превышала частоту для старых, клетка MS классифицировалась как избирательная к новизне (NS, актуально для Рис. 3d, e). Визуально избирательные (VS) нейроны выявлялись с помощью однофакторного дисперсионного анализа ANOVA (фактор: визуальная категория, 5 уровней) по тем же подсчетам спайков (p-value &amp;lt; 0.05).&lt;/p&gt;\n&lt;h4 id=\"kriterii-vklyucheniya-nejronov\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#kriterii-vklyucheniya-nejronov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Критерии включения нейронов&lt;/span&gt;&lt;/a&gt;Критерии включения нейронов&lt;/h4&gt;\n&lt;p&gt;Для включения в анализ от клетки требовалось наличие средней частоты импульсации &amp;gt;0,2 Hz в период предъявления стимула по всем испытаниям. Кроме того, для каждого конкретного анализа мы включали только те клетки, которые имели определенное минимальное количество испытаний каждого возможного типа (обычно 2 для ROC-анализа и 5 для анализа декодирования). Требуемое минимальное количество испытаний указано в последующих разделах, описывающих каждый метод.&lt;/p&gt;\n&lt;p&gt;Частоты ложноположительных результатов (FP) зависят от категории стимула: изображения, принадлежащие некоторым категориям (например, «животные»), чаще классифицируются как FP, чем для других категорий (Рис. S1a-c для вариантов задачи 1–3). По этой причине клетки MS, которые вдобавок кодируют визуальную категорию, могут создавать мешающий фактор для нашего анализа. Хотя такие клетки MS, настроенные также на категорию, редки (соответственно 1,9% (18/950), 1,85% (22/1187), 1,5% (10/684) и 1,6% (11/685) в HPC, AMY, ACC и preSMA), мы тем не менее исключили их во всех анализах после Рис. 3g (на Рис. 3c показан пример такой клетки) в качестве меры предосторожности.&lt;/p&gt;\n&lt;h4 id=\"uroven-sluchajnosti-dlya-otbora-kletok\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#uroven-sluchajnosti-dlya-otbora-kletok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Уровень случайности для отбора клеток&lt;/span&gt;&lt;/a&gt;Уровень случайности для отбора клеток&lt;/h4&gt;\n&lt;p&gt;Для оценки уровней случайности при отборе клеток процедура идентификации нейронов, избирательных к памяти, повторялась после случайной перестановки меток испытаний (правильные новые/старые) 500 раз.&lt;/p&gt;\n&lt;h4 id=\"analiz-odinochnyh-nejronov\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#analiz-odinochnyh-nejronov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ одиночных нейронов&lt;/span&gt;&lt;/a&gt;Анализ одиночных нейронов&lt;/h4&gt;\n&lt;p&gt;Для построения перистимульных гистограмм частоты импульсации (PSTH, Рис. 3a, b; Рис. 4f-i) мы подсчитываем спайки в скользящем окне размером 200 ms с шагом 16 ms.&lt;/p&gt;\n&lt;h4 id=\"roc-analiz-otdelnyh-nejronov\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#roc-analiz-otdelnyh-nejronov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ROC-анализ отдельных нейронов&lt;/span&gt;&lt;/a&gt;ROC-анализ отдельных нейронов&lt;/h4&gt;\n&lt;p&gt;ROC-кривые нейронов рассчитывались на основе количества спайков в 1,5-секундном окне, начинающемся через 200 мс после начала стимула. Порог детекции варьировался между минимальным и максимальным наблюдаемым количеством спайков, линейно распределенным на 20 шагов. Значение AUC было получено путем интегрирования площади под ROC-кривой. Мы провели ROC-анализ, чтобы количественно оценить, насколько хорошо отдельные MS-нейроны могут различать разные интересующие нас типы попыток (см. ниже).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ROC-анализ (Receiver Operating Characteristic) — это статистический метод оценки качества бинарной классификации, где AUC (площадь под кривой) показывает способность нейрона различать два состояния: чем ближе AUC к 1, тем лучше нейрон разделяет сигналы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сравнение высокой и низкой уверенности (Рис. 3d, e). Чтобы оценить, как MS-нейроны дифференцируют новые и знакомые попытки при различных уровнях уверенности, анализировались только нейроны, имевшие не менее двух попыток на каждом из четырех уровней уверенности. Для корректного сравнения одна группа в ROC-анализе стратифицировалась по уровню уверенности, в то время как другая оставалась фиксированной. Для FS-нейронов все TN-попытки (независимо от уверенности) служили фиксированной группой и сравнивались с TP-попытками высокой и низкой уверенности. Для NS-нейронов все TP-попытки были фиксированными и сравнивались с TN-попытками высокой и низкой уверенности.&lt;/p&gt;\n&lt;p&gt;Анализ ошибочных попыток (Рис. S5b, также относится к Рис. 4a-e). Чтобы оценить паттерн ответов MS-клеток на попытки с неудачным поведенческим разделением паттернов (FP), мы рассчитали AUC для пар попыток с одинаковым поведенческим выбором, но разной истинной принадлежностью (TP против FP), или разным выбором, но одинаковой истинной принадлежностью (TN против FP). В этот анализ были включены только нейроны, имевшие не менее 5 ошибочных попыток.&lt;/p&gt;\n&lt;p&gt;Декодирование отдельных клеток (Рис. 3, 4). Декодирование отдельных клеток выполнялось с использованием наивного байесовского классификатора Пуассона. Для каждого нейрона мы использовали количество спайков в качестве признаков. Ожидаемое количество спайков (λ) оценивалось как среднее значение по тренировочным попыткам отдельно для каждого класса. Затем для каждого тестового наблюдения вычислялось логарифмическое правдоподобие с использованием распределений Пуассона, параметризованных соответствующими значениями λ, и принадлежность к классу присваивалась на основе этого правдоподобия. В каждом запуске декодирования (n=100) мы случайным образом исключали по одной попытке на класс (всего 2 попытки) для тестирования. Сообщаемая производительность представляет собой среднее значение по классификациям этих 2x100 попыток. Чтобы оценить нулевое распределение для производительности декодирования, мы повторили ту же процедуру декодирования, но после перемешивания меток классов 1000 раз. Для проверки значимости на уровне группы мы вычислили нулевое распределение для каждой клетки, затем усреднили случайные показатели производительности по клеткам для каждой перестановки, получив нулевое распределение 1x1000. P-значение было установлено равным количеству нулевых значений, превышающих среднюю производительность декодирования по клеткам. Если ни одно нулевое значение не превышало наблюдаемую производительность, p-значение устанавливалось равным единице, деленной на количество перестановок (1/1000).&lt;/p&gt;\n&lt;p&gt;Анализ ошибочных попыток (Рис. 3g, h). Чтобы проверить, могут ли MS-клетки дискриминировать FP-попытки от TP-попыток и корректно сравнить эту дискриминационную способность с правильно выполненными попытками (TP против TN), мы проанализировали все зарегистрированные клетки. Для включения клетка должна была иметь не менее 5 FP-попыток. Мы подсчитывали спайки в 1,5-секундном окне, начинающемся через 200 мс после начала стимула. Мы использовали ту же процедуру перекрестной проверки, что описана выше. Тренировочные попытки использовались для обучения декодера дифференцировать либо TP от TN, либо TP от FP, а также для отбора MS-клеток, как описано выше. Для каждого нейрона это дало две меры производительности декодирования и долю запусков, в которых он классифицировался как MS-клетка. Затем мы сравнили производительность декодирования для клеток, которые классифицировались как MS не менее чем в 75% запусков. Изменение порога классификации MS-клеток до 85 или 95% не изменило результаты, представленные в основном тексте (Рис. S3f, g).&lt;/p&gt;\n&lt;p&gt;Классификация MS-клеток (Рис. 4a-e). Чтобы оценить, несет ли MS-клетка сигнал о выборе памяти или сигнал об истинной принадлежности памяти, мы проанализировали MS-клетки, имевшие не менее 5 FP-попыток. Мы подсчитывали спайки в 1,5-секундном окне, начинающемся через 200 мс после начала стимула. Мы использовали ту же процедуру перекрестной проверки, что описана выше. Тренировочные попытки использовались для обучения декодера дифференцировать либо TP от FP (один и тот же выбор, разная истинная принадлежность), либо TN от FP (разный выбор, одна и та же истинная принадлежность), и рассчитывали AUC для тех же пар (см. также «ROC-анализ отдельных нейронов. Анализ ошибочных попыток»).&lt;/p&gt;\n&lt;p&gt;Каждая MS-клетка классифицировалась как MC, если её AUC для TN против FP была выше, чем для TP против FP, или как PS, если её AUC для TP против FP была выше, чем для TN против FP. Для каждого MS-нейрона это дало две меры производительности декодирования и долю запусков, в которых он классифицировался как MC- или PS-клетка. Затем мы сравнили производительность декодирования для клеток, которые классифицировались как любой из типов не менее чем в 75% запусков.&lt;/p&gt;\n&lt;h4 id=\"populyacionnyj-analiz-demikshirovannyj-analiz-glavnyh-komponent-dpca\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#populyacionnyj-analiz-demikshirovannyj-analiz-glavnyh-komponent-dpca\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Популяционный анализ: демикшированный анализ главных компонент (dPCA)&lt;/span&gt;&lt;/a&gt;Популяционный анализ: демикшированный анализ главных компонент (dPCA)&lt;/h4&gt;\n&lt;p&gt;Мы использовали dPCA, как описано ранее. Сначала для каждого нейрона мы вычисляли трек частоты спайков в скользящем окне длительностью 500 мс с шагом 16 мс и стандартизировали его z-оцкой относительно среднего значения и стандартного отклонения в базовом периоде (окно 1 с до начала стимула). Алгоритм dPCA начинается с разложения популяционной активности на маргинализированные матрицы данных, соответствующие интересующим переменным. Мы построили маргинализированные матрицы данных относительно истинного значения стимула и поведенческого выбора. Обратите внимание, что правильные попытки (TP и TN) всегда имеют одинаковые метки в обеих маргинализациях, тогда как неправильные (FP и FN) имеют противоположные метки в отношении истинного значения и выбора. Для каждого маргинализированного среднего алгоритм затем вычисляет раздельные матрицы кодирования и декодирования с использованием регуляризованной регрессии пониженного ранга. Столбцы матрицы декодирования использовались в качестве демикшированных главных компонент (dPC), на которые проецировались N-мерные данные (данные отдельных попыток для тестирования и усредненные по попыткам данные для обучения). Значения этой матрицы количественно отражают вклад каждого нейрона в маргинализированное представление.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;dPCA (демикшированный анализ главных компонент) — это математический метод, который разделяет общую активность нейронов на отдельные компоненты, отражающие разные переменные задачи, такие как восприятие стимула или принятие решения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для анализа декодирования (Рис. 5k–o) мы использовали данные из одного временного окна (1,5 с, начиная через 200 мс после начала стимула), тем самым устранив дисперсию, связанную со временем. В анализ декодирования dPCA включали только нейроны со средней частотой спайков не менее 0,2 Гц и как минимум пятью попытками на каждое условие. Для оценки статистической значимости измерений кодирования мы использовали процедуру декодирования по отдельным попыткам. Для каждой итерации случайным образом выбиралась одна попытка каждого типа (правильные и неправильные попытки для «новых» и «старых» стимулов) для формирования матрицы активности отдельной попытки. Оставшиеся попытки усреднялись для создания матрицы тренировочных данных, которая использовалась для вычисления измерений кодирования dPCA. Отложенные данные отдельных попыток затем проецировались на первое измерение кодирования (улавливающее наибольшую дисперсию в тренировочных данных) и классифицировались в соответствии с ближайшим средним значением класса. Эта процедура повторялась 1 000 раз, а точность декодирования определялась как доля правильных классификаций среди всех повторений. Нулевое распределение создавалось путем перемешивания меток попыток и повторения процедуры декодирования 500 раз. P-значение определялось как количество нулевых значений, превышающих наблюдаемую эффективность декодирования.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h-f5.jpg\" alt=\"Рисунок 5. Как истинное состояние памяти, так и поведенческий выбор представлены на уровне популяции. a–e, Демиксованный\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5. Как истинное состояние памяти, так и поведенческий выбор представлены на уровне популяции. a–e, Демиксованный анализ главных компонент (dPCA) представлений памяти и выбора в HPC. a, 3D-модель мозга с использованием атласа Brainnetome с выделенным HPC (зеленый цвет). b, Истинное состояние, решение и взаимодействие между ними объясняют значительную долю дисперсии (19%, 19% и 18% соответственно). c–e, Нейронная активность, проецированная на dPC истинного состояния (c), решения (d) и взаимодействия (e), объясняющие наибольшую дисперсию для каждой переменной. Обратите внимание на разделимость истинного состояния памяти (красный и синий цвета) в c, поведенческого выбора (сплошные и пунктирные линии) в d, а также правильных и неправильных проб в e. f–j, То же, что и a–e, но для preSMA. k, Полоса слева показывает дисперсию, объясняемую параметрами dPCA, когда рассматривается только одно временное окно (1.5 с после начала стимула). В HPC как истинное состояние памяти, так и решение могут быть декодированы на уровне отдельной пробы по соответствующим осям dPCA (среднее за 1.5 с после начала стимула). Рассматривались только клетки с минимум 5 пробами в каждом условии (n = 512). В HPC декодирование как истинного состояния (p = 0.003), так и решения (p = 0.009) было значимым. Бежевая точка отмечает точность классификации FP-проб. i, То же, что и k, но для preSMA. В preSMA значимо декодировалось только решение (p = 1.7×10⁻⁸, истинное состояние p = 0.17). m–o, Связь между популяцией (результат dPCA) и настройкой отдельных клеток в HPC. Клетки MC и PS имели более высокие веса dPCA, чем не-MS клетки, как для осей истинного состояния памяти (MS p = 5.9×10⁻⁹, PS p = 1.6×10⁻³⁶), так и для осей решения (MC p = 2.2×10⁻²⁰, PS p = 9.2×10⁻²¹). У PS-клеток также были значительно более высокие веса для оси декодера истинного состояния, чем у MC-клеток (p = 0.005, ось решения MC против PS p = 0.2). Все p-значения для m и n получены с помощью двувыборочного t-теста. o, То же, что m и n, но построены друг против друга. Вставка в правом верхнем углу представляет собой распределение весов dPCA для осей истинного состояния (светло-голубой) и решения (розовый). Обратите внимание на центрирование на 0. * p &amp;lt; 0.05, ** p &amp;lt; 0.01, *** p &amp;lt; 0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;В качестве контроля для убедительности того, что декодирование в гиппокампе (HPC) не зависело от большего числа доступных нейронов (512 против 422; обратите внимание, что эти числа ниже указанных на Рис. 1e из-за исключения нейронов с менее чем 5 попытками каждого типа для данного анализа), мы случайным образом выбрали 75% популяции HPC (n = 384) и повторили декодирование 250 раз. Результаты остались качественно схожими: наблюдалось значимое декодирование как истинного значения памяти, так и выбора в HPC (Рис. S6c; p = 0,009 и p = 0,018 соответственно). Для прямого сравнения двух декодеров (таких как HPC и preSMA на Рис. S6d, внутри и вне зоны начала припадков (SOZ), а также левого и правого HPC на Рис. S8) мы рассчитали разницу в точности декодирования между ними после выравнивания по количеству нейронов и сравнили эту разницу с нулевым распределением разностей декодирования, вычисленным после перемешивания меток попыток (n = 500 перемешиваний). Для этого при каждой перестановке декодера (n = 250) мы случайным образом выбирали 80–85% наименьшей популяции (preSMA, n = 340; в SOZ, n = 170; левый HPC, n = 190) из обеих популяций и повторяли ту же процедуру декодирования, что и выше. Одновременно мы перемешивали метки попыток 500 раз и вычисляли нулевое распределение различий в эффективности декодирования. P-значение устанавливалось равным количеству нулевых значений, превышающих наблюдаемую разницу, с нижней границей 1/250, если ни одно нулевое значение не превышало наблюдаемую величину.&lt;/p&gt;\n&lt;h4 id=\"proekciya-otdelnyh-ispytanij\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#proekciya-otdelnyh-ispytanij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Проекция отдельных испытаний&lt;/span&gt;&lt;/a&gt;Проекция отдельных испытаний&lt;/h4&gt;\n&lt;p&gt;Для оценки распределения проекций отдельных испытаний вдоль направления кодирования памяти мы вычислили dPC на предварительно отобранных клетках MS только в одном временном окне (1,5 с, начиная через 200 ms после предъявления стимула). Мы случайно исключали одно испытание каждого типа, как описано выше. Мы усредняли оставшиеся испытания и вычисляли на них размерности кодирования dPCA. Матрица декодера для каждой размерности (компонент с наибольшей дисперсией для истинного состояния памяти или выбора) затем нормировалась до единичной амплитуды для оценки вектора кодирования. Испытания в отложенной выборке проецировались на этот вектор кодирования с использованием скалярного произведения. Эта процедура повторялась 1000 раз, формируя распределение проекций отдельных испытаний вдоль каждого направления кодирования. Разделение между распределениями различных типов испытаний количественно оценивалось с помощью индекса d-prime: &lt;span class=\"yfm-latex\" data-content=\"d'%20%3D%20%5Cfrac%7B%2F%5Cmu_1%20-%20%5Cmu_2%2F%7D%7B%5Csqrt%7B%5Cfrac%7B%5Csigma_1%5E2%20%2B%20%5Csigma_2%5E2%7D%7B2%7D%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, где µ₁ и µ₂ — средние значения распределений 1 и 2, а σ₁² и σ₂² — дисперсии распределений 1 и 2.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод d-prime (d') измеряет, насколько хорошо можно различить два распределения данных с учетом их разницы в средних и разброса (дисперсии).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сначала мы проверили, являются ли распределения ложноположительных (FP) и истинно отрицательных (TN) результатов разделимыми (d'&amp;gt;0). Для этого мы вычислили d' между FP и TN (Рис. 6c, d'₁) и сравнили его с нулевым распределением d-prime, полученным с помощью той же процедуры, но после перемешивания меток испытаний. На каждой итерации с исключением одного испытания (n=1000, см. выше) мы перемешивали метки испытаний 500 раз, генерируя распределение проекций отдельных испытаний 1×500 для каждого типа испытаний, и вычисляли перемешанный d-prime. Это дало 1000 нулевых значений d' для FP–TN, с которыми мы сравнивали наблюдаемый d'₁. Поскольку ни одно из нулевых значений не превышало наблюдаемый d-prime, p-значение было установлено равным 1/1000 (размерность нулевого распределения).&lt;/p&gt;\n&lt;p&gt;Затем мы сравнили разделимость распределений FP–TN и истинно положительных и ложноположительных результатов (TP–FP) (Рис. 6c, d'₂), используя разность соответствующих d-prime. Положительная разница между d'₂ и d'₁ указывала бы на то, что испытания FP остаются ближе к TN, чем к TP, но тем не менее смещены в сторону TP вдоль оси истинного состояния dPCA. Чтобы проверить это статистически, мы использовали распределения с перемешанными метками, полученные описанным выше способом, и вычислили разницу d-prime для генерации нулевого распределения при гипотезе о том, что распределения TP–FP разделимы не лучше, чем распределения FP–TN. Это привело к 1000 нулевых разностей d-prime. Затем мы сравнили наблюдаемую разницу d-prime для TP–FP и FP–TN с этим нулевым распределением. Поскольку ни одна из нулевых разностей не превышала наблюдаемую разницу d-prime, p-значение было установлено равным 1/1000 (размерность нулевого распределения). Для Рис. 6f распределения проекций отдельных испытаний генерировались аналогичным образом, но испытания TP для тестирования (проецирования) отбирались на основе их уверенности (высокой или низкой). Для Рис. 6g клетки PS (определенные, как описано в разделе «Классификация клеток MS») были исключены из популяции клеток MS.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Неизвестен&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;клеточный код&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;памяти&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Запись&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;активности&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;3506 нейронов&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Найдены&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нейроны&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;разделения&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;образов&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Доказан&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;механизм&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;эпизодической&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;памяти&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не прошёл рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия препринта&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;neuroscience&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Kurilenko, N.; Mosher, C.; Cheng, S.; Salimpour, Y.; Daume, J.; Reed, C. M.; Anderson, W. S.; Valiante, T. A.; Mamelak, A. N.; Rutishauser, U.&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ссылка&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница препринта&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://www.biorxiv.org/content/10.64898/2026.09.18.752786v1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;biorxiv.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Полный текст (PDF)&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://www.biorxiv.org/content/10.64898/2026.09.18.752786v1.full.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;biorxiv.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Копия PDF&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/VivaLyaRaza/biorxiv-digest/releases/download/issue-2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;github.com&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;DOI&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://doi.org/10.64898
