            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"256\" cy=\"119\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"684\" cy=\"162\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как мозг путает знакомое с&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;новым: найден клеточный код&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;памяти&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h-f1.jpg\" alt=\"Рисунок 1. Задача, поведение и сводка зарегистрированных клеток. a, Пример проб на опознание. b, Расположение электродов\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Задача, поведение и сводка зарегистрированных клеток. a, Пример проб на опознание. b, Расположение электродов, показанное на атласе мозга. Каждая точка представляет собой пучок микропроволок, окрашенный в соответствии с областью регистрации. Координаты белого вещества или внецелевые координаты обусловлены объединением с шаблонным мозгом. c, Возможные типы проб: ложноположительные (FP, выделены красным) возникают, когда испытуемый классифицирует «новое» изображение как «старое» (ответ «Да»). d, Слева: пример целевого изображения (старое), которое изучалось. Справа: визуально похожее изображение-приманка, которое не изучалось (новое), но было классифицировано как старое (ложноположительное) с высокой вероятностью (частота FP = 54%). e, Количество изолированных одиночных единиц (серый, общее n по всем областям мозга = 3506) и количество единиц, исключенных на основе поведения (красный, n = 660). (f–j) Поведение. f, Точность памяти на опознание. Каждая точка — одна сессия (n = 133 у 97 пациентов), красный цвет — среднее ± стандартное отклонение. (g–f), Точность как функция уверенности для отдельных сессий (серый) и в среднем (красный). Каждая точка данных представляет собой разный уровень уверенности, причем 6 соответствует наивысшей уверенности для старых проб. h, AUC под ROC-кривой, показанной на (g). Пунктирная красная линия — один из критериев включения (AUC &amp;gt;= 0.6, включено n = 112, 84 пациента). i, Точность была значительно выше в пробах с высокой уверенностью по сравнению с низкой (p = 1.24×10⁻³¹, t(110) = 16.55, парный t-тест). Каждая линия — отдельная сессия. j, Неправильные ответы («да» или «нет») имели значительно более низкие оценки уверенности по сравнению с правильными ответами (TP против FP: t(110) = 13.41, p = 7.05×10⁻²⁵, парный t-тест; TN против FN: t(111) = -8.72, p = 3.11×10⁻¹⁴, парный t-тест. Обратите внимание, что отрицательные значения t обусловлены тем, что более высокий рейтинг уверенности соответствует более низкой уверенности для ответа «нет», см. панель a). *** p &amp;lt; 0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Когда мы принимаем незнакомый предмет за старый из-за внешнего сходства, в мозге происходит сбой механизма разделения образов. Долгое время оставалось неясным, как именно отдельные нервные клетки человека справляются с этой задачей. Нейробиологи записали электрическую активность тысяч нейронов у пациентов во время тестов на память. Оказалось, что в гиппокампе существуют специализированные клетки, которые различают истинно знакомые образы и похожие на них ложные стимулы. Это открытие впервые подтверждает существование клеточного механизма разделения памяти у людей.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Записана активность 3506 нейронов у 97 пациентов при тестах на память.&lt;/li&gt;\n&lt;li&gt;Найдены нейроны, различающие реальные воспоминания и похожие ложные образы.&lt;/li&gt;\n&lt;li&gt;Удаление этих клеток разрушает градиент силы памяти в гиппокампе.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Исследователи сосредоточились на изучении того, как мозг проводит границу между новой информацией и уже имеющимися воспоминаниями. Этот процесс, известный как разделение образов, долгое время изучался на животных, однако прямых доказательств его наличия на уровне отдельных нейронов у людей не было. В ходе работы ученые записали активность 3506 одиночных нейронов у 97 пациентов во время выполнения теста на узнавание визуальных образов. Участникам показывали изображения, а затем просили определить, видели ли они их раньше, оценивая при этом уверенность в своем ответе.&lt;/p&gt;\n&lt;p&gt;Анализ показал наличие особых нейронов, которые реагируют по-разному на правильно узнанные знакомые объекты и на новые изображения, ошибочно принятые за старые. Такие клетки были обнаружены в гиппокампе и других областях мозга. При удалении этих элементов из аналитической модели исчезал непрерывный градиент силы памяти, что указывает на их ключевую роль в различении похожих следов памяти. На уровне нейронных популяций эти сигналы предсказывали истинность воспоминания в гиппокампе и итоговое решение в пре-дополнительной моторной зоне.&lt;/p&gt;\n&lt;p&gt;Полученные данные разрешают давний спор о том, используют ли люди разделение образов для кодирования эпизодической памяти. До этого большинство данных получалось с помощью функциональной магнитно-резонансной томографии или на основе абстрактных концептуальных нейронов, которые не фиксировали разницу между похожими объектами. Новое исследование связывает активность единичных нейронов с поведенческими ошибками памяти, демонстрируя, как мозг выстраивает цепочку от первичного извлечения следа до принятия окончательного решения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на пациентах с фармакорезистентной эпилепсией, что может накладывать отпечаток на работу их височных долей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Теоретические модели предполагают, что разделение паттернов — вычислительный процесс, который, как считается, реализуется гиппокампом, — позволяет нам различать знакомые и новые объекты. Однако вопрос о том, функционирует ли разделение паттернов в гиппокампе человека, остается спорным, так как не было установлено ни одного коррелята на уровне отдельных нейронов. Мы зарегистрировали активность 3506 отдельных нейронов в мозге человека у 97 пациентов во время выполнения ими задачи на память распознавания, в которой новые изображения, похожие на ранее увиденные, приводили к ложным воспоминаниям и связанным с ними поведенческим ошибкам.&lt;/p&gt;\n&lt;p&gt;Мы идентифицировали два типа нейронов, селективных к памяти, распределенных по всему мозгу: нейроны, реагирующие по-разному на ошибочно распознанные новые и правильно распознанные знакомые изображения способом, совместимым с разделением паттернов, и нейроны, сигнализирующие о выборе испытуемого. На уровне популяции эти клетки предсказывали мнемоническую истину в гиппокампе и решение в пре-дополнительной моторной области, иллюстрируя прогрессию от мнемонических сигналов к принятию решений. Удаление клеток, сигнализирующих о разделении паттернов, приводило к исчезновению градиента непрерывной силы памяти, присутствующего в гиппокампе, что предполагает роль этих клеток в разделении воспоминаний различной силы. Эти результаты устанавливают коррелят на уровне отдельных клеток для мнемонического разделения паттернов в гиппокампе человека и показывают его поведенческую значимость в эпизодической памяти.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Обнаружены нейроны, обеспечивающие разделение паттернов в гиппокампе человека: они различают похожие новые и знакомые стимулы, что критически важно для формирования точных эпизодических воспоминаний.&lt;br /&gt;\n[!tip] Разделение паттернов — это нейробиологический процесс, при котором мозг преобразует схожие входные сигналы в четкие, неперекрывающиеся нейронные представления, чтобы избежать путаницы между похожими событиями.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Люди способны формировать огромное количество детализированных воспоминаний об индивидуальном опыте, что позволяет нам планировать, учиться и принимать решения. Несмотря на то, что многие наши переживания происходят в крайне похожих условиях (например, дома или в офисе), многие из них кодируются как отдельные воспоминания. Важным открытым вопросом остается то, как мозг справляется с этой задачей. Решение этой проблемы требует разрешения компромисса между двумя, казалось бы, несовместимыми целями. С одной стороны, знакомый объект должен распознаваться во многих различных контекстах, что требует обобщения и инвариантности. С другой стороны, новые объекты должны отличаться от сохраненных воспоминаний, даже если они очень похожи, что требует тонкого мнемонического различения. Критически важно, что это различение часто должно происходить после однократного воздействия (как в случае с эпизодической памятью). Эти взаимодополняющие процессы часто называют, соответственно, паттерным завершением и паттерным разделением. В связи с этим, основное внимание в данной области уделяется выявлению признаков этих двух процессов в гиппокампе (HPC) — области, необходимой для формирования памяти. Однако, несмотря на обширную литературу, остается неизвестным, играет ли паттерное разделение хоть какую-то роль в эпизодической памяти человека. Ключевой причиной этого значительного пробела в знаниях является то, что у людей не было идентифицировано ни одного нейронного коррелята паттерного разделения. В данной работе мы выявляем такой коррелят для сигналов силы памяти.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В данной работе впервые выявлен нейронный коррелят паттерного разделения в гиппокампе человека, что позволяет разрешить давний спор о его роли в эпизодической памяти.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нейробиологические доказательства роли паттерного разделения в памяти человека в основном получены с помощью неинвазивной нейровизуализации методом фМРТ. На уровне BOLD-фМРТ активность в гиппокампе демонстрирует отсутствие подавления повторения в ответ на «приманочные» стимулы — новые стимулы, которые похожи на ранее виденные объекты. Этот паттерн широко рассматривается как доказательство успешного различения между очень похожими входными данными и, следовательно, как отражение процесса паттерного разделения. Однако несколько различных теоретических механизмов, включая конъюнктивное кодирование и сигнализацию соответствия-несоответствия или новизны, могут приводить к точно такому же паттерну BOLD-фМРТ сигналов, что делает этот подход неподходящим для выбора между различными теориями. Кроме того, в этих исследованиях не было показано, что этот признак паттерного разделения связан с мнемоническими процессами, поскольку память участников на представленные стимулы не тестировалась.&lt;/p&gt;\n&lt;p&gt;На уровне отдельных нейронов, напротив, большинство работ на сегодняшний день свидетельствует о том, что паттерное разделение в мозге человека отсутствует. Например, записи активности клеток гиппокампа человека показывают, что концептуальные нейроны кодируют идентичность стимула абстрактным образом, не проявляя чувствительности даже к относительно большим различиям, если стимул относится к той же концепции или визуальной категории. Этот паттерн ответа противоположен тому, что ожидалось бы, если бы активность этих клеток была результатом паттерного разделения. Это связано с тем, что высокоинвариантная активность приводит к перекрывающимся представлениям для похожих, но различных входных данных, делая их неразличимыми. Эти данные подтверждают вывод о том, что паттерное разделение не играет никакой роли в эпизодической памяти человека. Вместо этого было предложено, что эпизодические воспоминания кодируются частично перекрывающимися ансамблями концептуальных клеток — концепция, в которой паттерное разделение не играет роли. Это предложение вызвало обширные дискуссии, которые остаются неразрешенными. Здесь, идентифицируя коррелят на уровне отдельных нейронов, мы разрешаем этот спор, демонстрируя доказательства паттерного разделения в гиппокампе человека.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Паттерное разделение — это нейронный механизм, позволяющий мозгу кодировать похожие события как уникальные воспоминания, предотвращая их смешивание, в то время как паттерное завершение позволяет восстановить полное воспоминание по частичному сигналу.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;С другой стороны, у грызунов доказательства паттерного разделения убедительны в области пространственного кодирования. Основной вывод заключается в том, что нейроны места в гиппокампе меняют свою активность («перекартируются») в ответ даже на тонкие изменения в окружающей среде, что приводит к некоррелированному коду для двух похожих, но различных сред, как и следовало ожидать от паттерного разделения. Теоретически, объяснением этого факта стало конъюнктивное кодирование — тип кодирования, который часто возникает из-за высокого коэффициента расходимости (fan-out ratio). Например, в гиппокампе редкие проекции из энторинальной коры в зубчатую извилину (DG) приводят к тому, что отдельные нейроны DG активируются только уникальными комбинациями (конъюнкциями) входных признаков. В этой схеме кодирования для двух похожих стимулов (здесь — двух разных локаций) задействуются разные популяции нейронов DG, поскольку даже небольшие изменения во входных данных меняют комбинацию присутствующих признаков.&lt;/p&gt;\n&lt;p&gt;Первоначальные авторы концепции паттерного разделения предполагали, что его основная роль заключается в том, чтобы позволить организму различать знакомые и похожие на них новые стимулы. Поведенчески эта способность нарушается при поражениях частей медиальной височной доли, которые, согласно исследованиям на грызунах, считаются важными для нейронного паттерного разделения. В частности, пациенты с повреждением DG демонстрируют нарушение различения между ранее виденными и очень похожими изображениями, таким образом, у них отсутствует поведенческий признак паттерного разделения. Однако этот аспект паттерного разделения не исследовался ни в работах на грызунах, ни в исследованиях концептуальных клеток у людей, где вместо этого тестировалось паттерное разделение между представлениями содержания опыта (пространство и концепты соответственно). В результате эти исследования не затрагивали аспект паттерного разделения, наиболее важный для памяти: различие между новыми и знакомыми стимулами. Напротив, именно это сравнение проверяется в соответствующих исследованиях фМРТ, которые действительно сообщают о доказательствах, согласующихся с паттерным разделением.&lt;/p&gt;\n&lt;p&gt;Чтобы заполнить этот пробел, мы исследовали, проявляют ли сигналы силы памяти в височной доле человека признаки паттерного разделения. Мы сделали это путем регистрации активности отдельных нейронов у пациентов с эпилепсией во время выполнения ими задачи на память распознавания с использованием изображений, различающихся по степени сходства друг с другом.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"zadacha-i-povedenie\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#zadacha-i-povedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Задача и поведение&lt;/span&gt;&lt;/a&gt;Задача и поведение&lt;/h4&gt;\n&lt;p&gt;Пациенты (133 сессии) выполняли задачу на память распознавания с использованием изображений в качестве стимулов. Сначала, на этапе обучения, пациенты просматривали серию новых изображений. Затем, на этапе распознавания, те же изображения предъявлялись снова вперемешку с новыми (Рис. 1a). Для каждого изображения пациенты указывали, видели ли они его раньше («старое») или нет («новое»), и сообщали об уровне своей уверенности в этом суждении (Рис. 1a). Задача имеет 3 варианта, идентичных по дизайну, но использующих разные стимулы. Пациенты правильно идентифицировали 68,5±16,3% (среднее±ст. откл.) старых изображений (истинно положительный результат, TP или частота попаданий; Рис. 1f, ось y). В то же время они ошибочно отмечали как «старые» 26,8±18,3% (среднее±ст. откл.) новых изображений — пробы, которые мы называем ложноположительными (FP, Рис. 1f, ось x). Точность распознавания возрастала как функция уверенности (Рис. 1g, i-j). Для количественной оценки связи между точностью распознавания и уверенностью мы вычислили ROC-кривую (receiver operating characteristic) для каждой сессии (Рис. 1g). Пробы с разным уровнем уверенности располагались в разных точках вдоль ROC-кривой, отражая систематические различия в результатах в зависимости от уровня уверенности (Рис. 1g). Средняя площадь под ROC-кривой (AUC) составила 0,75±0,1 (Рис. 1h). Попарные сравнения между сессиями показали, что пробы, оцененные с высокой уверенностью (1 для «нового», 6 для «старого»), имели значительно более высокую точность, чем пробы с низкой уверенностью (2–3 для «нового», 4–5 для «старого»; 0,82±0,11 против 0,61±0,11 (среднее±ст. откл.), p=1,24x10^-31, парный t-критерий, Рис. 1i). Неверные ответы имели значительно более низкие оценки уверенности, чем соответствующие им правильные ответы (TP против FP: 5,5±0,35 против 5±0,52, p=7,05x10^-25; истинно отрицательный (TN) против ложноотрицательного (FN): 1,69±0,45 против 1,95±0,53, p=3,11x10^-14, парный t-критерий, все значения — среднее±ст. откл.; Рис. 1j). Эти результаты подтверждают валидность субъективных оценок уверенности как в правильных, так и в ошибочных пробах.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h-f1.jpg\" alt=\"Рисунок 1. Задача, поведение и сводка зарегистрированных клеток. a, Пример проб на опознание. b, Расположение электродов\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Задача, поведение и сводка зарегистрированных клеток. a, Пример проб на опознание. b, Расположение электродов, показанное на атласе мозга. Каждая точка представляет собой пучок микропроволок, окрашенный в соответствии с областью регистрации. Координаты белого вещества или внецелевые координаты обусловлены объединением с шаблонным мозгом. c, Возможные типы проб: ложноположительные (FP, выделены красным) возникают, когда испытуемый классифицирует «новое» изображение как «старое» (ответ «Да»). d, Слева: пример целевого изображения (старое), которое изучалось. Справа: визуально похожее изображение-приманка, которое не изучалось (новое), но было классифицировано как старое (ложноположительное) с высокой вероятностью (частота FP = 54%). e, Количество изолированных одиночных единиц (серый, общее n по всем областям мозга = 3506) и количество единиц, исключенных на основе поведения (красный, n = 660). (f–j) Поведение. f, Точность памяти на опознание. Каждая точка — одна сессия (n = 133 у 97 пациентов), красный цвет — среднее ± стандартное отклонение. (g–f), Точность как функция уверенности для отдельных сессий (серый) и в среднем (красный). Каждая точка данных представляет собой разный уровень уверенности, причем 6 соответствует наивысшей уверенности для старых проб. h, AUC под ROC-кривой, показанной на (g). Пунктирная красная линия — один из критериев включения (AUC &amp;gt;= 0.6, включено n = 112, 84 пациента). i, Точность была значительно выше в пробах с высокой уверенностью по сравнению с низкой (p = 1.24×10⁻³¹, t(110) = 16.55, парный t-тест). Каждая линия — отдельная сессия. j, Неправильные ответы («да» или «нет») имели значительно более низкие оценки уверенности по сравнению с правильными ответами (TP против FP: t(110) = 13.41, p = 7.05×10⁻²⁵, парный t-тест; TN против FN: t(111) = -8.72, p = 3.11×10⁻¹⁴, парный t-тест. Обратите внимание, что отрицательные значения t обусловлены тем, что более высокий рейтинг уверенности соответствует более низкой уверенности для ответа «нет», см. панель a). *** p &amp;lt; 0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Точность распознавания коррелирует с уверенностью (AUC 0,75), при этом высокие оценки уверенности значимо повышают точность ответов (p=1,24x10^-31).&lt;br /&gt;\n[!tip] ROC-кривая (кривая ошибок) — график, показывающий соотношение между долей истинно положительных и ложноположительных ответов, позволяющий оценить качество классификации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"perceptivnoe-shodstvo-provociruet-lozhnye-trevogi-v-pamyati-raspoznavaniya\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#perceptivnoe-shodstvo-provociruet-lozhnye-trevogi-v-pamyati-raspoznavaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Перцептивное сходство провоцирует ложные тревоги в памяти распознавания&lt;/span&gt;&lt;/a&gt;Перцептивное сходство провоцирует ложные тревоги в памяти распознавания&lt;/h4&gt;\n&lt;p&gt;Пациенты совершали два типа ошибок (Рис. 1c, красные рамки): они либо забывали изображение, которое видели ранее (FN), либо идентифицировали новое изображение как старое (FP). Здесь мы фокусируемся на ошибках FP, поскольку именно в таких пробах предположительно происходит сбой разделения паттернов. Мы выдвинули гипотезу, что FP возникают из-за того, что новые изображения похожи на ранее изученные (Рис. 1d показывает пример), из-за чего они оцениваются как старые. Если это так, то FP являются результатом неспособности разделить два паттерна — тот, что хранится в памяти, и новый.&lt;/p&gt;\n&lt;p&gt;Сначала мы проверили, могут ли предобученные глубокие сети предсказать, насколько похожими воспринимаются пары изображений людьми. Мы использовали (i) AlexNet и ResNet50 — две сверточные нейронные сети (CNN), обученные для категоризации объектов, (ii) DINOv2 — самообучающийся vision transformer (ViT), извлекающий универсальные визуальные признаки, и (iii) CLIP — модель на базе ViT, обученную с использованием естественного языка для сопоставления текста и изображений. В качестве контроля мы включили модели, использующие только (i) низкоуровневые визуальные признаки и (ii) семантическую модель «категорий», построенную путем присвоения значения несходства 0 парам изображений внутри одной категории и 1 — парам из разных категорий. В совокупности эти модели охватывают различные архитектуры, стратегии обучения и домены признаков.&lt;/p&gt;\n&lt;p&gt;Чтобы оценить, насколько хорошо эти модели отражают человеческие суждения о сходстве для конкретных стимулов, использованных в нашей задаче, мы также попросили людей оценить сходство подмножества изображений (Рис. SN; 25 изображений, по пять в каждой из пяти категорий; см. Методы). Затем мы построили матрицы репрезентативного несходства (RDM) для всех моделей (Рис. SN) и сравнили полученные RDM с RDM, полученными от людей (см. Методы). Все модели, кроме пиксельной, показали результаты значительно лучше случайных (односторонний t-критерий, поправка Бонферрони α = 0,002 для 6 моделей), при этом наиболее эффективными оказались...&lt;/p&gt;\n&lt;p&gt;Наконец, мы проверили, предсказывают ли полученные метрики сходства частоту FP (Рис. SN). Для этого для каждого нового изображения 𝑖, предъявленного во время извлечения, мы вычислили вероятность ошибочного распознавания этого изображения как «старого» (частота ложных тревог) среди всех пациентов, видевших это изображение (n=41 для варианта задачи 1, n=16 для варианта 2 и n=53 для варианта 3). Метрики сходства, полученные с помощью глубоких нейронных сетей (DNN) между данным новым изображением и всеми ранее показанными, значимо предсказывали частоту ложных тревог (Рис. 2a показывает модель «CLIP»; Спирмен r=0,4, p=0,009; r=0,7, p=4,9x10^-10; r=0,5, p=0,0006 для вариантов 1, 2 и 3 соответственно). Это также верно для оценок сходства, полученных от людей, которые предсказывали FP с аналогичной (если не меньшей) точностью (Рис. 2b; Спирмен r=0,3, p=0,02). Эти данные показывают, что попарные сходства, полученные с помощью DNN, являются хорошими предикторами частоты FP.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h-f2.jpg\" alt=\"Рисунок 2. Вероятность ложной тревоги прогнозируется перцептивным сходством между парами изображений. a, Корреляция межд\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2. Вероятность ложной тревоги прогнозируется перцептивным сходством между парами изображений. a, Корреляция между сходством на основе DNN CLIP (максимальное сходство между каждым «новым» изображением, предъявленным во время фазы опознания эксперимента (рис. 1a), и всеми изображениями обучения) и частотой ложноположительных результатов (FP), рассчитанной по всем пациентам, с цветовой кодировкой по вариантам задачи. Для всех 3 вариантов задачи сходство изображений значимо коррелировало с частотой FP (r = 0.4, p = 0.009; r = 0.7, p = 4.9×10⁻¹⁰; r = 0.5, p = 0.0006 для вариантов 1, 2 и 3 соответственно, корреляция Спирмена). b, Корреляция между перцептивным сходством человека (максимальное сходство между каждым «новым» изображением и всеми изображениями обучения из той же семантической категории) и частотой ложноположительных результатов (r = 0.3, p = 0.02, корреляция Спирмена); оценки собирались только для варианта задачи 3. Каждая точка на a и b — это «новое» изображение. c, Статистическое сравнение повторного анализа, показанного на панелях (a, b), для разных моделей. Визуальное сходство, вычисленное с помощью различных признаков (ResNet50, CLIP, DINOv2, оценки людей), объясняло значительную долю дисперсии частоты ложноположительных результатов, в то время как запоминаемость изображений (ResMem) — нет. Левая ось y соответствует R-квадрату (серые полосы), а правая ось y — p-значению регрессии, при этом отдельные значения изображены в виде черных точек на графике. Красная пунктирная линия обозначает уровень значимости 0.05, используемый для указания статистической значимости. * p &amp;lt; 0.05, ** p &amp;lt; 0.01, *** p &amp;lt; 0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Ложные тревоги могут возникать и по причинам, отличным от визуального сходства, включая внутреннее чувство узнаваемости изображения и принадлежность к категории. В качестве контроля этих двух факторов мы включили в наш анализ семантическую категорию и показатели запоминаемости, количественно оцененные с помощью ResMem — нейронной сети, обученной предсказывать запоминаемость изображений. Сравнение доли объясненной дисперсии между метриками, полученными с помощью CLIP и DINOv2, с этими двумя контрольными моделями показывает, что ни одна из них не объяснила сопоставимый объем дисперсии. Действительно, запоминаемость изображения (ResMem) не объясняла значимую долю дисперсии в вероятностях FP (Рис. 2c, r^2=0,02, p=0,1). В совокупности эти результаты подтверждают нашу гипотезу о том, что ложные тревоги у наших пациентов во время выполнения задачи возникают, по крайней мере частично, из-за сходства новых изображений с ранее изученными. Это говорит о том, что в нашей задаче ложные тревоги обусловлены сбоями в разделении паттернов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метрики сходства, полученные через DNN, значимо предсказывают частоту ложных тревог (p&amp;lt;0,01), что подтверждает гипотезу о сбое разделения паттернов.&lt;br /&gt;\n[!tip] Разделение паттернов (pattern separation) — когнитивный процесс, позволяющий мозгу различать похожие воспоминания, чтобы они не накладывались друг на друга.&lt;br /&gt;\n[!warning] Исследование основано на поведенческих данных пациентов и корреляционном анализе нейросетевых моделей, что не доказывает прямую причинно-следственную связь в нейронных цепях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"registraciya-nejronnoj-aktivnosti\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#registraciya-nejronnoj-aktivnosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Регистрация нейронной активности&lt;/span&gt;&lt;/a&gt;Регистрация нейронной активности&lt;/h4&gt;\n&lt;p&gt;Во время выполнения пациентами задания мы регистрировали активность отдельных нейронов билатерально в гиппокампе (HPC, n=1093), миндалевидном теле (AMY, n=1359), дорсальной передней поясной коре (ACC, n=826) и пре-дополнительной моторной области (preSMA, n=888; Рис. 1b,e). Из всех зарегистрированных сессий мы включили только те, где точность поведенческих ответов была достаточной (AUC на уровне пациента &amp;gt; 0.6, красная пунктирная линия на Рис. 1h) и ответы охватывали как высокую, так и низкую уверенность (n=112 сессий соответствовали этим критериям, см. Методы). Всего в отобранных сессиях мы зарегистрировали 950, 1187, 684 и 685 клеток в HPC, AMY, ACC и preSMA соответственно (всего 3506, Рис. 1e).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анализ охватил 3506 нейронов из 112 сессий, отобранных по критерию точности (AUC &amp;gt; 0.6) и вариативности уверенности в ответах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kletki-s-selektivnostyu-k-pamyati-nesut-signal-ob-istinnom-sostoyanii-pamyati-dazhe-pri-oshibochnom-povedenii\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#kletki-s-selektivnostyu-k-pamyati-nesut-signal-ob-istinnom-sostoyanii-pamyati-dazhe-pri-oshibochnom-povedenii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Клетки с селективностью к памяти несут сигнал об истинном состоянии памяти даже при ошибочном поведении&lt;/span&gt;&lt;/a&gt;Клетки с селективностью к памяти несут сигнал об истинном состоянии памяти даже при ошибочном поведении&lt;/h4&gt;\n&lt;p&gt;Далее мы исследовали характеристики нейронных ответов, связанных с ложноположительными результатами (FP). Для этого мы изучили клетки, селективные к памяти (MS-клетки), которые по-разному реагируют на новые и знакомые стимулы в зависимости от силы памяти. Мы идентифицировали MS-клетки, сопоставляя частоту импульсации во время предъявления стимула между правильными ответами на новые и старые стимулы (Рис. 3a,b демонстрируют примеры; см. Методы; «правильный» здесь относится к точности ответа пациента в данной попытке). Чтобы избежать искажений, связанных с категорией стимула, мы также отобрали клетки, которые различали категории с помощью однофакторного дисперсионного анализа (ANOVA, 1 × 5) по частоте импульсации в попытках с разными категориями стимулов. Значительная доля клеток во всех четырех областях регистрации была классифицирована как MS-клетки (Рис. 3c). Из общего числа клеток MS-клетками оказались 10% (94/950) в HPC, 9% (102/1187) в AMY, 9% в ACC (60/684) и 16% (113/685) в preSMA (уровень случайности составляет 5%; абсолютные числа см. на Рис. SN 3a-e). С другой стороны, MS-клетки, которые также были селективны к визуальным категориям (визуально-селективные, VS-клетки), встречались редко (&amp;lt;2% во всех областях мозга, Рис. 3c). Ответы MS-клеток модулировались силой памяти во всех областях мозга, кроме ACC: их сигнал был сильнее в попытках с высокой уверенностью по сравнению с низкой (Рис. 3d, HPC AUC 0.65±0.01 против 0.6±0.02, p=0.006; AMY 0.66±0.01 против 0.61±0.01, p=0.0009; ACC 0.66±0.01 против 0.62±0.03, p=0.1; preSMA 0.68±0.01 против 0.64±0.01, p=0.03, парный t-критерий; Рис. 3e для сравнения AUC отдельно для клеток, предпочитающих новизну и знакомость).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h-f3.jpg\" alt=\"Рисунок 3. Подписи одиночных нейронов памяти на опознание: клетки, избирательные к памяти. (a–b) Примеры клеток, избират\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3. Подписи одиночных нейронов памяти на опознание: клетки, избирательные к памяти. (a–b) Примеры клеток, избирательных к памяти. Начало стимула при t = 1. a, Пример нейрона гиппокампа, который увеличил частоту импульсации сильнее всего для правильно опознанных старых стимулов по сравнению с новыми. b, Другой пример клетки, которая увеличивает частоту импульсации для правильно опознанных новых стимулов по сравнению со старыми. c, Доля всех зарегистрированных клеток, классифицированных как клетки, избирательные к памяти (MS). Темно-серый цвет обозначает MS-клетки, которые дополнительно классифицировались как VS-клетки. Доля MS-клеток больше, чем ожидалось случайно (красная линия) во всех областях (HPC, p = 0.001, AMY, p = 0.001, ACC, p = 0.002, preSMA, p = 0.001). d, e, Сигнал MS-клеток сильнее в пробах с высокой уверенностью по сравнению с низкой. d, Парное сравнение значений AUC MS-клеток для высокой и низкой уверенности по областям мозга (p-значения получены с помощью парного t-теста). MS-клетки во всех областях мозга, кроме ACC (p = 0.1), имели значительно более высокие значения AUC для проб с высокой уверенностью по сравнению с низкой (HPC p = 0.006, AMY p = 0.0009, preSMA p = 0.03). В анализ d и e были включены только поведенческие сессии, в которых пациенты могли различать высокую и низкую уверенность (69 сессий у 53 пациентов). e, То же, что и d, но представлено в виде диаграммы рассеяния отдельно для клеток, предпочитающих новизну (синие точки), и клеток, предпочитающих знакомство (красные точки), во всех 4 областях мозга. Обратите внимание, что для обоих типов MS-клеток AUC для проб с высокой уверенностью выше, чем с низкой. f, Иллюстрация гипотезы: активность нейронов, использующих разделение паттернов (синие точки), надежно различает истинно старые (TP) и ложно старые (FP) стимулы, несмотря на то, что ответ в обоих случаях является «старым». И наоборот, нейроны, демонстрирующие активность, подобную завершению паттернов (пурпурные точки), реагируют на FP-пробы таким же или похожими образом, как и на TP-пробы. Точки показывают гипотетические смоделированные данные. (g–h) Данные для проверки гипотезы, показанной на (f). Во всех зарегистрированных MS-клетках активность существенно различалась между TP- и FP-пробами, что указывает на наличие сигнала памяти, а не решения. g, Перекрестно проверенная производительность декодирования одиночных клеток для нейронов, которые были избирательны к памяти по крайней мере в 75% случайно выбранных проб, с цветовой кодировкой по областям мозга. Красный — среднее ± стандартное отклонение. Для многих MS-клеток производительность декодирования TP против FP превышала случайный уровень. h, Парное сравнение производительности декодирования TP против TN и TP против FP для клеток из g. В HPC, ACC и преСМА и TP против TN, и TP против FP декодировались значительно выше случайного уровня (p = 0.001), причем декодирование TP против TN было значительно выше, чем TP против FP (HPC p = 7.5×10⁻⁵, ACC p = 7.6×10⁻⁵, преСМА p = 7.4×10⁻⁶, тест знаковых рангов). В AMY достоверно декодировалось только TP против TN (p = 0.001, TP против FP p = 0.4). * p &amp;lt; 0.05, ** p &amp;lt; 0.01, *** p &amp;lt; 0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MS-клетки (memory-selective) — нейроны, меняющие частоту разрядов в зависимости от того, является ли стимул новым или уже знакомым, что позволяет им кодировать силу следа памяти.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Как MS-клетки реагировали во время попыток FP? Мы предположили, что если ответ MS-клеток отражает разделение паттернов, их активность должна различать истинно старые (TP) и FP-попытки, несмотря на одинаковый поведенческий ответ («старый») в обоих случаях (Рис. 3f, синий цвет). Учитывая значимость теории разделения паттернов для гиппокампа, мы предположили, что это различие будет особенно выражено именно там. Напротив, если ответ MS-клеток при FP-попытках совпадает с ответом при TP-попытках (Рис. 3f, пурпурный цвет), то клетки сигнализируют о принятом решении, что отражает завершение паттерна. Чтобы избежать искажений из-за одновременной настройки на визуальную категорию, мы исключили небольшое число MS-клеток, которые также были визуально настроены, из всех последующих анализов (см. Методы; это не изменило результаты).&lt;/p&gt;\n&lt;p&gt;Для оценки ответа MS-клеток во время FP-попыток мы обучили бинарный однонейронный декодер классифицировать стимулы, предъявленные в правильных попытках, как «новые» или «старые». Если для отложенных попыток в обучающей выборке точность декодирования «новое против старого» была выше случайной, клетка классифицировалась как MS-клетка. Затем мы оценили эффективность декодирования на отложенных попытках — не виденных при отборе MS-клеток — для различения TP против TN (правильно старые против правильно новых) или TP против FP (правильно старые против ошибочно новых). Этот подход позволил нам сравнить эффективность декодирования как для правильных ответов, так и для ложных тревог во всех областях мозга (мы использовали только клетки, классифицированные как MS-клетки не менее чем в 75% разбиений на обучение/тест). Однонейронные декодеры надежно декодировали память из отложенных правильных попыток во всех областях (Рис. 3g-h, ось y; эффективность декодирования в HPC 0.61±0.07, AMY 0.60±0.06, ACC 0.64±0.06, preSMA 0.63±0.07, p=0.001; случайный уровень — 0.5). Переходя к ошибочным попыткам, декодирование TP против FP в среднем по всем MS-клеткам было выше случайного в HPC (0.54±0.11, p=0.001), а также в ACC и preSMA (0.54±0.11 и 0.55±0.12 соответственно; p=0.001 для обоих). Во всех трех областях, где истинное состояние FP-попыток поддавалось декодированию, различение TP против TN было значительно точнее, чем TP против FP (Рис. 3h; HPC p=7.5x10-5, ACC p=7.6x10-5, preSMA p=7.4x10-6, критерий знаков), что подчеркивает поведенческую значимость. Этот результат согласуется с наличием сигнала, связанного с разделением паттернов, в MS-клетках HPC, ACC и preSMA как группе.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Декодирование показало, что MS-клетки в HPC, ACC и preSMA способны различать истинно старые стимулы и ложноположительные ответы, что указывает на работу механизмов разделения паттернов даже при ошибочном узнавании.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"signatura-razdeleniya-patternov-na-urovne-otdelnyh-nejronov-dva-tipa-ms-kletok-v-mtl-i-mfc\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#signatura-razdeleniya-patternov-na-urovne-otdelnyh-nejronov-dva-tipa-ms-kletok-v-mtl-i-mfc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сигнатура разделения паттернов на уровне отдельных нейронов: два типа MS-клеток в MTL и MFC&lt;/span&gt;&lt;/a&gt;Сигнатура разделения паттернов на уровне отдельных нейронов: два типа MS-клеток в MTL и MFC&lt;/h4&gt;\n&lt;p&gt;Существуют ли различные типы MS-клеток, где одни отражают завершение паттерна, а другие — разделение паттерна, как предполагалось ранее (Рис. 3f)? Чтобы ответить на этот вопрос, мы проверили способность отдельных MS-клеток различать попытки с разной истинной природой стимула, но одинаковым поведенческим выбором (TP против FP), или попытки с одинаковой истинной природой, но разным выбором (TN против FP).&lt;/p&gt;\n&lt;p&gt;Мы использовали ту же процедуру кросс-валидации, что описана выше, для проверки этой гипотезы. В каждом разделении на обучающую и тестовую выборки обучающие попытки использовались для двух целей: для обучения декодера одиночных клеток различать TP от FP или TN от FP, и для расчета ROC-AUC одиночного нейрона для того же контраста (см. Методы). Каждая MS-клетка классифицировалась как «выбор памяти» (MC), если её AUC для TN против FP была выше, чем для TP против FP, или как «разделение паттерна» (PS), если её AUC для TP против FP была выше, чем для TN против FP (Рис. 4a). Точность декодирования для обоих контрастов затем оценивалась на основе отложенных тестовых попыток. Для каждой MS-клетки эта процедура давала две меры эффективности декодирования и долю прогонов, в которых она классифицировалась как MC- или PS-клетка (Рис. 4b, Рис. S4a-c).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h-f4.jpg\" alt=\"Рисунок 4. Активность подтипа разделения паттернов MS-клеток различает истинно старые и ложно старые стимулы несмотря на\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4. Активность подтипа разделения паттернов MS-клеток различает истинно старые и ложно старые стимулы несмотря на поведенческие ошибки.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Большинство MS-клеток (72,1%) классифицируются либо как тип MC, либо как PS, что указывает на наличие двух функционально различных популяций нейронов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Большинство MS-клеток были классифицированы либо как тип MC, либо как тип PS (72,1% в четырех областях мозга, Рис. 4b, Рис. S4a-c), что указывает на наличие двух различных типов MS-клеток. Затем мы провели дальнейший анализ.&lt;/p&gt;\n&lt;p&gt;Анализ ошибочных попыток. a, Гипотеза: активность MS-нейронов, отражающих разделение паттернов, позволяет различать истинно старые (TP) и ложно старые (FP) стимулы, несмотря на одинаковый поведенческий выбор, в то время как они не могут различать истинно новые (TN) и FP-попытки, поскольку они имеют общую истинную природу (синий цвет). Напротив, нейроны, сигнализирующие о выборе, дифференцируют стимулы с различными решениями (TN и FP), но не стимулы, которые вызывают одинаковые решения, но имеют разную истинную природу (TP и FP, розовый цвет). b, Большинство MS-клеток в HPC (68,3%) последовательно определяются либо как тип «выбор памяти», либо как «разделение паттерна», что указывает на наличие двух типов MS-клеток. Показана вероятность того, что данная MS-клетка классифицируется как один или другой тип в разных прогонах. Красная линия показывает критерий (75%) для классификации клетки как одного из подтипов. (c-e) MS-клетки различают либо TP и FP, либо TN и FP попытки, но не оба варианта сразу. c, Диаграмма рассеяния кросс-валидированного декодирования одиночных клеток для TN против FP (разный выбор, одинаковая истинная природа) и TP против FP (одинаковый выбор, разная истинная природа). Каждая точка — это клетка. Более темный цвет — среднее ± стандартное отклонение (s.d.) для каждого контраста декодирования. d, То же, что и в c, но представлено как среднее ± s.d. Декодирование TP против TN выше случайного уровня по определению, так как клетки были предварительно отобраны для различения правильных новых и старых попыток (т.е. MS-клетки). PS-клетки обеспечивали декодирование TP против FP выше случайного уровня (p=0,001, истинная природа стимула), тогда как декодирование TN против FP было значимо ниже случайного (p=0,001). MC-клетки обеспечивали декодирование TN против FP выше случайного уровня (p=0,001, поведенческий выбор), тогда как декодирование TP против FP было значимо ниже случайного (p=0,001). e, Доля подтипов PS и MC среди MS-клеток в разных областях мозга. Значимых различий в пропорциях не обнаружено. (f-i), Примеры MS-клеток, классифицированных как подтип PS или MC. Примеры клеток «разделения паттерна» (PS) в HPC (f) и preSMA (g). Примеры клеток «выбора памяти» (MC) в HPC (h) и preSMA (i). Заметим, что PS-клетки, когда они предпочитают новые стимулы (темно-синий цвет), также реагируют на ошибочные попытки, которые являются новыми, но были ошибочно распознаны как «старые» (FP, бежевый цвет). Напротив, MC-клетки реагируют на попытки с одинаковым поведенческим выбором: «старые» правильные (красный) и «старые» неправильные (бежевый) для всех MS-клеток (на основе отложенных попыток), которые были классифицированы как один из типов не менее чем в 75% прогонов (Рис. 4f-i показывают примеры).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ROC-AUC (площадь под кривой) — метрика качества классификации: значение 0,5 означает случайное угадывание, 1,0 — идеальное разделение классов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Только клетки, классифицированные как PS, позволяли значимое декодирование TP против FP в отложенных тестовых попытках (Рис. 4c, d синий цвет, ось x; на рисунке показано для HPC: 0,62±0,08 (среднее±s.d), p=0,001; для других областей мозга см. Рис. S4d-i). Точность декодирования выбора для PS-клеток была значимо ниже случайного уровня (Рис. 4c, d, синий цвет, ось y; 0,45±0,08, p=0,001). Такая эффективность ниже случайной дополнительно подтверждает интерпретацию, что активность этой группы клеток отражает разделение паттернов, поскольку это означает, что PS-клетки последовательно кодируют FP-попытки в соответствии с их истинной природой, а не выбором субъекта, что приводит к систематически инвертированным меткам при декодировании выбора. Этот результат показывает, что ответ этого типа MS-клеток сохраняет точность памяти, несмотря на ошибки пациентов, то есть их ответ отражает нейрональное разделение паттернов.&lt;/p&gt;\n&lt;p&gt;Напротив, MC-клетки позволяли декодирование поведенческого выбора выше случайного уровня (Рис. 4c, d, TN против FP: 0,61±0,07, p=0,001), в то время как декодирование TP против FP было значимо ниже случайного уровня (Рис. 4d, 0,47±0,05, p=0,001). Мы наблюдали в целом ту же картину во всех других местах регистрации: только PS-клетки позволяли значимое декодирование истинной природы памяти из FP-ошибок, в то время как только MC-клетки позволяли значимое декодирование выбора пациента (Рис. S4d-i). Не было обнаружено значимой разницы в доле MS-клеток, классифицируемых как тип PS/MC, между различными областями мозга (Рис. 4e).&lt;/p&gt;\n&lt;h4 id=\"populyacionnye-predstavleniya-istinnogo-sostoyaniya-pamyati-i-povedencheskogo-vybora\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#populyacionnye-predstavleniya-istinnogo-sostoyaniya-pamyati-i-povedencheskogo-vybora\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Популяционные представления истинного состояния памяти и поведенческого выбора&lt;/span&gt;&lt;/a&gt;Популяционные представления истинного состояния памяти и поведенческого выбора&lt;/h4&gt;\n&lt;p&gt;Приведенный выше анализ выявляет признаки разделения паттернов на уровне отдельных нейронов. Было ли разделение паттернов особенно выраженным в гиппокампе (HPC), где, согласно давним гипотезам, оно и должно возникать, или оно присутствует столь же сильно в других областях мозга? Анализ на уровне отдельных нейронов не позволил дать ответ, поскольку разделение паттернов наблюдалось во всех исследованных зонах мозга. Мы предположили, что это связано с высокой степенью корреляции сигналов памяти и выбора, которые различаются только во время ошибочных протб. Поэтому далее мы использовали метод для статистического разделения этих двух сигналов с помощью демикшированного анализа главных компонент (dPCA; см. Методы). Мы определили кодирующие измерения на уровне популяции, которые раздельно улавливают нейронную дисперсию, обусловленную истинным состоянием памяти и сигналами поведенческого выбора (на рис. 5a-e и 5f-j показаны примеры для HPC и preSMA). Эти два кодирующих измерения и их взаимодействие объясняют значительную долю дисперсии в активности популяции (соответственно 19%, 19% и 18% в HPC, рис. 5b; 10%, 13%, 12% в preSMA, рис. 5g; 18%, 19%, 20% в AMY, не показано; 18%, 20%, 20% в ACC, не показано).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Популяционный анализ с помощью dPCA показал, что истинное состояние памяти надежно декодируется на уровне отдельных испытаний только в гиппокампе (HPC, средняя точность 0.67, p=0.003), тогда как в пресумоторной зоне (preSMA) декодируется исключительно поведенческий выбор (0.83, p=1.7x10-8).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Могут ли определенные с помощью dPCA измерения надежно передавать информацию о памяти и выборе в отдельном испытании нисходящей популяции считывания? Чтобы проверить этот вопрос, мы провели декодирование отдельных испытаний для ответов, проецированных на осси dPCA, усредненных в едином временном окне длительностью 1.5 с, которое начинается через 200 мс после предъявления стимула. Для оценки статистической значимости мы использовали декодирование отдельных испытаний на одном оставленном вне выборки испытании каждого типа (правильные и ошибочные испытания как для «новых», так и для «старых» стимулов) в каждом фолде (см. Методы). Только в HPC точность декодирования оказалась статистически значимо выше ожидаемой случайной величины как для истинного состояния памяти, так и для выбора (рис. 5k, слева и справа; средняя точность составляет 0.67, p=0.003, и 0.65, p=0.009 соответственно; случайный уровень равен 0.5). Когда мы проанализировали точность декодирования исключительно для оставленных вне выборки ложноположительных (FP) испытаний (приведенная выше точность представляет собой среднее значение по всем типам испытаний: TP, TN, FP, FN), мы обнаружили, что их можно классифицировать с высокой точностью в HPC, но только вдоль оси dPCA истинного состояния (рис. 5k, слева, бежевые точки, точность=0.72 по сравнению с рис. 5k, справа, бежевые точки, точность=0.45). Напротив, в preSMA декодируемым оказался только поведенческий выбор (рис. 5l, справа, 0.83, p=1.7x10-8, истинное состояние — 0.56, p=0.17). Прямое сравнение точности декодирования между двумя областями мозга (см. Методы) показывает, что в HPC истинное состояние памяти декодируется значительно лучше, чем в preSMA (Δ(HPC, preSMA)=0.1, p=0.004, рис. S6d). Нам не удалось декодировать информацию лучше случайного уровня ни по одному из измерений в амигдале (AMY; рис. S6a, 0.49, p=0.4 и 0.59, p=0.08) и передней поясной коре (ACC; рис. S6b, 0.4, p=0.06 и 0.57, p=0.13). В совокупности этот анализ показывает, что информация об истинном состоянии памяти на уровне отдельного испытания надежно декодировалась на популяционном уровне только в HPC. Напротив, в preSMA на популяционном уровне надежно декодировался только поведенческий выбор субъекта.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод dPCA (демикшированный анализ главных компонент) позволяет разделить общую нервную активность на независимые компоненты, отражающие разные переменные задачи, такие как сенсорный стимул или выбор животного.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Наконец, мы исследовали, вносят ли ранее идентифицированные клетки разделения паттернов (PS-клетки) вклад в популяционное декодирование. Для этого мы сравнили веса, присвоенные dPCA для каждого кодирующего измерения, для клеток, классифицированных как PS, MC или не-MS клетки. Во-первых, MC- и PS-клетки имели более высокие веса dPCA по сравнению с не-MS клетками как для оси истинного состояния (рис. 5m,o; MS p=5.9x10-9, PS p=1.6x10-36, двухвыборочный t-критерий), так и для оси решения (рис. 5n,o; MC p=2.2x10-20, PS p=9.2x10-21, двухвыборочный t-критерий). Во-вторых, PS-клеткам были присвоены значительно более высокие веса вдоль оси истинного состояния по сравнению с MC-клетками (рис. 5m, p=0.005; ось решения: рис. 5n, MC против PS p=0.2). В совокупности эти данные предполагают, что гиппокампальные PS-клетки в первую очередь несут в себе сигнал...&lt;/p&gt;\n&lt;h4 id=\"kletki-razdeleniya-patternov-upravlyayut-signalom-nepreryvnoj-sily-pamyati\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#kletki-razdeleniya-patternov-upravlyayut-signalom-nepreryvnoj-sily-pamyati\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Клетки разделения паттернов управляют сигналом непрерывной силы памяти&lt;/span&gt;&lt;/a&gt;Клетки разделения паттернов управляют сигналом непрерывной силы памяти&lt;/h4&gt;\n&lt;p&gt;Как связаны между собой разделение паттернов и сила памяти? Чтобы ответить на этот вопрос, мы исследовали, как активность PS-клеток связана с силой памяти. Сначала мы повторили популяционный анализ на основе dPCA после исключения PS-клеток. Это привело к исчезновению возможности декодировать истинное состояние из HPC, оставив декодирование выбора неизменным (рис. 6a, средняя точность декодирования для истинного состояния составила 0.5, p=0.5; точность декодирования выбора составила 0.61, p=0.03 соответственно). Это наблюдалось независимо от того, имел ли метод dPCA доступ ко всем зарегистрированным клеткам (анализ до этого) или только к MS-клеткам (средняя точность декодирования истинного состояния и выбора составила 0.56, p=0.17 и 0.63, p=0.01 соответственно). В связи с этим далее мы использовали только MS-клетки в качестве группы для дальнейшего исследования их свойств. Дисперсия, охватываемая dPCA, существенно различалась между MS-клетками в HPC и preSMA. В HPC большая часть объясненной дисперсии частоты импульсации MS-клеток приходилась на истинное состояние стимула (53%, рис. 6b, сверху). Напротив, в preSMA истинное состояние объясняло лишь 21% дисперсии. Вместо этого компонент выбора объяснял наибольшую долю нейронной дисперсии MS-клеток (58%, рис. 6b снизу). Это предполагает, что, хотя отдельные нейроны за пределами HPC все еще несут информацию об истинном состоянии, основным источником вариабельности от испытания к испытанию в областях за пределами HPC (здесь — в preSMA) является поведенческий выбор, тогда как в HPC — истинное состояние. Эти результаты подчеркивают специфичные для конкретных областей различия.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исключение PS-клеток полностью лишает гиппокамп способности декодировать истинное состояние памяти, доказывая их ключевую причинную роль в этом процессе.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Почему пациенты всё же совершают ошибки, учитывая, что в их гиппокампе (HPC) реакция нейронов различалась между ложноположительными (FP) и истинно положительными (TP) ответами? Чтобы ответить на этот вопрос, мы исследовали распределение значений проекций на оси dPCA истинного положения (ground truth) для отдельных попыток. Мы выдвинули гипотезу, что, несмотря на маркировку «новые», попытки FP не идентичны правильным новым попыткам (TN), а вместо этого сдвинуты ближе к попыткам TP, что потенциально приводит к более слабым сигналам для считывания последующими цепями.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нейронные ответы при ложноположительных ошибках (FP) сдвинуты по оси dPCA ближе к истинно положительным ответам (TP), чем к истинно отрицательным (TN), со средним индексом разделимости d'₁ = 0.76 (p = 0.001).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтобы проверить эту гипотезу, мы построили распределения проекций для отдельных попыток, случайно исключая по одной попытке каждого типа и проецируя её на ось dPCA истинного положения, рассчитанную по остальным попыткам (1000 итераций). Сначала мы вычислили d' между значениями проекций FP и TN (Рис. 6c, d'₁) и подтвердили, что эти распределения разделимы (Рис. 6d, d'₁ = 0.76, p = 0.001 по сравнению с нулевым распределением при перемешанных метках). Этот результат показывает, что нейронный ответ во время попыток FP не был идентичен ответу во время попыток TN. Затем мы сравнили разделимость значений проекций FP–TN и TP–FP (Рис. 6c, d'₂) и обнаружили, что разделение TP–FP было больше, чем разделение FP–TN (Рис. 6d, d'₂ = 1.68, Δ(d'₂, d'₁) = 0.92, p = 0.001 по сравнению с нулевым распределением разностей). Такой паттерн ответов указывает на то, что попытки FP остаются ближе к попыткам TN по сравнению с попытками TP, но тем не менее смещены в сторону TP вдоль оси истинного положения dPCA. Этот результат подтверждает нашу гипотезу о том, что попытки FP, несмотря на их декодирование как «новые», менее разделимы с попытками TP вдоль оси истинного положения памяти по сравнению с попытками TN.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h-f6.jpg\" alt=\"Рисунок 6. Нервная активность, связанная с разделением паттернов, вносит вклад в непрерывный сигнал силы памяти. a, Удал\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 6. Нервная активность, связанная с разделением паттернов, вносит вклад в непрерывный сигнал силы памяти. a, Удаление MS-клеток PS-типа (n=20) из популяции гиппокампа (HPC) сводит к нулю способность декодировать истинное положение дел (ground truth) (p=0.5), но не решение (p=0.03). b, Большая часть дисперсии в популяции всех зарегистрированных MS-клеток объясняется истинным положением дел (53%) и решением (58%) в HPC и пре-SMA соответственно. На основе dPCA всех MS-клеток. c, Распределение проекций отдельных попыток на ось декодера dPC истинного положения дел для попыток TP, TN и FP (красный, синий и бежевый цвета). Распределения TP и FP были более различимы, чем FP и TN (d-prime = 1.68 (d’2) и 0.76 (d’1) соответственно). d, Сравнение наблюдаемого d-prime для FP-TN (d’1) и разницы d-prime для TP-FP (d’2) и FP-TN с нулевыми распределениями, полученными путем расчета d-prime и вычисления разницы после перемешивания меток попыток. Ни одно из переставленных значений не превысило наблюдаемые значения как для d’1, так и для d’2 - d’1 (оба p=0.001, определяемые как деленные на количество перестановок). e, Схемы предсказаний теории обнаружения сигналов (SDT). Вверху: сила памяти представлена как непрерывный сигнал с решениями о распознавании, основанными на том, превышает ли этот сигнал пороговое значение решения. На этой оси решения с более высокой уверенностью связаны с большей силой памяти и лежат дальше от критерия середины. Внизу: без PS-клеток не достигается разделения между «старыми» решениями с разной силой памяти (высокая, низкая уверенность TP, FP). f, То же, что и в c, но с попытками TP, построенными отдельно для решений с высокой и низкой уверенностью. В HPC распределение TP с высокой уверенностью (красный цвет) было наиболее отличным от попыток TN, с меньшей различимостью для TP с низкой уверенностью и еще меньшей для попыток FP, как и предсказывает SDT. Когда PS-клетки удалены (g), проекции попыток с разными решениями все еще разделены, в то время как проекции попыток TP и FP с высокой и низкой уверенностью (то же решение) схлопываются на оси истинного положения дел. *** p&amp;lt;0.001&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Размещение попыток FP между попытками TP и TN на оси силы памяти предполагает, что сигнал истинного положения в HPC может соответствовать сигналу силы памяти, предсказываемому теорией обнаружения сигналов. В рамках этого подхода считается, что правильные решения о распознавании, принятые с большей уверенностью, лежат дальше от приманок (lures), чем решения с низкой уверенностью, вдоль оси силы памяти [41, 42]. Поскольку клетки разделения паттернов (PS) обеспечивают декодирование истинного положения памяти, мы выдвинули гипотезу, что активность клеток PS вносит вклад в формирование непрерывного сигнала силы памяти в HPC (Рис. 6e, вверху). Если это верно, то при удалении клеток PS из популяции различные типы «старых» попыток (FP, TP с высокой и низкой уверенностью), каждая из которых сопровождается разной силой памяти, должны стать неотличимы друг от друга, но всё ещё отличаться от «новых» попыток (Рис. 6e, внизу).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;dPCA (деревянный анализ главных компонент) — это метод уменьшения размерности данных, который выделяет нейронные паттерны, специфически связанные с параметрами задачи, а не с общим шумом.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для проверки этой гипотезы мы использовали тот же анализ проекций для отдельных попыток, что описан выше, но теперь построили отдельные распределения для попыток TP с высокой и низкой уверенностью. При включении всех клеток MS распределение для TP с высокой уверенностью оказалось наиболее отделенным от попыток TN, с меньшей разделимостью для TP с низкой уверенностью и еще меньшей — для попыток FP (Рис. 6f). И наоборот, в премоторной зоне коры (preSMA) все проекции попыток на оси истинного положения перекрывались (Рис. S7a), что подчеркивает специфичность HPC. В HPC после удаления клеток PS попытки с «новыми» и «старыми» решениями всё ещё можно было различить, но попытки TP с высокой и низкой уверенностью, а также FP становились неотличимыми (Рис. 6g).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдаемые закономерности получены на животных моделях; перенос выводов о силе памяти на человеческий мозг требует учета различий в архитектуре сетей префронтальной коры.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В качестве дополнительного контроля мы повторили тот же анализ, но исключили клетки MS, сигнализирующие о выборе (клетки MC). Без клеток MC распределение проекций напоминало таковое для всех клеток MS вместе взятых (Рис. S7b), что предполагает ключевую роль клеток PS именно в формировании непрерывного сигнала силы памяти. Это понимание стало возможным только благодаря разделению клеток MS на типы, отражающие разделение паттернов (PS), и типы, отражающие выбор (MC). Этот результат свидетельствует о том, что клетки PS вносят вклад в формирование градиентного сигнала силы памяти в гиппокампе.&lt;/p&gt;\n&lt;h4 id=\"signal-etalonnoj-pamyati-oslablen-vnutri-zony-nachala-pripadkov-i-v-levom-gippokampe\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#signal-etalonnoj-pamyati-oslablen-vnutri-zony-nachala-pripadkov-i-v-levom-gippokampe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сигнал эталонной памяти ослаблен внутри зоны начала припадков и в левом гиппокампе&lt;/span&gt;&lt;/a&gt;Сигнал эталонной памяти ослаблен внутри зоны начала припадков и в левом гиппокампе&lt;/h4&gt;\n&lt;p&gt;Известно, что нейроны, расположенные в зоне начала припадков (SOZ), несут более слабые сигналы, связанные с памятью, чем нейроны за пределами SOZ. Поэтому далее мы исследовали, различается ли способность декодирования эталона памяти между нейронами гиппокампа, зарегистрированными внутри или за пределами SOZ. Из 3506 клеток, зарегистрированных во всех областях мозга, 27% были зарегистрированы с электродов, локализованных в SOZ (n=1016; височная доля для HPC и AMY, лобная доля для ACC и preSMA; Рис. S8a). Доля клеток, расположенных внутри SOZ, была выше в медиальной височной доле (MTL) по сравнению с медиальной лобной корой (MFC) (43% и 40% в HPC и AMY против 3% и 8% в ACC и preSMA, Рис. S8b), что ожидаемо, учитывая преобладание медиатемпоральной семиотики у наших пациентов. Это справедливо как для всех клеток (Рис. S8b), так и при ограничении анализа только клетками MS (Рис. S8c). Мы дополнительно классифицировали SOZ при височной эпилепсии на те, которые включали электроды гиппокампа или нет, и соответствующим образом локализовали все клетки гиппокампа (Рис. S8d для всех клеток и Рис. S8e для клеток MS, клетки типа PS среди MS показаны более темными оттенками).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Декодирование эталона памяти было успешным только для клеток вне зоны начала припадков (точность 0,64, p=0.019) и в правом гиппокампе (точность 0,66, p=0.01), демонстрируя нарушение этих сигналов в эпилептогенном очаге.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ декодирования для отдельных испытаний показал, что только клетки, зарегистрированные за пределами SOZ, позволяют осуществлять значимое декодирование эталона памяти (Рис. S8f, точность декодирования = 0.64, p=0.019), в то время как декодирование внутри SOZ не превышает уровень случайного угадывания (Рис. S8f, точность декодирования = 0.52, p=0.39). Прямое сравнение точности декодирования между сопоставимыми по количеству клеток популяциями вне и внутри SOZ (см. Методы) показывает, что эталон памяти декодируется значительно лучше за пределами SOZ, чем внутри (Δ(outSOZ, inSOZ)=0.12, p=0.004, Рис. S8g). Этот результат подчеркивает специфичность HPC в генерации сигналов эталона памяти и значимость наших клинических выводов.&lt;/p&gt;\n&lt;p&gt;Затем мы изучили, влияет ли латерализация на сигнал эталона памяти. Из 950 клеток HPC 413 были зарегистрированы из левого HPC и 537 из правого (Рис. S8h). Пропорции клеток MS были схожи между левым и правым HPC (36 и 40 клеток MS соответственно, Рис. S8i). Клетки PS были широко представлены в правом HPC (56% (19/34) против 27% (7/26), тест пропорций χ² p=0.025, Рис. S8i), что предполагает больший вклад правого HPC в разделение паттернов визуальной информации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдаемые различия получены на пациентах с фармакорезистентной эпилепсией, что требует осторожности при экстраполяции данных на норму.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Соответственно, мы смогли достоверно декодировать эталон памяти только из правого HPC (Рис. S8j, точность декодирования = 0.66, p=0.01; точность для левого = 0.52, p=0.43). Прямое сравнение точности декодирования между сопоставимыми по количеству клеток популяциями правого и левого HPC (см. Методы) показывает, что эталон памяти декодируется значительно лучше из правого HPC, чем из левого (Δ(right, left)=0.14, p=0.004, Рис. S8k). Этот результат дополнительно подтверждает преобладающую роль правого HPC в представлении эталона памяти для визуальных стимулов.&lt;/p&gt;\n&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;p&gt;Мы выявили сигнатуры мнемического разделения паттернов в гиппокампе путем сопоставления нейронных реакций между испытаниями с ложноположительными (FP) и истинноположительными (TP) результатами. Наш главный вклад заключается в идентификации PS-клеток в гиппокампе, ответ которых различается между FP- и TP-испытаниями. Мы предполагаем, что активность этих PS-клеток отражает успешное разделение паттернов. В подтверждение важности сигнала, переносимого PS-клетками, удаление PS-клеток из популяции приводило к разрушению градиента прочности памяти, поддерживаемого гиппокампальными клетками как популяцией. Наши данные определяют клеточный субстрат для разделения паттернов — вычисления, которое долгое время считалось ключевым компонентом аппарата памяти.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Идентификация PS-клеток в гиппокампе раскрывает клеточный субстрат разделения паттернов: их удаление полностью разрушает градиент прочности памяти популяции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;С точки зрения правильных испытаний, PS-клетки реагируют идентично каноническим MS-клеткам, охарактеризованным ранее. Но при анализе двух типов ошибок, которые пациенты могут совершать в этой задаче, становится очевидным существование двух типов таких клеток: те, которые сигнализируют об истинном положении дел независимо от принятого решения, и те, которые сигнализируют о принятом решении независимо от фонового сигнала памяти. Именно активность во время ошибочных испытаний позволила нам разграничить эти два различных процесса как на уровне отдельных нейронов, так и на популяционном уровне. Анализ ошибочных испытаний также позволил выявить специфический вклад различных областей мозга. MS-клетки присутствовали в количествах, превышающих случайные ожидания, во всех четырех исследованных нами областях мозга. Однако с точки зрения ошибочных испытаний только популяция MS-клеток в гиппокампе позволяла осуществлять надежное декодирование истинного положения дел.&lt;/p&gt;\n&lt;p&gt;Наши результаты стали возможны исключительно благодаря очень большому набору данных, накопленному для этой задачи по 97 пациентам (n = 3506 клеток). MS-клетки изначально относительно редкие: обычно под критерии подходит ~ 10% клеток гиппокампа. Из них лишь 60% классифицируются как PS-клетки, что приводит к общей распространенности &amp;lt;6%. Испытания FP, в свою очередь, также редки (по определению), что требует привлечения большого числа пациентов для их изучения. Наш вывод о том, что в таком масштабе PS-клетки становятся идентифицируемыми, служит примером нейронного процесса, который поддается пониманию лишь при наличии большого числа клеток для конкретной области мозга и задачи.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Разделение паттернов (pattern separation) — это способность мозга превращать похожие друг на друга воспоминания в несвязанные между собой четкие образы, чтобы не путать детали.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Уже давно признано, что когда испытуемые забывают о том, что видели предмет (ложноотрицательный результат), сигналы памяти в гиппокампе зачастую все еще присутствуют. Присутствие сигнала памяти в данном случае совместимо с успешным завершением паттерна, даже если на поведенческом уровне испытуемые не могли получить доступ к этой информации. Напротив, меньше известно о вкладе гиппокампа в FP, которые, как мы полагаем, играют ключевую роль в выявлении сигнатур разделения паттернов. В нашей задаче вероятность вынесения FP-суждения можно с высокой надежностью предсказать на основе сходства тестового изображения со всеми ранее увиденными изображениями. Это указывает на то, что FP связаны с существующим содержимым памяти, а не обусловлены шумом или угадыванием, что делает их удобными для изучения. Тем не менее, исследования с помощью фМРТ в целом показали, что нейронные сигналы в гиппокампе не различаются между TP- и FP-испытаниями, в результате чего FP-испытания до сих пор не использовались в качестве инструмента для изучения разделения паттернов. Теперь мы показываем, что специфическая подгруппа нейронов в гиппокампе реагирует по-разному на FP- и TP-испытания — разница, которая на макроскопическом уровне фМРТ кажется невидимой.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдаемые эффекты получены на основе корреляций и массивного пула данных пациентов, при этом макроскопические методы вроде фМРТ не улавливают микроскопические различия между FP и TP.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Наш вывод о том, что сигнатуры разделения паттернов отчетливо видны только при анализе подгруппы новых испытаний, приведших к FP, также позволяет по-новому взглянуть на более ранние работы, сообщавшие о сигнатурах разделения паттернов. В классической парадигме фМРТ, в которой впервые было сообщено о разделении паттернов, участники просматривали последовательности объектов с точными повторениями, похожими, но не идентичными приманками (lures) и новыми объектами, смешанными вместе. В этом эксперименте разделение паттернов операционализировалось как дифференциальный ответ на похожие (приманочные) изображения по сравнению с точными повторениями — паттерн ответа, который наблюдался в CA3/DG. Однако задача не предъявляла требований к памяти, поэтому оставалось неясным, была бы частота FP выше для приманок по сравнению с новыми изображениями. Наши данные показывают, что такое сравнение имеет критическое значение, поскольку оно является единственным возможным способом разграничения сигналов новизны (которые хорошо известны в гиппокампе) и сигнатур разделения паттернов (Рис. S5a-d). Кроме того, мы обнаружили, что сигналы памяти и выбора перемешаны, что, вероятно, делает необходимым опираться на разрешение на уровне одиночных нейронов для разграничения этих двух типов процессов.&lt;/p&gt;\n&lt;p&gt;Предыдущие работы показывают, что признаки в сетях глубокого зрения хорошо предстаказывают суждения людей о сходстве, и что повышенная связанность стимулов — будь то перцептивное сходство картинок или семантическая близость слов — стимулирует ложное узнавание у здоровых испытуемых. С помощью сбора оценок человеческого сходства (Рис. S2j) и использования предобученных DNN мы подтвердили, что сходство данного нового (приманочного) тестового изображения со всеми ранее виденными изображениями положительно коррелирует с частотой FP (Рис. 2). Демонстрация этой связи для нашего набора стимулов имела важное значение, поскольку она подтвердила, что наша парадигма надежно вызывает ошибки памяти, вызванные сходством (например, сбои разделения паттернов).&lt;/p&gt;\n&lt;p&gt;Активность PS-клеток играла критическую роль в формировании непрерывного градиента силы памяти в гиппокампе [41, 42, 55]. Вдоль этого градиента наименьшая сила памяти была связана с новыми элементами, а наибольшая — со старыми элементами, правильно опознанными с высокой уверенностью (TP high). Между ними, в таком порядке, располагались FP (ложноположительные ответы) и правильно опознанные элементы с низкой уверенностью (TP low). Таким образом, сила памяти предсказывает заявленную уверенность — ключевой аспект эпизодической памяти [23]. Удаление PS-клеток, которые составляют всего ~6% в гиппокампе, приводит к коллапсу испытаний с FP, TP high и TP low, тем самым нивелируя эти критические различия. Удаление же клеток, предсказывавших выбор, напротив, оставляло градиент нетронутым. Основываясь на этом результате, мы утверждаем, что именно PS-клетки и, следовательно, разделение паттернов формируют непрерывный градиент силы памяти. Такая интерпретация также объясняла бы, почему в испытаниях с высокой степенью сходства пациенты совершали ошибки FP, несмотря на то что сигналы в гиппокампе были разделены: одна из интерпретаций этого наблюдения заключается в том, что порог для объявления элемента «старым» был ниже средней активности для испытаний FP (Рис. 6e).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Удаление PS-клеток, составляющих около 6% нейронов гиппокампа, полностью разрушает градиент силы памяти, доказывая их ключевую роль в разделении паттернов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Согласуясь с предыдущими сообщениями о нарушениях памяти при эпилепсии, особенно если зона начала припадков (SOZ) находится в правом гиппокампе [43, 56], сигнал разделения паттернов был нарушен у клеток, зарегистрированных у пациентов с SOZ, затрагивающей гиппокамп (Рис. S8f, g). Такое связанное с заболеванием нарушение дополнительно подкрепляет идею о том, что это вычисление реализуется нейронами гиппокампа, а не унаследовано от вышестоящих областей. Более того, эти результаты подчеркивают мнемическое разделение паттернов как когнитивную функцию, которая может быть особенно уязвима к нарушениям при эпилепсии с вовлечением гиппокампа, и устанавливают потенциальный нейронный коррелят этого нарушения. Это открытие может иметь более широкое клиническое значение, поскольку сигналы разделения паттернов потенциально могут служить биомаркером вовлечения гиппокампа при эпилепсии, включая специфический вклад правого гиппокампа. Наконец, наше открытие того, что разделение паттернов наиболее сильно выражено в правом гиппокампе, совместимо с тем, что наша задача включала визуальные стимулы, указывая на то, что измерение силы разделения паттернов является достаточно чувствительной метрикой для выявления процессов, специфичных для полушарий [57–62]. Остается важным вопросом на будущее, покажет ли повторение нашего эксперимента с вербальными стимулами преимущественное вовлечение левого гиппокампа [63].&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдаемые нарушения сигналов разделения паттернов у пациентов с эпилепсией с вовлечением правого гиппокампа носят корреляционный характер и требуют дальнейших исследований причинно-следственных связей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Важным открытым вопросом остается то, какой вычислительный процесс порождает ответ PS-клеток. Здесь мы утверждаем, что активность PS-клето
