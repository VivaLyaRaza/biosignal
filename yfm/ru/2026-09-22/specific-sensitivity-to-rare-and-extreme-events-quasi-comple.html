        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"277\" cy=\"156\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"503\" cy=\"215\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · ANIMAL BEHAVIOR AND COGNITION   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как крысы избегают черных&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;лебедей и ищут джекпоты&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f1.jpg\" alt=\"Figure 1: Experimental Design. (a) Schematic of the operant conditioning chamber. Rats\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 1: Experimental Design. (a) Schematic of the operant conditioning chamber. Rats&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Большинство экспериментов проверяют решения в условиях частых и предсказуемых событий. Однако реальная жизнь полна маловероятных, но разрушительных или невероятно выгодных исходов. Нейробиологи проверили, как грызуны справляются с такими редкими событиями. Оказалось, что мозг разделяет рутину и крайности, выстраивая особую стратегию выживания.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Крысы избегают редких наказаний ценой частых мелких потерь.&lt;/li&gt;\n&lt;li&gt;Модель с раздельными весами лучше объясняет выбор животных.&lt;/li&gt;\n&lt;li&gt;Мозг обрабатывает хвосты распределения отдельно от рутины.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;В классических поведенческих тестах на принятие решений (decision-making) вероятность исходов обычно превышает десять процентов. Авторы работы разработали экспериментальную и вычислительную среду для оценки того, как крысы реагируют на редкие события с вероятностью менее одного процента и отклонением от среднего более чем на десять стандартных отклонений (REE — rare and extreme events). В тесте на четырехрукого бандита (four-armed bandit task) животные выбирали между опциями с сахарными пеллетами в качестве наград и задержками времени в качестве наказаний.&lt;/p&gt;\n&lt;p&gt;Поведение грызунов показало выраженную асимметрию. Крысы практически полностью избегали редких и экстремальных наказаний, которые можно назвать «черными лебедями», но лишь частично стремились к редким крупным выигрышам («джекпотам»). Ради этого животные были согласны терпеть более частые мелкие потери и довольствоваться скромными наградами. Стандартные модели обучения с подкреплением (Q-learning) не смогли объяснить такую стратегию.&lt;/p&gt;\n&lt;p&gt;Исследователи применили дополненную модель, где редкие события взвешиваются отдельно от обычных. Это показало, что мозг грызунов обрабатывает информацию из центра распределения исходов и из его хвостов независимо друг от друга. Подобное разделение позволяет животным гибко настраивать поведение в непредсказуемой среде, защищая себя от катастроф.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа выполнена на лабораторных крысах в искусственной среде, поэтому переносить эти выводы на сложные социальные или экономические решения людей пока нельзя.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"specificheskaya-chuvstvitelnost-k-redkim-i-ekstremalnym-sobytiyam\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#specificheskaya-chuvstvitelnost-k-redkim-i-ekstremalnym-sobytiyam\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Специфическая чувствительность к редким и экстремальным событиям&lt;/span&gt;&lt;/a&gt;Специфическая чувствительность к редким и экстремальным событиям&lt;/h3&gt;\n&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Авторы отмечают, что большинство поведенческих экспериментов на животных изучают риски с вероятностью исходов более 10%, тогда как реальные решения часто связаны с крайне маловероятными, но очень значимыми событиями. Чтобы заполнить этот пробел, исследователи разработали экспериментальный и вычислительный подход для оценки реакции крыс на редкие (вероятность &amp;lt; 1%) и экстремальные (отклонение от среднее более чем на 10 стандартных отклонений) события (REE).&lt;/p&gt;\n&lt;p&gt;В эксперименте использовалась установка с четырьмя рычагами (задача четырехрукого бандита), где животные выбирали между опциями с вероятными наградами (гранулы сахара) или наказаниями (задержки времени). Это позволило изучить интеграцию информации как о стандартных, так и о редких событиях с тяжелыми хвостами распределения.&lt;/p&gt;\n&lt;p&gt;Поведение животных продемонстрировало ограниченную диверсификацию (обычно выбор двух опций из четырех) и высокую чувствительность к REE. Крысы систематически избегали редких и экстремальных наказаний («черных лебедей»), но частично допускали редкие и экстремальные выигрыши («джекпоты»). Такая асимметрия достигалась ценой отказа от крупных частых выигрышей и принятия частых потерь.&lt;/p&gt;\n&lt;p&gt;Для объяснения результатов исследователи применили дополненную модель обучения с подкреплением, в которой REE оцениваются отдельно от частых событий. Стандартная модель Q-обучения не справлялась с воспроизведением наблюдаемой асимметрии, тогда как новая модель успешно описала стратегию крыс, предполагающую разделение мозгом информации из центра распределения и его хвостов.&lt;/p&gt;\n&lt;h4 id=\"vvedenie-v-issledovanie-redkih-i-ekstremalnyh-sobytij\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#vvedenie-v-issledovanie-redkih-i-ekstremalnyh-sobytij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение в исследование редких и экстремальных событий&lt;/span&gt;&lt;/a&gt;Введение в исследование редких и экстремальных событий&lt;/h4&gt;\n&lt;p&gt;Авторы статьи отмечают, что поиск баланса между исследованием среды (exploration) и использованием накопленного опыта (exploitation) лежит в основе адаптивного поведения людей и животных в условиях неопределенности. Тем не менее, крайне мало изучено, как эти процессы регулируются исходами, которые являются одновременно очень редкими и обладающими огромными последствиями — так называемыми редкими и экстремальными событиями (REE). Большинство лабораторных задач по принятию решений опираются на вероятности исходов выше 10%, что не отражает реальную природную среду, где редкие события могут как приводить к вымиранию видов, так и стимулировать технологический прогресс. Поскольку вероятность и масштаб таких событий трудно оценить на основе обычного опыта, REE создают серьезные проблемы для механизмов обучения. Чтобы восполнить этот пробел, исследователи обратились к изучению крыс, разработав принципиально новую задачу с четырехруким бандитом, в которой животные сталкивались с REE с вероятностью менее 1% и эффектами, превышающими 10 стандартных отклонений от среднего исхода.&lt;/p&gt;\n&lt;h4 id=\"povedencheskie-strategii-i-koncepciya-antihrupkosti\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#povedencheskie-strategii-i-koncepciya-antihrupkosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поведенческие стратегии и концепция антихрупкости&lt;/span&gt;&lt;/a&gt;Поведенческие стратегии и концепция антихрупкости&lt;/h4&gt;\n&lt;p&gt;В рамках эксперимента авторы стремились проверить, используют ли крысы стратегии, минимизирующие воздействие экстремальных потерь («Черных лебедей») при сохранении возможности получения экстремальных выигрышей («Джекпотов»), что аналогично концепции «антихрупкости». Стратегии, исключающие джекпоты, но оставляющие подверженность черным лебедям, были названы «хрупкими». Кроме того, выделены «устойчивые» варианты (без REE) и «уязвимые» (подвергающие животных обоим типам REE). Пространство задач было разделено на нормальные события (около 90%), редкие события (около 10%) и REE (менее 1%). Награды и наказания масштабировались нелинейно: выпуклые опции приводили к огромным выигрышам при снижении вероятности (джекпоты), тогда как вогнутые опции увеличивали убытки (черные лебеди). Теоретический анализ показывает, что антихрупкие стратегии становятся оптимальными в среде с REE, так как избегание черных лебедей оказывается слишком затратным, если такие события не учитываются внутренне.&lt;/p&gt;\n&lt;h4 id=\"metriki-povedeniya-i-ocenka-chuvstvitelnosti-k-ree\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#metriki-povedeniya-i-ocenka-chuvstvitelnosti-k-ree\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Метрики поведения и оценка чувствительности к REE&lt;/span&gt;&lt;/a&gt;Метрики поведения и оценка чувствительности к REE&lt;/h4&gt;\n&lt;p&gt;Для оценки того, как животные реагируют на стимулы с разной валентностью (включая гранулы сахара как награду и тайм-ауты в качестве наказаний), ученые вывели два ключевых поведенческих показателя. Первый — общая чувствительность к REE, определяемая как суммарная частота выбора выпуклых опций в областях выигрыша и проигрыша, что показывает, учитывают ли крысы REE в своей стратегии. Второй — односторонняя чувствительность к REE, которая вычисляется как разница между выбором выпуклых выигрышей и выпуклых потерь. Эта метрика позволяет количественно оценить асимметрию между стремлением к джекпотам и избеганием черных лебедей. Разработанный методологический подход открывает новые возможности для изучения нейронных механизмов оценки затрат и выгод в условиях неопределенности, выходящих за рамки стандартных лабораторных парадигм.&lt;/p&gt;\n&lt;h4 id=\"pokazateli-chuvstvitelnosti-k-redkim-i-ekstremalnym-sobytiyam-v-zadache-s-chetyrmya-rychagami\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#pokazateli-chuvstvitelnosti-k-redkim-i-ekstremalnym-sobytiyam-v-zadache-s-chetyrmya-rychagami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Показатели чувствительности к редким и экстремальным событиям в задаче с четырьмя рычагами&lt;/span&gt;&lt;/a&gt;Показатели чувствительности к редким и экстремальным событиям в задаче с четырьмя рычагами&lt;/h4&gt;\n&lt;p&gt;В данном разделе описывается экспериментальная установка и методология для оценки реакции крыс на редкие и экстремальные события в задаче с четырьмя альтернативами выбора. В исследовании задействовали 20 крыс, каждая из которых прошла 41 сессию в специальной оперантной камере с четырьмя отверстиями для носовых тычков. Каждое отверстие соответствовало определенному распределению наград в виде сахарных пеллет и наказаний в виде периодов блокировки (тайм-аутов), как показано на Рис. 1a–b. Вероятности и величины исходов варьировались по выпуклым или вогнутым законам, выделяя обычные события (около 90%), редкие события (около 10%) и редкие экстремальные события (около 1%), такие как крупные выигрыши («Jackpots» — 80 пеллет) или тяжелые наказания («Black Swans» — задержка 240 секунд).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f1.jpg\" alt=\"Figure 1: Experimental Design. (a) Schematic of the operant conditioning chamber. Rats\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 1: Experimental Design. (a) Schematic of the operant conditioning chamber. Rats&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Путем комбинации выпуклых и вогнутых функций выигрышей и проигрышей исследователи сформировали четыре поведенческие опции: антихрупкую, хрупкую, устойчивую и уязвимую, проиллюстрированные на Рис. 1c. Антихрупкая стратегия сочетала выпуклые выигрыши с выпуклыми проигрышами, давая доступ к крупным призам и минимизируя катастрофические потери, в то время как хрупкая стратегия делала акцент на мелких наградах с высоким риском столкнуться с «черными лебедями». Для измерения предпочтений авторы рассчитали два ключевых показателя (Рис. 1d): общую чувствительность к редким экстремальным событиям и одностороннюю чувствительность, отражающую асимметрию в поведении при выборе между возможными выгодами и рисками потерь.&lt;/p&gt;\n&lt;h4 id=\"anti-fragile\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#anti-fragile\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Anti-fragile&lt;/span&gt;&lt;/a&gt;Anti-fragile&lt;/h4&gt;\n&lt;p&gt;Данный подраздел посвящен антихрупкой опции выбора, которая объединяет выпуклые функции как для получения наград, так и для избежания потерь. Такая конфигурация позволяет животным частично контактировать с крупными вознаграждениями («Jackpots»), одновременно защищая их от длительных периодов тайм-аутов («Black Swans»). Авторы отмечают, что подобная стратегия демонстрирует стремление крыс максимизировать положительные крайности при эффективном уклонении от негативных исходов.&lt;/p&gt;\n&lt;p&gt;В этом разделе рассматриваются промежуточные параметры моделирования и поведенческие тенденции, обозначенные как p3. Они характеризуют вероятность выбора определенных опций в зависимости от истории подкреплений и степени воздействия редких и экстремальных событий. Авторы подчеркивают, что данные показатели помогают точнее откалибровать параметры чувствительности для агентов в вычислительных моделях обучения с подкреплением.&lt;/p&gt;\n&lt;h4 id=\"robust\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#robust\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Robust&lt;/span&gt;&lt;/a&gt;Robust&lt;/h4&gt;\n&lt;p&gt;Устойчивая (Robust) опция подразумевает стратегию, при которой животные полностью избегают разрушительных потерь («Black Swans»), но при этом жертвуют доступом к крупным выигрышам («Jackpots»). Согласно результатам, значительная часть крыс демонстрирует выраженную склонность к этой стратегии или её комбинации с антихрупким выбором, что подтверждает общую тенденцию к минимизации рисков крупных наказаний при неопределенности.&lt;/p&gt;\n&lt;h4 id=\"fragile\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#fragile\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fragile&lt;/span&gt;&lt;/a&gt;Fragile&lt;/h4&gt;\n&lt;p&gt;Хрупкая (Fragile) стратегия характеризуется сочетанием вогнутых функций выигрышей и проигрышей, что приводит к получению небольших стабильных наград, но одновременно подвергает грызунов высокому риску столкновения с экстремальными потерями. Экспериментальные данные показывают, что подавляющее большинство крыс избегает чисто хрупкого поведения, демонстрируя негативную одностороннюю чувствительность и нежелание рисковать ради незначительной выгоды в условиях угрозы серьезных тайм-аутов.&lt;/p&gt;\n&lt;h4 id=\"vulnerable\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#vulnerable\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Vulnerable&lt;/span&gt;&lt;/a&gt;Vulnerable&lt;/h4&gt;\n&lt;p&gt;Уязвимая (Vulnerable) опция сочетает в себе воздействие как крупных выигрышей, так и экстремальных потерь, создавая максимальный уровень неопределенности для испытуемых. Анализ поведения крыс в задаче с четырьмя рукавами показывает, что животные редко отдают предпочтение исключительно уязвимым или хрупким вариантам, предпочитая балансировать между устойчивыми и антихрупкими стратегиями для защиты от редких негативных событий («Black Swans»).&lt;/p&gt;\n&lt;h4 id=\"osnovnoj-fenotip-vyrazhennoe-izbeganie-ekstremalnyh-nakazanij-pri-chastichnoj-vyborke-ekstremalnyh-nagrad\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#osnovnoj-fenotip-vyrazhennoe-izbeganie-ekstremalnyh-nakazanij-pri-chastichnoj-vyborke-ekstremalnyh-nagrad\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Основной фенотип: выраженное избегание экстремальных наказаний при частичной выборке экстремальных наград&lt;/span&gt;&lt;/a&gt;Основной фенотип: выраженное избегание экстремальных наказаний при частичной выборке экстремальных наград&lt;/h4&gt;\n&lt;p&gt;В данном разделе авторы проанализировали поведение 20 крыс на протяжении 41 ежедневной сессии, чтобы выявить основные стратегии принятия решений. На основе двухмерного пространства (общая чувствительность к редким экстремальным событиям REE и односторонняя чувствительность) на Рис. 2 были визуализированы выборы животных. Результаты показали, что ни одна крыса не придерживалась какого-то одного крайнего варианта поведения; все животные комбинировали разные стратегии, что напоминает естественное фуражирование в условиях неопределенности.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f2.jpg\" alt=\"Figure 2: Total sensitivity to Rare and Extreme Events (REE) (y-axis) plotted against one-sided\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 2: Total sensitivity to Rare and Extreme Events (REE) (y-axis) plotted against one-sided&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"population-levelpatterns\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#population-levelpatterns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Population-levelpatterns&lt;/span&gt;&lt;/a&gt;Population-levelpatterns&lt;/h4&gt;\n&lt;p&gt;На графике (панель 2а, охватывающая около 800 сессий) видно, что большинство сессий сосредоточено в левой половине поведенческого пространства, что свидетельствует об избегании редких экстремальных событий (REE). Большинство точек расположено в верхнем квадранте, отражая умеренную или высокую общую чувствительность: животные систематически корректировали свои действия так, чтобы минимизировать столкновение с катастрофическими убытками («черными лебедями»).&lt;/p&gt;\n&lt;h4 id=\"individualnye-povedencheskie-profili\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#individualnye-povedencheskie-profili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Индивидуальные поведенческие профили&lt;/span&gt;&lt;/a&gt;Индивидуальные поведенческие профили&lt;/h4&gt;\n&lt;p&gt;На панели 2b показаны индивидуальные профили каждой из 20 крыс. За исключением крысы №17 (красная), все демонстрировали умеренную или высокую общую чувствительность. Выделилась крыса №19 (пурпурная) с высокой чувствительностью и склонностью к поиску крупных выигрышей («Jackpot Seeking»). Остальные 18 животных разделились на две группы: синяя группа (13 крыс), сочетающая избегание потерь и выбор надежных опций, и зеленая группа (5 крыс), демонстрирующая симметричный выбор между хрупкими и антихрупкими вариантами без явного перекоса в сторону выигрышей или потерь.&lt;/p&gt;\n&lt;h4 id=\"analiz-chuvstvitelnosti-k-redkim-sobytiyam-ree\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#analiz-chuvstvitelnosti-k-redkim-sobytiyam-ree\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ чувствительности к редким событиям (REE)&lt;/span&gt;&lt;/a&gt;Анализ чувствительности к редким событиям (REE)&lt;/h4&gt;\n&lt;p&gt;Авторы исследовали связь между общей чувствительностью к редким событиям и односторонней чувствительностью (склонностью избегать потерь). У 16 наиболее чувствительных крыс выявлена положительная корреляция: животные, активнее реагирующие на REE, склонны меньше избегать «черных лебедей» (крайне негативных событий), что указывает на изменение их стратегии в сторону принятия риска ради выгоды. Эта зависимость усиливается со временем, что подтверждается ростом коэффициента корреляции от 0,17 до 0,64 в процессе обучения.&lt;/p&gt;\n&lt;h4 id=\"povedencheskie-pokazateli-poiska-nagrad-i-izbeganiya-nakazanij\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#povedencheskie-pokazateli-poiska-nagrad-i-izbeganiya-nakazanij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поведенческие показатели поиска наград и избегания наказаний&lt;/span&gt;&lt;/a&gt;Поведенческие показатели поиска наград и избегания наказаний&lt;/h4&gt;\n&lt;p&gt;На Рис. 2 авторы сравнивают два фенотипа крыс: «синий» (высокая чувствительность к REE и избегание «черных лебедей») и «зеленый» (нейтральное поведение). Левая панель показывает, что синий фенотип чаще избегает негативных исходов, в то время как правая панель демонстрирует их повышенную мотивацию к получению «джекпотов» (редких наград). Различия между группами статистически значимы (p &amp;lt; 0,01) по критерию Вилкоксона.&lt;/p&gt;\n&lt;h4 id=\"ishody-chernyh-lebedej-usilivayut-chuvstvitelnost-k-redkim-sobytiyam,-a-dzhekpoty-net\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#ishody-chernyh-lebedej-usilivayut-chuvstvitelnost-k-redkim-sobytiyam,-a-dzhekpoty-net\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Исходы «черных лебедей» усиливают чувствительность к редким событиям, а «джекпоты» — нет&lt;/span&gt;&lt;/a&gt;Исходы «черных лебедей» усиливают чувствительность к редким событиям, а «джекпоты» — нет&lt;/h4&gt;\n&lt;p&gt;На Рис. 4 авторы анализируют изменения в поведении крыс до и после столкновения с редким событием. Выяснилось, что получение «джекпота» почти не меняет стратегию выбора. Напротив, столкновение с «черным лебедем» систематически усиливает общую чувствительность к редким событиям и повышает стремление избегать потерь. Это доказывает, что негативные редкие события оказывают гораздо более сильное влияние на процесс принятия решений, чем позитивные, закрепляя у животных стратегию повышенной бдительности.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f4.jpg\" alt=\"Figure 4 summarizes these within-session dynamics. For each rat (color-coded as in Fig-\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 4 summarizes these within-session dynamics. For each rat (color-coded as in Fig-&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"modeli-q-obucheniya-trebuyut-specificheskih-vesov-prinyatiya-reshenij-dlya-redkih-i-ekstremalnyh-sobytij-ree-s-celyu-imitacii-povedeniya-krys\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#modeli-q-obucheniya-trebuyut-specificheskih-vesov-prinyatiya-reshenij-dlya-redkih-i-ekstremalnyh-sobytij-ree-s-celyu-imitacii-povedeniya-krys\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модели Q-обучения требуют специфических весов принятия решений для редких и экстремальных событий (REE) с целью имитации поведения крыс&lt;/span&gt;&lt;/a&gt;Модели Q-обучения требуют специфических весов принятия решений для редких и экстремальных событий (REE) с целью имитации поведения крыс&lt;/h4&gt;\n&lt;p&gt;Авторы разработали и внедрили новый класс дополненных моделей подкрепленного обучения (Reinforcement Learning), которые учитывают чувствительность к редким и экстремальным событиям (REE) — «Черным лебедям» и крупным выигрышам («джекпотам»). Цель состояла в том, чтобы проверить, смогут ли такие модифицированные алгоритмы точно воспроизвести реальное поведение подопытных крыс при выборе вариантов. Параметры модели оценивались на основе реальных выборов и исходов для каждой отдельной крысы.&lt;/p&gt;\n&lt;p&gt;Главной особенностью разработанной модели стало разделение обычных исходов и редких экстремальных событий за счет применения специфических весов в процессе принятия решений. Результаты показали, что добавление такой чувствительности к REE обеспечивает отличное соответствие модели экспериментальным данным, тогда как стандартный Q-learning без учета REE был отвергнут практически для всех крыс. Для каждого из четырех возможных вариантов (анти хрупкий, хрупкий, робастный и уязвимый) авторы ввели под-значения выигрыша и проигрыша, которые обновляются с помощью специальных формул, учитывающих скорость обучения и ошибки прогнозирования как для выбранных, так и для невыбранных опций.&lt;/p&gt;\n&lt;h4 id=\"modelirovanie-cennosti-opcij-i-vesa-redkih-ekstremalnyh-sobytij-ree\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#modelirovanie-cennosti-opcij-i-vesa-redkih-ekstremalnyh-sobytij-ree\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Моделирование ценности опций и веса редких экстремальных событий (REE)&lt;/span&gt;&lt;/a&gt;Моделирование ценности опций и веса редких экстремальных событий (REE)&lt;/h4&gt;\n&lt;p&gt;Авторы разработали формальную модель для оценки ценности каждого доступного выбора, расширив стандартный алгоритм Q-обучения. Уравнение (2) суммирует два основных компонента: взвешенные суб-значения выигрышей и проигрышей (с параметрами λ_g и λ_l), а также специальные веса для редких экстремальных событий (REE), разделенных на «джекпоты» (Jackpots) и «черные лебеди» (Black Swans) с помощью индикаторных функций 1JP(o) и 1BS(o) и коэффициентов γ_g и γ_l. Вероятности выбора конкретного действия рассчитывались через стандартную функцию Softmax (мультиномиальную модель логита). Базовая модель предполагала нулевые значения для γ_g и γ_l, тогда как расширенные модели тестировали гипотезу о том, что животные придают редким событиям особый вес, обрабатывая их отдельно от обычных средних наград.&lt;/p&gt;\n&lt;h4 id=\"sravnenie-modelej-i-raspredelenie-fenotipov-po-tablice-1\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#sravnenie-modelej-i-raspredelenie-fenotipov-po-tablice-1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сравнение моделей и распределение фенотипов по Таблице 1&lt;/span&gt;&lt;/a&gt;Сравнение моделей и распределение фенотипов по Таблице 1&lt;/h4&gt;\n&lt;p&gt;В процессе подгонки моделей исследователи оценивали до восьми свободных параметров, включая скорости обучения и забывания для выигрышей и проигрышей, а также веса REE. Сравнение на основе информационных критериев, представленное в Таблице 1, показало, что у 17 из 20 подопытных животных выбор определяется специальными весами γ_g и γ_l. Большинство крыс (включая представителей синей, зеленой, красной и розовой групп) опираются на эти коэффициенты для формирования своих решений. Лишь меньшинство синих крыс интегрирует REE как в суб-значения, так и через веса решений, а три крысы вообще не используют специальное взвешивание REE. Авторы интерпретируют это как доказательство того, что животные воспринимают редкие экстремальные события качественно иначе, чем рутинные вознаграждения.&lt;/p&gt;\n&lt;h4 id=\"asimmetrichnye-povedencheskie-reakcii-na-redkie-ekstremalnye-poteri-i-vyigryshi\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#asimmetrichnye-povedencheskie-reakcii-na-redkie-ekstremalnye-poteri-i-vyigryshi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Асимметричные поведенческие реакции на редкие экстремальные потери и выигрыши&lt;/span&gt;&lt;/a&gt;Асимметричные поведенческие реакции на редкие экстремальные потери и выигрыши&lt;/h4&gt;\n&lt;p&gt;В заключительной части фрагмента обсуждаются поведенческие проявления асимметрии реакций на экстремальные стимулы, усредненные по 41 сессии для каждой крысы. Сопоставление реальных наблюдаемых чувствительностей (верхняя панель, продолжающая логику Рис. 2), предсказанных значений из выбранных моделей (нижняя левая панель) и симуляций на искусственных сессиях (нижняя правая панель) демонстрирует высокую точность предсказания модели. Полученные результаты подтверждают, что животные проявляют выраженную асимметричность в поведении при столкновении с редкими крупными выигрышами и проигрышами, что успешно захватывается параметрами γ_g и γ_l в рамках предложенного подхода.&lt;/p&gt;\n&lt;h4 id=\"rezultaty-i-interpretaciya\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#rezultaty-i-interpretaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты и интерпретация&lt;/span&gt;&lt;/a&gt;Результаты и интерпретация&lt;/h4&gt;\n&lt;p&gt;Авторы сначала установили, что все подопытные крысы демонстрируют определенный уровень общей чувствительности к редким событиям (REE), причем у большинства животных этот показатель находится на среднем или высоком уровне. Во-вторых, исследователи выделили доминирующий поведенческий фенотип: грызуны практически полностью избегали «черных лебедей» (негативных редких событий) и лишь частично стремились к «джекпотам» (позитивным редким событиям). Полученные данные интерпретируются как проявление фундаментальной асимметрии в реакции на негативные и позитивные редкие стимулы.&lt;/p&gt;\n&lt;p&gt;Обсуждая возможные ограничения, авторы отмечают, что нельзя полностью исключить влияние насыщения на отсутствие стремления к максимальному джекпоту, однако исследователи не фиксировали ситуаций, когда животные полностью прекращали попытки его выиграть. Поскольку редкие исходы запрограммированы на 10-ю или 60-ю активацию за сессию (см. Таблицу S1 в дополнительных материалах), возникает вопрос, смогли ли животные усвоить эту закономерность. Если бы грызуны действительно выучили данный интервал, их стратегия была бы более оптимальной.&lt;/p&gt;\n&lt;p&gt;В частности, варианты с джекпотом не являются оптимальными с точки зрения максимизации частой выгоды, поэтому при полной осведомленности животные выбирали бы их целенаправленно только около 10-го и 60-го раза. Большинство остальных выборов в таком случае было бы сосредоточено на вариантах с более надежными частыми призами. Однако на практике наблюдаемая картина поведения выглядит иначе.&lt;/p&gt;\n&lt;h4 id=\"asimmetriya-redkih-sobytij-i-povedencheskie-strategii\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#asimmetriya-redkih-sobytij-i-povedencheskie-strategii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Асимметрия редких событий и поведенческие стратегии&lt;/span&gt;&lt;/a&gt;Асимметрия редких событий и поведенческие стратегии&lt;/h4&gt;\n&lt;p&gt;Авторы анализируют фундаментальное различие между избежанием негативных экстремальных событий (черных лебедей) и погоней за позитивными экстремальными исходами (джекпотами). В условиях эксперимента крысы могли полностью исключить крупные потери, выбирая определенные выпуклые графики убытков, в то время как получение джекпота никогда не гарантировалось из-за стохастической природы редких событий (например, при 150 попытках вероятность увидеть хотя бы одно редкое событие с вероятностью 1% составляет около 78%, оставляя значительный шанс на нулевой результат). Эта асимметрия заставляет животных по-разному оценивать риски: частые мелкие выигрыши и небольшие потери делают «хрупкий» вариант локально привлекательным, однако стратегия полного избежания черных лебедей путем комбинации антихрупких и робастных опций обеспечивает общую стохастическую доминантность. Напротив, погоня за стопроцентным джекпотом не оправдана, так как жертвы частыми мелкими доходами не компенсируются гарантией получения суперприза, поэтому оптимальной становится частичная стратегия.&lt;/p&gt;\n&lt;h4 id=\"obuchenie-krys-i-otsutstvie-prostranstvennyh-ili-vremennyh-effektov\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#obuchenie-krys-i-otsutstvie-prostranstvennyh-ili-vremennyh-effektov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обучение крыс и отсутствие пространственных или временных эффектов&lt;/span&gt;&lt;/a&gt;Обучение крыс и отсутствие пространственных или временных эффектов&lt;/h4&gt;\n&lt;p&gt;Эмпирические результаты показывают, что «синие» крысы успешно усвоили эту логику, объединяя робастные и антихрупкие опции для почти полного избежания черных лебедей при умеренном стремлении к джекпотам, тогда как «зеленые» крысы продолжали рисковать, смешивая антихрупкие и хрупкие варианты. Поскольку животные демонстрировали поведенческую гибкость, исследователи исключили влияние простой пространственной предвзятости, несмотря на то, что тренировочное отверстие было намеренно закреплено за антихрупкой опцией, а редкие события запрограммированы на 10-й и 60-й попытках. Животные не выработали специфической привязки к 10-й или 60-й попытке, что доказывает их способность к самостоятельному изучению всех опций независимо от стартовых условий.&lt;/p&gt;\n&lt;h4 id=\"skorost-usvoeniya-stohasticheskoj-dominantnosti\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#skorost-usvoeniya-stohasticheskoj-dominantnosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Скорость усвоения стохастической доминантности&lt;/span&gt;&lt;/a&gt;Скорость усвоения стохастической доминантности&lt;/h4&gt;\n&lt;p&gt;Теоретически животные должны быстро распознавать стохастическую доминантность в области частых исходов, однако предыдущие работы и текущие данные показывают, что на это уходит множество сессий. Авторы объясняют это тем, что для правильной оценки распределения требуется колоссальный опыт, позволяющий достоверно убедиться в том, что редкие экстремальные события действительно еще не произошли и их можно временно исключить из расчетной вероятностной модели.&lt;/p&gt;\n&lt;h4 id=\"rasshirennye-modeli-q-obucheniya-predpolagayut-specificheskij-nervnyj-put-dlya-kodirovaniya-redkih-i-ekstremalnyh-sobytij-ree\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#rasshirennye-modeli-q-obucheniya-predpolagayut-specificheskij-nervnyj-put-dlya-kodirovaniya-redkih-i-ekstremalnyh-sobytij-ree\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Расширенные модели Q-обучения предполагают специфический нервный путь для кодирования редких и экстремальных событий (REE)&lt;/span&gt;&lt;/a&gt;Расширенные модели Q-обучения предполагают специфический нервный путь для кодирования редких и экстремальных событий (REE)&lt;/h4&gt;\n&lt;p&gt;Авторы анализируют полученные данные в контексте теории перспектив, избегания потерь и неопределенности. Эксперимент показал, что крысы демонстрируют стратегию снижения неопределенности в отношении редких экстремальных событий (REE): они избегают «Черных лебедей» (Black Swans), сохраняя при этом определенный интерес к «Джекпотам» (Jackpots). Классические Q-модели не смогли описать это поведение, тогда как модифицированные Q-модели с явной чувствительностью к REE справились с задачей за счет параметра γl, отражающего отвращение к катастрофическим потерям.&lt;/p&gt;\n&lt;p&gt;На основе высокой точности расширенных Q-моделей исследователи выдвигают новую нейробиологическую гипотезу. Анализ показал, что 13 крыс из «синей» группы исключают обычные REE из обновления Q-значений, но проявляют особую чувствительность именно к «Черным лебедям» через отрицательный параметр γl. Это означает, что при оценке вариантов животные не усредняют такие экстремальные убытки, а используют специальный весовой коэффициент, который снижает субъективную ценность опасных опций.&lt;/p&gt;\n&lt;h4 id=\"znachenie-dlya-cheloveka\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#znachenie-dlya-cheloveka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Значение для человека&lt;/span&gt;&lt;/a&gt;Значение для человека&lt;/h4&gt;\n&lt;p&gt;Авторы сопоставляют полученные на крысах результаты с известными данными о восприятии и памяти у людей, где редкие и экстремальные стимулы также обладают повышенной значимостью. Обсуждается гипотеза о том, что обработка таких редких событий (REE) может быть эволюционно закреплена и опираться на специализированные нейронные сети, отличные от классических дофаминергических путей, отвечающих за рутинные награды.&lt;/p&gt;\n&lt;p&gt;В работе предполагается, что за учет редких потерь и выигрышей могут отвечать такие структуры мозга, как передняя островковая доля и миндалевидное тело, учитывая их роль в обработке эмоциональной значимости и непредсказуемых исходов. С вычислительной точки зрения отделение экстремальных выбросов от общей массы данных помогает избежать искажения оценок, что дает адаптивные преимущества в нестабильной среде и открывает новые направления для будущих нейронаучных исследований.&lt;/p&gt;\n&lt;h4 id=\"animalsubjects\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#animalsubjects\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AnimalSubjects&lt;/span&gt;&lt;/a&gt;AnimalSubjects&lt;/h4&gt;\n&lt;p&gt;В этом разделе авторы описывают биологические модели, задействованные в исследовании. Всего использовалось 20 взрослых самцов крыс линии Lister Hooded, масса которых при поступлении составляла примерно 200 граммов. Животные содержались парами в специализированных клетках при контролируемом микроклимате и обратном световом цикле.&lt;/p&gt;\n&lt;p&gt;Для поддержания мотивации в ходе поведенческих тестов рацион питания грызунов был умеренно ограничен до 80 процентов от их суточной нормы потребления, тогда как доступ к воде оставался неограниченным. Все процедуры по содержанию и обращению с подопытными животными строго соответствовали французским законодательным нормам и получили официальное одобрение локального этического комитета.&lt;/p&gt;\n&lt;h4 id=\"apparatus\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#apparatus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Apparatus&lt;/span&gt;&lt;/a&gt;Apparatus&lt;/h4&gt;\n&lt;p&gt;Данный подраздел посвящен техническому оснащению эксперимента, хотя в приведенном отрывке текст обрывается на его названии. Оборудование было спроектировано таким образом, чтобы реализовать задачи по оценке стратегий избегания редких экстремальных событий и поиска крупных вознаграждений у подопытных животных.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f3.jpg\" alt=\"Figure 3 reports more intuitive behavioral metrics: the proportion of choices that (i)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 3 reports more intuitive behavioral metrics: the proportion of choices that (i)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-f5.jpg\" alt=\"Figure 5: Total Sensitivity to REE (y-axis) against One-sided Sensitivity to REE (x-\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Figure 5: Total Sensitivity to REE (y-axis) against One-sided Sensitivity to REE (x-&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;изучение&lt;/text&gt;&lt;text x=\"26\" y=\"10
