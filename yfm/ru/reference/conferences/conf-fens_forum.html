        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференции&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;европейский форум нейронаук&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-fens_forum.jpg\" alt=\"FENS Forum\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;европейский форум нейронаук&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что берём&lt;/td&gt;\n&lt;td&gt;европейские лаборатории нейронауки&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-brain.html\"&gt;Мозг и нервная система&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-eto-za-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-fens_forum.html#chto-eto-za-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что это за конференция&lt;/span&gt;&lt;/a&gt;Что это за конференция&lt;/h2&gt;\n&lt;p&gt;FENS Forum (European Forum of Neuroscience) — это крупнейшая в Европе научная конференция, посвященная изучению мозга и нервной системы. Мероприятие объединяет тысячи исследователей со всего мира для обсуждения фундаментальных механизмов работы нейронов, патологий мозга и методов их лечения. Это площадка, где формируется актуальная повестка нейронаук: от молекулярных процессов до сложных когнитивных функций.&lt;/p&gt;\n&lt;h2 id=\"organizatory-i-istoriya\"&gt;&lt;a href=\"reference/conferences/conf-fens_forum.html#organizatory-i-istoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Организаторы и история&lt;/span&gt;&lt;/a&gt;Организаторы и история&lt;/h2&gt;\n&lt;p&gt;Конференция проводится под эгидой Федерации европейских нейронаучных обществ (FENS). Организация координирует работу национальных сообществ нейробиологов, способствуя обмену знаниями между лабораториями. FENS Forum проходит раз в два года, каждый раз меняя принимающий город, что позволяет вовлекать в дискуссию научные центры разных стран Европы.&lt;/p&gt;\n&lt;h2 id=\"temy-i-sekcii\"&gt;&lt;a href=\"reference/conferences/conf-fens_forum.html#temy-i-sekcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Темы и секции&lt;/span&gt;&lt;/a&gt;Темы и секции&lt;/h2&gt;\n&lt;p&gt;Программа форума охватывает все аспекты нейронаук. Ключевые направления включают:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Молекулярная и клеточная нейробиология: изучение механизмов нейродегенерации, таких как болезнь Альцгеймера, где иммунные клетки мозга истощаются в борьбе с амилоидом, или сбоев в работе белков, запускающих аномальные РНК.&lt;/li&gt;\n&lt;li&gt;Развитие мозга: исследования генетических заболеваний, например, болезни Гоше, и того, как ранний стресс перестраивает нейронные связи в префронтальной коре.&lt;/li&gt;\n&lt;li&gt;Когнитивная нейронаука: анализ того, как мозг хранит воспоминания, воспроизводит визуальные образы или почему возникает афантазия.&lt;/li&gt;\n&lt;li&gt;Терапевтические стратегии: обсуждение генной терапии, способной предотвращать гибель нейронов при тяжелых синдромах, и механизмов передачи токсичных белков между клетками.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"chto-tam-poyavlyaetsya\"&gt;&lt;a href=\"reference/conferences/conf-fens_forum.html#chto-tam-poyavlyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что там появляется&lt;/span&gt;&lt;/a&gt;Что там появляется&lt;/h2&gt;\n&lt;p&gt;FENS Forum служит местом первой презентации прорывных исследований. Именно здесь ученые представляют результаты экспериментов на «мини-мозгах», данные мета-анализов функциональной МРТ, посвященных рабочей памяти, и новые подходы к лечению зависимостей. Конференция также является платформой для обсуждения системных проблем науки, таких как гендерное неравенство в академической среде, что критически важно для развития профессионального сообщества.&lt;/p&gt;\n&lt;h2 id=\"kak-sledit-i-uchastvovat\"&gt;&lt;a href=\"reference/conferences/conf-fens_forum.html#kak-sledit-i-uchastvovat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как следить и участвовать&lt;/span&gt;&lt;/a&gt;Как следить и участвовать&lt;/h2&gt;\n&lt;p&gt;Участие в форуме открыто для профессиональных нейробиологов, аспирантов и студентов. Программа включает пленарные лекции, симпозиумы и постерные сессии. Для тех, кто не может присутствовать лично, FENS предоставляет доступ к тезисам докладов и публикациям в профильных журналах, таких как European Journal of Neuroscience. Следить за анонсами можно на официальном портале федерации, где публикуются даты проведения и информация о приеме заявок на выступления.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/conferences/conf-fens_forum.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%90%D0%B2%D1%82%D0%BE%D0%BC%D0%BE%D0%B1%D0%B8%D0%BB%D0%B8%D1%81%D1%82%D1%8B_%D0%B4%D0%BB%D1%8F_%D1%81%D0%B5%D0%B1%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Автомобилисты для себя — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:IBRO_logo_main_2022.png\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Carolaraujos, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1111/ejn.12644\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Neural and psychological mechanisms underlying compulsive drug seeking habits and drug memories--indications for novel treatments of addiction&lt;/a&gt; — обзор, Eur J Neurosci 2014&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3389/fnhum.2019.00180\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Neural Correlates of Verbal Working Memory: An fMRI Meta-Analysis&lt;/a&gt; — обзор, Front Hum Neurosci 2019&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.neuron.2021.06.002\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Gender bias in academia: A lifetime problem that needs solutions&lt;/a&gt; — обзор, Neuron 2021&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференции&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"европейский форум нейронаук"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"FENS Forum","description":"европейский форум нейронаук","vcsPath":"reference/conferences/conf-fens_forum.md"},"headings":[{"title":"Что это за конференция","href":"reference/conferences/conf-fens_forum.html#chto-eto-za-konferenciya","level":2},{"title":"Организаторы и история","href":"reference/conferences/conf-fens_forum.html#organizatory-i-istoriya","level":2},{"title":"Темы и секции","href":"reference/conferences/conf-fens_forum.html#temy-i-sekcii","level":2},{"title":"Что там появляется","href":"reference/conferences/conf-fens_forum.html#chto-tam-poyavlyaetsya","level":2},{"title":"Как следить и участвовать","href":"reference/conferences/conf-fens_forum.html#kak-sledit-i-uchastvovat","level":2},{"title":"Источники","href":"reference/conferences/conf-fens_forum.html#istochniki","level":2}],"title":"FENS Forum"},"router":{"pathname":"reference/conferences/conf-fens_forum","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
