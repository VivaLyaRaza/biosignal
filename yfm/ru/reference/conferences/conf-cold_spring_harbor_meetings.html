        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференции&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;встречи лаборатории Колд-Спринг-Харбор (она же ведёт bioRxiv)&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;встречи лаборатории Колд-Спринг-Харбор (она же ведёт bioRxiv)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что берём&lt;/td&gt;\n&lt;td&gt;геномика, нейронаука, рак&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-genes.html\"&gt;Гены и геномы&lt;/a&gt;, &lt;a href=\"concepts/spec-brain.html\"&gt;Мозг и нервная система&lt;/a&gt;, &lt;a href=\"concepts/spec-cancer.html\"&gt;Рак и онкология&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-eto-za-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-cold_spring_harbor_meetings.html#chto-eto-za-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что это за конференция&lt;/span&gt;&lt;/a&gt;Что это за конференция&lt;/h2&gt;\n&lt;p&gt;Cold Spring Harbor Meetings — это серия научных конференций, проводимых на базе лаборатории Колд-Спринг-Харбор (CSHL) в штате Нью-Йорк. Эти встречи считаются одними из самых престижных площадок в мировой науке, где обсуждаются передовые достижения в области биологии и медицины. В отличие от массовых конгрессов, встречи CSHL часто носят более камерный и сфокусированный характер, что способствует глубокому обмену данными между ведущими экспертами и молодыми исследователями.&lt;/p&gt;\n&lt;h2 id=\"organizatory-i-istoriya\"&gt;&lt;a href=\"reference/conferences/conf-cold_spring_harbor_meetings.html#organizatory-i-istoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Организаторы и история&lt;/span&gt;&lt;/a&gt;Организаторы и история&lt;/h2&gt;\n&lt;p&gt;Лаборатория Колд-Спринг-Харбор — это частная некоммерческая исследовательская организация, расположенная в Лорел-Холлоу на Лонг-Айленде. История лаборатории неразрывно связана с развитием молекулярной биологии. Сегодня CSHL является не только центром фундаментальных исследований, но и ключевым хабом для научной коммуникации, включая поддержку платформы bioRxiv, где ученые публикуют препринты своих работ до их официального рецензирования в журналах.&lt;/p&gt;\n&lt;h2 id=\"temy-i-sekcii\"&gt;&lt;a href=\"reference/conferences/conf-cold_spring_harbor_meetings.html#temy-i-sekcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Темы и секции&lt;/span&gt;&lt;/a&gt;Темы и секции&lt;/h2&gt;\n&lt;p&gt;Программа конференций охватывает ключевые направления работы лаборатории: геномику, нейронауку, онкологию, количественную биологию и ботанику. Темы встреч часто пересекаются с актуальными вызовами современной медицины. Например, на конференциях обсуждаются механизмы развития глиобластомы и поиск способов борьбы с ней через метаболические пути, такие как обмен холестерина. Также в фокусе внимания находятся генетические основы редких заболеваний, механизмы метастазирования опухолей при участии микробиома кишечника и иммунологические стратегии борьбы с раком, включая перепрограммирование регуляторных Т-клеток.&lt;/p&gt;\n&lt;h2 id=\"chto-tam-poyavlyaetsya\"&gt;&lt;a href=\"reference/conferences/conf-cold_spring_harbor_meetings.html#chto-tam-poyavlyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что там появляется&lt;/span&gt;&lt;/a&gt;Что там появляется&lt;/h2&gt;\n&lt;p&gt;Конференции CSHL служат «инкубатором» для новых идей. Именно здесь часто впервые озвучиваются результаты исследований, использующих методы искусственного интеллекта для анализа медицинских изображений или новые подходы к изучению нейронных сетей мозга, ответственных за хранение воспоминаний. Участники представляют данные, полученные с помощью «мини-мозгов» (органоидов), выращенных из клеток пациентов, или результаты анализа крови на метаболиты гормонов, которые могут заменить инвазивную биопсию. Также здесь обсуждаются генетические исследования популяций, помогающие понять, почему одни люди более уязвимы к воспалительным процессам, таким как сепсис, чем другие.&lt;/p&gt;\n&lt;h2 id=\"kak-sledit-i-uchastvovat\"&gt;&lt;a href=\"reference/conferences/conf-cold_spring_harbor_meetings.html#kak-sledit-i-uchastvovat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как следить и участвовать&lt;/span&gt;&lt;/a&gt;Как следить и участвовать&lt;/h2&gt;\n&lt;p&gt;Участие в конференциях CSHL требует предварительной регистрации и часто — прохождения конкурсного отбора, так как количество мест ограничено для поддержания высокого уровня дискуссий. Для тех, кто не может присутствовать лично, лаборатория предоставляет доступ к материалам через свои информационные ресурсы. Следить за новыми открытиями, которые обсуждаются на этих встречах, можно через платформу bioRxiv, где авторы выкладывают свои статьи, а также через официальный сайт лаборатории, где публикуются анонсы предстоящих симпозиумов и отчеты о прошедших сессиях.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/conferences/conf-cold_spring_harbor_meetings.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Cold_Spring_Harbor_Laboratory\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Cold Spring Harbor Laboratory — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференции&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"встречи лаборатории Колд-Спринг-Харбор (она же ведёт bioRxiv)"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Cold Spring Harbor Meetings","description":"встречи лаборатории Колд-Спринг-Харбор (она же ведёт bioRxiv)","vcsPath":"reference/conferences/conf-cold_spring_harbor_meetings.md"},"headings":[{"title":"Что это за конференция","href":"reference/conferences/conf-cold_spring_harbor_meetings.html#chto-eto-za-konferenciya","level":2},{"title":"Организаторы и история","href":"reference/conferences/conf-cold_spring_harbor_meetings.html#organizatory-i-istoriya","level":2},{"title":"Темы и секции","href":"reference/conferences/conf-cold_spring_harbor_meetings.html#temy-i-sekcii","level":2},{"title":"Что там появляется","href":"reference/conferences/conf-cold_spring_harbor_meetings.html#chto-tam-poyavlyaetsya","level":2},{"title":"Как следить и участвовать","href":"reference/conferences/conf-cold_spring_harbor_meetings.html#kak-sledit-i-uchastvovat","level":2},{"title":"Источники","href":"reference/conferences/conf-cold_spring_harbor_meetings.html#istochniki","level":2}],"title":"Cold Spring Harbor Meetings"},"router":{"pathname":"reference/conferences/conf-cold_spring_harbor_meetings","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
