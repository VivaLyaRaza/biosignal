        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференции&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;европейский конгресс клинической микробиологии и инфекций&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;европейский конгресс клинической микробиологии и инфекций&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что берём&lt;/td&gt;\n&lt;td&gt;устойчивость к антибиотикам, новые инфекции&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-immunity.html\"&gt;Микробы и иммунитет&lt;/a&gt;, &lt;a href=\"concepts/spec-health.html\"&gt;Инфекции и эпидемиология&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-eto-za-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-escmid_global.html#chto-eto-za-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что это за конференция&lt;/span&gt;&lt;/a&gt;Что это за конференция&lt;/h2&gt;\n&lt;p&gt;ESCMID Global — это крупнейший ежегодный международный конгресс, посвященный клинической микробиологии и инфекционным заболеваниям. Мероприятие объединяет ученых, врачей, эпидемиологов и разработчиков медицинских технологий со всего мира. Основная цель конференции — обмен передовым опытом в диагностике, лечении и профилактике инфекций, а также поиск решений для глобальных угроз, таких как антимикробная резистентность.&lt;/p&gt;\n&lt;h2 id=\"organizatory-i-istoriya\"&gt;&lt;a href=\"reference/conferences/conf-escmid_global.html#organizatory-i-istoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Организаторы и история&lt;/span&gt;&lt;/a&gt;Организаторы и история&lt;/h2&gt;\n&lt;p&gt;Конгресс проводится Европейским обществом клинической микробиологии и инфекционных заболеваний (ESCMID). Это авторитетная профессиональная организация, которая координирует научные исследования и клинические стандарты в Европе. История мероприятия насчитывает десятилетия, в течение которых оно эволюционировало из региональной встречи в глобальную платформу, где определяются векторы развития инфектологии на ближайшие годы.&lt;/p&gt;\n&lt;h2 id=\"temy-i-sekcii\"&gt;&lt;a href=\"reference/conferences/conf-escmid_global.html#temy-i-sekcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Темы и секции&lt;/span&gt;&lt;/a&gt;Темы и секции&lt;/h2&gt;\n&lt;p&gt;Программа ESCMID Global охватывает широкий спектр дисциплин, связанных с микроорганизмами и иммунным ответом организма. Ключевые направления включают:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Антимикробная резистентность: поиск новых стратегий борьбы с устойчивыми бактериями, такими как Acinetobacter baumannii.&lt;/li&gt;\n&lt;li&gt;Инфекции у пациентов с ослабленным иммунитетом: особенности лечения инфекций кровотока у реципиентов органов.&lt;/li&gt;\n&lt;li&gt;Новые диагностические технологии: внедрение быстрых методов фенотипического определения чувствительности к антибиотикам.&lt;/li&gt;\n&lt;li&gt;Эпидемиология и общественное здравоохранение: мониторинг редких и опасных патогенов, включая амебу Balamuthia mandrillaris, и разработка систем экспресс-диагностики.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"chto-tam-poyavlyaetsya\"&gt;&lt;a href=\"reference/conferences/conf-escmid_global.html#chto-tam-poyavlyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что там появляется&lt;/span&gt;&lt;/a&gt;Что там появляется&lt;/h2&gt;\n&lt;p&gt;На конференции презентуются результаты фундаментальных и прикладных исследований. Здесь обсуждаются прорывы, подобные созданию тест-систем на базе CRISPR для одновременной диагностики ВИЧ, туберкулеза и малярии. Также рассматриваются новые подходы к терапии, например, использование bispecific антител для активации Т-клеток при лечении онкологии. Конференция служит площадкой для обсуждения связи между микробиомом и системными заболеваниями, такими как артрит или стеатогепатит, где иммунные клетки, обычно защищающие нас, могут провоцировать патологические процессы.&lt;/p&gt;\n&lt;h2 id=\"kak-sledit-i-uchastvovat\"&gt;&lt;a href=\"reference/conferences/conf-escmid_global.html#kak-sledit-i-uchastvovat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как следить и участвовать&lt;/span&gt;&lt;/a&gt;Как следить и участвовать&lt;/h2&gt;\n&lt;p&gt;Участие в ESCMID Global возможно как в очном, так и в дистанционном формате. Материалы конгресса, включая тезисы докладов и записи ключевых сессий, публикуются в профильных научных изданиях и на официальном портале общества. Для специалистов это основной источник информации о новых протоколах лечения и технологических инновациях, которые в будущем станут стандартом клинической практики.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/conferences/conf-escmid_global.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D1%82%D0%BE%D0%BC%D0%B0%2C_%D0%98%D0%B3%D0%BE%D1%80%D1%8C_%D0%9E%D0%BB%D0%B5%D0%B3%D0%BE%D0%B2%D0%B8%D1%87\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Стома, Игорь Олегович — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1007/s40265-024-02104-6\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Treatment Approaches for Carbapenem-Resistant Acinetobacter baumannii Infections&lt;/a&gt; — обзор, Drugs 2025&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/jacamr/dlae152\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Multidrug-resistant organism bloodstream infections in solid organ transplant recipients and impact on mortality: a systematic review&lt;/a&gt; — обзор, JAC Antimicrob Resist 2024&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1128/jcm.00674-25\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Emerging technologies for rapid phenotypic antimicrobial susceptibility testing of clinical isolates of bacteria&lt;/a&gt; — обзор, J Clin Microbiol 2025&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференции&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"европейский конгресс клинической микробиологии и инфекций"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"ESCMID Global","description":"европейский конгресс клинической микробиологии и инфекций","vcsPath":"reference/conferences/conf-escmid_global.md"},"headings":[{"title":"Что это за конференция","href":"reference/conferences/conf-escmid_global.html#chto-eto-za-konferenciya","level":2},{"title":"Организаторы и история","href":"reference/conferences/conf-escmid_global.html#organizatory-i-istoriya","level":2},{"title":"Темы и секции","href":"reference/conferences/conf-escmid_global.html#temy-i-sekcii","level":2},{"title":"Что там появляется","href":"reference/conferences/conf-escmid_global.html#chto-tam-poyavlyaetsya","level":2},{"title":"Как следить и участвовать","href":"reference/conferences/conf-escmid_global.html#kak-sledit-i-uchastvovat","level":2},{"title":"Источники","href":"reference/conferences/conf-escmid_global.html#istochniki","level":2}],"title":"ESCMID Global"},"router":{"pathname":"reference/conferences/conf-escmid_global","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
