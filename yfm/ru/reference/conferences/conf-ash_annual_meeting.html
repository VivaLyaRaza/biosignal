        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференции&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Американское общество гематологии&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-ash_annual_meeting.jpg\" alt=\"ASH Annual Meeting\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;Американское общество гематологии&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что берём&lt;/td&gt;\n&lt;td&gt;лейкозы, лимфомы, клеточная терапия&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-cancer.html\"&gt;Рак и онкология&lt;/a&gt;, &lt;a href=\"concepts/spec-medicine.html\"&gt;Медицина и здоровье&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-eto-za-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-ash_annual_meeting.html#chto-eto-za-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что это за конференция&lt;/span&gt;&lt;/a&gt;Что это за конференция&lt;/h2&gt;\n&lt;p&gt;ASH Annual Meeting — это ежегодная научная конференция, организуемая Американским обществом гематологии (American Society of Hematology). Это крупнейшее в мире событие, посвященное изучению крови и связанных с ней заболеваний. Конференция служит главной площадкой для обмена данными между учеными, врачами-гематологами и представителями биотехнологических компаний. Здесь обсуждаются фундаментальные механизмы развития болезней крови и результаты клинических испытаний новых методов лечения.&lt;/p&gt;\n&lt;h2 id=\"organizatory-i-istoriya\"&gt;&lt;a href=\"reference/conferences/conf-ash_annual_meeting.html#organizatory-i-istoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Организаторы и история&lt;/span&gt;&lt;/a&gt;Организаторы и история&lt;/h2&gt;\n&lt;p&gt;Организатором выступает Американское общество гематологии — профессиональная организация, объединяющая тысячи специалистов со всего мира. Общество ставит своей целью продвижение исследований в области гематологии, улучшение качества медицинской помощи и поддержку образовательных программ. Конференция проводится ежегодно и собирает десятки тысяч участников, что делает её центральным событием в календаре мировой онкогематологии.&lt;/p&gt;\n&lt;h2 id=\"temy-i-sekcii\"&gt;&lt;a href=\"reference/conferences/conf-ash_annual_meeting.html#temy-i-sekcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Темы и секции&lt;/span&gt;&lt;/a&gt;Темы и секции&lt;/h2&gt;\n&lt;p&gt;Научная программа охватывает широкий спектр вопросов: от молекулярной биологии до клинической практики. Ключевые направления включают:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Лейкозы, лимфомы и миеломная болезнь: изучение механизмов злокачественного перерождения клеток крови.&lt;/li&gt;\n&lt;li&gt;Клеточная терапия: развитие технологий CAR-T, где иммунные клетки пациента перепрограммируются для борьбы с раком.&lt;/li&gt;\n&lt;li&gt;Трансплантация стволовых клеток: методы лечения миелодиспластических синдромов (МДС) и других клональных заболеваний.&lt;/li&gt;\n&lt;li&gt;Генетика и диагностика: использование молекулярных маркеров для раннего выявления патологий.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"chto-tam-poyavlyaetsya\"&gt;&lt;a href=\"reference/conferences/conf-ash_annual_meeting.html#chto-tam-poyavlyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что там появляется&lt;/span&gt;&lt;/a&gt;Что там появляется&lt;/h2&gt;\n&lt;p&gt;На ASH Annual Meeting впервые представляются результаты ключевых клинических исследований. Именно здесь научное сообщество узнает об эффективности новых таргетных препаратов, результатах испытаний клеточной терапии (например, CD19-направленных CAR-T клеток) и новых протоколах трансплантации. Конференция задает стандарты лечения, которые затем внедряются в мировую клиническую практику. Здесь обсуждаются прорывы в понимании того, как микроокружение опухоли, включая бактериальную флору и иммунные клетки, влияет на прогрессирование заболеваний.&lt;/p&gt;\n&lt;h2 id=\"kak-sledit-i-uchastvovat\"&gt;&lt;a href=\"reference/conferences/conf-ash_annual_meeting.html#kak-sledit-i-uchastvovat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как следить и участвовать&lt;/span&gt;&lt;/a&gt;Как следить и участвовать&lt;/h2&gt;\n&lt;p&gt;Участие в конференции доступно для специалистов в области медицины и биологии. Для широкой аудитории Американское общество гематологии публикует пресс-релизы и резюме ключевых докладов на официальном сайте. Также после завершения мероприятия публикуются сборники тезисов, которые содержат актуальные данные о методах борьбы с онкологическими заболеваниями крови и результатах фундаментальных исследований.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/conferences/conf-ash_annual_meeting.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9C%D0%B8%D0%B5%D0%BB%D0%BE%D0%B4%D0%B8%D1%81%D0%BF%D0%BB%D0%B0%D1%81%D1%82%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B8%D0%B9_%D1%81%D0%B8%D0%BD%D0%B4%D1%80%D0%BE%D0%BC\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Миелодиспластический синдром — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Hypogranular_neutrophil_with_a_pseudo-Pelger-Huet_nucleus_in_MDS.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: The Armed Forces Institute of Pathology (AFIP), Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1182/blood-2016-02-629063\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;CD19-targeted CAR T-cell therapeutics for hematologic malignancies: interpreting clinical outcomes to date&lt;/a&gt; — обзор, Blood 2016&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3389/fimmu.2022.927153\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;CAR-T Cell Therapy in Hematological Malignancies: Current Opportunities and Challenges&lt;/a&gt; — обзор, Front Immunol 2022&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1182/blood-2016-06-724500\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Allogeneic hematopoietic stem cell transplantation for MDS and CMML: recommendations from an international expert panel&lt;/a&gt; — обзор, Blood 2017&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференции&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Американское общество гематологии"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"ASH Annual Meeting","description":"Американское общество гематологии","vcsPath":"reference/conferences/conf-ash_annual_meeting.md"},"headings":[{"title":"Что это за конференция","href":"reference/conferences/conf-ash_annual_meeting.html#chto-eto-za-konferenciya","level":2},{"title":"Организаторы и история","href":"reference/conferences/conf-ash_annual_meeting.html#organizatory-i-istoriya","level":2},{"title":"Темы и секции","href":"reference/conferences/conf-ash_annual_meeting.html#temy-i-sekcii","level":2},{"title":"Что там появляется","href":"reference/conferences/conf-ash_annual_meeting.html#chto-tam-poyavlyaetsya","level":2},{"title":"Как следить и участвовать","href":"reference/conferences/conf-ash_annual_meeting.html#kak-sledit-i-uchastvovat","level":2},{"title":"Источники","href":"reference/conferences/conf-ash_annual_meeting.html#istochniki","level":2}],"title":"ASH Annual Meeting"},"router":{"pathname":"ref
