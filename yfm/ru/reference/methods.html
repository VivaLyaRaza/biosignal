            {"data":{"leading":false,"html":"&lt;p&gt;22 концепции&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/1d-cnn.html\"&gt;1D-CNN&lt;/a&gt; — Архитектура нейронной сети, используемая для извлечения локальных спектральных признаков и глобальных закономерностей из данных.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/crispr-screening.html\"&gt;CRISPR-скрининг&lt;/a&gt; — CRISPR-скрининг — это метод высокопроизводительного поиска генов, при котором с помощью системы CRISPR/Cas9 поочередно выключают или…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fold-em.html\"&gt;Fold'EM&lt;/a&gt; — Фреймворк для восстановления атомных структур белков, интегрирующий априорные знания из генеративных моделей непосредственно с…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vis-nir.html\"&gt;Vis-NIR&lt;/a&gt; — Диапазон длин волн, используемый для получения спектральных профилей листьев томатов при обучении модели.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rolling-circle-amplification.html\"&gt;Амплификация с круговой петлей&lt;/a&gt; — Высокочувствительный метод детекции, используемый для выявления патологических кольцевых РНК в тканях центральной нервной системы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fisher-information-approximation.html\"&gt;Аппроксимация фишеровской информации&lt;/a&gt; — Математический метод, используемый для разложения штрафов за сложность моделей на геометрические составляющие: размерность, объем…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/in-silico-gene-perturbation.html\"&gt;Виртуальный нокаут генов&lt;/a&gt; — Вычислительный метод, используемый для моделирования регуляторной сети клеток и оценки последствий подавления конкретного гена (KRAS) на…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hybrid-imputation.html\"&gt;Гибридная импутация&lt;/a&gt; — Стратегия обработки пропущенных данных, сочетающая множественное заполнение цепными уравнениями (MICE) и алгоритм случайного леса.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ultimatum-game.html\"& — Инструмент для оценки гетерогенных эффектов факторов риска и анализа причинно-следственных связей.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/oxford-nanopore-sequencing.html\"&gt;Секвенирование Oxford Nanopore&lt;/a&gt; — Метод анализа нуклеотидных последовательностей ДНК, используемый в работе для оценки стабильности ITR.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/random-forest.html\"&gt;Случайный лес&lt;/a&gt; — Алгоритм машинного обучения, используемый для классификации рисков и гибридной импутации пропущенных данных.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stereotactic-injection.html\"&gt;Стереотаксическая инъекция&lt;/a&gt; — Хирургический метод точного наведения инструментов в заданную точку мозга, использующий иглы для локальной доставки препаратов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/functional-magnetic-resonance-imaging.html\"&gt;Функциональная магнитно-резонансная томография&lt;/a&gt; — Метод нейровизуализации, используемый для картирования паттернов активности коры головного мозга во время мысленного переживания…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/four-armed-bandit-task.html\"&gt;Четырехрукий бандит&lt;/a&gt; — Экспериментальный поведенческий тест, в котором животные выбирают между четырьмя опциями с различными наградами и наказаниями.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"22 концепции"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Методы","description":"22 концепции","vcsPath":"reference/methods.md"},"headings":[],"title":"Методы"},"router":{"pathname":"reference/methods","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
