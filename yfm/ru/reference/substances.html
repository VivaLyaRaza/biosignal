            {"data":{"leading":false,"html":"&lt;p&gt;20 концепций&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/chmp5.html\"&gt;Chmp5&lt;/a&gt; — Вспомогательный белок комплекса ESCRT-III, регулирующий формирование везикул и экзосом; его подавление блокирует межклеточное…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cnbp.html\"&gt;CNBP&lt;/a&gt; — CNBP — это белок, выступающий одним из ключевых игроков в регуляции экспрессии генов, который специфически связывается с богатыми гуанином…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kras.html\"&gt;KRAS&lt;/a&gt; — Малая ГТФаза, регулирующая пролиферацию и выживаемость клеток, избыточная активация которой в Т-лимфоцитах индуцирует их преждевременное…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/net1.html\"&gt;NET1&lt;/a&gt; — Целевой транскрипт, транспорт которого нарушается при блокировании взаимодействия с белком CNBP, что снижает подвижность и инвазивность…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tdp-43.html\"&gt;TDP-43&lt;/a&gt; — РНК-связывающий белок, который в норме регулирует сплайсинг, а при нейродегенерации теряет функцию, что запускает патологический синтез…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ube2l3.html\"&gt;UBE2L3&lt;/a&gt; — Ген, мутации в котором нарушают контроль воспалительной реакции и повышают риск тяжелого течения бактериальных инфекций.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vp2-capsid-protein.html\"&gt;VP2&lt;/a&gt; — Вирусный белок, отвечающий за формирование пор в эндоцитозных мембранах; мутации в нем обеспечивают устойчивость вируса к действию Plscr1.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zfx.html\"&gt;ZFX&lt;/a&gt; — Транскрипционный фактор, сцепленный с X-хромосомой, повышенный уровень экспрессии которого у женщин компенсирует генетические мутации…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/beta-amyloid.html\"&gt;бета-амилоид&lt;/a&gt; — Пептид, продукт расщепления предшественника амилоидного белка, накопление которого при болезни Альцгеймера вызывает эндолизосомальные…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/glucosylsphingosine.html\"&gt;Глюкозилсфингозин&lt;/a&gt; — Потенциально нейротоксичный продукт деацетилирования глюкозилцерамида, уровень которого значительно повышается при болезни Гоше.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sulfur-dioxide.html\"&gt;Диоксид серы&lt;/a&gt; — Газообразный прекурсор, выбрасываемый угольными ТЭС, который способствует формированию вторичных мелкодисперсных частиц в атмосфере.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/isoniazid.html\"&gt;Изониазид&lt;/a&gt; — Антибиотик, применяемый для лечения туберкулеза, устойчивость к которому определяется путем выявления мутаций в генах inhA и katG.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/il-1beta.html\"&gt;Интерлейкин-1 бета&lt;/a&gt; — Провоспалительный цитокин, утилизация которого нарушается при дефектах гена UBE2L3, что ведет к неконтролируемому воспалению.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/corticotropin-releasing-hormone.html\"&gt;Кортикотропин-рилизинг-гормон&lt;/a&gt; — Гормон, экспрессируемый в нейронах мозга, который выступает в роли эффектора, запускающего нейропластичность в ответ на стресс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/protein-kinase-a.html\"&gt;Протеинкиназа A&lt;/a&gt; — Фермент, участвующий во внутриклеточной сигнализации, активность которого регулируется якорным белком AKAP11.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tau-protein.html\"&gt;Тау-белок&lt;/a&gt; — Белок, участвующий в нейродегенерации; в работе используется как маркер патологических изменений в мозге после вирусной инфекции.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thrombopoietin.html\"&gt;Тромбопоэтин&lt;/a&gt; — Основной гормон-регулятор, стимулирующий выработку и созревание тромбоцитов в организме.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ubiquitin.html\"&gt;Убиквитин&lt;/a&gt; — Консервативный белок из 76 аминокислот, регулирующий клеточные процессы путем ковалентного связывания с субстратами или существующий в…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/phenol-red.html\"&gt;Феноловый красный&lt;/a&gt; — Химический индикатор, используемый для визуальной детекции результатов амплификации по изменению цвета реакционной смеси.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/human-neutrophil-peptides.html\"&gt;Человеческие нейтрофильные пептиды&lt;/a&gt; — Катионные пептиды, высвобождаемые нейтрофилами, которые в условиях метаболической перегрузки действуют как патогенные эффекторы, вызывая…&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"20 концепций"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Вещества","description":"20 концепций","vcsPath":"reference/substances.md"},"headings":[],"title":"Вещества"},"router":{"pathname":"reference/substances","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
