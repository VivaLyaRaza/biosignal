        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;21 концепция&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/aggresomes.html\"&gt;Агресомы&lt;/a&gt; — Перинуклеарные структуры, состоящие из убиквитинированных неправильно свернутых белков, которые формируются при нарушении работы…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/anabolic-program.html\"&gt;Анаболическая программа&lt;/a&gt; — Метаболический процесс в микроглии, объединяющий синтез новых белков с биогенезом митохондрий для поддержания фагоцитарной активности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/haploinsufficiency.html\"&gt;Гаплонедостаточность&lt;/a&gt; — Состояние, при котором одна функциональная копия гена не обеспечивает достаточного уровня белка для нормального функционирования организма.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ischemia-and-reperfusion.html\"&gt;Ишемия и реперфузия&lt;/a&gt; — Экспериментальная модель повреждения миокарда, используемая для изучения динамики тромбоцитов после инфаркта.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/collateral-activity.html\"&gt;Коллатеральная активность&lt;/a&gt; — Способность фермента Cas13a после связывания с целевой РНК неспецифично расщеплять окружающие молекулы РНК, что используется для генерации…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mevalonate-pathway.html\"&gt;Мевалонатный путь&lt;/a&gt; — Метаболический путь синтеза холестерина, ферменты которого (DHCR24, EBP) являются ключевыми мишенями для повышения чувствительности опухоли…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/microarousals.html\"&gt;Микропробуждения&lt;/a&gt; — Кратковременные переходы в состоянии сна, вызывающие локальный всплеск аномальной электрической активности мозга.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/neural-tracking.html\"&gt;Нейронный трекинг&lt;/a&gt; — Способность мозга синхронизировать свою электрическую активность со слоговым ритмом речи.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/feedback.html\"&gt;обратная связь&lt;/a&gt; — Механизм передачи сигналов из вышестоящих мультисенсорных зон в первичную сенсорную кору, позволяющий модулировать ранние сигналы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/shared-transcriptomic-vulnerability.html\"&gt;общая транскриптомная уязвимость&lt;/a&gt; — Перекрывающиеся паттерны изменений экспрессии генов при различных заболеваниях, указывающие на общие патогенные механизмы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/overfitting.html\"&gt;Переобучение&lt;/a&gt; — Явление, при котором модель чрезмерно подстраивается под случайный шум в данных, теряя способность отражать реальные закономерности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/chromatin-remodeling.html\"&gt;Ремоделирование хроматина&lt;/a&gt; — Процесс, управляемый факторами транскрипции AP-1 и BATF, обеспечивающий активацию цитотоксических генов в регуляторных Т-клетках.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/reflux.html\"&gt;Рефлюкс&lt;/a&gt; — Нежелательное движение терапевтического препарата вдоль канала иглы наружу, ограничивающее объем и эффективность доставки.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/familial-alzheimer-s-disease.html\"&gt;Семейная форма болезни Альцгеймера&lt;/a&gt; — Ранняя форма болезни Альцгеймера, вызванная аутосомно-доминантными мутациями в генах APP, PSEN1 или PSEN2.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/endoplasmic-reticulum-stress.html\"&gt;Стресс эндоплазматического ретикулума&lt;/a&gt; — Патологическое состояние, возникающее из-за накопления несвернутых белков при дефиците SIL1, запускающее каскад UPR и апоптоз нейронов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/transcriptional-convergence.html\"&gt;Транскрипционная конвергенция&lt;/a&gt; — Явление, при котором нарушение различных первичных генов-мишеней ведет к согласованному сбою и схожим изменениям в экспрессии единой…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/black-swans.html\"&gt;Черные лебеди&lt;/a&gt; — Редкие, маловероятные, но разрушительные события, которые животные стремятся избегать ценой мелких потерь.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gene-expression.html\"&gt;Экспрессия генов&lt;/a&gt; — Процесс, профиль которого анализируется для оценки влияния мутаций и гормональной терапии на молекулярном уровне.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aha-effect.html\"&gt;Эффект «ага»&lt;/a&gt; — Феноменальное чувство, сопровождающее момент внезапного понимания или инсайта, выступающее как метакогнитивный сигнал обратной связи.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/female-protective-effect.html\"&gt;Эффект защиты женского пола&lt;/a&gt; — Биологический механизм, при котором женский организм более устойчив к развитию аутизма, требуя большей генетической нагрузки для проявления…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/title-effect.html\"&gt;Эффект названия&lt;/a&gt; — Явление, при котором дополнительная семантическая информация в виде текста изменяет восприятие, интерпретацию и оценку произведений…&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"21 концепция"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Явления","description":"21 концепция","vcsPath":"reference/phenomena.md"},"headings":[],"title":"Явления"},"router":{"pathname":"reference/phenomena","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
