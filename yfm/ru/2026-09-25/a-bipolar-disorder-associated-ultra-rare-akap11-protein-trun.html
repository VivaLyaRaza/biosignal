м числе тандемное мечение изобарами и фракционирование, выполнялись в Центре протеомных открытий Джонса Хопкинса по ранее описанным протоколам с незначительными изменениями. Ткани лизировали в растворе, содержащем 8 M мочевину и 50 mM бикарбонат триэтиламмония, дополненном ингибиторами протеаз и фосфатаз, с последующей ультразвуковой обработкой на льду. Белки в количестве 100 мкг на одну пробу восстанавливали с использованием 10 mM трис(2-карбоксиэтил)фосфина, алкилировали 40 mM 2-хлорацетамидом и расщепляли эндопротеиназой Lys-C в соотношении 1:50. Затем раствор разбавляли примерно до 2 M концентрации мочевины и проводили ночное расщепление трипсином в соотношении 1:50 при температуре 37 °C. Полученные пептиды подкисляли, обессоливали на C18-носителях и метили реагентами TMTpro 18-plex от Thermo Fisher Scientific в течение одного часа при комнатной температуре. Реакцию гасили трисом, после чего пробы объединяли. Фракционирование осуществляли методом жидкостной хроматографии с обращенной фазой при высоком pH на колонке Agilent 1260 HPLC/Extend-C18 с использованием 90-минутного градиента при скорости потока 0.3 мл/мин. Десять процентов полученных фракций использовали для глобального протеомного анализа, а оставшиеся девяносто процентов направляли на обогащение фосфопептидами с помощью Fe(III)-IMAC.&lt;/p&gt;\n&lt;p&gt;Анализ пептидов проводился с использованием системы Vanquish NEO UHPLC, соединенной с масс-спектрометром Orbitrap Exploris 480 при 120-минутном градиенте и скорости 300 нл/мин. Спектры MS1 регистрировали при разрешении 120 000 в диапазоне m/z 375–1500, применяя сканирование с зависимостью от данных при цикле 3 с, ширине изоляции 0.7 Да и исключении одиночных зарядов. Фрагментация осуществлялась методом высшей энергии соударения при нормализованной энергии столкновения 36, а спектры MS2 записывались с разрешением 30 000 с использованием режима TurboTMTPro. Поиск по спектрам выполнялся с помощью программы SEQUEST HT в составе пакета Proteome Discoverer версии 3.2.0.450 по базе данных UniProt для Mus musculus. Алгоритм допускал до двух пропущенных сайтов триптического расщепления, длину пептидов от шести аминокислот и допуски по массе 10 ppm или 0.02 Да. Карбамидометилирование цистеинов и мечение TMTpro задавались как фиксированные модификации, а окисление, деамидирование и фосфорилирование по серину, треонину и тирозину — как вариабельные. Контроль частоты ложных открытий поддерживался на уровне 1% как на уровне совпадений спектров с пептидами, так и на уровне белков с использованием модуля Percolator. Достоверность локализации фосфосайтов оценивалась через модуль ptmRS. Количественное определение репортерных ионов базировалось на TMT-анализе по спектрам MS2 с допуском интеграции 20 ppm, а группировка белков проводилась в соответствии с принципом строгой парсимонии.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Протеомный и фосфопротеомный анализ тканей девяти мышей (пять Akap11+/S384* и четыре Akap11+/+) выполнен с использованием современных масс-спектрометрических платформ высокого разрешения.&lt;br /&gt;\n[!tip] Масс-спектрометрия тандемного типа и мечение изобарами TMT позволяют одновременно и с высокой точностью измерять количество тысяч белков и их фосфорилированных форм в разных образцах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сенсор протеинкиназы A под названием pcDNA3.1(+)-ExRai-AKAR2 был любезно предоставлен Цзинь Чжаном и зарегистрирован в репозитории Addgene под плазмидным номером 161753. Для получения новой плазмиды pAAV-Camk2a-ExRai-AKAR2-mScarlet нужная последовательность, включающая сенсор PKA, была синтезирована компанией Genscript и клонирована в плазмидный вектор pAAV-hSyn-EGFP, предварительно линеаризованный по сайтам рестрикции Xba1 и EcoR1. Исходная матрица pAAV-hSyn-EGFP получена от Брайана Рота (&lt;a href=\"concepts/plasmid.html\"&gt;плазмида&lt;/a&gt; Addgene № 50465). Для редкого, разреженного мечения клеток в нейрональных культурах применялась плазмида pCAG-GFP, предоставленная Конни Цепко (плазмида Addgene № 11150).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Для визуализации активности киназы PKA в нейронах были успешно созданы и отобраны специализированные генетические конструкции на базе векторов &lt;a href=\"concepts/aav.html\"&gt;AAV&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Первичные диссоциированные клеточные культуры получали из коры головного мозга эмбрионов на стадии развития E16.5. Препарирование кортекса выполнялось в среде DMEM производства компании Corning, в которую добавляли 1X GlutaMAX, 0.5% пенициллина/стрептомицина и 10% эмбриональной телячьей сыворотки. После промывки фосфатно-солевым буфером ткани каждого отдельного эмбриона измельчали и подвергали ферментативной диссоциации с помощью реагента TrypLE в сочетании с ДНКазой I при температуре 37 °C. Ткани отмывали культуральной средой Neurobasal с добавлением добавок B-27, GlutaMAX и 0.5% пенициллина/стрептомицина, после чего аккуратно пипетировали до получения однородной суспензии клеток. Изолированные клетки высевали на покровные стекла или специальные чашки для визуализации, предварительно обработанные поли-L-орнитином. Плотность посева составляла 1.5 × 10⁵ клеток на одно покровное стекло диаметром 12 мм либо 4.5 × 10⁵ клеток на чашку диаметром 35 мм. Для подробного морфологического анализа формирующихся нейритов клетки высевали с меньшей плотностью — 1.0 × 10³ клеток на 12-миллиметровое стекло. Культивирование проводилось при 37 °C в инкубаторе с увлажненной атмосферой и 5% содержанием углекислого газа.&lt;/p&gt;\n&lt;p&gt;Постнатальное или постгомогенизационное генотипирование эмбрионов для подтверждения наличия мутации в гене Akap11 и определения пола выполнялось на основе ДНК, выделенной из хвостовых фрагментов каждого зародыша; последовательности праймеров приведены в дополнительной таблице Supplementary Table 1C. Временная трансфекция клеток генетическим сенсором PKA осуществлялась в период между пятым и шестым днями in vitro (DIV5–DIV6) с использованием реагента Lipofectamine 2000. В каждую чашку для визуализации вносили 1 мкг плазмидной ДНК, смешанной с 2 мкл липосомального реагента, инкубировали клетки в среде Neurobasal в течение четырех часов, после чего возвращали их в кондиционированную культуральную среду. Трансфекция плазмидой pCAG-GFP для разреженного мечения проводилась на сроках DIV4–DIV6 с использованием соотношения ДНК к липофектамину 1:1, беря 200 нг ДНК на одно 12-миллиметровое покровное стекло.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Первичные нейрональные культуры из коры эмбрионов E16.5 были успешно выращены, генотипированы и трансфицированы целевыми ДНК-конструктами на 4–6 дни in vitro.&lt;br /&gt;\n[!tip] Первичные культуры клеток из мозга эмбрионов позволяют изучать процессы роста нейритов и передачу сигналов в контролируемых лабораторных условиях in vitro.&lt;br /&gt;\n[!warning] Эксперименты на первичных клеточных культурах отражают лишь отдельные аспекты развития нейронов и требуют сопоставления с данными живого организма.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для наблюдения за динамикой активности протеинкиназы A (PKA) в культивируемых кортикальных нейронах, экспрессирующих специальный сенсор PKA, использовали широкопольный микроскоп Nikon Ti2 с объективом CFI Apochromat TIRF 60X/1.49 NA и камерой ORCA-Fusion Digital CMOS C14440-20UP под управлением ПО NIS-Elements AR версии 6.10.02. Съёмку проводили в период между 21 и 22 днями in vitro (DIV21–DIV22). Использовали двойное возбуждение GFP: волной 405 нм при мощности лазера 10% и экспозиции 500 мс, а также 488 нм при мощности 2.5% и экспозиции 500 мс через эмиссионный фильтр 525/50 нм. Красную флуоресценцию mScarlet регистрировали на длине волны 561 нм (мощность 5%, экспозиция 50 ms) с фильтром 595/44 нм. Базовые изображения живых клеток получали каждую минуту в течение 5 минут. После этого в чашку для визуализации добавляли форсколин в концентрации 25 µM вместе с ролипрамом в концентрации 2 µM либо ингибитор H-89 в концентрации 25 µM. Клетки инкубировали с препаратами в течение 3 минут, после чего возобновляли съёмку с интервалом в 1 минуту на протяжении 15 минут.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Метод Time-lapse imaging позволяет в реальном времени фиксировать биохимические процессы в живых клетках, а сенсоры PKA меняют свечение при изменении активности фермента.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Все основные данные, включая поведенческие тесты, физические измерения, иммуноблоттинг, RT-qPCR, иммуноцитохимию и визуализацию активности PKA в живых клетках, обрабатывали с помощью среды R версии 4.3.0 в контейнере Debian GNU/Linux 11.7. При анализе поведения для каждого генотипа рассчитывали межквартильный размах (IQR); значения, выходящие за пределы первой квартили Q1 или третьей квартили Q3 более чем на 1.5 × IQR, исключали как выбросы. Для физических измерений исключение данных не применялось. К рангово-трансформированным данным применяли линейную регрессию с фиксированными эффектами генотипа и помёта, а для попарных сравнений использовали тест Тьюки. В иммуноблоттинге, RT-qPCR, иммуноцитохимии, морфометрии и прижизненной микроскопии PKA точки не удалялись. Для оценки различий между двумя генотипами использовали U-критерий Манна — Уитни.&lt;/p&gt;\n&lt;p&gt;Обработку и детальный анализ полноразмерных данных РНК-секвенирования проводили в рамках рабочего процесса IsoSeq версии 4.3.0 с использованием интерпретатора Python 2.7.15. Чтения HiFi разделяли на сегменты с помощью утилиты Skera версии 1.4.0, задействуя адаптеры MAS-Seq Adapter v3. Демльтиплексирование и определение клеточных баркодов выполняли программой lima версии 2.13.0 в режиме Iso-Seq с праймерами Iso-Seq v2 12-plex и функцией подбора пиков (--isoseq --peek-guess). Хвосты поли(A) усекали, а конкатемеры удаляли через isoseq refine с обязательным условием --require-polya при минимальной длине поли(A) 20 п. н. Полноразмерные неконкатемерные чтения (FLNC) кластеризовали с помощью isoseq cluster2, отбирая изоформы как минимум с двумя чтениями FLNC. Полученные кластеризованные изоформы выравнивали на референсный геном мыши GRCm39/mm39 с использованием обёртки minimap2 pbmm2 версии 1.17.0 с параметрами --preset ISOSEQ и --sort. Избыточные изоформы объединяли командой isoseq collapse (--do-notcollapse-extra-5exons, --max-fuzzy-junction 10, --max-5p-diff 100, --max-3p-diff 100). Нередундантные изоформы классифицировали через pbpigeon версии 1.4.0 (команда pigeon classify), задействуя референсный геном GRCm39/mm39, аннотацию GENCODE vM33 и курированный список поли(A)-сайтов от PacBio. Фильтрацию результатов проводили утилитой pigeon filter (--min-cov=3 --mono-exon) для отсева низкокачественных и одноэкзонных изоформ. На этапе контроля качества дополнительно удаляли изоформы, если: а) сайт сплайсинга предсказывался как артефакт переключения матриц («RTS_stage»=TRUE); б) доля адениновых нуклеотидов в 20 п. н. окне сразу после сайта терминации транскрипта превышала 80% («perc_A_downstream_TTS» &amp;gt; 80); в) общее число счетов составляло менее 3 (&amp;lt; 3). Оставшиеся изоформы нормировали в транскриптах на миллион (TPM). Изоформы гена Akap11 визуализировали через браузер генома UCSC Genome Browser для сборки GRCm39/mm39.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Анализ РНК-секвенирования включал строгую многоступенчатую фильтрацию по качеству, числу покрытий и артефактам сплайсинга с последующей нормировкой в TPM для точной идентификации изоформ Akap11.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Протеомные данные обрабатывались в среде R (версия 4.5.3) на базе ОС Ubuntu 20.04.6 LTS. Первичная обработка проводилась с использованием объектов Msnbase (версия 2.34.1), при этом белки-контаминанты исключались из анализа. Для каждого образца значения обилия белков подвергались &lt;span class=\"yfm-latex\" data-content=\"%5Clog_2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;-трансформации и нормализации методом циклического loess через функцию normalizeBetweenArrays (метод “cyclicloess”) из пакета limma (версия 3.64.3). Анализ дифференциальной представленности белков выполнялся путем построения линейных моделей (limma::lmFit) с последующей эмпирической байесовской коррекцией стандартных ошибок (limma::eBayes, параметры trend=TRUE, robust=TRUE).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/cyclic-loess.html\"&gt;Метод циклического loess&lt;/a&gt; (cyclic loess) — это статистический подход для выравнивания распределений данных между образцами, позволяющий устранить систематические технические различия, не затрагивая биологические эффекты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Фосфопротеомные данные обрабатывались аналогично в формате Msnbase с применением &lt;span class=\"yfm-latex\" data-content=\"%5Clog_2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;-трансформации и циклической loess-нормализации. Для оценки скорости фосфорилирования общие значения обилия белков и фосфопротеинов сначала нормализовались по медиане канала внутри каждого образца. Затем значения обилия фосфосайтов нормализовались относительно соответствующих уровней общего протеома и подвергались &lt;span class=\"yfm-latex\" data-content=\"%5Clog_2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;-трансформации, после чего проводилась повторная циклическая loess-нормализация. Дифференциальный анализ фосфосайтов и скоростей фосфорилирования также проводился с использованием инструментов limma.&lt;/p&gt;\n&lt;p&gt;Аннотации связей «киназа-субстрат» были извлечены из баз PTMsigDB (версия 2.0.0) и RoKAI (версия 2.3.0), актуализированных на 5 апреля 2026 года. База RoKAI опиралась на данные PhosphositePlus и Signor. Для оценки активности киназ использовались «DE-баллы» (DE scores) фосфосайтов, рассчитываемые как &lt;span class=\"yfm-latex\" data-content=\"-%5Clog_%7B10%7DP%20%20imes%20%20ext%7Bsign%7D(%5Clog_2%20%20ext%7Bfold%20change%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Согласно методу RoKAI, итоговый балл активности киназы определялся как среднее значение DE-баллов её субстратов, а статистическая значимость оценивалась Z-тестом. Дополнительно применялся метод на основе пакета viper (версия 1.42.0) с использованием аннотаций PTMsigDB, который задействует ранговый анализ обогащения (analytic rank-based enrichment analysis) и перестановочные тесты для определения p-значений.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Активность киназ рассчитывалась двумя методами: через усреднение DE-баллов субстратов (метод RoKAI) и через ранговый анализ обогащения (пакет viper), что обеспечивает надежность оценки регуляторных путей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Секвенированные риды выравнивались на препроцессированный референсный геном GRCm39/mm39 (версия GRCm39-2024-A от 10x Genomics) с помощью программы Cell Ranger (версия 9.0.1) с пайплайном cellranger count (--create-bam true, --include-introns=true, остальные параметры по умолчанию). Полученная матрица счетчиков обрабатывалась как объекты SingleCellExperiment (версия 1.24.0). Контроль качества и последующий анализ проводились в среде R (версия 4.3.0), запущенной в контейнере Debian GNU/Linux 11.7.&lt;/p&gt;\n&lt;p&gt;Контроль качества включал поиск потенциальных дуплетов с использованием пакета scDblFinder (версия 1.14.0) для расчета плотностных оценок дуплетов через computeDoubletDensity (d=50), с последующей фильтрацией по порогу через doubletThresholding (dbr=0.10, метод “griffiths”, returnType=“call”, p=0.01). Затем проводилась фильтрация клеток для каждого образца по критериям: (a) общее число уникальных молекулярных идентификаторов (&lt;a href=\"concepts/umi.html\"&gt;UMI&lt;/a&gt;) &amp;lt; 1000 или &amp;gt; 5 медианных абсолютных отклонений (MAD); (b) число уникально детектированных генов &amp;lt; 750 или &amp;gt; 5 MAD; (c) процент UMI, картированных на митохондриальные гены &amp;gt; 5 MAD. На финальном этапе отсеивались гены, экспрессирующиеся менее чем в 10 копиях во всех образцах.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;snRNA-seq и UMI — это метод секвенирования РНК единичных ядер и уникальные молекулярные метки, позволяющие точно подсчитывать транскрипты без учета фонового шума.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кластеризация и аннотация клеточных типов выполнялись по многоэтапному алгоритму: 1. Нормализация. Экспрессия генов нормализовалась функцией normalizeCounts из пакета scuttle (версия 1.12.0) с расчетными факторами размера от общих UMI клеток, масштабированными по геометрическому среднему. 2. Отбор признаков. Митохондриальные и рибосомальные гены исключались. Высоковариабельные гены определялись с помощью стабилизации дисперсии через LOESS-регрессию в логарифмическом масштабе (stats, версия 4.3.0) с отсечкой дисперсии на уровне 0.3, преобразованием стандартизированных дисперсий в Z-оценки и FDR-коррекцией P-значений (отбор при FDR &amp;lt; 0.50 или топ-3000 генов). 3. Снижение размерности. &lt;a href=\"concepts/pca.html\"&gt;Метод главных компонент&lt;/a&gt; (PCA) выполнялся пакетом scater (версия 1.28.0) по 50 компонентам с определением оптимального числа ПК по кумулятивной дисперсии (не более 80%, кроме базовых типов нейронов — 40 ПК). На основе ПК вычислялся UMAP (scater, n_neighbors = 20). 4. Построение графа общих ближайших соседей (SNN). Графы строились через scran (версия 1.28.2) по 20 соседям с ранговым взвешиванием. 5. Кластеризация. Граф SNN разбивался алгоритмом Лейдена (igraph, версия 1.5.0.1; objective_function=“CPM”, n_iterations=5). Робастность кластеров оценивалась 50–100 кратным ресемплингом с расчетом Adjusted Rand Index. 6. Аннотация типов. Кластеры аннотировались на основе таксономии коры мыши [30] с интеграцией маркеров из литературы и базы данных Allen Institute (исключая гиппокамп и малочисленный класс Meis2). Попарные тесты Уилкоксона (scran, findMarkers) применялись для выделения маркеров широких клеточных типов (глутаматергические и гамкергические нейроны, глиальные и сосудистые клетки), специфических для слоев глутаматергических нейронов (14 подтипов), а также интернейронов из каудального (Lamp5, Sncg, Vip) и медиального (Pvalb, Sst, Sst Chodl) ганглиозных бугорков. Исходная разметка проверялась по оценкам специфичности [84] и базам данных гибридизации in situ.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Кластеризация данных snRNA-seq проводилась через &lt;a href=\"concepts/leiden-algorithm.html\"&gt;алгоритм Лейдена&lt;/a&gt; с многократной проверкой робастности и точным выделением основных нейрональных и глиальных популяций.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Рабочий процесс кластеризации и субкластеризации включал первичное разделение на панейроны, олигодендроциты, OPC, эндотелиоциты, гладкомышечные клетки, астроциты, микроглию, перициты и менингеальные клетки. Нейроны подразделялись на глутаматергические (13 типов), гамкергические (10 типов) и смешанные (удалены). Оптимальные разрешения алгоритма Лейдена выбирались по максимальному выявлению известных таксономических подтипов. Для субкластеров глутаматергических нейронов среднее значение дескриптора дешифрации deScore составило 4.83 (мин: 3.78, макс: 7.29) при валидной доле клеток в среднем 98.65% (мин: 90.15%, макс: 100%). Для нейрональных клеток (олигодендроциты, OPC, эндотелиоциты, астроциты, перициты) оптимальное разрешение фиксировалось при выходе deScore и числа кластеров на плато.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Алгоритм Лейдена (Leiden algorithm) — это математический метод разбиения графов на плотные сообщества (кластеры), который гарантирует получение внутренне связанных групп клеток.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ дифференциальной экспрессии (DE) состава клеточных типов между генотипами проводился с помощью пакета speckle (версия 1.0.0; robust=TRUE, transform=“logit”), исключая образцы с числом клеток в кластере менее 10. Псевдобулк (pseudobulk) анализ экспрессии выполнялся путем суммирования UMI по образцам и кластерам (scater::aggregateAcrossCells). Низкоэкспрессирующиеся гены фильтровались через edgeR::filterByExpr (версия 4.0.16). Факторы нормализации вычислялись методом RLE (edgeR::calcNormFactors). Моделирование экспрессии осуществлялось с использованием квазиправдоподобных отрицательно-биномиальных моделей в edgeR (glmQLFit и glmQLFTest) с поправкой Бенджамини–Хохберга (FDR). Альтернативный анализ выполнялся в DESeq2 (версия 1.40.2) и limma (version 3.58.1). Для анализа отдельных клеток на уровне UMI с помощью обобщенных линейных смешанных моделей (GLMM) применялся пакет nebula (версия 1.5.5; модель PMM, cpc=0.005, mincp=20) с расчетом скорректированных P-значений через FDR.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Все этапы биоинформатического анализа требуют жесткой фильтрации низкокачественных ядер и строгого контроля ложноположительных результатов через множественное тестирование (FDR).&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Базы данных аннотаций мышиных генов Gene Ontology (GO) были получены из пакета org.Mm.eg.db версии 3.18.0 с использованием clusterProfiler версии 4.10.1 по состоянию на 10 сентября 2025 года. Применялись три класса суб-онтологий GO: биологический процесс (GO:BP), клеточный компонент (GO:CC) и молекулярная функция (GO:MF). База данных мышиных путей Reactome была загружена через пакет ReactomePA версии 1.46.0 10 сентября 2025 года. Экспертно курируемая база данных синаптических генов SynGO версии 20231201 была получена с портала SynGO (https://www.syngoportal.org). Наборы генов, ассоциированных с психическими расстройствами, были собраны из опубликованных ранее исследований. Для GWAS-рисковых генов мы отобрали наборы, приоритизированные с помощью генно-ориентированных ассоциативных анализов или путем интеграции множественных линий доказательств. В Таблице 3G обобщены процедуры обработки наборов генов для каждого датасета, включая источник данных, метод приоритизации и пороги P-значений, если они применимы. Мы также извлекли 75 аннотированных наборов генов из DisGeNET (обновление 2026 года) в рамках категории Medical Subject Headings (MeSH) F03 «Психические расстройства» (доступ 6 июля 2026 года).&lt;/p&gt;\n&lt;p&gt;Анализ избыточной представленности (ORA) выполнялся с использованием функции fora из пакета fgsea версии 1.26.0 при параметрах minSize=5 и maxSize=21955. P-значения оценивались с помощью гипергеометрических тестов и корректировались методом FDR. Для данных snRNA-seq фоновый набор генов определялся как все гены, удовлетворяющие критериям минимальной экспрессии в наших данных. Гены с повышенной и пониженной экспрессией анализировались раздельно.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анализ обогащения путей (GSEA) и ORA позволяют понять, какие именно биологические группы генов или клеточные процессы скоординированно активируются или подавляются в эксперименте, выходя за рамки одиночных генных изменений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ обогащения наборов генов (GSEA) производился путем ранжирования генов по метрике &lt;span class=\"yfm-latex\" data-content=\"-%5Clog_%7B10%7DP%20%20imes%20%20ext%7Bsign%7D(%5Clog_2%20%20ext%7B%20fold%20change%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. GSEA запускался с использованием fgsea::fgseaMultilevel при scoreType=“std”, maxSize=500, eps=0 и nPermSimple=10000. Минимальный размер набора генов устанавливался равным 10 для данных snRNA-seq и 15 для протеомных данных. P-значения оценивались посредством теста перестановок с 10000 итераций и корректировались по методу FDR. Для надежной оценки обогащения тест GSEA повторялся 20 раз. Пути считались стабильно обогащенными при достижении значимости (FDR ≤ 0.05) по меньшей мере в 70% запусков. Для данных snRNA-seq GSEA ограничивался типами или подтипами клеток, в которых по меньшей мере 5000 генов отвечали требованиям минимальной экспрессии для анализа дифференциальной экспрессии.&lt;/p&gt;\n&lt;p&gt;Для протеомных и фосфопротеомных данных идентификаторы UniProt маппировались в символы генов MGI с помощью biomaRt версии 2.58.2. Если несколько идентификаторов UniProt соответствовали одному символу MGI, сохранялся идентификатор с наибольшим абсолютным ранговым баллом. Для данных об изобилии фосфосайтов и скорости фосфорилирования GSEA выполнялся для генов, соответствующих основным белкам.&lt;/p&gt;\n&lt;p&gt;Для удобства интерпретации результатов значимые пути группировались по семантическому сходству с использованием пакета rrvgo версии 1.14.2. Сходство между путями рассчитывалось через rrvgo::calculateSimMatrix (orgdb=“org.Mm.eg.db”, method=“Lin”), а кластеризация выполнялась функцией rrvgo::reduceSimMatrix (orgdb=“org.Mm.eg.db”, scores=“uniqueness”). Кластеризация дополнительно курировалась вручную путем сравнения с древовидными диаграммами GO из QuickGO для слияния связанных кластеров и разделения несогласованных групп.&lt;/p&gt;\n&lt;p&gt;Культивированные нейроны на стадии DIV6 снимались на широкопольном микроскопе Axio Observer Z1 (Zeiss, Оберкохен, Германия), оснащенном камерой Axiocam705 и объективом 40x/0.95 NA (Plan-Apochromat 40x/0.95 Corr M27; Zeiss). Мозаичные изображения получались с разрешением 11.59 пикселей на мкм на одном фокусном уровне. Идентичное время экспозиции и режим биннинга применялись ко всем клеткам. С каждого покровного стекла случайно отбирались для съемки клетки с одним Tau-1-положительным нейритом и несколькими MAP2-положительными нейритами. Нейроны вручную трассировались в программе Neurolucida версии 2025.1.2 (MBF Bioscience LLC) исследователем, не знавшим генотип клеток. Морфометрические измерения рассчитывались в Neurolucida Explorer версии 2024.1.1 и анализировались в R версии 4.3.0 с использованием U-критерия Манна-Уитни.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Морфологический анализ нейритов на DIV6 проводился на микроскопе Zeiss с объективом 40x и слепой трассировкой в Neurolucida с последующим применением U-критерия Манна-Уитни в R (версия 4.3.0).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нейроны сканировались на микроскопе Axio Observer Z1 с конфокальным лазерным сканирующим модулем LSM 800 (Zeiss) с использованием объектива 63x/1.40 NA (Plan-Apochromat 63x/1.40 Oil DIC M27, Zeiss). З-стек изображения GFP-положительных нейронов приобретались с разрешением 17.45 пикселей на мкм и размером z-шага 0.29 мкм. Для всех образцов использовались одинаковое время задержки пикселя, мощность лазера, размер пинхола и мастер-усиление. Тела нейронов сегментировались по каналу GFP с использованием пороговой обработки Оцу в ImageJ версии 1.54p, после чего для каждого нейрона вычислялась средняя интенсивность флуоресценции PKA RIα в соме.&lt;/p&gt;\n&lt;p&gt;Серии снимков во времени выравнивали при помощи алгоритма совмещения на основе признаков SIFT, а именно Linear Stack Alignment с модулем SIFT MultiChannel в программе ImageJ. Для выделения тел нейронов (сомы) строили проекцию минимальной интенсивности для сигнала 488 нм, после чего применяли гауссовскую фильтрацию с параметром σ=1.0 и пороговую обработку функциями «Auto Local Threshold» или «Auto Threshold», что позволяло добиться оптимальной сегментации. Среднюю интенсивность флуоресценции в пределах выделенного тела клетки рассчитывали по нефильтрованным сигналам 488 нм и 405 нм. Фоновое свечение оценивали для каждого канала отдельно, используя пять контрольных зон интереса размером 50 × 50 пикселей, свободных от клеточных объектов. Полученное среднее значение фонового сигнала вычитали из интенсивности флуоресценции сомы, получая скорректированные сигналы F₄₈₈ и F₄₀₅. Относительную активность PKA на основе соотношения длин волн возбуждения для каждого момента времени определяли как отношение флуоресценции R = F₄₈₈/F₄₀₅. Динамику изменений активности PKA выражали через нормированное относительное изменение соотношения сигналов Δ R/R₀ = (R – R₀)/R₀, где R — текущее значение отношения флуоресценции в заданный момент времени, а R₀ — аналогичный показатель в исходной точке измерения на старте эксперимента.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SIFT-алгоритм и покадровый анализ в ImageJ позволяют программно выровнять смещения микроскопических кадров и точно измерить интенсивность двухволновых флуоресцентных сенсоров PKA в теле нейрона.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun-fS1.jpg\" alt=\"Дополнительный рис. 1. Изоформы мРНК Akap11 у гомозиготных мутантных мышей и поведенческая характеристика гетерозиготных\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Дополнительный рис. 1. Изоформы мРНК Akap11 у гомозиготных мутантных мышей и поведенческая характеристика гетерозиготных мутантных мышей. Относится к рис. 1.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun-fS2.jpg\" alt=\"Дополнительный рис. 2.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Дополнительный рис. 2.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Дополнительный рис. 2. Профилирование РНК одиночных ядер новокортекса гетерозиготных мутантных мышей. Относится к рис. 2. A. Соотношение долей широких типов клеток между генотипами, рассчитанное как Akap11+/S384* по отношению к Akap11+/+. Серые точки: P &amp;gt; 0,05 в тесте состава клеточных типов с помощью скорректированного t-критерия с использованием пакета propeller. B. Соотношение долей типов клеток между генотипами, рассчитанное как Akap11+/S384* по отношению к Akap11+/+. Серые точки: P &amp;gt; 0,05 в тесте состава клеточных типов с помощью скорректированного t-критерия с использованием propeller. C. Соотношение долей подтипов между генотипами, рассчитанное как Akap11+/S384* по отношению к Akap11+/+. Серые точки: P &amp;gt; 0,05 в тесте состава клеточных типов с помощью скорректированного t-критерия с использованием propeller. D. Тепловая карта, показывающая корреляции Пирсона между значениями P из трех тестов дифференциальной экспрессии (DE) на основе псевдообъема (с помощью edgeR, DESeq2 и limma) и теста DE на основе смешанной модели Пуассона — гамма (PMM) для одиночных клеток (с помощью nebula). Корреляции показаны для 33 типов клеток (слева) и 92 подтипов (справа). E. График в виде леденцов (lollipop plot), показывающий количество высокоуверенных дифференциально экспрессируемых генов (DEG), обнаруженных в каждом из 33 типов клеток. Высокоуверенные DEG определялись как гены с FDR ≤ 0,10 в псевдообъемном тесте DE с использованием квазиправдоподобной отрицательной биномиальной обобщенной лог-линейной модели в edgeR и номинальным P ≤ 0,05 в одноядерном тесте DE на основе PMM при согласованном направлении изменений между методами. F. Количество высокоуверенных DEG, обнаруженных в каждом подтипе. Зеленый цвет указывает на повышенные, а красный — на пониженные гены у мышей Akap11+/S384*. Метки подтипов окрашены в соответствии с типом клеток, к которому они принадлежат. G. Термины генной онтологии синапсов (SynGO), чрезмерно представленные среди повышенных высокоуверенных DEG во всех подтипах. Значимая чрезмерная представленность определялась как FDR ≤ 0,05 с помощью гипергеометрического теста. Оценка анализа чрезмерной представленности (ORA) рассчитывалась как −log10FDR, умноженное на направление изменения, причем положительные значения указывают на обогащение среди генов, повышенных у мышей Akap11+/S384*, а отрицательные — на обогащение среди пониженных генов. H. Распределение чрезмерно представленных терминов SynGO по синаптическим компартментам. I. Наборы генов DisGeNET в категории MeSH F03 («психические расстройства»), чрезмерно представленные среди расширенных высокоуверенных DEG. Значимая чрезмерная представленность определялась как FDR ≤ 0,05 с помощью гипергеометрического теста. Оценка ORA рассчитывалась как −log10FDR, умноженное на направление изменения. Аббревиатуры: ASD = расстройство аутистического спектра, BD = биполярное расстройство, MDD = большие депрессивные эпизоды, SCZ = шизофрения.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun-fS3.jpg\" alt=\"Дополнительный рис. 3.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Дополнительный рис. 3.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Дополнительный рис. 3. Протеомическое профилирование коры головного мозга гетерозиготных мутантных мышей. Относится к рис. 4. A. Пути Reactome, значительно обогащенные или истощенные у мышей Akap11+/S384* по результатам теста перемножения (permutation test). Положительные и отрицательные нормированные показатели обогащения (NES) указывают на обогащение и истощение соответственно у гетерозиготных мышей. Соотношение генов вычислялось как доля генов пути, представленных в ранжированном списке белков. Значимость определялась как FDR ≤ 0,05. Пути сгруппированы в 10 групп в соответствии с иерархией путей Reactome (получено с https://reactome.org/). Для категорий, содержащих несколько путей, приведена семантическая сводка. B. Белки переднего фронта (leading-edge) для обогащенных (вверху) и истощенных (внизу) терминов генной онтологии (GO), показанных на рис. 4C. Цвет указывает на ранг белка, который рассчитывался как −log10P x знак (log2 кратности изменения) на основе анализа дифференциального обилия белков. Положительные и отрицательные ранги указывают на увеличенное и уменьшенное обилие соответственно у мышей Akap11+/S384*. Показаны только белки переднего фронта с P ≤ 0,01 и термины GO, содержащие хотя бы один такой белок. C, E. Вулканные графики, показывающие предсказанную активность киназ, выведенную из обилия фосфосайтов (C) или скорости фосфорилирования (E), с использованием альтернативного метода тестирования (VIPER). VIPER применялся к значению −log10P x знак(log2 кратности изменения). Положительные и отрицательные оценки активности киназ указывают на повышенную и пониженную активность киназ соответственно у мышей Akap11+/S384*. Киназы считались значимыми при P ≤ 0,05 при наличии по меньшей мере трех субстратов. D, F. Вулканные графики, показывающие различия в обилии фосфосайтов (D) и скорости фосфорилирования (F), зависящие от генотипа, с выделением предсказанных субстратов PKACA, связанных с тестом RoKAI. Положительные и отрицательные логарифмические кратности изменений (log2 fold change) указывают на увеличенное и уменьшенное обилие фосфосайтов или скорость фосфорилирования соответственно у мышей Akap11+/S384*. Горизонтальная и вертикальная штриховые линии обозначают P на уровне 0,05 и log2 кратности изменения на уровне 0 соответственно. G. Анализ обогащения наборов генов (GSEA) терминов GO с использованием фосфосайтов, ранжированных по −log10P x знак(log2 кратности изменения) на основе обилия фосфосайтов. Положительные и отрицательные значения NES указывают на пути, ассоциированные с белками, обладающими соответственно повышенным или пониженным обилием фосфосайтов у мышей Akap11+/S384*. Значения P оценивались с помощью теста перемножения, а значимость определялась как FDR ≤ 0,05. Соотношение генов вычислялось как доля генов путей, присутствующих в наборе данных фосфосайтов. H. GSEA терминов SynGO с использованием фосфосайтов, ранжированных по −log10P x знак(log2 кратности изменения) на основе скорости фосфорилирования. Положительные и отрицательные значения NES указывают на пути SynGO, ассоциированные с белками, обладающими соответственно повышенной или пониженной скоростью фосфорилирования у мышей Akap11+/S384*.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun-fS4.jpg\" alt=\"Дополнительный рис. 4.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Дополнительный рис. 4.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Дополнительный рис. 4. Валидация PKA-сенсора. Относится к рис. 5. A. Коробчатые диаграммы (boxplots), показывающие среднее изменение отношения F488/F405, нормированное на первую временную точку (среднее значение ΔR/R0), в нейронах Akap11+/+ на исходном уровне, в ответ на форсколин/ролипрам (FSK/Roli) и в ответ на добавление H-89 в условиях постоянного присутствия форсколина/ролипрама (FSK/Roli+H-89). Форсколин/ролипрам значительно увеличивал ответ сенсора по сравнению с исходным уровнем (FDR = 7,32 x 10-4), тогда как последующее добавление H-89 возвращало ответ к исходному уровню (FSK/Roli+H-89 против FSK/Roli: FDR = 7,32 x 10-4; FSK/Roli+H-89 против исходного уровня: FDR = 0,50). N = 2 эмбриона, n = нейроны. ***FDR ≤ 0,001, n.s., FDR &amp;gt; 0,05 по парному критерию знаковых рангов Уилкоксона. Для коробчатых диаграмм нижний край, средняя линия и верхний край представляют соответственно первый квартиль, медиану и третий квартиль. Усы представляют 1,5 межквартильного размаха от краев коробки. Полные результаты статистического анализа приведены в Дополнительной таблице 7B. B. Временной ход изменения ΔR/R0 для нейронов, показанных на панели A. Штриховые линии обозначают интервалы во время введения препарата, когда визуализация была приостановлена.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Роль редких&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мутаций AKAP11&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Создание мышей&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;через CRISPR-&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Cas9&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Дефицит PKA и&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тревожное&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;поведение&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Новая модель&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;психических&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;расстройств&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не прошёл рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия препринта&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;bioRxiv&lt;/td&gt;\n&lt;td&gt;psychiatry and clinical psychology&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Luo AX, Deng L, Li Y, Zhang X, Li J, Zhu X, Mao X, Su Y, Wu B, Ross CA, Li PP.&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt
