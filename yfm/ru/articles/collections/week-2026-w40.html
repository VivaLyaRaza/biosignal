            {"data":{"leading":false,"html":"&lt;p&gt;24 статьи&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/optical-microscopy-predictions-of-focal-recurrence-in-gliobl.html\"&gt;Как оптическая микроскопия и искусственный интеллект помогают предугадать рецидив глиобластомы&lt;/a&gt; — Новый алгоритм анализирует свежие ткани из краев хирургической раны и указывает на участки с высокой вероятностью повторного роста опухоли.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/integrated-crispr-based-detection-of-hiv-tuberculosis-malari.html\"&gt;Три опасные инфекции и лекарственная устойчивость в одном тесте на базе CRISPR&lt;/a&gt; — Ученые объединили диагностику ВИЧ, туберкулеза, малярии и устойчивости к антибиотикам в единую тест-систему.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html\"&gt;Почему при болезни Гоше возникают судороги: ответ скрыт в развитии мозга&lt;/a&gt; — Ученые вырастили «мини-мозги» из клеток пациентов, чтобы понять, как редкая генетическая болезнь нарушает работу нейронов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/eggerthella-lenta-disrupts-the-gut-vascular-barrier-to-drive.html\"&gt;Бактерия в кишечнике помогает раку толстой кишки метастазировать в печень&lt;/a&gt; — Микробы могут разрушать сосудистый барьер кишечника, открывая путь опухолевым клеткам в кровоток.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html\"&gt;Спиральный катетер SpiraMed: новый способ доставки лекарств прямо в мозг&lt;/a&gt; — Инженеры разработали гибкий катетер, который позволяет вводить клеточную и генную терапию в мозг через один прокол, избегая лишних травм.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/single-cell-atlas-of-transcriptomic-vulnerability-across-bra.html\"&gt;Карта уязвимости мозга: как болезни меняют клетки человека&lt;/a&gt; — Ученые создали масштабный атлас мозга, чтобы понять, что общего у болезней Альцгеймера, Паркинсона и шизофрении на уровне отдельных клеток.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/delayed-coal-plant-retirements-in-the-era-of-data-centers-ca.html\"&gt;Бум искусственного интеллекта ценой здоровья: как отсрочка закрытия угольных ТЭС влияет на смертность&lt;/a&gt; — Рост спроса на электричество для дата-центров заставляет продлевать жизнь угольным станциям, что стоит людям тысяч жизней.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/from-flocks-to-swarms-rewriting-the-rules-of-collective-cell.html\"&gt;Клетки научили летать стаей с помощью световых алгоритмов&lt;/a&gt; — Ученые создали интерфейс «клетка-машина», заставив человеческие лейкоциты двигаться по законам птичьих стай.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html\"&gt;Как иммунные клетки провоцируют ожирение печени&lt;/a&gt; — Нейтрофилы, которые обычно защищают нас от инфекций, могут становиться виновниками развития стеатогепатита.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut.html\"&gt;Как мозг воспроизводит кадры личных воспоминаний&lt;/a&gt; — Нейросети помогли доказать: медиальная височная сеть мозга хранит уникальные визуальные детали наших воспоминаний.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html\"&gt;Секретное оружие иммунитета: как регуляторные Т-клетки начинают бороться с раком&lt;/a&gt; — Обычно они тормозят иммунный ответ, но под воздействием лекарств эти клетки превращаются в активных убийц опухоли.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/major-adverse-cardiac-events-and-mortality-associated-with-a.html\"&gt;Диабет и СДВГ: как расстройство внимания влияет на риск сердечных заболеваний&lt;/a&gt; — Масштабное исследование семи стран показало, как СДВГ меняет прогноз здоровья у взрослых пациентов с диабетом второго типа.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/a-serum-thyroid-hormone-metabolite-test-for-molecular-diagno.html\"&gt;Анализ крови вместо биопсии: новый способ выявления рака щитовидной железы&lt;/a&gt; — Ученые разработали тест на метаболиты гормонов, который помогает отличить доброкачественные узлы от злокачественных без инвазивных процедур.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/senescence-associated-kras-upregulation-in-peripheral-t-cell.html\"&gt;Почему иммунитет стареет раньше времени: роль белка KRAS в развитии сердечных болезней&lt;/a&gt; — Ученые нашли молекулярный механизм, который связывает преждевременное старение иммунных клеток с ранним атеросклерозом.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/fold-em-direct-atomic-structure-inference-from-cryo-em-parti.html\"&gt;Как увидеть структуру белка, имея в сотни раз меньше данных&lt;/a&gt; — Новый алгоритм Fold'EM позволяет восстанавливать атомные модели белков по единичным снимкам, обходясь без долгой реконструкции карт.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/genome-wide-association-study-of-sepsis-susceptibility-in-ic.html\"&gt;Почему некоторые люди беззащитны перед сепсисом: разгадка кроется в генах редких популяций&lt;/a&gt; — Генетики нашли у жителей Катара редкую мутацию, которая мешает организму вовремя остановить смертельно опасное воспаление.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/a-designed-ubiquitin-binding-protein-selectively-enriches-an.html\"&gt;Свободный убиквитин: как ученые научились видеть «невидимый» регулятор клеток&lt;/a&gt; — Разработан новый белковый зонд UBiP10, который позволяет отследить свободный убиквитин и его роль в жизни клетки.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/global-dispersal-of-macroalgae-derived-recalcitrant-doc-may.html\"&gt;Морские водоросли прячут углерод в глубинах океана на тысячи лет&lt;/a&gt; — Оказалось, что ламинария помогает бороться с изменением климата, отправляя углерод на дно океана.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html\"&gt;Как кровь течет в сердце при общем артериальном стволе: первое компьютерное моделирование&lt;/a&gt; — Ученые впервые построили цифровую модель редкого порока сердца, чтобы понять, как смешивается кровь и почему клапаны работают со сбоями.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/multimodal-integration-of-ambulatory-ecg-and-clinical-featur.html\"&gt;Может ли искусственный интеллект предсказать риск внезапной сердечной смерти&lt;/a&gt; — Ученые объединили данные холтеровского мониторирования и клиническую историю пациентов, чтобы точнее оценивать угрозу для сердца.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html\"&gt;Смогут ли нейросети навести порядок в хаосе биологических данных&lt;/a&gt; — Миллионы экспериментов в базах данных хранятся без должного описания. Исследователи проверили, справятся ли LLM с их классификацией.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/drought-spec-net-early-tomato-drought-detection-and-potentia.html\"&gt;Как нейросеть учится видеть жажду у томатов до появления первых признаков увядания&lt;/a&gt; — Новая модель Drought-Spec-Net анализирует спектр света, отраженного от листьев, чтобы предсказать стресс у растений еще до их увядания.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/plasmid-architecture-determines-the-stability-of-inverted-te.html\"&gt;Как одна деталь в ДНК-конструкторе ломает производство лекарств для генной терапии&lt;/a&gt; — Ученые нашли причину генетического брака в заготовках для вирусных векторов и придумали, как его исправить.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/shared-pathogenic-genes-and-therapeutic-targets-in-periodont.html\"&gt;Скрытая связь: что общего у болезней десен и системного артрита&lt;/a&gt; — Биоинформатики нашли генетические ключи, объединяющие пародонтит и системный ювенильный идиопатический артрит.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":
