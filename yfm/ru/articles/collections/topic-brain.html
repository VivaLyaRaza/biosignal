ней диагностики.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html\"&gt;Как наш мозг превращает непонятное искусство в удовольствие&lt;/a&gt; — Ученые проследили путь от простого любопытства до озарения и радости от понимания картин.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html\"&gt;Как прерывистый сон запускает вспышки эпилепсии в мозге&lt;/a&gt; — Ученые выяснили, почему микропробуждения во время сна провоцируют патологическую активность нейронов без расширения сети приступов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html\"&gt;Как крысы избегают черных лебедей и ищут джекпоты&lt;/a&gt; — Редкие и катастрофические события управляют выбором животных сильнее, чем рутина.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html\"&gt;Грипп оставляет след в мозге: как мутация LRRK2 запускает белковые сдвиги&lt;/a&gt; — Перенесенный грипп запускает в мозге носителей мутации LRRK2 изменения, похожие на ранние этапы нейродегенерации.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html\"&gt;Карта развития гиппокампа человека для изучения ранней болезни Альцгеймера&lt;/a&gt; — Ученые составили детальную карту развития гиппокампа, чтобы увидеть, где именно начинаются сбои при болезни Альцгеймера.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"18 статей"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Мозг и нервная система","description":"18 статей","vcsPath":"articles/collections/topic-brain.md"},"headings":[],"title":"Мозг и нервная система"},"router":{"pathname":"articles/collections/topic-brain","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"
