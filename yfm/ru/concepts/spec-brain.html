        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Специальность&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/spec-brain.jpg\" alt=\"Мозг и нервная система\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Иллюстрация: Ilya Repin, Public domain&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:I.P.Pavlov_by_Repin.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/spec-brain.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;неврология; нейронаука; поведение и познание животных&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/spec-brain.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Мозг и нервная система — это сложнейший биологический аппарат, обеспечивающий управление организмом, обработку информации и формирование поведения. В рамках «БиоСигнала» мы рассматриваем эту область как совокупность нейробиологии, неврологии и когнитивных наук. Изучение этой системы позволяет понять, как физические процессы в клетках превращаются в мысли, воспоминания и реакции на окружающий мир.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/spec-brain.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Нервная система состоит из центрального отдела (головной и спинной мозг) и периферического. Фундаментальным принципом её работы является передача электрических и химических сигналов между нейронами. Высшая нервная деятельность, согласно классическим представлениям, базируется на работе коры больших полушарий, которая координирует сложные взаимодействия организма со средой. Нейронаука сегодня изучает не только анатомию, но и молекулярные механизмы: как белки, РНК и иммунные клетки мозга поддерживают гомеостаз и как их дисфункция приводит к патологиям.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/spec-brain.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Мозг функционирует как многоуровневая сеть. На микроуровне нейроны обмениваются сигналами через синапсы. На мезоуровне формируются функциональные сети, такие как медиальная височная сеть, отвечающая за визуальные детали воспоминаний. На макроуровне структуры, например, миндалевидное тело и префронтальная кора, регулируют эмоциональные реакции. Важную роль играют вспомогательные клетки — глия, которые при болезнях могут «выгорать», теряя способность защищать нейроны от токсичных белков.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/spec-brain.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Современные исследования опираются на высокотехнологичные подходы. Ученые используют «мини-мозги» (органоиды), выращенные из стволовых клеток пациентов, для моделирования генетических болезней. Для анализа данных применяются алгоритмы машинного обучения, которые помогают выявлять закономерности в активности нейронов. Генетические методы, включая использование вирусных векторов, позволяют корректировать работу клеток на ранних стадиях заболеваний.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/spec-brain.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Понимание устройства мозга критически важно для медицины. В статье «Как мозг воспроизводит кадры личных воспоминаний» показано, как нейросети помогают картировать память. Исследование «Иммунные клетки мозга при болезни Альцгеймера выгорают изнутри» раскрывает механизмы истощения защитных систем организма. А работа «Генная терапия остановила развитие редкого синдрома у мышей» демонстрирует потенциал вмешательства в работу нейронов для предотвращения тяжелых нарушений координации.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/spec-brain.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Главная сложность заключается в колоссальной пластичности мозга. Стресс, генетические мутации и возрастные изменения постоянно перестраивают нейронные связи. Кроме того, многие процессы, такие как афантазия или формирование скрытых кольцевых РНК, остаются трудноуловимыми, так как требуют анализа на стыке биологии, биоинформатики и психологии. Исследования часто ограничены модельными организмами, результаты которых не всегда линейно переносятся на человека.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Мозг и нервная система&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9E%D1%80%D1%82%D0%B0%D0%BB%D1%8B%D2%9B%20%D0%B6%D2%AF%D0%B9%D0%BA%D0%B5%20%D0%B6%D2%AF%D0%B9%D0%B5%D1%81%D1%96%5D%20--%3E%20B%5B%D0%9C%D0%B8%20%D0%B6%D3%99%D0%BD%D0%B5%20%D0%B6%D2%B1%D0%BB%D1%8B%D0%BD%5D%0A%20%20B%20--%3E%20C%5B%D0%9D%D0%B5%D0%B9%D1%80%D0%BE%D0%BD%D0%B4%D1%8B%D2%9B%20%D0%B6%D0%B5%D0%BB%D1%96%D0%BB%D0%B5%D1%80%5D%0A%20%20C%20--%3E%20D%5B%D0%A1%D0%B8%D0%BD%D0%B0%D0%BF%D1%81%D1%82%D1%8B%D2%9B%20%D0%B1%D0%B0%D0%B9%D0%BB%D0%B0%D0%BD%D1%8B%D1%81%D1%82%D0%B0%D1%80%5D%0A%20%20C%20--%3E%20E%5B%D0%A4%D1%83%D0%BD%D0%BA%D1%86%D0%B8%D0%BE%D0%BD%D0%B0%D0%BB%D0%B4%D1%8B%D2%9B%20%D0%B0%D0%B9%D0%BC%D0%B0%D2%9B%D1%82%D0%B0%D1%80%5D%0A%20%20E%20--%3E%20F%5B%D0%95%D1%81%D1%82%D0%B5%20%D1%81%D0%B0%D2%9B%D1%82%D0%B0%D1%83%20%D0%B6%D3%99%D0%BD%D0%B5%20%D1%8D%D0%BC%D0%BE%D1%86%D0%B8%D1%8F%D0%BB%D0%B0%D1%80%5D%0A%20%20E%20--%3E%20G%5B%D2%9A%D0%BE%D0%B7%D2%93%D0%B0%D0%BB%D1%8B%D1%81%D1%82%D1%8B%20%D2%AF%D0%B9%D0%BB%D0%B5%D1%81%D1%82%D1%96%D1%80%D1%83%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/spec-brain.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-neurology.html\"&gt;Неврология&lt;/a&gt; — болезни нервной системы: инсульт, эпилепсия, нейродегенерация&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-neuroscience.html\"&gt;Нейронаука&lt;/a&gt; — как устроены нейроны, сети мозга и память&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-animal_behavior_and_cognition.html\"&gt;Поведение и познание животных&lt;/a&gt; — обучение, решения и общение у животных&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/spec-brain.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html\"&gt;Почему при болезни Гоше возникают судороги: ответ скрыт в развитии мозга&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut.html\"&gt;Как мозг воспроизводит кадры личных воспоминаний&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html\"&gt;Как детские стрессы перестраивают мозг и усиливают страх&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html\"&gt;Генная терапия остановила развитие редкого синдрома у мышей&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html\"&gt;Иммунные клетки мозга при болезни Альцгеймера выгорают изнутри&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html\"&gt;Сбой ключевого белка при деменции запускает аномальные кольцевые РНК&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html\"&gt;Как бета-амилоид запускает клеточную цепную реакцию при болезни Альцгеймера&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html\"&gt;Почему мозг людей с афантазией видит иначе?&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html\"&gt;Мозг дописывает реальность задним числом в первичной зрительной коре&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html\"&gt;Как мозг выбирает простые объяснения&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html\"&gt;Как мозг путает знакомое с новым: найден клеточный код памяти&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html\"&gt;Как отдельные нейроны мозга реагируют на правила общения&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html\"&gt;Скрытые кольцевые молекулы РНК выдают опасное нейродегенеративное заболевание&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html\"&gt;Как наш мозг превращает непонятное искусство в удовольствие&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html\"&gt;Как прерывистый сон запускает вспышки эпилепсии в мозге&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html\"&gt;Как крысы избегают черных лебедей и ищут джекпоты&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html\"&gt;Грипп оставляет след в мозге: как мутация LRRK2 запускает белковые сдвиги&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html\"&gt;Карта развития гиппокампа человека для изучения ранней болезни Альцгеймера&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/spec-brain.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A4%D0%B8%D0%B7%D0%B8%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%8F_%D0%B2%D1%8B%D1%81%D1%88%D0%B5%D0%B9_%D0%BD%D0%B5%D1%80%D0%B2%D0%BD%D0%BE%D0%B9_%D0%B4%D0%B5%D1%8F%D1%82%D0%B5%D0%BB%D1%8C%D0%BD%D0%BE%D1%81%D1%82%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Физиология высшей нервной деятельности — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:I.P.Pavlov_by_Repin.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Ilya Repin, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-9-559\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;WGCNA: an R package for weighted correlation network analysis&lt;/a&gt; — обзор, BMC Bioinformatics 2008&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41592-019-0686-2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;SciPy 1.0: fundamental algorithms for scientific computing in Python&lt;/a&gt; — обзор, Nat Methods 2020&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1126/science.1160809\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Understanding the Warburg effect: the metabolic requirements of cell proliferation&lt;/a&gt; — обзор, Science 2009&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"неврология; нейронаука; поведение и познание животных"}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Мозг и нервная система","description":"неврология; нейронаука; поведение и познание животных","vcsPath":"concepts/spec-brain.md"},"headings":[{"title":"Определение","href":"concepts/spec-brain.html#opredelenie","level":2},{"title":"Обзор","href":"concepts/spec-brain.html#obzor","level":2},{"title":"Теория","href":"concepts/spec-brain.html#teoriya","level":2},{"title":"Как это устроено","href":"concepts/spec-brain.html#kak-eto-ustroeno","level":2},{"title":"Методы и инструменты","href":"concepts/spec-brain.html#metody-i-instrumenty","level":2},{"title":"Где применяется","href":"concepts/spec-brain.html#gde-primenyaetsya","level":2},{"title":"Ограничения и подводные камни","href":"concepts/spec-brain.html#ogranicheniya-i-podvodnye-kamni","level":2},{"title":"Связанные концепции","href":"concepts/spec-brain.html#svyazannye-koncepcii","level":2},{"title":"Где встречается","href":"concepts/spec-brain.html#gde-vstrechaetsya","level":2},{"title":"Источники","href":"concepts/spec-brain.html#istochniki","level":2}],"title":
