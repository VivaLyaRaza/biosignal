            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Вещество&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/tdp-43.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;РНК-связывающий белок, который в норме регулирует сплайсинг, а при нейродегенерации теряет функцию, что запускает патологический синтез криптических кольцевых РНК.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Определение собрано из статей выпуска автоматически и ждёт проверки редакцией.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"kak-ob-etom-pishut-v-statyah\"&gt;&lt;a href=\"concepts/tdp-43.html#kak-ob-etom-pishut-v-statyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как об этом пишут в статьях&lt;/span&gt;&lt;/a&gt;Как об этом пишут в статьях&lt;/h2&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Белок TDP-43, связывающий ДНК, является ключевым патологическим маркером бокового амиотрофического склероза (БАС) и лобно-височной деменции (ЛВД), выполняя при этом важную функцию регулятора сплайсинга РНК. Хотя дефицит TDP-43 хорошо изучен в контексте аберрантного сплайсинга линейных транскриптов, его влияние на биогенез кольцевых РНК (circRNA) оставалось неисследованным.&lt;/p&gt;\n&lt;p&gt;— &lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html\"&gt;Сбой ключевого белка при деменции запускает аномальные кольцевые РНК&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\"spravka\"&gt;&lt;a href=\"concepts/tdp-43.html#spravka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Справка&lt;/span&gt;&lt;/a&gt;Справка&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;molecular_weight&lt;/td&gt;\n&lt;td&gt;43 kDa&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"drugie-nazvaniya\"&gt;&lt;a href=\"concepts/tdp-43.html#drugie-nazvaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Другие названия&lt;/span&gt;&lt;/a&gt;Другие названия&lt;/h2&gt;\n&lt;p&gt;TAR DNA-binding protein 43 kDa&lt;/p&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/tdp-43.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html\"&gt;Сбой ключевого белка при деменции запускает аномальные кольцевые РНК&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt; · &lt;a href=\"reference/substances.html\"&gt;Вещества&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"РНК-связывающий белок, который в норме регулирует сплайсинг, а при нейродегенерации теряет функцию, что запускает патологический синтез криптических кольцевых Р"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"TDP-43","description":"РНК-связывающий белок, который в норме регулирует сплайсинг, а при нейродегенерации теряет функцию, что запускает патологический синтез криптических кольцевых Р","vcsPath":"concepts/tdp-43.md"},"headings":[{"title":"Определение","href":"concepts/tdp-43.html#opredelenie","level":2},{"title":"Как об этом пишут в статьях","href":"concepts/tdp-43.html#kak-ob-etom-pishut-v-statyah","level":2},{"title":"Справка","href":"concepts/tdp-43.html#spravka","level":2},{"title":"Другие названия","href":"concepts/tdp-43.html#drugie-nazvaniya","level":2},{"title":"Где встречается","href":"concepts/tdp-43.html#gde-vstrechaetsya","level":2}],"title":"TDP-43"},"router":{"pathname":"concepts/tdp-43","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
