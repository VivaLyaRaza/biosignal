            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Метрика&lt;/strong&gt; · &lt;em&gt;Evoked potentials&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/evoked-potentials.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Вызванные потенциалы (ВП) — это электрическая активность мозга в ответ на стимулы, измеряемая с помощью ЭЭГ. Их амплитуда может отражать когнитивные процессы, такие как ориентация на новизну.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Определение проверено автоматически и ждёт утверждения редакцией.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"kak-ob-etom-pishut-v-statyah\"&gt;&lt;a href=\"concepts/evoked-potentials.html#kak-ob-etom-pishut-v-statyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как об этом пишут в статьях&lt;/span&gt;&lt;/a&gt;Как об этом пишут в статьях&lt;/h2&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Однако в тестах на узнавание слов дети с высоким риском демонстрировали меньшую ориентацию на новизну, что отражалось на амплитуде вызванных потенциалов.&lt;/p&gt;\n&lt;p&gt;— &lt;a href=\"2026-09-25/infants-at-high-and-low-likelihood-for-autism-show-different.html\"&gt;Как мозг младенцев с риском аутизма обрабатывает речь&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\"drugie-nazvaniya\"&gt;&lt;a href=\"concepts/evoked-potentials.html#drugie-nazvaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Другие названия&lt;/span&gt;&lt;/a&gt;Другие названия&lt;/h2&gt;\n&lt;p&gt;ВП&lt;/p&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/evoked-potentials.html#gde-vstrechaetsya\" class=\"yfm-ancho
