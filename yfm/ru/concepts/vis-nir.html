            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Метод&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/vis-nir.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Диапазон длин волн, используемый для получения спектральных профилей листьев томатов при обучении модели.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Определение собрано из статей выпуска автоматически и ждёт проверки редакцией.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"kak-ob-etom-pishut-v-statyah\"&gt;&lt;a href=\"concepts/vis-nir.html#kak-ob-etom-pishut-v-statyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как об этом пишут в статьях&lt;/span&gt;&lt;/a&gt;Как об этом пишут в статьях&lt;/h2&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Для обучения модели Drought-Spec-Net использовался набор данных из 378 спектральных профилей томатов (Solanum lycopersicum L.), полученных в диапазоне длин волн от 348 до 1052 нм (видимый и ближний инфракрасный спектр, Vis-NIR).&lt;/p&gt;\n&lt;p&gt;— &lt;a href=\"2026-10-02/drought-spec-net-early-tomato-drought-detection-and-potentia.html\"&gt;Как нейросеть учится видеть жажду у томатов до появления первых признаков увядания&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\"spravka\"&gt;&lt;a href=\"concepts/vis-nir.html#spravka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Справка&lt;/span&gt;&lt;/a&gt;Справка&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;range_nm&lt;/td&gt;\n&lt;td&gt;348-1052&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"drugie-nazvaniya\"&gt;&lt;a href=\"concepts/vis-nir.html#drugie-nazvaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Другие названия&lt;/span&gt;&lt;/a&gt;Другие названия&lt;/h2&gt;\n&lt;p&gt;видимый и ближний инфракрасный спектр&lt;/p&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/vis-nir.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/drought-spec-net-early-tomato-drought-detection-and-potentia.html\"&gt;Как нейросеть учится видеть жажду у томатов до появления первых признаков увядания&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt; · &lt;a href=\"reference/methods.html\"&gt;Методы&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Диапазон длин волн, используемый для получения спектральных профилей листьев томатов при обучении модели."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Vis-NIR","description":"Диапазон длин волн, используемый для получения спектральных профилей листьев томатов при обучении модели.","vcsPath":"concepts/vis-nir.md"},"headings":[{"title":"Определение","href":"concepts/vis-nir.html#opredelenie","level":2},{"title":"Как об этом пишут в статьях","href":"concepts/vis-nir.html#kak-ob-etom-pishut-v-statyah","level":2},{"title":"Справка","href":"concepts/vis-nir.html#spravka","level":2},{"title":"Другие названия","href":"concepts/vis-nir.html#drugie-nazvaniya","level":2},{"title":"Где встречается","href":"concepts/vis-nir.html#gde-vstrechaetsya","level":2}],"title":"Vis-NIR"},"router":{"pathname":"concepts/vis-nir","depth":2,"base":"../"},
