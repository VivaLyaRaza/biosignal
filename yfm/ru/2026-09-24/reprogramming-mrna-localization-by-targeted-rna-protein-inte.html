            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"220\" cy=\"125\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"680\" cy=\"287\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · CELL BIOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как CRISPR заставляет мРНК&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;забыть дорогу к метастазам&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte-f1.jpg\" alt=\"Рисунок 1. Гибриды dCas13-dsRBD изменяют локализацию мРНК в клеточных выростах за счет усиленного связывания с целевой м\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Гибриды dCas13-dsRBD изменяют локализацию мРНК в клеточных выростах за счет усиленного связывания с целевой мРНК. (A) Схема, иллюстрирующая скринируемые индуцибельные конструкты dCas13-dsRBD. Экспрессия dCas13-dsRBD в клетках MDA-MB-231 индуцировалась доксициклином одновременно с трансфекцией синтетических gРНК: целевой или контрольной без мишени (NTC). (B) Схема, изображающая комплекс транспортировки РНК, состоящий из CNBP, KIF1C и предполагаемых дополнительных факторов, собранный на богатых GA элементах РНК. Предполагается, что связывание комплекса dCas13-dsRBD/gРНК с богатыми GA областями препятствует связыванию RBP и приводит к разборке транспортного комплекса. Создано в BioRender. Mason, D. (2026) https://BioRender.com/kdmxt2k (C) Представительные изображения FISH мРНК NET1 и GFP в клетках, экспрессирующих dCas13-B2 (+dox) и не экспрессирующих (-dox) их, трансфицированных указанными gРНК. Изображения для дополнительных условий приведены на дополнительном рис. S1B. Стрелки указывают на зоны накопления мРНК NET1. (D) Схема, изображающая диапазон нормализованных значений PDI (целевая/NTC gРНК) и соответствующие распределения мРНК для содержащих GA мРНК. (E) Нормализованные значения PDI мРНК NET1 в клетках, экспрессирующих dCas13-dsRBD. n = 128-181 клетка для каждого условия из 4-6 независимых экспериментов. ** P &amp;lt; 0.002, **** P &amp;lt; 0.0001, ns: не достоверно по однофакторному дисперсионному анализу (ANOVA) Краскела-Уоллиса с тестом множественных сравнений Даннета. Необработанные значения PDI приведены на дополнительном рисунке S1D. (F) Представительные изображения вестерн-блоттинга иммунопреципитации (IP) dCas13-dsRBD с использованием анти-FLAG бусин. (G) Обогащение целевых (NET1) и нецелевых (GUSB и RAB13) мРНК в IP dCas13-dsRBD. РНК детектировались с помощью ddPCR, а количества в присутствии gРНК NET11067 нормировались на соответствующую NTC gРНК. n = 4 независимых эксперимента для каждого условия. *** P &amp;lt; 0.001 и **** P &amp;lt; 0.0001 по двуфакторному ANOVA с тестом множественных сравнений Даннета. Столбчатые диаграммы на панелях (E) и (G) представляют среднее значение ± стандартная ошибка среднего (SEM) с наложением отдельных точек данных.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Клетки распределяют белки по организму с помощью специальных молекулярных маршрутов, которые опухоли используют для агрессивного роста. До сих пор вмешиваться в эти процессы точечно и надолго не удавалось. Исследователи адаптировали систему CRISPR так, чтобы она перехватывала нужные транспортные цепочки прямо в цитоплазме. Это открывает способ останавливать движение раковых клеток без повреждения ДНК.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;dCas13 блокирует связь мРНК с белком CNBP в цитоплазме&lt;/li&gt;\n&lt;li&gt;Нарушение транспорта мРНК NET1 снижает подвижность клеток&lt;/li&gt;\n&lt;li&gt;Метод подавляет метастазирование в моделях на мышах&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;В основе внутриклеточного транспорта лежат взаимодействия между матричными РНК и специфическими белками, которые доставляют их к периферии клеток. Одним из ключевых игроков здесь выступает белок CNBP, связывающийся с богатыми гуанином и аденином элементами в мРНК. Нарушение таких контактов традиционно пытались вызывать с помощью антисмысловых олигонуклеотидов, однако их действие оказывается недолговечным в делящихся клетках. Авторы работы применили каталитически неактивную систему dCas13 в сочетании со специально подобными гидными РНК для стерического блокирования этих участков.&lt;/p&gt;\n&lt;p&gt;Используя клеточные линии тройного негативного рака молочной железы MDA-MB-231 и эмбриональные почечные клетки HEK293T, исследователи подобрали оптимальные условия для стабильной экспрессии dCas13 и доставки гидных РНК. Эксперименты показали, что нацеливание комплекса на мРНК гена NET1 эффективно мешает связыванию CNBP и нарушает транспорт транскрипта. В результате миграционная подвижность клеток снижается, а способность к инвазии в экспериментах in vitro заметно падает.&lt;/p&gt;\n&lt;p&gt;На мышиных моделях исследователи проверили долгосрочные эффекты созданного инструмента. Блокирование транспорта мРНК NET1 привело к значительному снижению метастатического колонизирования легких in vivo. Это демонстрирует, что адресное вмешательство в транспорт мРНК с помощью CRISPR-систем может служить мощным подходом для изучения и контроля фенотипических проявлений опухолевого роста.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты получены на ограниченном числе клеточных линий и мышиных моделях, требующих дальнейшей клинической валидации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;РНК-связывающие белки (РБП) взаимодействуют с РНК в составе сложных рибонуклеопротеиновых комплексов и регулируют различные аспекты жизненного цикла РНК, а следовательно, и функции клеток. Несмотря на их важность, выяснение функционального вклада конкретных событий связывания РНК и РБП, особенно в долгосрочных фенотипических анализах, остается сложной задачей. В данном исследовании мы используем специфичность системы CRISPR/dCas13 для нарушения специфических взаимодействий РНК и РБП.&lt;/p&gt;\n&lt;p&gt;Мы применяем этот метод к богатым гуанином и аденином элементам локализации мРНК, которые привлекают РНК-связывающий белок CNBP и служат платформами для сборки комплексов транспорта мРНК. Мы показываем, что комплекс dCas13/gRNA связывается с целевыми транскриптами с высокой специфичностью и нарушает привлечение CNBP, что приводит к изменению локализации целевой мРНК и подвижности клеток, что согласуется с функцией целевых мРНК.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Система CRISPR/dCas13 использует измененный белок Cas13, который не режет РНК, а прицельно доставляется к ней с помощью гидовой РНК, что позволяет изучать функции РНК без ее разрушения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы описываем оптимизации и важные аспекты для стабильного внедрения этой системы. Кроме того, мы используем ее, чтобы показать, что нарушение локализации содержащей GA-элементы мРНК NET1 снижает инвазивность раковых клеток и метастатическую колонизацию легких.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нарушение локализации мРНК NET1 с помощью CRISPR/dCas13 снижает инвазивность раковых клеток и метастазирование в легкие в экспериментах in vivo.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эти данные раскрывают потенциальную роль локализации мРНК в онкогенезе и иллюстрируют, как данную систему на основе CRISPR можно применять для долгосрочных функциональных исследований взаимодействий РНК и РБП in vivo.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование демонстрирует противоопухолевый эффект на моделях in vivo, однако трансляция этих результатов в клиническую практику требует масштабных дополнительных проверок.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Посттранскрипционная регуляция экспрессии генов опосредуется в первую очередь белками, связывающими РНК (RBP), которые динамически взаимодействуют с определенными последовательностями или структурными мотифами внутри целевых мРНК. События связывания РНК с RBP затрагивают практически все аспекты метаболизма мРНК, включая процессинг, стабильность, трансляцию и локализацию. 3'-нетранслируемые области (3'-UTR) мРНК часто содержат множество элементов последовательности, которые привлекают специфические RBP, координирующие сложную пространственно-временную регуляцию для формирования клеточного протеома. Подчеркивая важность этих взаимодействий, их дисрегуляция связана с различными заболеваниями, включая рак. Недавние достижения в картировании сайтов связывания RBP в масштабе транскриптома существенно расширили наши представления о сборке и организации рибонуклеопротеинов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RBP (белки, связывающие РНК) — это молекулярные регуляторы, которые присоединяются к молекулам мРНК и управляют их судьбой в клетке от синтеза до распада.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тем не менее, изучение специфических взаимодействий между РНК и RBP и понимание их индивидуального функционального вклада остается крайне сложной задачей. Типичные подходы, предполагающие истощение пула RBP, могут иметь непрямые эффекты, поскольку один RBP может связывать множество молекул РНК и, следовательно, участвует в сложной регуляторной сети. С другой стороны, точная генетическая делеция или мутация цис-регуляторных элементов последовательности РНК может быть громоздкой, трудно поддается временному контролю и является необратимой, так как затрагивает изменение последовательности геномной ДНК. Альтернативный подход с использованием антисмысловых олигонуклеотидов (ASO) предлагает гибкую методологию для блокирования специфических взаимодействий РНК-RBP.&lt;/p&gt;\n&lt;p&gt;Однако эффекты ASO в делящихся клетках недолговечны и не позволяют изучать долгосрочные фенотипические последствия при нарушении специфических для последовательности взаимодействий РНК-RBP. Перечисленные выше причины подчеркивают необходимость разработки инструмента, способного избирательно нарушать взаимодействия между РНК и RBP, специфичные для последовательности, для получения функциональных данных в актуальных для заболеваний моделях и временных масштабах. Благодаря минимальному размеру и компактной организации эффекторного белка, системы CRISPR-Cas класса 2 стали важными инструментами для целенаправленных манипуляций с нуклеиновыми кислотами. Системы CRISPR-Cas типа VI, в частности системы на основе Cas13, таргетирующих РНК, широко используются в качестве программируемых переключателей для управления самыми разнообразными эффектами, специфичными для транскриптов, включая процессинг, редактирование и локализацию РНК, а также картирование специфичных для транскриптов белковых взаимодействий.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эксперименты на мышах и клеточных линиях позволяют выявить ключевые механизмы, однако требуют осторожности при экстраполяции результатов на сложные патологии человека из-за различий в регуляторных сетях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В этих подходах используется специфичность направляющей РНК (gRNA) для привлечения каталитически неактивных комплексов dCas13/gRNA к определенным областям РНК, где эффекторный фермент или фактор, слитный с белком Cas, оказывает свое влияние на целевую РНК. В данном исследовании мы стремились использовать способность dCas13 направленно взаимодействовать с РНК для создания генетически кодируемого аналога ASO, который может стерически конкурировать и нарушать специфические взаимодействия РНК-RBP. Для калибровки этой системы мы применили ее к богатым GA-элементам в 3'-UTR, которые опосредуют транспорт мРНК к периферическим клеточным выростам. Богатые GA-элементы направляют формирование комплекса транспорта РНК путем привлечения белка, связывающего РНК, CNBP и моторного белка микротрубочек KIF1C.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Система dCas13/gRNA эффективно конкурентно подавляет связывание CNBP с GA-элементами, что позволяет успешно имитировать эффекты ASO и снижать инвазивность раковых клеток.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ASO, направленные против богатых GA-элементов, нарушают формирование комплекса мРНК-CNBP-KIF1C и, как следствие, уменьшают транспорт мРНК, что приводит к клеточным фенотипам со сниженной скоростью миграции и инвазивностью. Следовательно, регуляция мРНК на основе богатых GA-элементов представляет собой биологически релевантную модель для оценки и стандартизации эффективности CRISPR-dCas13/gRNA в качестве инструмента функционального вмешательства. Здесь мы обнаруживаем, что прочность связывания с целевой РНК, а также количество цитоплазматической gRNA ограничивают способность комплекса dCas13/gRNA конкурировать с функцией РНК-элемента.&lt;/p&gt;\n&lt;p&gt;Мы описываем оптимизации, позволяющие внедрить полностью генетически кодируемую, стабильно экспрессируемую систему CRISPR-dCas13/gRNA, которая нарушает зависимую от GA локализацию мРНК. Этот эффект опосредован конкуренцией за связывание с CNBP и по своему масштабу сопоставим с вмешательствами на основе ASO, приводящими к выраженным изменениям поведения клеток. Мы объединили этот инструмент с долгосрочными функциональными исследованиями, продемонстрировав, что неправильная локализация содержащей GA мРНК NET1 приводит к снижению инвазивности раковых сфероидов in vitro и уменьшению метастатической колонизации легких у мышей. Эта работа описывает новую стратегию использования специфичности инструментов CRISPR-Cas для селективного и контролируемого вмешательства в специфические взаимодействия РНК-RBP, что является необходимым шагом на пути к пониманию их долгосрочного функционального вклада.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"sliyaniya-dcas13-dsrbd-usilivayut-svyazyvanie-dcas13-s-mrnk-i-narushayut-funkciyu-bogatyh-ga-elementov-rnk\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#sliyaniya-dcas13-dsrbd-usilivayut-svyazyvanie-dcas13-s-mrnk-i-narushayut-funkciyu-bogatyh-ga-elementov-rnk\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Слияния dCas13-dsRBD усиливают связывание dCas13 с мРНК и нарушают функцию богатых GA элементов РНК&lt;/span&gt;&lt;/a&gt;Слияния dCas13-dsRBD усиливают связывание dCas13 с мРНК и нарушают функцию богатых GA элементов РНК&lt;/h4&gt;\n&lt;p&gt;Для оценки способности CRISPR-dCas13 нарушать взаимодействия между RBP и РНК мы стабильно экспрессировали каталитически неактивный белок RfxCas13d (dRfxCas13d; далее именуемый dCas13) под управлением промотора, индуцируемого доксициклином. Белок dCas13 был слит с C-концевыми метками eGFP и FLAG для биохимической очистки и характеристики (Рис. 1A). Дополнительно был включен домен связывания двунитевой РНК (dsRBD) для усиления связывания dCas13/gРНК с целевой мРНК. Мы использовали dsRBD из различных белков (PKR, PRKRA, DIP1, B2) с различающейся аффинностью к двунитевой РНК (Рис. 1A). Кассеты экспрессии dCas13-dsRBD, индуцируемые доксициклином, были стабильно интегрированы в клетки MDA-MB-231. Индукция трансгена приводила к сходным уровням экспрессии между линиями, за исключением dCas13-DIP1, который стабильно демонстрировал более низкую общую экспрессию (Рис. S1A).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte-f1.jpg\" alt=\"Рисунок 1. Гибриды dCas13-dsRBD изменяют локализацию мРНК в клеточных выростах за счет усиленного связывания с целевой м\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Гибриды dCas13-dsRBD изменяют локализацию мРНК в клеточных выростах за счет усиленного связывания с целевой мРНК. (A) Схема, иллюстрирующая скринируемые индуцибельные конструкты dCas13-dsRBD. Экспрессия dCas13-dsRBD в клетках MDA-MB-231 индуцировалась доксициклином одновременно с трансфекцией синтетических gРНК: целевой или контрольной без мишени (NTC). (B) Схема, изображающая комплекс транспортировки РНК, состоящий из CNBP, KIF1C и предполагаемых дополнительных факторов, собранный на богатых GA элементах РНК. Предполагается, что связывание комплекса dCas13-dsRBD/gРНК с богатыми GA областями препятствует связыванию RBP и приводит к разборке транспортного комплекса. Создано в BioRender. Mason, D. (2026) https://BioRender.com/kdmxt2k (C) Представительные изображения FISH мРНК NET1 и GFP в клетках, экспрессирующих dCas13-B2 (+dox) и не экспрессирующих (-dox) их, трансфицированных указанными gРНК. Изображения для дополнительных условий приведены на дополнительном рис. S1B. Стрелки указывают на зоны накопления мРНК NET1. (D) Схема, изображающая диапазон нормализованных значений PDI (целевая/NTC gРНК) и соответствующие распределения мРНК для содержащих GA мРНК. (E) Нормализованные значения PDI мРНК NET1 в клетках, экспрессирующих dCas13-dsRBD. n = 128-181 клетка для каждого условия из 4-6 независимых экспериментов. ** P &amp;lt; 0.002, **** P &amp;lt; 0.0001, ns: не достоверно по однофакторному дисперсионному анализу (ANOVA) Краскела-Уоллиса с тестом множественных сравнений Даннета. Необработанные значения PDI приведены на дополнительном рисунке S1D. (F) Представительные изображения вестерн-блоттинга иммунопреципитации (IP) dCas13-dsRBD с использованием анти-FLAG бусин. (G) Обогащение целевых (NET1) и нецелевых (GUSB и RAB13) мРНК в IP dCas13-dsRBD. РНК детектировались с помощью ddPCR, а количества в присутствии gРНК NET11067 нормировались на соответствующую NTC gРНК. n = 4 независимых эксперимента для каждого условия. *** P &amp;lt; 0.001 и **** P &amp;lt; 0.0001 по двуфакторному ANOVA с тестом множественных сравнений Даннета. Столбчатые диаграммы на панелях (E) и (G) представляют среднее значение ± стандартная ошибка среднего (SEM) с наложением отдельных точек данных.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte-fS1.jpg\" alt=\"Дополнительный рисунок S1. Гибридизация с dsRBD изменяет эффект dCas13/gРНК на локализацию мРНК NET1 в клеточных выроста\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Дополнительный рисунок S1. Гибридизация с dsRBD изменяет эффект dCas13/gРНК на локализацию мРНК NET1 в клеточных выростах. (A) Представительный вестерн-блоттинг экспрессии dCas13-dsRBD (обнаруженной с помощью FLAG-метки) в индуцибельных доксициклином клеточных линиях. (B) Представительные изображения FISH мРНК NET1 и GFP в указанных клеточных линиях dCas13-dsRBD, трансфицированных синтетическими gРНК NTC1 или NET11067. (C) Нормализованная интенсивность мРНК GFP из клеток, как в (B). n = 88-117 клеток для каждого условия. (D) PDI мРНК NET1 в клеточных линиях, экспрессирующих dCas13-dsRBD (как в (B)). Обратите внимание, что PDI=1 отражает диффузное распределение. n = 113-181 клетка для каждого условия из 4-6 независимых экспериментов; ** P &amp;lt; 0.01 и **** P &amp;lt; 0.0001 по однофакторному ANOVA Краскела-Уоллиса с тестом множественных сравнений Данна.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;dCas13-dsRBD — это модифицированная система CRISPR, где к «немому» ферменту dCas13 добавляют белковый домен dsRBD для более прочного удержания на целевой молекуле РНК.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для нацеливания dCas13 на специфические мРНК мы трансфицировали синтетические направляющие РНК (gРНК) в индуцированные доксициклином клетки. gРНК были разработаны для воздействия на последовательности 3'UTR, участвующие в регуляции мРНК, либо против последовательностей, отсутствующих в транскриптоме человека (контрольные gРНК без мишени — NTC1, NTC2). Чтобы определить, могут ли слияния dCas13-dsRBD функционально нарушать взаимодействия RBP и РНК, мы сосредоточились на богатых GA элементах, которые стимулируют транспорт РНК к периферии клетки путем рекрутирования РНК-связывающего белка CNBP и микротрубочкового мотора KIF1C (Рис. 1B). Антисмысловые олигонуклеотиды (ASO) против богатых GA областей в мРНК NET1 или RAB13 предотвращают связывание CNBP, что приводит к более перинуклеарному распределению целевых мРНК и функциональному нарушению миграции клеток.&lt;/p&gt;\n&lt;p&gt;Чтобы оценить, может ли CRISPR-dCas13 аналогичным образом нарушать транспорт, зависящий от CNBP, мы разработали gРНК к богатой GA области мРНК NET1 (gРНК NET11067). Распределение эндогенной мРНК NET1 анализировали путем визуализации транскриптов с помощью флуоресцентной гибридизации in situ (FISH) (Рис. 1C и Рис. S1B). Для контроля вариабельности экспрессии dCas13-dsRBD мы выбрали клетки с сопоставимым количеством РНК GFP (Рис. 1C и Рис. S1B, C). Распределение мРНК NET1 количественно определяли путем измерения описанного ранее индекса периферического распределения (PDI) (Рис. 1D и E). Значения PDI нормируются относительно гипотетической полностью диффузной РНК (PDI=1), так что более высокие значения PDI указывают на более периферическое распределение РНК, в то время как более низкие значения обозначают перинуклеарное смещение. На Рис. S1D показаны исходные значения PDI мРНК NET1. Некоторая вариабельность базального PDI мРНК NET1 наблюдается даже в контрольных условиях (Рис. S1D, см. образцы с gРНК NTC1), вероятно, из-за вариаций, специфичных для клеточной линии, при стабильной экспрессии различных слияний dCas13-dsRBD.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдаемый разброс базальных значений PDI у разных клеточных линий указывает на фоновый эффект стабильной экспрессии конструкций, что потребовало жесткой нормировки на контрольные образцы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтобы подчеркнуть специфический эффект gРНК NET11067 в каждой линии dCas13-dsRBD, значения PDI NET1 были нормированы на таковые при доставке gРНК NTC1 (Рис. 1D и E). Интересно, что в отсутствие dsRBD gРНК dCas13/NET11067 существенно не изменяла распределение NET1 (Рис. 1E и Рис. S1D, дорожки dCas13). Напротив, слияния dCas13-dsRBD, за исключением dCas13-DIP1, значительно нарушали локализацию NET1 (Рис. S1D). dsRBD B2 оказывал наиболее выраженный эффект на локализацию и был единственным dsRBD, который значительно ухудшал локализацию по сравнению с немодифицированным dCas13 (Рис. 1E). Чтобы исключить вероятность того, что этот эффект обусловлен только трансфекцией gРНК, мы измерили PDI NET1 в клеточных линиях dCas13-B2 и dCas13-PKR, трансфицированных gРНК NET11067, но без индукции доксициклином. В этих условиях PDI NET1 оставался неизмененным, что демонстрирует зависимость этого эффекта от экспрессии dCas13 (Рис. 1E и Рис. S1D, дорожки -dox). Следовательно, слияние dCas13 с dsRBD усиливает его способность нарушать функцию богатого GA элемента РНК.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Слияние dCas13 с белковым доменом B2 dsRBD существенно нарушает периферическую локализацию мРНК NET1 (зависимым от индукции доксициклином образом), в то время как чистый dCas13 без dsRBD такого эффекта не дает.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы выдвинули гипотезу, что повышенная способность слияний dCas13-dsRBD нарушать локализацию NET1 проистекает из их более стабильного связывания с целевой мРНК. Чтобы проверить это, мы провели ко-иммунопреципитацию dCas13 со стабильно связанными РНК. Антитела против FLAG-метки использовались для иммунопреципитации слияний dCas13 в присутствии gРНК NTC или NET11067 с последующим детектированием эндогенных мРНК методом ddPCR (Рис. 1F и G). Действительно, слияния с dsRBD демонстрировали более высокое обогащение целевой мРНК NET1 по сравнению с dCas13 в чистом виде. dsRBD B2 показал наибольшее обогащение, что согласуется с его более сильным эффектом на локализацию мРНК NET1, показанным выше. Более того, другие нецелевые мРНК (GUSB, RAB13) существенно не обогащались (Рис. 1G), указывая на то, что слияния dCas13 ассоциируются специфически с транскриптом, на который нацелена gРНК. Мы заключаем, что среди протестированных dsRBD B2 предлагает оптимальный способ стабилизации ассоциации dCas13/gРНК с целевой мРНК и функционального нарушения целевой последовательности. Таким образом, мы выбрали dCas13-B2 для дальнейшей характеристики.&lt;/p&gt;\n&lt;p&gt;dCas13-B2 нарушает функцию элементов РНК специфичным для последовательности образом с минимальным связыванием вне мишени&lt;/p&gt;\n&lt;p&gt;Чтобы оценить, может ли dCas13-B2 широко связываться с функциональными элементами РНК и нарушать их работу, мы разработали направляющие РНК (gRNA), нацеленные на различные области в составе 3'-нетранслируемых областей (3'-UTR) NET1 и RAB13 (Рис. 2 A и B). gRNA NET1921 и NET1975 нацелены на богатую GA-область в пределах 3'-UTR NET1, которая, как было показано, имеет функциональное значение для периферической локализации NET1, подобно области, на которую нацелена gRNA NET11067. С другой стороны, gRNA NET11351 нацелена на область, не вовлеченную в трафик NET1. Аналогичным образом, gRNA RAB13191 и RAB13230 нацелены на богатую GA-область, важную для локализации RAB13, в то время как gRNA RAB13360 и RAB13391 нацелены на нефункциональную область UTR. Способность этих gRNA направлять dCas13-B2 на определенные мРНК оценивали в экспериментах по ко-иммунопреципитации с последующим детектированием методом ddPCR (Рис. SN S2). Действительно, все gRNA NET1 приводили к значительному обогащению мРНК NET1 в иммунопреципитатах dCas13-B2, в то время как ненацеленные транскрипты (GUSB, RAB13) существенно не обогащались (Рис. 2A). Напротив, gRNA RAB13 приводили к значительному обогащению RAB13, но не мРНК NET1 или GUSB (Рис. 2B).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte-f2.jpg\" alt=\"Рис. 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 2&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;dCas13-B2 с gRNA специфично связывает целевые мРНК NET1 и RAB13 и обогащает их в ходе иммунопреципитации без существенного захвата посторонних транскриптов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ddPCR (капельная цифровая ПЦР) — метод абсолютного количественного определения нуклеиновых кислот с высокой точностью за счет разделения образца на тысячи капель.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Неспецифические взаимодействия между dCas13 и нецелевыми мРНК описывались ранее и часто, но не исключительно, обусловлены последовательностью gRNA [37]. Для дальнейшей оценки специфичности нацеливания dCas13-B2 мы разработали панели nanoString nCounter, которые включали: а) потенциальные внецелевые транскрипты для каждой gRNA на основе частичной комплементарности; б) описанные ранее внецелевые мишени Cas13d [37]; и в) дополнительные мРНК с богатыми GA-областями, подобными NET1 и RAB13, которые также транспортируются к клеточным выростам с помощью KIF1C (полный список см. в Таблице SN S3). Важно отметить, что единственными мРНК, существенно обогащенными в образцах ко-иммунопреципитации с dCas13-B2, были мишени для каждой gRNA (Рис. 2C–E; порог значимости &amp;gt; 2-кратного обогащения и p ≤ 0,01; исходные данные приведены в Таблице SN S3), в то время как все остальные РНК определялись только на фоновых уровнях, аналогичных тем, которые наблюдаются при отсутствии индукции dCas13-B2 (Рис. 2F). Следовательно, dCas13-B2 демонстрирует минимальное связывание вне мишени.&lt;/p&gt;\n&lt;p&gt;Чтобы определить, влияет ли связывание dCas13-B2 с UTR NET1 и RAB13 на трафик этих мРНК, мы использовали флуоресцентную гибридизацию in situ (FISH) для визуализации и количественной оценки распределения соответствующих мРНК (Рис. 2G–I). Хотя, как показано выше, все dCas13-B2/gRNA могут связывать мРНК как NET1, так и RAB13, только те gRNA, которые нацелены на функционально важные богатые GA-области (NET1921/975, NET11067 и RAB13191/230), приводили к значительному снижению индекса периферической локализации (PDI), что указывает на нарушение транспорта мРНК (Рис. 2H и I). Следствием снижения периферической локализации NET1 и RAB13 является нарушение миграции клеток и уменьшение скорости клеточного движения. В соответствии с этим, уменьшение транспорта РНК при связывании dCas13-B2 с богатыми GA-областями NET1 и RAB13 сопровождалось снижением скорости случайной миграции клеток (Рис. 2J).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эксперименты проведены на клеточных линиях in vitro, поэтому степень влияния на тканевый или организменный трафик мРНК в живом организме требует дополнительных подтверждений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Наблюдаемое уменьшение было сопоставимо с результатами, описанными ранее при использовании антисмысловых олигонуклеотидов (ASO) для нарушения транспорта соответствующих мРНК (Рис. SN S3). Таким образом, dCas13-B2 связывается высокоспецифичным к последовательности образом и влияет на функцию элементов РНК в степени, достаточной для изменения клеточного поведения.&lt;/p&gt;\n&lt;h4 id=\"nacelivanie-dcas13-b2-na-bogatyj-ga-element-narushaet-rekrutirovanie-cnbp\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#nacelivanie-dcas13-b2-na-bogatyj-ga-element-narushaet-rekrutirovanie-cnbp\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нацеливание dCas13-B2 на богатый GA-элемент нарушает рекрутирование CNBP&lt;/span&gt;&lt;/a&gt;Нацеливание dCas13-B2 на богатый GA-элемент нарушает рекрутирование CNBP&lt;/h4&gt;\n&lt;p&gt;Учитывая, что dCas13-B2 способен стабильно связываться и функционально изменять транспорт мРНК, мы предположили, что комплексы dCas13-B2/gRNA действуют путем конкуренции с белковыми факторами связывания РНК (RBP) за присоединение к богатым GA-элементам (Рис. 1B). Чтобы напрямую проверить это предположение, мы обратились к системе in vitro с использованием очищенных компонентов, чтобы оценить, конкурирует ли dCas13-B2 со связыванием CNBP с целевыми транскриптами (Рис. 1B). В этой системе транскрибированный in vitro фрагмент РНК, соответствующий 3'-UTR RAB13, был сконструирован так, чтобы содержать шпильку BoxB бактериофага λ на своем 3'-конце. Последовательность BoxB узнается пептидом белка λN, который в виде слияния с GST позволяет осуществлять выделение (pulldown) РНК и любых ассоциированных факторов на глутатионовых бусинах (Рис. 3A).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Комплексы dCas13-B2/gRNA конкурируют с белком CNBP за связывание с богатой GA-областью 3'-UTR RAB13, снижая ассоциацию CNBP с целевой РНК in vitro.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GST-pulldown — метод аффинного осаждения, использующий глутатион-трансферазу для выделения белков и их партнеров по взаимодействию из раствора.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сначала мы подтвердили, что экспрессированный в бактериях и очищенный CNBP связывается с 3'-UTR RAB13 с видимой константой диссоциации K_d 0,9 µM (Рис. SN S4A и B). Делеция богатой GA-области в РНК уменьшала связывание CNBP (Рис. SN S4A). Эти результаты согласуются с ранее описанным прямым взаимодействием CNBP с РНК RAB13 in vivo и с ролью богатой GA-области в стимуляции связывания CNBP. Кроме того, наблюдаемый K_d находится в пределах значений, ранее описанных для CNBP с использованием других подходов и субстратов РНК. Чтобы выделить комплексы dCas13-B2/gRNA, белок получали путем транзиентной трансфекции в клетках HEK293, иммунопреципитировали на бусинах с антителами к FLAG и нагружали синтетической gRNA. Свободную gRNA удаляли, а комплексы dCas13-B2/gRNA элюировали с помощью избытка пептида FLAG, что приводило к их значительному обогащению (Рис. 3B и C; Рис. SN S4C).&lt;/p&gt;\n&lt;p&gt;Затем мы оценили, как dCas13-B2 влияет на связывание CNBP с 3'-UTR RAB13. Мы отмечаем, что максимальное количество dCas13, которое мы могли добавить в реакцию, было субстехиометрическим по отношению к CNBP (Рис. SN S4C). Тем не менее, несмотря на лимитирующее количество, комплексы dCas13/RAB13191/230 значительно снижали ассоциацию CNBP с целевой РНК (Рис. 3D и E), одновременно увеличивая ассоциацию между РНК и dCas13-B2 (Рис. 3D, F и Рис. SN S4D). Эти результаты подтверждают представление о том, что комплексы dCas13-B2/gRNA могут конкурировать с рекрутированием RBP на мишени РНК. Мы полагаем, что dCas13-B2 может использоваться в качестве эффективного, специфичного и универсального инструмента для манипулирования конкретными взаимодействиями РНК-белок и исследования функционального вклада элементов РНК.&lt;/p&gt;\n&lt;p&gt;Ядерная задержка и уровни экспрессии ограничивают эффективность направляемых промотором U6 gRNA&lt;/p&gt;\n&lt;p&gt;Наши предыдущие исследования опирались на транзикцию химически синтезированных gRNA в клетки. Однако этот подход имеет те же ограничения, что и доставка ASO (т.е. невозможность оценки долгосрочных эффектов в делящихся клетках или тканях и неспецифическое поглощение; см. Введение). Чтобы CRISPR-dCas13 мог стать улучшенной альтернативой ASO, все необходимые компоненты (т.е. dCas13, а также gRNA) должны быть генетически закодированы и экспрессироваться стабильным образом. Поэтому мы использовали лентивирусную трансдукцию для стабильной интеграции кассеты экспрессии gRNA (под управлением человеческого промотора U6; U6-gRNA) в клетки, также экспрессирующие индуцируемый доксициклином dCas13-B2. Индукцию доксициклином начинали за 48 часов до анализа.&lt;/p&gt;\n&lt;p&gt;Однако, в отличие от трансфицированной gRNA, мы заметили, что управляемая промотором U6 gRNA NET11067 не оказывала заметного влияния на локализацию мРНК NET1 (Рис. S5A), которая оставалась схожей с таковой у контрольных клеток (экспрессирующих gRNA U6-NTC1). Никакого эффекта не наблюдалось даже при увеличении множественности заражения (MOI) в 10 раз (Рис. S5A).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Управляемые промотором U6 gRNA демонстрируют крайне низкие уровни экспрессии и удерживаются в ядре, что препятствует эффективному подавлению цитоплазматических взаимодействий RBP-мРНК с помощью CRISPR-dCas13.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы предположили, что способность gRNA направлять связывание dCas13-B2 с целевой РНК и конкурировать с рекрутингом RBP во многом зависит от количества gRNA. Кроме того, учитывая, что изучаемая нами регуляция локализации РНК происходит в цитоплазме, присутствие gRNA в цитоплазме также может быть лимитирующим фактором. Таким образом, мы использовали ddPCR для оценки количества gRNA и анализ RNAscope Plus smRNA для визуализации распределения gRNA.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ddPCR (капельная цифровая ПЦР) — высокоточный метод абсолютного количественного определения молекул ДНК или РНК без использования стандартных кривых.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Клеточные линии, экспрессирующие управляемые промотором U6 gRNA (NTC1 или NET11067), демонстрировали количество gRNA на порядки ниже по сравнению с количеством, определяемым при трансфекции синтетической gRNA (Рис. S5B и C). Более высокий MOI приводил лишь к незначительному увеличению, которое быстро выходило на плато (Рис. S5B и C).&lt;/p&gt;\n&lt;p&gt;Для визуализации gRNA in situ мы разработали зонды smRNA против gRNA U6-NET11067. Специфический сигнал легко обнаруживался в стабильно экспрессирующих клетках, но отсутствовал в родительской клеточной популяции (Рис. S5D). Однако интересно, что сигнал детектировался преимущественно в ядре, указывая на то, что экспрессируемая gRNA, по-видимому, неэффективно экспортировалась в цитоплазму (Рис. S5D).&lt;/p&gt;\n&lt;p&gt;В целом казалось, что как недостаточная цитоплазматическая аккумуляция, так и низкие уровни экспрессии управляемых промотором U6 gRNA ограничивают способность CRISPR-dCas13 функционально вмешиваться в цитоплазматические взаимодействия RBP-РНК. Чтобы увеличить уровни gRNA, мы экспрессировали матрицу gRNA, в которой промотор U6 управляет транскрипцией предшественника, содержащего 8–10 последовательностей gRNA, разделенных прямыми повторами. Отдельные gRNA могут расщепляться из таких матриц за счет каталитической активности Cas13 (Рис. 4A).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte-f4.jpg\" alt=\"Рисунок 4. Для цитоплазматического обогащения gРНК, процессируемых из мультимерных матриц, требуется длительная экспресс\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4. Для цитоплазматического обогащения gРНК, процессируемых из мультимерных матриц, требуется длительная экспрессия dCas13-B2. (A) Схема процессинга матрицы gРНК с помощью dCas13-B2. (B) Представительное нозерн-блотт-детектирование gРНК NET11067 из общей РНК клеток HEK293, экспрессирующих матрицу U6-NET11067 gРНК и указанные белки. Фрагмент, сопоставимый по размеру с синтетической gРНК, был обнаружен в клетках, экспрессирующих конструкты dCas13-B2, что указывает на процессинг матрицы. U6 снРНК служила контролем загрузки. (C) Схема экспериментальной установки для проверки влияния времени экспрессии dCas13-B2 на накопление gРНК в цитозоле. Использовались клетки MDA-MB-231 со стабильно интегрированным dCas13-B2, индуцибельным доксициклином. (D) Представительные изображения FISH gРНК NET11067 и мРНК GFP, детектированных с помощью RNAscope в условиях, описанных в (C). Область клеток, экспрессирующих как мРНК GFP, так и gРНК, показана синим цветом. Контуры ядер показаны красным цветом. (E) Количество цитоплазматической gРНК NET11067 относительно ядерного (слева) или общего количества в клетке (справа). n = 16-31 клетка для каждого условия, как описано в (C); * P &amp;lt; 0.05 по однофакторному ANOVA с тестом множественных сравнений Холма-Сидака. (F)-(G) Представительный вестерн-блоттинг и количественная оценка, показывающие, что экспрессия dCas13-B2 достигает пика через 24 часа после индукции. n = 3 независимых эксперимента. (H) Представительная флуоресценция GFP и фазово-контрастные изображения клеток, экспрессирующих dCas13-B2 и dCas13-B2-NCS1, показывающие, что гибриды с NCS1 локализуются преимущественно в ядре. (I) Клетки MDA-MB были транзиентно трансфицированы указанными конструктaми dCas13-B2 и матрицей U6-NET11067 gРНК. Представительные изображения FISH показывают gРНК NET11067 и мРНК GFP с количественной оценкой соотношения цитоплазматического и ядерного количества gРНК. n = 30-32 клетки для каждого условия; недостоверно (ns) по однофакторному ANOVA с тестом множественных сравнений Краскела-Уоллиса. Столбчатые диаграммы на панелях (G), (E) и (I) представляют среднее значение ± SEM с наложением отдельных точек данных.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Важно отметить, что вариант dCas13, который не расщепляет мРНК из-за мутаций в HEPN-домене, сохраняет активность процессинга матриц gRNA. В соответствии с этим анализ Нозерн-блоттинга показал, что dCas13-B2 способен процессировать матрицы U6-gRNA в зрелые gRNA (Рис. 4B). Тем не менее, детекция gRNA in situ показала, что значительное количество gRNA все еще удерживается в ядре.&lt;/p&gt;\n&lt;p&gt;В частности, когда кассета матрицы U6-gRNA доставлялась в клетки, после чего индуцировалась экспрессия dCas13-B2 (Рис. 4C, «После»), почти половина сигнала gRNA присутчала в ядре (Рис. 4D и E). Интересно, что такое распределение gRNA было аналогично случаю, когда экспрессия dCas13-B2 не индуцировалась вовсе (Рис. 4D и E). Мы предположили, что для изменения распределения gRNA потребуется экспрессия dCas13-B2 до экспрессии матрицы gRNA.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Описанные эксперименты проведены на клеточных линиях in vitro; эффективность векторной доставки и внутриклеточного транспорта gRNA может существенно отличаться в тканях живого организма.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтобы проверить это, экспрессию dCas13 индуцировали до трансфекции кассеты матрицы U6-gRNA (Рис. 4C, «До»). Интересно, что это привело к существенному увеличению цитоплазматической gRNA наряду со снижением ядерной gRNA (Рис. 4D и E). Этот эффект не был связан с более высокой экспрессией dCas13-B2, поскольку экспрессия dCas13-B2 достигает пика через 48 часов (Рис. 4F и G).&lt;/p&gt;\n&lt;p&gt;Хотя мы не можем сделать окончательный вывод о точной механистической основе повышенного цитоплазматического присутствия gRNA, эти данные предполагают, что время или продолжительность экспрессии dCas13-B2 имеют значение. Краткосрочная экспрессия dCas13 не оптимальна для достижения более высоких количеств цитоплазматической gRNA — элемента, необходимого для вмешательства во взаимодействия RBP-РНК, происходящие в цитоплазме.&lt;/p&gt;\n&lt;p&gt;Мы также исследова компартмент, повлияет ли это на распределение gRNA. Для этого белок дополнительно сшили с модулем ядерно-цитоплазматического челночного транспорта (NCS1), состоящим из двух сигналов ядерной локализации SV40 и богатого лейцином сигнала ядерного экспорта. Как и ожидалось, белок dCas13-B2-NCS1 демонстрировал более выраженную ядерную аккумуляцию (Рис. 4H) и также был способен процессировать матрицы gRNA (Рис. 4B). Тем не менее, это не привело к дальнейшему улучшению ядерно-цитоплазматического распределения gRNA (Рис. 4I). В результате мы продолжили работу с конъюгатом dCas13-B2 без включения дополнительных сигналов трафика.&lt;/p&gt;\n&lt;h4 id=\"stabilnaya-ekspressiya-geneticheski-kodiruemoj-sistemy-crispr-dcas13-narushaet-transportov-mrnk,-zavisyashij-ot-ga-elementov\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#stabilnaya-ekspressiya-geneticheski-kodiruemoj-sistemy-crispr-dcas13-narushaet-transportov-mrnk,-zavisyashij-ot-ga-elementov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Стабильная экспрессия генетически кодируемой системы CRISPR-dCas13 нарушает транспортов мРНК, зависящий от GA-элементов&lt;/span&gt;&lt;/a&gt;Стабильная экспрессия генетически кодируемой системы CRISPR-dCas13 нарушает транспортов мРНК, зависящий от GA-элементов&lt;/h4&gt;\n&lt;p&gt;Опираясь на приведенную выше информацию, мы стабильно интегрировали массивы gРНК (содержащие gРНК NTC1 или NET11067) либо в клетки, конститутивно экспрессирующие dCas13-B2 (CMV_dCas13-B2), либо в клетки с индуцируемой экспрессией dCas13-B2 (pIND20_dCas13-B2). В последнем случае экспрессию dCas13-B2 индуцировали в течение 2 или 7 дней до начала анализа. Количество экспрессируемой gРНК было сходным во всех случаях и превышало уровень, достигаемый с помощью одной кассеты U6-gRNA (Рис. 5A), что подтверждает способность массивов U6-gRNA усиливать продукцию gРНК.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte-f5.jpg\" alt=\"Рисунок 5. Стабильно интегрированная система dCas13-B2/матрица gРНК изменяет распределение эндогенной мРНК NET1. (A) Кол\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5. Стабильно интегрированная система dCas13-B2/матрица gРНК изменяет распределение эндогенной мРНК NET1. (A) Количественная оценка gРНК NET11067 методом ddPCR, нормированная на housekeeping-ген GusB. Клеточные линии с матрицей U6-gRNA демонстрируют более высокую общую распространенность gРНК. n = 3-4 независимых эксперимента; ** P &amp;lt; 0.01 по однофакторному ANOVA с тестом множественных сравнений Холма-Сидака. (B) Интенсивности в натуральном логарифме (ln) цитоплазматической gРНК NET11067 (из изображений FISH, как в (C)) в стабильных клеточных линиях с индуцибельной (pIND20) или конститутивной (CMV) экспрессией dCas13-B2. Указаны дни индукции доксициклином. n = 65-115 клеток для каждого условия из 2 независимых экспериментов; *** P &amp;lt; 0.001 и **** P &amp;lt; 0.0001 по однофакторному ANOVA с тестом множественных сравнений Сидака. (C) Представительные изображения FISH gРНК NET11067 и мРНК GFP, связанные с (C). Область клетки показана синим цветом. Контуры ядер показаны красным цветом. (D) Представительные изображения стабильных клеточных линий, конститутивно экспрессирующих dCas13-B2 и указанные матрицы gРНК. мРНК NET1 и GFP детектируются с помощью FISH, а белок dCas13-B2 — по флуоресценции GFP. Зоны накопления мРНК NET1 отмечены белыми стрелками. (E) PDI мРНК NET1 в указанных стабильных клеточных линиях. n = 86-99 клеток для каждого условия из 3-4 независимых экспериментов; P &amp;lt; 0.0001 по однофакторному ANOVA с тестом множественных сравнений Сидака. (F) Данные Gasparski et al. (2023), показывающие влияние ASO на PDI мРНК NET1 для сравнения. n = 84-118 клеток для каждого условия из 3 независимых экспериментов; P &amp;lt; 0.0001 по однофакторному ANOVA с тестом множественных сравнений Сидака. Столбчатые диаграммы на панелях (A), (B), (E) и (F) представляют среднее значение ± SEM с наложением отдельных точек данных.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;gРНК (гидовая РНК) — это молекула РНК, которая направляет комплекс CRISPR в нужное место генома или транскрипта.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Индуцируемая экспрессия dCas13-B2 достигала плато уже через 2 дня (Рис. S6A) и наблюдалась лишь в части клеток, в отличие от клеток с конститутивной экспрессией CMV_dCas13-B2, которые демонстрировали более равномерную экспрессию (Рис. S6B). Тем не менее, отдельные GFP-положительные клетки демонстрировали сходные уровни экспрессии dCas13-B2-GFP (Рис. S6C). Интересно, что в клетках CMV_dCas13-B2 уровень gРНК в цитоплазме был значительно выше по сравнению с клетками с индукцией доксициклином (Dox-induced_dCas13-B2) (Рис. 5B и C). Эта разница не была обусловлена исключительно общими различиями в количестве gРНК, поскольку нормализация по общему количеству gРНК показала аналогичные тенденции (Рис. S6D).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte-fS6.jpg\" alt=\"Дополнительный рисунок S6. Для изменения локализации мРНК требуется длительная индукция dCas13-B2. (A) Представительный \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Дополнительный рисунок S6. Для изменения локализации мРНК требуется длительная индукция dCas13-B2. (A) Представительный вестерн-блоттинг белка dCas13-B2 (обнаруженного с помощью FLAG-метки), стабильно экспрессируемого под управлением либо индуцибельного доксициклином, либо конститутивного промотора. Звездочка указывает на усеченный C-концевой фрагмент. (B) Представительные изображения FISH мРНК GFP в стабильных клеточных линиях. Клеточные линии CMV_dCas13-B2 экспрессируют конструкты dCas13-B2 более равномерно, что связано с рис. 5B. (C) Количество белка dCas13-B2, измереное по иммунофлуоресценции GFP. n = 39 клеток. n.s.: недостоверно по двустороннему непарному t-тесту Стьюдента. (D) Количество цитоплазматической/общей gРНК NET11067 (из изображений FISH, показанных на рис. 5C) в стабильных клеточных линиях с индуцибельной (pIND20) или конститутивной (CMV) экспрессией dCas13-B2. Указаны дни индукции доксициклином. n = 65-115 клеток для каждого условия; * P &amp;lt; 0.05 и *** P &amp;lt; 0.001 по однофакторному ANOVA с тестом множественных сравнений Сидака. (E) Представительные изображения FISH мРНК GFP и NET1 после индукции dCas13-B2 в течение 2 или 7 дней. Стрелки указывают на зоны накопления мРНК NET1. (F, G) PDI мРНК NET1 (F) и распространенность мРНК GFP (G) после индукции dCas13-B2 в течение 2 или 7 дней. n = 46-48 клеток для каждого условия; недостоверно (ns); * P &amp;lt; 0.05 и **** P &amp;lt; 0.0001 по однофакторному ANOVA с тестом множественных сравнений Даннета.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдаемые эффекты получены на клеточных линиях in vitro; для подтверждения значимости в живом организме требуются дополнительные исследования на моделях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эти результаты согласуются с представлением о том, что кратковременная экспрессия dCas13 не оптимальна для достижения высоких уровней цитоплазматической gРНК. Действительно, пролонгированная индукция dCas13-B2 в течение 7 дней увеличивала уровни gРНК в цитоплазме, хотя и не в такой степени, как в клетках с конститутивной экспрессией (Рис. 5B и Рис. S6D).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Конститутивная экспрессия dCas13-B2 и пролонгированная индукция (7 дней) обеспечивают достаточное накопление gРНК в цитоплазме для эффективного подавления мишеней, в отличие от 2-дневной индукции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтобы оценить, влияют ли эти различия в количестве цитоплазматической gРНК на способность dCas13-B2 конкурировать с нацеливанием мРНК, зависящим от GA-элементов, мы измерили локализацию мРНК NET1. В соответствии с уровнями gРНК в цитоплазме, кратковременная индукция dCas13-B2 в течение 2 дней не приводила к заметному влиянию на локализацию мРНК NET1 (Рис. 5E), в то время как конститутивная экспрессия приводила к значительному снижению периферической локализации мРНК NET1 (Рис. 5D и E).&lt;/p&gt;\n&lt;p&gt;Степень неправильной локализации мРНК NET1 в клетках, экспрессирующих gРНК NET11067 и конститутивно экспрессирующих dCas13-B2, была сходной с таковой при доставке синтетической gРНК (сравните Рис. 5E с Рис. S5A) и соответствовала эффектам, опосредованным ASO, о которых сообщалось ранее (Рис. 5F). Пролонгированная 7-дневная индукция приводила к заметному, хотя и менее выраженному эффекту (Рис. S6E-G).&lt;/p&gt;\n&lt;p&gt;Предотвращение транспортировки мРНК NET1 снижает инвазию раковых клеток и метастатическую колонизацию легких&lt;/p&gt;\n&lt;p&gt;Чтобы убедиться, что эта система не активирует пути клеточного стресса, мы сравнили родительские линии и линии dCas13-B2. Примечательно, что не было обнаружено различий в ответе на стресс, о чем свидетельствовало фосфорилирование eIF2a как в базальных условиях, так и после обработки арсенитом натрия (Рис. S7A). В подтверждение этого вывода анализ RNA-seq показал, что экспрессия генов, связанных с клеточным стрессом и цитотоксичностью, существенно не изменялась во всех модифицированных клеточных популяциях (Рис. S7B и Таблица S4).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нарушение локализации мРНК NET1 не влияет на рост клеток в монослое, но снижает размер сфероидов в 3D-культуре, их инвазивность и метастатическую колонизацию легких in vivo.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Возможность генетически кодировать все компоненты системы открыла перспективы для изучения последствий изменения локализации мРНК NET1 в долгосрочных фенотипических анализах. Используя клетки CMV_dCas13-B2 с конститутивной экспрессией, мы обнаружили, что нарушение локализации мРНК NET1 не влияло на скорость роста клеток в условиях 2D-культуры (Рис. 6A). Однако внедрение отдельных клеток в трехмерный матрикс (matrigel) и их культивирование с образованием многоклеточных сфероидов в течение ~9 дней (Рис. 6B) показало, что клетки, экспрессирующие матрицу gRNA NET11067, формировали меньшие сфероиды (Рис. 6C), что указывает на снижение роста или жизнеспособности в этих условиях 3D-культивирования.&lt;/p&gt;\n&lt;p&gt;Для оценки инвазивного потенциала использовали истощение сыворотки с целью индуцирования коллективной инвазии в окружающий матрикс (Рис. 6B). Согласуясь с предыдущим отчетом с использованием ASO, изменение локализации мРНК NET1 посредством экспрессии dCas13-gRNA приводило к значительному снижению инвазивности сфероидов (Рис. 6D). Чтобы расширить эти наблюдения и оценить потенциальную роль локализации мРНК NET1 в метастазировании рака in vivo, клетки CMV_dCas13-B2-GFP вводили внутривенно в хвостовую вену иммунодефицитным мышам. Метастатическую колонизацию в легких оценивали 5 недель спустя с помощью иммунофлуоресцентного обнаружения GFP (Рис. 6E).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ASO (антисмысловые олигонуклеотиды) — это короткие синтетические цепочки нуклеотидов, которые связываются с мРНК и могут блокировать ее функции или запускать ее разрушение.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В то время как уровни белка dCas13-B2-GFP в зонах опухоли оставались схожими, экспрессия матрицы gRNA NET11067 приводила к значительному снижению опухолевой нагрузки (Рис. 6F, G). В целом, описанные здесь данные демонстрируют, что dCas13 может использоваться для эффективного нарушения специфических взаимодействий РНК-белок (РДБ) и оценки их функционального вклада.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эксперименты in vivo проводились на иммунодефицитных мышах, что ограничивает прямую экстраполяцию результатов на пациентов с полноценной иммунной системой без учета микроокружения опухоли.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы дополнительно показываем, что эффективная реализация этого инструмента CRISPR-dCas13 в стабильно экспрессируемом, полностью генетически кодируемом виде зависит от определенных факторов. В то время как некоторые приложения CRISPR-Cas13 могут быть реализованы через временное связывание с целевыми мРНК, персистентное вмешательство во взаимодействие с эндогенными РДБ требует стабильного взаимодействия, которое может быть усилено путем слияния с dsRBD (доменами, связывающими двунитевую РНК) [21]. Мы обнаружили, что белок B2 dsRBD обеспечивает максимальный эффект в данном контексте.&lt;/p&gt;\n&lt;p&gt;Дополнительным соображением при таргетировании цитоплазматических мРНК является экспорт gRNA из ядра и ее накопление до достаточных уровней в цитоплазме. В отличие от временной экспрессии, стабильная геномная интеграция конструктов gRNA под управлением U6 приводит к лимитирующим уровням gRNA в цитоплазме. Мы показываем, что на их уровень можно дополнительно влиять с помощью конститутивной или индуцибельной природы и продолжительности экспрессии dCas13. Дополнительные модификации, включая экспрессию gRNA с промотора малой ядерной РНК U1, могут еще больше улучшить результаты. Мы предполагаем, что этот инструмент на основе dCas13 может быть использован для широкого изучения специфических событий связывания РНК-белок и, таким образом, обеспечивает гибкий и обратимый подход для определения регуляторного вклада РДБ и анализа организации РНП без изменения геномной ДНК. Тем не менее, в зависимости от конкретного изучаемого события связывания могут потребоваться специфические оптимизации и учет различных факторов.&lt;/p&gt;\n&lt;p&gt;Мы применили этот подход к изучению локализации мРНК, управляемой богатыми GA элементами. Этот механизм таргетирования работает в различных типах клеток в культурах in vitro или в тканях in vivo и важен для разнообразных процессов — от инвазии раковых клеток до формирования кровеносных сосудов и организации эпителиальной ткани. Здесь мы расширяем эти данные, показывая, что неправильное распределение содержащей GA мРНК NET1 приводит к снижению метастатической колонизации легких на мышиных моделях. Описанное использование CRISPR-dCas13 для репрограммирования распределения специфических мРНК, а также альтернативные методы неправильного таргетирования мРНК в цитоплазматические компартменты позволят в дальнейшем исследовать долгосрочные фенотипические последствия этого распространенного пути локализации мРНК.&lt;/p&gt;\n&lt;p&gt;Обеспечивая надежное нарушение определенных регуляторных элементов РНК, описанная здесь платформа открывает пути для механистических исследований посттранскрипционной регуляции в физиологически значимых и связанных с заболеваниями контекстах.&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"kletochnoe-kultivirovanie\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#kletochnoe-kultivirovanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Клеточное культивирование&lt;/span&gt;&lt;/a&gt;Клеточное культивирование&lt;/h4&gt;\n&lt;p&gt;Клетки MDA-MB-231 (ATCC; HTB-26) культивировали в среде Leibovitz’s L-15 (Gibco; 11415064), дополненной 10% фетальной бычьей сывороткой (ФБС; Thermo Fisher A31604-02) или свободной от тетрациклина ФБС (Thermo Fisher A47362-01) и 1% пенициллина-стрептомицина (Gibco; 15140122) при 37°C в атмосфере с обычным содержанием CO2 в инкубаторе с влажной средой. Клетки HEK293T (ATCC; CRL-3216) культивировали в модифицированной среды Игла Дульбекко (DMEM; Gibco; 11995-065), дополненной 10% ФБС и 1% пенициллина-стрептомицина при 37°C и 5% CO2 в инкубаторе с влажной средой. Пересев клеток проводили с использованием 0.05% трипсина (Gibco; 25300054), а их отсутствие на зараженность микоплазмой подтверждали регулярным ПЦР-тестированием.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Метод ПЦР (полимеразная цепная реакция) используется здесь для контроля качества — быстрой и чувствительной проверки клеточных культур на отсутствие микоплазмы.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Лентивирусные частицы, использованные для получения стабильных клеточных линий, нарабатывали в клетках HEK293T. Кратко: лентивирусные векторы и плазмиды упаковки pMD2.VSVG (плазмида Addgene № 12259) и psPAX2 (плазмида Addgene № 12260) ко-трансфицировали с помощью реагента для ДНК-трансфекции PolyJet (SignaGen; SL100688). Среду, содержащую лентивирусные частицы, собирали через 48 часов и инкубировали с полиэтиленгликолем при 4°C ночь перед концентрированием путем центрифугирования. Концентрированные частицы использовали для инфицирования клеток, а стабильно трансдуцированные линии получали после 10-дневной селекции антибиотиками, специфичными для конструктных меток (пуромицин [Gibco; A11138-03], 6 мкг/мл бластицидин [Gibco; A11139-03] или 0.35 мг/мл генетицин [Gibco; 10131-035]). Клетки, экспрессирующие dCas13-EGFP или Cherry-NLS, дополнительно отбирали с помощью сортировки клеток, активируемой флуоресценцией (FACS).&lt;/p&gt;\n&lt;h4 id=\"transfekciya\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#transfekciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Трансфекция&lt;/span&gt;&lt;/a&gt;Трансфекция&lt;/h4&gt;\n&lt;p&gt;Для экспериментов по транзиентной трансфекции клетки пересевали за 24 часа до трансфекции синтетической gРНК с использованием липофектамина RNAimax (Invitrogen; 13778150) или синтетической gРНК совместно с ДНК-плазмидами с использованием Lipofectamine LTX (Invitrogen; A12621) в соответствии с инструкциями производителя. Клетки высевали так, чтобы к моменту трансфекции их конфлюэнтность составляла ~70–80%, а анализ проводили через 48–72 часа после трансфекции. Для экспериментов по визуализации клетки трансфицировали в 12-луночном планшете 0.1 нмоль синтетической gРНК и/или 500 нг плазмидной ДНК. Для экспериментов по иммунопреципитации РНК объемы реакций трансфекции масштабировали для чашек диаметром 6 см, используя 0.35 нмоль синтетической gРНК на одну чашку.&lt;/p&gt;\n&lt;p&gt;Синтетические gРНК были спроектированы так, чтобы содержать процессированную форму прямого повтора RfxCas13 (30 н.о.; Таблица S1; [29]). Последовательности спейсеров конструировали для гибридизации с конкретными целевыми областями мРНК, выбранными таким образом, чтобы минимизировать нецелевые эффекты и не влиять на экспрессию или трансляцию мРНК [12,13]. Совместимость последовательности спейсеров со связыванием Cas13 проверяли in silico с помощью веб-инструмента «Cas13 design tool» [30]. Синтетические gРНК изготавливались компанией IDT с добавлением фосфоротиоатных 2'-O-метильных оснований на 5'- и 3'-концах для повышения стабильности gРНК in vivo. Последовательности gРНК, использованные в данном исследовании, приведены в Таблице S1.&lt;/p&gt;\n&lt;h4 id=\"klonirovanie-plazmid\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#klonirovanie-plazmid\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Клонирование плазмид&lt;/span&gt;&lt;/a&gt;Клонирование плазмид&lt;/h4&gt;\n&lt;p&gt;Варианты dCas13 клонировали в лентивирусные векторы под управлением индуцибельных доксициклином или конститутивных промоторов. Кратко: фрагменты dCas13 амплифицировали методом ПЦР из ранее описанного конструкта (плазмида Addgene № 154938). Фрагменты dCas13 и EGFP-3xFLAG gblocks в дальнейшем лигировали в вектор pcDNA3.1 по сайтам рестрикции BamHI и NotI. Указанные dsRBD (Таблица S2) затем встраивали выше EGFP (на 5'-конце). Целиком эти конструкты клонировали в остовный вектор pENTR1A и рекомбинировали в лентивирусный вектор pInducer 20 (плазмида Addgene № 44012) с помощью фермента Gateway LR Clonase II (Thermofisher; 11791020).&lt;/p&gt;\n&lt;p&gt;Для клонирования варианта dCas13-B2 под управлением промотора CMV фрагмент dCas1-B2dsRBD-EGFP-FLAG обрабатывали рестриктазами и лигировали в млекопитающий лентивирусный вектор pCDH-CMV-MCS-EF1-Puro (System Biosciences; CD510B-1) по сайтам BamHI и NotI. gРНК RfxCas13 были спроектированы так, чтобы содержать либо одиночные процессированные (30 н.о.), либо непроцессированные прямые повторы (36 н.о.) с идентичными спейсерами, как описано ранее [29]. Последовательности gРНК, использованные в данном исследовании, см. в Таблице S1. Для получения лентивирусной экспрессионной кассеты плазмиду pLenti-CMV-TetR (плазмида Addgene № 17492) расщепляли по сайтам ClaI и XbaI с последующим лигированием фрагмента промотора человека U6 (hU6) выше двух сайтов BsmBI и участка тимидинов, транскрибируемого как полиуридиновый тракт для терминации транскрипции.&lt;/p&gt;\n&lt;p&gt;ДНК-фрагменты, соответствующие отдельным gРНК, клонировали по сайтам BsmBI. Наборы (архитектуры) gРНК получали с использованием набора для сборки NEBridge Golden Gate Assembly kit (NEB; E1602S) с применением сгенерированных с помощью ПЦР фрагментов gРНК, содержащих уникальные перекрывающиеся «липкие» концы (Таблица S1). Для экспрессии и очистки рекомбинантного CNBP оптимизированную по кодонам для E. coli последовательность человеческого CNBP клонировали в бактериальный экспрессионный вектор pET-32a(+) (Novagen; 69015-3). В частности, генные фрагменты gBlock, содержащие последовательность, кодирующую сайт расщепления протеазой вируса табачного травления (TEV), с последующей кодирующей последовательностью человеческого CNBP, а также сайты рестрикции BamHI и NotI на обоих концах последовательности TEV-CNBP, были приобретены у Integrated DNA Technologies. Фрагмент gBlock встраивали в вектор pET-32a(+) путем рестрикционного расщепления с последующим лигированием. Лентивирусные конструкты Cherry-NLS получали так, как описано ранее [13].&lt;/p&gt;\n&lt;h4 id=\"fluorescentnaya-gibridizaciya-in-situ\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#fluorescentnaya-gibridizaciya-in-situ\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Флуоресцентная гибридизация in situ&lt;/span&gt;&lt;/a&gt;Флуоресцентная гибридизация in situ&lt;/h4&gt;\n&lt;p&gt;Для визуализации методом флуоресцентной гибридизации in situ (FISH) клетки MDA-MB-231 высевали на покровные стекла, покрытые коллагеном IV (10 мкг/мл; Sigma; C5533), в базальной среде, содержащей 0.1% сыворотки. Клеткам давали прикрепиться в течение 2-3 часов, затем промывали PBS и фиксировали в 4% параформальдегиде на PBS в течение 20 минут при комнатной температуре. Для визуализации мРНК FISH выполняли с использованием набора ViewRNA ISH Cell Assay kit (ThermoFisher; QVC0001) в соответствии с протоколом производителя. Использовали следующие зонды: human NET1 (VA6-3169338), human RAB13 (VA6-3168453), GFP (VF1-14510). После мечения мРНК клетки окрашивали с помощью HCS green cell mask (ThermoFisher; H32714) и DAPI для обозначения контуров клеток и ядер. Образцы заключали под среду Prolong Gold antifade (ThermoFisher; P36930) на ночь перед визуализацией.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;FISH — метод визуализации конкретных молекул ДНК или РНК внутри клеток с помощью меченых зондов, позволяющий увидеть их точное расположение.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для визуализации гРНК использовали набор RNAscope plus smRNA-RNA HD assay kit (Advanced Cell Diagnostics (ACD); 322780) в соответствии с инструкциями производителя. Кратко: клетки фиксировали в течение 30 минут, затем промывали PBS. Эндогенную пероксидазную активность истощали путем инкубации покровных стекол в течение 10 минут в перекиси водорода с последующим перевариванием протеазой с использованием протеазы III, разведенной 1:15 в PBS, в течение 10 минут при комнатной температуре. Использовали следующие зонды: NET11067 gRNA (ACD; 1258891-S1), GFP mRNA (ACD; 400281-C2). Для детектирования применяли красители Opal 570 (Akoya Biosciences; OP-001003) или Opal 690 (OP-001006). Затем образцы обрабатывали для визуализации так, как описано выше.&lt;/p&gt;\n&lt;h4 id=\"vizualizaciya\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#vizualizaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Визуализация&lt;/span&gt;&lt;/a&gt;Визуализация&lt;/h4&gt;\n&lt;p&gt;Фиксированные образцы визуализировали либо на инвертированном конфокальном микроскопе Nikon Eclipse Ti2-E, либо на Leica SP8. Микроскоп Nikon Ti2-E оснащен сканирующим конфокальным блоком с дисковым вращением Yokogawa CSU-X1, объективом 40× (Plan Fluor 40; масляный; NA=1.30; WD=240 мкм), программным обеспечением NIS-Elements (5.21.03, Build 1489) и камерой sCMOS с задней подсветкой Hamamatsu ORCA-Fusion BT Gen III. Микроскоп Leica SP8 оснащен масляным объективом HC PL APO 63x oil CS2. Для оценки скорости миграции клеточные линии, экспрессирующие Cherry-NLS, отслеживали методом живой визуализации с использованием инвертированного микроскопа Olympus IX81, оснащенного системой инкубации (Okolab), которая поддерживала температуру столика и объектива на уровне 37°C в течение всего эксперимента. Клетки высевали в средовую среду fluorobrite (ThermoFisher; A18967-01) за 6 часов до визуализации с использованием объектива 10x. Снимки клеток делали каждые 5 минут в течение 8 часов.&lt;/p&gt;\n&lt;h4 id=\"analiz-izobrazhenij\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#analiz-izobrazhenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ изображений&lt;/span&gt;&lt;/a&gt;Анализ изображений&lt;/h4&gt;\n&lt;p&gt;Для анализа распределения мРНК на изображениях FISH рассчитывали индекс PDI с помощью ранее опубликованного пользовательского скрипта Matlab [31]. Кратко, индекс PDI представляет собой взвешенную по интенсивности меру распределения популяции мРНК относительно центра ядра в расчете на одну клетку с использованием изображений с проекцией максимальной интенсивности. Он также нормализован по размеру и морфологии каждой клетки на двумерной плоскости, так что значение 1 отражает диффузное распределение, значения &amp;gt; 1 соответствуют более периферическому распределению, а значения &amp;lt; 1 — более перинуклеарному. Для анализа распределения гРНК проекции суммы интенсивностей изображений FISH вручную сегментировали на ядерную и цитоплазматическую области с помощью FIJI. Интенсивность цитозольной гРНК и общего клеточного GFP (необработанная интегрированная плотность) измеряли в расчете на одну клетку. Эти данные имели логнормальное распределение и были трансформированы с использованием натурального логарифма для статистического анализа.&lt;/p&gt;\n&lt;p&gt;Для анализа случайной миграции клеток использовали клеточные линии, экспрессирующие Cherry-NLS. Дополнительно флуоресценцию GFP использовали для идентификации клеток, экспрессирующих dCas13. Ядерный сигнал флуоресценции Cherry использовали для отслеживания клеток с течением времени с помощью плагина FIJI TrackMate. Клетки, которые делились или которые не удавалось отслеживать в течение всего эксперимента, исключали из финального анализа.&lt;/p&gt;\n&lt;h4 id=\"rnk-immunoprecipitaciya\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#rnk-immunoprecipitaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;РНК-иммунопреципитация&lt;/span&gt;&lt;/a&gt;РНК-иммунопреципитация&lt;/h4&gt;\n&lt;p&gt;Для детектирования РНК, которые ко-иммунопреципитируют с dCas13, мы использовали магнитные бусины FLAG (ThermoFisher; A36798) для осаждения слияний dCas13-dsRBD-EGFP-3xFLAG. Кратко, 50 мкл бусин FLAG предварительно блокировали с помощью BSA, гликогена, ДНК спермы лосося и тРНК E. coli. Клетки промывали PBS, а затем лизировали в ледяном буфере, содержащем 1% NP-40, 50 мМ Tris (pH 7.4), 150 мМ NaCl, 10 мМ MgCl2, 10% глицерин, 1x ингибитор протеаз HALT (ThermoFisher; 1861281) и ингибитор РНКаз (Promega; N2618). Тотальный лизат сначала осветляли центрифугированием при 10 000×g, а затем инкубировали в течение 1 часа при 4°C с бусинами FLAG при вращении. Бусины промывали 5 раз в лизисном буфере, после чего белок элюировали с помощью 50 мкг пептида FLAG (ThermoFisher; A36806) в течение 15 минут при комнатной температуре при встряхивании. Тотальные и элюированные белки и РНК дополнительно анализировали с помощью вестерн-блоттинга, ddPCR или nanoString nCounter.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;РНК-иммунопреципитация — метод изоляции и изучения молекул РНК, связанных с конкретным белком, с помощью антител к этому белку.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vydelenie-i-analiz-rnk\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#vydelenie-i-analiz-rnk\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Выделение и анализ РНК&lt;/span&gt;&lt;/a&gt;Выделение и анализ РНК&lt;/h4&gt;\n&lt;p&gt;Для анализа gRNA РНК выделяли с использованием реагента Trizol LS (Thermo Fisher Scientific; 10296010). Водную фазу выделяли в соответствии с инструкциями производителя и наносили на набор Zymo total RNA clean and concentrator kit (Zymo research; R1014) с проведением обработки ДНКазой на колонке. Для экспериментов, требующих выделения только мРНК, использовали набор RNeasy Plus Mini Kit (Qiagen; 74134). РНК подвергали обратной транскрипции с помощью набора iScript cDNA Synthesis Kit (Bio-Rad; 1768891) и использовали для капельной цифровой полимеразной цепной реакции (ddPCR). ПЦР-реакции готовили с использованием кДНК, специфичных для генов праймеров и смеси ddPCR EvaGreen Supermix (Bio-Rad; 186-4034). Капли получали из этой реакции с помощью автоматического генератора капель Automated Droplet Generator (Bio-Rad; 186-4101), после чего ПЦР проводили на термоциклере C1000 Touch Thermal Cycler (Bio-Rad; 185-1197), а считывание капель выполняли на ридере капель QX-200 Droplet Reader (Bio-Rad; 186-4003). Результаты количественно оценивали с помощью программного обеспечения QuantaSoft (Bio-Rad).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Капельная цифровая ПЦР (ddPCR) позволяет точно абсолютное количество молекул ДНК или РНК в образце без необходимости построения калибровочных кривых за счет разделения реакционной смеси на тысячи микрокапель.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для анализа nanoString иммунопреципитированную РНК анализировали с использованием пользовательского набора кодов (Таблица S3) и системы анализа nCounter в соответствии с инструкциями производителя. Для анализа RNA-seq образцы тотальной РНК были переданы в компанию Plasmidsaurus, Inc. для секвенирования РНК. Для каждого образца анализировали три биологических повторности. Библиотеки подготавливали после отбора по поли(A) с использованием подхода подсчета с 3'-конца и секвенировали на приборе Illumina с получением одноконцевых ридов длиной около ~90 п.н. Данные секвенирования обрабатывались компанией Plasmidsaurus с использованием их стандартного конвейера, включающего фильтрацию качества ридов, выравнивание на референсный геном, дедупликацию на основе UMI и количественную оценку на уровне генов.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица S3.&lt;/strong&gt; Целевые объекты набора кодов nanoString и исходные данные для рис. 2C-F&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Название мишени&lt;/th&gt;\n&lt;th&gt;Номер доступа&lt;/th&gt;\n&lt;th&gt;nTPM (экспрессия в MDA-MB-231)&lt;/th&gt;\n&lt;th&gt;Примечания&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;G-rich RNA sequence binding factor 1 (GRSF1)&lt;/td&gt;\n&lt;td&gt;XM011531897.4&lt;/td&gt;\n&lt;td&gt;116.6&lt;/td&gt;\n&lt;td&gt;Потенциальная нецелевая мишень человеческого NET1-1067&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;FTO alpha-ketoglutarate dependent dioxygenase (FTO)&lt;/td&gt;\n&lt;td&gt;_ XM024450437.2&lt;/td&gt;\n&lt;td&gt;16.6&lt;/td&gt;\n&lt;td&gt;Потенциальная нецелевая мишень человеческого NET1-1067 (сайт нецелевого связывания найден только в определенных изоформах)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tumor Supressor Candidate 3 (TUSC3)&lt;/td&gt;\n&lt;td&gt;_ NM001413682.1&lt;/td&gt;\n&lt;td&gt;47.3&lt;/td&gt;\n&lt;td&gt;Потенциальная нецелевая мишень человеческого NET1-921&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;SIN3 transccription regulator family member A (SIN3A)&lt;/td&gt;\n&lt;td&gt;_ XM047432359.1&lt;/td&gt;\n&lt;td&gt;24&lt;/td&gt;\n&lt;td&gt;Потенциальная нецелевая мишень человеческого NET1-921 (сайт нецелевого связывания найден только в определенных изоформах)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;VPS8 subunit of CORVET complex (VPS8)&lt;/td&gt;\n&lt;td&gt;_ XM047447828.1&lt;/td&gt;\n&lt;td&gt;8.4&lt;/td&gt;\n&lt;td&gt;Потенциальная нецелевая мишень человеческого NET1-1351&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Serratem RNA effector molecule (SRRT)&lt;/td&gt;\n&lt;td&gt;_ NM001128853.2&lt;/td&gt;\n&lt;td&gt;120&lt;/td&gt;\n&lt;td&gt;Потенциальная нецелевая мишень человеческого RAB13-191&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Calponin 3 (CNN3)&lt;/td&gt;\n&lt;td&gt;_ XM047444480.1&lt;/td&gt;\n&lt;td&gt;48.1&lt;/td&gt;\n&lt;td&gt;Потенциальная нецелевая мишень человеческого RAB13-191 (сайт нецелевого связывания найден только в определенных изоформах)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;WD repeat and HMG-box DNA binding protein 1 (WDHD1)&lt;/td&gt;\n&lt;td&gt;_ NM001008396.3&lt;/td&gt;\n&lt;td&gt;42.6&lt;/td&gt;\n&lt;td&gt;Потенциальная нецелевая мишень человеческого RAB13-191&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;F-box Protein 32 (FBXO32)&lt;/td&gt;\n&lt;td&gt;_ NM148177.3&lt;/td&gt;\n&lt;td&gt;5.2&lt;/td&gt;\n&lt;td&gt;Потенциальная нецелевая мишень человеческого RAB13-230&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;MTHFD2&lt;/td&gt;\n&lt;td&gt;_ NM001410192.1&lt;/td&gt;\n&lt;t
