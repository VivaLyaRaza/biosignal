d&gt;51.5&lt;/td&gt;\n&lt;td&gt;Потенциальная нецелевая мишень человеческого RAB13-360&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;KIF1C&lt;/td&gt;\n&lt;td&gt;_ NM006612.6&lt;/td&gt;\n&lt;td&gt;83&lt;/td&gt;\n&lt;td&gt;Потенциальная нецелевая мишень человеческого RAB13-360&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;S100 Calcium binding Protein A13 (S100A13)&lt;/td&gt;\n&lt;td&gt;_ XM005245434.4&lt;/td&gt;\n&lt;td&gt;289&lt;/td&gt;\n&lt;td&gt;Потенциальная нецелевая мишень человеческого RAB13-360 (сайт нецелевого связывания найден только в определенных изоформах)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Leucine Rich repeat containing 8 VRAC subunit D (LRRC8D)&lt;/td&gt;\n&lt;td&gt;_ XM047423961.1&lt;/td&gt;\n&lt;td&gt;32.8&lt;/td&gt;\n&lt;td&gt;Потенциальная нецелевая мишень человеческого RAB13-360 (сайт нецелевого связывания найден только в определенных изоформах)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Histamine N-methyltransferase (HNMT)&lt;/td&gt;\n&lt;td&gt;_ NM001024075.3&lt;/td&gt;\n&lt;td&gt;25.6&lt;/td&gt;\n&lt;td&gt;Потенциальная нецелевая мишень NTC1&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;RPL18A&lt;/td&gt;\n&lt;td&gt;_ NM000980.4&lt;/td&gt;\n&lt;td&gt;1896.3&lt;/td&gt;\n&lt;td&gt;&amp;gt;33-кратное обогащение в IP Cas13d / обогащено в IP Cas13d на основе Zexu Li et al. Nat Biomed Eng 2023&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;COX8A&lt;/td&gt;\n&lt;td&gt;_ NM004074.3&lt;/td&gt;\n&lt;td&gt;1036.5&lt;/td&gt;\n&lt;td&gt;&amp;gt;33-кратное обогащение в IP Cas13d / обогащено в IP Cas13d на основе Zexu Li et al. Nat Biomed Eng 2023&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;ADRM1&lt;/td&gt;\n&lt;td&gt;_ NM001281437.1&lt;/td&gt;\n&lt;td&gt;322.5&lt;/td&gt;\n&lt;td&gt;&amp;gt;33-кратное обогащение в IP Cas13d / обогащено в IP Cas13d на основе Zexu Li et al. Nat Biomed Eng 2023&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;FKBP8&lt;/td&gt;\n&lt;td&gt;_ NM001308373.2&lt;/td&gt;\n&lt;td&gt;223.5&lt;/td&gt;\n&lt;td&gt;&amp;gt;33-кратное обогащение в IP Cas13d / обогащено в IP Cas13d на основе Zexu Li et al. Nat Biomed Eng 2023&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;EPN1&lt;/td&gt;\n&lt;td&gt;_ NM001130071.2&lt;/td&gt;\n&lt;td&gt;101.6&lt;/td&gt;\n&lt;td&gt;&amp;gt;33-кратное обогащение в IP Cas13d / обогащено в IP Cas13d на основе Zexu Li et al. Nat Biomed Eng 2023&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;SF3A2&lt;/td&gt;\n&lt;td&gt;_ NM007165.5&lt;/td&gt;\n&lt;td&gt;80.4&lt;/td&gt;\n&lt;td&gt;&amp;gt;33-кратное обогащение в IP Cas13d / обогащено в IP Cas13d на основе Zexu Li et al. Nat Biomed Eng 2023&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;NET1&lt;/td&gt;\n&lt;td&gt;NM_005863&lt;/td&gt;\n&lt;td&gt;75.9&lt;/td&gt;\n&lt;td&gt;РНК, содержащая GA / зависит от KIF1C&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;CYB5R3&lt;/td&gt;\n&lt;td&gt;NM_007326&lt;/td&gt;\n&lt;td&gt;171.1&lt;/td&gt;\n&lt;td&gt;РНК, содержащая GA / зависит от KIF1C&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;RAB13&lt;/td&gt;\n&lt;td&gt;NM_002870&lt;/td&gt;\n&lt;td&gt;141.3&lt;/td&gt;\n&lt;td&gt;РНК, содержащая GA / зависит от KIF1C&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;PKP4&lt;/td&gt;\n&lt;td&gt;NM_003628&lt;/td&gt;\n&lt;td&gt;31.2&lt;/td&gt;\n&lt;td&gt;РНК, содержащая GA / зависит от KIF1C&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;DYNLL2&lt;/td&gt;\n&lt;td&gt;NM_080677&lt;/td&gt;\n&lt;td&gt;41.2&lt;/td&gt;\n&lt;td&gt;РНК, содержащая GA / зависит от KIF1C&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;ACTB&lt;/td&gt;\n&lt;td&gt;NM_001101&lt;/td&gt;\n&lt;td&gt;5394&lt;/td&gt;\n&lt;td&gt;Высокоэкспрессируемый домашний ген&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;RPS20&lt;/td&gt;\n&lt;td&gt;NM_001023&lt;/td&gt;\n&lt;td&gt;1441.5&lt;/td&gt;\n&lt;td&gt;Высокоэкспрессируемый домашний ген&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;GFP&lt;/td&gt;\n&lt;td&gt;U76561&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h4 id=\"severnyj-blotting\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#severnyj-blotting\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Северный блоттинг&lt;/span&gt;&lt;/a&gt;Северный блоттинг&lt;/h4&gt;\n&lt;p&gt;Термически денатурированную тотальную клеточную РНК подвергали электрофорезу в 10% мочевино-полиакриламидном геле с последующим полусухим переносом на положительно заряженную нейлоновую мембрану (Cytiva; RPN119B) в течение 45 мин при 400 мА. Затем мембрану высушивали, подвергали УФ-сшивке и прегибридизовали с буфером для гибридизации олигонуклеотидов Oligo Hybridization Buffer (ThermoFisher; AM8663) при температуре 30^°C в течение 60 мин. Меченные 5’-концевым флуорофором IRDye зонды (IDT) против U6 snRNA и NET1 gRNA гибридизовали при температуре 30^°C в течение ночи. Использовали пул из двух разных зондов для NET1 gRNA, разработанных либо против области спейсера, либо против области прямого повтора. После последовательных отмывок в буфере 2xSSC/0.1% SDS и буфере 1xSSC/0.1% SDS блоты проявляли с использованием флуоресцентного сканера Odyssey (Li-Cor).&lt;/p&gt;\n&lt;h4 id=\"poluchenie-i-ochistka-belka\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#poluchenie-i-ochistka-belka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Получение и очистка белка&lt;/span&gt;&lt;/a&gt;Получение и очистка белка&lt;/h4&gt;\n&lt;p&gt;Клетки Escherichia coli BL-21 (DE3) трансформировали плазмидой pET-32-TEV-HsCNBP, и отдельные колонии культивировали при температуре 37^°C в среде Луриа-Бертани (LB), дополненной 100 мкг/мл ампициллина и 0.3 мМ хлорида цинка. Культуры при OD600 нм ~ 0.5 индуцировали добавлением 0.5 мМ ИПТГ (IPTG) на ночь при температуре 18^°C. Клетки собирали центрифугированием, и осадок ресуспендировали в лизирующем буфере (50 мМ Трис-HCl, pH  7.5; 300 мМ NaCl; 10 мМ имидазола; 10 мМ β-меркаптоэтанола; 10% глицерина и 1% коктейля ингибиторов протеаз). Клетки лизировали с использованием микрофлюидизатора, и лизат осветляли центрифугированием при 19 000 об/мин в течение 30 мин при температуре 4^°C, получая растворимые белки в супернатанте.&lt;/p&gt;\n&lt;p&gt;Рекомбинантный человеческий CNBP очищали, как описано в [32], с небольшими модификациями. Кратко, супернатант, экспрессирующий Trx-His6-TEV-CNBP, сначала пропускали через фильтр 0.5 мкм, и фильтрат, содержащий рекомбинантный белок, медленно наносили на хроматографическую колонку с Ni-NTA, предварительно уравновешенную буфером А (50 мМ Трис-HCl, pH  7.5; 300 мМ NaCl; 30 мМ имидазола; 10% глицерина и 10 мМ β-меркаптоэтанола). Колонку промывали 5 объемами колонки 6% буфера Б (50 мМ Трис-HCl, pH  7.5; 300 мМ NaCl; 500 мМ имидазола; 10% глицерина и 10 мМ β-меркаптоэтанола) в буфере А, а затем 8% буфера Б в буфере А. В конечном итоге белок элюировали 100% буфером Б. Фракции, обогащенные белком, определяли по пику хроматограммы и подтверждали окрашиванием кумасси гелей SDS-PAGE. Эти фракции объединяли, расщепляли с помощью TEV-протеазы и диализовали на ночь в диализном буфере А (50 мМ Трис-HCl, pH  7.5; 300 мМ NaCl; 1 мМ ДТТ и 0.1 мМ ZnCl₂). Расщепленный диализованный продукт инкубировали в режиме бьюти-связывания с агарозной смолой Ni-NTA в течение 3 ч при температуре 4^°C при вращении. Собирали поток (не связавшуюся фракцию), содержащий расщепленный CNBP без метки.&lt;/p&gt;\n&lt;p&gt;Для получения свободного от нуклеиновых кислот CNBP собранный выше CNBP дополнительно диализовали в диализном буфере II (50 мМ Трис-HCl, pH  6.5; 10% глицерина и 5 мкМ ZnCl₂), фильтровали через мембрану 0.5 мкм и медленно наносили на хроматографическую колонку с Q-Sepharose, уравновешенную буфером С (50 мМ Трис-HCl, pH  6.5; 10% глицерина и 5 мкМ ZnCl₂). Ступенчатое элюирование белка проводили с использованием 100 мМ, 200 мМ и 500 мМ NaCl в буфере С. Все этапы очистки выполняли при температуре 4^°C.&lt;/p&gt;\n&lt;h4 id=\"in-vittro-transkripciya-i-vydelenie-rnk\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#in-vittro-transkripciya-i-vydelenie-rnk\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ин-виттро транскрипция и выделение РНК&lt;/span&gt;&lt;/a&gt;Ин-виттро транскрипция и выделение РНК&lt;/h4&gt;\n&lt;p&gt;Ин-виттро транскрипцию выполняли, как описано в [26]. Кратко, линеаризованные плазмидные матрицы, содержащие последовательность RAB13-3’UTR-BoxB, транскрибировали in vitro (4 мкг на реакционную смесь объемом 50 мкл) с использованием T7 Polymerase HC (Promega; P2075) в оптимизированном для транскрипции буфере (Promega), дополненном 20 мМ ДТТ, 10 мМ MgCl₂, 4 мМ NTP, 40 ед./мкл RNasin Plus (Promega; N2615) и 1% Triton X-100. Реакционную смесь инкубировали в течение 3.5 ч при температуре 37^°C. После реакции транскрибированную in vitro РНК выделяли с использованием набора Zymo total RNA clean and concentrator kit (R1014). Для удаления плазмидной матрицы из транскрибированной in vitro РНК проводили обработку ДНКазой на колонке.&lt;/p&gt;\n&lt;h4 id=\"in-vitro-svyazyvanie-rnk-s-rbp\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#in-vitro-svyazyvanie-rnk-s-rbp\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;In vitro связывание РНК с РБП&lt;/span&gt;&lt;/a&gt;In vitro связывание РНК с РБП&lt;/h4&gt;\n&lt;p&gt;Для очистки комплекса dCas13-B2-EGFP-3xFLAG/sgRNA изначально проводили иммунопреципитацию dCas13-B2-EGFP-3xFLAG с использованием магнитных агарозных бусин с анти-FLAG (ThermoFisher; A36798), как описано ранее, из лизатов клеток HEK 293LT, временно экспрессирующих этот белок. Связанный белок затем инкубировали с молярным избытком синтетической gRNA — либо контрольной немишени (NTC2), либо RAB13191/230 — в течение 15 мин при комнатной температуре при встряхивании. Впоследствии бусины промывали 5 раз лизисным буфером для удаления несвязанной gRNA, а элюцию проводили с помощью 50 мкг FLAG-пептида (ThermoFisher; A36806) в течение 15 мин при встряхивании при комнатной температуре для получения комплекса dCas13-B2-EGFP-3xFLAG/sgRNA.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Иммунопреципитация и аффинная очистка позволяют выделить конкретные белковые комплексы или РНК-белковые комплексы из сложных клеточных лизатов для дальнейшего анализа их взаимодействия in vitro.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для связывания РНК с РБП 850 нг транскрибированной in vitro РНК инкубировали с 10 мкг очищенного белка λN-GST в течение 15 мин при комнатной температуре. Затем комплекс инкубировали с 15 мкл глутатионовых магнитных бусин (Invitrogen; 78602) в течение 20 мин при комнатной температуре при встряхивании. Связанный комплекс РНК — белок λN-GST промывали лизисным буфером (50 мМ Tris-Cl pH 7.5, 0.5% Triton X-100, 100 мМ NaCl, 2.5 мМ MgCl₂) и блокировали лизисным буфером, содержащим тРНК E. coli, БСА (Sigma; 10711454001), ДНК спермы лосося (Invitrogen; 15632011) и гликоген (Invitrogen; AM9510), в течение 30–60 мин при 4 °C. Затем комплекс инкубировали с рекомбинантным CNBP и комплексом dCas13-B2-EGFP-3xFLAG/sgRNA в течение 1 ч при 4 °C при встряхивании. Бусины промывали лизисным буфером, затем буфером PBS (pH 8.0) и проводили элюцию 50 мкл 40 мМ восстановленного L-глутатиона в PBS (pH 8.0). Элюат анализировали с помощью вестерн-блоттинга для оценки количества CNBP и dCas13-B2-EGFP-3xFLAG, связавшихся с РНК RAB13-3'UTR-BoxB.&lt;/p&gt;\n&lt;h4 id=\"vestern-blotting\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#vestern-blotting\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вестерн-блоттинг&lt;/span&gt;&lt;/a&gt;Вестерн-блоттинг&lt;/h4&gt;\n&lt;p&gt;Для вестерн-блоттинга использовали следующие первичные антитела: кроличьи анти-FLAG (1:2000; Cell Signaling Technology; A303-138A), кроличьи анти-GFP (1:3000; Abcam; ab11122), мышиные анти-α-тубулин (1:3000; Sigma; T6199), мышиные анти-CNBP (1:3000; Proteintech; 67109), фосфо-eIF2α (1:1000; Cell Signaling Technology; #9721S), eIF2α (1:1000; Cell Signaling Technology; #9722S). Вторичные антитела ослиные против кролика (800CW; 926-32213) и ослиные против мыши (680RD; 926-68072) от Li-Cor использовали в разведении 1:10 000. Мембраны сканировали на флуоресцентном сканере Odyssey (Li-Cor), а полосы количественно оценивали с помощью ImageStudioLite (Li-Cor).&lt;/p&gt;\n&lt;h4 id=\"analiz-rosta-kletok\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#analiz-rosta-kletok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ роста клеток&lt;/span&gt;&lt;/a&gt;Анализ роста клеток&lt;/h4&gt;\n&lt;p&gt;Пролиферацию клеток отслеживали с помощью системы анализа живых клеток Incucyte (Sartorius). Клетки высевали с равной плотностью и фотографировали через регулярные интервалы времени в стандартных условиях культивирования клеток. Рост клеток количественно оценивали по фазово-контрастным изображениям путем измерения степени слияния клеток во времени с использованием программного обеспечения для анализа Incucyte.&lt;/p&gt;\n&lt;h4 id=\"analiz-formirovaniya-i-prorastaniya-sferoidov\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#analiz-formirovaniya-i-prorastaniya-sferoidov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ формирования и прорастания сфероидов&lt;/span&gt;&lt;/a&gt;Анализ формирования и прорастания сфероидов&lt;/h4&gt;\n&lt;p&gt;Для формирования сфероидов суспензию одиночных клеток в количестве 0.2 × 10⁴ смешивали с Matrigel (Corning, кат. № 354234) и наносили в виде капли объемом 30 мкл на покровное стекло с лунками, предварительно покрытое Matrigel. После инкубации в течение 30 мин при 37 °C добавляли среду L15 с добавлением 10% FBS и 1% пенициллина-стрептомицина. Одиночным погруженным клеткам давали расти в течение 8–9 дней для формирования сфероидов. Для индукции инвазии сфероиды, погруженные в Matrigel, аккуратно промывали PBS, после чего добавляли среду с низким содержанием сыворотки (0.1% FBS) и инкубировали ночь. Для визуализации сфероиды окрашивали 5 мкМ красителем кальцеин (Thermo Fischer Scientific, кат. № C3100MP) и 5 мкМ DRAQ5 (Novus Biologicals, кат. № NBP2-81125) в PBS в течение 20 мин при 37 °C. Затем сфероиды фиксировали 4% PFA в PBS в течение 15 мин и получали изображения на инвертированном конфокальном микроскопе Leica SP8 с использованием сухого объектива 10x. Z-стеки изображений получали по всему объему сфероида. Общий объем ядра на один сфероид на основе окрашивания DRAQ5 измеряли с помощью Imaris (Oxford Instruments). Для оценки инвазивности сфероидов использовали проекции максимальной интенсивности Z-стеков и рассчитывали значение сложности, определяемое как Сложность = Периметр² / (4π × Площадь).&lt;/p&gt;\n&lt;h4 id=\"model-kolonizacii-legkih\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#model-kolonizacii-legkih\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модель колонизации легких&lt;/span&gt;&lt;/a&gt;Модель колонизации легких&lt;/h4&gt;\n&lt;p&gt;Исследования на мышах проводились в соответствии с утвержденными протоколами Комитета по уходу и использованию лабораторных животных Национального института рака (NIH Intramural Animal Care and Use Committee). Мыши NOD scid gamma были приобретены в Jackson Laboratory (Штамм №: 005557). Использовались только самки мышей для соответствия полу клеток рака молочной железы MDA-MB-231. Мышам в возрасте 12.7 недель вводили внутривенно в хвостовую вену соответствующую клеточную линию в количестве 5 × 10⁵ клеток в 100 мкл PBS на мышь. Через 5 недель после инъекции легкие извлекали, перфузировали и фиксировали Z-Fix. Для гистологического анализа ткани заключали в парафин, а затем нарезали (3 мкм) для окрашивания иммунофлуоресценцией или гематоксилином и эозином (H&amp;amp;E). Кратко: парафиновые срезы выпекали в течение 30 минут при 60 °C, а затем депарафинировали с использованием SafeClear II (Fisher Scientific) и этанола. Регидратированные срезы использовали для демаскировки антигенов с использованием буфера для демаскировки мишеней RNAscope (ACD; 322001) при 60 °C ночлегом. После трехкратной промывки по 2 мин в PBST среды инкубировали ночлегом при 4 °C с кроличьими анти-GFP антителами (1:400; Invitrogen; A-11122), разведенными в 3% БСА в PBS. После трехкратной промывки по 2 мин в PBST образцы инкубировали с ослиными антителами против кролика с флуорофором Alexa (1:500; Invitrogen; A-31573), конъюгатом агглютинина зародышей пшеницы с Alexa fluor 488 (Invitrogen; W11261; 10 мкг/мл) и DAPI в течение 2 ч при комнатной температуре. После промывки образцы заключали в Prolong gold перед визуализацией. Соответствие GFP-положительных областей опухолевой ткани подтверждалось окрашиванием H&amp;amp;E соседних срезов.&lt;/p&gt;\n&lt;p&gt;Гистологические срезы сканировали с помощью цифрового сканера слайдов NanoZoomer Digital Slide Scanner (Hamamatsu) или Axioscan.Z1 (Carl Zeiss). Соседние срезы сканировали целиком с использованием объектива Plan-Apochromat 20x (NA = 0.8; Carl Zeiss) и импортировали в цифровую патологическую платформу HALO (Indica Labs). Классификатор MiniNet обучали на вручную аннотированных участках для различения очагов GFP+ и нормальной ткани на множестве срезов. Опухолевую нагрузку рассчитывали как отношение площади ткани GFP+ к площади нормальной ткани для каждого животного в отдельности. Опухолевую нагрузку и интенсивность сигнала GFP усредняли между соседними тканевыми срезами для каждого животного с целью компенсации вариабельности при изготовлении срезов или окрашивании.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Классификатор MiniNet — это алгоритм компьютерного зрения на основе сверточной нейросети, который автоматизирует поиск и сегментацию опухолевых очагов по их флуоресцентной метке.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"statistika-i-vosproizvodimost\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#statistika-i-vosproizvodimost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистика и воспроизводимость&lt;/span&gt;&lt;/a&gt;Статистика и воспроизводимость&lt;/h4&gt;\n&lt;p&gt;Данные представлены в виде среднего значения ± стандартная ошибка среднего (SEM). На рис. 4E и 5B представлены данные, преобразованные в натуральные логарифмы. Для статистических сравнений использовали параметрические тесты с целью оценки значимых различий в нормально распределенных гомоскедастичных наборах данных. Если хотя бы одно из этих допущений не выполнялось, вместо этого применяли непараметрические тесты, подходящие для данного распределения данных. Конкретные статистические тесты для каждого эксперимента описаны в подписях к рисункам, а значения p рассчитывали с помощью пакета программ Prism (GraphPad; версия 10.6.1).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte-fS3.jpg\" alt=\"Рис. S3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte-fS8.jpg\" alt=\"Рис. S8\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S8&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte-fS9.jpg\" alt=\"Рис. S9\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S9&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сложность&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;контроля&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;транспорта&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мРНК&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;применение&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;системы dCas13&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M388 110h18
