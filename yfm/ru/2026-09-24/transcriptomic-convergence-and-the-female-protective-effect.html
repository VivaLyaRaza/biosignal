вала последовательность прямого повтора (DR36) CasRx: CAAGTAAACCCCTACCAACTGGTCGGGGTTTGAAAC. Тандемные пре-gRNA-матриксы процессируются белком CasRx в отдельные gRNA для проведения KD. Полные последовательности приведены в Дополнительной таблице.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нокдаун (KD) и gRNA — это снижение экспрессии конкретных генов с помощью РНК-гидов (gRNA), которые наводят ферменты на нужную матричную РНК для её разрушения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"molekulyarnoe-klonirovanie\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#molekulyarnoe-klonirovanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Молекулярное клонирование&lt;/span&gt;&lt;/a&gt;Молекулярное клонирование&lt;/h4&gt;\n&lt;p&gt;Для создания конструкций для начальных экспериментов по нокдауну в нервных стволовых клетках (НСК) в качестве остова использовалась лентивирусная плазмида pSicoR (Addgene #11579). Мышиный промотор U6 был заменен на человеческий промотор U6, который использовался для управления экспрессией матриц gRNA CasRx. Эти конструкции применялись в комбинации с инсерционной клеточной линией (нокаут/нокин) CasRx (описано ниже). Чтобы получить достаточное количество НСК для валидации нокдауна с помощью CasRx посредством автоматизированного вестерн-блоттинга (описано ниже), была создана универсальная конструкция (all-in-one), содержащая CasRx и EGFP, экспрессируемые с промоторного элемента CAG, и матрицы gRNA, экспрессируемые с человеческого промотора U6. Остов также содержал инвертированные концевые повторы (ITR), позволяющие интегрировать конструкцию в геном с помощью транспозазы piggyBac. Данные конструкции основывались на дизайне LiOn (Addgene #154019), так что экспрессия CasRx и EGFP зависела от рекомбинации конструкции транспозазой piggyBac, предотвращая экспрессию с эписомальной плазмиды. Эта универсальная конструкция также использовалась для анализов нокдауна флуорофоров и пролиферации НСК. Для экспрессии флуорофоров в НСК были созданы конструкции на основе iOn с mKO2, mScarlet или iRFP670 под управлением промоторного элемента CAG. Для нокдауна на основе shRNA дизайн shRNA выполнялся с использованием инструмента Horizon siDesign Center (https://horizondiscovery.com/en/ordering-and-calculation-tools/sidesign-center). Выбирались предсказанные shRNA, начинающиеся с G, а варианты с потенциальными внецелевыми взаимодействиями выявлялись с помощью BLAST и исключались. Отобранные shRNA (Дополнительная таблица 13) клонировались в плазмиду pSicoR (Addgene #11579). Для экспериментов с органоидами мы создали индуцибельную конструкцию CRISPR-нокдауна на основе FLEx (FLICK), спроектировав несколько особенностей в остов, включающий дизайн FLEx. В частности, мы включили модифицированную рекомбиназу Cre, содержащую интрон, что предотвращает рекомбинацию плазмиды во время клонирования. Мы также включили CasRx17, а также все необходимые компоненты системы Tet-On 3G для обеспечения индуцируемой доксициклином рекомбинации. Более того, мы включили идентифицирующие последовательности штрихкодов непосредственно перед сайтами polyA для флуоресцентных репортеров, что позволило определить, какая конструкция нокдауна была встроена в каждую клетку, с помощью секвенирования РНК единичных клеток (scRNA-seq). Наконец, мы включили ITR, позволяющие интегрировать конструкцию в геном с помощью транспозазы piggyBac. Последовательности всех конструкций были верифицированы путем полноплазмидного секвенирования (Plasmidsaurus).&lt;/p&gt;\n&lt;h4 id=\"kletochnaya-kultura\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#kletochnaya-kultura\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Клеточная культура&lt;/span&gt;&lt;/a&gt;Клеточная культура&lt;/h4&gt;\n&lt;p&gt;Вся работа с культурами клеток человека выполнялась в соответствии с протоколами, одобренными IRB Детской больницы Бостона № S07-02-0087. Контрольная линия мужских индуцированных плюрипотентных стволовых клеток (иПСК) человека «280» была получена ранее и полностью охарактеризована. ИПСК человека и происходящие из иПСК НСК выращивались на культуральных планшетах, предварительно покрытых Matrigel (Corning #354277) или Geltrex (ThermoFisher #A1413302). Клетки пассировались по мере необходимости с использованием Accutase (Millipore Sigma #SCR005) или ReleSR (StemCell Technologies #100-0483). ИПСК человека культивировались в среде mTeSR™ Plus (StemCell Technologies #100-0276). НСК человека были получены из иПСК с помощью набора STEMdiff™ SMADi Neural Induction Kit (StemCell Technologies #08582) в соответствии с протоколом монослойного культивирования в течение как минимум трех недель. НСК непрерывно выращивались в среде Neural Induction Medium + SMADi и не переводились на среду для нейральных предшественников. Среда дополнялась 10 мкM Y-27632 (StemCell Technologies #72304) в течение примерно 1 дня после пассирования иПСК или НСК. Церебральные органоиды были получены из 280-иПСК с использованием набора STEMdiff™ Cerebral Organoid Kit (StemCell Technologies #08570) с некоторыми рекомендациями Giandomenico et al. (2021), а также дополнительными модификациями. В частности, органоиды были имплантированы в Matrigel (Corning #354277) на 7-й день и выращивались в среде Expansion Medium до 14-го дня, после чего их извлекали из Matrigel и переводили на среду Maturation Medium на орбитальном шейкере. Полные сведения о протоколах см. наprotocols.io: https://dx.doi.org/10.17504/protocols.io.x54v95p5ql3e/v1. Ни одна из клеточных линий не проходила аутентификацию. Все клеточные линии регулярно проверялись на отсутствие контаминации микоплазмой.&lt;/p&gt;\n&lt;h4 id=\"poluchenie-ipsk-s-nokinom-casrx\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#poluchenie-ipsk-s-nokinom-casrx\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Получение иПСК с нокином CasRx&lt;/span&gt;&lt;/a&gt;Получение иПСК с нокином CasRx&lt;/h4&gt;\n&lt;p&gt;CasRx17 был инсертирован (нокин) в безопасный локус AAVS1 иПСК линии «280» с использованием описанных ранее таргетных конструкций. Отдельные колонии иПСК отбирались и размножались. Анализ методом Саузерн-блоттинга был выполнен компанией Celplor для подтверждения правильного нацеливания на локус AAVS1. Анализ кариотипа проводился с использованием KaryoStat (ThermoFisher), который выявил прирост 2,4 млн п.н. (2,4 Мб) на хромосоме 1, описываемый в номенклатуре микроматриц как arr[GRCh37] 1q32.1(204108163_206539638)x3. Эта область не содержала ни одного из целевых генов.&lt;/p&gt;\n&lt;h4 id=\"lentivirus\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#lentivirus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Лентивирус&lt;/span&gt;&lt;/a&gt;Лентивирус&lt;/h4&gt;\n&lt;p&gt;Лентивирус был получен с использованием стандартных протоколов, описанных ранее. Лентивирусы применялись с множественностью заражения (MOI), равной 4,0, так как такая MOI обеспечивает &amp;gt;98% трансдуцированных клеток. РНК экстрагировали 24 часа спустя.&lt;/p&gt;\n&lt;h4 id=\"podgotovka-bibliotek-dlya-sekvenirovaniya-rnk-rna-seq\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#podgotovka-bibliotek-dlya-sekvenirovaniya-rnk-rna-seq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подготовка библиотек для секвенирования РНК (RNA-Seq)&lt;/span&gt;&lt;/a&gt;Подготовка библиотек для секвенирования РНК (RNA-Seq)&lt;/h4&gt;\n&lt;p&gt;Тотальная РНК была выделена с использованием набора Direct-zol RNA Microprep Kit (Zymo Research, #R2062), а библиотеки 3’-RNA-seq были приготовлены по модифицированному протоколу TagSeq с использованием рекомендаций и стратегий пулирования из протокола CheapSeq. Кратко: 200 нг тотальной РНК из каждого образца смешивали с индексированным праймером oligo(dT) и буфером (от NEB, #M0466L), как описано для CheapSeq. РНК фрагментировали в предварительно прогретом амплификаторе при 94 °C в течение 2,5 мин без крышки, после чего образцы немедленно переносили на лед. Затем каждый образец смешивали с олигонуклеотидом с переключением матриц (TSO), содержащим индекс и уникальный молекулярный идентификатор (UMI), а также с дополнительными реагентами, необходимыми для обратной транскрипции, как описано для CheapSeq. Реакцию обратной транскрипции проводили при 42 °C в течение 90 минут без тепловой инактивации. Оставшуюся одноцепочечную РНК и олигонуклеотиды затем расщепляли путем добавления 0,5 мкл буфера EB (Qiagen, #19086), 0,5 мкл термолабильной экзонуклеазы ExoI (NEB, #M0568S) и 0,25 мкл РНКазы A (ThermoFisher, #EN0531) с инкубацией образцов при 37 °C в течение 30 мин с последующей тепловой инактивацией при 85 °C в течение 5 мин и выдерживанием при 4 °C. До 8 образцов с различными последовательностями индексов затем пулировали, а кДНК очищали путем проведения 1,4-кратной левосторонней SPRI-селекции (Beckman Coulter, #B23317).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;SPRI-селекция — это метод очистки ДНК с помощью магнитных частиц, позволяющий отбирать фрагменты нужного размера.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Затем использовали смесь Q5 UltraII Mastermix (NEB, #M0544L) вместе с частичными праймерами Read1 и Read2 для амплификации кДНК в течение 7 циклов с использованием амплификатора C1000 Touch Thermal Cycler (Bio-Rad, #1851197) в соответствии с параметрами «CheapSeq PCR», описанными ниже. Амплифицированную кДНК очищали посредством 0,7-кратной левосторонней SPRI-селекции (Beckman Coulter, #B23317). Финальную сборку библиотек выполняли с использованием смеси Q5 UltraII Mastermix (NEB, #M0544L) со стандартными праймерами индексации TruSeq (NEB, #E6440S) и амплифицировали в течение 8 циклов в соответствии с параметрами «CheapSeq PCR», описанными ниже. Библиотеки очищали путем проведения 0,4–0,65-кратной двусторонней SPRI-селекции (Beckman Coulter, #B23317). Очищенные библиотеки оценивали с помощью прибора Tapestation HSD1000 (Agilent, #5067-5584 и #5067-5585). Последовательности олигонуклеотидов см. в Дополнительной таблице 14. ПЦР CheapSeq: 1. 98 °C в течение 30 с; 2. X циклов: 98 °C в течение 10 с, 65 °C в течение 75 с; 3. 65 °C в течение 5 мин; 4. 4 °C бесконечно.&lt;/p&gt;\n&lt;h4 id=\"analiz-differencialno-ekspressiruemyh-genov-deg-na-osnove-obuemnogo-sekvenirovaniya-rnk-kletok-npc-s-nokdaunom-s-pomoshyu-casrx\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#analiz-differencialno-ekspressiruemyh-genov-deg-na-osnove-obuemnogo-sekvenirovaniya-rnk-kletok-npc-s-nokdaunom-s-pomoshyu-casrx\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ дифференциально экспрессируемых генов (DEG) на основе объемного секвенирования РНК клеток NPC с нокдауном с помощью CasRx&lt;/span&gt;&lt;/a&gt;Анализ дифференциально экспрессируемых генов (DEG) на основе объемного секвенирования РНК клеток NPC с нокдауном с помощью CasRx&lt;/h4&gt;\n&lt;p&gt;Для каждого условия анализировали три независимых образца клеток NPC. Индивидуальные условия нокдауна сравнивали с тремя условиями с нетрансцевыми контролями (NTC), которые рассматривались вместе как набор из 9 контрольных образцов. Экспрессию генов количественно оценивали с помощью alevin-fry с дедупликацией UMI (salmon-v1.9). Индекс salmon и карту транскриптов в гены создавали с использованием Gencode v45. Значения экспрессии для различных транскриптов, картированных на один и тот же ген, суммировались. Для дальнейшего анализа рассматривались только гены со средним базовым значением экспрессии baseMean &amp;gt; 10 в образцах NTC. Анализ дифференциальной экспрессии проводили с использованием DESeq2 (v1.42.0) с моделью ~Batch + sgRNA. Для подтверждения нокдауна p-значения скорректированы с использованием поправки Бенджамини — Хохберга для множественной проверки гипотез для набора из 20 непосредственно целевых генов. Исходное p-значение для SRCAP было получено с помощью капельной цифровой ПЦР (см. ниже), поскольку SRCAP был исключен из анализа RNA-seq из-за низкой экспрессии. См.&lt;/p&gt;\n&lt;h4 id=\"kapelnaya-cifrovaya-pcr-ddpcr\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#kapelnaya-cifrovaya-pcr-ddpcr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Капельная цифровая ПЦР (ddPCR)&lt;/span&gt;&lt;/a&gt;Капельная цифровая ПЦР (ddPCR)&lt;/h4&gt;\n&lt;p&gt;Для подтверждения нокдауна SRCAP, исключенного из анализа RNA-seq из-за низкой экспрессии, те же образцы РНК, которые использовались для RNA-seq (см. выше), анализировали с помощью ddPCR. РНК сначала переводили в кДНК с использованием набора SuperScript™ IV VILO™ Master Mix (ThermoFisher Scientific, #11756050). Затем выполняли ddPCR, объединяя кДНК при концентрации, эквивалентной РНК 0,25 нг/мкл (5 нг на реакцию объемом 20 мкл), праймеры в конечной концентрации 0,1 мкм и супермикс QX200™ ddPCR™ EvaGreen Supermix (Bio-Rad, #1864033). Реакции ddPCR проводили с использованием системы капельной цифровой ПЦР QX200 AutoDG Droplet Digital PCR System (Bio-Rad). Уровни экспрессии нормализовали по экспрессии гена «домашнего хозяйства» HPRT1. Результаты анализировали с использованием модели Expr ~ Batch + type, где type представлял собой либо NTC, либо целевой ген (SRCAP). Полученное исходное p-значение было скорректировано вместе со значениями для других мишеней нокдауна (из RNA-seq, см. выше) с использованием поправки Бенджамини — Хохберга для множественной проверки гипотез для набора из 20 непосредственно целевых генов. См.&lt;/p&gt;\n&lt;h4 id=\"dizajn-prajmerov\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#dizajn-prajmerov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дизайн праймеров&lt;/span&gt;&lt;/a&gt;Дизайн праймеров&lt;/h4&gt;\n&lt;p&gt;Праймеры (Дополнительная таблица 15) были разработаны с использованием программы Primer-BLAST84, которая оценивает потенциальные нецелевые взаимодействия с помощью BLAST71. Олигонуклеотиды были заказаны в компаниях Azenta или IDT. Специфичность праймеров подтверждали Сэнгер-секвенированием продуктов ПЦР (Azenta).&lt;/p&gt;\n&lt;h4 id=\"avtomaticheskij-vestern-blotting\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#avtomaticheskij-vestern-blotting\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Автоматический вестерн-блоттинг&lt;/span&gt;&lt;/a&gt;Автоматический вестерн-блоттинг&lt;/h4&gt;\n&lt;p&gt;Для анализа уровней экспрессии белков после нокдауна с помощью CasRx конструкции для нокдауна на основе LiOn (см. «Молекулярное клонирование») вводили путем нуклеофекции в клетки 280-NPC вместе с плазмидой, экспрессирующей piggyBac-транспозазу (подробности см. в разделе «Нуклеофекция»). Четыре дня спустя EGFP+-клетки, экспрессирующие конструкции для нокдауна, собирали с помощью сортировки FACS (BD FACSymphony™ S6). Клетки осаждали центрифугированием и быстро замораживали в жидком азоте. Экстракция белков и автоматический вестерн-блоттинг выполнялись компанией RayBiotech с использованием следующих антител: Vinculin (R&amp;amp;D systems, MAB6896, клон 728526), разведение 1:25, и WAC (Abcam, AB109486), разведение 1:50.&lt;/p&gt;\n&lt;h4 id=\"nabory-genov\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#nabory-genov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Наборы генов&lt;/span&gt;&lt;/a&gt;Наборы генов&lt;/h4&gt;\n&lt;ol&gt;\n&lt;li&gt;Гены SFARI: все гены, включенные в базу данных генов SFARI14 (версия от 03.04.2025).&lt;/li&gt;\n&lt;li&gt;Гены SFARI с высокой степенью достоверности (HC-SFARI): гены SFARI с баллом 1.&lt;/li&gt;\n&lt;li&gt;Гены интеллектуальной инвалидности (ID): гены из базы данных SysNDD85 (дата обращения: 23.08.2025), которые:&lt;br /&gt;\na. были связаны с термином ID (HP:0001249, HP:0001256, HP:0002342, HP:0010864, HP:0002187);&lt;br /&gt;\nb. находились в категории «определенных» (definitive);&lt;br /&gt;\nc. не являлись генами SFARI.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"analizy-obogasheniya\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#analizy-obogasheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализы обогащения&lt;/span&gt;&lt;/a&gt;Анализы обогащения&lt;/h4&gt;\n&lt;p&gt;Анализы обогащения выполнялись с использованием односторонних точных тестов Фишера (fisher.test, базовый пакет R v4.3.1), а p-значения корректировались с помощью поправки Бенджамини — Хохберга для множественных гипотетических тестов (p.adjust, method = “BH”, базовый пакет R v4.3.1). При отображении в виде столбчатых диаграмм основные столбцы обозначают отношение шансов (OR) по результатам одностороннего точного теста Фишера; погрешности (усиления) указывают нижнюю границу 95%-го доверительного интервала для OR (верхняя граница для одностороннего теста не определяется).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Точный тест Фишера и поправка Бенджамини — Хохберга применяются для статистической оценки того, какие биологические функции или пути перепредставлены в наших данных, с защитой от ложноположительных результатов при множественных сравнениях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"nokdaun-fluoroforov\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#nokdaun-fluoroforov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нокдаун флуорофоров&lt;/span&gt;&lt;/a&gt;Нокдаун флуорофоров&lt;/h4&gt;\n&lt;p&gt;Конструкты, экспрессирующие флуорофоры (см. раздел «Молекулярное клонирование»), подвергались нуклеофекции в клетки 280-iPSC совместно с плазмидой, экспрессирующей транспозазу piggyBac (подробности см. в разделе «Нуклеофекция»). Клетки iPSC наращивались, после чего клетки, экспрессирующие все три флуорофора, выделялись методом FACS с использованием спектрального клеточного сортера Cytek Aurora CS. Отсортированные клетки iPSC дополнительно наращивались, а затем индуцировались в NPC (см. раздел «Клеточная культура»). Затем основанные на LiOn конструктивы CasRx KD подвергались нуклеофекции в эти NPC вместе с плазмидой, экспрессирующей транспозазу piggyBac. Четыре дня спустя клетки, экспрессирующие все четыре флуорофора (при этом EGFP указывал на экспрессию конструктивов KD), анализировались на интенсивность флуоресценции репортеров с помощью спектрального клеточного сортера Cytek Aurora CS. Для проверки значимых различий геометрической средней интенсивности флуоресценции (log2) между образцами и репортерами применялся обычный двуфакторный дисперсионный анализ (ANOVA) с тестом множественных сравнений Бонферрони.&lt;/p&gt;\n&lt;h4 id=\"nokdaun-s-pomoshyu-shrna\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#nokdaun-s-pomoshyu-shrna\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нокдаун с помощью shRNA&lt;/span&gt;&lt;/a&gt;Нокдаун с помощью shRNA&lt;/h4&gt;\n&lt;p&gt;Для каждой мишени конструкты на основе pSicoR с тремя различными shRNA объединялись в пул, а затем подвергались нуклеофекции в 280-NPC (подробности см. в разделе «Нуклеофекция» с описанными здесь модификациями). Поскольку данные конструкты не способны к транспозиции, плазмида, экспрессирующая транспозазу piggyBac73, была исключена, а вместо этого количество плазмиды на основе pSicoR было увеличено до суммарных 15 мкг. На следующий день после нуклеофекции клетки EGFP+, экспрессирующие конструкты, выделялись методом FACS (BD FACSymphony™ S6) и пересевались для восстановления в течение ночи. На следующий день собиралась РНК с использованием набора Zymo DNA/RNA Shield. 3’-RNA-seq выполнялся компанией Plasmidsaurus (сервис DGE RNA-Seq).&lt;/p&gt;\n&lt;h4 id=\"analiz-differencialno-ekspressiruemyh-genov-deg-dlya-polnotranskriptomnogo-rna-seq-iz-shrna-kd-npc\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#analiz-differencialno-ekspressiruemyh-genov-deg-dlya-polnotranskriptomnogo-rna-seq-iz-shrna-kd-npc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ дифференциально экспрессируемых генов (DEG) для полнотранскриптомного RNA-seq из shRNA-KD NPC&lt;/span&gt;&lt;/a&gt;Анализ дифференциально экспрессируемых генов (DEG) для полнотранскриптомного RNA-seq из shRNA-KD NPC&lt;/h4&gt;\n&lt;p&gt;Анализ дифференциальной экспрессии выполнялся с использованием того же аналитического конвейера, что и наши эксперименты с CasRx-KD: для анализа дифференциальной экспрессии использовался DESeq2 (v1.42.0) с моделью ~targetGene, причем дифференциальная экспрессия рассчитывалась относительно shRNA NTC (предназначенных для нацеливания на неэкспрессируемые транскрипты люциферазы и lacZ). Для полнотранскриптомных анализов p-значения корректировались с помощью поправки Бенджамини — Хохберга для множественных гипотетических тестов для набора из 14 601 гена с baseMean &amp;gt; 10 в клетках NTC. Дифференциально экспрессируемыми генами (DEG) считались те гены, которые демонстрировали дифференциальную экспрессию со скорректированным p-значением &amp;lt; 0.05.&lt;/p&gt;\n&lt;h4 id=\"analiz-dannyh-ekspressii-genov-iz-raboty-deneault-et-al-2018\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#analiz-dannyh-ekspressii-genov-iz-raboty-deneault-et-al-2018\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ данных экспрессии генов из работы Deneault et al. (2018)&lt;/span&gt;&lt;/a&gt;Анализ данных экспрессии генов из работы Deneault et al. (2018)&lt;/h4&gt;\n&lt;p&gt;Счетчики экспрессии генов из работы Deneault et al. (2018)20 были загружены из базы GEO (GSE107878). Анализ дифференциальной экспрессии выполнялся с использованием того же аналитического конвейера, что и наши эксперименты с CasRx-KD: для выполнения анализа дифференциальной экспрессии применялся DESeq2 (v1.42.0) с моделью expression ~ targeted gene. Дифференциально экспрессируемые гены (DEG) определялись относительно контрольных клеток как для нейронов, так и для индуцированных плюрипотентных стволовых клеток. В качестве потенциальных DEG рассматривались только гены со средней экспрессией гена выше 10 в контрольных образцах, а p-значения соответствующим образом корректировались с использованием поправки Бенджамини — Хохберга. DEG определялись как гены, которые дифференциально экспрессировались со скорректированным p-значением &amp;lt; 0.05.&lt;/p&gt;\n&lt;h4 id=\"perekrestnyj-analiz-obogasheniya\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#perekrestnyj-analiz-obogasheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Перекрестный анализ обогащения&lt;/span&gt;&lt;/a&gt;Перекрестный анализ обогащения&lt;/h4&gt;\n&lt;p&gt;Мы количественно оценили перекрытие между DEG, выявленными в: (1) наших экспериментах CasRx-KD в NPC, (2) наших экспериментах shRNA-KD в NPC, (3) KO iPSC из работы Deneault et al. (2018)20 и (4) KO ExN из работы Deneault et al. (2018)20. Для каждого попарного сравнения DEG анализы обогащения выполнялись с использованием односторонних точных тестов Фишера с универсумом генов, которые экспрессировались обоими рассматриваемыми типами образцов. P-значения корректировались с помощью поправки Бенджамини — Хохберга для множественных гипотетических тестов.&lt;/p&gt;\n&lt;h4 id=\"analiz-korrelyacii-ekspressii-s-genami-sfari\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#analiz-korrelyacii-ekspressii-s-genami-sfari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ корреляции экспрессии с генами SFARI&lt;/span&gt;&lt;/a&gt;Анализ корреляции экспрессии с генами SFARI&lt;/h4&gt;\n&lt;p&gt;Чтобы определить, имеет ли интересующий ген значимую коэкспрессию с генами SFARI в наших данных RNA-seq для NPC, мы рассчитали медианную корреляцию Пирсона между интересующим геном и каждым геном SFARI. Чтобы оценить, является ли эта степень корреляции значимой, мы создали эмпирическое нулевое распределение путем расчета медианной корреляции между интересующим геном и 1000 случайно выбранными наборами генов того же размера, что и набор генов SFARI, используя универсум генов, экспрессируемых в NPC (baseMean &amp;gt; 10 в NTC). Затем одностороннее эмпирическое p-значение рассчитывалось как доля нулевых значений, превышающих или равных наблюдаемой медианной корреляции. Регуляторы со значениями p &amp;lt; 0.05 считались имеющими значимую корреляцию с генами SFARI.&lt;/p&gt;\n&lt;h4 id=\"vyyavlenie-stabilno-snizhayushih-ekspressiyu-deg\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#vyyavlenie-stabilno-snizhayushih-ekspressiyu-deg\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Выявление стабильно снижающих экспрессию DEG&lt;/span&gt;&lt;/a&gt;Выявление стабильно снижающих экспрессию DEG&lt;/h4&gt;\n&lt;p&gt;Стабильно снижающими экспрессию DEG (downregulated DEGs) определялись гены, которые демонстрировали: 1) статистически значимое снижение экспрессии по меньшей мере в трех нокдаунах (KD) и 2) по меньшей мере 80% согласия в направлении значимой дифференциальной экспрессии во всех KD.&lt;/p&gt;\n&lt;h4 id=\"analiz-konservativnosti\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#analiz-konservativnosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ консервативности&lt;/span&gt;&lt;/a&gt;Анализ консервативности&lt;/h4&gt;\n&lt;p&gt;Оценки LOEUF (oe_lof_upper) были получены из gnomad v286 для оценки генной консервативности. Для каждого гена мы рассчитали оценку LOEUF на один ген, вычислив медиану значений LOEUF для каждого из транскриптов, связанных с данным геном. Хотя LOEUF представляет собой непрерывную метрику, мы использовали пороговое значение LOEUF &amp;lt; 0.35 в соответствии с рекомендациями для выявления высококонсервативных генов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метрика LOEUF оценивает допустимость инактивирующих мутаций у человека: более низкие значения указывают на сильное эволюционное давление против мутаций (высокую консервативность гена).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"dopolnitelnye-dannye-o-kandidatnyh-genah-riska-ras\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#dopolnitelnye-dannye-o-kandidatnyh-genah-riska-ras\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дополнительные данные о кандидатных генах риска РАС&lt;/span&gt;&lt;/a&gt;Дополнительные данные о кандидатных генах риска РАС&lt;/h4&gt;\n&lt;p&gt;Кандидатные гены риска РАС (Дополнительная таблица 8), идентифицированные в любом из следующих крупных секвенирующих исследований, были включены в Дополнительную таблицу 9: 1. Trost et al. (2022); 2. Zhou et al. (2022); 3. Wang et al. (2022); 4. Doan et al. (2019); 5. Rodin et al. (2021); 6. Wilfert et al. (2021). Дополнительные ссылки: 1. Alcantara et al. (2017); 2. Marcelis et al. (2024); 3. Ruiz-Reig et al. (2024); 4. McGhee et al. (2025).&lt;/p&gt;\n&lt;h4 id=\"nukleofekciya\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#nukleofekciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нуклеофекция&lt;/span&gt;&lt;/a&gt;Нуклеофекция&lt;/h4&gt;\n&lt;p&gt;Нуклеофекцию проводили с использованием системы транфекции Neon Transfection System (ThermoFisher Scientific). Для NPC 2 млн клеток подвергали нуклеофекции с 10 мкг плазмиды с возможностью транспозиции и 2 мкг плазмиды, экспрессирующей транспозазу piggyBac, используя наконечники на 100 мкл. Для iPSC 1 млн клеток подвергали нуклеофекции с 5 мкг плазмиды с возможностью транспозиции и 1 мкг плазмиды, экспрессирующей транспозазу piggyBac, используя наконечники на 100 мкл. Для нуклеофекции в малом масштабе использовались наконечники на 10 мкл, а количество клеток и плазмид уменьшалось пропорционально. Нуклеофекцию NPC выполняли со следующими параметрами: напряжение = 1600 В, длительность импульса = 10, количество импульсов = 3. Нуклеофекцию iPSC выполняли со следующими параметрами: напряжение = 950 В, длительность импульса = 30, количество импульсов = 2.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нуклеофекция — это разновидность электропорации, при которой электрические импульсы доставляют ДНК напрямую в ядро клетки, что особенно эффективно для труднотранфицируемых типов клеток, таких как стволовые.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"analizy-proliferacii-npc\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#analizy-proliferacii-npc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализы пролиферации NPC&lt;/span&gt;&lt;/a&gt;Анализы пролиферации NPC&lt;/h4&gt;\n&lt;p&gt;Конструкты нокдауна на основе LiOn (см. «Молекулярное клонирование») вводили путем нуклеофекции в NPC линии 280 вместе с плазмидой, экспрессирующей транспозазу piggyBac (подробности см. в разделе «Нуклеофекция»). Четыре дня спустя клетки обрабатывали в течение 20 минуткрасителем из набора для анализа пролиферации клеток CYTOTRACK™ Red 628/643 Cell Proliferation Assay Kit (Bio-Rad, № 1351205), разведенным в среде в соотношении 1:500. Затем клетки промывали фосфатно-солевым буфером PBS (ThermoFisher Scientific, № 10010031) и пересевали, причем 1/5 часть каждого образца высевали в лунку 4 отдельных планшетов, которые использовались для последующих 4 временных точек. Оставшиеся клетки анализировали методом проточной цитометрии (программное обеспечение BD FACSDiva, v8.0.3) для оценки исходной интенсивности CytoTrack на день 0 (d0). В течение следующих 4 дней содержимое 1 лунки каждого образца диссоциировали ежедневно и анализировали с помощью проточной цитометрии. Значения интенсивности CytoTrack (отрицательный логарифм по основанию 2) для клеток EGFP+, экспрессирующих конструкт нокдауна, нормировали на клетки EGFP- из той же лунки для контроля вариабельности скорости пролиферации между лунками. Дополнительно их нормировали на их исходную интенсивность CytoTrack на день 0 (d0) для контроля вариабельности включения красителя. Результаты для каждого нокдауна отображали относительно среднего значения для образцов NTC, строя графики в виде среднего арифметического +/- стандартная ошибка среднего (SEM). Статистический анализ выполняли с использованием стандартного двухфакторного дисперсионного анализа (two-way ANOVA) с тестом множественных сравнений Даннетта (GraphPad Prism). Полная информация о размерах выборок и результатах статистического анализа приведена в Дополнительной таблице 10.&lt;/p&gt;\n&lt;h4 id=\"indukciya-rekombinacii-flick\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#indukciya-rekombinacii-flick\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Индукция рекомбинации FLICK&lt;/span&gt;&lt;/a&gt;Индукция рекомбинации FLICK&lt;/h4&gt;\n&lt;p&gt;Для индукции экспрессии Cre и запуска рекомбинации конструката FLICK клетки/органоиды обрабатывали 2 мкг/мл доксициклина (Sigma, D9891-1G) в течение 24 часов.&lt;/p&gt;\n&lt;h4 id=\"ocenka-effektivnosti-nokdauna-flick\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#ocenka-effektivnosti-nokdauna-flick\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оценка эффективности нокдауна FLICK&lt;/span&gt;&lt;/a&gt;Оценка эффективности нокдауна FLICK&lt;/h4&gt;\n&lt;p&gt;Для определения эффективности нокдауна с использованием конструктов FLICK для каждого условия анализировали три независимых образца. Контрольные iPSC линии 280 подвергали нуклеофекции конструктами, кодирующими контрольный массив gRNA NTC1 или массив gRNA, нацеленный на ген ENSG00000261840, вместе с плазмидой, экспрессирующей транспозазу piggyBac, для геномной интеграции конструктов FLICK. Для индукции нокдауна клетки обрабатывали 2 мкг/мл доксициклина (Sigma, D9891-1G) в течение 24 часов. Клетки, у которых произошла рекомбинация конструката FLICK, выделяли с помощью сортировки клеток, активируемой флуоресценцией (FACS) (BD FACSymphony™ S6), отбирая EGFP+ клетки, которые затем пересевали в трех повторностях и культивировали в течение дополнительных двух дней. Затем выделяли РНК с использованием набора Direct-zol RNA Microprep Kit (Zymo Research, № R2062). Для получения кДНК 500 нг РНК подвергали обратной транскрипции с использованием смеси SuperScript™ IV VILO™ Master Mix (ThermoFisher Scientific, № 11756050). Количественную ПЦР (qPCR) выполняли, объединяя кДНК в концентрации, эквивалентной РНК 1 нг/мкл (10 нг на реакцию объемом 10 мкл), праймеры в конечной концентрации 0,5 мкМ и смесь PowerUp™ SYBR™ Green Master Mix для qPCR (ThermoFisher Scientific, № A25742). Реакции qPCR проводили в трех технических повторностях для каждого образца на системе детекции в реальном времени CFX384 Touch Real-Time PCR Detection System (Bio-Rad, № 1855484) в условиях режима «fast cycling mode», описанного в протоколе к мастер-миксу. Экспрессию целевого гена нокдауна (ENSG00000261840) оценивали с использованием метода дельта-дельта Ct, причем экспрессию сначала нормировали на экспрессию гена домашнего хозяйства HPRT1 для каждого образца, а затем отображали относительно среднего значения контрольных образцов NTC в виде среднего +/- SEM. Статистическую значимость оценивали с использованием двустороннего t-критерия Стьюдента (GraphPad Prism).&lt;/p&gt;\n&lt;h4 id=\"obrabotka-cerebralnyh-organoidov-dlya-gistologicheskogo-analiza\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#obrabotka-cerebralnyh-organoidov-dlya-gistologicheskogo-analiza\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обработка церебральных органоидов для гистологического анализа&lt;/span&gt;&lt;/a&gt;Обработка церебральных органоидов для гистологического анализа&lt;/h4&gt;\n&lt;p&gt;Церебральные органоиды фиксировали в 4% параформальдегиде (PFA), разведенном в PBS из 16% PFA (Electron Microscopy Sciences # 15710), при температуре 4°C в течение ночи. После фиксации церебральные органоиды промывали PBS, а затем эквилибрировали в 30% растворе сахарозы (мас./об. в PBS) не менее ночи при 4°C. Для крупных органоидов 30% раствор сахарозы заменяли по меньшей мере один раз после инкубации в течение ночи для обеспечения полной криoproteкции. Для криосекционирования церебральные органоиды замораживали в среде Tissue-Tek® O.C.T. Compound (Sakura #4583) на сухом льду. Для получения срезов толщиной 30 мкм использовали криостат Leica CM3050 S, срезы собирали на предметные стекла Fisherbrand™ Superfrost™ Plus Microscope Slides (Fisher Scientific #12-550-15) и хранили при -80°C.&lt;/p&gt;\n&lt;p&gt;Для иммуногистохимического анализа буфер для блокирования готовили путем смешивания 0.3 М глицина (Sigma G7403-1KG), 1% бычьего сывороточного альбумина (Sigma A4503-50G), 0.3% Triton X-100 (Sigma T8787-50ML), 10% нормальной козьей сыворотки (Fisher Scientific # NC9660079) и PBS. Предметные стекла промывали в PBS для удаления O.C.T., а затем инкубировали в буфере для блокирования в течение 1 часа при комнатной температуре (RT). Буфер для блокирования удаляли и заменяли свежим буфером для блокирования, содержащим первичные антитела представляющие интерес (см. ниже), и предметные стекла инкубировали во влажной камере для стекол (Avantor # 76278-848) при 4°C в течение ночи.&lt;/p&gt;\n&lt;p&gt;Затем стекла трижды промывали PBS по пять минут каждое промывание. Вторичные антитела (см. ниже) и ядерный краситель DAPI (ThermoFisher Scientific #62248) разводили в буфере для блокирования (в соотношении 1:500 и 1:1000 соответственно) и наносили на стекла на 30 минут при комнатной температуре, после чего стекла защищали от света. Затем стекла трижды промывали PBS по пять минут каждое. Покровные стекла (Epredia #152455) монтировали с использованием среды Fluoromount-G® (Fisher Scientific #OB100-01), которую высушивали не менее ночи при комнатной температуре. После высыхания стекла хранили при 4°C.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Иммуногистохимия и криосекционирование позволяют визуализировать распределение специфических белков в трехмерных тканях с помощью флуоресцентных антител.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"antitela-dlya-immunogistohimii-i-immunocitohimii\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#antitela-dlya-immunogistohimii-i-immunocitohimii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Антитела для иммуногистохимии и иммуноцитохимии&lt;/span&gt;&lt;/a&gt;Антитела для иммуногистохимии и иммуноцитохимии&lt;/h4&gt;\n&lt;p&gt;• PAX6 (BD Pharmingen 561462, клон O18-1330): разведение 1:300 • Nestin (Millipore Sigma HPA026111-25UL): разведение 1:500 • TBR2 (Millipore Sigma HPA028896-100UL): разведение 1:300 • CTIP2 (Abcam ab18465, клон 25B6): разведение 1:300 • EGFP (Aves GFP-1010): разведение 1:1000 • Козьи антитела против IgY цыпленка, Alexa Fluor 488 (ThermoFisher A-11039): разведение 1:500 • Козьи антитела против IgG кролика, Alexa Fluor 488 (ThermoFisher A-11008): разведение 1:500 • Козьи антитела против IgG крысы, Alexa Fluor 488 (ThermoFisher A-11006): разведение 1:500 • Козьи антитела против IgG мыши, Alexa Fluor 555 (ThermoFisher A-21424): разведение 1:500 • Козьи антитела против IgG крысы, Alexa Fluor 647 (ThermoFisher A-21247): разведение 1:500 • Козьи антитела против IgG кролика, Alexa Fluor 647 (ThermoFisher A-21245): разведение 1:500 • Козьи антитела против IgG кролика, Alexa Fluor 750 (ThermoFisher A-21039): разведение 1:500&lt;/p&gt;\n&lt;h4 id=\"konfokalnaya-vizualizaciya-i-obrabotka\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#konfokalnaya-vizualizaciya-i-obrabotka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конфокальная визуализация и обработка&lt;/span&gt;&lt;/a&gt;Конфокальная визуализация и обработка&lt;/h4&gt;\n&lt;p&gt;Срезы церебральных органоидов сканировали с помощью конфокального микроскопа Zeiss LSM 980. Стандартную обработку изображений выполняли с помощью Adobe Photoshop.&lt;/p&gt;\n&lt;h4 id=\"odnokletochnoe-sekvenirovanie-rnk-cerebralnyh-organoidov-scrna-seq\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#odnokletochnoe-sekvenirovanie-rnk-cerebralnyh-organoidov-scrna-seq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Одноклеточное секвенирование РНК церебральных органоидов (scRNA-seq)&lt;/span&gt;&lt;/a&gt;Одноклеточное секвенирование РНК церебральных органоидов (scRNA-seq)&lt;/h4&gt;\n&lt;p&gt;Для scRNA-seq клетки собирали из: • месяц: 10 органоидов, объединенных вместе и собранных в виде одной партии • месяцы: 14 органоидов, собранных в две партии, причем 7 органоидов были собраны вместе на 60-й день и еще 7 органоидов были собраны вместе на 61-й день • острый нокаут (KD): 8 органоидов, объединенных вместе и собранных в виде одной партии. Для сбора клеток мозаичные церебральные органоиды разрезали на кусочки с помощью пружинных ножниц, дважды промывали PBS для удаления клеточного мусора, а затем диссоциировали с использованием набора для диссоциации нервной ткани Neural Tissue Dissociation Kit – Postnatal Neurons (Miltenyi Biotec # 130-094-802) с применением ферментных смесей, описанных для мозговой ткани.&lt;/p&gt;\n&lt;p&gt;Щадящую диссоциацию выполняли путем пипетирования наконечниками с уменьшающимся диаметром, начиная с наконечников с широким отверстием (Rainin # 30389218) и переходя к стандартным наконечникам. Клетки с рекомбинированными конструктами FLICK выделяли с помощью сортировки клеток FACS (BD FACSymphony™ S6) по экспрессии EGFP+. Полнотранскриптомные библиотеки scRNA-seq готовили с использованием наборов Chromium Next GEM Single Cell 3ʹ Reagent Kits v3.1 (Dual Index) от 10X Genomics в соответствии с руководством пользователя CG000316 Rev A.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;scRNA-seq (секвенирование РНК одиночных клеток) измеряет экспрессию тысяч генов в каждой отдельной клетке, позволяя идентифицировать клеточные типы и их состояния.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sozdanie-bibliotek-sekvenirovaniya-barkodov-flick\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#sozdanie-bibliotek-sekvenirovaniya-barkodov-flick\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Создание библиотек секвенирования баркодов FLICK&lt;/span&gt;&lt;/a&gt;Создание библиотек секвенирования баркодов FLICK&lt;/h4&gt;\n&lt;p&gt;Подробные протоколы см. на сайте protocols.io: https://dx.doi.org/10.17504/protocols.io.5qpvoj5pzg4o/v1. Кратко: для количественной оценки конструктов FLICK из исходного пула индуцированных плюрипотентных стволовых клеток (iPSC), использованных для генерации мозаичных органоидов (d0), экстрагировали РНК из трех биологических повторностей по 42 тыс. клеток с использованием набора Direct-zol RNA Microprep Kit (Zymo Research #R2062).&lt;/p&gt;\n&lt;p&gt;Для генерации кДНК 50–250 нг РНК подвергали обратной транскрипции с использованием системы SuperScript™ IV First-Strand Synthesis System (Invitrogen 18091050) совместно с олиго(dT)VN-праймером, содержащим UMI (уникальные молекулярные идентификаторы). Библиотеки секвенирования затем генерировали с использованием мастер-микса Q5® Hot Start High-Fidelity 2X Master Mix (NEB #M0494L) и пользовательских праймеров. Для генерации библиотек баркодов FLICK из библиотек scRNA-seq использовали 5 мкл амплифицированной и очищенной кДНК (полученной в соответствии с руководством пользователя 10X User Guide CG000316 Rev A до конца этапа Шага 2).&lt;/p&gt;\n&lt;p&gt;Содержащая баркоды кДНК амплифицировалась для секвенирования с использованием Q5® Hot Start High-Fidelity 2X Master Mix (NEB #M0494L) и пользовательских праймеров. Библиотеки очищали с помощью реагента для выбора размера ДНК SPRIselect DNA Size Selection Reagent (Beckman Coulter # B23317) и оценивали с помощью реагентов TapeStation High Sensitivity D1000 reagents (Agilent #5067-5603 и #5067-5584).&lt;/p&gt;\n&lt;h4 id=\"vyravnivanie-i-kvantificirovanie-dannyh-scrna-seq-organoidov\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#vyravnivanie-i-kvantificirovanie-dannyh-scrna-seq-organoidov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Выравнивание и квантифицирование данных scRNA-seq органоидов&lt;/span&gt;&lt;/a&gt;Выравнивание и квантифицирование данных scRNA-seq органоидов&lt;/h4&gt;\n&lt;p&gt;Данные scRNA-seq выравнивали по ранее созданному референсу CellRanger (v.9.0.0) hg38 с использованием cellranger-count в режиме feature-barcode для одновременной оценки экспрессии генов и количества гидов. Интроны не включались в расчет экспрессии генов (--include-introns=false) во избежание количественной оценки частично деградированных транскриптов, на которые воздействовал CRISPR-CasRx. FASTQ-файлы библиотеки секвенирования гидов CRISPR для образцов возрастом 2 месяца субдискретизировали до 1.25% ридов с помощью seqtk (v1.4) для соответствия глубине секвенирования библиотеки CRISPR для одномесячных образцов и минимизации фонового шума при назначении гидов с помощью конвейера квантифицирования гидов cellranger-CRISPR. Все остальные параметры использовались по умолчанию. Назначения гидов CellRanger применялись для отбора только тех клеток, которым был точно назначен один гид.&lt;/p&gt;\n&lt;h4 id=\"predvaritelnaya-obrabotka-i-kontrol-kachestva-dannyh-scrna-seq-organoidov\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#predvaritelnaya-obrabotka-i-kontrol-kachestva-dannyh-scrna-seq-organoidov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Предварительная обработка и контроль качества данных scRNA-seq органоидов&lt;/span&gt;&lt;/a&gt;Предварительная обработка и контроль качества данных scRNA-seq органоидов&lt;/h4&gt;\n&lt;p&gt;Образцы с долгосрочным и острым нокдауном (KD) обрабатывались раздельно, но аналогичным образом. CellBender (v0.3.2) использовался для обнаружения и фильтрации фонового загрязнения РНК, в то время как scrublet (v0.2.3) применялся для автоматического обнаружения и фильтрации дуплетов. Весь остальной анализ ниже по потоку выполнялся с помощью Seurat (v5.0.0). Высококачественные клетки отбирались в соответствии со следующими метриками контроля качества: 1) процент экспрессии митохондриальных генов (percent.mt) &amp;lt; 20% и 2) 500 &amp;lt; количество экспрессируемых генов (nFeature_RNA) &amp;lt; 6000.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Контроль качества данных одноклеточной РНК-секвениции включает отсечку поврежденных клеток по уровню митохондриальных транскриптов и удаление двойных клеток (дуплетов), чтобы избежать искажения результатов.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"annotaciya-tipov-kletok-dannyh-scrna-seq-organoidov\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#annotaciya-tipov-kletok-dannyh-scrna-seq-organoidov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Аннотация типов клеток данных scRNA-seq органоидов&lt;/span&gt;&lt;/a&gt;Аннотация типов клеток данных scRNA-seq органоидов&lt;/h4&gt;\n&lt;p&gt;Аннотация типов клеток сначала выполнялась только на клетках с нетаргетным контролем (NTC). Клетки NTC извлекались для создания Seurat-объекта, содержащего только контроль. Этот объект впоследствии проходил нормализацию (NormalizeData), выявление вариабельных признаков (FindVariableFeatures), масштабирование (ScaleData; регрессируемые ковариаты: percent.mt, percent_ribo, nCount_RNA и nFeature_RNA) и уменьшение размерности (RunPCA и RunUMAP). Интеграция выполнялась с использованием harmony (v1.2.0) по партиям органоидов, и этот интегрированный объект использовался для неконтролируемой кластеризации (FindNeighbors и FindClusters, разрешение = 0.6 и 1.2). Небольшое количество неконтролируемых кластеров (&amp;lt;1000 клеток) было отфильтровано из-за низких метрик контроля качества на уровне кластеров (т. е. исключительно высоких или низких значений nCount_RNA, высокого процента percent.mt). Вся последующая 2D-визуализация этого Seurat-объекта, содержащего только контроль, выполнялась с использованием UMAP-представления интегрированных данных. Аннотация типов клеток выполнялась с использованием канонических маркерных генов мозга. Затем был создан Seurat-объект для всех клеток с соблюдением того же конвейера обработки (например, нормализация, масштабирование, уменьшение размерности и интеграция), как описано выше. Для проведения аннотации типов клеток выполнялся перенос меток из Seurat-объекта, содержащего только контроль (TransferData), на полный Seurat-объект. Паттерны экспрессии канонических маркерных генов мозга затем использовались для уточнения и окончательного оформления этих аннотаций типов клеток.&lt;/p&gt;\n&lt;h4 id=\"analiz-otnositelnogo-obiliya-dlya-kazhdogo-kd-v-cerebralnyh-organoidah\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#analiz-otnositelnogo-obiliya-dlya-kazhdogo-kd-v-cerebralnyh-organoidah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ относительного обилия для каждого KD в церебральных органоидах&lt;/span&gt;&lt;/a&gt;Анализ относительного обилия для каждого KD в церебральных органоидах&lt;/h4&gt;\n&lt;p&gt;Относительное обилие клеток для каждой мишени KD определялось для каждой временной точки (d0, d30, d60 или d61). Для d0 относительное обилие определялось из библиотек bulk RNA-seq (см. «Создание библиотек секвенирования баркодов FLICK») с использованием пользовательского конвейера (см. раздел «Доступность кода»). Для d30, d60 и d61 относительное обилие определялось из scRNA-seq с использованием назначений гидов CRISPR, сгенерированных CellRanger (см. «Выравнивание и квантифицирование данных scRNA-seq органоидов»). Для каждого образца результаты нормализовались к исходной пропорции в d0 и отображались относительно NTC из той же временной точки. Результаты строились в виде среднее ± стандартная ошибка среднего (SEM). Статистический анализ проводился с использованием однофакторного дисперсионного анализа с повторными измерениями (repeated measures one-way ANOVA) с тестом множественных сравнений Даннетта (GraphPad Prism) с учетом всех долгосрочных образцов (d30, d60 и d61).&lt;/p&gt;\n&lt;h4 id=\"analiz-otnositelnyh-proporcij-tipov-kletok-v-cerebralnyh-organoidah\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#analiz-otnositelnyh-proporcij-tipov-kletok-v-cerebralnyh-organoidah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ относительных пропорций типов клеток в церебральных органоидах&lt;/span&gt;&lt;/a&gt;Анализ относительных пропорций типов клеток в церебральных органоидах&lt;/h4&gt;\n&lt;p&gt;Относительная пропорция ExN/RG определялась для каждой мишени KD на d30, d60 и d61. Результаты нормализовались к образцу NTC из той же временной точки. Статистический анализ проводился с использованием обычного однофакторного дисперсионного анализа (ordinary one-way ANOVA) с тестом множественных сравнений Даннетта (GraphPad Prism) с учетом всех долгосрочных образцов (d30, d60 и d61).&lt;/p&gt;\n&lt;h4 id=\"analiz-differencialnoj-ekspressii-dannyh-scrna-seq-cerebralnyh-organoidov\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#analiz-differencialnoj-ekspressii-dannyh-scrna-seq-cerebralnyh-organoidov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ дифференциальной экспрессии данных scRNA-seq церебральных органоидов&lt;/span&gt;&lt;/a&gt;Анализ дифференциальной экспрессии данных scRNA-seq церебральных органоидов&lt;/h4&gt;\n&lt;p&gt;Анализ дифференциальной экспрессии проводился между возмущенными клетками для каждого гида и клетками, получившими NTC, с разделением по основным типам клеток (радиальная глия, клетки-предшественники промежуточной зоны, возбуждающие нейроны или тормозные нейроны). Функция Seurat FindMarkers использовалась для выполнения дифференциальной экспрессии с параметрами logfc.threshold = 0, min.pct = 0.10, min.cells.group = 3, остальные параметры — по умолчанию. Анализ обогащения дифференциально экспрессируемых генов (DEG) проводился с использованием односторонних точных тестов Фишера, а p-значения корректировались с помощью поправки Бенджамини — Хохберга для проверки множественных гипотез. Совокупность определялась как все гены, экспрессируемые в обоих интересующих сравнениях.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Анализ дифференциальной экспрессии позволяет выявить гены, чья активность статистически значимо изменяется при нокдауне конкретной мишени по сравнению с контролем.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vizualizaciya-obshih-deg-mezhdu-tipami-kletok-organoidov\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#vizualizaciya-obshih-deg-mezhdu-tipami-kletok-organoidov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Визуализация общих DEG между типами клеток органоидов&lt;/span&gt;&lt;/a&gt;Визуализация общих DEG между типами клеток органоидов&lt;/h4&gt;\n&lt;p&gt;Общие DEG между типами клеток органоидов визуализировались (Рис. 3c) с использованием R-пакета igraph (v2.1.4). Алгоритм компоновки Фрухтермана — Рейнгольда (layout_with_fr) применялся для определения финального размещения узлов.&lt;/p&gt;\n&lt;h4 id=\"analizy-magic\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#analizy-magic\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализы MAGIC&lt;/span&gt;&lt;/a&gt;Анализы MAGIC&lt;/h4&gt;\n&lt;p&gt;MAGIC95 (v1.1) использовался для выявления факторов транскрипции и кофакторов, чьи мишени обогащены среди DEG от индивидуальных возмущений. Использовалась стратегия «тело гена (от промотора до конца последнего экзона) плюс фланкирующая последовательность 1 т.п.н. с каждой стороны тела гена». Для анализов NPC совокупность задавалась как все гены с baseMean &amp;gt; 10 в образцах NTC. Для анализов органоидов совокупность задавалась как все гены, экспрессируемые по крайней мере в 10% клеток данного типа клеток (Seurat min.pct = 0.10; без порога log2 fold-change), поскольку именно эти гены оценивались на предмет дифференциальной экспрессии.&lt;/p&gt;\n&lt;h4 id=\"povtornyj-analiz-chip-seq-dannyh-rest\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#povtornyj-analiz-chip-seq-dannyh-rest\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Повторный анализ ChIP-Seq данных REST&lt;/span&gt;&lt;/a&gt;Повторный анализ ChIP-Seq данных REST&lt;/h4&gt;\n&lt;p&gt;Данные были извлечены из Таблицы S2 из работы Rockowitz &amp;amp; Zheng (2015). Мышиные гены были сопоставлены с человеческими с использованием пакетов Orthology.eg.db (v3.20.0), org.Mm.eg.db (v3.20.0) и org.Hs.eg.db (v3.20.0). Анализ обогащения выполнялся с использованием одностороннего точного теста Фишера, где в качестве генеральной совокупности выступали все гены BrainSpan с нормализованной экспрессией ≥ 1 (версия «RNA-Seq Gencode v10 summarized to genes»; дата обращения: 06.01.24; https://brainspan.org). Значения p корректировались с использованием поправки Бенджамини-Хохберга для множественной проверки гипотез. Результаты отображались в виде гистограмм, где основные столбцы указывали отношение шансов (OR) по результатам одностороннего точного теста Фишера, а планки погрешностей обозначали нижнюю границу 95%-ного доверительного интервала для OR (для одностороннего теста верхняя граница не определяется).&lt;/p&gt;\n&lt;h4 id=\"postroenie-i-benchmarking-genno-regulyatornoj-seti-grn\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#postroenie-i-benchmarking-genno-regulyatornoj-seti-grn\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Построение и бенчмаркинг генно-регуляторной сети (GRN)&lt;/span&gt;&lt;/a&gt;Построение и бенчмаркинг генно-регуляторной сети (GRN)&lt;/h4&gt;\n&lt;p&gt;Генно-регуляторная сеть (GRN) была построена с использованием биоинформатического инструмента ARACNe-AP. В качестве входных данных использовались данные RNA-seq из наших 3 образцов NTC и успешных образцов с нокдауном (KD), содержащих не менее 50 дифференциально экспрессируемых генов (DEG). Мы использовали курируемые списки транскрипционных факторов и эпигенетических регуляторов и выбрали гены, экспрессирующиеся в клетках-предшественниках нервной системы (NPC) (baseMean &amp;gt;10 в образцах NTC), в качестве генов-кандидатов в регуляторы. Для создания GRN мы использовали параметры по умолчанию и 100 процедур бутстрэпа, которые затем агрегировались для формирования итоговой сети.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бутстрэп — это метод многократной случайной выборки данных для проверки надежности и стабильности построенной сети.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Затем мы использовали VIPER (v1.36.0) для выявления дифференциально активных регулонов в соответствии со стандартными операционными процедурами. Кратко: мы выявили регулоны со значимым дифференциальным экспрессированием между NTC и KD с помощью t-теста, причем нулевое распределение определялось перестановками образцов. Для оценки предсказательной силы GRN, полученных с помощью ARACNe, мы сгенерировали дополнительные сети ARACNe, последовательно исключая образцы пертурбаций для пяти целевых генов, которые были идентифицированы как регуляторы по меньшей мере 250 генов (диапазон: 478–1219 генов) в их регулонах 2-го порядка (т. е. их прямых мишенях, составляющих их регулон 1-го порядка, а также прямых мишенях этих генов).&lt;/p&gt;\n&lt;p&gt;Для каждого исключенного регулятора мы оценивали перекрытие с помощью одностороннего точного теста Фишера между 1) предсказанными генами с положительной регуляцией в пределах его регулона 2-го порядка и 2) набором репрессированных DEG, возникающих в результате пертурбации этого же регулятора. Значения p корректировались с использованием поправки Бенджамини-Хохберга для множественной проверки гипотез. Значения p для пяти исключенных пертурбаций объединялись с использованием метода Фишера.&lt;/p&gt;\n&lt;h4 id=\"analiz-grn-s-ispolzovaniem-algoritma-pagerank\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#analiz-grn-s-ispolzovaniem-algoritma-pagerank\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ GRN с использованием алгоритма PageRank&lt;/span&gt;&lt;/a&gt;Анализ GRN с использованием алгоритма PageRank&lt;/h4&gt;\n&lt;p&gt;Для выявления центральных регуляторов в нашей GRN мы преобразовали GRN в граф с помощью R-пакета igraph (v2.1.4) и запустили алгоритм PageRank с использованием метода igraph page_rank. Затем мы упорядочили гены по их оценке PageRank и провели анализ обогащения наборов генов (GSEA) с использованием R-пакета fgsea (v1.32.4), тестируя следующие онтологии: гены SFARI, гены HC-SFARI, гены ID (за исключением генов SFARI) и 50 сигнальных путей Hallmark из базы данных Molecular Signature Database (получены с сайта https://www.gseamsigdb.org/gsea/msigdb).&lt;/p&gt;\n&lt;h4 id=\"identifikaciya-klyuchevyh-genov-kandidatov-regulyatorov,-vyzyvayushih-shodimost-pri-autizme\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#identifikaciya-klyuchevyh-genov-kandidatov-regulyatorov,-vyzyvayushih-shodimost-pri-autizme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Идентификация ключевых генов-кандидатов-регуляторов, вызывающих сходимость при аутизме&lt;/span&gt;&lt;/a&gt;Идентификация ключевых генов-кандидатов-регуляторов, вызывающих сходимость при аутизме&lt;/h4&gt;\n&lt;p&gt;Инструмент VIPER (v1.36.0) использовался для идентификации регуляторов GRN, регулоны которых демонстрировали значимую дифференциальную активность в условиях KD по сравнению с контролями NTC. Из них мы выделили 70 регуляторов, регулоны которых были значимо обогащены как генами SFARI (односторонний точный тест Фишера с поправкой Бенджамини-Хохберга на множественную проверку гипотез), так и высокими оценками PageRank (анализ обогащения наборов генов с поправкой Бенджамини-Хохберга на множественную проверку гипотез).&lt;/p&gt;\n&lt;h4 id=\"dopolnitelnye-analizy-grn\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#dopolnitelnye-analizy-grn\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дополнительные анализы GRN&lt;/span&gt;&lt;/a&gt;Дополнительные анализы GRN&lt;/h4&gt;\n&lt;p&gt;Средняя нормализованная степень для указанного набора регуляторов и их регулонов 1-го порядка (Рис. 4d) рассчитывалась с использованием R-пакета igraph (v2.1.4) путем запуска функции mean(degree(graph, normalized = TRUE)). Затем мы создали эмпирическое нулевое распределение средних нормализованных степеней для каждого указанного набора регуляторов, создав 1 млн подсетей того же размера набора из случайно выбранных регуляторов GRN. Относительная средняя нормализованная степень рассчитывалась как наблюдаемая средняя нормализованная степень для заданного набора регуляторов, деленная на среднее значение для соответствующего эмпирического нулевого распределения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эмпирическое нулевое распределение создается путем многократной случайной генерации данных (перестановок), чтобы оценить, насколько наблюдаемый результат отличается от случайного.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Затем одностороннее эмпирическое значение p рассчитывалось как доля нулевых значений, превышающих или равных наблюдаемой средней нормализованной степени, с пределом обнаружения p = 1e-6. Для оценки известных или предсказанных белковых взаимодействий между топ-70 регуляторами мы использовали графический интерфейс базы данных STRING. В качестве генеральной совокупности мы использовали полный набор генов, которые рассматривались как кандидаты в генетические регуляторы в GRN: транскрипционные факторы и эпигенетические регуляторы, которые экспрессировались в NPC (baseMean &amp;gt;10 в образцах NTC). Использовались все остальные параметры по умолчанию.&lt;/p&gt;\n&lt;p&gt;Для кластеризации наших 70 регуляторов на модули мы использовали итеративную кластеризацию walktrap с помощью R-пакета igraph (v2.1.4) путем запуска функции cluster_walktrap с параметрами по умолчанию.&lt;/p&gt;\n&lt;h4 id=\"povtornyj-analiz-chip-seq-dannyh-chd8\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#povtornyj-analiz-chip-seq-dannyh-chd8\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Повторный анализ ChIP-Seq данных CHD8&lt;/span&gt;&lt;/a&gt;Повторный анализ ChIP-Seq данных CHD8&lt;/h4&gt;\n&lt;p&gt;Для анализа обогащения мишеней CHD8 мы использовали Дополнительные данные 1 (Supplementary Data 1) из работы Sugathan et al. (2014). Обогащение указанных наборов генов проверялось с помощью односторонних точных тестов Фишера, при этом в качестве генеральной совокупности были заданы гены, экспрессирующиеся в NPC (baseMean &amp;gt; 10 в NTC). Значения p корректировались с использованием поправки Бенджамини-Хохберга для множественной проверки гипотез. Результаты отображались в виде гистограммы, где основные столбцы указывали отношение шансов (OR) по результатам одностороннего точного теста Фишера, а планки погрешностей обозначали нижнюю границу 95%-ного доверительного интервала для OR (для одностороннего теста верхняя граница не определяется).&lt;/p&gt;\n&lt;h4 id=\"identifikaciya-genov-s-ekspressiej,-smeshennoj-v-storonu-zhenskogo-pola\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#identifikaciya-genov-s-ekspressiej,-smeshennoj-v-storonu-zhenskogo-pola\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Идентификация генов с экспрессией, смещенной в сторону женского пола&lt;/span&gt;&lt;/a&gt;Идентификация генов с экспрессией, смещенной в сторону женского пола&lt;/h4&gt;\n&lt;p&gt;Для идентификации генов, демонстрирующих экспрессию со смещением в женскую сторону в нейротипичном головном мозге, мы объединили наборы данных дифференциально экспрессируемых генов (DEG) из следующих работ: (1) Таблица S4 из работы Kissel et al. (2024): идентифицированы как достоверно смещенные в женскую сторону в когорте UCLA, когорте BrainVar или по результатам метаанализа. (2) Oliva et al. (2020) (https://storage.cloud.google.com/adult-gtex/bulk-qtl/v8/sbeqtl/GTEx_Analysis_v8_sbgenes.tar.gz): идентифицированы как достоверно смещенные в женскую сторону в BRNCTXA или BRNCTXB. (3) Таблица S4 из работы Naqvi et al. (2019): идентифицированы как достоверно смещенные в женскую сторону в головном мозге всех оцениваемых видов (человек, мыши, крысы, собаки и макаки). (4) Таблица S13 из работы DeCasien et al. (2026): идентифицированы как повсеместно смещенные в женскую сторону.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метаанализ объединяет данные из разных независимых исследований, чтобы повысить надежность поиска генов с половыми различиями в экспрессии.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"analiz-dannyh-sekvenirovaniya-rnk-edinichnyh-yader-snrna-seq-autichnyh-muzhchin\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#analiz-dannyh-sekvenirovaniya-rnk-edinichnyh-yader-snrna-seq-autichnyh-muzhchin\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ данных секвенирования РНК единичных ядер (snRNA-seq) аутичных мужчин&lt;/span&gt;&lt;/a&gt;Анализ данных секвенирования РНК единичных ядер (snRNA-seq) аутичных мужчин&lt;/h4&gt;\n&lt;p&gt;Обработанные данные snRNA-seq фронтальной коры человека были получены из работы Dias et al. (2024). Пол отдельных образцов проверяли по экспрессии XIST и генов, сцепленных с Y-хромосомой. В данную когорту было включено лишь небольшое число женских образцов (один женский контроль, один образец от женщины с идиопатическим аутизмом и один образец от женщины с аутизмом, связанным с дупликацией 15q) в силу известного преобладания аутизма у мужчин. Таким образом, весь дальнейший анализ мы сосредоточили на 17 мужских образцах, вошедших в эту когорту. Анализ дифференциальной экспрессии проводился с использованием функции FindMarkers пакета Seurat для каждого клеточного типа отдельно между: (a) мужским контролем и образцами только от мужчин с идиопатическим аутизмом; (b) мужским контролем и образцами только от мужчин с аутизмом, связанным с дупликацией 15q; и (c) мужским контролем и всеми образцами от мужчин с аутизмом (как идиопатическим, так и связанным с дупликацией 15q). Чтобы нивелировать эффекты доноров, FindMarkers запускали с использованием метода MAST. Значимыми генами считались те, у которых абсолютное значение логарифма кратности изменения по основанию 2 (log-2 fold-change) превышало 0.1, а скорректированное p-значение в масштабе всего транскриптома составляло &amp;lt; 0.05.&lt;/p&gt;\n&lt;h4 id=\"grafiki-polospecifichnoj-ekspressii-zfx\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#grafiki-polospecifichnoj-ekspressii-zfx\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Графики полоспецифичной экспрессии ZFX&lt;/span&gt;&lt;/a&gt;Графики полоспецифичной экспрессии ZFX&lt;/h4&gt;\n&lt;p&gt;Использовались данные из следующих источников: (1) Benoit-Pilven et al. (2025) (2) Kissel et al. (2024) (3) Fass et al. (2024) (4) DeCasien et al. (2026).&lt;/p&gt;\n&lt;h4 id=\"povtornyj-analiz-mishenej-zfx-iz-rabot-rhie-et-al-2018-i-san-roman-et-al-2024\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#povtornyj-analiz-mishenej-zfx-iz-rabot-rhie-et-al-2018-i-san-roman-et-al-2024\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Повторный анализ мишеней ZFX из работ Rhie et al. (2018) и San Roman et al. (2024)&lt;/span&gt;&lt;/a&gt;Повторный анализ мишеней ZFX из работ Rhie et al. (2018) и San Roman et al. (2024)&lt;/h4&gt;\n&lt;p&gt;Мишени ChIP-seq для ZFX были получены из Таблицы S3E работы Rhie et al. (2018). Мишени ZFX также были взяты из Таблицы S10 работы San Roman et al. (2024), в которой ранее проводился интегративный анализ данных ChIP-seq для ZFX (ENCODE) и данных RNA-seq при нокдауне ZFX из работы Rhie et al. (2018). Обогащение анализировали с помощью односторонних точных тестов Фишера, а p-значения корректировали с использованием поправки Бенджамини — Хохберга для множественной проверки гипотез. При анализе общих мишеней ZFX из работы Rhie et al. (2018) генеральную совокупность определяли как гены, экспрессирующиеся в обеих клеточных линиях, использованных для ChIP-seq, для которых также были доступны данные RNA-seq (C4-2B и MCF-7). При анализе мишеней ZFX из работы San Roman et al. (2024) генеральную совокупность определяли как гены, экспрессирующиеся в соответствующем клеточном типе из работы Rhie et al. (2018). Результаты представлены в виде столбчатой диаграммы, где основные столбцы обозначают отношение шансов (OR) по одностороннему точному тесту Фишера, а усовáя планка (error bars) указывает нижнюю границу 95%-го доверительного интервала для OR (верхняя граница для одностороннего теста не определяется).&lt;/p&gt;\n&lt;h4 id=\"svodka-programmnogo-obespecheniya\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#svodka-programmnogo-obespecheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сводка программного обеспечения&lt;/span&gt;&lt;/a&gt;Сводка программного обеспечения&lt;/h4&gt;\n&lt;p&gt;В данном исследовании использовались следующие программные средства: R (v4.3.1) и пакеты R DESeq2 (v1.42.0), Seurat (v5.0.0), igraph (v2.1.4), scrublet (v0.2.3), harmony (v1.2.0), Orthology.eg.db (v3.20.0), org.Mm.eg.db (v3.20.0), org.Hs.eg.db (v3.20.0), VIPER (v1.36.0) и fgsea (v1.32.4), а также CellRanger (v9.0.0), CellBender (v0.3.2), MAGIC (v1.1), salmon (v1.9), seqtk (v1.4) и программное обеспечение BD FACSDiva версии v8.0.3.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS6.jpg\" alt=\"Расширенная дата, рисунок 6./ Влияние на пролиферацию и численность клеток после нокдауна генов РАС. a, Относительная ин\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Расширенная дата, рисунок 6./ Влияние на пролиферацию и численность клеток после нокдауна генов РАС. a, Относительная интенсивность красителя CytoTrack (-log2) с течением времени. Показаны только условия нокдауна, которые продемонстрировали незначительные или противоречивые эффекты. На графике изображены среднее значение +/- стандартная ошибка среднего (SEM). Статистическая значимость определялась с использованием обычного двустороннего ANOVA с тестом множественных сравнений Даннетта. Для каждой временной точки анализировалось не менее четырех биологически независимых образцов на условие. См. также рис. 1f и см. таблицу Supplementary Table 10 для получения полных результатов статистического анализа. b, Точечная диаграмма, отображающая относительную численность клеток с нокдауном по оси y и экспрессию целевого гена нокдауна по оси x. Линейная регрессия показана красным цветом. Выделены гены, которые были связаны с микроцефалией и нокдаун которых привел к снижению пролиферации (рис. 1f).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS7.jpg\" alt=\"Расширенные данные, рисунок 7. / Нокдаун генов РАС в мозаичных церебральных органоидах выявляет транскриптомную конверге\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Расширенные данные, рисунок 7. / Нокдаун генов РАС в мозаичных церебральных органоидах выявляет транскриптомную конвергенцию. a, Эффективность нокдауна конструкта FLICK в иПСК. Нормализованная экспрессия целевого гена нокдауна ENSG00000261840 показана относительно образцов NTC в виде среднего значения +/- стандартная ошибка среднего (SEM). **** p = 3,87e-5, двусторонний t-критерий Стьюдента. n = три биологически независимых образца для каждого состояния. b, Иммуногистохимия органоида FLICK на 15-й день, репрезентативная для трех независимых анализов с аналогичными результатами. c, UMAP scRNA-seq органоидов, окрашенный по временной точке. d, UMAP данных scRNA-seq органоидов, окрашенный по целевому гену. e, Эффективность FLICK в радиальных глиальных клетках (RG), оцененная с помощью scRNA-seq на органоидах возрастом один месяц. Статистически значимые дифференциально экспрессируемые гены (DEG) определялись с использованием Seurat (непараметрический ранговый критерий Уилкоксона) с поправкой Бонферрони для множественной проверки гипотез. Мы отмечаем, что на количественную оценку BAZ2B может влиять малое количество клеток, а на захват WDFY3 в scRNA-seq — длина транскрипта (&amp;gt;14 т. п. н.). f, Клеточный состав по мишеням нокдауна в двухмесячных органоидах. Пунктирные линии указывают пропорции основных клеточных типов в NTC. Образцы, у которых пропорция ExN/RG достоверно отличалась от NTC, отмечены знаком * (adj. p = 0,021 для BAZ2B, 0,018 для CLASP1 и 0,012 для EHMT1), обычный однофакторный дисперсионный анализ (ANOVA) с тестом множественных сравнений Даннетта с учетом всех долгосрочных образцов возрастом один месяц (см. рис. 2f) и два месяца (показано здесь). g, Перекрестное обогащение DEG из IPC (односторонний точный тест Фишера с поправкой Бенджамини — Хохберга для множественной проверки гипотез). h, Столбчатая диаграмма, отображающая перекрестное обогащение DEG из RG одномесячных органоидов по сравнению с DEG из предыдущих культур NPC при нокдауне того же целевого гена. Для перекрестного обогащения тестировались только возмущения по меньшей мере с 20 DEG. Столбцы показывают отношение шансов (OR) по результатам одностороннего точного теста Фишера; планки погрешностей указывают нижнюю границу 95% доверительного интервала для OR (верхняя граница для одностороннего теста не определена). Значения p скорректированы с использованием поправки Бенджамини — Хохберга для множественной проверки гипотез. i, UMAP данных scRNA-seq из органоидов с острым нокдауном, окрашенный по целевому гену нокдауна, как на панели d. j, Экспрессия маркерных генов, используемых для идентификации типов клеток. k, Клеточный состав при различных возмущениях в органоидах с острым нокдауном. l, Столбчатая диаграмма, отображающая перекрестное обогащение DEG из возбуждающих нейронов (ExN) из органоидов с острым нокдауном мозаики по сравнению с DEG из предыдущих культур NPC при нокдауне того же целевого гена. Столбцы показывают отношение шансов (OR) по результатам одностороннего точного теста Фишера; планки погрешностей указывают нижнюю границу 95% доверительного интервала для OR (верхняя граница для одностороннего теста не определена). Значения p скорректированы с использованием поправки Бенджамини — Хохберга для множественной проверки гипотез.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Редкие мутации&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;и половой&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;дисбаланс&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M1
