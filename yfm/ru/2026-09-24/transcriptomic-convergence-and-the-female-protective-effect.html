            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"105\" cy=\"63\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"495\" cy=\"292\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · GENETICS   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как женский организм&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;защищает мозг от аутизма&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-f1.jpg\" alt=\"Рисунок 1./ Истощение генов аутизма выявляет масштабную транскриптомную конвергенцию. a, Схема экспериментального дизайн\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1./ Истощение генов аутизма выявляет масштабную транскриптомную конвергенцию. a, Схема экспериментального дизайна. iPSC: индуцированные плюрипотентные стволовые клетки. b, Иммуноцитохимия культур клеток-предшественников нервной системы (NPC), полученных из iPSC, репрезентативная для трех независимых анализов с аналогичными результатами. c, Столбчатая диаграмма, отображающая обогащение генов SFARI или только генов умственной отсталости (ID-only) среди дифференциально экспрессируемых генов (DEG) при каждом условии нокдауна (KD), за исключением самого целевого гена. Столбцы показывают отношение шансов (OR) по одностороннему точному тесту Фишера; планки погрешностей показывают нижнюю границу 95% доверительного интервала для OR (верхняя граница для одностороннего теста не определена). Значения p скорректированы с использованием поправки Бенджамини — Хохберга для множественной проверки гипотез. d, Циркулярная диаграмма (Circos), изображающая высокоуверенные DEG SFARI, общие для различных условий KD (см. также рис. 3a Расширенных данных). e, Тепловая карта, показывающая относительную экспрессию высокоуверенных генов SFARI, которые являются DEG по крайней мере в 10 условиях KD (см. также рис. 3b-c Расширенных данных). Статистически значимые DEG были определены с помощью DESeq2 (тест Вальда) с поправкой Бенджамини — Хохберга для множественной проверки гипотез и отмечены звездочкой (&lt;/em&gt;). Ведущие гены риска аутизма из 1 выделены жирным шрифтом. f, Относительная интенсивность красителя CytoTrack (-log2) с течением времени. Отображены только те условия KD, которые показали статистически значимые эффекты, стабильные во времени. На графике показано среднее значение +/- стандартная ошибка среднего (SEM). Статистическую значимость определяли с помощью стандартного двустороннего ANOVA с тестом множественных сравнений Даннетта. Для каждой временной точки анализировали по меньшей мере три биологически независимых образца на одно условие. Полные результаты статистического анализа см. в Дополнительной таблице 10.*&lt;/p&gt;\n&lt;p&gt;Расстройство аутистического спектра диагностируют у мальчиков в три-четыре раза чаще, чем у девочек, хотя генетические причины до конца не были ясны. Авторы новой работы показали, что половые хромосомы и особые белки способны компенсировать генетические сбои. Исследование объясняет природу так называемого защитного женского эффекта на молекулярном уровне. Это открывает новые перспективы для понимания нейроразвития.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Подавление 18 генов аутизма вызывает одинаковый сбой в клетках.&lt;/li&gt;\n&lt;li&gt;Фактор ZFX с X-хромосомы активен на обеих хромосомах у женщин.&lt;/li&gt;\n&lt;li&gt;Повышенный уровень белка ZFX защищает мозг от генных мутаций.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Аутизм связан с мутациями в сотнях генов, однако до сих пор оставалось загадкой, почему повреждения столь разных участков ДНК приводят к схожим проявлениям. Чтобы разобраться в этом, исследователи подавляли активность 18 ключевых генов, связанных с расстройством, в культуре человеческих нейральных прогениторных клеток с помощью РНК-управляемого фермента CasRx. Оказалось, что отключение любого из этих генов запускает единую цепную реакцию — массовое снижение активности других генов, связанных с аутизмом. Это указывает на мощную конвергенцию транскриптома, когда различные первичные поломки ведут к согласованному сбою в единой регуляторной сети.&lt;/p&gt;\n&lt;p&gt;Анализ генных сетей также выделил фактор транскрипции ZFX, который расположен на X-хромосоме и активен сразу на обеих хромосомах у женщин. Поскольку женщины получают двойную дозу экспрессии этого фактора, он эффективнее поддерживает работу и восстановление поврежденных генов нейроразвития. Авторы предполагают, что именно повышенный уровень белка ZFX в женском мозге играет ключевую роль в буферизации генетических мутаций. Это объясняет, почему для проявления аутизма девочкам требуется накопить больший объем генетического риска по сравнению с мальчиками.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа выполнена на культуре клеток человека in vitro, поэтому требует проверки на живых организмах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Расстройство аутистического спектра (РАС) характеризуется высокой наследственностью, при этом мутации в сотнях генов рассматриваются как индивидуально редкие причины РАС. Понимание того, каким образом нарушения в этих функционально разнообразных генах приводят к ключевым проявлениям РАС, остается серьезной задачей. Более того, РАС встречается в три-четыре раза чаще у лиц мужского пола, чем у женского, а у девочек с аутизмом, как правило, обнаруживается больше аутосомных аллелей риска РАС по сравнению с мальчиками, однако биологическая основа этого «эффекта защиты женского пола» (female protective effect, FPE) остается неизвестной. В данном исследовании мы показываем, что индивидуальные нарушения 18 генов РАС в человеческих нервных клетках-предшественниках приводят к схожим эффектам на экспрессию генов, включая масштабное снижение экспрессии (downregulation) других генов РАС. De novo реконструкция генной регуляторной сети (GRN) позволила выявить центральные регуляторы транскрипции, включая известный ген РАС CHD8, а также новые кандидаты, такие как REST, которые обусловливают эту транскрипционную конвергенцию. Более того, сцепленный с X-хромосомой транскрипционный фактор ZFX, который экспрессируется как с активной, так и с инактивированной X-хромосомы у женщин, проявился в качестве ключевого активатора многих генов РАС: мы предполагаем, что более высокий уровень экспрессии ZFX в женском мозге способен компенсировать повреждающие мутации в различных генах РАС, тем самым внося вклад в FPE. В совокупности эти результаты раскрывают механизмы того, как ключевые GRN подвергаются обширной и схожей дисрегуляции при нарушении отдельных генов РАС, и дают молекулярное понимание эффекта защиты женского пола при РАС.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нарушение 18 различных генов РАС в нервных клетках-предшественниках приводит к общему транскрипционному ответу, а фактор ZFX, экспрессирующийся с обеих X-хромосом у женщин, выступает ключевым защитным активатором.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Масштабные генетические исследования связали сотни генов с расстройством аутистического спектра (РАС), причем многие из них были выявлены благодаря редким мутациям, приводящим к потере функции одной аллели. Это указывает на то, что доза генов играет важную роль при РАС, поэтому критически важно определить, каким образом поддерживаются надлежащие уровни экспрессии генов РАС. Характеристика генных регуляторных сетей (GRN) может дать важные сведения о механизмах, обеспечивающих правильную транскрипционную дозировку этих генов РАС. Кроме того, в распространенности РАС наблюдается значительный перевес в сторону мужского пола, и хотя некоторые гены РАС были обнаружены на X-хромосоме, одни лишь мутации, сцепленные с X-хромосомой, не могут полностью объяснить этот половой дисбаланс. Более того, последовательно демонстрируется, что для проявления РАС женщинам требуется большая генетическая нагрузка в аутосомах по сравнению с мужчинами, однако генетические механизмы этого эффекта защиты женского пола (FPE) неизвестны. В настоящей работе реконструкция GRN выявляет ключевые регуляторы экспрессии генов РАС, включая CHD8 и REST. Эти анализы также раскрывают фактор транскрипции с женским смещением экспрессии ZFX, который экспрессируется с активной и инертной X-хромосом у женщин, в качестве ключевого регулятора генов РАС, что предполагает прямой транскрипционный механизм, способный вносить вклад в FPE. Данное исследование предоставляет важнейшую основу для понимания того, как варианты в разнообразных генах могут вызывать конвергентные молекулярные эффекты, приводящие в конечном итоге к РАС.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Генная регуляторная сеть (GRN) — это сложная система взаимодействий между ДНК, РНК и белками, которая управляет включением и выключением генов в клетке.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"istoshenie-genov-autizma-vyyavlyaet-masshtabnuyu-transkripcionnuyu-konvergenciyu\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#istoshenie-genov-autizma-vyyavlyaet-masshtabnuyu-transkripcionnuyu-konvergenciyu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Истощение генов аутизма выявляет масштабную транскрипционную конвергенцию&lt;/span&gt;&lt;/a&gt;Истощение генов аутизма выявляет масштабную транскрипционную конвергенцию&lt;/h4&gt;\n&lt;p&gt;Функциональный анализ генов расстройств аутистического спектра (РАС) выявил сильно пересекающиеся эффекты на нижестоящие мишени в человеческих нейральных предшественниках (NPC). Исследования нокдауна (KD) были проведены для 20 генов РАС, включая 18 генов из базы данных Simons Foundation Autism Research Initiative (SFARI) Gene и две длинные некодирующие РНК (lncRNA), ранее связанные с РАС (NR2F1-AS1 и SOX2-OT). РНК-деградирующий фермент CRISPR CasRx и набор из трех гидовых РНК (gRNA) на одну мишень (Таблица S1) использовались для индукции индивидуального нокдауна каждого целевого гена относительно контролей без мишени (NTC) в культурах NPC из линии индуцированных плюрипотентных стволовых клеток (iPSC) здорового мужчины (XY) (Рис. 1a–b и Рис. S1). Анализ секвенирования РНК (RNA-seq) через 24 часа после нокдауна показал, что почти все возмущения привели к значительному числу достоверно дифференцированно экспрессирующихся генов (DEG; скорректированное p &amp;lt; 0,05) с медианой 920 DEG на возмущение (25-й перцентиль: 644, 75-й перцентиль: 1485) (Рис. S2 и Таблица S2).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-f1.jpg\" alt=\"Рисунок 1./ Истощение генов аутизма выявляет масштабную транскриптомную конвергенцию. a, Схема экспериментального дизайн\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1./ Истощение генов аутизма выявляет масштабную транскриптомную конвергенцию. a, Схема экспериментального дизайна. iPSC: индуцированные плюрипотентные стволовые клетки. b, Иммуноцитохимия культур клеток-предшественников нервной системы (NPC), полученных из iPSC, репрезентативная для трех независимых анализов с аналогичными результатами. c, Столбчатая диаграмма, отображающая обогащение генов SFARI или только генов умственной отсталости (ID-only) среди дифференциально экспрессируемых генов (DEG) при каждом условии нокдауна (KD), за исключением самого целевого гена. Столбцы показывают отношение шансов (OR) по одностороннему точному тесту Фишера; планки погрешностей показывают нижнюю границу 95% доверительного интервала для OR (верхняя граница для одностороннего теста не определена). Значения p скорректированы с использованием поправки Бенджамини — Хохберга для множественной проверки гипотез. d, Циркулярная диаграмма (Circos), изображающая высокоуверенные DEG SFARI, общие для различных условий KD (см. также рис. 3a Расширенных данных). e, Тепловая карта, показывающая относительную экспрессию высокоуверенных генов SFARI, которые являются DEG по крайней мере в 10 условиях KD (см. также рис. 3b-c Расширенных данных). Статистически значимые DEG были определены с помощью DESeq2 (тест Вальда) с поправкой Бенджамини — Хохберга для множественной проверки гипотез и отмечены звездочкой (&lt;/em&gt;). Ведущие гены риска аутизма из 1 выделены жирным шрифтом. f, Относительная интенсивность красителя CytoTrack (-log2) с течением времени. Отображены только те условия KD, которые показали статистически значимые эффекты, стабильные во времени. На графике показано среднее значение +/- стандартная ошибка среднего (SEM). Статистическую значимость определяли с помощью стандартного двустороннего ANOVA с тестом множественных сравнений Даннетта. Для каждой временной точки анализировали по меньшей мере три биологически независимых образца на одно условие. Полные результаты статистического анализа см. в Дополнительной таблице 10.*&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS1.jpg\" alt=\"Расширенные данные, рисунок 1./ Нокдаун генов аутизма на основе CasRx в NPC. a, Относительная экспрессия целевого гена в\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Расширенные данные, рисунок 1./ Нокдаун генов аутизма на основе CasRx в NPC. a, Относительная экспрессия целевого гена в каждом образце KD по сравнению с образцами NTC. Планки погрешностей: среднее значение +/- 95% доверительный интервал. n = три биологически независимых образца на одно условие. Статистически значимые DEG были определены с помощью DESeq2 (тест Вальда) с поправкой Бенджамини — Хохберга для множественной проверки гипотез. b, Анализ уровней белков с помощью автоматического вестерн-блоттинга в NPC NTC и WAC-KD из трех биологически независимых образцов на одно условие.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS2.jpg\" alt=\"Расширенная дата, рисунок 2./ Дифференциальная экспрессия генов при нокдауне генов РАС на основе CasRx в нервных клетках\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Расширенная дата, рисунок 2./ Дифференциальная экспрессия генов при нокдауне генов РАС на основе CasRx в нервных клетках-предшественниках (NPC). Вулканические графики (volcano plots), отображающие полнотранскриптомные эффекты на экспрессию генов после нокдауна генов РАС на основе CasRx. Статистически значимые дифференциально экспрессируемые гены (DEG) определялись с помощью DESeq2 (тест Вальда) с поправкой Бенджамини — Хохберга для множественной проверки гипотез. Статистически значимо downregulated DEG показаны синим цветом, а статистически значимо upregulated DEG — красным. Ген, на который направлен нокдаун (указан над каждым графиком), выделен зеленым цветом. DEG из базы SFARI отмечены жирной рамкой.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нокдаун 20 генов РАС в нейральных предшественниках вызвал масштабные изменения экспрессии (медиана 920 DEG на ген), причем 18 пригодных для анализа возмущений привели к сильной транскрипционной конвергенции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для обеспечения достаточной статистической мощности при последующем анализе этих DEG мы сосредоточились на 18 возмущениях (18/20, 90%), которые привели к образованию более чем 20 DEG, исключив образцы нокдауна ARHGAP5 и ARID2 из дальнейшего анализа. Оставшиеся возмущения привели к минимуму 287 DEG каждое, что позволило надежно охарактеризовать эти образцы. Полнотранскриптомные анализы показали, что нокдауны генов РАС вызывают поразительно масштабное нарушение регуляции других генов РАС. Большинство наборов DEG демонстрировали значительное обогащение известными генами РАС из базы данных SFARI (15/18, 83,3%) (Рис. 1c и Таблица S3). Напротив, не наблюдалось значительного обогащения генами, вовлеченными в умственную отсталость (ID), но не в РАС (гены «только ID») (Рис. 1c и Таблица S3) (Методы), несмотря на их сопоставимую экспрессию в NPC (гены «только ID»: 1062/1242, 85,5% экспрессируются; гены SFARI: 797/1230, 64,8% экспрессируются). Это предполагает, что нарушение функции генов РАС затрагивает преимущественно другие гены РАС, а не нейроразвивающие гены в целом.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нокдаун (KD) — это метод снижения экспрессии конкретного гена с помощью РНК-интерференции или систем CRISPR для оценки его функций.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В частности, мы наблюдали поразительную закономерность транскрипционной конвергенции между различными возмущениями, которую мы определяем как статистически значимое перекрытие одних и тех же DEG (Рис. S3). Это было особенно очевидно для высокоуверенных генов SFARI (HC-SFARI), то есть генов SFARI, находящихся в наивысшей доказательной категории связи с РАС (Рис. 1d). Более того, гены HC-SFARI имели тенденцию смещаться в согласованном направлении в результате различных возмущений, даже если они не были статистически значимыми DEG в конкретном образце нокдауна (Рис. S3c). Это включало важный ген риска РАС CHD8, который существенно снижал экспрессию при большинстве (11/18, 61,1%) нокдаунов. Примечательно, что в общей сложности 27 генов HC-SFARI являлись DEG по меньшей мере в 10 нокдаунах (27/183, 14,8%, p = 4,1e-9), и все они стабильно снижали экспрессию (Рис. 1e), демонстрируя конвергентную дисрегуляцию многих сильнейших генов риска РАС.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS3.jpg\" alt=\"Расширенная дата, рисунок 3./ Транскриптомная конвергенция по общим дифференциально экспрессируемым генам. a, Диаграммы \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Расширенная дата, рисунок 3./ Транскриптомная конвергенция по общим дифференциально экспрессируемым генам. a, Диаграммы Серкл (Circos plots), отображающие DEG, общие для различных условий нокдауна. Для прямого сравнения здесь также представлена диаграмма Серкл для высокоуверенных генов SFARI (показана на рис. 1d). b, Тепловая карта (heatmap), показывающая относительную экспрессию не-SFARI генов, являющихся DEG по меньшей мере в 5 условиях нокдауна. c, Тепловая карта, показывающая относительную экспрессию высокоуверенных генов SFARI, являющихся DEG по меньшей мере в 5 условиях нокдауна. Статистически значимые DEG определялись с использованием DESeq2 (тест Вальда) с поправкой Бенджамини — Хохберга для множественной проверки гипотез и отмечены звездочкой (&lt;/em&gt;). Гены, идентифицированные среди 26 сильнейших генов риска РАС в работе Satterstrom et al. (2020)1, выделены жирным шрифтом.*&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Настоящее исследование выполнено на культивируемых человеческих клетках-предшественниках in vitro, поэтому для подтверждения причинно-следственных связей на уровне целого мозга требуются дополнительные In vivo модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сообщалось, что высокие уровни CasRx вызывают неспецифическую деградацию РНК, величина которой коррелирует с уровнем экспрессии целевого гена нокдауна, в то время как более низкие уровни CasRx позволяют избежать этой проблемы. В наших транскриптомных исследованиях NPC белок CasRx экспрессировался только из одного безопасного локуса (AAVS1), что ограничивало его экспрессию. Мы также провели несколько дополнительных экспериментов, чтобы подтвердить, что неспецифическая деградация РНК не влияла на наши результаты. Во-первых, мы не обнаружили связи между уровнями экспрессии мишеней нокдауна и количеством образующихся DEG ни при рассмотрении всего транскриптома (p = 0,990, R2 = 8e-6, линейная регрессия), ни в отношении конкретно генов SFARI (p = 0,784, R2 = 0,0043, линейная регрессия) (Рис. S4a). Затем мы получили NPC, экспрессирующие флуорофоры mKO2, mScarlet и iRFP670, и подвергли каждый из них индивидуальному воздействию CasRx (Таблица S4); проточная цитометрия не выявила побочных эффектов на интенсивность флуоресценции нефлуоресцирующих мишеней (Рис. S4b и Таблица S5). Наконец, мы подтвердили сильную транскрипционную конвергенцию по общим сниженным DEG после проведения дополнительных исследований нокдауна подмножества наших целевых генов с использованием коротких шпилечных РНК (shRNA) в NPC (Рис. S4c–d, Рис. S5 и Таблица S6).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS4.jpg\" alt=\"Расширенная дата, рисунок 4./ Общие DEG не зависят от нокдауна на основе CasRx. a, Точечные диаграммы, отображающие обще\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Расширенная дата, рисунок 4./ Общие DEG не зависят от нокдауна на основе CasRx. a, Точечные диаграммы, отображающие общее количество DEG (левый график) или DEG SFARI (правый график) по оси y и экспрессию целевого гена нокдауна по оси x. Линейная регрессия показана красным цветом. b, Анализ методом проточной цитометрии интенсивности флуоресценции в NPC, экспрессирующих флуорофоры mKO2, mScarlet и iRFP670. CasRx использовался для индивидуального нокдауна каждого из флуорофоров. Результаты представлены относительно среднего значения контроля NTC. **** скорректированное p = 1.44e-25 для mKO2, 5.74e-24 для mScarlet и 1.45e-24 для iRFP670 (обычный двусторонний ANOVA с тестом множественных сравнений Бонферрони). n = три биологически независимых образца на условие. c, Вулканические графики, отображающие полнотранскриптомные эффекты на экспрессию генов после нокдауна генов РАС на основе shRNA. Статистически значимые DEG определялись с помощью DESeq2 (тест Вальда) с поправкой Бенджамини — Хохберга для множественной проверки гипотез. Статистически значимо downregulated DEG показаны синим цветом, а статистически значимо upregulated DEG — красным. Ген, на который направлен нокдаун (указан над каждым графиком), выделен зеленым цветом. DEG SFARI отмечены жирной рамкой. d, Столбчатая диаграмма, отображающая обогащение тех же downregulated DEG после нокдауна того же целевого гена с помощью CasRx по сравнению с shRNA. Столбцы показывают отношение шансов (OR) из одностороннего точного теста Фишера; планки погрешностей указывают нижнюю границу 95% доверительного интервала для OR (верхняя граница для одностороннего теста не определена). Значения p были скорректированы с использованием поправки Бенджамини — Хохберга для множественной проверки гипотез.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS5.jpg\" alt=\"Расширенная дата, рисунок 5./ Транскриптомная конвергенция наблюдается в разных типах клеток и экспериментальных контекс\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Расширенная дата, рисунок 5./ Транскриптомная конвергенция наблюдается в разных типах клеток и экспериментальных контекстах. Анализ транскриптомной конвергенции в нескольких типах клеток и экспериментальных контекстах. Статистически значимое перекрестное обогащение downregulated DEG показано зеленым цветом (односторонние точные тесты Фишера с поправкой Бенджамини — Хохберга для множественной проверки гипотез). Данные из iPSC и ExN были проанализированы заново из работы Deneault et al. (2018)20.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Повторный анализ данных исследования, в котором использовался Cas9 для нокаута генов РАС в iPSC и полученных из iPSC возбуждающих нейронах (ExN), аналогичным образом продемонстрировал сильную транскрипционную конвергенцию по общим сниженным DEG как внутри каждого типа клеток, так и между типами клеток (Рис. S5 и Таблица S6). Недавние исследования, появившиеся после подачи нашей работы, также отметили конвергенцию в различных моделях РАС. В совокупности эти данные подтверждают, что нарушение работы генов РАС приводит к транскрипционной конвергенции в различных типах клеток и экспериментальных контекстах.&lt;/p&gt;\n&lt;h4 id=\"transkriptomnaya-konvergenciya-ukazyvaet-na-kandidatnye-riskovye-geny-ras\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#transkriptomnaya-konvergenciya-ukazyvaet-na-kandidatnye-riskovye-geny-ras\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Транскриптомная конвергенция указывает на кандидатные рисковые гены РАС.&lt;/span&gt;&lt;/a&gt;Транскриптомная конвергенция указывает на кандидатные рисковые гены РАС.&lt;/h4&gt;\n&lt;p&gt;Выявленная нами выраженная транскриптомная конвергенция в исследованиях нокаута (KD) позволила предположить, что кандидатные рисковые гены РАС можно выделить по следующим признакам: 1) устойчивое снижение экспрессии после нокаута генов РАС и 2) чувствительность к дозе, о чем свидетельствуют высокие оценки генных ограничений (Таблица SN, Методы). Этот подход позволил выявить 397 генов (Таблица SN), включая 113 генов SFARI (OR = 5,87, скорр. p = 1,85e-39) и 49 генов HC-SFARI (OR = 11,17, скорр. p = 1,11e-29), что демонстрирует эффективность данных критериев в приоритезации известных генов РАС.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Интеграция транскриптомной конвергенции и генных ограничений позволила выделить 397 кандидатных генов РАС, включая 162 гена из базы SFARI, без обогащения генами исключительно умственной отсталости.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Стоит отметить, что этот набор генов не показал обогащения генами, связанными только с умственной отсталостью (OR = 1,01, скорр. p = 0,509). В пользу значимости для РАС остальных 284 не-SFARI генов говорит то, что все они демонстрируют значимую коэкспрессию с генами SFARI (все скорр. p &amp;lt; 0,05), что, как было показано ранее, помогает выявлять новые рисковые гены РАС. Более того, по меньшей мере сорок из этих генов демонстрируют определенную связь с РАС в одном или нескольких крупных секвенирующих исследованиях (Таблица SN). Например, мутации в AKT3, классически связанные с расстройствами избыточного роста мозга, такими как мегаленцефалия, недавно были ассоциированы с РАС; другие гены, такие как KIF11, KIF2A и SOS1, также связывали с РАС в ряде исследований (см. ссылки в Таблице SN). Следовательно, оставшиеся гены заслуживают рассмотрения в качестве кандидатных рисковых генов РАС.&lt;/p&gt;\n&lt;h4 id=\"geny-ras-reguliruyut-proliferaciyu-nervnyh-kletok-predshestvennikov-npc\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#geny-ras-reguliruyut-proliferaciyu-nervnyh-kletok-predshestvennikov-npc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гены РАС регулируют пролиферацию нервных клеток-предшественников (NPC).&lt;/span&gt;&lt;/a&gt;Гены РАС регулируют пролиферацию нервных клеток-предшественников (NPC).&lt;/h4&gt;\n&lt;p&gt;Многие нарушения генов РАС также вызывали схожие фенотипические эффекты в NPC. Анализ пролиферации с использованием наследуемого красителя (CytoTrack) показал, что 9 из 18 (50%) нокаутов привели к статистически значимому снижению пролиферации (Рис. 1f, Рис. SN и Таблица SN), включая несколько генов, вовлеченных в развитие микроцефалии (SETD1B, SETD2, SETD5, KMT2E и WAC). Напротив, лишь 1 из 18 (5,6%) нокаутов привел к значительному увеличению скорости пролиферации NPC.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Пролиферация — это процесс активного деления и размножения клеток, который в данном случае измерялся с помощью специальной метки для оценки здоровья и роста нервных предшественников.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Это предполагает, что сниженная пролиферация NPC является общим фенотипом, возникающим в результате нарушения работы различных генов РАС, что согласуется с предыдущими данными. Расшифровка конкретных взаимосвязей между этими молекулярными фенотипами и аномальным размером головы при РАС представляет собой сложную задачу, поскольку в литературе сообщается об увеличении частоты как микроцефалии, так и макроцефалии у людей с аутизмом. Действительно, две мишени нокаута, которые, как мы установили, снижают пролиферацию в NPC — SETD2 и KMT2E — ассоциировались как с микроцефалией, так и с макроцефалией в зависимости от конкретных вариантов, изучаемых в этих генах.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Наблюдаемые изменения пролиферации получены на клеточных моделях in vitro, и точный механизм их трансляции в изменение размера головы человека еще предстоит окончательно установить.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Таким образом, хотя нарушение пролиферации NPC представляет собой конвергентный фенотип, наблюдаемый при многих наших возмущениях, то, как это связано с последующими изменениями размера головы, еще предстоит определить.&lt;/p&gt;\n&lt;h4 id=\"narushenie-genov-autizma-izmenyaet-razvitie-cerebralnyh-organoidov\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#narushenie-genov-autizma-izmenyaet-razvitie-cerebralnyh-organoidov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нарушение генов аутизма изменяет развитие церебральных органоидов&lt;/span&gt;&lt;/a&gt;Нарушение генов аутизма изменяет развитие церебральных органоидов&lt;/h4&gt;\n&lt;p&gt;Индуцируемый нокаут (KD) в церебральных органоидах дополнительно выявил общие нейроонтогенетические фенотипы. Для проведения этих исследований на органоидах мы создали конструкцию FLICK (FLEx-based Inducible CRISPR Knockdown). Система FLICK позволяет управлять временем нокаута посредством генетической рекомбинации, индуцируемой доксициклином, что приводит к конститутивной экспрессии CasRx и репортера EGFP (Рис. 2a) и обеспечивает эффективный нокаут (Рис. SN 7a). Конструкции FLICK также содержат маркерные последовательности, которые могут быть сроднены при секвенировании РНК единичных клеток (scRNA-seq) и использованы для определения мишени нокаута в конкретной клетке, что позволяет проводить анализ мозаичных церебральных органоидов. Для долгосрочных исследований мы выбрали гены аутизма (ASD), нокаут которых не приводил к нарушению пролиферации клеток-предшественников нейронов (NPC) в наших экспериментах CytoTrack (Таблица SN 10). Конструкции FLICK, нацеленные на эти гены или экспрессирующие нерелевантные гидовые РНК (NTC gRNA), были по отдельности перенесены в индуцированные плюрипотентные стволовые клетки (iPSC). Затем мы использовали сортировку клеток, активируемую флуоресценцией (FACS), чтобы выделить клетки, интегрировавшие конструкции FLICK, на основе экспрессии флуоресцентного репортера TagBFP. После FACS мы объединили равные количества FLICK+ iPSC для каждой мишени нокаута вместе с таким же количеством NTC iPSC и культивировали эту смешанную популяцию iPSC в течение четырех дней для восстановления перед созданием мозаичных органоидов (день 0). Рекомбинация конструкции FLICK, приводящая к конститутивной экспрессии CasRx и репортера EGFP, индуцировалась примерно в 10% клеток путем обработки доксициклином с 14–15-го дня, когда органоиды состояли преимущественно из PAX6+ NPC (Рис. SN 7b). Впоследствии эти органоиды выращивали до одного или двух месяцев развития (Рис. 2b) и анализировали методом scRNA-seq, который позволил идентифицировать все ожидаемые типы клеток (Рис. 2c-d и Рис. SN 7c-d), включая радиальные глиальные прогениторы (RG), промежуточные клетки-предшественники (IPC), тормозные нейроны (IN) и возбуждающие нейроны (ExN). Дополнительный анализ scRNA-seq также подтвердил, что конструкция FLICK способна обеспечивать эффективный нокаут (Рис. SN 7e).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-f2.jpg\" alt=\"Рисунок 2./ Нарушение функций генов аутизма изменяет развитие церебральных органоидов. a, Дизайн конструкций FLICK для и\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2./ Нарушение функций генов аутизма изменяет развитие церебральных органоидов. a, Дизайн конструкций FLICK для индуцируемого доксициклином нокдауна CasRx. Конструкции FLICK также экспрессируют гидовые РНК (gRNA, не показаны). b, Органоид FLICK после 2 месяцев развития, репрезентативный для трех независимых анализов с аналогичными результатами. Иммуногистохимия была выполнена для визуализации экспрессии следующих маркеров: EGFP = конструкция FLICK; DAPI = ядра, PAX6 = NPC; TBR2 = промежуточные клетки-предшественники; CTIP2 = возбуждающие нейроны. c, Экспрессия канонических маркерных генов мозга, используемых для идентификации типов клеток с помощью scRNA-seq. d, UMAP интегрированных данных scRNA-seq долгосрочных органоидов, собранных через один и два месяца. e, Относительное содержание клеток для каждой мишени KD из мозаичных органоидов через один или два месяца. Результаты нормализованы по исходной пропорции для каждого образца на 0-й день и отображены относительно контролей без мишени (NTC) из той же временной точки. На графике показано среднее значение +/- SEM. Конструкции FLICK индуцировались обработкой доксициклином на 14–15 дни (d14-d15). Статистическую значимость оценивали с помощью одностороннего ANOVA с повторными измерениями и тестом множественных сравнений Даннетта. n = три биологически независимых образца на одно условие. f, Клеточный состав по каждой мишени KD в органоидах возрастом один месяц. Пунктирные линии указывают пропорции NTC основных типов клеток (радиальная глия, промежуточные предшественники и нейроны). Образцы, у которых пропорция ExN/RG существенно отличалась от NTC, отмечены звездочкой (&lt;/em&gt;, скорр. p &amp;lt; 0.05). Статистический анализ проводился с использованием стандартного одностороннего ANOVA с тестом множественных сравнений Даннетта, с учетом всех долгосрочных образцов за один месяц (показано здесь) и два месяца (см. рис. 7f Расширенных данных).*&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нокаут генов аутизма BAZ2B, CLASP1 и EHMT1 приводил к истощению популяции клеток в органоидах и сдвигу дифференцировки в сторону возбуждающих нейронов за счет сокращения радиальной глии (p = 0.021, 0.018 и 0.012 соответственно).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Долгосрочный нокаут в органоидах выявил общие фенотипы при различных возмущениях. Некоторые нокауты, особенно направленные на BAZ2B, CLASP1 и EHMT1, истощались в органоидах по сравнению с NTC (Рис. 2e), несмотря на то что эти нокауты не нарушали пролиферацию в культурах NPC (Рис. SN 6a и Таблица SN 10). Это расхождение между нашими культурами NPC и органоидами предполагает, что долгосрочные органоиды, поддерживающие как пролиферацию прогениторов, так и дифференцировку, могут выявлять нейроонтогенетические фенотипы, которые не очевидны в краткосрочных культурах NPC. Интересно, что микроцефалия ассоциируется с патогенными вариантами в этих генах, что согласуется с фенотипами органоидов. Кроме того, эти нокауты также изменяли соотношение типов клеток в органоидах, приводя к относительному увеличению числа ExN и уменьшению числа RG (adj. p = 0.021 для BAZ2B, 0.018 для CLASP1 и 0.012 для EHMT1, однофакторный дисперсионный анализ ANOVA с поправкой Даннетта на множественные сравнения) (Рис. 2f и Рис. SN 7f). В совокупности это предполагает, что нарушение данных генов может приводить к усилению дифференцировки ExN в ущерб самообновлению RG. Большинство других нокаутов также демонстрировали тенденцию к увеличению доли ExN к моменту 2-месячного срока, что указывает на конвергентный нейроонтогенетический фенотип, согласующийся с предыдущими наблюдениями.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод scRNA-seq (секвенирование РНК единичных клеток) позволяет детально изучить профиль экспрессии тысяч отдельных клеток, а органоиды представляют собой трехклеточные мини-модели мозга, выращенные из стволовых клеток в лаборатории.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Истощение генов ASD также приводило к выраженной транскрипционной конвергенции в церебральных органоидах (Рис. 3a и Рис. SN 7g). RG с различными нокаутами демонстрировали сильно перекрывающиеся дифференциально экспрессирующиеся гены (DEG), что дополнительно подтверждает наши результаты, полученные на культурах NPC. Действительно, DEG, выявленные в RG органоидов, сильно перекрывались с DEG, выявленными при нокауте той же мишени в культурах NPC (Рис. SN 7h), что предполагает отсутствие специфичности этих эффектов экспрессии генов к какому-либо конкретному экспериментальному контексту. Транскрипционная конвергенция также наблюдалась в других типах клеток, включая IPC и ExN (Рис. 3a и Рис. SN 7g), что доказывает: конвергенция генов ASD в отношении общих нисходящих эффектов не является уникальной особенностью только нейральных прогениторов. Это согласуется с исследованиями, выявляющими общие DEG аутизма в посмертной ткани мозга людей с различными причинами ASD, а также с повсеместными наблюдениями конвергентных фенотипов ExN, таких как нарушение структуры или активности синапсов при нарушении различных генов ASD, что говорит о том, что конвергенция отражает не просто общее изменение типа клеток или судьбы клеток-предшественников. Более того, мы обнаруживаем, что обнаружение перекрывающихся DEG с помощью scRNA-seq сильно зависит от количества клеток, секвенированных для каждого возмущения, как показано в результате анализа с понижающей выборкой (Рис. 3b). Эта зависимость от размера выборки может частично объяснять отсутствие надежной транскрипционной конвергенции, наблюдаемой на уровне отдельных генов в некоторых предыдущих исследованиях с меньшим размером выборок. Наше использование изогенного генетического фона также, вероятно, способствовало обнаружению транскрипционной конвергенции, поскольку ранее было обнаружено, что различные генетические фоны существенно влияют на нейроонтогенетические фенотипы, возникающие в результате нарушения генов ASD в органоидах. Наконец, хотя некоторые конвергентно нарушенные гены были специфичны для определенных типов клеток, многие гены стабильно нарушались во множестве типов клеток, включая DEG из базы SFARI (Рис. 3c). Это предполагает, что, несмотря на специфичные для типов клеток особенности, влияющие на транскрипционные последствия нарушений генов ASD, определенные эффекты могут быть широко разделены самыми разными клеточными типами.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-f3.jpg\" alt=\"Рисунок 3./ Транскриптомная конвергенция при возмущении генов аутизма в церебральных органоидах. a, Тепловая карта перек\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3./ Транскриптомная конвергенция при возмущении генов аутизма в церебральных органоидах. a, Тепловая карта перекрестного обогащения DEG для радиальной глии и возбуждающих нейронов в долгосрочных органоидах. b, Круговые диаграммы, обозначающие пропорции парных наборов DEG, которые демонстрируют значительное перекрестное обогащение (транскриптомная конвергенция). Уменьшение выборки (даунсэмпл) количества клеток на одно условие до числа, указанного над каждой круговой диаграммой, уменьшает наблюдаемую транскриптомную конвергенцию. c, Сетевая визуализация DEG, общих для различных условий KD и типов клеток. Толщина ребер представляет количество общих DEG. Узлы нанесены на график на основе кластеризации с использованием алгоритма Фрухтермана — Рейнгольда (igraph). Узлы, расположенные ближе друг к другу, в среднем имеют больше общих DEG. d, Доля клеток с каждой мишенью KD по данным scRNA-seq мозаичных органоидов с острым KD. e, UMAP мозаичных органоидов с острым KD по данным scRNA-seq. f, Тепловая карта перекрестного обогащения между различными образцами KD в органоидах с острым KD.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"transkriptomnaya-konvergenciya-posle-ostryh-vozmushenij-v-cerebralnyh-organoidah\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#transkriptomnaya-konvergenciya-posle-ostryh-vozmushenij-v-cerebralnyh-organoidah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Транскриптомная конвергенция после острых возмущений в церебральных органоидах&lt;/span&gt;&lt;/a&gt;Транскриптомная конвергенция после острых возмущений в церебральных органоидах&lt;/h4&gt;\n&lt;p&gt;Острое подавление генов РАС в 2-месячных органоидах выявило еще большую конвергенцию по общим дифференциально экспрессируемым генам (DEG). Дополнительный набор мозаичных органоидов FLICK выращивали в течение двух месяцев до индукции нокдауна (KD) с помощью обработки доксициклином с 61–62-го дня с последующим scRNA-seq двумя днями позже, что позволило нам определить острые эффекты нарушения этих генов в органоидах, которые развивались нормально. Этот подход привел к сопоставимому количеству клеток на каждый нокдаун (Рис. 3d и Рис. SN 7i), что обеспечило более глубокий анализ нокдаунов, которые истощались в органоидах при долгосрочном нокдауне (Рис. 2e). Как и ожидалось, эти органоиды содержали смесь типов клеток (Рис. 3e и Рис. SN 7j), причем возбуждающие нейроны (ExN) были с большим отрывом наиболее распространенным типом клеток на данной стадии развития (Рис. SN 7k). Интересно, что многие нокдауны приводили к появлению DEG в ExN, которые были обогащены DEG, выявленными из культур предшественников нервных клеток (NPC) (Рис. SN 7l), что снова указывает на общие изменения экспрессии генов в разных типах клеток при нокдауне генов РАС. Более того, острый нокдаун целевых генов, которые были истощены из органоидов в ходе долгосрочного нокдауна (Рис. 2e), позволил нам получить гораздо больший объем клеток для этих воздействий, показав, что эти нокдауны также приводят к сильной транскриптомной конвергенции (Рис. 3f).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Острый нокдаун генов РАС в органоидах подтверждает выраженную транскриптомную конвергенцию и затрагивает ключевые типы клеток, такие как возбуждающие нейроны.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"klyuchevye-transkripcionnye-faktory,-vklyuchaya-rest,-naceleny-na-povtorno-disreguliruemye-geny-transkripcionnye\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#klyuchevye-transkripcionnye-faktory,-vklyuchaya-rest,-naceleny-na-povtorno-disreguliruemye-geny-transkripcionnye\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ключевые транскрипционные факторы, включая REST, нацелены на повторно дисрегулируемые гены. Транскрипционные&lt;/span&gt;&lt;/a&gt;Ключевые транскрипционные факторы, включая REST, нацелены на повторно дисрегулируемые гены. Транскрипционные&lt;/h4&gt;\n&lt;p&gt;регуляторы, которые могли опосредовать транскрипционную конвергенцию при РАС, были идентифицированы с помощью анализа MAGIC (Методы), в котором используются данные секвенирования иммунопреципитации хроматина (ChIP-seq) из ENCODE для выявления транскрипционных факторов и кофакторов, чьи мишени связывания обогащены в интересующем наборе генов. Это выявило транскрипционные регуляторы, чьи целевые гены повторно дифференциально экспрессировались при многих нокдаунах генов РАС в NPC (Рис. SN 8a и Таблица SN 11), включая высокоуверенные гены SFARI (HC-SFARI), такие как CHD2 и SIN3A. Среди повторно выявляемых регуляторов MAGIC, ранее не связанных с РАС, несколько были как высоко консервативными (Таблица SN 7), так и коэкспрессируемыми с известными генами РАС (Рис. SN 8a), — особенности, которые, как было показано, предсказывают новые геномные риски РАС4. Анализ MAGIC также выявил стабильные драйверы конвергенции в органоидах (Рис. SN 8a и Таблица SN 11). Из числа основных повторяющихся транскрипционных регуляторов, идентифицированных в NPC, половина (13/26, 50%) также была обнаружена в радиальных глиях (RG) органоидов (Рис. SN 8b). MAGIC также выявил повторяющиеся регуляторы ExN, общие для разных стадий развития и для временных шкалах долгосрочного и острого нокдаунов, включая множество генов SFARI. Интересно, что девять из этих генов также были идентифицированы как ведущие транскрипционные регуляторы в нейральных предшественниках, что предполагает их роль ключевых драйверов конвергенции в множественных клеточных контекстах. Особый интерес представляет фактор транскрипции с репрессией RE1 (REST), который был значимым по результатам MAGIC в 17/18 (94,4%) возмущений NPC (Рис. SN 8a) и стабильно выступал в роли ведущего регулятора MAGIC во всех протестированных условиях (Рис. SN 8b). Хотя прямые мутации REST ранее не связывались с РАС, REST играет критическую роль в нейроразвитии и функционирует как главный негативный регулятор нейрогенеза40,41. Дисрегуляция REST также регистрировалась после нарушения генов РАС, таких как CHD842 и ген синдрома Ретта MECP243,44. Повторный анализ сайтов связывания ChIP-seq REST у человека и мышей (Методы) выявил сильное обогащение генов SFARI (с поправкой p = 3,6e-67 и 7,7e-50 соответственно), включая HC-SFARI гены (с поправкой p = 2,2e-13 и 3,7e-8 соответственно) среди мишеней REST (Рис. SN 8c), что подтверждает ключевую роль REST в регуляции экспрессии генов, релевантных РАС.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод ChIP-seq позволяет картировать сайты связывания белков с ДНК по всему геному, а анализ MAGIC выявляет общие регуляторные сети для наборов генов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rekonstrukciya-gennoj-regulyatornoj-seti-vyyavlyaet-vysoko-vzaimosvyazannye-geny-ras\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#rekonstrukciya-gennoj-regulyatornoj-seti-vyyavlyaet-vysoko-vzaimosvyazannye-geny-ras\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Реконструкция генной регуляторной сети выявляет высоко взаимосвязанные гены РАС&lt;/span&gt;&lt;/a&gt;Реконструкция генной регуляторной сети выявляет высоко взаимосвязанные гены РАС&lt;/h4&gt;\n&lt;p&gt;De novo реконструкция генной регуляторной сети (GRN) на основе наших данных RNA-seq NPC с использованием алгоритма ARACNe позволила связать дополнительные транскрипционные факторы и модификаторы хроматина — совместно именуемые «регуляторами» — с их нижестоящими мишенями (регулонами) (Методы). Мы валидировали этот подход путем раздельного построения «отложенных» (held-out) GRN, исключающих данные из образцов, в которых сама мишень нокдауна выступала потенциальным регулятором, что предотвращало цикличность при предсказании регулонов. Регулоны, предсказанные на основе этих отложенных GRN, сильно перекрывались с DEG, наблюдаемыми после нокдауна соответствующих целевых генов в NPC (с поправкой p для каждого &amp;lt; 3,98e-116, суммарное p = 4,08e-937) (Рис. 4a и Рис. SN 9a). Таким образом, ARACNe эффективно улавливает подлинные регуляторные взаимосвязи. Полная GRN NPC выявила высокую степень взаимосвязи между генами РАС и их вышестоящими регуляторами (Рис. 4b). Действительно, гены РАС были сильно обогащены среди центральных генов GRN NPC (с поправкой p = 9,81e-6 для генов SFARI, 1,99e-4 для HC-SFARI генов, центральность оценивалась алгоритмом PageRank, Методы) (Рис. 4c). Напротив, гены, связанные исключительно с умственной отсталостью (ID-only), не демонстрировали обогащения среди центральных генов GRN (с поправкой p = 0,19), что согласуется с отсутствием обогащения, которое мы наблюдалось среди DEG в результате нокдаунов генов РАС (Рис. 1c). Кроме того, центральные гены GRN были обогащены путями, связанными с контрольной точкой G2M (с поправкой p = 6,0e-4) и митотическим веретеном (с поправкой p = 3,6e-5), что согласуется с фенотипами пролиферации NPC, которые мы наблюдали (Рис. 1f и Таблица SN 10).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-f4.jpg\" alt=\"Рисунок 4./ Анализ генно-регуляторных сетей идентифицирует CHD8 в качестве ключевого драйвера конвергенции при аутизме. \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4./ Анализ генно-регуляторных сетей идентифицирует CHD8 в качестве ключевого драйвера конвергенции при аутизме. a, Вулканический график, отображающий дифференциальную экспрессию при нокдауне KMT2E. Выделены гены, которые, согласно прогнозам анализа GRN, положительно регулируются KMT2E: статистически значимо сниженные DEG показаны синим цветом, повышенные DEG — красным (нет), а мишени без значимых изменений — желтым. Статистически значимые DEG были определены с помощью DESeq2 (тест Вальда) с поправкой Бенджамини — Хохберга для множественной проверки гипотез. Статистически значимое обогащение генов регулона 2-го порядка среди доунорегулированных DEG обозначается скорректированным значением p (односторонние точные тесты Фишера с поправкой Бенджамини — Хохберга для множественной проверки гипотез). b, Изображение подмножества GRN NPC, построенного с использованием ARACNE. Все регуляторы показаны вместе с генами-мишенями первого порядка, которые являются генами SFARI. c, Анализ обогащения наборов генов (GSEA) (взвешенная накопительная сумма Колмогорова — Смирнова, перестановочный тест с поправкой Бенджамини — Хохберга для множественной проверки гипотез), демонстрирующий обогащение генов с высокими показателями PageRank в наборах генов, показанных на рисунке. d, Столбчатая диаграмма, отображающая среднюю нормализованную степень (мера взаимосвязи) среди регуляторов из разных наборов генов. e, Изображение модулей топ-регуляторов, выявленных с помощью итеративной кластеризации методом walktrap. Штриховые линии указывают на то, что эти линии выполнены не в масштабе. Гены, представляющие особый интерес, выделены большими стрелками. Мишени KD, которые далее анализируются на панели E, выделены красным шрифтом. f, Столбчатая диаграмма, отображающая обогащение мишеней CHD8 в нескольких наборах генов. Данные ChIP-seq CHD8 в NPC из работы Sugathan et al. (2014)45. Столбцы показывают отношение шансов (OR) по одностороннему точному тесту Фишера; планки погрешностей показывают нижнюю границу 95% доверительного интервала для OR (верхняя граница для одностороннего теста не определена). Значения p скорректированы с использованием поправки Бенджамини — Хохберга для множественной проверки гипотез.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"analiz-gennoj-regulyatornoj-seti-opredelyaet-chd8-kak-klyuchevoj-drajver-konvergencii-pri-rasstrojstvah-autisticheskogo-spektra\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#analiz-gennoj-regulyatornoj-seti-opredelyaet-chd8-kak-klyuchevoj-drajver-konvergencii-pri-rasstrojstvah-autisticheskogo-spektra\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ генной регуляторной сети определяет CHD8 как ключевой драйвер конвергенции при расстройствах аутистического спектра&lt;/span&gt;&lt;/a&gt;Анализ генной регуляторной сети определяет CHD8 как ключевой драйвер конвергенции при расстройствах аутистического спектра&lt;/h4&gt;\n&lt;p&gt;Затем мы выделили регуляторы генной регуляторной сети (ГРС), которые действуют как ключевые драйверы транскрипционной конвергенции, ассоциированной с РАС. Этот анализ выявил 70 основных драйверов конвергенции, активность которых стабильно изменялась при нокдауне генов РАС (Методы) и мишени которых как обогащены генами SFARI, так и занимают центральное место в ГРС (Таблица S12). Почти половина этих основных драйверов конвергенции представляют собой гены SFARI (31/70, ОШ = 6,35, скор. p = 3,9e-11), а почти треть — высокоуверенные гены HC-SFARI (22/70, ОШ = 10,61, скор. p = 6,7e-12). Напротив, лишь семь из этих основных драйверов конвергенции являются исключительно генами умственной отсталости (ID-only) (7/70, ОШ = 2,06, скор. p = 0,078). Более того, эти основные драйверы конвергенции демонстрировали стабильное снижение экспрессии почти при всех нокдаунах генов РАС (Рис. S9b). Они также сильно взаимосвязаны в ГРС (p &amp;lt; 1e-6) (Рис. 4d), а также в базе данных белковых взаимодействий STRING (p = 2,0e-9) (Методы).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS9.jpg\" alt=\"Расширенные данные, рисунок 9. / Основные драйверы конвергенции, выявленные путем реконструкции генной регуляторной сети\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Расширенные данные, рисунок 9. / Основные драйверы конвергенции, выявленные путем реконструкции генной регуляторной сети NPC. a, Вулканические диаграммы, отображающие дифференциальную экспрессию при нокдауне регулятора, показанного над диаграммой. Гены, предсказанные в результате анализа GRN как положительно регулируемые указанным регулятором, выделены: статистически значимо сниженные DEG показаны синим цветом, увеличенные DEG — красным цветом, а мишени без значимых изменений — желтым цветом. Статистически значимые DEG определялись с использованием DESeq2 (тест Вальда) с поправкой Бенджамини — Хохберга для множественной проверки гипотез. Статистически значимое обогащение генов регулона 2-й степени среди пониженно экспрессируемых DEG указано скорректированным значением p (односторонние точные тесты Фишера с поправкой Бенджамини — Хохберга для множественной проверки гипотез). b, Тепловая карта, показывающая относительную экспрессию основных драйверов конвергенции GRN в различных образцах нокдауна генов РАС. Статистически значимые DEG определялись с использованием DESeq2 (тест Вальда) с поправкой Бенджамини — Хохберга для множественной проверки гипотез и отмечены знаком &lt;em&gt;. Гены, которые были идентифицированы среди 26 сильнейших генов риска РАС в работе Satterstrom et al. (2020)1, выделены жирным шрифтом.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анализ ГРС выявил 70 ключевых драйверов транскрипционной конвергенции при РАС, среди которых преобладают гены SFARI, демонстрирующие сильную взаимосвязь и координированное снижение экспрессии при нокдауне.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В совокупности это предполагает, что данные гены действуют не только как центральные регуляторы многих генов РАС, но и перекрестно регулируют друг друга, обусловливая транскрипционную конвергенцию при РАС. Итеративная кластеризация методом walktrap выявила четыре модуля генов среди 70 основных драйверов конвергенции (Рис. 4e), один из которых (синий) характеризовался особенно сильной взаимосвязью. Этот модуль демонстрировал очень высокий уровень перекрестных взаимодействий по данным анализа STRING (p &amp;lt; 1e-16) и включал REST (Рис. S8), а также несколько примечательных генов РАС, включая CHD8 — один из самых сильных известных генов риска РАС. Важно отметить, что предсказанный регулон CHD8 на основе ГРС был сильно обогащен (регулон 1-й степени, скор. p = 4,6e-7; регулон 2-й степени, скор. p = 3,9e-20) прямыми генами-мишенями CHD8, ранее идентифицированными с помощью ChIP-seq в клетках-предшественниках нейронов (NPC) (Рис. 4f), что дополнительно подтверждает валидность регуляторных связей, предсказанных с помощью ARACNe.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS8.jpg\" alt=\"Расширенные данные, рисунок 8. / Ключевые факторы транскрипции, включая REST, нацелены на рекуррентно дисрегулируемые ге\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Расширенные данные, рисунок 8. / Ключевые факторы транскрипции, включая REST, нацелены на рекуррентно дисрегулируемые гены. a, Анализ MAGIC (критерий Колмогорова — Смирнова с поправкой Бенджамини — Хохберга для множественной проверки гипотез), выявляющий транскрипционные регуляторы, чьи мишени были обогащены среди DEG из различных типов клеток после нокдауна генов РАС. Для каждой популяции регуляторы MAGIC оценивались по количеству нокдаунов генов РАС, в которых участвовал данный регулятор. Регуляторы с наивысшими оценками включены сюда вместе с любыми дополнительными регуляторами с равными оценками. b, Количественные диаграммы Эйлера, отображающие перекрывающиеся транскрипционные регуляторы MAGIC, выявленные в различных условиях. c, Столбчатая диаграмма, отображающая обогащение генов SFARI, HC-SFARI или только ID среди мишеней REST из эмбриональных стволовых клеток человека и мыши. Данные о мишенях REST из работы Rockowitz &amp;amp; Zheng (2015)66. Столбцы показывают отношение шансов (OR) по результатам одностороннего точного теста Фишера; планки погрешностей указывают нижнюю границу 95% доверительного интервала для OR (верхняя граница для одностороннего теста не определена). Значения p скорректированы с использованием поправки Бенджамини — Хохберга для множественной проверки гипотез.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод ChIP-seq (хроматин-импреципитация с последующим секвенированием) позволяет выявить участки генома, с которыми физически связываются конкретные белки-регуляторы, такие как транскрипционные факторы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Более того, в соответствии с предыдущими отчетами, мишени ChIP-seq для CHD8 также были существенно обогащены экспрессирующимися в NPC генами SFARI (скор. p = 2,6e-8) и HC-SFARI (скор. p = 8,5e-8). Модуль, содержащий CHD8, также включал три транскрипционных регулятора (SETD2, SETD5 и KMT2E), в отношении которых мы проводили прямые воздействия, а дифференциально экспрессирующиеся гены (DEG) при этих нокдаунах демонстрировали значительное обогащение мишенями ChIP-seq CHD8 (скор. p = 1,2e-5, 7,8e-8 и 2,6e-4 соответственно) (Рис. 4f), что дополнительно демонстрирует конвергентную регуляцию общих мишеней критическими генами РАС. Данный анализ подчеркивает, что CHD8 — ген высокого риска РАС — выступает ключевым драйвером транскрипционной конвергенции при РАС.&lt;/p&gt;\n&lt;h4 id=\"x-sceplennyj-transkripcionnyj-faktor-zfx-yavlyaetsya-regulyatorom-genov-ras-so-smesheniem-v-storonu-zhenskogo-pola\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#x-sceplennyj-transkripcionnyj-faktor-zfx-yavlyaetsya-regulyatorom-genov-ras-so-smesheniem-v-storonu-zhenskogo-pola\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;X-сцепленный транскрипционный фактор ZFX является регулятором генов РАС со смещением в сторону женского пола&lt;/span&gt;&lt;/a&gt;X-сцепленный транскрипционный фактор ZFX является регулятором генов РАС со смещением в сторону женского пола&lt;/h4&gt;\n&lt;p&gt;Предыдущие исследования показали, что гены, снижающие экспрессию при РАС, как правило, экспрессируются на более высоком уровне в мозге нейротипичных женщин по сравнению с мужчинами, что повышает вероятность того, что такая базовая экспрессия со смещением в сторону женского пола может способствовать защитному эффекту женского пола. Мы выделили 82 гена, экспрессия которых стабильно снижалась при нокдауне генов РАС и которые демонстрировали экспрессию со смещением в сторону женского пола в головном мозге (Методы); 28 из них характеризовались высокой консервативностью (Рис. S10a), включая 12 высококонсервативных генов SFARI (ОШ = 2,79, p = 8,65e-3) (Рис. 5a).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS10.jpg\" alt=\"Расширенные данные, рисунок 10. / ZFX демонстрирует экспрессию с женским смещением в головном мозге и рекуррентно снижае\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Расширенные данные, рисунок 10. / ZFX демонстрирует экспрессию с женским смещением в головном мозге и рекуррентно снижается при нокдауне генов РАС. a, Тепловые карты, показывающие относительную экспрессию кандидатов-участников FPE при РАС. Слева: экспрессия в NPC в условиях нокдауна относительно NTC, со статистически значимыми DEG (отмечены *), определенными с использованием DESeq2 (тест Вальда) с поправкой Бенджамини — Хохберга для множественной проверки гипотез. Справа: экспрессия в ExN у мужчин с РАС относительно мужских идиопатических контролей, переанализированная из работы Dias et al. (2024)47, со статистически значимыми DEG (отмечены &lt;em&gt;), определенными с использованием MAST (тест отношения правдоподобия) с поправкой Бонферрони для множественной проверки гипотез. Отсутствие обнаружения указано буквой X. b, Столбчатая диаграмма, отображающая достоверно смещенную в сторону женщин экспрессию ZFX в нескольких тканях центральной нервной системы (ЦНС) человека, включая пренатальную и взрослую кору. Отдельные регионы обозначены разными цветами. Представленные уровни экспрессии и статистические результаты взяты непосредственно из следующих источников: (1) Benoit-Pilven et al. (2025)67, (2) Kissel et al. (2024)68 и (3) Fass et al. (2024)69. Подробную информацию о статистическом анализе см. в соответствующем источнике. c, Тепловая карта, отображающая экспрессию ZFX в различных областях коры и типах клеток потносительно экспрессии у мужчин. Типы клеток и области сокращены так же, как в источнике: DeCasien et al. (2026)62.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS10-2.jpg\" alt=\"Рис. S10 (продолжение 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S10 (продолжение 2)&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Идентификация 82 генов со сниженной экспрессией при нокдауне генов РАС и женским смещением экспрессии в мозге указывает на их вклад в половые различия при аутизме.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Повторный анализ данных одноядерного секвенирования РНК (Методы) из лобной коры нейротипичных мужчин-контролей и мужчин с аутизмом (включая лиц с синдромом дупликации 15q и генетически идиопатическим РАС) показал, что многие из этих высококонсервативных генов значительно снижены в экспрессии в возбуждающих нейронах мужчин с аутизмом, что дополнительно подтверждает их значимость для РАС (Рис. 5a и Рис. S10a).&lt;/p&gt;\n&lt;p&gt;Среди них ZFX представляет особый интерес, поскольку он экспрессируется как с активной, так и с инектвной X-хромосомы у женщин, что делает его одним из наиболее сильно и стабильно смещенных в сторону женского пола генов в различных тканях, включая развивающийся кору головного мозга (Рис. S10b-c). Более того, в недавнем отчете патогенные варианты ZFX были связаны с РАС, а дополнительные кодирующие варианты в гене ZFX также были обнаружены у пробандов с РАС. ZFX кодирует мощный транскрипционный активатор общегеномных мишеней, и в нашей ГРС мы выделили множество регуляторных связей между ZFX и наборами генов, имеющих отношение к РАС (Рис. 5b), включая основные драйверы транскрипционной конвергенции при РАС, выявленные нами ранее (ОШ = 9,8, скор. p = 2,2e-6).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдаемые регуляторные связи и экспрессионные паттерны получены на моделях и человеческих образцах in vitro/ex vivo, поэтому для установления строгих причинно-следственных механизмов требуются дополнительные функциональные исследования in vivo.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы также обнаружили, что ZFX является нисходящей мишенью многих из этих основных драйверов, причем с несколькими взаимными регуляторными связями (Рис. 5c). Сильное обогащение мишеней ZFX генами, имеющими отношение к РАС, было дополнительно подтверждено повторным анализом данных ChIP-seq для ZFX (Рис. 5d). Поскольку ZFX регулярно снижает экспрессию при нарушении работы генов РАС, его экспрессия со смещением в сторону женского пола в сочетании с ролью регулятора генов, связанных с РАС, может приводить к каскадным и масштабным межполовым различиям во влиянии на экспрессию генов РАС, потенциально внося вклад в защитный эффект женского пола при РАС (Рис. 5e).&lt;/p&gt;\n&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;p&gt;В настоящей работе мы показываем масштабную транскриптомную конвергенцию после нокдауна генов расстройств аутистического спектра (РАС) и выделяем ключевые модуляторы хроматина и факторы транскрипции, включая CHD8 и REST, в качестве критических драйверов этой конвергенции. Эти драйверы были тесно связаны друг с другом, часто через взаимные регуляторные отношения, показывая, как нарушение одного регулятора может привести к изменениям, распространяющимся по всей генно-регуляторной сети (ГРС). Мы также идентифицировали фактор транскрипции ZFX, экспрессирующийся как с активной, так и с инертной X-хромосомы у женщин, в качестве ключевого регулятора транскрипции генов РАС; таким образом, повышенная у женщин экспрессия ZFX может нивелировать эффекты нарушений генов РАС у самок, способствуя защитному эффекту женского пола (FPE) при РАС. В совокупности эта работа предоставляет модель того, как различные геномы могут сходиться на ключевых транскриптомных изменениях и в конечном итоге формировать общие фенотипы РАС, а также того, как полоспецифическая активность этих генов может приводить к повышенному риску РАС у мужчин.&lt;/p&gt;\n&lt;p&gt;Наша способность выявить масштабную транскриптомную конвергенцию, вероятно, выиграла от нескольких решений экспериментального дизайна, направленных на минимизацию вариабельности. Например, чтобы избежать мешающих эффектов различных геномных фонов, мы предпочли нарушать гены РАС на изогенном фоне. Кроме того, мы проводили эти возмущения путем введения конструкций нокдауна (KD) поликлональным образом, вместо создания отдельных клеточных линий для каждого целевого гена РАС, поскольку процесс клональной селекции может приводить к вариабельности между линиями. Для исследований церебральных органоидов мы создали конструкцию FLICK KD так, чтобы можно было получать мозаичные органоиды, содержащие все условия KD, а также контрольные образцы без таргетинга (NTC), сводя к минимуму эффекты вариабельности между органоидами. Снижая вариабельность в наших экспериментальных схемах, мы, вероятно, повысили чувствительность к обнаружению конвергенции. Мы также оптимизировали подходы секвенирования РНК (RNA-seq) для различных экспериментальных контекстов. Первоначально мы использовали высокооднородные культуры клеток-предшественников нейронов (NPC), что позволило нам выполнить объемное секвенирование РНК (bulk RNA-seq) для этого единственного типа клеток. Это обеспечило глубокое транскриптомное профилирование, позволив избежать проблем «выпадения данных» (dropout), затрагивающих секвенирование РНК единичных клеток (scRNA-seq). Однако для образцов, содержащих гетерогенную смесь различных типов клеток, таких как церебральные органоиды, bulk RNA-seq может отражать не только изменения экспрессии генов, но и различия в относительной численности типов клеток. Поэтому мы использовали scRNA-seq для анализа наших органоидов и стремились преодолеть сниженную чувствительность этого подхода путем секвенирования большого числа клеток для каждого условия KD. Как показал наш анализ субдискретизации (Рис. 3б), это большое количество клеток имело решающее значение для обнаружения транскриптомной конвергенции с помощью scRNA-seq. Более того, для экспериментов с NPC мы проводили RNA-seq через 24 часа после введения конструкций KD. Мы выбрали этот короткий промежуток времени, чтобы сфокусировать наш анализ на первичных эффектах каждого KD, а не на долгосрочных последствиях, на которые могут сильнее влиять компенсаторные ответы и стохастические эффекты. Этот короткий промежуток времени может быть особенно хорошо подходит для обнаружения транскриптомной конвергенции, что дополнительно пошло на пользу нашей реконструкции ГРС.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Экспериментальные подходы на изогенных клеточных линиях и органоидах позволили выявить масштабную транскриптомную конвергенцию, где CHD8 и REST выступают ключевыми драйверами в сети ГРС.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Понимание сложных взаимосвязей внутри ГРС имеет решающее значение для выявления ключевых «лимитирующих скорость» генов, которые влияют на ГРС в целом и в конечном итоге приводят к конкретному биологическому исходу. Предыдущие исследования болезни Гиршспрунга выявили аналогичную ГРС, сосредоточенную вокруг лимитирующего скорость гена RET, на который могут влиять как прямые мутации в самом RET, так и нарушения его вышестоящих регуляторов. Здесь мы аналогичным образом идентифицировали критические гены, такие как CHD8 и REST, эффекты которых могут распространяться по всей ГРС и стимулировать транскриптомную конвергенцию при РАС. Наши результаты согласуются с предыдущими исследованиями, определяющими CHD8 как важный регулятор экспрессии генов РАС. Более того, было обнаружено, что гаплонедостаточность CHD8 приводит к дисрегуляции REST в мозге мышей, что согласуется с тесно взаимосвязанными отношениями, обнаруженными нами в ГРС. Кроме того, нарушение гена синдрома Ретта MECP2 затрагивает REST, а REST дисрегулирован в ткани мозга при РАС по сравнению с нейротипичными контролями, что дополнительно подтверждает его значимость для РАС. Учитывая, что REST является главным негативным регулятором нейрональных генов, а CHD8 влияет на пролиферацию и нейрогенез, вполне вероятно, что конвергентная дисрегуляция мишеней CHD8/REST может напрямую лежать в основе измененной пролиферации, обнаруженной нами в NPC (Рис. 1ф), а также повышенного относительного изобилия возбуждающих нейронов, наблюдавшегося нами после нокдауна некоторых генов РАС в органоидах (Рис. 2ф). В нескольких предыдущих исследованиях также выявлялись дисбалансы между нейрональной пролиферацией и дифференцировкой после возмущений, связанных с РАС; таким образом, будущая работа по дальнейшей характеристике молекулярных механизмов, связывающих наблюдаемые нами конвергентные изменения экспрессии генов с этими общими нервно-психическими фенотипами, будет крайне ценной.&lt;/p&gt;\n&lt;p&gt;Наши результаты также предоставляют новые сведения о мужской предрасположенности к РАС. Снижение экспрессии ZFX при нокдауне многих различных генов РАС в NPC, а также более низкие уровни ZFX в возбуждающих нейронах у лиц с РАС (Рис. 5а) предполагают, что сниженная экспрессия ZFX может быть повторяющейся транскриптомной особенностью РАС. Более высокий базовый уровень ZFX в женском мозге благодаря его экспрессии с обеих X-хромосом может тем самым защищать женщин от этого связанного с РАС снижения экспрессии. Согласуясь с этим, недавнее исследование полоспецифической экспрессии генов в разных типах клеток коры головного мозга показало, что промоторы аутосомных генов, демонстрирующих женскую предрасположенность к экспрессии, обогащены мотивами факторов транскрипции ZFX, в то время как промоторы мужских генов — нет. В то время как у мужчин есть сцепленный с Y-хромосомой гомолог ZFX под названием ZFY, он кодирует более слабый активатор транскрипции, чем ZFX, и регулон ГРС для ZFY не показав обогащения генами SFARI (отношение шансов ОР = 1.1, скорректированное p = 0.36), что указывает на дивергентные роли в отношении РАС. Дальнейшая функциональная характеристика ZFX и других генов, экспрессирующихся с инертной X-хромосомы, может дать важнейшее понимание того, как полоспецифическая экспрессия может влиять на риск РАС. Более того, ценным будет также прямое сравнение транскриптомных эффектов возмущений генов РАС между мужскими клеточными линиями, использованными в данном исследовании, и женскими клеточными линиями. Действительно, использование нами мужской, а не женской исходной клеточной линии могло способствовать поразительным изменениям экспрессии генов, которые мы наблюдали, поскольку женские клетки могут лучше переносить те же нокдауны генов РАС благодаря более высокой базовой экспрессии ZFX и/или дополнительным факторам, способствующим FPE.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Генно-регуляторная сеть (ГРС) — это сложная система взаимодействия генов и белков в клетке, определяющая активность генома и развитие патологий.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Учитывая, что многие гены, вовлеченные в РАС, демонстрируют редкие гетерозиготные мутации потери функции (LoF), в нашем исследовании приоритет отдавался генам РАС с высокой вероятностью непереносимости потери функции. Кроме того, мы сосредоточились на генах, демонстрирующих конфигурацию «голова к голове» с соседней длинной некодирующей РНК (lncRNA); было обнаружено, что несколько lncRNA в такой конфигурации тонко настраивают экспрессию своих соседей, потенциально выявляя особо чувствительные к дозе гены. Мы дополнительно включили две lncRNA, которые сами были вовлечены в РАС через редкие гетерозиготные LoF-мутации. Наши нокдауны на основе Cas13 в среднем приводили к снижению экспрессии целевых генов на 48.2% (Дополнительная Таблица 2), — экспериментальный подход, который кажется хорошо подходящим для изучения того, как гетерозиготная LoF этих гаплонедостаточных генов может способствовать развитию РАС.&lt;/p&gt;\n&lt;p&gt;Хотя наши возмущения были сосредоточены на генах, связанных с РАС посредством редких одногенных мутаций, вполне вероятно, что другие классы вариантов, связанных с РАС, также нарушают эту же конвергентную сеть. В подтверждение этого исследования постмортальной ткани мозга показали, что случаи идиопатического РАС разделяют основные транскриптомные изменения и перекрывающиеся паттерны метилирования ДНК с случаями РАС, вызванными редкими мутациями с большим размером эффекта, такими как дупликация хромосомы 15q11-13. Более того, отчеты предполагают, что общие аллели с меньшим размером эффекта, вовлеченные в РАС, также могут вызывать изменения, которые сходятся с изменениями, вызванными редкими вариантами РАС. Это поднимает интригующую возможность того, что различные причины РАС — включая редкие одногенные мутации, крупные вариации числа копий (CNV) и общую генетическую вариабельность — могут приводить к схожим фенотипам за счет конвергенции на нарушении общих ГРС, связанных с РАС. Дальнейшая характеристика этих ГРС обладает широким потенциалом для уточнения нашего понимания генетической архитектуры РАС в широком спектре классов генетических вариантов, открывая потенциальные терапевтические мишени, которые могли бы принести пользу лицам с различными причинами РАС.&lt;/p&gt;\n&lt;p&gt;Более того, хотя эта работа была сосредоточена на РАС, использованные здесь подходы широко применимы к различным типам клеток и состояниям. Таким образом, данное исследование служит основой для выявления критических регуляторов транскрипции в самом широком разнообразии контекстов, от развития до болезни.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты получены на клеточных моделях и органоидах in vitro, что требует дальнейшей проверки на клинических образцах in vivo для подтверждения причинно-следственных связей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"nokdaun-s-ispolzovaniem-casrx\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#nokdaun-s-ispolzovaniem-casrx\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нокдаун с использованием CasRx&lt;/span&gt;&lt;/a&gt;Нокдаун с использованием CasRx&lt;/h4&gt;\n&lt;p&gt;CasRx17, а именно NLS-RfxCas13d-NLS (Addgene #109049), использовался в комбинации со специфичными для мишени направляющими РНК (gRNA) для нокдауна (KD) целевых транскриптов. Инструмент на основе глубокого обучения применялся для проектирования спейсерных последовательностей gRNA, направленных на интересующие гены. Эти спейсерные последовательности фильтровались для исключения гомополимеров (более 4 A, более 3 C, G или T). Спейсерные последовательности с потенциальным внецелевым взаимодействием выявлялись с помощью BLAST и исключались. Для каждого целевого гена выбирались 3 отдельные спейсерные последовательности и объединялись в тандемный пре-gRNA-матрикс, причем каждой спейсерной последовательности предшество
