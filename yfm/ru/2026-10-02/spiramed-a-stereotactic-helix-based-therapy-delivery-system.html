        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"273\" cy=\"133\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"667\" cy=\"269\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · BIOENGINEERING   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Спиральный катетер SpiraMed:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;новый способ доставки&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;лекарств прямо в мозг&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system-f1.jpg\" alt=\"Рисунок 1. Концепция доставки терапии в мозг SpiraMed.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Концепция доставки терапии в мозг SpiraMed.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1. Концепция доставки терапии в мозг SpiraMed. A: Каждая траектория доступа иглы SpiraMed через лобную долю позволяет ортогонально развернуть катетер доставки SpiraMed, охватывающий длинную ось полосатого тела. B: Прототип SpiraMed второго поколения, система автоматизированного проектирования, иллюстрирующая развертывание спирали. C: Стратегия двусторонней доставки в скорлупу, предусмотренная для введения АТМП при болезни Паркинсона, дефиците AADC или болезни Гентингтона. Двусторонний доступ иглы SpiraMed к передней части полосатого тела через стандартные лобные фрезевые отверстия сопровождается развертыванием катетера SpiraMed, охватывающего целевой объем скорлупы (зеленый цвет). Смоделирован шаг спирали катетера SpiraMed 8 мм, диаметр 8 мм с 4,5 витками спирали. Траектория и целевые ядра визуализированы в отдельных аксиальной, коронарной и сагиттальной плоскостях (верхние панели) и в виде соответствующих 3D-объемных наложений (нижние панели). D: Пример стратегии доставки для введения химиотерапии при мультифокальной глиоме высокой степени злокачественности, признанной непригодной для хирургической резекции. Траектории лобного и теменного доступа SpiraMed запланированы, соответственно, кпереди и кзади от первичной моторной и сенсорной коры. Смоделирован шаг спирали катетера SpiraMed 8 мм, диаметр 8 мм с 6 витками спирали для лобного катетера и 4,5 витками для теменного. Траектории и приблизительные объемы лечения визуализированы в отдельных аксиальной, коронарной и сагиттальной плоскостях (верхние панели) и в виде соответствующих 3D-объемных наложений (нижние панели).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Доставка лекарств в глубокие структуры мозга — сложная задача, требующая множества проколов и долгой операции. Новая система SpiraMed использует гибкий спиральный катетер, который вводится через один доступ и равномерно распределяет препарат внутри целевой зоны. Это сокращает время хирургического вмешательства и снижает риск повреждения здоровых тканей.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Система SpiraMed использует один доступ вместо нескольких, снижая риск кровоизлияний.&lt;/li&gt;\n&lt;li&gt;Спиральная форма катетера позволяет точно адаптировать объем доставки под анатомию пациента.&lt;/li&gt;\n&lt;li&gt;Тесты подтвердили сохранение жизнеспособности клеток после прохождения через катетер.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Стандартная стереотаксическая (метод точного наведения инструментов в заданную точку мозга) доставка препаратов часто требует нескольких траекторий введения иглы, что повышает риск кровоизлияний и увеличивает длительность операции до 10–12 часов. Система SpiraMed решает эту проблему за счет использования спирального катетера, который разворачивается непосредственно в целевой области мозга. Геометрия спирали — шаг и диаметр — настраивается индивидуально на основе предоперационных МРТ-снимков и данных о сосудистой анатомии пациента.&lt;/p&gt;\n&lt;p&gt;В ходе доклинических испытаний на агарозных фантомах (гелевых моделях мозга), овцах и человеческих кадаврах исследователи продемонстрировали, что SpiraMed обеспечивает более быстрое и равномерное распределение терапевтических агентов. Применение устройства позволило увеличить порог объема введения без обратного заброса (рефлюкса) препарата по каналу иглы с 64 мкл до 290 мкл. Важно, что прохождение через систему не снижает жизнеспособность дофаминергических клеток-предшественников и CAR-T клеток, что критически важно для эффективности клеточной терапии.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование является доклиническим и проводилось на животных моделях и кадаврах, поэтому эффективность и безопасность для живых людей еще предстоит доказать в клинических испытаниях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Стереотаксическая инъекция с использованием игл остается «золотым стандартом» для локальной доставки передовых терапевтических медицинских продуктов (ATMP) в ткани головного мозга. Однако традиционные методы требуют создания множества траекторий введения, что увеличивает продолжительность операции и повышает кумулятивный риск повреждения тканей. Кроме того, часто возникают проблемы с неравномерным распределением препарата и его обратным током (рефлюксом) вдоль канала иглы, что снижает эффективность лечения.&lt;/p&gt;\n&lt;p&gt;Авторы представляют инновационную систему «SpiraMed», использующую спиральный катетер для доставки лекарственных средств. Главное преимущество метода заключается в возможности охвата целевой области через единственный доступ. В процессе введения происходит синхронизированное извлечение спирали, что позволяет равномерно распределить препарат по всему объему мишени за считанные секунды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Система SpiraMed обеспечивает полный охват целевой зоны мозга через один прокол, минимизируя риск рефлюкса и сокращая время хирургического вмешательства.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Параметры спирали, включая шаг витка и диаметр, подбираются индивидуально для каждого пациента на этапе предоперационного планирования с учетом анатомических особенностей сосудистой сети и объема целевой структуры. Эффективность системы была подтверждена в ходе серии экспериментов: на агарозных фантомах, на моделях живых овец, а также на кадаверных препаратах головного мозга человека.&lt;/p&gt;\n&lt;p&gt;Результаты показали значительное увеличение объема и скорости доставки терапевтических агентов при одновременном улучшении равномерности покрытия мишени. Кроме того, использование SpiraMed позволило существенно снизить вероятность рефлюкса препарата и уменьшить прогнозируемый риск геморрагических осложнений. Данная технология открывает новые перспективы для реализации терапевтического потенциала клеточной и генной терапии при широком спектре заболеваний центральной нервной системы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Агарозные фантомы — это гелевые модели, имитирующие физические свойства тканей мозга, которые используются для первичной проверки точности доставки препаратов перед испытаниями на биологических объектах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"problema-dostavki-terapevticheskih-agentov-v-cns\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#problema-dostavki-terapevticheskih-agentov-v-cns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Проблема доставки терапевтических агентов в ЦНС&lt;/span&gt;&lt;/a&gt;Проблема доставки терапевтических агентов в ЦНС&lt;/h4&gt;\n&lt;p&gt;Заболевания центральной нервной системы (ЦНС) ежегодно уносят 11 миллионов жизней, затрагивая 3,4 миллиарда человек. Гематоэнцефалический барьер ограничивает системную терапию, из-за чего лишь 8% препаратов успешно проходят клинические испытания. Прямое введение в паренхиму мозга остается единственным способом доставки клеточных, генных и химиотерапевтических агентов в нужных концентрациях. Сейчас проводится более 60 испытаний генной терапии и 20 — клеточной замены. Однако существующие методы, основанные на стереотаксических иглах, заимствованы из доклинических исследований на грызунах. Применяемые устройства, такие как катетер ClearPoint Neuro SmartFlow, не были специально разработаны для сложных задач, например, восстановления дофаминергической иннервации при болезни Паркинсона (БП).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Существующие методы доставки в мозг ограничены использованием прямых игл, что требует множественных проколов, увеличивает риск кровоизлияний и время операции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В исследовании TRANSEURO (NCT01898390) введение фетальных дофаминергических графтов потребовало 5 траекторий для каждого стриатума и 10–12 часов операции на полушарие. Внутримозговое кровоизлияние возникло у 2 из 11 пациентов, а длительность процедуры могла снизить жизнеспособность клеток. Система SpiraMed была создана для преодоления этих ограничений.&lt;/p&gt;\n&lt;h4 id=\"ogranicheniya-sovremennoj-nejrohirurgicheskoj-dostavki\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#ogranicheniya-sovremennoj-nejrohirurgicheskoj-dostavki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения современной нейрохирургической доставки&lt;/span&gt;&lt;/a&gt;Ограничения современной нейрохирургической доставки&lt;/h4&gt;\n&lt;p&gt;Объем человеческого стриатума (35 000 мм³) в 1000 раз превышает объем стриатума мыши (23 мм³). Это вынуждает хирургов использовать множественные траектории, что повышает риск повреждения сосудов (до 1% на каждое введение иглы) и развития гематом. Кроме того, «рефлюкс» (обратный ток препарата вдоль иглы) ограничивает скорость инфузии и объем распределения, что ведет к неравномерному покрытию мишени. Длительные операции увеличивают анестезиологические риски и вероятность развития пролежней, а также риск смещения мозга из-за утечки ликвора.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Конвекционно-усиленная доставка (CED) — метод введения препаратов под давлением для равномерного распределения в тканях мозга, который, однако, часто сталкивается с проблемой обратного тока жидкости (рефлюкса).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;При генной терапии путамена диффузия ограничена миллиметрами, а использование CED часто дает лишь 26% покрытия целевого объема. Попытки улучшить покрытие через задние траектории требуют сложного позиционирования пациента и прохождения иглы через важные зоны коры. Мы предлагаем решение SpiraMed: использование одной фронтальной траектории с ортогональным развертыванием катетера вдоль длинной оси путамена, что позволяет минимизировать риски и обеспечить полное покрытие мишени.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Представленные данные являются доклиническим доказательством концепции; эффективность и безопасность метода SpiraMed требуют подтверждения в клинических условиях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"koncepciya-dostavki-spiramed-na-osnove-spirali-i-prototipirovanie\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#koncepciya-dostavki-spiramed-na-osnove-spirali-i-prototipirovanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Концепция доставки SpiraMed на основе спирали и прототипирование&lt;/span&gt;&lt;/a&gt;Концепция доставки SpiraMed на основе спирали и прототипирование&lt;/h4&gt;\n&lt;p&gt;Система SpiraMed использует стандартное стереотаксическое оборудование и программное обеспечение для планирования, позволяя доставить терапевтический агент по одной траектории. Спиральный катетер выдвигается из наконечника иглы, охватывая целевой объем, а затем постепенно втягивается с синхронной подачей препарата, что минимизирует обратный заброс (рефлюкс) (Рис. 1A; Рис. SN 1). Разработаны два поколения прототипов: первое (механическое) и второе (электронное) (Рис. 1B; Рис. SN 1–5). Планы операций включают двустороннюю доставку препаратов в скорлупу (putamen) через лобные траектории (Рис. 1C) и химиотерапию мультифокальной глиомы высокой степени злокачественности через лобные и теменные доступы (Рис. 1D).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system-f1.jpg\" alt=\"Рисунок 1. Концепция доставки терапии в мозг SpiraMed.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Концепция доставки терапии в мозг SpiraMed.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1. Концепция доставки терапии в мозг SpiraMed. A: Каждая траектория доступа иглы SpiraMed через лобную долю позволяет ортогонально развернуть катетер доставки SpiraMed, охватывающий длинную ось полосатого тела. B: Прототип SpiraMed второго поколения, система автоматизированного проектирования, иллюстрирующая развертывание спирали. C: Стратегия двусторонней доставки в скорлупу, предусмотренная для введения АТМП при болезни Паркинсона, дефиците AADC или болезни Гентингтона. Двусторонний доступ иглы SpiraMed к передней части полосатого тела через стандартные лобные фрезевые отверстия сопровождается развертыванием катетера SpiraMed, охватывающего целевой объем скорлупы (зеленый цвет). Смоделирован шаг спирали катетера SpiraMed 8 мм, диаметр 8 мм с 4,5 витками спирали. Траектория и целевые ядра визуализированы в отдельных аксиальной, коронарной и сагиттальной плоскостях (верхние панели) и в виде соответствующих 3D-объемных наложений (нижние панели). D: Пример стратегии доставки для введения химиотерапии при мультифокальной глиоме высокой степени злокачественности, признанной непригодной для хирургической резекции. Траектории лобного и теменного доступа SpiraMed запланированы, соответственно, кпереди и кзади от первичной моторной и сенсорной коры. Смоделирован шаг спирали катетера SpiraMed 8 мм, диаметр 8 мм с 6 витками спирали для лобного катетера и 4,5 витками для теменного. Траектории и приблизительные объемы лечения визуализированы в отдельных аксиальной, коронарной и сагиттальной плоскостях (верхние панели) и в виде соответствующих 3D-объемных наложений (нижние панели).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стереотаксис — метод нейрохирургии, позволяющий с высокой точностью вводить инструменты в глубокие структуры мозга по заданным координатам.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Прототипы первого поколения используют ручной механизм для формирования спирали с фиксированными параметрами (Рис. SN 2). Второе поколение использует электронный привод, который направляет катетер по изогнутой траектории, одновременно создавая осевое кручение для формирования спирали (Рис. 2A; Рис. SN 3–5). Этот подход позволяет варьировать шаг и диаметр спирали в зависимости от скорости вращения катетера, согласно формулам Френе-Серре (Рис. 2B). Для иглы с радиусом наконечника rtip=4 мм показаны достижимые параметры (Рис. 2C). Компоненты выполнены из нержавеющей стали 316L, что обеспечивает биосовместимость и безопасность. Игла имеет внешний диаметр 14G (2 мм), а катетер — 20G (внешний диаметр 0,91 мм, внутренний — 0,6 мм).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system-f2.jpg\" alt=\"Рисунок 2. A: Шаг спирали p и диаметр d катетера SpiraMed прогнозируются согласно модели Френе-Серре как функция радиуса\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2. A: Шаг спирали p и диаметр d катетера SpiraMed прогнозируются согласно модели Френе-Серре как функция радиуса внутреннего пути иглы доставки rtip, скорости осевого вращения и константы f, отражающей свойства деформации катетера.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 2. A: Шаг спирали p и диаметр d катетера SpiraMed прогнозируются согласно модели Френе-Серре как функция радиуса внутреннего пути иглы доставки rtip, скорости осевого вращения и константы f, отражающей свойства деформации катетера. B: Соответствующие уравнения и прогнозируемые спирали показаны для радиуса наконечника rtip= 4 мм, f = 0,86 и скоростей вращения катетера = (i) 35°/мм (ii) 15°/мм (iii) 1°/мм (см. также Дополнительный рисунок 4B). C: Измеренные и прогнозируемые размеры спирали показаны для радиуса наконечника иглы доставки rtip= 4 мм, f = 0,86 в зависимости от скорости вращения катетера (см. также Дополнительный рисунок 4C). D: Пример лабораторного тестирования SpiraMed: развертывание и втягивание (rtip=3 мм; скорость вращения = 5°/мм). E: При каждой показанной скорости вращения 5 последовательных развертываний катетера SpiraMed из одного наконечника иглы SpiraMed rtip= 3 мм дали показанные шаги спирали (средняя панель) и диаметры (правая панель). F: Лабораторное тестирование SpiraMed на агарозных фантомах мозга. G: При каждой показанной концентрации агарозы три репликатных катетера доставки SpiraMed были развернуты и втянуты три раза через один и тот же наконечник иглы SpiraMed rtip= 3 мм со скоростью вращения катетера = 5,73°/мм. Двухфакторный дисперсионный анализ (ANOVA) выявляет значительный эффект концентрации агарозы на шаг спирали (F = 12,74, df = 4, p&amp;lt;0,001), но не на количество развертываний (F = 2,05, df = 2, p = 0,1462). Попарные тесты Тьюки выявили значительно уменьшенный шаг в 4,0% агарозе по сравнению со всеми другими условиями (p&amp;lt;0,01 во всех случаях), при этом никакие другие сравнения не достигли значимости. Не выявлено значительного влияния концентрации агарозы или количества развертываний на диаметр спирали.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"razmery-spirali-i-razvertyvanie\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#razmery-spirali-i-razvertyvanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Размеры спирали и развертывание&lt;/span&gt;&lt;/a&gt;Размеры спирали и развертывание&lt;/h4&gt;\n&lt;p&gt;Для таких целей, как скорлупа головного мозга человека (размером около 4x2x1 см), оптимальным компромиссом между длиной траектории и охватом объема являются спирали с шагом и диаметром около 8 мм (Рис. 2D). Повторяемость размеров спиралей при заданной скорости вращения оказалась крайне высокой (Рис. 2E). Небольшие отклонения от теоретических расчетов Френе-Серре объясняются физическими факторами, такими как упругая деформация иглы, и легко корректируются в ПО (Рис. 2C; Рис. SN 4B).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Точность развертывания спирали SpiraMed превышает стандартные требования нейрохирургии (1–1,5 мм), а параметры спирали остаются стабильными даже в плотных средах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для проверки устойчивости к отклонениям спирали тестировали в агарозных гелях (0,6–4,0% масс./об.), имитирующих ткани мозга и мышц (Рис. 2F). В гелях концентрацией до 2,0% значимых изменений не выявлено. Лишь в самых жестких гелях (4,0%) шаг спирали незначительно, но статистически значимо уменьшался, при этом диаметр оставался неизменным (Рис. 2G; Рис. SN 2). Таким образом, метод SpiraMed обеспечивает предсказуемую доставку, полностью соответствующую клиническим стандартам точности.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на физических моделях (агарозных фантомах), что не полностью отражает сложность живой мозговой ткани.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"dostavka-terapii-v-fantomah-mozga\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#dostavka-terapii-v-fantomah-mozga\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Доставка терапии в фантомах мозга&lt;/span&gt;&lt;/a&gt;Доставка терапии в фантомах мозга&lt;/h4&gt;\n&lt;p&gt;Мы оценили эффективность доставки терапевтических агентов, используя красители аллура красный и метиленовый синий для анализа покрытия целевой области и обратного тока (рефлюкса). Синхронизация подачи красителя с извлечением катетера позволила доставить 110 мкл препарата по траектории длиной 110 мм за 90 секунд без возникновения рефлюкса (Рис. 3A). Интервальная визуализация агарозных моделей подтвердила быстрое и равномерное распределение объема препарата за счет диффузии вдоль спиральной траектории (Рис. 3B).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system-f3.jpg\" alt=\"Рисунок 3. A: Пример развертывания и втягивания катетера SpiraMed, синхронизированного с доставкой красителя без рефлюкс\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3. A: Пример развертывания и втягивания катетера SpiraMed, синхронизированного с доставкой красителя без рефлюкса в целевые объемы агарозного фантома мозга 0,6% (масса/объем).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 3. A: Пример развертывания и втягивания катетера SpiraMed, синхронизированного с доставкой красителя без рефлюкса в целевые объемы агарозного фантома мозга 0,6% (масса/объем). B: Визуализация диффузии терапии по всему целевому объему в течение нескольких часов после доставки. C: Тестовые объемы красителя (100 мкл, 200 мкл, 300 мкл, 500 мкл, 700 мкл, 900 мкл) вводились в трех повторностях в свежие блоки агарозы, при этом объем распределялся между 3 прямыми введениями иглы (левая панель) или вводился за одну доставку SpiraMed (правая панель). Объем рефлюкса измерялся путем взвешивания промокательной бумаги до и после. Оценки максимального объема доставки, связанного с нулевым рефлюксом («порог рефлюкса»), представлены как x-пересечения полученных линейных регрессий: 64 мкл (34-90 мкл) для 3 прямых игл по сравнению с 290 мкл (181-365 мкл) для одной доставки SpiraMed. F-тест подтверждает значительную разницу в x-пересечениях/пороге рефлюкса (F-тест F=101,0, DFn=1, Dfd=24, P&amp;lt;0,0001). D: Пример изображений и интегрированной плотности красителя внутри (синяя &lt;a href=\"concepts/roi.html\"&gt;ROI&lt;/a&gt;)/снаружи (красная ROI) целевого объема для одной доставки SpiraMed (слева) и пяти стереотаксических траекторий (справа). Всего было введено 350 мкл метиленового синего в водном растворе, повторено для 4 реплик в каждом условии. Очевидны значительные различия в плотности красителя внутри цели (непарный t-тест t=0,004) и вне цели (непарный t-тест t=0,001).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SpiraMed обеспечивает порог рефлюкса 290,5 мкл, что значительно выше 64,0 мкл для стандартных игл, позволяя вводить большие объемы препарата.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сравнение SpiraMed с традиционным методом стереотаксических игл показало преимущество спиральной доставки (Рис. 4C). При использовании трех прямых проколов иглой (по 100 мм) порог рефлюкса составил 64,0 мкл (95% ДИ 34,3–90,2 мкл), тогда как для одного введения через SpiraMed (шаг 3 мм, диаметр 11 мм, 8 витков, общая длина 300 мм) этот показатель достиг 290,5 мкл (95% ДИ 181,1–365,1 мкл) (Рис. 4B). Оценка распределения красителя в агарозном кубе показала, что средняя плотность в целевом объеме для SpiraMed составила 20351 против 17136 при пятикратной стандартной инъекции (t=4,53, q=0,004). При этом рефлюкс в «доступную кору» был ниже у SpiraMed (10517 против 15603, t=5,56, q=0,0029) (Рис. 3D).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system-f4.jpg\" alt=\"Рисунок 4. A: Протокол дифференцировки, используемый для создания дофаминергических клеток-предшественников (слева, по K\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4. A: Протокол дифференцировки, используемый для создания дофаминергических клеток-предшественников (слева, по Kunath et al.45).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 4. A: Протокол дифференцировки, используемый для создания дофаминергических клеток-предшественников (слева, по Kunath et al.45). Популяции предшественников, пригодные для трансплантации, экспрессируют маркеры среднего мозга OTX2, LMX1A, FOXA2 методом иммунофлуоресценции на 16-й день (верхняя правая панель). Дальнейшая дифференцировка in vitro дает TH/MAP2-положительные дофаминергические нейроны к 60-му дню (нижняя правая панель). Масштабные линейки 20 мкм. B: Иммунофлуоресцентная оценка маркеров предшественников среднего мозга в культивируемых дофаминергических предшественниках 16-го дня (левая панель) и после диссоциации, аспирации в катетер доставки SpiraMed, последующего развертывания катетера и доставки клеток обратно в планшеты. Масштабная линейка 100 мкм. C: Пример проточной цитометрической оценки включения пропидиум иодида (PI) (маркер мертвых клеток) в культивируемых предшественниках mDA (слева) и то же самое после аспирации и доставки через систему SpiraMed (в центре). Процент живых клеток (отрицательных по пропидиум иодиду) показан для 3 биологических репликатных партий клеток (одна партия — культура живых клеток до 16-го дня, две партии — криоконсервированные и восстановленные за 4 часа до доставки). Разницы в выживаемости между контрольными и доставленными через SpiraMed фракциями не выявлено (парный t-тест t=1,9; df=2; p=0,20). D: Схематическое представление протокола, используемого для создания CAR-T клеток из первичных PBMCs доноров-людей (слева), и изображения в светлом поле CAR-T клеток, совместно культивируемых с GFP-меченными стволовыми клетками глиомы, напрямую (контроль) или после аспирации/доставки SpiraMed. Масштабные линейки 100 мкм. E: Пример проточной цитометрической оценки включения маркера мертвых клеток в канале 488 нм в CAR-T клетках (слева) и то же самое после аспирации и доставки через систему SpiraMed (в центре). Процент живых клеток (отрицательных по 488 нм) после показан для немодифицированных T-клеток и партий CAR T-клеток и парных аналогов, через 0 часов и 24 часа после аспирации/доставки SpiraMed. Разницы в выживаемости между контрольными и доставленными через SpiraMed фракциями не выявлено (t=2,1, df=3, p=0,13).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"biosovmestimost-s-atmp\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#biosovmestimost-s-atmp\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Биосовместимость с АТМП&lt;/span&gt;&lt;/a&gt;Биосовместимость с АТМП&lt;/h4&gt;\n&lt;p&gt;Хотя сталь 316L считается биосовместимой, мы проверили влияние развертывания спирали на клеточную терапию (АТМП). Мы использовали прогениторные дофаминергические клетки среднего мозга (vmDA) (8x10^6 кл/мл). После прохождения через катетер SpiraMed (5 витков, скорость извлечения 1 мм/с, подача 1 мкл/с) жизнеспособность клеток, измеренная проточной цитометрией, не изменилась (Рис. 4B, 4C). Аналогичные результаты получены для CAR-T клеток при сокультивировании с глиомными стволовыми клетками: жизнеспособность оставалась неизменной через 0 и 24 часа после доставки (Рис. 4D, 4E).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;АТМП (Advanced Therapy Medicinal Products) — это препараты на основе генов, тканей или клеток, требующие крайне бережного обращения при введении.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"issledovaniya-na-krupnyh-zhivotnyh-i-trupnom-materiale\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#issledovaniya-na-krupnyh-zhivotnyh-i-trupnom-materiale\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Исследования на крупных животных и трупном материале&lt;/span&gt;&lt;/a&gt;Исследования на крупных животных и трупном материале&lt;/h4&gt;\n&lt;p&gt;В экспериментах на овцах контрастное вещество вводилось в глубокие структуры мозга: SpiraMed в одно полушарие и три стандартные траектории в другое (Рис. 5A, 5B). Объем контраста в целевой зоне был выше при использовании SpiraMed (среднее 782,1 мкл против 196,8 мкл; p=0,0497) (Рис. 5C). При стандартном методе в одном случае наблюдались микрокровоизлияния, тогда как с SpiraMed осложнений не зафиксировано (Рис. 5D). Наконец, на человеческих головах в стереотаксической раме Leksell G была подтверждена возможность интеграции SpiraMed в клинический процесс: после введения 1000 мкл контраста КТ показала точное формирование спирального объема (слева 700,8 мм³, справа 994,4 мм³) (Рис. 5E, 7D–F).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system-f5.jpg\" alt=\"Рисунок 5. Тестирование SpiraMed на живых животных и трупах людей.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5. Тестирование SpiraMed на живых животных и трупах людей.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 5. Тестирование SpiraMed на живых животных и трупах людей. A: Объемы контрастного вещества Niopam CT были доставлены в мозг 4 овец путем развертывания иглы SpiraMed через лобную долю в одно полушарие и через 3 траектории иглы SpiraMed без развертывания спирали в контралатеральное полушарие (слева). Прототип SpiraMed второго поколения, развернутый на стереотаксической раме Kopf для крупных животных, готовый к развертыванию катетера и доставке контрастного вещества, показан (справа). B: Аксиальная МРТ демонстрирует точечное контрастное усиление, совпадающее со спиральной траекторией доставки (слева). Коронарная КТ-визуализация демонстрирует фрезевое отверстие и траекторию доставки, достигнутую у живой овцы (справа). C: Реконструированные 3D-объемы контраста для полушарий, целевых для SpiraMed и иглы, у 4 овец (непарный t-тест с поправкой Уэлча, двусторонний p=0,0497, t=2,539, df=5,25). D: Секции макропатологии иллюстрируют целевые объемы после 3 обычных стереотаксических траекторий (красный) против одной доставки SpiraMed (синий). Микрокровоизлияние также выделено в поверхностном белом веществе, связанном с 3 проходами. E: Стратегия двусторонней доставки в скорлупу для валидации на трупах людей (верхние левые панели). Реконструкция компьютерной томографии демонстрирует стереотаксическую раму Leksell G, примененную к голове трупа, со SpiraMed, развернутым через лобное фрезевое отверстие (верхние правые панели). Доставка контраста в глубокие отделы мозга по двусторонним спиральным траекториям видна на КТ-реконструкциях, также видна костная анатомия основания черепа (нижние левые панели) и в виде объемных 3D-реконструкций (нижние правые панели; объем контраста левого полушария рассчитан как 701 мм3, правого полушария — 994 мм3).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system-f5-2.jpg\" alt=\"Рис. 5 (продолжение 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 5 (продолжение 2)&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование на животных и кадаверных моделях демонстрирует безопасность, однако требует подтверждения в клинических испытаниях на людях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;h4 id=\"preimushestva-i-klinicheskij-potencial-sistemy-spiramed\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#preimushestva-i-klinicheskij-potencial-sistemy-spiramed\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Преимущества и клинический потенциал системы SpiraMed&lt;/span&gt;&lt;/a&gt;Преимущества и клинический потенциал системы SpiraMed&lt;/h4&gt;\n&lt;p&gt;SpiraMed представляет собой инновационную технологию доставки терапевтических агентов в ткани головного мозга, призванную преодолеть ограничения существующих методов. В отличие от подхода с радиально-разветвленным развертыванием (RBD), который требует многократного введения, извлечения и переориентации катетера, что усложняет хирургический процесс и повышает риск рефлюкса, SpiraMed обеспечивает доставку препарата за один проход («single-pass»). Согласно Таблице 1, это значительно улучшает объем распределения терапии, покрытие целевой области и общую безопасность вмешательства.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SpiraMed сокращает общую длину траектории катетера в тканях мозга примерно на 50% по сравнению с пятью стандартными стереотаксическими доступами, что потенциально снижает риск травматизации и геморрагических осложнений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ATMP (Advanced Therapy Medicinal Products) — это лекарственные препараты передовой терапии, включающие генную терапию, клеточные технологии и тканевую инженерию, требующие высокоточной доставки в ЦНС.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы признаем, что расчет длины траектории не учитывает высокую васкуляризацию путамена, где даже небольшое кровоизлияние клинически значимо. Поэтому для перехода к клиническому применению необходимы дополнительные исследования сосудистой безопасности. Упрощение и ускорение хирургического протокола с помощью SpiraMed могут стать ключевыми факторами для масштабирования терапии ATMP до уровня рутинной клинической практики.&lt;/p&gt;\n&lt;h4 id=\"perspektivy-integracii-i-budushie-razrabotki\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#perspektivy-integracii-i-budushie-razrabotki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Перспективы интеграции и будущие разработки&lt;/span&gt;&lt;/a&gt;Перспективы интеграции и будущие разработки&lt;/h4&gt;\n&lt;p&gt;Технология SpiraMed открывает возможности для новых парадигм клинических исследований. Например, пациентам с болезнью Паркинсона, которым показана &lt;a href=\"concepts/dbs.html\"&gt;глубокая стимуляция мозга&lt;/a&gt; (DBS) субталамического ядра, можно предложить рандомизацию: только DBS или DBS в сочетании с клеточной заместительной терапией SpiraMed под одним наркозом. Это решит этические проблемы «ложных» (sham) операций. Кроме того, использование адаптивных систем DBS для мониторинга локальных потенциалов поля поможет оценивать функциональное приживление трансплантированных клеток.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Предложенные сценарии комбинированной терапии и интеграции с DBS на данном этапе являются концептуальными и требуют подтверждения в рамках будущих клинических испытаний.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Помимо клеточной терапии, SpiraMed в сочетании с конвекционно-усиленной доставкой (CED) может применяться для введения больших объемов генно-терапевтических препаратов, исключая необходимость в дополнительных задних траекториях. Дальнейшее развитие системы включает внедрение программного обеспечения для планирования стереотаксических операций, механизмов экстренного извлечения катетера при сбоях питания и переход на титановые сплавы для совместимости с интраоперационной МРТ. Интеграция с роботизированными платформами может сделать процедуру еще более быстрой и точной, способствуя реализации потенциала новых классов ATMP при лечении заболеваний ЦНС.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Множественные&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;проколы мозга&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;при терапии&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Гибкий&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;спиральный&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;катетер&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;SpiraMed&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Равномерная&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;доставка без&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;рефлюкса&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Безопасная и&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;быстрая&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нейрохирургия&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не прошёл рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-02/spiramed-a-stereotactic-helix-based-therapy-delivery-system.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Кат
