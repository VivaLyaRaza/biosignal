        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"213\" cy=\"96\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"607\" cy=\"216\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Почему при болезни Гоше&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;возникают судороги: ответ&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;скрыт в развитии мозга&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta-f1.jpg\" alt=\"Рис. 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"concepts/gaucher-disease.html\"&gt;Болезнь Гоше&lt;/a&gt; часто сопровождается тяжелыми неврологическими нарушениями, включая эпилептические приступы. Долгое время механизмы этих процессов оставались неясными из-за ограничений животных моделей. Исследователи создали &lt;a href=\"concepts/forebrain-organoids.html\"&gt;органоиды переднего мозга&lt;/a&gt;, которые имитируют развитие болезни у человека. Это позволило увидеть, как накопление липидов меняет баланс между возбуждением и торможением в нейронных сетях.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Мутация GBA1 ведет к накоплению липидов и нарушению метаболизма в нейронах&lt;/li&gt;\n&lt;li&gt;Органоиды мозга показали сдвиг баланса в сторону глутаматергического возбуждения&lt;/li&gt;\n&lt;li&gt;ГАМК-ергические нейроны теряют способность подавлять избыточную активность сети&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Болезнь Гоше — это лизосомная болезнь накопления, вызванная мутациями в гене GBA1, который кодирует фермент глюкоцереброзидазу. При дефиците этого фермента в клетках накапливаются глюкозилцерамид и &lt;a href=\"concepts/glucosylsphingosine.html\"&gt;глюкозилсфингозин&lt;/a&gt;. Авторы работы использовали &lt;a href=\"concepts/induced-pluripotent-stem-cells.html\"&gt;индуцированные плюрипотентные стволовые клетки&lt;/a&gt; (&lt;a href=\"concepts/ipsk.html\"&gt;иПСК&lt;/a&gt;) для создания изогенных линий, что позволило изолировать влияние мутации GBA1 от генетического фона. Из этих клеток были выращены кортикальные и субпаллиальные органоиды переднего мозга.&lt;/p&gt;\n&lt;p&gt;Анализ методом секвенирования РНК единичных клеток (&lt;a href=\"concepts/scrna-seq.html\"&gt;scRNA-seq&lt;/a&gt;) показал, что мутация приводит к ранним нарушениям метаболизма липидов и митохондриальных функций. В кортикальных органоидах наблюдалось снижение пролиферации нейральных предшественников и преждевременный сдвиг в сторону глутаматергической дифференцировки. Функциональные тесты подтвердили, что нейронные сети в таких органоидах демонстрируют патологическую гипервозбудимость. ГАМК-ергические (тормозные) нейроны оказались неспособны компенсировать этот избыток возбуждения, что объясняет клиническую картину резистентных к терапии судорог у пациентов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа основана на моделях in vitro, которые не полностью воспроизводят сложность взаимодействия всех типов клеток и систем организма.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Болезнь Гоше представляет собой редкое лизосомное заболевание, обусловленное аутосомно-рецессивными мутациями в гене GBA1, который кодирует фермент глюкоцереброзидазу. Клинически выделяют три типа заболевания, различающихся по степени поражения нервной системы. Тип 2 характеризуется наиболее тяжелым течением: ранним началом нейропатологии, задержкой развития, эпилептическими приступами и летальным исходом в раннем возрасте. Большинство исследований механизмов нейропатической формы болезни Гоше опираются на модели животных и сфокусированы на поздних стадиях нейродегенерации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Болезнь Гоше 2-го типа — тяжелое нейродегенеративное состояние, механизмы которого на ранних этапах развития мозга изучены недостаточно.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы создали линии индуцированных плюрипотентных стволовых клеток (иПСК) от здоровых доноров и пациентов с болезнью Гоше, а также получили изогенные контрольные линии. На их основе были выращены кортикальные и субпаллиальные органоиды головного мозга. В этих моделях мы зафиксировали ранние нарушения липидного обмена: накопление глюкозилцерамида и значительное повышение уровня глюкозилсфингозина, а также более позднее увеличение концентрации ганглиозидов, что соответствует клинической картине заболевания.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;иПСК (индуцированные плюрипотентные стволовые клетки) — это клетки взрослого организма, перепрограммированные в состояние, подобное эмбриональным стволовым клеткам, способным превращаться в любые типы тканей, включая нейроны.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Методом одноядерного транскрипционного профилирования (&lt;a href=\"concepts/single-cell-rna-sequencing.html\"&gt;scRNA-seq&lt;/a&gt;) были выявлены новые фенотипы. В субпаллиальных органоидах наблюдалось увеличение числа мигрирующих интернейронов с повышенной активностью метаболизма холестерина. В кортикальных органоидах выявлена ранняя активация митохондриальных генов и снижение пролиферации, за которыми следовал сдвиг судьбы клеток от ГАМК-ергических к глутаматергическим нейронам с резким усилением экспрессии генов, связанных с синаптической сборкой.&lt;/p&gt;\n&lt;p&gt;Функциональные тесты показали выраженную гипервозбудимость кортикальных органоидов и сниженный ответ на блокаду ГАМК-А-рецепторов. Дополнительные 2D-модели нейронных сетей подтвердили эти данные: глутаматергические нейроны при болезни Гоше демонстрируют гипервозбудимость, а ГАМК-ергические нейроны не способны компенсировать этот избыточный сигнал. Данный дисбаланс возбуждения и торможения объясняет развитие резистентных к терапии судорог у пациентов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проведено на органоидах и 2D-культурах, что является упрощенной моделью человеческого мозга, поэтому результаты требуют дальнейшей проверки в клинических условиях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"bolezn-goshe-i-ogranicheniya-sushestvuyushih-modelej\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#bolezn-goshe-i-ogranicheniya-sushestvuyushih-modelej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Болезнь Гоше и ограничения существующих моделей&lt;/span&gt;&lt;/a&gt;Болезнь Гоше и ограничения существующих моделей&lt;/h4&gt;\n&lt;p&gt;Болезни накопления лизосом (LSD) представляют собой группу редких наследственных метаболических нарушений, вызванных дефицитом лизосомальных ферментов. Это приводит к накоплению нерасщепленных молекул и дисфункции лизосомальной системы, критически важной для клеточного гомеостаза. Болезнь Гоше — наиболее распространенная форма LSD, обусловленная мутациями в гене GBA1, кодирующем фермент β-глюкоцереброзидазу (GCase). Дефицит GCase вызывает накопление глюкозилцерамида (GlcCer) в лизосомах, что ведет к гепатоспленомегалии, панцитопении и поражению костей. Кроме того, носительство мутаций GBA1 ассоциировано с повышенным риском развития болезни Паркинсона.&lt;/p&gt;\n&lt;p&gt;Болезнь Гоше подразделяют на три типа: I тип (ненейронопатический) характеризуется анемией и поражением органов, но не затрагивает нервную систему; II тип (острый нейронопатический) проявляется у младенцев быстрой нейродегенерацией и ранней смертностью; III тип (хронический нейронопатический) имеет более медленное прогрессирование. Современные методы лечения, такие как заместительная ферментная терапия и терапия уменьшения субстрата, эффективны для системных проявлений, но плохо купируют неврологические симптомы, так как ферменты не преодолевают гематоэнцефалический барьер. Это оставляет мозг уязвимым и объясняет связь с паркинсонизмом.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Болезнь Гоше, вызванная мутациями GBA1, приводит к накоплению GlcCer и нейротоксичного глюкозилсфингозина (GlcSph), однако существующие методы лечения не способны эффективно корректировать неврологические нарушения из-за ограниченного проникновения через гематоэнцефалический барьер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;GlcCer синтезируется в аппарате Гольджи и является предшественником сложных гликосфинголипидов, таких как ганглиозиды, необходимых для развития мозга. При нарушении лизосомального расщепления GlcCer накапливается и деацетилируется до GlcSph — потенциально нейротоксичного биомаркера заболевания. Традиционные мышиные модели часто не воспроизводят временную динамику и нейронопатические фенотипы человека из-за межвидовых различий и меньшей сложности строения мозга грызунов.&lt;/p&gt;\n&lt;h4 id=\"modelirovanie-bolezni-goshe-s-pomoshyu-organoidov\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#modelirovanie-bolezni-goshe-s-pomoshyu-organoidov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Моделирование болезни Гоше с помощью органоидов&lt;/span&gt;&lt;/a&gt;Моделирование болезни Гоше с помощью органоидов&lt;/h4&gt;\n&lt;p&gt;Для преодоления дефицита тканей мозга человека ученые используют индуцированные плюрипотентные стволовые клетки (&lt;a href=\"concepts/ipsc.html\"&gt;iPSC&lt;/a&gt;), способные дифференцироваться в различные типы нейральных клеток и формировать органоиды мозга, лучше имитирующие пространственную организацию и клеточное разнообразие. Ранее были созданы модели нейронов и астроцитов, а также органоиды среднего мозга для изучения болезни Паркинсона и, в недавних работах, болезни Гоше, где наблюдалось накопление липидов и нарушение дифференцировки дофаминергических нейронов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;iPSC (индуцированные плюрипотентные стволовые клетки) — это клетки взрослого организма (например, фибробласты кожи), которые были «перепрограммированы» в состояние эмбриональных стволовых клеток, способных превращаться в любые ткани, включая нейроны.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В данном исследовании мы получили iPSC из фибробластов пациента с болезнью Гоше. Методами редактирования генома мы исправили мутации в линии пациента и, напротив, нокаутировали ген GBA1 в контрольной линии, создав изогенные пары. Эти четыре линии iPSC были дифференцированы в кортикальные и субпаллиальные органоиды переднего мозга. Мы выявили накопление GlcSph и последующее увеличение уровня ганглиозидов (в частности, GM1). Одноклеточное транскриптомное профилирование показало изменения в спецификации нейральных линий, миграции, пролиферации и созревании клеток. Функциональные тесты подтвердили дефициты в глутаматергических и ГАМКергических нейронах, что раскрывает новые механизмы патогенеза.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на моделях in vitro (органоидах), которые, несмотря на высокую точность воспроизведения развития мозга, не полностью отражают системные взаимодействия целого организма.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"sozdanie-linij-i-psk-zdorovogo-kontrolya-i-bolezni-goshe-s-sootvetstvuyushim-izogennym-kontrolem\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#sozdanie-linij-i-psk-zdorovogo-kontrolya-i-bolezni-goshe-s-sootvetstvuyushim-izogennym-kontrolem\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Создание линий и-ПСК здорового контроля и болезни Гоше с соответствующим изогенным контролем&lt;/span&gt;&lt;/a&gt;Создание линий и-ПСК здорового контроля и болезни Гоше с соответствующим изогенным контролем&lt;/h4&gt;\n&lt;p&gt;Для моделирования нейронопатической формы болезни Гоше мы использовали мРНК-репрограммирование фибробластов кожи пациента для получения и-ПСК. Клональные линии были охарактеризованы согласно стандартам ISSCR: они демонстрировали типичную морфологию (Рис. S1A) и экспрессию маркеров плюрипотентности NANOG, OCT3/4, SOX2 и TRA-1-81 на уровне белка (Рис. S1A) и мРНК (Рис. S1B). Линия болезни Гоше (GD) не имела хромосомных аномалий (Рис. S1C) и была способна к дифференцировке во все три зародышевых листка (Рис. S1D). &lt;a href=\"concepts/sekvenirovanie-po-sengeru.html\"&gt;Секвенирование по Сэнгеру&lt;/a&gt; подтвердило наличие мутаций P415R и L483P в гене GBA1 (Рис. S1E). В исходной «здоровой» линии был обнаружен гетерозиготный статус по мутации N370S, поэтому она была переименована в линию здорового носителя (HC).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;и-ПСК (индуцированные плюрипотентные стволовые клетки) — это взрослые клетки, «перепрограммированные» в состояние эмбриональных стволовых клеток, способных превращаться в любой тип ткани организма.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для создания изогенной линии с нокаутом (HC-KO) мы использовали CRISPR/Cas9. Из-за высокой гомологии (96%) с псевдогеном GBA1LP, мы нацелились на уникальный участок длиной 55 п.н. в 9-м экзоне GBA1 (Рис. 1A). Был получен клон с повреждением обоих аллелей: вставкой 74 п.н. (стоп-кодон K447fsX21) и делецией 30 п.н. (мутация F436_T446delinsS) (Рис. 1B). Эта же стратегия позволила исправить мутацию P415R в линии GD (Рис. 1C). Для коррекции мутации L444P в 10-м экзоне, где нет различий с псевдогеном, был применен метод прайм-редактирования (PE3b), что позволило избежать двунитевых разрывов ДНК (Рис. 1C). Полученная линия GD-iso сохранила плюрипотентность, нормальный кариотип и способность к дифференцировке (Рис. 1D–G).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta-f1.jpg\" alt=\"Рис. 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/izogennye-linii.html\"&gt;Изогенные линии&lt;/a&gt; (HC-KO и GD-iso) полностью восстановили или имитировали профиль активности фермента GCase: 73,46 нмоль/ч·мг белка для GD-iso против 11,57 у исходной GD и 7,39 нмоль/ч·мг у HC-KO против 72,23 у контроля HC.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Функциональная валидация показала, что активность GCase в линии HC составила 72,23 нмоль/ч·мг белка, тогда как в GD — лишь 11,57. В линии HC-KO активность упала до 7,39, а в исправленной GD-iso восстановилась до 73,46 нмоль/ч·мг белка (Рис. 1H). Таким образом, созданы две пары изогенных линий (Таблица S1) для изучения механизмов болезни Гоше.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование CRISPR/Cas9 и прайм-редактирования требует тщательного контроля off-target эффектов, хотя данные методы минимизируют риск нецелевых мутаций.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"mozgovye-organoidy-pri-bolezni-goshe-demonstriruyut-progressiruyushee-nakoplenie-sfingolipidov\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#mozgovye-organoidy-pri-bolezni-goshe-demonstriruyut-progressiruyushee-nakoplenie-sfingolipidov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мозговые органоиды при болезни Гоше демонстрируют прогрессирующее накопление сфинголипидов&lt;/span&gt;&lt;/a&gt;Мозговые органоиды при болезни Гоше демонстрируют прогрессирующее накопление сфинголипидов&lt;/h4&gt;\n&lt;p&gt;Для моделирования нейронопатической формы болезни Гоше мы использовали линии индуцированных плюрипотентных стволовых клеток (iPSC): здоровый контроль (HC), &lt;a href=\"concepts/knock-out.html\"&gt;нокаут&lt;/a&gt; (HC-KO), линию пациента (GD) и её изогенный контроль (GD-iso). Клетки дифференцировали в органоиды переднего мозга: субпаллиальные (hSO) и кортикальные (hCO) (Рис. 2A). Органоиды культивировали до 150 дней (DIV), при этом темпы роста всех линий были сопоставимы (Рис. 2B). К 75-му дню (DIV75) все линии успешно формировали SOX2+ нейральные розетки и NeuN+ нейроны (Рис. 2C, D).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta-f2.jpg\" alt=\"Рис. 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 2&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;iPSC (индуцированные плюрипотентные стволовые клетки) — это взрослые клетки организма, «перепрограммированные» в состояние эмбриональных стволовых клеток, способных превращаться в любые ткани, включая нейроны.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ лизосом методом проточной цитометрии (&lt;a href=\"concepts/protochnaya-tsitometriya.html\"&gt;FACS&lt;/a&gt;) с красителем Lysotracker показал, что у линии HC-KO наблюдается значительное увеличение размера и количества лизосом по сравнению с контролем HC. Рост сигнала составил 1,48-кратное увеличение для hSO и 1,32-кратное для hCO на DIV75, а также 1,48-кратное (hSO) и 1,52-кратное (hCO) на DIV150 (Рис. 2E). В линиях GD и GD-iso существенных различий не выявлено, что, вероятно, связано с более тяжелым фенотипом нокаутной линии из-за более низкой ферментативной активности.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Линия HC-KO демонстрирует более выраженную лизосомальную дисфункцию, чем линия пациента GD, что подтверждается значительным ростом сигнала Lysotracker вплоть до 150-го дня развития.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Поскольку болезнь Гоше вызвана нарушением расщепления глюкозилцерамида (GlcCer), мы оценили его накопление методом дот-блоттинга на DIV150 (Рис. 2F, Рис. SN). Уровень GlcCer в HC-KO был выше контроля в 2,6 раза (hSO) и 2,5 раза (hCO), тогда как в линии GD изменения были менее выраженными (1,25 и 1,05 раза соответственно). Анализ биомаркера глюкозилсфингозина (GlcSph) методом ВЭЖХ-МС на DIV150 показал крайне высокие уровни в HC-KO (1987,75 и 1364,55 нмоль/г белка) и значительные уровни в GD (2,4 и 7,46 нмоль/г белка) по сравнению с контрольными значениями (Рис. 2G). Накопление GlcSph в линии GD фиксировалось уже на DIV75 (Рис. SN), что указывает на раннее начало патологического процесса.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на органоидах, которые являются упрощенной моделью мозга; накопление липидов в них может не полностью отражать все аспекты нейродегенерации у человека.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы также изучили метаболизм ганглиозидов, производных GlcCer. Тонкослойная хроматография выявила накопление GM1 в органоидах GD и HC-KO к DIV150 (Рис. SN). С помощью FACS-анализа с меткой Vybrant Alexa Fluor 555 (липидные рафты) мы подтвердили прогрессирующее накопление GM1 в мембранах: на DIV75 рост флуоресценции составил 1,37 (HC-KO) и 1,21 (GD) раза, а к DIV150 — до 1,77 (HC-KO) и 1,39 (GD) раза в hSO, и 1,29 (HC-KO) и 1,21 (GD) раза в hCO (Рис. 2H). Это доказывает, что дисфункция катаболизма GlcCer ведет к вторичному накоплению сложных сфинголипидов в мембранах нейронов.&lt;/p&gt;\n&lt;h4 id=\"v-organoidah-perednego-mozga-pri-bolezni-goshe-nablyudaetsya-povyshennoe-chislo-migriruyushih-internejronov\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#v-organoidah-perednego-mozga-pri-bolezni-goshe-nablyudaetsya-povyshennoe-chislo-migriruyushih-internejronov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;В органоидах переднего мозга при болезни Гоше наблюдается повышенное число мигрирующих интернейронов&lt;/span&gt;&lt;/a&gt;В органоидах переднего мозга при болезни Гоше наблюдается повышенное число мигрирующих интернейронов&lt;/h4&gt;\n&lt;p&gt;Для изучения клеточного состава и дифференцировки в органоидах переднего мозга (hSO) и органоидах коры (hCO) при болезни Гоше был проведен анализ секвенирования РНК единичных клеток (scRNA-seq). Использовались образцы на 75-й (DIV75) и 150-й (DIV150) дни культивирования, полученные из 4 линий индуцированных плюрипотентных стволовых клеток (iPSC) в 3 независимых сериях дифференцировки. Для стандартизации обработки применялась система 10x Fixed RNA Profiling, позволившая объединить образцы разных сроков. Итоговая выборка составила 21 295 клеток болезни Гоше и 17 939 контрольных клеток для hSO, а также 20 322 и 23 017 клеток соответственно для hCO.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;scRNA-seq — метод анализа транскриптома отдельных клеток, позволяющий выявить редкие типы клеток и их функциональное состояние в гетерогенной ткани.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ выявил 9 популяций клеток в hSO, включая делящиеся клетки, радиальную глию, астроглию, вентральные прогениторы и различные типы нейронов (Рис. 3A-B, D). В обеих группах (контроль и Гоше) с DIV75 по DIV150 росло число вентральных прогениторов и мигрирующих интернейронов (Рис. SN3A). При сравнении на DIV75 у органоидов Гоше выявлено снижение числа стриарных MSN-нейронов и значительный рост популяции мигрирующих интернейронов (Рис. 3C, Рис. SN3D). К DIV150 различия сгладились: наблюдалось лишь небольшое снижение холинергических нейронов и рост MSN-нейронов, представленных в малом количестве (Рис. SN3B, G).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta-f3.jpg\" alt=\"Рис. 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 3&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;На стадии DIV75 при болезни Гоше зафиксировано существенное увеличение популяции мигрирующих интернейронов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ дифференциально экспрессирующихся генов (&lt;a href=\"concepts/gene-expression.html\"&gt;DEG&lt;/a&gt;) показал 114 повышенных и 70 пониженных генов на DIV75, а также 106 и 22 гена на DIV150 (Рис. SN3C, D, F, G). Ключевым пониженным геном в оба срока стал NR2F1, отвечающий за баланс возбуждающих и тормозных нейронов. Анализ онтологии генов (GO) на DIV75 указал на подавление процессов плазматической мембраны и активацию лизосомальных и синаптических путей (Рис. SN3E). На DIV150 активировались синаптические пути, а пути миграции и формирования внеклеточного матрикса были подавлены (Рис. SN3H).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Данные получены на органоидах (in vitro), что не полностью отражает сложность взаимодействия систем в живом организме.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Детальный анализ мигрирующих интернейронов на DIV75 выявил 89 повышенных и 29 пониженных генов (Рис. 3E, Рис. SN3D). Среди повышенных процессов доминировал метаболизм холестерина и синаптическая адгезия, тогда как подавленными оказались функции аппарата Гольджи, аутофагия и PKC-сигналинг (Рис. 3F). Таким образом, болезнь Гоше ассоциирована с нарушением миграции интернейронов и метаболизма холестерина в развивающемся мозге.&lt;/p&gt;\n&lt;h4 id=\"rannyaya-aktivaciya-mitohondrialnyh-genov-i-sdvig-nejronalnoj-differencirovki-v-organoidah-pri-bolezni-goshe\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#rannyaya-aktivaciya-mitohondrialnyh-genov-i-sdvig-nejronalnoj-differencirovki-v-organoidah-pri-bolezni-goshe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ранняя активация митохондриальных генов и сдвиг нейрональной дифференцировки в органоидах при болезни Гоше&lt;/span&gt;&lt;/a&gt;Ранняя активация митохондриальных генов и сдвиг нейрональной дифференцировки в органоидах при болезни Гоше&lt;/h4&gt;\n&lt;p&gt;Анализ органоидов головного мозга (hCO) выявил 14 клеточных популяций, включая прогениторы, радиальную глию, астроглию и различные типы нейронов (Рис. 4A, 4D). В период с 75-го по 150-й день развития (DIV) в обеих группах наблюдалось снижение числа нейронов Кахаля-Ретциуса и рост популяции ГАМК-ергических нейронов (Рис. 4B, Рис. SN4A). Однако при болезни Гоше (GD) на 75-й день выявлено избыточное количество ГАМК-ергических нейронов, тогда как к 150-му дню произошел сдвиг в сторону возбуждающих глутаматергических нейронов и промежуточных прогениторов за счет сокращения тормозных линий (Рис. 4C, Рис. SN4B).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta-f4.jpg\" alt=\"Рис. 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 4&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;При болезни Гоше наблюдается ускоренное созревание нейронов: на 75-й день преобладают ГАМК-ергические клетки, а к 150-му дню происходит переключение на глутаматергический фенотип.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ дифференциально экспрессируемых генов (DEG) показал 659 повышенных и 1008 пониженных генов на 75-й день, и 498 повышенных и 72 пониженных на 150-й день (Рис. SN4C-F). На 75-й день в органоидах GD отмечено снижение активности путей клеточного цикла и активация синаптических генов, что указывает на ускоренную дифференцировку (Рис. 4E). Анализ обогащения наборов генов (&lt;a href=\"concepts/gsea.html\"&gt;GSEA&lt;/a&gt;) выявил усиление процессов переноса электронов (Рис. 4F), связанное с 10 митохондриальными генами (Рис. SN4C, SN5A). Это может отражать метаболический переход от гликолиза к окислительному фосфорилированию, характерный для созревания нейронов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GSEA (Gene Set Enrichment Analysis) — метод статистического анализа, позволяющий определить, значимо ли изменены целые группы функционально связанных генов, а не только отдельные гены.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проведено на органоидах; наблюдаемые изменения в митохондриях и клеточном составе могут не полностью отражать патофизиологию болезни в мозге человека.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Измерения интенсивности TMRM в 2D-культурах подтвердили повышение потенциала митохондрий в обоих типах нейронов при GD (Рис. SN5B, C). К 150-му дню GO-анализ показал активацию путей развития ГАМК-ергических нейронов (Рис. 4G), что, парадоксально, сочетается с их дефицитом в органоидах. Это сопровождается снижением экспрессии генов ГАМК-линии (DLX1/2/5, SLAIN1, SP9, TOX3) и ростом глутаматергических маркеров (BHLHE22, EMX1, NEUROD2/6, SATB2), что может быть компенсаторным механизмом (Рис. 4G, 4H). В целом, данные указывают на раннюю митохондриальную дисфункцию, замедление пролиферации и ускоренное созревание нейронов при болезни Гоше.&lt;/p&gt;\n&lt;h4 id=\"organoidy-pri-bolezni-goshe-demonstriruyut-narusheniya-vozbuzhdayushej-i-tormoznoj-nejronalnoj-funkcii,-vedushie-k-gipervozbuzhdeniyu-seti\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#organoidy-pri-bolezni-goshe-demonstriruyut-narusheniya-vozbuzhdayushej-i-tormoznoj-nejronalnoj-funkcii,-vedushie-k-gipervozbuzhdeniyu-seti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Органоиды при болезни Гоше демонстрируют нарушения возбуждающей и тормозной нейрональной функции, ведущие к гипервозбуждению сети&lt;/span&gt;&lt;/a&gt;Органоиды при болезни Гоше демонстрируют нарушения возбуждающей и тормозной нейрональной функции, ведущие к гипервозбуждению сети&lt;/h4&gt;\n&lt;p&gt;На основе данных липидного анализа, показавшего накопление липидов, и результатов секвенирования РНК единичных клеток, выявивших сдвиг в сторону глутаматергической линии развития, мы исследовали функциональные дефициты тормозных нейронов. Для этого мы использовали многоэлектродные матрицы (&lt;a href=\"concepts/mea.html\"&gt;MEA&lt;/a&gt;) с 64 электродами, на которые помещали кортикальные (hCO) и сфероидные (hSO) органоиды на 150-й день развития (DIV150) (Рис. 5A). Чтобы оценить работу ГАМК-ергических нейронов, мы применяли протокол: регистрация базальной активности, добавление пикротоксина (PTX) для блокировки торможения и последующее добавление NBQX и APV для блокировки возбуждения (Рис. 5A). Мы подтвердили, что система корректно регистрирует базальную активность, рост возбуждения после PTX и полное подавление активности после NBQX/APV, что доказывает наличие глутаматергической синаптической передачи (Рис. 5B).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MEA (многоэлектродная матрица) — это метод регистрации электрической активности нейронных сетей в реальном времени, позволяющий отслеживать передачу сигналов между клетками.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;После анализа 9–10 органоидов каждой линии мы обнаружили, что при добавлении PTX возбуждение возрастает во всех образцах (Рис. 5B). Однако реакция GD (болезнь Гоше) и GD-iso (контроль) органоидов различалась: у GD-iso отношение спайков увеличилось в 2,44 раза, тогда как у GD — лишь в 1,39 раза (Рис. 5C). Это указывает либо на исходное нарушение торможения, либо на то, что преобладание глутаматергических нейронов над ГАМК-ергическими вызывает гипервозбуждение. Базальная активность GD hCO была значительно выше, чем у GD-iso (Рис. 5D), что подтверждает роль сдвига в развитии как причины гипервозбуждения, не исключая при этом дефектов тормозных нейронов. В паре HC и HC-KO (Рис. SN) наблюдался рост в 1,41 и 1,74 раза соответственно.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Органоиды с болезнью Гоше показывают повышенную базальную активность и сниженную реакцию на блокаду торможения, что свидетельствует о состоянии сетевого гипервозбуждения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для hSO изменения после PTX были схожими: рост в 2,73 раза для GD-iso и 2,49 раза для GD (Рис. 5B, C). В паре HC и HC-KO рост составил 2,03 и 3,24 раза соответственно (Рис. SN). Поскольку hSO состоят преимущественно из ГАМК-ергических нейронов, блокада торможения ожидаемо вызвала сильный эффект. В отличие от hCO, базальная активность hSO при болезни Гоше не превышала контрольную (Рис. SN), что подтверждает гипотезу о том, что именно избыток глутаматергических нейронов является драйвером гипервозбуждения в кортикальных органоидах.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на органоидах (in vitro), поэтому наблюдаемые изменения активности нейронных сетей требуют осторожной экстраполяции на процессы, происходящие в мозге человека.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;2D-культуры при болезни Гоше с ГАМК-ергическими и глутаматергическими нейронами для выявления клеточно-специфических механизмов дисфункции нейронных сетей&lt;/p&gt;\n&lt;p&gt;Чтобы проверить, является ли изменение соотношения нейронов единственной причиной гипервозбудимости органоидов при болезни Гоше (GD), мы провели высокоплотную регистрацию активности на микроэлектродных матрицах (MEA) в 2D-культурах. Использовались изогенные линии клеток: GD (болезнь) и GD-iso (здоровый контроль), что исключает влияние генетического фона. Методом направленного программирования мы получили чистые популяции глутаматергических нейронов, ГАМК-ергических нейронов и астроцитов. Были созданы химерные культуры: здоровые глутаматергические нейроны/астроциты с больными ГАМК-ергическими нейронами и наоборот (Рис. 6A). Это позволило стандартизировать количество клеток каждого типа и оценить их вклад в гипервозбудимость сети в период с DIV14 по DIV54.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta-f6.jpg\" alt=\"Рис. 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 6&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Культуры с «больными» глутаматергическими нейронами демонстрируют выраженную гипервозбудимость (1,2 Гц на DIV50), тогда как «больные» ГАМК-ергические нейроны показывают активность, близкую к контрольной (0,86 Гц).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Во всех группах медианная частота импульсации (firing rate) росла со временем: от 0,5 Гц в начале до 0,76–1,55 Гц к концу эксперимента (Рис. 6B, 6C). В полностью «больных» культурах (GD) на DIV50 частота достигала 1,55 Гц, тогда как в контрольных (GD-iso) — 0,76 Гц. Культуры с больными ГАМК-ергическими нейронами вели себя почти как контроль (0,86 Гц), а культуры с больными глутаматергическими нейронами показывали умеренную гипервозбудимость (1,2 Гц). Амплитуда спайков и интервалы между ними значимо не различались (Рис. 6C). Применение пикротоксина (PTX) выявило тенденцию к росту активности в группе с больными ГАМК-ергическими нейронами, что указывает на их потенциальный вклад в подавление глутаматергической сигнализации (Рис. SN).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MEA (микроэлектродная матрица) — прибор для регистрации электрической активности нейронов в реальном времени, позволяющий оценивать сетевую динамику.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для уточнения роли глутаматергических нейронов мы использовали кальциевый сенсор под промотором CAMKIIɑ и обработку бикукуллином (BIC) для блокировки ГАМК-А-рецепторов (DIV28–DIV49). Анализировались размер коллективных событий, число пиков и &lt;a href=\"concepts/roc-auc.html\"&gt;площадь под кривой&lt;/a&gt; (Рис. 7A–D). На DIV42 и DIV49 в группах с больными глутаматергическими и здоровыми ГАМК-ергическими нейронами в события вовлекалось больше клеток (63–70% против 48–57%), что указывает на сдвиг баланса возбуждения/торможения (Рис. 7B). После добавления BIC синхронизация выросла во всех группах, но в культурах с больными глутаматергическими нейронами она оставалась ниже (ниже 90,5%), особенно при наличии больных ГАМК-ергических нейронов (ниже 75,8%).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta-f7.jpg\" alt=\"Рисунок 7. Кальциевая визуализация CAMKIIa-GCaMP8m в химерных трикультурах прямого программирования показывает дисбаланс\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 7. Кальциевая визуализация CAMKIIa-GCaMP8m в химерных трикультурах прямого программирования показывает дисбаланс возбуждения и торможения.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 7. Кальциевая визуализация CAMKIIa-GCaMP8m в химерных трикультурах прямого программирования показывает дисбаланс возбуждения и торможения. A) Растровые графики, показывающие спайки из репрезентативной записи кальциевой визуализации для каждого состояния культуры на 49-й день развития (DIV49) до (CONTROL) и сразу после добавления бикукуллина (BIC). B) Графики, отображающие размер коллективных событий во времени (с DIV28 по DIV49) до (Control) и после (BIC) добавления бикукуллина, выраженный в процентах клеток, участвующих в событиях коллективной активности. C) Графики, отображающие количество пиков на клетку (с DIV28 по DIV49) до (Control) и после (BIC) добавления бикукуллина. D) Графики, показывающие площадь под кривой каждого пика во времени (с DIV28 по DIV49) до (Control) и после (BIC) добавления бикукуллина.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проведено на 2D-культурах, которые, несмотря на изогенность, могут не полностью воспроизводить сложную архитектуру мозга.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"analiz-aktivnosti-nejronov-i-kalcievaya-dinamika\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#analiz-aktivnosti-nejronov-i-kalcievaya-dinamika\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ активности нейронов и кальциевая динамика&lt;/span&gt;&lt;/a&gt;Анализ активности нейронов и кальциевая динамика&lt;/h4&gt;\n&lt;p&gt;Применение бикукуллина приводило к росту числа пиков на клетку, причем наиболее выраженный эффект наблюдался на сроках DIV35, DIV42 и DIV49. В химерных культурах (здоровые глутаматергические + больные ГАМК-ергические или наоборот) число пиков стабильно превышало 22, тогда как в культурах, где оба типа нейронов были поражены болезнью, этот показатель оставался ниже 14 (Рис. 7C). Анализ средней частоты транзиентов (Рис. SN) показал, что базовый уровень активности больных глутаматергических нейронов в паре со здоровыми ГАМК-ергическими достоверно выше, чем у полностью здоровых культур: на DIV28 (10,9 против 7,7), DIV35 (12,9 против 10,2) и DIV49 (11,7 против 6,5). Сравнение больных глутаматергических нейронов со здоровыми ГАМК-ергическими против здоровых глутаматергических с больными ГАМК-ергическими также выявило значимые различия на DIV35 (12,9 против 9,9) и DIV49 (11,7 против 8,0) (Рис. SN).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Больные глутаматергические нейроны в сочетании со здоровыми ГАМК-ергическими демонстрируют повышенную активность, что указывает на компенсаторные механизмы, которые не срабатывают при поражении обоих типов клеток.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/bikukullin.html\"&gt;Бикукуллин&lt;/a&gt; — антагонист ГАМК-рецепторов, который блокирует тормозное влияние ГАМК-ергических нейронов, позволяя оценить «скрытую» возбудимость глутаматергических сетей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Отсутствие максимальной активности в полностью «больных» культурах указывает на расхождение между данными MEA и анализом исключительно возбуждающего входа. Вероятно, избыточная активность частично обусловлена ответом ГАМК-ергических нейронов на гипервозбудимые глутаматергические клетки. Площадь под кривой (&lt;a href=\"concepts/area-under-the-curve.html\"&gt;AUC&lt;/a&gt;) пиков была значительно выше в культурах только с больными ГАМК-ергическими нейронами (388 на DIV35 и 259 на DIV42). Промежуточный фенотип наблюдался при наличии только больных глутаматергических нейронов (187 и 180), а минимальные значения зафиксированы в полностью больных культурах (84 и 118, Рис. 7D). Это свидетельствует о том, что здоровые глутаматергические нейроны способны к гомеостатической коррекции возбудимости в ответ на усиленное торможение со стороны больных ГАМК-ергических клеток, тогда как у больных глутаматергических нейронов этот механизм нарушен.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на клеточных культурах, поэтому наблюдаемые компенсаторные механизмы могут отличаться от процессов в живом организме.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Результаты MEA и кальциевого имиджинга подтверждают, что при болезни Гоше глутаматергические нейроны обладают выраженной гипервозбудимостью. ГАМК-ергические нейроны также могут быть гипервозбудимы, однако их вклад в сетевые изменения ограничен, а способность буферизировать гипервозбудимость снижена, что подтверждается более мягким фенотипом при совместном культивировании здоровых ГАМК-ергических нейронов с больными глутаматергическими.&lt;/p&gt;\n&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;p&gt;Мы впервые создали модель болезни Гоше на основе органоидов переднего мозга человека, полученных из индуцированных плюрипотентных стволовых клеток (ИПСК). Для этого мы использовали линию клеток пациента (GD) и линию здорового донора (HC), создав на их основе изогенные пары (GD-iso и HC-KO) с помощью редактирования генома. Полученные кортикальные (hCO) и субпаллиальные (hSO) органоиды воспроизводят накопление липидов, характерное для патологии. Выбор именно этих структур обусловлен клиническими данными о дегенерации коры и глиозе у пациентов. Наши модели демонстрируют прогрессирующее накопление гликосфинголипидов, что ведет к нарушению созревания нейронов, дисфункции глутаматергических и ГАМК-ергических сетей и их гипервозбудимости.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Создана первая модель болезни Гоше на органоидах мозга, подтвердившая накопление липидов, нарушение созревания нейронов и патологическую гипервозбудимость нейронных сетей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ лизосом с помощью красителя Lysotracker показал увеличение их количества в линии HC-KO по сравнению с HC, однако в линии GD значимых отличий от GD-iso не выявлено. Это расхождение с предыдущими работами может быть связано с различиями в методах детекции. При анализе метаболитов мы обнаружили, что уровень глюкозилцерамида (GlcCer) повышен только в HC-KO, тогда как уровень глюкозилсфингозина (GlcSph) значительно выше в обеих болезненных линиях, особенно в HC-KO. Это коррелирует с ферментативной активностью: линия HC-KO демонстрирует лишь около 60% активности по сравнению с GD, что может отражать тяжелый перинатальный фенотип, характерный для редких случаев II типа болезни Гоше.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Изогенные линии — это клетки с идентичным генетическим фоном, где с помощью редактирования (например, CRISPR/Cas9) исправлена или внесена конкретная мутация, что позволяет изолировать влияние гена на фенотип.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Накопление липидов предшествует видимым изменениям лизосом, по крайней мере в линии GD, и сопровождается ростом уровня ганглиозида GM1, особенно в субпаллиальных органоидах. Учитывая роль ганглиозидов в развитии мозга, это подтверждает гипотезу о том, что болезнь Гоше влияет на пренатальное развитие, закладывая основу для будущих неврологических нарушений. Данные транскриптомики одиночных клеток указывают на ранние митохондриальные нарушения. Это может быть как первичным механизмом патологии, так и следствием метаболического переключения нейронов с гликолиза на окислительное фосфорилирование в процессе созревания. В субпаллиальных органоидах мы также отметили аномальную миграцию интернейронов, связанную с нарушением метаболизма холестерина и дисфункцией аппарата Гольджи.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проведено на органоидах, которые, несмотря на сложность, не полностью имитируют все взаимодействия в живом мозге; корреляция между метаболическими сдвигами и клиническими симптомами требует дальнейшего подтверждения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Функциональные тесты показали, что в органоидах с болезнью Гоше происходит сдвиг баланса в сторону глутаматергических нейронов, что приводит к гипервозбудимости сетей. В химерных культурах мы подтвердили, что глутаматергические нейроны сами по себе гипервозбудимы, а ГАМК-ергические нейроны не способны компенсировать этот эффект, даже несмотря на попытки системы усилить ГАМК-ергическую синаптическую передачу. Таким образом, наши модели позволяют связать молекулярные нарушения с сетевой дисфункцией, что открывает новые возможности для поиска терапевтических мишеней.&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"kultury-fibroblastov\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#kultury-fibroblastov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Культуры фибробластов&lt;/span&gt;&lt;/a&gt;Культуры фибробластов&lt;/h4&gt;\n&lt;p&gt;Фибробласты кожи человека (линии GM08398, GM01260) были получены из Института медицинских исследований Кориэлл. Клетки культивировали в среде DMEM с добавлением 10% фетальной бычьей сыворотки (FBS) и 1% GlutaMAX при 37°C в атмосфере с 5% CO2. Пассирование проводили при достижении 80% конфлюэнтности с использованием 0,25% трипсина.&lt;/p&gt;\n&lt;h4 id=\"poluchenie-i-podderzhanie-linij-ipsk\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#poluchenie-i-podderzhanie-linij-ipsk\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Получение и поддержание линий иПСК&lt;/span&gt;&lt;/a&gt;Получение и поддержание линий иПСК&lt;/h4&gt;\n&lt;p&gt;Индуцированные плюрипотентные стволовые клетки (иПСК) получали методом мРНК-репрограммирования фибробластов согласно протоколу StemRNA 3rd Gen. Клональные линии отбирали по морфологии колоний, сходных с эмбриональными стволовыми клетками, в соответствии со стандартами ISSCR. Клетки поддерживали в среде mTeSR1, пассировали с помощью реагента StemPro Accutase при 80% конфлюэнтности. После центрифугирования (300 x g) клетки высевали с плотностью 1,5–2,5 × 10⁴ кл/см² на планшеты с Matrigel в присутствии 10 мкМ ингибитора Rho-киназы Y-27632. Культуры инкубировали при 37°C в атмосфере 95% O2 и 5% CO2 с ежедневной сменой среды. Регулярный контроль на микоплазму проводили набором MycoAlert.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;иПСК (индуцированные плюрипотентные стволовые клетки) — это взрослые клетки организма, «перепрограммированные» в состояние, близкое к эмбриональному, что позволяет им превращаться в любые типы тканей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"analiz-mutacij-gba1\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#analiz-mutacij-gba1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ мутаций GBA1&lt;/span&gt;&lt;/a&gt;Анализ мутаций GBA1&lt;/h4&gt;\n&lt;p&gt;Генотип GBA1 подтверждали выделением геномной ДНК (набор DNeasy) из фибробластов и иПСК. Все экзоны GBA1 амплифицировали методом &lt;a href=\"concepts/ptsr.html\"&gt;ПЦР&lt;/a&gt; с использованием полимеразы Phusion в буфере HF на термоциклере Master Cycler Nexus (Таблица S2, S3). Продукты секвенировали методом Сэнгера и выравнивали в программе SnapGene (V5.0) относительно референсного генома человека (ENSG00000177628).&lt;/p&gt;\n&lt;h4 id=\"g-bending-i-molekulyarnoe-kariotipirovanie\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#g-bending-i-molekulyarnoe-kariotipirovanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;G-бэндинг и молекулярное кариотипирование&lt;/span&gt;&lt;/a&gt;G-бэндинг и молекулярное кариотипирование&lt;/h4&gt;\n&lt;p&gt;Классический G-бэндинг проводили по стандартным методикам. Молекулярное кариотипирование выполняли методом &lt;a href=\"concepts/snp.html\"&gt;SNP&lt;/a&gt;-матриц (Infinium Global Screening Array-24) на платформе Illumina. Анализ данных проводили в GenomeStudio V2.0.5 и CNV-Partition 3.2.0. Пороговые значения: минимум 30 зондов, размер изменений 400 кб для делеций/дупликаций и 5 Мб для областей потери гетерозиготности при уровне достоверности 35.&lt;/p&gt;\n&lt;h4 id=\"immunocitohimiya\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#immunocitohimiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Иммуноцитохимия&lt;/span&gt;&lt;/a&gt;Иммуноцитохимия&lt;/h4&gt;\n&lt;p&gt;Колонии иПСК фиксировали 4% параформальдегидом, пермеабилизировали 0,025–0,25% Triton X-100 в присутствии 5% сыворотки осла. Инкубацию с первичными антителами проводили при 4°C в течение ночи, со вторичными антителами и красителем Hoescht 33342 (2 мкг/мкл) — 2 часа при комнатной температуре. Изображения получали на конфокальном микроскопе Leica SP8 (объектив 20x) и обрабатывали в Fiji.&lt;/p&gt;\n&lt;h4 id=\"obratnaya-transkripciya-i-kolichestvennaya-pcr-rt-qpcr\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#obratnaya-transkripciya-i-kolichestvennaya-pcr-rt-qpcr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обратная транскрипция и количественная ПЦР (RT-qPCR)&lt;/span&gt;&lt;/a&gt;Обратная транскрипция и количественная ПЦР (RT-qPCR)&lt;/h4&gt;\n&lt;p&gt;Экспрессию генов плюрипотентности оценивали в трех независимых пассажах иПСК. РНК выделяли набором RNeasy с обработкой ДНКазой I, концентрацию измеряли на Nanodrop One. Синтез кДНК проводили с использованием набора qScript (1 мкг РНК). ПЦР в реальном времени выполняли в объеме 15 мкл (3 технических повтора) на системе QuantStudio 7 (40 циклов) с использованием наборов TaqMan и ПО Design and Analysis 2.6.0.&lt;/p&gt;\n&lt;h4 id=\"differencirovka-v-tri-zarodyshevyh-listka\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#differencirovka-v-tri-zarodyshevyh-listka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дифференцировка в три зародышевых листка&lt;/span&gt;&lt;/a&gt;Дифференцировка в три зародышевых листка&lt;/h4&gt;\n&lt;p&gt;Для оценки способности индуцированных плюрипотентных стволовых клеток (иПСК) к дифференцировке их высевали на 24-луночные планшеты с покрытием Matrigel (Ibidi GmbH) в среде mTeSR1 с добавлением 10 мкМ ингибитора ROCK (RI). Плотность посева составляла 1 × 10⁵ клеток на лунку для получения экто- и энтодермальных производных и 5 × 10⁴ клеток для мезодермальных. Дифференцировку проводили в течение 7 дней с использованием набора STEMdiff™ Trilineage Differentiation Kit (StemCell Technologies). По завершении клетки фиксировали 4% параформальдегидом (15 мин) и окрашивали антителами к маркерам соответствующих зародышевых листков (информацию о разведениях см. в Таблице S4). Визуализацию проводили на инвертированном конфокальном микроскопе Leica SP8 (объектив 20x), обработку изображений — в программе Fiji.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/differentsirovka-v-tri-zarodyshevyh-listka.html\"&gt;Дифференцировка в три зародышевых листка&lt;/a&gt; — это стандартный тест на плюрипотентность, подтверждающий, что иПСК способны превращаться в клетки всех типов организма (экто-, мезо- и энтодерму).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sozdanie-konstrukcij-dlya-redaktirovaniya-genoma\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#sozdanie-konstrukcij-dlya-redaktirovaniya-genoma\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Создание конструкций для редактирования генома&lt;/span&gt;&lt;/a&gt;Создание конструкций для редактирования генома&lt;/h4&gt;\n&lt;p&gt;Для стандартного редактирования CRISPR/Cas9 использовали две sgРНК (Таблица S6), спроектированные через инструмент Benchling. Чтобы обеспечить селективность в отношении гена GBA1 и избежать влияния псевдогена GBA1LP, sgРНК-4 была нацелена на уникальный 55-парный нуклеотидный участок в 9-м экзоне GBA1. Олигонуклеотиды синтезировали (Eurofins Genomics), фосфорилировали и отжигали в присутствии T4 полинуклеотидкиназы и буфера T4 ДНК-лигазы в термоциклере (30 мин при 37°C, 5 мин при 95°C, охлаждение со скоростью 5°C/мин до 25°C). Полученный дуплекс разводили 1:250. Реакцию лигирования проводили с использованием векторов pX459 V2.0 или pX462 V2.0 (Addgene #62988, #62987) в присутствии FastDigest Bpil, T7 ДНК-лигазы, АТФ и DTT. Циклическая инкубация (6 циклов по 5 мин при 37°C и 23°C) завершалась обработкой &lt;a href=\"concepts/plasmid.html\"&gt;Plasmid&lt;/a&gt;-safe ДНКазой для удаления линейной ДНК.&lt;/p&gt;\n&lt;p&gt;Для коррекции мутации GBA1 P415R использовали одноцепочечные донорные олигонуклеотиды (ssODN) с 30-нуклеотидными плечами гомологии, «молчащей» мутацией в PAM-последовательности и фосфотиоатными связями на концах. Для Prime Editing (PE3b) целевым был 10-й экзон с мутацией L444P. Кандидаты pegРНК и ngРНК подбирали через PrimeDesign59, отдавая приоритет тем, где PAM-сайт разрушается молчащей мутацией. Сборку pegРНК-векторов проводили путем расщепления вектора pU6-pegRNA-GG (Addgene #132777) ферментом BsaI, выделения из геля и лигирования с отжитыми олигонуклеотидами (спейсер, расширение, скаффолд) с использованием BsaI-HF v2. Конструкции ngРНК для PE3b создавали аналогично, используя вектор BPK1520 (Addgene #65777) и фермент Esp3I. Успешность клонирования подтверждали секвенированием (hU6 праймер, EuroFins Genomics) с выравниванием в SnapGene.&lt;/p&gt;\n&lt;h4 id=\"redaktirovanie-genoma-ipsc-pacientov-s-pomoshyu-crispr-cas9-i-prime-editing\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#redaktirovanie-genoma-ipsc-pacientov-s-pomoshyu-crispr-cas9-i-prime-editing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Редактирование генома iPSC пациентов с помощью CRISPR-Cas9 и Prime Editing&lt;/span&gt;&lt;/a&gt;Редактирование генома iPSC пациентов с помощью CRISPR-Cas9 и Prime Editing&lt;/h4&gt;\n&lt;p&gt;Для подготовки плазмид использовали набор EndoFree Maxi Kit (QIAGEN), концентрацию ДНК измеряли на спектрофотометре NanoDrop 1000 (ПО версии 3.8.1). Для коррекции мутации P415R в линии iPSC пациента применяли &lt;a href=\"concepts/crispr-cas9.html\"&gt;CRISPR-Cas9&lt;/a&gt;, sgRNA и ssODN для стимуляции гомологичной репарации (HDR). Клетки при 80% конфлюэнтности рассаживали (4,5 × 10⁵) на планшеты с Matrigel в среде mTeSR1 с 10 мкМ ингибитора ROCK (RI). На следующий день проводили трансфекцию смесью LipoStem (6 мкл) и ДНК-конструктов (1,5 мкг CRISPR-Cas9 и 0,5 мкг ssODN). В течение двух дней после трансфекции в среду добавляли пуромицин (1,25 мкг/мл) и RI. После достижения 50% конфлюэнтности клетки рассевали на планшеты с ламинином-521 для получения отдельных колоний (диаметром 1–2 мм), которые затем переносили в 24-луночные планшеты для экспансии. Для создания нокаутной линии (KO) GBA1 использовали аналогичный протокол, но без ssODN, либо применяли плазмиду pX462 с двумя sgRNA.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод CRISPR-Cas9 использует направляющую РНК (sgRNA) для поиска нужного участка ДНК, где фермент Cas9 делает разрез. При добавлении матрицы (ssODN) клетка исправляет разрыв, встраивая нужную последовательность (HDR), а без матрицы — случайным образом «чинит» разрыв, часто вызывая поломку гена (нокаут).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для нуклеофекции использовали клетки iPSC (пассаж &amp;lt;20, конфлюэнтность 60–70%), диссоциированные Accutase до суспензии одиночных клеток. 8 × 10⁵ клеток центрифугировали (300 g, 5 мин) и ресуспендировали в 90 мкл раствора P3 (Lonza). Для версии PE3b использовали 5 мкг ДНК (PE-MAX, pegRNA и sgRNA в соотношении 3,5:1:0,5). Электропорацию проводили на приборе Lonza 4D Nucleofector (программа CB150). После селекции бластицидином (10 мкг/мл) клетки рассевали с низкой плотностью (40 клеток на лунку) для клональной экспансии. Генотипирование проводили методом ПЦР с последующим расщеплением ферментами MboI (для P415R) или XmaI (для L444P) и анализом в агарозном геле с красителем GelRed. Для подтверждения аллельного состава проводили TOPO-клонирование ПЦР-продуктов в E. coli (OneShot TOP10), секвенирование 20 колоний и выравнивание в SnapGene относительно референса GBA1 (ENSG00000177628).&lt;/p&gt;\n&lt;h4 id=\"analiz-necelevyh-effektov-off-target\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#analiz-necelevyh-effektov-off-target\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ нецелевых эффектов (off-target)&lt;/span&gt;&lt;/a&gt;Анализ нецелевых эффектов (off-target)&lt;/h4&gt;\n&lt;p&gt;Топ-5 наиболее вероятных сайтов нецелевого редактирования для sgRNA P415R были предсказаны с помощью ПО Benchling (Таблица SN). Эти участки амплифицировали методом ПЦР (30 циклов: 98°C — 10 с, 66°C — 10 с, 72°C — 30 с) и секвенировали. Полученные данные сравнивали с последовательностями родительской линии для исключения нежелательных мутаций.&lt;/p&gt;\n&lt;h4 id=\"analiz-fermentativnoj-aktivnosti-v-inducirovannyh-nejronah\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#analiz-fermentativnoj-aktivnosti-v-inducirovannyh-nejronah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ ферментативной активности в индуцированных нейронах&lt;/span&gt;&lt;/a&gt;Анализ ферментативной активности в индуцированных нейронах&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"concepts/in.html\"&gt;Индуцированные нейроны&lt;/a&gt; (iN) получали из iPSC при 80% конфлюэнтности. Клетки (3,5 x 10^5) высевали на планшеты с покрытием Matrigel в среде mTeSR1 с добавлением 10 мкМ RI. На следующий день вносили лентивирусы rtTA и Ngn2. С 0-го дня в среду добавляли 2,5 мкг/мл доксициклина (Dox), который присутствовал в течение всего эксперимента. С 1-го дня использовали среду BrainPhys с 0,5% N2 и 1% B27, проводя селекцию пуромицином (1,25 мкг/мл). С 5-го дня среду ежедневно меняли на BrainPhys с 0,5% N2, 1% B27, 10 нг/мл NT3 и 10 нг/мл BDNF. На 7-й день клетки собирали, центрифугировали при 300 x g и замораживали при -80°C.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Индуцированные нейроны (iN) — это клетки, полученные путем прямого перепрограммирования стволовых клеток в нейроны с помощью экспрессии специфических факторов транскрипции (в данном случае Ngn2).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для анализа активности лизаты клеток готовили в буфере McIlvain (0,2 М Na2HPO4, 0,1 М лимонной кислоты, 1% таурата натрия, 0,2% Triton X-100) с помощью ультразвуковой дезинтеграции (2 мин, 100 Вт). После центрифугирования (20 000 x g, 20 мин, 4°C) супернатант нормализовали по белку до 1 мг/мл с помощью BCA-теста. Активность GCase измеряли, инкубируя 20 мкл образца со 180 мкл субстратного буфера (15 мМ 4-метилумбеллиферилглюкопиранозида) в течение 1 часа при 37°C. Реакцию останавливали раствором глицина (pH 10,4), флуоресценцию измеряли при 365/460 нм. Активность (U) рассчитывали по формуле, где 1 единица соответствует высвобождению 1 нмоль 4-метилумбеллиферона (4MU) в час.&lt;/p&gt;\n&lt;h4 id=\"kultivirovanie-organoidov\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#kultivirovanie-organoidov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Культивирование органоидов&lt;/span&gt;&lt;/a&gt;Культивирование органоидов&lt;/h4&gt;\n&lt;p&gt;Кортикальные (hCO) и субпаллиальные (hSO) органоиды получали с использованием наборов STEMdiff. Клетки iPSC (3 x 10^5 кл/мл) высевали в планшеты Aggrewell 800 со средой, содержащей 10 мкМ Y-27632, и центрифугировали (100 x g, 3 мин) для формирования агрегатов. С 1-го по 5-й день проводили ежедневную смену среды STEMdiff Neural Organoid Basal medium 1. На 6-й день органоиды переносили в планшеты с низкой адгезией в среду Forebrain Organoid Expansion (40–50 органоидов на лунку). С 8-го по 25-й день среду меняли каждые 48 часов. На 25-й день количество органоидов сокращали до 15–20 на лунку и переводили их на среду дифференцировки до 43-го дня. Затем органоиды (8–10 на лунку) переносили в поддерживающую среду (Neurobasal A, 2% B27, 1% Glutamax, 1% Pen/Strep). С 49-го дня для улучшения диффузии питательных веществ использовали орбитальный шейкер (80 об/мин).&lt;/p&gt;\n&lt;h4 id=\"okrashivanie-organoidov-metodom-protochnoj-citometrii-facs\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#okrashivanie-organoidov-metodom-protochnoj-citometrii-facs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Окрашивание органоидов методом проточной цитометрии (FACS)&lt;/span&gt;&lt;/a&gt;Окрашивание органоидов методом проточной цитометрии (FACS)&lt;/h4&gt;\n&lt;p&gt;Для анализа использовали диссоциированные до состояния отдельных клеток органоиды на 75-й и 150-й дни развития. После центрифугирования клеточный осадок ресуспендировали в 900 мкл охлажденного PBS и фильтровали через сито с размером ячеек 70 мкм для стандартизации плотности клеток между контрольными и экспериментальными группами. Аликвоты по 250 мкл переносили в пробирки DNA LoBind. Для окрашивания добавляли 250 мкл раствора (2x), содержащего LysoTracker Deep Red (1:5000), LipidTOX Deep Red (1:100) или Lipidraft 555 CT-B (1:500). Образцы с Lipidraft 555 инкубировали 10 минут при 4°C, центрифугировали (200 g, 3 минуты), ресуспендировали в PBS, повторно центрифугировали и докрашивали антителами Lipidraft 555 CT-B (1:200) в течение 15 минут при 4°C. Образцы с Lysotracker и LipidTOX инкубировали 30 минут при комнатной температуре. Жизнеспособность клеток оценивали после окрашивания &lt;a href=\"concepts/dapi.html\"&gt;DAPI&lt;/a&gt; (0,1 мкг/мл) после финального центрифугирования (200 g, 3 минуты) и ресуспендирования в 200 мкл PBS.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;FACS (проточная цитометрия) — метод анализа клеток в потоке жидкости, позволяющий быстро оценить физические параметры и уровень флуоресценции тысяч отдельных клеток.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tonkoslojnaya-hromatografiya-tsh-gangliozidov\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#tonkoslojnaya-hromatografiya-tsh-gangliozidov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тонкослойная хроматография (ТСХ) ганглиозидов&lt;/span&gt;&lt;/a&gt;Тонкослойная хроматография (ТСХ) ганглиозидов&lt;/h4&gt;\n&lt;p&gt;Лиофилизированные клетки гомогенизировали ультразвуком в смеси метанол/хлороформ (1:1, 1 мл), затем добавляли 0,5 мл воды и повторно обрабатывали ультразвуком. Ганглиозиды отделяли от белков центрифугированием (2000 об/мин, 20 минут). Верхнюю водную фазу собирали, а к органической фазе добавляли 0,25 мл воды для повторной экстракции. Объединенные фазы пропускали через колонку Waters LC-18, элюируя ганглиозиды метанолом (6 мл) и смесью метанол/хлороформ (1:1, 6 мл). Фракции упаривали в вакууме, взвешивали сухой остаток и растворяли в смеси метанол/хлороформ. Анализ проводили на стеклянных пластинах Silica F254 (20x10 см, 15 мкм) в подвижной фазе метанол/хлороформ/0,2% CaCl2 (45:55:10). Результаты визуализировали орциноловым красителем и сравнивали с эталонными ганглиозидами мозга свиньи. Изображения пластин получали на камеру Sony IMX789 (48 Мп), интенсивность полос анализировали в ImageJ. Для нормализации по общему белку использовали метод Лоури после растворения твердого осадка в 0,1 М NaOH.&lt;/p&gt;\n&lt;h4 id=\"lc-ms/ms-kolichestvennoe-opredelenie-glyukozilsfingozina-lyso-gb1\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#lc-ms/ms-kolichestvennoe-opredelenie-glyukozilsfingozina-lyso-gb1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LC-MS/MS количественное определение глюкозилсфингозина (lyso-Gb1)&lt;/span&gt;&lt;/a&gt;LC-MS/MS количественное определение глюкозилсфингозина (lyso-Gb1)&lt;/h4&gt;\n&lt;p&gt;Органоиды (75-й день) замораживали на сухом льду. Лизаты готовили в PBS (100 мкл на 10 мг ткани) с использованием ультразвука. 10% объема отбирали для BCA-анализа белка. К остатку добавляли 3 объема метанола, перемешивали, центрифугировали (1500 g, 5 минут, 4°C) и собирали супернатант. К 100 мкл размороженного супернатанта добавляли 20 мкл внутреннего стандарта и 300 мкл ацетонитрила, инкубировали 20 минут при –20°C, затем центрифугировали (1300 об/мин, 10 минут). Супернатант упаривали под азотом при 40°C (45–60 минут). Остаток растворяли в смеси вода/ацетонитрил/муравьиная кислота (65/35/0,1), центрифугировали и анализировали 15 мкл пробы методом &lt;a href=\"concepts/zhidkostnaya-hromatografiya-tandemnaya-mass-spektrometriya.html\"&gt;LC-MS/MS&lt;/a&gt;.&lt;/p&gt;\n&lt;h4 id=\"odnokletochnoe-rnk-sekvenirovanie-scrnaseq\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#odnokletochnoe-rnk-sekvenirovanie-scrnaseq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Одноклеточное РНК-секвенирование (scRNAseq)&lt;/span&gt;&lt;/a&gt;Одноклеточное РНК-секвенирование (scRNAseq)&lt;/h4&gt;\n&lt;p&gt;Для анализа использовали органоиды на 75 ± 3 (7–10 штук) и 150 (2–3 штуки) дни развития. Диссоциацию тканей проводили ферментативным методом: органоиды измельчали скальпелем до фрагментов 1 мм² и инкубировали в растворе папаина (30–50 Ед/мл), L-цистеина (4 мг/20 мл) и ДНКазы I (12500 Ед/мл) при 37°C в течение 75–90 минут на орбитальном шейкере. Живые клетки отделяли от дебриса центрифугированием в градиенте плотности (растворы Low/High Ovo) при 100 g. Фиксацию клеток проводили согласно протоколу Chromium Fixed RNA Profiling (10X Genomics), используя буферы для фиксации и гашения, с последующим добавлением глицерина для хранения при -80°C.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/dissotsiatsiya.html\"&gt;Диссоциация&lt;/a&gt; — это процесс разделения тканей на отдельные клетки для анализа их индивидуального транскриптома, а фиксация позволяет сохранить РНК-профиль клеток для последующего секвенирования.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Первичную обработку данных выполняли через конвейер Nextflow (CellRanger v7.1.0). Фильтрацию пустых капель проводили с помощью EmptyDrops (FDR ≤ 0.01), что позволило получить от 5,7 до 7,6 тыс. клеток на образец. Дальнейший анализ проводили в R (v4.2.2) с использованием пакета Seurat (v4.3.0). Данные разделили на две группы: hCO (&lt;a href=\"concepts/brain-organoids.html\"&gt;мозговые органоиды&lt;/a&gt;) и hSO (органоиды спинного мозга). Контроль качества включал удаление дублетов (DoubletFinder, 5%) и клеток с содержанием митохондриальных генов &amp;gt; 15% или количеством детектируемых генов &amp;lt; 2000. В итоговую выборку вошли 43 339 клеток для hCO и 39 234 для hSO.&lt;/p&gt;\n&lt;p&gt;Кластеризацию проводили методами UMAP, FindNeighbors и FindClusters. Для hCO использовали интегрированный анализ, для hSO — SCT-трансформацию. Маркерные гены определяли тестом Уилкоксона (min.pct = 0.8, logFC &amp;gt; 0.65). Траектории развития строили в Monocle3, задавая радиальную глию или ранние предшественники интернейронов как корневые клетки. Дифференциальную экспрессию (DEA) оценивали t-тестом (порог /log2FC/ &amp;gt; 0.65, padj &amp;lt; 0.05 с поправкой Бонферрони). Функциональное обогащение (GO) и GSEA выполняли через пакет clusterProfiler (Рис. SN).&lt;/p&gt;\n&lt;h4 id=\"registraciya-aktivnosti-na-mikroelektrodnyh-matricah-mea\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#registraciya-aktivnosti-na-mikroelektrodnyh-matricah-mea\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Регистрация активности на микроэлектродных матрицах (MEA)&lt;/span&gt;&lt;/a&gt;Регистрация активности на микроэлектродных матрицах (MEA)&lt;/h4&gt;\n&lt;p&gt;Для оценки электрофизиологической активности органоиды hCO и hSO (возраст 150 дней и старше) переносили на матрицы 60PedotMEA200/30iR-Au с использованием среды BrainPhys, уравновешенной по CO₂ и температуре. Для фиксации органоида над электродами применяли специальный прижим (harp). После 30-минутной стабилизации в инкубаторе (37^° C, 5% CO₂, 95% O₂) образцы помещали в систему MEA2100 с непрерывной перфузией газовой смеси. Базовую активность записывали в течение 5 минут с частотой 20 кГц. Затем последовательно вводили пикротоксин (PTX, 100 мкМ) и смесь PTX (100 мкМ), NBQX (5 мкМ) и DL-APV (100 мкМ) с периодами стабилизации по 5 минут перед каждой 5-минутной записью. Данные сохранялись в формате .hdf5 для последующего анализа спайков и пачек импульсов в Python и R Studio.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Микроэлектродные матрицы (MEA) — это устройства с множеством сенсоров, позволяющие регистрировать электрические сигналы от нейронов в реальном времени, что дает возможность оценить функциональную зрелость и сетевую активность органоидов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sozdanie-trikultur-putem-napravlennogo-programmirovaniya\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#sozdanie-trikultur-putem-napravlennogo-programmirovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Создание трикультур путем направленного программирования&lt;/span&gt;&lt;/a&gt;Создание трикультур путем направленного программирования&lt;/h4&gt;\n&lt;p&gt;Для получения индуцированных нейронов (iNs), интернейронов (iGNs) и астроцитов (iA) использовали модифицированные протоколы с применением лентивирусной трансдукции. Клетки iPSC (конфлюэнтность ~80%) высевали на подложку Matrigel в концентрациях 3 × 10⁵ (iNs), 3,5 × 10⁵ (iGNs) или 4 × 10⁵ (iA) на лунку. На следующий день вводили лентивирусы с факторами Ngn2, Ascl1+Dlx2 или NFIB+SOX9. С 0-го дня в среду добавляли доксициклин (2,5 мкг/мл) для активации экспрессии трансгенов.&lt;/p&gt;\n&lt;p&gt;Для нейронов использовали селекцию пуромицином (1,25 мкг/мл) в течение 48 часов, а для интернейронов дополнительно гигромицином (200 мкг/мл). С 5-го дня в среду добавляли факторы роста NT3 и BDNF (по 10 нг/мл), а для интернейронов — AraC (5 мкМ) для удаления делящихся клеток. Астроциты культивировали в среде с 10% FBS, постепенно заменяя её на среду с FGFb (8 нг/мл), CNTF (5 нг/мл) и BMP4 (10 нг/мл). На 7-й день клетки диссоциировали, фильтровали через сито 40 мкм и объединяли в пропорции 6:3:2 (iN:iGN:iA) с общим числом 2,8 × 10⁵ клеток на чашку IBIDI.&lt;/p&gt;\n&lt;h4 id=\"vysokoplotnye-matricy-mikroelektrodov-hd-mea\"&gt;&lt;a href=\"2026-10-02/isogenic-forebrain-organoids-uncover-early-neurodevelopmenta.html#vysokoplotnye-matricy-mikroelektrodov-hd-mea\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Высокоплотные матрицы микроэлектродов (HD-MEA)&lt;/span&gt;&lt;/a&gt;Высокоплотные матрицы микроэлектродов (HD-MEA)&lt;/h4&gt;\n&lt;p&gt;Химерные трикультуры готовили согласно протоколу «Forward programmed tricultures» с небольшими изменениями. 24-луночные планшеты MaxTwo кондиционировали 0,6 мл среды в течение 48 ч при 5% CO2 и 37°C. Лунки покрывали 50 мкл 0,1 мг/мл раствора PDL, инкубировали 1 ч при 37°C, промывали ddH2O и высушивали. Затем наносили 50 мкл 5 мкг/мл RhLam521 (Biolamina) в DPBS +/+ и хранили планшеты при 4°C. Нейроны, интернейроны и астроциты высевали в соотношении 6:3:2 (всего 6,2 × 10⁴ клеток на 50 мкл среды с 10 мкМ ингибитором Rho-киназы). После 1 ч инкубации добавляли еще 0,6 мл среды с ингибитором и 1:100 пенициллином/стрептомицином. С 14 по 54 день культуры переносили в систему MaxTwo &lt;a href=\"concepts/hd-mea.html\"&gt;HD-MEA&lt;/a&gt; (MaxWell Biosystems). После 5-минутной адаптации проводили сканирование активности (90 с, Checker Board) для картирования электродов. Выбор электродов для записи (Feature Maximization, частота спайков, 1020 электродов) осуществляли на основе базовой записи длительностью 300 с. На 54-й день добавляли 100 мкМ пикротоксин
