            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"125\" cy=\"106\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"695\" cy=\"192\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Смогут ли нейросети навести&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;порядок в хаосе&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;биологических данных&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data-f1.jpg\" alt=\"Рисунок 1: Рисунок создан путем загрузки полной онтологии BAO в формате OWL и построения поддерева в PowerPoint.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Рисунок создан путем загрузки полной онтологии &lt;a href=\"concepts/bioassay-ontology.html\"&gt;BAO&lt;/a&gt; в формате OWL и построения поддерева в PowerPoint.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Биологические базы данных, такие как PubChem, содержат миллионы записей об экспериментах, но многие из них лишены структурированных метаданных. Отсутствие стандартизированных описаний мешает ученым сравнивать результаты разных исследований и эффективно использовать их для обучения нейросетей. Авторы работы протестировали семь языковых моделей, чтобы выяснить, могут ли они автоматически классифицировать протоколы экспериментов согласно онтологии BAO.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Более 99,9% записей в PubChem не имеют стандартизированных метаданных BAO.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/llm.html\"&gt;Языковые модели&lt;/a&gt; показывают точность выше 0,96 в классификации форматов анализов.&lt;/li&gt;\n&lt;li&gt;LLM способны эффективно выявлять ошибки в существующих экспертных аннотациях.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Исследователи проанализировали около 2 миллионов биоанализов в PubChem и обнаружили критическую нехватку данных: 36% записей не имеют указания формата анализа, а 89% — типа биоанализа. Для решения этой проблемы они использовали семь различных языковых моделей (LLM), включая как открытые, так и проприетарные решения, для автоматического присвоения меток из BioAssay Ontology (BAO). В качестве эталона для проверки точности (silver labels) использовались данные из базы ChEMBL.&lt;/p&gt;\n&lt;p&gt;Результаты показали, что модели достигают высокой точности (&lt;a href=\"concepts/recall.html\"&gt;recall&lt;/a&gt; от 0,96) при определении формата анализа и метода детекции. В ходе качественного анализа эксперт-куратор подтвердил, что нейросети способны находить ошибки в уже существующих аннотациях, иногда предлагая более точные классификации, чем исходные данные. Разница в производительности между открытыми и закрытыми моделями оказалась незначительной, что делает автоматизацию доступной для широкого круга научных задач.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа является препринтом, а точность моделей снижается на редких типах анализов, требующих обязательной проверки человеком.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Развитие базовых моделей для прогнозирования свойств молекул требует высокого уровня готовности данных, включая точную аннотацию метаданных. В настоящее время как открытые репозитории, так и промышленные базы данных скрининга сталкиваются с отсутствием, противоречивостью или смешением аннотаций биологических анализов. В данной работе авторы оценили масштаб проблемы отсутствующих аннотаций в базе PubChem для полей формата анализа (assay format) и метода физического детектирования (physical detection method) согласно онтологии BioAssay Ontology (BAO).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Онтология BioAssay Ontology (BAO) — это структурированная система классификации, которая позволяет стандартизировать описание биологических экспериментов, чтобы компьютеры могли «понимать» тип и условия проведения анализа.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ показал критическую нехватку данных в PubChem, содержащем около 2 миллионов биоанализов: у 36% отсутствует информация о формате анализа, у 89% — о типе биоанализа, а более чем у 99,9% записей отсутствуют термины, соответствующие BAO для формата или технологии детектирования. Это подтверждает необходимость автоматизации процесса курирования метаданных.&lt;/p&gt;\n&lt;p&gt;Для решения этой задачи исследователи изучили способность семи различных языковых моделей (LLM), включая как открытые, так и проприетарные решения, предсказывать и проверять аннотации на основе текстовых описаний анализов. Оценка проводилась на наборах данных, сформированных из PubChem и ChEMBL, путем сравнения предсказаний моделей с существующими «серебряными» метками (автоматически присвоенными ранее аннотациями).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модели показали высокую точность (recall не менее 0,96) при определении форматов биохимических и клеточных анализов, демонстрируя сопоставимую эффективность для технологий детектирования.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Хотя расхождения между моделями и исходными данными увеличивались для редких классов, ручная проверка показала, что многие из этих случаев связаны с противоречиями в самих исходных источниках, а не с ошибками моделей. В качественном исследовании с участием эксперта-куратора из индустрии было установлено, что аргументация LLM помогла специалисту пересмотреть собственные метки, что подтверждает потенциал моделей в выявлении некорректно размеченных данных. Разница в производительности между проприетарными и открытыми моделями оказалась незначительной. Несмотря на многообещающие результаты, авторы подчеркивают необходимость оценки надежности для каждого класса и обязательного участия человека перед использованием таких меток в конвейерах машинного обучения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на сопоставлении с существующими базами данных; автоматизированные аннотации требуют экспертного контроля, так как модели могут наследовать ошибки из обучающих выборок.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"principy-fair-i-problema-metadannyh-v-bioanaliticheskih-dannyh\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#principy-fair-i-problema-metadannyh-v-bioanaliticheskih-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Принципы FAIR и проблема метаданных в биоаналитических данных&lt;/span&gt;&lt;/a&gt;Принципы FAIR и проблема метаданных в биоаналитических данных&lt;/h4&gt;\n&lt;p&gt;Принципы FAIR (находимость, доступность, интероперабельность, повторное использование) призваны упорядочить научные данные, однако их готовность к использованию в моделях искусственного интеллекта остается низкой. Основная проблема заключается в неполных, противоречивых или некорректных метаданных в репозиториях. Базы биоаналитических данных (bioassay) критически важны для машинного обучения в поиске лекарств, так как они описывают реакцию биологических систем на вещества. В крупнейшей базе PubChem содержится более 100 миллионов соединений и результаты свыше 1 миллиона анализов, но многие записи лишены структурированных метаданных о формате эксперимента или методе детекции. Это связано как с устареванием данных, так и с отсутствием единой терминологии.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Существующие базы данных, такие как PubChem, содержат миллионы записей с неструктурированными метаданными, что препятствует их эффективному использованию в машинном обучении.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для решения проблемы неоднозначности была разработана онтология биоанализов (BioAssay Ontology, BAO). Она разделяет описание анализа на ортогональные оси: биологический формат, физический метод детекции, измеряемый показатель и мишень. Это позволяет различать анализы, которые имеют схожий формат, но используют разные методы детекции. Однако текущие метки в PubChem, такие как «In vivo/Toxicity» или «Cell-based/RNAi», объединяют формат, модальность и конечную точку в одну строку, что невозможно исправить вручную для миллионов записей. Авторы предлагают использовать большие языковые модели (LLM) для автоматизации этого процесса. В работе оцениваются 4 открытые и 3 закрытые модели на предмет классификации форматов и методов детекции согласно BAO, с использованием перекрестных ссылок ChEMBL и экспертной проверки.&lt;/p&gt;\n&lt;h4 id=\"ontologiya-biologicheskih-analizov-bioassay-ontology,-bao\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#ontologiya-biologicheskih-analizov-bioassay-ontology,-bao\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Онтология биологических анализов (BioAssay Ontology, BAO)&lt;/span&gt;&lt;/a&gt;Онтология биологических анализов (BioAssay Ontology, BAO)&lt;/h4&gt;\n&lt;p&gt;Онтология BAO была создана для перевода результатов высокопроизводительного скрининга из формата свободного текста в логически строгие описания. Модель BAO фокусируется на декомпозиции анализов по категориям: биологический компонент, мишень, конечная точка, формат и метод. Несмотря на постоянные обновления — текущая версия v2.8.19 от 6 мая 2026 года включает 7918 классов — охват всех существующих анализов остается сложной задачей. Например, в 2014 году BAO не могла адекватно описать все анализы транспортеров в ChEMBL.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Онтология — это формализованная система знаний, которая определяет понятия и связи между ними, позволяя компьютерам «понимать» структуру данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ранее применение BAO требовало ручной разметки. Исследование Vempati et al. показало, что можно сопоставить 944 анализа PubChem с 20 терминами BAO, что снижает терминологическую неоднозначность. Промышленность также использует этот подход: компания AstraZeneca применила BAO для аннотирования 381 внутреннего анализа (2005–2013 гг.) и 233 анализов из PubChem, чтобы выявить технологические разрывы и артефакты. Тем не менее, ручной труд не позволяет масштабировать этот подход на миллионы доступных биоанализов.&lt;/p&gt;\n&lt;h4 id=\"annotirovannye-publichnye-repozitorii-dannyh\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#annotirovannye-publichnye-repozitorii-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Аннотированные публичные репозитории данных&lt;/span&gt;&lt;/a&gt;Аннотированные публичные репозитории данных&lt;/h4&gt;\n&lt;p&gt;В данной работе мы используем три источника аннотаций биологических анализов: PubChem, ChEMBL и BARD. PubChem представляет собой крупнейшую коллекцию данных высокопроизводительного скрининга и медицинской химии, накопленную с 2004 года. По состоянию на момент выгрузки, база содержит около 1,9 млн биологических анализов (AID). Однако качество метаданных в них неоднородно: часто они представлены в виде неструктурированного текста. Для решения этой проблемы проект BARD создал набор курируемых аннотаций BAO (BioAssay Ontology) для записей PubChem, полученных в рамках программы NIH Molecular Libraries Program. Эксперты вручную сопоставили текстовые протоколы с терминами BAO. Хотя портал BARD закрыт, 4477 аннотаций для 1000 анализов остаются доступными в PubChem. Из них 997 имеют аннотированный метод детекции, а 998 — формат анализа.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BARD предоставляет наиболее точные, экспертно проверенные аннотации, тогда как PubChem и ChEMBL содержат более обширные, но менее структурированные или неполные данные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ChEMBL — это база данных биоактивности, курируемая вручную на основе научной литературы и добровольных взносов, включающая около 2,0 млн анализов. Несмотря на стандартизацию, около 10% записей не имеют указанного формата, а метки методов детекции часто отсутствуют или сгенерированы ненадежными алгоритмами. Мы ранжируем источники по надежности: BARD — как эталон, ChEMBL — как вторичный источник, и нативные метаданные PubChem — как наименее надежные. Существующие подходы, такие как LIT-PCBA, MF-PCBA или CAPRICHO, пытаются очищать данные или помечать ошибки, однако они ограничены использованием ключевых слов и существующих полей, что подчеркивает необходимость автоматизации через LLM.&lt;/p&gt;\n&lt;h4 id=\"kurirovanie-biologicheskih-analizov-s-pomoshyu-yazykovyh-modelej\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#kurirovanie-biologicheskih-analizov-s-pomoshyu-yazykovyh-modelej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Курирование биологических анализов с помощью языковых моделей&lt;/span&gt;&lt;/a&gt;Курирование биологических анализов с помощью языковых моделей&lt;/h4&gt;\n&lt;p&gt;LLM демонстрируют высокую эффективность в извлечении метаданных из биомедицинских записей. Например, модели на базе LLaMA успешно извлекают параметры ChIP-seq или данные о клеточных линиях и генных возмущениях, превосходя традиционные методы сопоставления. В области аннотирования форматов анализов применяются методы распознавания именованных сущностей (NER) и связывания с онтологиями (text2term).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM (Large Language Models) — нейросети, способные понимать и генерировать текст, которые в данном контексте используются для структурирования неформализованных описаний экспериментов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование LLM сопряжено с риском генерации нестандартных меток, поэтому современные методы включают этапы привязки вывода модели к формальным онтологиям.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Существующие подходы, такие как RELATE, используют фреймворки «поиск-затем-промпт» для привязки ответов LLM к терминам онтологий, что минимизирует риск появления невалидных меток. На текущий момент вопрос о том, могут ли подобные стратегии надежно и единообразно назначать метки BAO (формат, детекция, мишень) на основе свободного текста, остается неизученным, и наша работа направлена на заполнение этого пробела.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"rabochij-process-audita-na-osnove-bolshih-yazykovyh-modelej\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#rabochij-process-audita-na-osnove-bolshih-yazykovyh-modelej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Рабочий процесс аудита на основе больших языковых моделей&lt;/span&gt;&lt;/a&gt;Рабочий процесс аудита на основе больших языковых моделей&lt;/h4&gt;\n&lt;p&gt;Учитывая пропуски, неоднородность и противоречия в метаданных, выявленные ранее, мы оценили возможность использования больших языковых моделей (LLM) для масштабируемого присвоения меток биоанализов. Прогнозы моделей сравнивались с существующими аннотациями из баз PubChem, ChEMBL и BARD, которые мы называем «серебряными» метками. Поскольку эти эталонные данные сами могут содержать ошибки или быть неполными, представленные метрики классификации не следует считать окончательным показателем точности. Для контроля мы провели ручную проверку подвыборки данных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Коэффициент каппа Коэна (Cohen’s κ) — статистический показатель, оценивающий степень согласия между двумя оценщиками, где 1 означает полное совпадение, а 0 — случайное соответствие.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"nadezhnost-v-sravnenii-s-serebryanymi-istochnikami\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#nadezhnost-v-sravnenii-s-serebryanymi-istochnikami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Надежность в сравнении с «серебряными» источниками&lt;/span&gt;&lt;/a&gt;Надежность в сравнении с «серебряными» источниками&lt;/h4&gt;\n&lt;p&gt;Мы оценили согласованность ответов LLM с помощью коэффициента каппа Коэна. В наборе данных ChEMBL все семь моделей показали высокую согласованность (κ &amp;gt; 0,9), аналогичные результаты получены для задач классификации BAO. На меньшей выборке PubChem-BAO согласованность снизилась, но осталась высокой (κ &amp;gt; 0,8), за исключением модели Gemma 3 27B, показавшей более низкие результаты. При использовании метода голосования большинства LLM совпадали с метками ChEMBL в 96% случаев. Форматы «клеточный» и «биохимический» классифицировались стабильно хорошо (полнота/recall ≥ 96%). Для «организменного» формата показатели варьировались: модель Gemma 3 27B достигла максимальной точности (precision), но сделала меньше всего прогнозов. В целом для этого класса полнота составила 87%, а точность — 77%.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модели LLM показали высокую согласованность (κ &amp;gt; 0,8–0,9) и точность до 96% для большинства форматов, однако их эффективность снижается на редких классах данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для форматов «бесклеточный» и «тканевый» точность и полнота оказались значительно ниже, с максимум одним верным прогнозом. Однако ручная проверка показала, что в 7 из 8 таких случаев метки BARD отличались от ChEMBL, и LLM совпадали с BARD, либо эксперт подтверждал правоту модели. Мы проанализировали 43 случая расхождения LLM с ChEMBL (Таблица 2). В 17 случаях (59%) консенсус LLM совпадал с метками BARD, которые проходят более строгую верификацию, чем ChEMBL. В ситуациях, где ChEMBL и BARD совпадали, а модели — нет, разногласия среди самих LLM были неполными, что указывает на потенциал использования «структурированных дебатов» между моделями для уточнения ответов.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 2.&lt;/strong&gt; Категоризация 43 анализов ChEMBL, где большинство LLM не согласились с форматом ChEMBL BAO&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Паттерн расхождения&lt;/th&gt;\n&lt;th&gt;Количество&lt;/th&gt;\n&lt;th&gt;%&lt;/th&gt;\n&lt;th&gt;Отправлено на проверку&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;LLMs support the BARD label against ChEMBL&lt;/td&gt;\n&lt;td&gt;623968&lt;/td&gt;\n&lt;td&gt;spectrophotometry / fluorescence method / quantitative reverse transcription PCR (this is not a physical detection method but an assay supporting method)&lt;/td&gt;\n&lt;td&gt;– 3/3 (6 att.)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;ChEMBL and BARD agree and LLMs disagree with both&lt;/td&gt;\n&lt;td&gt;588778&lt;/td&gt;\n&lt;td&gt;fluorescence / spectrophotometry / (no other)&lt;/td&gt;\n&lt;td&gt;– 5/2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;ChEMBL and BARD disagree and LLMs disagree with both (novel prediction)&lt;/td&gt;\n&lt;td&gt;602418&lt;/td&gt;\n&lt;td&gt;luminescence / fluorescence / (no other)&lt;/td&gt;\n&lt;td&gt;– 3/0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;No BARD label available; ChEMBL-only ground truth&lt;/td&gt;\n&lt;td&gt;588816&lt;/td&gt;\n&lt;td&gt;fluorescence / simple measurement method / (no other)&lt;/td&gt;\n&lt;td&gt;– 3/1 (6 att.)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;602170&lt;/td&gt;\n&lt;td&gt;spectrophotometry / visual observation method / (no other)&lt;/td&gt;\n&lt;td&gt;– 3/1&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;624103&lt;/td&gt;\n&lt;td&gt;fluorescence / simple measurement method / (no other)&lt;/td&gt;\n&lt;td&gt;– 3/2 (6 att.)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Указано количество и процент паттернов расхождения, отправленных на проверку старшим промышленным куратором (Таблица 13).&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование «серебряных» меток в качестве эталона ограничено их потенциальной неточностью; корреляция между предсказаниями LLM и базами данных не доказывает безошибочность моделей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ekspertnaya-ocenka-annotacij\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#ekspertnaya-ocenka-annotacij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Экспертная оценка аннотаций&lt;/span&gt;&lt;/a&gt;Экспертная оценка аннотаций&lt;/h4&gt;\n&lt;p&gt;Мы провели дополнительный ручной анализ для 17 анализов (AID), где мнения экспертов и консенсус больших языковых моделей (LLM) различались. В выборку вошли случаи, когда метки ChEMBL и PubChem BARD совпадали, а LLM — нет; четыре случая, где LLM согласились с BARD, но разошлись с ChEMBL; а также ситуации, где LLM не совпали ни с одним из источников. Экспертам предоставлялись те же данные, что и моделям: название, описание, комментарии и протокол.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BAO (BioAssay Ontology) — это стандартизированная система классификации биологических анализов, которая помогает упорядочить данные о методах исследования лекарственных соединений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эксперты отметили сложность задачи. В 6 случаях они сразу согласились с большинством LLM, еще в 6 — после ознакомления с аргументацией моделей. В 4 случаях эксперты сочли выводы LLM правдоподобными (в 3 из них — после изучения доказательств), но не смогли присвоить однозначную метку. Это указывает на то, что некоторые анализы могут относиться к нескольким категориям или содержать недостаточно данных для классификации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В ряде случаев LLM помогли экспертам исправить первоначальные ошибки, вызванные невнимательностью к определениям BAO, однако модели также допускали ошибки, путая клеточные линии с целыми организмами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Например, для AID 2695 эксперт сначала классифицировал анализ как «клеточный», но после анализа доводов LLM согласился, что это «организменный» формат, так как согласно BAO, одноклеточные организмы относятся к категории организмов. В случае AID 588769 модели выявили вероятную ошибку в разметке PubChem. Однако для AID 504631 эксперт предпочел метку ChEMBL, так как LLM ошибочно классифицировали живой организм как клеточную линию, несмотря на верное извлечение доказательств. Сравнение с данными PubChem (Таблица 3) подтвердило, что LLM чаще соглашаются с BARD, чем с независимыми аннотациями PubChem, что указывает на отсутствие единого стандарта «истинной» разметки в базах данных.&lt;/p&gt;\n&lt;h4 id=\"obsuzhdenie-i-vyvody\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#obsuzhdenie-i-vyvody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение и выводы&lt;/span&gt;&lt;/a&gt;Обсуждение и выводы&lt;/h4&gt;\n&lt;p&gt;Наш аудит показал, что массовая выгрузка данных из PubChem содержит неполные метаданные: примерно 36% записей не имеют указания формата анализа, и менее 0,1% содержат структурированную аннотацию BAO. Мы также выявили расхождения между ресурсами: в 10% из 236 анализов, для которых были доступны метки формата как в BARD, так и в ChEMBL, данные не совпадали. Эти пробелы обусловлены тем, что многие поля метаданных при депонировании являются необязательными, а также ограниченным словарем поля «Assay Format» в PubChem по сравнению с иерархией BAO.&lt;/p&gt;\n&lt;p&gt;Для решения этой проблемы мы протестировали семь LLM (как проприетарных, так и с открытым исходным кодом). Модели показали высокую степень согласованности, восстанавливая хорошо обоснованные классы форматов анализа с полнотой (recall) выше 0,96. Ручная проверка случаев, где ответы LLM расходились с «серебряными» метками, показала, что ошибки часто связаны с противоречиями между источниками или неверной маркировкой, а не с самими моделями. Более чем в трети случаев, где большинство LLM не соглашались с ChEMBL, они фактически совпадали с меткой PubChem/BARD, а наш старший куратор в ряде случаев пересматривал свои решения после ознакомления с доказательствами, приведенными моделями.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM демонстрируют высокую точность (recall &amp;gt; 0,96) в классификации форматов анализов и могут эффективно выявлять противоречия в существующих базах данных, работая значительно дешевле ручной курации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Различия между проприетарными и открытыми моделями были незначительными, что делает последние жизнеспособным вариантом для масштабной аннотации. Стоимость аудита 1000 записей составляет $3–9, что на порядки дешевле ручной перепроверки. Мы предполагаем, что LLM могут стать важным звеном в конвейере аннотирования: они способны помечать противоречивые записи, извлекать текстовые доказательства и направлять неоднозначные случаи экспертам. При этом наши результаты имеют ограничения: «серебряные» метки лишь частично надежны, поэтому полнота, рассчитанная по ним, отражает согласие с существующей курацией, а не абсолютную истину. Кроме того, оценка проводилась на первом уровне глубины BAO, а ограничения API PUG JSON лимитировали объем выборки.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Серебряные» метки — это данные, полученные автоматизированным способом или из существующих баз, которые считаются достаточно качественными для обучения, но не являются эталонными (золотым стандартом).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Качественная валидация также ограничена тем, что проводилась одним экспертом. Мы выявили специфический тип ошибки: для AID 504631 модели приводили верные доказательства (что Plasmodium falciparum — одноклеточный организм), но ошибочно классифицировали анализ как клеточный, а не организменный. Это подчеркивает необходимость выборочной проверки человеком. Процесс также выявил пробелы в самой онтологии BAO: отсутствие определения для «биосенсора» и неоднозначность методов «простого измерения» и «визуального наблюдения». В дальнейшем мы планируем экспериментировать с большей глубиной гранулярности BAO и использовать LLM для разрешения конфликтов в «серебряных» метках.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 1.&lt;/strong&gt; Отзывчивость/точность по классам для базовой модели ChEMBL (формат анализа)&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Модель&lt;/th&gt;\n&lt;th&gt;Acc.&lt;/th&gt;\n&lt;th&gt;mF1&lt;/th&gt;\n&lt;th&gt;mF1top3&lt;/th&gt;\n&lt;th&gt;на основе организмов (n=784)&lt;/th&gt;\n&lt;th&gt;на основе тканей (n=252)&lt;/th&gt;\n&lt;th&gt;бесклеточные (n=53)&lt;/th&gt;\n&lt;th&gt;(n=6)&lt;/th&gt;\n&lt;th&gt;(n=2)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Claude Sonnet&lt;/td&gt;\n&lt;td&gt;4.6&lt;/td&gt;\n&lt;td&gt;0.963&lt;/td&gt;\n&lt;td&gt;0.560&lt;/td&gt;\n&lt;td&gt;0.934&lt;/td&gt;\n&lt;td&gt;0.98 / 0.99&lt;/td&gt;\n&lt;td&gt;0.96 / 0.98&lt;/td&gt;\n&lt;td&gt;0.88 / 0.83&lt;/td&gt;\n&lt;td&gt;0.00 / – 0.00 / 0.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Gemini 3.6 Flash&lt;/td&gt;\n&lt;td&gt;0.957&lt;/td&gt;\n&lt;td&gt;0.578&lt;/td&gt;\n&lt;td&gt;0.919&lt;/td&gt;\n&lt;td&gt;0.97 / 0.99&lt;/td&gt;\n&lt;td&gt;0.96 / 0.97&lt;/td&gt;\n&lt;td&gt;0.94 / 0.71&lt;/td&gt;\n&lt;td&gt;0.00 / –&lt;/td&gt;\n&lt;td&gt;0.50 / 0.08&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;GPT-4o&lt;/td&gt;\n&lt;td&gt;0.954&lt;/td&gt;\n&lt;td&gt;0.551&lt;/td&gt;\n&lt;td&gt;0.919&lt;/td&gt;\n&lt;td&gt;0.96 / 0.99&lt;/td&gt;\n&lt;td&gt;0.96 / 0.97&lt;/td&gt;\n&lt;td&gt;0.91 / 0.74&lt;/td&gt;\n&lt;td&gt;0.00 / –&lt;/td&gt;\n&lt;td&gt;0.00 / 0.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;GPT-OSS 20B&lt;/td&gt;\n&lt;td&gt;0.956&lt;/td&gt;\n&lt;td&gt;0.602&lt;/td&gt;\n&lt;td&gt;0.908&lt;/td&gt;\n&lt;td&gt;0.97 / 0.98&lt;/td&gt;\n&lt;td&gt;0.96 / 0.97&lt;/td&gt;\n&lt;td&gt;0.77 / 0.79&lt;/td&gt;\n&lt;td&gt;0.17 / 1.00&lt;/td&gt;\n&lt;td&gt;0.00 / 0.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Gemma 3 27B&lt;/td&gt;\n&lt;td&gt;0.979&lt;/td&gt;\n&lt;td&gt;0.576&lt;/td&gt;\n&lt;td&gt;0.960&lt;/td&gt;\n&lt;td&gt;0.99 / 0.98&lt;/td&gt;\n&lt;td&gt;0.99 / 0.97&lt;/td&gt;\n&lt;td&gt;0.85 / 0.98&lt;/td&gt;\n&lt;td&gt;0.00 / –&lt;/td&gt;\n&lt;td&gt;0.00 / 0.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Gemma 4 31B&lt;/td&gt;\n&lt;td&gt;0.951&lt;/td&gt;\n&lt;td&gt;0.545&lt;/td&gt;\n&lt;td&gt;0.909&lt;/td&gt;\n&lt;td&gt;0.96 / 0.99&lt;/td&gt;\n&lt;td&gt;0.96 / 0.97&lt;/td&gt;\n&lt;td&gt;0.91 / 0.70&lt;/td&gt;\n&lt;td&gt;0.00 / –&lt;/td&gt;\n&lt;td&gt;0.00 / 0.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Llama 3.3 70B&lt;/td&gt;\n&lt;td&gt;0.976&lt;/td&gt;\n&lt;td&gt;0.572&lt;/td&gt;\n&lt;td&gt;0.954&lt;/td&gt;\n&lt;td&gt;0.99 / 0.98&lt;/td&gt;\n&lt;td&gt;0.99 / 0.98&lt;/td&gt;\n&lt;td&gt;0.85 / 0.94&lt;/td&gt;\n&lt;td&gt;0.00 / –&lt;/td&gt;\n&lt;td&gt;0.00 / 0.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Majority vote&lt;/td&gt;\n&lt;td&gt;0.961&lt;/td&gt;\n&lt;td&gt;0.553&lt;/td&gt;\n&lt;td&gt;0.921&lt;/td&gt;\n&lt;td&gt;0.97 / 0.98&lt;/td&gt;\n&lt;td&gt;0.97 / 0.97&lt;/td&gt;\n&lt;td&gt;0.87 / 0.77&lt;/td&gt;\n&lt;td&gt;0.00 / –&lt;/td&gt;\n&lt;td&gt;0.00 / 0.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Значения указаны как R/P; поддержка (ntrue) указана один раз для каждого столбца в заголовке. Два класса с наименьшей поддержкой (на основе тканей и бесклеточные, n&amp;lt;10) слишком малы для надежных агрегированных метрик. Некорректные предсказания исключены из этих метрик. Точность указана как «–», если предсказаний не было.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 12.&lt;/strong&gt; Ручная проверка 43 анализов, где большинство LLM не согласились с форматом ChEMBL BAO&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;ID&lt;/th&gt;\n&lt;th&gt;ChEMBL&lt;/th&gt;\n&lt;th&gt;BARD (если отл.)&lt;/th&gt;\n&lt;th&gt;Комментарий&lt;/th&gt;\n&lt;th&gt;ndis&lt;/th&gt;\n&lt;th&gt;nal&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;2096&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;organism-based&lt;/td&gt;\n&lt;td&gt;ChEMBL and BARD agree; LLMs disagree&lt;/td&gt;\n&lt;td&gt;4 3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2695&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;organism-based&lt;/td&gt;\n&lt;td&gt;ChEMBL and BARD agree; LLMs disagree&lt;/td&gt;\n&lt;td&gt;4 3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;492959&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;organism-based&lt;/td&gt;\n&lt;td&gt;ChEMBL and BARD agree; LLMs disagree&lt;/td&gt;\n&lt;td&gt;4 3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;651893&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;organism-based&lt;/td&gt;\n&lt;td&gt;ChEMBL and BARD agree; LLMs disagree&lt;/td&gt;\n&lt;td&gt;4 3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;504494&lt;/td&gt;\n&lt;td&gt;biochemical&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;cell-free&lt;/td&gt;\n&lt;td&gt;LLMs disagree with both ChEMBL and BARD&lt;/td&gt;\n&lt;td&gt;5 2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;463208&lt;/td&gt;\n&lt;td&gt;biochemical&lt;/td&gt;\n&lt;td&gt;cell-based&lt;/td&gt;\n&lt;td&gt;cell-free (6 att.)&lt;/td&gt;\n&lt;td&gt;LLMs disagree with both ChEMBL and BARD&lt;/td&gt;\n&lt;td&gt;4 2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Все метки — форматы анализа BAO; суффикс «format» опущен для экономии места. ndis — количество моделей, не согласных с ChEMBL, nal — количество моделей, согласных с ChEMBL; если не указано иное, для каждой строки использовалось семь моделей. Строки, выделенные серым, были отправлены на проверку старшим промышленным куратором (Таблица 13).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 15.&lt;/strong&gt; Ручная проверка 34 анализов физических методов детекции, где большинство моделей не согласились с меткой BAO из стороннего источника в выгрузке PubChem&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;AID&lt;/th&gt;\n&lt;th&gt;Метка BAO (сторонняя)&lt;/th&gt;\n&lt;th&gt;Прогноз большинства&lt;/th&gt;\n&lt;th&gt;Аннотация биоанализа (PubChem)&lt;/th&gt;\n&lt;th&gt;Комментарий&lt;/th&gt;\n&lt;th&gt;nmaj./nal.&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;624135&lt;/td&gt;\n&lt;td&gt;fluorescence&lt;/td&gt;\n&lt;td&gt;simple measurement method&lt;/td&gt;\n&lt;td&gt;(no other)&lt;/td&gt;\n&lt;td&gt;–&lt;/td&gt;\n&lt;td&gt;3/2 (6 att.)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;624334&lt;/td&gt;\n&lt;td&gt;fluorescence&lt;/td&gt;\n&lt;td&gt;visual observation method&lt;/td&gt;\n&lt;td&gt;(no other)&lt;/td&gt;\n&lt;td&gt;–&lt;/td&gt;\n&lt;td&gt;2/0 (6 att.)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Все метки относятся к физическим методам детекции BAO; суффикс «method» опущен для экономии места. nmaj. — количество моделей, поддерживающих прогноз большинства; nal. — количество прогнозов, совпавших со сторонней меткой BAO. Если не указано иное, для каждой строки использовалось 7 моделей. Строки, выделенные серым, были дополнительно проверены старшим промышленным куратором.&lt;/em&gt;&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"sozdanie-nabora-dannyh\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#sozdanie-nabora-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Создание набора данных&lt;/span&gt;&lt;/a&gt;Создание набора данных&lt;/h4&gt;\n&lt;p&gt;Для оценки способности LLM классифицировать метаданные биологических анализов был сформирован датасет на основе данных PubChem BioAssay. Из 1 994 310 загруженных записей (AID) было отобрано 1 770 568, содержащих описание или комментарии. Для восполнения пропущенных полей использовался API PUG REST. Дополнительно данные были сопоставлены с базой ChEMBL 37. В итоговую выборку вошли 1097 анализов с аннотациями формата из ChEMBL, 226 анализов с аннотациями только из PubChem и 308 анализов с данными о методах физической детекции. Все метки классифицировались согласно иерархии BAO (Рис. SN 1, 2). Поскольку исходные аннотации содержат противоречия, они классифицируются как «серебряные метки» (silver labels) и используются для проверки согласованности с ответами моделей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Серебряные метки» — это данные, полученные из существующих баз, которые могут содержать ошибки или устаревшие классификации, в отличие от «золотого стандарта» (выверенных экспертами данных).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"opredelenie-zadachi-i-ispolzuemye-llm\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#opredelenie-zadachi-i-ispolzuemye-llm\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение задачи и используемые LLM&lt;/span&gt;&lt;/a&gt;Определение задачи и используемые LLM&lt;/h4&gt;\n&lt;p&gt;Модели должны предсказать формат или метод детекции на основе заголовка, описания и протокола. Использовались проприетарные модели (GPT-4o, Gemini 3.6 Flash, Claude Sonnet 4.6) через API и локальные модели с открытыми весами (Gemma 4 31B, GPT-OSS 20B, Qwen 3.5, Llama 3.3 70B) через Ollama v0.17.4. Для оценки влияния промптов была отобрана стратифицированная выборка из 500 анализов. В локальных моделях применялся параметр JSON-Schema для жесткого ограничения словаря меток.&lt;/p&gt;\n&lt;h4 id=\"propuski-i-nesootvetstviya-v-metadannyh-pubchem-bioassay\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#propuski-i-nesootvetstviya-v-metadannyh-pubchem-bioassay\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пропуски и несоответствия в метаданных PubChem BioAssay&lt;/span&gt;&lt;/a&gt;Пропуски и несоответствия в метаданных PubChem BioAssay&lt;/h4&gt;\n&lt;p&gt;Анализ показал, что из 1 994 310 записей лишь 89% содержат название, описание и комментарий, при этом менее 10% описаний уникальны. Исследование четырех категорий метаданных (формат, формат BAO, технология детекции BAO, тип BioAssay) выявило высокую гетерогенность. Поле «Тип BioAssay» оказалось непригодным для классификации из-за смешения понятий формата, методологии и конечных точек (Таблица SN 9). Ограниченность словаря PubChem (всего три категории: клеточный, организменный, биохимический) приводит к расхождениям при сопоставлении с иерархией BAO. Выявлены внутренние противоречия: например, AID 1885 в веб-интерфейсе указан как «клеточный», а в пакетной выгрузке — как «клеточный/организменный». В 10,2% случаев (24 из 236) наблюдались конфликты между метками BARD и ChEMBL. Кроме того, 36% записей не содержат данных о формате, а менее 0,1% имеют аннотации BAO в комментариях.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data-f1.jpg\" alt=\"Рисунок 1: Рисунок создан путем загрузки полной онтологии BAO в формате OWL и построения поддерева в PowerPoint.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Рисунок создан путем загрузки полной онтологии BAO в формате OWL и построения поддерева в PowerPoint.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data-f2.jpg\" alt=\"Рисунок 2: Рисунок создан путем загрузки полной онтологии BAO в формате OWL и построения поддерева в PowerPoint.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: Рисунок создан путем загрузки полной онтологии BAO в формате OWL и построения поддерева в PowerPoint.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data-f3.jpg\" alt=\"Рис. 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data-f6.jpg\" alt=\"Рис. 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 6&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data-f6-2.jpg\" alt=\"Рис. 6 (продолжение 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 6 (продолжение 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data-f7.jpg\" alt=\"Рисунок 7: Влияние двух типов возмущений промпта на предсказания проприетарных LLM для подмножества форматов анализов Ch\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 7: Влияние двух типов возмущений промпта на предсказания проприетарных LLM для подмножества форматов анализов ChEMBL.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 7: Влияние двух типов возмущений промпта на предсказания проприетарных LLM для подмножества форматов анализов ChEMBL. Удаление определений BAO (Without defs) меняет значительно больше предсказаний, чем изменение порядка классов (Order swap), причем диспропорционально сильно для Gemini 3.6 Flash (10,8%). Сегменты столбцов показывают, изменилось ли предсказание с другой метки на «серебряную» (зеленый цвет), с «серебряной» метки на другую (красный цвет) или между двумя метками, отличными от «серебряной» (оранжевый цвет); проценты над каждым столбцом указывают общую долю измененных предсказаний.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;отсутствие&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;метаданных в&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;базах данных&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тестирование&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;семи языковых&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;моделей&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;высокая&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;точность&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;классификации&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;автоматизация&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;подготовки&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;данных для ИИ&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не прошёл рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-02/can-llms-reliably-annotate-bioassay-metadata-to-improve-data.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden
