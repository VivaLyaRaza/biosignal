            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"148\" cy=\"126\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"572\" cy=\"284\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · PHYSIOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как кровь течет в сердце при&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;общем артериальном стволе:&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;первое компьютерное&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;моделирование&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus-f1.jpg\" alt=\"Рис. 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"concepts/truncus-arteriosus.html\"&gt;Общий артериальный ствол&lt;/a&gt; — это тяжелый порок развития, при котором главные сосуды сердца не разделяются до рождения. Из-за этого насыщенная кислородом и обедненная кровь смешиваются, а нагрузка на клапаны возрастает. Исследователи из Стэнфорда создали индивидуальную модель кровотока пациента, чтобы увидеть, как именно движутся потоки крови до и после хирургической коррекции. Работа помогает понять, как восстановить нормальную работу сердца при таких сложных анатомических нарушениях.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Первое исследование гидродинамики при общем артериальном стволе с использованием индивидуальных моделей.&lt;/li&gt;\n&lt;li&gt;Выявлено, что асимметричное закрытие клапана вызвано вихревыми потоками в легочных артериях.&lt;/li&gt;\n&lt;li&gt;Подтверждено наличие благоприятного распределения потоков крови в сердце даже при наличии порока.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Исследователи использовали метод погруженной границы (&lt;a href=\"concepts/immersed-boundary-method.html\"&gt;Immersed Boundary Method&lt;/a&gt;) для моделирования взаимодействия крови с четырехстворчатым клапаном. Геометрия сосудов и клапана была получена на основе данных компьютерной томографии и эхокардиографии конкретного пациента. Параметры эластичности створок клапана настраивались индивидуально, чтобы соответствовать реальным анатомическим размерам, таким как длина свободного края и геометрическая высота.&lt;/p&gt;\n&lt;p&gt;Анализ потоков проводился с помощью лагранжевых когерентных структур (&lt;a href=\"concepts/lagrangian-coherent-structures.html\"&gt;LCS&lt;/a&gt;) и отслеживания частиц (LPT). Выяснилось, что до операции асимметричное движение створок и регургитация (&lt;a href=\"concepts/regurgitatsiya.html\"&gt;обратный ток крови&lt;/a&gt;) были вызваны низким давлением и вихрями в легочных артериях. Моделирование показало, что, несмотря на смешивание крови, существует «благоприятное потоковое распределение»: кровь из левого желудочка преимущественно направляется в аорту, а из правого — в легочные артерии. После хирургического разделения сосудов гидродинамика сердца вернулась к нормальным показателям.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на моделировании данных одного пациента, что ограничивает возможность обобщения результатов на все типы порока.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Общий артериальный ствол (ОАС) представляет собой редкий и тяжелый врожденный порок сердца, при котором магистральные сосуды не разделяются в процессе внутриутробного развития. В результате формируется единый сосуд с общим клапаном, через который проходит смешанная кровь. Примерно в 25% случаев у пациентов наблюдается четырехстворчатый клапан, который часто подвержен регургитации и требует повторных хирургических вмешательств. Несмотря на критическую важность взаимодействия клапана и кровотока, гидродинамика при ОАС изучена недостаточно.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ОАС характеризуется нарушением разделения магистральных сосудов, а в 25% случаев — наличием четырехстворчатого клапана, склонного к дисфункции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для анализа были созданы индивидуальные модели взаимодействия жидкости и структуры на основе данных компьютерной томографии, полученных до и после хирургической коррекции ОАС. Геометрия четырехстворчатого клапана моделировалась с учетом эластичности, при этом длина свободного края и высота створок определялись по данным эхокардиографии. Взаимодействие крови и клапана рассчитывалось методом погруженных границ (Immersed Boundary Method). Граничные условия настраивались индивидуально для каждого пациента. Для изучения процессов перемешивания оксигенированной и дезоксигенированной крови, а также характера потоков применялись методы лагранжевых когерентных структур (LCS) и лагранжевой трассировки частиц (LPT).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод погруженных границ (Immersed Boundary Method) — это вычислительный подход, позволяющий моделировать взаимодействие гибких структур (например, створок клапана) с потоком жидкости, где границы объекта не совпадают с сеткой расчетов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Установлено, что низкое давление и одностороннее отхождение легочных артерий (ЛА) приводят к асимметричному закрытию створок и регургитации на протяжении всего сердечного цикла. Голодиастолический &lt;a href=\"concepts/reflux.html\"&gt;обратный ток&lt;/a&gt; крови в аорте обеспечивает приток к ЛА и поддерживает регургитирующую струю. Анализ LCS и LPT показал, что, несмотря на патологию, сохраняется преимущественное направление потока оксигенированной крови из левого желудочка в аорту, а дезоксигенированной — из правого желудочка в ЛА. После проведения операции нормальная гемодинамика восстанавливалась.&lt;/p&gt;\n&lt;p&gt;Данная работа является первым исследованием гидродинамики при ОАС. Использование количественных и качественных методов анализа потоков в индивидуальных моделях позволило выявить нарушения гемодинамики, вызванные односторонним отхождением ЛА, и продемонстрировать нормализацию кровотока после коррекции. Полученные данные подтверждают, что благоприятное распределение потоков (streaming) является вероятным механизмом при поражениях с полным смешиванием крови, а индивидуальное моделирование может помочь в его выявлении.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на моделировании конкретных клинических случаев, что ограничивает возможность прямого переноса результатов на всю популяцию пациентов без учета анатомической вариабельности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"obshie-svedeniya-o-trankuse-arteriozus\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#obshie-svedeniya-o-trankuse-arteriozus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общие сведения о транкусе артериозус&lt;/span&gt;&lt;/a&gt;Общие сведения о транкусе артериозус&lt;/h4&gt;\n&lt;p&gt;Транкус артериозус (ТА) представляет собой редкий и тяжелый врожденный порок сердца, при котором в процессе эмбрионального развития не происходит разделения двух главных артерий. В результате формируется единственный артериальный ствол с одним клапаном, через который проходит смесь венозной и артериальной крови. Дефект межжелудочковой перегородки (ДМЖП) обеспечивает приток крови из обоих желудочков к этому клапану, а легочные артерии отходят непосредственно от аорты, причем объем кровотока в них часто превышает аортальный более чем в три раза, что ведет к легочной гиперциркуляции.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ТА характеризуется наличием общего артериального ствола и легочной гиперциркуляцией, что требует хирургической коррекции в первые недели жизни.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"hirurgicheskoe-lechenie-i-morfologiya-klapana\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#hirurgicheskoe-lechenie-i-morfologiya-klapana\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Хирургическое лечение и морфология клапана&lt;/span&gt;&lt;/a&gt;Хирургическое лечение и морфология клапана&lt;/h4&gt;\n&lt;p&gt;Хирургическая коррекция ТА включает закрытие ДМЖП, отделение легочных артерий от аорты и создание пути оттока из правого желудочка с помощью клапансодержащего кондуита. Успех операции критически зависит от функции транкусного клапана. Часто его створки утолщены и диспластичны. Хотя в большинстве случаев клапан трехстворчатый, у 25% пациентов встречается четырехстворчатая морфология, классифицируемая на 7 фенотипов. Более трети таких пациентов нуждаются в повторных операциях из-за регургитации, вызванной прогрессирующим расширением кольца клапана, при этом трикуспидализация считается наиболее долговечным методом реконструкции.&lt;/p&gt;\n&lt;h4 id=\"obzor-sushestvuyushih-issledovanij\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#obzor-sushestvuyushih-issledovanij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор существующих исследований&lt;/span&gt;&lt;/a&gt;Обзор существующих исследований&lt;/h4&gt;\n&lt;p&gt;Несмотря на использование эхокардиографии для оценки потоков, инженерный анализ гемодинамики при ТА, особенно при четырехстворчатом клапане, развит слабо. Ранее проводились исследования на моделях свиных сердец, где четырехстворчатые клапаны демонстрировали асинхронное закрытие и замедленную кинематику по сравнению с трехстворчатыми аналогами. В то же время, гидродинамика нормальных аортальных клапанов и их протезов изучена детально: описаны процессы формирования вихрей при открытии, турбулентность при систолическом ускорении и механизмы закрытия клапана при превышении аортального давления над желудочковым.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Регургитация — это обратный ток крови через клапан, возникающий при его неполном смыкании, что создает дополнительную нагрузку на сердце.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"cel-i-metody-issledovaniya\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#cel-i-metody-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Цель и методы исследования&lt;/span&gt;&lt;/a&gt;Цель и методы исследования&lt;/h4&gt;\n&lt;p&gt;Сложная анатомия ТА с двумя входами и тремя выходами делает анализ потоков крови крайне затруднительным. Существует гипотеза о возможности «предпочтительного потока» (streaming) — разделения крови по путям, аналогично фетальному кровообращению, однако для ТА это не было доказано. Данная работа является первым исследованием гидродинамики при ТА. Авторы использовали качественные и количественные методы анализа потоков на основе пациент-специфичных моделей, чтобы оценить гемодинамику до и после хирургической коррекции.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование базируется на пациент-специфичных моделях, что требует осторожности при экстраполяции результатов на всю популяцию пациентов с ТА.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gemodinamika-i-mehanizmy-raboty-klapana-pri-korrekcii-trunkusa\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#gemodinamika-i-mehanizmy-raboty-klapana-pri-korrekcii-trunkusa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гемодинамика и механизмы работы клапана при коррекции трункуса&lt;/span&gt;&lt;/a&gt;Гемодинамика и механизмы работы клапана при коррекции трункуса&lt;/h4&gt;\n&lt;p&gt;Ранее нами была проведена оценка влияния гемодинамических факторов на функционирование клапана у пациентов до и после хирургической коррекции общего артериального ствола (трункуса) без прямого вмешательства на створках. Результаты показали, что наши вычислительные модели способны воспроизводить фенотипы, изменяющиеся в ходе операции, и выявлять механизмы улучшения работы клапана в послеоперационном периоде. Это подтвердило клиническую значимость и применимость выбранного подхода.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Разработанные вычислительные модели успешно воспроизводят изменения гемодинамики после операции, позволяя оценить эффективность хирургического вмешательства.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В текущем исследовании мы применили методы классического анализа потоков для изучения гидродинамики при трункусе артериозус (ТА) и её связи с процессами смешивания оксигенированной и дезоксигенированной крови (Рис. 1). Путем моделирования индивидуального взаимодействия структуры и потока жидкости (&lt;a href=\"concepts/fsi.html\"&gt;fluid-structure interaction&lt;/a&gt;) между кровотоком, анатомией клапана и сосудов, мы продемонстрировали наличие аномальной гидродинамики в предоперационном состоянии. Также было показано, как хирургическая коррекция восстанавливает параметры потока до уровней, сопоставимых с показателями здорового сердца.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus-f1.jpg\" alt=\"Рис. 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Fluid-structure interaction (FSI) — это метод компьютерного моделирования, который учитывает взаимное влияние движущейся жидкости (крови) и деформируемых стенок сосудов или клапанов, что критически важно для анализа сердечно-сосудистых патологий.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"gemodinamika,-formy-voln-i-kinematika-stvorok\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#gemodinamika,-formy-voln-i-kinematika-stvorok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гемодинамика, формы волн и кинематика створок&lt;/span&gt;&lt;/a&gt;Гемодинамика, формы волн и кинематика створок&lt;/h4&gt;\n&lt;p&gt;В предоперационном состоянии анатомия пациента характеризовалась отхождением обеих ветвей легочных артерий (ЛА) от общего артериального ствола (ОАС) с левой стороны. Створки клапана, расположенные проксимальнее мест отхождения ЛА, включали левую и переднюю, тогда как правая и задняя створки находились с противоположной стороны. Асимметричное расположение ЛА и низкое давление в малом круге кровообращения приводили к аномальной гемодинамике: ЛА выступали в роли «резервуара низкого давления», что вызывало падение давления сразу за клапаном. Регургитация на клапане и прямой кровоток в ЛА обеспечивались голодиастолическим потоком из аорты. Хирургическая коррекция нормализовала гемодинамику, восстановив прямой аортальный выброс и снизив регургитацию (Рис. 3).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus-f3.jpg\" alt=\"Рисунок 3: Предоперационная конфигурация: компонента скорости по потоку u, касательная к соответствующим осевым линиям с\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3: Предоперационная конфигурация: компонента скорости по потоку u, касательная к соответствующим осевым линиям сосудов, и вид клапана сверху в течение одного сердечного цикла (t = (0,55, 0,90) с). Как прямой кровоток в легочных артериях в течение всего сердечного цикла, так и регургитация клапана обеспечивались голодиастолическим обратным потоком в аорте. Регургитационная струя через трункальный клапан попадала в правый желудочек.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Хирургическая коррекция ОАС устранила аномально низкое давление за клапаном и голодиастолическую регургитацию, нормализовав профили потока.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В предоперационном состоянии наблюдалась асимметричная струя в стволе, направленная к внешней кривизне, с ретроградным потоком вдоль внутренней кривизны в систолу. Скорость потока в ЛА была значительно выше, чем в аорте. При закрытии клапана поток в стволе замедлялся и менял направление, тогда как в ЛА сохранялся прямой кровоток. В диастолу наблюдался ретроградный поток из аорты через клапан в правый желудочек (ПЖ). После операции (Рис. 4) движение потока в диастолу значительно снизилось, а голодиастолическая реверсия была устранена.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus-f4.jpg\" alt=\"Рисунок 4: Послеоперационная конфигурация: компонента скорости по потоку u, касательная к соответствующим осевым линиям \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4: Послеоперационная конфигурация: компонента скорости по потоку u, касательная к соответствующим осевым линиям сосудов, и вид клапана сверху в течение одного сердечного цикла (t = (0,55, 0,90) с). Хирургическое вмешательство на трункусе восстановило ожидаемую гемодинамику, такую как прямая аортальная струя, нормальное давление ниже клапана и существенно сниженная регургитация клапана.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Анализ кривых давления и потока (Рис. 5A) показал, что до операции вклад ПЖ в ударный объем был на 25% выше, чем ЛЖ, при пиковых скоростях 16,25 мл/с (ЛЖ) и 26,67 мл/с (ПЖ). Суммарный ударный объем за вычетом регургитации составил 4,87 мл, а пиковый поток за клапаном — 42,76 мл/с. Предоперационное &lt;a href=\"concepts/chislo-reynoldsa.html\"&gt;число Рейнольдса&lt;/a&gt; в области клапана составляло 1721, после операции оно снизилось до 618, при этом пиковый поток в систолу составил 31,14 мл/с.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus-f5.jpg\" alt=\"Рисунок 5: (A) Пре- и послеоперационные формы волн давления и потока, усредненные по пространству на срезе у входов (лев\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5: (A) Пре- и послеоперационные формы волн давления и потока, усредненные по пространству на срезе у входов (левый желудочек, правый желудочек) и выходов (аорта, левая и правая легочные артерии).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 5: (A) Пре- и послеоперационные формы волн давления и потока, усредненные по пространству на срезе у входов (левый желудочек, правый желудочек) и выходов (аорта, левая и правая легочные артерии). Зеленая кривая («Клапан») описывает усредненный по пространству поток и давление непосредственно дистальнее клапана, которые вычисляются на срезе, расположенном на 0,12 см выше уровня комиссуры клапана (ниже начала легочной артерии для предоперационной конфигурации). Поскольку легочные артерии действовали как сток давления, уровни давления непосредственно ниже клапана ниже в предоперационной конфигурации по сравнению с послеоперационной. (B) Кинематика створок в течение одного сердечного цикла для пре- и послеоперационных конфигураций. Взаимодействие между неоднородным полем потока ниже по потоку, создаваемым односторонним расположением легочных артерий, и трункальным клапаном привело к асимметричному закрытию клапана. Створки открывались и закрывались парами, при этом створки, расположенные выше по потоку от легочных артерий, открывались шире и закрывались позже. Восстановление здоровой гемодинамики путем коррекции трункуса привело к более симметричному закрытию клапана.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Число Рейнольдса — безразмерная величина, характеризующая отношение инерционных сил к вязким; высокие значения указывают на турбулентность, низкие — на ламинарный (упорядоченный) поток.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Разница давлений между системным и легочным кровотоком создавала соотношение потоков 3,2:1. Предоперационное давление в стволе было аномально низким, находясь между аортальным и легочным уровнями. Асимметрия ЛА приводила к неравномерному закрытию створок (Рис. 5B). Максимальное смещение в систолу составило: левая — 3,6 мм, передняя — 3,7 мм, задняя — 3,0 мм, правая — 2,7 мм. Высота коаптации (площади соприкосновения створок) составляла 20,0% от геометрической высоты. После коррекции закрытие стало симметричнее (правая — 3,3 мм, задняя — 4,3 мм, левая — 4,3 мм, передняя — 3,6 мм), а высота коаптации увеличилась до 30,8%.&lt;/p&gt;\n&lt;h4 id=\"razvitie-i-raspad-vihrej\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#razvitie-i-raspad-vihrej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Развитие и распад вихрей&lt;/span&gt;&lt;/a&gt;Развитие и распад вихрей&lt;/h4&gt;\n&lt;p&gt;Во время систолического ускорения при открытии клапана формируется начальный вихрь, форма которого определяется геометрией створок и условиями гемодинамики. У пациента с четырехстворчатым клапаном формируется четырехлепестковый вихрь, однако на его структуру сильно влияет анатомия сосудов. В предоперационной конфигурации продольные вихри в легочных артериях (ЛА) сохранялись на протяжении всего сердечного цикла, сливаясь с начальным вихрем при открытии клапана (Рис. 6A).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus-f6.jpg\" alt=\"Рисунок 6: (A) Изоповерхности Q-критерия, окрашенные в соответствии с компонентой скорости, нормальной к плоскости кольц\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 6: (A) Изоповерхности Q-критерия, окрашенные в соответствии с компонентой скорости, нормальной к плоскости кольца клапана, для стартового вихря после открытия клапана, пиковой систолы и середины диастолы в пре- и послеоперационной конфигурации.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 6: (A) Изоповерхности Q-критерия, окрашенные в соответствии с компонентой скорости, нормальной к плоскости кольца клапана, для стартового вихря после открытия клапана, пиковой систолы и середины диастолы в пре- и послеоперационной конфигурации. Морфология четырехстворчатого клапана создала четырехлопастной стартовый вихрь. До операции на трункусе вихри, направленные по потоку в легочных артериях, влияли на поле потока и динамику вихрей в трункусе, сохраняясь в течение всего сердечного цикла. (B) Лагранжевы когерентные структуры (LCS): скалярные поля прямого конечно-временного показателя Ляпунова (FTLE) для пре- и послеоперационной конфигурации. Моменты времени и масштабирование выбраны на основе соответствующих характеристик потока. Отчетливая материальная поверхность с пренебрежимо малым перемешиванием была обнаружена вдоль дефекта межжелудочковой перегородки (ДМЖП). LCS выявили влияние легочных артерий на уровне клапана во время систолы. Во время диастолы поток из внешней кривизны аорты входил в легочные артерии. После операции на трункусе систолическая гемодинамика была восстановлена с аортальной струей квадратной формы благодаря четырехстворчатому клапану и пренебрежимо малому потоку во время диастолы. (C) Лагранжево отслеживание частиц: распределение «оксигенированных» (красных) и «дезоксигенированных» (синих) частиц, засеянных в левом и правом желудочках соответственно, под разными углами обзора и в разные моменты времени сердечного цикла. Частицы засеваются непосредственно перед открытием клапана и отслеживаются в течение одного сердечного цикла. Лагранжево отслеживание частиц выявило благоприятное разделение оксигенированного и дезоксигенированного потоков с направлением потока из правого желудочка в легочные артерии и из левого желудочка в аорту.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В предоперационном состоянии вихри в ЛА менее стабильны и быстрее распадаются, чем после операции, а в диастолу наблюдается регургитация в правый желудочек.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В предоперационном состоянии вихрь был менее когерентным и быстрее разрушался. В систолу вдоль внутренней кривизны ствола наблюдались мелкомасштабные вихри, а в диастолу — регургитационный поток в правый желудочек. После удаления ЛА (постоперационная конфигурация) три стороны вихря оставались параллельны отверстию клапана, а четвертая отклонялась вдоль внутренней кривизны аорты, образуя вытянутый шпилечный вихрь. В диастолу в аорте когерентных структур не обнаружено, что указывает на полное рассеивание турбулентности.&lt;/p&gt;\n&lt;h4 id=\"lagranzhevy-kogerentnye-struktury\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#lagranzhevy-kogerentnye-struktury\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Лагранжевы когерентные структуры&lt;/span&gt;&lt;/a&gt;Лагранжевы когерентные структуры&lt;/h4&gt;\n&lt;p&gt;Лагранжевы когерентные структуры (LCS) в предоперационном состоянии выявили четкую материальную поверхность вдоль дефекта межжелудочковой перегородки (ДМЖП) и влияние ЛА на уровне клапана в систолу.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Лагранжевы когерентные структуры (LCS) и FTLE-поля — это математические методы визуализации «скелета» потока, которые показывают границы, разделяющие области с разным поведением жидкости (транспортные барьеры).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Материальная поверхность, определяемая локальными максимумами поля FTLE, служит барьером для переноса массы. В предоперационной конфигурации такая поверхность проходила через ДМЖП и клапан ствола. Визуализация FTLE показала, что эта поверхность отделяет поток в аорту от потока в ЛА. Влияние ЛА распространялось на клапан, где наблюдались две петлеобразные поверхности. Поток через клапан разделялся на порцию из правого желудочка в ЛА и ствол в аорту. В постоперационной конфигурации, из-за отсутствия ЛА, FTLE-поля демонстрируют отклонение аортального потока и формирование зон рециркуляции в области реконструкции.&lt;/p&gt;\n&lt;h4 id=\"strujnye-patterny-oksigenirovannoj-i-dezoksigenirovannoj-krovi\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#strujnye-patterny-oksigenirovannoj-i-dezoksigenirovannoj-krovi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Струйные паттерны оксигенированной и дезоксигенированной крови&lt;/span&gt;&lt;/a&gt;Струйные паттерны оксигенированной и дезоксигенированной крови&lt;/h4&gt;\n&lt;p&gt;Лагранжево отслеживание частиц показало, что кровь из левого и правого желудочков движется к клапану по спирали (Рис. 6C). Поверхность раздела между потоками сохраняется до входа в аорту, что подтверждает гипотезу о минимальном смешивании крови на уровне ДМЖП в систолу. В большую часть систолы дезоксигенированная кровь из правого желудочка направляется в ЛА, а оксигенированная из левого — в аорту.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Разделение потоков крови из желудочков объясняет высокую сатурацию (93% при 21% FiO2) у пациента, что подтверждает гипотезу о благоприятном смешивании при общем артериальном стволе.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;При замедлении потока в конце систолы обратный ток из аорты вызывает перемешивание на уровне ЛА. В диастолу четких границ потоков нет. Эти данные объясняют клинически зафиксированную высокую сатурацию (93% при 21% FiO2) у пациента с общим артериальным стволом, что доказывает возможность эффективного разделения потоков крови даже при наличии анатомического дефекта.&lt;/p&gt;\n&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;p&gt;Данное исследование стало первой работой, посвященной гидродинамике при артериальном трункусе (АТ). Мы установили, что аномалии потока напрямую зависят от расположения легочных артерий (ЛА), которые действуют как «резервуар низкого давления», создавая асимметричное взаимодействие между током крови и клапаном трункуса. Отключение ЛА в ходе хирургической коррекции восстанавливает нормальную гидродинамику и значительно снижает регургитацию клапана. Впервые для пациентов с АТ были выявлены индикаторы благоприятного распределения потоков, коррелирующие с клиническими данными.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Асимметричное расположение ЛА создает градиент давления, вызывающий асимметрию потока и неполное смыкание створок клапана, что ведет к регургитации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Основной причиной асимметрии является гетерогенность давления: более низкое давление в легочном круге по сравнению с системным, а также меньшее легочное сосудистое сопротивление, способствуют высокому соотношению легочного и системного кровотока. ЛА работают как стоки давления. Входящий поток через клапан трункуса обладает завихренностью, что приводит к формированию когерентных вихрей, подобных сливным воронкам. Эти вихри создают неоднородное поле давления, из-за чего створки, расположенные ближе к ЛА, открываются шире во время систолы, а их закрытие в начале диастолы происходит с задержкой. Это приводит к асимметричному смыканию и неадекватной коаптации створок. Реконструкция сосуда с формированием синусов и синотубулярного соединения способствует более равномерному раскрытию створок.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/koaptatsiya.html\"&gt;Коаптация&lt;/a&gt; — это процесс смыкания створок клапана, обеспечивающий герметичность и предотвращающий обратный ток крови (регургитацию).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Хотя АТ классифицируется как порок с полным смешиванием крови, мы обнаружили признаки благоприятного разделения (стриминга) оксигенированной крови из ЛЖ в аорту и дезоксигенированной из ПЖ в ЛА. Поля конечно-временного показателя Ляпунова (FTLE) показали четкую границу между потоками. Метод лагранжевых частиц подтвердил пренебрежимо малое смешивание до выхода из клапана. Эти данные объясняют, почему у пациента наблюдалась высокая системная сатурация кислорода, несмотря на диагноз АТ.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на численных моделях и качественном анализе потоков, поэтому требует дальнейшей количественной верификации через моделирование адвекции-диффузии.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;p&gt;Для моделирования мы использовали подход FSI (взаимодействие жидкости и структуры) на основе данных эхокардиографии. Из-за ограниченного разрешения изображений и отсутствия данных о свойствах тканей новорожденных, мы применили валидированный метод построения четырехстворчатого клапана. Временной профиль притока крови моделировался через активацию камер сердца. Для оценки стриминга в ЛЖ и ПЖ вводились виртуальные частицы, представляющие оксигенированную и дезоксигенированную кровь соответственно. В будущем планируется параметризация расположения ЛА для моделирования различных типов АТ и уточнение концентрации кислорода с помощью уравнений переноса.&lt;/p&gt;\n&lt;h3 id=\"metody1\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#metody1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"modelirovanie-gidrodinamiki-i-struktury-klapana\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#modelirovanie-gidrodinamiki-i-struktury-klapana\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Моделирование гидродинамики и структуры клапана&lt;/span&gt;&lt;/a&gt;Моделирование гидродинамики и структуры клапана&lt;/h4&gt;\n&lt;p&gt;Взаимодействие створок клапана и стенок сосудов с потоком крови моделировалось с помощью метода погруженных границ (Immersed Boundary Method) в программной библиотеке IBAMR. Жидкость рассматривалась как несжимаемая с плотностью &lt;span class=\"yfm-latex\" data-content=\"%5Crho%20%3D%201.0\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; г/см³ и динамической вязкостью µ = 0.04 Пуаз, описываемая уравнениями Навье-Стокса с учетом структурного силового воздействия на поток. Всего симулировалось три сердечных цикла, для анализа использовался второй.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод погруженных границ (Immersed Boundary Method) — это вычислительный подход, позволяющий моделировать взаимодействие гибких структур (например, створок клапана) с вязкой жидкостью, где границы объекта «погружаются» в сетку потока.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"klinicheskie-dannye-i-geometriya\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#klinicheskie-dannye-i-geometriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Клинические данные и геометрия&lt;/span&gt;&lt;/a&gt;Клинические данные и геометрия&lt;/h4&gt;\n&lt;p&gt;Пациент-новорожденный был отобран на основе наличия предоперационных и послеоперационных данных визуализации при отсутствии хирургических вмешательств на самом стволовом клапане. У пациента диагностирован четырехстворчатый клапан (тип А) и артериальный ствол (тип II). Сегментация КТ-снимков проводилась в программе SimVascular для создания 3D-геометрии сосудов (Рис. 2A).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus-f2.jpg\" alt=\"Рис. 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 2&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"konstruirovanie-klapana-i-granichnye-usloviya\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#konstruirovanie-klapana-i-granichnye-usloviya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конструирование клапана и граничные условия&lt;/span&gt;&lt;/a&gt;Конструирование клапана и граничные условия&lt;/h4&gt;\n&lt;p&gt;Четырехстворчатый клапан моделировался на основе подхода, учитывающего эластичность. Гетерогенная структура волокон створок и жесткость материала определялись через параметры равновесия створок при заданном давлении (Рис. 2B). Индивидуальные параметры пациента — длина свободного края (FEL) и геометрическая высота (GH) — измерялись по эхокардиограмме. Для предоперационной конфигурации FEL составила 7.56 мм при GH 6.5 мм, для послеоперационной — FEL 8.95 мм при GH 6.5 мм (Рис. 2C). Граничные условия настраивались путем итераций между 3D-симуляциями взаимодействия жидкости и структуры (FSI) и 0D-моделью в решателе svZeroDSolver (Рис. 2C).&lt;/p&gt;\n&lt;h4 id=\"analiz-potoka-i-kinematiki\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#analiz-potoka-i-kinematiki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ потока и кинематики&lt;/span&gt;&lt;/a&gt;Анализ потока и кинематики&lt;/h4&gt;\n&lt;p&gt;Для оценки поля скоростей вычислялась продольная компонента скорости u_s. Формы волн давления и потока извлекались на входах (ЛЖ, ПЖ) и выходах (аорта, ЛПА, РПА), а также в сечении на 0.12 см выше уровня комиссур. Кинематика створок оценивалась через трекинг центрального кончика створки и расчет его евклидова расстояния до точки коаптации в диастолу. Вихри анализировались через Q-критерий, а транспортные барьеры — через лагранжевы когерентные структуры (FTLE). Смешивание крови отслеживалось с помощью безинерционных частиц: частицы из ЛЖ (оксигенированные, красные) и ПЖ (деоксигенированные, синие) выпускались перед открытием клапана и отслеживались в течение второго цикла.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Непонятная&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;гидродинамика&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;порока&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Индивидуальное&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;FSI-&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;моделирование&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Выявлены вихри&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;и пути потоков&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Оптимизация&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;хирургического&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;лечения&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не прошёл рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия препринта&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;physiology&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Karoline-Marie Bornemann, Perry S. Choi, Jay A. Huber, Hannah L. McMullen, Alexander K. Reed, Amit Sharir, Shiraz A. Maskatia, Alison L. Marsden, Michael R. Ma, Alexander D. Kaiser&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-02/the-fluid-mechanics-of-truncus-arteriosus.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ссылка&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница препринта&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://arxiv.org/abs/2609.36470v1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arxiv.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Полный текст (PDF)&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://arxiv.org/pdf/2609.36470v1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arxiv.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;DOI&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://doi.org/10.48550/arxiv.2609.36470\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;doi.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Метаданные Crossref&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://api.crossref.org/works/10.48550/arxiv.2609.36470\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;api.crossref.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Europe PMC&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/search?query=DOI%3A%2210.48550/arxiv.2609.36470%22\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;europepmc.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt
