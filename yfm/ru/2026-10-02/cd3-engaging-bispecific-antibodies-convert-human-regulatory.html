vert-human-regulatory.html#analiz-supernatantov-metodom-ifa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ супернатантов методом ИФА&lt;/span&gt;&lt;/a&gt;Анализ супернатантов методом ИФА&lt;/h4&gt;\n&lt;p&gt;Для анализа секреторной активности Treg-клетки (1x10^6 кл/мл) культивировали с клетками MM.1S (2x10^5 кл/мл) в течение 72 часов. Условия обработки включали теклистамаб (100 нг/мл), OKT3 (52,3 нг/мл), блинатумомаб (37,7 нг/мл), леналидомид (1 мкМ) и их сочетания. Собранные супернатанты замораживали при -80°C. Концентрации гранзимов A и B, гранулизина, CCL5, IL35 и IL10 измеряли с помощью ИФА согласно протоколам производителей.&lt;/p&gt;\n&lt;h4 id=\"protochnaya-citometriya-vnutrikletochnyh-citokinov-posle-sovmestnogo-kultivirovaniya-treg\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#protochnaya-citometriya-vnutrikletochnyh-citokinov-posle-sovmestnogo-kultivirovaniya-treg\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Проточная цитометрия внутриклеточных цитокинов после совместного культивирования Treg&lt;/span&gt;&lt;/a&gt;Проточная цитометрия внутриклеточных цитокинов после совместного культивирования Treg&lt;/h4&gt;\n&lt;p&gt;Для оценки состояния регуляторных Т-клеток (Treg) здоровых доноров (фенотип CD4+ CD127low CD25+) после их инкубации с клетками миеломы MM.1S и воздействия теклистамаба (50 нг/мл), OKT3 (26,15 нг/мл), леналидомида (1 мкМ) или их комбинации, применялась спектральная проточная цитометрия. Через 66 часов культивирования в среду добавляли ингибитор транспорта белков BD GolgiPlug™ на 6 часов для накопления цитокинов в аппарате Гольджи. После окрашивания на жизнеспособность красителем Fixable Viability Dye eFluor™ 780 (15 мин при 4°C) проводили детекцию поверхностных маркеров (CD3, CD4, CD8, CD25, CD127) в течение 30 мин при 4°C. Клетки пермеабилизировали с помощью набора eBioscience™ Foxp3 / Transcription Factor Staining Buffer Set. Внутриклеточные цитокины (гранзимы A и B, гранулизин, CCL5, IFNγ) и фактор FoxP3 окрашивали в течение 30 мин при комнатной температуре в темноте. Анализ проводили на системе Cytek® Aurora с использованием бусин GFP BrightComp eBeads™ для спектрального разделения сигналов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Спектральная проточная цитометрия позволяет анализировать весь спектр флуоресценции каждого красителя, что значительно повышает точность разделения сигналов при использовании большого количества маркеров одновременно.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kolichestvennaya-pcr-qpcr\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#kolichestvennaya-pcr-qpcr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Количественная ПЦР (qPCR)&lt;/span&gt;&lt;/a&gt;Количественная ПЦР (qPCR)&lt;/h4&gt;\n&lt;p&gt;После 72 часов совместного культивирования Treg отделяли от опухолевых клеток MM.1S, промывали и выделяли РНК с помощью набора RNeasy Micro Kit. Синтез cDNA проводили с использованием High-Capacity cDNA Reverse Transcription Kit (общий объем реакции 20 мкл). Экспрессию генов анализировали на системе QuantStudio™ 3 с применением TaqMan™ Fast Advanced Master Mix. В исследование включили широкий спектр генов, отвечающих за передачу сигналов (MAP3K1, MAPK8/JNK1, MAPK14/p38, STAT1/3/5B, TNFAIP3, DUSP4/16), транскрипцию (NFATC1, BATF, JUN/B, FOS, IRF4, PRDM1/BLIMP1, TOX, FOXP3, IKZF2/Helios), эффекторные функции (GZMA/B, NKG7, PRF1, IFNG) и рецепторы (CCR8, IL2RA/CD25, CTLA4, TIGIT). Измерения проводили в трех биологических повторах и двух технических дубликатах, нормализуя данные по генам домашнего хозяйства (&lt;a href=\"concepts/18s-rrna.html\"&gt;18S rRNA&lt;/a&gt;, GAPDH, HPRT1, GUSB) методом ΔΔ Ct.&lt;/p&gt;\n&lt;h4 id=\"sekvenirovanie-rnk-bulk-rna-seq\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#sekvenirovanie-rnk-bulk-rna-seq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Секвенирование РНК (Bulk RNA-seq)&lt;/span&gt;&lt;/a&gt;Секвенирование РНК (Bulk RNA-seq)&lt;/h4&gt;\n&lt;p&gt;РНК из первичных Treg выделяли набором RNeasy Micro Kit, после чего готовили библиотеки с помощью SMARTer Ultra Low RNA Kit. Секвенирование проводили на платформе NovaSeq X 10B (парные прочтения 100 п.н.). Первичную обработку данных (выравнивание, контроль качества, квантификация) выполняли через рабочий процесс RNAseqWorkflow (DKFZ-ODCF). Прочтения выравнивали на референсный геном (GENCODE) с помощью STAR. Подсчет экспрессии генов осуществляли через featureCounts, исключая из анализа хромосомы X, Y, митохондриальный геном, а также гены рРНК и тРНК. Дифференциальную экспрессию анализировали в пакете DESeq2 (v1.48.2) с учетом вариативности между донорами (дизайн-формула ~ donor + treatment). После удаления генов с низким уровнем экспрессии (менее 10 прочтений в 5 и более образцах) применяли нормализацию DESeq() и оценивали статистически значимые изменения с помощью контрастов.&lt;/p&gt;\n&lt;h4 id=\"profilirovanie-metabolizma-treg-kletok\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#profilirovanie-metabolizma-treg-kletok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Профилирование метаболизма Treg-клеток&lt;/span&gt;&lt;/a&gt;Профилирование метаболизма Treg-клеток&lt;/h4&gt;\n&lt;p&gt;Изолированные регуляторные Т-клетки (Tregs) фенотипа CD4⁺CD127^lowCD25⁺ или общие популяции Т-клеток культивировали совместно с клетками миеломы MM1.S в течение 72 часов. В среду добавляли теклистамаб в концентрации 100 нг/мл. По завершении инкубации из смеси удаляли клетки миеломы MM1.S, экспрессирующие CD138, используя магнитные микрогранулы CD138 MicroBeads. Оставшиеся Т-клетки подвергали метаболическому анализу с помощью системы Seahorse XFe96 Analyzer, применяя протокол XF T Cell Persistence Assay.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метаболическое профилирование на Seahorse XFe96 позволяет в реальном времени измерять скорость поглощения кислорода (OCR) и внеклеточного подкисления (ECAR), что дает представление об интенсивности окислительного фосфорилирования и гликолиза в клетках.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kolichestvennaya-ocenka-i-statisticheskij-analiz\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#kolichestvennaya-ocenka-i-statisticheskij-analiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Количественная оценка и статистический анализ&lt;/span&gt;&lt;/a&gt;Количественная оценка и статистический анализ&lt;/h4&gt;\n&lt;p&gt;Данные представлены в виде индивидуальных значений или средних величин со стандартной ошибкой среднего (SEM). Размер выборок (n) и конкретные статистические тесты указаны в описаниях к рисункам. Все значения p являются двусторонними. Статистическая значимость и поправки на множественные сравнения проводились согласно протоколам, описанным в легендах к рисункам. Для расчетов использовали программное обеспечение R (версия 4.3.2) или GraphPad Prism 10.0. Образцы костного мозга в функциональных экспериментах были закодированы для ослепления исследователей. Индексы разнообразия, включая индекс Шеннона, рассчитывались с помощью пакета vegan или функции Gini. Размер выборки определялся доступным количеством материала. Все клетки, прошедшие контроль качества (Рис. SN), были включены в анализ на уровне отдельных клеток.&lt;/p&gt;\n&lt;h4 id=\"vizualizaciya-dannyh\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#vizualizaciya-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Визуализация данных&lt;/span&gt;&lt;/a&gt;Визуализация данных&lt;/h4&gt;\n&lt;p&gt;Табличные данные, полученные в результате секвенирования единичных клеток, обрабатывались с помощью пакета tidyverse. Визуализация проводилась в среде R с использованием пакета ggplot2 или в среде Python с использованием библиотеки matplotlib. Остальные типы данных визуализировались в GraphPad Prism 10.0. Финальная сборка рисунков выполнена в Adobe Illustrator 2024.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Роль&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;регуляторных&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Т-клеток при&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;терапии BTCE&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Анализ РНК,&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ATAC и TCR&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;секвенирования&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Tregs&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;приобретают ци&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тотоксические&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;функции&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Новый механизм&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;усиления&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;иммунотерапии&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не прошёл рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия препринта&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;medRxiv&lt;/td&gt;\n&lt;td&gt;oncology&lt;/td&gt;\n&lt;td&gt;все права у авторов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Michel, J. J.; Frenking, J. H.; Metzler, A.; Schach, A.; Meermeier, E.; Thiel, V.; Kehl, N.; Zoller, J.; Cuntz, S.; Funk, C.; Onken, R.; Kirschner, A.; Huhn, S.; Brobeil, A.; Trumpp, A.; Rahbari, M.; Heikenwaelder, M.; Mueller-Tidow, C.; Bergsagel, L.; Goldschmidt, H.; Einsele, H.; Rasche, L.; Chesi, M.; Raab, M.; Weinhold, N.; Friedrich, M. J.&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-02/cd3-engaging-bispecific-antibodies-convert-human-regulatory.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ссылка&lt;/strong&gt;&lt;/th&gt;\
