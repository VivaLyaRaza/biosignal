            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"92\" cy=\"73\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"528\" cy=\"270\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · ONCOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Qalqonsimon bez saratonini&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;aniqlashda qon tahlili:&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;yangi usul&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/a-serum-thyroid-hormone-metabolite-test-for-molecular-diagno-fS1.jpg\" alt=\"Rasm S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Qalqonsimon bezdagi tugunlarni aniqlashda shifokorlar ko'pincha xavfli o'smalarni ajratib olishda qiynalishadi. Yangi tadqiqot qon zardobidagi gormon metabolitlarini o'rganish orqali saratonni aniqlash imkonini beradi. Bu usul biopsiya kabi invaziv muolajalarga bo'lgan ehtiyojni kamaytirishi mumkin. Natijalar diagnostika aniqligini sezilarli darajada oshiradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-01/a-serum-thyroid-hormone-metabolite-test-for-molecular-diagno.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Gormon metabolitlari testi saratonni 94,9% aniqlik bilan aniqlaydi.&lt;/li&gt;\n&lt;li&gt;Bethesda III-IV toifasidagi noaniq tugunlar uchun yuqori diagnostik ahamiyatga ega.&lt;/li&gt;\n&lt;li&gt;Ijobiy natijaning 99,8% aniqligi saratonni tasdiqlashda muhim dalil bo'ladi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-01/a-serum-thyroid-hormone-metabolite-test-for-molecular-diagno.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Differensial qalqonsimon bez saratoni (DQBS) barcha xavfli o'smalarning 95% dan ortig'ini tashkil qiladi. Hozirgi kunda ACR TI-RADS tizimi bo'yicha ultratovush tekshiruvi va Bethesda tizimi bo'yicha ingichka ignali aspiratsion biopsiya (IIAB) asosiy diagnostika usullari hisoblanadi. Biroq, III-IV toifadagi noaniq sitologik natijalar klinik amaliyotda katta qiyinchilik tug'diradi.&lt;/p&gt;\n&lt;p&gt;Tadqiqotchilar DQBS o'smalarida DIO3 va ODC fermentlari faolligi oshishini aniqlashdi, bu esa gormon metabolitlari (T0, 3-T1AM, 3-T1) darajasining o'zgarishiga olib keladi. Suyuqlik xromatografiyasi-tandem mass-spektrometriyasi (SX-TMS) yordamida 1663 nafar bemor tekshirildi. Model 94,9% aniqlik bilan saratonni ajratib ko'rsatdi va ijobiy natijaning bashorat qilish qiymati (PPV) 99,8% ni tashkil etdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kohort asosida o'tkazilgan bo'lib, keng ko'lamli klinik tekshiruvlar va boshqa qalqonsimon bez kasalliklari ta'sirini o'rganishni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-01/a-serum-thyroid-hormone-metabolite-test-for-molecular-diagno.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Ushbu kohort tadqiqoti 2020-yildan 2025-yilgacha beshta uchinchi darajali tibbiyot markazlarida to‘plangan qalqonsimon bez tugunlari bo‘lgan 1663 nafar subyektni (1196 ayol, 467 erkak; median yoshi 48, IQR 37–57) qamrab oldi. Sitologik/gistopatologik tashxislar mustaqil ko‘rib chiqish qo‘mitasi tomonidan belgilandi va operatsiyadan oldingi zardobdagi qalqonsimon bez gormoni metabolitlari (THM) suyuqlik xromatografiyasi-tandem mass-spektrometriyasi yordamida tekshirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Suyuqlik xromatografiyasi-tandem mass-spektrometriyasi — bu murakkab biologik namunalardagi moddalarni, masalan, gormonlarni yuqori aniqlik bilan ajratish va aniqlash imkonini beruvchi tahliliy usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Differensial qalqonsimon bez saratoni (DTC) va xavfsiz qalqonsimon bez tugunini (BTN) farqlash uchun ushbu zardobdagi THM testi bo‘yicha diagnostik model 872 retrospektiv subyekt (454 DTC va 418 BTN) ma’lumotlari asosida o‘qitildi, so‘ngra subyektlar (195 DTC va 197 BTN) ustida prospektiv model validatsiyasi va 399 subyekt (300 DTC va 99 BTN) ustida ikkinchi validatsiya o‘tkazildi.&lt;/p&gt;\n&lt;p&gt;Diagnostik model muvaffaqiyatli o‘qitilgandan so‘ng, model validatsiyasi DTC uchun 99,5% (196/197) diagnostik spesifiklik, 92,3% (180/195) sezgirlik, 99,4% ijobiy bashorat qiymati (PPV), 92,9% salbiy bashorat qiymati (NPV) va 95,9% (95% CI, 90,8 dan 100,0% gacha) diagnostik aniqlikni ko‘rsatdi. Ikkita validatsiya kohortasining kombinatsiyasi DTC uchun 99,7% (295/296) diagnostik spesifiklik, 92,1% (456/495) sezgirlik, 99,8% PPV, 88,3% NPV va 94,9% (95% CI, 91,5 dan 98,0% gacha) diagnostik aniqlikni ko‘rsatdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Model DTCni aniqlashda, ayniqsa Bethesda III-IV noaniq toifalarida yuqori diagnostik aniqlik (96,0% gacha) va spesifiklikni (100% gacha) namoyon etdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bethesda III-IV noaniq toifalari (139 DTC, 87 BTN) bo‘yicha o‘tkazilgan test DTC uchun 100,0% (87/87) diagnostik spesifiklik, 93,5% (130/139) sezgirlik, 100,0% PPV, 90,6% NPV va 96,0% (95% CI, 89,2 dan 100,0% gacha) diagnostik aniqlikni ko‘rsatdi. Ushbu tadqiqot qalqonsimon bez tugunlarini operatsiyadan oldin diagnostik baholash uchun zardobdagi THMlar bo‘yicha yangi molekulyar qon testini ishlab chiqadi, u DTC uchun yuqori PPV va munosib NPV hamda a’lo darajadagi umumiy diagnostik aniqlikni namoyish etadi.&lt;/p&gt;\n&lt;p&gt;ChiCTR2300070912. Hurmatli muharrir, qalqonsimon bez raki keng tarqalgan endokrin xavfli o‘sma hisoblanadi. Eng keng tarqalgan gistopatologik turi — qalqonsimon bez papillyar raki (PTC), undan keyin qalqonsimon bez follikulyar raki (FTC) va qalqonsimon bez onkotsitar raki (OCC) turadi. Ushbu saraton turlari birgalikda differensiyalangan qalqonsimon bez raki (DTC) deb tasniflanadi va barcha qalqonsimon bez xavfli o‘smalarining &amp;gt;95% qismini tashkil qiladi. DTC tashxisi odatda umumiy aholining ~60%–70% qismida uchraydigan qalqonsimon bez tugunlarini baholashdan boshlanadi; bu tugunlarning 5%–10% qismi DTC hisoblanadi, qolganlari esa qalqonsimon bezning xavfsiz tugunlari (BTN) hisoblanadi. Qalqonsimon bez tugunlarini diagnostik baholashning asosiy maqsadi xavfli tugunlarni xavfsizlaridan ajratishdir. Qalqonsimon bez tugunlari uchun hozirgi diagnostika asoslari ultratovush tekshiruvi va ingichka ignali aspiratsion biopsiya (FNAB) hisoblanadi. Ultratovush tekshiruvi uchun ACR TI-RADS (American College of Radiology Thyroid Imaging Reporting and Data System) xavf darajasini baholash uchun keng qo‘llaniladi. U 1 dan 5 gacha bo‘lgan beshta ortib boruvchi toifani o‘z ichiga oladi, bunda 1–2 toifalar xavfsiz/shubhali bo‘lmagan tugunlarni, 5-toifa esa xavfli bo‘lishi mumkin bo‘lgan yuqori shubhali tugunlarni bildiradi. FNAB uchun Bethesda tizimi (TBSRTC) keng qo‘llaniladi; u oltita diagnostik toifani o‘z ichiga oladi, ularning har biri taxminiy xavf darajasi bilan bog‘liq, bunda I toifa diagnostik bo‘lmagan, II — xavfsiz, III — aniqlanmagan ahamiyatga ega atipiya, IV — follikulyar neoplaziya, V — xavfli bo‘lishi mumkin bo‘lgan shubhali va VI — xavfli hisoblanadi. Biroq, ushbu diagnostika usullari cheklangan aniqlikka ega, ayniqsa Bethesda III–IV toifalari uchun, ular 25%–30% hollarda uchraydigan sitologik jihatdan noaniq qalqonsimon bez tugunlarini qamrab oladi va hozirgi qalqonsimon bez tugunlarini boshqarishda katta diagnostik qiyinchilik tug‘diradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Differensiyalangan qalqonsimon bez raki (DTC) barcha holatlarning &amp;gt;95% qismini tashkil etsa-da, Bethesda III–IV toifasidagi tugunlarni tashxislash mavjud usullarning past aniqligi tufayli murakkabligicha qolmoqda.&lt;br /&gt;\n[!tip] FNAB — bu sitologik tahlil uchun ingichka igna yordamida to‘qima namunasini olish jarayoni; Bethesda tizimi ushbu natijalarni talqin qilishni standartlashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Qalqonsimon bez kasalliklarini tashxislash uchun turli molekulyar testlar o‘rganilgan, ulardan eng ko‘p qo‘llaniladiganlari FNAB namunalari ustida bajariladigan RNK yoki DNK asosidagi testlardir. Ushbu testlar qalqonsimon bez tugunlarining diagnostik aniqligini oshirdi, ayniqsa ularning yuqori sezuvchanligi va xavfli o‘smalarga nisbatan salbiy bashorat qiymatlari (NPV) tufayli «istisno qiluvchi» (rule-out) testlar sifatida. Biroq, ular umumiy cheklovlarga ega, eng ko‘zga tashlanadiganlari past o‘ziga xoslik va ijobiy bashorat qiymatlari (PPV) hisoblanadi, shuning uchun ular xavfli o‘smalarni «tasdiqlovchi» (rule-in) past quvvatga ega. Bundan tashqari, ularning barchasi namunalar olish uchun invaziv FNABni talab qiladi. Ideal holda, invaziv bo‘lmagan molekulyar test yuqori o‘ziga xoslik va munosib sezuvchanlikka ega bo‘lishi kerak, shu bilan umumiy diagnostik aniqlikni ta’minlaydi.&lt;/p&gt;\n&lt;p&gt;Qon zardobidagi qalqonsimon bez gormoni metabolitlarini aniqlash ushbu ehtiyojni qondirishi mumkin. Qalqonsimon bez gormonlari, shu jumladan tiroksin (T4), 3,5,5′-triyodtironin (T3) va 3,3′,5′-triyodtironin (rT3) qalqonsimon bez funksiyasining klassik zardob biomarkerlari hisoblanadi, ammo qalqonsimon bez raki uchun diagnostik qiymatga ega emas. Qalqonsimon bez gormonlarining yaxshi tavsiflangan bir nechta metabolitlari (THM), ayniqsa zardobda aniqlanadiganlari, quyidagilarni o‘z ichiga oladi: 3,5-diyod-L-tironin (3,5-T2); 3′,5′-diyod-L-tironin (3′,5′-T2); 3,3′-diyod-L-tironin (3,3′-T2); 3′-yod-L-tironin (3′-T1); 3-yod-L-tironin (3-T1); L-tironin (T0) va 3-yodtironamin (3-T1AM), ular qalqonsimon bez gormonlarining metabolik yo‘llari orqali hosil bo‘ladi. Ushbu THMlar turli fermentlar, shu jumladan deyodinaza 3 (DIO3) va ornitindekarboksilaza (ODC) kabi selenofermentlar tomonidan katalizlanadigan reaksiyalar orqali ishlab chiqariladi (SN-rasm 1). Qizig‘i shundaki, qalqonsimon bez gormonlarini metabolizatsiya qiluvchi fermentlarning, masalan, DIO3 ning ifodalanishi normal to‘qimalarga nisbatan onkogen signal yo‘llari tomonidan rag‘batlantiriladigan DTC o‘smalarida kuchli darajada oshgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;THM — bu qalqonsimon bez gormonlarining parchalanish mahsulotlari bo‘lib, ularning qondagi darajasi o‘sma jarayonining invaziv bo‘lmagan belgisi bo‘lishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Qalqonsimon bez gormonlari singari, THMlar ham qonga chiqariladi, garchi past konsentratsiyalarda, odatda pg/ml diapazonida bo‘lsa ham. DTC o‘smalarida mo‘l-ko‘l ifodalangan qalqonsimon bez gormonlarini metabolizatsiya qiluvchi fermentlar — ayniqsa deyodinazalar — qalqonsimon bez gormoni substratlari bilan boyitilgan mahalliy qalqonsimon bez muhitida mavjud. Bu THM ishlab chiqarishni faol va kuchli tarzda rag‘batlantiradigan noyob sharoitni yaratadi, ehtimol hatto nisbatan kichik DTC o‘smalarida ham. Binobarin, DTC o‘smasining mavjudligi ushbu faol ishlab chiqarish manbasidan qonga katta miqdorda THMlar doimiy ravishda chiqarilishiga olib kelishi mumkin, bu esa aks holda past bo‘lib qoladigan zardobdagi THM konsentratsiyasini sezilarli darajada o‘zgartiradi. Bu qonga asoslangan THM aniqlashni DTCni BTNdan farqlash uchun sezgir diagnostik testga aylantirishi mumkin. Biz ushbu gipotezani ushbu ikki tomonlama ko‘r klinik tadqiqotda suyuqlik xromatografiyasi-tandem mass-spektrometriyasi (LC-MS/MS) yordamida sinab ko‘rdik, bu zardobdagi THMlarni o‘lchash uchun keng qo‘llaniladigan sezgir va barqaror usul (SN-rasm 13), maqsadi qalqonsimon bez tugunlarini operatsiyadan oldingi diagnostik baholash uchun yangi molekulyar qon testini yaratish edi.&lt;/p&gt;\n&lt;p&gt;Uchta diagnostik jihatdan informativ zardob THMlari — T0, 3-T1AM va 3-T1ni o‘z ichiga olgan logistik regressiya modeli (LRM) qurildi va 872 ta namunadan iborat retrospektiv ma’lumotlar to‘plami yordamida o‘qitildi, 392 ta namunadan iborat istiqbolli ma’lumotlar to‘plami yordamida tasdiqlandi va DTC diagnostikasi uchun 399 ta namunadan iborat ikkinchi istiqbolli ma’lumotlar to‘plami yordamida qo‘shimcha tasdiqlandi (1a, b-rasm; SN-rasm 2). Bemorlarning boshlang‘ich xususiyatlari, sinov usullari va boshqa ma’lumotlar SN-jadvallar 1–14 va 19da keltirilgan. Modelni o‘qitish DTC uchun 87,1% (364/418) diagnostik o‘ziga xoslik, 93,0% (422/454) sezuvchanlik, 88,7% PPV, 91,9% NPV va 90,1% (95% CI, 87,0%–92,9%) diagnostik aniqlikni berdi. Modelni tasdiqlash DTC uchun 99,5% (196/197) diagnostik o‘ziga xoslik, 92,3% (180/195) sezuvchanlik, 99,4% PPV, 92,9% NPV va 95,9% (95% CI, 90,8%–100%) diagnostik aniqlikni ko‘rsatdi. Ikkinchi tasdiqlash DTC uchun 100% (99/99) diagnostik o‘ziga xoslik, 92,0% (276/300) sezuvchanlik, 100% PPV, 80,5% NPV va 94,0% (95% CI, 89,5%–97,6%) diagnostik aniqlikni ko‘rsatdi.&lt;/p&gt;\n&lt;p&gt;Ikki tasdiqlash kohortasini birlashtirish DTC uchun 99,7% (295/296) diagnostik o‘ziga xoslik, 92,1% (456/495) sezuvchanlik, 99,8% PPV, 88,3% NPV va 94,9% (95% CI, 91,5%–98,0%) diagnostik aniqlikni berdi (SN-jadval 15).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Uchta metabolit (T0, 3-T1AM, 3-T1) asosida ishlab chiqilgan model mustaqil kohortalarda tekshirilganda yuqori diagnostik aniqlikni (94,9%) ko‘rsatdi, bu usulning DTCni invaziv bo‘lmagan usulda tashxislash uchun salohiyatini tasdiqlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz to‘liq ultratovush, sitologik va gistopatologik diagnostika ma’lumotlariga ega 698 nafar subyektning subguruh tahlilini o‘tkazdik (1-rasm c, d). Kutilganidek, gistopatologik jihatdan tasdiqlangan xavfli o‘smalar darajasi Bethesda II dan VI gacha izchil ravishda oshib bordi. Bethesda II tugunlari orasida THM testi salbiy bo‘lgan barcha holatlar (121/121; 100%) gistopatologik jihatdan xavfsiz (benign) bo‘lib chiqdi. Bethesda III va IV tugunlari uchun THM testi salbiy bo‘lgan holatlarning mos ravishda 91,5% (54/59) va 89,2% (33/37) qismi gistopatologik jihatdan xavfsiz deb topildi. Bethesda V va VI tugunlari orasida mos ravishda 22 va 11 ta holat gistopatologik jihatdan xavfsiz deb tasdiqlandi va ularning barchasi THM testida salbiy natija berdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;THM testi yuqori o‘ziga xoslik (100%) va ijobiy natijaning bashoratli qiymatini (PPV 100%) ko‘rsatib, barcha Bethesda toifalarida xavfli o‘smalarni samarali tasdiqladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Qo‘shimcha ma’lumotlar, SN-jadval (S16-jadval) THM testining alohida Bethesda toifalaridagi diagnostik samaradorligini umumlashtiradi. Barcha (100%) THM testi ijobiy bo‘lgan holatlar barcha Bethesda toifalarida gistopatologik jihatdan xavfli (malignant) bo‘lgan. Umuman olganda, THM testi 100% (98,4%–100%) diagnostik o‘ziga xoslik, 91,9% (89,0%–94,1%) sezgirlik, 100% (99,1%–100%) PPV, 86,7% (82,2%–90,2%) NPV va 94,7% (91,1%–97,8%) diagnostik aniqlikni ko‘rsatdi. Bethesda III va IV noaniq toifalaridagi 226 ta holat uchun THM testi 100% (95,8%–100%) diagnostik o‘ziga xoslik, 93,5% (88,2%–96,6%) sezgirlik, 100% (97,1%–100%) PPV, 90,6% (83,1%–95,0%) NPV va 96,0% (89,2%–100%) diagnostik aniqlikni ko‘rsatdi.&lt;/p&gt;\n&lt;p&gt;To‘liq ultratovush, sitologik va gistopatologik tashxislarga ega bo‘lgan ushbu 698 nafar subyektda, kutilganidek, ACR TI-RADS 2–5 toifalaridan boshlab gistopatologik jihatdan tasdiqlangan xavfli o‘smalar darajasining oshishi kuzatildi (1-rasm e).&lt;/p&gt;\n&lt;p&gt;ACR TI-RADS 2 toifasidagi qalqonsimon bez tugunlari uchun THM testi salbiy bo‘lgan barcha holatlar (6/6; 100%) gistopatologik jihatdan xavfsiz bo‘lgan. ACR TI-RADS 3 va 4 toifalari uchun THM testi salbiy bo‘lgan holatlarning mos ravishda 97,0% (130/134) va 80,9% (93/115) qismi gistopatologik jihatdan xavfsiz bo‘lgan. ACR TI-RADS 5 toifasidagi qalqonsimon bez tugunlari uchun 12 ta holat gistopatologik jihatdan xavfsiz bo‘lib, ularning barchasi THM testida salbiy natija bergan. THM testi ijobiy bo‘lgan holatlar orasida 100% barcha ACR TI-RADS toifalari bo‘yicha gistopatologik jihatdan xavfli bo‘lgan (SN-jadval).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PPV (ijobiy natijaning bashoratli qiymati) — test ijobiy bo‘lganda kasallikning haqiqatdan ham mavjud bo‘lish ehtimoli; NPV (salbiy natijaning bashoratli qiymati) — test salbiy bo‘lganda kasallikning yo‘qlik ehtimoli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ham DTC, ham HT bilan og‘rigan 189 nafar subyekt tekshirildi; THM testi HT ning test natijalariga ta’siri yo‘qligini ko‘rsatdi (SN-rasm a). 340 nafar HV subyektlarida THM testini o‘tkazish HV va DTC subyektlari o‘rtasida aniq farqni ko‘rsatdi (SN-rasm b). To‘qima mikromassiv immunogistokimyoviy bo‘yash DTCda DIO3 va ODC oqsillari ifodasining qo‘shni normal to‘qimalarga nisbatan sezilarli darajada oshganini ko‘rsatdi (DIO3 uchun P &amp;lt; 0,001 va ODC uchun P &amp;lt; 0,01).&lt;/p&gt;\n&lt;p&gt;DIO3 va ODC har ikkalasi ham BTN ga nisbatan DTCda sezilarli darajada oshgan (P = 0,005 va &amp;lt; 0,001, hamda ODC uchun P = 0,01) (SN-rasm). T0 va 3-T1AM konsentratsiyalari DTC va qo‘shni normal to‘qimalarda BTN va qo‘shni normal to‘qimalarga qaraganda sezilarli darajada yuqori bo‘lgan, holbuki 3-T1 kutilganidek, DTC va qo‘shni normal to‘qimalarda BTN va qo‘shni to‘qimalarga qaraganda mos ravishda pastroq bo‘lgan (SN-rasm va SN-jadval). T0 konsentratsiyasi DTC o‘sma hajmi bilan sezilarli darajada ijobiy korrelyatsiyaga ega bo‘lgan (SN-rasm) va 3-T1AM bilan ijobiy, 3-T1 bilan esa kutilganidek salbiy korrelyatsiyaga ega bo‘lgan (SN-rasm).&lt;/p&gt;\n&lt;p&gt;Uchta THM limfa tugunlari metastazlari bo‘lgan va bo‘lmagan DTC bemorlari o‘rtasida sezilarli darajada farq qilmadi (SN-rasm). Sinovdan o‘tgan DTC, BTN va HV guruhlari o‘rtasida siydikdagi yod miqdori (UIC) bo‘yicha sezilarli farq yo‘q edi (SN-rasm) va UIC qalqonsimon bezning o‘lchanadigan disfunksiyasini keltirib chiqarmasa, zardobdagi THM darajasini o‘zgartirmasligi mumkin (SN-rasm). Shuning uchun THM testi tabiiy eutiroid holatdagi va normal yod holatiga ega bemorlarda o‘tkazilganda eng ishonchli bo‘ladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot cheklangan guruhlarda o‘tkazildi; metabolitlar darajasining o‘sma hajmi bilan korrelyatsiyasi to‘g‘ridan-to‘g‘ri sabab-oqibat bog‘liqligini isbotlamaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu tadqiqot qalqonsimon bez tugunlari uchun THM ga asoslangan molekulyar testni ishlab chiqdi, u klinik sharoitlarda yuqori diagnostik o‘ziga xoslik va PPV, yetarlicha yuqori sezgirlik va NPV hamda ajoyib umumiy diagnostik aniqlikni izchil namoyish etadi. Ayniqsa, ushbu test Bethesda III-IV noaniq qalqonsimon bez tugunlarida yaxshi ishlaydi, bu THM aniqlashni DTC uchun ajoyib «tasdiqlovchi» (rule-in), ammo «istisno qiluvchi» (rule-out) test sifatida suboptimalligini ko‘rsatadi.&lt;/p&gt;\n&lt;p&gt;Invaziv FNAB ga asoslangan molekulyar testlardan farqli o‘laroq, THM ni aniqlash qulay qon tahliliga asoslangan. Ushbu yondashuv DTC uchun birinchi operatsiyadan oldingi diagnostik qon tahlilini taqdim etadi. Uning deyarli 100% PPV va «tasdiqlovchi» kuchini hisobga olgan holda, ijobiy THM test natijasi qo‘shimcha diagnostika choralarisiz DTC ni tashxislash uchun yetarli bo‘ladi. Uning suboptimal NPV ni hisobga olgan holda, salbiy THM testi, ayniqsa past Bethesda yoki ACR TI-RADS toifalarida, DTC ni katta darajada istisno qiladi. Klinik jihatdan kamroq uchraydigan yuqori Bethesda yoki ACR TI-RADS toifalarida salbiy THM testini klinik kontekstda ko‘rib chiqish kerak va yuqori NPV ga ega bo‘lgan hozirgi FNAB ga asoslangan molekulyar diagnostika testlaridan qo‘shimcha foydalanish qo‘shimcha ma’lumot berishi mumkin. Yuqori diagnostik samaradorlikka erishish uchun zarur bo‘lgan THM ning oz soni bu testni tejamkor qiladi. LC-MS/MS ning zardobdagi past THM konsentratsiyalarini (pg/ml) sezgir aniqlash qobiliyati oldingi hisobotlarga mos keladi. LC-MS/MS shuningdek, aniq va barqaror bo‘lib, bu klinik test natijalari va T4 va T3 ning LC-MS/MS o‘lchovlari o‘rtasidagi, shuningdek, ko‘p kunlik THM o‘lchovlari o‘rtasidagi ajoyib muvofiqlik bilan tasdiqlangan (SN-jadval). Ushbu tadqiqotda qalqonsimon bez funksiyasi parametrlari normal diapazonda bo‘lsa-da, ular DTC bilan og‘rigan bemorlarda BTN bilan og‘riganlarga qaraganda bir oz pastroq bo‘lgan, bu oldingi hisobotlarga mos keladi. Bu zardobdagi THM ning DTC uchun diagnostik sezgirligini kam baholashga olib kelgan bo‘lishi mumkin. Darhaqiqat, testning diagnostik sezgirligi LRM da FT4 chalkashtiruvchi omil omil sifatida tuzatilganda yaxshilandi (SN-rasm). DTC da deyodinazalar ifodasi va zardobdagi qalqonsimon bez funksiyasi parametrlari o‘rtasidagi bog‘liqlik bo‘yicha natijalar SN-rasmda keltirilgan.&lt;/p&gt;\n&lt;p&gt;Shuni ta’kidlash kerakki, DTC to‘qimalaridagi T0 va 3-T1AM konsentratsiyalari zardobdagiga qaraganda uch barobar yuqori bo‘lgan (SN-rasm).&lt;/p&gt;\n&lt;p&gt;Bu qalqonsimon bezning gormonlar substratiga boy mahalliy muhitida differensiyalangan qalqonsimon bez saratoni (DTC) o'smalarida qalqonsimon bez gormonlarini metabolizatsiya qiluvchi deyodinazalarning yuqori ekspressiyasi hisobiga THM'larning ko'p miqdorda ishlab chiqarilishi bilan mos keladi (Rasm S5 va Jadval S18). DTC'da DIO3 ekspressiyasining ortishi haqidagi avvalgi ma'lumotlarni tasdiqlashdan tashqari, ushbu tadqiqotda normal to'qimalarga nisbatan ODC ekspressiyasining sezilarli darajada oshishi, shuningdek, DTC'da xavfsiz tugunlarga (BTN) qaraganda har ikkala oqsil ekspressiyasining ancha yuqoriligi kuzatildi. Kutilganidek, biz DTC o'lchami va zardobdagi THM'lar, xususan, bir nechta deyodinazalar tomonidan boshqariladigan qalqonsimon bez gormonlari metabolizmi yo'lining kechki metaboliti bo'lgan T0 o'rtasida bog'liqlikni aniqladik (Rasm S1, S6). Limfa tugunlari metastazlarining zardobdagi THM darajasiga hech qanday ta'siri aniqlanmadi; bu kutilgan holat edi, chunki qalqonsimon bezdan farqli o'laroq, limfa tugunlari deyodinazalar uchun substrat bo'lib xizmat qiladigan gormonlarga boy emas. THM testi yodni yetarli darajada qabul qilmaydigan yoki ortiqcha iste'mol qiladigan shaxslar uchun mos kelmasligi mumkin, biroq turli bemorlar guruhlarida siydikdagi yod miqdori o'xshash bo'lganligi sababli, bu ushbu tadqiqotda muammo tug'dirmadi. Ushbu test, shuningdek, deyodinaza genlarida mutatsiyalari mavjud kam sonli bemorlar uchun to'g'ri kelmasligi mumkin. Biz, shuningdek, kohortaga xos sezgirlik va o'ziga xoslikni kasallikning taxminiy tarqalishiga qo'llash orqali prognostik qiymatlarni qayta hisoblab chiqdik (Jadval S20).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/a-serum-thyroid-hormone-metabolite-test-for-molecular-diagno-fS1.jpg\" alt=\"Rasm S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Deyodinazalar (DIO) — tiroksin (T4) molekulasidan yod atomlarini bosqichma-bosqich ajratib, T3, teskari T3 va oxir-oqibat yodsiz tironin (T0) hosil qiluvchi fermentlar guruhidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Hozirgi natijalar asosan papillyar qalqonsimon bez saratoniga (PTC) tegishli bo'lishi mumkin, chunki tadqiqotga kiritilgan follikulyar qalqonsimon bez saratoni (FTC) va onkotsitar karsinoma (OCC) holatlari soni nisbatan kam edi, garchi ikkinchi guruh ham PTC kabi THM testida ijobiy natija ko'rsatgan bo'lsa-da. Kelajakda FTC/OCC holatlarining ko'proq sonini o'z ichiga olgan tadqiqotlar ushbu o'sma turlarida testni qo'shimcha tekshirish imkonini beradi. Retrospektiv modelni o'rgatish kohortasidagi ba'zi BTN sub'ektlariga BTN tashxisi faqat sitologiya yoki ultratovush tekshiruvi asosida qo'yilgan. Bunday «BTN» sub'ektlarida xavfli tugunlar mavjud bo'lgan bo'lishi ehtimoli yuqori, bu esa THM testida «soxta musbat» natijalarga olib kelib, diagnostik o'ziga xoslikni sun'iy ravishda pasaytirgan bo'lishi mumkin. Haqiqatan ham, DTC va BTN ning barcha holatlari gistopatologik jihatdan tasdiqlangan ikkita modelni tekshirish kohortasida THM testining samaradorligi o'rgatish kohortasidagiga qaraganda ancha yuqori bo'ldi. Qalqonsimon bez saratonining kam uchraydigan turlarida THM testining qo'llanilishi ham kelgusida o'rganilishi kerak.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;O'rgatish kohortasida xavfsiz tugunlar qisman gistologiyasiz tasdiqlangan, bu esa aniqlanmagan o'smalar hisobiga testning o'ziga xoslik ko'rsatkichini pasaytirgan bo'lishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Xulosa qilib aytganda, ushbu tadqiqotda qalqonsimon bez tugunlarini molekulyar-diagnostik baholash uchun zardob THM'larini aniqlovchi yangi qon testi ishlab chiqildi. Ushbu test DTC, ayniqsa PTC uchun tashxisni tasdiqlashda («rule-in») a'lo darajadagi va istisno qilishda («rule-out») biroz pastroq ko'rsatkichlarni namoyish etadi. Bu qalqonsimon bez tugunlarini samarali molekulyar baholash va DTC'ni, xususan PTC'ni operatsiyadan oldin aniq tashxislash uchun mo'ljallangan, sezilarli klinik ta'sir ko'rsatish salohiyatiga ega bo'lgan birinchi qon testidir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Zardobdagi qalqonsimon bez gormonlari metabolitlariga asoslangan yangi test DTC (ayniqsa PTC) tashxisini operatsiyadan oldin qon orqali yuqori aniqlikda tasdiqlash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-01/a-serum-thyroid-hormone-metabolite-test-for-molecular-diagno.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Tugunlarni&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;diagnostika&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qilish&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qiyinligi&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Gormon metabol&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;itlarini SX-&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;TMS tahlili&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;NATIJA&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill
