            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"263\" cy=\"171\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"577\" cy=\"179\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Miyaning xotira tasvirlarini&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qanday tiklashi aniqlandi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;O‘tmishdagi to‘y yoki tonggi yugurishni eslaganimizda ko‘z oldimizda aniq vizual manzaralar gavdalanadi. Miya aynan tasvirni tiklaydimi yoki faqat voqeaning umumiy ma’nosinimi degan savol uzoq vaqt ochiq qolgan edi. Tadqiqotchilar sun’iy intellekt yordamida odamlarning xotiralari asosida tasvirlar yaratib, ularni miya faolligi bilan taqqosladilar. Natijada shaxsiy vizual xotiralar uchun miyaning birlamchi holat tizimidagi maxsus qism javobgar ekani aniqlandi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;MT-DMN tarmog‘i xotiradagi shaxsiy tasvirlar tuzilishini alohida kodlaydi&lt;/li&gt;\n&lt;li&gt;Effekt GPT-2 yordamida noverbal semantika chiqarib tashlanganda ham saqlanadi&lt;/li&gt;\n&lt;li&gt;Boshqa 16 ta neyrotarmoqda va oddiy o‘qish paytida bu vizual kod aniqlanmadi&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqotda 50 nafar ko‘ngilli (25 nafar yosh, o‘rtacha yoshi 24 ± 3, va 25 nafar keksa yoshli, 73 ± 7 yosh) ishtirok etdi. fMRT skanerlashidan oldin qatnashchilar 20 ta umumiy ssenariy (masalan, «mashg‘ulot» yoki «to‘y») bo‘yicha o‘zlarining shaxsiy xotiralarini qisqacha tasvirlab berishgan. Ushbu matnlar asosida Stable Diffusion 2.1 neyrotarmog‘i har bir holat uchun beshtadan sintetik tasvir yaratdi, so‘ngra VGG-16 konvolyutsion tarmog‘ining FC8 qatlamidan 1000 o‘lchamli vektorlar olinib, vizual model tuzildi.&lt;/p&gt;\n&lt;p&gt;fMRT seansi davomida ishtirokchilar hech qanday ovoz chiqarmasdan, berilgan yozma belgilar orqali ushbu manzaralarni qayta tasavvur qilishdi. Taqdimotlar o‘xshashligini tahlil qilish (RSA) usuli hamda GPT-2 modeli orqali matn ma’nosi nazorat qilinganda, vizual tuzilma faqat miyaning birlamchi holat tizimi medial temporal quyi tarmog‘ida (MT-DMN — parahippokampal, retrosplenial va lateral parietal po‘stloq) kodlanishi ma’lum bo‘ldi. Ushbu o‘ziga xos vizual iz boshqa 16 ta neyron tarmoqda yoki tasavvursiz shunchaki matn o‘qilganda umuman kuzatilmadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tasvirlar subyektlarning qisqa tavsiflari bo‘yicha sun’iy intellekt tomonidan yaratilgan va qatnashchilar ularning xotiraga qay darajada mosligini bevosita tasdiqlamagan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Xotira tasviri&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qanday&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;kodlanadi&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;fMRT va&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;matndan tasvir&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;oluvchi AI&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&
