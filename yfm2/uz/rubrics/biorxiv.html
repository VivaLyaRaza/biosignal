spons-card.jpg"},"content":{"title":"Rak terapiyasida immun tizimini qanday tiklash mumkin","text":"&lt;p&gt;Yangi yondashuv onkologiyada t-hujayralarning charchab qolishining oldini oladi.&lt;/p&gt;\n","links":[{"url":"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-card.jpg"},"content":{"title":"Altsgeymer kasalligida hujayralararo zanjirli shikastlanish mexanizmi","text":"&lt;p&gt;Toksik oqsillar hujayralar orasida pufakchalar orqali uzrilib, qo'shni neyronlarni nobud qiladi.&lt;/p&gt;\n","links":[{"url":"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-card.jpg"},"content":{"title":"Afaziya va&amp;nbsp;ong: nima uchun ba&amp;rsquo;zilar tasavvur qila olmaydi?","text":"&lt;p&gt;Olimlar tug'ma afantaziyaga ega odamlarning miyasida nima o'zgarganini aniqlashdi.&lt;/p&gt;\n","links":[{"url":"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi-card.jpg"},"content":{"title":"Miyamiz voqelikni orqadan turib birlamchi koʻrish qobigʻida qayta tiklaydi","text":"&lt;p&gt;Hozir koʻrayotgan narsamiz kelajakdagi voqealarga bogʻliq. 7T MRT yordamida oʻtkazilgan tajriba miya idrakni qanday tuzatishini koʻrsatdi.&lt;/p&gt;\n","links":[{"url":"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/how-occam-s-razor-guides-human-decision-making-card.jpg"},"content":{"title":"Miya nima uchun sodda tu
