            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"104\" cy=\"114\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"516\" cy=\"172\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Miya kasalliklarida oqsil&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;yetishmovchiligi noodatiy&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;halqasimon RNKlarni hosil&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qiladi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur-f1.jpg\" alt=\"1-rasm. TDP-43 yo'qolishi kriptik circRNA biogenezini keltirib chiqaradi. a, Differensiatsiyaning 14-kunida i3Neyronlard\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. TDP-43 yo'qolishi kriptik circRNA biogenezini keltirib chiqaradi. a, Differensiatsiyaning 14-kunida i3Neyronlarda sgRNA yordamida TDP-43 nokdaunini ko'rsatuvchi Vestern blot.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Amyotrofik lateral skleroz va peshona-chakka demensiyasida hujayra yadrosidagi TDP-43 oqsili o'z vazifasini yo'qotadi. Yangi tadqiqot shuni ko'rsatdiki, bu buzilish neyronlarni g'ayrioddiy yopiq RNK molekulalarini ishlab chiqarishga majbur qiladi. Bunday tuzilmalar chidamliligi bilan ajralib turadi va vaqt o'tishi bilan to'planib boradi. Ular Altsgeymer kasalligiga chalingan bemorlar miya to'qimalarida ham topildi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;TDP-43 oqsili yetishmovchiligi neyronlarda maxsus yashirin halqasimon RNKlar sintezini qo'zg'atadi.&lt;/li&gt;\n&lt;li&gt;Yangi molekulalar uzun intronlardan hosil bo'ladi va yuqori darajada turg'unlikka ega.&lt;/li&gt;\n&lt;li&gt;Bunday halqasimon RNKlar neyrodegenerativ kasalliklarga chalingan bemorlar miyasida to'planadi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;TDP-43 oqsili odatda RNK yetilish jarayonini boshqaradi, ammo neyrodegenerativ kasalliklarda u yadroda kamayib ketadi. Olimlar bu oqsil yetishmovchiligining halqasimon RNKlar (circRNA) hosil bo'lishiga ta'sirini o'rganish uchun inson neyronlaridan foydalandilar. RNKni ketma-ketlikdan o'tkazish usullari orqali ular circRNA tarkibida keskin o'zgarishlar sodir bo'lishini qayd etdilar. TDP-43 yetishmaganda, uzun intronlar ichidagi yashirin qismlar faollashib, yangi halqasimon tuzilmalar yuzaga kelishiga sabab bo'ladi.&lt;/p&gt;\n&lt;p&gt;Bunday yashirin halqasimon RNKlar parchalanishga qarshi yuqori turg'unlikka ega bo'lib, hujayralarda yigilib qoladi. Amyotrofik lateral skleroz, peshona-chakka demensiyasi va Altsgeymer kasalligi bilan og'rigan insonlarning miya namunalarini tahlil qilish ham bu molekulalar miqdori yuqoriligini tasdiqladi. Olingan natijalar TDP-43 funksiyasining yo'qolishi asab tizimidagi RNK almashinuvini jiddiy buzishini ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot asosan hujayra modellari va vafot etgan bemorlarning miya to'qimalariga asoslangan bo'lib, tirik organizmdagi mexanizmlarni qo'shimcha o'rganish talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;TAR DNK-bog'lovchi oqsil 43 (TDP-43) amyotrofik lateral skleroz (ALS) va frontotemporal demensiya (FTD) kasalliklarining asosiy patologik belgisi bo'lib, RNK splaysingini boshqarishda muhim rol o'ynaydi. TDP-43 yetishmovchiligining chiziqli transkriptlar splaysingiga ta'siri yaxshi o'rganilgan bo'lsa-da, uning halqasimon RNK (circRNA) biogeneziga ta'siri hali tadqiq etilmagan edi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TDP-43 tanqisligi o'ziga xos kriptik circRNA sinfining ko'payishiga olib keladi, ular yuqori barqarorligi tufayli neyronlarda to'planib boradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;p&gt;Ushbu ishda TDP-43 darajasining pasayishi inson neyronlarida circRNA profillarida keng ko'lamli o'zgarishlarni keltirib chiqarishi ko'rsatildi. Xususan, aynan TDP-43 yo'qolganda paydo bo'ladigan kriptik circRNA'larning alohida klassi faollashadi. Aniqlanishicha, bu molekulalarning ba'zilari intron ketma-ketliklaridan hosil bo'lgan kriptik ekzonlarni o'z ichiga oladi. Ushbu kriptik circRNA'lar o'zlarining chiziqli RNK izoformalariga nisbatan yuqori barqarorlikka ega bo'lib, neyronlarda bosqichma-bosqich to'planadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kriptik ekzonlar — bu odatda intron hisoblangan, lekin splaysingdagi nuqsonlar tufayli genning kodlovchi qismi sifatida o'qiladigan RNK bo'laklari.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bundan tashqari, ALS, FTD va Altsgeymer kasalligi bilan og'rigan bemorlarning o'limdan keyingi miya to'qimalarida ushbu kriptik circRNA'lar darajasi yuqori ekanligi aniqlandi. Ushbu topilmalar TDP-43 ning kriptik circRNA shakllanishini bostirishdagi ilgari noma'lum bo'lgan rolini ochib beradi va bu circRNA'larni TDP-43 disfunksiyasining barqaror molekulyar belgilari sifatida belgilaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot inson neyronlari va o'limdan keyingi miya to'qimalari asosida o'tkazilgan, shuning uchun bu RNK'larning neyrodegeneratsiyadagi bevosita patogenetik roli qo'shimcha tekshiruvlarni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish1\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#kirish1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"neyrodegenerativ-kasalliklarda-umumiy-patologik-mexanizmlar\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#neyrodegenerativ-kasalliklarda-umumiy-patologik-mexanizmlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Neyrodegenerativ kasalliklarda umumiy patologik mexanizmlar&lt;/span&gt;&lt;/a&gt;Neyrodegenerativ kasalliklarda umumiy patologik mexanizmlar&lt;/h4&gt;\n&lt;p&gt;Amyotrofik lateral skleroz (ALS) va frontotemporal demensiya (FTD) o'xshash genetik va klinik xususiyatlarga ega neyrodegenerativ kasalliklardir. Ikkala kasallikning asosiy belgisi TDP-43 (TAR DNA-binding protein 43 kDa) oqsilining patologiyasidir, bunda oqsil yadroda kamayib, sitoplazmada to'planadi. TDP-43 patologiyasi Altsgeymer, Parkinson, Xantington kasalliklari, LATE va tarqoq skleroz kabi boshqa nevrologik buzilishlarda ham kuzatiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TDP-43 funksiyasining yo'qolishi (LOF) RNK metabolizmidagi buzilishlarning asosiy sababi bo'lib, u turli neyrodegenerativ holatlarni birlashtiruvchi molekulyar mexanizm hisoblanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Dalillar shuni ko'rsatadiki, TDP-43 ning yadroviy kamayishi sitoplazmatik agregatsiyadan oldin sodir bo'ladi. Yadroda TDP-43 pre-mRNK splaysingini boshqaradi; uning yetishmovchiligi kriptik ekzonlarning qo'shilishi, intronlarning saqlanib qolishi va ekzonlarning tushib qolishi kabi xatolarga olib keladi. TDP-43 shuningdek, alternativ poliadenillanish, mRNK barqarorligi va mikroRNK hamda retrotranspozonlar kabi kodlanmaydigan RNKlar regulyatsiyasida ishtirok etadi. Ushbu jarayonlarning buzilishi neyronlar disfunksiyasiga olib keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LOF (loss-of-function) — oqsilning o'z normal vazifasini bajara olmasligi holati bo'lib, bu hujayra ichidagi jarayonlarning izdan chiqishiga sabab bo'ladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tdp-43-ning-sirkulyar-rnklar-biogenezidagi-roli\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#tdp-43-ning-sirkulyar-rnklar-biogenezidagi-roli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TDP-43 ning sirkulyar RNKlar biogenezidagi roli&lt;/span&gt;&lt;/a&gt;TDP-43 ning sirkulyar RNKlar biogenezidagi roli&lt;/h4&gt;\n&lt;p&gt;Sirkulyar RNKlar (circRNK) — bu teskari splaysing natijasida hosil bo'ladigan kovalent yopiq molekulalar. Ular ekzonukleazalarga chidamli bo'lib, asosan asab tizimida uchraydi va sinaptik funksiyalarda muhim rol o'ynaydi. Altsgeymer va Parkinson kasalliklarida circRNKlar disregulyatsiyasi kuzatiladi, ammo ularning mexanizmi hali to'liq o'rganilmagan.&lt;/p&gt;\n&lt;p&gt;CircRNK biogenezi RNK-bog'lovchi oqsillar (RBP) tomonidan boshqariladigan splaysing bilan chambarchas bog'liq. TDP-43 intronlar bilan kuchli bog'langanligi sababli, mualliflar uning circRNK biogeneziga ta'sirini o'rgandilar. Tadqiqot natijalariga ko'ra, TDP-43 teskari splaysing regulyatori hisoblanadi. TDP-43 yo'qolishi natijasida yangi turdagi «kriptik» circRNKlar hosil bo'ladi, ular neyrodegenerativ kasalliklarga chalingan to'qimalarda yuqori darajada ifodalanadi. Ushbu barqaror molekulalar kasallik patogenezida ishtirok etishi va diagnostik biomarker bo'lishi mumkin.&lt;/p&gt;\n&lt;h3 id=\"natijalar1\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#natijalar1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"loss-of-tdp-43-induces-cryptic-circrnas-in-i3neurons\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#loss-of-tdp-43-induces-cryptic-circrnas-in-i3neurons\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Loss of TDP-43 induces cryptic circRNAs in i3Neurons&lt;/span&gt;&lt;/a&gt;Loss of TDP-43 induces cryptic circRNAs in i3Neurons&lt;/h4&gt;\n&lt;p&gt;TDP-43 oqsiltasining yetishmovchiligi neyronlarda halqasimon RNKlarning (circRNA) ekspressiyasiga qanday ta'sir qilishini aniqlash uchun tadqiqotchilar CRISPRi tizimiga ega bo'lgan va TDP-43 ga qaratilgan sgRNK ni ifodalovchi i3Neurons50 liniyasini yetishtirdilar. Differentsiatsiyadan 14 kun o'tgach, immunoblotting orqali TDP-43 oqsilining darajasi samarali pasaygani tasdiqlandi (1a-rasm). circRNA larni tahlil qilish uchun mualliflar poly(A)+ mRNK larni oldindan olib tashlab, RNase R fermenti bilan ishlov berib va ribosomal rRNK ni kamaytirib, RNK sekvenlashini (RNA-seq) amalga oshirdilar (Metodlarga qarang). Shuningdek, oddiy chiziqli mRNK ifodalanishini baholash uchun poly(A) bo'lmagan fraksiya ham parallel ravishda sekven qilindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;CRISPRi — bu DNK ni kesmasdan ma'lum genlar faolligini bostirish usuli, RNase R esa chiziqli RNK larni tanlab parchalaydigan va halqasimon circRNA larni to'plashga imkon beruvchi fermentdir.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;RNA-seq tahlili TDP-43 kamayganidan keyin circRNA miqdorida keng ko'lamli o'zgarishlar yuz berganini ko'rsatdi (1b-rasm, S1-jadval). Qizig'i shundaki, bu o'zgarishlar mos keladigan chiziqli transkriptlar darajasi bilan deyarli bog'lanmagan (S1a-rasm), bu circRNA regulyatsiyasi ota-ona genlarining transkripsiyasidan mustaqil ekanligini bildiradi. Garchi bitta gerdan circRNA ning bir nechta izoformalari hosil bo'lishi mumkin bo'lsa-da, mualliflar ularga nisbiy miqdoriga qarab raqamlar berdilar, biroq matnda asosiy gen nomlarini ishlatdilar (izoforma raqamlari S1-jadvalda keltirilgan). TDP-43 yo'qolganidan so'ng, circRNA larning kamayishiga qaraganda ularning ortishi (faollashishi) ustunlik qilishi kuzatildi (1b, c-rasm). Alohida e'tiborga loyiq jihati, nazorat neyronlarida deyarli aniqlanmaydigan, lekin ayniqsa TDP-43 yetishmovchiligida de novo paydo bo'ladigan circRNA larning kichik guruhi aniqlandi (1c-rasm, qizil rangda belgilangan; S2-jadval).&lt;/p&gt;\n&lt;h4 id=\"transkriptom-xususiyatlarini-tahlil-qilish-va-validatsiya\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#transkriptom-xususiyatlarini-tahlil-qilish-va-validatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Transkriptom xususiyatlarini tahlil qilish va validatsiya&lt;/span&gt;&lt;/a&gt;Transkriptom xususiyatlarini tahlil qilish va validatsiya&lt;/h4&gt;\n&lt;p&gt;Faollashgan circRNA larning transkriptom xususiyatlarini o'rganib, olimlar ularning hosil bo'lish mexanizmini tekshirdilar va tutashuv nuqtalarini (back-splicing junctions) qamrab oluvchi primerlar yordamida nomzodlarni tasdiqladilar. Faollashgan tutashuv nuqtalarining aksariyati kanonik ekzonlar orasida joylashgan edi (1d-rasm, S1-jadval). Ularning ko'pchiligi nazorat neyronlarida ham mavjud bo'lib, TDP-43 yo'qolganda keskin oshgan (masalan, circSOX5.1, circZNF420, circTMEFF1, circRIMS1; S1b-rasm). Ayrimlari esa faqat TDP-43 Nokdaun qilingan neyronlarga xos edi: masalan, circDIP2C oltita annotatsiya qilingan ekzondan iborat bo'lib, 33-ekzonning 28-ekzon bilan tutashuvi faqat TDP-43 kamayganda paydo bo'lgan (1e-rasm). Boshqa tasdiqlangan misollar qatoriga circUNC13A, circNCOR2, circDDAH1 va circCCNY kiradi (S1b-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;TDP-43 ning yo'qolishi yangi halqasimon RNKlarning (circRNA) keng miqyosda paydo bo'lishiga olib keladi, ular orasida de novo molekulalar va uzun intronlardagi kriptik ekzonlarni o'z ichiga olgan gibrid tuzilmalar mavjud.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Shuningdek, biz ekzonlar ichidagi muqobil splicing saytlaridan foydalanadigan circRNA larni ham aniqladik, masalan, circZNF566 va circSELENOT (mos ravishda 5 va 6-ekzonlar ichida; 1f-rasm, S1c-rasm). Qizig'i shundaki, biz ekzon-intron chegaralarini o'z ichiga olgan yoki butunlay intronik hududlarda yuzaga keladigan yangi tutashuv nuqtalarini aniqladik (1d-rasm, S2-jadval). Bu hodisalar TDP-43 yetishmovchiligida intronlar ichidagi kriptik splicing saytlarining faollashishi natijasida yuzaga keladi va keyinchalik kriptik ekzonlarni (CE) o'z ichiga olgan circRNA larni hosil qilish uchun ishlatiladi. circADGRL3 tarkibida quyi oqimdagi kanonik ekzon bilan halqalanuvchi CE mavjud (1g-rasm); shuningdek, circPBX1, circFOXK1 va circZNF423 shunday gibrid circRNA larga misol bo'la oladi (S1d-rasm).&lt;/p&gt;\n&lt;p&gt;Shuningdek, TDP-43 yo'qolishi tufayli faollashgan intronlardan kelib chiqqan va faqatgina kriptik ekzonlardan iborat circRNA lar ham topildi. circGRM7 faqat bitta intron ichidagi uchta qo'shni annotatsiya qilinmagan CE dan hosil bo'ladi (1h-rasm), circDAPK1 esa 2-intron ichidagi ikkita CE dan iborat (S1e-rasm). circUNC5D lar 1-intron ichidagi oltita annotatsiya qilinmagan CE klasteridan kelib chiqadi (S1e-rasm). Muhimi, bunday intronik kriptik circRNA lar bir xil genlardagi boshqa intronlarga nisbatan sezilarli darajada uzunroq intronlardan afzalroq kelib chiqqan (S1f-rasm). Bir nechta circRNA larning to'liq uzunlikdagi ketma-ketliklari plazmidalarga kiritilgandan so'ng Sanger sekvenlashi yordamida tasdiqlandi (S3-jadval).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Barcha tajribalar inson neyronlarining sun'iy hujayra modeli (i3Neurons50) yordamida amalga oshirilgan bo'lib, olingan natijalarni inson to'qimalarida qo'shimcha tekshirish talab etiladi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kriptik-circrnalarning-kichik-toplami-tdp-43-boglanishining-yoqolishi-natijasida-yuzaga-keladigan-aberrant-chiziqli-splicing-bilan-bogliq\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#kriptik-circrnalarning-kichik-toplami-tdp-43-boglanishining-yoqolishi-natijasida-yuzaga-keladigan-aberrant-chiziqli-splicing-bilan-bogliq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kriptik circRNAlarning kichik to‘plami TDP-43 bog‘lanishining yo‘qolishi natijasida yuzaga keladigan aberrant chiziqli splicing bilan bog‘liq&lt;/span&gt;&lt;/a&gt;Kriptik circRNAlarning kichik to‘plami TDP-43 bog‘lanishining yo‘qolishi natijasida yuzaga keladigan aberrant chiziqli splicing bilan bog‘liq&lt;/h4&gt;\n&lt;p&gt;circRNA darajasining oshishi va TDP-43 o‘rtasidagi bog‘liqlikni o‘rganish uchun biz i3-neyronlarda ARTR-seq usulidan foydalandik. Bu yondashuv RBP oqsillarini immunopresipitatsiya qilish va in situ teskari transkripsiya qilishni birlashtiradi, bu esa oqsilning RNK bilan bog‘lanish joylarini xaritalash imkonini beradi (Rasm SN 2a-b). Tahlil TDP-43 asosan intron hududlaridagi UG-boy motiflar bilan bog‘lanishini tasdiqladi, bu ma’lum ma’lumotlarga mos keladi (Rasm 2a, Rasm SN 2b). K562 hujayralaridagi eCLIP-seq ma’lumotlari bilan solishtirish usulning o‘ziga xosligini tasdiqladi (Rasm SN 2c). Muhimi, TDP-43 depletsiyasi paytida darajasi oshgan circRNAlar back-splice tutashuvlarini o‘rab turgan intronlarda ushbu oqsilning ko‘paygan bog‘lanishini ko‘rsatdi, bu circPBX1, circUNC13A, circUNC5D.1 va circDIP2C uchun yaqqol namoyon bo‘ldi (Rasm 2b, 2c).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur-f2.jpg\" alt=\"2-rasm. Yuqori regulyatsiya qilingan circRNA'lar TDP-43 bog'lanishining boyishiga bog'langan va aberrant chiziqli spaysi\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm. Yuqori regulyatsiya qilingan circRNA'lar TDP-43 bog'lanishining boyishiga bog'langan va aberrant chiziqli spaysing bilan bog'langan. a, TDP-43 ARTR-seq cho'qqilarining motiv tahlili genomi bo'ylab kanonik UG ga boy RNA bog'lovchi motivining boyishini aniqlaydi. b, Yuqori regulyatsiya qilingan circRNA'lar (yashil) va sezilarli darajada o'zgarmagan (ns) circRNA'larning (kulrang) teskari spaysing tutashuvlarini (±1 kb) qamrab oluvchi intron hududlari bo'ylab TDP-43 bog'lanishining taqsimlanishi. Rang soyalari uchta replikaning yaqinlashish standart xatosini ko'rsatadi. c, circPBX1, circUNC13A, circUNC5D.1 va circDIP2C lokuslarida ARTR-seq yordamida aniqlangan vakillik TDP-43 bog'lanish profillari. circARID1A (teskari spaysing tutashuvi: chr1:26729651-26732792), o'zgarmmagan circRNA, manfiy nazorat sifatida ko'rsatilgan. Gorizontal o'q har bir panelda markazlashtirilgan holda circRNA teskari spaysing tutashuvini qamrab oluvchi ±1 kb genom ketma-ketligini bildiradi. Teskari spaysingda ishlatiladigan 5′ va 3′ spaysing saytlari (ss) ko'rsatilgan. Ekzonlar och ko'k rangda, intronlar qizil rangda va CE'lar pushti rangda ko'rsatilgan. To'q ko'k treklar normallashtirilgan TDP-43 ARTR-seq signalini bildiradi. Qora o'qlar transkripsiya yo'nalishini ko'rsatadi. d–g, NMD ingibitsiyasidan keyin TDP-43 tugashi natijasida kelib chiqqan kriptik circRNA biogenezi va aberrant spaysing hodisalari o'rtasidagi bog'lanishning vakillik misollari. d, CE o'z ichiga olgan chiziqli transkriptlar va tegishli kriptik circRNA'lar. e, Qo'shni CE'lardan intronik kriptik circRNA hosil bo'lishi. f, Qo'shni kriptik spaysing saytlarining faollashuvi bilan bog'langan ekzonik circRNA'lar. g, Muqobil 5′ spaysing saytidan foydalanish bilan bog'langan circRNA hosil bo'lishi. Vakillik hodisalari RT–qPCR (d, e, f) yoki RT–PCR (g) yordamida tasdiqlangan. Yumaloq yoylar teskari spaysing hodisalarini ko'rsatsa, burchakli yoylar chiziqli spaysing hodisalarini ko'rsatadi. Ko'k yoylar kanonik spaysing tutashuvlarini, to'q sariq yoylar TDP-43 tugashi natijasida kelib chiqqan aberrant spaysing tutashuvlarini, qizil yoylar esa kriptik circRNA bilan bog'liq tutashuvlarni bildiradi. Ikki rangli ko'k-qizil yoylar kanonik va siklik transkriptlar o'rtasida taqsimlangan spaysing tutashuvlarini ko'rsatadi. Uzluksiz yoylar eksperimental tarzda tasdiqlangan yoki kanonik spaysing tutashuvlarini bildiradi, shtrixli yoylar esa bashorat qilingan spaysing tutashuvlarini ko'rsatadi. O'qlar RT–PCR yoki RT–qPCR tahlillari uchun ishlatiladigan praymer pozitsiyalarini ko'rsatadi. Ma'lumotlar uchta biologik replikatdan o'rtacha ± SEM sifatida ko'rsatilgan. Statistik ahamlilik ikki tomonlama juftlashtirilmagan t-testlar yordamida aniqlandi.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TDP-43 depletsiyasi paytida circRNA darajasining oshishi qo‘shni intronlarda oqsil bog‘lanishining yo‘qolishi bilan bog‘liq bo‘lib, bu TDP-43 ning ushbu joylarni bostirishdagi tartibga soluvchi rolini ko‘rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ARTR-seq — teskari transkripsiya jarayonida biotin bilan belgilangan nukleotidlarni to‘g‘ridan-to‘g‘ri kiritish orqali ma’lum bir oqsil bilan bog‘langan RNKni xaritalash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;circRNA va aberrant splicing o‘rtasidagi bog‘liqlikni o‘rganish NMD (nonsense-mediated decay) ingibitsiyasi sharoitida amalga oshirildi. 569 ta upregulated circRNA dan 97 tasi aberrant splicing hodisalari (ekzonlarni o‘tkazib yuborish, kriptik ekzonlarni (CE) qo‘shish) bilan bog‘liq edi. CE ni o‘z ichiga olgan circPBX1, circADGRL3 va circFOXK1 uchun RT-qPCR shuni ko‘rsatdiki, TDP-43 ning yo‘qolishi chiziqli RNKga CE qo‘shilishining ko‘payishiga olib keladi, bu NMD ingibitsiyasi bilan yanada kuchayadi (Rasm 2d). Bu CE bo‘lgan chiziqli RNKlar NMD orqali tezda degradatsiyaga uchrashini tasdiqlaydi. Aksincha, tegishli circRNAlar barqaror edi va NMD ga bog‘liq emas edi, bu ularning ushbu nazorat mexanizmiga chidamliligini ko‘rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot i3-neyronlarda o‘tkazildi; chiziqli va halqali RNKlarning NMD ga bog‘liqligi boshqa hujayra turlarida farq qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Intronik CE ni o‘z ichiga olgan circGRM7 holatlarida chiziqli mahsulotlar juda kam uchraydi va NMD ingibitsiyasi bilan barqarorlashmaydi, bu chiziqli izoformalarning degradatsiyasidan ko‘ra, circRNA hosil bo‘lishi uchun kriptik joylardan ustun foydalanishni anglatadi. Shuningdek, circUNC13A va circNCOR2 kabi CE ning o‘zini qo‘shmasdan circRNA faollashgan holatlar ham aniqlandi (Rasm 2f). Bu yerda TDP-43 ham chiziqli RNKlardagi kriptik joylardan foydalanishni, ham back-splicingni bostiradi. CE bo‘lgan chiziqli RNKlar NMD-degradatsiyasiga uchrasa-da, tegishli circRNAlar yuqori ekspressiya darajasini saqlab qoladi, bu TDP-43 oqsili tomonidan ushbu jarayonlarning muvofiqlashtirilgan tartibga solinishini isbotlaydi.&lt;/p&gt;\n&lt;p&gt;Biz TDP-43 yetishmovchiligi boshqa turdagi aberrant splicing jarayonlariga qanday ta'sir qilishini o'rgandik. SOX5 transkriptida TDP-43 kamayishi 8-ekzon ichidagi muqobil 5′-splicing saytidan foydalanishga olib keldi, bu circSOX5.2 back-splicing birikmasi yaqinida joylashgan bo'lib, 8-ekzonning qisqarishiga sabab bo'ldi (2g-rasm). RT-PCR tahlili TDP-43 nokdaunidan so'ng to'liq uzunlikdagi 8-ekzon kamayganini va qisqargan shakli ko'payganini tasdiqladi. CE (kriptik ekzonlar) saqlovchi chiziqli transkriptlardan farqli o'laroq, bu muqobil izoforma NMD ingibitsiyasidan sezilarli darajada o'zgarmadi (2g-rasm). circSOX5.2 ham TDP-43 kamayishi bilan birga ortdi va NMD ingibitsiyasiga ta'sirchan emasligi aniqlandi, bu splicing tanlovi va circRNA biogenezi o'rtasidagi mexanik bog'liqlikni ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TDP-43 funksiyasining yo'qolishi chiziqli va halqali splicingda o'zgarishlarga olib keladi, bunda kriptik circRNA'lar degradatsiyadan qochib, to'planib boradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu natijalar TDP-43 splicing saytlarini tanlashda muhimligini va turli xil RNK izoformalarini muvofiqlashtirilgan holda boshqarishini ko'rsatadi. Kriptik splicing saytlarining faollashuvi ham chiziqli, ham halqali aberrant RNK mahsulotlarini hosil qiladi, ammo ularning taqdiri turlicha: chiziqli transkriptlar NMD orqali parchalanadi, circRNA'lar esa saqlanib qoladi va TDP-43 disfunksiyasining barqaror molekulyar ko'rsatkichi sifatida xizmat qiladi.&lt;/p&gt;\n&lt;h4 id=\"kriptik-circrnalar-yuqori-barqarorlikka-ega-va-neyronlarda-bosqichma-bosqich-toplanadi\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#kriptik-circrnalar-yuqori-barqarorlikka-ega-va-neyronlarda-bosqichma-bosqich-toplanadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kriptik circRNA'lar yuqori barqarorlikka ega va neyronlarda bosqichma-bosqich to'planadi&lt;/span&gt;&lt;/a&gt;Kriptik circRNA'lar yuqori barqarorlikka ega va neyronlarda bosqichma-bosqich to'planadi&lt;/h4&gt;\n&lt;p&gt;circRNA'larning ekzonukleaz degradatsiyasiga chidamliligini hisobga olib, biz ularning barqarorligini chiziqli transkriptlar bilan solishtirdik. Aktinomitsin D yordamida transkripsiyani to'xtatganda, chiziqli mRNKlar asta-sekin kamaydi, circRNA'lar esa deyarli parchalanmadi (3a-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Aktinomitsin D — RNK sintezini to'xtatuvchi modda bo'lib, RNKning yarim yemirilish davrini aniqlash uchun qo'llaniladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Neyronlarning differensiatsiyasi jarayonida circADGRL3 va circUNC13A darajalari TDP-43 nokdaunida vaqt o'tishi bilan ortib bordi, mRNKlar esa o'zgarmadi (3b-rasm, SN 3a-rasm). Hujayra fraksiyalash tahlili (SN 3b-rasm) shuni ko'rsatdiki, circRNA'lar asosan sitoplazmada joylashgan va ko'pincha o'zlarining mRNKlariga qaraganda kuchliroq sitoplazmatik boyishni namoyon etadi (3c-rasm).&lt;/p&gt;\n&lt;h4 id=\"tdp-43-oqsili-patopatiyasiga-ega-inson-miyasining-postmortem-toqimalarida-kriptik-circrnalar-miqdori-oshgan\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#tdp-43-oqsili-patopatiyasiga-ega-inson-miyasining-postmortem-toqimalarida-kriptik-circrnalar-miqdori-oshgan\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TDP-43 oqsili patopatiyasiga ega inson miyasining postmortem to'qimalarida kriptik circRNA'lar miqdori oshgan&lt;/span&gt;&lt;/a&gt;TDP-43 oqsili patopatiyasiga ega inson miyasining postmortem to'qimalarida kriptik circRNA'lar miqdori oshgan&lt;/h4&gt;\n&lt;p&gt;Inson kasalliklarida TDP-43 tomonidan boshqariladigan circRNA'larning o'zgarganini aniqlash uchun mualliflar ALS/FTD bilan og'rigan va nevrologik jihatdan sog'lom nazorat shaxslarining postmortem vaqtinchalik qobig'idan olingan namunalarda nomzod circRNA'larni o'lchaguvchi tahlil o'tkazdilar. Tadqiqotda ham C9ORF72-ALS/FTD, ham sporaik FTD holatlari o'rganildi.&lt;/p&gt;\n&lt;p&gt;Nomzod kriptik circRNA'lar bo'yicha RT-qPCR tahlili ularning sezilarli darajada oshganini ko'rsatdi, bunda circADGRL3 va circUNC13A ham C9ORF72 ALS/FTD, ham sporaik FTD holatlarida nazoratga nisbatan eng kuchli o'sishni namoyish etdi (4a-rasm). Aksincha, ularga mos keluvchi xo'jayin mRNK'lari faqatgina sust o'zgarishlar ko'rsatdi yoki umuman o'zgarmadi (S4a-rasm), bu circRNA'larning oshishi xo'jayin genlarining transkripsiyasi o'zgarishi bilan bog'liq emasligini bildiradi. E'tiborlisi, circRNA'larning induksiya miqyosi ma'lum chiziqli CE tutuvchi transkriptlar, jumladan UNC13A, CAMK2B, STMN2 va HDGFL2 darajasiga teng yoki ba'zi hollarda undan yuqori bo'ldi (4b-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kriptik circRNA'lar (circADGRL3 va circUNC13A) ALS/FTD da keskin ko'tarilib, o'zgarishlar darajasi bo'yicha ko'plab ma'lum chiziqli transkriptlardan ustun keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;TDP-43 proteopatiyasi Altsgeymer kasalligida (AK) ham uchragani uchun, tadqiqotchilar ushbu maqsadli circRNA'lar va ularning xo'jayin mRNK'larining ekspressiyasini AK bemorlarining xuddi shu miya sohasidagi postmortem namunalarida o'rgandilar. AK to'qimalarida circRNA'lar o'zlarining chiziqli xo'jayin transkriptlariga nisbatan sezilarli darajada kuchliroq o'zgarishlarni ko'rsatdi (4c-rasm, S4b-rasm) va ALS/FTD da kuzatilganidan farq qiluvchi ekspressiya naqshlarini namoyish etdi (4a, c-rasm). Agar circADGRL3 va circUNC13A ALS/FTD da kuchli yuqori regulyatsiyani ko'rsatgan bo'lsa (4a-rasm), AK namunalarida ular deyarli aniqlanmadi (4c-rasm). Aksincha, circZNF566, circDIP2C va circNCOR2 AK namunalarida kuchliroq oshgan bo'lsa, ALS va FTD da ular zaif o'zgardi yoki umuman o'zgarmadi (4a, c-rasm). Chiziqli CE'lar ham kasallikka xos bo'lgan turlicha naqshlarni ko'rsatdi; masalan, UNC13A CE ALS/FTD da eng yuqori darajada oshgan bo'lsa, AK da aniqlanmadi, CAMK2B CE esa AK da ALS/FTD ga qaraganda ko'proq ko'tarildi (4b, d-rasm). Bu natijalar TDP-43 disfunksiyasidan keyingi сплайсинг buzilishlari neyrodegenerativ kasalliklarda kasallikka xos naqshlarga ega ekanligini bildiradi, garchi bu kuzatuvlarni tasdiqlash uchun ko'proq namunalar tahlil qilinishi kerak.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BaseScope in situ usuli to'qima kesmalarida alohida hujayralar darajasida RNK molekulalarini vizualizatsiya qilish va miqdorini aniqlash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mualliflar circADGRL3 va circZNF566 back-splice tutashuvlariga qaratilgan zondlar yordamida BaseScope in situ gibridizatsiyasidan foydalanib, inson miyasi to'qimalarida kriptik circRNA'larning oshishini qo'shimcha ravishda tasdiqladilar. Nazorat namunalarida signallar deyarli sezilmadi, aksincha ALS/FTD miyalarida aniq BaseScope signallari kuzatildi (4e-rasm, strelkalar). Miqdoriy tahlil kasallik namunalarida ikkala maqsadli circRNA uchun nuqtalar (puncta) sonining nazoratga nisbatan sezilarli darajada oshganini ko'rsatdi (4e-rasm), bu ALS/FTD da kriptik circRNA'larning ishonchli oshishini yana bir bor tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot insonning postmortem to'qimalarida bajarilgan bo'lib, u patologiyaning oxirgi bosqichlarini aks ettiradi va sabab-oqibat bog'liqligini baholashda ehtiyotkorlikni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Xulosa qilib aytganda, ushbu natijalar TDP-43 proteopatiyasiga ega inson postmortem miya to'qimalarida kriptik circRNA'lar oshganini va kasallikka xos, ba'zi hollarda esa kasallik uchun selektiv bo'lgan ekspressiya naqshlarini namoyish etishini isbotlaydi.&lt;/p&gt;\n&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;h4 id=\"tdp-43-oqsili-tomonidan-halqasimon-rnklar-hosil-bolishining-regulyatsiyasi\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#tdp-43-oqsili-tomonidan-halqasimon-rnklar-hosil-bolishining-regulyatsiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TDP-43 oqsili tomonidan halqasimon RNKlar hosil bo'lishining regulyatsiyasi&lt;/span&gt;&lt;/a&gt;TDP-43 oqsili tomonidan halqasimon RNKlar hosil bo'lishining regulyatsiyasi&lt;/h4&gt;\n&lt;p&gt;Ushbu tadqiqotda biz TDP-43 oqsilining teskari сплайсингni (back-splicing) boshqarishdagi yangi vazifasini aniqladik va TDP-43 bog'lanishining yo'qolishi kriptik circRNKlar deb ataluvchi alohida turdagi halqasimon RNKларning paydo bo'lishiga olib kelishini ko'rsatdik. TDP-43 odatdagi chiziqli сплайсинг regulyatori sifatida yaxshi ma'lum bo'lsa-da, bizning natijalarimiz bu oqsil halqasimon RNK biogenezini ham cheklashini ko'rsatib, ushbu tushunchani kengaytiradi (5-rasm). Shunday qilib, bu TDP-43 proteinopatiyasini barqaror, kodlashmaydigan RNK turlarining sintezi bilan bog'laydi.&lt;/p&gt;\n&lt;p&gt;Normal sharoitda TDP-43 kriptik сплайсинг saytlari yaqiniga birikib, kriptik eksonlarning (CE) qo'shilishini bostiradi. TDP-43 yo'qolganda, bu hududlar notekis сплайсинг saytlarini tanlashga imkon beradi, bu esa CE ning chiziqli mRNKlar tarkibiga kirishiga olib keladi. Ushbu repressiyadan xalos bo'lgan сплайсинг saytlarining bir qismi teskari сплайсинг jarayoniga uchrab, CE ning halqasimon RNKlar tarkibiga kirishini ta'minlaydi. Ayrim kriptik circRNKlar ham kriptik, ham kanonik eksonlarni o'z ichiga oladi, boshqalari esa butunlay intronlardan kelib chiqqan kriptik ketma-ketliklardan tashkil topgan. Ko'tarilgan circRNKlarning asosiy qismi faqat kanonik eksonlardan iborat. Ushbu circRNKlarning ba'zilari mos keladigan chiziqli transkriptlardagi sezilarli o'zgarishlardan qat'i nazar hosil bo'lsa, boshqalari yaqin atrofdagi muqobil сплайсинг hodisalari bilan bog'liq. Ularning ayrimlari boshlang'ich darajada aniqlanib, TDP-43 kamayishi bilan yanada oshsa, boshqalari TDP-43 yo'qolganidan keyin de novo paydo bo'ladi. Ushbu kuzatishlar birgalikda TDP-43 ham kriptik, ham kanonik eksonlarda halqasimon RNK biogenezini bostirishini ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Teskari сплайсинг (back-splicing) — bu 3'-uchdagi сплайсинг sayti bir xil yoki yuqoridagi eksonning 5'-uchidagi akseptor sayti bilan \"teskari\" yo'nalishda birikib, halqasimon RNK hosil qiladigan jarayon.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;circRNK kuchayishini va halqasimon hamda chiziqli kriptik сплайсинг o'rtasidagi afzallikni boshqaruvchi omillar hozircha noma'lumligicha qolmoqda. Сплайсинг sayti kuchi, intron arxitekturasi, RNK ikkilamchi tuzilishi, transkripsiya kinetikasi va qo'shimcha RNK bog'lovchi oqsillar kabi xususiyatlar bunga ta'sir qilishi mumkin.&lt;/p&gt;\n&lt;h4 id=\"kriptik-circrnklarning-molekulyar-turgunligi-va-ularning-biomarker-sifatidagi-salohiyati\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#kriptik-circrnklarning-molekulyar-turgunligi-va-ularning-biomarker-sifatidagi-salohiyati\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kriptik circRNKlarning molekulyar turg'unligi va ularning biomarker sifatidagi salohiyati&lt;/span&gt;&lt;/a&gt;Kriptik circRNKlarning molekulyar turg'unligi va ularning biomarker sifatidagi salohiyati&lt;/h4&gt;\n&lt;p&gt;Biogenezidan tashqari, kriptik circRNKlar ularning saqlanib qolishini ta'minlovchi molekulyar xususiyatlarga ega. CE ni o'z ichiga olgan RNK izoformalari uchun chiziqli transkriptlar ko'pincha NMD va tegishli RNK sifatini nazorat qilish yo'llari orqali parchalanib, ularning to'planishini cheklaydi, holbuki kriptik circRNKlar odatda NMD vositasidagi parchalanishga uchramaydi. circRNKlarning eksonukleolitik parchalanishga nisbatan tabiiy chidamliligi bilan birgalikda bu xususiyatlar kriptik circRNKlarning saqlanib qolishi va сплайсинг buzilishining uzoq muddatli molekulyar ko'rsatkichlari sifatida to'planishiga imkon beradi. Shuningdek, circRNKlar hujayradan tashqari pufakchalarga, jumladan ekzosomalarga ustuvor ravishda o'ralishi ko'rsatilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TDP-43 oqsilining funksiyasi yo'qolishi NMD orqali parchalanmaydigan va patologiyaning ishonchli markeri sifatida to'planadigan barqaror kriptik halqasimon RNKlarning hosil bo'lishini faollashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kriptik circRNKlarning inson o'limidan keyingi miya to'qimalarida aniqlanishi ularning TDP-43 proteinopatiyasi bilan bog'liq neyrodegenerativ kasalliklarga aloqadorligini tasdiqlaydi. Biz kasallikka xos ekspressiya naqshlarini kuzatdik, bunda circADGRL3 va circUNC13A ALS va FTD da afzalroq oshgan bo'lsa, circZNF566, circDIP2C va circNCOR2 Altsgeymer kasalligida yaqqolroq oshishini ko'rsatdi. Bu farqlar kasalliklar bo'ylab TDP-43 patologiyasining taqsimlanishi, vaqti yoki kofaktorlaridagi turlicha xususiyatlarni aks ettirishi mumkin va turli xil kriptik circRNKlar TDP-43 funksiyasining buzilishining turli ko'rinishlarini qamrab olishini bildiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar o'limdan keyingi to'qimalar tahliliga asoslangan bo'lib, circRNKlarni diagnostika va prognoz uchun qulay biomarkerlar sifatida qo'llash imkoniyatini aniqlash uchun biologik suyuqlik namunalarini keng ko'lamli o'rganish talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu topilmalar birgalikda TDP-43 ga bog'liq bo'lgan RNK regulyatsiyasining doirasini teskari сплайсингgacha kengaytiradi va inson neyrodegeneratsiyasida TDP-43 funksiyasining yo'qolishining barqaror molekulyar oqibatlari sifatida kriptik circRNKlarni aniqlaydi.&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"plazmidalar\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#plazmidalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Plazmidalar&lt;/span&gt;&lt;/a&gt;Plazmidalar&lt;/h4&gt;\n&lt;p&gt;Yo‘naltiruvchi RNKlar (sgRNA) pU6-sgRNA EF1α-puro-T2A-BFP vektoriga klonlandi. Quyidagi ketma-ketliklar ishlatildi: nazorat uchun GGACTAAGCGCAAGCACCTA va TDP-43 uchun GGCCCGCGCGTGCCAGCCGA.&lt;/p&gt;\n&lt;p&gt;Halqasimon RNKlarni (circRNA) tasdiqlash uchun divergent praymerlar (SN4-jadval) va 32 tsiklli PZR yordamida cDNA kuchaytirildi. PZR mahsulotlari 2,5% li agaroz gelida ajratildi, kerakli o‘lchamdagi tasmalar kesib olindi va tozalandi. Fragmentlar Zero Blunt TOPO PCR Cloning Kit yordamida plazmidalarga klonlandi va Sanger usuli bilan sekvenlash qilindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sanger sekvenlashi — DNK ketma-ketligini aniqlashning klassik usuli bo‘lib, nukleotidlarning aniq tartibini o‘qish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"hujayra-kulturalari-va-transfeksiya\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#hujayra-kulturalari-va-transfeksiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hujayra kulturalari va transfeksiya&lt;/span&gt;&lt;/a&gt;Hujayra kulturalari va transfeksiya&lt;/h4&gt;\n&lt;p&gt;HEK293T hujayralari 10% FBS, 100 U/ml penitsillin va 100 mkg/ml streptomitsin qo‘shilgan DMEM muhitida 37°C va 5% CO₂ sharoitida o‘stirildi. Hujayralar sgRNA konstruksiyalarini lentiviral qadoqlash uchun ishlatildi.&lt;/p&gt;\n&lt;h4 id=\"inson-ipsklari-va-ipskdan-olingan-neyronlar\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#inson-ipsklari-va-ipskdan-olingan-neyronlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Inson iPSKlari va iPSKdan olingan neyronlar&lt;/span&gt;&lt;/a&gt;Inson iPSKlari va iPSKdan olingan neyronlar&lt;/h4&gt;\n&lt;p&gt;iPSKlarni neyronlarga (i3Neurons) differensiatsiyasi dCas9 va doksitsiklin bilan induksiyalanuvchi mNGN2 ekspressiyasi orqali amalga oshirildi. Hujayralar Matrigel qoplamali planshetlarda Essential 8 muhitida saqlandi. Differensiatsiya N2 muhitida 3 kun davomida doksitsiklin bilan boshlandi, so‘ngra hujayralar poli-L-ornitin qoplamali planshetlarga BrainPhys muhitiga (B27, NT-3, BDNF, laminin va doksitsiklin bilan) ko‘chirildi. Neyronlar 14-kuni yig‘ib olindi.&lt;/p&gt;\n&lt;p&gt;ARTR-seq tajribalari uchun PiggyBac-TO-hNGN2 liniyasi ishlatildi. Transfeksiya va puromitsin bilan seleksiyadan so‘ng, proliferatsiyalanuvchi hujayralarni yo‘qotish uchun 5-ftor-2'-dezoksiuridin va uridin qo‘shildi. BrainPhys muhitiga GDNF (1 mkg/ml) qo‘shildi va 14-kuni yig‘ib olindi.&lt;/p&gt;\n&lt;h4 id=\"neyronlarni-qayta-ishlash-va-tahlil-qilish\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#neyronlarni-qayta-ishlash-va-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Neyronlarni qayta ishlash va tahlil qilish&lt;/span&gt;&lt;/a&gt;Neyronlarni qayta ishlash va tahlil qilish&lt;/h4&gt;\n&lt;p&gt;NMDni ingibitsiya qilish uchun neyronlar 24 soat davomida 0,5 mkm hSMG1 ingibitori bilan ishlandi (nazorat — DMSO). Sitoplazmatik va yadroviy fraksiyalarni ajratish uchun NP-40 lizis buferi ishlatildi. 3000 aylanma/daq (4°C, 7 daqiqa) tezlikda sentrifugadan so‘ng, supernatant sitoplazmatik fraksiya sifatida olindi, yadroviy cho‘kma esa RNK ajratishdan oldin EDTA buferi bilan uch marta yuvildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;NMD (nonsense-mediated mRNA decay) — hujayradagi xato mRNK molekulalarini aniqlab, ularni yo‘q qiluvchi nazorat mexanizmidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"inson-miya-toqimalari\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#inson-miya-toqimalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Inson miya to‘qimalari&lt;/span&gt;&lt;/a&gt;Inson miya to‘qimalari&lt;/h4&gt;\n&lt;p&gt;Muzlatilgan va fiksatsiyalangan (FFPE) miya to‘qimalari Johns Hopkins Brain Resource Center'dan olindi. Muzlatilgan namunalar (50 mg) proteaza va fosfataza ingibitorlari bo‘lgan buferda gomogenizatsiya qilindi va RNK ajratish uchun ishlatildi.&lt;/p&gt;\n&lt;h4 id=\"rna-extraction,-rt-pcr-and-rt-qpcr\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#rna-extraction,-rt-pcr-and-rt-qpcr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RNA extraction, RT-PCR and RT-qPCR&lt;/span&gt;&lt;/a&gt;RNA extraction, RT-PCR and RT-qPCR&lt;/h4&gt;\n&lt;p&gt;Umumiy RNK yetishtirilgan hujayralardan va insonning postmortem to‘qimalaridan ishlab chiqaruvchining ko‘rsatmalariga muvofiq TRIzol Reagent yordamida ajratib olindi. Komplementar DNK (kDNK) HiScript III RT SuperMix for qPCR to‘plami yordamida sintez qilindi. RNK yarim yemirilish davri, subparda fraksiyalash va RNK to‘planishi tajribalari uchun teskari transkripsiyadan oldin har bir normallashtirilgan RNK namunasiga teng miqdordagi CLuc RNA spike-in nazorati qo‘shildi va keyinchalik tashqi mos yozuv sifatida ishlatildi. Yarim miqdoriy ПСР (PCR) сплайсинг o‘zgarishlarini baholash uchun 30–33 marta ko‘paytirish sikllari bilan 2× Rapid Taq Master Mix yordamida bajarildi.&lt;/p&gt;\n&lt;p&gt;PCR mahsulotlari 2.5% li agaroza gellarida ajratildi va ChemiDoc Imaging System yordamida tasvirga olindi, nisbiy tarmoq intensivligi Image Lab dasturi orqali fonni ayirib tashlagan holda aniqlandi. Ekzonlarning qo‘shilish foizlari (PSI) uzun va qisqaroq izoformali PCR mahsulotlarining nisbiy intensivligiga asoslanib PSI = long / (long + short) formulasi bo‘yicha hisoblandi. Miqdoriy PCR har bir kDNK namunasi uchun texnik dublikatlarda Taq Pro Universal SYBR qPCR Master Mix yordamida QuantStudio 6 va QuantStudio 3 Flex Real-Time PCR Systems qurilmalarida bajarildi.&lt;/p&gt;\n&lt;p&gt;Nisbiy ekspresiya darajalari ΔΔCt usuli yordamida aniqlandi. CLuc spike-in RNK yarim yemirilish, fraksiyalash va to‘planish tajribalarida, GAPDH — NMD ingibirlash tajribalarida, va HPRT1 — boshqa barcha qPCR tahlillari uchun mos yozuv gen sifatida foydalanildi. Aniq bo‘lmagan Ct qiymatlari uchun quyi oqim statistik tahlili va vizualizatsiya maqsadida 40 qiymati tayinlandi. Primer ketma-ketliklari Таблица S4 da keltirilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Miqdoriy real vaqt rejimidagi PCR (qPCR) ma'lum bir RNK molekulalarining sonini o'lchashga imkon beradi, ΔΔCt usuli esa genlar ekspresiyasining nisbiy o'zgarishini hisoblaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rna-half-life-measurement\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#rna-half-life-measurement\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RNA half-life measurement&lt;/span&gt;&lt;/a&gt;RNA half-life measurement&lt;/h4&gt;\n&lt;p&gt;Neyronlar (i3Neurons) 3 µg/mL konsentratsiyadagi actinomycin D bilan ishlov berildi va 14-kuni 0, 4, 8, 12 va 24 soatlarda yigib olindi. Umumiy RNK har bir vaqt nuqtasida ajratib olindi va yuqorida tavsiflanganidek RT-qPCR yordamida tahlil qilindi. RNK nisbiy miqdori har bir transkript uchun 0-soatlik vaqt nuqtasiga nisbatan normallashtirildi. Transkriptlarning yarim yemirilish davri GraphPad Prism dasturida bir fazali eksponensial yemirilish modeli yordamida nochiziqli regressiya orqali baholandi.&lt;/p&gt;\n&lt;p&gt;Chiziqli mRNKlar uchun yarim yemirilish davri muvaffaqiyatli hisoblandi, biroq halqali RNKlar (circRNAs) uchun miqdor 24 soatlik kuzatuv davomida deyarli o‘zgarmadi va modelga mos kelmadi, shuning uchun ularning yarim yemirilish davri 24 soatdan oshadi deb baholandi.&lt;/p&gt;\n&lt;h4 id=\"circrna-related-rna-seq-library-preparation\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#circrna-related-rna-seq-library-preparation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;circRNA-related RNA-seq library preparation&lt;/span&gt;&lt;/a&gt;circRNA-related RNA-seq library preparation&lt;/h4&gt;\n&lt;p&gt;Har bir namuna uchun i3Neurons'dan ajratib olingan 5 µg umumiy RNK circRNK boyitilgan kutubxonani tayyorlash uchun ishlatildi. Dastlab poly(A)+ mRNK NEBNext Poly(A) mRNA Magnetic Isolation Module yordamida ajratib olindi. Poly(A)(-) fraksiyasi oligo(dT)₂₅ munchoqlaridan oqim sifatida yig‘ildi va Quick-RNA Microprep Kit yordamida tozalandi. Tozalangan poly(A)(-) RNK 37 °C da 20 minut davomida 5 birlik RNase R bilan ishlov berildi. Fermentativ parchalanishdan so‘ng RNK TRIzol yordamida tiklandi va Qubit fluorometri yordamida miqdori aniqlandi.&lt;/p&gt;\n&lt;p&gt;Quyi bosqichlar uchun 500 ng poly(A)(-)/RNase R(+) RNK Ribo-off rRNA Depletion Kit yordamida ribosomali RNKdan tozalandi. Olingan circRNK boyitilgan RNK darhol VAHTS Universal V10 RNA-seq Library Prep Kit for Illumina to‘plami yordamida RNA-seq kutubxonasini tayyorlashga ishlatildi. Shu bilan birga, mos keladigan poly(A)+ mRNK fraksiyasining 50 ng qismi ham xuddi shu to‘plam yordamida kutubxona qurish uchun ishlatildi. Har bir guruh uchun 3 tadan mustaqil biologik takroriy namunalar tayyorlandi. Kutubxonalar Illumina NovaSeq X Plus platformasida 150 juft asosli o‘qishlarni hosil qilish uchun sekven qilindi.&lt;/p&gt;\n&lt;h4 id=\"rna-seq-analysis-genome-reference\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#rna-seq-analysis-genome-reference\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RNA-seq analysis Genome reference&lt;/span&gt;&lt;/a&gt;RNA-seq analysis Genome reference&lt;/h4&gt;\n&lt;p&gt;Barcha tahlillar uchun Insonning etalon genomi sifatida GRCh38.p14 (Ensembl release 112) va GENCODE v32 gen annotatsiyasi ishlatildi. Ribosomali RNKlar (rRNK), shu jumladan 28S, 18S, 5.8S va 5S rRNK uchun etalon ketma-ketliklar NCBI bazasidan yuklab olindi.&lt;/p&gt;\n&lt;h4 id=\"gene-expression-analysis\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#gene-expression-analysis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gene expression analysis&lt;/span&gt;&lt;/a&gt;Gene expression analysis&lt;/h4&gt;\n&lt;p&gt;Poly(A) kutubxonasining xom o‘qishlari Cutadapt 5.06 versiyasi yordamida kesildi va Phred Score ≥ 33 sifati bo‘yicha filtrlindi. Qayta ishlangan o‘qishlar HISAT2 2.2.1 versiyasi yordamida joylashtirildi, Picard MarkDuplicates 3.3.0 yordamida dublikatlardan tozalandi va FeatureCounts 2.0.8 yordamida miqdori aniqlandi. Yuqori darajada ifodalangan genlar (barcha namunalarda ≥ 10 o‘qish) differensial ekspresiya tahlili uchun ishlatildi. Filtrlangan o‘qishlar DESeq2 (1.46.0 versiyasi) yordamida hajm omili normallashtirishi bilan normallashtirildi.&lt;/p&gt;\n&lt;p&gt;Differensial ekspresiya tahlili Log2FoldChange va p-adjusted qiymatlari yordamida amalga oshirildi (/LFC/ ≥ 1, p-adjusted &amp;lt; 0.05). Xaritaga tushirilgan o‘qishlar deepTools bamCoverage 3.5.6 dasturi yordamida vizualizatsiya qilindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sekvenlash ma'lumotlari sifat nazoratidan o'tkazilib, mos yozuv genaratsiyasiga moslashtirilgach, genlararo farqlarni aniqlash uchun DESeq2 kabi kuchli bioinformatik dasturlar ishlatiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"circrnalarni-aniqlash-va-tahlil-qilish\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#circrnalarni-aniqlash-va-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;circRNAlarni aniqlash va tahlil qilish&lt;/span&gt;&lt;/a&gt;circRNAlarni aniqlash va tahlil qilish&lt;/h4&gt;\n&lt;p&gt;Poly(A)(–)/RNase R(+)/rRNA(–) kutubxonalarining xom o‘qishlari Cutadapt (v5.063) yordamida qirqildi va sifat bo‘yicha (Phred Score ≥33) filtrlandi. Back-splicing birikmalari (BSJ) CIRI2 dasturi yordamida standart parametrlarda aniqlandi. Differensial ekspressiyani tahlil qilish uchun namunalarning kamida 50% qismida BSJ ≥5 bo‘lgan yuqori ishonchli circRNA'lar tanlab olindi. Filtrlangan BSJ hisoblari DESeq2 (v1.46.0) yordamida o‘lcham omili (size factor) bo‘yicha normallashtirildi. Differensial ekspressiya uchun /LFC/ ≥0.5 va p &amp;lt; 0.05 chegaralari qo‘llanildi. circRNA tarkibidagi chiziqli kriptik birikmalar LeafCutter (v0.2.9) yordamida bam-fayllardan aniqlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CIRI2 — bu circRNA'larning o‘ziga xos «teskari» splaysing joylarini aniqlash uchun mo‘ljallangan bioinformatik vosita bo‘lib, u ekzonlarning g‘ayritabiiy ulanishini aniqlashga asoslangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"alternativ-splaysing-tahlili\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#alternativ-splaysing-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Alternativ splaysing tahlili&lt;/span&gt;&lt;/a&gt;Alternativ splaysing tahlili&lt;/h4&gt;\n&lt;p&gt;NMD (nonsense-mediated decay) ingibitsiyasi bilan yoki usiz sgCON va sgTARDBP i3Neurons hujayralaridan olingan RNA-seq ma’lumotlari ishlatildi. Alternativ splaysing hodisalari rMATS (v4.3.0) yordamida --novelSS, --variable-read-length, --individual-counts va -t paired parametrlari bilan aniqlandi. Birikma qamrovi ≥10, /ΔPSI/ ≥ 0.1 va FDR &amp;lt; 0.05 bo‘lgan hodisalar saqlab qolindi. PSI qiymatlari nazorat sharoitlari (max_PSI_control) va TDP-43 yetishmovchiligi hamda NMD ingibitsiyasi (max_PSI_TDP_NMD) uchun maksimal ko‘rsatkichlar sifatida belgilandi.&lt;/p&gt;\n&lt;p&gt;Differensial splaysing dPSI_TDPvsCTRL sifatida hisoblandi va hodisalar /ΔPSI/ &amp;gt; 0.1 bo‘yicha tasniflandi. sgTDP guruhida yo‘q bo‘lgan hodisalar “NMD” deb belgilandi. Hodisalar BED formatiga o‘tkazildi va BEDTools yordamida circRNA back-splice birikmalari bilan kesishdi. Aniqlikni oshirish uchun splaysing chegaralarining aniq mos kelishi talab qilindi.&lt;/p&gt;\n&lt;h4 id=\"artr-seq-kutubxonasini-tayyorlash\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#artr-seq-kutubxonasini-tayyorlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ARTR-seq kutubxonasini tayyorlash&lt;/span&gt;&lt;/a&gt;ARTR-seq kutubxonasini tayyorlash&lt;/h4&gt;\n&lt;p&gt;ARTR-seq usuli oldin tavsiflangan tartibda, kichik o‘zgarishlar bilan bajarildi. Hujayralar 1.5% paraformaldegid (10 daqiqa) bilan fiksatsiya qilindi, 125 mM glitsin (1 daqiqa) bilan to‘xtatildi, 0.5% Triton X-100 (10 daqiqa) bilan o‘tkazuvchan qilindi va RNase ingibitori qo‘shilgan 0.1% BSA bilan bloklandi. TDP-43 oqsili antitanalar (Abnova, 2E2-D3, 1:500) yordamida nishonlandi, so‘ngra Alexa Fluor 546 ikkilamchi antitanasi va pAG-RTase bilan inkubatsiya qilindi. Yadroviy nazorat uchun Hoechst bo‘yog‘i ishlatildi. Teskari transkripsiya in situ adapter-RT praymeri va biotin-16-dUTP/dCTP nukleotid aralashmasi yordamida amalga oshirildi. Reaksiya 20 mM EDTA va 10 mM EGTA bilan to‘xtatilgach, proteinaza K bilan ishlov berildi, fenol-xloroform ekstraktsiyasi va etanol cho‘ktirish orqali tiklandi. RNase H, A va T1 bilan ishlov berilgandan so‘ng, biotinlangan kDNK streptavidin boncuklari yordamida boyitildi. 3' kDNK adapteri ligatsiya qilindi, kutubxonalar PCR orqali kuchaytirildi va 180–300 bp fragmentlar tanlab olindi. Sekvenirlash Illumina NovaSeq 6000 platformasida (150 bp, juft o‘qish) uchta biologik takror bilan amalga oshirildi.&lt;/p&gt;\n&lt;h4 id=\"artr-seq-tahlili\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#artr-seq-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ARTR-seq tahlili&lt;/span&gt;&lt;/a&gt;ARTR-seq tahlili&lt;/h4&gt;\n&lt;p&gt;O‘qilgan ketma-ketliklardagi adapterlar Cutadapt (5.063 versiyasi) yordamida --nextseq-trim=20, --action=trim, -m 20, -e 0.15, -n 3, -O 5 parametrlari bilan olib tashlandi. R1 ning 5′ uchidagi va R2 ning 3′ uchidagi 8 nt uzunlikdagi noyob molekulyar identifikatorlar (UMI) olib tashlandi va R1 dan olingan UMI keyingi deduplikatsiya uchun o‘qish nomiga qo‘shildi. Tasodifiy praymerlardagi nomukammal juft ketma-ketliklar tufayli yuzaga keladigan xatolarni kamaytirish uchun R1 va R2 ning 3′ va 5′ uchlaridan qo‘shimcha 4 nt olib tashlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;UMI (noyob molekulyar identifikator) — bu RNK yoki DNK molekulalarini amplifikatsiyadan oldin belgilash uchun ishlatiladigan qisqa nukleotidlar ketma-ketligi bo‘lib, u haqiqiy biologik nusxalarni PCR jarayonida hosil bo‘lgan artefaktlardan ajratishga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ribosomal RNK (rRNA) ifloslanishini yo‘qotish uchun o‘qilgan ketma-ketliklar Bowtie2 (v.2.4.4) yordamida rRNA ketma-ketliklariga kartalashtirildi va mos kelganlari chiqarib tashlandi. Qolganlari STAR (v2.7.11b) dasturi yordamida genomga kartalashtirildi. Noyob kartalashtirilgan o‘qishlar UMICollapse yordamida deduplikatsiya qilindi. Vizualizatsiya uchun BAM fayllari deepTools (v.3.5.5) yordamida bigWig formatiga o‘tkazildi va ketma-ketlik chuqurligi bo‘yicha normallashtirildi. ARTR-seq profillari computeMatrix va ggplot2 yordamida hisoblab chiqildi.&lt;/p&gt;\n&lt;p&gt;Cho‘qqilarni aniqlash (peak calling) uchun o‘qishlar musbat va manfiy zanjirlarga ajratildi va BEDTools yordamida BED formatiga o‘tkazildi. MACS3 dasturi --keep-dup -p BEDPE parametrlari bilan ishlatildi. Signalning boyishi (fold enrichment) va P-qiymatlari Puasson taqsimoti asosida hisoblanib, Benjamini-Xoxberg tuzatishi qo‘llanildi. Har bir zanjir uchun cho‘qqilar alohida aniqlandi va keyinchalik birlashtirildi.&lt;/p&gt;\n&lt;h4 id=\"oqsil-ekstraktsiyasi-va-immunoblotting\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#oqsil-ekstraktsiyasi-va-immunoblotting\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Oqsil ekstraktsiyasi va immunoblotting&lt;/span&gt;&lt;/a&gt;Oqsil ekstraktsiyasi va immunoblotting&lt;/h4&gt;\n&lt;p&gt;i3Neurons hujayralari DPBS bilan yuvilib, sentrifuga qilindi va proteaza ingibitorlari qo‘shilgan RIPA buferida lizis qilindi. 12 000 × g tezlikda 20 daqiqa davomida 4°C haroratda sentrifuga qilingandan so‘ng, supernatant yig‘ildi va BCA usuli bilan oqsil konsentratsiyasi aniqlandi. 5 mкг oqsil 5× yuklash buferi bilan aralashtirilib, 90°C da 2 daqiqa qizdirildi va 10% SDS-PAGE gelida ajratildi.&lt;/p&gt;\n&lt;p&gt;Oqsillar nitrotsellyuloza membranasiga o‘tkazildi. Membranalar 5% sutli TBST eritmasida bloklandi va birlamchi antitanachalar (anti-TDP-43, 1:1000; anti-GAPDH, 1:1000) bilan 4°C da bir kecha davomida inkubatsiya qilindi. Keyingi kuni membranalar yuvilib, ikkilamchi antitanachalar (1:10 000) bilan 1 soat davomida xona haroratida inkubatsiya qilindi. Signal ECL reagentlari va Bio-Rad ChemiDoc tizimi yordamida aniqlandi.&lt;/p&gt;\n&lt;h4 id=\"basescope-tahlili\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#basescope-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;BaseScope tahlili&lt;/span&gt;&lt;/a&gt;BaseScope tahlili&lt;/h4&gt;\n&lt;p&gt;circADGRL3 va circZNF566 molekulalarini aniqlash uchun BaseScope v2 Detection Reagent Kit–RED tizimidan foydalanildi. Ushbu maqsad uchun maxsus 1ZZ zondlari ishlab chiqilgan bo'lib, ular halqali RNK (circRNA)larning teskari splicing (back-splice junction) ketma-ketligiga yo'naltirilgan. Tadqiqotda formalin bilan fiksatsiya qilingan va ksilol-parafin (FFPE) muhitiga joylashtirilgan inson miyasi postmortal kesmalari ishlatildi. Tayyorgarlik jarayoni ksilolda deparafinatsiya va bosqichma-bosqich spirtli eritmalarda regidratatsiyani o'z ichiga oldi. To'qimalar vodorod peroksid bilan ishlov berildi, so'ngra ~99 °C haroratda 15 daqiqa davomida maxsus reagentda antigenlarni ochish (target retrieval) jarayoni amalga oshirildi. To'qimalar o'tkazuvchanligini oshirish uchun namunalar 30 daqiqa davomida xona haroratida Protease III bilan inkubatsiya qilindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BaseScope usuli — bu in situ gibridizatsiyaning yuqori sezgir turi bo'lib, u qisqa zondlar yordamida alohida RNK molekulalarini, shu jumladan halqali RNK shakllarini vizualizatsiya qilish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Maqsadli va nazorat (ijobiy va salbiy) zondlarining gibridizatsiyasi 40 °C haroratda 2 soat davomida nam kamerada o'tkazildi. Signalni kuchaytirish (AMP1–AMP8 bosqichlari) Fast RED xromogen substrati yordamida yakunlandi. Kesmalar gematoksilin bilan bo'yaldi va VectaMount muhiti yordamida yopildi. Vizualizatsiya 60× kattalashtirishda yorug'lik mikroskopi yordamida amalga oshirildi, bunda har bir RNK molekulasi alohida qizil nuqta sifatida namoyon bo'ldi.&lt;/p&gt;\n&lt;p&gt;Miqdoriy tahlil har bir kesma uchun kamida 10 ta ko'rish maydonida, jami 100 dan ortiq hujayra hisobga olingan holda bajarildi. Hujayralarning umumiy soni yadro bo'yash orqali aniqlandi, bunda glia hujayralariga xos bo'lgan kichik giperxrom yadroli hujayralar tahlildan chiqarib tashlandi. Qizil nuqtalar soni umumiy hujayralar soniga nisbatan normallashtirildi. Barcha tasvirga olish va hisoblash ishlari ko'r-ko'rona (blinded) usulda amalga oshirildi.&lt;/p&gt;\n&lt;h4 id=\"statistik-tahlil\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#statistik-tahlil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Statistik tahlil&lt;/span&gt;&lt;/a&gt;Statistik tahlil&lt;/h4&gt;\n&lt;p&gt;Ma'lumotlarni qayta ishlash va statistik ahamiyatlilikni baholash uchun GraphPad Prism va RStudio dasturlaridan foydalanildi. Statistik ahamiyatlilik chegarasi p &amp;lt; 0,05 deb belgilandi. Ahamiyatlilik darajalari *P &amp;lt; 0,05, **P &amp;lt; 0,01, ***P &amp;lt; 0,001 va ****P &amp;lt; 0,0001 ko'rinishida ifodalandi. Oqsil namunalarini tahlil qilishda nazorat sifatida GAPDH ishlatildi. Barcha tajribalar n=3 biologik takroriylik bilan amalga oshirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Biologik takroriylik (biological replicate) — bu mustaqil biologik manbalardan (masalan, turli hujayra kulturalari yoki hayvonlar) olingan namunalar bo'lib, ular natijalarning takrorlanuvchanligini baholashga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;circRNA boyitilgan RNK-seq tahlili 7689 ta transkriptni aniqladi. /LFC/ ≥ 0,5 va p &amp;lt; 0,05 mezonlari bo'yicha filtrlashdan so'ng, TDP-43 kamayishi natijasida 585 ta yuqori (upregulated) va 379 ta past (downregulated) ifodalangan circRNA aniqlandi (Rasm b). Ma'lumotlar vulqon diagrammasida aks ettirilgan bo'lib, -log10(p-value) qiymatlari 40 dan yuqori bo'lganlari yuqori chegara bilan cheklangan. Issiqlik xaritasi (Rasm c) eng ko'p ifodalangan 50 ta circRNA ni ko'rsatadi; bir xil gen-xo'jayindan kelib chiqqan circRNA izoformalari uchun raqamlash yuqoridan pastga qarab amalga oshirilgan. Qizil rang bilan belgilangan de novo circRNA lar nazorat namunalarida (sgCON) nol ifodalanish darajasiga ega bo'lgan.&lt;/p&gt;\n&lt;p&gt;Natijalarni tasdiqlash uchun circRNA boyitilmagan umumiy RNK ustida RT-qPCR o'tkazildi (Rasm e–h). Ushbu ma'lumotlar uchun statistik ahamiyatlilik ikki tomonlama juftlanmagan t-test yordamida hisoblandi. Chakka qobig'i to'qimalarida (nazorat, ALS/FTD, sporadik FTD va AD) ahamiyatlilik ikki tomonlama Mann-Uitni testi yordamida aniqlandi. BaseScope (in situ gibridizatsiya) tajribalarida circADGRL3 va circZNF566 (Rasm e) uchun har bir guruhda (n=3 donor) 100 ta hujayraga to'g'ri keladigan ijobiy signallar soni t-test yordamida baholandi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur-f1.jpg\" alt=\"1-rasm. TDP-43 yo'qolishi kriptik circRNA biogenezini keltirib chiqaradi. a, Differensiatsiyaning 14-kunida i3Neyronlard\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. TDP-43 yo'qolishi kriptik circRNA biogenezini keltirib chiqaradi. a, Differensiatsiyaning 14-kunida i3Neyronlarda sgRNA yordamida TDP-43 nokdaunini ko'rsatuvchi Vestern blot.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur-f3.jpg\" alt=\"3-rasm. Kriptik circRNA'lar barqaror va neyronlarda bosqichma-bosqich to'planadi. a, TDP-43 nokdauni qilingan i3Neyronla\" /&gt;&lt;/p&gt;\n&lt;p&gt;*3-rasm. Kriptik circRNA'lar barqaror va neyronlarda bosqichma-bosqich to'planadi. a, TDP-43 nokdauni qilingan i3Neyronlarda vakillik circRNA'lar va tegishli xost mRNKlarning RNA parchalanish tahlili. RNA darajalari aktinomisin D bilan ishlov berilgandan so'ng ko'rsatilgan vaqt nuqtalarida RT–qPCR yordamida o'lchandi va nazorat RNA spike-in ga normallashtirildi. Barcha vaqt nuqtalari 0-vaqt bilan taqqoslandi. Taxminiy transkript yarim yemirilish davrlari (t₁/₂) ko'rsatilgan. Ma'lumotlar ikkita biologik replikatdan o'rtacha ± SEM sifatida ko'rsatilgan. b, Nazorat va TDP-43 nokdauni qilingan i3Neyronlarda neyron differensiatsiyasi davrida circRNA'lar va tegishli xost mRNKlarning RT–qPCR tahlili. RNA darajalari differensiatsiyadan keyingi ko'rsatilgan kunlarda o'lchandi va differensiatsiyadan keyin barqaror bo'lib qoladigan HPRT1 ga normallashtirildi50. Ma'lumotlar uchta biologik replikatdan o'rtacha ± SEM sifatida ko'rsatilgan. Statistik ahamlilik 15-kunlik namunalar uchun ikki tomonlama juftlashtirilmagan t-testlar yordamida aniqlandi. ns, ahamiyatsiz; &lt;em&gt;P &amp;lt; 0.05, ** P &amp;lt; 0.01. c, TDP-43 nokdauni qilingan i3Neyronlarning sitoplazmatik va yadroviy fraksiyalarida circRNA'lar va tegishli xost mRNKlarning RT–qPCR tahlili. Har bir fraksiyadagi RNA darajalari nazorat RNA spike-in ga normallashtiriladi va umumiy RNAga nisbatan taqdim etiladi. Ma'lumotlar to'rtta biologik replikatdan o'rtacha ± SEM sifatida ko'rsatilgan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur-f4.jpg\" alt=\"4-rasm. Kriptik circRNA'lar patsiyentlarning postmortemin miya to'qimalarida yuqori bo'ladi. a–d, Nerevrologik nazorat (\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm. Kriptik circRNA'lar patsiyentlarning postmortemin miya to'qimalarida yuqori bo'ladi. a–d, Nerevrologik nazorat (n = 15), C9ORF72 bilan bog'liq ALS/FTD (n = 15), sporadik FTD holatlari (n = 5) (a, b) va Altsgeymer kasalligi (AD; n = 8) (c, d) dan olingan vaqtinchalik qobiq to'qimalarida kriptik circRNA'lar (a, c) va liniyali CE o'z ichiga olgan transkriptlarning (b, d) RT–qPCR tahlili. Nisbiy ekspresiya darajalari HPRT1 ga normallashtirilgan holda hisoblangan va log10 shkalasida ko'rsatilgan. Har bir nuqta alohida donorning namunasini bildiradi va gorizontal chiziqlar mediana qiymatlarini ko'rsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur-f5.jpg\" alt=\"5-rasm. TDP-43 yo'qolishi kriptik circRNA biogenezini yuzaga chiqaradi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm. TDP-43 yo'qolishi kriptik circRNA biogenezini yuzaga chiqaradi.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/detail
