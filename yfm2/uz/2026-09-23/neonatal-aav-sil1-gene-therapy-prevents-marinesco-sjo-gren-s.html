            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"187\" cy=\"103\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"493\" cy=\"198\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Gen terapiyasi kam&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;uchraydigan sindromning&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;oldini oldi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-f1.jpg\" alt=\"1-rasm. AAV vositasidagi SIL1 ekspresiyasi PC larda universal yoki tanlab ekspressiya qilinganda woozy sichqonlarida har\" /&gt;&lt;/p&gt;\n&lt;p&gt;*1-rasm. AAV vositasidagi SIL1 ekspresiyasi PC larda universal yoki tanlab ekspressiya qilinganda woozy sichqonlarida harakat faoliyatini va miyachak patologiyasini yaxshilaydi. (A, B) Heterozigotali nazorat (CT) va woozy (wz) sichqonlari guruhlariga icv orqali PBS, AAV-CAG-moSIL1 yoki AAV-L7-6-moSIL1 yuborildi. Hayvonlar osilgan to'sin bo'ylab yurish qobiliyati uchun har haftada sinovdan o'tkazildi. Ma'lumotlar orqa oyoq qadam xatolari sonining (A) va to'sinni kesib o'tish uchun o'rtacha vaqtning (B) o'rtacha ± SEM sifatida keltirilgan. (A) da F(3.543, 31.89) = 17.66, P &amp;lt; 0.0001; (B) da ikki tomonlama takroriy o'lchovli ANOVA (RM ANOVA) bo'yicha F(4.926, 44.34) = 5.775, P = 0.0004; Dunnett post-hoc testi bo'yicha **P &amp;lt; 0.01, **P &amp;lt; 0.05, ****P &amp;lt; 0.0001. (C, D) 9 haftalik CT va woozy sichqonlari miyachak kesmalarida kalbindin (C) yoki CHOP (D) uchun immunohistokimyoviy tahlil. O'lchov chizig'i 200 mkm. (E, F) Miyachak poʻstlogʻida kalbindin-musbat sohani (E) va CHOP-musbat PC larni (F) miqdoriy baholash. Ma'lumotlar o'rtacha ± SEM. (E) da F(2, 10) = 6.648, P = 0.0146; (F) da ikki tomonlama ANOVA bo'yicha F(2, 9) = 33.35, P &amp;lt; 0.0001; Dunnett post-hoc testi bo'yicha *P &amp;lt; 0.05, ***P &amp;lt; 0.001, ***&lt;em&gt;P &amp;lt; 0.0001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Marnesko-Shegren sindromi SIL1 oqsili yetishmovchiligi tufayli yuzaga keladigan va harakat buzilishlari bilan namoyon bo'ladigan og'ir irsiy kasallikdir. Olimlar adeno-assotsiatsiyalangan virus yordamida sog'lom genni markaziy asab tizimiga yetkazish usulini sinab ko'rdi. Bu yondashuv hayvonlarda kasallik alomatlarining oldini olish va hujayralarni himoya qilish imkonini berdi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;AAV-SIL1 terapiyasi sichqonlarda ataksiya rivojlanishining oldini oladi.&lt;/li&gt;\n&lt;li&gt;Muolaja Purkinje hujayralarini degeneratsiyadan saqlab qoladi.&lt;/li&gt;\n&lt;li&gt;Davolash effekti 26 hafta davomida barqaror saqlanib qoldi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Kasallik SIL1 genidagi mutatsiyalar bilan bog'liq bo'lib, bu oqsil endoplazmatik to'r funksiyasini ta'minlaydi. Uning yo'qligi hujayralarda stress keltirib chiqaradi va miyachadagi Purkinje hujayralarining nobud bo'lishiga olib keladi. Oldingi dor vositalari bu jarayonni to'xtata olmagan yoki nojo'ya ta'sirlar keltirib chiqargan.&lt;/p&gt;\n&lt;p&gt;Yangi tajribada SIL1 nuqsoni bo'lgan sichqonlarga hayotining boshida AAV-PHP.eB virusli vektorlari yuborildi. Gen yetkazilishi ataksiya rivojlanishining oldini oldi, hujayra stressi belgilarini kamaytirdi va miyacha tuzilishini saqlab qoldi. Tanlab tiklash ham harakat funksiyasini tiklash uchun yetarli bo'lib chiqdi.&lt;/p&gt;\n&lt;p&gt;Terapevtik samara 26 haftalik kuzatuv davomida saqlanib qoldi. Shuningdek, usul mushak to'qimalarining holatini ham yaxshiladi. Bu yondashuv odamlardagi shu kabi irsiy kasalliklarni davolash uchun asos bo'lishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot faqat sichqon modeli asosida o'tkazilgan bo'lib, natijalarni klinikaga tatbiq etish uchun qo'shimcha xavfsizlik sinovlari zarur.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Marinesco-Sjögren sindromi nodir, erta boshlanadigan ko'p tizimli kasallik bo'lib, u asosan miyacha ataksiyasi va miopatiya bilan tavsiflanadi hamda SIL1 genidagi funksiyani yo'qotuvchi mutatsiyalar natijasida yuzaga keladi. Hozirgi kunda ushbu xastalikka qarshi maxsus davolash usuli mavjud emas. Tadqiqotchilar adeno-assotsiatsiyalangan virus (AAV) yordamida amalga oshiriladigan gen terapiyasi woozy sichqon modeli asosida kasallikning oldini olishi mumkinligini o'rganib chiqishdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Marinesco-Sjögren sindromi SIL1 geni nuqsonlari tufayli kelib chiqadi va davolash usuliga ega emas, shuning uchun olimlar woozy sichqonlarida AAV vektorli gen terapiyasini sinab ko'rishdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;p&gt;Yangi tug'ilgan sichqonlarga umumiy yoki Purkinje hujayralariga xos bo'lgan promotor nazorati ostida SIL1 genini tashiydigan AAV-PHP.eB vektorlarining intrakerebroventrikulyar in'eksiyalari bajarildi. Hayvonlarni kuzatish va ularning holatini baholash 26 hafta davomida olib borildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AAV-PHP.eB vektori — bu terapevtik genetik materialni markaziy asab tizimiga samarali yetkazib berishga qodir bo'lgan sun'iy ravishda yaratilgan virusli tashuvchi vosita.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;p&gt;Platsebo olgan nazorat guruhidagi woozy sichqonlarida miyachadagi Purkinje hujayralarining nobud bo'lishi hamda endoplazmatik retikulum stress yo'llarining faollashuvi bilan bog'liq og'ir harakat buzilishlari kuzatildi. Aksincha, AAV-SIL1 bilan davolash ataksiya rivojlanishining oldini oldi, Purkinje hujayralarini saqlab qoldi va stress yo'llari faollashuvini kamaytirdi. SIL1 ekspresiyasining faqat Purkinje hujayralarida tiklanishi harakat faoliyatini to'liq normallashtirish uchun yetarli bo'lib chiqdi, bu esa kasallik patogenezida aynan ushbu hujayralar disfunksiyasining hal qiluvchi rolini tasdiqlaydi. Terapevtik samaradorlik 26 haftalik kuzatuv davri mobaynida saqlanib qoldi va mushak funksiyasining yaxshilanishi hamda mushak patologiyasining kamayishi bilan birga kechdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tajribalar sichqon modeli (woozy) yordamida o'tkazilgan, shuning uchun klinik amaliyotga joriy etishdan oldin yirikroq organizmlarda qo'shimcha translyatsion tadqiqotlar talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish1\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#kirish1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Marinko-Shegren sindromi (MSS) erta bolalik davrida boshlanadigan va hozirgi kunda davosi mavjud bo'lmagan kam uchraydigan autosomal retsessiv kasallikdir. Tug'ma katarakta, miyachacha atrofiyasi va miopatiya MSS ning asosiy diagnostik belgilaridir. Shuningdek, intellektual buzilishlar, niyat tremori, dizartriya, skelet anomaliyalari, past bo'yli bo'lish, nistagm, strabizm va gipergonadotrop gipogonadizm tez-tez kuzatiladi. Birlamchi alomatlar odatda hayotning dastlabki oylarida paydo bo'ladi, chunki kasallangan chaqaloqlar erta motor ko'nikmalarini o'zlashtira olmaydi. Harakat funksiyasi bolalik davrida yomonlashadi, biroq bir necha yillik progressiyadan so'ng kasallik oldindan aytib bo'lmaydigan yoshda va og'irlik darajasida barqarorlashadi, kutilayotgan umr ko'rish davomiyligi esa normal bo'lib qoladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Marinko-Shegren sindromi katarakta, ataksiya va miopatiya bilan kechuvchi, boshlang'ich yomonlashuvdan so'ng turg'unlashadigan og'ir tug'ma kasallikdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kasallikning erta bosqichida uning rivojlanishini oldini oladigan, kechiktiradigan yoki yumshatadigan chora-tadbirlar motor funksiyasi va hayot sifatiga kuchli hamda uzoq muddatli ta'sir ko'rsatishi mumkin. Taxminan 60% hollarda MSS SIL1 genidagi gomozigotali yoki kompaund-geterozigotali mutatsiyalar natijasida yuzaga keladi, bu esa SIL1 oqsili ekspressiyasi va/yoki funksiyasining yo'qolishiga olib keladi. Sil1 genidagi o'z-o'zidan sodir bo'ladigan mutatsiya, shuningdek, inson kasalligining asosiy jihatlarini, shu jumladan Purkinye hujayralari degeneratsiyasi bilan kechadigan miyachacha ataksiyasi va skelet mushaklari patologiyasini aks ettiruvchi yaxshi o'rganilgan woozy (wz) sichqonlar modelining fenotipiga asos bo'ladi.&lt;/p&gt;\n&lt;p&gt;SIL1 oqsili endoplazmatik retikulumda (ER) oqsillarning to'g'ri o'ralishini boshqaruvchi asosiy chaperon — BiP uchun nukleotid almashinuv omili sifatida ishlaydi. BiP chaperon faolligi ATP bog'lanishi va gidrolizi sikli bilan tartibga solinadi. SIL1 BiP da ADP-ATP almashinuvini osonlashtiradi va substratning samarali ajralishini ta'minlaydi. SIL1 yetishmovchiligi nukleotid almashinuvining buzilishiga, BiP va mijoz oqsillarning uzoq vaqt bog'lanib qolishiga, o'ralmagan oqsillarning to'planishiga, ER stressiga va o'ralmagan oqsillar javobining (UPR) faollashishiga olib keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;O'ralmagan oqsillar javobi (UPR) — bu endoplazmatik retikulumda nuqsonli oqsillar to'planganda hujayrani himoya qiluvchi murakkab signal yo'li bo'lib, surunkali faollashganda apoptozga olib kelishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;UPR — bu ER proteostazini tiklashga qaratilgan murakkab signal yo'lidir. PERK kinazasi UPR ning uchta asosiy effektoridan biri bo'lib, qolgan ikkitasi ATF6 va IRE1 hisoblanadi. Faollashgan PERK eukaryotik translyatsiyani boshlash omili 2 ning alfa kichik birligini (eIF2α) fosforillaydi. Bu mРНК translyatsiyasini to'xtatib, umumiy oqsil sintezini kamaytiradi. Biroq, ATF4 translyatsiya omili kabi ba'zi maxsus mРНК lar afzalroq tarjima qilinadi. Agar hujayralar o'ralmagan oqsillar yukini bajara olmasa, uzoq davom etadigan ATF4 sintezi CHOP ni qo'zg'atib, apoptozga olib keladi. Bu yo'l sinapslarni saqlash va omon qolish uchun doimiy oqsil sinteziga tayanadigan neyronlar uchun ayniqsa zararli.&lt;/p&gt;\n&lt;p&gt;Mualliflar ilgari PERK/eIF2α signallari woozy sichqonlarida Purkinye hujayralari degeneratsiyasi va ataksiyasidan oldin sodir bo'lishini hamda miopatiya boshlanishi bilan bir vaqtda skelet mushaklarida faollashishini ko'rsatgan edi. PERK ingibitorining GSK2606414 erta presimptomatik qo'llanilishi neyrodegeneratsiya va motor alomatlarini kechiktirdi, simptomsiz fazani uzaytirdi va mushak patologiyasini yaxshiladi. Biroq, GSK2606414 oshqozon osti bezi toksikligi bilan bog'liq bo'lib, kasallikni to'liq davolay olmadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PERK ingibitorlari va ilgari sinovdan o'tgan birikmalar (trazodon, TUDCA) nojo'ya ta'sirlar yoki samarasizlik tufayli MSS modelini to'liq davolay olmadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Toksiklikni chetlab o'tish va mavjud dori vositalaridan foydalanish maqsadida tadqiqotchilar dori vositalarini qayta yo'naltirish yondashuvidan foydalangan holda eIF2α dan quyi oqimda PERK signallarini modulyatsiya qiluvchi dibenzoilmetan va trazodonni o'rganishdi. Biroq, bu birikmalar woozy modelida samarasiz bo'lib chiqdi va motor yetishmovchiligi yoki Purkinye hujayralari yo'qolishining oldini ololmadi. Xuddi shunday, safro sirrozi uchun tasdiqlangan va MSS ning hujayrali modelida samarali ekanligi ko'rsatilgan kimyoviy chaperon bo'lgan tauroursodeoksixolat kislotasi woozy sichqonlarida hech qanday foydali ta'sir ko'rsatmadi.&lt;/p&gt;\n&lt;p&gt;MSS ning aksariyat hollari SIL1 dagi funksiyani yo'qotuvchi mutatsiyalar natijasida yuzaga kelganligi sababli, SIL1 ni tiklash pastki oqibatlarini emas, balki birlamchi molekulyar nuqsonni hal qiluvchi to'g'ridan-to'g'ri terapevtik strategiyani anglatadi. Shuning uchun mualliflar o'z sa'y-harakatlarini gen terapiyasi yondashuviga qaratdilar. Rekombinant adeno-assotsiatsiyalangan virus (AAV) vektorlari bu maqsad uchun juda mos keladi, chunki ular Markaziy asab tizimi va skelet mushaklari kabi postmitotik to'qimalarda transgenning barqaror ekspressiyasini ta'minlaydi hamda preklinik va klinik tadqiqotlarda ijobiy xavfsizlik profilini namoyish etgan. Qolaversa, kapsidlarni muhandislik usulida yaratishdagi so'nggi yutuqlar markaziy asab tizimiga gen yetkazib berish samaradorligini sezilarli darajada oshirdi.&lt;/p&gt;\n&lt;p&gt;Ushbu tadqiqotda mualliflar SIL1 eksprimirlovchi AAV vektorlarini neonatal intratserebroventrikulyar yuborish MSS ning woozy sichqon modelida miyachacha va mushak patologiyasining rivojlanishining oldini olishi hamda uzoq muddatli funksional foyda keltirishi mumkinligini baholadilar. Shuningdek, ular faqat Purkinye hujayralarida SIL1 ekspressiyasining tanlab tiklanishi miyachacha disfunksiyasini bartaraf eta olishini va shu tariqa MSS dagi neyrodegeneratsiyaning hujayrali asosini hal qilishini o'rganib chiqdilar.&lt;/p&gt;\n&lt;h3 id=\"natijalar1\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#natijalar1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"aav-vektorlari-endoplazmatik-retikulumda-togri-lokalizatsiyaga-ega-bolgan-samarali-va-hujayra-selektiv-sil1-ekspresiyasini-taminlaydi\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#aav-vektorlari-endoplazmatik-retikulumda-togri-lokalizatsiyaga-ega-bolgan-samarali-va-hujayra-selektiv-sil1-ekspresiyasini-taminlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AAV vektorlari endoplazmatik retikulumda to'g'ri lokalizatsiyaga ega bo'lgan samarali va hujayra-selektiv SIL1 ekspresiyasini ta'minlaydi&lt;/span&gt;&lt;/a&gt;AAV vektorlari endoplazmatik retikulumda to'g'ri lokalizatsiyaga ega bo'lgan samarali va hujayra-selektiv SIL1 ekspresiyasini ta'minlaydi&lt;/h4&gt;\n&lt;p&gt;Tdqiqotchilar pAAV-CAG-GFP plazmidasidagi yashil flüoresan oqsil (GFP) ketma-ketligini tegishli SIL1 kDНК lariga almashtirish orqali, universal CAG promotri nazorati ostida sichqon (mo) yoki odam (hu) SIL1 ni kodlovchi adenovirusli vektorlarni (AAV) yaratdilar. SIL1 ekspresiyasini PCs (Purkinje hujayralari) da selektiv tiklash miyachaning disfunksiyasini bartaraf etish uchun yetarli ekanligini aniqlash maqsadida, moSIL1 yoki GFP ni PCs larga xos bo'lgan L7-6 promotri nazorati ostida ekspresiya qiluvchi AAV vektorlari olindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AAV (adeno-assotsiatsiyalangan viruslar) ilmiy va terapevtik maqsadlarda genetik materialni hujayralar va to'qimalarga yetkazish uchun xavfsiz virusli vektorlardir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;AAV9 yoki AAV-PHP.eB (bundan buyon PHP.eB) kapsidlari o'z ichida endogen SIL1 ga ega bo'lmagan woozy sichqon embrional fibroblastlarida (MEFs) sinovdan o'tkazildi. Ikkala AAV9-CAG-moSIL1 va PHP.eB-CAG-moSIL1 vektorlari ham SIL1 ekspresiyasini keltirib chiqardi, bunda PHP.eB S1A-Rasmda umumiy yuqori samaradorlikni ko'rsatdi. Kutilganidek, AAV9-L7-6-moSIL1 ushbu hujayra turida SIL1 ekspresiyasini qo'zg'atmadi, bu L7-6 promotrining PCs larga nisbatan o'ziga xosligini tasdiqlaydi.&lt;/p&gt;\n&lt;p&gt;Immunoflüoresent tahlil shuni ko'rsatdiki, transgen SIL1 oqsili endoplazmatik retikulum (ER) markeri PDI bilan S1B-Rasmda birga joylashadi, biroq Golji apparati markeri GM130 bilan S1C-Rasmda kesishmaydi, bu transgen oqsilning to'g'ri subhujayrali joylashuvini tasdiqlaydi. AAV orqali kodlangan SIL1 oqsili PNGase F va Endo H fermentlari yordamida deglikozillanishga sezgir bo'lib chiqdi, oxirgisi endoplazmatik retikulumda saqlanib qoladigan oqsillarga xos bo'lgan yetilmagan yuqori mannozali N-glikanlar mavjudligini ko'rsatadi (S2-Rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CAG va L7-6 promotrlariga ega AAV vektorlari endoplazmatik retikulumda to'g'ri joylashgan va Purkinje hujayralariga nisbatan yuqori tanlab ta'sir qiluvchi SIL1 sintezini muvaffaqiyatli ishga tushiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;L7-6 promotri transgen ekspresiyasini faqat PCs da boshqarishini tekshirish uchun madaniy organotipik miyacha kesmalarini (COCS) AAV9-CAG-GFP yoki AAV9-L7-6-GFP bilan tranduksiya qilindi. AAV9-CAG-GFP keng tarqalgan GFP belgilarini berdi, AAV9-L7-6-GFP bilan tranduksiya qilingan COCS larda esa GFP signali S3C-Rasmda faqat kalbindin-musbat PCs lar bilan cheklandi, bu L7-6 promotrining ushbu neyronlar uchun yuqori spesifikligini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tajribalar hujayra liniyalari va kemiruvchilarning organotipik miyacha kesmalarida o'tkazilganligi sababli, terapevtik ta'sirni yakuniy baholash uchun butun organizmlarda qo'shimcha tadqiqotlar talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;PHP.eB-CAG-SIL1 yoki PHP.eB-L7-6-SIL1 bilan tranduksiya qilingan woozy COCS ning Vestern-blot tahlili shuni ko'rsatdiki, ikkala sharoitda ham SIL1 oqsili ekspresiya qilingan, ammo PHP.eB-L7-6-SIL1 vektori bilan tranduksiya qilingan kesmalarda S4-Rasmda darajalar sezilarli darajada past bo'lib, bu faqat PCs larga cheklangan selektiv ekspresiyaga to'la mos keladi.&lt;/p&gt;\n&lt;p&gt;SIL1 oqsiruvchi AAV vektorlarini bosh miya qorinchalariga yuborish, umumiy yoki Purkinje hujayralarida maxsus holda, CHOP-musbat Purkinje hujayralarini kamaytiradi, erta degeneratsiyani yumshatadi va ataksiyaning oldini oladi&lt;/p&gt;\n&lt;p&gt;Woozy sichqonlarida ataksiya 6-7 haftaligida yog'och ustida yurish testida, 9-10 haftaligida esa tezlashuvchi rotarod testida namoyon bo'ladi, harakat buzilishlari 16 haftagacha kuchayib, so'ng turg'unlashadi. Purkinje hujayralari (PH) degeneratsiyasi 7-8 haftalarda boshlanib, 16 haftaga kelib deyarli to'liq nobud bo'ladi. Dastlabki tajribalarda mualliflar neonatal AAV yuborish hayotning dastlabki 9 haftasida motor disfunksiyalar va erta neyrodegeneratsiyaning oldini olishga qodirligini tekshirishdi (S5A-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Yangi tug'ilgan sichqonlarning bosh miya qorinchalariga virusli vektorlar (AAV) yordamida genlarni kiritish markaziy asab tizimiga terapevtik oqsillarni yetkazib berishning samarali usuli hisoblanadi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Markaziy asab tizimida transgenning faol sinteziga erishish uchun intra-serebroventrikulyar inyeksiyadan foydalanildi. Ushbu usul CAG promotori yordamida butun MAT bo'ylab yashil flüoresan oqsilning (GFP) keng tarqalgan ekspresiyasini yoki L7-6 promotori nazorati ostida faqat Purkinje hujayralarida cheklangan sintezini ta'minladi (S6A-rasm). Avvalgi ma'lumotlarga mos ravishda, GFP asosan neyronlarda aniqlandi (S7-rasm) va hatto universal CAG promotori ishlatilganda ham miyachada asosan PH bilan cheklangan edi (S6-rasm). PHP.eB kapsidi teng virusli titrlarda AAV9 ga qaraganda yuqori samaradorlik ko'rsatgani sababli (S6-rasm), keyingi barcha tajribalar uchun shu kapsiddan foydalanildi.&lt;/p&gt;\n&lt;p&gt;Global va PH-spetsifik SIL1 sintezining ta'sirini solishtirish uchun geterozigotli (CT) va kasal woozy sichqonlariga tug'ilgandan keyin (P0) lateral miya qorinchalariga 10¹¹ vg/mouse miqdorida PHP.eB-CAG-moSIL1, PHP.eB-L7-6-moSIL1 yoki fitrat (PBS) yuborildi. Sichqonlar har haftada yog'ochda yurish testidan o'tkazildi va miyani biokimyoviy hamda immunohistokimyoviy tahlil qilish uchun 9 haftaligida uyquga keltirildi (S5A-rasm). Qo'shimcha guruhdagi hayvonlar 6 haftaligida tahlil uchun olib tashlandi, chunki bu yoshda woozy sichqonlarida UPR stress belgilarining eng yuqori faollashuvi kuzatiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;SIL1 kodlovchi AAV vektorlarining inyeksiyasi woozy sichqonlarida motor funksiyalarini sog'lom hayvonlar darajasigacha tiklaydi va Purkinje hujayralarini saqlab qoladi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Hayotning 5-haftasigacha guruhlar orasida yog'ochda yurish ko'rsatkichlarida farqlar kuzatilmadi (1-rasm, A va B). 6-haftadan boshlab PBS olgan woozy sichqonlarida xatolar soni (1A-rasm) va yog'ochdan o'tish vaqti (1B-rasm) geterozigotli nazoratga nisbatan sezilarli darajada oshdi. Aksincha, SIL1 ifodalovchi AAV olgan woozy sichqonlarida tajriba davomida harakat ko'rsatkichlari yaxshilandi va nazorat guruhidan farq qilmadi.&lt;/p&gt;\n&lt;p&gt;Purkinje hujayralarining boshlang'ich degeneratsiyasini baholash uchun kalbindinga qarshi antikorlar bilan immunohistokimyo qo'llanildi. PBS olgan woozy sichqonlarida kalbindin-musbat maydon 27% ga kamaygani aniqlandi (1-rasm, C va E). CAG yoki L7-6 promotori ostida SIL1 eksprimatsiya qiluvchi PHP.eB vektorlari bilan davolangan woozy sichqonlarida kalbindin-musbat maydon sezilarli darajada yaxshi saqlangani ko'rsatildi. CHOP antikorlari bilan tahlil qilinganda, AAV olgan woozy sichqonlarida CHOP-musbat PH ulushi sezilarli darajada kamaygani aniqlandi (1-rasm, D va F). 6 haftalik PH da ddPCR tahlili BiP, ATF4 va CHOP mRNK darajasining pasayganini tasdiqladi (S8-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Tadqiqot laboratoriya hayvonlarida o'tkazilgan bo'lib, transgenlarning ekspresiya darajasi ishlatilgan promotor turiga qarab o'zgarishi mumkin.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Western blot tahlili PHP.eB-CAG-moSIL1 yuborilgan sichqonlarning bosh miya yarim sharlarida va miyachasida SIL1 sintezini tasdiqladi (S9A-rasm). PHP.eB-L7-6-moSIL1 da esa SIL1 faqat miyachada va ancha past darajada aniqlandi (S9B-rasm). ddPCR ma'lumotlariga ko'ra, transgen SIL1 mRNK darajasi nazoratga nisbatan taxminan 4 baravar yuqori bo'lgan (S8-rasm).&lt;/p&gt;\n&lt;p&gt;Natijalarni tasdiqlash uchun inson SIL1 (huSIL1) ifodalovchi vektorlar bilan tajriba takrorlandi. Nazorat sifatida PHP.eB-CAG-GFP olgan woozy sichqonlari guruhi qo'shildi. GFP olgan sichqonlarda ataksiya kuchayib, xatolar soni oshdi (2-rasm, A va B).moSIL1 yoki huSIL1 olgan sichqonlarning ko'rsatkichlari CT sichqonlariga o'xshash edi (2-rasm, A va B). Kalbindin va CHOP immunohistokimyosi 9 haftaligida PH saqlanganligini ko'rsatdi (2-rasm, C-F).&lt;/p&gt;\n&lt;p&gt;Miyachada SIL1 darajasi moSIL1 guruhida tabiiy darajadan 1.5 barobar, huSIL1 guruhida эса taxminan 6 barobar yuqori bo'lgani aniqlandi (3-rasm).&lt;/p&gt;\n&lt;h4 id=\"aavs-encoding-mouse-or-human-sil1-provide-long-term-protection-against-cerebellar-ataxia-and-purkinje-cell-degeneration\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#aavs-encoding-mouse-or-human-sil1-provide-long-term-protection-against-cerebellar-ataxia-and-purkinje-cell-degeneration\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AAVs encoding mouse or human SIL1 provide long-term protection against cerebellar ataxia and Purkinje cell degeneration&lt;/span&gt;&lt;/a&gt;AAVs encoding mouse or human SIL1 provide long-term protection against cerebellar ataxia and Purkinje cell degeneration&lt;/h4&gt;\n&lt;p&gt;AAV terapiyasining terapevtik ta'siri uzoq muddat saqlanib qolishini aniqlash uchun tajriba takrorlandi va hayvonlar 26 haftalik yoshgacha kuzatildi (S5B-rasm). Ushbu kengaytirilgan tahlil surunkali bosqichlarda davolashning nojo'ya ta'sirlari paydo bo'lishini baholashga ham imkon berdi. Dasturiy 9 hafta davomida to'sin ustida yurish testini tahlil qilish davolashning harakat buzilishlarining rivojlanishiga ijobiy ta'sirini tasdiqladi (4-rasm, A va B; S1-kino). Ushbu davrdan so'ng, plasebo olgan woozy sichqonlari orqa oyoqlarini sudrab va to'sindan tez-tez yiqilib, testni bajarishga qodir emas edi. Aksincha, AAV olgan woozy sichqonlari testni yomonlashuvsiz bajarishda davom etdilar va CT nazorat guruhi sichqonlari bilan solishtiriladigan ko'rsatkichlarni ko'rsatdilar (4-rasm, A va B; S2-kino).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sichqoncha yoki odam SIL1 genlarini kodlovchi AAV bilan uzoq muddatli davolash woozy sichqonlarida harakat buzilishlari va ataksiyaning oldini olib, 26 haftaligida ham sog'lom hayvonlar darajasini saqlab qoladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu uzoq muddatli foyda kasallikning ilg'or bosqichlaridagi woozy sichqonlari bajara oladigan tezlashtirilgan aylanuvchi sterjen (rotarod) testi bilan tasdiqlandi. Ilgari xabar qilinganidek (Grande va boshq., 2018), PBS yuborilgan woozy sichqonlari yiqilish latensiyasining bosqichma-bosqich pasayishini, so'ngra barqarorlashishini ko'rsatdi (4C-rasm). Aksincha, moSIL1 yoki huSIL1 kodlovchi AAVlar bilan davolangan woozy sichqonlarining ko'rsatkichlari CT nazorat guruhlaridan farq qilmadi (4C-rasm).&lt;/p&gt;\n&lt;p&gt;Progressiv tremor woozy sichqonlarining nevrologik fenotipining bir qismidir (Zhao va boshq., 2005). Engil tremor birinchi marta 10 haftaligida osilgan to'sinda yurganda namoyon bo'ladi va yosh o'tishi bilan kuchayadi (Grande va boshq., 2018). Woozy sichqonlarida tremor 20 va 26 haftaligida baholandi. Ikkala vaqt nuqtasida ham plasebo guruhidagi barcha to'qqizta sichqonchada og'ir tremor kuzatildi, AAV bilan davolangan 13 sichqonchaning hech birida esa osib qo'yilgan to'sinda yurganda ham ko'rinadigan tremor kuzatilmadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Imunofistoximiya — to'qimalardagi o'ziga xos oqsillarni maxsus nishonlangan antitelolar yordamida aniqlash usuli bo'lib, kalbindin Purkinje hujayralarini sanash uchun marker sifatida ishlatilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;26 haftaligida kalbindin imunofistoximiyasi PBS olgan woozy sichqonlarida Purkinje hujayralarining to'liq yo'qolishini ko'rsatdi (5-rasm, A va B). Morfometrik tahlil bu hayvonlarda miyachak po'stlog'ining molekulyar qatlami sezilarli darajada yupqalashganini aniqladi (5C-rasm). Aksincha, AAV bilan davolangan woozy sichqonlari ham Purkinje hujayralari, ham molekulyar qatlam qalinligi sezilarli darajada saqlanib qolganini ko'rsatdi (5-rasm). Qolaversa, davolangan sichqonlardagi Purkinje hujayralarida CHOP faollashuvi aniqlanmadi (S10-rasm), bu endoplazmatik retikulum stressining barqaror bostirilishiga mos keladi.&lt;/p&gt;\n&lt;p&gt;SIL1 gen terapiyasining miyachak patologiyasiga ta'sirini yanada baholash uchun 26 haftaligida GFAP imunostunlashuvi orqali astrositar faollashuv tekshirildi. PBS olgan woozy sichqonlari miyachak po'stlog'i bo'ylab kuchli GFAP immunoreaktivligini ko'rsatdi (6-rasm). AAV bilan davolangan woozy sichqonlarida GFAP immunoreaktivligi sezilarli darajada kamaydi (6-rasm). Bu topilmalar AAV orqali SIL1 yetkazib berish Purkinje hujayralarini saqlab qolishini va reaktiv astrositlar javobini kamaytirishini ko'rsatadi.&lt;/p&gt;\n&lt;h4 id=\"aav-treatment-improves-muscle-strength-and-ameliorates-ultrastructural-muscle-pathology\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#aav-treatment-improves-muscle-strength-and-ameliorates-ultrastructural-muscle-pathology\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AAV treatment improves muscle strength and ameliorates ultrastructural muscle pathology&lt;/span&gt;&lt;/a&gt;AAV treatment improves muscle strength and ameliorates ultrastructural muscle pathology&lt;/h4&gt;\n&lt;p&gt;Woozy sichqonlarida skelet mushaklarining og'ir progressiv miopatiyasi rivojlanadi, u 16 haftaligida elektron mikroskopiyada birinchi marta aniqlanadi va keyingi bosqichlarda mushaklar funksiyasining buzilishiga olib keladi (Grande va boshq., 2018; Roos va boshq., 2014). Qizig'i shundaki, to'rga osilish va tutqich kuchi testlari PHP.eB-CAG-SIL1 bilan davolangan woozy sichqonlarida mushaklar chidamliligi va kuchi yaxshilanganini ko'rsatdi (7-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Olingan natijalar kamyob kasallikning sichqoncha modeliga asoslangan bo'lib, ularni insonlarga ko'chirish klinik tasdiqlashni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Buni baholash uchun biz davolangan sichqonlarning to'rt boshli mushaklarini (quadriceps) gistologiya va uzatuvchi elektron mikroskopiya (TEM) yordamida tahlil qildik. Yorug'lik mikroskopiyasi PBS olgan woozy sichqonlarida yadrolari sarcolemma ostida bo'lmagan mushak tolalarining yuqori foizini aniqladi (Roos va boshq., 2014). Bu foiz sichqon yoki odam SIL1 ni kodlovchi AAVlar bilan davolangan woozy sichqonlarida sezilarli darajada kamaydi (S11-rasm). TEM tahlili PBS olgan woozy sichqonlarining mushak tolalarida sarkoplazmatik retikulumning kengayishi va miyelinga o'xshash membranali moddalarni o'z ichiga olgan vakuolalar kabi o'zgarishlarni aniqladi (8A-rasm). AAV bilan davolangan sichqonlarda bu o'zgarishlar sezilarli darajada kamroq namoyon bo'ldi (8A-rasm, 8B-rasm).&lt;/p&gt;\n&lt;p&gt;Funksional foyda va mushak patologiyasining yaxshilanishi transgen SIL1 ekspresiyasiga bog'liqligini aniqlash uchun biz Vestern-blot (WB) tahlilini o'tkazdik. Transgen SIL1 ekspresiyasi skelet mushaklarida aniqlandi. Garchi miyadagidan sezilarli darajada past bo'lsa-da, AAV bilan davolangan sichqonlarning quadricepsidagi SIL1 darajalari CT sichqonlarining endogen darajalari bilan taqqoslanadigan edi (S12-rasm).&lt;/p&gt;\n&lt;p&gt;Muhimi shundaki, terapevtik foyda toksiklik alomatlari bilan birga kelmadi. AAV bilan davolangan CT va woozy sichqonlari tadqiqot davomida normal xulq-atvorni ko'rsatdi va 26 haftaligida o'lchangan qon zardobi parametrleri norma chegarasida edi (S1-jadval).&lt;/p&gt;\n&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;h4 id=\"natijalarni-muhokama-qilish\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#natijalarni-muhokama-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalarni muhokama qilish&lt;/span&gt;&lt;/a&gt;Natijalarni muhokama qilish&lt;/h4&gt;\n&lt;p&gt;Ushbu tadqiqot erta go‘daklik davrida boshlanadigan, hozircha patogen davolash usuli mavjud bo‘magan o‘ta kam uchraydigan va og‘ir kasallik — Marinesko-Shegren sindromi (MSS) uchun gen terapiyasi yondashuvini sinab ko‘rishga qaratildi. Biz yovvoyi turdagi SIL1 genini kodlovchi AAV vektorlarini yangi tug‘ilgan kishilarning miya qorinchalariga yuborish ataksiya rivojlanishining oldini olishini, Purkinje hujayralarini saqlab qolish va astroglyozni kamaytirish orqali miyachachalar degeneratsiyasini susaytirishini, shuningdek woozy sichqonlar modelida skelet mushaklari disfunksiyasi va patologiyasini yaxshilashini aniqladik.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Yangi tug‘ilgan woozy sichqonlariga AAV-SIL1 yuborish ataksiya rivojlanishining oldini oldi, Purkinje hujayralarini saqlab qoldi va toksiklik belgilarisiz harakat funksiyasini yaxshiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Muhimi shundaki, woozy yoki nazorat guruhidagi sichqonlarda AAV yuborilishi yoki transgen SIL1 ning ortiqcha ekspressiyasi bilan bog‘liq toksiklik yoki nojo‘ya ta’sirlar kuzatilmadi. SIL1 ekspresiyasining Purkinje hujayralarida tanlab tiklanishi miyachachalar ataksiyasining oldini olish uchun yetarli bo‘ldi, bu esa kasallik patogeneziga aynan Purkinje hujayralari disfunksiyasining hujayra avtonom hissa qo‘shishidan dalolat beradi. Ushbu natijalar MSS uchun istiqbolli davolash strategiyasi sifatida AAV yordamida amalga oshiriladigan SIL1 gen terapiyasini qo‘llab-quvvatlovchi dalillarni taqdim etadi.&lt;/p&gt;\n&lt;p&gt;Hozirgi vaqtda MSS uchun samarali davolash usuli mavjud emas. Woozy sichqonlarida o‘tkazilgan avvalgi tadqiqotlar PERK signal yo‘lini modulyatsiya qilish orqali ER stressi va noto‘g‘ri moslashgan UPR signallarini pasaytirishga qaratilgan farmakologik yondashuvlarni o‘rgangan edi. Ushbu choralar qisman foyda keltirgan bo‘lsa-da, motor disfunksiyasi yoki miyachachalar degeneratsiyasini to‘liq bartaraf eta olmadi, bu esa faqat quyi oqimdagi stress yo‘llarini nishonga olish SIL1 yetishmovchiligining oqibatlarini yengish uchun yetarli emasligini ko‘rsatadi. Yaqinda woozy sichqonlarida hujayra ichiga kiruvchi SIL1-TAT birikma oqsilini kodlovchi AAV8 vektorini jigar orqali yuborishga asoslangan gen terapiyasi yondashuvi baholandi. Bu strategiyada jigar SIL1-TAT ximerasini tizimli ishlab chiqarish uchun «biofabrika» sifatida ishlatildi va u TAT ketma-ketligi tufayli Markaziy asab tizimi (MAT) hamda boshqa organlarga kirishi kutilgandi. SIL1-TAT skelet mushaklarida aniqlandi, lekin miyachachada topilmadi, va terapevtik ta’sir balandlikdagi to‘singa chiqish va rotarod ko‘rsatkichlarining mo‘tadil yaxshilanishi bilan cheklanib, motor buzilishlarining rivojlanishini sekinlashtirdi, xolos. Bu kuzatishlar SIL1 ni asab tizimiga samarali yetkazib berish kuchli terapevtik foyda uchun zarurligini qat'iy ko‘rsatadi. Shu munosabat bilan, ushbu tadqiqot MATga yo‘naltirilgan AAV yordamidagi gen terapiyasi avval o‘rganilgan farmakologik yoki periferik gen yetkazib berish yondashuvlariga qaraganda sezilarli darajada yuqori samaradorlikka erishishini ko‘rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AAV (adenoz assotsiatsiyalangan viruslar) — bu sog‘lom genlarni bemor hujayralariga yetkazib berish uchun ishlatiladigan xavfsiz tashuvchi viruslardir, vestern-blot va ddPCR esa oqsillar hamda DNK/RNKni tahlil qilish usullaridir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu ishning asosiy topilmasi shundan iboratki, AAV yordamida SIL1 yetkazib berilishi MATda kuchli transgen ekspresiyasiga olib keldi va 26 hafta davomida ataksiya bilan bog‘liq motor nuqsonlarining barqaror bartaraf etilishini ta'minladi.&lt;/p&gt;\n&lt;p&gt;Miyachachalar ekstraktlarini vestern-blot tahlili moSIL1 bilan davolangan sichqonlarda endogen yovvoyi tur darajasidan biroz yuqori bo‘lgan, huSIL1 bilan davolangan hayvonlarda эsa taxminan olti baravar yuqori bo‘lgan SIL1 immunoreaktivligini ko‘rsatdi. Biroq, immunobloting uchun ishlatilgan antitelalar inson SIL1 ga qarshi olingani sababli, huSIL1 bilan davolangan sichqonlarda kuzatilgan kuchliroq signal inson oqsiliga nisbatan antitelaning yuqori moyilligini qisman aks ettirishi mumkin. Shu bilan birga, lazer yordamida ajratib olingan Purkinje hujayralarining ddPCR tahlili maqsadli neyron populyatsiyasida SIL1 mRNKsining taxminan ikki baravar ortiqcha ekspressiyasini ko‘rsatdi, bu kuchli, ammo haddan tashqari suprafiziologik bo‘lmagan transgen ekspresiyasiga mos keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tajribalar sichqonlar modelida o‘tkazildi va inson SIL1 variantini olgan sichqonlarda oqsil signalining kuchayishi antitelalarning xususiyatlari bilan bog‘liq bo‘lishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Harakatning tiklanishi Purkinje hujayralarining sezilarli darajada сақланиши ва GFAP immunoreaktivligining kamayishi bilan tasdiqlangan miyachachalar astroglyozining sezilarli darajada pasayishi bilan birga kechdi. Reaktiv astrozitoz ko‘plab neyrodegenerativ kasalliklarning yaxshi ma'lum belgisi hisoblanadi, biroq uning MSS patogenezidagi hissasi o‘rganilmagan edi. Transgen ekspresiyasi asosan Purkinje hujayralari va boshqa neyronlarda kuzatilganligi sababli, miyachachalar astroglyozining yaqqol pasayishi astrositlarni to‘g‘ridan-to‘g‘ri tuzatish natijasi bo‘lishi ehtimoli kam. Aksincha, bu reaktiv glial javob neyronlar degeneratsiyasining ikkilamchi oqibati ekanligini va zaif Purkinje hujayralarini himoya qilish orqali oldini olish mumkinligini ko‘rsatadi. Umuman olganda, bu topilmalar SIL1 geni yetkazib berilishi Purkinje hujayralarini saqlab qolish bilan birga, miyachachalar degeneratsiyasi bilan bog‘liq reaktiv glial javobni ham pasaytirishini ko‘rsatadi.&lt;/p&gt;\n&lt;p&gt;AAV bilan davolangan woozy sichqonlarida Purkinje hujayralarining saqlanib qolishi sezilarli darajada bo‘ldi, ammo to‘liq emas edi.&lt;/p&gt;\n&lt;p&gt;Shunga qaramay, davolangan sichqonlarning harakat ko‘rsatkichlari heterozigota nazorat guruhidagilardan deyarli farq qilmadi. Bu natijalar shuni ko‘rsatadiki, kuchli funksional tiklanishga erishish uchun miyachachalar degeneratsiyasining to‘liq anatomik tiklanishi talab etilmasligi mumkin. Ushbu tushuncha miyachachalar ataksiyasining bir nechta sichqon modellarida o‘tkazilgan tadqiqotlar bilan tasdiqlanadi, ular Purkinje hujayralari populyatsiyalarining qisman сақланиши yoki ularning funksiyasining tiklanishi harakat xulq-atvorida sezilarli yaxshilanishlarga olib kelishi mumkinligini ko‘rsatadi, bu ehtimol miyachachalar tarmoqlarining sezilarli funksional zaxirasi va kompensator imkoniyatlarini aks ettiradi. Shuning uchun bizning topilmalarimiz zaif Purkinje hujayralarining yetarli qismida SIL1 ekspresiyasining tiklanishi qoldiq neyrodegeneratsiya mavjud bo‘lganda ham miyachachalar tarmoq funksiyasini саqlab qolish va ochiq ataksiyaning paydo bo‘lishining oldini olish mumkinligini ko‘rsatadi.&lt;/p&gt;\n&lt;p&gt;Qo‘shimcha muhim kuzatuv terapevtik ta'sirning ajoyib chidamliligidir. AAV-SIL1 bilan davolangan woozy sichqonlari ushbu tadqiqotda tahlil qilingan so‘nggi vaqt nuqtasi bo‘lgan 26 haftalik kuzatuv davri davomida heterozigota nazorat guruhidan xulq-atvori bo‘yicha farqlanmay qoldi. Bu barqaror foyda MSS kontekstida ayniqsa ruhlantiruvchidir, chunki bu kasallikda nevrologik alomatlar odatda go‘daklik davrida paydo bo‘ladi va bolalik davrida rivojlanadi, biroq kasallik oxir-oqibat barqarorlashadi va umr ko‘rish davomiyligi odatda qisqarmaydi.&lt;/p&gt;\n&lt;h4 id=\"klinik-qollash-istiqbollari-va-terapiya-xavfsizligi\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#klinik-qollash-istiqbollari-va-terapiya-xavfsizligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Klinik qo'llash istiqbollari va terapiya xavfsizligi&lt;/span&gt;&lt;/a&gt;Klinik qo'llash istiqbollari va terapiya xavfsizligi&lt;/h4&gt;\n&lt;p&gt;Terapiyaning hayotning ilk davrida erta boshlanishi vosita funksiyalarining uzoq muddat saqlanib qolishini ta'minlab, bemorlarning mustaqilligi va hayot sifatini sezilarli darajada yaxshilashi mumkin. Shuni ta'kidlash kerakki, tajribalar davomida yangi tug'ilgan sichqonlarga AAV vektorlarini intratsereventrikulyar yuborish yoki SIL1 oqsilining uzoq muddatli ortiqcha ekspressiyasi bilan bog'liq hech qanday nojo'ya ta'sirlar kuzatilmadi (woozi mutant sichqonlarida ham, sog'lom nazorat hayvonlarida ham). Ushbu kuzatishlar markaziy nerv tizimida SIL1 ning ortiqcha ekspressiyasi organizm tomonidan yaxshi o'zlashtirilishini ko'rsatadi. Ushbu natijalar AAV vositasidagi SIL1 yetkazib berilishi ko'rinadigan toksikliksiz barqaror va uzoq muddatli terapevtik ta'sir ko'rsatishini tasdiqlaydi.&lt;/p&gt;\n&lt;h4 id=\"purkinye-hujayralarining-roli-va-fenotipni-selektiv-korreksiya-qilish\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#purkinye-hujayralarining-roli-va-fenotipni-selektiv-korreksiya-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Purkinye hujayralarining roli va fenotipni selektiv korreksiya qilish&lt;/span&gt;&lt;/a&gt;Purkinye hujayralarining roli va fenotipni selektiv korreksiya qilish&lt;/h4&gt;\n&lt;p&gt;Ishning qiziqarli natijasi shundan iboratki, L7-6 promotri nazorati ostida SIL1 ning faqat Purkinye hujayralarida tanlab ifodalanishi ataksiya rivojlanishining oldini olish uchun yetarli bo'ldi. SIL1 yetishmovchiligi ushbu neyronlarni endoplazmatik retikulum stressiga nisbatan zaif qiladi, ularda SIL1 darajasini tiklash miyachaning funksiyasini normallashtiradi. Ushbu ma'lumotlar boshqa nasliy ataksiyalar bo'yicha tadqiqotlar natijalariga mos keladi, bunda Purkinye hujayralari asosiy nishon hisoblanadi. Shunday qilib, Purkinye hujayralariga ta'sir qilish woozi sichqon modelida miyacha fenotipini to'g'irlashga qodir ekanligini ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SIL1 ning Purkinye hujayralarida selektiv ekspressiyasi ataksiya rivojlanishini to'liq oldini oladi va miyacha funksiyasini normallashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"skelet-mushaklariga-tasiri-va-tizimli-samaralar\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#skelet-mushaklariga-tasiri-va-tizimli-samaralar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Skelet mushaklariga ta'siri va tizimli samaralar&lt;/span&gt;&lt;/a&gt;Skelet mushaklariga ta'siri va tizimli samaralar&lt;/h4&gt;\n&lt;p&gt;AAV bilan davolangan woozi sichqonlar mushak kuchi va chidamliligining sezilarli darajada yaxshilanganini ko'rsatdi, bu panja kuchi va panjarada ushlanib turish testlarida tasdiqlandi. Funksional yaxshilanishlarga mos ravishda, gistologik tekshiruvlar skelet mushaklari patologiyasining keskin kamayganini ko'rsatdi: markaziy yadroli mushak tolalari soni kamaydi. G‘arbiy blot tahlili transgen SIL1 oqsilining skelet mushaklarida heterozigot sichqonlarnikiga o'xshash darajada mavjudligini ko'rsatdi. Shunday qilib, SIL1 ning nisbatan past tiklanish darajasi ham mushak to'qimalari uchun sezilarli foyda keltirishi mumkin.&lt;/p&gt;\n&lt;h4 id=\"kelgusidagi-tadqiqotlar-yonalishlari\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#kelgusidagi-tadqiqotlar-yonalishlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kelgusidagi tadqiqotlar yo'nalishlari&lt;/span&gt;&lt;/a&gt;Kelgusidagi tadqiqotlar yo'nalishlari&lt;/h4&gt;\n&lt;p&gt;Ushbu topilmalar AAV vositasidagi SIL1 gen terapiyasini MSS uchun potentsial davolash usuli sifatida qo'llab-quvvatlaydi. Shunga qaramay, bir nechta muhim savollar qolmoqda. Yangi tug'ilgan chaqaloqlarga intratsereventrikulyar yuborish sichqonlarda yuqori samarali bo'lsa-da, klinik amaliyotga o'tish markaziy nerv tizimi va periferik to'qimalarni samarali transduksiya qilishga qodir yetkazib berish strategiyalarini optimallashtirishni talab qiladi. Kelgusidagi tadqiqotlar maqsadli to'qimalarda yetarli SIL1 ekspressiyasini ta'minlaydigan tizimli yuborish usullarini baholashi kerak.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ma'lumotlar sichqon modelida olinganligi sababli, klinik qo'llash uchun tizimli yetkazib berish usullarini ishlab chiqish talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Klinik tarjima uchun yana bir muhim savol - neonatal davolanishda kuzatilgan terapevtik foyda kasallikning keyingi bosqichlariga ham tatbiq etilishi mumkinmi. Garchi yangi tug'ilgan chaqaloqlarni genetik skrining qilish dasturlari profilaktik davolashga imkon bersa-da, alomatlar boshlanganidan keyin ham AAV-SIL1 terapiyasi samarali bo'lib qolishini aniqlash muhimdir. Nihoyat, terapevtik foyda 26 haftalik kuzatuv davomida saqlanib qolgan bo'lsa-da, umr davomida barqaror SIL1 ekspressiyasining oqibatlarini baholash uchun uzoq muddatli tadqiqotlar talab etiladi.&lt;/p&gt;\n&lt;h3 id=\"usullar1\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#usullar1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"tadqiqot-dizayni\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#tadqiqot-dizayni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot dizayni&lt;/span&gt;&lt;/a&gt;Tadqiqot dizayni&lt;/h4&gt;\n&lt;p&gt;Ushbu ish MSS ning woozy (wz/wz) sichqon modeli va nazorat sifatida гетерозигоt (CT) nayzaqator qarindoshlarini qo'llagan holda o'tkazilgan nazorat ostidagi, randomizatsiyalashgan laboratoriya tadqiqotidir. Ilgari yovvoyi turdagi (wt/wt) va гетерозигоt (wt/wz) sichqonlar o'rtasida motor faoliyati yoki miyacha tuzilishida sezilarli farqlar yo'qligi aniqlanganligi сабабли, tadqiqot davomida гетерозигоt hayvonlar nazorat sifatida foydalanildi. wt/wz × wz/wz chatishtirishdan olingan (taxminan 50% nazorat va 50% woozy nasl beradigan) yangi tug'ilgan sichqonlar AAV vektorlari yoki eritmani (vehicle) olish uchun bolalar guruhi darajasida tasodifiy taqsimlandi. Tug'ilish vaqtida jinsni aniqlash qiyin bo'lgani sababli, ikki jinsdagi neonatallik davridagi sichqonlar jinsidan qat'i nazar eksperimental guruhlarga kiritildi. Xulq-atvor testlari, shuningdek, gistologik va ultrastrukturali tahlillar genotip va davolash usulidan bexabar bo'lgan tadqiqotchilar tomonidan bajarildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ko'r-ko'rona sinovdan o'tkazish (blinding) usuli natijalarni baholovchi olimlar hayvonlarning guruhini bilmasligini ta'minlaydi, bu esa subyektiv xatoliklarning oldini oladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Qisqa muddatli tajribalar davolashning harakat buzilishlarining boshlanishiga va erta Purkinje hujayralari degeneratsiyasiga ta'sirini baholash uchun S5A-rasmda ko'rsatilgan sxema bo'yicha amalga oshirildi. Sichqonlar 4 haftaligida to'sin ustida yurish testiga (beam-walking test) o'rgatildi va 9 haftalik bo'lgunga qadar har haftada sinovdan o'tkazildi. Asosiy yakuniy nuqta woozy sichqonlarida motor muvofiqlashuvi va muvozanatining erta buzilishlarini aniq ko'rsatuvchi to'sin ustida yurish testi bo'ldi. Tanlama hajmi oldindan quvvat tahlili yordamida aniqlandi: davolanmagan woozy sichqonlarida mos ravishda 5, 6, 7, 8 va 9 haftalikda o'rtacha adashishlar soni 2, 6, 16, 23 va 37 ta bo'lishi, AR(1) korrelyatsiyasi 0.50 va qoldiq dispersiya 2.00 ekani nazarda tutilib, I turdagi xato 0.05 va quvvat 90% bo'lganda adashishlar sonining 60% ga kamayishini aniqlash uchun har bir guruhda oltita hayvon talab qilindi.&lt;/p&gt;\n&lt;p&gt;Uzoq muddatli tajribalar S5B-rasmda ko'rsatilgan dizayn asosida o'tkazildi. Hayvonlar 26 haftaligacha kuzatildi. To'sinda yurishdan tashqari, motor ko'rsatgichlari woozy sichqonlarida taxminan 9-10 haftalikdan boshlab motor nuqsonlarini aniqlaydigan va kasallik kuchaygan bosqichlarda ham mos keladigan tezlashuvchi rotarod (accelerating rotarod) yordamida baholandi. Mushak funksiyasi teskari panjara (inverted grid) va ushlash kuchi (grip strength) testlari orqali tekshirildi.&lt;/p&gt;\n&lt;p&gt;Hayvonlar belgilangan eksperimental yakuniy nuqtalarda evtanaziya qilindi. To'qimalarni yig'ish vaqtida har bir miyaning bitta yarim shari gistologik, immunohistokimyoviy yoki ultrastrukturali tahlillar uchun botirib mahkamlandi, qarama-qarshi yarim shar эса biokimyoviy tadqiqotlar uchun tez muzlatildi. To'rt boshli son mushaklari ham shunday tartibda ishlandi: bitta mushak ultrastrukturali tahlil uchun mahkamlandi, kontralateral mushak esa gistologik va biokimyoviy tahlil uchun muzlatildi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-f1.jpg\" alt=\"1-rasm. AAV vositasidagi SIL1 ekspresiyasi PC larda universal yoki tanlab ekspressiya qilinganda woozy sichqonlarida har\" /&gt;&lt;/p&gt;\n&lt;p&gt;*1-rasm. AAV vositasidagi SIL1 ekspresiyasi PC larda universal yoki tanlab ekspressiya qilinganda woozy sichqonlarida harakat faoliyatini va miyachak patologiyasini yaxshilaydi. (A, B) Heterozigotali nazorat (CT) va woozy (wz) sichqonlari guruhlariga icv orqali PBS, AAV-CAG-moSIL1 yoki AAV-L7-6-moSIL1 yuborildi. Hayvonlar osilgan to'sin bo'ylab yurish qobiliyati uchun har haftada sinovdan o'tkazildi. Ma'lumotlar orqa oyoq qadam xatolari sonining (A) va to'sinni kesib o'tish uchun o'rtacha vaqtning (B) o'rtacha ± SEM sifatida keltirilgan. (A) da F(3.543, 31.89) = 17.66, P &amp;lt; 0.0001; (B) da ikki tomonlama takroriy o'lchovli ANOVA (RM ANOVA) bo'yicha F(4.926, 44.34) = 5.775, P = 0.0004; Dunnett post-hoc testi bo'yicha **P &amp;lt; 0.01, **P &amp;lt; 0.05, ****P &amp;lt; 0.0001. (C, D) 9 haftalik CT va woozy sichqonlari miyachak kesmalarida kalbindin (C) yoki CHOP (D) uchun immunohistokimyoviy tahlil. O'lchov chizig'i 200 mkm. (E, F) Miyachak poʻstlogʻida kalbindin-musbat sohani (E) va CHOP-musbat PC larni (F) miqdoriy baholash. Ma'lumotlar o'rtacha ± SEM. (E) da F(2, 10) = 6.648, P = 0.0146; (F) da ikki tomonlama ANOVA bo'yicha F(2, 9) = 33.35, P &amp;lt; 0.0001; Dunnett post-hoc testi bo'yicha *P &amp;lt; 0.05, ***P &amp;lt; 0.001, ***&lt;em&gt;P &amp;lt; 0.0001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-f2.jpg\" alt=\"2-rasm. Sichqon yoki odam SIL1 ni kodlovchi AAV larning yangi tug'ilgan ichki qorincha ichiga (icv) yuborilishi woozy si\" /&gt;&lt;/p&gt;\n&lt;p&gt;*2-rasm. Sichqon yoki odam SIL1 ni kodlovchi AAV larning yangi tug'ilgan ichki qorincha ichiga (icv) yuborilishi woozy sichqonlarida harakat buzilishlari va PC degeneratsiyasining rivojlanishining oldini oladi. (A, B) Yangi tug'ilgan woozy va heterozigotali (CT) nasllarga PHP.eB-CAG-GFP, PHP.eB-CAG-moSIL1 yoki PHP.eB-CAG-huSIL1 (1011 vg/sichqoncha) icv yuborildi va to'rt haftaligidan boshlab osilgan to'sin bo'ylab yurish qobiliyati har haftada sinovdan o'tkazildi. Ma'lumotlar orqa oyoq qadam xatolari sonining (A) va to'sinni kesib o'tish uchun talab qilinadigan vaqtning (B) o'rtacha ± SEM qiymatidir. (A) da F(5.605, 50.44) = 8.614, P &amp;lt; 0.0001; (B) da ikki tomonlama RM ANOVA bo'yicha F(5.356, 48.21) = 3.966, P = 0.0036; Dunnett post-hoc testi bo'yicha *P &amp;lt; 0.05, **P &amp;lt; 0.01, ***P &amp;lt; 0.001. (C, D) X haftalik CT va woozy sichqonlari miyachak kesmalarida kalbindin (C) yoki CHOP (D) uchun immunohistokimyoviy tahlil. O'lchov chizig'i 200 mkm. (E, F) Miyachak poʻstlogʻida kalbindin-musbat sohani (E) va CHOP-musbat PC larni (F) miqdoriy baholash. Ma'lumotlar o'rtacha ± SEM. (E) da F(2, 8) = 12.50, P = 0.0035; (F) da ikki tomonlama ANOVA bo'yicha F(2, 10) = 6.942, P = 0.0129; Dunnett post-hoc testi bo'yicha *P &amp;lt; 0.05, *&lt;em&gt;P &amp;lt; 0.01.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-f3.jpg\" alt=\"3-rasm. PHP.eB-CAG-huSIL1 va PHP.eB-CAG-moSIL1 ning ichki qorincha ichiga yuborilishi miyachakda kuchli transgen ekspres\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm. PHP.eB-CAG-huSIL1 va PHP.eB-CAG-moSIL1 ning ichki qorincha ichiga yuborilishi miyachakda kuchli transgen ekspresiyasini keltirib chiqaradi. (A) P0 da PHP.eB-CAG-GFP, PHP.eB-CAG-huSIL1 yoki PHP.eB-CAG-moSIL1 icv yuborilgan 9 haftalik CT va woozy sichqonlarining miyachak gogenatidagi SIL1, GFP va GAPDH ning Western blot tahlili. (B) SIL1 darajalari densitometriya yordamida miqdoriy baholandi, GAPDH darajasiga normallashtirildi va PHP.eB-CAG-GFP yuborilgan CT sichqonlaridagi endogenous SIL1 miqdoriga nisbatan grafikda ko'rsatildi. Ma'lumotlar har bir guruh uchun 2-3 hayvonning o'rtacha ± SEM qiymatidir.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-f4.jpg\" alt=\"4-rasm. Yangi tug'ilgan woozy sichqonlariga PHP.eB-CAG-moSIL1 va PHP.eB-CAG-huSIL1 ning ichki qorincha ichiga yuborilish\" /&gt;&lt;/p&gt;\n&lt;p&gt;*4-rasm. Yangi tug'ilgan woozy sichqonlariga PHP.eB-CAG-moSIL1 va PHP.eB-CAG-huSIL1 ning ichki qorincha ichiga yuborilishi motor disfunksiyasidan uzoq muddatli himoyani ta'minlaydi. (A) Yangi tug'ilgan woozy va heterozigotali (CT) nasllarga PBS, PHP.eB-CAG-moSIL1 yoki PHP.eB-CAG-huSIL1 icv yuborildi va to'rt haftaligidan boshlab osilgan to'sin bo'ylab yurish qobiliyati sinovdan o'tkazildi. Sichqonlar 9 haftalikkacha har haftada sinovdan o'tkazildi, shundan so'ng PBS bilan davolangan woozy sichqonlari testni bajarishga qodir emas edi. Boshqa guruhlarga tegishli sichqonlar 12, 16, 20 va 24 haftaligida qayta sinovdan o'tkazildi. Ustunlar orqa oyoq qadam xatolari sonining (A) va to'sinni kesib o'tish uchun talab qilinadigan vaqtning (B) o'rtacha ± SEM qiymatini ko'rsatadi. (A) da F(4.420, 44.20) = 7.994, P &amp;lt; 0.0001; (B) da ikki tomonlama RM ANOVA (1-9 hafta) bo'yicha F(6.050, 60.50) = 5.038, P = 0.0003; Dunnett post-hoc testi bo'yicha *P &amp;lt; 0.05, **P &amp;lt; 0.01, ***P &amp;lt; 0.001, ****P &amp;lt; 0.0001; (C) Xuddi shu hayvonlar 4 haftaligida (boshlang'ich daraja) va keyinchalik 9 haftalikdan boshlab har haftada tezlashuvchi rotarodda sinovdan o'tkazildi. Ustunlar yiqilishgacha bo'lgan o'rtacha ± SEM latensiyasini (s) ko'rsatadi. F(3.169, 30.10) = 26.62, P &amp;lt; 0.0001; Dunnett post-hoc testi bo'yicha *P &amp;lt; 0.05, **P &amp;lt; 0.01, ***P &amp;lt; 0.001, ***&lt;em&gt;P &amp;lt; 0.0001. (A) dagi afsona barcha panellarga tegishli.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-f5.jpg\" alt=\"5-rasm. PHP.eB-CAG-moSIL1 va PHP.eB-CAG-huSIL1 ning ichki qorincha ichiga yuborilishi woozy sichqonlarida PC degeneratsi\" /&gt;&lt;/p&gt;\n&lt;p&gt;*5-rasm. PHP.eB-CAG-moSIL1 va PHP.eB-CAG-huSIL1 ning ichki qorincha ichiga yuborilishi woozy sichqonlarida PC degeneratsiyasini qutqaradi. (A) PBS, PHP.eB-CAG-moSIL1 yoki PHP.eB-CAG-huSIL1 bilan davolangan 26 haftalik CT yoki woozy sichqonlarida kalbindin uchun immunohistokimyoviy tahlil. O'lchov chizig'i 100 mkm. (B) Miyachak poʻstlogʻida kalbindin-musbat sohaning foizi. Ma'lumotlar har bir eksperimental guruhdan 5-6 sichqonning 3 miya kesmasining o'rtacha ± SEM qiymatidir. Ikki tomonlama ANOVA bo'yicha F(2, 7) = 20.98, P = 0.0011; Dunnett post-hoc testi bo'yicha **P &amp;lt; 0.01, ***P &amp;lt; 0.001. (C) Molekulyar qatlam qalinligi. Ma'lumotlar o'rtacha ± SEM. Ikki tomonlama ANOVA bo'yicha F(2, 7) = 56.45, P &amp;lt; 0.0001; Dunnett post-hoc testi bo'yicha ***P &amp;lt; 0.001, ***&lt;em&gt;P &amp;lt; 0.0001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-f6.jpg\" alt=\"6-rasm. PHP.eB-CAG-moSIL1 va PHP.eB-CAG-huSIL1 ning miya qorinchalariga yuborilishi astrositlar faollashuvini kamaytirad\" /&gt;&lt;/p&gt;\n&lt;p&gt;*6-rasm. PHP.eB-CAG-moSIL1 va PHP.eB-CAG-huSIL1 ning miya qorinchalariga yuborilishi astrositlar faollashuvini kamaytiradi. (A) 26 haftalik yoshdagi PBS, PHP.eB-CAG-moSIL1 yoki PHP.eB-CAG-huSIL1 bilan davolangan CT yoki woozy sichqonlarida GFAP uchun immunohistokimyoviy tahlil. Masshtab chizig'i 100 mkm. (B) Miyakച്ചa qobig'ining molekulyar qatlamida GFAP-musbat maydonning foizi. Ma'lumotlar har bir eksperimental guruhdagi 4-8 sichqonlarning 3 ta miya kesmasidan olingan o'rtacha ± SEM qiymatlarini bildiradi. Kraskel-Uollis testi bo'yicha P &amp;lt; 0.0001; Dunn post-hoc testi bo'yicha **&lt;em&gt;P &amp;lt; 0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-f7.jpg\" alt=\"7-rasm. PHP-CAG-SIL1 yuborilgan woozy sichqonlarida mushak funksiyasining yaxshilanishi kuzatiladi. PBS, PHP.eB-CAG-moSI\" /&gt;&lt;/p&gt;\n&lt;p&gt;*7-rasm. PHP-CAG-SIL1 yuborilgan woozy sichqonlarida mushak funksiyasining yaxshilanishi kuzatiladi. PBS, PHP.eB-CAG-moSIL1 va PHP.eB-CAG-huSIL1 bilan davolangan hayvonlar mos ravishda 20 va 25 haftalik yoshida panjarada osilib turish (A) va tutish kuchi (B) testlaridan o'tkazildi. Ma'lumotlar o'rtacha ± SEM qiymatlarini bildiradi. (A) da: Kraskel-Uollis testi bo'yicha P &amp;lt; 0.0001; Dunn post-hoc testi bo'yicha ***P &amp;lt; 0.001. (B) da: Kraskel-Uollis testi bo'yicha P = 0.0033; Dunn post-hoc testi bo'yicha &lt;em&gt;P &amp;lt; 0.05.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-f8.jpg\" alt=\"8-rasm. AAV-SIL1 yuborilishi woozy sichqonlarining son to'rt boshli mushak tolalaridagi ultrastrukturali o'zgarishlarni \" /&gt;&lt;/p&gt;\n&lt;p&gt;*8-rasm. AAV-SIL1 yuborilishi woozy sichqonlarining son to'rt boshli mushak tolalaridagi ultrastrukturali o'zgarishlarni kamaytiradi. (A) 26 haftalik yoshdagi PBS va AAV bilan davolangan sichqonlarning son to'rt boshli mushagi ultrastrukturasi. PBS bilan davolangan CT sichqonlarida normal miofibrillar (i) va perinuklear (v) mushak tolasi ultrastrukturasining vakillik misollari; erituvchi (ii) yoki sichqon (iii) yoxud odam (iv) SIL1 ni kodlovchi AAVlar bilan davolangan woozy sichqonining miofibrillar komparktida sarkoplazmatik retikulumning patologik kengayishi; PBS (vi) yoki sichqon (vii) yoxud odam (viii) SIL1 ni kodlovchi AAVlar bilan davolangan woozy sichqonining skelet mushaklarida mielinga o'xshash membranali materialni o'z ichiga olgan perinuklear avtofagik vakuolalar (oq o'qlar). Masshtab chizig'i 1 mkm. (B) Turli guruh sichqonlarida sarkoplazmatik retikulum (SR) egallagan miofibrillar maydonning foizi. Ma'lumotlar o'rtacha ± SEM qiymatlarini bildiradi. Ikki omilli ANOVA bo'yicha F(3, 8) = 101.7, P &amp;lt; 0.0001; Dunnett post-hoc testi bo'yicha ****P &amp;lt; 0.0001. (C) Perinuklear ultrastrukturali o'zgarishlarga ega bo'lgan yadro foizi. Ma'lumotlar o'rtacha ± SEM qiymatlarini bildiradi. Ikki omilli ANOVA bo'yicha F(3, 8) = 45.75, P &amp;lt; 0.0001; Dunnett post-hoc testi bo'yicha ***&lt;em&gt;P &amp;lt; 0.0001.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;SIL1&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;mutatsiyasi&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;neyronlar&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;halokatiga&lt;/text&gt;&lt;text x=\"26\" y=\"162\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;olib kelad&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=
