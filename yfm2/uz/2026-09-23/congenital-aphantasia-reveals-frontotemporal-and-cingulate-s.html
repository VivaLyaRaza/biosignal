        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"219\" cy=\"159\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"681\" cy=\"207\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Afaziya va ong: nima uchun&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ba'zilar tasavvur qila&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;olmaydi?&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-f1.jpg\" alt=\"1-rasm. Traktometriya afantaziyada oq modda mikrostrukturasining tanlab olingan farqlarini ochib beradi. (A) Vizualizato\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. Traktometriya afantaziyada oq modda mikrostrukturasining tanlab olingan farqlarini ochib beradi. (A) Vizualizatorlarga nisbatan afantaziyasi bo'lgan shaxslarda fraksion anizotropiyasi (FA) kamaygan traktlar (Vis. &amp;gt; Aph.): chap ilmoqsimon tutam (UF), o'ng UF va orqa interparietal korpus kallozum. Yuqori panellar trakt profillarini (o'rta ± SEM) ko'rsatadi; pastki panellar segment holatiga ko'ra rang bilan kodlangan (1-100 tugunlar) vakil ishtirokchining trakt rekonstruksiyalarini ko'rsatadi. Qizil chiziqlar afantaziyasi bo'lgan shaxslarni, ko'k chiziqlar esa vizualizatorlarni bildiradi. Soya qilingan kulrang hududlar sezilarli guruh farqlarini ko'rsatuvchi segmentlarni belgilaydi (p &amp;lt; 0.05, FWE tuzatilgan). (B) Vizualizatorlarga nisbatan afantaziyasi bo'lgan shaxslarda FA ortgan traktlar (Aph. &amp;gt; Vis.): chap va o'ng dorsal belbog'li tutam. Yuqori panellar trakt profillarini (o'rta ± SEM) ko'rsatadi; pastki panellar segment holatiga ko'ra rang bilan kodlangan vakil trakt rekonstruksiyalarini ko'rsatadi. Qizil chiziqlar afantaziyasi bo'lgan shaxslarni, ko'k chiziqlar esa vizualizatorlarni bildiradi. Soya qilingan kulrang hududlar va x o'qidagi qora chiziqlar sezilarli segmentlarni belgilaydi (p &amp;lt; 0.05, FWE tuzatilgan). Yupqa chiziqlar alohida ishtirokchilar profillarini, qalin chiziqlar esa guruh o'rtachalarini ko'rsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Ko'pchilik ko'zini yumib olmani tasavvur qilganda uning obrazini ko'radi, biroq tug'ma afantaziyaga ega kishilarda bu qobiliyat umuman yo'q. Ular ko'rish qobiliyatiga ega bo'lsa-da, ongida tasvir hosil qilolmaydi. Ilgari bu holat ko'rish zonalari bilan bog'liq deb o'ylangan edi, biroq yangi MRT ma'lumotlari boshqa sabablarni ko'rsatmoqda.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Tug'ma afantaziyada peshona-chakka oq modda yo'llari o'zgargan&lt;/li&gt;\n&lt;li&gt;Asosiy ko'rish yo'llari va birlamchi vizual qobiq saqlanib qolgan&lt;/li&gt;\n&lt;li&gt;Farqlar yuqori darajadagi integratsiya tarmoqlariga borib taqaladi&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tug'ma afantaziya ixtiyoriy vizual obrazlarni yaratishning umrbod mavjud emasligi bilan tavsiflanadi. Bunda insonning ko'rish bilimi va idroki to'liq saqlanib qolgan bo'ladi. Ilmiy jamoatchilik bu holatni ikki xil tushuntirgan edi: vizual yo'llarning o'zgarishi yoki yuqori tartibli associativ tarmoqlarning ishi.&lt;/p&gt;\n&lt;p&gt;Ushbu savolga javob topish uchun tadqiqotchilar 18 nafar tug'ma afantaziyali va 18 nafar nazorat guruhidagi vizualizatsiya qiluvchi shaxslarni tekshirdilar. Diffuzion va strukturaviy MRT yordamida oq modda traektoriyalari, graflarga asoslangan tarmoq tashkiloti va miya po'stlog'i o'rganildi. Natijada afantaziyaga ega shaxslarda peshona-chakka va belbog'li oq modda yo'llarida structural farqlar aniqlandi.&lt;/p&gt;\n&lt;p&gt;Shu bilan birga, erta ko'rish po'stlog'i yoki asosiy ko'rish traektoriyalarida guruhlar orasida sezilarli farqlar topilmadi. Kichik tanlanma hajmi sababli bu natijalar hozircha taxminiy xarakterga ega va kattaroq guruhlarda tekshirilishi kerak.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tanlanma hajmi kichik (18 kishi), shuning uchun natijalar qo'shimcha tekshiruvni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Туғма афантазия визуал билимлар сақланган ҳолда, ихтиёрий кўриш образининг умрбод йўқлиги билан тавсифланади. Бу сенсор тасвирлар ва онгли тасаввурни бир-биридан ажратиб ўрганиш учун табиiy модель бўлиб хизмат қилади. Функционал нейровизуал тадқиқотлар бу ҳолат юқори даражадаги бошқарув тизимлари ва олий кўрув мия қавати ўртасидаги пастга йўналтирилган ўзаро таъсирларнинг ўзгариши билан боғлиқ бўлиши мумкинлигини кўрсатмоқда, аммо унинг анатомик тузилиши ҳали номаълум эди.&lt;/p&gt;\n&lt;h4 id=\"usullar\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Усуллар&lt;/span&gt;&lt;/a&gt;Усуллар&lt;/h4&gt;\n&lt;p&gt;Туғма афантазиянинг иккита рақобатдош гипотезасини текшириш учун — бири кўрув йўлларида, иккинчиси эса юқори даражадаги ассоциатив тармоқларда структур фарқлар мавжудлигини тахмин қилади — муаллифлар диффузион ва структур МРТ усулларидан фойдаланишди. Тадқиқотда туғма афантазияга эга бўлган 18 нафар шахс ва уларга мос келувчи визуал тасаввур қилиш қобилиятига эга 18 нафар назорат гуруҳи иштирок этди. Оқ модда микротузилмаси, функционал қизиқиш соҳалари асосида трактография, граф-назарий тармоқ ташкили ва мия қавати морфометрияси бўйича мультимодаль таҳлиллар бажарилди.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Трактография — инсон миясидаги оқ модданинг ўтказувчи йўлларини уч ўлчамли фазода қайта тиклаш ва ўрганиш имконини берувчи МРТ усули.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"natizhalar\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#natizhalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Натижалар&lt;/span&gt;&lt;/a&gt;Натижалар&lt;/h4&gt;\n&lt;p&gt;Афантазияга чалинган шахсларда пешона-висоқ ва бел қисмидаги оқ модда йўлларида, жумладан, илмоқсимон тутамда (uncinate fasciculus), орқа оралиқ тепалик каллез толаларида ва дорсал сингулумда структур фарқлар аниқланди. Шунингдек, олдинги оролиқ, олдинги префронтал мия қавати ва медиал висоқ қаватини ўз ичига олган фронтотемпорал мия соҳаларида ҳам ўзгаришлар қайд этилди. Ушбу топилмалар афантазиянинг кенг когнитив-аффектив профили учун нейроанатомик асос бўла олади.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Олимлар эрта давр кўрув қаватида, асосий кўрув йўлларида ёки асосий тасаввур тармоғининг тўғридан-тўғри структур боғланишларида гуруҳлар ўртасида сезиларли фарқларни аниқламадилар.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"muokama\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#muokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Муҳокама&lt;/span&gt;&lt;/a&gt;Муҳокама&lt;/h4&gt;\n&lt;p&gt;Демак, туғма афантазия асосий кўрув йўлларига тегмаган ҳолда, асосан пешона-висоқ ва бел тизимларидаги структур ўзгаришлар билан тавсифланади.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Танланма ҳажмининг кичиклиги сабабли, бу натижалар тадқиқот ва гипотеза яратувчи характерга эга бўлиб, катта гуруҳларда қайта текширилиши лозим.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Шунга қарамай, бу маълумотлар онгли равишда тасаввур қилиш қобилиятининг йўқлигига визуал тасвирларнинг ўзи эмас, балки интеграция ва онгли киришни таъминловчи юқори даражадаги тизимлар сабаб бўлиши мумкинлигини кўрсатади.&lt;/p&gt;\n&lt;h3 id=\"kirish1\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#kirish1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Tug'ma afantaziya, ya'ni ixtiyoriy vizual tasvirlarni butun umr davomida tasavvur qila olmaslik holati, aholining taxminan 2–4% qismida uchraydi. Bu holat hayratlanarli aql bovar qilmaydigan paradoksni keltirib chiqaradi: afantaziyaga ega shaxslar xotidadan narsalarning vizual xususiyatlarini aniq tiklay oladi va ko'plab vizual tasavvur vazifalarini muvaffaqiyatli bajaradi, biroq subyektiv vizualizatsiya tajribasi yo'qligini yoki juda kamligini bildiradi. Bunday tafovut vizual bilimdan foydalanish imkoniyati tasvirlarning fenomenologik tajribasi bo'lmagan taqdirda ham saqlanib qolishini ko'rsatadi. Shu boisdan tug'ma afantaziya ichki hosil qilingan tasvirlarni ongli vizual tajribaga aylantirish uchun qanday yuqori darajadagi mexanizmlar zarurligini tushunish uchun qulay model vazifasini o'taydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tug'ma afantaziya aholining 2–4% qismiga ta'sir qiladi va xotiradan ma'lumotlarni tiklash saqlangan holda subyektiv vizual tajribaning yo'qligi bilan ajralib turadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Vizual tasvirlar yo'qligidan tashqari, afantaziya turlicha namoyon bo'ladigan umrbod kognitiv va xulq-atvor belgilarini o'z ichiga oladi. Funksional tadqiqotlar shuni ko'rsatadiki, afantaziyali shaxslar tarjimai hol xotiralarini tiklashda kamroq fenomenologik tafsilotlarni eslaydi, bu esa gippokamp va ensa qismi o'rtasidagi funksional bog'liqlikning pasayishi bilan bog'liq. Xotiradan tashqari, yuzlarni tanish va hissiyotlarni anglashda buzilishlar kuzatiladi, takrorlanuvchi xotiralar esa ancha kam hollarda vizual shaklga ega bo'ladi. Bularning barchasi afantaziya birlamchi vizual hududlardan tashqaridagi keng tarqalgan yuqori tartibli tizimlarni qamrab olishini bildiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Afantaziya — bu insonning ongli ravishda aqliy obrazlar yarata olmasligi bilan bog'liq neyropsixologik holat.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;So'nggi nazariyalar afantaziyani tuzilish va funksional bog'liqliklarning keng ko'lamda kamayishi bilan tavsiflanadigan umumiy neyrorivojlanish mexanizmlari bilan bog'laydi. Shunga qaramay, ushbu keng kognitiv-affektiv profilning umumiy anatomik asosga ega ekanligi hozircha noma'lumligicha qolmoqda. Tug'ma prozopagnoziya, DEPA va autizm spektri kabi boshqa neyrorivojlanish holatlarida ham shunga o'xshash xususiyatlar bosh miya shikastlanishlarisiz oq modda mikrostruktura o'zgarishlari bilan izohlanadi. Shu sababli strukturali neyrovizualizatsiya afantaziyadagi funksional o'zgarishlar shunga o'xshash neyroanatomik asosga ega ekanligini tekshirish uchun muhim vosita hisoblanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Afantaziyaning keng kognitiv profili miyaning turli tarmoqlaridagi ehtimoliy tuzilmaviy farqlarga ishora qilsa-da, uning aniq anatomik asosi hali to'liq o'rganilmagan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Afantaziya bo'yicha neyrovizualizatsiya tadqiqotlari vizual obrazlarning yo'qligini tushuntiruvchi uchta raqobatdosh farazni ilgari suradi. Birinchisi — sensor kuch nazariyasi — bu holat ilk ko'rish zonalari va ularning yo'llaridagi o'zgarishlar tufayli kelib chiqib, ichki tasvirlarning sensor kuchini kamaytirishini taxmin qiladi. Buni binokulyar raqobatdagipraymingeffektiningyo'qligiva tasavvur qilish vazifalarida qorachiq hajmi kabi fiziologik signallarning kamayishi tasdiqlaydi. Qolaversa, V1 zonasida kross-dekodlashning o'zgargani mental obrazlarning idrok etish formatiga etib bormasligini ko'rsatadi.&lt;/p&gt;\n&lt;p&gt;Ikkinchi, ongli kirish nazariyasi miyaning yuqori qismlaridan pastga yo'naltirilgan regulyatsiyaning buzilishiga urg'u beradi. Afantaziyasi bor kishilarda yuqori vizual zonalardagi faollik saqlansa-da, fuziform tasavvur tuguni (FIN) va chap prefrontal sohalar, jumladan, oldingi prefrontal kora (aPFC) hamda peshona ko'z maydoni (FEF) o'rtasidagi funksional bog'liqlik pasaygan. E'tibor va salohiyat zonalari ichki signallarni kuchaytirishda muhim bo'lib, oldingi insula dorzal e'tibor va standart rejim tarmoqlari o'rtasidagi o'tishni boshqaradi. Ushbu yondashuv yuqori darajadagi vizual zonalarda idrok va tasavvur vakilliklarining kesishishi kamayganligi bilan qo'llab-quvvatlanadi.&lt;/p&gt;\n&lt;h4 id=\"afantaziya-gipotezalari-va-tadqiqot-maqsadlari\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#afantaziya-gipotezalari-va-tadqiqot-maqsadlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Afantaziya gipotezalari va tadqiqot maqsadlari&lt;/span&gt;&lt;/a&gt;Afantaziya gipotezalari va tadqiqot maqsadlari&lt;/h4&gt;\n&lt;p&gt;Uchinchi mavqye — ixtiyoriy generatsiya konsepsiyasi — afantaziyani obrazlarni ongli ravishda ishga tushirishdagi o'ziga xos nuqson sifatida izohlaydi, chunki ko'plab afantaziyaga uchraganlar uyg'oq paytda obrazlarsiz bo'lsa-da tush ko'rishlarini bildirishadi. Ushbu nazariya sensor tasvirlar umuman hosil bo'lmasligini taxmin qilsa, ongli kirish nazariyasi ularning hosil bo'lishi, ammo anglash darajasigacha kuchaytirilmasligini taxmin qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Afantaziya bo'yicha uchta asosiy ilmiy qarash mavjud: ilk vizual yo'llar nuqsoni, yuqori zonalardan ongli kirishning buzilishi va ixtiyoriy generatsiya mexanizmining yetishmovchiligi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bu qarashlar turli anatomik bashoratlarni beradi: lokal vizual yo'llar nazariyasi vertikal oysimon tutam (VOF), pastki bo'ylama tutam (ILF) va pastki peshona-oysimon tutamda (IFOF) farqlarni kutadi. Yuqori tartibli nazariya esa fronto-temporal yo'llar va yirik miya tarmoqlarida tafovutlarni taxmin qiladi.&lt;/p&gt;\n&lt;p&gt;Ushbu tadqiqotning maqsadi afantaziyaning kognitiv-affektiv profilining umumiy neyroanatomik belgilarini aniqlash va ongli obrazlarning yo'qligi bo'yicha raqobatdosh bashoratlarni sinovdan o'tkazishdan iborat. Buning uchun mualliflar multimodal diffuzion va T1-vaznli MRT usullarini qo'lladilar. Traktometriya, fROI asosidagi traktografiya, graf nazariyasiga tayanuvchi tarmoq tahlili va sirtga asoslangan kortikal morfometriya usullari birlashtirildi (tahlil bosqichlari S1-rasmda ko'rsatilgan).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Traktometriya — bu miya oq moddasining o'tkazuvchi yo'llari bo'ylab mikrotuzilmaviy xususiyatlarini tahlil qiluvchi va signal o'tkazishdagi xususiyatlarni aniqlovchi usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"atlasga-asoslangan-traktometriya-tanlab-olingan-mikrostrukturali-farqlarni-aniqlaydi\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#atlasga-asoslangan-traktometriya-tanlab-olingan-mikrostrukturali-farqlarni-aniqlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Atlasga asoslangan traktometriya tanlab olingan mikrostrukturali farqlarni aniqlaydi&lt;/span&gt;&lt;/a&gt;Atlasga asoslangan traktometriya tanlab olingan mikrostrukturali farqlarni aniqlaydi&lt;/h4&gt;\n&lt;p&gt;Biz atlas yordamida aniqlangan asosiy oq modda traktorlari bo'ylab fraksiyonel anizotropiyani (FA) miqdoriy baholadik, bu esa oq modda mikrostrukturasining trakt-profil o'lchovini taqdim etdi. Vizuallashtirish jarayonlarida qatnashadigan asosiy yo'llar, shu jumladan VOF, IFOF va ILF, shuningdek oliy funksiyalar bilan bog'liq traktlar, jumladan fronto-parietal e'tibor yo'llari (yuqori uzunlamasiga tutam: SLF, yoyuq tutam: AF), medial fronto-temporal yo'llar (unsinkat tutam: UF, ventral cingulum) va kognitiv nazorat yo'llari (dorsal cingulum) baholandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Fraksiyonel anizotropiya (FA) — suv molekulalarining oq modda tolalari bo'ylab qanchalik yo'naltirilgan holda tarqalishini ko'rsatuvchi ko'rsatkich bo'lib, o'tkazuvchi yo'llarning yaxlitligini aks ettiradi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu natijalarni yanada tavsiflash uchun ta'sirlangan segmentlarda aksial diffuziya (AD), radial diffuziya (RD) hamda neyrit orientatsiyasi dispersiyasi va zichligi tasvirlash (NODDI) metrikalarini o'rganib chiqdik (S2-rasm va S1-jadval). Ushbu qo'shimcha tahlillar tolalar geometriyasining artefaktlari yoki kesishuvchi tolalar emas, ayniqsa mikrostruktura farqlariga mos keldi.&lt;/p&gt;\n&lt;p&gt;O'ng SLF-II va o'ng ventral cingulum FA ning biroz pasayishini ko'rsatdi (S3-rasm); biroq, bu ta'sirlar tola geometriyasi bilan chalkashgan bo'lishi mumkin va shuning uchun keyingi talqin qilinmadi.&lt;/p&gt;\n&lt;h4 id=\"graf-nazariy-tarmoq-tahlili-buzilgan-segregatsiya-va-tarmoqlararo-markazni-aniqlaydi\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#graf-nazariy-tarmoq-tahlili-buzilgan-segregatsiya-va-tarmoqlararo-markazni-aniqlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Graf-nazariy tarmoq tahlili buzilgan segregatsiya va tarmoqlararo markazni aniqlaydi&lt;/span&gt;&lt;/a&gt;Graf-nazariy tarmoq tahlili buzilgan segregatsiya va tarmoqlararo markazni aniqlaydi&lt;/h4&gt;\n&lt;p&gt;Keyinchalik biz trakt darajasidagi farqlar miqyosli miya tarmoqlarining strukturaviy tashkil etilishiga ham ta'sir qilishini tekshirish uchun graf-nazariy tahlilni qo'lladik. Biz Schaefer 17-tarmoq parselatsiyasiga asoslangan 400 × 400 o'lchamli butun miya strukturaviy bog'liqlik matrisini yaratdik (tahlil jarayoni 2A-rasmda keltirilgan). Ushbu vaznli yo'naltirilmagan grafdan foydalanib, tarmoq tashkilotini tavsiflash uchun tugun darajasidagi metrikalarni hisobladik. Tadqiqot gipotezasidan kelib chiqib, tahlillar vizual, e'tibor, selektivlik va standart rejim tarmoqlaridagi tugunlarga qaratildi.&lt;/p&gt;\n&lt;p&gt;Guruxlararo farqlar uchta oliy tarmoq metrikasida kuzatildi (2B–D-rasmlar; S2-jadval). Afantaziyada dorsal e'tibor tarmog'ining asosiy tuguni bo'lgan chap FEF (2A-rasdagi DAN B) tugun kuchining pasayishini ko'rsatdi, bu ushbu tugunda umumiy strukturaviy bog'liqlik zaiflashganini bildiradi. Selektivlik/ventral e'tibor tarmog'ining (VAN A) qismi bo'lgan chap old insula va standart rejim tarmog'ining (Default B) chap dorsolateral prefrontal korteksi (dlPFC) kamaygan klasterizatsiya koeffitsientini ko'rsatdi, bu selektivlik va kognitiv nazorat hududlarida lokal tarmoq segregatsiyasining pasayishini anglatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Tarmoq tahlili chap FEFda tugun kuchining pasayishini, chap insula va dlPFCda klasterizatsiya koeffitsientining kamayishini, o'ng dmPFCda esa ishtirok etish koeffitsientining oshishini aniqladi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bundan farqli o'laroq, standart rejim tarmog'ining (Default A) o'ng dorsomedial prefrontal korteksi (dmPFC) oshgan ishtirok etish koeffitsientini ko'rsatdi, bu afantaziyali shaxslarda tarmoqlararo markaz kuchayganligini bildiradi. Qolaversa, o'ng somatomotor tarmoq afantaziyali shaxslarda kamaygan ishtirok etish koeffitsientini ko'rsatdi. Muqobil parselatsiyalardan foydalangan holda nazorat tahlillari bu topilmalar barcha atlas variantlarida turg'un ekanligini tasdiqladi (S5A–B-rasmlar).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Ishtirok etish koeffitsienti (participation coefficient) tugunning aloqalari turli miya tarmoqlari o'rtasida qanday taqsimlanganligini ko'rsatadi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Klasterizatsiya koeffitsientlari bo'yicha sezgirlik tahlili sezilarli guruh farqlarini topmadi (chap insula: B-M statistikasi = -0.06; chap dlPFC: B-M statistikasi = 1.30; barcha pFDR &amp;gt; 0.86), bu insula va dlPFC klasterizatsiya farqlari tarmoq topologiyasiga xos emasligini ko'rsatadi. Ular lokal klasterizatsiyaning o'zgarishidan ko'ra vaznli konnektom farqlarini aks ettirishi mumkin.&lt;/p&gt;\n&lt;p&gt;Ushbu tugunlarga to'g'ridan-to'g'ri strukturaviy ulanishlarni kuzatish shuni ko'rsatdiki, chap old insula asosan AF va IFOF orqali bog'langan (S5C-rasm), dmPFC bog'liqligi esa dorsal cingulum yo'llarini o'z ichiga olgan. Bunga qarama-qarshi ravishda, asosiy vizual yo'llarda traktometriya farqlarining yo'qligiga mos ravishda, ko'rib chiqilgan vizual korteks tugunlarida sezilarli farqlar kuzatilmadi.&lt;/p&gt;\n&lt;h4 id=\"asosiy-tasvir-tarmogining-oq-modda-ulanishlarida-farq-topilmadi\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#asosiy-tasvir-tarmogining-oq-modda-ulanishlarida-farq-topilmadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiy tasvir tarmog'ining oq modda ulanishlarida farq topilmadi&lt;/span&gt;&lt;/a&gt;Asosiy tasvir tarmog'ining oq modda ulanishlarida farq topilmadi&lt;/h4&gt;\n&lt;p&gt;Keyinchalik biz funksional xususiyatlari afantaziyada o'zgargan asosiy tasvir tarmog'ining oq modda ulanishlarini tavsifladik. Biz 7T fMRI natijalariga asoslanib fROI larni aniqladik (Liu, Zhan, et al., 2025): FIN, chap aPFC, chap OFC va o'ng old intraparietal egat (aIPS). Har bir guruhdagi to'rtta ROI ning har biri uchun (S4A-rasm) biz kulrang/oq modda chegarasidagi proyektsiyasini kesib o'tuvchi oqimlarni aniqladik va trakt tuzilishini ikki indeks yordamida baholadik: hajm bo'yicha normallashtirilgan oqimlar soni (S4B-rasm) va anatomik aniqlangan tutamlardagi oqimlar ulushi (S4C-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Xulosalar guruhlarni taqqoslash va bayes tahliliga asoslangan, biroq ayrim yo'llardagi o'zgarishlarning yo'qligini kattaroq tanlanmalarda tekshirish lozim.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bir nechta taqqoslashlar uchun tuzatishdan so'ng hech qanday indeks uchun sezilarli guruhlararo farqlar kuzatilmadi. Bayes omili (BF) tahlili dorsal va ventral vizual korteksni bog'lovchi asosiy oq modda tutami bo'lgan VOFdagi (BF = 0.32) hajm bo'yicha normallashtirilgan oqimlar sonida guruh farqi yo'qligiga o'rtacha dalil berdi. Umuman olganda, bu topilmalar asosiy tasvir tarmog'idagi to'g'ridan-to'g'ri strukturaviy ulanishlarda ishonchli o'zgarishlar yo'qligini ko'rsatadi.&lt;/p&gt;\n&lt;h4 id=\"kortikal-qalinlik-chap-apfcda-kamaygan,-limbik-hududlarda-oshgan\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#kortikal-qalinlik-chap-apfcda-kamaygan,-limbik-hududlarda-oshgan\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kortikal qalinlik: chap aPFCda kamaygan, limbik hududlarda oshgan&lt;/span&gt;&lt;/a&gt;Kortikal qalinlik: chap aPFCda kamaygan, limbik hududlarda oshgan&lt;/h4&gt;\n&lt;p&gt;Nihoyat, biz butun miya bo'ylab kortikal qalinlikni o'rganib chiqdik. Avvalgi ishlar prefrontal va erta vizual kortikal qalinlikni obrazli tasavvur qilishning yorqinligidagi individual farqlar bilan bog'lagan edi (Bergmann va boshq., 2016b). Shuning uchun biz afantaziya V1 ning qalinlashuvi yoki kattalashuvi bilan bog'liqligini tekshirib ko'rdik.&lt;/p&gt;\n&lt;h4 id=\"qora-qobigi-morfometriyasi-va-oq-modda-mikrostrukturasi\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#qora-qobigi-morfometriyasi-va-oq-modda-mikrostrukturasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qora qobig'i morfometriyasi va oq modda mikrostrukturasi&lt;/span&gt;&lt;/a&gt;Qora qobig'i morfometriyasi va oq modda mikrostrukturasi&lt;/h4&gt;\n&lt;p&gt;Erta ko'rish markazlarining hech birida qobig'i qalinligi yoki hajmi bo'yicha sezilarli farqlar aniqlanmadi, Bayes omillari (BF) ham taqsimot chuqurligi (Kalkarin qobig'i, S3-jadval) va V1 (S4-jadval) bo'yicha guruhlar ekvivalentligini o'rtacha darajada tasdiqladi. Aksincha, butun miya bo'ylab o'tkazilgan tahlil afantaziya guruhida chap oldingi prefrontal qobig'ining (aPFC) qalinligi kamaygan yagona muhim prefrontal klasterni ko'rsatdi (3A-rasm). Klasterning statistik ko'rsatkichlari S5-jadvalda keltirilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Afantaziyada chap aPFC qalinligining kamayishi va medial vaqtinchalik limbik sohalarda qalinlikning ortishi, shuningdek NODDI ma'lumotlariga ko'ra oq modda mikrostrukturasidagi o'zgarishlar aniqlandi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Shu bilan birga, afantaziya ishtirokchilarida bir nechta medial vaqtinchalik limbik sohalarda, jumladan, chap oldingi paragippokamp egatida, entorinal qobiqda, shuningdek o'ng entorinal qobiqda, retrosplenial va orqa kamar qobig'ida qalinlik yuqoriroq ekanligi kuzatildi. NODDI tahlili afantaziyada ikkala medial vaqtinchalik sohalarda va chap precuneus'da yuqori NDI qiymatlarini aniqladi (S6-rasm), bu ushbu medial vaqtinchalik hududlardagi mikrostruktura farqlariga mos keladi.&lt;/p&gt;\n&lt;h4 id=\"funksional-kontekst-va-metaanalitik-dekodlash\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#funksional-kontekst-va-metaanalitik-dekodlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Funksional kontekst va metaanalitik dekodlash&lt;/span&gt;&lt;/a&gt;Funksional kontekst va metaanalitik dekodlash&lt;/h4&gt;\n&lt;p&gt;Aniqlangan qalinlik farqlarining funksional mazmunini ochib berish uchun mualliflar Neurosynth yordamida t-xaritaning metaanalitik dekodlashini amalga oshirdilar (3B-rasm). Chap aPFC klasteri «niyatlar» (r = 0.26), «harakatlar» (r = 0.25) va «yaqin (fazoviy)» (r = 0.25) tushunchalari bilan kuchli bog'liqlikni ko'rsatdi. Afantaziyada qalinligi oshgan hududlar gipokamp, paragippokamp va amigdala kabi anatomik atamalar bilan bog'liqlikni namoyon etdi (barcha r &amp;gt; 0.14), bu aniqlangan hududlar uchun qo'shimcha funksional izoh beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Metaanalitik dekodlash – bu miya faoliyatining aniqlangan koordinatalarini minglab oldingi neyrovizualizatsiya tadqiqotlari bilan taqqoslab, ehtimoliy psixologik funksiyalarni aniqlash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kop-olchovli-logistik-regressiya-tahlili\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#kop-olchovli-logistik-regressiya-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ko'p o'lchovli logistik regressiya tahlili&lt;/span&gt;&lt;/a&gt;Ko'p o'lchovli logistik regressiya tahlili&lt;/h4&gt;\n&lt;p&gt;Qidiruv tahlili sifatida guruhlarni ajratib turuvchi strukturaviy belgilarning eng ixcham kombinatsiyalarini aniqlash uchun jarima kiritilgan ko'p o'lchovli logistik regressiyadan foydalanildi. Fraksion anizotropiya (FA), qobig'i qalinligi va graf nazariyasi ko'rsatkichlari uchun alohida modellar tuzildi. Tadqiqot modellari yuqori ichki ajratish qobiliyatini ko'rsatdi, barcha egri chiziq osti maydonlari (AUC) 0.92 dan yuqori bo'ldi.&lt;/p&gt;\n&lt;p&gt;Modellar bo'yicha afantaziyaning eng kuchli mustaqil bashorat qiluvchilari quyidagilar bo'ldi: o'ng ilmoqli tutamda (uncinate fasciculus) va orqa interparietal qadoqli tana qismida kamaygan FA, chap dorsal kamar tutamida ortgan FA, chap oldingi orolda pasaygan klasterlanish koeffitsienti, chap FEF da tugun kuchining kamayishi, chap aPFC qalinligining kamayishi, shuningdek oldingi paragippokamp va retrosplenial qobiq qalinligining ortishi. To'liq model statistikasi qo'shimcha materiallarda keltirilgan.&lt;/p&gt;\n&lt;h4 id=\"geterogenlikni-tekshirish\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#geterogenlikni-tekshirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Geterogenlikni tekshirish&lt;/span&gt;&lt;/a&gt;Geterogenlikni tekshirish&lt;/h4&gt;\n&lt;p&gt;Afantaziyaning ehtimoliy xilma-xilligini hisobga olib, barcha ishtirokchilar ixtiyoriy obrazlar mavjud emasligini bildirishganiga qaramay, Levene testidan foydalangan holda har bir o'zgaruvchining dispersiyasi guruhlar orasida farq qilishini tekshirdik. Gurihlar orasida dispersiya sezilarli darajada farq qilmadi (S6-jadval), garchi har bir guruhda 18 ishtirokchi bo'lganligi sababli ushbu test geterogenlikni aniqlashda cheklangan quvvatga ega bo'lsa ham. Ishtirokchilarning aksariyati (13/18) asosiy afantaziyaga ega ekanligini bildirishdi, shuning uchun mazkur xarakteristika aynan shu kenja guruhni aks ettirishi ehtimoli yuqori.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Har bir guruhdagi kichik tanlanma hajmi (n=18) guruhlararo xilma-xillikni va individual farqlarni aniqlash imkoniyatlarini sezilarli darajada cheklaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;h4 id=\"tugma-afantaziyaning-anatomik-asoslari\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#tugma-afantaziyaning-anatomik-asoslari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tug'ma afantaziyaning anatomik asoslari&lt;/span&gt;&lt;/a&gt;Tug'ma afantaziyaning anatomik asoslari&lt;/h4&gt;\n&lt;p&gt;Ushbu tadqiqotda keltirilgan strukturaviy ma'lumotlar tug'ma afantaziya faqat yakka tartibdagi sensor vakillikning buzilishi emas, balki yuqori tartibli prefrontal tizimlar va yuqori darajadagi ko'rish korteksi o'rtasidagi funksional bog'liqlikning pasayishi bilan bog'liqligi haqidagi gipotezani tasdiqlovchi ilk to'g'ridan-to'g'ri anatomik dalillar hisoblanadi. Traktometriya, tarmoq tahlili va kortikal morfometriyani o'z ichiga olgan kompleks tahlil afantaziyaga ega shaxslarda fronto-temporal va singulyar tizimlarga jamlangan tanlanma strukturaviy tafovutlarni aniqladi. Shu bilan birga, birlamchi ko'rish korteksida yoki asosiy o'rganilgan ko'rish traektoriyalarida ishonchli guruhlararo farqlar topilmadi. Ushbu natijalar tug'ma afantaziya bitta fokal hududda emas, balki tarqoq, ammo o'zaro bog'langan yuqori tartibli miya tarmoqlarida neyroanatomik o'zgarishlarni keltirib chiqarishini ko'rsatadi, bu esa uning keng kognitiv-affektiv profilini izohlashi mumkin.&lt;/p&gt;\n&lt;p&gt;Ushbu strukturaviy fenotip to'rtta asosiy kuzatuv bilan tavsiflanadi. Birinchidan, afantaziyasi bor ishtirokchilarda ilmoqsimon tutamda (UF) va posterior interparietal korpus kallozumda fraksion anizotropiyaning (FA) pasayishi qayd etildi, bu fronto-temporal va yarimsharlararo assosiativ yo'llarning o'zgarganini bildiradi. Ushbu naqsh orbitofrontal kora (OFC) va oldingi vaqtinchalik hududlar orasidagi funksional bog'liqlikning oldindan aniqlangan pasayishiga mos keladi hamda vaqtinchalik mnemotik kontentning OFC affektiv va perseptiv qayta ishlashi bilan integratsiyasining buzilishini aks ettirishi mumkin. Shuningdek, bu xususiyatlar avtobiografik xotira, yuzni tanib olish va hissiy ongning o'zgarishi kabi xulq-atvor profili bilan bog'liq bo'lishi mumkin, garchi bevosita tuzilish-funksiya munosabatlari kelgusida sinovdan o'tkazilishi kerak.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tug'ma afantaziya birlamchi vizual korteksda o'zgarishlar bo'lmagan holda, ilmoqsimon tutam va mozoqli tana FA pasayishini o'z ichiga olgan fronto-temporal hamda singulyar tizimlardagi tanlanma strukturaviy o'zgarishlar bilan tavsiflanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ikkinchidan, dorsal singulumda FA va nevritlar zichligining oshishi kognitiv nazorat yo'lining tashkiliy o'zgarishlarini ko'rsatadi. Ushbu o'zgarish o'zgargan yuqoridan-pastga (top-down) boshqaruvning ichki hosil qilingan tasvirlarga ongli erishishga ta'sir qilishini aks ettirishi mumkin. Uchinchidan, tarmoq darajasida afantaziya chap oldingi orolchada (insula) lokal segregatsiyaning pasayishi, frontal assosiativ zonalarda bog'liqlik metrikalarining o'zgarishi va o'ng dmPFC da tarmoqlararo markaziy tugunlarning oshishi bilan birga keldi. Ushbu topilmalar e'tibor, salizlik va sukut rejimi tarmoqlarining tashkiliy o'zgarishlariga ishora qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Fraksion anizotropiya (FA) — miya to'qimalarida suv diffuziyasining yo'nalishini o'lchaydigan ko'rsatkich bo'lib, oq moddaning yaxlitligi va miyelinlanish darajasini aks ettiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;To'rtinchidan, chap aPFC da qalinligi tanlab kamaygani aniqlandi — bu hudud afantaziyada funksional ravishda uzilganligi oldin aniqlangan edi. Aksincha, entorinal va retrosplenial korteksni o'z ichiga olgan medial vaqtinchalik limbik hududlarda kortikal qalinlik oshgan bo'lib, ular fazoviy navigatsiya, epizodik xotira va sahna yaratish uchun muhimdir. Umumiy holda, traktlar va tarmoqlar bo'yicha topilmalar kuzatilgan strukturaviy farqlarni asosan fronto-temporal va singulyar tizimlarga lokalizatsiya qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ushbu natijalar korrelyatsion xarakterga ega bo'lib, faqat tug'ma afantaziya uchun olingan; sababiy bog'liqliklarni isbotlash uchun pronditudinal tadqiqotlar zarur.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tasavvur-va-afantaziya-boyicha-uch-bosqichli-model\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#tasavvur-va-afantaziya-boyicha-uch-bosqichli-model\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tasavvur va afantaziya bo‘yicha uch bosqichli model&lt;/span&gt;&lt;/a&gt;Tasavvur va afantaziya bo‘yicha uch bosqichli model&lt;/h4&gt;\n&lt;p&gt;Olingan natijalar ongli tasavvur qilishning ko‘p bosqichli modeliga (Liu, 2026) mos keladi. Ushbu konsepsiyaga ko‘ra, tasavvur uchta jarayonga tayanadi: ichki vizual tasvirlarni generatsiya qilish, ularni yaxlit obyekt yoki sahnalarga integratsiya qilish va ongli kirish uchun ushbu kontentni kuchaytirish. Funksional neyrovizualizatsiya shuni ko‘rsatadiki, birinchi bosqich — generatsiya — afantaziyasi bo‘lgan shaxslarda saqlanib qolgan: tasavvur qilish vazifalarida vizual korteks faollashadi, bu ehtimol semantik va epizodik xotiradan ma’lumotlarni olish bilan bog‘liq. Bizning ROI tahlilimiz guruhlar o‘rtasida asosiy tasavvur tarmog‘idagi strukturaviy bog‘liqlikda farqlar yo‘qligini tasdiqlaydi. Xulq-atvor ma’lumotlari ham shuni ko‘rsatadiki, afantaziyasi bor odamlar yorqin tasvirlar bo‘lmasa ham, vizualizatorlar kabi xaritalarni aqliy tadqiq qilishda maqsadli ko‘z harakatlarini amalga oshiradilar (Takamura et al., 2026).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Afantaziyada vizual tasvirlarni generatsiya qilish saqlanib qolgan, ammo keyingi integratsiya va ongli kirish buzilgan, bu afantaziklarning ixtiyoriy ravishda sensorli tasvirlarni yarata olmasligi haqidagi gipotezani rad etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"integratsiya,-kuchaytirish-va-prefrontal-korteksning-roli\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#integratsiya,-kuchaytirish-va-prefrontal-korteksning-roli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Integratsiya, kuchaytirish va prefrontal korteksning roli&lt;/span&gt;&lt;/a&gt;Integratsiya, kuchaytirish va prefrontal korteksning roli&lt;/h4&gt;\n&lt;p&gt;Ushbu model doirasida afantaziyada tasvirlar yorqinligining pasayishi integratsiyaning buzilishi bilan, ongli kirishning cheklanishi esa diqqatni kuchaytirishdagi kamchiliklar bilan izohlanadi. Oldingi prefrontal korteks (aPFC) ushbu jarayon regulyatori roli uchun asosiy nomzoddir. Biz ushbu sohada korteks qalinligining kamayishini aniqladik, bu chap aPFC va vizual korteksning yuqori bo‘limlari o‘rtasidagi funksional aloqaning pasayishi haqidagi ma’lumotlarga mos keladi (Liu &amp;amp; Bartolomeo, 2025). aPFC ning roli tasvirlarni generatsiya qilishda emas, balki ixtiyoriy nazorat va kontentni tanlashda namoyon bo‘ladi. Ongli tushlar bilan o‘xshashlik, ya’ni aPFC faolligi tushning yorqinligi va ravshanligini nazorat qilish bilan bog‘liqligi, afantaziyada aynan nazorat mexanizmi zarar ko‘rishini, tasvirlarni noixtiyoriy generatsiya qilish qobiliyati emasligini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;aPFC (oldingi prefrontal korteks) — rejalashtirish, o‘z-o‘zini anglash va diqqatni boshqarish kabi yuqori kognitiv funksiyalar uchun javobgar bo‘lgan miya sohasi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tasavvur-va-xotira-ortasidagi-neyroanatomik-bogliqliklar\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#tasavvur-va-xotira-ortasidagi-neyroanatomik-bogliqliklar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tasavvur va xotira o‘rtasidagi neyroanatomik bog‘liqliklar&lt;/span&gt;&lt;/a&gt;Tasavvur va xotira o‘rtasidagi neyroanatomik bog‘liqliklar&lt;/h4&gt;\n&lt;p&gt;Uch bosqichli model afantaziyaning epizodik xotira buzilishlari bilan bog‘liqligini tushuntirishga imkon beradi. Bizning kanca simon tutam (uncinate fasciculus), shuningdek, entorinal va retrosplenial korteksdagi strukturaviy o‘zgarishlar haqidagi ma’lumotlarimiz afantaziya patofiziologiyasiga mnemonik tizimlarning jalb qilinganligini ko‘rsatadi. Bu shuni ko‘rsatadiki, frontal-temporal nazorat tarmoqlari va xotira tizimlaridagi umumiy neyroanatomik o‘zgarishlar har ikkala fenotipning asosida yotadi. Biroq, bizning ma’lumotlarimiz strukturaviy xususiyatga ega bo‘lgani uchun, ular axborotni qayta ishlashning qaysi bosqichi buzilishning birlamchi bo‘g‘ini ekanligini aniq belgilashga imkon bermaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ushbu tadqiqot strukturaviy ma’lumotlarga (MRT) asoslangan bo‘lib, ular korrelyatsiyalarni namoyish etadi, ammo aniq anatomik o‘zgarishlar va tasavvur bosqichlarining buzilishi o‘rtasidagi sabab-oqibat bog‘liqligini isbotlamaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"birlamchi-koruv-postlogining-roli-va-tarkibiy-ozgarishlar\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#birlamchi-koruv-postlogining-roli-va-tarkibiy-ozgarishlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Birlamchi ko‘ruv po‘stlog‘ining roli va tarkibiy o‘zgarishlar&lt;/span&gt;&lt;/a&gt;Birlamchi ko‘ruv po‘stlog‘ining roli va tarkibiy o‘zgarishlar&lt;/h4&gt;\n&lt;p&gt;V1 sohasidagi sezilarli tarkibiy farqlarning yo‘qligi birlamchi ko‘ruv po‘stlog‘i vizual tasavvurlar uchun zarur emasligi haqidagi dalillarga mos keladi. Kortikal ko‘rlik bilan og‘rigan bemorlarda o‘tkazilgan tadqiqotlar shuni ko‘rsatadiki, V1 shikastlanishi vizual tasavvurning yo‘qolishiga olib kelmasligi mumkin. Zamonaviy nazariyalarga ko‘ra, V1 faoliyati yuqori darajadagi tarmoqlar tomonidan boshqariladigan inhibitiv signallar orqali tartibga solinadi. Afantaziyadagi V1 faoliyatining o‘zgarishi birlamchi nuqson emas, balki yuqori darajadagi tarmoqlar modulyatsiyasining buzilishi bo‘lishi mumkin. Bizning ma’lumotlarimiz va Bayes omillari ko‘pgina erta vizual zonalarning ekvivalentligini ko‘rsatadi, garchi sirtqi U-simon tolalar hali ham o‘rganilishi kerak.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;V1 sohasida tarkibiy farqlarning yo‘qligi afantaziya birlamchi sensorli ishlov berish emas, balki yuqori darajadagi kognitiv tarmoqlar disfunksiyasi bilan bog‘liqligini tasdiqlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"neyroanatomik-ozgarishlar-naqshlari\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#neyroanatomik-ozgarishlar-naqshlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Neyroanatomik o‘zgarishlar naqshlari&lt;/span&gt;&lt;/a&gt;Neyroanatomik o‘zgarishlar naqshlari&lt;/h4&gt;\n&lt;p&gt;Aniqlangan o‘zgarishlar yagona nuqson naqshini tashkil etmaydi. Afantaziyada ba’zi tuzilmalarning hajmi asosan medial kortikal va singulyar hududlarda (dorsal singulum, singulyar po‘stloq, medial prefrontal po‘stloq) ortgan. Bu kognitiv nazorat va xotira tizimlarining qayta tashkil etilganligini ko‘rsatishi mumkin. Bunday o‘zgarishlar kompensator xususiyatga ega bo‘lishi mumkin, chunki afantaziyaga ega shaxslar vizual tasavvur talab qiladigan vazifalarda muqobil strategiyalardan foydalanadilar va oldingi singulyar po‘stloq hamda gippokamp o‘rtasida yuqori funksional bog‘liqlikni namoyish etadilar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Bayes omili — ma’lumotlar farqlar yo‘qligi (ekvivalentlik) gipotezasini qanchalik qo‘llab-quvvatlashini baholashga imkon beruvchi statistik ko‘rsatkich.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"talqin-va-cheklovlar\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#talqin-va-cheklovlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Talqin va cheklovlar&lt;/span&gt;&lt;/a&gt;Talqin va cheklovlar&lt;/h4&gt;\n&lt;p&gt;Natijalarning kognitiv talqini bilvosita bo‘lib qolmoqda, chunki nazorat tarmoqlari funksiyalari bir xil ishtirokchilarda mustaqil baholanmagan. Afantaziyaning fenotipik geterogenligi kelajakda kattaroq namunalar bilan ishlashni talab qiladi. Shuningdek, diffuzion MRT modelga asoslangan baholashlarni taqdim etishini, to‘g‘ridan-to‘g‘ri biologik ko‘rsatkichlar emasligini hisobga olish kerak. Shunga qaramay, po‘stloq qalinligini baholash uchun T1-vaznli MRT ma’lumotlaridan foydalanish xulosalar ishonchliligini oshiradi. Umuman olganda, tadqiqot shuni ko‘rsatadiki, ongli tasavvurning tarkibiy asosi sensorli tasvirlarda emas, balki yuqori darajadagi integrativ tizimlarda joylashgan.&lt;/p&gt;\n&lt;h3 id=\"usullar1\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#usullar1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"participants\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#participants\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Participants&lt;/span&gt;&lt;/a&gt;Participants&lt;/h4&gt;\n&lt;p&gt;O'z-o'zidan xabar qilingan tug'ma afantaziya holatiga ega 18 nafar shaxs (o'rtacha yoshi va og'ishish ko'rsatkichi 31.79 ± 12.11 yosh; 11 nafari ayol) va 18 nafar odatiy vizualizator (32.29 ± 9.53 yosh; 15 nafari ayol) tadqiqotga jalb qilindi. Afantaziyali 10 nafar ishtirokchi va 5 nafar vizualizator avvalroq ruhiy obrazlar bo'yicha 7 Tesla fMRI tadqiqotida qatnashgan edi. Har bir guruh uchun 18 kishidan iborat tan hajm aholining taxminan 2–4% qismini tashkil etuvchi tug'ma afantaziyani yig'ishdagi cheklovlar bilan bog'liq bo'lib, bu o'xshash tug'ma holatlardagi asosiy strukturaviy MRI tadqiqotlariga mos keladi. Barcha ishtirokchilar vizual obrazlarning aniqligi so'rovnomasini (VVIQ) yakunladilar; u 1 balldan («umuman obraz yo'q») 5 ballgacha («mukammal aniq va normal ko'rishdek yorqin») baholanadigan 16 ta banddan iborat bo'lib, umumiy ball 16 dan 80 gacha bo'lgan.&lt;/p&gt;\n&lt;p&gt;Barcha afantaziyali ishtirokchilarning VVIQ ballari 22 dan past bo'lib (o'rtacha 17.06 ± 2.10, 18 tadan 13 tasi yadroviy afantaziya), J.L. tomonidan o'tkazilgan tuzilmali intervyu orqali ixtiyoriy vizual obrazlarning umrbod yo'qligi tasdiqlandi, chunki hozirgi vaqtda keng qabul qilingan obyektiv tashxis markeri mavjud emas. Barcha vizualizatorlarning VVIQ ballari 50 dan yuqori bo'ldi (63.67 ± 9.54). Barcha ishtirokchilar o'ng qo'y egalari bo'lib, ko'rish va eshitish qobiliyati normal yoki normagacha tuzatilgan, shuningdek anamnezida nevrologik yoki psixiatrik buzilishlar yo'qligini bildirishgan. Ikki guruh yoshi, jinsi va ta'lim yillari bo'yicha moslashtirilgan. Tadqiqot INSERM institutsional ko'rib chiqish qo'mitasi tomonidan C13-41 protokoli asosida ma'qullandi va barcha ishtirokchilar Xelsinki deklaratsiyasiga muvofiq yozma ravishda xabardor qilingan rozilik berishdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VVIQ (vizual obrazlar yorqinligi so'rovnomasi) — bu subyektiv baholash shkalasi bo'lib, past ballar aqliy tasvirlarni hosil qila olmaslikni (afantaziya), yuqori ballar эsa normal vizualizatsiyani bildiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"image-acquisition\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#image-acquisition\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Image acquisition&lt;/span&gt;&lt;/a&gt;Image acquisition&lt;/h4&gt;\n&lt;p&gt;Barcha MRI ma'lumotlari Parij miya institutining Neyroimidj tadqiqot markazida (CENIR) 64 kanalli bosh qopqog'i bilan jihozlangan Siemens 3T MAGNETOM Prisma skanerida olindi. Differensial vaznli tasvirlash (DWI) ma'lumotlari to'rtta ketma-ketlikda (jami 398 hajm) ikkita faza kodlash yo'nalishi (old-orqa, AP; orqa-old, PA) bo'yicha yig'ildi, ularning har biri ikkita b qiymatida (b = 1500 va 3000 s/mm²) 98–99 ta bir tekis taqsimlangan diffuziya yo'nalishlarini o'z ichiga oldi. Qo'shimcha ravishda diffuzion vaznsiz 28 ta hajm (b = 0) olindi. Yuqori aniqlikdagi T1-vaznli anatomik tasvirlar xuddi shu sessiyada TR = 2400 ms, TE = 2.22 ms va burilish burchagi 9° parametrlari bilan yozib olindi.&lt;/p&gt;\n&lt;h4 id=\"dwi-and-t1-weighted-data-processing-grey-matter/white-matter-segmentation\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#dwi-and-t1-weighted-data-processing-grey-matter/white-matter-segmentation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;DWI and T1-weighted data processing Grey matter/white matter segmentation&lt;/span&gt;&lt;/a&gt;DWI and T1-weighted data processing Grey matter/white matter segmentation&lt;/h4&gt;\n&lt;p&gt;Anatomik T1-tasvirlar to'qimalarni ishonchli segmentatsiya qilish uchun chuqur o'rganish va an'anaviy neyroimidj vositalarini birlashtiruvchi DeepPrep 25.1.0 quvuri yordamida dastlabki qayta ishlandi. Jarayon FreeSurfer (v7.2.0; RRID: SCR_001847) yordamida harakatni to'g'rilashni, SimpleITK (v2.3.0) orqali siljish maydonini to'g'rilashni, FastSurfer (v1.1.0) tarkibidagi FastSurferCNN yordamida bosh suyagini olib tashlash va to'qimalarni segmentatsiyalashni hamda FastCSR (v1.0.0) yordamida qobiq yuzasini rekonstruksiya qilishni o'z ichiga oldi. Oldindan ishlangan T1-tasvir keyingi diffuziya tahlillari uchun anatomik asos sifatida xizmat qildi.&lt;/p&gt;\n&lt;h4 id=\"diffusion-weighted-image-preprocessing\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#diffusion-weighted-image-preprocessing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Diffusion-weighted image preprocessing&lt;/span&gt;&lt;/a&gt;Diffusion-weighted image preprocessing&lt;/h4&gt;\n&lt;p&gt;Differensial vaznli tasvirlar standart parametrlar bilan QSIPrep v1.0.2 yordamida dastlabki ishlovdan o'tkazildi. Bir xil faza kodlash qutbliligiga ega ketma-ketliklar qayta ishlashdan oldin birlashtirildi. Quvur MP-PCA shovqindan tozalashni, Gibbs halqalarini olib tashlashni, b = 0 tasvirlari bo'ylab intensivlikni normallashtirishni, N4 siljish maydonini to'g'rilashni, shuningdek bosh harakati, uyurma oqimlari va magnit sezuvchanligi buzilishlarini FSL vositasi eddy va TOPUP orqali outlierlarni almashtirishni yoqib qo'ygan holda tuzatishni o'z ichiga oldi. Yakuniy interpolyatsiya yakobiy modulyatsiyasidan foydalangan holda bajarildi va ma'lumotlar har bir ishtirokchining o'z AC-PC fazosiga 1.25 mm izotropik aniqlikda qayta namuna olindi.&lt;/p&gt;\n&lt;h4 id=\"fiber-reconstruction\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#fiber-reconstruction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fiber reconstruction&lt;/span&gt;&lt;/a&gt;Fiber reconstruction&lt;/h4&gt;\n&lt;p&gt;Oldindan ishlangan DWI ma'lumotlari mrtrix_multishell_msmt_ACT-hsvs ish jarayoni yordamida QSIRecon v1.0.1 orqali rekonstruksiya qilindi. Rekonstruksiya davomida antsBrainExtraction miya niqoblaridan foydalanildi. Ko'p to'qimali javob funksiyalari Dhollander algoritmi yordamida baholandi, oq modda tolalari orientatsiyasi taqsimotlari (FOD) esa ko'p to'qimali cheklangan sferik dekonvolutsiya orqali hisoblandi va mtnormalize yordamida intensivlik bo'yicha normallashtirildi. Ushbu FOD lar traktografiya uchun ishlatildi, anatomik cheklovlar esa besh turdagi to'qima tasvirlarini yaratish uchun T1-vaznli gibrid sirt-hajm segmentatsiyasidan (hsvs) olindi. Butun miya traktografiyasi anatomik cheklangan traktografiya (ACT) yordamida amalga oshirildi, bunda oqim chiziqlari kulrang-oq modda chegarasida boshlanish va tugashga cheklandi. SIFT2 har bir oqim chizig'i og'irliklarini baholash uchun qo'llanildi va keyingi tutam segmentatsiyasi hamda bog'liqlik tahlillari uchun saqlab qolindi.&lt;/p&gt;\n&lt;h4 id=\"bundle-segmentation\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#bundle-segmentation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bundle segmentation&lt;/span&gt;&lt;/a&gt;Bundle segmentation&lt;/h4&gt;\n&lt;p&gt;Qiziqish uyg'otadigan oq modda tutamlari mrtrix_multishell_msmt_pyafq_tractometry ish jarayoniga amal qilgan holda QSIRecon ichidagi pyAFQ (Kruper et al., 2021) yordamida aniqlandi. pyAFQ tarkibiga kiruvchi standart asosiy tola tutamlaridan tashqari, oldingi tadqiqotlardagi qiziqish sohalari (ROI) ta'riflari asosida gipotezaga asoslangan tahlillar uchun bir nechta maxsus traktlar belgilandi. Bularga yuqori uzunlamasiga tutam bo'linmalari (Thiebaut de Schotten et al., 2011) (SLF I, II, III) va orqa kamar hamda medial vaqtinchalik proyeksiyalarni o'z ichiga olgan ventral cingulum yo'llari kiradi. Barcha ROI lar har bir ishtirokchining o'z AC-PC fazosiga o'tkazildi. Assotsiatsiya tolalari yarim shar ichida qolish bilan cheklandi va tutamni aniqlashtirish iterativ outlierlarni olib tashlash hamda oqim chiziqlarini klasterlash orqali bajarildi.&lt;/p&gt;\n&lt;h4 id=\"traktometriya\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#traktometriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Traktometriya&lt;/span&gt;&lt;/a&gt;Traktometriya&lt;/h4&gt;\n&lt;p&gt;Har bir segmentlangan tutam uchun trakt profillari pyAFQ ish jarayoni yordamida oqim chiziqlarini (streamlines) 100 ta teng masofadagi tugunlarga qayta diskretlash orqali ajratib olindi. Diffuziya va mikrostruktura ko'rsatkichlari, jumladan fraksiyali anizotropiya (FA), o'rtacha diffuziya (MD), radial diffuziya (RD), aksial diffuziya (AD) va neyritlar orientatsiyasi dispersiyasi va zichligi tasviri (NODDI) parametrlari oqim chiziqlari bo'yicha tortilgan o'rtacha qiymatlar sifatida hisoblandi. FA tolalar tashkilotini ko'rsatsa-da, mikrostruktura va geometrik effektlarni (tolalarning kesishishi yoki egilishi) farqlay olmaydi, shuning uchun neyritlar zichligi indeksi (NDI) va orientatsiya dispersiyasi indeksi (ODI) ham hisoblab chiqildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;NODDI — bu diffuziya signalida neyritlar zichligi va ularning yo'nalish tartibini ajratib ko'rsatuvchi model bo'lib, to'qima mikrostrukturasini aniqroq baholashga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;NODDI modeli QSIRecon'dagi AMICO implementatsiyasi yordamida, parallel diffuziya 1.7 × 10⁻³ mm²/s va izotrop diffuziya 3.0 × 10⁻³ mm²/s etib belgilangan holda moslashtirildi. Guruh darajasidagi statistik tahlildan oldin, trakt profillari 3 tugunli FWHM yadrosi bilan tekislandi.&lt;/p&gt;\n&lt;h4 id=\"froi-tolalarni-kuzatish\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#froi-tolalarni-kuzatish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fROI tolalarni kuzatish&lt;/span&gt;&lt;/a&gt;fROI tolalarni kuzatish&lt;/h4&gt;\n&lt;p&gt;Afantaziya bo'yicha 7 Tesla fMRI tadqiqotidan olingan to'rtta ROI (FIN, aPFC, OFC va aIPS) ishlatildi. Ushbu ROI'lar FreeSurfer (RRID:SCR_001847) yordamida kortikal sirtga proyeksiyalandi va kulrang-oq modda chegarasiga moslashtirildi. Oqim chiziqlarini qidirish MRtrix3 yordamida 2 mm radiusda amalga oshirildi. Har bir ROI uchun oqim chiziqlari mahalliy fazoda miqdoriy baholandi: anatomik belgilangan tutamlarga ajratilgan chiziqlar ulushi va ROI hajmi bo'yicha normallashtirilgan chiziqlar soni hisobga olindi. FIN uchun AF, pAF, IFOF, ILF va VOF tutamlari; aPFC va OFC uchun IFOF va UF; aIPS uchun pAF va SLF I, II, III tutamlari tahlil qilindi.&lt;/p&gt;\n&lt;h4 id=\"graf-nazariy-tarmoq-tahlili\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#graf-nazariy-tarmoq-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Graf-nazariy tarmoq tahlili&lt;/span&gt;&lt;/a&gt;Graf-nazariy tarmoq tahlili&lt;/h4&gt;\n&lt;p&gt;Kortikal parsellyatsiya Schaefer (400 ta uchastka, 17 ta tarmoq) atlasi yordamida amalga oshirildi. Strukturaviy bog'liqlik SIFT2-vaznli oqim chiziqlarining uchlari va parsellyatsiya ROI'lari kesishishi orqali baholandi. Bog'lanish kuchi SIFT2 vaznlarining yig'indisi sifatida, parsellyatsiya hajmi bo'yicha normallashtirilib hisoblandi. Simmetrik matritsalar 50% ishtirokchilarda mavjud bo'lmagan bog'lanishlarni nolga tenglashtirish orqali chegaralandi. Metrikalar (tugun kuchi, klasterlash koeffitsienti, global samaradorlik va h.k.) MATLAB R2024b'dagi Brain Connectivity Toolbox yordamida hisoblandi. Barqarorlikni tekshirish uchun tahlil Schaefer (100) va Gordon (333) atlaslari bilan takrorlandi.&lt;/p&gt;\n&lt;h4 id=\"sirtni-ajratib-olish-va-sirtga-asoslangan-morfometriya\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#sirtni-ajratib-olish-va-sirtga-asoslangan-morfometriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sirtni ajratib olish va sirtga asoslangan morfometriya&lt;/span&gt;&lt;/a&gt;Sirtni ajratib olish va sirtga asoslangan morfometriya&lt;/h4&gt;\n&lt;p&gt;Morfometriya SPM12'dagi CAT12 yordamida o'tkazildi. Kortikal qalinlik ichki (kulrang-oq modda chegarasi) va tashqi (kulrang modda-orqa miya suyuqligi chegarasi) sirtlar orasidagi masofa sifatida baholandi. Qalinlik xaritalari 12 mm FWHM Gauss yadrosi bilan tekislandi va 32k sirtga qayta diskretlandi. T-xaritalar Neurosynth (BrainStat) yordamida meta-analitik faollashuv xaritalari bilan korrelyatsiyani hisoblash uchun ishlatildi. Ko'rish qobig'i uchun kulrang modda hajmi Neuromorphometrics atlasi, qalinligi esa HCP-MMP Glasser atlasi yordamida ajratib olindi va umumiy intrakranial hajmga nisbatan normallashtirildi.&lt;/p&gt;\n&lt;h4 id=\"kulrang-modda-va-oq-modda-traklarida-noddi-ni-miqdoriy-baholash\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#kulrang-modda-va-oq-modda-traklarida-noddi-ni-miqdoriy-baholash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kulrang modda va oq modda traklarida NODDI ni miqdoriy baholash&lt;/span&gt;&lt;/a&gt;Kulrang modda va oq modda traklarida NODDI ni miqdoriy baholash&lt;/h4&gt;\n&lt;p&gt;Qo‘xsha qalinligi tahlilini mikrotuzilmaviy jihatdan tushunarli o‘lchovlar bilan to‘ldirish uchun NODDI metrikasi bosh miya kulrang moddasida ham hisoblandi. NODDI modeli yuqorida tavsiflangan AMICO dasturi yordamida fiksatsiya qilindi, NDI va ODI hajmiy xaritalari pial qavat hamda oq modda chegaralari orasida Nilearn kutubxonasining vol_to_surf funksiyasi yordamida bir tekisda ko‘chirilib, keyin fsLR-32k sirtiga qayta namuna olindi. Ushbu model ham kulrang, ham oq moddada histologik o‘lchovlar asosida tasdiqlangan bo‘lib, ODI post-mortem to‘qimalarda demyelinizatsiya kabi mikrotuzilmaviy o‘zgarishlarga sezgirligi ko‘rsatilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;NODDI va uning NDI hamda ODI indekslari — bu diffuzion MRT yordamida neyritlar zichligi va o‘simchilarning yo‘nalish tarqalishini baholash imkonini beruvchi neyrovizualizatsiya usulidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"loxistik-regressiya\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#loxistik-regressiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Loxistik regressiya&lt;/span&gt;&lt;/a&gt;Loxistik regressiya&lt;/h4&gt;\n&lt;p&gt;Guruxga mansublik bilan bog‘liq bo‘lgan va o‘lchovlar orasidagi umumiy dispersiyani hisobga oluvchi tuzilmaviy belgilarning ixcham kombinatsiyalarini aniqlash uchun ikki bosqichli yondashuv qo‘llanildi. Birinchi bosqichda R muhitidagi glmnet paketi yordamida LASSO jarima qo‘llanilgan loxistik regressiya har bir metrika domeni uchun alohida bajarildi: traktometriya FA, qo‘xsha qalinligi va graf-nazariy ko‘rsatkichlar. Bashorat qiluvchilar sifatida ahamiyatli trakt tugunlaridagi o‘rtacha FA, qo‘xsha qalinligi va avvalgi tahlillarda aniqlangan graf metriklari olindi. Kichik tanlanma hajmini (N = 36) hisobga olib, o‘zgaruvchilar nisbatini cheklash uchun alohida domen modellaridan foydalanildi. Modelni tanlash taxminan muvozanatlashgan sinf taqsimotiga ega 5 karrali kross-validatsiya orqali bajarildi va regulyarizatsiya parametri 1 ta standart xatolik qoidasi (λ₁se) yordamida tanlandi. Ikkinchi bosqichda LASSO saqlab qolgan o‘zgaruvchilar kichik tanlanma xatolarini kamaytirish uchun Firth ning jarimalangan loxistik regressiyasiga kiritildi. Konvergensiyaga erishmagan o‘zgaruvchilar p-qiymatga asoslangan bosqichma-bosqich tartibda chiqarib tashlandi. Tanlanmadan tashqari bashoratni baholash uchun har bir domen modeli 1000 marta takrorlanadigan stratifikatsiyalangan 5 karrali kross-validatsiya yordamida tekshirildi.&lt;/p&gt;\n&lt;h4 id=\"statistik-tahlil-bayes-omillari\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#statistik-tahlil-bayes-omillari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Statistik tahlil: Bayes omillari&lt;/span&gt;&lt;/a&gt;Statistik tahlil: Bayes omillari&lt;/h4&gt;\n&lt;p&gt;Guruhlar orasidagi farqlar uchun dalillarni miqdoriy baholash maqsadida JASP dasturida Bayes t-testlari va Mann-Uitni testlari yordamida Bayes omillari (BF) hisoblandi. BF₁₀ &amp;gt; 3 guruhlararo farq uchun o‘rtacha dalil sifatida, BF₀₁ &amp;gt; 3 (ya'ni BF₁₀ &amp;lt; 1/3) esa farq yo‘qligining o‘rtacha dalili sifatida qabul qilindi.&lt;/p&gt;\n&lt;h4 id=\"effekt-hajmi\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#effekt-hajmi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Effekt hajmi&lt;/span&gt;&lt;/a&gt;Effekt hajmi&lt;/h4&gt;\n&lt;p&gt;Topilmalar uchun effekt hajmlari har bir muhim hududdagi o‘rtacha qiymatlar asosida hisoblandi. Hedges’ g kichik tanlanma xatosini kamaytirish uchun FA, qo‘xsha qalinligi va NODDI metrikalari uchun ishlatildi. Cliff’s delta graf-nazariy metrikalar uchun noreparametric o‘lchov sifatida qo‘llanildi. Barcha effekt hajmlari uchun 95% ishonch oraliqlari 10 000 ta buots-strap qayta namunalari yordamida baholandi.&lt;/p&gt;\n&lt;h4 id=\"traktometriya1\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#traktometriya1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Traktometriya&lt;/span&gt;&lt;/a&gt;Traktometriya&lt;/h4&gt;\n&lt;p&gt;Trakt profillaridagi guruh farqlari PALM dasturida 10 000 ta permutatsiya bilan amalga oshirilgan, trakt tugunlari bo‘ylab bir o‘lchovli chegarasiz klaster kuchaytirish (TFCE; E = 0.5, H = 2) yordamida baholandi. TFCE ixtiyoriy chegarani talab qilmasdan fazoviy kengaytirilgan effektlarni aniqlaydi. Xato topilmalarni kamaytirish uchun kamida 3 ta ketma-ket ahamiyatli tugunni o‘z ichiga olgan klasterlargina keltirildi. Statistik ahamiyatlilik p &amp;lt; 0.05 (FWE tuzatilgan) deb belgilandi.&lt;/p&gt;\n&lt;h4 id=\"graf-nazariy-tarmoq-tahlili1\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#graf-nazariy-tarmoq-tahlili1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Graf-nazariy tarmoq tahlili&lt;/span&gt;&lt;/a&gt;Graf-nazariy tarmoq tahlili&lt;/h4&gt;\n&lt;p&gt;Birlik darajasidagi graf-nazariy metrikalardagi guruh farqlari Brunner-Muntsel noparometrik testi yordamida baholanib, barcha tugunlar bo‘ylab soxta kashfiyot darajasi (FDR) bo‘yicha tuzatish kiritildi. Qo‘shimcha ravishda, topologiyaga xos farqlarni aniqlash uchun Brain Connectivity Toolbox yordamida nol-tarmoq sezgirlik tahlili bajarildi. Tahlil klasterlash koeffitsientiga qaratildi. Har bir ishtirokchi uchun asl matritsaning daraja va og‘irlik taqsimotini saqlagan holda 100 ta nol tarmoq yaratildi. Nol-normallashtirilgan klasterlash koeffitsienti qiymatlari guruhlar orasida taqqoslandi.&lt;/p&gt;\n&lt;h4 id=\"froi-tolalarni-kuzatish1\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#froi-tolalarni-kuzatish1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fROI tolalarni kuzatish&lt;/span&gt;&lt;/a&gt;fROI tolalarni kuzatish&lt;/h4&gt;\n&lt;p&gt;Har bir fROI ichidagi filtrlangan traklardagi guruh farqlari Mann-Uitni testi yordamida baholandi, chunki ma'lumotlar noldan iborat qiymatlarni ko‘p o‘z ichiga olgan edi.&lt;/p&gt;\n&lt;h4 id=\"sirtga-asoslangan-morfometriya\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#sirtga-asoslangan-morfometriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sirtga asoslangan morfometriya&lt;/span&gt;&lt;/a&gt;Sirtga asoslangan morfometriya&lt;/h4&gt;\n&lt;p&gt;Bosh miya qobig'i qalinligining statistik tahlili BrainStat dasturiy ta'minotida chiziqli model, bir tomonlama test va soxta kashfiyot darajasiga (FDR) tuzatish kiritish yordamida amalga oshirildi. Ahamiyatli cho'qqilarning fazoviy bog'langan klasterlarini aniqlash maqsadida shovqinni hisobga oluvchi ierarxik zichlikdagi klasterlash usuli (HDBSCAN) qo'llanildi. Ushbu algoritm ahamiyatli cho'qqilarning x, y va z koordinatalari asosida fazoviy jihatdan yonma-yon joylashganlarini guruhladi. Faqatgina kamida 30 ta cho'qqini o'z ichiga olgan klasterlargina talqin qilish uchun saqlab qolindi va aniqlangan hududlarning anatomik tuzilishini aniqlash uchun Desikan-Killiani atlasi ishlatildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HDBSCAN metodi miya yuzasidagi o'zaro yaqin nuqtalarni klasterlarga ajratishda tasodifiy shovqinlarni muvaffaqiyatli chetlab o'tish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"oq-sichqoncha-va-kulrang-modda-noddi\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#oq-sichqoncha-va-kulrang-modda-noddi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Oq sichqoncha va kulrang modda NODDI&lt;/span&gt;&lt;/a&gt;Oq sichqoncha va kulrang modda NODDI&lt;/h4&gt;\n&lt;p&gt;Miya qobig'ining kulrang moddasi bo'yicha NODDI ko'rsatkichlari BrainStat dasturida amalga oshirilgan tasodifiy maydonlar nazariyasi yordamida guruhlararo taqqoslandi. Klaster darajasidagi tahlilda p &amp;lt; 0.05 klaster hosil qilish chegarasi va FWE tuzatishi bilan p &amp;lt; 0.05 klaster ahamiyatliligi chegarasi qo'llanildi.&lt;/p&gt;\n&lt;h4 id=\"dispersion-tengligini-tekshirish-uchun-levene-testi\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#dispersion-tengligini-tekshirish-uchun-levene-testi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dispersion tengligini tekshirish uchun Levene testi&lt;/span&gt;&lt;/a&gt;Dispersion tengligini tekshirish uchun Levene testi&lt;/h4&gt;\n&lt;p&gt;Joriy tanlanmalarda afantaziya profilining geterogenligini baholash uchun Levene testining Braun-Forsayt muqobil usuli har bir metrikada alohida-alohida qo'llanildi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-f1.jpg\" alt=\"1-rasm. Traktometriya afantaziyada oq modda mikrostrukturasining tanlab olingan farqlarini ochib beradi. (A) Vizualizato\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. Traktometriya afantaziyada oq modda mikrostrukturasining tanlab olingan farqlarini ochib beradi. (A) Vizualizatorlarga nisbatan afantaziyasi bo'lgan shaxslarda fraksion anizotropiyasi (FA) kamaygan traktlar (Vis. &amp;gt; Aph.): chap ilmoqsimon tutam (UF), o'ng UF va orqa interparietal korpus kallozum. Yuqori panellar trakt profillarini (o'rta ± SEM) ko'rsatadi; pastki panellar segment holatiga ko'ra rang bilan kodlangan (1-100 tugunlar) vakil ishtirokchining trakt rekonstruksiyalarini ko'rsatadi. Qizil chiziqlar afantaziyasi bo'lgan shaxslarni, ko'k chiziqlar esa vizualizatorlarni bildiradi. Soya qilingan kulrang hududlar sezilarli guruh farqlarini ko'rsatuvchi segmentlarni belgilaydi (p &amp;lt; 0.05, FWE tuzatilgan). (B) Vizualizatorlarga nisbatan afantaziyasi bo'lgan shaxslarda FA ortgan traktlar (Aph. &amp;gt; Vis.): chap va o'ng dorsal belbog'li tutam. Yuqori panellar trakt profillarini (o'rta ± SEM) ko'rsatadi; pastki panellar segment holatiga ko'ra rang bilan kodlangan vakil trakt rekonstruksiyalarini ko'rsatadi. Qizil chiziqlar afantaziyasi bo'lgan shaxslarni, ko'k chiziqlar esa vizualizatorlarni bildiradi. Soya qilingan kulrang hududlar va x o'qidagi qora chiziqlar sezilarli segmentlarni belgilaydi (p &amp;lt; 0.05, FWE tuzatilgan). Yupqa chiziqlar alohida ishtirokchilar profillarini, qalin chiziqlar esa guruh o'rtachalarini ko'rsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-f2.jpg\" alt=\"2-rasm. Strukturaning tarmoq tahlili tug'ma afantaziyada pastroq lokal segregatsiya va yuqoriroq tarmoqlararo markazlash\" /&gt;&lt;/p&gt;\n&lt;p&gt;*2-rasm. Strukturaning tarmoq tahlili tug'ma afantaziyada pastroq lokal segregatsiya va yuqoriroq tarmoqlararo markazlashuvni ochib beradi. (A) Tahlil quvuri. Butun miya traktografiyasi oqimlari sferik dekonvolyutsiya asosida filtrlangan traktogrammalar (SIFT2) yordamida vaznga ega qilindi va Schaefer 17-tarmoq parselatsiyasiga asoslangan 400 × 400 struktura bog'liqlik matrisini yaratish uchun ROI hajmi bo'yicha normallashtirildi. Tugun darajasidagi graf nazariyasi metrikalari so'ngra vaznga ega qilingan yo'naltirilmagan grafdan hisoblab chiqildi. (B) Tugun kuchi chap frontal ko'z maydonida (FEF; dorsal e'tibor tarmog'i B, DAN B) vizualizatorlarga nisbatan afantaziyasi bo'lgan shaxslarda kamaygan bo'lib, bu ushbu tugunda umumiy struktura bog'liqligi zaifroq ekanligini ko'rsatadi. (C) Klasterlanish koeffitsiyenti chap old orolchada (salentsiya/ventral e'tibor tarmog'i A, Sal/VAN A) va chap dorsolateral prefrontal korteksda (dlPFC; Default B) kamaygan bo'lib, bu salentsiya va assotsiatsiya tarmoqlari hududlarida lokal tarmoq segregatsiyasi kamayganini bildiradi. (D) Ishtirok etish koeffitsiyenti afantaziyada o'ng dorsomedial prefrontal korteksda (dmPFC; Default A) ortgan bo'lib, bu ushbu tugunda tarmoqlararo markazlashuv yuqoriroq ekanligini ko'rsatadi. Ko'k rang Vis. &amp;gt; Aph. ni bildiradi; to'q qizil rang Aph. &amp;gt; Vis. ni bildiradi. Quticha diagrammalar mediana va interkvartil oralig'ini ko'rsatadi; *p &amp;lt; 0.05, **p &amp;lt; 0.01, **&lt;em&gt;p &amp;lt; 0.001, FWE tuzatilgan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-f3.jpg\" alt=\"3-rasm. Afantaziyasi bo'lgan shaxslar va vizualizatorlar o'rtasida qobiq qalinligining hududiy farqlari. (A) Guruh taqqo\" /&gt;&lt;/p&gt;\n&lt;p&gt;*3-rasm. Afantaziyasi bo'lgan shaxslar va vizualizatorlar o'rtasida qobiq qalinligining hududiy farqlari. (A) Guruh taqqoslashining butun miya xaritasi. Ko'k rang afantaziyada qobiq qalinligi kamaygan hududlarni, qizil rang esa qobiq qalinligi ortgan hududlarni bildiradi, butun qobiq uchun FDR tuzatilishi bilan. Quticha diagrammalar alohida ishtirokchilar qiymatlarini (nuqtalar), medianani va interkvartil oralig'ini ko'rsatadi. *p &amp;lt; 0.05, **p &amp;lt; 0.01, **&lt;em&gt;p &amp;lt; 0.001. Vis., vizualizatorlar; Aph., afantaziya. aPFC: old prefrontal korteks; PoCG: postsentral burmalar; PHG: parahippokampal burmalar; EC: entorinal korteks; ITG: pastki vaqtinchalik burmalar; RSC: retrosplenial korteks; PCC: orqa belbog'li korteks. (B) Neurosynth yordamida t-xaritaning metaanalitik dekodlashidan olingan funksional atama assotsiatsiyalari. Ko'k atamalar afantaziyada qobiq qalinligi kamaygan hududlar bilan, qizil atamalar esa qobiq qalinligi ortgan hududlar bilan bog'liq. Atama hajmi tegishli metaanalitik faollashuv xaritasi bilan Pearson korrelyatsiyasining kuchini aks ettiradi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-fS1.jpg\" alt=\"Qo'shimcha rasm S1. Tahlil quvurining umumiy ko'rinishi. Uchta ma'lumot oqimi parallel ravishda qayta ishlandi. Diffuzio\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Qo'shimcha rasm S1. Tahlil quvurining umumiy ko'rinishi. Uchta ma'lumot oqimi parallel ravishda qayta ishlandi. Diffuzion MRT ma'lumotlari butun miya traktografiyasini yaratish uchun oldindan ishlov berish va tola rekonstruksiyasidan o'tdi. Anatomik T1-vaznli tasvirlar kulrang/oq modda (GM/WM) segmentatsiyasi va qobiq yuzasini ajratib olish uchun qayta ishlandi. Aqliy tasvir bo'yicha oldingi 7T fMRT tadqiqotidan olingan funksional ROIning (Liu, Zhan va boshq., 2025) har bir ishtirokchining o'ziga xos makoniga ro'yxatdan o'tkazildi. Ushbu kirish ma'lumotlari so'ngra to'rtta bir-birini to'ldiruvchi tahlil uchun ishlatildi: (1) traktometriya, bunda oq modda tutamlari segmentlarga bo'lindi va mikrostruktura xususiyatlari, shu jumladan fraksion anizotropiya (FA) trakt profillari bo'ylab miqdoriy baholandi; (2) fROI asosidagi traktografiya, bunda funksional ROI yadro tasvir tarmog'ining hududlarini bog'lovchi oqim chiziqlarini aniqlash uchun GM/WM interfeysiga proyektsiya qilindi; (3) graf nazariyasiga asoslangan tarmoq tahlili, bunda qobiq parselatsiyasi va SIFT2 bilan vaznga ega qilingan oqim chiziqlari soni struktura bog'liqlik matrislarini qurish va tugun darajasidagi tarmoq metrikalarini chiqarish uchun ishlatildi; va (4) sirt morfometriyasi, bunda qobiq qalinligi ajratib olingan qobiq yuzalaridan baholandi va butun miya bo'ylab guruhlar orasida taqqoslandi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-fS2.jpg\" alt=\"Qo'shimcha rasm S2. Sezilarli FA farqlarini ko'rsatadigan oq modda traktlaridagi NODDI mikrostrukturniy profillari. (A) \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Qo'shimcha rasm S2. Sezilarli FA farqlarini ko'rsatadigan oq modda traktlaridagi NODDI mikrostrukturniy profillari. (A) Nevrit zichligi indeksi (NDI) trakt profillari. (B) Orientatsiya dispersion indeksi (ODI) trakt profillari. Profillar asosiy traktometriya tahlilida aniqlangan traktlar — ikki tomonlama ilmoqsimon tutam, orqa interparietal korpus kallozum va ikki tomonlama dorsal belbog'li tutam uchun ko'rsatilgan. Qizil chiziqlar afantaziyasi bo'lgan shaxslarni, ko'k chiziqlar esa vizualizatorlarn
