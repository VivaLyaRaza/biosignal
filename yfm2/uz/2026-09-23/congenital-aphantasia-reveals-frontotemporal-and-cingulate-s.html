i bildiradi. Yupqa chiziqlar alohida ishtirokchilar profillarini, qalin chiziqlar esa guruh o'rtachalari ± SEM ni ko'rsatadi. Soya qilingan kulrang hududlar va qora chiziqlar guruhlararo sezilarli farqlarni ko'rsatadi (p &amp;lt; 0.05, FWE tuzatilgan).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-fS3.jpg\" alt=\"Qo'shimcha rasm S3. O'ng SLF-II va o'ng ventral singulumdagi chekka FA kamayishi orientatsiya dispersiyasining oshishi b\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Qo'shimcha rasm S3. O'ng SLF-II va o'ng ventral singulumdagi chekka FA kamayishi orientatsiya dispersiyasining oshishi bilan birga keladi. (A) O'ng SLF-II (p = 0.082, FWE tuzatishi bilan) va o'ng ventral singulum (p = 0.079, FWE tuzatishi bilan) uchun fraksion anizotropiya (FA) trakt profillari, quyida ko'rsatilgan tipik trakt rekonstruksiyalari bilan. Soya qilingan kulrang hududlar va qora chiziqlar guruhlar orasidagi chekka farqlarni ko'rsatuvchi segmentlarni bildiradi. Qizil chiziqlar afantaziyali shaxslarni, ko'k chiziqlar esa vizualizatorlarni bildiradi; yupqa chiziqlar alohida ishtirokchilarning profillarini, qalin chiziqlar esa guruh o'rtacha qiymatlarini ± SEM ko'rsatadi. (B) Xuddi shu traktlar uchun orientatsiya dispersiyasi indeksi (ODI) profillari. Ikkala traktda ham chekka FA kamayishi afantaziyali shaxslarda oshgan ODI bilan kesishdi, bu shuni ko'rsatadiki, bu ta'sirlarga mikrostrukturaviy farqlardan ko'ra mahalliy tola geometriyasi ta'sir qilishi mumkin. Shuning uchun bu topilmalar keyinchalik talqin qilinmadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-fS4.jpg\" alt=\"Qo'shimcha rasm S4. Asosiy tasvir tarmog'ining oq modda ulanishlari. (A) Sagittal Mआरआई kesimlarida ko'rsatilgan asosiy \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Qo'shimcha rasm S4. Asosiy tasvir tarmog'ining oq modda ulanishlari. (A) Sagittal Mआरआई kesimlarida ko'rsatilgan asosiy tasvir tarmog'ining har bir funksional ROI bilan bog'langan oq modda oqim chiziqlari: chap fusiform tasvir tuguni (FIN), chap orbitofrontal korteks (OFC), chap oldingi prefrontal korteks (aPFC) va o'ng oldingi intraparietal egat (aIPS). (B) Har bir funksional ROI uchun ROI hajmi bo'yicha normallashtirilgan oqim chiziqlari soni. FIN asosan yoy shaklidagi tutamning uzun segmenti (AF), orqa yoy shaklidagi tutam (pAF) va vertikal ensa tutami (VOF) orqali ulangan. Chap OFC pastki fronto-oksipital tutam (IFOF) va untsinat tutam (UF) orqali ulangan, chap aPFC эsa asosan IFOF orqali ulangan. Ushbu tahlilda FIN va chap aPFC o'rtasida to'g'ridan-to'g'ri strukturaviy bog'lanish aniqlanmadi. O'ng aIPS asosan yuqori bo'ylama tutamning uchinchi tarmog'i (SLF-III) orqali ulangan. FIN bilan bog'langan chap AF uchun afantaziyali shaxslarda normallashtirilgan oqim chiziqlari sonining nominal o'sishi kuzatildi (tuzatilmagan p = 0.039, U = 229, Cliff d = -0.41), ammo bu ta'sir bir nechta taqqoslashlar uchun tuzatishdan o'tmadi. Bayes omili tahlili FIN bilan bog'langan VOF oqim chiziqlari sonida guruh farqi yo'qligi uchun o'rtacha dalil taqdim etdi (BF = 0.32). (C) Har bir ROI uchun har bir qiziqish trakti uchun tayinlangan oqim chiziqlarining ulushi. Och rangli chiziqlar vizualizatorlarni, to'q rangli chiziqlar esa afantaziyali shaxslarni bildiradi. Xato panjaralari SEM ni ko'rsatadi va nuqtalar alohida ishtirokchilarni bildiradi. IFOF, pastki fronto-oksipital tutam; ILF, pastki bo'ylama tutam; AF, yoy shaklidagi tutamning uzun segmenti; pAF, orqa yoy shaklidagi tutam; VOF, vertikal ensa tutami; UF, untsinat tutam; SLF-I/II/III, yuqori bo'ylama tutamning I, II va III tarmoqlari.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-fS5.jpg\" alt=\"Qo'shimcha rasm S5. Nazorat tahlillari parselatsiya sxemalari bo'ylab tarmoq topilmalarining mustahkamligini tasdiqlaydi\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Qo'shimcha rasm S5. Nazorat tahlillari parselatsiya sxemalari bo'ylab tarmoq topilmalarining mustahkamligini tasdiqlaydi. (A) Gordon 333-mintaqaviy atlas. Grafik-nazariy metrikalar bo'ylab mos keluvchi guruh farqlari kuzatildi, afantaziyali shaxslar chap oldingi orolda pasaytirilgan klasterizatsiya koeffitsientini (Vis. &amp;gt; Aph., ko'k) va o'ng dorsomedial prefrontal korteksda oshgan ishtirok etish koeffitsientini (dmPFC; Aph. &amp;gt; Vis., to'q qizil) ko'rsatdi. (B) Schaefer-Yeo 100-mintaqaviy atlas. Afantaziyali shaxslar ikki tomonlama dmPFC da oshgan ishtirok etish koeffitsientini (Aph. &amp;gt; Vis.) va o'ng lateral prefrontal korteksda pasaytirilgan ishtirok etish koeffitsientini (Vis. &amp;gt; Aph.) ko'rsatdi. (C) Schaefer-Yeo 400-mintaqaviy atlasida chap oldingi orol tuguniga ulangan oq modda traktralari. Pastki fronto-oksipital tutam (IFOF) va yoy shaklidagi tutam (AF) asosiy tahlilda pasaytirilgan klasterizatsiya koeffitsientini ko'rsatadigan tugun bo'lgan chap oldingi orolda kesishadi. Chap oldingi prefrontal korteks (aPFC) va fusiform tasvir tuguni (FIN) alohida oq modda yo'llari, asosan mos ravishda IFOF va AF bilan bog'langan. To'q qizil rang Aph. &amp;gt; Vis. ni va ko'k rang Vis. &amp;gt; Aph. ni bildiradi. A va B panellarida ko'rsatilgan barcha guruh farqlari p &amp;lt; 0.05 da, FDR tuzatishi bilan ahamiyatli edi. Chap frontal ko'z maydoni (FEF) parselatsiya chegaralaridagi noaniqlikka mos ravishda atlaslar bo'ylab barqaror aniqlanmadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-fS6.jpg\" alt=\"Qo'shimcha rasm S6. Afantaziyali shaxslar va vizualizatorlar o'rtasidagi kortikal NODDI mikroyapısal farqlari. Kortikal \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Qo'shimcha rasm S6. Afantaziyali shaxslar va vizualizatorlar o'rtasidagi kortikal NODDI mikroyapısal farqlari. Kortikal NODDI metrikalari BrainStat da amalga oshirilgan tasodifiy maydon nazariyasidan foydalangan holda guruhlar o'rtasida taqqoslandi, klaster darajasidagi FWE tuzatilishi bilan (p &amp;lt; 0.05). Afantaziyali shaxslar paraxippokampal girus va entorinal korteksni o'z ichiga olgan ikki tomonlama medial temporal hududlarda, shuningdek chap predkuryusda oshgan nevrit zichligi indeksini (NDI) va chap dorsomedial prefrontal korteksda kamaygan NDI ni ko'rsatdi. Orientatsiya dispersiyasi indeksi (ODI), izotrop hajmiy fraksiya (ISOVF) va o'rtacha diffuzivlik (MD) ham sezilarli guruh farqlarini ko'rsatdi. Kamaygan MD hududlari medial temporal korteksdagi oshgan NDI hududlari bilan fazoviy ravishda kesishdi, bu naqsh ushbu hududlarda zichroq nevrit qadoqlanishi va umumiy pastroq diffuzivlikka mos keladi.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"jadvallar\"&gt;&lt;a href=\"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html#jadvallar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Jadvallar&lt;/span&gt;&lt;/a&gt;Jadvallar&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 1.&lt;/strong&gt; Afantaziya va vizualizatorlar o'rtasida oq modda yo'llarini taqqoslash&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Tract&lt;/th&gt;\n&lt;th&gt;Fractional anisotropy (FA)&lt;/th&gt;\n&lt;th&gt;Axial diffusivity (AD)&lt;/th&gt;\n&lt;th&gt;Radial diffusivity (RD)&lt;/th&gt;\n&lt;th&gt;Neurite density index (NDI)&lt;/th&gt;\n&lt;th&gt;Orientation dispersion index (ODI)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Vis &amp;gt; Aph&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;right UF&lt;/td&gt;\n&lt;td&gt;77-84 (0.018; 3.43; 1.09 [0.53, 1.82], 17.13)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;78-83 (0.061; 2.50; -0.90 [-1.64, -0.32]; 5.45)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;left UF&lt;/td&gt;\n&lt;td&gt;75
