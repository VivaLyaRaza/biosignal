            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"220\" cy=\"68\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"520\" cy=\"280\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Miya nima uchun sodda&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;tushuntirishlarni tanlaydi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Noaniqlik sharoitida qaror qabul qilganda, bizning miyamiz murakkab emas, balki sodda izohlarni tanlaydi. Yangi tadqiqot shuni ko'rsatdiki, bu shunchaki odat emas, balki statistik modellarni tanlashning aniq matematik qonuniyatidir. Insonlarning tanlovi ortiqcha moslashishning oldini oluvchi Bayes nazariyasiga mos keladi. Sun'iy neyrotarmoqlar esa bu xususiyatni har doim ham takrorlay olmaydi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Odamlar noaniq ma'lumotlarda sodda tushuntirishlarni tanlaydi&lt;/li&gt;\n&lt;li&gt;Tanlovlar Bayes modeli tanlash nazariyasiga mos keladi&lt;/li&gt;\n&lt;li&gt;Neyrotarmoqlar har doim ham bu xususiyatni ko'rsatmaydi&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqotchilar shovqinli va yetarli bo'lmagan ma'lumotlar asosida insonlar qanday qaror qabul qilishini o'rganib chiqdi. Tajribada ishtirokchilar tekislikdagi o'nta nuqta muayyan shakl tomonidan yaratilgani ehtimolini baholashdi. Mualliflar murakkablik jarimalarini o'lchash uchun Fisher haqida axborot yaqinlashishidan foydalandilar. Ma'lum bo'lishicha, insonlarning tanlovi ehtimollik nazariyasining yashirin sabablarni integratsiya qilish qoidasiga aniq mos keladi.&lt;/p&gt;\n&lt;p&gt;Bunday integratsiya har qanday tasodifiy ma'lumotga moslasha oladigan o'ta moslashuvchan tushuntirishlarni jazolaydi. Odamlar noqulay bo'lgan holatlarda ham soddalikka intilishsa-da, ba'zi sun'iy neyrotarmoqlarda bu xususiyat yo'q. Bu shuni ko'rsatadiki, statistik modellashtirish prinsiplari inson tafakkurining markaziy qismidir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot boshqariladigan sharoitdagi xulq-atvor eksperimentlariga asoslangan va neyron mexanizmlarni o'rganmagan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Okkam ustarasi — boshqa shartlar teng bo'lgan taqdirda, murakkabroq tushuntirishlarga qaraganda soddaroq tushuntirishlarga ustunlik berish kerak degan printsipdir. Bu printsip insonning qaror qabul qilish jarayonini boshqarishi taxmin qilinadi, ammo bu boshqaruvning tabiati hozircha noma'lum.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Oldindan ro'yxatdan o'tkazilgan xulq-atvor eksperimentlari shuni ko'rsatdiki, odamlar noaniq ma'lumotlar uchun ikkita muqobil tushuntirishning eng soddasiga miqdoriy jihatdan ustunlik berishadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz bu yerda oldindan ro'yxatdan o'tkazilgan xulq-atvor eksperimentlaridan foydalangan holda, odamlar noaniq ma'lumotlar uchun ikkita muqobil tushuntirishning eng soddasini afzal ko'rishga moyilligini ko'rsatdik. Ushbu afzalliklar ortiqcha moslashuvchanlikni jazolaydigan rasmiy model tanlash nazariyalari bashoratlari bilan miqdoriy jihatdan mos keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Modelni tanlash — bu shovqinli ma'lumotlarga haddan tashqari moslashib qolishning oldini olish uchun modelning mos kelish aniqligi bilan uning soddaligi o'rtasidagi muvozanatni topishga qaratilgan statistik yondashuv.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz, shuningdek, bunday soddalikka intilish afzalliklari odamlarda saqlanib qolishini, ammo ba'zi sun'iy neyron tarmoqlarida, hatto ular noadaptiv bo'lgan holatlarda ham, yo'qligini ko'rsatamiz. Bizning natijalarimiz shuni anglatadiki, statistik modelni tanlashning fundamental tushunchalari, jumladan, shovqinli ma'lumotlarga haddan tashqari moslashib qolishning oldini olish uchun mumkin bo'lgan yashirin sabablar bo'yicha integratsiyalash, insonning qaror qabul qilishida markaziy rol o'ynashi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot insonlar ishtirokidagi xulq-atvor testlariga va sun'iy tarmoqlar bilan taqqoslashga asoslangan bo'lib, natijalar matematik modellar bilan faqat korrelyatsiyani ko'rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Real dunyoda qaror qabul qilishda biz ko'pincha shovqinli va yetarli bo'lmagan ma'lumotlar uchun bir nechta ehtimoliy tushuntirishlar orasidan tanlov qilishimiz kerak bo'ladi. Raqobatdosh tushuntirishlarni baholashda Okkam usturasi shuni ko'rsatadiki, biz ularning nafaqat kuzatilgan ma'lumotlarni qanchalik yaxshi tushuntirishini, balki hali kuzatilmagan muqobil va potentsial ahamiyatsiz ma'lumotlarni tavsiflashdagi potentsial ortiqcha moslashuvchanligini ham hisobga olishimiz kerak (Baker, 2022) (masalan, \"buni arvoh qildi!\"; 1a, b-rasm). Bunday soddalikka ustunlik berish uzoq vaqtdan beri ruhiy faoliyatning tashkiliy prinsipi sifatida taklif qilib kelingan (Feldman, 2016), masalan, geshtalt-psixologiyadagi dastlabki Prägnanz tushunchasida (Koffka, 2014; Wagemans et al., 2012), ko'rish uchun bir nechta \"minimal prinsiplar\"da (Hatfield, 1985) va kognitsiyada ma'lumotlarni siqish markaziy rol o'ynashini ta'kidlaydigan nazariyalarda (Chater, 1999; Chater &amp;amp; Vitányi, 2003). Soddalik, shuningdek, tushuntirish qiymatining kengroq nazariyalari doirasida tushuntirishning afzalliklarini baholashga yordam beradigan asosiy xususiyatlardan biri sifatida taklif qilingan (Wojtowicz &amp;amp; DeDeo, 2020).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Soddalikka ustunlik berish (Okkam usturasi) shovqinli ma'lumotlarni baholash va raqobatdosh tushuntirishlar orasidan tanlashda inson kognitsiyasining fundamental tashkiliy prinsipi hisoblanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ko'pgina xulq-atvor tadqiqotlari shuni ko'rsatdiki, qaror qabul qiluvchilar turli vazifalarni, jumladan, perseptiv baholash, manbani tiklash va sabab-oqibatni tushuntirishni bajarishda soddalikka ustunlik berishadi (Chater, 1999; Genewein &amp;amp; Braun, 2014; Gershman &amp;amp; Niv, 2013; Griffiths &amp;amp; Tenenbaum, 2005; Johnson et al., 2014; Körding et al., 2007; Little &amp;amp; Shiffrin, 2009; Lombrozo, 2007; Pothos &amp;amp; Chater, 2002). Ushbu tadqiqotlar shartli ravishda afzal ko'riladigan (yoki ekvivalent ravishda yoqtirilmaydigan \"murakkablik\") \"soddalik\" nimadan iboratligini aniqlash uchun bir nechta rasmiy ta'riflarni taklif qildi, jumladan, tushuntirishda keltirilgan kuzatilmagan yoki tushuntirilmagan sabablar soni (Pacer &amp;amp; Lombrozo, 2017), tavsif uzunligi va Kolmogorov murakkabligi (Chater, 1999) yoki bayescha ciodlashda marjinal ehtimolliklarni hisoblashdan kelib chiqadigan statistik murakkablik (Griffiths &amp;amp; Tenenbaum, 2005; Körding et al., 2007). Bayescha tushuntirishga mos ravishda, ba'zi hollarda bunday soddalikka ustunlik berish ehtimoliyroq dalillar taqdim etilganda kamayadi, bu esa soddaroq tushuntirishlarga ko'proq vazn beradigan bayescha aprior ehtimollikni aks ettirishi taklif qilingan (Bonawitz &amp;amp; Lombrozo, 2012; Lombrozo, 2007; Pacer &amp;amp; Lombrozo, 2017). Insonning boshqa mulohazalari o'lchami bilan emas, balki parametrlar fazosining hajmi bilan boshqariladigan moslashuvchan tushuntirishlarni jarimaga tortadigan bayescha ramkaga mos kelishi ko'rsatilgan (Blanchard et al., 2018). Biroq, soddalikka bunday ustunlik berish nazariy murakkablik tushunchalari tomonidan belgilangan soddalik va tushuntirishning mos kelish sifati o'rtasidagi o'ziga xos o'zaro kelishuvlarga miqdoriy jihatdan bog'liqligi noma'lumligicha qolmoqda.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Bayescha yondashuv — yangi ma'lumotlar kelib tushishi bilan gipotezaning ehtimolligini yangilab boruvchi, modelning soddaligi va aniqligi o'rtasidagi muvozanatni ta'minlovchi statistik usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu tadqiqotning maqsadi insonning perseptiv qaror qabul qilishidagi soddalikka moyillikning nazariy jihatdan asoslangan, miqdoriy tavsifini o'rnatish edi. Buning uchun biz ushbu qarorlarni statistik modelni tanlash muammosi sifatida rasmiylashtiradigan vazifalar to'plamini ishlab chiqdik. Ushbu yondashuv bizga bitta modelni (ya'ni kuzatilgan ma'lumotlarning potentsial manbasini) boshqasiga nisbatan ko'proq (yoki kamroq) murakkab qiladigan va shuning uchun ortiqcha moslashuvchanlik tufayli uning mos kelish sifatiga bashorat qilingan ta'siriga qarshi turish uchun maxsus jarimalarni talab qiladigan o'ziga xos xususiyatlarni aniqlash imkonini berdi (Balasubramanian, 1997). Eng muhimi, bu jarimalar ma'lumotlarga bog'liq bo'lishi mumkin va shuning uchun soddalikka nisbatan umumiyroq ustunlik orqali to'liq taqlid qilinishi mumkin emas (Blanchard et al., 2018; Lombrozo, 2007). Quyida batafsil bayon qilganimizdek, ushbu yondashuv bizga Okkam usturasi shunchaki afzallik emas, balki moslashuvchan tushuntirishlarni shovqinli ma'lumotlarga moslashtirishga urinishda yuzaga keladigan muammolarga qarshi turish uchun mumkin bo'lgan yashirin sabablarni o'z ichiga oluvchi asosiy qaror qabul qilish jarayonlarining namoyon bo'lishi ekanligi haqidagi g'oyani qo'llab-quvvatlaydigan soddalikka moyillikning o'ziga xos shakllarini aniqlash imkonini berdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ushbu tadqiqot xulq-atvor qarorlarini qabul qilish modellariga qaratilgan bo'lib, uning xulosalari kengroq perseptiv vazifalar sinflarida qo'shimcha tekshiruvni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"odamlar-nazariy-jihatdan-asoslangan-soddalik-afzalliklarini-namoyish-etadi\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#odamlar-nazariy-jihatdan-asoslangan-soddalik-afzalliklarini-namoyish-etadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Odamlar nazariy jihatdan asoslangan soddalik afzalliklarini namoyish etadi&lt;/span&gt;&lt;/a&gt;Odamlar nazariy jihatdan asoslangan soddalik afzalliklarini namoyish etadi&lt;/h4&gt;\n&lt;p&gt;FIA murakkablik hadlarini ham inson, ham sun'iy qaror qabul qiluvchilar tomonidan namoyish etiladigan potensial afzalliklar bilan bog'lash uchun biz oddiy qaror qabul qilish vazifasini ishlab chiqdik. Har bir sinov uchun N = 10 ta bir vaqtning o'zida taqdim etilgan, shovqinli kuzatuvlar (1e-rasmdagi qizil nuqtalar) ikki mumkin bo'lgan shakldan birining ichida biror yerda markazlashtirilgan 2 o'lchovli Normal (\"generativ\") taqsimotdan tasodifiy tanlab olindi (1e-rasmdagi qora shakllar). Ma'lumotlarni hosil qiluvchi shaklning shaxsi (yuqori yoki pastki) teng ehtimollik bilan tasodif tanlandi. Xuddi shuningdek, tanlangan shakl ichidagi Normal taqsimot markazining joylashuvi Jeffreys prioridan foydalangan holda, model parametrizatsiyasiga bog'liq bo'lmagan tarzda tasodifiy ravishda tekis taqsimlandi (Jaynes, 2003). Kuzatuvlarni hisobga olgan holda, qaror qabul qiluvchi generativ taqsimot markazini o'z ichiga olish ehtimoli ko'proq bo'lgan shaklni (modelni) tanladi. Biz vazifaning to'rt xil variantidan foydalandik, ularning har biri Bayescha modelni tanlashda jazolanadigan alohida geometrik xususiyatlardan birini birinchi navbatda o'rganish uchun mo'ljallangan edi. Boshqacha qilib aytganda, har bir variant uchun Bayes kuzatuvchisining har bir juftlikdagi murakkabroq muqobildan uzoqda ma'lum bir miqdoriy afzallikka ega bo'lishi kutiladi (1c va d-rasmlar). Ushbu vazifa uchun FIA aniq Bayes posteriorining yaxshi yaqinlashishini ta'minladi (Qo'shimcha ma'lumotlar B.1 bo'limi). Shunga muvofiq, Bayes kuzatuvchisi kabi yashirin sabablarni tobora ko'proq integratsiya qilgan simulyatsiya qilingan kuzatuvchilar FIA-ga o'xshash ortib borayotgan siljishlarni namoyish etdi. Bu siljishlar ortib borayotgan sensorli va/yoki tanlov shovqini ta'siridan farq qilardi (va ular tomonidan kamaytirildi) (Qo'shimcha ma'lumotlar B.7.1 bo'limi va B.10-rasm).&lt;/p&gt;\n&lt;p&gt;Insonlar ishtirokidagi tadqiqotlarimiz uchun biz vazifani amalga oshirish uchun Pavlovia onlayn tadqiqot platformasidan va ishtirokchilarni jalb qilish va sinovdan o'tkazish uchun Prolific-dan foydalandik. Oldindan ro'yxatdan o'tkazilgan yondashuvlarimizga amal qilgan holda (Piasini va boshq., 2020, 2021), 1e-rsamda tasvirlangan vazifaning to'rtta alohida versiyasidan birini bajargan to'rtta guruhga bo'lingan 202 nafar ishtirokchidan ma'lumotlar to'pladik (har bir guruhda taxminan 50 nafar ishtirokchi bor edi). Ikki gulzorning birida joylashgan gul urug'lari o'xshashligidan foydalanadigan ko'rsatmalarni taqdim etdik, bu ikkita model oilasidan birining parametrik modelining ma'lum bir nusxasi tomonidan ishlab chiqarilgan shovqinli ma'lumotlarning asosiy tushunchalarini intuitiv shakllantirish uchun ta'minlandi. Ishtirokchilar har bir sessiya davomida implicit yoki eksplikativ fikr-mulohazalar asosida gulzorlarni optimalroq (ya'ni soddalikni afzal ko'radigan) tanlashni o'rganish ehtimolini minimallashtirish uchun biz: 1) FIA bo'yicha model murakkabligini jazolagan ideal kuzatuvchilar va faqat model ehtimolligidan foydalangan simulyatsiya qilingan kuzatuvchilar orasidagi unumdorlik farqi taxminan 1% bo'lgan shartlardan foydalandik (vazifa turiga qarab; 1e-rasm, ichki rasmlar), bu butun tajriba davomida taxminan 5 ta qo'shimcha to'g'ri urinishga to'g'ri keladi; va 2) har bir urinishda emas, balki har 100 ta urinish blokining oxiridagina fikr-mulohaza taqdim etdik.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tajriba ishtirokchilari noaniqlik sharoitida eng oddiy muqobillarni tez-tez tanlab, FIA bo'yicha barcha to'rt turdagi geometrik murakkablikka nisbatan sezgirlikni namoyish etdilar.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Oddiy xulq-atvor xulosalari shuni ko'rsatadiki, ikkala modelning ehtimolligi o'xshash bo'lgan noaniq urinishlar uchun (ya'ni ma'lumotlar ikkala modeldan ham bir xil masofada joylashgan bo'lib, Okkam ustarasining klassik bayonotining «boshqa barcha shartlar teng bo'lganda» shartiga mos keladi), ishtirokchilar eng oddiy muqobilni tez-tez tanladilar (3a-rasmdagi moviy egri chiziqlardan yuqoriga cho'zilgan pushti maydon). Ushbu tendentsiyani barcha rag'batlantiruvchi sharoitlarda, shu jumladan bitta model boshqasiga qaraganda yuqoriroq ehtimollikka ega bo'lgan holatlarda ham tekshirish hamda har bir ishtirokchining tanloviga model ehtimolligi va FIA xususiyatlarining har biri qanchalik ta'sir qilganini miqdoriy baholash uchun biz ma'lumotlarimizni ierarxiyaviy (Bayes) logistik regressiya yondashuvidan foydalangan holda tahlil qildik (A.6-metodlar bo'limiga qarang). Biz har bir ishtirokchining har bir FIA hadiga bo'lgan sezgirligini ularning ehtimollik sezgirligiga nisbatan normallashtirilgan miqdor sifatida aniqladik (ya'ni berilgan FIA hadiga bog'liq bo'lgan logistik koeffitsientni ehtimollikka bog'liq bo'lgan logistik koeffitsientga bo'lish orqali). Ushbu tahlil ishtirokchilarning barcha to'rtta model murakkabligi shakllariga sezgir ekanligini ko'rsatdi (3-rasm). Xususan, baholangan normallashtirilgan populyatsiya darajasidagi sezgirlik (posterior o'rtacha ± standart og'ish, bu yerda nol sezgirlik yo'qligini va bir Bayes-optimal sezgirlikni bildiradi) o'lcham uchun 4.66 ± 0.96, chegara uchun 1.12 ± 0.10, hajm uchun 0.23 ± 0.12 va mustahkamlik uchun 2.21 ± 0.12 ni tashkil etdi (shuni yodda tutingki, oldindan ro'yxatdan o'tkazilgan rejamizga amal qilgan holda, biz bu yerda va asosiy matn davomida Bayes yondashuvlaridan foydalangan holda parametrlarni baholashga urg'u beramiz va qo'shimcha nol gipotezani ahamiyatini sinovdan o'tkazishni B.6 Qo'shimcha ma'lumotlar bo'limida va B.8-jadvalda taqdim etamiz).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Bayescha modelni tanlash va Akaike axborot mezoni (AIC) parametrlarning ortiqchaligi va egri qaror chegaralarini jazolash orqali modellarning murakkabligini matematik jihatdan baholashga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz ushbu tahlillarni rasmiy model taqqoslashlari (WAIC; B.6.1 Qo'shimcha ma'lumotlar bo'limiga hamda B.6 va B.7-jadvallarga qarang) bilan to'ldirdik, ular ishtirokchilarning xulq-atvori faqat model va ma'lumotlar orasidagi minimal masofaga tayanmasdan (ya'ni maksimal ehtimollik yechimi), Bayescha modelni tanlash nazorati bilan belgilanadigan geometrik jarimalarni hisobga olgan holda yaxshiroq tasvirlanganini tasdiqladi. Ularning qarorlari, shuningdek, yashirin sabablarni integratsiya qilishga intilgan jarayonlarga mos keldi (va sensorli shovqinning o'rtacha darajasini va past tanlov shovqinini namoyish etdi; B.7 Qo'shimcha ma'lumotlar bo'limi va B.11 va B.12-rasmlar). Umuman olganda, bizning tahlillarimiz shuni ko'rsatadiki, odamlar Okkam ustarasini keltirib chiqaradigan tarzda yashirin sabablarni integratsiya qilishga intilishadi, bu model murakkabligini tavsiflovchi Bayescha modelni tanlashdagi geometrik xususiyatlarga sezgirlik sifatida namoyon bo'ladi.&lt;/p&gt;\n&lt;p&gt;Ishtirokchilar, shuningdek, optimal va sub-optimal qiymatlarni o'z ichiga olgan har bir FIA hadiga bo'lgan sezgirlik diapazonlarini o'z ichiga olgan unumdorlikda sezilarli individual o'zgaruvchanlikni namoyish etdilar. Bu o'zgaruvchanlik ishtirokchi darajasidagi sezgirlik baholari bilan bog'liq noaniqlikka nisbatan katta edi (B.4 Qo'shimcha ma'lumotlar) va unumdorlikka to'g'ri sozlangan (ya'ni Bayes-optimalga yaqin) soddalik afzalliklarining foydaliligini ta'kidlaydigan tarzda ta'sir qildi: aniqlik nazariy bashoratlardan uzoqroq bo'lgan FIA sezgirligiga ega bo'lgan ishtirokchilar uchun pasayish tendentsiyasiga ega edi (2c-rasm; aniqlik va /β - 1/ orasidagi Spearman rho koeffitsientining posterior o'rtacha ± standart og'ishi, bu yerda β — sezgirlik: o'lcham, -0.69 ± 0.05; chegara, -0.21 ± 0.11; hajm, -0.10 ± 0.10; mustahkamlik, -0.54 ± 0.10). Ko'p ishtirokchilar tomonidan namoyish etilgan sub-optimal sezgirlik vazifaga berilib ketmaslik natijasida kelib chiqqanga o'xshamaydi, chunki FIA sezgirligi oson urinishlardagi xatolar bilan korrelatsiya qilmadi (A.6.1-metodlar bo'limida batafsil bayon etilgan kengaytirilgan regressiya modeli bilan baholangan o'tkazib yuborish darajasi va optimal sezgirlikdan mutlaq farq orasidagi Spearman rho koeffitsientining posterior o'rtacha ± standart og'ishi quyidagicha: o'lcham, 0.08 ± 0.12; chegara, 0.15 ± 0.12; hajm, -0.04 ± 0.13; mustahkamlik, 0.15 ± 0.14; B.5 Qo'shimcha ma'lumotlar bo'limiga qarang). Xuddi shuningdek, sub-optimal FIA sezgirligi chegara (rho = -0.13 ± 0.11) va hajm (rho = -0.06 ± 0.11) hadlari uchun zaifroq ehtimollik sezgirligi bilan korrelatsiya qilmadi, garchi o'lcham (-0.35 ± 0.07) va mustahkamlik (-0.56 ± 0.10) hadlari bilan kuchliroq, salbiy munosabatlar ushbu sharoitlarda haddan tashqari va o'zgaruvchan soddalik afzalliklari (va o'rtacha pastroq unumdorlik; 2c-rasmga qarang) vazifaning ushbu versiyalarini bajarishda umumiy qiyinchilikni aks ettirganligini ko'rsatadi.&lt;/p&gt;\n&lt;h4 id=\"suniy-neyron-tarmoqlar-optimal-soddalik-afzalliklarini-ozlashtiradi\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#suniy-neyron-tarmoqlar-optimal-soddalik-afzalliklarini-ozlashtiradi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sun'iy neyron tarmoqlar optimal soddalik afzalliklarini o'zlashtiradi&lt;/span&gt;&lt;/a&gt;Sun'iy neyron tarmoqlar optimal soddalik afzalliklarini o'zlashtiradi&lt;/h4&gt;\n&lt;p&gt;Inson ishtirokchilarimiz tomonidan namoyon etilgan soddalik afzalliklarining optimalligi, o'zgaruvchanligi va umumiyligini yaxshiroq tushunish uchun biz ularning natijalarini ushbu vazifani bajarishni optimallashtirish uchun o'qitilgan sun'iy neyron tarmoqlar (ANN) natijalari bilan solishtirdik. Biz yuqorida tavsiflangan vazifaga mos keladigan shaklda statistik model tanlashni amalga oshirish uchun ishlab chiqqan yangi ANN arxitekturasidan foydalandik (4a, b-rasm). Har bir urinishda tarmoq kirish sifatida solishtiriladigan modellarni ifodalovchi ikkita tasvirni va o'sha urinishdagi kuzatishlarni ifodalovchi koordinatalar to'plamini oldi. Tarmoqning chiqishi softmax vektori sifatida kodlangan ikkita model o'rtasidagi qaror edi. Biz ANNning 50 ta namunasini tahlil qildik, ular faqat vaznlarning tasodifiy initsializatsiyasi va o'qitish davomida ko'rilgan misollar bilan farq qilar edi, bunda inson ishtirokchilari uchun foydalanilgan logistik regressiya yondashuvidan foydalandik.&lt;/p&gt;\n&lt;p&gt;ANN quyidagicha loyihalashtirilgan (batafsil ma'lumot uchun Metodlarga qarang). Kirish bosqichi ikkita oldindan o'qitilgan VGG16 konvolyutsion neyron tarmoqlaridan (CNN) iborat bo'lib, ularning har biri ko'rib chiqilayotgan ikkita modeldan birining tasviriy ifodasini qabul qildi. VGG inson vizual tizimi bilan solishtirish uchun ko'pincha benchmark sifatida qabul qilinadigan mashhur arxitektura sifatida tanlangan. CNN tarmoqlari vaznlari oldindan o'qitilgan qiymatlarida muzlatilgan holda saqlangan konvolyutsion qatlamlar stekidan, so'ngra o'qitish davomida o'zgarishi mumkin bo'lgan uchta to'liq bog'langan qatlamdan iborat edi. CNN chiqishlari chiziqli, to'g'rilangan chiziqli (ReLU) va batch-normallashtirish qatlamlaridan iborat ko'p qatlamli perseptronga (MLP) uzatildi. Keyin MLP chiqishlari birlashtirildi va ekvivariant MLPga uzatildi, bu maxsus parametr almashish sxemasi orqali ikkita modelning pozitsiyalari almashinilganda tarmoq chiqishining ekvivariantligini ta'minlaydi. Tarmoq, shuningdek, har bir modelga shartli ravishda ma'lumotlar yaratish jarayonini takrorlashga intilgan va shuning uchun yuqoridagi to'liq bog'langan qatlamlarni vazifaga tegishli xususiyatlarni qamrab oluvchi model tasvirlarini o'rganishga undagan ikkita shartli variatsion avtokodlovchi (C-VAE) tuzilmalarini o'z ichiga olgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;O'qitilgan ANNlar aniqlik bo'yicha odamlardan ustun keldi va nazariy jihatdan optimal qiymatlarga yaqin soddalik afzalliklarini namoyon etdi, ularning ichki o'zgaruvchanligi insonnikidan sezilarli darajada past edi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;O'qitishdan so'ng, ANNlar vazifani inson ishtirokchilariga qaraganda ancha yaxshi bajardi, umumiy aniqlik yuqoriroq bo'ldi, shu jumladan ehtimollikka nisbatan yuqoriroq sezgirlik (SN-rasm) va nazariy jihatdan optimal qiymatlarga yaqinroq mos keladigan soddalik afzalliklari (4c, d-rasm). Ushbu soddalik afzalliklari FIA-taxminiy emas, balki aniq Bayes modelining posterioridan foydalanadigan simulyatsiya qilingan kuzatuvchilardan kutilganlarga yaqinroq edi, bu FIA aniq Bayes posterioriga nomukammal yaqinlashishni ta'minlashi bilan mos keladi. Ushbu soddalik afzalliklari turli tarmoqlar bo'ylab kattaligi bo'yicha biroz farq qildi, ammo inson ishtirokchilaridan farqli o'laroq, bu o'zgaruvchanlik nisbatan kichik edi (3c va 4d-rasmlardagi qiymatlar diapazonlarini solishtiring, turli x-o'qi shkalalarida chizilgan) va bu tarmoqning sub-optimal xatti-harakatlarining belgisi emas edi, chunki u har bir shart uchun umuman yuqori aniqlik ko'rsatkichlaridagi farqlar bilan tizimli ravishda bog'liq emas edi (4d-rasm; aniqlik va /β − 1/ o'rtasidagi Spearman rho ning posterior o'rtacha qiymati ± st. chetlanish, bu yerda β - sezgirlik: o'lchamlilik, -0.14 ± 0.10; chegara, 0.08 ± 0.11; hajm, -0.12 ± 0.11; mustahkamlik, -0.08 ± 0.11).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Garchi vazifaning stoxastik tabiati afzalliklar o'zgaruvchanligiga ma'lum hissa qo'shsa-da, u odamlarda kuzatiladigan sub-optimallikni tushuntira olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Vazifaning stoxastik tabiati ishlash aniqligini optimallashtirish uchun keng qamrovli o'qitishdan keyin ham soddalik moyilliklarida ma'lum bir o'zgaruvchanlikni keltirib chiqarishini anglatadi, ammo o'zgaruvchanlikning bu manbai inson ishtirokchilari tomonidan namoyon etilgan sezgirlik (va sub-optimallik) diapazonini o'zi tushuntira olmaydi.&lt;/p&gt;\n&lt;h4 id=\"odamlar,-suniy-neyron-tarmoqlardan-snt-farqli-olaroq,-sub-optimal-soddalik-afzalliklarini-saqlab-qoladilar\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#odamlar,-suniy-neyron-tarmoqlardan-snt-farqli-olaroq,-sub-optimal-soddalik-afzalliklarini-saqlab-qoladilar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Odamlar, sun'iy neyron tarmoqlardan (SNT) farqli o'laroq, sub-optimal soddalik afzalliklarini saqlab qoladilar&lt;/span&gt;&lt;/a&gt;Odamlar, sun'iy neyron tarmoqlardan (SNT) farqli o'laroq, sub-optimal soddalik afzalliklarini saqlab qoladilar&lt;/h4&gt;\n&lt;p&gt;Bizning natijalarimiz, shuningdek, ishtirokchilarga vazifani bajarish jarayonida har bir urinish uchun teskari aloqa bermaganimiz bilan birgalikda, biz o'lchagan insoniy soddalik afzalliklari shunchaki ushbu vazifa sharoitlari uchun o'rganilgan optimallashtirishlar emas, balki noaniqlik sharoitida qaror qabul qilishimizning yanada chuqurroq (va o'zgaruvchan) qismi ekanligini ko'rsatadi. Biroq, biz har bir ishtirokchiga bayescha mulohaza yuritishni eslatuvchi ko'rsatmalar (Metodlarga qarang) va test sessiyasidan oldin teskari aloqaga ega qisqa o'quv to'plamini taqdim etganimiz sababli, biz faqat 3-rasmda keltirilgan ma'lumotlarga asoslanib, inson ishtirokchilaridan o'lchangan soddalik afzalliklarining kamida ba'zi jihatlari ushbu aniq ko'rsatmalar va o'qitish sharoitlariga bog'liqligini inkor eta olmaymiz. Shuning uchun biz ushbu imkoniyatni istisno qilish uchun ikkinchi tajribani o'tkazdik.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Odamlar ko'rsatmalardan qat'i nazar, soddalikka barqaror moyillikni namoyon etadilar, SNT esa o'qitish sharoitlariga moslashadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu tajriba uchun biz yuqoridagi kabi vazifa variantlaridan foydalandik, ammo ishtirokchilarni maksimal ehtimollik modelini tanlashga undash uchun mo'ljallangan boshqa ko'rsatmalar va o'qitish to'plamidan foydalandik (ya'ni, yashirin sabablar bo'yicha integratsiya qilmaslik, balki kuzatilgan ma'lumotlarga eng mos keladigan yagona sababni hisobga olish), shu bilan model murakkabligini e'tiborsiz qoldirdik. Xususan, vizual belgilar asl tajribadagi kabi edi, ammo ishtirokchilardan ekrandagi ikkita shakldan qaysi biri nuqtalar bulutining massa markaziga yaqinroq ekanligini xabar qilish so'raldi. Biz ushbu «maksimal ehtimollik» vazifasi uchun yollangan ishtirokchilar asl «generativ» vazifada qatnashmaganligiga ishonch hosil qildik. Biz yana tajriba va tahlil uchun oldindan ro'yxatdan o'tgan rejaga amal qildik va 201 ishtirokchidan ma'lumot to'pladik, ular har biri ~50 kishidan iborat to'rt guruhga bo'lindi. Shuningdek, biz SNTni ushbu vazifa versiyasida o'qitdik va sinab ko'rdik, bunda to'g'ri javob sifatida maksimal ehtimollik yechimidan foydalandik.&lt;/p&gt;\n&lt;p&gt;Ko'rsatmalar va o'qitishdagi ushbu katta farqga qaramay, inson ishtirokchilari generativ va maksimal ehtimollik vazifalarida o'xshash soddalik afzalliklarini namoyon etdilar, bu odamlarda tegishli ko'rsatmalar yoki rag'batlantirishlarsiz ham soddalikka umumiy moyillik borligini ko'rsatadi (5-rasm, chapda). Xususan, ba'zi miqdoriy farqlarga qaramay, nisbiy sezgirlik taqsimotlari ikkala vazifa uchun bir xil asosiy naqshlarni ko'rsatdi, bunda nisbiy sezgirlik hajmdan (maksimal ehtimollik vazifasi uchun 0,19 ± 0,08; yuqoridagi qiymatlar bilan solishtiring) chegaraga (0,89 ± 0,10), mustahkamlikka (2,27 ± 0,15) va o'lchamlilikka (2,29 ± 0,41) qarab umumiy o'sish kuzatildi. Inson ma'lumotlari va haqiqiy generativ vazifada o'qitilgan SNTdan farqli o'laroq, maksimal ehtimollik vazifasida model murakkabligiga nisbatan SNT sezgirligi barcha to'rt atama uchun nolga yaqin edi (5-rasm, o'ngda).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SNT (sun'iy neyron tarmoqlar) — ma'lumotlar asosida vazifalarni hal qilish uchun o'qitiladigan matematik modellar; bu kontekstda ular inson tafakkuri bilan taqqoslanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Odamlar va SNT ushbu vazifalar uchun qaror qabul qilish xatti-harakatlarini boshqarishda soddalik moyilliklaridan qanday foydalanganliklari va ularning samaradorlikka ta'siri o'rtasidagi o'xshashlik va farqlarni sarhisob qilish uchun 6-rasmda biz sinab ko'rgan har bir shartlar to'plami uchun umumiy aniqlik ko'rsatilgan. Xususan, har bir ishtirokchi yoki SNT, vazifa konfiguratsiyasi va ko'rsatmalar to'plami uchun biz generativ vazifa (ya'ni, nazariy jihatdan optimal ishlash soddalik moyilliklariga bog'liq bo'lgan) va maksimal ehtimollik vazifasi (ya'ni, nazariy jihatdan optimal ishlash soddalik moyilliklariga bog'liq bo'lmagan) bo'yicha to'g'ri javoblar foizini hisobladik. Maksimal ehtimollik yechimlari deterministik bo'lganligi sababli (ular faqat ma'lumotlar markazi qaysi modelga yaqinroq ekanligiga bog'liq va shuning uchun mukammal ishlashga olib keladigan optimal, aniq qaror chegarasi mavjud) va generativ yechimlar bunday emas (ular ehtimollik va moyillik atamalariga ehtimoliy bog'liq, shuning uchun mukammal ishlashga erishish odatda imkonsiz), birinchisida ishlash ikkinchisiga qaraganda yuqori bo'lishi kutiladi. Shunga ko'ra, ham SNT, ham (kamroq darajada) odamlar maksimal ehtimollik yechimlariga nisbatan baholanganda yaxshiroq ishlashga moyil edilar. Bundan tashqari, SNT berilgan vazifa sharoitlariga optimallashtirishga mos keladigan xatti-harakatlarni namoyon etdi: maksimal ehtimollik yechimlarini topishga o'qitilgan tarmoqlar maksimal ehtimollik vazifasi uchun generativ yechimlarni topishga o'qitilgan tarmoqlardan yaxshiroq ishladi, generativ yechimlarni topishga o'qitilgan tarmoqlar esa generativ vazifa uchun maksimal ehtimollik yechimlarini topishga o'qitilgan tarmoqlardan yaxshiroq ishladi. Aksincha, odamlar vazifa sharoitlaridan qat'i nazar, barcha hollarda bayescha soddalik moyilliklaridan foydalanib, o'xshash strategiyalarni qabul qilishga moyil edilar. Qisqacha aytganda, SNT faqat o'qitilganda soddalik afzalliklarini namoyon etdi, inson ishtirokchilari esa ko'rsatmalar va o'qitishdan qat'i nazar, ularni namoyon etdilar.&lt;/p&gt;\n&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;p&gt;Soddalik uzoq vaqtdan beri samarali fikrlash va ratsional qaror qabul qilishning asosiy elementi sifatida qaralib kelinadi. U falsafa, psixologiya, statistik xulosa va yaqinda mashinali o‘qitishda asosiy tamoyil sifatida taklif etilgan (garchi yuqori murakkab modellar fanlarda bu an’anaviy qarashga qanday qarshi chiqqani va uni to‘ldirgani haqidagi yaqinda chop etilgan maqolaga qarang). Shunga ko‘ra, inson kognitsiyasida soddalik afzalliklarining turli shakllari aniqlangan, masalan, shovqinli kuzatilgan ma’lumotlarning latent manbai sifatida silliqroq (sodda) egri chiziqlarni afzal ko‘rish tendensiyasi, shuningdek, guruhlash, konturni aniqlash va shaklni aniqlash bilan bog‘liq vizual idrok. Biroq, ushbu tadqiqotlarning mustahkam nazariy asosiga qaramay, hech kim inson xulq-atvorida miqdorini o‘lchash mumkin bo‘lgan (shunchaki aniqlash emas) soddalik tarafkashligi tushunchasini aniqlashga urinmagan. Ushbu ishda biz soddalik afzalliklari Okkam ustarasi (Occam’s razor) ning bayescha model tanlash va axborot nazariyasi kesishmasida joylashgan o‘ziga xos matematik formulasi bilan chambarchas bog‘liqligini ko‘rsatdik. Ushbu formulalash bizga ma’lumotlar uchun sodda tushuntirishlarga bo‘lgan afzallikni shunchaki aniqlashdan tashqariga chiqishga va sun’iy hamda inson ishtirokchilarida turli nazariy asoslangan sharoitlarda ushbu afzallik kuchini aniq o‘lchashga imkon berdi.&lt;/p&gt;\n&lt;h4 id=\"nazariy-hissa-va-parametr-chegaralari\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#nazariy-hissa-va-parametr-chegaralari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariy hissa va parametr chegaralari&lt;/span&gt;&lt;/a&gt;Nazariy hissa va parametr chegaralari&lt;/h4&gt;\n&lt;p&gt;Bizning tadqiqotimiz bir nechta yangi hissalarni qo‘shadi. Birinchisi nazariy: biz bayescha model tanlashda Fisher axborot approksimatsiyasi (FIA) ning yangi hadini chiqardik, u eng yaxshi model model oilasi chegarasida bo‘lishi mumkinligini hisobga oladi (usullar bo‘limi A.2 dagi tafsilotlarga qarang). Bu chegara hadi muhim, chunki u ma’lumotlardagi shovqin tufayli bitta parametrning (yoki parametrlar kombinatsiyasining) eng yaxshi qiymati ekstremal qiymatni olishi mumkinligini hisobga oladi. Bu shart real ma’lumotlar modellarida keng tarqalgan «parametr bug‘lanishi» hodisasi bilan bog‘liq. Bundan tashqari, parametrlar chegaralari sensorli stimullar eksperimental qurilmaning fizik cheklovlari bilan cheklangan va shuning uchun chegaralanmagan parametrlar haqida fikr yuritish kuzatuvchilar uchun muammoli bo‘ladigan idrok etish qarorlarini qabul qilish tadqiqotlari uchun ayniqsa muhimdir. Masalan, ishtirokchilardan vizual stimulning joylashuvini xabar qilishni talab qiladigan eksperimentni loyihalashni tasavvur qiling. Bunday holda, mumkin bo‘lgan joylashuvlarning chegaralanmagan to‘plami (masalan, masofada chapga va o‘ngga cheksiz cho‘zilgan chiziq bo‘ylab) aniq qabul qilib bo‘lmaydi. Bizning «chegara» hadimiz imkoniyatlar to‘plamini chegaralarga ega deb hisoblash ta’sirini rasmiylashtiradi, bu esa ma’lumotlarga yaqin bo‘lgan mahalliy gipotezalar sonini kamaytirish orqali mahalliy murakkablikni oshirishga moyildir (1b-rasmga qarang).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Biz parametr chegaralarini hisobga oluvchi yangi FIA hadini chiqardik, bu fizik cheklovlar sharoitida qaror qabul qilishni aniqroq modellashtirish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"suniy-neyron-tarmoqlar-va-oqitish\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#suniy-neyron-tarmoqlar-va-oqitish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sun’iy neyron tarmoqlar va o‘qitish&lt;/span&gt;&lt;/a&gt;Sun’iy neyron tarmoqlar va o‘qitish&lt;/h4&gt;\n&lt;p&gt;Ushbu ishning ikkinchi hissasi sun’iy neyron tarmoqlarga (ANN) tegishli: biz ushbu tarmoqlar qanday o‘qitilishiga qarab, soddalik afzalliklaridan optimal tarzda (ya’ni nazariya tomonidan belgilangan kattaliklarga muvofiq) foydalanishni yoki ularga e’tibor bermaslikni o‘rganishi mumkinligini ko‘rsatdik. Ushbu natijalar sodda funksiyalarni amalga oshirish chuqur neyron tarmoqlarda umumlashtirishning kaliti bo‘lishi mumkin degan g‘oyaga qaratilgan yaqinda qilingan ishlardan farq qiladi va ularni to‘ldiradi. Bu yerda biz samarali o‘qitish normativ soddalik afzalliklarini yaratishda qaror qabul qilish funksiyasining emas, balki gipotezalar fazosining murakkabligini hisobga olishi mumkinligini ko‘rsatdik. Bir tomondan, bu natijalar ajablanarli emas, chunki ANNlar va xususan chuqur tarmoqlar keng ko‘lamli xulosa chiqarish vazifalarida amalda yaxshi ishlaydigan kuchli funksiya approksimatorlaridir. Shunga ko‘ra, haqiqiy generativ yechimlar bo‘yicha o‘qitilgan ANNlarimiz berilgan kuzatuvlar to‘plamining generativ manbasi haqida, shu jumladan soddalik afzalliklari bilan samarali qarorlar qabul qila oldi. Xuddi shunday, maksimal ehtimollik yechimlari bo‘yicha o‘qitilgan ANNlarimiz berilgan kuzatuvlar to‘plami uchun maksimal ehtimollik mosligi haqida soddalik afzalliklarisiz samarali qarorlar qabul qila oldi. Boshqa tomondan, bu natijalar ANNlarni ma’lum muammolar uchun qanday yechimlar ishlab chiqarishini yaxshiroq tushunish uchun qanday tahlil qilish mumkinligi haqida yangi tushunchalar beradi. Xususan, biz kuzatgan soddalik afzalliklari turlari mavjudligini yoki yo‘qligini baholash ANNning o‘quv ma’lumotlariga haddan tashqari moslashishdan (overfitting) qochish va yanada umumlashtiriladigan yechimlarni taqdim etish ehtimolini aniqlashga yordam berishi mumkin.&lt;/p&gt;\n&lt;h4 id=\"inson-xulq-atvori-va-bayescha-integratsiya\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#inson-xulq-atvori-va-bayescha-integratsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Inson xulq-atvori va bayescha integratsiya&lt;/span&gt;&lt;/a&gt;Inson xulq-atvori va bayescha integratsiya&lt;/h4&gt;\n&lt;p&gt;Ushbu ishning uchinchi va eng muhim hissasi inson xulq-atvoriga tegishli: odamlar ma’lum asosiy hisob-kitoblarni o‘z ichiga olgan qarorlar qabul qilishda soddalik afzalliklarining ma’lum shakllaridan foydalanishga moyildirlar. Nazariy nuqtai nazardan, bayescha yechim (ya’ni soddalik afzalliklarini o‘z ichiga olgan) va maksimal ehtimollik yechimi (ya’ni soddalik afzalliklarini o‘z ichiga olmaydigan) o‘rtasidagi farq shundaki, ikkinchisi har bir oiladan faqat bitta eng mos keladigan modelni hisobga oladi, birinchisi esa har bir oiladagi barcha mumkin bo‘lgan modellarni integratsiyalaydi. Bu integratsiya jarayoni soddalik tarafkashligini keltirib chiqaradi, bu esa, muhimi, ishonchsiz sensorli tasvir yoki stoxastik tanlov jarayoni tufayli stimulning turli mumkin bo‘lgan sabablari bo‘yicha namuna olish kabi soddaroq mexanizmlardan kelib chiqa olmaydi (2-rasmga qarang). Bizning topilmamiz shundan iboratki, odamlar ANNlardan farqli o‘laroq, maksimal ehtimollik yechimlaridan foydalanish bo‘yicha ko‘rsatma berilganda ham bayescha yechimdan foydalanishga moyildirlar, bu biz tabiiy ravishda qarorlarni imkoniyatlar oilasidagi yagona eng yaxshi yoki arxetipik namuna asosida emas, balki butun oila bo‘ylab integratsiyalashgan holda qabul qilishimizni anglatadi. Bizning vazifamiz nuqtai nazaridan aniqroq aytganda, ma’lumotlar nuqtalariga eng yaqin shaklni aniqlash so‘ralganda, ishtirokchilar har bir shakldagi qaysi aniq joylashuv eng yaqin ekanligiga ishonchsiz bo‘lishgan. Shuning uchun ular tabiiy ravishda barcha imkoniyatlar bo‘ylab integratsiyalashgan, bu esa bayescha yechim tomonidan belgilangan soddalik afzalliklarini keltirib chiqaradi. Ushbu topilmalar miya tegishli qaror qabul qilish muammolari uchun ushbu integratsiyalashgan yechimlarni qayerda va qanday amalga oshirishi hamda saqlashini aniqlash bo‘yicha kelajakdagi tadqiqotlarni rag‘batlantirish va xabardor qilishga yordam beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Bayescha yechim barcha mumkin bo‘lgan modellarning ehtimolligini hisobga oladi, maksimal ehtimollik usuli esa faqat bitta eng mos modelni tanlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"afzalliklar-xilma-xilligining-manbalari\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#afzalliklar-xilma-xilligining-manbalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Afzalliklar xilma-xilligining manbalari&lt;/span&gt;&lt;/a&gt;Afzalliklar xilma-xilligining manbalari&lt;/h4&gt;\n&lt;p&gt;Bizning topilmalarimizning yana bir asosiy xususiyati, kelgusida o‘rganishga loyiq bo‘lgan narsa, inson ishtirokchilari tomonidan namoyon etilgan afzalliklarning kattaligi va o‘zgaruvchanligidir. O‘rtacha hisobda, insonning har bir geometrik model xususiyatiga sezgirligi: 1) noldan katta, 2) optimal qiymatdan kamida biroz farqli (masalan, o‘lchovlilik va mustahkamlik uchun kattaroq, hajm uchun kichikroq), 3) turli xususiyatlar va turli ishtirokchilar uchun turlicha va 4) ko‘rsatmalar va o‘qitishga nisbatan nisbatan sezgir emas edi. Bu xilma-xillikning manbai nima? Bir gipoteza shundan iboratki, odamlar hisoblash osonroq yoki arzonroq bo‘lgan model xususiyatlariga ko‘proq vazn berishlari mumkin. Bizning eksperimentlarimizda eng ko‘p vazn berilgan xususiyat modelning o‘lchovliligi edi. Bizning matematik tuzilmamizda bu xususiyat kuzatilgan ma’lumotlar uchun mumkin bo‘lgan tushuntirishning erkinlik darajalari soniga mos keladi va shuning uchun nisbatan oson baholanishi mumkin. Aksincha, eng kam vazn berilgan xususiyat model hajmi edi. Bu xususiyat model tarkibidagi ajralib turadigan ehtimollik taqsimotlari sonini hisoblaydi va shuning uchun butun model oilasi bo‘ylab integratsiyani o‘z ichiga oladi. Boshqacha qilib aytganda, dunyoning qancha turli holatlarini ma’lum bir gipoteza bilan tushuntirish mumkinligini sanash uchun ularni sanab chiqish kerak. Bu operatsiya hisoblash jihatidan qimmat bo‘lishi mumkin (garchi biz vazifalarimizda foydalangan modellar uchun bu raqam to‘g‘ridan-to‘g‘ri ekranda chizilgan chiziqlarning uzunligi bilan bog‘liq bo‘lib, shovqinning standart og‘ish birliklarida o‘lchanadi va shuning uchun ishtirokchilarimiz uchun aniqlash juda oson bo‘lishi mumkin, usullar bo‘limi A.4 ga qarang). Boshqa ikkita had, chegara va mustahkamlik, inson vazni va hisoblash qiyinligi nuqtai nazaridan o‘rtacha hisoblanadi. Ularni o‘lchovlilikka qaraganda hisoblash qiyinroq, chunki ular ma’lumotlarga va maksimal ehtimollik joylashuvidagi model xususiyatlariga bog‘liq. Biroq, ular hajm hadiga qaraganda soddaroq, chunki ular butun model manifoldi bo‘ylab integratsiyani talab qilmaydigan mahalliy miqdorlardir. Bu sezgi solishtirilayotgan tushuntirishlarning murakkabligi va qaror qabul qilish jarayonining o‘zi murakkabligi o‘rtasidagi bog‘liqlik haqida yangi savollarni keltirib chiqaradi, bu esa cheklangan ratsionallik va optimal xulosada kamayib borayotgan daromadlar tushunchalarini shubha ostiga qo‘yadi. Bunday savollarga javob berish ushbu ish doirasidan tashqarida, ammo kelgusida o‘rganishga loyiqdir.&lt;/p&gt;\n&lt;h4 id=\"kelajakdagi-yonalishlar-va-cheklovlar\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#kelajakdagi-yonalishlar-va-cheklovlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kelajakdagi yo‘nalishlar va cheklovlar&lt;/span&gt;&lt;/a&gt;Kelajakdagi yo‘nalishlar va cheklovlar&lt;/h4&gt;\n&lt;p&gt;Boshqa bir qiziqarli kelajak yo‘nalishi - soddalikning paydo bo‘lishiga nisbatan boshqa rasmiy yondashuvlar bilan solishtirishdir, bu esa turli bashoratlarga olib kelishi mumkin. Yaqinda o‘tkazilgan tadqiqotlar shuni ta’kidladiki, Jeffreysning a priori taqsimoti (bizning geometrik yondashuvimiz asoslangan) tabiiy fanlarda keng tarqalgan va model xulq-atvoriga ta’sir qilmaydigan ko‘plab parametrlar kombinatsiyasini o‘z ichiga olgan model sinfining murakkabligi haqida to‘liq bo‘lmagan tasvirni berishi mumkin va buning o‘rniga ma’lumotlarga bog‘liq a priori taqsimotlardan foydalanishni taklif qildi. Ikki usul, ayniqsa ma’lumotlar cheklangan rejimda turli natijalarga olib keladi. Ushbu farqlarning inson va mashina qaror qabul qilish uchun ahamiyatini tushunish foydali bo‘lar edi. Bizning vazifa dizaynimiz va tahlillarimiz kelajakdagi tadqiqotlarda hal qilinishi mumkin bo‘lgan bir nechta cheklovlarga ega edi. Biz faqat to‘rtta vazifa variantidan foydalandik, bu natijalarimizning umumlashtirilishini cheklaydi (garchi chegara va mustahkamlik jarimalari modelga va ma’lumotlarga bog‘liq bo‘lganligi sababli, ular vazifalar davomida qiymatlar kontinuumini nazarda tutganini va chegara jarimasi barcha vazifa turlari uchun dolzarb bo‘lganini ta’kidlash kerak). Biz shuningdek, faqat belgilangan N namuna hajmini, jalb qilingan modellar uchun FIA analitik tarzda hisoblanishi mumkin bo‘lgan shartlarni va takroriy qarorlarning ketma-ket jihatlarini e’tiborsiz qoldiradigan mustaqil sinovlarni ko‘rib chiqdik. Ushbu yondashuvimizni ushbu taxminlarni yumshatish uchun kengaytirish yoki modellarning hajmi yoki o‘lchovliligi erkinroq o‘zgarishiga imkon beradigan shartlarni kiritish, odamlar qaror qabul qilishda soddalik afzalliklarini qachon va qanday namoyon etishi haqida qo‘shimcha tushunchalar beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Bizning tadqiqotimiz aniq matematik modellarga va cheklangan vazifalar to‘plamiga asoslangan; natijalar yanada murakkab yoki dinamik sharoitlarda farq qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Qisqacha aytganda, bizning ishimiz model murakkabligining rasmiy tushunchalarining inson xulq-atvoriga to‘g‘ridan-to‘g‘ri, miqdoriy ahamiyatini namoyish etadi. Nazariy yutuqlar, hisoblash modellashtirish va xulq-atvor eksperimentlari kombinatsiyasiga tayangan holda, biz noaniqlik sharoitida qaror qabul qilish uchun yangi normativ mos yozuvlar nuqtalarini o‘rnatdik. Ushbu topilmalar inson kognitsiyasini optimal xulosa chiqarish jarayonlariga nisbatan o‘lchash mumkin bo‘lgan yangi maydonni ochadi, bu esa miyadagi axborotni qayta ishlashga ta’sir qiluvchi cheklovlar haqida yangi tushunchalarga olib kelishi mumkin.&lt;/p&gt;\n&lt;h4 id=\"malumotlarning-mavjudligi\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#malumotlarning-mavjudligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ma'lumotlarning mavjudligi&lt;/span&gt;&lt;/a&gt;Ma'lumotlarning mavjudligi&lt;/h4&gt;\n&lt;p&gt;Ushbu ishda to'plangan barcha eksperimental ma'lumotlar doi:10.17605/OSF.IO/R6D8N manzilida mavjud.&lt;/p&gt;\n&lt;h4 id=\"kodning-mavjudligi\"&gt;&lt;a href=\"2026-09-23/how-occam-s-razor-guides-human-decision-making.html#kodning-mavjudligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kodning mavjudligi&lt;/span&gt;&lt;/a&gt;Kodning mavjudligi&lt;/h4&gt;\n&lt;p&gt;Eksperimentlarni takrorlash uchun zarur bo'lgan barcha ma'lumotlar va kodlar (shu jumladan onlayn psixofizik vazifalarni bajarish hamda neyron tarmoqlarni o'qitish va sinovdan o'tkazish), shuningdek ma'lumotlarni tahlil qilish va barcha rasmlarni yaratish doi:10.17605/OSF.IO/R6D8N manzilida mavjud.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-f2.jpg\" alt=\"Rasm 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-f3.jpg\" alt=\"Rasm 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-f4.jpg\" alt=\"Rasm 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-f5.jpg\" alt=\"Rasm 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 5&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-f6.jpg\" alt=\"Rasm 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 6&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-fS1.jpg\" alt=\"Rasm S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-fS2.jpg\" alt=\"Rasm S2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-fS2-2.jpg\" alt=\"Rasm S2 (davomi 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S2 (davomi 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-fS3.jpg\" alt=\"Rasm S3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-fS4.jpg\" alt=\"Rasm S4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/how-occam-s-razor-guides-human-decision-making-fS4-2.jpg\" alt=\"Rasm S4 (davomi 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S4 (davomi 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"
