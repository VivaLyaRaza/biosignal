        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"186\" cy=\"166\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"554\" cy=\"192\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · MOLECULAR BIOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Infarktdan keyin yurak jigar&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;yordamida qonni qanday&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;boshqaradi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s-f1.jpg\" alt=\"1-rasm. Miokard infarkti trombotsitlarning almashinuvini kuchaytirishga olib keladi. Sichqonlar yopiq ko‘krak qafasi mod\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. Miokard infarkti trombotsitlarning almashinuvini kuchaytirishga olib keladi. Sichqonlar yopiq ko‘krak qafasi modeli yordamida ishemik/reperfuzion (I/R) shikastlanishni boshdan kechirdi. I/R shikastlanishidan keyin chap qorincha funksiyasi exokardiografiya orqali baholandi. (A) Miokard shikastlanganligini tasdiqlash uchun I/R dan keyin ko‘rsatilgan vaqt nuqtalarida otish fraksiyasi aniqlandi (n=4). (B) Trombotsitlar soni I/R shikastlanishidan oldin va keyin D T tipidagi sichqonlarning butun qonida o‘lchandi (n=12 (sog‘lom), 7 (6 s), 12 (24 s), 7 (5 kun), 10 (21 kun)). (C) Yuvilgan butun qondagi GPIb musbat trombotsitlar FSC sochilish profilining geometrik o‘rtachasi bilan aniqlangan o‘lchamiga ko‘ra tahlil qilindi (n=9). (D) Retikulyar trombotsitlar soni oqim sitometriyasi yordamida tiazol-to‘q sariq rangga bo‘yash orqali aniqlandi (n=9). (E) Desialillangan trombotsitlar Ricinus communis agglyutinini-1 (RCA) bilan bog‘lanish profiliga ko‘ra tahlil qilindi (n=9). (F) Apoptozga uchragan trombotsitlar AnnexinV bog‘lanishi orqali aniqlandi (n=6). (G-H) Ko‘rsatilgan vaqt nuqtalarida trombotsitlarning faollashuvi faol integrin IIb3 (G) bilan bog‘lanuvchi JON/A-PE antitelolari va trombotsitlarning degulyatsiyasi markeri sifatida P-selektin (H) yordamida aniqlandi (n=5-10). Ma'lumotlar o‘rtacha ± SEM sifatida taqdim etilgan. Statistik tahlillar Tukey ning bir nechta taqqoslash testi bilan odatiy bir tomonlama ANVOVA orqali amalga oshirildi. * p &amp;lt; 0,05, ** p &amp;lt; 0,01, *** p &amp;lt; 0,001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;O'tkir miokard infarktidan keyin organizm xavfli asoratlarning oldini olish uchun trombotsitlar darajasini tezkor tiklashni boshlaydi. Ilgari suyak ko'migi qon hujayralari yetishmasligi haqida qanday signal olishi sir edi. Sichqonlar ustida o'tkazilgan yangi tajribalar bu jarayonda jigar hal qiluvchi rol o'ynashini ko'rsatdi. Shikastlangan yurak yallig'lanish signallarini yuborib, jigarni ko'proq trombopoetin gormonini ishlab chiqarishga majbur qiladi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Infarkt qonda trombotsitlar yangilanishini tezlashtiradi.&lt;/li&gt;\n&lt;li&gt;Jigar STAT3 signalli yo'li orqali trombopoetin ishlab chiqarishni faollashtiradi.&lt;/li&gt;\n&lt;li&gt;Trombotsitlarning o'tkir yo'qolishi va retseptorlar tanqisligi turlicha ishlaydi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqotchilar infarktdan keyingi dastlabki sutkalarda trombotsitlar populyatsiyasining o'zgarish dinamikasini o'rganish uchun sichqonlarda ishemiya va reperfuziya modelidan foydalandilar. Hayvonlar qonida yosh retikulyatsiyalangan va desialillangan trombotsitlar sonining ortishi qayd etildi, bu hujayralarning tezlashgan yangilanishidan dalolat beradi. To'qimalarni tahlil qilish jigar va taloqda Asgr1/2 va IL-6R retseptorlari faollashganini, shuningdek STAT3 oqsili fosforillangani ko'rsatdi.&lt;/p&gt;\n&lt;p&gt;Miokard shikastlanganidan yigirma to'rt soat o'tgach, qon plazmasida trombopoetin kontsentratsiyasi sezilarli darajada oshdi va bu trombotsitlar tanqisligini tezda qoplash imkonini berdi. GPIbα antitelolari yordamida trombotsitlar zaxirasini sun'iy ravishda kamaytirish tajribalari bu reaksiyaning kompensator xarakterini tasdiqladi. Shu bilan birga, GPVI retseptori yetishmaydigan sichqonlarda bunday o'zgarishlar kuzatilmadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot sichqon modellarida bajarilgan, shuning uchun natijalarni inson fiziologiyasiga to'g'ridan-to'g'ri ko'chirish klinik tasdiqni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Ilmiy ish Dyusseldorf universiteti klinikasi (Germaniya) qoshidagi qon tomir va endovaskulyar jarrohlik bo‘limi professori Margitta Elvers tomonidan nazorat qilinadi. Tadqiqot metodologiyasi, olingan natijalar yoki hamkorlik bo‘yicha barcha savollar bilan Eksperimental qon tomir tibbiyoti bo‘limiga (manzil: Moorenstr. 5, 40225 Düsseldorf) murojaat qilish mumkin. Tezkor aloqa uchun +49 (0)211 81-08851 telefon raqami va +49 (0)211 81-17498 faks raqami xizmat qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Yozishmalar (Correspondence) — bu maqola mualliflari bilan bog‘lanish uchun rasmiy kanal bo‘lib, unda tadqiqotning aniqligi va ilmiy hamjamiyat bilan muloqot uchun mas’ul shaxs ko‘rsatiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"yurak-jigar-oqi-va-trombotsitlar-regulyatsiyasi\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#yurak-jigar-oqi-va-trombotsitlar-regulyatsiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yurak-jigar o'qi va trombotsitlar regulyatsiyasi&lt;/span&gt;&lt;/a&gt;Yurak-jigar o'qi va trombotsitlar regulyatsiyasi&lt;/h4&gt;\n&lt;p&gt;Trombotsitlar o'tkir miokard infarkti (MI)dan keyingi trombo-yallig'lanishda muhim rol o'ynaydi. Tadqiqot MI dan keyin jigar trombopoetini (TPO) regulyatsiyasiga ta'sirini o'rganadi. Tajribalar yovvoyi turdagi, trombotsitopeniyali va GPVI yetishmovchiligi bo'lgan sichqonlarda ishemiya/reperfuziya (I/R) shikastlanishi modeli yordamida o'tkazildi. Trombotsitlar faollashuvi va ularning almashinuvi, shuningdek, TPO regulyatsiyasida ishtirok etuvchi jigar retseptorlari tahlil qilindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MI dan keyin «yurak-jigar» o'qi faollashadi, bu 24 soat ichida plazmadagi TPO darajasini oshiradi va STAT3 signallari orqali trombotsitlar sonini tez tiklaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Natijalar shuni ko'rsatdiki, MI dan keyin trombotsitlar almashinuvi tezlashadi, retikulyar va desiallangan shakllar ko'payadi. Jigarda Asgr1/2 va IL-6R retseptorlari ekspressiyasi ortadi, STAT3 fosforillanishi kuchayadi, taloqda esa megakariotsitlar soni ko'payadi. Trombotsitlar tanqisligi TPO ning kompensator o'sishiga olib keladi, biroq Gp6-/- sichqonlarida bu o'zgarishlar kuzatilmaydi, bu o'tkir trombotsitopeniya va surunkali retseptorlar tanqisligi o'rtasidagi farqni ko'rsatadi.&lt;/p&gt;\n&lt;h4 id=\"trombotsitlar-fiziologiyasi-va-regulyatsiya-mexanizmlari\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#trombotsitlar-fiziologiyasi-va-regulyatsiya-mexanizmlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Trombotsitlar fiziologiyasi va regulyatsiya mexanizmlari&lt;/span&gt;&lt;/a&gt;Trombotsitlar fiziologiyasi va regulyatsiya mexanizmlari&lt;/h4&gt;\n&lt;p&gt;Trombotsitlar sonini barqaror saqlash (normada 150–400 × 10³ mkl⁻¹) qon ketish va trombozning oldini olish uchun muhimdir. MI dan keyingi dastlabki bosqichda megakariotsitlar proliferatsiyasi va trombotsitlar sonining ortishi kuzatiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ashwell-Morell retseptori (AMR) — jigardagi ASGPR1 va ASGPR2 subbirliklaridan iborat kompleks bo'lib, u qarigan trombotsitlarni aniqlaydi va ularni yo'q qilish orqali TPO sintezini boshqaruvchi JAK2/STAT3 yo'lini faollashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;TPO megakariotsitlar differensiatsiyasining asosiy regulyatoridir. Trombotsitlar AMR orqali tozalanadi, bu esa JAK2 ni faollashtiradi. Shu bilan birga, IL-6 ning IL-6R ga bog'lanishi STAT3 ni faollashtirib, TPO mRNA biosintezini rag'batlantiradi. Mualliflar sichqonlardagi I/R modellari yordamida AMR-IL-6R-STAT3 yo'li MI dan keyin trombotsitlar gomeostazini saqlashda hal qiluvchi rol o'ynashini tasdiqladilar.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"31-otkir-miokard-infarkti-trombotsitlar-almashinuvining-tezlashishiga-olib-keladi\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#31-otkir-miokard-infarkti-trombotsitlar-almashinuvining-tezlashishiga-olib-keladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.1 O'tkir miokard infarkti trombotsitlar almashinuvining tezlashishiga olib keladi&lt;/span&gt;&lt;/a&gt;3.1 O'tkir miokard infarkti trombotsitlar almashinuvining tezlashishiga olib keladi&lt;/h4&gt;\n&lt;p&gt;C57BL/6J sichqonlarida LAD ligatsiyasi orqali 60 daqiqalik o'tkir miokard infarkti (O'MI) va keyingi 24 soat, 7 va 21 kunlik reperfuziya (I/R) amalga oshirildi. Jarrohlik travmasini kamaytirish uchun yopiq ko'krak qafasi modeli qo'llanildi. Chap qorincha disfunksiyasi exokardiyografiya orqali tasdiqlandi (Rasm 1A). Trombotsitlar soni I/R dan keyin faqat 6 soat o'tgach sezilarli darajada kamaydi, 24 soatdan keyin esa normal holatga qaytdi va 21 kungacha barqaror qoldi (Rasm 1B). GPIb-musbat trombotsitlarning geometrik o'rtacha hajmi 6 soatdan keyin ortdi va 24 soatdan keyin kamaydi (Rasm 1C). Tiazol to'q sariq rang bilan bo'yalgan retikulyar trombotsitlar soni 6 soatdan keyin ko'paydi (Rasm 1D). RCA-1 lektini yordamida o'tkazilgan tahlil 6 soatdan keyin desialillangan trombotsitlar ulushining ortganini ko'rsatdi (Rasm 1E). 24 soat va 5 kundan keyin farqlar kuzatilmadi. Annexin-V-musbat (apoptozga uchragan) trombotsitlar soni 24 soatdan keyin ortdi (Rasm 1F). Bundan tashqari, I/R dan 4 soat o'tgach, JON-A bog'lanishi (faol αIIbβ₃ integrini) va P-selektin ekspressiyasi orqali trombotsitlarning tinch holatda ham faollashuvi aniqlandi (Rasm 1G-H). 21 kundan keyin bazal faollashuv nazorat guruhiga nisbatan kamaydi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s-f1.jpg\" alt=\"1-rasm. Miokard infarkti trombotsitlarning almashinuvini kuchaytirishga olib keladi. Sichqonlar yopiq ko‘krak qafasi mod\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. Miokard infarkti trombotsitlarning almashinuvini kuchaytirishga olib keladi. Sichqonlar yopiq ko‘krak qafasi modeli yordamida ishemik/reperfuzion (I/R) shikastlanishni boshdan kechirdi. I/R shikastlanishidan keyin chap qorincha funksiyasi exokardiografiya orqali baholandi. (A) Miokard shikastlanganligini tasdiqlash uchun I/R dan keyin ko‘rsatilgan vaqt nuqtalarida otish fraksiyasi aniqlandi (n=4). (B) Trombotsitlar soni I/R shikastlanishidan oldin va keyin D T tipidagi sichqonlarning butun qonida o‘lchandi (n=12 (sog‘lom), 7 (6 s), 12 (24 s), 7 (5 kun), 10 (21 kun)). (C) Yuvilgan butun qondagi GPIb musbat trombotsitlar FSC sochilish profilining geometrik o‘rtachasi bilan aniqlangan o‘lchamiga ko‘ra tahlil qilindi (n=9). (D) Retikulyar trombotsitlar soni oqim sitometriyasi yordamida tiazol-to‘q sariq rangga bo‘yash orqali aniqlandi (n=9). (E) Desialillangan trombotsitlar Ricinus communis agglyutinini-1 (RCA) bilan bog‘lanish profiliga ko‘ra tahlil qilindi (n=9). (F) Apoptozga uchragan trombotsitlar AnnexinV bog‘lanishi orqali aniqlandi (n=6). (G-H) Ko‘rsatilgan vaqt nuqtalarida trombotsitlarning faollashuvi faol integrin IIb3 (G) bilan bog‘lanuvchi JON/A-PE antitelolari va trombotsitlarning degulyatsiyasi markeri sifatida P-selektin (H) yordamida aniqlandi (n=5-10). Ma'lumotlar o‘rtacha ± SEM sifatida taqdim etilgan. Statistik tahlillar Tukey ning bir nechta taqqoslash testi bilan odatiy bir tomonlama ANVOVA orqali amalga oshirildi. * p &amp;lt; 0,05, ** p &amp;lt; 0,01, *** p &amp;lt; 0,001.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;O'MI dastlabki 6–24 soat ichida trombotsitlar sonining vaqtinchalik kamayishiga va ularning tezlashgan almashinuviga olib keladi.&lt;br /&gt;\n[!tip] Retikulyar trombotsitlar — bu suyak iligidan yangi chiqqan yosh shakllar bo'lib, ularning ko'payishi trombopoez kuchayganini bildiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"32-ishemiya-va-reperfuziyadan-keyin-trombopoetin-ekspressiyasining-erta-ortishi\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#32-ishemiya-va-reperfuziyadan-keyin-trombopoetin-ekspressiyasining-erta-ortishi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.2 Ishemiya va reperfuziyadan keyin trombopoetin ekspressiyasining erta ortishi&lt;/span&gt;&lt;/a&gt;3.2 Ishemiya va reperfuziyadan keyin trombopoetin ekspressiyasining erta ortishi&lt;/h4&gt;\n&lt;p&gt;Biz trombotsitlar sonining tiklanish mexanizmlarini tahlil qildik. Plazmadagi trombopoetin (TPO) darajasi I/R dan 24 soat o'tgach sezilarli darajada oshdi (Rasm 2A). Desialillangan trombotsitlar jigardagi AMR retseptorlari bilan bog'lanib, JAK2-STAT3 yo'lini faollashtiradi. STAT3 faollashuvi I/R dan 6 soat o'tgach sezilarli darajada oshdi va 24 soatdan keyin normaga qaytdi (Rasm 2B). Asgr1 subbirligi ekspressiyasi 6–24 soat ichida o'sish tendentsiyasini ko'rsatdi, Asgr2 esa 24 soatdan keyin sezilarli darajada oshdi (Rasm 2C). Jigarda IL-6 retseptori ekspressiyasining o'sish tendentsiyasi ham kuzatildi. Tpo ekspressiyasi I/R dan 6 va 24 soat o'tgach ortdi va 5–21 kunlarda kamaydi (Rasm 2C). Nihoyat, biz AMR/IL-6-STAT3-TPO yo'lining faollashuvi taloqdagi megakariopoezni rag'batlantirishini aniqladik: megakariotsitlar soni sezilarli darajada oshdi, ammo taloq vaznining tana vazniga nisbati o'zgarmadi (Rasm 2D-E).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s-f2.jpg\" alt=\"2-rasm. Miokard infarktidan keyin TPO ning erta kuchaytirilgan ekspressiyasi. (A) I/R shikastlanishidan oldin va 24 soat\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm. Miokard infarktidan keyin TPO ning erta kuchaytirilgan ekspressiyasi. (A) I/R shikastlanishidan oldin va 24 soat o‘tgach yovvoyi turdagi (WT) sichqonlar plazmasidagi trombopoyetin (TPO) konsentratsiyalarini tahlil qilish (n=4). (B) WT sichqonlarining butun jigar to‘qimalari I/R shikastlanishidan keyin ko‘rsatilgan vaqt nuqtalarida STAT3 fosforillanishi uchun tahlil qilindi (n=3). (C) Tpo ekspressiyasini tartibga solishda ishtirok etuvchi turli xil retseptorlarning nisbiy gen ekspressiyasi I/R shikastlanishidan keyin WT sichqonlarining butun jigar to‘qimalarida ko‘rsatilgan vaqt nuqtalarida tahlil qilindi (n = 3-4). (D) Sichqonlarda I/R shikastlanishidan keyin nisbiy taloq vazni o‘lchandi (n = 5-9). (E) Taloq kesmalari tayyorlandi va har bir ko‘rish maydoni (FOV) uchun megakariotsitlarning umumiy sonini sanash uchun H&amp;amp;E bilan bo‘yaldi (n=6). Ma'lumotlar o‘rtacha ± SEM sifatida taqdim etilgan. Statistik tahlillar juftlashtirilmagan talaba t-testi (A+E) yoki Tukey ning ko‘p qirrali taqqoslash testi bilan odatiy bir tomonlama ANVOVA (B-D) yordamida amalga oshirildi. * p &amp;lt; 0,05, ** p &amp;lt; 0,01, *** p &amp;lt; 0,001. Masshtab chizig‘i = 20 µm. H&amp;amp;E = gematoksilin va eozin; FOV = Ko‘rish maydoni.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;O'MI dan keyin jigarda AMR-JAK2-STAT3-TPO signal yo'lining erta faollashuvi taloqdagi megakariopoezni rag'batlantirish orqali trombotsitlar darajasini tiklaydi.&lt;br /&gt;\n[!warning] Tadqiqot sichqonlar modelida o'tkazilgan, shuning uchun natijalarni odam patofiziologiyasiga to'g'ridan-to'g'ri ko'chirishda ehtiyotkorlik talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"33-otkir-trombotsitopeniya-miokard-infarktidan-keyin-megakariopoezni-qozgatadi\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#33-otkir-trombotsitopeniya-miokard-infarktidan-keyin-megakariopoezni-qozgatadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.3 O'tkir trombotsitopeniya miokard infarktidan keyin megakariopoezni qo'zg'atadi&lt;/span&gt;&lt;/a&gt;3.3 O'tkir trombotsitopeniya miokard infarktidan keyin megakariopoezni qo'zg'atadi&lt;/h4&gt;\n&lt;p&gt;Desialillangan trombotsitlarning jigarda AMR-IL6R-STAT3 signal yo'lini faollashtirishdagi rolini va trombotsitopeniyaning miokard infarktidan (MI) keyingi trombotsitlar almashinuviga ta'sirini baholash uchun biz trombotsitopeniyali sichqonlar modelidan foydalandik. Trombotsitlarni kamaytiruvchi antitanachalarni yuborish orqali ularning soni nazorat guruhining &amp;lt;1% gacha tushirildi (3A-rasm). Talog'ning massasida o'zgarish kuzatilmadi (3B-rasm). Trombotsitopeniyali sichqonlarda plazmadagi IL-6 sitokini darajasi pasayganligi aniqlandi, bu yallig'lanish jarayonida trombotsitlarning muhim rolini tasdiqlaydi. Ishemiya/reperfuziyadan (I/R) 6 soat o'tgach, plazmadagi trombopoetin (TPO) darajasi nazorat guruhiga nisbatan trombotsitopeniyali sichqonlarda sezilarli darajada yuqori bo'ldi (3D-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Trombotsitopeniya plazmadagi IL-6 darajasini pasaytiradi, ammo I/R dan 6 soat o'tgach TPO konsentratsiyasini oshiradi, bu jigarning kompensator reaksiyasidan dalolat beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Jigarda Tpo genining ekspressiyasi dastlabki holatda trombotsitlari kamaytirilgan sichqonlarda yuqoriroq edi, ammo I/R dan 6 va 24 soat o'tgach guruhlar o'rtasida sezilarli farqlar kuzatilmadi (3E-rasm). Shunga qaramay, I/R dan 24 soat o'tgach, Tpo ekspressiyasi trombotsitopeniyali sichqonlarda yuqori darajada saqlanib qoldi, nazorat guruhida esa u pasaydi. Asialoglikoprotein retseptorining (AMR) Asgr1 va Asgr2 subbirliklari ekspressiyasi I/R dan 6 soat o'tgach oshdi, ammo 24 soatga kelib trombotsitopeniyali sichqonlarda bazal darajagacha tushdi, nazorat guruhida esa bu pasayish kamroq ifodalangan edi (3E-rasm). Jigarda STAT3 fosforillanishi I/R dan 6 soat o'tgach IgG nazorat guruhida trombotsitopeniyali sichqonlarga nisbatan sezilarli darajada yuqori bo'ldi (3F-rasm). Talog'dagi megakariotsitlar sonida esa farq kuzatilmadi (3G-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot sichqonlar modelida o'tkazilgan, shuning uchun natijalarni odam organizmidagi jarayonlarga to'g'ridan-to'g'ri ko'chirish ehtiyotkorlikni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"34-gpvi-ning-i/r-shikastlanishidan-keyin-jigar-tpo-signallari-orqali-trombotsitlar-sonini-tartibga-solishga-tasiri\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#34-gpvi-ning-i/r-shikastlanishidan-keyin-jigar-tpo-signallari-orqali-trombotsitlar-sonini-tartibga-solishga-tasiri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.4 GPVI ning I/R shikastlanishidan keyin jigar TPO signallari orqali trombotsitlar sonini tartibga solishga ta'siri&lt;/span&gt;&lt;/a&gt;3.4 GPVI ning I/R shikastlanishidan keyin jigar TPO signallari orqali trombotsitlar sonini tartibga solishga ta'siri&lt;/h4&gt;\n&lt;p&gt;Avvalgi tadqiqotlar glikoprotein VI (GPVI) ning infarktdan keyingi yurak remodelatsiyasidagi rolini aniqlagan. Biz Gp6+/+ va Gp6-/- (nokaut) sichqonlarini solishtirib, GPVI ning jigarda TPO sinteziga ta'sirini o'rgandik. Jigardagi Tpo, Asgr1, Asgr2 va Il6r genlari ekspressiyasini tahlil qilish shuni ko'rsatdiki, har ikki genotipda ham I/R dan keyin Tpo va Asgr1 ekspressiyasining vaqtga bog'liq o'sishi kuzatilgan (4A-D-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Nokaut — bu funksiyani o'rganish uchun ma'lum bir genni organizmdan olib tashlash yoki «o'chirish» jarayoni.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;TPO sintezining asosiy regulyatori bo'lgan STAT3 fosforillanishi har ikki guruhda ham I/R dan 6 soat o'tgach sezilarli darajada oshdi va 24 soatga kelib bazal darajaga qaytdi. Gp6+/+ va Gp6-/- sichqonlari o'rtasida STAT3 faollashuvida statistik jihatdan sezilarli farqlar aniqlanmadi (4E-rasm). Shunday qilib, GPVI ning yo'qligi miokard infarktidan keyin tizimli TPO darajasiga yoki jigarda STAT3 faollashuviga sezilarli ta'sir ko'rsatmaydi.&lt;/p&gt;\n&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;p&gt;Trombotsitlarning giper-reaktivligi yurak-qon tomir kasalliklarida, jumladan o'tkir miokard infarktida (OMI) yaxshi o'rganilgan hodisa bo'lib, ular miokard reperfuziya shikastlanishini kuchaytiradi. OMI dan keyin trombotsitlar almashinuvining tezlashishi uzoq muddatli prognozlarni yomonlashtiruvchi retikulyar trombotsitlar sonining oshishiga olib keladi. Ishimizda biz OMI ning o'tkir fazasidan keyin yovvoyi turdagi (WT) sichqonlarda nafaqat retikulyar trombotsitlar sonining oshishini 1 C+D-rasmda, balki eski trombotsitlar chastotasining yuqori ulushi bilan subpopulyatsiyalar siljishini ham qayd etdik 1 E+F-rasm. Bu natijalar trombotsitlar gomeostazi faol boshqarilishini, ehtimol OMI dan keyin jigar orqali trombopoetin (TPO) regulyatsiyasi vositasida amalga oshishini ko'rsatadi. TPO regulyatsiyasi va bu jarayonda trombotsitlarning rolini o'rganish uchun biz ikkita modeldan foydalandik: (1) o'tkir trombotsitopeniyani keltirib chiqarish uchun antitelalar yordamida trombotsitlarni kamaytirish va (2) surunkali GPVI yetishmovchiligini baholash uchun genetik modifikatsiyalangan GP6⁻/- sichqonlar.&lt;/p&gt;\n&lt;p&gt;Jigar trombo-yallig'lanishdan keyin trombotsitlarni tozalashda asosiy rol o'ynab, yallig'lanish reaksiyalarini va TPO sintezini tartibga soladi. Bizning ma'lumotlarimiz shuni ko'rsatadiki, jigar TPO ekspresiyasi OMI dan keyin WT sichqonlarda kuchaygan pSTAT3 signallari bilan birgalikda sezilarli darajada oshadi. Qizig'i shundaki, jigar to'qimasida AMR va IL6R ekspresiyasi OMI dan keyin 2 B-C-rasmda kuchaygan. Bu natijalar miokard shikastlanishida yurak-jigar aloqasini IL-6/STAT3 yo'li vositachiligida ta'minlovchi oldingi tadqiqotlarga mos keladi. Ushbu o'q gepatotsitlardagi mineralokortikoid retseptorlarini to'g'ridan-to'g'ri bostirib, OMI natijasini yaxshilaydi. Trombotsitlar monosit va makrofaglarning IL-6 ajratishini boshqarishini hisobga olib, biz trombotsitopenik sichqonlarda pasaygan plazma IL-6 darajasini va kamaygan STAT3 fosforillanishini kuzatdik 3C-rasm. Trombotsitlar desialilatsiyasi AMR orqali STAT3 faollashuviga ta'sir qilgani bois, reperfuziyadan 6 soat o'tgach jigar to'qimasida kuchaygan pSTAT3 signallariga mos ravishda kuchaygan desialilatsiyani aniqladik. Shu bois, biz trombotsitlar almashinuvi jigar signal yo'llarini boshqarib, desialilatsiyalangan trombotsitlar birikishi va jigar to'qimasining immunomodulyatsiyasi orqali trombo-yallig'lanishni kuchaytiradi, deb taxmin qilamiz.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Trombotsitlari kamaygan sichqonlarda plazma IL-6 darajasi pasayishi fonida TPO geni ekspresiyasi va plazmadagi TPO darajasining kompensator oshishi kuzatildi 3D-E-rasm, holbuki STAT3 disregulyatsiyasi saqlanib qoldi 3F-rasm.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Pasaygan plazma IL-6 darajasidan tashqari, trombotsitopenik sichqonlar TPO geni ekspresiyasi va plazma TPO darajasining kompensator oshishini ko'rsatdi 3D-E-rasm. Qizig'i shundaki, trombotsitopeniyadan keyin TPO ning kompensator oshishi odatiy hol emas va uning sababiga bog'liq. Immun trombotsitopeniya bilan og'rigan bemorlarda kutilganidan past TPO darajasi kuzatilsa, trombotsitemiya TPO darajasining oshishiga olib keladi. Bu trombotsitlar massasi va plazma TPO darajasi o'rtasidagi o'zaro korrelyatsiya g'oyasiga zid keladi. Shunga qaramay, bu sichqonlarda STAT3 signallari buzilganicha qoldi va bu trombotsitopeniya STAT3 fosforillanishining dinamik regulyatsiyasini izdan chiqarishini ko'rsatdi 3F-rasm.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Desialilatsiya — bu hujayra yuzasidan sial kislota qoldiqlarini fermentativ yo'l bilan olib tashlash jarayoni bo'lib, ularning jigarda tozalaishini tezlashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Shunga o'xshash fenotip yaqinda murine trombotsitopeniya modelida tavsiflangan edi. Sun va boshqalar Notch1 signallari jigar to'qimasida TPO ishlab chiqarishni boshqarishini ko'rsatishdi. Ularning modelida gepatotsitga xos (HC) Notch1⁻/- sichqonlar jigar to'qimasida pasaygan STAT3 fosforillanishi va TPO ekspresiyasi bilan trombotsitopenik bo'lgan. HC-Notch1⁻/- sichqonlardagi pasaygan p-STAT3 dan farqli o'laroq, biz bu yerda OMI dan keyin TPO bilan bog'liq genlar ekspresiyasiga minimal ta'sir ko'rsatadigan trombotsitlar kamayishini taqdim etdik 3E-rasm. Bu STAT3 regulyatsiya mexanizmi ancha murakkab ekanligini va OMI dan keyingi trombotsitopeniyaning ikkilamchi ta'siri sifatida yuzaga kelishini ko'rsatadi.&lt;/p&gt;\n&lt;p&gt;Aksincha, GP6⁻/- sichqonlar WT sichqonlarga nisbatan retseptor yoki TPO regulyatsiyasida sezilarli o'zgarishlarni ko'rsatmadi 4A-D-rasm, faqat OMI ning boshida IL6R ekspresiyasida kichik o'zgarishlar kuzatildi, bu ehtimol GP6⁻/- jigar to'qimasida boshlang'ich IL6R darajasi biroz yuqoriligi bilan bog'liq. Qo'shimcha ravishda, STAT3 faollashuvida sezilarli farqlar kuzatilmadi 4E-rasm. Bu topilmalar GPVI yetishmovchiligi OMI dan keyingi o'tkir yallig'lanish reaksiyalariga sezilarli ta'sir qilmasligi, ammo chandiq hosil bo'lishi kabi uzoq muddatli yurak remodellanishiga ta'sir qilishi haqidagi oldingi hisobotlarga mos keladi. Bizning ma'lumotlarimiz shuni ko'rsatadiki, o'tkir trombotsitlar kamayishi jigar TPO ning kompensator javobini keltirib chiqarsa-da, surunkali GPVI yetishmovchiligi shunday regulyatsion ta'sir ko'rsatmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Olingan TPO javobi va signalizatsiya natijalari o'tkir miokard infarkti sichqon modellarida aniqlangan bo'lib, ularni to'g'ridan-to'g'ri insonlarga ko'chirish ehtiyotkorlikni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Talqin qilinishicha, taloq OMI dan keyingi trombotsitlar dinamikasida muhim rol o'ynaydi. Taloqdan trombotsitlar chiqishi sirkulyatsiya qiluvchi trombotsitlar hajmining oshishiga va OMI dan keyingi yallig'lanishga yordam berishi ko'rsatilgan. Taloqdagi CD41 signallari OMI dan keyin kamayadi, bu trombotsitiklarning qon aylanishiga safarbarligi kuchayganidan dalolat beradi. Trombotsitlar almashinuvining oshishi haqidagi topilmalarimizni hisobga olsak, taloq trombotsitlari kuzatilgan subpopulyatsiya o'zgarishlari va jigar TPO regulyatsiyasiga hissa qo'shishi ehtimoldan holi emas. Bizning tadqiqotimiz shuningdek GPVI ga yo'naltirilgan terapiyalarning trombotsitlar gomeostaziga potentsial ta'siri haqida savollar tug'diradi. Revasept kabi antitrombotsitar terapiyalar trombotsit-endoteliy o'zaro ta'sirining oldini olish orqali OMI dan keyin infarkt hajmini kamaytirishi va yurak faoliyatini yaxshilashi ko'rsatilgan. Biroq, GPVI ingibitorligining trombotsitlar ishlab chiqarilishi va jigar TPO regulyatsiyasiga oqibatlari hali noma'lumligicha qolmoqda.&lt;/p&gt;\n&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;Bizning tadqiqotimiz o'tkir miokard infarktidan (O'MI) keyin trombotsitlar almashinuvi va jigarning TPO signal yo'lining dinamik boshqaruvi haqida yangi ma'lumotlarni taqdim etadi. Biz o'tkir trombotsitopeniya jigarda TPO ishlab chiqarilishining kompensator oshishiga olib kelishini, bu jarayonga STAT3 signallarining buzilishi hamroh bo'lishini ko'rsatamiz, shu bilan birga GPVI ning surunkali tanqisligi bu yo'llarga sezilarli ta'sir ko'rsatmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;O'tkir miokard infarkti va trombotsitopeniya jigarda TPO sintezining kompensator oshishiga va STAT3 buzilishiga olib keladi, GPVI tanqisligi esa bu yo'llarni o'zgartirmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bundan tashqari, bizning natijalarimiz taloqda trombotsitlarning safarbar qilinishi va tizimli tromboz-yallig'lanish reaksiyalari O'MI dan keyin trombotsitlar almashinuviga hamda jigar moslashuviga hissa qo'shishini ko'rsatadi. Yurak-qon tomir kasalliklarida GPVI ga yo'naltirilgan terapiyaning ahamiyati oshib borishini hisobga olib, kelgusidagi tadqiqotlar ularning trombotsitlar gomeostaziga, jigar TPO regulyatsiyasiga va yurakning uzoq muddatli natijalariga ta'sirini o'rganishi kerak.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot eksperimental modellarga asoslangan bo'lib, hayvonlardagi natijalarni to'g'ridan-to'g'ri insonlarga ko'chirish ehtiyotkorlikni talab qiladi va qo'shimcha klinik tekshiruvlarni taqozo etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Trombotsitlar, jigar signallari va taloq trombotsitlari dinamikasi o'rtasidagi o'zaro ta'sirni tushunish O'MI dan keyin trombotsitlarni tiklash qobiliyatini saqlab qolgan holda tromboz-yallig'lanishni kamaytirishga qaratilgan terapevtik strategiyalarni takomillashtirishi mumkin.&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"21-hayvonlar\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#21-hayvonlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.1 Hayvonlar&lt;/span&gt;&lt;/a&gt;2.1 Hayvonlar&lt;/h4&gt;\n&lt;p&gt;Barcha tajribalar ARRIVE ko‘rsatmalariga va Yevropa parlamentining laboratoriya hayvonlari bilan ishlash qoidalariga muvofiq o‘tkazildi. Tadqiqot Genrix Geyne universiteti va Shimoliy Reyn-Vestfaliya hukumati axloq qo‘mitalari tomonidan ma’qullangan (ruxsatnomalar AZ 84-02.04.2015.A558; AZ 81-02.04.2019.A270). Tadqiqotda faqat Janvier Labs'dan olingan erkak C57BL/6J sichqonlari ishlatildi. GPVI yetishmovchiligi bo‘lgan (Gp6-/-) sichqonlar geterozigotali juftlarni chatishtirish orqali olindi, bu esa ham nokaut, ham yovvoyi turdagi (Gp6+/+) nazorat guruhlarini ajratib olish imkonini berdi. Hayvonlar 22 ± 1°C haroratda va 12 soatlik yorug‘lik siklida saqlandi. Trombotsitopeniyani chaqirish uchun sichqonlarga LAD arteriyasini bog‘lashdan 24 soat oldin 2 mkg/g dozada GPIbα antitanachalari (#R300) yoki nazorat IgG (#C301) yuborildi. Qon tarkibi Sysmex analizatori yordamida nazorat qilindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Nokaut (Gp6-/-) — bu genetik modifikatsiya bo‘lib, unda ma’lum bir oqsil (GPVI) sintezini ta’minlovchi gen ataylab o‘chiriladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"22-otkir-miokard-infarkti-omi-va-reperfuziya-modeli\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#22-otkir-miokard-infarkti-omi-va-reperfuziya-modeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.2 O‘tkir miokard infarkti (OMI) va reperfuziya modeli&lt;/span&gt;&lt;/a&gt;2.2 O‘tkir miokard infarkti (OMI) va reperfuziya modeli&lt;/h4&gt;\n&lt;p&gt;Jarrohlik travmasini kamaytirish uchun yopiq ko‘krak qafasi modeli qo‘llanildi. 10–12 haftalik erkak sichqonlar ketamin (100 mg/kg) va ksilazin (10 mg/kg) yordamida behushlandi. Infarkt chap oldingi tushuvchi arteriyani (LAD) 60 daqiqa davomida bog‘lash orqali chaqirildi. Reperfuziya EKGdagi ST-segment o‘zgarishlari bilan tasdiqlandi. Chap qorincha funksiyasi Vevo 3100 apparati yordamida 1, 5 va 21-kunlarda ekokardiyografiya orqali baholandi.&lt;/p&gt;\n&lt;h4 id=\"23-trombotsitlar-sonini-olchash\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#23-trombotsitlar-sonini-olchash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.3 Trombotsitlar sonini o‘lchash&lt;/span&gt;&lt;/a&gt;2.3 Trombotsitlar sonini o‘lchash&lt;/h4&gt;\n&lt;p&gt;Qon namunalari izofluran (2–3%) ostida retrobulbar venoz chigalidan olindi. Qon geparinli eritmaga (20 U/ml) yig‘ildi va Sysmex gematologik analizatorida tahlil qilindi.&lt;/p&gt;\n&lt;h4 id=\"24-trombotsitlar-oqim-sitometriyasi\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#24-trombotsitlar-oqim-sitometriyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.4 Trombotsitlar oqim sitometriyasi&lt;/span&gt;&lt;/a&gt;2.4 Trombotsitlar oqim sitometriyasi&lt;/h4&gt;\n&lt;p&gt;Qon Tyrode buferida (pH 7,35) 650 g tezlikda 5 daqiqa davomida ikki marta yuvildi. Trombotsitlar holatini baholash uchun oqim sitometriyasi qo‘llanildi: yosh trombotsitlar tiazol to‘q sariq rangi va GPIbα antitanachalari bilan aniqlandi. Trombotsitlarning desiallanishi RCA-1 lektini, fosfatidilserin (PS) ekspozitsiyasi esa Annexin V bog‘lanishi orqali aniqlandi. Ma’lumotlar FlowJo dasturida tahlil qilindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Oqim sitometriyasi — suyuqlik oqimidagi hujayralarni tahlil qilish usuli bo‘lib, u hujayra yuzasidagi oqsillarni va ularning holatini tezkor aniqlash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"25-taloq-kesmalarining-immunogistokimyosi\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#25-taloq-kesmalarining-immunogistokimyosi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.5 Taloq kesmalarining immunogistokimyosi&lt;/span&gt;&lt;/a&gt;2.5 Taloq kesmalarining immunogistokimyosi&lt;/h4&gt;\n&lt;p&gt;Infarktdan keyin taloqlar olindi, kerosinda qotirildi va Microm HM355 mikrotomi yordamida 5 mkm qalinlikdagi kesmalarga bo‘lindi. Gematoksilin va eozin bilan bo‘yalgandan so‘ng, har bir ko‘rish maydonidagi megakariotsitlar soni hisoblab chiqildi.&lt;/p&gt;\n&lt;h4 id=\"jigar-toqimasidan-miqdoriy-real-vaqt-rejimidagi-polimeraza-zanjiri-akssasi-qrt-pcr\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#jigar-toqimasidan-miqdoriy-real-vaqt-rejimidagi-polimeraza-zanjiri-akssasi-qrt-pcr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Jigar to‘qimasidan miqdoriy real vaqt rejimidagi polimeraza zanjiri akssasi (qRT-PCR)&lt;/span&gt;&lt;/a&gt;Jigar to‘qimasidan miqdoriy real vaqt rejimidagi polimeraza zanjiri akssasi (qRT-PCR)&lt;/h4&gt;\n&lt;p&gt;Endogen tarzda ifodalangan Tpo, Asgr1 (Clec4h1), Asgr2 (Clec4h2) va interleukin-6 retseptori (Il6ra) darajalarini tahlil qilish uchun miokard infarktidan oldin hamda 6 va 24 soat o‘tgach olingan jigarning umumiy RNK namunalari ishlatildi. Jigar to‘qimasi Precellys 24-Dual (Bertin, Frankfurt-Mayn, Germaniya) gomogenizatori va Precellys Lysing Kit to‘plami yordamida 500 mkl sovuq Trizol eritmasida 5000 ayl/min tezlikda 30 soniya davomida maydalab gomogenizatsiya qilindi. Umumiy jigar RNKsini ajratib olish Trizol va xloroform bilan ekstraktsiya usuli orqali bajarildi. Buning uchun jigar lizatiga 100 mkl xloroform qo‘shilib, so‘ngra 4°C haroratda 18000 g kuch bilan 15 daqiqa davomida markazdan qochirma kuch ostida aylantirildi.&lt;/p&gt;\n&lt;p&gt;Yuqori suvli faza yigib olinib, DNKni cho‘ktirish uchun 100% li etanol bilan aralashtirildi. Namunalar ishlab chiqaruvchining ko‘rsatmalariga muvofiq RNAeasy Mini Kit (Qiagen, Hilden, Germaniya) to‘plami yordamida tozalandi. RNKning umumiy konsentratsiyasi va tozalik darajasi Eppendorf BioPhotometer® D30 spektrofotometri yordamida o‘lchandi. KDNK hosil qilish uchun Reverse Transcription Kit (InPromII Reverse Transcription System; Promega, Valdorf, Germaniya) yordamida jami 200 ng RNK ishlatildi. Teskari transkripsiyadan so‘ng Fast Sybr Green Master Mix (Thermo Fisher Scientific, Uoltem, AQSh) yordamida miqdoriy PSR amplifikatsiyasi amalga oshirildi. Maqsadli genlarning ekspresiya darajasi nazorat guruhidagi sog‘lom sichqonlarning Follistatin Like 1 (Fstl1) RNK darajasiga nisbatan normallashtirildi. Ma'lumotlarni tahlil qilish uchun ΔΔCT usulidan foydalanildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;qRT-PCR usuli hujayralardagi ma'lum genlarning faolligini aniq o'lchashga imkon beradi, bu esa infarktdan keyin jigarda yuzaga keladigan o'zgarishlarni baholash uchun muhimdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"jigar-toqimasining-western-blot-wb-tahlili\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#jigar-toqimasining-western-blot-wb-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Jigar to‘qimasining Western Blot (WB) tahlili&lt;/span&gt;&lt;/a&gt;Jigar to‘qimasining Western Blot (WB) tahlili&lt;/h4&gt;\n&lt;p&gt;STAT3 oqsili va uning fosforillangan shaklining umumiy miqdorini aniqlash maqsadida miokard infarktidan oldin va keyin jigar lizatlari ustida Western Blot tahlili bajarildi. Buning uchun Cell Signaling Technology (Denvers, AQSh) kompaniyasining STAT3 (D3Z26) Rabbit mAb (№ 12640) va P-STAT3 (Y705) Rabbit mAb (№ 9145) antitelolaridan foydalanildi. Jigar to‘qimasi RIPA buferida (150 mM NaCl, 50 mM Tris-Base, 0.1% SDS, 0.5% natriy deoksixolat, 1% TritonX-100, 1x proteaza ingibitorlari, pH=8.0) Precellys 24-Dual gomogenizatori yordamida 5000 ayl/min tezlikda 30 soniya davomida gomogenlashtirildi.&lt;/p&gt;\n&lt;p&gt;Oqsil konsentratsiyasi aniqlangandan so‘ng, namunalar qaytaruvchi Laemmli buferida har bir namuna uchun 50 mkt konsentratsiyada tayyorlandi, 95°C haroratda 5 daqiqa davomida denaturatsiya qilindi, SDS-poliakrilamid gelida ajratildi va nitrotsellyuloza membranaga (GE Healthcare, Herkules, AQSh) ko‘chirildi. Barcha antitelolar Cell Signaling (Kembrij, Buyuk Britaniya) kompaniyasidan olingan bo‘lib, protokollarga qat'iy rioya qilindi. Vizualizatsiya uchun membranalar peroksidaza bilan bog‘langan echki quyoniga qarshi IgG (GE Healthcare, Chikago, AQSh) va Immobilon Western Chemiluminescent HRP Substrate eritmasi bilan inkubatsiya qilindi. GAPDH (14C10, № 2118, Cell Signaling Technology) nazorat oqsili sifatida xizmat qildi.&lt;/p&gt;\n&lt;h4 id=\"ferment-bilan-boglangan-immunosorbent-tahlili-elisa\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#ferment-bilan-boglangan-immunosorbent-tahlili-elisa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ferment bilan bog‘langan immunosorbent tahlili (ELISA)&lt;/span&gt;&lt;/a&gt;Ferment bilan bog‘langan immunosorbent tahlili (ELISA)&lt;/h4&gt;\n&lt;p&gt;Miokard infarktidan keyingi turli vaqt oralig‘ida sichqonlar qon plazmasidagi IL-6 va TPO miqdorini aniqlash uchun geparinli qon 650 g da 10 daqiqa davomida markazdan qochirma kuch yordamida ishlanib, plasma ajratib olindi. Tsitokin miqdori R&amp;amp;D Systems kompaniyasining Mouse IL-6 DuoSet ELISA (DY406) va Mouse Thrombopoietin DuoSet ELISA (DY488) to‘plamlari yordamida ishlab chiqaruvchi ko‘rsatmasi bo‘yicha o‘lchandi.&lt;/p&gt;\n&lt;h4 id=\"statistik-tahlil\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#statistik-tahlil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Statistik tahlil&lt;/span&gt;&lt;/a&gt;Statistik tahlil&lt;/h4&gt;\n&lt;p&gt;Barcha tajribalar kamida uch marta takrorlandi, bunda n sifatida alohida hayvon olindi. Ma'lumotlar arifmetik o‘rtacha qiymatlar va o‘rtachaning standart xatosi (SEM) shaklida ko‘rsatildi. Statistik tahlil GraphPad Prism 9.5.1 (GraphPad Software, San-Diego, AQSh) dasturiy ta'minoti yordamida bajarildi. Ikki guruh o‘rtasidagi farqlarni aniqlash uchun juftlanmagan Styudent t-testi yoki ko‘p martali t-test qo‘llandi. Uch va undan ortiq guruhlarni solishtirish uchun Tukey, Sidak yoki Dunnett post-hoc testlari bilan bir tomonlama yoki ikki tomonlama ANOVA tahlili bajarildi. P &amp;lt; 0.05 ko‘rsatkichi statistik ahamiyatli deb qabul qilindi. Barcha grafiklardagi yulduzchalar va romblar sezilarli farqlarni bildiradi (*, # p &amp;lt; 0.05; **, ## p &amp;lt; 0.01; ***, ### p &amp;lt; 0.001).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s-f3.jpg\" alt=\"3-rasm. O‘tkir trombotsitopeniya I/R shikastlanishidan keyin megakariopoezni qo‘zg‘atadi. Sichqonlar LAD ligatsiyasidan \" /&gt;&lt;/p&gt;\n&lt;p&gt;*3-rasm. O‘tkir trombotsitopeniya I/R shikastlanishidan keyin megakariopoezni qo‘zg‘atadi. Sichqonlar LAD ligatsiyasidan 24 soat oldin antitelolar yordamida keltirib chiqarilgan trombotsitlar kamayishini boshdan kechirdi. (A) Sichqonlarning butun qonida aniqlangan I/R shikastlanishidan 6 soat o‘tgach trombotsitlar sonini aniqlash (n=10). (B) Trombotsitlari kamaytirilgan va tegishli nazorat sichqonlarida I/R shikastlanishidan 6 soat o‘tgach nisbiy taloq vazni nisbatlarini aniqlash (n=10). I/R shikastlanishidan keyin trombotsitlari kamaytirilgan sichqonlar va tegishli nazorat guruhlarining IL-6 (C) va TPO (D) plazma darajalarini baholash (n=9-10). (E) Trombotsitlari kamaytirilgan va tegishli nazorat sichqonlarining butun jigar to‘qimalarida I/R shikastlanishidan oldin va keyin Tpo ekspressiyasini tartibga solishda ishtirok etuvchi turli xil retseptorlarning nisbiy gen ekspressiyasi tahlil qilindi (n=4-5). (F) Butun jigar to‘qimalari I/R shikastlanishidan oldin va keyin trombotsitlari kamaytirilgan sichqonlar va tegishli nazorat guruhlari yordamida ko‘rsatilgan vaqt nuqtalarida STAT3 fosforillanishi uchun tahlil qilindi (n=4). pSTAT3 miqdorini aniqlash (chap panel) va pSTAT3, umumiy STAT3 va GAPDH ning vakillik Vestern blotlari (o‘ng panel) ko‘rsatilgan. (G) Taloq kesmalari tayyorlandi va har bir FOV uchun megakariotsitlarning umumiy sonini sanash uchun H&amp;amp;E bilan bo‘yaldi (n=6). Ma'lumotlar o‘rtacha ± SEM sifatida taqdim etilgan. Statistik tahlillar juftlashtirilmagan talaba t-testi (A-D), juftlashtirilmagan ko‘p t-testi (E) yoki Tukey ning bir nechta taqqoslash testi bilan ikki tomonlama ANOVA (F-G) yordamida amalga oshirildi. Yulduzchalar kamayish va tegishli nazorat o‘rtasidagi statistik farqni ko‘rsatadi, romb esa bitta guruh ichida MI dan oldin yoki keyin turli vaqt nuqtalari orasidagi farqlarni ko‘rsatadi; *, # p &amp;lt; 0,05, **; ## p &amp;lt; 0,01; **&lt;em&gt;, ### p &amp;lt; 0,001. H&amp;amp;E = gematoksilin va eozin; FOV = Ko‘rish maydoni.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s-f4.jpg\" alt=\"4-rasm. GPVI yetishmovchiligi I/R shikastlanishidan keyin erta vaqtlarda jigar to‘qimalarida trombopoyetin ishlab chiqar\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm. GPVI yetishmovchiligi I/R shikastlanishidan keyin erta vaqtlarda jigar to‘qimalarida trombopoyetin ishlab chiqarilishiga yoki STAT3 faollashuviga ta'sir qilmaydi. GPVI yetishmovchiligi I/R shikastlanishidan keyin trombotsitlar almashinuviga katta ta'sir ko‘rsatmaydi. (A) 24 soatlik I/R shikastlanishidan keyin Gp6+/+ va Gp6-/- sichqonlar plazmasida TPO ni baholash (n=6). (B-E) I/R shikastlanishidan oldin va keyin Gp6+/+ va Gp6-/- sichqonlarning butun jigar to‘qimalarida Tpo ekspressiyasini tartibga solishda ishtirok etuvchi turli xil retseptorlarning nisbiy gen ekspressiyasi tahlil qilindi (n=3-4). Asgr1 (B), Asgr2 (C), IL6r yoki TPO (E) nisbiy gen ekspressiyalarida hech qanday farq aniqlanmadi. (F) STAT3 fosforillanishi I/R shikastlanishidan oldin va keyin ko‘rsatilgan vaqt nuqtalarida Gp6+/+ va Gp6-/- sichqonlarning butun jigar to‘qimalarida tahlil qilindi. pSTAT3, umumiy STAT3 va GAPDH ning vakillik Vestern blotlari (chap panel) va STAT3 fosforillanishini miqdoriy aniqlash (o‘ng panel) ko‘rsatilgan (n=3-8). Ma'lumotlar o‘rtacha ± SEM sifatida taqdim etilgan. Statistik tahlillar juftlashtirilmagan talaba t-testi (A) yoki Tukey ning bir nechta taqqoslash testi bilan ikki tomonlama ANOVA (B-F) yordamida amalga oshirildi.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"jadvallar\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#jadvallar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Jadvallar&lt;/span&gt;&lt;/a&gt;Jadvallar&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 1.&lt;/strong&gt; PCR uchun primerlar&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Gen&lt;/th&gt;\n&lt;th&gt;To'g'ridan-to'g'ri primer&lt;/th&gt;\n&lt;th&gt;Teskari primer&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Tpo&lt;/td&gt;\n&lt;td&gt;forward 5´CACAGCTGTCCCAAGCAGTA 3´&lt;/td&gt;\n&lt;td&gt;reverse 5´CATTCACAGGTCCGTGTGTC 3`&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Asgr1 (Clec4h1)&lt;/td&gt;\n&lt;td&gt;forward 5´ACGTGAAGCAGTTAGTGTCTG 3´&lt;/td&gt;\n&lt;td&gt;reverse 5´CCTTCATACTCCACCCAGTTG 3´&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Asgr1 (Clec4h2)&lt;/td&gt;\n&lt;td&gt;forward 5´GCTCAGTGGCGATGATG 3´&lt;/td&gt;\n&lt;td&gt;reverse 5´AGAGGCGCTGAGGAAAGG 3´&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Il6ra&lt;/td&gt;\n&lt;td&gt;forward 5´ACCTTCGGCTTCAAAATGCCAGTT 3´&lt;/td&gt;\n&lt;td&gt;reverse 5´CACCTAGAAAACCCTGCTGCGA 3´&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;
