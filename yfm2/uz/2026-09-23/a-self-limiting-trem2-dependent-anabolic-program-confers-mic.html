            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"223\" cy=\"80\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"517\" cy=\"253\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Alzgeymer kasalligida miya&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;hujayralari nima uchun&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;charchaydi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-f1.jpg\" alt=\"1-rasm: Mikroqliya Aβ patologiyasiga nisbatan proteom miqyosidagi anabolik moslashuvni namoyon qiladi. (A) Eksperimental\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Mikroqliya Aβ patologiyasiga nisbatan proteom miqyosidagi anabolik moslashuvni namoyon qiladi. (A) Eksperimental sxema. Asosiy mikroqliya integratsiyalashgan proteomik va transkriptomik profillash uchun 3 va 9 oylik AppNL-G-F va AppNL-G-F;Trem2KO sichqonlaridan ajratib olindi. (B) Oqsillar sintezi yo'llarining boyishini ta'kidlaydigan (qizil o'qlar), 9 oylik AppNL-G-F sichqonlari mikroqliyasidagi farqli miqdordagi oqsillarning (DAP) Ingenuity yo'llari tahlili (IPA) 3 oylik AppNL-G-F mikroqliyasiga nisbatan. (C–D) Hujayra komponenti (C) va Biologik jarayon (D) atamalari uchun Genlar to'plamini boyitish tahlili (GSEA) nuqtali grafiklari. Qizil o'qlar 9 oylik AppNL-G-F mikroqliyasida \"Ribosom\" (anabolik) imzosining bir vaqtning o'zida boyiganligini va to'q sariq o'qlar \"Lizosomal membrana\" (katabolik) imzolari boyiganligini ko'rsatadi. (E) IPA va (F) 9 oylik AppNL-G-F sichqonlarida differensial ekspressiya qilingan genning (DEG) GSEA, oqsil translyatsiyasida ishtirok etuvchi genlarni (qizil o'qlar) va katabolik jarayonlarni (to'q sariq o'qlar) ta'kidlaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Miyaning asosiy tozalovchi hujayralari bo'lgan mikrogliya toksik oqsillarni yo'q qilishga harakat qiladi. Buning uchun ularga ulkan energiya va oqsillar sintezi kerak. Biroq blyashkalar ko'payishi bilan bu mexanizm so'nib, hujayralarni himoyasiz qoldiradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Mikrogliya TREM2 ga bog'liq anabolik dasturni faollashtiradi.&lt;/li&gt;\n&lt;li&gt;Blyashkalar ko'paygan sari hujayralar quvvati pasayadi.&lt;/li&gt;\n&lt;li&gt;Holat 523 ta donor ma'lumotlari asosida tasdiqlandi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Alzgeymer kasalligida mikrogliya amyloid blyashkalarini o'rab olib, ularni yutishga urinadi. Olimlarning aniqlashicha, bu jarayon TREM2 retseptoriga bog'liq bo'lgan kuchli anabolik dasturni ishga tushiradi. U oqsil sintezi va mitoxondriyalarning ko'payishini ta'minlaydi.&lt;/p&gt;\n&lt;p&gt;Biroq sichqonlar to'qimalari va 523 nafar inson ma'lumotlarini tahlil qilish bu zaxira vaqt o'tishi bilan kamayishini ko'rsatdi. Kasallik rivojlangani sari hujayralarning biosintez qobiliyati pasayadi. Bu holat antikorlar bilan davolashda hujayralarning charchab qolish xavfini tug'diradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot hayvonlar modellari va inson to'qimalarining tahliliga asoslangan bo'lib, bevosita davolash tavsiyalarini bermaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Mikrogliya Altsgeymer kasalligining (AK) rivojlanishida hal qiluvchi rol o'ynaydi va eng kuchli genetik xavf omillaridan biri bo'lgan TREM2 retseptori plitalar bilan bog'lanish uchun zarur bo'lgan kasallik bilan bog'liq mikrogliya (DAM) holatini faollashtiradi. TREM2 bu himoya funksiyasini qanday saqlab qolishi va kasallik kuchayishi bilan nima uchun zaiflashishi hozircha noma'lum. Proteomika, yagona hujayra transkriptomikasi va in vivo metabolik markerlash usullaridan foydalangan holda, tadqiqotchilar amiloid plitalari yaqinidagi mikrogliya yangi oqsil sintezini mitoxondriya biogenezi bilan bog'lovchi TREM2-ga bog'liq anabolik dasturni ishga tushirishini ko'rsatdi.&lt;/p&gt;\n&lt;p&gt;Aynan shu anabolik dastur, DAM imzosi emas, balki fagotsitar jihatdan qobiliyatli mikrogliyani belgilaydi; uning yo'qolishi proteostatik ortiqcha yuklanish va mitoxondriyal disfunksiya bilan bog'liq. Kutilmaganda, ushbu anabolik dastur o'z-o'zidan cheklangan bo'lib, past amiloid yuki paytida cho'qqiga chiqadi va yuk ko'tarilishi bilan kamayadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mikrogliyaning anabolik salohiyati faollashuv holatiga qaraganda Altsgeymer kasalligida hujayra chidamliligining asosiy ko'rsatkichidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bu pasayish odamlarda ham saqlanib qoladi: 523 nafar donor ishtirokidagi tahlillarga ko'ra, anabolik qobiliyat TREM2 darajasiga mos keladi, ammo DAM imzosi o'sishda davom etsa ham, rivojlangan Braak bosqichida keskin kamayadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Braak bosqichlari — neyrodegenerativ jarayonning og'irligini baholash uchun Altsgeymer kasalligidagi patologik o'zgarishlarning tarqalish darajasini ko'rsatuvchi gistologik tasnif.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Shunday qilib, anabolik sig'im Altsgeymer kasalligida mikrogliyaning chidamliligini belgilaydi va anti-amiloid antikorlari yordamida fagotsitotsitni doimiy ravishda rag'batlantirish biosintetik charchoq va o'z-o'zini cheklovchi samaradorlik xavfini tug'diradi.&lt;/p&gt;\n&lt;h3 id=\"kirish1\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#kirish1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"mikroglia-roli-va-altsgeymer-kasalligidagi-metabolik-muammolar\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#mikroglia-roli-va-altsgeymer-kasalligidagi-metabolik-muammolar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mikroglia roli va Altsgeymer kasalligidagi metabolik muammolar&lt;/span&gt;&lt;/a&gt;Mikroglia roli va Altsgeymer kasalligidagi metabolik muammolar&lt;/h4&gt;\n&lt;p&gt;Altsgeymer kasalligida (AK) mikroglia neyrotoksik Aβ agregatlarini to'plash va tozalash vazifasini bajaruvchi asosiy himoya chizig'i bo'lib xizmat qiladi. Genetik tadqiqotlar mikroglial funksiyani AK xavfining markaziga qo'yib, kuchli tug'ma immun javob patogenezni kechiktirishga yordam berishini ko'rsatadi. Biroq, bu himoya qobiliyati turg'un emas. Patologiya rivojlangani sari mikroglia chuqur fenotipik o'zgarishlarga uchraydi: dastlab u himoya javobini shakllantiradi, lekin ko'pincha neyrodegeneratsiyani cheklay olmaydigan tartibsiz, qarigan yoki charchagan holatlarga o'tadi. Shuning uchun surunkali proteotoksik stress sharoitida mikrogliyaning funksional barqarorligini saqlab qolishiga imkon beruvchi mexanizmlarni tushunish terapevtik aralashuv uchun ustuvor vazifa hisoblanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mikroglia Aβ agregatlaridan miyani himoya qiladi, biroq AK kuchayishi bilan charchaydi, shuning uchun hujayra barqarorligi mexanizmlarini topish davolash uchun juda muhimdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bir hujayrali transkriptomika sohasidagi so'nggi yutuqlar ushbu javob trayektoriyasini xaritalashtirib, konservativ «Kasallik bilan bog'langan mikroglia» (DAM) yoki «Mikroglial neyrodegenerativ fenotip» (MGnD) imzosini aniqladi. Asosan TREM2 (myeloid hujayralarda ifodalangan qo'zg'atuvchi retseptor 2) tomonidan boshqariladigan bu dastur gomeostatik nazorat nuqtalarini pasaytirishni (masalan, P2ry12, Cx3cr1) va lipidlarni sezish hamda fagotsitar yo'llarni faollashtirishni (masalan, Apoe, Lpl, Clec7a) o'z ichiga oladi. Funksiyani yo'qotuvchi variantlar (masalan, R47H) TREM2 muhimligini ta'kidlaydi, chunki ular AK xavfini sezilarli darajada oshiradi va blyashkalar atrofida mikroglial klasterlanishning buzilishi hamda diffuz, neyrotoksik amiloid patologiyasi bilan bog'lanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DAM/MGnD — bu blyashkalar yaqinidagi mikroglial genlar faolligining o'ziga xos profillari bo'lib, unda TREM2 retseptori hujayralarni fagotsitozga o'tkazishda asosiy rol o'ynaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;DAM/MGnD konsepsiyasi juda ta'sirli bo'lishiga qaramay, odamlardagi tadqiqotlar mikroglial holatlarning kengroq spektrini tasvirlaydi va transkripsion holatning o'zi funksional imkoniyatlarni to'liq qamrab ololmasligini ko'rsatadi. Darhaqiqat, transkripsion imzoni olish bu shunchaki loyihadir: blyashka bilan bog'langan mikroglianing funksiyalarini bajarish (proliferatsiya, migratsiya va uzluksiz fagotsitoz) ulkan biosintetik va bioenergetik talabni qo'yadi, bu Aβ parchalanishi paytida sarflanganlarning o'rnini bosish uchun yangi membranalar, gidrolitik fermentlar va organellalarni doimiy sintez qilishni talab qiladi. AK miyasida mikroglia bu holatni saqlab qolish uchun metabolik resurslarni qanday olishi noma'lumligicha qolmoqda. Periferik makrofaglarda immunometabolizm yaxshi o'rganilgan bo'lsa-da — bunda faollashuv aniq metabolik o'tishlar bilan bog'lanadi (masalan, glikoliz va oksidlovchi fosforillanish), blyashka bilan bog'langan mikroglianing metabolik ehtiyojlari ancha kam o'rganilgan.&lt;/p&gt;\n&lt;h4 id=\"mikroglianing-metabolik-rezistentligini-organishning-integratsiyalashgan-yondashuvi\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#mikroglianing-metabolik-rezistentligini-organishning-integratsiyalashgan-yondashuvi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mikroglianing metabolik rezistentligini o'rganishning integratsiyalashgan yondashuvi&lt;/span&gt;&lt;/a&gt;Mikroglianing metabolik rezistentligini o'rganishning integratsiyalashgan yondashuvi&lt;/h4&gt;\n&lt;p&gt;Ushbu ishda biz Aβ patologiyasiga nisbatan mikroglial barqarorlikning biosintetik va bioenergetik xususiyatlarini tavsiflash uchun integratsiyalashgan proteomika, transkriptomika, bir hujayrali RNK sekvenirashi va &lt;em&gt;in vivo&lt;/em&gt; metabolik nishonlashni birlashtiramiz. Biz Aβ patologiyasiga TREM2 ga bog'liq bo'lgan anabolik dastur, ya'ni oqsil sintezi va mitoxondriyal biogenezning muvofiqlashtirilgan o'sishi hamrohlik qilishini aniqlaymiz. Biz buni &lt;em&gt;in situ&lt;/em&gt; fagotsitar chegarada aniqladik va aynan shu dastur DAM transkripsion imzosidan ko'ra fagotsitar qobiliyatga ega mikrogliani ajratib turadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kuzatilgan effektlar sichqonlar va inson to'qimalarida tekshiriladi, biroq laboratoriya natijalarini klinikaga o'tkazish immun tizimining farqlari tufayli ehtiyotkorlikni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kutilmaganda, bu dastur o'z-o'zidan cheklanadigan bo'lib chiqdi: u past amiloid yukiga ega mikrogliyada cho'qqiga chiqadi va yuk ko'tarilishi bilan sichqon hamda inson to'qimalarida asta-sekin bostiriladi. TREM2 bo'lmaganda, mikroglia bu javobni saqlab qolmaydi va buning o'rniga proteostatik ortiqcha yuk va mitoxondriyal disfunksiyani namoyon etadi. Biz ushbu kuzatishlarni mikroglial tozalashning talab-taklif modeliga integratsiya qilamiz va uning samaradorligi xuddi shu fagotsitar qobiliyatga bog'lgan amiloidga qarshi immunoterapiya uchun ta'sirini ko'rib chiqamiz.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"mikrogliya-amiloid-patologiyasiga-javoban-trem2-ga-bogliq-bolgan-anabolik-dasturni-ishga-tushiradi\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#mikrogliya-amiloid-patologiyasiga-javoban-trem2-ga-bogliq-bolgan-anabolik-dasturni-ishga-tushiradi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mikrogliya amiloid patologiyasiga javoban TREM2 ga bog'liq bo'lgan anabolik dasturni ishga tushiradi&lt;/span&gt;&lt;/a&gt;Mikrogliya amiloid patologiyasiga javoban TREM2 ga bog'liq bo'lgan anabolik dasturni ishga tushiradi&lt;/h4&gt;\n&lt;p&gt;Amiloid patologiyasiga mikrogliyaning moslashuvi mexanizmlarini tushunish uchun olimlar 3 va 9 oylik App^NL-G-F hamda App&lt;sup&gt;NL-G-F;Trem2&lt;/sup&gt;KO liniyasidagi sichqonlardan ajratib olingan birlamchi mikrogliya hujayralarining integratsiyalashgan proteom va transkriptom tahlilini o'tkazdilar, bu amiloid to'planishining mos ravishda erta va o'tish bosqichlariga to'g'ri keladi (Rasm 1A).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-f1.jpg\" alt=\"1-rasm: Mikroqliya Aβ patologiyasiga nisbatan proteom miqyosidagi anabolik moslashuvni namoyon qiladi. (A) Eksperimental\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Mikroqliya Aβ patologiyasiga nisbatan proteom miqyosidagi anabolik moslashuvni namoyon qiladi. (A) Eksperimental sxema. Asosiy mikroqliya integratsiyalashgan proteomik va transkriptomik profillash uchun 3 va 9 oylik AppNL-G-F va AppNL-G-F;Trem2KO sichqonlaridan ajratib olindi. (B) Oqsillar sintezi yo'llarining boyishini ta'kidlaydigan (qizil o'qlar), 9 oylik AppNL-G-F sichqonlari mikroqliyasidagi farqli miqdordagi oqsillarning (DAP) Ingenuity yo'llari tahlili (IPA) 3 oylik AppNL-G-F mikroqliyasiga nisbatan. (C–D) Hujayra komponenti (C) va Biologik jarayon (D) atamalari uchun Genlar to'plamini boyitish tahlili (GSEA) nuqtali grafiklari. Qizil o'qlar 9 oylik AppNL-G-F mikroqliyasida \"Ribosom\" (anabolik) imzosining bir vaqtning o'zida boyiganligini va to'q sariq o'qlar \"Lizosomal membrana\" (katabolik) imzolari boyiganligini ko'rsatadi. (E) IPA va (F) 9 oylik AppNL-G-F sichqonlarida differensial ekspressiya qilingan genning (DEG) GSEA, oqsil translyatsiyasida ishtirok etuvchi genlarni (qizil o'qlar) va katabolik jarayonlarni (to'q sariq o'qlar) ta'kidlaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Proteom va transkriptom tahlili hujayradagi barcha oqsillar va faol genlarni bir vaqtning o'zida baholashga imkon beradi, Trem2 geni nokaut qilingan sichqon liniyalari esa kasallikka javob qaytarishda ushbu retseptorning rolini tushunishga yordam beradi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;App^NL-G-F mikrogliyasida proteomik tahlil 7000 dan ortiq oqsillarni aniqladi, ulardan 2621 tasi 3 oylikdan 9 oylikkacha bo'lgan davrda sezilarli darajada o'zgargan bo'lib, bu patologiyaning rivojlanishi bilan proteomning keng ko'lamli qayta qurilganidan dalolat beradi. Ingenuity yo'llari tahlili (IPA) oqsil sintezi yo'llarining, jumladan translatsiyaning boshlanishi, uzayishi va yakunlanishi hamda EIF2 signallarining kuchli faollashganini ko'rsatdi (Rasm 1B). Hujayra komponentlari va biologik jarayonlar bo'yicha Genlar to'plamini boyitish tahlili (GSEA) sitozol va mitoxondriyal ribosomal kichik birliklarni o'z ichiga olgan translatsiya apparati komponentlari ko'payganini tasdiqladi (Rasm 1C–D; S1A-rasm). Shu bilan birga, autofagosoma, lizosoma membranalari va fagotsitik pufakchalar kabi degradatsiya jarayonlari bilan bog'liq oqsillar ham boyigan (Rasm 1C–D). Transkriptomik tahlil ham kamroq darajada bo'lsa-da ushbu moslashuvchan javobni tasdiqladi va oqsil translatsiyasi (Rasm 1E), ribosomalar biogenezi hamda mitoxondriyal nafas olish zanjiri komplekslari genlari ekspresiyasining oshishini ko'rsatdi (Rasm 1F; S1B-rasm). Xulosa qilib aytganda, mikrogliya Aβ patologiyasi davrida muvofiqlashtirilgan metabolik o'zgarishlarga uchraydi va proteom yangilanishini ta'minlash uchun oqsil sintezini kuchaytirilgan degradatsiya qobiliyati bilan birlashtiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Amiloid patologiyasining rivojlanishi fonida mikrogliya oqsillar sintezi va parchalanishini kuchaytiradi, biroq TREM2 yetishmovchiligi 9 oylikka kelib bu anabolik dasturni butunlay izdan chiqaradi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu metabolik o'zgarishlar TREM2 ga bog'liqligini aniqlash uchun mualliflar App^NL-G-F va App&lt;sup&gt;NL-G-F;Trem2&lt;/sup&gt;KO sichqonlarining profillarini taqqosladilar. TREM2 yo'qligining ta'siri bevosita kasallik bosqichiga bog'liq edi. Aβ miqdori minimal bo'lgan 3 oylik davrda TREM2 yetishmovchiligi mikrogliya proteomida sezilarli o'zgarish keltirib chiqarmadi (S2A-rasm). Biroq, 9 oylikka kelib, TREM2 ning yo'qolishi proteomni tubdan buzdi va 1480 ta oqsilning sezilarli darajada o'zgarishiga olib keldi (Rasm 2A). Ham proteom, ham transkriptom darajasida TREM2 ning yo'qolishi kasallik bilan bog'liq mikrogliya (DAM) imzolarini, jumladan Gpnmb, Cst7 va Lpl kabilarni keskin kamaytirdi (Rasm 2A–B), bu TREM2 ning Aβ stressi ostida homeostatik mikrogliyani DAMga aylantirishdagi hal qiluvchi rolini tasdiqlaydi. DAM imzosining bostirilishidan tashqari, TREM2 yetishmovchiligining asosiy oqibati anabolik javobning qulashi bo'ldi. Proteomik IPA translatsiya bilan bog'liq yo'llarning, jumladan SRP ga bog'liq oqsilni nishonga olish, translatsiya uzayishi va yakunlanishining sezilarli darajada pasayganini aniqladi (Rasm 2C). GSEA sitozol va mitoxondriyal ribosomal komponentlarning, shuningdek ribosomalar biogenezining keng qamrovli qisqarishini tasdiqladi (Rasm 2D; S2B-rasm). Transkriptomik tahlil oqsil translatsiyasi, ribosomalar yig'ilishi va mitoxondriyal komplekslarda qatnashuvchi genlar ekspresiyasining pasayishini ko'rsatib, bu topilmalarni mustahkamladi (Rasm 2E–F; S2C-rasm).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-f2.jpg\" alt=\"2-rasm: TREM2 yetishmovchiligi anabolik javobning qulashiga sabab bo'ladi. (A) 9 oylik AppNL-G-F va AppNL-G-F;Trem2KO mi\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: TREM2 yetishmovchiligi anabolik javobning qulashiga sabab bo'ladi. (A) 9 oylik AppNL-G-F va AppNL-G-F;Trem2KO mikroqliyasining proteomini taqqoslovchi vulqon diagrammasi. Uchburchak nuqtalar AppNL-G-F;Trem2KO mikroqliyasidagi noyob o'zgartirilgan oqsillarni ko'rsatadi. Venn diagrammasi transkriptom va proteom orasidagi noyob va umumiy genlar hamda oqsillarni ko'rsatadi. (B) 9 oylik AppNL-G-F va AppNL-G-F;Trem2KO mikroqliyasining transkriptomini taqqoslovchi vulqon diagrammasi. (C) AppNL-G-F;Trem2KO mikroqliyasidagi eng yuqori o'rinli yo'llarning IPA tahlili, oqsil translyatsiyasi yo'llarining o'ziga xos bostirilishini (ko'k o'qlar) va sinaptik oqsillar darajasining oshishini (qizil o'qlar) ko'rsatadi. (D) Trem2KO mikroqliyasida sitozol va mitoxondrial ribosomalar komponentlarining keng qamrovli kamayishini tasdiqlovchi GSEA nuqtali grafiklari (ko'k o'qlar); qizil o'qlar sinaptik va miyelin imzolarining bir vaqtning o'zida to'planishini ko'rsatadi. (E) IPA va (F) 9 oylik AppNL-G-F va AppNL-G-F;Trem2KO mikroqliyasidagi differensial ekspressiya qilingan genning (DEG) GSEA tahlili, oqsil translyatsiyasi va ribosomada ishtirok etuvchi bostirilgan genlarni ta'kidlaydi (ko'k o'qlar).&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Tadqiqot xulosalari sun'iy mutatsiyalarga ega genetik sichqon modellarida olingan bo'lib, natijalarni odamlardagi sporalik Altsgeymer kasalligiga to'g'ridan-to'g'ri ko'chirishda ehtiyotkorlik talab etiladi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Proteom yangilanishidagi nuqsonlar natijasida Trem2^KO hujayralarida fagotsitozdan keyin tozalanib ketishi kerak bo'lgan sinaptik va mielin oqsillari to'planib qoldi (Rasm 2C–D). Bu proteostatik nosozlik o'ziga xos tarzda yuqori tartibga solingan oqsillarning aksariyati sinaptik komponentlar bo'lganida yaqqol ko'rindi (Rasm 2A). Ushbu topilmalar mikrogliya Aβ patologiyasiga proteomni qayta qurish va proteostazni saqlash bilan bog'liq TREM2 ga bog'liq anabolik dastur orqali moslashishini ko'rsatadi.&lt;/p&gt;\n&lt;h4 id=\"trem2-plaqalar-bilan-bogliq-mikrogliyada-yangi-oqsil-sintezini-faollashtiradi\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#trem2-plaqalar-bilan-bogliq-mikrogliyada-yangi-oqsil-sintezini-faollashtiradi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TREM2 plaqalar bilan bog'liq mikrogliyada yangi oqsil sintezini faollashtiradi&lt;/span&gt;&lt;/a&gt;TREM2 plaqalar bilan bog'liq mikrogliyada yangi oqsil sintezini faollashtiradi&lt;/h4&gt;\n&lt;p&gt;In vivo o'miks tahlillari orqali aniqlangan anabolik dasturni tasdiqlash uchun tadqiqotchilar yangi sintezlangan oqsillarni belgilash maqsadida Fluorescent Non-Canonical Amino Acid Tagging (FUNCAT) usulidan foydalandilar (3A-rasm). Yangi oqsillarga qo'shiladigan metionin analogi bo'lgan azidogomoalanin (AHA) qorin bo'shlig'iga yuborilgandan 16 soat o'tgach, CX3CR1+ CD45+ mikrogliba hujayralari oqim citometriyasi yordamida tahlil qilindi (SN-rasm). 3 oylik yoshda FUNCAT intensivligi AppNL-G-F va AppNL-G-F;Trem2KO liniyasidagi sichqonlarda bir xil edi. Biroq 9 oyligida AppNL-G-F sichqonlari mikrogliyasida oqsil sintezi taxminan ikki barobar oshgani kuzatildi, TREM2 yetishmovchiligi esa bu o'sishni butunlay to'xtatib qo'ydi (3B-C-rasm). Gistogrammalar AppNL-G-F mikrogliyasida yuqori FUNCAT darajasiga ega alohida kichik populyatsiya paydo bo'lganini ko'rsatdi (3B-rasm, qizil strelka). Ma'lumki, CD45high mikrogliba blyashkalar atrofida to'planadi, shuning uchun mualliflar buni oqsil sintezi bilan bog'lab o'rganishdi. CD45high kichik populyatsiyasi Aβ patologiyasi rivojlanishi bilan kengayib borsa-da (SN-rasm), bu jarayon Trem2 nokaut qilingan sichqonlarda deyarli kuzatilmadi. CD45high mikrogliba hujayralari CD45low hujayralarga nisbatan sezilarli darajada yuqori FUNCAT intensivligini ko'rsatdi (3D-rasm), bu esa blyashkalar bilan bog'liq mikrogliba oqsil sintezi kuchaygan asosiy populyatsiya ekanligini bildiradi. In situ FUNCAT usuli AppNL-G-F sichqonlarining blyashka yaqinidagi mikrogliyasida oqsil sintezi kuchayganini tasdiqladi, bu holat Trem2 yetishmovchiligida yo'qolgan edi (3E-F-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;FUNCAT — bu noan'anaviy aminokislotalarni flüoresan yorliqlash orqali tirik hujayralardagi yangi oqsil sintezi tezligini bevosita o'lchashga imkon beruvchi usul.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tarjima apparatining bevosita tarkibiy qismi orqali bu o'sishni tasdiqlash uchun olimlar anabolik imzo genlaridan biri bo'lgan eukariotik translokatsiya elongatsiya omili 1α1 (EEF1A1) uchun bo'yash ishlarini olib bordilar. EEF1A1 AppNL-G-F sichqonlarining blyashka atrofdagi mikrogliyasida kuchli darajada ortgan bo'lsa, AppNL-G-F;Trem2KO sichqonlarida bu kuzatilmadi (3G, H-rasm). Bu natijalar FUNCAT ma'lumotlari bilan to'liq mos kelib, anabolik dasturning joyida translokatsiya qobiliyatini oshirishi bilan bog'liqligini isbotladi. Ushbu natijalar ilgari aniqlangan TREM2-mTOR o'qiga mos keladi: mTORC1 faolligining klassik markeri bo'lgan fosforillangan ribosom oqsili S6 (p-RPS6) ham blyashka bilan bog'liq mikrogliyada TREM2 ga bog'liq holda oshgan (SN-rasm). Umuman olganda, bu topilmalar TREM2 ga bog'liq anabolik dastur blyashka atrofdagi mikrogliyada translokatsiya salohiyati va yangi oqsil sintezining oshishi bilan birga kechishini ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;9 oylik AppNL-G-F sichqonlarida mikrogliyadagi oqsil sintezi taxminan 2 marta ortadi va bu jarayon to'liq ravishda funksional TREM2 retseptoriga bog'liq.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"anabolik-moslashuv-trem2-ga-bogliq-va-ab-yuklanishi-boyicha-oz-ozini-cheklaydi\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#anabolik-moslashuv-trem2-ga-bogliq-va-ab-yuklanishi-boyicha-oz-ozini-cheklaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Anabolik moslashuv TREM2 ga bog'liq va Aβ yuklanishi bo'yicha o'z-o'zini cheklaydi&lt;/span&gt;&lt;/a&gt;Anabolik moslashuv TREM2 ga bog'liq va Aβ yuklanishi bo'yicha o'z-o'zini cheklaydi&lt;/h4&gt;\n&lt;p&gt;Fagotsitar yuklanish va metabolik javob o'rtasidagi bog'liqlikni aniqlash uchun biz fibrillyar Aβ ni belgilovchi Methoxy-X04 (X04) lyuminestsent zond yordamida Aβ bilan o'zaro ta'sir qiluvchi mikrogliya transkriptomlarini tahlil qildik (4A-rasm). AppNL-G-F va AppNL-G-F;Trem2KO sichqonlaridan olingan birlamchi mikrogliya X04⁺ (fagotsitlovchi) va X04⁻ (fagotsitlamaydigan) populyatsiyalarga ajratildi. X04⁺ hujayralar intensivligi bo'yicha past, o'rta va yuqori yuklanish guruhlariga bo'lindi (4B-rasm). Patologiyaning erta bosqichida (5-6 oy) X04⁺ hujayralar ulushi genotiplar o'rtasida o'xshash bo'lib, bu Aβ ni dastlabki yutish TREM2 ga bog'liq emasligini ko'rsatadi. Biroq, 9-10 oylikda TREM2 tanqisligi X04⁺ populyatsiyasini sezilarli darajada kamaytirdi, bu asosan X04high subpopulyatsiyasining yo'qolishi bilan bog'liq (4B-C rasmlar).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TREM2 tanqisligi amiloidni yutishga to'sqinlik qilmaydi, ammo 9 oylik yoshda yuqori amiloid yuklanishiga ega (X04high) mikroglialarning omon qolishini keskin kamaytiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Asosiy komponentlar tahlili (PCA) genotip va X04 intensivligi gradientiga qarab transkriptomik profillarning aniq ajralishini tasdiqladi (4D-rasm; SN 4A-B rasmlari). AppNL-G-F sichqonlarida Aβ fagotsitozi mitoxondrial yo'llarni (oksidlovchi fosforillanish, elektron transport zanjiri) va oqsil sintezi dasturlarini (translyatsiya, SRP-ga bog'liq nishonlash) kuchaytiradi (4E-rasm). TREM2 yo'qligi bu dasturni butunlay bloklaydi (SN 4C-rasm). Tahlillar shuni ko'rsatdiki, anabolik genlarning ifodalanishi X04low hujayralarida eng yuqori cho'qqiga chiqadi va yuklanish ortishi bilan kamayadi. Aksincha, DAM-imzo yo'llari (MHC II antigen taqdimoti) X04 intensivligi bilan ortadi, yallig'lanish yo'llari (TNF, IFN-γ) esa bostiriladi (4F-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DAM (Disease-Associated Microglia) — neyrodegeneratsiya paytida mikrogliyaning gomeostatik funksiyalarini yo'qotib, patologiyaga qarshi kurashish uchun genlarni faollashtiradigan maxsus holati.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Trem2KO sichqonlarida anabolik javob hatto X04low va X04medium guruhlarida ham kuzatilmaydi (4G-rasm). Yuklanish ortishi bilan bu hujayralarda mitoxondrial disfunksiya belgilari, kompensator glikoliz va yallig'lanish signallarining kuchayishi kuzatiladi (4G-H rasmlar). Xulosa qilib aytganda, anabolik dastur TREM2 ga bog'liq va o'z-o'zini cheklaydi: u Aβ yutilganda faollashadi, past yuklanishda eng yuqori cho'qqiga chiqadi va yuklanish ortishi bilan so'nadi, bu esa TREM2 tanqisligida mikrogliyaning metabolik qulashiga olib keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot sichqonlarning model liniyalarida o'tkazilgan; aniqlangan metabolik o'zgarishlar inson patologiyasi kontekstida tasdiqlanishi kerak.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"anabolik-qobiliyat-fagotsitar-kompetent-mikrogliya-belgisi-sifatida\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#anabolik-qobiliyat-fagotsitar-kompetent-mikrogliya-belgisi-sifatida\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Anabolik qobiliyat fagotsitar kompetent mikrogliya belgisi sifatida&lt;/span&gt;&lt;/a&gt;Anabolik qobiliyat fagotsitar kompetent mikrogliya belgisi sifatida&lt;/h4&gt;\n&lt;p&gt;Mikrogliya faollashuvida anabolik moslashuvning o‘rnini aniqlash uchun 9-10 oylik AppNL-G-F sichqonlaridan ajratib olingan X04⁺ (fagotsitlovchi) va X04⁻ (fagotsitlamaydigan) hujayralarida scRNA-seq tahlili o‘tkazildi. Klasterlash HM (gomeostatik), ARM (faollashgan) va TRM (o‘tish davri) holatlarini aniqladi (Rasm SN 5A-B). Biroq, klassik DAM (kasallik bilan bog‘liq mikrogliya) imzosini tahlil qilish shuni ko‘rsatdiki, DAM genlari ham X04⁺, ham X04⁻ populyatsiyalarida keng tarqalgan (Rasm SN 5C). Bu shuni anglatadiki, DAM transkripsion belgisi fagotsitoz bilan shug‘ullanadigan hujayralarni oddiy patologik muhitga javob beruvchilardan ajratib bera olmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DAM — neyrodegeneratsiya paytida mikrogliyada paydo bo‘ladigan va ko‘pincha funksional faollik belgisi deb adashib qabul qilinadigan transkripsion profil.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Klasterlash aniqligini oshirish orqali HM ni 0 (fagotsitlamaydigan) va 2 (fagotsitlovchi), TRM ni esa 6 (fagotsitlamaydigan) va 1 (fagotsitlovchi) subklasterlarga ajratishga muvaffaq bo‘lindi (Rasm 5A, B). DAM modul ballari fagotsitlovchi va fagotsitlamaydigan juftliklar o‘rtasida o‘xshash bo‘lib (Rasm SN 5E), bu DAM va fagotsitoz o‘rtasidagi bog‘liqlik pastligini tasdiqlaydi. IPA va GSEA tahlillari shuni ko‘rsatdiki, fagotsitar holat ribosoma biogenezi, oqsil sintezi va mitoxondrial oksidlovchi fosforillanishning sinxron kuchayishi bilan belgilanadi (Rasm 5C; Rasm SN 5F-H).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-f5.jpg\" alt=\"5-rasm: Anabolik moslashuv imzosi fagotsitar qobiliyatni kanonik DAM imzosiga qaraganda aniqroq aniqlaydi. (A) 9-10 oyli\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm: Anabolik moslashuv imzosi fagotsitar qobiliyatni kanonik DAM imzosiga qaraganda aniqroq aniqlaydi. (A) 9-10 oylik AppNL-G-F sichqonlaridan ajratib olingan saralangan X04+ (fagotsitlovchi) va X04- (fagotsitlamaydigan) mikroqliyaning bir hujayrali RNA-seq profillarining UMAP proyeksiyasi (0,3 piksellar sonida). Yuqori aniqlikdagi subklasterizatsiya kanonik ravishda aniqlangan Gomeostatik (HM) va O'tish (TRM) klasterlarini fagotsitar qobiliyatiga ko'ra ajralib turadigan fagotsitlovchi va fagotsitlamaydigan boyitilgan kichik populyatsiyalarga ajratadi (HM 0 va 2-klasterlarga; TRM 1 va 6-klasterlarga). (B) Har bir subklasterning X04+ va X04- fraksiyalaridagi nisbiy boyishini ko'rsatadigan klaster tarkibining miqdoriy bahosi. (C) Fagotsitlovchi boyitilgan subpopulyatsiyani (1-klaster) fagotsitlamaydigan subpopulyatsiya (6-klaster) bilan taqqoslovchi Genlar to'plamini boyitish tahlili (GSEA), fagotsitlovchi subpopulyatsiyada Ribosom va Oksidlovchi fosforillanish yo'llarining kuchli boyiganligini ochib beradi. (D) Gomeostatik imzo (Tmem119, P2ry12, Cx3cr1), DAM imzosi (Trem2, Cst7, Itgax, Cd74, H2-Aa) va Anabolik moslashuv imzosining (Atp5e, Cox4i1, Ndufa1, Eif3f, Eef1a1, Rpl10, Rpl13) aniqlangan subpopulyatsiyalar bo'ylab ekspressiyasini ko'rsatuvchi skripka grafiklari. DAM imzosi fagotsitlovchi va fagotsitlamaydigan holatlar orasida taqqoslanadigan bo'lsa-da, anabolik moslashuv imzosi fagotsitar klasterlarda (1 va 2) tanlab yuqori darajada ifodalanadi. (E) Iba1, DAM markeri CD74 va FUNCAT (yangi oqsil sintezi) uchun birgalikda bo'yalgan 9 oylik AppNL-G-F sichqonlaridagi plaka bilan bog'liq mikroqliyaning vakillik konfokal tasvirlari. Ko'pchilik Iba1high mikroqliyasi kuchli FUNCAT signalini ko'rsatadi, holbuki CD74 faqat quyi to'plamda induksiya qilinadi. Masshtab chizig'i: 50 mkm. (F) Transkripsion DAM holati anabolik faollikni bashorat qilmasligini ko'rsatadigan, alohida Iba1+ mikroqliya ichidagi FUNCAT va CD74 intensivligi o'rtasidagi korrelyatsiyaning miqdoriy bahosi (Pirson R = -0,12, P = 0,187).&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mikrogliyaning fagotsitar faolligi klassik DAM imzosidan ko‘ra anabolik profil (oqsil va ATF sintezi) bilan yaxshiroq tavsiflanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Anabolik moslashuv Eef1a1 translyatsiya faktori, ribosoma subbirliklari (Rpl10, Rpl13) va elektron transport zanjiri komponentlari (Ndufa1, Cox4i1, Atp5e) induksiyasini o‘z ichiga oladi (Rasm 5D). Fagotsitlovchi klasterlarda (1, 2) neyroyallig‘lanish signallari fagotsitlamaydiganlarga (6, 0) nisbatan kamaygan (Rasm SN 5F, G). 9 oylik AppNL-G-F sichqonlari miya kesmalarida Iba1, CD74 va FUNCAT usuli yordamida o‘tkazilgan tekshiruvlar shuni tasdiqladiki, blyashkalar yaqinidagi ko‘pgina hujayralar (Iba1high) yuqori anabolik faollikka ega, CD74 esa faqat qisman induksiya qilinadi va FUNCAT intensivligi bilan korrelyatsiya qilmaydi (R = −0.12, P = 0.187; Rasm 5E, F).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot sichqonlarning Altsgeymer modeli asosida o‘tkazilgan; anabolizm va fagotsitoz o‘rtasidagi korrelyatsiya to‘g‘ridan-to‘g‘ri sababiy bog‘liqlikni anglatmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"anabolik-dasturning-yoqolishi-proteostatik-ortiqcha-yuklanish-bilan-bogliq\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#anabolik-dasturning-yoqolishi-proteostatik-ortiqcha-yuklanish-bilan-bogliq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Anabolik dasturning yo‘qolishi proteostatik ortiqcha yuklanish bilan bog‘liq&lt;/span&gt;&lt;/a&gt;Anabolik dasturning yo‘qolishi proteostatik ortiqcha yuklanish bilan bog‘liq&lt;/h4&gt;\n&lt;p&gt;Omiks tadqiqotlarimiz shuni ko‘rsatadiki, mikrogliyaning fagotsitozni qo‘llab-quvvatlash qobiliyati energiya ta’minotiga bog‘liq. Biz TREM2 yetishmovchiligi fagotsitoz qilingan materialni qayta ishlashning buzilishiga olib kelishini tekshirdik. Konfokal mikroskopiya shuni ko‘rsatdiki, Trem2KO mikrogliyasida amiloid blyashkalari yaqinida postsinaptik oqsil PSD95 to‘planadi (6-rasm A, B). Bu to‘plamlar CD68+ lizosomalari bilan o‘ralgan bo‘lib, bu degradatsiya jarayonlarining to‘xtab qolganidan dalolat beradi (SN-rasm). Xuddi shunday to‘planish presinaptik marker vGluT1 (SN-rasm) va mielin oqsili MBP uchun ham kuzatildi (6-rasm C, D). PSD95 va MBP amiloid tarkibiga kirmagani uchun, ularning to‘planishi TREM2 vositasidagi anabolik yordam bo‘lmaganda degradatsiya mexanizmlarining umumiy ishdan chiqishini ko‘rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TREM2 bo‘lmaganda, mikrogliya fagotsitoz qilingan materialni qayta ishlay olmaydi, bu hujayra ichida sinaptik va mielin «chiqindilari» to‘planishiga olib keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Trem2KO mikrogliyasining bir qismida biz PSD95 yoki MBP bilan to‘lgan yirik (2–8 mkm) pufakchalarni kuzatdik (SN-rasm). 3D-rekonstruksiya shuni ko‘rsatdiki, bu tuzilmalar mikrogliya o‘simtalaridan hosil bo‘lib, ular bilan ingichka nanotubalar orqali bog‘langan (6-rasm E, H; SN-rasm). Bunday o‘simtalar ichida Aβ, PSD95 va MBP to‘planadi. Miqdoriy tahlil bu anomaliyalarning keskin oshganini tasdiqladi: 105 mkm³ hajmda AppNL-G-F;Trem2KO sichqonlarida o‘rtacha 7–8 ta shunday o‘simta aniqlandi, nazorat guruhida esa 0,5 tadan kam (6-rasm G, J). Blyashkalar atrofidagi Trem2KO mikrogliyasining 60–70% qismi proteostatik ortiqcha yuklanish belgilarini ko‘rsatdi, nazoratda esa 2% dan kam.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot transgen sichqonlarda o‘tkazildi; hujayralardagi oqsillar to‘planishi funksional yetishmovchilikni ko‘rsatadi, ammo inson patologiyasiga o‘tkazishda ehtiyotkorlik talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"anabolik-dasturning-yoqolishi-mitoxondrial-disfunksiya-bilan-bogliq\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#anabolik-dasturning-yoqolishi-mitoxondrial-disfunksiya-bilan-bogliq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Anabolik dasturning yo‘qolishi mitoxondrial disfunksiya bilan bog‘liq&lt;/span&gt;&lt;/a&gt;Anabolik dasturning yo‘qolishi mitoxondrial disfunksiya bilan bog‘liq&lt;/h4&gt;\n&lt;p&gt;Bioenergetikani baholash uchun biz MitoTracker Green (umumiy mitoxondriya massasi) va Red CMXRos (membrana potensiali) bo‘yoqlari bilan oqim sitometriyasidan foydalandik. AppNL-G-F sichqonlarida blyashkalar yaqinidagi mikrogliya (CD45high) Aβ klirensiga moslashib, ham potensialni, ham lizosomal massani oshirdi (7-rasm A, B). Aksincha, Trem2KO da uzilish kuzatildi: mitoxondriya massasi oshgan bo‘lsa-da, ularning membrana potensiali pasaygan edi. Mitoxondrial salomatlik indeksi Trem2KO hujayralarida sezilarli darajada past bo‘ldi (7-rasm C), bu metabolik jihatdan nofaol mitoxondriyalarning to‘planishini anglatadi. Lizosomal massa (LysoTracker) genotiplar o‘rtasida farq qilmadi (7-rasm D).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mitoxondrial salomatlik indeksi — bu funksional faol mitoxondriyalarni shikastlanganlaridan ajratishga imkon beradigan hisobiy ko‘rsatkich.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biogenezni baholash uchun biz AHA metabolik belgisi va yangi sintezlangan TOM20 oqsilini aniqlash uchun PLA-tahlilidan foydalandik. AppNL-G-F sichqonlarida blyashkalar yaqinidagi mikrogliya faol ravishda yangi mitoxondriyalar sintez qildi (TOM20-PLA+ signali; 7-rasm E, F). Trem2KO da bu jarayon bostirilgan edi, bu mitoxondrial biogenezni induksiya qilish uchun TREM2 zarurligini isbotlaydi. Yangilanish bo‘lmasa-da, Trem2KO hujayralarida mitoxondriyalarning umumiy massasi yuqori bo‘lib qoldi (SN-rasm), bu eski organellalarning to‘planishini ko‘rsatadi. VDAC1 va autofagiya retseptori p62/SQSTM1 ni birgalikda bo‘yash Trem2KO mikrogliyasida P62+/VDAC1+ agregatlarini aniqladi (7-rasm G, H), bu mitofagiya — shikastlangan mitoxondriyalarni yo‘q qilish jarayonining buzilganidan dalolat beradi.&lt;/p&gt;\n&lt;h4 id=\"inson-mikrogliyasida-altsgeymer-kasalligi-rivojlanishi-bilan-anabolik-dasturning-susayishi\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#inson-mikrogliyasida-altsgeymer-kasalligi-rivojlanishi-bilan-anabolik-dasturning-susayishi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Inson mikrogliyasida Altsgeymer kasalligi rivojlanishi bilan anabolik dasturning susayishi&lt;/span&gt;&lt;/a&gt;Inson mikrogliyasida Altsgeymer kasalligi rivojlanishi bilan anabolik dasturning susayishi&lt;/h4&gt;\n&lt;p&gt;Sichqonlarda aniqlangan anabolik dasturning inson kasalligidagi ahamiyatini tekshirish uchun biz 523 donorning yoshi va Braak bosqichlari qayd etilgan inson miyasi yadroviy transkriptom atlasini (ssKIND) tahlil qildik (1-jadval). Har bir mikrogliya yadrosi uchta modul bo'yicha baholandi: anabolik, DAM (kasallik bilan bog'liq mikrogliya) va gomeostatik. Tahlillar shuni ko'rsatdiki, bu holatlar transkriptom xaritasida alohida hududlarni egallaydi, bu anabolik holatning o'ziga xosligini tasdiqlaydi (8A-rasm, SN-rasm). Kasallik 0–II bosqichdan V–VI bosqichga o'tganda, anabolik indeks yoshga qarab tuzatilganda sezilarli darajada pasaydi (β = -0,41, P = 1,8 × 10⁻⁵; Spearman R = -0,35), eng keskin pasayish III–IV va V–VI bosqichlar o'rtasida kuzatildi (8B-rasm). Nazorat genlari va aniqlangan genlar soni barqaror bo'lib qoldi, bu texnik xatolarni istisno qiladi (SN-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Inson mikrogliyasining anabolik faolligi Altsgeymer kasalligida progressiv ravishda pasayadi, bu yuqori anabolik indeksga ega hujayralar ulushining III–IV bosqichlardagi 66,7% dan V–VI bosqichlardagi 21,4% gacha qisqarishida namoyon bo'ladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Braak bosqichlari — bu miyadagi patologik oqsillarning tarqalishiga asoslangan neyrodegeneratsiya og'irligini baholash tizimi: dastlabki (I–II) bosqichlardan kechki (V–VI) bosqichlargacha.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz mikroglialarni \"anabolik faol\" (indeks bo'yicha yuqori 30%) guruhlarga ajratdik va ularning ulushidagi o'zgarishlarni tahlil qildik. Bunday hujayralar ulushi kechki bosqichlarda keskin qisqardi (P &amp;lt; 1 × 10⁻⁴, Spearman R = -0,32; 8C-rasm), guruh ichidagi o'rtacha indeks esa biroz pasaydi (8D-rasm). Dekompozitsiya shuni ko'rsatdiki, pasayishning taxminan 62% i hujayralar sonining kamayishi, 38% i esa hujayra ichidagi faollikning pasayishi bilan bog'liq (SN-rasm). TREM2 ifodasi barcha bosqichlarda anabolik indeks bilan ijobiy korrelyatsiya qildi (8E-rasm) va bu bog'liqlik Braak bosqichi nazorat qilinganda ham saqlanib qoldi (qisman korrelyatsiya koeffitsiyentlari +0,24 dan +0,35 gacha; SN-rasm), bu funksional bog'liqlikni ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot miyaning o'limdan keyingi transkriptom ma'lumotlariga asoslangan, shuning uchun aniqlangan korrelyatsiyalar TREM2 va anabolizm o'rtasidagi to'g'ridan-to'g'ri sabab-oqibat bog'liqligini isbotlamaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Anabolik dastur va DAM-imzo o'rtacha ko'rsatkichlari qarama-qarshi yo'nalishda o'zgargan bo'lsa-da (8F-rasm), Braak bosqichi nazorat qilinganda ular o'rtasida ijobiy bog'liqlik aniqlandi (qisman R = 0,23; 8H-rasm) va TREM2 bilan ham (qisman R = +0,28, P &amp;lt; 1 × 10⁻⁴; SN-rasm). Bu shuni anglatadiki, kasallikning bir bosqichida anabolizm va DAM-holati birga mavjud bo'lishi mumkin, ammo patologiya rivojlanishi bilan DAM-imzo saqlanib qolsa ham, anabolik dastur susayadi. Bu shuni tasdiqlaydiki, biosintetik kompetensiya mikrogliyaning funksional barqarorligining klassik DAM-markerlariga qaraganda mustaqil va aniqroq ko'rsatkichidir.&lt;/p&gt;\n&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;h4 id=\"altsgeymer-kasalligida-mikrogliya-faollashuvi\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#altsgeymer-kasalligida-mikrogliya-faollashuvi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Altsgeymer kasalligida mikrogliya faollashuvi&lt;/span&gt;&lt;/a&gt;Altsgeymer kasalligida mikrogliya faollashuvi&lt;/h4&gt;\n&lt;p&gt;Altsgeymer kasalligida mikrogliyaning faollashuvi odatda kasallik bilan bog'liq mikrogliya (DAM) holatiga o'tish bilan belgilanadi. Ushbu imzo fagotsitar retseptorlarni (masalan, Clec7a, Axl, MerTK) o'z ichiga olgani uchun, DAM fenotipi ko'pincha kuchaytirilgan fagotsitar funksiya bilan tenglashtirilgan. Bizning natijalarimiz shuni ko'rsatadiki, bu tenglik o'rinli emas. Yagonalik va in situ tahlillarida DAM imzosi va fagotsitar qobiliyat bir-biridan ajraldi: DAM moduli ko'rsatkichlari metabolik jihatdan ishdan chiqqan mikrogliyada ham patologik yukga ergashdi, holbuki alohida, TREM2ga bog'liq anabolik dastur (mitoxondrial biogenez bilan bog'langan kuchaytirilgan oqsil sintezi) funksional jihatdan faol hujayralarni yaxshiroq ajratib ko'rsatdi. Shuning uchun biz bularni molekulyar jihatdan ajratiladigan dasturlar deb talqin qilamiz: DAM imzosi patologiyaga nisbatan transkripsion stress javobini (tozalashga bo'lgan «talab»ni) ifodalaydi, anabolik dastur esa unga qarshi harakat qilish uchun biosintetik imkoniyatni («taklif»ni) aks ettiradi. Amiloid yuki oshgani sari talab ortadi, bu taklif esa bosqichma-bosqich bostiriladi va natijada talab-taklif nomutanosibligi yuzaga keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DAM transkripsion imzosi faqat tozalashga bo'lgan «talab»ni aks ettirsa, mikrogliyaning funksional barqarorligi TREM2ga bog'liq mustaqil anabolik dastur («taklif») bilan belgilanadi va patologiya kuchayishi bilan bu imkoniyat pasayadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;In situ tahlili — to'qimalarning tabiiy tuzilishini buzmagan holda hujayralarni bevosita joylashgan muhitida o'rganish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Periferik makrofaglarda metabolizm ko'pincha glikolizga asoslangan pro-allergik/proinflammator holat hamda oksidlovchi fosforillanishga bog'liq yallig'lanishga qarshi holatlarga bo'linadi. Bizning ma'lumotlarimizdagi blyashka bilan bog'langan mikrogliya bu ikkilikka mos kelmadi, aksincha biomass sintezi va mitoxondrial nafas olishni bir vaqtning o'zida ishga tushirdi, bu faollashgan T-hujayralarida effektor funksiyani qo'llab-quvvatlaydigan mTOR tomonidan boshqariladigan translyatsion va mitoxondrial sig'imning kengayishini eslatadi. Biz taklif qilayotgan funksional asos proteostatikdir: Aβ va hujayra qoldiqlarining uzluksiz ichkilashuvi lizosomal fermentlar, membranalar va ATPni gomeostatik sintez tiklay oladigan tezlikdan tezroq iste'mol qiladi. Ribosomal va mitoxondrial biogeneanning kuzatilgan yuqoriga regulyatsiyasi ushbu proteostatik sig'imni saqlab qolishga xizmat qilishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mitoxondrial biogenez yetishmovchiligi va Trem2KO mikrogliyasidagi funksional buzilishlar o'rtasidagi sabab-oqibat zanjiri faqat assotsiativ xarakterga ega, chunki anabolik o'qni bevosita nishonga oluvchi mustaqil manipulyatsiya bajarilmagan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu kuzatishlarni inson kasalligiga kengaytirib, biz Braak bosqichlariga bo'lingan inson yadro atlasi yordamida mikrogliyaning anabolik moslashuvini o'rgandik. Anabolik dastur ilg'or Braak bosqichida (V-VI) mikrogliyada kamaydi va kasallik bosqichi doirasida TREM2 bilan ijobiy bog'langan holda qoldi, bu uning inson mikrogliyasida saqlanib qolishi va kasallikning rivojlanishi bilan yemirilishini ko'rsatadi. Sichqoncha X04 gradienti va inson Braak gradienti shunday qilib bir xil yukga bog'liq bostirilishni ikki miqyosda tavsiflaydi. Ushbu kuzatishlar qarama-qarshi va korrelyatsion xarakterga ega bo'lsa-da, turlararo mos kelishuv anabolik o'qning inson Altsgeymer kasalligiga daxldorligini kuchaytiradi.&lt;/p&gt;\n&lt;p&gt;Bu kuzatishlar amiloidga qarshi immunoterapiya uchun potentsial ta'sir ko'rsatadi. Aβ-ni nishonga oluvchi antitelalarning klinik samaradorligi qisman mikrogliyaning Fc-retseptorlari vositasidagi fagotsitozni amalga oshirish qobiliyatiga bog'liq bo'lib, bu sezilarli bioenergetik xarajatlarni talab qiladi. Agar fagotsitozni qo'llab-quvvatlaydigan anabolik dasturning o'zi fagotsitar yuk tomonidan bostirilsa, u holda doimiy farmakologik stimulyatsiya mikrogliyani biosintetik charchoqqa olib kelishi mumkin. Bu shuni ko'rsatadiki, amiloid immunoterapiyasini anabolik o'qni kuchaytiruvchi aralashuvlar bilan birlashtirish mikrogliyaning tozalash qobiliyatini saqlab qolishga yordam berishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Patologiya kuchayganda mikrogliyaning anabolik salohiyati pasayishi amiloidga qarshi immunoterapiya samaradorligiga putur yetkazishi mumkin, bu esa metabolik yordamchi vositalarni birgalikda qo'llash zaruriyatini bildiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Asosiy reagentlar va resurslar&lt;/strong&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Reagent yoki resurs&lt;/th&gt;\n&lt;th&gt;Manba&lt;/th&gt;\n&lt;th&gt;Identifikator&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Antibodies&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Anti-Amyloid β (N) (clone 82E1)&lt;/td&gt;\n&lt;td&gt;IBL Co., LTD.&lt;/td&gt;\n&lt;td&gt;Cat#10323; RRID:AB_10707424&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Anti-Iba1&lt;/td&gt;\n&lt;td&gt;Wako&lt;/td&gt;\n&lt;td&gt;Cat#019-19741; RRID:AB_839504&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Anti-Phospho-RPS6&lt;/td&gt;\n&lt;td&gt;Cell Signaling Technology&lt;/td&gt;\n&lt;td&gt;Cat#4858; RRID:AB_916156&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Anti-PSD95 sdAb (FluoTag-X2, AF568)&lt;/td&gt;\n&lt;td&gt;Synaptic Systems&lt;/td&gt;\n&lt;td&gt;Cat#N3702-AF568-L; RRID:(not assigned]&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Anti-VGLUT1 sdAb (FluoTag, At488)&lt;/td&gt;\n&lt;td&gt;Synaptic Systems&lt;/td&gt;\n&lt;td&gt;Cat#N1602-At488-L; RRID: (not assigned)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Anti-TOM20&lt;/td&gt;\n&lt;td&gt;Proteintech&lt;/td&gt;\n&lt;td&gt;Cat#11802-1-AP; RRID:AB_2207530&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Anti-VDAC1 (CoraLite488)&lt;/td&gt;\n&lt;td&gt;Proteintech&lt;/td&gt;\n&lt;td&gt;Cat#CL488-10866; RRID:AB_3672468&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Anti-MBP&lt;/td&gt;\n&lt;t
