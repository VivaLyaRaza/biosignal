gt;\n&lt;td&gt;Cell Ranger&lt;/td&gt;\n&lt;td&gt;10x Genomics&lt;/td&gt;\n&lt;td&gt;v7.0.0; RRID:SCR_017344&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Seurat&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;v4.x; RRID:SCR_016341&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;DoubletFinder&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;v2.0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;scanpy&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;v1.11.5; RRID:SCR_018139&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;anndata&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;v0.11.4&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;leidenalg / python-igraph&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;v0.10.2 / v0.11.9&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;umap-learn&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;v0.5.9&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;numpy / pandas / scipy / statsmodels&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;v2.2.5 / v2.3.3 / v1.15.3 / v0.14.5&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;matplotlib / seaborn&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;v3.10.8 / v0.13.2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;GraphPad Prism&lt;/td&gt;\n&lt;td&gt;GraphPad Software&lt;/td&gt;\n&lt;td&gt;v9.5.1; RRID:SCR_002798&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h4 id=\"eksperimental-modellar-va-subyekt-tafsilotlari\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#eksperimental-modellar-va-subyekt-tafsilotlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Eksperimental modellar va subyekt tafsilotlari&lt;/span&gt;&lt;/a&gt;Eksperimental modellar va subyekt tafsilotlari&lt;/h4&gt;\n&lt;p&gt;Tadqiqotda App^NL-G-F liniyasiga mansub sichqonlar hamda Trem2 geni nokaut qilingan sichqonlar (Trem2KO, #027197 shtammi) ishlatildi. Ikki tomonlama mutant nasl olish uchun App^NL-G-F sichqonlari Trem2KO bilan chatishtirildi, natijada ikkala manipulyatsiya bo'yicha ham gomozigota bo'lgan App^NL-G-F; Trem2KO avlodi olindi. Hayvonlar patogendan xoli to'siqli vivariyda, standart 12 soatlik yorug'lik va qorong'ulik siklida, suv va ozuqadan erkin foydalanish sharoitida saqlandi. Har bir katakda ko'pi bilan 5 tadan sichqon boqildi. Tajribalarda ham erkak, ham urg'ochi sichqonlardan foydalanildi. Barcha hayvonlar bilan bog'liq muolajalar AQSh Milliy sog'liqni saqlash institutlari (NIH) ko'rsatmalariga qat'iy rioya qilgan holda bajarildi va Ogayo shtati universiteti Hayvonlarni parvarish qilish va ulardan foydalanish qo'mitasi (IACUC) tomonidan tasdiqlandi. Inson mikrogliyasi tahlili uchun ma'lumotlar integratsiyalashgan ssKIND yadro atlaskasidan olindi. Mikrogliya sifatida belgilangan (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uxhg1qad\"&gt;cell_type = “Microglia”&lt;/code&gt;), Altsgeymer kasalligi tashxisi tasdiqlangan (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fpe5vg9r\"&gt;Disease_consistent = “AD”&lt;/code&gt;) va yosh hamda Braak bosqichlari bo'yicha ishonchli metama'lumotlarga ega donorlarning hujayralari tanlab olindi. Braak bosqichlari 0–II, III–IV, V–VI guruhlarga bo'lindi; donorlarning yoshi 51–78 yosh va 78 yoshdan katta etib belgilandi (eng yosh 20–51 yoshli guruhda Altsgeymer bilan kasallangan mos keluvchi mikrogliya hujayralari topilmadi). Yakuniy ma'lumotlar bazasi miyaning turli qismlaridan olingan 523 nafar donorga tegishli 204 283 ta mikrogliya hujayrasini o'z ichiga oldi. Psevdo-bulks yig'indisi uchun qayta ishlanmagan butun sonli ko'rsatkichlar saqlab qolindi, klasterlash va joylashtirish uchun esa integratsiyalashgan scVI latent fazosi (30 o'lchamli) qo'llanildi. Boshqacha ko'rsatilmagan bo'lsa, tahlillar barcha yoshdagi donorlarni birlashtirgan holda (faqat Braak bosqichi farqlanadi) amalga oshirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Nokaut — bu ma'lum bir gen faoliyatini sun'iy ravishda to'xtatish usuli bo'lib, u tirik organizmlarda shu genning vazifasini o'rganish uchun qo'llaniladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"metod-tafsilotlari\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#metod-tafsilotlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Metod tafsilotlari&lt;/span&gt;&lt;/a&gt;Metod tafsilotlari&lt;/h4&gt;\n&lt;p&gt;In vivo metabolik nishonlash uchun sichqonlarga steril fosfat-tuzli buforda (PBS) eritilgan azidogomoalanin (AHA) 50 mg/kg dozada qorin bo'shlig'iga yuborildi. Hayvonlar inksiyadan 16 soat o'tgach tajribadan chiqarildi. Oqim cytometry tahlili uchun ajratilgan hujayralar ishlab chiqaruvchining ko'rsatmalariga muvofiq Click-iT Cell Reaction Buffer Kit to'plami yordamida Alexa Fluor 647-Alkyne bilan reaksiyaga kiritildi. Yaqinlikni bog'lash tahlili (PLA) uchun miya qismlari birlamchi antitelolar bilan inkubatsiya qilinishidan oldin Click-iT to'plami yordamida Biotin-Alkyne bilan reaksiyaga kiritildi. Voyaga yetgan sichqonlar mikrogliyasini ajratish va saralash magnit-faollashtirilgan hujayralarni saralash (MACS) usuli yordamida bajarildi. Sichqonlarga narkoz berilib, qon tomirlaridagi leykotsitlarni yuvib tashlash uchun muzdek PBS yordamida yurak orqali perfuziya qilindi. Miyalar ajratib olinib, muz ustida sovutildi va Neural Tissue Dissociation Kit (P) hamda gentleMACS dissotiatori yordamida parchalandi. Hujayra suspenziyasi 70 µm li elakdan o'tkazilib, 300 × g tezlikda 10 daqiqa davomida markazdan qochirma kuchda aylantirildi. Mielyn Myelin Removal Beads II magnit boncuklari yordamida olib tashlandi. Olingan bir hujayrali suspenziya darhol oqim cytometry tahliliga ishlatildi yoki CD11b MicroBeads va LS ustunlari yordamida transkriptomik tahlil uchun boyitildi.&lt;/p&gt;\n&lt;p&gt;Amiloid yukini baholash uchun Metoksi-X04 (X04) preparati dimetilsulfoksidda (DMSO) eritildi, so'ngra barqaror sarg'ish-yashil emulsiyani hosil qilish uchun propilen glikol va PBS aralashmasida (1:1 nisbatda) suyultirildi. Yangi tayyorlangan eritma to'qimalarni yig'ib olishdan 16 soat oldin 10 mg/kg dozada qorin bo'shlig'iga yuborildi. Oqim cytometry tahlili uchun ajratilgan hujayralar o'lik hujayralarni istisno qilish hamda nospetsifik bog'lanishning oldini olish maqsadida Fixable Viability Dye eFluor 780 (1:1000) va anti-CD16/32 (Fc Block, 1:200) bilan inkubatsiya qilindi. Keyinchalik hujayralar CD11b, CD45 va CX3CR1 ga qarshi lyuminofor bilan bog'langan antitelolar yordamida bo'yaldi. Tirik mikrogliya hujayralari (CD45^int; CD11b⁺; CX3CR1⁺) DAPI qo'zg'alish kanalida (405 nm) flüoresans bo'yicha X04⁺ yoki X04⁻ sifatida geytrandi. Geyt chegaralarini aniqlash uchun Metoksi-X04 yuborilgan yovvoyi turdagi hayvonlar biologik salbiy nazorat sifatida xizmat qildi.&lt;/p&gt;\n&lt;h4 id=\"in-situ-proximity-ligation-assay-pla-tahlili\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#in-situ-proximity-ligation-assay-pla-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;In Situ Proximity Ligation Assay (PLA) tahlili&lt;/span&gt;&lt;/a&gt;In Situ Proximity Ligation Assay (PLA) tahlili&lt;/h4&gt;\n&lt;p&gt;Yangi hosil bo'lgan mitoxondrial oqsillarni vizuallashtirish uchun AHA yuborilgan sichqonlarning miya kesmalari biotin-alkin bilan «klik-reaksiya»ga kiritildi. Yuvilgandan so'ng, kesmalar TOM20 (1:500) va biotin (1:500) ga qarshi antitanachalar bilan inkubatsiya qilindi. Signalni kuchaytirish uchun ishlab chiqaruvchi protokoliga muvofiq PLA zondlari (Duolink) qo'llanildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PLA usuli hujayra ichidagi oqsil o'zaro ta'sirlarini yoki molekulalarni yuqori aniqlik bilan aniqlash imkonini beradi, bunda faqat ikkita nishon antitanacha 40 nm dan yaqinroq masofada joylashganda floresan signal hosil bo'ladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rnk-sekvenlash-va-bioinformatika\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#rnk-sekvenlash-va-bioinformatika\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RNK sekvenlash va bioinformatika&lt;/span&gt;&lt;/a&gt;RNK sekvenlash va bioinformatika&lt;/h4&gt;\n&lt;p&gt;Mikrogliyadan umumiy RNK Quick-RNA to'plami yordamida ajratildi (RNK yaxlitlik indeksi &amp;gt; 8). cDNA kutubxonalari SMART Seq® mRNA LP Kit yordamida tayyorlandi va HiSeq 4000 tizimida sekvenlandi. FASTQ ma'lumotlari STAR (v2.7.10a) yordamida sichqon genomiga (GRCm39) tekislandi, Flexbar orqali adapterlar olib tashlandi va featureCounts yordamida hisoblandi. Tahlil R (v4.3.3) muhitida o'tkazildi.&lt;/p&gt;\n&lt;h4 id=\"miqdoriy-proteomik-tahlil\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#miqdoriy-proteomik-tahlil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Miqdoriy proteomik tahlil&lt;/span&gt;&lt;/a&gt;Miqdoriy proteomik tahlil&lt;/h4&gt;\n&lt;p&gt;Miya lizatlari (5% SDS, 50 mM TEAB) STrap Midi MS qurilmasi yordamida qayta ishlandi (har bir namuna uchun 2000 mkg oqsil). Jarayon DTT bilan qaytarish, yodoasetamid bilan alkillash va tripsin/Lys-C bilan hazm qilishni o'z ichiga oldi. Peptidlar TMT-metkalar bilan belgilandi, birlashtirildi va HPLC (12 fraksiya) orqali fraksiyalandi. Tahlil Proteome Discoverer 2.5 yordamida LC-MS/MS tizimida o'tkazildi. FDR ≤ 0.05 (Benjamini-Hochberg usuli) ahamiyatli deb qabul qilindi.&lt;/p&gt;\n&lt;h4 id=\"gistologik-tahlil-va-mikroskopiya\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#gistologik-tahlil-va-mikroskopiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gistologik tahlil va mikroskopiya&lt;/span&gt;&lt;/a&gt;Gistologik tahlil va mikroskopiya&lt;/h4&gt;\n&lt;p&gt;40 mkm qalinlikdagi miya kesmalari immunoflyuoressent usulda (Aβ, Iba1, PSD95, VGLUT1, TOM20, VDAC1, MBP, Caspase-3, CD74 markerlari bilan) bo'yaldi. Tasvirlar ZEISS Axio Observer yoki Nikon AXR konfokal mikroskoplarida olindi. 2D tasvirlar ImageJ dasturida «Otsu» yoki «Triangle» avtomatik chegaralari yordamida tahlil qilindi. Statistika t-test yoki ANOVA orqali hisoblandi.&lt;/p&gt;\n&lt;h4 id=\"bir-hujayrali-sekvenlash-scrna-seq\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#bir-hujayrali-sekvenlash-scrna-seq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bir hujayrali sekvenlash (scRNA-seq)&lt;/span&gt;&lt;/a&gt;Bir hujayrali sekvenlash (scRNA-seq)&lt;/h4&gt;\n&lt;p&gt;Kutubxonalar 10x Genomics Chromium (har bir namuna uchun 10 000 hujayra) yordamida tayyorlandi va Illumina NovaSeq tizimida sekvenlandi (har bir hujayra uchun 50 000–100 000 o'qish). Ma'lumotlar Cell Ranger (v7.0.0) orqali mm10 genomiga tekislandi. Seurat (v4.1.1) yordamida &amp;lt; 1500 xususiyat, &amp;lt; 3000 UMI yoki &amp;gt; 5% mitoxondrial o'qishga ega hujayralar chiqarib tashlandi.&lt;/p&gt;\n&lt;h4 id=\"statistik-tahlil-va-funksional-boyitish\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#statistik-tahlil-va-funksional-boyitish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Statistik tahlil va funksional boyitish&lt;/span&gt;&lt;/a&gt;Statistik tahlil va funksional boyitish&lt;/h4&gt;\n&lt;p&gt;Genlarning differensial ifodalanishi (DEG) DESeq2 (v1.42.1) yordamida FDR &amp;lt; 0.05 darajasida hisoblandi. Yo'llar tahlili IPA (Ingenuity Pathway Analysis) orqali z-score yordamida amalga oshirildi. GSEA tahlili clusterProfiler paketi orqali o'tkazildi, genlar log2 Fold Change va p-qiymati bo'yicha tartiblandi. Natijalar nuqtali diagrammalar va «gen-konseptsiya» tarmoqlari (cnetplot) yordamida vizuallashtirildi.&lt;/p&gt;\n&lt;h4 id=\"3d-konfokal-tasvirlash-va-ierarxik-statistik-modellashtirish\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#3d-konfokal-tasvirlash-va-ierarxik-statistik-modellashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3D konfokal tasvirlash va ierarxik statistik modellashtirish&lt;/span&gt;&lt;/a&gt;3D konfokal tasvirlash va ierarxik statistik modellashtirish&lt;/h4&gt;\n&lt;p&gt;Iba1-musbat (Iba1+) mikroglial qiziqish sohalarini (ROI) morfologik va biokimyoviy baholash uchun Nikon AXR konfokal mikroskopi ishlatildi. AppNL-G-F sichqonlarida mikrogliyaning yuqori zichligi sababli, ROI alohida hujayralar emas, balki morfologik birliklar sifatida belgilandi. Rekonstruksiya va tahlil Imaris (v11.0) dasturida amalga oshirildi. Iba1+ sirtlarini segmentatsiyalash mashinali o‘qitish algoritmi yordamida bajarildi. Belgilangan markerlarning hajmiy kolokalizatsiyasi shovqinni tuzatish orqali hisoblandi va hajmlar voksel soniga o‘tkazildi. Iba1+ sirtlarida markerlarning o‘rtacha floresans intensivligi o‘lchandi. Plakalar bilan bog‘liq mikrogliya (PAM) va bog‘liq bo‘lmagan (NPAM) turlari ajratildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ROI (qiziqish sohasi) — tahlil qilinadigan tasvirning ajratilgan qismi, GLMM esa ma’lumotlarning ierarxik tuzilishini (masalan, bitta hayvondan olingan ko‘plab ROI) hisobga oluvchi statistik modeldir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ierarxik ma’lumotlarni tahlil qilish uchun R muhitida (glmmTMB, emmeans paketlari) umumlashtirilgan chiziqli aralash modellar (GLMM) qo‘llanildi. Proportsional ma’lumotlar uchun beta-binomial, uzluksiz ma’lumotlar uchun gamma-taqsimot tanlandi. Modellarning mosligi DHARMa paketi bilan tekshirildi. Natijalar 95% ishonch intervallari bilan baholangan marjinal o‘rtacha qiymatlar (EMM) sifatida taqdim etildi.&lt;/p&gt;\n&lt;h4 id=\"mikrogliya-qoshimchalarini-miqdoriy-tahlil-qilish-va-noparametrik-statistika\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#mikrogliya-qoshimchalarini-miqdoriy-tahlil-qilish-va-noparametrik-statistika\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mikrogliya qo‘shimchalarini miqdoriy tahlil qilish va noparametrik statistika&lt;/span&gt;&lt;/a&gt;Mikrogliya qo‘shimchalarini miqdoriy tahlil qilish va noparametrik statistika&lt;/h4&gt;\n&lt;p&gt;Qo‘shimchalar zichligi (PSD95, MBP) «ko‘r-ko‘rona» usulda baholandi: bir tahlilchi plakani belgiladi, ikkinchisi esa qo‘shimchalarni sanadi. Zichlik plaka hajmining 10⁵ µ m³ qismiga to‘g‘ri keladigan qo‘shimchalar soni sifatida ifodalandi. AK (nazorat) va AKTK (tajriba) guruhlari o‘rtasidagi farqlar tufayli standart GLMM moslashmadi, shuning uchun coin (v1.4.3) paketi yordamida aniq permutatsiyali Vilkokson testi qo‘llanildi.&lt;/p&gt;\n&lt;h4 id=\"dastlabki-normalizatsiya-va-dubletlarni-olib-tashlash\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#dastlabki-normalizatsiya-va-dubletlarni-olib-tashlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dastlabki normalizatsiya va dubletlarni olib tashlash&lt;/span&gt;&lt;/a&gt;Dastlabki normalizatsiya va dubletlarni olib tashlash&lt;/h4&gt;\n&lt;p&gt;Seurat yordamida sifat nazoratidan (QC) so‘ng ma’lumotlar normalizatsiya qilindi. Mitoxondrial va ribosomal genlarning foizi saqlab qolindi. DoubletFinder (v2.0.3) yordamida dubletlar (o‘rtacha 10%) aniqlandi va olib tashlandi. Yakuniy tahlilda 26 096 ta hujayra qoldi.&lt;/p&gt;\n&lt;h4 id=\"sctransform-normalizatsiyasi,-integratsiya-va-klasterlash\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#sctransform-normalizatsiyasi,-integratsiya-va-klasterlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SCTransform normalizatsiyasi, integratsiya va klasterlash&lt;/span&gt;&lt;/a&gt;SCTransform normalizatsiyasi, integratsiya va klasterlash&lt;/h4&gt;\n&lt;p&gt;SCTransform yordamida normalizatsiya qilindi va 3000 ta eng o‘zgaruvchan gen tanlandi. To‘rtta namunani integratsiya qilish uchun FindIntegrationAnchors va IntegrateData (reciprocal PCA, k=5) funksiyalari ishlatildi. Klasterlash Louvain algoritmi (20 ta asosiy komponent, 0.3 aniqlik) bilan bajarildi. Vizualizatsiya UMAP orqali amalga oshirildi.&lt;/p&gt;\n&lt;h4 id=\"klasterlarni-annotatsiya-qilish-va-differensial-ekspressiya\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#klasterlarni-annotatsiya-qilish-va-differensial-ekspressiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Klasterlarni annotatsiya qilish va differensial ekspressiya&lt;/span&gt;&lt;/a&gt;Klasterlarni annotatsiya qilish va differensial ekspressiya&lt;/h4&gt;\n&lt;p&gt;Hujayra turlari markerlar (Vilkokson testi) va AppNL-G-F ma’lumotlar bazasi bilan solishtirish orqali aniqlandi. Mikrogliya bo‘lmagan hujayralar chiqarib tashlangach (25 776 ta qoldi), 7 ta mikrogliya holati aniqlandi. Differensial ifodalangan genlar (DE) Bonferroni tuzatishi (p &amp;lt; 0.05) bilan aniqlandi.&lt;/p&gt;\n&lt;h4 id=\"gen-modullari-va-signaturalar-tahlili\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#gen-modullari-va-signaturalar-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gen modullari va signaturalar tahlili&lt;/span&gt;&lt;/a&gt;Gen modullari va signaturalar tahlili&lt;/h4&gt;\n&lt;p&gt;Mikrogliya holatlarini (HM, ARM, TRM, IRM, CPM, DAM va b.) baholash uchun AddModuleScore funksiyasi ishlatildi. Ekspressiya darajalari «skripka» grafiklarida (stacked violin plots) ko‘rsatildi.&lt;/p&gt;\n&lt;h4 id=\"multi-omika-va-integrativ-tahlil\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#multi-omika-va-integrativ-tahlil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Multi-omika va integrativ tahlil&lt;/span&gt;&lt;/a&gt;Multi-omika va integrativ tahlil&lt;/h4&gt;\n&lt;p&gt;AppNL-G-F va Trem2KO sichqonlaridan olingan RNK-sekvensiya va proteomika ma’lumotlari integratsiya qilindi. Venn diagrammasi (VennDiagram v1.7.3) orqali kesishmalar aniqlandi. Umumiy jarayonlarni topish uchun Brown usuli va [mRNA=1, protein=1] vazn vektori bilan ActivePathways usuli qo‘llanildi.&lt;/p&gt;\n&lt;h4 id=\"integrativ-yollarni-boyitish-tahlili\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#integrativ-yollarni-boyitish-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Integrativ yo'llarni boyitish tahlili&lt;/span&gt;&lt;/a&gt;Integrativ yo'llarni boyitish tahlili&lt;/h4&gt;\n&lt;p&gt;Funktsional boyitish integratsiyalashgan ma'lumotlar to'plamlari bo'ylab sezilarli darajada namoyon bo'lgan biologik jarayonlarni aniqlash uchun R dasturidagi ActivePathways paketi yordamida amalga oshirildi. Tahlil yo'naltirilgan ma'lumotlar integratsiyasidan olingan birlashtirilgan P-qiymatlar bo'yicha tartiblangan genlar ro'yxatidan foydalandi. Gene Ontology (GO) atamalarining maqbul boyishini aniqlash uchun tartiblangan gipergeometrik test qo'llanildi. Genlar to'plami (m5.go.v2023.2.Mm.symbols.gmt) haddan tashqari o'ziga xos yoki o'ta umumiy atamalardan kelib chiqadigan xatoliklarni minimallashtirish uchun faqat 10 dan 500 gacha annotatsiya qilingan genlarni o'z ichiga olgan yo'llarni qamrab olish uchun filtrlandi. Ahamiyatli GO atamalari Xolm oilaviy xato darajasi (FWER) &amp;lt; 0.05 yordamida aniqlandi. Biologik talqin qilishni osonlashtirish uchun noyob va ahamiyatli GO atamalari ustunli diagrammalar yordamida vizualizatsiya qilindi, bunda x o'qi &lt;span class=\"yfm-latex\" data-content=\"-%5Clog_%7B10%7D(%5Ctext%7Btuzatilgan%20P-qiymatlar%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ni va y o'qi kengroq funktsional toifalari bo'yicha guruhlangan maxsus GO atamalarini ko'rsatdi.&lt;/p&gt;\n&lt;h4 id=\"statistik-tahlil\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#statistik-tahlil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Statistik tahlil&lt;/span&gt;&lt;/a&gt;Statistik tahlil&lt;/h4&gt;\n&lt;p&gt;Statistik tahlillar GraphPad Prism 9 dasturi (v9.5.1; GraphPad Software, San-Diego, CA, USA) yordamida amalga oshirildi. Ma'lumotlar o'rtacha qiymat ± o'rtachaning standart xatosi (SEM) sifatida taqdim etilgan. Juft solishtirishlar ikki tomonlama juftlashtirilmagan t-testlar yordamida tahlil qilindi. Ko'p sonli solishtirishlar bir o'lchovli yoki ikki o'lchovli dispersiya tahlili (ANOVA) va undan keyingi Tukey yoki Sidak post-hoc testlari yordamida tahlil qilindi. P &amp;lt; 0.05 qiymati statistik jihatdan ahamiyatli deb topildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;ANOVA va t-testlar guruhlar orasidagi tafovutlar tasodifiy ekanligini yoki haqiqiy biologik o'zgarishlarni aks ettirishini tekshirishga yordam beradi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gen-modullari\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#gen-modullari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gen modullari&lt;/span&gt;&lt;/a&gt;Gen modullari&lt;/h4&gt;\n&lt;p&gt;To'rt xil gen moduli baholandi. Anabolik modul oksidlovchi fosforillanish subbirliklarini (ATP5E, COX4I1, NDUFA1, NDUFB9, NDUFS8, UQCRB, COX7B) va oqsil translatsiyasi genlarini (RPS3A, RPS9, RPL10, RPL13, RPL18A, EIF3F, EEF1A1, MRPL42, MRPS14) birlashtiradi. Kasallik bilan bog'liq mikroglariya (DAM) moduli SPP1, APOE, CD9, ITGAX, GPNMB, CD68, CST7, LPL, LGALS3 ni o'z ichiga olgan; homeostatik modul P2RY12, CX3CR1, TMEM119, HEXB ni o'z ichiga oldi. Uy xo'jaligi treki (ACTB, GAPDH, B2M) faqat RNK sifati nazorati sifatida baholandi.&lt;/p&gt;\n&lt;h4 id=\"donorning-psevdobulk-va-modul-korsatkichlari\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#donorning-psevdobulk-va-modul-korsatkichlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Donorning psevdobulk va modul ko'rsatkichlari&lt;/span&gt;&lt;/a&gt;Donorning psevdobulk va modul ko'rsatkichlari&lt;/h4&gt;\n&lt;p&gt;Har bir donor uchun mikrogliyaning xom hisoblari genlar bo'yicha jamlandi, million ta hisobga (CPM) va &lt;span class=\"yfm-latex\" data-content=\"%5Clog_2(%5Ctext%7BCPM%7D%2B1)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ga normallashtirilib, donorning psevdobulk profili hosil qilindi. Donor modulining ko'rsatkichi — bu modul genlari bo'yicha &lt;span class=\"yfm-latex\" data-content=\"%5Clog_2%5Ctext%7BCPM%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ning har bir gen uchun z-ballining o'rtacha qiymati bo'lib, z-ball donorlar bo'ylab hisoblangan. Bunday donor darajasidagi dizayn (har bir donor uchun bitta qiymat) alohida hujjatlarni mustaqil takrorlar sifatida ko'rib chiqish natijasida kelib chiqadigan qalbaki ahamiyatni istisno qiladi.&lt;/p&gt;\n&lt;h4 id=\"hujayra-darajasidagi-korsatkichi,-qayta-klasterlash-va-joylashtirish\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#hujayra-darajasidagi-korsatkichi,-qayta-klasterlash-va-joylashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hujayra darajasidagi ko'rsatkichi, qayta klasterlash va joylashtirish&lt;/span&gt;&lt;/a&gt;Hujayra darajasidagi ko'rsatkichi, qayta klasterlash va joylashtirish&lt;/h4&gt;\n&lt;p&gt;Bitta hujayrali vizualizatsiyalar (UMAP) uchun har bir hujayra modulining ballari log-normallashtirilgan ekspressiyaning har bir gen uchun z-ballining modul genlari bo'yicha o'rtacha qiymati sifatida hisoblandi, bunda z hujayralar bo'ylab hisoblandi. Mikrogliya ushbu hujayralar bilan cheklangan integratsiyalashgan scVI latent maydonida qayta klasterlandi: k-eng yaqin qo'shnilar grafi (k = 15) 30 o'lchovli latent maydonda qurildi, 0.4 o'lchamli Leiden klasterizatsiyasi 11 ta subklasterni berdi va UMAP bir xil jamlanmadan qayta o'rnatildi. Modul-gen nuqtali grafi o'rtacha ekspressiyani (klasterlar bo'ylab z) va har bir subklasterdagi ekspresch qiluvchi hujayralar ulushini umumlashtiradi.&lt;/p&gt;\n&lt;h4 id=\"trem2-va-dam-stratifikatsiyasi\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#trem2-va-dam-stratifikatsiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TREM2 va DAM stratifikatsiyasi&lt;/span&gt;&lt;/a&gt;TREM2 va DAM stratifikatsiyasi&lt;/h4&gt;\n&lt;p&gt;Agar hujayra kamida bitta TREM2 hisobiga ega bo'lsa, u TREM2-musbat, aks holda TREM2-manfiy deb baholandi; har bir donor uchun TREM2-musbat ulushi va alohida TREM2-musbat / TREM2-manfiy psevdobulk profillari hisoblandi. Yuqori DAM hujayralari hujayra darajasidagi DAM ballining yuqori tersili sifatida aniqlandi (barcha hujayralar bo'ylab hisoblangan); DAM-ichki tahlillar uchun yuqori DAM hujayralari bilan cheklangan donor psevdobulki ishlatildi. TREM2 tomchi bitta yadro ma'lumotlarida kam miqdordagi transkript hisoblanadi, shuning uchun TREM2-musbat ulushi aniqlash sezgirligini aks ettiradi va mutlaq musbatlik darajasi sifatida emas, balki qiyosiy tarzda (Braak bosqichi bo'ylab) talqin qilinadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Psevdobulk yondashuvi bitta hujayrali tahlildagi texnik shovqinlarni kamaytirish uchun bir xil turdagi hujayralar ma'lumotlarini birlashtirib ishlatadi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"statistika\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#statistika\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Statistika&lt;/span&gt;&lt;/a&gt;Statistika&lt;/h4&gt;\n&lt;p&gt;Braak bo'ylab anabolik pasayish donor psevdobulki bo'yicha oddiy eng kichik kvadratlar usuli bilan sinovdan o'tkirildi (ball ~ yosh + Braak + yosh × Braak); hujayra boshiga median genlar, mitoxondriyal o'qishlar foizi va uy xo'jaligi moduli RNK sifati nazorati sifatida bir xil tarzda modellashtirildi. Qo'shni Braak bosqichlari orasidagi juft solishtirishlar Mann-Whitney U testi yordamida amalga oshirildi (donor darajasida, juftlashtirilmagan). Modul ballari va TREM2 ekspressiyasi o'rtasidagi bog'liqlik Spearman rank korrelyatsiyasi (&lt;span class=\"yfm-latex\" data-content=\"%5Crho\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, figuralarda R sifatida ko'rsatilgan) yordamida umuman, har bir Braak bosqichi ichida va yuqori DAM hujayralari ichida miqdoriy baholandi; rank korrelyatsiyasi ishlatildi, chunki donor darajasidagi ballar tashqi qiymatlarni o'z ichiga oladi va Pearson korrelyatsiyasi ularga sezgir.&lt;/p&gt;\n&lt;p&gt;Kasallik bosqichidan qat'i nazar bog'liqlikni bosqichlararo trenddan ajratish uchun (Simpsoon paradoksi, bunda birlashtirilgan anabolik-DAM korrelyatsiyasi ikkala dasturning qarama-qarshi Braak梯度lari bilan niqoblanadi), Braak bosqichini nazorat qiluvchi qisman Spearman korrelyatsiyalari hisoblandi. DAM/anabolik dissotsiatsiya bosqichma-bosqich o'rtacha modul ballari bilan umumlashtirildi; erta (Braak 0–II/III–IV) va kechki (Braak V–VI) kasallik o'rtasidagi bosqich ichidagi anabolik-DAM korrelyatsiyasining o'zgarishi Fisher z taqqoslash testi bilan sinovdan o'tkirildi. Donor darajasidagi anabolik pasayish kompozitsion yoki hujayra ichidamiligini aniqlash uchun hujayralar yagona global chegara bo'yicha anabolik-yuqori deb belgilandi (barcha hujayralar bo'ylab hujayra darajasidagi anabolik ballning yuqori 30%); har bir donor uchun biz anabolik-yuqori hujayralar ulushini va ular ichidagi o'rtacha ballni hisobladik, va donor o'rtacha ko'rsatkichining Braak 3–4 dan 5–6 gacha o'zgarishi shift-share dekompozitsiyasi yordamida kompozitsion va hujayra ichidagi komponentlarga bo'lindi. Barcha testlar ikki tomonlama edi.&lt;/p&gt;\n&lt;h4 id=\"dasturiy-taminot\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#dasturiy-taminot\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dasturiy ta'minot&lt;/span&gt;&lt;/a&gt;Dasturiy ta'minot&lt;/h4&gt;\n&lt;p&gt;Barcha tahlillar Python 3.10.6 da bajarildi. Bitta yadro ma'lumotlarini boshqarish, qo'shni grafni qurish va UMAP joylashtirish scanpy (v1.11.5) 46 va anndata (v0.11.4) 47 yordamida amalga oshirildi; subklasterlar leidenalg (v0.10.2) 48 va python-igraph (v0.11.9) yordamida Leiden klasterizatsiyasi orqali aniqlandi, va joylashuvlar umap-learn (v0.5.9) 49 yordamida hisoblandi. Mikrogliyaning statistik tahlillari numpy (v2.2.5), pandas (v2.3.3), scipy (v1.15.3) 50 va statsmodels (v0.14.5) yordamida bajarildi. Figuralar matplotlib (v3.10.8) 51 va seaborn (v0.13.2) 52 yordamida yaratildi.&lt;/p&gt;\n&lt;h4 id=\"yadro-rna-sekvenirlash-tahlili\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#yadro-rna-sekvenirlash-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yadro RNA sekvenirlash tahlili&lt;/span&gt;&lt;/a&gt;Yadro RNA sekvenirlash tahlili&lt;/h4&gt;\n&lt;p&gt;Ushbu tadqiqotda barcha donorlar yakkaxayrat yadro RNA sekvenirlash (single-nucleus RNA-seq) usuli yordamida tahlil qilindi. Neyrodegenerativ jarayonning rivojlanishini baholash uchun barcha namunalar Braak bosqichlariga muvofiq uchta guruhga bo'lindi: boshlang'ich bosqichlar (0–II), o'tish davri bosqichlari (III–IV) va og'ir bosqichlar (V–VI).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Yakkaxayrat yadro RNA sekvenirlash (snRNA-seq) usuli miyaning turli xil hujayrali to'qimalarida har bir yadro darajasida genlar ekspressiyasini o'rganish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Olingan ekspressiya profillari patologiyaning rivojlanishi bilan yuzaga keladigan transkripsion o'zgarishlarni aniqlash uchun Braak bosqichlarining ajratilgan guruhlari o'rtasida solishtirildi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-f3.jpg\" alt=\"3-rasm: TREM2 plaka bilan bog'liq mikroqliyada yangi oqsil sintezini rag'batlantiradi. (A) In vivo FUNCAT markalash sxem\" /&gt;&lt;/p&gt;\n&lt;p&gt;*3-rasm: TREM2 plaka bilan bog'liq mikroqliyada yangi oqsil sintezini rag'batlantiradi. (A) In vivo FUNCAT markalash sxemasi. Sichqonlarga mikroqliyani ajratish va tahlil qilishdan 16 soat oldin Azidohomoalanin (AHA, 50 mg/kg) yuborildi. (B) CX3CR1+ CD45+ mikroqliyasida FUNCAT intensivligining vakillik oqim sitometriyasi gistogrammalari. Qizil o'q AppNL-G-F mikroqliyasida mavjud bo'lgan, ammo Trem2KO sichqonlarida yo'q bo'lgan \"yuqori FUNCAT\" yelkasini ko'rsatadi. (C) FUNCAT signali uchun o'rtacha flüoresans intensivligining (MFI) miqdoriy bahosi. (D) CD45high va CD45low mikroqliya populyatsiyalari orasida CD45 va FUNCAT intensivligini taqqoslash. (E) Iba1 (yashil), Aβ (82E1, kulrang) va yangi hosil bo'lgan oqsillar (FUNCAT, qizil) uchun bo'yalgan kortikal plakalarning vakillik konfokal tasvirlari. Masshtab chizig'i: 50 mkm. (F) Plaka bilan bog'liq mikroqliyada FUNCAT intensivligining miqdoriy bahosi. (G) Iba1 (yashil) va Aβ (Sian) uchun qo'shma bo'yalgan 9 oylik AppNL-G-F va AppNL-G-F;Trem2KO sichqonlarining plaka bilan bog'liq mikroqliyasidagi translyatsiya elonagatsiya omili EEF1A1 (Siyohrang) ning vakillik konfokal tasvirlari. Oq o'qlar Iba1+ plaka bilan bog'liq mikroqliya ichida EEF1A1 induksiyasini ko'rsatadi. Masshtab chizig'i: 20 mkm. (H) Iba1+ plaka bilan bog'liq mikroqliya ichida EEF1A1 intensivligining miqdoriy bahosi. n = har bir guruh uchun 7-8 sichqon. **&lt;em&gt;P &amp;lt; 0,001 ikki tomonlama juftlanmagan t-test bo'yicha.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-f4.jpg\" alt=\"4-rasm: Mikroqliyaning anabolik moslashuvi TREM2 ga bog'liq va Aβ yuk градиенти bo'ylab o'z-o'zini cheklaydi. (A) Transk\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm: Mikroqliyaning anabolik moslashuvi TREM2 ga bog'liq va Aβ yuk градиенти bo'ylab o'z-o'zini cheklaydi. (A) Transkripsion profillash uchun Methoxy-X04 (X04) musbat (X04+) va manfiy (X04-) mikroqliyani saralash uchun ishlatiladigan geytlashtirish strategiyasining sxemasi. (B) Aβ-fagotsitlovchi mikroqliyaning geytlashtirilishini tasvirlovchi vakillik oqim sitometriyasi grafiklari. Yuqori panellar: Yovvoyi turdagi (WT) va AppNL-G-F sichqonlarini taqqoslash X04 signalining o'ziga xosligini tasdiqlaydi. Pastki panellar: AppNL-G-F va AppNL-G-F;Trem2KO sichqonlarida ortib borayotgan fagotsitlar yukini ifodalovchi X04+ populyatsiyasining Past, O'rta va Yuqori flüoresans intensivligi binlariga stratifikatsiyasi. (C) Aβ-fagotsitlovchi mikroqliyaning vaqtinchalik tahlili. Yuqori panellar: AppNL-G-F sichqonlarida X04+ populyatsiyasining 5–6 oylikdan 9–10 oylikkacha kengayishi. Pastki panellar: 9 oylik AppNL-G-F va AppNL-G-F;Trem2KO sichqonlarida X04 intensivligi taqsimotini taqqoslash, bu TREM2KO mikroqliyasida X04high populyatsiyasining sezilarli darajada kamayganini ko'rsatadi. (D) Ommaviy RNA-seq namunlarining asosiy komponentlar tahlili (PCA) (n = 46). Nuqtalar genotiplar bo'yicha alohida biologik takrorlarni bildiradi: WT (n = 5), AppNL-G-F (n = 23) va AppNL-G-F;Trem2KO (n = 18). Ranglar X04 tasnifini bildiradi (X04- va X04+ kichik to'plamlari: Past, O'rta, Yuqori). Shuni yeb qolingki, X04 darajalari PC2 bo'ylab ajralishni keltirib chiqaradi va aniq plaka-fagotsitar holatlarni belgilaydi. (E) X04+ va X04- AppNL-G-F mikroqliyasida boyitilgan eng yuqori o'rinli yo'llarning IPA tahlili. O'qlar Aβ bilan bog'langanda mitoxondrial biogenez/oksidlovchi fosforillanish (qizil) va oqsilni yo'naltirish/sintez qilishning (to'q sariq) kuchli induksiyasini ta'kidlaydi. (F, G) AppNL-G-F sichqonlarida (F) va 9 oylik AppNL-G-F;Trem2KO sichqonlarida (G) X04- nazoratga nisbatan fagotsitar gradiyent (X04high, X04med, X04low) bo'ylab mikroqliyaning transkripsion o'zgarishlarini ko'rsatuvchi IPA taqqoslash tahlili. (H) 9 oylik yoshda Methoxy-X04 intensivligi bo'yicha stratifikatsiyalangan AppNL-G-F va AppNL-G-F;Trem2KO ning IPA taqqoslashi. Tanlangan sezilarli darajada boyitilgan kanonik yo'llar uchun faollashtirish z-ballari (Fisherning aniq testi; tuzatilgan P &amp;lt; 0,05) issiqlik xaritasi sifatida taqdim etilgan. Rang shkalasi yo'nalishning bashorat qilingan yo'nalishini ko'rsatadi: qizil ijobiy z-ballarga (bashorat qilingan faollashuv) to'g'ri keladi, ko'k salbiy z-ballarni (bashorat qilingan tormozlanish) bildiradi va kulrang IPA yo'nalishini bashorat qila olmagan yo'llarni bildiradi. Statistik ahamiyatga ega bo'lmagan yo'llar yulduzcha (&lt;/em&gt;) bilan belgilangan. Yo'llar qatorlari biologik ahamiyatiga ko'ra to'rt toifaga guruhlangan.*&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-f6.jpg\" alt=\"6-rasm: TREM2 yetishmasligi hazm bo'lmagan yukning hujayra ichida to'planishiga olib keladi. (A, C) PSD95 (postsinaptik \" /&gt;&lt;/p&gt;\n&lt;p&gt;*6-rasm: TREM2 yetishmasligi hazm bo'lmagan yukning hujayra ichida to'planishiga olib keladi. (A, C) PSD95 (postsinaptik marker, A) yoki miyelin asosiy oqsili (MBP, C) hamda Iba1 va Aβ uchun qo'shma bo'yalgan 9 oylik sichqonlarning blyashka bilan bog'langan mikrogliyasining vakillik konfokal tasvirlari. Oq strelkalar Trem2KO mikrogliyasi somasida PSD95 va MBP punktatlarining sezilarli darajada hujayra ichida to'planganligini ko'rsatadi. Masshtab chizig'i: 50 mkm. (B, D) Blyashka yaqinligiga nisbatan yuk to'planishining miqdoriy tahlili. Violino grafiklari to'g'ridan-to'g'ri blyashka bilan bog'lanmagan (NPAM) yoki blyashka bilan bog'langan (PAM) deb tasniflangan Iba1+ ROI doirasidagi PSD95 (B) yoki MBP (D) vokselining qoplanish foizini ko'rsatadi. Rangli nuqtalar alohida ROI larni ifodalaydi; qattiq qora doiralar va xato chiziqlari beta-binomial umumlashtirilgan chiziqli aralash modeldan (GLMM) olingan taxminiy chegaraviy o'rtachalarni (EMM) ± 95% ishonch oraliqlarini bildiradi. Chiziqlar biologik takroriylar ichidagi juftlangan hududlarni bog'laydi (har bir guruh uchun n = 5-6 sichqon). Juftlashtirilgan taqqoslashlar Delta usuli yordamida amalga oshirildi. Ahamiyatlilik darajalari: *P &amp;lt; 0.05, **P &amp;lt; 0.01, ***P &amp;lt; 0.001, ***&lt;em&gt;P &amp;lt; 0.0001. Ahamiyatsiz tendentsiyalar uchun aniq p qiymatlari ko'rsatilgan. (E) DAPI, PSD95 (yashil), Iba1 (to'q qizil) va Aβ (havoriy) uchun qo'shma bo'yalgan AppNL-G-F;Trem2KO sichqonlaridagi blyashka bilan bog'langan mikroglial hujayraning 3D sirt ko'rinishi (Imaris). Katta, yuk bilan to'ldirilgan o'simchaning chiqib ketishiga e'tibor bering. (F) PSD95 punktatlari va Aβ agregatlarining Iba1+ o'simchasi ichida o'ralganligini tasdiqlovchi yuqori kattalashtirishdagi (63X) yagona optik kesma (0.17 mkm). (G) Blyashka nishasidagi PSD95+ o'simchalarining miqdoriy tahlili (105 mkm³ ROI). Har bir nuqta alohida blyashka ROI ni bildiradi. Medianlar va interkvartil oraliqlar (IQR) mos ravishda nuqtalar va chiziqlar bilan ko'rsatilgan. Statistik ahamiyatlilik aniq permutatsiyali parametrik bo'lmagan Uilkoxon rang-summa testi yordamida aniqlandi (R paketi coin, v1.4.3). (H) Miyelin asosiy oqsili (MBP) qoldiqlarini o'z ichiga olgan o'simchalarning 3D sirt ko'rinishi. (I) O'simcha lumenida MBP yukining mavjudligini tasdiqlovchi yagona optik kesma (0.17 mkm). (J) Genotiplar orasidagi MBP+ o'simchalar zichligining miqdoriy tahlili.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-f7.jpg\" alt=\"7-rasm: TREM2 yo'qolishi blyashka bilan bog'langan mikrogliyada mitoxondrial biogenez va yangilanishning pasayishiga oli\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-rasm: TREM2 yo'qolishi blyashka bilan bog'langan mikrogliyada mitoxondrial biogenez va yangilanishning pasayishiga olib keladi. (A) Mitoxondrial massani (MitoTracker Green), the membrana potentsialini (MitoTracker Red CMXRos) va mitoxondrial salomatlik indeksini (membrana potentsialining massaga nisbati) o'lchaydigan 9 oylik AppNL-G-F sichqonlarining CD45low (blyashka bilan bog'lanmagan) va CD45high (blyashka bilan bog'langan) mikrogliyasida mitoxondrial moslashuvchanlikni oqim sitometriyal tahlili. CD45high mikrogliyasi kengaytirilgan bioenergetik sig'imni ko'rsatib, yuqori membrana potentsialini ko'rsatadi. (B) Xuddi shu populyatsiyalarda lizosomal massa (LysoTracker Deep Red); CD45high mikrogliyasi yuqori lizosomal massani ko'rsatadi va degradatsiya qobiliyatining induksiyasini tasdiqlaydi. (C) 9 oylik AppNL-G-F va AppNL-G-F;Trem2KO sichqonlarining asosiy mikrogliyasidagi mitoxondrial moslashuvchanlik (A dagi kabi ko'rsatkichlar). Trem2KO mikrogliyasi metabolik jihatdan nosog'lom organellalarning to'planishini ko'rsatuvchi «Yuqori massa / Past salohiyat» fenotipini ko'rsatadi. (D) Lizosomal massa (LysoTracker Deep Red); genotip farqining yo'qligi mitoxondrial to'planish lizosomal etishmovchilik tufayli kelib chiqmaganligini bildiradi. (E) AHA-TOM20 yaqinlik ligatsiyasi tahlili (PLA) orqali in situ hosil bo'layotgan mitoxondrial biogenez. Vakillik konfokal tasvirlari blyashka nishasidagi Iba1+ mikrogliyasi (yashil) ichida yangi sintez qilingan TOM20 ni (TOM20-PLA punktatlari, qizil) ko'rsatadi, u AppNL-G-F da kuchli va Trem2KO mikrogliyasida zaiflashgan. (F) Har bir mikrogliya uchun hosil bo'layotgan TOM20-PLA punktatlari sonining miqdoriy tahlili (har bir sichqon uchun 10-15 tasodifiy tanlangan blyashka miqdoriy aniqlandi). (G) VDAC1, P62 (autofagiya retseptori) va Iba1 uchun qo'shma bo'yalgan blyashka bilan bog'langan mikrogliyaning vakillik konfokal tasvirlari (MIP, 5 mkm). Oq strelkalar Trem2KO mikrogliyasida yuqori p62 ga ega VDAC1+ mitoxondriyalarni ko'rsatadi. Masshtab chizig'i: 20 mkm. (H) IBA1⁺VDAC1⁺ hududlarida P62 intensivligining miqdoriy tahlili; har bir sichqon uchun 20-30 ta blyashka miqdoriy aniqlandi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-f8.jpg\" alt=\"8-rasm: Mikroglial anabolik dastur odamlarda saqlanib qoladi va BA progressivlanishi bilan kamayadi. (A) Birlashtirilgan\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-rasm: Mikroglial anabolik dastur odamlarda saqlanib qoladi va BA progressivlanishi bilan kamayadi. (A) Birlashtirilgan inson mikroglial UMAP ga proektsiyalangan anabolik, DAM va gomeostatik dasturlar uchun yadro bo'yicha modul ballari (ssKIND atlasi; 523 donor). (B) Braak bosqichlari bo'ylab donor darajasidagi psevdo-hajmli anabolik modul bali (0–II, III–IV, V–VI). Har bir nuqta bitta donor; qutilar mediana va interkvartil oralig'ini ko'rsatadi. Anabolik ball Braak bosqichi bo'ylab pasayadi (chiziqli model β = −0.41, P = 1.8×10⁻⁵; Spirman R = −0.35), eng keskin Braak III–IV va V–VI orasida. n = 34 / 223 / 266 donor (Braak 0–II / III–IV / V–VI). Juftlashtirilgan taqqoslashlar, Mann–Vitni U. (C) Har bir donor uchun yuqori anabolik hujayralar ulushi; (D) o'sha yuqori hujayralar ichidagi o'rtacha anabolik ball; hujayralar global chegarada (barcha hujayralar bo'ylab hujayra darajasidagi anabolik ballning eng yuqori 30% i) yuqori anabolik deb belgilandi. (E) Braak bosqichi bo'yicha donorlar kesimida TREM2 ekspresiyasi (log₂ CPM) va anabolik modul bali. Spirman R har bir bosqichda ijobiy; Braak bosqichini nazorat qiluvchi qisman R = +0.28. Qizil chiziq, chiziqli moslashish; soyali tasma, 95% ishonch oralig'i. (F) Braak bosqichlari bo'yicha o'rtacha anabolik va DAM modul ballari (xato chiziqlari, s.e.m.), Braak V–VI tomonidan farqlanishini ko'rsatadi. Braak bosqichini nazorat qiluvchi qisman Spirman korrelyatsiyalari: anabolik–TREM2 R = +0.28; anabolik–DAM R = +0.23; anabolik–gomeostatik R = +0.08 (n.s.). (G) Barcha donorlar bo'ylab birlashtirilgan DAM moduli bilan anabolik dasturning donor darajasidagi bog'lanishi (yagona regressiya, birlashtirilgan Spirman R). (H) DAM moduli bilan anabolik dasturning donor darajasidagi bog'lanishi; qisman Spirman R bilan Braak ichidagi regressiya (Braak bosqichini nazorat qilish).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS1.jpg\" alt=\"Kengaytirilgan rasm 1. (A) Gen-konsept tarmoq plotlari 'kichik ribosomal kichik birlik', 'katta ribosomal kichik birlik'\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Kengaytirilgan rasm 1. (A) Gen-konsept tarmoq plotlari 'kichik ribosomal kichik birlik', 'katta ribosomal kichik birlik' va 'mitoxondrial ribosoma' gen ontologiyasi (GO) atamalari bilan bog'liq bo'lgan eng yaxshi 10 ta differentsial ko'p miqdordagi oqsillarni ko'rsatadi. Bu oqsillar 3 oylik nazorat guruhiga nisbatan 9 oylik AppNL-G-F mikrogliyasida sezilarli darajada boyitilgan. Vizualizatsiya Kamada–Kavai joylashuv algoritmi yordamida yaratilgan. (B) AppNL-G-F mikrogliyasining transkriptomini ifodalovchi Biologik jarayon (BP) atamalarining Genlar to'plamini boyitish tahlili (GSEA) nuqtali plotlari. Qizil strelkalar anabolik imzolarning boyitilganligini va to'q sariq strelkalar 3 oylik analoglarga nisbatan 9 oylik AppNL-G-F mikrogliyasida boyitilgan katabolik imzolarni ko'rsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS2.jpg\" alt=\"Kengaytirilgan rasm 2. (A) 3 oyligida AppNL-G-F;Trem2KO va AppNL-G-F mikrogliyalari orasida turlicha ko'p bo'lgan oqsill\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Kengaytirilgan rasm 2. (A) 3 oyligida AppNL-G-F;Trem2KO va AppNL-G-F mikrogliyalari orasida turlicha ko'p bo'lgan oqsillar yo'qligini ko'rsatuvchi Volkan plot (tuzatilgan P &amp;lt; 0.05). (B, C) AppNL-G-F;Trem2KO mikrogliyasining proteomi va transkriptomini ifodalovchi BP atamalarining GSEA. Nuqtali plotlar 9 oylik AppNL-G-F analoglari bilan solishtirganda AppNL-G-F;Trem2KO mikrogliyasining proteomidagi (B) va transkriptomidagi (C) boyitilgan yo'llarni tasvirlaydi. Ko'k strelkalar bostirilgan 'ribosomal' imzolarni ko'rsatadi. (D) ActivePathways yordamida transkriptom va proteom yo'nalishli integratsiyasining korrelyatsion tahlili. AppNL-G-F mikrogliyasida (9 oy va 3 oy) yo'nalishli tahlil (DPM, y-o'qi) va yo'nalishsiz tahlil (Braun usuli, x-o'qi) orqali hisoblangan birlashtirilgan P-qiymatlarini ko'rsatuvchi sochma diagramma. Ma'lumotlar to'plamlari bo'ylab yo'nalish bo'yicha izchil o'zgarishlarga ega ustuvor genlar diagonalda yoki unga yaqin joylashgan (ko'k), ziddiyatli yo'nalish o'zgarishlariga ega genlar esa jarima tortilib, diagonaldan pastroqda joylashgan (jigarrang). (E) AppNL-G-F mikrogliyasining ko'p omiksli yo'lni boyitishi. AppNL-G-F mikrogliyasida aniqlangan, lekin AppNL-G-F;Trem2KO mikrogliyasi ma'lumotlar to'plamida mavjud bo'lmagan noyob GO atamalarini ko'rsatuvchi ustunli diagramma. Ko'p omiksli ma'lumotlarni birlashtirish ActivePathways yordamida amalga oshirildi, bunda yo'nalishli p-qiymatni birlashtirish (DPM) usuli yordamida hosil qilingan birlashtirilgan ahamiyatlilik baholari ishlatildi. Ushbu ustuvor atamalar proteostaz bilan bog'liq va oltita funksional toifaga guruhlangan (rang bilan ko'rsatilgan). Ahamiyatlilik boyitish tahlili uchun kirish ma'lumotlari sifatida birlashtirilgan P-qiymatlari yordamida aniqlandi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS3.jpg\" alt=\"Kengaytirilgan 3-rasm. (A) Miya to‘qimasi сусpensionasidan tirik, yagona mikroglial hujayralarni (CX3CR1+ CD45+) ajratib\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Kengaytirilgan 3-rasm. (A) Miya to‘qimasi сусpensionasidan tirik, yagona mikroglial hujayralarni (CX3CR1+ CD45+) ajratib olish uchun foydalanilgan oqim cytometry geytrlash strategiyasi. (B) AppNL-G-F sichqonlarida 3 oylikdan 9 oylikkacha bo‘lgan yoshda CD45 yuqori darajadagi mikroglial populyatsiyaning vaqtinchalik kengayishini ko‘rsatuvchi vakili oqim cytometry grafiklari. E'tibor bering, bu kengayish AppNL-G-F;Trem2KO sichqonlarida jiddiy darajada pasaygan. (C) 3 va 9 oylik yoshdagi AppNL-G-F va AppNL-G-F;Trem2KO sichqonlaridan ajratilgan birlamchi mikrogliyada CD45 o‘rtacha flüoresans intensivligining (MFI) miqdoriy bahosi. (D) Iba1 va Aβ uchun birgalikda bo‘yalgan, 9 oylik AppNL-G-F va AppNL-G-F;Trem2KO sichqonlarining plakt bilan bog‘langan mikrogliyasidagi fosforillangan ribosomal S6 oqsilining (p-RPS6, Ser235/236) vakili konfokal tasvirlari. (E) Har bir mikroglial hujayra uchun p-RPS6 intensivligining miqdoriy bahosi. n = guruh uchun 6–8 sichqon. Ikki tomonlama juftlashtirilmagan t-test bo‘yicha **&lt;em&gt;P &amp;lt; 0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS3-2.jpg\" alt=\"Rasm S3 (davomi 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S3 (davomi 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS4.jpg\" alt=\"Kengaytirilgan 4-rasm. (A, B) 9 oylik AppNL-G-F va AppNL-G-F;Trem2KO mikrogliyasida Aβ yukining turli darajalarini aks e\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Kengaytirilgan 4-rasm. (A, B) 9 oylik AppNL-G-F va AppNL-G-F;Trem2KO mikrogliyasida Aβ yukining turli darajalarini aks ettiruvchi X04 intensivligi bilan bog‘liq mikrogliyaning o‘ziga xos transkripsiya holatlari. (A) 9 oylik AppNL-G-F sichqonlaridan ajratilgan mikrogliyaning umumiy RNA-seq tahlili PCA (X04H, n = 5; X04M, n = 3; X04L, n = 3; X04P, n = 6; X04N, n = 6). (B) 9 oylik AppNL-G-F;Trem2KO sichqonlaridan ajratilgan mikrogliyaning umumiy RNA-seq tahlili PCA (X04H, n = 3; X04M, n = 3; X04L, n = 3; X04P, n = 5; X04N, n = 5). O‘q (ko‘kdan och ko‘k ranggacha bo‘lgan gradient) pastdan (o‘ngda) yuqorigacha (chapda) X04 intensivligi spektrini bildiradi. (C) 9 oylik AppNL-G-F;Trem2KO sichqonlarining X04+ va X04- mikrogliyasini taqqoslovchi IPA kanonik yo‘llar tahlili. Ustunli diagramma X04+ mikrogliyada sezilarli darajada boyitilgan top-20 kanonik yo‘llarni ko‘rsatadi (Fisherning aniq testi p-qiymati &amp;lt; 0.05). E'tibor bering, anabolik moslashuv TREM2 yetishmaydigan mikrogliyada to‘liq yo‘qolgan. Yo‘llar boyitilish ahamiyatiga ko‘ra −log10(P-value) sifatida tartiblangan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS5.jpg\" alt=\"Kengaytirilgan 5-rasm. (A) scRNA-seq ma'lumotlarining bir xil manifold yaqinlashuvi va proyeksiyasi (UMAP) (razresheniye\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Kengaytirilgan 5-rasm. (A) scRNA-seq ma'lumotlarining bir xil manifold yaqinlashuvi va proyeksiyasi (UMAP) (razresheniye 0.2) oltita alohida mikroglial klasterni aniqlaydi: gomeostatik mikrogliya (HM), faollashgan javob mikrogliyasi (ARM), o‘tish davri javob mikrogliyasi (TRM), interferon javob mikrogliyasi (IRM), siklik/proliferatsiyalanuvchi mikrogliya (CPM) (Sala Frigerio va boshq., 2019) va ribosomal mikrogliya (Mancuso va boshq., 2024), shuningdek kichik annotatsiya qilinmagan klaster. (B) O‘rnatilgan modul ballaridan foydalangan holda klaster identifikatorini tasdiqlash. Belgilar grafikalari Sala Frigerio va boshq. (2019) gen imzolarining proyeksiyasini ko‘rsatib, joriy klasterlash va oldindan aniqlangan holatlar o‘rtasidagi muvofiqlikni tasdiqlaydi. Rang gradientlari har bir hujayra uchun hisoblangan modul ballini bildiradi (Ko‘k: Past; Qizil: Yuqori). (C) Kasallik bilan bog‘liq kanonik mikrogliya (DAM) imzoning taqsimlanishi. UMAP proyeksiyalari (chapda) va skripka diagrammalari (o‘ngda) fagotsitik bo‘lmagan X04- va fagotsitik X04+ sharoitlarida DAM imzosining (Chen &amp;amp; Colonna, 2021) ifodalanishini ko‘rsatadi. Y o‘qi modul ballini bildiradi; skripka kengligi hujayra zichligini ko‘rsatadi. (D) X04 sharoitlari bo‘yicha klasterlash sifat nazorati. Fagotsitik bo‘lmagan (X04-) va fagotsitik (X04+) sharoitlarga bo‘lingan yuqori aniqlikdagi subklasterlarning (razresheniye 0.3) UMAP proyeksiyalari X04+ va X04- hujayralari alohida subklasterlarni egallashini ko‘rsatadi. (E) X04- va X04+ sharoitlarida har bir subklaster (razresheniye 0.3) uchun DAM modul ballarini ko‘rsatuvchi skripka diagrammalari. E'tibor bering, DAM ballari fagotsitik va fagotsitik bo‘lmagan subklasterlar o‘rtasida taqqoslanarli. (F) Fagotsitik 1-klasterni fagotsitik bo‘lmagan 6-klaster bilan taqqoslovchi eng yuqori reytingli kanonik yo‘llar IPA. Qizil o‘qlar oqsil sintezi va tarjima yo‘llarining induksiyasini ta'kidlaydi; ko‘k o‘q neyroyallig‘lanish signallarining bostirilishini bildiradi. (G) Fagotsitik boyitilgan 2-klasterni fagotsitik bo‘lmagan 0-klaster bilan taqqoslovchi eng yuqori reytingli kanonik yo‘llar IPA. Qizil o‘qlar ribosomalar biogenezi va oqsil sintezining kuchayishini ta'kidlaydi; sariq o‘qlar mitoxondriyal oksidlovchi fosforillanishning faollashishini bildiradi. (H) 2-klasterda 0-klasterga nisbatan maxsus boyitilgan Biologik jarayon (BP) terminlarining GSEA nuqtali grafigi. Rang gradienti tuzatilgan P-qiymatlarini bildiradi. Kengaytirilgan 5-rasm (Davomi)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS5-2.jpg\" alt=\"Rasm S5 (davomi 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S5 (davomi 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS6.jpg\" alt=\"Kengaytirilgan 6-rasm. (A) Gene Ontology (GO) «Sinaps», «Mielin qobig‘i» va «Lizosoma» terminlari bilan bog‘liq eng yuqo\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Kengaytirilgan 6-rasm. (A) Gene Ontology (GO) «Sinaps», «Mielin qobig‘i» va «Lizosoma» terminlari bilan bog‘liq eng yuqori farqli ko‘p bo‘lgan oqsillarni ko‘rsatuvchi gen-konsept tarmoq (cnet) grafiklari. E'tibor borgan holda, ushbu yuk oqsillari 9 oylik AppNL-G-F nazoratiga nisbatan Trem2KO mikrogliyasida maxsus boyitilgan bo‘lib, ichki qilingan materialni parchalay olmasligini ko‘rsatadi. (B) PSD95 (postsinaptik marker), CD68 (lizosomal marker) va Iba1 uchun birgalikda bo‘yalgan, 9 oylik sichqonlarning plakt bilan bog‘langan mikrogliyasining vakili konfokal tasvirlari. Oq o‘qlar CD68+ fagolizosomalari ichida joylashgan PSD95 nuqtali to‘plamlarini ta'kidlaydi, bu yukning muvaffaqiyatli qamrab olingani va degradatsion kompartmentlarga tashilganini bildiradi. Masshtab panjarasi: 50 mkm. (C) vGluT1 (presinaptik marker), Iba1 va Aβ uchun birgalikda bo‘yalgan, 9 oylik sichqonlarning plakt bilan bog‘langan mikrogliyasining vakili konfokal tasvirlari. Oq o‘qlar Trem2KO mikrogliyasining somasi ichida vGluT1 nuqtali to‘plamlarining yaqqol hujayra ichki to‘planishini ko‘rsatadi. Masshtab panjarasi: 50 mkm. (D) 9–10 oylik AppNL-G-F va AppNL-G-F;Trem2KO sichqonlarining miya kesmalarida hujayra ichki yukining to‘planishi (vGluT1 va boshqalar) miqdoriy bahosi. Rangli nuqtalar alohida ROI larni bildiradi; qattiq qora doiralar va xatolik panjaralari beta-binomial Umumiy chiziqli aralash modelidan (GLMM) olingan Taxminiy marginal o‘rtachalarni (EMM) ± 95% CI ni bildiradi. (n = guruh uchun 5–6 sichqon). Juft taqqoslashlar Delta usuli yordamida amalga oshirildi. Ahamiyat darajalari: *P &amp;lt; 0.05, **P &amp;lt; 0.01, ***P &amp;lt; 0.001, ***&lt;em&gt;P &amp;lt; 0.0001. (E) PSD95 (postsinaptik marker), Iba1 va Aβ uchun birgalikda bo‘yalgan, plakt bilan bog‘langan mikrogliyaning vakili konfokal tasvirlari (MIP, 5 mkm). Oq o‘qlar Trem2KO mikrogliyasidan kelib chiqadigan, PSD95 nuqtalari bilan to‘ldirilgan o‘simta bilan bog‘langan yirik (&amp;gt;2 mkm) yuk qo‘shilmalarini ko‘rsatadi. Qizil o‘q 6E-rasmda 3D sirt renderlash uchun ishlatilgan hujayrani ko‘rsatadi. Masshtab panjarasi: 20 mkm. (F) Mielin asosiy oqsili (MBP), Iba1 va Aβ uchun birgalikda bo‘yalgan vakili konfokal tasvirlari (MIP, 5 mkm). Oq o‘qlar Trem2KO mikrogliyasidagi MBP bilan to‘ldirilgan yuk qo‘shilmalarini ko‘rsatadi. Qizil o‘q 6H-rasmda 3D sirt renderlash uchun ishlatilgan hujayrani ko‘rsatadi. Masshtab panjarasi: 20 mkm. (G-H) PSD95 (qizil, G) yoki MBP (yashil, H) o‘z ichiga olgan yuk qo‘shilmalarining kurtaksimon morfologiyasini tasdiqlovchi AppNL-G-F;Trem2KO sichqonlarining plakt bilan bog‘langan mikrogliyasining qo‘shimcha 3D sirt renderlashlari (Imaris). Mikroglial membrana magenta rangda (Iba1) ko‘rsatilgan. Kengaytirilgan 6-rasm (Davomi)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS6-2.jpg\" alt=\"Rasm S6 (davomi 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S6 (davomi 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS7.jpg\" alt=\"Kengaytirilgan 7-rasm. (A) TOM20 yaqinlik ligatsiyasi tahlili (PLA) uchun manfiy nazorat. Birlamchi TOM20 antikorlari ta\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Kengaytirilgan 7-rasm. (A) TOM20 yaqinlik ligatsiyasi tahlili (PLA) uchun manfiy nazorat. Birlamchi TOM20 antikorlari tashlab yuborilgan holda parallel ravishda ishlov berilgan plakt bilan bog‘langan mikrogliyaning vakili konfokal tasvirlari; PLA signalining yo‘qligi TOM20-PLA reaksiyasining o‘ziga xosligini tasdiqlaydi. Masshtab panjarasi: 20 mkm. (B) TOM20 (mitoxondriya), Iba1 va FUNCAT (yangi hosil bo‘lgan oqsil sintezi) uchun birgalikda bo‘yalgan, 9–10 oylik AppNL-G-F va AppNL-G-F;Trem2KO sichqonlarining plakt bilan bog‘langan mikrogliyasining vakili konfokal tasvirlari (MIP, 4 mkm z-stak). Masshtab panjarasi: 20 mkm. (C) Har ikki genotipda TREM2, Iba1 va Aβ uchun birgalikda bo‘yalgan vakili konfokal tasvirlari (MIP, 4 mkm z-stak). Oq katakcha AppNL-G-F mikrogliyasining o‘simtalari ichida TREM2 oqsilining o‘ziga xos induksiyasini ta'kidlaydi, bu 7E-rasmda ko‘rsatilgan mahalliy mitoxondriyal biogenez joylari bilan fazoviy ravishda mos keladi. Masshtab panjarasi: 20 mkm. (D-E) Plakt yaqinligiga nisbatan mitoxondriyal massa to‘planishining vakili tasvirlari va miqdoriy bahosi. Skripka diagrammalari Plakt bilan bog‘lanmagan (NPAM) yoki Plakt bilan bog‘langan (PAM) deb tasniflangan Iba1+ ROI lari ichida TOM20 voksel qoplamining taqsimlanishini ko‘rsatadi. Rangli nuqtalar alohida ROI larni bildiradi; qattiq doiralar va xatolik panjaralari beta-binomial Umumiy chiziqli aralash modelidan (GLMM) olingan Taxminiy marginal o‘rtachalarni (EMM) ± 95% CI ni bildiradi. Chiziqlar biologik takroriylikdagi juftlashgan hududlarni birlashtiradi (n = 5–6 sichqon). Juft taqqoslashlar Delta usuli yordamida amalga oshirildi. ***P &amp;lt; 0.001, ***&lt;em&gt;P &amp;lt; 0.0001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS8.jpg\" alt=\"Kengaytirilgan 8-rasm. (A) Inson mikroglialarini nazoratsiz qayta klasterlash (Leiden 0.4 ruxsati) va modul-gen nuqtali \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Kengaytirilgan 8-rasm. (A) Inson mikroglialarini nazoratsiz qayta klasterlash (Leiden 0.4 ruxsati) va modul-gen nuqtali grafigi, DAM-marker-high subklasteridan farq qiluvchi ribosomal/anabolik-high subklasterini aniqlaydi. (B) qPCR/RNA-seq normalizatsiyasi adabiyotlaridan olingan to'qqizta keng qo'llaniladigan barqaror referens genlarga asoslangan Braak bosqichlari bo'ylab barqaror-referens nazorat moduli bali (n.s.): ACTB, TBP, POLR2A, PPIA, HPRT1, YWHAZ, PUM1, CASC3, ELF1. (C) Braak bosqichlari bo'ylab har bir yadro uchun aniqlangan median genlar (sekvensiya chuqurligi nazorati; n.s.). (D) Braak bo'yicha hujayra bo'yicha anabolik taqsimot. Donor darajasidagi pasayish asosan kompozitsion xarakterga ega (yuqori anabolik hujayralar kamroq) kichikroq hujayra komponenti bilan. (E) DAMhigh mikroglia ichida TREM2 va anabolik bal, Braak bosqichi bo'yicha (Spirmen R). (F) Anabolik dasturning TREM2 bilan donor darajasidagi bog'liqligi. Yuqori qator: Braak bosqichi doirasidagi regressiya qisman Spirmen R bilan (Braak bosqichini nazorat qilgan holda). Pastki qator: barcha donorlar bo'ylab birlashtirilgan xuddi shu bog'liqlik (yagona regressiya, birlashtirilgan Spirmen R). (G) Anabolik dasturning gomeostatik modul bilan donor darajasidagi bog'liqligi (salbiy nazorat). Yuqori qator: Braak bosqichi doirasidagi regressiya qisman Spirmen R bilan (Braak bosqichini nazorat qilgan holda). Pastki qator: barcha donorlar bo'ylab birlashtirilgan xuddi shu bog'liqlik (yagona regressiya, birlashtirilgan Spirmen R).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS8-2.jpg\" alt=\"Rasm S8 (davomi 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S8 (davomi 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS8-3.jpg\" alt=\"Rasm S8 (davomi 3)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S8 (davomi 3)&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"jadvallar\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#jadvallar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Jadvallar&lt;/span&gt;&lt;/a&gt;Jadvallar&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 1.&lt;/strong&gt; Braak bosqichi bo'yicha inson AD mikrogliya ma'lumotlar to'plamining kohorta xarakteristikalari&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Xarakteristika&lt;/th&gt;\n&lt;th&gt;Braak 0–II&lt;/th&gt;\n&lt;th&gt;Braak III–IV&lt;/th&gt;\n&lt;th&gt;Braak V–VI&lt;/th&gt;\n&lt;th&gt;Jami&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Donorlar, n&lt;/td&gt;\n&lt;td&gt;34&lt;/td&gt;\n&lt;td&gt;223&lt;/td&gt;\n&lt;td&gt;266&lt;/td&gt;\n&lt;td&gt;523&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Yosh, yil — o'rtacha (diapazon)&lt;/td&gt;\n&lt;td&gt;81.2 (64–96)&lt;/td&gt;\n&lt;td&gt;89.2 (68–108)&lt;/td&gt;\n&lt;td&gt;83.7 (56–101)&lt;/td&gt;\n&lt;td&gt;85.9 (56–108)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Jins, A / E&lt;/td&gt;\n&lt;td&gt;21 / 13&lt;/td&gt;\n&lt;td&gt;130 / 93&lt;/td&gt;\n&lt;td&gt;162 / 104&lt;/td&gt;\n&lt;td&gt;313 / 210&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Platforma (snRNA / scRNA)&lt;/td&gt;\n&lt;td&gt;34 / 0&lt;/td&gt;\n&lt;td&gt;223 / 0&lt;/td&gt;\n&lt;td&gt;266 / 0&lt;/td&gt;\n&lt;td&gt;523 / 0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Mikrogliya, n (yadrolar)&lt;/td&gt;\n&lt;td&gt;8,445&lt;/td&gt;\n&lt;td&gt;53,609&lt;/td&gt;\n&lt;td&gt;142,229&lt;/td&gt;\n&lt;td&gt;204,283&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Ma'lumotlar 14 ta yadroviy RNK-seq tadqiqotidan olingan 523 donorni (313 ayol / 210 erkak) o'z ichiga oladi.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 i
