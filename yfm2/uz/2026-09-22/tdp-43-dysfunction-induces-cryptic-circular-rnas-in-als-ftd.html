            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"254\" cy=\"130\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"486\" cy=\"276\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Яширин ҳалқасимон РНК&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;молекулалари хавфли&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;нейродегенератив касалликни&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;фош этади&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd-f1.jpg\" alt=\"1-rasm — TDP-43 ning kamayishi bir nechta hujayra modellarida c-circRNAlar ekspresiyasini rag'batlantiradi: A) TDP-43 no\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm — TDP-43 ning kamayishi bir nechta hujayra modellarida c-circRNAlar ekspresiyasini rag'batlantiradi: A) TDP-43 nokdaunidan keyin to'rtta RNA-seq ma'lumotlar to'plamida (SH-SY5Y, SK-N-BE(2), i3LMN va i3N) aniqlangan barcha circRNAlar uchun log₂ karrali o'zgarishni (x o'qi) va −log₁₀ P qiymatini (y o'qi) ko'rsatuvchi vulqon diagrammalari. Invariant circRNAlar kulrang rangda, differensial ekspresiyalangan circRNAlar (gorizontal −log10 P qiymat chegarasidan yuqori nuqtalar) qizil rangda va kriptik circRNAlar to'q qizil rangda ko'rsatilgan. B) To'rtta TDP-43 nokdaun modelida (SH-SY5Y, SK-N-BE(2), i3LMN va i3N) aniqlangan yuqori ekspresiyalangan circRNAlarning ustma-ust tushishini ko'rsatuvchi UpSet grafigi. O'ng tomondagi gorizontal chiziqlar har bir modelda TDP-43 nokdaunidan keyin yuqori ekspresiyalangan circRNAlarning umumiy sonini bildiradi, vertikal chiziqlar esa har bir kesishmaning hajmini ifodalaydi. Ulangan nuqtalar har bir kesishmaga hissa qo'shadigan ma'lumotlar to'plamini bildiradi. Pastki panel yuqori ekspresiyalangan circRNAlar sonini ular aniqlangan modellar soniga ko'ra umumlashtiradi. To'rtta modeldan kamida ikkitasida yuqori ekspresiyalangan circRNAlar «Yuqori ishonchli circRNAlar» sifatida tasniflandi va keyingi tahlillar uchun saqlab qolindi. C) TDP-43 bilan bog'liq bo'lgan kriptik circRNAlarni aniqlash uchun ishlatiladigan filtrlash strategiyasini tasvirlovchi huni diagrammasi. 148 ta yuqori ishonchli circRNA orasida 76 tasi kriptik circRNA (c-circRNA) mezonlariga javob berdi. TDP-43 CLIP ma'lumotlar to'plami bilan integratsiya ularning yon atrofdagi intronlarida TDP-43 bog'lanish dalillariga ega bo'lgan 22 ta c-circRNA ni aniqladi. D) To'rtta TDP-43 nokdaun hujayra modelida (SH-SY5Y, SK-N-BE(2), i3LMN va i3N) yuqori ishonchli c-circRNAlarning Log2 Fold Change (Log2FC) qiymatlarini ko'rsatuvchi issiqlik xaritasi. c-circRNAlar ular aniqlangan ma'lumotlar to'plamlari soniga ko'ra guruhlangan (List 2/4, List 3/4 va List 4/4) va issiqlik xaritasi ustidagi gistogrammalarda ko'rsatilgandek, ma'lumotlar to'plamlari bo'yicha o'rtacha Log₂FC bo'yicha tartiblangan. Rang intensivligi TDP-43 kamayganidan keyin circRNA yuqori ekspresiyasining kattaligini ko'rsatadi. Qora chiziqlar CLIP ma'lumotlariga asoslanib yon atrofdagi intronlarida TDP-43 bog'lanish dalillariga ega bo'lgan c-circRNAlarni bildiradi, kulrang chiziqlar esa aniqlanadigan TDP-43 bog'lanishi yo'qligini ko'rsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Ён бом омиотрофик склероз ва пешона-чалвиқ деменциясида TDP-43 оқсили ҳуayра ядросида тўғри ишламай қолади. Шу сабабли генетик кўрсатмалар бузилиб, олдин номаълум бўлган ҳалқасимон РНК молекулалари пайдо бўлади. Олимлар бу аномалияларни мия тўқималарида аниқлашни ўрганиб, аниқ ташхис қўйиш истиқболларини очди. Бундан ташқари, бундай молекулалардан бири касалликнинг асосий гени билан боғлиқ бўлиб, янги дориларнинг самарадорлигини кузатишга ёрдам беради.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;TDP-43 оқсили етишмовчилиги ғайritabiiy ҳалқасимон РНКларни келтириб чиқаради.&lt;/li&gt;\n&lt;li&gt;Янги аниқлаш усули мия патологиясини 0.99 AUC билан топиш имконини беради.&lt;/li&gt;\n&lt;li&gt;UNC13A генидаги ҳалқасимон РНК янги дорилар учун биомаркер бўлиши мумкин.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;TDP-43 оқсили одатда нерв ҳуayралари ядросида рибонуклеин кислоталарининг етилишини назорат қилади, аммо ён бом омиотрофик склероз (БАС) ва пешона-чалвиқ деменциясида (ЛВД) у ядрони тарк этади. Муаллифларнинг аниқлашича, TDP-43 етишмовчилиги инсон нейрон ҳуayра моделларида махсус яширин ҳалқасимон РНКлар (c-circRNA) пайдо бўлишига олиб келади. Ўлимдан кейинги мия тўқималарининг транскриптомларини таҳлил қилиш бу ҳалқасимон молекулалар айнан TDP-43 патологияси билан боғлиқ ҳолатларга хослигини тасдиқлади.&lt;/p&gt;\n&lt;p&gt;Тадқиқотчилар марказий нерв тизими тўқималарида патологияни 0.99 AUC билан аниқлаш имконини берувчи юқори сезувчан усулларни ишлаб чиқдилар. Маълум бўлишича, бундай ҳалқасимон молекулаларнинг ҳосил бўлиши кўпинча чизиқли сплайсинг хатолари билан мос келади ва RPTOR ҳамда EHMT1 каби муҳим оқсилларнинг йўқолишига олиб келади. Эътиборли жиҳати шундаки, бундай ҳалқасимон молекулалардан biri UNC13A генидан келиб чиқади ва унга қарши янги антисмысловый олигонуклеотидлар (ASO) ишлаб чиқилмоқда.&lt;/p&gt;\n&lt;p&gt;UNC13A криптик экзонининг бостирилиши маданий нейронларда ва тирик организмда c-circUNC13A даражасини пасайтиради. Бу топилган ҳалқасимон молекулани янги терапия усулларининг клиник синовларида дориларнинг таъсирини баҳолаш учун потенциал биомаркерга айлантиради. Иш нейродегенерацияда РНК бузилишининг фундаментал механизмларини очиб беради.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Хулосалар ҳуayра моделлари ва инсоннинг ўлимдан кейинги тўқималарини таҳлил қилишга асосланган.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;TDP-43 ning yadroviy kamayishi amyotrofik lateral skleroz (ALS) va frontotemporal demensiya (FTD) ning belgilovchi patologik xususiyati bo‘lib, u RNK protsessingining keng ko‘lamli buzilishlariga, shu jumladan kriptik ekzonlarning shakllanishiga olib keladi. Ushbu ishda biz TDP-43 ni insonning turli neyronal hujayra modellarida halqali RNK (circRNA) biogenezining regulyatori sifatida aniqladik va uning disfunksiyasi de novo kriptik halqali RNKlar (ccircRNA) hosil bo‘lishini qo‘zg‘atishini ko‘rsatdik.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TDP-43 disfunksiyasi ALS va FTD patologiyasining markerlari bo‘lib xizmat qiluvchi o‘ziga xos kriptik halqali RNKlarning (ccircRNA) paydo bo‘lishiga olib keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;O‘limdan keyingi miya transkriptomik ma’lumotlarini tahlil qilish TDP-43 patologiyasiga ega ALS va FTD holatlari uchun xos bo‘lgan ccircRNA kichik to‘plamini aniqladi. Bundan tashqari, biz circRNA ni aniqlash uchun aylanma-halqali amplifikatsiyaga (rolling-circle amplification) asoslangan yuqori sezgir tahlil usullarini ishlab chiqdik, ular inson markaziy asab tizimi to‘qimalarida TDP-43 patologiyasini 0,99 AUC bilan farqlash imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AUC (ROC egri chizig‘i ostidagi maydon) — klassifikatsiya sifatining ko‘rsatkichi; 0,99 qiymati usulning kasal va sog‘lom namunalarni ajratishda deyarli mukammal aniqlikka ega ekanligini anglatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz c-circRNA lar chiziqli splaysingning kriptik hodisalari bilan bir vaqtda yuzaga kelishi mumkinligini aniqladik, bu RPTOR va EHMT1 kabi kasallik uchun muhim bo‘lgan oqsillarning yo‘qolishiga olib keladigan RNK protsessingi buzilishining murakkab «qaynoq nuqtalarini» ochib beradi. Shunisi e’tiborga loyiqki, ushbu c-circRNA lardan biri UNC13A genidan kelib chiqadi, uning kriptik ekzoni ilgari ALS/FTD bo‘yicha asosiy GWAS hitlaridan biri bilan bog‘langan va splaysingni modulyatsiya qiluvchi antisens oligonukleotidlar (ASO) orqali terapevtik nishon sifatida o‘rganilmoqda.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot o‘limdan keyingi to‘qimalar va hujayra modellariga asoslangan; klinik ahamiyatini tasdiqlash uchun tirik bemorlarda qo‘shimcha tadqiqotlar talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz c-circUNC13A chiziqli kriptik transkript bilan birgalikda tartibga solinishini va UNC13A kriptik ekzonini bostirish madaniyatdagi neyronlarda va in vivo sharoitda c-circUNC13A ning kamayishiga olib kelishini ko‘rsatdik, bu uning UNC13A ga yo‘naltirilgan yangi terapiya usullari uchun ta’sir samaradorligini baholovchi biomarker sifatidagi salohiyatini ta’kidlaydi. Umuman olganda, ushbu ish TDP-43 disfunksiyasining yangi molekulyar mexanizmini aniqlaydi, bu kasallik patogenezini tushunish va juda zarur bo‘lgan patologiya biomarkerlarini ishlab chiqish uchun yangi yo‘llarni ochadi.&lt;/p&gt;\n&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;TDP-43 oqsilining sitoplazmada to‘planishi va yadroda kamayishi amyotrofik lateral skleroz (ALS) hamda frontotemporal dementsiya (FTD) holatlarining taxminan 50% qismining muhim patomorfologik belgisi hisoblanadi. TDP-43 — bu mRNK protsessingining ko‘plab jihatlari, jumladan, splayzing va poliadenillanishda ishtirok etuvchi RNK-bog‘lovchi oqsil. Yadroda TDP-43 yo‘qolishi yangi splayzing va terminatsiya hodisalarining (kriptik hodisalar; CEs) shakllanishiga olib keladi. CEs'ning asosiy qismi nonsense-vositasidagi parchalanish (NMD) yoki transkriptning kaltalanishi orqali oqsil yo‘qolishiga olib keladi, ayrim hollarda esa kriptik poliadenillanish RNK barqarorligining oshishi hisobiga oqsil eksprestsiyasining kuchayishini keltirib chiqaradi. Kamroq hollarda CEs o‘qish ramkasida bo‘lib, muddatidan oldin to‘xtash kodonlarini o‘z ichiga olmaydi va kriptik peptidlar (CP) deb nomlanuvchi qo‘shimcha peptidlarning hosil bo‘lishiga sabab bo‘ladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kriptik hodisalar (CEs) — hujayra yadrosida TDP-43 oqsilining normal funksiyasi yo‘qolishi tufayli yuzaga keladigan g‘ayritabiiy RNK protsessingi variantlari.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kriptik RNK protsessingidagi o‘zgarishlar kasallik patogenezi va rivojlanishiga aloqador ekanligi ko‘rsatilgan bo‘lib, bitta CEs'ni tiklashga qaratilgan maqsadli terapiya vositalari hozirgi kunda klinik sinovlardan o‘tmoqda. CEs va CPs kasallik holatiga nisbatan o‘ta o‘ziga xos bo‘lishi mumkin va bemor to‘qimalarida TDP-43 disfunksiyasi darajasini aniqlash hamda miqdorini baholash uchun ishlatilgan. Bu o‘ziga xoslik biologik suyuqliklarda biomarkerlarni ishlab chiqish uchun ham salohiyatga ega. Biroq CEs biologik suyuqliklarda beqaror bo‘lib, ko‘pincha hujayra ichida parchalanib ketadi. CPs bosh miya-orqa miya suyuqligida va plazmada aniqlangan, ammo ularning odatda past miqdorda uchrashi mass-spektrometriya va antitelolarga asoslangan tahlillar yordamida aniqlanishini cheklashi mumkin, bu esa yanada o‘ziga xos va sezgir tahlil usullariga ehtiyoj borligini ko‘rsatadi. Natijada, TDP-43 disfunksiyasining to‘g‘ri ishlaydigan biomarkerlari sohada hal etilmagan muhim muammo bo‘lib qolmoqda.&lt;/p&gt;\n&lt;p&gt;Halqasimon RNKlar (circRNAs) kovalent yopiq halqa tuzilishi bilan tavsiflanadigan endogen RNKlarning bir sinfidir. Bunday molekulalar so‘nggi 10 yil ichida sekvenirlashga tayyorlash usullari va tahlildagi yutuqlar tufayli e'tiborni tortdi, ular evkariotlarda hamma joyda ekspressiya qilinishini va neyron to‘qimalarida boyiganligini ochib berdi. Shuningdek, halqasimon RNK darajalari Altsgeymer kasalligi kabi ko‘plab patologik holatlarda buzilishi haqida xabar berilgan. TDP-43 disfunksiyasi circRNA eksprestsiyasiga ta'sir qila oladimi yoki yo‘qmi, hali o‘rganilmagan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TDP-43 funksiyasining yo‘qolishi chiziqli analoglarga qaraganda barqarorroq va neyrodegenerativ kasalliklarning yuqori aniqlikdagi biomarkerlari bo‘lib xizmat qila oladigan yangi kriptik halqasimon RNKlarning (c-circRNAs) hosil bo‘lishiga olib keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz insonning kultivatsiya qilingan neyronlarida TDP-43 yo‘qolishi circRNAs'da keng ko‘lamli o‘zgarishlarga, shuningdek, yangi halqasimon RNKlar (kriptik circRNAs, c-circRNAs) hosil bo‘lishiga olib kelishini aniqladik. Ushbu c-circRNAs FTD va ALS'da TDP-43 patologiyasidan zararlangan kortikal va orqa miya sohalarida tanlab to‘planib, TDP-43 proteinopatiyalarini juda yuqori sezuvchanlik va o‘ziga xoslik bilan farqlaydi. Biz c-circRNAs aynan o‘sha genlar ichida boshqa CEs bilan birga paydo bo‘lishi mumkinligini, lekin ularning chiziqli analoglariga qaraganda barqarorroq va oson aniqlanishini aniqladik. Ushbu murakkab RNK noto‘g‘ri protsessingi hodisalari autofagiya kabi neyrodegeneratsiyada buzilgan biologik yo‘llarda asosiy rol o‘ynaydigan oqsillarning yo‘qolishiga olib kelishi mumkin, bunga RPTOR misol bo‘ladi. Nihoyat, biz UNC13A lokusida c-circRNA ni aniqladik, u yerda ALS kasalligining rivojlanishi bilan bog‘liq bo‘lgan va hozirgi kunda klinik sinovlarda nishonga olinayotgan kriptik ekzon ham aniqlanadi. Bizning ish shuni ko‘rsatadiki, UNC13A c-circRNA va kriptik ekzon birgalikda boshqariladi va kriptik ekzonni tuzatuvchi terapevtik ASO'lar c-circRNA'ni ham tiklaydi, bu uning splayzingni o‘zgartiruvchi yondashuvlar uchun nishon bilan bog‘lanish biomakeri sifatidagi salohiyatini tasdiqlaydi.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"tdp-43-yoqolishi-differensial-circrna-ekspressiyasini-induksiya-qiladi\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#tdp-43-yoqolishi-differensial-circrna-ekspressiyasini-induksiya-qiladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TDP-43 yo‘qolishi differensial circRNA ekspressiyasini induksiya qiladi&lt;/span&gt;&lt;/a&gt;TDP-43 yo‘qolishi differensial circRNA ekspressiyasini induksiya qiladi&lt;/h4&gt;\n&lt;p&gt;TDP-43 RNKni qayta ishlashning ko‘plab bosqichlarida ishtirok etadi va biz u circRNA darajalari va biogenezini ham boshqaradimi, degan savolni o‘rtaga tashladik. Biz to‘rtta neyronal TDP-43 nokdaun tajribasidan olingan total RNA-seq ma’lumotlarini tekshirdik: ikkitasi neyroblastoma hujayra liniyalarida (SH-SY5Y va SK-N-BE(2)) va ikkitasi hiPSCdan olingan neyronal modellarda, ya’ni quyi motor neyronlar (i3LMN) va kortikal neyronlarda (i3N) o‘tkazildi (Rasm S1A va S1B). CIRI2 vositasidan foydalanib, biz ko‘plab circRNA'larni aniqladik: SH-SY5Yda 4761, SK-N-BE(2)da 2204, i3LMNda 6939 va i3Nda 10097 (Rasm S1C), bunda 1552 tasi barcha 4 ta ma’lumotlar to‘plamida aniqlangan (Rasm S1D). Qisqa o‘qishli RNK sekvenlashda circRNA miqdorini aniqlash teskari splaysing tutashuvini (BSJ) aniqlashga tayanadi — bu circRNAga aniq bog‘liq bo‘lgan yagona hudud bo‘lib, an’anaviy RNA-seqdagi chiziqli RNKlar bilan solishtirganda circRNA aniqlash sezgirligini sezilarli darajada kamaytiradi. Natijada, turli ma’lumotlar to‘plamlarida aniqlangan sirkulyar turlarning ustma-ust tushishi chiziqli turlarnikiga qaraganda pastroqdir (Rasm S1D). Shunga qaramay, differensial ekspressiya tahlili circRNA'larda sezilarli o‘zgarishlarni aniqladi (Rasm 1A), jami 1118 ta alohida circRNA ko‘tarilgan (Rasm 1B) va 1152 tasi to‘rtta ma’lumotlar to‘plami bo‘ylab pasaygan (Rasm S1E).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd-f1.jpg\" alt=\"1-rasm — TDP-43 ning kamayishi bir nechta hujayra modellarida c-circRNAlar ekspresiyasini rag'batlantiradi: A) TDP-43 no\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm — TDP-43 ning kamayishi bir nechta hujayra modellarida c-circRNAlar ekspresiyasini rag'batlantiradi: A) TDP-43 nokdaunidan keyin to'rtta RNA-seq ma'lumotlar to'plamida (SH-SY5Y, SK-N-BE(2), i3LMN va i3N) aniqlangan barcha circRNAlar uchun log₂ karrali o'zgarishni (x o'qi) va −log₁₀ P qiymatini (y o'qi) ko'rsatuvchi vulqon diagrammalari. Invariant circRNAlar kulrang rangda, differensial ekspresiyalangan circRNAlar (gorizontal −log10 P qiymat chegarasidan yuqori nuqtalar) qizil rangda va kriptik circRNAlar to'q qizil rangda ko'rsatilgan. B) To'rtta TDP-43 nokdaun modelida (SH-SY5Y, SK-N-BE(2), i3LMN va i3N) aniqlangan yuqori ekspresiyalangan circRNAlarning ustma-ust tushishini ko'rsatuvchi UpSet grafigi. O'ng tomondagi gorizontal chiziqlar har bir modelda TDP-43 nokdaunidan keyin yuqori ekspresiyalangan circRNAlarning umumiy sonini bildiradi, vertikal chiziqlar esa har bir kesishmaning hajmini ifodalaydi. Ulangan nuqtalar har bir kesishmaga hissa qo'shadigan ma'lumotlar to'plamini bildiradi. Pastki panel yuqori ekspresiyalangan circRNAlar sonini ular aniqlangan modellar soniga ko'ra umumlashtiradi. To'rtta modeldan kamida ikkitasida yuqori ekspresiyalangan circRNAlar «Yuqori ishonchli circRNAlar» sifatida tasniflandi va keyingi tahlillar uchun saqlab qolindi. C) TDP-43 bilan bog'liq bo'lgan kriptik circRNAlarni aniqlash uchun ishlatiladigan filtrlash strategiyasini tasvirlovchi huni diagrammasi. 148 ta yuqori ishonchli circRNA orasida 76 tasi kriptik circRNA (c-circRNA) mezonlariga javob berdi. TDP-43 CLIP ma'lumotlar to'plami bilan integratsiya ularning yon atrofdagi intronlarida TDP-43 bog'lanish dalillariga ega bo'lgan 22 ta c-circRNA ni aniqladi. D) To'rtta TDP-43 nokdaun hujayra modelida (SH-SY5Y, SK-N-BE(2), i3LMN va i3N) yuqori ishonchli c-circRNAlarning Log2 Fold Change (Log2FC) qiymatlarini ko'rsatuvchi issiqlik xaritasi. c-circRNAlar ular aniqlangan ma'lumotlar to'plamlari soniga ko'ra guruhlangan (List 2/4, List 3/4 va List 4/4) va issiqlik xaritasi ustidagi gistogrammalarda ko'rsatilgandek, ma'lumotlar to'plamlari bo'yicha o'rtacha Log₂FC bo'yicha tartiblangan. Rang intensivligi TDP-43 kamayganidan keyin circRNA yuqori ekspresiyasining kattaligini ko'rsatadi. Qora chiziqlar CLIP ma'lumotlariga asoslanib yon atrofdagi intronlarida TDP-43 bog'lanish dalillariga ega bo'lgan c-circRNAlarni bildiradi, kulrang chiziqlar esa aniqlanadigan TDP-43 bog'lanishi yo'qligini ko'rsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TDP-43 yo‘qolishi circRNA ekspressiyasida sezilarli o‘zgarishlarga (1118 tasi ko‘tarilgan, 1152 tasi pasaygan) olib keladi, bu o‘zgarishlar transkripsiya emas, balki teskari splaysing samaradorligi bilan bog‘liq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;O‘zgarishlar pre-mRNK darajasidagi o‘zgarishlar tufayli yuzaga kelganmi yoki bevosita teskari splaysingdagi o‘zgarishlar bilan induksiya qilinganmi, buni tushunish uchun biz mos keluvchi chiziqli izoformalarning ekspressiyasini tekshirdik va circRNA'larni quyidagicha tasnifladik: «invariant» (agar mos keluvchi chiziqli izoforma sezilarli o‘zgarish ko‘rsatmasa), «konkordant» (agar ikkalasi ham bir yo‘nalishda o‘zgarsa) va «diskordant» (agar ular qarama-qarshi yo‘nalishda o‘zgarsa). Barcha liniyalar bo‘ylab circRNA'larning aksariyati (65–97%) «invariant» yoki «diskordant» toifalariga tushdi, bu circRNA o‘zgarishlari transkripsiyadagi o‘zgarishlar bilan belgilanmasligini ko‘rsatadi (Rasm S2A). TDP-43 nokdauni va nazorat sharoitlari o‘rtasidagi sirkulyar-chiziqli nisbatdagi (ΔCLR) o‘zgarishlar tahlili shuni ko‘rsatdiki, circRNA miqdoridagi o‘zgarishlar ΔCLR o‘zgarishlarini yaqindan aks ettiradi, bu esa differensial circRNA ekspressiyasi birinchi navbatda mezbon gen ekspressiyasidagi o‘zgarishlarni emas, balki o‘zgargan teskari splaysing samaradorligini aks ettirishini yanada mustahkamlaydi (Rasm S2B).&lt;/p&gt;\n&lt;p&gt;Biz circRNA ko‘tarilishi turli hujayra turlari bo‘ylab umumiy ekanligini baholadik va aniqlangan 1118 ta o‘zgargan circRNA'dan 970 tasi bitta hujayra liniyasiga xos ekanligini, qolganlari esa to‘rtta modelning kamida ikkitasida ko‘tarilganligini aniqladik (Rasm 1B). Ustma-ust tushish darajasining pastligi birinchi navbatda ularning boshqa hujayra modellarida aniqlanmaganligi bilan bog‘liq edi (Rasm S3A va S3B). Qo‘lyozma davomida biz kamida 2 ta ma’lumotlar to‘plamida o‘zgargan circRNA'larni «Yuqori ishonchlilikdagi circRNA'lar» (High-Confidence circRNAs) deb ataymiz (Rasm 1C).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;circRNA — bu teskari splaysing orqali hosil bo‘ladigan halqasimon RNK molekulalari bo‘lib, intronning 3'-uchi ekzonning 5'-uchi bilan birikadi, bu ularni degradatsiyaga chidamli qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Keyin biz TDP-43 teskari splaysingni bevosita RNK bog‘lanishi orqali boshqaradimi, degan savolni o‘rtaga tashladik va teskari splaysing ekzonlarini o‘rab turgan intronlarda TDP-43 bog‘lanish joylari mavjudligini tekshirdik, chunki ular sirkulyarizatsiyada muhim rol o‘ynashi ma’lum (Rasm S3C). Ommaga ochiq bo‘lgan TDP-43 CLIP-seq ma’lumotlaridan foydalanib (Rasm S3D), biz TDP-43 nokdaunidan keyin o‘zgarmaydigan circRNA'larning nazorat to‘plamiga nisbatan ko‘tarilgan circRNA'larning ikkita yon intronidan kamida bittasida TDP-43 bog‘lanishining sezilarli darajada boyiganligini kuzatdik (Rasm S3E va S3F). Shunisi e’tiborga loyiqki, boyish bir nechta hujayra modellarida ko‘tarilgan circRNA turlari uchun yanada yaqqolroq edi (Rasm S3F).&lt;/p&gt;\n&lt;h4 id=\"tdp-43-yoqolishi-kriptik-circrna-c-circrna-hosil-bolishiga-yordam-beradi\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#tdp-43-yoqolishi-kriptik-circrna-c-circrna-hosil-bolishiga-yordam-beradi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TDP-43 yo‘qolishi kriptik circRNA (c-circRNA) hosil bo‘lishiga yordam beradi&lt;/span&gt;&lt;/a&gt;TDP-43 yo‘qolishi kriptik circRNA (c-circRNA) hosil bo‘lishiga yordam beradi&lt;/h4&gt;\n&lt;p&gt;Ko‘tarilgan circRNA'lar orasida biz faqat TDP-43 nokdaunidan keyin aniqlangan va nazorat sharoitlarida yo‘q bo‘lgan kichik guruhni aniqladik. Bu TDP-43 disfunksiyasining ilgari tan olinmagan oqibatini ochib beradi: de novo sirkulyar RNKlar paydo bo‘lishi. Bu kriptik hodisalar ta’rifini aks ettirganligi sababli, biz ushbu sinfni «kriptik circRNA'lar» (c-circRNA) deb tasnifladik (Rasm 1A). Jami biz 543 ta c-circRNA'ni aniqladik (Rasm S3G), ulardan 76 tasi yuqori ishonchlilik guruhiga kiradi (Rasm 1C). Ushbu yuqori ishonchlilikdagi kriptik circRNA'lar Rasm 1Dda ko‘rsatilgan, ular har bir circRNA aniqlangan liniyalar soni va TDP-43 nokdaunidan keyin ularning induksiya darajasiga ko‘ra tartiblangan. Shunisi e’tiborga loyiqki, ushbu circRNA'larning 22 tasi bevosita TDP-43 bog‘lanishini namoyon etdi (Rasm 1C va 1D).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot hujayra liniyalari va hiPSC modellari asosida o‘tkazilgan; TDP-43 bog‘lanishi va circRNA hosil bo‘lishi o‘rtasidagi aniqlangan korrelyatsiyalar sabab-oqibat bog‘liqligini tasdiqlash uchun funksional tekshiruvni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"c-circrnas-specifically-associate-with-tdp-43-pathology-in-als-and-ftd-post-mortem-cns\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#c-circrnas-specifically-associate-with-tdp-43-pathology-in-als-and-ftd-post-mortem-cns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;c-circRNAs specifically associate with TDP-43 pathology in ALS and FTD post- mortem CNS&lt;/span&gt;&lt;/a&gt;c-circRNAs specifically associate with TDP-43 pathology in ALS and FTD post- mortem CNS&lt;/h4&gt;\n&lt;p&gt;O'limdan keyingi to'qimalarni yaxlit holda (bulk tissue) tahlil qilishda TDP-43 disfunksiyasi tufayli turlicha ekspressiya qilinadigan transkriptlarni aniqlash qiyin kechishi mumkin, chunki hujayralarning ozchilik qismigina TDP-43 ning yadroviy yo'qotilishini ko'rsatadi. Boshqa tomondan, kriptik hodisalarni aniqlash yanada ishonchli mezon hisoblanadi, chunki ular fiziologik sharoitda mavjud emas. Shuning uchun biz New York Genome Center (NYGC) BALS konsorsiumining RNA-seq ma'lumotlarida c-circRNAs mavjudligini o'rganib chiqdik. Ushbu guruh BALS va peshona-chakka demensiyasi (FDT) holatlarining o'limdan keyingi to'qimalaridan, shuningdek kasallikdan xoli nazorat guruhidan olingan markaziy asab tizimining (MAT) turli hududlarini o'z ichiga olib, jami 1,863 ta namunani tashkil etadi (S4A-rasm). Chalkashtiruvchi omillar ta'sirini minimallashtirish uchun biz patologik namunalar kutubxona chuqurligi, RNK yaxlitligi ko'rsatkichi (RIN), o'lim paytidagi yoshi yoki jinsi bo'yicha nazoratdan sezilarli darajada farq qilmasligiga ishonch hosil qildik (S4B–E-rasmlar).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Kriptik hodisalar — bu normal sharoitda yuzaga kelmaydigan, ammo TDP-43 kabi oqsillar faoliyati buzilganda paydo bo'ladigan g'ayritabiiy RNK Splaysting naqshlari.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz nazorat va ALS-TDP namunalarida ifodalangan halqasimon RNKs (circRNAs) miqdorini aniqlash uchun CIRI2 dan foydalandik va yarim milliondan ortiq circRNAs ni aniqladik (S5A va S5B-rasmlar). Nazoratga nisbatan ko'proq ALS-TDP namunalarida aniqlangan circRNAs ni topish uchun biz boyitish tahlilini o'tkazdik (S5C va S5D-rasmlar). Ushbu guruh ichida biz c-circRNAs ni nazorat namunalarining 5% dan kamrog'ida ifodalangan molekulalar sifatida belgiladik (S5C-rasm). Umuman olganda, biz 466 ta turli xil c-circRNAs ni aniqladik (S5E-rasm) va ular orasida 65 tasi nazorat namunalariga nisbatan ALS-TDP da kamida uch baravar boyitilganini ko'rsatdi (2A va S5F-rasmlar).&lt;/p&gt;\n&lt;p&gt;Shundan so'ng biz c-circRNAs miqdori TDP-43 disfunksiyasi darajasiga bog'liqligini tekshirib ko'rdik va TDP-43 yadroviy funksiyasini yo'qotish ko'lamini baholash uchun TDP-43 kriptik yuk ballidan [15] foydalandik. Biz namunalarni «past yuk» guruhiga (yuk balining eng past kvartili) va «yuqori yuk» guruhiga (yuk balining eng yuqori kvartili) tasnifladik (2B va S6A-rasmlar), guruhlar o'rtasida namunalarning teng hajmini ta'minladik va sekanerlash chuqurligida farqlar yo'qligini tasdiqladik (S6B-rasm). Aniqlangan c-circRNAs orasida past yuk guruhida bittasi ham boyitilmagan bo'lsa, yuqori yuk guruhida 15 tasi sezilarli darajada boyitilgan (2C-rasm), bu ularni TDP-43 patologiyasining yaxshi markerlari sifatida belgiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;1863 ta MAT namunasini tahlil qilish TDP-43 patologiyasining yuqori yuki guruhida sezilarli darajada boyigan 15 ta c-circRNAs ni aniqladi, bu ularning kasallik markerlari sifatidagi salohiyatini tasdiqlaydi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;TDP-43 ga sezgir bo'lgan 15 ta c-circRNAs orasida c-circUNC13A, c-circBCAR1 va c-circDIP2C bizning barcha hujayrali modellarimizda aniqlandi (2C-rasm) va o'zlarining yonma-yon intronlari ichida TDP-43 bilan bog'lanadi (S7A-rasm). Yana bir muhim nomzod c-circDSCAM bo'lib, u tahlil qilingan beshta to'qimaning beshtasida ham kriptik ifoda profilini ko'rsatadi (2A-rasm) va yuqori yuk guruhida eng ko'p boyitilgan circRNAs qatoriga kiradi (2C-rasm). Biz barcha to'rtta c-circRNAs nafaqat sog'lom nazorat bilan, balki TDP-43 bo'lmagan ALS shakllari (SOD1 yoki FUS mutatsiyalari bilan bog'liq) yoki FTD (TAU yoki FUS bilan bog'liq) ta'siriga uchragan shaxslar bilan solishtirilganda ham, TDP-43 patologiyasiga ega ALS va FTD namunalarida (ALS-TDP va FTD-TDP) o'ziga xos boyitishni ko'rsatishini tasdiqladik (2D va S7B-rasmlar). Muhimi, ushbu c-circRNAs ning hech biri ularning tegishli chiziqli izoformalarining ekspresiyasining sezilarli darajada oshishi bilan bog'liq emas (S7C-rasm). Modellarda ishonchli aniqlangani va kasallikka xosligiga asoslanib, biz ushbu to'rtta c-circRNAs ni o'limdan keyingi to'qimalarda maqsadli tasdiqlash uchun tanlab oldik.&lt;/p&gt;\n&lt;h4 id=\"c-circrnas-enable-sensitive-detection-of-tdp-43-pathology-in-tissue\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#c-circrnas-enable-sensitive-detection-of-tdp-43-pathology-in-tissue\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;c-circRNAs enable sensitive detection of TDP-43 pathology in tissue&lt;/span&gt;&lt;/a&gt;c-circRNAs enable sensitive detection of TDP-43 pathology in tissue&lt;/h4&gt;\n&lt;p&gt;O'limdan keyingi miya to'qimasini tahlil qilishdagi asosiy qiyinchilik shundaki, TDP-43 patologiyasini o'z ichiga olgan hujayralar faqat kichik ozchilikni tashkil qiladi. Darhaqiqat, hatto STMN2 kriptik ekzoni kabi yuqori darajada mavjud bo'lgan kriptik hodisalar ham ko'pincha bulk RNA-seq ma'lumotlar bazalarida aniqlanmaydi yoki faqat bir nechta o'qishlar bilan qo'llab-quvvatlanadi [30]. Ushbu cheklovni bartaraf etish uchun biz to'qimalarda c-circRNAs aniqlashni kuchaytirish maqsadida amplifikatsiya strategiyasi va maqsadli tahlillarni ishlab chiqdik. Biz samarali aylanma halqali teskari transkripsiya (RC-RT) amalga oshiradigan II guruh intron teskari transkriptazasi (RT) Induro dan foydalandik [31] (S8A-rasm), bu BSJ ning bir nechta nusxalariga ega bo'lgan uzun kDNT molekulalarini hosil qiladi va shu bilan circRNAs aniqlashni kuchaytiradi (S8B-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Tadqiqot insonning o'limdan keyingi to'qimalari va hujayrali modellarida bajarilgan; biomarkerlar ekspresiyasining patologiya bilan korrelyatsiyasi ilk bosqichlarda to'g'ridan-to'g'ri sabab-oqibat bog'liqligini har doim ham isbotlamaydi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Induro ni aylanma halqali amplifikatsiyani amalga oshira olmaydigan teskari transkriptaza bo'lgan SuperScript IV bilan to'g'ridan-to'g'ri taqqoslash chiziqli RNK matritsasi uchun taqqoslanadigan qPCR signallarini ko'rsatdi, holbuki Induro halqali RNK matrizasidan keladigan signalni 20 martadan ko'proqqa oshirdi (S8B va S8C-rasmlar), bu RC-RT faqatgina halqali RNKni tanlab kuchaytirishini, lekin chiziqli RNKni emasligini ko'rsatdi.&lt;/p&gt;\n&lt;p&gt;Biz sog'lom nazorat (n=21) va TDP-43 patologiyasi bo'lgan (GRN n=17, C9-FTD n=14, spora FTLD-TDP n=25) yoki bo'lmagan (FTD-FUS n=12) FTD-TDP bemorlarining peshona qobig'i RNKlarida RC-RT va undan keyin BSJ ga xos bo'lgan TaqMan tahlillarini qo'lladik. Barcha to'rtta tanlangan c-circRNAs FTD-FUS va sog'lom nazorat bilan solishtirganda FTD-TDP namunalarida sezilarli darajada yuqori signalni ko'rsatdi (2E-rasm). Muhimi, bu farq barcha FTD-TDP kenja turlarida aniqlandi (S8E-rasm).&lt;/p&gt;\n&lt;p&gt;Ushbu c-circRNAs ning FTD-TDP ni nazoratdan va FTD-TDP bo'lmagan holatlardan ajratib turish qobiliyatini baholash uchun biz ROC tahlillarini o'tkazdik. To'rtta c-circRNAs ning har biri kuchli ajratish qobiliyatini namoyish etdi (AUC 0.90–0.98), va birlashtirilgan model 0.99 AUC ga erishdi, bu esa yuqori bashorat qilish aniqligini ko'rsatadi va ularning TDP-43 oqsil kasalligi biomakerlari sifatidagi salohiyatini qo'llab-quvvatlaydi (2F-rasm).&lt;/p&gt;\n&lt;p&gt;matn&lt;/p&gt;\n&lt;h4 id=\"c-circunc13a-unc13a-kriptik-ekzoniga-qaraganda-barqarorroq\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#c-circunc13a-unc13a-kriptik-ekzoniga-qaraganda-barqarorroq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;c-circUNC13A UNC13A kriptik ekzoniga qaraganda barqarorroq&lt;/span&gt;&lt;/a&gt;c-circUNC13A UNC13A kriptik ekzoniga qaraganda barqarorroq&lt;/h4&gt;\n&lt;p&gt;C-circRNKlar orasida c-circUNC13A o'zining UNC13A CE va GWAS xavfli SNPlariga yaqinligi tufayli alohida qiziqish uyg'otadi, shuning uchun biz uning xususiyatlarini chuqur tahlil qildik. UNC13A bir nechta halqali izoformalarni ishlab chiqarsa-da, ularning ba'zilari TDP-43 kamayishi bilan ortadi (Rasm SN), faqat 21-30 ekzonlarni o'z ichiga olgan izoforma (ilgari \"c-circUNC13A\" deb atalgan) tahlil qilingan barcha ma'lumotlar to'plamida kriptiklik mezonlariga javob berdi (Rasm 4A va Rasm SN). Biz buni to'rtta hujayra liniyasida RT-qPCR yordamida tasdiqladik (Rasm 4B va Rasm SN) va chiziqli UNC13A CE dan farqli o'laroq, RNase R bilan ishlov berishga chidamliligini ko'rsatish orqali uning halqali tabiatini isbotladik (Rasm SN).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd-f4.jpg\" alt=\"4-rasm — c-circUNC13A in vitro va in vivo rejimida UNC13A CE bilan birgalikda boshqariladi: A) Nazorat (Control) va TDP-\" /&gt;&lt;/p&gt;\n&lt;p&gt;*4-rasm — c-circUNC13A in vitro va in vivo rejimida UNC13A CE bilan birgalikda boshqariladi: A) Nazorat (Control) va TDP-43 kamayishi (TDP-43 KD) sharoitida to'rtta hujayra modelida aniqlangan UNC13A circRNA izoformalarining schematik ko'rinishi. Ko'k yoylar ikkala sharoitda ham aniqlangan circRNA izoformalarini bildiradi, qizil yoylar esa faqat TDP-43 kamayganidan keyin aniqlangan circRNA izoformalarini bildiradi. Yoy qalinligi to'rtta ma'lumotlar to'plami bo'yicha o'rtacha circRNA ekspresiya darajasiga (CPM) proporsionaldir. B) Nazorat (CTRL) va TDP-43 nokdaun (TDP-43 KD) sharoitida ko'rsatilgan to'rtta hujayra modelida c-circUNC13A ekspresiyasining RT-qPCR tahlili. Transkript ko'pligi GAPDH mRNK ga normallashtirildi va nazorat sharti 1 qiymatiga sozlangan holda nisbiy ekspresiya qiymatlari (2^−ΔΔCt) sifatida taqdim etiladi. Har bir nuqta mustaqil biologik takroriyni bildiradi (n = 4). Statistik ahamlilik ikki tomonlama juftlashtirilmagan Stbyudent t-testi yordamida baholandi (***p &amp;lt; 0.001). C) PROTAC vositachiligidagi TDP-43 kamayishi va keyingi tiklanish davrida UNC13A kriptik ekzoni (CE) va c-circUNC13A miqdorining RT-qPCR tahlili. Chap panel: transkript ko'pligi PROTAC yordamida TDP-43 kamayishi induksiyasidan keyin ko'rsatilgan vaqt nuqtalarida o'lchandi. O'ng panel: 14 kunlik PROTAC bilan davolashdan so'ng, TDP-43 darajasini tiklash uchun hujayralar katalitik jihatdan nofaol raqobatchiga (PROTACi) o'tkazildi va transkript miqdori ko'rsatilgan tiklanish vaqt nuqtalarida o'lchandi. Ikkala panelda ham transkript ko'pligi GAPDH mRNK ga normallashtirildi va nisbiy ekspresiya qiymatlari (2^−ΔΔCt) sifatida taqdim etildi, PROTAC bilan davolashning oxirgi vaqt nuqtasi (72 soat) va PROTACi bilan davolashning boshlang'ich vaqt nuqtasi (0 soat) har biri 1 qiymatiga sozlangan. Ma'lumotlar uchta mustaqil biologik takroriylarning o'rtacha ± SD qiymatini bildiradi (n = 3). D) CRISPR/Cas9 vositachiligida UNC13A kriptik ekzonining (CE, yashil) o'chirilishining schematik ko'rinishi. ΔCE hujayra liniyasini yaratish uchun ishlatiladigan ikkita gid RNK (gRNA1 va gRNA2) pozitsiyalari ko'rsatilgan. E) Nazorat (CTRL) yoki TDP-43 nokdaun (KD) sharoitida yovvoyi turdagi (Wt) yoki UNC13A kriptik ekzoni o'chirilgan (ΔCE) foniga ega SH-SY5Y hujayralarida ko'rsatilgan nishonlarning RT-qPCR tahlili. Transkript ko'pligi GAPDH mRNK ga normallashtirildi va CTRL namunalariga nisbatan 1 qiymatiga sozlangan holda nisbiy ekspresiya qiymatlari (2^−ΔΔCt) sifatida taqdim etiladi. Har bir nuqta alohida namunani bildiradi (n = 4). Statistik ahamlilik ikki tomonlama juftlashtirilmagan Stbyudent t-testi yordamida baholandi (n.s. p &amp;gt; 0.05, **p &amp;lt; 0.01, ***p &amp;lt; 0.001). F) UNC13A kriptik ekzoniga (CE, yashil) qaratilgan yuqori samarali сплайсингni to'g'irlovchi antisens oligonukleotidning (ASO) ko'rinishi. ASO bog'lanish sayti qizil rangda ko'rsatilgan. G) TDP-43 kamaytirilgan hujayralarda ASO-1 ning ortib borayotgan konsentratsiyalarining c-circUNC13A ekspresiyasiga ta'sirini ko'rsatuvchi doza-javob egri chizig'i. c-circUNC13A darajalari 100% ga sozlangan TDP-43 nokdaun shartiga nisbatan taqdim etiladi. Alohida ma'lumot nuqtalari o'rtacha ± SD bilan ko'rsatilgan. Ma'lumotlar 4 parametrli log-logistik funksiya bilan moslashtirilgan. H) ASO-1 vositachiligidagi c-circUNC13A va UNC13A kriptik ekzon ekspresiyasining kamayishi o'rtasidagi korrelyatsiya. Ma'lumot nuqtalari ASO-1 konsentratsiyasiga ko'ra ranglangan. Kesishmalar faqat TDP-43 KD hujayralarida c-circUNC13A va UNC13A kriptik ekzon darajalarini ko'rsatadi (har bir o'q uchun o'rtacha ± SD). Uchburchaklar TDP-43 nokdauni bo'lmagan bazal sharoitlarni bildiradi, bunda na c-circUNC13A, na UNC13A kriptik ekzoni aniqlanmaydi. I) ASO-1 vositachiligidagi c-circUNC13A ekspresiyasining kamayishi va to'g'ri сплайisiling qilingan UNC13A transkriptining tiklanishi o'rtasidagi korrelyatsiya. Ma'lumot nuqtalari ASO-1 konsentratsiyasiga ko'ra ranglangan. Kulrang chiziqlar ASO bilan davolanmagan hujayralardagi o'rtacha ± SD ekspresiya darajalarini ko'rsatadi. J) c-circUNC13A darajalariga UNC13A kriptik ekzoniga qaratilgan ASO bilan davolash ta'sirini baholash uchun in vivo eksperimental dizaynning schematik ko'rinishi. Butun inson UNC13A ni eksпресия qiluvchi BAC transgen sichqonlari ASO ning intratseroventrikulyar (ICV) yuborilishini, shundan so'ng TDP-43 nokdaunini indutsiya qilish uchun miRNA ni ekspresiya qiluvchi AAV ning tomir ichiga yuborilishini qabul qildi. K) AAV vositachiligidagi TDP-43 nokdaunidan keyin, UNC13A kriptik ekzoniga qaratilgan ASO bilan davolangan yoki davolanmagan holda inson UNC13A BAC transgen sichqonlarining qobig'ida, miya poyasida, dumg'aza orqa miyada (SC) va bosh qism orqa miyada (SC) c-circUNC13A ekspresiyasining RT-qPCR tahlili. c-circUNC13A ekspresiyasi TBP mRNK ga normallashtirildi va 100% ga sozlangan TDP-43 nokdaun shartiga nisbatan foiz ekspresiya sifatida taqdim etiladi. Har bir nuqta alohida sichqonni bildiradi. Statistik ahamlilik ko'p testli taqqoslash uchun tuzatish bilan bir tomonlama Anova yordamida baholandi (n.s. p &amp;gt; 0.05, **&lt;em&gt;p &amp;lt; 0.001).&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;c-circUNC13A TDP-43 kamayganda hosil bo'ladigan eng barqaror izoforma bo'lib, TDP-43 tiklangandan 24 soat o'tgach o'z darajasining 80 foizini saqlab qoladi, UNC13A CE darajasi esa 40 foizgacha tushadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Keyin biz UNC13A CE va c-circRNK turlicha barqarorlikka egami degan savolni o'rtaga tashladik. Biz endogen TDP-43 PROTAC qo'shilishi orqali tezda degradatsiyaga uchrashi mumkin bo'lgan i3Ns liniyasidan foydalandik va TDP-43 kamayganidan keyin turli vaqt nuqtalarida UNC13A CE va c-circRNKni tekshirdik. UNC13A CE darajalari tez ko'tariladi va ishlov berilgandan 24 soat o'tgach platoga chiqadi. Aksincha, c-circUNC13A butun vaqt davomida sekinroq va progressiv o'sishni ko'rsatdi va 72 soat davomida to'planishda davom etdi (Rasm 4C, chap panel). Keyin biz PROTAC bilan 14 kunlik TDP-43 kamayishidan keyin TDP-43 darajalari tiklanganda UNC13A CE va c-circRNK qanday saqlanib qolishini solishtirdik — bunga PROTACni katalitik jihatdan nofaol raqobatchi (PROTACi) bilan almashtirish orqali erishildi. UNC13A CE darajalari tez pasayib, 24 soat ichida dastlabki miqdorining taxminan 40 foiziga yetdi, c-circUNC13A esa sezilarli darajada sekinroq parchalanish kinetikasini ko'rsatdi, bu uzoqroq yarim yemirilish davriga mos keladi: u bir xil vaqt nuqtasida dastlabki darajasining 80 foizini saqlab qoldi va keyinchalik asta-sekin kamaydi (Rasm 4C, o'ng panel). Ushbu topilmalar c-circUNC13A mos keladigan chiziqli kriptik transkriptga qaraganda ancha barqarorroq ekanligini ko'rsatadi.&lt;/p&gt;\n&lt;h4 id=\"c-circunc13a-va-unc13a-ce-birgalikda-tartibga-solinadi\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#c-circunc13a-va-unc13a-ce-birgalikda-tartibga-solinadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;c-circUNC13A va UNC13A CE birgalikda tartibga solinadi&lt;/span&gt;&lt;/a&gt;c-circUNC13A va UNC13A CE birgalikda tartibga solinadi&lt;/h4&gt;\n&lt;p&gt;UNC13A kriptik ekzonining qo'shilishini tuzatishga qaratilgan klinik sinovlar davom etmoqda. c-circUNC13A va UNC13A CE ikkalasi ham 20-21 ekzonlarning to'g'ri splicingiga funksional bo'lmagan muqobillar bo'lganligi sababli (Rasm SN), ular birgalikda tartibga solinadimi yoki UNC13A CEni bostirish c-circUNC13A ning ko'payishiga olib keladimi, buni tushunish juda muhimdir. Shuning uchun biz UNC13A CE hududi CRISPR/Cas9 vositasida genomni tahrirlash (ΔCE) orqali olib tashlangan SHSY-5Y hujayralarini tahlil qildik (Rasm 4D). Ilgari xabar qilinganidek, TDP-43 kamayganda ΔCE liniyasida UNC13A CE ishlab chiqarilmadi. Shuningdek, biz ΔCE liniyasida TDP-43 nokdauni paytida c-circUNC13A induksiyasi ham butunlay yo'q qilinganligini aniqladik, bu kriptik ekzonni ishlab chiqaruvchi hudud halqali izoformaning ekspressiyasi uchun zarur ekanligini ko'rsatadi (Rasm 4E). Hal qilinishi kerak bo'lgan muhim nuqta - ΔCE liniyasida c-circUNC13A ning bostirilishi 20-intron ketma-ketligining bir qismining o'chirilishi bilan bog'liqmi yoki bu UNC13A CE shakllanishining bostirilishiga bog'liqmi. Shuning uchun biz UNC13A CEni kamaytiradigan turli xil splicingni o'zgartiruvchi ASOlarning c-circUNC13A ga ta'sirini tekshirdik. Nomaqsadli ASOlar UNC13A CE va c-circUNC13A ga ta'sir ko'rsatmagan bo'lsa-da, UNC13A CE ASOlari circRNK darajasining 80 foizgacha kamayishiga olib keldi (Rasm SN). Keyin biz yuqori samarali ASOning turli dozalaridan foydalandik (Rasm 4F) va circRNKga doza-bog'liq pasayish effektini kuzatdik (Rasm 4G), bu ham UNC13A CE bilan ijobiy korrelyatsiyani ko'rsatdi (Rasm 4H). Muhimi, c-circUNC13A ham to'g'ri splicing qilingan UNC13A izoformasi bilan salbiy korrelyatsiyani ko'rsatdi (Rasm 4I), bu c-circUNC13A darajalarini UNC13A qutqaruvining potentsial ko'rsatkichi sifatida qo'llab-quvvatlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ASO (antisense oligonucleotides) — RNK bilan bog'lanib, uning tarjimasini bloklay oladigan yoki splicing jarayonini o'zgartira oladigan qisqa sintetik molekulalar.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Keyinchalik biz UNC13A kriptik ekzonining qo'shilishi va c-circUNC13A shakllanishining muvofiqlashtirilgan tartibga solinishi in vivo ham sodir bo'lishini tekshirdik. UNC13A CE kemiruvchilarda saqlanib qolmaganligi sababli, biz butun inson UNC13A lokusini ifodalovchi BAC transgen sichqonidan foydalandik (Rasm 4J). AAV orqali yetkazilgan Tardbp miRNA tomonidan TDP-43 nokdaunidan so'ng, c-circUNC13A RT-qPCR orqali markaziy asab tizimida osongina aniqlanadigan bo'ldi. UNC13A CE ga qaratilgan ASO ning intraserebroventrikulyar in'ektsiyasi c-circUNC13A shakllanishini bostirdi (Rasm 4K), bu UNC13A noto'g'ri splicingining terapevtik modulyatsiyasi in vivo c-circRNKning kamayishi bilan bog'liqligini ko'rsatadi.&lt;/p&gt;\n&lt;p&gt;Umuman olganda, ushbu natijalar shuni ko'rsatadiki, circUNC13A UNC13A CE ga qaraganda barqarorroq va aniqlanishi osonroq, bu ikki hodisaning biogenezi bog'liq va c-circUNC13A ning UNC13A CEni modulyatsiya qiluvchi terapiyalar uchun nishonni aniqlash biomarkeri sifatidagi potentsialini ta'kidlaydi.&lt;/p&gt;\n&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;p&gt;Biz c-circRNAlarni TDP-43 disfunksiyasining yangi oqibati sifatida aniqlaymiz. Biz yadroviy TDP-43 yo‘qolishi back-splicing (teskari splaysing) jarayonida keng ko‘lamli o‘zgarishlarni va fiziologik sharoitlarda mavjud bo‘lmagan de novo circRNAlarning shakllanishini keltirib chiqarishini ko‘rsatamiz. Ushbu c-circRNAlar TDP-43 patologiyasiga ega ALS va FTD holatlari bilan o‘ziga xos tarzda bog‘liq, o‘zlarining chiziqli kriptik hamkasblariga qaraganda yuqori barqarorlik va a’lo darajadagi aniqlanish qobiliyatini namoyish etadi hamda RNK noto‘g‘ri ishlanganligining ilgari e’tiborga olinmagan qatlamlarini ochib berishi mumkin. Nihoyat, biz c-circUNC13A kasallik bilan bog‘liq UNC13A CE bilan mexanistik jihatdan bog‘liqligini va UNC13A splaysingini to‘g‘rilashga qaratilgan yangi terapiyalar uchun nishonni aniqlash biomarkeri bo‘lib xizmat qilishi mumkinligini namoyish etamiz.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TDP-43 yo‘qolishi barqaror c-circRNAlarning hosil bo‘lishini ishga tushiradi, ular patologiyaning, xususan, UNC13A genidagi kritik splaysing hodisasi bilan bog‘liq bo‘lgan c-circUNC13A ning yuqori sezgir markerlari hisoblanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;TDP-43 uzoq vaqtdan beri kanonik splaysing repressori sifatida tan olingan bo‘lsa-da, bizning topilmalarimiz ushbu RNK-bog‘lovchi oqsilning circRNA biologiyasidagi qo‘shimcha rolini aniqlaydi. Fiziologik circRNAlar miqdorini tartibga solishdan tashqari, TDP-43 kriptik circRNAlar (c-circRNA) shakllanishini bostiruvchi vazifasini bajaradi. c-circRNAlarni o‘rab turgan intronlarda TDP-43 bog‘lanish joylarining boyitilishi TDP-43 ning ushbu lokuslarda g‘ayritabiiy back-splicingning oldini olishdagi bevosita rolini tasdiqlaydi. Garchi kriptik back-splicingni keltirib chiqaruvchi omillar hali aniqlanishi kerak bo‘lsa-da, TDP-43 olib tashlangandan so‘ng kuzatiladigan RNK protsessingidagi keng ko‘lamli nuqsonlar, shu jumladan kriptik splaysing va intronlarning saqlanib qolishi, uning kamayishi g‘ayritabiiy back-splicing uchun qulay muhit yaratishini ko‘rsatadi. Splaysing kinetikasidagi buzilishlar back-splicingga yordam berishi mumkin, bu odatda chiziqli splaysingga qaraganda kamroq samarali deb hisoblanadi, chunki u kanonik bo‘lmagan splaysing joylari juftlashishi mumkin bo‘lgan vaqt oynasini oshiradi. Back-splicing reaksiyasi circRNA hosil qiluvchi ekzonlarni o‘rab turgan ikkita intronni birlashtiradigan halqa shakllanishiga asoslanganligi sababli, ehtimollardan biri shundaki, TDP-43 bog‘lanishining yo‘qolishi molekulalararo RNK o‘zaro ta’sirlari uchun mavjud bo‘lgan intronik past murakkablikdagi ketma-ketliklarni ochib beradi va shu bilan sirkulyatsiyani rag‘batlantiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Back-splicing (teskari splaysing) — bu ekzonning 3'-uchini o‘sha yoki yuqoriroq ekzonning 5'-uchi bilan birlashtirish jarayoni bo‘lib, halqali RNK (circRNA) hosil bo‘lishiga olib keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;TDP-43 ga bog‘liq kriptik hodisalarning (CE) kashf etilishi TDP-43 funksiyasining yo‘qolishining o‘ziga xos molekulyar ko‘rsatkichlarini taqdim etish orqali ALS va FTD patogenezi haqidagi tushunchamizni yaxshiladi. Biroq, amalda bir qator to‘siqlar ularning biomarker sifatidagi foydaliligini cheklaydi. CE ni o‘z ichiga olgan ko‘plab transkriptlar nonsense-mediated decay (nonsens-vositali parchalanish) orqali tezda parchalanadi, parchalanishdan qochganlari esa ichki jihatdan beqaror bo‘lib qoladi va biologik suyuqliklarda parchalanishga ayniqsa zaifdir. Biz va boshqa tadqiqotchilar CE ning bir qismi qo‘shimcha in-frame peptid ketma-ketliklarini kodlashini va shuning uchun yangi oqsillarni keltirib chiqarishini aniqladik. Garchi kriptik peptidlarni tahlil qilishning hozirgi usullari istiqbolli bo‘lsa-da, ular hali ham klinik qo‘llash uchun sezgirlikni oshirishni talab qiladi. Boshqa tomondan, circRNAlar ularni biomarker nomzodlari sifatida ayniqsa jozibador qiladigan xususiyatlarga ega. Ularning kovalent yopiq tuzilishi ularga favqulodda barqarorlikni ta’minlaydi va ular hujayra RNKlarining faqat kichik bir qismini tashkil etishiga qaramay, circRNAlar ekzonukleazalarga chidamliligi tufayli biologik suyuqliklar va hujayradan tashqari vezikulalarda yuqori darajada boyitilgan. Bundan tashqari, ularning halqali tuzilishi rolling-circle (aylanma) teskari transkripsiya orqali signalni selektiv kuchaytirishga imkon beradi, bu esa to‘qimalarda past miqdori va tez parchalanishi tufayli ko‘pincha aniqlanmaydigan chiziqli kriptik transkriptlarga nisbatan texnik ustunlik beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot o‘limdan keyingi markaziy asab tizimi namunalari va hujayra modellariga asoslangan; c-circRNA va TDP-43 patologiyasi o‘rtasidagi korrelyatsiya tirik organizmda to‘g‘ridan-to‘g‘ri sabab-oqibat bog‘liqligini anglatmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;c-circRNAlarning potentsial biomarkerlar sifatida qo‘llanilishi biz aniqlagan yetakchi nomzodlar (c-circUNC13A, c-circBCAR1, c-circDIP2C va c-circDSCAM) bilan tasdiqlanadi. Ular o‘limdan keyin olingan ALS-TDP va FTD-TDP markaziy asab tizimi namunalarida sezilarli darajada boyitilgan va TDP-43 proteinopatiyalari hamda boshqa turdagi proteinopatiyalar o‘rtasida a’lo darajadagi farqlashni namoyish etgan. Maqsadli rolling-circle kuchaytirish yondashuvidan foydalangan holda, ushbu molekulalar kasallik guruhlarini deyarli to‘liq ajratishga erishdi, bunda birlashtirilgan model 0,99 AUC ga yetdi. Umuman olganda, ushbu topilmalar c-circRNAlarni TDP-43 disfunksiyasining yuqori sezgir va o‘ziga xos molekulyar izlari sifatida tasdiqlaydi va ularning TDP-43 proteinopatiyalari uchun biomarker sifatida ishlab chiqilishini qo‘llab-quvvatlaydi.&lt;/p&gt;\n&lt;p&gt;Kutilmagan kuzatuv shundan iborat bo‘ldiki, c-circRNAlar bir xil genlar ichida boshqa turdagi g‘ayritabiiy splaysing shakllari bilan tez-tez birga mavjud bo‘ladi. Yuqori ishonchlilikka ega c-circRNAlarning taxminan beshdan bir qismi qo‘shni kriptik yoki skiptik ekzonlar bilan bog‘liq bo‘lib, bu ba’zi transkriptlar TDP-43 kamayganidan keyin RNK noto‘g‘ri ishlanganligining bir nechta shakllariga ayniqsa zaif ekanligini ko‘rsatadi. Ilgari circRNA biogenezi kanonik bo‘lmagan splaysing hodisalari bilan bir vaqtda sodir bo‘lishi haqida xabar berilgan edi. Masalan, SFPQ splaysing faktorining kamayishi circRNA biogenezida keng ko‘lamli o‘zgarishlarga olib keladi, bu esa yuqoridagi intronlarning saqlanib qolishi va kriptik splaysing hodisalari bilan birga kechadi. Yaqinda HNRNPM ning kamayishi ham g‘ayritabiiy ekzon qo‘shilishini, ham circRNA biogenezini rag‘batlantirishi ko‘rsatildi, bu esa splaysing joyini tanlashning buzilishi back-splicing uchun qulay muhit yaratadi degan g‘oyani yanada qo‘llab-quvvatlaydi.&lt;/p&gt;\n&lt;p&gt;Kriptik ko'p tomonlama noto'g'ri protsessing hodisalarini namoyon qiluvchi genlar orasida biz UNC13A, RPTOR va EHMT1 genlarini aniqladik. Ushbu transkriptlarning barchasi aberrant splaysing jarayonlariga uchraydi, bu esa muddatidan oldin stop-kodonlar hosil bo'lishiga va NMD orqali transkriptlarning degradatsiyasiga olib keladi. UNC13A noto'g'ri splaysingining oqibatlari batafsil tavsiflangan bo'lsa-da, bizning ishimiz TDP-43 disfunksiyasi kriptik RNK protsessingi mexanizmlari orqali RPTOR va EHMT1 oqsillarining yo'qolishiga olib kelishini ko'rsatadigan birinchi dalildir. Muhimi, har ikkala oqsilning disfunksiyasi ilgari nevrologik kasalliklar bilan bog'langan. RPTOR mTORC1 kompleksining muhim komponenti bo'lib, uning kamayishi mTOR signalizatsiyasini buzadi, TFEB faollashuvini rag'batlantiradi va neyrodegeneratsiyaga aloqador bo'lgan autofagiya-lizosoma yo'llarini o'zgartiradi. Shuningdek, EHMT1 neyronal rivojlanish va sinaptik funksiya uchun zarur bo'lgan asosiy gistonmetiltransferaza hisoblanadi va EHMT1 gaployetishmovchiligi yoki mutatsiyasi aqliy zaiflik va kognitiv buzilishlar bilan tavsiflanuvchi og'ir neyrorivojlanish buzilishi — Kleefstra sindromini keltirib chiqaradi. Ushbu oqsillarning kamayishi TDP-43 neyrodegeneratsiyaga qo'shimcha patogen yo'llar orqali hissa qo'shishi mumkinligini ko'rsatadi, ularning ba'zilari asosiy kriptik transkriptlarning tezda degradatsiyaga uchrashi sababli yashirin qolmoqda.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kriptik splaysing — bu yetuk RNKga normada kesib tashlanadigan “yashirin” qismlarning (kriptik ekzonlarning) xato ravishda qo'shilib qolishidir. Bu ko'pincha muddatidan oldin stop-kodonlar hosil bo'lishiga va nuqsonli RNKlarni yo'q qiluvchi hujayra tizimi — NMD (nonsense-mediated decay) ishga tushishiga olib keladi, natijada muhim oqsillar darajasi pasayadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Muhimi, kasallikka aloqador oqsillar miqdorini kamaytiradigan aynan o'sha kriptik RNK protsessingi hodisalari, mos keladigan chiziqli transkriptlarning degradatsiyasiga qaramay, oson aniqlanadigan barqaror c-circRNKlarni ham hosil qiladi. Bu farq ularning subhujayraviy lokalizatsiyasida ham o'z aksini topadi. NMDga uchraydigan kriptik chiziqli transkriptlar (CE) asosan yadro ichida topilsa, c-circRNKlar sitoplazmada to'planadi, u yerda ular uzoqroq saqlanishi va hujayradan tashqari vezikulalarga (tarkibida circRNKlar ko'p bo'lishi ko'rsatilgan tuzilmalarga) kirishi ehtimoli yuqori bo'ladi. Ularning NMDga chidamliligi va aylanma halqa bo'ylab teskari transkripsiya (rolling-circle reverse transcription) orqali selektiv amplifikatsiyasi bilan birgalikda, ushbu xususiyatlar bemorlardan olingan namunalarda ularning yuqori darajada aniqlanishiga yordam beradi. Shuning uchun c-circRNKlar inson to'qimalarida aks holda dejali ko'rinmas bo'lib qoladigan kriptik splaysing hodisalarining barqaror molekulyar izlari bo'lib xizmat qilishi mumkin. Garchi hujayradan tashqari vezikulalar va biologik suyuqliklarda c-circRNKlarni baholash ushbu tadqiqot doirasidan tashqarida bo'lsa-da, bizning natijalarimiz ularning TDP-43 disfunksiyasining hujayradan tashqari vezikulalar bilan bog'liq biomarkerlari sifatidagi salohiyatini baholashga qaratilgan kelgusi tadqiqotlar uchun mustahkam asos va nomzod molekulalar to'plamini taqdim etadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kriptik halqasimon RNKlar (c-circRNK) tezda parchalanib ketadigan chiziqli transkriptlardan farqli o'laroq, sitoplazmada to'planadi va degradatsiyaga chidamli bo'ladi, bu esa ularni TDP-43 patologiyasining ishonchli biomarkerlariga aylantiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Aniqlangan c-circRNKlar orasida c-circUNC13A alohida holat hisoblanadi, chunki u ham ALS (yon amiotrofik skleroz), ham FTD (peshona-chakka demensiyasi) uchun eng kuchli genetik xavf lokuslaridan biridan kelib chiqadi va hozirgi vaqtda uning chiziqli analogi terapevtik aralashuv uchun nishon hisoblanadi. Bir nechta ortogonal dalillar liniyasi c-circUNC13A va kasallik bilan bog'liq UNC13A kriptik ekzoni mexanik ravishda bog'liqligini ko'rsatadi. Kriptik ekzon shakllanishi uchun mas'ul bo'lgan genomik sohaning deletsiyasi har ikkala transkriptning induksiyasini yo'q qildi, splaysingni o'zgartiruvchi antisense oligonukleotidlar esa har ikkala turni dozaga bog'liq ravishda bostirdi. Ushbu kuzatuvlar c-circUNC13A TDP-43 disfunksiyasining mustaqil qo'shimcha mahsuli emas, balki aynan o'sha patogen noto'g'ri splaysing hodisasining muvofiqlashtirilgan oqibati ekanligini ko'rsatadi.&lt;/p&gt;\n&lt;p&gt;c-circUNC13A uni nishon bilan bog'lanishning jozibador biomarkeri (target-engagement biomarker) qiladigan bir qancha xususiyatlarga ega. U mos keladigan chiziqli kriptik transkriptga qaraganda ancha barqaror, chunki u TDP-43 kamayganidan keyin progressiv ravishda to'planadi va TDP-43 funksiyasi tiklanganidan keyin ham uzoqroq saqlanib qoladi. Ushbu kinetik farqlar c-circUNC13A patologiyaning yanada mustahkam molekulyar izini ta'minlab, TDP-43 disfunksiyasining vaqt bo'yicha o'rtachalashtirilgan molekulyar ko'rsatkichi sifatida harakat qilishi mumkinligini ko'rsatadi. Bu splaysing faolligidagi vaqtinchalik tebranishlarni yumshatishi mumkin va shuning uchun davolash samarasini kuzatish uchun terapevtik sharoitlarda ayniqsa qimmatli bo'lishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Garchi c-circUNC13A in vitro sharoitida yuqori barqarorlikni ko'rsatgan bo'lsa-da, uning real klinik namunalarda (masalan, bemorlarning orqa miya suyuqligida) biomarker sifatida qo'llanilishi hali keng ko'lamli tadqiqotlarda tasdiqlanishi kerak.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Xulosa qilib aytganda, bizning natijalarimiz TDP-43-ga bog'liq RNK patologiyasi paradigmasini chiziqli noto'g'ri splaysing doirasidan tashqariga kengaytiradi va kriptik halqasimon RNKlarni yadroviy TDP-43 yo'qolishining ilgari tan olinmagan oqibatlari sifatida aniqlaydi. Kasallikka xoslikni, molekulyar barqarorlikni va yuqori aniqlanish darajasini birlashtirgan holda, ushbu molekulalar biomarkerlarning istiqbolli yangi sinfini ifodalaydi va TDP-43-ga bog'liq ALS va FTD patologiyasi asosida yotgan murakkab RNK protsessingi nuqsonlari haqida yangi tushunchalar beradi. Bundan tashqari, bizning ishimiz kelajakda hujayradan tashqari vezikulalar va boshqa biologik suyuqliklarda kriptik halqasimon RNKlarni ham TDP-43 patologiyasi biomarkerlari, ham terapevtik aralashuvning farmakodinamik ko'rsatkichlari sifatida baholashni qo'llab-quvvatlash uchun asos yaratadi.&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"inson-induksiyalangan-pluripotent-ozak-hujayralari-ipsc-madaniyati\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#inson-induksiyalangan-pluripotent-ozak-hujayralari-ipsc-madaniyati\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Inson induksiyalangan pluripotent o'zak hujayralari (iPSC) madaniyati:&lt;/span&gt;&lt;/a&gt;Inson induksiyalangan pluripotent o'zak hujayralari (iPSC) madaniyati:&lt;/h4&gt;\n&lt;p&gt;Ushbu tadqiqotda biz kortikal i3Neurons hosil qilish uchun inson neyrogenin-2 (NGN2) ni ortiqcha ekspressiya qilish uchun muhandislik qilingan WCT11 iPSC yoki i3-pastki motor neyronlarini (i3-LMNs) hosil qilish uchun inson transkripsiya omillari Islet-1 (ISL1), LIM Homeobox 3 (LHX3) va NGN2 ni ortiqcha ekspressiya qiluvchi hNIL konstruksiyasidan foydalandik. Ikkalasi ham doksisiklin bilan induksiyalanadigan promotor ostida, shuningdek, avval ta'riflanganidek, fermentativ jihatdan nofaol Cas9 (+/− CAGdCas9BFP-KRAB) uchun ekspressiya kassetasi bilan birga. Ushbu konstruksiyalar mos ravishda AAVS1 va CLYBL xavfsiz lokuslariga integratsiya qilindi. Halo-TDP liniyasining hosil bo'lishi boshqa joyda tasvirlangan. iPSC'lar Essential 8 Flex muhitida (Gibco, A2858501) har kuni oziqlantirilib, 37°C va 5% CO2 bo'lgan inkubatorda saqlandi. Hujayralar muntazam ravishda Versene (Gibco, 15040066) yordamida Geltrex bilan qoplangan (1:100; Gibco, A14133-01) to'qima madaniyati idishlarida o'tkazildi. STR profillash va mikoplazma kontaminatsiyasi testi davriy ravishda o'tkazildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;iPSC - bu kattalar hujayralarini embrional holatga yaqin holatga qayta dasturlash orqali olingan o'zak hujayralar bo'lib, ular neyronlar kabi har qanday to'qima turiga aylanishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ipsclarning-kortikal-neyronlarga-i3neurons-differensiatsiyasi-va-madaniyati\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#ipsclarning-kortikal-neyronlarga-i3neurons-differensiatsiyasi-va-madaniyati\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;iPSC'larning kortikal neyronlarga (i3Neurons) differensiatsiyasi va madaniyati:&lt;/span&gt;&lt;/a&gt;iPSC'larning kortikal neyronlarga (i3Neurons) differensiatsiyasi va madaniyati:&lt;/h4&gt;\n&lt;p&gt;Differensiatsiya jarayoni avval xabar qilinganidek amalga oshirildi. Neyron differensiatsiyasini boshlash uchun iPSC'lar Accutase (Gibco, A1110501) yordamida dissotsiatsiya qilindi va Geltrex bilan qoplangan (1:100; Gibco, A14133-01) to'qima madaniyati idishlariga induksiya muhitida qayta ekildi: DMEM/F-12 + GlutaMAX muhiti (Gibco, 31331028), 1x MEM Non-Essential Amino Acids (Gibco, 1140050), 2 mkg/ml doksisiklin hiklat (SigmaAldrich, D9891), 1x N2 qo'shimchasi (Gibco, 17502048), 2 mkM XAV939 (Cambridge Bioscience, SM38-10), 10 mkM SB431542 (Biotechne, 1614) va 100 nM LDN-193189 (Cambridge Bioscience, 19396-5mg-CAY). Ekish kunida muhitga 1x ROCK inhibitori Y-27632 digidroxlorid (Tocris, 1254/10) qo'shildi. Ushbu bosqichda induksiya muhiti har kuni o'zgartirildi. 3-kuni pre-neyron hujayralari RNK va oqsil ekstraktsiyasi uchun 50 mkg/ml Poli-D-Lizin (Gibco, A38904-01) va 10 mkg/ml Laminin (Gibco, 23017015) bilan qoplangan 12-quduqli idishlarga (har bir quduqqa 500 000 hujayra) qayta ekildi. Ular i3Neuron kortikal neyron madaniyati muhitida ekildi: BrainPhys neyron madaniyati muhiti (StemCell Technologies, 5790), 1x N21 Max (R&amp;amp;D System, AR008), 1x N2 Max (R&amp;amp;D System, AR009), 10 ng/ml BDNF (PeproTech, 450-02), 10 ng/ml GDNF (PeproTech, 450-10) va 1 mkg/ml Laminin (Gibco, 23017015) bilan to'ldirilgan. Yagona hujayra omon qolishini osonlashtirish uchun ekish kunida 1x ROCK inhibitori qo'shildi. Ekishdan 24 soat o'tgach, ROCK inhibitorini olib tashlash va CultureOne qo'shimchasini (antimitotik agent; 1:100; Gibco, A3320201) qo'shish uchun madaniyat muhiti to'liq almashtirildi. Hujayralar i3Neuron kortikal neyron madaniyati muhitida o'zgaruvchan vaqt davomida, CRISPRi vositasida TDP-43 kamayishi uchun 14-30 kun va PROTAC vositasida TDP-43 kamayishi uchun 28 kun (quyida qarang) saqlandi.&lt;/p&gt;\n&lt;h4 id=\"ipscdan-olingan-pastki-motor-neyronlarining-i3lmns-differensiatsiyasi\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#ipscdan-olingan-pastki-motor-neyronlarining-i3lmns-differensiatsiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;iPSC'dan olingan pastki motor neyronlarining (i3LMNs) differensiatsiyasi:&lt;/span&gt;&lt;/a&gt;iPSC'dan olingan pastki motor neyronlarining (i3LMNs) differensiatsiyasi:&lt;/h4&gt;\n&lt;p&gt;Inson iPSC'larining differensiatsiyasi avval xabar qilinganidek amalga oshirildi. Qisqacha aytganda, iPSC induksiyasi DMEM/F12, GlutaMAX qo'shimchasi muhiti (Thermo Fisher), MEM muhim bo'lmagan aminokislotalar (Thermo Fisher), N2 qo'shimchasi (Thermo Fisher), 0,2 mM E birikmasi, 2 mkg/ml doksisiklin, Pen/Strep va 1 mkg/ml Laminin o'z ichiga olgan induksiya muhiti yordamida amalga oshirildi. 48 soatlik induksiyadan so'ng, hujayralar Accutase tomonidan idishlardan ajratildi va 1x ROCK inhibitori va CultureOne qo'shimchasi bilan to'ldirilgan induksiya muhitida poli-D-lizin (PDL)/laminin bilan qoplangan to'qima madaniyati idishlariga qayta ekildi. 24 soatdan so'ng, induksiya muhiti Neurobasal (Gibco, 21103049), Glutamax qo'shimchasi muhiti (Thermo Fisher), MEM muhim bo'lmagan aminokislotalar (Thermo Fisher), N2 max qo'shimchasi (R&amp;amp;D Systems, AR009), N21 max qo'shimchasi (R&amp;amp;D Systems, AR008), CultureOne qo'shimchasi, 1 mkg/ml Laminin, 2 mkg/ml doksisiklin hiklat, 10 ng/mL BDNF (Peprotech) va 10 ng/ml GDNF (Peprotech) o'z ichiga olgan motor neyron muhiti bilan almashtirildi. Yarim muhit o'zgarishlari haftasiga ikki marta amalga oshirildi.&lt;/p&gt;\n&lt;h4 id=\"sh-sy5y-va-sk-n-be2-hujayralarida-tdp-43-nokdauni\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#sh-sy5y-va-sk-n-be2-hujayralarida-tdp-43-nokdauni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SH-SY5Y va SK-N-BE(2) hujayralarida TDP-43 nokdauni:&lt;/span&gt;&lt;/a&gt;SH-SY5Y va SK-N-BE(2) hujayralarida TDP-43 nokdauni:&lt;/h4&gt;\n&lt;p&gt;SH-SY5Y va SK-N-BE(2) hujayralari TDP-43 uchun doksisiklin bilan induksiyalanadigan shRNA kassetasini o'z ichiga olgan SmartVector lentivirusi (V3IHSHEG_6494503) bilan transduksiya qilindi. Transduksiya qilingan hujayralar bir hafta davomida puromitsin (1 mkg ml−1) bilan tanlab olindi. TDP-43 nokdaunli SH-SY5Y va SK-N-BE(2) hujayralari to'plami yagona hujayralar sifatida ekildi va klonal populyatsiyani olish uchun kengaytirildi. UNC13A kriptik ekzon delitsiyasiga ega (ΔCE liniyasi) SH-SY5Y hujayra liniyasining hosil bo'lishi Keuss 2024'da tasvirlangan. Hujayralar 10% FBS (Gibco) va 1% Penitsillin/Streptomitsin (Thermo Fisher) bilan to'ldirilgan Glutamax (Gibco) o'z ichiga olgan DMEM/F12'da o'stirildi. TARDBP'ga qarshi shRNA induksiyasi uchun hujayralar, agar boshqacha ko'rsatilmagan bo'lsa, 10 kun davomida ko'payib boruvchi doksisiklin hiklat (1000 ng/ml) (Sigma) miqdori bilan davolandi.&lt;/p&gt;\n&lt;h4 id=\"crispri-vositasida-tdp-43-nokdauni-inson-ipsclarida\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#crispri-vositasida-tdp-43-nokdauni-inson-ipsclarida\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CRISPRi vositasida TDP-43 nokdauni inson iPSC'larida:&lt;/span&gt;&lt;/a&gt;CRISPRi vositasida TDP-43 nokdauni inson iPSC'larida:&lt;/h4&gt;\n&lt;p&gt;Nokdaunga erishish uchun TARDBP/TDP-43 yoki nishonga olmagan nazorat sgRNA'lari lentiviral transduksiya yo'li bilan iPSC'larga yetkazildi. Virusni ishlab chiqarish uchun inson embrional buyrak (HEK) hujayralari sgRNA, qadoqlash (pCMVΔ8.91) va VSVG konvert (pMD.G) plazmidalari bilan Trans-IT 293 (Cambridge Bioscience, kat. № MIR2700) yordamida transfeksiya qilindi, so'ngra quyidagi muhitda 2–3 kun davomida kultivatsiya qilindi: 5% FBS (Sigma, kat. № TMS-013-B) qo'shilgan opti-MEM Reduced Serum + Glutamax (Thermo Fisher Scientific, kat. № 51985-026). Muhit filtratsiyasidan so'ng, virus Lenti-X konsentratori (Takara Bio, kat. № 631231) yordamida PBS'da 1:10 nisbatda konsentratsiyalandi, alikvotlarga bo'lindi va kelgusida foydalanish uchun −80 °C da saqlandi. sgRNA'lar pU6-sgRNA EF1Alpha-puro-T2A-BFP vektoriga (J. Weissman sovg'asi; Addgene 60955) klonlandi. sgRNA ketma-ketliklari quyidagicha edi: nishonsiz nazorat: GTCCACCCTTATCTAGGCTA, TARDBP: GGGAAGTCAGCCGTGAGACC (kuchli gid). Virus Accutase bilan ajratilgandan so'ng suspenziyadagi iPS hujayralariga yetkazildi. 24 soatdan keyin hujayralar PBS bilan yuvildi va yangi E8 muhiti qo'shildi. Lentiviral yetkazib berishdan ikki kun o'tgach, hujayralar 48 soat davomida Puromycin (10 mkg/ml) bilan seleksiya qilindi. Keyin iPSC'lar neyronal differensiatsiyani boshlashdan oldin 1–2 kun davomida ko'paytirildi. Nokdaun samaradorligi qPCR va western blotting orqali tekshiriladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPRi (CRISPR interferensiyasi) — bu DNK ketma-ketligini o'zgartirmasdan, transkripsiyani bloklash uchun «noaktiv» Cas9 oqsilidan foydalangan holda gen ekspressiyasini bostirish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"protac-vositasida-tdp-43-degradatsiyasi-va-tiklanishi\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#protac-vositasida-tdp-43-degradatsiyasi-va-tiklanishi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PROTAC vositasida TDP-43 degradatsiyasi va tiklanishi:&lt;/span&gt;&lt;/a&gt;PROTAC vositasida TDP-43 degradatsiyasi va tiklanishi:&lt;/h4&gt;\n&lt;p&gt;Ushbu tajriba uchun 500 ming i3 HALO-TDP neyronlari avval 50 mkg/ml Poly-D-Lysine (Gibco, A38904-01) va 10 mkg/ml Laminin (Gibco, 23017015) bilan qoplangan 12 o'rali planshetlarga ekildi. Neyronlar i3Neuron kortikal neyron kultura muhitida saqlandi: BrainPhys neyron kultura muhiti (StemCell Technologies, 5790), 1x N21 Max (R&amp;amp;D System, AR008), 1x N2 Max (R&amp;amp;D System, AR009), 10 ng/ml BDNF (PeproTech, 450-02), 10 ng/ml GDNF (PeproTech, 450-10) va 1 mkg/ml Laminin (Gibco, 23017015) bilan to'ldirilgan, haftasiga ikki marta muhitning yarmi almashtirildi. TDP-43 nokdaunini induksiya qilish uchun Halo PROTAC-E 300 nM (Division of Signal Transduction Therapy DSTT) DIV14 dan boshlab har bir muhit almashinuvida kulturalarga qo'shildi. Nokdaundan keyin TDP43 oqsil ekspressiyasini tiklash uchun neyronlar DIV28 da yig'ib olishdan oldin belgilangan vaqtlarda Halo PROTAC-E noaktiv epimeri 300 nM (DSTT) bilan ishlov berildi.&lt;/p&gt;\n&lt;h4 id=\"ipscni-saqlash-va-differensiatsiyasi-aso-bilan-davolash-uchun\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#ipscni-saqlash-va-differensiatsiyasi-aso-bilan-davolash-uchun\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;iPSC'ni saqlash va differensiatsiyasi (ASO bilan davolash uchun):&lt;/span&gt;&lt;/a&gt;iPSC'ni saqlash va differensiatsiyasi (ASO bilan davolash uchun):&lt;/h4&gt;\n&lt;p&gt;GM25256 inson iPSC liniyasi (Coriell Institute) Matrigel (Stemcell Technologies, Corning) ustida mTeSR1 muhitida (StemCell Technologies) saqlandi. Inson iPSC'lari har kuni oziqlantirildi va ishlab chiqaruvchining ko'rsatmalariga muvofiq ReLeSR (StemCell Technologies) yordamida har 4-5 kunda bo'lindi. iPSC'larning motor neyronlarga differensiatsiyasi 14 kun davomida 3D rivojlanish yo'llari yordamida amalga oshirildi. 14-kuni neyronal sferoidlar ajratildi va Poly-D-Lysine/Laminin bilan qoplangan 96 o'rali planshetlarga (Phenoplate, Revvity) ekildi va neyrotrofik omillarni (BDNF, GDNF va CNTF; R&amp;amp;D Systems) o'z ichiga olgan Neurobasal muhitida (Thermo Fisher) saqlandi. Hujayralar tsiklik progenitorlarni olib tashlash uchun ekilgandan 4 kun o'tgach 5-Fluorouracil bilan ishlov berildi. Kalamush astrositlari (Stem Cell Technologies) ekilgandan 8-17 kun o'tgach motor neyron kulturalariga bir marta qo'shildi.&lt;/p&gt;\n&lt;h4 id=\"aso-tayyorlash\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#aso-tayyorlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ASO tayyorlash:&lt;/span&gt;&lt;/a&gt;ASO tayyorlash:&lt;/h4&gt;\n&lt;p&gt;100 mkg/mkl saqlash uchun asosiy eritmani tayyorlash uchun liofilizatsiyalangan ASO (TDP-43 gapmer yoki UNC13A splaysing korrektorlari) tegishli miqdordagi steril PBS, pH 7,4 da qayta eritildi. To'liq erigandan so'ng, ASO spin-kolonka (0,22 mkm) yordamida sterilizatsiya qilindi. ASO'ning 100 mkg/mkl saqlash eritmasi alikvotlarga bo'lindi va kelgusida foydalanish uchun –20°C da saqlandi. Neyronlarni dozalash uchun ~500 mkm ishchi eritmalarni tayyorlash uchun 100 mkg/mkl saqlash eritmasi steril PBS, pH 7,4 bilan tegishli darajada suyultirildi va spin-kolonka (0,22 mkm) yordamida sterilizatsiya qilindi. ASO ishchi eritmasining konsentratsiyasini aniqlash uchun 260 nm dagi absorbans NanoDrop One (ThermoFisher Scientific) da o'lchandi va konsentratsiyalar ushbu ASO uchun molekulyar ekstinksiya koeffitsienti yordamida hisoblandi. ASO ishchi eritmasi alikvotlarga bo'lindi va –20°C da saqlandi. Ishchi eritmalarni tegishli doza darajalariga suyultirish tegishli miqdordagi steril PBS, pH 7,4 bilan amalga oshirildi.&lt;/p&gt;\n&lt;h4 id=\"hujayralarda-tdp-43-kd-va-antisens-oligonukleotid-aso-bilan-davolash\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#hujayralarda-tdp-43-kd-va-antisens-oligonukleotid-aso-bilan-davolash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hujayralarda TDP-43 KD va antisens oligonukleotid (ASO) bilan davolash:&lt;/span&gt;&lt;/a&gt;Hujayralarda TDP-43 KD va antisens oligonukleotid (ASO) bilan davolash:&lt;/h4&gt;\n&lt;p&gt;Neyronlar ekilgandan keyin 19-21-kuni, TDP-43 gapmer (2 mkm) yoki ekvivalent hajmdagi PBS (NT) TDP-43'ni nokdaun (KD) qilish uchun gimnotik (erkin) qabul qilish yo'li bilan hujayralarga bir marta qo'shildi. Neyronlar ekilgandan keyin 22-27-kuni, splaysingni to'g'rilovchi ASO'lar yoki nazorat ASO (nusinersen ketma-ketligi) gimnotik qabul qilish yo'li bilan hujayralarga bir marta qo'shildi. TDP-43 gapmer (2 mkm da) yoki ekvivalent PBS nazorati keyinchalik KD darajalarini barqaror saqlash uchun keyingi 3 hafta davomida haftasiga bir marta gimnotik qabul qilish yo'li bilan hujayralarga qo'shildi. Ekilgan vaqtdan boshlab kulturada kamida 40 kun o'tgach, motor neyronlar RT-qPCR orqali RNK transkript darajalarini baholash uchun qayta ishlandi.&lt;/p&gt;\n&lt;p&gt;RT-qPCR TaqMan Fast Advanced Cells-to-CT to'plami (Thermo Fisher Scientific) yordamida ishlab chiqaruvchining ko'rsatmalariga muvofiq amalga oshirildi. Barcha tahlillar Thermo Fisher Scientific'dan sotib olindi. To'g'ri splayslangan UNC13A mRNK'sining foiz ekspressiyasi ∆∆CT usuli yordamida hisoblandi va nazorat (NT) bilan ishlov berilgan hujayralarga normallashtirildi. UNC13A kriptik ekzon mRNK'si va c-circUNC13A'ning foiz ekspressiyasi ∆∆CT usuli yordamida hisoblandi va faqat TDP-43 KD qilingan hujayralarga normallashtirildi. UNC13A kriptik ekzoni va c-circUNC13A uchun aniqlanmagan CT qiymatlari (masalan, nazorat namunalarida) 0% ekspressiyaga aylantirildi. Barcha tahlillar R dasturida bajarildi. Barcha ketma-ketliklar, agar boshqacha ko'rsatilmagan bo'lsa, to'liq 2’MOE modifikatsiyalangan asoslar va PS bog'lanishlaridan iborat, ya'ni gapmer ham DNK asoslarini o'z ichiga oladi.&lt;/p&gt;\n&lt;h4 id=\"human-unc13a-bac-transgen-sichqonlari\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#human-unc13a-bac-transgen-sichqonlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Human UNC13A BAC transgen sichqonlari:&lt;/span&gt;&lt;/a&gt;Human UNC13A BAC transgen sichqonlari:&lt;/h4&gt;\n&lt;p&gt;hUNC13A BAC Tg sichqonlari Taconic Biosciences (Germantown, NY) kompaniyasida sichqon embrioniga inson UNC13A (hUNC13A) genini olib yuruvchi BAC-subklonni pronuklear inyeksiya qilish yo‘li bilan yaratilgan. Potensial asoschi liniyalar neyron-spesifik hUNC13A ekspressiyasi uchun tekshirilgan va koloniyani tashkil etish uchun bitta asoschi liniyadan foydalanilgan. Transgenni xaritalash ushbu sichqonlarda hUNC13A genining ikkita tandem nusxasi mavjudligini va integratsiya hech qanday ma’lum oqsil kodlovchi gen ichida sodir bo‘lmaganligini aniqladi. E’tibor bering, sichqonning endogen Unc13a (Munc13-1) genining har ikkala nusxasi ham ushbu sichqonlarda saqlanib qolgan. Sichqonlar hUNC13A alleli bo‘yicha geterozigotali koloniya sifatida saqlangan. Ushbu sichqon liniyasi uchun hech qanday g‘ayritabiiy fenotiplar hujjatlashtirilmagan. Ushbu tadqiqotlar uchun tajriba boshida 8-12 haftalik urg‘ochi hUNC13A sichqonlari ishlatilgan.&lt;/p&gt;\n&lt;h4 id=\"antisens-oligonukleotidlarni-intraserebroventrikulyar-yuborish\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#antisens-oligonukleotidlarni-intraserebroventrikulyar-yuborish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Antisens oligonukleotidlarni intraserebroventrikulyar yuborish:&lt;/span&gt;&lt;/a&gt;Antisens oligonukleotidlarni intraserebroventrikulyar yuborish:&lt;/h4&gt;\n&lt;p&gt;ICV inyeksiyalari uchun kattalar sichqonlariga operatsiyadan oldingi og‘riqsizlantiruvchi vosita yuborilgan va doimiy izofluran anesteziyasi ostida stereotaksik ramkaga joylashtirilgan. Ularning quloqlari quloq tayoqchalari va burun konusi yordamida mahkamlangan, shundan so‘ng jun olib tashlangan va teri dezinfeksiya qilingan. Keyin bosh suyagining yuqori qismi bo‘ylab o‘rta kesma qilingan va bregma hamda lyambda suyak choklari tutashgan joylarni ochish uchun teri orqaga tortilgan. Bosh s
