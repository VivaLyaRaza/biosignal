uyagi bregma va lyambdani tekislash orqali tekislangan va inyeksiya joyi aniqlangan (-0,5 old-orqa, +1,0 medial-lateral). Stereotaksik qo‘l yordamida steril parma yordamida inyeksiya joyi ustida kichik teshik ochilgan. 100 mkl Hamilton mikrospritsi kraniotomiya joyi orqali shunday tushirilganki, igna uchi miya yuzasidan -1,75 mm dorsal-ventral pastda bo‘lgan. 30 mg/mL ASO 6 yoki aCSF eritmasidan o‘n mikrolitr avtomatlashtirilgan UMP3 UltraMicroPump yordamida yuborilgan. Igna 3 daqiqa davomida joyida qoldirilgan va keyin chiqarib olingan, bosh terisidagi kesma esa tikilgan. Sichqonlarga isitiladigan tiklanish katagida anesteziyadan chiqishga ruxsat berilgan va keyin o‘z katagiga qaytarilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ICV-inyeksiya (intraserebroventrikulyar) — moddalarni to‘g‘ridan-to‘g‘ri miya qorinchalariga yuborish usuli bo‘lib, u gematoensefalik to‘siqni chetlab o‘tish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"raav-vositasida-tardbp-nokdauni\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#raav-vositasida-tardbp-nokdauni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;rAAV vositasida Tardbp nokdauni:&lt;/span&gt;&lt;/a&gt;rAAV vositasida Tardbp nokdauni:&lt;/h4&gt;\n&lt;p&gt;hUNC13A BAC Tg sichqonlariga ICV operatsiyasidan 1 hafta o‘tgach, lateral dum venasiga Tardbp ga yo‘naltirilgan miRNA ketma-ketligini o‘z ichiga olgan jami 100-200 mkl hajmdagi rAAV yuborilgan. rAAV Packgene Biotech, Inc. (Houston, TX) tomonidan qadoqlangan, vektor titrlari Trace Neuroscience kompaniyasida yuklamaga xos praymer/zond to‘plamlari yordamida aniqlangan. Hayvonlarga rAAV sichqon tana vazniga nisbatan vektor genomlari asosida yuborilgan. Ushbu rAAV tomir ichiga yuborish bilan keng neyronal transduksiyani ta’minlash uchun PHP.eB kapsidi va hUNC13A BAC sichqonlarining C57BL/6 fonidan foydalanadi.&lt;/p&gt;\n&lt;h4 id=\"sichqon-toqimalarini-yigish-va-rt-qpcr\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#sichqon-toqimalarini-yigish-va-rt-qpcr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sichqon to‘qimalarini yig‘ish va RT-qPCR:&lt;/span&gt;&lt;/a&gt;Sichqon to‘qimalarini yig‘ish va RT-qPCR:&lt;/h4&gt;\n&lt;p&gt;Sichqonlar ICV operatsiyasidan 4 hafta o‘tgach (rAAV yuborilgandan 3 hafta o‘tgach) izofluran bilan anesteziya va dekapitatsiya yo‘li bilan o‘ldirilgan. Bosh va orqa miya to‘qimalari yig‘ib olingan, yumshoq to‘qimalarni gomogenizatsiya qiluvchi naychalarga (Bertin, P000912-LYSK0-A yoki P000933-LYSK0-A) joylashtirilgan, tortilgan va suyuq azotda muzlatilgan. To‘qimalar MagMax mirVana Total RNA Isolation Kit (Thermo Fisher Scientific) dan olingan lizis buferida Precellys Evolution Touch gomogenizatorida (Bertin Technologies) gomogenizatsiya qilingan. RNK MagMax mirVana Total RNA Isolation Kit (Thermo Fisher Scientific) yordamida KingFisher Apex asbobi (Thermo Fisher Scientific) yordamida ajratib olingan. RNK Qubit Fluorometer (Thermo Fisher Scientific) orqali miqdoriy aniqlangan va har bir sichqon uchun har bir to‘qimaga bir xil miqdordagi RNK SuperScript IV VILO Master Mix (Thermo Fisher Scientific) yordamida cDNA ga teskari transkripsiya qilingan. Taqman qPCR ishlab chiqaruvchining ko‘rsatmalariga muvofiq TaqMan Fast Advanced Master Mix (Thermo Fisher Scientific) yordamida quyidagi multipleks tahlillar yordamida amalga oshirilgan: c-circUNC13A va Hprt1 uy xo‘jaligi geni sifatida. Ikkala tahlil ham Thermo Fisher Scientific kompaniyasidan sotib olingan. c-circUNC13A ning foiz ekspressiyasi Hprt1 ga normallashtirish va TDP-43 KD/aCSF ICV davolash shartlariga normallashtirish bilan ∆∆CT usuli yordamida hisoblangan.&lt;/p&gt;\n&lt;h4 id=\"rnkni-ajratish-va-tahlil-qilish\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#rnkni-ajratish-va-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RNKni ajratish va tahlil qilish:&lt;/span&gt;&lt;/a&gt;RNKni ajratish va tahlil qilish:&lt;/h4&gt;\n&lt;p&gt;RNKni ajratish RNeasy® mini kit (Qiagen) yoki Direct-zol RNA Miniprep (Zymo research) yordamida ishlab chiqaruvchining protokoliga muvofiq, ixtiyoriy on-column DNase I hazm qilish bosqichi bilan amalga oshirilgan. RNK konsentratsiyalari NanoDrop One (ThermoFisher Scientific) tomonidan o‘lchangan va agar boshqacha ko‘rsatilmagan bo‘lsa, teskari transkripsiya uchun teng miqdorlar ishlatilgan. Teskari transkripsiya RevertAid cDNA synthesis kit (ThermoFisher Scientific), Superscript IV (ThermoFisher Scientific) yoki Induro (NEB) yordamida amalga oshirilgan. RevertAid va Superscript IV uchun reaksiya ishlab chiqaruvchining protokoliga muvofiq amalga oshirilgan. Induro uchun RNK denaturatsiyasi va praymerni yopishtirish 12 mkl hajmda 1 mkl 100 mкM tasodifiy geksamerlar bilan 65°C da 5 daqiqa davomida inkubatsiya qilish, so‘ngra muz ustida 2 daqiqa davomida sovutish orqali amalga oshirilgan. 4 mkl 5 X Induro RT Reaction Buffer (NEB), 2 mkl MgCl2 30 mM (Sigma-Aldrich), 1 mkl 10 mM dNTPs (ThermoFisher Scientific), 1 mkl RiboLock RNase Inhibitor 20U/mkl (ThermoFisher Scientific) va 200 U Induro RT (NEB) o‘z ichiga olgan aralashma qo‘shilgan va reaksiya 23°C da daqiqa, 30°C da 5 daqiqa va 55°C da 1 soat davomida inkubatsiya qilingan, so‘ngra 95°C da 1 daqiqa davomida issiqlik bilan inaktivatsiya qilingan. RT-qPCR tahlillari PowerUp SYBR Green Master Mix reagent (ThermoFisher Scientific) yoki TaqMan™ Multiplex Master Mix (ThermoFisher Scientific) yordamida amalga oshirilgan. DNK amplifikatsiyasi QuantStudio 5 Real-Time PCR tizimida (Applied Biosystems) ΔΔCt usuli yordamida kuzatilgan. Nisbiy RNK miqdori 1 deb belgilangan eksperimental nazorat namunasiga nisbatan fold change (2−ΔΔCt) sifatida hisoblangan va agar boshqacha ko‘rsatilmagan bo‘lsa, uy xo‘jaligi geniga (GAPDH mRNA yoki TDP mRNA) normallashtirilgan.&lt;/p&gt;\n&lt;h4 id=\"qabul-qiluvchining-ishchi-xarakteristikasi-roc-tahlili\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#qabul-qiluvchining-ishchi-xarakteristikasi-roc-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qabul qiluvchining ishchi xarakteristikasi (ROC) tahlili:&lt;/span&gt;&lt;/a&gt;Qabul qiluvchining ishchi xarakteristikasi (ROC) tahlili:&lt;/h4&gt;\n&lt;p&gt;Qabul qiluvchining ishchi xarakteristikasi (ROC) egri chizig'i tahlillari GAPDH nazorat geniga normallashtirilgan Ct qiymatlaridan (ΔCt) iborat bo'lgan miqdoriy PCR ma'lumotlari ustida bajarildi, ular tahlildan oldin log10-transformatsiya qilindi. Har bir alohida circRNA uchun ROC egri chiziqlari FTD-TDP holatlari va birlashtirilgan nazorat guruhi (CTRL va FTD-non-TDP) o'rtasidagi log10-transformatsiya qilingan normallashtirilgan ifoda qiymatlarini solishtirish orqali yaratildi. ROC egri chizig'i ostidagi maydon (AUC) va uning 95% ishonch oralig'i (CI) standart parametrlarga ega R paketi pROC yordamida hisoblab chiqildi, bunda CI DeLong usuli yordamida baholandi. Birlashtirilgan klassifikator barcha circRNA markerlarini bashoratchilar sifatida va FTD-TDP holatini ikkilik natija sifatida o'z ichiga olgan ko'p o'zgaruvchan logistik regressiya modelini moslashtirish orqali yaratildi. Logistik regressiya modelidan olingan bashorat qilingan ehtimolliklar keyinchalik ROC egri chizig'ini yaratish va birlashtirilgan klassifikator uchun mos keladigan AUCni hisoblash uchun ishlatildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AUC (egri chiziq ostidagi maydon) klassifikator sifatini ko'rsatadi: 0,5 qiymati tasodifiy taxminni, 1,0 esa guruhlarni mukammal ajratishni anglatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"induro-va-superscript-iv-faoliyatini-solishtirish\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#induro-va-superscript-iv-faoliyatini-solishtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Induro va Superscript IV faoliyatini solishtirish:&lt;/span&gt;&lt;/a&gt;Induro va Superscript IV faoliyatini solishtirish:&lt;/h4&gt;\n&lt;p&gt;Superscript IV va Induro o'rtasidagi solishtirish uchun c-circUNC13A nukleotid ketma-ketligini olib yuruvchi in vitro transkripsiya qilingan 500 ng RNK — back-splicing birikma ketma-ketligini saqlaydigan halqali yoki chiziqli versiyada — Superscript IV (200 U) yoki Induro (200 U) bilan 20 mkl reaksiyada tasodifiy geksamerlar bilan teskari transkripsiya qilindi, Superscript IV uchun ishlab chiqaruvchining ko'rsatmalariga va Induro uchun yuqorida aytib o'tilgan protokolga amal qilindi. Reaksiyalar tugagandan so'ng, har bir namunadan 1 mkl suyultirildi va RT-qPCR tahlili uchun ishlatildi. Qolgan qismi avval Proteinase K (ThermoFisher Scientific) bilan ishlov berildi va 37°C da 15 daqiqa va 55°C da 20 daqiqa davomida inkubatsiya qilindi. Keyin reaksiyalar Mag-Bind® TotalPure NGS Beads (Omega Bio-tek) yordamida ishlab chiqaruvchining protokoliga muvofiq tozalandi va 26 mkl suvda elutsiya qilindi. Har bir namunaning bir qismi saqlab qolindi, qolgan qismi esa 1,5 mkl RNase H (NEB) va 1,5 mkl RNase If (NEB) bilan ishlov berildi, 37°C da 30 daqiqa va 70°C da 20 daqiqa davomida inkubatsiya qilindi. Barcha namunalar — RNase bilan ishlov berishdan oldin yoki keyin — 1 kb Plus DNA Ladder (NEB) yonida 0,8% TAE agaroz gelida yuritildi va vizualizatsiyadan oldin SYBR™ Gold Nucleic Acid Gel Stain (ThermoFisher Scientific) bilan bo'yaldi.&lt;/p&gt;\n&lt;h4 id=\"rnase-r-bilan-ishlov-berish\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#rnase-r-bilan-ishlov-berish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RNase R bilan ishlov berish:&lt;/span&gt;&lt;/a&gt;RNase R bilan ishlov berish:&lt;/h4&gt;\n&lt;p&gt;RNase R bilan ishlov berish uchun 3 mkg umumiy RNK 20 mkl reaksiyada 5 U RNase R (Lucigen) bilan suyultirildi, so'ngra 37°C da 15 daqiqa davomida inkubatsiya qilindi. Reaksiyalar 4 pg DNK spike-in molekulasi bilan to'ldirilgan 300 mkl TRIzol (ThermoFisher Scientific) qo'shish orqali tozalandi, bu keyinchalik RT-qPCR normallashtirish uchun ishlatildi va fenol-xloroform ekstraktsiyasi bilan davom ettirildi.&lt;/p&gt;\n&lt;h4 id=\"nonsense-mediated-decay-nmd-ingibitsiyasi-va-subhujayraviy-fraksiyalash\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#nonsense-mediated-decay-nmd-ingibitsiyasi-va-subhujayraviy-fraksiyalash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nonsense-mediated decay (NMD) ingibitsiyasi va Subhujayraviy fraksiyalash:&lt;/span&gt;&lt;/a&gt;Nonsense-mediated decay (NMD) ingibitsiyasi va Subhujayraviy fraksiyalash:&lt;/h4&gt;\n&lt;p&gt;Fraksiyalash tajribalari uchun SH-SY5Y hujayralari TDP-43 ga qarshi shRNA ni induksiya qilish uchun 25 ng/ml doksisiklin giglat (Sigma) bilan 10 kun davomida va NMD mexanizmini bloklash uchun 0,5 mkM SMG1-11j ingibitori bilan 24 soat davomida ishlov berildi. 10 kundan keyin hujayralar tripsinizatsiya qilindi, cho'ktirildi va 1X PBS (Thermo) da qayta suspenziya qilindi. Qayta suspenziya qilingan hujayralarning bir qismi cho'ktirildi va ishlab chiqaruvchining ko'rsatmalariga muvofiq Ambion PARIS Kit (Life Technologies) bilan subhujayraviy fraksiyalash uchun ishlatildi. Yadro va sitozol fraksiyalaridan RNK Direct-zol to'plami (Zymo) bilan ustunli DNase I ishlovi bilan ekstraksiya qilindi va NanoDrop One (ThermoFisher Scientific) bilan miqdoriy aniqlandi. Har bir eksperimental shart uchun 2 mkg sitoplazmatik RNK va teng hajmdagi yadroviy RNK fraksiyasi ishlab chiqaruvchining ko'rsatmalariga muvofiq RevertAid First Strand cDNA Synthesis Kit (Thermo Fisher Scientific) bilan teskari transkripsiya qilindi. RT-qPCR PowerUp SYBR Green Master Mix reaktivi (ThermoFisher Scientific) bilan bajarildi. DNK amplifikatsiyasi QuantStudio 5 Real-Time PCR tizimida (Applied Biosystems) kuzatildi. Yadro va sitoplazmatik fraksiyalardagi har bir transkriptning nisbiy ko'pligi Ct qiymatlaridan 2^−Ct sifatida baholandi va har bir bo'limdagi transkript ulushi 100% deb belgilangan ikki fraksiya yig'indisiga nisbatan hisoblab chiqildi.&lt;/p&gt;\n&lt;h4 id=\"western-blotting\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#western-blotting\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Western blotting:&lt;/span&gt;&lt;/a&gt;Western blotting:&lt;/h4&gt;\n&lt;p&gt;i3Neurons RIPA lizis buferida (Thermo Fisher Scientific, kat. raqami 89900) cOmpleteTM EDTA-free proteaza ingibitori kokteyli (Roche, kat. raqami 11836170001) va PhoSTOP Fosfataza ingibitori (Roche, 4906845001) bilan qo'shib gomogenizatsiya qilindi. Namunalar NuPAGE 4−12% Bis-Tris oqsil geliga (Invitrogen) yuklandi va NuPAGE MOPS buferida yuritildi. Oqsillar Trans-Blot Turbo 5x Transfer Buffer (BioRad, 10026938) yordamida Trans-Blot Turbo Transfer System yordamida 30 daqiqa davomida nitrosellyuloza blotlash membranasiga o'tkazildi. Membrana TBST (20 mM Tris, 150 mM NaCl va 0,1% Tween 20) dagi 5% yog'siz sutda bloklandi va TBST dagi 5% yog'siz sutda suyultirilgan birlamchi antitanachalar bilan tun bo'yi tekshirildi (anti-RPTOR (Proteintech, 20984-1-AP) 1:2000, anti-EHMT1 (Bethyl Laboratories A301-642A) 1:2000, anti-TDP-43 (Proteintech, 10782-2-AP) 1:2000 va anti-TUBULIN (Proteintech, 66031) 1:2000). TBST dagi 5% sutda suyultirilgan horseradish peroksidaza (HRP) bilan konjugatsiyalangan ikkilamchi antitanachalar bilan 1 soatlik inkubatsiyadan so'ng (anti-mouse HRP (Bio-Rad, 1706516) 1:10 000 va anti-rabbit HRP (Bio-Rad, 1706515) 1:10 000), membrana Immobilon Classico HRP substrati (Sigma-Aldrich) va Bio-Rad ChemiDoc tizimi yordamida rivojlantirildi.&lt;/p&gt;\n&lt;h4 id=\"rnk-ketma-ketlik-va-oldindan-qayta-ishlash\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#rnk-ketma-ketlik-va-oldindan-qayta-ishlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RNK-ketma-ketlik va oldindan qayta ishlash:&lt;/span&gt;&lt;/a&gt;RNK-ketma-ketlik va oldindan qayta ishlash:&lt;/h4&gt;\n&lt;p&gt;SH-SY5Y, SK-N-BE(2) va i3N ketma-ketlik kutubxonalari RiboErase to'plamiga ega KAPA RNA HyperPrep bilan tayyorlandi va NovaSeq 6000 mashinasida ketma-ketlashtirildi. SH-SY5Y 150 bp juft-uchli va i3N 100 bp juft-uchli edi. Namunalar Fastp yordamida “qualified_quality_phred: 10” parametri bilan sifat jihatidan qisqartirildi va GENCODE v31 dan gen modellari bilan STAR (v2.7.0f) yordamida qurilgan GRCh38 genomiga tekislandi. Gen ifodasi GENCODE v31 dan gen modellari yordamida FeatureCounts yordamida miqdoriy aniqlanadi.&lt;/p&gt;\n&lt;h4 id=\"ciri2-yordamida-circrna-aniqlash\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#ciri2-yordamida-circrna-aniqlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CIRI2 yordamida circRNA aniqlash:&lt;/span&gt;&lt;/a&gt;CIRI2 yordamida circRNA aniqlash:&lt;/h4&gt;\n&lt;p&gt;Qayta ishlangan o‘qishlar (reads) BWA-MEM (v0.7.17) yordamida -T 19 opsiyasi bilan insonning referens genomiga (GRCh38) tekislanadi. Har bir namunadagi circRNA ni aniqlash CIRI2 (v2.0.6) dasturiy ta’minoti yordamida amalga oshiriladi, u back-splicing tutashuvlariga mos keladigan o‘qishlarni qidirish orqali circRNA larni aniqlay oladi. circRNA mezbon genlarini aniqlash uchun dasturga Ensembl 108 gen annotatsiyasi taqdim etiladi. Topilgan har bir back-splicing hodisasi uchun CIRI2 back-splicing tutashuviga va tegishli chiziqli splicing tutashuvlariga mos keladigan o‘qishlar sonini hisobot qiladi, bu back-splicing da ishtirok etuvchi har ikkala splicing tutashuviga chiziqli ravishda mos keladigan barcha o‘qishlarni jamlash orqali hisoblanadi; agar circRNA boshqa namunalarda aniqlangan bo‘lsa ham, back-splicing tutashuviga hech qanday o‘qish tayinlanmagan bo‘lsa, ikkinchisi hisobot qilinmaydi. Boshqa namunalarda aniqlangan tegishli back-splicing tutashuvlariga hech qanday o‘qish mos kelmagan namunalarda chiziqli splicing saytlariga (tegishli chiziqli splicing tutashuvi, SJ) mos keladigan o‘qishlarni hisoblash uchun har bir namunadagi tekislash fayllari faqat boshqa namunalarda topilgan circRNA larga mos keladigan o‘qishlarni qo‘shish orqali o‘zgartirildi va CIRI2 ushbu fayllarda qayta ishga tushirildi. Tekislash fayllari operatsiyalari Picard (v2.24.1) va SAMtools (v1.10) to‘plamlari yordamida bajarildi.&lt;/p&gt;\n&lt;h4 id=\"differensial-ekspressiya-tahlili\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#differensial-ekspressiya-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Differensial ekspressiya tahlili:&lt;/span&gt;&lt;/a&gt;Differensial ekspressiya tahlili:&lt;/h4&gt;\n&lt;p&gt;circRNA larning knock-down va nazorat sharoitlari o‘rtasidagi differensial ekspressiyasini baholash uchun edgeR (v3.34.1) R paketi aniqlangan back-splicing hodisalarining o‘qishlar soni bilan ta’minlanadi. Kam sonli hodisalar differensial ekspressiya uchun sinovdan o‘tkazilmaydi. Kam sonli hodisalar chegarasi har bir sharoitdagi namunalar soniga qarab belgilandi, xususan: SH-SY5Y va SK-N-BE(2) uchun kamida 2 ta namunada 2 ta o‘qish, i3LMN uchun kamida 2 ta namunada 2 ta o‘qish va i3N uchun kamida 6 ta namunada 2 ta o‘qish. Har bir kontrast uchun namunalar standart edgeR normalizatsiyasi (TMM) yordamida normallashtiriladi; modelni moslashtirish va sinovdan o‘tkazish glmFIT va glmLRT funksiyalari yordamida amalga oshiriladi. Back-splicing tutashuvlariga mos keladigan o‘qishlar edgeR yordamida Count Per Million (CPM) qiymatlariga aylantiriladi va circRNA miqdorini aniqlash uchun ishlatiladi. Sinov uchun ishlatiladigan o‘qishlar soni kamligi sababli, biz differensial ifodalangan hodisalarni tanlash uchun noto‘g‘ri kashfiyot darajasi (FDR) o‘rniga p-qiymatidan foydalanishga qaror qildik va ahamiyatlilik chegarasini 0,05 ga belgiladik. Biz kamida 2 ta hujayra liniyasida sezilarli darajada yuqori bo‘lgan circRNA larni “High-Confidence” deb aniqladik. Biz TDP-KD sharoitida ko‘tarilgan, har bir nazorat namunasiga 1 tadan kam o‘qishga ega bo‘lganlarni “kriptik” (cryptic) deb hisobladik. Chiziqli RNKlar va tegishli chiziqli splicing tutashuvi tahlili uchun biz bir xil o‘qishlar soni chegaralarini qo‘lladik. Issiqlik xaritalari (Heatmaps) va Upset plot grafik tasvirlari ComplexHeatmap (v2.8.0) R paketi yordamida tasvirlangan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;edgeR usuli guruhlar o‘rtasidagi o‘qishlar sonidagi farqlar statistik jihatdan ahamiyatli ekanligini aniqlash uchun statistik modellardan foydalanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"clr-tahlili\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#clr-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CLR tahlili:&lt;/span&gt;&lt;/a&gt;CLR tahlili:&lt;/h4&gt;\n&lt;p&gt;Har bir namuna uchun aylana back-splicing tutashuvi hisoblari (BSJ) va tegishli chiziqli splicing tutashuvi hisoblari (SJ) CIRI2 chiqish faylidan olindi. Har bir circRNA hodisasi uchun aylana-chiziqli nisbat (CLR) hisoblab chiqildi. CLR quyidagicha hisoblandi: CLR = 2BSJ/(2BSJ+SJ). CIRI2 qo‘llanmasiga rioya qilgan holda, BSJ hisoblari aylana va chiziqli o‘qish hissasi o‘rtasidagi assimetriyani tuzatish uchun ikkiga ko‘paytirildi: har bir BSJ ni qamrab oluvchi o‘qish aylana tutashuvining har ikki tomonidan kelib chiqadigan ketma-ketlikni ifodalaydi, lekin faqat bir marta hisoblanadi, chiziqli (tutashuv bo‘lmagan) o‘qishlar esa bitta uchidan kelib chiqadi. Keyin CTRL va TDP-43 knock-down (KD) guruhlari uchun alohida o‘rtacha CLR hisoblab chiqildi va guruh o‘rtacha ko‘rsatkichlari o‘rtasidagi farq (ΔCLR) aylanish jarayonidagi o‘zgarishlarni miqdoriy baholash uchun ishlatildi: ΔCLR = CLR = CLRKD - CLRCTRL. Statistik ahamiyatlilikni baholash uchun biz binomial umumlashtirilgan chiziqli modelni (GLM) qo‘lladik, unda 2BSJ qiymatlari “muvaffaqiyatlar”, SJ qiymatlari esa “muvaffaqiyatsizliklar” sifatida qaraldi. Har bir circRNA hodisasi uchun ikkita ichki model moslashtirildi: sharoit ta’siri yo‘qligini nazarda tutuvchi nol model (CLR namunalar bo‘ylab doimiy) va sharoitni bashoratchi sifatida o‘z ichiga olgan to‘liq model. Keyin modellarni solishtirish va sharoit atamasini kiritish modelning moslashuvini sezilarli darajada yaxshilaganligini aniqlash uchun ehtimollik nisbati testi (LRT) ishlatildi.&lt;/p&gt;\n&lt;h4 id=\"tdp-boglanish-saytlari-tahlili\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#tdp-boglanish-saytlari-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TDP-bog‘lanish saytlari tahlili:&lt;/span&gt;&lt;/a&gt;TDP-bog‘lanish saytlari tahlili:&lt;/h4&gt;\n&lt;p&gt;TDP bog‘lanish hududlari POSTAR3 ma’lumotlar bazasidan olindi. Ko‘tarilgan circRNA lar (nomzodlar) ularning yon atrofdagi intronlarida (aniqrog‘i, BSJ dan +- 1000bp mintaqada yoki ekzon mintaqasi bilan kesishsa, undan kamroq) TDP bog‘lanishi uchun sinovdan o‘tkazildi. Har bir nomzod uchun 2 ta nazorat circRNA lari invariant circRNA lardan (p-qiymat &amp;gt; 0,05) yon atrofdagi intronlarning xususiyatlarini (uzunligi, %GC, back-splicing ekzonlari orasidagi masofa) va nazorat sharoitida mezbon gen ekspressiyasini hisobga olgan holda tanlandi. Mann-Whitney U testi bilan biz yuqorida tavsiflangan oynalarning xususiyatlari ikki to‘plam o‘rtasida muvozanatlanganligini tekshirdik. 2 ta mustaqil ma’lumotlar to‘plamida kamida 2 ta ustma-ust tushadigan TDP-bog‘lanish hududiga ega circRNA lar TDP-interaktorlar deb belgilandi. c-circRNA yon atrofdagi intronlarida TDP-43 bog‘lanishining mos keladigan nazorat circRNA lariga nisbatan boyishi Fisherning aniq testi yordamida baholandi.&lt;/p&gt;\n&lt;h4 id=\"kriptik-ekzonni-xaritalash-tahlili\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#kriptik-ekzonni-xaritalash-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kriptik ekzonni xaritalash tahlili:&lt;/span&gt;&lt;/a&gt;Kriptik ekzonni xaritalash tahlili:&lt;/h4&gt;\n&lt;p&gt;TDP-43 ga bog‘liq kriptik splicing hodisalarining genomik koordinatalari Brown va boshqalar ishidan olindi, jumladan ekzon kiritish va ekzon o‘tkazib yuborish hodisalari. c-circRNA yon atrofdagi intronlarining koordinatalari tegishli transkript annotatsiyalaridan olindi. TDP-43 bog‘lanish tahlili uchun ishlatilgan bir xil mos keladigan nazorat circRNA lar to‘plami fon sifatida ishlatildi. Kriptik hodisa, uning genomik koordinatalari zanjirga xos tarzda, ikkita yon atrofdagi intronlarning har biri bilan ustma-ust tushganda, circRNA bilan bog‘liq deb hisoblandi. c-circRNA yon atrofdagi intronlarida kriptik splicing hodisalarining mos keladigan nazorat circRNA lariga nisbatan boyishi Fisherning aniq testi yordamida baholandi.&lt;/p&gt;\n&lt;h4 id=\"nygc-als-konsorsiumining-rnkni-sekvensiya-qilish-boyicha-kogortasi\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#nygc-als-konsorsiumining-rnkni-sekvensiya-qilish-boyicha-kogortasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;NYGC ALS konsorsiumining RNKni sekvensiya qilish bo‘yicha kogortasi:&lt;/span&gt;&lt;/a&gt;NYGC ALS konsorsiumining RNKni sekvensiya qilish bo‘yicha kogortasi:&lt;/h4&gt;\n&lt;p&gt;Postmortem to‘qimalarning RNKni sekvensiya qilish uchun biz NYGC ALS konsorsiumidan olingan namunalardan foydalandik, ular orasida nevrologik kasalliklari bo‘lmagan nazorat namunalari, FTLD, amyotrofik lateral skleroz (ALS), ALS bilan birga kechuvchi peshona-chakka demensiyasi (ALS-FTLD) yoki Altsgeymer kasalligiga gumon qilingan ALS (ALS-AD) namunalari mavjud edi. Pesxona-chakka demensiyasi (FTLD) bilan og‘rigan bemorlar patologning TDP-43 qo‘shilmalari bilan kechadigan FTLD (FTLD-TDP) tashxisiga yoki FUS yoki Tau agregatlari mavjudligiga ko‘ra tasniflandi. ALS namunalari konsorsiumning mavjud metama’lumotlaridan foydalangan holda quyidagi kichik toifalarga bo‘lindi: SOD1 yoki FUS mutatsiyalari qayd etilgan yoki qayd etilmagan ALS. Sodda bo‘lishi uchun SOD1 yoki FUS mutatsiyalariga ega bo‘lmagan barcha ALS namunalari ushbu ishda ALS-TDP sifatida guruhlandi, garchi postmortem TDP-43 qo‘shilmalari haqida xabar berish tizimli xususiyatga ega emas edi va shuning uchun metama’lumotlarga kiritilmagan. Tasdiqlangan postmortem TDP-43 patologiyasi barcha FTLD-TDP namunalari uchun qayd etilgan. Namunalarni qayta ishlash, kutubxonalarni tayyorlash va RNK-seq sifatini nazorat qilish oldingi ishlarda keng yoritilgan.&lt;/p&gt;\n&lt;p&gt;Qisqacha aytganda, RNK tez muzlatilgan postmortem to‘qimadan TRIzol (Thermo Fisher Scientific) va xloroform yordamida ajratib olindi va ribosomal RNKni kamaytirish uchun KAPA Stranded RNA-Seq Kit with RiboErase (KAPA Biosystems) yordamida 500 ng umumiy RNKdan RNA-Seq kutubxonalari tayyorlandi. Sifat mezonlaridan o‘tgan birlashtirilgan kutubxonalar (o‘rtacha insert hajmi: 375 bp) Illumina HiSeq 2500 (125 bp juft oxirli) yoki Illumina NovaSeq (100 bp juft oxirli) qurilmalarida sekvensiya qilindi. Namunalar 16 milliondan 167 milliongacha bo‘lgan juft o‘qishlar oralig‘ida 42 million o‘qish juftligining median sekvensiya chuqurligiga ega edi. Namunalar bir xilda qayta ishlandi, shu jumladan Trimmomatic yordamida adapterlarni qirqish va GENCODE v30 indekslari yordamida STAR (2.7.2a) yordamida hg38 genomi yig‘masiga moslashtirish.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Paired-end (juft oxirli) sekvensiya — DNK yoki RNK fragmentlarining ikkala uchidan ham o‘qish imkonini beruvchi usul bo‘lib, bu genomdagi takrorlanuvchi hududlarni aniqlash va mutatsiyalarni topish aniqligini sezilarli darajada oshiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Jins va kelib chiqish to‘qimasini tasdiqlash uchun SAMtools va Picard Tools yordamida keng qamrovli sifat nazorati amalga oshirildi. Potentsial aralashuvchi o‘zgaruvchilar har bir to‘qima uchun alohida baholandi. Gurihlar o‘rtasidagi sekvensiya chuqurligi, RNK yaxlitligi ko‘rsatkichi (RIN) va vafot etish yoshidagi farqlar ikki tomonlama Uilkoxon — Mann — Uitni testlari, so‘ngra ko‘p karrali taqqoslash uchun Bonferroni tuzatishi yordamida baholandi. Jinsiy taqsimot Fisherning aniq testi yordamida taqqoslandi.&lt;/p&gt;\n&lt;h4 id=\"nygc-circrna-aniqlash-va-boyitish-tahlili\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#nygc-circrna-aniqlash-va-boyitish-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;NYGC circRNA aniqlash va boyitish tahlili:&lt;/span&gt;&lt;/a&gt;NYGC circRNA aniqlash va boyitish tahlili:&lt;/h4&gt;\n&lt;p&gt;Sirkulyar RNKlar (circRNA) «CircRNA detection» bo‘limida tavsiflanganidek aniqlandi. Agar teskari spaysing tutashuvini (BSJ) qo‘llab-quvvatlaydigan kamida bitta o‘qish aniqlansa, circRNA namunada ekspressiyalangan deb hisoblandi. ALS-TDP namunalarida boyitilgan circRNA'larni aniqlash uchun biz Fisherning aniq testidan foydalangan holdahar bir to‘qima uchun alohida ravishda ALS-TDP va nazorat guruhlari o‘rtasida har bir circRNA'ni ekspressiya qiluvchi namunalar ulushini taqqosladik. P-qiymatlari Benjamini — Xoxberg protsedurasi yordamida ko‘p karrali taqqoslash uchun tuzatildi. ALS-TDP namunalarida boyitilgan va nazorat namunalarining 5% dan kamrog‘ida aniqlangan circRNA'lar yashirin circRNA'lar (c-circRNA) deb tasniflandi. Alohida c-circRNA nomzodlari uchun ekspressiya BSJ ni qo‘llab-quvvatlaydigan o‘qishlardan hisoblangan va xaritalashtirilgan o‘qishlarning umumiy soniga normallashtirilgan millionlab xaritalashtirilgan o‘qishlarga to‘g‘ri keladigan o‘qishlar (RPM) sifatida miqdoriy baholandi. Mos keladigan chiziqli transkriptlar Salmon (v1.8.0) yordamida miqdoriy baholandi va millionlab transkriptlar (TPM) sifatida ifodalandi. Gurihlar orasidagi farqlar har bir to‘qima uchun alohida ravishda ikki tomonlama Uilkoxon — Mann — Uitni testlari va Bonferroni tuzatishi yordamida baholandi. Issiqlik xaritalari (heatmaps) ComplexHeatmap58 R paketi (v2.8.0) yordamida yaratildi.&lt;/p&gt;\n&lt;h4 id=\"tdp-43-yashirin-yukini-tahlil-qilish\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#tdp-43-yashirin-yukini-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TDP-43 yashirin yukini tahlil qilish:&lt;/span&gt;&lt;/a&gt;TDP-43 yashirin yukini tahlil qilish:&lt;/h4&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Fisherning aniq testi — kichik hajmli tanlanmalardagi ikkita kategorik o‘zgaruvchi o‘rtasidagi bog‘liqlik yoki farqlarning statistik ahamiyatini aniqlash uchun ishlatilmaydigan, to‘g‘ridan-to‘g‘ri ehtimolga asoslangan aniq statistik usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;TDP-43 yashirin yuki ballari avval tavsiflanganidek olindi. Har bir to‘qima uchun namunalar yuk ko‘rsatkichiga ko‘ra reyting qilindi va past yuk guruhiga (quyi 25%) hamda yuqori yuk guruhiga (yuqori 25%) bo‘lindi. Yuk guruhlari orasidagi sekvensiya chuqurligidagi farqlar har bir to‘qima uchun ikki tomonlama Uilkoxon — Mann — Uitni testlari va Bonferroni tuzatishi yordamida baholandi. Yuqori va past yuk guruhlari o‘rtasida circRNA'larning boyishi har bir guruhda har bir circRNA'ni ekspressiya qiluvchi namunalar ulushini taqqoslash orqali Fisherning aniq testi yordamida baholandi.&lt;/p&gt;\n&lt;h4 id=\"statistik-dasturiy-taminot-va-vizualizatsiya\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#statistik-dasturiy-taminot-va-vizualizatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Statistik dasturiy ta'minot va vizualizatsiya:&lt;/span&gt;&lt;/a&gt;Statistik dasturiy ta'minot va vizualizatsiya:&lt;/h4&gt;\n&lt;p&gt;Barcha statistik tahlillar R60 (v4.5.1) yordamida amalga oshirildi. Qabul qiluvchining ishchi xarakteristikasi (ROC) egri chizig‘i tahlillari pROC61 (v1.19.0.1) yordamida bajarildi. Grafik tasvirlar ggplot262 (v4.0.1), ComplexHeatmap58 (v2.24.1), EnhancedVolcano63 (v1.26.0), eulerr64 (v7.0.4), circlize65 (v0.4.16), ggvenn66 (v0.1.19), ggpubr67 (v0.6.2), RColorBrewer68 (v1.1.3) va viridisLite69 (v0.4.2) R paketlari yordamida yaratildi. Ushbu ishning rasmlarida ko‘rsatilgan ma’lumotlarning taqsimoti va og‘ishi, sezilarli farqlarni hisoblash uchun ishlatiladigan statistik testlar va n ning aniq qiymati (masalan, tajribalarning biologik takrorlanish soni) rasm ostidagi izohlarda ko‘rsatilgan. Rasm ostidagi izohlarda «SD» «standart og‘ish» (standard deviation) va «SEM» «o‘rtachaning standart xatosi» (standard error mean) ma’nosini bildiradi. Rasmlarda ahamiyatlilik qiymatlari quyidagi belgilar yordamida tasvirlangan: n.s. p &amp;gt; 0.05, *p &amp;lt; 0.05, **p &amp;lt; 0.01, ***p &amp;lt; 0.001. Quticha diagrammalarida (boxplot) interkvartil oralig‘i ma’lumotlarning 75-persentili va 25-persentilini qamrab oladi, mediana esa qutichadagi chiziq sifatida ko‘rsatilgan (50-persentil). Zarur bo‘lganda, ma’lumotlar GraphPad Prism 10 yordamida chizildi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd-f2.jpg\" alt=\"2-rasm — c-circRNAlar postmortem ALS/FTD da TDP-43 proteinopatiyasini sezgir tarzda farqlaydi: A) Tahlil qilingan beshta\" /&gt;&lt;/p&gt;\n&lt;p&gt;*2-rasm — c-circRNAlar postmortem ALS/FTD da TDP-43 proteinopatiyasini sezgir tarzda farqlaydi: A) Tahlil qilingan beshta Markaziy Asab Tizimi (MAT) sohasida (bo'yin orqa miya, bel orqa miya, motor qobig'i, peshona qobig'i va chakka qobig'i) nazoratga nisbatan ALS-TDP namunalarida kriptik circRNAlarning (c-circRNA) boyishini (imkoniyatlar nisbatining tabiiy logarifmi, LnOR) ko'rsatuvchi issiqlik xaritasi. c-circRNAlar issiqlik xaritasining o'ng tomonidagi gistogrammalarda ko'rsatilgandek, to'qimalar bo'yicha o'rtacha LnOR bo'yicha tartiblangan. Rang intensivligi Fisherning aniq testi yordamida hisoblangan c-circRNA boyishining kattaligini aks ettiradi. B) Past va yuqori yuklamali guruhlarga tayinlangan ALS-TDP namunalarida TDP-43 kriptik yuklama ballining taqsimlanishini ko'rsatuvchi quti diagrammasi. Namunalar mos ravishda TDP-43 kriptik yuklama ballining eng past va eng yuqori kvartillariga ko'ra tabaqalashtirildi. C) Past va yuqori yuklamali guruhlarda har bir c-circRNA ni ekspresiya qiluvchi ALS-TDP namunalarining ulushini ko'rsatuvchi chiziqli grafik. Har bir chiziq bitta c-circRNA ni bildiradi. Yuqori yuklamali guruhda sezilarli darajada boyigan c-circRNAlar (P &amp;lt; 0.05, Fisherning aniq testi) belgilab qo'yilgan. Past yuklamali guruhda hech qanday c-circRNA sezilarli darajada boyimagan. Ko'k rangli o'qlar qo'shimcha tasdiqlash uchun tanlangan to'rtta nomzod c-circRNA ni ko'rsatadi. D) Kasallik guruhlari va MAT sohalari bo'ylab NYGC ALS Consortium RNA-seq ma'lumotlar to'plamida tanlangan c-circRNAlarning (c-circUNC13A, c-circBCAR1, c-circDIP2C va c-circDSCAM) ekspresiyasini ko'rsatuvchi quti diagrammalari. c-circRNAlarning ekspresiyasi kutubxona hajmiga normallashtirilgan back-splicing birikmasi (BSJ) sonidan (million o'qishlar uchun, RPM) miqdoriy aniqlandi. Har bir nuqta alohida namunani bildiradi. Statistik ahamlilik Bonferroni tuzatishi bilan Uilkoxon-Mann-Uitni testi yordamida baholandi (*p &amp;lt; 0.05, **p &amp;lt; 0.01, ***p &amp;lt; 0.001). Ahamiyatsiz taqqoslashlar (p &amp;gt; 0.05) xabar qilinmaydi. E) Sog'lom nazorat (CTRL, n = 21) va TDP-43 patologiyasiga ega (FTD-TDP, n = 56) yoki patologiyasiz (FTD-non-TDP, n = 12) FTD bemorlarining postmortem inson peshona qobig'i namunalarida tanlangan c-circRNAlarning (c-circUNC13A, c-circBCAR1, c-circDIP2C, c-circDSCAM) RT–qPCR tahlili. c-circRNA ekspresiyasi GAPDH mRNK ga normallashtirildi va 1 qiymatiga sozlangan nazorat namunasiga nisbatan karrali o'zgarish (log₂(2^−ΔΔCt)) sifatida taqdim etiladi. Har bir nuqta alohida namunani bildiradi. Statistik ahamlilik Bonferroni tuzatishi bilan Uilkoxon-Mann-Uitni testi yordamida baholandi (n.s. p &amp;gt; 0.05, **&lt;em&gt;p &amp;lt; 0.001). F) FTD-TDP ni sog'lom nazoratdan va TDP-43 patologiyasisiz FTD hollaridan farqlashda alohida c-circRNAlar va birlashtirilgan to'rtta markerli modelning qobiliyatini baholovchi qabul qiluvchi operatsion xarakteristika (ROC) egri chiziqlari. Egri chiziq ostidagi maydonlar (AUC) ko'rsatilgan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd-f3.jpg\" alt=\"3-rasm — c-circRNAlar va chiziqli CE lar neyrodegeneratsiyaga bog'langan genlarda birga uchraydi: A) Yuqori ishonchli kr\" /&gt;&lt;/p&gt;\n&lt;p&gt;*3-rasm — c-circRNAlar va chiziqli CE lar neyrodegeneratsiyaga bog'langan genlarda birga uchraydi: A) Yuqori ishonchli kriptik circRNAlar (ko'k) va yon atrofdagi intronlarining birida kriptik сплайсинг hodisasiga ega bo'lgan yuqori ishonchli kriptik circRNAlar (yashil) o'rtasidagi kesishmani ko'rsatuvchi Venn diagrammasi. Kesishmaning ahamiligini baholash uchun Fisherning aniq testi ishlatildi. 14 ta umumiy circRNA o'ng tomonda keltirilgan. Qalin harflar bilan ko'rsatilgan c-circRNAlar keyingi tahlillar uchun tanlandi. B) RPTOR genida kriptik сплайсинг hodisasi (yashil) va kriptik halqali RNK (c-circRNA) hosil qiluvchi hodisaning (ko'k) bir vaqtning o'zida sodir bo'lishini ko'rsatuvchi Sashimi grafigi. Yuqori panel hodisalarning schematik ko'rinishini ko'rsatadi, pastki panellar esa ko'rsatilgan sharoitlarda o'qish qamrovi va сплайсинг saytidan foydalanishni ko'rsatadi: nazorat (CTRL NT), TDP-43 nokdauni (KD NT) va nonsense-vositachiligidagi parchalanishni inhibe qilish bilan TDP-43 nokdauni (KD NMDi). C) UNC13A, RPTOR, EHMT1 va DIP2C chiziqli kriptik сплайсинг izoformalari uchun ularning tegishli to'g'ri сплайisiling qilingan birikmalariga nisbatan foiz сплайisiling qilingan (PSI, ψ) qiymatlari. ψ qiymatlari nazorat yoki TDP-43 nokdaun sharoitida, sikloheksimid vositachiligidagi nonsense-vositachiligidagi parchalanishni (NMD) inhibe qilish bilan yoki undan holda SH-SY5Y hujayralaridan olingan ommaviy RNA-seq ma'lumotlaridan hisoblangan. Ustunlar mustaqil biologik takroriylarning o'rtacha ± SD qiymatini bildiradi, alohida takroriylar qora nuqtalar sifatida ko'rsatilgan (n = 4). Statistik ahamlilik ko'p testli taqqoslash uchun tuzatish bilan ikki tomonlama juftlashtirilmagan Stbyudent t-testi yordamida baholandi (FDR Benjamini–Hochberg) (n.s. p &amp;gt; 0.05, **p &amp;lt; 0.01, ***p &amp;lt; 0.001). D) Nazorat va TDP-nokdaun i3N da EHMT1, RPTOR va TDP-43 oqsil darajalarini ko'rsatuvchi vakillik western blot; yuklash nazorati sifatida α-tubulin (TUBULIN) ishlatildi. n = 3 ta mustaqil biologik takroriylar. E) Ko'rsatilgan genlardan olingan chiziqli kriptik transkriptlar (CE) va mos keladigan kriptik circRNAlarning (c-circRNA) hujayra ichki lokalizatsiyasi. TDP-43 kamaytirilgan SH-SY5Y hujayralaridan yadro va sitoplazmatik fraksiyalar ajratib olindi va transkript ko'pligi RT-qPCR yordamida miqdoriy aniqlandi. Ustma-ust ustunli diagrammalar yadro (ochiq kulrang) va sitoplazmatik (to'q kulrang) fraksiyalarda aniqlangan har bir transkriptning ulushini ko'rsatadi. GAPDH va pre-GAPDH mos ravishda sitoplazmatik va yadro nazorati sifatida ishlatildi. Ustunlar uchta mustaqil biologik takroriylarning o'rtacha ± SD qiymatini bildiradi (n = 3). F) Sog'lom nazorat (CTRL, n = 21) va TDP-43 patologiyasiga ega (FTD-TDP, n = 56) yoki patologiyasiz (FTD-non-TDP, n = 12) FTD bemorlarining postmortem inson peshona qobig'i namunalarida chiziqli kriptik transkriptlar (CE, yashil) va ularning mos keladigan kriptik circRNAlari (c-circRNA, ko'k) ning RT-qPCR tahlili. Transkript ko'pligi GAPDH mRNK ga normallashtirildi va log₂-transformatsiya qilingan ekspresiya qiymatlari (log₂(2^−ΔCt)) sifatida taqdim etiladi. Har bir nuqta alohida namunani bildiradi. Statistik ahamlilik Bonferroni tuzatishi bilan Uilkoxon-Mann-Uitni testi yordamida baholandi (n.s. p &amp;gt; 0.05, **&lt;em&gt;p &amp;lt; 0.001).&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;te t=\"172\" x=\"612\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;AHAMIYATI&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;терапия учун&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;биомаркер&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;яратилди&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Preprint hali taqriz qilinmagan. Xulosalar dastlabki.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"manba\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#manba\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manba&lt;/span&gt;&lt;/a&gt;Manba&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Manba&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Kategoriya&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Preprint litsenziyasi&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;bioRxiv&lt;/td&gt;\n&lt;td&gt;neuroscience&lt;/td&gt;\n&lt;td&gt;CC BY-NC 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mualliflar: Dattilo, D.; Pellegrini, F.; Barattucci, S.; Brown, A.-L.; Vargas, J. N. S.; Gatt, A.; Morrie, R.; Miller, G.; Bachmutsky, I.; McEachin, Z.; Chung, M.; Keuss, M. J.; Ryadnov, E.; Zanovello, M.; Mehta, P. R.; Mattedi, F.; Barioglio, M.; Kamath, S.; Kargbo-Hill, S. E.; Palade, J.; Kowal, I.; Glass, J.; Gearing, M.; Lee, E. B.; Murray, M. E.; Dickson, D. W.; NYGC ALS Consortium,  ; Green, E. M.; Seyfried, N. T.; Chandriani, S.; Ward, M.; Fratta, P.&lt;/p
