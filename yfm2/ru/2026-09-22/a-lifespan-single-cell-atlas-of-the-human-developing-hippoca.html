        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"241\" cy=\"128\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"639\" cy=\"280\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Карта развития гиппокампа&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;человека для изучения ранней&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;болезни Альцгеймера&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f1.jpg\" alt=\"Рисунок 1. Атлас развивающегося гиппокампа человека (HuDeHA) отражает временную динамику развития гиппокампа от ранних э\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Атлас развивающегося гиппокампа человека (HuDeHA) отражает временную динамику развития гиппокампа от ранних эмбриональных до постнатальных стадий. (A) UMAP-проекция Атласа развивающегося гиппокампа человека (HuDeHA; 658 059 клеток), показывающая 20 аннотированных классов клеток. Атлас охватывает нейрональную линию от радиальной глии и промежуточных клеток-предшественников (IPC) до ранних и зрелых нейронов, а также пролиферирующие состояния радиальной глии и IPC; глиальную линию, включающую глиальные предшественники, предшественники олигодендроцитов (OPC), олигодендроциты и астроциты; эктодермальные не нейрональные популяции (эпендиму и сосудистое сплетение); нервный гребень (НК) и нейроны, производные НК; неэктодермальные популяции (мезенхимальные, эндотелиальные, микроглиальные/миелоидные и другие иммунные клетки), а также небольшую группу, связанную со спинным мозгом/задним мозгом. (B) Плотность пропорций классов клеток в ходе развития (от 3 недель после зачатия (PCW) до 15,3 лет), показывающая ожидаемые сдвиги от нейрогенеза к глиогенезу и появлению постнатально-ассоциированных классов клеток: радиальная глия и НК доминируют в эмбриональных образцах; IPC и глиальные предшественники появляются на фетальных стадиях, в то время как зрелые нейроны вместе с астроцитами и олигодендроцитами начинают преобладать в постнатальном периоде. (C) Пропорциональная динамика отдельных классов клеток в ходе развития, детализированная по возрасту развития. В дополнение к (B), этот вид подчеркивает время появления и истощения отдельных классов: эмбриональное преобладание радиальной глии и ранних нейронов, прогрессирующую потерю клеток, производных НК, с сопутствующим расширением глиальных предшественников, а также постнатальное доминирование зрелых нейронов наряду с OPC, олигодендроцитами и астроцитами. (D) Точечный график (dotplot), показывающий экспрессию канонических маркеров во всех 20 аннотированных классах клеток: радиальная глия (VIM, SOX2), IPC (EOMES), пролиферирующая радиальная глия и IPC (TOP2A, MKI67), ранние (DCX) и зрелые нейроны (SNAP25), нейроны Кахаля-Ретциуса (CR) (RELN), глиальные предшественники (BCAN), OPC (OLIG1), олигодендроциты (MBP), астроциты (GFAP), эктодермальные ненейрональные популяции – эпен디ма (PIFO), сосудистое сплетение (TTR), НК (MPZ) и нейроны, производные НК (ISL1), мезенхима (DCN), эндотелий (CLDN5), микроглиальные (CX3CR1) и иммунные (CD3D) клетки, группа спинного/заднего мозга (CDX2/4).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Ученые создали единую клеточную карту развивающегося гиппокампа человека, охватывающую период от эмбриона до подросткового возраста. С ее помощью они исследовали мозговые органоиды с мутацией, вызывающей раннюю форму болезни Альцгеймера. Анализ показал сбои в клеточном составе, преждевременное созревание нейронов и изменения активности ключевых генов. Новая база данных поможет точнее моделировать неврологические патологии в лабораторных условиях.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Семейная форма болезни Альцгеймера (фБА) представляет собой раннее проявление патологии, которое запускается аутосомно-доминантными мутациями в генах APP, PSEN1 или PSEN2, причем мутации в PSEN1 составляют большинство генетически подтвержденных случаев. Гиппокамп страдает одним из первых и наиболее тяжело при данном заболевании. Мозговые органоиды, полученные из индуцированных плюрипотентных стволовых клеток человека (иПСК), воспроизводят ключевые черты раннего развития мозга и служат удобной моделью для изучения того, как мутации фБА нарушают нейроонтогенез. Тем не менее, интерпретация таких результатов затруднена из-за неоднородности региональной идентичности, разной степени зрелости и клеточного состава в различных протоколах культивирования. Существующие работы по одиночным клеткам для гиппокампа человека охватывают пренатальный и постнатальный периоды, но не формируют непрерывный эталон развития. Используя подход клеточного картирования на основе данных секвенирования РНК единичных клеток, мы получаем стандартизированные сведения о клеточных классах, типах и степени зрелости органоидов.&lt;/p&gt;\n&lt;p&gt;В рамках данного исследования мы создали Атлас развивающегося гиппокампа человека (HuDeHA) — интегрированную одноклеточную справочную систему, включающую 658 059 клеток, охватывающих период от 3 недель после зачатия до 15,3 лет. Мы применили этот атлас для бенчмаркинга мозговых органоидов из иПСК, несущих мутацию PSEN1E280A, которая связана с фБА у крупной популяции Колумбии. Картографирование на основе эталона выявило измененный клеточный состав в органоидах с мутацией PSEN1E280A, включая сокращение пула радиальной глии и увеличение числа нейронов, происходящих из нервного гребня. Данные сдвиги сопровождались транскрипционными нарушениями в разных линиях клеток, среди которых отмечалась масштабная активация вентрального фактора паттернинга MEIS2 и снижение уровня экспрессии белка transthyretin (TTR), связывающего бета-амилоид, в популяциях клеток хориоидного сплетения и эпендимальных структурах. Реконструированные траектории развития нейрональных линий продемонстрировали сдвиг в сторону более зрелых состояний в органоидах PSEN1E280A.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Атлас HuDeHA позволил выявить у органоидов с мутацией PSEN1E280A дефицит радиальной глии, избыток нейронов нервного гребня, подъем уровня MEIS2 и падение TTR, а также ускоренное созревание нейронов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Полученные данные формируют ресурс HuDeHA в качестве надежного стандарта для оценки гиппокампальных органоидных систем и описывают специфические для клеточных линий изменения в органоидах PSEN1E280A, способствующие пониманию ранних клеточных сдвигов при фБА.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"human-developing-hippalogus-atlas-hudeha-vnosit-yasnost-v-osnovnye-klassy-kletok-na-pre-i-postnatalnoj-vremennoj-shkale\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#human-developing-hippalogus-atlas-hudeha-vnosit-yasnost-v-osnovnye-klassy-kletok-na-pre-i-postnatalnoj-vremennoj-shkale\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Human Developing Hippalogus Atlas (HuDeHA) вносит ясность в основные классы клеток на пре- и постнатальной временной шкале&lt;/span&gt;&lt;/a&gt;Human Developing Hippalogus Atlas (HuDeHA) вносит ясность в основные классы клеток на пре- и постнатальной временной шкале&lt;/h4&gt;\n&lt;p&gt;Исследователи создали комплексный атлас человеческого развивающегося гиппокампа (HuDeHA), объединив 107 серий экспериментов и включив в общей сложности 658 059 клеток из общедоступных массивов данных scRNA-seq (Рис. 1А; Рис. S1А, B; Таблица S1). Временной диапазон охватывает период от ранних эмбриональных этапов, начиная с 3-й недели после зачатия (PCW3), и простирается до постнатального подросткового возраста, где возраст самых старших образцов составлял 15,3 года. Аннотированные популяции отражают ожидаемое клеточное разнообразие линий развития, включая нейрональные, глиальные, не-нейрональные, сосудистые и иммунные типы клеток. Опираясь на канонические маркерные гены, авторы выделили 20 основных классов клеток в атласе HuDeHA (Рис. 1D).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f1.jpg\" alt=\"Рисунок 1. Атлас развивающегося гиппокампа человека (HuDeHA) отражает временную динамику развития гиппокампа от ранних э\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Атлас развивающегося гиппокампа человека (HuDeHA) отражает временную динамику развития гиппокампа от ранних эмбриональных до постнатальных стадий. (A) UMAP-проекция Атласа развивающегося гиппокампа человека (HuDeHA; 658 059 клеток), показывающая 20 аннотированных классов клеток. Атлас охватывает нейрональную линию от радиальной глии и промежуточных клеток-предшественников (IPC) до ранних и зрелых нейронов, а также пролиферирующие состояния радиальной глии и IPC; глиальную линию, включающую глиальные предшественники, предшественники олигодендроцитов (OPC), олигодендроциты и астроциты; эктодермальные не нейрональные популяции (эпендиму и сосудистое сплетение); нервный гребень (НК) и нейроны, производные НК; неэктодермальные популяции (мезенхимальные, эндотелиальные, микроглиальные/миелоидные и другие иммунные клетки), а также небольшую группу, связанную со спинным мозгом/задним мозгом. (B) Плотность пропорций классов клеток в ходе развития (от 3 недель после зачатия (PCW) до 15,3 лет), показывающая ожидаемые сдвиги от нейрогенеза к глиогенезу и появлению постнатально-ассоциированных классов клеток: радиальная глия и НК доминируют в эмбриональных образцах; IPC и глиальные предшественники появляются на фетальных стадиях, в то время как зрелые нейроны вместе с астроцитами и олигодендроцитами начинают преобладать в постнатальном периоде. (C) Пропорциональная динамика отдельных классов клеток в ходе развития, детализированная по возрасту развития. В дополнение к (B), этот вид подчеркивает время появления и истощения отдельных классов: эмбриональное преобладание радиальной глии и ранних нейронов, прогрессирующую потерю клеток, производных НК, с сопутствующим расширением глиальных предшественников, а также постнатальное доминирование зрелых нейронов наряду с OPC, олигодендроцитами и астроцитами. (D) Точечный график (dotplot), показывающий экспрессию канонических маркеров во всех 20 аннотированных классах клеток: радиальная глия (VIM, SOX2), IPC (EOMES), пролиферирующая радиальная глия и IPC (TOP2A, MKI67), ранние (DCX) и зрелые нейроны (SNAP25), нейроны Кахаля-Ретциуса (CR) (RELN), глиальные предшественники (BCAN), OPC (OLIG1), олигодендроциты (MBP), астроциты (GFAP), эктодермальные ненейрональные популяции – эпен디ма (PIFO), сосудистое сплетение (TTR), НК (MPZ) и нейроны, производные НК (ISL1), мезенхима (DCN), эндотелий (CLDN5), микроглиальные (CX3CR1) и иммунные (CD3D) клетки, группа спинного/заднего мозга (CDX2/4).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Нейроэктодермальные линии образовали непрерывный континуум дифференцировки нейронов. Он берет начало с радиальной глии в количестве 194 105 клеток, экспрессирующей VIM, SOX2 и NES, а также пролиферирующей радиальной глии (11 390 клеток) с высоким уровнем экспрессии TOP2A, MKI67, UBE2C и CDK1. Далее они переходят в промежуточные клетки-предшественники (IPC; 15 033 клетки), отмеченные маркерами EOMES и ASCL1, и пролиферирующие IPC (3860 клеток). В свою очередь, эти предшественники дают начало ранним нейронам (246 627 клеток), экспрессирующим DCX, NEUROD2 и ELAVL3, а также более дифференцированным нейронам (95 335 клеток), обогащенным постмитотическими и синаптическими генами RBFOX3, SNAP25 и SYT1. Небольшая популяция нейронов Кахаля-Ретциуса (170 клеток) отличалась высоким уровнем экспрессии RELN. Глиальная линия включала глиальные предшественники (8536 клеток) с экспрессией BCAN и TNC, которые частично перекрывались с радиальной глией по экспрессии VIM и SOX2, что указывает на их переходный статус. Более зрелые глиальные популяции сформировали отчетливо разделенные кластеры клеток-предшественников олигодендроцитов (OPC; 11 483 клетки; OLIG1 и PDGFRA), олигодендроцитов (7908 клеток; PLP1 и MBP) и астроцитов (15 701 клетка; GFAP и AQP4). К прочим нейроэктодермальным популяциям относились эпендимальные клетки (2200 клеток; PIFO) и клетки хориоидного сплетения (2119 клеток; TTR), а также линия нервного гребня (НК), включающая клетки НК (10 036 клеток; SOX10 и MPZ) и нейроны происхождением из нервного гребня (6302 клетки; ISL1 и SIX1).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;scRNA-seq — метод секвенирования РНК одиночных клеток, позволяющий детально изучить экспрессию генов в каждой отдельной клетке и выявить редкие типы клеток.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Неэктодермальные популяции включали мезенхиму мезодермального происхождения (8052 клетки; DCN), эндотелий (228 клеток; CLDN5), микроглию (4876 клеток; CX3CR1) и небольшую группу других иммунных клеток (160 клеток; CD3D). Авторы также зафиксировали малочисленную популяцию, связанную со спинным мозгом или задним мозгом (480 клеток; CDX2 и CDX4) (Рис. 1D). Затем ученые проанализировали изменения клеточного состава и степени зрелости по всей временной шкале атласа — от PCW3 до 15,3 лет, визуализируя плотность пропорций классов клеток и динамику их долей (Рис. 1B, C; Рис. S1D). Данная динамика показала, что ранние эмбриональные образцы обогащены радиальной глией и клетками нервного гребня, тогда как на более поздних пренатальных этапах наблюдается относительное уменьшение количества радиальной глии, расширение пула ранних нейронов и появление глиальных предшественников, что согласуется с переходом от раннего нейрогенеза к глиогенным программам. Постнатальные образцы обогащены зрелыми нейронами и дифференцированными глиальными популяциями, включая астроциты и клетки олигодендроцитарной линии. Клетки нервного гребня и нейроны из него наблюдаются преимущественно на ранних эмбриональных стадиях.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Атлас HuDeHA объединил 658 059 клеток в 20 основных классов, показав смену клеточных популяций от радиальной глии на пренатальных стадиях до зрелых нейронов и глии в постнатальном периоде.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Возраст доноров из метаданных образцов был разделен на стадии развития и спроецирован на пространство вложений для демонстрации распределения стадий по клеточным популяциям (Рис. 1E, Рис. S1D). Оценка плотности клеток на основе метода Меллона выделила густо сэмплированные регионы, соответствующие основным популяциям, и более разреженные участки, соответствующие редким или переходным состояниям, таким как глиальные предшественники (Рис. 1F). Для прямой оценки потенциала развития исследователи рассчитали показатель потенции CytoTRACE2 (Рис. 1G; Рис. S1C). Вдоль нейрональной линии потенциал развития постепенно снижался от пролиферирующих предшественников и радиальной глии (медианные значения CytoTRACE2 составили 0,57 и 0,57 соответственно) через IPC (0,43) до ранних и зрелых нейронов (0,09 и 0,05 соответственно), что согласуется с поэтапной утратой потенциала развития в ходе нейрональной дифференцировки. Другие популяции с характеристиками предшественников, включая нервный гребь, мезенхиму и клетки спинного/заднего мозга, продемонстрировали высокие показатели потенции. Напротив, дифференцированные популяции постнатального периода, такие как олигодендроциты, астроциты и эпендимальные клетки, показали самые низкие значения потенции.&lt;/p&gt;\n&lt;h4 id=\"hudeha-pozvolyaet-sopostavlyat-dannye-organoidov-pri-fad-na-osnove-referensa\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#hudeha-pozvolyaet-sopostavlyat-dannye-organoidov-pri-fad-na-osnove-referensa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HuDeHA позволяет сопоставлять данные органоидов при fAD на основе референса&lt;/span&gt;&lt;/a&gt;HuDeHA позволяет сопоставлять данные органоидов при fAD на основе референса&lt;/h4&gt;\n&lt;p&gt;Для анализа был использован набор данных scRNA-seq мозговых органоидов, полученных из индуцированных плюрипотентных стволовых клеток (iPSC) от Perez-Corredor и соавт., который включал четыре генотипические группы на основе статуса PSEN1 и APOE: PSEN1WT/APOEWT, PSEN1WT/APOEChristchurch (APOECh), PSEN1E280A/APOEWT и PSEN1E280A/APOECh. Данный массив данных состоял из восьми библиотек scRNA-seq, созданных на основе восьми клеточных линий, полученных с помощью технологии CRISPR от двух доноров iPSC, причем перед секвенированием по шесть органоидов объединялись для каждой клеточной линии. Авторы применили scPoli — полуконтролируемый фреймворк референсного картирования на базе нейросетей, который вычисляет общее скрытое представление между референсными и исследуемыми клетками и переносит клеточные метки из референса на исследуемый набор данных (Рис. 2A). Модель обучалась на референсе HuDeHA и затем использовалась для аннотирования клеток в мозговых органоидах. Этот метод позволил выделить линии прогениторов, нейронов, эпителиальные/вентрикулярные, мезенхимальные и линии клеток нервного гребня (NC) (Рис. 2B). Дифференцированные глиальные, иммунные или сосудистые популяции на данном этапе обнаружены не были. Внутри нейрональной линии были идентифицированы промежуточные клетки-предшественники (IPCs), а также ранние и зрелые нейроны, хотя они были представлены крайне неравномерно: преобладали ранние нейроны (19 131 клетка) и радиальная глия (18 384 клетки), в то время как IPCs (1308 клеток) и зрелые нейроны (877 клеток) составляли лишь малые популяции. Популяция IPCs экспрессировала ASCL1 и HES6, что согласуется с ранним нейрогенным промежуточным состоянием, тогда как EOMES определялся менее чем в 1% клеток. Ранние нейроны уверенно экспрессировали TUBB3, STMN2 и DCX, а зрелые — GRIN2B и GRIA2 (Рис. 2C, D). Сильный сигнал S100B наблюдался и картировался преимущественно в компартменте NC (Рис. 2B, C), который также экспрессировал MPZ, FOXD3 и SOX10 (Рис. 2D) с дополнительным картированием в эпендимных клетках.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f2.jpg\" alt=\"Рисунок 2. Референтное сопоставление с HuDeHA позволяет сравнить полученные из iPSC мозговые органоиды с клеточными сост\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2. Референтное сопоставление с HuDeHA позволяет сравнить полученные из iPSC мозговые органоиды с клеточными состояниями гиппокампа in vivo и временем развития. (A) Схема рабочего процесса анализа. HuDeHA (от 3 PCW до 15,3 лет; 20 аннотированных классов клеток) служил референсом для переноса на основе scPoli меток классов клеток и возраста развития на человеческие мозговые органоиды iPSC PSEN1WT и PSEN1E280A. Модель scPoli была обучена на пересечении наборов генов между референсом и запросом (22 467 генов), а клетки органоидов были проецированы в изученное латентное пространство для предсказания меток. (B) UMAP человеческих мозговых органоидов из iPSC, окрашенный по 12 предсказанным классам клеток, выведенным из HuDeHA, с последующей ограниченной ручной коррекцией (см. Методы). Звездочки отмечают вновь определенные или агрегированные классы по отношению к HuDeHA: «ранняя эпендима» (добавлена вручную, отсутствует в HuDeHA) и «пролиферирующие предшественники» (совокупность пролиферирующей радиальной глии и пролиферирующих IPC). (C) Графики признаков (feature plots) выбранных региональных маркеров и маркеров линий по всему одноядерному эмбеддингу органоидов. PAX6 отмечал широкий дорсальный компартмент предшественников, GRIA2 — отдельную зрелую нейрональную популяцию, S100B преимущественно популяцию НК с дополнительной экспрессией в эпендимоподобных клетках, а WNT1 — небольшую дорсальную срединную популяцию, согласующуюся с идентичностью крыши или кортикального краля. (D) Точечный график экспрессии маркерных генов для предсказанных классов клеток органоидов: пролиферирующие предшественники (TOP2A, MKI67); радиальная глия (SOX2); IPC (ASCL1); ранние нейроны (TUBB3) и зрелые нейроны (GRIN2B); нейроны, производные НК (ISL1); глиальные предшественники (SOX9); ранняя эпендима (CFAP144) и эпендима (FOXJ1); сосудистое сплетение (TTR); НК (MPZ, FOXD3); мезенхима (DCN, PRRX1). (E) Тепловая карта сходства Жаккара между классами клеток HuDeHA и органоидов, вычисленная по 1500 лучшим дифференциально экспрессируемым (DE) генам на класс, количественно определяющая перекрытие между программами маркерных генов, специфичных для класса. (F) UMAP органоидов, окрашенный по выведенным возрастным бинам, агрегированным в стадии развития. (G) Распределение предсказуемого возраста развития по оси количества клеток в логарифмическом масштабе. Клетки охватывают широкую гетерогенность развития в момент сбора органоидов: большинство клеток картируется в диапазон PCW4–PCW9, с меньшей фракцией, отнесенной к постнатальным стадиям. (H) Тепловая карта пропорций классов клеток по предсказанным возрастным бинам. Классы, связанные с ранними стадиями (пролиферирующие предшественники, нейроны, производные НК), были обогащены более молодыми пренатальными возрастами, в то время как классы, связанные с более поздними стадиями (сосудистое сплетение, эпендима, зрелые нейроны, олигодендроциты), были...&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;scPoli (single-cell Polishing/Mapping) — это метод машинного обучения на основе нейросетей, который позволяет переносить информацию об аннотациях клеток из уже известного биологического атласа (референса) на новые экспериментальные данные (запрос).&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Несмотря на то, что модель в целом показала низкие показатели неопределенности аннотации, некоторые популяции, включая эпендиму, глиальные прогениторы и сосудистое сплетение, демонстрировали сравнительно большую неопределенность (Рис. S2A). Исследователи изучили канонические маркеры совместно с альтернативным встраиванием датасета органоидов. Анализ выявил обособленную популяцию, богатую CFAP, которая экспрессировала CFAP126, CFAP144, CFAP276, CFAP141 и CFAP90, но не имела четкого аналога в HuDeHA (Рис. S2B). В связи с этим данная популяция была добавлена как специфичный для органоидов класс и аннотирована как ранняя эпендима. Эти клетки экспрессировали FOXJ1 и частичную программу ресничкообразования, но не имели нескольких ключевых генов аксонемных динеинов и сборки ресничек. Эпендимоподобные клетки также частично перекрывались с маркерами сосудистого сплетения, что согласуется с неполной дифференцировкой вентрикулярного эпителия. Популяция глиальных прогениторов показала обогащение маркерами прогениторов крышечной пластинки / дорсальной средней линии, включая LMX1A/B, MSX1, GDF7 (Рис. S2C). Экспрессия генов семейства WNT дополнительно подчеркивала избирательную позитивность по WNT1/3A в этой популяции (Рис. 2C, Рис. S2C). Напротив, несколько канонических маркеров глиальных прогениторов in vivo, включая TNC, BCAN и NFIB, в органоидах экспрессировались слабо или отсутствовали вовсе (Рис. S2D). Радиальная глия также демонстрировала сниженную уверенность предсказания (Рис. S2A), что, вероятно, отражает гетерогенность состояний радиальной глии в органоидах; эти клетки экспрессировали ключевые маркеры радиальной глии SOX2 и NES, одновременно показывая частичное обогащение генами, связанными с глиальными прогениторами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Интеграция данных через HuDeHA выявила в органоидах преобладание ранних нейронов (19 131 клетка) и радиальной глии (18 384 клетки), а также позволила выделить специфическую популяцию ранней эпендимы, обогащенную генами CFAP и FOXJ1, которая отсутствовала в исходном референсе.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтобы оценить сходство между классами клеток in vivo и в органоидах независимо от аннотации на основе scPoli, авторы рассчитали две взаимодополняющие меры: коэффициент сходства Жаккара и корреляцию Пирсона. Сходство Жаккара, вычисленное по 1500 генам с наибольшей дифференциальной экспрессией (DEG) для каждого класса клеток, количественно оценивало перекрытие между специфическими для классов программами маркерных генов в HuDeHA и мозговых органоидах (Рис. 2E, Рис. S3A-C). Наибольшая конкордантность наблюдалась для мезенхимальных клеток, которые показали самое высокое парное сходство между органоидами и референтным атласом (Жаккар = 0,38). Ранние нейроны также продемонстрировали четкое транскрипционное перекрытие с соответствующей референтной популяцией (Жаккар = 0,32), что подтверждает сохранение основных нейрональных идентичностей в органоидах. Некоторые популяции, связанные с прогениторами, показали более широкое межклассовое сходство, а не строгое соответствие один к одному. Например, пролиферирующие прогениторы перекрывались с радиальной глией и пролиферирующими прогениторами в органоидах (Жаккар = 0,32 и 0,29 соответственно), что согласуется с общими программами пролиферативных и нейрогенных маркеров. Популяция ранней эпендимы показала единообразно низкое сходство со всеми референтными классами, что подтверждает ее классификацию как обогащенной в органоидах или атипичной популяции, плохо представленной в развивающемся атласе гиппокампа. В качестве контроля специфичности авторы включили референтные популяции, которые не предсказывались в органоидах, включая астроциты, OPCs, олигодендроциты и микроглию, и не обнаружили сильного сходства ни с одной популяцией органоидов (Рис. S3B). Дополнительные анализы на основе согласия Пирсона, Спирмена и Кендалла для различных наборов генов подтвердили ту же закономерность (Рис. S3D-F). Мезенхимальные клетки и ранние нейроны показали наибольшее транскрипционное сходство с референтным атласом, в то время как эпендима, сосудистое сплетение и ранние эпендимные популяции демонстрировали более низкое или вариабельное сходство, что согласуется с частичным отклонением этих состояний органоидов от референса in vivo.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Сравнение транскрипционных профилей выявило частичное расхождение между состояниями клеток в органоидах и референсом in vivo, в частности для эпендимных и сосудистых популяций, что указывает на неполное воспроизведение их фенотипов in vitro.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторы применили алгоритм scPoli, опираясь на возрастные аннотации HuDeHA, чтобы оценить сходство органоидов с различными стадиями развития в датасете fAD (Рис. 2F). Прогнозируемые состояния охватывали диапазон от ранних пренатальных до постнатальных этапов, демонстрируя умеренную организацию по возрасту в пространстве встраивания. Большая часть клеток органоидов соответствовала ранним пренатальным стадиям, в частности PCW4–PCW9, тогда как около 1% клеток относились к периоду PCW11 и более поздним этапам, включая постнатальный возраст (Рис. 2G). Распределение долей клеток по возрастным группам для каждого типа клеток было визуализировано в виде тепловой карты (Рис. 2H) и соответствовало ожидаемой логике развития: ранние возрасты прогнозировались преимущественно для прогениторных и не нейрональных популяций (пролиферирующие прогениторы, мезенхимальные и нервного гребня клетки), тогда как поздние и постнатальные стадии концентрировались среди дифференцированных клеток, таких как зрелые нейроны и эпендимоподобные структуры.&lt;/p&gt;\n&lt;h4 id=\"psen1e280a-organoidlari-uzhajralar-tarkibi-va-transkripcion-profillari-bjicha-farkhlanadi\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#psen1e280a-organoidlari-uzhajralar-tarkibi-va-transkripcion-profillari-bjicha-farkhlanadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PSEN1E280A органоидлари ҳужайралар таркиби ва транскрипцион профиллари бўйича фарқланади&lt;/span&gt;&lt;/a&gt;PSEN1E280A органоидлари ҳужайралар таркиби ва транскрипцион профиллари бўйича фарқланади&lt;/h4&gt;\n&lt;p&gt;Исследователи изучили состав основных типов клеток в органоидах PSEN1E280A по сравнению с PSEN1WT (Рис. 3A-B). Оценку пропорций проводили с использованием Bayesian-платформы scCODA для анализа различий в составе счетных данных одиночных клеток (Рис. 3B). Анализ выявил достоверное увеличение доли нейронов нервного гребня и уменьшение количества радиальной глии у мутантных органоидов по сравнению с диким типом. Сопоставление предсказанного возраста внутри клеточных классов (Рис. 3C) подтвердило общую закономерность дифференцировки. Расчет коэффициента Cliff’s delta показал, что пролиферирующие прогениторы и нейроны нервного гребня в органоидах PSEN1E280A имеют более молодой предсказанный возраст по сравнению с WT: соответственно 5.5 против 6.7 PCW и 5.7 против 7.4 PCW, в то время как остальные типы клеток демонстрировали минимальные расхождения.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f3.jpg\" alt=\"Рисунок 3. PSEN1E280A связан с нарушением баланса линий и специфичным для классов клеток дисрегулированием нейрональной \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3. PSEN1E280A связан с нарушением баланса линий и специфичным для классов клеток дисрегулированием нейрональной спецификации, программ предшественников и желудочков. (A) UMAP мозговых органоидов, разделенных по условиям (n = 2 для органоидов PSEN1WT и n = 6 для PSEN1E280A), окрашенный по предсказанному классу клеток, показывающий различия в распределении классов клеток между условиями. (B) Столбчатые диаграммы с накоплением, показывающие процентный состав каждого класса клеток по условиям. Звездочки указывают на классы клеток со значимо различающейся относительной численностью между условиями. По сравнению с органоидами WT, органоиды PSEN1E280A показали увеличенную долю нейронов, производных НК, и сниженную долю радиальной глии. Таблица справа дает точный процент каждого класса клеток в каждом условии. (C) Тепловая карта среднего предсказанного возраста развития по классам клеток, упорядоченная по убыванию среднего значения по объединенному набору данных. Звездочки отмечают классы клеток со значительными возрастными различиями между условиями, оцененными с помощью дельты Клиффа. Пороговые значения: скорректированное p-значение ≤ 0,05. (D) Дифференциально экспрессируемые гены в органоидах PSEN1 E280A по сравнению с WT, детализированные по классам клеток. Гены с повышенной экспрессией показаны красным, с пониженной — зеленым; классы клеток упорядочены по убыванию общего количества DE-генов. 10 наиболее информативных генов на класс подписаны; ось log2FC масштабирована для визуализации. Пороговые значения: скорректированное p-значение ≤ 0,05, /log2FC/ ≥ 0,5.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f3-2.jpg\" alt=\"Рис. 3 (продолжение 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 3 (продолжение 2)&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мутантные органоиды PSEN1E280A демонстрируют сдвиг в сторону более молодого предсказанного возраста для прогениторов (5.5 против 6.7 PCW) и нейронов нервного гребня (5.7 против 7.4 PCW), а также изменения в соотношении клеточных популяций.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ дифференциальной экспрессии выявил наибольшее число дифференциально экспрессируемых генов (DEG) в клетках нервного гребня, нейронах нервного гребня и хориоидном сплетении (Рис. 3D). Среди повторяющихся изменений ген MEIS2 экспрессировался выше в зрелых и ранних нейронах, IPC и глиальных прогениторах, а MEIS1 — преимущественно в зрелых нейронах. Экспрессия NR2F1 возросла в зрелых, ранних нейронах и клетках нервного гребня, а TAC1 — в зрелых и ранних нейронах. В нейронах нервного гребня наблюдалось сильное повышение уровней HES6, NEUROD1 и NFIA. Прогениторные популяции также показали специфические изменения: пролиферирующие прогениторы характеризовались повышенными S100B, LGALS1, S100A10 и сниженными SLIT2, TENM2; радиальная глия — повышенными S100B, APOE и сниженным RSPO2; глиальные прогениторы — сниженными WNT2B, WNT4. У IPC отмечены повышенные MEIS2, ID1, ID3, DDIT4 и сниженные DCC, TENM2, TENM3, PCDH9, CADM2. Гены адгезии и аксонального наведения (CNTNAP2, ROBO1, гены семейства EPH) изменялись в различных популяциях. В структурах желудочковой зоны обнаружено снижение TTR в хориоидном сплетении и эпендимальных клетках. В хориоидном сплетении снижались IGF1 и RSPO2, но рос FOLR1. Ранние эпендимальные клетки показали рост CCNO, а эпендимальные — рост MSX1 и одновременное снижение митохондриальных транскриптов (MT-CO1, MT-CO2, MT-CO3, MT-CYB, MT-ATP6). Полный список DEG приведен в Таблице S2.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;scCODA — байесовский статистический метод для поиска изменений в пропорциях клеточных типов по данным scRNA-seq, а Cliff’s delta — непараметрическая мера размера эффекта для сравнения распределений возраста.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сравнение обогащения путей между органоидами PSEN1E280A и WT показало наибольшие различия в пролиферирующих прогениторах, где для мутации было характерно снижение показателей, связанных с WNT-путем (Рис. S4A). Сопоставление с референсными клетками HuDeHA из соответствующих по возрасту стадий (Рис. S4B) подтвердило, что дифференцированные нейрональные популяции широко перекрываются, тогда как пролиферирующие прогениторы четко дивергируют, демонстрируя пониженные WNT-сигналы в органоидах PSEN1E280A по сравнению как с WT, так и с референсом HuDeHA.&lt;/p&gt;\n&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;p&gt;Мы создали справочный Атлас развивающегося гиппокампа человека (HuDeHA), охватывающий период от 3 недель постменструального возраста (PCW 3) до 15.3 лет. Этот широкий временной диапазон фиксирует ключевые переходы от раннего эмбрионального нейрогенеза до пренатального развития гиппокампа и постнатального созревания. Существующие референсы ограничены узким возрастным окном: одни охватывают только фетальные стадии, другие — лишь постнатальное разнообразие глии, а объединение таких разнородных данных представляет сложность. Для расширения покрытия ранних этапов мы включили пренатальные данные из исследований более широких областей мозга, отфильтровав клетки гиппокампа, что увеличило выборку. Интегрировав множество наборов данных, HuDeHA дает полное представление о нейронах, прогениторах, глии, сосудистых, иммунных и желудочковых/эпителиальных популяциях. Это позволяет сопоставлять клеточные идентичности и состояния созревания, аннотировать ин витро модели и находить траектории, нарушенные при патологиях в органоидах.&lt;/p&gt;\n&lt;p&gt;Используя HuDeHA, мы выяснили, что органоиды мозга из iPSC с мутацией PSEN1 E280A при семейной форме болезни Альцгеймера (fAD) воспроизводят раннее эмбриональное развитие, причем большинство клеток соответствуют примерно PCW 5-9. Эта идентичность первого триместра согласуется с богатым прогениторами составом неконтролируемых церебральных органоидов и их ограниченным сходством с более поздними фетальными состояниями.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Созданный атлас HuDeHA охватывает возраст от PCW 3 до 15.3 лет и показывает, что органоиды с мутацией PSEN1 E280A застревают на стадии раннего эмбрионального развития, соответствующей PCW 5-9.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sopostavlenie-s-referensom-vyyavlyaet-divergentnye-i-specifichnye-dlya-organoidov-populyacii\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#sopostavlenie-s-referensom-vyyavlyaet-divergentnye-i-specifichnye-dlya-organoidov-populyacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сопоставление с референсом выявляет дивергентные и специфичные для органоидов популяции&lt;/span&gt;&lt;/a&gt;Сопоставление с референсом выявляет дивергентные и специфичные для органоидов популяции&lt;/h4&gt;\n&lt;p&gt;Аннотация на основе HuDeHA показала, что органоиды мозга содержат выраженную нейрональную линию, а также компартменты клеток, похожих на нервный гребень, и мезенхимальные элементы, в то время как дифференцированная глия на этой стадии не обнаружена. Хотя клетки нервного гребня могут казаться неожиданными, прошлые одиночные исследования фиксировали внецелевые ненейральные клетки в протоколах органоидов. Наблюдаемый компартмент нервного гребня может отражать неполное региональное ограничение или экспансию ненейральных состояний, а не мутационный фенотип. В нейрональной линии преобладали радиальная глия и ранние нейроны, тогда как промежуточные клетки-предшественники (IPCs) и зрелые нейроны составляли лишь малые популяции, что отражает стадию модели. Химерные профили транскрипции усложняют аннотацию, и понимание сходства с ин витро референсом критично. Так, популяции, похожие на сосудистое сплетение и эпендиму, показали ограниченное сходство с референсом HuDeHA, что согласуется с неполным созреванием желудочковых клеток в органоидах. Мы также выделили обильную популяцию незрелого желудочкового эпителия с частичной активацией программы цилиогенеза, но без четкого аналога в HuDeHA. Ее скромная экспрессия FOXJ1 и отсутствие ключевых генов аксонем и сборки динеина указывают на специфичное для органоидов раннее цилиогенное состояние, а не на зрелую эпендиму. Популяции глиальных прогениторов также продемонстрировали ограниченное сходство с ин витро аналогами. Детальный анализ выявил экспрессию маркеров крышечной пластинки (roof plate) и коркового хема, предполагая, что эта популяция представляет сигнальное состояние, похожее на корковый хем или область рядом с сосудистым сплетением.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Органоиды мозга демонстрируют наличие внецелевых популяций (клетки нервного гребня, мезенхима) и незрелость желудочковых и глиальных структур, что говорит об ограничениях текущих протоколов дифференцировки in vitro, а не о прямых эффектах мутаций.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"traektornyj-analiz-nejronov-vyyavlyaet-narushennoe-razvitie\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#traektornyj-analiz-nejronov-vyyavlyaet-narushennoe-razvitie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Траекторный анализ нейронов выявляет нарушенное развитие&lt;/span&gt;&lt;/a&gt;Траекторный анализ нейронов выявляет нарушенное развитие&lt;/h4&gt;\n&lt;p&gt;Анализ траекторий нейронной линии клеток позволил сопоставить динамику созревания между генотипами и выявить потенциальные генетические программы, связанные с нарушением развития. В нашем наборе данных мутация PSEN1E280A коррелировала со сдвигом клеток в сторону более продвинутых состояний на траектории нейронного созревания. В этих поздних состояниях наблюдалась повышенная экспрессия генов, отвечающих за дифференцировку нейронов, формирование аксонов и дендритов, а также организацию синапсов. Такой результат согласуется с ранними работами, демонстрирующими, что отдельные мутации при семейной болезни Альцгеймера способны стимулировать преждевременную дифференцировку нейронов или ускорять выход клеток из пула предшественников. В то же время в других исследованиях описывалась противоположная картина, например, задержка предшественников и подавление нейрогенеза для мутации PSEN1L435F. Подобные противоречия указывают на то, что влияние мутаций в гене PSEN1 на развитие нейронов зависит от конкретной мутации, модели и стадии процесса. Важно отметить, что зафиксированный сдвиг отражает лишь относительное ускорение внутри траектории органоида, а не достижение полноценного зрелого нейронального фенотипа. В целом наши данные показывают, что мутация PSEN1E280A приводит к нарушению баланса клеточных состояний в мозговых органоидах, затрагивая популяции предшественников, нейронов, клетки с признаками нервного гребня и вентрикулярного эпителия. Инструмент HuDeHA помог разграничить нейронные состояния, релевантные гиппокампу, и специфичные для органоидов популяции, а также оценить изменения при мутации в контексте развития мозга человека in vivo. В совокупности эти результаты подчеркивают пользу сопоставления с референтными данными для точной интерпретации органоидных моделей и изучения клеточных патологий.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мутация PSEN1E280A сдвигает клетки органоидов к более продвинутым стадиям созревания с активацией генов дифференцировки и синапногенеза, нарушая нормальный клеточный баланс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ogranicheniya\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения&lt;/span&gt;&lt;/a&gt;Ограничения&lt;/h4&gt;\n&lt;p&gt;Что касается ограничений нашей работы, набор данных органоидов включал всего два образца PSEN1WT и шесть образцов PSEN1E280A из одного ранее опубликованного исследования, что снижает статистическую мощность и не позволяет полностью отделить эффекты мутации от вариабельности между самими органоидами. Кроме того, зафиксированное увеличение численности популяций нейрального гребня может отчасти объясняться особенностями примененного протокола дифференцировки, а не являться прямым следствием самой мутации PSEN1E280A.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анализ ограничен малой выборкой (два контроля и шесть мутантных органоидов из одного источника), а изменения популяций клеток могут зависеть от протокола выращивания.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"sbor-dannyh\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#sbor-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сбор данных&lt;/span&gt;&lt;/a&gt;Сбор данных&lt;/h4&gt;\n&lt;p&gt;Проект HuDeHA охватывает стадии онтогенеза от 3 недель после зачатия (PCW3) до 15.3 лет. Исходные открытые наборы данных были разделены на три категории по возрасту и анатомическим характеристикам: раннее развитие, пренатальный гиппокамп и постнатальный гиппокамп, причем каждая группа интегрировалась отдельно. Ранние данные фильтровались для отбора клеток головного мозга, переднего мозга и гиппокампа, тогда как пренатальные и постнатальные группы ограничивались тканями гиппокампа. Подмножества разделялись по оригинальным батчам (партиям), обрабатывались как отдельные объекты и объединялись для создания HuDeHA. Группа раннего развития включала 70 батчей и 476 237 клеток из трех опубликованных работ. Пренатальный набор данных состоял из 15 батчей и 48 679 клеток из трех исследований. Постнатальный набор содержал 22 батча и 133 143 клетки из двух работ. Подробные метаданные по каждому батчу приведены в Таблице S1. На ранних этапах специфические ткани гиппокампа выделялись не всегда, поэтому группа раннего развития включала образцы всего тела, головы, мозга и ганглиозных возвышений. После раздельной интеграции данные консервативно фильтровались по маркерам развития, регионов и линий клеток для выделения популяций мозга, переднего мозга и гиппокампа. Данные по ганглиозным возвышениям добавили для улучшения представления клеток-предшественников тормозных нейронов, поскольку гиппокампальные ГАМК-эргичные интернейроны мигрируют туда из этих зон во время развития. Такая стратегия отбора позволила сформировать непрерывный атлас развития, объединяющий гиппокампальные клеточные популяции из периодов, которые не полностью представлены в специфических гиппокампальных наборах.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Батчи (batches) — это отдельные партии экспериментов или секвенирования, которые объединяют с помощью математических алгоритмов, чтобы убрать технические различия между лабораториями.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"obrabotka-individualnyh-obuektov\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#obrabotka-individualnyh-obuektov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обработка индивидуальных объектов&lt;/span&gt;&lt;/a&gt;Обработка индивидуальных объектов&lt;/h4&gt;\n&lt;p&gt;Каждый набор данных обрабатывался независимо с использованием пакета Seurat (v4.3.0). Каждый образец рассматривался как отдельный объект Seurat. Контроль качества (QC) проводился по следующим пороговым значениям: доля митохондриальных генов percent.mt &amp;lt; 30%, доля рибосомных генов percent.rb &amp;lt; 40%, количество молекул nCount_RNA &amp;gt; 300 и число обнаруженных генов nFeature_RNA &amp;gt; 400. Верхние пороги для генов и молекул определялись индивидуально для каждого набора. После контроля качества данные нормализовались, вариабельные признаки определялись через FindVariableFeatures(selection.method = \"vst\", nfeatures = 3000), а шкалирование выполнялось с регрессией переменных vars.to.regress = c(\"percent.mt\", \"percent.rb\", \"S.Score\", \"G2M.Score\"). Оценки клеточного цикла рассчитывались функцией CellCycleScoring() с набором генов cc.genes.updated.2019. Для удаления возможных дублетов применялся пакет DoubletFinder (v2.0.3). Параметр доли обнаружения (pK) оптимизировался для каждого объекта перебором значений с помощью paramSweep_v3 с выбором значения с наибольшей метрикой бинарной классификации (BCmetric) через find.pK. Ожидаемая доля дублетов устанавливалась на уровне 5% от общего числа клеток с поправкой на необнаруживаемые гомотипичные дублеты по оценкам modelHomotypic. После удаления дублетов каждый объект Seurat обрабатывался повторно.&lt;/p&gt;\n&lt;h4 id=\"sborka-promezhutochnyh-atlasov-stadiya-rannego-razvitiya\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#sborka-promezhutochnyh-atlasov-stadiya-rannego-razvitiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сборка промежуточных атласов Стадия раннего развития&lt;/span&gt;&lt;/a&gt;Сборка промежуточных атласов Стадия раннего развития&lt;/h4&gt;\n&lt;p&gt;Для выделения раннего гиппокампа на стадии раннего развития данные были разделены на 3 группы: образцы всего тела и головы совместно (PCW3–8), весь мозг (PCW7–12) и ганглиозные возвышения раздельно (PCW7–16). Образцы всего тела и головы были интегрированы вместе, после чего из них отобраны клетки мозга. Наборы данных всего мозга интегрировались отдельно и использовались для отбора популяций гиппокампа и соседнего теленцефалона. Данные ганглиозных возвышений обрабатывались как отдельный компартмент и позже включались в общую интеграцию.&lt;/p&gt;\n&lt;h4 id=\"vse-telo-vsya-golova\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#vse-telo-vsya-golova\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;• Все тело + вся голова&lt;/span&gt;&lt;/a&gt;• Все тело + вся голова&lt;/h4&gt;\n&lt;p&gt;Наборы данных всего тела и головы (PCW3–8) были интегрированы совместно, после чего полученный объект был ограничен клетками мозга. В качестве первоначальной стратегии применялся референсный маппинг всего мозга с помощью MapMyCells (RRID:SCR_024672) с оценкой вероятностей предсказанных классов по порогам 0.75 и 0.99. Хотя более строгий порог (0.99) давал чуть более четкое разделение предсказанных популяций мозга и не-мозга, общее качество разделения осталось субоптимальным. Поэтому данный подход был дополнен литературоведческими маркерами раннего развития мозга — SOX2, VIM, HES1/HES5, PAX6, NES — для уточнения специфического подмножества мозга.&lt;/p&gt;\n&lt;h4 id=\"ves-mozg\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#ves-mozg\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;• Весь мозг&lt;/span&gt;&lt;/a&gt;• Весь мозг&lt;/h4&gt;\n&lt;p&gt;Наборы данных всего мозга (PCW7–12) были интегрированы совместно, после чего данные были ограничены популяциями переднего мозга и гиппокампа на основе установленных маркерных генов, включая ZBTB20, CALB1, FOXG1, PAX6, LHX5, EMX2, OTX2, NKX2-1.&lt;/p&gt;\n&lt;h4 id=\"ganglionic-eminences\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#ganglionic-eminences\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ganglionic eminences&lt;/span&gt;&lt;/a&gt;Ganglionic eminences&lt;/h4&gt;\n&lt;p&gt;Все доступные наборы данных по ганглиозным бугоркам (ganglionic eminences, GE) за период 7–16 недель постнатального возраста (PCW7–16) были объединены, после чего для каждой отдельной клетки с помощью алгоритма CytoTRACE2 с настройками по умолчанию определялся потенциал дифференцировки. Авторы протестировали метод аннотации клеток GE на основе существующих эталонных данных из открытых источников. Поскольку полученные результаты плохо согласовывались с экспрессией классических маркерных генов и ожидаемой региональной принадлежностью, от этого подхода отказались. Чтобы выделить популяцию клеток-предшественников и снизить долю уже дифференцированных клеток происходящих из GE, для дальнейшего анализа отбирались только те клетки, которые CytoTRACE2 классифицировал как мультипотентные (CytoTRACE2_Potency == \"Multipotent\").&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CytoTRACE2 — это вычислительный инструмент для оценки дифференцировочного потенциала и степени зрелости отдельных клеток на основе данных экспрессии генов без необходимости знания меток времени.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"prenatal,-postnatal-stages\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#prenatal,-postnatal-stages\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Prenatal, postnatal stages&lt;/span&gt;&lt;/a&gt;Prenatal, postnatal stages&lt;/h4&gt;\n&lt;p&gt;Наборы данных пренатального и постнатального периодов развития гиппокампа обрабатывались и интегрировались раздельно. До начала финальной интеграции из массивов данных удаляли посторонние клеточные популяции, включая эритроциты, идентифицируя их по специфическому профилю экспрессии маркерных генов.&lt;/p&gt;\n&lt;h4 id=\"hudeha-integration\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#hudeha-integration\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HuDeHA integration&lt;/span&gt;&lt;/a&gt;HuDeHA integration&lt;/h4&gt;\n&lt;p&gt;После промежуточной интеграции данных раннего развития, а также пренатального и постнатального этапов из общей массы были выделены подмножества клеток, обогащенные структурами гиппокампа. Полученные данные разделили по исходным батчам (партиям) и заново обработали как отдельные объекты, что в итоге сформировало 107 батчей, которые затем объединили для построения единого атласа HuDeHA. Для финальной интеграции модель scVI обучалась на 3 000 высоко вариабельных генах, где в качестве параметра &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0pp2srtc\"&gt;batch_key&lt;/code&gt; задавался исходный батч. В процессе подбора гиперпараметров тестировались различные комбинации: 128 или 256 скрытых единиц, от одного до трех скрытых слоев, 20, 30 или 40 латентных измерений, а также максимальная продолжительность обучения в 100 или 300 эпох. Окончательная архитектура модели включила три скрытых слоя, 256 скрытых единиц и 30 латентных измерений; этот вариант выбрали на основе минимальных потерь на валидации (validation loss), подтвержденных анализом кривых обучения и валидации, оценкой по метрикам scIB, а также характером распределения экспрессии генов в пространстве вложения. Финальная модель обучалась в течение максимум 100 эпох с активированной функцией ранней остановки (early stopping), отслеживая потери на валидации с запасом (patience) в пять эпох. Клеточные популяции в латентном пространстве scVI первоначально аннотировались при помощи вручную отобранного списка маркерных генов. Затем обученная модель scVI была преобразована в модель scANVI, используя первичные аннотации в качестве подсказок (supervision) и сохраняя исходную архитектуру сети. Инструмент scANVI применялся для уточнения и распространения клеточных меток на весь массив данных, включая клетки, которые остались без аннотаций после первого этапа на основе маркеров.&lt;/p&gt;\n&lt;h4 id=\"data-preprocess-and-filtering\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#data-preprocess-and-filtering\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data preprocess and filtering&lt;/span&gt;&lt;/a&gt;Data preprocess and filtering&lt;/h4&gt;\n&lt;p&gt;Исходные данные были получены из репозитория GEO под номером GSE241453. Обработка каждого образца проводилась по единому алгоритму, включающему контроль качества по митохондриальным и рибосомным генам, удаление дуплетов, оценку фаз клеточного цикла и нормализацию. Интеграция датасетов выполнялась с помощью стандартного конвейера Seurat v.4. После первичной аннотации был выявлен один кластер Seurat с высоким уровнем митохондриальных генов, что указывает на низкое качество или стрессовое состояние клеток. В результате из анализа были исключены 9359 таких клеток, после чего оставшийся массив данных был повторно интегрирован в Seurat с использованием 30 главных компонент (30 PC). Для ручной доработки клеточных классов также было построено альтернативное вложение scVI с параметрами: число слоев (&lt;span class=\"yfm-latex\" data-content=\"n%5C_layers%20%3D%202\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;), размерность латентного пространства (&lt;span class=\"yfm-latex\" data-content=\"n%5C_latent%20%3D%2020\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;) и количество узлов в скрытом слое (&lt;span class=\"yfm-latex\" data-content=\"n%5C_hidden%20%3D%20128\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;). Полученное представление применялось для уточнения меток клеточных классов, ранее перенесенных алгоритмом scPoli. Уточнение проводилось путем комплексной оценки перенесенных меток, структуры кластеров в латентном пространстве scVI и экспрессии канонических маркерных генов (Рис. S2F-G).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;scVI и scPoli — это современные алгоритмы машинного обучения для анализа данных одиночных клеток (single-cell RNA-seq), которые помогают объединять разные образцы и точно определять типы клеток.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Cell class mapping&lt;/p&gt;\n&lt;p&gt;Для переноса аннотаций клеточных классов из референсного атласа в наш датасет мозговых органоидов использовался алгоритм scPoli с определенной процедурой подготовки и обучения. Сперва была унифицирована детализация типов клеток в референсе и целевом наборе данных путем объединения близких подтипов: пролиферативные предшественники радиальной глии (IPC proliferating и Radial glia proliferating) были объединены в общую группу пролиферативных предшественников (Proliferating progenitors), нейроны Кахаля — Ретциуса (CR neurons) объединены со зрелыми нейронами (Mature neurons), а иммунные клетки и микроглия — в микроглию (Microglia). Чтобы снизить риск переобучения и обеспечить сопоставимость пространства признаков, фильтрация низкоэкспрессирующихся генов выполнялась раздельно для референса и органоидов, после чего анализ был ограничен 22467 генами, присутствующими в обоих наборах. Модель scPoli обучалась со следующими гиперпараметрами: размерность эмбеддинга 10, латентная размерность 20, один скрытый слой на 128 нейронов и функция потерь отрицательного биномиального распределения для реконструкции. Ранняя остановка обучения контролировалась по потерям на валидационном наборе прототипов в режиме минимизации с терпением в 20 эпох. Скорость обучения снижалась при достижении плато с терпением в 13 эпох и коэффициентом уменьшения 0.1. Для дальнейшей работы сохранялся контрольной снимок модели с наименьшими потерями на валидации.&lt;/p&gt;\n&lt;p&gt;Developmental age mapping&lt;/p&gt;\n&lt;p&gt;Чтобы выровнять временное разрешение и уменьшить дисбаланс классов, стадии развития с малым количеством клеток были объединены в более крупные интервалы: PCW23 и PCW25 как PCW23–25; 0.1–4.3 года; 6–6.7 лет; 13–15.3 года. Подобное объединение позволило сбалансировать частоту возрастных категорий в референсном атласе. Поскольку точный возраст развития для клеток органоидов неизвестен, дальнейший анализ ограничивался только высоконадёжными предсказаниями: отбирались клетки с максимальной апостериорной вероятностью класса не менее 0.75. Прогнозирование возраста развития осуществлялось с помощью той же архитектуры модели scPoli и тех же параметров обучения, где в качестве контролируемой метки выступала группа возрастов развития.&lt;/p&gt;\n&lt;p&gt;Compositional analysis&lt;/p&gt;\n&lt;p&gt;Различия в клеточном составе между органоидами с мутацией PSEN1E280A (MUT; n = 6) и органоидами дикого типа (WT; n = 2) оценивались с помощью scCODA — байесовской модели, разработанной для анализа композиционных данных одинарных клеток. Автоматический выбор референса в scCODA определил зрелые нейроны (Mature Neurons) в качестве базового клеточного класса. Поскольку эта популяция относительно малочисленна, устойчивость результатов к выбору референса проверялась путем повторного расчета, где каждый из оставшихся клеточных классов по очереди выступал в роли базового. Оцененные эффекты для радиальной глии и нейронов, происходящих из гребня нервной трубки (NC-derived neurons), оставались стабильными независимо от выбора референса.&lt;/p&gt;\n&lt;p&gt;Developmental age comparison in brain organoids&lt;/p&gt;\n&lt;p&gt;Для сопоставления предсказанного возраста развития между органоидами PSEN1E280A и PSEN1WT анализ проводился отдельно внутри каждого клеточного класса. Значения предсказанного возраста были переведены в непрерывную числовую шкалу и сравнивались между генотипами с использованием двустороннего U-критерия Манна — Уитни. Клеточные классы, представленные менее чем 10 клетками в любой из групп генотипа, исключались из статистической проверки. Значения p корректировались на множественное тестирование по всем клеточным классам с помощью метода Бенджамини — Хохберга для контроля уровня ложных обнаружений (FDR). Величина эффекта оценивалась с помощью дельты Клиффа, где положительные значения указывали на более старший предсказанный возраст развития у клеток PSEN1E280A по сравнению с клетками WT. Уровень скорректированного p &amp;lt; 0.05 принимался в качестве порога статистической значимости.&lt;/p&gt;\n&lt;p&gt;Differential expression in HuDeHA and brain organoids&lt;/p&gt;\n&lt;p&gt;Анализ дифференциальной экспрессии между мозговыми органоидами PSEN1E280A и PSEN1WT выполнялся отдельно для каждого клеточного класса с использованием функции Seurat FindMarkers. Внутри каждого класса клетки разделялись по условиям эксперимента, а проверка дифференциальной экспрессии осуществлялась с помощью теста суммы рангов Уилкоксона. Дифференциально экспрессируемыми генами считались те, которые имели абсолютное значение логарифма кратности изменения по основанию 2 (&lt;span class=\"yfm-latex\" data-content=\"%5Clog_2%5Ctext%7Bfold%20change%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;) ≥ 0.5 и скорректированное значение p &amp;lt; 0.05.&lt;/p&gt;\n&lt;p&gt;Pathway enrichment in HuDeHA and brain organoids&lt;/p&gt;\n&lt;p&gt;Для анализа обогащения путей мы использовали метод ssGSEA на основе отобранного набора генов из коллекций GO и HP (из базы MSigDB C5), связанных с сигнальными путями Notch и WNT, дифференцировкой нейронов и глии, а также определением судьбы клеток. Индивидуальные показатели обогащения для каждой клетки вычислялись с помощью пакета escape v.1.10.0 через функцию enrichIt со стандартными параметрами. Чтобы сравнить мозговые органоиды с набором HuDeHA, клетки референсного атласа были ограничены возрастными интервалами, предсказанными в датасете органоидов, и проанализированы внутри соответствующих клеточных классов. Это позволило минимизировать влияние стадий развития и сопоставить активность путей в более близких клеточных контекстах.&lt;/p&gt;\n&lt;h4 id=\"jaccard-similarity\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#jaccard-similarity\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Jaccard similarity&lt;/span&gt;&lt;/a&gt;Jaccard similarity&lt;/h4&gt;\n&lt;p&gt;Для оценки транскрипционного сходства между эталонным атласом клеток человека HuDeHA и мозговыми органоидами по сопоставимым классам клеток или стадиям развития авторы использовали коэффициент Жаккара на основе специфических наборов маркерных генов. Дифференциальная экспрессия рассчитывалась независимо для каждого датасета с помощью библиотеки scanpy и функции scanpy.tl.rank_genes_groups с использованием U-критерия Манна — Уитни (Wilcoxon rank-sum test). Гены ранжировались по статистическому критерию Scanpy, после чего для каждого клеточного класса или временной группы отбирался топ n генов, формирующих маркерный набор. В анализ включались исключительно гены, детектированные в обоих сравниваемых наборах данных. Коэффициент сходства Жаккара J(G₁, G₂) для каждой пары сопоставленных групп HuDeHA и органоидов определялся как отношение пересечения множеств G₁ и G₂ к их объединению.&lt;/p&gt;\n&lt;p&gt;Транскрипционное сходство на уровне обобщенных профилей экспрессии оценивалось с использованием четырех различных наборов признаков: 3 000 высоковариабельных генов (HVG), выявленных в HuDeHA, 3 000 HVG из датасета органоидов, пересечения этих двух наборов, составившего 944 гена, и их объединения, включившего 5 056 генов. Для каждого гена в каждом клеточном классе вычислялась средняя нормированная экспрессия, а попарная корреляция между HuDeHA и органоидами измерялась с помощью коэффициентов корреляции Пирсона, Спирмена и Кендалла.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Коэффициент Жаккара — это простая метрика совпадения элементов двух множеств, которая делит размер их общего пересечения на размер полного объединения, помогая понять, насколько похожи наборы маркерных генов в разных моделях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"cell-fates-trajectory-inference\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#cell-fates-trajectory-inference\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cell fates trajectory inference&lt;/span&gt;&lt;/a&gt;Cell fates trajectory inference&lt;/h4&gt;\n&lt;p&gt;Для сопоставления траекторий нейрональной дифференцировки между HuDeHA и органоидами исследователи выделили популяции нейрональной линии, включая промежуточные клетки-предшественницы (IPCs), ранние нейроны и зрелые нейроны. Чтобы устранить дисбаланс в численности клеток между эталонным атласом и органоидами, подмножество нейрональной линии HuDeHA было случайным образом уменьшено (downsampling) до 18 000 клеток, что близко соответствует 17 296 клеткам нейрональной линии в органоидах. Процедура проводилась с использованием фиксированного случайного зерна (random seed) для обеспечения полной воспроизводимости.&lt;/p&gt;\n&lt;p&gt;Реконструкция траекторий выполнялась на базе латентного представления scVI с целью минимизации влияния технических шумов и батч-эффектов. На первом этапе исследователи применили алгоритм Palantir для построения граф-структуры из 30 ближайших соседей (k-nearest-neighbor) и расчета компонент диффузии при параметре neigs = 2. Оценка псевдовремени и визуализация траекторий осуществлялись с помощью пакета scFates. Для графического отображения использовалась раскладка ForceAtlas2, инициализированная по первым двум компонентам траекторного пространства.&lt;/p&gt;\n&lt;h4 id=\"cell-potency-and-density-analysis\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#cell-potency-and-density-analysis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cell potency and density analysis&lt;/span&gt;&lt;/a&gt;Cell potency and density analysis&lt;/h4&gt;\n&lt;p&gt;Клеточный потенциал (потенция) в датасетe HuDeHA оценивался по профилям одиночных клеток (scRNA-seq) с помощью инструмента CytoTRACE2 при стандартных параметрах. Плотность клеточных состояний рассчитывалась с использованием программы Mellon для всех клеток HuDeHA в латентном пространстве scANVI с задействованием всех 20 латентных измерений (ncomponents = 20). Метод Mellon генерировал логарифмическую оценку плотности для каждой отдельной клетки, отражающую ее локальную концентрацию внутри интегрированного латентного пространства при сохранении остальных параметров по умолчанию.&lt;/p&gt;\n&lt;p&gt;На эмбеддинге UMAP для HuDeHA цветовое кодирование отражает возрастные группы, согласующиеся со стадиями развития, карту плотности клеток по Меллону, где высокоплотные зоны соответствуют скоплениям транскрипционных состояний, а также градиент потенциала CytoTRACE2, показывающий снижение стволовости от клеток-предшественников к дифференцированным типам (Рис. E–G). Реконструированная траектория нейрональной линии в органоидах окрашена по псевдовремени scFates, условиям эксперимента (PSEN1WT против PSEN1E280A) и бинам псевдовремени (Рис. B–B''). Распределение плотности клеток по псевдовремени позволило разделить траекторию на 6 бинов, выявив существенное обогащение мутантных органоидов PSEN1E280A на поздних этапах псевдовремени (Рис. C). Анализ обогащения путей показал, что это смещение связано с маркерами продвинутого созревания, а не со стрессом или апоптозом (Рис. D), тогда как тепловая карта демонстрирует ключевые динамические гены нейрогенеза и созревания, такие как NEUROG1, CXCR4, NEUROD4, SNAP25, SYT1 и VAMP2 (Рис. E).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f4.jpg\" alt=\"Рисунок 4. PSEN1E280A изменяет нейрональную дифференцировку в сторону более зрелых стадий развития. (A) Схема анализа тр\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4. PSEN1E280A изменяет нейрональную дифференцировку в сторону более зрелых стадий развития. (A) Схема анализа траектории нейрональной линии. IPC, ранние нейроны и зрелые нейроны были выделены как из полученных из iPSC мозговых органоидов, так и из HuDeHA, и использованы для реконструирования траекторий псевдовремени. Траектории органоидов сравнивались между условиями (PSEN1WT против PSEN1E280A) и сопоставлялись с референсом HuDeHA in vivo.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f4-2.jpg\" alt=\"Рис. 4 (продолжение 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 4 (продолжение 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f4-3.jpg\" alt=\"Рис. 4 (продолжение 3)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 4 (продолжение 3)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f4-4.jpg\" alt=\"Рис. 4 (продолжение 4)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 4 (продолжение 4)&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;sv
