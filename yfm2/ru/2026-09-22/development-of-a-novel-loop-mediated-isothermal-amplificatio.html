        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"111\" cy=\"75\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"569\" cy=\"263\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · MICROBIOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Новый быстрый тест на&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;опасную амебу Balamuthia&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;mandrillaris&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio-f1.jpg\" alt=\"Рисунок 1. Положения праймеров LAMP, мишенью которых является 18S рРНК B. mandrillaris.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Положения праймеров LAMP, мишенью которых является 18S рРНК B. mandrillaris.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Ученые разработали быстрый и чувствительный тест на основе петлевой изотермической амплификации (LAMP) для обнаружения смертельно опасной амебы Balamuthia mandrillaris. Новый метод позволяет выявлять возбудителя за короткое время без сложного лабораторного оборудования. Тест успешно определяет ДНК паразита в образцах крови, мочи и спинномозговой жидкости. Полноценная диагностика теперь возможна даже в небольших медицинских центрах с ограниченными ресурсами.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Разработан первый LAMP-тест для диагностики инфекции, вызываемой Balamuthia mandrillaris.&lt;/li&gt;\n&lt;li&gt;Чувствительность метода в 10–100 раз выше, чем у стандартной ПЦР, с пределом обнаружения около 1 копии/мкл.&lt;/li&gt;\n&lt;li&gt;Тест сохраняет эффективность в крови, моче и спинномозговой жидкости без сложного лабораторного оборудования.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Амеба Balamuthia mandrillaris вызывает редкое, но крайне опасное воспаление мозга — амебный энцефалит, смертность от которого достигает 92%. Существующие методы диагностики требуют много времени, обладают низкой чувствительностью и доступны только в узкоспециализированных лабораториях, тогда как быстрота постановки диагноза критически важна для спасения пациента.&lt;/p&gt;\n&lt;p&gt;Исследователи разработали и оптимизировали LAMP-тест для обнаружения гена 18S рРНК амебы, результат которого виден невооруженным глазом по изменению цвета индикатора. Новый метод протестировали на десяти различных изолятах B. mandrillaris: тест не дал ложноположительных реакций с другими микроорганизмами и показал в 10–100 раз большую чувствительность по сравнению с обычной ПЦР.&lt;/p&gt;\n&lt;p&gt;Метод сохраняет высокую эффективность в сложных биологических средах, таких как спинномозговая жидкость, моча и кровь. Предел обнаружения составил 10 фг/мкл ДНК и до 1 трофозоита на 100 мкл для термообработанных образцов, а валидация с помощью qPCR и dPCR подтвердила чувствительность на уровне около 1 копии на микролитр.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование описывает лабораторную разработку и валидацию нового метода на биологических образцах, однако масштабные клинические испытания на пациентах в реальных условиях еще предстоит провести.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Свободноживущая амеба Balamuthia mandrillaris способна вызывать кожные поражения, системные патологии и тяжелую инфекцию центральной нервной системы — баламутичный амебный энцефалит (БАЭ), характеризующийся крайне высокой смертностью, достигающей примерно 92%. Существующие в настоящее время методы диагностики B. mandrillaris обладают множеством существенных ограничений, среди которых выделяются длительное время получения результата, низкая чувствительность, а также доступность специфических тестов исключительно в узкоспециализированных медицинских центрах. Ранняя диагностика играет критически важную роль для успешного лечения, учитывая стремительное развитие БАЭ после заражения. Чтобы преодолеть эти препятствия, исследователи разработали, оптимизировали и оценили новый метод петлевой изотермической амплификации (LAMP), нацеленный на ген 18S рРНК B. mandrillaris, результаты которого можно визуально наблюдать невооруженным глазом благодаря использованию фенолового красного.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод LAMP (петлевая изотермическая амплификация) позволяет быстро копировать ДНК при постоянной температуре без сложного лабораторного оборудования, а феноловый красный меняет цвет раствора, позволяя увидеть результат глазами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Разработанный диагностический анализ успешно выявляет десять различных изолятов B. mandrillaris, демонстрируя полное отсутствие перекрестной реактивности с ДНК других протестированных свободноживущих амеб, простейших, грибов или бактерий. По сравнению с традиционной полимеразной цепной реакцией (ПЦР), созданный LAMP-метод показал примерно в 10–100 раз более высокую чувствительность при работе с выделенной ДНК, образцами после термической обработки и необработанными образцами. Предел обнаружения (LOD) составил 10 фг/мкл для чистой ДНК, 10 трофозоитов на 100 мкл для необработанных клеток и 1 трофозоит на 100 мкл для клеток после тепловой обработки. Данный метод прошел дополнительную валидацию с использованием двух недавно разработанных методик количественной ПЦР (qPCR) и цифровой ПЦР (dPCR), которые определили предел обнаружения на уровне примерно 1 копии/мкл.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Новый LAMP-метод выявляет 10 изолятов амебы без перекрестных реакций, превосходит стандартную ПЦР в 10–100 раз и обнаруживает от 1 трофозоита на 100 мкл до 10 фг/мкл ДНК.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кроме того, методика устойчива к сложным биологическим матрицам: LAMP сохранял свою высокую эффективность при тестировании образцов спинномозговой жидкости (ликвора), мочи и крови, искусственно обогащенных патогеном. Благодаря своей простоте, надежности и высокой чувствительности, созданный метод LAMP станет полезным инструментом для быстрой клинической детекции и диагностики B. mandrillaris, особенно в неспециализированных медицинских учреждениях и регионах с ограниченными ресурсами. Авторы представляют первый в истории метод диагностики LAMP для B. mandrillaris, официально представленный во вторник, 4 ноября 2025 года, на 20-й (XX) Международной конференции по биологии и патогенности свободноживущих амеб (FLAM 2025) в Пуэрто-Морелосе, Мексика.&lt;/p&gt;\n&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"klinicheskie-trudnosti-diagnostiki-i-osobennosti-techeniya-infekcii\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#klinicheskie-trudnosti-diagnostiki-i-osobennosti-techeniya-infekcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Клинические трудности диагностики и особенности течения инфекции&lt;/span&gt;&lt;/a&gt;Клинические трудности диагностики и особенности течения инфекции&lt;/h4&gt;\n&lt;p&gt;Свободноживущая амеба &lt;em&gt;B. mandrillaris&lt;/em&gt; вызывает баламутичный амебный энцефалит (BAE) — редкое, но практически всегда смертельное поражение центральной нервной системы у людей и животных. Постановка прижизненного диагноза крайне затруднена, поскольку начальные симптомы смазаны и неспецифичны, из-за чего заболевание часто принимают за опухоли, абсцессы, воспалительные неврологические патологии или более распространенные формы менингита. На ранних этапах врачи используют стандартные нейровизуализационные методики, такие как компьютерная и магнитно-резонансная томография, а также гистологическое исследование. Из-за отсутствия специфических маркеров BAE часто диагностируют лишь посмертно. Иммуногистохимическое окрашивание и тесты с иммунофлуоресценцией обладают высокой информативностью, но требуют редких специфических антител и доступны лишь в единичных специализированных центрах. В некоторых регионах, например в Китае и Перу, пациенты с BAE нередко сначала обращаются к врачам с кожными поражениями задолго до вовлечения нервной системы; благодаря этому заболевание удается распознать раньше, что обеспечивает значительно более высокую выживаемость. В США же больные поступают исключительно с поражением центральной нервной системы без кожных проявлений. Это наводит на мысль, что различные географические генотипы или штаммы обладают собственными патобиологическими механизмами, подобно разным видам лейшманий.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Баламутичный амебный энцефалит (BAE), вызываемый &lt;em&gt;B. mandrillaris&lt;/em&gt;, крайне трудно диагностировать на ранних стадиях из-за неспецифичности симптомов, хотя наличие кожных поражений в некоторых регионах позволяет вовремя начать терапию и повысить выживаемость.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"molekulyarnye-podhody-i-ogranicheniya-sushestvuyushih-metodov\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#molekulyarnye-podhody-i-ogranicheniya-sushestvuyushih-metodov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Молекулярные подходы и ограничения существующих методов&lt;/span&gt;&lt;/a&gt;Молекулярные подходы и ограничения существующих методов&lt;/h4&gt;\n&lt;p&gt;Молекулярно-генетическая диагностика отличается более высокой специфичностью, и на сегодняшний день уже разработаны отдельные ПЦР-тест-системы. Данные молекулярные методы доказали свою эффективность при анализе как клинических образцов, так и объектов окружающей среды, демонстрируя высокие показатели специфичности и чувствительности. Тем не менее, эти анализы носят гипотетико-ориентированный характер и применяются преимущественно тогда, когда инфекция &lt;em&gt;B. mandrillaris&lt;/em&gt; уже клинически заподозрена. Технология высокопроизводительного секвенирования нового поколения (NGS) представляет собой превосходный инструмент для идентификации неизвестных патогенов, позволяющий одновременно выявлять тысячи микроорганизмов, что особенно ценно при поиске редких возбудителей. Однако методы NGS сильно зависят от низкой концентрации патогена и высокого фона нуклеиновых кислот хозяина — в частности, при анализе спинномозговой жидкости, где количество амеб часто крайне мало или вовсе равно нулю, из-за чего для подтверждения диагноза требуются повторные заборы материала и пересчеты. Хотя NGS-диагностику подключают при неудачах первичного обследования, ожидание результатов занимает несколько дней, а высокая стоимость и техническая сложность оборудования препятствуют широкому внедрению метода в качестве первичного скрининга.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Секвенирование нового поколения (NGS) — это метод высокопроизводительного массового параллельного секвенирования, который позволяет параллельно проанализировать миллионы ДНК-фрагментов и обнаружить любые микробные последовательности в образце без предварительного знания о том, какой именно патоген там присутствует.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"razrabotka-petlevoj-izotermicheskoj-amplifikacii\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#razrabotka-petlevoj-izotermicheskoj-amplifikacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Разработка петлевой изотермической амплификации&lt;/span&gt;&lt;/a&gt;Разработка петлевой изотермической амплификации&lt;/h4&gt;\n&lt;p&gt;Метод петлевой изотермической амплификации (LAMP), впервые описанный в 2000 году, представляет собой технологию репликации нуклеиновых кислот, отличающуюся высокой скоростью, чувствительностью и специфичностью. Кландартный анализ LAMP задействует набор из шести праймеров, включающий два внешних, два внутренних и два петлевых праймера. Сама реакция протекает в изотермических условиях, благодаря чему для ее проведения достаточно простого оборудования вроде водяной бани или термоблока, а результаты можно считывать визуально по изменению цвета невооруженным глазом без необходимости использования сложного прибора для электрофореза. По сравнению с традиционной ПЦР метод LAMP демонстрирует аналитическую чувствительность, превосходящую стандартную реакцию в 10–100 раз. Минимальные требования к приборам и упрощенный протокол снижают операционные затраты, делая LAMP идеальным кандидатом для внедрения в первичные медицинские учреждения, удаленные регионы и полевые эпидемиологические исследования. Ранее методика LAMP уже успешно применялась для выявления других свободноживущих амеб: исследователи разработали тесты, нацеленные на ген вирулентности &lt;em&gt;N. fowleri&lt;/em&gt;, а также две тест-системы для гена 18S рРНК &lt;em&gt;Acanthamoeba&lt;/em&gt;. Тем не менее, до сих пор не существовало ни одной опубликованной тест-системы LAMP, специфичной именно для &lt;em&gt;B. mandrillaris&lt;/em&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод LAMP позволяет проводить быструю, высокочувствительную и специфичную изотермическую амплификацию без сложного оборудования, однако до настоящего момента специализированных LAMP-тестов для обнаружения &lt;em&gt;B. mandrillaris&lt;/em&gt; разработано не было.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"celi-i-dizajn-tekushego-issledovaniya\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#celi-i-dizajn-tekushego-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Цели и дизайн текущего исследования&lt;/span&gt;&lt;/a&gt;Цели и дизайн текущего исследования&lt;/h4&gt;\n&lt;p&gt;Создание надежного и доступного диагностического теста на основе LAMP для обнаружения &lt;em&gt;B. mandrillaris&lt;/em&gt; способно существенно ускорить раннее выявление инфекции и снизить показатели летальности. Кроме того, подобный анализ может эффективно применяться для мониторинга окружающей среды с целью изучения географического распространения паразита, выявления групп и зон повышенного риска заражения, а также для разработки превентивных мер общественного здравоохранения с целью защиты населения. Главной целью данного исследования стала разработка и валидация быстрого, высокоспецифичного и чувствительного диагностического анализа на базе LAMP, нацеленного на ген 18S рРНК &lt;em&gt;B. mandrillaris&lt;/em&gt;, а также детальная систематическая оценка его специфичности, чувствительности и эффективности на модельных лабораторных и клинически значимых образцах.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Авторы подчеркивают необходимость разработки полевых методов мониторинга, однако успешность трансляции лабораторных тест-систем в реальную клиническую практику всегда требует обширной клинической валидации на репрезентативных выборках пациентов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"dizajn-prajmerov\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#dizajn-prajmerov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дизайн праймеров&lt;/span&gt;&lt;/a&gt;Дизайн праймеров&lt;/h4&gt;\n&lt;p&gt;Для обнаружения и репликации целевого участка гена 18S рРНК &lt;em&gt;B. mandrillaris&lt;/em&gt; (GenBank AF477019-AF477022, AF019071, JX524850) были спроектированы специфические праймеры методом петлевой изотермической амплификации (LAMP). На начальном этапе исследователи провели выравнивание нуклеотидных последовательностей в программе Multalin для выявления консервативных участков. На основе полученных данных с помощью онлайн-инструмента PrimerExplorer V5 были разработаны кандидаты для наборов праймеров LAMP, состоящих из двух внутренних (FIP и BIP) и двух внешних (F3 и B3) компонентов. После предварительного отбора к ним добавили два петлевых праймера — LF и LB. Специфика последовательностей была проверена через базу данных NCBI при помощи алгоритма BLAST, а их стабильность, склонность к образованию вторичных структур и димеризации оценивались в программе OligoAnalyzer. Итоговые конфигурации и топография праймеров представлены в Таблица 1 и Рис. 1.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio-f1.jpg\" alt=\"Рисунок 1. Положения праймеров LAMP, мишенью которых является 18S рРНК B. mandrillaris.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Положения праймеров LAMP, мишенью которых является 18S рРНК B. mandrillaris.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 1.&lt;/strong&gt; Последовательности праймеров для диагностического анализа LAMP&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Название&lt;/th&gt;\n&lt;th&gt;Последовательность (5’ к 3’)&lt;/th&gt;\n&lt;th&gt;Длина (п.н.)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;F3&lt;/td&gt;\n&lt;td&gt;TGGTGGAGTGATTTGTCTGG&lt;/td&gt;\n&lt;td&gt;20&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;B3&lt;/td&gt;\n&lt;td&gt;TCGGCTAATCACCGATTGTC&lt;/td&gt;\n&lt;td&gt;20&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;FIP&lt;/td&gt;\n&lt;td&gt;CGCTCACCCCCTGGTTTTGAATCGAACGAGACCTTAACCTGC&lt;/td&gt;\n&lt;td&gt;42&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;BIP&lt;/td&gt;\n&lt;td&gt;CGGTCGGCTCCAATCTTCGGACTTCTACCAATCCAACCGC&lt;/td&gt;\n&lt;td&gt;40&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;LF&lt;/td&gt;\n&lt;td&gt;AGCAGGATTGGCATGACT&lt;/td&gt;\n&lt;td&gt;18&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;LB&lt;/td&gt;\n&lt;td&gt;GTGCCCCTTGCCTTCTG&lt;/td&gt;\n&lt;td&gt;17&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод LAMP (петлевая изотермическая амплификация) позволяет быстро и с высокой специфичностью копировать ДНК при постоянной температуре, избавляя от необходимости использовать сложное термоциклирование.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"optimizaciya-analiza-lamp\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#optimizaciya-analiza-lamp\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оптимизация анализа LAMP&lt;/span&gt;&lt;/a&gt;Оптимизация анализа LAMP&lt;/h4&gt;\n&lt;p&gt;В ходе настройки условий амплификации исследователи протестировали концентрации праймеров в диапазоне от 0.75× до 1.75× и температурный градиент от 57 до 67 °C. Эффективность оценивалась визуально по смене цвета реакционной смеси и с помощью электрофореза в агарозном геле (Рис. 2). Общая производительность возрастала с ростом температуры. При 57 °C на геле фиксировались продукты реакции, однако цвет раствора оставался оранжевым вместо чистого желтого, что затрудняло интерпретацию по сравнению с отрицательным контролем. Концентрация праймеров также существенно влияла на результат: высокие дозы (1.5× и 1.75×) приводили к ложноположительным срабатываниям на повышенных температурах, тогда как уровень 0.75× давал слабую амплификацию с нечетким изменением цвета. Оптимальным балансом признана концентрация праймеров 1×, включающая 1.28 µM FIP и BIP, 0.16 µM F3 и B3, а также 0.32 µM LF и LB. В этих условиях положительные пробы стабильно желтели, а контрольные оставались розовыми в диапазоне 59–67 °C без признаков неспецифической лестничной полосчатости в отрицательных пробах. Температура 65 °C была утверждена как оптимальная для дальнейшей работы.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio-f2.jpg\" alt=\"Рисунок 2. Оптимизация концентраций праймеров при определенных температурах (57–67 °C).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2. Оптимизация концентраций праймеров при определенных температурах (57–67 °C).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;На следующем этапе подбиралось оптимальное время реакции при выбранных параметрах. Остановка процесса на разных временных отрезках показала (Рис. 3), что продукты синтеза начинают фиксироваться уже на 20-й минуте в виде слабого оранжевого окрашивания и характерных полос на геле. Уверенная амплификация достигалась к 30-й минуте. Более длительные инкубации (40 и 50 минут) провоцировали неспецифические реакции: на 40-й минуте наблюдался слабый сдвиг цвета и артефактные полосы в контроле, а на 50-й минуте цвет раствора менялся на оранжевый наряду с ложноположительными полосами в отрицательных образцах. Таким образом, строгим стандартом для дальнейших тестов было выбрано время реакции, равное 30 минутам.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio-f3.jpg\" alt=\"Рисунок 3. Оптимизация времени амплификации от 10 до 50 минут.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3. Оптимизация времени амплификации от 10 до 50 минут.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оптимальными параметрами для LAMP-анализа гена 18S рРНК стали температура 65 °C, концентрация праймеров 1× и время инкубации ровно 30 минут, обеспечивающие четкую визуализацию без ложноположительных сигналов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"specifichnost-analiza-lamp\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#specifichnost-analiza-lamp\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Специфичность анализа LAMP&lt;/span&gt;&lt;/a&gt;Специфичность анализа LAMP&lt;/h4&gt;\n&lt;p&gt;Амплификация ДНК происходила исключительно в пробах с изолятами &lt;em&gt;B. mandrillaris&lt;/em&gt; (реакции 1–10), сопровождаясь заметным изменением цвета раствора и формированием лестничных паттернов полос при электрофорезе. В то же время для других видов организмов, не относящихся к &lt;em&gt;B. mandrillaris&lt;/em&gt;, а также для контрольной воды высокой степени очистки dH2O никаких изменений окраски или специфических полос не фиксировалось (Рис. 4). Полученные данные подтверждают высокую аналитическую специфичность разработанного метода LAMP в отношении целевого патогена при полном отсутствии перекрестной реактивности с протестированными свободноживущими амебами, простейшими, грибами и бактериями.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio-f4.jpg\" alt=\"Рисунок 4. Специфичность метода LAMP для 18S рРНК. Для оценки специфичности метода были выполнены колориметрическая ампл\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4. Специфичность метода LAMP для 18S рРНК. Для оценки специфичности метода были выполнены колориметрическая амплификация LAMP и электрофорез в агарозном геле. Дорожки 1–10 представляют различные изоляты B. mandrillaris: V039, SAM, RP5, OK1, ITSON, V433, V188, V194, V426 и V619; дорожка 11: Acanthamoeba castellanii; дорожка 12: Naegleria fowleri; дорожка 13: Sarcocystis neurona; дорожка 14: Toxoplasma gondii; дорожка 15: Escherichia coli; дорожка 16: Serratia marcescens; дорожка 17: Pseudomonas aeruginosa; дорожка 18: Candida auris; дорожка 19: Candida albicans; дорожка 20: положительный контроль (B. mandrillaris V039, 1 нг); дорожка 21: отрицательный контроль – вода dH2O молекулярной чистоты.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"chuvstvitelnost-analiza-lamp\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#chuvstvitelnost-analiza-lamp\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чувствительность анализа LAMP&lt;/span&gt;&lt;/a&gt;Чувствительность анализа LAMP&lt;/h4&gt;\n&lt;p&gt;Пределы обнаружения оптимизированного метода LAMP сопоставлялись с классической полимеразной цепной реакцией (ПЦР) с использованием различных матриц геномной ДНК &lt;em&gt;B. mandrillaris&lt;/em&gt; (Рис. 5). Анализ по чистой ДНК показал, что LAMP успешно выявляет генетический материал в диапазоне от 100 pg/μL до 10 fg/μL, в то время как обычная ПЦР работала в более узком коридоре от 100 pg/μL до 100 fg/μL. При тестировании цельных клеток минимальный порог обнаружения для LAMP составил 0.1 трофозоитов/μL против 1 трофозоита/μL для ПЦР. Использование предварительно термообработанных клеток повысило чувствительность LAMP еще в 10 раз — до 0.01 трофозоитов/μL, тогда как стандартная ПЦР обнаруживала их на уровне 1 трофозоита/μL, что соответствует стократному отставанию. В целом, независимо от типа использованной матрицы (ДНК, интактные или термически обработанные клетки), метод LAMP продемонстрировал превосходство над обычной ПЦР, обеспечивая прирост эффективности детектирования в 10–100 раз.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio-f5.jpg\" alt=\"Рисунок 5. Сравнение чувствительности LAMP и обычной ПЦР. (A) Очищенная ДНК B. mandrillaris. (B) Исходные необработанные\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5. Сравнение чувствительности LAMP и обычной ПЦР. (A) Очищенная ДНК B. mandrillaris. (B) Исходные необработанные клетки B. mandrillaris. (C) Термообработанные клетки B. mandrillaris. Все условия были выполнены, после чего из каждого исследованного образца была выделена гДНК и использована в качестве матрицы для данных экспериментов.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оценка чувствительности проводилась в лабораторных условиях на искусственных образцах, поэтому клиническая валидация метода на реальных пациентских биосубстратах требует дополнительных исследований.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"validaciya-metoda-diagnostiki-lamp-dlya-opredeleniya-chisla-kopij\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#validaciya-metoda-diagnostiki-lamp-dlya-opredeleniya-chisla-kopij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Валидация метода диагностики LAMP для определения числа копий&lt;/span&gt;&lt;/a&gt;Валидация метода диагностики LAMP для определения числа копий&lt;/h4&gt;\n&lt;p&gt;Для проверки надежности теста LAMP и установления точных пределов обнаружения исследователи задействовали методики цифровой ПЦР (dPCR) и количественной ПЦР (qPCR). Результаты dPCR продемонстрировали отчетливое снижение числа копий в зависимости от концентрации при 10-кратном последовательном разведении (Рис. 6). Положительные и отрицательные разделы четко дифференцировались в каждом образце, тогда как в отрицательном контроле ожидаемо не фиксировалось никакой амплификации.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio-f6.jpg\" alt=\"Рисунок 6. Количественное определение плазмидных стандартов рекомбинантной 18S рРНК и контроля dH2O методом цифровая ПЦР\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 6. Количественное определение плазмидных стандартов рекомбинантной 18S рРНК и контроля dH2O методом цифровая ПЦР (dPCR).&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;dPCR или цифровая ПЦР — это сверхточный метод подсчета молекул ДНК без использования стандартных кривых, разделяющий образец на тысячи микрокапель.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для калибровки qPCR применялись те же серийно разведенные рекомбинантные плазмидные стандарты 18S рРНК с известным числом копий. Данные выявили прочную линейную связь между значениями порогового цикла Ct и логарифмом числа копий плазмиды (Рис. 7), при полном отсутствии сигнала в контроле. Уравнение стандартной кривой составило Y = -3.233x + 33.91 при коэффициенте детерминации R2 = 0.9532.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio-f7.jpg\" alt=\"Рисунок 7. Стандартная кривая количественной ПЦР (qPCR). A: Кривая амплификации qPCR для различных концентраций плазмидн\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 7. Стандартная кривая количественной ПЦР (qPCR). A: Кривая амплификации qPCR для различных концентраций плазмидных стандартов B. mandrillaris и dH2O; B: Стандартная кривая результатов qPCR.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio-f7-2.jpg\" alt=\"Рис. 7 (продолжение 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 7 (продолжение 2)&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Аналитический предел обнаружения (LOD) теста LAMP составил около 1 копии/мкл, а сопоставление qPCR (1.07 × 10^5 копий/мкл) и dPCR (1.13 × 10^5 копий/мкл) подтвердило высокую точность количественной оценки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дополнительно геномную ДНК (gDNA) использовали для оценки согласованности qPCR и dPCR, а также определения предела обнаружения (LOD) LAMP. Образцы gDNA B. mandrillaris в концентрации 1 нг/мкл были проанализированы обоими методами, показав значения 1.07 × 10^5 копий/мкл для qPCR и 1.13 × 10^5 копий/мкл для dPCR. Сопоставив минимальную концентрацию ДНК, уловимую LAMP, с калибровочной кривой, аналитический LOD метода оценили примерно в 1 копию/мкл.&lt;/p&gt;\n&lt;h4 id=\"validaciya-diagnosticheskogo-potenciala-na-obrazcah-biologicheskih-zhidkostej-cheloveka-s-dobavleniem-vozbuditelya\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#validaciya-diagnosticheskogo-potenciala-na-obrazcah-biologicheskih-zhidkostej-cheloveka-s-dobavleniem-vozbuditelya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Валидация диагностического потенциала на образцах биологических жидкостей человека с добавлением возбудителя&lt;/span&gt;&lt;/a&gt;Валидация диагностического потенциала на образцах биологических жидкостей человека с добавлением возбудителя&lt;/h4&gt;\n&lt;p&gt;Поскольку биологические матрицы способны серьезно мешать диагностике, разработчики протестировали новый инструмент на клинических образцах спинномозговой жидкости (ликвора), мочи и крови человека, полученных от доктора Райана Релича из Медицинской школы Индианского университета. Авторы выполнили стандартное 10-кратное серийное разведение от 1 до 10^6 трофозоитов B. mandrillaris на реакцию в оптимизированных условиях.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эксперименты проводились на искусственно зараженных (spiked) клинических образцах человека, поэтому для окончательного подтверждения эффективности необходимы масштабные испытания на реальных пациентах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Диагностическая система LAMP успешно распознавала всего 1 трофозоит на реакцию во всех исследованных биожидкостях человека (давая визуальное пожелтение во всех тестах, кроме отрицательного контроля). Для сравнения, обычная ПЦР в пробах мочи требовала минимум трофозоитов на реакцию и занимала около трех часов, в то время как LAMP справлялась всего за 30 минут (Рис. 8).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LAMP успешно работает в присутствии ликвора, мочи и крови без ингибирования, превосходя классическую ПЦР по скорости (30 минут против 3 часов) и простоте визуальной детекции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Полученные данные доказывают, что распространенные биологические среды человека не угнетают амплификацию LAMP. Тест продемонстрировал надежную и превосходящую стандартную ПЦР эффективность, обеспечивая быстрый и простой визуальный результат, что подчеркивает его ценность для выявления B. mandrillaris в клинической практике и экологических исследованиях.&lt;/p&gt;\n&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;h4 id=\"razrabotka-i-optimizaciya-metoda-lamp-dlya-diagnostiki-b-mandrillaris\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#razrabotka-i-optimizaciya-metoda-lamp-dlya-diagnostiki-b-mandrillaris\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Разработка и оптимизация метода LAMP для диагностики B. mandrillaris&lt;/span&gt;&lt;/a&gt;Разработка и оптимизация метода LAMP для диагностики B. mandrillaris&lt;/h4&gt;\n&lt;p&gt;Инфекция B. mandrillaris характеризуется стремительным развитием при поражении ЦНС, где от появления симптомов до летального исхода проходят недели или месяцы. Ранняя диагностика затруднена из-за неспецифичности симптомов и редкости заболевания. Существующие методы, такие как ПЦР (нацеленная на 16S rRNA, 18S rRNA или RNase P), обладают вариативной специфичностью, а NGS, несмотря на высокую точность, требует дорогостоящего оборудования и квалифицированного персонала. Разработанный нами метод петлевой изотермической амплификации (LAMP) предлагает быстрое, чувствительное и экономичное решение для первичной диагностики.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод LAMP обеспечивает быструю амплификацию при 65 °C за 30 минут с высокой специфичностью, не проявляя перекрестной реактивности с другими амебами, грибами или бактериями.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ключевым этапом стала разработка праймеров, нацеленных на ген 18S rRNA, так как использование 16S rRNA приводило к ложноположительным результатам. Оптимизация включала подбор температуры, времени реакции и концентрации праймеров (1,28 мкМ для FIP/BIP, 0,16 мкМ для F3/B3, 0,32 мкМ для LF/LB). Использование положительных и отрицательных контролей позволило минимизировать риск неспецифической амплификации, вызванной взаимодействием праймеров.&lt;/p&gt;\n&lt;h4 id=\"podgotovka-obrazcov-i-analiticheskaya-effektivnost\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#podgotovka-obrazcov-i-analiticheskaya-effektivnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подготовка образцов и аналитическая эффективность&lt;/span&gt;&lt;/a&gt;Подготовка образцов и аналитическая эффективность&lt;/h4&gt;\n&lt;p&gt;Одним из преимуществ LAMP является устойчивость к ингибиторам, что позволяет работать с «сырыми» образцами без сложной экстракции ДНК. Мы сравнили коммерческие наборы для выделения ДНК, метод простого нагрева и прямое использование образцов. Результаты показали, что LAMP эффективно детектирует патоген даже в необработанном материале. Сравнение с классической ПЦР выявило, что наш метод обладает в 10–100 раз более высокой эффективностью амплификации, что критически важно для выявления низких концентраций B. mandrillaris.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LAMP (петлевая изотермическая амплификация) — метод копирования ДНК при постоянной температуре, который быстрее и проще обычной ПЦР, так как не требует термоциклирования.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы впервые применили dPCR (цифровую ПЦР) для определения числа копий целевого гена 18S rRNA и установления предела обнаружения (LOD), что позволило количественно оценить чувствительность нашего теста.&lt;/p&gt;\n&lt;h4 id=\"ogranicheniya-i-interpretaciya-rezultatov\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#ogranicheniya-i-interpretaciya-rezultatov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и интерпретация результатов&lt;/span&gt;&lt;/a&gt;Ограничения и интерпретация результатов&lt;/h4&gt;\n&lt;p&gt;Несмотря на преимущества, LAMP несет риск контаминации из-за высокой скорости наработки продукта. Использование фенолового красного позволяет визуально оценивать результат без вскрытия пробирок, что снижает риск образования аэрозолей. Тем не менее, при пограничных цветовых изменениях (оранжевый оттенок) может потребоваться электрофорез в агарозном геле для подтверждения. В связи с этим, LAMP следует рассматривать как инструмент для быстрой предварительной диагностики, требующий верификации другими методами в сомнительных случаях.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Визуальная интерпретация результатов может зависеть от освещения и субъективного восприятия оператора, что требует осторожности при оценке слабых положительных сигналов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;h4 id=\"itogi-razrabotki-i-validacii-diagnosticheskih-metodov\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#itogi-razrabotki-i-validacii-diagnosticheskih-metodov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Итоги разработки и валидации диагностических методов&lt;/span&gt;&lt;/a&gt;Итоги разработки и валидации диагностических методов&lt;/h4&gt;\n&lt;p&gt;В ходе данного исследования были разработаны и прошли процедуру валидации три инновационных метода детекции B. mandrillaris: петлевая изотермическая амплификация (LAMP), количественная ПЦР (qPCR) и цифровая ПЦР (dPCR). Процесс оптимизации включал подбор специфических праймеров, установление их оптимальных концентраций и настройку условий протекания реакций. Авторы провели комплексную оценку аналитической чувствительности и специфичности, а также отработали методику количественного определения числа копий ДНК. Валидация проводилась на образцах биологических жидкостей человека, искусственно обогащенных патогеном (spiked samples).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод LAMP продемонстрировал высокую чувствительность, специфичность и устойчивость, что делает его перспективным инструментом для ранней диагностики Balamuthia mandrillaris в клинической практике.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Полученные результаты позволяют рассматривать LAMP как наиболее подходящий метод для внедрения в первичном звене здравоохранения или в условиях ограниченных ресурсов. Раннее выявление возбудителя критически важно для своевременного начала терапии, что способно значительно улучшить прогноз для пациентов и снизить крайне высокую летальность, характерную для баламутиа-амебного энцефалита (BAE) и других заболеваний, вызываемых Balamuthia.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LAMP (петлевая изотермическая амплификация) — это метод молекулярной диагностики, который позволяет быстро копировать ДНК возбудителя при постоянной температуре, не требуя сложного оборудования для термоциклирования.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"kultivirovanie-ameb\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#kultivirovanie-ameb\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Культивирование амеб&lt;/span&gt;&lt;/a&gt;Культивирование амеб&lt;/h4&gt;\n&lt;p&gt;В исследовании использовали изоляты B. mandrillaris: V039, ITSON (предоставлен доктором Луисом Фернандо Ларес-Хименесом из Университета ITSON, Мексика), SAM, RP5, OK1 (предоставлен доктором Тельмой Х. Даннебаке из Департамента общественного здравоохранения Калифорнии, США), V433, V188, V194, V426 и V619 (закупленные в хранилище BEI resources, программа при поддержке NIH, США). Также применялись другие свободноживущие амебы из Американской коллекции типовых культур (ATCC): Naegleria fowleri штамм Nf69 (ATCC 30215) и Acanthamoeba castellanii генотип T4 (ATCC 50370). Культуры B. mandrillaris поддерживали при температуре 37℃ и концентрации 5% CO₂ в специализированной среде Balamuthia mandrillaris ITSON medium (BMI), куда добавляли 10% эмбриональной бычьей сыворотки (FBS) и пенициллин-стрептомицин (pen-strep) в концентрации 125 мкг на 5000 Ед/мл пенициллина и 5 мг/мл стрептомицина. Работу вели во флаконах для клеточных культур объемом 75 cm² с вентиляцией. Штамм N. fowleri выращивали без доступа воздуха в полноценной среде Нельсона (NCM) при 34℃ с добавлением 10% FBS и 125 мкг pen-strep во флаконах без вентиляции объемом 75 cm². A. castellanii культивировали безклетково в среде с протеопептоном и глюкозой (PG) при 27℃, добавляя 125 мкг pen-strep в аналогичных невентрируемых флаконах на 75 cm².&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Пассаж клеток — это пересев культуры на новую питательную среду для поддержания их роста и предотвращения гибели при перенаселении.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Регулярный пересев проводили каждые 3–4 дня, когда плотность слоя достигала 80–90%. Для переноса B. mandrillaris во флаконы добавляли по 5 мл 0.25% раствора трипсин-ЭДТА (1X) и инкубировали в течение 5 минут при 37℃ для открепления клеток от пластика. Флаконы с N. fowleri выдерживали на льду 15 минут, а клетки A. castellanii собирали механическим способом для отслоения. Все клеточные суспензии переносили в центрифужные пробирки объемом 50 мл и центрифугировали при 3,214 × g (3,900 об/мин) при температуре 4℃. После этого клетки подсчитывали, доводили до нужной концентрации путем разбавления и использовали для дальнейшего выращивания или экспериментов.&lt;/p&gt;\n&lt;h4 id=\"podgotovka-obrazcov\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#podgotovka-obrazcov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подготовка образцов&lt;/span&gt;&lt;/a&gt;Подготовка образцов&lt;/h4&gt;\n&lt;p&gt;Образцы Sarcocystis neurona предоставила доктор Сривени Дангудубиям из Университета Пердью; Toxoplasma gondii была получена от доктора Кристофа Конрадта также из Университета Пердью; Candida auris и C. albicans предоставил доктор Шанкар Тангамани из Университета Пердью. Бактериальные штаммы Escherichia coli (ATCC 8739), Serratia marcescens (ATCC 13048) и Pseudomonas aeruginosa (ATCC 9027) приобрели напрямую в ATCC.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;gДНК (геномная ДНК) — это полный генетический материал организма, который выделяют из клеток для проведения молекулярно-генетического анализа, например, ПЦР или LAMP.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Геномную ДНК из всех исследуемых организмов выделяли с помощью коммерческого набора для экстракции ДНК в строгом соответствии с инструкцией производителя. Каждый образец ДНК получали из расчета 2× 10⁶ клеток. Для изолята V039 B. mandrillaris очищенную геномную ДНК серийно разводили в воде молекулярной степени чистоты без нуклеаз (dH₂O), добиваясь широкого диапазона концентраций от 0.1 фг/мкл до 100 пг/мкл. Кроме того, для последующего анализа подготовили термообработанные и исходные необработанные трофозоиты B. mandrillaris. Осадок клеток подсчитывали, разводили в воде без нуклеаз до конечного количества 10 000 трофозоитов/мл, после чего проводили шестикратное последовательное разведение в 10 раз. Часть клеток нагревали при температуре 95℃ в течение 1 часа, в то время как исходные клетки использовали напрямую для выделения gДНК без какой-либо дополнительной подготовки.&lt;/p&gt;\n&lt;h4 id=\"optimizaciya-analiza\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#optimizaciya-analiza\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оптимизация анализа&lt;/span&gt;&lt;/a&gt;Оптимизация анализа&lt;/h4&gt;\n&lt;p&gt;Оптимизацию условий LAMP-реакции выполняли согласно протоколу набора WarmStart® Colorimetric LAMP 2X Master Mix. Все праймеры были синтезированы компанией Integrated DNA Technologies. Базовая реакционная смесь включала 2X Master Mix, набор праймеров (соотношение внешних, внутренних и петлевых праймеров составляло 1:4:2 соответственно), матрицу в виде gДНК или dH₂O, а также воду для доведения объема. Стандартное время инкубации составляло 30 минут при температуре 65℃. В ходе оптимизации выбранный комплект праймеров тестировали на положительных образцах (gДНК B. mandrillaris) и отрицательных контролях (dH₂O) при различных условиях: (i) при пяти разных концентрациях праймеров — 0.75X, 1X, 1.25X, 1.5X и 1.75X; (ii) при шести различных температурах инкубации — 57℃, 59℃, 61℃, 63℃, 65℃ и 67℃.&lt;/p&gt;\n&lt;p&gt;Результаты амплификации оценивали визуально по изменению цвета раствора, а также с помощью электрофореза в 1.5% агарозном геле. Оптимальными условиями считались те, которые обеспечивали четкий переход цвета из розового в желтый (что соответствовало переходу от отрицательного результата к положительному) и демонстрировали характерные лестничные паттерны LAMP-амплификации для положительных образцов при полном отсутствии продуктов реакции в отрицательном контроле. После подбора идеальной концентрации праймеров и температуры авторы сравнили эффективность реакции в разные временные интервалы (10, 20, 30, 40 и 50 минут), чтобы установить минимальное и наиболее эффективное время для проведения анализа.&lt;/p&gt;\n&lt;h4 id=\"opredelenie-specifichnosti-i-chuvstvitelnosti-lamp\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#opredelenie-specifichnosti-i-chuvstvitelnosti-lamp\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение специфичности и чувствительности LAMP&lt;/span&gt;&lt;/a&gt;Определение специфичности и чувствительности LAMP&lt;/h4&gt;\n&lt;p&gt;Специфичность разработанного метода LAMP оценивалась путем тестирования геномной ДНК (гДНК) десяти различных изолятов B. mandrillaris (V039, SAM, RP5, OK1, ITSON, V433, V188, V194, V426, V619). Для проверки перекрестной реактивности использовали гДНК других свободноживущих амеб (A. castellanii, N. fowleri), простейших (S. neurona, T. gondii), грибов (C. auris, C. albicans) и бактерий (E. coli, S. marcescens, P. aeruginosa). Результаты амплификации оценивали визуально по изменению цвета и с помощью электрофореза в 1,5% агарозном геле.&lt;/p&gt;\n&lt;p&gt;Чувствительность LAMP определялась через предел обнаружения (LOD) в сравнении с традиционным методом ПЦР. Использовались 10-кратные серийные разведения гДНК B. mandrillaris (от 0,1 фг/мкл до 100 пг/мкл) и стандартных клеток (от 1000 до 0,001 трофозоита на 100 мкл). Для каждого образца (n=3) проводили параллельную амплификацию методами LAMP и ПЦР. LOD определялся как минимальная концентрация, дающая стабильный положительный результат. Традиционная ПЦР проводилась с праймерами Bal18SF3-Fwd и Bal18SB3-Rev при начальной денатурации 94°C (5 мин), 40 циклах (94°C — 1 мин, 54°C — 2 мин, 72°C — 3 мин) и финальной элонгации 72°C (10 мин).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод LAMP (петлевая изотермическая амплификация) позволяет быстро копировать ДНК при постоянной температуре, а LOD (предел обнаружения) показывает минимальное количество мишени, которое прибор может достоверно отличить от фонового шума.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"klonirovanie-celevogo-gena-i-transformaciya\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#klonirovanie-celevogo-gena-i-transformaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Клонирование целевого гена и трансформация&lt;/span&gt;&lt;/a&gt;Клонирование целевого гена и трансформация&lt;/h4&gt;\n&lt;p&gt;Целевой ген амплифицировали с использованием внешних праймеров LAMP и гДНК B. mandrillaris. Продукты ПЦР очищали из 1% агарозного геля и лигировали в вектор pGEM®-T Easy с помощью T4 ДНК-лигазы. Полученную конструкцию вводили в компетентные клетки E. coli (штамм J109). Трансформанты высевали на агаризованную среду LB с ампициллином, IPTG и X-Gal для проведения сине-белого скрининга. Положительные колонии культивировали в среде SOC, после чего выделяли плазмидную ДНК. Идентичность вставки подтверждали секвенированием, а концентрацию плазмид измеряли на спектрофотометре NanoDrop.&lt;/p&gt;\n&lt;h4 id=\"razrabotka-metodov-validacii-qpcr-i-dpcr\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#razrabotka-metodov-validacii-qpcr-i-dpcr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Разработка методов валидации qPCR и dPCR&lt;/span&gt;&lt;/a&gt;Разработка методов валидации qPCR и dPCR&lt;/h4&gt;\n&lt;p&gt;Для qPCR использовали внешние праймеры LAMP и стандартные шаблоны в виде рекомбинантных плазмид. Реакционная смесь включала SYBR Green Master Mix, праймеры F3/B3 (по 500 нМ) и шаблон. Протокол включал денатурацию 95°C (5 мин) и 35 циклов (95°C — 15 с, 61°C — 1 мин). Анализ кривых плавления подтвердил специфичность амплификации. Стандартную кривую строили путем линейной регрессии значений Ct относительно логарифма числа копий плазмиды в GraphPad Prism 10.&lt;/p&gt;\n&lt;p&gt;Для dPCR (цифровой ПЦР) использовали 6 концентраций плазмид в трех повторах. Реакция объемом 40 мкл проводилась в нанопланшетах QIAcuity (26k) с использованием 3× EvaGreen PCR Master Mix. Амплификация включала 35 циклов (95°C — 15 с, 61°C — 1 мин). Учет результатов проводился на системе QIAcuity One при длине волны возбуждения 495 нм и эмиссии 530 нм. Стандартная кривая dPCR также строилась через линейную регрессию в Prism 10.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;qPCR (количественная ПЦР) измеряет накопление продукта в реальном времени, тогда как dPCR (цифровая ПЦР) разделяет образец на тысячи микрокапель, позволяя проводить абсолютный подсчет копий ДНК без использования внешних стандартов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio-fS1.jpg\" alt=\"Рисунок S1. Специфичность LAMP-анализа, направленного на 16S рРНК. Дорожка 1: B. mandrillaris (V039); дорожка 2: B. mand\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок S1. Специфичность LAMP-анализа, направленного на 16S рРНК. Дорожка 1: B. mandrillaris (V039); дорожка 2: B. mandrillaris (ITSON); дорожка 3: N. fowleri; дорожка 4: A. castellanii; дорожка 5: S. neurona; дорожка 6: E. coli; дорожка 7: S. marcescens; дорожка 8: P. aeruginosa; дорожка 9: отрицательный контроль – вода dH2O молекулярного качества.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"tablicy\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#tablicy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Таблицы&lt;/span&gt;&lt;/a&gt;Таблицы&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Таблица S1.&lt;/strong&gt; Последовательности праймеров&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Название&lt;/th&gt;\n&lt;th&gt;Последовательность (5’ к 3’)&lt;/th&gt;\n&lt;th&gt;Длина (п.н.)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;F3&lt;/td&gt;\n&lt;td&gt;CTCGTGTCTTAGGATGTGT&lt;/td&gt;\n&lt;td&gt;19&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;B3&lt;/td&gt;\n&lt;td&gt;TTAGAGATTTACTCCGCCT&lt;/td&gt;\n&lt;td&gt;19&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;FIP&lt;/td&gt;\n&lt;td&gt;CTCATCCTCAAAAGCAGTTTTCACGGTTAACTCCATGAACGG&lt;/td&gt;\n&lt;td&gt;42&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;BIP&lt;/td&gt;\n&lt;td&gt;ATGACCTTTATAGATTGGGCTACACCACGGCATTGTTTCTCAT&lt;/td&gt;\n&lt;td&gt;43&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Сложная&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;диагностика&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;амебного&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;энцефалита&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Разработка&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;LAMP-теста на&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ген 18S рРНК&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Высокая чувств&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ительность и&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;точность&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;метода&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"
