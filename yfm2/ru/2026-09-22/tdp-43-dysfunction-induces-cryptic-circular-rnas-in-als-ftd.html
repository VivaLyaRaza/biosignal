ass=\"visually-hidden\" data-no-index=\"true\"&gt;CRISPRi-опосредованный нокдаун TDP-43 в iPSC человека:&lt;/span&gt;&lt;/a&gt;CRISPRi-опосредованный нокдаун TDP-43 в iPSC человека:&lt;/h4&gt;\n&lt;p&gt;Для достижения нокдауна sgRNA, нацеленные либо на TARDBP/TDP-43, либо контрольная sgRNA, не имеющая мишени, доставлялись в iPSC путем лентивирусной трансдукции. Для получения вируса клетки эмбриональной почки человека (HEK) трансфицировали sgRNA, упаковочной плазмидой (pCMVΔ8.91) и плазмидой оболочки VSVG (pMD.G) с использованием Trans-IT 293 (Cambridge Bioscience, кат. № MIR2700), затем культивировали в течение 2–3 дней в следующей среде: opti-MEM Reduced Serum + Glutamax (Thermo Fisher Scientific, кат. № 51985-026) с 5% FBS (Sigma, кат. № TMS-013-B). После фильтрации среды вирус концентрировали из среды в соотношении 1:10 в PBS с использованием концентратора Lenti-X (Takara Bio, кат. № 631231), аликвотировали и хранили при −80 °C для дальнейшего использования. sgRNA были клонированы в вектор pU6-sgRNA EF1Alpha-puro-T2A-BFP (подарок от J. Weissman; Addgene 60955). Последовательности sgRNA были следующими: контрольная без мишени: GTCCACCCTTATCTAGGCTA, TARDBP: GGGAAGTCAGCCGTGAGACC (сильный гид). Вирус доставляли в iPS-клетки в суспензии после расщепления Accutase. Через 24 часа клетки промывали PBS и добавляли свежую среду E8. Через два дня после лентивирусной доставки клетки селектировали в течение 48 ч пуромицином (10 мкг/мл). Затем iPSC экспандировали в течение 1–2 дней перед началом нейрональной дифференцировки. Эффективность нокдауна проверяли с помощью qPCR и вестерн-блоттинга.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPRi (интерференция CRISPR) — метод подавления экспрессии специфических генов без изменения последовательности ДНК, использующий «неактивный» белок Cas9 для блокировки транскрипции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"protac-oposredovannaya-degradaciya-i-vosstanovlenie-tdp-43\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#protac-oposredovannaya-degradaciya-i-vosstanovlenie-tdp-43\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PROTAC-опосредованная деградация и восстановление TDP-43:&lt;/span&gt;&lt;/a&gt;PROTAC-опосредованная деградация и восстановление TDP-43:&lt;/h4&gt;\n&lt;p&gt;Для этого эксперимента 500 тыс. нейронов i3 HALO-TDP высевали в 12-луночные планшеты, предварительно покрытые 50 мкг/мл поли-D-лизина (Gibco, A38904-01) и 10 мкг/мл ламинина (Gibco, 23017015). Нейроны поддерживали в культуральной среде для кортикальных нейронов i3Neuron: среда BrainPhys (StemCell Technologies, 5790), дополненная 1x N21 Max (R&amp;amp;D System, AR008), 1x N2 Max (R&amp;amp;D System, AR009), 10 нг/мл BDNF (PeproTech, 450-02), 10 нг/мл GDNF (PeproTech, 450-10) и 1 мкг/мл ламинина (Gibco, 23017015), при этом половину среды меняли дважды в неделю. Для индукции нокдауна TDP-43 Halo PROTAC-E (300 нМ, Division of Signal Transduction Therapy DSTT) добавляли в культуры при каждой смене среды, начиная с DIV14. Для восстановления экспрессии белка TDP-43 после нокдауна нейроны обрабатывали неактивным эпимером Halo PROTAC-E (300 нМ, DSTT) в заданные моменты времени перед сбором клеток на DIV28.&lt;/p&gt;\n&lt;h4 id=\"podderzhanie-i-differencirovka-ipsc-dlya-obrabotki-aso\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#podderzhanie-i-differencirovka-ipsc-dlya-obrabotki-aso\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поддержание и дифференцировка iPSC (для обработки ASO):&lt;/span&gt;&lt;/a&gt;Поддержание и дифференцировка iPSC (для обработки ASO):&lt;/h4&gt;\n&lt;p&gt;Линию iPSC человека GM25256 (Coriell Institute) поддерживали в среде mTeSR1 (StemCell Technologies) на Matrigel (Stemcell Technologies, Corning). iPSC человека кормили ежедневно и расщепляли каждые 4–5 дней с использованием ReLeSR (StemCell Technologies) в соответствии с инструкциями производителя. Дифференцировку iPSC в моторные нейроны проводили с использованием 3D-путей развития в течение 14 дней. На 14-й день нейрональные сфероиды диссоциировали и высевали на 96-луночные планшеты, покрытые поли-D-лизином/ламинином (Phenoplate, Revvity), и поддерживали в среде Neurobasal (Thermo Fisher), содержащей нейротрофические факторы (BDNF, GDNF и CNTF; R&amp;amp;D Systems). Клетки обрабатывали 5-фторурацилом через 4 дня после высева для удаления делящихся предшественников. Крысиные астроциты (Stem Cell Technologies) добавляли один раз в культуры моторных нейронов через 8–17 дней после высева.&lt;/p&gt;\n&lt;h4 id=\"podgotovka-aso\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#podgotovka-aso\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подготовка ASO:&lt;/span&gt;&lt;/a&gt;Подготовка ASO:&lt;/h4&gt;\n&lt;p&gt;Для приготовления стокового раствора для хранения (100 мкг/мкл) лиофилизированный ASO (gapmer TDP-43 или корректоры сплайсинга UNC13A) ресуспендировали в соответствующем объеме стерильного PBS, pH 7,4. После полного растворения ASO стерилизовали фильтрацией с использованием спин-колонки (0,22 мкм). Стоковый раствор ASO (100 мкг/мкл) аликвотировали и хранили при –20°C для дальнейшего использования. Для приготовления рабочих растворов (~500 мкМ) для дозирования нейронов стоковый раствор (100 мкг/мкл) разбавляли соответствующим образом стерильным PBS, pH 7,4, и стерилизовали фильтрацией через спин-колонку (0,22 мкм). Для определения концентрации рабочего раствора ASO измеряли поглощение при 260 нм на NanoDrop One (ThermoFisher Scientific), а концентрации рассчитывали с использованием коэффициента молекулярной экстинкции для данного ASO. Рабочий раствор ASO аликвотировали и хранили при –20°C. Разведения рабочих растворов до соответствующих уровней дозировки проводили с использованием соответствующего объема стерильного PBS, pH 7,4.&lt;/p&gt;\n&lt;h4 id=\"nokdaun-tdp-43-i-obrabotka-antismyslovymi-oligonukleotidami-aso-v-kletkah\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#nokdaun-tdp-43-i-obrabotka-antismyslovymi-oligonukleotidami-aso-v-kletkah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нокдаун TDP-43 и обработка антисмысловыми олигонуклеотидами (ASO) в клетках:&lt;/span&gt;&lt;/a&gt;Нокдаун TDP-43 и обработка антисмысловыми олигонуклеотидами (ASO) в клетках:&lt;/h4&gt;\n&lt;p&gt;На 19–21 день после высева нейронов gapmer TDP-43 (2 мкМ) или эквивалентный объем PBS (NT) добавляли один раз в клетки путем гимнотического (свободного) поглощения для нокдауна (KD) TDP-43. На 22–27 день после высева нейронов ASO, корректирующие сплайсинг, или контрольный ASO (последовательность nusinersen) добавляли один раз в клетки путем гимнотического поглощения. Gapmer TDP-43 (в концентрации 2 мкМ) или эквивалентный контроль PBS впоследствии добавляли в клетки путем гимнотического поглощения один раз в неделю в течение следующих 3 недель для поддержания стабильных уровней KD. После как минимум 40 дней культивирования с момента высева моторные нейроны обрабатывали для оценки уровней РНК-транскриптов с помощью RT-qPCR.&lt;/p&gt;\n&lt;p&gt;RT-qPCR проводили с использованием набора TaqMan Fast Advanced Cells-to-CT (Thermo Fisher Scientific) в соответствии с инструкцией производителя. Все анализы были приобретены у Thermo Fisher Scientific. Процент экспрессии правильно сплайсированной мРНК UNC13A рассчитывали с использованием метода ∆∆CT и нормализовали к контрольным (NT) клеткам. Процент экспрессии мРНК криптического экзона UNC13A и c-circUNC13A рассчитывали с использованием метода ∆∆CT и нормализовали к клеткам только с KD TDP-43. Неопределенные значения CT для криптического экзона UNC13A и c-circUNC13A (например, в контрольных образцах) преобразовывали в 0% экспрессии. Все анализы выполнялись в R. Все последовательности состоят из полностью 2’MOE-модифицированных оснований с PS-связями, если не указано иное, т.е. gapmer также содержит ДНК-основания.&lt;/p&gt;\n&lt;h4 id=\"transgennye-myshi-hunc13a-bac\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#transgennye-myshi-hunc13a-bac\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Трансгенные мыши hUNC13A BAC:&lt;/span&gt;&lt;/a&gt;Трансгенные мыши hUNC13A BAC:&lt;/h4&gt;\n&lt;p&gt;Трансгенные мыши hUNC13A BAC были получены в компании Taconic Biosciences (Джермантаун, штат Нью-Йорк) путем пронуклеарной инъекции BAC-субклона, несущего ген человека UNC13A (hUNC13A), в эмбрион мыши. Потенциальные линии-основатели были проверены на нейрон-специфическую экспрессию hUNC13A, и для создания колонии была использована одна линия-основатель. Картирование трансгена показало, что эти мыши обладают двумя тандемными копиями гена hUNC13A, при этом интеграция не произошла внутри какого-либо известного белок-кодирующего гена. Следует отметить, что обе копии эндогенного мышиного гена Unc13a (Munc13-1) сохраняются у этих мышей. Мыши содержались как гетерозиготная колония по аллелю hUNC13A. Для данной линии мышей не было зарегистрировано никаких аномальных фенотипов. В исследованиях использовались самки мышей hUNC13A в возрасте 8–12 недель на момент начала эксперимента.&lt;/p&gt;\n&lt;h4 id=\"intracerebroventrikulyarnoe-vvedenie-antismyslovyh-oligonukleotidov\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#intracerebroventrikulyarnoe-vvedenie-antismyslovyh-oligonukleotidov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интрацеребровентрикулярное введение антисмысловых олигонуклеотидов:&lt;/span&gt;&lt;/a&gt;Интрацеребровентрикулярное введение антисмысловых олигонуклеотидов:&lt;/h4&gt;\n&lt;p&gt;Для ICV-инъекций взрослым мышам вводили периоперационный анальгетик и помещали их в стереотаксическую рамку под постоянной изофлурановой анестезией. Уши фиксировали с помощью ушных стержней и носового конуса, после чего удаляли шерсть и дезинфицировали кожу. Затем выполняли срединный разрез вдоль верхней части черепа и отводили кожу, чтобы обнажить брегму и лямбду (места соединения костных швов). Череп выравнивали по брегме и лямбде, определяли место инъекции (-0,5 передне-заднее, +1,0 медиально-латеральное). С помощью стереотаксического манипулятора над местом инъекции высверливали небольшое отверстие стерильным бором. 100 мкл микрошприц Hamilton опускали через место краниотомии так, чтобы отверстие иглы находилось на глубине -1,75 мм дорсально-вентрально ниже поверхности мозга. Десять микролитров раствора ASO 6 в концентрации 30 мг/мл или aCSF вводили с помощью автоматизированного насоса UMP3 UltraMicroPump. Иглу оставляли на месте в течение 3 минут, затем извлекали, а разрез на скальпе ушивали. Мышам давали восстановиться после анестезии в обогреваемой клетке, после чего возвращали в домашнюю клетку.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ICV-инъекция (интрацеребровентрикулярная) — это метод введения веществ непосредственно в желудочки головного мозга, позволяющий обойти гематоэнцефалический барьер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"nokdaun-tardbp,-oposredovannyj-raav\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#nokdaun-tardbp,-oposredovannyj-raav\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нокдаун Tardbp, опосредованный rAAV:&lt;/span&gt;&lt;/a&gt;Нокдаун Tardbp, опосредованный rAAV:&lt;/h4&gt;\n&lt;p&gt;Мышам hUNC13A BAC Tg через 1 неделю после ICV-операции вводили в латеральную хвостовую вену 100–200 мкл общего объема rAAV, содержащего miRNA-последовательность, нацеленную на Tardbp. Вирус rAAV был упакован компанией Packgene Biotech, Inc. (Хьюстон, штат Техас), титры вектора определялись в Trace Neuroscience с использованием праймер-зондовых наборов, специфичных для полезной нагрузки. Животным вводили rAAV из расчета геномов вектора на килограмм массы тела мыши. Этот rAAV использует капсид PHP.eB и генетический фон C57BL/6 мышей hUNC13A BAC для обеспечения широкой нейронной трансдукции при внутривенной инъекции.&lt;/p&gt;\n&lt;h4 id=\"sbor-tkanej-myshej-i-rt-qpcr\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#sbor-tkanej-myshej-i-rt-qpcr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сбор тканей мышей и RT-qPCR:&lt;/span&gt;&lt;/a&gt;Сбор тканей мышей и RT-qPCR:&lt;/h4&gt;\n&lt;p&gt;Мышей умерщвляли через 4 недели после ICV-операции (через 3 недели после введения rAAV) путем анестезии изофлураном и декапитации. Ткани головного и спинного мозга извлекали, помещали в пробирки для гомогенизации мягких тканей (Bertin, P000912-LYSK0-A или P000933-LYSK0-A), взвешивали и быстро замораживали в жидком азоте. Ткани гомогенизировали на гомогенизаторе Precellys Evolution Touch (Bertin Technologies) в лизирующем буфере из набора MagMax mirVana Total RNA Isolation Kit (Thermo Fisher Scientific). РНК экстрагировали с использованием набора MagMax mirVana Total RNA Isolation Kit (Thermo Fisher Scientific) на основе магнитных частиц на приборе KingFisher Apex (Thermo Fisher Scientific). РНК количественно определяли с помощью флуориметра Qubit (Thermo Fisher Scientific), и одинаковое количество РНК на ткань для каждой мыши подвергали обратной транскрипции в кДНК с использованием SuperScript IV VILO Master Mix (Thermo Fisher Scientific). Taqman qPCR проводили с использованием TaqMan Fast Advanced Master Mix (Thermo Fisher Scientific) в соответствии с инструкциями производителя с использованием следующих мультиплексных анализов: c-circUNC13A и Hprt1 в качестве референсного гена. Оба анализа были приобретены у Thermo Fisher Scientific. Процент экспрессии c-circUNC13A рассчитывали с использованием метода ∆∆CT с нормализацией по Hprt1 и нормализацией по условиям обработки TDP-43 KD/aCSF ICV.&lt;/p&gt;\n&lt;h4 id=\"vydelenie-i-analiz-rnk\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#vydelenie-i-analiz-rnk\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Выделение и анализ РНК:&lt;/span&gt;&lt;/a&gt;Выделение и анализ РНК:&lt;/h4&gt;\n&lt;p&gt;Выделение РНК проводили с использованием набора RNeasy® mini kit (Qiagen) или Direct-zol RNA Miniprep (Zymo research) в соответствии с протоколом производителя с дополнительным этапом обработки ДНКазой I на колонке. Концентрации РНК измеряли на приборе NanoDrop One (ThermoFisher Scientific), и для обратной транскрипции использовали равные количества, если не указано иное. Обратную транскрипцию проводили с использованием набора RevertAid cDNA synthesis kit (ThermoFisher Scientific), Superscript IV (ThermoFisher Scientific) или Induro (NEB). Для RevertAid и Superscript IV реакция проводилась согласно протоколу производителя. Для Induro денатурацию РНК и отжиг праймеров проводили путем инкубации матричной РНК с 1 мкл 100 мкМ случайных гексамеров в объеме 12 мкл при 65°C в течение 5 минут с последующим охлаждением на льду в течение 2 минут. Затем добавляли смесь, содержащую 4 мкл 5 X Induro RT Reaction Buffer (NEB), 2 мкл MgCl2 30 мМ (Sigma-Aldrich), 1 мкл 10 мМ дНТФ (ThermoFisher Scientific), 1 мкл ингибитора РНКазы RiboLock 20 Ед/мкл (ThermoFisher Scientific) и 200 Ед Induro RT (NEB), и реакцию инкубировали при 23°C в течение 10 минут, при 30°C в течение 5 минут и при 55°C в течение 1 часа, с последующей тепловой инактивацией при 95°C в течение 1 минуты. Анализы RT-qPCR проводили с использованием реагента PowerUp SYBR Green Master Mix (ThermoFisher Scientific) или TaqMan™ Multiplex Master Mix (ThermoFisher Scientific). Амплификацию ДНК отслеживали на системе QuantStudio 5 Real-Time PCR (Applied Biosystems) с использованием метода ΔΔCt. Относительное количество РНК рассчитывали как изменение кратности (2−ΔΔCt) по отношению к экспериментальному контрольному образцу, принятому за 1, и нормализовали по референсному гену (GAPDH mRNA или TDP mRNA), если не указано иное.&lt;/p&gt;\n&lt;h4 id=\"analiz-rabochej-harakteristiki-priemnika-roc\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#analiz-rabochej-harakteristiki-priemnika-roc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ рабочей характеристики приемника (ROC):&lt;/span&gt;&lt;/a&gt;Анализ рабочей характеристики приемника (ROC):&lt;/h4&gt;\n&lt;p&gt;Анализ кривых рабочей характеристики приемника (ROC) был выполнен на данных количественной ПЦР, состоящих из значений Ct, нормализованных по контрольному гену GAPDH (ΔCt), которые впоследствии были преобразованы в log10 перед анализом. Для каждой отдельной circRNA ROC-кривые были построены путем сравнения нормализованных значений экспрессии, преобразованных в log10, между случаями FTD-TDP и объединенной контрольной группой (CTRL и FTD-non-TDP). Площадь под ROC-кривой (AUC) и ее 95% доверительный интервал (ДИ) были рассчитаны с использованием R-пакета pROC со стандартными параметрами, где ДИ оценивались с помощью метода ДеЛонга. Комбинированный классификатор был создан путем подгонки многофакторной модели логистической регрессии, включающей все маркеры circRNA в качестве предикторов и статус FTD-TDP в качестве бинарного результата. Предсказанные вероятности из модели логистической регрессии впоследствии использовались для построения ROC-кривой и расчета соответствующей AUC для комбинированного классификатора.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AUC (площадь под кривой) — это показатель качества классификатора: значение 0,5 соответствует случайному угадыванию, а 1,0 — идеальному разделению групп.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sravnenie-aktivnosti-induro-i-superscript-iv\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#sravnenie-aktivnosti-induro-i-superscript-iv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сравнение активности Induro и Superscript IV:&lt;/span&gt;&lt;/a&gt;Сравнение активности Induro и Superscript IV:&lt;/h4&gt;\n&lt;p&gt;Для сравнения Superscript IV и Induro 500 нг транскрибированной in vitro РНК, несущей нуклеотидную последовательность c-circUNC13A — либо в кольцевой, либо в линейной форме, сохраняющей последовательность сайта обратного сплайсинга — подвергали обратной транскрипции с помощью либо Superscript IV (200 Ед), либо Induro (200 Ед) в 20 мкл реакционной смеси со случайными гексамерами, следуя инструкциям производителя для Superscript IV и вышеупомянутому протоколу для Induro. После завершения реакций 1 мкл каждого образца разбавляли и использовали для RT-qPCR анализа. Оставшуюся часть сначала обрабатывали протеиназой K (ThermoFisher Scientific) и инкубировали при 37°C в течение 15 минут и при 55°C в течение 20 минут. Затем реакции очищали с помощью магнитных частиц Mag-Bind® TotalPure NGS Beads (Omega Bio-tek) в соответствии с протоколом производителя и элюировали в 26 мкл воды. Часть каждого образца сохраняли, а остальное обрабатывали 1,5 мкл РНКазы H (NEB) и 1,5 мкл РНКазы If (NEB), инкубировали при 37°C в течение 30 минут и при 70°C в течение 20 минут. Все образцы — до или после обработки РНКазой — наносили на 0,8% агарозный гель TAE рядом с маркером молекулярного веса 1 kb Plus DNA Ladder (NEB), а затем окрашивали красителем SYBR™ Gold Nucleic Acid Gel Stain (ThermoFisher Scientific) перед визуализацией.&lt;/p&gt;\n&lt;h4 id=\"obrabotka-rnkazoj-r\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#obrabotka-rnkazoj-r\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обработка РНКазой R:&lt;/span&gt;&lt;/a&gt;Обработка РНКазой R:&lt;/h4&gt;\n&lt;p&gt;Для обработки РНКазой R 3 мкг общей РНК разбавляли в 20 мкл реакционной смеси с 5 Ед РНКазы R (Lucigen), затем инкубировали 15 минут при 37°C. Реакции очищали путем добавления 300 мкл TRIzol (ThermoFisher Scientific), дополненного 4 пг молекулы ДНК-спайка, которая позже использовалась для нормализации RT-qPCR, и последующей фенол-хлороформной экстракцией.&lt;/p&gt;\n&lt;h4 id=\"ingibirovanie-nonsens-oposredovannogo-raspada-nmd-i-subkletochnoe-frakcionirovanie\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#ingibirovanie-nonsens-oposredovannogo-raspada-nmd-i-subkletochnoe-frakcionirovanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ингибирование нонсенс-опосредованного распада (NMD) и субклеточное фракционирование:&lt;/span&gt;&lt;/a&gt;Ингибирование нонсенс-опосредованного распада (NMD) и субклеточное фракционирование:&lt;/h4&gt;\n&lt;p&gt;Для экспериментов по фракционированию клетки SH-SY5Y обрабатывали в течение 10 дней 25 нг/мл доксициклина гиклата (Sigma) для индукции shRNA против TDP-43 и в течение 24 часов 0,5 мкМ ингибитором SMG1-11j для блокирования аппарата NMD. Через 10 дней клетки трипсинизировали, осаждали и ресуспендировали в 1X PBS (Thermo). Часть ресуспендированных клеток осаждали и использовали для субклеточного фракционирования с помощью набора Ambion PARIS Kit (Life Technologies) в соответствии с инструкциями производителя. РНК из ядерной и цитозольной фракций экстрагировали с помощью набора Direct-zol (Zymo) с обработкой ДНКазой I на колонке и количественно определяли с помощью NanoDrop One (ThermoFisher Scientific). Для каждого экспериментального условия 2 мкг цитоплазматической РНК и равный объем ядерной фракции РНК подвергали обратной транскрипции с помощью набора RevertAid First Strand cDNA Synthesis Kit (Thermo Fisher Scientific) согласно инструкциям производителя. RT-qPCR выполняли с использованием реактива PowerUp SYBR Green Master Mix (ThermoFisher Scientific). Амплификацию ДНК отслеживали на системе QuantStudio 5 Real-Time PCR (Applied Biosystems). Относительное содержание каждого транскрипта в ядерной и цитоплазматической фракциях оценивали по значениям Ct как 2^−Ct, а долю транскрипта в каждом компартменте рассчитывали относительно суммы двух фракций, которая была принята за 100%.&lt;/p&gt;\n&lt;h4 id=\"vestern-blotting\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#vestern-blotting\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вестерн-блоттинг:&lt;/span&gt;&lt;/a&gt;Вестерн-блоттинг:&lt;/h4&gt;\n&lt;p&gt;i3Neurons гомогенизировали в лизирующем буфере RIPA (Thermo Fisher Scientific, кат. № 89900), дополненном коктейлем ингибиторов протеаз cOmpleteTM EDTA-free (Roche, кат. № 11836170001) и ингибитором фосфатаз PhoSTOP (Roche, 4906845001). Образцы наносили на белковый гель NuPAGE 4−12% Bis-Tris (Invitrogen) и проводили электрофорез в буфере NuPAGE MOPS. Белки переносили на нитроцеллюлозную мембрану для блоттинга с использованием буфера Trans-Blot Turbo 5x Transfer Buffer (BioRad, 10026938) и системы Trans-Blot Turbo Transfer System в течение 30 минут. Мембрану блокировали в 5% обезжиренном молоке в TBST (20 мМ Tris, 150 мМ NaCl и 0,1% Tween 20) и инкубировали в течение ночи с первичными антителами, разведенными в 5% обезжиренном молоке в TBST (анти-RPTOR (Proteintech, 20984-1-AP) 1:2000, анти-EHMT1 (Bethyl Laboratories A301-642A) 1:2000, анти-TDP-43 (Proteintech, 10782-2-AP) 1:2000 и анти-TUBULIN (Proteintech, 66031) 1:2000). После 1-часовой инкубации со вторичными антителами, конъюгированными с пероксидазой хрена (HRP), разведенными в 5% молоке в TBST (анти-мышиные HRP (Bio-Rad, 1706516) 1:10 000 и анти-кроличьи HRP (Bio-Rad, 1706515) 1:10 000), мембрану проявляли с использованием субстрата Immobilon Classico HRP (Sigma-Aldrich) и системы Bio-Rad ChemiDoc.&lt;/p&gt;\n&lt;h4 id=\"rnk-sekvenirovanie-i-predvaritelnaya-obrabotka\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#rnk-sekvenirovanie-i-predvaritelnaya-obrabotka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;РНК-секвенирование и предварительная обработка:&lt;/span&gt;&lt;/a&gt;РНК-секвенирование и предварительная обработка:&lt;/h4&gt;\n&lt;p&gt;Библиотеки для секвенирования SH-SY5Y, SK-N-BE(2) и i3N были подготовлены с помощью набора KAPA RNA HyperPrep с RiboErase и секвенированы на аппарате NovaSeq 6000. Для SH-SY5Y использовалось парно-концевое чтение 150 п.н., для i3N — парно-концевое чтение 100 п.н. Качество образцов обрезалось с помощью Fastp с параметром “qualified_quality_phred: 10”, и выравнивалось на геном GRCh38, построенный с использованием STAR (v2.7.0f) с генными моделями из GENCODE v31. Экспрессия генов количественно определялась с использованием FeatureCounts с генными моделями из GENCODE v31.&lt;/p&gt;\n&lt;h4 id=\"detekciya-circrna-s-pomoshyu-ciri2\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#detekciya-circrna-s-pomoshyu-ciri2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Детекция circRNA с помощью CIRI2:&lt;/span&gt;&lt;/a&gt;Детекция circRNA с помощью CIRI2:&lt;/h4&gt;\n&lt;p&gt;Обработанные прочтения картируются на референсный геном человека (GRCh38) с использованием BWA-MEM (v0.7.17) с опцией -T 19. Детекция circRNA в каждом образце затем выполняется с помощью программного обеспечения CIRI2 (v2.0.6), которое способно идентифицировать circRNA путем поиска прочтений, картирующихся на сайты обратного сплайсинга (back-splicing junctions). Для идентификации генов-хозяев circRNA программе предоставляется аннотация генов Ensembl 108. Для каждого обнаруженного события обратного сплайсинга CIRI2 сообщает количество прочтений, картирующихся на сайт обратного сплайсинга, и на соответствующие сайты линейного сплайсинга, рассчитанное путем суммирования всех прочтений, картирующихся линейно на оба сайта сплайсинга, участвующих в обратном сплайсинге; последние не указываются, если ни одно прочтение не назначено на сайт обратного сплайсинга, даже если кольцевая РНК обнаружена в других образцах. Чтобы подсчитать прочтения, картирующиеся на сайты линейного сплайсинга (соответствующий сайт линейного сплайсинга, SJ) в образцах, где не было картировано прочтений на соответствующие сайты обратного сплайсинга, обнаруженные в других образцах, файлы выравнивания из каждого образца были модифицированы путем добавления прочтений, картирующихся на circRNA, найденные только в других образцах, и CIRI2 был перезапущен на этих файлах. Операции с файлами выравнивания выполнялись с использованием пакета Picard (v2.24.1) и SAMtools (v1.10).&lt;/p&gt;\n&lt;h4 id=\"analiz-differencialnoj-ekspressii\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#analiz-differencialnoj-ekspressii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ дифференциальной экспрессии:&lt;/span&gt;&lt;/a&gt;Анализ дифференциальной экспрессии:&lt;/h4&gt;\n&lt;p&gt;Для оценки дифференциальной экспрессии circRNA между условиями нокдауна и контроля, пакет edgeR (v3.34.1) для R получает на вход количество прочтений для обнаруженных событий обратного сплайсинга. События с низким количеством прочтений не тестируются на дифференциальную экспрессию. Порог низких значений был установлен на основе количества образцов в группе, а именно: 2 прочтения как минимум в 2 образцах для SH-SY5Y и SK-N-BE(2), 2 прочтения как минимум в 2 образцах для i3LMN и 2 прочтения как минимум в 6 образцах для i3N. Для каждого сравнения образцы нормализуются с использованием стандартной нормализации edgeR (TMM); подгонка модели и тестирование выполняются с использованием функций glmFIT и glmLRT. Прочтения, картирующиеся на сайты обратного сплайсинга, преобразуются в значения Count Per Million (CPM) с использованием edgeR и используются для количественного определения circRNA. Учитывая небольшое количество прочтений, используемых для тестирования, мы решили использовать p-значение вместо частоты ложных открытий (FDR) для выбора дифференциально экспрессируемых событий, установив порог значимости на уровне 0,05. Мы определили как «High-Confidence» circRNA, значимо повышенные как минимум в 2 из клеточных линий. Мы считали «криптическими» (cryptic) те, что были повышены в условиях TDP-KD, с менее чем 1 прочтением на контрольный образец. Для анализа линейных РНК и соответствующих сайтов линейного сплайсинга мы применяли те же пороги количества прочтений. Тепловые карты и графические представления Upset plot были построены с использованием пакета ComplexHeatmap (v2.8.0) для R.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод edgeR использует статистические модели для определения того, являются ли различия в количестве прочтений между группами статистически значимыми, учитывая вариабельность данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"analiz-clr\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#analiz-clr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ CLR:&lt;/span&gt;&lt;/a&gt;Анализ CLR:&lt;/h4&gt;\n&lt;p&gt;Для каждого образца количество прочтений сайтов обратного сплайсинга (BSJ) и количество прочтений соответствующих сайтов линейного сплайсинга (SJ) были извлечены из выходного файла CIRI2. Для каждого события circRNA было вычислено соотношение кольцевой и линейной формы (CLR). CLR рассчитывалось как: CLR = 2BSJ/(2BSJ+SJ). Следуя руководству CIRI2, значения BSJ умножались на два, чтобы скорректировать асимметрию между вкладами кольцевых и линейных прочтений: каждое прочтение, охватывающее BSJ, представляет последовательность, происходящую с обеих сторон кольцевого соединения, но учитывается только один раз, тогда как линейные (не соединительные) прочтения происходят с одного конца. Затем рассчитывалось среднее CLR отдельно для групп CTRL и нокдауна TDP-43 (KD), и разница между средними значениями групп (ΔCLR) использовалась для количественной оценки изменений в кольцеобразовании: ΔCLR = CLRKD - CLRCTRL. Для оценки статистической значимости мы применили биномиальную обобщенную линейную модель (GLM), в которой значения 2BSJ рассматривались как «успехи», а значения SJ — как «неудачи». Для каждого события circRNA были подогнаны две вложенные модели: нулевая модель, предполагающая отсутствие эффекта условия (CLR постоянен во всех образцах), и полная модель, включающая условие в качестве предиктора. Тест отношения правдоподобия (LRT) затем использовался для сравнения моделей и определения того, значительно ли улучшает подгонку модели включение члена условия.&lt;/p&gt;\n&lt;h4 id=\"analiz-sajtov-svyazyvaniya-tdp\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#analiz-sajtov-svyazyvaniya-tdp\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ сайтов связывания TDP:&lt;/span&gt;&lt;/a&gt;Анализ сайтов связывания TDP:&lt;/h4&gt;\n&lt;p&gt;Регионы связывания TDP были получены из базы данных POSTAR3. Повышенные circRNA (кандидаты) были протестированы на связывание TDP в их фланкирующих интронах (конкретно, в регионе +- 1000 п.н. от BSJ или меньше, если он пересекается с экзонным регионом). Для каждого кандидата были выбраны 2 контрольные circRNA из инвариантных circRNA (p-значение &amp;gt; 0,05) с учетом свойств фланкирующих интронов (длина, %GC, расстояние между экзонами обратного сплайсинга) и экспрессии гена-хозяина в контрольных условиях. С помощью U-критерия Манна-Уитни мы проверили, что свойства описанных выше окон сбалансированы между двумя наборами. CircRNA, имеющие как минимум 2 перекрывающихся региона связывания TDP в 2 независимых наборах данных, были определены как TDP-интеракторы. Обогащение связывания TDP-43 во фланкирующих интронах c-circRNA относительно подобранных контрольных circRNA оценивалось с использованием точного теста Фишера.&lt;/p&gt;\n&lt;h4 id=\"analiz-kartirovaniya-kripticheskih-ekzonov\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#analiz-kartirovaniya-kripticheskih-ekzonov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ картирования криптических экзонов:&lt;/span&gt;&lt;/a&gt;Анализ картирования криптических экзонов:&lt;/h4&gt;\n&lt;p&gt;Геномные координаты зависящих от TDP-43 событий криптического сплайсинга были получены из работы Brown et al., включая как события включения экзонов, так и события пропуска экзонов. Координаты фланкирующих интронов c-circRNA были извлечены из соответствующих аннотаций транскриптов. Тот же набор подобранных контрольных circRNA, который использовался для анализа связывания TDP-43, был использован в качестве фона. Криптическое событие считалось связанным с circRNA, когда его геномные координаты перекрывались, с учетом цепи, с любым из двух фланкирующих интронов. Обогащение событий криптического сплайсинга во фланкирующих интронах c-circRNA относительно подобранных контрольных circRNA оценивалось с использованием точного теста Фишера.&lt;/p&gt;\n&lt;h4 id=\"kogorta-rna-sequencing-konsorciuma-nygc-als\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#kogorta-rna-sequencing-konsorciuma-nygc-als\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Когорта RNA-sequencing консорциума NYGC ALS:&lt;/span&gt;&lt;/a&gt;Когорта RNA-sequencing консорциума NYGC ALS:&lt;/h4&gt;\n&lt;p&gt;Для секвенирования РНК посмертных тканей мы использовали образцы из консорциума NYGC ALS, включая контрольные группы без неврологических заболеваний, с лобно-височной долевой дегенерацией (FTLD), боковым амиотрофическим склерозом (БАС), БАС с сопутствующей лобно-височной деменцией (ALS-FTLD) или БАС с подозрением на болезнь Альцгеймера (ALS-AD). Пациенты с лобно-височной деменцией (FTLD) были классифицированы на основе диагноза патологоанатома как FTLD с включениями TDP-43 (FTLD-TDP), а также пациенты с агрегатами FUS или тау-белка. Образцы БАС были разделены на следующие подкатегории с использованием доступных метаданных консорциума: БАС с зарегистрированными мутациями SOD1 или FUS либо без них. Все образцы БАС без мутаций SOD1 или FUS для простоты были сгруппированы в настоящей работе как ALS-TDP, хотя регистрация посмертных включений TDP-43 не носила систематического характера и поэтому не была интегрирована в метаданные. Подтвержденная посмертная патология TDP-43 была зарегистрирована для всех образцов FTLD-TDP. Обработка образцов, подготовка библиотек и контроль качества РНК-секвенирования подробно описаны в предыдущих работах.&lt;/p&gt;\n&lt;p&gt;Кратко: РНК экстрагировали из быстрозамороженной посмертной ткани с использованием TRIzol (Thermo Fisher Scientific) и хлороформа, а библиотеки RNA-Seq подготавливали из 500 нг общей РНК с использованием набора KAPA Stranded RNA-Seq Kit with RiboErase (KAPA Biosystems) для истощения рибосомальной РНК. Объединенные библиотеки (средний размер вставки: 375 п. н.), прошедшие критерии качества, секвенировали либо на приборе Illumina HiSeq 2500 (парные концы по 125 п. н.), либо на Illumina NovaSeq (парные концы по 100 п. н.). Медианная глубина секвенирования образцов составляла 42 миллиона пар ридов в диапазоне от 16 до 167 миллионов пар ридов. Образцы обрабатывались единообразно, включая удаление адаптеров с помощью Trimmomatic и выравнивание на сборку генома hg38 с использованием STAR (2.7.2a) с индексами из GENCODE v30.&lt;/p&gt;\n&lt;p&gt;Масштабный контроль качества выполнялся с использованием SAMtools и Picard Tools для подтверждения пола и ткани происхождения. Потенциальные мешающие переменные оценивались независимо для каждой ткани. Различия в глубине секвенирования, показателе целостности РНК (RIN) и возрасте на момент смерти между группами оценивали с использованием двусторонних тестов Вилкоксона — Манна — Уитни с последующей поправкой Бонферрони на множественные сравнения. Распределение по полу сравнивали с помощью точного теста Фишера.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RIN (RNA Integrity Number) — стандартизированный показатель целостности и качества молекул РНК по шкале от 1 до 10, где высокие значения указывают на отсутствие деградации материала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vyyavlenie-cirkuliruyushih-rnk-circrna-i-analiz-obogasheniya-v-konsorciume-nygc\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#vyyavlenie-cirkuliruyushih-rnk-circrna-i-analiz-obogasheniya-v-konsorciume-nygc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Выявление циркулирующих РНК (circRNA) и анализ обогащения в консорциуме NYGC:&lt;/span&gt;&lt;/a&gt;Выявление циркулирующих РНК (circRNA) и анализ обогащения в консорциуме NYGC:&lt;/h4&gt;\n&lt;p&gt;Циркулирующие РНК (circRNA) выявлялись так же, как описано в разделе «CircRNA detection». CircRNA считалась экспрессируемой в образце, если был обнаружен по крайней мере один рид, поддерживающий сайт обратного сплайсинга (BSJ). Для выявления circRNA, обогащенных в образцах ALS-TDP, мы сравнивали долю образцов, экспрессирующих каждую circRNA, между группами ALS-TDP и контрольной группой независимо для каждой ткани с использованием точного теста Фишера. Значения p корректировались на множественные сравнения с использованием процедуры Бенджамини — Хохберга. CircRNA, обогащенные в образцах ALS-TDP и обнаруженные менее чем в 5% контрольных образцов, классифицировались как скрытые circRNA (c-circRNA). Для отдельных кандидатов c-circRNA экспрессия количественно оценивалась в ридах на миллион картированных ридов (RPM), рассчитываемых на основе ридов, поддерживающих BSJ, нормированных на общее количество картированных ридов. Соответствующие линейные транскрипты количественно оценивались с использованием программы Salmon (v1.8.0) и выражались в транскриптах на миллион (TPM). Различия между группами оценивались независимо для каждой ткани с использованием двусторонних тестов Вилкоксона — Манна — Уитни с последующей поправкой Бонферрони на множественные сравнения. Тепловые карты (heatmaps) были построены с использованием пакета ComplexHeatmap58 для R (v2.8.0).&lt;/p&gt;\n&lt;h4 id=\"analiz-skrytoj-nagruzki-tdp-43\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#analiz-skrytoj-nagruzki-tdp-43\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ скрытой нагрузки TDP-43:&lt;/span&gt;&lt;/a&gt;Анализ скрытой нагрузки TDP-43:&lt;/h4&gt;\n&lt;p&gt;Оценки скрытой нагрузки TDP-43 были получены так же, как описано ранее.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RPM и TPM — стандартные биоинформатические единицы нормализации экспрессии: RPM учитывает общее число картированных ридов в библиотеке, а TPM дополнительно корректирует показатель с учетом длины транскрипта, позволяя корректно сравнивать уровни экспрессии разных генов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для каждой ткани образцы ранжировались в соответствии с их оценкой нагрузки и разделялись на группу с низкой нагрузкой (нижние 25%) и группу с высокой нагрузкой (верхние 25%). Различия в глубине секвенирования между группами с разной нагрузкой оценивались независимо для каждой ткани с использованием двусторонних тестов Вилкоксона — Манна — Уитни с поправкой Бонферрони. Обогащение circRNA между группами с высокой и низкой нагрузкой оценивалось независимо для каждой ткани с помощью точного теста Фишера путем сравнения доли образцов, экспрессирующих каждую circRNA в обеих группах.&lt;/p&gt;\n&lt;h4 id=\"statisticheskoe-programmnoe-obespechenie-i-vizualizaciya\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#statisticheskoe-programmnoe-obespechenie-i-vizualizaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистическое программное обеспечение и визуализация:&lt;/span&gt;&lt;/a&gt;Статистическое программное обеспечение и визуализация:&lt;/h4&gt;\n&lt;p&gt;Все статистические анализы выполнялись с использованием R60 (v4.5.1). Анализы кривых операционных характеристик (ROC-кривых) проводились с использованием pROC61 (v1.19.0.1). Графические изображения были созданы с использованием пакетов R: ggplot262 (v4.0.1), ComplexHeatmap58 (v2.24.1), EnhancedVolcano63 (v1.26.0), eulerr64 (v7.0.4), circlize65 (v0.4.16), ggvenn66 (v0.1.19), ggpubr67 (v0.6.2), RColorBrewer68 (v1.1.3) и viridisLite69 (v0.4.2). Распределение и отклонение данных, представленных на рисунках в данной работе, статистические тесты, используемые для расчета значимых различий, и точное значение n (например, количество биологических повторностей экспериментов) указаны в подписях к рисункам. В подписях к рисункам «SD» обозначает «стандартное отклонение» (standard deviation), а «SEM» обозначает «стандартную ошибку среднего» (standard error mean). Значения статистической значимости на рисунках обозначались с помощью следующей схемы: n.s. p &amp;gt; 0.05, *p &amp;lt; 0.05, **p &amp;lt; 0.01, ***p &amp;lt; 0.001. На коробчатых диаграммах (boxplot) межквартильный размах охватывает данные от 75-го до 25-го перцентиля, а медиана отмечена линией внутри коробки (50-й перцентиль). При необходимости данные визуализировались с использованием программы GraphPad Prism 10.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сбой белка&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;TDP-43 при БАС&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;и ЛВД&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\
