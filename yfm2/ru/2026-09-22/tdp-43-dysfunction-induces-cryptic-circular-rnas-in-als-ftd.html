        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"254\" cy=\"130\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"486\" cy=\"276\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Скрытые кольцевые молекулы&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;РНК выдают опасное&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;нейродегенеративное&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;заболевание&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd-f1.jpg\" alt=\"Рисунок 1 — Истощение TDP-43 стимулирует экспрессию c-circRNA в нескольких клеточных моделях: A) Вулканические диаграммы\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1 — Истощение TDP-43 стимулирует экспрессию c-circRNA в нескольких клеточных моделях: A) Вулканические диаграммы, показывающие log₂ изменения кратности (ось x) и −log₁₀ P-значение (ось y) для всех circRNA, идентифицированных в четырех наборах данных RNA-seq (SH-SY5Y, SK-N-BE(2), i3LMN и i3N) после нокдауна TDP-43. Инвариантные circRNA показаны серым цветом, дифференциально экспрессирующиеся circRNA (точки выше горизонтального порога −log10 P-значения) — красным, а криптические circRNA — темно-красным. B) График UpSet, показывающий перекрытие upregulated (повышенно экспрессирующихся) circRNA, идентифицированных в четырех моделях нокдауна TDP-43: SH-SY5Y, SK-N-BE(2), i3LMN и i3N. Горизонтальные полосы справа указывают общее количество circRNA с повышенной экспрессией при нокдауне TDP-43 в каждой модели, в то время как вертикальные полосы представляют размер каждого пересечения. Соединенные точки обозначают наборы данных, вносящие вклад в каждое пересечение. Нижняя панель суммирует количество circRNA с повышенной экспрессией в соответствии с количеством моделей, в которых они были идентифицированы. circRNA с повышенной экспрессией по крайней мере в двух из четырех моделей были классифицированы как «circRNA с высокой степенью достоверности» и сохранены для дальнейшего анализа. C) Воронкообразная диаграмма, иллюстрирующая стратегию фильтрации, использованную для идентификации криптических circRNA, связанных с TDP-43. Среди 148 circRNA с высокой степенью достоверности 76 соответствовали критериям криптических circRNA (c-circRNA). Интеграция с наборами данных TDP-43 CLIP выявила 22 c-circRNA с признаками связывания TDP-43 в их фланкирующих интронах. D) Тепловая карта, показывающая значения Log2 Fold Change (Log2FC) c-circRNA с высокой степенью достоверности в четырех клеточных моделях нокдауна TDP-43: SH-SY5Y, SK-N-BE(2), i3LMN и i3N. c-circRNA сгруппированы в соответствии с количеством наборов данных, в которых они были идентифицированы (List 2/4, List 3/4 и List 4/4), и ранжированы по их среднему Log₂FC по наборам данных, как указано на гистограммах над тепловой картой. Интенсивность цвета указывает на величину повышения экспрессии circRNA после истощения TDP-43. Черные полосы обозначают c-circRNA с признаками связывания TDP-43 во фланкирующих интронах на основе данных CLIP, тогда как серые полосы указывают на отсутствие детектируемого связывания TDP-43.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;При боковом амиотрофическом склерозе и лобно-височной деменции белок TDP-43 перестает работать правильно внутри клеточного ядра. Из-за этого нарушается обработка генетических инструкций и возникают прежде неизвестные кольцевые молекулы РНК. Ученые научились находить эти аномалии в тканях мозга, открывая перспективы для точной диагностики. Кроме того, одна из таких молекул связана с ключевым геном болезни, что поможет отслеживать эффективность новых лекарств.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Дефицит белка TDP-43 запускает сборку аномальных кольцевых РНК.&lt;/li&gt;\n&lt;li&gt;Новый метод детекции позволяет находить патологию мозга с AUC 0.99.&lt;/li&gt;\n&lt;li&gt;Кольцевая РНК из гена UNC13A может стать биомаркером новых лекарств.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Белок TDP-43 в норме контролирует созревание рибонуклеиновых кислот в ядре нервных клеток, но при боковом амиотрофическом склерозе (БАС) и лобно-височной деменции (ЛВД) он покидает ядро. Авторы работы выяснили, что ядерный дефицит TDP-43 приводит к появлению особых криптических кольцевых РНК (c-circRNA) в человеческих нейрональных клеточных моделях. Анализ транскриптомов посмертных тканей мозга подтвердил, что эти кольцевые молекулы специфичны именно для случаев БАС и ЛВД с патологией TDP-43.&lt;/p&gt;\n&lt;p&gt;Исследователи разработали высокочувствительные методы детекции на основе метода амплитуды с круговой петлей (rolling-circle amplification), которые позволяют выявлять патологию в тканях центральной нервной системы с площадью под ROC-кривой (AUC) 0.99. Оказалось, что образование таких кольцевых молекул часто совпадает с линейными ошибками сплайсинга (вырезания неинформативных участков), что ведет к потере жизненно важных белков RPTOR и EHMT1. Примечательно, что одна из таких молекул образуется из гена UNC13A, известного генетического фактора риска БАС, на который направлены разрабатываемые антисмысловые олигонуклеотиды (ASO).&lt;/p&gt;\n&lt;p&gt;Подавление криптического экзона UNC13A снижает уровень c-circUNC13A как в культивируемых нейронах, так и in vivo (в живом организме). Это делает обнаруженную кольцевую молекулу потенциальным биомаркером для оценки связывания лекарства с мишенью в клинических испытаниях новых методов терапии. Работа раскрывает фундаментальные механизмы нарушения РНК при нейродегенерации и предлагает практические инструменты для контроля терапии.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Выводы основаны на клеточных моделях и анализе посмертных тканей человека, поэтому требуют проверки в клинических условиях на живых пациентах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Ядерное истощение TDP-43 является определяющим патологическим признаком бокового амиотрофического склероза (БАС) и лобно-височной деменции (ЛВД), приводящим к масштабным нарушениям процессинга РНК, включая образование криптических экзонов. В данной работе мы определили TDP-43 как регулятор биогенеза кольцевых РНК (circRNA) в различных моделях нейрональных клеток человека и показали, что его дисфункция индуцирует de novo образование криптических кольцевых РНК (ccircRNA).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дисфункция TDP-43 вызывает появление специфических криптических кольцевых РНК (ccircRNA), которые служат маркерами патологии БАС и ЛВД.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ транскриптомных данных посмертных образцов мозга позволил выявить подмножество ccircRNA, специфичных для случаев БАС и ЛВД с патологией TDP-43. Кроме того, мы разработали высокочувствительные методы детекции circRNA на основе амплификации с вытеснением цепи (rolling-circle amplification), которые позволяют диагностировать патологию TDP-43 в тканях ЦНС человека с AUC 0,99.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AUC (площадь под ROC-кривой) — показатель качества классификации; значение 0,99 означает практически идеальную точность метода в различении больных и здоровых образцов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы обнаружили, что c-circRNA могут возникать одновременно с криптическими событиями линейного сплайсинга, выявляя сложные «горячие точки» нарушения процессинга РНК, которые приводят к потере белков, значимых для заболевания, включая RPTOR и EHMT1. Примечательно, что одна из таких c-circRNA образуется из гена UNC13A, криптический экзон которого ранее был связан с одним из ключевых локусов GWAS при БАС/ЛВД и рассматривается как терапевтическая мишень для антисмысловых олигонуклеотидов (ASO), модулирующих сплайсинг.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на анализе посмертных тканей и клеточных моделей; для подтверждения клинической значимости требуются дальнейшие исследования на живых пациентах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы показали, что c-circUNC13A корегулируется с линейным криптическим транскриптом, а подавление криптического экзона UNC13A приводит к снижению уровня c-circUNC13A в культивируемых нейронах и in vivo, что подчеркивает потенциал этой молекулы в качестве биомаркера эффективности воздействия для новых методов терапии, направленных на UNC13A. В целом, данная работа выявляет новый молекулярный механизм дисфункции TDP-43, открывая новые пути для понимания патогенеза заболевания и разработки крайне необходимых биомаркеров патологии.&lt;/p&gt;\n&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Цитоплазматическое накопление и истощение ядерного пула TDP-43 являются ключевым патоморфологическим признаком бокового амиотрофического склероза (БАС) и примерно 50% случаев лобно-височной деменции (ЛВД). TDP-43 представляет собой РНК-связывающий белок, участвующий в регуляции различных этапов процессинга РНК, включая сплайсинг и полиаденилирование. Потеря ядерного TDP-43 приводит к формированию новых событий сплайсинга и терминации (криптических событий; CEs). Большинство CEs ведут к потере белка либо посредством нонсенс-опосредованного распада транскриптов (NMD), либо через усечение транскрипта, а в некоторых случаях криптическое полиаденилирование стимулирует увеличение экспрессии белка за счет повышенной стабильности РНК. В меньшинстве случаев CEs находятся в рамке считывания и не содержат преждевременных стоп-кодонов, что приводит к появлению дополнительных пептидов, называемых криптическими пептидами (CP).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Криптические события (CEs) — это аномальные варианты процессинга РНК, возникающие из-за потери нормальной функции белка TDP-43 в ядре клетки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Было показано, что изменения процессинга криптической РНК играют важную роль в патогенезе и прогрессировании заболевания, а разрабатываемые методы таргетной терапии, направленные на коррекцию отдельных CEs, в настоящее время проходят клинические испытания. CEs и CPs могут быть исключительно специфичными для патологического состояния и использовались для обнаружения и количественной оценки степени дисфункции TDP-43 в тканях пациентов. Эта специфичность также открывает перспективы для разработки биомаркеров в биологических жидкостях. Однако CEs нестабильны в биожидкостях и часто подвергаются внутриклеточной деградации. CPs были обнаружены в спинномозговой жидкости и плазме, но их типично низкое содержание может ограничивать детектирование с помощью масс-спектрометрии и иммуноанализов, что подчеркивает необходимость создания более специфичных и чувствительных методов анализа. В результате нехватка надежных биомаркеров дисфункции TDP-43 остается серьезным пробелом в данной области.&lt;/p&gt;\n&lt;p&gt;Кольцевые РНК (circRNAs) представляют собой класс эндогенных РНК, характеризующихся ковалентно замкнутой кольцевой структурой. Такие молекулы привлекли внимание за последние 10 лет благодаря достижениям в методах подготовки библиотек для секвенирования и анализа, которые выявили их повсеместную экспрессию у эукариот и обогащение в нейрональных тканях. Также сообщалось, что уровни кольцевых РНК нарушены при многих патологических состояниях, включая болезнь Альцгеймера. Вопрос о том, может ли дисфункция TDP-43 влиять на экспрессию circRNA, до сих пор не изучался.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Утрата функции TDP-43 приводит к образованию новых криптических кольцевых РНК (c-circRNAs), которые стабильнее линейных аналогов и могут служить высокоточными биомаркерами нейродегенеративных заболеваний.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы обнаружили, что потеря TDP-43 в культивируемых нейронах человека приводит к масштабным изменениям профиля circRNAs, а также к образованию новых кольцевых РНК (криптических circRNAs, c-circRNAs). Эти c-circRNAs селективно накапливаются в коре головного мозга и спинном мозге в зонах, затронутых патологией TDP-43 при ЛВД и БАС, позволяя дифференцировать TDP-43-протеинопатии с очень высокой чувствительностью и специфичностью. Мы установили, что c-circRNAs могут возникать одновременно с другими CEs в пределах одних и тех же генов, но при этом они более стабильны и легче обнаруживаются по сравнению со своими линейными аналогами. Данные сложные нарушения процессинга РНК могут также приводить к утрате белков, играющих ключевую роль в биологических путях, нарушенных при нейродегенерации, таких как аутофагия, примером чего является RPTOR. Наконец, мы идентифицируем c-circRNA в локусе UNC13A, где также обнаруживается криптический экзон, связанный с прогрессированием БАС и являющийся в настоящее время мишенью в клинических испытаниях. Наша работа показывает, что c-circRNA и криптический экзон локуса UNC13A координированно регулируются, а терапевтические ASO, корректирующие криптический экзон, также восстанавливают уровень c-circRNA, что подтверждает ее потенциал в качестве биомаркера фармакодинамического ответа для подходов на основе модуляции сплайсинга.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"poterya-tdp-43-induciruet-differencialnuyu-ekspressiyu-circrna\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#poterya-tdp-43-induciruet-differencialnuyu-ekspressiyu-circrna\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Потеря TDP-43 индуцирует дифференциальную экспрессию circRNA&lt;/span&gt;&lt;/a&gt;Потеря TDP-43 индуцирует дифференциальную экспрессию circRNA&lt;/h4&gt;\n&lt;p&gt;TDP-43 участвует в многочисленных этапах процессинга РНК, и мы задались вопросом, регулирует ли он также уровни и биогенез circRNA. Мы исследовали данные total RNA-seq из четырех экспериментов по нокдауну TDP-43 в нейронах: два были проведены на линиях клеток нейробластомы (SH-SY5Y и SK-N-BE(2)) и два — на нейрональных моделях, полученных из hiPSC, а именно на нижних моторных нейронах (i3LMN) и кортикальных нейронах (i3N) (Рис. S1A и S1B). Используя инструмент CIRI2, мы идентифицировали многочисленные circRNA: 4761 в SH-SY5Y, 2204 в SK-N-BE(2), 6939 в i3LMN и 10097 в i3N (Рис. S1C), при этом 1552 были обнаружены во всех 4 наборах данных (Рис. S1D). При секвенировании коротких прочтений количественная оценка circRNA опирается на обнаружение сайта обратного сплайсинга (BSJ) — единственной области, однозначно приписываемой circRNA, что значительно снижает чувствительность обнаружения circRNA по сравнению с линейными РНК в обычном RNA-seq. В результате перекрытие циркулярных видов, обнаруженных в разных наборах данных, ниже, чем линейных (Рис. S1D). Тем не менее, анализ дифференциальной экспрессии выявил значимые изменения circRNA (Рис. 1A): в общей сложности 1118 различных circRNA были повышены (Рис. 1B) и 1152 понижены (Рис. S1E) во всех четырех наборах данных.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd-f1.jpg\" alt=\"Рисунок 1 — Истощение TDP-43 стимулирует экспрессию c-circRNA в нескольких клеточных моделях: A) Вулканические диаграммы\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1 — Истощение TDP-43 стимулирует экспрессию c-circRNA в нескольких клеточных моделях: A) Вулканические диаграммы, показывающие log₂ изменения кратности (ось x) и −log₁₀ P-значение (ось y) для всех circRNA, идентифицированных в четырех наборах данных RNA-seq (SH-SY5Y, SK-N-BE(2), i3LMN и i3N) после нокдауна TDP-43. Инвариантные circRNA показаны серым цветом, дифференциально экспрессирующиеся circRNA (точки выше горизонтального порога −log10 P-значения) — красным, а криптические circRNA — темно-красным. B) График UpSet, показывающий перекрытие upregulated (повышенно экспрессирующихся) circRNA, идентифицированных в четырех моделях нокдауна TDP-43: SH-SY5Y, SK-N-BE(2), i3LMN и i3N. Горизонтальные полосы справа указывают общее количество circRNA с повышенной экспрессией при нокдауне TDP-43 в каждой модели, в то время как вертикальные полосы представляют размер каждого пересечения. Соединенные точки обозначают наборы данных, вносящие вклад в каждое пересечение. Нижняя панель суммирует количество circRNA с повышенной экспрессией в соответствии с количеством моделей, в которых они были идентифицированы. circRNA с повышенной экспрессией по крайней мере в двух из четырех моделей были классифицированы как «circRNA с высокой степенью достоверности» и сохранены для дальнейшего анализа. C) Воронкообразная диаграмма, иллюстрирующая стратегию фильтрации, использованную для идентификации криптических circRNA, связанных с TDP-43. Среди 148 circRNA с высокой степенью достоверности 76 соответствовали критериям криптических circRNA (c-circRNA). Интеграция с наборами данных TDP-43 CLIP выявила 22 c-circRNA с признаками связывания TDP-43 в их фланкирующих интронах. D) Тепловая карта, показывающая значения Log2 Fold Change (Log2FC) c-circRNA с высокой степенью достоверности в четырех клеточных моделях нокдауна TDP-43: SH-SY5Y, SK-N-BE(2), i3LMN и i3N. c-circRNA сгруппированы в соответствии с количеством наборов данных, в которых они были идентифицированы (List 2/4, List 3/4 и List 4/4), и ранжированы по их среднему Log₂FC по наборам данных, как указано на гистограммах над тепловой картой. Интенсивность цвета указывает на величину повышения экспрессии circRNA после истощения TDP-43. Черные полосы обозначают c-circRNA с признаками связывания TDP-43 во фланкирующих интронах на основе данных CLIP, тогда как серые полосы указывают на отсутствие детектируемого связывания TDP-43.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Потеря TDP-43 приводит к значимым изменениям в экспрессии circRNA (1118 повышены, 1152 понижены), причем эти изменения обусловлены эффективностью обратного сплайсинга, а не транскрипцией.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтобы понять, вызваны ли изменения нарушениями уровней пре-мРНК или напрямую индуцированы изменениями в обратном сплайсинге, мы изучили экспрессию соответствующих линейных изоформ и классифицировали circRNA как «инвариантные», если соответствующая линейная изоформа не демонстрировала значимых вариаций, «конкордантные», если обе варьировали в одном направлении, и «дискордантные», если они варьировали в противоположных направлениях. Во всех линиях большинство circRNA (65–97%) попали в категории «инвариантных» или «дискордантных», что указывает на то, что изменения circRNA не определяются изменениями в транскрипции (Рис. S2A). Анализ изменений отношения циркулярной формы к линейной (ΔCLR) между условиями нокдауна TDP-43 и контролем показал, что изменения в обилии circRNA тесно коррелируют с изменениями ΔCLR, что дополнительно подтверждает, что дифференциальная экспрессия circRNA в первую очередь отражает измененную эффективность обратного сплайсинга, а не изменения в экспрессии гена-хозяина (Рис. S2B).&lt;/p&gt;\n&lt;p&gt;Мы оценили, является ли повышение уровня circRNA общим для разных типов клеток, и обнаружили, что из 1118 измененных circRNA 970 были специфичны для одной клеточной линии, в то время как остальные были повышены как минимум в двух из четырех моделей (Рис. 1B). Низкая степень перекрытия была в первую очередь обусловлена их необнаружением в других клеточных моделях (Рис. S3A и S3B). На протяжении всей рукописи мы называем circRNA, измененные как минимум в 2 наборах данных, «circRNA с высокой достоверностью» (High-Confidence circRNAs) (Рис. 1C).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;circRNA — это кольцевые молекулы РНК, образующиеся путем обратного сплайсинга, когда 3'-конец интрона соединяется с 5'-концом экзона, что делает их устойчивыми к деградации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Затем мы задались вопросом, регулирует ли TDP-43 обратный сплайсинг посредством прямого связывания с РНК, и исследовали наличие сайтов связывания TDP-43 в интронах, фланкирующих экзоны обратного сплайсинга, поскольку известно, что они играют критическую роль в циркуляризации (Рис. S3C). Используя общедоступные данные TDP-43 CLIP-seq (Рис. S3D), мы наблюдали значительное обогащение связывания TDP-43 как минимум в одном из двух фланкирующих интронов повышенных circRNA по сравнению с контрольным набором circRNA, которые не меняются после нокдауна TDP-43 (Рис. S3E и S3F). Примечательно, что обогащение было более выраженным для тех видов circRNA, которые повышались в нескольких клеточных моделях (Рис. S3F).&lt;/p&gt;\n&lt;h4 id=\"poterya-tdp-43-sposobstvuet-obrazovaniyu-kripticheskih-circrna-c-circrna\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#poterya-tdp-43-sposobstvuet-obrazovaniyu-kripticheskih-circrna-c-circrna\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Потеря TDP-43 способствует образованию криптических circRNA (c-circRNA)&lt;/span&gt;&lt;/a&gt;Потеря TDP-43 способствует образованию криптических circRNA (c-circRNA)&lt;/h4&gt;\n&lt;p&gt;Среди повышенных circRNA мы идентифицировали подмножество, обнаруженное исключительно после нокдауна TDP-43 и отсутствующее в контрольных условиях. Это выявляет ранее не признанное последствие дисфункции TDP-43: de novo появление циркулярных РНК. Поскольку это отражает определение криптических событий, мы классифицировали этот класс как «криптические circRNA» (c-circRNA) (Рис. 1A). Всего мы идентифицировали 543 c-circRNA (Рис. S3G), 76 из которых принадлежат к группе с высокой достоверностью (Рис. 1C). Эти криптические circRNA с высокой достоверностью показаны на Рис. 1D, ранжированные в соответствии с количеством линий, в которых была идентифицирована каждая circRNA, и величиной их индукции при нокдауне TDP-43. Примечательно, что 22 из этих circRNA демонстрировали прямое связывание с TDP-43 (Рис. 1C и 1D).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на моделях клеточных линий и hiPSC; выявленные корреляции между связыванием TDP-43 и образованием circRNA требуют функциональной проверки для подтверждения причинно-следственной связи.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;c-цикличные РНК специфически связаны с патологией TDP-43 в центральной нервной системе при БАС и лобно-височной деменции после смерти&lt;/p&gt;\n&lt;p&gt;Обнаружение дифференциально экспрессируемых транскриптов, вызванных дисфункцией TDP-43 в тканях после смерти мозга при анализе образцов целиком (bulk tissue), может быть затруднено, поскольку лишь меньшинство клеток демонстрирует ядерную потерю TDP-43. С другой стороны, выявление криптических событий является более надежным критерием, так как они отсутствуют в физиологических условиях. Поэтому мы исследовал присутствие c-circRNAs в данных RNA-seq консорциума New York Genome Center (NYGC) по БАС. Эта когорта включает различные области центральной нервной системы (ЦНС) из посмертных тканей пациентов с БАС и лобно- височной деменцией (ЛВД), а также здоровых контрольных доноров, в общей сложности 1863 образца (Рис. S4A). Чтобы минимизировать влияние мешающих факторов, мы убедились, что патологические образцы существенно не отличаются от контроля по глубине секвенирования, показателю целостности РНК (RIN), возрасту на момент смерти или полу (Рис. S4B–E).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Криптические события — это аномальные паттерны сплайсинга РНК, которые в норме не возникают, но появляются при нарушении работы белков вроде TDP-43.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы использовали CIRI2 для количественной оценки кольцевых РНК (circRNAs), экспрессируемых в контрольных образцах и образцах с БАС и патологией TDP-43 (ALS-TDP), и обнаружили более полумиллиона circRNAs (Рис. S5A и S5B). Мы провели анализ обогащения, чтобы выявить circRNAs, обнаруживаемые в большем числе образцов ALS-TDP по сравнению с контролем (Рис. S5C и S5D). Внутри этой группы мы определили c-circRNAs как молекулы, экспрессирующиеся менее чем в 5% контрольных образцов (Рис. S5C). В целом мы выявили 466 различных c-circRNAs (Рис. S5E), среди которых 65 демонстрировали как минимум трехкратное обогащение в образцах ALS-TDP по сравнению с контролем (Рис. 2A и S5F).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd-f2.jpg\" alt=\"Рисунок 2 — c-circRNA чувствительно дифференцируют протеинопатию TDP-43 при посмертном ALS/FTD: A) Тепловая карта, показ\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Рисунок 2 — c-circRNA чувствительно дифференцируют протеинопатию TDP-43 при посмертном ALS/FTD: A) Тепловая карта, показывающая обогащение (натуральный логарифм отношения шансов, LnOR) криптических circRNA (c-circRNA) в образцах ALS-TDP по сравнению с контролем в пяти проанализированных регионах ЦНС (шейный отдел спинного мозга, поясничный отдел спинного мозга, моторная кора, лобная кора и височная кора). c-circRNA ранжированы по их медианному LnOR по тканям, как указано на гистограммах справа от тепловой карты. Интенсивность цвета отражает величину обогащения c-circRNA, рассчитанную с использованием точного теста Фишера. B) Коробчатая диаграмма, показывающая распределение оценки криптической нагрузки TDP-43 в образцах ALS-TDP, отнесенных к группам с низкой и высокой нагрузкой. Образцы были стратифицированы в соответствии с низшим и высшим квартилями оценки криптической нагрузки TDP-43 соответственно. C) Линейный график, показывающий долю образцов ALS-TDP, экспрессирующих каждую c-circRNA в группах с низкой и высокой нагрузкой. Каждая линия представляет одну c-circRNA. c-circRNA, значительно обогащенные в группе с высокой нагрузкой (P &amp;lt; 0.05, точный тест Фишера), отмечены метками. Ни одна c-circRNA не была существенно обогащена в группе с низкой нагрузкой. Синие стрелки указывают четыре кандидатные c-circRNA, выбранные для дальнейшей валидации. D) Коробчатые диаграммы, показывающие экспрессию выбранных c-circRNA (c-circUNC13A, c-circBCAR1, c-circDIP2C и c-circDSCAM) в наборе данных RNA-seq консорциума NYGC ALS по группам заболеваний и регионам ЦНС. Экспрессия c-circRNA была количественно определена по количеству точек бэк-сплайсинга (BSJ), нормализованному по размеру библиотеки (ридов на миллион, RPM). Каждая точка представляет отдельный образец. Статистическая значимость оценивалась с использованием теста Уилкоксона — Манна — Уитни с поправкой Бонферрони (*p &amp;lt; 0.05, **p &amp;lt; 0.01, ***p &amp;lt; 0.001). Незначительные сравнения (p &amp;gt; 0.05) не сообщаются. E) RT-qPCR анализ выбранных c-circRNA (c-circUNC13A, c-circBCAR1, c-circDIP2C, c-circDSCAM) в посмертных образцах лобной коры человека от здоровых людей (CTRL, n = 21) и пациентов с FTD с патологией TDP-43 (FTD-TDP, n = 56) или без нее (FTD-non-TDP, n = 12). Экспрессия c-circRNA была нормализована по мРНК GAPDH и представлена в виде изменения кратности (log₂(2^−ΔΔCt)) по отношению к контрольному образцу, установленному равным 1. Каждая точка представляет отдельный образец. Статистическая значимость оценивалась с использованием теста Уилкоксона — Манна — Уитни с поправкой Бонферрони (n.s. p &amp;gt; 0.05, **&lt;em&gt;p &amp;lt; 0.001). F) ROC-кривые (Receiver operating characteristic), оценивающие способность отдельных c-circRNA и комбинированной модели из четырех маркеров дифференцировать FTD-TDP от здоровых людей и случаев FTD без патологии TDP-43. Указаны площади под кривой (AUC).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Затем мы проверили, зависит ли уровень c-circRNAs от степени дисфункции TDP-43, и использовали оценку криптической нагрузки TDP-43 [15] для оценки масштаба потери ядерной функции TDP-43. Мы классифицировали образцы на группу «низкой нагрузки» (самый низкий квартиль оценки нагрузки) и группу «высокой нагрузки» (самый высокий квартиль оценки нагрузки) (Рис. 2B и S6A), обеспечив равный размер выборок между группами и подтвердив отсутствие различий в глубине секвенирования (Рис. S6B). Среди выявленных c-circRNAs ни один не был обогащен в группе с низкой нагрузкой, в то время как 15 существенно обогащались в группе с высокой нагрузкой (Рис. 2C), что определило их как хорошие маркеры патологии TDP-43.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Анализ 1863 образцов ЦНС выявил 15 c-circRNAs, значительно обогащенных в группе с высокой нагрузкой патологии TDP-43, что подтверждает их потенциал в качестве маркеров заболевания.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Среди 15 c-circRNAs, чувствительных к TDP-43, c-circUNC13A, c-circBCAR1 и c-circDIP2C были обнаружены во всех наших клеточных моделях (Рис. 2C) и связываются с TDP-43 в пределах их фланкирующих интронов (Рис. S7A). Другим релевантным кандидатом оказался c-circDSCAM, который демонстрирует профиль криптической экспрессии в пяти из пяти проанализированных тканей (Рис. 2A) и входит в число наиболее обогащенных circRNAs в группе с высокой нагрузкой (Рис. 2C). Мы подтвердили, что все четыре c-circRNAs показывают специфическое обогащение как в образцах БАС, так и ЛВД с патологией TDP-43 (ALS-TDP и FTD-TDP) при сравнении не только со здоровым контролем, но и с лицами, страдающими не-TDP-43 формами БАС (связанными с мутациями SOD1 или FUS) или ЛВД (связанными с TAU или FUS) (Рис. 2D и S7B). Важно отметить, что ни один из этих c-circRNAs не связан со значительным увеличением экспрессии их соответствующих линейных изоформ (Рис. S7C). Основываясь на их надежном обнаружении в моделях и специфичности к заболеваниям, мы выбрали эти четыре c-circRNAs для целевой валидации на посмертной ткани.&lt;/p&gt;\n&lt;p&gt;c-цикличные РНК обеспечивают чувствительное обнаружение патологии TDP-43 в ткани&lt;/p&gt;\n&lt;p&gt;Основной трудностью при анализе посмертной ткани мозга является то, что клетки с патологией TDP-43 составляют лишь небольшое меньшинство. Действительно, даже высокоабсундные криптические события, такие как криптический экзон STMN2, часто не обнаруживаются или подтверждаются лишь несколькими прочтениями в наборах данных bulk RNA-seq [30]. Чтобы преодолеть это ограничение, мы разработали стратегию амплификации и таргетированные анализы для улучшения детекции c-circRNAs в тканях целиком. Мы использовали обратную транскриптазу (ОТ) интронов II группы Induro, которая осуществляет эффективную обратную транскрипцию с катящимся кольцом (RC-RT) [31] (Рис. S8A), генерируя длинные молекулы кДНК с множественными копиями участка обратного сплайсинга (BSJ) и тем самым повышая детекцию circRNAs (Рис. S8B).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Исследование выполнено на посмертных тканях человека и клеточных моделях; корреляция экспрессии биомаркеров с патологией не всегда доказывает прямую причинно-следственную связь на ранних доклинических стадиях.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Прямое сравнение Induro с SuperScript IV — обратной транскриптазой, не способной осуществлять амплификацию с катящимся кольцом, — показало сопоставимые сигналы qPCR для матричной линейной РНК, в то время как Induro увеличивала сигнал от матричной кольцевой РНК более чем в 20 раз (Рис. S8B и S8C), демонстрируя, что RC-RT избирательно усиливает детекцию именно кольцевой, но не линейной РНК.&lt;/p&gt;\n&lt;p&gt;Мы применили RC-RT с последующим выполнением анализов TaqMan, специфичных к BSJ, на РНК лобной коры здорового контроля (n=21) и пациентов с FTD-TDP с патологией TDP-43 (GRN n=17, C9-FTD n=14, спорадический FTLD-TDP n=25) или без нее (FTD-FUS n=12). Все четыре выбранных c-circRNAs показали заметно повышенный сигнал в образцах FTD-TDP по сравнению с FTD-FUS и здоровым контролем (Рис. 2E). Важно отметить, что это различие наблюдалось во всех подтипах FTD-TDP (Рис. S8E).&lt;/p&gt;\n&lt;p&gt;Чтобы оценить способность этих c-circRNAs отличать FTD-TDP от контроля и случаев FTD без TDP-43, мы провели ROC-анализ. Каждый из четырех c-circRNAs продемонстрировал высокую дискриминационную способность (AUC 0,90–0,98), а комбинированная модель достигла AUC 0,99, что указывает на высокую предсказательную точность и подтверждает их потенциал в качестве биомаркеров протеинопатии TDP-43 (Рис. 2F).&lt;/p&gt;\n&lt;p&gt;c-circRNA выявляют сложные нарушения процессинга, связанные с нейродегенерацией&lt;/p&gt;\n&lt;p&gt;c-circRNA, наиболее точно предсказывающая патологию TDP-43, образуется в гене UNC13A — гене, в котором потеря TDP-43 также индуцирует линейный CE, ассоциированный с одним из наиболее сильных GWAS-сигналов как при БАС, так и при ЛВД. Это событие заключается в аберрантном включении криптического экзона в интрон 20, соответствующий одному из фланкирующих интронов вышеупомянутой c-circUNC13A. Мы задались вопросом, возникают ли другие линейные CE во фланкирующих интронах c-circRNA, индуцированных дефицитом TDP-43 (Рис. SN). Поскольку CE часто запускают NMD, что может маскировать их обнаружение, мы использовали недавно составленный полный список CE, полученный из нескольких наборов данных, включая те, где NMD был ингибирован. Мы обнаружили, что 14 из 76 c-circRNA с высокой степенью достоверности, идентифицированных в клеточных линиях, содержали CE в одном из своих фланкирующих интронов (Рис. 3A). Эти случаи аберрантного линейного сплайсинга включали как события включения, так и события пропуска экзонов.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd-f3.jpg\" alt=\"Рисунок 3 — c-circRNA и линейные CE связаны с генами, связанными с нейродегенерацией: A) Диаграмма Венна, показывающая п\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Рисунок 3 — c-circRNA и линейные CE связаны с генами, связанными с нейродегенерацией: A) Диаграмма Венна, показывающая перекрытие между криптическими circRNA с высокой степенью достоверности (синий) и криптическими circRNA с высокой степенью достоверности с событием криптического сплайсинга в одном из их фланкирующих интронов (зеленый). Точный тест Фишера использовался для оценки значимости перекрытия. 14 общих circRNA перечислены справа. c-circRNA, выделенные жирным шрифтом, были выбраны для дальнейшего анализа. B) Сашими-диаграмма, показывающая одновременное возникновение события криптического сплайсинга (зеленый) и события образования криптической кольцевой РНК (c-circRNA) (синий) в гене RPTOR. На верхней панели показано схематическое представление событий, в то время как на нижних панелях отображаются покрытие ридов и использование сайтов сплайсинга в указанных условиях: контроль (CTRL NT), нокдаун TDP-43 (KD NT) и нокдаун TDP-43 с ингибированием нонсенс-опосредованного распада (KD NMDi). C) Значения процента включения сплайсинга (PSI, ψ) для линейных криптических изоформ сплайсинга UNC13A, RPTOR, EHMT1 и DIP2C относительно их соответствующих правильно сплайсированных сайтов. Значения ψ рассчитывались на основе данных массового RNA-seq, полученных из клеток SH-SY5Y в условиях контроля или нокдауна TDP-43, с ингибированием нонсенс-опосредованного распада (NMD), опосредованным циклогексимидом, или без него. Столбцы представляют среднее значение ± стандартное отклонение (SD) независимых биологических повторностей, отдельные повторности показаны в виде черных точек (n = 4). Статистическая значимость оценивалась с использованием двустороннего непарного t-критерия Стьюдента с поправкой на множественное сравнение (FDR Бенджамини — Хохберга) (n.s. p &amp;gt; 0.05, **p &amp;lt; 0.01, ***p &amp;lt; 0.001). D) Представительный вестерн-блоттинг, показывающий уровни белков EHMT1, RPTOR и TDP-43 в контрольных и TDP-нокаутных клетках i3N; в качестве контроля загрузки использовался α-тубулин (TUBULIN). n = 3 независимые биологические повторности. E) Субклеточная локализация линейных криптических транскриптов (CE) и соответствующих криптических circRNA (c-circRNA), полученных из указанных генов. Ядерные и цитоплазматические фракции были выделены из истощенных по TDP-43 клеток SH-SY5Y, а изобилие транскриптов было количественно определено с помощью RT-qPCR. Стек-диаграммы показывают долю каждого транскрипта, обнаруженного в ядерной (светло-серый) и цитоплазматической (темно-серый) фракциях. GAPDH и пре-GAPDH использовались в качестве цитоплазматического и ядерного контролей соответственно. Столбцы представляют среднее значение ± SD трех независимых биологических повторностей (n = 3). F) RT-qPCR анализ линейных криптических транскриптов (CE, зеленый) и соответствующих им криптических circRNA (c-circRNA, синий) в посмертных образцах лобной коры человека от здоровых людей (CTRL, n = 21) и пациентов с FTD с патологией TDP-43 (FTD-TDP, n = 56) или без нее (FTD-non-TDP, n = 12). Изобилие транскриптов было нормализовано по мРНК GAPDH и представлено в виде логарифмически трансформированных значений экспрессии (log₂(2^−ΔCt)). Каждая точка представляет отдельный образец. Статистическая значимость оценивалась с использованием теста Уилкоксона — Манна — Уитни с поправкой Бонферрони (n.s. p &amp;gt; 0.05, **&lt;em&gt;p &amp;lt; 0.001).&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;14 из 76 (18,4%) c-circRNA с высокой степенью достоверности содержат криптические экзоны (CE) во фланкирующих интронах, что указывает на связь между образованием c-circRNA и нарушениями линейного сплайсинга.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Интригует то, что в этой подгруппе мы идентифицировали не только UNC13A (Рис. SN), но и два других гена, связанных с неврологическими заболеваниями: RPTOR (Рис. 3B) и EHMT1 (Рис. SN). RPTOR кодирует важный каркасный белок для формирования и регуляции сигнального пути mTORC1, центрального регулятора нейронального гомеостаза, который ассоциирован с прогрессированием нейродегенеративных заболеваний, а EHMT1 кодирует гистоновую метилтрансферазу, играющую критическую роль в развитии мозга и когнитивных функциях, мутации в которой приводят к синдрому Клефстры.&lt;/p&gt;\n&lt;p&gt;Транскрипты UNC13A, RPTOR и EHMT1 чувствительны к NMD, их уровень снижается при истощении TDP-43 и восстанавливается при ингибировании NMD (Рис. SN). В то время как CE UNC13A можно надежно наблюдать как в экспериментах на клеточных культурах, так и в посмертных образцах тканей, CE RPTOR и EHMT1 крайне уязвимы (Рис. 3C) и поэтому были определены как «темные» (т.е. идентифицируемые только после ингибирования NMD in vitro) и не обнаружены в посмертных тканях NYGC. Мы подтвердили чувствительность к NMD криптических изоформ UNC13A, RPTOR и EHMT1 с помощью RT-qPCR в клетках SH-SY5Y после истощения TDP-43, продемонстрировав при этом, что соответствующие c-circRNA устойчивы к NMD (Рис. SN). Хотя влияние аберрантного сплайсинга UNC13A было охарактеризовано ранее, мы оценили влияние множественных нарушений процессинга RPTOR и EHMT1 и исследовали, приводят ли они к снижению экспрессии белка при истощении TDP-43. Вестерн-блоттинг лизатов кортикальных нейронов, полученных из iPSC, показал сильное снижение уровня белков RPTOR и EHMT1 как следствие истощения TDP-43 (Рис. 3D и Рис. SN).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;NMD (nonsense-mediated decay) — механизм контроля качества мРНК, который разрушает транскрипты с преждевременными стоп-кодонами, часто возникающими при аберрантном сплайсинге.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В целом эти результаты подчеркивают, как c-circRNA, нечувствительные к NMD, могут выявлять более сложные события аберрантного сплайсинга, которые имеют значительные последствия для экспрессии белков, связанных с заболеваниями.&lt;/p&gt;\n&lt;p&gt;c-circRNA имеют особую субклеточную локализацию и лучше обнаруживаются по сравнению с их линейными аналогами (CE)&lt;/p&gt;\n&lt;p&gt;Поскольку c-circRNA и CE являются различными транскриптами, происходящими из одного и того же гена, мы решили сравнить их субклеточную локализацию. Мы исследовали распределение c-circRNA, связанных с заболеваниями, и их аналогов CE, выполнив нуклеоцитоплазматическое фракционирование в клетках SH-SY5Y с истощенным TDP-43. Все CE, содержащие преждевременный стоп-кодон, преимущественно локализовались в ядерной фракции, тогда как все c-circRNA преимущественно локализовались в цитозольной фракции (Рис. 3E). Этот результат подтверждает потенциал c-circRNA к включению во внеклеточные везикулы.&lt;/p&gt;\n&lt;p&gt;Затем мы сравнили обнаруживаемость c-circRNA и их аналогов CE в посмертных тканях. Мы провели анализ методом RT-qPCR с использованием амплификации по типу «катящегося кольца» (rolling-circle RT) и обнаружили увеличение всех кольцевых и линейных мишеней при FTD-TDP по сравнению с контролем и образцами FTD без TDP-патологии — что подтверждает их криптическую природу — за исключением CE DIP2C, уровень которого оставался неизменным (Рис. 3F).&lt;/p&gt;\n&lt;p&gt;Примечательно, что в то время как c-circRNA и соответствующие им CE обнаруживались на сопоставимых уровнях в контроле и образцах FTD без TDP-патологии, c-circRNA демонстрировали стабильно повышенную обнаруживаемость в тканях FTD-TDP (Рис. 3F). Чтобы количественно оценить этот эффект, мы рассчитали соотношение c-circRNA:CE для каждого образца. Соотношение было смещено в пользу circRNA исключительно в образцах FTD-TDP, что подтверждает надежность сигнала, а не общий эффект амплификации, внесенный методом анализа (Рис. SN).&lt;/p&gt;\n&lt;p&gt;Эти результаты подтверждают, что молекулы c-circRNA обладают превосходным потенциалом по сравнению с их линейными аналогами в качестве биомаркеров в клинических образцах, вероятно, благодаря их более высокой устойчивости к экзонуклеазам, нечувствительности к NMD, цитоплазматической локализации и техническому преимуществу, обеспечиваемому амплификацией по типу «катящегося кольца».&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проведено на клеточных линиях и посмертных тканях; наблюдаемые корреляции между уровнями c-circRNA и патологией не доказывают прямую причинно-следственную связь.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;c-circUNC13A более стабильна, чем криптический экзон UNC13A&lt;/p&gt;\n&lt;p&gt;Среди c-circРНК c-circUNC13A представляет особый интерес из-за своей близости к криптическому экзону (CE) UNC13A и GWAS-рисковым SNP, поэтому мы детально проанализировали её характеристики. Хотя UNC13A образует несколько кольцевых изоформ, некоторые из которых увеличиваются при истощении TDP-43 (Рис. SN), только изоформа, содержащая экзоны с 21 по 30 (ранее называемая «c-circUNC13A»), соответствовала критериям криптичности во всех проанализированных наборах данных (Рис. 4A и Рис. SN). Мы подтвердили это с помощью RT-qPCR в четырех клеточных линиях (Рис. 4B и Рис. SN), а также доказали её кольцевую природу, продемонстрировав устойчивость к обработке РНКазой R, в отличие от линейного CE UNC13A (Рис. SN).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd-f4.jpg\" alt=\"Рисунок 4 — c-circUNC13A ко-регулируется с UNC13A CE in vitro и in vivo: A) Схематическое представление изоформ circRNA \" /&gt;&lt;/p&gt;\n&lt;p&gt;*Рисунок 4 — c-circUNC13A ко-регулируется с UNC13A CE in vitro и in vivo: A) Схематическое представление изоформ circRNA UNC13A, обнаруженных в четырех клеточных моделях в условиях контроля (Control) и истощения TDP-43 (TDP-43 KD). Синие дуги обозначают изоформы circRNA, обнаруженные в обоих условиях, тогда как красные дуги обозначают изоформы circRNA, обнаруженные исключительно после истощения TDP-43. Толщина дуги пропорциональна среднему уровню экспрессии circRNA (CPM) по четырем наборам данных. B) RT-qPCR анализ экспрессии c-circUNC13A в четырех клеточных моделях, указанных в условиях контроля (CTRL) и нокдауна TDP-43 (TDP-43 KD). Изобилие транскриптов было нормализовано по мРНК GAPDH и представлено в виде относительных значений экспрессии (2^−ΔΔCt), причем для контрольного условия установлено значение 1. Каждая точка представляет независимую биологическую повторность (n = 4). Статистическая значимость оценивалась с использованием двустороннего непарного t-критерия Стьюдента (***p &amp;lt; 0.001). C) RT-qPCR анализ криптического экзона (CE) UNC13A и изобилия c-circUNC13A во время истощения TDP-43, опосредованного PROTAC, и последующего восстановления. Левая панель: изобилие транскриптов измерялось в указанные моменты времени после индукции истощения TDP-43 с использованием PROTAC. Правая панель: после 14 дней лечения PROTAC клетки были переключены на каталитически неактивный конкурент (PROTACi) для восстановления уровней TDP-43, и изобилие транскриптов измерялось в указанные моменты времени восстановления. На обеих панелях изобилие транскриптов было нормализовано по мРНК GAPDH и представлено в виде относительных значений экспрессии (2^−ΔΔCt), причем конечная точка лечения PROTAC (72 ч) и начальная точка лечения PROTACi (0 ч) были установлены равными 1. Данные представляют среднее значение ± SD трех независимых биологических повторностей (n = 3). D) Схематическое представление опосредованного CRISPR/Cas9 удаления криптического экзона (CE, зеленого цвета) UNC13A. Указаны положения двух гидовых РНК (gRNA1 и gRNA2), использованных для получения клеточной линии ΔCE. E) RT-qPCR анализ указанных мишеней в клетках SH-SY5Y с диким типом (Wt) или фоном с удаленным криптическим экзоном UNC13A (ΔCE) в условиях контроля (CTRL) или нокдауна TDP-43 (KD). Изобилие транскриптов было нормализовано по мРНК GAPDH и представлено в виде относительных значений экспрессии (2^−ΔΔCt) по отношению к контрольным образцам, установленным равным 1. Каждая точка представляет отдельный образец (n = 4). Статистическая значимость оценивалась с использованием двустороннего непарного t-критерия Стьюдента (n.s. p &amp;gt; 0.05, **p &amp;lt; 0.01, ***p &amp;lt; 0.001). F) Представление высокоэффективного антисмыслового олигонуклеотида (ASO), корректирующего сплайсинг и нацеленного на криптический экзон (CE, зеленый) UNC13A. Сайт связывания ASO указан красным цветом. G) Кривая доза-ответ, показывающая эффект увеличения концентраций ASO-1 на экспрессию c-circUNC13A в клетках с истощенным TDP-43. Уровни c-circUNC13A представлены относительно условия нокдауна TDP-43, принятого за 100%. Отдельные точки данных показаны со средним значением ± SD. Данные аппроксимируются с помощью 4-параметрической логистической функции. H) Корреляция между уменьшением c-circUNC13A и экспрессией криптического экзона UNC13A, опосредованным ASO-1. Точки данных окрашены в соответствии с концентрацией ASO-1. Перекрестия указывают уровни c-circUNC13A и криптического экзона UNC13A только в клетках с нокдауном TDP-43 (среднее значение ± SD для каждой оси). Треугольники указывают базальные условия в отсутствие нокдауна TDP-43, когда не обнаруживается ни c-circUNC13A, ни криптический экзон UNC13A. I) Корреляция между уменьшением экспрессии c-circUNC13A, опосредованным ASO-1, и восстановлением правильно сплайсированного транскрипта UNC13A. Точки данных окрашены в соответствии с концентрацией ASO-1. Серые полосы указывают средние значения ± SD уровней экспрессии в клетках без лечения ASO. J) Схематическое представление дизайн эксперимента in vivo для оценки эффекта лечения ASO, нацеленным на криптический экзон UNC13A, на уровни c-circUNC13A. Трансгенные мыши BAC, экспрессирующие весь человеческий UNC13A, получали интрацеревентрикулярное (ICV) введение ASO с последующим внутривенным введением AAV, экспрессирующего miRNA для индукции нокдауна TDP-43. K) RT-qPCR анализ экспрессии c-circUNC13A в коре, стволе мозга, каудальном отделе спинного мозга (SC) и ростральном отделе спинного мозга (SC) трансгенных мышей BAC человека UNC13A после нокдауна TDP-43, опосредованного AAV, с лечением ASO, нацеленным на криптический экзон UNC13A, или без него. Экспрессия c-circUNC13A была нормализована по мРНК TBP и представлена в процентах экспрессии относительно условия нокдауна TDP-43, принятого за 100%. Каждая точка представляет отдельную мышь. Статистическая значимость оценивалась с использованием однофакторного дисперсионного анализа (ANOVA) с поправкой на множественное сравнение (n.s. p &amp;gt; 0.05, **&lt;em&gt;p &amp;lt; 0.001).&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;c-circUNC13A является наиболее стабильной изоформой, образующейся при истощении TDP-43, и сохраняет 80% своего уровня через 24 часа после восстановления TDP-43, в то время как уровень CE UNC13A падает до 40%.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Затем мы задались вопросом, различаются ли стабильность CE UNC13A и c-circРНК. Мы использовали модифицированную линию i3Ns, где эндогенный TDP-43 может быть быстро деградирован путем добавления PROTAC, и исследовали CE UNC13A и c-circРНК в разные моменты времени после истощения TDP-43. Уровни CE UNC13A быстро растут и выходят на плато через 24 часа после обработки. Напротив, c-circUNC13A демонстрировала более медленное и прогрессивное увеличение в течение всего временного интервала, продолжая накапливаться в течение 72 часов (Рис. 4C, левая панель). Затем мы сравнили, как CE UNC13A и c-circРНК сохраняются при восстановлении уровней TDP-43 после 14 дней истощения с помощью PROTAC — это было достигнуто путем замены PROTAC на каталитически неактивный конкурент (PROTACi). Уровни CE UNC13A быстро снижались, достигая примерно 40% от их исходного содержания в течение 24 часов, в то время как c-circUNC13A демонстрировала заметно более медленную кинетику распада, что согласуется с более длительным периодом полураспада: она сохраняла 80% исходных уровней в тот же момент времени и постепенно снижалась впоследствии (Рис. 4C, правая панель). Эти данные указывают на то, что c-circUNC13A существенно более стабильна, чем соответствующий линейный криптический транскрипт.&lt;/p&gt;\n&lt;p&gt;c-circUNC13A и CE UNC13A ко-регулируются&lt;/p&gt;\n&lt;p&gt;Клинические испытания, направленные на коррекцию включения криптического экзона UNC13A, уже ведутся. Поскольку c-circUNC13A и CE UNC13A являются нефункциональными альтернативами правильному сплайсингу экзонов 20-21 (Рис. SN), крайне важно понять, ко-регулируются ли они или подавление CE UNC13A приводит к увеличению c-circUNC13A. Поэтому мы проанализировали клетки SHSY-5Y, в которых область CE UNC13A была удалена с помощью редактирования генома CRISPR/Cas9 (ΔCE) (Рис. 4D). Как сообщалось ранее, CE UNC13A не продуцировался в линии ΔCE при истощении TDP-43. Мы также обнаружили, что индукция c-circUNC13A при нокдауне TDP-43 в линии ΔCE была полностью подавлена, что доказывает, что область, продуцирующая криптический экзон, необходима для экспрессии кольцевой изоформы (Рис. 4E). Важным моментом является вопрос о том, связано ли подавление c-circUNC13A в линии ΔCE с делецией части последовательности интрона 20 или оно зависит от подавления формирования CE UNC13A. Мы исследовали эффект различных ASO, переключающих сплайсинг, которые снижают уровень CE UNC13A, на c-circUNC13A. В то время как нетаргетные ASO не оказывали влияния на CE UNC13A и c-circUNC13A, ASO к CE UNC13A приводили к снижению уровней circРНК до 80% (Рис. SN). Затем мы использовали различные дозы высокоэффективного ASO (Рис. 4F) и наблюдали дозозависимый эффект снижения circРНК (Рис. 4G), который также демонстрировал положительную корреляцию с CE UNC13A (Рис. 4H). Важно отметить, что c-circUNC13A также показала отрицательную корреляцию с правильно сплайсированной изоформой UNC13A (Рис. 4I), что подтверждает возможность использования уровней c-circUNC13A в качестве потенциального биомаркера восстановления UNC13A.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ASO (антисмысловые олигонуклеотиды) — короткие синтетические молекулы, которые связываются с РНК и могут блокировать её трансляцию или изменять процесс сплайсинга.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Далее мы проверили, происходит ли координированная регуляция включения криптического экзона UNC13A и формирования c-circUNC13A in vivo. Поскольку CE UNC13A не консервативен у грызунов, мы использовали трансгенную мышь BAC, экспрессирующую весь локус человека UNC13A (Рис. 4J). После нокдауна TDP-43 с помощью miRNA Tardbp, доставляемой AAV, c-circUNC13A стала легко обнаруживаться в ЦНС с помощью RT-qPCR. Интрацеребровентрикулярная инъекция ASO, нацеленного на CE UNC13A, подавляла формирование c-circUNC13A (Рис. 4K), демонстрируя, что терапевтическая модуляция аберрантного сплайсинга UNC13A сопровождается снижением уровня c-circРНК in vivo.&lt;/p&gt;\n&lt;p&gt;В целом, эти результаты показывают, что circUNC13A более стабильна и легче обнаруживается, чем CE UNC13A, что биогенез этих двух событий связан, и подчеркивают потенциал c-circUNC13A в качестве биомаркера эффективности терапии, модулирующей CE UNC13A.&lt;/p&gt;\n&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;p&gt;Мы идентифицируем c-circRNA как новое следствие дисфункции TDP-43. Мы показываем, что потеря ядерного TDP-43 вызывает обширные изменения в обратном сплайсинге и формирование de novo circRNA, которые отсутствуют в физиологических условиях. Эти c-circRNA специфически связаны со случаями БАС и ФТД с патологией TDP-43, демонстрируют повышенную стабильность и превосходную детектируемость по сравнению с их линейными криптическими аналогами, а также могут выявить ранее не учитывавшиеся уровни нарушения процессинга РНК. Наконец, мы демонстрируем, что c-circUNC13A механистически связан с релевантным для заболевания криптическим экзоном (CE) UNC13A и может служить биомаркером целевого воздействия для новых методов терапии, направленных на коррекцию сплайсинга UNC13A.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Потеря TDP-43 запускает образование стабильных c-circRNA, которые служат высокочувствительными маркерами патологии, в частности c-circUNC13A, связанного с критическим событием сплайсинга в гене UNC13A.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Хотя TDP-43 давно признан репрессором канонического сплайсинга, наши результаты выявляют дополнительную роль этого РНК-связывающего белка в биологии circRNA. Помимо регуляции количества физиологических circRNA, TDP-43 действует как супрессор формирования криптических circRNA (c-circRNA). Обогащение сайтов связывания TDP-43 в интронах, фланкирующих c-circRNA, подтверждает прямую роль TDP-43 в предотвращении аберрантного обратного сплайсинга в этих локусах. Хотя факторы, вызывающие криптический обратный сплайсинг, еще предстоит выяснить, обширные дефекты процессинга РНК, наблюдаемые после удаления TDP-43, включая криптический сплайсинг и удержание интронов, позволяют предположить, что его истощение создает благоприятную среду для аберрантного обратного сплайсинга. Нарушения кинетики сплайсинга могут способствовать обратному сплайсингу, который в целом считается менее эффективным, чем линейный сплайсинг, за счет увеличения временного окна, в течение которого неканонические сайты сплайсинга могут спариваться. Поскольку реакция обратного сплайсинга основана на формировании петли, которая сближает два интрона, фланкирующих экзоны, продуцирующие circRNA, одной из возможностей является то, что потеря связывания TDP-43 обнажает интронные последовательности низкой сложности, которые становятся доступными для межмолекулярных взаимодействий РНК, тем самым способствуя циклизации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Обратный сплайсинг (back-splicing) — процесс соединения 3'-конца экзона с 5'-концом того же или вышестоящего экзона, приводящий к образованию кольцевой РНК (circRNA).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Открытие криптических событий (CE), зависимых от TDP-43, улучшило наше понимание патогенеза БАС и ФТД, предоставив специфические молекулярные показатели потери функции TDP-43. Однако на практике ряд препятствий ограничивает их полезность в качестве биомаркеров. Многие транскрипты, содержащие CE, быстро деградируют посредством нонсенс-опосредованного распада, в то время как те, что избегают деградации, остаются внутренне нестабильными и особенно уязвимы к деградации в биологических жидкостях. Мы и другие исследователи обнаружили, что часть CE кодирует дополнительные пептидные последовательности в рамке считывания и, следовательно, дает начало новым белкам. Хотя текущие методы анализа криптических пептидов многообещающи, они все еще требуют улучшения чувствительности для клинического применения. С другой стороны, circRNA обладают свойствами, которые делают их особенно привлекательными кандидатами в биомаркеры. Их ковалентно замкнутая структура обеспечивает им исключительную стабильность, и, несмотря на то, что они составляют лишь малую часть клеточных РНК, circRNA высоко обогащены в биологических жидкостях и внеклеточных везикулах благодаря своей устойчивости к экзонуклеазам. Кроме того, их кольцевая структура позволяет осуществлять селективную амплификацию сигнала посредством обратной транскрипции с катящимся кольцом, что дает техническое преимущество перед линейными криптическими транскриптами, которые часто не обнаруживаются в тканях из-за низкой распространенности и быстрой деградации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на анализе посмертных образцов ЦНС и клеточных моделей; корреляция между c-circRNA и патологией TDP-43 не обязательно означает прямую причинно-следственную связь в живом организме.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Применимость c-circRNA в качестве потенциальных биомаркеров подтверждается ведущими кандидатами, которые мы идентифицировали (c-circUNC13A, c-circBCAR1, c-circDIP2C и c-circDSCAM). Они были значительно обогащены как в образцах ЦНС при БАС-TDP, так и при ФТД-TDP, полученных после вскрытия, и продемонстрировали отличное различение между TDP-43-протеинопатиями и протеинопатиями другого типа. Используя подход целевой амплификации с катящимся кольцом, эти молекулы обеспечили почти полное разделение групп заболеваний, при этом комбинированная модель достигла AUC 0,99. В совокупности эти результаты подтверждают, что c-circRNA являются высокочувствительными и специфичными молекулярными следами дисфункции TDP-43, и поддерживают их разработку в качестве биомаркеров для TDP-43-протеинопатий.&lt;/p&gt;\n&lt;p&gt;Неожиданным наблюдением стало частое сосуществование c-circRNA с другими формами аберрантного сплайсинга в пределах одних и тех же генов. Примерно одна пятая часть c-circRNA с высокой степенью достоверности была связана с соседними криптическими или скиптическими экзонами, что позволяет предположить, что определенные транскрипты особенно уязвимы к множественным формам нарушения процессинга РНК после истощения TDP-43. Ранее сообщалось, что биогенез circRNA совпадает с неканоническими событиями сплайсинга. Например, истощение фактора сплайсинга SFPQ приводит к обширным изменениям в биогенезе circRNA, сопровождающимся удержанием вышестоящих интронов и событиями криптического сплайсинга. Совсем недавно было показано, что истощение HNRNPM способствует как аберрантному включению экзонов, так и биогенезу circRNA, что дополнительно подтверждает идею о том, что нарушение выбора сайта сплайсинга создает благоприятную среду для обратного сплайсинга.&lt;/p&gt;\n&lt;p&gt;Среди генов, демонстрирующих множественные события криптического аномального процессинга, мы идентифицировали UNC13A, RPTOR и EHMT1. Все эти транскрипты подвергаются аберрантному сплайсингу, который приводит к образованию преждевременных стоп-кодонов и запускает NMD-опосредованную деградацию транскриптов. В то время как последствия аномального сплайсинга UNC13A были подробно охарактеризованы, наша работа представляет собой первое свидетельство того, что дисфункция TDP-43 также приводит к потере белков RPTOR и EHMT1 посредством механизмов криптического процессинга РНК. Важно отметить, что дисфункция обоих белков ранее была связана с неврологическими заболеваниями. RPTOR является важным компонентом комплекса mTORC1, и его снижение нарушает сигналинг mTOR, способствует активации TFEB и изменяет аутофаго-лизосомальные пути, которые вовлечены в нейродегенерацию. Аналогичным образом, EHMT1 является ключевой гистонметилтрансферазой, необходимой для развития нейронов и синаптической функции, а гаплонедостаточность или мутация EHMT1 вызывает синдром Клефстра — тяжелое нарушение развития нервной системы, характеризующееся умственной отсталостью и когнитивными нарушениями. Снижение уровня этих белков позволяет предположить, что TDP-43 может способствовать нейродегенерации через дополнительные патогенные пути, некоторые из которых остаются скрытыми, поскольку лежащие в их основе криптические транскрипты быстро деградируют.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Криптический сплайсинг — это ошибочное включение в зрелую РНК «скрытых» участков (криптических экзонов), которые в норме вырезаются. Это часто приводит к появлению преждевременных стоп-кодонов и запуску NMD (nonsense-mediated decay) — клеточной системы уничтожения дефектных РНК, из-за чего снижается уровень важных белков.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Важно отметить, что те же самые события криптического процессинга РНК, которые снижают количество связанных с заболеванием белков, также генерируют стабильные c-circRNA, которые остаются легко обнаруживаемыми, несмотря на деградацию соответствующих линейных транскриптов. Это различие также отражается на их субклеточной локализации. В то время как криптические линейные транскрипты (CE), подвергающиеся NMD, преимущественно обнаруживаются в ядре, c-circRNA накапливаются в цитоплазме, где они с большей вероятностью сохраняются и потенциально могут включаться во внеклеточные везикулы — структуры, в которых, как уже было показано, обогащены circRNA. В сочетании с их устойчивостью к NMD и селективной амплификацией с помощью обратной транскрипции по типу катящегося колеса, эти особенности способствуют их превосходной обнаруживаемости в образцах, полученных от пациентов. Таким образом, c-circRNA могут служить стабильными молекулярными отпечатками событий криптического сплайсинга, которые в противном случае оставались бы практически невидимыми в тканях человека. Хотя оценка c-circRNA во внеклеточных везикулах и биологических жидкостях выходила за рамки настоящего исследования, наши результаты предоставляют веские основания и набор молекул-кандидатов для будущих исследований, направленных на оценку их потенциала в качестве ассоциированных с внеклеточными везикулами биомаркеров дисфункции TDP-43.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Криптические кольцевые РНК (c-circRNA) накапливаются в цитоплазме и устойчивы к деградации, в отличие от быстро разрушающихся линейных транскриптов, что делает их надежными биомаркерами патологии TDP-43.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Среди идентифицированных c-circRNA особый интерес представляет c-circUNC13A, поскольку она возникает из одного из наиболее сильных локусов генетического риска как для БАС (бокового амиотрофического склероза), так и для ЛВД (лобно-височной деменции), а ее линейный аналог в настоящее время является мишенью для терапевтического вмешательства. Несколько ортогональных линий доказательств демонстрируют, что c-circUNC13A и связанный с заболеванием криптический экзон UNC13A механически связаны между собой. Делеция геномной области, ответственной за формирование криптического экзона, устраняла индукцию обоих транскриптов, в то время как антисмысловые олигонуклеотиды, переключающие сплайсинг, подавляли оба вида дозозависимым образом. Эти наблюдения указывают на то, что c-circUNC13A является не независимым побочным продуктом дисфункции TDP-43, а скорее скоординированным следствием одного и того же патогенного события аномального сплайсинга.&lt;/p&gt;\n&lt;p&gt;c-circUNC13A обладает рядом свойств, которые делают ее привлекательным биомаркером связывания с мишенью (target-engagement biomarker). Она значительно более стабильна, чем соответствующий линейный криптический транскрипт, поскольку прогрессивно накапливается после истощения TDP-43 и сохраняется дольше после восстановления функции TDP-43. Эти кинетические различия позволяют предположить, что c-circUNC13A может действовать как усредненный по времени молекулярный показатель дисфункции TDP-43, обеспечивая более долговечный молекулярный отпечаток патологии. Это могло бы сглаживать временные колебания активности сплайсинга и, следовательно, быть особенно ценным в терапевтических условиях для мониторинга ответа на лечение.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Хотя c-circUNC13A демонстрирует высокую стабильность in vitro, ее применимость в качестве биомаркера в реальных клинических образцах (например, спинномозговой жидкости пациентов) еще предстоит подтвердить в масштабных исследованиях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В совокупности наши результаты расширяют парадигму TDP-43-зависимой патологии РНК за рамки линейного аномального сплайсинга и идентифицируют криптические кольцевые РНК как ранее не признававшиеся последствия потери ядерного TDP-43. Сочетая в себе специфичность к заболеванию, молекулярную стабильность и повышенную обнаруживаемость, эти молекулы представляют собой многообещающий новый класс биомаркеров и дают новое понимание сложных дефектов процессинга РНК, лежащих в основе TDP-43-зависимой патологии БАС и ЛВД. Кроме того, наша работа создает основу для поддержки будущей оценки криптических кольцевых РНК во внеклеточных везикулах и других биологических жидкостях как в качестве биомаркеров патологии TDP-43, так и в качестве фармакодинамических показателей терапевтического вмешательства.&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"kultura-inducirovannyh-plyuripotentnyh-stvolovyh-kletok-ipsk-cheloveka\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#kultura-inducirovannyh-plyuripotentnyh-stvolovyh-kletok-ipsk-cheloveka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Культура индуцированных плюрипотентных стволовых клеток (ИПСК) человека:&lt;/span&gt;&lt;/a&gt;Культура индуцированных плюрипотентных стволовых клеток (ИПСК) человека:&lt;/h4&gt;\n&lt;p&gt;В данном исследовании мы использовали ИПСК линии WCT11, ранее модифицированные для сверхэкспрессии нейрогенина-2 (NGN2) человека с целью получения кортикальных i3Neurons, или конструкцию hNIL, сверхэкспрессирующую факторы транскрипции человека Islet-1 (ISL1), LIM Homeobox 3 (LHX3) и NGN2, для получения i3-нижних мотонейронов (i3-LMNs). Обе линии содержали доксициклин-индуцируемый промотор, а также экспрессионную кассету для ферментативно неактивного Cas9 (+/− CAGdCas9BFP-KRAB), как описано ранее. Эти конструкции были интегрированы в безопасные локусы AAVS1 и CLYBL соответственно. Получение линии Halo-TDP описано в других работах. ИПСК поддерживали в среде Essential 8 Flex (Gibco, A2858501) при ежедневной смене среды и инкубации при 37°C и 5% CO2. Клетки регулярно пассировали с использованием Versene (Gibco, 15040066) в чашках для культивирования, покрытых Geltrex (1:100; Gibco, A14133-01). Периодически проводили STR-профилирование и тест на микоплазменную контаминацию.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ИПСК — это стволовые клетки, полученные из взрослых клеток организма путем их «перепрограммирования» в состояние, близкое к эмбриональному, что позволяет выращивать из них любые типы тканей, включая нейроны.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"differencirovka-ipsk-v-kortikalnye-nejrony-i3neurons-i-ih-kultivirovanie\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#differencirovka-ipsk-v-kortikalnye-nejrony-i3neurons-i-ih-kultivirovanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дифференцировка ИПСК в кортикальные нейроны (i3Neurons) и их культивирование:&lt;/span&gt;&lt;/a&gt;Дифференцировка ИПСК в кортикальные нейроны (i3Neurons) и их культивирование:&lt;/h4&gt;\n&lt;p&gt;Процесс дифференцировки проводился согласно ранее опубликованным данным. Для инициации нейрональной дифференцировки ИПСК диссоциировали с помощью Accutase (Gibco, A1110501) и переносили на чашки для культивирования, покрытые Geltrex (1:100; Gibco, A14133-01), в индукционную среду: DMEM/F-12 + GlutaMAX (Gibco, 31331028), 1x MEM Non-Essential Amino Acids (Gibco, 1140050), 2 мкг/мл доксициклина гиклата (SigmaAldrich, D9891), 1x N2 supplement (Gibco, 17502048), 2 мкМ XAV939 (Cambridge Bioscience, SM38-10), 10 мкМ SB431542 (Biotechne, 1614) и 100 нМ LDN-193189 (Cambridge Bioscience, 19396-5mg-CAY). В день посева в среду добавляли 1x ингибитор ROCK Y-27632 дигидрохлорид (Tocris, 1254/10). На данном этапе индукционную среду меняли ежедневно. На 3-й день пре-нейрональные клетки переносили на чашки, покрытые 50 мкг/мл поли-D-лизина (Gibco, A38904-01) и 10 мкг/мл ламинина (Gibco, 23017015), в 12-луночные планшеты (500 000 клеток на лунку) для экстракции РНК и белка. Их культивировали в среде для кортикальных нейронов i3Neuron: BrainPhys (StemCell Technologies, 5790), дополненной 1x N21 Max (R&amp;amp;D System, AR008), 1x N2 Max (R&amp;amp;D System, AR009), 10 нг/мл BDNF (PeproTech, 450-02), 10 нг/мл GDNF (PeproTech, 450-10) и 1 мкг/мл ламинина (Gibco, 23017015). Для повышения выживаемости одиночных клеток в день посева добавляли 1x ингибитор ROCK. Через 24 часа среду полностью заменяли для удаления ингибитора ROCK и добавления CultureOne (антимитотический агент; 1:100; Gibco, A3320201). Клетки содержали в среде i3Neuron в течение варьируемого периода времени: 14–30 дней для истощения TDP-43, опосредованного CRISPRi, и 28 дней для истощения TDP-43, опосредованного PROTAC (см. ниже).&lt;/p&gt;\n&lt;h4 id=\"differencirovka-nizhnih-motonejronov-iz-ipsk-i3lmns\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#differencirovka-nizhnih-motonejronov-iz-ipsk-i3lmns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дифференцировка нижних мотонейронов из ИПСК (i3LMNs):&lt;/span&gt;&lt;/a&gt;Дифференцировка нижних мотонейронов из ИПСК (i3LMNs):&lt;/h4&gt;\n&lt;p&gt;Дифференцировку ИПСК человека проводили согласно ранее опубликованным данным. Кратко: индукция ИПСК достигалась с использованием среды, содержащей DMEM/F12, добавку GlutaMAX (Thermo Fisher), незаменимые аминокислоты MEM (Thermo Fisher), добавку N2 (Thermo Fisher), 0,2 мМ соединения E, 2 мкг/мл доксициклина, пенициллин/стрептомицин и 1 мкг/мл ламинина. После 48-часовой индукции клетки диссоциировали с помощью Accutase и повторно высевали на чашки, покрытые поли-D-лизином (PDL)/ламинином, в индукционной среде с добавлением 1x ингибитора ROCK и CultureOne. Через 24 часа индукционную среду заменяли на среду для мотонейронов, содержащую Neurobasal (Gibco, 21103049), добавку Glutamax (Thermo Fisher), незаменимые аминокислоты MEM (Thermo Fisher), добавку N2 max (R&amp;amp;D Systems, AR009), добавку N21 max (R&amp;amp;D Systems, AR008), CultureOne, 1 мкг/мл ламинина, 2 мкг/мл доксициклина гиклата, 10 нг/мл BDNF (Peprotech) и 10 нг/мл GDNF (Peprotech). Смену половины объема среды проводили дважды в неделю.&lt;/p&gt;\n&lt;h4 id=\"nokdaun-tdp-43-v-kletkah-sh-sy5y-i-sk-n-be2\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#nokdaun-tdp-43-v-kletkah-sh-sy5y-i-sk-n-be2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нокдаун TDP-43 в клетках SH-SY5Y и SK-N-BE(2):&lt;/span&gt;&lt;/a&gt;Нокдаун TDP-43 в клетках SH-SY5Y и SK-N-BE(2):&lt;/h4&gt;\n&lt;p&gt;Клетки SH-SY5Y и SK-N-BE(2) трансдуцировали лентивирусом SmartVector (V3IHSHEG_6494503), содержащим доксициклин-индуцируемую кассету shRNA для TDP-43. Трансдуцированные клетки отбирали с помощью пуромицина (1 мкг/мл) в течение одной недели. Пул клеток SH-SY5Y и SK-N-BE(2) с нокдауном TDP-43 высевали как одиночные клетки и размножали для получения клональной популяции. Получение линии клеток SH-SY5Y с делецией криптического экзона UNC13A (линия ΔCE) описано в работе Keuss 2024. Клетки выращивали в среде DMEM/F12 с добавлением Glutamax (Gibco), 10% FBS (Gibco) и 1% пенициллина/стрептомицина (Thermo Fisher). Для индукции shRNA против TARDBP клетки обрабатывали в течение 10 дней возрастающими концентрациями доксициклина гиклата (1000 нг/мл) (Sigma), если не указано иное.&lt;/p&gt;\n&lt;h4 id=\"crispri-oposredovannyj-nokdaun-tdp-43-v-ipsc-cheloveka\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#crispri-oposredovannyj-nokdaun-tdp-43-v-ipsc-cheloveka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span cl
