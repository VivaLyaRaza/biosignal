            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"274\" cy=\"127\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"526\" cy=\"282\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · MICROBIOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Ученые впервые&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;экспериментально доказали&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;существование вирусоподобных&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;РНК с генами&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-f1.jpg\" alt=\"Рис. 1. Структурные особенности дзета-вирусов. (A) Круговая диаграмма вторичной структуры с минимальной свободной энерги\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1. Структурные особенности дзета-вирусов. (A) Круговая диаграмма вторичной структуры с минимальной свободной энергией для РНК ZV1, ZV2 и ZV3. Предсказанные взаимодействия комплементарного спаривания внутри генома РНК обозначены дугами, цвета которых (от белого до темно-красного) отражают стабильность пары оснований, выраженную как локальный вклад в свободную энергию (ккал/моль). Относительные положения (+) и (-) молоткообразных рибозимов (HHRz) отмечены соответственно фиолетовым и оранжевым цветами. ORF A ((+) цепь) и ORF B ((-) цепь) показаны синим и зеленым цветами соответственно, а треугольники обозначают соответствующие стартовые кодоны. (B) Вторичная структура (+) (слева) и (-) (справа) HHRz для ZV1, ZV2 и ZV3. Сайт расщепления отмечен стрелкой, а консервативные нуклеотиды внутри каталитического ядра выделены черным фоном.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Ученые впервые экспериментально подтвердили существование дзета-вирусов и открыли новый тип кодирующих РНК — бетавироидоподобные РНК. Эти кольцевые молекулы способны кодировать белки, обходятся без ДНК и используют симметричную репликацию. Анализ метатранскриптомов показал, что они широко распространены в почве и водно-болотных угодьях. Исследование значительно расширяет известное разнообразие кодирующих репликонов кольцевой РНК.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Впервые экспериментально доказано существование дзета-вирусов в почве.&lt;/li&gt;\n&lt;li&gt;Открыт новый класс кодирующих кольцевых РНК — бетавироидоподобные РНК.&lt;/li&gt;\n&lt;li&gt;Подтверждена симметричная репликация РНК без участия ДНК-стадий.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Вироидоподобные РНК — это инфекционные агенты с кольцевыми геномами и рибозимами, которые долгое время изучались лишь по компьютерным данным. Новая работа впервые представила экспериментальные доказательства существования дзета-вирусов и описала новый класс — бетавироидоподобные РНК. Ученые выделили три новых дзета-вируса из почвы, один из которых был полностью изучен в лаборатории.&lt;/p&gt;\n&lt;p&gt;Исследователи подтвердили наличие обеих полярных нитей кольцевой РНК, отсутствие ДНК-форм и саморасщепление рибозимов, что доказывает симметричную репликацию по типу катящегося кольца. Всего было найдено 16 дзета-вирусов с самыми разными саморасщепляющимися рибозимами, включая дельта-, твистер- и шпилечные типы. Они используют рамки считывания, охватывающие весь геном, что кардинально меняет наши представления о генетическом разнообразии таких агентов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа основана на препринте и метатранскриптомах из ограниченного числа экосистем, поэтому полный круг хозяев этих РНК еще предстоит выяснить.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Данное исследование убедительно подтверждает существование двух совершенно новых групп вироидоподобных РНК, способных кодировать белки, что существенно расширяет наши представления о разнообразии и эволюционной сложности подобных инфекционных агентов. Наряду с классическими свойствами вироидоподобных структур — кольцевыми геномами из РНК, компактной вторичной организацией и способностью рибозимов к саморасщеплению на обеих нитях полярности — эти молекулы обладают уникальным потенциалом трансляции белков с обеих цепей, причем кодирующие участки по своей длине превосходят размер самого генома.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование впервые экспериментально доказало существование кодирующих вироидоподобных РНК (дзета-вирусов и бетавироидоподобных РНК), у которых кодирующие области и мотивы репликации совмещены в одних и тех же геномных регионах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Подобное тесное совмещение функциональных мотивов репликации и белок-кодирующих последовательностей в пределах одних и тех же участков генома демонстрирует беспрецедентный уровень плотности упаковки генетической информации и открывает доселе неизвестную стратегию организации геномов в живой природе.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Саморасщепляющиеся рибозимы — это участки РНК, которые способны самостоятельно разрезать собственную цепь без участия ферментов белков, что критически важно для процессов размножения таких агентов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В то же время полученные результаты ставят перед научным сообществом целый ряд фундаментальных вопросов о происхождении, путях эволюции, механизмах экспрессии и истинной биологической роли этих необычных РНК, а также о тех селективных факторах среды, которые сформировали столь экстремально компактную архитектуру их генома.&lt;/p&gt;\n&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Вироидоподобные РНК (vdlRNAs) представляют собой инфекционные агенты с одноцепочечным кольцевым геномом, образующим плотную вторичную структуру с большим количеством комплементарных пар. Их репликация чаще всего осуществляется по механизму катящегося кольца через промежуточные РНК-соединения с привлечением ферментов хозяина. У некоторых таких агентов имеются саморасщепляющиеся рибозимы, обеспечивающие точный разрез промежуточных продуктов репликации. В зависимости от разновидности, vdlRNAs могут быть некодирующими либо нести одну или несколько открытых рамок считывания (ORF), кодирующих гипотетические белки для репликации и других жизненных этапов. Данная группа объединяет агентов с разным размером генома, кругом хозяев и стратегиями размножения. Самыми миниатюрными инфекционными агентами считаются вироиды размером примерно 200–450 нуклеотидов (nt), состоящие из кольцевых некодирующих РНК, способные к автономной репликации и системному инфицированию растений. Вироидоподобные сателлитные РНК похожи на них по структуре и также поражают растения, однако для заражения им необходим вирус-помощник.&lt;/p&gt;\n&lt;p&gt;Вирус гепатита дельта (HDV) и дельтавирусоподобные РНК обладают более крупными кольцевыми геномами длиной около 1200–2000 nt по сравнению с вироидами и сателлитными РНК, кодируют дельта-антиген или родственные белки, поражая человека и животных. Отдельную категорию составляют ретрозимы и ретровироиды, которые не обладают инфекционными свойствами и имеют ДНК-эквивалент, встроенный в геном животных или растений. Недавние метатранскриптомные исследования продемонстрировали, что vdlRNAs встречаются гораздо шире, чем предполагалось ранее, охватывая грибы и бактерии в различных экологических нишах.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метатранскриптомика — это метод масштабного анализа всех молекул РНК, выделенных напрямую из природных образцов, который позволяет находить новые вирусные геномы без их предварительного культивирования в лаборатории.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"novye-viroidopodobnye-agenty-i-ih-svojstva\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#novye-viroidopodobnye-agenty-i-ih-svojstva\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Новые вироидоподобные агенты и их свойства&lt;/span&gt;&lt;/a&gt;Новые вироидоподобные агенты и их свойства&lt;/h4&gt;\n&lt;p&gt;Особой группой недавнего описания являются дзета-вирусы, обнаруженные до сих пор исключительно in silico. В метатранскриптомных базах данных из экосистем и беспозвоночных было найдено около 311 последовательностей дзета-вирусов, хотя их реальные хозяева не установлены, а экспериментальные доказательства существования отсутствовали. Дзета-вирусы представляют собой кольцевые РНК размером 324–789 nt, принимающие палочковидную вторичную структуру. Уникальная особенность генома заключается в том, что его длина кратна трем, а каждая цепь содержит по одной ORF без стоп-кодонов, охватывающей весь геном. Это указывает на возможность синтеза бесконечных тандемных повторов белка с обеих полярностей. Дополнительно обе цепи содержат саморасщепляющиеся рибозимы молоткообразного типа.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В работе впервые экспериментально идентифицирован и охарактеризован дзета-вирус, а также открыта новая группа кодирующих vdlRNAs — бетавироидоподобные РНК.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В представленной работе авторы приводят первые экспериментальные данные и молекулярное описание дзета-вируса. Более того, открыта новая группа кодирующих vdlRNAs под названием бетавироидоподобные РНК, отличительной чертой которых является наличие рибозима и ORF на каждой цепи полярности. Примечательно, что в мономерной молекуле РНК у ORF отсутствует рамкообразующий стоп-кодон. Прекращение трансляции происходит лишь после сдвига рамки считывания в предполагаемом мультимерном промежуточном продукте репликации либо посредством циклической повторной трансляции кольцевой РНК. В обоих случаях итоговая кодирующая последовательность превышает длину генома мономерного vdlRNA. Авторы также приводят и обсуждают данные, подтверждающие естественное распространение бетавироидоподобных РНК в природе.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"identifikaciya-i-harakteristika-novyh-dzeta-virusov\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#identifikaciya-i-harakteristika-novyh-dzeta-virusov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Идентификация и характеристика новых дзета-вирусов&lt;/span&gt;&lt;/a&gt;Идентификация и характеристика новых дзета-вирусов&lt;/h4&gt;\n&lt;p&gt;Поиск с помощью алгоритма INFERNAL для выявления РНК, содержащих рибозимы, в трех из шести библиотек RNAseq (C30, C105 и C110) из образцов почвы показал наличие 109, 32 и 17 контигов соответственно, которые соответствуют предполагаемым vdlRNA. Среди них были отобраны три контига с характерными признаками дзета-вирусов. Контиги NODE_21658 (длина 647 нт; покрытие 3.67) и NODE_1090 (длина 721 нт; покрытие 11.18) из библиотек C105 и C110 соответствуют одной и той же предполагаемой кольцевой РНК размером 600 нт, названной ZV1 (Рис. 1A). Контиги NODE_198789 (длина 591 нт; покрытие 22.62) и NODE_416260 (длина 447 нт; покрытие 0.52), оба из библиотеки C30, соответствуют двум предполагаемым кольцевым РНК размером 405 и 399 нт, названным ZV2 и ZV3 (Рис. 1A). Нуклеотидная идентичность этих последовательностей друг с другом составляет от 52 до 58.5%, а поиск по базе BLAST не выявил значимого сходства с другими ранее описанными последовательностями. Каждая полярная нить всех трех РНК содержит рибозим типа III «молоток» (HHRz) (Рис. 1B), причем последовательности HHRz спарены в предполагаемой палочковидной вторичной структуре (Рис. 1A). Один из рибозимов HHRz вируса ZV1, расположенный на (-) нити согласно более поздним данным, имеет мутацию в консервативном каталитическом центре: типичный мотив CUGA заменен на CCGA.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-f1.jpg\" alt=\"Рис. 1. Структурные особенности дзета-вирусов. (A) Круговая диаграмма вторичной структуры с минимальной свободной энерги\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1. Структурные особенности дзета-вирусов. (A) Круговая диаграмма вторичной структуры с минимальной свободной энергией для РНК ZV1, ZV2 и ZV3. Предсказанные взаимодействия комплементарного спаривания внутри генома РНК обозначены дугами, цвета которых (от белого до темно-красного) отражают стабильность пары оснований, выраженную как локальный вклад в свободную энергию (ккал/моль). Относительные положения (+) и (-) молоткообразных рибозимов (HHRz) отмечены соответственно фиолетовым и оранжевым цветами. ORF A ((+) цепь) и ORF B ((-) цепь) показаны синим и зеленым цветами соответственно, а треугольники обозначают соответствующие стартовые кодоны. (B) Вторичная структура (+) (слева) и (-) (справа) HHRz для ZV1, ZV2 и ZV3. Сайт расщепления отмечен стрелкой, а консервативные нуклеотиды внутри каталитического ядра выделены черным фоном.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;INFERNAL — биоинформатический метод поиска структурных РНК, а рибозимы типа III «молоток» (HHRz) — это каталитические участки РНК, способные разрезать сами себя.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Все эти vdlRNA содержат по одной открытой рамке считывания (ORF) на каждой полярной нити, причем каждая ORF охватывает весь кольцевой геном без стоп-кодонов внутри рамки. В результате каждая нить ZV1, ZV2 и ZV3 предположительно кодирует белок, состоящий из бесконечного тандемного повтора единицы длиной 200, 135 и 133 аминокислоты (aa) соответственно. Дополнительных ORF при использовании генетических кодов, отличных от эукариотического, обнаружено не было. Компактная кольцевая палочковидная вторичная структура РНК, наличие спаренных HHRz и длина генома, кратная трем (405, 399 и 600 нт), обеспечивающая непрерывный перевод кольцевой РНК в предполагаемые белки с бесконечными тандемными повторами, составляют ключевые характеристики дзета-вирусов.&lt;/p&gt;\n&lt;p&gt;Шесть предполагаемых мономерных белков дзета-вирусов разделяли низкую аминокислотную идентичность друг с другом — от 11.3% до 24.8%. Третичные структуры мономерных белков, предсказанные с помощью AlphaFold 3, демонстрировали преимущественно α-спиральные мотивы (Рис. S1). Однако оценки моделирования шаблона (pTM) оказались низкими и составляли от 0.16 до 0.24, что указывает на ограниченную достоверность моделей (pTM &amp;lt; 0.5). Предсказанные структуры предполагаемых димерных и тримерных белков также преобладающе состояли из α-спиралей, но характеризовались столь же низкими значениями pTM (Рис. S1).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-fS1.jpg\" alt=\"Рис. S1. Третичные структуры предполагаемых белков ZV1, ZV2 и ZV3 вируса дзета (A и B), предсказанные с помощью сервера \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1. Третичные структуры предполагаемых белков ZV1, ZV2 и ZV3 вируса дзета (A и B), предсказанные с помощью сервера AlphaFold на базе AlphaFold 3.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Дзета-вирусы имеют геномы размером 399, 405 и 600 нт со спаренными рибозимами HHRz и рамками считывания, кратными трем, кодирующими белки с тандемными повторами.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для оценки вариабельности последовательностей в геномах дзета-вирусов были проанализированы данные высокопроизводительного секвенирования (HTS). Ожидалось, что вариабельность будет сильно ограничена, поскольку геном должен одновременно сохранять консервативные структурные особенности РНК (компактную вторичную структуру и саморасщепляющиеся рибозимы) и поддерживать кодирующую способность на обеих нитях. Кроме того, потенциальная способность кодировать тандемно-повторяющиеся белки требует сохранения длины генома кратной трем нуклеотидам.&lt;/p&gt;\n&lt;p&gt;В последовательности ZV1 картировалось в общей сложности 150 и 627 ридов из библиотек C105 и C110 соответственно. Анализ выровненных ридов выявил единственный полиморфный сайт (замена G&lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;C в позиции 137) в библиотеке C110 с частотой 57.1% (p-значение варианта = 6.3 × 10⁻⁵). Эта замена не приводила к появлению преждевременных стоп-кодонов ни в одном из предполагаемых белков. Однако она привела к консервативной аминокислотной замене (Триптофан &lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; Серин) в потенциальном белке ORF A и к консервативной замене (Глутамин &lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; Глутаминовая кислота) в белке ORF B. В библиотеке C30 с последовательностью ZV2 картировалось 508 ридов, что позволило выявить два полиморфных сайта (замены G&lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;А и T&lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;А). Эти варианты встречались с частотами 69.1% (p-значение = 6.8 × 10⁻¹³⁰) и 35.6% (p-значение = 4.7 × 10⁻⁹²) соответственно. Мутация G&lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;А привела к неконсервативным заменам в обоих предсказанных белках (Глицин &lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; Глутаминовая кислота и Пролин &lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; Серин в ORF A и ORF B). Замена T&lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;А также вызвала неконсервативные замены (Триптофан &lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; Аргинин в ORF A и Глутамин &lt;span class=\"yfm-latex\" data-content=\"%5Crightarrow\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; Лейцин в ORF B). Лишь восемь ридов из библиотеки C30 картировались на последовательность ZV3, и полиморфных сайтов обнаружено не было, что, вероятнее всего, связано с очень низкой глубиной секвенирования. Важно отметить, что ни в одной из проанализированных vdlRNA не было найдено инсерций или делеций нуклеотидов, что указывает на строгое сохранение длины генома и целостности рамки считывания.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Низкая глубина секвенирования для некоторых вариантов (например, всего 8 ридов для ZV3) ограничивает точность анализа вариабельности.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для дальнейшей характеризации в качестве модели использовали ZV1. Для его обнаружения препараты РНК из образцов почвы подвергали обратной транскрипции со случайными праймерами с последующей ПЦР-амплификацией с двумя соседними специфическими праймерами противоположной полярности (ZetaV_1 и ZetaV_2, Таблица S1), способными амплифицировать кольцевые мономерные и/или мультимерные формы. Ампликон размером, соответствующим полноразмерному геному ZV1, был получен из обоих образцов почвы — C105 и C110 (Рис. 2A). Клонирование и Сэнгер-секвенирование амплифицированных кДНК подтвердили, что их последовательность соответствует геномной РНК ZV1, идентифицированной in silico, что предоставило экспериментальные доказательства ее существования (номер доступа ZV1 в GenBank:)&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-f2.jpg\" alt=\"Рис. 2. Молекулярная характеристика дзета-вируса 1 (ZV1). (A) ПЦР с обратной транскрипцией (RT-PCR) полноразмерного гено\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 2. Молекулярная характеристика дзета-вируса 1 (ZV1). (A) ПЦР с обратной транскрипцией (RT-PCR) полноразмерного геномного ZV1 с использованием соседних праймеров противоположной полярности из образцов почвы C105 и C110. (B) ПЦР-амплификация фрагмента ZV1 (184 нт) с использованием специфических праймеров (ZetaV_184_3 и ZetaV_184_4) и препаратов кДНК или ДНК в качестве матрицы для подтверждения отсутствия ДНК-аналога (слева). ПЦР-амплификация препаратов ДНК с использованием универсальных грибных праймеров ITS4/ITS5 использовалась в качестве положительного контроля (справа). (C) Цепеспецифическая ОТ с последующей полуколичественной ПЦР для определения цепи ZV1 с наиболее преобладающей полярностью, обозначаемой по конвенции как (+) полярность. н.д., не разведено. M, маркер длины ДНК Gene ruler DNA ladder mix (Thermo Scientific). (D) Схематическое представление матриц ДНК и мономерных продуктов РНК, полученных путем транскрипции in vitro. Плазмида, содержащая мономерную последовательность ZV1, линеаризованная с помощью SpeI и транскрибированная с помощью РНК-полимеразы T7, генерирует мономерные транскрипты (полноразмерные, FL) положительной полярности; указаны размеры ожидаемых 5'- и 3'-фрагментов (5'F и 3'F), образующихся в результате активности авторасщепления HHRz (левая сторона). Линеаризация с помощью NcoI и транскрипция той же плазмиды с помощью РНК-полимеразы SP6 приводят к образованию мономерных транскриптов (FL) отрицательной полярности и соответствующих им фрагментов авторасщепления 5'F и 3'F (справа). Зеленым цветом обозначены последовательности плазмиды; желтым — промотор полимеразы; синим — последовательность ZV1 со стрелками, указывающими ориентацию; наконечники стрелок и ножницы отмечают положение сайтов авторасщепления. Ожидаемые размеры фрагментов РНК указаны слева. На средней панели показан анализ ПААГ реакции транскрипции in vitro положительных и отрицательных мономеров ZV1. M, маркер РНК (низкоразмерный маркер одноцепочечной РНК Low range ssRNA ladder, New England Biolabs) с размерами (нт), указанными слева. (E) Определение сайта авторасщепления (красная стрелка) методом 5' RACE для фрагмента 3'F, полученного в результате активности, опосредованной HHRz. Электрофореграммы секвенирования продуктов 5' RACE для фрагментов авторасщепления (+) и (-) 3'F показаны слева на верхней и нижней панелях соответственно. Сайты авторасщепления (красная стрелка) (+) и (-) HHRz (справа) были определены методом 5' RACE фрагментов авторасщепления 3'F. Вторичные структуры рибозимов показаны справа.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица S1.&lt;/strong&gt; Список праймеров, использованных в данном исследовании.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Название праймера&lt;/th&gt;\n&lt;th&gt;Последовательность (от 5’ к 3’)&lt;/th&gt;\n&lt;th&gt;Назначение&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;ZetaV 1 _&lt;/td&gt;\n&lt;td&gt;TTTTACAATTCCACTCGACCGA&lt;/td&gt;\n&lt;td&gt;ПЦР-амплификация полноразмерного генома ZV1&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;ZetaV 2 _&lt;/td&gt;\n&lt;td&gt;AGGGAAAGGAGGGTAAGAATGA&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;ZetaV 184 3 _ _&lt;/td&gt;\n&lt;td&gt;GTCCGAAACTCTCTCTCCGA&lt;/td&gt;\n&lt;td&gt;ПЦР-амплификация фрагмента ZV1 (184 нт)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;ZetaV 184 4 _ _&lt;/td&gt;\n&lt;td&gt;CCAACCAGAGAAACCAAGCC&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;ZetaV 184 4 _ _&lt;/td&gt;\n&lt;td&gt;CCAACCAGAGAAACCAAGCC&lt;/td&gt;\n&lt;td&gt;5’ RACE ZV1 (+)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Zeta nRacePlus 82 _ _&lt;/td&gt;\n&lt;td&gt;CCTGATAGGAGTGATCCTCG&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Zeta RaceNeg 177 _ _&lt;/td&gt;\n&lt;td&gt;GAACACCAGGAACGGGAAGA&lt;/td&gt;\n&lt;td&gt;5’ RACE ZV1 (-)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Zeta nRaceNeg 144 _ _&lt;/td&gt;\n&lt;td&gt;ATTCCTCTTCGATTTCTCGAA&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;ITS5&lt;/td&gt;\n&lt;td&gt;GGAAGTAAAAGTCGTAACAAGG&lt;/td&gt;\n&lt;td&gt;Детекция грибковой ДНК&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;ITS4&lt;/td&gt;\n&lt;td&gt;TCCTCCGCTTATTGATATGC&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Bvdl786 2 _&lt;/td&gt;\n&lt;td&gt;GGCGTAACCGGTTCAGCTGT&lt;/td&gt;\n&lt;td&gt;ПЦР-амплификация полноразмерного генома βvdl786&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Bvdl786 1 _&lt;/td&gt;\n&lt;td&gt;CGAAGGCAATCACTCGACAG&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Bvdl1793 3 _&lt;/td&gt;\n&lt;td&gt;GGTCTCTTCCCGGAATTTCC&lt;/td&gt;\n&lt;td&gt;ПЦР-амплификация полноразмерного генома βvdl1793&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Bvdl1793 4 _&lt;/td&gt;\n&lt;td&gt;ACTCCCCACTTCGGCTTATC&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Bvdl786 248Rev _&lt;/td&gt;\n&lt;td&gt;TCCTGTTGGGATCACCCATA&lt;/td&gt;\n&lt;td&gt;ПЦР-амплификация фрагмента βvdl786 (248 нт)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Bvdl1793 256Rev _&lt;/td&gt;\n&lt;td&gt;TAGGCCTTTCTCGAGTTCCAG&lt;/td&gt;\n&lt;td&gt;ПЦР-амплификация фрагмента βvdl1793 (256 нт)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Bvdl786 1 _&lt;/td&gt;\n&lt;td&gt;CGAAGGCAATCACTCGACAG&lt;/td&gt;\n&lt;td&gt;5’ RACE βvdl786 (+)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;BV786 nRacem104 _&lt;/td&gt;\n&lt;td&gt;AGAGAACAGAAACGGGAGTC&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Bvdl786 2 _&lt;/td&gt;\n&lt;td&gt;GGCGTAACCGGTTCAGCTGT&lt;/td&gt;\n&lt;td&gt;5’ RACE βvdl786 (-)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;BV786 nRacep100 _&lt;/td&gt;\n&lt;td&gt;ACCAGTAAGGATGTTCCCTA&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;BV1793 Racep163 _&lt;/td&gt;\n&lt;td&gt;AGGAATCAGAGAACAGAGTC&lt;/td&gt;\n&lt;td&gt;5’ RACE βvdl1793 (+)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Bvdl1793 256Rev _&lt;/td&gt;\n&lt;td&gt;TAGGCCTTTCTCGAGTTCCAG&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;BV1793 Racem178 _&lt;/td&gt;\n&lt;td&gt;AGGTACTCGAAGGAATTCGA&lt;/td&gt;\n&lt;td&gt;5’ RACE βvdl1793 (-)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;BV1793 nRacem106 _&lt;/td&gt;\n&lt;td&gt;TCGAGGAACAATTGGTTGTG&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;polyC RACE&lt;/td&gt;\n&lt;td&gt;CGCGGATCCCCCCCCCCCC&lt;/td&gt;\n&lt;td&gt;5’ RACE&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h4 id=\"otsutstvie-dnk-predshestvennika,-polyarnost-cepej-i-ribozimnaya-aktivnost-zv1\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#otsutstvie-dnk-predshestvennika,-polyarnost-cepej-i-ribozimnaya-aktivnost-zv1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Отсутствие ДНК-предшественника, полярность цепей и рибозимная активность ZV1&lt;/span&gt;&lt;/a&gt;Отсутствие ДНК-предшественника, полярность цепей и рибозимная активность ZV1&lt;/h4&gt;\n&lt;p&gt;Чтобы выяснить, имеет ли РНК ZV1 ДНК-сородича, исследователи провели ПЦР-амплификацию с праймерами ZetaV_184_3 и ZetaV_184_4, специфичными для ZV1 и нацеленными на фрагмент размером 184 нт, используя препараты кДНК и ДНК из почвенных образцов C105 и C110. В качестве положительного контроля применяли универсальные праймеры ITS4/ITS5 для грибного ITS, присутствие которого в данных образцах ожидалось на основе ранних данных. При использовании в качестве матрицы ДНК целевой продукт с праймерами ZV1 обнаружен не был, в то время как с грибными праймерами на той же матрице, а также с праймерами ZV1 на матрице кДНК сформировались ампликоны ожидаемого размера (Рис. 2B). Это доказало, что у ZV1 отсутствует ДНК-эквивалент.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ПЦР с обратной транскрипцией (RT-PCR) — метод, позволяющий сначала превратить РНК в комплементарную ДНК (кДНК), а затем многократно скопировать нужный участок для его анализа.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для оценки наличия двух полярностей РНК и отнесения знака (+) к цепи, накапливающейся в большем количестве, выполнили полуколичественную RT-PCR. Каждую полярную цепь отдельно перетранскрибировали в обратном направлении с использованием специфичных для цепей праймеров ZetaV_1 и ZetaV_2. Полученные кДНК в различных разведениях (цельная, 1:2, 1:10, 1:20) амплифицировали с праймерами ZetaV_184_3 и ZetaV_184_4. В результате амплифицировались обе полярности РНК, однако уровень стабильного состояния цепи РНК ZV1, транскрибированной с праймером ZetaV_2, оказался существенно выше (Рис. 2C), вследствие чего именно её обозначили как (+) полярную цепь.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Полуколичественная RT-PCR показала накопление обеих полярностей РНК ZV1, причем цепь, синтезированная с праймером ZetaV_2, доминирует и классифицируется как (+) полярность.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Активность саморасщепления молоточковых рибозимов (HHRz) ZV1 проверяли посредством in vitro транскрипции мономерной геномной РНК для обеих полярных цепей. В обоих случаях детектировался полноразмерный транскрипт, а также два продукта, образование которых ожидалось в результате рибозимного саморасщепления (Рис. 2D). Более того, точные сайты саморасщепления для (+) и (-) HHRz подтвердили методом 5’-RACE-анализа, который продемонстрировал, что 3’-фрагменты, сгенерированные активностью рибозимов в ходе транскрипции, обладают ожидаемыми 5’-концами (Рис. 2E). В совокупности эти результаты подтвердили, что молоточковые рибозимы ZV1 активны in vitro, что указывает на репликацию через симметричный механизм катящегося кольца.&lt;/p&gt;\n&lt;h4 id=\"identifikaciya-rnk-zeta-virusov,-soderzhashih-samorassheplyayushiesya-ribozimy,-otlichnye-ot-ribozimov-molotkov-iii-tipa\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#identifikaciya-rnk-zeta-virusov,-soderzhashih-samorassheplyayushiesya-ribozimy,-otlichnye-ot-ribozimov-molotkov-iii-tipa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Идентификация РНК зета-вирусов, содержащих саморасщепляющиеся рибозимы, отличные от рибозимов «молотков» III типа&lt;/span&gt;&lt;/a&gt;Идентификация РНК зета-вирусов, содержащих саморасщепляющиеся рибозимы, отличные от рибозимов «молотков» III типа&lt;/h4&gt;\n&lt;p&gt;Рибозимы «молотки» делятся на три топологических класса (I, II и III) в зависимости от того, какая спираль содержит концы молекулы РНК [18]. К настоящему моменту описанные в литературе зета-вирусы характеризуются присутствием рибозимов «молотков» III типа в обеих геномных полярностях [15]. Чтобы исследовать существование зета-вирусов, содержащих другие типы саморасщепляющихся рибозимов, был проведен поиск по набору данных РНК вироидоподобных агентов, ранее идентифицированных &lt;i&gt;in silico&lt;/i&gt; Форжи и др. [10]. Интересно, что этот поиск выявил 16 зета-вирусов (Рис. 3), содержащих саморасщепляющиеся рибозимы, отличные от рибозимов «молотков» III типа, в различных комбинациях (Таблица 1 и Рис. 4). Вновь идентифицированные зета-вирусы демонстрировали предсказанную вторичную структуру палочковидного или квазипалочковидного типа. Единственным заметным исключением был зета-вирус ZV130856, который показывал значительно более разветвленную структуру (Рис. 3).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-f3.jpg\" alt=\"Рис. 3. Круговая диаграмма вторичной структуры с минимальной свободной энергией дзета-вирусов с рибозимами, отличными от\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 3. Круговая диаграмма вторичной структуры с минимальной свободной энергией дзета-вирусов с рибозимами, отличными от HHRz типа III, выявленными в метатранскриптомных наборах данных. Относительные положения (+) и (-) рибозимов обозначены фиолетовым и оранжевым цветами соответственно. ORF, кодируемые в (+) и (-) цепях, показаны синим и зеленым цветами соответственно, а треугольники отмечают соответствующие стартовые кодоны (см. подробности на легенде к рис. 1).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-f4.jpg\" alt=\"Рис. 4. Вторичная структура (+) и (-) рибозимов, обнаруженных у дзета-вирусов из метатранскриптомных наборов данных и не\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 4. Вторичная структура (+) и (-) рибозимов, обнаруженных у дзета-вирусов из метатранскриптомных наборов данных и не содержащих парные HHRz типа III. DVRz: дельта-рибозим; HHRz II: молоткообразные рибозимы типа II; HHRz III: молоткообразные рибозимы типа III; HPRz: шпилечный рибозим; TWRz: рибозим твистер. Сайт расщепления отмечен красной стрелкой, а консервативные нуклеотиды внутри каталитического ядра выделены черным фоном. Нуклеотиды, образующие дополнительный элемент спираль-петля, обнаруженный в рибозиме твистер в одной полярности ZV130856, выделены красным цветом.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 1.&lt;/strong&gt; Список предполагаемых дзета-вирусов, содержащих рибозимы, отличные от HHRz типа III.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;ID&lt;/th&gt;\n&lt;th&gt;Contig&lt;/th&gt;\n&lt;th&gt;Размер генома (нт)&lt;/th&gt;\n&lt;th&gt;Рибозима (+)&lt;/th&gt;\n&lt;th&gt;E-value (+)&lt;/th&gt;\n&lt;th&gt;Рибозима (-)&lt;/th&gt;\n&lt;th&gt;E-value (-)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Саморасщепляющиеся рибозимы — это функциональные молекулы РНК, способные катализировать разрыв собственной фосфодиэфирной связи без участия белков, а различные классы (молотки, дельта, твистер и шпилька) различаются по своей пространственной архитектуре.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В число этих объектов вошли следующие варианты с конкретными метагеномными идентификаторами и параметрами покрытия: ZV28323 (SRR11829260; NODE_28323_length_742_cov_26.500747; DVRz 5.7e-05 и 5.7e-05), ZV42858 (SRR10482243; NODE_42858_length_739_cov_170.015015; DVRz 8.4e-05 и 8.6e-03), ZV12952 (SRR7428111; NODE_12952_length_715_cov_3.442943; DVRz 1.4e-03 и 1.2e-04), ZV31793 (SRR11450578; NODE_31793_length_535_cov_103.549784; DVRz 8.0e-05 и 1.5e-04), ZV39444 (SRR5864101; NODE_39444_length_535_cov_1.967532_1; DVRz 7.6e-04 и 8.0e-05), ZV36159 (SRR11614418; NODE_36159_length_751_cov_5.014749; DVRz 1.1e-04 и 9.0e-03), ZV18610 (SRR8512518; NODE_18610_length_676_cov_17.376396; DVRz 1.5e-04 и 8.1e-02), ZV52073 (SRR7286070; NODE_52073_length_484_cov_65.367397; DVRz 2.8e-02 и 1.9e-04), ZV110734 (SRR8857868; NODE_110734_length_484_cov_15.513382; DVRz 2.8e-02 и 9.4e-03), ZV130856 (SRR11565845; NODE_130856_length_499_cov_8.208920; HPRz 3.1e-08 и TWRz 1.2e-06), ZV98882 (SRR11828805; NODE_98882_length_550_cov_4.985325; HHRz II 3.2e-09 и HHRz III 2.2e-01), ZV138865 (SRR11011818; NODE_138865_length_412_cov_3.073746; HHRz II 6.7e-04 и 3.2e-07), ZV39584 (SRR5839026; NODE_39584_length_481_cov_9.259804; HHRz II 9.3e-04 и HHRz III 3.9e-08), ZV63649 (SRR12264489; NODE_63649_length_541_cov_16.369658; HHRz III 1.8e-04 и HHRz II 1.0e-03), ZV45724 (SRR6323866; NODE_45724_length_541_cov_3.835470; HHRz III 9.4e-07 и HHRz II 1.8e-02) и ZV5877 (SRR5864110; NODE_5877_length_1072_cov_3.852853; TWRz 9.7e-12 в обеих позициях).&lt;/p&gt;\n&lt;p&gt;Девять из этих зета-вирусов содержат дельта-рибозимы (DVRz) в обеих нитях полярности (Рис. 4). Один зета-вирус (ZV138865) содержит рибозимы «молотки» II типа в обеих полярностях, тогда как четыре (ZV98882, ZV39584, ZV63649 и ZV45724) содержат рибозим «молоток» II типа в одной полярности и III типа в другой (Рис. 4). Кроме того, один зета-вирус (ZV130856) несет рибозим «твистер» (TWRz) в одной нити полярности и шпилечный рибозим (HPRz) в противоположной полярности, в то время как другой (ZV5877) содержит рибозимы «твистер» в обеих полярностях (Рис. 4). Интересно, что рибозим TWRz, идентифицированный в одной полярности ZV130856, обладает дополнительным спирально-петельным элементом, который отсутствует в канонической структуре TWRz, а соответствующие нуклеотиды выделены красным цветом на Рис. 4. Более того, ZV5877, содержащий два рибозима TWRz, имеет длину генома 999 нуклеотидов, что делает его длиннее всех остальных зета-вирусов, описанных к настоящему времени.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Поиск выявил 16 новых зета-вирусов с альтернативными рибозимами, включая дельта-рибозимы, «молотки» II типа, «твистеры» и шпилечные рибозимы, а штамм ZV5877 достиг рекордной длины в 999 нуклеотидов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Прогнозирование третичных структур предполагаемых кольцевых белков, кодируемых в обеих полярностях этих вновь идентифицированных зета-вирусов с помощью программы AlphaFold 3, дало оценки pTM ниже 0.5 (данные не показаны), что указывает на низкую достоверность полученных структурных моделей.&lt;/p&gt;\n&lt;p&gt;Попарная идентичность последовательностей была сильно вариабельной и в целом низкой среди зета-вирусов, идентифицированных в данном исследовании, как на уровне нуклеотидов (Рис. S2A), так и среди белков, потенциально кодируемых рамками ORF A и ORF B (Рис. S2B). Идентичность нуклеотидных последовательностей варьировала от 28% до 58%, за исключением ZV52073 и ZV110734, оба содержащих по два дельта-рибозима, которые имеют 90% идентичности последовательностей. Идентичность аминокислотных последовательностей достигала максимум 45%, за исключением шести попарных сравнений, включающих оба белка зета-вирусов с дельта-рибозимами (ZV31793 против ZV39444, ZV12952 против ZV42858 и ZV52073 против ZV110734), которые показали аминокислотную идентичность в диапазоне от 82% до 95%.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-fS2.jpg\" alt=\"Рис. S2. Идентичность нуклеотидных и аминокислотных последовательностей вирусов дзета. (A) Тепловая карта, представляюща\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S2. Идентичность нуклеотидных и аминокислотных последовательностей вирусов дзета. (A) Тепловая карта, представляющая матрицу процента идентичности нуклеотидной последовательности всех идентифицированных вирусов дзета с различными типами рибозимов (H: тип III «голова молотка»; H2: тип II «голова молотка»; D: дельта; T: твистер; HP: шпилечные рибозимы). (B) Тепловая карта, представляющая матрицу процента идентичности аминокислотной последовательности предполагаемых белков (ORF A и ORF B) вирусов дзета. DVRz: дельта-рибозим; II HHRz: рибозимы типа II «голова молотка»; III HHRz: рибозимы типа III «голова молотка»; HPRz: шпилечный рибозим; TWRz: рибозим твистер.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Вновь идентифицированные зета-вирусы преимущественно ассоциировались с наборами данных экологических метатранскриптомов, включая донные отложения, микробные маты, водно-болотные угодья, почвы, пресноводные среды и компост. Единственным исключением был ZV36159, содержащий дельта-рибозимы в обеих полярностях, который был обнаружен в наборе данных вирусных геномов, связанных с образцами беспозвоночных, а именно трипсов &lt;i&gt;Frankliniella intonsa&lt;/i&gt;.&lt;/p&gt;\n&lt;h4 id=\"identifikaciya-i-harakteristika-viroidopodobnyh-rnk-s-novymi-svojstvami\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#identifikaciya-i-harakteristika-viroidopodobnyh-rnk-s-novymi-svojstvami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Идентификация и характеристика вироидоподобных РНК с новыми свойствами&lt;/span&gt;&lt;/a&gt;Идентификация и характеристика вироидоподобных РНК с новыми свойствами&lt;/h4&gt;\n&lt;p&gt;Из библиотек C30, CD95 и CD99 исследователи отобрали четыре дополнительных контига, соответствующих предполагаемым вироидоподобным РНК (vdlRNAs), которые первоначально насчитывали 109, 17 и 31 контиг соответственно. Данные элементы привлекли внимание своими интересными потенциальными кодирующими свойствами. В библиотеке CD95 выделили NODE_786 длиной 784 нт с покрытием 1.76, в библиотеке CD99 — NODE_1793 длиной 721 нт с покрытием 2.12, а в библиотеке C30 — NODE_270217 длиной 525 нт с покрытием 2.29 и NODE_184674 длиной 608 нт с покрытием 9.71. Они соответствуют предполагаемым кольцевым РНК размером 664, 685, 514 и 481 нт соответственно. Анализ BLASTn не выявил значимого сходства этих последовательностей с известными РНК из баз данных. Все эти РНК сворачиваются в палочковидные или квазипалочковидные вторичные структуры (Рис. 5A).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-f5.jpg\" alt=\"Рис. 5. Структурные особенности РНК, подобных бетавироидам (βvdl786, βvdl1793, βvdl270217 и βvdl184674). (A) Круговая ди\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 5. Структурные особенности РНК, подобных бетавироидам (βvdl786, βvdl1793, βvdl270217 и βvdl184674). (A) Круговая диаграмма вторичных структур РНК, подобных бетавироидам, с минимальной свободной энергией (подробнее см. в легенде к рисунку 1). ORF A и B (соответственно синего и зеленого цветов), кодируемые (+) и (-) полярностью, длиннее геномной РНК, причем старт- и стоп-кодоны обозначены соответственно треугольником и квадратом (красного цвета). Относительные положения молоткообразного рибозима в цепях (+) и (-) полярности обозначены фиолетовым и оранжевым цветами соответственно. (B) Предсказанная вторичная структура молоткообразных рибозимов в цепях (+) (слева) и (-) (справа) полярности. (C) Схематическое представление фрагмента мультимерной РНК, подобной бетавироиду, организованной по типу «голова к хвосту».&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BLASTn и INFERNAL — это биоинформатические инструменты: первый ищет схожие последовательности ДНК/РНК в базах данных, а второй находит специфические структурные РНК-мотивы с помощью стохастических контекстно-свободных грамматик.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ с помощью программы INFERNAL выявил в составе каждой из этих предполагаемых вироидоподобных РНК рибозимы типа III HHRz в обеих нитях полярности (Рис. 5B). При этом у vdlRNAs из библиотек CD95 и CD99 один из двух рибозимов содержал мутацию в консервативном каталитическом центре: канонический участок CUGA заменено на CCGA (Рис. 5B). Аналогичная мутация ранее наблюдалась у некоторых дзета-вирусов, обнаруженных в данном исследовании. Четыре вироидоподобные РНК разделяют от 47.95% до 56.97% идентичности нуклеотидных последовательностей друг с другом и демонстрируют схожие структурные и кодирующие черты. В обеих нитях полярности каждая РНК содержит единственную открытую рамку считывания (ORF), которая превышает длину геномной РНК, причем стоп-кодон попадает во второй мономер мультимерной РНК (Рис. 5C). Это происходит из-за того, что размер генома данных vdlRNAs не кратен трем (664, 685, 514 и 481 нт), в отличие от дзета-вирусов. Такой сценарий предполагает участие циркулярных РНК либо мультимерных линейных РНК, образующихся при репликации, в качестве матриц для трансляции, хотя для разделения этих гипотез требуются дополнительные исследования.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Авторы выделили четыре новые вироидоподобные РНК с размерами от 481 до 685 нт, содержащие рибозимы типа III HHRz и уникальные ORF, превышающие длину генома, и предложили назвать их бетавироидоподобными РНК (βvdl786, βvdl1793, βvdl270217 и βvdl184674).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Учитывая наличие ORF длиннее геномной РНК в обеих полярностях, было предложено название бетавироидоподобные РНК (betaviroid-like RNAs) для отличия их от дзета-вирусов, содержащих ORF с потенциальным образованием тандемных белковых повторов. Новые элементы получили названия: бетавироидоподобная РНК 786 (βvdl786), бетавироидоподобная РНК 1793 (βvdl1793), бетавироидоподобная РНК 270217 (βvdl270217) и бетавироидоподобная РНК 184674 (βvdl184674). Поиск через BLASTp не выявил значимого сходства предполагаемых белков с известными в базах данных последовательностями. Попарное сравнение восьми белков, кодируемых бетавироидоподобными РНК, показало низкую аминокислотную идентичность — от 9.77% до 33.33%. Предсказания третичных структур с помощью AlphaFold 3 дали низкие значения pTM (0.16–0.23; Рис. S3), что говорит о низкой достоверности полученных моделей. Картирование сиквенированных ридов на геномные РНК βvdl786, βvdl1793, βvdl270217 и βvdl184674 не выявило полиморфных позиций, что подтверждает строгую консервативность их геномных последовательностей.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-fS3.jpg\" alt=\"Рис. S3. Третичные структуры предполагаемых белков, кодируемых бетавироидоподобными РНК (βvdl786, βvdl1793, βvdl270217 и\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S3. Третичные структуры предполагаемых белков, кодируемых бетавироидоподобными РНК (βvdl786, βvdl1793, βvdl270217 и βvdl184674), предсказанные с помощью AlphaFold Server на базе AlphaFold 3.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Предсказания третичных структур белков с помощью AlphaFold 3 показали очень низкие оценки pTM (0.16–0.23), что указывает на высокую степень неопределенности в отношении реальной трехмерной структуры этих гипотетических белков.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для детальной молекулярной характеризации были отобраны βvdl786 и βvdl1793. К ним применили тот же экспериментальный подход, что и для дзета-вирусов, чтобы подтвердить их существование, отсутствие ДНК-предшественников и способность к саморасщеплению рибозимов. Обратная транскрипция с последующей ПЦР с использованием соседних и комплементарных специфических праймеров (Таблица S1) успешно сгенерировала ампликоны ожидаемого размера для βvdl786 и βvdl1793 из образцов почвы CD95 и CD99 соответственно (Рис. 6A). Клонирование и Сэнгер-сиквенирование этих ампликонов подтвердили данные RNA-seq (номера доступа в GenBank: PZ584208 для βvdl786 и PZ584209 для βvdl1793). Чтобы проверить наличие ДНК-формы, препараты ДНК из почв CD95 и CD99 исследовали методом ПЦР со специфическими праймерами, амплифицирующими фрагменты размером 248 и 256 нт для βvdl786 и βvdl1793 (Таблица S1). КДНК из тех же почв и универсальные грибные праймеры ITS4/ITS5 (Таблица S1) служили положительными контролями (Рис. 6B). ПЦР-продукты для бетавироидоподобных РНК в ДНК-препаратах не обнаружены, что подтверждает отсутствие ДНК-копий в исследованных почвах при успешном срабатывании положительных контролей.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-f6.jpg\" alt=\"Рис. 6. Молекулярная характеристика βvdl786 и βvdl1793. (A) RT-PCR амплификация полноразмерных βvdl786 (664 нт, верхняя \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 6. Молекулярная характеристика βvdl786 и βvdl1793. (A) RT-PCR амплификация полноразмерных βvdl786 (664 нт, верхняя панель) и βvdl1793 (685 нт, нижняя панель) из образцов почвенной РНК CD95 и CD99 соответственно с использованием соседних специфических праймеров противоположной полярности. (B) ПЦР-амплификация частичного фрагмента βvdl786 (248 нт, левая верхняя панель) и βvdl1793 (256 нт, левая нижняя панель) с использованием в качестве матрицы препаратов кДНК или ДНК для подтверждения отсутствия ДНК-аналога. На правой панели показана ПЦР-амплификация ДНК CD95 и CD99 с грибными универсальными праймерами ITS4/ITS5 в качестве положительного контроля. (C) Полуколичественная RT-ПЦР с праймерами, специфичными к цепи, для определения наиболее обильной цепи полярности βvdl786 (верхняя панель) и βvdl1793 (нижняя панель), обозначаемой по соглашению как (+) полярность. n.d., не разведено. M, маркер молекулярной массы ДНК Gene ruler DNA ladder mix (Thermo Scientific). (D) Анализ активности саморасщепления βvdl786. Схематические изображения плазмиды и РНК-продуктов βvdl786 плюс- и минус-полярности, полученных путем транскрипции in vitro, показаны на правой и левой панелях соответственно. Плазмида, содержащая мономерную последовательность кДНК βvdl786, была линеаризована и транскрибирована для получения полноразмерных мономерных транскриптов (FL) цепей (+) (справа) и (−) (слева) полярности, а также соответствующих фрагментов 5′ (5′F) и 3′ (3′F), образованных в результате активности саморасщепления HHRz. Последовательности плазмидного вектора изображены зеленым цветом, а желтым и синим отмечены промотор полимеразы и последовательности βvdl786 соответственно. Ножницы отмечают положение сайтов саморасщепления. Ожидаемый размер каждого фрагмента РНК указан справа. На средней панели показан анализ в 5% ПААГ транскрипции in vitro мономеров (+) и (-) βvdl786. M, маркер РНК (низкомодиапазонный лестничный маркер ssRNA, New England Biolabs), размеры в нуклеотидах (нт) указаны слева. (E) Сайты саморасщепления (красная стрелка) (+) и (-) HHRz (справа) были определены с помощью 5’ RACE 3’F фрагментов, образующихся в результате расщепления мономерных транскриптов βvdl786, опосредованного HHRz. Электроферограммы секвенирования продуктов 5’ RACE показаны с левой стороны от соответствующего рибозима.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эксперименты с ПЦР и образцами ДНК подтвердили, что бетавироидоподобные РНК существуют исключительно в виде РНК, без ДНК-интермедиатов в почвах CD95 и CD99.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для оценки присутствия нитей обеих полярностей и определения их относительного обилия провели полуколичественную ОТ-ПЦР с использованием праймеров, специфичных для (+) и (-) нитей βvdl786 и βvdl1793 (Таблица S1). Реакцию обратной транскрипции проводили раздельно для каждой полярности, после чего полученные кДНК в различных разведениях (неразведенные, 1:2, 1:10, 1:20, 1:200) амплифицировали в ПЦР. Обе полярные нити были обнаружены для обеих бетавироидоподобных РНК. При этом одна из нитей βvdl786 и βvdl1793 накапливалась в существенно более высоких концентрациях в стационарном состоянии, на основании чего именно эта полярность была классифицирована как (+) нить (Рис. 6C).&lt;/p&gt;\n&lt;p&gt;Активность саморасщепления рибозимов типа «голова молотка» (HHRz) оценивалась с помощью транскрипции in vitro на плазмидах, содержащих полноразмерный кДНК-мономер βvdl786. Для обеих полярностей цепей были выявлены три полосы: одна соответствовала полноразмерному транскрипту, две другие — ожидаемым продуктам расщепления (Рис. 6D). Это подтверждает активность HHRz in vitro для обеих цепей. Точные сайты саморасщепления были верифицированы методом 5’ RACE, показавшим, что 3’-фрагменты обладают ожидаемыми 5’-концами (Рис. 6E). Эти данные подтверждают гипотезу о симметричном механизме катящегося кольца при репликации РНК, подобных бетавироидам.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эксперименты in vitro подтвердили активность рибозимов HHRz и наличие симметричного механизма репликации для РНК типа βvdl786.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"identifikaciya-odinnadcati-novyh-rnk,-podobnyh-betaviroidam,-v-obshedostupnyh-bazah-dannyh\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#identifikaciya-odinnadcati-novyh-rnk,-podobnyh-betaviroidam,-v-obshedostupnyh-bazah-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Идентификация одиннадцати новых РНК, подобных бетавироидам, в общедоступных базах данных&lt;/span&gt;&lt;/a&gt;Идентификация одиннадцати новых РНК, подобных бетавироидам, в общедоступных базах данных&lt;/h4&gt;\n&lt;p&gt;Для изучения глобального распространения этих РНК был проведен скрининг открытых данных. Было обнаружено 11 дополнительных потенциальных vdlРНК длиной от 286 до 685 нт, обладающих структурными и кодирующими признаками, схожими с бетавироидами (Таблица 2). Все последовательности получены из природных образцов: водно-болотных угодий, стоячих вод, растительного опада и почв бореальных лесов. Положение стоп-кодона во втором мономере варьируется: в ряде случаев он находится в начале второго мономера, в других — удален на расстояние до 260 нт (Таблица 2).&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 2.&lt;/strong&gt; Список предполагаемых бетавироид-подобных РНК, выявленных в метатранскриптомных наборах данных.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;ID&lt;/th&gt;\n&lt;th&gt;Contig&lt;/th&gt;\n&lt;th&gt;Размер генома (нт)&lt;/th&gt;\n&lt;th&gt;Предполагаемый белок 1 (аа)&lt;/th&gt;\n&lt;th&gt;Конец ORF A / положение во 2-м момере (нт)&lt;/th&gt;\n&lt;th&gt;Предполагаемый белок 2 (аа)&lt;/th&gt;\n&lt;th&gt;Конец ORF B / положение во 2-м момере (нт)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;/table&gt;\n&lt;p&gt;Анализ BLASTn не выявил значимого сходства новых циклических vdlРНК с известными последовательностями. Нуклеотидная идентичность между ними варьируется от 33,33% до 77,09% (Рис. SN4A), а идентичность аминокислотных последовательностей предсказанных белков достигает 59,55% (Рис. SN4B). Согласно прогнозам RNAfold, все новые РНК образуют палочковидные вторичные структуры, иногда с небольшими разветвлениями (Рис. 7).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-f7.jpg\" alt=\"Рис. 7. Круговая диаграмма предсказанных вторичных структур бетавироидоподобных РНК, выявленных в метатранскриптомных на\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 7. Круговая диаграмма предсказанных вторичных структур бетавироидоподобных РНК, выявленных в метатранскриптомных наборах данных. Указаны относительные положения ORF A и B (синий и зеленый), старт- (треугольники) и стоп-кодонов (красные квадраты), а также предсказанных рибозимов «голова молотка» (фиолетовый и оранжевый) в обеих цепях полярности.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BLASTn — алгоритм для поиска локального сходства последовательностей, позволяющий сравнить искомую нуклеотидную последовательность с базой данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ INFERNAL выявил наличие амбисенс-мотивов HHRz III типа во всех образцах (Рис. 8). Три РНК (βvdl34831, βvdl37279, βvdl725174) имеют ту же мутацию в каталитическом ядре (CCGA вместо CUGA), что и βvdl786. У ряда РНК (например, βvdl41196, βvdl34283) старт- и стоп-кодоны открытых рамок считывания (ORF) перекрываются с мотивами рибозимов. У трех vdlРНК (βvdl34283, βvdl40399, βvdl590361) рибозимы отличаются наличием длинного стебля I (42–55 нт). Предсказанные белки демонстрируют вариабельную укладку с низкими показателями достоверности моделирования (pTM &amp;lt; 0,5) по данным AlphaFold 3.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-f8.jpg\" alt=\"Рис. 8. Вторичная структура (+) и (-) рибозимов «голова молотка» бетавироидоподобных РНК, выявленных в метатранскриптомн\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 8. Вторичная структура (+) и (-) рибозимов «голова молотка» бетавироидоподобных РНК, выявленных в метатранскриптомных наборах данных. Сайт расщепления отмечен стрелкой, а консервативные нуклеотиды внутри каталитического ядра выделены черным фоном.&lt;/em&gt;&lt;/p&gt;\n&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;h4 id=\"obshie-harakteristiki-i-otkrytie-novyh-viroid-podobnyh-rnk\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#obshie-harakteristiki-i-otkrytie-novyh-viroid-podobnyh-rnk\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общие характеристики и открытие новых вироид-подобных РНК&lt;/span&gt;&lt;/a&gt;Общие характеристики и открытие новых вироид-подобных РНК&lt;/h4&gt;\n&lt;p&gt;В настоящей работе впервые охарактеризован дзета-вирус, обнаруженный в образцах почвы, с подтверждением его существования экспериментальным путем. Исследование подтвердило наличие циркулярных РНК-форм в положительной (+) и отрицательной (-) полярности, отсутствие ДНК-предшественника, а также способность к саморасщеплению с помощью рибозимов типа «молот» (hammerhead ribozymes) в обеих цепях полярности, что указывает на репликацию по симметричному механизму катящегося кольца. Помимо этого, авторы выделили и описали новую группу вироид-подобных РНК (vdlRNAs) — бетавироид-подобные РНК, которые содержат рибозимы типа «молот» и рамки считывания (ORF), незначительно превышающие длину полноразмерного циркулярного генома (по одной в каждой цепи полярности).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В исследовании экспериментально доказано существование почвенных дзета-вирусов и открыта новая группа бетавироид-подобных РНК, реплицирующихся через механизм катящегося кольца.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Термин «бетавироид-подобные РНК» введен для подчеркивания их сходства с вироидами и отличия от классических вирусов, поскольку в их составе не было обнаружено генов РНК-зависимой РНК-полимеразы. Для двух представителей этой группы была экспериментально подтверждена замкнутость в кольцо, отсутствие ДНК-формы и каталитическая активность рибозимов типа «молот». Несмотря на общие черты с дзета-вирусами, бетавироид-подобные РНК обладают уникальной геномной архитектурой: длина их генома никогда не кратна трем. Эта особенность согласуется со сдвигом рамки считывания, происходящим после завершения трансляции мономерного (линейного или циркулярного) генома, что приводит к закономерному появлению стоп-кодона. Для сравнения, геномы дзета-вирусов имеют длину, кратную трем, что делает возможным трансляцию потенциально бесконечных белков.&lt;/p&gt;\n&lt;h4 id=\"rasprostranenie,-raznoobrazie-i-vozmozhnye-mehanizmy-translyacii\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#rasprostranenie,-raznoobrazie-i-vozmozhnye-mehanizmy-translyacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Распространение, разнообразие и возможные механизмы трансляции&lt;/span&gt;&lt;/a&gt;Распространение, разнообразие и возможные механизмы трансляции&lt;/h4&gt;\n&lt;p&gt;Поскольку и дзета-вирусы, и бетавироид-подобные РНК были найдены в экологических образцах из почвы, их организмы-хозяева на данный момент остаются неизвестными. Тем не менее, обнаружение еще двенадцати потенциальных бетавироид-подобных РНК в общедоступных метатранскриптомных базах данных подтверждает широкое распространение элементов этого класса vdlRNA. Кроме того, идентификация дзета-вирусов, несущих рибозимы отличные от стандартных HHRz III типа (включая DVRz, TWRz, HPrP и HHRz II типа), значительно расширяет известное разнообразие рибозимов, связанных с такими РНК-молекулами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Механизм катящегося кольца (rolling-circle replication) — способ непрерывного копирования кольцевых нуклеиновых кислот, при котором ферменты движутся по кругу, создавая длинные цепи-предшественники из повторяющихся юнитов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Необычные свойства рамок считывания (ORF), кодируемых этими vdlRNA в составе как дзета-вирусов, так и бетавироид-подобных РНК, ставят перед исследователями важные вопросы о механизмах их трансляции. Одной из вероятных моделей является трансляция напрямую с циркулярной РНК посредством циклического процесса, известного как трансляция по механизму катящегося кольца (rolling-circle translation). Подобный путь ранее был продемонстрирован как на синтезированных in vitro кольцевых РНК в бактериальных [19] и эукариотических клетках [20], так и для эндогенных кольцевых РНК, например, человеческого циркулярного EGFR, содержащего бесконечную ORF. Трансляция последнего через катящееся кольцо и запрограммированный сдвиг рибосомального рамки на -1 нуклеотид приводила к синтезу полимерного белкового комплекса [21]. Для циркулярных РНК также обсуждаются альтернативные способы инициации синтеза белка, включая внутренние сайты посадки рибосом (IRES), элементы с N⁶-метиладенозином (m⁶A), A-to-I редактирование РНК, инициацию при участии комплекса экзонных стыков (EJC), рибосомальный шунтинг и трансляцию без участия стартового кодона AUG (RAN-трансляция) [22].&lt;/p&gt;\n&lt;p&gt;Тем не менее, отсутствие выраженных консервативных канонических сигналов инициации трансляции не исключает синтез белка с кольцевых матриц, поскольку кольцевые РНК способны поддерживать образование протеинов даже в отсутствие IRES, 5'-кэпа или поли(A)-хвоста [20]. Альтернативным сценарием может быть трансляция с линейных мультимерных РНК, которые потенциально выступают в роли промежуточных продуктов репликации vdlRNA. Если инициация на кольцевых матрицах сопряжена с трудностями привлечения рибосом, то в модели с линейной матрицей ключевую роль в запуске трансляции могут играть именно рибозимы, как это недавно предполагалось для некоторых вирусных систем [23].&lt;/p&gt;\n&lt;h4 id=\"kodiruyushij-potencial-i-unikalnaya-organizaciya-genoma-dzeta-virusov-i-betaviroidopodobnyh-rnk\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#kodiruyushij-potencial-i-unikalnaya-organizaciya-genoma-dzeta-virusov-i-betaviroidopodobnyh-rnk\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кодирующий потенциал и уникальная организация генома дзета-вирусов и бетавироидоподобных РНК&lt;/span&gt;&lt;/a&gt;Кодирующий потенциал и уникальная организация генома дзета-вирусов и бетавироидоподобных РНК&lt;/h4&gt;\n&lt;p&gt;Обнаружение открытых рамки считывания в дзета-вирусах и бетавироидоподобных РНК существенно расширяет наши представления о разнообразии вироидоподобных агентов. Подобно вирусу гепатита дельта и агентам семейства Kolmioviridae, амбивирусам и обелискам, эти новые агенты сочетают способность кодировать белки с ключевыми признаками вироидов, включая замкнутые кольцевые геномы, способность к саморасщеплению рибозимов и репликацию по механизму катящегося кольца. Способность к трансляции ранее была известна также для вирусоида желтой крапчатости риса, который до сих пор считался уникальным примером среди вироидов и сателлитных РНК. Если представители семейства Kolmioviridae, обелиски и этот вирусоид кодируют белки на одной цепи, то амбивирусы используют обе полярности, причем на одной цепи закодирована предполагаемая РНК-зависимая РНК-полимераза, а на другой — белок неизвестной функции.&lt;/p&gt;\n&lt;p&gt;Интересно, что дзета-вирусы и бетавироидоподобные РНК также обладают такой амбисенсной кодирующей способностью, однако организация их кодирующих последовательностей принципиально иная. У амбивирусов два консервативных белка расположены на неперекрывающихся участках противоположных цепей. Напротив, рамки считывания дзета-вирусов и бетавироидоподобных РНК охватывают весь геном в обеих полярностях, представляя собой экстремальную форму перекрывания генов, которая ранее не встречалась у реплицирующихся РНК или вирусов. Такая организация генома представляет собой предельный уровень сжатия информации, когда одна и та же нуклеотидная последовательность одновременно участвует в кодировании белков на обеих цепях и формирует важнейшие структурно-функциональные элементы РНК, обеспечивающие репликацию и, возможно, трансляцию.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Экстремальное перекрывание рамок считывания — это уникальная организация генома, когда одна нуклеотидная последовательность на обеих цепях РНК одновременно кодирует разные белки и выполняет структурные функции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;У РНК-вирусов перекрывающиеся последовательности делают геном чрезвычайно чувствительным к мутациям, поскольку каждая замена затрагивает сразу несколько кодирующих регионов. Подобная архитектура обычно связана с повышенной устойчивостью к мутациям для компенсации высоких темпов их возникновения. Следовательно, организация дзета-вирусов и бетавироидоподобных РНК предполагает крайнюю степень мутационной устойчивости, необходимую для выживания, так как вредные мутации могут одновременно нарушить и жизненно важные структуры РНК, и кодирующие функции. Это полностью согласуется с крайне низкой генетической вариабельностью, выявленной для этих агентов в настоящей работе. Столь необычная геномная организация ставит новые вопросы об их происхождении и эволюционных стратегиях, подчеркивая удивительную пластичность вироидоподобных РНК.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дзета-вирусы и бетавироидоподобные РНК демонстрируют беспрецедентное сжатие генома и амбисенсное перекрывание рамок считывания по всей длине молекулы при минимальной генетической вариабельности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В целом, полученные результаты значительно расширяют круг известных белок-кодирующих вироидоподобных РНК и подчеркивают уникальное уплотнение генетической информации у дзета-вирусов и бетавироидоподобных РНК, открывая новые горизонты для понимания их эволюции и биологической роли.&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"ekstrakciya-rnk-i-dnk,-bioinformaticheskij-analiz\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#ekstrakciya-rnk-i-dnk,-bioinformaticheskij-analiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Экстракция РНК и ДНК, биоинформатический анализ&lt;/span&gt;&lt;/a&gt;Экстракция РНК и ДНК, биоинформатический анализ&lt;/h4&gt;\n&lt;p&gt;Для исследования использовали образцы почвы, собранные в 2019 году на каштановой плантации (Castanea sativa) в Сан-Годенцо (Тоскана, Италия). Каждый образец представлял собой смесь из пяти кернов верхнего слоя почвы объемом 200 см³, взятых на расстоянии не менее двух метров друг от друга. Общую РНК выделяли из шести образцов с помощью набора RNeasy PowerSoil Total RNA (QIAGEN). Подготовленные библиотеки (C30, CD50, CD95, CD99, C105, C110) секвенировали на платформе Illumina NovaSeq 6000 (2x150 п.н.) в компании Novogene с использованием протокола Illumina TruSeq Stranded Total RNA и удалением рибосомальной РНК (RiboZero Plant). ДНК из тех же образцов выделяли набором FastDNA™ SPIN Kit for Soil (MP Biomedicals).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Секвенирование РНК (RNA-seq) позволяет получить «срез» всех транскриптов в образце, что дает возможность идентифицировать не только известные, но и ранее не описанные вирусные последовательности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Первичные данные проходили контроль качества в FASTX-Toolkit и предобработку в cutadapt: удалялись адаптеры, низкокачественные (Phred Q&amp;lt;20) и короткие (L&amp;lt;50 п.н.) прочтения, а также неопределенные нуклеотиды. Сборку проводили в SPAdes (v3.13.0) с использованием стратегии multi k-mer (от 51 до 121 п.н. с шагом 10). Функциональную аннотацию контигов выполняли через BLASTx против базы NCBI (версия от 4 августа 2023 г.) с помощью DIAMOND (v2.1.7).&lt;/p&gt;\n&lt;p&gt;Для поиска рибозимов использовали алгоритм INFERNAL (v1.1.2) с ковариационными моделями из базы RFAM (v14). Отбирались последовательности с парными рибозимами, кольцевой топологией (определяемой по перекрытию 5'- и 3'-концов) и отсутствием аннотации в BLAST. Вариабельность последовательностей оценивали путем картирования прочтений на референсный контиг vdlRNA в Geneious Prime (v2026.0). Поиск вариантов (variant calling) проводили при пороге покрытия от 50 прочтений, частоте варианта от 0,3%, p-значении варианта 1 × 10⁻⁴ и p-значении смещения цепи 0,01.&lt;/p&gt;\n&lt;p&gt;Сходство нуклеотидных и аминокислотных последовательностей анализировали через Clustal Omega (EMBL-EBI), а тепловые карты строили в RStudio (пакет ggplot2). Поиск дополнительных последовательностей в публичных метатранскриптомах проводили, используя данные Forgia et al. как шаблоны. Кольцевые мономеры короче 2000 п.н. подвергали компьютерной димеризации, после чего транслировали и отбирали последовательности с открытыми рамками считывания (ORF), превышающими длину мономера. Вторичные структуры РНК предсказывали в RNAfold (ViennaRNA 2.6.3), а визуализацию проводили в Jupyter Notebook (Python 3, библиотеки NumPy, plotly, matplotlib). Третичную структуру белков предсказывали с помощью AlphaFold 3; для «бесконечных» ORF выбор стартового кодона осуществлялся на основе максимального значения pTM (predicted template modelling score).&lt;/p&gt;\n&lt;h4 id=\"rt-pcr-i-klonirovanie\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#rt-pcr-i-klonirovanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RT-PCR и клонирование&lt;/span&gt;&lt;/a&gt;RT-PCR и клонирование&lt;/h4&gt;\n&lt;p&gt;Для получения кДНК суммарные нуклеиновые кислоты подвергали обратной транскрипции с использованием случайных гексамеров и обратной транскриптазы Superscript IV. Два микролитра полученной смеси кДНК использовали в качестве матрицы для ПЦР-амплификации, добавляя 0.25 единицы ДНК-полимеразы GoTaq в общий объем реакционной смеси 25 мкл, содержащий 1X буфер Green GoTaq, 0.2 мМ нуклеотидов (dNTP) и по 0.2 мкм каждого специфического праймера (Таблица S1). Термоциклирование включало начальную денатурацию при 94 °C в течение 3 минут, затем 32 цикла: денатурация при 94 °C по 30 секунд, отжиг при 57 °C по 30 секунд и элонгация при 72 °C (время в секундах указано в оригинале как пропущенное в источнике), с финальным достраиванием при 72 °C в течение 5 минут. Продукты нужного размера вырезали из агарозного геля, очищали, клонировали в вектор pGEM-T Easy и секвенировали по Сэнгеру.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ПЦР (полимеразная цепная реакция) и секвенирование по Сэнгеру — классические методы многократного копирования и точного определения последовательности ДНК, позволяющие подтвердить правильность сборки генома.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Количественную оценку каждой полярной цепи vdlRNA проводили с помощью специфичной для конкретной нити обратной транскрипции с последующей полуколичественной ПЦР. Реакцию обратной транскрипции запускали с индивидуальным праймером для каждой цепи, после чего использовали серийные разведения кДНК (исходный образец без разведения, а также 1:2, 1:10, 1:20 и 1:200) в качестве матриц для ПЦР по описанной выше методике с праймерами из Таблицы S1.&lt;/p&gt;\n&lt;h4 id=\"analiz-samorasshepleniya-rnk\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#analiz-samorasshepleniya-rnk\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ саморасщепления РНК&lt;/span&gt;&lt;/a&gt;Анализ саморасщепления РНК&lt;/h4&gt;\n&lt;p&gt;Мономерные транскрипты обеих полярностей синтезировали методом транскрипции in vitro на основе плазмид pGEM-T Easy, содержащих полные последовательности кДНК vdlRNAs. Рекомбинантные плазмиды предварительно линеаризовали подходящим рестриктазом, очищали экстракцией фенол-хлороформом с последующим осаждением этанолом и использовали как матрицу для РНК-полимераз T7 или SP6. Полученные продукты анализировали с помощью денатурирующего 5%-го полиакриламидного геля (ПААГ с 8 М мочевиной в 1X TBE буфере, содержащем 89 мМ триса, 89 мМ борной кислоты и 2.5 мМ EDTA, pH 8.3), окрашенного бромистым этидием, и визуализировали в УФ-свете.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Электрофорез в денатурирующем ПААГ разделяет молекулы РНК по их длине в условиях разрушения вторичных структур, позволяя точно фиксировать продукты спонтанного расщепления молекулы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Продукты 3'-саморасщепления, образовавшиеся прямо в ходе транскрипции in vitro, выделяли из гелей, а структуру их 5'-конца определяли с помощью метода 5'-RACE (быстрое амплифицирование концов кДНК). Фрагменты РНК извлекали из ПААГ, очищали фенол-хлороформной экстракцией и осаждением этанолом, после чего проводили обратную транскрипцию со специфическими праймерами (Таблица S1). К полученным цепям кДНК с помощью концевой дезоксинуклеотидилтрансферазы добавляли поли(G)-хвост, после чего проводили ПЦР с использованием ДНК-полимеразы GoTaq, праймера polyC RACE и вложенного (nested) специфического праймера, комплементарного участку ближе к концу матричной последовательности (Таблица S1). Ампликоны очищали на геле, клонировали и секвенировали по Сэнгеру.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-fS4.jpg\" alt=\"Рис. S4. Идентичность нуклеотидных и аминокислотных последовательностей бетавироидоподобных РНК. (A) Тепловая карта, пре\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S4. Идентичность нуклеотидных и аминокислотных последовательностей бетавироидоподобных РНК. (A) Тепловая карта, представляющая матрицу процентов идентичности всех идентифицированных нуклеотидных последовательностей бетавироидоподобных РНК. (B) Тепловая карта, представляющая матрицу процентов идентичности аминокислотных последовательностей предполагаемых белков (ORF A и ORF B), кодируемых пятнадцатью бетавироидоподобными РНК.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-fS5.jpg\" alt=\"Рис. S5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S5&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-fS6.jpg\" alt=\"Рис. S6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S6&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Существование&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;кодирующих РНК&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;было лишь на&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;компью&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Эксперименталь&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ный анализ&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;образцов из&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;почвы и дан&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Нашли 3 дзета-&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;вируса и&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;открыли бетави&lt;/text&gt;&lt;text x=\"426\" y=\"142\" f
