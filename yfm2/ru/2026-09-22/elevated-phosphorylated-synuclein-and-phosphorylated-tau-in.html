        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"210\" cy=\"141\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"670\" cy=\"250\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Грипп оставляет след в&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;мозге: как мутация LRRK2&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;запускает белковые сдвиги&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in-f1.jpg\" alt=\"Рисунок 1. Аллели Lrrk2G2019S не влияют на выживаемость, изменение массы тела или вирусные титры в легких мышей, инфицир\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Аллели Lrrk2G2019S не влияют на выживаемость, изменение массы тела или вирусные титры в легких мышей, инфицированных интраназально вирусом гриппа A (H1N1). Экспериментальный график, использованный в данном исследовании (A). Взрослым мышам (самцам и самочкам в возрасте 5–7 недель) интраназально вводили 2 × бляшкообразующие единицы (БОЕ) вируса гриппа А (серотип H1N1). Выживаемость представлена в виде процента выживших животных в зависимости от дней после инокуляции (p.i.) (B, E), а масса тела показана как процент от исходной массы тела в зависимости от дней p.i. (C, F). Данные приведены отдельно для самок (B-D) и самцов (E-G). Вирусные титры измерялись в легких на 3-й день p.i (D, G). Каждый символ обозначает одно животное. Погрешности отражают среднее ± стандартная ошибка среднего (SEM). WT = дикий тип; GS = мутантный аллель Lrrk2G2019S. Использованные статистические тесты: лог-ранговый тест (Мантела-Кокса) для кривых выживаемости; однофакторный дисперсионный анализ (ANOVA) для анализа вирусных титров.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Почему у одних людей с генетической предрасположенностью к болезни Паркинсона симптомы проявляются, а у других нет? Исследователи предположили, что в роли спускового крючка выступают внешние факторы вроде инфекций. Эксперимент на мышах показал, что перенесенный грипп на фоне мутации в гене LRRK2 приводит к накоплению измененных белков в тканях мозга. Это открытие помогает понять механизм избирательного развития нейродегенеративных заболеваний.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Мутации LRRK2 не меняют тяжесть острого гриппа у мышей&lt;/li&gt;\n&lt;li&gt;Спустя шесть недель после гриппа в мозге растет уровень pSer129 альфа-синуклеина&lt;/li&gt;\n&lt;li&gt;Инфекция усиливает окислительный стресс и модификацию белков в мозге мутантных животных&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Мутации в гене LRRK2 связаны с повышенным риском развития болезни Паркинсона, однако заболевание развивается далеко не у всех носителей. Ранее ученые предполагали, что для манифестации патологии необходим дополнительный внешний стимул, например вирусная инфекция. Команда исследователей проверила эту гипотезу, заразив мышей с нок-ин мутациями LRRK2 (включая вариант p.G2019S с повышенной активностью киназы) вирусом гриппа А серотипа H1N1.&lt;/p&gt;\n&lt;p&gt;Хотя острая фаза инфекции и выживаемость животных с мутациями не отличались от дикого типа, анализ спустя шесть недель выявил тревожные изменения. В головном мозге выживших мышей с гомозиготной мутацией LRRK2 p.G2019S зафиксирован рост уровней фосфорилированного альфа-синуклеина (pSer129) и тау-белка (pSer199), а также увеличение их соотношения к общему числу этих белков. Дополнительно исследователи обнаружили признаки повышенного окислительного стресса и нитротиронилирования протеома мозга.&lt;/p&gt;\n&lt;p&gt;Полученные данные демонстрируют, что перенесенная респираторная вирусная инфекция способна модулировать протеом мозга у генетически уязвимых особей. Это указывает на возможную роль периферических инфекций в запуске молекулярных каскадов, ведущих к синуклеопатиям и тауопатиям при болезни Паркинсона.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа выполнена на мышиной модели с одной конкретной вирусной нагрузкой и требует подтверждения на человеческих тканях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Повышенный уровень фосфорилированного α-синуклеина и фосфорилированного тау-белка у мышей с мутацией Lrrk2 p.G2019S после пневмонита, вызванного вирусом гриппа А&lt;/p&gt;\n&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Введение: Воздействие вируса гриппа повышает частоту развития паркинсонизма. Ранее мы и другие исследователи обнаружили, что аллельные варианты в локусе LRRK2, связанном с болезнью Паркинсона, модулируют реакцию хозяина на вирулентные микробы.&lt;/p&gt;\n&lt;p&gt;Цель: Мы задались вопросом, изменяют ли мутации Lrrk2 исходы заболевания у взрослых животных после перенесенной назальной инфекции легких.&lt;/p&gt;\n&lt;p&gt;Методы: Мы инокулировали мышей линии C57BL/6J с мутантными генотипами knock-in Lrrk2 вирусом гриппа А серотипа H1N1 (1 × LD50 = 2000 бляшкообразующих единиц).&lt;/p&gt;\n&lt;p&gt;Заключение: Гомозиготные по мутации Lrrk2G2019S мыши, пережившие инфекцию, вызванную жизнеугрожающим пневмотропным РНК-вирусом, демонстрируют изменения уровней окислительного стресса, pSer199 тау-белка и pSer129 α-синуклеина в головном мозге. Эти результаты могут иметь значение для инициации изменений, связанных с нейродегенерацией у людей, и помочь объяснить различия в частоте пенетрантности и экспрессивности мутантов LRRK2.&lt;/p&gt;\n&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Болезнь Паркинсона (БП), сложное нейродегенеративное заболевание, характеризуется растущей распространенностью, однако этиология этого расстройства остается неясной. Считается, что БП вызывается сложным взаимодействием между генетической предрасположенностью, факторами окружающей среды и старением. Было выявлено несколько факторов риска окружающей среды, включая не-нейротропные вирусные инфекции. Например, пандемия гриппа, вызванная вариантом серотипа H1N1 вируса гриппа А, была связана с последующим возникновением энцефалита Экономо, включая форму, связанную с постинфекционным паркинсонизмом. В более поздних исследованиях положительный анамнез воздействия гриппа (до пятнадцати лет назад) был связан с ростом заболеваемости БП. У мышей инфекция после назальной инокуляции высокопатогенным серотипом H5N1 вируса птичьего гриппа (нейротропный вирус) приводила к фосфорилированию и агрегации α-синуклеина, а также к потере дофаминергических клеток в головном мозге мышей дикого типа. Кроме того, было показано, что H1N1 повышает уровни α-синуклеина ex vivo, что купировалось предварительной обработкой противогриппозным препаратом. Помимо факторов риска окружающей среды, было идентифицировано более 90 локусов, варианты в которых связаны с измененным риском БП, включая мутации в гене LRRK2, на долю которых приходится ~2% случаев паркинсонизма, наблюдаемых в специализированных клиниках. Мутации в этом гене обусловливают риск как семейных, так и спорадических форм БП, хотя механизмы остаются неясными. Примечательно, что с мутациями LRRK2, включая наиболее распространенный вариант p.G2019S, связана неполная пенетрантность. Это навело нас на мысль, что проявление заболевания у носителей мутаций LRRK2 может потребовать второго триггера, генетического или средового; мы и другие исследователи предположили, что последний фактор может иметь микробную природу. Важно отметить, что мутации в локусе LRRK2 также были связаны с болезнью Крона, проказой и системной красной волчанкой. Каждое из этих заболеваний характеризуется хронически нарушенной регуляцией воспаления. Общий локус риска для четырех различных заболеваний поднимает вопрос о том, включает ли эволюционно сохраненная функция LRRK2 регуляцию иммунных ответов. LRRK2 экспрессируется на более высоких уровнях на периферии (например, в костном мозге, легких), чем в головном мозге, и более представлен в клетках иммунной системы (нейтрофилах, моноцитах и макрофагах), чем в нейронах. Кроме того, белок может активироваться инфекционными патогенами и медиаторами воспаления (например, IFN-γ и NF-κB), что позволяет предположить участие LRRK2 в защите от патогенов и ответах иммунной системы. Ряд исследований продемонстрировал влияние Lrrk2 на бактериальную патогенность в зависимости от микробов. Ранее мы также исследовали роль Lrrk2 в ответе на вирусные инфекции; в частности, мы показали, что исходы заболевания после назальной инокуляции реовирусом [изотип type-3 Dearing (T3D)] у мышат зависели от аллельных вариантов Lrrk2 в зависимости от пола. Здесь мы проверили, могут ли аллельные варианты Lrrk2 изменить течение потенциально летальной легочной инфекции у взрослых мышей C57BL/6J и выявить какую-либо патологию мозга после воздействия пневмотропного РНК-вируса. Мы предположили, что киназно-гиперактивный вариант Lrrk2 может снизить репликацию вируса в легких и изменить показатели выживаемости у взрослых животных. Кроме того, мы предположили, что эта инфекция может привести к изменениям нейрохимических маркеров у выживших животных. Чтобы проверить это, мы использовали адаптированный к мышам вирус гриппа А, серотип H1N1 (A/Fort Monmouth/1/1947), для индукции пневмонита у мышей дикого типа и мышей с нок-ин мутациями Lrrk2. Мы обнаружили, что ни мутант Lrrk2 p.G2019S, ни p.D1994S не изменили острые исходы заболевания. Однако выживание после инфекции гриппом H1N1 привело к повышенным уровням окислительного стресса и изменениям в метаболизме α-синуклеина и тау-белка в головном мозге гомозиготных животных Lrrk2 p.G2019S по сравнению с их однопометниками.&lt;/p&gt;\n&lt;h4 id=\"metody-kolonii-myshej\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#metody-kolonii-myshej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;МЕТОДЫ: Колонии мышей&lt;/span&gt;&lt;/a&gt;МЕТОДЫ: Колонии мышей&lt;/h4&gt;\n&lt;p&gt;Все мышиные колонии содержались на фоне C57BL/6J с использованием гетерозиготных пар для разведения. Эксперименты на животных проводились в соответствии с рекомендациями Канадского совета по уходу за животными и были одобрены Комитетом по этике содержания животных Оттавского университета. Эксперименты с вирусными инфекциями проводились в виварии биологической опасности уровня изоляции 2. Мыши с нок-ин мутациями Lrrk2 p.G2019S (MGI:5295368) и Lrrk2 p.D1994S (MGI:5295371) были любезно предоставлены доктором Дерья Шимшек, как описано ранее. В данном исследовании использовались как самки, так и самцы мышей, как указано.&lt;/p&gt;\n&lt;h4 id=\"nazalnoe-zarazhenie-myshinym-adaptivnym-virusom-grippa-a-h1n1\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#nazalnoe-zarazhenie-myshinym-adaptivnym-virusom-grippa-a-h1n1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Назальное заражение мышиным адаптивным вирусом гриппа A H1N1&lt;/span&gt;&lt;/a&gt;Назальное заражение мышиным адаптивным вирусом гриппа A H1N1&lt;/h4&gt;\n&lt;p&gt;Получение мышино-адаптированного варианта вируса гриппа A H1N1 [A/Fort Monmouth/1/1947 ('FM-MA')] было описано ранее. Взрослые мыши в возрасте 5–7 недель были анестезированы 3% изофлураном в O₂ при скорости 1 л/мин в течение 1 минуты. Доза 2× 10³ бляшкообразующих единиц (БОЕ) FM-MA H1N1 (приготовленная в 50 мкл фосфатно-солевого буфера (PBS)) вводилась в носовые ходы, вызывая тяжелый пневмонит с летальностью примерно 50% (1 LD₅₀). За мышами наблюдали в течение 14 дней после инокуляции (dpi) и взвешивали дважды в день с 4 по 14 dpi. Критерии конечной точки для проведения эвтаназии включали морибундное состояние, затрудненное дыхание или потерю массы тела ≥ 30%. Мыши, пережившие острую вирусную инфекцию (что подтверждалось выживаемостью на 14 dpi), содержались в течение еще 4 недель до общего срока 6 недель после инокуляции (wpi) (Рис. 1a). Параллельно с мышами, подвергшимися воздействию H1N1, животным контрольной группы (mock-inoculated) вводили 50 мкл PBS без вируса.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in-f1.jpg\" alt=\"Рисунок 1. Аллели Lrrk2G2019S не влияют на выживаемость, изменение массы тела или вирусные титры в легких мышей, инфицир\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Аллели Lrrk2G2019S не влияют на выживаемость, изменение массы тела или вирусные титры в легких мышей, инфицированных интраназально вирусом гриппа A (H1N1). Экспериментальный график, использованный в данном исследовании (A). Взрослым мышам (самцам и самочкам в возрасте 5–7 недель) интраназально вводили 2 × бляшкообразующие единицы (БОЕ) вируса гриппа А (серотип H1N1). Выживаемость представлена в виде процента выживших животных в зависимости от дней после инокуляции (p.i.) (B, E), а масса тела показана как процент от исходной массы тела в зависимости от дней p.i. (C, F). Данные приведены отдельно для самок (B-D) и самцов (E-G). Вирусные титры измерялись в легких на 3-й день p.i (D, G). Каждый символ обозначает одно животное. Погрешности отражают среднее ± стандартная ошибка среднего (SEM). WT = дикий тип; GS = мутантный аллель Lrrk2G2019S. Использованные статистические тесты: лог-ранговый тест (Мантела-Кокса) для кривых выживаемости; однофакторный дисперсионный анализ (ANOVA) для анализа вирусных титров.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"analiz-blyashkoobrazovaniya-dlya-serotipa-h1n1-virusa-grippa\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#analiz-blyashkoobrazovaniya-dlya-serotipa-h1n1-virusa-grippa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ бляшкообразования для серотипа H1N1 вируса гриппа&lt;/span&gt;&lt;/a&gt;Анализ бляшкообразования для серотипа H1N1 вируса гриппа&lt;/h4&gt;\n&lt;p&gt;Мыши, интраназально зараженные 2× 10³ БОЕ H1N1, были забиты на 3 dpi. Легкие были быстро заморожены, а затем лизированы в PBS (3:1, v:w) с использованием металлических бусин в приборе Magna Lyser (Roche) на максимальной скорости в течение 10 секунд с последующим однократным циклом замораживания-оттаивания. Клетки MDCK выращивали в 6-луночных планшетах до 90% конфлюэнтности. Гомогенаты легких центрифугировали (5000 об/мин), а супернатанты серийно разводили (в 10 раз) в среде DMEM без сыворотки. Монослои MDCK дважды промывали PBS, покрывали 100 мкл каждого разведения и инкубировали при 37 °C и 5% CO₂ в течение 30 минут с покачиванием каждые 15 минут. Через один час клетки покрывали 3 мл смеси 1:1 1,2% агарозы и 2xDMEM, содержащей 0,1 мкг/мл TPCK-трипсина, и инкубировали в течение 3 дней. Клетки фиксировали в смеси метанол:уксусная кислота (3:1) в течение одного часа. Покрывной слой удаляли под водопроводной водой и окрашивали синим Кумасси в течение 30 минут. Бляшки подсчитывали визуально. Вирусные титры выражаются в БОЕ на грамм ткани.&lt;/p&gt;\n&lt;h4 id=\"ekstrakciya-belka\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#ekstrakciya-belka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Экстракция белка&lt;/span&gt;&lt;/a&gt;Экстракция белка&lt;/h4&gt;\n&lt;p&gt;Белок экстрагировали путем гомогенизации тканей, как описано выше для анализа вирусных титров. Аликвоты готовили в 1% Triton-X 100 и 2x протеазе с ингибиторами фосфатазы (Thermo Scientific) и центрифугировали при 14 800 об/мин в течение 30 минут при 4 °C. Концентрации белка определяли с помощью набора для анализа с бицинхониновой кислотой (BCA) (Thermo Fisher Scientific, 23227) в соответствии с процедурой для микропланшетов.&lt;/p&gt;\n&lt;h4 id=\"kolichestvennoe-opredelenie-a-sinukleina-i-tau-belka-s-pomoshyu-ifa-elisa\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#kolichestvennoe-opredelenie-a-sinukleina-i-tau-belka-s-pomoshyu-ifa-elisa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Количественное определение α-синуклеина и тау-белка с помощью ИФА (ELISA)&lt;/span&gt;&lt;/a&gt;Количественное определение α-синуклеина и тау-белка с помощью ИФА (ELISA)&lt;/h4&gt;\n&lt;p&gt;В лизатах измеряли общий уровень α-синуклеина с использованием сэндвич-ИФА, как описано ранее. Концентрации белка α-синуклеина нормировали на общую концентрацию белка в каждом образце. Общий мышиный тау-белок измеряли с помощью набора Tau (Total) Mouse ELISA Kit (KMB7011, Invitrogen). Содержание фосфорилированного тау мыши (фосфо-серин 199) измеряли с помощью набора Mouse Tau (Phospho) [Ser199] ELISA Kit (KMB7041, Invitrogen).&lt;/p&gt;\n&lt;h4 id=\"vestern-blotting\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#vestern-blotting\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вестерн-блоттинг&lt;/span&gt;&lt;/a&gt;Вестерн-блоттинг&lt;/h4&gt;\n&lt;p&gt;Белковые образцы (40 мкг на лунку; 75 мкг для анти-нитротирозина) смешивали с 1xNuPAGE™ LDS буфером, кипятили в течение 5 минут при 95 °C и разделяли на 4–12% градиентных SDS-MES гелях в восстанавливающих (невосстанавливающих для анти-нитротирозина) условиях. Белки переносили на PVDF-мембраны путем полусухого переноса в трис-глицин-метанольном буфере. Блоты с антителами к анти-нитротирозину (Cell Signalling, 9691S) визуализировали на рентгеновской пленке, количественно оценивали с помощью ImageJ и нормировали на окрашивание Ponceau S. Блоты с антителами к фосфо-α-синуклеину (Ser129) (Abcam, ab51253), hSA4 (некоммерческое поликлональное антитело, полученное и аффинно-очищенное против рекомбинантного полноразмерного человеческого α-синуклеина, как описано (Mollenhauer et al. 2008)) и Plk2 (Novus Biologicals, NBP3-04961) визуализировали с помощью BioRad ChemiDoc и количественно оценивали с помощью ImageLab. Сигналы фосфорилированного α-синуклеина и общего α-синуклеина нормировали на актин (Santa Cruz, sc-47778) в качестве контроля загрузки (Plk2 нормировали на окрашивание Ponceau S) и дополнительно нормировали на внутренние контроли блота для количественной оценки между блотами.&lt;/p&gt;\n&lt;h4 id=\"kolichestvennoe-opredelenie-aktivnyh-form-kisloroda\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#kolichestvennoe-opredelenie-aktivnyh-form-kisloroda\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Количественное определение активных форм кислорода&lt;/span&gt;&lt;/a&gt;Количественное определение активных форм кислорода&lt;/h4&gt;\n&lt;p&gt;Для количественного определения H2O2 в тканях использовали набор Amplex® Red hydrogen peroxide/peroxidase assay kit (Invitrogen, A22188) для мониторинга эндогенных уровней H2O2. Сагиттально разрезанные полушария мозга лизировали в PBS, как описано выше. Уровни H2O2 в гомогенатах измеряли в соответствии с инструкциями производителя. Полученные значения H2O2 (мкМ) нормализовали по массе ткани (г).&lt;/p&gt;\n&lt;h4 id=\"statisticheskij-analiz\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#statisticheskij-analiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистический анализ&lt;/span&gt;&lt;/a&gt;Статистический анализ&lt;/h4&gt;\n&lt;p&gt;Все статистические анализы проводились с использованием GraphPad Prism версии 11 (GraphPad Software, Сан-Диего, Калифорния, США). Различия между группами в тестах на выживаемость оценивали с помощью лог-рангового критерия (Мантеля-Кокса). Различия между группами оценивали с помощью двухфакторного дисперсионного анализа (ANOVA) с апостериорным тестом Фишера (LSD) без поправки. Данные представлены как среднее ± стандартная ошибка среднего (SEM), где это применимо, и как описано в подписях к рисункам. Данные представлены со значениями P, обозначенными как *P&amp;lt;0,05, **P&amp;lt;0,01, ***P&amp;lt;0,001, ****P&amp;lt;0,0001.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;p&gt;Мыши Lrrk2 p.G2019S демонстрируют тот же курс заболевания, что и мыши дикого типа при H1N1-пневмоните. Сначала мы исследовали роль повышенной киназной активности Lrrk2 в реакциях организма хозяина, используя нейротропный вирус у мышей Lrrk2G2019S и их однопометников дикого типа (Рис. 1). Вирус гриппа А, серотип H1N1 (штамм FM-MA), обладает легочным тропизмом, который может вызвать смертельный пневмонит у мышей при определенных дозах. Примечательно, что Lrrk2 высоко экспрессируется в легких. Взрослым мышам в возрасте 5-7 недель назально вводили ранее установленную дозу LD50 (2x10^3 PFU); животных либо забивали на 3-й день после заражения (dpi) для анализа вирусного титра в легких, либо оценивали их выживаемость, после чего выживших особей выращивали (Рис. 1a). Уровни выживаемости и вес измеряли до 14 dpi у самок (Рис. 1b, c) и самцов (Рис. 1e, f). Самки мышей в целом демонстрировали более высокие показатели смертности, чем самцы, что согласуется с предыдущими отчетами с использованием различных штаммов H1N1 у мышей линии C57BL/6J. Однако мы не выявили никаких различий в выживаемости мышей с нок-ин мутацией Lrrk2 p.G2019S по сравнению с однопометниками дикого типа. Аналогично, не было значимых различий между генотипами (и количеством мутантных аллелей) в начальной потере веса или последующем наборе веса, которые служили суррогатами болезни и выздоровления соответственно. В качестве третьего результата инфекции H1N1 мы измерили вирусные титры в легких на пике инфекции, а именно на 3 dpi, в отдельной когорте. Хотя мы наблюдали тенденцию к снижению титров у самок мышей Lrrk2G2019S-гомозигот (чего мы ожидали на основе наших результатов с реовирусом T3D у детенышей), у соответствующих самцов наблюдалась большая вариабельность титров. В целом, не было рассчитано значимых различий в вирусных титрах на 3 dpi между генотипами (Рис. 1d, g).&lt;/p&gt;\n&lt;h4 id=\"kinaznaya-aktivnost-lrrk2-ne-trebuetsya-dlya-ostroj-zashity-organizma-hozyaina-ot-infekcii-h1n1\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#kinaznaya-aktivnost-lrrk2-ne-trebuetsya-dlya-ostroj-zashity-organizma-hozyaina-ot-infekcii-h1n1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Киназная активность Lrrk2 не требуется для острой защиты организма хозяина от инфекции H1N1&lt;/span&gt;&lt;/a&gt;Киназная активность Lrrk2 не требуется для острой защиты организма хозяина от инфекции H1N1&lt;/h4&gt;\n&lt;p&gt;Поскольку мы не выявили какой-либо модуляции выживаемости, обусловленной гиперактивным киназным мутантом p.G2019S, далее мы исследовали, повлияет ли потеря активности Lrrk2 на исходы заболевания при инфекции H1N1, как мы наблюдали в ответ на реовирус-T3D у новорожденных. Используя тот же подход, что и выше, мы заразили мышей, несущих нок-ин мутацию Lrrk2 с «мертвой» киназой p.D1994S. Мы обнаружили, что как самцы, так и самки гомозиготных и гетерозиготных мышей Lrrk2D1994S демонстрировали тот же уровень выживаемости и изменения веса, что и мыши дикого типа после инфекции H1N1 (Доп. Рис. 1a, b, d, e). Чтобы исследовать это дальше, мы измерили вирусные титры H1N1 в легких этих мышей на 3 dpi и снова не выявили групповых различий между животными дикого типа, гетерозиготными и гомозиготными по Lrrk2 p.D1994S (Доп. Рис. 1c, f). Эти совокупные результаты позволили нам предположить, что сама по себе киназная активность Lrrk2 не оказывает заметного влияния на реакцию взрослых мышей во время острой фазы H1N1-пневмонита.&lt;/p&gt;\n&lt;h4 id=\"vyzhivshie-posle-h1n1-ne-demonstriruyut-priznakov-ekspressii-virusnogo-belka-v-mozge\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#vyzhivshie-posle-h1n1-ne-demonstriruyut-priznakov-ekspressii-virusnogo-belka-v-mozge\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Выжившие после H1N1 не демонстрируют признаков экспрессии вирусного белка в мозге&lt;/span&gt;&lt;/a&gt;Выжившие после H1N1 не демонстрируют признаков экспрессии вирусного белка в мозге&lt;/h4&gt;\n&lt;p&gt;Затем мы исследовали пост-инфекционные последствия воздействия вируса H1N1 на головной мозг выживших мышей и возможные эффекты, потенциально обусловленные кин-ин мутацией Lrrk2G2019S. Гомозиготные мыши, пережившие инфекцию H1N1, сначала содержались в течение четырех дополнительных недель до достижения общего возраста 6 недель после инфицирования (6wpi) (Рис. 1a). Затем мы исследовали гомогенаты головного мозга животных, инфицированных H1N1 и ложноинфицированных, с помощью Вестерн-блоттинга с использованием анти-H1N1 иммунной сыворотки кроликов. Используя инфицированное легкое на 3-й день после инфицирования (3dpi) в качестве положительного контроля, мы не обнаружили каких-либо вирусencoded белков H1N1, а именно нуклеопротеина NP и матриксного белка M1, в головном мозге нашей группы выживших мышей (данные не показаны), что предполагает, что вирус H1N1 не определялся в головном мозге в данных условиях, как и ожидалось.&lt;/p&gt;\n&lt;h4 id=\"fosforilirovannyj-tau-belok-uvelichivaetsya-v-golovnom-mozge-s-mutaciej-lrrk2-pg2019s-posle-infekcii-h1n1\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#fosforilirovannyj-tau-belok-uvelichivaetsya-v-golovnom-mozge-s-mutaciej-lrrk2-pg2019s-posle-infekcii-h1n1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Фосфорилированный тау-белок увеличивается в головном мозге с мутацией Lrrk2 p.G2019S после инфекции H1N1&lt;/span&gt;&lt;/a&gt;Фосфорилированный тау-белок увеличивается в головном мозге с мутацией Lrrk2 p.G2019S после инфекции H1N1&lt;/h4&gt;\n&lt;p&gt;Атопсия головного мозга, ранее проведенная в постинфекционных случаях паркинсонизма у жертв пандемии вируса гриппа A (H1N1), выявила признаки тауопатии. Стоит отметить, что наблюдаемая патология головного мозга в случаях болезни Паркинсона, связанных с LRRK2, варьирует и включает характерные агрегаты α-синуклеина, патологию, связанную с фосфорилированным тау-белком, гибель нейронов без образования включений или смешанные патологии. Поэтому мы сначала измерили количество общего тау-белка, а затем уровень фосфорилированного тау-белка (pSer199 tau) в растворимой фракции общих гомогенатов головного мозга методом ИФА (ELISA) у выживших после инфекции H1N1 мышей по сравнению с ложноинфицированными животными через 6wpi (Рис. 2a-c). При измерении общего тау-белка в этих лизатах мы не обнаружили различий в зависимости от инфекции, мутации (Рис. 2a) или пола (Доп. Рис. 2a, 3a). При количественной оценке pSer199 tau двухфакторный дисперсионный анализ выявил значительное взаимодействие инфекции и генотипа (F(1, 23)=5.418, P=0.0291; Рис. 2b). При этом уровень pSer199 tau был значительно повышен у инфицированных мышей с мутацией Lrrk2 p.G2019S по сравнению с ложноинфицированными мутантными мышами (P=0.0099) — эффект, который отсутствовал у мышей дикого типа. Затем мы рассчитали отношение фосфорилированного тау-белка к общему тау-белку в этих образцах (Рис. 2c) и выявили значительное увеличение у инфицированных животных с мутацией Lrrk2 p.G2019S по сравнению с ложноинфицированными мутантными мышами. У инфицированных H1N1 мутантных мышей также наблюдалось значительно более высокое соотношение по сравнению с инфицированными мышами дикого типа (P&amp;lt;0.05; Рис. 2c). Двухфакторный дисперсионный анализ выявил тенденцию к статистической значимости для последнего соотношения (P=0.0521). Эти данные показали, что концентрации растворимого pSer199 tau были повышены в головном мозге после инфекции H1N1, что было связано с экспрессией гомозиготной кин-ин мутации Lrrk2G2019S. При исследовании тех же гомогенатов на наличие GSK3β, родственной киназы для pSer199 tau (активная и неактивная формы исследовались с помощью Вестерн-блоттинга), результаты не выявили какого-либо эффекта, зависящего от инфекции, пола или мутации (данные не показаны). На сегодняшний день мы еще не исследовали другие тау-киназы.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in-f2.jpg\" alt=\"Рисунок 2. Экспрессия Lrrk2 p.G2019S изменяет метаболизм тау-белка и α-синуклеина, а также уровень окислительного стресс\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2. Экспрессия Lrrk2 p.G2019S изменяет метаболизм тау-белка и α-синуклеина, а также уровень окислительного стресса в головном мозге мышей после гриппозной пневмонии H1N1. Взрослые ложноинфицированные (H1N1 -) и инфицированные H1N1 (H1N1 +) мыши (самцы и самки, возрастом 5–7 недель), пережившие 14-й день после инокуляции, содержались еще в течение 4 недель, после чего у них были собраны образцы головного мозга. Столбчатые диаграммы показывают уровни общего тау-белка (A), фосфорилированного тау-белка (pSer199) (B), отношение уровней фосфорилированного тау-белка к общему тау-белку (C); общего α-синуклеина (определено с помощью ИФА; D), фосфорилированного α-синуклеина (pSer129) (E) и отношение фосфорилированного α-синуклеина к общему α-синуклеину (оба метода выполнены с помощью Вестерн-блоттинга; F). Уровни H2O2 в двух отдельных группах мышей (G, H). Содержание нитротирозилирования белков головного мозга (I) (измерения H2O2 и нитротирозилирования приведены относительно массы мозга). Каждый символ обозначает одно животное. Погрешности отражают среднее ± SEM. WT = дикий тип; GS = мутантные мыши Lrrk2 p.G2019S; DS = мутантные мыши Lrrk2 p.D1994S. Статистический анализ: двуфакторный дисперсионный анализ (ANOVA) с нескорректированным апостериорным тестом наименьшей значимой разности (LSD) Фишера. Значение P &amp;lt; 0.05 (&lt;/em&gt;), P &amp;lt; 0.01 (&lt;strong&gt;), P &amp;lt; 0.001 (&lt;/strong&gt;&lt;em&gt;), P &amp;lt; 0.0001 (&lt;/em&gt;**&lt;em&gt;).&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"fosforilirovannyj-a-sinuklein-uvelichivaetsya-v-golovnom-mozge-s-mutaciej-lrrk2-pg2019s-posle-infekcii-h1n1\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#fosforilirovannyj-a-sinuklein-uvelichivaetsya-v-golovnom-mozge-s-mutaciej-lrrk2-pg2019s-posle-infekcii-h1n1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Фосфорилированный α-синуклеин увеличивается в головном мозге с мутацией Lrrk2 p.G2019S после инфекции H1N1&lt;/span&gt;&lt;/a&gt;Фосфорилированный α-синуклеин увеличивается в головном мозге с мутацией Lrrk2 p.G2019S после инфекции H1N1&lt;/h4&gt;\n&lt;p&gt;Затем мы исследовали метаболизм α-синуклеина у тех же животных (Рис. 2d-f). Ранее мы наблюдали зависящее от Lrrk2G2019S увеличение общего α-синуклеина в головном мозге новорожденных мышей, инфицированных реовирусом (T3D). Поэтому мы провели Вестерн-блоттинг и ИФА гомогенатов всего головного мозга выживших самок и самцов, определяя уровни общего синуклеина и pSer129 α-синуклеина. Двухфакторный дисперсионный анализ выявил влияние предшествующей инфекции H1N1 на общий α-синуклеин в головном мозге мутантных самок (F(1, 8)=7.32, P=0.0268, Доп. Рис. 3d), но не у самцов (Доп. Рис. 2d); тем не менее, при объединении полов эффект инфекции оставался значимым (P=0.0474) (Рис. 2d). Кроме того, мы обнаружили повышение уровней pSer129 α-синуклеина у выживших животных (Рис. 2e). Двухфакторный дисперсионный анализ выявил значительный эффект генотипа (F(1, 20)=54.73, P&amp;lt;0.0001), значительный эффект инфекции (F(1, 20)=10.76, P=0.0037) и значительное взаимодействие генотипа и инфекции (F(1, 20)=6.186, P=0.0218), которое в основном определялось самками (Доп. Рис. 3e). Интересно, что у самки мышей Lrrk2 p.G2019S демонстрировали повышенный уровень pSer129 α-синуклеина в головном мозге на исходном уровне (Доп. Рис. 3e). При расчете соотношения фосфорилированного α-синуклеина к общему мы выявили более высокое соотношение у инфицированных мутантных мышей по сравнению с инфицированными животными дикого типа при попарных сравнениях (P&amp;lt;0.05) (Рис. 2f), что наблюдалось в первую очередь у самцов (Доп. Рис. 2f); двухфакторный дисперсионный анализ показал значимость для этого&lt;/p&gt;\n&lt;p&gt;interaction (P=0.0381). Эти результаты навели нас на мысль, что пневмонит, вызванный H1N1, может приводить к дисрегуляции растворимого фосфорилированного α-синуклеина в головном мозге выживших гомозиготных животных с мутацией Lrrk2 p.G2019S. Учитывая, что киназа, подобная polo-2 (Plk2), была идентифицирована несколькими научными группами, включая нашу, в качестве специфического фермента для фосфорилирования α-синуклеина по остатку Ser129, мы также исследовали ее уровень в лизатах головного мозга методом вестерн-блоттинга. Мы наблюдали значительное увеличение уровня белка Plk2 в головном мозге мутантных саммок на исходном уровне (P&amp;lt;0.05) (Suppl. Рис. 3g), которое усугублялось предшествующей инфекцией H1N1 у диких животных; этот эффект не наблюдался при объединении данных самцов и самок (данные не приведены). В будущих работах предстоит выяснить, изменялась ли сама ферментативная активность Plk2 (или дефосфорилирование pSer129 α-синуклеина) в головном мозге животных, перенесших пневмонит, вызванный H1N1.&lt;/p&gt;\n&lt;h4 id=\"pnevmonit,-vyzvannyj-h1n1,-privodit-k-usileniyu-okislitelnogo-stressa-v-golovnom-mozge-myshej-s-mutaciej-lrrk2-pg2019s\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#pnevmonit,-vyzvannyj-h1n1,-privodit-k-usileniyu-okislitelnogo-stressa-v-golovnom-mozge-myshej-s-mutaciej-lrrk2-pg2019s\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пневмонит, вызванный H1N1, приводит к усилению окислительного стресса в головном мозге мышей с мутацией Lrrk2 p.G2019S&lt;/span&gt;&lt;/a&gt;Пневмонит, вызванный H1N1, приводит к усилению окислительного стресса в головном мозге мышей с мутацией Lrrk2 p.G2019S&lt;/h4&gt;\n&lt;p&gt;Затем мы измерили уровни окислительного стресса в головном мозге выживших животных трех различных гомозиготных генотипов (Рис. 2g, h) при сравнении двух когорт. Концентрация H₂O₂ в гомогенатах, полученных от выживших мышей, инфицированных H1N1, определялась количественно с помощью метода Amplex® Red. При этом мы выявили влияние пневмонита на уровни H₂O₂ в когорте мышей дикого типа по сравнению с животными Lrrk2 p.G2019S с использованием двухфакторного дисперсионного анализа (ANOVA), а именно для инфицированных самцов дикого типа по сравнению с ложноинфицированными мышами (F(1, 12)=10.20, P=0.0077) (Suppl. Рис. 2h); однако для других сравнений в этой когорте достоверных различий обнаружено не было (Рис. 2g). При измерении концентраций H₂O₂ в отдельной когорте, где мы сравнивали мышей дикого типа с мышами с киназно-неактивной мутацией Lrrk2 p.D1994S, мы снова наблюдали значительные различия у самцов дикого типа (F(1, 18)=7.869, P=0.0117) (Рис. 2h; Suppl. Рис. 1g,h). В ходе апостериорного анализа предшествующая инфекция H1N1 приводила к значительно более высоким уровням H₂O₂ у животных дикого типа по сравнению с ложноинфицированными мышами (P=0.0087); тенденция к повышению уровня H₂O₂ в головном мозге наблюдалась как у самок, так и у самцов мышей с мутацией Lrrk2 p.G2019S в зависимости от инфекции (Рис. 2g; Suppl. Рис. 2h, 3h). Примечательно, что у животных с киназно-неактивной мутацией Lrrk2 p.D1994S, подвергшихся воздействию H1N1, повышения концентрации H₂O₂ в головном мозге не обнаружено (Рис. 2h; Suppl. Рис. 1g, h). В качестве дополнительного метода оценки окислительного стресса мы исследовали необратимое нитротирозилирование белков в белковых экстрактах из головного мозга мышей, инфицированных H1N1, через 6 недель после заражения (6wpi) (Рис. 2i). Используя вестерн-блоттинг и денситометрию, мы выявили значительное влияние воздействия H1N1 на нитротирозилирование белков у всех самок (F(1, 8)=13.34, P=0.0065) (Suppl. Рис. 3i). Когда&lt;/p&gt;\n&lt;p&gt;Анализируя соответствующие уровни у самцов, двуфакторный дисперсионный анализ выявил значительные эффекты для инфекции (F(1, 8)=8.484, P=0.0195) и генотипа (F(1, 8)=13.62, P=0.0061) (Доп. Рис. 2i). Постхок-анализ подтвердил, что у подвергшихся воздействию H1N1 самцов мышей Lrrk2 p.G2019S уровни нитротирозилирования были выше, чем у ложноинфицированных мутантных животных и инокулированных мышей дикого типа.&lt;/p&gt;\n&lt;p&gt;Недавно две группы исследователей, включая нашу, установили роль Lrrk2 p.G2019S в усилении активности НАДФН-оксидазы-2 (NOX2), что приводит к всплеску продукции АФК определенными иммунными клетками; поэтому мы также исследовали субъединицу p47phox NOX2 в составе ее активного комплекса, который, как мы ранее обнаружили, гиперфосфорилирован Lrrk2 p.G2019S в нейтрофилах. На сегодняшний день анализ тех же лизатов головного мозга выживших после заражения H1N1 животных по сравнению с ложноинокулированными животными, исследованных с помощью вестерн-блоттинга с антителами к p47phox, остался неопределенным (данные не приведены).&lt;/p&gt;\n&lt;p&gt;В сумме мы показали, что взрослые мыши C57BL/6J, перенесшие угрожающее жизни пневмонит вследствие вирусной инфекции нижних дыхательных путей, характеризовались нейрохимическими изменениями в головном мозге. Пневмотропная инфекция H1N1 приводила к значительному увеличению окислительного стресса и повышению уровня как фосфорилированного α-синуклеина, так и фосфорилированного тау-белка у взрослых мышей с мутацией Lrrk2 p.G2019S через 6 недель после инокуляции, т.е. в то время, когда выжившие оправились от острого заболевания.&lt;/p&gt;\n&lt;p&gt;Наши результаты показывают, что ни мутация Lrrk2 p.G2019S, ни Lrrk2 p.D1994S не давали преимуществ — или повышенного риска — во время острой вирусной легочной инфекции H1N1, о чем свидетельствуют сходные показатели выживаемости, вирусные титры и изменения массы тела (Рис. 1). В наших предыдущих исследованиях Lrrk2 p.G2019S обеспечивал защиту в модели сепсиса, вызванного Salmonella typhimurium, и модели инфекции Listeria monocytogenes, но ухудшал выживаемость при энцефалите, индуцированном реовирусом (T3D), с эффектом женского пола.&lt;/p&gt;\n&lt;p&gt;Эти результаты породили гипотезу о том, что мутант Lrrk2 p.G2019S может усиливать защиту хозяина против отдельных микробных инфекций за пределами головного мозга, но несет больший риск гибели нейронов при попадании инфекции в нервную систему (по сравнению с животными дикого типа и мышами Lrrk2 p.D1994S). Опираясь на наши предыдущие исследования, факторами, способствующими ухудшению здоровья мозга, являлись избыточная продукция АФК (например, через повышенную активность NOX2), усиление реактивности микроглии и повышенный хемотаксис миелоидных клеток в головной мозг.&lt;/p&gt;\n&lt;p&gt;Поскольку H1N1 не обладает прямым тропизмом к головному мозгу, мы предполагаем, что провоспалительные ответы, инициированные на периферии, достигали головного мозга и влияли на его нейрональный и/или глиальный метаболизм в описанной здесь модели пневмонита, концепция, которая совпадает с выводом, к которому пришли Кадар и др. в отношении постинфекционного паркинсонизма после пандемии H1N1 столетие назад.&lt;/p&gt;\n&lt;p&gt;Повышение экспрессии α-синуклеина in vivo в ответ на различные воспалительные триггеры было описано ранее. Здесь мы обнаружили эффект, обусловленный Lrrk2 p.G2019S, на стабильное состояние pSer129 α-синуклеина у самок и самцов мышей после инфекции H1N1. Следовательно, наши результаты могут иметь значение для связи риска инфекции вирусом гриппа А с последующей заболеваемостью болезнью Паркинсона (БП) с поздним началом, особенно у носителей мутантного генотипа LRRK2, у которых развивается синуклеинопатия.&lt;/p&gt;\n&lt;p&gt;БП, связанная с LRRK2, демонстрирует плейотропную патологию головного мозга, а мутации в нем также были связаны с тауопатией прогрессирующего надъядерного паралича (ПНП). В этом контексте мы оценили влияние предшествующей инфекции H1N1 на метаболизм тау-белка. Мы выявили значительное взаимодействие инфекции и генотипа в отношении стабильного состояния pSer199 тау-белка; при этом его уровни были значительно повышены у самок мышей с мутацией Lrrk2 p.G2019S (но не у мышей дикого типа) после инфекции H1N1.&lt;/p&gt;\n&lt;p&gt;У людей тауопатия, характеризующаяся нерастворимыми нейрофибриллярными клубочками, была описана не только при постинфекционном паркинсонизме, но и при подостром склерозирующем панэнцефалите, вызванном вирусом кори. В будущих работах потребуется оценить периферические иммунные медиаторы, такие как циркулирующие цитокины, хемокины и инфильтрирующие иммунные клетки, на предмет их механистического вклада в нейрохимические изменения, наблюдаемые в нашей модели пневмонита.&lt;/p&gt;\n&lt;p&gt;Наше исследование имеет ограничения. Во-первых, анализ был ограничен 6 неделями после инокуляции, что может не отражать всю траекторию разрешения заболевания.&lt;/p&gt;\n&lt;p&gt;Во-вторых, мы не оценивали возрастную восприимчивость, поскольку все мыши были относительно молодыми (5–7 недель от роду), а иммунные ответы, а также целостность гематоэнцефалического барьера, как известно, варьируют в течение жизни. В-третьих, несколько исследований показали, что фосфоримилирование тау-белка весьма чувствительно к факторам окружающей среды и условиям стресса, таким как гипотермия, лихорадка, анестезия и цикл сон-бодрствование. В наших исследованиях мы внимательно относились к этим потенциальным модификаторам, но другие (еще не идентифицированные) могли сыграть модулирующую роль. В-четвертых, мы еще не выяснили механизмы, лежащие в основе гиперфосфоримилирования α-синуклеина и тау-белка у мышей Lrrk2 p.G2019S, перенесших пневмонит H1N1 (стоит отметить, что сам Lrrk2 не считается нейрональной киназой для тау-белка или α-синуклеина). В-пятых, гиперфосфоримилирование двух белков в растворимых лизатах головного мозга не эквивалентно образованию нерастворимых амилоидогенных агрегатов, связанных с формированием нейрофибриллярных клубочков и включений тельца Леви внутри нейронов в более позднем возрасте; однако это может служить предшествующим событием. Наконец, добавление большего числа животных в каждую экспериментальную группу могло бы пролить еще больше света на влияние пола на наши нейрохимические показатели. Тем не менее, наши результаты показывают, что инфекция пневмотропным РНК-вирусом может усиливать окислительный стресс в головном мозге мышей дикого типа C57BL/6J и повышать уровень фосфорилированного α-синуклеина и фосфорилированного тау-белка у нокын-ин животных Lrrk2 p.G2019S через шесть недель после назальной инокуляции, несмотря на отсутствие прямого нейротропизма со стороны H1N1 (и отсутствие детектируемых вирусных белков в головном мозге на тот момент). Наши результаты, полученные на взрослых мышах, содержавшихся в контролируемых условиях, дополняют концепцию о том, что взаимодействия между отдельными вирулентными микроорганизмами, включая те, которые поражают периферические органы, и геномом хозяина могут служить инициаторами изменений в головном мозге взрослого человека, связанных с нейродегенерацией.&lt;/p&gt;\n&lt;h4 id=\"istochniki-finansirovaniya\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#istochniki-finansirovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ИСТОЧНИКИ ФИНАНСИРОВАНИЯ:&lt;/span&gt;&lt;/a&gt;ИСТОЧНИКИ ФИНАНСИРОВАНИЯ:&lt;/h4&gt;\n&lt;p&gt;Это исследование финансировалось: организацией Aligning Science Across Parkinson’s [идентификатор гранта: ASAP-020625] через Фонд исследований болезни Паркинсона Майкла Дж. Фокса (MJFF); грантом на проект Канадских институтов исследований в области здравоохранения; семьей Уттры и Сам Бхаргава; Фондом больницы Оттавы (M.G.S.); Консорциумом по исследованию болезни Паркинсона Оттавы (M.G.S.; J.J.T.); и командным грантом Института исследований мозга и разума uOttawa (M.G.S., J.J.T., S.S.). M.L. получила поддержку в рамках стипендии CGS-D от Канадских институтов исследований в области здравоохранения. K.T. получал поддержку в виде мемориальной стипендии Фрэнсиса Мэтью от Консорциума по исследованию болезни Паркинсона и Института исследований мозга и разума uOttawa. Авторы заявляют об отсутствии конфликта интересов в отношении содержания данной статьи.&lt;/p&gt;\n&lt;p&gt;РИСУНКИ: окислительный стресс в головном мозге мышей после пневмонита, вызванного вирусом гриппа H1N1.&lt;/p&gt;\n&lt;p&gt;Взрослые ложноинфицированные (H1N1 -) и инфицированные H1N1 (H1N1 +) мыши (представлены самцы и самки; возраст 5–7 недель), пережившие 14 дней после инокуляции, содержались в течение дополнительных 4 недель, после чего у них были собраны ткани головного мозга. Столбчатые диаграммы показывают уровни общего тау-белка (A), фосфорилированного тау-белка (pSer199) (B), соотношения уровней фосфорилированного тау-белка к общему тау-белку (C); общего α-синуклеина (определено с помощью ИФА; D), фосфорилированного α-синуклеина (pSer129) (E) и соотношения фосфорилированного α-синуклеина к общему α-синуклеину (оба определены методом Вестерн-блоттинга; F). Уровни H₂O₂ в двух отдельных группах мышей (G, H). Содержание нитротирозилирования белков в головном мозге (I) (H₂O₂) и нитротирозилирование&lt;/p&gt;\n&lt;p&gt;измерения приведены относительно массы мозга). Каждый символ представляет одно животное. Пластинки погрешностей представляют среднее ± СОМ. WT = дикий тип; GS = мыши с мутацией Lrrk2 p.G2019S; DS = мыши с мутацией Lrrk2 p.D1994S. Статистический анализ: двусторонний дисперсионный анализ (two-way ANOVA) с неисправленным апостериорным тестом наименьшей значимой разницы (LSD) Фишера. Значение P &amp;lt;0.05 (&lt;em&gt;), значение P&amp;lt;0.01 (&lt;strong&gt;), значение P &amp;lt;0.001 (&lt;/strong&gt;&lt;/em&gt;), значение P&amp;lt;0.0001 (****).&lt;/p&gt;\n&lt;p&gt;титры в легких мышей, интраназально зараженных вирусом гриппа А, H1N1. Выживаемость&lt;/p&gt;\n&lt;p&gt;графически представлена в виде процента выживаемости в зависимости от дней после заражения (p.i.) (A, D), а масса тела показана в виде процента от исходной массы тела в зависимости от дней после заражения (p.i.) (B, E). Данные представлены отдельно для самок (A-C) и самцов мышей (D-F). Вирусные титры измерялись в легких на 3-й день после заражения (C, F). Уровни H2O2 представлены для самцов (G) и самок (H) (измерения приведены относительно массы мозга). Каждый символ представляет одно животное. Пластинки погрешностей представляют среднее ± СОМ. WT = дикий тип; DS = мыши с мутацией Lrrk2 p.D1994S. Использованные статистические тесты: тест лог-ранга (Мантела-Кокса) для кривых выживаемости; односторонний дисперсионный анализ (one-way ANOVA) для анализа вирусных титров; двусторонний дисперсионный анализ (two-way ANOVA) с неисправленным апостериорным тестом наименьшей значимой разницы (LSD) Фишера. Значение P &amp;lt;0.05 (*), значение P&amp;lt;0.01 (**).&lt;/p&gt;\n&lt;p&gt;уровни фосфорилированного тау-белка к общему тау-белку (C); общий альфа-синуклеин (определен методом ИФА; D),&lt;/p&gt;\n&lt;p&gt;фосфорилированный альфа-синуклеин (pSer129) (E) и отношение фосфорилированного альфа-синуклеина к общему альфа-синуклеину (оба определены методом вестерн-блоттинга; F). Уровни Plk2 (G), H2O2 (H) и содержание нитротирозилирования белков (I) головного мозга (измерения H2O2 и нитротирозилирования приведены относительно массы мозга). Каждый символ представляет одно животное. Пластинки погрешностей представляют среднее ± СОМ. WT = дикий тип; GS = мыши с мутацией Lrrk2 p.G2019S; DS = мыши с мутацией Lrrk2 p.D1994S. Статистический анализ: двусторонний дисперсионный анализ (two-way ANOVA) с неисправленным апостериорным тестом наименьшей значимой разницы (LSD) Фишера. Значение P &amp;lt;0.05 (*), значение P&amp;lt;0.01 (**).&lt;/p&gt;\n&lt;p&gt;уровни фосфорилированного тау-белка к общему тау-белку (C); общий альфа-синуклеин (определен методом ИФА; D),&lt;/p&gt;\n&lt;p&gt;фосфорилированный альфа-синуклеин (pSer129) (E) и отношение фосфорилированного альфа-синуклеина к общему альфа-синуклеину (оба определены методом вестерн-блоттинга; F). Уровни Plk2 (G), H2O2 (H) и содержание нитротирозилирования белков (I) головного мозга (измерения H2O2 и нитротирозилирования приведены относительно массы мозга). Каждый символ представляет одно животное. Пластинки погрешностей представляют среднее ± СОМ. WT = дикий тип; GS = мыши с мутацией Lrrk2 p.G2019S; DS = мыши с мутацией Lrrk2 p.D1994S. Статистический анализ: двусторонний дисперсионный анализ (two-way ANOVA) с неисправленным апостериорным тестом наименьшей значимой разницы (LSD) Фишера. Значение P &amp;lt;0.05 (&lt;em&gt;), значение P&amp;lt;0.01 (&lt;strong&gt;), значение P &amp;lt;0.001 (&lt;/strong&gt;&lt;/em&gt;).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Причины&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;неполной&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;пенетрантности&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;LRRK2&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Заражение&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мышей с&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мутациями&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;LRRK2 вирусом&lt;/text&gt;&lt;text x=\"226\" y=\"162\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;H1N1&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Рост фосфорили&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;рованных&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;белков в мозге&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;через 6 не&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Инфекция может&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;быть триггером&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нейродегенерац&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ии&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не прошёл рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия препринта&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;bioRxiv&lt;/td&gt;\n&lt;td&gt;neuroscience&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Lunn, M. O.; Thakur, K.; Lengacher, N. A.; Hake-Volling, Q.; aSCENT-PD Investigators,  ; Tomlinson, J. J.; Sad, S.; Brown, E. G.; Schlossmacher, M. G.&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#istochni
