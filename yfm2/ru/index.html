tps://t.me/oba_boba","theme":"normal-contrast"}]},{"type":"header-block","title":"Приложение для Android","description":"&lt;p&gt;Лента по темам, все рисунки и полный перевод — даже без интернета. Наведите камеру на QR-код.&lt;/p&gt;\n","theme":"dark","width":"m","image":"qr-app.svg","verticalOffset":"s","background":{"color":"#CC8400","image":"home-app-3.jpg"},"buttons":[{"text":"Скачать APK","url":"https://vivalyaraza.github.io/biosignal/app/biosignal.apk","theme":"normal-contrast"}]},{"type":"media-block","animated":false,"title":"&lt;p&gt;Карта уязвимости мозга: как болезни меняют клетки человека&lt;/p&gt;\n","description":"&lt;p&gt;Почему разные заболевания мозга часто проявляются схожими симптомами? Исследователи проанализировали более 6 миллионов клеток из префронтальной коры 1494 доноров. Работа раскрывает, как именно нейроны и вспомогательные клетки меняются при нейродегенерации и психических расстройствах. Это помогает увидеть общие молекулярные механизмы, скрытые за разными диагнозами.&lt;/p&gt;\n","media":{"image":"2026-10-01/single-cell-atlas-of-transcriptomic-vulnerability-across-bra-card.jpg"},"buttons":[{"text":"Читать","url":"2026-10-01/single-cell-atlas-of-transcriptomic-vulnerability-across-bra.html","theme":"action"}]},{"type":"card-layout-block","animated":false,"title":{"text":"Свежий выпуск &amp;middot; 01.10.2026","url":"2026-10-01/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-10-01/single-cell-atlas-of-transcriptomic-vulnerability-across-bra-card.jpg"},"content":{"title":"Карта уязвимости мозга: как болезни меняют клетки человека","text":"&lt;p&gt;Ученые создали масштабный атлас мозга, чтобы понять, что общего у болезней Альцгеймера, Паркинсона и шизофрении на уровне отдельных клеток.&lt;/p&gt;\n","links":[{"url":"2026-10-01/single-cell-atlas-of-transcriptomic-vulnerability-across-bra.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise-card.jpg"},"content":{"title":"Как иммунные клетки провоцируют ожирение печени","text":"&lt;p&gt;Нейтрофилы, которые обычно защищают нас от инфекций, могут становиться виновниками развития стеатогепатита.&lt;/p&gt;\n","links":[{"url":"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut-card.jpg"},"content":{"title":"Как мозг воспроизводит кадры личных воспоминаний","text":"&lt;p&gt;Нейросети помогли доказать: медиальная височная сеть мозга хранит уникальные визуальные детали наших воспоминаний.&lt;/p&gt;\n","links":[{"url":"2026-10-01/medial-temporal-default-mode-network-selectively-encodes-aut.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/a-serum-thyroid-hormone-metabolite-test-for-molecular-diagno-card.jpg"},"content":{"title":"Анализ крови вместо биопсии: новый способ выявления рака щитовидной железы","text":"&lt;p&gt;Ученые разработали тест на метаболиты гормонов, который помогает отличить доброкачественные узлы от злокачественных без инвазивных процедур.&lt;/p&gt;\n","links":[{"url":"2026-10-01/a-serum-thyroid-hormone-metabolite-test-for-molecular-diagno.html","text":"Читать","arrow":true,"theme":"normal"}]}}]},{"type":"card-layout-block","animated":false,"title":{"text":"Выпуск &amp;middot; 25.09.2026","url":"2026-09-25/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun-card.jpg"},"content":{"title":"Как редкая мутация в&amp;nbsp;гене AKAP11 запускает тревогу и&amp;nbsp;депрессию","text":"&lt;p&gt;Ученые создали мышиную модель с человеческой мутацией и показали, как генетический сбой нарушает работу нейронов.&lt;/p&gt;\n","links":[{"url":"2026-09-25/a-bipolar-disorder-associated-ultra-rare-akap11-protein-trun.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-card.jpg"},"content":{"title":"Умный диспетчер для создания белков ускоряет разработку лекарств","text":"&lt;p&gt;Искусственный интеллект научился эффективно распределять вычислительные ресурсы при проектировании новых молекул.&lt;/p&gt;\n","links":[{"url":"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-25/memristive-singular-value-decomposition-card.jpg"},"content":{"title":"Как заставить компьютерные чипы запоминать и&amp;nbsp;считать одновременно","text":"&lt;p&gt;Новая архитектура на мемристорах ускоряет обработку матриц в десятки раз, объединяя память и вычисления.&lt;/p&gt;\n","links":[{"url":"2026-09-25/memristive-singular-value-decomposition.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-25/infants-at-high-and-low-likelihood-for-autism-show-different-card.jpg"},"content":{"title":"Как мозг младенцев с&amp;nbsp;риском аутизма обрабатывает речь","text":"&lt;p&gt;Ученые выяснили, как младенцы с разной предрасположенностью к аутизму учатся распознавать слова в потоке речи.&lt;/p&gt;\n","links":[{"url":"2026-09-25/infants-at-high-and-low-likelihood-for-autism-show-different.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-25/combination-of-alk2-and-cholesterol-targeting-agents-exploit-card.jpg"},"content":{"title":"Уязвимость неизлечимой опухоли мозга найдена в&amp;nbsp;обмене холестерина","text":"&lt;p&gt;Ученые обнаружили, что подавление обмена холестерина делает резистентную глиому ствола мозга уязвимой к таргетной терапии.&lt;/p&gt;\n","links":[{"url":"2026-09-25/combination-of-alk2-and-cholesterol-targeting-agents-exploit.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f-card.jpg"},"content":{"title":"Как алгоритмы учатся безошибочно предсказывать болезни сердца","text":"&lt;p&gt;Новый подход к машинному обучению оценивает надежность прогнозов риска сердечно-сосудистых заболеваний с учетом пола пациентов.&lt;/p&gt;\n","links":[{"url":"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html","text":"Читать","arrow":true,"theme":"normal"}]}}]},{"type":"card-layout-block","animated":false,"title":{"text":"Выпуск &amp;middot; 24.09.2026","url":"2026-09-24/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en-card.jpg"},"content":{"title":"Как детские стрессы перестраивают мозг и&amp;nbsp;усиливают страх","text":"&lt;p&gt;Ранний стресс меняет работу нейронов префронтальной коры и миндалины, заставляя подростков избегать угроз сильнее обычного.&lt;/p&gt;\n","links":[{"url":"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-card.jpg"},"content":{"title":"Как женский организм защищает мозг от&amp;nbsp;аутизма","text":"&lt;p&gt;Ученые выяснили, почему аутизм диагностируют реже у девочек: дело в защитной роли половых хромосом и регуляции генов.&lt;/p&gt;\n","links":[{"url":"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte-card.jpg"},"content":{"title":"Как CRISPR заставляет мРНК забыть дорогу к&amp;nbsp;метастазам","text":"
