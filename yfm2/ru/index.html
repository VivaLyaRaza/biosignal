            {"data":{"leading":true,"data":{"blocks":[{"type":"header-block","title":"БиоСигнал","description":"&lt;p&gt;Новые открытия в биологии и медицине — отобранные редакцией и объяснённые простым языком, но без упрощений.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Русский&lt;/strong&gt; · &lt;a href=\"https://biorxiv-digest-blog.netlify.app/uz/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;O'zbekcha&lt;/a&gt; · &lt;a href=\"https://biorxiv-digest-blog.netlify.app/kz/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Қазақша&lt;/a&gt;&lt;/p&gt;\n","theme":"dark","width":"m","background":{"color":"#CC3333","image":"home-hero-4.jpg"},"buttons":[{"text":"Свежий выпуск · 2026-09-24","url":"2026-09-24/index.html","theme":"normal-contrast"},{"text":"Темы","url":"topics/index.html","theme":"outlined-contrast"}]},{"type":"tabs-block","animated":false,"title":"Темы","items":[{"title":"Мозг и&amp;nbsp;нервная система","tabName":"Мозг и нервная система · 16","text":"&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html\"&gt;Как детские стрессы перестраивают мозг и усиливают страх&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html\"&gt;Генная терапия остановила развитие редкого синдрома у мышей&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html\"&gt;Иммунные клетки мозга при болезни Альцгеймера выгорают изнутри&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html\"&gt;Сбой ключевого белка при деменции запускает аномальные кольцевые РНК&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html\"&gt;Как бета-амилоид запускает клеточную цепную реакцию при болезни Альцгеймера&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;a href=\"topics/brain.html\"& eted-rna-protein-inte.html\"&gt;Как CRISPR заставляет мРНК забыть дорогу к метастазам&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html\"&gt;Как сердце управляет кровью через печень после инфаркта&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;a href=\"topics/cells.html\"&gt;Все материалы темы →&lt;/a&gt;&lt;/p&gt;\n","media":{"image":"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte-card.jpg"}}]},{"type":"header-block","title":"БиоСигнал в Telegram","description":"&lt;p&gt;Каждый день — по одному материалу с карточкой и рисунками из статьи. Наведите камеру на QR-код.&lt;/p&gt;\n","theme":"dark","width":"m","image":"qr-telegram.svg","verticalOffset":"s","background":{"color":"#CC3333","image":"home-tg-4.jpg"},"buttons":[{"text":"Открыть канал","url":"https://t.me/oba_boba","theme":"normal-contrast"}]},{"type":"header-block","title":"Приложение для Android","description":"&lt;p&gt;Лента по темам, все рисунки и полный перевод — даже без интернета. Наведите камеру на QR-код.&lt;/p&gt;\n","theme":"dark","width":"m","image":"qr-app.svg","verticalOffset":"s","background":{"color":"#CC3333","image":"home-app-4.jpg"},"buttons":[{"text":"Скачать APK","url":"https://vivalyaraza.github.io/biosignal/app/biosignal.apk","theme":"normal-contrast"}]},{"type":"media-block","animated":false,"title":"&lt;p&gt;Как детские стрессы перестраивают мозг и усиливают страх&lt;/p&gt;\n","description":"&lt;p&gt;Неблагоприятные условия в раннем возрасте часто приводят к тому, что в подростковом периоде человек начинает острее реагировать на опасности. Исследователи на мышиной модели выяснили, какие именно нейронные пути отвечают за это изменение. Оказалось, что дело в повышенной активности возбуждающих клеток, связывающих префронтальную кору и миндалину. Интересно, что во взрослом возрасте эти же нейронные контуры уже не вызывают такого поведения.&lt;/p&gt;\n","media":{"image":"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en-card.jpg"},"buttons":[{"text":"Читать","url":"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html","theme":"action"}]},{"type":"card-layout-block","animated":false,"title":{"text":"Свежий выпуск &amp;middot; 24.09.2026","url":"2026-09-24/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en-card.jpg"},"content":{"title":"Как детские стрессы перестраивают мозг и&amp;nbsp;усиливают страх","text":"&lt;p&gt;Ранний стресс меняет работу нейронов префронтальной коры и миндалины, заставляя подростков избегать угроз сильнее обычного.&lt;/p&gt;\n","links":[{"url":"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-card.jpg"},"content":{"title":"Как женский организм защищает мозг от&amp;nbsp;аутизма","text":"&lt;p&gt;Ученые выяснили, почему аутизм диагностируют реже у девочек: дело в защитной роли половых хромосом и регуляции генов.&lt;/p&gt;\n","links":[{"url":"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte-card.jpg"},"content":{"title":"Как CRISPR заставляет мРНК забыть дорогу к&amp;nbsp;метастазам","text":"&lt;p&gt;Ученые научились направлять молекулярные комплексы по новому адресу, лишая раковые клетки способности к миграции.&lt;/p&gt;\n","links":[{"url":"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html","text":"Читать","arrow":true,"theme":"normal"}]}}]},{"type":"card-layout-block","animated":false,"title":{"text":"Выпуск &amp;middot; 23.09.2026","url":"2026-09-23/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-card.jpg"},"content":{"title":"Генная терапия остановила развитие редкого синдрома у&amp;nbsp;мышей","text":"&lt;p&gt;Однократная инъекция вирусного вектора в первые дни жизни предотвратила гибель нейронов и нарушение координации движений при тяжелом заболевании.&lt;/p&gt;\n","links":[{"url":"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-card.jpg"},"content":{"title":"Иммунные клетки мозга при болезни Альцгеймера выгорают изнутри","text":"&lt;p&gt;Защитники мозга расходуют ресурс на борьбу с амилоидом и истощаются по мере развития болезни.&lt;/p&gt;\n","links":[{"url":"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur-card.jpg"},"content":{"title":"Сбой ключевого белка при деменции запускает аномальные кольцевые РНК","text":"&lt;p&gt;Ученые выяснили, как дефицит белка TDP-43 создает новый класс скрытых кольцевых РНК в нейронах при болезнях мозга.&lt;/p&gt;\n","links":[{"url":"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s-card.jpg"},"content":{"title":"Как сердце управляет кровью через печень после инфаркта","text":"&lt;p&gt;Ученые обнаружили прямую связь между сердцем и печенью, которая помогает восстанавливать уровень тромбоцитов после инфаркта.&lt;/p&gt;\n","links":[{"url":"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons-card.jpg"},"content":{"title":"Как вернуть иммунитету силу при терапии рака","text":"&lt;p&gt;Новый подход помогает Т-клеткам не впадать в спячку при лечении онкологии bispecific антителами.&lt;/p&gt;\n","links":[{"url":"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-card.jpg"},"content":{"title":"Как бета-амилоид запускает клеточную цепную реакцию при болезни Альцгеймера","text":"&lt;p&gt;Токсичные белки передаются между клетками через везикулы, повреждая соседние нейроны.&lt;/p&gt;\n","links":[{"url":"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-card.jpg"},"content":{"title":"Почему мозг людей с&amp;nbsp;афантазией видит иначе?","text":"&lt;p&gt;Ученые выяснили, почему некоторые люди всю жизнь живут без внутреннего экрана и не могут представить яблоко.&lt;/p&gt;\n","links":[{"url":"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi-card.jpg"},"content":{"title":"Мозг дописывает реальность задним числом в&amp;nbsp;первичной зрительной коре","text":"&lt;p&gt;То, что мы видим в моменте, зависит от событий будущего. Эксперимент с 7Т МРТ показал, как мозг корректирует восприятие.&lt;/p&gt;\n","links":[{"url":"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/how-occam-s-razor-guides-human-decision-making-card.jpg"},"content":{"title":"Как мозг выбирает простые объяснения","text":"&lt;p&gt;Люди интуитивно выбирают простые гипотезы для сложных данных, действуя по принципу бритвы Оккама.&lt;/p&gt;\n","links":[{"url":"2026-09-23/how-occam-s-razor-guides-human-decision-making.html","text":"Читать","arrow":true,"theme":"normal"}]}}]},{"type":"card-layout-block","animated":false,"title":{"text":"Выпуск &amp;middot; 22.09.2026","url":"2026-09-22/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h-card.jpg"},"content":{"title":"Как мозг путает знакомое с&amp;nbsp;новым: найден клеточный код памяти","text":"&lt;p&gt;Ученые впервые зафиксировали работу отдельных нейронов человеческого мозга, отвечающих за разделение похожих воспоминаний.&lt;/p&gt;\n","links":[{"url":"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l-card.jpg"},"content":{"title":"Как отдельные нейроны мозга реагируют на&amp;nbsp;правила общения","text":"&lt;p&gt;Ученые впервые заглянули в работу одиночных нейронов человеческого мозга при оценке социальных норм и справедливости.&lt;/p&gt;\n","links":[{"url":"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd-card.jpg"},"content":{"title":"Скрытые кольцевые молекулы РНК выдают опасное нейродегенеративное заболевание","text":"&lt;p&gt;Сбой важного белка в мозге запускает сборку аномальных кольцевых РНК, открывая новые пути для ранней диагностики.&lt;/p&gt;\n","links":[{"url":"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-card.jpg"},"content":{"title":"Как наш мозг превращает непонятное искусство в&amp;nbsp;удовольствие","text":"&lt;p&gt;Ученые проследили путь от простого любопытства до озарения и радости от понимания картин.&lt;/p&gt;\n","links":[{"url":"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-card.jpg"},"content":{"title":"Как гормоны влияют на&amp;nbsp;гены аутизма и&amp;nbsp;расстройств развития мозга","text":"&lt;p&gt;Ученые проверили, как эстрадиол влияет на работу 36 генов, связанных с аутизмом и расстройствами развития мозга.&lt;/p&gt;\n","links":[{"url":"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio-card.jpg"},"content":{"title":"Новый быстрый тест на&amp;nbsp;опасную амебу Balamuthia mandrillaris","text":"&lt;p&gt;Создан первый экспресс-тест на редкую и смертельную амебу, позволяющий быстро поставить диагноз даже в обычных клиниках.&lt;/p&gt;\n","links":[{"url":"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-card.jpg"},"content":{"title":"Ученые впервые экспериментально доказали существование вирусоподобных РНК с&amp;nbsp;генами","text":"&lt;p&gt;Ученые впервые в лаборатории доказали существование загадочных кольцевых РНК, которые кодируют белки и живут без ДНК.&lt;/p&gt;\n","links":[{"url":"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-card.jpg"},"content":{"title":"Как прерывистый сон запускает вспышки эпилепсии в&amp;nbsp;мозге","text":"&lt;p&gt;Ученые выяснили, почему микропробуждения во время сна провоцируют патологическую активность нейронов без расширения сети приступов.&lt;/p&gt;\n","links":[{"url":"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/plscr1-inhibits-murine-norovirus-entry-card.jpg"},"content":{"title":"Белок Plscr1 останавливает проникновение мышиного норовируса","text":"&lt;p&gt;Ученые открыли клеточный белок, который блокирует проникновение норовируса в клетки.&lt;/p&gt;\n","links":[{"url":"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-card.jpg"},"content":{"title":"Как крысы избегают черных лебедей и&amp;nbsp;ищут джекпоты","text":"&lt;p&gt;Редкие и катастрофические события управляют выбором животных сильнее, чем рутина.&lt;/p&gt;\n","links":[{"url":"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in-card.jpg"},"content":{"title":"Грипп оставляет след в&amp;nbsp;мозге: как мутация LRRK2 запускает белковые сдвиги","text":"&lt;p&gt;Перенесенный грипп запускает в мозге носителей мутации LRRK2 изменения, похожие на ранние этапы нейродегенерации.&lt;/p&gt;\n","links":[{"url":"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-card.jpg"},"content":{"title":"Карта развития гиппокампа человека для изучения ранней болезни Альцгеймера","text":"&lt;p&gt;Создана детальная карта развивающегося гиппокампа для проверки лабораторных моделей болезни Альцгеймера.&lt;/p&gt;\n","links":[{"url":"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html","text":"Читать","arrow":true,"theme":"normal"}]}}]},{"type":"extended-features-block","animated":false,"title":"Как устроен БиоСигнал","items":[{"title":"Отбор","text":"&lt;p&gt;Каждый день модель сравнивает десятки свежих исследований и выбирает самые значимые и понятные.&lt;/p&gt;\n"},{"title":"Разбор","text":"&lt;p&gt;Суть, ключевые выводы и ограничения — простым языком, но без упрощений.&lt;/p&gt;\n"},{"title":"Три языка","text":"&lt;p&gt;Каждый материал выходит на русском, узбекском и казахском.&lt;/p&gt;\n"},{"title":"Рисунки и&amp;nbsp;полный текст","text":"&lt;p&gt;Иллюстрации из самих статей, а для открытых лицензий — полный перевод.&lt;/p&gt;\n"}]},{"type":"questions-block","animated":false,"title":"Вопросы","items":[{"title":"&lt;p&gt;Это рецензированные статьи?&lt;/p&gt;\n","text":"&lt;p&gt;Нет, это препринты — свежие работы до рецензирования. В каждом материале отмечены ограничения исследования.&lt;/p&gt;\n"},{"title":"&lt;p&gt;Как часто выходят материалы?&lt;/p&gt;\n","text":"&lt;p&gt;Три раза в день: утром, днём и вечером по времени Ташкента и Астаны.&lt;/p&gt;\n"},{"title":"&lt;p&gt;Можно ли использовать тексты?&lt;/p&gt;\n","text":"&lt;p&gt;Да, со ссылкой на БиоСигнал и на исходную статью (DOI указан в каждом материале).&lt;/p&gt;\n"}]}],"links":[]},"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"БиоСигнал","vcsPath":"index.yaml"},"title":"БиоСигн
