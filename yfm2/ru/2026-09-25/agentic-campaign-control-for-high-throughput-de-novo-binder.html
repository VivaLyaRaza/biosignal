lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Foldseek и pLDDT — это инструменты и метрики структурной биологии: первый быстро ищет похожие 3D-белковые структуры в базах данных, а второй оценивает локальную точность предсказания модели AlphaFold по шкале от 0 до 100.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Окно из 3–6 графических процессоров (worker-GPU-h) выбирает записи в обратном порядке от новейших, пока суммарная учтенная стоимость не достигнет заданного порога. Недавняя доля дублирования рассчитывается по формуле &lt;span class=\"yfm-latex\" data-content=\"f_%7B%5Ctext%7Bdup%7D%7D%20%3D%201%20-%20%5Cfrac%7BN_%7B%5Ctext%7Bclusters%7D%7D%7D%7BN_%7B%5Ctext%7Bassigned%7D%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, где Nassigned &amp;gt; 0 обозначает записи с назначением кластера Foldseek TM0.6 среди последних 60 записей, а Nclusters — количество уникальных кластеров. Дефицит определяется как неотрицательное расстояние, на которое измерение отклоняется от порога квалификации. Допуски для близких к успеху результатов составляют 5 пунктов pLDDT, 0.05 для нормализованного iPAE и 0.3 Å для scRMSD. Близкий к успеху результат имеет конечные значения для всех трех метрик, не проходит квалификацию, но имеет не более одного критерия вне допуска и ни одного критерия, отклоняющегося более чем на десять соответствующих допусков.&lt;/p&gt;\n&lt;p&gt;Сводки методов оценивают состояние семейств белковых дизайнов, объединяя попытки, завершения, сбои, затраты и результаты новизны для выявления неэффективных подходов. Недавние темпы рассчитываются на основе новых приростов успешных единиц (SU) за последние 60 записей результатов. Прямые темпы делят эти приросты на зарегистрированные затраты семейства в данном окне, в то время как темпы, приписываемые через последующую оценку, также включают затраты родителей вне окна. Ранее протестированные конфигурации группируют результаты по действиям и исходам, сохраняя медианы и идентификаторы, а сводки стратегий и исходов сохраняют историю для каждого подхода для повторного использования в будущих циклах планирования, где каждая сводка хранит до двадцати историй тиков планирования в &lt;span class=\"yfm-latex\" data-content=\"%5Ctext%7Brecent%5C_ticks%5C_history%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, а входные данные для языковой модели сохраняют десять.&lt;/p&gt;\n&lt;h4 id=\"c42-onlajn-prisvoenie-raschetnyh-edinic-su-i-uchet-vychislenij\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c42-onlajn-prisvoenie-raschetnyh-edinic-su-i-uchet-vychislenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.4.2. Онлайн-присвоение расчетных единиц (SU) и учет вычислений&lt;/span&gt;&lt;/a&gt;C.4.2. Онлайн-присвоение расчетных единиц (SU) и учет вычислений&lt;/h4&gt;\n&lt;p&gt;Модуль Routeattributionandcost группирует задачи в соответствии с разделом C.2.2. Стандартизированная оценка AF2 привязывается к маршруту генерации или редизайна, который создал ее входные данные. Каждый квалифицированный онлайн-кластер добавляет ровно одну расчетную единицу SU к тому маршруту, который породил своего первого квалифицированного участника в порядке архива. Другие маршруты могут вносить свой вклад в виде квалифицированных участников без дополнительного начисления SU. Итоговое распределение привязано к задаче, создавшей фиксированный репрезентативный объект (раздел B.2). Затраты на маршрут включают генерацию или редизайн, обязательную оценку и зарегистрированные затраты предковых вариантов. Каждый предковый ResultRecord учитывается в рамках маршрута один раз, но может фигурировать в нескольких маршрутах, из-за чего простое суммирование затрат по маршрутам не дает общих затрат кампании. Стоимость задачи с несколькими выходами распределяется между ее ResultRecords. Расходы по недавним маршрутам рассчитываются с использованием окон в масштабах всей кампании из раздела C.4.1, включая затраты на необходимых предков, даже если запись предка предшествует этому окну. Таблица S6 отделяет данные расходы от отчетного бюджета и других показателей времени работы в сети.&lt;/p&gt;\n&lt;p&gt;В Таблице S6 приводятся определения и использование ключевых метрик: основной отчетный бюджет зафиксирован на уровне H = 144 часа слота воркера H100 на основную кампанию, где каждый выделенный воркер учитывается единожды. Итоговый показатель рассчитывается как NSU / H и исключает отдельный сервер LLM и оценку генератора после отсечения при первичном учете. Прошедшее время слота воркера определяется как суммарное время работы кампании, умноженное на сконфигурированное число воркеров (worker_wall_gpu_h_total), включая целевой показатель пропускной способности кампании и время простоя слотов. Записанная стоимость воркера представляет собой сумму значений ResultRecord.gpu_h (worker_gpu_h_total), включая частичные результаты работающих задач с распределением нового времени между свежими ResultRecords, что используется для доказательства совокупных вычислений и правила холодного старта, но не для фиксированного отчетного знаменателя.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Расчетные единицы SU и учет затрат позволяют отслеживать вычислительную эффективность генерации и редизайна белков, связывая затраты ресурсов с появлением новых структурных кластеров.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Недавняя экспозиция классификатора вычисляется как сумма затрат записей в последнем окне из 60 результатов; знаменатель продуктивной ставки представляет собой наибольшее значение из этой суммы и 0.5 часа GPU, что сопряжено с недавним приростом онлайн SU (раздел C.4.2). Заряженное время без нового SU складывается из записанной стоимости воркера и прошедшего времени на работающих слотах воркеров за вычетом эталонной стоимости (раздел C.4.2), причем отрицательные значения заменяются нулем, а время работающих слотов опускается при обновлениях, фиксирующих новый SU. Эскалация состояния остановки и меры предосторожности базируются на времени без нового SU, а не на прошедшем реальном времени, причем член занятого слота может пересекаться со временем частичных результатов.&lt;/p&gt;\n&lt;p&gt;Стоимость точного маршрута охватывает производство, обязательную оценку и учтенные предковые варианты редизайна, каждый из которых учитывается внутри маршрута единожды. Для недавних просмотров маршрутов применяются 3- и 6-часовые GPU-окна результатов всей кампании до агрегации маршрутов для оценки специфической эффективности кандидатов, при этом общие предки делают затраты неаддитивными между маршрутами.&lt;/p&gt;\n&lt;p&gt;Новые онлайн SU и надежность кластеризации оцениваются по последнему приросту, который учитывает онлайн SU, впервые представленные в последних 60 ResultRecords. При каждом обновлении контроллер считает квалифицированные кластеры во всех записях и в записях, предшествующих этому окну, вычитая более ранний показатель из общего числа и заменяя отрицательные значения нулем с использованием текущих назначений кластеров. Классификация продуктивного состояния требует статуса кластеризации Foldseek ok, покрытия ≥ 0.999, доступной доли дубликатов и отсутствия сообщений о возврате от кластеризации цепей байнгера к кластеризации всего комплекса. Здесь покрытие — это доля квалифицированных ResultRecords, отнесенных к квалифицированным структурным кластерам, а не количество кластеров. Раздел C.4.5 описывает дополнительные условия прогресса и скорости. Положительное число близких промахов требует раздельной кластеризации со статусом ok или cached_ok и покрытием ≥ 0.999 среди записей близких промахов, в противном случае классификатор получает ноль, отключая ввод решения по близким промахам без доказательства их отсутствия.&lt;/p&gt;\n&lt;p&gt;Время без нового онлайн SU рассчитывается путем сканирования результатов в порядке архива для восстановления эталонной стоимости: если квалифицированный дизайн является первым участником своего кластера, эталон становится кумулятивной записанной стоимостью воркера до этого результата (ноль до первого SU). Если обновление сообщает о большем количестве онлайн SU, чем предыдущие, эталон равен текущей записанной стоимости воркера. Сигнал времени простоя представляет собой текущую записанную стоимость воркера плюс прошедшее время на работающих слотах за вычетом эталона (отрицательные значения заменяются нулем). Время работы суммируется с момента запуска задачи и опускается при обновлениях с новым SU, причем затраты частичных результатов не вычитаются, позволяя учитывать время двояко (раздел C.8.2) для обнаружения простоев по отличной от отчетного бюджета схеме (Таблица S6).&lt;/p&gt;\n&lt;h4 id=\"c43-onlajn-ocenka-kachestva-i-vspomogatelnye-pokazateli\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c43-onlajn-ocenka-kachestva-i-vspomogatelnye-pokazateli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.4.3. Онлайн-оценка качества и вспомогательные показатели&lt;/span&gt;&lt;/a&gt;C.4.3. Онлайн-оценка качества и вспомогательные показатели&lt;/h4&gt;\n&lt;p&gt;Для оценки качества дизайна используются маргинальные значения, которые показывают, насколько параметры конструкции превосходят квалификационные пороги. Каждый маркер делится на соответствующий допуск близости к прохождению: &lt;span class=\"yfm-latex\" data-content=\"u_p%20%3D%20%5Cmax%5C%7B0%2C%20(pLDDT%20-%2090)%2F5%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"u_i%20%3D%20%5Cmax%5C%7B0%2C%20(7%2F31%20-%20iPAE)%2F0.05%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и &lt;span class=\"yfm-latex\" data-content=\"u_s%20%3D%20%5Cmax%5C%7B0%2C%20(1.5%20-%20scRMSD)%2F0.3%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Каждое значение вносит вклад не более чем 3, а их сумма делится на 9 для получения итоговой оценки дизайна q, находящейся в диапазоне от 0 до 1 по формуле: &lt;span class=\"yfm-latex\" data-content=\"q%20%3D%20%5C%7B%5Cmin(u_p%2C%203)%20%2B%20%5Cmin(u_i%2C%203)%20%2B%20%5Cmin(u_s%2C%203)%5C%7D%2F9\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. В рамках каждого маршрута и онлайн-кластера Foldseek выбирается квалифицированный дизайн со всеми тремя измерениями и наибольшим q. Каждый кластер дает одно наблюдение качества, причем более поздний дизайн с более высоким баллом заменяет предыдущее наблюдение. Количество квалифицированных кластеров маршрута соответствует числу отобранных дизайнов, а их медиана и 25-й перцентиль сохраняются как strict_quality_median и strict_quality_p25. Семейная сводка копирует статистику качества маршрута с наивысшим 25-м перцентилем. Планировщик и Супервайзер используют эти данные для сравнения маршрутов, а окончательное определение атрибуции и чувствительности опирается на &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование перцентилей и маргинальных допусков позволяет гибко ранжировать белковые дизайны по степени их структурного совершенства.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Вспомогательный диагностический показатель улучшения оценивает, соответствуют ли дополнительные измерения пороговым требованиям качества или улучшились ли они по сравнению с прошлыми результатами. В Таблице S7 приведены параметры для конкретных источников, пороговые значения, допуски, веса и пределы приемлемости. Для каждого маршрута и измерения недавние наблюдения определяются как конечные значения в 6-часовом окне результатов графического процессора, а прошлые — как данные из более ранних записей. Измерение используется при наличии как минимум двух недавних наблюдений независимо от прохождения порога, либо одного наблюдения при условии преодоления порогового значения.&lt;/p&gt;\n&lt;p&gt;Дефицит представляет собой степень отклонения измерения от порога качества или ноль при его достижении. Нормализованный дефицит получается делением дефицита на допуск. На основе этого вычисляются текущее качество и улучшение. Текущее качество учитывает долю недавних наблюдений, достигших порога (балл 1.0), находящихся в пределах допуска (0.5) или ниже (0.0), деленную на общее число наблюдений. Улучшение оценивает снижение медианного нормализованного дефицита по сравнению с прошлыми данными. Полученные значения умножаются на вес из Таблицы S7 (1.0 для напрямую связанных параметров и 0.6 для прочих). Оценка маршрута равна наибольшему взвешенному значению среди его измерений и лежит в диапазоне от 0 до 1 с округлением до трех знаков. Общие вспомогательные сводки требуют не менее трех конечных наблюдений и проверяют пределы приемлемости из Таблицы S7, где неудачные значения фиксируются как сбои. Сводные данные по конкретным источникам и весовые коэффициенты для измерений подробно представлены в Таблице S7.&lt;/p&gt;\n&lt;h4 id=\"c44-pravila-statusov-marshrutov\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c44-pravila-statusov-marshrutov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.4.4. Правила статусов маршрутов&lt;/span&gt;&lt;/a&gt;C.4.4. Правила статусов маршрутов&lt;/h4&gt;\n&lt;p&gt;Каждый маршрут имеет общий статус (status) для оценки допуска и отсрочки, а также статус недавней продуктивности (marginal_status), разделяющий продолжающуюся, задержанную и снижающуюся отдачу. Оба параметра возвращают первое сработавшее правило из списка ниже и обрабатывают ожидающие оценки отдельно. Семейные агрегаты используют те же правила, за исключением того, что тест на 32 завершения отключен и не передается доля дубликатов для квалифицированных кластеров. Эти статусы описывают маршруты или семейства, а в разделе C.4.5 определяются состояния всей кампании.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Статус маршрута (status) и статус продуктивности (marginal_status) автоматически определяют жизнеспособность вычислительных ветток на основе затрат ресурсов, доли дубликатов и недавнего прироста SU (оплачиваемых единиц).&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Определения временных окон. Окно из 60 записей включает последние 60 записей результатов кампании ResultRecords; окна на 3 и 6 GPU-часов используют записанные затраты по всей кампании (раздел C.4.1). Прирост — это новые сетевые SU, зачисленные на маршрут в пределах указанного окна. Недавние близкие промахи (near misses) представляют собой отдельные записи о промахах в 60-записном окне с учетом кластерных проверок из раздела C.4.2. Затраты маршрута включают применимые затраты предков; пожизненные показатели используют всю наблюдаемую историю.&lt;/p&gt;\n&lt;p&gt;Метрики дублирования. Отношение Qualified/SU представляет собой количество квалифицированных записей маршрута, деленное на число зачисленных SU; это отношение недоступно, если количество SU равно нулю. Доля дубликатов маршрута рассчитывается по уравнению Eq. (S3), где Nassigned и Nclusters подсчитаны по совокупным записям маршрута, отнесенным к квалифицированным кластерам. Предупреждение о дубликатах означает, что Qualified/SU ≥ 8 или доля дубликатов ≥ 0.80. Отсутствующие метрики дублирования не могут удовлетворить пороговым тестам.&lt;/p&gt;\n&lt;p&gt;Сравнительный показатель. Лучший зрелый показатель (best mature rate) — это наибольший пожизненный показатель SU/GPU-h среди точных маршрутов, имеющих как минимум два зачисленных SU и два GPU-часа маршрута; если таковых нет, он равен нулю. Отсутствующие показатели приравниваются к нулю только для сравнений по правилам ниже.&lt;/p&gt;\n&lt;p&gt;Строки оценки структуры AF2. Строки оценки AF2 обходят приведенные ниже классификации генерации и редизайна. Стандартизированная оценка несет метку архива plumbing; код резервирует advisory для других ролей оценки, включая намеренный рефолдинг родительской модели.&lt;/p&gt;\n&lt;p&gt;Правила общего статуса:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;untried (непробованный): нет положительных накопленных затрат маршрута.&lt;/li&gt;\n&lt;li&gt;awaiting_score_conversion (ожидание конверсии оценки): нет зачисленных SU и есть хотя бы один перспективный валидный результат, ожидающий стандартизированной оценки AF2. Сигналы допуска определены в разделе C.8.1.&lt;/li&gt;\n&lt;li&gt;collapse_risk (риск коллапса): либо предупреждение о дубликатах, хотя бы один зачисленный SU, не менее восьми квалифицированных записей и отсутствие прироста SU за 60 записей или 6 GPU-часов; либо Qualified/SU ≥ 8, пожизненный показатель ≤ 0.30 и либо отсутствие прироста за 6 GPU-часов, либо положительный прирост за 60 записей.&lt;/li&gt;\n&lt;li&gt;defer (отсрочка): либо отсутствие пожизненных SU и недавних близких промахов при наличии не менее 3 GPU-часов маршрута или 32 завершенных ResultRecords; либо лучший зрелый показатель ≥ 0.50, не менее 3 GPU-часов маршрута, пожизненный показатель ниже 35% от этого лучшего показателя и отсутствие прироста за 60 записей, 6 GPU-часов или недавних близких промахов. Завершенные ResultRecords здесь имеют статус ok или no_artifacts; одна задача может производить несколько записей.&lt;/li&gt;\n&lt;li&gt;observed (stale) (наблюдаемый / устаревший): хотя бы один пожизненный SU, но нет прироста SU за 60 записей, 6 GPU-часов или недавних близких промахов при наличии хотя бы 1 GPU-часа маршрута в 60-записном окне.&lt;/li&gt;\n&lt;li&gt;diversify (диверсификация): хотя бы один пожизненный SU и либо Qualified/SU ≥ 4, либо доля дубликатов ≥ 0.55.&lt;/li&gt;\n&lt;li&gt;promote (продвижение): хотя бы один пожизненный SU, положительный лучший зрелый показатель и пожизненный показатель не менее 80% от этого компаратора. При отсутствии прироста SU за 60 записей значения Qualified/SU ≥ 8 или доля дубликатов ≥ 0.70 препятствуют продвижению.&lt;/li&gt;\n&lt;li&gt;healthy; otherwise observed (здоровый; иначе наблюдаемый): после применения предшествующих правил наличие хотя бы одного пожизненного SU или недавнего близкого промаха дает статус healthy; в противном случае — observed.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Статус недавней продуктивности (marginal_status):&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;untried; awaiting_score_conversion: применяются те же первые два теста, что и для классификации общего статуса.&lt;/li&gt;\n&lt;li&gt;under_tested; otherwise dry_low_quality (недотестированный; иначе сухой низкокачественный): для маршрута с нулевым пожизненным SU статус under_tested применяется, пока накопленные затраты маршрута составляют менее 3 GPU-часов и завершения составляют менее 32 ResultRecords, или пока существует недавний близкий промах. В противном случае используется dry_low_quality.&lt;/li&gt;\n&lt;li&gt;productive_but_duplicate (продуктивный, но с дубликатами): предупреждение о дубликатах и прирост SU в окне 60 записей или 3 GPU-часов.&lt;/li&gt;\n&lt;li&gt;delayed_productive; duplicate variant (отложенный продуктивный с вариантом-дубликатом): прирост SU в окне 6- GPU-часов, но его нет ни в окне 60 записей, ни в окне 3 GPU-часов. Предупреждение о дубликатах меняет метку на delayed_productive_duplicate.&lt;/li&gt;\n&lt;li&gt;dry_duplicate (сухой дубликат): предупреждение о дубликатах, отсутствие прироста SU за 3 или 6 GPU-часов и затухание недавней скорости: наличие хотя при этом показатель SU/GPU-h по окнам 60 записей и 3 GPU-часов составляет менее 35% от положительного пожизненного показателя.&lt;/li&gt;\n&lt;li&gt;productive (продуктивный): прирост SU в окне 60 записей или 3 GPU-часов.&lt;/li&gt;\n&lt;li&gt;dry; otherwise observed (сухой; иначе наблюдаемый): тот же тест на затухание недавней скорости и отсутствие прироста SU за 6 GPU-часов дают статус dry; все оставшиеся маршруты получают статус observed.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"c45-pravila-opredeleniya-sostoyaniya-kampanii\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c45-pravila-opredeleniya-sostoyaniya-kampanii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.4.5. Правила определения состояния кампании&lt;/span&gt;&lt;/a&gt;C.4.5. Правила определения состояния кампании&lt;/h4&gt;\n&lt;p&gt;Контроллер детерминированно присваивает одно из семи состояний кампании, основываясь на затратах ресурсов, недавних результатах, приросте SU (Structural Units), дубликатах, «почти успешных» результатах (near-misses), специфических дефицитах критериев и времени без новых SU. Метки состояний определяют приоритеты распределения задач. Состояние low_evidence направлено на сбор данных; productive — на продолжение эффективных путей; productive_duplicate добавляет диверсификацию; strict_duplicate_collapse поощряет альтернативные конфигурации генератора. rescue_rich перенаправляет ресурсы на критический параметр, stalled активирует Rescue или Explore, а deep_stall снижает приоритет неэффективных путей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SU (Structural Units) — это метрика качества или новизны структурных моделей, используемая для оценки прогресса генерации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Концентрация критериев вычисляется отдельно от количества near-miss. Для критерия a определяется медианный дефицит квалификации d_a среди последних 60 записей и допуск b_a. Классификатор использует показатель &lt;span class=\"yfm-latex\" data-content=\"C_%7Baxis%7D%20%3D%20%5Cmax_a(d_a%2Fb_a)%20%5Csum_a(d_a%2Fb_a)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, где значение 0,50 служит порогом для масштабированных медианных дефицитов. Решение принимается с учетом «холодного старта»: если затраты менее 1,0 GPU-ч или записей меньше трех, присваивается low_evidence. В ином случае проверяются правила: схлопывание структурных дубликатов, продуктивность (с дубликатами или без), обогащение near-miss, состояния stalled/deep_stall.&lt;/p&gt;\n&lt;p&gt;Состояние схлопывания требует надежной кластеризации, минимум 40 квалифицированных дизайнов, два кластера SU, в среднем 8 дизайнов на SU, накопленные затраты ≤ 0,30 SU/GPU-ч и недавний прирост SU ≤ 1. Отношение числа кластеров Foldseek (TM-score 0,8 к 0,6) должно быть ≤ 1,30. Продуктивность требует прироста &amp;gt; 0 и скорости ≥ 0,04 новых SU на GPU-ч (минимум 0,5 GPU-ч, Таблица S6). Доля дубликатов &amp;lt; 0,60 дает состояние productive, иначе — productive_duplicate. Состояние near-miss требует ≥ 3 кластеров и Caxis ≥ 0,50. При отсутствии прогресса в течение 12,0 GPU-ч система переходит в deep_stall.&lt;/p&gt;\n&lt;h4 id=\"c51-nastrojki-modeli-i-vyzovov\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c51-nastrojki-modeli-i-vyzovov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.5.1. Настройки модели и вызовов&lt;/span&gt;&lt;/a&gt;C.5.1. Настройки модели и вызовов&lt;/h4&gt;\n&lt;p&gt;Обе роли (Planner и Supervisor) использовали локальный чекпоинт Qwen3.6-27B-FP8 через vLLM на одном GPU H100 (Таблица S4). Лимит контекста составлял 65 536 токенов, использование памяти GPU — 0,90. Параметры вызова: max_tokens=3072, timeout_s=90, max_retries=1. Температура Planner составляла 0,2, Supervisor — 0,0. Уровень уверенности (confidence) ниже 0,55 фиксировался, но не приводил к отклонению ответа. Уверенность Supervisor ниже 0,65 могла активировать ограничения распределения. Каждый вызов логировался с сохранением идентификатора модели, хэша промпта (SHA-256), версии формата, статуса парсинга и количества токенов.&lt;/p&gt;\n&lt;h4 id=\"c52-soderzhimoe-vhodnyh-dannyh-i-zaprashivaemye-vyhody\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c52-soderzhimoe-vhodnyh-dannyh-i-zaprashivaemye-vyhody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.5.2. Содержимое входных данных и запрашиваемые выходы&lt;/span&gt;&lt;/a&gt;C.5.2. Содержимое входных данных и запрашиваемые выходы&lt;/h4&gt;\n&lt;p&gt;Ограничения на объем входных данных для LLM и их содержимое. Архивированная сводка данных (Evidence Summary) сохраняла до 32 точных строк маршрутов (routerows) и 20 сводок обновлений планирования (planning-updatesummaries). Второе сокращение предоставляло обеим LLM кумулятивные онлайн-тоталы TM0.6 SU, все сводки методов и строки маршрутов на уровне семейств, а также не более приоритетных точных маршрутов, десять протестированных сводок конфигураций (recipes), восемь сводок результатов стратегий (strategy_feedback), восемь связанных с конфигурациями дизайнов (exemplars), четыре иллюстративные записи результатов (examples) и десять записей истории обновлений (Рис. S2a; определения приведены в разделе C.4.1). Планировщик также получал до восьми активных или недавних карточек гипотез (HypothesisCards), доступные семейства действий, разрешенные настройки и ограничения рабочей нагрузки на задачу. Супервизор получал текущие карточки, допустимые задачи-кандидаты и контекст выбора, включая доступные слоты воркеров и недавние запускные события. Строки точных маршрутов предшествовали сводкам семейств. Процесс сокращения заменял полный список идентификаторов родителей счетчиком и флагом доступности; конкретные идентификаторы оставались доступными в выбранных примерах и для построения кандидатов.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS2.jpg\" alt=\"Рисунок S2 / Входные данные LLM и порядок планирования и выполнения.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок S2 / Входные данные LLM и порядок планирования и выполнения.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок S2 / Входные данные LLM и порядок планирования и выполнения. a, Сокращенная EvidenceSummary, включая состояние кампании, разделяется обеими LLM (лимиты: Раздел C.5.2; определения маршрутов и коллекций: Разделы C.2.2 и C.4.1). Планировщик дополнительно получает до восьми активных или недавних HypothesisCards, доступные семейства действий, разрешенные настройки и ограничения рабочей нагрузки; Супервайзер получает текущие HypothesisCards, действительные задания-кандидаты и контекст выбора. Явные ключи идентификатора цели и класса цели удалены из представления доказательств. b, Пурпурный цвет обозначает предложения LLM и расстановку приоритетов, коричневый — детерминированное создание и выбор кандидатов, синий — выполнение воркерами. Каждая EvidenceSummary архивируется перед условными вызовами LLM (Алгоритм S1). Поставленные в очередь задания могут начаться раньше; вхождение в очередь не гарантирует немедленный старт. Более поздние сводки включают решения, подтвержденные запуски и вновь записанные результаты. Обновления доказательств только для чтения до запуска задания не добавляют EvidenceSummary и не вызывают ни одну LLM.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Динамическая подготовка промптов включает фильтрацию и сжатие контекста: LLM получают строго регламентированный объем архивных данных, сводок маршрутов и карточек гипотез, что позволяет эффективно управлять токенами без потери ключевой логики.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Процесс рекурсивно удалял явные ключи целевых идентификаторов и целевых классов, пропускал скалярные значения и пустые строки верхнего уровня, но сохранял пустые коллекции доказательств (например, recipes и joint_patterns) и сводки методов с нулевым количеством попыток. Подобные пропуски не подразумевали импутацию измерений. Оба динамических промпта начинались с краткой выжимки доказательств (evidencedigest), за которой следовал JSON, специфичный для каждой роли. В разделе D.2.1 представлен отрывок архивированной сводки доказательств и реконструированный отрывок сокращенного входа, а не сохраненный полный промпт. Ни одна из ролей не читала произвольные файлы архива и не записывала измерения через этот интерфейс. На Рис. S2b подготовка входных данных, вызовы и последующие записи размещены в рамках обновления планирования.&lt;/p&gt;\n&lt;p&gt;Запрашиваемые выходы. Обе роли запрашивали один объект JSON без принудительного сервером форматирования JSON. Поля Планировщика включали abstain, confidence, rationale и cards, с опциональным полем fail_reason. Ответ Планировщика без воздержания от ответа должен был содержать от одной до четырех карточек, каждая из которых ссылалась на доказательства и определяла утверждение, аффинности R/E/X (относительные веса, используемые как подсказки приоритета), предсказанные изменения в одном или нескольких измерениях квалификации, ограничения на сохранение, предложенные семейства и опциональные настройки. Предсказанные изменения разделяли одни и те же упорядоченные базовые ссылки; раздел C.9 определяет их последующую оценку. В разделе D.2.2 приведены архивированная карточка и созданная на ее основе задача-кандидат. Супервизор возвращал смешивание режимов (mode_mixture) и ранжированный список кандидатских решений (candidate_decisions), содержащий поля воздержания, уверенности и обоснования.&lt;/p&gt;\n&lt;p&gt;Каждый возвращенный кандидат принадлежал к определенному приоритету, имел уникальные глобальные ранги от 1 до общего числа возвращенных элементов и уникальные положительные ранги внутри каждого приоритета. Значения распределения (allocation values) были конечными, неотрицательными и в сумме составляли единицу. Представленный ниже JSON иллюстрирует запрашиваемые поля для одного кандидата; строки в квадратных скобках являются заполнителями, а числовые значения носят иллюстративный характер. В разделе D.2.2 приводится реальный пример расстановки приоритетов.&lt;/p&gt;\n&lt;p&gt;Каждая карточка и решение запрашивали три коротких поля объяснения в reasoning_trace: наблюдаемый сигнал (observed_signal), вывод (inference) и следствие действия (action_implication). Это были отчетные объяснения, а не записи приватных рассуждений модели. Ответ Супервизора мог ранжировать лишь подмножество кандидатов, включая их полное отсутствие. Его классы ресурсов поддерживали аудит и разрешение спорных ситуаций (tie-breaking); границы распределения и выполнение оставались детерминированными (разделы C.7.1 и C.8.2).&lt;/p&gt;\n&lt;p&gt;Парсинг и валидация. Парсинг извлекал первый объект JSON и нормализовал распознанные варианты полей. Валидация Планировщика проверяла типы полей, ссылки на доказательства, направления измерений и аффинности приоритетов; недоступные семейства удалялись, а построение кандидатов обеспечивало соблюдение границ настроек. Валидация Супервизора проверяла ссылки на кандидатов и доказательства, значения распределения, назначения приоритетов, ранги и классы ресурсов. Отсутствующие поля объяснений Супервизора могли заполняться из возвращенных ссылок и текста объяснений. Исправления Планировщика носили детерминированный характер. Только ошибки Супервизора, связанные с дублированием кандидатов по приоритетам, недействительными глобальными рангами или неизвестными идентификаторами кандидатов, допускали один корректирующий вызов LLM. Ограниченный детерминированный ремонт мог затем удалить неизвестные строки кандидатов. Исправленные выходы повторно валидировались; непригодные к использованию ответы обрабатывались согласно разделу C.7.1.&lt;/p&gt;\n&lt;h4 id=\"c53-instrukcii-k-promptam\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c53-instrukcii-k-promptam\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.5.3. Инструкции к промптам&lt;/span&gt;&lt;/a&gt;C.5.3. Инструкции к промптам&lt;/h4&gt;\n&lt;p&gt;Каждая роль получает системный промпт, определяющий ее задачу, и динамический пользовательский промпт, содержащий текущие доказательства и входы, специфичные для роли (Рис. S2a). Блоки ниже суммируют реализованную кампанию: системные инструкции сжаты, тела входов схематичны, а корректирующее сообщение представляет собой отрывок шаблона. Они не являются полными историческими промптами, которые не архивировались. В схемах входов строки в квадратных скобках обозначают структурированные записи или текст, предоставляемый во время выполнения. В разделе C.5.2 указаны запрашиваемые выходные поля; в разделе D.2.2 представлены архивированные ответы и связанные задачи-кандидаты.&lt;/p&gt;\n&lt;h4 id=\"obshie-nauchnye-instrukcii-kratko\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#obshie-nauchnye-instrukcii-kratko\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общие научные инструкции (кратко)&lt;/span&gt;&lt;/a&gt;Общие научные инструкции (кратко)&lt;/h4&gt;\n&lt;p&gt;Стратегия принятия решений опиралась на предоставленные результаты и ограничения без предварительных допущений о природе мишеней или превосходстве конкретного метода. Целью являлось максимизацию новых единиц SU (специфического успеха) на затраченный рабочий слот-час (0.6 SU). При сопоставлении подходов и конфигураций в первую очередь учитывались точные недавние результаты по маршрутам и полные затраты на них (Таблица S6), а для учета задержек обратной связи применялись расширенные временные окна. Дубликаты квалификацию SU не повышали, а незапущенные задачи и отсутствующие измерения до завершения оценки трактовались как неопределенные данные, а не как отказы. Вспомогательные замеры использовались для планирования проверок, но не заменяли основные критерии SU. Применялись только разрешенные семейства действий и настройки, с возвратом единого JSON-объекта и трех полей reasoning_trace для пояснения сигналов и гипотез.&lt;/p&gt;\n&lt;p&gt;Затраты времени на уровне кампании измерялись в слот-часах GPU, включая простои, тогда как для сравнения маршрутов брались полные затраты (Таблица S6). Для недорогих маршрутов Complexa выделялось примерно 0.5 GPU-часов, а для сложных или отложенных задач (включая BindCraft, BoltzGen, ProteinMPNN redesign и Complexa MCTS) — от 1.5 до 2 GPU-часов, что служило ориентиром времени и задержек, а не жестким лимитом.&lt;/p&gt;\n&lt;h4 id=\"instrukcii-sistemnogo-planirovshika-kratko\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#instrukcii-sistemnogo-planirovshika-kratko\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Инструкции системного планировщика (кратко)&lt;/span&gt;&lt;/a&gt;Инструкции системного планировщика (кратко)&lt;/h4&gt;\n&lt;p&gt;Планировщик формировал от одной до четырех проверяемых гипотез на основе актуальных данных. Каждая гипотеза содержала утверждение, ссылки на данные, предлагаемые семейства действий, прогнозируемые изменения метрик (pLDDT, iPAE или scRMSD буфера) и сохраняемые параметры. Прогнозировался рост pLDDT при одновременном снижении iPAE и binder scRMSD относительно единых базовых линий. Для родительских задач требовались точные идентификаторы, а выявленные слабые стороны устранялись целенаправленно: передизайн последовательности или галлюцинация — для scRMSD, поиск по интерфейсу или остову — для iPAE, регенерация или поиск по pLDDT — для низких значений pLDDT при качественном интерфейсе.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Планировщик использует уровни иерархии L0–L4 как приоритеты гибкого поиска: от начального покрытия корней генератора (L0) и изменения настроек в семействе (L1) до передизайна родительских ветвей (L2), настройки весов наград (L3) и расширения дорогостоящего поиска (L4), что позволяет тестировать научные гипотезы, а не просто увеличивать объем вычислений.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Динамический пользовательский запрос планировщика представлял собой JSON-структуру с полями evidence, active_hypotheses, seed_action_families, available_families_this_cluster, family_role_table, allowed_params_per_family, eval_budget_per_family и instructions. Начальные семейства помогали получить первичное покрытие. Детерминированные флаги advisory передавались как recent_critic_flags_last_tick, не требуя дополнительного вызова Critic LLM (Раздел C.5.4), и служили исключительно для формирования предложений без правки архива.&lt;/p&gt;\n&lt;h4 id=\"instrukcii-i-prompty-dlya-supervizora\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#instrukcii-i-prompty-dlya-supervizora\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Инструкции и промпты для супервизора&lt;/span&gt;&lt;/a&gt;Инструкции и промпты для супервизора&lt;/h4&gt;\n&lt;p&gt;Модель супервизора использует актуальные данные, гипотетические карты и доступные кандидатные задачи для распределения долей ресурсов в рамках параметров R/E/X, а также для ранжирования задач. Эти доли должны быть конечными, неотрицательными и в сумме составлять ровно единицу, причем они касаются исключительно будущих запусков генерации и редизайна, а не долей времени графических процессоров (GPU). Для ранжирования разрешено использовать только предоставленные идентификаторы кандидатов, каждый из которых получает уникальный глобальный ранг от 1 до N. Первый ранг задает наивысший приоритет для следующего рабочего процесса. При прочих равных условиях система отдает предпочтение недавним новым единицам SU на полную стоимость точного маршрута. Если маршруты демонстрируют сопоставимую эффективность, выбирается вариант с более высоким значением нижнего квартиля оценки квалификационного запаса, а затем с более высокой медианой, как описано в Разделе C.4.3.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;R/E/X распределение — это метод управления вычислительными ресурсами и задачами искусственного интеллекта, где доли задаются в виде вероятностей или весов для оптимизации научных экспериментов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Разрежено заполненные счетчики учитываются с осторожностью, поскольку высокое качество не компенсирует серьезное отставание по эффективности. Инспекция специфических диагностических данных позволяет подобрать обоснованное продолжение работы без учета принятия нативным генератором в качестве квалификации. Предложенные доли должны соответствовать текущим приоритетам задач. Для интерпретации текущих потребностей используются состояние кампании, структурное дублирование, время отсутствия новых SU, ожидающие работы и подтвержденные запуски. Задача, которая была выбрана, но еще не запущена, считается находящейся в очереди на выполнение, а не провалившимся научным тестом. Обязательная оценка с помощью AF2 подчиняется детерминированным правилам и не входит в процесс распределения R/E/X силами языковой модели.&lt;/p&gt;\n&lt;p&gt;Динамический пользовательский промпт супервизора включает дайджест доказательств (EVIDENCEDIGEST), руководство по смешиванию (MIXTUREGUIDANCE), а также JSON-структуру с полями для доказательств, гипотез, кандидатов, контекста селектора, диапазонов смешивания и инструкций. В случае ошибки валидации может быть отправлено условное корректирующее сообщение с требованием повторной генерации JSON при условии соблюдения уникальности рангов для каждого идентификатора кандидата из разрешенного списка. Подобное исправление может отправляться однократно для ошибок ранжирования и ссылок, описанных в Разделе C.5.2.&lt;/p&gt;\n&lt;h4 id=\"usloviya-vyzovov-i-konsultativnye-proverki\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#usloviya-vyzovov-i-konsultativnye-proverki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Условия вызовов и консультативные проверки&lt;/span&gt;&lt;/a&gt;Условия вызовов и консультативные проверки&lt;/h4&gt;\n&lt;p&gt;Память планировщика, состоящая из восьми карт, использовала самую свежую запись для каждой карты с акцентом на активные элементы, а также недавние подтвержденные или опровергнутые карты, в то время как устаревшие карты исключались. Невалидные, пустые или нейтральные ответы не создавали новых карт, поэтому система опиралась на ранее сохраненные карты и кандидатов, введенных по фиксированным правилам. Опровергнутые или завершенные карты не могли генерировать новых кандидатов; статусы и жизненный цикл карт определены в Разделе C.9. Вызов супервизора осуществлялся при наличии непустого списка карт и пула валидных кандидатов, в противном случае контроллер фиксировал причину пропуска вызова, а дефектные ответы обрабатывались через механизм резервного копирования согласно Разделу C.7.1.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Детерминированная проверка — это алгоритмическая процедура верификации данных без использования вероятностных подходов языковых моделей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Включенная детерминированная консультативная проверка выполнялась для валидных ответов планировщика до срабатывания резервного копирования. Она выявляла семейства задач, чье предварительно рассчитанное время выполнения превышало оставшийся лимит времени работы системы. Также фиксировались конфигурации, совпадающие с сохраненными неудачными рецептами из того же семейства как минимум по двум общим настройкам, включая одну за пределами системных контролей. Все общие параметры должны были совпадать, неудачный рецепт обязан иметь по крайней мере двух потомков с неудачным исходом, а его хэш не должен был встречаться среди сохраненных успешных рецептов. Проверка не изменяла текущие карты, пул кандидатов, выборку и запуски. Флаги сохранялись как записи вызовов LLM с нулевым объемом токенов и нулевой задержкой, что описано в Таблице S15 (часть А).&lt;/p&gt;\n&lt;h4 id=\"konstruirovanie-i-validaciya-kandidatov\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#konstruirovanie-i-validaciya-kandidatov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конструирование и валидация кандидатов&lt;/span&gt;&lt;/a&gt;Конструирование и валидация кандидатов&lt;/h4&gt;\n&lt;p&gt;Процесс проверки и сборки (Check + Build) преобразует карты гипотез в кандидатные задачи путем сопоставления семейств действий, предложенных настроек и необходимых родительских элементов с реестром действий и архивом. Этап валидации сохраняет разрешенные настройки, удаляет неподдерживаемые элементы, ограничивает числовые значения допустимыми границами и уменьшает чрезмерно крупные рабочие нагрузки, если возможна коррекция (Таблица S5). Неисправимые задачи остаются недействительными. Редизайн родительских границ и оценка требуют наличия разрешимой структуры с валидными целевыми и связующими цепями. Детерминированные правила могут добавлять или заменять настройки, тогда как параметры по умолчанию заполняют только те поля, которые остались незаполненными. Раздел C.8 описывает последующие проверки очереди и времени запуска.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Валидация кандидатов — процедура автоматической проверки корректности параметров сгенерированных задач перед их допуском к вычислительным экспериментам.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"c62-dopolneniya-i-zameny-v-konfiguracii-complexa\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c62-dopolneniya-i-zameny-v-konfiguracii-complexa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.6.2. Дополнения и замены в конфигурации Complexa&lt;/span&gt;&lt;/a&gt;C.6.2. Дополнения и замены в конфигурации Complexa&lt;/h4&gt;\n&lt;p&gt;Настройка параметров по умолчанию и уточнение измерений. Основным показателем является метрика, указанная в первом предсказанном изменении в HypothesisCard; если оно отсутствует, по умолчанию используется iPAE. Если предсказаны изменения, но настройки не заданы, система применяет sequence hallucination для scRMSD связывающего домена или адаптивный шум для iPAE (sc_scale_noise = 0,30, если адаптивное значение недоступно). При включенной жадной оптимизации (greedy optimization) или наличии заданного количества итераций/процента, алгоритмом уточнения становится sequence hallucination. Для конфигураций без весов вознаграждения (reward weights) этот же алгоритм выбирается в состояниях застоя (stalled, deep-stall), при наличии «почти удачных» (near-miss) результатов или структурных дубликатов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sequence hallucination — это метод генерации последовательностей белков путем оптимизации их структуры, при котором алгоритм «галлюцинирует» (создает) новые аминокислотные последовательности, соответствующие заданной целевой структуре.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Изменение весов вознаграждения. Существенным поисковым изменением считается корректировка шума выборки, температуры, ширины луча (beam width), количества образцов или реплик, а также параметров MCTS. Веса вознаграждения удаляются, если количество наблюдений меньше 32, за исключением случаев, когда используется Complexa MCTS с уже имеющимся поисковым изменением. При 32 и более наблюдениях веса сохраняются. Для конфигураций «best-of-n» с более чем четырьмя репликами размер пакета (batch size) принудительно ограничивается восемью для экономии памяти.&lt;/p&gt;\n&lt;p&gt;Адаптивный шум выборки. Числовые значения добавляются как доля f от диапазона [L, U] по формуле L + (U - L)f. Значения округляются до целых или до четырех десятичных знаков. Для параметра sc_scale_noise доля f₀ определяется на основе долей неудачных (F_g) и успешных (S_g) наблюдений в группах (pLDDT, iPAE, scRMSD). Начальная доля f₀ варьируется от 0,50 до 0,85 в зависимости от порогов F_g и S_g. При наличии данных от ProteinMPNN (rMPNN) значение f₀ дополнительно ограничивается (например, до 0,50 при rMPNN ≥ 0,50). При отсутствии сигналов по умолчанию используется 0,55, повышаемое до 0,65 в состоянии глубокого застоя.&lt;/p&gt;\n&lt;p&gt;Упорядоченные дополнения параметров поиска. Если проверка вознаграждения требует изменений, система последовательно добавляет незаданные параметры: 1) Для Complexa MCTS добавляются n_simulations, exploration_prob и exploration_constant. 2) Для FK steering добавляется температура (0,45 при давлении дубликатов, 0,30 в ином случае). 3) Для остальных семейств Complexa при давлении дубликатов пробуются ширина луча (0,43) и реплики (0,60). 4) Для специфических метрик (iPAE, scRMSD, pLDDT) применяются индивидуальные комбинации ширины луча, шума и sequence hallucination. 5) В последнюю очередь применяются стандартные значения ширины луча (0,35), реплик (0,50) и шума (0,45).&lt;/p&gt;\n&lt;h4 id=\"c63-dopolnitelnye-kandidaty,-sozdavaemye-fiksirovannymi-pravilami\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c63-dopolnitelnye-kandidaty,-sozdavaemye-fiksirovannymi-pravilami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.6.3. Дополнительные кандидаты, создаваемые фиксированными правилами&lt;/span&gt;&lt;/a&gt;C.6.3. Дополнительные кандидаты, создаваемые фиксированными правилами&lt;/h4&gt;\n&lt;p&gt;PrespecifiedMCTSprobe. Построитель может дополнять задачи на основе карт кандидатами из этого пункта. Такие добавления подлежат валидации и отбору, а их наличие не делает запуск обязательным. В условиях состояния вне низкой доказательности система может добавить конфигурацию Complexa MCTS, адаптированную из настройки поискового вывода Proteina-Complexa для сложных мишеней (Didi et al., 2026b). Для этого правила требуется не менее шести рабочих GPU-часов без нового SU, а также либо конструкция, которая не проходит по pLDDT, но проходит по iPAE, либо сбой как минимум половины стандартных наблюдений pLDDT или вспомогательных binder-pLDDT, наряду с частотой прохождения или близкого к прохождению значения не менее 25% для стандартного iPAE, вспомогательного минимального iPAE, ipTM или среднего ipSAE. Применяется сигнал времени простоя из раздела C.4.2. Зонд использует 400 шагов диффузии, четыре выборки, размер батча 16, 20 симуляций MCTS, вероятность исследования 0.5, константу исследования 1.0 и предел фильтра 100. Веса наград для iPAE и pLDDT составляют соответственно -1.0 и 1.0; для sequence_hallucination используется жадная оптимизация, 15 итераций и greedy_percentage=5. Конфигурация и триггер едины для всех мишеней. Добавления прекращаются после накопления как минимум трёх маршрутных GPU-часов и двух записей ResultRecord со статусом ok или no_artifacts, если в сводке MCTS отсутствуют SU, недавние близкие промахи (near miss), вспомогательный балл улучшения диагностики ниже 0.35 и нет ожидающих стандартизированных оценок AF2. Эта проверка опирается на сводку семейств или на точный маршрут с наибольшими затратами при её отсутствии.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MCTS и pLDDT/iPAE — это методы поиска путей и метрики качества структуры белка (предсказание уверенности модели и ошибок выравнивания), помогающие отсеять неудачные варианты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ранее оцененные конфигурации. Если ни один валидный кандидат не предлагает перепроектирование parent-bound ProteinMPNN или повторное сворачивание AF2 с измененной моделью, настройками повторного использования или инициализации, построитель может повторно задействовать до трёх архивных конфигураций генерации. Используются строки точных маршрутов, исключая неиспытанные маршруты, маршруты только для оценки, маршруты с риском коллапса, а также уже представленные конфигурации. Маршруты с доказательствами SU или близких промахов предшествуют тем, которые имеют лишь вспомогательный прогресс. Их скорость SU/GPU-ч является первой доступной из окна в 3 GPU-часа, 6 GPU-часов или подходящего окна из 60 записей, за которой следует пожизненная скорость. При отсутствии недавних SU или близких промахов маршруту требуется не менее 0.10 SU/GPU-ч, и он исключается после как минимум одного маршрутного GPU-часа в любом недавнем окне. После 12 рабочих GPU-часов без нового SU он также исключается, если остаются только пожизненные данные или его скорость получена из окна в 60 записей без скорости или положительного числа SU из окон, основанных на затратах. Окна и маршруты определены в разделах C.4.1 и C.4.4. Маршрут, лишенный SU и близких промахов, может быть возвращен, если его результаты требуют отдельной оценки AF2, нет ожидающих оценок, вспомогательный балл улучшения диагностики составляет не менее 0.35, а накопленная стоимость маршрута не превышает 6 GPU-часов. Его статус общей производительности не должен быть dry_low_quality, dry_duplicate или collapse_risk. Маршруты с отсрочкой общего статуса допускаются только по этому правилу вспомогательного балла. Для обоих путей показатели по 60 записям используются только тогда, когда у маршрута нет ни зарегистрированной стоимости оценки AF2 вниз по течению, ни квалификационной роли AF2.&lt;/p&gt;\n&lt;p&gt;Кандидаты из других корней генератора. Доминирующим корнем является корень генератора (раздел C.2.2) с наибольшим накопленным временем GPU маршрута генератора (используются строки точных маршрутов, если они есть, и сводки семейств в противном случае); при равенстве выбирается имя корня, большее в лексикографическом порядке. Для данного правила доступности кандидатов текущие данные SU означают положительное число или скорость SU в любом маршруте или сводке семейств для этого корня в окне 3 или 6 GPU-часов. Подсчет или скорость по 60 записям также подходят до истечения 12 рабочих GPU-часов без нового SU, но только для маршрутов без затрат на оценку AF2 вниз по течению и без роли квалификации AF2. Эти окна и затраты соответствуют разделам C.4.1 и C.4.2. Когда это возможно, среди валидных задач-кандидатов, а также поставленных в очередь или выполняющихся задач представлены по меньшей мере два других корня, если выполняется любое из условий:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Состояние характеризуется низкой доказательностью или застоем, кумулятивные и недавние показатели SU равны нулю, накоплено не менее 0.10 зарегистрированных рабочих GPU-ч и одна запись ResultRecord, а доминирующий корень существует, но не имеет текущих доказательств SU.&lt;/li&gt;\n&lt;li&gt;Состояние представляет собой глубокий застой, и доминирующий корень не имеет текущих данных SU.&lt;/li&gt;\n&lt;li&gt;Состояние характеризуется застоем или коллапсом структурных дубликатов, прошло не менее шести рабочих GPU-часов без нового SU, а доминирующий корень не имеет текущих данных SU.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;В любом продуктивном состоянии меньшее требование подразумевает наличие одного другого корня, если недавний прирост SU положителен, по меньшей мере четыре из десяти предшествующих обновлений планирования были обновлениями глубокого застоя с нулевым приростом SU, а кумулятивная пропускная способность составляет не более 0.25 SU на рабочий GPU-ч. Недавний прирост рассчитывается по окну из 60 записей (раздел C.4.2). Дополнительный корень должен иметь неиспытанное или недостаточно протестированное семейство, семейство, ожидающее оценки AF2, либо семейство с SU, недавними близкими промахами, положительным SU/GPU-ч или вспомогательным баллом улучшения диагностики не менее 0.35. Условия времени без нового SU используют сигнал времени простоя, в то время как совокупная пропускная способность использует зарегистрированные затраты рабочей силы (Таблица S6).&lt;/p&gt;\n&lt;h4 id=\"c7-prioritezaciya-supervajzerom-i-determinirovannyj-otbor\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c7-prioritezaciya-supervajzerom-i-determinirovannyj-otbor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.7. Приоритезация супервайзером и детерминированный отбор&lt;/span&gt;&lt;/a&gt;C.7. Приоритезация супервайзером и детерминированный отбор&lt;/h4&gt;\n&lt;p&gt;Инструкции по ранжированию для супервайзером. Супервайзер ранжирует задачи-кандидаты по категориям Rescue, Explore и eXploit и предлагает желаемые пропорции их распределения. Ему предписано сравнивать точные маршруты по недавнему значению SU/GPU-ч, включая требуемые затраты на оценку. Когда меньшая из двух скоростей составляет не менее 85% от большей, он должен предпочесть более высокий 25-й перцентиль, а затем медиану оценки качества онлайн q (раздел C.4.3). Запрос требует проявлять осторожность при малом числе наблюдений или незначительных вычислительных ресурсах; он не налагает дополнительных минимальных требований к количеству выборок для этого сравнения. Вне этого диапазона качества показатель качества не превосходит эффективность. Маршрут с меньшей стоимостью должен предшествовать более дорогому, если он дает сопоставимое или большее значение SU/GPU-ч при адекватном качестве. Инструкции также требуют большей диверсификации после шести рабочих GPU-часов без новых SU и не рекомендуют считать близкие промахи достаточным прогрессом после двенадцати. После ограниченного восстановления из затяжного глубокого застоя они требуют продолжать рассмотрение другого корня генератора. Таковы указания для LLM; разделы C.6.3 и C.8.2 определяют отдельные правила доступности кандидатов и параллелизма. В разделе D.2.2 приведен пример архивной приоритизации.&lt;/p&gt;\n&lt;h4 id=\"c71-obrabotka-otvetov-i-granicy-raspredeleniya\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c71-obrabotka-otvetov-i-granicy-raspredeleniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.7.1. Обработка ответов и границы распределения&lt;/span&gt;&lt;/a&gt;C.7.1. Обработка ответов и границы распределения&lt;/h4&gt;\n&lt;p&gt;Таблица S8B различает пригодный глобальный порядок Супервизора (Supervisor), допустимые пропорции распределения без глобального порядка и резервный вариант (fallback). Передаваемая причина резервного варианта заменяет пропорции Супервизора на зависящие от состояния значения из части A и отключает его глобальный порядок. Сохраненные карточки по-прежнему могут предоставлять кандидатов. Если ответ сохраняет индивидуальные решения по кандидатам, их ранги в рамках приоритета и классы ресурсов могут участвовать в фиксированном упорядочении, описанном далее. Сбои, специфичные для конкретного кандидата, затрагивают только его. Запись уровня уверенности осуществляется в соответствии с разделом C.5.1.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Резервный вариант (fallback) и границы распределения — это защитные механизмы алгоритма, которые автоматически корректируют доли ресурсов (Rescue, Explore, eXploit) при сбоях или низкой надежности ответов языковой модели (LLM).&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Границы распределения. Желаемые пропорции нормализуются и корректируются с использованием базовых или условных границ из Таблицы S8C. Условные границы применяются при резервном варианте, состояниях установленного или структурного свертывания дубликатов (duplicate-collapse), когда структурная концентрация составляет не менее 0.50, когда сообщаемая уверенность Супервизора ниже 0.65, либо когда по меньшей мере 30% из последних четырех доступных записей вызовов LLM указывают на резервный вариант или синтаксический анализ со статусом не-OK. Отсутствие данных об уверенности и глубокий застой (deep stall) сами по себе их не активируют. Эти границы ограничивают желаемые доли последующих подтвержденных запусков; глобальный порядок и доступность кандидатов могут изменять реализованные доли запусков и затраты времени GPU. Структурная концентрация представляет собой большую из доступных долей доминирующего кластера в последних 60 записях ResultRecords: среди всех записей с онлайн-структурным назначением или среди квалифицированных записей с назначением квалифицированного кластера. Квалифицированная доля используется только при наличии по меньшей мере четырех назначенных квалифицированных записей (это записи, а не четыре отдельных SU). В условиях условных границ концентрация ≥ 0.50 в любом продуктивном наборе состояний устанавливает верхний предел eXploit на уровне 0.60, а интервал Explore на уровне 0.20–0.40, сохраняя остальные границы. В состоянии, обогащенном близкими промахами (near-miss-enriched), концентрация ≥ 0.70 повышает верхний предел Explore до 0.50, сохраняя нижний предел Rescue. Эти пороги отличаются от теста состояния застоя со значением 0.75 в разделе C.4.5.&lt;/p&gt;\n&lt;h4 id=\"rescue-explore-exploit-spasenie,-issledovanie,-ekspluataciya\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#rescue-explore-exploit-spasenie,-issledovanie,-ekspluataciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rescue Explore eXploit (Спасение, Исследование, Эксплуатация)&lt;/span&gt;&lt;/a&gt;Rescue Explore eXploit (Спасение, Исследование, Эксплуатация)&lt;/h4&gt;\n&lt;p&gt;Низкие свидетельства 0.30 0.35 0.35&lt;br /&gt;\nПродуктивное 0.25 0.10 0.65&lt;br /&gt;\nПродуктивное с дублированием 0.35 0.10 0.55&lt;br /&gt;\nСтруктурное свертывание дубликатов 0.15 0.75 0.10&lt;br /&gt;\nОбогащенное близкими промахами 0.50 0.20 0.30&lt;br /&gt;\nЗастойное 0.35 0.45 0.20&lt;br /&gt;\nГлубокий застой 0.30 0.50 0.20&lt;/p&gt;\n&lt;h4 id=\"b-obrabotka-sboev-i-razreshenie-politiki-otbora\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#b-obrabotka-sboev-i-razreshenie-politiki-otbora\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;B. Обработка сбоев и разрешение политики отбора&lt;/span&gt;&lt;/a&gt;B. Обработка сбоев и разрешение политики отбора&lt;/h4&gt;\n&lt;p&gt;Разрешенный путь — Поведение при отборе. Действительные глобальные ранги Супервизора без переданной причины резервного варианта: используется его пропорции распределения и текущий глобальный порядок (более короткий порядок ранжирует только возвращенный поднабор). Действительные пропорции без пригодного глобального порядка и без причины резервного варианта: пригодный глобальный порядок отсутствует, скорректированные пропорции и переносимая разница распределения определяют квоты приоритетов. Недействительный или воздерживающийся Супервизор: используются зависящие от состояния резервные пропорции и выбор квот, глобальный порядок не применяется. Причина Планировщика (planner_invalid, planner_abstain или planner_empty_cards): эти причины распространяются даже через действительный ответ Супервизора — используются резервные пропорции и отключается глобальное упорядочение (сохраненные ранги внутри приоритетов могут участвовать в фиксированном упорядочении пула, раздел C.7.2), остальные строковые причины Планировщика сами по себе не активируют это распространение. Один кандидат не проходит проверку соответствия или живого запуска: этот кандидат отклоняется или откладывается, остальные предложения сохраняют собственные проверки (это событие само по себе не создает глобальный резервный ответ). Низкая уверенность при действительной выдаче: сохраняется обычный путь ответа, проводится аудит уверенности и применяются тесты с отдельными условными границами.&lt;/p&gt;\n&lt;h4 id=\"c-granicy-normalizovannyh-zhelaemyh-proporcij-raspredeleniya\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c-granicy-normalizovannyh-zhelaemyh-proporcij-raspredeleniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C. Границы нормализованных желаемых пропорций распределения&lt;/span&gt;&lt;/a&gt;C. Границы нормализованных желаемых пропорций распределения&lt;/h4&gt;\n&lt;p&gt;Состояние кампании — Базовые границы — Условные границы. Низкие свидетельства: E ≥ 0.05 / E ≥ 0.05. Продуктивное: X ≤ 0.95, E ≥ 0.05 / 0.45 ≤ X ≤ 0.80, R ≥ 0.10, 0.05 ≤ E ≤ 0.20. Продуктивное с дублированием: X ≤ 0.90, E ≥ 0.05 / 0.40 ≤ X ≤ 0.70, R ≥ 0.20, 0.05 ≤ E ≤ 0.30. Структурное свертывание дубликатов: X ≤ 0.30, E ≥ 0.45 / X ≤ 0.20, R ≤ 0.30, E ≥ 0.55. Обогащенное близкими промахами: R ≥ 0.10 / R ≥ 0.40, E ≤ 0.30. Застойное: X ≤ 0.35, R ≥ 0.25, E ≥ 0.25 / то же, что и базовые границы, условные границы применяются всегда. Глубокий застой: X ≤ 0.40, E ≥ 0.35 / X ≤ 0.30, R ≥ 0.15, E ≥ 0.45.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Ожидающие выполнения задания AlphaFold2 (AF2) и правила емкости очередей позволяют динамически отменять нижний предел Rescue при высокой нагрузке, используя расчет отношения счетчика к емкости.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ожидающие задания AF2 и отмена нижнего предела Rescue (Rescue-floor waiver). Для обновления с K^* дополнительными позициями в очереди эта проверка использует емкость &lt;span class=\"yfm-latex\" data-content=\"4%20%5Cmax(1%2C%20K%5E*)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Подсчитываются отдельные выбранные или запущенные задания кандидатов AF2 без связанной записи ResultRecord. Записанные сбои диспетчеризации или синтаксического анализа удаляют кандидатов, за исключением отсрочек, вызванных лимитом запущенных заданий с высокой стоимостью. При отношении счетчика к емкости ≥ 0.95 нижний предел Rescue отменяется. Этот подсчет отделен от длины очереди готовых элементов и количества не оцененных дизайнов (раздел C.8.1). Контроллер обрезает пропорции, выходящие за рамки, до их границ и перераспределяет оставшуюся долю пропорционально среди приоритетов, не удерживаемых на границе; нулевой оставшийся входной вес дает равные доли. Коррекция повторяется не более чем за пять проходов. Эти корректировки изменяют целевые показатели распределения, не меняя валидность кандидатов. Емкость очереди и доступность воркеров остаются раздельными величинами (Алгоритм S1).&lt;/p&gt;\n&lt;h4 id=\"c72-puly-kandidatov-i-uporyadochivanie\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c72-puly-kandidatov-i-uporyadochivanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.7.2. Пулы кандидатов и упорядочивание&lt;/span&gt;&lt;/a&gt;C.7.2. Пулы кандидатов и упорядочивание&lt;/h4&gt;\n&lt;p&gt;Глобальный порядок и оставшиеся позиции. Рабочий глобальный порядок назначает уникальные положительные ранги идентификаторам кандидатов из валидного ответа Супервизора, причем он не обязан включать абсолютно каждого кандидата. Селектор изучает этот подмножественный набор сначала по глобальному рангу, а затем по стабильному идентификатору кандидата, с учетом проверок валидации и лимитов высоких затрат. Штрафы по семействам/маршрутам и квоты не меняют порядок этого подмножества. Оставшиеся места в очереди могут заполняться из других валидных кандидатов на основе фиксированного порядка, описанного ниже. При отсутствии рабочего глобального порядка распределение квот определяет, сколько позиций получает каждый приоритет. Приоритеты кандидатов используют назначения Супервизора, если они применимы, либо сродство по Гипотез-Картам (Hypothesis Card); кандидаты без назначения могут занимать иначе пустующие места. Процедура отбора определяет допуск в очередь, а окончательное упорядочение перед запуском воркеров регламентировано в разделе C.8.2.&lt;/p&gt;\n&lt;h4 id=\"c72-nomzodlar-pullari-va-tartibga-solish\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c72-nomzodlar-pullari-va-tartibga-solish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.7.2. Номзодлар пуллари ва тартибга солиш&lt;/span&gt;&lt;/a&gt;C.7.2. Номзодлар пуллари ва тартибга солиш&lt;/h4&gt;\n&lt;p&gt;Глобал тартиб ва қолган позициялар. Яроули глобал тартиб Супервизорнинг жорий яроули жавобидан қайтарилган номзод идентификаторларига ноёб мусбат рангларни тайинлайди, бунда у ҳар бир номзодни ўз ичига олиши шарт эмас. Селектор бу кичик тўпни аввал глобал ранг, сўнг барқарор идентификатор тартиби бўйича, валидация ва юқори харажат лимитларини ҳисобга олган ҳоқда кўриб чиқади. Оила/маршрут жарималари ва квоталар бу кичик тўп тартибини ўзгартирмайди. Навбатдаги қолган ўринлар қуйидаги белгиланган тартиб асосида бошқа яроули номзодлардан тўлдирилиши мумкин. Яроули глобал тартиб бўлмаганда, квоталарни тақсимлаш ҳар бир устуворликка қанча позиция берилишини белгилайди. Номзодлар устуворликлари тегишли бўлса Супервизор тайинлашларидан, акс ҳолда Гипотеза-Карта (Hypothesis Card) яқинликларидан фойдаланади; тайинлашга эга бўлмаган номзодлар бўш қолган ўринларни эгаллаши мумкин. Танлов навбатга киришни белгилайди, ишчиларни ишга туширишдан олдинги тартиб эса C.8.2-бўлимга мувофиқ амалга оширилади.&lt;/p&gt;\n&lt;h4 id=\"c72-kandidattar-puly-zhaene-retteu\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c72-kandidattar-puly-zhaene-retteu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.7.2. Кандидаттар пулы және реттеу&lt;/span&gt;&lt;/a&gt;C.7.2. Кандидаттар пулы және реттеу&lt;/h4&gt;\n&lt;p&gt;Жаһандық рет және қалған позициялар. Жұмыс істейтін жаһандық рет Супервизордың жарамды жауабынан қайтарылған кандидат идентификаторларына бірегей оң рангтерді тағайындайды, бұл ретте ол әрбір кандидатты қамтуға міндетті емес. Селектор бұл ішкі жиынды алдымен жаһандық ранг, содан кейін тұрақты идентификатор реті бойынша, вандализм мен жоғары шығын лимиттерін ескере отырып қарастырады. Отбасы/маршрут айыппұлдары мен квоталар бұл ішкі жиынның ретін өзгертпейді. Кезектің қалған орындары төменде сипатталған бекітілген рет негізінде басқа жарамды кандидаттармен толтырылуы мүмкін. Жарамды жаһандық рет болмаған кезде, квоталарды бөлу әрбір басымдыққа қанша позиция берілетінін анықтайды. Кандидаттардың басымдықтары тиісті болса Супервизор тағайындауларын, ал кері жағдайда Гипотеза-Карта (Hypothesis Card) жақындықтарын пайдаланады; тағайындауы жоқ кандидаттар бос қалған орындарды ала алады. Іріктеу кезекке кіруді анықтайды, ал жұмысшыларды іске қосу алдындагы рет C.8.2-бөлімге сәйкес жүзеге асырылады.&lt;/p&gt;\n&lt;h4 id=\"c73-raspredelenie-po-zapuskam-i-kvotnye-zashitnye-mehanizmy\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c73-raspredelenie-po-zapuskam-i-kvotnye-zashitnye-mehanizmy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.7.3. Распределение по запускам и квотные защитные механизмы&lt;/span&gt;&lt;/a&gt;C.7.3. Распределение по запускам и квотные защитные механизмы&lt;/h4&gt;\n&lt;p&gt;Разница перенесенного распределения. Для скорректированных пропорций p = (p_R, p_E, p_X) контроллер восстанавливает разницу перенесенного распределения d на основе архивных решений и запусков. При каждом архивном обновлении он добавляет пропорции этого обновления, умноженные на наибольшее значение из двух величин: количество одобренных намерений запустить генерацию/редизайн или количество связанных подтвержденных запусков, после чего вычитает единицу для каждого подтвержденного запуска из соответствующего приоритета. Каждый компонент ограничивается диапазоном [-3, 3] после каждого обновления. Таким образом, одобренное или поставленное в очередь задание, которое так и не запускается, не учитывается как реализованное распределение. Обновления глобального порядка вносят свои пропорции и запуски в ту же реконструкцию, хотя квоты не управляют их непосредственным выбором. Для обновления квоты с K^* позициями временные разницы распределения составляют d_m + K^* p_m для &lt;span class=\"yfm-latex\" data-content=\"m%20%5Cin%20%5C%7BR%2C%20E%2C%20X%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; с ограничением в [-3, 3]. Каждая позиция назначается подходящему приоритету с наибольшей разницей; при равенстве после округления до шести знаков после запятой предпочтение отдается большему p_m, а затем категориям eXploit, Rescue, Explore. Каждое назначение вычитает единицу из этой временной разницы. Такие предварительные вычитания распределяют текущие квоты; последующая реконструкция использует подтвержденные запуски. Приоритеты без подходящих кандидатов квоту не получают, а неиспользованные позиции могут быть задействованы в соответствии с Разделом C.7.2.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Разница перенесенного распределения и квоты — это алгоритмический механизм балансировки ресурсов, который отслеживает нереализованные задачи и гарантирует, что приоритеты не исчерпают лимиты из-за простаивающих заданий.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Поддержание продуктивных вычислений. На пути квот одна позиция eXploit может быть сохранена в продуктивном состоянии, состоянии продуктивности с дублированием или состоянии обогащения близких к успеху результатов (near-miss-enriched), если время простоя составляет не более 6 worker GPU-ч, предыдущее распределение eXploit не было превышено более чем на один запуск, а подходящий кандидат имеет положительный маршрут или недавнюю семейную производительность SU/GPU-ч. Повторно используемые конфигурации с меткой dry_duplicate без положительной скорости 3-GPU-часа или прироста SU за 3/6-GPU-часа не могут претендовать на квоту исключительно на основе скорости маршрута. Коллапс структурных дубликатов предотвращает этот защитный механизм. Время простоя определяется в соответствии с Разделом C.4.2. При наличии по меньшей мере трех позиций, времени простоя не более 3 worker GPU-ч и пропускной способности кампании не менее 0.50 SU/GPU-ч либо прироста SU не менее чем на два, квота может сохранить две позиции eXploit. Прирост представляет собой увеличение по сравнению с предыдущим наибольшим кумулятивным значением SU или прирост по 60 записям, когда такое увеличение равно нулю или недоступно. Оба ведущих кандидата eXploit должны находиться вне высокозатратного семейства, иметь низкую, диагностическую или стандартную расчетную стоимость, избегать упомянутого выше исключения для повторно используемых конфигураций и иметь пропускную способность маршрута или недавнего семейства ≥ 0.50 SU/GPU-ч. Требуемые оценки AF2 не могут обеспечивать эти позиции.&lt;/p&gt;\n&lt;p&gt;Сохранение кандидата от кросс-генератора. После обычного отбора путь квот может сохранить одного кандидата, добавленного правилом кросс-генератора из Раздела C.6.3. Он заполняет неиспользованную позицию или заменяет кандидата, у которого отсутствует внутриприоритетный ранг Руководителя, равный единице. Такой кандидат от BindCraft, BoltzGen или ProteinMPNN не восстанавливается из пула отложенных по маршруту, если его семейство имеет хотя бы source ResultRecords без связанного стандартизированного результата AF2 и по крайней мере четыре с таковым, при отсутствии семейного или соответствующего по маршруту SU или близкого к успеху результата, а также при отсутствии перспективной ожидающей структуры. Это ограничение применяется как к защитному механизму кросс-генераторов, так и к обычному заполнению из этого пула. Проверки валидности времени запуска и емкости по-прежнему выполняются согласно Разделу C.8.2.&lt;/p&gt;\n&lt;h4 id=\"c8-dopusk-k-ocenke-i-vypolnenie-vorkerom\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c8-dopusk-k-ocenke-i-vypolnenie-vorkerom\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.8. Допуск к оценке и выполнение воркером&lt;/span&gt;&lt;/a&gt;C.8. Допуск к оценке и выполнение воркером&lt;/h4&gt;\n&lt;p&gt;Генерация, редизайн и стандартизированная оценка AF2 используют три общие воркерные GPU. Допуск к оценке определяет, какие проекты попадают в общий протокол квалификации; управление очередью определяет, когда запускаются их задания. Рис. S2b и Алгоритм S1 демонстрируют эти раздельные шаги. Проекты, ожидающие оценки, остаются в статусе ожидающих, не засчитываясь как сбои квалификации.&lt;/p&gt;\n&lt;h4 id=\"c81-standartizirovannaya-ocenka-af2-dopusk-i-proizvoditelnost\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c81-standartizirovannaya-ocenka-af2-dopusk-i-proizvoditelnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.8.1. Стандартизированная оценка AF2: допуск и производительность&lt;/span&gt;&lt;/a&gt;C.8.1. Стандартизированная оценка AF2: допуск и производительность&lt;/h4&gt;\n&lt;p&gt;Контроллер планирует стандартизированную оценку AlphaFold2 параллельно с генерацией и редизайном, используя нативные метрики и прошлые результаты маршрутов для приоритизации входных данных. Семейство источников оценки представляет собой группу генерации или редизайна, которая создала входной объект. Структура типа BindCraft или Complexa считается нативно-подобной при генераторном pLDDT ≥ 90 в диапазоне 0–100, нормализованном iPAE ≤ 7/31 и RMSD или scRMSD связавшегося объекта &amp;lt; 1.5 Å. Для других инструментов определены отдельные сигналы перспективности (proxy-promising): для BindCraft это принятый генератором выход либо объект со всеми тремя нативными измерениями и максимум одним критерием за пределами допусков near-pass; для BoltzGen — как минимум два из следующих параметров: ipTM дизайна ≥ 0.80, ipTM дизайн-цель ≥ 0.65, интерфейсный ipTM ≥ 0.65, минимальный PAE дизайн-цель &lt;span class=\"yfm-latex\" data-content=\"%5C7\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; Å, структурная уверенность ≥ 0.75 и RMSD нативного рефолдинга &amp;lt; 2.0 Å; для ProteinMPNN — глобальный или локальный отрицательный логарифм правдоподобия на остаток ≤ 1.20 при восстановлении последовательности от 0.15 до 0.85 включительно либо без указания этого показателя.&lt;/p&gt;\n&lt;p&gt;Наивысший приоритет оценки присваивается входах, если они нативно-подобны, их точный маршрут имеет статус promote, зафиксирован недавний прирост SU, положительная доля выбранных маршрутов или недавний near miss при статусе healthy. Внутри каждого маршрута такие входы идут перед перспективными прокси-объектами, тогда как diversifiy и defer/collapse_risk получают более низкий приоритет. Нативные оценки и стабильные идентификаторы разрешают ничьи. Накопительный лимит для каждого точного вышестоящего маршрута изначально составляет четыре стандартизированные оценки AF2 и может увеличиваться до 8, 16, 32, 64 и далее удваиваться при улучшении доказательной базы. Переход от четырех к восьми позволяет добавить не прибегая к обходу правил максимум четыре оценки. Для повышения лимита на завершенной границе контроллер сравнивает текущую сводку с наиболее ранней сводкой, чей счет не превышает предыдущую границу (ноль для перехода 4–8 или до четырех для 8–16). При этом хотя бы один из шести показателей должен возрасти: SU маршрута, число индивидуальных результатов near-miss, число квалифицированных кластеров, 25-й перцентиль или медиана онлайн-показателя качества, либо вспомогательный диагностический балл улучшения. Рост показателей должен превышать 10⁻⁶, а диагностический балл сохраняется с точностью до трех знаков после запятой.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Стандартизированная оценка AlphaFold2 (AF2 evaluation) и метрики вроде pLDDT, iPAE, RMSD, ipTM и PAE применяются для автоматической фильтрации и приоритизации наиболее качественных белковых структур, сгенерированных нейросетевыми алгоритмами
