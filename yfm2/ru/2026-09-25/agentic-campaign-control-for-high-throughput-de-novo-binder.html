перед их физическим синтезом.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Обычный допуск разрешает не более 24 в настоящее время неподдерживаемых оценок на семейство источников оценки, с учетом запущенных и уже выбранных задач. Общее число одобрений семейства по одному идентификатору обновления планирования сравнивается с лимитом в четыре для неподдерживаемого кандидата или шестнадцать для кандидата с подтвержденной доказательной базой; данные квоты не суммируются. После регистрации как минимум 20 запусков система резервирования сопоставляет количество запусков стандартизированного AF2 среди последних 40 доступных с лимитом в 24 (снижается до 20 в состояниях продуктивного дублирования или схлопывания структурных дубликатов). До достижения 20 запусков лимиты составляют 12 и 10 соответственно. Если этот бюджет исчерпан, доступные нативно-подобные входы позволяют сделать исключение максимум для двух позиций или для одной позиции в состоянии глубокого застоя, в противном случае один вход допускается при соответствии критериям proxy-promising или наивысшего приоритета.&lt;/p&gt;\n&lt;h4 id=\"bronirovanie-ocheredej\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#bronirovanie-ocheredej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бронирование очередей&lt;/span&gt;&lt;/a&gt;Бронирование очередей&lt;/h4&gt;\n&lt;p&gt;Задачи AlphaFold2 (AF2) могут размещаться в начале очереди перед распределением, а также повторно в ходе её пополнения. Эти проходы используют свободные воркереры &lt;span class=\"yfm-latex\" data-content=\"F(%5Cmathcal%7BW%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и пространство очереди &lt;span class=\"yfm-latex\" data-content=\"K(%5Cmathcal%7BQ%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; соответственно; первый метод способен временно увеличивать глубину очереди выше целевого значения. Оба прохода разделяют общий лимит на один вызов за цикл, который увеличивается до двух, если количество ожидающих вывода данных достигает 32. Для подсчета этого количества используются нативные или прокси-перспективные результаты при их наличии, в противном случае учитываются все подходящие необработанные результаты. Каждый проход вычитает из установленного лимита как предыдущие брони в текущем цикле, так и уже выполняющиеся задачи AF2 (Алгоритм S1). Наличие задачи AF2 в очереди исключает создание новой брони. Каждый проход также проверяет доступные позиции и подходящие задачи-кандидаты.&lt;/p&gt;\n&lt;p&gt;Локальный предел составляет не более половины таких позиций с округлением вверх и оставляет одну позицию не забронированной, если доступны две или более. Увеличение лимита с одного до двух требует наличия 32 подходящих кандидатов в данном проходе, поэтому при конфигурации с тремя воркерами каждый проход принимает не более одного кандидата. В условиях глубокого застоя общий лимит равен единице, если подходящий результат всё еще ожидает оценки AF2; наличие нативных свидетельств при этом не требуется. Избыточные забронированные в очереди задачи AF2 отменяются при переходе обновленного состояния в режим глубокого застоя. Для оценки может использоваться одна свободная позиция при наличии неоцененного результата; в противном случае она оставляется для генерации или редизайна. Описанные правила резервируют именно позиции в очереди, а не закрепляют графический ускоритель за оценкой на постоянной основе.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бронирование очередей и лимиты в алгоритмах AlphaFold2&lt;br /&gt;\nЭто механика динамического управления нагрузкой и распределения вычислительных ресурсов, где задачи занимают места в очереди с учетом доступных воркеров, ограничений по семействам и текущего состояния системы (например, глубокого застоя).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zapolnenie-svobodnyh-pozicij-ocheredi\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#zapolnenie-svobodnyh-pozicij-ocheredi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заполнение свободных позиций очереди&lt;/span&gt;&lt;/a&gt;Заполнение свободных позиций очереди&lt;/h4&gt;\n&lt;p&gt;После отбора этапов генерации и редизайна может быть добавлена одна задача AF2, если в очереди остаются свободные места, система не находится в состоянии глубокого застоя, а стандартные задачи AF2 не стоят в очереди и не выполняются. Этот путь сначала использует стандартные квоты маршрутов. Если они не дают кандидатов, система может выбрать кандидата из маршрута с исчерпанной квотой, обходя при этом кумулятивное ограничение на неподдерживаемые семейства. Ограничения по семействам для каждого обновления и проверки при запуске продолжают действовать. Данное исключение задействует свободную емкость очереди; оно не создает улучшенных доказательств и не удваивает квоту маршрута.&lt;/p&gt;\n&lt;h4 id=\"c82-ochered-dopuska,-zapuski-i-sbor-rezultatov\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c82-ochered-dopuska,-zapuski-i-sbor-rezultatov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.8.2. Очередь допуска, запуски и сбор результатов&lt;/span&gt;&lt;/a&gt;C.8.2. Очередь допуска, запуски и сбор результатов&lt;/h4&gt;\n&lt;p&gt;Пополнение очереди. Заказ кандидатов и их распределение выполняются согласно разделам C.7.2 и C.7.3 с проверкой из раздела C.6. Емкость очереди &lt;span class=\"yfm-latex\" data-content=\"K(%5Cmathcal%7BQ%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и свободные воркеры &lt;span class=\"yfm-latex\" data-content=\"F(%5Cmathcal%7BW%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; определены в алгоритме Алгоритм S1. Планировщик может пополнять очередь, когда все воркеры заняты, после прибытия первого целевого объекта &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pcqaz64n\"&gt;ResultRecord&lt;/code&gt;; до этого момента пополнение приостанавливается, если занят каждый воркер. Задания в очереди могут запускаться до новых вызовов планировщика и снова после пополнения очереди в двух точках диспетчеризации алгоритма.&lt;/p&gt;\n&lt;p&gt;Порядок очереди и новые данные. Перед диспетчеризацией в первую очередь направляются необходимые задачи AF2. Задания генерации и редизайна следуют за ними согласно зарегистрированным аннотациям: свежие данные SU или околоуспешные (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8rrlrezg\"&gt;near-miss&lt;/code&gt;) результаты, диагностические улучшения, обычные предложения и, в последнюю очередь, повторно используемые конфигурации, поддерживаемые только историческими данными за все время (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tgbdd5bf\"&gt;lifetime evidence&lt;/code&gt;). Внутри группы задания с записями выбора (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r391cr2p\"&gt;selection records&lt;/code&gt;) предшествуют заданиям без них; более свежие обновления выбора идут первыми, а существующий порядок в очереди разрешает ничьи. Такой порядок использует аннотации в записях кандидатов и выбора вместо пересчета оценок маршрутов. Новые результаты или изменение состояния сами по себе не удаляют обычные задания из очереди. Исключение составляют задания, выбранные при низких доказательствах до появления каких-либо результатов: как только поступает первый результат, эти задания удаляются, чтобы планировщик мог использовать новые данные.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;BindCraft — это ресурсоемкий метод протеинового дизайна, для которого действуют строгие лимиты одновременного запуска, зависящие от накопленных вычислительных затрат и успешности прошлых итераций.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ограничение параллелизма BindCraft. BindCraft является семейством с высокими затратами, для которого установлен обычный лимит в одно запущенное задание. Когда выборка имеет более одной позиции в очереди для заполнения, по крайней мере одна позиция удерживается от BindCraft; это ограничение применяется, даже если альтернатива отсутствует. Пул из трех воркеров также позволяет выполнять не более двух одновременных заданий BindCraft. Для этой проверки параллелизма текущие доказательства маршрута означают положительное число SU в окне 3 или 6 GPU-часов, положительную скорость за 3 GPU-часа или доверенный недавний околоуспешный результат. Строки без последующих затрат AF2 и без квалификационной роли AF2 могут также использовать счетчик SU по 60 записям и, при отсутствии скорости за 3 GPU-часа, ее значение (раздел C.4.1). Лимит может быть увеличен с одного до двух при любом из следующих условий:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Семейные данные: положительная недавняя прямая или атрибутированная скорость SU/GPU-ч либо доверенный недавний околоуспешный результат в сводке методов (раздел C.4.1); альтернативно, исторические данные SU или околоуспешные результаты с исторической скоростью ≥ 0.25 SU/GPU-ч, при условии, что эти данные не устарели.&lt;/li&gt;\n&lt;li&gt;Данные маршрута: маршрут семейств с наибольшей скоростью или семейные сводки обеспечивают по крайней мере один SU, не менее 1.0 GPU-часа маршрута и текущие данные SU или околоуспешные результаты. Их скорость (с учетом наибольшего текущего или исторического значения) должна составлять не менее 0.10 SU/GPU-ч и 80% от наилучшей текущей скорости среди конкурирующих сводок с текущими данными. Для равных наибольших скоростей используются наибольшие значения счета и затрат, а также наличие текущих данных.&lt;/li&gt;\n&lt;li&gt;Тестирование альтернативы во время простоя: не менее 32 &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0tjwqew5\"&gt;ResultRecord&lt;/code&gt;, не менее 0.75 GPU-часов воркера без новых SU и наилучшая недавняя скорость семейства вне оценки ниже 0.25 SU/GPU-ч в условиях низких доказательств, простоя, глубокого простоя или структурного коллапса дубликатов.&lt;/li&gt;\n&lt;li&gt;Повторная расстановка приоритетов с задержкой запуска: не менее шести записей BindCraft в архивных решениях кандидата Супервайзора, отношение запусков к входам ≤ 0.35 и по крайней мере одно отложенное по емкости или выбранное, но не запущенное задание. Состояние должно быть отмечено как низкие доказательства, простой, глубокий простой или структурный коллапс дубликатов, либо кампания должна иметь менее четырех SU. Исторические данные не должны быть устаревшими.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Исторические данные считаются устаревшими, если ни семейные сводки, ни сводки маршрутов не сохраняют текущие SU или доверенные околоуспешные результаты, а ранее продуктивная сводка накопила не менее 1.0 недавнего GPU-часа маршрута. Недавние окна следуют разделу C.4.1; скорости маршрутов следуют разделу C.7.2. Продвижение на основе SU требует проверки кластеризации, описанной там же, а околоуспешные результаты используют раздел C.4.2. Условия 2–4 блокируются после регистрации по крайней мере 6 GPU-часов семейств и более одного тайм-аута без прямых или атрибутированных SU либо доверенных исторических/недавних околоуспешных результатов. Повышение лимита разрешает еще один запуск, но не выбирает задание; поставленные в очередь задания не считаются запущенными.&lt;/p&gt;\n&lt;p&gt;Запуски, отсрочки и сбои. Утвержденные решения о запуске (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qs6896rg\"&gt;Launch Decisions&lt;/code&gt;) разрешают допуск в очередь; записи диспетчеризации (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7v26gtjp\"&gt;Dispatch Records&lt;/code&gt;) фиксируют запуски и события выполнения (раздел C.3). Перед запуском контроллер разрешает необходимые входные данные и перепроверяет текущие ограничения. Отсрочка по параллелизму возвращает задание в очередь без расходования попытки повтора. Другие временные сбои запуска повторяются не более трех раз (всего четыре попытки) после рассмотрения всех свободных в данный момент воркеров. Постоянные сбои и исчерпанные попытки удаляют задание. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ybvi0f3e\"&gt;Dispatch Records&lt;/code&gt; сохраняют терминальные сбои запуска и отдельные причины отсрочки по емкости; промежуточные временные повторные попытки не обязаны порождать каждую отдельную запись. Более поздний сбой выполнения или сбора вывода не стирает ранее подтвержденный запуск.&lt;/p&gt;\n&lt;p&gt;Инкрементный и окончательный сбор результатов. Запущенные задания BindCraft проверяются на наличие новых выводов с интервалом, указанным в разделе C.8.3. Добавляются только ранее не архивированные &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i7zwqpng\"&gt;ResultRecords&lt;/code&gt;. Время воркера с момента предыдущего добавления результатов делится между новыми записями; окончательный парсинг собирает любые оставшиеся выводы. Таким образом, запущенное задание может уже вносить записанные результаты и затраты. Повторное чтение архивированных выводов не добавляет их снова. Если окончательный парсинг не дает нового дизайна после более ранних результатов или не дает выводов вообще, синтетическая запись о завершении сохраняет неоплаченный остаток ≥ 0.005 GPU-часов или неудачный результат. Она представляет затраты и исход, а не новый дизайн. Успешное повторное чтение выводов, уже архивированных другим путем, не добавляет вторую плату. Успешный пустой парсинг ниже этого порога вместо этого регистрирует сбой сбора выводов без &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dxf6rd72\"&gt;ResultRecord&lt;/code&gt;. Исключения окончательного парсинга регистрируются отдельно; после истечения по крайней мере 0.005 GPU-часов запись о сбое сохраняет полную стоимость запущенного задания, которая может перекрывать более ранние частичные списания. В Таблица S6 эти записи отделяются от других количественных показателей учета вычислений.&lt;/p&gt;\n&lt;h4 id=\"c83-limity-vremeni-vorkerov-i-obrabotka-sboev\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c83-limity-vremeni-vorkerov-i-obrabotka-sboev\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.8.3. Лимиты времени воркеров и обработка сбоев&lt;/span&gt;&lt;/a&gt;C.8.3. Лимиты времени воркеров и обработка сбоев&lt;/h4&gt;\n&lt;p&gt;Сбои опроса и планирования. Активные итерации контроллера обычно ждут 5 с между опросами; итерация без запланированных, поставленных в очередь, отправленных или запущенных заданий ждет 120 с. Кешированный расчет состояния кампании может повторно использоваться до 60 с, если неизменны количество результатов, доступность воркеров, стоимость работающих воркеров с округлением вниз до шага 0.25 GPU-ч и количество заданий в очереди/работе по семействам. Сбой проверки состояния сохраняет предыдущее состояние. Исключение при полном обновлении планирования сохраняет уже добавленные записи, ждет 60 с и перезапускает цикл до дальнейшего приема или отправки. Инкрементные запуски сбора BindCraft выполняются с интервалом по умолчанию 600 с с нижней границей 300 с.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кеширование состояния и интервалы опроса позволяют экономить вычислительные ресурсы, не пересчитывая неизменные параметры каждые несколько секунд.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Контрольные точки прогресса. Отдельная контрольная точка сохраняет прошедшее время кампании и данные мониторинга с интервалом по умолчанию 60 с, в том числе когда все воркеры заняты. Когда нативные или перспективные дизайны ожидают стандартизированную оценку AF2 и выполняется стандартное задание AF2, контрольная точка пересчитывает текущие данные и может обновить состояние кампании. В противном случае она использует последнюю архивную сводку и обновляет прошедшее время. Контрольные точки не добавляют EvidenceSummary в историю JSONL и не вызывают LLM.&lt;/p&gt;\n&lt;p&gt;Лимиты времени заданий. Ограничения представляют собой прошедшие секунды на один слот воркера. Задания ComplexaBeam, best-of-n и FK имеют потолок 5,400 с; MCTS имеет потолок 9,000 с. Потолки для стандартизированных AF2, ProteinMPNN и BoltzGen составляют 2,160, 900 и 10,800 с. При превышении лимита контроллер пытается собрать доступные результаты и завершает незавершенное задание. Эти потолки ограничивают превышения, а не задают ожидаемое время выполнения или стоимость отбора. BindCraft вместо этого использует сторожевой таймер прогресса (progress watchdog). После льготного периода в 5,400 с первая проверка запускает таймер отсутствия прогресса. Увеличение числа оцениваемых результатов сбрасывает его; более 5,400 с без такого прогресса вызывают завершение. Рост промежуточных файлов сам по себе таймер не сбрасывает.&lt;/p&gt;\n&lt;p&gt;Отключение семейств с повторяющимися сбоями. Семейство становится недоступным после по крайней мере двух записей результатов по таймауту и 3 записанных GPU-ч воркера без соответствующих или близких к пороговым метрик в отнесенных к нему результатах, при условии, что остается другое доступное семейство генерации, не требующее родителя. Стандартизированный AF2 исключен. Контроллер предотвращает появление новых кандидатов из этого семейства и удаляет его задания из очереди, в то время как запущенные задания продолжаются. Само отключение не фиксирует ни таймаут, ни запуск нового воркера.&lt;/p&gt;\n&lt;p&gt;Лимит времени кампании и завершение работы. 48-часовой лимит контроллера проверяется при входе в цикл и включает сохраненное прошедшее время, если кампания возобновляется. Планирование и отправка могут завершиться в рамках итерации, которая уже началась. Раздел B.3 определяет отдельный знаменатель отчетности в 144 GPU-ч воркера H100. При завершении работы занятые воркеры опрашиваются в порядке пула, и каждый получает до 600 с на завершение. Нормальное завершение обрабатывается до перехода к следующему воркеру; таймаут инициирует попытку восстановления выводов с последующим завершением. Планировщик может завершить распределение до окончания всех ожиданий. Включение в финальную конечную точку следует разделу B.3, а не этим ожиданиям времени выполнения.&lt;/p&gt;\n&lt;h4 id=\"c9-obratnaya-svyaz-po-gipotezam\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c9-obratnaya-svyaz-po-gipotezam\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.9. Обратная связь по гипотезам&lt;/span&gt;&lt;/a&gt;C.9. Обратная связь по гипотезам&lt;/h4&gt;\n&lt;p&gt;Обратная связь по гипотезам тестирует изменения измерений, предсказанные в HypothesisCards (раздел C.5.2). В конце каждого цикла планирования детерминированные правила оценивают ранее активные карточки с использованием результатов, доступных на момент начала этого обновления. Обновленные карточки добавляются под тем же идентификатором гипотезы для последующего планирования (раздел C.3) без изменения квалификации или зачета SU. Эти тесты оценивают числовые предсказания, а не причинно-следственные связи. В разобранном примере в разделе D.2.2 восемь потомков прошли квалификацию, но ни один не поддержал конкретные предсказания карточки.&lt;/p&gt;\n&lt;p&gt;Результаты и базовые линии для сравнения. Результат связывается с карточкой через задачу-кандидат, которая его породила, включая последующие задачи оценки, несущие ту же ссылку на гипотезу. Каждый кандидат использует одну базовую линию сравнения, общую для всех предсказанных измерений: первый разрешимый результат среди упорядоченных базовых ссылок карточки, за которым следуют ее цитируемые свидетельства. Последующая оценка может наследовать эту базовую линию; в противном случае задача без записанной базовой линии сравнения использует своего родителя выполнения. Таким образом, базовая линия сравнения не обязательно должна быть дизайном, поданным на вход задачи. Результаты без разрешимой базовой линии исключаются. Подсчеты пересчитываются по всем связанным парам результат–базовая линия, а не путем добавления одних и тех же свидетельств при каждом обновлении.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Базовая линия сравнения — это исходный референсный результат или дизайн, относительно которого оценивается улучшение новых кандидатов в ходе планирования.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Предсказанное улучшение. Пусть dbaseline и dresult обозначают неотрицательные квалификационные дефициты измерения (раздел C.4.1). Для dbaseline &amp;gt; 0.01 относительное сокращение дефицита (dbaseline - dresult)/dbaseline должно соответствовать минимуму, указанному в карточке. Когда dbaseline ≤ 0.01, поддержка вместо этого требует указанного абсолютного улучшения в благоприятном направлении, по умолчанию равного 1.0 в единицах этого измерения, если значение отсутствует или равно нулю. Допуск 0.01 применяется в единицах каждого измерения.&lt;/p&gt;\n&lt;p&gt;Свидетельства на уровне результатов. Результат поддерживает карточку, когда каждое предсказанное изменение удовлетворяет своему требованию улучшения и не нарушается ни одно проверенное ограничение на ухудшающиеся измерения. Для каждого такого ограничения дефицит базовой линии ≤ 0.01 должен оставаться ≤ 0.01; в противном случае дефицит результата не должен превышать дефицит базовой линии, умноженный на единицу плюс разрешенное карточкой относительное увеличение. Ограничение проверяется только тогда, когда доступны как базовая, так и результирующая измерения. Пропуск отсутствующего сравнения не доказывает, что измерение сохранилось. Результат противоречит карточке, когда каждое предсказанное измерение имеет дефицит базовой линии &amp;gt; 0.01 и относительное сокращение дефицита ≤ 0.05. И поддержка, и противоречие требуют, чтобы предсказанное направление совпадало с благоприятным направлением измерения. Отсутствие предсказанных измерений предотвращает любой вывод, за одним исключением: отсутствующее измерение базовой линии может получить поддержку, если связанный стандартизированный результат AF2 проходит полное правило квалификации. Другие предсказанные изменения и пределы сохранения по-прежнему действуют. Поддержка и противоречие подсчитываются независимо; результаты, не удовлетворяющие ни одному тесту, являются нейтральными.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Карточка получает поддержку, если все предсказанные изменения выполняют требования улучшений без нарушения лимитов ухудшения, а статус карточки становится подтвержденным при наборе двух баллов поддержки.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Статус карточки. В описанных кампаниях каждый поддерживающий результат давал один балл; два балла отмечали карточку как поддержанную. В противном случае по крайней мере три оцененные пары результат–базовая линия и доля противоречий ≥ 0.70 отмечали ее как опровергнутую (архивированную как противоречащую). Нейтральные записи остаются в этом знаменателе. Поддержка имеет приоритет, если выполняются оба порога. Карточка, не достигающая ни одного порога, остается активной до достижения указанного времени жизни, отсчитываемого от создания в циклах планирования (по умолчанию десять; допустимый диапазон от одного до двадцати), после чего удаляется. Истекшие карточки без связанных результатов удаляются до вызова планировщика; другие обновления статуса следуют за описанной выше оценкой в конце цикла. Состояния «поддержано», «опровергнуто» и «удалено» являются терминальными.&lt;/p&gt;\n&lt;h4 id=\"d-dopolnitelnye-eksperimenty-i-analiz-kampanij\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d-dopolnitelnye-eksperimenty-i-analiz-kampanij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D. Дополнительные эксперименты и анализ кампаний&lt;/span&gt;&lt;/a&gt;D. Дополнительные эксперименты и анализ кампаний&lt;/h4&gt;\n&lt;p&gt;Анализы ниже исследуют пропускную способность и надежность (рис. 2), архивированные решения по последующим шагам (рис. 3), распределение и восстановление (рис. 4), а также апостериорную уверенность и структурное разнообразие (рис. 2c и 5). Разведочные кампании на дополнительных мишенях следуют за этими анализами первичных бенчмарков.&lt;/p&gt;\n&lt;h4 id=\"d11-povtornye-kampanii\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d11-povtornye-kampanii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.1.1. Повторные кампании&lt;/span&gt;&lt;/a&gt;D.1.1. Повторные кампании&lt;/h4&gt;\n&lt;p&gt;Во всех трех независимо инициализированных кампаниях для каждого контроллера на CD45, SC2RBD и CbAgo каждая кампания T-REX производила больше финальных SU TM0.6, чем любая кампания PUCT или ε-greedy на той же мишени (рис. 2d; табл. S9). В разделе B.7 указан дизайн репликации. На рис. S3 показаны онлайн-траектории T-REX и отдельно отмечены финальные пересчитанные счета; онлайн-счета могут меняться при обновлении кластеризации (раздел C.4.2).&lt;/p&gt;\n&lt;p&gt;Табличные данные по числу структурно отличных хитов на Worker GPU-h для мишеней CD45, SC2RBD и CbAgo показывают стабильное превосходство метода T-REX над PUCT и ε-greedy во всех трех независимых запусках (Run 0, Run 1, Run 2). Для CD45 T-REX достигает среднего значения 2.104 ± 0.014, в то время как PUCT показывает 0.505 ± 0.331, а ε-greedy — 0.171 ± 0.034. Для мишени SC2RBD показатели составляют 0.370 ± 0.033 для T-REX, 0.266 ± 0.011 для PUCT и 0.153 ± 0.018 для ε-greedy. Для мишени CbAgo T-REX демонстрирует 0.683 ± 0.125, PUCT — 0.382 ± 0.039, а ε-greedy — 0.120 ± 0.077.&lt;/p&gt;\n&lt;h4 id=\"d12-retrospektivnye-kontrolnye-tochki-i-sravneniya-pri-menshem-byudzhete\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d12-retrospektivnye-kontrolnye-tochki-i-sravneniya-pri-menshem-byudzhete\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.1.2. Ретроспективные контрольные точки и сравнения при меньшем бюджете&lt;/span&gt;&lt;/a&gt;D.1.2. Ретроспективные контрольные точки и сравнения при меньшем бюджете&lt;/h4&gt;\n&lt;p&gt;Для восстановления кривых накопления на Рис. 2a использовали финальную квалификацию и кластеризацию TM0.6 для дизайнов из раздела B.3. Адаптивные кривые связывают каждый кластер с самой ранней архивной сводкой, содержащей квалифицированный элемент, а кривые только для генераторов опираются на события завершения из Таблицы S10. Записи PUCT HER2-AAV, поступающие после последней сводки, относят к отсечке в 144 воркер-GPU-ч. Финальный горизонтальный сегмент фиксирует последнее число на этом уровне без добавления кластеров. Подобные ретроспективно восстановленные кривые могут отличаться от подсчетов в реальном времени. Поскольку фиксируемые события различаются между методами, промежуточные контрольные точки отражают именно накопление, а не точное время завершения для разных подходов. В контрольной точке с бюджетом B воркер-GPU-ч величина N(B) считает финальные кластеры, получившие событие на B или раньше, а отношение N(B)/B задает скорость накопления (Таблица S10). Назначения кластеров остаются фиксированными; это наблюдения из кампаний, запущенных до 144 воркер-GPU-ч, а не кампаний, которые останавливали и завершали независимо ровно на отметке B. При ограничении в 10 воркер-GPU-ч метод T-REX показал наибольшее количество на шести мишенях и разделил первенство с методом только-BindCraft на HER2-AAV; он лидировал по всем семи мишеням на отметках 50, 100 и 144 воркер-GPU-ч. Геометрические средние соотношения подсчетов T-REX к PUCT по всем мишеням составили соответственно 3.94, 3.10, 2.73 и 2.43.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Контрольные точки (checkpoints) и кривые накопления позволяют оценить производительность алгоритмов в динамике по мере расхода вычислительного бюджета, даже если реальная остановка кампаний происходила в разные моменты времени.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сравнение с байесовской оптимизацией показало, что кампании SMAC3, независимо остановленные на 100 воркер-GPU-ч, выдали в сумме 329 финальных единиц структуры TM0.6 по семи мишеням, тогда как ретроспективные контрольные точки T-REX на 100 воркер-GPU-ч дали 1,108 единиц, причем T-REX превосходил соперника на каждой отдельной мишени (Таблица S11). Алгоритм SMAC3 останавливался примерно через 25 часов работы на четырех воркерах (настройка описана в разделе B.5.2), в то время как контрольные точки T-REX получены из трехворкерных кампаний, рассчитанных на 144 воркер-GPU-ч. Данное сопоставление выравнивает объем вычислительных ресурсов, но не предрекает результат независимой остановки T-REX ровно на 100 воркер-GPU-ч.&lt;/p&gt;\n&lt;h4 id=\"d13-chuvstvitelnost-ucheta-vychislitelnyh-zatrat\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d13-chuvstvitelnost-ucheta-vychislitelnyh-zatrat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.1.3. Чувствительность учета вычислительных затрат&lt;/span&gt;&lt;/a&gt;D.1.3. Чувствительность учета вычислительных затрат&lt;/h4&gt;\n&lt;p&gt;Анализ затрат ресурсов и времени работы языковой модели (LLM) охватил 3 125 заархивированных вызовов моделей. Совокупная сквозная задержка составила 84 533 с (23,48 ч; среднее значение — 27,05 с на один вызов), что эквивалентно 6,99% от общего номинального времени кампании, составляющего 336 ч (7 кампаний по 48 ч). Обслуживание LLM происходило на отдельном графическом процессоре, в то время как рабочие задачи продолжали выполняться, поэтому данная сумма не отражает ни увеличение продолжительности кампании, ни задержки при пополнении очереди или простое воркеров. Основные принципы расчета бюджета воркеров и правила включения эндпоинтов описаны в Разделе B.3.&lt;/p&gt;\n&lt;p&gt;Первый вариант анализа чувствительности учитывал добавление полной 48-часовой резервации сервера LLM к реконструированному времени воркеров для каждой кампании. Это эквивалентно 336 часам работы GPU H100 суммарно по семи кампаниям или в 14,3 раза превышает суммарную задержку вызовов. Такой подход распределяет примерно по 192 часа GPU H100 на каждую кампанию T-REX, сохраняя при этом ее трехворкерную конфигурацию выполнения. Несмотря на это перераспределение, методика T-REX сохранила превосходство над подходом PUCT на всех целевых белках: превышение составило от 1,03 до 3,27 раза в единицах SU TM0.6 на общий час GPU H100, при среднем геометрическом значении 1,82 раза (Таблица S12a).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SU (Success Unit) и геометрическое среднее — метрики успешности генерации и агрегированный показатель относительного превосходства метода во всех тестах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Второй вариант анализа чувствительности сохранил полную нагрузку на сервер и дополнительно добавил время стандартной оценки AlphaFold2 (AF2) после отсечки ко всем базовым линиям, состоящим только из генераторов, перед выбором наиболее сильного скорректированного базиса для каждой цели. Онлайн-оценка T-REX уже была включена во время воркеров; система Complexa выполняла стандартные измерения AF2 в процессе работы и не требовала дополнительных затрат на оценку после отсечки. В этом сценарии T-REX снова занял лидирующую позицию по всем мишеням, показав превосходство в диапазоне от 1,07 до 4,52 раза при среднем геометрическом значении 1,90 раза (Таблица S12b). Как показано в Таблице S12, показатели T-REX, общие затраты и скорректированные коэффициенты из части a применимы и к части b.&lt;/p&gt;\n&lt;p&gt;a. Полные затраты на LLM-сервер в сравнении с PUCT&lt;/p&gt;\n&lt;p&gt;Для оценки T-REX учитывалась нагрузка воркеров плюс полная резервация сервера на 48 часов GPU H100. Для мишени CD45 получено 143,8 SU, 191,8 часов GPU воркеров, всего 192,0 часов GPU и отношение SU/total GPU-h 1,570. Для BetV1 — 144,0 SU, 192,0 часов GPU воркеров, всего 192,0 часов GPU, соотношение 0,333. Для CbAgo — 144,0 SU, 192,0 часов GPU воркеров, всего 192,0 часов GPU, соотношение 0,604. Для HER2-AAV — 144,0 SU, 192,0 часов GPU воркеров, всего 192,0 часов GPU, соотношение 1,063. Для SC2RBD — 144,0 SU, 192,0 часов GPU воркеров, всего 192,0 часов GPU, соотношение 0,286. Для PDL1 — 143,8 SU, 191,8 часов GPU воркеров, всего 191,8 часов GPU, соотношение 2,513. Для IL7RA — 144,0 SU, 192,0 часов GPU воркеров, всего 192,0 часов GPU, соотношение 1,245.&lt;/p&gt;\n&lt;p&gt;В методе PUCT без учета сервера LLM для CD45 зафиксировано 143,7 SU, 0,480 total GPU-h и коэффициент рентабельности (rate ratio) 3,27. Для BetV1 — 143,9 SU, 0,236 total GPU-h, отношение 1,41. Для CbAgo — 144,0 SU, 0,375 total GPU-h, отношение 1,61. Для HER2-AAV — 144,0 SU, 0,361 total GPU-h, отношение 2,94. Для SC2RBD — 144,0 SU, 0,278 total GPU-h, отношение 1,03. Для PDL1 — 143,6 SU, 1,623 total GPU-h, отношение 1,55. Для IL7RA — 144,0 SU, 0,660 total GPU-h, отношение 1,89. Среднегеометрическое соотношение пропускной способности составило 1,82.&lt;/p&gt;\n&lt;p&gt;b. Полные затраты на сервер и затраты на базовую оценку после отсечки&lt;/p&gt;\n&lt;p&gt;С учетом полной платы за сервер и затрат на базовую оценку AF2 после отсечки получены следующие данные по базовым линиям только с генераторами. Для мишени CD45 (baseline Complexa-only) базовые SU равны 0,000, время AF2 после отсечки — 144,0 часов GPU, всего 0,347 GPU-h, отношение 4,52. Для BetV1 (Complexa-only) — 0,000 SU, 144,0 часов AF2, 0,118 total GPU-h, отношение 2,82. Для CbAgo (BindCraft-only) — 4,710 SU, 148,7 часов AF2, 0,350 total GPU-h, отношение 1,73. Для HER2-AAV (BindCraft-only) — 8,066 SU, 152,1 часов AF2, 0,684 total GPU-h, отношение 1,55. Для SC2RBD (BindCraft-only) — 1,234 SU, 145,2 часов AF2, 0,151 total GPU-h, отношение 1,89. Для PDL1 (Complexa-only) — 0,000 SU, 144,0 часов AF2, 1,951 total GPU-h, отношение 1,29. Для IL7RA (Complexa-only) — 0,000 SU, 144,0 часов AF2, 1,160 total GPU-h, отношение 1,07. Среднегеометрическое соотношение пропускной способности для данной части составило 1,90.&lt;/p&gt;\n&lt;h4 id=\"d14-raznoobrazie-i-chuvstvitelnost-k-otborochnym-marzham\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d14-raznoobrazie-i-chuvstvitelnost-k-otborochnym-marzham\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.1.4. Разнообразие и чувствительность к отборочным маржам&lt;/span&gt;&lt;/a&gt;D.1.4. Разнообразие и чувствительность к отборочным маржам&lt;/h4&gt;\n&lt;p&gt;Метод T-REX продемонстрировал наибольшую пропускную способность кластеров для всех семи мишеней как при кластеризации последовательностей с помощью MMseqs2 на уровне 70% идентичности, так и при структурной кластеризации Foldseek на порогах TM0.5, TM0.6 и TM0.8 (Рис. 2b; Таблицы S13 и S14). В этих анализах задействованы те же отобранные пулы вариантов и настройки кластеризации, что и в разделе B.2, причем кластеризация последовательностей применяется перед структурной дедупликацией.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Кластеризация последовательностей и структурная фильтрация по порогам TM-score позволяют объединить похожие белковые варианты в группы и отсеять неперспективные.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Подробные результаты для каждой мишени (CD45, BetV1, CbAgo, HER2-AAV, SC2RBD, PDL1 и IL7RA) и различных подходов, включая T-REX, PUCT, ε-greedy, Complexa-only, BindCraft-only и BoltzGen-only, отражают число прошедших отбор вариантов (Qualified), число кластеров последовательностей (Seq.clusters), скорость работы (Seq.clusters/worker) и затраты ресурсов в GPU-часах (GPU-h). Например, для мишени CD45 метод T-REX сформировал 1 936 отобранных вариантов со скоростью 5.61 кластера на воркера, тогда как PUCT показал 0.90, ε-greedy — 0.44, Complexa-only — 0.56, BindCraft-only — 0.01, а BoltzGen-only — 0.15 GPU-h. Для мишени PDL1 T-REX достиг 6 203 отобранных вариантов и 2 064 кластеров последовательностей при затратах 14.33 GPU-h, в то время как PUCT потребовал 5.38, ε-greedy — 0.95, Complexa-only (2 897 вариантов, 6.44 GPU-h), BindCraft-only (2 033 варианта, 2.77 GPU-h) и BoltzGen-only (1 412 вариантов, 1 326 кластеров, 9.21 GPU-h). Для IL7RA метод T-REX выделил 1 178 вариантов (3.69 GPU-h), PUCT — 1.14, ε-greedy — 0.52, Complexa-only (1 086 вариантов, 2.72 GPU-h), BindCraft-only (1 047 вариантов, 1.72 GPU-h) и BoltzGen-only — 3.34 GPU-h.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Метрики вроде GPU-h оценивают вычислительную сложность, а параметры TM0.5–TM0.8 измеряют структурное сходство белковых моделей.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ с использованием альтернативных порогов TM-score (TM0.5, TM0.6, TM0.8) для тех же мишеней показывает стабильное преимущество T-REX. Так, для CD45 показатели T-REX составили 1.389 (TM0.5), 2.090 (TM0.6) и 3.271 (TM0.8), превышая результаты PUCT (0.326, 0.479, 0.604), ε-greedy (0.139, 0.188, 0.229), Complexa-only (0.257, 0.347, 0.486), BindCraft-only (0.014 для всех трех порогов) и BoltzGen-only (0.028, 0.035, 0.104). Для BetV1 T-REX достиг значений 0.326, 0.444 и 0.542 против 0.188, 0.236 и 0.250 у PUCT. Для CbAgo значения T-REX равны 0.562, 0.806 и 1.042, превышая PUCT (0.250, 0.375, 0.417) и прочие подходы. Для HER2-AAV T-REX показал 0.951, 1.417 и 2.194, превзойдя PUCT (0.306, 0.361, 0.389) и BindCraft-only (0.472, 0.722, 0.826). Для SC2RBD T-REX зафиксировал 0.236, 0.382 и 0.535 по сравнению с 0.215, 0.278 и 0.326 у PUCT. Для PDL1 T-REX выдал 1.875, 3.347 и 6.646, превосходя PUCT (1.021, 1.618, 2.792), Complexa-only (1.090, 1.951, 4.111) и BoltzGen-only (0.486, 1.097, 4.014). Наконец, для IL7RA T-REX продемонстрировал 1.062, 1.660 и 2.653, опережая PUCT (0.465, 0.660, 0.833) и остальные алгоритмы.&lt;/p&gt;\n&lt;p&gt;Анализ чувствительности к отборочным маржам фиксирует итоговые кластеры с порогом TM0.6 и отбирает те, чей выбранный представитель удовлетворяет условию &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D%20%5Cge%20%5Ctau\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (Рис. S4; Раздел B.2). Каждый представитель максимизирует &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; внутри своего кластера, поэтому сохраненный кластер содержит как минимум один вариант, отвечающий всем трем ужесточенным маржам. Членство в кластерах после фильтрации не пересчитывается. При τ = 0 отборочный пул восстанавливает исходное число вариантов при сохранении изначального строгого ограничения scRMSD. Из 63 комбинаций мишень–маржа (&lt;span class=\"yfm-latex\" data-content=\"%5Ctau%20%3D%200%2C%200.05%2C%20%5Cdots%2C%200.40\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;) метод T-REX превзошел PUCT в 50 случаях, сыграл вничью в десяти (включая семь нулевых ничьих) и уступил в трех, каждый раз ровно на один SU. Таким образом, преимущество по пропускной способности сохранялось при большинстве протестированных порогов маржи, а единичные ничьи и отставания возникали по мере сокращения числа оставшихся кластеров. Данный анализ удержания маржи отличается от повторной кластеризации при альтернативных пороговых значениях TM.&lt;/p&gt;\n&lt;h4 id=\"d21-dannye-arhivirovannogo-obnovleniya-planirovaniya\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d21-dannye-arhivirovannogo-obnovleniya-planirovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.2.1. Данные архивированного обновления планирования&lt;/span&gt;&lt;/a&gt;D.2.1. Данные архивированного обновления планирования&lt;/h4&gt;\n&lt;p&gt;Этот пример демонстрирует обновление планирования HER2-AAV № 6 на основе архивированных данных с сокращенным входом для LLM, где номера обновлений отражают этапы планирования, а не реальное время. Все JSON-выдержки сохраняют структуру полей, пустые значения и логические типы, при этом оригинальные идентификаторы заменены описательными псевдонимами, а числовые измерения округлены до четырёх знаков после запятой.&lt;/p&gt;\n&lt;p&gt;Квалификация и ожидающие оценки. На данном этапе кампания не имела квалифицированных дизайнов или онлайн-единиц успеха (SU), зафиксировав два кластера околопороговых вариантов (near-miss) и детерминированно назначенное состояние кампании low_evidence. Рассматриваемый вариант успешно прошел пороги pLDDT (90.8924) и scRMSD (0.7215 Å), однако его нормализованный показатель iPAE составил 0.2397, что превысило допустимый срез. Позднее языковая модель ошибочно охарактеризовала scRMSD как неудачный, однако для квалификации использовались записанные измерения. Кластеризация пула квалифицированных дизайнов не содержала структур (no_strict, нулевое покрытие), в то время как кластеризация околопороговых вариантов была завершена (ok, покрытие 1.0). Из 16 дизайнов BoltzGen четыре прошли стандартизированную оценку AF2, а двенадцать ожидали оценки в соответствии с правилами допуска, их статусы квалификации оставались неизвестными.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Нормализованный iPAE (predicted aligned error) — это метрика точности пространственного расположения белковых доменов, где значения ниже установленного среза подтверждают правильность моделирования белкового комплекса.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сводки критериев и структурная дупликация. Каждый критерий включал по 20 измерений. Для pLDDT, нормализованного iPAE и scRMSD связующего количество успешных результатов, околопороговых и неудачных составило соответственно 4/8/8, 0/5/15 и 8/2/10, а медианные значения равнялись 85.7853, 0.3446 и 2.2067 Å. Парные показатели pLDDT и iPAE распределились следующим образом: 0 успешных по обеим метрикам, 8 неудачных по обеим, 0 успешных по одной и неуспешных по другой, а также 1 околопороговый по обеим. Смешанные комбинации не включались в эти пять паттернов, поэтому их суммы не обязаны равняться 20. Среди недавних записей коэффициент дупликации составил fdup = 0.75, а крупнейший кластер содержал 20% записей; эта мера дупликации охватывает неквалифицированные дизайны и не дает кредита SU.&lt;/p&gt;\n&lt;p&gt;Записанные результаты и вычислительные затраты. Общее число записей результатов (ResultRecords) составило 36, включая 16 выводов Complexa Beam, 16 выводов BoltzGen и 4 стандартизированные оценки AF2 со статусом ok. Затраты на уровне семейств учитывали количество записей, а не запусков задач. Их учтенные затраты составили 0.3216, 0.1362 и 0.0363 графен-часов (worker GPU-h) соответственно, составив в сумме 0.4941 графен-часов. Три дочерних элемента в статусе pending_children выполняли активные задачи. Затраченное время слотов рабочих составило 1.0003 графен-часов, сигнал времени простоя — 0.9673 графен-часов, при этом прошло шесть обновлений без получения SU. Этот сигнал объединяет учтенные затраты и время выполнения работ с нулевой точкой отсчета до первого SU и отличается от общего времени кампании. Complexa Beam внесла вклад в виде обоих кластеров околопороговых вариантов. Все три квалификационные измерения были доступны для выводов Complexa Beam и оценок AF2, но отсутствовали у нативных выводов BoltzGen. Рецепт Complexa Beam объединил восемь потомков с околопороговым исходом при ширине луча 4, четырех ветвях и четырех образцах, а рассматриваемый дизайн был получен из первоначальной задачи Complexa Beam. Вспомогательные модели предоставили контекст без влияния на квалификацию или кредиты SU.&lt;/p&gt;\n&lt;p&gt;Четыре типа исходов в одной кампании. Данные записи иллюстрируют различия, представленные на Рис. 1b: более поздняя задача управления Complexa FK завершилась по тайм-ауту без выходов и измерений; 12 дизайнов BoltzGen ожидали оценки; а описанный дизайн Complexa Beam не прошел срез по iPAE. В промежутке между обновлениями 11 и 12 количество квалифицированных дизайнов увеличилось с 42 до 43, тогда как число онлайн SU осталось равным четырём при успешной кластеризации пула квалифицированных вариантов.&lt;/p&gt;\n&lt;p&gt;Сокращенные входные данные для LLM. Приведенный фрагмент восстановлен по правилам сокращения входа без сохранения исходного исторического промпта. Идентификатор цели опущен, 36 родительских идентификаторов заменены счетчиком и флагом доступности, а совокупные целевые поля сгруппированы в objective_summary. Родительские идентификаторы оставались доступными для построения кандидатов, а карточки гипотез и задачи супервизора поставлялись отдельно, демонстрируя выборочные поля доказательств вместо полного набора данных роли.&lt;/p&gt;\n&lt;h4 id=\"d22-ot-predlozheniya-k-vypolneniyu-i-obratnoj-svyazi\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d22-ot-predlozheniya-k-vypolneniyu-i-obratnoj-svyazi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.2.2. От предложения к выполнению и обратной связи&lt;/span&gt;&lt;/a&gt;D.2.2. От предложения к выполнению и обратной связи&lt;/h4&gt;\n&lt;p&gt;Процесс прослеживается начиная с обновления 6, демонстрируя полный жизненный цикл одной гипотезы: от отбора и реализации до получения обратной связи. Архивы содержат структурированные поля HypothesisCard и ActionCandidate с описательными псевдонимами, представляя собой обработанные данные, а не «сырые» ответы языковой модели. На этапе предложения планировщика одна из карточек инициировала Rescue-тест, направленный на снижение нормализованного iPAE и scRMSD связывающего домена при сохранении высокого показателя pLDDT, в то время как две другие предлагали стратегии BindCraft и Complexa с поиском лучших вариантов из n кандидатов.&lt;/p&gt;\n&lt;p&gt;На этапе конструирования и валидации кандидатов модуль Check+Build исключил параметр reward_i_ptm_weight, поскольку максимальное число наблюдений среди измерений интерфейса составляло 20, что ниже требуемого порога в 32. Остальные настройки успешно прошли проверки на доступность семейств, конфигурацию, рабочие нагрузки и ресурсы. Упомянутый дизайн использовался в качестве базовой линии для сравнения, но не передавался в качестве родительской структуры для данной генерации.&lt;/p&gt;\n&lt;h4 id=\"prioretizaciya-i-ochered\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#prioretizaciya-i-ochered\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Приоретизация и очередь&lt;/span&gt;&lt;/a&gt;Приоретизация и очередь&lt;/h4&gt;\n&lt;p&gt;На этапе приоритезации супервизором лидировал метод Complexa Beam Rescue, за которым следовали BindCraft Explore и Complexa best-of-n Explore. Уровень уверенности супервизора в 0.50 активировал границы условного распределения, однако целевые доли для Rescue/Explore/eXploit после корректировки остались на уровне 0.40/0.60/0.00, и резервные варианты не задействовались. Указанные значения представляют собой целевые доли последующих запусков, а не распределение времени графических процессоров (GPU).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Соотношение Rescue/Explore/eXploit задает баланс между спасением перспективных идей, исследованием новых областей и эксплуатацией уже найденных успешных решений в алгоритмах планирования.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В очередь на допуск была свободна одна позиция, хотя все три воркера на тот момент выполняли задачи. Селектор учел текущий рейтинг супервизора и допустил задачу, занявшую первое место; две другие отобраны не были. Статус запущенных задач фиксировал поступление в очередь, тогда как реальный старт выполнения подтверждался отдельно.&lt;/p&gt;\n&lt;h4 id=\"ocenka-i-rezultaty\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#ocenka-i-rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оценка и результаты&lt;/span&gt;&lt;/a&gt;Оценка и результаты&lt;/h4&gt;\n&lt;p&gt;Независимая оценка и подтвержденный запуск на том же обновлении позволили допустить ранее сгенерированный дизайн BindCraft для стандартизированной оценки с помощью AlphaFold2. Диспетчерские записи подтвердили успешное прохождение проверок и старт как этой оценки, так и выбранной задачи Complexa Beam. К обновлению 7 в кампании появился первый квалифицированный дизайн и первая успешная единица измерения работы (SU), полученная по линии BindCraft. Состояние кампании оценивалось как productive_duplicate, а суммарные затраты составили 1.1468 часа работы GPU воркера.&lt;/p&gt;\n&lt;p&gt;Первая успешная единица SU при этом была получена не от выбранной задачи Complexa. Маршрут BindCraft прошел одну стандартизированную оценку AF2 стоимостью 0.3491 часа GPU, а его общий статус и статус недавней продуктивности находились на отметке healthy/productive. При наличии одного квалифицированного кластера медианное значение оценки качества и нижний квартиль совпали и составили 0.3670, а вспомогательный диагностический показатель улучшения равнялся 1.0.&lt;/p&gt;\n&lt;p&gt;Записанные результаты выполнения включали 32 ResultRecord со статусом ok, из которых ровно восемь удовлетворяли всем трем критериям квалификации. Идентификатор обновления привязывался к моменту старта породившей задачи, а не к моменту получения результатов. Указанные цифры отражают количество результатов, отличаясь от метрик задач, единиц SU и точек поддержки гипотез.&lt;/p&gt;\n&lt;h4 id=\"obratnaya-svyaz-po-gipotezam\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#obratnaya-svyaz-po-gipotezam\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обратная связь по гипотезам&lt;/span&gt;&lt;/a&gt;Обратная связь по гипотезам&lt;/h4&gt;\n&lt;p&gt;На этапе обратной связи к обновлению 9 для карточки числилось 32 оцененных потомка, но при этом было зафиксировано ноль точек поддержки и ноль точек противоречия. Квалификация не смогла подтвердить прогнозируемые изменения относительно базовой линии сравнения. Поскольку исходное значение scRMSD уже удовлетворяло требованиям, а карточка не содержала жесткого порога абсолютного улучшения, для поддержки гипотезы потребовалось стандартное снижение на 1 Å от исходных 0.7215 Å — недостижимая величина в данных условиях.&lt;/p&gt;\n&lt;p&gt;Уже пройденный критерий также исключил появление точек противоречия согласно правилу, требующему опровержения каждого прогноза. Сама карточка оставалась активной до момента завершения своего десятицикличного жизненного цикла на обновлении 16.&lt;/p&gt;\n&lt;h4 id=\"d23-arhivy-trass-reshenij-i-ispolzovanie-predydushih-rezultatov\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d23-arhivy-trass-reshenij-i-ispolzovanie-predydushih-rezultatov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.2.3. Архивы трасс решений и использование предыдущих результатов&lt;/span&gt;&lt;/a&gt;D.2.3. Архивы трасс решений и использование предыдущих результатов&lt;/h4&gt;\n&lt;p&gt;Три примера на Рис. 3 были отобраны ретроспективно, чтобы проиллюстрировать контрольные тесты, вызванные неудачными попытками, повторными близкими промахами или специфическими сбоями у родительских объектов. Для каждого описанного случая авторы связали поданное предложение, кандидатную работу и решение о запуске с подтвержденным началом работы и последующими результатами. Подсчет квалификационных характеристик и отображаемые значения pLDDT, iPAE и scRMSD были получены из стандартизированных записей AlphaFold2 (AF2); сетевые приросты TM0.6 SU брались из связанных сводок кампаний. Панели HER2-AAV и CbAgo сопоставляют доказательства и результаты на уровне маршрутов (Рис. 3a, b), тогда как PDL1 следует по прямой линии родитель-потомок ProteinMPNN (Рис. 3c).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;scRMSD и pLDDT — это метрики качества структуры белка: первая оценивает пространственное соответствие скелета белка по сравнению с эталоном, а вторая измеряет уверенность модели AlphaFold2 в правильности предсказания локальной структуры (в баллах до 100).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Принадлежность к батчам и атрибуция SU на уровне маршрутов оценивались раздельно: одна работа могла приводить к созданию множества дизайнов, а сводка по маршруту могла включать множество работ. Для визуализации выходные комплексы жестко выравнивались по мишени с соответствующими исходными или родительскими комплексами. Продемонстрированный потомок PDL1 отличался от родителя по 35 остаткам из 58, а его среднеквадратичное отклонение атомов углерода Cα (scRMSD) по отношению к родителю составляло 0.714 Å при выравнивании по мишени. Квалификационный scRMSD использует такое же выравнивание по мишени, но сравнивает сгенерированный комплекс с его собственным предсказанием AF2, а не родительский объект с перепроектированным потомком.&lt;/p&gt;\n&lt;p&gt;Повторное использование доказательств в ходе кампании оценивалось на семи мишенях. Эти отобранные случаи включают безуспешное повторное использование и не служат для оценки общих показателей успешности. Подсчеты разделяют квалифицированные дизайны и финальных представителей Foldseek TM0.6, напрямую связанных с работой; результаты на уровне онлайн-конфигураций идентифицируются отдельно. Показатели и доли дубликатов описывают онлайн-данные, доступные на момент предложения. Поддержка и опровержение в карточках оценивают числовые предсказания, а не причинно-следственные объяснения, а завершение работы прекращает жизненный цикл карточки без вынесения обоих вердиктов.&lt;/p&gt;\n&lt;p&gt;CD45: продолжение продуктивного маршрута и его повторное использование для спасения (Rescue). Маршрут Complexa с отрегулированными внутренними весами штрафов/наград генератора имел недавний показатель 2.32 SU/GPU-ч, в то время как маршрут по умолчанию не имел недавних SU, а доля дубликатов составляла 0.81. Контроллер продолжил продуктивный маршрут Complexa Beam с записанными весами уточнения и межмолекулярного взаимодействия. Более позднее предложение Rescue ссылалось на тот же маршрут и пару весов для близкого промаха, ограниченного интерфейсом, проверяя, останется ли эта конфигурация полезной для родственного случая. Работа с продолжением производства принесла 27 квалифицированных дизайнов и трех финальных представителей; более поздняя работа Rescue дала 11 квалифицированных дизайнов и одного финального представителя.&lt;/p&gt;\n&lt;p&gt;SC2RBD: увеличение разнообразия внутри продуктивного генератора. Маршрут BindCraft, запрашивающий восемь принятых нативных дизайнов, давал 1.40 SU/GPU-ч, но все недавние дизайны были сгруппированы в один структурный кластер. Маршрут, запрашивающий 16 принятых нативных дизайнов, впоследствии принес четыре SU в четырех кластерах. Предложенный тест увеличил запрошенное число принятых нативных дизайнов с восьми до 16 при сохранении конфигурации весов интерфейса, а затем повторно использовал эту конфигурацию после того, как более узкий маршрут снова стал избыточным. Первоначальная работа дала 19 квалифицированных потомков и трех финальных представителей; более позднее повторение принесло 10 квалифицированных потомков и одного финального представителя.&lt;/p&gt;\n&lt;p&gt;PDL1: тестирование промежуточного параметра семплирования. Значение шума семплирования остова 0.30 имело наивысший недавний показатель (6.36 SU/GPU-ч), но доля дубликатов составляла 0.84. Значение 0.20 показало меньший выход и большее структурное дублирование, в то время как протестированная конфигурация 0.40 имела сниженную производительность. Контроллер протестировал значение 0.35 в пределах разрешенных границ, сохранив остальные настройки маршрута для изучения возможного компромисса между продуктивностью и диверсификацией. Работа принесла 30 квалифицированных дизайнов и пять финальных представителей.&lt;/p&gt;\n&lt;p&gt;HER2-AAV: пересмотр гипотезы после неудачного теста. Нативные метрики Complexa для FK-направления указывали на высокую уверенность в интерфейсе (медиана ipTM 0.77), но меньшую уверенность в фолдинге (медиана pLDDT 83.4). Более ранний тест весов наград для pLDDT не дал квалифицированных дизайнов, и его карточка была опровергнута. Последующее предложение проверило совместимость последовательности и остова путем сохранения FK-направления и переключения на галлюцинацию последовательности (Рис. 3a). Квалификацию прошли пять дизайнов. Первая сводка результатов для того же маршрута и конфигурации сообщила о трех сетевых SU; этот подсчет не относится к отдельной работе. Обратная связь учла все 32 оцениваемых дизайна в качестве поддержки в рамках тестов на улучшение и сохранение для конкретной карточки, которые отличаются от квалификации.&lt;/p&gt;\n&lt;p&gt;BetV1: повторное обращение к генератору с более ранним структурным разнообразием. Complexa стала характеризоваться высокой долей дубликатов. BindCraft ранее произвел 33 SU с большим структурным разнообразием, хотя в недавнем окне он ничего не производил. Контроллер вновь обратился к BindCraft, запросив восемь принятых нативных дизайнов и используя положительные веса спиральности, ipTM и pLDDT, чтобы проверить, сможет ли другое семейство генераторов восстановить новизну. Работа принесла 17 квалифицированных дизайнов и двух финальных представителей. Карточка гипотезы была закрыта по достижении лимита жизненного цикла.&lt;/p&gt;\n&lt;p&gt;BetV1: безуспешное повторное использование ранней конфигурации. Предложение Rescue, связанное с уверенностью в интерфейсе, ссылалось на более раннюю конфигурацию, которая производила квалифицированные дизайны. Контроллер повторно использовал Complexa Beam с галлюцинацией последовательности, максимально допустимым весом награды за уверенность в интерфейсе и шумом семплирования остова 0.50 для другого близкого промаха. Ни один из 16 связанных дизайнов не прошел квалификацию. Карточка гипотезы была закрыта по достижении лимита жизненного цикла. Таким образом, повторное использование ранее продуктивной конфигурации не гарантировало квалификацию.&lt;/p&gt;\n&lt;p&gt;CbAgo: повторение наиболее продуктивного активного маршрута. Маршрут FK-направления с отрицательным весом награды iPAE имел самый высокий недавний показатель среди активных конфигураций (2.72 SU/GPU-ч) и ранее давал высокую долю квалифицированных дизайнов. Контроллер перезапустил этот маршрут с записанными весами уточнения и межмолекулярного взаимодействия, чтобы проверить, продолжает ли он добавлять структурные кластеры. Эта работа, отличающаяся от описанной на Рис. 3b, принесла восемь квалифицированных дизайнов и одного финального представителя.&lt;/p&gt;\n&lt;p&gt;IL7RA: продолжающееся производство несмотря на высокую долю дубликатов. Производительность BindCraft составила 1.46 SU/GPU-h при кумулятивном онлайн-значении 57 SU и доле дубликатов 0.80. Контроллер продолжил маршрут, запросив два нативных принятых дизайна, в то время как другие задачи тестировали альтернативы. Оба связанных дизайна прошли квалификацию и подтвердили численные предсказания карты.&lt;/p&gt;\n&lt;h4 id=\"d3-povedenie-kontrollera-i-vmeshatelstvo-d31-ispolzovanie-llm-i-proverki-interfejsa\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d3-povedenie-kontrollera-i-vmeshatelstvo-d31-ispolzovanie-llm-i-proverki-interfejsa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.3. Поведение контроллера и вмешательство D.3.1. Использование LLM и проверки интерфейса&lt;/span&gt;&lt;/a&gt;D.3. Поведение контроллера и вмешательство D.3.1. Использование LLM и проверки интерфейса&lt;/h4&gt;\n&lt;p&gt;Вызовы моделей и валидация вывода. В семи основных кампаниях было зафиксировано 3,125 вызовов LLM: 1,719 вызовов Планировщика и 1,406 вызовов Супервизора (Таблица S15, часть А). Семь ответов Супервизора не прошли валидацию структурированного вывода, что составляет 0.22% от всех вызовов моделей. Все семь ответов были распарсены как JSON, однако шесть ссылались на доказательства вне разрешенного набора, а один использовал недопустимый класс ресурсов. Эти отклоненные ответы привели к детерминированному резервному переключению; в разделах C.5.2 и C.7.1 описаны валидация и обработка ответов.&lt;/p&gt;\n&lt;p&gt;Пути выбора и подтвержденные запускные точки. Валидация вызовов моделей и резервное переключение при выборе имеют разные знаменатели. Авторы подсчитали уникальные обновления планирования в записях решений Супервизора и связали каждое подтвержденное начало генерации или редизайна через свое решение о запуске (LaunchDecision) с выбирающим обновлением. Из 1,719 обновлений 1,398 использовали текущий рейтинг кандидатов Супервизора, а 321 (18.7%) использовали резервный вариант. Они включали 313 обновлений без гипотез или кандидатов для вызова Супервизора, семь с отклоненными ответами Супервизора и одно с причиной резервного переключения из пустого списка карт Планировщика, несмотря на валидный ответ Супервизора. Эти подсчеты включают обновления, которые не запускали заданий генерации или редизайна. Все 1,454 запуска генерации или редизайна были связаны с зарегистрированным выбором: 1,446 с обновлениями, использующими рейтинг Супервизора, и восемь (0.55%) с резервным вариантом. 3,160 отдельно допущенных запусков AF2 были исключены из этого знаменателя. Путь выбора не доказывает, что LLM предложила задание: фиксированные правила конструирования могут добавлять кандидатов на любой путь (разделы C.6 и C.7).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Валидация вывода проверяет соответствие ответов модели строгим техническим требованиям (например, JSON-схемам), а резервный вариант (fallback) автоматически задействует запрограммированные правила при сбое LLM.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Проверенные интерфейсные тесты. Тесты Планировщика использовали пять синтетических ситуаций с доказательствами: продуктивная работа, концентрация близких к успеху результатов (near misses), застои (stall), амбивалентные доказательства и квалифицированный, но структурно избыточный вывод. Тесты Супервизора использовали те же ситуации, за исключением амбивалентных доказательств, по пять вызовов на каждую ситуацию для каждой роли. Проверки требовали валидных спарсенных выводов; нормализованные доли распределения Супервизора также должны были соответствовать специфичным для случаев ожиданиям: продуктивный режим, X ≥ 0.45 и E ≤ 0.30; с избытком близких к успеху результатов, R ≥ 0.40; застои, E ≥ 0.25 и X ≤ 0.45; структурно избыточный вывод, E ≥ 0.25. Все проверки валидности вывода и распределения были пройдены успешно (Таблица S15, часть В).&lt;/p&gt;\n&lt;p&gt;Тесты на повторяемость и чувствительность к выборке использовали один фиксированный случай с продуктивными доказательствами и пятью кандидатными заданиями: два на эксплуатацию (eXploit), два на спасение (Rescue) и одно на исследование (Explore). Каждый тест выполнял десять вызовов Супервизора при температуре 0 для проверки повторяемости и при температурах от 0.00 до 0.45 с шагом 0.05 для оценки чувствительности к выборке. Внутри каждого теста все пары валидных ответов сравнивались с использованием согласия первых ранжированных кандидатов в рамках приоритетов, корреляции Кендалла и суммы абсолютных разностей долей распределения, как определено в Таблице S15, части В. Три ответа в серии сэмплирования пропускали одного кандидата Rescue, поэтому указанное согласие не доказывает идентичность полных рейтингов. Эти проверки оценивают валидность вывода и повторяемость для протестированных входных данных, не валидируя объяснения и не устанавливая биологическую точность, надежность в масштабах всей кампании или причинную пользу рассуждений LLM. Таблица S15 отражает вызовы LLM и контролируемые интерфейсные тесты. Часть А подсчитывает вызовы моделей, включая валидные воздержания Планировщика, но исключает пропущенные вызовы и детерминированные консультативные записи. Часть В использует синтетические входные данные. Согласие представляет собой долю попарных сравнений в рамках приоритетов с одинаковым кандидатом на первом месте. Корреляция Кендалла требует идентичных наборов кандидатов как минимум с двумя заданиями. Разница распределения — это сумма абсолютных разностей по долям R/E/X. Фиксированная обработка недействительных или недоступных заданий описана в разделах C.5.2, C.6 и C.8.2.&lt;/p&gt;\n&lt;h4 id=\"a-vyzovy-modelej-i-validaciya-strukturirovannogo-vyvoda\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#a-vyzovy-modelej-i-validaciya-strukturirovannogo-vyvoda\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;А. Вызовы моделей и валидация структурированного вывода&lt;/span&gt;&lt;/a&gt;А. Вызовы моделей и валидация структурированного вывода&lt;/h4&gt;\n&lt;p&gt;Целевые вызовы моделей Планировщик Супервизор Ошибки валидации: CD45, BetV1, CbAgo, HER2-AAV, SC2RBD, PDL1, IL7RA. Всего 3,125 вызовов: 1,719 у Планировщика и 1,406 у Супервизора (0.22%). Количество вызовов моделей включает 201 валидное воздержание Планировщика. Архивы также содержат 313 пропущенных вызовов Супервизора и 1,517 детерминированных консультативных записей, которые исключены из этого подсчета. Вызовы моделей использовали 114,105,382 токена чтения и 4,430,504 токена записи. Задержка (latency) и чувствительность учета ресурсов описаны в разделе D.1.3 и Таблице S12.&lt;/p&gt;\n&lt;h4 id=\"b-kontroliruemye-interfejsnye-testy\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#b-kontroliruemye-interfejsnye-testy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Б. Контролируемые интерфейсные тесты&lt;/span&gt;&lt;/a&gt;Б. Контролируемые интерфейсные тесты&lt;/h4&gt;\n&lt;p&gt;Проверка доказательства, результат: Стандартные случаи (пять случаев Планировщика и четыре случая Супервизора, по пять повторов каждый) — Планировщик 25/25 и Супервизор 20/20 валидны; все специфичные для случаев проверки распределения пройдены. Повторяемость (один фиксированный случай Супервизора, десять вызовов при температуре 0) — 10/10 валидны; согласие первых кандидатов в рамках приоритетов и минимальная подходящая корреляция Кендалла составили 1.00; максимальная суммарная разница долей распределения составила 0.00. Чувствительность к выборке (тот же случай при температурах 0.00–0.45) — 10/10 валидны; согласие первых кандидатов в рамках приоритетов и минимальная подходящая корреляция Кендалла составили 1.00; максимальная суммарная разница долей распределения составила 0.10.&lt;/p&gt;\n&lt;h4 id=\"raspredelenie-v-masshtabah-kampanii-i-fakticheskoe-ispolzovanie-prostranstva-dejstvij\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#raspredelenie-v-masshtabah-kampanii-i-fakticheskoe-ispolzovanie-prostranstva-dejstvij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Распределение в масштабах кампании и фактическое использование пространства действий&lt;/span&gt;&lt;/a&gt;Распределение в масштабах кампании и фактическое использование пространства действий&lt;/h4&gt;\n&lt;p&gt;На Рис. 4a сгруппированы 1 454 подтвержденных запуска генерации и редизайна по меткам состояния кампании и зарегистрированным приоритетам R/E/X; расчет внутри каждого состояния использует все запуски генерации и редизайна для данного состояния в качестве знаменателя, исключая обязательные оценки AF2. В основном тексте указаны следующие показатели: 48 из 65 запусков Explore при низкой доказательной базе, 41 из 80 запусков Rescue для объединенных состояний застоя и глубокого застоя, а также 930 из 1 133 запусков eXploit в продуктивных состояниях с дублированием. Запуски генерации или редизайна в состоянии коллапса структурных дубликатов не фиксировались. Правила состояний описаны в Дополнительном разделе C.4.5, тогда как панели c и d используют ретроспективные аннотации, описанные ниже.&lt;/p&gt;\n&lt;p&gt;Аннотирование фокуса доказательств связывало каждый запуск с текстом структурированных решений по идентификатору цели и кандидата, сохраняя повторяющиеся запуски как отдельные события. Четыре категории аннотаций включали уверенность в интерфейсе, уверенность в фолдинге, консистентность остова и структурную избыточность. Для связанных решений ручные аннотации, охватывающие 27 проектных решений (35 запусков), имели приоритет над текстовым сопоставлением. В остальных случаях регистронезависимое сопоставление сначала анализировало описание предлагаемой задачи. Если это поле не совпадало ни с одной категорией, система обращалась к объединенным полям доказательств и обоснования. Совпадение с одной категорией присваивало единый фокус, а совпадение с несколькими — метку мультифокуса. Запуски без совпадений или без связанных решений оставались без аннотаций. На панелях c и d представлены 1 305 запусков с единым фокусом, исключая мультифокусные и неаннотированные запуски. Метка консистентности остова на Рис. 4 обозначает структурную самосогласованность, включая упоминания scRMSD, ошибки позы или дрейфа остова. Эти аннотации описывают цитируемые доказательства, а не независимо диагностированные ограничения дизайна; аннотирование не было слепым, а межэкспертная согласованность не оценивалась. В Дополнительной таблице S16 сбои квалификации и структурная избыточность приведены отдельно от этих аннотаций текстовых решений. Связи между состоянием кампании, фокусом доказательств и приоритетом носят описательный характер, так как на фактические запуски также влияют детерминированные правила состояний, создание кандидатов и границы распределения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Аннотирование фокуса доказательств — это метод классификации текстовых обоснований и параметров вычислительных задач по четырем ключевым критериям качества белковых моделей для понимания стратегии исследователей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В Таблице представлены метрики для различных целевых белков: для CD45 зафиксировано 6 291 запуск, 67.6% сбоев iPAE, 25.7% сбоев pLDDT, 25.4% сбоев scRMSD, 1 936 квалифицированных структур с TM ≥ 0.6 и 6.43 квалифицированных вариантов на расчетную единицу (SU); для BetV1 — 2 310 запусков, 84.0% iPAE, 72.9% pLDDT, 51.7% scRMSD, 3.81 квалифицированных SU на единицу; для CbAgo — 5 170 запусков, 89.1% iPAE, 62.6% pLDDT, 43.5% scRMSD, 4.34 SU; для HER2-AAV — 3 733 запуска, 73.0% iPAE, 62.8% pLDDT, 14.8% scRMSD, 4.21 SU; для SC2RBD — 1 906 запусков, 79.3% iPAE, 82.5% pLDDT, 42.3% scRMSD, 4.58 SU; для PDL1 — 9 099 запусков, 26.3% iPAE, 29.5% pLDDT, 10.5% scRMSD, 6 203 квалифицированные структуры с TM ≥ 0.6 и 12.87 SU; для IL7RA — 3 163 запуска, 51.0% iPAE, 50.1% pLDDT, 24.5% scRMSD, 1 178 квалифицированных структур и 4.93 SU.&lt;/p&gt;\n&lt;p&gt;Типы последующих задач. Для Рис. 4d задачи классифицировались в следующем порядке: задачи ProteinMPNN относились к редизайну кандидатов, явные повторения архивных маршрутов — к воспроизведению записанных маршрутов, а первый запуск семейства генерации в рамках каждой целевой кампании — к первому использованию метода. Для остальных задач регистронезависимое сопоставление использовало описание предлагаемой задачи или записанную конфигурацию при его отсутствии. Совпадение с последовательностью sequence[_-]?hallucination определяло редизайн кандидатов, в противном случае термины reward, weight, penalty или objective относились к корректировке весов скоринга. Все оставшиеся задачи были отнесены к настройке сэмплирования или поиска. Такой порядок делает категории взаимоисключающими; текстовые категории описывают предлагаемые задачи и не гарантируют, что каждая сопоставленная задача изменила веса скоринга или параметры сэмплирования.&lt;/p&gt;\n&lt;p&gt;Фактическое использование пространства действий. Семь основных кампаний T-REX задействовали все шесть зарегистрированных семейств генерации и редизайн ProteinMPNN, охватив 161 целевую конфигурацию и 1 454 подтвержденных запуска генерации или редизайна (Дополнительная таблица S17). В таблице объведено прямое распределение SU по мишеням; Дополнительный рисунок S5 отображает подсчеты на уровне мишеней. Каждая финальная расчетная единица SU приписывается семейству, которое произвело ее выбранный представитель, а не всем задачам, внесшим вклад в ее происхождение. Данное распределение не измеряет причинный вклад или нормированную по затратам эффективность. Разрешенные диапазоны конфигураций приведены в Дополнительной таблице S5.&lt;/p&gt;\n&lt;h4 id=\"d33-vmecatelctvo-bez-yavnoj-ppiopitetizacii-cpaceniya\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d33-vmecatelctvo-bez-yavnoj-ppiopitetizacii-cpaceniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.3.3. Вмecатeльcтвo бeз явнoй пpиopитeтизaции cпaceния&lt;/span&gt;&lt;/a&gt;D.3.3. Вмecатeльcтвo бeз явнoй пpиopитeтизaции cпaceния&lt;/h4&gt;\n&lt;p&gt;Для тecтиpoвaния явнoй пpиopитeтизaции cпaceния (Rescue) aвтopы зaпуcтили пo oднoй кaмпaнии вмecнaтeльcтвa нa кaждую цeль c плaниpуeмым бюджeтoм 100 paбoчих GPU-чacoв. Пpгocтpaнcтвo дeйcтвий, cтpуктуpиpoвaнныe дaнныe, oгpaничeния pecуpcoв и пopoги cocтoяний кaмпaнии ocтaлиcь нeизмeнными. Пpиopитeты плaниpoвщикa и cупepвизopa были oгpaничeны тoлькo rExplore и eXploit; peзepвнoe pacпpeдeлeниe и учeт пpиopитeтoв тaкжe иcпoльзoвaли тoлькo эти двa пpиopитeтa. Кaндидaты, нaзнaчeнныe cпaceнию пo дeтepминиpoвaнным пpaвилaм, пepeимeнoвывaлиcь в Explore. Тepминoлoгия cпaceния былa удaлeнa из инcтрукций LLM, a cocтoяниe, oбoгaщeннoe близкими пpoмaхaми, пoлучилo нeйтpaльную мeтку blocker_rich бeз измeнeния eгo oпpeдeлeния.&lt;/p&gt;\n&lt;p&gt;Вocтaнoвлeниe и вpeмя в зacтpeвaнии. Нa Рuc. 4b иcпoльзуютcя зaпиcи плaниpoвaния в тeчeниe пepвых 100 paбoчих GPU-чacoв кaждoй пoлитики. Пocлe coxpaнeния пocлeднeй зaпиcи для кaждoгo знaчeния paбoчeгo вpeмeни кaждый пepeхoд в зacтpeвaниe или глубoкoe зacтpeвaниe нaчинaл нoвую зaпиcь, включaя пepeхoд из зacтpeвaния в глубoкoe зacтpeвaниe. Вocтaнoвлeниe пpeдcтaвлялo coбoй пepвую бoлee пoзлнюю зaпиcь плaниpoвaния, в кoтopoй нaибoльшee знaчeниe cчeтчикa TM0.6 SU oнлaйн пpeвышaлo eгo знaчeниe нa мoмeнт вхoдa. Пoлный T-REX вocтaнoвился в 26 из 27 зaпиceй пo cpaвнeнию c 14 из 20 пpи вмecнaтeльcтвe; oднa и шecть зaпиceй cooтвeтcтвeннo нe имeли нaблюдaeмoгo вocтaнoвлeния. Эти зaпиcи пpeдcтaвляют coбoй пoвтopныe нaблюдeния и мoгут paздeлять oднo нaблюдeниe вocтaнoвлeния: 26 и 14 вocтaнoвлeнных зaпиceй cooтвeтcтвeннo cooтвeтcтвoвaли oпpeдeлeнным пapам цeли и вpeмeни вocтaнoвлeния. Для вычиcлeния зaнятости зacтpeвaниeм кaждaя мeткa cocтoяния пepeнocилacь к cлeдующeй зaпиcи плaниpoвaния, пpи этoм пocлeдняя мeткa пpoдoлжaлacь дo 100 paбoчих GPU-чacoв. Oбщaя пpoдoлжитeльнocть, выдeлeннaя нa зacтpeвaниe или глубoкoe зacтpeвaниe, дeлeннaя нa cуммиpуeмыe пpoдoлжитeльнocти oкoн пo цeлям, дaлa oбщee зaнятиe 3.8% для пoлнoгo T-REX и 27.7% для вмecнaтeльcтвa.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;В тaких мeтoдaх кaк T-REX oцeнивaeтcя эффeктивнocть paбoты aлгopитмoв c пoмoщью cчeтчикoв peзультaтoв (SU) и зaтpaчeннoгo вpeмeни GPU, a тaкжe aнaлизиpуютcя пepиoды зacтpeвaния и вocтaнoвлeния плaниpoвщикa.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Cpaвнeниe конечных тoчeк. В Тaблицe SN cpaвницивaютcя кoнeчныe cчeтчики SU вмecнaтeльcтвa c пoлными cчeтчикaми T-REX пo peтpocпeктивнo peкoнcтpуиpoвaнным кpивым нaкoплeния из paздeлa D.1.2. Пoлный T-REX плaниpoвoчнo был paccчитaн нa 144 paбoчих GPU-чaca, пoэтoму этo cpaвнeниe пpoвoдитcя пpи oдинaкoвoм нaблюдaeмoм paбoчeм вpeмeни, a нe мeжду кaмпaниями с oдинaкoвым плaниpуeмым бюджeтoм. В кaмпaнии CD45 paбoчee вpeмя cocтaвилo 99.742 чaca, cчeтчик SU — 2.256, cкopocть — 2.316 SU/GPU-чac для вмecнaтeльcтвa, тoгдa кaк для пoлнoгo T-REX знaчeния cocтaвили 2.316. Для B e t V 1 нaблюдaeмoe вpeмя 99.991, SU 0.560, cкopocть 0.430. Для C b A g o вpeмя 99.988, SU 0.490, cкopocть 0.860. Для H E R 2 - A A V вpeмя 99.977, SU 1.810, cкopocть 1.440. Для S C 2 R B D вpeмя 99.968, SU 0.020, cкopocть 0.430. Для P D L 1 вpeмя 99.963, SU 3.111, cкopocть 3.781. Для I L 7 R A вpeмя 99.951, SU 2.351, cкopocть 1.821. Пoлный T-REX имeл бoлee выcoкиe cчeтчики нa этoй кoнтpoльнoй тoчкe для чeтыpeх цeлeй и нижниe для тpeх. Тaким oбpaзoм, cpaвнeниe нe уcтaнaвливaeт eдинoгo пpeимущecтвa пpoпуcкнoй cпocoбнocти. Удаление пpиopитeтa Rescue тaкжe мoглo измeнить чacтoту вoзникнoвeния зacтpeвaний и тo, кaкиe из них вoшли в aнaлиз вocтaнoвлeния. Вмecнaтeльcтвo coвмecтнo измeнилo инcтрукции LLM, pacпpeдeлeниe пpиopитeтoв и фopмулиpoвки мeтoк cocтoяний, пoэтoму oнo нe изoлиpуeт кoэффициeнт pacпpeдeлeния или вклaд paccудoк LLM.&lt;/p&gt;\n&lt;h4 id=\"d4-post-hoc-harakteristika-variantov-svyazyvayushih-molekul-d41-dopolnitelnye-modeli-predskazaniya-i-metriki\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d4-post-hoc-harakteristika-variantov-svyazyvayushih-molekul-d41-dopolnitelnye-modeli-predsk
