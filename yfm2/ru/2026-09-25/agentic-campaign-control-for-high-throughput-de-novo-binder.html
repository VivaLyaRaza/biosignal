azaniya-i-metriki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.4. Post-hoc характеристика вариантов связывающих молекул D.4.1. Дополнительные модели предсказания и метрики&lt;/span&gt;&lt;/a&gt;D.4. Post-hoc характеристика вариантов связывающих молекул D.4.1. Дополнительные модели предсказания и метрики&lt;/h4&gt;\n&lt;p&gt;Мы охарактеризовали фиксированные репрезентативные варианты, определенные в разделе B.2, с использованием дополнительных предсказаний моделей и оценок. Набор включал 3766 представителей, полученных шестью методами для семи мишеней, причем на каждую пару метод–мишень приходился ровно один представитель в пределах каждого финального кластера Foldseek с TM ≥ 0.6. Все они имели конечные результаты для каждого измерения из Таблицы S19. Унифицированный AlphaFold2 (AF2) выполнил повторную оценку комплексов со стандартными настройками, а инструмент actifpTM использовал ту же конфигурацию AF2-Multimer. Таким образом, оба метода применяли то же семейство предикторов, что и на этапе отбора. В то же время ESMFold2 и Boltz-2 производили перепредсказание комплексов исключительно на основе последовательностей мишени и связывающего белка. Эти пост-hoc анализы не влияли на распределение, квалификацию, кластеризацию или подсчет успешных единиц (SU). Оценка предсказания взаимодействия на основе выровненных ошибок от AF2 (ipSAE) представляет собой показатель уверенности в интерфейсе, где более высокие значения соответствуют лучшим результатам, в отличие от нормализованного iPAE с более низкими значениями для лучших результатов, применявшегося при отборе. Мы используем среднее арифметическое двух его направленных значений, в то время как actifpTM взвешивает уверенность интерфейса по предсказанным вероятностям контактов. Программа PRODIGY предоставила предсказанную свободную энергию связывания Δ G и выведенную из нее константу диссоциации K_D. Данные показатели являются предсказаниями уверенности или аффинности, а не экспериментальными измерениями связывания. В Таблице S19 приведены входные данные оценщиков, настройки, единицы измерения и агрегирование оценок. На Рис. 2c показаны выбранные пост-hoc пороговые значения, а на Рис. S6a–d представлены все 24 пороговых значения для унифицированного AF2, actifpTM, PRODIGY, ESMFold2 и Boltz-2. Каждое пороговое значение применялось отдельно к одному и тому же набору фиксированных представителей, а количество прошедших проверку вариантов суммировалось по всем семи мишеням. T-REX сохранил наибольшее суммарное количество вариантов при каждом пороговом значении. Эти суммарные показатели отражают как размер пула квалифицированных представителей каждого метода, так и долю вариантов, преодолевших каждый порог. Пороговые значения обобщают взаимосвязанные измерения, включая Δ G и производный от нее K_D, и не являются независимыми экспериментами по валидации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Пост-hoc анализ и метрики вроде ipSAE, ipTM или PRODIGY — это дополнительные расчетные методы оценки качества белковых комплексов по уже готовым моделям, которые не заменяют реальные физические измерения аффинности, но позволяют надежно отсеять неудачные варианты.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Число вариантов, прошедших пороговое значение, зависит от входных данных и настроек для каждого инструмента. Унифицированный AF2 использует репрезентативный комплекс (исходный комплекс отбора или репрезентативный PDB) со стандартными настройками из Таблицы S4 и фиксированной входной последовательностью; эффективное зерно (seed) и хэш весов AF2 не сохранялись. Он измеряет межцепочечный pTM (ipTM) и среднее арифметическое двух направленных значений ipSAE. ActifpTM работает с тем же комплексом и конфигурацией AF2-Multimer, рассчитывая ipTM, взвешенный по предсказанным AF2 вероятностям межцепочечных расстояний менее 8 Å. PRODIGY применяет комплекс, предсказанный унифицированным AF2-Multimer, с выбором цепей по умолчанию для предсказания Δ G (ккал·моль⁻¹) и K_D (М) при стандартной температуре пересчета 25 ^°C. ESMFold2 использует только последовательности с 20 циклами, 100 шагами сэмплирования, одним шагом диффузии и зерном, равным фиксированному целочисленному индексу оценки представителя; он сообщает общий ipTM и средний pLDDT по остаткам (шкала 0–1), причем симметричное среднее значений ipTM между цепями мишени и связывающего белка используется как вспомогательное измерение (на Рис. S6c и в шорт-листах раздела D.4.2 применяется общий ipTM). Boltz-2 также задействует только последовательности в режиме пустого множественного выравнивания последовательностей (MSA) с 200 шагами сэмплирования, тремя циклами рециркуляции, одним шагом диффузии, полным выводом PAE и без явного случайного зерна; он выдает ipTM белка, среднюю PAE для всех пар остатков мишень–связывающий белок в обоих направлениях (Å) и средний pLDDT связывающего белка (шкала 0–1), при этом аффинный модуль для оценки этих кандидатов не использовался.&lt;/p&gt;\n&lt;h4 id=\"d42-kratkie-spiski-dlya-konkretnyh-metrik\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d42-kratkie-spiski-dlya-konkretnyh-metrik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.4.2. Краткие списки для конкретных метрик&lt;/span&gt;&lt;/a&gt;D.4.2. Краткие списки для конкретных метрик&lt;/h4&gt;\n&lt;p&gt;Таблицы S20–S22 обобщают отобранные представители фиксированных структур TM0.6 для каждой пары метод–мишень по шести различным критериям ранжирования: минимальный маркер квалификации, AF2 ipTM, средний направленный ipSAE, общая ipTM по версии ESMFold2, actifpTM и предсказанное сродство по PRODIGY. Каждый вид ранжирования формирует собственный сокращенный список; величины Δ G и K_D описывают один и тот же список, упорядоченный по сродству. Из N доступных вариантов каждый список содержит &lt;span class=\"yfm-latex\" data-content=\"n%20%3D%20%5Cmin(10%2C%20N)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; без добавления пустых элементов. Сами маркеры описаны в разделе B.2, а посткалибровочные метрики — в разделе D.4.1. Эти сводки отражают отбор по конкретным метрикам из пулов разного размера, а не единый метамьтичный шорт-лист. Поскольку баллы ранжирования также служат для обобщения выбранных дизайнов, данный подход не является независимой валидацией.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Шорт-листы по метрикам отбирают до 10 лучших вариантов для каждой мишени (CD45, BetV1, CbAgo) по разным алгоритмам (T-REX, PUCT, ε-greedy, Complexa-only, BindCraft-only, BoltzGen-only), используя пороги вроде AF2 ipTM и свободную энергию Δ G.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Процедура отбора и разрешения ничьих (tie-breaking) выстроена строго иерархически. Ранжирование по маркеру упорядочивает дизайны по убыванию &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, затем по среднему маркеру, а после — по значениям pLDDT, iPAE и scRMSD в указанном порядке. Все ранжирования по степени уверенности используют убывающие значения профильного показателя, после чего применяют &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и средний маркер. Ранжирование по сродству использует возрастающие значения K_D, затем Δ G, после чего следуют убывающие значения &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и среднего маркера. Оставшиеся ничьи разрешаются в порядке возрастания лексикографического идентификатора стабильной записи. Все ранжирования используют исходные числовые значения, полученные до округления для отображения.&lt;/p&gt;\n&lt;p&gt;Для мишени CD45 метод T-REX (N=301) формирует выборку n=10/10 со следующими показателями: минимальный маркер &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D%20%3D%200.359\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; [0.395, 0.328], AF2 ipTM 0.872 [0.887, 0.865], средний направленный ipSAE 0.714 [0.729, 0.711], ESMFold2 ipTM 0.813 [0.906, 0.778], actifpTM 0.959 [0.974, 0.958], PRODIGY Δ G = -12.90 [-13.40, -12.00] ккал моль⁻¹ и K_D = 3.6× 10⁻¹⁰ [1.5× 10⁻¹⁰, 1.5× 10⁻⁰⁹] М. Метод PUCT (N=69) дает n=10/10: &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D%20%3D%200.225\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; [0.364, 0.199], AF2 ipTM 0.824 [0.876, 0.819], ipSAE 0.622 [0.715, 0.594], ESMFold2 ipTM 0.716 [0.827, 0.685], actifpTM 0.946 [0.961, 0.934], Δ G = -11.50 [-13.00, -10.90], K_D = 3.7× 10⁻⁰⁹ [3.0× 10⁻¹⁰, 1.0× 10⁻⁰⁸]. Вариант ε-greedy (N=27) предоставляет n=10/10: &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D%20%3D%200.289\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; [0.497, 0.224], AF2 ipTM 0.838 [0.880, 0.832], ipSAE 0.648 [0.746, 0.589], ESMFold2 ipTM 0.733 [0.819, 0.610], actifpTM 0.941 [0.958, 0.919], Δ G = -9.95 [-13.70, -9.30], K_D = 5.2× 10⁻⁰⁸ [9.1× 10⁻¹¹, 1.4× 10⁻⁰⁷]. Метод Complexa-only (N=50) дает n=10/10: &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D%20%3D%200.172\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; [0.241, 0.134], AF2 ipTM 0.809 [0.845, 0.801], ipSAE 0.599 [0.676, 0.567], ESMFold2 ipTM 0.744 [0.864, 0.699], actifpTM 0.933 [0.954, 0.931], Δ G = -12.05 [-12.80, -11.30], K_D = 1.4× 10⁻⁰⁹ [3.9× 10⁻¹⁰, 4.9× 10⁻⁰⁹]. Для BindCraft-only (N=2) доступно &lt;span class=\"yfm-latex\" data-content=\"n%3D2%2F10%5E%7B%5Cdagger%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;: &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D%20%3D%200.216\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; [0.321, 0.111], AF2 ipTM 0.811 [0.837, 0.784], ipSAE 0.585 [0.639, 0.531], ESMFold2 ipTM 0.542 [0.779, 0.305], actifpTM 0.896 [0.924, 0.868], Δ G = -9.90 [-10.30, -9.50], K_D = 6.8× 10⁻⁰⁸ [2.7× 10⁻⁰⁸, 1.1× 10⁻⁰⁷]. Для BoltzGen-only (N=5) получено &lt;span class=\"yfm-latex\" data-content=\"n%3D5%2F10%5E%7B%5Cdagger%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;: &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D%20%3D%200.170\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; [0.326, 0.020], AF2 ipTM 0.780 [0.856, 0.722], ipSAE 0.528 [0.665, 0.436], ESMFold2 ipTM 0.207 [0.528, 0.082], actifpTM 0.924 [0.937, 0.858], Δ G = -11.00 [-12.20, -9.70], K_D = 8.7× 10⁻⁰⁹ [1.1× 10⁻⁰⁹, 8.3× 10⁻⁰⁸].&lt;/p&gt;\n&lt;p&gt;Для мишени BetV1 метод T-REX (N=64) формирует n=10/10: &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D%20%3D%200.351\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; [0.438, 0.330], AF2 ipTM 0.898 [0.915, 0.887], ipSAE 0.793 [0.823, 0.765], ESMFold2 ipTM 0.932 [0.955, 0.920], actifpTM 0.965 [0.978, 0.957], Δ G = -10.90 [-13.80, -10.30], K_D = 1.1× 10⁻⁰⁸ [7.4× 10⁻¹¹, 2.7× 10⁻⁰⁸]. Метод PUCT (N=34) дает n=10/10: &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D%20%3D%200.345\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; [0.415, 0.296], AF2 ipTM 0.896 [0.912, 0.882], ipSAE 0.784 [0.817, 0.752], ESMFold2 ipTM 0.932 [0.951, 0.927], actifpTM 0.966 [0.971, 0.955], Δ G = -11.50 [-14.10, -10.30], K_D = 3.7× 10⁻⁰⁹ [4.8× 10⁻¹¹, 2.6× 10⁻⁰⁸]. Вариант ε-greedy (N=17) дает n=10/10: &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D%20%3D%200.279\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; [0.404, 0.161], AF2 ipTM 0.867 [0.905, 0.837], ipSAE 0.707 [0.817, 0.650], ESMFold2 %7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; [0.424, 0.287], AF2 ipTM 0.868 [0.872, 0.859], ipSAE 0.688 [0.711, 0.645], ESMFold2 ipTM 0.360 [0.714, 0.248], actifpTM 0.940 [0.951, 0.932], Δ G = -10.65 [-11.70, -10.40], K_D = 1.5× 10⁻⁰⁸ [2.7× 10⁻⁰⁹, 2.5× 10⁻⁰⁸]. Вариант ε-greedy (N=9) дает &lt;span class=\"yfm-latex\" data-content=\"n%3D9%2F10%5E%7B%5Cdagger%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;: &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D%20%3D%200.256\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; [0.498, 0.019], AF2 ipTM 0.847 [0.890, 0.746], ipSAE 0.633 [0.778, 0.437], ESMFold2 ipTM 0.107 [0.301, 0.072], actifpTM 0.919 [0.947, 0.842], Δ G = -9.70 [-11.90, -8.70], K_D = 7.1× 10⁻⁰⁸ [2.0× 10⁻⁰⁹, 4.2× 10⁻⁰⁷]. Комплекс-only (N=2) дает &lt;span class=\"yfm-latex\" data-content=\"n%3D2%2F10%5E%7B%5Cdagger%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;: &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D%20%3D%200.019\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; [0.030, 0.008], AF2 ipTM 0.760 [0.767, 0.754], ipSAE 0.490 [0.495, 0.486], ESMFold2 ipTM 0.201 [0.317, 0.086], actifpTM 0.902 [0.911, 0.893], Δ G = -9.10 [-9.40, -8.80], K_D = 2.4× 10⁻⁰⁷ [1.3× 10⁻⁰⁷, 3.5× 10⁻⁰⁷]. Для BindCraft-only (N=52) доступно n=10/10: &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D%20%3D%200.298\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; [0.416, 0.250], AF2 ipTM 0.855 [0.890, 0.840], ipSAE 0.654 [0.750, 0.615], ESMFold2 ipTM 0.242 [0.722, 0.206], actifpTM 0.941 [0.961, 0.925], Δ G = -10.90 [-12.80, -10.60], K_D = 9.7× 10⁻⁰⁹ [4.0× 10⁻¹⁰, 1.8× 10⁻⁰⁸]. Для BoltzGen-only (N=37) получено n=10/10: &lt;span class=\"yfm-latex\" data-content=\"m_%7B%5Cmin%7D%20%3D%200.307\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; [0.415, 0.280], AF2 ipTM 0.841 [0.854, 0.832], ipSAE 0.645 [0.695, 0.604], ESMFold2 ipTM 0.140 [0.441, 0.118], actifpTM 0.927 [0.952, 0.914], Δ G = -13.60 [-16.10, -13.30], K_D = 9.9× 10⁻¹¹ [1.5× 12⁻¹², 1.9× 10⁻¹⁰].&lt;/p&gt;\n&lt;h4 id=\"statisticheskij-analiz-i-ocenka-rezultatov\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#statisticheskij-analiz-i-ocenka-rezultatov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистический анализ и оценка результатов&lt;/span&gt;&lt;/a&gt;Статистический анализ и оценка результатов&lt;/h4&gt;\n&lt;p&gt;Для оценки эффективности различных алгоритмов моделирования и генерации белков, включая методы T-REX, PUCT, ε-greedy, Complexa-only, BindCraft-only и BoltzGen-only, были проведены сравнительные испытания на различных мишенях, таких как HER2-AAV, SC2RBD, PDL1 и IL7RA. В ходе тестирования для мишени HER2-AAV вариант HER2-AAVT-REX показал успешность генерации 10/10 при среднем значении -15.95 (с интервалом от -17.10 до -15.20) и p-значении 2.2e-12 ([2.9e-13, 7.5e-12]). Метод HER2-AAVPUCT продемонстрировал результат 10/10, среднее -13.55 [-15.00, -12.70] и p-значение 1.2e-10 ([9.4e-12, 4.8e-10]). Подход HER2-AAV ε-greedy показал показатель 10/10, среднее -12.60 [-15.60, -12.00] и p-значение 5.6e-10 ([3.5e-12, 1.6e-09]).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;p-значение (p-value) в данном контексте отражает статистическую значимость различий или надежность предсказаний модели, где меньшие значения указывают на более высокую достоверность результатов.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Далее для HER2-AAV метод Complexa-only (при значении 4210/10) дал среднее -13.75 [-15.70, -13.10] и p-значение 9.4e-11 ([2.9e-12, 2.4e-10]), в то время как BindCraft-only (10410/10) показал -14.50 [-15.40, -13.70] с p-значением 2.3e-11 ([5.3e-12, 8.7e-11]), а BoltzGen-only (2/10†) показал -10.30 [-11.40, -9.20] при 8.7e-08 ([4.7e-09, 1.7e-07]). Для мишени SC2RBD результаты распределились следующим образом: T-REX (5510/10) — -12.30 [-13.60, -11.90], 9.1e-10 ([1.1e-10, 1.7e-09]); PUCT (4010/10) — -12.85 [-16.20, -12.20], 4.0e-10 ([1.3e-12, 1.1e-09]); ε-greedy (2010/10) — -12.25 [-13.60, -11.00], 1.1e-09 ([1.1e-10, 9.3e-09]); Complexa-only (0/10†) не показал успешных данных; BindCraft-only (2210/10) — -12.25 [-13.90, -11.60], 1.1e-09 ([6.6e-11, 3.3e-09]); BoltzGen-only (6/10†) — -12.30 [-13.80, -10.60], 1.0e-09 ([7.2e-11, 1.7e-08]).&lt;/p&gt;\n&lt;p&gt;Для мишени PDL1 получены следующие показатели: T-REX (10/10) — -13.15 [-14.40, -12.70], 2.4e-10 ([2.7e-11, 5.1e-10]); PUCT (23310/10) — -11.65 [-12.70, -11.20], 2.8e-09 ([4.5e-10, 5.8e-09]); ε-greedy (6510/10) — -11.50 [-12.70, -10.70], 3.7e-09 ([4.8e-10, 1.5e-08]); Комплекс-only28110/10 — -12.00 [-12.90, -11.70], 1.5e-09 ([3.6e-10, 2.5e-09]); BindCraft-only (23110/10) — -11.80 [-12.40, -11.40], 2.2e-09 ([8.1e-10, 4.1e-09]); BoltzGen-only (10/10) — -12.35 [-14.50, -11.10], 9.0e-10 ([2.3e-11, 7.6e-09]). Наконец, для IL7RA зафиксированы параметры: T-REX (10/10) — -11.45 [-12.70, -11.30], 4.0e-09 ([4.5e-10, 5.1e-09]); PUCT (9510/10) — -11.15 [-13.50, -10.80], 7.1e-09 ([1.2e-10, 1.2e-08]); ε-greedy (4010/10) — -10.85 [-12.60, -9.70], 1.1e-08 ([5.9e-10, 7.8e-08]); Комплекс-only16710/10 — -11.25 [-12.70, -11.00], 5.5e-09 ([4.7e-10, 9.2e-09]); BindCraft-only (17810/10) — -11.45 [-12.60, -10.90], 4.2e-09 ([5.8e-10, 1.0e-08]); BoltzGen-only (10/10) — -11.55 [-13.30, -10.90], 3.3e-09 ([1.8e-10, 1.0e-08]).&lt;/p&gt;\n&lt;h4 id=\"d43-raznoobrazie-vtorichnoj-struktury-i-polozhenij-svyazyvaniya\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d43-raznoobrazie-vtorichnoj-struktury-i-polozhenij-svyazyvaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.4.3. Разнообразие вторичной структуры и положений связывания&lt;/span&gt;&lt;/a&gt;D.4.3. Разнообразие вторичной структуры и положений связывания&lt;/h4&gt;\n&lt;p&gt;Для анализа вторичной структуры и примеров в Рис. 5a,b авторы исследовали 1461 финальный представитель T-REX TM0.6 с помощью программы MDTraj 1.11.0 (функция compute_dssp, параметр simplified=True). Состояния DSSP H, G и I классифицировались как спираль, а E и B — как бета-тяж, при этом в качестве знаменателя использовались все остатки связывающего белка, а остальные назначения относились к категории прочих. Примеры с преобладанием спиралей или тяжей максимизировали соответствующую долю остатков, причем в случае равенства предпочтение отдавалось меньшему дополнительному значению, а смешанные варианты максимизировали меньшую долю из двух. Для сравнения выходов с высоким содержанием бета-структур между методами отбирались только те проекты, где доля тяжей составляла не менее 20% до проведения кластеризации Foldseek TM0.6 внутри каждого метода для конкретной мишени. Метод T-REX продемонстрировал наибольшую эффективность, выявив 308 кластеров (0.306 на один рабочий GPU-час), что значительно превосходит показатель BoltzGen-only (95 кластеров, 0.94 на GPU-час), занявшего второе место, как указано в Таблице S23. T-REX опередил PUCT на шести мишенях из семи.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DSSP и кластеризация Foldseek — это стандартные биоинформатические инструменты для автоматического определения элементов вторичной структуры белка (спиралей и тяжей) и группировки похожих трехмерных структур в кластеры.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для оценки вариабельности контактов между мишенью и связывающим белком контакт определялся как любая пара тяжелых атомов на расстоянии в пределах 6  Å. Признаки контактов учитывали положение в мишени и химический класс аминокислоты связывающего белка: гидрофобные (A/V/L/I/M/C), ароматические (F/Y/W), полярные (S/T/N/Q/H), положительно заряженные (K/R), отрицательно заряженные (D/E), глицин (G), пролин (P) и прочие. Степень различия (диссимилярность) рассчитывалась по формуле &lt;span class=\"yfm-latex\" data-content=\"1%20-%20%2FF_i%20%5Ccap%20F_j%2F%20%2F%20%2FF_i%20%5Ccup%20F_j%2F\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, принимая значения от 0 для идентичных паттернов до 1 при полном отсутствии общих элементов. Относительное положение белков для Рис. 5c определялось путем совмещения предсказанных комплексов CbAgo с общей мишенью по C_α-атомам. Метод главных компонент (PCA) применялся к трехмерным центрам масс для 116 представителей CbAgo T-REX и 54 представителей PUCT TM0.6. Для демонстрации разнообразия позиций среди высокорейтинговых вариантов авторы отобрали структуры P1–P3 на основе масштабированных маржинальных оценок, включающих pLDDT, iPAE и scRMSD, где P1 показал наивысший балл среди верхней половины выборок (n = 58), а P2 и P3 максимизировали минимальное комбинированное расстояние до ранее выбранных примеров с учетом пространственного разделения и диссимилярности контактов.&lt;/p&gt;\n&lt;p&gt;Сравнения с учетом размера выборок. Для анализа всех мишеней мы сопоставили паттерны контактов при едином размере выборки и выровняли положения мишеней с помощью глобального выравнивания последовательностей, чтобы устранить смещения номеров остатков PDB. Для каждой мишени эталоном служила самая длинная последовательность из T-REX и PUCT, а при равной длине предпочтение отдавалось наиболее частой. Штрафы и баллы выравнивания составляли +2 за совпадение, -1 за несовпадение и -2 за гэп; при равенстве баллов приоритет отдавался диагональному шагу, затем гэпу в запросе и в последнюю очередь гэпу в эталоне. Позиции сопоставлялись только по идентичным выровненным остаткам. Эти совпадения должны были покрывать не менее 70% каждой последовательности и составлять по меньшей мере 90% всех выровненных пар без гэпов. Контакты без сопоставленной позиции мишени исключались; каждый сохраненный вариант дизайна обладал непустым набором признаков. Повторно выборка для сравнения позиций CbAgo также использовалась с этим выравниванием последовательностей, применяя выравнивание Кабша по всем сопоставленным атомам Cα мишени. На рис. 5c вместо этого применяются остатки с повторяющимися контактами, определенные ранее. Для каждой мишени и метода мы отобрали по 30 финальных представителей с TM0.6 без возврата и повторили выборку 1,000 раз (случайное зерно 20260831); все пулы содержали не менее 30 представителей. Каждая выборка давала медианное попарное различие паттернов контактов или, в случае позиций CbAgo, медианное трехмерное евклидово расстояние между центрами связывающих белков. Мы приводим среднее значение и 5-й–95-й перцентили этих повторно выбранных медиан. Интервалы описывают вариацию среди подмножеств наблюдаемых пулов, а не доверительные интервалы по независимым кампаниям. Среднее повторно выбранное медианное расстояние для позиций CbAgo составляло 31.2 Å [25.2–36.6] для T-REX и 9.97 Å [9.08–11.00] для PUCT. Различие паттернов контактов было выше у T-REX на четырех мишенях из семи (рис. S24). Эти сравнения подтверждают более широкий спектр предсказанных позиций связывающих белков для CbAgo, в то время как сравнение паттернов контактов не отдавало предпочтения какому-либо методу единообразно для всех мишеней.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Выравнивание Кабша — это стандартный математический метод суперпозиции двух наборов атомов для минимизации среднеквадратичного отклонения, а евклидово расстояние измеряет прямую линейную дистанцию в пространстве между центрами масс белков.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"d5-issledovatelskie-kampanii-na-dopolnitelnyh-mishenyah\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#d5-issledovatelskie-kampanii-na-dopolnitelnyh-mishenyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D.5. Исследовательские кампании на дополнительных мишенях&lt;/span&gt;&lt;/a&gt;D.5. Исследовательские кампании на дополнительных мишенях&lt;/h4&gt;\n&lt;p&gt;Мы сравнили T-REX и PUCT на TNF-α и TrkA вне основного набора из семи мишеней (входные данные мишеней описаны в разделе A.2). В рамках каждой мишени оба метода использовали одинаковую спецификацию мишени, восемь семейств действий, критерии ин силико квалификации и кластеризацию Foldseek TM0.6. Для сравнения при лимите в 100 воркер-GPU-ч мы использовали последнюю заархивированную сводку EvidenceSummary на уровне или ниже этого лимита из кампаний T-REX с бюджетом 144 воркер-GPU-ч. Метод PUCT запускался отдельно с бюджетом 100 воркер-GPU-ч, и мы использовали его финальную заархивированную сводку. В рис. S25 приводится по одной кампании на каждый метод и мишень. Количество квалифицированных дизайнов и онлайн-кластеров SU бралось напрямую из выбранных сводок без постобработочного рекластеризования. На мишени TNF-α метод T-REX зарегистрировал два квалифицированных дизайна в двух онлайн-кластерах TM0.6; PUCT не зафиксировал квалифицированных дизайнов. На TrkA метод PUCT произвел больше квалифицированных дизайнов, чем T-REX (3,714 против 2,369), однако T-REX зарегистрировал больше онлайн SU TM0.6 (451 против 414) и показал более высокую пропускную способность SU. Эти исследовательские результаты были исключены из объединенных результатов первичного бенчмарка. В табл. S25 приводятся исследовательские кампании на двух дополнительных мишенях. Каждая строка соответствует одной кампании. Значения T-REX взяты из последней заархивированной сводки EvidenceSummary на уровне или ниже 100 воркер-GPU-ч в кампаниях с бюджетом воркер-GPU-ч; значения PUCT представляют собой финальные сводки из кампаний с бюджетом 100 воркер-GPU-ч. Квалифицированные дизайны прошли три ин силико критерия из раздела B.1; число онлайн SU TM0.6 представляет собой зарегистрированное число кластеров Foldseek. Воркер-GPU-ч рассчитывается как затраченное время кампании, умноженное на три воркера для T-REX или четыре для PUCT, за исключением GPU T-REX, обслуживающего языковую модель. Пропускная способность определяется как число онлайн SU, деленное на неокругленное зарегистрированное время воркеров. Эти кампании были исключены из первичного бенчмарка.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS7.jpg\" alt=\"Рис. S7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S7&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS8.jpg\" alt=\"Рис. S8\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S8&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нехватка&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ресурсов при&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;дизайне белков&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;агентное&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;управление&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;через LLM&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;рост числа&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;уникальных&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;хитов&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;эффективный&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;поиск новых&lt;/text&gt
