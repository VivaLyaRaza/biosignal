            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"173\" cy=\"159\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"607\" cy=\"209\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · ECOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Умный диспетчер для создания&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;белков ускоряет разработку&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;лекарств&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-f1.jpg\" alt=\"Рисунок 1 / Обзор T-REX. a. T-REX — это агентная среда, которая адаптивно организует вычислительные инструменты для de n\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1 / Обзор T-REX. a. T-REX — это агентная среда, которая адаптивно организует вычислительные инструменты для de novo дизайна белковых лигандов в рамках фиксированного вычислительного бюджета.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1 / Обзор T-REX. a. T-REX — это агентная среда, которая адаптивно организует вычислительные инструменты для de novo дизайна белковых лигандов в рамках фиксированного вычислительного бюджета. b, c. Результаты дизайна распределяются по режимам сбоев, которые определяют различные приоритеты для последующих действий: спасение перспективных дизайнов (Rescue), исследование альтернативных методов или настроек (Explore) либо эксплуатация продуктивных путей (eXploit). d. Данные о завершенных и текущих задачах дизайна организуются в структурированное представление развивающегося состояния кампании и интерпретируются двумя LLM-агентами. Планировщик предлагает гипотезы на основе данных и последующие действия, в то время как Супервайзер расставляет приоритеты для проверенных действий и предлагает их распределение между Rescue, Explore и eXploit. Детерминированный контроллер координирует выполнение задач с учетом доступных вычислительных ресурсов. e. Предложенные действия асинхронно выполняются на доступных графических процессорах, а полученные результаты предоставляют новые данные для последующего планирования и распределения.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Создание белков с заданными свойствами требует огромных вычислительных мощностей и перебора множества вариантов. Исследователи предложили систему T-REX, которая использует языковые модели для координации работы различных генеративных алгоритмов. Такой подход позволяет находить больше уникальных и стабильных структур при ограниченном бюджете времени и ресурсов.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Система T-REX координирует работу генеративных моделей белков.&lt;/li&gt;\n&lt;li&gt;Языковые модели анализируют ошибки и распределяют вычислительные задачи.&lt;/li&gt;\n&lt;li&gt;Производительность уникальных белковых структур выросла в несколько раз.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Современные методы искусственного интеллекта предлагают множество специализированных инструментов для генерации белковых молекул, оценки их структуры и оптимизации аминокислотной последовательности. Однако эффективное сочетание этих инструментов остается сложной задачей, особенно в условиях ограниченного бюджета вычислительных ресурсов графических процессоров. Новая система T-REX решает эту проблему за счет агентного управления процессом проектирования, разделяя задачи на спасение перспективных кандидатов, исследование новых настроек и масштабирование успешных маршрутов.&lt;/p&gt;\n&lt;p&gt;В основе системы лежат агенты на базе больших языковых моделей, которые анализируют текущие результаты, выявляют сбои вроде генерации дубликатов или близких к провалу вариантов и предлагают следующие шаги. Детерминированный контроллер проверяет эти предложения и распределяет задачи по доступным графическим процессорам. При тестировании на семи различных мишенях система показала более высокую производительность по сравнению с традиционными методами поиска по дереву и раздельными генераторами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты получены на основе компьютерного моделирования без физического синтеза и экспериментальной проверки белков в лаборатории.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Развитие искусственного интеллекта привело к появлению обширного набора методов для создания белков de novo. Однако исследователи часто сталкиваются с задачей эффективного применения множества специализированных инструментов в условиях ограниченных вычислительных ресурсов.&lt;/p&gt;\n&lt;p&gt;Для решения этой задачи авторы представляют Target-adaptive Rescue–Explore–eXploit (T-REX) — агентный фреймворк для разработки белковых связующих элементов, который объединяет передовые генеративные модели белков и оценщики структур. В процессе работы системы агенты на основе больших языковых языковых моделей (LLM) анализируют накопленные результаты и принимают решения: спасать ли перспективных кандидатов, исследовать альтернативные настройки или использовать продуктивные направления. При этом детерминированный контроллер проверяет и планирует предлагаемые действия.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Агентный фреймворк и LLM — это подход, при котором компьютерные программы на базе искусственного интеллекта автономно принимают решения, анализируют промежуточные результаты и планируют дальнейшие шаги эксперимента.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тестирование на семи различных мишенях показало, что T-REX адаптивно распределяет вычислительные мощности в зависимости от особенностей конкретной мишени. Система демонстрирует самую высокую пропускную способность по созданию структурно уникальных успешных вариантов белковых связующих по сравнению со всеми базовыми методами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Фреймворк T-REX эффективно распределяет вычислительные ресурсы и превосходит стандартные подходы по числу уникальных структурных «хитов» для семи протестированных мишеней.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Полученные данные доказывают, что адаптивная оркестрация способна эффективно дополнять современные модели проектирования белков. Авторы в открытом доступе публикуют разработанный фреймворк T-REX для оптимизации вычислительных затрат при создании белковых связующих.&lt;/p&gt;\n&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Создание белков de novo становится мощной технологией для разработки новых макромолекул с заданными структурами и функциями, что открывает перспективы в терапии, катализе и молекулярной инженерии. Современные достижения искусственного интеллекта привели к появлению широкого спектра вычислительных инструментов, меняющих процесс проектирования: генеративных моделей скелетов, методов обратного фолдинга для подбора последовательностей, а также моделей предсказания и оценки структуры. Появление совместных генеративных моделей структуры и последовательности, а также интегрированных конвейеров вроде BindCraft расширяет арсенал исследователей. Однако по мере роста числа доступных методов встает вопрос рационального распределения ограниченных вычислительных ресурсов на протяжении всей кампании по дизайну, определяемой как последовательность вычислительных задач для одной конкретной мишени.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кампания по дизайну белков — это многоэтапный итеративный процесс генерации, оптимизации и оценки кандидатов с помощью различных вычислительных алгоритмов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Специализированные инструменты различаются по производительности и стоимости вычислений в зависимости от мишени и этапа работы. Кандидаты могут не проходить in silico фильтры, дублировать существующие структуры или приводить к сбоям вычислений, хотя неудачные варианты часто служат отправной точкой для дальнейшей доработки. Эффективное управление требует интерпретации промежуточных результатов для решения вопросов о модификации многообещающих вариантов или смене стратегии. Последние успехи научных агентов показывают, что большие языковые модели (LLM) способны обеспечивать контекстуальное рассуждение для автономного планирования дальнейших шагов. В дизайне белков LLM-агенты начинают координировать многоэтапные процессы, хотя центральным вызовом остается адаптивное распределение ограниченных вычислительных ресурсов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование больших языковых моделей и ресурсоемких симуляций требует значительных вычислительных затрат и токен-бюджетов, что ограничивает масштабируемость подходов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Генерация белков и оценка их структуры требуют больших затрат времени и ресурсов, в то время как анализ промежуточных итогов с помощью LLM происходит относительно быстро, позволяя направлять тяжелые вычисления. Поскольку параллельные задачи завершаются в разное время и поставляют новые данные асинхронно, возникает необходимость в контроллере кампании, способном непрерывно оценивать поступающую информацию и планировать следующие шаги. В данной работе представлен контроллер Target-adaptive Rescue–Explore–eXploit (T-REX) — агентная система для высокопроизводительного de novo дизайна белков-связывателей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Алгоритм T-REX превзошел неагентный контроллер поиска по дереву в среднем в 2.43 раза и сильнейшие генеративные базовые модели в 2.48 раза по числу структурно уникальных хитов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В системе T-REX агенты на базе LLM анализируют накопленные данные и распределяют работу по трем стратегиям: Rescue (спасение слабых мест перспективных конструкций), Explore (тестирование малоиспользуемых методов и альтернативных настроек) и eXploit (наращивание ресурсов для продуктивных направлений). Детерминированный исполнительный слой проверяет задачи, контролирует лимиты ресурсов и управляет асинхронным выполнением. На семи мишенях de novo дизайна T-REX продемонстрировал максимальную пропускную способность структурно уникальных хитов. Анализ записей кампаний подтверждает, что T-REX гибко адаптирует свои приоритеты в ответ на различные типы сбоев и изменения условий, подтверждая эффективность доказательно-ориентированной оркестрации вычислительных методов.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"21-obzor-kontrollera-kampanii-t-rex\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#21-obzor-kontrollera-kampanii-t-rex\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.1. Обзор контроллера кампании T-REX&lt;/span&gt;&lt;/a&gt;2.1. Обзор контроллера кампании T-REX&lt;/h4&gt;\n&lt;p&gt;Система T-REX разработана для адаптивной оркестрации различных инструментов проектирования белковых связующих с целью максимизации структурно уникальных «хитов» в рамках фиксированного вычислительного бюджета (Рис. 1). Набор инструментов включает шесть генеративных программ — четыре варианта Proteína-Complexa (поиск по лучу, best-of-n, управление Фейнмана-Каца и поиск по дереву Монте-Карло — MCTS), BindCraft и BoltzGen — а также ProteinMPNN для редизайна последовательностей и повторный фолдинг через AlphaFold2 (AF2) для оценки структур (Рис. 1a).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-f1.jpg\" alt=\"Рисунок 1 / Обзор T-REX. a. T-REX — это агентная среда, которая адаптивно организует вычислительные инструменты для de n\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1 / Обзор T-REX. a. T-REX — это агентная среда, которая адаптивно организует вычислительные инструменты для de novo дизайна белковых лигандов в рамках фиксированного вычислительного бюджета.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1 / Обзор T-REX. a. T-REX — это агентная среда, которая адаптивно организует вычислительные инструменты для de novo дизайна белковых лигандов в рамках фиксированного вычислительного бюджета. b, c. Результаты дизайна распределяются по режимам сбоев, которые определяют различные приоритеты для последующих действий: спасение перспективных дизайнов (Rescue), исследование альтернативных методов или настроек (Explore) либо эксплуатация продуктивных путей (eXploit). d. Данные о завершенных и текущих задачах дизайна организуются в структурированное представление развивающегося состояния кампании и интерпретируются двумя LLM-агентами. Планировщик предлагает гипотезы на основе данных и последующие действия, в то время как Супервайзер расставляет приоритеты для проверенных действий и предлагает их распределение между Rescue, Explore и eXploit. Детерминированный контроллер координирует выполнение задач с учетом доступных вычислительных ресурсов. e. Предложенные действия асинхронно выполняются на доступных графических процессорах, а полученные результаты предоставляют новые данные для последующего планирования и распределения.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Задачи de novo дизайна связующих формулируются как проблема распределения онлайн-ресурсов среди вычислительных заданий, где каждое задание определяет семейство действий с конкретным инструментом, конфигурацией гиперпараметров и родительским дизайном (Таблица S5). Проектируемые белки должны отвечать заданным in silico критериям (пороги pLDDT, iPAE, scRMSD), а пул кандидатов структурируется с помощью Foldseek для подсчета уникальных хитов (Методы, Раздел 4.2). Поскольку производство хитов может замедляться или останавливаться, простой подсчет количества хитов не показывает причину потерь. В T-REX выделяют четыре операционные модальности сбоев (Рис. 1b): генерация не дает пригодного результата, оценка задерживается, кандидат чуть не дотягивает до критериев или квалифицированный дизайн дублирует уже найденную структуру.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Контроллер T-REX координирует шесть генеративных инструментов и использует агентов на базе языковых моделей для преодоления четырех типов сбоев в дизайне белковых связующих, обеспечивая многократное превосходство над базовыми стратегиями.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для организации ответных мер T-REX определяет три приоритета последующих действий: Rescue (спасение), Explore (исследование) и eXploit (эксплуатация) (Рис. 1c). Вместо опоры только на число хитов используется EvidenceSummary (сводка доказательств), объединяющая результаты, текущую работу и ресурсы (Рис. 1d; Методы, Раздел 4.3; Секция C.4 и Рис. S1). На ее основе назначается одно из семи состояний кампании. Актуальность данных зависит от истории, поэтому для интерпретации контекста применяются LLM-агенты. Planner LLM формирует гипотезы в виде HypothesisCards, после чего задания проходят детерминированную стадию проверки «Check + Build». Затем Supervisor LLM распределяет кандидатов по приоритетам Rescue, Explore или eXploit и предлагает пропорции их распределения (Рис. 1d).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS1.jpg\" alt=\"Рисунок S1 / Архив кампании и построение EvidenceSummary.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок S1 / Архив кампании и построение EvidenceSummary.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок S1 / Архив кампании и построение EvidenceSummary. a, Девять потоков записей только для добавления, сохраненных в первичных кампаниях, сгруппированы по ролям (Раздел C.3). ResultRecord хранит измерения, родительские ссылки, затраты воркеров, статус и пути вывода. Raw logs и файлы остаются в каталоге запуска; LLMCallRecord сохраняет хэш промпта и компактный аудит вместо полного текста промпта. b, Детерминированные правила объединяют архивные записи с информацией о текущих заданиях и ресурсах для построения полной архивной EvidenceSummary (стрелка). Окна в 3 и 6 воркер-GPU-ч используют записанные для всей кампании затраты воркеров. На рисунке S2 показаны меньшие входные данные, предоставляемые LLM. Окончательная квалификация и подсчет SU пересчитываются отдельно после применения правил включения конечных точек (Раздел B.3). Серый цвет обозначает результаты, выборки и входные данные для сокращения; зеленый — записи доказательств/решений и содержимое сводки; синий — записи запуска/выполнения.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM-агенты (Planner и Supervisor) — это языковые модели, которые рассуждают над текущим состоянием вычислительной кампании, анализируют накопленные данные и принимают стратегические решения о том, какие методы запускать дальше.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Детерминированный контроллер выбирает задачи по мере высвобождения ресурсов графических процессоров. Поскольку время выполнения генерации, редизайна и оценки различается, T-REX использует асинхронное выполнение, интегрируя завершенные результаты в процесс принятия решений без простоя всей системы (Рис. 1e). Результаты заносятся в архив кампании (Методы, Раздел 4.3) и EvidenceSummary, замыкая цикл между выполнением и планированием (Рис. 1e; Методы, Раздел 4.5). В данной работе Planner и Supervisor используют модель Qwen3.6-27B-FP8, обслуживаемую через vLLM.&lt;/p&gt;\n&lt;p&gt;Мишень T-REX PUCT ε-gr. CX BC BG прирост T-REX по сравнению с PUCT и лучшим GO&lt;br /&gt;\nCD45 2.090 0.479 0.188 0.347 0.014 0.035 4.36× 6.02×&lt;br /&gt;\nBetV1 0.444 0.236 0.118 0.118 0.021 0.104 1.88× 3.76×&lt;br /&gt;\nCbAgo 0.806 0.375 0.062 0.014 0.361 0.257 2.15× 2.23×&lt;br /&gt;\nHER2-AAV 1.417 0.361 0.188 0.292 0.722 0.014 3.92× 1.96×&lt;br /&gt;\nSC2RBD 0.382 0.278 0.139 0.000 0.153 0.042 1.38× 2.50×&lt;br /&gt;\nPDL1 3.347 1.618 0.451 1.951 1.604 1.097 2.07× 1.72×&lt;br /&gt;\nIL7RA 1.660 0.660 0.278 1.160 1.236 1.035 2.52× 1.34×&lt;/p&gt;\n&lt;h4 id=\"22-t-rex-obespechivaet-vysokuyu-proizvoditelnost-pri-kompyuternom-dizajne-dlya-raznoobraznyh-belkovyh-mishenej\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#22-t-rex-obespechivaet-vysokuyu-proizvoditelnost-pri-kompyuternom-dizajne-dlya-raznoobraznyh-belkovyh-mishenej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.2. T-REX обеспечивает высокую производительность при компьютерном дизайне для разнообразных белковых мишеней&lt;/span&gt;&lt;/a&gt;2.2. T-REX обеспечивает высокую производительность при компьютерном дизайне для разнообразных белковых мишеней&lt;/h4&gt;\n&lt;p&gt;Мы сопоставили систему T-REX с тремя исключительно генеративными подходами и двумя неагентными адаптивными контроллерами при одинаковых вычислительных ресурсах воркеров для семи мишеней из бенчмарка Proteína-Complexa (Complexa): CD45, BetV1, CbAgo, HER2-AAV, SC2RBD, PDL1 и IL7RA (Рис. 2; Таблица 1). В качестве генеративных базовых методов выступили Complexa, BindCard и BoltzGen, а в роли адаптивных контроллеров — неагентный поиск по дереву решений PUCT и алгоритм ε-greedy. Контроллеры PUCT и ε-greedy работали в том же пространстве действий и в рамках той же среды выполнения и оценки, что и T-REX, но использовали распределение на основе скалярных наград без контекстных рассуждений на базе языковых моделей (Рис. 2).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-f2.jpg\" alt=\"Рисунок 2 / T-REX создает больше структурно уникальных хитов, чем базовые методы в ходе кампании по дизайну. a.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2 / T-REX создает больше структурно уникальных хитов, чем базовые методы в ходе кампании по дизайну. a.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 2 / T-REX создает больше структурно уникальных хитов, чем базовые методы в ходе кампании по дизайну. a. Кумулятивное количество структурно уникальных хитов по отношению к GPU-часам для семи мишеней для T-REX, неагентных адаптивных подходов и базовых моделей с одним генератором. b. Пропускная способность хитов при кластеризации MMseqs2 при 70% идентичности последовательностей, показанная относительно альтернативы с наибольшей пропускной способностью для каждой мишени. c. Количество структурно уникальных хитов, сохраненных при альтернативных апостериорных пороговых значениях качества, объединенных по семи мишеням. afpTM и ESMFold2 ipTM измеряют предсказанную уверенность интерфейса, а PRODIGY оценивает свободную энергию связывания (Δ𝐺, ккал моль−1). Каждый порог применяется отдельно к одному и тому же набору представителей кластера TM0.6. d. Пропускная способность хитов по трем независимо инициализированным кампаниям для T-REX, PUCT и 𝜖-жадного алгоритма на CD45, SC2RBD и CbAgo. Точки показывают отдельные кампании; ромбы и планки погрешностей показывают среднее значение и стандартное отклонение.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;strong&gt;Таблица 1.&lt;/strong&gt; Пропускная способность успешных результатов проектирования белковых связывающих агентов для T-REX и базовых методов&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Планировщик&lt;/th&gt;\n&lt;th&gt;ЛЛМ&lt;/th&gt;\n&lt;th&gt;Сокращенная сводка EvidenceSummary; активные или недавние HypothesisCards из архива кампании; доступные семейства действий и разрешенные настройки.&lt;/th&gt;\n&lt;th&gt;HypothesisCards с гипотезами, связанными с доказательствами, последующими тестами и предсказанными изменениями измерений.&lt;/th&gt;\n&lt;th&gt;C.5.2–C.5.3&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Hit throughput is reported as the number of structurally unique hits per GPU-hour under a total 144 H100 worker GPU-hour budget.Hits are designs that pass the prespecified in silico criteria and are clustered with Foldseek at a TM-score threshold of 0.6.Gain columns report the T-REX ratio relative to PUCT and the highest-throughput generator-only (GO) baseline for each target.𝜖-gr., 𝜖-greedy; CX, Complexa-only; BC, BindCraft-only; BG, BoltzGen-only.Bold and underline indicate the highest and second-highest throughput, respectively, for each target.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;За исключением генеративных подходов, T-REX продемонстрировал превосходство по всем фронтам благодаря целенаправленной оркестровке инструментов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;T-REX сгенерировал 1461 структурно уникальный хит (SU) при пороге TM 0.6 за 48 часов на узле с 4 графическими процессорами H100, превзойдя все 5 базовых алгоритмов с геометрическим средним приростом производительности в 2.43 раза по сравнению с PUCT и в 2.48 раза по сравнению с лучшим генеративным методом.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Показатели производительности T-REX составляли от 1.38 до 4.36 раза по сравнению с PUCT для различных мишеней. Динамика производительности за 10, 50, 100 и 144 GPU-часа детально подтверждает эти траектории (Рис. 2а; Таблица S10). Преимущество T-REX оказалось устойчивым к изменению определений структурного разнообразия и критериев качества (Рис. 2b, c). Система лидировала для каждой мишени при порогах TM-score 0.5, 0.6 и 0.8, а также при кластеризации последовательностей с идентичностью 70% (Рис. 2b; Таблицы S13, S14). Прирост сохранялся и при ужесточении критериев квалификации хитов (Рис. S4). Анализ с использованием диагностических инструментов AF2, actifpTM, PRODIGY, ESMFold2 и Boltz-2 показал, что T-REX удерживает наибольшее суммарное число уникальных структур, прошедших каждый из порогов (Рис. 2c; Рис. S6), подтверждая независимость результатов от оценки на базе AF2. Независимо инициализированные серии экспериментов для CD45, SC2RBD и CbAgo подтвердили стабильное превосходство T-REX над PUCT и ε-greedy (Рис. 2d). Кроме того, T-REX обошел байесовский оптимизатор SMAC3 без LLM по всем семи мишеням (Таблица S11), а также продемонстрировал более высокую производительность по метрике TM0.6 SU для двух дополнительных мишеней — TNF-α и TrkA (Таблица S25).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS4.jpg\" alt=\"Рисунок S4 / Чувствительность к одновременному ужесточению трех критериев квалификации. Фиксированные конечные кластеры \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок S4 / Чувствительность к одновременному ужесточению трех критериев квалификации. Фиксированные конечные кластеры Foldseek TM0.6 на воркер-GPU-ч, чей выбранный представитель удовлетворяет требованию, согласно которому запасы нормализованных pLDDT, iPAE и scRMSD составляют не менее 𝜏; 𝜏 = 0 восстанавливает первичное правило квалификации. Скорости используют заранее заданный знаменатель в 144 воркер-GPU-ч H100.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS4-2.jpg\" alt=\"Рис. S4 (продолжение 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S4 (продолжение 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS4-3.jpg\" alt=\"Рис. S4 (продолжение 3)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S4 (продолжение 3)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS4-4.jpg\" alt=\"Рис. S4 (продолжение 4)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S4 (продолжение 4)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS6.jpg\" alt=\"Рисунок S6. Фиксированные представители кластеров, сохраненные при различных пороговых значениях апостериорной оценки.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок S6. Фиксированные представители кластеров, сохраненные при различных пороговых значениях апостериорной оценки.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок S6. Фиксированные представители кластеров, сохраненные при различных пороговых значениях апостериорной оценки. Количество фиксированных представителей из финальных кластеров Foldseek TM0.6, преодолевших пороги для: a, гармонизированных AF2 ipTM и actifpTM; b, предсказанных PRODIGY Δ𝐺 (ккал моль−1) и полученных 𝐾D (нМ); c, среднего pLDDT комплекса ESMFold2 и общего ipTM, сообщаемого пакетом; и d, ipTM белка Boltz-2 и pLDDT связывающего агента. Пороговые значения pLDDT для ESMFold2 и Boltz-2 используют заявленную шкалу 0–1. Количество объединено по семи мишеням. Каждый порог применялся отдельно к одному и тому же набору представителей. Все четыре панели используют общую шкалу количества; полужирные значения отмечают наибольшее количество при каждом пороге. Complexa, BindCraft и BoltzGen обозначают базовые линии только для генераторов. Эти апостериорные диагностические данные не влияли на распределение, квалификацию или подсчет SU.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Агентные системы на базе LLM в T-REX динамически выбирают инструменты и корректируют стратегию на основе промежуточных результатов, в отличие от жестких алгоритмов поиска вроде PUCT.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"23-t-rex-integriruet-dannye-kampanii-dlya-planirovaniya-posleduyushih-zadach\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#23-t-rex-integriruet-dannye-kampanii-dlya-planirovaniya-posleduyushih-zadach\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.3. T-REX интегрирует данные кампании для планирования последующих задач&lt;/span&gt;&lt;/a&gt;2.3. T-REX интегрирует данные кампании для планирования последующих задач&lt;/h4&gt;\n&lt;p&gt;Для качественного анализа того, как T-REX использует контекст для интерпретации неудач и выбора следующих шагов, мы ретроспективно изучили три траектории. Для мишени HER2-AAV тестирование на основе награды pLDDT не дало квалифицированных дизайнов (0/32), что привело к пересмотру гипотезы о совместимости последовательности и остова, после чего задача по уточнению последовательности принесла 5/32 успешных дизайнов (Рис. 3а). В случае CbAgo пять дизайнов с параметрами iPAE выше порогового значения стимулировали более широкое направленное моделирование по методу Фейнмана–Каца (FK), что позволило получить 4/16 квалифицированных вариантов (Рис. 3b). Для PDL1 родительский вариант, не прошедший проверку только по pLDDT, был отправлен на процедуру редизайна с фиксированным остовом с помощью ProteinMPNN, что дало 16 потомков, из которых 14 прошли отбор, включая один новый структурно уникальный хит (Рис. 3c). Архив кампании связывает ранние данные с последующими тестами и измерениями, а пример с PDL1 сохраняет прямую связь между родительским и дочерним вариантами. Эти примеры иллюстрируют эффективное повторное использование специфичных для критериев данных для планирования новых вычислительных шагов.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-f3.jpg\" alt=\"Рисунок 3 / T-REX использует результаты кампании для предложения стратегий последующего дизайна.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3 / T-REX использует результаты кампании для предложения стратегий последующего дизайна.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 3 / T-REX использует результаты кампании для предложения стратегий последующего дизайна. Три ретроспективных примера иллюстрируют, как T-REX использует наблюдаемые результаты для предложения последующих вычислительных действий. a. Для HER2-AAV партия, оптимизирующая pLDDT, не дала успешных дизайнов, что послужило стимулом для уточнения последовательности, которое привело к 5/32 успешным дизайнам и трем новым структурно уникальным хитам. b. Для CbAgo многократные дизайны, не прошедшие только критерий iPAE, побудили к более широкому поиску Фейнмана–Каца (FK), что дало 4/16 успешных дизайнов и два новых структурно уникальных хита. c. Для PDL1 дизайн, не прошедший только критерий pLDDT, побудил к редизайну последовательности ProteinMPNN с фиксированным остовом, что привело к 14/16 успешным дизайнам и одному новому структурно уникальному хиту. Оранжевая и зеленая метки обозначают соответственно не пройденные и пройденные критерии дизайна.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ретроспективный анализ трех траекторий демонстрирует логику работы системы, однако для окончательных выводов о её универсальности в биоинженерии требуются масштабные экспериментальные «мокрые» валидации in vitro.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"24-t-rex-adaptiruet-raspredelenie-resursov-v-zavisimosti-ot-sostoyaniya-kampanii-i-udelyaet-prioritetnoe-vnimanie-vyhodu-iz-tupikov\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#24-t-rex-adaptiruet-raspredelenie-resursov-v-zavisimosti-ot-sostoyaniya-kampanii-i-udelyaet-prioritetnoe-vnimanie-vyhodu-iz-tupikov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.4. T-REX адаптирует распределение ресурсов в зависимости от состояния кампании и уделяет приоритетное внимание выходу из тупиков&lt;/span&gt;&lt;/a&gt;2.4. T-REX адаптирует распределение ресурсов в зависимости от состояния кампании и уделяет приоритетное внимание выходу из тупиков&lt;/h4&gt;\n&lt;p&gt;Мы исследовали, как алгоритм T-REX подстраивает распределение задач, анализируя изменения приоритетов Rescue (спасение), Explore (исследование) и eXploit (эксплуатация) в различных состояниях кампании. Состояния определялись на основе архивных данных с помощью разработанной нами классификации из семи состояний (Рис. 1d). Из 1454 подтвержденных запусков генерации и редизайна на долю Explore приходилось 74% запусков в условиях дефицита данных, на Rescue — 51% в состояниях «застоя» (stall) или «глубокого застоя» (deep stall), а на eXploit — 82% в продуктивных состояниях с дублированием (Рис. 4a). Таким образом, T-REX гибко распределяет нагрузку: отдает предпочтение Explore при нехватке данных, Rescue при застое и eXploit, когда эффективные пути продолжают приносить новые структуры, несмотря на их частые повторы.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-f4.jpg\" alt=\"Рисунок 4 / T-REX адаптирует стратегии дизайна к состоянию кампании и накопленным данным. a.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4 / T-REX адаптирует стратегии дизайна к состоянию кампании и накопленным данным. a.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 4 / T-REX адаптирует стратегии дизайна к состоянию кампании и накопленным данным. a. Приоритеты Rescue–Explore–eXploit (R/E/X) по 1454 задачам генерации и редизайна, сгруппированные по состоянию кампании. b. GPU-часы от момента входа в состояние застопорившейся кампании до получения следующего структурно уникального хита для T-REX и T-REX без явного приоритета Rescue. Точки показывают отдельные события восстановления; более крупные маркеры и полосы показывают медианы и межквартильные размахи. c. Приоритеты R/E/X по 1305 задачам генерации и редизайна, сгруппированные по основным данным, лежащим в основе каждого решения. d. Стратегии последующего дизайна для тех же задач, сгруппированные по основным данным, как в пункте c.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Приоритет Rescue критически важен для преодоления застоя: полная версия T-REX успешно выходила из тупика в 26 из 27 случаев по сравнению с 14 из 20 при отключении этого приоритета, а медианное время до появления нового успешного дизайна сократилось с 5.04 до 1.77 часа для обычного застоя и с 7.60 до 3.52 часа для глубокого.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы проверили роль приоритета Rescue в преодолении тупиков, удалив эту функцию при сохранении остального пространства действий. За первые 100 GPU-часов восстановление измерялось с момента попадания в состояние застоя до получения следующего нового дизайна с TM ≥ 0.6 (Рис. 4b). Полнофункциональный T-REX справился с выходом из тупика в 26 из 27 таких случаев, тогда как в варианте без Rescue — лишь в 14 из 20. Среди успешных попыток медианное время до следующего успешного дизайна оказалось короче у полного T-REX как для обычного застоя (1.77 против 5.04 GPU-часов), так и для глубокого (3.52 против 7.60 GPU-часов). Кроме того, полный T-REX проводил в состояниях застоя значительно меньше времени, чем модификация без Rescue (3.8% против 27.7%). Эти данные подтверждают ключевую роль приоритезации Rescue.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Изучение связи между результатами задач и приоритетами помогает понять внутреннюю логику ИИ-агента, который направляет запросы на пересчет весов генератора при проблемах с уверенностью модели или на повторение путей при структурном дублировании.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Наконец, мы изучили связь между исходами задач, дублированием структур и приоритетами распределения. Среди 1305 запусков с четко определенной ретроспективной первичной целью, уверенность в интерфейсе (iPAE) и структурное дублирование чаще всего ассоциировались с eXploit (65% и 93% соответственно), в то время как уверенность в фолдинге (pLDDT) в основном связывалась с Rescue (88%, Рис. 4c). Последующие задачи также различались в зависимости от типа доказательств: метрики уверенности обычно приводили к изменению весов скоринга генератора или редизайну последовательности, тогда как дублирование структур чаще вело к повторению известных маршрутов с последующей корректировкой настроек поиска или выборки (Рис. 4d).&lt;/p&gt;\n&lt;h4 id=\"25-sproektirovannye-belki-ohvatyvayut-raznoobraznye-vtorichnye-struktury-i-predskazannye-polozheniya-svyazyvaniya\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#25-sproektirovannye-belki-ohvatyvayut-raznoobraznye-vtorichnye-struktury-i-predskazannye-polozheniya-svyazyvaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.5. Спроектированные белки охватывают разнообразные вторичные структуры и предсказанные положения связывания&lt;/span&gt;&lt;/a&gt;2.5. Спроектированные белки охватывают разнообразные вторичные структуры и предсказанные положения связывания&lt;/h4&gt;\n&lt;p&gt;Для качественной характеристики репертуара связывающих белков, созданных T-REX, мы изучили состав вторичной структуры структурно уникальных хитов. Для всех 1461 финального представителя с TM ≥ 0.6 по семи основным целевым кампаниям мы рассчитали доли α-спиралей и β-тяжей с использованием упрощенной трехуровневой классификации DSSP (Рис. 5a, 5b). Чтобы сравнить дизайн белков с высоким содержанием β-тяжей между методами, мы отобрали все квалифицированные структуры, у которых до кластеризации не менее 20% остатков относились к β-тяжам. По всем семи мишеням T-REX сформировал 308 кластеров с TM ≥ 0.6, в то время как у ближайшего альтернативного метода BoltzGen-only этот показатель составил 95 (Таблица S23). Эти результаты показывают, что T-REX создает разнообразные вторичные структуры, включая большее число β-обогащенных кластеров по сравнению с остальными методами.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-f5.jpg\" alt=\"Рисунок 5 / T-REX производит лиганды с разнообразными структурами и предсказанными положениями связывания. a.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5 / T-REX производит лиганды с разнообразными структурами и предсказанными положениями связывания. a.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 5 / T-REX производит лиганды с разнообразными структурами и предсказанными положениями связывания. a. Представительные предсказанные комплексы, показывающие лиганд IL7RA, богатый 𝛼-спиралями, лиганд CbAgo со смешанными 𝛼-спиралями/𝛽-тяжами и лиганд PDL1, богатый 𝛽-структурами. b. Доли вторичной структуры хитов T-REX (𝑛= 1461), рассчитанные с использованием DSSP. Пронумерованные точки соответствуют примерам на рисунке a. c. Представительные хиты T-REX в различных предсказанных положениях связывания на CbAgo. d. Анализ главных компонент (PCA) положений лигандов относительно мишени для хитов от T-REX (𝑛= 116) и PUCT (𝑛= 54).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;T-REX демонстрирует превосходство в разнообразии получаемых структур, формируя 308 кластеров с TM ≥ 0.6 против 95 у аналогов, а также обеспечивая более широкий пространственный охват положений связывания по сравнению с методом PUCT.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Затем мы проанализировали предсказанные положения связывающих белков относительно мишени CbAgo для оценки пространственной вариабельности. Совместив каждый предсказанный комплекс по мишени, мы определили центр каждого связывающего белка как среднее положение его C_α-атомов. Совместный анализ методом главных компонент (PCA) показал, что центры белков T-REX занимают более обширную область, чем у метода PUCT (Рис. 5c). На основе 1000 подвыборок по 30 представителей для каждого метода среднее попарное расстояние между центрами связывающих белков составило 31.2 Å для T-REX и 9.97 Å для PUCT (Таблица S24). Таким образом, T-REX обеспечивает не только разнообразие вторичных структур, но и широкий спектр пространственных положений связывания относительно мишени.&lt;/p&gt;\n&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;h4 id=\"obsuzhdenie-rezultatov-i-perspektivy-metoda-t-rex\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#obsuzhdenie-rezultatov-i-perspektivy-metoda-t-rex\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение результатов и перспективы метода T-REX&lt;/span&gt;&lt;/a&gt;Обсуждение результатов и перспективы метода T-REX&lt;/h4&gt;\n&lt;p&gt;Авторы предлагают Target-adaptive Rescue–Explore–eXploit (T-REX) — агентный контроллер кампаний, который обеспечивает высокую пропускную способность de novo дизайна связывающих белков за счет координации множества специализированных генераторов и оценщиков структуры белков. За счет применения нескольких инструментов и стратегий проектирования T-REX продемонстрировал более высокую производительность по сравнению с базовыми моделями на основе одного генератора и неагентными адаптивными контроллерами при одинаковых вычислительных бюджетах (Рис. 2). Эти результаты подчеркивают, что координация на уровне кампаний становится важным дополнительным направлением наряду с совершенствованием инструментов белкового дизайна.&lt;/p&gt;\n&lt;p&gt;Центральным элементом T-REX является сочетание адаптивного принятия решений на основе рассуждений языковых моделей (LLM), структурированной классификации результатов и типов неудач, а также детерминированного контроля для эффективного распределения ресурсов. Вместо того чтобы заставлять LLM анализировать неструктурированную историю попыток, T-REX систематизирует исходы кампании в интерпретируемые типы неудач и состояния кампании, формируя контекст для последующих шагов (Рис. 1). Два LLM-агента управляют этим структурированным массивом данных: Планировщик (Planner) предлагает гипотезы и дальнейшие действия, а Супервайзор (Supervisor) расставляет приоритеты для кандидатов и определяет распределение вычислительных мощностей между режимами Спасения (Rescue), Исследования (Explore) и Эксплуатации (eXploit). Эти приоритеты позволяют разделять задачи по исправлению многообещающих, но неуспешных проектов, поиску альтернативных стратегий и развитию уже продуктивных подходов (Рис. 3, 4).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;LLM-агенты (в данном случае на базе Qwen3.6-27B-FP8) — это программы на основе больших языковых моделей, способные автономно планировать действия, анализировать промежуточные результаты и принимать решения на основе текста.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Оценка T-REX проводилась исключительно в вычислительной среде с использованием устоявшихся ин silico метрик для определения успешных и уникальных находок (хитов). Хотя в дальнейшем необходима экспериментальная валидация, отдельные генераторы в составе T-REX (Proteína-Complexa, BindCraft и BoltzGen) уже доказали способность создавать экспериментально подтвержденные связывающие белки в предыдущих исследованиях. Реальный de novo дизайн также требует оценки аффинности связывания, специфичности и технологичности с последующей оптимизацией лигандов, молекулярным моделированием и скринингом мутаций. Интеграция T-REX с робототехникой и автономными лабораториями в будущем способна замкнуть цикл проектирования, тестирования и уточнения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;T-REX превосходит традиционные подходы за счет разделения структурированного представления состояния кампании, LLM-генерации гипотез и детерминированного распределения ресурсов.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Текущая оценка метода выполнена исключительно в виртуальной среде (in silico), а для полноценного внедрения требуется экспериментальная проверка с оценкой реальной аффинности и специфичности белков.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"41-specifikaciya-kampanii-i-obshee-prostranstvo-dejstvij\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#41-specifikaciya-kampanii-i-obshee-prostranstvo-dejstvij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.1. Спецификация кампании и общее пространство действий&lt;/span&gt;&lt;/a&gt;4.1. Спецификация кампании и общее пространство действий&lt;/h4&gt;\n&lt;p&gt;Настройка кампаний и контроллеры. Система T-REX в адаптивном режиме подбирает вычислительные задачи, чтобы максимизировать количество структурно различающихся вариантов связывающих белков (хитов), получаемых в рамках фиксированного вычислительного бюджета. Кампания представляет собой совокупность задач по генерации, редизайну и оценке для конкретной мишени, выполняемых с использованием заданного лимита ресурсов и нескольких графических процессоров (GPU). Для каждой мишени применялись заранее определенные пространственная структура и горячие точки сайта связывания, а также стандартный диапазон длин белков (Таблица S1). Подсчет структурно уникальных хитов проводился по стандартным критериям компьютерного отбора и кластеризации, описанным в разделе 4.2. В качестве контроллеров на уровне кампаний выступали алгоритмы T-REX, PUCT и ε-greedy, которые функционировали в едином пространстве действий с общими границами параметров, а также общей средой выполнения и оценки. Алгоритмы PUCT и ε-greedy распределяли ресурсы на основе скалярных наград без применения контекстного рассуждения на базе больших языковых моделей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Пространство действий в данном контексте — это набор доступных алгоритмов и их параметров, которыми система управляет для поиска лучших белковых молекул.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Общее пространство действий. Это пространство включало восемь семейств действий и их конфигураций, разрешенных в кампании: генерация de novo с использованием четырех вариаций поиска Complexa (лучевой поиск (beam search), метод best-of-n, управление по Фейнману–Кацу и поиск по дереву Монте-Карло), а также программы BindCraft и BoltzGen; редизайн последовательностей с помощью ProteinMPNN; и оценка с использованием AF2. Внутри этого пространства семейство действий задает вычислительный метод, маршрут объединяет задачи генерации или редизайна со схожими настройками, а конкретная задача определяет выполняемое вычисление, включая допустимые параметры и родительский дизайн (если применимо). Контроллеры могли регулировать специфичные для семейств настройки и веса компонентов функции награды Complexa или потерь BindCraft в заранее заданных пределах. Веса предобученных моделей, реализации генераторов и разрешенное пространство действий оставались неизменными на протяжении всей кампании, в то время как доступные задачи обновлялись по мере выбора конфигураций и появления новых дизайнов, пригодных для редизайна.&lt;/p&gt;\n&lt;p&gt;Выполнение кампании. Все три адаптивных контроллера начинали работу с предопределенных задач Complexa Beam, BoltzGen и BindCraft при стандартных начальных настройках. Алгоритмы PUCT и ε-greedy дополнительно запускали задачу Complexa best-of-n на своем четвертом рабочем потоке. По мере поступления результатов последующие задачи выбирались на основе накопленных данных кампании, включая исходы вычислений и оценок, качество и новизну дизайнов, производительность и затраты на маршруты, а также состояние ресурсов. Использование рабочей силы учитывалось по каждой задаче, а квалификация — по каждому дизайну. Для статистики контроллеров маршруты служили единицей агрегирования результатов работы и вычислительных затрат. Маршруты редизайна сохраняли контекст генерации исходного уровня. Операционно каждая кампания строилась на повторяющемся цикле сбора данных, планирования и выполнения: завершенные задачи обновляли информацию кампании, контроллер использовал ее для планирования и приоритизации дальнейшей работы, прошедшие проверку задачи попадали в общую очередь исполнителей, а их результаты становились основой для последующих решений.&lt;/p&gt;\n&lt;h4 id=\"42-kvalifikaciya-dizajna-i-izmerenie-propusknoj-sposobnosti\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#42-kvalifikaciya-dizajna-i-izmerenie-propusknoj-sposobnosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2. Квалификация дизайна и измерение пропускной способности&lt;/span&gt;&lt;/a&gt;4.2. Квалификация дизайна и измерение пропускной способности&lt;/h4&gt;\n&lt;p&gt;Оценка и квалификация разработанных вариантов проводились в два последовательных этапа. Сначала конструкции должны были отвечать стандартным критериям отбора, после чего прошедшие отбор белковые цепи объединялись в кластеры для выделения структурно уникальных вариантов (SU). Дизайн допускался к дальнейшим этапам только в том случае, если показатель pLDDT белка-связывателя составлял не менее 90, нормализованный параметр iPAE не превышал 7/31, а среднеквадратичное отклонение структуры белка-связывателя scRMSD было менее 1.5 Å. Эти пороговые значения были адаптированы из протокола оценки Proteina-Complexa и измерений стандартного протокола AF2-Multimer на базе ColabDesign. Нормализованный iPAE вычислялся как среднее арифметическое двух направленных значений PAE (от связывателя к мишени и от мишени к связывателю), деленное на 31. Показатель scRMSD определялся как среднеквадратичное отклонение атомов Cα между сгенерированной и предсказанной с помощью AF2 структурами связывателя после выравнивания соответствующих атомов Cα мишени методом Кабша. Программный комплекс Complexa автоматически рассчитывал все три параметра в процессе генерации, в то время как результаты работы программ BindCraft, BoltzGen и редизайна ProteinMPNN требовали проведения отдельной стандартизированной оценки AF2 в соответствии с правилами раздела 4.5. Внутренние оценки генераторов (такие как ipTM для BoltzGen, интерфейсный ipTM, уверенность в структуре и RMSD нативного рефолдинга) и метки (например, метки принятия/отклонения BindCraft) могли использоваться для планирования, но не являлись решающими для квалификации вариантов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стандартизированная оценка AF2 (AlphaFold2) и такие метрики, как pLDDT (уверенность в локальной структуре), iPAE (ошибка предсказания выравнивания интерфейса) и scRMSD (точность пространственного наложения), позволяют строго отбирать стабильные и качественно смоделированные белковые комплексы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для оценки структурной новизны проверялось, вносит ли квалифицированный дизайн новые структурно уникальные единицы (SU), если его цепь попадала в уже существующие кластеры данной кампании. С помощью программы Foldseek проводилась кластеризация квалифицированных цепей связывателей в рамках каждой кампании с порогом TM-スコア 0.6, который ранее применялся для количественной оценки структурного разнообразия генерируемых белковых остовов. Дополнительно в качестве анализа чувствительности оценивались пороги TM 0.5 и TM 0.8 (Таблица S14). Каждый итоговый кластер учитывался как одна структурально уникальная единица (SU), что позволяло оценивать именно структурное сходство, а не биологический фолд или идентичность эпитопов. Подробные сведения о протоколе и кластеризации приведены в Разделах B.1–B.2 и Таблице S4.&lt;/p&gt;\n&lt;p&gt;Измерение пропускной способности кампаний, управляемых адаптивными методами T-REX, PUCT или ε-greedy, производилось на основе окончательных записей кампании, а не последних сводок доказательств, формируемых во время выполнения (подробнее см. в разделе 4.3). Каждая единица SU засчитывалась за задачу генерации или редизайна, которая создала выбранный репрезентативный вариант, но не за задачу оценки; правила выбора одного репрезентативного дизайна из каждого кластера описаны в Разделе B.2. Пропускная способность определялась как NSU/H, где NSU — итоговое количество кластеров, а H = 144 часа работы графических процессоров H100 для каждой комбинации метода и мишени в основном бенчмарке. В адаптивных кампаниях в этот бюджет времени включались генерация, редизайн и стандартизированная оценка AF2, поскольку данные вычисления выполнялись непосредственно в ходе кампании и могли влиять на дальнейшее распределение ресурсов. Для базовых методов, использующих только генератор, в бюджет засчитывались генерация и поиск, тогда как стандартизированная оценка AF2, проводимая после завершения генерации, исключалась, так как она не могла повлиять на выбор уже созданных дизайнов. Для метода T-REX обслуживание языковой модели (LLM) и апостериорный анализ не учитывались в H, поскольку этот параметр призван отражать именно вычислительные затраты рабочих станций в процессе дизайн-кампании. Альтернативные методы учета и статистика на уровне кампаний указаны в Разделах D.1.3 и D.1.1.&lt;/p&gt;\n&lt;h4 id=\"43-arhiv-kampanii-i-postroenie-dokazatelnoj-bazy\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#43-arhiv-kampanii-i-postroenie-dokazatelnoj-bazy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3. Архив кампании и построение доказательной базы&lt;/span&gt;&lt;/a&gt;4.3. Архив кампании и построение доказательной базы&lt;/h4&gt;\n&lt;p&gt;Для обеспечения полной прослеживаемости цикла планирования, выполнения и получения результатов в ходе каждой кампании велся специальный архив. Система фиксировала все новые данные и решения контроллера в виде неизменяемых записей, не перезаписывая предыдущие файлы. Для сохранения ключевой научной информации и планов использовалось три типа записей: ResultRecord, EvidenceSummary и HypothesisCard. Запись ResultRecord отражала успешное выполнение задачи или её сбой, связывая каждый результат с семейством действий, конкретным маршрутом и родительским дизайном. В ней также фиксировались доступные измерения, затраченные вычислительные ресурсы воркеров, статус выполнения, а также ссылки на файлы структуры, оценок и логов. Задача могла порождать сразу несколько ResultRecord, причем некоторые данные сохранялись еще до завершения работы. Даже если задача не выдавала пригодных структур, ResultRecord фиксировал статус ошибки и потраченные ресурсы. Помимо этих трех основных типов записей, в архиве хранились данные о кандидатных задачах, рейтингах Супервизора, пропорциях распределения ресурсов, решениях о допуске в очередь, подтвержденных запусках воркеров, сбоях при запуске и полные аудиты вызовов LLM (Рис. S3).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS3.jpg\" alt=\"Рисунок S3 / Онлайн-подсчеты SU в трех запусках T-REX.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок S3 / Онлайн-подсчеты SU в трех запусках T-REX.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок S3 / Онлайн-подсчеты SU в трех запусках T-REX. Каждая панель показывает три независимо инициализированных кампании для одной мишени при заранее заданном знаменателе в 144 воркер-GPU-ч H100. Сплошные ступени показывают архивные онлайн-подсчеты TM0.6 SU, которые могут уменьшаться при обновлении кластеризации Foldseek; незакрашенные символы показывают окончательные пересчитанные TM0.6 SU. На рисунке 2d и в дополнительной таблице S9 сравниваются соответствующие адаптивные контроллеры.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Построение сводки доказательств EvidenceSummary происходило перед тем, как Планировщик предлагал новые тесты, а система выбирала задачи. Специальный детерминированный код собирал EvidenceSummary на основе архивных результатов, незавершенной работы и доступных ресурсов. Эта сводка служила общим контекстом для Планировщика и Супервизора, причем в их промпты передавалась сокращенная версия документа. Как показано на Рис. 1d, сводка структурировала данные по шести направлениям: (1) качество структуры (оценки квалификации, исходы и запасы); (2) новизна структуры (новые структурные единицы и дупликация); (3) выход по конкретным маршрутам и затраты (исходы на уровне маршрутов, новые SU на GPU-час и расход вычислений); (4) ожидающие оценки (дизайны, ждущие стандартизированной оценки AF2); (5) родительская линия и исходы (исходные дизайны и результаты их потомков); (6) ресурсы GPU и активные задачи (задачи в очереди и работе, доступные мощности). Кроме того, система сохраняла данные о почти успешных попытках (near-miss) и вспомогательные измерения. Почти успешная попытка имела полные квалификационные измерения, но не проходила квалификацию согласно строгим правилам. Вспомогательные измерения включали диагностические оценки вроде ipTM, ipSAE, энергии интерфейса и комплементарности формы, причем пропуски данных не приравнивались к нулям или ошибкам. Полная схема EvidenceSummary, временные окна и расчеты качества описаны в Рис. S4.1–S4.3, а сокращение данных для LLM — в Рис. S5.2.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder-fS5.jpg\" alt=\"Рисунок S5 / Атрибуция семейств действий для окончательных структурно-уникальных единиц T-REX TM0.6 по мишеням.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок S5 / Атрибуция семейств действий для окончательных структурно-уникальных единиц T-REX TM0.6 по мишеням.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок S5 / Атрибуция семейств действий для окончательных структурно-уникальных единиц T-REX TM0.6 по мишеням. Каждый столбец делит окончательные кластеры Foldseek TM0.6 мишени в соответствии с семейством генерации или редизайна, которое напрямую создало выбранного представителя; метки справа указывают общее количество структурно-уникальных единиц (SU). Каждый кластер подсчитывался одинкратно, и стандартизированное задание AF2, оценивавшее результат, не получало прямого зачета. Задание генерации или редизайна могло создавать несколько дизайнов и, следовательно, вносить более одной SU. График описывает атрибуцию результатов, а не причинный вклад или эффективность на один запуск.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Детерминированный код — это алгоритм с фиксированными правилами, который всегда выдает одинаковый результат при одних и тех же входных данных, в отличие от вероятностных моделей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Присвоение статуса кампании помогало направлять рассуждения LLM и детерминированные правила распределения без жесткой привязки к конкретной задаче (Рис. 1d). Специальный детерминированный классификатор присваивал один из семи статусов: низкий объем доказательств, коллапс структурных дупликатов, продуктивный режим, продуктивный с дупликацией, изобилие near-miss, застои или глубокий застой. Классификатор анализировал продуктивность, дупликацию, близкие промахи и затраты GPU без получения новых SU. Если подходили условия нескольких статусов, срабатывала заранее заданная иерархия приоритетов, а статус «низкий объем доказательств» использовался по умолчанию. Присвоенная метка включалась в состав EvidenceSummary. Точные определения статусов и пороги приведены в Рис. S4.5.&lt;/p&gt;\n&lt;h4 id=\"44-upravlyaemoe-dokazatelstvami-planirovanie-i-obratnaya-svyaz-po-gipotezam\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#44-upravlyaemoe-dokazatelstvami-planirovanie-i-obratnaya-svyaz-po-gipotezam\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.4. Управляемое доказательствами планирование и обратная связь по гипотезам&lt;/span&gt;&lt;/a&gt;4.4. Управляемое доказательствами планирование и обратная связь по гипотезам&lt;/h4&gt;\n&lt;p&gt;Роли агентов на основе LLM. Система T-REX задействовала две роли контроллеров на базе LLM — Планировщика и Супервизора (Рис. 1д). Обе роли были реализованы на основе одной и той же локально развернутой модели Qwen3.6-27B-FP8 с использованием vLLM, но применяли раздельные промпты и схемы структурированного вывода (Team, 2026; Kwon et al., 2023). Авторы выбрали эту модель с открытыми весами для обеспечения локального развертывания с фиксированным, версионированным снимком модели и заранее заданной конфигурацией обслуживания. Модель обслуживалась на одном графическом процессоре H100. В ходе семи основных кампаний лишь 7 из 3125 вызовов LLM (0,22%) выдали ответы, не прошедшие проверку структурированного вывода; эти ответы отклонялись до одобрения запуска и активировали детерминированные резервные пути (Таблица S15). Функционально Планировщик предлагал, что и почему тестировать дальше, тогда как Супервизор расставлял приоритеты в отношении того, какие валидированные кандидаты должны получить будущие запуски воркеров. Ни одна LLM не запускала задачи напрямую; создание кандидатов, валидация, допуск, диспетчеризация и выполнение управлялись детерминированной логикой контроллера (Раздел 4.5; Раздел C.8.2).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Структурированный вывод (structured-output) — это технический механизм, который заставляет языковую модель отвечать строго по заданному шаблону (например, в формате JSON), исключая «свободный полёт» мысли и сбои в коде.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Руководство для принятия решений LLM. Оба промпта содержали указания относительно того, должна ли последующая работа расширять продуктивное направление, устранять выявленную слабость или тестировать альтернативный маршрут либо конфигурацию. Продуктивность маршрута измерялась как недавнее количество новых единиц структурной полезности TM0.6 (SU) в расчете на один GPU-час, затраченный на данный маршрут, включая необходимые задачи оценки и задачи-предшественники. Чтобы определить приоритетность маршрутов для дальнейших вычислений, промпты предписывали обеим ролям LLM использовать недавнюю продуктивность маршрута в качестве основного количественного критерия. Два маршрута считались сопоставимыми по продуктивности, если показатель менее продуктивного маршрута составлял не менее 85% от показателя более продуктивного, хотя оба промпта советовали соблюдать осторожность, если сравнение опиралось на малый объем наблюдений или вычислений. Для таких маршрутов LLM должны были отдавать предпочтение маршруту с более высоким 25-м процентилем оценок качества квалифицированных проектов, используя медиану в качестве следующего критерия (Разделы C.5.3, C.7 и C.4.3).&lt;/p&gt;\n&lt;p&gt;Планирование. Планировщик получал сводку доказательств (EvidenceSummary) и контекст состояния кампании, а также до восьми активных или недавних карточек гипотез (HypothesisCards), доступные семейств действий и их роли, разрешенные настройки и лимиты рабочей нагрузки на одну задачу. Промпт запрашивал от одной до четырех новых карточек гипотез, каждая из которых описывала гипотезу, связанную с доказательствами, и предлагаемый последующий вычислительный тест. Каждая новая карточка ссылалась на поддерживающие доказательства, предлагала семейства действий и настройки, а также указывала релевантность теста для задач Rescue (спасение), Explore (исследование) и eXploit (эксплуатация). Она также прогнозировала изменение выбранных параметров квалификации и, где применимо, определяла другие измерения, которые не должны ухудшаться за пределы заданного лимита. Настройки обслуживания, детали промптов и условия вызовов указаны в Разделах C.5 и C.5.4.&lt;/p&gt;\n&lt;p&gt;Проверка + Сборка и валидация кандидатов. Предложения Планировщика не подлежали непосредственному исполнению. Фиксированная логика Check + Build преобразовывала новые или сохраненные карточки гипотез в конкретные кандидаты действий (ActionCandidates) и проверяла запрошенную операцию, зарегистрированное семейство действий, разрешенные границы параметров и рабочей нагрузки, необходимые входные файлы и, применимо, правомочность родительских объектов. Применялись разрешенные детерминированные исправления, в противном случае недействительные кандидаты отклонялись. Эта валидация обеспечивала соблюдение фиксированного пространства действий, не позволяя LLM внедрять незарегистрированные семейств действий, превышать заданные параметры или изменять фиксированные определения кампании, такие как цель, критерии квалификации, правило структурной новизны или бюджет воркеров. Только кандидаты, прошедшие проверку сборки, допускались к приоритезации Супервизором и последующему допуску. Успешное прохождение Check + Build подтверждало валидность на этапе создания, но не гарантировало выполнения; кандидаты по-прежнему подчинялись финальным правилам допуска и проверкам в момент диспетчерского запуска, описанным в Разделе 4.5.&lt;/p&gt;\n&lt;p&gt;Приоритезация и распределение Супервизором. Супервизор получал сводку доказательств и контекст состояния кампании, а также гипотезы от Планировщика и пригодные задачи-кандидаты. Он рекомендовал задачи-кандидаты к выполнению, распределяя каждую рекомендованную задачу по категориям Rescue, Explore или eXploit и ранжируя их по всем трем приоритетам. Он также возвращал нормализованную смесь R/E/X, задающую желательные пропорции задач для выполнения в рамках каждого приоритета. Подробные спецификации ввода и вывода, руководство по ранжированию и правила распределения приведены в Разделах C.5.2 и C.7.&lt;/p&gt;\n&lt;p&gt;Обратная связь по гипотезам. После выбора задач-кандидатов контроллер использовал заранее заданные правила для оценки результатов последующих тестов, предложенных ранее Планировщиком. Результаты, связанные с каждой карточкой гипотезы, сравнивались с ранее наблюдаемым эталонным результатом и классифицировались как подтверждающие, противоречащие или нейтральные. Накопленные результаты определяли, считается ли карточка поддержанной, опровергнутой или неактивной по истечении назначенного ей срока службы. Эти статусы влияли на последующие решения Планировщика и Супервизора, но не влияли на квалификацию проекта, начисление SU или валидацию предложенного причинно-следственного объяснения. Подробные правила оценки и обновления статусов приведены в Разделе C.9, а практический пример — в Разделе D.2.2.&lt;/p&gt;\n&lt;h4 id=\"45-asinhronnoe-raspredelenie-i-vypolnenie-zadach\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#45-asinhronnoe-raspredelenie-i-vypolnenie-zadach\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.5. Асинхронное распределение и выполнение задач&lt;/span&gt;&lt;/a&gt;4.5. Асинхронное распределение и выполнение задач&lt;/h4&gt;\n&lt;p&gt;Выбор кандидатных задач базировался на проверенных сборкой задачах, описанных в разделе 4.4. Супервайзер назначал каждую рекомендованную задачу в одну из категорий — Rescue, Explore или eXploit (R/E/X) — и ранжировал их по трем приоритетам. Контроллер учитывал эти задачи в порядке ранжирования и использовал смесь R/E/X для распределения последующих запусков генерации и редизайна с учетом предварительно заданных ограничений по осуществимости и ресурсам. Если в общую очередь воркеров можно было принять дополнительные задачи, контроллер отбирал их из оставшихся подходящих кандидатов по детерминированным правилам, основываясь на недавних запусках по семействам действий, производительности маршрутов и оценке стоимости задач. Отобранные задачи попадали в общую очередь воркеров, но в реальное распределение R/E/X вносили вклад только подтвержденные запуски генерации и редизайна. Подробные правила упорядочивания кандидатов, распределения, резервных вариантов и диспетчеризации приведены в Дополнительном разделе C.7 и в Таблице S8.&lt;/p&gt;\n&lt;p&gt;Планирование работы воркеров и асинхронное выполнение осуществлялись следующим образом: система T-REX задействовала три воркера на базе GPU H100 и отдельный GPU H100 для обслуживания LLM; системы PUCT и ε-greedy использовали по четыре воркера. Бюджет отчетности T-REX составлял 144 воркер-GPU-часа, что соответствует трем слотам воркеров за 48 часов (3 × 48 = 144). Когда воркер освобождался, контроллер повторно проверял входные данные следующей задачи, доступность родительских элементов и ресурсов перед ее запуском или отсрочкой. Завершенные результаты интегрировались в данные кампании сразу по мере их поступления, что позволяло использовать их в последующем планировании и выборе задач, пока остальные задачи еще выполнялись. Подробные правила приема в очередь, запусков воркеров, ограничений параллелизма и обработки сбоев описаны в Дополнительном разделе C.8, а рабочий процесс контроллера суммирован в Алгоритме S1.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Асинхронное выполнение и динамическое распределение ресурсов позволяют системе непрерывно обрабатывать результаты и планировать следующие шаги без простоя вычислительных мощностей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Допуск к оценке AF2 для стандартизированной оценки использовал те же три GPU воркеров, что и генерация с редизайном, но подчинялся отдельной детерминированной политике приема. Дизайны с пригодными структурами допускались к этой оценке, если одно или несколько из трех обязательных квалификационных измерений не были вычислены на этапе генерации (Рис. 1e). Заранее заданные детерминированные правила контроллера определяли, какие подходящие дизайны подлежат оценке и в каком порядке. Для каждого маршрута, требующего оценки AF2, изначально могло оцениваться до четырех дизайнов. После получения результатов всех оценок в рамках текущего лимита совокупный лимит мог последовательно увеличиваться до 8, 16, 32 и 64 оценок, а затем продолжать удваиваться, но только при условии, что маршрут демонстрировал улучшение относительно предыдущей границы лимита. Улучшение определялось как рост числа новых SU (structural units), приходящихся на маршрут, количества близких попаданий (near-miss), числа квалифицированных структурных кластеров, 25-го перцентиля или медианы показателей качества квалифицированных дизайнов, либо специфического для источника вспомогательного диагностического балла. Показатели качества квалифицированных дизайнов рассчитывались по трем нормализованным маржам прохождения с сохранением только дизайна с наивысшим баллом в рамках структурного кластера. Точные определения баллов, правила сравнения, ограничения емкости и исключение для свободной емкости указаны в Дополнительных разделах C.4.3 и C.8.1.&lt;/p&gt;\n&lt;p&gt;Завершение кампании и окончательная реконструкция конечных точек выполнялись следующим образом: цикл «данные — планирование — выполнение» работал до достижения заранее установленного лимита времени кампании в 48 часов; кампании не завершались на основе состояния кампании, нехватки новых SU или количества уже полученных SU. Контроллер проверял лимит времени перед каждым проходом через цикл; уже выполнявшемуся проходу разрешалось завершиться. При завершении работы каждому выполняющемуся заданию выделялось до 600 с на завершение. Результаты завершенных задач парсились. После остановки выполнения критерии квалификации повторно применялись к финальным записям ResultRecord в архиве для выходов с пригодной структурой и всеми тремя обязательными квалификационными измерениями, включая любые такие выходы, восстановленные во время остановки. Кластеризация Foldseek TM0.6 пересчитывалась для дизайнов, прошедших квалификацию. Подробные правила завершения работы, включения в конечные точки и кластеризации приведены в Дополнительных разделах C.8.3, B.3 и B.2.&lt;/p&gt;\n&lt;h4 id=\"46-postroenie-svodki-dokazatelstv-i-proizvodnye-metriki-c4evidencesummary-construction-and-derived-measures\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#46-postroenie-svodki-dokazatelstv-i-proizvodnye-metriki-c4evidencesummary-construction-and-derived-measures\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.6. Построение сводки доказательств и производные метрики (C.4.EvidenceSummary construction and derived measures)&lt;/span&gt;&lt;/a&gt;4.6. Построение сводки доказательств и производные метрики (C.4.EvidenceSummary construction and derived measures)&lt;/h4&gt;\n&lt;p&gt;При каждом обновлении планирования контроллер объединяет архивные результаты с поставленными в очередь и выполняющимися задачами, дизайнами, ожидающими оценки AF2, и доступной емкостью воркеров для формирования документа EvidenceSummary. В нем отслеживаются кумулятивная квалификация, онлайн-счетчики SU, недавние результаты, а также исходы и затраты по маршрутам (Рис. S1b). В Разделе C.5.2 описаны уменьшенные входные данные, подаваемые в LLM; в Разделе D.2.1 приведен пример в формате JSON.&lt;/p&gt;\n&lt;h4 id=\"c41-soderzhimoe-dokazatelnoj-bazy-i-vremennye-okna-zapisej\"&gt;&lt;a href=\"2026-09-25/agentic-campaign-control-for-high-throughput-de-novo-binder.html#c41-soderzhimoe-dokazatelnoj-bazy-i-vremennye-okna-zapisej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C.4.1. Содержимое доказательной базы и временны́е окна записей&lt;/span&gt;&lt;/a&gt;C.4.1. Содержимое доказательной базы и временны́е окна записей&lt;/h4&gt;\n&lt;p&gt;Для оценки измерений используются медианные значения и расстояния до порогов квалификации, а также подсчет успешных, близких к успеху (near-pass) и неуспешных результатов. Строгая квалификация обозначается как strict. Назначения в онлайн-режиме Foldseek TM0.6 и показатели дублирования включают статус кластеризации и покрытие. Метрики доступности (&lt;span class=\"yfm-latex\" data-content=\"%5Ctext%7Bmetric%5C_availability%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;) фиксируют наличие данных, при этом пропущенные значения не заполняются и не считаются сбоями. Накопительные сводки используют все доступные результаты, тогда как последние сводки квалификации и комбинации критериев анализируют последние 60 записей результатов (ResultRecords). Общие вспомогательные сводки объединяют последние 40 записей по семействам и последние 60 записей в целом, требуя не менее трех конечных наблюдений на одно измерение.&
