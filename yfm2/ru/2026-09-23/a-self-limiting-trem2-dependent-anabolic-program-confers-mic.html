            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"223\" cy=\"80\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"517\" cy=\"253\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Иммунные клетки мозга при&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;болезни Альцгеймера выгорают&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;изнутри&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-f1.jpg\" alt=\"Рисунок 1: Микроглия демонстрирует протеомную анаболическую адаптацию к Aβ-патологии. (A) Схема эксперимента. Первичная \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Микроглия демонстрирует протеомную анаболическую адаптацию к Aβ-патологии. (A) Схема эксперимента. Первичная микроглия была выделена из 3- и 9-месячных мышей AppNL-G-F и AppNL-G-F;Trem2KO для комплексного протеомного и транскриптомного профилирования. (B) Анализ канонических путей Ingenuity (IPA) для дифференциально представленных белков (DAP) у 9-месячных мышей AppNL-G-F по сравнению с 3-месячными мышами AppNL-G-F, подчеркивающий обогащение путей синтеза белка (красные стрелки). (C–D) Точечные графики анализа обогащения наборами генов (GSEA) для терминов клеточного компонента (C) и биологического процесса (D). Красные стрелки указывают на одновременное обогащение сигнатурой «Рибосома» (анаболическая), а оранжевые стрелки указывают на сигнатуры «Лизосомальная мембрана» (катаболическая), обогащенные у 9-месячных по сравнению с 3-месячными мышами AppNL-G-F. (E) IPA и (F) GSEA дифференциально экспрессируемых генов (DEG) у 9-месячных мышей AppNL-G-F, подчеркивающие гены, вовлеченные в трансляцию белка (красные стрелки) и катаболические процессы (оранжевые стрелки).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Главные уборщики мозга, микроглия, пытаются очистить нервную ткань от токсичных белков при болезни Альцгеймера. Для этого им необходима колоссальная энергия и синтез новых белков. Однако по мере накопления бляшек этот спасительный механизм угасает, оставляя клетки беззащитными.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Микроглия запускает зависимый от TREM2 анаболический ответ.&lt;/li&gt;\n&lt;li&gt;Защитная способность клеток падает по мере роста бляшек.&lt;/li&gt;\n&lt;li&gt;У людей этот спад подтвержден на выборке из 523 доноров.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;При болезни Альцгеймера микроглия окружает амилоидные бляшки, пытаясь их поглотить. Ученые выяснили, что этот процесс запускает мощную анаболическую программу, которая зависит от рецептора TREM2 и объединяет синтез белков с ростом митохондрий. Клетки буквально наращивают мощности, чтобы справиться с постоянной нагрузкой.&lt;/p&gt;\n&lt;p&gt;Однако анализ тканей мышей и данных 523 людей показал парадоксальный факт. По мере роста амилоидной нагрузки этот ресурс истощается. На поздних стадиях болезни способность клеток к биосинтезу падает, хотя внешние маркеры активации продолжают расти. Это грозит исчерпанием резервов при попытках лечения антителами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа основана на моделях грызунов и ретроспективном анализе тканей человека, поэтому требует осторожности при экстраполяции на живых пациентов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Микроглия играет ключевую роль в развитии болезни Альцгеймера (БА), а рецептор TREM2, выступающий одним из мощнейших генетических факторов риска, обеспечивает формирование популяции микроглии, ассоциированной с заболеванием (DAM), что необходимо для взаимодействия с амилоидными бляшками. До сих пор оставалось неясным, каким именно образом TREM2 поддерживает эту защитную функцию и почему она ослабевает по мере прогрессирования патологии. Применяя методы протеомики, транскриптомики единичных клеток и метаболического мечения in vivo, исследователи продемонстрировали, что микроглия вблизи бляшек запускает анаболическую программу, зависящую от TREM2 и связывающую синтез новых белков с биогенезом митохондрий.&lt;/p&gt;\n&lt;p&gt;Именно эта метаболическая программа, а не сам по себе классический фенотип DAM, характеризует фагоцитарно компетентные клетки микроглии, тогда как её угасание сопряжено с нарушением протеостаза и дисфункцией митохондрий. Неожиданно выяснилось, что данная анаболическая программа носит самоограничивающийся характер: пик её активности наблюдается при низкой амилоидной нагрузке, после чего она снижается по мере роста числа бляшек.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анаболическая способность митохондрий и синтеза белка определяет устойчивость микроглии при болезни Альцгеймера, однако этот ресурс истощается по мере прогрессирования патологии.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Данная тенденция к снижению анаболического потенциала сохраняется и у людей: анализ когорты из 523 доноров показал, что этот показатель коррелирует с уровнями TREM2, но падает на поздних стадиях Браака, несмотря на продолжающийся рост выраженности DAM-сигнатуры.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стадии Браака — это гистологическая классификация степени распространения нейрофибриллярных клубочков и патологических изменений при болезни Альцгеймера, отражающая тяжесть нейродегенеративного процесса.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Таким образом, именно анаболическая емкость, а не просто активированное состояние микроглии, служит маркером клеточной устойчивости при БА. Из этого следует, что непрерывная стимуляция фагоцитоза с помощью антиамилоидных антител может нести риск биосинтетического истощения клеток и самоограничения терапевтической эффективности.&lt;/p&gt;\n&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"rol-mikroglii-i-metabolicheskie-vyzovy-pri-bolezni-alcgejmera\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#rol-mikroglii-i-metabolicheskie-vyzovy-pri-bolezni-alcgejmera\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Роль микроглии и метаболические вызовы при болезни Альцгеймера&lt;/span&gt;&lt;/a&gt;Роль микроглии и метаболические вызовы при болезни Альцгеймера&lt;/h4&gt;\n&lt;p&gt;При болезни Альцгеймера (БА) микроглия выступает в качестве ключевой линии защиты, отвечая за изоляцию и клиренс нейротоксичных агрегатов амилоида-бета (Aβ). Генетические исследования ставят функцию микроглии в центр факторов риска БА, предполагая, что мощный врожденный иммунный ответ помогает отсрочить развитие патологии. Однако эта защитная способность не является постоянной. По мере прогрессирования патологии микроглия претерпевает глубокие фенотипические изменения: сначала она формирует защитный ответ, но затем часто переходит в дисрегулированное, стареющее или истощенное состояние, при котором она уже не способна сдерживать нейродегенерацию. Понимание механизмов, позволяющих микроглии сохранять функциональную устойчивость в условиях хронического протеотоксического стресса, является первоочередной задачей для разработки терапевтических вмешательств.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Микроглия защищает мозг от агрегатов Aβ, но при прогрессировании БА истощается, поэтому поиск механизмов ее клеточной устойчивости критически важен для терапии.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Недавние успехи в секвенировании РНК единичных клеток позволили описать траекторию этого ответа, выделив консервативную сигнатуру «связанной с заболеванием микроглии» (DAM) или «микроглиального нейродегенеративного фенотипа» (MGnD). Эта программа, запускаемая во многом рецептором TREM2 (triggering receptor expressed on myeloid cells 2), включает в себя снижение экспрессии гомеостатических маркеров (например, P2ry12, Cx3cr1) и активацию путей распознавания липидов и фагоцитоза (например, Apoe, Lpl, Clec7a). Утрачивающие функцию варианты (например, R47H) подчеркивают важность TREM2, поскольку они заметно увеличивают риск развития БА и ассоциируются с нарушением кластеризации микроглии вокруг бляшек, а также с диффузной нейротоксичной амилоидной патологией.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DAM/MGnD — это специфические профили активности генов микроглии вблизи бляшек, где рецептор TREM2 играет главную дирижерскую роль в переключении клеток на фагоцитоз.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Хотя концепция DAM/MGnD оказалась чрезвычайно влиятельной, исследования на людях описывают более широкий спектр состояний микроглии, указывая на то, что один лишь транскрипционный профиль не всегда полностью отражает функциональные возможности клеток. Приобретение транскрипционной сигнатуры — это лишь проект; выполнение функций ассоциированной с бляшками микроглии (пролиферация, миграция и непрерывный фагоцитоз) предъявляет колоссальные биосинтетические и биоэнергетические требования. Это сопряжено с постоянным синтезом новых мембран, гидролитических ферментов и органелл взамен тех, что расходуются при деградации Aβ. То, как именно микроглия получает метаболические ресурсы для поддержания такого состояния в мозге при БА, остается изученным плохо. В то время как иммунный метаболизм периферических макрофагов охарактеризован подробно — где активация сопряжена с четкими метаболичесскими переключениями (например, гликолиз против окислительного фосфорилирования), метаболические потребности микроглии, ассоциированной с бляшками, исследованы гораздо слабее. Несмотря на то, что TREM2 связывают с метаболической приспособленностью микроглии, до сих пор оставалось неизвестным, поддерживает ли он пространственно организованную анаболическую программу &lt;em&gt;in vivo&lt;/em&gt; и отделима ли такая программа от транскрипционного состояния DAM.&lt;/p&gt;\n&lt;h4 id=\"integrirovannyj-podhod-k-izucheniyu-metabolicheskoj-rezistentnosti-mikroglii\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#integrirovannyj-podhod-k-izucheniyu-metabolicheskoj-rezistentnosti-mikroglii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интегрированный подход к изучению метаболической резистентности микроглии&lt;/span&gt;&lt;/a&gt;Интегрированный подход к изучению метаболической резистентности микроглии&lt;/h4&gt;\n&lt;p&gt;В настоящей работе мы объединяем интегрированную протеомику, транскриптомику, секвенирование РНК единичных клеток и метаболическое мечение &lt;em&gt;in vivo&lt;/em&gt; для характеристики биосинтетических и биоэнергетических особенностей устойчивости микроглии к Aβ-патологии. Мы обнаруживаем, что Aβ-патология сопровождается анаболической программой, зависимой от TREM2, которая представляет собой координированное усиление синтеза белка и биогенеза митохондрий. Нам удалось зафиксировать это в ткани (&lt;em&gt;in situ&lt;/em&gt;) на границе фагоцитоза, причем именно данная программа, а не транскрипционная сигнатура DAM, отличает фагоцитарно компетентную микроглию.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдаемые эффекты проверяются на моделях мышей и тканях человека, однако любая трансляция лабораторных выводов в клинику требует осторожности из-за различий иммунной системы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Неожиданно оказалось, что эта программа является самоограничивающейся: она достигает пика в микроглии с низкой амилоидной нагрузкой и постепенно подавляется по мере роста нагрузки как в мышиных, так и в человеческих тканях. В отсутствие TREM2 микроглия не способна поддерживать этот ответ и вместо этого демонстрирует протеостатическую перегрузку и митохондриальную дисфункцию. Мы интегрируем эти наблюдения в модель спроса и предложения для клиренса, осуществляемого микроглией, и рассматриваем последствия для антиамилоидной иммунотерапии, эффективность которой напрямую зависит от тех же фагоцитарных возможностей.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"mikrogliya-zapuskaet-anabolicheskuyu-programmu,-zavisyashuyu-ot-trem2,-v-otvet-na-amiloidnuyu-patologiyu\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#mikrogliya-zapuskaet-anabolicheskuyu-programmu,-zavisyashuyu-ot-trem2,-v-otvet-na-amiloidnuyu-patologiyu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Микроглия запускает анаболическую программу, зависящую от TREM2, в ответ на амилоидную патологию&lt;/span&gt;&lt;/a&gt;Микроглия запускает анаболическую программу, зависящую от TREM2, в ответ на амилоидную патологию&lt;/h4&gt;\n&lt;p&gt;Для понимания механизмов адаптации микроглии к амилоидной патологии ученые провели комплексный протеомный и транскриптомный анализ первичных клеток микроглии, выделенных из мышей линий App^NL-G-F и App&lt;sup&gt;NL-G-F;Trem2&lt;/sup&gt;KO в возрасте 3 и 9 месяцев, что соответствует ранней и промежуточной стадиям отложения амилоида (Рис. 1A).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-f1.jpg\" alt=\"Рисунок 1: Микроглия демонстрирует протеомную анаболическую адаптацию к Aβ-патологии. (A) Схема эксперимента. Первичная \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Микроглия демонстрирует протеомную анаболическую адаптацию к Aβ-патологии. (A) Схема эксперимента. Первичная микроглия была выделена из 3- и 9-месячных мышей AppNL-G-F и AppNL-G-F;Trem2KO для комплексного протеомного и транскриптомного профилирования. (B) Анализ канонических путей Ingenuity (IPA) для дифференциально представленных белков (DAP) у 9-месячных мышей AppNL-G-F по сравнению с 3-месячными мышами AppNL-G-F, подчеркивающий обогащение путей синтеза белка (красные стрелки). (C–D) Точечные графики анализа обогащения наборами генов (GSEA) для терминов клеточного компонента (C) и биологического процесса (D). Красные стрелки указывают на одновременное обогащение сигнатурой «Рибосома» (анаболическая), а оранжевые стрелки указывают на сигнатуры «Лизосомальная мембрана» (катаболическая), обогащенные у 9-месячных по сравнению с 3-месячными мышами AppNL-G-F. (E) IPA и (F) GSEA дифференциально экспрессируемых генов (DEG) у 9-месячных мышей AppNL-G-F, подчеркивающие гены, вовлеченные в трансляцию белка (красные стрелки) и катаболические процессы (оранжевые стрелки).&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Протеомный и транскриптомный анализ позволяют одновременно оценить все белки и активные гены в клетке, а линии мышей с нокаутом гена Trem2 помогают понять роль этого рецептора в ответе на болезнь.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В микроглии App^NL-G-F протеомный анализ выявил более 7000 белков, из которых 2621 белок существенно изменил свое количество в период с 3 до 9 месяцев, что говорит о масштабной перестройке протеома по мере развития патологии. Анализ путей Ingenuity (IPA) показал мощную активацию путей синтеза белка, включая инициацию, элонгацию и терминацию трансляции, а также сигнальный путь EIF2 (Рис. 1B). Анализ обогащения наборов генов (GSEA) для клеточных компонентов и биологических процессов подтвердил рост компонентов аппарата трансляции, включая цитозольные и митохондриальные рибосомные субъединицы (Рис. 1C–D; Рис. S1A). Одновременно с этим обогащались белки, связанные с процессами деградации, такие как мембраны аутофагосом и лизосом, а также фагоцитарные везикулы (Рис. 1C–D). Транскриптомный профиль также подтвердил этот адаптивный ответ, хотя и менее выраженно, показав рост экспрессии генов трансляции (Рис. 1E), биогенеза рибосом и комплексов дыхательной цепи митохондрий (Рис. 1F; Рис. S1B), а также лизосомальных путей (Рис. 1E–F). Таким образом, микроглия претерпевает координированную метаболическую перестройку при амилоидной патологии, объединяя усиленный синтез белков с повышенной способностью к их деградации для поддержания обновления протеома.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS1.jpg\" alt=\"Расширенный рисунок 1. (A) Графики генно-концептуальных сетей отображают топ-10 белков с дифференциальной экспрессией, с\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Расширенный рисунок 1. (A) Графики генно-концептуальных сетей отображают топ-10 белков с дифференциальной экспрессией, связанных с терминами генной онтологии (GO) «малая рибосомальная субъединица», «большая рибосомальная субъединица» и «митохондриальная рибосома». Эти белки значительно обогащены у микроглии AppNL-G-F в возрасте 9 месяцев по сравнению с 3-месячными контрольными мышами. Визуализация была создана с использованием алгоритма компоновки Камады — Каваи. (B) Точечные графики анализа обогащения наборами генов (GSEA) терминов биологических процессов (BP), представляющих транскриптом микроглии AppNL-G-F. Красные стрелки указывают на обогащение анаболических сигнатур, а оранжевые стрелки — на катаболические сигнатуры, обогащенные у 9-месячной микроглии AppNL-G-F по сравнению с 3-месячными аналогами.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;На фоне развития амилоидной патологии микроглия усиливает синтез белков и их расщепление, однако дефицит TREM2 полностью разрушает эту анаболическую программу к 9 месяцам.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтобы выяснить, зависит ли эта метаболическая перестройка от TREM2, авторы сравнили профили мышей App^NL-G-F и App&lt;sup&gt;NL-G-F;Trem2&lt;/sup&gt;KO. Эффект отсутствия TREM2 напрямую зависел от стадий заболевания. В возрасте 3 месяцев, когда амилоидная нагрузка минимальна, дефицит TREM2 не приводил к значимым изменениям в протеоме микроглии (Рис. S2A). Однако к 9 месяцам потеря TREM2 кардинально нарушала протеом, приводя к изменениям 1480 белков (Рис. 2A). Как на уровне протеома, так и транскриптома, отсутствие TREM2 резко снижало сигнатуру микроглии, ассоциированной с заболеванием (DAM), включая такие маркеры, как Gpnmb, Cst7 и Lpl (Рис. 2A–B), что подтверждает ключевую роль TREM2 в переходе гомеостатической микроглии в состояние DAM при стрессе от Aβ. Помимо подавления DAM-сигнатиры, главным следствием дефицита TREM2 стал коллапс анаболического ответа. Протеомный анализ IPA выявил выраженное снижение путей трансляции, включая нацеливание белков, зависимое от SRP, элонгацию и терминацию (Рис. 2C). GSEA подтвердил сокращение рибосомных компонентов и биогенеза рибосом (Рис. 2D; Рис. S2B), доказывая, что TREM2 необходим для запуска анаболических путей при патологии Aβ. Транскриптомный анализ подкрепил эти данные, показав падение экспрессии генов трансляции, сборки рибосом и митохондриальных комплексов (Рис. 2E–F; Рис. S2C). Интеграция данных показала, что если микроглия App^NL-G-F координирует трансляцию, транспорт и деградацию белка, то клетки с дефицитом Trem2 не способны осуществить такую перестройку (Рис. S2D–E).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS2.jpg\" alt=\"Расширенный рисунок 2. (A) Вулкан-график, показывающий отсутствие белков с дифференциальным содержанием между микроглией\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Расширенный рисунок 2. (A) Вулкан-график, показывающий отсутствие белков с дифференциальным содержанием между микроглией AppNL-G-F;Trem2KO и AppNL-G-F в возрасте 3 месяцев (скорректированный P &amp;lt; 0,05). (B, C) GSEA терминов BP, представляющих протеом и транскриптом микроглии AppNL-G-F;Trem2KO. Точечные графики иллюстрируют обогащенные пути в протеоме (B) и транскрипте (C) микроглии AppNL-G-F;Trem2KO по сравнению с аналогами AppNL-G-F в возрасте 9 месяцев. Синие стрелки указывают на подавленные «рибосомальные» сигнатуры. (D) Корреляционный анализ направленной интеграции транскриптома и протеома с использованием ActivePathways. Диаграмма рассеяния, иллюстрирующая объединенные значения P, рассчитанные с помощью направленного анализа (DPM, ось y) и ненаправленного анализа (метод Брауна, ось x) в микроглии AppNL-G-F (9 месяцев против 3 месяцев). Приоритетные гены с направленно согласованными изменениями в наборах данных располагаются на диагонали или вблизи нее (синий цвет), тогда как гены с противоречивыми направленными изменениями наказываются и располагаются ниже диагонали (коричневый цвет). (E) Многоомиксное обогащение путей микроглии AppNL-G-F. Столбчатая диаграмма, иллюстрирующая уникальные термины GO, обнаруженные в микроглии AppNL-G-F, но отсутствующие в наборах данных микроглии AppNL-G-F;Trem2KO. Слияние мультиомиксных данных выполнялось с использованием ActivePathways со слитными оценками значимости, полученными с помощью метода объединения направленных значений p (DPM). Эти приоритетные термины связаны с протеостазом и сгруппированы в шесть функциональных категорий (указаны цветом). Значимость определялась с использованием объединенных значений P в качестве входных данных для анализа обогащения.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-f2.jpg\" alt=\"Рисунок 2: Дефицит TREM2 вызывает крах анаболического ответа. (A) Вулканический график, сравнивающий протеом микроглии 9\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: Дефицит TREM2 вызывает крах анаболического ответа. (A) Вулканический график, сравнивающий протеом микроглии 9-месячных мышей AppNL-G-F и AppNL-G-F;Trem2KO. Треугольные точки указывают на уникально измененные белки в микроглии AppNL-G-F;Trem2KO. Диаграмма Венна показывает уникальные и общие гены и белки между транскриптомом и протеомом. (B) Вулканический график, сравнивающий транскриптом микроглии 9-месячных мышей AppNL-G-F и AppNL-G-F;Trem2KO. (C) IPA путей с наивысшим рангом в микроглии AppNL-G-F;Trem2KO, показывающий специфическое подавление путей трансляции белка (синие стрелки) и повышенные уровни синаптических белков (красные стрелки). (D) Точечные графики GSEA, подтверждающие широкое сокращение цитозольных и митохондриальных рибосомных компонентов в микроглии Trem2KO (синие стрелки); красные стрелки указывают на одновременное накопление синаптических и миелиновых сигнатур. (E) IPA и (F) GSEA дифференциально экспрессируемых генов (DEG) у 9-месячных мышей AppNL-G-F и AppNL-G-F;Trem2KO, подчеркивающие подавленные гены, вовлеченные в трансляцию белка и рибосому (синие стрелки).&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Выводы исследования получены на генетических моделях мышей с искусственными мутациями, что требует осторожности при прямом переносе результатов на спорадическую болезнь Альцгеймера у людей.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Вследствие дефектов обновления протеома в клетках Trem2^KO происходило накопление синаптических и миелиновых белков — материалов, которые в норме должны удаляться после фагоцитоза (Рис. 2C–D). Этот протеостатический сбой проявился в том, что многие уникально upregulated белки оказались синаптическими компонентами (Рис. 2A). Все эти данные показывают, что микроглия адаптируется к патологии Aβ посредством зависимой от TREM2 анаболической программы, обеспечивающей перестройку протеома и поддержание протеостаза.&lt;/p&gt;\n&lt;h4 id=\"trem2-stimuliruet-sintez-novyh-belkov-v-mikroglii,-associirovannoj-s-blyashkami\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#trem2-stimuliruet-sintez-novyh-belkov-v-mikroglii,-associirovannoj-s-blyashkami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TREM2 стимулирует синтез новых белков в микроглии, ассоциированной с бляшками&lt;/span&gt;&lt;/a&gt;TREM2 стимулирует синтез новых белков в микроглии, ассоциированной с бляшками&lt;/h4&gt;\n&lt;p&gt;Чтобы подтвердить анаболическую программу, обнаруженную с помощью омиксных методов in vivo, исследователи использовали метод Fluorescent Non-Canonical Amino Acid Tagging (FUNCAT) для маркировки вновь синтезированных белков (Рис. 3A). Спустя 16 часов после внутрибрюшинного введения азидогомоаланина (AHA), аналога метионина, который встраивается в созревающие белки, методом проточной цитометрии анализировали популяцию микроглии CX3CR1+ CD45+ (Рис. SN). В возрасте 3 месяцев интенсивность FUNCAT была схожей у мышей линий AppNL-G-F и AppNL-G-F;Trem2KO. Однако к 9 месяцам микроглия мышей AppNL-G-F демонстрировала примерно двукратное увеличение скорости синтеза белков, в то время как дефицит белка TREM2 полностью блокировал эту активацию (Рис. 3B-C). На гистограммах у клеток из AppNL-G-F четко выделялось плечо с высоким уровнем FUNCAT (Рис. 3B, красная стрелка), что указывает на появление метаболически активной субпопуляции. Поскольку известно, что CD45high микроглия накапливается вокруг амилоидных бляшек, авторы соотнесли это с уровнем синтеза белка. Субпопуляция CD45high расширялась по мере развития патологии Aβ (Рис. SN), но этот процесс почти не наблюдался у нокаутных по Trem2 мышей. Уровень FUNCAT у CD45high клеток оказался значительно выше, чем у CD45low (Рис. 3D). Это говорит о том, что именно микроглия вблизи бляшек активнее всего синтезирует белки. Метод FUNCAT in situ подтвердил мощную индукцию синтеза белка конкретно у бляшечно-ассоциированной микроглии AppNL-G-F мышей, и этот эффект также исчезал при отсутствии TREM2 (Рис. 3E-F).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-f3.jpg\" alt=\"Рисунок 3: TREM2 стимулирует синтез новых белков в микроглии, ассоциированной с бляшками. (A) Схема мечения FUNCAT in vi\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Рисунок 3: TREM2 стимулирует синтез новых белков в микроглии, ассоциированной с бляшками. (A) Схема мечения FUNCAT in vivo. Мышам вводили азидогомоаланин (AHA, 50 мг/кг) за 16 часов до выделения микроглии и анализа. (B) Представительные гистограммы проточной цитометрии интенсивности FUNCAT в микроглии CX3CR1+ CD45+. Красная стрелка указывает на плечо «высокого уровня FUNCAT», присутствующее у микроглии AppNL-G-F, но отсутствующее у мышей Trem2KO. (C) Количественная оценка средней интенсивности флуоресценции (MFI) для сигнала FUNCAT. (D) Сравнение интенсивности CD45 и FUNCAT между популяциями микроглии CD45high и CD45low. (E) Представительные конфокальные изображения кортикальных бляшек, окрашенных на Iba1 (зеленый), Aβ (82E1, серый) и новые белки (FUNCAT, красный). Масштабная линейка: 50 мкм. (F) Количественная оценка интенсивности FUNCAT в микроглии, ассоциированной с бляшками. (G) Представительные конфокальные изображения фактора элонгации трансляции EEF1A1 (пурпурный) в микроглие, ассоциированной с бляшками, от 9-месячных мышей AppNL-G-F и AppNL-G-F;Trem2KO, совместно окрашенных на Iba1 (зеленый) и Aβ (голубой). Белые стрелки указывают на индукцию EEF1A1 внутри микроглии Iba1+, ассоциированной с бляшками. Масштабная линейка: 20 мкм. (H) Количественная оценка интенсивности EEF1A1 внутри микроглии Iba1+, ассоциированной с бляшками. n = 7-8 мышей на группу. **&lt;em&gt;P &amp;lt; 0,001 по двустороннему непарному t-тесту.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;FUNCAT — это метод флуоресцентного мічения нестандартных аминокислот, позволяющий напрямую измерять скорость синтеза новых белков в живых клетках.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для подтверждения результатов через прямые компоненты аппарата трансляции ученые провели окрашивание на эукариотический фактор элонгации трансляции 1α1 (EEF1A1), который входит в число генов анаболической сигнатуры. Экспрессия EEF1A1 заметно возрастала в микроглии около бляшек у мышей AppNL-G-F, но не у мышей AppNL-G-F;Trem2KO (Рис. 3G, H). Данные полностью совпали с результатами FUNCAT, подтвердив высокий уровень трансляционной активности на месте. Эти данные хорошо согласуются с известной осью TREM2-mTOR: фосфорилированный рибосомный белок S6 (p-RPS6), служащий классическим маркером активности mTORC1, также увеличивался в бляшечно-ассоциированной микроглии зависимым от TREM2 образом (Рис. SN). В совокупности эти наблюдения доказывают, что анаболическая программа под управлением TREM2 сопровождается ростом трансляционного потенциала и активным синтезом белка в микроглии, окружающей бляшки.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;К 9 месяцам у мышей AppNL-G-F синтез белка в микроглии возрастает примерно в 2 раза, и этот процесс полностью зависит от наличия функционального рецептора TREM2.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"anabolicheskaya-adaptaciya-zavisit-ot-trem2-i-ogranichena-po-mere-nakopleniya-ab\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#anabolicheskaya-adaptaciya-zavisit-ot-trem2-i-ogranichena-po-mere-nakopleniya-ab\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анаболическая адаптация зависит от TREM2 и ограничена по мере накопления Aβ&lt;/span&gt;&lt;/a&gt;Анаболическая адаптация зависит от TREM2 и ограничена по мере накопления Aβ&lt;/h4&gt;\n&lt;p&gt;Для оценки связи между фагоцитарной нагрузкой и метаболическим ответом мы проанализировали транскриптомы микроглии, взаимодействующей с Aβ, используя флуоресцентный зонд Methoxy-X04 (X04) для мечения фибриллярного амилоида (Рис. 4A). Первичную микроглию из мышей линий AppNL-G-F и AppNL-G-F;Trem2KO разделили на X04⁺ (фагоцитирующие) и X04⁻ (нефагоцитирующие) популяции. Клетки X04⁺ дополнительно классифицировали по интенсивности сигнала на группы с низкой, средней и высокой нагрузкой (Рис. 4B). В возрасте 5–6 месяцев доля X04⁺ клеток была одинаковой у обоих генотипов, что доказывает независимость первичного захвата Aβ от TREM2. Однако к 9–10 месяцам дефицит TREM2 приводил к значительному снижению популяции X04⁺, преимущественно за счет исчезновения подгруппы X04high (Рис. 4B-C). Это указывает на то, что TREM2 критически важен для выживания или поддержания кинетики переработки амилоида при хронической нагрузке.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-f4.jpg\" alt=\"Рисунок 4: Анаболическая адаптация микроглии зависит от TREM2 и является самоограничивающейся вдоль градиента нагрузки A\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4: Анаболическая адаптация микроглии зависит от TREM2 и является самоограничивающейся вдоль градиента нагрузки Aβ. (A) Схема стратегии гейтирования, используемой для сортировки Methoxy-X04 (X04) положительной (X04+) и отрицательной (X04-) микроглии для транскрипционного профилирования. (B) Представительные графики проточной цитометрии, иллюстрирующие гейтирование фагоцитирующей Aβ микроглии. Верхние панели: Сравнение мышей дикого типа (WT) и AppNL-G-F подтверждает специфичность сигнала X04. Нижние панели: Стратификация популяции X04+ на бины низкой, средней и высокой интенсивности флуоресценции, представляющие возрастающую фагоцитарную нагрузку, у мышей AppNL-G-F и AppNL-G-F;Trem2KO. (C) Временной анализ фагоцитирующей Aβ микроглии. Верхние панели: Экспансия популяции X04+ у мышей AppNL-G-F в возрасте от 5–6 месяцев до 9–10 месяцев. Нижние панели: Сравнение распределений интенсивности X04 у 9-месячных мышей AppNL-G-F и AppNL-G-F;Trem2KO, показывающее заметное сокращение популяции X04high в микроглии TREM2KO. (D) Анализ главных компонент (PCA) образцов объемного RNA-seq (n = 46). Точки представляют отдельные биологические реплики по генотипам: WT (n = 5), AppNL-G-F (n = 23) и AppNL-G-F;Trem2KO (n = 18). Цвета обозначают классификацию X04 (подмножества X04- против X04+: низкая, средняя, высокая). Обратите внимание, что уровни X04 обуславливают разделение вдоль PC2, определяя четкие состояния фагоцитоза бляшек. (E) IPA путей с наивысшим рангом, обогащенных у X04+ по сравнению с X04- микроглией AppNL-G-F. Стрелки выделяют надежную индукцию митохондриального биогенеза/окислительного фосфорилирования (красный) и нацеливания/синтеза белков (оранжевый) при взаимодействии с Aβ. (F, G) Сравнительный анализ IPA, иллюстрирующий транскрипционные изменения микроглии по фагоцитарному градиенту (X04high, X04med, X04low) относительно X04- контролей у мышей AppNL-G-F (F) и мышей AppNL-G-F;Trem2KO (G) в возрасте 9 месяцев. (H) Сравнение IPA для AppNL-G-F против AppNL-G-F;Trem2KO, стратифицированное по интенсивности Methoxy-X04 в возрасте 9 месяцев. Z-оценки активации для выбранных значительно обогащенных канонических путей (точный тест Фишера; скорректированное P &amp;lt; 0,05) представлены в виде тепловой карты. Цветовая шкала указывает на предсказанную направленность путей: красный соответствует положительным Z-оценкам (предсказанная активация), синий представляет отрицательные Z-оценки (предсказанное ингибирование), а серый обозначает пути, для которых IPA не смогла предсказать направленность. Пути, не достигшие статистической значимости, отмечены звездочкой (&lt;/em&gt;). Строки путей сгруппированы в четыре категории в соответствии с их биологической значимостью.*&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дефицит TREM2 не препятствует захвату амилоида, но критически снижает выживаемость микроглии с высокой амилоидной нагрузкой (X04high) к 9 месяцам жизни.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ главных компонент (PCA) подтвердил четкое разделение транскриптомных профилей в зависимости от генотипа и градиента интенсивности X04 (Рис. 4D; Рис. SN 4A-B). У мышей AppNL-G-F фагоцитоз Aβ индуцирует митохондриальные пути (окислительное фосфорилирование, транспорт электронов) и программы синтеза белка (трансляция, SRP-зависимый таргетинг) (Рис. 4E). Отсутствие TREM2 полностью блокирует эту программу (Рис. SN 4C). Анализ подгрупп показал нелинейный характер ответа: экспрессия анаболических генов достигает пика в клетках X04low и снижается по мере роста нагрузки. Напротив, гены DAM-сигнатуры (презентация антигенов MHC II) усиливаются с ростом X04, тогда как воспалительные пути (TNF, IFN-γ) подавляются (Рис. 4F).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DAM (Disease-Associated Microglia) — специфическое состояние микроглии при нейродегенерации, характеризующееся потерей гомеостатических функций и активацией генов для борьбы с патологией.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;У мышей Trem2KO анаболический ответ отсутствует даже в группах X04low и X04medium (Рис. 4G). При увеличении нагрузки такие клетки демонстрируют признаки митохондриальной дисфункции, компенсаторный гликолиз и усиление провоспалительных сигналов (Рис. 4G-H). Таким образом, анаболическая программа является TREM2-зависимой и самоограничивающейся: она активируется при поглощении Aβ, достигает максимума при низкой нагрузке и затухает при её накоплении, что при дефиците TREM2 ведет к метаболическому коллапсу микроглии.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проведено на модельных линиях мышей; выявленные метаболические изменения требуют подтверждения в контексте патологии человека.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"anabolicheskaya-sposobnost-kak-marker-fagocitarnoj-kompetentnosti-mikroglii\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#anabolicheskaya-sposobnost-kak-marker-fagocitarnoj-kompetentnosti-mikroglii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анаболическая способность как маркер фагоцитарной компетентности микроглии&lt;/span&gt;&lt;/a&gt;Анаболическая способность как маркер фагоцитарной компетентности микроглии&lt;/h4&gt;\n&lt;p&gt;Для оценки роли анаболической адаптации в активации микроглии был проведен scRNA-seq клеток X04⁺ (фагоцитирующих) и X04⁻ (нефагоцитирующих), выделенных из мозга мышей линии AppNL-G-F в возрасте 9–10 месяцев. Анализ выявил типичные состояния: гомеостатическое (HM), активированное (ARM) и переходное (TRM) (Рис. SN 5A-B). Однако классическая сигнатура «микроглии, ассоциированной с болезнью» (DAM) оказалась распределена равномерно между X04⁺ и X04⁻ популяциями (Рис. SN 5C), что указывает на неспособность этого профиля дифференцировать функционально активные фагоциты от клеток, просто реагирующих на патологию.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DAM (Disease-Associated Microglia) — специфический транскрипционный профиль микроглии, возникающий при нейродегенерации, который часто ошибочно принимают за универсальный маркер функциональной активации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;При повышении разрешения кластеризации удалось разделить HM на подкластеры 0 (нефагоцитирующие) и 2 (фагоцитирующие), а TRM — на 6 (нефагоцитирующие) и 1 (фагоцитирующие) (Рис. 5A, B). Баллы DAM-модуля оказались сопоставимы для фагоцитирующих и нефагоцитирующих пар (Рис. SN 5E), подтверждая слабую связь DAM с фагоцитозом. Анализ дифференциально экспрессируемых генов (DEG) через IPA и GSEA показал, что фагоцитарное состояние характеризуется синхронным усилением биогенеза рибосом, синтеза белка и митохондриального окислительного фосфорилирования (Рис. 5C; Рис. SN 5F-H).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-f5.jpg\" alt=\"Рисунок 5: Сигнатура анаболической адаптации определяет фагоцитарную компетентность точнее, чем каноническая сигнатура D\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5: Сигнатура анаболической адаптации определяет фагоцитарную компетентность точнее, чем каноническая сигнатура DAM. (A) Проекция UMAP профилей одноядерной RNA-seq (разрешение 0,3) из отсортированной X04+ (фагоцитирующей) и X04- (не фагоцитирующей) микроглии, выделенной из 9–10-месячных мышей AppNL-G-F. Субкластеризация высокого разрешения разделяет канонически определенные гомеостатические (HM) и переходные (TRM) кластеры на обогащенные фагоцитирующими и не фагоцитирующими субпопуляции (HM на кластеры 0 и 2; TRM на кластеры 1 и 6), которые разделяются по фагоцитарной компетентности. (B) Количественная оценка состава кластеров, показывающая относительное обогащение каждого субкластера во фракциях X04+ по сравнению с X04-. (C) Анализ обогащения наборами генов (GSEA), сравнивающий обогащенную фагоцитирующую субпопуляцию (Кластер 1) с не фагоцитирующей субпопуляцией (Кластер 6), выявляющий надежное обогащение путей рибосомы и окислительного фосфорилирования в фагоцитирующей субпопуляции. (D) Скрипичные графики, показывающие экспрессию гомеостатической сигнатуры (Tmem119, P2ry12, Cx3cr1), сигнатуры DAM (Trem2, Cst7, Itgax, Cd74, H2-Aa) и сигнатуры анаболической адаптации (Atp5e, Cox4i1, Ndufa1, Eif3f, Eef1a1, Rpl10, Rpl13) по выявленным субпопуляциям. В то время как сигнатура DAM сопоставима между фагоцитирующим и не фагоцитирующим состояниями, сигнатура анаболической адаптации избирательно повышена в фагоцитарных кластерах (1 и 2). (E) Представительные конфокальные изображения микроглии, ассоциированной с бляшками, у 9-месячных мышей AppNL-G-F, совместно окрашенных на Iba1, маркер DAM CD74 и FUNCAT (синтез новых белков). Большинство микроглии Iba1high показывает надежный сигнал FUNCAT, тогда как CD74 индуцируется только в подмножестве. Масштабная линейка: 50 мкм. (F) Количественная оценка корреляции между интенсивностью FUNCAT и CD74 внутри отдельной микроглии Iba1+ (R Пирсона = -0,12, P = 0,187), показывающая, что транскрипционное состояние DAM не предсказывает анаболическую активность.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Фагоцитарная активность микроглии лучше предсказывается анаболическим профилем (синтез белка и АТФ), чем классической сигнатурой DAM.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анаболическая адаптация включает индукцию фактора элонгации трансляции Eef1a1, рибосомных субъединиц (Rpl10, Rpl13) и компонентов цепи переноса электронов (Ndufa1, Cox4i1, Atp5e) (Рис. 5D). При этом нейровоспалительные сигналы в фагоцитирующих кластерах (1, 2) были снижены по сравнению с нефагоцитирующими (6, 0) (Рис. SN 5F, G). Пространственная валидация на срезах мозга 9-месячных мышей AppNL-G-F с использованием Iba1, CD74 и метода FUNCAT подтвердила, что большинство клеток у бляшек (Iba1high) имеют высокий уровень анаболизма, тогда как CD74 экспрессируется лишь частично и не коррелирует с интенсивностью FUNCAT (R = −0.12, P = 0.187; Рис. 5E, F).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проведено на модели болезни Альцгеймера у мышей; корреляция между анаболизмом и фагоцитозом не доказывает прямую причинно-следственную связь.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"utrata-anabolicheskoj-programmy-svyazana-s-proteostaticheskoj-peregruzkoj\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#utrata-anabolicheskoj-programmy-svyazana-s-proteostaticheskoj-peregruzkoj\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Утрата анаболической программы связана с протеостатической перегрузкой&lt;/span&gt;&lt;/a&gt;Утрата анаболической программы связана с протеостатической перегрузкой&lt;/h4&gt;\n&lt;p&gt;Результаты омиксных исследований указывают на то, что способность микроглии поддерживать фагоцитоз критически зависит от энергетического обеспечения. Мы проверили, приводит ли дефицит TREM2 к нарушению переработки фагоцитированного материала. Конфокальная микроскопия показала, что в микроглии Trem2KO рядом с амилоидными бляшками накапливается значительное количество постсинаптического белка PSD95 (Рис. 6A, B). Эти скопления окружены лизосомами CD68+, что свидетельствует о блокировке процессов деградации (Рис. SN). Аналогичное накопление наблюдалось для пресинаптического маркера vGluT1 (Рис. SN) и миелинового белка MBP (Рис. 6C, D). Поскольку PSD95 и MBP не являются компонентами амилоида, их накопление указывает на общий сбой механизмов деградации при отсутствии анаболической поддержки, опосредованной TREM2.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-f6.jpg\" alt=\"Рисунок 6: Потеря TREM2 приводит к внутриклеточному накоплению непереваренного материала. (A, C) Представительные конфок\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Рисунок 6: Потеря TREM2 приводит к внутриклеточному накоплению непереваренного материала. (A, C) Представительные конфокальные изображения микроглии, ассоциированной с бляшками, у 9-месячных мышей, совместно окрашенные на PSD95 (постсинаптический маркер, A) или основной белок миелина (MBP, C), а также на Iba1 и Aβ. Белые стрелки выделяют выраженное внутриклеточное накопление точечных скоплений PSD95 и MBP в соме микроглии Trem2KO. Масштабная шкала: 50 мкм. (B, D) Количественная оценка накопления материала в зависимости от близости к бляшке. Графики скрипки отображают процент перекрывания вокселей PSD95 (B) или MBP (D) в пределах ROI Iba1+, классифицированных как не связанные с бляшками (NPAM) или связанные с бляшками (PAM). Цветные точки представляют отдельные ROI; сплошные черные круги и планки погрешностей представляют оценки маргинальных средних (EMM) ± 95% доверительные интервалы, полученные с помощью бета-биномиальной обобщенной линейной смешанной модели (GLMM). Линии соединяют парные регионы в пределах биологических повторностей (n = 5–6 мышей на группу). Парные сравнения выполнялись с использованием метода Дельта. Уровни значимости: *P &amp;lt; 0,05, **P &amp;lt; 0,01, ***P &amp;lt; 0,001, ***&lt;em&gt;P &amp;lt; 0,0001. Точные значения p указаны для недостоверных тенденций. (E) 3D-рендер поверхности (Imaris) микроглиальной клетки, ассоциированной с бляшкой, у мышей AppNL-G-F;Trem2KO, совместно окрашенной на DAPI, PSD95 (зеленый), Iba1 (пурпурный) и Aβ (голубой). Обратите внимание на экструзию крупного отростка, заполненного материалом. (F) Оптический срез высокого разрешения (63X) (0,17 мкм), подтверждающий включение точечных скоплений PSD95 и агрегатов Aβ внутрь отростка Iba1+. (G) Количественная оценка отростков PSD95+ в нише бляшки (ROI 105 мкм³). Каждая точка представляет отдельный ROI бляшки. Медианы и межквартильные размахи (IQR) обозначены точками и полосами соответственно. Статистическая значимость определялась с использованием непараметрического тестов суммы рангов Вилкоксона с точной перестановкой (пакет R coin, v1.4.3). (H) 3D-рендер поверхности отростков, содержащих обломки основного белка миелина (MBP). (I) Подтверждение наличия материала MBP внутри просвета отростка по одиночному оптическому срезу (0,17 мкм). (J) Количественная оценка плотности отростков MBP+ между генотипами.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В отсутствие TREM2 микроглия не справляется с переработкой фагоцитированного материала, что ведет к накоплению синаптического и миелинового «мусора» внутри клетки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В части микроглии Trem2KO мы обнаружили крупные (2–8 мкм) везикулы, заполненные PSD95 или MBP (Рис. SN). 3D-реконструкция показала, что эти структуры возникают из отростков микроглии и соединены с ними тонкими нанотрубками (Рис. 6E, H; Рис. SN). Внутри таких отростков скапливаются Aβ, PSD95 и MBP. Количественный анализ подтвердил резкое увеличение подобных аномалий: в объеме 105 мкм³ у мышей AppNL-G-F;Trem2KO обнаруживалось в среднем 7–8 таких отростков против менее 0,5 у контрольных мышей (Рис. 6G, J). В нише бляшек 60–70% микроглии Trem2KO демонстрировали признаки протеостатической перегрузки, тогда как в контроле — менее 2%.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на трансгенных мышах; накопление белков в клетках указывает на функциональный дефицит, но требует осторожной экстраполяции на человеческую патологию.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"utrata-anabolicheskoj-programmy-svyazana-s-mitohondrialnoj-disfunkciej\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#utrata-anabolicheskoj-programmy-svyazana-s-mitohondrialnoj-disfunkciej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Утрата анаболической программы связана с митохондриальной дисфункцией&lt;/span&gt;&lt;/a&gt;Утрата анаболической программы связана с митохондриальной дисфункцией&lt;/h4&gt;\n&lt;p&gt;Для оценки биоэнергетики мы использовали проточную цитометрию с красителями MitoTracker Green (общая масса митохондрий) и Red CMXRos (мембранный потенциал). У мышей AppNL-G-F микроглия (CD45high) вблизи бляшек увеличивала как потенциал, так и лизосомальную массу, адаптируясь к клиренсу Aβ (Рис. 7A, B). Напротив, у Trem2KO наблюдалось разобщение: при повышенной общей массе митохондрий их мембранный потенциал был снижен. Индекс здоровья митохондрий (отношение активных органелл к общей массе) был значительно ниже в клетках Trem2KO (Рис. 7C), что говорит о накоплении метаболически неактивных митохондрий. Лизосомальная масса (LysoTracker) не различалась между генотипами (Рис. 7D).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-f7.jpg\" alt=\"Рисунок 7: Потеря TREM2 приводит к снижению митохондриального биогенеза и обновления в микроглии, ассоциированной с бляш\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 7: Потеря TREM2 приводит к снижению митохондриального биогенеза и обновления в микроглии, ассоциированной с бляшками. (A) Анализ методом проточной цитометрии жизнеспособности митохондрий в CD45low (не связанных с бляшками) и CD45high (связанных с бляшками) клетках микроглии 9-месячных мышей AppNL-G-F с количественной оценкой митохондриальной массы (MitoTracker Green), мембранного потенциала (MitoTracker Red CMXRos) и индекса здоровья митохондрий (отношение мембранного потенциала к массе). Микроглия CD45high показывает повышенный мембранный потенциал, что указывает на расширенную биоэнергетическую емкость. (B) Лизосомальная масса (LysoTracker Deep Red) в тех же популциях; микроглия CD45high показывает более высокую лизосомальную массу, подтверждая индукцию деградационной способности. (C) Митохондриальная жизнеспособность в первичной микроглии от 9-месячных мышей AppNL-G-F и AppNL-G-F;Trem2KO (те же показатели, что и в A). Микроглия Trem2KO демонстрирует фенотип «высокая масса / низкий потенциал», указывающий на накопление метаболически некомпетентных органелл. (D) Лизосомальная масса (LysoTracker Deep Red); отсутствие различий между генотипами указывает на то, что накопление митохондрий не обусловлено лизосомальной недостаточностью. (E) Зарождающийся митохондриальный биогенез in situ по данным анализа сближения проксимальных участков (PLA) AHA-TOM20. Представительные конфокальные изображения показывают новосинтезированный TOM20 (точечные скопления TOM20-PLA, красный) внутри микроглии Iba1+ (зеленый) в нише бляшки, выраженный у AppNL-G-F и ослабленный у микроглии Trem2KO. (F) Количественная оценка количества новообразованных точечных скоплений TOM20-PLA на микроглию (количественно оценены 10–15 случайно выбранных бляшек на мышь). (G) Представительные конфокальные изображения (MIP, 5 мкм) микроглии, ассоциированной с бляшками, совместно окрашенные на VDAC1, P62 (рецептор аутофагии) и Iba1. Белые стрелки указывают на митохондрии VDAC1+ с высоким содержанием p62 в микроглии Trem2KO. Масштабная шкала: 20 мкм. (H) Количественная оценка интенсивности P62 в регионах IBA1⁺VDAC1⁺; количественно оценены 20–30 бляшек на мышь.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Индекс здоровья митохондрий — это расчетный показатель, позволяющий отличить функционально активные митохондрии от поврежденных или деполяризованных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для оценки биогенеза мы использовали метод метаболической метки AHA с последующим PLA-анализом для детекции вновь синтезированного белка TOM20. У мышей AppNL-G-F микроглия у бляшек активно синтезировала новые митохондрии (сигнал TOM20-PLA+; Рис. 7E, F). У Trem2KO этот процесс был подавлен, что доказывает необходимость TREM2 для индукции митохондриального биогенеза. Несмотря на отсутствие обновления, общая масса митохондрий в клетках Trem2KO оставалась высокой (Рис. SN), что указывает на накопление старых органелл. Совместное окрашивание VDAC1 и рецептора аутофагии p62/SQSTM1 выявило агрегаты P62+/VDAC1+ в микроглии Trem2KO (Рис. 7G, H), что свидетельствует о нарушении митофагии — процесса удаления поврежденных митохондрий.&lt;/p&gt;\n&lt;h4 id=\"sohrannaya-anabolicheskaya-programma-oslabevaet-v-mikroglii-cheloveka-pri-progressirovanii-bolezni-alcgejmera\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#sohrannaya-anabolicheskaya-programma-oslabevaet-v-mikroglii-cheloveka-pri-progressirovanii-bolezni-alcgejmera\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сохранная анаболическая программа ослабевает в микроглии человека при прогрессировании болезни Альцгеймера&lt;/span&gt;&lt;/a&gt;Сохранная анаболическая программа ослабевает в микроглии человека при прогрессировании болезни Альцгеймера&lt;/h4&gt;\n&lt;p&gt;Для проверки значимости анаболической программы, выявленной у мышей, мы проанализировали атлас транскриптомов одиночных ядер мозга человека (ssKIND), включив данные 523 доноров с известным возрастом и стадиями по Брааку (Таблица 1). Каждое ядро микроглии оценивалось по трем модулям: анаболическому, DAM (микроглия, ассоциированная с болезнью) и гомеостатическому. Анализ показал, что эти состояния занимают различные области на карте транскриптомного многообразия, что подтверждает уникальность анаболического состояния (Рис. 8A, Рис. SN). При прогрессировании болезни от стадий 0–II к V–VI анаболический индекс значимо снижался (с поправкой на возраст β = -0,41, P = 1,8 × 10⁻⁵; Spearman R = -0,35), причем наиболее резкое падение наблюдалось между стадиями III–IV и V–VI (Рис. 8B). Контрольные гены и количество детектируемых генов оставались стабильными, что исключает технические артефакты (Рис. SN).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-f8.jpg\" alt=\"Рисунок 8: Микроглиальная анаболическая программа консервативна у людей и снижается по мере прогрессирования БА. (A) Оце\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 8: Микроглиальная анаболическая программа консервативна у людей и снижается по мере прогрессирования БА. (A) Оценки модулей для каждого ядра для анаболической, DAM и гомеостатической программ, спроецированные на интегрированный UMAP микроглии человека (атлас ssKIND; 523 донора). (B) Псевдообъемная оценка анаболического модуля на уровне донора по стадиям Браака (0–II, III–IV, V–VI). Каждая точка — один донор; коробочные диаграммы показывают медиану и межквартильный размах. Анаболический балл снижается по мере стадионирования по Брааку (линейная модель β = −0,41, P = 1,8×10⁻⁵; Спирман R = −0,35), наиболее резко между стадиями III–IV и V–VI по Брааку. n = 34 / 223 / 266 доноров (Браак 0–II / III–IV / V–VI). Парные сравнения, Манна–Уитни U. (C) Доля клеток с высоким анаболическим уровнем на донора; (D) средняя оценка анаболизма внутри этих клеток с высоким уровнем; клетки были помечены как клетки с высоким анаболическим уровнем по глобальному порогу (топ 30% оценки анаболизма на клеточном уровне по всем клеткам). (E) Экспрессия TREM2 (log₂ CPM) по сравнению с оценкой анаболического модуля у доноров в разрезе стадий Браака. Спирман R положителен на каждой стадии; частичный R с контролем стадии Браака = +0,28. Красная линия — линейная аппроксимация; закрашенная полоса — 95% доверительный интервал. (F) Средние оценки анаболического и DAM модулей по стадиям Браака (планки погрешностей — стандартная ошибка среднего), показывающие расхождение к стадиям V–VI по Брааку. Частичные корреляции Спирмана с контролем стадии Браака: анаболический – TREM2 R = +0,28; анаболический – DAM R = +0,23; анаболический – гомеостатический R = +0,08 (н.д.). (G) Сопряжение анаболической программы с модулем DAM на уровне донора, объединенное по всем донорам (одиночная регрессия, объединенный Спирман R). (H) Сопряжение анаболической программы с модулем DAM на уровне донора; внутригрупповая регрессия по Брааку с частичным Спирманом R (с контролем стадии Браака).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 1.&lt;/strong&gt; Характеристики когорты набора данных микроглии человека при БА в зависимости от стадии по Брааку&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Характеристика&lt;/th&gt;\n&lt;th&gt;Браак 0–II&lt;/th&gt;\n&lt;th&gt;Браак III–IV&lt;/th&gt;\n&lt;th&gt;Браак V–VI&lt;/th&gt;\n&lt;th&gt;Всего&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Доноры, n&lt;/td&gt;\n&lt;td&gt;34&lt;/td&gt;\n&lt;td&gt;223&lt;/td&gt;\n&lt;td&gt;266&lt;/td&gt;\n&lt;td&gt;523&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Возраст, лет — среднее (диапазон)&lt;/td&gt;\n&lt;td&gt;81.2 (64–96)&lt;/td&gt;\n&lt;td&gt;89.2 (68–108)&lt;/td&gt;\n&lt;td&gt;83.7 (56–101)&lt;/td&gt;\n&lt;td&gt;85.9 (56–108)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Пол, Ж / М&lt;/td&gt;\n&lt;td&gt;21 / 13&lt;/td&gt;\n&lt;td&gt;130 / 93&lt;/td&gt;\n&lt;td&gt;162 / 104&lt;/td&gt;\n&lt;td&gt;313 / 210&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Платформа (snRNA / scRNA)&lt;/td&gt;\n&lt;td&gt;34 / 0&lt;/td&gt;\n&lt;td&gt;223 / 0&lt;/td&gt;\n&lt;td&gt;266 / 0&lt;/td&gt;\n&lt;td&gt;523 / 0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Микроглия, n (ядра)&lt;/td&gt;\n&lt;td&gt;8,445&lt;/td&gt;\n&lt;td&gt;53,609&lt;/td&gt;\n&lt;td&gt;142,229&lt;/td&gt;\n&lt;td&gt;204,283&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Данные включают 523 донора (313 женщин / 210 мужчин), взятых из 14 исследований одноядерной РНК-секвенирования.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анаболическая активность микроглии человека прогрессивно снижается при болезни Альцгеймера, что выражается в сокращении доли клеток с высоким анаболическим индексом с 66,7% на стадиях III–IV до 21,4% на стадиях V–VI.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стадии Браака — это система оценки тяжести нейродегенерации, основанная на распространении патологических белков в мозге: от ранних стадий (I–II) до поздних (V–VI).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы разделили микроглию на «анаболически-активную» (верхние 30% по индексу) и проанализировали изменение их доли. Доля таких клеток резко сокращалась на поздних стадиях (P &amp;lt; 1 × 10⁻⁴, Spearman R = -0,32; Рис. 8C), тогда как средний индекс внутри этой группы падал незначительно (Рис. 8D). Декомпозиция показала, что около 62% снижения обусловлено уменьшением числа таких клеток, а 38% — снижением активности внутри самих клеток (Рис. SN). Экспрессия TREM2 положительно коррелировала с анаболическим индексом на всех стадиях (Рис. 8E), причем эта связь сохранялась даже при контроле по стадии Браака (частичные коэффициенты корреляции от +0,24 до +0,35; Рис. SN), что указывает на функциональную зависимость.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на транскриптомных данных постмортальных образцов мозга, поэтому выявленные корреляции не доказывают прямую причинно-следственную связь между TREM2 и анаболизмом.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Хотя средние показатели анаболической программы и DAM-сигнатуры менялись разнонаправленно (Рис. 8F), при контроле по стадии Браака была выявлена положительная связь между ними (частичный R = 0,23; Рис. 8H) и с TREM2 (частичный R = +0,28, P &amp;lt; 1 × 10⁻⁴; Рис. SN). Это означает, что на одной стадии болезни анаболизм и DAM-состояние могут сосуществовать, однако при прогрессировании патологии анаболическая программа угасает, несмотря на сохранение DAM-сигнатуры. Это подтверждает, что биосинтетическая компетентность является независимым и более точным маркером функциональной устойчивости микроглии, чем классические DAM-маркеры.&lt;/p&gt;\n&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;h4 id=\"mikroglialnaya-aktivaciya-pri-bolezni-alcgejmera\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#mikroglialnaya-aktivaciya-pri-bolezni-alcgejmera\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Микроглиальная активация при болезни Альцгеймера&lt;/span&gt;&lt;/a&gt;Микроглиальная активация при болезни Альцгеймера&lt;/h4&gt;\n&lt;p&gt;Традиционно активация микроглии при болезни Альцгеймера связывается с переходом в состояние заболевания-ассоциированной микроглии (DAM). Поскольку этот транскрипционный профиль включает рецепторы фагоцитоза (такие как Clec7a, Axl, MerTK), фенотип DAM часто воспринимается как эквивалент усиленной фагоцитарной функции. Однако наши результаты показывают, что это равенство неверно: на уровне единичных клеток и при анализе in situ профиль DAM и фагоцитарная способность разделяются. Оценки DAM-модуля коррелировали с патологической нагрузкой даже у клеток с метаболической недостаточностью, в то время как отдельная анаболическая программа, зависящая от TREM2 (усиленный синтез белка в сочетании с митохондриальным биогенезом), лучше отражала функционально активные клетки. Мы рассматриваем их как молекулярно независимые программы: DAM отражает транскрипционный стресс-ответ на патологию (потребность в клиренсе), а анаболическая программа — биосинтетическую способность этот клиренс осуществлять (возможность предложения). При росте амилоидной нагрузки потребность увеличивается, тогда как предложение подавляется, создавая дисбаланс спроса и предложения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Транскрипционный профиль DAM отражает лишь потребность в клиренсе («спрос»), тогда как функциональная устойчивость микроглии определяется независимой, зависящей от TREM2 анаболической программой («предложение»), которая истощается при нарастании патологии.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DAM (Disease-Associated Microglia) — специфическое состояние микроглии при нейродегенерации, а анализ in situ позволяет изучать клетки непосредственно в их естественном тканевом окружении без разрушения структуры ткани.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В периферических макрофагах метаболизм часто делится на гликолитический про воспалительный и окислительно-фосфорилирующий противовоспалительный. Микроглия вблизи бляшек не вписывается в эту бинарную схему, одновременно активируя синтез биомассы и митохондриальное дыхание, что напоминает mTOR-зависимое увеличение трансляционной и митохондриальной емкости активированных Т-клеток. Функциональный смысл этого процесса — протеостатический: непрерывное поглощение A\beta и клеточного мусора истощает лизосомальные ферменты, мембраны и АТФ быстрее, чем это компенсируется в гомеостазе. Наблюдаемая упреждающая активация рибосомального и митохондриального биогенеза поддерживает этот протеостатический ресурс. Наши данные подтверждают и расширяют гипотезу о существовании оси TREM2-mTOR, поддерживающей метаболическую стабильность микроглии: зависимая от TREM2 анаболическая программа обеспечивает ремоделирование протеома и обновление митохондрий, отделяясь от транскрипционного состояния DAM и самоограничиваясь по градиенту амилоида.&lt;/p&gt;\n&lt;p&gt;В рамках этой модели накопление синаптического и миелинового мусора у микроглии с нокаутом гена Trem2 (Trem2KO) может быть связано не с первичным дефектом распознавания, а с нарушением процесса деградации. Наш метаболический профиль указывает на нарушение митохондриального обновления как на возможную причину дисфункции микроглии в отсутствие TREM2. Данные единичных клеток и анализа in situ показали разделение массы органелл и их функции: микроглия Trem2KO демонстрирует фенотип «высокая масса / низкий потенциал», накапливая деполяризованные митохондрии. Мы предполагаем, что это отражает неспособность обновлять митохондриальную сеть при хроническом фагоцитарном стрессе, так как наши in vivo данные AHA-TOM20 PLA показывают необходимость TREM2 для этого биогенетического ответа. Не имея возможности синтезировать замену, клетки Trem2KO сохраняют стареющие поврежденные митохондрии, что дает увеличение общей массы при снижении мембранного потенциала и биоэнергетических последствиях.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Выводы о причинно-следственных связях между дефицитом митохондриального биогенеза и дисфункцией микроглии у Trem2KO носят ассоциативный характер, поскольку прямое переключение анаболической оси без затрагивания иных функций TREM2 не проводилось.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Расширяя эти наблюдения на человека, мы изучили анаболическую адаптацию микроглии на интегрированном атласе единичных ядер человека, охватывающем образцы со стадиями Браака. Анаболическая программа снижалась у микроглии на поздних стадиях Браака (V-VI) и оставалась положительно связанной с TREM2 внутри стадий заболевания, что указывает на ее консервативность у людей и угасание по мере прогрессирования патологии. Градиент амилоида у мышей X04 и человеческий градиент Браака описывают одно и то же зависимое от нагрузки подавление на двух уровнях — острого фагоцитарного взаимодействия и кумулятивной патологии. Данные носят перекрестный и корреляционный характер, однако межвидовое сходство укрепляет значимость анаболической оси для болезни Альцгеймера у человека.&lt;/p&gt;\n&lt;p&gt;Эти наблюдения имеют значение для антиамилоидной иммунотерапии. Клиническая эффективность антител к A\beta частично зависит от способности микроглии осуществлять фагоцитоз через Fc-рецепторы, что требует больших биоэнергетических затрат. Если анаболическая программа, поддерживающая фагоцитоз, подавляется самой нагрузкой, то длительная фармакологическая стимуляция может привести микроглу к биосинтетическому истощению, когда потребность в клиренсе превышает предложение. Это порождает гипотезу, подлежащую проверке, что сочетание иммунотерапии с вмешательствами, поддерживающими анаболическую ось (например, агонистами TREM2 или метаболическими кофакторами), поможет сохранить фагоцитарную емкость микроглии и расширить терапевтическое окно.&lt;/p&gt;\n&lt;p&gt;Мы представляем это как гипотезу, порожденную нашими результатами, а не как доказанный терапевтический принцип, который можно напрямую проверить, измеряя анаболическую сигнатуру в тканях после иммунотерапии. Выводы имеют ограничения: во-первых, сравнения опираются на нокаут TREM2, влияющий на множество функций, поэтому без ортогонального вмешательства, нацеленного строго на анаболизм, мы не можем полностью отделить клеточно-автономные требования от сдвигов состава популяции. Во-вторых, анализ данных человека носит перекрестный и корреляционный характер. Тем не менее, наши результаты позиционируют зависимую от TREM2 анаболическую адаптацию как пространственно разрешенный маркер протеостатической компетентности микроглии, имеющий прямое значение для терапий, полагающихся на ее функции.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Снижение анаболического потенциала микроглии при нарастании патологии ставит под угрозу успех антиамилоидной иммунотерапии, предполагая необходимость совместного применения стимуляторов метаболизма для поддержания клиренса.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Ключевые реагенты и ресурсы&lt;/strong&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Реагент или ресурс&lt;/th&gt;\n&lt;th&gt;Источник&lt;/th&gt;\n&lt;th&gt;Идентификатор&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Antibodies&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Anti-Amyloid β (N) (clone 82E1)&lt;/td&gt;\n&lt;td&gt;IBL Co., LTD.&lt;/td&gt;\n&lt;td&gt;Cat#10323; RRID:AB_10707424&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Anti-Iba1&lt;/td&gt;\n&lt;td&gt;Wako&lt;/td&gt;\n&lt;td&gt;Cat#019-19741; RRID:AB_839504&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td
