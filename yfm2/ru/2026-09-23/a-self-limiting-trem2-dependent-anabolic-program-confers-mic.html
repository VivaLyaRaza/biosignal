;\n&lt;tr&gt;\n&lt;td&gt;GraphPad Prism&lt;/td&gt;\n&lt;td&gt;GraphPad Software&lt;/td&gt;\n&lt;td&gt;v9.5.1; RRID:SCR_002798&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h4 id=\"eksperimentalnye-modeli-i-harakteristiki-obuektov\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#eksperimentalnye-modeli-i-harakteristiki-obuektov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Экспериментальные модели и характеристики объектов&lt;/span&gt;&lt;/a&gt;Экспериментальные модели и характеристики объектов&lt;/h4&gt;\n&lt;p&gt;В исследовании использовали мышей линий App^NL-G-F и мышей с нокаутом гена Trem2 (Trem2KO, линия #027197). Для получения двойных мутантов скрещивали мышей App^NL-G-F с Trem2KO, что позволило вывести гомозиготное по обеим модификациям потомство App^NL-G-F; Trem2KO. Животных содержали в условиях барьерного питомника, свободных от патогенов, при стандартном 12-часовом световом и темновом цикле, с неограниченным доступом к воде и пище. Плотность заселения составляла не более 5 особей в одной клетке. В экспериментах задействовали как самцов, так и самок. Все манипуляции с животными выполнялись в строгом соответствии с нормами Национальных институтов здоровья (NIH) и были предварительно одобрены Комитетом по уходу и использованию лабораторных животных Университета штата Огайо (IACUC). Для анализа данных микроглии человека отобрали клетки из интегрированного атласа одиночных ядер ssKIND. Отбирали клеточный материал, аннотированный как микроглиальный (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-evpmmra6\"&gt;cell_type = “Microglia”&lt;/code&gt;), полученный от доноров с подтвержденным диагнозом болезни Альцгеймера (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vjnvur7o\"&gt;Disease_consistent = “AD”&lt;/code&gt;) и имеющий достоверные метаданные о возрасте и стадиях Браака. Стадии Браака были разделены на диапазоны 0–II, III–IV и V–VI; возраст доноров составлял 51–78 лет и более 78 лет (самая младшая группа 20–51 года не содержала подходящих микроглиальных клеток при Альцгеймере). Итоговый массив данных включил 204 283 микроглиальных клетки от 523 доноров из различных областей мозга. Необработанные целочисленные значения счетчиков сохраняли для псевдобулкового объединения, а интегрированное латентное пространство scVI (размерностью 30) использовали для кластеризации и встраивания. Если не указано иное, анализы объединяют доноров различных возрастных групп, разделяя их только по стадиям Браака.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нокаут гена — это метод намеренного отключения определенного гена у лабораторных животных для изучения его функций, а стадии Браака отражают степень распространения патологических изменений в головном мозге при нейродегенеративных заболеваниях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"detali-metodov\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#detali-metodov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Детали методов&lt;/span&gt;&lt;/a&gt;Детали методов&lt;/h4&gt;\n&lt;p&gt;Для метаболического мечения вновь синтезируемых белков in vivo мышам внутрибрюшинно вводили азидогомоаланин (AHA) в дозе 50 мг/кг, растворенный в стерильном фосфатно-солевом буфере (PBS). Животных выводили из эксперимента через 16 часов после инъекции. Для проведения проточной цитометрии суспензированные клетки инкубировали с реактивом Alexa Fluor 647-Alkyne с использованием коммерческого набора Click-iT Cell Reaction Buffer Kit в строгом соответствии с рекомендациями производителя. В методе анализа близкого расположения молекул (PLA) свободные срезы ткани мозга обрабатывали биотином-алкином с тем же набором буферов до этапа инкубации с первичными антителами. Выделение и сортировку микроглии взрослых мышей проводили методом магнитной сепарации (MACS). Животных наркотизировали и перфузировали через левый желудочек сердца охлажденным PBS для вымывания циркулирующих лейкоцитов. Извлеченный мозг охлаждали, измельчали и диссоциировали при помощи специального набора реагентов Neural Tissue Dissociation Kit (P) и прибора gentleMACS Tissue Dissociator. Полученную суспензию фильтровали через сетку с размером пор 70 мкм и центрифугировали при 300 × g в течение 10 минут. Миелин удаляли с помощью магнитных микросфер Myelin Removal Beads II. Очищенную суспензию одиночных клеток сразу использовали для цитометрии или дополнительно обогащали для транскрипционного анализа на колонках LS с использованием микросфер CD11b MicroBeads.&lt;/p&gt;\n&lt;p&gt;Для оценки уровня амилоидной нагрузки применяли соединение Метокси-X04 (X04), которое растворяли в диметилсульфоксиде (DMSO) с последующим разведением смесью пропиленгликоля и PBS в соотношении 1:1 до получения стабильной желтовато-зеленой эмульсии. Свежеприготовленный раствор вводили внутрибрюшинно в дозе 10 мг/кг за 16 часов до извлечения тканей мозга. В ходе проточной цитометрии клетки инкубировали с красителем жизнеспособности Fixable Viability Dye eFluor 780 и блоком Fc-рецепторов anti-CD16/32 для предотвращения неспецифического связывания и исключения мертвых клеток. Затем проводили окрашивание флуоресцентно мечеными антителами к маркерам CD11b, CD45 и CX3CR1. Живые клетки микроглии выделяли в гейты как CD45^int; CD11b⁺; CX3CR1⁺ с разделением на положительные (X04⁺) и отрицательные (X04⁻) фракции по сигналу в канале возбуждения DAPI (405 нм). В качестве биологических отрицательных контролей для настройки порогов гейтирования использовали интактных мышей дикого типа, которым также вводили Метокси-X04.&lt;/p&gt;\n&lt;h4 id=\"analiz-metodom-pla-in-situ-proximity-ligation-assay\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#analiz-metodom-pla-in-situ-proximity-ligation-assay\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ методом PLA (In Situ Proximity Ligation Assay)&lt;/span&gt;&lt;/a&gt;Анализ методом PLA (In Situ Proximity Ligation Assay)&lt;/h4&gt;\n&lt;p&gt;Для визуализации новообразованных митохондриальных белков срезы мозга мышей, которым вводили AHA, подвергали «клик-реакции» с биотином-алкином. После промывки срезы инкубировали с антителами к TOM20 (1:500) и биотину (1:500). Далее применяли зонды PLA (Duolink) согласно протоколу производителя для амплификации сигнала.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод PLA позволяет выявить белковые взаимодействия или присутствие специфических молекул в клетке с высокой точностью, создавая флуоресцентный сигнал только при сближении двух целевых антител на расстояние менее 40 нм.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sekvenirovanie-rnk-i-bioinformatika\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#sekvenirovanie-rnk-i-bioinformatika\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Секвенирование РНК и биоинформатика&lt;/span&gt;&lt;/a&gt;Секвенирование РНК и биоинформатика&lt;/h4&gt;\n&lt;p&gt;Общую РНК из микроглии выделяли набором Quick-RNA, проверяя качество на TapeStation (индекс целостности РНК &amp;gt; 8). Библиотеки cDNA готовили по протоколу SMART Seq® mRNA LP Kit и секвенировали на системе HiSeq 4000. Первичные данные FASTQ выравнивали на геном мыши (GRCm39) с помощью STAR (v2.7.10a), адаптеры удаляли через Flexbar, а подсчет ридов вели в featureCounts. Анализ проводили в среде R (v4.3.3).&lt;/p&gt;\n&lt;h4 id=\"kolichestvennyj-proteomnyj-analiz\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#kolichestvennyj-proteomnyj-analiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Количественный протеомный анализ&lt;/span&gt;&lt;/a&gt;Количественный протеомный анализ&lt;/h4&gt;\n&lt;p&gt;Лизаты мозга (5% SDS, 50 мМ TEAB) обрабатывали с использованием устройства STrap Midi MS (по 2000 мкг белка на образец). Процедура включала восстановление DTT, алкилирование иодоацетамидом и переваривание трипсином/Lys-C. Пептиды метили TMT-метками, объединяли и фракционировали методом ВЭЖХ (12 фракций). Анализ проводили на системе LC-MS/MS с идентификацией в Proteome Discoverer 2.5. Значимыми считались изменения при FDR ≤ 0.05 (метод Бенджамини-Хохберга).&lt;/p&gt;\n&lt;h4 id=\"gistologicheskij-analiz-i-mikroskopiya\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#gistologicheskij-analiz-i-mikroskopiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гистологический анализ и микроскопия&lt;/span&gt;&lt;/a&gt;Гистологический анализ и микроскопия&lt;/h4&gt;\n&lt;p&gt;Срезы мозга толщиной 40 мкм окрашивали иммунофлуоресцентным методом с использованием первичных антител (включая маркеры Aβ, Iba1, PSD95, VGLUT1, TOM20, VDAC1, MBP, Caspase-3, CD74) и вторичных антител. Изображения получали на конфокальных микроскопах ZEISS Axio Observer или Nikon AXR. Количественную оценку 2D-изображений проводили в ImageJ, используя автоматические пороги «Otsu» или «Triangle» для выделения областей интереса (ROI). Статистику рассчитывали через t-критерий или ANOVA.&lt;/p&gt;\n&lt;h4 id=\"odnokletochnoe-sekvenirovanie-scrna-seq\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#odnokletochnoe-sekvenirovanie-scrna-seq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Одноклеточное секвенирование (scRNA-seq)&lt;/span&gt;&lt;/a&gt;Одноклеточное секвенирование (scRNA-seq)&lt;/h4&gt;\n&lt;p&gt;Библиотеки готовили с помощью 10x Genomics Chromium (10 000 клеток на образец) и секвенировали на Illumina NovaSeq (50 000–100 000 ридов на клетку). Данные обрабатывали в Cell Ranger (v7.0.0) с выравниванием на геном mm10. В Seurat (v4.1.1) отсеивали клетки с &amp;lt; 1500 признаками, &amp;lt; 3000 UMI или &amp;gt; 5% митохондриальных ридов.&lt;/p&gt;\n&lt;h4 id=\"statisticheskij-analiz-i-funkcionalnoe-obogashenie\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#statisticheskij-analiz-i-funkcionalnoe-obogashenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистический анализ и функциональное обогащение&lt;/span&gt;&lt;/a&gt;Статистический анализ и функциональное обогащение&lt;/h4&gt;\n&lt;p&gt;Дифференциальную экспрессию генов (DEG) рассчитывали в DESeq2 (v1.42.1) с поправкой на множественные сравнения (FDR &amp;lt; 0.05). Анализ путей проводили в IPA (Ingenuity Pathway Analysis) с использованием z-score для предсказания активации или ингибирования функций. Gene Set Enrichment Analysis (GSEA) выполняли через пакет clusterProfiler, ранжируя гены по log2 Fold Change и p-значению. Результаты визуализировали через точечные диаграммы (dot plots) и сети «ген-концепция» (cnetplot).&lt;/p&gt;\n&lt;h4 id=\"3d-konfokalnaya-vizualizaciya-i-ierarhicheskoe-statisticheskoe-modelirovanie\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#3d-konfokalnaya-vizualizaciya-i-ierarhicheskoe-statisticheskoe-modelirovanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3D-конфокальная визуализация и иерархическое статистическое моделирование&lt;/span&gt;&lt;/a&gt;3D-конфокальная визуализация и иерархическое статистическое моделирование&lt;/h4&gt;\n&lt;p&gt;Для количественной оценки морфологических и биохимических свойств Iba1-позитивных (Iba1+) микроглиальных областей интереса (ROI) использовался конфокальный микроскоп Nikon AXR. Из-за высокой плотности микроглии у мышей линии AppNL-G-F, ROI определялись как морфологические единицы, а не отдельные клетки. Реконструкция и анализ проводились в ПО Imaris (v11.0). Сегментация поверхностей Iba1+ выполнялась с помощью алгоритма машинного обучения для обеспечения объективности. Объемная колокализация маркеров оценивалась через пороговые значения, скорректированные на фоновый шум, с последующим переводом объемов в количество вокселей. Интенсивность флуоресценции маркеров измерялась непосредственно по поверхности Iba1+. Микроглия классифицировалась как ассоциированная с бляшками (PAM), если она контактировала с кластером амилоида, или как неассоциированная (NPAM).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ROI (область интереса) — это выделенный фрагмент изображения, который анализируется отдельно, а GLMM — статистический метод, позволяющий учитывать как фиксированные эффекты (генотип, статус бляшек), так и случайные (индивидуальные особенности животных), что критично для вложенных данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для учета иерархической структуры данных применялись обобщенные линейные смешанные модели (GLMM) в среде R (пакеты glmmTMB, emmeans). Для пропорциональных данных использовалась бета-биномиальная модель, для непрерывных (интенсивность) — гамма-распределение. Адекватность моделей проверялась пакетом DHARMa. Результаты представлялись как оценочные маргинальные средние (EMM) с 95% доверительными интервалами.&lt;/p&gt;\n&lt;h4 id=\"kolichestvennyj-analiz-vklyuchenij-v-mikrogliyu-i-neparametricheskaya-statistika\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#kolichestvennyj-analiz-vklyuchenij-v-mikrogliyu-i-neparametricheskaya-statistika\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Количественный анализ включений в микроглию и непараметрическая статистика&lt;/span&gt;&lt;/a&gt;Количественный анализ включений в микроглию и непараметрическая статистика&lt;/h4&gt;\n&lt;p&gt;Плотность включений (PSD95, MBP) оценивалась «слепым» методом: первый аналитик размечал бляшки, второй считал включения внутри них. Плотность выражалась как число включений на 10⁵ µ m³ объема бляшки. Из-за отсутствия симптомов у контрольной группы (AK) и высокой вариативности у экспериментальной (AKTK) стандартные GLMM не сходились. Применялся непараметрический тест Вилкоксона с точной перестановкой (пакет coin, v1.4.3). Значимость определялась по p-значениям точного перестановочного теста.&lt;/p&gt;\n&lt;h4 id=\"predvaritelnaya-normalizaciya-i-udalenie-dubletov\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#predvaritelnaya-normalizaciya-i-udalenie-dubletov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Предварительная нормализация и удаление дублетов&lt;/span&gt;&lt;/a&gt;Предварительная нормализация и удаление дублетов&lt;/h4&gt;\n&lt;p&gt;В Seurat проводилась нормализация данных после контроля качества (QC). Вариации, связанные с процентом митохондриальных и рибосомальных генов, не удалялись из-за их метаболической значимости. Дублеты (ошибочно объединенные клетки) выявлялись через DoubletFinder (v2.0.3) и удалялись (в среднем 10% от выборки). В итоговый анализ вошли 26 096 синглетов.&lt;/p&gt;\n&lt;h4 id=\"normalizaciya-sctransform,-integraciya-i-klasterizaciya\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#normalizaciya-sctransform,-integraciya-i-klasterizaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нормализация SCTransform, интеграция и кластеризация&lt;/span&gt;&lt;/a&gt;Нормализация SCTransform, интеграция и кластеризация&lt;/h4&gt;\n&lt;p&gt;Матрица экспрессии нормализовалась через SCTransform, отбирались 3000 наиболее вариабельных генов для снижения размерности. Интеграция четырех образцов проводилась функциями FindIntegrationAnchors и IntegrateData (reciprocal PCA, k=5). Кластеризация выполнялась алгоритмом Лувена по 20 главным компонентам (разрешение 0.3). Визуализация — UMAP.&lt;/p&gt;\n&lt;h4 id=\"annotaciya-klasterov-i-differencialnaya-ekspressiya\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#annotaciya-klasterov-i-differencialnaya-ekspressiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Аннотация кластеров и дифференциальная экспрессия&lt;/span&gt;&lt;/a&gt;Аннотация кластеров и дифференциальная экспрессия&lt;/h4&gt;\n&lt;p&gt;Типы клеток определялись через маркеры (тест Вилкоксона) и сравнение с базой данных AppNL-G-F. После исключения немикроглиальных клеток (осталось 25 776) проводилась повторная кластеризация (разрешение 0.2), выделившая 7 состояний микроглии. Дифференциально экспрессируемые гены (DE) определялись с поправкой Бонферрони (p &amp;lt; 0.05).&lt;/p&gt;\n&lt;h4 id=\"analiz-gennyh-modulej-i-signatur\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#analiz-gennyh-modulej-i-signatur\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ генных модулей и сигнатур&lt;/span&gt;&lt;/a&gt;Анализ генных модулей и сигнатур&lt;/h4&gt;\n&lt;p&gt;Для оценки состояний микроглии (HM, ARM, TRM, IRM, CPM, рибосомальная сигнатура, DAM) использовалась функция AddModuleScore. Распределение экспрессии визуализировалось через «скрипичные» графики (stacked violin plots).&lt;/p&gt;\n&lt;h4 id=\"multiomika-i-integrativnyj-analiz\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#multiomika-i-integrativnyj-analiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мультиомика и интегративный анализ&lt;/span&gt;&lt;/a&gt;Мультиомика и интегративный анализ&lt;/h4&gt;\n&lt;p&gt;Интегрировались данные РНК-секвенирования и протеомики микроглии (3 и 9 месяцев, AppNL-G-F и Trem2KO). Пересечение молекул визуализировалось диаграммой Венна (пакет VennDiagram, v1.7.3). Для поиска общих процессов применялся метод ActivePathways с объединением p-значений по методу Брауна и весовым вектором [mRNA=1, protein=1] для выявления конкордантных изменений.&lt;/p&gt;\n&lt;h4 id=\"integrativnyj-analiz-obogasheniya-putej\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#integrativnyj-analiz-obogasheniya-putej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интегративный анализ обогащения путей&lt;/span&gt;&lt;/a&gt;Интегративный анализ обогащения путей&lt;/h4&gt;\n&lt;p&gt;Функциональное обогащение выполнялось с помощью пакета ActivePathways в R для выявления биологических процессов, значимо представленных в интегрированных наборах данных. Анализ использовал список генов, ранжированный по объединенным P-значениям, полученным на основе направленной интеграции данных. Для определения оптимального обогащения терминов Gene Ontology (GO) применялся ранговый гипергеометрический тест. Коллекция наборов генов (m5.go.v2023.2.Mm.symbols.gmt) фильтровалась так, чтобы включить только пути, содержащие от 10 до 500 аннотированных генов, что позволяло минимизировать смещения от чрезмерно специфичных или слишком общих терминов. Значимые термины GO определялись с использованием поправки Холма на уровень семейжеских ошибок (FWER) &amp;lt; 0.05. Для облегчения биологической интерпретации уникальные и значимые термины GO визуализировались с помощью гистограмм, где ось x представляла &lt;span class=\"yfm-latex\" data-content=\"-%5Clog_%7B10%7D(%5Ctext%7B%D1%81%D0%BA%D0%BE%D1%80%D1%80%D0%B5%D0%BA%D1%82%D0%B8%D1%80%D0%BE%D0%B2%D0%B0%D0%BD%D0%BD%D1%8B%D0%B5%20P-%D0%B7%D0%BD%D0%B0%D1%87%D0%B5%D0%BD%D0%B8%D1%8F%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, а ось y перечисляла конкретные термины GO, сгруппированные по их более широким функциональным категориям.&lt;/p&gt;\n&lt;h4 id=\"statisticheskij-analiz\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#statisticheskij-analiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистический анализ&lt;/span&gt;&lt;/a&gt;Статистический анализ&lt;/h4&gt;\n&lt;p&gt;Статистический анализ проводился с использованием программного обеспечения GraphPad Prism 9 (v9.5.1; GraphPad Software, Сан-Диего, Калифорния, США). Данные представлены как среднее ± стандартная ошибка среднего (SEM). Парные сравнения анализировались с помощью двусторонних непарных t-тестов. Множественные сравнения анализировались с использованием однофакторного или двуфакторного дисперсионного анализа (ANOVA) с последующими пост-hoc тестами Тьюки или Сидака. Значение P &amp;lt; 0.05 считалось статистически значимым.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Дисперсионный анализ (ANOVA) и t-тесты позволяют проверить, есть ли реальные различия между группами экспериментов, исключая случайный разброс данных.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gennye-moduli\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#gennye-moduli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Генные модули&lt;/span&gt;&lt;/a&gt;Генные модули&lt;/h4&gt;\n&lt;p&gt;Оценивались четыре генных модуля. Анаболический модуль объединяет субъединицы окислительного фосфорилирования (ATP5E, COX4I1, NDUFA1, NDUFB9, NDUFS8, UQCRB, COX7B) и гены трансляции белка (RPS3A, RPS9, RPL10, RPL13, RPL18A, EIF3F, EEF1A1, MRPL42, MRPS14). Модуль микроглии, ассоциированной с заболеванием (DAM), включал SPP1, APOE, CD9, ITGAX, GPNMB, CD68, CST7, LPL, LGALS3; гомеостатический модуль включал P2RY12, CX3CR1, TMEM119, HEXB. Трек housekeeping (контроль «домашнего хозяйства»: ACTB, GAPDH, B2M) оценивался исключительно как контроль качества РНК.&lt;/p&gt;\n&lt;h4 id=\"psevdoobuemnye-profili-donorov-i-ocenki-modulej\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#psevdoobuemnye-profili-donorov-i-ocenki-modulej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Псевдообъемные профили доноров и оценки модулей&lt;/span&gt;&lt;/a&gt;Псевдообъемные профили доноров и оценки модулей&lt;/h4&gt;\n&lt;p&gt;Для каждого донора сырые счета микроглии суммировались по генам, нормализовались в счета на миллион (CPM) и &lt;span class=\"yfm-latex\" data-content=\"%5Clog_2(%5Ctext%7BCPM%7D%2B1)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; для получения псевдообъемного профиля донора. Оценка модуля донора представляет собой среднее значение по всем генам модуля z-оценки &lt;span class=\"yfm-latex\" data-content=\"%5Clog_2%5Ctext%7BCPM%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, причем z-оценка вычислялась по всем донорам. Такой дизайн на уровне донора (одно значение на донора) позволяет избежать завышения значимости, возникающего при рассмотрении отдельных клеток в качестве независимых реплик (псевдорепликация).&lt;/p&gt;\n&lt;h4 id=\"kletochnye-ocenki,-re-klasterizaciya-i-vstraivanie\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#kletochnye-ocenki,-re-klasterizaciya-i-vstraivanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Клеточные оценки, ре-кластеризация и встраивание&lt;/span&gt;&lt;/a&gt;Клеточные оценки, ре-кластеризация и встраивание&lt;/h4&gt;\n&lt;p&gt;Для визуализации одиночных клеток (UMAP) оценки модулей для каждой клетки вычислялись как среднее по генам модуля z-оценки лог-нормализованной экспрессии, с вычислением z по клеткам. Микроглия была повторно кластеризована на интегрированном латентном пространстве scVI, ограниченном этими клетками: граф k-ближайших соседей (k = 15) был построен на 30-мерном латентном пространстве, кластеризация Лейдена при разрешении 0.4 дала 11 субкластеров, а UMAP был перестроен из того же графа. Точечный график модульных генов обобщает среднюю экспрессию (z по кластерам) и долю экспрессирующих клеток на субкластер.&lt;/p&gt;\n&lt;h4 id=\"stratifikaciya-trem2-i-dam\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#stratifikaciya-trem2-i-dam\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Стратификация TREM2 и DAM&lt;/span&gt;&lt;/a&gt;Стратификация TREM2 и DAM&lt;/h4&gt;\n&lt;p&gt;Клетка оценивалась как TREM2-положительная, если она содержала по крайней мере один счет TREM2, и TREM2-отрицательная в противном случае; для каждого донора рассчитывалась доля TREM2-положительных клеток и раздельные псевдообъемные профили для TREM2-положительных / TREM2-отрицательных клеток. Клетки с высоким уровнем DAM определялись как верхняя терциль клеточной оценки DAM (вычисленной по всем клеткам); псевдообъем донора, ограниченный клетками с высоким DAM, использовался для анализа внутри DAM. TREM2 является низкоуровневым транскриптом в данных одиночных ядер из капель, поэтому доля TREM2-положительных клеток отражает чувствительность детектирования и интерпретируется сравнительно (в разрезе стадий Браака), а не как абсолютная доля.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Псевдообъемное усреднение (pseudobulk) объединяет данные множества клеток одного донора, что помогает снизить уровень «шума» от пустых капель и технологических артефактов секвенирования.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"statistika\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#statistika\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистика&lt;/span&gt;&lt;/a&gt;Статистика&lt;/h4&gt;\n&lt;p&gt;Снижение анаболических процессов по стадиям Браака проверялось методом обычных наименьших квадратов на псевдообъеме доноров (оценка ~ возраст + Браак + возраст × Браак); медиана генов на клетку, процент митохондриальных ридов и модуль housekeeping моделировались аналогично в качестве контроля качества РНК. Парные сравнения между соседними стадиями Браака проводились с помощью U-критерия Манна–Уитни (на уровне доноров, непарный). Связь между оценками модулей и экспрессией TREM2 оценивалась с помощью ранговой корреляции Спирмена (&lt;span class=\"yfm-latex\" data-content=\"%5Crho\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, на рисунках обозначается как R) в целом, внутри каждой стадии Браака и внутри клеток с высоким DAM; ранговая корреляция использовалась, поскольку оценки на уровне донора содержат выбросы, к которым корреляция Пирсона чувствительна.&lt;/p&gt;\n&lt;p&gt;Для разделения связи, не зависящей от стадии заболевания, и общего тренда между стадиями (парадокс Симпсона, при котором объединенная корреляция анаболизма и DAM маскируется противоположными градиентами Браака для этих двух программ), вычислялись частные корреляции Спирмена с контролем по стадиям Браака. Диссоциация DAM и анаболизма была обобщена средними оценками модулей по стадиям; изменение внутристадийной корреляции анаболизма и DAM между ранними (Браак 0–II/III–IV) и поздними (Браак V–VI) стадиями проверялось с помощью z-сравнения Фишера. Чтобы выяснить, является ли снижение анаболизма на уровне доноров композиционным или внутриклеточным эффектом, клетки помечались как анаболически-высокие по единому глобальному порогу (верхние 30% клеточной оценки анаболизма по всем клеткам); для каждого донора мы вычисляли долю анаболически-высоких клеток и среднюю оценку внутри них. Изменение среднего значения по донорам от стадий 3–4 к стадиям 5–6 было разделено на композиционный и внутриклеточный компоненты с помощью декомпозиции сдвига-доли (shift-share). Все тесты были двусторонними.&lt;/p&gt;\n&lt;h4 id=\"programmnoe-obespechenie\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#programmnoe-obespechenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Программное обеспечение&lt;/span&gt;&lt;/a&gt;Программное обеспечение&lt;/h4&gt;\n&lt;p&gt;Все анализы выполнялись на Python 3.10.6. Обработка данных одиночных ядер, построение графа соседей и встраивание UMAP выполнялись с помощью scanpy (v1.11.5) 46 и anndata (v0.11.4) 47; субкластеры определялись кластеризацией Лейдена с использованием leidenalg (v0.10.2) 48 и python-igraph (v0.11.9), а встраивания вычислялись с помощью umap-learn (v0.5.9) 49. Статистический анализ микроглии использовал numpy (v2.2.5), pandas (v2.3.3), scipy (v1.15.3) 50 и statsmodels (v0.14.5). Рисунки генерировались с использованием matplotlib (v3.10.8) 51 и seaborn (v0.13.2) 52.&lt;/p&gt;\n&lt;h4 id=\"analiz-odinochnyh-yader\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#analiz-odinochnyh-yader\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ одиночных ядер&lt;/span&gt;&lt;/a&gt;Анализ одиночных ядер&lt;/h4&gt;\n&lt;p&gt;В данном исследовании все доноры были проанализированы с использованием метода секвенирования РНК единичных ядер (single-nucleus RNA-seq). Для оценки прогрессирования нейродегенеративного процесса все образцы были распределены на три группы в соответствии со стадиями Браака: начальные стадии (0–II), промежуточные стадии (III–IV) и тяжелые стадии (V–VI).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Секвенирование РНК единичных ядер (snRNA-seq) позволяет изучать экспрессию генов на уровне отдельных клеток или ядер, что критически важно для гетерогенной ткани головного мозга.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Полученные профили экспрессии сопоставлялись между выделенными группами стадий Браака для выявления транскрипционных изменений, сопровождающих развитие патологии.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS3.jpg\" alt=\"Дополнительный рисунок 3. (A) Репрезентативная стратегия гейтирования при проточной цитометрии, использованная для выдел\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Дополнительный рисунок 3. (A) Репрезентативная стратегия гейтирования при проточной цитометрии, использованная для выделения живых одиночных микроглиальных клеток (CX3CR1+ CD45+) из суспензии ткани мозга. (B) Репрезентативные графики проточной цитометрии, иллюстрирующие временное увеличение популяции микроглии с высоким уровнем CD45 в возрасте от 3 до 9 месяцев у мышей AppNL-G-F. Обратите внимание, что это увеличение резко выражено в меньшей степени у мышей AppNL-G-F;Trem2KO. (C) Количественная оценка средней интенсивности флуоресценции (MFI) CD45 в первичной микроглии, выделенной из мышей AppNL-G-F и AppNL-G-F;Trem2KO в возрасте 3 и 9 месяцев. (D) Репрезентативные конфокальные изображения фосфорилированного рибосомного белка S6 (p-RPS6, Ser235/236) в микроглие, ассоциированной с бляшками, у 9-месячных мышей AppNL-G-F и AppNL-G-F;Trem2KO, окрашенные совместно на Iba1 и Aβ. (E) Количественная оценка интенсивности p-RPS6 на одну клетку микроглии. n = 6–8 мышей в группе. **&lt;em&gt;P &amp;lt; 0.001 по двустороннему непарному t-тесту.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS3-2.jpg\" alt=\"Рис. S3 (продолжение 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S3 (продолжение 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS4.jpg\" alt=\"Дополнительный рисунок 4. (A, B) Различные транскрипционные состояния микроглии, связанные с интенсивностью X04, которая\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Дополнительный рисунок 4. (A, B) Различные транскрипционные состояния микроглии, связанные с интенсивностью X04, которая отражает разную степень нагрузки Aβ у микроглии 9-месячных мышей AppNL-G-F и AppNL-G-F;Trem2KO. (A) Анализ главных компонент (PCA) объемного RNA-seq микроглии, выделенной из 9-месячных мышей AppNL-G-F (X04H, n = 5; X04M, n = 3; X04L, n = 3; X04P, n = 6; X04N, n = 6). (B) PCA объемного RNA-seq микроглии, выделенной из 9-месячных мышей AppNL-G-F;Trem2KO (X04H, n = 3; X04M, n = 3; X04L, n = 3; X04P, n = 5; X04N, n = 5). Стрелка (градиент от синего к светло-синему) обозначает спектр интенсивности X04 от низкого (справа) до высокого (слева). (C) Анализ канонических путей IPA, сравнивающий микроглию X04+ и X04- от 9-месячных мышей AppNL-G-F;Trem2KO. Столбчатая диаграмма отражает топ-20 значительно обогащенных канонических путей в микроглие X04+ (p-значение точного критерия Фишера &amp;lt; 0.05). Обратите внимание, что анаболическая адаптация была полностью утрачена у микроглии с дефицитом TREM2. Пути ранжированы по значимости обогащения, представленной как −log10(P-value).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS5.jpg\" alt=\"Дополнительный рисунок 5. (A) Униформная аппроксимация и проекция многообразий (UMAP) данных scRNA-seq (разрешение 0.2) \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Дополнительный рисунок 5. (A) Униформная аппроксимация и проекция многообразий (UMAP) данных scRNA-seq (разрешение 0.2) выявляет шесть различных кластеров микроглии: гомеостатическая микроглия (HM), микроглия с активированным ответом (ARM), микроглия переходного ответа (TRM), микроглия интерферонового ответа (IRM), цикличная/пролиферирующая микроглия (CPM) (Sala Frigerio et al., 2019) и рибосомальная микроглия (Mancuso et al., 2024), а также один небольшой неаннотированный кластер. (B) Валидация идентичности кластеров с использованием установленных оценок модулей. Графики признаков показывают проекцию генных сигнатур из работы Sala Frigerio et al. (2019), подтверждая согласованность текущей кластеризации с ранее определенными состояниями. Цветовые градиенты представляют рассчитанную оценку модуля для каждой клетки (синий: низкая; красный: высокая). (C) Распределение канонической сигнатуры микроглии, связанной с заболеваниями (DAM). Проекции UMAP (слева) и скрипичные диаграммы (справа) иллюстрируют экспрессию сигнатуры DAM (Chen &amp;amp; Colonna, 2021) в условиях без фагоцитоза (X04-) и с фагоцитозом (X04+). Ось y представляет оценку модуля; ширина скрипки указывает на плотность клеток. (D) Контроль качества кластеризации по условиям X04. Проекции UMAP субкластеров высокого разрешения (разрешение 0.3), разделенные по условиям без фагоцитоза (X04-) и с фагоцитозом (X04+), показывают, что клетки X04+ и X04- занимают разные субкластеры. (E) Скрипичные диаграммы, отображающие оценки модуля DAM для каждого субкластера (разрешение 0.3) в условиях X04- и X04+. Обратите внимание, что оценки DAM сопоставимы между фагоцитарными и нефагоцитарными субкластерами. (F) IPA канонических путей с наивысшим рейтингом, сравнивающий фагоцитарный кластер 1 с нефагоцитарным кластером 6. Красные стрелки подчеркивают индукцию путей синтеза белка и трансляции; синяя стрелка обозначает подавление сигнализации нейровоспаления. (G) IPA канонических путей с наивысшим рейтингом, сравнивающий кластер 2 с преобладанием фагоцитоза с нефагоцитарным кластером 0. Красные стрелки подчеркивают усиление биогенеза рибосом и синтеза белка; желтые стрелки обозначают активацию митохондриального окислительного фосфорилирования. (H) Точечный график GSEA терминов биологических процессов (BP), специфически обогащенных в кластере 2 по сравнению с кластером 0. Цветовой градиент представляет скорректированные P-значения. Дополнительный рисунок 5 (продолжение)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS5-2.jpg\" alt=\"Рис. S5 (продолжение 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S5 (продолжение 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS6.jpg\" alt=\"Дополнительный рисунок 6. (A) Графики генно-концептуальной сети (cnet), отображающие белки с наибольшим дифференциальным\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Дополнительный рисунок 6. (A) Графики генно-концептуальной сети (cnet), отображающие белки с наибольшим дифференциальным изобилием, ассоциированные с терминами Gene Ontology (GO) «Синапс», «Миелиновая оболочка» и «Лизосома». Обратите внимание, что эти белки-грузы специфически обогащены в микроглие Trem2KO по сравнению с контролем AppNL-G-F в возрасте 9 месяцев, что указывает на нарушение деградации поглощенного материала. (B) Репрезентативные конфокальные изображения микроглии, ассоциированной с бляшками, у 9-месячных мышей, совместно окрашенные на PSD95 (постсинаптический маркер), CD68 (лизосомальный маркер) и Iba1. Белые стрелки подчеркивают пунктирные скопления PSD95, заключенные внутри фаголизосом CD68+, что указывает на успешное поглощение груза и его транспортировку в деградационные компартменты. Масштабная шкала: 50 мкм. (C) Репрезентативные конфокальные изображения микроглии, ассоциированной с бляшками, у 9-месячных мышей, совместно окрашенные на vGluT1 (пресинаптический маркер), Iba1 и Aβ. Белые стрелки подчеркивают выраженное внутриклеточное накопление пунктирных скоплений vGluT1 в соме микроглии Trem2KO. Масштабная шкала: 50 мкм. (D) Количественная оценка внутриклеточного накопления груза (vGluT1 и др.) в срезах мозга 9–10-месячных мышей AppNL-G-F и AppNL-G-F;Trem2KO. Цветные точки представляют отдельные ROI; сплошные черные круги и планки погрешностей представляют оценки маргинальных средних (EMM) ± 95% ДИ, полученные из бета-биномиальной обобщенной линейной смешанной модели (GLMM). (n = 5–6 мышей в группе). Парные сравнения выполнялись с использованием метода Дельта. Уровни значимости: *P &amp;lt; 0.05, **P &amp;lt; 0.01, ***P &amp;lt; 0.001, ***&lt;em&gt;P &amp;lt; 0.0001. (E) Репрезентативные конфокальные изображения (MIP, 5 мкм) микроглии, ассоциированной с бляшками, совместно окрашенные на PSD95 (постсинаптический маркер), Iba1 и Aβ. Белые стрелки указывают на крупные (&amp;gt;2 мкм) включения груза, связанные с отростками и заполненные пунктиром PSD95, исходящие из микроглии Trem2KO. Красная стрелка указывает клетку, использованную для построения 3D-поверхности на рисунке 6E. Масштабная шкала: 20 мкм. (F) Репрезентативные конфокальные изображения (MIP, 5 мкм), совместно окрашенные на основной белок миелина (MBP), Iba1 и Aβ. Белые стрелки указывают на включения груза, заполненные MBP, в микроглие Trem2KO. Красная стрелка указывает клетку, использованную для построения 3D-поверхности на рисунке 6H. Масштабная шкала: 20 мкм. (G-H) Дополнительные 3D-рендеры поверхности (Imaris) микроглии, ассоциированной с бляшками, у мышей AppNL-G-F;Trem2KO, подтверждающие морфологию включений груза в виде почкования, содержащих PSD95 (красный, G) или MBP (зеленый, H). Мембрана микроглии визуализирована маджентой (Iba1). Дополнительный рисунок 6 (продолжение)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS6-2.jpg\" alt=\"Рис. S6 (продолжение 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S6 (продолжение 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS7.jpg\" alt=\"Дополнительный рисунок 7. (A) Отрицательный контроль для анализа сближения проксимальных зон (PLA) с TOM20. Репрезентати\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Дополнительный рисунок 7. (A) Отрицательный контроль для анализа сближения проксимальных зон (PLA) с TOM20. Репрезентативные конфокальные изображения микроглии, ассоциированной с бляшками, обработанные параллельно с пропуском первичного антитела к TOM20; отсутствие PLA-сигнала подтверждает специфичность реакции TOM20-PLA. Масштабная шкала: 20 мкм. (B) Репрезентативные конфокальные изображения (z-стек MIP, 4 мкм) микроглии, ассоциированной с бляшками, у 9–10-месячных мышей AppNL-G-F и AppNL-G-F;Trem2KO, окрашенные совместно на TOM20 (митохондрии), Iba1 и FUNCAT (синтез новообразованных белков). Масштабная шкала: 20 мкм. (C) Репрезентативные конфокальные изображения (z-стек MIP, 4 мкм), совместно окрашенные на TREM2, Iba1 и Aβ у обоих генотипов. Белые рамки выделяют специфическую индукцию белка TREM2 в отростках микроглии AppNL-G-F, пространственно совпадающую с местами локального биогенеза митохондрий, показанными на рис. 7E. Масштабная шкала: 20 мкм. (D-E) Репрезентативные изображения и количественная оценка накопления митохондриальной массы относительно близости к бляшкам. Скрипичные диаграммы отображают распределение перекрывания вокселей TOM20 в пределах ROI Iba1+, классифицированных как не связанные с бляшками (NPAM) или связанные с бляшками (PAM). Цветные точки представляют отдельные ROI; сплошные круги и планки погрешностей представляют оценки маргинальных средних (EMM) ± 95% ДИ, полученные из бета-биномиальной обобщенной линейной смешанной модели (GLMM). Линии соединяют парные области в пределах биологических повторностей (n = 5–6 мышей). Парные сравнения выполнялись с использованием метода Дельта. ***P &amp;lt; 0.001, ***&lt;em&gt;P &amp;lt; 0.0001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS8.jpg\" alt=\"Расширенный рисунок 8. (A) Неконтролируемая субкластеризация микроглии человека (разрешение Leiden 0.4) и точечный графи\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Расширенный рисунок 8. (A) Неконтролируемая субкластеризация микроглии человека (разрешение Leiden 0.4) и точечный график генов модулей, определяющий рибосомальный/высокоанаболический субкластер, отличный от высокоэкспрессирующего маркеры DAM субкластера. (B) Оценка модуля стабильного референсного контроля по стадиям Брэака (n.s.), основанная на девяти широко используемых стабильных референсных генах из литературы по нормализации qPCR/RNA-seq: ACTB, TBP, POLR2A, PPIA, HPRT1, YWHAZ, PUM1, CASC3, ELF1. (C) Медиана генов, обнаруженных на ядро по стадиям Брэака (контроль глубины секвенирования; n.s.). (D) Анаболическое распределение на одну клетку по Брэаку. Снижение на уровне донора носит в основном композиционный характер (меньше клеток с высоким анаболизмом) с меньшим компонентом на одну клетку. (E) TREM2 против анаболического счета внутри микроглии с высоким DAM, по стадиям Брэака (Спирмен R). (F) Связь анаболической программы с TREM2 на уровне доноров. Верхний ряд: регрессия в пределах стадий Брэака с частичным коэффициентом Спирмена R (с поправкой на стадию Брэака). Нижний ряд: та же взаимосвязь, объединенная по всем донорам (одиночная регрессия, объединенный Спирмен R). (G) Связь анаболической программы с гомеостатическим модулем на уровне доноров (отрицательный контроль). Верхний ряд: регрессия в пределах стадий Брэака с частичным коэффициентом Спирмена R (с поправкой на стадию Брэака). Нижний ряд: та же взаимосвязь, объединенная по всем донорам (одиночная регрессия, объединенный Спирмен R).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS8-2.jpg\" alt=\"Рис. S8 (продолжение 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S8 (продолжение 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic-fS8-3.jpg\" alt=\"Рис. S8 (продолжение 3)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S8 (продолжение 3)&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-23/a-self-limiting-trem2-dependent-anabolic-program-confers-mic.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;истощение&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;иммунитета&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мозга&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" fo
