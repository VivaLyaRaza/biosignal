ние эндолизосомальных фенотипов между клетками, теперь необходимо более подробно проверить на нейронах человека и млекопитающих. Тем не менее, дальнейшие исследования на SCs должны помочь выявить дополнительные факторы, нарушающие агрегацию плотных секреторных гранул (DCG) и способствующие распространению дефектно агрегированного материала между клетками, а также генетические супрессоры этих фенотипов.&lt;/p&gt;\n&lt;p&gt;Важно отметить, что если патология у пациентов со спорадической БА связана с незначительными дефектами биогенеза DCG, которые прогрессируют и распространяются в течение жизни, относительно тонкая модуляция этих супрессоров на ранних стадиях может стать терапевтическим путем, предотвращающим развитие деменции в более пожилом возрасте.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Экстраполяция выводов с модельных организмов (Drosophila) и клеточных систем на патогенез спорадической болезни Альцгеймера у человека требует дальнейшей клинической проверки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Штаммы Drosophila, использованные в данной рукописи, перечислены в таблице реактивов. Большинство трансгенных линий мух были получены из Стокового центра Drosophila в Блумингтоне (BDSC) и Ресурсного центра Drosophila в Вене (VDRC). Исключения были следующими: dsx-GAL4 (предоставлен С. Гудвином, Оксфорд, Великобритания), ген слияния YFP-Rab11 в эндогенном локусе Rab (предоставлен С. Итоном, Макс Планк, Германия), UAS-Dad (предоставлен Д. Беннеттом, Ливерпульский университет). В случаях, когда линии были созданы и/или использовались в предыдущих исследованиях, это отмечено рядом со стоками в списке ниже: w1118 (предоставлен Л. Партридж, UCL, Великобритания).&lt;/p&gt;\n&lt;p&gt;(напр., Singh et al., 2025): ген-ловушка GFP-mfas (MI11275 GFSTF.2; BDSC 63204)&lt;/p&gt;\n&lt;p&gt;(Nagarkar-Jaiswal et al., 2015; Singh et al., 2025): UAS-CD63-mCherry (Fan et al., 2020): w; GAL80ts; dsx-GAL4 (Fan et al., 2020): w; tub-GAL80ts; dsx-GAL4, GFPmfas (Singh et al., 2025): w; tub-GAL80ts; YFP-Rab11, dsx-GAL4 (Fan et al., 2020):&lt;/p&gt;\n&lt;p&gt;Конструкты UAS-Aβ-wt (BDSC 33769) (Wu et al., 2017) и UAS-Aβ-Iowa (BDSC 33779; Vitruvean) (Chouhan et al., 2016) содержат расщепляемую сигнальную последовательность эндоплазматического ретикулума для их направления в секреторную систему (использовано в Singh et al., 2025): UAS-Aβ-wt был объединен с другими трансгенами для создания w; UAS-Aβ-wt, tub-GAL80ts; dsx-GAL4 и w; UAS-Aβ-wt, tub-GAL80ts; dsx-GAL4, GFP-mfas: UAS-Chmp5-RNAi (P{KK109120}VIE-260B; VDRC 101422; снятый с производства сток) (Dietzl et al., 2007; Marie et al., 2023): UAS-mCherry-RNAi (VALIUM20-mCherry; BDSC 35785)&lt;/p&gt;\n&lt;p&gt;(Duan et al., 2023): UAS-Chmp1-RNAi (P{GD11219}v21788; VDRC 21788) (Dietzl et al., 2007; Marie et al., 2023): UAS-Ist1-RNAi (P{GD11948}:VDRC 22497) (Dietzl et al., 2007; Marie et al., 2023): w; GMR-GAL4 (II) (предоставлен лабораторией Хафена: ETH Цюрих) (Freeman, 1996), GMR-GAL4 (III) (получен в лаборатории Уилсона): GMR-GAL4 (III) был объединен для создания w; UAS-Aβ-wt; GMR GAL4 (III), а GMR-GAL4 (II) использован для получения w; GMR GAL4 (II); UAS-Aβ-Iowa.&lt;/p&gt;\n&lt;p&gt;Мух содержали при температуре 25°C при 12-часовом светотемновом цикле на стандартной кукурузно-агаровой среде [12.5 г агара (F. Gutlind &amp;amp; Co. Ltd), 75 г кукурузной муки (B. T. P. Drewitt), 93 г глюкозы (Sigma-Aldrich, #G7021), 31.5 г инактивированных дрожжей (Fermipan Red, Lallemand Baking), 8.6 г калия-натрия тартрата тетрагидрата (Sigma Aldrich, #S2377), 0.7 г кальция хлорида дигидрата (Sigma-Aldrich, #21907) и 2.5 г нипагина (Sigma-Aldrich, #H5501), растворенных в 12 мл этанола, на один литр]. Их пересаживали на свежий корм каждые 3–4 дня.&lt;/p&gt;\n&lt;p&gt;Для экспериментов с MAG самок мух, несущих драйверную линию tub-GAL80ts; dsx-GAL4 отдельно или в комбинации с GFP-mfas, YFP-Rab11 или UAS CD63-mCherry (в некоторых случаях вместе с UAS-регулируемыми формами Aβ-wt или Aβ-Iowa), скрещивали с самцами, несущими UAS-трансгены или w1118 (контроль), что позволяло осуществлять температурно-зависимую индукцию экспрессии целевых генов, специфичных для SC.&lt;/p&gt;\n&lt;p&gt;Как и в предыдущих исследованиях, для экспериментов с MAG и визуализацией живых тканей девственных самцов потомства собирали после вылупления и переносили при 29°C на 6 дней для активации постэмбриональной экспрессии трансгенов, специфичных для SC.&lt;/p&gt;\n&lt;p&gt;Для экспериментов, в которых мы количественно оценивали GFP-MFAS в главных клетках (MC), что включало визуализацию фиксированной ткани, девственных самцов переносили при 29°C за 24 часа до вылупления, чтобы дать время для накопления РНКи до начала формирования отсеков DCG в SC, а затем содержали при 29°C в течение 6 дней после вылупления.&lt;/p&gt;\n&lt;p&gt;Для экспериментов с анализом глаз Drosophila самок, несущих UAS-РНКи трансгены или контроль w1118, скрещивали с самцами, несущими GMR-GAL4 отдельно или в комбинации с UAS-Aβ-wt или UAS-Aβ-Iowa, для индукции экспрессии целевых генов, специфичных для глаз. Эти скрещивания содержались при 25°C на протяжении всего эксперимента. После вылупления самок отделяли от самцов и выдерживали 2–4 дня при 25°C перед заморозкой и визуализацией.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Температурный контроль (29°C) использовался для активации специфической экспрессии трансгенов в SC и MC, что позволило изучить влияние РНКи и Aβ на морфологию тканей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"podgotovka-mag-dlya-vizualizacii\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#podgotovka-mag-dlya-vizualizacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подготовка MAG для визуализации&lt;/span&gt;&lt;/a&gt;Подготовка MAG для визуализации&lt;/h4&gt;\n&lt;p&gt;Мы использовали адаптацию методологии, описанной Fan et al., 2020, для визуализации живых клеток. Шестидневных взрослых девственных самцов мух анестезировали с помощью CO2, затем погружали в ледяной 1X PBS (Thermo Fisher Scientific). Мужскую репродуктивную систему осторожно извлекали из полости тела через последний сегмент брюшка с помощью микропинцета. Семенники, семенные пузырьки и эякуляторная луковица оставались неповрежденными и прикрепленными к железе, однако жировые ткани и кишечник аккуратно удалялись, чтобы избежать складывания ткани и помех во время визуализации MAG. Затем железы инкубировали с 500 нМ Lysotracker Red (Thermo Fisher Scientific) в PBS в течение 2–5 мин на льду с последующей промывкой ледяным PBS. Ткань затем стабильно монтировали между двумя покровными стеклами (прямоугольное: покровное стекло №1, 22 мм × 50 мм, Fisher, #1237-3128, и круглое: покровное стекло №1, 13 мм, #49492, VWR) в капле 1x PBS, при этом установка удерживалась вместе с помощью изготовленного на заказ металлического держателя. Излишки PBS удаляли фильтровальной бумагой, когда железы были готовы к визуализации, чтобы слегка расплющить образцы.&lt;/p&gt;\n&lt;p&gt;Для конфокального анализа микропрепарирование проводили в PBS при комнатной температуре, после чего образцы фиксировали в 4% параформальдегиде в PBS (Sigma-Aldrich) в течение 20 мин. Затем железы промывали в 1x PBS в течение примерно 5 мин перед монтажом в каплю Vectashield с DAPI (Vector Laboratories) на предметные стекла SuperFrost (VWR). Образцы фиксировали покровным стеклом (22 мм × 22 мм, 0,13–0,17 мм; Fisher).&lt;/p&gt;\n&lt;h4 id=\"okrashivanie-antitelami-fiksirovannoj-tkani\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#okrashivanie-antitelami-fiksirovannoj-tkani\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Окрашивание антителами фиксированной ткани&lt;/span&gt;&lt;/a&gt;Окрашивание антителами фиксированной ткани&lt;/h4&gt;\n&lt;p&gt;Для окрашивания антителами MAG препарировали и фиксировали в 4% параформальдегиде (как описано выше). Фиксированные железы затем пермеабилизировали в течение 6 × 10 мин в PBST (1× PBS, 0,3% Triton X-100 [Sigma-Aldrich]), блокировали в течение 30 мин в PBSTG (PBST, 10% козья сыворотка [Sigma-Aldrich]) и инкубировали в течение ночи при 4°C с мышиными антителами anti-Aβ 6E10 (BioLegend, 39320), разведенными 1:500 в PBSTG. Затем железы промывали 6 × 10 мин в PBST перед инкубацией в течение 2 ч при комнатной температуре с конъюгированными с Cy3 вторичными антителами осла против мыши (The Jackson Laboratory), разведенными 1:500 в PBSTG. Железы дополнительно промывали в PBST в течение 6 × 10 мин перед монтажом в Vectashield без DAPI.&lt;/p&gt;\n&lt;h4 id=\"podgotovka-muh-dlya-vizualizacii-glaz\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#podgotovka-muh-dlya-vizualizacii-glaz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подготовка мух для визуализации глаз&lt;/span&gt;&lt;/a&gt;Подготовка мух для визуализации глаз&lt;/h4&gt;\n&lt;p&gt;Для визуализации взрослых глаз с помощью светового стереомикроскопа самок, полученных из скрещиваний, собирали и выдерживали 2–4 дня при 25°C, после чего анестезировали углекислым газом, переносили в 0,6 мл пробирки Эппендорфа (SLS) и замораживали при -20°C минимум на 24 часа; большинство мух визуализировали в течение одной недели после заморозки. Для визуализации глаз мух располагали так, чтобы они были обращены слева направо, при этом центральная часть глаза была максимально горизонтальна по отношению к объективу.&lt;/p&gt;\n&lt;h4 id=\"vizualizaciya-zhivyh-kletok\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#vizualizaciya-zhivyh-kletok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Визуализация живых клеток&lt;/span&gt;&lt;/a&gt;Визуализация живых клеток&lt;/h4&gt;\n&lt;p&gt;Визуализацию живых клеток проводили при комнатной температуре, в основном следуя методологии, использованной в Singh et al., 2025. Использовался инвертированный широкопольный микроскоп Leica Thunder (Leica) при 100-кратном увеличении (объектив Leica HCX PL FLUOTAR NA 1.3, масляная иммерсия) с камерой K8 sCMOS. На каждый MAG анализировали четыре SC (по две на долю) для ≥10 отдельных девственных самцов. Полученные изображения обычно представляли собой z-стеки глубиной 8–12 мкм с z-шагом 0,2 мкм.&lt;/p&gt;\n&lt;p&gt;Технология Thunder (Leica) с вычислительной очисткой малых объемов (SVCC) применялась для улучшения контраста и устранения размытия вне фокуса. Морфологию SC визуализировали с помощью метода FLURO-Bright Field. Настройки LED были следующими: GFP, возбуждение 475 нм при 40% интенсивности лазера; YFP, возбуждение 510 нм при 42% интенсивности лазера; и RFP, возбуждение 550 нм при 30% интенсивности лазера. Живые MC в центральной области MAG визуализировали аналогичным образом, используя канал светлого поля для идентификации ядер MC в эпителиальном слое.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод SVCC (Small Volume Computational Clearing) — это алгоритм обработки изображений, который удаляет «дымку» (фоновый свет вне фокуса), позволяя получить четкие снимки глубоких слоев ткани без потери качества.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vizualizaciya-fiksirovannyh-kletok\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#vizualizaciya-fiksirovannyh-kletok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Визуализация фиксированных клеток&lt;/span&gt;&lt;/a&gt;Визуализация фиксированных клеток&lt;/h4&gt;\n&lt;p&gt;Фиксированные образцы визуализировали на конфокальном лазерном сканирующем микроскопе Zeiss LSM980 с системой Airyscan 2 Super-resolution, оснащенном объективами 10x (Zeiss 0,45 NA; сухой) и 40x (Zeiss 1,30 NA; масляная иммерсия; иммерсионное масло Zeiss, показатель преломления 1,518).&lt;/p&gt;\n&lt;p&gt;Две доли добавочных желез самцов (MAG) были визуализированы для ≥ 10 отдельных девственных самцов. Изображения основных клеток (MC) и просвета MAG высокого разрешения получали из центральной области каждой доли с использованием объектива 40x с 1-кратным зумом в программном обеспечении ZEN bluesuite (Zeiss), используя GFP (возбуждение 488 нм при интенсивности лазера 2%), DAPI (возбуждение 345 нм при интенсивности лазера 2%) и mCherry (возбуждение 587 нм при интенсивности лазера 2%).&lt;/p&gt;\n&lt;p&gt;Для изображений MC эпителиальный слой идентифицировали с помощью ядерного маркера DAPI, присутствовавшего в среде для заключения Vectashield; для каждой доли ≥ 10 девственных самцов делали один снимок через середину этих ядер. Для изображений просвета выполняли z-суммирование, центрированное вокруг середины просвета MAG для обеих долей MAG от ≥ 10 девственных самцов.&lt;/p&gt;\n&lt;p&gt;Для желез, окрашенных антителами, изображения получали на дистальном кончике каждой доли MAG с использованием объективов 10x и 40x с 1-кратным зумом в программном обеспечении ZEN bluesuite (Zeiss).&lt;/p&gt;\n&lt;h4 id=\"vizualizaciya-glaz\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#vizualizaciya-glaz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Визуализация глаз&lt;/span&gt;&lt;/a&gt;Визуализация глаз&lt;/h4&gt;\n&lt;p&gt;Изображения в светлом поле, использованные для качественного анализа, освещались двумя внешними светодиодами, направленными с обеих сторон глаза. Для получения изображений для количественного анализа использовали длину волны возбуждения GFP и фильтр GFP на камере; это обеспечило лучший контраст омматидиев и границ за счет обнаружения автофлуоресценции в глазах. Изображения захватывались вручную в нескольких z-плоскостях с использованием стереомикроскопа Leica модели MSV269 с насадкой камеры CHROMYX HD при 8-кратном увеличении. Было собрано от 10 до 20 последовательных изображений каждого глаза, которые затем объединялись с помощью Zerene Stacker (Zerene Systems, Ричленд, Вашингтон) для создания композитного изображения каждого глаза. Эта программа использует алгоритм для объединения изображений с разными точками фокусировки в одно изображение с увеличенной глубиной резкости, обеспечивая трехмерный вид глаза.&lt;/p&gt;\n&lt;h4 id=\"analiz-i-parametry\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#analiz-i-parametry\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ и параметры&lt;/span&gt;&lt;/a&gt;Анализ и параметры&lt;/h4&gt;\n&lt;p&gt;Анализ живых SC и MC в MAG проводился с использованием подходов, ранее примененных Singh et al., 2025.&lt;/p&gt;\n&lt;h4 id=\"fenotipy-dcg-i-kolichestvo-zrelyh-kompartmentov\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#fenotipy-dcg-i-kolichestvo-zrelyh-kompartmentov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Фенотипы DCG и количество зрелых компартментов&lt;/span&gt;&lt;/a&gt;Фенотипы DCG и количество зрелых компартментов&lt;/h4&gt;\n&lt;p&gt;Деконволюционные изображения анализировались с помощью Fiji/ImageJ. Каналы объединялись для создания композитных изображений, а количество интактных DCG, отмеченных GFP-MFAS, и компартментов, содержащих DCG, количественно оценивалось вручную с использованием канала светлого поля. Аномальные ядра, включая те, что имели мини-ядра или деформированные ядра, затем подсчитывались вручную. Фенотип мини-/деформированного ядра определялся наличием нескольких маленьких ядер диаметром ≥ 0,5 мкм и/или деформированного ядра. Фенотип мини-ядра регистрировался, если DCG был разделен как минимум на три части диаметром ≥ 0,5 мкм; деформированное ядро регистрировалось, когда отношение длин самой длинной и самой короткой осей DCG составляло &amp;gt; 1,4.&lt;/p&gt;\n&lt;p&gt;Процент мини-/деформированных ядер рассчитывался относительно общего количества DCG в некислых компартментах на одну SC.&lt;/p&gt;\n&lt;p&gt;Для количественной оценки компартментов, отмеченных белком слияния YFP-Rab11, флуоресцентно меченные компартменты исследовали вручную с использованием z-стеков для канала YFP. Доля этих компартментов, содержащих Rab11-положительные пункты, использовалась в качестве меры биогенеза ILV.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анализ DCG и Rab11-положительных компартментов позволяет количественно оценить морфологические аномалии и процессы биогенеза везикул в секреторных клетках.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"acidifikaciya-sekretornyh-kompartmentov\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#acidifikaciya-sekretornyh-kompartmentov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ацидификация секреторных компартментов&lt;/span&gt;&lt;/a&gt;Ацидификация секреторных компартментов&lt;/h4&gt;\n&lt;p&gt;Зрелые (округлые) компартменты DCG, связанные с кислыми структурами и потенциально подвергающиеся лизосомальной деградации (фенотип ацидификации DCG), классифицировались как ацидифицированные компартменты. Эти компартменты проявляют различные фенотипы в зависимости от стадии ацидификации. Некоторые имеют одну периферическую лизосомальную структуру со слегка диффузным GFP-положительным DCG, сохранившим свою форму, в то время как другие имеют полностью диффузный GFP-MFAS и отсутствие очевидной структуры DCG в светлом поле. Некоторые ацидифицированные компартменты имеют несколько кислых структур, расположенных дугой вокруг границы компартмента, с диффузным GFP-MFAS или без него, в то время как другие покрыты ацидифицированными доменами на 80% или более, но сохраняют свою сферическую форму. Процент ацидифицированных компартментов на SC определялся как доля от общего количества как некислых компартментов, содержащих DCG, так и ацидифицированных компартментов на SC.&lt;/p&gt;\n&lt;p&gt;Для расчета площади лизосом использовали инструмент «свободная рука» в Fiji для обводки и измерения площади SC. Инструменты пороговой обработки и анализа частиц использовались для определения площади, положительной по LysoTracker Red, в полной проекции канала RFP. Отношение площади, положительной по LysoTracker Red, к общей площади SC рассчитывалось для каждой SC и выражалось как % площади лизосом.&lt;/p&gt;\n&lt;h4 id=\"ex-vivo-analiz-osnovnyh-kletok,-soderzhashih-gfp-mfas\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#ex-vivo-analiz-osnovnyh-kletok,-soderzhashih-gfp-mfas\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ex vivo анализ основных клеток, содержащих GFP-MFAS&lt;/span&gt;&lt;/a&gt;Ex vivo анализ основных клеток, содержащих GFP-MFAS&lt;/h4&gt;\n&lt;p&gt;Для живых изображений, полученных на дистальном кончике MAG, которые включали одну SC и части окружающих MC, использовали инструмент «Прямоугольник» (700 x 700 пикселей) в Fiji для определения площади поля зрения, а инструмент «свободная рука» — для обводки и измерения площади SC. Впоследствии инструменты пороговой обработки и анализа частиц применялись для измерения площади, покрытой GFP-MFAS в окружающих MC, с использованием полной проекции канала GFP. Процент площади MC, содержащей GFP-MFAS, рассчитывался в пределах поля зрения, исключая площадь SC.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование инструментов ручного выделения и пороговой обработки требует стандартизации, так как результаты могут зависеть от субъективной оценки границ объектов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"analiz-glavnyh-kletok,-soderzhashih-gfp-mfas,-v-fiksirovannoj-tkani\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#analiz-glavnyh-kletok,-soderzhashih-gfp-mfas,-v-fiksirovannoj-tkani\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ главных клеток, содержащих GFP-MFAS, в фиксированной ткани&lt;/span&gt;&lt;/a&gt;Анализ главных клеток, содержащих GFP-MFAS, в фиксированной ткани&lt;/h4&gt;\n&lt;p&gt;С помощью инструмента сетки в ImageJ на изображение главных клеток (MC) для канала GFP-MFAS была наложена сетка из 25 квадратов. В большинстве случаев анализировались центральные квадраты 7, 8 и 9, как описано ниже, с последующим расчетом среднего значения. В тех случаях, когда железа в этих областях была неровной, вместо них выбирались и анализировались квадраты 12, 13, 14, 17, 18 или 19 (из центрального блока девяти квадратов). Эта процедура повторялась для обеих долей каждой добавочной железы самца (MAG), после чего вычислялось среднее значение; для каждого экспериментального условия оценивалось 10 отдельных желез. Размер каждого квадрата составлял 100 x 100 пикселей. Анализ проводился с помощью инструмента частиц, где для квадратов устанавливался порог пикселей ≥ 25 (максимум 255) при постоянной экспозиции. Затем внутри каждого квадрата рассчитывались следующие показатели: количество пунктуатов GFP-MFAS, средний размер каждого пунктуата, общая площадь флуоресценции GFP, % площади, покрытой флуоресценцией GFP, средняя интенсивность GFP-положительных пикселей и интегральная плотность (% площади флуоресценции × средняя интенсивность сигнала флуоресценции). Мы также рассчитали отношение % GFP-положительной площади к количеству пунктуатов, чтобы определить % GFP-положительной площади на пунктат — показатель размера каждой структуры, содержащей аномально агрегированный материал.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анализ GFP-MFAS в главных клетках проводился путем количественной оценки 10 желез на условие с использованием стандартизированной сетки 100x100 пикселей для измерения интенсивности и морфологии агрегатов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"analiz-gfp-mfas-v-prosvete-mag-s-ispolzovaniem-fiksirovannoj-tkani\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#analiz-gfp-mfas-v-prosvete-mag-s-ispolzovaniem-fiksirovannoj-tkani\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ GFP-MFAS в просвете MAG с использованием фиксированной ткани&lt;/span&gt;&lt;/a&gt;Анализ GFP-MFAS в просвете MAG с использованием фиксированной ткани&lt;/h4&gt;\n&lt;p&gt;С помощью прямоугольного инструмента в ImageJ один квадрат (200 x 200 пикселей) выделялся в центральной просветной области середины каждой доли, и средняя интенсивность GFP-MFAS на долю рассчитывалась с использованием функции среднего значения интенсивности ImageJ. Затем это повторялось для другой доли. Для каждого девственного самца мухи рассчитывалось среднее значение этих двух показателей.&lt;/p&gt;\n&lt;h4 id=\"obrabotka-izobrazhenij-i-podgotovka-k-risunkam\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#obrabotka-izobrazhenij-i-podgotovka-k-risunkam\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обработка изображений и подготовка к рисункам&lt;/span&gt;&lt;/a&gt;Обработка изображений и подготовка к рисункам&lt;/h4&gt;\n&lt;p&gt;Изображения живых клеток для данного исследования были подготовлены с использованием деконволюционных стеков, полученных на микроскопе Leica Thunder. На всех представленных рисунках изображения являются однослойными композитами, выбранными из-за оптимального отображения морфологии секреторных клеток (SC). Интенсивность флуоресценции, которая наилучшим образом отражала интересующие фенотипы, была выбрана и использована для обработки изображений по всем данным живых клеток. Для создания изображений, предназначенных для анализа каждого генотипа, показанного на рисунках, применялись согласованная проекция срезов и настройки. Все изображения были обрезаны до идентичных размеров с акцентом на детали SC.&lt;/p&gt;\n&lt;p&gt;Для изображений фиксированных желез MC была получена одна z-плоскость, проходящая через центр ядер MC, с использованием конфокального микроскопа LSM980. Чтобы обеспечить согласованность количественной оценки интенсивности флуоресценции, настройки усиления GFP поддерживались постоянными для всех генотипов.&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"kolichestvennaya-ocenka-i-statisticheskij-analiz\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#kolichestvennaya-ocenka-i-statisticheskij-analiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Количественная оценка и статистический анализ&lt;/span&gt;&lt;/a&gt;Количественная оценка и статистический анализ&lt;/h4&gt;\n&lt;p&gt;Для сравнения нескольких экспериментальных генотипов с контролем мы применяли непараметрический критерий Краскела–Уоллиса с последующим апостериорным критерием множественных сравнений Данна. При сравнении двух групп использовался непараметрический U-критерий Манна–Уитни.&lt;/p&gt;\n&lt;p&gt;Данные статистические анализы выполнялись в программе GraphPad Prism. Все графики, представленные на рисунках, отображают среднее значение для каждого генотипа и включают планки погрешностей, представляющие стандартное отклонение (SD).&lt;/p&gt;\n&lt;h4 id=\"obrabotka-izobrazhenij\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#obrabotka-izobrazhenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обработка изображений&lt;/span&gt;&lt;/a&gt;Обработка изображений&lt;/h4&gt;\n&lt;p&gt;После стекинга с использованием Zerene Stacker составные изображения каждого глаза обрабатывались в FIJI с помощью автоматизированной настройки, использующей различные макросы (см. Приложение 1 для макросов). Весь процесс проиллюстрирован на Рис. S5. В центре глаза выбиралась эллиптическая область размером 576 x 624 пикселя. Плагин Trainable Weka Segmentation для ImageJ был обучен на серии эталонных изображений глаза мухи для обнаружения отдельных омматидиев и определения границ между ними в «нормальных» и дефектных глазах.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-fS5.jpg\" alt=\"Рисунок S5. Вычислительный анализ регулярности омматидиев (связано с рисунком 7)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок S5. Вычислительный анализ регулярности омматидиев (связано с рисунком 7)&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Watershed (водораздел) — это алгоритм сегментации изображений, который разделяет соприкасающиеся объекты, рассматривая яркость пикселей как топографический рельеф, где границы объектов соответствуют «водоразделам».&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Полученная сегментированная карта вероятностей, преобразованная в 8-битный формат, переводилась в бинарный вид, после чего применялось преобразование водораздела (watershed) для идентификации отдельных омматидиев. После обработки встроенная функция FIJI «Analyse Particles» генерировала XY-координаты омматидиев, которые экспортировались в Excel.&lt;/p&gt;\n&lt;h4 id=\"analiz-dannyh\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#analiz-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ данных&lt;/span&gt;&lt;/a&gt;Анализ данных&lt;/h4&gt;\n&lt;p&gt;Методика анализа данных, использованная для расчета регулярности, представлена на Рис. S5. Для каждого омматидия в выбранной области рассчитывался угол до шести ближайших омматидиев. Эти углы суммировались для каждого глаза конкретного генотипа (приблизительно 250 омматидиев на глаз). Для эталонной кривой суммировались углы примерно для 15 самок контрольного генотипа после стандартизации кривой путем установки значения наиболее часто встречающегося угла на ноль для каждого глаза.&lt;/p&gt;\n&lt;p&gt;Кривые для отдельных глаз всех остальных генотипов затем сравнивались с этой эталонной кривой, также после установки значения наиболее часто встречающегося угла на ноль, и рассчитывался коэффициент корреляции Пирсона. Четкие различия изменяли коэффициент корреляции Пирсона относительно эталонной кривой, который затем нормализовался с использованием Z-преобразования Фишера. Преобразование Фишера применялось к корреляциям Пирсона для каждого глаза, создавая нормально распределенные данные для статистического анализа. Преобразованные Z-значения экспортировались в GraphPad Prism, где сравнения проводились с использованием однофакторных тестов Брауна–Форсайта и ANOVA Уэлча с последующими непарными t-критериями с поправкой Уэлча для множественных сравнений.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-fS3.jpg\" alt=\"Рисунок S3. Нокдаун Chmp5, специфичный для SC, может вызывать множественные изменения в эндолизосомальных компартментах,\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок S3. Нокдаун Chmp5, специфичный для SC, может вызывать множественные изменения в эндолизосомальных компартментах, содержащих GFP-MFAS, в MC (связано с рисунком 5)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-fS6.jpg\" alt=\"Рисунок S6. Нокдаун вспомогательных генов ESCRT-III в глазу в целом не влияет на регулярность омматидиев (связано с рису\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок S6. Нокдаун вспомогательных генов ESCRT-III в глазу в целом не влияет на регулярность омматидиев (связано с рисунками 8 и 9)&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"tablicy\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#tablicy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Таблицы&lt;/span&gt;&lt;/a&gt;Таблицы&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 1.&lt;/strong&gt; Реагенты и ресурсы&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Реагент/Ресурс&lt;/th&gt;\n&lt;th&gt;Ссылка или Источник&lt;/th&gt;\n&lt;th&gt;Идентификатор или Каталожный номер&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Экспериментальная модель&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Drosophila&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;w1118&lt;/td&gt;\n&lt;td&gt;Partridge Lab: UCL&lt;/td&gt;\n&lt;td&gt;N/A&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;w1 &lt;td&gt;Mouse anti-Amyloid-β (1-16)&lt;/td&gt;\n&lt;td&gt;Sigma&lt;/td&gt;\n&lt;td&gt;6E10 - 803004&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Donkey anti-mouse&lt;/td&gt;\n&lt;td&gt;Jackson&lt;/td&gt;\n&lt;td&gt;800-367-5296&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Химикаты, ферменты и другие реагенты&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;LysoTrackerTM Red DND-99&lt;/td&gt;\n&lt;td&gt;Thermo Fisher Scientific&lt;/td&gt;\n&lt;td&gt;L7528&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Paraformaldehyde&lt;/td&gt;\n&lt;td&gt;Sigma-Aldrich&lt;/td&gt;\n&lt;td&gt;16005&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Phosphate Buffer Saline (PBS)&lt;/td&gt;\n&lt;td&gt;Thermo Fisher Scientific&lt;/td&gt;\n&lt;td&gt;P4417&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Vectashield with DAPI&lt;/td&gt;\n&lt;td&gt;Vector Laboratories&lt;/td&gt;\n&lt;td&gt;H-1200&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Программное обеспечение&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Zerene Stacker&lt;/td&gt;\n&lt;td&gt;Zerene Systems&lt;/td&gt;\n&lt;td&gt;https://www.zeren esystems.com/cm s/stacker&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Fiji&lt;/td&gt;\n&lt;td&gt;Image J&lt;/td&gt;\n&lt;td&gt;www.imagej.net&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Excel&lt;/td&gt;\n&lt;td&gt;Microsoft&lt;/td&gt;\n&lt;td&gt;https://www.micro soft.com/en- gb/microsoft- 365/excel&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;GraphPad Prism&lt;/td&gt;\n&lt;td&gt;GraphPad&lt;/td&gt;\n&lt;td&gt;https://www.graph pad.com/&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hid
