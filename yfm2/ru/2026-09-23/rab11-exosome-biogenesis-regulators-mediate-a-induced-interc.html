            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"243\" cy=\"117\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"577\" cy=\"166\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как бета-амилоид запускает&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;клеточную цепную реакцию при&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;болезни Альцгеймера&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f1.jpg\" alt=\"Рисунок 1. Экспрессируемый в СК человеческий Aβ индуцирует эндолизосомальные дефекты в эпителиальных клетках в центре до\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Экспрессируемый в СК человеческий Aβ индуцирует эндолизосомальные дефекты в эпителиальных клетках в центре добавочной половой железы (MAG). A. Схематичное изображение экспериментальной стратегии. СК расположены только на дистальном конце MAG, но секретируют GFP-MFAS и другие компоненты компартиментов DCG в просвет железы, откуда они могут эндоцитироваться МК. B-D. Конфокальные изображения поперечных сечений через эпителиальный слой МК в средней части MAG и через просвет MAG (панели на крайнем справа) в MAG 6-дневных самцов, экспрессирующих генную ловушку GFP-mfas и либо никакой другой трансген (B), либо регулируемый UAS Aβ-wt (C), либо Aβ-Iowa (D) специфически в СК. На панели увеличения приведено 3-кратное увеличение. E-H. Гистограммы, показывающие общую % площадь флуоресценции GFP-MFAS в слое МК в центральной части MAG (E), интегрированную интенсивность (площадь, умноженная на среднюю интенсивность флуоресценции GFP в МК) (F), среднюю % площадь отдельных компартиментов/пунктов МК, меченных GFP-MFAS (G), и среднюю интенсивность флуоресценции GFP-MFAS в просвете MAG (H). Обратите внимание, что специфичная для СК экспрессия Aβ-wt и Aβ-Iowa индуцирует более крупные структуры, содержащие GFP-MFAS, внутри МК, причем Aβ-Iowa также значительно увеличивает общую площадь, содержащую GFP-MFAS, и интегрированную интенсивность внутри МК.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;При болезни Альцгеймера в мозге накапливаются бета-амилоидные бляшки, но ранние повреждения клеток начинаются внутри них. Исследователи обнаружили, что токсичные сигналы передаются от клетки к клетке через особые пузырьки — экзосомы. Когда ученые заблокировали ключевой белок этого процесса, каскад разрушений остановился. Это открывает неожиданный взгляд на то, как именно болезнь захватывает новые ткани.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Бета-амилоид нарушает эндолизосомальный транспорт и передается между клетками.&lt;/li&gt;\n&lt;li&gt;Белок Chmp5 и комплекс ESCRT-III отвечают за упаковку и экспорт таких сигналов.&lt;/li&gt;\n&lt;li&gt;Подавление пути Rab11-экзосом останавливает нейродегенерацию у дрозофилы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Болезнь Альцгеймера традиционно связывают с внеклеточными бляшками бета-амилоида (Aβ) и внутриклеточными нейрофибриллярными клубочками. Однако задолго до массовой гибели нейронов страдают эндолизосомальные пути, отвечающие за внутриклеточный транспорт и деградацию молекул. Ранее было показано на вторичных клетках (SCs) дрозофилы, что Aβ нарушает нормальное формирование плотных секреторных гранул (DCGs) и запускает дефекты, передающиеся соседям.&lt;/p&gt;\n&lt;p&gt;В новой работе авторы проверили, какую роль в этой передаче играют компоненты эндосомального комплекса, сортирующего белки (ESCRT). Оказалось, что подавление экспрессии гена Chmp5, вспомогательного белка ESCRT-III, который управляет образованием интралюминальных везикул внутри DCG с последующим выходом в виде Rab11-экзосом, полностью блокирует межклеточное распространение дефектов эндолизосомального транспорта.&lt;/p&gt;\n&lt;p&gt;Более того, снижение активности Chmp5 и других генов ESCRT-III в клетках глаза дрозофилы предотвращало морфологические нарушения, зависимые от нейродегенерации. Полученные данные доказывают, что путь биогенеза Rab11-экзосом связывает амилоидную патологию с гибелью клеток, создавая потенциальную мишень для будущих терапевтических стратегий.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа выполнена на модели неигровых и глагольных клеток дрозофилы, поэтому механизмы еще нужно подтвердить на млекопитающих.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Болезнь Альцгеймера (БА) характеризуется двумя гистопатологическими признаками: внутриклеточными тау-содержащими нейрофибриллярными клубочками и внеклеточными амилоидными бляшками, содержащими β-амилоид (Aβ), специфический продукт расщепления предшественника амилоидного белка (APP). Однако предполагается, что запуск индуцированной Aβ нейрональной патологии включает внутриклеточные события, затрагивающие эндолизосомальный трафик, которые могут передаваться между клетками.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эндолизосомальный трафик — это внутриклеточная транспортная система, которая перемещает молекулы между эндосомами (пузырьками для сортировки грузов) и лизосомами (органеллами для их переработки).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Недавние исследования на ненейрональных вторичных клетках (SC) Drosophila показали, что Aβ вмешивается в регулируемые APP события агрегации белков, которые упаковывают сигнальные молекулы в нерастворимые гранулы с плотным ядром (DCG) в ходе нормальной регулируемой секреции, вызывая эндолизосомальные дефекты, которые передаются в другие клетки.&lt;/p&gt;\n&lt;p&gt;Здесь, используя SC, мы показываем, что нокаут гена, кодирующего вспомогательный белок ESCRT-III Chmp5, который избирательно регулирует формирование интралюминальных везикул (ILV) внутри компартментов DCG SC, впоследствии высвобождаемых в виде Rab11-экзосом, ингибирует распространение вызванных Aβ дефектов эндолизосомального трафика.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Данное исследование выполнено на модельных организмах (Drosophila), поэтому для подтверждения роли этих механизмов у людей необходимы дополнительные клинические исследования.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Более того, нокаут Chmp5 или других вспомогательных генов ESCRT-III также подавляет индуцированные Aβ, зависящие от нейродегенерации морфологические дефекты в глазу Drosophila.&lt;/p&gt;\n&lt;p&gt;Мы заключаем, что гены, контролирующие путь биогенеза Rab11-экзосом, играют ключевую роль как в вызванных Aβ дефектах эндолизосомального трафика, связанных с аберрантной регулируемой секрецией, так и в клеточных событиях, ведущих к нейродегенерации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Подавление экспрессии Chmp5 блокирует передачу эндолизосомальных дефектов, индуцированных Aβ, и уменьшает нейродегенеративные изменения, связывая секреторные нарушения с гибелью клеток.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Наши результаты показывают, что эти процессы связаны между собой, и могут указать новые целевые пути для будущей разработки терапевтических средств против БА.&lt;/p&gt;\n&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Болезнь Альцгеймера (БА) является основной причиной деменции во всем мире, и, по прогнозам, к 2050 году она затронет более 100 миллионов человек. Внутриклеточные нейрофибриллярные клубки, содержащие гиперфосфорилированный тау-белок, и внеклеточные амилоидные бляшки, состоящие из Aβ-пептидов — специфических продуктов расщепления предшественника амилоида (APP), представляют собой ключевые гистопатологические признаки БА. Тем не менее, остаются значительные споры относительно клеточно-биологических триггеров, запускающих дегенерацию.&lt;/p&gt;\n&lt;p&gt;Одна привлекательная модель, «гипотеза пробки на дорогах», постулирует, что дефекты трафика в эндосомальной и лизосомальной системах приводят к накоплению внутриклеточных компартментов, содержащих Aβ, который не подвергается деградации. Этот эндолизосомальный фенотип может передаваться другим клеткам и является инициирующим шагом в нарушении синаптического транспорта, структуры и целостности.&lt;/p&gt;\n&lt;p&gt;Гиперфосфорилированный тау-белок, связанный с нейрофибриллярными клубками, по-видимому, взаимодействует с Aβ и патологическими олигомерами Aβ посредством механизмов, опосредованных эндолизосомами, что предполагает одно из возможных объяснений функциональной связи тау и Aβ при заболевании. Однако до недавнего времени оставался нерешенным вопрос о том, могут ли эндолизосомальные дефекты, связанные с БА, отражать нарушение специфического процесса транспорта, вовлеченного в нормальный процессинг APP.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование функций APP в вторичных клетках Drosophila помогло впервые визуализировать динамические процессы созревания и контроля качества в регулируемой секреции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Регулируемая секреция — это процесс, при котором клетки запасают секретируемые вещества в специальных гранулах и высвобождают их в ответ на определенные сигналы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Недавно мы изучили функции APP во вторичных клетках (СК) Drosophila, которые представляют собой простатоподобные клетки мужской добавочной железы (MAG), содержащие сильно увеличенные секреторные и лизосомальные компартменты. В этих клетках впервые были визуализированы динамические события внутри компартментов, сопровождающие этапы созревания и контроля качества при регулируемой секреции. В клетках высших организмов белки, предназначенные для секреции, агрегируют в гранулы с плотным центром (DCG) внутри компартментов регулируемой секреции. Они рассеиваются только тогда, когда компартменты сливаются с плазматической мембраной, или когда дефектные компартменты направляются на лизосомальную деградацию в процессах, совместно называемых кринофагией. Во СК ортолог трансмембранного APP у Drosophila, APPL, необходим для стимуляции нормальной агрегации белков DCG. Затем он должен расщепляться, вероятно, β-секретазой, которая осуществляет первое расщепление, необходимое для генерации Aβ, чтобы отделить агрегаты DCG от ограничивающей мембраны компартмента. Функции APPL в регулируемой секреции могут быть замещены человеческим APP, что указывает на эволюционно консервативную роль в этом процессе.&lt;/p&gt;\n&lt;p&gt;Когда в секреторном пути СК экспрессируются либо дикий тип Aβ, либо амилогенные мутантные формы Aβ, связанные с ранней семейной формой БА, процессинг APP нарушается, DCG формируются ненормально, и больше компартментов направляется на лизосомальную деградацию. Однако это нацеливание является аберрантным, и частично деградированные компартменты накапливаются внутри СК, вызывая дефект эндолизосомального трафика. Более того, содержимое этих аномальных компартментов, по-видимому, секретируется и накапливается внутри эндолизосом других соседних клеток, не экспрессирующих Aβ, которые эндоцитируют их, распространяя эндолизосомальный фенотип. Эти данные предполагают, что индуцированные Aβ эндолизосомальные патологии при БА могут быть результатом аберрантной регулируемой секреции, что подтверждается ин силико анализом генов человека, связанных с БА.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Большинство выводов о распространении эндолизосомальных дефектов получено на моделях Drosophila, что требует осторожности при прямой экстраполяции на патогенез болезни Альцгеймера у человека.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Созревание компартментов регулируемой секреции требует перехода компартментов, образующихся из транс-аппарата Гольджи (TGN), в идентичность рециклирующих эндосом, что можно отследить по последовательному приобретению маркера рециклирующих эндосом Rab11. Компартменты регулируемой секреции в СК генерируют интралюминальные везикулы (ILV) — процесс, который также представляется консервативным в компартментах DCG человека, и эти везикулы секретируются в виде специализированных Rab11-экзосом.&lt;/p&gt;\n&lt;p&gt;Предыдущие исследования показали, что APPL транспортируется к этим ILV и что нокдаун генов, кодирующих специфические компоненты четырех комплексов ESCRT (Endosomal Sorting Complex Required for Transport), регулирующих биогенез ILV, нарушает формирование DCG в СК.&lt;/p&gt;\n&lt;p&gt;Более того, перенос Aβ и его олигомеров из нейронов в другие клетки, включая другие нейроны, по-видимому, включает экзосомы.&lt;/p&gt;\n&lt;p&gt;Поэтому мы предположили, что Rab11-экзосомы могут участвовать в распространении индуцированных Aβ дефектов эндолизосомального трафика между клетками.&lt;/p&gt;\n&lt;p&gt;Здесь мы показываем, что эндолизосомальные дефекты, индуцированные СК, экспрессирующими Aβ, распространяются по всем эпителиальным клеткам MAG. Нокдаун Chmp5, кодирующего вспомогательный белок ESCRT-III, который избирательно регулирует образование Rab11-экзосом, сильно подавляет это распространение. Нокдаун Chmp5 и других вспомогательных генов ESCRT-III также подавляет морфологические дефекты, связанные с нейродегенерацией, индуцированные экспрессией Aβ в глазу мухи. Таким образом, наши результаты показывают, что дефекты эндолизосомального трафика, вызванные индуцированным Aβ нарушением регулируемой секреции, могут играть важную роль в дегенерации, связанной с БА, и что их можно смягчить путем ингибирования аппарата биогенеза Rab11-экзосом.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"ekspressiruemyj-sekretornymi-kletkami-chelovecheskij-ab-induciruet-endolizosomalnye-defekty-v-epitelialnyh-kletkah-na-protyazhenii-vsej-mpzh\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#ekspressiruemyj-sekretornymi-kletkami-chelovecheskij-ab-induciruet-endolizosomalnye-defekty-v-epitelialnyh-kletkah-na-protyazhenii-vsej-mpzh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Экспрессируемый секреторными клетками человеческий Aβ индуцирует эндолизосомальные дефекты в эпителиальных клетках на протяжении всей МПЖ&lt;/span&gt;&lt;/a&gt;Экспрессируемый секреторными клетками человеческий Aβ индуцирует эндолизосомальные дефекты в эпителиальных клетках на протяжении всей МПЖ&lt;/h4&gt;\n&lt;p&gt;Ранее мы показали, что меченная GFP форма белка DCG MFAS — ортолог млекопитающего белка внеклеточного матрикса TGF-β-induced (TGFBI) из плодовой мушки, экспрессируемый с эндогенного локуса гена, избирательно вырабатывается в высоких уровнях в секреторных клетках (СК) и упаковывается в DCG СК (Singh et al., 2025). Когда Aβ экспрессируется примерно в 40 СК на дистальном конце каждой лопасти двулопастной МПЖ, поглощение секретированного GFP-MFAS в соседние главные клетки (ГК) усиливается, и GFP накапливается в увеличенных эндолизосомальных компартментах, которые окрашиваются LysoTracker Red (Singh et al., 2025). Это предполагает, что данные компартменты не могут нормально расщеплять эндоцитированные белки DCG и имеют более высокий люминальный pH, из-за чего флуоресценция GFP не полностью гасится.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Лизосомальный краситель LysoTracker Red и белковые метки вроде GFP помогают отслеживать дефекты кислой среды внутри клеток, когда органеллы теряют способность нормально переваривать молекулы.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Наш первоначальный анализ индуцированных Aβ эндолизосомальных дефектов ГК ограничивался клетками, непосредственно примыкающими к СК. Для этих ГК эндоцитированный GFP-MFAS, высвобожденный СК, мог либо секретироваться в просвет МПЖ, либо переноситься между клетками через их латеральные мембраны. Чтобы подтвердить, что за фенотип распространения отвечает люминальный GFP-MFAS, мы исследовали поглощение GFP-MFAS эпителиальными клетками на протяжении всей МПЖ. Сабцов мух получали с экспрессией в взрослых СК либо дикого типа Aβ (Aβ-wt), либо амилоидогенного мутанта Aβ-Iowa (Grabowski et al., 2001), слитного с расщепляемой N-концевой сигнальной последовательностью ЭР для направления в секреторный путь (Chouhan et al., 2016; Metsla et al., 2022; Singh et al., 2025). Экспрессию исключительно в СК МПЖ только у взрослых особей достигали с помощью активации dsx-GAL4 трансгенов под регуляцией UAS в присутствии термочувствительного ингибитора GAL4, GAL80ts, перенося мух с 25oC на 29oC при вылуплении, что дестабилизирует GAL80ts (Fan et al., 2020).&lt;/p&gt;\n&lt;p&gt;Как сообщалось ранее (Singh et al., 2025), экспрессия Aβ влияла на биогенез DCG и эндолизосомальный трафик в СК, что приводило к усилению накопления частично подкисленных компартментов и лизосом, а в случае Aβ-Iowa — к частой неполной агрегации белков в крупный DCG (Рис. S1A-C). Анализ эпителиального слоя ГК в центральной части препарированных ex vivo МПЖ (Рис. 1A) показал, что экспрессия изоформ Aβ в СК увеличивала размер кислых компартментов ГК и, особенно для Aβ-Iowa, приводила к накоплению большего количества GFP-MFAS внутри этих увеличенных компартментов (Рис. S1D-F). Это отражало наши предыдущие результаты для дистальной части МПЖ и предполагало, что эндолизосомальные дефекты распространяются по всей железе.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-fS1.jpg\" alt=\"Рисунок S1. Экспрессия Aβ в SC вызывает дефекты в эндолизосомах MC (связано с рисунком 1)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок S1. Экспрессия Aβ в SC вызывает дефекты в эндолизосомах MC (связано с рисунком 1)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f1.jpg\" alt=\"Рисунок 1. Экспрессируемый в СК человеческий Aβ индуцирует эндолизосомальные дефекты в эпителиальных клетках в центре до\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Экспрессируемый в СК человеческий Aβ индуцирует эндолизосомальные дефекты в эпителиальных клетках в центре добавочной половой железы (MAG). A. Схематичное изображение экспериментальной стратегии. СК расположены только на дистальном конце MAG, но секретируют GFP-MFAS и другие компоненты компартиментов DCG в просвет железы, откуда они могут эндоцитироваться МК. B-D. Конфокальные изображения поперечных сечений через эпителиальный слой МК в средней части MAG и через просвет MAG (панели на крайнем справа) в MAG 6-дневных самцов, экспрессирующих генную ловушку GFP-mfas и либо никакой другой трансген (B), либо регулируемый UAS Aβ-wt (C), либо Aβ-Iowa (D) специфически в СК. На панели увеличения приведено 3-кратное увеличение. E-H. Гистограммы, показывающие общую % площадь флуоресценции GFP-MFAS в слое МК в центральной части MAG (E), интегрированную интенсивность (площадь, умноженная на среднюю интенсивность флуоресценции GFP в МК) (F), среднюю % площадь отдельных компартиментов/пунктов МК, меченных GFP-MFAS (G), и среднюю интенсивность флуоресценции GFP-MFAS в просвете MAG (H). Обратите внимание, что специфичная для СК экспрессия Aβ-wt и Aβ-Iowa индуцирует более крупные структуры, содержащие GFP-MFAS, внутри МК, причем Aβ-Iowa также значительно увеличивает общую площадь, содержащую GFP-MFAS, и интегрированную интенсивность внутри МК.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Экспрессия Aβ в секреторных клетках приводит к увеличению эндолизосомальных компартментов и накоплению GFP-MFAS в главных клетках на всем протяжении добавочной половой железы.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для обеспечения рутинного количественного анализа этих изменений мы фиксировали МПЖ от самцов, экспрессирующих GFP-MFAS, окрашивали их DAPI для обнаружения тонкого плоского эпителиального слоя ГК и визуализировали распределение GFP с помощью конфокальной микроскопии (Рис. 1A). Это выявило повышенное поглощение GFP-MFAS ГК в центральной и проксимальной областях МПЖ у 6-дневных самцов, когда дистальные СК экспрессировали Aβ-wt и Aβ-Iowa по сравнению с контролями без экспрессии (Рис. 1B-D; Рис. S2A-C).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-fS2.jpg\" alt=\"Рисунок S2. Экспрессируемые в SC изоформы Aβ человека вызывают дефекты эндолизосом в эпителиальных клетках MAG (связано \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок S2. Экспрессируемые в SC изоформы Aβ человека вызывают дефекты эндолизосом в эпителиальных клетках MAG (связано с рисунком 1)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Эндоцитированный GFP-MFAS, локализованный в средней части МПЖ, количественно оценивали путем измерения общей площади в % с флуоресценцией GFP в поперечном сечении эпителиальных ГК, идентифицированных по окрашиванию их ядер, интегрированной плотности (% площади × средняя интенсивность сигнала флуоресценции) и средней площади в % для каждой внутриклеточной области, содержащей GFP-MFAS. Все три параметра были достоверно увеличены по сравнению с контролями, когда СК экспрессировали Aβ-Iowa (Рис. 1E-G). Для МПЖ, в которых в СК экспрессировался Aβ-wt, также наблюдалось четкое увеличение средней площади в % каждой области, содержащей GFP-MFAS (Рис. 1G); для многих, но не всех желез, общая площадь флуоресценции в % и интегрированная интенсивность также казались увеличенными относительно средних контрольных значений (Рис. 1E и 1F), хотя из-за большей вариабельности ни одно из этих изменений не достигло значимости. Для обоих генотипов Aβ по сравнению с контролем количество структур ГК, содержащих GFP, и средняя интенсивность флуоресцентного сигнала либо не изменились, либо, в случае Aβ-Iowa, слегка увеличились для интенсивности флуоресценции (Рис. S2D и S2E). В целом эти данные подтверждают, что экспрессия Aβ в СК индуцирует расширение эндолизосомальных компартментов ГК, которые накапливают меченый груз DCG СК — GFP-MFAS.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Выводы основаны на модельных организмах (Drosophila melanogaster), поэтому степень прямого переноса механизмов на патологию человека требует дополнительных исследований.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Центральная область просвета МПЖ также визуализировалась в этих различных генетических фондовых линиях, а уровни флуоресценции секретированного GFP-MFAS измерялись с использованием протокола, модифицированного по Singh et al. (2025) (Рис. 1A-D и 1H). Для Aβ-wt и Aβ-Iowa наблюдались более вариабельные уровни флуоресценции, чем для контролей; некоторые железы содержали высокие уровни GFP-MFAS, как мы сообщали ранее (Singh et al., 2025); однако в целом не было значительного увеличения секреции, измеренной с помощью этого анализа (Рис. 1H), что исключает повышенную секрецию как объяснение эндолизосомальных изменений в ГК.&lt;/p&gt;\n&lt;p&gt;Чтобы подтвердить, что секреция GFP-MFAS из СК необходима для индуцированного Aβ переноса в ГК, мы совместно экспрессировали Dad — отрицательный регулятор транскрипции сигнализации BMP — в СК либо с Aβ-wt, либо с мутантом Aβ-Iowa (Рис. 2). Аутокринная сигнализация BMP стимулирует люминальную секрецию СК, и это подавляется Dad (Corrigan et al., 2014; Redhai et al., 2016). Ни один взрослый самец, экспрессирующий одновременно Aβ-wt и Dad, не вылупился, предположительно из-за неспецифической экспрессии в ходе развития под контролем системы dsx-GAL4/GAL80ts, приводящей к синтетической летальности. Тем не менее экспрессия Dad в СК, экспрессирующих Aβ-Iowa, снижала уровни GFP-MFAS в просвете МПЖ и резко уменьшала поглощение этого белка слияния в ГК (Рис. 2).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f2.jpg\" alt=\"Рисунок 2. Индуцированное Aβ-Iowa поглощение GFP-MFAS клетками МК зависит от стимулирующей секрецию BMP-сигнализации в С\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2. Индуцированное Aβ-Iowa поглощение GFP-MFAS клетками МК зависит от стимулирующей секрецию BMP-сигнализации в СК. A, B. Конфокальные изображения, показывающие накопление GFP-MFAS в слое МК и в просвете MAG желез, в которых СК экспрессируют Aβ-Iowa в присутствии (B) или отсутствии (A) оверэкспрессированного Dad. Обратите внимание на существенное снижение секреции и GFP-MFAS в МК при экспрессии Dad. C-F. Гистограммы, показывающие общую % площадь флуоресценции GFP-MFAS в слое МК в центральной части MAG (C), интегрированную интенсивность флуоресценции МК (D), среднюю % площадь отдельных компартиментов МК, меченных GFP-MFAS (E), и среднюю интенсивность флуоресценции GFP-MFAS в просвете MAG (F).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Подводя итог, наши данные убедительно подтверждают гипотезу о том, что MC эндоцитируют белки DCG, секретируемые SC, причем этот процесс поглощения усиливается и/или его деградация подавляется, когда SC экспрессируют дикий тип или амилоидогенный мутантный Aβ. Это приводит к увеличению эндолизосомальных компартментов MC, которые содержат повышенные уровни недеградированного флуоресцентного GFP-MFAS, не подвергающегося тушению, вероятно, из-за повышенного pH в этих дефектных компартментах.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Экспрессия Aβ в SC приводит к эндоцитозу измененных белков DCG клетками MC и увеличению их эндолизосомальных компартментов с повышенным pH.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"izoformy-ab-integriruyutsya-v-dcg-v-sozrevayushih-kompartmentah-dcg\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#izoformy-ab-integriruyutsya-v-dcg-v-sozrevayushih-kompartmentah-dcg\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Изоформы Aβ интегрируются в DCG в созревающих компартментах DCG&lt;/span&gt;&lt;/a&gt;Изоформы Aβ интегрируются в DCG в созревающих компартментах DCG&lt;/h4&gt;\n&lt;p&gt;Влияние экспрессии Aβ в SC на перенос GFP-MFAS и распространение эндолизосомальных дефектов на MC согласуется с нашими предыдущими наблюдениями: Aβ влияет на агрегацию GFP-MFAS и, предположительно, других секретируемых белков DCG в SC, потенциально через аберрантные взаимодействия мембрана-агрегат, что усиливает поглощение этих белков клетками MC после секреции.&lt;/p&gt;\n&lt;p&gt;Чтобы исследовать, встраиваются ли пептиды Aβ непосредственно в DCG, мы использовали ранее валидированное антитело к этим пептидам — 6E10. Это антитело перекрестно реагирует с человеческими пептидами Aβ и APP, но не с Drosophila APPL.&lt;/p&gt;\n&lt;p&gt;Антитело давало высокий уровень фонового окрашивания вокруг мышечной капсулы MAG (Рис. 3A), что затрудняло оценку локализации Aβ в тонком слое MC. Тем не менее, как Aβ-wt, так и Aβ-Iowa сильно колокализовались с большинством GFP-MFAS-положительных DCG внутри SC, хотя интенсивность окрашивания антителами заметно варьировала между различными DCG (Рис. 3).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f3.jpg\" alt=\"Рисунок 3. Экспрессируемые в СК Aβ-wt и Aβ-Iowa локализуются в DCG. A-C. Конфокальные изображения дистальных частей MAG \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3. Экспрессируемые в СК Aβ-wt и Aβ-Iowa локализуются в DCG. A-C. Конфокальные изображения дистальных частей MAG дикого типа (A) и MAG, несущих генную ловушку GFP-mfas и экспрессирующих либо Aβ-wt (B), либо Aβ-Iowa (C) в СК, которые были иммуноокрашены антителом, перекрестно реагирующим с эпитопом человеческого Aβ. Обратите внимание, что в целом окрашивание на Aβ наблюдается почти во всех компартиментах DCG СК и перекрывается с DCG, меченными GFP-MFAS (белые стрелки), хотя уровень флуоресценции более вариабелен, чем для GFP. Антитело против Aβ также неспецифично перекрестно реагирует со структурами в периферическом мышечном слое даже в MAG, которые не экспрессируют Aβ (красная стрелка). Примеры СК обведены белым пунктирным кругом. Белые квадраты отмечают положения областей увеличения. Масштабные шкалы: 30 мкм, 10 мкм и 5 мкм для изображений с большим увеличением (увеличение в 3 и 6 раз соответственно).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Мы заключаем, что Aβ, экспрессируемый в SC, включается в DCG и изменяет созревание компартментов DCG. При секреции этими клетками эффекты Aβ на белок DCG MFAS сохраняются или восстанавливаются в просвете MAG, в результате чего MFAS аномально эндоцитируется клетками MC, нарушая их эндолизосомальный трафик.&lt;/p&gt;\n&lt;h4 id=\"ekzosomy-sc-endocitiruyutsya-kletkami-mc-vmeste-s-belkami-dcg\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#ekzosomy-sc-endocitiruyutsya-kletkami-mc-vmeste-s-belkami-dcg\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Экзосомы SC эндоцитируются клетками MC вместе с белками DCG&lt;/span&gt;&lt;/a&gt;Экзосомы SC эндоцитируются клетками MC вместе с белками DCG&lt;/h4&gt;\n&lt;p&gt;Компартменты DCG в SC также генерируют внутрипросветные везикулы (ILV), которые секретируются в просвет MAG в виде Rab11-экзосом. Мы исследовали, эндоцитируются ли эти экзосомы клетками MC и зависит ли этот процесс от экспрессии Aβ в SC. Мы совместно экспрессировали меченную mCherry форму маркера экзосом человека CD63, который метит Rab11-экзосомы, в SC, экспрессирующих GFP-MFAS, чтобы мы могли легко идентифицировать компартменты, содержащие GFP-MFAS, а также эндоцитированные экзосомы в MC. Нам не удалось получить самцов, у которых одновременно экспрессировались бы GFP-MFAS, CD63-mCherry и трансгены Aβ-Iowa, находящиеся на одной хромосоме с dsx-GAL4. Тем не менее, CD63-mCherry локализовался внутри MC как в контрольных MAG, так и в MAG с экспрессирующими Aβ-wt SC, часто колокализуясь с GFP-MFAS (Рис. 4).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f4.jpg\" alt=\"Рисунок 4. Экзосомы Rab11 СК также эндоцитируются клетками МК. A, B. Конфокальные изображения центральных областей MAG о\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4. Экзосомы Rab11 СК также эндоцитируются клетками МК. A, B. Конфокальные изображения центральных областей MAG от самцов, несущих генную ловушку GFP-mfas и экспрессирующих CD63-mCherry в СК, либо без другого трансгена (A), либо вместе с Aβ-wt (B). Обратите внимание, что CD63-mCherry эндоцитируется МК при обоих условиях и большая его часть колокализуется с GFP-MFAS (стрелки) или находится в непосредственной близости. Сигнал GFP-MFAS более диффузен, когда СК экспрессируют Aβ-wt (см. также рисунки 1 и S1D-F), и это отражается на распределении CD63-mCherry, что согласуется с локализацией в более крупных эндолизосомах. Белые квадраты отмечают положения областей увеличения. Масштабные шкалы: 30 мкм и 10 мкм для изображений с большим увеличением (увеличением).&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Экзосомы — это микроскопические пузырьки, выделяемые клетками для межклеточной коммуникации, а их маркер CD63 помогает отслеживать их путь в организме.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Более того, как и в случае сигнала GFP-MFAS (Рис. 1B-D и С1D-F), экспрессия Aβ-wt приводила к более диффузному распределению CD63-mCherry в MC, что согласуется с увеличением эндолизосомальных компартментов в этих клетках. Таким образом, эндоцитоз экзосом происходящих из SC в клетки MC сопровождает GFP-MFAS. Это происходит в MAG дикого типа, а также в MAG, в которых эндолизосомы MC были нарушены экспрессией Aβ, специфичной для SC.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдаемые нарушения эндолизосомального транспорта получены на моделях дрозофилы, что требует осторожности при прямой экстраполяции на патологию человека.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ingibirovanie-ekspressii-regulyatora-biogeneza-rab11-ekzosom-chmp5-v-sc-podavlyaet-inducirovannoe-ab-rasprostranenie-endolizosomalnyh-defektov-v-mc\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#ingibirovanie-ekspressii-regulyatora-biogeneza-rab11-ekzosom-chmp5-v-sc-podavlyaet-inducirovannoe-ab-rasprostranenie-endolizosomalnyh-defektov-v-mc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ингибирование экспрессии регулятора биогенеза Rab11-экзосом Chmp5 в SC подавляет индуцированное Aβ распространение эндолизосомальных дефектов в MC&lt;/span&gt;&lt;/a&gt;Ингибирование экспрессии регулятора биогенеза Rab11-экзосом Chmp5 в SC подавляет индуцированное Aβ распространение эндолизосомальных дефектов в MC&lt;/h4&gt;\n&lt;p&gt;Наш предыдущий анализ показал, что экспрессия Aβ в SC подавляет диссоциацию агрегированных белков DCG от мембран — важный этап нормального созревания DCG, и что в результате дефектные компартменты DCG не могут нормально транспортироваться в лизосомы и аберрантно секретируются. ILV в компартментах DCG ассоциированы с DCG как во время, так и после процесса созревания компартмента. Действительно, эти ILV, по-видимому, играют роль в биогенезе DCG. Мы предположили, что Rab11-экзосомы могут способствовать индуцированным Aβ дефектам эндолизосомального транспорта в MC, поскольку стабилизированные взаимодействия между мембранами и агрегатами белков, содержащих GFP-MFAS, в SC, экспрессирующих Aβ, могут сохраняться вне этих клеток.&lt;/p&gt;\n&lt;p&gt;Чтобы проверить это, мы ингибировали биогенез Rab11-экзосом в SC в присутствии и в отсутствие Aβ-пептидов. Биогенез ILV в компартментах DCG контролируется ключевыми компонентами четырех комплексов ESCRT, которые также могут генерировать экзосомы поздних эндосом; однако ранее мы показали на клетках мухи и человека, что дополнительные белки ESCRT-III избирательно участвуют в формировании Rab11-экзосом, в отличие от биогенеза экзосом в поздних эндосомах.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нокдаун Chmp5 в SC резко снижает поглощение GFP-MFAS клетками MC, независимо от экспрессии Aβ, что указывает на ключевую роль Rab11-экзосом в межклеточном переносе компонентов DCG.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нокдаун генов, кодирующих эти белки, подавляет образование ILV в компартментах DCG, но не оказывает заметного влияния на ILV-зависимую деградацию убиквитинированных белков в поздних эндосомах и лизосомах, в отличие от нокдауна основных компонентов ESCRT.&lt;/p&gt;\n&lt;p&gt;Поэтому мы оценили перенос GFP-MFAS в MC после нокдауна гена дополнительного компонента ESCRT-III, Chmp5, в SC. Когда ранее мы экспрессировали в SC контрольную РНК-интерференцию (RNAi), нацеленную на ген пигментации глаз rosy, кодирующий фермент ксантиндегидрогеназу, мы обнаружили, что это повышало уровни GFP-MFAS в MC. Поэтому мы использовали альтернативную RNAi, нацеленную на ген не из Drosophila — mCherry; в отсутствие Aβ она также, по-видимому, усиливала поглощение GFP-MFAS клетками MC по сравнению с контролем без экспрессии (сравните Рис. 5A, 5C-E с Рис. 1), но в меньшей степени, чем rosy-RNAi. Этот результат и другие исследования позволяют предположить, что активация аппарата процессинга RNAi в SC может усиливать межклеточный перенос GFP-MFAS. Несмотря на это усиление, нокдаун Chmp5 сильно подавлял уровни интернализованного GFP-MFAS в MC, что было измерено всеми тремя использованными нами методами, не только в MAG, где SC экспрессировали дикий тип Aβ или Aβ-Iowa, но даже в клетках, не экспрессирующих Aβ (Рис. 5). Эта манипуляция также снижала среднюю интенсивность флуоресценции GFP в эндолизосомальных компартментах MC, а для MAG, в которых SC не экспрессировали Aβ или экспрессировали Aβ-wt, количество крупных эндолизосомальных структур, обнаруженных в MC, также уменьшалось (Рис. SN). Эти данные указывают на то, что нокдаун Chmp5 в SC сильно снижает эндоцитоз GFP-MFAS и/или усиливает его деградацию в MC.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f5.jpg\" alt=\"Рисунок 5. Специфический для СК нокдаун Chmp5 сильно подавляет индуцированное Aβ поглощение GFP-MFAS клетками МК. A, B, \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5. Специфический для СК нокдаун Chmp5 сильно подавляет индуцированное Aβ поглощение GFP-MFAS клетками МК. A, B, G, H, M, N. Конфокальные изображения центральных областей MAG от самцов, несущих генную ловушку GFP-mfas и экспрессирующих различные конструкции нокдауна в СК, а также конструкции Aβ-wt (G, H) и Aβ-Iowa (M, N). При отсутствии экспрессии Aβ нокдаун Chmp5 в СК снижает уровни GFP-MFAS в МК (B) по сравнению с контролем нокдауна mCherry (A). Уровни GFP-MFAS в МК также снижаются при нокдауне Chmp5 по сравнению с контролями нокдауна mCherry в MAG, где СК экспрессируют либо Aβ-wt (G, H), либо Aβ-Iowa (M, N). C-F, I-L, O-R. Гистограммы, количественно определяющие подавление переноса GFP-MFAS в МК, индуцированное нокдауном Chmp5, в генотипах, где СК не экспрессируют Aβ (C-F), Aβ-wt (I-L) или Aβ-Iowa (O-R). Значительные снижения наблюдаются для всех генотипов с использованием анализов, измеряющих общую % площадь флуоресценции GFP-MFAS в слое МК в центральной части MAG (C, I, O), интегрированную плотность (площадь, умноженную на среднюю интенсивность флуоресценции GFP в МК) (D, J, P) и среднюю % площадь отдельных компартиментов МК, меченных GFP-MFAS (E, K, Q), после нокдауна Chmp5. Нокдаун Chmp5 также снижает секрецию GFP-MFAS (среднюю интенсивность флуоресценции GFP-MFAS в просвете MAG) в MAG, где СК не экспрессируют Aβ (F), но не оказывает никакого эффекта при экспрессии Aβ-wt и, по-видимому, увеличивает секрецию в присутствии Aβ-Iowa. Белые квадраты отмечают положения областей увеличения. Масштабные шкалы: 30 мкм и 10 мкм для изображений с большим увеличением (увеличением).&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RNAi (РНК-интерференция) — метод «выключения» или снижения экспрессии конкретного гена, позволяющий изучить его функцию через наблюдение за последствиями его отсутствия.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Оценка уровней GFP-MFAS в просвете MAG показала, что нокдаун Chmp5 не снижал секрецию GFP-MFAS клетками SC, экспрессирующими Aβ-wt (Рис. 5H и 5L), и, по сути, по-видимому, увеличивал ее для Aβ-Iowa (Рис. 5N, 5R), что позволяет предположить, что измененное поглощение MC не объясняется снижением уровня GFP-MFAS в просвете. В контрольных железах нокдаун Chmp5 действительно вызывал снижение секреции GFP-MFAS (Рис. 5F), хотя ингибирующий эффект на поглощение MC казался более сильным (Рис. 5C-E). В целом, эти данные свидетельствуют о том, что Rab11-экзосомы и/или их предшественники ILV играют критическую роль в межклеточном переносе компонентов DCG и распространении индуцированных Aβ эндолизосомальных дефектов.&lt;/p&gt;\n&lt;p&gt;Некоторые, но не все, нокдауны ESCRT ингибируют образование крупных DCG в SC, что может увеличить направленность этих компартментов в лизосомы и, следовательно, привести к изменениям эндолизосомальных дефектов, индуцированных в клетках, экспрессирующих Aβ. Поэтому мы исследовали, изменяет ли нокдаун Chmp5 эндолизосомальный транспорт в пути контроля качества SC для секреции или модифицирует эндолизосомальные дефекты, наблюдаемые в SC, экспрессирующих Aβ-wt или Aβ-Iowa, помимо его влияния на фенотипическое распространение (Рис. 6).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f6.jpg\" alt=\"Рисунок 6. Нокдаун Chmp5, специфичный для SC, оказывает лишь умеренное влияние на биологию компартиментов DCG и контроль\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 6. Нокдаун Chmp5, специфичный для SC, оказывает лишь умеренное влияние на биологию компартиментов DCG и контроль качества A-F. Ex vivo широкопольные флуоресцентные изображения отдельного SC (отмечен штриховым кругом).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;При экспрессии в SC в отсутствие Aβ, Chmp5-RNAi увеличивал количество подкисленных компартментов и площадь лизосом в этих клетках (Рис. 6A, 6B, 6I, 6J), возможно, потому, что клетки содержали более высокую долю аномальных DCG (Рис. 6H). Также наблюдалась тенденция к снижению поглощения GFP-MFAS клетками MC по сравнению с контролем (Рис. 6K), хотя этот анализ был недостаточно чувствительным, чтобы обнаружить значимое изменение, в отличие от анализа поглощения в средней части MAG (Рис. 5F).&lt;/p&gt;\n&lt;p&gt;При совместной экспрессии с Aβ-wt или Aβ-Iowa (Рис. 6C-F) наблюдалось снижение поглощения GFP-MFAS клетками MC (Рис. 6K, ср. Рис. 5H-K и 5N-Q). Однако не было явного уменьшения количества аномальных DCG, подкисленных компартментов или площади лизосом, хотя количество компартментов DCG было увеличено в клетках, экспрессирующих Aβ-Iowa (Рис. 6G-J). Таким образом, с помощью наших стандартных анализов не удалось обнаружить клеточно-автономного фенотипического подавления индуцированных Aβ дефектов DCG при нокдауне Chmp5 в SC.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на модели дрозофилы; результаты по межклеточному переносу белков требуют осторожности при экстраполяции на млекопитающих.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;По сути, все компартменты в SC, содержащие DCG, являются Rab11-положительными, и это не затрагивается ни нокдауном Chmp5, ни сверхэкспрессией изоформ Aβ. Используя мух, несущих N-концевой YFP-белковый синтез в локусе гена Rab11, мы подтвердили, что, хотя наблюдались некоторые незначительные колебания в количестве компартментов DCG (Рис. SN), для всех исследованных генотипов их компартменты DCG были помечены Rab11 (Рис. SN). Это указывает на то, что этап процесса созревания DCG, включающий переход к идентичности Rab11-положительных рециркулирующих эндосом, протекает нормально (Рис. SN).&lt;/p&gt;\n&lt;p&gt;YFP-Rab11 также маркирует субпопуляцию внутрипросветных везикул (ILV) внутри этих компартментов. Ранее мы оценивали долю Rab11-положительных компартментов, содержащих флуоресцентные пункты, в качестве меры биогенеза ILV.&lt;/p&gt;\n&lt;h4 id=\"vliyanie-nokdauna-chmp5-na-biogenez-ilv\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#vliyanie-nokdauna-chmp5-na-biogenez-ilv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Влияние нокдауна Chmp5 на биогенез ILV&lt;/span&gt;&lt;/a&gt;Влияние нокдауна Chmp5 на биогенез ILV&lt;/h4&gt;\n&lt;p&gt;Этот анализ подтвердил, что нокдаун Chmp5 снижает долю компартментов, содержащих ILV, по сравнению с контролем как в присутствии, так и в отсутствие Aβ-wt (Рис. S4A-D и S4H). Для SC, экспрессирующих Aβ-Iowa, было затруднительно подсчитать все Rab11-положительные компартменты, содержащие ILV, поскольку большинство этих ILV расположены рядом с ограничивающей мембраной и выглядят как скопления YFP (Рис. S4E и S4H). Нокдаун Chmp5 приводил к увеличению числа ILV, расположенных более центрально (Рис. S4I), что объясняет, почему он незначительно увеличивал количество DCG-компартментов, содержащих ILV, на данном генетическом фоне (Рис. S4F и S4H).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-fS4.jpg\" alt=\"Рисунок S4. Нокдаун Chmp5, специфичный для SC, не изменяет идентичность компартментов DCG в клетках, экспрессирующих Aβ \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок S4. Нокдаун Chmp5, специфичный для SC, не изменяет идентичность компартментов DCG в клетках, экспрессирующих Aβ (связано с рисунком 6)&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нокдаун Chmp5 снижает образование ILV в DCG-компартментах, при этом наблюдается перераспределение ILV в центральную часть компартмента при экспрессии Aβ-Iowa.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Таким образом, нокдаун Chmp5 в SC селективно снижает образование ILV в DCG-компартментах, однако любые последующие эффекты на созревание и контроль качества этих компартментов при сверхэкспрессии изоформ Aβ не были выявлены с помощью стандартных методов, которые мы используем. Тем не менее, этот нокдаун сильно подавляет перенос GFP-MFAS в другие эпителиальные клетки и распространение Aβ-индуцированных эндолизосомальных дефектов на эти клетки. Интересно, что поскольку нокдаун Chmp5, по-видимому, ингибирует перенос даже из SC, не экспрессирующих Aβ, этот экзосомозависимый процесс может функционировать физиологически, но он сильно усиливается в присутствии изоформ Aβ.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нокдаун — метод генетической модификации, при котором снижается экспрессия конкретного гена, что позволяет изучить функцию соответствующего белка.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"nokdaun-vspomogatelnyh-genov-escrt-iii-podavlyaet-nejrodegeneraciyu-v-glazu,-vyzvannuyu-ab\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#nokdaun-vspomogatelnyh-genov-escrt-iii-podavlyaet-nejrodegeneraciyu-v-glazu,-vyzvannuyu-ab\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нокдаун вспомогательных генов ESCRT-III подавляет нейродегенерацию в глазу, вызванную Aβ&lt;/span&gt;&lt;/a&gt;Нокдаун вспомогательных генов ESCRT-III подавляет нейродегенерацию в глазу, вызванную Aβ&lt;/h4&gt;\n&lt;p&gt;Наши исследования показывают, что экспрессия Aβ дикого типа или его мутантных форм в SC индуцирует как минимум три фенотипа, которые могут иметь отношение к инициации БА: нарушение диссоциации агрегированных белков от мембран в компартментах DCG, дефекты эндолизосомального трафика и распространение этих дефектов на другие клетки посредством секреции SC и эндоцитоза MC. Нокдаун Chmp5, который ингибирует формирование ILV в компартментах DCG и, следовательно, секрецию Rab11-экзосом, сильно подавляет фенотип распространения, но оказывает лишь незначительное влияние (если оно вообще есть) на вызванные Aβ дефекты в DCG и эндолизосомальной системе SC.&lt;/p&gt;\n&lt;p&gt;Мы предположили, что дефекты регулируемой секреции, вызванные Aβ, могут инициировать нейродегенеративные фенотипы, наблюдаемые при БА. Таким образом, генетические манипуляции, подавляющие любой из этих дефектов в SC, могут также ингибировать дегенерацию, запускаемую экспрессией Aβ в нейронах.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нокдаун вспомогательных генов ESCRT-III (Chmp5, Ist1, Chmp1) подавляет нейродегенерацию, вызванную Aβ, что указывает на ключевую роль пути биогенеза Rab11-экзосом в патогенезе БА.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для проверки этой гипотезы мы использовали модель нейродегенерации в глазу мухи, которая широко применяется для изучения нейродегенерации, связанной с БА. Экспрессия Aβ дикого типа или Aβ-Iowa в развивающемся глазу Drosophila с использованием специфичного для глаз драйвера GMR-GAL4 нарушает нормальную гексагональную структуру омматидиев из-за дегенерации клеток в период формирования морфологии взрослого глаза (Рис. 7).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f7.jpg\" alt=\"Рисунок 7. Экспрессия человеческих Aβ-wt и Aβ-Iowa вызывает поддающееся количественной оценке нарушение регулярности ома\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 7. Экспрессия человеческих Aβ-wt и Aβ-Iowa вызывает поддающееся количественной оценке нарушение регулярности оматидиев в глазу Drosophila A-D. Стереомикроскопические изображения глаз самок в возрасте 2–4 дней, несущих инсерцию GMR-GAL4 (III) в третьей хромосоме в отсутствие другого трансгена (A), с UAS-lacZ (B), UAS-Aβ-wt (C) и UAS-Aβ-Iowa (D). E. Гистограмма, отображающая показатель регулярности (в виде Z-преобразования Фишера) для глаз этих генотипов относительно контрольной референсной кривой GMR-GAL4 (III). F-I. Стереомикроскопические изображения глаз самок в возрасте 2–4 дней, несущих инсерцию GMR-GAL4 (II) во второй хромосоме в отсутствие другого трансгена (F), с UAS-lacZ (G), UAS-Aβ-wt (H) и UAS-Aβ-Iowa (I). J. Гистограмма, отображающая показатель регулярности (в виде Z-преобразования Фишера) для глаз этих генотипов относительно контрольной референсной кривой GMR-GAL4 (II). Масштабная шкала: 100 мкм, применима ко всем изображениям.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Некоторые генетические и фармакологические супрессоры нейродегенерации, связанной с БА, а также модификаторы секреции частично спасают эти фенотипы. Кроме того, известно, что Rab11 играет критическую роль в апикальном трафике и секреции в фоторецепторах Drosophila, что согласуется с идеей о том, что эти клетки, как и многие другие типы клеток, обладают базовым аппаратом регулируемого секреторного биогенеза, присутствующим в SC.&lt;/p&gt;\n&lt;p&gt;Мы подтвердили, что экспрессия Aβ-wt и Aβ-Iowa под контролем двух различных инсерций GMR-GAL4 приводила к фенотипу дезорганизованного глаза (Рис. 7).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GMR-GAL4 — это генетическая система, используемая для направленной экспрессии генов в развивающемся глазу Drosophila, позволяющая изучать влияние конкретных белков на структуру тканей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ранее были разработаны аналитические инструменты для изучения фенотипов «шероховатого глаза», однако мы обнаружили, что они плохо работают с нашими стереомикроскопическими изображениями. Поэтому мы адаптировали элементы этих методов и разработали автоматизированный конвейер анализа омматидиев для измерения регулярности гексагональной структуры глаза примерно для 250 центральных омматидиев. Это позволило определить угол по отношению к шести ближайшим омматидиям для каждого элементарного глаза в контрольных глазах и глазах, экспрессирующих Aβ, в пределах центральной эллиптической области. Мы установили эталонную кривую для каждой линии GMR-GAL4 при скрещивании с мухами, не несущими инсерцию UAS-трансгена; она содержала шесть четких пиков, каждый из которых разделен углом в 60 градусов (Рис. SN). При сравнении с этой эталонной кривой мы обнаружили, что нерегулярное расположение омматидиев в глазах, экспрессирующих Aβ, можно четко отличить от глаз мух, экспрессирующих контрольный трансген lacZ (Рис. SN).&lt;/p&gt;\n&lt;p&gt;Экспрессия контрольной РНК-интерференции (mCherry-RNAi) не оказала влияния ни на регулярность омматидиев в контрольных глазах, ни на нерегулярность, вызванную Aβ дикого типа и Aβ-Iowa (Рис. SN, 8A, 8B, 8D, 8E, 8F и 8H). Напротив, Chmp5-RNAi подавляла дезорганизацию, вызванную Aβ дикого типа, но не в глазах, экспрессирующих Aβ-Iowa (Рис. 8C, 8D, 8G и 8H). При экспрессии в одиночку она вызывала некоторую нерегулярность омматидиев при использовании драйвера GMR-GAL4 (III) третьей хромосомы (Рис. SN), что предполагает, что вспомогательная функция ESCRT-III может играть физиологическую роль в регуляции нормальной морфологии глаза в процессе развития.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f8.jpg\" alt=\"Рисунок 8. Нокдаун Chmp5 подавляет вызванную Aβ-wt дезорганизацию в глазу A-C. Стереомикроскопические изображения глаз с\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 8. Нокдаун Chmp5 подавляет вызванную Aβ-wt дезорганизацию в глазу A-C. Стереомикроскопические изображения глаз самок в возрасте 2–4 дней, несущих инсерцию GMR-GAL4 (III) в третьей хромосоме в присутствии UAS-Aβ-wt и коэкспрессирующих либо никакой другой трансген (A), либо UAS-mCherry-RNAi (B), либо UAS-Chmp5-RNAi (C). D. Гистограмма, отображающая показатель регулярности (в виде Z-преобразования Фишера) для глаз этих генотипов относительно контрольной референсной кривой GMR-GAL4 (III). Обратите внимание на частичное восстановление дезорганизации при нокдауне Chmp5 относительно обоих контролей. E-G.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на модели Drosophila; результаты могут не полностью отражать сложность патогенеза БА у человека, а наблюдаемые эффекты требуют дальнейшей проверки в нейрональных системах млекопитающих.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В предыдущем исследовании сообщалось, что истощение основных компонентов ESCRT (Stam, Vps25 и Vps4) с помощью РНК-интерференции подавляет фенотип дегенерации, вызванный сверхэкспрессией человеческого APP под контролем GMR-GAL4 в глазу мухи, что подтверждает предположение о том, что функция ESCRT необходима для дегенерации в моделях БА, связанных с APP/Aβ. Чтобы подтвердить, что путь биогенеза, опосредованный вспомогательными белками ESCRT-III и Rab11-экзосомами, является важным участником дегенерации, вызванной Aβ, мы протестировали эффекты нокдауна двух других вспомогательных генов ESCRT-III, Ist1 и Chmp1, в модели GMR-GAL4. Ранее было показано, что оба нокдауна селективно ингибируют формирование ILV в компартментах DCG SC. Они подавляли дегенерацию, вызванную как Aβ-wt, так и Aβ-Iowa (Рис. 9), но не оказывали эффекта при экспрессии в глазу в одиночку (Рис. SN).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f9.jpg\" alt=\"Рисунок 9. Нокдаун других вспомогательных генов ESCRT-III подавляет дезорганизацию в глазу, вызванную Aβ-wt и Aβ-Iowa A-\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 9. Нокдаун других вспомогательных генов ESCRT-III подавляет дезорганизацию в глазу, вызванную Aβ-wt и Aβ-Iowa A-C. Стереомикроскопические изображения глаз самок в возрасте 2–4 дней, несущих инсерцию GMR-GAL4 (III) в третьей хромосоме в присутствии UAS-Aβ-wt и коэкспрессирующих либо UAS-mCherry-RNAi (A), либо UAS-Chmp1-RNAi (B), либо UAS-Ist1-RNAi (C). D. Гистограмма, отображающая показатель регулярности (в виде Z-преобразования Фишера) для глаз этих генотипов относительно контрольной референсной кривой GMR-GAL4 (III). Обратите внимание на частичное восстановление дезорганизации при нокдауне как Chmp1, так и Ist1 относительно контроля. E-G. Стереомикроскопические изображения глаз самок в возрасте 2–4 дней, несущих инсерцию GMR-GAL4 (II) во второй хромосоме в присутствии UAS-Aβ-Iowa и коэкспрессирующих либо UAS-mCherry-RNAi (E), либо UAS-Chmp1-RNAi (F), либо UAS-Ist1-RNAi. H. Гистограмма, отображающая показатель регулярности (в виде Z-преобразования Фишера) для глаз этих генотипов относительно контрольной референсной кривой GMR-GAL4 (II). Обратите внимание на частичное восстановление дезорганизации при нокдауне Chmp1 и Ist1 относительно контроля, экспрессирующего РНК. Масштабная шкала: 100 мкм.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Таким образом, наши данные показывают, что блокирование вспомогательного пути ESCRT-III, который, как известно, селективно участвует в биогенезе Rab11-экзосом, подавляет морфологический фенотип, связанный с дегенерацией, вызванной различными формами Aβ.&lt;/p&gt;\n&lt;p&gt;Это позволяет предположить, что механизм дегенерации включает процесс, связанный с биогенезом Rab11-экзосом и, возможно, его последующим влиянием на путь регулируемой секреции, что нарушает нормальный эндоцитарный захват секретируемых компонентов DCG.&lt;/p&gt;\n&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;p&gt;Клеточные биологические события, посредством которых образование Aβ из APP инициирует нейродегенерацию и способствует переносу дегенеративных фенотипов в другие клетки, до сих пор остаются неясными. Однако дефекты эндолизосомального транспорта и последующее межклеточное распространение этого фенотипа, по-видимому, играют важную роль. Наши недавние исследования с использованием SC, подобных клеткам простаты Drosophila, показывают, что эти дефекты могут возникать из-за нарушения регуляции эволюционно консервативных APP-зависимых процессов, контролирующих регулируемую секрецию. Эти процессы могут генерировать Aβ в норме, но на уровнях, которые адекватно обрабатываются системами контроля качества клетки.&lt;/p&gt;\n&lt;p&gt;Здесь мы показываем, что экспрессия в SC Aβ-wt и Aβ-Iowa, мутантной формы Aβ, связанной с ранней формой семейной БА, индуцирует распространение эндолизосомальных дефектов на эпителиальные клетки по всей MAG Drosophila. Образующиеся аберрантные эндолизосомы содержат избыточные уровни компонента DCG MFAS, а также экзосомы, которые, вероятно, образуются в компартментах DCG SC, хотя мы не можем исключить, что некоторые везикулы, меченные CD63-mCherry, могли быть образованы с помощью других механизмов. Генетическая манипуляция SC с целью ингибирования биогенеза Rab11-экзосом имеет ограниченный, если вообще имеющийся, обнаружимый эффект на путь биогенеза DCG в клетках, экспрессирующих Aβ, но сильно подавляет распространение.&lt;/p&gt;\n&lt;p&gt;Более того, подавление пути биогенеза Rab11-экзосом также подавляет вызванные Aβ дегенеративные эффекты в глазу мухи, что позволяет предположить, что нарушение процессов, связанных с регулируемой секрецией, вовлечено в нейродегенерацию и может стать мишенью для будущих терапевтических стратегий.&lt;/p&gt;\n&lt;h4 id=\"rasprostranenie-defektov-endolizosomalnogo-transporta,-vyzvannyh-ab,-svyazano-s-putem-reguliruemoj-sekrecii\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#rasprostranenie-defektov-endolizosomalnogo-transporta,-vyzvannyh-ab,-svyazano-s-putem-reguliruemoj-sekrecii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Распространение дефектов эндолизосомального транспорта, вызванных Aβ, связано с путем регулируемой секреции&lt;/span&gt;&lt;/a&gt;Распространение дефектов эндолизосомального транспорта, вызванных Aβ, связано с путем регулируемой секреции&lt;/h4&gt;\n&lt;p&gt;Используя преимущество сильно увеличенных компартментов DCG в SC, мы ранее показали, что экспрессия Aβ нарушает путь регулируемой секреции и его контроль качества, а также приводит к эндолизосомальным дефектам, которые распространяются на соседние клетки. В этом исследовании удалось показать с помощью окрашивания LysoTracker Red, что эндолизосомальные компартменты в MC сильно увеличены и демонстрируют усиленную GFP-флуоресценцию, полученную от меченного GFP белка DCG SC MFAS. MAG содержит около 40 SC на дистальном конце каждой из двух долей, которые также содержат около 1000 MC. Здесь мы обнаружили, что происходит накопление GFP внутри увеличенных эндолизосомальных компартментов MC по всей остальной части MAG; для Aβ-Iowa удалось показать, что, как и ожидалось, аномальный захват зависит от BMP-сигнализации в SC, которая контролирует регулируемую секрецию в этих клетках.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нарушение биогенеза DCG и Rab11-зависимого экзосомального пути под действием Aβ приводит к патологическому переносу белков в соседние клетки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Иммуноокрашивание с использованием специфичного к человеческому Aβ антитела продемонстрировало, что Aβ-пептиды включаются в DCG SC. Не удалось подтвердить, переносятся ли эти пептиды также в MC из-за фонового окрашивания, создаваемого этим антителом. Однако наши результаты убедительно подтверждают идею о том, что Aβ напрямую вмешивается в биогенез DCG и созревание компартментов, и повышают вероятность того, что взаимодействия с компонентами DCG сохраняются после секреции, объясняя аберрантный захват секретированного MFAS клетками MC.&lt;/p&gt;\n&lt;h4 id=\"rab11-ekzosomy-sposobstvuyut-mezhkletochnomu-rasprostraneniyu-inducirovannyh-ab-endolizosomalnyh-defektov\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#rab11-ekzosomy-sposobstvuyut-mezhkletochnomu-rasprostraneniyu-inducirovannyh-ab-endolizosomalnyh-defektov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rab11-экзосомы способствуют межклеточному распространению индуцированных Аβ эндолизосомальных дефектов&lt;/span&gt;&lt;/a&gt;Rab11-экзосомы способствуют межклеточному распространению индуцированных Аβ эндолизосомальных дефектов&lt;/h4&gt;\n&lt;p&gt;Предыдущие исследования на клетках грызунов и человека показали, что Аβ и Аβ-олигомеры секретируются в ассоциации с экзосомами, а амилоидные бляшки содержат экзосомы и/или другие внеклеточные везикулы (ВВ), которые способствуют их формированию.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Экзосомы — это мелкие внеклеточные везикулы, участвующие в межклеточной коммуникации и способные переносить патогенные белки между клетками.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Более того, связанные с Аβ ВВ из плазмы крови и спинномозговой жидкости (СМЖ) пациентов с болезнью Альцгеймера (БА), нейральных клеток пациентов с БА и плазмы грызунных моделей БА передают патологические фенотипы другим нейронам. Кроме того, сообщалось, что нейротоксичные Аβ-олигомеры передаются между нейронами и глиальными клетками человека посредством механизма, задействующего экзосомы. Этот процесс стимулируется эндолизосомальными дефектами в клетках, секретирующих ВВ.&lt;/p&gt;\n&lt;p&gt;Мы предположили, что внутрипросветные везикулы (ВПВ) внутри компартментов ДЦГ могут представлять по крайней мере часть связанных с Аβ ВВ, участвующих в распространении эндолизосомальных дефектов. Действительно, нокаут Chmp5 в СК резко подавлял аномальное поглощение GFP-MFAS со стороны МК, что подтверждает эту идею. Ранее мы показали, что вспомогательные гены ESCRT-III играют избирательную роль в биогенезе Rab11-экзосом в клетках мух и человека. Хотя мы не можем исключить, что сильное подавление индуцированного Аβ распространения связано с другими клеточными эффектами нокаута Chmp5, это кажется маловероятным, поскольку на данном генетическом фоне GFP-MFAS по-прежнему секретируется, и не наблюдается значительных изменений в ДЦГ и эндолизосомальных компартментах СК, опосредующих эту секрецию.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Выводы о роли белков ESCRT-III и экзосом основаны на модельных организмах и клеточных культурах, поэтому их прямой вклад в патогенез болезни Альцгеймера у человека требует дальнейших клинических подтверждений.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В ряде работ подчеркивается важная роль компартментов, позитивных по Rab11, в нормальной и патологической межклеточной коммуникации нейронов. Например, у мух Rab11 участвует в пресинаптической секреции на нервно-мышечном синапсе, которая включает высвобождение везикул, подобных экзосомам. Исследования на нейронах млекопитающих также подчеркивают центральную роль Rab11 в секреции связанных с Аβ экзосом при БА и на ее моделях.&lt;/p&gt;\n&lt;p&gt;Действительно, наблюдается перекрытие между общими сигнатурами человеческих Rab11-экзосом и белками, повышенными в спинномозговой жидкости пациентов с БА.&lt;/p&gt;\n&lt;p&gt;Наши результаты показывают, что аберрантный межклеточный перенос компонентов ДЦГ, вероятнее всего, связан с распространением индуцированных Аβ экзосомно-ассоциированных патологий. Усиленный перенос этих компонентов может просто отражать повышенную эндоцитарную активность или сниженные деградационные функции МК, индуцированные Аβ. Однако наблюдение того, что MFAS, мембраны и ВВП аномально взаимодействуют в компартментах ДЦГ экспрессирующих Аβ СК, поднимает вопрос о том, что экзосомные комплексы, связанные с белками ДЦГ, а также Аβ в составе «биомолекулярной короны» экзосомы, могут сохраняться при секреции и вызывать эндолизосомальные дефекты в МК.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Нокаут Chmp5 подавляет межклеточный перенос GFP-MFAS, а экзосомные комплексы с белками ДЦГ и Аβ могут сохраняться и вызывать эндолизосомальные дефекты в клетках-мишенях.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Действительно, остается неясным, функционирует ли такой механизм в физиологических условиях в отсутствие повышенного уровня Аβ. Хотя нокаут Chmp5 подавляет межклеточный перенос GFP-MFAS в СК, которые не сверхэкспрессируют Аβ, другие контроли со сверхэкспрессией РНКi демонстрируют повышенный межклеточный перенос GFP-MFAS по сравнению с неэкспрессирующими контролями. Следовательно, возможно, что гиперактивация аппарата РНКi усиливает активность межклеточного распространения, а нокаут Chmp5 подавляет это усиление. Тем не менее, Аβ вовлечен в физиологическую межклеточную сигнализацию, поэтому вполне возможно, что она включает комплексы Rab11-экзосом с агрегатами — идею, которую теперь можно проверить экспериментально. Специфический для СК нокаут Chmp5 ингибирует специфический женский ответ на спаривание — отказ от других самцов, и будет интересно исследовать, вовлечены ли mfas, ключевой регулятор агрегации белков ДЦГ, APP или другие компоненты ДЦГ в этот опосредованный экзосомами процесс.&lt;/p&gt;\n&lt;h4 id=\"nokdaun-regulyatorov-rab11-ekzosom-takzhe-podavlyaet-inducirovannuyu-ab-nejrodegeneraciyu\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#nokdaun-regulyatorov-rab11-ekzosom-takzhe-podavlyaet-inducirovannuyu-ab-nejrodegeneraciyu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нокдаун регуляторов Rab11-экзосом также подавляет индуцированную Aβ нейродегенерацию&lt;/span&gt;&lt;/a&gt;Нокдаун регуляторов Rab11-экзосом также подавляет индуцированную Aβ нейродегенерацию&lt;/h4&gt;\n&lt;p&gt;Хорошо известно, что экспрессия Aβ, управляемая с помощью GMR-GAL4, приводит к морфологическому дефекту, связанному с нейродегенерацией, и стала эффективным методом скрининга для идентификации супрессоров этого процесса.&lt;/p&gt;\n&lt;p&gt;Исследование Zhuang с соавт., 2023 г., показало, что нокдаун основных белков ESCRT подавляет дегенерацию глаз, вызванную экспрессией человеческого APP под управлением GMR-GAL4. Авторы утверждали, что эта манипуляция снижает транспорт APP в поздние эндосомы, где в норме образуется Aβ. Наше открытие о том, что нокдаун вспомогательных компонентов ESCRT-III, который, как мы показали в слюнных железах (SCs) и клетках колоректального рака человека, оказывает относительно избирательное действие на Rab11-экзосомы по сравнению с эндосомальными экзосомами поздних стадий (Marie et al., 2023), способен ингибировать дегенерацию, индуцированную предварительно расщепленными диким типом и мутантным Aβ, предполагает участие других процессов в опосредованном ESCRT подавлении нейродегенерации. Одно из простых объяснений, вытекающих из нашего анализа в маг-нитных клетках (MAGs), заключается в том, что блокирование распространения эндолизосомальных дефектов путем ингибирования биогенеза Rab11-экзосом ослабляет некоторые эффекты Aβ (см. модель на Рис. 10). Однако драйвер GMR-GAL4 экспрессирует Aβ во всех фоторецепторах, поэтому фенотипическое распространение от дефектных фоторецепторов к нормальным вряд ли играет главную роль в этом процессе.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f10.jpg\" alt=\"Рисунок 10. Предлагаемая модель для объяснения роли экзосом Rab11 в межклеточном распространении дефектов эндолизосомаль\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 10. Предлагаемая модель для объяснения роли экзосом Rab11 в межклеточном распространении дефектов эндолизосомального транспорта, индуцированных Aβ. Схематичное изображение показывает регулируемый секреторный процесс в здоровых клетках (A) и в клетках, экспрессирующих Aβ, которые производят либо нормальные (B), либо сниженные (C) уровни экзосом Rab11. Регулируемая секреция включает биогенез DCG (① и ②), процесс, требующий компартментального переключения на идентичность Rab11-положительных рециркулирующих эндосом и процессинг APP, за которым следует контроль качества (③) и секреция. В здоровых клетках (A) только небольшая часть компартиментов DCG направляется на лизосомальную деградацию, что приводит к минимальному накоплению Aβ. Если Aβ начинает накапливаться (B), это нарушает биогенез DCG, вызывая снижение диссоциации взаимодействий мембрана:агрегат (например, через APP; красный ②) и повышенное, но аберрантное направление этих компартиментов в лизосомы (красный ③). Многие из этих компартиментов все еще секретируются (красный ④). Дефектный секретируемый материал аномально эндоцитируется другими клетками (а также самими секретирующими клетками (не показано)) и накапливается в увеличенных эндолизосомах, распространяя дефект транспорта (красный ⑤). Это и дефекты эндолизосомального транспорта в секретирующих клетках в конечном итоге индуцируют дегенерацию как в SC (Singh et al., 2025), так и, как широко сообщается (Kimura and Yanagisawa, 2018), в нейронах. Мы обнаруживаем, что нокдаун Chmp5 в SC (C), который избирательно ингибирует биогенез экзосом Rab11 в клетках человека и Drosophila (Marie et al., 2023), не оказывает детектируемого эффекта на клетки, экспрессирующие Aβ. Однако он подавляет фенотипическое распространение эндолизосомальных дефектов, предположительно влияя на общий состав агрегатов и/или их взаимодействия с везикулами в секретирующих клетках, либо после секреции (как показано здесь), либо когда секретируемый материал эндоцитируется другими клетками. Эта генетическая манипуляция также достаточна для уменьшения нейродегенерации в глазу мухи, индуцированной Aβ, что предполагает роль экзосом Rab11 в патологии БА, связанной с Aβ.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нокдаун вспомогательных компонентов ESCRT-III подавляет индуцированную Aβ нейродегенерацию, блокируя биогенез Rab11-экзосом и прерывая каскад эндолизосомальных нарушений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Альтернативная возможность заключается в том, что поглощение материала, секретируемого из аберрантно собранных компартментов плотных секреторных гранул (DCG), усугубляет дефекты эндолизосомального трафика в других клетках, экспрессирующих Aβ, и потенциально в самой секретирующей клетке. Хотя мы не наблюдали каких-либо существенных изменений в DCG- или эндолизосомальных компартментах слюнных желез, экспрессирующих Aβ, у которых был нокдаунирован Chmp5, эти клетки, подобно фоторецепторам в анализе с GMR-GAL4, продолжают синтезировать больше Aβ даже в отсутствие эндоцитоза. Следовательно, они могут быть менее подвержены ингибированию механизмов фенотипического распространения по сравнению с клетками, которым эти механизмы необходимы для запуска аберрантного синтеза Aβ. Это также может объяснять наблюдаемое неполное подавление нейродегенерации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Выводы сделаны на моделях Drosophila и клеточных линиях; наблюдаемое подавление нейродегенерации является неполным, что указывает на сложность и многокомпонентность патологических механизмов Aβ.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"aberrantnaya-sekreciya-s-regulyaciej-i-integrirovannaya-model-iniciacii-patologii-ba\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#aberrantnaya-sekreciya-s-regulyaciej-i-integrirovannaya-model-iniciacii-patologii-ba\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Аберрантная секреция с регуляцией и интегрированная модель инициации патологии БА&lt;/span&gt;&lt;/a&gt;Аберрантная секреция с регуляцией и интегрированная модель инициации патологии БА&lt;/h4&gt;\n&lt;p&gt;Если дефектная секреция с регуляцией действительно играет важную роль в инициировании индуцированной Aβ патологии БА и ее распространении, то где в эту схему вписываются другие ключевые участники БА, в частности тау-белок? Было показано, что эндолизосомальные дефекты, ассоциированные с Aβ, действительно индуцируют тау-патологии в нейронах грызунов, в то время как Aβ вовлечен в экзосомальный перенос патологических затравок (seeds) тау-белка между нейронами человека — процессы, которые могут быть связаны с аберрантным секреторным траффиком.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дефекты секреции и белок Arc связывают Aβ с распространением тау-патологии через эндолизосомальный путь, открывая новые возможности для ранней диагностики по экзосомам Rab11a.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Белок, ассоциированный с цитоскелетом и регулируемый активностью (ARC), в недавних исследованиях также был напрямую связан с затравлением тау-белка. Многочисленные исследования связывают Arc с БА, а у Drosophila нокаут ортолога Arc — гена Arc1 — подавляет индуцированную тау патологию в нескольких моделях БА. Поскольку предполагается, что Arc тесно вовлечен в продукцию внутрипросветных везикул (ILV) на пресинаптических окончаниях и способен связываться с цитоплазматическим доменом APP, он может служить важным звеном между модулируемым тау цитоскелетом и компартментами секреции с регуляцией, что имеет значение для фенотипа эндолизосомального распространения. В связи с этим интересно, что ген Arc1 транскрибируется на особенно высоких уровнях в половых клетках (SCs) и поэтому также может играть роль в этой системе.&lt;/p&gt;\n&lt;p&gt;Наше исследование поднимает интересную возможность того, что самые ранние патологические дефекты при БА связаны с секрецией аномальных экзосом Rab11, которые несут специфичные для заболевания поверхностные грузы (Рис. 10). Известно, что эти экзосомы содержат иные белковые наборы по сравнению с экзосомами позднеэндосомального происхождения, поэтому разработка тестов для различения нейрональных экзосом Rab11 (называемых экзосомами Rab11a у человека) от других внеклеточных везикул в биологических жидкостях может открыть новый путь к созданию диагностических тестов на ранней или даже продромальной стадии. Недавний анализ субклеточного протеома нейронов у пациентов с БА с деменцией по сравнению с лицами с устойчивостью к заболеванию предполагает скоординированную реорганизацию эндолизосомальных белков, особенно тех, которые связаны с ранними и рециклирующими эндосомами, причем у пациентов с когнитивным снижением она выражена сильнее. Манкирует мысль о том, что экзосомы Rab11a могут служить индикатором этих различий, имеющим прогностическое значение.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Экзосомы — это мелкие внеклеточные везикулы, выделяемые клетками для межклеточной коммуникации, а эндосомы — это внутриклеточные пузырьки, сортирующие белки и липиды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Гипотезу о том, что дефекты секреции с регуляцией и ее контроля качества могут приводить к накоплению эндолизосомальных компартментов, генерирующих Aβ, стимулируя агрегацию белков и распростране
