            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"186\" cy=\"166\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"554\" cy=\"192\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · MOLECULAR BIOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как сердце управляет кровью&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;через печень после инфаркта&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s-f1.jpg\" alt=\"Рисунок 1. Инфаркт миокарда приводит к усилению обновления тромбоцитов. Мыши перенесли ишемически-реперфузионное (И/Р) п\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Инфаркт миокарда приводит к усилению обновления тромбоцитов. Мыши перенесли ишемически-реперфузионное (И/Р) повреждение с использованием модели закрытой грудной клетки. Функция левого желудочка после И/Р-повреждения оценивалась с помощью эхокардиографии. (A) Фракция выброса определялась в указанные моменты времени после И/Р для подтверждения повреждения миокарда (n=4). (B) Количество тромбоцитов измерялось в цельной крови мышей дикого типа до и после И/Р-повреждения (n=12 (здоровые), 7 (6 ч), 12 (24 ч), 7 (5 сут), 10 (21 сут)). (C) GPIb-положительные тромбоциты в отмытой цельной крови анализировались в отношении размера, определяемого по геометрическому среднему профиля светорассеяния FSC (n=9). (D) Количество ретикулярных тромбоцитов определялось путем окрашивания тиазоловым оранжевым с использованием проточной цитометрии (n=9). (E) Десиалированные тромбоциты анализировались в отношении их профиля связывания с агглютинином Ricinus communis-1 (RCA) (n=9). (F) Апоптотические тромбоциты определялись по связыванию аннексина V (n=6). (G-H) Активация тромбоцитов в указанные моменты времени определялась с использованием антител JON/A-PE, связывающихся с активным интегрином IIb3 (G), и P-селектина в качестве маркера дегрануляции тромбоцитов (H) (n=5-10). Данные представлены в виде средних значений ± стандартная ошибка среднего (SEM). Статистический анализ проводился с использованием обычного однофакторного дисперсионного анализа (ANOVA) с тестом множественных сравнений Тьюки. * p &amp;lt; 0,05, ** p &amp;lt; 0,01, *** p &amp;lt; 0,001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;После острого инфаркта миокарда организм запускает экстренное восстановление уровня тромбоцитов, чтобы предотвратить опасные осложнения. До сих пор оставалось загадкой, как именно костный мозг получает сигнал о нехватке клеток крови. Новые эксперименты на мышах показали, что ключевую роль в этом процессе играет печень. Поврежденное сердце посылает воспалительные сигналы, которые заставляют печень вырабатывать больше гормона тромбопоэтина.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Инфаркт запускает ускоренное обновление тромбоцитов в крови.&lt;/li&gt;\n&lt;li&gt;Печень активирует выработку тромбопоэтина через сигнальный путь STAT3.&lt;/li&gt;\n&lt;li&gt;Острая потеря тромбоцитов и хронический дефицит рецепторов запускают разные механизмы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Исследователи использовали модель ишемии и реперфузии у мышей, чтобы изучить динамику изменения популяции тромбоцитов в первые сутки после инфаркта. В крови животных фиксировался рост числа молодых ретикулированных и десиалированных тромбоцитов, что указывает на ускоренное обновление клеток. Анализ тканей показал активацию рецепторов Asgr1/2 и IL-6R, а также усиленное фосфорилирование белка STAT3 в печени наряду с увеличением числа мегакариоцитов в селезенке.&lt;/p&gt;\n&lt;p&gt;Уже через двадцать четыре часа после повреждения миокарда концентрация тромбопоэтина (TPO, основного регулятора созревания мегакариоцитов) в плазме крови заметно возрастала, что позволяло быстро компенсировать дефицит тромбоцитов. Эксперименты с искусственным истощением пула тромбоцитов с помощью антител к GPIbα подтвердили компенсаторный характер этой реакции. При этом у мышей с дефицитом рецептора GPVI подобных изменений не наблюдалось, что говорит о принципиальной разнице между острой потерей клеток и хроническим дефицитом рецепторов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа выполнена на мышиных моделях, поэтому прямое переношение выводов на физимологию человека требует клинических подтверждений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Научная работа курируется профессором Маргиттой Элверс из отделения сосудистой и эндоваскулярной хирургии при Университетской клинике Дюссельдорфа (Германия). По всем вопросам, касающимся методологии, результатов исследования или запросов на сотрудничество, следует обращаться в отдел экспериментальной сосудистой медицины по адресу: Moorenstr. 5, 40225 Düsseldorf. Для оперативной связи предусмотрены телефонный номер +49 (0)211 81-08851 и факс +49 (0)211 81-17498.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Корреспонденция — это официальный канал связи с автором-корреспондентом, который несет ответственность за достоверность данных и коммуникацию с научным сообществом по поводу опубликованной статьи.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"rol-osi-serdce-pechen-v-regulyacii-trombocitov-posle-infarkta\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#rol-osi-serdce-pechen-v-regulyacii-trombocitov-posle-infarkta\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Роль оси «сердце-печень» в регуляции тромбоцитов после инфаркта&lt;/span&gt;&lt;/a&gt;Роль оси «сердце-печень» в регуляции тромбоцитов после инфаркта&lt;/h4&gt;\n&lt;p&gt;Тромбоциты играют ключевую роль в процессах тромбовоспаления при остром инфаркте миокарда (ИМ). Исследование сфокусировано на том, как ИМ влияет на выработку печеночного тромбопоэтина (ТПО). В экспериментах на мышах дикого типа, а также на моделях с тромбоцитопенией и дефицитом рецептора GPVI (Gp6-/-), авторы моделировали ишемию/реперфузию (И/Р). Анализировались активация и обновление тромбоцитов, а также экспрессия печеночных рецепторов, участвующих в регуляции ТПО.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;После ИМ активируется ось «сердце-печень», что приводит к росту уровня ТПО в плазме через 24 часа и быстрому восстановлению числа тромбоцитов благодаря сигнализации STAT3.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Результаты показали, что после ИМ ускоряется обновление тромбоцитов, увеличивается доля ретикулярных и десиалированных форм. В печени наблюдается повышение экспрессии рецепторов Asgr1/2 и IL-6R, усиление фосфорилирования STAT3, а в селезенке — рост числа мегакариоцитов. Истощение тромбоцитов вызывает компенсаторный рост ТПО, тогда как у мышей Gp6-/- таких изменений не наблюдается, что указывает на различия между острой тромбоцитопенией и хроническим дефицитом рецепторов.&lt;/p&gt;\n&lt;h4 id=\"fiziologiya-trombocitov-i-mehanizmy-regulyacii\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#fiziologiya-trombocitov-i-mehanizmy-regulyacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Физиология тромбоцитов и механизмы регуляции&lt;/span&gt;&lt;/a&gt;Физиология тромбоцитов и механизмы регуляции&lt;/h4&gt;\n&lt;p&gt;Поддержание стабильного уровня тромбоцитов (в норме 150–400 × 10³ мкл⁻¹) критически важно для предотвращения кровотечений и тромбозов. При ИМ, который остается ведущей причиной смертности, стандартная терапия включает реканализацию и двойную антиагрегантную терапию. В ранней фазе после ИМ наблюдается усиленная пролиферация мегакариоцитов и рост числа тромбоцитов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Рецептор Ашвелла-Морелла (AMR) — печеночный комплекс из субъединиц ASGPR1 и ASGPR2, который распознает «старые» десиалированные тромбоциты и удаляет их из кровотока, запуская сигнальный каскад через JAK2 и STAT3 для синтеза ТПО.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Основным регулятором мегакариоцитопоэза является ТПО. Удаление старых тромбоцитов происходит через AMR, который связывает десиалированные тромбоциты, активируя JAK2. Параллельно IL-6 связывается с IL-6R, активируя STAT3, что стимулирует синтез мРНК ТПО. Авторы использовали модели И/Р у мышей для изучения этих путей, подтверждая, что ось AMR-IL-6R-STAT3 является ключевым звеном гомеостаза тромбоцитов после ИМ.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"31-ostryj-infarkt-miokarda-privodit-k-uskorennomu-obnovleniyu-trombocitov\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#31-ostryj-infarkt-miokarda-privodit-k-uskorennomu-obnovleniyu-trombocitov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.1 Острый инфаркт миокарда приводит к ускоренному обновлению тромбоцитов&lt;/span&gt;&lt;/a&gt;3.1 Острый инфаркт миокарда приводит к ускоренному обновлению тромбоцитов&lt;/h4&gt;\n&lt;p&gt;Мыши линии C57BL/6J перенесли острый инфаркт миокарда (ОИМ), вызванный 60-минутной окклюзией левой коронарной артерии (LAD) с последующей реперфузией (I/R) в течение 24 часов, 7 и 21 дня. Использование модели закрытой грудной клетки позволило минимизировать хирургическую травму. Эхокардиография подтвердила дисфункцию левого желудочка (Рис. 1A). Подсчет тромбоцитов показал их значительное снижение только через 6 часов после I/R, тогда как к 24 часам показатели нормализовались и оставались стабильными до 21 дня (Рис. 1B). Средний геометрический размер GPIb-позитивных тромбоцитов был увеличен через 6 часов и снижен через 24 часа после I/R (Рис. 1C). Количество ретикулярных тромбоцитов, окрашенных тиазоловым оранжевым, было повышено через 6 часов (Рис. 1D). Анализ десиалирования с помощью лектина RCA-1 выявил повышенное связывание через 6 часов после I/R, что указывает на рост доли десиалированных тромбоцитов в ранний период (Рис. 1E). Через 24 часа и 5 дней различий не наблюдалось. Количество Annexin-V-позитивных (апоптотических) тромбоцитов было повышено через 24 часа (Рис. 1F). Кроме того, через 4 часа после I/R наблюдалась активация тромбоцитов в покое, подтвержденная связыванием JON-A (активный интегрин αIIbβ₃) и экспрессией P-селектина (Рис. 1G-H). К 21 дню базальная активация была ниже, чем у контрольных мышей.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s-f1.jpg\" alt=\"Рисунок 1. Инфаркт миокарда приводит к усилению обновления тромбоцитов. Мыши перенесли ишемически-реперфузионное (И/Р) п\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Инфаркт миокарда приводит к усилению обновления тромбоцитов. Мыши перенесли ишемически-реперфузионное (И/Р) повреждение с использованием модели закрытой грудной клетки. Функция левого желудочка после И/Р-повреждения оценивалась с помощью эхокардиографии. (A) Фракция выброса определялась в указанные моменты времени после И/Р для подтверждения повреждения миокарда (n=4). (B) Количество тромбоцитов измерялось в цельной крови мышей дикого типа до и после И/Р-повреждения (n=12 (здоровые), 7 (6 ч), 12 (24 ч), 7 (5 сут), 10 (21 сут)). (C) GPIb-положительные тромбоциты в отмытой цельной крови анализировались в отношении размера, определяемого по геометрическому среднему профиля светорассеяния FSC (n=9). (D) Количество ретикулярных тромбоцитов определялось путем окрашивания тиазоловым оранжевым с использованием проточной цитометрии (n=9). (E) Десиалированные тромбоциты анализировались в отношении их профиля связывания с агглютинином Ricinus communis-1 (RCA) (n=9). (F) Апоптотические тромбоциты определялись по связыванию аннексина V (n=6). (G-H) Активация тромбоцитов в указанные моменты времени определялась с использованием антител JON/A-PE, связывающихся с активным интегрином IIb3 (G), и P-селектина в качестве маркера дегрануляции тромбоцитов (H) (n=5-10). Данные представлены в виде средних значений ± стандартная ошибка среднего (SEM). Статистический анализ проводился с использованием обычного однофакторного дисперсионного анализа (ANOVA) с тестом множественных сравнений Тьюки. * p &amp;lt; 0,05, ** p &amp;lt; 0,01, *** p &amp;lt; 0,001.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ОИМ вызывает временное снижение числа тромбоцитов с последующим ускоренным обновлением, активацией и десиалированием в первые 6–24 часа.&lt;br /&gt;\n[!tip] Ретикулярные тромбоциты — это «молодые» формы, недавно вышедшие из костного мозга, их повышенное количество указывает на усиленный тромбопоэз.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"32-povyshenie-ekspressii-trombopoetina-na-rannih-stadiyah-ishemii-i-reperfuzii\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#32-povyshenie-ekspressii-trombopoetina-na-rannih-stadiyah-ishemii-i-reperfuzii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.2 Повышение экспрессии тромбопоэтина на ранних стадиях ишемии и реперфузии&lt;/span&gt;&lt;/a&gt;3.2 Повышение экспрессии тромбопоэтина на ранних стадиях ишемии и реперфузии&lt;/h4&gt;\n&lt;p&gt;Мы проанализировали механизмы восстановления тромбоцитов. Уровень тромбопоэтина (TPO) в плазме был значительно повышен через 24 часа после I/R (Рис. 2A). Поскольку десиалированные тромбоциты связываются с асиалогликопротеиновым рецептором (AMR) в печени, активируя JAK2-STAT3, мы изучили фосфорилирование STAT3. Его активация была значительно повышена через 6 часов после I/R, возвращаясь к норме к 24 часам (Рис. 2B). Экспрессия субъединицы Asgr1 имела тенденцию к росту через 6–24 часа, а субъединица Asgr2 была значительно повышена через 24 часа (Рис. 2C). Также наблюдалась тенденция к росту экспрессии рецептора IL-6 в печени. Экспрессия Tpo в ткани печени была повышена через 6 и 24 часа после I/R, снижаясь к 5–21 дням (Рис. 2C). Наконец, мы обнаружили, что активация пути AMR/IL-6-STAT3-TPO стимулирует мегакариопоэз в селезенке: количество мегакариоцитов было значительно увеличено, при этом соотношение веса селезенки к весу тела не изменилось (Рис. 2D-E).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s-f2.jpg\" alt=\"Рисунок 2. Повышенная экспрессия ТРО на ранних сроках после инфаркта миокарда. (A) Анализ концентраций тромбопоэтина (ТР\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2. Повышенная экспрессия ТРО на ранних сроках после инфаркта миокарда. (A) Анализ концентраций тромбопоэтина (ТРО) в плазме мышей дикого типа до и через 24 ч после И/Р-повреждения (n=4). (B) Ткань всей печени мышей дикого типа анализировалась на фосфорилирование STAT3 в указанные моменты времени после И/Р-повреждения (n=3). (C) Относительная экспрессия генов различных рецепторов, вовлеченных в регуляцию экспрессии Tpo, анализировалась в ткани всей печени мышей дикого типа после И/Р-повреждения в указанные моменты времени (n=3-4). (D) Относительный вес селезенки измерялся после И/Р-повреждения у мышей (n=5-9). (E) Срезы селезенки были приготовлены и окрашены гематоксилином и эозином (H&amp;amp;E) для подсчета общего количества мегакариоцитов на поле зрения (FOV) (n=6). Данные представлены в виде средних значений ± SEM. Статистический анализ проводился с помощью непарного t-критерия Стьюдента (A+E) или обычного однофакторного ANOVA с тестом множественных сравнений Тьюки (B-D). * p &amp;lt; 0,05, ** p &amp;lt; 0,01, *** p &amp;lt; 0,001. Масштабная линейка = 20 мкм. H&amp;amp;E = гематоксилин и эозин; FOV = поле зрения.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ранняя активация сигнального пути AMR-JAK2-STAT3-TPO в печени после ОИМ способствует восстановлению пула тромбоцитов через стимуляцию мегакариопоэза в селезенке.&lt;br /&gt;\n[!warning] Исследование проведено на мышиной модели, что требует осторожности при экстраполяции данных на патофизиологию человека.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"33-ostraya-trombocitopeniya-zapuskaet-megakariopoez-posle-ostrogo-infarkta-miokarda\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#33-ostraya-trombocitopeniya-zapuskaet-megakariopoez-posle-ostrogo-infarkta-miokarda\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.3 Острая тромбоцитопения запускает мегакариопоэз после острого инфаркта миокарда&lt;/span&gt;&lt;/a&gt;3.3 Острая тромбоцитопения запускает мегакариопоэз после острого инфаркта миокарда&lt;/h4&gt;\n&lt;p&gt;Чтобы подтвердить роль десиалированных тромбоцитов в активации сигнального пути AMR-IL6R-STAT3 в печени и оценить влияние тромбоцитопении на оборот тромбоцитов после инфаркта миокарда (ИМ), мы использовали модель мышей с индуцированной тромбоцитопенией. Введение антител, истощающих тромбоциты, позволило снизить их количество до &amp;lt;1% от контрольных значений (Рис. 3A). Масса селезенки при этом не изменилась (Рис. 3B). Уровень цитокина IL-6 в плазме у тромбоцитопенических мышей оказался ниже, что подтверждает ключевую роль тромбоцитов в воспалительном ответе. Уровень тромбопоэтина (TPO) в плазме через 6 часов после ишемии/реперфузии (И/Р) был значимо выше у мышей с тромбоцитопенией по сравнению с контролем (Рис. 3D).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s-f3.jpg\" alt=\"Рисунок 3. Острая тромбоцитопения запускает мегакариопоэз после И/Р-повреждения. Мыши перенесли индуцированное антителам\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Рисунок 3. Острая тромбоцитопения запускает мегакариопоэз после И/Р-повреждения. Мыши перенесли индуцированное антителами истощение тромбоцитов за 24 часа до перевязки LAD. (A) Определение количества тромбоцитов через 6 ч после И/Р-повреждения, обнаруженного в цельной крови мышей (n=10). (B) Определение относительных коэффициентов массы селезенки через 6 ч после И/Р-повреждения у истощенных по тромбоцитам и соответствующих контрольных мышей (n=10). Оценка уровней IL-6 (C) и ТРО (D) в плазме истощенных по тромбоцитам мышей и соответствующих контролей после И/Р-повреждения (n=9-10). (E) Относительная экспрессия генов различных рецепторов, вовлеченных в регуляцию экспрессии Tpo, анализировалась в ткани всей печени истощенных по тромбоцитам мышей и соответствующих контролей до и после И/Р-повреждения (n=4-5). (F) Ткань всей печени анализировалась на фосфорилирование STAT3 в указанные моменты времени с использованием истощенных по тромбоцитам мышей и соответствующих контролей до и после И/Р-повреждения (n=4). Показаны количественная оценка pSTAT3 (левая панель) и репрезентативные вестерн-блоттинги pSTAT3, общего STAT3 и GAPDH (правая панель). (G) Срезы селезенки были приготовлены и окрашены H&amp;amp;E для подсчета общего количества мегакариоцитов на FOV (n=6). Данные представлены в виде средних значений ± SEM. Статистический анализ проводился с помощью непарного t-критерия Стьюдента (A-D), непарного множественного t-теста (E) или двухфакторного ANOVA с тестом множественных сравнений Тьюки (F-G). Звездочки указывают на статистическую разницу между истощением и соответствующими контролями, в то время как ромбы указывают на различия между разными моментами времени до или после МИ в пределах одной группы; *, # p &amp;lt; 0,05, **; ## p &amp;lt; 0,01; **&lt;em&gt;, ### p &amp;lt; 0,001. H&amp;amp;E = гематоксилин и эозин; FOV = поле зрения.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тромбоцитопения снижает уровень IL-6 в плазме, но повышает концентрацию TPO через 6 часов после И/Р, что указывает на компенсаторную реакцию печени.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Экспрессия гена Tpo в печени на исходном уровне была выше у мышей с истощенными тромбоцитами, однако через 6 и 24 часа после И/Р значимых различий между группами не наблюдалось (Рис. 3E). Тем не менее, через 24 часа после И/Р экспрессия Tpo у тромбоцитопенических мышей оставалась высокой, тогда как в контроле она снижалась. Экспрессия субъединиц рецептора асиалогликопротеинов (AMR) Asgr1 и Asgr2 через 6 часов после И/Р была повышена, но к 24 часам у тромбоцитопенических мышей она падала до базовых значений, в отличие от контрольной группы, где снижение было менее выраженным (Рис. 3E). Фосфорилирование STAT3 в печени через 6 часов после И/Р было значимо выше в контрольной группе IgG, чем у мышей с тромбоцитопенией (Рис. 3F). При этом количество мегакариоцитов в селезенке не различалось (Рис. 3G).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на мышиной модели, поэтому прямая экстраполяция на механизмы регуляции тромбоцитов у человека требует осторожности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"34-vliyanie-gpvi-na-regulyaciyu-kolichestva-trombocitov-cherez-pechenochnyj-tpo-signaling-posle-i/r-povrezhdeniya\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#34-vliyanie-gpvi-na-regulyaciyu-kolichestva-trombocitov-cherez-pechenochnyj-tpo-signaling-posle-i/r-povrezhdeniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.4 Влияние GPVI на регуляцию количества тромбоцитов через печеночный TPO-сигналинг после И/Р-повреждения&lt;/span&gt;&lt;/a&gt;3.4 Влияние GPVI на регуляцию количества тромбоцитов через печеночный TPO-сигналинг после И/Р-повреждения&lt;/h4&gt;\n&lt;p&gt;Ранее было показано, что гликопротеин VI (GPVI) играет важную роль в ремоделировании сердца после инфаркта. Мы исследовали, влияет ли GPVI на синтез TPO в печени, сравнивая мышей дикого типа (Gp6+/+) и нокаутных мышей (Gp6-/-). Анализ экспрессии генов Tpo, Asgr1, Asgr2 и Il6r в печени показал, что у обоих генотипов наблюдается зависимое от времени повышение экспрессии Tpo и Asgr1 после И/Р (Рис. 4A-D).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s-f4.jpg\" alt=\"Рисунок 4. Дефицит GPVI не оказывает влияния на выработку тромбопоэтина или активацию STAT3 в ткани печени на ранних сро\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4. Дефицит GPVI не оказывает влияния на выработку тромбопоэтина или активацию STAT3 в ткани печени на ранних сроках после И/Р-повреждения. Дефицит GPVI не оказывает существенного влияния на обновление тромбоцитов после И/Р-повреждения. (A) Оценка ТРО в плазме мышей Gp6+/+ и Gp6-/- через 24 ч после И/Р-повреждения (n=6). (B-E) Относительная экспрессия генов различных рецепторов, вовлеченных в регуляцию экспрессии Tpo, анализировалась в ткани всей печени мышей Gp6+/+ и Gp6-/- до и после И/Р-повреждения (n=3-4). Никаких различий в относительной экспрессии генов Asgr1 (B), Asgr2 (C), IL6r или TPO (E) обнаружено не было. (F) Фосфорилирование STAT3 анализировалось в ткани всей печени мышей Gp6+/+ и Gp6-/- в указанные моменты времени до и после И/Р-повреждения. Показаны репрезентативные вестерн-блоттинги pSTAT3, общего STAT3 и GAPDH (левая панель) и количественная оценка фосфорилирования STAT3 (правая панель) (n=3-8). Данные представлены в виде средних значений ± SEM. Статистический анализ проводился с помощью непарного t-критерия Стьюдента (A) или двухфакторного ANOVA с тестом множественных сравнений Тьюки (B-F).&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нокаут — это генетическая модификация, при которой из организма удаляется или «выключается» конкретный ген для изучения его функции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Фосфорилирование STAT3, ключевого регулятора синтеза TPO, значимо возрастало через 6 часов после И/Р у мышей обеих групп с последующим возвратом к исходным значениям к 24 часам. Статистически значимых различий в активации STAT3 между Gp6+/+ и Gp6-/- мышами не выявлено (Рис. 4E). Таким образом, отсутствие GPVI не оказывает существенного влияния на системный уровень TPO или активацию STAT3 в печени после инфаркта миокарда.&lt;/p&gt;\n&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;p&gt;Гиперреактивность тромбоцитов — хорошо изученный феномен при сердечно-сосудистых патологиях, включая острый инфаркт миокарда (ОИМ), где они усугубляют реперфузионное повреждение. Ускоренный оборот тромбоцитов после ОИМ ведет к росту числа ретикулярных тромбоцитов, связанных с ухудшением отдаленных прогнозов. В нашей работе мы зафиксировали не только увеличение ретикулярных тромбоцитов у дикого типа (WT) мышей в острой фазе после инфаркта на Рис. 1 C+D, но и сдвиг субпопуляций тромбоцитов в сторону повышения частоты старых форм на Рис. 1 E+F. Эти данные указывают на активную регуляцию гемостаза тромбоцитов, вероятно, через печеночный контроль тромбопоэтина (ТПО) после ОИМ. Для проверки механизмов регуляции ТПО и участия тромбоцитов мы применили две модели: истощение тромбоцитов антителами для вызова острой тромбоцитопении и генетически модифицированных мышей с дефицитом GP6⁻/- для оценки хронического отсутствия рецептора GPVI.&lt;/p&gt;\n&lt;p&gt;Печень играет ключевую роль в клиренсе тромбоцитов при тромбовоспалении, контролируя воспалительные реакции и синтез ТПО. Наши результаты показывают, что экспрессия печеночного ТПО значительно возрастает у WT мышей после ОИМ на фоне усиленного pSTAT3-сигнализационного пути. Любопытно, что экспрессия рецептора асиалогликопротеинов (AMR) и IL6R в ткани печени также усиливалась после ОИМ на Рис. 2 B-C, что согласуется с работами о связи сердца и печени через IL-6/STAT3 ось при повреждении миокарда. Эта ось защищает миокард, прямо подавляя минералокортикоидные рецепторы гепатоцитов, усугубляющие исход ОИМ. Поскольку тромбоциты регулируют секрецию IL-6 моноцитами и макрофагами, мы зафиксировали снижение уровня IL-6 в плазме и ослабление фосфорилирования STAT3 у тромбоцитопенических мышей на Рис. 3C. Учитывая влияние десиалирования тромбоцитов на активацию STAT3 через AMR, мы обнаружили усиление десиалирования наряду с pSTAT3 в печени через 6 часов после реперфузии. Следовательно, оборот тромбоцитов регулирует сигнальные пути печени, усиливая тромбовоспаление посредством связывания десиалированных тромбоцитов и иммуномодуляции ткани печени.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;У истощенных по тромбоцитам мышей на фоне падения плазменного IL-6 развилась компенсаторная гиперэкспрессия гена ТПО и рост его уровня в плазме на Рис. 3D-E при сохранении дисрегуляции STAT3 на Рис. 3F.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Помимо сниженного IL-6, тромбоцитопенические мыши демонстрировали компенсаторную upregulation гена ТПО и его уровня в плазме на Рис. 3D-E. Интересно, что подобная компенсация при тромбоцитопении не универсальна и зависит от ее причин: пациенты с иммунной тромбоцитопенией имеют сниженные уровни ТПО, тогда как тромбоцитемия ведет к их росту, ставя под сомнение обратную корреляцию массы тромбоцитов и плазменного ТПО. Однако сигнализация STAT3 у таких мышей оставалась нарушенной, что указывает на сбой динамической регуляции фосфорилирования STAT3 при тромбоцитопении на Рис. 3F.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Десиалирование — это ферментативное удаление остатков сиаловой кислоты с поверхности клеток, ускоряющее их клиренс печенью.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Схожий фенотип недавно описывали в мышиной модели тромбоцитопении, где Notch1-сигнализация управляла продукцией ТПО в печени: у гепатоцит-специфичных Notch1⁻/- мышей наблюдалась тромбоцитопения с ослабленным pSTAT3 и экспрессией ТПО. В отличие от них, наше истощение тромбоцитов показало лишь незначительное влияние на гены, связанные с ТПО, после ОИМ на Рис. 3E, что говорит о большей сложности регуляции STAT3 как вторичного эффекта тромбоцитопении.&lt;/p&gt;\n&lt;p&gt;Напротив, GP6⁻/- мыши не показали значимых сдвигов в рецепторной или ТПО-регуляции в сравнении с WT на Рис. 4A-D, за исключением тонких изменений экспрессии IL6R на ранних сроках ОИМ, вероятно, из-за исходно повышенных базовых уровней в печени GP6⁻/- мышей. Различий в активации STAT3 не выявлено на Рис. 4E. Эти данные согласуются с тем, что дефицит GPVI не меняет острое воспаление после ОИМ, но влияет на долгосрочный ремоделирующий рубец. Таким образом, острое истощение тромбоцитов запускает компенсаторный ответ печеночного ТПО, тогда как хронический дефицит GPVI такого эффекта не дает.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдаемые эффекты ТПО-ответа и сигнализации получены на мышиных моделях острого инфаркта и не всегда полностью повторяются у пациентов с сопутствующими патологиями.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Накапливаются данные о критической роли селезенки в динамике тромбоцитов после ОИМ: высвобождение тромбоцитов из селезенки увеличивает размеры циркулирующих клеток и воспаление. Сигналы CD41 в селезенке падают после ОИМ, указывая на мобилизацию тромбоцитов в кровоток. Учитывая рост оборота тромбоцитов, селезеночные пулы вносят вклад в сдвиги субпопуляций и печеночную регуляцию ТПО. Наша работа также затрагивает вопрос влияния таргетной терапии к GPVI на гомеостаз тромбоцитов. Антиагреганты вроде Ревацепта (GPVI-Fc белок) уменьшают зону инфаркта и улучшают функцию сердца после ОИМ, прерывая контакты тромбоцитов с эндотелием. Однако последствия ингибирования GPVI для продукции тромбоцитов и печеночного ТПО остаются неясными. Учитывая роль GPVI в функциях мегакариоцитов, нужны дальнейшие исследования влияния GPVI-терапий на регенерацию тромбоцитов помимо их тромбопротекторного действия.&lt;/p&gt;\n&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;p&gt;Наша работа открывает новые перспективы в понимании того, как динамически регулируются обновление тромбоцитов и печеночный сигнальный путь тромбопоэтина (ТРО) в ответ на острый инфаркт миокарда (ОИМ). Мы убедительно показываем, что состояние острой тромбоцитопении запускает компенсаторный рост синтеза ТРО в печени, который сопровождается нарушениями в передаче сигналов через STAT3. В то же время хронический дефицит гликопротеина VI (GPVI) не вызывает существенных сдвигов в работе этих механизмов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Острый инфаркт миокарда и вызванная им тромбоцитопения активируют компенсаторный синтез ТРО в печени с нарушениями STAT3, тогда как дефицит GPVI не оказывает заметного влияния на эти процессы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дополнительно полученные данные указывают на то, что высвобождение тромбоцитов из селезенки и общие тромбовоспалительные реакции в организме вносят свой вклад в обновление тромбоцитов и адаптацию печеночной ткани после перенесенного ОИМ. Учитывая все возрастающее значение препаратов, нацеленных на GPVI, в терапии сердечно-сосудистых патологий, последующие научные изыскания должны быть направлены на изучение их влияния на тромбоцитарный гомеостаз, печеночную регуляцию ТРО и отдаленные исходы для сердца.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа выполнена в рамках экспериментальных моделей и требует осторожности при экстраполяции результатов на человека, так как механизмы тромбовоспаления и восстановления у пациентов могут иметь клинические особенности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Глубокое понимание сложных взаимосвязей между тромбоцитами, сигналами печени и селезеночной динамикой тромбоцитов способно существенно усовершенствовать будущие терапевтические подходы. Это позволит эффективнее бороться с тромбовоспалением и одновременно сохранять способность организма к регенерации тромбоцитов после острого инфаркта миокарда.&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"21-zhivotnye\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#21-zhivotnye\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.1 Животные&lt;/span&gt;&lt;/a&gt;2.1 Животные&lt;/h4&gt;\n&lt;p&gt;Все эксперименты проводились в соответствии с принципами ARRIVE и нормами Европейского парламента по работе с лабораторными животными, а также немецким законодательством о защите животных. Протоколы были одобрены Комитетом по уходу за животными Университета Генриха Гейне и правительством Северного Рейна-Вестфалии (разрешения AZ 84-02.04.2015.A558; AZ 81-02.04.2019.A270). В работе использовали только самцов мышей C57BL/6J, полученных из Janvier Labs. Мыши с дефицитом GPVI (Gp6-/-) были получены путем скрещивания гетерозиготных особей, что позволило выделить как гомозиготных нокаутных мышей, так и контрольных дикого типа (Gp6+/+). Животных содержали при температуре 22 ± 1°C с 12-часовым циклом освещения, обеспечивая свободный доступ к корму и воде. Для индукции тромбоцитопении мышам вводили антитела к GPIbα (#R300) или контрольный IgG (#C301) в дозе 2 мкг/г массы тела за 24 часа до лигирования коронарной артерии. Контроль уровня тромбоцитов и состава крови осуществляли на анализаторе Sysmex.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нокаут (Gp6-/-) — это генетическая модификация, при которой ген, отвечающий за синтез белка GPVI, намеренно «выключен» для изучения его роли в функции тромбоцитов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"22-eksperimentalnaya-model-ostrogo-infarkta-miokarda-oim-i-reperfuzii\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#22-eksperimentalnaya-model-ostrogo-infarkta-miokarda-oim-i-reperfuzii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.2 Экспериментальная модель острого инфаркта миокарда (ОИМ) и реперфузии&lt;/span&gt;&lt;/a&gt;2.2 Экспериментальная модель острого инфаркта миокарда (ОИМ) и реперфузии&lt;/h4&gt;\n&lt;p&gt;Для минимизации хирургической травмы использовали модель инфаркта миокарда с закрытой грудной клеткой. Самцов мышей (10–12 недель) анестезировали смесью кетамина (100 мг/кг) и ксилазина (10 мг/кг). Инфаркт вызывали путем 60-минутного лигирования левой передней нисходящей артерии (LAD), подтверждая окклюзию и последующую реперфузию по изменениям ST-сегмента на ЭКГ. Функцию левого желудочка оценивали с помощью эхокардиографии (система Vevo 3100) на 1, 5 и 21 сутки после реперфузии, измеряя фракцию выброса.&lt;/p&gt;\n&lt;h4 id=\"23-izmerenie-kolichestva-trombocitov\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#23-izmerenie-kolichestva-trombocitov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.3 Измерение количества тромбоцитов&lt;/span&gt;&lt;/a&gt;2.3 Измерение количества тромбоцитов&lt;/h4&gt;\n&lt;p&gt;Образцы крови забирали из ретробульбарного венозного сплетения под изофлурановой анестезией (2–3%, 1 л/мин кислорода). Кровь собирали в гепариновый раствор (20 Ед/мл) и анализировали на гематологическом анализаторе Sysmex.&lt;/p&gt;\n&lt;h4 id=\"24-protochnaya-citometriya-trombocitov\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#24-protochnaya-citometriya-trombocitov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.4 Проточная цитометрия тромбоцитов&lt;/span&gt;&lt;/a&gt;2.4 Проточная цитометрия тромбоцитов&lt;/h4&gt;\n&lt;p&gt;Кровь, собранную в гепарин, дважды промывали в буфере Тироде (pH 7,35) при 650 g в течение 5 минут. Для оценки состояния тромбоцитов использовали проточную цитометрию: ретикулярные (молодые) тромбоциты выявляли окрашиванием тиазоловым оранжевым и антителами к GPIbα. Десиалирование тромбоцитов определяли с помощью лектина RCA-1, а экспозицию фосфатидилсерина (PS) — через связывание с Annexin V в присутствии кальция. Анализ данных проводили в программе FlowJo.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Проточная цитометрия — метод анализа клеток в потоке жидкости, позволяющий быстро подсчитать количество специфических маркеров (например, белков на поверхности тромбоцита) и оценить их состояние.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"25-immunogistohimiya-srezov-selezenki\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#25-immunogistohimiya-srezov-selezenki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.5 Иммуногистохимия срезов селезенки&lt;/span&gt;&lt;/a&gt;2.5 Иммуногистохимия срезов селезенки&lt;/h4&gt;\n&lt;p&gt;Селезенки извлекали в разные сроки после инфаркта, фиксировали в парафине и нарезали на срезы толщиной 5 мкм с помощью микротома Microm HM355. После окрашивания гематоксилином и эозином проводили подсчет общего количества мегакариоцитов в поле зрения.&lt;/p&gt;\n&lt;h4 id=\"kolichestvennaya-polimeraznaya-cepnaya-reakciya-v-realnom-vremeni-qrt-pcr-iz-tkani-pecheni\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#kolichestvennaya-polimeraznaya-cepnaya-reakciya-v-realnom-vremeni-qrt-pcr-iz-tkani-pecheni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Количественная полимеразная цепная реакция в реальном времени (qRT-PCR) из ткани печени&lt;/span&gt;&lt;/a&gt;Количественная полимеразная цепная реакция в реальном времени (qRT-PCR) из ткани печени&lt;/h4&gt;\n&lt;p&gt;Для оценки экспрессии генов Tpo, Asgr1 (Clec4h1), Asgr2 (Clec4h2) и рецептора интерлейкина-6 Il6ra брали образцы тотальной РНК печени, выделенные в исходном состоянии, а также через 6 и 24 часа после моделирования инфаркта миокарда. Ткань печени измельчали в 500 мкл холодного реактива Trizol с помощью гомогенизатора Precellys 24-Dual (Bertin, Франкфурт-на-Майне, Германия) и специального набора Precellys Lysing Kit, проводя обработку в течение 30 секунд при скорости 5000 об/мин. Выделение общей РНК осуществляли методом экстракции с использованием смеси Trizol и хлороформа. К лизатам печени добавляли 100 мкл хлороформа, после чего центрифугировали в течение 15 минут при 18000 g и температуре 4°C. Верхнюю водную фазу отбирали и смешивали со 100%-м этанолом для осаждения нуклеиновых кислот. Очистку полученных образцов проводили с применением набора RNAeasy Mini Kit (Qiagen, Хильден, Германия), строго соблюдая рекомендации производителя.&lt;/p&gt;\n&lt;p&gt;Концентрацию и чистоту выделенной тотальной РНК измеряли на спектрофотометре Eppendorf BioPhotometer® D30. Для синтеза кДНК использовали 200 нг РНК в сочетании с набором Reverse Transcription Kit (InPromII Reverse Transcription System; Promega, Вальдорф, Германия). Реакцию обратной транскрипции дополняли этапом количественной амплификации с праймерами на термоциклере, применяя мастер-микс Fast Sybr Green Master Mix (Thermo Fisher Scientific, Уолтем, США). Уровни экспрессии целевых генов нормировали относительно экспрессии РНК фоллистатина-подобного белка 1 (Fstl1), измеренной у интактных контрольных мышей. Обработку и расчеты проводили по методу ΔΔCT.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод qRT-PCR позволяет измерять количество конкретных молекул РНК в режиме реального времени, что дает возможность точно оценить активность работы интересующих нас генов в печени после инфаркта миокарда.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"analiz-metodom-vestern-blottinga-western-blot-tkani-pecheni\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#analiz-metodom-vestern-blottinga-western-blot-tkani-pecheni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ методом вестерн-блоттинга (Western Blot) ткани печени&lt;/span&gt;&lt;/a&gt;Анализ методом вестерн-блоттинга (Western Blot) ткани печени&lt;/h4&gt;\n&lt;p&gt;Чтобы определить уровень общего и фосфорилированного белка STAT3 в печени до и после инфаркта миокарда, использовали специфические первичные антитела: STAT3 (D3Z26) Rabbit mAb (№ 12640) и P-STAT3 (Y705) Rabbit mAb (№ 9145) производства Cell Signaling Technology (Дэнверс, США). Тканевые образцы печени гомогенизировали в лизирующем буфере RIPA (содержащем 150 мМ NaCl, 50 мМ трис-основы, 0,1% SDS, 0,5% дезоксихолата натрия, 1% Triton X-100 и ингибиторы протеаз 1x от Roche, Германия, при pH=8,0). Гомогенизацию выполняли на аппарате Precellys 24-Dual в течение 30 секунд при 5000 об/мин с тем же набором пробирок. Измерив концентрацию белка, образцы доводили до концентрации 50 мкг белка на пробу в восстанавливающем буфере Лэмли, денатурировали в течение 5 минут при температуре 95°C, разделяли методом электрофореза в полиакриламидном геле с SDS и переносили на нитроцеллюлозную мембрану (GE Healthcare, Херкулес, США).&lt;/p&gt;\n&lt;p&gt;Все использованные антитела были приобретены у компании Cell Signaling (Кембридж, Великобритания), а протоколы инкубации соответствовали инструкциям изготовителя. Для визуализации результатов мембраны инкубировали с конъюгированными с пероксидазой антителами кролика IgG козы (GE Healthcare, Чикаго, США) и раствором субстрата Immobilon Western Chemiluminescent HRP Substrate (Bio-Rad, Херкулес, США). В качестве контроля равномерности нанесения белка на дорожки применяли белок GAPDH (клон 14C10, № 2118 от Cell Signaling Technology).&lt;/p&gt;\n&lt;h4 id=\"immunofermentnyj-analiz-elisa\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#immunofermentnyj-analiz-elisa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Иммуноферментный анализ (ELISA)&lt;/span&gt;&lt;/a&gt;Иммуноферментный анализ (ELISA)&lt;/h4&gt;\n&lt;p&gt;Для количественного определения концентрации цитокина IL-6 и тромбопоэтина (TPO) в плазме крови мышей в различные временные интервалы после инфаркта миокарда кровь собирали с гепарином и центрифугировали в течение 10 минут при 650 g для отделения плазмы. Содержание данных цитокинов измеряли строго по протоколам производителей наборов Mouse IL-6 DuoSet ELISA (дискриминационный набор DY406) и Mouse Thrombopoietin DuoSet ELISA (набор DY488), выпущенных компанией R&amp;amp;D Systems.&lt;/p&gt;\n&lt;h4 id=\"statisticheskij-analiz\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#statisticheskij-analiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистический анализ&lt;/span&gt;&lt;/a&gt;Статистический анализ&lt;/h4&gt;\n&lt;p&gt;Все экспериментальные исследования были воспроизведены как минимум в трех независимых биологических повторностях, где за n принималось отдельное животное. Числовые данные в тексте и на графиках представлены в виде средних арифметических значений со стандартной ошибкой среднего (SEM). Для проведения статистических расчетов использовали программное обеспечение GraphPad Prism версии 9.5.1 (GraphPad Software, Сан-Диего, США). При сравнении показателей между двумя группами применяли непарный двусторонний t-критерий Стьюдента или множественные непарные t-тесты. Для анализа трех и более групп использовали однофакторный или двухфакторный дисперсионный анализ (ANOVA) с последующими поправками Тьюки, Сидака или Даннета для множественных сравнений. Статистически значимыми считались различия при уровне значимости P &amp;lt; 0.05. На всех графиках статистическая значимость обозначена звездочками или ромбами (*, # p &amp;lt; 0.05; **, ## p &amp;lt; 0.01; ***, ### p &amp;lt; 0.001).&lt;/p&gt;\n&lt;h4 id=\"tablicy\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#tablicy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Таблицы&lt;/span&gt;&lt;/a&gt;Таблицы&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 1.&lt;/strong&gt; Праймеры для ПЦР&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Ген&lt;/th&gt;\n&lt;th&gt;Прямой праймер&lt;/th&gt;\n&lt;th&gt;Обратный праймер&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Tpo&lt;/td&gt;\n&lt;td&gt;forward 5´CACAGCTGTCCCAAGCAGTA 3´&lt;/td&gt;\n&lt;td&gt;reverse 5´CATTCACAGGTCCGTGTGTC 3`&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Asgr1 (Clec4h1)&lt;/td&gt;\n&lt;td&gt;forward 5´ACGTGAAGCAGTTAGTGTCTG 3´&lt;/td&gt;\n&lt;td&gt;reverse 5´CCTTCATACTCCACCCAGTTG 3´&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Asgr1 (Clec4h2)&lt;/td&gt;\n&lt;td&gt;forward 5´GCTCAGTGGCGATGATG 3´&lt;/td&gt;\n&lt;td&gt;reverse 5´AGAGGCGCTGAGGAAAGG 3´&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Il6ra&lt;/td&gt;\n&lt;td&gt;forward 5´ACCTTCGGCTTCAAAATGCCAGTT 3´&lt;/td&gt;\n&lt;td&gt;reverse 5´CACCTAGAAAACCCTGCTGCGA 3´&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Fstl1&lt;/td&gt;\n&lt;td&gt;forward 5´AGC CCA CGT GCC TCT GCA TT 3´&lt;/td&gt;\n&lt;td&gt;reverse 5´GGC TGG CAG ATG GAC TCG CA 3´&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;регуляция&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тромбоцитов&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;после инфаркта&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;моделирование&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ишемии у мышей&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;открытие оси&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сердце-печень&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;новые мишени&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;для терапии&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не прошёл рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия препринта&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;bioRxiv&lt;/td&gt;\n&lt;td&gt;molecular biology&lt;/td&gt;\n&lt;td&gt;все права у авторов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Reusswig, F.; Tajdar, B.; Gorressen, S.; Fischer, J. W.; Elvers, M.&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-09-23/the-heart-liver-axis-controls-platelet-turnover-by-hepatic-s.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источни
