        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"187\" cy=\"103\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"493\" cy=\"198\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Генная терапия остановила&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;развитие редкого синдрома у&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;мышей&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-f1.jpg\" alt=\"Рисунок 1. Опосредованная AAV экспрессия SIL1 улучшает двигательную функцию и патологию мозжечка у мышей woozy при повсе\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Рисунок 1. Опосредованная AAV экспрессия SIL1 улучшает двигательную функцию и патологию мозжечка у мышей woozy при повсеместной или избирательной экспрессии в клетках Пуркинье. (A, B) Группам гетерозиготных контрольных (CT) и мышей woozy (wz) вводили интрацеревентрикулярно (icv) PBS, AAV-CAG-moSIL1 или AAV-L7-6-moSIL1. Животных еженедельно проверяли на способность ходить по подвешенному бруску. Данные представлены как среднее ± стандартная ошибка среднего (SEM) количества промахов задними лапами (A) и среднего времени пересечения бруска (B). В (A) F(3.543, 31.89) = 17.66, P &amp;lt; 0.0001; в (B) F(4.926, 44.34) = 5.775, P = 0.0004 по двухфакторному дисперсионному анализу с повторными измерениями (RM ANOVA); **P &amp;lt; 0.01, **P &amp;lt; 0.05, ****P &amp;lt; 0.0001 по апостериорному критерию Даннета. (C, D) Иммуногистохимический анализ на кальбиндин (C) или CHOP (D) в срезах мозжечка мышей CT и woozy в возрасте 9 недель. Масштабная шкала 200 мкм. (E, F) Количественная оценка площади, позитивной по кальбиндину, в коре мозжечка (E) и клеток Пуркинье, позитивных по CHOP (F). Данные представляют собой среднее ± SEM. В (E) F(2, 10) = 6.648, P = 0.0146; в (F) F(2, 9) = 33.35, P &amp;lt; 0.0001 по двухфакторному ANOVA; *P &amp;lt; 0.05, ***P &amp;lt; 0.001, ***&lt;em&gt;P &amp;lt; 0.0001 по апостериорному критерию Даннета.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Синдром Марнеско — Шегрена — редкое наследственное заболевание, которое проявляется нарушением координации движений и слабостью мышц из-за дефекта белка SIL1. Исследователи проверили на мышиной модели подход с доставкой здорового гена в центральную нервную систему с помощью аденоассоциированного вируса. Метод позволил предотвратить развитие симптомов и защитить нервные клетки от гибели на протяжении всего периода наблюдения.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Доставка SIL1 вирусным вектором предотвращает развитие атаксии у мышей.&lt;/li&gt;\n&lt;li&gt;Терапия останавливает дегенерацию клеток Пуркинье в мозжечке.&lt;/li&gt;\n&lt;li&gt;Эффект лечения сохраняется на протяжении 26 недель наблюдения.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Заболевание связано с мутациями в гене SIL1, который кодирует белок-помощник для эндоплазматического ретикулума. Без этого белка клетки не справляются с укладкой других белков, что запускает стресс эндоплазматического ретикулума и приводит к гибели мозжечковых нейронов — клеток Пуркинье. Ранее испробованные фармакологические препараты не смогли остановить этот процесс или вызывали токсичные побочные эффекты.&lt;/p&gt;\n&lt;p&gt;В новом исследовании мышам линии woozy с дефектом Sil1 в первые дни жизни (p0) ввели в желудочки мозга вирусные векторы AAV-PHP.eB с геном SIL1. Использовались два варианта: с универсальным промотором и с промотором, активным только в клетках Пуркинье. Доставка гена предотвратила развитие атаксии, снизила уровень маркеров клеточного стресса и сохранила структуру мозжечка.&lt;/p&gt;\n&lt;p&gt;Терапевтический эффект сохранялся в течение всего срока наблюдения — 26 недель. Более того, процедура улучшила состояние мышечной ткани, уменьшив проявления миопатии. Избирательное включение гена только в нейронах мозжечка оказалось достаточным для восстановления нормальной координации движений.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа выполнена на мышиной модели редкого генетического заболевания, поэтому для трансляции метода в клиническую практику требуются дополнительные исследования безопасности и эффективности на крупных животных и людях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Синдром Маринеско — Шегрена представляет собой редкое раннее многосистемное заболевание, ключевыми проявлениями которого выступают мозжечковая атаксия и миопатия. Причиной патологии служат мутации с потерьей функции в гене SIL1, при этом эффективная патогенетическая терапия в настоящее время отсутствует. Авторы работы решили проверить, способна ли генная терапия на базе аденоассоциированных вирусов (AAV) предотвратить развитие заболевания на мышиной модели woozy.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Синдром Маринеско — Шегрена вызывается дефектами гена SIL1 и не имеет лечения, поэтому исследователи применили AAV-векторную генную терапию на мышах модели woozy.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;p&gt;Новорожденным мышам выполняли интрацеребро-вентрикулярные инъекции векторов AAV-PHP.eB, которые несли ген SIL1 под управлением либо убиквитарного (всеобщего), либо специфичного для клеток Пуркинье промотора. Наблюдение за животными и оценка их состояния велись на протяжении 26 недель.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Вектор AAV-PHP.eB — это искусственно созданный вирусный транспортный агент, способный эффективно доставлять терапевтический генетический материал в ткани центральной нервной системы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;p&gt;Контрольные мыши линии woozy, получавшие плацебо, закономерно демонстрировали тяжелые двигательные нарушения, которые сопровождались гибель клеток Пуркинье в мозжечке и активацией путей стресса эндоплазматического ретикулума. Напротив, введение AAV-SIL1 полностью предотвращало развитие атаксии, защищало клетки Пуркинье от гибели и снижало активность стрессовых реакций. Прицельное восстановление экспрессии SIL1 исключительно в клетках Пуркинье оказалось полностью достаточным для нормализации двигательной активности, что доказывает важнейшую роль дисфункции именно этих нейронов в развитии патологии. Достигнутый терапевтический эффект сохранялся на протяжении всего 26-недельного периода наблюдения, а также сопровождался заметным улучшением мышечной функции и уменьшением выраженности мышечных патологий.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эксперименты проведены на мышиной модели (модель woozy), поэтому перед внедрением в клиническую практику необходимы дополнительные трансляционные исследования на более крупных организмах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie1\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#vvedenie1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Синдром Маринско — Шёгрена (MSS) представляет собой редкое аутосомно-рецессивное заболевание, манифестирующее в раннем детстве, для которого на сегодняшний день не существует эффективного лечения. Основными диагностическими критериями MSS являются врожденная катаракта, атрофия мозжечка и миопатия. Кроме того, у пациентов часто наблюдаются интеллектуальные нарушения, интенционный тремор, дизартрия, скелетные аномалии, низкорослость, нистагм, косоглазие и гипергонадотропный гипогонадизм. Первые симптомы обычно проявляются в течение первых месяцев жизни, когда больные младенцы не могут своевременно освоить ранние моторные навыки. В детском возрасте двигательные функции ухудшаются, но после нескольких лет прогрессирования заболевание стабилизируется в непредсказуемом возрасте и при разной степени тяжести, при этом ожидаемая продолжительность жизни остается нормальной.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Синдром Маринско — Шёгрена — это тяжелое врожденное расстройство с катарактой, атаксией и миопатией, стабилизирующееся лишь после периода ранней деградации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Поскольку заболевание прогрессирует в первые годы жизни, раннее вмешательство, способное предотвратить, отсрочить или ослабить это течение, может оказать решающее и долгосрочное влияние на моторную активность и качество жизни пациентов. Приблизительно в 60% случаев причиной MSS являются гомозиготные или компаунд-гетерозиготные мутации в гене SIL1, которые приводят к утрате экспрессии или функции белка SIL1. Спонтанная мутация в гене Sil1 также лежит в основе фенотипа мышей линии woozy (wz) — хорошо охарактеризованной модели, воспроизводящей ключевые проявления человеческого заболевания, включая мозжечковую атаксию с дегенерацией клеток Пуркинье и патологию скелетных мышц.&lt;/p&gt;\n&lt;p&gt;Белок SIL1 функционирует в эндоплазматическом ретикулуме (ЭР) как нуклеотидный обменный фактор для BiP — главного шаперона, регулирующего правильное сворачивание белков. Шаперонная активность BiP управляется циклом связывания и гидролиза ATP. SIL1 ускоряет обмен ADP на ATP на молекуле BiP, обеспечивая высвобождение готовых субстратов. Дефицит SIL1 нарушает этот обмен, вызывая длительное связывание BiP с клиентами, накопление несвернутых белков, стресс ЭР и запуск реакции на нескомпенсированные белки (UPR).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Реакция на нескомпенсированные белки (UPR) — это защитный клеточный ответ на накопление бракованных белков в эндоплазматическом ретикулуме, который при хронической активации может приводить к гибели клеток.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;UPR представляет собой сложный каскад сигнальных путей, направленный на восстановление протеостаза ЭР. Киназа PERK является одним из трех главных эффекторов UPR, наряду с ATF6 и IRE1. Активированная киназа PERK фосфорилирует альфа-субъединицу эукариотического фактора инициации трансляции 2 (eIF2α). Это подавляет трансляцию мРНК и снижает общий синтез белка в клетке. Тем не менее трансляция некоторых специфических мРНК, включая фактор трансляции ATF4, избирательно усиливается. Если клетка не справляется с нагрузкой из несвернутых белков, длительный синтез ATF4 запускает ген CHOP, что приводит к апоптозу. Данный путь особенно губителен для нейронов, зависящих от постоянного синтеза белка для поддержания синапсов и выживания.&lt;/p&gt;\n&lt;p&gt;Ранее было показано, что сигнализация PERK/eIF2α предшествует дегенерации клеток Пуркинье и атаксии у мышей woozy, а также активируется в скелетных мышцах одновременно с началом миопатии. Раннее досимптомное введение ингибитора PERK GSK2606414 задерживало нейродегенерацию и моторные нарушения, продлевало бессимптомную фазу и ослабляло мышечную патологию. Однако применение GSK2606414 сопровождалось токсическим действием на поджелудочную железу и не обеспечивало полного излечения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ингибиторы PERK и другие ранее протестированные соединения (тразодон, ТUDCA) не смогли полностью излечить модель MSS из-за побочных эффектов или неэффективности in vivo.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Стремясь обойти проблему токсичности и используя подход репозиционирования лекарственных средств, исследователи изучили дибензоилметан и тразодон, модулирующие сигнализацию PERK ниже eIF2α. Однако эти соединения оказались неэффективными на модели woozy и не предотвратили моторные дефициты или гибель клеток Пуркинье. Аналогичным образом тауроурсодезоксихолевая кислота — химический шаперон, одобренный при билиарном циррозе и показавший эффективность на клеточной модели MSS — не оказала никакого терапевтического действия на мышей woozy.&lt;/p&gt;\n&lt;p&gt;Поскольку большинство случаев MSS вызывают мутации потери функции в гене SIL1, восстановление уровня SIL1 представляет собой более прямую терапевтическую стратегию, устраняющую первопричину дефекта, а не его следствия. В связи с этим авторы переключили внимание на методы генной терапии. Рекомбинантные векторы на основе аденовирус-ассоциированного вируса (AAV) оптимально подходят для этой цели, так как обеспечивают стабильную экспрессию трансгена в постмитотических тканях, таких как ЦНС и скелетные мышцы, и обладают благоприятным профилем безопасности в доклинических и клинических исследованиях. Более того, успехи в инженерии капсидов существенно повысили эффективность доставки генов в ЦНС.&lt;/p&gt;\n&lt;p&gt;В настоящем исследовании авторы оценили, способно ли неонатальное интрацеребро-вентрикулярное введение векторов AAV, экспрессирующих SIL1, предотвратить развитие мозжечковой и мышечной патологии и обеспечить долгосрочный функциональный эффект на модели мышей MSS (woozy). Также было исследовано, может ли селективное восстановление экспрессии SIL1 исключительно в клетках Пуркинье устранить дисфункцию мозжечка, решая тем самым клеточные задачи нейродегенерации при MSS.&lt;/p&gt;\n&lt;h3 id=\"rezultaty1\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#rezultaty1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"aav-vektory-obespechivayut-effektivnuyu-i-selektivnuyu-po-tipam-kletok-ekspressiyu-sil1-s-pravilnoj-lokalizaciej-v-endoplazmaticheskom-retikulume\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#aav-vektory-obespechivayut-effektivnuyu-i-selektivnuyu-po-tipam-kletok-ekspressiyu-sil1-s-pravilnoj-lokalizaciej-v-endoplazmaticheskom-retikulume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AAV векторы обеспечивают эффективную и селективную по типам клеток экспрессию SIL1 с правильной локализацией в эндоплазматическом ретикулуме&lt;/span&gt;&lt;/a&gt;AAV векторы обеспечивают эффективную и селективную по типам клеток экспрессию SIL1 с правильной локализацией в эндоплазматическом ретикулуме&lt;/h4&gt;\n&lt;p&gt;Исследователи создали аденовирусные векторы (AAV), содержащие кДНК мышиного (mo) или человеческого (hu) SIL1 под управлением вездесущего промотора CAG путем замены последовательности зеленого флуоресцентного белка (GFP) в плазмиде pAAV-CAG-GFP. Чтобы проверить, достаточно ли избирательного восстановления экспрессии SIL1 в клетках Пуркинье (PCs) для устранения мозжечковой дисфункции, были созданы векторы AAV, экспрессирующие moSIL1 или GFP под управлением специфичного для PCs промотора L7-6.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AAV (аденоассоциированные вирусы) — это безопасные вирусные векторы, которые часто применяются для доставки генетического материала в клетки и ткани в научных и терапевтических целях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для проверки работоспособности капсиды AAV9 и AAV-PHP.eB (далее PHP.eB) были протестированы на эмбриональных фибробластах мышей линии woozy (MEF), у которых полностью отсутствует эндогенный белок SIL1. Оба варианта векторов — AAV9-CAG-moSIL1 и PHP.eB-CAG-moSIL1 — успешно индуцировали экспрессию SIL1, причем вариант PHP.eB продемонстрировал более высокую общую эффективность на Рис. S1A. Ожидаемо, вектор AAV9-L7-6-moSIL1 не вызывал экспрессию SIL1 в фибробластах, что подтверждает строгую специфичность промотора L7-6 именно для клеток Пуркинье.&lt;/p&gt;\n&lt;p&gt;Иммунофлуоресцентный анализ продемонстрировал, что трансгенный белок SIL1 совмещается с маркером эндоплазматического ретикулума (ЭР) PDI на Рис. S1B, но не пересекается с маркером аппарата Гольджи GM130 на Рис. S1C. Это подтверждает правильное внутриклеточное распределение созданного белка. Синтезированный с помощью AAV белок SIL1 оказался чувствителен к дегликозилированию ферментами PNGase F и Endo H. Чувствительность к Endo H доказывает наличие незрелых N-гликанов с высоким содержанием маннозы, что характерно для белков, удерживаемых внутри эндоплазматического ретикулума, как показано на Рис. S2.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AAV векторы с промоторами CAG и L7-6 успешно запускают синтез SIL1 с правильной локализацией в эндоплазматическом ретикулуме и высокой избирательностью в отношении клеток Пуркинье.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для подтверждения того, что промотор L7-6 управляет экспрессией целевого гена исключительно в клетках Пуркинье, культивируемые органотипические срезы мозжечка (COCS) заразили векторами AAV9-CAG-GFP или AAV9-L7-6-GFP. Вектор AAV9-CAG-GFP привел к широкому распространению зеленой метки, в то время как в срезах COCS, обработанных AAV9-L7-6-GFP, сигнал GFP локализовался исключительно в кальбиндин-положительных клетках Пуркинье на Рис. S3C, подтверждая высокую избирательность промотора L7-6 для этих нейронов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эксперименты проводились на клеточных линиях и органотипических срезах мозжечка грызунов, поэтому для окончательной оценки терапевтического эффекта требуются дальнейшие исследования на целостных организмах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ методом вестерн-блоттинга срезов COCS мышей woozy, трансдуцированных векторами PHP.eB-CAG-SIL1 или PHP.eB-L7-6-SIL1, подтвердил появление белка SIL1 в обоих случаях. При этом уровень экспрессии в срезах, обработанных вектором PHP.eB-L7-6-SIL1, был заметно ниже на Рис. S4, что полностью согласуется со специфичным ограничением синтеза белка только клетками Пуркинье.&lt;/p&gt;\n&lt;p&gt;Мыши линии woozy начинают проявлять признаки атаксии в возрасте 6-7 недель по тесту на узком мостике и в 9-10 недель по ускоряющемуся ротароду, причем двигательные нарушения нарастают до 16 недель, после чего стабилизируются. Дегенерация клеток Пуркинье (КП) стартует на 7-8 неделях и к 16 неделям достигает практически полной гибели. В серии предварительных экспериментов авторы проверяли, способна ли неонатальная инъекция AAV предотвратить моторные дисфункции и раннюю нейродегенерацию в первые 9 недель жизни (Рис. S5A).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Внутримозговые инъекции новорожденным мышам позволяют доставлять генетический материал в центральную нервную систему с помощью безопасных вирусов (AAV), а метод лазерной микродиссекции помогает выделять конкретные типы клеток для анализа их РНК.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для эффективного переноса генов в ЦНС применяли инъекции в боковые желудочки мозга новорожденным мышам (P0). Использование промотора CAG обеспечивало широкий синтез зеленого флуоресцентного белка (GFP) по всей ЦНС, тогда как промотор L7-6 ограничивал его только клетками Пуркинье (Рис. S6A). GFP экспрессировался преимущественно в нейронах (Рис. S7), а в мозжечке локализовался в КП даже при работе универсального промотора CAG (Рис. S6). Капсид PHP.eB продемонстрировал более высокую эффективность трансдукции по сравнению с AAV9 при равных вирусных титрах (Рис. S6), поэтому все дальнейшие опыты проводили с ним.&lt;/p&gt;\n&lt;p&gt;Для сопоставления эффектов глобального и специфичного для КП синтеза SIL1 гетерозиготным мышам (CT) и больным мышам woozy в возрасте P0 вводили в латеральные желудочки мозга 10¹¹ векорных геномов на мышь (10¹¹ vg/mouse) векторов PHP.eB-CAG-moSIL1, PHP.eB-L7-6-moSIL1 или контрольный буфер (PBS). Мышей еженедельно тестировали на узком мостике, а в 9 недель забивали для биохимического анализа и иммуногистохимии мозга (Рис. S5A). Другие группы мышей с PBS или PHP.eB-CAG-moSIL1 умерщвляли в 6- недельном возрасте для оценки маркеров стресса развернутого ответа эндоплазматического ретикулума (UPR) в клетках Пуркинье, выделенных с помощью лазерной микродиссекции (LCM), поскольку ранее у интактных woozy в этот период фиксировался пик активации UPR (Рис. S5A).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Инъекция векторов с SIL1 в дозе 10¹¹ vg/mouse новорожденным мышам woozy полностью предотвращает моторные нарушения на мостике, сопоставимые с показателями здоровых мышей линии CT.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;До 5-недельного возраста различий в прохождении мостика между группами не отмечалось (Рис. 1, A и B). Начиная с 6 недель, контрольные мыши woozy с PBS демонстрировали резкое увеличение числа оступаний (Рис. 1A) и времени пересечения мостика (Рис. 1B) относительно гетерозиготных особей. Мыши woozy, получившие AAV с SIL1 (универсально или адресно в КП), показывали выраженное и сопоставимое улучшение двигательных навыков, не отличаясь от контроля на протяжении всего эксперимента.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-f1.jpg\" alt=\"Рисунок 1. Опосредованная AAV экспрессия SIL1 улучшает двигательную функцию и патологию мозжечка у мышей woozy при повсе\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Рисунок 1. Опосредованная AAV экспрессия SIL1 улучшает двигательную функцию и патологию мозжечка у мышей woozy при повсеместной или избирательной экспрессии в клетках Пуркинье. (A, B) Группам гетерозиготных контрольных (CT) и мышей woozy (wz) вводили интрацеревентрикулярно (icv) PBS, AAV-CAG-moSIL1 или AAV-L7-6-moSIL1. Животных еженедельно проверяли на способность ходить по подвешенному бруску. Данные представлены как среднее ± стандартная ошибка среднего (SEM) количества промахов задними лапами (A) и среднего времени пересечения бруска (B). В (A) F(3.543, 31.89) = 17.66, P &amp;lt; 0.0001; в (B) F(4.926, 44.34) = 5.775, P = 0.0004 по двухфакторному дисперсионному анализу с повторными измерениями (RM ANOVA); **P &amp;lt; 0.01, **P &amp;lt; 0.05, ****P &amp;lt; 0.0001 по апостериорному критерию Даннета. (C, D) Иммуногистохимический анализ на кальбиндин (C) или CHOP (D) в срезах мозжечка мышей CT и woozy в возрасте 9 недель. Масштабная шкала 200 мкм. (E, F) Количественная оценка площади, позитивной по кальбиндину, в коре мозжечка (E) и клеток Пуркинье, позитивных по CHOP (F). Данные представляют собой среднее ± SEM. В (E) F(2, 10) = 6.648, P = 0.0146; в (F) F(2, 9) = 33.35, P &amp;lt; 0.0001 по двухфакторному ANOVA; *P &amp;lt; 0.05, ***P &amp;lt; 0.001, ***&lt;em&gt;P &amp;lt; 0.0001 по апостериорному критерию Даннета.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Количественная иммуногистохимия с антителами к кальбиндину (специфический маркер КП) показала уменьшение кальбиндин-положительной площади у мышей woozy с PBS на 27% по сравнению с контролем (Рис. 1, C и E). Лечение векторами PHP.eB с промоторами CAG или L7-6 достоверно сохраняло эту площадь. Анализ с антителами к CHOP выявил значительное падение доли CHOP-положительных КП у леченых мышей по сравнению с группой PBS (Рис. 1, D и F). Цифровая капельная ПЦР (ddPCR) мРНК BiP, ATF4 и CHOP в изолированных КП на 6-й неделе подтвердила снижение уровней всех трех маркеров у мышей woozy, леченных PHP.eB-CAG-moSIL1 (Рис. S8).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Данные получены на лабораторных мышах с генетической патологией, а степень экспрессии трансгенов варьирует в зависимости от использованного промотора и вирусного серотипа.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Вестерн-блоттинг (WB) подтвердил синтез мышиного SIL1 в больших полушариях и мозжечке мышей после PHP.eB-CAG-moSIL1 (Рис. S9A). В случае PHP.eB-L7-6-moSIL1 белок находился почти исключительно в мозжечке в меньших количествах, что ожидаемо для промотора L7-6 (Рис. S9B). По данным ddPCR, уровень мРНК трансгенного SIL1 в изолированных КП мышей с PHP.eB-CAG-moSIL1 превосходил уровень у контрольных гетерозиготных мышей примерно в 4 раза, что соответствует двукратному росту относительно нормальных эндогенных значений дикого типа (Рис. S8).&lt;/p&gt;\n&lt;p&gt;Для проверки возможности терапевтического эффекта при экспрессии человеческого аналога белка эксперимент повторили с векторами, несущими huSIL1 или moSIL1. Для контроля специфичности эффекта группу woozy инъектировали вектором PHP.eB-CAG-GFP. Мыши с GFP демонстрировали нарастание атаксии с 6-7 недель: частые оступания и замедленное прохождение мостика в сравнении с гетерозиготными животными (Рис. 2, A и B). Мыши с moSIL1 или huSIL1 ходили по мостику так же успешно, как и здоровые мыши CT (Рис. 2, A и B). Иммуногистохимия на кальбиндин и CHOP в 9 недель подтвердила защиту КП и снижение числа CHOP-положительных клеток при введении обоих вариантов SIL1 (Рис. 2, C-F).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-f2.jpg\" alt=\"Рисунок 2. Неонатальная интрацеревентрикулярная инъекция AAV, кодирующих мышиный или человеческий SIL1, предотвращает ра\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Рисунок 2. Неонатальная интрацеревентрикулярная инъекция AAV, кодирующих мышиный или человеческий SIL1, предотвращает развитие двигательных нарушений и дегенерации клеток Пуркинье у мышей woozy. (A, B) Новорожденным мышам woozy и гетерозиготным (CT) помётам вводили icv PHP.eB-CAG-GFP, PHP.eB-CAG-moSIL1 или PHP.eB-CAG-huSIL1 (1011 вг/мышь) и еженедельно проверяли их способность ходить по подвешенному бруску, начиная с четырехнедельного возраста. Данные представляют собой среднее ± SEM количества промахов задними лапами (A) и времени, необходимого для пересечения бруска (B). В (A) F(5.605, 50.44) = 8.614, P &amp;lt; 0.0001; в (B) F(5.356, 48.21) = 3.966, P = 0.0036 по двухфакторному RM ANOVA; *P &amp;lt; 0.05, **P &amp;lt; 0.01, ***P &amp;lt; 0.001 по апостериорному критерию Даннета. (C, D) Иммуногистохимический анализ на кальбиндин (C) или CHOP (D) в срезах мозжечка мышей CT и woozy в возрасте недель. Масштабная шкала 200 мкм. (E, F) Количественная оценка площади, позитивной по кальбиндину, в коре мозжечка (E) и клеток Пуркинье, позитивных по CHOP (F). Данные представляют собой среднее ± SEM. В (E) F(2, 8) = 12.50, P = 0.0035; в (F) F(2, 10) = 6.942, P = 0.0129 по двухфакторному ANOVA; *P &amp;lt; 0.05, *&lt;em&gt;P &amp;lt; 0.01 по апостериорному критерию Даннета.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Вестерн-блоттинг гомогенатов мозжечка показал, что уровень мышиного SIL1 составлял около 1.5 от эндогенной нормы дикого типа, в то время как терапия huSIL1 приводила к выраженному избыточному синтезу человеческого SIL1 (примерно в 6 раз выше эндогенного уровня дикого типа) (Рис. 3).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-f3.jpg\" alt=\"Рисунок 3. Интрацеревентрикулярная инъекция PHP.eB-CAG-huSIL1 и PHP.eB-CAG-moSIL1 индуцирует устойчивую экспрессию транс\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3. Интрацеревентрикулярная инъекция PHP.eB-CAG-huSIL1 и PHP.eB-CAG-moSIL1 индуцирует устойчивую экспрессию трансгена в мозжечке. (A) Вестерн-блот-анализ SIL1, GFP и GAPDH в гомогенатах мозжечка мышей CT и woozy, инъецированных icv в P0 PHP.eB-CAG-GFP, PHP.eB-CAG-huSIL1 или PHP.eB-CAG-moSIL1 в возрасте 9 недель. (B) Уровни SIL1 количественно определяли с помощью денситометрии, нормализовали по уровню GAPDH и откладывали на график относительно количества эндогенного SIL1 у мышей CT, инъецированных PHP.eB-CAG-GFP. Данные представляют собой среднее ± SEM для 2-3 животных в группе.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"aav,-kodiruyushie-myshinyj-ili-chelovecheskij-sil1,-obespechivayut-dolgosrochnuyu-zashitu-ot-mozzhechkovoj-ataksii-i-degeneracii-kletok-purkine\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#aav,-kodiruyushie-myshinyj-ili-chelovecheskij-sil1,-obespechivayut-dolgosrochnuyu-zashitu-ot-mozzhechkovoj-ataksii-i-degeneracii-kletok-purkine\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AAV, кодирующие мышиный или человеческий SIL1, обеспечивают долгосрочную защиту от мозжечковой атаксии и дегенерации клеток Пуркинье&lt;/span&gt;&lt;/a&gt;AAV, кодирующие мышиный или человеческий SIL1, обеспечивают долгосрочную защиту от мозжечковой атаксии и дегенерации клеток Пуркинье&lt;/h4&gt;\n&lt;p&gt;Чтобы выяснить, сохраняется ли терапевтический эффект AAV-терапии в долгосрочной перспективе, эксперимент был повторен с наблюдением животных до 26-недельного возраста (Рис. S5B), что также позволило оценить возможные побочные эффекты на хронических стадиях. Анализ прохождения по бруску в течение первых 9 недель подтвердил защитное действие терапии на развитие двигательных нарушений (Рис. 4, A и B; Movie S1). По истечении этого периода мыши линии woozy, получавшие плацебо, полностью теряли способность выполнять тест, волоча задние конечности и часто падая с бруска. В то же время мыши woozy, получавшие AAV, продолжали справляться с тестом без ухудшения результатов, демонстрируя показатели, сопоставимые с контрольными мышами CT (Рис. 4, A и B; Movie S2).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-f4.jpg\" alt=\"Рисунок 4. Интрацеревентрикулярная инъекция PHP.eB-CAG-moSIL1 и PHP.eB-CAG-huSIL1 новорожденным мышам woozy обеспечивает\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Рисунок 4. Интрацеревентрикулярная инъекция PHP.eB-CAG-moSIL1 и PHP.eB-CAG-huSIL1 новорожденным мышам woozy обеспечивает длительную защиту от двигательной дисфункции. (A) Новорожденным мышам woozy и гетерозиготным (CT) помётам вводили icv PBS, PHP.eB-CAG-moSIL1 или PHP.eB-CAG-huSIL1 и проверяли их способность ходить по подвешенному бруску, начиная с четырехнедельного возраста. Мышей тестировали еженедельно до 9-недельного возраста, после чего мыши woozy, получавшие PBS, становились неспособными выполнять тест. Мыши, принадлежащие к другим группам, были повторно протестированы в возрасте 12, 16, 20 и 24 недель. Столбцы показывают среднее ± SEM количества промахов задними лапами (A) и времени, необходимого для пересечения бруска (B). В (A) F(4.420, 44.20) = 7.994, P &amp;lt; 0.0001; в (B) F(6.050, 60.50) = 5.038, P = 0.0003 по двухфакторному RM ANOVA (1-9 недель); *P &amp;lt; 0.05, **P &amp;lt; 0.01, ***P &amp;lt; 0.001, ****P &amp;lt; 0.0001 по апостериорному критерию Даннета; (C) Те же животные тестировались в 4-недельном возрасте (исходный уровень), а затем еженедельно с 9-недельного возраста на ускоряющемся ротароде. Столбцы показывают среднее ± SEM времени до падения (с). F(3.169, 30.10) = 26.62, P &amp;lt; 0.0001; *P &amp;lt; 0.05, **P &amp;lt; 0.01, ***P &amp;lt; 0.001, ***&lt;em&gt;P &amp;lt; 0.0001 по апостериорному критерию Даннета. Легенда в (A) применима ко всем панелям.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Долгосрочная AAV-терапия мышей woozy мышиными или человеческими генами SIL1 полностью предотвращает развитие двигательных нарушений и атаксии, сохраняя показатели на уровне здоровых контрольных животных даже к 26 неделям жизни.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Этот долгосрочный эффект подтвердился в ускоренном тесте на вращающемся стержне (rotarod), который менее требователен и выполним для мышей woozy на поздних стадиях болезни. Как отмечалось ранее (Grande et al, 2018), у мышей woozy с инъекцией PBS наблюдалось прогрессирующее снижение латентного времени падения с последующей стабилизацией (Рис. 4C). Напротив, показатели мышей woozy, пролеченных AAV с кодированием moSIL1 или huSIL1, неотличимы от результатов контрольных групп CT (Рис. 4C).&lt;/p&gt;\n&lt;p&gt;Прогрессирующий тремор представляет собой часть неврологического фенотипа мышей woozy (Zhao et al, 2005). Слабый тремор впервые проявляется к 10 неделям при ходьбе по подвешенному бруску, а с возрастом усиливается и становится заметен на ровной поверхности (Grande et al, 2018). Оценку тремора у мышей woozy проводили в 20 и 26 недель. В оба временных интервала все девять мышей из группы с плацебо имели тяжелый тремор, в то время как ни у одной из 13 мышей, пролеченных AAV, не наблюдалось видимого тремора даже при ходьбе по подвешенному бруску.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Имуногистохимия — метод выявления специфических белков в тканях с помощью меченых антител; в данном случае маркер кальбиндин использовался для подсчета клеток Пуркинье.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В возрасти 26 недель иммуногистохимия на кальбиндин продемонстрировала полную утрату клеток Пуркинье у мышей woozy, получавших PBS (Рис. 5, A и B). Морфометрический анализ также выявил выраженное истончение молекулярного слоя коры мозжечка у этих животных (Рис. 5C). Напротив, у мышей woozy, получавших AAV, отмечено значительное сохранение как клеток Пуркинье, так и толщины молекулярного слоя (Рис. 5). Более того, в клетках Пуркинье пролеченных мышей не обнаруживалось активации CHOP (Рис. S10), что согласуется с устойчивым подавлением стресса эндоплазматического ретикулума и долгосрочной нейропротекцией.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-f5.jpg\" alt=\"Рисунок 5. Интрацеревентрикулярная инъекция PHP.eB-CAG-moSIL1 и PHP.eB-CAG-huSIL1 предотвращает дегенерацию клеток Пурки\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Рисунок 5. Интрацеревентрикулярная инъекция PHP.eB-CAG-moSIL1 и PHP.eB-CAG-huSIL1 предотвращает дегенерацию клеток Пуркинье у мышей woozy. (A) Иммуногистохимический анализ на кальбиндин у мышей CT или woozy, получавших PBS, PHP.eB-CAG-moSIL1 или PHP.eB-CAG-huSIL1, в возрасте 26 недель. Масштабная шкала 100 мкм. (B) Процент площади, положительной по кальбиндину, в коре мозжечка. Данные представляют собой среднее ± SEM 3 срезов мозга от 5-6 мышей в экспериментальной группе. F(2, 7) = 20.98, P = 0.0011 по двухфакторному ANOVA; **P &amp;lt; 0.01, ***P &amp;lt; 0.001 по апостериорному критерию Даннета. (C) Толщина молекулярного слоя. Данные представляют собой среднее ± SEM. F(2, 7) = 56.45, P &amp;lt; 0.0001 по двухфакторному ANOVA; ***P &amp;lt; 0.001, ***&lt;em&gt;P &amp;lt; 0.0001 по апостериорному критерию Даннета.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Для дальнейшей оценки влияния генной терапии SIL1 на патологию мозжечка на 26-й неделе было исследовано астроцитарное воспаление посредством иммуноокрашивания на GFAP. Мыши woozy с PBS демонстрировали выраженную иммунореактивность GFAP во всей коре мозжечка, что указывает на выраженный астроглиоз (Рис. 6). У пролеченных AAV мышей woozy иммунореактивность GFAP была значительно снижена, приближаясь к уровню гетерозиготных контролей (Рис. 6). Эти данные показывают, что доставка SIL1 с помощью AAV не только сохраняет клетки Пуркинье, но и ослабляет реактивный ответ астроцитов.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-f6.jpg\" alt=\"Рисунок 6. Внутрижелудочковое введение PHP.eB-CAG-moSIL1 и PHP.eB-CAG-huSIL1 снижает активацию астроцитов. (A) Иммуногис\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Рисунок 6. Внутрижелудочковое введение PHP.eB-CAG-moSIL1 и PHP.eB-CAG-huSIL1 снижает активацию астроцитов. (A) Иммуногистохимический анализ на GFAP у мышей линий CT или woozy, получавших PBS, PHP.eB-CAG-moSIL1 или PHP.eB-CAG-huSIL1, в возрасте 26 недель. Масштабная линейка 100 мкм. (B) Процент площади, позитивной по GFAP, в молекулярном слое коры мозжечка. Данные представляют собой среднее значение ± стандартная ошибка среднего (SEM) для 3 срезов мозга от 4-8 мышей в каждой экспериментальной группе. P &amp;lt; 0.0001 по тесту Краскела-Уоллиса; **&lt;em&gt;P &amp;lt; 0.001 по апостериорному тесту Данна.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"lechenie-s-ispolzovaniem-aav-uluchshaet-myshechnuyu-silu-i-umenshaet-ultrastrukturnuyu-patologiyu-myshc\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#lechenie-s-ispolzovaniem-aav-uluchshaet-myshechnuyu-silu-i-umenshaet-ultrastrukturnuyu-patologiyu-myshc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Лечение с использованием AAV улучшает мышечную силу и уменьшает ультраструктурную патологию мышц&lt;/span&gt;&lt;/a&gt;Лечение с использованием AAV улучшает мышечную силу и уменьшает ультраструктурную патологию мышц&lt;/h4&gt;\n&lt;p&gt;Мыши woozy развивают тяжелую прогрессирующую миопатию скелетных мышц, которая впервые выявляется с 16 недель с помощью электронной микроскопии и приводит к нарушению функции мышц в более позднем возрасте (Grande et al, 2018; Roos et al, 2014). Интересно, что тесты на подвешивании за решетку и на силу хватки показали улучшение мышечной выносливости и силы у мышей woozy, получавших PHP.eB-CAG-SIL1, по сравнению с контролем PBS (Рис. 7), предполагая пользу интрацистерножелудочковой (icv) инъекции AAV для патологии скелетных мышц.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-f7.jpg\" alt=\"Рисунок 7. Мыши линии woozy, получившие инъекцию PHP-CAG-SIL1, демонстрируют улучшение мышечной функции. Животные, получ\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Рисунок 7. Мыши линии woozy, получившие инъекцию PHP-CAG-SIL1, демонстрируют улучшение мышечной функции. Животные, получавшие PBS, PHP.eB-CAG-moSIL1 и PHP.eB-CAG-huSIL1, были протестированы в тестах с удержанием на сетке (A) и силы схватывания (B) в возрасте 20 и 25 недель соответственно. Данные представляют собой среднее значение ± SEM. В (A): P &amp;lt; 0.0001 по тесту Краскела-Уоллиса; ***P &amp;lt; 0.001 по апостериорному тесту Данна. В (B): P = 0.0033 по тесту Краскела-Уоллиса; &lt;em&gt;P &amp;lt; 0.05 по апостериорному тесту Данна.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдаемые эффекты получены на мышиной модели редкого заболевания, и хотя вектор проникает в периферические ткани через icv-введение, трансляция результатов на человека требует клинических подтверждений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для проверки этого мы проанализировали четырехглавые мышцы (quadriceps) методами гистологии и трансмиссионной электронной микроскопии (TEM). Как сообщалось ранее (Roos et al, 2014; Buchkremer et al, 2016), светимостная микроскопия выявила высокий процент мышечных волокон с не-подуздочными (не-подсарколеммальными) ядрами у мышей woozy с PBS, что указывает на хроническое миопатическое ремоделирование из-за повторяющихся циклов дегенерации и регенерации. Этот процент был заметно снижен у мышей woozy, пролеченных AAV с мышиным или человеческим SIL1 (Рис. S11). Анализ TEM выявил ряд ультраструктурных изменений в мышечных волокнах мышей woozy с PBS, отсутствовавших у контролей: расширение саркоплазматического ретикулума и перинаклеарные аутофагические вакуоли с миелиноподобным материалом (Рис. 8A, панели ii и vi). У пролеченных AAV мышей эти изменения были выражены значительно слабее (Рис. 8A, панели iii, iv, vii и viii), что подтверждено количественным анализом (Рис. 8B).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s-f8.jpg\" alt=\"Рисунок 8. Введение AAV-SIL1 ослабляет ультраструктурные изменения в волокнах четырехглавой мышцы бедра у мышей линии wo\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Рисунок 8. Введение AAV-SIL1 ослабляет ультраструктурные изменения в волокнах четырехглавой мышцы бедра у мышей линии woozy. (A) Ультраструктура четырехглавой мышцы бедра мышей, получавших PBS и AAV, в возрасте 26 недель. Представительные примеры нормальной ультраструктуры миофибриллярных (i) и перинуклеарных (v) мышечных волокон у контрольных (CT) мышей, получавших PBS; патологическое увеличение саркоплазматического ретикулума в миофибриллярном компартменте мыши woozy, получавшей носитель (ii) или AAV, кодирующие мышиный (iii) или человеческий (iv) SIL1; перинуклеарные аутофагические вакуоли, содержащие миелиноподобный мембранный материал (белые стрелки), в скелетной мышце мыши woozy, получавшей PBS (vi) или AAV, кодирующие мышиный (vii) или человеческий (viii) SIL1. Масштабная линейка 1 мкм. (B) Процент миофибриллярной площади, занятой саркоплазматическим ретикулумом (SR), в различных группах мышей. Данные представляют собой среднее значение ± SEM. F(3, 8) = 101.7, P &amp;lt; 0.0001 по двуфакторному дисперсионному анализу (ANOVA); ****P &amp;lt; 0.0001 по апостериорному тесту Даннетта. (C) Процент ядер с перинуклеарными ультраструктурными изменениями. Данные представляют собой среднее значение ± SEM. F(3, 8) = 45.75, P &amp;lt; 0.0001 по двуфакторному дисперсионному анализу (ANOVA); ***&lt;em&gt;P &amp;lt; 0.0001 по апостериорному тесту Даннетта.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Чтобы оценить, связано ли улучшение с экспрессией трансгенного SIL1 в скелетных мышцах, мы проанализировали ткани с помощью вестерн-блоттинга (WB). Соответственно данным о том, что icv-введение AAV может достигать периферических тканей (Armbruster et al, 2016; Rioux et al, 2026), экспрессия трансгенного SIL1 определялась в скелетных мышцах. Хотя уровни SIL1 в четырехглавой мышце пролеченных мышей были существенно ниже, чем в головном мозге, они сопоставимы с эндогенными уровнями у контрольных мышей CT (Рис. S12).&lt;/p&gt;\n&lt;p&gt;Важно отметить, что устойчивый терапевтический эффект не сопровождался признаками токсичности лечения. Пролеченные AAV мыши CT и woozy демонстрировали нормальное поведение в течение всего исследования, а параметры сыворотки крови, измеренные на 26 неделе, находились в пределах нормы (Таблица S1).&lt;/p&gt;\n&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;p&gt;Данная работа была нацелена на проверку метода генной терапии при синдроме Маринеско — Шегрена (MSS) — редком и тяжелом заболевании раннего детского возраста, от которого до сих пор нет патогенетического лечения. Мы выяснили, что неонатальное введение векторов AAV с диким типом гена SIL1 в желудочки мозга предотвращает развитие атаксии, ослабляет дегенерацию мозжечка (что подтверждается сохранением клеток Пуркинье и снижением астроглиоза), а также улучшает состояние скелетных мышц и уменьшает их патологические изменения на мышиной модели woozy.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Неонатальное введение AAV-SIL1 мышам линии woozy предотвратило развитие атаксии, сохранило клетки Пуркинье и улучшило двигательную функцию без признаков токсичности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Важно отметить, что у мышей woozy и контрольных животных не было выявлено признаков токсичности или побочных эффектов, связанных с введением AAV или избыточной экспрессией трансгена SIL1. Избирательное восстановление уровня SIL1 в клетках Пуркинье оказалось достаточным для предотвращения мозжечковой атаксии, что говорит о важнейшем вкладе именно дисфункции этих нейронов в патогенез заболевания. Эти данные служат доказательством концепции перспективности генной терапии SIL1 на основе AAV для лечения MSS.&lt;/p&gt;\n&lt;p&gt;На сегодняшний день для MSS не существует эффективной терапии. В предыдущих работах на мышах woozy изучались фармакологические методы, направленные на подавление стресса эндоплазматического ретикулума и сигнального пути UPR через модуляцию пути PERK. Несмотря на частичный эффект, полностью восстановить моторные функции или остановить дегенерацию мозжечка не удалось, что указывает на недостаточность воздействия лишь на нижеустремленные стрессовые пути. Не так давно на мышах woozy испытывали подход с доставкой в печень вектора AAV8, кодирующего слитый белок SIL1-TAT, проникающий в клетки. В этой стратегии печень использовалась как «биофабрика» для системного синтеза химеры SIL1-TAT, которая благодаря последовательности TAT должна была проникать во многие органы, включая ЦНС. Белок SIL1-TAT обнаруживался в скелетных мышцах, но отсутствовал в мозжечке, а терапевтический эффект ограничивался лишь умеренным улучшением навыков ходьбы по баллу и на ротароде, лишь задерживая прогрессирование двигательных нарушений. Эти факты убедительно показывают, что для достижения выраженного терапевтического эффекта необходима эффективная доставка SIL1 непосредственно в нервную систему. В связи с этим наше исследование доказывает, что направленная доставка AAV в ЦНС обеспечивает существенно большую эффективность по сравнению с ранее изученными фармакологическими или периферическими методами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Векторы AAV (аденоассоциированные вирусы) — это безопасные вирусы-носители, используемые для доставки здоровых генов в клетки пациента, а вестерн-блоттинг и ddPCR — методы лабораторного анализа белков и ДНК/РНК соответственно.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Главным итогом работы стало то, что доставка SIL1 с помощью AAV привела к стабильной экспрессии трансгена в ЦНС и обеспечила устойчивое устранение двигательных дефицитов, связанных с атаксией, на протяжении 26 недель.&lt;/p&gt;\n&lt;p&gt;Анализ методом вестерн-блоттинга экстрактов мозжечка показал уровень иммунореактивности SIL1 от чуть выше эндогенных значений дикого типа у мышей, леченных moSIL1, и примерно в шесть раз выше у животных, получивших huSIL1. Тем не менее, поскольку антитела были получены против человеческого SIL1, более сильный сигнал у мышей с huSIL1 частично может объясняться большим сродством антител к человеческому белку. Параллельно анализ цифровой капельной ПЦР (ddPCR) микродиссектированных клеток Пуркинье выявил примерно двукратное превышение мРНК SIL1 в целевой популяции нейронов, что согласуется с мощной, но не чрезмерно избыточной экспрессией трансгена.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эксперименты проводились на мышиной модели, а более сильный сигнал белка у мышей, получивших человеческий вариант SIL1, может быть связан с особенностями сродства антител.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Восстановление поведения сопровождалось значительным сохранением клеток Пуркинье и выраженным снижением астроглиоза в мозжечке, о чем свидетельствовало уменьшение уровня GFAP. Реактивный астроглиоз — хорошо известный признак многих нейродегенеративных патологий, однако его роль в развитии MSS ранее не изучалась. Поскольку экспрессия трансгена наблюдалась главным образом в клетках Пуркинье и других нейронах, уменьшение астроглиоза вряд ли связано с прямой коррекцией астроцитов. Скорее всего, реактивный ответ глиальных клеток вторичен по отношению к гибели нейронов и может быть предотвращен путем защиты уязвимых клеток Пуркинье. В совокупности эти данные показывают, что генная терапия SIL1 не только сохраняет клетки Пуркинье, но и подавляет реактивный глиоз, сопутствующий дегенерации мозжечка.&lt;/p&gt;\n&lt;p&gt;Сохранение клеток Пуркинье у пролеченных AAV мышей woozy было значительным, хотя и неполным.&lt;/p&gt;\n&lt;p&gt;Тем не менее, двигательная активность леченных мышей практически не отличалась от показателей гетерозиготного контроля. Эти результаты говорят о том, что для достижения выраженного восстановления функций полное анатомическое сохранение структуры мозжечка может не требоваться. Данная концепция подтверждается исследованиями на других мышиных моделях мозжечковой атаксии, где частичное сохранение популяции клеток Пуркинье или восстановление их работы приводило к серьезным улучшениям двигательного поведения, что объясняется значительным функциональным резервом и компенсаторными возможностями нейронных сетей мозжечка. Следовательно, наши данные показывают, что восстановление уровня SIL1 в достаточной доле уязвимых клеток Пуркинье способно поддерживать работу сетей мозжечка и предотвращать развитие явной атаксии даже в условиях остаточной нейродегенерации.&lt;/p&gt;\n&lt;p&gt;Отдельным важным наблюдением стала поразительная долговечность терапевтического эффекта. Мыши woozy, получившие AAV-SIL1, оставались неотличимыми по поведению от гетерозиготных контрольных особей на протяжении всего 26-недельного периода наблюдения, который был конечной точкой в данном исследовании. Такой пролонгированный результат особенно обнадеживает в контексте MSS, при котором неврологические симптомы обычно манифестируют в младенчестве и развиваются в детском возрасте, после чего заболевание стабилизируется, а ожидаемая продолжительность жизни обычно не сокращается.&lt;/p&gt;\n&lt;h4 id=\"perspektivy-klinicheskogo-primeneniya-i-bezopasnost-terapii\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#perspektivy-klinicheskogo-primeneniya-i-bezopasnost-terapii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Перспективы клинического применения и безопасность терапии&lt;/span&gt;&lt;/a&gt;Перспективы клинического применения и безопасность терапии&lt;/h4&gt;\n&lt;p&gt;Раннее начало терапии в период новорожденности способно обеспечить долговременное сохранение двигательных функций, существенно повышая самостоятельность и качество жизни пациентов. Важно отметить, что в ходе экспериментов не было зафиксировано каких-либо явных нежелательных эффектов, связанных с введением векторов AAV интрацеревентрикулярно новорожденным мышам или с длительной сверхэкспрессией белка SIL1, как у мутантных мышей линии woozy, так и у здоровых контрольных животных. Данные наблюдения свидетельствуют о том, что избыточный уровень экспрессии SIL1 в центральной нервной системе переносится организмом хорошо, по крайней мере в рамках изученного временного интервала. В совокупности эти результаты подтверждают концепцию, согласно которой доставка SIL1 с помощью аденоассоциированных вирусов обеспечивает стабильный и продолжительный терапевтический эффект без видимой токсичности, что критически важно для перехода к клиническим исследованиям на людях.&lt;/p&gt;\n&lt;h4 id=\"rol-kletok-purkine-i-selektivnaya-korrekciya-fenotipa\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#rol-kletok-purkine-i-selektivnaya-korrekciya-fenotipa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Роль клеток Пуркинье и селективная коррекция фенотипа&lt;/span&gt;&lt;/a&gt;Роль клеток Пуркинье и селективная коррекция фенотипа&lt;/h4&gt;\n&lt;p&gt;Интересным результатом работы стало то, что избирательная экспрессия SIL1 исключительно в клетках Пуркинье под управлением промотора L7-6 оказалась достаточной для предотвращения развития атаксии. Дефицит SIL1 делает эти нейроны уязвимыми к хроническому стрессу эндоплазматического ретикулума и нарушениям гомеостаза белков, а восстановление уровня SIL1 конкретно в данных клетках заметно снижает нейродегенерацию и нормализует функции мозжечка у мышей модели woozy. Полученные данные согласуются с результатами исследований других наследственных атаксий, где клетки Пуркинье служат главной мишенью повреждения, а их адресная генетическая коррекция существенно уменьшает двигательные нарушения, подчеркивая их ключевой вклад в патологию мозжечка. Таким образом, воздействие на клетки Пуркинье способно полностью скорректировать мозжечковый фенотип у мышей woozy, указывая на перспективность клеточно-специфической генной терапии.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Селективная экспрессия SIL1 в клетках Пуркинье полностью предотвращает развитие атаксии и нормализует функции мозжечка у мышей woozy.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vliyanie-na-skeletnye-myshcy-i-sistemnye-effekty\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#vliyanie-na-skeletnye-myshcy-i-sistemnye-effekty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Влияние на скелетные мышцы и системные эффекты&lt;/span&gt;&lt;/a&gt;Влияние на скелетные мышцы и системные эффекты&lt;/h4&gt;\n&lt;p&gt;Лечение мышей woozy с помощью AAV также приводило к значительному улучшению мышечной силы и выносливости, что было подтверждено в тестах на силу хватки и удержание на сетке. Согласуясь с функциональными улучшениями, гистологический и ультраструктурный анализ выявил выраженное уменьшение патологий скелетных мышц: снизилось количество мышечных волокон с ядрами в центре, уменьшилось расширение саркоплазматического ретикулума и околоядерные аномалии. Метод вестерн-блоттинга зафиксировал наличие трансгенного белка SIL1 в скелетных мышцах на уровне, сопоставимом с гетерозиготными животными. Это доказывает, что даже относительно низкая степень восстановления SIL1 способна приносить значительную пользу мышечной ткани.&lt;/p&gt;\n&lt;h4 id=\"napravleniya-dlya-dalnejshih-issledovanij\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#napravleniya-dlya-dalnejshih-issledovanij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Направления для дальнейших исследований&lt;/span&gt;&lt;/a&gt;Направления для дальнейших исследований&lt;/h4&gt;\n&lt;p&gt;Описанные результаты поддерживают дальнейшую разработку генной терапии SIL1 на основе векторов AAV как потенциального метода лечения синдрома Марио унтерлохер-Шенке (MSS). Тем не менее остается ряд нерешенных вопросов. Хотя интрацеревентрикулярное введение новорожденным высокоэффективно у мышей, перенос метода в клиническую практику потребует оптимизации способов доставки, способных обеспечить эффективную трансдукцию как центральной нервной системы, так и периферических тканей. Будущие исследования должны оценить системное введение с использованием оптимизированных капсидов AAV и режимов дозирования, которые гарантируют достаточный уровень SIL1 в целевых тканях при сохранении профиля безопасности.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Данные получены на мышиной модели, поэтому для клинического применения потребуется разработка системных методов доставки и проверка эффективности терапии после появления симптомов заболевания.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Еще одной важной задачей для клиники является определение возможности переноса терапевтического эффекта на более поздние стадии болезни. Несмотря на то, что скрининг новорожденных в будущем позволит проводить пресимптоматическую диагностику и профилактическое лечение, крайне важно выяснить, сохраняет ли терапия AAV-SIL1 эффективность после клинического манифеста симптомов, чтобы четко определить временное окно для медицинского вмешательства. Наконец, хотя положительный эффект сохранялся на протяжении всего 26-недельного периода наблюдения и токсичности не обнаружили, для оценки последствий пожизненной экспрессии SIL1 понадобятся более долгосрочные исследования и углубленный анализ безопасности.&lt;/p&gt;\n&lt;h3 id=\"metody1\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#metody1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"dizajn-issledovaniya\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#dizajn-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дизайн исследования&lt;/span&gt;&lt;/a&gt;Дизайн исследования&lt;/h4&gt;\n&lt;p&gt;Работа представляет собой контролируемое рандомизированное лабораторное исследование, в котором использовалась мышиная модель MSS — мутантные мыши линии woozy (wz/wz) и их гетерозиготные однопометники в качестве контроля (CT). Поскольку ранее было доказано отсутствие значимых различий в моторных функциях и строении мозжечка между диким типом (wt/wt) и гетерозиготами (wt/wz), последние применялись во всех сериях экспериментов в роли контрольной группы. Новорожденных мышей от скрещивания wt/wz × wz/wz (дающих около 50% контроля и 50% мутантных особей) рандомизировали на уровне помётов для введения аденоассоциированных вирусных векторов (AAV) либо плацебо (vehicle). Пол животных при рождении не определялся из-за его ненадежности, поэтому в анализ вошли мыши обоих полов без разделения на этапе формирования групп. Поведенческие тесты, а также гистологические и ультраструктурные исследования проводились исследователями, не знавшими генотип и вариант лечения животных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод слепого тестирования (blinding) означает, что ученые, оценивавшие поведение и ткани мышей, не знали, какая именно мышь перед ними — мутантная после лечения или здоровая контрольная, что исключает субъективность.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Краткосрочные эксперименты были организованы согласно схеме на Рис. S5A для оценки влияния терапии на дебют моторных нарушений и раннюю дегенерацию клеток Пуркинье. Тренировки мышей на узкой перекладине (beam-walking test) начинались в возрасте 4 недель, а тестирование проводилось еженедельно до достижения 9-недельного возраста. Основным критерием эффективности выступали результаты на узкой перекладине — чувствительном тесте на координацию и баланс у мышей woozy. Размер выборки рассчитывался заранее с помощью анализа статистической мощности: при ожидаемом среднем числе оступаний у нелеченых мутантных мышей в 2, 6, 16, 23 и 37 раз в возрасте 5, 6, 7, 8 и 9 недель соответственно, авторы заложили AR(1) корреляцию 0.50, остаточную дисперсию 2.00 и определили, что для фиксации 60%-ного снижения количества оступаний с уровнем ошибки I рода 0.05 и мощностью 90% требуется по шесть особей в каждой группе.&lt;/p&gt;\n&lt;p&gt;Долгосрочные эксперименты выполнялись по схеме с Рис. S5B, при этом животных наблюдали до возраста 26 недель. Помимо ходьбы по перекладине, двигательную активность оценивали на ускоряющемся ротароде (accelerating rotarod), способном выявлять моторные дефекты у линии woozy начиная с 9–10 недель жизни и применимом даже при выраженном прогрессировании болезни. Силовые показатели мускулатуры проверялись в тестах с удержанием на решетке (inverted grid) и измерением силы хвата (grip strength).&lt;/p&gt;\n&lt;p&gt;По достижении запланированных точек экспериментов животных эвтаназировали. Одно полушарие мозга фиксировали путем погружения для гистологии, иммуногистохимии или ультраструктурного анализа, тогда как противоположное полушарие замораживали для биохимии. Четырехглавые мышцы бедра обрабатывали аналогично: один образец фиксировали для ультраструктурного изучения, а контралатеральный замораживали с целью гистологических и биохимических исследований.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-23/neonatal-aav-sil1-gene-therapy-prevents-marinesco-sjo-gren-s.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172
