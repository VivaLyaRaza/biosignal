            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"158\" cy=\"179\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"662\" cy=\"161\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · IMMUNOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как иммунные клетки&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;провоцируют ожирение печени&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise-f1.jpg\" alt=\"Рисунок 1. Повышенная инфильтрация HNP1 в печени коррелирует с печеночным стеатозом у клинических пациентов.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Повышенная инфильтрация HNP1 в печени коррелирует с печеночным стеатозом у клинических пациентов.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1. Повышенная инфильтрация HNP1 в печени коррелирует с печеночным стеатозом у клинических пациентов. (a) Репрезентативные изображения ИГХ, иллюстрирующие уровни и распределение HNP в срезах печени человека при различной степени тяжести печеночного стеатоза. Масштабная линейка: 100 мкм. (b) ИГХ-оценка срезов печени пациентов без печеночного стеатоза (n = 8) или с легким (n = 14) и тяжелым стеатозом (n = 7), а также полуколичественный анализ уровней HNP, нормализованных по ИГХ-положительным областям в этих образцах. (c-d) Корреляционный анализ уровней печеночных HNP с площадью стеатоза (c) и показателями активности НАЖБП (d). (e) Мультивулканические графики, иллюстрирующие дифференциально экспрессируемые гены (DEG) в клинических образцах из групп с минимальным, легким и тяжелым печеночным стеатозом. (f) Профили RNA-seq, показывающие изменения экспрессии генов, связанных с транспортом и метаболизмом липидов, P450, фиброзом и воспалением в шестнадцати образцах печени человека, с наложенными относительными уровнями HNP в виде столбчатых диаграмм. (g-j) Диаграммы рассеяния, показывающие корреляцию между относительным содержанием HNP и экспрессией генов, связанных с транспортом липидов (g), липогенезом (h), β-окислением (i) и накоплением липидов (j). Указаны коэффициенты детерминации (R2) и P-значения. Статистическая значимость рассчитывалась с помощью однофакторного дисперсионного анализа с поправкой Бонферрони для множественных сравнений.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;При метаболической болезни печени в орган проникают нейтрофилы — клетки врожденного иммунитета. Долгое время оставалось неясным, просто ли они сопровождают воспаление или активно его разжигают. Новое исследование показывает, что белки нейтрофилов повреждают митохондрии гепатоцитов, запуская накопление жира и прогрессирование болезни.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Альфа-дефензины нейтрофилов вызывают мультимеризацию VDAC1 в митохондриях печени&lt;/li&gt;\n&lt;li&gt;Накопление HNP в тканях печени коррелирует с тяжестью стеатоза у пациентов&lt;/li&gt;\n&lt;li&gt;Блокировка взаимодействия HNP-VDAC1 предотвращает стеатогепатит у мышей на диете&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Метаболическая дисфункция-ассоциированная стеатотическая болезнь печени (MASLD) характеризуется накоплением липидов и последующим воспалением (стеатогепатитом). Авторы работы проанализировали биоптаты пациентов с MASLD и обнаружили прямую корреляцию между количеством человеческих нейтрофильных пептидов (HNP, или альфа-дефензинов) в тканях и тяжестью стеатоза. В экспериментах in vitro было показано, что HNP проникают в гепатоциты и вызывают мультимеризацию белка VDAC1 (потенциал-зависимый анионный канал 1) во внешней мембране митохондрий. Это приводит к нарушению работы органелл и накоплению липидов.&lt;/p&gt;\n&lt;p&gt;Для проверки гипотезы in vivo использовали трансгенных мышей, экспрессирующих HNP1. При стандартном рационе животные оставались здоровыми, однако на фоне диеты с высоким содержанием жиров у них развивалось выраженное ожирение и стеатогепатит. Применение перорального пролекарства, блокирующего мультимеризацию VDAC1, предотвращало развитие патологии. Таким образом, HNP выступают как патогенные эффекторы, которые активируются именно в условиях метаболической перегрузки печени.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты получены на трансгенных мышах и культурах клеток, что требует подтверждения эффективности и безопасности терапии в клинических испытаниях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;При прогрессировании метаболически ассоциированной жировой болезни печени (МАЖБП) от стадии простого стеатоза до стеатогепатита в ткани печени наблюдается инфильтрация нейтрофилами. Однако до сих пор оставалось неясным, являются ли эффекторы нейтрофилов лишь маркерами этого патологического перехода или же они выступают его непосредственной причиной.&lt;/p&gt;\n&lt;p&gt;Наше исследование демонстрирует, что человеческие нейтрофильные пептиды (HNP), известные также как α-дефензины, являются активными драйверами заболевания, а не просто сопутствующими факторами. У пациентов, перенесших хирургическое вмешательство по поводу гемангиомы печени и имевших признаки МАЖБП, уровень HNP в биоптатах коррелирует с гистологической тяжестью стеатоза. В экспериментах in vitro было показано, что HNP проникают в гепатоциты, где индуцируют мультимеризацию потенциал-зависимого анионного канала 1 (VDAC1) во внешней мембране митохондрий, что ведет к митохондриальной дисфункции и накоплению липидов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HNP-пептиды вызывают патологическую мультимеризацию VDAC1 в митохондриях гепатоцитов, что напрямую способствует развитию стеатогепатита.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;У трансгенных мышей, экспрессирующих HNP1, на фоне диеты с избыточным содержанием липидов (но не при стандартном рационе) наблюдалось усиление ожирения и развитие стеатогепатита. Этот патологический процесс удавалось обратить с помощью перорального пролекарства, блокирующего HNP-индуцированную мультимеризацию VDAC1. Полученные данные связывают механизмы врожденного иммунитета нейтрофилов с митохондриальной дисфункцией гепатоцитов, переосмысливая роль защитных HNP как патогенных факторов в условиях липидной перегрузки печени и определяя ось HNP–VDAC1 как перспективную терапевтическую мишень при МАЖБП.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VDAC1 — это белок-канал в наружной мембране митохондрий, который регулирует транспорт метаболитов; его неконтролируемая мультимеризация нарушает энергетический обмен клетки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"metabolicheskaya-disfunkciya-i-progressirovanie-zabolevaniya-pecheni\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#metabolicheskaya-disfunkciya-i-progressirovanie-zabolevaniya-pecheni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Метаболическая дисфункция и прогрессирование заболевания печени&lt;/span&gt;&lt;/a&gt;Метаболическая дисфункция и прогрессирование заболевания печени&lt;/h4&gt;\n&lt;p&gt;Метаболическая ассоциированная стеатотическая болезнь печени (MASLD), ранее известная как NAFLD, является наиболее распространенным хроническим заболеванием печени, затрагивающим до 30% населения мира. Патология варьируется от доброкачественного стеатоза (MASL) до стеатогепатита (MASH), сопровождающегося воспалением, митохондриальной дисфункцией, стрессом эндоплазматического ретикулума и фиброзом, что критически повышает риск цирроза и гепатоцеллюлярной карциномы. Механизмы перехода от простого стеатоза к MASH остаются ключевой нерешенной проблемой гепатологии.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Переход от стеатоза к стеатогепатиту (MASH) связан с воспалительными процессами, где роль нейтрофилов, составляющих 50–70% циркулирующих лейкоцитов, изучена недостаточно, несмотря на их способность массово проникать в ткани при воспалении.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Хотя нейтрофилы являются первыми «ответчиками» иммунной системы, их роль в патогенезе MASLD изучена меньше, чем роль резидентных макрофагов. При MASLD нейтрофилы активно мигрируют из кровотока в ткань печени, усугубляя воспаление. После выполнения защитных функций эти клетки подвергаются запрограммированной гибели, высвобождая α-дефензины 1–4 (HNP 1–4). Эти катионные, богатые цистеином пептиды, вырабатываемые в организме человека в количестве 10–15 мг/кг массы тела в сутки, традиционно считались антимикробными агентами. Однако их роль после завершения иммунного ответа остается неясной.&lt;/p&gt;\n&lt;h4 id=\"defenziny-i-mitohondrialnaya-disfunkciya\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#defenziny-i-mitohondrialnaya-disfunkciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дефензины и митохондриальная дисфункция&lt;/span&gt;&lt;/a&gt;Дефензины и митохондриальная дисфункция&lt;/h4&gt;\n&lt;p&gt;Существующие данные о роли дефензинов при болезнях печени противоречивы: одни исследования связывают высокий уровень HNP1-3 с тяжестью фиброза, другие указывают на защитный эффект при гиперхолестеринемии. Авторы задаются вопросом: являются ли HNP лишь пассивными маркерами воспаления или активными драйверами патологии, воздействующими на гепатоциты? Вероятной мишенью для них выступает VDAC1 — основной белок внешней мембраны митохондрий, отвечающий за транспорт метаболитов и ионов Ca2+.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VDAC1 (потенциал-зависимый анионный канал 1) — это «ворота» митохондрии; его олигомеризация (слипание молекул) нарушает работу органеллы, что ведет к гибели клетки и метаболическим сбоям.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В работе использованы образцы биопсий печени пациентов, оперированных по поводу гемангиомы, для анализа корреляции HNP со стеатозом. Исследования на HNP1-трансгенных мышах показали, что при высокожировой диете у них развивается стеатогепатит и ожирение, тогда как на стандартном корме фенотип не проявляется. Применение перорального пролекарства, блокирующего олигомеризацию VDAC1, обращает эти эффекты. Таким образом, ось «нейтрофильные дефензины — VDAC1» является критическим звеном прогрессирования MASLD при липидной перегрузке гепатоцитов.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"povyshennyj-uroven-hnp-v-pecheni-tesno-korreliruet-s-tyazhestyu-steatoza-u-pacientov\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#povyshennyj-uroven-hnp-v-pecheni-tesno-korreliruet-s-tyazhestyu-steatoza-u-pacientov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Повышенный уровень HNP в печени тесно коррелирует с тяжестью стеатоза у пациентов&lt;/span&gt;&lt;/a&gt;Повышенный уровень HNP в печени тесно коррелирует с тяжестью стеатоза у пациентов&lt;/h4&gt;\n&lt;p&gt;Альфа-дефензины HNP 1-3, различающиеся лишь одной аминокислотой, составляют основную массу дефензинов нейтрофилов, тогда как HNP4 экспрессируется в ничтожных количествах (Рис. S1). Для оценки клинической значимости HNP 1-3 при стеатозе печени было изучено 29 биоптатов пациентов с гемангиомой печени. Образцы разделили по площади окрашивания Oil Red O (ORO): без стеатоза (&amp;lt;5%, n=8), легкий стеатоз (5-33%, n=14) и тяжелый стеатоз (&amp;gt;33%, n=7). Гистопатологический анализ (H&amp;amp;E, ORO, трихром по Массону, Sirius red) показал, что по мере прогрессирования стеатоза нарастают баллонная дистрофия и макровезикулярный стеатоз (Рис. S2a-b), что подтверждается ростом индекса активности NAFLD (NAS) и фиброзом (Рис. S2c-d). Окрашивание Sirius red выявило постепенное накопление коллагена IV типа, связанное с ранним фиброгенезом, а при тяжелом стеатозе — повышенное отложение коллагена I типа, что указывает на риск цирроза (Рис. S2a, S2e).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Уровень HNP 1-3 в печени при тяжелом стеатозе значительно выше, чем в контрольных группах, и сильно коррелирует с площадью стеатоза (P &amp;lt; 0.0001, R2 = 0.8579), NAS (P &amp;lt; 0.0001, R2 = 0.6611) и фиброзом (P &amp;lt; 0.0001, R2 = 0.6038).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Иммуногистохимический анализ (ИГХ) показал, что в группе тяжелого стеатоза 57,1% образцов были сильно положительными, а 42,9% — умеренно положительными, тогда как в группе без стеатоза 100% образцов были слабо положительными (Рис. 1a-b, Рис. S2f). Транскриптомный анализ выявил рост числа дифференциально экспрессируемых генов (DEG) от 216 (сравнение «без стеатоза» vs «легкий») до 2639 (сравнение «без стеатоза» vs «тяжелый») (Рис. 1e). При тяжелом стеатозе активировались пути транспорта и метаболизма липидов, фиброза и воспаления, а гены P450 были подавлены (Рис. 1f). Экспрессия генов липидного обмена (Apoe, Cd36, Fbp1, Slc27a2, Acaca, Acly, Dgat2, Srebf2, Acot7, Acsl4, Plin2, Pnpla4) коррелировала с уровнем HNP (Рис. 1g-j).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise-f1.jpg\" alt=\"Рисунок 1. Повышенная инфильтрация HNP1 в печени коррелирует с печеночным стеатозом у клинических пациентов.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Повышенная инфильтрация HNP1 в печени коррелирует с печеночным стеатозом у клинических пациентов.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1. Повышенная инфильтрация HNP1 в печени коррелирует с печеночным стеатозом у клинических пациентов. (a) Репрезентативные изображения ИГХ, иллюстрирующие уровни и распределение HNP в срезах печени человека при различной степени тяжести печеночного стеатоза. Масштабная линейка: 100 мкм. (b) ИГХ-оценка срезов печени пациентов без печеночного стеатоза (n = 8) или с легким (n = 14) и тяжелым стеатозом (n = 7), а также полуколичественный анализ уровней HNP, нормализованных по ИГХ-положительным областям в этих образцах. (c-d) Корреляционный анализ уровней печеночных HNP с площадью стеатоза (c) и показателями активности НАЖБП (d). (e) Мультивулканические графики, иллюстрирующие дифференциально экспрессируемые гены (DEG) в клинических образцах из групп с минимальным, легким и тяжелым печеночным стеатозом. (f) Профили RNA-seq, показывающие изменения экспрессии генов, связанных с транспортом и метаболизмом липидов, P450, фиброзом и воспалением в шестнадцати образцах печени человека, с наложенными относительными уровнями HNP в виде столбчатых диаграмм. (g-j) Диаграммы рассеяния, показывающие корреляцию между относительным содержанием HNP и экспрессией генов, связанных с транспортом липидов (g), липогенезом (h), β-окислением (i) и накоплением липидов (j). Указаны коэффициенты детерминации (R2) и P-значения. Статистическая значимость рассчитывалась с помощью однофакторного дисперсионного анализа с поправкой Бонферрони для множественных сравнений.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"transgennye-myshi-hnp1-na-vysokozhirovoj-diete-sklonny-k-razvitiyu-masld\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#transgennye-myshi-hnp1-na-vysokozhirovoj-diete-sklonny-k-razvitiyu-masld\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Трансгенные мыши HNP1 на высокожировой диете склонны к развитию MASLD&lt;/span&gt;&lt;/a&gt;Трансгенные мыши HNP1 на высокожировой диете склонны к развитию MASLD&lt;/h4&gt;\n&lt;p&gt;Поскольку у мышей нет дефензинов в нейтрофилах, были созданы трансгенные мыши HNP1 (HNP1TG) на фоне C57BL/6J с использованием метода CRISPR-Cas9 и промотора эластазы нейтрофилов. После подтверждения вставки гена DEFA1 (Рис. S3), самцов HNP1TG и мышей дикого типа (WT) в возрасте 6 недель перевели на высокожировую диету (HFD) на 12 недель (Рис. 2a). При одинаковом потреблении пищи (Рис. S4a) мыши HNP1TG набирали массу быстрее (Рис. 2b, S4b), что привело к увеличению объема тела и печени (Рис. 2c). Трансгенные мыши были тяжелее WT на 14,7%, 18,1% и 10,6% на 4, 8 и 12 неделях диеты соответственно (Рис. 2d). При контрольной диете (CFD) различий в фенотипе не наблюдалось (Рис. S5a-d).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise-f2.jpg\" alt=\"Рисунок 2. Повышенная восприимчивость к МАСЛБ у трансгенных мышей HNP1.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2. Повышенная восприимчивость к МАСЛБ у трансгенных мышей HNP1.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 2. Повышенная восприимчивость к МАСЛБ у трансгенных мышей HNP1. (a) Экспериментальный дизайн для оценки роли HNP1 в прогрессировании МАСЛБ. Шестинедельные самцы мышей WT и HNP1TG линии C57BL/6J весом 21-23 г получали диету с высоким содержанием жиров (HFD) в течение 12 недель для индукции МАСЛБ, после чего их забивали и собирали образцы тканей для углубленного анализа. (b) Масса тела мышей WT и HNP1TG, измеренная еженедельно во время кормления HFD (n = 10 мышей в группе). (c) Репрезентативные фотографии мышей WT и HNP1TG (внизу) и их печени (вверху) после 12 недель кормления HFD. (d) Сводка массы тела и статистические сравнения между мышами WT и HNP1TG на 0, 4, 8 и 12 неделях. (e) Репрезентативные изображения срезов печени мышей, окрашенных H&amp;amp;E и ORO. Серые, зеленые и красные стрелки указывают на воспалительную инфильтрацию, баллонную дистрофию гепатоцитов (Ballooned.hep) или макровезикулярный жир (Macroves.fat) соответственно. Масштабная линейка: 200 мкм. (f-h) Количественная оценка баллонированных гепатоцитов (f), процент ORO-положительной площади (g) и гепатоцитов с макровезикулярным жиром (h) на поле зрения при большом увеличении (HMF) с использованием ImageJ, на основе трех полей на срез (n = 6 мышей в группе). (i-k) Масса тела (i), масса печени (j) и соотношение массы печени к массе тела (k) мышей WT и HNP1TG после 12 недель кормления HFD (n = 6 мышей в группе). (l-m) Уровни триглицеридов и холестерина в сыворотке (l) и печени (m) мышей после 12 недель кормления HFD (n = 6 мышей в группе). (n) Тест на толерантность к глюкозе у мышей WT и HNP1TG после 12 недель кормления HFD (левая панель), с кратными изменениями площади под кривой (AUC) глюкозы в крови (n = 6 мышей в группе) (правая панель). (o) Тепловая карта, показывающая паттерны экспрессии DEG, связанных с метаболизмом липидов в печени мышей WT и HNP1TG (n = 6 мышей в группе). Цветовая шкала указывает уровни экспрессии. (p-q) Метаболомный анализ уровней липидных соединений, производных холестерина (p) и триглицеридов (q), в печени мышей WT и HNP1TG (n = 6 мышей в группе). Все данные представлены как среднее ± SD. Статистическая значимость анализировалась с помощью непарного двустороннего t-критерия Стьюдента.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Трансгенные мыши — животные, в геном которых искусственно внедрен чужеродный ген для изучения его функций в организме.&lt;br /&gt;\n[!warning] Исследование на мышах демонстрирует корреляцию и влияние HNP1 на метаболизм, однако механизмы у людей могут отличаться из-за видовых особенностей иммунной системы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"patologicheskie-izmeneniya-pecheni-i-zhirovoj-tkani\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#patologicheskie-izmeneniya-pecheni-i-zhirovoj-tkani\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Патологические изменения печени и жировой ткани&lt;/span&gt;&lt;/a&gt;Патологические изменения печени и жировой ткани&lt;/h4&gt;\n&lt;p&gt;После 12 недель на диете с высоким содержанием жиров (HFD) мышей подвергли эвтаназии после ночного голодания. У трансгенных мышей (HNP1TG) наблюдались выраженные признаки стеатоза печени: баллонная дистрофия гепатоцитов, макровезикулярное ожирение и воспалительная инфильтрация (Рис. 2e). Полуколичественный анализ подтвердил значительное усиление этих патологических маркеров (Рис. 2f-h). Параллельно увеличились масса тела и масса печени (Рис. 2i-j), при этом индекс печени (отношение массы печени к массе тела) у трансгенных особей оказался как минимум в два раза выше, чем у контрольной группы WT (Рис. 2k). Интересно, что масса эпидидимальной жировой ткани (EAT) у HNP1TG была снижена примерно на 25% (Рис. SN c-d).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;У HNP1TG-мышей развился тяжелый стеатоз печени с двукратным увеличением индекса печени и атрофией жировой ткани на 25%.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В жировой ткани EAT у HNP1TG-мышей выявлено увеличение размеров адипоцитов и формирование «коронкоподобных структур» (CLS), что свидетельствует о системной перестройке липидного обмена и хроническом воспалении (Рис. SN e-g). Клинически все HNP1TG-мыши достигли стадии MASH (NAS &amp;gt; 5), тогда как в группе WT таких случаев не было (Рис. SN h). В печени трансгенных мышей обнаружено значительное разрастание фиброзных волокон в междольковом пространстве, занимающих около 9% площади среза, в то время как у WT-мышей фиброз практически отсутствовал (Рис. SN i-j).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MASH (метаболически ассоциированный стеатогепатит) — прогрессирующая форма жировой болезни печени, сопровождающаяся воспалением и повреждением клеток.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"metabolicheskie-narusheniya-i-omiksnyj-analiz\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#metabolicheskie-narusheniya-i-omiksnyj-analiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Метаболические нарушения и омиксный анализ&lt;/span&gt;&lt;/a&gt;Метаболические нарушения и омиксный анализ&lt;/h4&gt;\n&lt;p&gt;У HNP1TG-мышей зафиксированы повышенные уровни триглицеридов и холестерина в сыворотке и печени (Рис. 2l-m) на фоне явных признаков повреждения печени (Рис. SN k-l). Уровень глюкозы натощак у HNP1TG увеличился на 50% (Рис. SN m). Тест на толерантность к глюкозе (GTT) показал снижение способности к её регуляции (Рис. 2n), а также развитие инсулинорезистентности (Рис. SN n-o). Примечательно, что на контрольной диете (CFD) различий между группами не наблюдалось (Рис. SN e-t).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на мышиной модели, поэтому прямая экстраполяция на человеческий метаболизм требует осторожности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Транскриптомный и метаболомный анализ печени показал четкое разделение кластеров HNP1TG и WT в пространстве главных компонент (PCA) (Рис. SN 6). Помимо изменений в генах липидного обмена (Рис. 2o), у трансгенных мышей повышены уровни холестерина, триглицеридов и их длинноцепочечных производных. Это указывает на нарушение работы L-карнитинового челнока, ответственного за транспорт жирных кислот в митохондрии (Рис. 2p-q). Полученные данные подтверждают, что экспрессия HNP1 является ключевым фактором предрасположенности к MASLD.&lt;/p&gt;\n&lt;h4 id=\"hnp1-vyzyvaet-mitohondrialnuyu-disfunkciyu,-sposobstvuya-nakopleniyu-lipidov-v-gepatocitah\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#hnp1-vyzyvaet-mitohondrialnuyu-disfunkciyu,-sposobstvuya-nakopleniyu-lipidov-v-gepatocitah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HNP1 вызывает митохондриальную дисфункцию, способствуя накоплению липидов в гепатоцитах&lt;/span&gt;&lt;/a&gt;HNP1 вызывает митохондриальную дисфункцию, способствуя накоплению липидов в гепатоцитах&lt;/h4&gt;\n&lt;p&gt;Для изучения негативного влияния HNP1 на развитие стеатоза печени in vitro была создана модель липотоксичности с использованием линии мышиных гепатоцитов BNL CL.2, первичных гепатоцитов мыши и линии клеток печени человека THLE-2, инкубированных с 0,5 мМ пальмитиновой кислоты (FFA) (Рис. 3a). Эксперименты показали, что добавление 4 мкМ HNP1 приводило к значительному увеличению накопления липидов во всех трех типах клеток, тогда как линейный пептид L-HNP1 в той же концентрации эффекта не вызывал (Рис. 3b-c). Это указывает на то, что способность HNP1 усиливать липидные отложения зависит от его конформации.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise-f3.jpg\" alt=\"Рисунок 3. HNP1 вызывает митохондриальную дисфункцию, способствуя стеатозу гепатоцитов.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3. HNP1 вызывает митохондриальную дисфункцию, способствуя стеатозу гепатоцитов.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 3. HNP1 вызывает митохондриальную дисфункцию, способствуя стеатозу гепатоцитов. (a) Экспериментальная схема модели липотоксичности in vitro, созданной на трех типах гепатоцитов, обработанных 0,5 мМ пальмитиновой кислотой. (b) Репрезентативные изображения гепатоцитов, окрашенных ORO, обработанных 0,5 мМ пальмитиновой кислотой в присутствии или в отсутствие 4 мкМ HNP1 или линейного HNP1. Масштабная линейка: 100 мкм. (c) Полуколичественный анализ накопления липидов в гепатоцитах на основе процента ORO-положительной площади (n = 6 биологических повторностей). Данные представлены как среднее ± SD. Статистическая значимость анализировалась с помощью однофакторного дисперсионного анализа с поправкой Бонферрони для множественных сравнений. (d) Флуоресцентные изображения линии клеток гепатоцитов мыши BNL CL.2, инкубированных с 4 мкМ FAM-меченным HNP1, с последующим окрашиванием митохондрий с помощью MitoTracker Red. Масштабная линейка: 25 мкм. (e) Репрезентативные ТЭМ-изображения митохондрий гепатоцитов в печени мышей WT и HNP1TG после 12 недель кормления HFD. (f) Репрезентативные ТЭМ-изображения митохондрий гепатоцитов, выделенных из печени клинических пациентов с печеночным стеатозом или без него.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HNP1 усиливает накопление липидов в гепатоцитах при липотоксическом стрессе, причем этот эффект строго зависит от структуры пептида.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для анализа молекулярных механизмов был проведен RNA-seq первичных гепатоцитов мыши при воздействии 4 мкМ HNP1. Профили транскрипции клеток, обработанных только FFA, оказались ближе к контрольным, чем к клеткам, получившим комбинацию FFA и HNP1, что подчеркивает роль HNP1 в нарушении иммунометаболических путей (Рис. S7a). Анализ генной онтологии (GO) выявил изменения в экспрессии генов, связанных с липидным обменом, энергетическим гомеостазом и воспалением (Рис. S7b). Сетевой анализ связал эти изменения с метаболически ассоциированной жировой болезнью печени (MASLD) и процессами в митохондриях, включая регуляцию ионных каналов и формирование белковых комплексов (Рис. S7c).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RNA-seq — метод высокопроизводительного секвенирования РНК, позволяющий оценить активность всех генов в клетке одновременно, а GO-анализ помогает сгруппировать эти гены по их биологическим функциям.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Поскольку HNP1 является катионным амфифильным пептидом, он способен взаимодействовать с отрицательно заряженными мембранами митохондрий. С помощью меченного флуоресцентным красителем FAM пептида HNP1 было подтверждено его накопление в митохондриях клеток BNL CL.2 (Рис. 3d). Электронная микроскопия (TEM) тканей печени мышей HNP1TG, получавших диету с высоким содержанием жиров (HFD) в течение 12 недель, выявила серьезные повреждения митохондрий: фрагментацию, уменьшение размеров и исчезновение крист по сравнению с контролем WT (Рис. 3e, Рис. S8a). Аналогичные изменения — повышенная фрагментация и неоднородность митохондрий — были обнаружены в образцах печени пациентов со стеатозом (n = 6) по сравнению с группой без стеатоза (n = 6) (Рис. 3f, Рис. S8b). Эти данные доказывают, что HNP1 напрямую повреждает митохондрии, вызывая дисфункцию, характерную для стеатоза печени.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на сочетании данных клеточных линий, трансгенных мышей и ограниченной выборки клинических образцов, что требует осторожности при экстраполяции на все формы патологии человека.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;HNP1 нацеливается на N-концевой спиральный домен VDAC1, способствуя его олигомеризации и нарушению липидного обмена в гепатоцитах.&lt;/p&gt;\n&lt;p&gt;Альфа-дефензины способны взаимодействовать с различными мишенями, включая мембранные рецепторы, для регуляции иммунного ответа. В поисках мишени HNP1 в митохондриях авторы сфокусировались на VDAC1 — основном белке внешней мембраны, критически важном для поддержания потенциала и редокс-баланса. Транскриптомный анализ подтвердил связь с регуляцией потенциал-зависимых ионных каналов (Рис. SN). Кокализация HNP1 и VDAC1 была подтверждена в тканях печени пациентов (Рис. 4a). Для проверки прямого взаимодействия очищенный VDAC1 (белок с β-бочонком и N-концевым спиральным доменом, Рис. 4b) исследовали методом поляризации флуоресценции с FAM-меченным HNP1. Установлено, что HNP1 связывается с VDAC1 с константой диссоциации K_d = 83,4 нМ (Рис. 4c).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise-f4.jpg\" alt=\"Рисунок 4. HNP1 нацеливается на N-концевой спиральный домен VDAC1, способствуя его олигомеризации, что приводит к наруше\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4. HNP1 нацеливается на N-концевой спиральный домен VDAC1, способствуя его олигомеризации, что приводит к нарушению метаболизма липидов в гепатоцитах.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 4. HNP1 нацеливается на N-концевой спиральный домен VDAC1, способствуя его олигомеризации, что приводит к нарушению метаболизма липидов в гепатоцитах. (a) Иммунофлуоресцентные изображения срезов печени клинических пациентов с печеночным стеатозом или без него. Синий — ядро, зеленый — VDAC1, красный — HNP1. Масштабная линейка: 100 мкм. (b) Кристаллическая структура VDAC1 человека (PDB: 6G6U). (c-d) Аффинность связывания HNP1 с полноразмерным VDAC1 человека (c) и с 26-аминокислотным N-концевым пептидом VDAC1 (d), оцененная методом флуоресцентной поляризации. Данные представлены как среднее ± SEM по трем биологическим повторностям. (e) Схематическая диаграмма механистических и функциональных результатов, вызванных олигомеризацией VDAC1. (f) Индуцированная HNP1 олигомеризация очищенного VDAC1 человека визуализировалась с помощью иммуноблоттинга после обработки сшивающим реагентом EGS для стабилизации олигомеров во время электрофореза. (g) Олигомеризация VDAC1 в первичных гепатоцитах мыши в присутствии или в отсутствие 0,5 мМ пальмитиновой кислоты, 4 мкМ HNP1 или 20 мкМ VBIT-12 визуализировалась с помощью иммуноблоттинга. (h) Схематическая диаграмма предложенной модели, в которой HNP1 способствует олигомеризации VDAC1 путем взаимодействия с его N-концевым доменом. (i) Репрезентативные изображения гепатоцитов, окрашенных ORO, обработанных 0,5 мМ пальмитиновой кислотой в присутствии или в отсутствие 4 мкМ HNP1 и/или 20 мкМ VBIT-12. Масштабная линейка: 100 мкм. (j) Полуколичественный анализ накопления липидов в гепатоцитах на основе процента ORO-положительной площади (n = 3 биологических повторности). Данные представлены как среднее ± SD. Статистическая значимость анализировалась с помощью однофакторного дисперсионного анализа с поправкой Бонферрони для множественных сравнений. (k) Репрезентативные изображения гепатоцитов, окрашенных Hoechst (апоптоз) и TMRE (митохондриальный потенциал), без (пусто) или с обработкой FFA в присутствии носителя в качестве контроля, 4 мкМ HNP1 или 4 мкМ HNP1 плюс 20 мкМ VBIT-12. Белые стрелки — апоптотические гепатоциты. Черные стрелки — гепатоциты с деполяризацией мембранного потенциала. Масштабная линейка: 50 мкм. (l-m) Полуколичественный анализ интенсивности флуоресценции Hoechst (l) и TMRE (m) в гепатоцитах (n = 3 биологических повторности). Данные представлены как среднее ± SD. Статистическая значимость анализировалась с помощью однофакторного дисперсионного анализа с поправкой Бонферрони для множественных сравнений. (n) Уровни транскрипции генов, связанных с липогенезом и катаболизмом липидов в гепатоцитах при различных обработках. Относительные уровни мРНК рассчитывались как количественное определение относительно контролей согласно математической модели 2-ΔΔCT. Итоговые данные были нормализованы по Z-оценке и отображены в виде Z-оценок на тепловой карте микрочипа. n = 3 биологических повторности на группу.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HNP1 напрямую связывается с VDAC1 с высокой аффинностью (K_d = 83,4 нМ), взаимодействуя преимущественно с его N-концевым спиральным доменом.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтобы локализовать сайт связывания, авторы использовали синтетический пептид из 26 аминокислот, соответствующий N-концевому спиральному домену (NTP). Метод поляризации флуоресценции показал, что HNP1 связывается с NTP с K_d = 161 нМ, что близко к аффинности для полноразмерного белка (Рис. 4d). VDAC1 склонен к олигомеризации при окислительном стрессе, образуя поры для транспорта Ca²⁺, мтДНК, цитохрома c и АФК (Рис. 4e), что ведет к липоапоптозу и инсулинорезистентности. Учитывая способность HNP1 к самоассоциации, авторы предположили, что он выступает каркасом для олигомеризации VDAC1. Эксперименты in vitro подтвердили, что HNP1 стимулирует образование димеров, тримеров и мультимеров VDAC1 (Рис. 4f). В первичных гепатоцитах мышей, культивируемых с 0,5 мМ свободных жирных кислот (FFA) и 4 мкМ HNP1, олигомеризация VDAC1 была усилена, что купировалось ингибитором VBIT-12 (Рис. 4g-h).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VBIT-12 — это специфический ингибитор олигомеризации VDAC1, используемый для доказательства того, что именно формирование мультимеров белка вызывает патологические эффекты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Методом просвечивающей электронной микроскопии (ТЭМ) при концентрации 0,5 мкМ было показано, что смесь HNP1 и NTP образует крупные олигомеры, в отличие от отдельных пептидов (Рис. SN). Динамическое светорассеяние подтвердило дозозависимое увеличение гидродинамического диаметра (d_h) при концентрациях 0,1, 0,5, 2,5 и 12,5 мкМ (Рис. SN). VBIT-12 эффективно снижал вызванный HNP1 стеатоз, апоптоз и деполяризацию мембран (Рис. 4i-m). Анализ методом RT-qPCR показал, что HNP1 подавляет гены катаболизма липидов и активирует гены липогенеза в присутствии FFA, однако добавление VBIT-12 восстанавливало профиль экспрессии до контрольных значений (Рис. 4n).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на первичных гепатоцитах мышей и in vitro, поэтому для подтверждения клинической значимости требуются дополнительные исследования на моделях in vivo.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"strukturnye-osnovy-vzaimodejstviya-hnp1-i-vdac1\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#strukturnye-osnovy-vzaimodejstviya-hnp1-i-vdac1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Структурные основы взаимодействия HNP1 и VDAC1&lt;/span&gt;&lt;/a&gt;Структурные основы взаимодействия HNP1 и VDAC1&lt;/h4&gt;\n&lt;p&gt;Для изучения структурных детерминант взаимодействия HNP1 с N-концевым спиральным доменом VDAC1 исследователи использовали 15N-меченый пептид NTP (Рис. SN). Анализ проводился методом 2D 1H-15N гетероядерной одноквантовой корреляционной (HSQC) ЯМР-спектроскопии. В 10 мМ фосфатном буфере (PB) NTP демонстрировал характерную α-спиральную конформацию с пиками в диапазоне 7,3–9,0 м.д. Добавление HNP1 к NTP в молярном соотношении 0,2:1 приводило к заметному ослаблению и сдвигу ряда резонансных пиков (Рис. 5a). В присутствии 40% трифторэтанола (TFE) пики стали более дисперсными, что указывает на усиление α-спиральности; в этих условиях HNP1 вызывал выраженные химические сдвиги, но не приводил к затуханию сигнала.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise-f5.jpg\" alt=\"Рисунок 5. Структурная основа связывания HNP1 с N-концевым доменом олигомеризации VDAC1.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5. Структурная основа связывания HNP1 с N-концевым доменом олигомеризации VDAC1.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 5. Структурная основа связывания HNP1 с N-концевым доменом олигомеризации VDAC1. (a) 2D (15N, 1H) HSQC спектры 400 мкМ 15N-меченного NTP в отсутствие и в присутствии 80 мкМ HNP1 при различных буферных условиях. (b) 2D (15N, 1H) HSQC спектры 200 мкМ 15N-меченного NTP, наложенные на спектры NTP, титрованного 0,5, 1 или 2 эквивалентами HNP1. (c) Структура NTP, извлеченная из кристаллической структуры VDAC1 человека (PDB: 6G6U), с критическими остатками, показанными в виде палочек. (d) Вклад остатков в NTP (сверху) и HNP1 (снизу) в свободную энергию связывания MM/GBSA. Данные представлены как среднее ± SD. (e) Кристаллическая структура димера HNP1 (PDB: 3GNY). (f-g) Репрезентативные изображения первичных гепатоцитов, окрашенных ORO, обработанных 0,5 мМ пальмитиновой кислотой в присутствии или в отсутствие 4 мкМ HNP1 или W26A-HNP1 (f), и полуколичественный анализ (g) накопления липидов в гепатоцитах на основе процента ORO-положительной площади (n = 3 биологических повторности). Масштабная линейка: 100 мкм. Данные представлены как среднее ± SEM. Статистическая значимость анализировалась с помощью однофакторного дисперсионного анализа с поправкой Бонферрони для множественных сравнений. (h-i) Аффинность связывания (h) и значения Kd (i) N-концевого пептида VDAC1 с HNP1 и его мутантом W26A, оцененные методом флуоресцентной поляризации. Данные представлены как среднее ± SEM. Статистическая значимость анализировалась с помощью однофакторного дисперсионного анализа с поправкой Бонферрони для множественных сравнений.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод HSQC ЯМР позволяет отслеживать изменения в химическом окружении ядер атомов, что помогает выявить участки молекул, непосредственно участвующие в связывании.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Взаимодействие между белками полностью подавлялось при добавлении 0,2% додецилсульфата натрия (SDS), о чем свидетельствует полное наложение спектров NTP в присутствии и в отсутствие HNP1 (Рис. 5a). При титровании 200 мкМ NTP 0,5, 1 или 2 эквивалентами HNP1 наблюдалось дозозависимое снижение интенсивности сигналов для остатков A2, V3, T6, A8, L10, K12, S13, A14, V17 и T19, что указывает на олигомеризацию NTP под действием HNP1 (Рис. 5b). Наиболее значимые сдвиги пиков зафиксированы для A2, V3, T6, A14 и V17.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ЯМР-анализ выявил критические остатки N-концевого домена VDAC1, участвующие в связывании с HNP1, которое носит дозозависимый характер и ведет к олигомеризации пептида.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для валидации данных было проведено 200-нс молекулярно-динамическое (МД) моделирование. Расчет вкладов отдельных остатков методом MM/GBSA подтвердил, что C-концевые остатки HNP1 вносят наибольший вклад в энергию связывания, причем ключевую роль играет Trp26. Экспериментальная проверка с использованием мутантного аналога W26A-HNP1 показала значительное ослабление связывания с NTP в тесте с поляризацией флуоресценции. В опытах на первичных гепатоцитах мышей мутация W26A существенно снижала накопление липидов, вызванное дефензином, что подтверждает функциональную значимость остатка Trp26 (Рис. 5e-i).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на изолированных пептидах и первичных культурах клеток, поэтому экстраполяция результатов на сложные организменные процессы требует осторожности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"peroralnoe-vvedenie-prolekarstva-vbit-12-predotvrashaet-razvitie-maslzh-u-myshej-linii-hnp1tg-na-fone-vysokozhirovoj-diety\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#peroralnoe-vvedenie-prolekarstva-vbit-12-predotvrashaet-razvitie-maslzh-u-myshej-linii-hnp1tg-na-fone-vysokozhirovoj-diety\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пероральное введение пролекарства VBIT-12 предотвращает развитие МАСЛЖ у мышей линии HNP1TG на фоне высокожировой диеты&lt;/span&gt;&lt;/a&gt;Пероральное введение пролекарства VBIT-12 предотвращает развитие МАСЛЖ у мышей линии HNP1TG на фоне высокожировой диеты&lt;/h4&gt;\n&lt;p&gt;Опираясь на данные о способности VBIT-12 снижать накопление липидов in vitro, мы проверили его эффективность против МАСЛЖ in vivo, чтобы подтвердить концепцию воздействия на ось «HNP1-VDAC1-олигомеризация». Для перорального приема был синтезирован пролекарство VBIT-12pro путем этерификации свободной карбоксильной группы VBIT-12 (Рис. S12). Эта модификация повысила липофильность, позволив молекуле пассивно проникать через мембраны кишечника в печень, где эндогенные карбоксилэстеразы высвобождают активный VBIT-12. Исследования на линиях THLE-2 и BNL CL.2 показали, что VBIT-12 и VBIT-12pro практически не обладают цитотоксичностью при концентрациях до 100 мкМ (Рис. S13).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Пролекарство — это химически модифицированная форма препарата, которая становится активной только после метаболического превращения в организме, что улучшает его всасывание.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мышам HNP1TG, получавшим высокожировую диету (HFD) в течение 6 недель, в последующие 6 недель ежедневно вводили 20 мг/кг VBIT-12pro перорально или 20 мг/кг VBIT-12 внутрибрюшинно (в сравнении с контрольными группами, получавшими плацебо) (Рис. 6a). В первые 6 недель все группы набирали вес с одинаковой скоростью (Рис. 6b, S14a-b, S15a). Однако после начала терапии траектории роста разошлись: у мышей на VBIT-12 и VBIT-12pro набор веса замедлился (Рис. S14c, S15b). Через 8 и 12 недель диеты вес мышей, получавших VBIT-12pro, был ниже веса контрольной группы примерно на 8,65% и 13,8% соответственно (Рис. 6c).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise-f6.jpg\" alt=\"Рисунок 6. Облегчение МАСЛП у мышей HNP1TG при пероральном введении пролекарства VBIT-12.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 6. Облегчение МАСЛП у мышей HNP1TG при пероральном введении пролекарства VBIT-12.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 6. Облегчение МАСЛП у мышей HNP1TG при пероральном введении пролекарства VBIT-12. (a) Дизайн эксперимента по оценке эффективности VBIT-12 и VBIT-12pro in vivo против МАСЛП у мышей HNP1TG. Шестинедельных самцов мышей HNP1TG C57BL/6J весом 21-23 г кормили диетой с высоким содержанием жиров (HFD) в течение 6 недель без лекарств, после чего в течение следующих 6 недель продолжали кормление HFD с ежедневными внутрибрюшинными инъекциями (i.p.) VBIT-12 или пероральным введением (p.o.) VBIT-12pro в дозе 20 мг/кг, после чего их умерщвляли и собирали образцы тканей для углубленного анализа. (b) Еженедельная масса тела мышей HNP1TG, получавших HFD и леченных носителем или VBIT-12pro (n = 6 мышей в группе). (c) Сводные данные по массе тела и статистические сравнения между мышами HNP1TG, получавшими носитель и VBIT-12pro, на 0, 4, 8 и 12 неделях. (d) Репрезентативные фотографии мышей HNP1TG, получавших носитель или VBIT-12pro (внизу), и их печени (вверху) после 12 недель кормления HFD. (e-g) Масса тела (e), масса печени (f) и соотношение массы печени к массе тела (g) у мышей HNP1TG, получавших носитель и VBIT-12pro, после 12 недель кормления HFD (n = 6 мышей в группе). (h-i) Уровни триглицеридов и холестерина в сыворотке (h) и печени (i) у мышей HNP1TG, получавших носитель и VBIT-12pro, после 12 недель кормления HFD (n = 6 мышей в группе). (j) Репрезентативные изображения срезов печени мышей, окрашенных H&amp;amp;E и ORO, и срезов эпикардиальной жировой ткани (EAT), окрашенных H&amp;amp;E. Масштабная линейка: 100 мкм. (k) Количественная оценка процентного содержания ORO-положительной площади (слева), баллонированных гепатоцитов (в центре) и макровезикулярных гепатоцитов, нагруженных жиром (справа), на поле зрения (HMF) с использованием ImageJ, на основе трех полей на срез (n = 6 мышей в группе). (l) Оценка активности НАЖБП (NAS) печени мышей HNP1TG, получавших носитель или VBIT-12pro, после 12 недель кормления HFD (n = 6 мышей в группе). (m) Подсчет количества адипоцитов в срезах EAT с использованием ImageJ на основе трех полей на срез (n = 6 мышей в группе). (n) Количественная оценка площади адипоцитов на срезах EAT, окрашенных H&amp;amp;E, у мышей HNP1TG, получавших носитель и VBIT-12pro (измерено 305 и 510 адипоцитов соответственно). (o-p) Репрезентативные ПЭМ-изображения (o) митохондрий гепатоцитов и липидных капель в печени мышей HNP1TG, получавших HFD и леченных носителем или VBIT-12pro, и количественная оценка параметров митохондрий на основе этих ПЭМ-изображений (p). (q) Уровни глюкозы в крови натощак в сыворотке мышей HNP1TG, которых кормили HFD в течение 12 недель и которые получали ежедневное лечение носителем или VBIT-12pro в течение последних 6 недель. Все данные представлены как среднее ± стандартное отклонение (SD). Статистическая значимость анализировалась с помощью непарного двустороннего t-критерия Стьюдента.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Терапия VBIT-12pro снизила массу тела мышей на 13,8% и массу печени в 3 раза по сравнению с контролем, предотвратив развитие МАСЛЖ.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Лечение нормализовало объем печени (Рис. 6d, S14d). После 6 недель терапии масса тела мышей на VBIT-12pro снизилась на 14% (Рис. 6e), а масса печени составила лишь треть от контрольных значений (Рис. 6f-g), при этом масса эпикардиальной жировой ткани (EAT) увеличилась на 46% (Рис. S15c-d). Уровни триглицеридов и холестерина в сыворотке и печени снизились, что сопровождалось уменьшением повреждений печени, подтвержденным снижением уровней АЛТ и АСТ (Рис. S15e-f).&lt;/p&gt;\n&lt;p&gt;Пероральный прием VBIT-12pro уменьшил количество баллонированных гепатоцитов и макровезикулярный стеатоз (Рис. 6j-k). Если в контроле все мыши достигли стадии МАСГ (NAS &amp;gt; 5), то в группе VBIT-12pro болезнь регрессировала до МАСЛЖ (Рис. 6l). Также наблюдалось уменьшение размеров адипоцитов в EAT (Рис. 6j, m, n). Электронная микроскопия (TEM) выявила в контроле обилие липидных капель, фрагментацию митохондрий и инвагинацию крист, тогда как у леченых мышей митохондрии сохранили целостность и четкие мембраны (Рис. 6o-p). Уровень глюкозы в крови также нормализовался (Рис. 6q). VBIT-12pro обладает высоким трансляционным потенциалом для лечения метаболических расстройств, связанных с олигомеризацией VDAC1.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проведено на генетически модифицированных мышах (HNP1TG); результаты требуют подтверждения в клинических испытаниях на людях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;h4 id=\"rol-nejtrofilnyh-a-defenzinov-v-patogeneze-maslzh\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#rol-nejtrofilnyh-a-defenzinov-v-patogeneze-maslzh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Роль нейтрофильных α-дефензинов в патогенезе МАСЛЖ&lt;/span&gt;&lt;/a&gt;Роль нейтрофильных α-дефензинов в патогенезе МАСЛЖ&lt;/h4&gt;\n&lt;p&gt;При избыточном поступлении липидов в печень клетки Купфера привлекают нейтрофилы, чья персистирующая инфильтрация способствует нарушению метаболизма жиров и гибели гепатоцитов, что характерно для метаболически ассоциированной стеатотической болезни печени (МАСЛЖ). Хотя известно, что нейтрофилы хранят α-дефензины в азурофильных гранулах в высоких концентрациях (10–50 мг/мл) для борьбы с патогенами, их судьба после высвобождения из погибающих клеток долгое время оставалась неясной. Мы установили, что уровни человеческих нейтрофильных пептидов (HNP) значительно повышены в печени пациентов со стеатозом. Эти пептиды способны проникать в гепатоциты и индуцировать мультимеризацию белка VDAC1, что ведет к митохондриальной дисфункции, накоплению липидов и прогрессированию МАСЛЖ. Этот процесс обратим при использовании ингибиторов мультимеризации VDAC1.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нейтрофильные α-дефензины (HNP) выступают патологическим фактором при МАСЛЖ, вызывая дисфункцию митохондрий гепатоцитов через мультимеризацию VDAC1.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Наши результаты имеют фундаментальное значение. Во-первых, α-дефензины, традиционно рассматриваемые как защитные антимикробные факторы, проявляют себя как «обоюдоострый меч», участвуя в метаболических нарушениях. Во-вторых, мы выявили механизм, при котором HNP запускают каскад событий, усугубляющих стеатоз через митохондриальную дисфункцию. В-третьих, VDAC1 становится ключевой терапевтической мишенью. В-четвертых, на основе ингибитора VBIT-12 мы разработали пероральный пролекарство-кандидат, демонстрирующий высокую эффективность в лечении МАСЛЖ как in vitro, так и in vivo.&lt;/p&gt;\n&lt;h4 id=\"patologicheskaya-mnogogrannost-defenzinov-i-katelicidinov\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#patologicheskaya-mnogogrannost-defenzinov-i-katelicidinov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Патологическая многогранность дефензинов и кателицидинов&lt;/span&gt;&lt;/a&gt;Патологическая многогранность дефензинов и кателицидинов&lt;/h4&gt;\n&lt;p&gt;Нейтрофильные α-дефензины могут играть и другие патологические роли. Например, HNP1 образует гетеромеры с хемокином CCL5, усиливая рекрутирование моноцитов при инфаркте миокарда у мышей. В трансгенных моделях HNP1/HNP2 и HNP1/HNP3 эти пептиды вызывают повреждение легких и септическое поражение органов через пироптоз эндотелиальных клеток. Кроме того, сублетальные концентрации HNP способствуют формированию биопленок A. baumannii и усиливают инвазию Shigella. Аналогичные механизмы описаны для α-дефензина 5 (HD5) кишечника, который через взаимодействие с белком OmpA и рецептором P2Y11 облегчает бактериальную адгезию и перестройку цитоскелета.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Пироптоз — это форма программируемой клеточной гибели, сопровождающаяся сильным воспалительным ответом, часто запускаемая инфекционными агентами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Большинство данных о патологических эффектах HNP получено на трансгенных мышах или в моделях инфекций, что требует осторожности при экстраполяции на человека.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Другой пептид, LL-37, также участвует в аутоиммунных процессах (псориаз, системная красная волчанка). Хотя LL-37 связан с ожирением у людей, его роль противоречива: в отличие от наших данных по HNP, гиперэкспрессия LL-37 у мышей снижает стеатоз печени, ингибируя рецептор CD36, что подчеркивает специфичность функций различных антимикробных пептидов.&lt;/p&gt;\n&lt;h4 id=\"mehanizmy-vliyaniya-multimerizacii-vdac1-na-metabolizm-gepatocitov\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#mehanizmy-vliyaniya-multimerizacii-vdac1-na-metabolizm-gepatocitov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Механизмы влияния мультимеризации VDAC1 на метаболизм гепатоцитов&lt;/span&gt;&lt;/a&gt;Механизмы влияния мультимеризации VDAC1 на метаболизм гепатоцитов&lt;/h4&gt;\n&lt;p&gt;Аномальная мультимеризация VDAC1, вероятно, нарушает функции митохондрий и усиливает накопление липидов в гепатоцитах через ряд взаимосвязанных процессов. Во-первых, это может подавлять β-окисление жирных кислот, снижая способность печени утилизировать избыточную энергию. Во-вторых, поскольку димеры VDAC1 действуют как скрамблазы, переносящие липиды через внешнюю мембрану для поддержания работы митохондрий, их избыточная мультимеризация нарушает гомеостаз мембран. В-третьих, повышение проницаемости внешней мембраны способствует выходу мтДНК и активации NLRP3-инфламмасомы, что дополнительно стимулирует стеатоз. Хотя ранее были известны регуляторы Pemt и BRD4, прямые молекулярные драйверы мультимеризации VDAC1 при метаболической дисфункции печени (MASLD) остаются не до конца изученными.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мультимеризация VDAC1 нарушает β-окисление, гомеостаз мембран и активирует NLRP3-инфламмасому, что усугубляет накопление липидов в печени.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vliyanie-hnp1-na-mitohondrialnuyu-dinamiku-i-metabolizm\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#vliyanie-hnp1-na-mitohondrialnuyu-dinamiku-i-metabolizm\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Влияние HNP1 на митохондриальную динамику и метаболизм&lt;/span&gt;&lt;/a&gt;Влияние HNP1 на митохондриальную динамику и метаболизм&lt;/h4&gt;\n&lt;p&gt;В норме митохондрии гепатоцитов постоянно проходят циклы слияния и деления. При развитии MASLD этот процесс нарушается. У мышей линии HNP1TG, получавших диету с высоким содержанием жиров (HFD) в течение 12 недель, наблюдались значительные изменения ультраструктуры митохондрий, включая исчезновение крист, чего не было у контрольных мышей дикого типа (WT). Кроме того, у HNP1TG-мышей усиливался стеатоз печени и уменьшалась масса эпикардиальной жировой ткани (EAT). Вероятно, это связано с развитием инсулинорезистентности и воспаления в белой жировой ткани, что перенаправляет поток глюкозы и жирных кислот в печень, создавая избыточную метаболическую нагрузку.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HNP1TG — это трансгенные мыши, экспрессирующие человеческий нейтрофильный пептид 1 (HNP1), что позволяет изучать его системное влияние на метаболизм.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"perspektivy-issledovanij-i-terapevticheskij-potencial\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#perspektivy-issledovanij-i-terapevticheskij-potencial\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Перспективы исследований и терапевтический потенциал&lt;/span&gt;&lt;/a&gt;Перспективы исследований и терапевтический потенциал&lt;/h4&gt;\n&lt;p&gt;Выявленная связь между нейтрофильными α-дефенсинами и митохондриальной дисфункцией при MASLD подчеркивает ранее недооцененную роль этих факторов врожденного иммунитета в метаболизме. Будущие исследования должны сфокусироваться на трех направлениях: 1) детальное изучение молекулярной основы мультимеризации VDAC1 под действием HNP с помощью ЯМР-спектроскопии, рентгеновской кристаллографии и криоэлектронной микроскопии; 2) оценка прогрессирования стеатоза до цирроза и гепатоцеллюлярной карциномы (HCC) у мышей HNP1TG при длительном HFD; 3) анализ участия других дефенсинов в развитии метаболического синдрома. Поскольку VDAC1 широко представлен в тканях с высокой метаболической активностью, ингибиторы его мультимеризации, такие как VBIT-12pro, могут стать перспективными препаратами для терапии рака, нейродегенеративных и сердечно-сосудистых заболеваний.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на модельных мышах; экстраполяция данных на человека требует осторожности, так как механизмы регуляции метаболизма могут различаться.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-01/a-neutrophil-defensin-vdac1-axis-drives-steatotic-liver-dise.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Роль&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нейтрофилов&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;при MASLD&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Анализ биопсий&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;и трансгенные&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мыши&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;HNP повреждают&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;митохондрии&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;через VDAC1&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Новая мишень&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;для лечения&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;стеатогепатита&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препри
