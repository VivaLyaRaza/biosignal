            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"92\" cy=\"73\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"528\" cy=\"270\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · ONCOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Анализ крови вместо биопсии:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;новый способ выявления рака&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;щитовидной железы&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/a-serum-thyroid-hormone-metabolite-test-for-molecular-diagno-fS1.jpg\" alt=\"Рис. S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;При обнаружении узлов в щитовидной железе врачам часто сложно понять, являются ли они опасными без проведения биопсии. Исследователи предложили новый метод диагностики, основанный на анализе метаболитов гормонов щитовидной железы в сыворотке крови. Этот тест показал высокую точность в различении дифференцированного рака щитовидной железы и доброкачественных образований. Метод может стать важным дополнением к стандартным клиническим протоколам.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-01/a-serum-thyroid-hormone-metabolite-test-for-molecular-diagno.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Тест на метаболиты гормонов щитовидной железы показал точность 94,9% в выявлении рака.&lt;/li&gt;\n&lt;li&gt;Метод особенно эффективен для уточнения диагноза при неопределенных результатах биопсии (категории Bethesda III-IV).&lt;/li&gt;\n&lt;li&gt;Высокая прогностическая ценность положительного результата (99,8%) позволяет использовать тест как надежный инструмент диагностики.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-01/a-serum-thyroid-hormone-metabolite-test-for-molecular-diagno.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Дифференцированный рак щитовидной железы (ДРЩЖ) составляет более 95% всех злокачественных опухолей этого органа. Стандартная диагностика включает ультразвуковое исследование (УЗИ) по системе ACR TI-RADS и тонкоигольную аспирационную биопсию (ТАБ) с последующим цитологическим анализом по системе Bethesda. Однако в 25–30% случаев цитологические результаты остаются неопределенными (категории III–IV), что затрудняет принятие решения о хирургическом вмешательстве.&lt;/p&gt;\n&lt;p&gt;Авторы исследования предположили, что опухоли ДРЩЖ активно метаболизируют гормоны щитовидной железы из-за повышенной экспрессии ферментов, таких как дейодиназа 3 (DIO3) и орнитиндекарбоксилаза (ODC). С помощью жидкостной хроматографии-тандемной масс-спектрометрии (ЖХ-МС/МС) ученые проанализировали уровни специфических метаболитов (T0, 3-T1AM, 3-T1) у 1663 пациентов. Модель машинного обучения продемонстрировала диагностическую точность 94,9% при валидации на независимых когортах, показав высокую прогностическую ценность положительного результата (PPV 99,8%).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование является когортным и требует независимой проверки в клинических условиях, а также оценки влияния различных сопутствующих заболеваний щитовидной железы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-01/a-serum-thyroid-hormone-metabolite-test-for-molecular-diagno.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Данное когортное исследование включало 1663 пациента (1196 женщин, 467 мужчин; медиана возраста 48 лет, межквартильный размах 37–57 лет) с узловыми образованиями щитовидной железы, набранных в период с 2020 по 2025 год в пяти специализированных медицинских центрах. Цитологические и гистопатологические диагнозы были установлены независимым экспертным комитетом, а предоперационные уровни метаболитов гормонов щитовидной железы (THM) в сыворотке крови были определены с помощью жидкостной хроматографии-тандемной масс-спектрометрии.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жидкостная хроматография-тандемная масс-спектрометрия — высокоточный аналитический метод, позволяющий разделять и идентифицировать сложные смеси веществ, такие как гормоны, с предельной точностью.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Диагностическая модель на основе анализа сывороточных THM для дифференциальной диагностики дифференцированного рака щитовидной железы (DTC) и доброкачественных узлов щитовидной железы (BTN) была обучена на данных 872 ретроспективных пациентов (454 с DTC и 418 с BTN). Затем последовала проспективная валидация модели на группе пациентов (195 с DTC и 197 с BTN) и вторая валидация на 399 пациентах (300 с DTC и 99 с BTN).&lt;/p&gt;\n&lt;p&gt;После успешного обучения диагностической модели валидация продемонстрировала специфичность 99,5% (196/197), чувствительность 92,3% (180/195), прогностическую ценность положительного результата (PPV) 99,4%, прогностическую ценность отрицательного результата (NPV) 92,9% и диагностическую точность 95,9% (95% ДИ, 90,8–100,0%) для DTC. Объединение двух валидационных когорт показало специфичность 99,7% (295/296), чувствительность 92,1% (456/495), PPV 99,8%, NPV 88,3% и диагностическую точность 94,9% (95% ДИ, 91,5–98,0%) для DTC.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель показала высокую диагностическую точность (до 96,0%) и специфичность (до 100%) при выявлении DTC, особенно в сложных случаях неопределенных категорий Bethesda III-IV.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тестирование в группе с неопределенными категориями по классификации Bethesda III-IV (139 с DTC, 87 с BTN) показало специфичность 100,0% (87/87), чувствительность 93,5% (130/139), PPV 100,0%, NPV 90,6% и диагностическую точность 96,0% (95% ДИ, 89,2–100,0%) для DTC. Данное исследование представляет новый молекулярный анализ крови на основе сывороточных THM для предоперационной оценки узлов щитовидной железы, который демонстрирует высокий PPV и приемлемый NPV при превосходной общей диагностической точности в отношении DTC.&lt;/p&gt;\n&lt;p&gt;ChiCTR2300070912. Уважаемый редактор, рак щитовидной железы является распространенным эндокринным злокачественным новообразованием. Наиболее частым гистопатологическим типом является папиллярный рак щитовидной железы (PTC), за которым следуют фолликулярный рак щитовидной железы (FTC) и онкоцитарный рак щитовидной железы (OCC). Эти виды рака коллективно классифицируются как дифференцированный рак щитовидной железы (DTC) и составляют &amp;gt;95% всех злокачественных новообразований щитовидной железы. Диагностика DTC обычно начинается с оценки узлов щитовидной железы, которые встречаются у ~60%–70% населения в целом; 5%–10% этих узлов являются DTC, тогда как остальные представляют собой доброкачественные узлы щитовидной железы (BTN). Основная цель диагностической оценки узлов щитовидной железы — дифференциация злокачественных узлов от доброкачественных. Текущими основными методами диагностики узлов щитовидной железы являются ультрасонография и тонкоигольная аспирационная биопсия (FNAB). Для ультрасонографии широко используется система ACR TI-RADS (American College of Radiology Thyroid Imaging Reporting and Data System) для оценки риска злокачественности. Она включает пять возрастающих категорий, от 1 до 5, где категории 1–2 указывают на доброкачественные/неподозрительные узлы, а категория 5 указывает на узлы, вызывающие высокую степень подозрения на злокачественность. Для FNAB широко используется система Bethesda (TBSRTC); она включает шесть диагностических категорий, каждая из которых связана с предполагаемым риском злокачественности, где категория I является недиагностической, II — доброкачественной, III — атипией неопределенного значения, IV — фолликулярной неоплазией, V — подозрительной на злокачественность, а VI — злокачественной. Однако эти диагностические методы имеют ограниченную точность, особенно для категорий Bethesda III–IV, которые охватывают цитологически неопределенные узлы щитовидной железы, встречающиеся в 25%–30% случаев и представляющие серьезную диагностическую проблему в текущем ведении узлов щитовидной железы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дифференцированный рак щитовидной железы (DTC) составляет &amp;gt;95% случаев, однако диагностика узлов категорий Bethesda III–IV остается сложной задачей из-за низкой точности существующих методов.&lt;br /&gt;\n[!tip] FNAB — это процедура взятия образца ткани тонкой иглой для цитологического анализа; система Bethesda стандартизирует интерпретацию этих результатов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Исследовались различные молекулярные тесты для диагностики заболеваний щитовидной железы, наиболее часто используемыми из которых являются тесты на основе РНК или ДНК, выполняемые на образцах FNAB. Эти тесты улучшили диагностическую точность в отношении узлов щитовидной железы, особенно в качестве тестов для «исключения» (rule-out) благодаря их высокой чувствительности и отрицательным прогностическим значениям (NPV) в отношении злокачественности. Однако они имеют общие ограничения, наиболее заметными из которых являются низкая специфичность и положительные прогностические значения (PPV), что обуславливает их низкую способность к «подтверждению» (rule-in) злокачественности. Более того, все они требуют инвазивной процедуры FNAB для получения образцов. В идеале неинвазивный молекулярный тест должен обладать высокой специфичностью и приемлемой чувствительностью, обеспечивая тем самым превосходную общую диагностическую точность.&lt;/p&gt;\n&lt;p&gt;Выявление метаболитов гормонов щитовидной железы в сыворотке крови потенциально может удовлетворить эту потребность. Гормоны щитовидной железы, включая тироксин (T4), 3,5,5′-трийодтиронин (T3) и 3,3′,5′-трийодтиронин (rT3), являются классическими сывороточными биомаркерами функции щитовидной железы, но не имеют диагностической ценности при раке щитовидной железы. Несколько хорошо охарактеризованных метаболитов гормонов щитовидной железы (THM), особенно обнаруживаемых в сыворотке, включают 3,5-дийод-L-тиронин (3,5-T2); 3′,5′-дийод-L-тиронин (3′,5′-T2); 3,3′-дийод-L-тиронин (3,3′-T2); 3′-йод-L-тиронин (3′-T1); 3-йод-L-тиронин (3-T1); L-тиронин (T0) и 3-йодтиронамин (3-T1AM), которые образуются в ходе метаболических путей гормонов щитовидной железы. Эти THM производятся в результате реакций, катализируемых различными ферментами, включая селеноферменты, такие как дейодиназа 3 (DIO3) и орнитиндекарбоксилаза (ODC) (Рис. SN 1). Примечательно, что экспрессия ферментов, метаболизирующих гормоны щитовидной железы, таких как DIO3, значительно повышена в опухолях DTC, стимулируемых онкогенными сигнальными путями, по сравнению с нормальными тканями.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;THM — это продукты распада гормонов щитовидной железы, уровень которых в крови может служить неинвазивным маркером опухолевого процесса.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Подобно гормонам щитовидной железы, THM высвобождаются в кровь, хотя и в низких концентрациях, обычно в диапазоне пг/мл. Обильно экспрессируемые ферменты, метаболизирующие гормоны щитовидной железы — особенно дейодиназы — в опухолях DTC присутствуют в локальной среде щитовидной железы, которая сильно обогащена субстратами гормонов щитовидной железы. Это создает уникальные условия, которые активно и интенсивно стимулируют выработку THM, возможно, даже в относительно небольших опухолях DTC. Следовательно, наличие опухоли DTC может привести к постоянному высвобождению большого количества THM из этого активного источника продукции в кровоток, значительно изменяя концентрации THM в сыворотке, которые в противном случае оставались бы низкими. Это может сделать обнаружение THM в крови чувствительным диагностическим тестом для дифференциации DTC от BTN. Мы проверили эту гипотезу в настоящем двойном слепом клиническом исследовании с использованием жидкостной хроматографии-тандемной масс-спектрометрии (LC-MS/MS), чувствительного и стабильного метода, обычно используемого для измерения сывороточных THM (Рис. SN 13), с целью создания нового молекулярного анализа крови для предоперационной диагностической оценки узлов щитовидной железы.&lt;/p&gt;\n&lt;p&gt;Логистическая регрессионная модель (LRM), включающая три диагностически информативных сывороточных THM — T0, 3-T1AM и 3-T1, была построена и обучена с использованием ретроспективного набора данных из 872 образцов, валидирована с использованием проспективного набора данных из 392 образцов и дополнительно валидирована с использованием второго проспективного набора данных из 399 образцов для диагностики DTC (Рис. 1a, b; Рис. SN 2). Исходные характеристики пациентов, методы тестирования и другая информация представлены в Таблицах SN 1–14 и 19. Обучение модели позволило достичь диагностической специфичности 87,1% (364/418), чувствительности 93,0% (422/454), PPV 88,7%, NPV 91,9% и диагностической точности 90,1% (95% ДИ, 87,0%–92,9%) для DTC. Валидация модели продемонстрировала диагностическую специфичность 99,5% (196/197), чувствительность 92,3% (180/195), PPV 99,4%, NPV 92,9% и диагностическую точность 95,9% (95% ДИ, 90,8%–100%) для DTC. Вторая валидация продемонстрировала диагностическую специфичность 100% (99/99), чувствительность 92,0% (276/300), PPV 100%, NPV 80,5% и диагностическую точность 94,0% (95% ДИ, 89,5%–97,6%) для DTC.&lt;/p&gt;\n&lt;p&gt;Объединение двух валидационных когорт дало диагностическую специфичность 99,7% (295/296), чувствительность 92,1% (456/495), PPV 99,8%, NPV 88,3% и диагностическую точность 94,9% (95% ДИ, 91,5%–98,0%) для DTC (Таблица SN 15).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Разработанная модель на основе трех метаболитов (T0, 3-T1AM, 3-T1) показала высокую диагностическую точность (94,9%) при валидации на независимых когортах, что подтверждает потенциал метода для неинвазивной диагностики DTC.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы провели анализ подгруппы из 698 субъектов с полными данными ультразвукового, цитологического и гистопатологического исследований (Рис. 1c, d). Как и ожидалось, частота гистопатологически подтвержденных злокачественных новообразований последовательно увеличивалась от категории Bethesda II до VI. Среди узлов категории Bethesda II все случаи с отрицательным результатом теста THM (121/121; 100%) оказались гистопатологически доброкачественными. Для узлов категорий Bethesda III и IV 91,5% (54/59) и 89,2% (33/37) случаев с отрицательным результатом THM были гистопатологически доброкачественными соответственно. Среди узлов категорий Bethesda V и VI 22 и 11 случаев соответственно были гистопатологически подтверждены как доброкачественные, и все они дали отрицательный результат в тесте THM.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тест THM показал высокую специфичность (100%) и прогностическую ценность положительного результата (PPV 100%), эффективно подтверждая злокачественность во всех категориях Bethesda.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В Таблице SN (Таблица S16) обобщены диагностические показатели теста THM в отдельных категориях Bethesda. Все (100%) случаи с положительным результатом теста THM были гистопатологически злокачественными во всех категориях Bethesda. В целом тест THM показал диагностическую специфичность 100% (98,4%–100%), чувствительность 91,9% (89,0%–94,1%), PPV 100% (99,1%–100%), NPV 86,7% (82,2%–90,2%) и диагностическую точность 94,7% (91,1%–97,8%). Для 226 случаев в неопределенных категориях Bethesda III и IV тест THM показал диагностическую специфичность 100% (95,8%–100%), чувствительность 93,5% (88,2%–96,6%), PPV 100% (97,1%–100%), NPV 90,6% (83,1%–95,0%) и диагностическую точность 96,0% (89,2%–100%).&lt;/p&gt;\n&lt;p&gt;У этих 698 субъектов с полными ультразвуковыми, цитологическими и гистопатологическими диагнозами наблюдалось ожидаемое увеличение частоты гистопатологически подтвержденной злокачественности от категорий ACR TI-RADS 2 до 5 (Рис. 1e).&lt;/p&gt;\n&lt;p&gt;Для узлов щитовидной железы категории ACR TI-RADS 2 все случаи с отрицательным результатом теста THM (6/6; 100%) были гистопатологически доброкачественными. Для категорий ACR TI-RADS 3 и 4 97,0% (130/134) и 80,9% (93/115) случаев с отрицательным результатом теста THM были гистопатологически доброкачественными соответственно. Для узлов щитовидной железы категории ACR TI-RADS 5 12 случаев были гистопатологически доброкачественными, и все они были отрицательными в тесте THM. Среди случаев с положительным результатом теста THM 100% были гистопатологически злокачественными во всех категориях ACR TI-RADS (Таблица SN).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PPV (прогностическая ценность положительного результата) — вероятность того, что у пациента действительно есть болезнь при положительном результате теста; NPV (прогностическая ценность отрицательного результата) — вероятность отсутствия болезни при отрицательном результате.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Было обследовано 189 субъектов как с дифференцированным раком щитовидной железы (DTC), так и с тиреоидитом Хашимото (HT); тестирование THM показало отсутствие влияния HT на результаты теста (Рис. SN). Тестирование THM у 340 здоровых добровольцев (HV) показало четкое различие между группами HV и DTC (Рис. SN). Иммуногистохимическое окрашивание тканевого микрочипа показало выраженное увеличение экспрессии белков DIO3 и ODC в DTC по сравнению с прилегающими нормальными тканями (P &amp;lt; 0,001 для DIO3 и P &amp;lt; 0,01 для ODC).&lt;/p&gt;\n&lt;p&gt;Уровни DIO3 и ODC были значительно повышены в DTC по сравнению с доброкачественными узлами щитовидной железы (BTN) (P = 0,005 и &amp;lt; 0,001, а также P = 0,01 для ODC) (Рис. SN). Концентрации T0 и 3-T1AM были значительно выше в DTC и прилегающих нормальных тканях, чем в BTN и прилегающих нормальных тканях, тогда как уровень 3-T1 был соответственно ниже, как и ожидалось, в DTC и прилегающих нормальных тканях, чем в BTN и прилегающих тканях (Рис. SN, Таблица SN). Концентрация T0 была значительно положительно коррелирована с размером опухоли DTC (Рис. SN) и положительно коррелировала с 3-T1AM, а также отрицательно коррелировала с 3-T1, как и ожидалось (Рис. SN).&lt;/p&gt;\n&lt;p&gt;Три типа THM существенно не различались между пациентами с DTC с метастазами в лимфатические узлы и без них (Рис. SN). Не было выявлено существенной разницы в содержании йода в моче (UIC) среди групп DTC, BTN и HV (Рис. SN), и UIC может не изменять уровни THM в сыворотке, если это не вызывает измеримую дисфункцию щитовидной железы (Рис. SN). Таким образом, тест THM будет наиболее надежным при выполнении у пациентов с эутиреоидным статусом и нормальным уровнем потребления йода.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на ограниченных группах пациентов; корреляция уровней метаболитов с размером опухоли не доказывает прямую причинно-следственную связь.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В данном исследовании был разработан молекулярный тест на основе THM для узлов щитовидной железы, который последовательно демонстрирует в клинических условиях высокую диагностическую специфичность и PPV, достаточно высокую чувствительность и NPV, а также отличную общую диагностическую точность. Особо следует отметить, что этот тест хорошо работает при неопределенных узлах щитовидной железы категорий Bethesda III-IV, что делает определение THM отличным тестом для «подтверждения» (rule-in), но субоптимальным тестом для «исключения» (rule-out) DTC.&lt;/p&gt;\n&lt;p&gt;В отличие от инвазивных молекулярных тестов на основе тонкоигольной аспирационной биопсии (FNAB), определение THM основано на удобном анализе крови. Этот подход обеспечивает первый предоперационный диагностический анализ крови на DTC. Учитывая почти 100% PPV и способность к «подтверждению», положительный результат теста THM был бы достаточным для диагностики DTC без необходимости дополнительных диагностических мер. Учитывая субоптимальный NPV, отрицательный результат теста THM в значительной степени исключает DTC, особенно в низких категориях Bethesda или ACR TI-RADS. В высоких категориях Bethesda или ACR TI-RADS, которые встречаются клинически гораздо реже, отрицательный результат теста THM необходимо рассматривать в клиническом контексте, и дополнительное использование текущих молекулярных диагностических тестов на основе FNAB с высоким NPV может предоставить дополнительную информацию. Небольшое количество THM, необходимое для достижения высокой диагностической эффективности, делает этот тест экономичным. Способность LC-MS/MS чувствительно определять низкие концентрации THM в сыворотке (пг/мл) согласуется с предыдущими отчетами. Метод LC-MS/MS также был точным и стабильным, что подтверждается замечательным соответствием между результатами клинических тестов и измерениями T4 и T3 методом LC-MS/MS, а также результатами многократных межсуточных измерений THM (Таблица SN). Хотя параметры функции щитовидной железы во всех случаях в этом исследовании находились в пределах нормы, они были несколько ниже у пациентов с DTC, чем у пациентов с BTN, что согласуется с предыдущими отчетами. Это могло привести к недооценке диагностической чувствительности THM сыворотки для DTC. Действительно, диагностическая чувствительность теста повышалась, когда FT4 корректировался как мешающий фактор в логистической регрессионной модели (LRM) (Рис. SN). Результаты относительно связи между экспрессией дейодиназ в DTC и параметрами функции щитовидной железы в сыворотке представлены на Рис. SN.&lt;/p&gt;\n&lt;p&gt;Стоит отметить, что концентрации T0 и 3-T1AM в тканях DTC были на три порядка выше, чем в сыворотке (Рис. SN).&lt;/p&gt;\n&lt;p&gt;Это согласуется с обильным образованием метаболитов тиреоидных гормонов (THM) за счет высокой экспрессии дейодиназ, метаболизирующих тиреоидные гормоны, в опухолях дифференцированного рака щитовидной железы (DTC) в обогащенном субстратами тиреоидных гормонов локальном микроокружении щитовидной железы (Рис. S5 и Таблица S18). Помимо подтверждения предыдущих сообщений о повышенной экспрессии DIO3 при DTC, в настоящем исследовании также наблюдалась заметно повышенная экспрессия ODC по сравнению с нормальными тканями, а также значительно более высокий уровень экспрессии обоих белков при DTC, чем при доброкачественных узлах щитовидной железы (BTN). Как и ожидалось, мы обнаружили связь между размером опухоли DTC и сывороточными THM, особенно T0 — поздним метаболитом пути метаболизма тиреоидных гормонов, катализируемого несколькими дейодиназами (Рис. S1, S6). Мы не обнаружили влияния метастазов в лимфатические узлы на уровень THM в сыворотке, что вполне ожидаемо, поскольку, в отличие от богатой тиреоидными гормонами щитовидной железы, лимфатические узлы не содержат достаточного количества тиреоидных гормонов, способных служить субстратами для дейодиназ. Тест на THM может быть непригоден для лиц с недостаточным или избыточным потреблением йода, однако в данном исследовании это не представляло проблемы ввиду схожих уровней йода в моче среди различных групп пациентов. Тест также может не подойти редким пациентам с мутациями в генах дейодиназ. Мы также выполнили перерасчет прогностической ценности, применив специфичные для когорт чувствительность и специфичность к предполагаемой распространенности заболевания (Таблица S20).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/a-serum-thyroid-hormone-metabolite-test-for-molecular-diagno-fS1.jpg\" alt=\"Рис. S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дейодиназы (DIO) — ферменты, которые последовательно отщепляют атомы йода от молекул тироксина (T4), превращая их в T3, реверсивный T3 и вплоть до полного удаления йода с образованием тиронина (T0).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Текущие результаты могут быть применимы преимущественно к папиллярному раку щитовидной железы (PTC) в связи с относительно небольшим числом случаев фолликулярного рака щитовидной железы (FTC) и онкоцитарного рака (OCC), включенных в исследование, даже несмотря на то, что последние, как и PTC, все дали положительный результат в тесте THM. Будущие исследования с включением большего числа случаев FTC/OCC обеспечат дальнейшую валидацию теста для этих типов опухолей. У некоторых участников с BTN в ретроспективной когорте обучения модели диагноз BTN основывался только на цитологии или ультразвуковом исследовании. Вероятно, у таких пациентов с «BTN» могли присутствовать злокачественные узлы, что могло привести к «ложноположительным» результатам теста THM и искусственно снизить диагностическую специфичность. Действительно, диагностическая эффективность теста THM в двух когортах валидации модели, где все случаи DTC и BTN имели гистопатологически подтвержденные диагнозы, превосходила показатели в обучающей когорте. Применимость теста THM к редким типам рака щитовидной железы также еще предстоит исследовать.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В обучающей выборке диагноз доброкачественных узлов частично ставился без гистологии, что могло занизить реальную специфичность метода из-за невыявленных злокачественных опухолей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Таким образом, в данном исследовании разработан новый анализ крови на сывороточные THM для молекулярно-диагностической оценки узлов щитовидной железы, который демонстрирует превосходную способность подтверждения диагноза («rule-in») и менее надежные характеристики исключения диагноза («rule-out») для DTC, в особенности для PTC. Это первый анализ крови для эффективной молекулярно-диагностической оценки узлов щитовидной железы и точной предоперационной диагностики DTC, в частности PTC, обладающий потенциалом оказать существенное клиническое влияние.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Разработанная панель сывороточных метаболитов тиреоидных гормонов стала первым тестом по крови для точной дооперационной верификации DTC (прежде всего PTC), обладающим превосходной способностью однозначного подтверждения злокачественности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-01/a-serum-thyroid-hormone-metabolite-test-for-molecular-diagno.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Сложность&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;диагностики&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;узлов&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;щитовидки&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Анализ&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;метаболитов&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;гормонов через&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ЖХ-МС&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Высокая&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;точность&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;выявления рака&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Неинвазивный&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тест для&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;врачей&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не прошёл рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-01/a-serum-thyroid-hormone-metabolite-test-for-molecular-diagno.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия препринта&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;medRxiv&lt;/td&gt;\n&lt;td&gt;oncology&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Guo, M.; Geng, H.; Sun, Q.; Wan, H.; Zhou, P.; Song, Y.; Zou, C.; Zang, X.; Xi, H.; Liao, T.; Liu, X.; Peng, G.; Wang, Y.; Xing, M.; Liang, J.; THMs Group,&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-01/a-serum-thyroid-hormone-metabolite-test-for-molecular-diagno.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ссылка&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница препринта&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://www.medrxiv.org/content/10.64898/2026.09.25.26363992v1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;medrxiv.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt
