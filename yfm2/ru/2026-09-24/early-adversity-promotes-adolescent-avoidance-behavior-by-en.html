/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"protokol-ogranichennogo-kolichestva-podstila-i-gnezdovogo-materiala\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#protokol-ogranichennogo-kolichestva-podstila-i-gnezdovogo-materiala\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Протокол ограниченного количества подстила и гнездового материала&lt;/span&gt;&lt;/a&gt;Протокол ограниченного количества подстила и гнездового материала&lt;/h4&gt;\n&lt;p&gt;Материнские особи подвергались раннему жизненному стрессу (ELA) с использованием протокола ограниченного количества подстила и гнездового материала (LBN) — модели дефицита ресурсов, при которой мать и потомство содержались в условиях минимального количества подстила с ограниченным доступом к материалу для гнездования в течение 7 дней подряд (P4–P11). Ранее было доказано, что эта модель нарушает материнский уход. На P4 мать и потомство переводили из стандартной домашней клетки, содержащей два ватных круглых гнездовых материала размером 1х1 дюйм и одно одноразовое убежище из древесной пульпы, в клетку LBN, содержащую сетчатый пол из проволоки и один ватный гнездовой материал размером 1х1 дюйм. Контрольные мать и потомство стандартного выращивания переводились в новую стандартную домашнюю клетку. Все мыши сохраняли постоянный доступ к корму и воде. Спустя одну неделю (P11) потомство и матери возвращались в стандартные условия содержания с полным количеством подстила и гнездового материала. Материнское поведение регистрировалось в течение 1 часа с 8:00 до 9:00 и с 16:00 до 17:00 ежедневно в течение недели. Материнское поведение оценивалось путем ручного измерения доли времени, в течение которого мать находилась на гнезде во время утренней регистрации на P6. Все потомство отнималось от матери на P21.&lt;/p&gt;\n&lt;h4 id=\"hirurgicheskie-vmeshatelstva\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#hirurgicheskie-vmeshatelstva\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Хирургические вмешательства&lt;/span&gt;&lt;/a&gt;Хирургические вмешательства&lt;/h4&gt;\n&lt;p&gt;В возрасте P19–21 мыши погружались в наркоз с использованием 3% изофлюрана в кислороде до потери выпрямительного рефлекса и переносились в стереотаксический аппарат. Стереотаксис был оснащен приспособлением для растущих мышей, включающим малую зубную пластинку и детские ушные планки. Нестероидное противовоспалительное средство вводилось до и после операции для минимизации боли и дискомфорта. Голова мыши выбривалась и обрабатывалась тремя циклами попеременного протирания бетадином, а затем 70% этанолом. Под скальп в качестве местного анестетика вводилось 2% лидокаина. На скальпе выполнялся небольшой разрез. Для вирусных инъекций над целевой областью введения высверливалось небольшое отверстие, и шприц Гамильтона с вирусом опускался до правильных стереотаксических координат. Вирус вводился методом давления со скоростью 100 нл/мин, после чего по завершении инъекции шприц оставляли на месте в течение 5 минут, а затем медленно извлекали из черепа. Во всех экспериментах животным давали восстановиться, после чего помещали обратно в чистую домашнюю клетку к матери и однопометникам до P21, когда производился отъем. Животные исключались из анализа, если экспрессия вируса или расположение оптоволокна отклонялись от целевой зоны.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стереотаксическая хирургия используется для точной доставки вирусных векторов в определенные области мозга с применением обезболивания и послеоперационного ухода.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Волоконная фотометрия, оптогенетика и нокдаун CRH Для экспериментов с фотометрией мышам вводили односторонне вирус AAV, экспрессирующий генетически кодируемый кальциевый индикатор GCaMP6s (AAV9-CAG-GCaMP6s-WPRE-SV40, Addgene № 100844, 300 нл) в базолатеральную миндалину (BLA) (передне-задняя координата (AP): -1.6, медио-латеральная (ML): -3.20, дорсо-вентральная (DV): -4.8). Для оптогенетических экспериментов мышам производили двустороннее введение AAV (ингибирование: AAV5-Ef1a-DIO-PdCO-mScarlet, Addgene № 198516, или возбуждение: AAV8-nEF-Con/Foff 1.0-ChR2-EYFP, Addgene № 137163, 200 нл) либо контрольных AAV (ингибирование: AAV5-Ef1a-DIO-EYFP, Addgene 27056, возбуждение: AAV8-Ef1a-DIO-mCherry, Addgene № 114471, 200 нл) в вентромедиальную префронтальную корку (vmPFC) (AP 1.8, ML ±0.25, DV -2.9). Для широкого ингибирования проекций vmPFC→BLA использовались AAV5-hysn-PdCO-EGFP (Addgene № 198513, 200 нл) и AAV5-hysn-mCherry (Addgene № 114472, 200 нл). Для компенсации роста черепа односторонние (фотометрия, 400 мкм, 0.50 NA; Thor Labs) или двусторонние (оптогенетика, 200 мкм, Newdoon) оптические волокна имплантировались в ходе отдельной операции за 5 дней до тренировки PMA и фиксировались с помощью цемента Metabond (Parkell). Для экспериментов по нокдауну мышам вводили двусторонне креатин-зависимый (cre-dependent) AAV, экспрессирующий анти-CRH shRNA (AAV2/9-CMV-DIO-(mCherry-U6)-shRNA(CRH)-WPRE-hGHpA, BrainVTA, PT-12461, 200 нл), или скрамбл-контроль (AAV2/9-CMV-DIO-(mCherry-U6)-shRNA(scramble)-WPRE-hGHpA, BrainVTA, PT-2788, 200 нл).&lt;/p&gt;\n&lt;p&gt;Вирусный трекинг Мышам вводили односторонне 150 нл смеси в разведении 3:1 креатин-зависимого AAV (AAVrg-CAG-FLEX-GFP, Addgene № 51502) и не зависящего от cre вируса AAV (AAV5-CAG-tdTomato, Addgene № 58462) в BLA (AP -1.6, ML -3.20, DV -4.8). Последний использовался для верификации успешного нацеливания ретроградного вируса; животные исключались, если экспрессия обнаруживалась вне BLA.&lt;/p&gt;\n&lt;h4 id=\"povedencheskie-testy\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#povedencheskie-testy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поведенческие тесты&lt;/span&gt;&lt;/a&gt;Поведенческие тесты&lt;/h4&gt;\n&lt;p&gt;Платформенно-опосредованное избегание Мышей приучали к рукам в течение 3 дней перед процедурой поведенческого тестирования. Камера для выработки условного рефлекса состояла из клетки размером 18 x 30 см с решетчатым полом, подключенным к генератору случайных ударов током (Lafayette Instruments). Камера была окружена акустической камерой изготовленного на заказ типа и ароматизирована 50% раствором Windex. Тонкая акриловая платформа (толщиной 1,3 см) покрывала 25% пола. Две небольшие чашки для взвешивания, наполненные экстрактом ванили или миндаля, помещались под пол для стимулирования исследования камеры мышами. В период среднего подросткового возраста (P33-36) проводилось обучение, и мышам предъявляли три исходных 30-секундных тона частотой 4 кГц (условный сигнал, УС), за которыми следовало девять предъявлений УС, заканчивавшихся одновременно с 2-секундным ударом током по лапам (0,13 мА). Мышей перфузировали через 10 минут (экспрессия pCREB) или 1 час (экспрессия Fos) после обучения, а их мозг собирали и обрабатывали для иммуноокрашивания на Fos. Во время всех остальных экспериментов мышам предъявляли шесть УС в отсутствие ударов током на следующий день для проверки способности извлекать и проявлять память избегания.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Платформенно-опосредованное избегание — это поведенческий тест, где животное учится переходить на безопасную платформу в ответ на звуковой сигнал, чтобы избежать неприятного удара током.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тоны разделялись интервалами случайной длины от 80 до 150 секунд. Для нокдауна CRH в клетках vmPFCVGLUT1+ мышей перфузировали через 1 час после обучения для оценки экспрессии Fos.&lt;/p&gt;\n&lt;p&gt;Чувствительность к удару током Для оценки минимальной интенсивности удара током в лапы, необходимой для вызова поведенческой реакции (вокализация, бегство или бросок), наивных подростковых мышей помещали в ту же камеру оперантного обучения, что и в тестах PMA, но без платформы. Мышей подвергали воздействию серии ударов током в лапы, начиная с 0,02 мА и увеличивая с шагом 0,02 до 0,20 мА. Регистрировалась амплитуда удара током, при которой конкретная мышь впервые издавала вокализацию, совершала бегство или бросок. Вокализация определялась как испускание слышимого звука. Бегство определялось как быстрые шаги без прыжков. Бросок определялся как высокоскоростной горизонтальный прыжок.&lt;/p&gt;\n&lt;p&gt;Тест «Открытое поле» Мышей акклиматизировали к комнате для тестирования в течение 10 минут, а затем помещали в пластиковую арену (50 x 50 x 40 см). Локомоторную активность и время, проведенное в центре арены, регистрировали в течение 5-минутного (наивные мыши) или 10-минутного (оптогенетические манипуляции и нокдаун) теста с помощью веб-камеры. Для анализа данных использовалась система видеослежения BioViewer (для наивных), в то время как EZTrack75 использовалась для анализа остальных наборов данных. Арена была разделена на две зоны: центр (25% от общей площади) и периферию (75% от общей площади), при этом регистрировались время пребывания и количество заходов в каждую зону, а также общая пройденная дистанция. Для оптогенетических экспериментов записи начинались с 60-секундного базового периода, за которым следовало четыре цикла по 30 секунд включения лазера и 30 секунд выключения лазера. Во время этих периодов количественно оценивали время, проведенное в каждой зоне, количество заходов в зоны и общую пройденную дистанцию, и сравнивали их между периодами включения и выключения лазера.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Тест «Открытое поле» измеряет общую двигательную активность и уровень тревожности грызунов по времени, проведенному в центре пустой открытой арены.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Приподнятый крестообразный лабиринт Мышей акклиматизировали к комнате для тестирования в течение 10 минут. Мышей помещали в центр лабиринта крестообразной формы так, чтобы их нос был направлен в сторону открытого рукава. Локомоторную активность и время, проведенное в открытых и закрытых рукавах, а также в центре арены, регистрировали в течение 5 минут с помощью веб-камеры. Для анализа данных использовался Bioviewer, разделяющий арену на два набора открытых рукавов, два закрытых и центр. Регистрировались время пребывания и количество заходов в каждую зону, а также общая пройденная дистанция.&lt;/p&gt;\n&lt;p&gt;Приподнятый круглый лабиринт Мышей акклиматизировали к комнате для тестирования в течение 10 минут. Мышей помещали в закрытый рукав так, чтобы их нос был направлен в сторону открытого рукава кольцеобразного приподнятого лабиринта. Локомоторную активность и время, проведенное в открытых и закрытых рукавах, а также в центре арены, регистрировали в течение 10 минут с помощью веб-камеры. Для анализа данных использовался EZTrack. Регистрировались время пребывания и количество заходов в каждую зону, а также общая пройденная дистанция.&lt;/p&gt;\n&lt;p&gt;Тест с новым запахом В день 1 мышей помещали в пустую пластиковую арену (50 x 50 x 40 см) на 10 минут для привыкания. На день 2 мышей возвращали в арену с двумя одинаковыми ароматизированными пластиковыми сферами (один и тот же запах для каждой: миндаль или ваниль, сбалансировано для разных мышей). Мышей оставляли в камере до тех пор, пока они не взаимодействовали со сферами в общей сложности в течение 20 с. Мыши исключались из анализа, если они не достигали этого критерия в течение 10 минут. Взаимодействие определялось как нахождение на расстоянии в пределах 2 см от сферы с носом, направленным на нее. На день 3 мышей помещали в арену на 10 мин, при этом одна сфера была ароматизирована исходным запахом, а другая — новым запахом (стороны были сбалансированы между животными). Время взаимодействия количественно оценивали по видеозаписям. Группы представляют собой объединенные результаты нескольких независимо проведенных поведенческих когорт.&lt;/p&gt;\n&lt;h4 id=\"prosvetlenie-mozga-i-vizualizaciya-vsego-mozga\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#prosvetlenie-mozga-i-vizualizaciya-vsego-mozga\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Просветление мозга и визуализация всего мозга&lt;/span&gt;&lt;/a&gt;Просветление мозга и визуализация всего мозга&lt;/h4&gt;\n&lt;p&gt;Ткань мозга мышей подготавливали по модифицированной версии протокола Adipo-Clear. Если кратко, мышам проводили внутрисердечную перфузию на льду 20 мл фосфатно-солевого буфера (PBS, Invitrogen) с последующим введением 4% параформальдегида (PFA; Electron Microscopy Sciences). Затем полушария мозга разрезали примерно на 1 мм латеральнее средней линии и дофиксировали в течение ночи при температуре 4℃ в 4% PFA. На следующий день образцы последовательно обезвоживали с использованием метанола (MeOH, Fisher Scientific), смешанного с буфером B1n (1:1000 Triton X-100, 2% масс./об. глицина, 1:10 000 NaOH 10N, 0.02% азида натрия). Каждый градиент метанола (20%, 40%, 60% и 80%) применяли в течение 1 часа на качалке (VWR). Затем образцы дважды промывали 100% MeOH по 1 часу каждый и впоследствии инкубировали в течение ночи в растворе дихлорметана (DCM) в соотношении 2:1. На следующий день образцы дважды промывали в 100% DCM по 1 часу каждый, после чего проводили три промывки в 100% MeOH с постепенно увеличивающейся продолжительностью (30 минут, 45 минут, 1 час). Затем образцы тканей отбеливали в течение 4 часов в растворе H₂O₂ в соотношении 5:1. Регидратацию осуществляли посредством серии промывок в буфере MeOH/B1n с уменьшающейся концентрацией метанола (80%, 60%, 40% и 20%) по 30 минут каждая, с последующей финальной часовой промывкой в буфере B1n. Пермеабилизацию выполняли с использованием 5% DMSO / 0.3 M глицина в буфере PTxWH в течение 1 часа с последующей дополнительной 2-часовой инкубацией в свежем растворе для пермеабилизации. Затем образцы ополаскивали в PTxWH в течение 30 минут и оставляли в свежем буфере PTxWH на ночь. На следующий день выполняли еще две промывки PTxWH (в течение 1 часа и нескольких часов).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод просветления тканей (tissue clearing) позволяет сделать непрозрачные биологические органы прозрачными для света с помощью химических растворителей, сохраняя при этом клеточные структуры и флуоресцентные метки для трёхмерной микроскопии.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Образцы инкубировали с первичными антителами против RFP (Rockland Immunochemicals) в разведении 1:300 в буфере PTxWH при постоянном встряхивании при 37℃ в течение 11 дней. После этого следовала последовательная серия промывок в PTxWH: два раза по 1 часу и два раза по 2 часа, с дополнительными сменами буфера PTxWH в течение 2 дней при 37℃. После инкубации с первичными антителами образцы инкубировали со вторичными антителами в разведении 1:300 (AlexaFluor 647, ThermoFisher Scientific) при 37℃ в течение 8 дней с регулярными промывками PTxWH в течение двух дней. После окрашивания антителами образцы дважды ополаскивали в PBS (по 1 часу каждый), затем два раза по 2 часа и оставляли на ночь. Обезвоживание включало ступенчатую серию промывок MeOH (20%, 40%, 60% и 80%) по 30 минут каждая, с последующими тремя промывками в 100% MeOH (30 минут, 1 час и 1.5 часа). Образцы инкубировали в течение ночи в растворе DCM в соотношении 2:1 на качалке. На следующий день образцы дважды промывали в 100% DCM по 1 часу каждый, а затем просветляли в 100% дибензилэфире (DBE), причем DBE заменяли свежим через 4 часа. Просветленные образцы хранили в DBE при комнатной температуре в темноте, а визуализацию выполняли спустя как минимум 24 часа.&lt;/p&gt;\n&lt;p&gt;Визуализация всего мозга. Образцы мозга визуализировали с помощью светолистового микроскопа (Ultramicroscope II, LaVision Biotec), оснащенного sCMOS-камерой (Andor Neo) и объективом 2x / 0.5 NA (MVAPLAPO 2x) с погружным колпачком с рабочим расстоянием 6 мм. Стопки изображений получали при 0.8-кратном оптическом зуме под управлением программного обеспечения Imspector Microscope v28. Для визуализации клеток использовались лазеры с длиной волны 488 нм и 640 нм (мощность лазера 20%). Сканирование выполняли с размером шага 3 мкм, используя метод непрерывного сканирования световым листом с алгоритмом смешивания для канала 640 нм (20 приобретений на плоскость) и без горизонтального сканера для канала 488 нм.&lt;/p&gt;\n&lt;h4 id=\"ex-vivo-elektrofiziologiya\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#ex-vivo-elektrofiziologiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ex vivo электрофизиология&lt;/span&gt;&lt;/a&gt;Ex vivo электрофизиология&lt;/h4&gt;\n&lt;p&gt;Хирургическое вмешательство Для оптогенетической стимуляции аксонов vmPFCCRH+ в BLA мы ввели 300 нл AAV8-Ef1a-double floxed-hChR2(H134R)-mCherry)WPRE-HGHpA (Addgene, 20297) в левую vmPFC, используя описанные выше методики. Операции выполнялись за 16–18 дней до регистрации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оптогенетика позволяет управлять активностью нейронов с помощью света, доставляя светочувствительные белки (такие как канальцеродопсин) в определенные зоны мозга при помощи вирусных векторов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Приготовление острых срезов головного мозга Для приготовления острых срезов мозга мы анестезировали мышей изофлураном и проводили транскардиальную перфузию ледяным искусственным раствором спинномозговой жидкости для резки (ACSF), содержащим 2,5 мМ KCl, 1 мМ NaH2PO4, 26,2 мМ NaHCO3, 4 мМ MgCl2, 11 мМ глюкозы, 210,3 мМ сахарозы, 0,5 мМ CaCl2 и 0,5 мМ аскорбата натрия (с барботированием 95% O2/5% CO2). Мозг быстро извлекали, и срезы BLA толщиной 300 мкм получали из полушария, ипсилатерального месту инъекции, с использованием вибротома Leica VT1200S.&lt;/p&gt;\n&lt;p&gt;Срезы переносили в стандартный раствор ACSF, содержащий 125 мМ NaCl, 2,5 мМ KCl, 26,2 мМ NaHCO3, 2 мМ MgCl2, 11 мМ глюкозы и 2 мМ CaCl2 (с барботированием 95% O2/5% CO2), и выдерживали при температуре 34 ℃ в течение 34–40 минут. Затем срезам давали остыть до комнатной температуры. Срезы, содержащие vmPFC, также собирали для подтверждения места инъекции.&lt;/p&gt;\n&lt;p&gt;Электрофизиология срезов Регистрацию проводили при комнатной температуре в стандартном растворе ACSF. Область BLA определяли по белым мозговым трактам и флуоресценции аксонов vmPFCCRH+. Клетки визуализировали под инфракрасно-дифференциальным интерференционным контрастом через объектив с увеличением ×40.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод пэтч-клампа (фиксация потенциала/тока) позволяет измерять электрическую активность отдельных нейронов с помощью микроэлектрода, присасывающегося к клеточной мембране.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эксперименты в режиме фиксации потенциала проводились с использованием боросиликатных пипеток (5–7 МОм), заполненных внутренним раствором, содержащим 117 мМ метансульфоната цезия, 20 мМ HEPES, 0,4 мМ ЭГТА, 2,8 мМ NaCl, 5 мМ TEA-Cl, 4 мМ Na2-АТФ и 0,4 мМ Na-ГТФ, доведенным до pH 7,3 с помощью гидроксида цезия (280–290 мосм).&lt;/p&gt;\n&lt;p&gt;Спонтанные возбуждающие и тормозные токи регистрировались в течение 3 минут без разрыва соединения, при этом нейроны удерживались при потенциале -70 мВ или 0 мВ соответственно. Возбуждающие токи от стимуляции терминалей vmPFCCRH+ получали, удерживая нейроны при потенциале –70 мВ и подавая импульс синего света длиной 0,5 мс (~470 нм) мощностью 50 мВт через объектив ×40 с использованием источника света CoolLED pE-300Ultra.&lt;/p&gt;\n&lt;p&gt;Регистрацию с парными импульсами проводили, подавая идентичные световые стимулы с интервалом 100 мс. В набор данных вызванных токов включали только те нейроны, которые демонстрировали стабильные синаптические ответы на оптическую стимуляцию. Тормозные токи регистрировались аналогичным образом, но при удержании нейронов на уровне 0 мВ.&lt;/p&gt;\n&lt;p&gt;Данные собирали с помощью усилителя Multiclamp 700B и оцифровщика Digidata 1440A (Axon Instruments) с использованием программы pClamp 10 (Molecular Devices). Записи дискретизировали с частотой 10 кГц и фильтровали на частоте 3 кГц для вызванных записей и 1 кГц для спонтанных записей.&lt;/p&gt;\n&lt;p&gt;Сопротивление последовательной цепи и входное сопротивление контролировали на протяжении всего эксперимента путем измерения емкостного переходного процесса и стационарного отклонения в ответ на тестовый импульс амплитудой 5 мВ соответственно. Сопротивление последовательной цепи составляло менее 25 МОм, изменялось не более чем на 20% в течение сеанса и не компенсировалось.&lt;/p&gt;\n&lt;p&gt;Данные анализировали с помощью Python v3.7. Анализ основывался на среднем значении десяти разверток. Токи анализировались относительно базового тока удержания. EPSC и IPSC количественно оценивали путем измерения пикового ответа при фиксации потенциала клеток на уровне –70 мВ и 0 мВ соответственно.&lt;/p&gt;\n&lt;h4 id=\"in-situ-gibridizaciya\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#in-situ-gibridizaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;In situ гибридизация&lt;/span&gt;&lt;/a&gt;In situ гибридизация&lt;/h4&gt;\n&lt;p&gt;Мышам проводили внутрисердечную перфузию 20 мл фосфатно-солевого буфера (PBS, Invitrogen), после чего — 4% параформальдегидом (PFA; Electron Microscopy Sciences). Затем мозг извлекали и помещали в PFA на 24 часа, после чего выдерживали в 30% растворе сахарозы в течение 3 дней перед заливкой в компаунд для оптимальной резки при температуре замерзания (OCT) и хранением при температуре -80℃. Срезы толщиной 20 мкм готовили с использованием криостата (Leica Microsystems) и монтировали на предметные стекла Superfrost Plus (Fisher Scientific). Для мечения Vglut1 и Vgat мы обрабатывали срезы с использованием набора RNAscope Multiplex Fluorescent Detection kit v2 (ACD Bio #323110) с зондом для Vglut1 в C3 (ACD Bio #501101-C3) и Vgat в C2 (ACD Bio # 319191-C2) и красителей TSA Vivid Dye 570 и 620 соответственно. Ретроградно меченные клетки vmPFCCRH+→BLA окрашивали с помощью иммуногистохимии в соответствии с протоколом RNAscope. Гидрофобный маркер использовали для создания барьера вокруг срезов мозга перед промыванием в трех порциях PBS по 10 минут, пермеабилизацией в течение 2 часов в PBS с 0.5% Triton-X100 и инкубацией в течение ночи при 4℃ с использованием первичных куриных антител против GFP (1:2000; Aves Lab). На следующий день срезы промывали в PBS и инкубировали в течение 2 часов в ослиных антителах против куриного IgG, конъюгированных с Alexafluor 488 (1:1000; JacksonImmunoResearch) при комнатной температуре. После 30-секундной инкубации в DAPI стекла накрывали покровными стеклами и сканировали на конфокальном микроскопе Leica STELLARIS (Leica Microsystems) с объективом 20x.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Метод RNAscope позволяет визуализировать экспрессию отдельных молекул РНК в тканях с высокой чувствительностью, а иммуногистохимия выявляет белки с помощью меченых антител.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для проверки успешности нокдауна в группе Crh-shRNA по сравнению с контролем со скремблированной последовательностью мы обрабатывали срезы с использованием набора RNAscope Multiplex Fluorescent Detection kit v2 (ACD Bio #323110) с зондом для Crh в C2 (ACD Bio #316091-C2) и TSA Vivid Dye 620. Мечение mCherry проводили в соответствии с протоколом RNAscope с использованием иммуногистохимии. После трех промывок в PBS срезы пермеабилизировали в течение 2 часов в PBS с 0.5% Triton-X100 (PBST) и инкубировали в течение ночи при 4℃ с кроличьими первичными антителами против RFP (1:2000; Rockland Immunochemicals), разведенными в PBST. На следующий день срезы промывали по 10 минут 3 раза в PBS и инкубировали во вторичных ослиных антителах против кроличьего IgG, конъюгированных с Cy3 (1:1000; JacksonImmuno Research), в течение 2 часов при комнатной температуре. DAPI наносили на 30 секунд перед заключением под флуомоунт. Изображения получали с помощью конфокального микроскопа Leica STELLARIS с объективом 20x. Все анализы проводились в ImageJ, а перекрытие Vglut1 и Vgat с клетками AAVrg CRH+, а также уровни экспрессии Crh в положительных по mCherry клетках количественно оценивались с помощью ImageJ версии 1.54f.&lt;/p&gt;\n&lt;p&gt;Для количественной оценки экспрессии Crh в клетках Vglut1+ и Vglut1- в vmPFC мы обрабатывали срезы с использованием набора RNAscope с зондом для Crh в C2 (ACD Bio #316091-C2) и Vglut1 в C1 (ACD Bio #501101) с TSA Vivid Dye 620 и 650 соответственно. Изображения получали с помощью конфокального микроскопа Leica STELLARIS с объективом 20x. Все анализы проводились в ImageJ, в частности, количественно определялось количество экспрессирующих Crh клеток, а также уровни их экспрессии — рассчитываемые на клетки Vglut1+ и Vglut1-. Количественная оценка производилась на изображениях, полученных при 20x. Примеры изображений были получены при 63x.&lt;/p&gt;\n&lt;h4 id=\"gistologiya\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#gistologiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гистология&lt;/span&gt;&lt;/a&gt;Гистология&lt;/h4&gt;\n&lt;p&gt;Мышам проводили внутрисердечную перфузию 20 мл фосфатно-солевого буфера (PBS, Invitrogen), после чего — 4% параформальдегидом (PFA; Electron Microscopy Sciences). Затем мозг извлекали и помещали в PFA на 24 часа, после чего выдерживали в 30% растворе сахарозы в течение 3 дней перед заливкой в компаунд для оптимальной резки при температуре замерзания (OCT) и хранением при температуре -80℃. Срезы толщиной 60 мкм готовили с использованием криостата. Во всех экспериментах срезы пермеабилизировали в течение 2 часов в PBST и инкубировали в течение ночи при 4°C с первичными антителами, разведенными в PBST. На следующий день срезы промывали в PBS в течение 5 минут 3 раза, инкубировали в течение 2 часов при комнатной температуре со вторичными антителами, разведенными в PBST, инкубировали в DAPI, разведенном 1:4000 в PBS, монтировали и накрывали покровным стеклом с флуомоунтом. Изображения получали с использованием либо сканирующего микроскопа Leica DM6, либо конфокального микроскопа Leica STELLARIS.&lt;/p&gt;\n&lt;p&gt;Для Рис. 2A, Рис. 3D, Рис. S3A, Рис. S4A,B, D, Рис. S5A-D, Рис. S7B,C использовались первичные куриные антитела против GFP (1:2000; Aves Lab) и ослиные антитела против куриного IgG, конъюгированные с Alexafluor 488 (1:1000; Jackson Immunoresearch). Для Рис. S3C использовались первичные кроличьи антитела против pCREB (1:500; Cell Signaling Technology) и вторичные ослиные антитела против кроличьего IgG, конъюгированные с Cy3 (1:100; JacksonImmuno Research, #711-165-152). Для Рис. 3D, Рис. S5A-D, Рис. 5F,M использовались первичные кроличьи антитела против Fos (1:1000; Synaptic Systems) и вторичные ослиные антитела против кроличьего IgG, конъюгированные с Alexa-Fluor 647 (1:1000; JacksonImmuno Research, #711-605-152). Для Рис. 1M, 4C, 5A,H, Рис. S2A, B, Рис. S6A-C, Рис. S8A,L, Рис. S10A,B использовались антитела против RFP кролика (1:2000; Rockland Immunochemicals) и вторичные ослиные антитела против кроличьего IgG, конъюгированные с Cy3 (1:1000, JacksonImmuno Research).&lt;/p&gt;\n&lt;h4 id=\"kolichestvennyj-i-statisticheskij-analiz\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#kolichestvennyj-i-statisticheskij-analiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;КОЛИЧЕСТВЕННЫЙ И СТАТИСТИЧЕСКИЙ АНАЛИЗ&lt;/span&gt;&lt;/a&gt;КОЛИЧЕСТВЕННЫЙ И СТАТИСТИЧЕСКИЙ АНАЛИЗ&lt;/h4&gt;\n&lt;p&gt;Самцы и самки мышей случайным образом распределялись по экспериментальным группам, что обеспечивало включение обоих полов в каждую группу. Для манипуляций экспериментальные условия (например, контроль против опсина) распределялись среди сибпсов для формирования контрольных групп соответствующего возраста и из того же помёта. Сбор данных, а также анализ видеозаписей и изображений поведения выполнялись экспериментаторами, которые не знали принадлежности к экспериментальным группам. Анализ поведенческих данных проводился вслепую к экспериментальным условиям с использованием автоматизированных конвейеров анализа. При ручном анализе изображений исследователи не знали о характере экспериментального воздействия.&lt;/p&gt;\n&lt;p&gt;Все статистические тесты выполнялись в GraphPad Prism (v10.3.1) или MATLAB (vR2022a, Mathworks). Размеры наших выборок аналогичны тем, которые сообщались в предыдущих публикациях; однако они не определялись предварительно с помощью статистических методов. Сводные графики представляют среднее значение ± стандартная ошибка среднего. Тесты Шапиро-Уилка использовались для определения нормальности распределения, а непараметрические тесты применялись в случае отклонения от нормальности. Статистические тесты и значения указаны в подписи к каждому рисунку. Парные t-тесты были двусторонними, и различия считались значимыми при достижении уровня достоверности.&lt;/p&gt;\n&lt;h4 id=\"povedencheskij-analiz\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#povedencheskij-analiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поведенческий анализ&lt;/span&gt;&lt;/a&gt;Поведенческий анализ&lt;/h4&gt;\n&lt;p&gt;Высокоразрешающие видеозаписи PMA собирались с частотой 50 Гц с использованием USB-камер Chameleon3 (Teledyne FLIR), трекинг точек на видео выполнялся в DeepLabCut v2.077, а поведение анализировалось с помощью BehaviorDEPOT v1.3b78. Пользовательский код MATLAB использовался для количественной оценки времени на платформе, латентного периода до входа на платформу, замирания и скорости передвижения. Тесты «открытое поле», «приподнятый крестообразный лабиринт», тесты с новым запахом и RTPA снимались на веб-камеру.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;DeepLabCut и BehaviorDEPOT — это современные программные инструменты на основе компьютерного зрения для автоматизированного трекинга и количественного анализа поведения животных в видеозаписях.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Новый запах регистрировался в реальном времени экспериментатором. Тесты «открытое поле», «приподнятый крестообразный лабиринт» и RTPA отслеживались с помощью автоматизированного программного обеспечения для видеослежения BioViewer.&lt;/p&gt;\n&lt;h4 id=\"volokonno-opticheskaya-fotometriya-vo-vremya-pma\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#volokonno-opticheskaya-fotometriya-vo-vremya-pma\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Волоконно-оптическая фотометрия во время PMA&lt;/span&gt;&lt;/a&gt;Волоконно-оптическая фотометрия во время PMA&lt;/h4&gt;\n&lt;p&gt;Животные привыкали к оптическому шнуру за 1 день до регистрации сигналов. Во время обучения и воспроизведения PMA мы одновременно регистрировали флуоресценцию GCaMP6s и контрольную флуоресценцию в BLA с помощью коммерческой системы волоконно-оптической фотометрии и сопутствующего программного обеспечения Synapse, управляющего синхронным детектором RZ10x (Tucker David Technologies). Две длины волны возбуждения (465 и 405 нм) модулировались на частотах 211 и 566 Гц, фильтровались и объединялись флуоресцентным миникубом (Doric Lenses). Объединенный свет возбуждения подавался через сердцевину диаметром 400 мкм с числовой апертурой 0,37; низкофлуоресцентный сигнал собирался через миникуб и фокусировался на фотоприемник фемтоваттного диапазона (Newport, модель 2151, коэффициент усиления установлен на DC LOW). Мощность светодиодов была настроена таким образом, чтобы система получала 8- и световые единицы для каналов 465 нм и 405 нм соответственно. Флуоресценция дискретизировалась с частотой 1017 Гц и демодулировалась процессором. Временные метки начала и окончания эксперимента, а также начала каждого тона собирались с помощью транзистор-транзисторных логических (TTL) импульсов, отправляемых из пользовательского конструктора экспериментов MATLAB (MathWorks). Сигналы сохранялись с помощью программного обеспечения Synapse и экспортировались в MATLAB для анализа.&lt;/p&gt;\n&lt;h4 id=\"analiz-volokonno-opticheskoj-fotometrii\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#analiz-volokonno-opticheskoj-fotometrii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ волоконно-оптической фотометрии&lt;/span&gt;&lt;/a&gt;Анализ волоконно-оптической фотометрии&lt;/h4&gt;\n&lt;p&gt;Данные фотометрии подвергались предварительной обработке с использованием специально написанного конвейера в MATLAB. Перед анализом сигнал подвергался понижающей дискретизации в 10 раз. С помощью функции polyfit изосбестический сигнал аппроксимировался к сигналу 405 нм, и эта кривая вычиталась из канала 465 нм. Для сопоставления волоконно-оптической фотометрии и поведенческих данных была создана таблица подгонки с использованием линейной интерполяции между каждым TTL-импульсом, чтобы определить, какие кадры поведения соответствуют кадрам фотометрии. Z-оценки рассчитывались с использованием периода исходного уровня от -5 до 0 с относительно начала тона. Рассчитывалось и использовалось для анализа среднее значение всех треков для отдельного животного. Для построения графиков каждый усредненный трек сглаживался путем усреднения значений каждые 0,5 с, при этом отображались среднее значение ± стандартная ошибка среднего сглаженных треков по животным. Для ответа на шок площадь под кривой (AUC) и пиковая z-оценка количественно оценивались в течение 0–15 с и 0–3 с после начала соответственно. Скорость затухания измерялась путем подгонки экспоненциальной кривой от пикового ответа на шок, затухание количественно выражается как 1/τ.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Z-оценка стандартизирует уровень сигнала относительно исходного фона, а AUC (площадь под кривой) суммирует общую интенсивность ответа во времени.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"optogeneticheskaya-manipulyaciya-vo-vremya-pma\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#optogeneticheskaya-manipulyaciya-vo-vremya-pma\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оптогенетическая манипуляция во время PMA&lt;/span&gt;&lt;/a&gt;Оптогенетическая манипуляция во время PMA&lt;/h4&gt;\n&lt;p&gt;Перед всеми экспериментами мыши привыкали к оптическому шнуру (сердцевина 200 мкм, 0,22 NA, Doric Lenses). Никаких оптогенетических манипуляций во время воспроизведения PMA или первых трех базовых тонов обучения не проводилось. Для экспериментов по ингибированию проекции vmPFCCRH+ к BLA фотоингибировались синим лазером (473 нм, постоянный; SLOC Lasers), управляемым приложением MATLAB для исследователя экспериментов по выработке страха BehaviorDEPOT, во время периода шока и в течение 13 с после окончания шока (всего 15 с). Это было выбрано на основании результатов массовой фотометрии, показавших, что у мышей с LBN наблюдалась повышенная активация в BLA в ответ на шок в этот период. Подаваемая мощность света, измеренная через имплантируемое оптическое волокно, была установлена на выходное значение 10 мВт света. Для экспериментов по стимуляции проекции vmPFCCRH+ к BLA фотовозбуждались синим лазером (473 нм, 15 Гц, ширина импульса 50 мс; SLOC Lasers) с той же мощностью света.&lt;/p&gt;\n&lt;h4 id=\"optogeneticheskaya-manipulyaciya-v-otkrytom-pole\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#optogeneticheskaya-manipulyaciya-v-otkrytom-pole\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оптогенетическая манипуляция в открытом поле&lt;/span&gt;&lt;/a&gt;Оптогенетическая манипуляция в открытом поле&lt;/h4&gt;\n&lt;p&gt;На следующий день после воспроизведения PMA животные адаптировались в течение 10 минут в отдельном помещении. После подключения к синему лазеру (ингибирование: 473 нм, постоянный; стимуляция: 473 нм, 15 Гц) мышей помещали в арену «открытое поле». Оптогенетическая манипуляция начиналась после 1-минутного базового периода, за которым следовало восемь чередующихся 30-секундных эпох включения/выключения лазера, и завершалась 60-секундным периодом без стимуляции общая продолжительность сеанса составляла 10 минут.&lt;/p&gt;\n&lt;h4 id=\"analiz-vsego-mozga\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#analiz-vsego-mozga\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ всего мозга&lt;/span&gt;&lt;/a&gt;Анализ всего мозга&lt;/h4&gt;\n&lt;p&gt;Конвейер анализа DeepCOUNT DeepCOUNT79 использовался для выравнивания и количественной оценки плотности клеток по всему мозгу. Кратко: стеки изображений всего мозга из канала 640 нм каждого мозга сегментировались в TrailMap с использованием модели, обученной на Ai14. Изображения регистрировались с шаблонным мозгом с помощью elastix и transformix по каналу автофлуоресценции 488 нм. Для определения 3D-максимумов трансформированной карты вероятностей использовался MATLAB (Mathworks). Анализ связанных компонентов применялся для сокращения любых максимумов, состоящих из нескольких пикселей, до одного пикселя на клетку.&lt;/p&gt;\n&lt;h4 id=\"kolichestvennaya-ocenka-kletok\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#kolichestvennaya-ocenka-kletok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Количественная оценка клеток&lt;/span&gt;&lt;/a&gt;Количественная оценка клеток&lt;/h4&gt;\n&lt;p&gt;Плотность клеток CRH+ в регионах количественно оценивалась в MATLAB путем подсчета числа меченых пикселей (т. е. клеток) в каждой области мозга с последующим делением этого числа пикселей на общее число пикселей в области. Регионы определялись с помощью уплощенной версии атласа LSFM, в которой максимальная гранулярность сбалансирована с необходимостью учета небольших различий в регистрации, которые привели бы к неточной количественной оценке небольших областей мозга. Этот атлас был обрезан на переднем и заднем концах в соответствии с количеством ткани, видимым в наших данных. Тракты белого вещества, желудочковая система, мозжечок и обонятельная луковица были исключены из анализа. Для статистического анализа мы сосредоточились на регионах, которые, как известно, проецируются на BLA и содержат популяции клеток CRH+. Для выявления значимых различий между областями мозга выполнялся двухфакторный дисперсионный анализ с повторными измерениями (ANOVA) с поправкой на множественные сравнения post-hoc.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Двухфакторный ANOVA с повторными измерениями — это статистический метод для оценки влияния двух факторов на один и тот же объект в разное время или в разных условиях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"optogeneticheskaya-manipulyaciya-vo-vremya-testa-predpochteniya-mesta-v-realnom-vremeni\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#optogeneticheskaya-manipulyaciya-vo-vremya-testa-predpochteniya-mesta-v-realnom-vremeni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оптогенетическая манипуляция во время теста предпочтения места в реальном времени&lt;/span&gt;&lt;/a&gt;Оптогенетическая манипуляция во время теста предпочтения места в реальном времени&lt;/h4&gt;\n&lt;p&gt;Чтобы определить, влияет ли оптогенетическая манипуляция проекциями vmPFCCRH+ на поведение помимо PMA, тесты RTPP проводились на следующий день после извлечения PMA для всех оптогенетических экспериментов. После подключения к синему свету (торможение: 473 нм; постоянный; стимуляция: 473 нм; 15 Гц) мышей помещали в камеру предпочтения места (68 см × 23 см) на 20 мин. В течение первых 10 мин базового периода мышам разрешалось свободно исследовать аппарат, а программное обеспечение BioViewer использовалось для отслеживания движений и определения того, какую половину камеры они предпочитают. Это использовалось для определения того, какая половина камеры будет получать лазерную стимуляцию или торможение. В течение следующих 10 мин лазерный свет подавался на предпочитаемую сторону камеры (стимуляция) или на непредпочитаемую сторону (торможение). Результаты рассчитывались как процент изменения по сравнению с исходным уровнем (тест - база / база × 100). Доступность кода и данных. Все данные, представленные в этой статье, будут предоставлены ответственным лицом по запросу. BehaviorDEPOT, используемый для анализа поведенческих данных, доступен по адресу https://github.com/DeNardoLab/BehaviorDEPOT. DeepCOUNT, используемый для анализа плотности клеток всего мозга, доступен по адресу https://github.com/DeNardoLab/DeepTraCE. Весь остальной исходный код был размещен на Github и находится в общественном доступе на дату публикации. Любая дополнительная информация, необходимая для повторного анализа данных, представленных в этой статье, предоставляется ответственным лицом по запросу.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;детский стресс&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;и
